t:2026-10-27T21-28:f4c3baead872", "kind": "post", "title": "2026-10-27 21:28", "source_label": "帖子正文", "excerpt": "10只PCB产业链上市公司集体发布三季报，南亚新材、金安国纪第三季度净利增长超10倍。", "content": "", "publish_time": "2026-10-27 21:28", "tags": ["文字观点"]}, "post:2026-10-27T15-32:a8daea9663e3": {"id": "post:2026-10-27T15-32:a8daea9663e3", "kind": "post", "title": "2026-10-27 15:32", "source_label": "帖子正文", "excerpt": "10月27日复盘笔记：人形机器人/零售/食品饮料/智能驾驶/AI应用/旅游/冰雪经济/电网设备等一、重磅财经信息①1-9月份规模以上高技术制造业利润同比增长52.0%。", "content": "", "publish_time": "2026-10-27 15:32", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-27T12-46:39141135a216": {"id": "post:2026-10-27T12-46:39141135a216", "kind": "post", "title": "2026-10-27 12:46", "source_label": "帖子正文", "excerpt": "Anthropic IPO速览：收入高增盈利拐点显现 📌核心结论：营收爆发、算力成本率下行实现经营盈利转正；增长依托高NRR、云渠道、Claude系列Agent，招股前沿赛道叙事保守，锁定期采用阶梯释放。", "content": "Anthropic IPO速览：收入高增盈利拐点显现 📌核心结论：营收爆发、算力成本率下行实现经营盈利转正；增长依托高NRR、云渠道、Claude系列Agent，招股前沿赛道叙事保守，锁定期采用阶梯释放。 一、财务：盈利拐点兑现 2025年收入45.9亿美元；2026Q1/Q2收入47.3/115.6亿美元，Q2环比+144%，H1合计162.9亿美元（为2025全年3.5倍）。 2026Q2 GAAP经营利润率8%，调整后19%；收入结构按量计费80%、订阅20%，海外收入占28%。 算力成本率由2025Q1 251%降至2026Q2 48%；H1大额GAAP净亏损来自优先股公允价值变动，为非现金项；2025年云渠道佣金率估算约16%。 二、客户渠道：客户扩容、集中度下行 年消费>10万美元客户1.19万家，>100万美元客户1900+家，>1000万美元客户250家。 2026Q3前五大客户收入占比21%（Q1为36%），最大单一客户占比\u003c10%。 H1云Marketplace渠道收入占比48%（2023年仅11%）；差异化优势聚焦法律、金融、生命科学等强监管行业。 三、算力：大额长单锁定供给 截至2026年6月，不可撤销算力采购承诺约2450亿美元，TPU/GPU双线布局，AMD MI450预计2027年交付；合约存在交叉，不可简单加总，刚性算力开支为重要约束。 四、产品叙事：Agent为主，前沿方向克制 Opus 5.5单任务成本较前代降40%；增长主线为Claude Code、Claude Cowork，公司内部超90%代码由模型辅助编写。 招股未将具身智能、图像视频生成、EDA、独立网络安全、FDE作为商业化主线；AI for Science仅聚焦药企申报文档场景。 五、IPO机制：阶梯锁定期 不采用传统180天一次性解禁，分阶段释放存量股份，筹码供给平滑，弱化新股稀缺带来的定价失真。 风险提示：算力长单刚性压力；企业预算收缩影响Token用量与NRR；监管行业落地偏慢；竞品追赶。#文字观点", "publish_time": "2026-10-27 12:46", "tags": ["文字观点"]}, "post:2026-10-27T13-04:de13033084a6": {"id": "post:2026-10-27T13-04:de13033084a6", "kind": "post", "title": "2026-10-27 13:04", "source_label": "帖子正文", "excerpt": "野村——亚洲科技｜AI半导体与服务器：AI数据中心建设追踪——较前期进一步上修，但融资成本抬升，风险收益比趋于中性 核心判断：野村对其全球新建AI数据中心跟踪框架进行2026年10月更新，结论由前期的“积极低吸”转向“上修需求、但风险收益比中性化”。AI基建周期并未在2027年终止，但股价赔率较20", "content": "野村——亚洲科技｜AI半导体与服务器：AI数据中心建设追踪——较前期进一步上修，但融资成本抬升，风险收益比趋于中性 核心判断：野村对其全球新建AI数据中心跟踪框架进行2026年10月更新，结论由前期的“积极低吸”转向“上修需求、但风险收益比中性化”。AI基建周期并未在2027年终止，但股价赔率较2023—2025年超级牛市明显压缩。 需求端继续上修：基准情景下，全球新增算力部署预测由前期2026年27GW、2027年32GW、2028年23GW，上修至2026年26GW、2027年40GW、2028年28GW；若计入SpaceX/xAI与Broadcom电话会中披露的激进指引，2027—2028年潜在需求可进一步抬至49/46GW量级。项目池覆盖51个GW级项目，美国占近半；传统四大云厂商约占31%，新云与转型算力运营商约占26%，主权AI占30%。测算对应每年数百万至千万级AI芯片需求，持续拉动先进封装与服务器供应链订单。 供给与瓶颈：绿地产能自2025年末启动，但放量时点集中在2028年后；2026—2027年仍处“缺产能、缺电力、缺配套”阶段。瓶颈不止于GPU与CoWoS，正向电力设备、液冷、载板、PCB、光互连外溢，产业链涨价与盈利上修仍是核心催化，但执行分化加剧。 融资端与信用风险：超大规模云厂自由现金流不足以覆盖资本开支上行，债务扩张进入快车道。2026年长债净增创纪录，信用利差走阔，SpaceX新发债尾部收益率约8.3%（高于6月6%），CoreWeave二级债收益率一度飙至约15%。云厂暂停回购、重启股权融资，backstop（兜底担保）规模截至2026年二季度达2167亿美元，英伟达单一敞口1085亿美元。模式本质为“厂商给客户融资、客户买厂商产能”，类似思科/朗讯互联网泡沫前期结构，但整体融资/GDP仍低于次贷与科网峰值。 投资含义： 1. 周期未结束，但进入“后期加速段”——短缺仍在，股价却已透支部分乐观预期； 2. 指数层面估值未极端（SOX约18倍、台湾半导体除台积电约14倍），盈利上修可重启行情，但波动率与信用敏感度上升； 3. 关键变量从“算力需求”切换为“ARR变现率（OpenAI/Anthropic）+ 融资成本 + 2028年可见度”； 4. 选股优于择时：执行力强、产能锁定、现金流优质的代工/封测/光模块/电力链占优，弱信用新云与高杠杆项目承压。 后续催化剂：Anthropic/OpenAI ARR再加速、云厂2027—2028 capex指引、美债曲线回落、盈利一致预期继续上修。 风险：电力审批不及预期、项目延期/取消（Stargate部分节点已现反复）、信用市场抛压、ROI证伪、2028年供给释放后供需拐点前移。#文字观点", "publish_time": "2026-10-27 13:04", "tags": ["文字观点"]}, "post:2026-10-27T07-23:b269f76016c3": {"id": "post:2026-10-27T07-23:b269f76016c3", "kind": "post", "title": "2026-10-27 07:23", "source_label": "帖子正文", "excerpt": "盘前热点事件 一、昨日热点 机器人：赛福天、多伦科技 消费：上海九百 数据要素：延华智能 二、美股芯片股普涨 科技股全线回暖 美股芯片股普涨，科技股全线回暖，费城半导体指数收盘上涨 2.8%，为一个月来最大涨幅。半导体：华虹宏力、中芯国际、寒武纪 存储：长鑫科技、普冉股份、德明利 光通信：中际旭创、", "content": "盘前热点事件 一、昨日热点 机器人：赛福天、多伦科技 消费：上海九百 数据要素：延华智能 二、美股芯片股普涨 科技股全线回暖 美股芯片股普涨，科技股全线回暖，费城半导体指数收盘上涨 2.8%，为一个月来最大涨幅。 半导体：华虹宏力、中芯国际、寒武纪 存储：长鑫科技、普冉股份、德明利 光通信：中际旭创、新易盛、东山精密 三、Anthropic 计划在 11 月 16 日当周进行 IPO Anthropic 是全球稀缺的独立闭源基础大模型 API 厂商，市场估值 1.5 万亿–2 万亿美元。 Anthropic 在 IPO 文件中表示，随着公司持续扩建算力及基础设施，资本开支预计将大幅增长。 大模型：智谱 AI、MiniMax（港股通） AI 智能体：泛微网络、南兴股份 四、腾讯绿泡泡短剧小程序月活过亿 即梦 AI 短剧工作室上线 根据 QuestMobile 的数据，截至今年 8 月，腾讯绿泡泡短剧小程序月活跃用户规模已过亿级，达 1.43 亿。 10 月首周周活跃用户达 8968 万，较 9 月首周提升 44.1%。 自 7 月正式更名以来，该产品周活跃用户规模约三个月内逼近 9000 万。 10 月 26 日，字节跳动旗下即梦 AI 正式推出即梦短剧工作室，提供自研剧本模型 DreamScript、图片模型 Anycook、分镜模型 DreamShot，把剧本、图片、分镜、后期、本地化重制整合到同一个创作平台里。 短剧：欢瑞世纪、德才股份、龙版传媒、掌阅科技、中文在线 五、多所高校将通过数字人民币发放工资 近日，多所大学发布相关通知，学校在职在编人员工资将通过数字人民币钱包发放。 扬州大学财务处 10 月 20 日发布通知，接省财政厅预通知，自 2026 年 11 月起，学校在职在编人员（含人事代理）工资将通过数字人民币钱包发放。 南通大学财务处发布《关于做好数字人民币钱包开通及 11 月份工资数币发放工作的通知》，接省财政厅通知，自 2026 年 11 月起全校在编人员、人事代理人员工资将通过数币钱包发放。 江苏师范大学记财处发布《关于统计报送数币钱包信息的通知》，我校将稳步推进在职人员工资数字人民币发放工作。 数字货币：恒宝股份、楚天龙、翠微股份、御银股份、四方精创 六、行业要闻 1、大众汽车集团已在合肥正式获得 L3 级自动驾驶道路测试牌照。（大众交通、锦江在线） 2、《上海市卫星互联网产业创新发展行动方案（2027–2030 年）》印发。（上海沪工、上海瀚讯） 3、我国成功完成 3.2 Pb/s（拍比特每秒）多芯光纤实时双向传输试验，1 秒能下 2 万余部 4K 电影。（烽火通信、长飞光纤） 4、10 月 26 日至 28 日，CPE2026 国际算电协同产业大会将在上海世博展览馆启幕。（华电辽能、华银电力） 5、SK 海力士计划于 10 月 28 日三季度业绩发布当日，同步公告 50 万亿至 60 万亿韩元（约合 380 亿至 450 亿美元）的额外股东回报计划。（长鑫科技、普冉股份） 6、人民银行宣布设立债市非银大额赎回互换便利 (BNSF)。#文字观点", "publish_time": "2026-10-27 07:23", "tags": ["文字观点"]}, "attachment:files/AI影视产业链深度跟踪：字节视频模型迭代与投资机会20261025.pdf": {"id": "attachment:files/AI影视产业链深度跟踪：字节视频模型迭代与投资机会20261025.pdf", "kind": "attachment", "title": "AI影视产业链深度跟踪：字节视频模型迭代与投资机会20261025", "source_label": "其他", "excerpt": "AI美国调研感受：泡沫还是错判？欧洲的动荡-乱局是不是常 态？", "content": "AI美国调研感受：泡沫还是错判？欧洲的动荡-乱局是不是常 态？20261025 要点总结 1.欧洲债务问题的核心已从边缘国家转向法国自身：希腊、意大利等此前财政压力较高的国家当前并 非市场担忧来源，法国的问题叠加了右翼选举、社会动荡与财政压力三重因素，但短期仍局限在有限范 围内，暂不构成\"欧债危机2.0\"的判断。 2.零利率时代掩盖了财政纪律问题，利率正常化后分化加剧：过去负利率环境下高存量债务问题被掩 盖，如今利率抬升叠加存量债务高企形成双重压力；但各国期限结构较长（7-10年），高利率对存量 债务的侵蚀是渐进的，后续变数在于分母端（GDP与财政收入）能否改善。 3.日本长端利率上行幅度最大，但国内机构配置回流形成支撑：日本国债供给面可控，国内金融机构 （如养老金）对本国债券配置比例已从25%升至27%，明年可能升至30%，形成趋势性支撑。 4.美国通胀韧性来自服务端而非商品端，支持继续加息判断：商品通胀对核心通胀贡献约0.6个百分 点，未来12个月窗口有望回落至0-0.5；但占三分之二的服务通胀因需求改善可能从3%多回升至 3.5%，核心通胀或维持在2.7%-2.8%，2.5%可能是新的通胀均衡水平。 5.大类资产维持风险资产超配，黄金中期看多但短期有实际利率波动风险：对权益（除信用债）和房 地产维持超配；黄金短期受实际利率波动扰动，但央行购金力量（2022年3月以来上台阶）持续提供 支撑，模型显示当前金价相对均衡水平仍有约17%-18%的低估，均衡价位看5000美元。 6.AI叙事从\"顺畅传导\"转为\"方向收敛但账算不清\"：3月coding场景突破带来ARR加速的清晰逻 辑，10月模型厂方向收敛至智能体（扩参数+长程任务后训练），但能力提升如何量化、场景深度如何 落地、商业化如何再加速的传导链条不清晰，这是资本市场视角转冷的主因，产业本身仍如火如荼。 7.算力供给紧张将持续较长时间，且研发侧挤占商业化算力：模型厂将内部研发算力优先级调高（10T 以上预训练、智能体后训练、RSI竞赛），压制对外商业化可用算力；Meta的Muse智能体对全量用 户用小参数模型、高端用户才用大模型，本质是算力不足所致。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 8.需求侧未被充分满足，企业市场渗透仍处早期：北美产业界普遍认为\"有算力就能做商业化\"；大企业 CIO调研谨慎存在样本偏差，大量中型及中小微长尾市场完全未触达，SaaS公司财报尚未真正加速印 证渗透早期。 9.硬件端边际变化弱于模型端，明年电力瓶颈担忧大于Rubin本身：存储、光互联、机柜电源结构升 级等主线方向未变，产业界对Rubin需求不担心（模型仍在变大，需更好卡和更高带宽），但更担心 明年电力问题。 10.CSP财报季或\"不温不火\"，关键看云加速与OPmargin能否收窄剪刀差：云加速是市场共识， 但季度绝对增速难判；若云加速叠加OPmargin上行，将缓解capex与云收入之间的剪刀差，改善明 年现金流预期，但大厂指引多要等四季报，本季财报反应可能分化。 11.A股策略：情绪底已现，季度尺度更积极：9月见底判断偏乐观，10月税收政策与油价/大类资产 对新兴市场的冲击超预期；但成交额萎缩至1.4万亿下不去、ETF流入、回购增加、三季报环比加速与 估值水平均不支持继续悲观，季度尺度转向更积极。 问答整理 Q1：欧洲债务问题当前市场真正担心的是什么？法国的情况与当年欧债危机有何区别？ 答：市场当前担心的不一定是债务本身，短期更多受政治动态影响，中期风险相对更高，但市场尚未开 始交易这一逻辑。法国债务率虽已升至120（00年代在70左右），但相比当年希腊等国仍不算极端。 另一个区别是成员国与欧盟的关系：即使是勒庞，表面上与欧盟仍可谈，不像英国脱欧时全国要离开欧 元区。我们作为曾喊了十几年\"应退出欧元区\"的机构，现在对欧元区的看法已比过去积极，园区内部也 很少有人拿退出做文章。梅洛尼上台后从非主流到不那么非主流，勒庞可能沿类似路径。大选前波动性 会较大，但临近或大选后市场可能发现勒庞其实没那么非主流。区别在于梅洛尼有多数党派席位，勒庞 大概率没有，要么联合政府（可能性较低），要么总理与总统来自不同党派（类似当年\"共治\"），后者 对市场反而可能是好事——意味着勒庞不可能乱来，spread可能反而收敛。但无论哪届政府，法国社 会改革的政治成本只会更高，形成死循环。（vx:362336789） Q2：法国国债spread近期变化中，多少来自财政担忧、多少来自政治动荡？短期是否有反转 可能？ 答：市场开始正常看待法国财政问题，而非自动标签为核心国家，这是正常化行为，法国相对偏贵的定 价很难回到以前。但短期可能有点过头，例如法国对意大利国债的利差收窄即是信号。短期反转的触发 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 点可能是未来一两个月法国预算方案能否落地——若勒庞认为对其后续授权有利，可能放弃与现政府对 抗，对市场是利好。后续可通过spread是否回落来后验判断：若spread下行较多，说明此前上行是 市场重新审视财政问题，则再度走阔的可能性较小。 Q3：零利率时代掩盖的财政问题在利率正常化后是否会导致长端国债普遍失控，包括美日 德？ 答：确实以前低利率掩盖了所有问题，现在利率上来后本来有问题的国家问题显现，但问题不大的国家 不见得会一起被拖累。德国债务率是从很低位置起来的，关键看分母端能否起来——若德国经济真的变 好（目前主要是国防预算较强），可以cross其他区域；但德国也有实施阻碍（如replace相关事项） 和国内监管政治问题。分化会更明显：对美国相对乐观，欧洲尤其德国另当别论。欧洲整体看，日本债 务率也有所降低，日本长端利率终于起来、名义增长也有所抬头，不见得是大问题。经济分化在分母端 提供了抵消财政压力的机会——若以美国为代表，财政收入/GDP/产业能起来，国债并非需要那么悲 观。此外几乎所有发达国家存量债务期限较长（7-10年），高利率对长期债务的侵蚀是渐进的，后面 变数来自分母，若给五年十年可能有反转机会。但欧元区因能源问题更像\"有通胀但增长不行\"，美国则 是\"有增长也有通胀\"，欧洲需要看到既有通胀又有增长的情况。 Q4：日本长端国债收益率上行幅度最大，财政扩张与日元贬值压力下如何看日债？ 答：我们认为日本国债供给面能止住其短暂上行，日债在汇率上还有一些空间。更重要的是日本国内金 融机构出现新趋势——配置本国债券比例上升，例如日本养老金对本国债券的配置已从25%升至 27%，年底到27%，明年可能上调至30%。过去零利率/负利率时代大量配置放在海外，现在国内机构 慢慢多配国内债已形成趋势，金融机构相比之下还有余量，存在配置空间。（vx:362336789） Q5：油价走高、加息预期回落、美债长端先涨后跌、黄金调整，大类资产的核心矛盾将如何 演绎？ 答：若把9月加息与中东局势带来的油价上行挂钩，意味着加息不会连续；但我们认为会连续，我们是 全球唯一在5月还加息的机构，理由是内生性、结构性通胀压力更大。商品通胀对核心通胀贡献约0.6 个百分点，未来12个月窗口商品通胀会下行（成品油spread回落或原油价格回落），回到0-0.5的 贡献率，前提是局势缓解，12月是较充分的时间窗口。另外三分之二来自服务通胀，我们认为需求在 改善、经济韧性可能变好，服务通胀可能从3%多的低位回到3.5%，对核心通胀贡献约2.2-2.5个百分 点，加上商品部分，核心通胀很容易超过2%，我们认为最少2.7%-2.8%。2.5%可能是未达标前可接 受的范围，也是疫情后这几年新的通胀均衡水平（不止美国，其他国家也维持在2以上）。与原油关系 有但不大，若12月后恢复很慢、成品油spread持续很厚，二次效应会更明显。大类资产上，因看需 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 求变好，对风险资产（除credit外）维持超配，对房地产也超配。黄金短期来自实际利率波动的风险 仍存，这一段可能尚未完全释放；若利率加到4.5%-4.15%状态后出现问题，黄金方向会更确定。黄金 大趋势向好，但等更好买点或拐点可能更佳。我的黄金模型显示当前金价相对均衡水平仍有约17%- 18%的低估，均衡价位看5000美元，支撑主要来自2022年3月上台阶的央行购金力量，假设储备多 样化需求不变，每月都会提供新的支撑。 Q6：3月到10月三次美国调研，AI叙事和资本市场视角发生了什么变化？ 答：3月回来投资界很热，因为AI叙事非常顺畅：Anthropic率先在coding场景突破，其他厂商快速 收敛到头部，全产业coding能力爆发，codingagent出现（如OpenAI相关产品），代码能力从去 年的代码补全变成今年几万行代码输出，场景突破落到O和A的商业化上体现为ARR加速。到10 月，产业仍在加速（8月能看到RSI趋势，产业界很兴奋），但资本市场视角变得没那么清晰：几个模 型厂（一梯队、二梯队）方向都收敛到智能体，研发上看得很清楚——扩参数、用长程任务数据做后训 练，本质是解决智能体任务深度问题；但收敛后带来什么能力提升、如何量化、场景深度能做到多深、 商业化如何再加速，传导逻辑不顺畅。场景本身不迷茫，但大家算不清楚账。模型往10T参数堆、RSI 加速迭代，技术上有可能出现破坏式创新，但跃迁式变化无法预期，类似15年前移动互联网刚出来时 也想象不到最大机会是智能手机、游戏和短视频。 Q7：产业界如何讨论现金流与capex压力，尤其是neocloud的融资压力？ 答：产业做技术的人直接回答不了现金流问题，我们从供需两维度看。供给端算力非常缺，且紧缺可能 持续较长时间。这次与8月不同之处在于：几家模型厂在战略上把内部研发算力分配优先级调得更高— —一是更大规模预训练奔10T以上参数（北美共识，一梯队二梯队都在走）；二是后训练做智能体深 化更耗算力（任务更长）；三是RSI竞赛各家都在赶。研发侧关注度更高会挤占更多算力资源，也压制 可用于对外商业化的算力，这也是多头\"算力不够所以ARR才放缓\"的逻辑。需求端北美产业界不太担 心，专家普遍感受是只要有足够算力做商业化，ARR很容易做起来，需求未被充分满足。具体例子： Meta财报业绩会讲Muse个人智能体，现在用的是小参数模型，并非小模型已足够好用——大参数模 型依然好很多，但算力不够无法对全量用户开放几个T的大模型，所以采取阶段性商业化策略：全量用 户用低端版本免费，高端模型对高端用户开放收更多钱（如API收费）。企业侧，此前外资行对CIO 的访谈引发担心（500强企业明年AI支出谨慎、token消耗设上限），但这存在样本偏差——大企业 科、华依科技、 中海达。 2、钢铁成本： 普钢同质化明显，销售端难有溢价，成本差距才是钢企盈利差距的核心：先天 看禀赋，沿海沿江钢企矿焦运费更低、可近地销售；后天看管理，灵活机制加硬约束让降本 持续推进。当前钢铁行业步入底部，成本领先的龙头构筑超额利润，估值处于周期底部，有 望率先迎来重估，还有底气借并购逆势扩张。关注：南钢股份、华菱钢铁、宝钢股份、首钢 股份、方大特钢、中信特钢。 3、AI消费电子： 大模型算力投入持续攀升，单靠订阅和 API难以覆盖，超万亿美元的消费电 子市场成为新的商业化方向，模型厂向下做硬件、终端厂向上做 Agent，终端入口之争已经开 打。2026年海内外大厂密集发布可跨应用执行任务的 Agent，系统级 Agent进入规模化落地初 期，AI终端叠加硬件与订阅两套盈利模式。 OpenAI首款设备已进入工程验证阶段，预期年销 量超500万台， 26Q4至27年端侧催化密集， 27Q1前后是爆品出现的关键节点。存储压力边际 缓解，板块估值与筹码处于相对低位。关注：立讯精密、瑞芯微、传音控股。 4、AI影视： AI影视已跨过商业化临界点，是大模型 C端最快规模化的应用形态。今年视频模 型两轮迭代后，角色一致性、音画同步和长时生成接连突破， AI漫剧每分钟制作成本从近 1.5 万元降到约 1500元，AI短剧实现对真人短剧的流量超车，市场规模翻倍至约 400亿元。制作门 槛下降推动供给爆发，但行业利润不会平均增长，产业链价值正向优质 IP、持续爆款能力和 平台分发渠道集中，商业化沿短剧先兑现、中长剧提价值、电影看弹性的路径递进。关注芒 果超媒、昆仑万维、中文在线、上海电影。 正文： 1、从姿态控制配角到数采成本主角，订单比人形机器人本体先到， IMU正在被 重新定价 国盛证券指出，人形机器人迈向量产，竞争重心从硬件转向智能决策，高质量物理交互数据 短缺成为具身智能落地的核心约束。具身数据无法照搬互联网文本的获取方式，采集难度 大、成本高、标准化难，数采硬件的需求先于本体量产释放。 芯动联科 、华依科技 、中海达 等上游器件与 IMU厂商值得关注。 1）具身智能卡在数据上，物理交互数据不足大模型两万分之一   行业正由样机技术验证迈向规模化量产阶段，特斯拉 Optimus 等头部厂商持续推进量产落地， 商业化预期不断强化。随着本体硬件技术路线逐步收敛，行业竞争重心从硬件性能打磨，转 向机器人智能决策、自主泛化能力的比拼，具身智能模型成为拉开产品能力差距的核心。 不同于大语言模型可依托海量互联网文本数据训练，具身智能所需的运动、操作、环境交互 数据采集难度大、成本高、标准化难度高。 截至2026 年初，全球合规可用的真实物理交互数 据总量仅约 50 万小时，不足大语言模型训练数据的两万分之一。 高质量物理数据短缺，制约 模型迭代与行业规模化落地。 2）主流动作捕捉走惯性路线，四项优势绕开场地与光照 数据采集与本体感知是获取物理交互数据集的两大基础环节。数采层依托多传感器记录人类 操作示范动作，先让人做一遍，再让机器照着学；感知层是机器人本体的感知入口，通过视 觉、激光雷达、力触觉传感器与 IMU 协同，为环境交互与闭环运动控制提供实时反馈信号。 在动作捕捉路线上， 惯性动捕方案具备场地约束小、动作自由度高、不受光照环境干扰、硬 件成本较低四项优势，是当前主流的动作捕捉路线。 3）IMU是数采硬件的成本变量，一颗不够就加到十几颗 具身模型训练需要视觉、位姿、运动状态等多模态信息融合：摄像头负责采集环境视觉信 息，IMU 实时输出三轴角速度与三轴加速度数据，经过姿态解算即可得到物体的横滚、俯仰、 航向姿态信息，补偿视觉数据中的任何暂时性缺失。 IMU也是数采硬件 BOM 的核心成本变量，价值量弹性来自单颗规格升级与单机搭载数量提升 两个方向。 高密度动捕手套案例中 IMU 物料成本占比可达 75% ，国产化降本空间显著。 多节点动捕方案普及，把单机搭载量推了上去。 Xsens MVN Link 全身动捕系统配置 17 颗惯性 传感器，诺亦腾 PN Studio 双手动捕手套共配置 12 颗。 4）数采订单比本体更早兑现，国产化窗口就在当下 IMU应用场景持续拓展，广泛用于机器人姿态控制、智能驾驶导航、具身智能数据采集等领 域。高性能 MEMS 惯性器件技术壁垒较高，高端市场长期由海外厂商主导。 相较于人形机器人本体量产尚需时间，数采硬件属于模型训练阶段的前置投入，需求释放节 奏更早；数采设备采购与部署规模持续扩大， IMU 产业链厂商有望优先受益于订单增长。 国产化已经有落地样本，国产 IMU 在头部数采客户的数采设备上实现批量供货，商业化突破已 经发生。 相关公司 上游器件 ：芯动联科 （高性能 MEMS 惯性器件） IMU环节：华依科技 （配套觅蜂科技 MEgo 系列数采设备批量供货）、 中海达 2、从处于底部的钢铁行业中寻找 alpha ：成本优势构建超额利润，这些公司甚 至开始底部扩张 长江证券指出了一条钢铁行业底部寻找阿尔法的思路：普钢同质化明显，销售端难有溢价， 成本差距才是钢企盈利差距的核心。 近期，市场呈现 “ 成本托底、需求承压 ” 的僵持格局。后续来看，伴随供需矛盾渐有累积，叠加 钢企盈利筑底，利润压缩的空间有限，原材料价格或逐步松动。 当前行业底部，成本领先的龙头有超额利润托底，也有底气逆势扩张，有望率先迎来重估。 关注：南钢股份 、华菱钢铁 、宝钢股份 、首钢股份 、方大特钢 、中信特钢 。 01   1）普钢同质化卖不出溢价，成本差距决定盈利差距 普钢产品同质化属性明显，在销售端形成溢价比较困难， 成本端的差异由此成为钢企盈利水 平差距的核心。 成本差距首先来自先天禀赋， 核心是区域位置：沿海沿江的钢企矿、焦运输成本更低，原料 到港后直接入厂，省下陆运费用；所处区域经济发达、用钢需求大，钢厂可实现近地销售， 进一步节省销售费用。 而在部分需求萎缩、产能过剩的区域，钢企需要把产品运到更远的地方销售，销售成本高 企。 其次来自后天管理。 降本是一项持续且艰苦的工作，行业充分内卷之下难度还在提升，需要 优异的管理机制作保障。机制灵活的部分民企和国央企，在有效激励下管理层和职工降本积 极性高，再以硬约束严控成本、严打跑冒滴漏、持续小改小革，让降本一步步落地。 2）成本领先的龙头，有底气在底部扩张 伴随钢铁行业步入底部，优质阿尔法龙头凭借成本、技术和精细化管理优势脱颖而出，构筑 显著的超额利润。经过深跌，优质龙头估值水平处于周期底部，性价比逐步凸显， 行业盈利 反弹之际有望率先迎来重估。 方大特钢 是沿海沿江的民营钢企，凭借灵活的机制和优秀的管理水平，实现生产成本全行业 领先；低成本优势在构筑底部利润的同时，让公司有底气在底部积极扩张。 公司近期发布重大资产购买报告书草案，拟以实物分配及现金购买方式取得江西方大钢铁集 团企业投资有限公司 100% 股权；交易完成后，四川德胜钒钛与云南德胜钒钛将成为控股孙公 司，打开中期成长空间。 底部布局上，产品结构高端、受益于成本宽松的钢企有 南钢股份 、华菱钢铁 、宝钢股份 、首 钢股份；受益于并购量增预期的有 方大特钢 、中信特钢 ；优质加工龙头 久立特材 、甬金股 份。 3、大厂必争的流量入口，超万亿的消费电子市场成为 AI 商业模式新叙事， 27Q1前后将是端侧 AI 爆品关键节点 大模型的算力投入持续攀升，单靠订阅和 API 收入难以覆盖， 超万亿美元规模的消费电子市场 成为模型厂寻找新商业化场景的重要方向 。招商证券判断，伴随智能体（ Agent ）应用逐渐成 熟，AI端侧入口价值正逐渐显现， 26Q4 至 27 年端侧催化密集， 27Q1 将是爆品出现的关键节 点，当前板块估值与筹码处于相对低位。北美大厂竞相布局 AI 终端，果链稀缺性进一步凸 显。关注： 立讯精密 、瑞芯微、传音控股 。 1）模型厂向下做硬件、终端厂向上做 Agent ，入口之争开打   大模型算力投入持续攀升，单靠订阅和 API 难以覆盖，超万亿美元的消费电子市场是模型厂的 新商业化方向。现有终端上， Agent 多以 App 形式运行在 iOS 和安卓之上，系统权限与分发规 则掌握在操作系统厂商手中，模型厂难以拿到完整的用户上下文，难以完成从需求到支付。 模型厂向下做硬件、终端厂向上做 Agent ，已成为大厂的共同选择。 OpenAI绕开手机、从 IoT 新形态切入，并以约 65 亿美元收购由前苹果首席设计官创立的 io公司，补齐量产、渠道与售后经验。 苹果握有超 25 亿活跃设备与支付体系，以 Siri AI 守住系统入口。 Meta 押注眼镜新入口， 云端Agent Muse 上线约 6 周美加用户即超 1000 万。谷歌以安卓生态分发 Gemini 为主。 国内大厂分成两派：华为、小米依托人车家终端做系统级 Agent ；字节、阿里、腾讯以 模型和应用生态切入，通过与终端厂合作或自推轻量终端争夺入口。 02 2）硬件卖一次、 AI 按月收，两套盈利模式叠加 传统消费电子主要靠卖硬件获利，云软件主要靠订阅和按量收费， AI 终端的特点是两套经济 模型同时存在。 03 商业化沿三个阶段演进。 短期看产品： 硬件销售为主、订阅开始验证，苹果 Siri AI 等依赖服务器模型的功能已设置每日 用量上限，更高额度需付费纳入订阅；录音卡 Plaud 以硬件叠加转写订阅，率先跑通这一模 式。 中期看入口： 谷歌为在三星手机预装 Gemini 按设备付费并分享广告收入， 模型能力越趋同 （部分因子需两年数据），拥挤评分可靠性较低。 网络设备：7只标的中5只位于最高十分位 • 高度拥挤：Arista（ANET）、Lumentum（LITE）、Coherent（COHR）、Ciena（CIEN）及思科（CSCO）均处顶部十分位。思科拥挤度自2024年末持续攀升，超出伯恩斯坦此前预期。 • 例外标的：康宁（GLW）自4月极度不拥挤升至6月极度拥挤后，当前回落至中位数附近（第4十分位），为覆盖范围内最不拥挤；天弘（Celestica, CLS）拥挤度自夏季峰值显著回落，当前为覆盖标的中第二不拥挤，但仍高于硬件/半导体均值。 重点标的投资含义与评级 • Celestica（跑赢，目标价520美元）：拥挤度回落提供更具建设性的布局窗口，尤其在其投资者日（Analyst Day）前夕，尽管高预期下估值倍数已压缩。 • Arista（跑赢，250美元）、Ciena（跑赢，440美元）、Lumentum（跑赢，1,220美元）、Coherent（跑赢，350美元）：维持跑赢评级，但需警惕拥挤度回撤风险。 • 苹果（跑赢，370美元）：高拥挤下，12月季毛利率与EPS不及预期或成短期负面催化剂，但长期消费AI入口逻辑不变。 • 闪迪（跑赢，3,000美元）：低拥挤+新长期协议（LTA）锁定价格下限与16.5亿美元财务担保，市场仍将其视为周期交易，存在预期差。 • 西部数据（跑赢，600美元）：高拥挤使其对头条风险敏感，但近期回调（资本开支担忧、东芝产能传闻）被视为买入机会。 • 希捷（跑赢，1,350美元）：当前首选标的，HAMR技术领先优势显著，2027年HAMR出货占比预计达70%（西部数据仅5%），近线产能售罄至2028年。 • 戴尔（跑赢，650美元）：AI服务器订单与积压创新高，关键风险在于组件供应限制转化率而非需求。 • 高通（同步，165美元）：持续低拥挤，但盈利预期下行压制估值。 • KLAC（跑赢，250美元）：拥挤度偏低，但估值溢价与短期增长逆风需关注。 风险管理启示 拥挤交易本身不必然跑输，但会放大回撤幅度。当拥挤交易平仓时，低拥挤标的提供负相关性保护；VIX升至20以上期间，高拥挤股票平均回报为负（-0.4%），而低拥挤标的相对抗跌。伯恩斯坦强调，持续监控拥挤暴露是风险管理的关键环节#文字观点", "publish_time": "2026-10-27 13:03", "tags": ["文字观点"]}, "post:2026-10-27T07-25:7868371a89c8": {"id": "post:2026-10-27T07-25:7868371a89c8", "kind": "post", "title": "2026-10-27 07:25", "source_label": "帖子正文", "excerpt": "20261026复盘 宏观： 欧盟计划采取保障措施，减少从中国进口化学品、家具和机械等行业产品；欧盟部长会议同时表示，将继续与北京磋商，并把已达成协议的混动汽车限制范围扩大至其他行业。", "content": "20261026复盘 宏观： 欧盟计划采取保障措施，减少从中国进口化学品、家具和机械等行业产品；欧盟部长会议同时表示，将继续与北京磋商，并把已达成协议的混动汽车限制范围扩大至其他行业。 物理ai： 1. 卖方：板块的演绎正从数采服务、设备相关聚焦到本体和垂类应用层面。自有场景并形成部署、采集、训练、再部署闭环的厂商，其数据获取接近于零增量成本且具备天然独占性。 2. 卖方：场景：杰克、柏楚、永创、德玛分别对应至少百万到千万级别的工厂劳动力需求。T链：主要催化剂为11-12月特斯拉发布非预训练视频。 3. 2026智元创新日将于10月29日在上海世博中心举行。 4. Anthropic 招股书中把物理 AI 和机器人当成了新增长引擎。 5. 巴克莱将特斯拉12个月目标价从370美元上调至450美元，特斯拉核心汽车业务增长前景改善、Robotaxi业务出现拐点迹象，以及储能业务需求强劲，均有望支撑公司估值。 人工智能： 1. 马斯克：过去几周债券市场几乎完全切断了资金渠道，没有独立于AI数据中心的大额收入的公司都融不到钱，200多家新云服务商会面临出清和整合。 2. Anthropic上半年营收163亿美元，去年同期为12亿美元；上半年净亏损807亿美元。11月16日当周进行IPO。截至9月30日，净收入留存率约为900%，年收入超过10万美元的客户数量已从950家增至逾1.19万家。 3. Anthropic 内部系统被 AI Agent 12 小时攻破。 4. Anthropic现在每花费1美元在计算上就能产生2.08美元的收入。 5. Gavin Baker 用 Ope 人由华中科 技大学变更为武汉市国资委，经营管理机制进一步市场化。近年来，公司加 快布局AI算力与高端制造，持续推动高速光模块产品升级与产能扩张。2025 年，光电子信息产业研创园一期正式投产；2026年，公司发布12.8TXPO 光模块，高端晶圆激光加工装备成功导入头部存储晶圆量产线，推动光互联 与精密制造业务向更高技术附加值领域延伸。 图表1：公司发展历程 来源：公司官网，中泰证券研究所仅供内部参考，请勿外传 公司深度报告 -6- 请务必阅读正文之后的重要声明部分国资控股与骨干持股相结合，长效激励机制持续完善 武汉国资控股与高校科研积累相结合，为公司长期发展提供产业和技术支 撑。截至2026年6月末，国恒基金持有公司19.00%股份，为公司控股股 东，实际控制人为武汉市国资委；香港中央结算有限公司、武汉华中科大资 产管理有限公司分别持股2.55%和2.00%。2021年校企改革完成后，公司 进一步强化市场化经营机制，持续对接武汉光电子信息产业资源，推动技术 成果产业化。 图表2：公司股权结构 来源：WIND，中泰证券研究所 核心经营资产集中于全资子公司，骨干持股增强长期利益联结。公司对华工 正源、华工激光、孝感华工高理、华工赛百等主要业务平台均持股100%， 便于围绕产品研发、产能建设与客户开拓统筹资源。校企改革期间，公司管 理团队及核心骨干参与持股平台，将经营团队利益与公司发展相结合，为技 术投入和业务拓展提供组织保障。 新一期限制性股票激励计划进一步覆盖研发及业务骨干。2026年9月披露 的草案拟向不超过930名研发人员及其他业务骨干授予不超过980万股限 制性股票，占总股本约0.97%。计划将利润增长、净资产收益率与研发投入 强度共同纳入考核，强化技术投入、经营效率与业绩增长之间的联系，有利 于稳定核心团队、持续推进高端产品研发和产业化。仅供内部参考，请勿外传 公司深度报告 -7- 请务必阅读正文之后的重要声明部分经营规模持续扩大，光互联及海外业务贡献提升 业经营规模持续扩大，归母净利润保持较快增长。2021—2025年，公司营 业收入由101.67亿元增长至143.55亿元，年复合增速为9.01%；归母净 利润由7.61亿元增长至14.71亿元，年复合增速达17.91%，连续四年实现 同比增长，利润增长整体快于收入增长。2025年，公司营业收入和归母净 利润分别同比增长22.59%和20.48%，主营业务规模扩张与高端产品交付 共同支撑经营业绩增长。 图表3：公司营业收入及同比增速 图表4：公司归母净利润及同比增速 来源：WIND，中泰证券研究所 来源：WIND，中泰证券研究所 经营业绩延续增长，利润增速明显快于收入。2026年上半年，公司实现营 业收入78.22亿元，同比增长2.53%；归母净利润11.86亿元，同比增长 30.17%。分业务来看，光互联业务800G、1.6T高速光模块持续推进全球 化、规模化交付；智能制造业务收入同比增长15.09%；智能感知业务加快 拓展光伏储能温度传感器、压力传感器及冷媒气体传感器等新产品应用，三 大业务持续向高端产品及新兴应用领域延伸。 光互联收入贡献持续提升，三大主业构成公司核心收入来源。2025年，公 司光电器件、激光装备及产线、敏感元器件业务分别实现收入60.97亿元、 36.36亿元和40.27亿元。2026年上半年，三项业务收入分别为38.03亿 元、19.29亿元和18.79亿元，占营业收入的比重分别为48.62%、24.66% 和24.02%，合计达到97.30%。其中，光电器件业务收入占比较2025年全 年提高6.15个百分点，已接近公司总收入的一半，成为公司重要的收入增 长来源。仅供内部参考，请勿外传 公司深度报告 -8- 请务必阅读正文之后的重要声明部分图表5：公司业务收入占比 图表6：公司海外收入占比 来源：WIND，中泰证券研究所 来源：WIND，中泰证券研究所 海外业务快速增长，全球化布局逐步转化为经营增量。公司持续推进光互联、 智能制造及智能感知业务的国际市场拓展，海外收入由2021年的9.74亿 元增长至2025年的20.10亿元，占营业收入的比重达到14.00%。2026年 上半年，公司实现海外收入16.48亿元，同比增长115.67%，收入占比进一 步提升至21.07%，同比提高11.05个百分点。随着高速光模块面向全球客 户规模化交付、激光装备海外客户拓展及智能感知业务国际化布局推进，海 外市场对公司收入增长的贡献进一步提升。 盈利能力持续改善，经营效率与资本回报有所提升 光电器件毛利率持续提升，高速数通产品升级推动业务盈利改善。2025年， 公司光电器件业务实现收入60.97亿元，同比增长53.39%，毛利达到8.08 亿 均配）的全栈平台演进持建设性看法，但需更多智能化及商业化进展以打开上行空间。 关键数据要点 • 采纳意愿：未来三年可能采纳轮式或腿式人形机器人的受访者占比64%（60/94家），略高于2025年的62%。但到2027年底的部署预期显著下调：复合机器人（轮+腿）从64%降至50%，轮式从58%降至36%，腿式从41%降至22%。 • 当前部署：复合机器人当前部署率19%（2025年为14%），轮式10%（6%），腿式6%（5%），仍处于极早期验证阶段。 • 满意度：对现有人形机器人性能满意率降至18%（2025年为23%），不满意率升至28%，反映产品 readiness 仍处早期。 • 价格与ROI：72%的受访者认为单价低于10万元人民币才具备广泛商业可行性（2025年仅53%）；82%要求投资回收期在3年以内（平均约26个月）；65%要求回收期等于或短于其他自动化投资。 upfront cost（高昂初始成本）以62%成为首要采纳障碍。 • 应用场景：制造（90%）、物流/仓储（85%）及研发（79%）为三大部署领域。具体任务集中于物料搬运、包装、上下料、质检及高危环境替代。70%企业期望机器人执行有限多任务（2025年仅49%），显示需求向多功能柔性化转变。 投资逻辑与行业洞察 • 渐进式部署：初期部署规模较小，至2028年多数企业仍计划仅部署1-10台，用于测试可靠性、场景适配性及与现有系统交互。行业下一阶段特征为试点项目增多，而非出货量即刻加速。重复订单、多基地部署及超10台机队规模才是商业化进展的更有意义指标。 • 结构化应用先行：在智能化、可靠性及经济性改善前，结构化环境（如工厂、仓库）中的可衡量任务将引领早期应用。复合机器人与轮式机器人有望早于双足机器人实现工业部署。 • 供应链受益前置：尽管终端部署延迟，但为积累真实数据，集成商正推进更多试点，零部件需求已率先涌现。谐波减速器供应商（如绿的谐波）订单强劲、产能快速扩张。 个股点评 • 宇树科技（均配）：客户参与度仍居首（32%计划采购），但领先优势收窄。看好其向全栈智能机器人平台转型，但需证明“大脑”及可重复商业部署进展。 • 绿的谐波（增持）：人形机器人相关订单2026年前三季度同比激增4-5倍至约40万台，占减速器总需求近半。月产能目标由9万台提升至年底12万台。行星减速器、丝杠及执行器多元化提供增量，但产能快速扩张及定价竞争或压制利润率。 • 恒立液压（增持）：核心液压件业务稳健，人形机器人滚柱丝杠已供应美国头部集成商。预计2027年执行器及人形业务营收同比增速超200%。美国反倾销/反补贴调查影响可控（对2027年净利润影响约4%）。 • 双环传动（增持）：齿轮及减速器龙头，正与北美关键客户开发新型减速器。FineMotion IPO撤回后，集团研发与制造资源整合将强化产品竞争力。 主要风险 • 上行风险：人形机器人部署速度快于预期；零部件渗透率提升；智能化突破带动需求；政策支持力度加大。 • 下行风险：技术瓶颈导致可靠性不及预期；价格竞争加剧侵蚀利润率；宏观经济走弱抑制资本开支；地缘政治影响供应链。#文字观点", "publish_time": "2026-10-27 13:04", "tags": ["文字观点"]}, "post:2026-10-27T08-14:56cfb11f75d6": {"id": "post:2026-10-27T08-14:56cfb11f75d6", "kind": "post", "title": "2026-10-27 08:14", "source_label": "帖子正文", "excerpt": "【中坚科技】元思无界全新品牌升级：以物理 AI 为刃，奔赴人机共生新十年 🎁成立一周年，元思无界（原桦之坚）正式完成品牌更名焕新，品牌英文名 TOPBOT，确立愿景：成为人机共生时代的高端具身智能消费级引领者。🎁我们以打造高端具身智能全栈研发主体与产品为核心根基。", "content": "【中坚科技】元思无界全新品牌升级：以物理 AI 为刃，奔赴人机共生新十年 🎁成立一周年，元思无界（原桦之坚）正式完成品牌更名焕新，品牌英文名 TOPBOT，确立愿景：成为人机共生时代的高端具身智能消费级引领者。 🎁我们以打造高端具身智能全栈研发主体与产品为核心根基。“元”，植根精密制造实业底盘，扎根工程、尊重事实；“思”，代表独立技术思考，拒绝跟风炒作概念；“无界”，寓意打破人机交互与智能体验的边界。本次更名并非战略转向，而是将「扎根实业、独立思考、打破边界，落地人机协同场景」这一内核清晰对外传递。 🎁成立一年来，元思无界团队从最初数人，扩张至正式编制 450 人以上，研发人员占比 87%，搭建起覆盖运动控制、具身大模型、多模态感知、整机结构与零件可靠性设计的完整研发梯队。团队始终以智能大脑为研发重心，在整体研发投入中，算法与数据方向占比达 66%，每月投入训练算力、数据处理相关研发费用达到千万级。面向未来，我们将保持高强度研发节奏，持续加码算力、仿真平台、多模态数据、整机工程建设，为物理 AI 技术落地筑牢人才与平台底座。 🎁不同于局限于虚拟空间的传统大模型，物理 AI 的竞争本质，是本体硬件平台与智能大脑形成协同闭环：AI 需要读懂现实世界的物理规则，在真实环境中完成感知、行动、交互与持续学习。我们认为，机器与人类不是替代关系，而是边界消融、彼此协作。智能的本质，是协作共生：依托机器智能延伸人的能力，打破个体的身体与能力桎梏，在家庭端为用户提供更多生活选择；在产业端形成「人的智能 × 机器智能」的合力。这正是人机共生的内涵，也是元思无界全部战略的原点。 依托七大全栈自研技术平台，元思无界在大脑与算力底座、硬件堆叠栈与可靠性工程、机器人交互数据三大方向持续深耕，构筑物理 AI 核心竞争力。 🎁元思无界深耕机器狗本体与 AI 技术研发，深度对接 NVIDIA Isaac 全栈生态，覆盖 Isaac Sim 仿真环境、Isaac Lab 机器人学习框架与 Newton 可微物理引擎，搭配大规模 GPU 算力集群，打通数字孪生 — 仿真训练 — 真机部署完整 Real2Sim2Real 虚实闭环。我们自研自动化数据工具平台，采用混合管线路径，配合多维物理质检体系，实现高保真物理资产、海量室内外复杂场景的规模化自动构建；同时搭建由大语言模型驱动的数字人智能体矩阵，高度还原高动态多人交互、人机共融博弈场景，赋能机器狗在真实环境中实现自然跟随引导、流畅交互、主动避让等自主智能能力。在此基础上，团队依托高通量多模态传感数据合成、域对齐技术以及大规模并行强化学习，持续攻坚微物理参数自动标定、物理生成式世界模型、视物统一联合仿真架构，不断缩小仿真与真机之间的鸿沟，加速零样本真机迁移落地，推动四足机器人平台智能，从传统 “真机反复试错迭代” 迈向仿真原生进化的全新范式。 🎁全新独立品牌元思无界，第一阶段聚焦消费端轮足机器狗市场。轮足形态是现阶段物理 AI 走进家庭的优选载体，兼具轮式高速通行、足式灵活越障的优势，适配居家室内、社区、户外等非结构化复杂环境，兼顾移动通行能力与交互价值。我们坚持本体硬件 + 智能大脑双路线全栈自研，整机、算法同步迭代，现已完成多轮版本打磨。研发重点聚焦居家柔顺步态、自然语言人机交互、端侧推理延迟，围绕家庭消费场景打磨稳定可靠的用户体验，项目现已进入中试阶段。测试场地持续扩容，打造算法实验室、整机中试产线、全场景性能测试区一体化布局。 🎁元思无界正在搭建「消费类机器人‑行业四足机器人‑人形机器人」完整产品矩阵。我们坚持产业为本、技术为核、落地为王，只专注一件事：打造拥有真实体验价值的具身智能。#文字观点", "publish_time": "2026-10-27 08:14", "tags": ["文字观点"]}, "post:2026-10-27T09-01:b6acf464f089": {"id": "post:2026-10-27T09-01:b6acf464f089", "kind": "post", "title": "2026-10-27 09:01", "source_label": "帖子正文", "excerpt": "✔今日投资提示1027 【Top Call】 隔夜中东外交斡旋缓和地缘溢价、油价自高位回落，叠加AI情绪回暖带动美股齐涨、风险偏好修复，核心关注AnthropicIPO与AI资本开支叙事、以及卢拉连任引发的巴西股汇冲击。【夜盘主线】 ①美股三大指数齐涨、纳指领涨但涨幅集中于权重股、等权指数走弱，美债", "content": "✔今日投资提示1027 【Top Call】 隔夜中东外交斡旋缓和地缘溢价、油价自高位回落，叠加AI情绪回暖带动美股齐涨、风险偏好修复，核心关注AnthropicIPO与AI资本开支叙事、以及卢拉连任引发的巴西股汇冲击。 【夜盘主线】 ①美股三大指数齐涨、纳指领涨但涨幅集中于权重股、等权指数走弱，美债长端仍处高位、美元反弹→风险偏好修复偏脆弱，估值上沿约束未消。 ②Anthropic提交IPO证实盈利能力、Meta加码AI基建，存储与光通信板块走强→AI资本开支与回报叙事回暖，科技交易情绪修复。 ③沙特/土/巴高官访伊磋商、斡旋方推美伊互让协议，油价自近半年高位回落→地缘供应中断担忧降温、通胀担忧缓和，但霍尔木兹风险未根除。 ④卢拉逆转连任巴西总统，巴西股汇遭遇大规模抛售→关注新兴市场财政与汇率波动。 【海外复盘】 美股三大指数齐涨、纳指领涨，存储与光通信板块走强；欧洲三大股指 23", "source_label": "帖子正文", "excerpt": "【天风通信】 拓邦股份2026年三季报事件：公司发布2026年三季报，26年前三季度实现营收90.75亿元，同比增长10.84%，归母净利润1.98 亿元，同比下降52.87%，扣非净利润 1.78亿元，同比下降55.13%；26Q3单季度收入32.66亿元，同比增长21.63%，环比保持增长，归母", "content": "【天风通信】 拓邦股份2026年三季报事件：公司发布2026年三季报，26年前三季度实现营收90.75亿元，同比增长10.84%，归母净利润1.98 亿元，同比下降52.87%，扣非净利润 1.78亿元，同比下降55.13%；26Q3单季度收入32.66亿元，同比增长21.63%，环比保持增长，归母净利润6937万元，同比下降22.25%，扣非净利润6638万元，同比下降22.50%，剔除汇兑影响Q3单季度扣非净利润1.11亿元，同比增长12.04%。各业务来看：#智能控制业务26年前三季度实现收入 84.88 亿元，同比增长 6.48%。其中： 1）工具和家电板块：依托“控制器+电机+电池包+行业解决方案”一站式平台，承接客户多品类需求，锂电化、无绳化、智能化新品类实现结构性增长；家电板块高附加值客户持续扩容，海外商厨、AI 温控等高端应用贡献增加。 2）汽车和高端装备板块：汽车方向，受益海外新能源市场放量及海外优质客户合作，公司新能源汽车充电相关业务同步增长；工业和机器人方向，具身智能相关收入同比增速超7 倍，公司已与十余家具身智能企业建立合作；工业领域自动化特定行业需求强劲，受益于AI 基础设施建设带动的设备采购增加，公司驱动器等产品市场应用进一步扩大。AIDC 方向，公司积极布局 AI 数据中心供电侧与散热侧，与 Vertiv 维谛等全球龙头建立合作，室外侧制冷控制、UPS电源设备控制器已批量出货；自主研发的服务器 CRPS 电源产品，部分已完成认证并送样客户测试，未来将深耕行业头部客户，持续拓展合作品类。 3）新能源板块：欧洲户用储能需求回暖，工商业储能高速增长，南亚新兴市场因缺电问题驱动园区储能快速起量；国内容量电价政策落地、电力现货市场建设加快。#自主智能业务26年前三季度实现收入 5.86 亿元，同比增长 172.20%。其中： 1）云储云充：增速居各板块首位，完成从技术培育到规模出货的跨越。 2）其他 AI 整机：随着各品类进入放量期，该板块的贡献将有望持续提升。 🏅公司将在深耕智能控制核心部件的基础上，沿统一技术底座持续锚定蓝海细分场景，推动自主智能整机业务规模化发展，叠加数据运营创造长期价值，不断培育新的增长极，成长为自主定义智能整机的领先企业，建议关注。 📞天风通信团队 王奕红/陈汇丰/唐海清#文字观点", "publish_time": "2026-10-27 20:23", "tags": ["智能控制业务", "自主智能业务", "文字观点"]}, "attachment:files/磷化铟：AI算力的光子血脉，从卡脖子到国产替代的价值重估20261022.pdf": {"id": "attachment:files/磷化铟：AI算力的光子血脉，从卡脖子到国产替代的价值重估20261022.pdf", "kind": "attachment", "title": "磷化铟：AI算力的光子血脉，从卡脖子到国产替代的价值重估20261022", "source_label": "其他", "excerpt": "锂电10月月报：涨价落地盈利修复，估值历史低位 20261025 要点总结 1.板块回调充分，悲观预期已基本反映：5月至今锂电板块大部分公司回调幅度超50%，11月至次年 2月为排产淡季、明年需求增速分歧（悲观预期已下修至10%几）等短期悲观因素已在股价中明显反 应。2.估值处于历史低位，业绩超预期公司对应明年约十倍估值：一维里能（电池）、安杰（隔膜）、上 ", "content": "锂电10月月报：涨价落地盈利修复，估值历史低位 20261025 要点总结 1.板块回调充分，悲观预期已基本反映：5月至今锂电板块大部分公司回调幅度超50%，11月至次年 2月为排产淡季、明年需求增速分歧（悲观预期已下修至10%几）等短期悲观因素已在股价中明显反 应。 2.估值处于历史低位，业绩超预期公司对应明年约十倍估值：一维里能（电池）、安杰（隔膜）、上 太（负极）等三季度盈利趋势仍超预期且持续性较好，当前位置性价比突出。 3.需求判断比市场乐观，明年增速有望20%以上：主要增长驱动来自海外储能（明年预计40%-50% 增长，订单前置确定性强）与海外动力（油价高位、电动化率低，维持20%-30%增长问题不大），中 性预期20%左右、乐观25%。 4.国内动力偏弱但结构优化：9月国内乘用车零售同比下滑16%，前九月下滑约12%；纯电占比提升 至约67%，低价车（5万以内）下滑50%-60%，20-30万及40万以上高端车型表现较好。 5.出口持续超预期：9月出口同比增157%，1-9月累计同比增138%，部分受欧洲配额及明年4月出 口退税取消前的抢出口驱动；比亚迪占出口份额约34%，吉利年初至今增约5倍。预计今年出口接近 600万辆（约130%增长），明年仍有30%-40%增长。 6.商用车（尤其重卡）是国内亮点：1-9月商用车销量同比增42%，重卡增64%，9月单月重卡销量 3.3万辆创新高、渗透率约50%；预计今年重卡35-40万辆（50%-60%增长）、电动化率超40%，明 年重卡增速15%-20%，商用车电池明年维持20%以上增长。 7.海外动力：欧洲与新兴市场双强：欧洲1-9月电动车同比增30%出头，主流国家9月增超50%；中 国出口车型占欧洲今年增量约40%，1-8月中国车企欧洲注册量约58万辆（同比130%-140%）。新 兴市场1-8月电动车销量同比增90%，电动化率仅11%-12%，比亚迪份额约24%；预计新兴市场今 年约300万辆（90%增长），明年约40%增长。海外动力今年约35%增长，明年25%-30%。 8.储能全球高增，国内预期下修：1-9月全球储能电芯出货840GWh、同比翻倍，9月单月超 110GWh，全年预计1100-1200GWh（翻倍左右）。国内因系统运行费（约7分/度）、碳酸锂涨价 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 等因素，装机增速下修至不到20%（此前预期50%），全年预期调至约30%，明年预期20%-30%； 海外储能明年预计40%-50%增长，美国限制风险影响有限（中国储能系统在美占比20%以内）。 9.排产淡季提前：头部公司预计11月起小幅减产，11月至次年2月排产偏低，3月明显回升；部分 二线电池企业因差异化产品，11-12月排产环比不降反增。 10.电池环节：份额与盈利：宁德国内份额从约44%降至8-9月的40%-41%（小米、理想引入二供 三供），全球份额8月降至37.8%（环比降约2个点），但欧洲份额约45%、新兴市场约35%、海外 整体约33%仍在提升。三季度宁德单瓦时利润下降近2分钱，其中消费税与出口退税影响约20多亿元 （对应约1分钱），产品结构变化（储能占比提升）等影响约1分钱；一维里能盈利维持2-3分 /Wh。 11.成本下降与价格调整：碳酸锂从高点18-20万跌至约9-10万，测算明年电池成本较三季度（碳酸 锂均价约14万）下降约4分钱（按碳酸锂8万测算）；电芯价格从最高约0.4元多下调至0.36元左 右。明年盈利中性乐观情形与三季度持平，保守情形微降，取决于税费传导与成本让利分配；企业向下 游传导意愿较强，二线企业不愿打价格战。 12.中游材料分化，看好隔膜、负极、铜箔：隔膜安杰单平利润已达约0.2元（超预期，原预期明年才 达两毛），明年业绩预期45-50亿元、估值约十倍，单平两毛对应投资回收期5-6年属合理水平，产 能释放要到明年年底至2028年，明年供需较好；负极上太三季度业绩超预期（单吨利润约2500 元），叠加自有产能占比提升及四季度对宁德涨价落地，明年单吨利润有望向3000元走，业绩预期 20亿元以上、估值不到十倍；铜箔涨价逐步落地（嘉元对宁德涨约1500元/吨，锂电铜箔单吨利润提 升至4000-5000元），明年供给偏紧。铝箔三季度价格未再上涨、盈利稳定；铁锂明年产能过剩、价 格盈利有下降可能；电解液三季度盈利平稳，VC结算价提升至约16万，六氟价格较坚挺。 （vx:362336789） 13.重点推荐标的：电池端宁德、亿纬；材料端隔膜首推安杰（其次博士、新远），负极上太，以及新 宙邦、科达利（物理AI受益）、普泰来、诺德、嘉元等。 问答整理 Q1：明年锂电需求增速的分歧怎么看？ 答：市场悲观预期已下修至10%几。我们判断明年需求可在20%以上，乐观约25%、中性约20%。 主要驱动是海外储能（明年40%-50%增长，订单前置、项目确定性强）和海外动力（油价高位、电动 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 化率不高，维持20%-30%增长问题不大）。即使保守测算也有20%左右增 打开公司成长天花板。 前三季度公司物理AI业务收入3.01亿元，同比+157.02%。物理AI的核心不是单纯算法，而是“视觉感知+工业数据+缺陷样本+工艺Know-how+现场部署能力”的系统工程。公司长期深耕苹果及代工产业链，在高精密制造场景中积累了大量真实产线数据、缺陷库、视觉算法模型、工艺参数和项目调试经验，这些数据资产很难被纯算法公司或新进入者短期复制，已领先一个身位。随着公司物理AI业务落地，公司成长天花板将打开。 ⭕️果链创新周或带动明后年增长弹性。 苹果2027年20周年高端机型，以及钛合金3D打印结构件、钢壳电池、VC散热、折叠屏铰链等新工艺和新部件，都将带来新的视觉检测需求。公司多年绑定苹果及代工产业链，不仅具备设备导入优势，更重要的是理解果链高良率、高节拍、高一致性要求下的工艺痛点。苹果创新周期有望重新打开传统3C业务弹性。 ⭕️盈利能力短期承压，明年有望回升。 Q3单季公司毛利率约56.51%，主要受新行业拓展及泰莱并表后低毛利运动控制产品占比提升影响。Q3单季净利率约12.68%。费用端看，Q3销售费用率约23.57%，管理费用率约3.55%，研发费用率约14.72%，三项费用率合计约41.84%。后续随着公司3C高毛利业务回暖、AI方案收入占比提升，净利率有较大修复空间。 ⭕️投资建议：预计公司26-27年归母净利润2.5、4.5亿，对应PE为72、40倍。苹果创新周期将带动公司业绩高增长，公司依托果链和高精密制造场景沉淀的数据资产，有望在物理AI时代获得更高成长，继续重点推荐！#文字观点", "publish_time": "2026-10-27 10:23", "tags": ["文字观点"]}, "attachment:files/中信建投-新澳股份(603889)26Q3羊毛顺价释放盈利，看好宽带战略下长期成长-261027.pdf": {"id": "attachment:files/中信建投-新澳股份(603889)26Q3羊毛顺价释放盈利，看好宽带战略下长期成长-261027.pdf", "kind": "attachment", "title": "中信建投-新澳股份(603889)26Q3羊毛顺价释放盈利，看好宽带战略下长期成长-261027", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时 请务必阅读正文之后的免责条款和声明。 证券研究报告 ·A股公司简评 纺织制造 26Q3羊毛顺价释放盈利 ,看 好宽带战略下长期成长 核心观点 26Q1 -3公司实现营收 46.63亿元 /+19.7%，归母净利润 4. 71亿元 /+24.7%；26Q3公司实现营收 15.76亿元 /+17.6%， 归母净利润 1. 45 亿元 /+36.0%。26Q3公司毛利率为 18.87%/+1.24pct ， 环比 -2.89pct； 净利率为 9.92%/+1.01pct ，环比 -2.16pct。26Q3羊毛顺价基本到 位，毛精纺业务量价齐升、毛条盈利弹性继续释放，羊绒业务因 收入确认节奏波动增速环比放缓 。展望 26Q4，羊毛价格仍处高 位，传统旺季毛精纺接单良好，但毛条业务弹性或收敛，羊绒业 务客户开拓顺畅有望保持良好增长。 产能方面，银川及越南一期 持续爬坡，越南二期建设与高端花式纱线项目稳步推进，叠加运 动户外等应用场景拓展 ，有望支撑公司中长期成长 。 事件 公司发布 2026年三季报。26Q1-3公司实现营收 46.63亿元 /+19.7%，归母净利润 4.71亿元 /+24. 7%，扣非归母净利润 4. 58亿 元/+23. 4%。经营性现金流净额为 -0.43亿元（上年同期为 2. 44亿 元，主要系原毛价格上涨、采购单价上升，及羊绒业务采购规模 扩大）。基本 EPS为0.50元/股，同比 +25.0 %，ROE（加权）为 12.34%/+1.59pct 。 单季度看， 26Q3公司实现营收 15.76亿元 /+17.6%，归母净利润 1.45亿元 /+36.0%，扣非归母净利润 1.42亿元 /+36.9%。 简评 毛精纺纱线量价齐升， 毛条盈利弹性释放，羊绒业务因收入确认 节奏波动增速环比放缓 。分业务看， 1）毛精纺纱线： 估计 26Q3 收入约 7亿元 /+26%，毛利率约 29.1%/+1.8pc t，公司顺价 基本到 位，毛精纺纱线吨均价约 19万元 /吨，同比 +17.3%。2）羊绒： 估 计26Q3收入约 6.6亿元 /+11%，增速较上半年放缓，主要 系收入 确认节奏波动 ，毛利率约 10.4%。3）羊毛毛条： 估计 26Q3收入 约2亿元 /+23%，毛利率约 10.5%/+4.0pct ，羊毛涨价对毛条价格 传导最为直接， 毛条销售 均价约13.4万元 /吨，同比 +48%。4）改 性处理、染整及羊绒加工： 估计 26Q3收入约 0.1亿元、毛利率 约34%，26年部分内部订单转移至越南、宁夏 基地，外接订单比 例提升， 预计未来 染整新产能逐步释放后有望成为新的增长点。 维持 买入 叶乐 yele@csc.com.cn 18521081258 SAC 编号 :S1440519030001 张舒怡 zhangshuyi@csc.com.cn SAC 编号 :S1440523070004 发布日期： 2026年10月27日 当前股价： 6.25元 主要数据 股票价格绝对 /相对市场表现（ %） 1个月 3个月 12个月 3.65/8.56 12.61/15.67 6.88/13.28 12月最高 /最低价（元） 6.94/5.08 总股本（万股） 94,920.47 流通 A股（万股） 94,213.74 总市值（亿元） 59.33 流通市值（亿元） 58.88 近3月日均成交量（万） 1114.09 主要股东 浙江新澳实业有限公司 30.51% 股价表现 相关研究报告 26.09.07 【中信建投轻工纺服及教育】 新澳股份 (603889):26H1 收入业绩稳健增长，期 待顺价释放盈利弹性 -13%-3%7%17%27% 2025/10/27 2025/11/27 2025/12/27 2026/1/27 2026/2/27 2026/3/27 2026/4/27 2026/5/27 2026/6/27 2026/7/27 2026/8/27 2026/9/27 新澳股份 上证指数新澳股份 (603889.SH) 仅供内部参考，请勿外传 1 A股公司简评 报告 新澳股份 请务必阅读正文之后的免责条款和声明。 顺价带动盈利改善 ，Q3毛利率同比转正。1）利润率： 26Q1 -3公司毛利率为 20.40%/+0.17pct ，净利率为 10.70%/+0.27pct ，所得税率为 14.70%/ -0.36pct。单季度看， 26Q3公司毛利率为 18.87%/+1.24pct ，环比 -2.89pct； 净利率为 9.92%/+1.01pct ，环比 -2.16pct；所得税率为 14.36%/+2.28pct ，环比 -1.12pct。毛利率同比改善主要系顺 价逐步到位 、库存收益释放，以及越南、银川基地产能利用率提升 。2）期间费用： 26Q1 -3公司销售、管理、研 发、财务费用率分别为 1.69%/ -0.23pct、2.58%/ -0.51pct、2.08%/ -0.13pct、1.11%/+0.77pct 。单季度看， 26Q3销售、 管理、研发、财务费用率分别为 1.64%/ -0.26pct、2.55%/ -0.57pct、2.20%/+0.13pct 、0.89%/+0.17pct 。财务费用率 上升主要系汇兑损失增加， 26Q1-3汇兑损失 估计约 4000多万元，上年同期为汇兑收益 估计约 2800万元。 拟定增募资，稳步推进全球产能建设， 布局高端花式纱 等新品类 。公司拟定增募资不超过人民币 10.19亿 元用于新澳越南高档精纺生态纱纺织染整项目（二期） 、年产 2,000吨精梳高端羊绒、羊毛花式纱线智能化车间 建设项目 等，10月14日公司已公告审核问询函回复，尚待上交所审核与注册。 梳理近期公司建设项目如下： ① 新澳越南 “5万锭高档精纺生态纱纺织染整项目 ”： 一期 2万锭于24年底至 25年建设完成并陆续投产 ，26H1产 能持续爬坡；二期 3万锭已开工建设， 有望于 27年4月安装设备 、后续分批释放产能。 ②新澳银川 2万锭高品 质精纺羊毛（绒）纱建设项目 2万锭已完成安装调试工作， 25年下半年陆续释放产能 ，26H1产能持续爬坡， 有 望于 27年着手推进宁夏二期 项目。③浙江桐乡 “年产 2000吨精梳高端羊绒、羊毛花式纱线智能化车间建设项 目”：项目预算 2.69亿元，建成后有望丰富高端纱线产品供给，拓展花式纱线业务。 展望： 1）26Q4：顺价基本到位，毛精纺订单良好 ，毛条业务弹性或收敛 。截至 10月22日，澳大利亚羊 毛交易所东部市场指数为 17.85澳元 /公斤，同比 +25.1%，较25年6月末 +47.9 %，较 26年初 +8.3%，较 6月18 日前期高点 19.89澳元 /公斤回落 10.3%，整体仍处 近年较高水平 。展望 Q4，传统出货旺季 下，近期毛精纺接单 估计双位数增长 ， 但羊毛价格涨幅放缓后，毛条业务弹性或将收敛 ，羊绒业务客户开拓顺畅有望保持良好增长 。 2）中长期看，需求侧 羊毛纱线的下游应用已由传统 的保暖针织 向多场景、新兴场景延伸 ，系统性拓宽 至运动户 外、梭织、家纺、花式纱与产业用 等多领域，公司践行可持续宽带发展战略进行品类多元化扩容 。供给侧， 当 前毛精纺行业集中度仍较低，估计新澳市场份额 16%-17%，新澳具备品牌、客户、研发、产能等全方位竞 争优 势，随着公司全球产能基地建设推进，后续份额有较大提升空间。 盈利预测： 预计 2026-2028年公司营收为 59.2、67.7、76.2亿元，同比增长 17.2%、14.3%、12.5%；归母净 利润为 5.86、6.61、7.26亿元，同比增长 22.0%、12.9%、9.9%，对应 PE为10.1x、9.0x、8.2x，维持“ 买入”评 级。 风险提示： 1）原材料价格波动风险： 公司产品主要原材料为羊毛及羊绒等，材料成本占主营业务成本比例 较高。如果未来原材料价格出现大幅波动，公司无法及时将原材料价格波动的风险向下游转移，将存在因原材 料价格波动带来的毛利率下降、业绩下滑的风险。 2）产能建设进度不及预期风险： 子公司新澳越南 5万锭高档 精纺生态纱纺织染整项目 等正在建设 中，并逐步进入投产阶段，投产进度不及预期将影响公司营收 增长。3）下 游需求不及预期风险： 公司产品的销量及价格均取决于下游市场的需求情况，若下游需求不及预期，将影响公 司的订单量及产品价格，进而影响公司的收入及毛利率水平 。 仅供内部参考，请勿外传 2 A股公司简评 报告 新澳股份 请务必阅读正文之后的免责条款和声明。 图1:澳大利亚羊毛价格走势 图2:羊绒出口价格走势 数据来源： 中国羊毛信息网， 中信建投证券 数据来源： 海关总署 ，中信建投证券 图3:新澳股份毛利率与羊毛价格复盘 数据来源： 公司公告、 中国羊毛信息网、 中信建投证券 图4:新澳股份毛精纺纱线毛利率与羊毛价格复盘 数据来源： 公司公告、中国羊毛信息网、 中信建投证券 05001,0001,5002,0002,500 2022/02 2022/04 2022/06 2022/08 2022/10 2022/12 2023/02 2023/04 2023/06 2023/08 2023/10 2023/12 2024/02 2024/04 2024/06 2024/08 2024/10 2024/12 2025/02 2025/04 2025/06 2025/08 2025/10 2025/12 2026/02 2026/04 2026/06 2026/08 2026/10澳大利亚羊毛交易所东部市场综合指数（澳分 /公斤） 020406080100120 2021-05 2021-08 2021-11 2022-02 2022-05 2022-08 2022-11 2023-02 2023-05 2023-08 2023-11 2024-02 2024-05 2024-08 2024-11 2025-02 2025-05 2025-08 2025-11 2026-02 2026-05 2026-08中国:出口平均单价 :已梳无毛山羊绒 (51053921): 当月值（美元 /千克） 0%5%10%15%20%25% 0510152025 2013-12 2014-05 2014-10 2015-03 2015-08 2016-01 2016-06 2016-11 2017-04 2017-09 2018-02 2018-07 2018-12 2019-05 2019-10 2020-03 2020-08 2021-01 2021-06 2021-11 2022-04 2022-09 2023-02 2023-07 2023-12 2024-05 2024-10 2025-03 2025-08 2026-01 2026-06澳大利亚羊毛交易所东部市场综合指数 :澳元/公斤 毛利率 0%5%10%15%20%25%30% 0510152025 2015A 2016A 2017A 2018A 2019A 2020A 2021A 2022A 2023A 2024A 2025A 2026A澳大利亚羊毛交易所东部市场综合指数 :澳元/公斤 毛精纺纱线毛利率仅供内部参考，请勿外传 3 A股公司简评 报告 新澳股份 请务必阅读正文之后的免责条款和声明。 图5:新澳股份分产品收入毛利拆分 数据来源： 公司公告、 升是利润弹性来源。 公司Q3海外销售占比60%、单瓦价差约2分；国内单瓦微亏、海外基本盈亏平衡。#土耳其基地基本满产，四季度出货明显提升、经营成果逐步体现；#光伏设备禁止及限制出口后，海外电池产能稀缺性进一步凸显，亦带动国内电池出口。 3️⃣ #太空光伏第二曲线、卫星业务全年营收过亿、有望跻身商业卫星公司前十。 公司布局完整，卫星能源+整星制造+太空算力星座三位一体，卫星业务有序推进。持续研发验证#CPI+HJT/钙钛矿完整产品，不断开拓国内外客户，适用于大型通讯及算力星座，打开长期成长空间。 ——————#中信建投电新团队张芷菡/朱玥#文字观点", "publish_time": "2026-10-27 13:43", "tags": ["中信建投电新", "业绩拆分", "中信建投电新团队", "文字观点"]}, "post:2026-10-27T13-55:cd6efb29dfaa": {"id": "post:2026-10-27T13-55:cd6efb29dfaa", "kind": "post", "title": "2026-10-27 13:55", "source_label": "帖子正文", "excerpt": "钧达股份：Q4经营趋势向好，受益于上海卫星规划 1、传统光伏层面，钧达2026Q3环比减亏明确；Q4考虑到土耳其基地产能满产，出货量与盈利贡献将有明显提升，Q4经营层面有望扭亏", "content": "钧达股份：Q4经营趋势向好，受益于上海卫星规划 1、传统光伏层面，钧达2026Q3环比减亏明确；Q4考虑到土耳其基地产能满产，出货量与盈利贡献将有明显提升，Q4经营层面有望扭亏；长期来看，随着光伏设备禁止及限制出口，海外电池产能稀缺性进一步凸显，亦会带动国内电池出口，海外销售均价较国内更好保障公司盈利。 2、太空光伏层面，钧达股份卡位稀缺性明显，“卫星能源+整星制造+太空算力星座”业务布局完整。卫星制造层面，2026年相关营收有望过亿；2027年考虑算力星，卫星规划达50-60颗；近期上海卫星互联网产业创新发展行动方案（2027-2030年）提出#到2030年上海在轨卫星总数超3000颗，巡天有望成为其中核心力量。卫星能源与卫星制造相互赋能明确，今年在巡天多颗卫星上进行了搭载测试，与海外企业送样测试也在持续推进。 3、公司传统光伏经营趋势向好，太空光伏逐步推进，回调后公司已经进入价值区间，提示底部布局机会。#文字观点", "publish_time": "2026-10-27 13:55", "tags": ["文字观点"]}, "attachment:files/Bernstein-SpaceX｜北美：目标价上调至 268 美元 —— 地面 AI 建设与企业宽带加入轨道 AI 逻辑，评级增持 SpaceX  North America SpaceX Update and raise target to $268 - Terrestrial AI build and enterprise broadba.pdf": {"id": "attachment:files/Bernstein-SpaceX｜北美：目标价上调至 268 美元 —— 地面 AI 建设与企业宽带加入轨道 AI 逻辑，评级增持 SpaceX  North America SpaceX Update and raise target to $268 - Terrestrial AI build and enterprise broadba.pdf", "kind": "attachment", "title": "Bernstein-SpaceX｜北美：目标价上调至 268 美元 —— 地面 AI 建设与企业宽带加入轨道 AI 逻辑，评级增持 SpaceX North America SpaceX Update and raise target to $268 - Terrestrial AI build and enterprise broadba", "source_label": "Bernstein", "excerpt": "26 October 2026 Global Aerospace & Defense Space Exploration Technologies Corporation Rating Outperform Price Target SPCX 268.00 USD (248.00 OLD ) Douglas S. Harned, Ph.D. +1 917 3", "content": "26 October 2026 Global Aerospace & Defense Space Exploration Technologies Corporation Rating Outperform Price Target SPCX 268.00 USD (248.00 OLD ) Douglas S. Harned, Ph.D. +1 917 344 8430 douglas.harned@bernsteinsg.com Stacy A. Rasgon, Ph.D. +1 213 559 5917 stacy.rasgon@bernsteinsg.com Nestor Wester +44 20 7676 7067 nestor.wester@bernsteinsg.com Specialist Sales Steve Song +1 917 344 8401 steve.song@bernsteinsg.com Adjusted EPS F25A F26E F27E SPCX (USD) -- (0.01) 1.44 OLD -- (0.19) 1.37Financials F25A F26E F27E CAGR Revenues (M) 18,674 54,468 241,887 -- Adjusted EBITDA 6,584.0 27,094.0 136,266.0 --Valuation Metrics F25A F26E F27E Adjusted P/E (x) N/M 102.2 EV/Adj EBITDA (x) 299.9 72.9 14.5 Source: Bloomberg, Bernstein estimates and analysis.SpaceX: Update and raise target to $268 - Terrestrial AI build and enterprise broadband add to Orbital AI thesis; Outperform We raise our SpaceX outlook primarily on terrestrial AI build plans. We believe the case for a multi-trillion dollar valuation rests on success of orbital data centers. But, the company’s outlook for terrestrial AI is a material add to the overall revenue path. The Enterprise & Government Connectivity subsegment also appears to be outperforming. SpaceX now projects $500bn to $1tn in revenues exiting 2027. Our estimate is well below, with full 2028 at $424bn. But, that is an increase. And, as we have said, you do not need to go all the way to the company’s plan to make SpaceX attractive. Elon talked of a possible T esla merger and SpaceX is reportedly discussing a telco tower deal. We make no assumptions on either here. We now assume a total of 13GW of terrestrial compute by the end of 2027 - 5GW above our prior estimate. Most importantly, the company stressed prices it is getting for compute capacity, suggesting that it is above the $30-50/watt level of recent deals. We have taken our pricing up, although not to that level. We we add capacity in 2028 up to 20GW. These additions come with capex, which we estimate at $35bn/GW. If the company achieves its pricing expectations, there could be more upside, both for terrestrial and orbital. SpaceX plans first orbital data center launches in late 2027, with operations beginning mid-2028. Orbital data centers were not discussed on the call, Starship launches were. Flight 15 should be within a few weeks, with a plan to capture both booster and Starship. The company said the heat shield performed well on Flight 14, which could set up the first reuse of Starship on Flight 16. Reusability is key to making orbital data centers successful. We update our model: 1) Assume terrestrial AI compute capacity is 2.8GW at the end of 2026, 12.8GW at the end 2027, and 20.1GW at the end of 2028 and increase our AI capex assumptions, 2) Raise our average price per watt for compute to $26 in 2027, before gradually declining thereafter. 3) Lower our AI multiple to 17x from 21x as AI-oriented stocks have softened. 4) Raise our capex assumptions to support growth in terrestrial AI capacity. Investment Implications We rate SPCX Outperform and raise our target to $268 (from $248) primarily on higher AI revenues (pricing and terrestrial capacity), partially offset by a lower AI multiple, as AI companies in general have seen multiple contraction.Close Date 23 Oct 2026 SPCX Close Price (USD) 147.49 Price Target (USD) 268.00 Upside/(Downside) 82% 52-Week Range 225.64/104.83 SPX 7,623.68 FYE Dec Div Yield NA Market Cap (USD) (B) 2,025.34 EV (USD) (B) 1,974.70 Performance YTD 1M 6M 12M Absolute (%) NA (0.6) NA NA SPX (%) 11.4 (1.1) 7.2 13.1 Relative (%) NA 0.5 NA NA Source: Bloomberg, Bernstein estimates and analysis. Price Performance, 1YR $220 $200 $180 $160 $140 $120 06/26 07/26 08/26 09/26 10/2670007200740076007800800082008400 SPCX SPX See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 26 Oct 2026 05:17 UTC Completion Date: 26 Oct 2026 03:19 UTC on 26-Oct-2026 Douglas S. Harned, Ph.D. +1 917 344 8430 douglas.harned@bernsteinsg.com 26 October 2026 DETAILS We raise our 2026 and 2027 adj EPS to -$0.01 and $1.44 from -$0.19 and $1.37 primarily driven by higher terrestrial compute capacity and better $/watt economics. For deeper background on SpaceX, see our initiation report: “ Space Exploration Technologies Corporation: Doing Time in the Universal Mind - Initiate at Outperform; Target Price $239 ” RAISING THE OUTLOOK At Q3 earnings, the company described a significantly stronger revenue growth outlook. An annual revenue run rate of at least $100bn is expected by year-end, but with now a run rate of $500bn-$1,000 expected by end of 2027 - mostly driven by terrestrial compute. The company now expects to be at 2.5-3GW by the end of 2026. By the end of 2027, capacity is expected to be at least 13GW (and possibly a total 23GW). The company said pricing is now tracking above the $30-$50/watt range given by Musk at Q2. Short term compute contracts will remain the focus to take advantage of rising demand. Prior to this earnings report, we modeled 2031 revenues of $655bn, well below the company’s prior 2031 revenue estimate - and if SpaceX can even achieve our prior numbers, there is already huge upside. We have raised our revenue and earnings outlook, with the addition of more terrestrial capacity and higher compute pricing. This takes our 2031 revenues up to $784bn. Our target price increase to $268 (from $248) to reflects this terrestrial compute capacity increase, but partially offset by increased capex and lower valuations for AI comparables. Valuations of AI-oriented stocks have fallen over the last two months, which also lowers the upside in our valuation methodology for the AI segment. We also increased modestly increased our outlook for Enterprise & Government Connectivity. Lastly, we raised our Space segment discount rate from 10% to 15% to reflect increased uncertainty represented by this essential part of the business. STRONG Q3 WITH AMBITIOUS PLAN FOR TERRESTRIAL Q3 results were positive, although it is the longer-term outlook that matters. SpaceX reported Q3 diluted EPS of $0.35, significantly ahead of consensus $0.15. Revenue reached $14.58bn, exceeding consensus of $12.88bn. Segment operating income was $2.79bn, well above consensus $1.21bn, driven by smaller-than-expected losses in the Space segment, positive AI operating income and stronger Connectivity margins of 45%, compared to consensus 38% (Exhibit 1). AI Capex of $16.44bn slightly below consensus $16.90bn. EXHIBIT 1: Segment results Segments Reported Bernstein Year ago Reported Bernstein Last Q Year ago Reported Year ago Space 1,767 1,538 1,666 -0.4% -20.8% -56.3% 15.5% 1,606 946 Connectivty 5,248 4,517 3,096 45.1% 39.5% 38.6% 38.4% 1,543 1,130 AI 7,560 6,713 814 5.7% 1.3% -49.1% -211.3% 16,444 749 Total 14,575 12,768 5,576 19.1% 12.2% -1.8% -4.9% 19,593 2,825Revenues ($m) Margins (%) Capex ($m) Source: Company reports, Bernstein analysis and estimates OUTLOOK BY THE SEGMENT - HEADING TOWARD INFLECTIONS Space - Starship is the linchpin and it appears to be going well We continue to see full reusability of Starship as the most important factor for SpaceX long-term growth. SpaceX has demonstrated reuse of the Starship V2 booster and has expressed confidence in the ability to reuse the V3 booster. The more challenging step in full Starship reuse has been the second stage. This year, SpaceX hopes to have the first fully reusable orbital flight next (Launch 15). SpaceX will try to catch both first and second stage on this flight. The company said that its goal is to be performing one launch per week by the end of 1H27 and twice a week by end of 2027. At that point, SpaceX plans to have five operating launch pads (2 in T exas and 3 in Florida). If production of Starship second stages can be performed at least at one every two weeks with reasonable reuse frequency, the planned launch cadence would be feasible. We have not assumed, however, that the company progresses that rapidly. Besides, SpaceX aims to re-fly a Starship GLOBAL AEROSPACE & DEFENSE 2 on 26-Oct-2026 Douglas S. Harned, Ph.D. +1 917 344 8430 douglas.harned@bernsteinsg.com 26 October 2026 second stage by early 2027 and to attempt an on-orbit refuelling early that year. It also plans to start flying Starlink Mobile V2 satellites on Starship in 2027. The first orbital data center launch is targeted at the end of 2027. Musk said SpaceX's internal goal is a first Starship launch from Louisiana (SpaceX next Starship launch site) in 2028. He called 2029 \"highly likely\" and expects the site to be launching at scale by then. He added that the Louisiana spaceport could eventually host 20 or more launch pads. Regarding operational metrics, within Space, the company launched 35 spacecraft during Q3, including 12 for 3rd parties and 23 deployed internally. The MTO was 476 metric tons. Segment revenue of $1.77bn beat consensus estimate of $1.43bn. Operating loss of -$7m also beat consensus of -$323m. Space capex of $1,606m came in above consensus of $1,519m. The history and plan for Starship launches is shown in Exhibit 2. Flight 15 is targeting a catch of both stages, which Elon described as at better than a 50% chance of success. Assuming that launch is successful, Flight 16 would be targeted for the first full reuse. A key part will be the performance of the heat shield on the second stage. The good news here is that the heat shield appeared to have performed well on Flight 14. EXHIBIT 2: Starship’s launch schedule *Flights which have not happened yet Source: Company reports, Bernstein analysis Connectivity - Strong E&G momentum with mobile roadmap taking shape Connectivity is the only segment generating cash at this stage and its operating margin of 45% beat margin estimates of 38%. Because this business becomes heavily about leveraging an inherently global constellation, there should be strong opportunities to expand margins and/or profitably add subscribers in lower income geographies at lower rates with negligible added cost. Revenue of $5.25bn was well above consensus of $4.86bn. On Starlink overall, management reiterated its core message that a significant capacity and performance step-up is expected with the deployment of V3 satellites. Besides, the production of V5 kits has started, easing inventory constraints. Our outlook for Connectivity is shown in Exhibit 3. Starlink consumer broadband sequentially gained 1.6m consumer subscribers vs 2Q26 to reach 13.6mn subscribers in Q3. Sequential subscriber growth slowed to 13% from 17% in the prior quarter, which makes reaching the company’s prior goal of 17m subscribers look unlikely. The ARPU was sequentially improved, reaching $69, benefiting from favorable subscriber mix. The key takeaway, in our view, is that Starlink’s economics are improving faster than its consumer subscriber base. We slightly lower our Consumer Broadband revenue driven by a slower ramp up in subscribers than expected, albeit mostly compensated by a maintained ARPU GLOBAL AEROSPACE & DEFENSE 3 on 26-Oct-2026 Douglas S. Harned, Ph.D. +1 917 344 8430 douglas.harned@bernsteinsg.com 26 October 2026 The company highlighted the growing importance of Enterprise & Government, with revenues up 91% in the quarter, noting that these segments should ultimately rival or surpass the consumer business in revenue contribution. Management also pointed to continued momentum in aviation, with ~12,000 aircraft under contracts (almost a quarter of the available fleet). We count deals signed on at least 46 airlines worldwide, including four of the five largest US carriers (Delta the exception). We increase our E&G outlook through 2026 as a result of a high penetration rate at airlines but also increased commercial traction for maritime and other areas. The company emphasized its commitment to the Mobile business, where we have been most skeptical. Comments on the earnings call continued to indicate SpaceX's desire to build out a broad-based mobile business in the US, which could include building its own terrestrial network. These comments follow the company’s recent acquisition of Grain spectrum and regulatory approval to launch 15,000 V2 mobile satellites. Even though, there is still a long way to go, with potential participation in next year’s Upper C-band auction, SpaceX appears to be aggressively moving forward. On Thursday last week, it was widely reported that SpaceX was in discussions regarding a deal for access to 80,000 of Crown & Castle’s towers. Should SpaceX strike such a deal, it would show full commitment to becoming essentially a fourth mobile network operator in the US. We expect that such a move (including additional spectrum buys) would cost SpaceX more than $100bn over a six to eight year period. e see: SpaceX in Talks for an 80K Tower Deal - A Potential Point of No Return and Implications for US Telcos ). We continue to see an MVNO deal with one of the big three telcos as the best path. But, that will require one of the three to break and do a deal with SpaceX (for more detail, see “ SpaceX: Potential for MVNO D2D growth? Continuing our assessment of SpaceX Connectivity business and telco impact ”). The threat from a SpaceX terrestrial network could trigger such a deal. We remain well below the company’s plan for the Mobile business until we see a more concrete path to build that business. EXHIBIT 3: Connectivity revenue estimates 7 11 17264152631122345282 223759 1119295596141204 2025 2026E 2027E 2028E 2029E 2030E 2031EConnectivity Segment Revenue Breakdown ($bn) Consumer Broadband E&G Mobile Total Source: Company reports, Bernstein analysis and estimates AI - Increased terrestrial capacity with a better $/watt High pricing and more capacity. SpaceX AI segment generated $7.56bn of revenue, c.20% above consensus. This was driven primarily by a faster capacity ramp of terrestrial compute and an high $/watt. The operating income of $431m was above consensus of -$14m, essentially driven by the higher $/watt pricing that SpaceX achieved. AI Capex came in at $16.44bn. For its AI segment, SPCX reported 1.7GW of nameplate compute capacity. That compute capacity is expected to be in the range of 2.5-3 GW by year-end. Some investors remain concerned that SpaceX’s capex over the next two years will build capacity ahead of demand. However, these strong results and the company’s upgraded compute guidance should ease those concerns and reinforce its case for continued investment. The justification for this investment is linked to the pricing the company is seeing on short-term contracts for compute capacity. This started with deals with Google and others at $30-$50 per watt. The view at SpaceX is that short-term deals are best because they see pricing going higher, with evidence from negotiations the companies are having with new customers today. In these negotiations, management indicated pricing above that $30-50 level. GLOBAL AEROSPACE & DEFENSE 4 on 26-Oct-2026 Douglas S. Harned, Ph.D. +1 917 344 8430 douglas.harned@bernsteinsg.com 26 October 2026 Accelerated AI buildout driving meaningful revenue growth, but also materially higher capex. The company guided to Q4 capex of $35-$40B, well above consensus (~$22B), reflecting an accelerated AI infrastructure buildout. Looking further out, management now expects \"almost certainly\" an incremental 10GW of compute capacity by the end of 2027, with a \"non- zero probability\" of reaching 20GW. Elon Musk indicated that the company's objective is to have sufficient power, cooling, and supporting infrastructure in place to enable 20GW of capacity by year-end 2027, highlighting infrastructure availability as the primary bottleneck to scaling. While management aims to maintain excess infrastructure capacity relative to immediate deployment needs, it continues to view a 20GW outcome as “not impossible” . Substantial capex ahead. Despi \u003cli>人形机器人意向高、部署渐进：未来三年64%（60/94家）企业可能采纳，略高于2025年的62%，但部署时间表较2025年调查延后约一年；绿的谐波人形机器人相关订单2026年前三季度同比增4-5倍至约40万台，占减速器总需求近半。\u003c/li>\n\u003cli>光通信无源环节业绩兑现：仕佳光子单Q3营收12.27亿元、同比+116.06%，归母净利2.71亿元、同比+226.19%；联特科技Q3营收5.8亿元、北美CSP客户占比超一半；MPO&amp;DFAU强通胀逻辑初步兑现。\u003c/li>\n\u003cli>PCB/CCL铜箔业绩高增但板块分化：德福科技前三季度营收145.83亿元、同比+71.56%，归母净利4.67亿元、同比+601.75%；10只PCB产业链公司三季报中，南亚新材、金安国纪Q3净利增长超10倍，沪电股份Q3净利同比+161%、环比+60%，但材料显示收盘时PCB板块（含CCL）明显走弱。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>AI算力/大模型与Anthropic IPO\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：营收爆发、算力成本率下行实现经营盈利转正；增长依托高NRR、云渠道、Claude系列Agent；截至2026年6月不可撤销算力采购承诺约2450亿美元，TPU/GPU双线布局，AMD MI450预计2027年交付。\u003c/li>\n\u003cli>今天出现的催化/验证：Anthropic计划在11月16日当周进行IPO；招股书看点强调算力承诺与稀释；AI数据中心建设追踪较前期进一步上修，但融资成本抬升，风险收益比趋于中性。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>半导体/先进封装与持仓拥挤\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：拥挤度模型显示AI半导体为最拥挤子板块，其次为半导体设备与模拟芯片；12只覆盖标的中7只位于最高十分位；KLAC拥挤度自6月起显著低于其他三家设备同行，主因短期增长预期偏弱、存储敞口有限、估值溢价。\u003c/li>\n\u003cli>今天出现的催化/验证：费城半导体指数收盘上涨2.8%，为一个月来最大涨幅；台积电计划将CoWoS价格提高20%；存储板块领涨，PCB板块走弱。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>机器人/物理AI\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：2026年中国人形机器人调查显示64%企业未来三年可能采纳，略高于2025年的62%，但部署时间表较2025年调查延后约一年；物理AI与端侧智能模组被视为长期主线，物理AI依赖高质量、归一化、标准化感知数据，传感器高度一致性是物理训练基础；IMU从姿态控制配角到数采成本主角，订单比人形机器人本体先到，IMU正在被重新定价。\u003c/li>\n\u003cli>今天出现的催化/验证：10月29日2026智元创新日将在上海举行；特斯拉Optimus V3完成量产准备，产线设备就位并给出爬坡与交付时间表；绿的谐波人形机器人相关订单同比增4-5倍至约40万台；元思无界品牌升级，英文名TOPBOT。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>光通信/CPO/无源\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：MPO&amp;DFAU强通胀逻辑初步兑现，订单、业绩拐点、并购陆续落地；光通信需求向无源器件传导，头部厂商单季业绩弹性凸显。\u003c/li>\n\u003cli>今天出现的催化/验证：仕佳光子单Q3营收12.27亿元、同比+116.06%，归母净利2.71亿元、同比+226.19%；联特科技Q3营收5.8亿元，北美CSP客户占比超一半；光库科技Q3归母净利环比+37%；逸飞激光拟现金4亿元收购兴启航100%股权，拓展光模块封装与自动化耦合；AI龙头公告预计1.6T、800G等高端光模块需求保持快速增长，NPO、XPO等下一代光互连产品需求有望逐步释放。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：德福科技HVLP赋能+载体铜箔第二曲线，高端化打开利润弹性；载体铜箔加快国产替代，传统锂电涨价落地夯实盈利基本面。\u003c/li>\n\u003cli>今天出现的催化/验证：德福科技前三季度营收145.83亿元、同比+71.56%，归母净利4.67亿元、同比+601.75%，扣非归母净利4.25亿元、同比+1578.71%；10只PCB产业链公司三季报中，南亚新材、金安国纪Q3净利增长超10倍，沪电股份Q3净利同比+161%、环比+60%；但PCB板块（含CCL）明显走弱，ABF载板相对跌幅更小，存储板块领涨。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>Anthropic招股书看点显示营收高增、算力成本率由2025Q1的251%降至2026Q2的48%，经营盈利转正；截至2026年6月不可撤销算力采购承诺约2450亿美元，TPU/GPU双线布局，AMD MI450预计2027年交付；Anthropic计划在11月16日当周进行IPO，市场估值1.5万亿–2万亿美元。\u003c/li>\n\u003cli>拥挤度模型显示AI半导体（AVGO、AMD、NVDA）为最拥挤子板块，半导体设备与模拟芯片次之；费城半导体指数收盘上涨2.8%，为一个月来最大涨幅；台积电计划将CoWoS价格提高20%。\u003c/li>\n\u003cli>2026年中国人形机器人调查显示64%（60/94家）未来三年可能采纳，略高于2025年的62%，但部署时间表较2025年调查延后约一年；绿的谐波人形机器人相关订单2026年前三季度同比激增4-5倍至约40万台，占减速器总需求近半。\u003c/li>\n\u003cli>仕佳光子单Q3营收12.27亿元、同比+116.06%、环比+33.51%，归母净利2.71亿元、同比+226.19%、环比+36.43%；联特科技Q3营收5.8亿元，北美CSP客户占比超一半；光库科技Q3归母净利环比+37%；逸飞激光拟现金4亿元收购兴启航100%股权。\u003c/li>\n\u003cli>德福科技前三季度营收145.83亿元、同比+71.56%，归母净利4.67亿元、同比+601.75%，扣非归母净利4.25亿元、同比+1578.71%；10只PCB产业链公司三季报中，南亚新材、金安国纪Q3净利增长超10倍，沪电股份Q3净利同比+161%、环比+60%；材料显示收盘时PCB板块（含CCL）明显走弱，存储板块领涨。\u003c/li>\n\u003cli>周观点显示A股止跌企稳信号已现，把握低位主题轮动和科技超跌反弹机会；中东风险推高油价，布油升至117美元；AI信用担忧传导至股市，费半和纳指领跌；内地和香港股市下跌，背后是流动性偏弱、成长股遭抛售，维稳资金入场信号有限。\u003c/li>\n\u003cli>上海市卫星互联网产业创新发展行动方案（2027-2030年）发布，到2030年在轨卫星总数超3000颗，核心产业规模突破800亿元；SpaceX目标价上调至268美元，地面AI建设与企业宽带加入轨道AI逻辑，评级增持。\u003c/li>\n\u003cli>AI应用/软件估值修复：7月初以来SAP、微软、Palantir、埃森哲等公司平均反弹约80%，网安公司年初至今涨幅超一倍；驱动力来自资金面（硬件持仓极致集中后的再平衡）与基本面（“模型吞噬应用”逻辑被证伪）双重共振。\u003c/li>\n\u003cli>其他重点三季报：药明康德前三季度收入455.4亿元、同比+38.6%，经调整净利润183.8亿元、同比+74.4%；诺诚健华前三季度营收21.0亿元、同比+88.2%，净利润6.5亿元，去年同期亏损0.7亿元；百润股份Q1-3营收25.03亿元、同比+10.31%，归母净利6.62亿元、同比+20.44%。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>Anthropic IPO进程与招股书披露，重点跟踪ARR变现率、融资成本、2028年可见度；算力采购承诺的交付与付款节奏，2027年集中交付，AMD MI450预计2027年交付。\u003c/li
