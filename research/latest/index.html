-10-18 22:39", "source_label": "帖子正文", "excerpt": "看好AI4S&物理AI&AI安全等落地场景，低位板块共振有望延续。", "content": "", "publish_time": "2026-10-18 22:39", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-18T19-30:3857af98dd54": {"id": "post:2026-10-18T19-30:3857af98dd54", "kind": "post", "title": "2026-10-18 19:30", "source_label": "帖子正文", "excerpt": "美银——常见问题解答——人工智能建设的经济学 当前美股会议中，90%的讨论围绕人工智能（AI），仅10%涉及其他主题，但所有问题最终都可归结为一个核心：AI的资本支出（capex）回报能否超越其资本成本？美银证券（BofA Securities）量化策略团队认为： 1. AI capex 周期大概率", "content": "美银——常见问题解答——人工智能建设的经济学 当前美股会议中，90%的讨论围绕人工智能（AI），仅10%涉及其他主题，但所有问题最终都可归结为一个核心：AI的资本支出（capex）回报能否超越其资本成本？美银证券（BofA Securities）量化策略团队认为： 1. AI capex 周期大概率仍有进一步上行空间； 2. 真正决定投资成败的唯一关键，是商业化变现能力能否覆盖资本成本； 3. 现阶段最佳机会可能不在科技板块内部，而存在于AI应用采纳者、大宗商品及实体建设相关标的。 对标普500指数未来12个月持风险回报平衡观点，但长期看好美国企业整体。在信息技术（Info Tech）与通信服务（Comm Svcs）板块内部，经过2026年市盈率（PE）压缩后，竞争格局更趋均衡与理性，因此对上述两板块均持市场权重（market-weight）建议。 AI Capex的“金发姑娘”情景 投资者不应孤立追踪AI capex，而应将其与AI营收相对照。随着AI相关营收加速增长而capex增速放缓，超大规模云厂商（Hyperscalers）的自由现金流（FCF）有望在2027年下半年由负转正。主要风险在于：今年以来AI capex的上修幅度（约50%）远超营收上修幅度（约20%），因此2027年的市场预期意味着趋势必须出现显著逆转。此外，团队基于至2030年的算力需求估算，隐含累计支出约10万亿美元，较当前预测高出2万亿美元。 投资资本回报率（ROIC）的潜在区间 AI回报最终取决于消费者、企业与政府三大终端支出。 • 消费者端：类比公用事业（Utilities），AI已成为刚需且提供商具备定价权。实证显示，按实际购买力计算，美国消费者目前为流媒体内容支付的费用较1995年有线电视高出50%。 • 企业端：若仅10%的美国劳动力被AI优化，以2026年预计13万亿美元工资总额推算，潜在年度AI总可寻址市场（TAM）高达3万亿美元。 在假设资本成本固定为10%的情景分析下，至2030年预期 excess returns（超额回报）年化为亏损5000亿美元至盈利近1万亿美元不等，基准情景为+2000亿美元。政策环境更可能充当“看跌期权”（put）而非阻碍，安全网已现雏形（如英特尔INTC案例）。AI已超越商业范畴，成为大国博弈的“战争”。（此外，多数数据中心位于美国红色州。） 引发抛售的催化剂：超大规模云厂商的WACC已翻倍 该类企业的加权平均资本成本（WACC）目前为10%，较2023年的4%大幅上升。根据基本财务原理，只要增量投资资本回报率（ROIIC）高于WACC，投资就具备经济意义。当前风险来自通胀、实际收益率、信用事件、监管收紧、股票供给超过需求等。尽管资本依旧充裕（美国家庭净资产创196万亿美元纪录，超过至2030年的AI支出预估），但其他风险包括变现缓慢、去通胀、信用风险。产能过度建设的风险相对较低，因为瓶颈因素会自然限制扩张速度，除非重演90年代末电信泡沫。 AI对股市的长期影响：生产力革命 AI是美银长期看多“效率牛”的关键燃料：流程可扩展、能见度提升、股票风险溢价（ERP）下降。其劳动力效率因子持续领先。医疗保健板块近期已有改善，且充满AI应用案例。金融板块处于“甜蜜点”（监管松绑+生成式AI用例），但尚未在数据中显现效率提升。 市场角色划分：支出方、受益方、交易所与网络安全 • 支出方：早期以政府为主，当前核心为超大规模云厂商（微软、甲骨文、亚马逊、Meta、谷歌）及新云（neoclouds）。 • Capex受益方：从全球半导体/硬件，延伸至大宗商品（金属、能源、公用事业等）、工业设备及其他工业产出相关领域。终端市场涵盖企业、消费者与政府。 • 次生领域：新兴的计算交易所（compute exchanges）充当算力定价仲裁者；网络安全公司则扮演AI“看门狗”。 重大转变：从“所有人投资科技”到“科技投资一切” 美国制造业经历十余年投资不足后，科技公司的资本开支正从软件转向实体：包括不动产、厂房与设备（PP&E）以及工业设备。半导体板块见证了资本的大规模转移——五大超大规模云厂商与三大半导体公司（英伟达、美光、博通）的远期FCF走势分化。 第二层受益者：从芯片到实体经济的传导 半导体捕获了第一波红利，但下一波浪潮属于实体经济：每吉瓦（GW）AI容量的成本中，约40%流向网络、电力、冷却和建筑，而非服务器/GPU。仅电气化一项带来的铜需求增长，就相当于过去十年所有行业的总和。生产力繁荣的传导路径是：技术首先让经济制造更多实物（电网、电厂、数据中心、工厂），这些供应商无论最终哪种AI模型或应用胜出都能获得报酬。 终端市场深度拆解 • 企业：约80%的AI潜在价值位于企业层。若以可被AI替代的岗位工资测算，年度订阅TAM在熊/基/牛情景下分别为0.5万亿/1.5万亿/3.3万亿美元。 • 消费者：流媒体 vs 有线电视的案例表明，消费者对技术迭代的支付意愿强劲。 • 政府：作为第三大终端市场正在崛起，美国联邦AI合同义务在2025财年达11.6亿美元，较2019年增长超两倍。 守护者与仲裁者 • 网络安全：代理型AI（agentic AI）带来的新攻击面、新身份识别与新治理需求，将支撑更高的安全估值。 • 计算交易所：算力成本目前难以对冲，但衍生品市场正在形成。CME的NYMEX可能最快于11月9日推出计算期货，五年内潜在市场规模可超1万亿美元。GPU租赁价格波动率介于原油与美股大盘之间。 资金来源与融资动态 最大AI支出方主要通过经营现金流提供资金，但资本开支已侵蚀现金流，资本市场（主要是债务）成为桥梁。微软是唯一一家未来12个月FCF预估未跌入负值区间的超大规模云厂商。投资银行虽从发债/发股中获益，但并非AI融资生态的核心玩家；2026年高盛与摩根士丹利曾作为AI交易的杠杆代理，但近期该相关性已破裂。 支出规模与持续时间 实体建设通常耗时更长、耗资超预期。基于2030年前的需求估算，累计需新增212GW容量。以每GW 400亿美元保守估算，2026-2030年潜在支出达9.5万亿美元，比当前超大规模云厂商与新云合计capex预测（7.4万亿美元）高出2.1万亿美元。 Capex与营收：哪个更会超预期？ 自2024年以来，capex的连续上修已成常态，2027年预期自去年底以来已上调81%。AI相关营收虽也有上修，但幅度小得多（同期+24%）。更多支出本身并非问题，关键在于ROIIC能否覆盖WACC。超大规模云厂商的capex/经营现金流比已从2023年的50%升至当前的95%，表明除非营收大幅超预期，否则需持续募资，而募资通常推高资本成本。 情景分析：熊市、基准与牛市 • 熊市：产能跑赢需求，定价与利用率走弱，运营成本居高不下，芯片折旧加速，核心业务放缓。 • 基准：变现稳步追赶建设进度。 • 牛市：强劲需求与定价权结合，运营效率提升。 在资本成本（WACC）与税率固定的假设下，基准与牛市情景到2030年可产生正经济价值，熊市则可能摧毁价值。 周期位置：中段，仍有运行空间 从占美国GDP比例看，超大规模云厂商capex似已处晚期；但从盈利能力（如占EBITDA比例）调整看，capex周期似乎还有更多上行空间。 短期杀手锏：更高的WACC WACC由三部分驱动：无风险利率（10年期美债收益率较疫情低点高出逾4个百分点）、债务成本（超大规模云厂商到期收益率趋势上行）、股权成本（贝塔系数上升、无风险利率与ERP推高）。不过，资本成本上升并非全是坏消息——部分反映政府债务负担加重，部分反映经济活力增强（生产力增长、监管松绑、名义增长提速），更高的门槛率是更具活力经济的代价。 选举风险与数据中心：州级动态主导 市场担忧民主党横扫将威胁AI capex，但美银认为选举风险可控。AI建设的战略重要性确保联邦层面支持强劲，且建设更多由州政府驱动——多数大型数据中心位于红色/紫色州，州政策制定者倾向于通过针对性立法回应公众关切，而非彻底禁止。 生产力：牛市的终极逻辑 金融与医疗保健板块兼具庞大劳动力成本基数和清晰的AI部署路径。金融业自全球金融危机（GFC）后监管累积导致结构性低效，如今AI+去监管有望弥合差距。医疗保健领域，多数临床试验成本处于AI可影响超20%的类别。历史上，80年代、90年代及2020年至今的生产力繁荣均伴随股票风险溢价（ERP）下降。美银量化因子显示，高效股票持续跑赢低效同业。 如何盈利：策略与因子 当前市场定价已反映部分宏观风险，但基本面因AI而增强的领域（如房地产、公用事业）存在机会；采纳确定性高的板块（医疗、金融）值得布局； disruption风险被高估的领域（商业服务等）亦有空间。TMT板块估值已压缩至中性，看空消费品（但若AI创造新岗位则可能成为弹簧）。 两个关键量化因子： 1. ROIIC-WACC 因子：1990年以来，ROIIC与WACC利差最高的标普500公司（剔除金融）年化跑赢最低利差同业约1.6个百分点。 2. 劳动力密集度因子：员工数/实际销售额最低的公司年化跑赢最高密集度公司约3.6个百分点，且差距在科技/自动化/AI时代扩大。#文字观点", "publish_time": "2026-10-18 19:30", "tags": ["文字观点"]}, "post:2026-10-18T19-14:9794c964060c": {"id": "post:2026-10-18T19-14:9794c964060c", "kind": "post", "title": "2026-10-18 19:14", "source_label": "帖子正文", "excerpt": "AI应用持续，关注AI剧/互动影游等 一、市场持续关注传媒互联网AI应用机会，我们梳理近期有变化方向如下： 【AI剧】AI内容生产能力继续由短剧向长剧、电影渗透，优质IP、内容工业化能力及平台分发价值有望放大。#相关标的：上海电影、芒果超媒、阜博集团", "content": "AI应用持续，关注AI剧/互动影游等 一、市场持续关注传媒互联网AI应用机会，我们梳理近期有变化方向如下： 【AI剧】AI内容生产能力继续由短剧向长剧、电影渗透，优质IP、内容工业化能力及平台分发价值有望放大。#相关标的：上海电影、芒果超媒、阜博集团；新增关注#中国电影（《流浪地球3》上部定档2027年2月6日）、#奥飞娱乐（2027年推出《喜羊羊与灰太狼》IP动画大电影，同时积极探索AI+IP产业化合作）。 【世界模型/互动影游】字节正在筹备基于Seedance打造面向时空视频生成的AI模型界。应用端已有明显布局：抖音上线互动空间，剪映布局AI互动影游，红果内测互动剧续写，猫箱发力AI剧集。#我们认为，世界模型若进一步降低互动内容生产成本，IP、剧情资产、游戏研发和空间交互能力的重要性有望提升。关注低PE游戏公司，以及#风语筑（数字空间及XR场景积累，积极布局空间智能和物理AI）。 【AI游戏】继续重点推荐：#心动公司。今年约10xPE，存量游戏稳健，重点新品《RO2》如顺利预计27Q1；TapTap有望回暖，27年新游推广需求有望好于26年，同时AI创作平权有望继续增强社区生态和平台价值。 【AI广告】#汇量科技10月新AIinfra即将上线有望打开IAP投放增长空间。 【办公Agent / Personal Agent】继续关注#腾讯控股。向上催化的核心仍在于AI投资ROI的逐步验证（WorkBuddy等）。 二、低波红利继续重点推荐#南方传媒和#分众传媒。1）南方传媒：广东教育出版国企，经营稳定，积极探索AI内容版权、AI教育等方向。2）分众传媒：新潮传媒并购取得实质性进展，中长期关注整合后市场份额及经营效率提升。 三、大模型：Anthropic Q3数据引发市场对AI高增长持续性的讨论。公司披露26Q3收入约168亿美元，环比45%（Q1 47亿、Q2 116亿），连续第二个季度实现调整后盈利；此前一轮融资估值约9650亿美元，IPO估值讨论超过2万亿，目前预期约1.5万亿。#我们认为市场主要担忧环比增速放缓，但Q3也受到蒸馏封禁、OpenAI竞争以及部分客户支出收缩等扰动。Anthropic收入增长主要是Claude Code、企业API等高价值场景继续增长，若需求空间进一步打开或增速企稳盈利改善有望修复估值。#文字观点", "publish_time": "2026-10-18 19:14", "tags": ["汇量科技10月新AI", "文字观点"]}, "post:2026-10-18T09-25:7dd5a9460b42": {"id": "post:2026-10-18T09-25:7dd5a9460b42", "kind": "post", "title": "2026-10-18 09:25", "source_label": "帖子正文", "excerpt": "领益智造工厂调研：AI 服务器及光模块液冷业务推动未来增长🔍我们近期走访了领益智造子公司瑞达在东莞的工厂。📈管理层对于公司从消费电子向 AI 数据中心业务拓展保持乐观，业务方向涵盖液冷与电源管理。", "content": "领益智造工厂调研：AI 服务器及光模块液冷业务推动未来增长🔍我们近期走访了领益智造子公司瑞达在东莞的工厂。 📈管理层对于公司从消费电子向 AI 数据中心业务拓展保持乐观，业务方向涵盖液冷与电源管理。 🧊在液冷业务方面，公司坚定推进产能扩张；同时强调产品已经进入全球头部云服务商供应链，并且正在向其他 GPU、ASIC 平台拓展，以此支撑未来业务增长。 🖥️管理层对 AI 服务器机箱业务的积极态度，与我们对全球服务器整体市场规模的判断保持一致。我们预测等效 NVL72 规格的 AI 服务器机架（包含英伟达与 AMD 产品）出货量，2026‑2028 年预测分别为 5.5 万台、10.5 万台、16.3 万台。 核心要点 📊液冷业务推进产能扩张：管理层坚持长期产能扩张目标，计划将液冷产能提升至远高于当前的水平。 🌐公司依托领益智造的全球布局与成熟自动化生产能力落地液冷产能扩建。 🏭除中国以外，公司现有液冷生产基地位于菲律宾；还计划进一步布局越南、泰国，贴近 ODM 厂商。 ⚙️中国依旧是生产效率最高的地区，同时公司会推进产地多元化，提升液冷组件业务的灵活度。 ✨公司会更加聚焦新产品，例如最新 AI 服务器机架开始采用的光模块液冷产品，以及盈利水平更优的品类。 🛡️竞争优势：管理层对自身服务全球头部云服务商的行业地位保持乐观。 ⚠️新进入者需要花费较长时间完成客户资质认证，叠加旺盛的市场需求、产品规格迭代速度快，共同抬高行业准入门槛。 🔧凭借服务全球主流 GPU 平台 AI 服务器机架积累的经验，公司正向其他 GPU、ASIC 平台拓展，进一步丰富产品矩阵。 🌍领益智造的海外产能、成熟自动化生产能力以及金属精密加工能力，同样强化了液冷组件的生产实力。 估值部分 💰我们对领益智造给予买入评级。 🎯12 个月目标价 18.1 元人民币，对应 2027 年预测每股收益 29.5 倍目标市盈率。 📈29.5 倍的目标市盈率来源于两方面：一是对标同行 2027 预测市盈率与 2027‑2028 预测每股收益增速的最新相关关系；二是公司自身 2027‑2028 年每股收益同比增速。 ⚠️主要风险：折叠手机、AI 终端渗透率不及预期；面临更多供应商带来的潜在竞争。#文字观点", "publish_time": "2026-10-18 09:25", "tags": ["文字观点"]}, "attachment:files/1018脱水研报.pdf": {"id": "attachment:files/1018脱水研报.pdf", "kind": "attachment", "title": "1018脱水研报", "source_label": "其他", "excerpt": "周策略：坚守底线 2026-10-1822:22:23 【摘要】：每周周策略，不读不要做交易!现在美股调整的核心原因，是美国AI产业的增长速度，可能已经开始跟不上资 本市场的预期了。", "content": "周策略：坚守底线 2026-10-1822:22:23 【摘要】：每周周策略，不读不要做交易! 现在美股调整的核心原因，是美国AI产业的增长速度，可能已经开始跟不上资 本市场的预期了。 先说美国经济。9月份美国核心CPI环比上涨0.33%，高于市场预期，能源价格 更是上涨了5.2%。按理说，通胀重新抬头，美股应该非常担心美联储继续加息。 但其实这次通胀超预期并没有那么可怕，因为美联储本来就知道通胀短期很难降 下来，而且美联储官员最近的表态也比较温和。目前市场定价10月份加息的概 率只有17%，所以至少在短期内，通胀不是决定美股方向的主要因素。 美债这边，我发现，今年以来美国10年期国债收益率的驱动因素发生了明显变 化。 上半年主要受到油价和通胀影响，到了下半年，越来越受到美国经济增长预期的 影响。而美国经济增长预期，又越来越依赖AI投资。尤其9月底以后，10年期 美债收益率和纳斯达克指数开始出现很强的相关性。说白了，市场已经开始把 AI资本开支当成美国经济增长的重要发动机。 AI投资越旺盛，美国经济增长预期越强，实际利率就越容易上升；反过来，如 果市场怀疑AI资本开支明年会放缓，美国经济增长预期就会下降，美债利率也 会跟着回落。 所以我觉得现在美国经济越来越像AI经济，美债利率某种程度上也开始变成AI 利率。 最近OpenAI的收入增长数据已经让市场有些失望，而本周Anthropic，也就 是Claude背后的那家公司，又披露了一组让投资者不太放心的数据。根据文章 提供的信息，Anthropic今年6月底的年化收入已经达到650亿美元，市场原 本预计，到9月底应该接近800亿美元，年底则有望达到1000亿美元。但公 司最新透露，第三季度收入是168亿美元。这个数字看上去很漂亮，毕竟环比 增长了45%，可如果简单乘以4，得到的年化收入只有672亿美元，明显低于 市场预期。 我还考虑了一种可能性，就是公司为了防止模型蒸馏，主动限制部分业务，导致 收入受到5%到7%的影响。但即使把这部分加回去，年化收入也只有720亿美 元左右，仍然达不到预期。 不管是OpenAI还是Anthropic，市场此前给出的估值，都建立在未来几年收 入持续高速增长的假设上。Anthropic甚至被讨论到2万亿美元的估值水平。这 种估值最怕什么？不是现在不赚钱，而是增长速度开始低于预期。 因为投资者之所以愿意接受这么高的估值，就是相信它未来能够以非常惊人的速 度扩大收入。如果收入兑现不了，估值体系就得重新调整。 更麻烦的是，AI模型公司的问题并不会只停留在模型公司身上。大家想一想， 现在美国整个AI产业链的投资逻辑是什么？ 微软、谷歌、亚马逊等科技巨头投入巨额资本开支，购买英伟达GPU、建设数 据中心，再把算力提供给OpenAI、Anthropic以及其他AI企业。这套商业模 式能够持续运转，有一个非常重要的前提，就是下游客户的算力需求要持续增长， 而且最终能创造足够多的收入。 如果模型公司的收入增长开始放缓，云厂商自然就要重新评估2027年到底还需 要购买多少GPU、建设多少数据中心。资本开支只要从原来预期的高速增长变 成温和增长，对整个AI硬件产业链的估值都会产生很大的冲击。 这就是现在美股真正担心的事情：不是AI技术没有前途，而是AI商业化的速 度，可能暂时支撑不了如此庞大的投资规模。 我gz号也写了，这当中最危险的就是CoreWeave这样的高杠杆算力企业。它 的商业模式说白了就是借钱买GPU，建设数据中心，再把算力出租给客户。如 果未来订单持续增长，这个模式可以快速扩张，但如果客户需求低于预期，问题 就来了。GPU和数据中心的投资已经花出去了，贷款利息还得继续支付，设备 折旧也不会停下来。如果出租收入跟不上，企业的现金流就会承受很大压力。 本周CoreWeave不仅股价大幅下跌，甚至跌破了长期技术支撑位，信用违约掉 期价格也明显上升。这意味着市场担心的已经不只是股价贵不贵，而是开始重新 评估这些高负债AI基础设施公司的信用风险。股票市场和信用市场同时出现警 告信号，是值得重视的变化。 那么接下来美股会怎么样？我认为，短期市场已经开始出现恐慌，上周五VIX 期货的上涨速度明显超过了股指下跌所对应的正常水平，说明避险需求正在快速 增加。 但我也不认为美股会一直这样跌下去，因为真正决定AI投资逻辑能不能继续成 立的证据，很快就会出来。10月21日Meta公布财报，28日谷歌和微软公布 财报，29日轮到亚马逊。这轮财报季，市场最关心的不是这些公司总利润增长 了多少，而是云业务到底增长得怎么样，AI相关订单有没有放缓，以及***会不 会下调明年的资本开支预期。此外，Anthropic上市前的正式招股书也非常重要， 因为届时可以看到更详细的经营数据，不需要再依靠各种传闻和不完整的收入数 字猜测。 我对美股的短线策略也很明确，如果下周市场继续下跌，到了周中，反而准备可 以考虑买入一些纳斯达克看涨期权，博弈月底财报季带来的反弹。也就是说，我 对AI产业的中期增长预期开始转向谨慎，但认为市场短期恐慌之后，可能出现 一次交易性的反弹。 讲完海外，我们回头看看国内。 先看宏观。9月份中国公布了一系列经济数据，我觉得最值得关注的，还是国内 经济内外分化的问题。出口表现依然非常强劲，9月份出口同比增长36.3%，进 口增长31%，贸易顺差进一步扩大到了1326亿美元。至少从这些数据来看， 中国制造业的国际竞争力仍然很强，外部需求也没有出现市场之前担心的明显衰 退。但国内需求的情况就没那么好了。 9月份CPI同比只有0.9%，核心CPI增长1%，而PPI却从上个月的3.8%进一 步上升到5%。为什么工业品价格涨得这么快，消费品价格却没什么反应？主要 还是原油、煤炭、有色金属这些上游大宗商品涨价，推动了工业品出厂价格上涨， 但下游消费需求不够强，企业很难把这些成本上涨完全转嫁给消费者。 金融数据也能说明这个问题。9月份新增人民币贷款1.08万亿元，比去年同期 少了2100亿元。社会融资规模新增3.55万亿元，看上去还不错，但很大程度 上依赖政策性融资支撑。真正反映企业经营和居民投资意愿的M1增速，反而从 4.1%下降到了3.2%，M2增速也有所回落。这说明什么？我觉得就是政府和政 策性资金还在努力托住经济，但私人部门主动加杠杆的意愿仍然不足。企业不愿 意扩大投资，居民不愿意增加负债，房地产也没有出现明显复苏。出口很好，但 出口赚回来的钱，并没有充分转化成国内需求的扩张。 还有一个值得关注的变化，就是人民币汇率。最近人民币持续升值，背后的支撑 主要来自出口韧性和企业积累的结汇需求。特别有意思的是，今年美元对很多货 币都比较强势，但人民币却表现得相对坚挺，传统的中美利差定价逻辑已经解释 不了全部走势。不过我对人民币继续大幅升值的空间比较谨慎。 说到国内政策，我觉得目前市场也不必抱有太激进的预期。中美经贸关系近期释 放了一些稳定信号，但真正能够改善国内企业盈利和居民消费的，仍然需要内需 政策进一步发力。特别是房地产，目前市场反复交易政策放松的预期，但真正有 足够力度的新政策还没有看到。 如果未来能够出台更直接的居民消费支持政策，或者进一步改善房地产销售和居 民资产负债表，对A股的意义会比较大。但在这之前，我还是认为国内经济处 于一个缓慢修复、结构分化的阶段。 接下来重点讲大盘。 上周A股确实跌得非常惨。上证指数一周下跌2.56%，沪深300下跌3.4%， 中证500和中证1000都跌了6%以上，创业板指数更是下跌8.9%，科创50 下跌6.77%。从行业来看，31个申万一级行业只有两个上涨，分别是银行和食 品饮料。通信行业一周下跌10.87%，电子行业下跌8.75%，科技成长股几乎成 了重灾区。相比之下，港股反而相对抗跌，恒生指数全周仅下跌0.1%，恒生科 技下跌2.13%，类似阿里、美团这种我觉得已经企稳了。 这说明A股这轮调整已经不完全是海外科技股下跌造成的，我们自己的市场交 易结构存在比较严重的问题。 这轮调整最初当然有产业预期变化的影响，尤其是美国AI产业开始受到资本开 支和信用风险的质疑，国内科技股自然承压。但如果仅仅是基本面预期变化，很 难解释为什么A股跌得比很多海外市场还要惨。真正放大跌幅的，是国内机构 资金出现了比较明显的负反馈。 这个问题其实从7月份就已经开始了。当时市场对科技股的预期非常乐观，大量 资金集中涌入，很多机构都在追涨。尤其是**收益资金，包括保险、年金、固收 +和部分私募产品，原本追求的是稳健收益，但在科技股不断上涨的时候，也开 始增加成长股仓位。结果市场突然转向以后，这些资金反而成了最急着卖出的人。 为什么？因为**收益资金和普通股票基金的考核机制不太一样。很多产品有明确 回撤限制或者止损要求，涨的时候可以不断追，跌到一定程度却必须控制风险。 特别是此前积累了比较多浮盈的机构，随着市场持续下跌，盈利越来越少，甚至 接近产品的止损线，这时候基金经理即使觉得股票已经便宜，也未必能够继续持 有。所以我们看到一个很反常的现象，很多基本面没有发生明显变化的公司，股 价却越跌越厉害。不是所有投资者都突然看空了企业，而是越来越多资金不得不 卖出。 很多机构资金的卖出行为互相影响，最后形成了整个市场的负反馈。融资盘也在 收缩，截至10月15日，两融余额大约2.5万亿元，融资买入占比回落到7.57%。 所以这次下跌不是某一家机构砸盘这么简单，而是整个资金结构在调整。 这也解释了为什么最近A股反复出现一种非常让人难受的走势，就是跌下去以 后有人买，拉起来以后又被卖。 尤其上周四、周五，尾盘明显可以看到宽基ETF出现大额买盘，上证指数也在 3700点附近获得了承接。但问题是，这些资金主要是在市场下跌的时候维护指 数，并没有形成持续主动买入成长股的力量。很多投资者看到ETF放量，就以 为***全面进场、牛市要回来了，但实际情况没有那么简单。 我觉得这里要区分两件事。一个是防止市场出现流动性危机，另一个是推动市场 重新上涨。 这两者需要的资金规模和买入方式完全不同。如果大资金主要买沪深300、上证 50这些宽基ETF，那它能够明显改善大盘权重股的表现，也可以避免指数快速 失控，但很难直接解决创业板、科创板以及中小市值成长股的抛压。尤其现在机 构持仓最拥挤的方向恰恰集中在科技成长股，大盘指数暂时稳住，并不代表这些 股票的卖盘已经全部消化。 还有一个很重要的问题，就是A股这轮下跌并没有出现大家传统印象中那种特 别激烈的恐慌式放量。恰恰相反，本周沪深两市日均成交额只有1.56万亿元， 比前一周继续下降。成交越来越少，说明很多愿意主动买股票的资金只剩大哥了， 但机构的卖盘还在陆续释放。 于是就形成了现在这种局面，下跌的时候未必有多大的抛压，但因为买盘不足， 股价仍然容易下行。好不容易有大资金把指数拉起来，之前被套住或者想降低仓 位的机构，又趁着反弹继续卖出。 那么现在距离底部还有多远？我的判断是，短期最猛烈的杀跌阶段，大概率已经 接近尾声，但距离新一轮持续上涨，还有一段路要走。 为什么这么说？ 首先，从指数位置来看，上证指数上周最低下探到3674.82点，距离此前 3674.40点的关键位置只有不到半个点，随后出现明显反击。3741点和3674 点附近，已经成为市场比较重要的支撑区域。创业板指数最低下探到2932点， 也接近本轮上涨行情回撤一半的位置。从技术上看，这些位置具备形成阶段性底 部的条件。 其次，经过这轮调整，科技股原本非常拥挤的交易结构已经得到明显缓解。通信 和电子板块的机构持仓浮盈，已经下降到历史大级别调整的底部区域，赚钱效应 也接近历史低点。从估值来看，创业板目前的市盈率大约32倍，处于历史18.5% 左右的分位。通信行业随着三季报和明年业绩逐步兑现，静态估值也有机会回到 历史中位数以下。换句话说，很多股票经过连续下跌，已经开始出现估值吸引力。 但问题在于，估值便宜不等于马上上涨。特别是在机构风险偏好下降的时候，股 票即使已经很便宜，只要还有人需要减仓，就可能继续下跌。而且现在市场对 AI产业未来两年的增长预期也正在发生变化，如果2027年的盈利预测继续下调， 当前看起来便宜的估值，也可能没有想象中那么便宜。 因此，我对后市的判断分成三个层次。 短期来看，市场已经明显超跌，随着机构卖盘逐渐释放，10月下旬到11月出现 一次比较像样的反弹，我认为概率正在提高。 中期来看，市场仍然处于弱势震荡和筹码重新分配的阶段，不能把一次反弹直接 理解成新一轮牛市开始。 长期来看，我没有因为这轮调整就彻底否定中国权益资产的投资价值，但未来上 涨需要新的盈利增长和资金支持，而不能继续依赖之前那套估值不断扩张的逻辑。 接下来怎么判断市场真正企稳？我主要看三个信号。 第一个是大资金买入能否从尾盘护盘，变成盘中持续承接。尤其是成长类ETF 能不能出现连续净流入，而不是只有大盘权重股被买起来。 第二个是科技股能不能在利空出现时不再创新低，龙头公司公布好业绩以后，能 不能连续上涨，而不是涨一天就被卖掉。 第三个是10月底三季报和公募基金持仓数据。三季报能够检验企业盈利有没有 跟上此前的股价上涨，而基金三季报能够帮助我们判断TMT到底还有多少拥挤 仓位没有消化。再结合美股纳斯达克能不能止跌，基本就能判断这轮调整有没有 真正进入结束阶段。 最后讲讲板块机会。 防御资产里面，我仍然比较看好黄金。 最近美国实际利率一度处于比较高的位置，按照过去的经验，黄金应该承受很大 压力，但金价在4000到4100美元附近表现出比较明显的支撑。为什么？ 我觉得一个重要原因是，黄金的定价已经不完全取决于美国实际利率，全球央行 持续购买黄金，以及投资者对主权信用和货币体系的担忧，都在提供额外需求。 接下来如果美国AI投资预期放缓，带动美债实际利率回落，同时中东局势继续 支撑油价，黄金可能重新获得上涨动力。当然，短期金价能不能确认底部还需要 观察，但从中期资产配置角度看，我仍然认为黄金和优质黄金矿业公司值得重点 关注。 一个是简单题紫金，另外A股层面我最近觉得山金国际是不错的，往上有个 20-30%空间，港股这边灵宝波动太大受不了的可以换这个。 再来说科技。 对于AI硬件，我的态度现在比原来谨慎一些，前面海外部分已经讲过，市场正 在重新评估2027年AI资本开支的增长速度。如果明年的资本开支增速低于今 年，到了2028年又继续放缓，那么过去依靠GPU紧缺、光模块紧缺、产能紧 缺获得高估值的公司，就需要面对新的估值环境。尤其随着产业链不断扩产，很 多原来非常稀缺的硬件供给，未来可能逐步改善。之前大家愿意为了供不应求支 付很高的估值，未来未必。 不过，科技股经过这么大幅度的调整，也确实有一些公司开始进入值得重新研究 的区域。 反弹是大概率会有的，但绝大多数科技不要想着能回创新高，要有这个觉悟，反 弹起来了降本是一定要做的。 具体到光模块，我接下来会重点看三季报。如果龙头企业的利润明显超预期，订 单和毛利率都能证明经营情况依然很好，而股价已经经过充分调整，那就可能出 现估值修复机会。但如果三季报只是兑现了市场原来的预期，2027年的增长反 而面临下修，那反弹之后仍然可能继续承压。 国产算力我觉得需要单独看。国产化替代是一个真实存在的长期趋势，政策也在 持续推动国产算力基础设施建设，但政策支持不等于所有国产算力企业都能马上 兑现利润，尤其在整个AI硬件估值体系承压的时候，国产算力即使具备一定独 立性，也很难完全不受影响，国产周五盘后的最大利好主要是乌兰察布的视察， 股价已经回低位了，看看资金怎么交易，但是这一轮不管什么科技票反弹到日线 55线附近是一定要降本的。 医药这边药明康德高位已经提示过卖了，等跌下来再买。经过调整以后，部分优 质企业的中期投资价值反而可能提高，还是药明系最后能出业绩。宁德反正这个 位置处于一个比较低估的位置，有大哥护盘的情况下筑底是大概率。", "status": "extracted"}, "attachment:files/GS-中国PCB行业：景旺电子 —AI服务器与光模块PCB产能持续扩张.pdf": {"id": "attachment:files/GS-中国PCB行业：景旺 BM容量下降还会把部分数据转移到外部存储，增加KV Cache及Nvidia CMX等场景的NAND需求。因此，HBM降规格反而可能利好企业级SSD。 AI存储需求正从HBM扩散至DDR和NAND 瑞银预计，2027年全球AI GPU及加速器出货量约2,849万颗，同比增长68%。 服务器DRAM位元需求预计增长83.1%，单台服务器平均DRAM容量由2026年的927GB升至2027年的1,455GB，同比增长57%。其中，AI服务器平均内存容量预计由约9TB进一步提升至14.8TB。 NAND方面，服务器SSD位元需求预计2026年增长88%，2027年继续增长55%。AI基础设施带来的存储需求已经不再局限于HBM，而是扩散至服务器DDR、SOCAMM及企业级SSD。 HBM客户结构也趋于多元。Nvidia的需求占比预计由2026年的58%降至2027年的41%；Google由18%升至31%，AMD由7%升至12%。行业对单一客户的依赖有所下降。 供需和价格仍处于上行周期 2027年DRAM位元供给预计增长24.4%，终端需求增长38.9%，供给充足率为-5.0%，意味着行业仍存在约5%的供给缺口。 其中，服务器是最主要的需求来源。服务器DDR需求快速增长，而PC DRAM需求基本持平，手机DRAM需求仅增长约3%。 NAND位元供给和需求在2027年分别增长22.8%和23.7%，供给充足率约为-1.1%。虽然紧张程度低于2026年，但行业仍未进入明显过剩状态。 瑞银预计，2027年DRAM综合ASP同比上涨45%，DDR ASP上涨约41%，HBM ASP上涨约80%。这意味着未来盈利增长不仅来自出货量，也高度依赖价格继续上行。 三星扩产的影响可能推迟至2028年末 三星DRAM月产能预计由2026年四季度的约70万片，提高至2027年四季度的82万片，净增加12万片，主要来自P4完成爬坡以及P5-1自2027年7月开始导入设备。 进入2028年后，三星可能进一步扩充P5-1，并对P2、P3进行去瓶颈，全年新增DRAM月产能可能超过15万片。 不过，从洁净室启用、设备导入到良率爬坡需要较长时间。瑞银判断，这些新增产能真正影响行业供需，可能要等到2028年末。#文字观点", "publish_time": "2026-10-18 20:27", "tags": ["文字观点"]}, "post:2026-10-18T16-51:283c55918b84": {"id": "post:2026-10-18T16-51:283c55918b84", "kind": "post", "title": "2026-10-18 16:51", "source_label": "帖子正文", "excerpt": "臻宝科技交流纪要—20261018 #已完成硅、石英、陶瓷、碳化硅四大材料及涂层技术的全部布局，实施一体化战略；其中碳化硅零部件材料已完全攻克，可应对高射频电源场景下硅材料刻蚀过快的替代需求。", "content": "臻宝科技交流纪要—20261018 #已完成硅、石英、陶瓷、碳化硅四大材料及涂层技术的全部布局，实施一体化战略；其中碳化硅零部件材料已完全攻克，可应对高射频电源场景下硅材料刻蚀过快的替代需求。 #静电卡盘：24或25年才启动静电卡盘研发，技术突破速度快，优先配合逻辑芯片厂验证，研发成功后直接向Fab厂送样。已掌握静电卡盘全周期再生维修技术，包括三种处理方式：仅沾污时做清洗、表面轻微破损未伤及金属层时做再生修复、金属陶瓷共烧层损坏时更换全新陶瓷层后重新绑定，可大幅延长产品使用寿命，再生维修未来将成为独立市场。 #陶瓷材料：氧化铝为当前主流，用于压制大块炉衬；氧化钇主要用于涂层，粉末品质要求更高。公司已打通从陶瓷原粉造粒、喷涂/压坯、烧结到精密加工的全流程，2025年攻克氧化铝造粒技术，可根据自有配方生产。 #氧化钇粉体：电子级小微粒氧化钇受日本出口限制，公司两年前已布局相关技术，可实现自供，当前因自产产能较慢仍在外部采购。 #碳化硅材料：公司采用直接CVD全沉积技术路线，自有多台CVD炉，自主完成材料生长与零部件制造，产品以环状为主，聚焦小尺寸、高精度、高要求的精密零部件，工艺成熟度无问题；与“烧结成型+CVD表面涂层”的大型件路线形成差异化。 #客户：已实现国内有规模的逻辑、存储晶圆厂全覆盖，前五大客户除京东方外，为“两存两逻”（长鑫、长存+中芯、华虹）；与中芯国际在先进制程深度合作，与华力、华虹开展全方位合作；已进入台积电供应商体系并处于测试阶段，虽然短期订单量不大，但标志着获得国际一线晶圆厂认可，为海外扩张奠定基础。 #海外业务进展：在新加坡设立子公司，产品供应中国台湾12英寸厂等客户，2026年上半年收入同比增长178%—180#文字观点", "publish_time": "2026-10-18 16:51", "tags": ["文字观点"]}, "post:2026-10-18T09-25:0390ecde5d9b": {"id": "post:2026-10-18T09-25:0390ecde5d9b", "kind": "post", "title": "2026-10-18 09:25", "source_label": "帖子正文", "excerpt": "AI 数据中心互联：内部用铜、外部用光，CPO 居中（研讨会纪要）📝上个月，我们开启对美国互联器件制造公司以及网络设备的覆盖，AI 数据中心互联领域铜方案与光方案的博弈是核心研究主题。🎙️我们近期举办专家线上研讨会，邀请前英伟达高管布拉德・史密斯，他在铜互联与光互联生态拥有丰富从业经验。", "content": "AI 数据中心互联：内部用铜、外部用光，CPO 居中（研讨会纪要）📝上个月，我们开启对美国互联器件制造公司以及网络设备的覆盖，AI 数据中心互联领域铜方案与光方案的博弈是核心研究主题。 🎙️我们近期举办专家线上研讨会，邀请前英伟达高管布拉德・史密斯，他在铜互联与光互联生态拥有丰富从业经验。 📋以下为本次研讨核心要点总结： 🚀AI 工作负载从根本上改变互联的技术需求。 📊传统数据中心互联结构大致为 90% 铜互联、8% 多模光模块、2% 单模光模块。 🤖AI 彻底改变架构，单一 AI 应用可以运行在超过 100 万颗 GPU 之上。 ⚡这就带来带宽、传输距离、端口密度层面大幅提升的需求。 ❓因此行业争论的核心，就是铜互联与光互联的技术边界究竟划定在哪个位置。 💡柜内用铜、柜外用光、CPO 处于中间位置。 🔧机架内部短距离的横向扩容连接，依旧以铜方案为主（包括 Vera Rubin 以及 Vera Rubin Ultra 平台）。 🌐跨机架、跨数据中心这类长距离扩展连接，越来越需要采用单模光模块。 📌整体框架逻辑较为清晰：在条件允许的前提下，机架内部尽可能使用铜互联；网络交换机周边将越来越多地部署 CPO 共封装光学；机架外部长距离连接则使用光互联。 🔬物理特性最终决定铜向光切换的临界点。 📉随着信号速率提升，铜缆有效传输距离会快速缩短：100Gbps 速率约 2.5 米；200Gbps 速率约 18 英寸；400Gbps 速率约 12 英寸。 ⚠️速率提升之后，多模光模块同样会遇到传输距离受限的问题。 🧠数字信号处理器 DSP 可以拓展电信号传输距离，但会带来额外功耗、成本与时延问题。 🏢大型 AI 数据中心内存在数百米级别的传输距离，单模光模块的必要性持续提升。 🔑机架内部光互联渗透率提升的关键约束，在于 GPU/HBM 密度持续抬升之后，封装级 I/O 接口是否会超出短距离铜缆的实际支撑上限。 ⚙️CPO 用来解决交换机层面新出现的技术约束。 📈交换机带宽与端口密度不断提升，交换机 ASIC 芯片与前面板光模块之间的电连接开始出现技术难题。 ✨CPO 将电光转换单元放置在交换机硅芯片旁边，把电信号传输路径从约 18 英寸缩短至 0.5 英寸。 📊专家做过对比：当前英伟达交换机约 128 个 800Gbps 端口；采用 CPO 方案之后可实现 512 个 800Gbps 端口，端口能力提升 4 倍。 📦交换机端口规模提升之后，可以减少数百万个可插拔光模块带来的物理空间占用。 📈CPO 的落地普及会是渐进式过程。 🔎硅光（SiPh）是支撑交换机周边实现更高密度光互联的底层芯片技术。 📐CPO 属于系统级架构，把光互联器件和交换机硅芯片集成到一起。 ⚠️整体来看，CPO 技术落地时间晚于我们最初预期，具备实际意义的大规模应用要到 2030 年及以后才会出现；在此之前，机架内部扩容连接依旧以铜方案为主。#文字观点", "publish_time": "2026-10-18 09:25", "tags": ["文字观点"]}, "attachment:files/中信建投-行业数据周报10月第3期：市场普遍下跌，防御板块相对占优-261017.pdf": {"id": "attachment:files/中信建投-行业数据周报10月第3期：市场普遍下跌，防御板块相对占优-261017.pdf", "kind": "attachment", "title": "中信建投-行业数据周报10月第3期：市场普遍下跌，防御板块相对占优-261017", "source_label": "中信建投", "excerpt": "市场普遍下跌，防御板块相对占优", "content": "市场普遍下跌，防御板块相对占优证券研究报告 策略周报 本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下，本报告亦可能由中信建投（国际）证券有限公司在香港提供。请务必阅读正文之后的免责条款和声明。分析师：夏凡捷 xiafanjie@csc.com.cn SAC 编号：S1440521120005 发布日期：2026年10月17日——行业数据 周报10月第3期 仅供内部参考，请勿外传 内容摘要 风险提示：数据统计存在误差风险；海内外经济波动风险；市场流动性风险；海外地缘政治冲突加剧风险核心观点：本周A股主要宽基指数普跌 ，大盘相对抗跌。行业方面，食品饮料、银行表现较好，通信、电子和电力设备跌幅居前 。基本面方面，电 子、煤炭、计算机、通信和有色金属盈利预测调整居前 。产业景气方面，煤炭、钢铁和建材走弱 ，有色多数下跌，布油价格上涨，化工品普跌，中 游材料明显走弱 ，存储价格微涨。估值方面，银行、煤炭、石油石化、通信较高，食品饮料、美容护理、非银金融较低。资金方面，传媒、综合和 美容护理融资净流入居前 。交易方面，上游周期明显升温 ，传媒、非银和银行热度上升 。行业配置上，以“防御优先、择机反攻”为核心，重点关 注银行、公用事业、煤炭、石油石化等红利方向以及食品饮料等低配方向 ，科技板块谨慎把握超跌弱反弹机会 。 本周市场回顾 本周主要宽基指数普跌 ，上证综指、东财全A分别下跌2.56%、3.81%；成长风格方面 ，创业板指下跌8.90%，科创50下跌6.77%；大盘方面， 上证50下跌1.39%，沪深300下跌3.40%；中小盘方面，中证500下跌6.60%、中证1000下跌6.62%、中证2000下跌6.40%，大盘指数相对抗跌 。 行业层面，本周申万31个行业中仅2个录得正收益。食品饮料、银行表现较好，分别上涨1.9%和1.5%；通信、电子和电力设备跌幅居前 ，分别 下跌10.9%、8.7%和7.4%。 行业比较 基本面：盈利预测方面 ，本周盈利增速预测调整居前的行 业为电子、煤炭、计算机、通信和有色金属； 盈利增速预期调整边际改善居前的行 业 为建筑材料、房地产、农林牧渔、轻工制造和电力设备 。二级行业中，玻璃玻纤、风电设备、房地产开发、小金属和养殖业的 盈利增速预期调 整边际改善较多。产业景气方面，焦煤、焦炭期货下跌3.7%、2.4%，钢铁、建材整体走弱；有色多数下跌 ，白银、锡、锌跌幅居前；布油上涨 1.1%，化工品普跌；航运运价指数下行 ，农产品分化；中游材料明显走弱 ，DRAM报价基本持平，DXI指数上涨2.1%；市场交易降温 。 估值面：估值整体回 调。银行、煤炭、石油石化、通信主要估值指标处于近五年较高分 位，食品饮料、美容护理、非银金融相对较低；二级行 业中，元件、电子化学品、煤炭开采、玻璃玻纤、国有行估值偏高 ，航空机场、证券、保险和化妆品部分指标处于较低分位 。 资金面：本周两融资金 流出居多。截至10月15日，两融资金余额居前的行 业为电子、电力设备、非银金融、计算机和医药生物 。传媒、综合和 美容护理融资净流入居前，电子、通信和电力设备融 资净流出居前；二级行业 中，保险、航海装备和工业金属净 流入较多。 交易面：本周上游周期板块热度明显提升 ，TMT板块热度小幅回升 。一级行业中，传媒、非银金融和银行换手率分位提升居前 ，传媒、农林牧 渔和银行相对换手率较高；二级行业中 ，游戏、白酒、广告营销、保险和航空装备等换手率分位明显上升 。 行业配置：本周市场普遍下跌 ，防御板块相对占优 。配置上，美债利率高位回落 、外部压力边际缓和的背景下 ，以“防御优先、择机反攻”为 核心，关注银行、公用事业、煤炭、石油石化等红利板块以及食品饮料等机构低配方向；成长端受制于资金面 ，谨慎把握科技超跌弱反弹机会 。 注：若无特别说明 ，本期报告统计区间 为2026/10/12-2026/10/16。 仅供内部参考，请勿外传 重要新闻 3资料来源：Choice，新华社，国家税务总局，交通运输部， 中信建投宏观基本面 海关总署10月14日发布数据显示 ，前三季度我国货物贸易进出口 39.94万亿元，同比增长18.8%；其中出口23.2万亿元、增长16.4%，进口16.74 万亿元、增长22.3%；9月进出口5.16万亿元，同比增长27.5%，单月规模首次突破 5万亿元。 国家统计局10月14日发布数据显示 ，9月全国居民消费价格同比上涨 0.9%、环比上涨0.2%，核心CPI同比上涨1.0%；工业生产者出厂价格同比 上涨5.0%、环比上涨1.2%，CPI和PPI同比涨幅分别较上月扩大 0.1和1.2个百分点。 美国劳工统计局 10月14日至15日公布数据显示 ，9月美国CPI同比上涨3.7%、环比上涨0.6%，核心CPI同比上涨2.6%；PPI同比上涨6.3%、环 比上涨1.3%，同比涨幅为2022年12月以来最高，能源价格上涨是推动生产者价格上行的重要因素 。 宏观政策 10月12日至13日，全国卫生与健康大会在北京召开 ，习近平强调坚定不移走中国特色卫生与健康发展道路 ，坚定实施健康优先发展战略 ，深入 实施医疗卫生强基工程 ，促进分级诊疗；加强卫生健康领域科技创新 ，推进医疗、医保、医药协同发展和治理 ，做大做强健康产业 。 10月16日，国务院总理李强主持召开国务院常务会议 ，听取“人工智能+”行动进展情况汇报 ，提出以落地应用牵引技术创新 ，加强技术攻关和 算法创新，促进算电协同、增加高质量数据供给；会议同时讨论 《中华人民共和国价格法 （修正草案）》，研究规范市场价格竞争行为 。 10月16日，商务部、科技部就修订《中国禁止出口限制出口技术目录 》公开征求意见，涉及人工智能、生物医药、光伏三大领域40项技术，其 中拟禁止出口14项、拟限制出口26项；同步对相关技术实施出口前临时登记管理 ，征求意见截至11月15日。 交通运输部等三部门 10月13日发布《内河新能源船舶推广应用行动方案 （2026—2030年）》，重点推动内河电动 、甲醇动力船舶发展；提出到 2028年新能源船舶保有量较 2025年翻倍，形成零碳水路运输通道 3000公里，到2030年初步实现规模化应用 。 产业动态 财政部、税务总局10月12日发布公告，自2027年4月1日起，将新能源汽车增值税出口退税率由 13%下调至9%，取消电子烟设备装置等产品增 值税出口退税；相关产品出口消费税政策保持不变 ，适用退税率以出口货物报关单注明的出口日期界定 。 工信部10月12日发布数据显示 ，9月我国汽车产销分别为 299万辆、295.6万辆，同比分别下降8.7%、8.4%；新能源汽车产销分别为 181.4万辆、 182.3万辆，同比分别增长12.2%、13.6%，新车销量占比61.6%；汽车出口105.3万辆，同比增长61.4%。 仅供内部参考，请勿外传 本周A股主要宽基指数表现 4本周主要宽基指数普遍下跌 ，上证综指、东财全A分别下跌2.56%、3.81%；成长风格方面 ，创业板指 下跌8.90%，科创50下跌6.77%；大盘方面 ，上证50下跌1.39%，沪深300下跌3.40%；中小盘方面 ， 中证500下跌6.60%、中证1000下跌6.62%、中证2000下跌6.40%，大盘指数相对抗跌 。 图表：主要指数周涨跌幅（ %） 图表：主要指数周估值及分位数 资料来源：Choice，中信建投 资料来源：Choice，中信建投20.50 22.07 16.78 36.56 38.85 23.08 18.44 22.37 26.28 29.33 0102030405060708090100 05101520253035404550 上 证 综 指东 财 全A沪 深300创 业 板 指科 创50 深 证 成 指上 证50中 证500中 证1000中 证2000PE（TTM中位数）五年分位数(%,右） -2.56 -3.81 -3.40 -8.90 -6.77 -6.64 -1.39 -6.60 -6.62 -6.40 -10.0-9.0-8.0-7.0-6.0-5.0-4.0-3.0-2.0-1.00.0 上 证 综 指东 财 全A沪 深300创 业 板 指科 创50 深 证 成 指上 证50中 证500中 证1000中 证2000 仅供内部参考，请勿外传 融资融券 5截至周四，A股两融余额25031.92亿元，占A股流通市值2.64%，占比较上周提升 0.03pct。 图表：融资融券规模 资料来源：Choice，中信建投注：两融数据截至2026.10.15。1.61.82.02.22.42.62.83.0 05,00010,00015,00020,00025,00030,00035,000 2016-072017-072018-072019-072020-072021-072022-072023-072024-072025-072026-07融资融券:融资余额（亿元） 融资融券:融券余额（亿元） 融资融券:两融余额占A股流通市值(%，右) 仅供内部参考，请勿外传 6本周A股行业涨跌情况 本周行业普遍下跌 ，食品饮料、银行表现较好，分别上涨1.9%和1.5%；通信、电子和电力设备跌幅 居 前，分别下跌10.9%、8.7%和7.4%。 图表：行业周涨跌幅（ %） 资料来源：Choice，中信建投1.9 1.5 -0.1 -0.8 -0.9 -1.4 -1.4 -1.6 -1.9 -1.9 -2.3 -2.3 -2.8 -3.1 -3.8 - 整机标的 Q3 业绩预告收入、净利润情况环比虽增幅较缓或呈现一定波动，我们认为背后主要原因系高端存储供应不足所致，而同比方面依然 维持乐观高增。结合上文观点，我们认为在国产龙头存储厂商、互联芯片厂商持续的技术突破、供货能力不断增强背景下，整体 国产算力产业链有望继续迎来基本面的快速增长，进入新的正循环。 估值与建议 我们维持所覆盖公司盈利预测。我们认为，当前国产算力链标的股价走势与基本面已发生背离，看好基本面强劲支撑下的 股价修复，建议关注浪潮信息、中科曙光等标的。 风险 国产算力产业链技术进展不及预期； AI 算力需求不及预期。 仅供内部参考，请勿外传", "status": "extracted"}, "post:2026-10-18T19-30:8f6a31fdb90a": {"id": "post:2026-10-18T19-30:8f6a31fdb90a", "kind": "post", "title": "2026-10-18 19:30", "source_label": "帖子正文", "excerpt": "高盛——中国保险：3Q26业绩前瞻：利润与NBV转同比下滑，维持防御姿态 中国主要险企将于10月28日至30日披露3Q26业绩。高盛预计整体业绩疲弱，净利润与NBV增长大概率转负。", "content": "高盛——中国保险：3Q26业绩前瞻：利润与NBV转同比下滑，维持防御姿态 中国主要险企将于10月28日至30日披露3Q26业绩。高盛预计整体业绩疲弱，净利润与NBV增长大概率转负。A股三季度显著回调（CSI300指数跌12%，回吐2Q26全部涨幅），叠加高基数效应，预计9M26净利润同比下滑20-60%（对比1H26的+10%至+229%增长）。寿险新业务价值（NBV）方面，除中国人寿（全年预计+14% yoy）外，其余险企均面临全年NBV负增长（对比1H26的+11%至+34%）。尽管H/A股保险股价季度内表现相对韧性，但高盛认为股价尚未充分反映3Q业绩疲软，尤其10月权益市场进一步走弱及长债收益率下行。因此，维持防御性配置建议，偏好对股市敞口较低、运营具备韧性的标的。高盛维持买入评级的标的为：中国太保H（CPIC H）、人保财险（PICC P&C）、人保集团H（PICC Group H）、中国平安H/A（Ping An H/A）。 3Q26业绩预览：利润承压，NBV全面转弱 • 利润端：3Q26单季多数险企预计录得净亏损。CSI300三季度跌幅达12%，大盘及科技导向的CSI800/STAR 50跌幅更深（-14%/-31%）。尽管险企逐步将会计分类向FVOCI（以公允价值计量且其变动计入其他综合收益）转移，但弱市仍导致显著投资损失。高盛估算已纳入1）国债利息免税带来的有效税率下降；2）未实现权益投资损失的税收抵免。但除太保寿险（权益配置较低）外，主要寿险公司预计3Q均现净亏损。 • 保费与NBV端：行业保费收入7-8月同比增速恶化至-13%（1H26为+4%），核心驱动为银保渠道监管扰动（渠道费用新规导致销售激励下降），同时面临银行存款竞争（部分银行推出收益率高达2%的3/5年协商存款）及宏观不确定性下消费者需求减弱（牺牲流动性购买长期保单意愿降低）。预计3Q销售骤降将促使险企将重心转向筹备2027年“开门红”，进一步增加2026年增长下行风险。全年NBV预期：除中国人寿外（2H26预计-18% yoy，但全年+14%），其余寿险公司均面临全年NBV同比下滑。 关键管理层问答焦点 1. 权益投资策略更新：10月投资业绩持续承压（宏观走弱+长债收益率进一步下行），关注管理层对近期战术配置调整及降低短期波动措施的评论。 2. 销售疲软根源与展望：除银保渠道冲击超预期外，关注代理渠道销售动能（尤其是需长期牺牲流动性的长缴别保单）及银保颓势是否延续至1H27。 3. 偿付能力与股息：关注3Q核心偿付能力充足率变动幅度、4Q26预估位置及其对权益和利率变动的敏感性；尽管讨论全年股息政策为时尚早，但低利率环境下派息可持续性为焦点。 4. 投资渠道拓宽带来的收益率提振：境内险资现可通过互联互通投资符合条件的ETF（含最高40%海外资产敞口）及参与债券通南向通。高盛估算2026年发行的离岸点心债较可比境内债券平均提供约19bps的额外有效回报，关注各公司对上述新渠道的参与计划。 盈利预测、估值与目标价调整 • 盈利预测：下调FY26E EPS 2-39%，现预计FY26E净利润同比下滑11-56%（反映高基数及3Q股市回调）。对中国人寿、新华保险（NCI）及太平（Taiping）盈利预测下调幅度较大（因其权益配置较高且FVTPL权益资产敞口大）。同步修订FY27-28E EPS（-9%至+2%）。 • 账面价值：因盈利下调，FY26-28E BVPS下调0-9%。 • NBV预测：FY26E NBV下调0-12%，反映银保渠道调整下的行业性新单销售放缓。预计所覆盖寿险公司中多数全年NBV同比下滑，仅中国人寿（强劲1H26增长支撑）和太平（外汇折算收益）例外。 • 目标价：因盈利及账面价值预测下调，目标价整体下调1-6%，维持原有估值方法。 个股评级与目标价摘要（当前12个月目标价） • 中国人寿 H/A：中性/中性。基于ROA的目标价30.0港元/43.5元人民币，对应1.1X/1.8X FY27E P/B。 • 中国平安 H/A：买入。基于SOTP的目标价69.0港元/71.0元人民币，对应1.0X/1.2X FY27E P/B。 • 中国太保 H/A：买入/中性。基于SOTP的目标价36.0港元/37.0元人民币，对应0.8X/1.0X FY27E P/B。 • 新华保险 H/A：卖出。基于ROA的目标价36.0港元/48.0元人民币，对应0.8X/1.2X FY27E P/B。 • 中国太平：中性。基于SOTP的目标价20.6港元，对应0.7X FY27E P/B。 • 人保集团 H/A：买入/卖出。基于SOTP的目标价6.9港元/6.3元人民币，对应0.7X/0.8X FY27E P/B。 • 人保财险：买入。基于ROE的目标价19.8港元，对应1.2X FY27E P/B。 防御性选股逻辑 高盛首选标的（平安H/A、太保H、人保集团H、人保财险）当前股价普遍交易于或低于历史平均P/B水平，且提供具备吸引力的股息收益率。在3Q业绩大概率疲软、权益市场波动及利率下行环境下，低杠杆、高韧性的险企更具备下行保护。 主要风险 上行风险：A股大幅反弹、长端利率显著回升、NBV增长超预期、股息政策优于预期。 下行风险：权益市场进一步下跌、利率持续走低侵蚀投资收益率与偿付能力、银保/代理渠道销售持续低迷、监管政策进一步收紧。#文字观点", "publish_time": "2026-10-18 19:30", "tags": ["文字观点"]}, "post:2026-10-18T23-06:b4d445c7f674": {"id": "post:2026-10-18T23-06:b4d445c7f674", "kind": "post", "title": "2026-10-18 23:06", "source_label": "帖子正文", "excerpt": "周周谈第115期：下周继续结构分化，Q4重视哑铃防御！当前市场呈现显著结构分化，#下周高股息红利资产有望继续获取超额收益。", "content": "周周谈第115期：下周继续结构分化，Q4重视哑铃防御！ 当前市场呈现显著结构分化，#下周高股息红利资产有望继续获取超额收益。本轮成长回调核心是流动性影响+估值周期，并非基本面发生恶化，后续流动性边际修复/成长技术突破或将带来阶段性反弹，但市场套牢盘压力较重，#四季度整体仍维持防御为主的思路。 ☀️#四季度建议采取哑铃配置策略，底仓配置高股息必选消费，同时保留部分成长弹性标的博弈明年内需政策预期。#后续重点跟踪：国内CPI/PPI、PMI等宏观数据、财政专项债落地进度；海外美债收益率、美联储加息节奏、中东地缘局势及油价变化；明年内需政策博弈、地产链修复情况。 乳制品：攻守兼备，以不变应万变，穿越四季度及明年多重宏观情景。#无论明年是经济复苏、经济弱磨底、还是流动性回流成长板块，乳制品均具备配置价值；若市场博弈内需政策预期，板块还存在估值修复空间。#伊利股份：已完成明年合理估值切换，Q3利润预期较低，但不影响继续抱团实现溢价。#新乳业：三季度收入环比提速，主业增速预计接近5%，利润预期不高，明年对应估值仍具备吸引力，回调建议积极布局。#妙可蓝多：产业成长逻辑确定，内需行情下弹性充足，建议100亿以下持续摊薄持仓成本，赚取三年产业趋势的收益。#上游牧场：行情进入震荡期，等待右侧信号验证，中长期奶价上行逻辑不变。#蒙牛乳业：困境反转逻辑兑现，港股红利消费代表，防御属性突出。#H&H国际控股：港股优质消费成长标的，奶粉赛道拥有渠道阿尔法，外资担忧的杠杆压力已经缓解，明年估值仅10倍出头，基本面逻辑至少可看一年。 白酒：行业仍处于磨底阶段，个股分化加剧，板块暂无整体性大机会，静待库存充分出清，重点观察明年春节动销拐点。核心作为筹码干净板块提供避险价值。 啤酒&大众品：把握改革小票惠泉啤酒阿尔法机会，核心大单品+国企改革+渠道扩张——国企改革逻辑落地，核心大单品1983势能逐步兑现，承接百威在福建市场让出的份额，成长路径对标黄酒板块、燕京U8，长期量价齐升逻辑清晰，珍惜小票改革带来的弹性机会。 新型烟草产业链：华宝股份——主业企稳+HNB政策期权，#华宝股份：国内烟用香精龙头，拥有深厚调香与配方壁垒。9月26日新型烟草意见征询稿结束反馈，市场预期2027年有望成为国内HNB落地元年；HNB香精用量远高于传统卷烟，公司是A股产业链确定性最高的受益标的。后续收入利润有望持续改善，持续跟踪国内新型烟草政策落地节奏。欢迎索取周周谈PPT及会议录屏！#文字观点", "publish_time": "2026-10-18 23:06", "tags": ["文字观点"]}, "post:2026-10-18T19-29:234214c18de4": {"id": "post:2026-10-18T19-29:234214c18de4", "kind": "post", "title": "2026-10-18 19:29", "source_label": "帖子正文", "excerpt": "美银——亚洲经济观察——中国：政策小步慢走，难填刺激缺口 翻译精华 能源价格推高亚洲通胀压力，但政策信号分化。中国通胀与出口超预期走强，信贷却持续疲弱，印证内需低迷", "content": "美银——亚洲经济观察——中国：政策小步慢走，难填刺激缺口 翻译精华 能源价格推高亚洲通胀压力，但政策信号分化。中国通胀与出口超预期走强，信贷却持续疲弱，印证内需低迷；印度通胀飙升，央行加大外汇与流动性干预；日本通胀预期暂稳，但上行风险未消；新加坡金管局意外“鹰停”，维持政策不变并释放偏鸽基调。 【中国焦点：刺激缺口扩大，政策未现决定性转向】 • 增长动能：内需疲软抵消出口韧性，三季度实际GDP预计同比增4.3%（与二季度持平），低于市场共识4.4%。工业增加值9月料微升至5.3%，但零售销售受汽车需求拖累仅增0.1%（前值0.4%），固定资产投资累计同比深陷-7.2%收缩。 • 政策滞后：尽管9月末出台8000亿人民币结构性借贷工具及新增5500亿地方债额度，但“小步”宽松力度远不及内需恶化速度，未释放强烈刺激信号。新推“主体结构封顶后方可预售”的地产政策，短期将抑制开发商拿地与开工，进一步拖累土地财政与整体增长。 • 财政偏紧：年初承诺的“更积极财政”落地迟缓，1-8月广义财政支出同比收缩3.5%。税收征管趋严（查补逃税、取消高新企业优惠税率）及出口增值税退税削减（如新能源车、电子烟、光伏、电池等），实质构成“加税”，推高企业成本，压制利润与投资意愿。 • 核心论断：唯有中央层面推出可信的、全面的政策转向——结合更强财政支持、更果断货币宽松及促消费投资举措——方能扭转预期，支撑内需实现可持续复苏。否则，渐进式宽松仅能缓冲放缓，难改趋势。 【数据前瞻与预测】 • 中国：Q3 GDP 4.3%，9月工业产出5.3%，零售0.1%，固投-7.2%；CPI与PPI短期受供给因素支撑，但需求侧限制上行空间。 • 区域其他：韩国与印尼央行料按兵不动（利率分别持稳于3.00%与5.75%），菲律宾央行预计加息25基点至5.25%。日本9月核心CPI（除生鲜食品）料跳升至2.2%，出口同比升至21.3%；新加坡9月核心CPI预计微升至2.3%。#文字观点", "publish_time": "2026-10-18 19:29", "tags": ["文字观点"]}, "post:2026-10-18T09-24:3e5e44966986": {"id": "post:2026-10-18T09-24:3e5e44966986", "kind": "post", "title": "2026-10-18 09:24", "source_label": "帖子正文", "excerpt": "ZE 咨询大会磷酸铁锂正极材料核心要点👥我们参加了 10 月 14 日由 ZE 咨询举办的大会，聆听磷酸铁锂正极相关主题演讲以及圆桌讨论。📋以下为核心要点整理。", "content": "ZE 咨询大会磷酸铁锂正极材料核心要点👥我们参加了 10 月 14 日由 ZE 咨询举办的大会，聆听磷酸铁锂正极相关主题演讲以及圆桌讨论。 📋以下为核心要点整理。 🛡️行业反内卷相关情况：中国电源学会磷酸铁锂分会于 2025 年 5 月成立。 📄分会与头部磷酸铁锂正极生产商开展交流后，在 2025 年 8 月发布中国磷酸铁锂正极行业健康发展倡议。 📊分会还在 2025 年 11 月公布磷酸铁锂正极行业平均成本，该数据反映当时绝大多数生产商处于亏损状态。 📢2025 年 12 月，磷酸铁锂分会倡议磷酸铁锂正极生产商在实现盈亏平衡前不要继续扩产，此后磷酸铁锂正极加工费开始出现改善。 📉磷酸铁锂正极产能利用率：周先生预计，中国磷酸铁锂正极产能利用率，2026 年约 80%，2027 年将下滑至 67%，2028 年进一步下滑至 62%。 ⚠️他认为，如果不对新增产能加以约束，行业将再度出现供给过剩。 📈磷酸铁锂正极需求：周先生测算，2026 年国内磷酸铁锂正极需求约 600‑630 万吨，同比增长 50‑55%。 📊2027 年国内磷酸铁锂正极需求将达到 750‑800 万吨，同比增长 25‑30%；2028 年需求 900‑1000 万吨，同比增长 20‑25%。 ⚖️他表示，第四代磷酸铁锂正极供给依旧紧张，但低端产能已经出现供给过剩。 💸盈利层面：周先生认为磷酸铁锂正极生产商想要改善盈利水平、提升竞争优势，可以采取三条路径。 ✅第一，布局上游资源，采用一体化经营模式。 ✅第二，开发高压实密度磷酸铁锂正极，该产品在超快充电池当中得到广泛应用。 ✅第三，行业更好管控新增产能投放，避免出现严重供给过剩。 🔋第四代磷酸铁锂正极：邓先生认为，本轮磷酸铁锂正极产能扩张相比上一轮周期会更加理性。 ⚠️不过随着新增产能落地，第四代磷酸铁锂正极的供给紧缺局面有望在 2027 年得到缓解，可能带来价格走弱，2027 年第三代磷酸铁锂正极或将出现产能过剩。 🎯黄先生提出，想要进一步提升第四代磷酸铁锂正极渗透率，降低成本与价格将会是核心着力点。#文字观点", "publish_time": "2026-10-18 09:24", "tags": ["文字观点"]}, "post:2026-10-18T09-24:ce322d324fae": {"id": "post:2026-10-18T09-24:ce322d324fae", "kind": "post", "title": "2026-10-18 09:24", "source_label": "帖子正文", "excerpt": "高盛｜美国户用光伏 2026 年 Q3 电话会总结 高盛与 Ohm Analytics 开展季度电话交流，围绕美国户用光伏年末需求、TPO 与预付租赁融资、逆变器及储能市场份额、工商业光伏（C&I）业务改善等议题展开讨论。户用光伏需求：年末走弱，但全年预期基本不变 2026 年第四季度户用光伏终端需", "content": "高盛｜美国户用光伏 2026 年 Q3 电话会总结 高盛与 Ohm Analytics 开展季度电话交流，围绕美国户用光伏年末需求、TPO 与预付租赁融资、逆变器及储能市场份额、工商业光伏（C&I）业务改善等议题展开讨论。 户用光伏需求：年末走弱，但全年预期基本不变 2026 年第四季度户用光伏终端需求走弱：6‑8 月新增装机规模持平或小幅下滑，8 月销售额同比下滑 40%；诱因是消费者对大额长期采购意愿降温，叠加预付租赁融资端出现扰动。Ohm 下调 Q4 并网预测，环比增速由 + 11% 修正至‑3%，受 2025 年需求提前释放带来的高基数影响，Q4 户用光伏并网预计同比下滑 39%。 全年展望维持稳定：2026 年户用光伏规模预期 3.6GW，同比‑23%；2027 年预期 3.9GW。2027 年预测假设利率 6.25%（此前 6.0%）；数据显示，利率每变动 100 个基点，会带来户用光伏需求 6‑7 个百分点的变动。 融资模式：TPO 市场集中度高，预付租赁扩张不及预期 TPO（第三方拥有模式）市场高度集中，Lightreach 与 RUN 合计占据约 85% 市场份额，高集中度挤压渠道合作方的融资可得性。不过其他厂商重新回归，Enfin 活跃度提升，IGS 等企业考虑重返赛道；资本市场对光伏资产证券化仍保有兴趣。 预付租赁（PPL）占新增装机约 10%，扩张不及预期。ENPH 的 Propel 产品一二季度基本持平；Participate 突发暂停付款，进一步打击安装商积极性，压制短期预付租赁渗透率。 逆变器：市场份额趋于企稳，新产品周期将成为下一催化 经过前期 Freedom Forever、Bright Planet 业务扰动，以及 RUN 转向直销业务带来的冲击，2026 年 Q3 逆变器市场份额变动有限，SEDG、ENPH、特斯拉三者份额整体企稳。 后续催化看新品：SEDG 的 Nexis、ENPH 新一代模块化储能产品，有望在 2027 年上半年扰动份额格局，短期暂无明显冲击。 其他参与者：Lunar 借 RUN 渠道实现份额提升；Qcells 依靠交流组件产品拿到个位数中段逆变器市场份额。 储能与工商业光伏（C&I）储能是主要向上弹性来源：得克萨斯州户用储能需求超预期，Base Power、SOLRITE 两家合计占全美户用储能部署规模约 20%。在尚未计入虚拟电厂 VPP、公用事业容量协议带来增量的前提下，预计 2026 年户用储能规模基本持平，2027 年增长 33%。 工商业光伏景气边际改善：受审批、并网环节好转带动，Ohm 上调 2026 年工商业光伏预期，由此前低双位数下滑修正为中个位数下滑；2027 年随着装机走出加州，行业增长基础更为扎实。#文字观点", "publish_time": "2026-10-18 09:24", "tags": ["文字观点"]}, "post:2026-10-18T23-17:357b1156c554": {"id": "post:2026-10-18T23-17:357b1156c554", "kind": "post", "title": "2026-10-18 23:17", "source_label": "帖子正文", "excerpt": "【涨价链PCB】Q3业绩全面验证，二线利润弹性正式接棒 #一线高景气延续，二线PCB盈利弹性集中爆发。沪电股份预计前三季度归母净利润54.5—57亿元、同比增长101%—110%，生益科技预计64.6—68.7亿元、同比增长164%—181%，验证AI高阶PCB与CCL景气仍在加速", "content": "【涨价链PCB】Q3业绩全面验证，二线利润弹性正式接棒 #一线高景气延续，二线PCB盈利弹性集中爆发。沪电股份预计前三季度归母净利润54.5—57亿元、同比增长101%—110%，生益科技预计64.6—68.7亿元、同比增长164%—181%，验证AI高阶PCB与CCL景气仍在加速；与此同时，崇达技术、金禄电子、威尔高和科翔股份Q3利润均显著提速，表明产业链盈利改善已由一线AI龙头扩散至二线板厂。 #Q3成为二线PCB利润拐点的集中验证期，由收入恢复进入利润率快速提升阶段。崇达技术前三季度预计归母净利润5.95—6.85亿元、同比增长90%—118%，单Q3利润约4.43—5.33亿元，产品结构、稼动率和良率同步改善；金禄电子前三季度预计净利润1.80—1.96亿元、同比增长193%—219%，单Q3利润已明显超过上半年总和，汽车、算力及卫星通信订单加速落地；威尔高单Q3净利润1.38亿元、环比增长269%，受益AI服务器电源PCB订单增长、售价上调及泰国产能释放；科翔股份单Q3净利润3.11亿元、同比增长639%，前三季度实现扭亏。 #涨价、订单和产能利用率共振，Q4仍有继续兑现空间。Q3主要体现前期订单提价、客户结构优化和产能利用率提升，8—10月新接订单价格仍需随交付逐步进入报表；同时，上游电子布、铜箔及覆铜板供应偏紧，为板厂后续顺价提供支撑。即使调价频率阶段性放缓，高价订单交付、良率改善和固定成本摊薄仍有望推动Q4盈利环比向上，产业反馈显示本轮景气持续性可进一步观察至2027年上半年。 #继续看好具备订单增长与顺价能力的二线PCB。重点推荐汽车及规模优势突出的【奥士康、崇达技术】，AI电源PCB方向【威尔高、四会富仕】，AI与传统涨价共振的【景旺电子、方正科技】，并关注业绩弹性较大的【科翔股份、金禄电子、超声电子、博敏电子、中京电子、满坤科技、伊顿电子、澳弘电子】。当前板块已从估值修复进入业绩验证阶段，后续核心关注Q4利润环比、涨价持续性及AI新产品突破。#文字观点", "publish_time": "2026-10-18 23:17", "tags": ["文字观点"]}, "post:2026-10-18T09-25:d1f40a4a44b6": {"id": "post:2026-10-18T09-25:d1f40a4a44b6", "kind": "post", "title": "2026-10-18 09:25", "source_label": "帖子正文", "excerpt": "景旺电子：扩产推动 AI 服务器及光模块 PCB 业务增长🔍我们近期在深圳与景旺电子管理层进行交流。📈管理层对公司增长前景保持乐观，增长动力来自 AI 服务器 PCB、光模块 PCB 业务，同时公司也在持续推进产能扩张。", "content": "景旺电子：扩产推动 AI 服务器及光模块 PCB 业务增长🔍我们近期在深圳与景旺电子管理层进行交流。 📈管理层对公司增长前景保持乐观，增长动力来自 AI 服务器 PCB、光模块 PCB 业务，同时公司也在持续推进产能扩张。 🖥️管理层对于 AI 服务器客户终端需求的积极判断，和我们对 AI 服务器 PCB 板块的乐观观点保持一致。 📝正如我们 8 月份报告中所提及，我们上调全球 AI 印制电路板整体市场规模预测，以此反映 AI 服务器机架的上量，以及新一代高端 AI 服务器落地带来的 PCB 规格升级。 🌐整体来看，我们预计 2027 年全球 AI 服务器 PCB 市场规模将达到 380 亿美元（此前预测为 270 亿美元），2028 年进一步达到 840 亿美元，2026‑2028 年 AI 印制电路板市场规模复合增速为 148%。 ⚙️伴随着 AI 基础设施建设推进，产能持续扩张且产能利用率维持高位，我们依旧看好 AI 印制电路板、铜箔基板板块。 👤公司简介：景旺电子（603228.SS/ 3228.HK，本报告未覆盖）成立于 1993 年，是全球领先的 PCB 供应商。 📋公司产品包含多层印制电路板、SLP 板、厚铜 PCB、高频高速 PCB、金属基 PCB、双层及多层柔性 PCB、高密度柔性 PCB、HDI 板、刚挠结合板、特殊材料 PCB 等。 🔧产品应用领域覆盖 AI 服务器、光模块、汽车、通信、个人电脑、智能终端、工业等方向。 🏭景旺电子生产基地分布在中国以及泰国。 核心要点 🚀AI 数据中心将成为未来增长驱动力：管理层看好 AI 服务器 PCB 与光模块 PCB 业务，受益于 AI 基础设施的上行周期。 🔌公司是新一代 AI 服务器机架交换机板、中板的主要 PCB 供应商，将受益于新一代机架出货量爬坡。 📈公司高端 HDI 板同样在进行产能扩张，以承接未来几年旺盛的市场需求。 💡光模块 PCB 业务：公司正大力扩张光模块 PCB 业务，该赛道市场增长势头强劲。 🏗️管理层表示产能扩张重点面向 AI 数据中心领域，大部分产能供给 AI 服务器，同时分配相当一部分产能用于光模块业务。 🇨🇳中国依旧是 PCB 生产效率最高的基地；同时公司布局泰国生产基地，为全球头部客户提供供应弹性。#文字观点", "publish_time": "2026-10-18 09:25", "tags": ["文字观点"]}, "post:2026-10-18T19-35:3184e3c43c46": {"id": "post:2026-10-18T19-35:3184e3c43c46", "kind": "post", "title": "2026-10-18 19:35", "source_label": "帖子正文", "excerpt": "多地落实地产新政，关注消费建材底部向上弹性多地落实地产新政，政策呵护力度增强，关注消费建材底部向上弹性。继828房地产新政落地以及9月29日三部门出台房贷贴息政策后，10月15日，深圳、杭州出台商品住房销售制度改革相关细则，叠加此前已出台细则的北京、上海、广州、武汉、天津，目前全国已有7个重点城市落", "content": "多地落实地产新政，关注消费建材底部向上弹性多地落实地产新政，政策呵护力度增强，关注消费建材底部向上弹性。继828房地产新政落地以及9月29日三部门出台房贷贴息政策后，10月15日，深圳、杭州出台商品住房销售制度改革相关细则，叠加此前已出台细则的北京、上海、广州、武汉、天津，目前全国已有7个重点城市落地该类改革方案。近期地产政策频发，国家对地产呵护力度增强，行业或加速触底企稳。 当前新房与二手房供应及销售或发生明显变化，住建部表明我国房地产进入存量时代，根据克而瑞统计，1-9月份全国重点20城二手房累计成交面积约1.39亿平米，同比增长6.5%，二手房的成交回暖逐步拉动存量房市场的需求，进入存量房时代，零售渠道的布局显得十分重要，关注零售渠道优势突出的消费建材龙头。CCL龙头再次提价，电子布到CCL涨价链传导顺畅。继上周电子布提价后，10月13日，覆铜板巨头建滔集团，再度发布涨价通知，公司自即日接单起，将对使用2116(含)以下薄布为生产原材料的板料和PP之销售价格上调15%。当前电子布到CCL涨价链传导顺畅，电子布延续供不应求的格局，中高端产品D、E系列细纱及布供不应求，后市电子布仍有提价预期；进入到三季报窗口期，预计电子布企业业绩弹性进一步凸显，继续看好电子布向上行情。关注玻璃的供需拐点，进入10月中旬，光伏玻璃价格小幅上涨，在产产能继续收缩，后市仍有冷修预期；浮法玻璃产能也降至低位，节后需求小幅回暖，供需拐点渐行渐近，价格或触底回暖；同时，关注玻璃基板产业化趋势。【本周配置建议】 主线一：CCL龙头再次提价，电子布到CCL涨价链传导顺畅，电子布延续高景气度。推荐【中国巨石】、【长海股份】、【中材科技】，建议关注【国际复材】、【宏和科技】。 主线二：多地落实地产新政，政策呵护力度增加，关注消费建材底部向上弹性。建议关注【兔宝宝】、【青鸟智控】、【三棵树】、【东方雨虹】、【科顺股份】、【北新建材】、【伟星新材】、【悍高集团】（与轻工组联合覆盖）等。 主线三：节后光伏玻璃小幅提价，关注玻璃基板产业趋势。推荐【旗滨集团】，建议关注【凯盛科技】、【信义玻璃】等。 主线四：关注加速出海以及投资转型的水泥龙头企业。推荐【华新建材】【上峰材料】等。#文字观点", "publish_time": "2026-10-18 19:35", "tags": ["文字观点"]}, "attachmen 内市场份额的 68.54%，在国内成核剂企业中处于 领先地位。 2017 -2019年，公司成核剂国内市场份额由 9.52%提升至 15.12%，同 期我国成核剂国产化率由 18.66%提升至 22.06%，公司市场份额提升速度快于行 业整体国产化进程，体现出较强的进口替代能力。上述数据属于公司上市前历史 数据，主要用于反映公司在国产成核剂市场中的先发优势及进口替代进程。 0.00%5.00%10.00%15.00%20.00%25.00% 2017 2018 2019公司市场份额 成核剂国产化程度仅供内部参考，请勿外传 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 谨请参阅尾页重要声明及财通证券股票和行业评级标准 8 公司深度研究报告 /证券研究报告 图10: 国内成核剂进口替代率在稳步提升 数据来源： 卓创资讯 ，公司招股书 ，财通证券研究所 从近年来实际产销情况来看，公司成核剂业务仍保持较快增长。 2021 -2025年，公 司成核剂销量由 4,448.29吨提升至 11,614.42 吨，增长约 1.6倍，期间复合增长率 约27%。其中， 2024年公司成核剂销量达到 9,727.54吨，同比增长 32.03%；2025 年销量进一步增长至 11,614.42 吨，同比增长 19.40%，延续较快增长态势。与此 同时，公司成核剂产量由 2021年的 4,620.51吨提升至 2025年的 14,096.93 吨，前 期产能释放进一步增强了公司的规模化供应能力。 2025年公司成核剂产量同比增长 30.50%，高于同期销量 19.40%的增速，期末库 存达到 1,216.62吨，同比增长 70.24%。随着前期产能逐步释放，公司当前成核剂 生产能力已能够较好满足现阶段业务需求，短期内行业及公司发展的重点有望由 产能扩张逐步转向产能利用率提升和销售市场拓展。 图11: 公司成核剂销售量 持续增长 （吨） 数据来源： iFinD，财通证券研究所 0.00%5.00%10.00%15.00%20.00%25.00% 0.001000.002000.003000.004000.005000.006000.007000.008000.00 2016 2017 2018 2019总需求（吨） 国内供给量（吨） 进口替代率（右轴） 0.005,000.0010,000.0015,000.00 2021 2022 2023 2024 2025生产量 销售量 库存量仅供内部参考，请勿外传 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 谨请参阅尾页重要声明及财通证券股票和行业评级标准 9 公司深度研究报告 /证券研究报告 2.2 合成水滑石： PVC环保稳定剂替代打开需求空间，高端产品进口替 代加速 合成水滑石是一类功能性无机材料，主要作为 PVC热稳定剂的辅助稳定剂，吸收 PVC加工及使用过程中产生的氯化氢，提升材料热稳定性及抗老化能力，主要应 用于 PVC管材、型材、板材、电线电缆、人造革、装饰材料及薄膜等领域。从下 游行业规模来看， PVC行业仍具备较大的存量市场。据中国氯碱协会统计， 2025 年国内 PVC行业进入产能扩张收官及存量竞争阶段，新增产能约 220万吨，净增 205万吨，年末总产能达到 2,993万吨，同比增长 7.35%，约占全球 PVC总产能 的47%。庞大的 PVC生产及加工规模为热稳定剂提供了较为稳定的需 求基础。 合成水滑石的长期需求逻辑并非单纯依赖 PVC产量增长， 而是由 PVC存量需求、 环保型稳定剂替代以及高端 PVC材料渗透率提升共同驱动。 根据 QYResearch 《全 球环保 PVC热稳定剂市场报告 2023 -2029》 ， 预计 2029年全球环保 PVC热稳定剂 市场规模将达到 46.2亿美元， 2022至2029年复合增长率约 5.0%。合成水滑石作 为环保型 PVC热稳定剂体系的重要辅助稳定剂， 有望受益于环保型热稳定剂渗透 率提升。 图12: 全球环保 PVC热稳定剂全球市场规模 稳定增长 数据来源： QYResearch ，公司公告 ，财通证券研究所 合成水滑石行业整体呈现通用产品竞争与高端产品进口替代并存的竞争格局。国 内企业经过多年发展，已经具备较为成熟的通用合成水滑石生产能力，并逐步进 入国际热稳定剂企业供应链；但在高透明 ac0336fdf7": {"id": "post:2026-10-18T09-25:adac0336fdf7", "kind": "post", "title": "2026-10-18 09:25", "source_label": "帖子正文", "excerpt": "CXMT 4F²：长期前景光明，短期业绩面临挑战🔍1. 精确的密度增益💡相较于传统 6F² 架构，4F² 在同一工艺节点下内存密度可提升约 30%。📈该密度提升并非依靠晶体管尺寸缩小，而是将 DRAM 存储阵列、逻辑阵列、电容器进行垂直堆叠，牺牲三维布局换取单位存储面积容量。", "content": "CXMT 4F²：长期前景光明，短期业绩面临挑战🔍1. 精确的密度增益💡相较于传统 6F² 架构，4F² 在同一工艺节点下内存密度可提升约 30%。 📈该密度提升并非依靠晶体管尺寸缩小，而是将 DRAM 存储阵列、逻辑阵列、电容器进行垂直堆叠，牺牲三维布局换取单位存储面积容量。 🔍2. 性能损失极小 —— 成本体现在产量上✅根据当前已验证结果，4F² 不会出现明显性能衰减；主要风险来自良率损失。 📌换言之，该技术属于 “以良率换取密度”，而非 “以性能换取密度” 的技术方案。 🔍3. 和工艺节点迭代的对比关系📊常规迭代下，下一代节点 G5 相对 G4 性能提升约 21%； 📊同一工艺节点采用 4F²，密度可额外提升 30%； ⭐因此，落后一代节点但搭载 4F² 的产品可实现跨越式提升：G4+4F² 综合性能较 G5 领先约 13%，这是真正具备 “节点级威胁” 的转折点； ⚠️与之相反，G3+4F² 依旧显著弱于 G5，仅缩小密度差距，尚不足以形成实质威胁。 🔍4. 工艺节点越先进，4F² 实现难度越高⚙️在 G3、G4 工艺引入 4F² 可行性相对较高； ⚠️G5 工艺需要四重曝光，工艺难度相比 G3/G4 提升 30% 以上，最高可达 45‑50%。 🔧工艺挑战覆盖光刻、刻蚀、沉积、离子注入全流程，属于整套工艺流程难题，并非单一工序问题。 🔍5. 在没有 EUV 的条件下，G5+4F² 就是技术上限🔬倘若 EUV 技术问题无法解决，只能依靠 DUV 多重曝光，那么 G5 工艺搭配 4F² 基本就是现有技术的天花板。 🧪理论上 DUV 多重曝光也可以制造 3D DRAM，但是 “可以制造” 不等于 “具备商业价值”； 💸一旦良率相比竞争对手低 20‑30%，成本性价比优势将完全消失，无法形成有效商业竞争。 🔍6. 4F² 另一项战略价值：延长 DUV 工艺生命周期✨4F² 的意义在于不用持续缩小线宽即可提升电路层密度，让制造方依托现有工艺继续保持竞争力，实质为 DUV 工艺争取更多发展时间。 🔍7. 三星 “研发完成尚未发布” 的 4F² 真实状态📋三星已经完成 16nm、17nm 工艺下 4F² 技术研发；但 14nm、12nm 还需要进一步验证，因此选择推迟对外发布。 💡其逻辑是 “多节点完成验证之后，再推出可靠性更高的产品”，并非技术本身不成熟。 📌这代表三星 4F² 技术成熟度高于市场外界预期。 🔍8. 产品发布节奏与技术路线图🎯三星最终目标是全产品线普及 4F² 技术，由 16nm 逐步过渡至 14nm、12nm。 🔬10nm 档位最先进节点约为 10nm D1γ，目前处于同步开发试验阶段。 ⚠️10nm 以下，单纯工艺微缩难度陡增、成本大幅抬升、良率明显下滑，因此 4F² 堆叠技术会成为必然选择，未来终将大规模普及。 🔍9. “不急着发布” 背后：成本收益权衡💰三星已经可以在 16nm 实现 4F²，但尚未对外出货。这说明现阶段，依靠推进工艺节点来提升 DRAM 密度的投入产出比更高。 📎4F² 更偏向 10nm 以下工艺的储备技术，并非现阶段主力发展路线。 🔍10. 三星研发优先级如何取舍🔬三星研发资源更倾斜纯 3D DRAM（三维电路层结构）；混合键合仅作为过渡方案，并非最终目标。 ⌛3D DRAM 还需要 2‑3 年走向成熟，该时间窗口正是混合键合技术发挥作用的阶段。 🔍11. 三星 3D DRAM 的实验参数🧪三星正在开展 16nm D1z 工艺的 3D DRAM 试验，未来有望升级至 14nm 工艺。 📶堆叠层数目标向着几十层推进，现阶段已经实现 20‑30 层电路，该技术水平显著高于中国大陆同业。 🔍12. 三星视角下的 4F² 行业竞争格局📐理论上各家厂商 4F² 基础架构大体一致，核心都是垂直堆叠逻辑阵列、存储阵列、电容。 🔧工艺细节存在差异，但暂无大规模市场化产品落地，现在还无法判定哪一家工艺路线最优。 ⚠️三星并不担忧 CXMT 当前产品：CXMT 采用 G3 工艺，无论性能还是密度，都无法对三星、SK 海力士、美光形成威胁；只有 CXMT 把 4F² 落地到 G5 工艺，才会带来实质性竞争威胁。 🔍13. 当前仅适用于传统 DRAM🚧HBM 需要预留大量电路面积用于 TSV 硅通孔与微凸点，4F² 目前的面积条件无法满足该设计。 📅因此短期只能用于传统 DRAM，向 HBM 迁移还需要 1‑2 年时间。 🔍14. HBM 硬性门槛：80% 良率✅无论 4F² 架构还是传统 DRAM，芯片良率至少达到 80%，才能够用于 HBM 产品；良率低于 80%，转化落地难度极大。 💡正确路径：先在成熟传统 DRAM 上完成良率、性能验证，之后再推进 HBM 适配。 🔍15. 三星、SK 海力士尚未把混合键合用在 HBM 上❌目前三星、SK 海力士均没有将混合键合技术应用于 HBM 产品，市场经常存在 “混合键合已经用于 HBM” 的错误认知。#文字观点", "publish_time": "2026-10-18 09:25", "tags": ["文字观点"]}, "attachment:files/德邦证券-豪迈科技(002595)巡礼山东：豪迈科技深度报告，全球轮胎模具龙头，大型铸件+五轴机床共驱增长-261016.pdf": {"id": "attachment:files/德邦证券-豪迈科技(002595)巡礼山东：豪迈科技深度报告，全球轮胎模具龙头，大型铸件+五轴机床共驱增长-261016.pdf", "kind": "attachment", "title": "德邦证券-豪迈科技(002595)巡礼山东：豪迈科技深度报告，全球轮胎模具龙头，大型铸件+五轴机床共驱增长-261016", "source_label": "德邦证券", "excerpt": "请务必阅读正文之后的信息披露和法律声明", "content": "请务必阅读正文之后的信息披露和法律声明 证券研究报告 | 公司首次覆盖 豪迈科技 (002595.SZ ) 2026年10月16日 买入（首次） 所属行业：机械设备 /专用设备 证券分析师 丁健 资格编号： S0120526070002 邮箱： dingjian3 ＠tebon.com.cn 周天昊 资格编号： S0120525040002 邮箱： zhouth＠tebon.com.cn 杨安东 资格编号： S0120526070001 邮箱： yangad＠tebon.com.cn 研究助理 姜政宏 邮箱： jiangzh＠tebon.com.cn 吴冰予 邮箱： wuby＠tebon.com.cn 市场表现 沪深 300对比 1M 2M 3M 绝对涨幅 (%) -5.31 -26.10 -18.39 相对涨幅 (%) 1.07 -17.78 -7.74 资料来源：德邦研究所，聚源数据 相关研究 巡礼山东：豪迈科技深度报告 全球轮胎模具龙头，大型铸件 +五轴机床共驱增长 投资要点  豪迈科技从轮胎模具起家，历经战略转型和业务延伸，已成长为覆盖轮胎模具、 大型零部件、数控机床三大板块的高端装备综合供应商。 公司凭借自主研发首台 轮胎模具专用电火花机床打开行业入口，而后主动从设备商转型为产品商，完成 跃迁； 上市后进一步将核心能力复刻至燃气轮机、 风电及数控机床等新赛道。 2025 年公司营收首次突破百亿元， 达 110.78亿元， 2021 -2025年营收 CAGR约16.5%， 归母净利润 CAGR约22.8%。  轮胎模具：存量主导支撑需求韧性，豪迈龙头壁垒持续夯实。 轮胎需求约 75%来 自存量替换市场，具备强韧性， 叠加国内轮胎企业加速出海建厂及新能源车迭代 带来的增量配套需求，全球轮胎模具市场稳步扩容。豪迈全球市占率已由 2014年 的15%稳步攀升至 2025年的 32%左右， 已成长为全球轮胎模具行业的龙头企业， 公司拥有深厚的制造和客户壁垒，模具产线在用机床自制率近 80%，拥有较完备 的工艺体系，并深度绑定全球轮胎 75强中的 66家，客户粘性极强； 2025年模具 业务毛利率达 40%，显著领先于巨轮智能、韩国 Dynamic Design 等国内外可比 同行。  大型零部件业务：受益全球燃气轮机高景气周期，产能释放打开成长空间。 伴随 AI算力数据中心对稳定不间断供电需求的激增，以及存量燃气轮机机组技改大修 周期的到来，全球燃气轮机行业景气度持续上行。公司深度嵌入 GE Vernova 、西 门子能源、 三菱重工等全球核心整机厂商供应链， 铸造加工一体化优势显著； 2025 年该业务实现营收 39.64亿元， yoy+18.97% 。当前公司正推进产能扩张，中长期 成长动能充沛。  五轴数控机床与电加热硫化机：自主突围与协同延伸，构筑公司未来成长新曲线。 依托近三十年底层工艺积淀与内部产线反复验证，公司高端五轴机床技术实现自 主突围， 2025年数控机床业务实现营收 9.68亿元，同比大增 142.59% ，正加速 打开国产替代与出海市场空间；与此同时，公司前瞻布局绿色节能的电加热硫化 机，与模具主业形成良好协同，助力公司向轮胎制造整体解决方案服务商升级。  盈利预测与估值： 公司为轮胎模具行业 龙头，同时深度受益全球燃气轮机高景气 周期，数控机床业务正加速国产替代。我们看好公司在轮胎模具的技术壁垒与龙 头地位及新业务的成长性，预计公司 2026 -2028年营收 129.6/156.2 /188.9亿元， 同比 17%/21%/21% ； 归母净利润 25.9/32.5/41.0 亿元， 同比 8.4%/25.2%/26.2% ， 2026年10月15日总市值对应 2026 -2028年PE为17.1/13.6/10.8，首次覆盖， 给予 “买入” 评级。  风险提示： 轮胎模具需求放缓风险；燃气轮机零部件需求不及预期风险；风电需求 波动及原材料涨价风险；汇率波动风险；新产能投产及海外贸易摩擦风险；新业务 拓展不及预期风险。 -14%0%14%29%43%57%71%86% 2025-10 2026-02 2026-06豪迈科技 沪深 300下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 公司首次覆盖 豪迈科技 （002595.SZ ） 2 / 27 请务必阅读正文之后的信息披露和法律声明 [Table_ Base ] 股票数据 总股本 (百万股 )： 1,160.00 流通 A股(百万股 )： 1,152.12 52周内股价区间 (元)： 38.10 -67.18 总市值 (百万元 )： 44,230.80 总资产 (百万元 )： 15,438.13 每股净资产 (元)： 10.66 资料来源：公司公告 [Table_Finance] 主要财务数据及预测 2024A 2025A 2026E 2027E 2028E 营业收入 (百万元 ) 8,813 11,078 12,959 15,624 18,887 (+/-)YOY(%) 23.0% 25.7% 17.0% 20.6% 20.9% 净利润 (百万元 ) 2,011 2,393 2,593 3,248 4,097 (+/-)YOY(%) 24.8% 19.0% 8.4% 25.2% 26.2% 全面摊薄 EPS(元) 1.73 2.06 2.24 2.80 3.53 毛利率 (%) 34.3% 33.6% 32.9% 33.3% 34.1% 净资产收益率 (%) 20.4% 19.9% 19.0% 20.5% 22.1% 资料来源：公司年报（ 2024 -2025） ，德邦研究 所 备注：净利润为归属母公司所有者的净利润 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 公司首次覆盖 豪迈科技 （002595.SZ ） 3 / 27 请务必阅读正文之后的信息披露和法律声明 内容目录 1. 公司概况：全球轮胎模具领先，打造精密制造平台型企业 ................................ .......... 6 1.1. 业务构成：全球轮胎模具领先，四大业务协同助力企业升级 .............................. 6 1.2. 发展历程：模具业务筑基，持续拓展高端装备 ................................ ................... 7 1.3. 股权结构：股权结构集中而稳定，创始团队长期控股 ................................ ......... 8 1.4. 经营分析：业绩稳健增长，盈利能力中枢上移 ................................ ................... 9 2. 业务分析 ................................ ................................ ................................ .................... 12 2.1. 轮胎模具：定制化耗材，产量与迭代双重驱动 .........  汽车依赖轮胎附着力的性能约束提供创新路径，展示了航天技术向汽车领域迁移的创新潜力，有望成为产业技术升级的奠基。 线控与轻量化技术应用深化，关注中国汽零企业成长机遇。我们认为： 1 ）轻量化设计：座椅与底盘结构一体成型，通过 减重提升性能，对轻量化结构件提出更高要求； 2 ）线控系统：整车采用线控转向、制动及油门，以电子控制替代传统机械传 动，带动执行器、传感器及控制单元的配套需求； 3 ）喷气推进：高压空气经储存、分配后喷出以产生推力，带来储气罐、阀件 及配套气路控制需求。随着相关技术逐步应用，上述零部件有望迎来增量需求，关注具备技术积累优势的中国汽车零部件企业的 机遇。 估值与建议 1 ）轻量化材料：拓普集团、旭升集团、爱柯迪； 2 ）被动安全：松原安全、均胜电子； 3 ）减震及压缩机：保隆科技、中 鼎股份； 4 ）线控系统：耐世特； 5 ）电机铁芯：震裕科技； 6 ）惯导：华依科技。建议关注：绝缘热失控：固德电材（未覆 盖）。 风险 量产落地节奏不及预期，技术可靠性风险，监管准入风险。 下载日志已记录，仅供内部参考", "status": "extracted"}, "post:2026-10-18T19-43:15214fc99bc8": {"id": "post:2026-10-18T19-43:15214fc99bc8", "kind": "post", "title": "2026-10-18 19:43", "source_label": "帖子正文", "excerpt": "光芯片、利基存储、AI 制药、CCL 树脂、涤纶长丝🔦【光芯片】📌北美方面希望通过 FCC 规则，提高美国供应链在高速率产品中的价格权重，压缩中国模块厂利润，使利润回流北美。📊Coherent 今年 EML 总产能约为 5000 万只，其中 80% 为 100G 产品，20% 为 200G 产品。", "content": "光芯片、利基存储、AI 制药、CCL 树脂、涤纶长丝🔦【光芯片】📌北美方面希望通过 FCC 规则，提高美国供应链在高速率产品中的价格权重，压缩中国模块厂利润，使利润回流北美。📊Coherent 今年 EML 总产能约为 5000 万只，其中 80% 为 100G 产品，20% 为 200G 产品。 📈明年将在现有基础上翻倍至约 1 亿只。 🔧硅光环节的 Know‑how 实际分为两层：一是设计端，二是流片端。 ⚠️国内厂商希望将设计与流片一体化、实现全流程自主控制，但FCC 规则下这条路很难走通。💾【利基存储】💰NOR Flash 小容量价格已至客户承受上限，2027 年价格将在高位横盘。🔥MLC NAND 供需非常紧张，第一季度涨幅超 120%，第二季度至第四季度每季度环比涨幅接近翻倍，预计明年涨幅不低于今年。📈SLC NAND 因减产和 2D MLC 极度缺货回流，其需求和价格进一步拉高，第四季度预计涨幅 50% 以上。🧪【AI 制药】⚡AI 制药在小分子领域的进展快于大分子，源于化学药物已经有近百年发展史，积累了大量数据，而抗体类药物发展时间短，数据数量和质量都远远不够。🔬AI 公司通过自建实验室或委托 CRO 生成私有数据，湿实验产能环节短期构成瓶颈，但技术方面并不存在显著壁垒。💡AI 制药公司的底层算法模型无法构成颠覆性的差异化，更重要的还是数据方面，科学家对数据的理解基于行业 know‑how，无法用 AI 来代替。🧩【CCL 树脂】🧪M9 树脂体系中碳氢含量明显提升，碳氢树脂中 BCB 约占 70%、ODV 约 20%、SEPS 约 10%。 🛠️方案层面已形成 M9 碳氢配 Q 布、纯 PTFE、碳氢与 PTFE 混压三条并行路线，正在测试无布碳氢路线。 ✅目前混压与无布碳氢是较有希望被采用的折中路线。 ⚠️供给端约束明显，BCB 由陶氏化学主导，国产供应商主要为东材和圣泉。 📊2026 年碳氢树脂用量约 1500 吨，2027 年保守翻倍，长期看涨价空间较大。🧵【涤纶长丝】📦今年终端一直未补库，整体库存处于低位。 💸价格高位情况下，很难引发主动补库，只能是被动补库。 🏭受上游原材料成本影响，今年各家开工率不佳，桐昆、新凤鸣、恒逸三家联合减产约 30%。📈今年内需相对较差，但对下半年需求总体偏乐观，因为上半年淡季下游未做库存，下半年旺季需被动补库。#文字观点", "publish_time": "2026-10-18 19:43", "tags": ["文字观点"]}, "post:2026-10-18T19-30:fe58da819055": {"id": "post:2026-10-18T19-30:fe58da819055", "kind": "post", "title": "2026-10-18 19:30", "source_label": "帖子正文", "excerpt": "大摩——大中华区科技硬件——2026年OCP全球峰会光子学要点 摩根士丹利在2026年OCP全球峰会第三日全程参与了光子学专题论坛。与会方涵盖英伟达、Meta、微软、甲骨文、博通、Celestica、Arista、Ciena、安费诺、Lumentum及华为等产业链核心企业。", "content": "大摩——大中华区科技硬件——2026年OCP全球峰会光子学要点 摩根士丹利在2026年OCP全球峰会第三日全程参与了光子学专题论坛。与会方涵盖英伟达、Meta、微软、甲骨文、博通、Celestica、Arista、Ciena、安费诺、Lumentum及华为等产业链核心企业。报告核心结论：光互联在AI集群中的战略地位进一步巩固，CPO（共封装光学）与NPO（近封装光学）并非二选一，而是\"两者兼备\"（Both）的共存路径；AI密度的提升高度依赖光互联技术的迭代；新光学技术的五大评估维度已明确；CPO故障根因数据首次被量化；光与铜在scale-up网络中的边界亦得到清晰界定。 六大核心要点 1. CPO与NPO并非互斥：当主持人询问主要行业参与者将采用CPO还是NPO时，几乎所有企业均回答\"两者兼备\"。这标志着产业界对两种技术路线的定位从竞争转向互补——CPO侧重极致密度与功耗优化，NPO侧重可维护性与开放解耦，实际部署中将根据场景灵活组合。 2. AI密度取决于光互联：光子学专题贯穿全天议程，每一场讨论均反复强调光连接在提升AI集群密度中的不可替代性。随着单节点算力逼近物理极限，光互联成为突破scale-up瓶颈的核心杠杆。 3. 新光学技术五大评估指标：性能（performance）、功耗（power）、部署速度（speed to deployment）、成本（cost）、可靠性与可维护性（reliability and serviceability）。华为在演讲中特别指出，NPO在可维护性、开放解耦、可用性及产业落地方面具备显著优势，为其在特定场景下的优先采用提供了技术经济依据。 4. Scale-in作为提升AI密度的新路径：除传统scale-up与scale-out外，scale-in架构成为增强AI密度的新兴手段，进一步拓宽了光互联的应用场景。 5. CPO故障根因量化：83-85%的CPO故障源于外部激光源（ELS, External Laser Source），11-17%源于光纤/连接器问题，灰尘与污垢也是常见故障诱因。这一数据对CPO可靠性改进方向具有直接指导意义——激光源模块化与防尘设计是降本提效的关键。 6. 光与铜的共存边界：全光Pod（Full Optical Pod）针对规模超过576颗加速器的scale-up场景；在72至576颗加速器的区间内，光与铜将长期共存。这一分层界定为网络设备商与光模块厂商的产品路线图提供了清晰的部署指引。 行业覆盖与评级分布 摩根士丹利大中华区科技硬件团队覆盖广泛，以下为部分重点公司当前评级（截至2026年10月15日）： • 跑赢大市（Overweight）：中际旭创（300308.SZ/3308.HK）、新易盛（300502.SZ）、天孚通信（300394.SZ）、华为产业链相关标的等。 • 与大盘同步（Equal-weight）：舜宇光学（2382.HK）、联想（0992.HK）、立讯精密（002475.SZ/2475.HK）等。 • 跑输大盘（Underweight）：光迅科技（002281.SZ）、长江通信（603236.SS）等。 投资启示 光子学论坛传递的信号明确：光互联是AI基础设施投资的确定性方向，CPO与NPO的并行发展为光模块、激光器、连接器及设备商创造了多维增长空间。华为等厂商对NPO的积极评价，以及CPO故障数据的透明化，有助于市场更理性地评估技术演进节奏与供应链受益顺序。短期关注NPO可维护性优势带来的增量机会，中长期持续看好CPO在超大规模集群中的渗透率提升。#文字观点", "publish_time": "2026-10-18 19:30", "tags": ["文字观点"]}, "post:2026-10-18T09-23:35bea295577f": {"id": "post:2026-10-18T09-23:35bea295577f", "kind": "post", "title": "2026-10-18 09:23", "source_label": "帖子正文", "excerpt": "OCP 2026—— 仍有不少硬骨头，但问题大多已知📌今年 OCP 大会新增增量信息有限，超大规模云服务商在数据中心扩容中遇到的各类挑战，已经在 GTC、ECOC、OFC、台北电脑展等会议上得到充分探讨。📉在市场回调环境下，鉴于 NPO 技术催化，我们看好 LITE、COHR，但本次 OCP 大会并", "content": "OCP 2026—— 仍有不少硬骨头，但问题大多已知📌今年 OCP 大会新增增量信息有限，超大规模云服务商在数据中心扩容中遇到的各类挑战，已经在 GTC、ECOC、OFC、台北电脑展等会议上得到充分探讨。 📉在市场回调环境下，鉴于 NPO 技术催化，我们看好 LITE、COHR，但本次 OCP 大会并未改变我们原有观点。 核心要点 🎯OCP 旨在汇聚超大规模云服务商与 AI 生态，针对各类行业难题寻找通用解决方案。 📜过去几年，超级以太网联盟、ESUN 等组织提出多项方案，推动通用网络标准落地，大会能够输出较多增量信息。 🔎本届大会重点聚焦电网到数据中心的电力连接、CPU 多元化、以及持续的 NPO/CPO 技术路线争论。💬NPO 与 CPO 的路线之争已经在 ECOC 会议充分讨论，本次大会带来的增量信息低于我们此前预期。 ⚡短期来看，以太网扩容赛道具备最强增量机会，利好 CSCO、ANET；NPO/CPO 赛道对 LITE、COHR、KEYS 具备最大催化。 👥我们于 10 月 12‑15 日参加了在加州圣何塞举办的开放计算项目全球峰会。 🏟️共有 15000 名参会者涌入圣何塞会议中心，多数内容是参会者已经有所了解的行业信息。 📈和绝大多数 AI 生态会议一样，本届 OCP 参会人数大幅增长，会场已经难以承载全部客流，有 3000 名额外参会者被拒之门外。 📋会议设置 4 天深度议题，全部围绕如何以更低功耗实现更高算力展开讨论。 🤔但经过今年多场高规格行业会议之后，我们认为本次 OCP 并没有把相关议题的讨论向前大幅推进（对比往届，例如以太网挑战 InfiniBand、ESUM 挑战 NVLink 的阶段）。 💡抛开股价表现不谈，超大规模云服务商本周明确表示，当前核心要解决的就是算力扩容问题，为此需要更多电力、GPU/CPU、互联器件以及光器件，也就是下游需求基本面向好。 ✅从受益标的来看，以太网依旧是被青睐的互联标准，利好 ANET、CSCO；规模化光互联是大势所趋，利好 LITE、COHR；多套架构开展试验、光器件测试规模扩大，KEYS 的重要性进一步提升。 🔧充分挖掘现有基础设施潜力，其重要性已经和新增扩容不相上下。 🌐网络在 AI 系统当中承担的角色愈发重要，一方面用于连接更多加速器，另一方面要让已部署算力产出更多业务价值。 ⚡高速链路依旧必不可少，但减少中断、提升资源利用率，正越来越成为同一笔投资决策当中的重要考量。 📈我们看到网络相关公司迎来越来越多机遇，而并非单一产品周期驱动行情。 ⚠️与此同时，客户也在努力降低支撑大型集群所需的设备数量与功耗。 💰整体市场规模扩大带来支撑，但仅靠带宽增长已经不能决定供应商营收。 📊随着各类架构逐步成熟，客户实际部署方案、设备价值含量、运行表现，将会成为越来越关键的差异化因素。 🔓开放系统逐步走向落地，供应商选择多样性依旧是优先诉求。 🔧通用交换平台、可移植性更强的软件，意在减少重复工程开发，降低新硬件导入门槛。 💡光器件设计也在走相同路线，开放规范逐步转化为实际产品并完成资质认证。 🎯客户希望实现更低功耗、更高密度，同时不愿放弃多供应商供给格局，也不希望维修操作带来更大业务扰动。 🤝这意味着多条架构会长期共存，不会快速过渡到某单一架构。 🏢ANET、CSCO 需要依靠集成能力与运维能力打造差异化；对于 LITE 与 COHR，光器件整体渗透率提升，需要和每一套设计当中留存的器件价值分开看待。 🌐以太网已经跳出早期扩容标准的讨论阶段。 🚀以太网扩容交换机已经实现出货，通用交换架构需求进一步明确，市场机会变得更加具象，不过新规范的落地应用依旧存在滞后。 📈客户基于统一网络底座连接大规模算力集群，ANET 与 CSCO 可触达的潜在市场进一步拓宽。 ⚠️开放度提升，并不代表来自英伟达的竞争会减弱，英伟达支持多款网络操作系统，并且在整个网络技术栈开展多方合作。 ⚖️赢得架构层面的辩论，和拿下系统业务订单是两回事，下一步关键节点是量产平台落地与供应商选型。 🔗跨集群规模互联已经成为集群设计的组成部分，不再是独立的网络升级项目。 🌍跨站点算力互联，会直接把时延、拥塞、故障恢复纳入 AI 工作负载的成本收益核算。 📡长距离传输打开光传输设备市场空间，我们认为这一点对 CIEN 尤为关键。 📊路由与交换设备同样迎来增长机遇，不过行业在缓存处理、网络智能部署位置上存在不同技术路线。 ❗我们不能假定所有分布式集群都采用完全相同的报文架构。站点之间部署的传输容量，与客户选择的光传输、路由设备组合同样重要。#文字观点", "publish_time": "2026-10-18 09:23", "tags": ["文字观点"]}, "post:2026-10-18T19-15:cdbfcc773bfc": {"id": "post:2026-10-18T19-15:cdbfcc773bfc", "kind": "post", "title": "2026-10-18 19:15", "source_label": "帖子正文", "excerpt": "【松发股份】10月16日，松发股份总经理陈汉伦在第三届恒力·绿色船舶发展大会上介绍，恒力重工造船板块手持订单已经超过600艘，新造船订单排至2030年公司船型趋向高端化。", "content": "【松发股份】10月16日，松发股份总经理陈汉伦在第三届恒力·绿色船舶发展大会上介绍，恒力重工造船板块手持订单已经超过600艘，新造船订单排至2030年公司船型趋向高端化。2026年上半年公司新承接船舶订单207艘，其中散货船49艘、集装箱船56艘、油轮94艘、超大型液氨运输船（VLAC）8艘。油轮已成为当期新接订单中数量最多的船型，集装箱船和气体船业务也同步扩大。恒力重工自主研发的新一代VLCC手持订单量已位居全球第一。 持续聚焦【超强阿尔法】！近期重点：松发股份、华通线缆、九州一轨1、【松发股份】船舶中阿尔法最强的之一。我们预计【松发股份】单三季度净利润超30亿元，业绩大幅增长。明后年业绩持续大幅增长！ 2、【华通线缆】攻防兼备！三季报业绩超市场预期。未来有望“老登”变“小登”！低估值标的，新兴业务有望突破，不仅仅是非洲电解铝，业绩和估值有望双提升！不缺催化剂！ 3、【九州一轨】金刚石散热打开空间，不仅仅是硅光芯片激光隐切加工服务。金刚石散热中单晶金刚石路线有望率先突破，“订单为王”。公司北京金刚石芯片基板项目投产临近，近期我们将安排现场学习。#文字观点", "publish_time": "2026-10-18 19:15", "tags": ["文字观点"]}, "post:2026-10-18T19-15:68705cfe6b7e": {"id": "post:2026-10-18T19-15:68705cfe6b7e", "kind": "post", "title": "2026-10-18 19:15", "source_label": "帖子正文", "excerpt": "核心观点：#长期来看，基于目前全球航运船队老龄化及新能源化的底层逻辑，叠加全球地缘政治冲突激烈化、全球贸易格局碎片化趋势，集装箱船、油轮、散货船行情轮动交替演绎，我们判断本轮造船景", "content": "造船行业周度更新系列（31）：运价维持历史高位，二手船价继续环比大涨，造船&海工长景气周期趋势向好，重点看好#松发股份、中国船舶、中集集团、中国动力#二手船价环比继续大涨，与新船价格大幅倒挂： 本周Clarksons新船价格指数186.7点，自26年3月以来环比连续7月上涨。二手船价格指数达229.1点，环比上周上涨2.2%，继续突破前高。本周Clarksons综合运价平均达77403美元/天，维持历史高位。目前新船价格与二手船价格出现大幅倒挂，根据Clarksons数据，目前一艘3年内VLCC现船价格达1.8亿美金，而一艘VLCC新造船价格仅1.3亿美金。 #2026Q1~Q3新船订单创2007年以来新高： 2026年9月全球新船订单约800万CGT/220亿美金，同比分别增长13%/12%。2026年Q1~Q3全球造船订单约7071万CGT/2050亿美金（油轮/集装箱船/散货船/气体运输船分别占比30%/28%/15%/14%），分别同比增长57%/55%，新船订单量超过2024年前高，创2007年以来新高。目前全球造船厂在手订单约2.26亿CGT/6.01亿DWT，在手订单保障年数4.56年，造船行业景气持续。#核心观点：#长期来看，基于目前全球航运船队老龄化及新能源化的底层逻辑，叠加全球地缘政治冲突激烈化、全球贸易格局碎片化趋势，集装箱船、油轮、散货船行情轮动交替演绎，我们判断本轮造船景气周期可持续至2030年以后。 #短期来看，我们看好2026年造船行业复苏行情，全球新造船订单自25年11月以来延续强劲复苏态势（美国关税/301调查谈判落地、叠加下游油运市场景气持续上行），新船价格指数自26年3月以来已经连续上涨，当下中船、恒力、扬子江等主要船厂业绩已呈现加速释放态势，随着行业贝塔复苏，无论从行业景气度、业绩的确定性和弹性还是估值性价比角度看（#松发股份、中国船舶2027年PE约10倍左右（Wind一致预期）），造船行业为2026值得重点关注和配置的板块，当前时点作重点推荐。#重点关注标的：恒力重工、中集集团、中国船舶、中国动力、扬子江、船舶ETF、苏美达、中船防务H、中国船舶租赁、纽威股份、亚星锚链。#文字观点", "publish_time": "2026-10-18 19:15", "tags": ["核心观点", "重点关注标的", "文字观点"]}, "post:2026-10-18T17-02:bc1ec52667a7": {"id": "post:2026-10-18T17-02:bc1ec52667a7", "kind": "post", "title": "2026-10-18 17:02", "source_label": "帖子正文", "excerpt": "看好船舶、半导体设备，关注低位的海工油服-20261018 1.#船舶。", "content": "【广发机械】周观点更新：继续看好船舶、半导体设备，关注低位的海工油服-20261018 1.#船舶。恒力重工首制两艘LNG双燃料21000标准箱超大型集装箱船出坞，双船同坞铺龙骨、搭载并同时出坞。9月造船价格指数186.59，同比+0.55%、环比+0.13%，继续回升，油轮和散货船价均已创新高，二手船价指数同比+16.6%。 上周船舶板块波动的核心在于美国拟放松对影子船队部分制裁、市场担忧运力短期释放冲击造船订单，事实上解除这部分运力十分有限，被制裁的船队船龄较高，且过去就持续运营。真正决定新船需求的是船东对于远期的运力决策，包括贸易量和运距、年龄结构、环保政策等，板块增速快、估值低，#继续推荐松发股份、中国船舶、中国动力等，对应27年内PE约10x上下。 2.#半导体设备。台积电Q3营收1.49万亿新台币、yoy +50.9%、qoq +17.6%；净利润7631亿新台币、yoy +68.7%、qoq +8.0%，均创历史新高、超预期，其中3纳米芯片占比达33%。长鑫科技前三季度预计收入2650-2700亿，归母净利润1310-1325亿；中枢对应Q3收入1172，净利润约544亿。金海通预计前三季度归母净利润约3.1-3.4亿元，对应Q3净利润1.54亿、yoy +214%。 正如我们从上半年开始反复强调的：伴随着两存订单的陆续落地，设备板块后续会持续上修订单预期。#后道封测设备已经进入业绩释放周期，核心推荐长川科技、强一股份、华峰测控、精智达、精测电子、金海通等。 3.#工程机械。9月升降工作平台内销9829台、yoy +84.3%；出口10664台，yoy +50.6%。板块自Q3开始业绩转正，大部分公司业绩增速在10-20%左右，出口维持高增长。 4.#其他AI设备。冰轮环境Q3业绩超预期，归母中枢值2.88亿，超出原预期，主要系顿汉布什海外AIDC确收增长。联讯仪器26Q3净利润中枢14.3亿、QOQ +200%，超预期在于公司物料问题基本解决，1.6T占比明显提升。大族激光Q3归母约8.8亿、yoy +135%、qoq -5.6%，符合预期、环比下滑系数控确收节奏影响，前三季度新签订单约243亿、yoy约90%。大族数控Q3收入28.56亿，同环比分别+87.8%/-5.7%；归母5.87亿，同环比分别+157%/-7.4%，环比下滑主要系客户提货节奏影响。#文字观点", "publish_time": "2026-10-18 17:02", "tags": ["文字观点"]}, "post:2026-10-18T22-05:f96b67012cbb": {"id": "post:2026-10-18T22-05:f96b67012cbb", "kind": "post", "title": "2026-10-18 22:05", "source_label": "帖子正文", "excerpt": "周末热点跟踪🔥【长鑫科技】2026年三季报预告点评26年前三季预计营收2650-2700亿元（yoy+726%~742%），归母净利1310-1325亿元（yoy大幅扭亏）。", "content": "周末热点跟踪🔥【长鑫科技】2026年三季报预告点评26年前三季预计营收2650-2700亿元（yoy+726%~742%），归母净利1310-1325亿元（yoy大幅扭亏）。26Q3单季营收约1147-1197亿元（qoq+15%~20%），符合市场预期； 归母净利约534-549亿元（qoq+1%~4%），略低于市场预期（600+）： ⭕️历史亏损抵税效应减弱。上半年依托以前年度亏损、暂时性差异实现所得税抵减 45.4 亿元，Q2 实际所得税率低至 8.8%。一旦 Q3 可抵扣空间收窄，税费增加或将侵蚀部分增量利润。 ⭕️同时，季度内产线代际切换或对业绩造成短期扰动。#净利润或符合预期，静待季报口径合肥二厂、北京厂等fab在Q3贡献主要产能和业绩增量，上述fab在上市公司的持股比例刚过3成，对归母利润形成一定摊薄，未来体外产能扩张可能使集团净利润增速高于归母增速，此次预告未披露净净利润口径，待季报公布后需重点跟踪少数股东损益占比。 #4F²架构技术突破，助力国产存储弯道超车 长鑫科技4F²架构是DRAM存储单元领域的重大突破。其核心创新在于采用自研的VSG晶体管，将晶体管布局从传统的水平转为竖直，实现显著缩小单元面积。同等制程下，4F²单元面积约为6F²的2/3，存储密度理论提升约50%，实际增幅约40%。该架构结合混合键合技术，将存储阵列与外围CMOS电路分别制造并集成，助力良率提升和成本下降。近期，长鑫对外公布，预计2026年底率先推出4F²架构DDR5 RDIMM产品，赋能国产DRAM加速迈向高端行业标杆。 #公司董事长朱一明提议公司回购股份，资金总额10~20亿元，拟用于员工股权激励、员工持股计划或减少注册资本。#文字观点", "publish_time": "2026-10-18 22:05", "tags": ["净利润或符合预期", "静待季报口径", "文字观点"]}, "post:2026-10-18T20-11:134b4294803c": {"id": "post:2026-10-18T20-11:134b4294803c", "kind": "post", "title": "2026-10-18 20:11", "source_label": "帖子正文", "excerpt": "关注公司合并净利润情况 事件：Q3收入符合预期，归母低于市场预期。", "content": "长鑫科技Q3归母利润低于预期 长鑫科技业绩预告解析：归母增速低于市场预期，预计少数股东权益占比为主要原因，后续关注公司合并净利润情况 事件：Q3收入符合预期，归母低于市场预期。公司披露业绩预告，单Q3看预计收入1147-1197亿元（我们业绩前瞻预期1180-1250亿元），中值环比+17.8%；归母净利润534-549亿元（我们业绩前瞻预期600-650亿元），中值环比+2.5%。 1 如何理解业绩表现？我们认为利润归母比例或发生变动，同时新工艺代际技改与研发项目占用产线影响产量。 1）少数股东损益因素：体内三座晶圆厂，除合肥一期为上市公司全资持有外，北京一期、合肥二期上市公司穿透股权分别为32%/15%，不同产线利润贡献变化可能是本次归母表现偏弱的主要原因。a）2026年新增产能片数主要来自北京厂，推高少数股东权益比例；b）G3向G4/G4向G5等代际技改通常需要分批停线，我们预计Q3全资老产线持续推进技改影响产出；c）HBM、G5、4F²等研发预计占用产线资源，影响可销售产出。上述因素仍需三季报及后续经营信息交叉验证。 2）毛利率因素：Q3服务器dram仍处涨价区间，我们判断毛利率预计仍表现强劲。 2 怎么看后续表现？我们认为应区分阶段性扰动与长期成长，若上述判断成立则无需过度担忧。 公司层面：1）毛利率看，若上述判断成立，毛利率预计维持高位；单Q3合并净利润预计约850-900亿元，环比约+14%-20%与收入增速对齐；2）少数股东杠杆看，从管理一致性、地方政府化债等角度看，合肥二期、北京一期的少数股权及后续上海、合肥、北京三大新厂，不排除整合至上市公司体内的可能性；3）公司正处于研发成果密集推出、新产品/框架准商业化阶段，研发、技改的投入与产线占用或带来短期业绩扰动，后续建议持续关注HBM、G5、4F²的商业化节奏。 行业层面：我们认为DRAM供需偏紧有望延续至2028年的基本面向好趋势不变，支撑价格持续维持高位。 中长期看，长鑫科技作为国内DRAM制造龙头，有望持续受益于行业景气、国产替代与技术升级，我们维持积极观点，建议密切关注公司三季报具体情况。#文字观点", "publish_time": "2026-10-18 20:11", "tags": ["文字观点"]}, "post:2026-10-18T20-28:e00974270e06": {"id": "post:2026-10-18T20-28:e00974270e06", "kind": "post", "title": "2026-10-18 20:28", "source_label": "帖子正文", "excerpt": "看好AI4S&物理AI&AI安全等落地场景，低位板块共振有望延续。", "content": "【东北计算机】20261018行业周报：业绩为王，应用提速 —————————————— 计算机(申万)指数本周下跌5.02%，创业板指数本周下跌8.90%，上证指数本周下跌2.56%。 行业观点： 1️⃣对于AI硬件端，我们维持观点：#短 03c/h2>\n\u003cul>\n\u003cli>AI算力主线仍围绕资本支出回报与“第二层受益者”展开：讨论认为AI capex周期大概率仍有进一步上行空间，每吉瓦AI容量成本中约40%流向网络、电力、冷却和建筑，而非服务器/GPU；台积电Q3净利同比+68.7%，并明确2026-2028年资本开支将大幅超过过去三年约1010亿美元。\u003c/li>\n\u003cli>存储“担忧之墙”总体被判断为偏过度：三星扩产、长鑫4F² DRAM推进、部分AI芯片下调HBM配置，短期不足以扭转DRAM/NAND紧张格局；2027年全球AI GPU及加速器出货量预计约2,849万颗，同比增长68%。\u003c/li>\n\u003cli>PCB/CCL的Q3业绩全面验证景气：沪电股份预计前三季度归母净利润54.5—57亿元、同比增长101%—110%；生益科技预计64.6—68.7亿元、同比增长164%—181%；上游电子布、铜箔及覆铜板供应偏紧，为板厂后续顺价提供支撑。\u003c/li>\n\u003cli>策略端转向防御与结构分化：中国股票策略下调上证综指、沪深300、深证成指目标位9%—15%至4100点、4800点、14500点，对应8%—15%上行空间；Q4重视哑铃防御，高股息红利资产有望继续获取超额收益。\u003c/li>\n\u003cli>大模型方面，Anthropic Q3营收168亿美元，环比增长46.1%，连续第二个季度实现调整后盈利并录得正向现金流；市场主要担忧环比增速放缓，Q3也受到蒸馏封禁、OpenAI竞争等因素影响。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线：AI算力/大模型。\u003c/strong> 今天强化的逻辑：AI capex周期大概率仍有上行空间，成本结构显示每吉瓦AI容量约40%流向网络、电力、冷却和建筑；国产算力链短期下跌不改产业向上趋势，长鑫4F2及G5。今天出现的催化/验证：Anthropic Q3营收168亿美元、环比+46.1%且连续第二季度调整后盈利并录得正向现金流；台积电Q3净利同比+68.7%，2026-2028年资本开支将大幅超过过去三年约1010亿美元。\u003c/li>\n\u003cli>\u003cstrong>主线：半导体/存储。\u003c/strong> 今天强化的逻辑：市场对存储行业担忧总体偏过度，三星扩产、长鑫4F² DRAM、部分AI芯片下调HBM配置短期不足以扭转DRAM和NAND紧张格局；AI存储需求正从HBM扩散至DDR和NAND。今天出现的催化/验证：CXMT 4F²在同工艺节点下内存密度可提升约30%；存储芯片股估值经历约3.5个月深度回调后已经触底，三星与海力士股价自6月高点均下跌超50%，2027-2028年一致预期EPS对应PE仅2-3倍；HBM市场面临AI建设浪潮中规模最大的供需失衡之一，B300租赁价格较上月上涨超过20%。\u003c/li>\n\u003cli>\u003cstrong>主线：PCB/CCL。\u003c/strong> 今天强化的逻辑：Q3业绩全面验证，一线高景气延续、二线PCB盈利弹性集中爆发；上游电子布、铜箔及覆铜板供应偏紧，为板厂后续顺价提供支撑。今天出现的催化/验证：沪电股份预计前三季度归母净利润54.5—57亿元、同比增长101%—110%；生益科技预计64.6—68.7亿元、同比增长164%—181%；景旺电子扩产推动AI服务器及光模块PCB业务增长。\u003c/li>\n\u003cli>\u003cstrong>主线：光通信/CPO。\u003c/strong> 今天强化的逻辑：光互联在AI集群中的战略地位进一步巩固，CPO与NPO并非二选一，而是“两者兼备”的共存路径；AI数据中心互联呈现“内部用铜、外部用光，CPO居中”，硅光是支撑交换机周边更高密度光互联的底层芯片技术。今天出现的催化/验证：OCP 2026光子学论坛覆盖英伟达、Meta、微软、甲骨文、博通等产业链核心企业；OCP大会新增增量信息有限，市场回调环境下鉴于NPO技术催化看好LITE、COHR，但大会并未改变原有观点。\u003c/li>\n\u003cli>\u003cstrong>主线：液冷/电源。\u003c/strong> 今天强化的逻辑：AI服务器及光模块液冷业务推动增长，管理层对从消费电子向AI数据中心业务拓展保持乐观，业务方向涵盖液冷与电源管理；液冷芯片级散热趋势受到讨论。今天出现的催化/验证：领益智造子公司瑞达东莞工厂调研显示，管理层坚持长期产能扩张目标，计划将液冷产能提升至远高于当前水平；计算机周报讨论海外大模型ARR与液冷芯片级散热趋势。\u003c/li>\n\u003cli>\u003cstrong>主线：宏观/策略防御。\u003c/strong> 今天强化的逻辑：市场呈现显著结构分化，Q4重视哑铃防御，高股息红利资产有望继续获取超额收益；中国股票策略转向避险，下调上证综指、沪深300、深证成指目标位9%—15%至4100点、4800点、14500点，对应8%—15%上行空间；保险3Q26业绩前瞻预计净利润与NBV转同比下滑，维持防御姿态。今天出现的催化/验证：中国主要险企将于10月28日至30日披露3Q26业绩；保费7-8月同比增速恶化至-13%（1H26为+4%）；有研报指出市场调整接近尾声，本轮剧烈调整由机构重仓股诱发并传导至高融资占比板块，国债ETF净流入速度显示资金避险意愿仍偏高。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>AI建设经济学讨论将焦点放在AI资本支出回报能否超越资本成本，并认为AI capex周期大概率仍有进一步上行空间；成本结构上，每吉瓦AI容量约40%流向网络、电力、冷却和建筑。\u003c/li>\n\u003cli>Anthropic Q3营收168亿美元，环比增长46.1%，连续第二个季度实现调整后盈利并录得正向现金流；市场主要担忧环比增速放缓，Q3也受到蒸馏封禁、OpenAI竞争等因素影响。\u003c/li>\n\u003cli>台积电Q3净利同比+68.7%，并明确2026-2028年资本开支将大幅超过过去三年约1010亿美元。\u003c/li>\n\u003cli>长鑫科技2026年前三季预计营收2650—2700亿元（yoy+726%—742%），归母净利1310—1325亿元（yoy大幅扭亏）；科技行业报告提到长鑫4F2及G5。\u003c/li>\n\u003cli>PCB业绩预告落地：沪电股份预计前三季度归母净利润54.5—57亿元、同比增长101%—110%；生益科技预计64.6—68.7亿元、同比增长164%—181%。\u003c/li>\n\u003cli>特斯拉第二代Roadster在得州展示，现场演示倒挂行驶、短暂腾空及空中转向；相关拆解提到物料清单里大部分金额价值似乎来自SpaceX，特斯拉与SpaceX之间的合作关系似乎正在不断深化。\u003c/li>\n\u003cli>中国股票策略下调上证综指、沪深300、深证成指目标位9%—15%至4100点、4800点、14500点，对应8%—15%上行空间；核心重点事件包括三季度财报、美国中期选举、政策会议。\u003c/li>\n\u003cli>存储观点称存储芯片股估值在经历约3.5个月深度回调后已经触底，三星与海力士自6月高点均下跌超50%，2027-2028年一致预期EPS对应PE仅2-3倍；HBM市场正面临AI建设浪潮中规模最大的供需失衡之一，B300租赁价格较上月上涨超过20%。\u003c/li>\n\u003cli>煤炭调研显示，即便把煤矿复产因素纳入考量，山西省煤炭产量相较2025年水平仍有可能下滑10%；进入10月后内陆电厂补库开启，冬储叠加大秦检修环境下，本周港口煤价以每日5元幅度上涨。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>险企10月28日至30日披露3Q26业绩，跟踪净利润与NBV是否转负、权益投资策略调整及降低短期波动措施。\u003c/li>\n\u003cli>中国股票策略列出的三季度财报、美国中期选举、政策会议。\u003c/li>\n\u003cli>AI capex回报与资本成本的匹配情况，以及网络、电力、冷却、建筑等“第二层受益者”的订单兑现。\u003c/li>\n\u003cli>DRAM/NAND紧张格局能否延续，跟踪三星扩产、长鑫4F² DRAM进展、部分AI芯片HBM配置调整；HBM供需失衡与GPU租赁价格变化。\u003c/li>\n\u003cli>PCB上游电子布、铜箔、覆铜板供应偏紧及板厂顺价情况，二线PCB盈利弹性持续性。\u003c/li>\n\u003cli>CPO/NPO技术催化及OCP后产业链订单/路线验证，光互联领域铜方案与光方案博弈。\u003c/li>\n\u003cli>液冷产能扩张落地及芯片级散热趋势，AI服务器/光模块液冷业务放量。\u003c/li>\n\u003cli>美国户用光伏Q
