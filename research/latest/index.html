D推出HelionCPU机柜，最高达32,768个EPYC核心，VeniceCPU则提供192核及LPDDR版本。 ☀美国调研—供应链与算力经济性：Neocloud中短期电力供应风险有限；模块化机房最快约3个月完工，液冷仍为瓶颈，机柜价格持续上涨(GB300US$5.5–6.5m、VR200US$8m)；推理经济性具挑战，GPU利用率仅20–30%，Token成本每年下降5–10x，但内存及散热成本上升；AgenticAI推动CPU/加速器比例至1:1，CPUTAM有望翻倍。 ☀AMD、FIT及ALAB展台反馈：重点包括Helion机柜出货、Helio机柜挑战及规格、FIT于12.8T的XPO冷板，及ALAB面向NPO的Aries7系列。#文字观点", "publish_time": "2026-10-16 12:00", "tags": ["文字观点"]}, "post:2026-10-16T08-39:d8707c44e67a": {"id": "post:2026-10-16T08-39:d8707c44e67a", "kind": "post", "title": "2026-10-16 08:39", "source_label": "帖子正文", "excerpt": "AI/光通信随笔：捋一下分歧，找一下信心老黄最新BG2 访谈点出一个关键分歧：Capex回报之问是问错了对象，市场试图把数万亿建设押在两家实验室营收上。英伟达算力约三分之一是与AI 实验室无关的基础计算（仿真、数据处理、经典 ML，年增30–40%）", "content": "AI/光通信随笔：捋一下分歧，找一下信心老黄最新BG2 访谈点出一个关键分歧：Capex回报之问是问错了对象，市场试图把数万亿建设押在两家实验室营收上。英伟达算力约三分之一是与AI 实验室无关的基础计算（仿真、数据处理、经典 ML，年增30–40%）；约四分之一到三分之一是前沿实验室——且是 5–6 家不是 2家；约三分之一是数千家初创公司租用算力，其中 80% 用开源模型做垂直领域。AI进步和收益之辩：A股一些AI链核心标的YTD涨跌幅转负。对比25年，AI产业26年在coding和2C Agent上取得商业化突破，头部AI模型厂从大量烧钱转向盈利，AI硬件业绩端实现三位数增长。最大负面变化在宏观环境，涉及利率、油价、地缘、选举，也是市场争论的焦点。商业变现的展望：基于Token收费模式的ARR增长被一些观点认为有增长瓶颈，但Agent的商业模式有期待，基于广告收费，或者平台take rate？物理AI则带来更远期端侧的更大想象空间。GPU租赁/云计算价格 vs 利率：新云的商业模式有远期隐患，在美股一直有定价，但GPU租赁价格创新高，能否抗住利率和CDS的上行？需求成立条件下，新云的算力资源可以被再分配，不带来系统性风险（如CRWV只占26年Capex总额的5%以内），核心还是看头部CSP。云计算涨价同样在进行，TaaS带来更高利润率，云商回本周期缩短，自由现金流改善速度或超预期。27年期待什么新范式：RSI（里程碑进步）、垂类agent（硅谷start-up的主力）、AI4S、物理AI；AI作为生产力工具对产业的影响不可逆，Capex投入不但服务训练研发，也支持日常工作流的推理。后续催化看什么：利率和油价、10-11月Anthropic的ARR（看Opus和Sonnet表现），10月云商财报（看云计算收入/利润率、现金流、27年Capex指引）、11月中期选举、28年AI硬件forecast、蹲新范式。#文字观点", "publish_time": "2026-10-16 08:39", "tags": ["文字观点"]}, "post:2026-10-16T08-41:b7b7da6c73f8": {"id": "post:2026-10-16T08-41:b7b7da6c73f8", "kind": "post", "title": "2026-10-16 08:41", "source_label": "帖子正文", "excerpt": "📰消息人士称：Anthropic 营收增长放缓，投资者下调对其 IPO 估值的预期 🌍纽约，10 月 15 日（路透社）—— 四位知情人士表示，在 Anthropic 披露最新财务数据后，该公司的部分现有投资者及其即将进行首次公开募股（IPO）的潜在投资者，正在考虑给这家人工智能公司较低的估值。与此", "content": "📰消息人士称：Anthropic 营收增长放缓，投资者下调对其 IPO 估值的预期 🌍纽约，10 月 15 日（路透社）—— 四位知情人士表示，在 Anthropic 披露最新财务数据后，该公司的部分现有投资者及其即将进行首次公开募股（IPO）的潜在投资者，正在考虑给这家人工智能公司较低的估值。与此同时，市场对人工智能融资成本不断飙升的担忧也在加剧。 💬三位知情人士称，周三在旧金山参加 Anthropic 投资者日活动的一些投资者讨论了约 1.5 万亿美元的估值，较投资者此前对 11 月股份出售所预期的约 2 万亿美元大幅下调。 📊Anthropic 周三在会议上向潜在 IPO 投资者表示，该公司第三季度营收环比增长 45%，达到 168 亿美元；按调整后口径计算，该季度实现盈利。 📝知情人士补充说，尽管这些数据缓解了部分投资者对开发人工智能系统巨额成本的担忧，但一些投资者对最新季度营收环比增速放缓感到失望。Anthropic 营收从第一季度到第二季度增长逾一倍，达到 116 亿美元。由于无权公开谈论此事，他们要求匿名。 🤝Anthropic 未立即回应置评请求。 📈标杆性 IPO⚠️投资者的担忧正值科技股抛售席卷全球金融市场之际，此轮抛售冲击了人工智能基础设施公司、芯片制造商，以及广义上出租人工智能计算能力的所谓 “新云” 服务商。英伟达（NVDA.O）支持的 CoreWeave（CRWV.O）股价和债券周四大幅下跌，反映出投资者日益担忧人工智能基础设施建设正越来越多地依靠借款融资。 📉Anthropic 若以令人失望的条件出售股份，可能会进一步加剧投资者对人工智能基础设施建设的担忧。 📌近期，IPO 市场遭遇了一些挫折。数据中心运营商 SB Energy 上月决定推迟上市，而核技术公司 Holtec Nuclear 则撤回了上市计划。 🏢周三，在 Anthropic 位于旧金山的总部举行的会议上，与会者大多是该公司最重要的投资者，他们与首席执行官达里奥・阿莫代伊和首席财务官克里希纳・拉奥会面。 ℹ️《The Information》此前报道称，投资者正在考虑接受较低的估值。 🏛️Anthropic 由包括阿莫代伊及其妹妹丹妮拉・阿莫代伊在内的前 OpenAI 高管于 2021 年创立。丹妮拉现任 Anthropic 总裁。凭借 Claude 系列模型，Anthropic 已成为领先的生成式人工智能开发商之一。该公司快速增长的背后，是 Alphabet（GOOGL.O）旗下谷歌和亚马逊（AMZN.O）的支持，两家公司均是投资者，也是算力供应商与重要分销合作伙伴，同时还是人工智能领域的竞争对手。 📈据路透社上月报道，去年 Anthropic 的营收增长了 12 倍，达到近 46 亿美元；与此同时，该公司经营亏损超过 80 亿美元，不包括各类负债的减记，其中大部分与此前融资有关。在路透社于 9 月独家看到的 IPO 招股说明书中，Anthropic 阐述了其愿景：人工智能将远比工业化、电气化和互联网更深刻地改变全球经济；同时，公司披露 2025 年亏损 420 亿美元，并预计未来将投入更多资金用于人工智能基础设施建设。 📜该公司已承诺在未来十年为云服务、计算能力和基础设施至少支出 5180 亿美元。#文字观点", "publish_time": "2026-10-16 08:41", "tags": ["文字观点"]}, "post:2026-10-16T08-42:d6861f83a8a3": {"id": "post:2026-10-16T08-42:d6861f83a8a3", "kind": "post", "title": "2026-10-16 08:42", "source_label": "帖子正文", "excerpt": "【拓荆科技】拟收购无锡尚积，拓至PVD打造薄膜沉积全品类布局！# 事件：拟发行股份及现金方式收购无锡尚积并募集配套资金 公司拟通过发行股份及支付现金方式收购无锡尚积82.97%股份及其持股平台上海泰纳微、无锡宽行100%股权，并募集配套资金，标的交易价格为25亿元", "content": "【拓荆科技】拟收购无锡尚积，拓至PVD打造薄膜沉积全品类布局！ # 事件：拟发行股份及现金方式收购无锡尚积并募集配套资金 公司拟通过发行股份及支付现金方式收购无锡尚积82.97%股份及其持股平台上海泰纳微、无锡宽行100%股权，并募集配套资金，标的交易价格为25亿元；本次交易后，上市公司将直接及间接持有无锡尚积100%股份。 本次为收购标的发行价格为383元/股。并拟发行股份募集配套资金18.2亿元，发行价格不低于发行期首日前20个交易日公司股票交易均价的80%。 # 无锡尚积业绩/订单良好、承诺为成长护航 无锡尚积是国内少数具备PVD自主研发及规模化量产能力/经验的企业。拓荆深耕薄膜沉积，拥有PECVD/ALD/CVD等多个成熟品类，无锡尚积聚焦PVD，进一步补全公司薄膜沉积领域布局，同时PVD也可用于三维集成领域，与拓荆的混合键合等布局互补。 【营收】公司2025/26H1营收分别为3.0/1.9亿元，分别占上市公司同期营收4.6%/6.6%； 【营收结构】25年营收79%来自PVD设备，16%来自干法刻蚀设备，其余1.2%来自CVD及其他； 【订单】截至2026年6月末，无锡尚积的在手订单金额（不含税）6.51亿元 【利润】公司2025/26H1归母净利润分别为0.1/0.2亿元，分别占上市公司同期归母1.4%/1.6% 【业绩承诺】26-28年将分别实现并表范围内营收3.5/4.5/6.1亿元。 【估值】通常设备公司下半年营收好于上半年，假设26年全年营收达5亿元，当前收购价格对应5倍PS； # 特色工艺领域批量销售、12英寸/先进领域积极拓展 无锡尚积 6 英寸及 8 英寸设备技术成熟度较高，已在功率半导体、MEMS、射频器件等特色工艺领域实现批量销售，12 英寸设备已完成研发并陆续向客户交付及验证。同时，无锡尚积重点推进包括 Silicide、CuBS等先进逻辑及存储相关金属化工艺、TSV/TGV种子层沉积等先进封装工艺技术研发，为无锡尚积PVD产品横向延伸至先进存储/逻辑/封装领域拓展提供技术储备。 # 两存/先进制程扩产预期强化、带动订单上修预期 伴随长鑫IPO进程，长存上市预期，2026年两存扩产预期逐步强化，每万片NAND/DRAM扩产有望带动近百亿的开支增量；先进制程端，随着国产AI、相关消费电子应用需求旺盛，供不应求，有望积极扩产带动上游先进设备需求。公司作为本土薄膜沉积/混合键合龙头，有望深度收益！ 风险提示：下游大型晶圆厂扩产不及预期；行业竞争加剧。#文字观点", "publish_time": "2026-10-16 08:42", "tags": ["文字观点"]}, "post:2026-10-16T08-38:0815e0a1d0a9": {"id": "post:2026-10-16T08-38:0815e0a1d0a9", "kind": "post", "title": "2026-10-16 08:38", "source_label": "帖子正文", "excerpt": "ASML 正在开发一种混合键合设备！📌ASML 尚未发布任何消息，但其专利申请、新闻报道以及其自身的发展路线图都表明了这一点。", "content": "粤芯半导体业绩预告点评：硅光 + 车规模拟共振，营收高增亏损持续收窄，持续推荐 业绩表现：9 月 15 日粤芯半导体发布 2026 年前三季度业绩预告，预计实现营业收入 28.7~29.7 亿元，同比 + 61.27%~66.89%，归母净亏损 14.9~15.9 亿元，同比亏损收窄 5.70%~11.63%；其中 26Q3 预计实现营收 10.8~11.4 亿元，同比 + 58%~65%，环比 + 12%~18%，单季营收创上市以来新高，产能利用率维持高位，规模效应持续显现。 我们认为公司营收高增、亏损持续收窄主要系：需求侧 AI 高速光模块硅光芯片、车规电源管理、工业模拟芯片需求旺盛；产能端三期产线稳步爬坡，现有一二期产线稼动维持高位，四期新增 4 万片 / 月 12 英寸特色产线启动建设；经营端 BCD、高压 MOS、硅光工艺良率持续优化，高端工艺占比提升，单位晶圆制造成本持续下行。 公司充分受益国内成熟特色制程国产替代、AI 硅光 + 汽车电子的产业趋势： 1、硅光晶圆代工：国内稀缺 12 英寸硅光量产平台，覆盖 800G/1.6T 高速光模块、NPO 近封装光学芯片，头部云厂商供应链持续导入，硅光订单持续放量 2、车规 BCD / 功率工艺：车规级 BCD、高压 MOS 工艺客户验证顺利，多家国内车企配套芯片设计公司持续投片，车规业务贡献增量，产品附加值显著提升 3、eNVM 嵌入式存储与 CIS 平台：面向物联网、工控传感器的数模混合工艺持续拓展，国内头部模拟芯片客户覆盖率持续提升，构筑稳定基本盘 投资观点：公司作为大湾区稀缺 12 英寸特色工艺晶圆代工龙头，硅光 + 车规双主线驱动，产能爬坡 + 工艺良率改善共振，长期国产替代空间广阔，成长动能持续兑现，我们持续看好后续增长潜力，维持重点推荐！#文字观点", "publish_time": "2026-10-16 08:38", "tags": ["文字观点"]}, "post:2026-10-16T07-45:908e83a4f9d9": {"id": "post:2026-10-16T07-45:908e83a4f9d9", "kind": "post", "title": "2026-10-16 07:45", "source_label": "帖子正文", "excerpt": 下行风险可控，具备中长期配置价值。然而，短期美元流动性收紧及国内风险偏好修复的时滞意味着市场或呈震荡筑底格局，建议投资者关注三季报盈利兑现及11月重要会议前后的政策催化，逢低分批布局优质成长与顺周期标的。#文字观点", "publish_time": "2026-10-16 09:43", "tags": ["文字观点"]}, "post:2026-10-16T09-42:35f015b73f74": {"id": "post:2026-10-16T09-42:35f015b73f74", "kind": "post", "title": "2026-10-16 09:42", "source_label": "帖子正文", "excerpt": "【东财宏观】每日宏观资讯台（2026年10月16日）#国际重要资讯①【美国】美国9月PPI同比增长6.3%，预估5.3%，前值5.4%。美国9月PPI环比增长1.3%，预估0.6%。", "content": "【东财宏观】每日宏观资讯台（2026年10月16日）#国际重要资讯①【美国】美国9月PPI同比增长6.3%，预估5.3%，前值5.4%。美国9月PPI环比增长1.3%，预估0.6%。美国上周初请失业金人数为19.9万人，预期20万人，前值由19.7万人修正为19.8万人。 ②【中东】据央视新闻援引也门胡塞武装当地时间10月15日发布的信息，沙特主导的联军当天上午空袭了也门塔伊兹省的一处通信设施和一所学校。 ③【粮食】法国财政部长罗兰表示，七国集团已拨款25亿欧元（约合28亿美元），用于向较贫困国家，特别是非洲国家提供化肥并加强粮食安全。 ④【农业】联合国国际农业发展基金总裁阿尔瓦罗·拉里奥15日说，霍尔木兹海峡航运受阻对全球农业生产的影响日益凸显，或导致农作物减产，进一步推高粮食价格。 ⑤【英国】英国央行副行长布里登表示，英国企业正寻求自行消化能源价格冲击并削减成本，而非向消费者提价。布里登指出，劳动力市场疲软使工资上涨压力保持在低位，而周四早些时候公布的英国国内生产总值数据再次意外表现强劲，也反映出私营部门具有韧性。 ⑥【石油】国际能源署(IEA)周四在一份声明中表示，其成员国已同意“尽快”释放逾2000万桶柴油，并加快释放今年3月承诺动用的创纪录紧急石油储备中尚未投放市场的部分，以应对全球燃料价格大幅上涨的局面。 ⑦【AI】当地时间周四，Meta发布开放权重大模型Muse Spark Open，并与苹果合作，推动这款模型在Mac电脑上本地运行。 ⑧【美国】美联储哈玛克表示，她担心接二连三的供应冲击可能会导致企业形成通胀思维，从而加大政策制定者遏制价格压力的难度。#国内重要资讯①【央行】2026年10月15日，二十国集团（G20）在泰国曼谷召开今年第三次G20财长和央行行长会议。中国人民银行行长潘功胜表示，中国人民银行将继续实施好适度宽松的货币政策，为中国经济稳定增长和金融市场的平稳运行营造良好的货币金融环境。 ②【房地产】全国重点城市商品房销售相关改革落地，进一步扩围。10月15日，深圳、杭州出台商品住房销售制度改革相关细则，叠加此前已出台细则的北京、上海、广州、武汉、天津，目前全国已有7个重点城市落地该类改革方案。 ③【汽车】据“工信微报”微信公众号10月15日消息，针对网络反映的“尊界V800汽车刹车踏板支架断裂问题”，工信部、中央网信办、市场监管总局高度重视，在前期调查工作基础上，成立联合调查组开展核查，并依法依规处理。有关情况将及时公布。 ④【回购】15日多家A股公司推出回购及增持计划，其中不乏科技龙头公司。CPO龙头新易盛、天孚通信及存储芯片龙头佰维存储均在列。 ⑤【知识产权】国家知识产权局、海关总署近日印发《关于强化知识产权协同保护的意见》，强化重点领域知识产权保护。知识产权管理部门鼓励有驰名商标确认记录等权利人办理知识产权海关备案，海关基于国家产业政策和风险分析结果加强保护，协同推进全链条保护。 ⑥【双碳】我国首次跨境至香港的可再生能源绿色电力证书集中交易10月14日在广州完成，共有6家内地新能源发电企业与9家香港用户参与交易，涉及银行金融、地产物业等多个行业，共成交绿证9.6万个，对应可再生能源电量近1亿度。 ⑦【仓储】中国物流与采购联合会最新数据显示，9月份中国仓储指数为49.7%，较8月回升1.2个百分点，各主要分项指数普遍环比回升。综合来看，传统旺季与消费市场景气回升将继续带动仓储行业趋稳向好。 ⑧【苹果】苹果董事会执行主席蒂姆·库克在上海走访，在谈及Apple Intelligence相关问题时，库克表示苹果智能及相关阿里千问大模型确已获得批准，将在十月晚些时候发布测试版本，其中包含实时翻译、书写工具、照片清除工具等首批苹果智能功能，但是Siri  Q3扣非利润持续高增 Q3归母净利润17.67–20.49亿元，同比+46%–69%；扣非净利润14.24–18.11亿元，环比+6%–35%。", "content": "【招商电新】亿纬锂能26Q3业绩预告点评-20261015 Q3扣非利润持续高增 Q3归母净利润17.67–20.49亿元，同比+46%–69%；扣非净利润14.24–18.11亿元，环比+6%–35%。其中非经主要是政府补贴。 Q4排产加速，全年200GWh目标不变 估算Q3动力/储能出货约26/29GWh，合计约55GWh。预计Q4排产有望超70GWh，实际出货超60GWh。维持全年出货200GWh，动力/储能出货约90/110GWh预期。 盈利稳中有升 Q3毛利率稳中有升。预计消费电池贡献约3~4亿利润，动储电池扣非单位盈利超0.02元/Wh，预计后续随产能利用率提升以及高端产品占比增加单位盈利持续向上。 宝马大圆柱迎来快速增长，BBU有潜力 宝马新世代iX3欧洲订单表现强劲，今日宝马沈阳pack厂正式量产，国内即将开启交付，大圆柱持续放量。BBU客户拓展顺利，26年已有订单数千万颗，27年有望突破亿颗，后续值得期待。 预计26/27年归母净利润75/110亿元，对应PE 14x/9x，后续海外储能、大圆柱及BBU共同驱动量利齐升，继续推荐！ == 风险提示：请注意推荐报告风险提示；未出具报告的不代表投资建议。#文字观点", "publish_time": "2026-10-16 09:20", "tags": ["文字观点"]}, "post:2026-10-16T10-49:8bff8c8414c6": {"id": "post:2026-10-16T10-49:8bff8c8414c6", "kind": "post", "title": "2026-10-16 10:49", "source_label": "帖子正文", "excerpt": "【国金计算机&科技】#创世纪：3C机床龙头_AI订单高增驱动业绩环比加速 【1】# 经营改善：AI订单高增_Q2收入利润环比加速_诉讼影响已充分计提 ——订单：26H1新签订单52.55亿元，同比+79%；AI硬件订单10.56亿元，同比+352.8%", "content": "【国金计算机&科技】#创世纪：3C机床龙头_AI订单高增驱动业绩环比加速 【1】# 经营改善：AI订单高增_Q2收入利润环比加速_诉讼影响已充分计提 ——订单：26H1新签订单52.55亿元，同比+79%；AI硬件订单10.56亿元，同比+352.8%；新能源汽车、具身机器人订单分别8.19亿元、3.07亿元，同比+217%、+84%。公司Q2收入20.29亿元、归母净利润2.29亿元，环比分别+72.6%、+217.3%，归母净利润率约11.3%。 ——交付：公司布局湖州、苏州、宜宾、东莞及越南五大生产基地，采用总装为主、非核心工序委外加工的模式，提升产能响应能力；越南基地已投产，为海外业务提供供应链支持。 ——诉讼进展：#25年报已充分计提诉讼赔偿款约3.72亿元。最新公告披露新增子公司股权冻结、土地查封等执行进展，公司表示暂未对日常生产经营产生实质性影响，且再审申请已获受理。 【2】# AI需求：液冷+光模块+机器人多维驱动 ——液冷：设备用于冷板、散热器、冷头、大型分水器等工件加工，客户覆盖液冷硬件厂商及其代工厂。相关机型均价较传统钻攻机、立加提升，液冷业务由25年打样、小批量交付向26年放量推进。 ——光模块：公司已获得光模块领域批量设备订单，光模块加工对机床精度、稳定性要求较高，单批次设备采购量较大，客户黏性较强，业务生态与3C领域相似。 ——机器人：客户覆盖具身机器人企业及零部件加工厂商，设备服务人形机器人、机器狗等场景，二者结构件、电机电控等加工需求可共用加工设备。 【3】# 传统需求：3C优势延续_新能源订单快速增长 ——3C：设备用于消费电子结构件精密加工，应用覆盖智能手机、智能手表、平板电脑及VR/AR等领域。2025年3C钻铣加工中心收入21.85亿元，同比+13.45%。 ——新能源：面向新能源汽车产业链，设备用于电机壳、电控箱体、减震塔、控制臂、铝制转向节等零部件加工，覆盖三电、制动及转向系统。 联系人：郑元昊/孙恺祈/刘高畅#文字观点", "publish_time": "2026-10-16 10:49", "tags": ["文字观点"]}, "post:2026-10-16T11-18:22d8f867781e": {"id": "post:2026-10-16T11-18:22d8f867781e", "kind": "post", "title": "2026-10-16 11:18", "source_label": "帖子正文", "excerpt": "【中信机械】博众精工：果链+光模块+AI服务器三重增量，业绩弹性有望加速释放☆消费电子：短期承压筑底，果链增量开启，高利润率业务回归利润弹性可期。2026H1消费电子营收短期承压主要系AR/MR、智能指环等新品尚处打样培育期，增量尚未集中释放。", "content": "【中信机械】博众精工：果链+光模块+AI服务器三重增量，业绩弹性有望加速释放☆消费电子：短期承压筑底，果链增量开启，高利润率业务回归利润弹性可期。2026H1消费电子营收短期承压主要系AR/MR、智能指环等新品尚处打样培育期，增量尚未集中释放。苹果进入新一轮终端创新周期，新一代MR、折叠机型及多款新品量产在即，公司深度绑定果链大客户、份额稳固，有望带动柔性整线与高精度设备订单放量，消费电子业务有望重回增长通道。同时，果链业务利润率显著高于公司整体水平，其收入恢复增长叠加高毛利新品占比提升，有望大幅增厚利润、显著拉动整体盈利弹性。 ☆新能源：多业务共振高增，稳居第一大主业。2026H1新能源营收同比+199.30%。换电站累计交付超1900台、推进年产2000台以上产能建设，锂电注液设备批量交付、高端机型获海外订单，PACK产线落地海内外多基地，新能源仓储物流订单同比+130%以上。换电、锂电、仓储多线放量，全年高增确定性强，构筑业绩稳健基本盘。 ☆光模块/半导体设备：内生+外延双轮驱动，受益AI算力持续扩产增量确定。2026H1半导体业务营收同比+519.45%，实现跨越式突破。内生端，共晶/固晶机稳定配套400G/800G光模块并切入头部客户，向1.6T高端迭代，同步启动3.2T、CPO下一代设备研发；外延端，中南鸿思并表补齐光学耦合环节、切入CPO赛道，上海栎智介质系统稳健增长。全球光模块进入800G规模化、1.6T商用落地周期，头部厂商持续扩产、海外建厂，带动上游封装设备资本开支上行，公司光通信全工艺链路（共晶贴片+光学耦合+自动化测试+智能装配）能力成型，光模块设备增量确定性强、价值量随代际升级持续提升。 ☆AI服务器：整线集成能力落地，切入算力制造打开全新增量。公司复用多年精密组装、智能仓储、在线检测全栈技术，与头部算力代工厂深度协同，AI服务器自动化产线已落地批量交付，产品间接配套英伟达算力产业链。随着全球AI服务器资本开支持续高增、代工产能扩张，公司AI服务器自动化装备有望从设备端持续兑现增量，成为继光模块之外又一直接受益AI算力扩张的成长曲线。 ☆汽车自动化：高端客户持续突破，静待规模释放。板块维持存量稳健、增量突破态势，上半年切入舍弗勒、星驱等优质供应链，斩获电机、转子装配订单，上海沃典海内外项目顺利交付、海外占比提升，为后续规模化增长蓄力。 ☆投资观点：公司依托强精密制造与整线集成平台能力，持续获得全球头部客户严苛认证。新能源+半导体高景气放量贡献规模高增，果链进入新一轮创新周期、业务重回增长通道，叠加光模块设备受益AI算力扩产、AI服务器自动化产线落地，三大增量有望共振。公司规模效应持续显现，多赛道景气共振，我们看好公司投资价值。 更多信息欢迎联系中信机械团队（刘海博 / 李越 / 周荣炎 18810346676）#文字观点", "publish_time": "2026-10-16 11:18", "tags": ["文字观点"]}, "post:2026-10-16T20-18:acc23872e7c4": {"id": "post:2026-10-16T20-18:acc23872e7c4", "kind": "post", "title": "2026-10-16 20:18", "source_label": "帖子正文", "excerpt": "【兴证通信】光迅科技26Q3业绩预告点评：Q3业绩超预期，盈利能力持续提升#Q3业绩超预期，#利润环比大幅增长。公司预计2026年前三季度实现归母净利润11.89亿-13.10亿元，同比增长65.37%-82.26%", "content": "【兴证通信】光迅科技26Q3业绩预告点评：Q3业绩超预期，盈利能力持续提升#Q3业绩超预期，#利润环比大幅增长。公司预计2026年前三季度实现归母净利润11.89亿-13.10亿元，同比增长65.37%-82.26%；其中Q3归母净利润预计6.07亿-7.28亿元（中值6.68亿元），同比增长75%-110%（中值92%），环比增长77%-112%（中值95%），业绩加速兑现。#垂直一体化优势凸显，#海外高速光模块与传输业务持续突破。公司具备“芯片—器件—模块”垂直整合能力，有助于保障核心器件供应、提升成本竞争力；随着800G、1.6T高速光模块持续放量，海外客户拓展及DCI相干模块加速突破，公司产品结构与盈利能力有望持续改善。#持续看好公司高速光通信成长逻辑。随着800G、1.6T高速光模块需求持续释放，以及DCI等新业务逐步突破，公司有望进一步受益于AI数据中心互联需求增长，持续关注公司后续产品放量与海外客户进展。#文字观点", "publish_time": "2026-10-16 20:18", "tags": ["文字观点"]}, "post:2026-10-16T09-25:46cb356b6267": {"id": "post:2026-10-16T09-25:46cb356b6267", "kind": "post", "title": "2026-10-16 09:25", "source_label": "帖子正文", "excerpt": "大摩——大中华区科技硬件 | 亚太ABF载板：资本开支加码，供应紧上加紧 近期ABF载板供应商的新增产能公告并不改变其对板块的看涨立场。受AI算力需求激增及载板制造复杂度攀升驱动，市场预计自2027年起将持续呈现供给短缺，进而支撑定价能力与利润率进一步扩张。", "content": "大摩——大中华区科技硬件 | 亚太ABF载板：资本开支加码，供应紧上加紧 近期ABF载板供应商的新增产能公告并不改变其对板块的看涨立场。受AI算力需求激增及载板制造复杂度攀升驱动，市场预计自2027年起将持续呈现供给短缺，进而支撑定价能力与利润率进一步扩张。基于此，我们上调欣兴电子（Unimicron）与南亚电路板（NYPCB）的盈利预测及目标价，并维持对两者的“增持”（Overweight）评级。 供需格局：短缺加剧，近期限产难解 尽管多家厂商宣布扩产，但多数新项目集中于2028年末至2030年及以后才能放量。我们更新的供需模型显示，2027年与2028年ABF载板需求将分别超过供给9.3%和13.7%，缺口较此前预估扩大3.1和4.3个百分点。2026年市场整体处于平衡状态，而2027至2028年供应紧张度将显著加深。因此，过去数月公布的产能扩张计划并不会削弱未来两年的价格涨幅。 定价展望：2027年加速上涨，成本传导转向供给约束 我们预计2027年ABF载板价格将上涨25%以上（低于买方约50%的预期）。2026年的涨价主要受原材料成本传导驱动，而2027年供应紧张将成为更核心的定价推力，使得价格涨幅超越成本通胀，加速利润率扩张。由于客户谈判的差异，涨价幅度与时机仍存在不确定性，但我们整体对定价环境持建设性态度。 选股逻辑：偏好2027年产能率先释放者 在供应趋紧的背景下，交付增量产能的能力成为关键分化因素。我们更看好在2027年即有新产能落地的供应商，而非那些扩产贡献集中在后期的企业。 • 欣兴电子：其“光复二厂”将于2027年投产，预计带来10%至15%的产能提升；我们亦青睐其即将发布的财报表现，因南亚电路板的市场预期已较高，超预期空间相对有限。 • 南亚电路板：通过去瓶颈化，2027年产能增速预计为5%至10%；凭借其在网络芯片及AMD CPU领域的客户敞口，以及主动的定价策略，我们同样维持其“增持”评级。 盈利预测与目标价调整 受利润率改善及AI半导体用量上修驱动，我们全面上调两家公司的每股盈利（EPS）预测： • 欣兴电子：2026/2027/2028年EPS预测分别上调62%、30%、28%。基于剩余收益（RI）估值模型，目标价由1,465新台币上调21%至1,775新台币（对应24倍2028年预期市盈率，隐含41%上行空间）。 • 南亚电路板：同期EPS预测分别上调20%、46%、43%。目标价上调29%至2,000新台币（对应22倍2028年预期市盈率，隐含39%上行空间）。 按上行潜力排序，首选欣兴电子，其次为南亚电路板。 供给端动态：扩产虽多，但远水难解近渴 年初至今，主要ABF载板厂商已宣布约143亿美元的产能投资，远高于近年年均水平，但这些资本开支横跨多年。根据我们的供应链调研，每1美元投资在满载状态下仅能支撑0.50至0.60美元的年收入。以此测算，已宣布的投资仅能带来72亿至86亿美元的增量年收入，而我们的行业预测隐含的增量收入需求高达114亿美元。即便考虑 Ibiden、SEMCO、AT&S 等企业的重大扩产计划，当前可量化的投资规模仍不足以满足需求预期，预示未来数年仍需进一步产能扩张。 需求端：ASIC（尤其是中国AI芯片）成为核心增量 需求上修的主要来源是“其他ASIC”类别，包括微软、其他美国企业及中国AI芯片厂商（如华为、寒武纪、海光等）。我们将该类芯片2027年与2028年出货量预测分别从460万/620万片上修至640万/870万片。尽管亚马逊Trainium与谷歌TPU的2027年预估略有下调，英伟达GPU/CPU预测基本不变，AMD GPU预期遭下修，但AI加速器整体需求的强劲增长足以抵消局部疲软。 终端市场结构性转变 过去十年，ABF载板的需求重心已从PC（2015年占市场价值约70%）彻底转向服务器、AI GPU、AI ASIC及网络应用（2025年合计占比约60%，2030年预计超过80%）。PC相关需求占比到2030年将萎缩至10%以下。这一结构性迁移是行业增长的核心引擎，随着AI基础设施部署加速，载板市场有望在2026至2030年间以22.2%的年复合增长率扩张。 潜在风险 1. PC、通用服务器及AI服务器终端需求弱于预期； 2. 主要供应商产能扩张计划超预期； 3. T-glass（载板关键材料）供应短缺； 4. CoWoP（Chip-on-Wafer-on-Substrate Plus）等新兴封装技术对ABF载板的替代风险。 结论 ABF载板行业正步入“AI扩散”新周期，2027至2028年的供给缺口扩大为定价与盈利扩张提供坚实支撑。欣兴电子与南亚电路板凭借技术优势、客户结构及产能节奏，将成为此轮上行周期的核心受益者。我们建议投资者积极布局，把握行业拐点带来的超额收益。#文字观点", "publish_time": "2026-10-16 09:25", "tags": ["文字观点"]}, "post:2026-10-16T10-05:2976ed72b6bd": {"id": "post:2026-10-16T10-05:2976ed72b6bd", "kind": "post", "title": "2026-10-16 10:05", "source_label": "帖子正文", "excerpt": "📑摩根大通‑韩国存储科技路演反馈 📝 过去两周，我们在新加坡、吉隆坡、香港等亚洲地区与超过 100 位投资者开展交流。📝 本篇报告梳理投资者重点关注方向、反馈意见，并解答路演会议当中的高频问题。", "content": "📑摩根大通‑韩国存储科技路演反馈 📝 过去两周，我们在新加坡、吉隆坡、香港等亚洲地区与超过 100 位投资者开展交流。 📝 本篇报告梳理投资者重点关注方向、反馈意见，并解答路演会议当中的高频问题。 📝 整体来看，投资者对于存储板块投资的观点分歧巨大，自上而下 AI 行业景气逻辑，和自下而上存储行业供需基本面之间出现明显认知割裂。 📝 我们此前就提出，2026 年第三季度会是预期重新校准的季度；在缺少短期催化的背景下，不排除存储板块个股短期维持高波动。 📝 过去 1 个月存储板块股价下跌 6%，过去 3 个月下跌 15%；同期费城半导体指数 1 个月上涨 10%，3 个月下跌 4%。 📝 在我们看来，巨大的观点分歧恰恰给久期交易源头内容加微wuxl3408（看好本轮上行周期延续更久）带来良好入场时机，中期维度风险收益比逐步改善。 📝我们依旧看好存储上行周期，建议在近期股价回调过程当中逢低布局。📝 未来 6 个月，我们重点推荐的增持标的包括：三星电子、SK 海力士、铠侠（存储赛道）；三星电机（多层陶瓷电容、基板）；ISU（AI 印刷电路板）；ISC（测试插座）。 🔍投资者重点关注领域📝 投资者关注点围绕存储，但并不局限于存储行业本身。 📝 我们 9‑10 月分析师路演调研，充分体现出投资者在股价、估值倍数层面，和行业供需、产品价格基本面之间巨大的观点分歧。 📝 在充分讨论未来 12‑18 个月全部风险与机遇之后，不少投资者认同我们 “上行周期持续时间会更长” 这一强化判断。 📝 但这份共识并没有转化成足够强的信心，投资者没有在近期股价回调时加仓。 📝 面对估值陷阱，即便存储板块个股迎来每股收益短期向上修复，股价也没有明显反应；几乎所有投资者都提出，亚洲大型存储龙头公司需要立刻落地积极的股东回报行动，以此避免估值进一步压缩。 📝 从基本面角度，我们认为智能代理 CPU 带来的存储需求机会，是供需缺口逻辑当中最被低估的因素。 📝 整体来看，纯多头、泛行业投资者对存储板块乐观程度更高，这类投资者相对更偏好 SK 海力士，而非三星电子。 📝 对冲基金、科技专业投资者的态度更为谨慎，这类投资者相对更偏好三星电子，而非 SK 海力士。 📝 最后交流过程中我们发现，过去四周投资者开始对中小市值标的执行资本布局策略，覆盖 SPE、基板、印刷电路板等赛道。 📝 做多多层陶瓷电容的咨询量同样很高源头内容加微wuxl3408，对冲基金投资者关注度尤其突出，但纯多头投资者对此提出不少反对意见。 🧐拆解投资者对存储股的担忧逻辑📝 我们认为投资者已经充分了解市场当中的负面叙事，包含价格上涨动能放缓、HBM 降规格的相关讨论。 📝 但不同投资者交易存储股票的思路分歧极大；整体上亚洲投资者相比美国投资者态度更加保守。 📝 存储板块已经无法吸引趋势交易型投资者；即便供应链不断传出 HBM 涨价利好消息，市场当中的增量买方，主要来自存储公司自身股票回购（三星电子 15 万亿韩元股票回购计划，SK 海力士 40 万亿韩元回购并注销计划），以及价值型、追求收益的久期策略投资者。 📝 但投资者反馈，股东回报计划的公告本身还不够；相比更早落地、分红力度更高的 SK 海力士，市场对三星电子的失望情绪更强。 📝我们梳理出三大可以扭转存储板块负面叙事的催化因素：📝 a）即便存在密度下调，HBM 晶圆‑裸片良率损耗问题依旧持续存在； 📝 b）受智能代理 CPU 需求强劲带动，全品类存储需求预期普遍上修； 📝 c）出台新一轮股东回报相关更新方案。 ❓高频问题一：2027 年 HBM 现实的均价预期如何？HBM 供需紧张格局能否延续至 2028 年？📝 根据我们的交流情况，绝大多数投资者认为我们给出的 HBM 均价预期已经非常保守。 📝 摩根大通预测 2027 年 HBM 综合均价上涨 60%；买方机构的预期持续上修，过去三个月预期区间从 50%‑100%，抬升至近期 80%‑100%。 📝 按照我们当前假设，三星电子、SK 海力士 HBM 均价同比分别上涨 64%、45%，绝对均价达到每吉比特 2.9‑3.1 美元。 📝 据此测算，两家韩国存储公司 2027 年 HBM 合计营收 1280 亿美元，营业利润率 67%。 📝HBM 均价每超预期上行 10%（约每吉比特 + 0.3 美元），对应新增营收约 128 亿美元，营业利润率抬升至 70%，将带动我们 2027 财年每股收益预测上调 1.6‑2.3%。📝 在 HBM 需求端，很多投资者关心博通可以带来多少 HBM 订单增量。 📝 虽然市场充斥密度降规格的传闻，但 HBM 采购订单预测没有发生变化；密度下调只是一种应对手段，目的是提升芯片整体产出规模。 📝 前沿 AI 模型实验室自研芯片项目如果取得成功源头内容加微wuxl3408，会成为 2028 年末‑2029 年 HBM 需求的上行驱动因素。 📝 我们依旧判断，未来两年 HBM 行业将维持 20% 的供需缺口。 ❓高频问题二：相比 3‑6 个月之前，市场对长约业务关注度降温，长约业务尚未获得充分估值认可📝 投资者依旧投入大量精力研究长约业务。 📝 但大量长约合同细节不对外公开，公司只放出少量新闻通稿，绝大多数条款受保密协议约束；因此多数投资者选择等待年底获取更多信息之后再做判断。 📝 2026 年第二季度，市场大量讨论长约业务占比提升是否应当享受估值溢价。 📝 本次路演当中，大部分投资者认为长约业务目前对存储经营属于中性影响，既不给予估值溢价，也不打估值折扣。 📝 投资者希望看到更多明确信息，例如存储供应商与客户如何协同，避免重复、多重下单，同时保障供应协议执行落地。 📝 不少投资者同时提出，如果存储供应商可以把长约业务转化为更高自由现金流分红的股东回报，市场会更加认可长约业务逻辑。 ❓高频问题三：供电每新增 1 吉瓦，对应的存储潜在市场规模有多大？📝 投资者认为供电能力约束，是 2028 年之前 AI 芯片需求进一步上修的最大瓶颈，产能瓶颈要到 2029 年之后才会逐步缓解。 📝 因此我们收到大量和电力规模对应存储市场空间相关的提问。 📝 根据我们自上而下测算，2027 年 AI 存储整体市场规模超过 7000 亿美元，数据中心净新增供电规模约 30 吉瓦。 📝测算得出，供电每新增 1 吉瓦，可以对应约 230 亿美元存储市场收入。📝 该数值显著高于经验法则，也就是 AI 数据中心资本开支 600 亿美元当中，每 1 吉瓦对应 160‑170 亿美元存储价值。经验法则的假设是服务器机架价值分配当中，存储占 40‑50%，整机占 60‑70%。 📝 两者数值差异来自两点： 📝 a）需求测算包含新增电力对应的新增需求，同时包含现有数据中心设备的替换需求； 📝 b）自上而下测算口径下，云厂商级产品和企业级产品之间的价值占比假设存在差异。 📝 分供应商测算，每新增 1 吉瓦 AI 供电，对应三星电子可以拿到 60‑65 亿美元，SK 海力士拿到 40‑45 亿美元；差异来自自上而下口径下二者的存储市场份额。 ❓高频问题四：2026 年第四季度‑2027 年存储价格展望📝 虽然季度环比价格走势依旧是讨论话题，但投资者关注度相比过去有所下降。 📝 这表明股价核心驱动，已经从盈利动量切换到周期延续性。 📝 在营业利润率已经达到 80% 的水平之后，同等条件下均价每上涨 10%，带来的利润率增量不足 75 个基点。 📝 另一方面，对比 2026 年，我们预计 2027 年 DRAM、NAND 供需格局大概率边际走弱。 📝 我们依旧预计非长约的批量订单价格每个季度实现 5‑10% 的均价上涨；面向企业服务器的 B2B 品类涨幅会高于面向消费电子、移动端的 B2C 品类。 📝 部分消费电子客户愿意接受涨价，2027 年第一季度环比涨价幅度达到 30% 甚至更高，以此在激进的生产计划之下补充库存。 📝 日历年度框架下的 HBM 合同重新定价，有望使得 2027 年第一季度价格行情好于 2026 年第四季度。 📝 在长约供货部分，受多年供货协议约束，涨价幅度有限；长约占比更高的供应商，综合均价上涨幅度会弱于长约占比较低的同行。 📝 即便如此，服务器业务占比提升（服务器计算存储相比 PC、移动端存储存在约 30% 的均价溢价），将支撑明年综合均价整体向上。 📝NAND 板块情绪改善，企业级固态硬盘市场空间上修，2027 年市场过度悲观预期得到修正。📝 过去三个月投资者持续担忧 NAND 供需格局，最悲观的观点认为 NAND 价格 2026 年第四季度就会下跌。 📝 随着企业级固态硬盘需求走强，我们一直看好 NAND 供需格局，现在中期维度投资者对 NAND 基本面信心有所修复。 📝 很多投资者关注供应链上企业级固态硬盘需求上修信号，云厂商加大订单，用来应对高速增长的缓存需求；供应链 QLC‑NAND 比特需求同样走强。 📝 同等密度条件下 QLC 相对硬盘存在 10‑14 倍价差，TLC 相对硬盘存在 14‑18 倍价差，在价差很高的背景下该趋势超出市场预期。 📝 我们认为云厂商把硬盘作为互补技术，弥补硬盘在高负载 AI 推理、智能代理场景读写速度上的短板，同时实现算力部署的电费优化。 📝 总而言之，企业级固态硬盘的旺盛需求，规模足够抵消明年消费电子领域 NAND 的需求走弱。 ❓高频问题五：估值方法选择，应当回归市净率，而非市盈率📝 我们现金流折现测算显示，当前股价隐含的情景是存储周期重回 AI 时代之前的水平。 📝 在 “上行周期更长、景气度更高” 的逻辑下，我们将存储板块估值切换到市盈率框架。 📝 2026 年第二季度调研显示，仅有约三分之一的投资者认同这套估值框架。 📝 当前存储板块股价相对盈利、市净率‑净资产收益率历史周期存在巨大估值折价；亚洲标的折价幅度比美国同行更高。 📝 市盈率是否是合理的衡量方式，成为市场的核心疑问。 📝 投资者认可把长约业务和市盈率估值挂钩的思路，但鉴于存储行业强周期属性，多数人依旧认为市净率‑净资产收益率是更合适的估值指标。 📝 估值方法论的争论，反映出投资者对于久期交易、多年上行周期的观点悲观程度在上升；韩国存储股交易在接近 2028 年预测 1 倍市净率的位置，对应下行周期的估值水平。 📝 从现金流折现模型角度，当前股价对应的是悲观乃至极度悲观情景，也就是 2028 年之后产品价格跌回 AI 周期启动之前的水平。 📝 虽然存储板块市场情绪平淡，但 2027 年投资者对 AI 硬件板块整体信心仍然很强，多层陶瓷电容受到高度关注。 📝 我们在全区域输出看多亚太多层陶瓷电容板块的观点，判断短期板块表现有望跑赢存储行业，逻辑有三点： 📝 a）涨价带动每股收益上修动能强劲，当前行业所处阶段类似 2025 年第四季度的存储行业； 📝 b）单台服务器机架功耗提升，带来明确的价值占比提升逻辑； 📝 c）高均价、高利润率的新增增值产品订单加速落地，逻辑类似 2024 年的 HBM。 📝 大量投资者认同这套逻辑，同时追问多层陶瓷电容的供需格局、关键跟踪指标，以及侧边间隙、成型工艺带来供给约束，对比历史平均产出水平的相关假设。 📝 但 UTR、出货、价格层面公开可跟踪数据稀缺，叠加估值已经处于高位，这成为投资的阻碍，尤其遭到纯多头投资者的质疑。 📝 我们依旧看多该板块周期景气，我们覆盖的日韩多层陶瓷电容标的 2027‑2028 财年每股收益预测，较市场一致预期高出 20‑30%。 📝长江存储 4F2 技术进展消息放大国内竞争风险担忧，我们判断更多是新闻层面扰动，并非实质业务风险。📝 媒体报道长江存储宣布服务器 DRAM 使用的 4F2 结构取得研发进展，预计年底实现导入。 📝 通俗来讲，4F2 结构可以绕开极紫外光刻设备，通过垂直堆叠晶体管、埋入字线的方式，相比当前 6F2 结构实现 30% 以上单元密度提升。 📝 长江存储 4F2 的实际进展很难核验；想要把 4F2 技术商业化并且实现稳定良率，离不开先进沉积、刻蚀设备，我们对国内公司获取该类设备保持怀疑。 📝 我们维持判断，国内竞争对手新增产能带来的冲击可控，预计 2028 财年 DRAM 产能占比约 16%，比特容量占比约 11%。 📝 我们认为未来 12‑18 个月最重要风险来自需求侧，包括 AI 资本开支、资金问题、存储规格迭代，而不是来自国内同行的供给冲击。#文字观点", "publish_time": ，预计2027年产能200GWh，目前订单能覆盖产能。公司美国有pack工厂，西班牙工厂预计2027年出货，电芯预计2028年出货。 #大电芯产品技术领先。公司90%多出货是大储，公司大电芯走在行业领先水平，当前公司主营电芯以587Ah为主（市场以314为主），1175Ah爬坡，未来产品向1175和1300Ah切换。目前集装箱产品以6.25MWh，4h为主，2027年往6.9MWh，8h切换。相关资料可联系#文字观点", "publish_time": "2026-10-16 11:18", "tags": ["文字观点"]}, "post:2026-10-16T09-20:7c8fb8998a86": {"id": "post:2026-10-16T09-20:7c8fb8998a86", "kind": "post", "title": "2026-10-16 09:20", "source_label": "帖子正文", "excerpt": "【天风通信】光迅科技：Q3单季业绩环比增长超90%，后续可期 🥇公司发布26年前三季度业绩预告，预计实现归母净利润11.89亿元-13.1亿元，同比增长65%-82%，扣非归母净利润11.76亿元-12.96亿元，同比增长73%-91%。按照中值推算，Q3单季实现归母净利润6.68亿元，同比增长93", "content": "【天风通信】光迅科技：Q3单季业绩环比增长超90%，后续可期 🥇公司发布26年前三季度业绩预告，预计实现归母净利润11.89亿元-13.1亿元，同比增长65%-82%，扣非归母净利润11.76亿元-12.96亿元，同比增长73%-91%。按照中值推算，Q3单季实现归母净利润6.68亿元，同比增长93%、环比增长95%，扣非归母净利润6.68亿元，同比增长110%、环比增长97%，超过市场预期。 🥈业绩大幅增长受益于全球AI算力资本开支浪潮带动数通光模块需求快速增长，同时国内云服务商持续加大数据中心建设投入。公司已在年初追加DSP订单，并开始导入国内供应商，三季度G2厂房交付、产能将逐步释放。尽管国内光模块价格低于海外市场，但公司通过供应链优化、光芯片自供、规模效应等方式，有望提升净利润率水平，同时后续也有望突破海外客户。 🥉今年3月OFC2026展会上推出了全球首款3.2T硅光单模NPO模块，并已在国内头部CSP厂商完成系统验证、实现了小批量出货。公司在DCI器件、OCS、相干模块等均有布局和出货，未来有望形成新增长点。光芯片CW产能持续放量，预计27年仍将快速增长。 此前完成35亿增发为发展提供有力资金支撑，公司正推进港股上市，进一步增强后劲。建议投资者持续关注。 ☎天风通信团队#文字观点", "publish_time": "2026-10-16 09:20", "tags": ["文字观点"]}, "post:2026-10-16T08-37:74a5d1184ced": {"id": "post:2026-10-16T08-37:74a5d1184ced", "kind": "post", "title": "2026-10-16 08:37", "source_label": "帖子正文", "excerpt": "【tfjx】大族数控业绩快报点评：客户拉货导致单季度波动，超快放量不改业绩预期！公司公布三季度业绩快报，实现营收78.41亿元，同比增长100.90%", "content": "【tfjx】大族数控业绩快报点评：客户拉货导致单季度波动，超快放量不改业绩预期！ 公司公布三季度业绩快报，实现营收78.41亿元，同比增长100.90%；归母净利润15.44亿元，同比增长214.03%；扣非归母净利润15.35亿元，同比增长222.52%。前三季度归母净利率约​​19.7%​​，同比+7.1pct。公司盈利能力持续提升。 #单季度看，Q3实现收入28.56亿元，同比+87.8%，环比-5.7%；实现归母净利润5.87亿元，同比+157%，环比-7.4%。三季度归母净利率20.6%，同比+5.6pct，环比-0.4pct。前三季度业绩大幅增长主要得益于新一代机架服务器算力及交换单元高多层HDI板、N+N结构高多层板、800G及1.6T高速光模块mSAP类载板等高端AI PCB需求增长显著。在需求增长和技术提升的双重推动下，下游PCB企业投资持续高涨，公司抓住下游客户扩产升级的市场机遇，全线产品订单大幅成长。Q3收入及业绩环比下降，我们认为主要受客户拉货节点导致的发货节奏波动，系大客户扩产节奏所引发的正常现象。公司在手订单充足，今年新签订单较去年大幅度提升，业绩兑现只是时间问题，看好公司整体业绩在Q4恢复持续向上的态势。超快激光有望提供公司订单增长动能。超快激光钻机可用于MSAP部分极小径钻孔，目前已在部分厂商实现批量订单。明年预期同样饱满，MSAP或贡献绝大部分订单，而M9/10材料用超快激光钻机有望随着下游机柜交货而逐步放量，带动公司业绩持续向上。我们认为，Q3业绩环比下降不代表行业景气度下降及公司订单兑现问题，公司有望在大客户资本开支大幅提升的前提下后期重返业绩逐步提升的曲线。此外，公司的超快激光钻机已开始逐步放量，此部分可给予公司更高的估值水平。公司作为PCB机械钻机龙头，并考虑超快钻机以及新技术相应设备带来的增量，我们维持对公司今年明年业绩的判断，当前位置建议重点关注！#文字观点", "publish_time": "2026-10-16 08:37", "tags": ["文字观点"]}, "post:2026-10-16T11-20:7ed94a2a12e7": {"id": "post:2026-10-16T11-20:7ed94a2a12e7", "kind": "post", "title": "2026-10-16 11:20", "source_label": "帖子正文", "excerpt": "PTFE 应用进展更新：英伟达在 OCP 展示 PTFE 英伟达在 OCP 全球峰会上展示了其 NVLink PTFE 板原型，并列出了 7 家供应商（见图表） 要点： • PTFE 混合方案仍是 VR300 NVL576 交换机板的首选解决方案，在性能与制造工艺之间取得平衡 • 长期潜力不止于交换", "content": "PTFE 应用进展更新：英伟达在 OCP 展示 PTFE 英伟达在 OCP 全球峰会上展示了其 NVLink PTFE 板原型，并列出了 7 家供应商（见图表） 要点： • PTFE 混合方案仍是 VR300 NVL576 交换机板的首选解决方案，在性能与制造工艺之间取得平衡 • 长期潜力不止于交换机板（PTFE 填充型 CCL 的 IEC 标准已发布；计算板测试正在进行） • 短期内对传统树脂的影响有限（32 层中仅有 8–12 层采用 PTFE），但纯 PTFE 方案的应用有望增加 • 看好已具备成熟 PTFE 量产能力的供应商：台虹、中国领先的 CCL 厂商，以及中国领先的 PTFE PCB 制造商 看好在 PTFE 领域具备真正技术优势的相关企业。", "publish_time": "2026-10-16 11:20", "tags": []}, "post:2026-10-16T09-20:651578d44150": {"id": "post:2026-10-16T09-20:651578d44150", "kind": "post", "title": "2026-10-16 09:20", "source_label": "帖子正文", "excerpt": "【东方材料】东方极梦签约点评：控股切入耳根宇宙IP，开启\"百部人物传记+千部精品漫剧\"计划 #子公司东方极梦与弦智立方签署合作协议，业务端拓展AI漫剧市场。10月14日，公司控股子公司上海东方极梦人工智能科技有限公司与上海弦智立方科技有限公司签署合作协议，围绕\"耳根宇宙百部人物传记\"与\"千部精品漫剧", "content": "【东方材料】东方极梦签约点评：控股切入耳根宇宙IP，开启\"百部人物传记+千部精品漫剧\"计划 #子公司东方极梦与弦智立方签署合作协议，业务端拓展AI漫剧市场。10月14日，公司控股子公司上海东方极梦人工智能科技有限公司与上海弦智立方科技有限公司签署合作协议，围绕\"耳根宇宙百部人物传记\"与\"千部精品漫剧\"两大计划开展耳根宇宙IP的AI漫剧开发。弦智立方为耳根宇宙IP的运营主体，围绕该世界观体系开展动画、电影、剧集、衍生品及品牌联名等全链路商业化开发。本次签约由公司董事长庄盛鑫代表东方极梦签署。 #股权与团队结构绑定算力与内容两端，51%持股可实现并表。东方极梦由公司全资子公司东方超算（深圳）科技有限公司与北京不可能科技有限公司共同设立，东方超算持股51%。合资方不可能科技由掌阅科技联合创始人之一王良发起成立，团队覆盖数字阅读、动画影视及AIGC工具研发，与东方超算算力资源形成互补。 #耳根宇宙具备头部IP矩阵与可派生性，为漫剧提供受众基本盘。耳根宇宙由作家耳根历时16年、通过《仙逆》《求魔》《我欲封天》《一念永恒》《三寸人间》《光阴之外》六部核心作品缔造，总字数近3000万字，六部作品共享同一套编年史、寰宇图与境界表，可持续派生而不依赖单点爆款。据公司披露，依托耳根宇宙开发的长视频动画番剧表现突出——《仙逆》全网累计有效播放超300亿次、常居动漫热搜榜第一；《光阴之外》第一季完结时全网累计播放突破140亿次 人形机器人出货约3700台。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型与OCP系统架构\u003c/strong>：强化逻辑是推理经济性约束下，系统级架构拐点出现，Hyperscaler加速全栈协同设计，Agentic AI推动CPU/加速器比例至1:1；催化/验证包括OCP2026主题及美国调研反馈、英伟达算力约三分之一为与AI实验室无关的基础计算且年增30–40%、消息人士称Anthropic营收增长放缓并引发投资者下调IPO估值预期。\u003c/li>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>：强化逻辑是两存/先进制程扩产预期强化，长鑫IPO进程与长存上市预期下，2026年两存扩产预期逐步强化，每万片NAND/DRAM扩产有望带动近百亿开支增量；催化/验证包括拓荆科技25亿元收购无锡尚积、北方华创4.05亿元收购诺合键维、ASML开发混合键合设备、台积电26Q3营收467.2亿美元超指引且YoY+41.2%、QoQ+16.2%。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>：强化逻辑是全球光模块进入800G规模化、1.6T商用落地周期，头部厂商持续扩产、海外建厂，带动上游封装设备资本开支上行；催化/验证包括光迅科技Q3业绩超预期、前三季度归母净利同比+65%–82%、Q3单季按中值约6.68亿元且环比增长超90%，以及共晶/固晶机配套400G/800G并切入头部客户、向1.6T迭代、启动3.2T与CPO下一代设备研发。\u003c/li>\n\u003cli>\u003cstrong>PCB/CCL/载板\u003c/strong>：强化逻辑是高端AI PCB需求增长显著，包括新一代机架服务器算力及交换单元高多层HDI板、N+N结构高多层板、800G及1.6T高速光模块mSAP类载板；催化/验证包括大族数控三季度业绩快报营收78.41亿元、同比+100.90%，英伟达在OCP展示NVLink PTFE板原型并列7家供应商，PTFE混合方案仍是VR300 NVL576交换机板首选，ABF载板预计自2027年起持续供给短缺。\u003c/li>\n\u003cli>\u003cstrong>宏观/策略与市场资金\u003c/strong>：强化逻辑是近期回调由拥挤交易平仓驱动，而非叙事恶化，科创50（剔除长鑫存储后）上半年盈利增速129.8%、创业板上半年增长32.7%；催化/验证包括宽基ETF连续9天净买入、累计逾1,400亿元，国家队连买九天、指数3,700，美国9月PPI同比+6.3%、环比+1.3%均高于预估，开盘观察显示全球AI板块抛售给A股带来额外压力、ETF成交量激增。\u003c/li>\n\u003cli>\u003cstrong>机器人/汽车/商业航天交叉催化\u003c/strong>：强化逻辑是特斯拉Roadster 2展示倒挂、翻滚、悬停能力，技术源自SpaceX猎鹰9回收与星舰姿态控制的冷气推进模块，后排换装COPV复合缠绕高压气瓶、约10个喷口，零百加速从1.9秒提升至1.1秒；催化/验证包括马斯克确认2028年量产、预计2028年开启交付，小鹏MONA L05预售，宇树科技Q3财报及业绩沟通会临近。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>业绩预告/快报：中科曙光前三季度营收122.38亿元、归母净利17.24亿元；海光信息预计营收142.8–155.8亿元、归母净利27.1–29.8亿元；光迅科技预计前三季度归母净利11.89–13.10亿元；长鑫科技预计前三季度净利润1310–1325亿元、营收约2650–2700亿元；大族数控三季度业绩快报营收78.41亿元、同比+100.90%；粤芯半导预计前三季度营收28.7–29.7亿元、同比+61.27%–66.89%；亿纬锂能Q3归母净利17.67–20.49亿元、同比+46%–69%；神火股份预计前9个月净利润同比+112%至74亿元；睿创微纳预计Q1-Q3归母净利22.5–23.5亿元；沐曦股份预计前三季度营收25.41–31.06亿元、归母净利5.87–7.17亿元。\u003c/li>\n\u003cli>资本运作/合作：拓荆科技拟25亿元收购无锡尚积82.97%股份及持股；北方华创拟4.05亿元收购诺合键维100%股权；东方材料控股子公司东方极梦与弦智立方签署合作协议，围绕“耳根宇宙百部人物传记”与“千部精品漫剧”开展AI漫剧开发；阿斯利康与insitro达成最高约14.6亿美元战略合作，聚焦MASH及心肌病；绿联科技拟回购0.5–1.0亿元用于股权激励。\u003c/li>\n\u003cli>产品发布/产业事件：特斯拉在得州SpaceX麦格雷戈测试场发布新一代Roadster，演示倒挂行驶、腾空、空中转正后落地，确认2028年量产；小鹏MONA L05预售，纯电535 Max 16.98万元、635 Max 17.98万元、635 Ultra SE 19.18万元，超级增程CLTC纯电续航310km、综合续航1310km；台积电26Q3 Revenue 467.2亿美元、Gross Margin 66.4%；英伟达在OCP展示NVLink PTFE板原型并列7家供应商。\u003c/li>\n\u003cli>市场资金/宏观：宽基ETF连续9天净买入、累计逾1,400亿元；国家队连买九天，指数3,700；美国9月PPI同比+6.3%、预估5.3%、前值5.4%，环比+1.3%、预估0.6%；开盘观察显示上证综指昨日日内低点恰好是2024年9月24日反弹行情高点，ETF成交量明显激增，尤其是510310和588000。\u003c/li>\n\u003cli>消费/双十一：天猫李佳琦双十一预售首日，珀莱雅GMV同比+20%以上，珀莱雅+彩棠+OR+惊时合计预售GMV预估同比+29%，珀莱雅主品牌预售GMV达5亿元左右，红宝石面霜4.0/双抗面膜预售量40w+/20w+；抖音双11大促周期GMV目标3000亿元、占全年约10%，分品类为宠物＞保健品(30%)＞美妆(18%)＞个护家清＞服饰内衣＞食品饮料，。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>宇树科技2026年第三季度财报及业绩沟通会：时间2026年10月29日，重要程度高，关注产品出货规模提升进度、2026–2027全年业绩指引、出货产品结构更新。\u003c/li>\n\u003cli>特斯拉Optimus V3生产端更新：新剑传动创业板上市审核问询函回复文件明确，特斯拉Optimus V3硬件设计方案已基本冻结定型；后续任何生产端更新都可能带动中国人形机器人产业链。\u003c/li>\n\u003cli>光通信/CPO：跟踪800G、1.6T高速光模块持续放量，海外客户拓展及DCI相干模块突破，光迅科技Q4伴随1.6T放量业绩有望继续高增，3.2T与CPO下一代设备研发进展。\u003c/li>\n\u003cli>PCB/CCL/载板：跟踪ABF载板自2027年起供给短缺及定价能力、利润率扩张，PTFE在VR300 NVL576交换机板及纯PTFE方案中的应用进展，英伟达OCP展示后的供应商量产能力验证。\u003c/li>\n\u003cli>半导体扩产与并购整合：跟踪长鑫IPO进程、长存上市预期、2026年两存扩产节奏，每万片NAND/DRAM扩产带动近百亿开支增量的兑现，尚积半导体在手订单6.51亿元未来两年收入确认，以及拓荆科技、北方华创整合进展。\u003c/li>\n\u003cli>宏观与市场资金：跟踪拥挤交易平仓与仓位再平衡是否结束，利率、油价、地缘、选举等宏观变量，ETF净买入持续性，以及美国PPI超预期后的市场反应。\u003c/li>\n\u003cli>小鹏MONA L05与新能源：跟踪Q4排产加速、全年200GWh目标不变，以及预计26/27年归母净利润75/110亿元、对应PE 14x/9x的兑现情况。\u003c/li>\n\u003cli>双十一消费：跟踪天猫与抖音核心大促窗口调整至国庆黄金周之后的运营效率变化，李佳琦直播间预售数据持续性，以及国货美妆与国际品牌表现分化。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>01:28｜2026年10月15日云盘汇总\u003c/li>\n\u003cli>07:45｜【北方华创】拟收购诺合键维，完善混合键合布局！事件：公司拟以现金4.05亿元收购关联方装备二期基金持有的诺合键维100%股权\u003c/li>\n\u003cli>07:46｜📬【申万计算机】中科曙光三季报速评∶超预期，算力产品继续放量 ✨#前三季度收入利润双升、毛利率上行前三季度实现营收122亿，同比+39%，高端计算产品同比增长。归母净利润17 document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
