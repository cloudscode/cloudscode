亿美元（折合人民币约11.10亿元，约为2025年全年营", "content": "", "publish_time": "2026-10-22 07:49", "tags": ["文字观点"]}, "post:2026-10-22T20-12:794730dc0af8": {"id": "post:2026-10-22T20-12:794730dc0af8", "kind": "post", "title": "2026-10-22 20:12", "source_label": "帖子正文", "excerpt": "关注点集中在澳洲联储收紧政策的风险，虽然失业率抬升至五年高点 4.7%，但市场依旧认为 11 月存在加息可能性。", "content": "", "publish_time": "2026-10-22 20:12", "tags": ["文字观点"]}, "post:2026-10-22T09-23:f81dfc0a5128": {"id": "post:2026-10-22T09-23:f81dfc0a5128", "kind": "post", "title": "2026-10-22 09:23", "source_label": "帖子正文", "excerpt": "看好国内算力网建设带来的国产算力、算电协同、数据要素板块投资机会上证指数当前运行于3700点一线附近，积极看好短期反弹行情。", "content": "", "publish_time": "2026-10-22 09:23", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-22T07-50:45da2812b15f": {"id": "post:2026-10-22T07-50:45da2812b15f", "kind": "post", "title": "2026-10-22 07:50", "source_label": "帖子正文", "excerpt": "【东吴电新】GTC柏林大会点评：Rubin全面量产，800V供电&液冷加速落地，物理AI打开成长空间！事件：10月21日，黄仁勋在GTC柏林大会发表主题演讲，明确Vera Rubin已全面量产，发布模块化AI工厂DSX POD，并更新人形机器人、自动驾驶及供应链扩产进展。", "content": "【东吴电新】GTC柏林大会点评：Rubin全面量产，800V供电&液冷加速落地，物理AI打开成长空间！ 事件：10月21日，黄仁勋在GTC柏林大会发表主题演讲，明确Vera Rubin已全面量产，发布模块化AI工厂DSX POD，并更新人形机器人、自动驾驶及供应链扩产进展。算力交付、供电散热及物理AI应用同步推进，继续看好AI电源、液冷及机器人产业链。 #Rubin全面量产&800V供电加速落地、供应链扩容推动算力部署兑现。黄仁勋明确Vera Rubin已全面量产，计算节点组装时间由Grace Blackwell的约2小时缩短至不足5分钟；大会同期，Google Cloud宣布基于Vera Rubin的A5X实例计划11月全面开放，相关基础设施支持跨站点扩展至最多96万颗Rubin GPU，英伟达联合供应链伙伴扩产，预计27年半导体测试产能较26年翻倍。系统交付方面，公司发布DSX POD，采用标准800V直流输入，将计算、网络、供电及冷却在工厂完成集成、布线和测试，计划27年初由合作伙伴推向全球；在场地配套就绪的条件下，官方目标现场部署时间由6个月缩短至最快14天。芯片量产、供应链扩容与工厂预集成有望共同加快算力投运，800V供电由架构共识迈向产品交付，将大幅拉动HVDC、DC/DC及直流保护需求。 #Rubin采用100%液冷、温水闭环方案强化产业趋势。演讲明确，Vera Rubin计算节点液冷比例由Grace Blackwell的80%提升至100%；DSX采用闭环液冷设计，支持最高45℃冷却液，在气候适宜地区通过室外干式冷却器向空气排热，减少蒸发耗水。大会同期，维谛2.3MW CoolChip冷却液分配单元等产品取得相应DSX Ready类别资格。我们认为，液冷进一步成为新一代算力系统的基础配置，冷板、CDU、管路、快接及换热设备需求有望随Rubin部署释放，系统适配、可靠性验证及规模交付能力将成为竞争重点。 #人形机器人参考平台推出、标准化有望加快规模迭代。英伟达与思灵机器人推出Agile ONE SN，搭载Isaac GR00T及Jetson Thor，本体具备31个自由度，计划27Q1推出。黄仁勋强调，通用人形配置有望服务更多任务，通过规模制造推动技术持续迭代；同时完善“模型训练—数字孪生技能学习—机器人端部署”三计算机体系，减少整机企业重复适配软硬件的工作。随着参考平台及仿真训练工具完善，有望加快机器人研发和应用验证。 #智驾参考架构拓展车型生态、乘用车&无人运输应用持续推进。演讲公布Hyperion参考架构包含14个摄像头、9套雷达、3个激光雷达及双GPU计算系统，大众厢式车、捷豹路虎、沃尔沃及奔驰下一代车型将加入兼容生态。大会同步推出面向DRIVE AGX Thor优化的Alpamayo 2 Edge，推进车端场景理解及运动规划，Bolt、Einride等分别拓展Robotaxi及无人货运应用。我们认为，模型、计算平台及整车生态协同推进，有望降低开发适配成本，关注汽车热管理、智能底盘及执行控制环节的增量机会。#投资建议：看好800V供电&全液冷升级，机器人首推海外巨头量产链。1）AI电源：PSU重点推荐【麦格米特】，SST重点推荐【阳光电源】【四方股份】【金盘科技】，HVDC重点推荐【中恒电气】【科士达】。2）液冷：看好二次侧价值量提升与国产供应链突破，建议关注系统方案商【英维克】【申菱环境】及核心零部件标的【飞龙股份】【大元泵业】。3）机器人：首推量产进度领先的海外巨头链，重点推荐【三花智控】【浙江荣泰】【斯菱智驱】【科达利】【北特科技】；看好技术与制造能力突出、客户及产品进展较快的【汇川技术】【雷赛智能】，整机及“大脑”环节建议关注【优必选】【仙工智能】。#文字观点", "publish_time": "2026-10-22 07:50", "tags": ["投资建议", "文字观点"]}, "post:2026-10-22T15-46:477732087d14": {"id": "post:2026-10-22T15-46:477732087d14", "kind": "post", "title": "2026-10-22 15:46", "source_label": "帖子正文", "excerpt": "10月22日复盘笔记：人形机器人/一带一路/芯片/军工/数据要素/冰雪经济/电网设备/油气等一、重磅财经信息①八部门印发《产业基础能力提升“十五五”规划》，其中提到，推动人工智能赋能产业基础创新。②机构：预估服务器CPU今年出货增幅31% 2027年出货量有望增逾40%。", "content": "10月22日复盘笔记：人形机器人/一带一路/芯片/军工/数据要素/冰雪经济/电网设备/油气等一、重磅财经信息①八部门印发《产业基础能力提升“十五五”规划》，其中提到，推动人工智能赋能产业基础创新。 ②机构：预估服务器CPU今年出货增幅31% 2027年出货量有望增逾40%。二、大盘表现沪指跌1.48%，深证成指跌2.96%，创业板指跌4.37%，科创50跌2.78%。 沪深京三市成交额超过1.5万亿，较昨日放量千亿。全市场近5000只个股下挫。 临近尾盘，多只宽基ETF再度放量，沪深300ETF华泰柏瑞（510300）最后半小时成交超60亿，沪深300ETF华夏（510330）、上证50ETF华夏（510050）、沪深300ETF嘉实（159919）最后半小时均成交超40亿。三、强势板块和个股分析备注：只列举部分涨停板人形机器人①英伟达宣布升级Isaac通用机器人开发平台，推出新的人形机器人参考框架、仿真工作流及数据工具，旨在加速通用机器人开发。 ②特斯拉CFO：未来几年资本开支会继续扩张 扩大Optimus产能、采购AI算力基础设施、建设芯片工厂等。 ③宇树科技王兴兴：目前物理AI已经看到被击穿的苗头，很可能最近1-2年或2-3年，目前具身智能迈过ChatGPT时刻的最核心挑战是AI模型的输入输出和真实机器人的对齐。涨停板：兆威机电、大业股份、鸣志电器、襄阳轴承、大洋电机、奕帆传动、林州重机、赛福天、安乃达、华阳智能、多伦科技、正裕工业、华新精科其他强势股：安培龙、福莱新材、浙江荣泰、方正电机、昊志机电一带一路泽连斯基：愿在保留至少75%领土控制权的基础上达成和平协议涨停板：北新路桥、山河智能、南方路机、南矿集团其他强势股：铁拓机械、恒立钻具芯片市场调查机构集邦咨询（TrendForce）援引多方报道称，预估2026年第四季度DRAM合约价格环比上涨约20%。涨停板：睿能科技、天洋新材其他强势股：云汉芯城、华天科技、大普微、德明利、有研新材军工第十六届中国航展将于12月7日至13日举行。近五十个国家和地区的超一千一百家企业参展，参展装备超过三千件，\"首展\"\"首秀\"展品占比约一成，主展区报名参展的航空器超过一百七十架，规模再创历史新高。涨停板：湖南天雁、海洋王其他强势股：江龙船艇、内蒙一机、长城军工数据要素国家数据集团有限公司在河北雄安新区成立，集团成立旨在推进数据资源开发利用、释放数据要素价值、服务人工智能发展、繁荣数据产业生态。涨停板：海量数据、出版传媒冰雪经济国务院办公厅《关于以冰雪运动高质量发展激发冰雪经济活力的若干意见》明确提出，到2027年冰雪经济总规模达1.2万亿元，到2030年突破1.5万亿元。涨停板：冰山冷热、哈空调其他强势股：晶雪节能、龙建股份电网设备美国：新建大型数据中心应自行发电，并将多余电力提供或出售给当地社区或电网，以避免推高居民电费。此前据报道，AWS部分英伟达GPU机架因供电不足暂存仓库。涨停板：长城电工其他强势股：三变科技、平高电气、许继电气、国电南瑞油气WTI原油和布伦特原油期货主力合约日内双双涨约2%。涨停板：博汇股份其他强势股：山东墨龙、通源石油、海默科技、科力股份#文字观点", "publish_time": "2026-10-22 15:46", "tags": ["文字观点"]}, "post:2026-10-22T18-33:46dd282f891f": {"id": "post:2026-10-22T18-33:46dd282f891f", "kind": "post", "title": "2026-10-22 18:33", "source_label": "帖子正文", "excerpt": "20261022今日段子汇总 1、奕帆传动：公司拟购北京和利时87.07%股权，后者主要业务方向有运动控制电机及驱动、行业专用控制系统、机械传动单元、数控与运动控制系统、系统集成与服务等 2、云汉芯城：公司是国内头部电子元器件产业互联网平台，主营电子元器件分销与供应链服务，产品覆盖存储芯片、模拟芯片", "content": "20261022今日段子汇总 1、奕帆传动：公司拟购北京和利时87.07%股权，后者主要业务方向有运动控制电机及驱动、行业专用控制系统、机械传动单元、数控与运动控制系统、系统集成与服务等 2、云汉芯城：公司是国内头部电子元器件产业互联网平台，主营电子元器件分销与供应链服务，产品覆盖存储芯片、模拟芯片、分立器件等全品类半导体产品，上游对接超 4200 家元器件供应商，直接受益于存储芯片行业涨价与国产替代浪潮 3、华天科技：公司拟收购华羿微电100%股份，标的是国内少数集功率器件研发设计、封装测试、可靠性验证和系统解决方案等服务于一体的公司公司已掌握从低容量到大容量存储器的封装技术，实现了Nor Flash、3D NAND、DRAM产品的批量封装，与长江存储有业务合作 4、沈鼓集团：沈阳铁西区国资局旗下，离心压缩机国家级制造业单项冠军，我国核主泵中屏蔽主泵的唯一国产自主供应商 5、冰山冷热：1、冷热产业链综合方案服务提供商；掌握全球先进的二氧化碳跨临界冷热“五合一”零碳技术，为北京冬奥会多个比赛及配套冰场、哈尔滨亚冬会三个冰上场馆提供制冷设备；2、公司主要研究数据中心液冷的冷源部分，着重研发干冷器、氟泵系统、冷水系统，部分产品已实现小批量交付 6、山河智能：1、公司主研发了多种机器人产品，如复杂地形灾害应急救援机器人、破拆机器人、“龙马一号” 地面移动机器人、“机器狼” 仿生侦察机器人等；2、公司向客户提供旋挖钻机、液压静力压桩机、液压挖掘机、盾构机、起重机、矿用卡车、凿岩台车等整机、零部件和增值服务 7、三峡新材：1、公司拟收购锂电池电解液公司珠海赛纬100%股权；2、公司正加速向汽车玻璃、电子玻璃等高附加值领域拓展 8、星光股份：1、广东星光神州量子信息技术有限公司涉及信息安全相关业务；2、公司或全资子公司此前拟出资3,060万元人民币与广东中建普联共同设立“星光普联（广东）大数据有限公司”，将积极开展数据管理、数字化服务、信息软件开发等业务，并收购中建普联旗下的“造价通”业务相关资产；3、公司半导体LED封装为核心优势业务，依托十万级无尘车间研发生产多类型LED半导体光源，为海内外客户提供产品与解决方案 9、出版传媒：辽宁省教材教辅出版企业；公司积极推动数智出版融合发展，应用AI图书数字人，采用“一书一模型”为纸质书配置专属AI助手，提供内容答疑、伴读与知识拓展服务，已在《数学周报》《尖子生题库》等产品落地应用 10、海量数据：1、国内主要的关系型数据库产品提供商；公司布局数据库透明加密、数据库审计等安全模块，具备敏感数据保护、泄密轨迹分析及数据库攻击威胁分析能力；2、公司数据库产品能够为OpenClaw等智能体提供数据支撑，其技术路线与AI国产化趋势契合 11、天洋新材：公司电子胶板块光模块透镜固定用胶、底填胶等产品已经进入半导体及汽车电子领域小批量供货 12、上海九百：上海九百集团旗下，有位于上海市中心的静安寺珠宝古玩城，位于航华地区的九百家居和位于大华社区的九百购物中心 13、哈空调：1、消息称公司同一实控人哈尔滨国资委旗下马迭尔集团是其唯一文旅平台，旗下拳头品牌哈尔滨冰雪大世界、太阳岛风景区、亚布力等；2、国内最早从事空冷业务的国有控股上市公司；公司设计、制造和销售核电站空气处理机组产品及其他工业空调产品 14、华新精科：公司铁芯产品已送样机器人关节电机，积极拓展机器人新兴应用领域 15、南矿集团：国内技术领先的中高端矿机装备供应服务商之一；公司境外子公司与Sucpass Gold签订合作协议，负责津巴布韦Brownhill金矿地表氧化矿的开采与堆浸处理，合作方式为黄金成品销售收入分成，一手消息群，加qq:1490929960黄金成品概算销售收入3640万美元，子公司按75%比例分成 16、南方路机：1、公司研发的 AI 分拣机器人技术，可高效识别和分拣建筑固废砂石骨料中的杂质；2、公司核电专用搅拌站已为中核、国核、广核等集团供货，部署近40台设备，实现进口替代 17、襄阳轴承：1、公司部分精密轴承产品可应用于谐波减速器等，目前已经完成产品试制并送样；2、公司是湖北省军民融合企业，根据2024年报东风公司的军车轴承一直指定公司独家供应 18、博汇股份：1、公司主营特种油、燃料油深加工，具备民营炼厂中稀缺的保税高硫燃料油经营资质，前三季度净利增长194%；2、全资子公司无锡极致液冷科技主要产品为GPU算力服务器液冷系统、算力中心机房液冷组件、液冷油、冷却液、液冷机柜（冷板及浸没式）、冷却塔室外冷机等热管理整体系统 19、阳光照明：中国最大的节能灯生产和出口基地之一 20、大洋电机：1、公司已完成机器人关节模组方案设计；2、公司开发氢燃料电池关键零部件，可用于SOFC。 21、北新路桥：公司的公路施工总承包特级资质比照铁路施工总承包特级资质承担铁路工程施工，可以参加铁路工程总承包或施工总承包投标 22、林州重机：国内最大的民营煤炭综采机械设备供应商 23、兆威机电：1、公司产品应用于机器人领域，持续推动微型传动及驱动系统在灵巧手、机器人关节等场景应用，灵巧手产品商业化进程持续推进；2、公司的微型传动系统可以应用于AR/VR领域，如磁感应系统、瞳距调节驱动系统、头部自动松紧装置、智能眼镜隐藏式微型扬声器等 24、安乃达：公司与TG0开展具身智能机器人领域联合开发 25、华阳智能：公司在电机研发方面重点突破无框电机核心技术，开发高转矩密度磁路设计、高精度伺服控制算法及耐冲击轻量化结构，可配套服务机器人、协作机器人及高端医疗器械等领域 26、正裕工业：中国汽车零部件减震器行业龙头；公司丝杠产品研发中，设备全进口且与丝杠高度重合，有能力做丝杠 27、赛福天：1、公司已开发机器人腱绳测试样品并向多家机器人企业送测；2、公司是国内唯一通过太空级T疲劳测试的机器人腱绳供应商，掌握微米级钢-塑复合工艺，已获上海交大、卓益得超1200万订单 28、芯瑞达：公司为背光模组光电系统龙头，依托Mini/Micro-LED技术协同中国科学技术大学、合肥工业大学等高校攻关MicroLED微显示全彩化技术，推进AI+AR眼镜核心光机组件样机验证，阶段性进展符合预期 29、长城电工：1.公司目前具备核电开关设备IE级的设计及制造资质，部分产品已应用漳州核电厂；2、西部地区电力设备龙头企业，主要包括低压开关成套设备、高中低压电器元件及关键零部件、智能低压成套配电装置及母线槽等电工电器类产品 30、睿能科技：1、公司是国内领先的 IC 产品授权分销商，分销多种集成电路芯片，且拥有 “芯天下” 系列存储芯片，还掌握 Chiplet 相关技术，其存储芯片封装已实现量产；2、公司RA1、RA3系列伺服驱动器和MC2、MA3系列伺服电机已应用到机器人领域，包括不同载荷的四关节、六关节等工业机器人和协作机器人 31、多伦科技：1、公司已取得具身机器人产品销售、租赁及批量定制需求，智能交通指挥机器人已在多地试点；2、公司多多驾驶舱、多多教练接入DeepSeek，推动驾培产品智能化升级，并将AI应用于多项业务；3、公司积极探索无人驾驶领域车辆安全员及无人机飞手培训技术，并推出机场围界无人化智能防控产品 32、鸣志电器：1、全球运动控制领域先进制造商，混合式步进电机的市占率稳居全球前三；公司及子公司安浦鸣志、美国AMP、美国LIN、瑞士T Motion、鸣志派博思均深度布局于移动机器人行业，目前已拥有步进系统、伺服系统、通用驱动系统和控制技术系统四大类产品线；2、公司的控制电机产品主要应用于通信基站、天线设施和其他相关基站设备中，华为是公司重要客户 33、湖南天雁：公司间接控股股东将变更为兵器装备集团汽车业务分立的中央企业 34、大洋生物：公司参股公司浙江芯之纯（参股百分之三十，公司和大洋在一块地上，完全收购的潜力很大）主要生产半导体级高纯陶瓷产品，是半导体设备国产替代的核心耗材，类似生产半导体陶瓷部件的公司有670亿市值的珂玛科技。目前芯之纯的项目进度很顺利，已经完成了试生产，产品已经开始送样半导体设备商#市场段子#文字观点", "publish_time": "2026-10-22 18:33", "tags": ["市场段子", "文字观点"]}, "attachment:files/NVIDIA GTC柏林主题演讲20261021.pdf": {"id": "attachment:files/NVIDIA GTC柏林主题演讲20261021.pdf", "kind": "attachment", "title": "NVIDIA GTC柏林主题演讲20261021", "source_label": "其他", "excerpt": "SpaceX三季度财报及电话会指引更新20261022 要点总结 1.整体业绩：营收与利润全面超预期 三季度营收146亿美元，同比增长161%，超出华尔街此前120–130亿美元的预期。净利润44亿美元，实现扭亏", "content": "SpaceX三季度财报及电话会指引更新20261022 要点总结 1.整体业绩：营收与利润全面超预期 三季度营收146亿美元，同比增长161%，超出华尔街此前120–130亿美元的预期。 净利润44亿美元，实现扭亏；去年同期为-10亿美元，同比改善接近50亿美元。此前市场担忧AI 业务拖累较大，但二、三季度云服务明显放量带动公司整体扭亏。 调整后EBITDA（剔除折旧摊销）88亿美元，同比增长接近300%。 财报发布后至电话会期间，盘后涨幅接近8%。 2.资本开支：AI算力投入为主 三季度资本开支约195亿美元，其中AI业务164亿美元，主要用于采购算力卡及部署数据中心。 3.业务结构：AI业务首次成为第一大收入板块 三大业务板块为发射、星链、AI（XCI合并后，AI业务按行政命令改名为SI）。 三季度AI业务收入76亿美元，星链53亿美元，发射业务约18亿美元。 此前星链长期为最大收入来源：2025年全年SpaceX营收180多亿美元中，星链约115亿美元。 马斯克8月曾指引，9月起AI业务收入将超过其他业务，Q4AI收入将大幅超过发射与星链之和， 三季度数据已初步验证。 同比增速：AI业务增长800%以上；星链增长70%，绝对量与比例均显著低于AI。 4.AI算力部署：进度超预期并上修指引 二季度财报指引为2026年底部署2GW算力；截至9月已实际部署1.7GW，达成度高。 三季度电话会更新：今年底部署指引上修至2.5–3GW，较此前接近50%的上修。 明年指引由“到明年底累计部署10GW”改为“部署增量10GW”，即到2027年底累计部署 13GW。 对应电力及液冷配套，公司指引先行配套至20GW量级。 太空算力逻辑：顺着地面算力部署展开，核心是持续降低单GW算力部署的capex；凭借星舰发射 能力，部署于地面或太空是可选项。马斯克重申2027年下半年用星舰发射太空算力卫星，进一步 提升算力规模。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 太空算力卫星技术难度不高：本质是内部放置英伟达VRRubinNVR72机柜，加两块太阳能板与两 块散热板，更多是现有能力的整合，难度低于特斯拉机器人、自动驾驶等业务。 TeraFab（SpaceX与特斯拉合作的晶圆厂）最新指引：2028年三季度量产流片。 5.星链运营指标：用户与ARPU双双提升 订阅用户1360万，同比增长90%；上季度为1200万，单季度增长160万。 Q4预计再增100–200万，全年做到1500万用户（2025年底为八九百万），翻倍概率很大。 三季度ARPU不降反增，达69美元（Q2约66美元不到），CFO解释为客户结构优化及推出更贵 套餐。 6.发射业务：星舰进入关键节点 9月底飞行中星舰已正式服役，开始部署第三代星链卫星。 马斯克指引第15次飞行在11月进行，将尝试回收一级与二级（助推器与飞船）。此前已成功回收 一级助推器，二级回收是关键指标；若一二级均实现可回收，发射业务的技术底座逻辑将发生重大 改变。 明年发射节奏指引：2027年上半年每周发射一次，下半年尝试每周发射两次。 发射场地：目前仅在德州Starbase发射；佛罗里达州场地在建，约三个工位，年底可能试飞；路 易斯安那州已购入大片土地，新基地可能2029年开始飞行，届时累计约20座发射塔支持全年高频 发射。 发射业务当前定位为技术底座，支撑星链与AI业务拓展。 7.星链远期指引：星座规模与带宽大幅扩张 星舰9月底第14次飞行已携带V3版本新一代星链卫星；V3单星下行带宽较猎鹰九号发射的V2 卫星提升10倍。 马斯克指引三年内（约至2029年）星链星座规模提升10倍：由目前约1万颗增至10万颗V3卫 星。 叠加单星带宽提升10倍，整个星座带宽将达目前的100倍，远超当前全人类互联网带宽。 8.财务指引：短期与中期均超预期 CFO指引明年一季度营收330–370亿美元；今年全年预计约300–400亿美元，即明年一季度单季 营收将超过今年全年。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 依据：星链与AI云服务在手积压订单已达680亿美元，结合新接订单速度，明年一季度确定性很 高。 马斯克指引到2027年底公司ARR（年化收入）达5000亿–1万亿美元，对应2027年12月单月 收入500–1000亿美元。与此前今年底年化收入1000亿美元的爬坡曲线衔接，对应今年10倍、 明年10倍的提升节奏。 9.特斯拉与SpaceX合并：马斯克表态支持，仍待股东投票 中泰证券今年2月特斯拉第二篇深度报告已提出合并可能性，此后SpaceXCOO及媒体预期逐步 升温。 马斯克在电话会表示本人绝对支持合并，认为是好事；两家公司均已成立特别委员会讨论。 但马斯克表态留有余地：最终取决于股东投票，尤其是特斯拉方面。SpaceX层面马斯克持股接近 48%，且为AB股结构，拥有绝对控制权；特斯拉层面投票权仅约20%，合并取决于特斯拉股东投 票情况。 10.估值框架：IPO市值1.75万亿美元拆解 参考IPO当天市值1.75万亿美元，拆为1.5万亿（发射+星链）+2500亿（AI）。 AI业务2500亿美元估值合理：XCI合并前一级市场单独估值即2500亿；二季度SpaceX开始部 署数据中心算力时，Anthropic、谷歌及另一家AI公司与它签算租合同，对应第二年约300亿美元 算租年化收入，2500亿相当于算租公司的合理估值、无明显溢价。 发射业务不单独给估值：一是财务上每季度经营性利润基本盈亏平衡（三季度亏700万美元，去年 三季度赚2亿多美元），利润约等于零；二是报表口径发射业务指对外服务，每年对外发射仅30– 40次且基本无增长，因地球其他玩家无同等需求与动力。若硬给估值，按年收入40–50亿美元、 对标萤火虫航天/火箭实验室30–50倍PS，约1500–2000亿美元，但体量小且利润、增速均不支 持。 因此IPO当天1.5万亿可全部理解为星链估值，对应去年星链加发射约150亿美元收入，约100 倍PS，估值很高。可参考特斯拉：两者均类似一级市场公司，许多业务尚未稳定产生收入、处于远 期阶段，市场提前很久折现。 星链1.5万亿估值可类比特斯拉1.5万亿市值中robotaxi与机器人的溢价部分。按星链VP尼科尔 斯中期指引覆盖4亿人（阶段性目标，非最终目标），假设ARPU降价至50或40美元、按12个 月计算，4亿人对应年化约2000亿美元星链收入；当前星链毛利率55%，用星舰替换猎鹰九号发 射理论上毛利率可再提15个点，净利率可达50%，即1000亿美元利润，对应15倍估值。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 IPO后三四个月股价走势与上述判断一致：先情绪上涨，后回落至约1.2万亿，再因二季度算租指 引上涨一波算租逻辑。 11.估值弹性判断：明年核心驱动为地面算力出租 至少看到明年，在马斯克所讲十几GW算力出租合同落地前，SpaceX最大估值弹性/驱动要素是算 力出租。 按明年部署10GW、打折8GW落地、其中一半（4GW）出租测算；CFO称目前单GW合同收入 可达300–500亿美元，仅出租4GW即可对应接近1500–2000亿美元营收，与马斯克所说明年底 年化收入5000亿–1万亿数量级对得上。 更远期逻辑：星舰服役作为技术底座支撑星链扩张，以及算力部署至太空后进一步降本。 问答整理 Q1：SpaceX三季度财报最核心的超预期点是什么？ 答：一是营收146亿美元、同比增长161%，超华尔街120–130亿美元预期；二是净利润44亿美元 实现扭亏（去年同期-10亿美元），调整后EBITDA88亿美元、同比增长接近300%。此前市场担忧 AI业务拖累，但云服务连续两个季度放量带动整体扭亏，盘后涨幅接近8%。 Q2：AI业务在三季度业务结构中的地 存在令人困惑的分歧；三季度业绩前瞻", "content": "摩根大通——内存市场更新：自上而下与自下而上的视角存在令人困惑的分歧；三季度业绩前瞻；短期业绩确定性有望平抑市场担忧 核心观点：“当前股价已提前计价2027年下行周期，但自下而上的基本面未见裂痕，板块估值已进入历史低位区间，短期三季度业绩指引将成为情绪修复的关键变量”。分析师维持对SK海力士（增持）、三星电子（增持）、铠侠（增持）及南亚科技（增持）的看好立场，短期首选SK海力士，因其股东回报政策更优且总股东回报收益率更高。 一、市场异动与核心矛盾 全球头部三家内存厂商（三星、SK海力士、美光）股价自2026年9月峰值平均回撤达42%，触发因素为宏观层面的负面扰动，包括前沿AI模型实验室年化收入跑数趋势不及预期、Neo-Cloud信用违约互换利差走阔、风险偏好收紧以及对AI资本开支可持续性的质疑。这标志着AI交易自启动以来的第三次阶段性回调（前两次为2024年7月日元套息交易平仓、2025年中HBM ASP修正猜测）。 当前股价行为似乎已假设2027年即迎来下行周期，且季度内存价格趋势转负。但这令我们困惑，因为自下而上的供需基本面几乎看不到崩溃迹象：现货价格仍在上行（8Gb DDR4/5现货月内持平或微涨4%）、HBM ASP谈判偏向上涨、长期协议（LTA）订单可见度已延伸至2028/2029年、其他AI供应链环节未见砍单反而持续涨价。历史规律显示，内存股在过往四轮下行周期中平均峰值至谷底回撤49%（全球金融危机期间为71%，非AI周期下行平均53%），且底部估值通常落在0.9–1.2倍前瞻市净率。而目前三星与SK海力士的2027/2028E前瞻P/E仅2–3倍、P/B仅0.9–1.5倍，已提前反映了一个并未真实出现的下行周期。 二、下行信号缺失与上行周期延长证据 每轮下行周期虽有独特性，但共性信号包括：1）现货/合约价格见顶后急跌；2）内存厂与OEM意外累库；3）其他科技供应链（晶圆、代工、主控、设备）出现需求放缓信号。而当前：1）8Gb DDR4/5现货价格平稳或微升；2）库存极度紧张，订单与定价讨论已排至2028/2029年（印证美光管理层表述）；3）AI其他环节未见砍单，反见涨价潮。长鑫存储（CXMT）4F2技术进展虽引发情绪恐慌，但我们认为前几轮下行根源在需求端而非供给扩张，故对其威胁评估为有限。综上，过去1–3个月我们仅看到更强、更长的上行周期证据，找不到任何支持2027年下行周期的实质性信号。 三、三季度业绩前瞻与短期交易逻辑 随着AI交易进入第四年，投资者焦点已转向内存价格上行周期是否降温的迹象，尤其在2024/2025/2026E DRAM ASP同比暴增+54%/+27%/+236%之后，对2027年定价情绪谨慎。短期股价驱动因素并非长期周期判断，而是三季度业绩指引与管理层措辞。我们维持对短期及中期周期的建设性看法，认为若三季度业绩出现以下积极读数，将成为板块短期支撑：HBM售罄迹象、资本开支纪律维持、定价趋势稳定。基本面层面，我们持续认为“代理式CPU（Agentic CPU）相关的内存需求”是被市场最低估的上行来源。 四、个股关键观察点与分化逻辑 在整体价格趋势之外，HBM执行能力是各DRAM厂商的核心分水岭。重点关注： 1. SK海力士：HBM4进展，尤其是近期市场关于良率波动的噪音； 2. 三星电子：HBM业务目标更新及HBM4定价谈判进展； 3. 铠侠：4Q26 NAND混合定价趋势及QLC需求更新。 更广泛地，需评估各厂能否以B2B（服务器）强度抵消B2C消费疲软，以及管理层如何框定2027年向服务器为中心的收入结构转型。此外，2027年DRAM/NAND比特供给增长指引若下修，将有效缓解过度供给担忧。 五、逆转情绪的四大催化剂 过去三个月，市场因“AI上下文窗口扩大但HBM内容升级放缓”以及“Rubin Ultra HBM4E降规”而质疑AI内存需求的刚性。我们认为四大支柱可重置多头逻辑： 1. HBM内容重加速——单SiP容量提升或带宽增益，直接反驳“持续降规”叙事； 2. 供给纪律——资本开支/比特增长克制，优先盈利质量，支撑更持久的定价框架； 3. 更广的AI需求驱动——超越问答/编程的新应用，扩大使用场景与计算强度； 4. 股东回报（短期最重要）——投资者此前认为回购力度不足，当前估值压缩下，大规模且可信的回购+分红组合，是阻止估值进一步收缩的最干净工具。日韩龙头内存股已回撤至回购公告前水平，当前约3倍远期P/E，低于前几轮周期峰值时的尾随倍数，市场对跨周期现金流生成能力存疑。若出现更进取的资本回报框架，将向市场传递管理层信心，并把辩论从“AI内存需求弹性多大”转向“多少下行已被定价、什么因素构成估值底”。 六、估值与DCF情景分析 基于DCF的每股公允价值（FVPS）测算显示，当前股价已隐含一个“早熟”的下行周期预期： • 三星电子：牛市情景（长期增长3%）下FVPS约81万韩元（较当前21.8万韩元有272%上行），基准情景63万韩元（+189%），熊市（受LTA保护）43万韩元（+97%），极端熊市26万韩元（+19%）。当前股价对应2027E P/E仅约3.2倍、P/B约0.9倍。 • SK海力士：牛市FVPS约390万韩元（当前127.7万韩元，上行205%），基准304万韩元（+138%），熊市229万韩元（+79%），极端熊市147万韩元（+15%）。当前股价对应2027E P/E约2.8倍、P/B约1.0倍。 历史数据显示，内存股在AI周期外的平均下行回撤为53%，底部P/B约0.9倍；而本轮自2025年底部至2026年峰值的平均涨幅达1361%，峰值P/B达5.63倍。当前平均P/B回落至2.3倍，距离历史下行周期底部仍有进一步压缩空间，但已计入过多悲观预期。 七、结论 我们认为，当前内存股的下跌更多是宏观情绪与仓位调整，而非基本面逆转。短期偏好SK海力士（增持）优于三星电子（增持），核心逻辑为SK海力士更优的股东回报政策与更高的总股东回报收益率；同时看好铠侠与南亚科技（均增持）。随着三季度业绩期临近，任何关于HBM供不应求、资本开支可控、定价稳定的正面信号，均可能成为板块估值修复的导火索。建议投资者忽略自上而下的宏观噪音，聚焦自下而上的供需硬数据，在当前估值分位上逐步建立多头头寸。#文字观点", "publish_time": "2026-10-22 20:08", "tags": ["文字观点"]}, "post:2026-10-22T20-08:8a5bdc9bb309": {"id": "post:2026-10-22T20-08:8a5bdc9bb309", "kind": "post", "title": "2026-10-22 20:08", "source_label": "帖子正文", "excerpt": "摩根大通——中国股票策略：弥合中国创新与回报落差的七大核心问题 一、核心结论：创新领先但盈利转化滞后，三大缺口主导市场分歧 中国已确立全球创新枢纽地位，在电动汽车、电池、光伏、造船、工业机器人、AI及生物科技等领域具备全球竞争力，制造业增加值约占全球三成，商品出口约占全球15%。然而，权益市场表现显", "content": "摩根大通——中国股票策略：弥合中国创新与回报落差的七大核心问题 一、核心结论：创新领先但盈利转化滞后，三大缺口主导市场分歧 中国已确立全球创新枢纽地位，在电动汽车、电池、光伏、造船、工业机器人、AI及生物科技等领域具备全球竞争力，制造业增加值约占全球三成，商品出口约占全球15%。然而，权益市场表现显著落后于产业进步：2026年三季度中国股出现回调，自2025年初以来，MSCI中国与沪深300累计回报分别为9%与6%，大幅跑输MSCI全球指数（35%）与MSCI新兴市场指数（49%）。摩根大通认为，市场分歧的核心已从“中国能否创新”转向“创新如何兑现为可持续盈利与股东回报”，而当前延迟兑现主要受制于三大结构性缺口：需求缺口（出口韧性未传导至居民收入与消费复苏）、价值捕获缺口（激烈竞争与产能过剩压制利润率）、市场准入缺口（优势产业面临更复杂的全球贸易环境）。尽管宏观承压，历史回溯显示，过去20年中契合政策优先级、获得融资支持且具备盈利动能的行业，以及拥有强企业家精神与创新密度的领域（如生物科技、AI应用），仍能在低增长环境中持续产生显著阿尔法。 二、需求缺口：出口引擎强劲但覆盖面有限，内需仍是盈利的决定性变量 2026年前八个月，中国出口按美元计同比增长19%，其中集成电路、汽车、船舶、锂电池等高端产品增速达35%至55%，但低端消费品出口近乎停滞。结构上，出口增长更偏资本密集而非劳动密集，对就业与工资的拉动弱于总量扩张，因而未能溢出为广泛的消费回暖。指数层面，MSCI中国成分股约82%的收入仍依赖国内经济，海外收入仅占18%（且集中于IT与部分工业板块）。基于此，摩根大通测算，若海外业务（占收入18%、估算盈利25%）增长20%，而国内业务（占收入82%、估算盈利75%）仅增长5%，整体指数盈利增速约为8%，显著低于市场一致预期的14%；国内盈利增速每变动1个百分点，对指数每股盈利（EPS）的拉动约为海外变动的4.5倍。因此，内需疲软是盈利预期上修的核心约束。政策方面，鉴于当前出口与通胀（PPI已转正）表现优于2024年9月，摩根大通中国宏观团队预计政策将保持“增量且精准”的温和节奏，主要通过加快财政执行（如“六张网”投资）而非“大水漫灌”；真正的政策加码触发点更可能出现在出口减速并传导至就业压力时。 三、价值捕获缺口：反内卷进程分化，利润率修复路径清晰但尚未普及 中国制造业升级体现为研发强度提升（2025年达2.8%，首次超过OECD均值）、高技木产出增速接近整体工业三倍、出口结构向机电与高附加值产品迁移。然而，产能快速扩张与内需偏弱导致创新收益大量让渡给下游客户，利润率改善有限。中央财经委员会部署的“反内卷”政策旨在重塑供给纪律，目前行业进展呈现显著分化： 领先行业（物流、化工、锂）已依次完成“资本开支下降+库存去化→价格企稳→净利率大幅修复”三步曲。例如，物流行业通过自律提价实现收入连续五季增长；化工受地缘与欧洲产能退出带动，价差扩大推动净利率同比提升约550个基点；锂电因资本开支骤降63%与储能需求爆发，净利率扩张超2600个基点。 落后行业（光伏、汽车、白酒）仍停留在“资本开支下降但库存累积”的第一阶段，价格竞争持续压制盈利。光伏产能超需求两倍以上，净利率较十年均值低约2100个基点；汽车国内单车利润仅约3000元，企业被迫以海外增长对冲国内挤压，但海外市场正面临贸易政策逆风；白酒则受制于需求萎缩，库存天数仍同比上升。 整体而言，反内卷从“行政定价”向“市场出清”过渡，盈利的可持续修复取决于产能纪律的维持与需求侧的配合。 四、市场准入缺口：贸易壁垒上升，出口商股价受汇率与政策双重压制 中国最具全球竞争力的行业（电池、电动车、风电、电力系统）恰是欧美贸易措施聚焦领域。2026年以来，欧盟启动《查找图书外国补贴条例》深入调查、提出《查找图书工业加速器法案》，美国FCC将特定逆变器与机器人纳入覆盖清单，虽光模块暂获豁免，但政策不确定性升高。叠加人民币自年底以来升值约4%且对冲覆盖率低，出口商以美元计价的收入转换为人民币时产生汇兑损失，导致一季度见顶后股价持续疲软。摩根大通认为，产业升级逻辑未变，但短期股价重估需等待两个外部催化：一是人民币汇率企稳或对冲工具普及，二是欧美贸易政策边际缓和。中长期看，通过海外本地化生产从“出口产品”转向“输出产能”是结构性解方。 五、AI生态：基础设施为锚，应用层待变现，互联网平台具期权价值 中国AI产业链呈现“政策锚定资本开支—国产芯片替代—模型降本—应用变现”的传导链条。当前盈利高度集中于硬件层（预计占2026年行业营业利润的93%），而模型与应用层仍处投入期。关键判断包括： • 算力与国产化：受益于“AI+”战略与千亿级引导基金，本土芯片在AI基础设施需求中的占比预计从2025年的40%升至2028年的80%，瓶颈正从设计转向代工与HBM产能，先进封装与服务器ODM环节价值凸显。 • 模型层：中国大模型性能达美国前沿水平的90%，但价格仅为其10%至20%，在开源与编码代理领域全球份额快速提升，预计模型与应用层将在2028年左右实现营业利润转正。 • 互联网平台：作为AI变现主载体，其股价目前仍受困于弱消费预期，市场将AI投入视为成本而非资产。摩根大通建议将平台类公司视为“看涨期权”：短期优选云收入与利润率已验证的阿里云智能，中期布局微信智能代理等场景落地的腾讯，两者均需在宏观消费回暖与AI收入可归因化后实现重估。 配置上，建议以AI硬件与国产化为核心底仓，精选具备定价权的模型公司，并在互联网平台因情绪错杀时边际增配，以分散单一供应链风险。 六、宏观代理变量：地产与消费寻底，轻仓位下具不对称机会 地产调整进入第五年，8月开发投资同比降约20%，新开工与土地出让金深度负增长，仅一线城市价格初步企稳。8月推出的“828”政策实质取消预售制（资金监管至竣工、按揭放款延后），将倒逼开发商减少拿地并延缓供给，有望在2027年推动更多一线城市价格企稳；9月推出的百万亿房贷利息补贴（前五年减100个基点）更多是信号意义，对三四线城市销量有边际托底，但难改价格趋势。消费端，8月零售额同比仅增0.4%，人均可支配收入中位数增速放缓，房产负财富效应持续抑制消费倾向。出口繁荣因资本密集属性未能广泛惠及就业，劳动密集型行业出口反而下滑。 策略上，摩根大通不建议左侧重仓博取地产与消费的V型反转，但指出两者仓位已极低、估值压缩至历史低位，任何基本面企稳信号（如二手房挂牌量收缩、租金收益率超越房贷利率）都将带来显著反弹空间。建议选择性配置：一是融资优势明显的头部国企开发商及受益于二手交易活跃的房产中介；二是具备自身alpha的消费龙头（高股息、海外扩张或困境反转）。 七、流动性周期：居民存款搬家初启，慢牛格局下盈利接棒是关键 住户资产配置正经历从房产与存款向金融资产的结构性迁移：房产占比从2021年的56%降至2026年预估的45%，存款占比升至32.6%，而股票与基金合计仅占约11%，仍低于2021年牛市水平。超额储蓄自2023年峰值9.1万亿元降至2026年6月的6万亿元，定期存款利率大幅下行（3年期降幅约135个基点）促使资金流向理财、保险及“固收+”产品。若股市回报稳定，居民增配股票每提升1个百分点，或带来约5.3万亿元的潜在流入。监管层通过ETF干预展现“平滑波动、抑制过热”的意图（1月净流出约7000亿元，7月后温和净流入约500亿元），意在培育“慢牛”而非“疯牛”。摩根大通认为，存款搬家提供的只是流动性底，指数级别的重估最终需依赖盈利增长接棒；当盈利增速企稳且波动受控，增量资金才会加速入市。 八、投资启示与配置建议 综合七大问题，摩根大通的核心框架是：在“创新—盈利”的转化链条中，优先布局那些政策扶持明确、供给格局改善且盈利可见度高的环节，同时利用市场对宏观悲观预期的过度折价构建不对称组合。 具体建议： 1. 核心超配：AI基础设施与国产化链条（半导体设备、先进封装、算力租赁、电力配套），以及反内卷领先且利润率刚修复的化工、物流龙头。 2. 战术配置：估值合理、云智能变现路径清晰的互联网平台（短期阿里、中期腾讯），作为AI应用落地的期权标的。 3. 边际增配：低仓位、低估值的一线国企地产商与优质房产中介，以及具备海外扩张能力的消费白马，作为分散AI交易拥挤度的补充。 4. 观察触发剂：紧盯出口增速是否放缓至中个位数（政策加码的前瞻信号）、一线城市二手房价格能否连续环比转正、以及AI头部公司能否在财报中单独列示并扩大AI业务毛利率。 结论：中国股市正处于“产业创新强、宏观内需弱、资金结构转”的复杂阶段，指数级别全面爆发需等待需求缺口收窄与盈利预期上修，但结构性阿尔法依然丰沛。建议以“制度红利+产能出清+AI渗透”为主线，在波动中布局具备真实现金流与全球竞争力的优质资产，对单纯依赖流动性驱动的小盘题材保持审慎。#文字观点", "publish_time": "2026-10-22 20:08", "tags": ["文字观点"]}, "attachment:files/绿联科技深度：NAS开启第二成长曲线，全球化打开成长空间20261021.pdf": {"id": "attachment:files/绿联科技深度：NAS开启第二成长曲线，全球化打开成长空间20261021.pdf", "kind": "attachment", "title": "绿联科技深度：NAS开启第二成长曲线，全球化打开成长空间20261021", "source_label": "其他", "excerpt": "绿联科技深度：NAS开启第二成长曲线，全球化打开成长空间 20261021 要点总结 1.公司概况与业务结构 绿联科技成立于2012年，2014年开始出海，目前业务覆盖180多个国家和地区；2025年境外收 入占比已达61%。", "content": "绿联科技深度：NAS开启第二成长曲线，全球化打开成长空间 20261021 要点总结 1.公司概况与业务结构 绿联科技成立于2012年，2014年开始出海，目前业务覆盖180多个国家和地区；2025年境外收 入占比已达61%。 业务分为四大品类：充电创意、智能办公、智能硬件、智能存储。2025年收入占比分别约为 46%、26%、16%、13%。 充电创意为基本盘，占比近一半；充电与智能办公合计约占七成收入，提供稳定现金流与品牌基 础。 智能存储（以NAS为核心）2025年收入同比增长200%以上，2026年上半年继续增长86%，是 正在起飞的新业务，提供成长想象空间。 公司正从传统3C配件平台升级为科技消费电子平台，兼具成熟配件业务的结构升级/份额提升逻辑 与NAS第二成长曲线，品牌出海打开成长天花板。 2.区域与渠道结构 2023年境外收入首次超过境内，2025年境外占比达60%以上。 出海路径为先线上后线下：2025年线上收入70亿元、线下25亿元，占比约七三分。 2020—2025年线下收入复合增速约38%，高于线上的26%，公司已进入线下铺渠道、做品牌的 阶段，不再仅是亚马逊平台的跨境卖家。 3.泛拓展类赛道特征 泛拓展类指手机、电脑等核心终端之外的扩展配件（充电器、移动电源、数据线、扩展坞等），为 招股书中弗若斯特沙利文定义的品类。 规模不小、增速不慢：2025年充电类占主要细分市场约67%；2021—2025年充电类及连接传输 类均实现两位数稳健增长。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 格局分散：2025年全球泛拓展类前五大品牌零售额CR5仅7%，市场几乎无龙头。绿联2025年出 货量1.5亿件、全球第一，零售额约70亿元、全球第二；第一名零售额约140亿元，为绿联两 倍，说明绿联量大利薄，产品结构升级空间仍在。 格局分散原因：供给端门槛不高、SKU极多、渠道碎片化，白牌充斥；当前结构升级叠加监管趋严 正推动白牌出清。 弱周期属性：随着电子设备数量长期增长，配件复购与产品更新持续，行业呈现弱周期、稳增长态 势。 4.充电器与移动电源行业驱动 充电器三大推动力：多设备充电需求（多口、多功率）、终端厂商取消附赠充电器（如苹果 iPhone12起不送充电头）、氮化镓等快充技术升级。2020—2025年中国线上充电器量价齐升； 第三方预计全球充电器市场2024—2030年复合增速6.4%。 移动电源：全球市场预计2025—2030年复合增速9.4%，快于充电器；升级方向为高功率、无线 化、多功能集成。 监管是关键变化：2023年移动电源转向强制3C认证，2026年出台移动电源新国标，安全与溯源 要求提升行业门槛，合规成本上升推动低质供给退出、份额向头部集中。 绿联核心能力之一是在认证规则与技术路线切换窗口期把握节奏：早期苹果MFI认证管理加强时较 早布局MFI认证产品；2023年移动电源转强制3C时内部较早完成核心产品切换，在竞争对手调 整期快速承接需求、享受新规红利。 5.消费级NAS行业与绿联地位 NAS即网络附加存储设备。消费级NAS过去受价格贵、难用、系统部署复杂制约，主要服务极客 与小型企业；AI发展下需求端更加多元（家庭照片视频、创作文件、AI模型本地化部署），公有云 存在持续付费与隐私顾虑，移动硬盘不擅多设备协同且无智能功能，本地私有云存储接受度提高。 供给端：绿联、极空间等消费品牌大幅降低使用门槛，价格下探至千元出头，系统做成手机APP形 式、界面类消费电子，易于上手。 市场规模：2024年全球消费级NAS约5.4亿美元，预计2029年达26.8亿美元，复合增速约 38%。 绿联布局：2018年组建NAS团队，2020年推出首款产品，2024年推出第二代产品线；2025年 NAS收入9.7亿元，位列全球消费级NAS份额第一，市占率约17.5%。2024年9月推出二代 NAS后，凭借性价比与更低使用门槛快速打开海外市场，众筹表现亮眼，随后在亚马逊多站点上 线，NAS进入规模放量期。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 成功因素一：硬件质价比，延续配件打法，同价位提供更高盘位、内存和接口；产品矩阵覆盖千元 级入门到万元级专业，覆盖面广于极空间、群晖等同行。 成功因素二：软件自研与更新，自研UGOS/UGOSPro操作系统，交互直观，基本每1—2个月更 新一次，补齐消费级NAS长期使用体验。NAS是需运行多年的设备，系统好用程度直接决定用户 留存与推荐，是從卖硬件转向有粘性、有生态的关键。 6.NAS成长空间：产品与渠道双轮 产品端向AINAS及HomeAgent发展：传统NAS核心是存储空间与传输速率；AINAS核心是 本地推理与数据理解能力，包括本地大模型、AI问答、AI相册、AI搜索、文件管理等智能功能， 客单价高于传统NAS。 绿联2026年9月在IFA发布HomeAgent，定位家庭本地算力与数据调度中枢，目前处于众筹/ 预售阶段，预计2027年上半年发货，短期不贡献收入，主要提供估值支撑。 渠道端：2025年绿联NAS国内线上市占率已达41%，建立领先优势；后续增量来自线下渠道补齐 与海外份额提升。 海外：2024年二代NAS推出后出海明显加快，美亚NAS份额自2024年10月起快速提升，目前 约20%；AINAS也在海外众筹首发。随着海外线下渠道拓展及AINAS、HomeAgent海外上 市，海外份额有望进一步提升。 测算：在行业扩容叠加产品升级与份额提升逻辑下，预计2026、2027年绿联NAS收入分别为15 亿元和23亿元，增速约54%，全球市占率由17.5%提升至25%。 7.品牌出海成功三要素 定位清晰：在高溢价国际品牌与低价白牌之间建立品牌化质价比定位——核心性能、设计、使用体 验达到头部品牌约70%—80%的品质水平，价格仅为其30%—40%；通过认证与品牌化售后体系 降低消费者购买白牌的不确定性，避开低价竞争，同时以更低门槛承接成熟品牌部分用户需求。 渠道选择合理：早期依托亚马逊等跨境电商平台流量红利实现海外从0到1；随品牌势能积累进入 更多区域性平台电商，2019年建立品牌独立站，后通过设立本地子公司铺设线下渠道、推进本地 化。 统一品牌价值与认知：国内外及所有产品线均采用UGREEN品牌，不同于安克对产品线采用不同 子品牌，有利于积累品牌认知、复用品牌价值、提升营销效率。 海外盈利能力：海外毛利率约44%，明显高于境内。 8.对标安克的追赶空间 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2025年绿联境内收入已达安克的3.5倍，但境外收入仅为安克的两成，规模差距几乎全部来自海 外。 结构差异：绿联2025年北美收入占比约15%，安克北美收入占比接近48%，绿联在北美成熟市场 与安克差距最大、空间也最大。以美国亚马逊移动电源和充电器份额为例，安克常年约10%，绿联 仍为个位数。 追赶空间一（线上）：绿联进入亚马逊比安克晚三年（安克2011年进入，为早期进入亚马逊的中 国卖家，与亚马逊深度绑定；绿联2014年进入时中国跨境卖家已大量涌入、竞争激烈）。但差距 在缩小：绿联产品创新、品牌升维与流量持续积累，且在高瓦数充电器、充电宝上有积累，高瓦数 是充电类未来方向，产品结构升级时有望优先抢占份额。 追赶空间二（线下）：安克2014年进驻美国Staples、2016年突破沃尔玛，拉动2015—2016年 海外收入快速增长；绿联2025年下半年起海外线下渠道取得突破，有望复制安克突破线下渠道后 的高速增长模式。 追赶空间三（品类）：绿联NAS出海仍处于从重点市场验证向多区域复制阶段，此前集中于美国 和德国，现逐渐向日本、法国、意大利等欧洲国家铺货，产品本地化、语言适配与渠道运营仍有较 大完善空间。 线上份额提升、线下渠道打开、新品类出海三点共同支撑海外收入维持高增长。 9.盈利预测与估值 预计2026、2027年营收分别为128亿元和163亿元，同比增速35%和27%。 分品类看，充电创意和智能存储是最重要增长推动，2026年增速分别约40%和60%。 毛利率：海外占比提升与传统配件升级形成利好，但NAS业务受DRAM及NAND存储涨价扰 动，部分抵消。 费用率基本维持稳定，预计2026、2027年归母净利润分别为9.5亿元和12.3亿元，同比增速 35%和30%。 估值：当前对应2026年PE不到21倍；市场对存储价格已有下调预期，叠加HomeAgent等AI 应用端估值催化，业绩与估值均有修复空间。给予2026年25倍PE，目标价56.9元，较当前有 20%以上空间。首次覆盖给予跑赢行业评级。 问答整理 Q1：绿联的传统配件业务应该怎么看？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：传统配件即泛拓展类，是弗若斯特沙利文定义的、手机电脑等核心终端之外的扩展配件。该赛道规 模不小、增速不慢，2025年充电类占主要细分市场约67%，2021—2025年充电类与连接传输类均保 持两位数增长；格局分散，2025年全球前五大品牌零售额CR5仅7%，几乎无龙头。绿联2025年出 货量1.5亿件、全球第一，零售额约70亿元、全球第二，第一名零售额约140亿元、为绿联两倍，说 明公司量大利薄、产品结构升级空间仍在。行业正因结构升级与监管趋严推动白牌出清，且已呈现弱周 期、稳增长特征。 Q2：充电器和移动电源两个品类的增长驱动是什么？ 答：充电器有三方面推动力：多设备充电需求带来多口多功率产品需求、终端厂商取消附赠充电器释放 第三方需求、氮化镓等快充技术推动升级；2020—2025年中国线上充电器量价齐升，第三方预计全球 充电器市场2024—2030年复合增速6.4%。移动电源全球市场预计2025—2030年复合增速9.4%， 快于充电器，升级方向为高功率、无线化、多功能集成；最关键变化是监管，2023年强制3C认证、 2026年新国标出台，提高行业门槛，合规成本上升使低质供给退出、份额向头部集中。 Q3：绿联在认证规则切换中具备什么能力？ 答：公司多次在认证规则和技术路线切换的窗口期把握节奏。早期苹果加强MFI认证管理时，未认证 数据线兼容性和稳定性易出问题，绿联较早布局MFI认证产品，贴近苹果配件市场；2023年移动电源 转强制3C时，公司内部较早完成核心产品切换，在竞争对手调整期快速承接市场需求、享受新规红 利。持续挖掘市场需求、创新与提前布局是公司核心壁垒之一。 Q4：消费级NAS行业为什么起来？市场空间多大？ 答：需求端在AI发展下更加多元，家庭照片视频、创作文件、AI模型本地化部署增多，公有云存在持 续付费与隐私顾虑，移动硬盘不擅多设备协同且无智能功能，本地私有云 也是从一个卖卖硬件，然后变成有粘性有生态的一个关键。 发言人 向后看的话，我们认为公司的那业务具备产品侧还有渠道端的双重的成长空间。产品端主要就是像AI nas还有homeagent这边去发展。其实传统的这个nas核心还是存储的空间以及传输速率这块。AI nice的核心其实就是让设备具备本地推理和数据理解的能力。包括本地大模型包括其他的AI问答、AI 相册、AI搜索以及文件管理等等的这种智能的功能。所以它的这个客单单价相比传统的nars也会更 高。 发言人 绿联其实也在AInars的这个基础上更近了一步，包括今年9月在一发展上正式发布的这个home agent，它的定位也是家庭本地算力和数据的一调度中枢。当然目前这块还是处在一个众筹还有预售的 阶段，要预计到27年上半年才会发货。所以短短期内它也不是一个收入的贡献。当然主要是为公司提 供一个估值的这个趋势的支撑。那在渠道侧的话，实际上公司在国内线上已经建立了领先的优势。25 年这个绿联nas国内线上的份额已经达到了41%。 发言人 我们认为后续更多的增量就来对线下渠道的补齐，以及海外份额的一个提升。刚刚也提到就是24年公 司二代的纳斯推出之后，出它的这个出海进程是有明显加快的。绿联在美亚的这个nars的份额，从24 年的十月就开始快速提升，然后现在基本上在20%左右了。AInas的话也是在海外市场去进行的众筹 首发。我们认为其实随着海外线下渠道的拓展，以及ias和homeagent在海外它的上市，这个绿联 nars的这块还是有望进一步在海外去提高份额的。 发言人 最后我们也在以上的这种假设的基础上，做了一个大公司AInars的收入的测算。就是在这个行业扩容 叠加整个产品升级和份额提升的这个逻辑之下，我们测算26和27年绿莲娜的收入分别是百15和23 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-22T08-43:b1895a44e0e1": {"id": "post:2026-10-22T08-43:b1895a44e0e1", "kind": "post", "title": "2026-10-22 08:43", "source_label": "帖子正文", "excerpt": "【XB机械】特斯拉Q3业绩会点评：产能与数据并重，具身智能飞轮开启 20261022特斯拉Q3业绩会就Optimus进展释放了重要信号。＃弗里蒙特产线的落地与“先部署1-2万台用于数采和训练”的规划，充分印证了物理AI正迈向实质性量产与端到端数据闭环的新阶段。", "content": "【XB机械】特斯拉Q3业绩会点评：产能与数据并重，具身智能飞轮开启 20261022特斯拉Q3业绩会就Optimus进展释放了重要信号。＃弗里蒙特产线的落地与“先部署1-2万台用于数采和训练”的规划，充分印证了物理AI正迈向实质性量产与端到端数据闭环的新阶段。 一、 产能基建落地，商业化节点明确 1. 量产节奏：弗里蒙特工厂周产2万台（年化百万台）产线设备已基本落地。目前处于产能爬坡初期，预计最快于2027年底达产，并开始向外部客户交付。 2. 关键催化：预计1个月发布新视频，＃展示Optimus非预编程任务的真实AI能力；2027年下半年部署AI 5芯片，算力将实现数量级提升。 3. 硬件核心壁垒：灵巧手（需兼顾耐磨、柔软及集成大量高可靠传感器）目前仍是打开应用场景天花板的关键难点，处于持续迭代状态。 二、 突破数据瓶颈，强调数采与仿真闭环 会议明确指出了当前具身智能的数据痛点。由于缺乏类似汽车FSD的海量天然数据源，＃特斯拉计划先制造1-2万台Optimus。其训练路径为：先用人类演示数据完成基础训练，随后在仿真环境和真实世界中依托本体进行大量“自我博弈”与强化学习。这直接验证了“Sim-to-Real（虚拟到现实）”数据获取的重要性。 三、 投资观点：“数采加机器人”双螺旋逻辑确立 结合产业近期进展（如GPT-6、Helix 2.5等突破），我们认为具身智能已形成两条互为飞轮的核心主线： 1. 数采与仿真平台（底层基建）：物理AI的瓶颈在于对重力、摩擦力等物理规律的高置信度感知。单纯依赖真实世界采集成本极高，打破“数据不可能三角”必须依靠数字孪生与仿真合成数据。数采环节已成为整条产业链不可或缺的“卖水人”。 2. 机器人本体及核心零部件（商业终端）：随着“世界模型加VLA操作闭环”的成熟，机器人正从自动化设备向具备物理直觉的AGI载体蜕变。量产奇点临近，＃核心硬件和自动化设备放量的确定性正在增强。#❗️重点推荐：蓝思科技：T头部模组+国产机器人机器人ODM+OEM龙头。 五洲新春：机器人零部件平台型公司（丝杠、轴承、减速器、结构件）。 日盈电子：功能性材料+感知系统。 双元科技：自动化装配+检测设备核心供应商。 物理AI方向：华依科技、奥比中光、福莱新材、凡拓数创、步科股份等。#文字观点", "publish_time": "2026-10-22 08:43", "tags": ["❗️重点推荐", "文字观点"]}, "post:2026-10-22T14-11:c3cd499b3ae8": {"id": "post:2026-10-22T14-11:c3cd499b3ae8", "kind": "post", "title": "2026-10-22 14:11", "source_label": "帖子正文", "excerpt": "【广发机械】人形机器人：特斯拉业绩会总结，2个月内催化充足-20261022 #业绩会超预期的点在于机器人进展的时间线比前期表述更清晰、指引明确： 1️⃣1-2个月内发布Optimus非预编程视频/Demo，展示现实场景智能化。股东大会在12月4日，潜在的重要催化。", "content": "【广发机械】人形机器人：特斯拉业绩会总结，2个月内催化充足-20261022 #业绩会超预期的点在于机器人进展的时间线比前期表述更清晰、指引明确： 1️⃣1-2个月内发布Optimus非预编程视频/Demo，展示现实场景智能化。股东大会在12月4日，潜在的重要催化。 2️⃣27年4月大量投入使用AI5，额外计算量会带来很大影响， 3️⃣27年底开始向客户交付，最初客户工业应用（危险的重复性任务）。 4️⃣27年底解决人工智能、机电设计以及可靠性和使用寿命等问题。 5️⃣预计1年+时间达到每周产2万台 #本轮的核心变化在于openAI的astra给机器人模型突破带来新的可能性。模型突破意味着走向通用性＝大规模应用的曙光。 #交易节奏：优先OpenAI链与物理AI相关标的，后程转T链（年底爬产到2000-2500周产）。 #openAI相关标的：兆威机电、长盈精密、绿的谐波等。 T链组合：丝杠#恒立液压、浙江荣泰、北特科技;减速器及相关环节#科达利;感知与控制#奥比中光、峰岹科技;轴承#光洋、天创。#文字观点", "publish_time": "2026-10-22 14:11", "tags": ["恒立液压、浙江荣泰、北特科技", "科达利", "奥比中光、峰岹科技", "光洋、天创", "文字观点"]}, "post:2026-10-22T19-27:6a6084343ea1": {"id": "post:2026-10-22T19-27:6a6084343ea1", "kind": "post", "title": "2026-10-22 19:27", "source_label": "帖子正文", "excerpt": "摩根大通——2026年CIIF人形机器人与物理AI巡展纪要——生态需求驱动、工作流集成落地，行业从概念炒作迈入早期部署验证期 一、核心结论：行业叙事已切换，估值锚点从“Demo”转向“Uptime与回报率” 本届CIIF展会的观感与早期以“步态流畅度”为核心的机器人展览截然不同，重心已彻底移至“工作", "content": "摩根大通——2026年CIIF人形机器人与物理AI巡展纪要——生态需求驱动、工作流集成落地，行业从概念炒作迈入早期部署验证期 一、核心结论：行业叙事已切换，估值锚点从“Demo”转向“Uptime与回报率” 本届CIIF展会的观感与早期以“步态流畅度”为核心的机器人展览截然不同，重心已彻底移至“工作流能否稳定运行”。宇树、优必选、智元均展示工业检测、搬运等实用场景原型，而非单纯运动性能秀。投资者与产业方最密集的提问集中在：感知一致性、操作可靠性、标定稳定性、数据质量、部署工具链及ROI验证。这标志着Physical AI正从“实验室逻辑”迈向“工业逻辑”。我们对中长期保持建设性看法，但短期证明责任（burden of proof）急剧上升：一旦对话进入连续运行小时数与投资回收期，“酷炫演示”无法独自支撑估值，执行纪律与单位经济性取代宏大愿景成为定价核心。 二、需求脉冲真实，但结构仍属“建栈”而非“车队部署”，市场将保持高度选择性 路演交流显示需求积极，但需求结构决定其可持续性边界——当前订单多数绑定研发扩张、数据采集、开发者平台、小批量试点及零部件备货，而非终端用户的大规模 fleet 部署。这种结构在近期仍可维持强势，因为生态参与者愿在工具与组件上重金投入，直至工厂或家庭做出规模化采购决策。关键摇摆因子是“试点→重复订单+可量化ROI”的转化节奏，该转化在不同场景间极不均衡。因此，板块可维持正向动量，但“质量”正在分化：市场将奖励订单可见度高、可重复执行的细分领域，惩罚仅靠叙事与一次性项目驱动的区域。 三、数据采集成为通用智能突破前最具变现确定性的“桥梁”，卖铲人经济先于整机厂兑现 数据几乎出现在每场讨论中，且绝非概念词。管理层将数据定义为瓶颈与机遇的双重体：更好数据管道直接转化为任务性能提升与迭代加速。行业明确区分人类数据（低成本扩量）与真实机器人数据（最高质量但稀缺），这支撑了一条清晰的短期变现路径——传感器、数据手套、灵巧手、标定工具及采集模块，即便在终端部署早期亦可产生显著收入。我们反复听到的行业共识是：即便强大的“大脑”能力，也需场景数据、标定与可靠传感器/手来将智能转化为一致的任务执行。因此，“数据工具层”成为焦点，卖铲人（shovel-seller）经济学有望早于OEM盈利模式兑现。 四、灵巧手成实用化真实瓶颈，早期采用聚焦可靠性与性价比而非极限参数 展会传递出手部路线图日趋务实：行业公认灵巧手与力控是解锁有意义工业任务的门控项，但短期 adoption 并非“不计成本追求最大自由度”，而是平衡可靠性、生命周期与成本性能——工厂以uptime与一致性为考核标准。连杆、腱绳、直驱等路线争议仍在，但早期工业牵引偏向能承受重复循环且控制稳定的设计。触觉传感被视为精密操作力反馈的必需品，但技术路线未收敛，给时间表与标准设定带来不确定性。投资含义：手部既是瓶颈也是变现路径，但早期赢家将是那些实现可制造性、可服务性与稳定量产的企业，而非仅靠“演示灵巧度”取胜者。 五、“大脑”竞赛从宣言转向迭代速度与闭环部署，OEM分化加剧 最一致的信息是：具身智能非单一突破时刻，而是数据规模、场景迭代与闭环部署的持续磨炼。OEM战略明显分野：部分坚持硬件平台姿态、依赖外部算法伙伴；另一些重注模型与数据基础设施以攫取更多价值链。行业共识是——脱离正确传感器栈、标定与高质量场景数据，单纯模型性能不足为凭。这抬高了OEM的短期门槛：若无法展示可重复任务表现与部署经济性，将面临被估值压缩为“身体供应商（body supplier）”的风险，在硬件层通缩中边缘化。市场将奖励那些在客户工作流中展现更快迭代、更好集成与可重复结果的玩家。 六、算力约束成为分水岭，边缘-云端架构选择是真实产品决策 算力以两种形式成为门控因素：训练端仅少数玩家能负担大规模持续训练与强化循环，决定迭代速度与泛化能力；推理端，工业任务的响应时延、稳定性与安全KPI使边缘计算不可或缺。这催生真实的架构辩论：多少负载在设备端完成、多少调用云端，如何跨模式管理时延与可靠性。该动态亦塑造商业化序列：受控B2B部署可更好工程化绕开连接性与算力预算约束，而2C场景对安全、成本与鲁棒性要求陡增。实操结论：算力强度成竞争差异化要素，但亦是弱平衡者难以承载的成本与集成负担。 七、电池、热管理与运行时长：静默的规模化制约因素，解释“工业优先”的商业化顺序 连续运行约2小时的配置仅适用于演示与特定训练循环，连续工业操作必须工程化集成换电与充电窗口。更高算力负载与更强执行器推高发热与功耗，热管理与能量密度成为隐形天花板。这些约束强化了“工业部署为首波浪潮”的逻辑：工厂可围绕换电、充电窗口与受限任务集进行设计，而家庭环境结构松散、安全容忍度低、消费者对价格敏感。这意味着组件需求更可能绑定使能技术（电源管理、热解决方案、系统集成），而非通用人形机器人销量直线爬坡的线性故事。 八、减速器与执行器选择转向“场景驱动”而非“路线意识形态”，多架构共存成定局 谐波（精度/扭矩密度/紧凑性不可替代，多用于上肢精细动作）、行星/摆线（鲁棒性/抗冲击/性价比，用于承载与苛刻环境）、螺杆（线性执行/爆发力）的讨论热度上升，且均具投资辩论价值。未来不会加冕单一赢家架构，而是奖励能支持多架构、规模化交付一致质量并随OEM ASP下降持续降本的供应商。这同时抬升了可制造性与专用设备的重要性——快速放大精密产能才是真实瓶颈，而非图纸本身。 九、“视觉”战场从峰值参数转向一致性与标定，竞争格局按场景碎片化 感知被定义为集成与一致性问题，而非单设备规格竞赛。客户反复强调：光照变化下的xy一致性、时延、标定漂移、多机器人位置部署的集成摩擦，才是痛点。标定工作流与多传感器对齐构成护城河。相机vs. LiDAR vs. 混合方案的辩论完全场景依赖：低成本LiDAR适用于粗导航，富3D栈用于近距离操作与数据采集。结论：感知仍是短期最清晰的需求 pockets 之一，但竞争白热化（产品周期快、用例分散），赢家将是能工业化标定、负责任拓宽产品线并在规模化中维持一致性且控制成本的企业。 十、OEM战略分野：宇树、优必选、智元的不同打法与市场定价含义 • 宇树：强化硬件平台姿态——做坚固身体、开放生态，明确承认OEM无法内化所有行业工艺，邀请系统集成商与工业伙伴做垂直化。 • 优必选与智元：更重“大脑+数据+部署”叙事，强调数据基础设施与场景验证为可持续价值捕获路径。 价值池正向上移动：若“大脑+部署”层长期攫取更多经济回报，纯平台型OEM若不能构建更高价值层，将被视为硬件供应商估值。全球对标中，Tesla Bot与Figure AI的 scaling 可信度与数据飞轮是核心基准，Boston Dynamics代表移动可靠性标杆。投资启示：OEM不会被平等估值，市场将奖励可重复工作流结果与单位经济性，而非品牌曝光度。 十一、重点公司更新：奥比中光（Orbbec）与领益智造（Leader Drive）的“卖铲人”逻辑强化 • 奥比中光：CIIF messaging 聚焦数据采集工具与多路线感知（结构光、双目、iToF/dToF及不同形态），配置头部/腕部/身体多位置传感器栈供客户生成与清洗训练数据。管理层指出机器人相关订单动能强劲，且因布局移动/服务机器人等更广 footprint，体积 scaling 更早。观点：该“数据工具+多元化感知”策略可在OEM部署早期即变现，清晰度高于单一产品策略。 • 领益智造：会后我们与总裁层交流，态度更趋建设性。管理层将Physical AI定义为已兑现且正在规模化的增量增长，并强调该需求正逐步脱钩传统工业资本开支周期，为精密传动组件拉长增长跑道。产品路线从谐波减速器向行星、摆线、关节模块及更广精密传动扩展，与展会观察到的架构多元化完全吻合。尽管低端竞争者与价格压力真实存在，管理层聚焦以产品能力、客户认证与规模化可制造性防守，而非纯价格战。观点：这是少数让投资者感觉“在执行 scaling”而非仅讲板块乐观故事的对话，维持我们板块内首选（Top preference）地位。 十二、股价异动解读：Tesla Bot头条是引信，但中国供应链近两日更似情绪与资金流驱动，而非基本面重置 过去两个交易日催化剂为Tesla Bot相关新闻流重新聚焦“Physical AI scaling”，触发快速风险-on轮动。但中国区盘面行为显示：投资者先买入流动性好的Beta，而非等待中国人形OEM试点转化为可重复、ROI支撑的订单证据。这完全契合CIIF所见——板块方向正确，但多数OEM部署仍早期且场景特定，生态尚需证明可靠性、可服务性与单位经济性（而价格持续下行）。在此结构下，若后续证明点（proof points）缺席，OEM反弹易快速回吐。 十三、配置建议：偏好“有韧劲基础业务的Tesla Bot供应链”，板块内首选领益智造>奥比中光，对纯OEM Beta保持审慎 • 首选策略：不追高中国“Physical AI proxy”Beta，而是倾斜至具备强劲非机器人基本面的Tesla Bot供应链名——三花智控（Sanhua Intelligent）与恒立液压（Hengli Hydraulic）。逻辑：即便人形时间表延后，这些公司亦可凭 resilient base business 吸收波动，实现复合增长而无需完美机器人执行落地。 • 板块内排序：领益智造仍是表达该主题的最优载体（Clear monetization pathway + 多年度产能规划 + 产品线拓宽），奥比中光次之（感知硬件+数据采集工具先于整机厂变现）。多数中国OEM仍需在“从身体到大脑”的转型中证明可重复性、利润率持久性与规模化部署经济性，当前反弹在更多持续性证明点出现前，大概率维持 headline-与flow-driven。 • 风险提示：SST/边缘算力/热管理等细分技术路线延迟、超大规模客户自研模块削弱OEM份额、初创公司低价竞争、宏观AI CAPEX周期下行，均可能令高Beta回撤。建议规避纯概念小市值标的，聚焦拥有成熟传统现金流支撑、且800VDC/机器人相关产品已进入客户验证或量产倒计时的资产负债表强劲企业。#文字观点", "publish_time": "2026-10-22 19:27", "tags": ["文字观点"]}, "attachment:files/特斯拉Roadster技术及产业链梳理2026.pdf": {"id": "attachment:files/特斯拉Roadster技术及产业链梳理2026.pdf", "kind": "attachment", "title": "特斯拉Roadster技术及产业链梳理2026", "source_label": "其他", "excerpt": "特斯拉Roadster技术及产业链梳理2026 要点总结 1.核心观点与板块排序：机器人优于Roadster 短期排序上，机器人/具身智能优先级优于Roadster，原因有二：其一，机器人板块催化持续性 强，除OpenAI及DeepSeek投资外，后续还有特斯拉排产周期、三季报电话会关于机器人的表 述、四季度三代机器人相关视频发布等催化；其二，Roadst", "content": "特斯拉Roadster技术及产业链梳理2026 要点总结 1.核心观点与板块排序：机器人优于Roadster 短期排序上，机器人/具身智能优先级优于Roadster，原因有二：其一，机器人板块催化持续性 强，除OpenAI及DeepSeek投资外，后续还有特斯拉排产周期、三季报电话会关于机器人的表 述、四季度三代机器人相关视频发布等催化；其二，Roadster并非走量车型，对产业链拉动效果相 对有限。 时间点往后看，机器人与汽车板块均值得更积极：汽车及零部件持仓处于过去五年相对低位，过去 几年汽车持仓平均在3.5-4.5个点、乐观时5个点以上，中报时仅1.9个点，三季报整车略有增加 但核心零部件配置有所减少，整体仍处低配。 基本面角度，汽车四季度到明年上半年同比降幅收窄，未来某个月份有望进入同比正增长；板块利 空基本释放完毕（欧洲混动关税、国内出口退税等），后续还有消费刺激政策落地预期，短期利空 落地时股价均未充分表现，预期已较充分。 筹码与预期均处低位，后续只要有持续催化，汽车板块尤其是与机器人、Roadster相关的板块行情 仍有持续性。 2.机器人板块：T链与数据采集两条主线 T链方向：后续特斯拉爬坡、22号发布会是否有新视频等增量信息，尤其是年底周产有望爬升至 1000-2000台，对产业链有边际正贡献。核心推荐标的包括双环传动等，建议重点关注福赛科技、 铁流股份、凯迪股份等。 具身智能/数据方向：OpenAI明确后续研发重心往模型投入，10月初DeepSeek投资具身模型公 司，英伟达亦在具身智能方面延伸，物理AI作为AI落地重要一环值得重视。 随着越来越多大模型公司切入该赛道，数据紧缺的急迫性更加凸显。当前具身智能瓶颈有二：一是 模型路线尚未收敛（传统VLA模型、世界模型、语言大模型公司切入等），短期数据存在缺口；二 是数据采集环节，后续数据赛道值得重视，包括做数据本身及数据采集相关硬件的供应商。 数据赛道重点推荐两个公司：福莱新材（数据手套）、华谊科技（惯性导航）。草根调研显示，这 半年相关公司订单边际变化明显，尤其是数据手套近一两个月订单数量明显增加，海外大厂出现明 显下单，后续趋势有望延续。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 3.特斯拉Roadster：技术细节与产业链 发布会情况：周五二代Roadster正式亮相，完成两项重要表演：一是冲上环形坡道并倒挂其上， 随后跳下实现可控落地；二是腾空飞跃现有特斯拉全部车型并稳稳落地，引发广泛讨论。 三个版本： Performance性能版（入门级）：可上路、面向大众公开预定，美国预定意向金约5万美金；双 座、有后备箱，仅装备风扇吸附系统，无冷气推进系统；0-60英里加速小于1.6秒。 推力版（中档）：限量发售，预定意向金25万美金；双座、无后备箱，在风扇系统基础上加装 200升气罐、搭配4个喷嘴的冷气推进系统；0-60英里加速小于0.9秒。 Rocket火箭版（顶配）：邀请制、不公开发售；单座，装备600升高压气罐、10组喷嘴、全套冷 气推进套件，并标配风扇吸附系统；0-60英里加速低于0.59秒。马斯克宣称该车型将于2028年 投入生产。 全系标配4台20千瓦（合计80千瓦）负压风扇系统，电池、三电参数领先，轻量化较好。 冷气推进系统：技术源自SpaceX，依靠高压气体膨胀产生推力，无燃烧过程，结构简单（储气箱+ 阀门+喷管），推力相对火箭发动机较小但结构轻。2018年马斯克即提出用推进器改善汽车性能。 顶配版有三个轴向冷气喷口（共10个），4个后向喷口用于加速，喷出气体速度超音速、推力超 80千牛（相当于单发喷气式战斗机推力），可直接绕开轮胎摩擦力限制产生动力；4个位于车轮后 方向下喷口可实现垂直升起，前端左右各1个提供横向推力，从而实现原地起飞翻转。 系统最关键部件为COPV（复合材料缠绕压力容器），外层碳纤维缠绕为承力结构，内层薄金属内 衬负责密封阻隔气体渗透。顶配版采用600升储存250公斤空气，从空罐到打满需6-7小时（地 面站充气），目标优化至30分钟充满。 风扇负压吸附系统：由4台电动涵道风扇组成，每台功率20千瓦、合计80千瓦吸力；底盘有可伸 缩密封裙摆，与路面形成密闭空间，风扇抽气形成低压区，大气压形成等效下压力。该系统不依赖 速度，静止状态即可产生很大下压力，发布会演示中产生4.7吨压力，足以支撑1-2吨车辆倒挂行 驶；过弯抓地力可从轮胎极限约1.26G突破至2G。 据特斯拉专利，该系统有三套方案：基础版整个车底为单一封闭低压腔；进阶版加中央裙摆分为左 右两个独立分区、压力可调，实现更极限转向；更进阶版将车底分为更多区域，前后轴动力可定向 分配，实现更精细化的抓地力动态控制。裙摆高度可上下调节，满足赛道、过弯、日常行驶及坑洼 路段需求。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 投资建议：推荐拓普集团、华谊科技，建议关注宝龙科技、中鼎股份、金盛电子、万丰奥威等。若 参与Roadster赛道投资，按过去汽车产业投资逻辑应选择单方面价值量较高的赛道，更多在空气 压缩的储气罐、储气管路方面，相关标的包括中鼎股份、宝龙科技等。 4.OpenAI入局人形机器人 周末OpenAICEO奥特曼在博客中明确表态正在推进人形机器人，官网挂出二十多个相关岗位，涵 盖执行器、电机、传感、数据采集制造等，基本确定OpenAI将下场做人形机器人，并给出2027 年做出首次演示的时间表。 大模型公司布局机器人，若多模态理解和科技能力能有效连接现实机器人控制系统，有望降低各类 任务的编程与训练成本，推动机器人从固定动作执行向理解指令、适应环境、完成连续任务发展， 扩大商业化应用场景。 进一步强化数据与场景价值：通用模型逐步成熟后，企业差距更取决于真实作业数据及软硬件协同 能力，掌握高质量数据及应用场景的厂商有望形成\"部署-采集-训练-再部署\"的持续迭代优势。 OpenAI招聘数据采集岗位，明确强调真实机器人数据及规划采集环境的重要性，建议重点关注数 据采集环节。 5.特斯拉机器人进展与国产机器人 特斯拉海外团队来国内供应商进行生产对接；周产从年初几十台提升至近期几百台，年底维持周产 1000台以上目标。 当前瓶颈：尚未大规模量产，仍以人工装配为主，触觉传感器、电机、零销售等零部件存在一致性 或可靠性问题，影响良率；但后续随供应链配合、技术迭代及V4版本发布，看好量产进度加速。 国产方面，宇树、乐聚、智元等不断推出新机器人或机器狗新品，量产交付加速。在市场预期较低 背景下，重点推荐机器人板块，具体环节建议关注数据采集、控制器、电机、减速器等核心精密零 部件，标的建议关注四平地区、铁路股份、空调科技、零制造、特大粒及奥比中光等。 6.具身智能数据（素材）环节 机器人数据采集难点：需覆盖多模态数据（视觉、触觉、力觉、听觉等）；时空对齐和物理精确度 要求高；面临海量场景。 两大难题：一是数据规模小，当前高质量数据集约几十万到百万小时级别，业内专家认为到中局阶 段实现模型能力突破至少需亿级以上甚至百亿小时量级，差距巨大；二是采集成本高，采集8小时 最终有效数据仅2-3小时，效率较低；此外还有质量标准缺失等问题。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 与数字AI、自动驾驶相比，具身智能数据更稀缺：数字AI受益于互联网数十年海量资料，自动驾 驶车辆数量多、数据体量大。 国内具身智能数据呈金字塔结构：底层为海量公开互联网资料；中间层为仿真加无媒体素材（包括 5米异构和外骨骼三类）；顶层为高质量真机遥操数据。单一技术方案无法满足真实性、规模、成 本、效率要求，行业将各类数据融合，不同训练阶段对应不同数据。 国内数据厂商两大方向：一是以路面机器人、蜜蜂科技为代表，发布无名易购等负载设备；二是为 物理AI提供底层仿真引擎，包括光能智能、生命科技、极伽世界等。 数据层面两大核心壁垒：数据配比（真机、无本体、仿真各自比例需探索）；数据管线建设（清 洗、筛选、标注、增强、入库、训练等）。 数据量上升带动采集设备提升，负载设备关键部件包括摄像头、IMU、雷达、数据手套等，相关标 的：福莱新材、华谊科技、奥比中光。 华谊科技主要提供IMU，用于遥操套件、物手持夹爪、异构头戴式终端设备；真机套件（动捕服、 手套、VR头戴终端）每个节点内置多颗IMU；5米和异构套件中IMU与摄像头协同，摄像头采集 视觉动作画面，IMU实时记录头部、手部、腕部运动轨迹，弥补纯视觉方案在遮挡及高速场景下的 数据缺失。 华谊科技今年7月5日已表示与蜜蜂科技达成批量合作，9月7日半年度业绩说明会表示IMU产 能可充分覆盖需求。头戴设备一般配1个IMU足够，两个夹爪对应2个IMU，单个IMU价值量约 几百元。测算到2029年，国内加海外数据相关IMU订单收入预计可突破百亿元体量。 7.具身智能模型架构 早期具身智能模型采用分散模块化结构（感知、规划、控制独立），泛化性较差；后业内采用VLA 模型和世界模型，目前许多厂商将二者融合为世界动作模型（WAM）。国内各厂商底层模型均采 用VLA或二者结合的世界动作模型，仅称呼不同，如星海图、智元、银河通用、越疆、宇树、蚂 蚁、宁波阿里，海外包括英伟达、Figure、国际动力、派等。 各厂商差异化创新： 智元：解决语义与运动鸿沟问题。2025年3月发布G0one架构，局限于语言或视觉空间，缺失 物理动力直觉，模型能产出合理规划但动作无法精准执行；2026年4月引入动作供应链模型架构 G02，一定程度上解决语义与运动同步问题。 银河通用：提升数据规模化特征。2020年4月发布升级版WIM架构，将训练数据分为高质量专家 数据、低质量噪声数据、无动作标注视频，各对应不同作用，即使加入质量较差数据模型性能也不 降反升，数据规模不断提升。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 阿里和宇树：解决上半身操作与下半身移动割裂问题。 派：解决长时间难题。今年3月发布MAM机制，提高模型记忆能力以完成较长时间跨度任务，引 入后可完成15分钟级别长线复杂任务，提高任务连续性。 场景方面各厂商有区别：智元和优必选偏工厂，银河通用偏零售和家庭，星海图偏物流履约，宇树 偏家庭服务。 大语言模型方面，今年9月GPT-6被发现可用于操控机器人完成简单工作任务，但任务难度、反应 时间和任务成本仍有很大改进空间。 综上，数据与具身智能模型行业均处早期阶段，路线未完全定型，是当前亟待解决的两大问题。 8.米氏集团交流更新 现金流与分红：中报后股价调整，核心因中报现金流同比下滑较多，上半年自由现金流2.8亿元， 全年目标有望从2.8亿提升至10亿元。原因：上半年原材料（铝、塑料粒子等）涨价，公司通过 签长单、补库存、预付款锁定未来原材料价格，拿到合理成本价，维持H1毛利率同比增长；下半 年原材料价格波动不明显，公司可通过降低库存提升自由现金流。全年10亿自由现金流规模下， 结合2026年业绩有望保持双位数增长、30%以上分红率，足以保证30%分红。 上半年现金流少的另一原因：公司接了较多远期订单，随订单增长需做全球性资本开支（欧洲、北 美扩产），2026-2027年capex平均值基本稳定在25亿元，较去年涨几个亿，但不影响整体分 红。 电池盒业务：有望稳健保持20%-30%增速，主要来自欧洲大众、宝马、Stellantis订单及欧洲电动 化成长。上半年毛利率有所降低，因公司与下游客户对大宗铝价做联动，价格调整滞后约一个季 度；原材料价格稳定后，电池盒BU有望维持23%-25%的中长期毛利率，在同行中处于较高水 平。 AI算力液冷：公司具中国台湾背景，易与中国台湾AI服务器液冷ODM厂家建立关系，目前已通 过切入北美AI算力产业链，后续持续布局CDU、minifood等新产品，有望持续承接北美AI算力 产品。今年AI算力收入目标3亿元，明年指引15亿元。 人形机器人：2026年收入指引5亿元，明年10亿元，主要来自与国内头部机器人主机厂配套（零 部件配套、整机代工及海外代理销售）。公司在关节总成、面罩、电子皮肤等产品，以及配套零部 件、整机代工、海外代销等领域均有较多储备，布局宽泛长远。 SOFC业务：与国内及全球SOFC头部客户做打样，并做了其中的金属部件。 整体看，传统业务增长、电池盒新兴业务发展、AI算力液冷、人形机器人等领域均处稳健发展状 态；上半年自由现金流下滑带来的分红担忧有望随全年财务数据落地消除。以10亿自由现金流、 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 双位数增长和30%分红率看，2024年及后续稳健分红不必担忧；当前调整后无论PE估值还是股 息率角度均较安全且具性价比，坚定推荐。 9.乘用车月度销量与行业观点 9月销量：零售161.8万辆，同比下降28%；1-9月累计1333.4万辆，同比下降21.7%。批发 254.9万辆，同比下降9%。狭义乘用车9月出口91.7万辆，同比增长73.7%。 行业年初至今持续\"内需差、出口强\"逻辑，1-9月无变化，总量持平或小幅增长、有时小幅正增 长。 新能源：9月零售108.4万辆，同比下降16.7%；1-9月累计777.5万辆，同比下降12.8%。出口 9月再创新高，达55.8万辆，同比大幅增长，其中插混车翻近两倍、增程车翻近五倍；累计出口 388.7万辆，同比增长138.8%。综合批发9月约166.6万辆，同比增长11.3%。 内需低于预期，主因去年需求大促及抢装补贴透支，该买车的人去年基本已买完，今年补贴门槛较 高、能拿到的人不多。按强险口径测算，今年乘用车零售约1900-1950万辆，同比下降不到 20%。9月燃油车因油价上涨下降49%，但燃油车需求并未向电车转移，新能源同样下滑明显，综 合看系需求被透支。 全年新能源预计约1100万辆甚至不到，全年新能源在强险中渗透率约55%-60%（57%-58%）， 与去年基本持平；内销详细口径渗透率约62%-63%。 今年需求量已达历史最底部，可能不如2020年（2020年销售周期不到8个月）。当前总零售下降 二十多点，全年不到20%，后续降幅会缩窄，因去年12月零售量已为过去几年最低，12月前后大 幅缩窄有可能。 10月内需尚无好转，但10月下半旬至11月基数逐渐走低，行业内可出现积极变化：汽车零售增 速逐渐收窄；新能源车能否好转不确定，但汽车总零售增速理论上会有一定数量改善。 利空出尽：12月欧盟将公示IA法案，明年上半年才有汽车消费税（也可能推迟至下半年），且不 会太早征收、有缓冲期，明年下半年之前不必过多担心政策问题。 碳酸锂：锂价较高点已大幅回落，碳酸锂对一台纯电车单车成本影响约3000元，车企盈利能力有 望重新释放。 短期三个利好：内需边际向好、政策担忧缓解、锂价回落。长期稍偏空，因政策相对不积极；明年 因2028年购置税退坡五个点、补贴可能彻底取消及消费税等政策，大概率是冲量年，今年1900 万辆基础上明年预计2000-2100万辆。 市场对汽车消费悲观（类比白酒一蹶不振）不至于，汽车消费完全受政策调控，今年是极端低值、 去年是极端高值，两年中间即需求均值，今年低于均值，与白酒不同。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 出口方面，维持高增长可能性几乎不可能，后续大概率降速；欧盟配额政策对欧盟上限影响大，原 预计对欧盟插混出口100万辆，上限可能仅40万辆，影响量不小；车企大概率今年已透支未来出 口量，明年出口或降速，但内需可能较好；2028年后内需可能再下行。 反弹若出现，最晚局限于明年上半年，明年下半年大概率与今年差不多。 问答整理 Q1：当前机器人板块与特斯拉Roadster赛道如何排序？ 答：短期排序上机器人/具身智能优于Roadster。原因：一是机器人催化持续性强，后续有特斯拉排产 周期、三季报电话会机器人相关表述、四季度三代机器人视频发布等催化；二是Roadster并非走量车 型，特斯拉内部对这款车型2028年左右产能规划仅小几百万台，对供应链拉动有限，且其技术更多源 自SpaceX，对汽车零部件拉动短期有限，兑现可能性弱于机器人。 Q2：汽车板块当前筹码与预期情况如何？ 答：汽车及零部件持仓处过去五年相对低位，过去几年平均3.5-4.5个点、乐观时5个点以上，中报仅 1.9个点，三季报整车略增但核心零部件配置有所减少，整体低配。基本面看四季度到明年上半年同比 降幅收窄，未来某月有望同比转正；利空基本释放完毕，短期利空落地时股价均未充分表现，预期已较 充分。后续只要有持续催化，相关板块行情仍有持续性。 Q3：机器人板块重点推荐哪些方向与标的？ 答：两条主线：一是T链，后续特斯拉爬坡、22号发布会及年底周产有望爬升至1000-2000台，核心 推荐双环传动等，重点关注福赛科技、铁流股份、凯迪股份等；二是具身智能数据方向，随着大模型公 司切入，数据紧缺急迫性凸显，重点推荐福莱新材（数据手套）、华谊科技（惯性导航），草根调研显 示相关公司订单边际变化明显，数据手套近一两个月订单数量明显增加、海外大厂明显下单。 Q4：特斯拉Roadster发布会展示了哪些内容？三个版本有何差异？ 答：周五二代Roadster亮相，完成冲上环形坡道倒挂并可控落地、腾空飞跃现有全部特斯拉车型并稳 稳落地两项表演。三个版本：Performance性能版可上路、公开预定，意向金约5万美金，双座有后 备箱，仅风扇吸附系统，0-60英里加速小于1.6秒；推力版限量发售，意向金25万美金，双座无后备 箱，加装200升气罐、4个喷嘴的冷气推进系统，加速小于0.9秒；Rocket火箭版邀请制不公开发 售，单座，600升高压气罐、10组喷嘴、全套冷气推进套件，加速低于0.59秒，马斯克宣称2028年 投产。全系标配4台20千瓦负压风扇系统。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q5：冷气推进系统的技术原理与关键部件是什么？ 答：技术源自SpaceX，依靠高压气体膨胀产生推力，无燃烧过程，结构为储气箱+阀门+喷管，推力 较火箭发动机小但结构轻。顶配版10个喷口分三个轴向，4个后向喷口加速（喷气速度超音速、推力 超80千牛，相当于单发战斗机推力，绕开轮胎摩擦力限制），4个车轮后方向下喷口实现垂直升起， 前端左右各1个提供横向推力，可实现原地起飞翻转。最关键部件为COPV复合材料缠绕压力容器， 外层碳纤维承力、内层薄金属内衬密封，顶配版600升储存250公斤空气，充满需6-7小时，目标优 化至30分钟。 Q6：风扇负压吸附系统的原理与效果如何？ 答：由4台电动涵道风扇（每台20千瓦、合计80千瓦）和底盘可伸缩密封裙摆组成，与路面形成密 闭空间后抽气形成低压区，大气压形成等效下压力。该系统不依赖速度，静止即可产生大下压力，发布 会演示产生4.7吨压力，足以支撑1-2吨车辆倒挂行驶；过弯抓地力可从轮胎极限约1.26G突破至 2G。专利显示有三套方案：单一封闭低压腔、中央裙摆分左右独立分区、车底多区域精细化动态控 制，裙摆高度可调以适应赛道、过弯、日常及坑洼路段。 Q7：Roadster产业链投资应关注哪些方向与标的？ 答：按过去汽车产业投资逻辑，应选择单方面价值量较高的赛道，更多在空气压缩的储气罐、储气管路 方面，相关标的包括中鼎股份、宝龙科技等；整体推荐拓普集团、华谊科技，建议关注宝龙科技、中鼎 股份、金盛电子、万丰奥威等。 Q8：OpenAI入局人形机器人有何影响？ 答：OpenAICEO奥特曼明确表态推进人形机器人，官网挂出二十多个相关岗位，涵盖执行器、电 机、传感、数据采集制造等，并给出2027年首次演示时间表。大模型公司布局有望降低任务编程与训 练成本，推动机器人从固定动作执行向理解指令、适应环境、完成连续任务发展，扩大商业化场景；同 时强化数据与场景价值，通用模型成熟后企业差距更取决于真实作业数据及软硬件协同能力，掌握高质 量数据及应用场景的厂商有望形成持续迭代优势，建议重点关注数据采集环节。 Q9：特斯拉机器人当前进展与瓶颈如何？ 答：特斯拉海外团队来国内供应商进行生产对接；周产从年初几十台提升至近期几百台，年底维持周产 1000台以上目标。瓶颈在于尚未大规模量产、仍以人工装配为主，触觉传感器、电机等零部件存在一 致性或可靠性问题，影响良率；但后续随供应链配合、技术迭代及V4版本发布，看好量产进度加速。 国产宇树、乐聚、智元等也不断推出新品、量产交付加速。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q10：具身智能数据采集的难点与壁垒是什么？ 答：难点包括需覆盖多模态数据、时空对齐和物理精确度要求高、面临海量场景；两大难题是数据规模 小（当前高质量数据集约几十万到百万小时，中局阶段或需亿级以上甚至百亿小时）和采集成本高（采 集8小时有效数据仅2-3小时），另有质量标准缺失。与数字AI、自动驾驶相比具身智能数据更稀 缺。核心壁垒：数据配比（真机、无本体、仿真比例需探索）和数据管线建设（清洗、筛选、标注、增 强、入库、训练等）。 Q11：华谊科技在数据采集环节的产品与订单情况如何？ 答：华谊科技主要提供IMU，用于遥操套件、物手持夹爪、异构头戴式终端设备，真机套件每个节点 内置多颗IMU；5米和异构套件中IMU与摄像头协同，弥补纯视觉方案在遮挡及高速场景下的数据缺 失。公司今年7月5日已表示与蜜蜂科技达成批量合作，9月7日业绩说明会表示IMU产能可充分覆 盖需求。头戴设备一般配1个IMU，两个夹爪对应2个IMU，单个IMU价值量约几百元；测算到 2029年国内加海外数据相关IMU订单收入预计可突破百亿元体量。 Q12：具身智能模型架构各厂商有何差异化创新？ 答：早期为分散模块化结构，泛化性差，后采用VLA模型和世界模型并融合为世界动作模型 （WAM）。差异化创新：智元解决语义与运动鸿沟（2025年3月G0one、2026年4月G02动作供 应链架构）；银河通用提升数据规模化特征（2020年4月升级版WIM，加入低质量数据性能不降反 升）；阿里和宇树解决上半身操作与下半身移动割裂；派解决长时间难题（今年3月MAM机制，可 完成15分钟级长线复杂任务）。场景上智元、优必选偏工厂，银河通用偏零售家庭，星海图偏物流履 约，宇树偏家庭服务。 Q13：米氏集团自由现金流下滑的原因及全年分红展望如何？ 答：上半年自由现金流2.8亿元，全年目标有望提升至10亿元。下滑原因：一是上半年原材料涨价， 公司通过签长单、补库存、预付款锁定成本，维持H1毛利率同比增长；二是接了较多远期订单，需做 全球性capex（欧洲、北美扩产），2026-2027年capex平均稳定在25亿元。下半年原材料价格波 动不明显，可通过降库存提升现金流。全年10亿自由现金流结合2026年双位数增长和30%以上分红 率，足以保证30%分红，不必担忧。 Q14：米氏集团电池盒业务毛利率与增长前景如何？ 答：电池盒业务有望稳健保持20%-30%增速，来自欧洲大众、宝马、Stellantis订单及欧洲电动化成 长。上半年毛利率降低因公司与下游客户对铝价做联动、价格调整滞后约一个季度；原材料价格稳定 后，电池盒BU有望维持23%-25%的中长期毛利率，在同行中处于较高水平。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q15：米氏集团AI算力液冷与人形机器人业务进展如何？ 答：AI算力液冷方面，公司具中国台湾背景，易与中国台湾AI服务器液冷ODM厂家建立关系，已切 入北美AI算力产业链，后续布局CDU、minifood等新产品，今年收入目标3亿元、明年指引15亿 元。人形机器人方面，2026年收入指引5亿元、明年10亿元，来自与国内头部机器人主机厂配套 （零部件配套、整机代工及海外代理销售），公司在关节总成、面罩、电子皮肤及配套零部件、整机代 工、海外代销等领域均有较多储备。此外SOFC业务与国内外头部客户打样并做金属部件。 Q16：9月乘用车销量及全年需求如何判断？ 答：9月零售161.8万辆同比下降28%，1-9月累计1333.4万辆同比下降21.7%；批发254.9万辆同 比下降9%；狭义乘用车出口91.7万辆同比增长73.7%。新能源9月零售108.4万辆同比下降 16.7%，1-9月累计777.5万辆同比下降12.8%；新能源出口9月55.8万辆再创新高，插混翻近两 倍、增程翻近五倍，累计388.7万辆同比增长138.8%。内需低于预期主因去年需求大促及抢装补贴透 支。按强险口径今年乘用车零售约1900-1950万辆，同比下降不到20%；全年新能源约1100万辆甚 至不到，强险渗透率约55%-60%。今年需求已达历史最底部，后续降幅会缩窄，12月前后大幅缩窄 有可能。 Q17：汽车行业后续利好与风险如何看？ 答：短期三个利好：内需边际向好（10月下半旬至11月基数走低，零售增速逐渐收窄）、政策担忧缓 解（12月欧盟公示IA法案，汽车消费税明年上半年甚至下半年才落地且有缓冲期）、锂价较高点大幅 回落（碳酸锂对纯电车单车成本影响约3000元，车企盈利有望释放）。长期稍偏空，因政策相对不积 极；明年因2028年购置税退坡五个点、补贴可能取消及消费税等，大概率是冲量年，今年1900万辆 基础上明年预计2000-2100万辆。出口维持高增长可能性几乎不可能，欧盟配额政策或使对欧盟插混 出口上限从100万辆降至40万辆，明年出口或降速但内需可能较好。反弹若出现最晚局限于明年上半 年。 原文 汽车月度汇报：特斯拉Roadster技术产业链梳理2026_原文 2026年10月22日 发言人 Pleaseremainontheline. wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 发言人 感谢大家参加本次会议，会议即将开始，请稍后。Thanksfor.大家好，欢迎参加财通汽车汽车月度汇 报，特斯拉modest技术and产业链梳理。目前所有参会者均处于静音状态，下面开始播报声明，本 次会议仅面向财通证券的受邀嘉宾。在任何情况下，财通证券研究人员及演讲嘉宾所表述的意见并不构 成对任何人的投资建议。投资者应充分了解各类投资风险，自主作出决策，并自行承担投资风险。未经 财通证券及演讲嘉宾书面授权许可，任何机构和个人不得以任何形式转发、复制、引用会议的内容与观 点，包括不得制作镜像及指向链接，不得传播音频视频图片、文字等内容。如有上述行为，财 on stock effective January 2027 and a 1x Class C stock dividend for existing shareholders. •On the call, we’ll be focused on: 1) The Muse Moment: adoption, usage, and vision; 2) Product vision with Muse, Wonder Models, and Enterprise; 3) Meta’s compute outlook & priorities; 4) R&R benefits from Meta’s LLMs; and 5) View into 2027 OpEx & CapEx. •Overall Results—Revenue & OI Above: Revenue of $64.6 billion (+26.1% Y/Y, +26.3% Y/Y ex-FX) came in ~2% above consensus. Operating income of $13.0 billion (20.1% margin) would have been $22.8B excluding the legal charge, ~13% above consensus and Diluted EPS of $7.40 (ex-legal) compares to consensus of $6.53. Reported GAAP EPS came in at $3.83, inclusive of the $9.9B legal charge. •Family of Apps: Revenue Above & Profitability Above: Family of Apps DAPs of 3.64 billion (+2.8% Y/Y, +1.1% Q/Q) came in line with our projection, revenue of $64.2 billion (+26.4% Y/Y) was ~2% above our projection, led by +26.1% Y/Y advertising ex-FX growth, while Family of Apps OI of $17.1 billion (26.7% margin) compares to our $16.2 billion projection (25.6% margin). •Reality Labs: Operating Losses Better than Expected: Reality Labs revenue of $443 million (-5.7% Y/Y) came in ~17% below our projection, though RL Operating Losses of ~$(4.1) billion compares to our $(5.1) billion projection. Buy Catalyst Watch: Upside, expires 15-DEC-26 Price (21 Oct 26 16:00) US$697.52 Target price US$895.00 Expected share price return28.3% Expected dividend yield 0.3% Expected total return 28.6% Market Cap US$1,776,937M Ronald JoseyAC +1-212-816-4545 ronald.josey@citi.com Jamesmichael Sherman-Lewis +1-415-627-6014 jamesmichael.shermanlewis@citi.com Jake Hallac, CFA +1-212-816-2001 jake.hallac@citi.com Meta Platforms Inc (META.O) 21 October 2026 Citi Research 2•Guidance: 4Q Revenue Guide Above Expectations: Meta’s 4Q revenue guidance range of $73-$76B (+21.9%-26.9% Y/Y, +22.9%-27.9% Y/Y ex-FX) was ~1% above consensus at the midpoint on continued R&R model benefits and assumes a ~1pt FX headwind. •2026 CapEx Guide Narrowed & Expense Guide Maintained (Including Legal Charge): Meta narrowed 2026 CapEx guidance to a range of $135-$145B (from $130B-$145B), ~2.5% below our projection at the midpoint. Meta maintained 2026 Expense guidance of $175-$179B (when including the $9.9B legal charge from 08/26), +50% Y/Y at the midpoint and ~1% above our projections at the midpoint. •2027 Guidance: Meta guided to expected ‘strong overall revenue growth throughout 2027’ and expects Reality Labs losses to narrow to ~$15 billion by reallocating investment toward priority areas (primarily AI). Figure 1. META 3Q26 Results vs. Projections © 2026 Citigroup Inc. No redistribution without Citigroup's written permission. Source: Citi Research, Company Reports Meta Platforms Inc (META.O) 21 October 2026 Citi Research 3Meta Platforms Inc Valuation Our target price of $895 is based on ~27x our 2027E GAAP EPS of $32.86 and implies ~13x our 2027E EV/EBITDA. We justify our valuation methodology based on Meta’s user scale, growing engagement, product super cycle and AI opportunity, ads innovation, and revenue growth, and we’re watching investments and overall profitability. Our multiple reflects greater visibility into Meta’s multiple levers for compute monetization (including Muse & Meta Enterprise Platform), even as we raise expenses to reflect growing compute needs. Risks Risks to our target price include: 1) Impacts from changes to ATT and IDFA could prove more difficult to overcome and structurally impact Meta’s advertising business; 2) Online advertising spend could decelerate faster than we anticipate; 3) Competition could prove to be more impactful than we anticipate; 4) Meta may not be able to achieve meaningful contributions from its investments in non-advertising businesses (metaverse). 5) Adverse economic and/or consumer spending trends could hinder advertising spend; and 6) Regulatory pressures on anti-trust, data, and privacy practices could adve 辑，认为四季度是投资者忍受短期痛苦、静候市场出清并迎来岁末反弹的关键窗口。#文字观点", "publish_time": "2026-10-22 18:21", "tags": ["洪灏", "文字观点"]}, "post:2026-10-22T13-03:8e4a276f1513": {"id": "post:2026-10-22T13-03:8e4a276f1513", "kind": "post", "title": "2026-10-22 13:03", "source_label": "帖子正文", "excerpt": "📑【高盛香港午间综述】#交易台📊恒生指数-2.9%；恒生中国企业指数-3.1%", "content": "📑【高盛香港午间综述】#交易台📊恒生指数-2.9%；恒生中国企业指数-3.1%；恒生科技指数-4.6%；成交额 1275 亿港币 📈领跌幅度相对较小板块：医疗设备及服务板块下跌 0.3%，地产信托板块下跌 1.1%，电信服务板块下跌 1.2% 📉跌幅居前板块：软件与服务板块下跌 5.2%，半导体板块下跌 5.0%，汽车及零部件板块下跌 4.7% 📉恒生指数已经明确跌破关键的 23000 点关口，最新点位 22972 点，该点位在三季度大部分时间里间歇性提供支撑，跌破后触发新一轮技术性卖盘。 📉该指数今年以来累计下跌10.3%，表现显著弱于区域内其他市场。 📉日经指数今日下跌 2.0%，但年内收益仍为正；韩国综合股价指数下跌 3.0%，诱因是韩国央行释放偏鹰派表态。 📉在摩根士丹利除日本外亚洲指数整体走平的背景下，港股表现明显落后，受中概科技资产以及内地财政刺激预期降温的拖累。 📉南向资金抛售进一步加重市场压力，午盘前净流出规模接近 4 亿美元。 📰【新闻与个股变动】 📌阿里巴巴（9988）：股价最大跌幅达 6%，拖累恒生指数表现，电商监管再度受到审视，市场情绪承压。 📌联想（992）：股价最大跌幅 8.8%，跌至 8 月以来低点，公司 20 亿美元再融资计划引发市场担忧，当前市场对 AI 相关融资的敏感度有所抬升。 📌宁德时代（3750）：继昨日大跌 11.4% 之后，今日再度下跌 4.9%，特斯拉下调 2026 年资本开支预期拖累新能源车相关标的；另有消息称，该公司是深度求索 1000 亿元融资轮次的主要投资方之一。 📌腾讯（700）：有消息称，该公司属于深度求索 1000 亿元融资轮次里的大额投资方；另外，公司已经完成 18 亿美元以及 260 亿元人民币的高级债券发行。 💸【资金流向】 📊亚太交易台整体交易量相较过去 20 日均值提升 19%。 📊当日资金流向为 1.2 倍净卖出，长线资金占总流向的 78%，为 1.1 倍净卖出；对冲基金占总流向的 22%，为 1.6 倍净卖出。 📊板块层面，信息技术板块 1.3 倍净卖出、工业板块 1.2 倍净卖出、原材料板块 1.3 倍净卖出；医疗保健板块 1.1 倍净买入。 📊香港本地交易盘为 3.4 倍净卖出，仅消费板块存在买入，其余全部板块均出现卖出操作。#文字观点", "publish_time": "2026-10-22 13:03", "tags": ["交易台", "文字观点"]}, "attachment:files/光伏反内卷政策逐步体系化，供需改善渐行渐进(光伏行业)20261020.pdf": {"id": "attachment:files/光伏反内卷政策逐步体系化，供需改善渐行渐进(光伏行业)20261020.pdf", "kind": "attachment", "title": "光伏反内卷政策逐步体系化，供需改善渐行渐进(光伏行业)20261020", "source_label": "其他", "excerpt": "光伏反内卷政策逐步体系化，供需改善渐行渐进(光伏行 业)20261020 要点总结 1.核心结论与前期观点回顾 本篇为\"反内卷vs市场化出清\"系列深度报告第五篇，聚焦光伏反内卷政策的体系化梳理。上半年第四篇报告曾给出明确判断：三季度应能看到部分龙头光伏公司业绩转正，绝大多数公司三 季度业绩大幅减亏", "content": "光伏反内卷政策逐步体系化，供需改善渐行渐进(光伏行 业)20261020 要点总结 1.核心结论与前期观点回顾 本篇为\"反内卷vs市场化出清\"系列深度报告第五篇，聚焦光伏反内卷政策的体系化梳理。 上半年第四篇报告曾给出明确判断：三季度应能看到部分龙头光伏公司业绩转正，绝大多数公司三 季度业绩大幅减亏；理由包括高功率组件放量、需求略有回升、低价订单交付结束、高价订单开始 交付等。 截至目前判断基本正确，但存在局部偏差：需求略不及预期，导致二、三季度出货量压力较大，盈 利修复难度略高于预期；此前预计2-3家可能转正的公司中，最终能转正的约1-2家，部分接近转 正的公司未能实现。 当前核心观点不变：继续看好未来2-3个季度供需关系进一步改善，但修复不会特别陡峭——需求 端不强，供给端也未见强力的\"一刀切\"政策。 需求端预计明年二三季度看到同比好转，尤其是国内；供给端一系列政策逐步产生效果，龙头与二 线公司差距拉大，在供需两端边际好转过程中，行业未来2-3个季度逐步变好，报表端更多公司转 正，股票端或迎来机会。 2.供给端政策梳理：从自律到体系化 政策演进路径：2024年10月第一轮供给侧改革（当时称\"供给侧改革2.0\"）→2025年6月30日 /7月1日正式定名\"反内卷\"→2025年下半年收储→2026年一季度收储碰到一定困难、未继续执 行。 复盘认为：以民营企业为主的光伏行业，做\"一刀切\"式政策难度较大，必须通过多种政策手段\"包围 \"实现目的。 今年以来政策已高度体系化，包括：以价格法为代表的不得低于成本价销售、以成本核算通则为代 表的成本监测手段、能效指标等，最终指向价格均衡、价格上升及尾部产能出清。 3.价格底线：价格法提供法律依据 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2025年首次提出价格法修订草案，亮点包括：对关乎国计民生的重要商品，必要时可开展成本调 查；明确成本价格资料范围，包括成本监审、以成本加资料核定；企业不提供资料将有相应措施。 修订稿虽未形成正式稿，但为7-8月工信、发改对企业开展成本调查提供了法律依据，企业相对愿 意接受。 4.成本核算通则：政策抓手与均衡价格测算 7-8月出台的成本核算通则条款非常细致，配套详细表格，要求产业链各环节公司填报，明确主材 成本、基地成本与企业成本如何划分、如何转接。 测算结论（以硅料为例）： 若以基地为全成本口径（不开的基地不计折旧），最优决策是把开工率拉至无限高，行业供需均衡 价格为全成本曲线与当前需求交汇处，不含税约40元出头； 若以企业为全成本口径（闲置产能全部计入），均衡价格不含税约47元； 当前报价/成交价含税约40-43元，远未达到上述两种口径下的均衡价格，说明执行尚未完全落 地，需进一步与企业商讨。 若落到组件环节，无论基地还是企业口径，全成本应在0.8元以上，目前仍未达到。 5.能耗与能效标准：产能淘汰测算 国标与团标（行标）基本接近：多晶硅有标准煤综合能耗限制，硅片同样以能耗限制；组件方面国 标限定最低转换效率23.2%，行标为23.4%。 整体判断可去除约15%-30%的产能。 关键点：根据功率曲线测算，若按23.2%效率要求，可淘汰近2/3的电池片/电池组件产能——能 满足23.2%的电池组件约300-400GW，剩余约600-700GW面临淘汰。 但腰部企业数量众多，约300GW产能距23.2%非常接近，稍作努力（镀膜做好一点、栅线做粗一 点、浆料用好一点）即可接近该水平，因此此前判断该政策顶多淘汰尾部1/3产能、甚至更少。 6.光伏制造规范2026年征求意见：超预期点 上周五光伏制造规范2026年开始征求意见，超预期之处在于对组件改扩建的效率要求提升至24% （原文转写为\"2.2%14\"，结合上下文应为24%）。 扩建当前不现实（国家不批），但从改造角度看：23.2%努力可达，而23.2%到24%这0.8个百分 点的提升，需投入约2000万-4000万元（无论选择多分片、半片多分、背面等方案），对一家几 百亿规模的企业而言是2-4亿元投入。 结合光伏公司财务状况，这进一步加大了产能提效难度。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 两项手段结合：达不到23.2%则在国内分布式、工商业、地面电站均不能销售；想改造则须达到 24%。判断电池组件尾部产能淘汰比例将更大，2027年1月1日执行后尾部产能将明显出清。 其他配套政策：光伏组件铭牌标准，要求每块组件打铭牌标明功率和效率，防止作假等。 总结：虽无\"一刀切\"政策，但政策组合拳叠加，明年1月1日执行后产能收缩30%甚至更多的概率 较大。 7.需求端：今年下滑明显，明年有望修复 今年1-8月需求下滑幅度较大：国内下滑30%-40%，全球下滑10%几，海外相对稳定。 国内滑坡原因：市场化交易后收益率下降；五大六小为保证发电量进入机制电量、保证整体收益 率，机制电价报价非常低，导致收益率显得很差；去年政策刚出后相当长一段时间很多省份机制电 量不明确、无法测算，影响装机热情。 改善迹象：今年各省二批、三批机制电价有所上升；部分企业放弃量、选择更少的机制电量以保机 制电价；机制电量本身难以百分百保证（涉及各时段能否充分上网、弃风弃光率等）。 其他积极因素：储能装多后峰谷价差有所缩小（储能装机不及预期是另一话题）；系统运行费用等 问题若解决、储能继续装多，将提升光伏消纳能力；西北地区输送通道继续建设；明年下半年\"十五 五\"启动后五大六小规划加速。 判断：2027年国内光伏装机将从\"特别大的坑\"中走出，但并非电价大拐点或电力过剩大拐点；明年 内外需求大概均增长10%左右，组件需求可能上升至600GW以上（今年不到600GW）。 8.产业节奏与业绩判断 二季度业绩承压后，三季度预期略有调低：金科一季度亏6分钱、二季度亏约1毛，亏损较多；隆 基一季度亏0.15元、二季度因低价订单交付多而明确修复。 金科科技已发业绩预告，亏损1亿-5亿元左右，较上半年整体亏损幅度大幅收窄。 四季度预计小幅下滑：国内装机占比高，四季度组件公司国内出货量上升、毛利率承压（每年如 此）；叠加四季度通常有减值（老产能、高功率组件替代、需求下滑带来的减值风险）。 2027年二三季度后，供需关系改善、龙头阿尔法突显（仅少量公司能做出较高功率组件），明年 这些公司转正幅度可能较大。 节奏总结：短期一个季度看涨价能否被下游接受；中期两个季度（明年1-3月）看尾部产能能否被 三项强制性标准及光伏制造规范淘汰；中长期（2027年下半年至2028年）看需求边际修复与供需 关系进一步改善。 9.财务压力与悲观情景假设 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 构建指标：现金及等价物－短期借款－一年内到期的长期债务。龙头中该数值真正为正的仅少数几 家，尾部公司绝大多数为负，既反映经营困难，也反映有无资金做提效升级——这是周期底部功率 曲线变陡、产品差距拉大的重要原因。 历史参照：钢铁、电解铝、房地产在2012-2013年均经历出清——钢铁、电解铝通过压降产能指 标\"一刀切\"，地产与多晶硅则通过债务层面出问题后行业才进入出清。 光伏以民营企业为主，政策未出情况下只能观察债务压力：上述指标2026年以来恶化非常厉害 （该指标维护的公司多、时间长，2023年起持续维护），银行此前一直不抽贷（避免完全坏账、 企业尚有现金流），抽贷动力不强，但今年以来压力快速加大。 核心原因：一年内到期的长期债务快速上升，主要来自2022-2023年上一轮上行周期大扩产所借 项目贷。项目贷与经营贷不同，没有展期一说；信用贷一旦展期将严重影响企业征信，后续流贷可 能借不到；银行也可能做结构性调整（增加流贷等）保证债务规模不变，需进一步观察。 这也是过去一年左右更多龙头公司进行名股实债式子公司融资的原因。 最差情景假设：政策完全无效、需求长期不振，则2028-2029年龙头公司转债到期为最差时点。 但个人更相信第一种情景——需求略好转、供给侧政策有效、龙头2027年盈利逐步修复、尾部公 司因准入性政策（能效能耗改造不达标或无资金改造）被淘汰。 10.股票节奏与估值判断 当前板块关注度非常低、位置非常低。节奏判断：三季度业绩出来前可提前布局，业绩修复较好可 兑现一波；四季度一般；二三季度行业进入进一步上行通道时股价可能有进一步反应，整体节奏不 变。 盈利与估值：明年较多龙头公司有望转正，2028年很多公司进入正盈利状态。合理回报率一般约 3-5分钱；特别好的（高功率ABC组件、TOPCon3.0、金科类TAC等）可再加几分钱溢价，赚到 6-8分钱。 对应很多公司可有20亿、40亿甚至60亿元利润（按不同出货量等级），给予15-20倍估值，即 使按15倍，从当前板块位置看弹性仍足够大，1-2年或有翻倍以上弹性。 提示：上述为线性外推，当前市场环境下很少有人有耐心持有1-2年，建议在关键节点介入、把握 节奏。 问答整理 Q1：三季度光伏公司业绩转正的判断是否仍然成立？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：基本成立但略有偏差。此前预计2-3家公司可能转正，最终能转正的约1-2家，部分接近转正的 公司未能实现；但\"绝大多数公司三季度大幅减亏\"的结论没有太大问题。需求略不及预期导致出货压力 较大，盈利修复比想象中难一点。 Q2：供给端政策没有\"一刀切\"，如何实现产能出清？ 答：光伏以民营企业为主，一刀切政策难度大，因此政策走向体系化：价格法提供不得低于成本价销售 的法律依据，成本核算通则提供成本监测抓手，能耗能效标准与光伏制造规范2026年征求意见稿形成 准入约束，再叠加组件铭牌标准等配套政策。政策组合拳下，明年1月1日执行后产能收缩30%甚至 更多的概率较大。 Q3：成本核算通则落地后，均衡价格能到什么水平？ 答：以硅料为例，若以基地为全成本口径（闲置基地不计折旧），均衡价格不含税约40元出头；若以 企业为全成本口径，均衡价格不含税约47元。当前成交价含税约40-43元，远未达到上述水平，说明 执行尚未完全落地。组件环节无论哪种口径，全成本应在0.8元以上，目前也未达到。 Q4：能效标准23.2%的淘汰效果如何？光伏制造规范要求24%有何影响？ 答：单看23.2%，按功率曲线可淘汰近2/3电池组件产能，但腰部约300GW产能距23.2%很近、稍 作努力即可达标，因此此前判断顶多淘汰尾部1/3甚至更少。制造规范2026年征求意见稿将改扩建效 率要求提至24%，从23.2%到24%需投入2000万-4000万元（几百亿规模企业对应2-4亿元），结 合行业财务状况，提效难度大。两项结合，尾部产能淘汰比例会更大。 Q5：国内需求今年下滑30%-40%，明年如何看？ 答：今年下滑原因包括市场化交易后收益率下降、五大六小为保机制电量报出极低机制电价、部分省份 机制电量不明确等。改善因素包括各省二批三批机制电价上升、储能装多后峰谷价差缩小、系统运行费 用问题逐步解决、西北输送通道建设、\"十五五\"规划明年下半年加速启动等。判断2027年国内装机从 大坑中走出，但并非电价或电力过剩的大拐点；明年内外需求大概均增长10%左右，组件需求可能升 至600GW以上。 Q6：四季度业绩是否会环比下滑？ 答：预计四季度小幅下滑。一是国内装机占比高，四季度组件公司国内出货量上升、毛利率承压，每年 如此；二是四季度通常有减值，老产能面临高功率组件替代和需求下滑带来的减值风险。 Q7：行业最悲观的情景是什么？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：最差情景是政策完全无效、需求长期不振，则2028-2029年龙头公司转债到期为最差时点。观察 指标为\"现金及等价物－短期借款－一年内到期的长期债务\"，该指标2026年以来恶化非常厉害，核心 是一年内到期长期债务快速上升（2022-2023年扩产所借项目贷，项目贷无展期一说）。但个人更相 信需求略好转、供给侧政策有效、龙头2027年盈利逐步修复、尾部公司因准入政策被淘汰的情景。 Q8：当前股票如何看，估值弹性多大？ 答：当前关注度和位置都非常低。节奏上，三季度业绩出来前可提前布局，业绩修复较好可兑现一波； 四季度一般；明年二三季度行业进入上行通道时股价可能进一步反应。盈利上，2028年很多公司进入 正盈利，合理回报率一般3-5分钱，高功率产品可加几分钱溢价至6-8分钱，对应20亿、40亿甚至 60亿元利润，给15-20倍估值，即使15倍，1-2年也有翻倍以上弹性。但这是线性外推，建议在关 键节点介入、把握节奏。 原文 光伏反内卷政策逐步体系化，供需改善渐行渐进-反内卷vs市场化出清（5）深度报告20261020_原 文 2026年10月21日 发言人 然后我们今天的这个会议的重点，还是围绕着这个光伏反逆转政策这样的一个话题。其实大家能看到最 近的这个行业端其实也出了一系列的政策。我们希望在今天下午系统梳理一下我们反对卷与市场化复兴 的这个系列深度报告的第五天。请郑宇老师来给大家讲一下我们的这个主要观点。下面有请郑宇这边好 的，谢谢云老师。 发言人 各位投资人，大家下午好。感谢大家接入我们的电话会议。我们这个反正卷以及市场化出清的这个系列 已经发到了第五篇。过去2到3年的这个时间，在行业周期持续下行的这个状态之下，我们也通过各种 各样的方式去跟踪和思考以及推演这个行业会有一个什么样的一个变化。在今天这个电话会议开始的这 个开头，我想先简单回顾一下我们之前的这么一个观点，以及我们把结论放在前面，当下的核心观点是 什么。在上半年的这个时候，我觉得应该我是发了第四篇的法律转移及上华出清。 发言人 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u 正加剧价格竞争，公司难以将质量优势完全转化为溢价。 • 税收负担的缓冲机制：若终端售价无法完全转嫁新增的2%消费税与退税削减，短期由单位毛利吸收；但大摩认为，通过规模化降本（如CTP/CTC结构优化、自产矿产线爬坡）与高镍/固态电池等高端产品占比回升，有望在未来4–6个季度内逐步对冲约一半的税收冲击，剩余部分构成永久性利润率台阶的下移。 • 我们的量化预期：预计4Q26单位净利小幅回升至0.085–0.09元/瓦时，2027年随储能出海（欧美高毛利项目）与神行/凝聚态电池放量，有望重返0.10元附近，但中期中枢较此前模型下修约8%–10%。 三、估值方法论与目标价调整逻辑 • 估值锚定：维持A股13倍2027年预期EV/EBITDA（对应约20倍2027年预期P/E），该倍数处于过去三年均值上方0.5个标准差，已隐含新一轮产品周期（凝聚态电池、储能系统集成）的溢价。H股目标倍数16倍，与LG新能源持平，隐含H/A目标价溢价20%。 • 目标价：A股目标价500元，较当前259.08元存在约93%的上行空间；该目标价较基于DCF的NAV折让35%，体现估值纪律。此次未因单季毛利波动而调整倍数，仅微调盈利预测，因长期产能利用率与自由现金流生成能力未遭破坏。 • 财务预测微调：2026–2028年预期营收分别为6077亿、7174亿、8736亿元（基本不变），但2026年EPS自21.04元小幅下修至约20.5元区间，2027年EPS自24.77元下修至约23.5元，对应2027年预期P/E约11倍，仍处于历史估值箱体下沿。 四、多空因素与风险监测 • 上行催化：欧洲储能需求超预期反弹；锂价进一步下跌释放成本空间；固态电池量产时点提前；海外本地化产能（匈牙利、印尼）获得政策补贴。 • 下行风险：国内储能招标价格跌破0.6元/Wh心理关口；美国IRA法案对中国产能的排他性细则超预期；碳酸锂价格反弹超30%侵蚀加工利润。 • 关键观测指标：月度装机份额变化、储能系统毛利率（而非仅电芯）、单位设备折旧变动、消费税实际转嫁率。 五、交易启示 维持“增持（Overweight）”评级及行业首选（Top Pick）地位，认为市场将过度反应单季毛利波动，而忽略其全球市占率稳固（1–9月国内动力份额仍超45%）、经营性现金流强劲（上半年超800亿元）及股息率有望升至4%–6%的防御属性。短期股价因盈利下修或承压至230–250元区间，但逢回调建立长仓是风险收益比占优的策略。相对而言，H股较A股折价收窄的交易机会更具吸引力（H/A溢价已升至约30%的历史高位）。#文字观点", "publish_time": "2026-10-22 20:14", "tags": ["文字观点"]}, "post:2026-10-22T11-39:3dc18098ad8c": {"id": "post:2026-10-22T11-39:3dc18098ad8c", "kind": "post", "title": "2026-10-22 11:39", "source_label": "帖子正文", "excerpt": "【特斯拉26Q3财报总结】亚太交付比例超预期，中国工厂就近配套毛利率改善 🚀产销情况： 【产量】46.44万辆，同比+4%，环比+3%，其中Model 3/Y 45.74万辆，其他车型0.70万辆 【销量】48.65万辆，同比-2%，环比+1%，其中Model 3/Y 47.82万辆，其他车型0.8", "content": "【特斯拉26Q3财报总结】亚太交付比例超预期，中国工厂就近配套毛利率改善 🚀产销情况： 【产量】46.44万辆，同比+4%，环比+3%，其中Model 3/Y 45.74万辆，其他车型0.70万辆 【销量】48.65万辆，同比-2%，环比+1%，其中Model 3/Y 47.82万辆，其他车型0.83万辆，#首次实现连续两个季度车辆交付量超过48万辆，Q3末公司创下四年来最高的订单积压量，正在大幅提升产量中 🚀财务情况： 【营收】280.46亿美元，同比-0.2%，环比-0.7%，#营收零增长主要系汽车和储能平均单价持续下滑 【EBIT】7.18亿美元，同比-56%，环比+80% 【GAAP盈利】净利润7.87亿美元，同比-43%，环比-29%；EPS：0.22美元（市场一致预期0.23美元），同比-44%，环比-31%，#SpaceX投资按市值计价约1.42亿美元负面影响，但比特币市值提升实现2.9亿美元收益抵消亏损 【non-GAAP盈利】净利润16.97亿美元，同比-4%，环比+47%；EPS：0.48美元（市场一致预期0.45美元），同比-4%，环比+45% 【汽车业务毛利率】18.5%，同比+1.5pct，环比+1 技术成熟，传统数据采集业务价值持续下滑。本体企业独立自研世界模型的算力投入压力极大，很难承担，因此和大模型企业强强联合是更合理的产业选择。4、头部企业综合实力成重要考量，3D 基础工具存在供给风险 优先关注空间智能方向新品进展，以及头部本体厂商的合作落地、融资能力。#文字观点", "publish_time": "2026-10-22 07:49", "tags": ["文字观点"]}, "post:2026-10-22T14-35:16f06889bb8f": {"id": "post:2026-10-22T14-35:16f06889bb8f", "kind": "post", "title": "2026-10-22 14:35", "source_label": "帖子正文", "excerpt": "【灿瑞科技】触觉芯片卡位，具身数据采集与灵巧手感知双轮驱动-东北计算机llq 1️⃣直击感知底层：数采设备的核心本质是采集力与力矩等多维触觉数据，#而底层支撑是感知芯片。#公司以三维磁性触觉传感器（单芯片XYZ三轴力同步检测、微型封装）切入，卡位“电子皮肤”与数采设备的核心价值点。", "content": "【灿瑞科技】触觉芯片卡位，具身数据采集与灵巧手感知双轮驱动-东北计算机llq 1️⃣直击感知底层：数采设备的核心本质是采集力与力矩等多维触觉数据，#而底层支撑是感知芯片。#公司以三维磁性触觉传感器（单芯片XYZ三轴力同步检测、微型封装）切入，卡位“电子皮肤”与数采设备的核心价值点。 2️⃣出货放量：#公司产品已在人形机器人灵巧手及数采指套/手套中量产出货。作为具身模型训练“卖铲人”核心，下游头部客户指引数倍增长，千万片级量产基地已全面启动。 3️⃣产品矩阵丰富：从触觉芯片到关节位置传感器，从指尖数采到全身电子皮肤，矩阵式产品延展路径清晰，成长空间全面打开。#文字观点", "publish_time": "2026-10-22 14:35", "tags": ["文字观点"]}, "post:2026-10-22T09-18:a170b341f024": {"id": "post:2026-10-22T09-18:a170b341f024", "kind": "post", "title": "2026-10-22 09:18", "source_label": "帖子正文", "excerpt": "#超预期！特斯拉26Q3电话会机器人part速记#机器人ETF鹏华【159278】#明确量产、量纲、V3发布节点及场景、明年底周产2万台 1、#1-2月后V3演示:预计未来1-2个月发布新的Optimus演示视频，展示非预先编程固定动作的任务 2、#量产启动明年末周产2万台:Optimus已在弗里蒙", "content": "#超预期！特斯拉26Q3电话会机器人part速记#机器人ETF鹏华【159278】#明确量产、量纲、V3发布节点及场景、明年底周产2万台 1、#1-2月后V3演示:预计未来1-2个月发布新的Optimus演示视频，展示非预先编程固定动作的任务 2、#量产启动明年末周产2万台:Optimus已在弗里蒙特的大规模产线上开始早期生产，达到周产2万台（年化百万台）需要一年或更久 3、#27年底对外交付:预计于27年底左右，AI、机电设计、可靠性和使用寿命等问题到届时得到解决 4、#首批场景聚焦工业:首批客户预计主要来自工业场景、优先用于危险、重复性、易造成重复性劳损及全天候工作，后续拓展家庭 5、需要制造约1-2万台机器人，用来获取训练数据并开展自主练习，同时AI架构本身仍需完善 6、计划于27年4月，将AI5芯片集成到Optimus，人形机器人需要处理的自由度和任务范围远超过汽车#文字观点", "publish_time": "2026-10-22 09:18", "tags": ["超预期", "机器人ETF鹏华【159278】", "1-2月后V3演示", "量产启动明年末周产2万台", "27年底对外交付", "首批场景聚焦工业", "文字观点"]}, "post:2026-10-22T20-08:ce51f8d8957a": {"id": "post:2026-10-22T20-08:ce51f8d8957a", "kind": "post", "title": "2026-10-22 20:08", "source_label": "帖子正文", "excerpt": "美银——亚洲宏观视角：AI出口热潮——溢出受益者图谱与政策应对路径 本轮由AI基础设施投资驱动的亚洲出口超级周期，对中国台湾地区、韩国与中国内地产生了显著分化的宏观溢出效应。中国台湾地区与韩国因科技产业占GDP比重高、产能瓶颈刚性且产出缺口为正，资本开支乘数效应最强，并传导至居民收入与财富效应", "content": "美银——亚洲宏观视角：AI出口热潮——溢出受益者图谱与政策应对路径 本轮由AI基础设施投资驱动的亚洲出口超级周期，对中国台湾地区、韩国与中国内地产生了显著分化的宏观溢出效应。中国台湾地区与韩国因科技产业占GDP比重高、产能瓶颈刚性且产出缺口为正，资本开支乘数效应最强，并传导至居民收入与财富效应；中国内地虽同样录得科技出口增长，但国内地产调整、地方财政约束与负产出缺口抵消了外需红利，整体溢出有限。政策层面因此走向分化：中国台湾地区与韩国面临再通胀压力，央行需继续加息；中国央行则按兵不动并预留进一步宽松空间。核心风险在于，科技集中度是一把双刃剑——中国台湾地区与韩国对AI资本开支、奖金分红与股市财富的依赖度越高，未来若全球科技周期转向，其调整幅度也将最深。 一、资本开支溢出：中国台湾地区与韩国显著占优，中国内地仅体现为产能利用率修复 • 冲击规模差异：以半导体及ICT产品出口占名义GDP比重衡量，AI相关出口相当于中国台湾地区GDP的约67%、韩国的20%，而中国内地仅约5%。这意味着同样的外部需求冲击，在中国台湾地区与韩国足以拉动整体投资，在中国内地则易被庞大且多元化的经济体量稀释。 • 产能约束驱动扩产：中国台湾地区与韩国的出口集中在先进半导体等供给刚性环节，台积电、三星电子与SK海力士等企业指引显示，现有产能无法仅靠提满负荷满足需求，必须新增设备与厂房。我们预测三星与SK海力士2026年资本开支合计增长63%、2027年再增26%，台积电2027年资本开支亦将增长29%。 • 中国内地的不同路径：中国内地计算机、通信及电子设备制造业产能利用率在2026年二季度升至78.7%，高于整体制造业的73.5%，表明强劲的科技出口主要吸收了闲置产能，而非触发大规模扩产。在地产投资下滑、基建受制于地方城投流动性压力的背景下，AI带来的投资拉动被宏观逆风大幅对冲。 二、居民与消费溢出：财富效应高度集中，中国内地内需仍受资产负债表拖累 • 就业与收入传导狭窄：电子相关制造业就业占中国台湾地区总就业约11%，韩国约3%，中国内地仅1.8%。且利润向普通工资的传导有限，主要体现为一次性奖金与利润分享——台积电2025年员工分红池翻倍至2060亿新台币，SK海力士与三星半导体核心员工人均奖金可达数十万美元，但覆盖面窄，对整体居民收入拉动有限。 • 股市财富效应分化：截至2026年10月初，中国台湾地区加权指数年内涨幅约70%，韩国KOSPI涨约60%，而上证综指下跌约3%。中国台湾地区家庭金融资产中约28%配置于本地证券，财富效应显著；中国内地家庭资产中房产占比高，房价连续四年回落，叠加存款利率与理财收益下行，居民资产负债表修复缓慢，消费复苏基础脆弱。 • 零售数据印证：中国台湾地区8个月平均零售销售同比接近8%，韩国约4%，中国内地不足1%，清晰反映出科技繁荣在国内需求端的传导落差。 三、政策分化：中国台湾地区与韩国“收水”，中国内地“维稳+结构性宽松” • 财政反应：三地出口超预期均带来税收红利。中国台湾地区拟推出每人1万新台币的“AI红利”现金发放；韩国将企业税增收转化为科技与基建投资及定向家庭支持；中国内地前8个月公共预算收入虽转正（+5.7%），但增量主要集中在上层中央财政，土地出让收入持续拖累地方支出，且部分税收增长源于征管强化与出口退税削减，实际财政立场偏紧，与“更加积极”的定调形成反差。 • 货币政策路径： ◦ 韩国：已加息至3.0%，因核心CPI达2.7%、产出缺口转正，我们预计11月与明年2月各再加25个基点，终端利率至3.5%。 ◦ 中国台湾地区：央行自2024年起未跟随全球降息，当前政策利率2%，但鉴于溢出效应扩散，预计12月将加息12.5个基点至2.125%。 ◦ 中国内地：出口红利未引发过热，人民银行无需紧缩，近期通过PSL利率下调与按揭补贴等定向工具托底，但若出口增速出现实质性失速，我们预期将转向更大力度的降息与财政协同宽松。 四、核心风险评估：科技集中度风险与不对称敞口 • 中国台湾地区与韩国：当前资本开支、奖金、股市财富与财政收入高度绑定AI周期。一旦全球AI资本开支放缓，上述循环可能快速逆转，中国台湾地区因溢出面最广而风险敞口最大，韩国财政对半导体利润的依赖度上升亦削弱稳定性。 • 中国内地：多元化经济结构与较低的家庭科技股权暴露限制了直接反转风险，但若出口增速大幅下滑，将失去对内需疲弱的重要对冲，倒逼政策更大幅度放松。 • 基准判断：产能瓶颈与芯片定价韧性支撑AI上行周期尚未见顶，但投资者需警惕“溢出越强、反转时调整越深”的非线性风险，尤其在中国台湾地区与韩国资产中。 交易与配置启示 • 短期看好中国台湾地区与韩国科技产业链的资本开支景气度，但建议通过衍生工具对冲周期反转风险； • 中国内地资产方面，AI出口带来的制造端利用率修复利好电子制造与设备环节，但消费与宏观杠杆板块仍需等待地产企稳与财政实质发力信号； • 政策交易主线：做多韩国与中国台湾地区利率上行曲线，同时布局中国内地政策宽松预期的久期资产。#文字观点", "publish_time": "2026-10-22 20:08", "tags": ["文字观点"]}, "attachment:files/春风动力2026年三季报业绩交流会20261020.pdf": {"id": "attachment:files/春风动力2026年三季报业绩交流会20261020.pdf", "kind": "attachment", "title": "春风动力2026年三季报业绩交流会20261020", "source_label": "其他", "excerpt": "春风动力2026年三季报业绩交流会20261020 要点总结 1.整体经营业绩 2026年前三季度累计实现营业收入209.42亿元，同比增长40.59%；累计实现归母净利润20.21 亿元，同比增长42.78%。", "content": "春风动力2026年三季报业绩交流会20261020 要点总结 1.整体经营业绩 2026年前三季度累计实现营业收入209.42亿元，同比增长40.59%；累计实现归母净利润20.21 亿元，同比增长42.78%。 三季度单季营收75.56亿元，同比增长49.9%；归母净利润9.56亿元，同比增长131.27%，环比 二季度增长48.96%。 利润大幅提升主要受益于关税退税落地，以及产品结构优化、规模化释放盈利能力。 前三季度归母净利润首次突破20亿元。 2.关税退税的财务拆解 累计披露退税税后金额4.37亿元（已扣除美国企业所得税等税费），对归母净利润产生影响。 其中Q2影响约3900万元（不到4000万元），Q3影响约3.98亿至4亿元。 同口径剔除退税后：Q2约6.03亿元，Q3约5.59亿元；Q3剔除退税后利润同比增长35.09%。 环比看，Q3收入环比下降5.87%，剔除退税后利润环比下降7.35%，收入波动与历史正常波动基 本相似。 报表处理：关税退税按中国企业会计准则谨慎处理，作为营收/营业成本的减项（冲减营业成本）， 同时基于谨慎原则作为非经常性事项，导致扣非与非经常性损益之间存在较大差异（差异即上述 4.37亿元）。 税前口径：6.2亿元税前税收返还中，Q3冲减营业成本约五千多万元（按美国税率约30%折 算）。 3.分业务板块经营情况 全地形车：前三季度累计销量20.26万台，营收112.28亿元，同比增长59.19%；Q3销量首次突 破20万台、收入突破百亿。北美、欧洲核心市场新品投放与业务拓展显现成效，高端车型优势明 显，U10Pro持续放量，产品结构进一步优化。 燃油摩托车：前三季度累计销量31.23万台，营收61.36亿元，同比增长26.01%。其中内销销量 15.81万台，营收26.53亿元，同比增长11.29%；外销销量15.42万台，营收34.83亿元，同比 增长40.13%。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 电动两轮车（极核）：前三季度累计销量56.67万台，营收19.34亿元，同比增长24.62%。 4.毛利率与成本分析 同口径（扣除退税）Q3环比Q2总毛利率上升约0.6个百分点，主要因四轮、两轮、电动两轮产品 结构变化，四轮占比更高。 分板块环比：四轮因外销占比高、受汇率影响更大，环比下滑约0.7个百分点；两轮环比下降约 1.4个百分点（外销占比仍有影响，内销有所抵冲）；极核因以内销为主，环比略有上升。 汇率对整体毛利率波动影响约1个百分点。 利润环比下滑的三项核心原因：①三季度人民币持续升值带来汇兑损失（Q3与Q2汇兑损失相近， Q1汇兑损失最大）；②车辆平台仪表、车联网系统所需电子料（含存储芯片）成本上升；③海运 费影响（有2-3个月滞后，Q3表现尚不明显，墨西哥工厂CKD起到缓冲作用）。 5.费用与库存清理 Q3销售费用较高，主要因美国市场大型活动费用，以及针对26款库存的清理促销。 26款库存清理为年款切换时的常规动作，力度取决于贴息利率（美国加息后利率偏高，费用相对更 高）；清理效果好于预期，8月下旬起27款铺货顺利，为明年销售打下基础。 美国市场8、9月及10月零售表现超预期，同比均有上升。 6.产能布局（墨西哥、泰国） 墨西哥CKD工厂Q3月均产能突破3000台；CSM（墨西哥成品组装）Q3月均产量突破4000 台。 泰国工厂主要承接CKD，租赁及场地相对便利；墨西哥CSM成本较高，但CKD方向可规避海运 费波动，战略意义提升。 两个基地原则上可满足美国市场需求，若美国市场有增量，中国基地可作为兜底。 产能爬坡取决于市场需求，生产效率内部持续挖潜。 泰国两轮车：正密集推进本土化确认及资质认证，第一步先保证美国两轮车交付（可能先由中国交 付），后续统一规划美国两轮车生产场地；泰国本地销售项目正加快确认，力争明年在东南亚（尤 其泰国）落地。 7.新产品与关税 U10Pro、V10系列Q3合计销量与Q2基本持平，均约两万多台（含非美市场）；其中U10Pro 约1.7万至1.8万台（不到1.8万），V10约3400至3600台。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 美国市场占比约为非美市场的两倍；U10Pro美国约1.3万多台，北美区域约7000台。 RUV新车型计划12月开始首批生产，争取年内或明年1月交付美国，收入主要体现在2027年一 季度；其供应链未完全本地化，毛利率预计介于U10Pro与V10之间。 新版ATV已陆续向美国交付，美国市场400-600排量段表现较好；下半年起美国ATV占比环比、 同比均将提升。 墨西哥、泰国工厂最新关税税率约15个点左右。 成本传导：电子料等成本上涨难以完全传导至终端，公司与供应商共同分担；美国市场今年已做部 分价格探讨，其他市场视机会调整。 8.电动两轮车（极核）3C认证事件与全年指引 9月下旬行业出现3C认证暂停/取消情况，属行业普遍性问题；公司涉及暂停的电子证书占比相对 较高，但绝对数量在行业内最小，风险相对可控。 公司已做最极端情形测算（相关车型全部暂停），整体风险可控；正积极申请恢复或重新申请，恢 复时间取决于监管机构审核结论。 已通知各销售网点暂停销售相关车型，消费者因无法上牌可全款退车，保障消费者权益；Q4为电 子淡季，电子生产受一定管控影响相对有限。 全年销量目标由原100万台下调至80万台以内（前三季度已完成56-57万台不到）；1-9月电子 占比不到20%。 极核渠道已增至3000多家，今年销量未达预期，盈亏平衡难以实现；公司将其定位为第三增长曲 线，坚持中长期战略投入，行业规范化后信心更强。 9.燃油摩托车国内与出口 国内玩乐类车型Q3因新品主要集中在上半年发布，环比有所下降；公司将继续巩固SS、CLC、 MT、ADV等多平线玩乐车型的国内第一方阵地位，后续推出电子离合版、电子油门版车型。 踏板车目前主要内销，Q3两个排量段（125/250）合计销量近3万台，与Q2差不多，销售达预 期；后续将选择性导入东南亚市场，更高排量踏板规划核心逻辑在外销。 出口方面，前三季度欧洲占出口销量近一半（略不到一半）。 产品战略上，未来资源更多投向出行两轮市场（国内及发展中国家），同时不放弃玩乐车型领导地 位。 10.汇率与对冲 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 人民币升值压力较大，公司通过扩大多币种区域结算（区域市场自行收款）对冲美元敞口；金融远 期锁汇因中美息差导致贴水较高，性价比不佳，仍以业务对冲为主。 问答整理 Q1：税收返还冲减营业成本用的是税前口径，Q2、Q3如何拆分？6.2亿元税前税收返还中有 多少冲减了Q3？ 答：按税前口径，Q3可按五千多万元理解。税后数据已披露，因缴的是美国税，按约30%税率折算即 可。 Q2：4亿多元税收返还中Q2的约4000万元，是Q2当时已计提，还是Q3回溯调整了Q2 报表？ 答：Q2本身已含近3900万元。Q2时因影响较小，仅做定性介绍未单独定量披露；本次因专项披露， 将Q2、Q3影响分别定量分析，全年口径最终会有详细披露。 Q3：Q3进行26款库存清理是基于什么环境变化？对美国终端需求如何展望？ 答：清理并不代表对美国市场没有信心。美国市场8、9月尤其9月零售表现非常超预期，为27款铺 货打下良好基础。公司希望经销商坚定信心：U10Pro上市、V10下半年逐步放量，12月至1月新 RUV车型也将上市；同时释放老款车型的贴心促销动作，尽快处理渠道端26款库存，使渠道轻装上阵 投入27款切换，对订单也是好事。 Q4：极核前三季度销量约56万台，全年销量目标如何？能否实现盈亏平衡？ 答：9月下旬行业出现3C认证暂停/取消的普遍性问题，公司涉及暂停的电子证书占比相对较高，但绝 对数量行业最小，风险可控，也欢迎行业监管提升合规性。全年目标原为100万台，目前完成56-57 万台不到，初步预计全年在80万台以内。极核今年渠道增至3000多家但销量未达预期，盈亏平衡很 难做到；但极核是冉冉升起的第三增长曲线，行业逐步规范后公司更有信心。 Q5：3C认证暂停的车型是通过改进可以恢复，还是需要重新申请？ 答：无论取消还是恢复，公司都认可监管机构要求，目前正积极申请恢复或重新申请，两者都需要时 间。何时恢复取决于机构审核结论，公司会坚定做好合规管理、产品一致性管理和检验管理，迎接再次 检查。 Q6：Q3毛利率受汇率和原材料成本拖累分别多大？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：扣除退税同口径环比看，Q3总毛利率环比上升约0.6个百分点，主要因四轮占比更高。分板块： 四轮环比下滑约0.7个百分点（外销占比高、汇率影响大）；两轮环比下降约1.4个百分点（内销有所 抵冲）；极核以内销为主环比略升。汇率对整体毛利率波动影响约1个百分点，成本等其他影响未做明 确量化。 Q7：墨西哥产能三季度出厂端（不含关税成本）毛利率环比、同比变化如何？ 答：墨西哥与泰国生产基本全部销往美国，与汇率相关性大。主要车型U10Pro、V10在北美/美国区 域环比总体有所下滑，主要是汇率影响。27款批发8月才开始（7月上旬仍在发26款），希望四季度 收入端调价有所体现；四季度海运费仍有扰动，但墨西哥工厂CKD组装可规避部分运费波动。同比因 汇率基数原因不便直接比较。 Q8：U10Pro、V10两大单品Q3及前三季度出货量、美国与非美占比及后续增长预期？ 答：Q3U10Pro与V10系列合计与Q2基本持平，均约两万多台（含非美市场）。Q3美国市场占比 约为非美市场的两倍。分拆看，U10Pro约1.7万至1.8万台（不到1.8万），V10约3400至3600 台；U10Pro中美国约1.3万多台，北美区域约7000台。 Q9：墨西哥产能三季度环比是否提升较多？ 答：是的。Q3墨西哥CKD月均产能已突破3000台，CSM月均产量突破4000台。 Q10：泰国两轮产线投产进度、后续产能规划及对美出货预期？ 答：泰国两轮正密集推进本土化确认。中国制造两轮出口美国存在各种问题，第一步先保证美国两轮车 销售，为保交付进度可能先在中国交付，后续统一规划美国两轮车生产场地（泰国具备生产能力）。泰 国本地销售正密集做前期项目及资质确认，力争明年尽快在东南亚尤其泰国落地。 Q11：150踏板海外导入节奏及250平台中南美市场放量情况？ 答：踏板车目前主要在国内销售，销售达预期，Q3两个排量段合计近3万台。导入东南亚会做取舍， 选择适合的车型，与明年东南亚区域探索销售相关联。墨西哥市场总体好于预期，但有其特殊性和波动 性，公司会重点关注并尽快解决运作中的问题，进一步打开市场。 Q12：明年墨西哥、泰国四轮车月产能展望及明年动销判断？ 答：泰国CKD产能布置相对CSM更简单（租赁场地便利）；CSM成本较高，但海运费波动提升了其 战略意义（CKD方向可规避运费波动）。两个基地原则上可满足美国市场需求，若有增量中国基地可 兜底。美国市场库存（在售及渠道）强监控，当前库存处于健康位置，8、9、10月零售稳健且同比上 升；产品迭代（U10Pro、V10、RUV、新版ATV）将持续加分，公司有信心。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q13：明年墨西哥、泰国月产能是否会爬至4000台以上甚至接近5000台？ 答：取决于市场需求，生产效率内部持续挖潜；若市场需求足够，公司会想尽办法解决。 Q14：RUV是否明年1月上市（较此前稍晚）？其他新品规划？ 答：新版ATV已陆续向美国交付；RUV保险起见1月交付，正常1月交付则12月就要开始生产。其 他新品（两轮、四轮、极核）涉及保密，敬请期待。 Q15：内销情况及前三季度踏板车销量占比/绝对值？ 答：两轮内销受国内竞争形势影响，新品发布集中在上半年（Q2增长较大），Q3新品较少致玩乐类 车型环比下降。公司将继续巩固国内玩乐类（SS、CLC、MT、ADV多平线）第一方阵地位，后续推出 电子离合版、电子油门版车型。踏板车Q3两个排量段（125/250）合计近3万台，与Q2差不多；前 三季度占比无现成数据。 Q16：U10Pro单三季度是否约1.8万台？V10环比情况？ 答：U10Pro约1.7万多台（不到1.8万）；V10全球口径Q3环比Q2略少，约3400至3600台。 Q17：全地形车均价环比提升，是哪些车型放量拉动？ 答：核心因美国外销占比高，美国批发数量上升；下半年起美国ATV占比环比、同比均将提升（此前 ATV新品未导入美国，占比偏低），大车小车同步上行。 Q18：是否会全系对标北极星Ranger的1000和500排量段布局产品？ 答：这涉及U10Pro车型迭代升级及新一轮产品周期规划。公司对四轮车规划周期较长，同时会前瞻 研判竞争对手未来三五年规划，不能落后。 Q19：美国ATV新品主要哪个排量段放量较好？ 答：美国市场400-600排量段相对更好。 Q20：燃油摩托车内销Q3均价约1.4万元是否偏离？ 答：该数据过细，需查看后台数据。 Q21：Q3燃油摩托车内销、外销毛利率情况？ 答：踏板车目前主要内销、外销很少，作为新进入品牌毛利确实不高但仍有毛利。外销欧洲前三季度占 出口销量近一半（略不到一半）。 Q22：极核Q3单季毛利率水平？ 答：环比有所提升，但总体对毛利端影响不巨大，仅反映经营趋势，具体金额不便分享。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q23：U10Pro三季度对美出货是否含中国工厂？泰国供应量多少？ 答：没有中国工厂出货，全部由墨西哥供应。泰国Q3尚未供应U10Pro，仅做应用性供应准备以应对 产能波动，目前基本全部由CSM供应。 Q24：墨西哥U10Pro毛利率同比、环比改善幅度？ 答：墨西哥单品毛利明显改善，单Q3同比改善至少近3个百分点。 Q25：美国市场超预期是产品原因还是需求原因？后续需求判断？ 答：两个因素叠加，产品因素权重更高。产品在定价、服务、使用稳定性上获美国消费者认可；美国整 体全动力运动消费情况尚可。公司自信认为产品因素贡献更多。 Q26：U10Pro与V10美国/非美占比拆分？ 答：两者合计两万多台中，美国约1.3万多台，北美区域约7000台；单看U10Pro约一万多台。 Q27：RUV接单时间、供应链及毛利展望？ 答：RUV较特殊，尚处新品开发阶段未正式售卖，数据暂不披露。计划12月首批生产，争取年内或1 月交付美国，收入主要体现于2027年一季度。供应链未完全本地化（V10因USMCA以墨西哥/美国 供应链为主，毛利低于U10Pro；若关税政策变化可能反转），RUV毛利率预计介于U10Pro与V10 之间，最终结合定价、批发价及交付成本在初一前后分享。 Q28：墨西哥、泰国工厂最新关税税率？ 答：约15个点左右。 Q29：成本端对毛利率的负面影响有无量化及传导计划？ 答：电子料（仪表、车联网、存储芯片）成本含在整车成本中。面对国内及国际竞争，成本难以完全传 导至终端，公司与供应商共同分担，保证供应稳定。美国市场今年已做部分价格探讨，其他市场视机会 调整；智能化方向成本刚性，除非不做智能化。 Q30：四季度毛利率趋势展望？ 答：海运费有向下扰动，成本端电子料Q3起已与供应商做工单处理，Q4有望平滑。若汇率不持续下 行，同口径（扣除退税）毛利率预计与Q3保持平稳。 Q31：极核3C事件处理周期及库存、售后减值/费用影响？ 答：这是全行业问题，公司暂停证书占比相对高但绝对数量行业最小。已做最极端情形测算（相关车型 全部暂停），整体风险可控。正积极向监管机构申请恢复/重新申请，影响将更小。已通知销售网点暂 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 停销售相关车型，消费者无法上牌可全款退车，保障体验；Q4为电子淡季，电子生产受一定管控影响 相对有限。 Q32：四季度汇兑基数及对冲措施？ 答：前三季度Q1汇兑损失最大，Q2、Q3汇兑损失相近。人民币升值压力大，公司通过扩大多币种区 域结算（区域市场自行收款）对冲美元敞口；金融远期锁汇因中美息差导致贴水较高，性价比不佳，仍 以业务对冲为主，价格合适时择机锁汇。 Q33：燃油两轮未来重点车型品类侧重？ 答：玩乐类车型持续关注，但资源更多投向出行两轮市场（国内及发展中国家），这是春风未来最重点 投入方向（极核即以电动化形式表达出行）；玩乐车型领导地位不放弃。踏板向更高排量补足的核心逻 辑在外销， 1亿元，环比增长36%： 公司前三季度实现营收27.22亿元，同比+74.46%；归母净利润5.86亿元，同比+95.43%；扣非归母净利润5.79亿元，同比+95.28%。单Q3营收12.27亿元，同比+116.06%、环比+33.51%；归母净利润2.71亿元，同比+226.19%、环比+36.43%；扣非归母净利润2.70亿元，环比+34.17%。AI数通需求与客户订单增长，推动业绩加速释放。 2、收入放量叠加毛利率提升，共同推动利润增长： Q3综合毛利率40.13%，较上半年提升3.95pp；期间费用率11.91%，较上半年提升1.19pp，当季确认股份支付费用4937.21万元，占收入约4.02%；归母净利率22.09%，较上半年提升1.04pp 3、无源业务：现有产品持续放量，高密度互联带动产品升级： 400G、800G AWG芯片及组件已规模交付，1.6T产品进入小批量交付阶段，后续看客户导入与交付规模扩大。MPO、MMC高速连接跳线持续大批量出货，高芯数、低损耗及定制化需求推动产品价值量提升；适配800G、1.6T的MT-FA部分产品已批量商用，CPO高通道FAU实现小批量出货。短期增长看MPO、AWG订单交付及鹤壁、泰国产能释放，中期看1.6T与CPO配套产品扩大应用。 4、有源业务：100mW CW扩大交付，高功率光源打开新增量： 公司依托覆盖设计、外延、晶圆加工及封装测试的IDM能力，推进CW、EML激光器芯片产业化。硅光配套非控温100mW CW DFB激光器已批量出货，400mW产品实现小批量出货，数据中心用100G EML处于客户送样验证阶段。后续重点看100mW产品扩产放量，以及400mW产品随NPO/CPO导入扩大供货。公司拟募资不超过28亿元，其中14亿元投向CW激光器芯片及COC产业化，为有源业务规模增长提供支撑。 看好公司有源+无源双平台优势，建议积极关注，重点跟踪新增产能释放、新品规模交付与客户拓展。#文字观点", "publish_time": "2026-10-22 07:52", "tags": ["文字观点"]}, "post:2026-10-22T12-32:1d30a3289788": {"id": "post:2026-10-22T12-32:1d30a3289788", "kind": "post", "title": "2026-10-22 12:32", "source_label": "帖子正文", "excerpt": "1）光模块企业利润，1.6T的影响只是短期因素，近期基本都解决了问题。无论是marvell的dsp，还是LPO/LRO方案。", "content": "1）光模块企业利润，1.6T的影响只是短期因素，近期基本都解决了问题。无论是marvell的dsp，还是LPO/LRO方案。 2）大光受1.6T影响，二线光模块三季度表现集体不错，季度环比加速度趋势不变，目前看二线光的赔率持续上升。 3）SPIL扩产光引擎，更多是对接tsmc cpo，明年Q4开始进入加速期，配套产品是rubin ultra 576。 4）博通TH7明年下半年开始起量，NPO会跟随量产。#产业看好光，加大光的投入是确定的。#继续看好联特科技，北美多个客户稳步推进，不断超预期。#欢迎交流Leon#文字观点", "publish_time": "2026-10-22 12:32", "tags": ["产业看好光", "加大光的投入是确定的", "欢迎交流", "文字观点"]}, "post:2026-10-22T14-24:0be2f6d1c54f": {"id": "post:2026-10-22T14-24:0be2f6d1c54f", "kind": "post", "title": "2026-10-22 14:24", "source_label": "帖子正文", "excerpt": "【新易盛：订单交付有序开展】光通信板块22日整体回调，午后跌幅收窄。新易盛股价也出现大跌。", "content": "【新易盛：订单交付有序开展】光通信板块22日整体回调，午后跌幅收窄。新易盛股价也出现大跌。针对市场关注的公司经营情况，记者从公司方面了解到，公司目前生产经营活动正常有序，订单交付工作正常开展。公司相关公开信息亦显示，800G和1.6T是今年交付的主力产品，订单交付及产能扩充正按业务需求推进。 (证券时报)#文字观点", "publish_time": "2026-10-22 14:24", "tags": ["文字观点"]}, "post:2026-10-22T14-35:d5f8e25a2063": {"id": "post:2026-10-22T14-35:d5f8e25a2063", "kind": "post", "title": "2026-10-22 14:35", "source_label": "帖子正文", "excerpt": "🧧【DCTX】市场对光模块短期过度悲观，重视龙头公司的中长期配置机会 🎁#市场对大光Q3业绩及远期增长预期过于悲观。近期市场流传Q3业绩较差的说法，叠加物料供应偏紧，进一步放大了对当季交付及后续增长的担忧。", "content": "🧧【DCTX】市场对光模块短期过度悲观，重视龙头公司的中长期配置机会 🎁#市场对大光Q3业绩及远期增长预期过于悲观。近期市场流传Q3业绩较差的说法，叠加物料供应偏紧，进一步放大了对当季交付及后续增长的担忧。我们认为，Q3虽受部分物料约束，但不至于像部分传言描述的那样差，不应将阶段性交付扰动外推为远期增长失速。#结合我们近期在北美调研的龙头备料情况，支撑主要来自需求与供给两端： 🎁#需求端，云平台收入有望超预期，高回报持续推动算力扩建。北美调研显示，微软、Google等云平台受益于企业AI应用落地，收入及ARR有望超预期；部分海外AI算力项目回本周期约9—12个月，较高回报持续增强CSP投入意愿，为光互联需求提供支撑。 🎁#供给端，1.6TDSP确实紧张，但对业绩的冲击不宜过度放大。龙头已结合在手及预期订单提前备货、锁定核心材料，为短期缺料提供缓冲。我们判断，当前供应约束主要影响阶段性交付节奏，四季度后有望逐步修复，缺货问题预计在明年得到解决。#随着供应改善，高速产品需求有望进一步转化为出货，产品结构升级继续支撑盈利增长。 📈#从中期维度看，我们认为板块底部区间已经显现，后续成长空间仍值得期待。龙头供应有望修复，二线光模块厂商增速亮眼，行业需求仍在释放，应重视悲观预期消化后、订单与业绩兑现带来的修复机会。#继续重点关注联特科技、中际旭创、新易盛、天孚通信 ☎️欢迎联系：csy,wyj,clh#文字观点", "publish_time": "2026-10-22 14:35", "tags": ["供给端", "6T", "文字观点"]}, "post:2026-10-22T07-49:b4703dd857ec": {"id": "post:2026-10-22T07-49:b4703dd857ec", "kind": "post", "title": "2026-10-22 07:49", "source_label": "帖子正文", "excerpt": "看好 🐯2026年10月12日，杰普特发布公告称，公司自2026年1月1日以来持续收到北美V客户采购订单，累计金额约1.63亿美元（折合人民币约11.10亿元，约为2025年全年营", "content": "【开源通信】独家挖掘【PH&Senko链】继续坚定看好 🐯2026年10月12日，杰普特发布公告称，公司自2026年1月1日以来持续收到北美V客户采购订单，累计金额约1.63亿美元（折合人民币约11.10亿元，约为2025年全年营收的53.52%），相关产品为光纤连接器产品。 🐯无独有偶，致尚科技于2026年9月30日宣布与PH客户签署《2027年度需求预测合作备忘录》，约定PH客户预计2027年度向公司采购光纤连接器，总需求预测目标金额为5亿美元（折合人民币约33.65亿元，约为公司2025年营业收入的3.37倍）。 🐯我们认为，订单公告的密集催化反映出下游客户对光纤连接器需求呈现强劲增长态势，MPO连接器赛道景气度显著抬升，行业需求高景气逻辑得到进一步验证。 🌹建议重视PH&Senko链投资机会。推荐标的：杰普特；受益标的：致尚科技。 🌹我们建议高度重视MPO相关核心标的，把握量价齐升带来的投资机遇。 （1）【senko三兄弟】推荐标的：杰普特、仕佳光子，受益标的：致尚科技； （2）【保偏MPO】受益标的：长盈通； （3）【MPO优质企业】推荐标的：天孚通信，受益标的：长芯博创、太辰光、蘅东光、光库科技； （4）【光纤&MPO】推荐标的：亨通光电、中天科技、远东股份，受益标的：永鼎股份等。#文字观点", "publish_time": "2026-10-22 07:49", "tags": ["文字观点"]}, "post:2026-10-22T20-12:794730dc0af8": {"id": "post:2026-10-22T20-12:794730dc0af8", "kind": "post", "title": "2026-10-22 20:12", "source_label": "帖子正文", "excerpt": "关注点集中在澳洲联储收紧政策的风险，虽然失业率抬升至五年高点 4.7%，但市场依旧认为 11 月存在加息可能性。", "content": "🔍市场驱动因素 📉亚太股市大幅走低，在美国科技股财报不及预期之后，全球科技与人工智能板块的抛售潮在整个区域蔓延开来。 📉韩国、香港以及日本领跌，而台湾、韩国、日本和中国的半导体以及人工智能相关个股下跌尤其明显。 📉中国股市进入技术性熊市区间，香港市场电商监管相关担忧再起，进一步加重市场压力。 📉防御性板块整体表现占优，资金从动量股和周期板块当中撤离。 📈印尼是区域当中明显的例外标的，雅加达综合指数（JCI）扭转早盘跌势，收盘上涨，背后是 Dananantara 买盘的推动。 📈印度与澳大利亚市场同样展现出相对韧性。 💵宏观层面，韩国央行维持利率在 3% 不变，日元与韩元走强；澳元、新台币以及东盟区域货币走势偏弱。 🌏【🌐地区综述】 🇦🇺澳大利亚：AS51 指数下跌 0.43%。 📉澳大利亚股市收盘走低，报 8793.20 点，受到全亚洲普遍抛售氛围拖累，矿业、可选消费板块拖累大盘，不过该指数年内至今依旧上涨 4.6%。 📉能源板块与材料板块领跌，分别下跌 2.65%、1.65%，大宗商品走弱叠加市场对中国需求的担忧带来压制。 📞通信、必需消费、地产板块跑赢大盘。 💡市场核心关注点集中在澳洲联储收紧政策的风险，虽然失业率抬升至五年高点 4.7%，但市场依旧认为 11 月存在加息可能性。 💱澳元兑美元跌至 0.7012。 📈NEX TDC 上涨 7.19%，分析师认为周三的抛售存在过度情形。 📉Nick Scali 大跌 15.57%，原因是盈利指引偏弱，同时券商下调评级至卖出。 📉Fortescue 下跌 4.78%，受材料板块行情拖累，但是该公司维持全年铁矿石出货量以及资本开支指引不变。 📉Santos 收窄了全年产量、销量指引区间。 🇹🇼台湾：TAIEX 指数下跌 1.81%。 📉台湾股市收跌，创下 9 月 16 日以来最低收盘点位，全天持续遭遇卖盘，收盘落在日内低点。 📉市场交投情绪偏弱，1075 只个股当中有 751 只收跌，全球科技财报的担忧情绪给半导体板块带来压力。 📉台积电（2330）下跌 1.5%，是盘面最大拖累项；穆迪基于台积电的技术领先地位、财务实力、强劲 AI 需求，将它的发行人评级从 Aa3 上调至 Aa2。 📈PCB 以及基板相关个股逆势走强，瑞银上调相关标的目标价，英伟达产能预期带来正面催化。 📈欣兴电子最高涨幅达到 7.3%，景硕科技上涨 5.5%。 📈布伦特原油价格站上 110 美元，进一步推升避险情绪。 💱新台币兑美元走弱至 32.588，10 年期收益率维持在 2.001%。 📉台科（2466）放量大涨 9.4%；国光学（6209）下跌 10.5%。 🇰🇷韩国：KOSPI 指数下跌 3.52%。 📉KOSPI 指数近乎直线下行，收盘回落至 5600 点关口下方。 📉盘中资金博弈波动较大，外资最终在 KOSPI 小幅净买入，外资集中在三星电子（005930）卖出 9500 万美元，在运输设备板块买入最多，金额 4100 万美元。 📉本土机构是主要净卖出方，科技板块卖出金额最高，达到 3.81 亿美元。 📉散户逢低买入带来一定支撑，但在其他公司回购资金流入缺失的背景下，买盘不足以完全承接卖盘。 📉SK 海力士（000660）下跌 5.5%、三星电子（005930）下跌 4.0%，回吐昨日大部分涨幅，其余多数板块在成交缩量的环境下同步收跌。 🏦韩国央行维持政策利率 3% 不变。 📊KOSPI 成交量较 20 日均值增加 31.9%，交投表现低迷。 💱韩元升值 8 个基点，汇率来到 1322.3 韩元兑 1 美元。 🇯🇵日本：NKY 指数下跌 2.65%。 📉日本股市遭到大幅抛售，日经指数跌破 64k 支撑位置。 📉Meta、特斯拉、泛林集团业绩不及预期压制科技板块，PHP 安全漏洞相关消息进一步加速资金转向防御板块。 📉NKY 下跌 2.65%，TOPIX 指数下跌 1.14%，东证 Mother 板块下跌 1.75%。 📉成长股、周期股跌幅居前，下午开盘之后日元快速升值，下跌行情进一步加速。 📉资金流向双向波动，整体小幅净卖出，对冲基金是卖出主力，长线资金则以买入为主。 📉AI 相关标的回吐昨日涨幅，半导体板块下跌 6.3%、AI 板块下跌 6.2%、光学板块下跌 6.1%。 📉爱德万测试（6857）下跌 6.6%、东京电子（8035）下跌 7%、软银（9984）下跌 6.9%，三只标的合计贡献日经指数大约 62% 的跌幅。 📉Resonac（4004）下跌 11.2%，银行板块同样走弱。 📈软件板块、防御板块相对跑赢大盘。 📊成交量相比 20 日均值低 11.4%。 📉收盘之后 Disco（6146）公布财报，二季度业绩超出一致预期，但是三季度指引低于市场预期。 🇨🇳中国：沪深 300 指数下跌 1.84%。 📉A 股大幅下挫，指数下探至 4036.30 点，相对 6 月高点回撤幅度达到 20%。 📉深证综指下跌 2.93%，创业板指下跌 4.37%，成长、科技板块领跌。 📉市场担忧 AI 资本开支，叠加全球半导体财报不及预期带来压力。 📉电商监管相关消息再度扰动市场，监管机构要求各大主流电商平台强化产品质量、消费者权益相关管控。 📉和 AI 相关的通信标的跌幅靠前，中际旭创（300308）下跌 12.25%、光迅科技（002281）下跌 8.73%、苏州天孚光通信（300394）下跌 8.34%。 📈防御板块、政策支持类板块相对抗跌，中国移动（600941）上涨 2.52%、纳睿雷达（688522）上涨 2.40%，在大盘走弱的环境里形成对冲。 💱人民币兑美元小幅走强至 6.6732，中国 10 年期国债收益率基本持平，报 1.6305%。 🇭🇰香港：恒生指数下跌 3.00%。 📉港股创下 3 月以来最大单日跌幅，恒生指数回落至 6 月水位下方，失守 23000 点关口，各个板块负面消息持续累积。 📉南向资金持续流出，为连续第五个交易日净卖出，统计时点净卖出 110 亿港币。 📉成交金额同步放大，恒生科技指数跌幅更深。 📉国内电商监管相关消息带来扰动，监管机构要求平台加强商品质量管控，电商相关标的承压。 📉腾讯（0700）、宁德时代（3750）在业绩不及预期之后继续遭遇卖盘。 📉银行 H 股同样走弱，建设银行（0939）、中国银行（3988）、邮储银行（1658）均出现下跌。 📉科技板块跌幅靠前，恒生科技指数下跌 5%；联想（0992）下跌 10.9%、华虹半导体（1347）下跌 9.5%、智谱（2513）下跌 7.1%、MiniMax（2159）下跌 6.5%、宁德时代下跌 7%、紫金黄金（2159）下跌 8%。 📈金融板块下跌 1.4%、银行板块下跌 0.7%，走势相对抗跌。 🇮🇩东盟（印尼）：JCI 指数上涨 1.12%。 📈印尼股市在区域普跌行情当中走出独立行情，早盘一度下跌 2.7% 之后反转上行。 📈驱动因素是 Dananantara 确认在上周五暴跌之后大举买入本土股票。 💱印尼盾走势偏弱，市场消化印尼央行维持利率不变、同时下调存款准备金率的政策决议。 📈SET 指数上涨 0.45%，在亚洲整体疲软环境当中韧性突出。 📉泰铢汇率回落至两周低位，银行板块受益于净息差、信贷增长改善，三季度业绩预期向好。 📉CP 板块受益于禽肉需求走强，巴西供给端扰动带来额外订单，业绩预期上调。 🇮🇳印度：NIFTY 指数下跌 0.60%。 📉Nifty 指数盘中最低下探至 25028 点。 📉指数展现出一定的相对韧性，但是依旧没能收复前期的下跌缺口，油价走高带来持续的宏观层面压力。 📉印度市场的远期波动率抬升，市场资金流出科技板块。 📉Nifty Bank 指数下跌 0.7%，Nifty IT 指数下跌 1%，几乎全部行业板块收跌。 📉金属、IT、能源板块跌幅居前；银行、医药板块跌幅最小，仅小幅收跌。 📉印度 VIX 指数盘中一度冲高 5%，之后回落至 15.7。#文字观点", "publish_time": "2026-10-22 20:12", "tags": ["文字观点"]}, "post:2026-10-22T09-23:f81dfc0a5128": {"id": "post:2026-10-22T09-23:f81dfc0a5128", "kind": "post", "title": "2026-10-22 09:23", "source_label": "帖子正文", "excerpt": "看好国内算力网建设带来的国产算力、算电协同、数据要素板块投资机会上证指数当前运行于3700点一线附近，积极看好短期反弹行情。", "content": "🫘🫘🫘❗️20261022_市场积蓄力量，反弹或蓄势待发，ZC维度优先看好国内算力网建设带来的国产算力、算电协同、数据要素板块投资机会上证指数当前运行于3700点一线附近，积极看好短期反弹行情。 消息面上，积极信号正在累积。宏观政策上，国家发改委明确四季度将及时出台新的增量政策，央行已将算力网等\"六张网\"建设纳入PSL支持领域并下调PSL利率；产业消息上，9月11日国常会研究算力网建设、10月16日总书记考察乌兰察布强调算电协同、10月20日国家数据集团揭牌，催化密集。 资金面上，国庆后股票型ETF净流入超1500亿元，两融余额降至年初水平、净流出明显收窄，机构杠杆出清或临近尾声。反弹优先推荐有政策催化和产业趋势的三大方向：国产算力（算力网纳入\"六张网\"、国产AI芯片已形成上市梯队）：沐曦股份、摩尔线程、燧原科技、寒武纪、海光信息算
