erscalers）最核心的增长引", "content": "大摩——中国AI发展路径 1. 算力基建：万亿资本开支驱动55GW国内增量 预计2026至2030年间，中国AI相关资本开支累计达8.5万亿元人民币，推动国内算力总容量从当前水平跃升至2030年的约81GW，其中本土新增约55GW。AI云已成为超大规模云厂商（Hyperscalers）最核心的增长引擎，且超大规模厂商在供应链中同时扮演芯片、基础设施、模型即服务（MaaS）及应用等多重角色。 2. 数据中心范式迁移：向远端集群与预制化转型 对比云计算时代，AI era的机柜密度从5kW跃升至10–30kW，单笔超大规模订单从5–20MW扩大至50MW以上。为获取规模效应与低成本，数据中心选址从一线城市转向远端区域（Remote Areas），交付周期从1–2年压缩至最快6个月（预制化模式）。资本成本因低利率环境与REITs等融资工具而显著降低，供给端则受“东数西算”节点与建设许可严格管控。 3. 经济模型：自研IaaS与MaaS回报优，第三方API受制于性能折价 在IaaS层，自有算力基础设施可实现约44%的营业利润率与13%的投入资本回报率（ROIC），现金回收期约3年；而租赁模式（Neocloud）虽无资本开支，但营业利润率仅约20%。在MaaS层，自研第一方（1P）模型在较高Token吞吐量下可达成53%的营业利润率与19%的ROIC，回收期2.5年；第三方（3P）API因需分成且吞吐量较低，回报率虽可达29%，但国内推理受限于芯片性能（仅为海外服务器的20%–40%），初期ROIC显著偏低，后续随效率提升存在较大改善空间。 4. 模型格局：中国占据全球SOTA半壁江山，价格战趋缓 中国前沿大模型在Artificial Analysis智能指数上已占全球前十逾半席位，采取与美国“闭源”不同的“开放权重”策略。主流Pro级模型输入价格已降至每百万token 3–20元人民币，Flash级低至0.4–1.5元，且价格下行趋势在2026年三季度出现企稳迹象，反映行业从单纯比拼低价转向智能水平与性价比的综合竞争。多模态（视频/图像生成）亦跻身全球第一梯队。 5. 应用落地：B端渗透提速，C端生态为王 生成式AI在企业端的采用速度远超前代公共云（从Transformer到中国大规模普及仅约8年），未来三年预计将替代中国相当规模的白领工时，场景覆盖广告精准投放、金融投研与风控、医疗影像与新药研发、能源分析与工业调度、电商内容生成及办公自动化等。消费端，竞争焦点已从聊天机器人转向微信、支付宝等超级生态内的AI功能嵌入（如智能搜索、本地生活服务推荐），腾讯生态凭借十亿级日活与商业支付、小程序GMV壁垒构筑深厚护城河。 6. 重点公司观点 阿里巴巴（首选标的）：全栈AI布局最完整——从平头哥PPU芯片、阿里云基础设施到通义千问（Qwen）开源模型及百炼MaaS平台，目标2030年云收入达1000亿美元（40–50% CAGR），AI资本开支带来两位数ROIC且回收期低于3年，云利润率长期向20%扩张，Qwen年化收入运行率（ARR）已超200亿元且三个月内翻倍，估值具备显著上行空间。 腾讯：2026年加大AI投入短期压制利润率，但微信生态（视频号、小程序、支付）与游戏、云业务构成的飞轮效应将提升长期AI能力，核心业务防御性极强。 百度：核心业务复苏有限，AI云基础设施（尤其是GPU云收入同比增283%）与Apollo Go自动驾驶（累计订单超2300万）成为主要增长驱动力。 美团：本地商业GTV预计2030年达2.8万亿元，到店酒旅与其他服务维持与抖音约2:1的GTV比例，非线性复苏中可见结构性亮点。 MiniMax与智谱：分别聚焦全模态与大模型，作为纯AI实验室代表，在开放生态中寻求差异化商业化路径。 7. 行业估值与风险 摩根士丹利对中国互联网AI板块维持“具吸引力”（Attractive）评级，采用分部加总估值法（SOTP），以10%加权平均资本成本（WACC）与3%永续增长率进行现金流折现。上行风险核心在于核心电商货币化提速、企业数字化超预期及AI需求拉动云收入加速；下行风险则来自竞争加剧、再投资成本高于预期、消费复苏缓慢及监管趋严。整体而言，中国AI产业链正从“算力投入期”迈向“回报兑现期”，具备长期结构性配置价值。#文字观点", "publish_time": "2026-10-20 12:05", "tags": ["文字观点"]}, "post:2026-10-20T10-50:63411ff10f33": {"id": "post:2026-10-20T10-50:63411ff10f33", "kind": "post", "title": "2026-10-20 10:50", "source_label": "帖子正文", "excerpt": "【KYJSJ】物理AI或为coding之外最大的应用场景，世界模型与Optimus量产节奏迎来共振-1020物理AI是全球科技巨头明确的重点发力方向 物理 AI 是能够感知、理解物理世界，基于物理规律做时空预测、动作规划，并驱动实体硬件执行操作，形成“感知 - 推理 - 行动 - 反馈”闭环的智能体", "content": "【KYJSJ】物理AI或为coding之外最大的应用场景，世界模型与Optimus量产节奏迎来共振-1020物理AI是全球科技巨头明确的重点发力方向 物理 AI 是能够感知、理解物理世界，基于物理规律做时空预测、动作规划，并驱动实体硬件执行操作，形成“感知 - 推理 - 行动 - 反馈”闭环的智能体系。约等于世界模型+VLA视觉语言动作模型+仿真数字孪生+实体机器人。NV是物理AI基础设施龙头，构建仿真+GPU+模型完整生态。Tesla是全球唯一拥有大规模真实物理世界闭环数据的厂商，把VLA、世界模型迁移到 Optimus。除此之外，谷歌、meta、字节都在深入布局世界模型。GPT-6 Astra或重塑具身大脑的产业逻辑，推动通用模型公司进入具身方向 OpenAI GPT-6 Astra 可以直接输出机器人末端执行器的位姿，不只拆解任务，还能直接生成末端执行器的位姿，完成部分任务的成功率甚至超越一些具身模型，引发了通用模型和具身模型边界的思考。OpenAI、Anthropic、DeepSeek、Kimi 等多数通用前沿模型公司都正酝酿进入具身智能和物理 AI，表明Astra 的变化或重塑具身大脑的产业逻辑。目前Astra跟独立具身模型的区别在于，VLA可以直接输出电机控制信号，而Astra需要IK模块把位姿转换成关节角度，但在精细操作和VLA还存在差距，主要源于后训练的针对性。OpenAI将把机器人智能系统研发作为核心攻关方向 OpenAI有望在2027年推出效果亮眼的演示样机。短期目标是打造通用机器人，帮助技术熟练的工人建设基础设施。OpenAI ARR2026年2-6月出现5个月停滞，暴露C端订阅见顶的结构性问题。7月ARR达到400亿美金，但增长质量已从消费者订阅转向企业Agent/编码。物理AI有望成为拉动ARR增速的重要战略，黄仁勋GTC2026 称物理AI TAM达40万亿美元。机器人智能系统有望形成类似通用大模型盈利的模式，可以以API调用、Token和订阅式形成收入。具身产业的变化总结：通用大模型发力物理AI+应用场景打开+Optimus量产确定 物理AI有望成为coding之后需求空间最大的市场。以Optimus为例，其落地路径是先工厂、再商用、后家庭，所替代的人群可推演至所有体力劳动群体。Optimus已明确进入量产阶段，根据产业链调研，2026年10月底上游核心零部件预期达到周产2,000-2,500台机器人的供应能力，2027年Q1在2026Q4基础上进一步翻倍。2027年全年保守实现10万台量级，需求指引约为30万台。受益标的 1️⃣执行层面。恒立液压、福赛科技、斯菱智驱、科森科技等；2️⃣模型层面。风语筑、中控技术、索辰科技、凡拓数创、智谱等。 ☎KYjsj zy#文字观点", "publish_time": "2026-10-20 10:50", "tags": ["文字观点"]}, "post:2026-10-20T13-39:08a7c50c5066": {"id": "post:2026-10-20T13-39:08a7c50c5066", "kind": "post", "title": "2026-10-20 13:39", "source_label": "帖子正文", "excerpt": "📑野村‑全球存储：AI 市场担忧以及存储行业展望 🔒供给约束仍是我们投资逻辑的核心 ✅我们对存储板块维持乐观态度，预计供给紧张局面至少会持续到 2028 年预测年末。✅在长鑫存储（688825 CH，买入评级）4F2 技术取得进展的消息传出之后，市场对于 AI 收入增长以及新型云算力公司融资状况的担", "content": "📑野村‑全球存储：AI 市场担忧以及存储行业展望 🔒供给约束仍是我们投资逻辑的核心 ✅我们对存储板块维持乐观态度，预计供给紧张局面至少会持续到 2028 年预测年末。 ✅在长鑫存储（688825 CH，买入评级）4F2 技术取得进展的消息传出之后，市场对于 AI 收入增长以及新型云算力公司融资状况的担忧打压市场情绪。 ✅我们依旧认为，市场对于长鑫存储 4F2 技术迭代的担忧存在过度反应。 ✅在我们看来，市场低估了 AI 需求的覆盖广度，以及这一强劲需求能够在整条产业链带来的盈利空间。 ✅我们的投资逻辑建立在数据中心持续部署，以及与之配套产生的存储需求之上。✅如果算力采购承诺出现持续性削减，或是已立项项目出现实质性延期，将会挑战我们的这一判断。 ✅AI 收入趋势需要具备统一的对比基准。 ✅在我们看来，有三项因素会干扰对近期 AI 实验室公司收入趋势的解读，分别是统计口径变化、客户结构变动以及季节性因素。 ✅综合来看，账面收入增速放缓，并不代表整体 AI 需求出现同等程度的走弱。 📝统计口径方面：OpenAI（未上市）披露的 9 月年化收入运行规模约 500 亿美元，和此前引用的 680‑700 亿美元数据之间的差异，很大程度来源于合作伙伴收入的会计统计方式。 📝较高的那组数据纳入了合作伙伴的总收入，用于和 Anthropic（未上市）做对比；而 OpenAI 仅确认自身在部分合作销售当中分得的收入。 📝CNBC 报道称，OpenAI 在 2026 年第三季度的年化收入运行规模同比提升 77%。 📝该指标统计的是季度内收入运行速率的增长，并非确认入账的季度营收同比增速。 👥客户变化方面：Anthropic 针对模型蒸馏业务施加限制，这显然带来了阶段性收入逆风；新闻报道显示受影响业务占其收入规模的 5%‑7%。 👥另外有报道称，Meta（META US，无评级）公众号小牛研报纪要鼓励员工从 Claude 代码工具切换至 8 月新推出的 Muse Code，以及公司内部 MetaCode 工具。 👥我们认为，这类客户迁移会对 AI 实验室公司的收入增长形成拖累。 🌤️季节性方面：我们认为，第三季度暑期假期会让按用量计费模式下的重度用户活跃度阶段性下降，进而造成计费 token 消耗走低。 🌤️我们将美国 GitHub 活跃度作为参考指标，该指标第三季度下滑 7.4%，也印证了这一季节性规律。 🌤️假期带来的使用量回落，很可能是近期收入走弱的诱因，随着正常工作节奏恢复，相关数据存在修复空间。 📈同比增长依旧维持较高水平。 📈根据我们测算的历史季度收入数据，OpenAI 与 Anthropic 合计收入，2026 年第一季度同比增速约 320%，2026 年第二季度同比增速约 492%，2026 年第三季度同比增速约 507%。 📈上述参考增速说明，尽管环比增长有所放缓，整体业务依旧处于高速扩张阶段。 📈我们的基准情景判断是，2026 年第四季度收入将迎来修复，不过客户迁移以及定价压力仍有可能持续存在。📈市场预期 OpenAI 与 Anthropic 两家公司 2026 财年合计收入约 1000 亿美元，要达成该目标，第四季度需要实现 439 亿美元的营收，对应环比增长 61%，同比增长 478%。 📈这为收入修复设置了较高的基准门槛。 📈假设维持 9 月的收入运行速率不变，我们测算第四季度收入依旧可以达到 297 亿美元，同比增长 291%。 📈大型云服务商即将发布的财报，将有助于判断更广义层面的 AI 需求强弱，它们既是算力供给方，同时也是 AI 实验室公司的竞争对手。 📈后续 AI 实验室公司收入更新数据，将会检验我们关于 2026 年第四季度收入修复的预期。 💰AI 行业盈利水平要优于账面现金流表现。 💰我们认为市场低估了 AI 整条产业链的盈利实力。 💰部分 AI 实验室公司以及新型云算力公司处于亏损状态，叠加快速扩产带来巨大现金消耗，市场由此普遍形成 AI 投资不赚钱的印象。 💰我们认为这忽略了生态体系内关键环节已经实现可观的经营利润。 💰成熟云平台依旧保持很高的盈利水平。 💰亚马逊旗下 AWS（AMZN US，无评级）2026 年 6 月所在季度披露的经营利润率约 39%；微软（MSFT US，无评级）智能云业务经营利润率 41%；谷歌（GOOGL US，无评级）云业务经营利润率 36%。 💰我们预计随着新合同定价逐步体现在营收当中，云平台整体利润率还会进一步改善。 💰我们做的示意测算显示，这些云业务 EBITDA 利润率大约在 60%，意味着在剔除折旧摊销之前，已经可以产生可观经营收益。 💰经营杠杆效应正在逐步显现。 💰不同 AI 实验室公司盈利水平存在分化，差异来源于对下一代模型的投入规模，以及尚未产生收入的用户所消耗的算力成本。 💰随着付费收入规模扩大，相对固定的研发成本可以被更大的收入基数摊薄，我们预计盈利会呈现 J 型曲线改善。 💰在我们看来，Anthropic 在 2026 年第二季度实现调整后经营盈利，并且第三季度维持调整后盈利状态，说明它已经进入该发展阶段。 💰业务高速增长，需要先投入算力资源，之后对应的收入才会完全兑现。 💰因此即便经营层面已经盈利，依旧会产生现金缺口，带来外部融资需求。 💰我们认为，这种时间错配，叠加部分公司出现亏损，扭曲了市场对于整个 AI 行业利润池的认知。 💰算力利用率与定价水平，依旧是新增资本回报的核心决定因素。 💰AI 负载的多样化，也印证了以上观点。 💰我们测算，2026 年末全球 AI 总装机规模 29GW，其中 OpenAI 和 Anthropic 合计仅占用约 5GW。 💰也就是说，它们的财务数据，只能反映支撑基础设施需求的一部分业务活动。 ⚠️我们判断发生系统性风险外溢的概率有限。 ⚠️如果借贷成本上行、融资渠道收紧，部分公司会因为自身商业模式与融资结构，面临显著个体风险。 ⚠️但我们认为，这些风险演变为全市场系统性事件，或是打断整体 AI 投资周期的可能性不高。 ⚠️我们以 CoreWeave（CRWV US，无评级）举例，以此说明它在整个生态当中的相对体量。 ⚠️截至 2026 年 6 月末，CoreWeave 有效算力功率 1.5GW，资产负债表债务规模 351 亿美元，尚不包含租赁负债。 ⚠️它的有效算力，仅相当于 2026 年末预计数据中心总算力 34GW 的 4.4%；债务规模占我们测算 2026 年全球数据中心总投资 2.12 万亿美元的 1.7%。 ⚠️在我们看来，GPU 以及数据中心资产，对于客户和其他运营方依旧具备战略价值。 ⚠️即便数据中心运营方出现最坏情景，资产所有权变更之后，现有基础设施以及部分项目依旧可以继续投入使用或是持续开发。 ⚠️这就为整体投资周期提供一层缓冲垫。 ⚠️如果再融资压力蔓延至主要客户与基础设施服务商，引发大规模项目取消或是资本开支削减，我们才会重新修正上述判断。🚀算力部署支撑存储行业至少到 2028 年都维持供需偏紧格局。 🚀AI 成长空间的巨大体量，可以解释算力部署力度持续走高。 🚀我们测算 2026 年 AI 实验室公司整体收入 1800 亿美元，该规模仅占容易受到生成式 AI 影响的白领劳动收入 25 万亿美元的 0.7%；占 Gartner 测算的 IT 服务加软件合计市场 3.3 万亿美元的 5.4%。 🚀上述对比说明 AI 的商业化落地还有巨大提升空间。 📡我们的 AI 数据中心项目跟踪统计，显示算力扩张仍在继续。 📡在对 50MW 以下项目做调整之后公众号小牛研报纪要，源头内容加微wuxl3408统计显示 2026 年全球新增算力 22.3GW，同比增长 77%，较我们基准模型 19.3GW 高出 16%，部分项目有可能顺延至 2027 年初落地。 📡2027 年跟踪统计新增算力 31.5GW，较我们模型估算 29.7GW 高出 6%，该数值本身已经高于 2026 年基准 19.3GW。 📡以上均为部署口径，统计范围包含已运营、已交付、建设阶段的项目。 🧠至少到 2028 年，存储需求增速都将持续高于供给增速。🧠结合我们的部署预测，叠加系统结构与存储搭载量假设，得出的结论就是至少到 2028 年，存储需求增长会跑赢供给。 🧠这支撑我们的判断：供给约束将持续存在，存储厂商将处在有利的价格环境。#文字观点", "publish_time": "2026-10-20 13:39", "tags": ["文字观点"]}, "attachment:files/长城证券-金富科技(003018)精密制造能力延伸，液冷爆发稳抓先发优势-261019.pdf": {"id": "attachment:files/长城证券-金富科技(003018)精密制造能力延伸，液冷爆发稳抓先发优势-261019.pdf", "kind": "attachment", "title": "长城证券-金富科技(003018)精密制造能力延伸，液冷爆发稳抓先发优势-261019", "source_label": "长城证券", "excerpt": "请仔细阅读本报告末页声明", "content": "请仔细阅读本报告末页声明 证券研究报告 | 公司深度报告 2026年10月19日 金富科技（ 003018.SZ ） 精密制造能力延伸，液冷爆发稳抓先发优势 财务指标 2024A 2025A 2026E 2027E 2028E 营业收入（百万元） 892 760 1,856 2,960 4,582 增长率 yoy（%） 15.4 -14.8 144.2 59.5 54.8 归母净利润（百万元） 141 101 247 501 702 增长率 yoy（%） 27.1 -28.6 145.2 102.7 40.0 ROE（%） 8.9 6.3 16.4 19.0 21.5 EPS最新摊薄（元） 0.44 0.31 0.77 1.55 2.18 P/E（倍） 94.1 131.8 53.7 26.5 18.9 P/B（倍） 8.4 8.3 6.3 5.3 4.2 资料来源：聚源数据，公司财报，长城证券产业金融研究院 双主业发展格局确立， 2026年H1液冷业绩已显 。公司成立于 2001年，是一家 深耕食品饮料包装领域的制造企业，依托长期制造经验积累，通过并购推动液冷散 热业务协同发展，下设 金富华南 、卓晖金属 、联益热能 三家液冷主体子公司。 2026 年H1公司液冷业务实现收入 2.76亿元，包装制品业务收入 4.6亿元，液冷业务收 入占总营收比重达到 37.43%， 成为公司第二大收入来源， 是业绩高增的核心驱动。 数据中心基建拉动液冷市场扩张，技术路线迭代重塑行业价值。 根据中国能源报的 数据， 2030年全国数据中心占全社会用电量比例将提升至 6%，液冷相比于风冷 散热效率 及空间利用率 更高，成为能耗优化核心抓手。当前新建数据中心已存在液 冷替代风冷的趋势，据 TrendForce 的预测，液冷散热在 AI芯片的渗透率自 2023 年的6%快速提升， 2027年有望达到 59%。当前冷板式液冷市场占比约 70%，除 散热效率和能耗外，漏液风险和可靠性是各种技术路线均要重点关注的技术要点。 未来随着不锈钢波纹管逐步替代 EPDM橡胶软管，液冷环节扩展至 CX9网卡、配 电板、 光收发模块及其他关键零部件， 单机柜液冷环节价值量未来也有望持续上升。 公司产能及客户导入先发优势明确，产品技术打造差异化特性。 2026年Q2公司 液冷业务已实现 营业收入 2.76亿元，毛利 1.37亿元，毛利已超过卓晖金属、联益 热能 2025年1-10月整体水平 。子公司长期深耕液冷散热产品的焊接，已形成较 为完整的技术和工艺体系。公司 已募投3亿元用于产能建设，现有产能难以充分满 足下游客户订单增长、产品品类拓展及新客户导入需求，具备快速增资扩产的必要 性。作为产业链 Tier 2环节，下游核心客户包括奇宏电子、宝德科技、双鸿电子、 CoolIT、富士康、台达电子等，客户粘性较高，后续 有望持续 形成新的订单增量。 盈利预测与投资评级： 考虑到随公司 产品延展管路、 冷板、 分集水器 等核心零部件， 价值量覆盖有望持续提升 ； 同时算力需求持续带动高性能服务器及数据中心液冷 建 设，作为产业链 Tier 2零部件供应商，有望首先受益于需求增长 ，并为公司业绩 增 长提供长期稳定支撑。 我们预计公司 2026-2028年营收分别达 18.56/29.60/45.82 亿元，同比分别提升 144%/60%/55% ；2026-2028年归母净利润可分别达 2.47/5.01/7.02亿元， 同比分别提升 145%/10 3%/40%，EPS分别为 0.77/1.55/2.18 元/股，公司 PE分别为 54x/27x/19x，首次覆盖给予买入评级。 风险提示： 数据中心建设进度不及预期、产品渗透率及订单落地不及预期、扩产进 度不及预期、市场竞争加剧、测算数据或与实际情况不一致。 买入（首次评级） 股票信息 行业 轻工制造 2026年10月16日收盘价 （元） 37.69 总市值（百万元） 12,154.18 流通市值（百万元） 10,723.24 总股本（百万股） 322.48 流通股本（百万股） 284.51 近3月日均成交额 （百万元） 632.45 作者 分析师 张磊 SAC：S1070525100001 邮箱： zhanglei2@cgws.com 分析师 陈子锐 SAC：S1070525110003 邮箱： chenzirui@cgws.com 相关研究 仅供内部参考，请勿外传！ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 公司深度报告 P.2 请仔细阅读本报告末页声明 内容目录 包装瓶盖稳态供应，协同布局液冷第二增长曲线 ................................ ................................ ............................ 4 公司发展历程与股权架构 ................................ ................................ ................................ ...................... 4 液冷精密结构件产品成为公司增长新引擎 ................................ ................................ ............................... 6 高需求推动液冷行业增长，关键部件提升单柜价值 .. 心可超过 30%，是除 IT设备外能耗占比最高的环节，因此液冷系统优化是数据中心低碳发展的核心抓手。 图表11：全国数据中心用电量及占社会用电量比例预测 图表12：数据中心主要能耗环节 资料来源：中国能源报，长城证券产业金融研究院 资料来源： IEA官网、长城证券产业金融研究院 液冷应用可显著降低数据中心能耗，同时更适合高功率密度 AI机柜。当前新建数据中 心也已存在液冷替代风冷的趋势，其优势一方面在于提升空间利用率，另一方面在于液 冷散热效率更高。凭借优异的热学与流体特性，液冷已成为公认的解决方案，在相同温 差条件下，水的单位体积输热能力约为空气的 4000倍，同时水的导热系数大约是空气 的30倍。谷歌最早在 2018年上线的 TPU v3采用液冷技术，服务器的体积仅为风冷机 型的近一半，这得益于小巧的冷板替代了笨重的散热片。相比采用风冷的 TPU v2，芯片 部署密度提升了一倍，整机规模扩大至原来的四倍。 图表13：液冷与风冷优势对比 对比维度 液冷优势 单位体积输热能力 约为空气的 4000倍（相同温差下） 导热系数 约为空气的 30倍 服务器几何体积 约为风冷的一半 芯片部署密度 翻倍（ TPU v3相比于 TPU v2） 超算整体规模 4倍（TPU v3相比于 TPU v2） 资料来源： Google Cloud ，长城证券产业金融研究院 当前 AI数据中心处于风冷转液冷技术转型的阶段。 从技术迭代角度， NVIDIA Rubin系0%4%8%12%16%20% 0200400600800 2025 2030E全国数据中心用电量及预测（ TWh） 占全社会用电量比例 CAGR=36.31% 仅供内部参考，请勿外传！ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 公司深度报告 P.10 请仔细阅读本报告末页声明 列机柜采用 100%液冷架构来降低能耗和运营成本1；根据 TrendForce 官网 2026年8 月17日的文章， Google超80%的AI Server 已采用液冷技术；昇腾 960超节点同样采 用全液冷设计2。风冷替代一方面是为了符合国家 PUE标准，满足长远效益，另一方面 也是伴随 AI机柜功率热密度提升 的必然选择。 液冷渗透率将随着终端厂商技术选择快速 增长， 根据 TrendForce 的预测， 液冷散热在 AI芯片的渗透率自 2023年的6%快速提升， 2027年有望达到 59%。 图表14：2023-2027年AI芯片液冷渗透率预测（ %） 资料来源： TrendForce 官网，长城证券产业金融研究院 AI拉动数据中心基础建设，随之拉动液冷市场规模增长。 根据 JLL官网的测算， 2025 年AI仅占数据中心负载的 1/4，大部分需求集中在模型训练，预计 2027年推理工作负 载可能会取代模型训练成为 AI的主要需求。伴随 AI及云计算需求推动，当前仍处于基 础设施建设阶段，预计 2025-2030年间将增加 97GW的数据中心， 2030年总容量达到 200GW，2025-2030年CAGE为14.42%。建设需求主要集中在美洲，其次是亚太，根 据CUSHMAN &WAKEFIELD 官网的数据，东南亚又占了亚太建设总量约 50%的份额。 装机量扩张拉动上游数据中心液冷市场增长，根据零氪 1+1公众号的预测，预计 2028 年全球市场规模将达到 258.8亿美元， 2025-2028年CAGR为28.31%，液冷市场增速 高于数据中心容量的增长。 图表15：2025-2030年全球区域数据中心规模预测（ GW） 图表16：2025-2028年全球数据中心液冷市场测算（亿美 元） 资料来源： JLL官网，长城证券产业金融研究院 资料来源：零氪 1+1公众号、长城证券产业金融研究院 1 NVIDIA 官网 2 中国经营报 0%20%40%60% 2023 2024 2025 2026E 2027E 0306090120 2025 2030E欧非中东 亚太美洲 050100150200250 2025 2026E 2027E 2028E中国市场 海外市场 仅供内部参考，请勿外传！ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 公司深度报告 P.11 请仔细阅读本报告末页声明 冷板式液冷相对成熟，效率及可靠性为技术选择关键驱动 数据中心液冷方案主要分为三种。 根据化工学报，液冷技术根据冷却液与芯片是否直接 接触可分为间接液冷和直接液冷，间接液冷主要是冷板式液冷，直接液冷主要有喷淋式 液冷和浸没式液冷。目前冷板式液冷发展相对成熟，其应用比例与市场规模均远大于浸 没式液冷与喷淋式液冷，而直接液冷理论上具有更好的散热效果。 （1）冷板式液冷： 冷板通常是由铜、铝等导热金属制成的密封腔体，并在内部配备不 同的通道结构用以强化换热。冷板位于服务器内部并与芯片直接接触，芯片的热量通过 热传导传递至冷板，再由其中的循环冷却液带走，温度升高后的冷却液通过换热器与冷 源间的循环将热量排出。在冷板式液冷的领域中，微通道冷板具备散热能力强、传热阻 力低、体积紧凑等优点。 （2）喷淋式液冷： 喷淋式液冷系统是将低温冷却液直接喷淋在芯片上，吸热后的高温 冷却液通过换热器降低温度而后再次进入服务器喷淋。其与单相浸没式液冷系统相比强 化了对流换热且冷却液用量更少， 但喷淋过程中冷却液遇到高温的电子部件会出现飘逸， 目前在数据中心的应用较少，喷淋式液冷中喷雾冷却技术受关注度较高。 （3）浸没式液冷： 浸没式液冷是将 IT设备浸没于冷却液中并通过其循环进行高效热传 递，研究中常用的冷却液主要有电子氟化液、全氟胺、矿物油、合成油和去离子水。根 据冷却过程中柜体内浸没液是否发生相变，浸没式液冷可分为单相浸没式液冷和两相浸 没式液冷。两相浸没式液冷系统利用冷却液的相变潜热吸收热量，其热通量相较于单相 浸没式液冷更高。 图表17：冷板式液冷、喷淋式液冷、单相浸没式液冷、两相浸没式液冷结构示意图 资料来源：《 Chemical Engineering Science 》，长城证券产业金融研究院 当前冷板式液冷技术最成熟。 在主流数据中心液冷方案中，冷板式液冷应用比例与市场 规模最大，根据通信电源技术公众号 2026年8月21日发布的文章的数据，冷板式液冷 市场占比约 70%。除散热效率和能耗外，漏液风险和可靠性是各种技术路线均要重点关 注的技术要点。 仅供内部参考，请勿外传！ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 公司深度报告 P.12 请仔细阅读本报告末页声明 图表18：液冷技术路线优劣势对比 技术类型 核心优势 主要劣势 冷板式液冷 技术最成熟； 微通道嵌入式设计散热 能力强，最高可达 3190W/cm ²；组 件体积小，部署改造灵活 仅针对 CPU等高发热芯片散热， 内存、硬盘等仍需风冷， PUE下 降空间有限； 微通道结构制造难度 大；需高纯净度冷却液以防堵塞 浸没式液冷 PUE普遍低于 1.1，两相浸没式液冷 PUE可达 1.05-1.07；支持单柜 100kW以上高功率密度散热 性能依赖冷却液， 电子氟化液成本 高；液冷箱重量大，维护难度高。 喷淋式 （喷雾） 液冷 临界热通量极高， 被冷却表面温度均 匀性优异；冷却液整体用量少 缺乏服务器端规模化应用案例； 喷 嘴存在堵塞风险，冷却液易飘逸 资料来源：《化工学报》，长城证券产业金融研究院 冷板式液冷架构中，冷板是价值量占比最高的环节。 冷板式液冷主要环节包括冷板、快 接头、 CDU、管路阀门、冷却液等环节，从成本结构来看 ，根据中粉热管理公众号 2026 年9月15日发布的文章测算 ，冷板是冷板式液冷系统价值最高的部件，占比达 32%， 公司产品主要涉及冷板、管路阀门环节。 图表19：冷板式液冷各环节成本占比（ %） 资料来源：中粉热管理公众号，长城证券产业金融研究院 液冷管路方面，不锈钢波纹管正取代传统 EPDM橡胶软管。 根据芯片与热管理公众号， 传统数据中心液冷管路长期以 EPDM（三元乙丙橡胶） 为主要材质， 其优势在于柔性好、 成本低、安装快，但其诸多短板也导致了不锈钢波纹管的替代趋势。英伟达 Vera Rubin 平台已正式禁用 EPDM橡胶软管，全面采用不锈钢波纹管。另一方面，不锈钢波纹管相 比于EPDM软管价值量也显著提升， GB200平台主要采用 EPDM软管， 对应成本约 1000 至1500美元； GB300平台开始在关键连接点以金属波纹管替代橡胶软管，单机柜成本 上升至 2000至3000美元。 不锈钢波纹管的渗透率及市场空间有望随其他终端液冷方案 设计更新而不断提升。 32% 28%25%10%5% 冷板 快接头 CDU 管路、阀门、传感器 冷却液 仅供内部参考，请勿外传！ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "attachment:files/A股与港股复盘 20261020.pdf": {"id": "attachment:files/A股与港股复盘 20261020.pdf", "kind": "attachment", "title": "A股与港股复盘 20261020", "source_label": "其他", "excerpt": "A股与港股复盘 2026年10月20日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 隔夜利率新锚落地，债市认为降息 2026年10月20日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 央行把政策利率锚换成隔夜，债市把它读成变相降息，股票没有同样的读法：A股指数平收、权重股", "content": "A股与港股复盘 2026年10月20日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 隔夜利率新锚落地，债市认为降息 2026年10月20日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 央行把政策利率锚换成隔夜，债市把它读成变相降息，股票没有同样的读法：A股指数平收、权重股下跌，港股节后补跌1.3%。 人民银行行长周一下午称将研究把主要政策利率改为隔夜利率，今天又公告自10月21日起连续开展隔夜逆回购；债市走强，股市未同步。上证收3,735点，涨0.1%，午后一度跌0.75%，尾盘上证50ETF放量才拉回红盘；恒指节后首个交易日跌1.3%，收盘距日内低点仅16点。周一的经济增长好于预期。我们在上周的与瑞士宝盛对话的播客里讨论过了，今年的经济增长目标的实现基本上没有任何的悬念。因此，市场对于政策不应该过度的期待，而工作重心将转向市场维稳。今天的午盘宽基ETF的大幅买入，显然是“看得见的手”在主导，使得上证日内V型反弹收平。但成长股缺乏托盘，被韩股带下。 本日报要 主线段： 央行把政策利率锚换成隔夜，债市把它读成变相降息，股票没有同样的读法：A股指数平收、权重股下跌，港股节后补跌1.3%。事情分三步。周一下午，人民银行行长潘功胜在金融街论坛上说，将研究择机把公开市场主要操作品种的期限切换为隔夜，公开市场隔夜回购利率将成为主要政策利率；同时推动贷款定价基准改革，退出存贷款基准利率。今天上午，人民银行公告10月21日至11月2日每日开展隔夜逆回购，固定利率、数量招标，每日上限1万亿元；今天的7天期逆回购操作量为零，到期650亿元，净回笼650亿元；LPR同日公布，1年期3.0%、5年期以上3.5%，连续第17个月不变。债市的反应是：国债期货全线收涨，30年期主力合约涨0.63%，Shibor隔夜和7天均为5月以来新低。股票这边没有同方向的反应：沪深300跌0.5%，恒指跌1.3%，只有中证1000、北证50这类小盘指数涨得多（见第1节）。先回看10月16日的判断：当天写的是“托底只挡住了收盘的大跌，挡不住下行”，条件是10月19日股票ETF继续净流入、而上证和创业板指不再创新低才算托底有效。结果是两头各占一半：股票ETF周一净流入246亿元，上证连续3日收高于年内最低收盘；创业板指周一、今天连续创年内最低收盘。托底在大盘指数上生效，在成长股上暂时没有。 A股： 上证收3,735点，涨0.1%；沪深300跌0.5%；创业板指跌0.3%；科创50涨1.0%；中证1000涨1.0%；北证50涨3.9%。沪深两市成交1.46万亿元，较周一放量约186亿元。上涨3,777家、下跌1,668家、平盘123家（沪深A股，不含北交所）。涨停家数54家、跌停家数6家。 A股与港股复盘 2026年10月20日 研究笔记 · 不构成投资建议 第 2 / 13 页 港股： 恒生指数收23,868点，跌1.3%；国企指数跌1.2%；恒生科技指数跌1.5%。恒指成交1,904.5亿港元，较10月16日的1,782.1亿港元增约6.9%。港股周一因重阳节休市，今天是节后首个交易日。 货币与汇率： 人民银行今天7天期逆回购操作量为零，到期650亿元，净回笼650亿元；10月21日起连续开展隔夜逆回购（见第4节）。人民币中间价6.7200，较前一日6.7208调升8个基点。在岸即期约6.678，离岸CNH约6.678，两者几乎无差；中间价弱于在岸即期约423个基点。美元指数约101.8，较上一收盘跌0.2%。 互联互通： 北向成交2,094.9亿元，较10月16日的2,252.7亿元缩约7.0%（周一港股休市、沪深股通停做，故与周五比），净额未公布。南向成交765.1亿港元，较10月16日的654.0亿港元增约17.0%；全天净卖出17.2亿港元，10月16日净卖出35.7亿港元，方向未变。连续第5个交易日净卖出，5日累计净卖出109.6亿港元。 大波动： 内地方面，恒玄科技（688608.SH）、长盈精密（300115.SZ）、迪安诊断（300244.SZ）均涨20.0%；莱美药业（300006.SZ）跌15.5%，粤芯半导体（301660.SZ）跌13.5%。港股方面，五一视界（06651.HK）涨22.2%；联想集团（00992.HK）跌10.0%，紫金黄金国际（02259.HK）跌9.3%，宁德时代（03750.HK）跌6.6%。 技术： 上证收盘在20日布林下轨之上，20日、50日、100日、200日均线之下；恒指亦在20日布林下轨之上、20日均线之下（详见第1、2节图）。 驱动： 周一国家统计局公布三季度GDP同比增长4.5%，港股今天是这批数据后的首个交易日。摩根大通下调宁德时代H股评级，美国国土安全部拟将DeepSeek产品排除出联邦采购（见第2节）。周小川今天在外滩年会上称，应对AI领域投资失败引发的金融风险做好预案。沪深15:00、港股16:08均已收盘。 外盘 / 商品 / 国债： 美股三大期货亚洲时段涨跌互现，纳指期货跌；原油涨、黄金回落，美债收益率较周一收盘小幅回落，中国10年期国债收益率持平（数字见第4节）。 A股与港股复盘 2026年10月20日 研究笔记 · 不构成投资建议 第 3 / 13 页 1. A股 指数 收盘 开 / 高 / 低 当日 成交额 上证指数 3,735 +0.1% 6,999.7亿 深证成指 11,801 −0.1% 7,561.4亿 沪深300 4,152 −0.5% 3,962.3亿 创业板指 2,739 −0.3% 3,744.9亿 科创50 1,342 +1.0% 752.7亿 中证500 6,841 +0.6% 2,510.1亿 中证1000 6,767 +1.0% 2,814.0亿 上证50 2,766 −0.3% 1,219.0亿 北证50 983 +3.9% 155.3亿 债市读成降息，股票为何未跟。盘面给出的答案是，股票今天交易的不是利率，而是权重股与小盘股各走各的。沪深300下跌，中证1000涨1.0%，两者相差1.56个百分点；近1,499个交易日里，该差距达1.5个百分点以上的约每20个交易日一次，且同日沪深300跌0.4%以上的约每43个交易日一次。权重一侧，宁德时代、中际旭创、新易盛为创业板指前三大拖累，寒武纪、拓荆科技、中科飞测、长鑫科技压着科创板（东方财富转引Wind资金流向）；小盘一侧，机器人概念10余股涨停，端侧AI、食品饮料盘中异动拉升。市场涨多跌少，上涨3,777家对下跌1,668家，约2.3比1，指数却只是持平，这就是权重股在跌、个股在涨。银行股周一全线飘红，今天跌幅居前，与债市“变相降息”的读法方向相反。 A股与港股复盘 2026年10月20日 研究笔记 · 不构成投资建议 第 4 / 13 页 分时看，托底仍在。上证上午10:48最高3,740点，14:04最低3,703点，较前收低0.75%，之后尾盘拉回收红；沪深300最低在14:14，较前收低1.45%，收盘收窄至−0.54%；创业板指14:13最低跌1.41%，收盘跌0.26%。Wind资金流向显示，10:48前机构资金流入，午后转为卖出，14:12后才有资金回流。尾盘买盘集中于上证50ETF华夏：全天成交75.3亿元，临近收盘20分钟内成交超40亿元；10月16日承接最多的沪深300ETF华泰柏瑞今天仅成交44.6亿元，约为10月16日161亿元的28%，14:45后成交占比不到一成。托底资金换了通道，上证50ETF成交量也不大，托住的是大盘指数收盘价。 资金面累计：全市场股票ETF自9月28日起连续11个交易日净流入，10月16日净流入256.1亿元，周一净流入246亿元（其中宽基ETF 212亿元，中证500、中证1000、沪深300指数ETF分别净流入47.8亿、41亿、36.3亿元），加上此前累计至10月15日的1,408.5亿元，合计约1,910.6亿元（三个Wind数字相加，今天数据待明日公布）。同期创业板指继续下行，今天收2,739点，连续第3个交易日创年内最低收盘（10月16日、19日、20日），RSI(14)仅18.6。 上证开3,718点，最高3,740点，最低3,702点，收3,735点，较20日布林下轨3,683点高52点；仍在20日均线3,832点、50日均线3,889点、100日均线3,943点、200日均线4,004点下方，RSI(14)为32.7，已回到30以上。上证连续3日收高于10 边际信号更趋积极：AI算力瓶颈正从单一GPU向“系统级约束”扩散，半导体设备、测试、先进封装及材料环节的机会广度与深度均被市场低估。我们重申对半导体设备（WFE）板块“超配”观点，预计2026-2028年WFE复合增速将维持在30%以上，测试设备（TAM）与半导体材料有望成为下一阶段超额收益的核心来源。 关键逻辑与数据拆解 1. WFE（半导体设备）高景气再获确认，Terafab与DRAM双轮驱动 供应链反馈显示，头部存储原厂正要求设备供应商按每年5000亿美元WFE规模备产，此数字远超市场一致预期。核心支撑来自DRAM的超级周期：行业DRAM产能预计在2029年中期达到300万片/月（wsm），2031年突破400万片，部分设备商订单已排至2030年。 Terafab（英特尔主导的激进产能计划）是展會最大焦点，其要求设备“定制化”重构晶圆流片架构，这可能倒逼英特尔在2027年及以后显著上调资本开支与设备采购，为设备商带来增量上行空间，该因素目前被市场在讨论Terafab时忽略。 此外，因更多客户寻求英特尔EMIB-T产能，台积电可能明年开始削减对英特尔的晶圆分配，这将进一步强化英特尔本土扩产的必要性，形成设备端的正向循环。 2. 测试设备：泰瑞达（TER）与爱德万（Advantest）极度乐观，TAM被严重低估 两家测试龙头均表示需求“异常强劲”，且单位测试强度（Test Intensity）将呈数量级提升。驱动因素包括： ◦ 亚马逊Trainium芯片晶体管密度更高、HBM含量提升、任务模式测试更复杂，导致单颗芯片测试时间大幅拉长； ◦ 谷歌TPU业务放量，泰瑞达在此客户的份额有望长期超越亚马逊，成为最大增长极； ◦ 供应链信号显示，两家设备商的工具产量有望从2026年下半年到2028年下半年翻倍，这甚至高于我们此前对泰瑞达收入增长超80%的“街面最乐观模型”。 我们判断，市场对测试设备“可服务市场（TAM）”的扩张幅度存在显著认知差，该板块具备持续上修盈利预测的潜力。 3. 半导体材料：晶圆开工数即将迎来拐点，或成AI供应链下一大瓶颈 行业月度硅晶圆开工数（MSI）在2026年二季度已超越2021年水平，距2022年历史高点仅差约3%。2026年10月标志着设备短缺正式出现，此前设备商基本能满足月度计划排产，而接下来短缺将“旋转”至材料环节。 关键细节：约55%的MSI关联前道制程，而晶圆产量刚接近前高；同时材料强度（Materials Intensity）每节点提升约25%（以Entegris为例），这意味着即使硅片出货量持平，材料需求仍会自然增长。我们提示，市场仅看硅片巨头（如SUMCO、环球晶圆）的出货量会严重低估真实材料需求，材料板块（Entegris、Versum等）的供应约束可能被当作“隐形瓶颈”而重估。 4. OCP峰会：AI瓶颈外移，网络、光互连、电源与散热打开新空间 大会核心共识与年初AI Infra Summit一致：集群规模扩大后，性能瓶颈已从GPU本身转移至周边系统。 ◦ 网络与光互连：102.4T交换、800G/1.6T连接成为基线，线性可插拔光学（LPO）、近封装光学（NPO）及CPO讨论热度飙升，光引擎从“可选项”变“必选项”。 ◦ 电源架构：机柜密度突破临界点，800VDC高压配电从边缘话题重回核心，电源转换、储能与保护器件价值量显著提升。 ◦ 液冷：从“独立决策”变为“机柜基础架构”标配。 ◦ 推理/智能体负载：推动CPU、内存与数据搬运需求再评估，异构计算成主流。 整体看，OCP并未改变AI基础设施方向，但强化了“解约束即增量为王”的逻辑，半导体内容机会从加速卡向全系统扩散。 5. 重点公司交流精要 ◦ Marvell（MRVL）：互联业务假设可能比市场认知更保守。Scale-out仍是基本盘，若仅此板块增长50%即可达成大部分增长目标；Scale-up光学（目前无大量出货）若超预期落地，将带来显著上行。XPU定制业务空间被低估（当前$300亿机会假设每颗XPU仅绑定不到2颗配套芯片，实际可能更高），微软Maia芯片若按GW级部署，对MRVL是潜在巨大增量。我们判断市场不太可能以$30 EPS作为基准情形，但scale-out足以托底，上行空间来自scale-up与定制芯片。 ◦ Astera Labs（ALAB）：正从PCIe Retimer向“机架级异构互联平台”转型。新发布的Orion参考架构（面向Neocloud与企业）主打“无论客户用什么加速器都能快速部署”，宣称性能提升约50%、内存卸载提升25%。长期看，其正在研发的连接NVLink Fusion与UALink的桥接芯片（每颗XPU可能配一颗）若成功，将打开巨大单机内容量；光产品（Aries 7进入NPO/LPO）亦在布局。但短期需验证其在非Retimer市场的份额获取能力，我们维持“中性”但密切关注执行。 ◦ 英特尔（INTC）：数据中心GPU路线图大幅重构，Crescent Island更名为D-Series GPU，聚焦推理场景，强调内存容量与能效（1.3 PFLOPS FP8、1.5TB/s带宽、480GB LPDDR5X、350W），目前客户送样中但未给出大规模可用日期。我们认为这是重返加速器的“鼓励性第一步”，但距离形成有意义的 franchise 仍需要看到量产爬坡与真实客户采用率，维持“中性”评级。 投资含义与策略建议 在“AI资本开支从集中走向分散、从算力走向系统”的阶段，我们的配置思路如下： • 超配：半导体设备（AMAT、LRCX、KLAC）、测试设备（TER、ATE）、先进材料（ENTG）；这些环节兼具“确定性增长+供给约束”双重属性。 • 精选成长：MRVL作为“互联+定制XPU”核心载体，回调即具备风险收益比；ALAB适合作为“异构AI基础设施”的卫星仓位，但需跟踪Orion落地与桥接芯片进展。 • 观察与规避：单纯依赖GPU通用算力的设计公司相对吸引力下降；英特尔需看到D-Series量产数据后再考虑评级上调。 • 主要下行风险：①宏观衰退导致云厂商资本开支指引下修；②美国大选年政策波动（出口管制/本土含量要求突变）；③材料与设备交期过长引发下游“产能错配”；④先进封装与光引擎技术路线竞争导致份额流失。#文字观点", "publish_time": "2026-10-20 21:06", "tags": ["文字观点"]}, "post:2026-10-20T15-26:e1985ffe1b19": {"id": "post:2026-10-20T15-26:e1985ffe1b19", "kind": "post", "title": "2026-10-20 15:26", "source_label": "帖子正文", "excerpt": "📄中国 DRAM 是否正在成为实质性竞争威胁 📰 中国存储威胁再度浮出水面，但现阶段无需过度担忧，成本效率与良率问题仍有待解决。📈2026 年第四季度 DRAM 价格展望向好，同时 HBM4 产品发展势头强劲。", "content": "📄中国 DRAM 是否正在成为实质性竞争威胁 📰 中国存储威胁再度浮出水面，但现阶段无需过度担忧，成本效率与良率问题仍有待解决。 📈2026 年第四季度 DRAM 价格展望向好，同时 HBM4 产品发展势头强劲。⭐ 我们优先看好三星电子，维持买入评级，目标价 45 万韩元。 ⚠️ 中国存储竞争威胁再度引发市场关注：受中国 DRAM 制造公司追赶技术、打破 DRAM 寡头格局消息影响，存储板块股价过去两天下跌。 📰 根据 10 月 12 日《每日经济》报道，长鑫存储将在 2026 年末完成基于 4F² 单元结构的服务器 DRAM 开发，该技术从原有 6F² 迭代而来，较韩国厂商规划时间提前 2‑3 年。 📌 韩国厂商计划 2028 年及以后，在 10a/10b 工艺节点采用 4F² 垂直通道晶体管结构，而美光则选择直接向 3D DRAM 路线推进。 🔍 虽然从长期维度来看该事件具备负面影响，但对行业格局的短期冲击有限。 📋 当前对应的 JEDEC 行业标准尚未确立，同时还需要与 CPU 制造公司开展漫长的产品验证流程。 🧐 我们判断未来 2‑3 年，该事件对存储芯片价格以及行业竞争格局带来的影响有限，近期股价回调反而给存储板块股票带来更好的风险收益比，目前还没到需要担忧的阶段。 ❗ 当前公开可获取信息有限，还不足以评估最终影响；想要形成实质性行业冲击，还必须解决两大核心问题：第一是成本效率；第二是生产良率。🔧 假设长鑫存储采用传统 14‑15nm 深紫外光刻技术，实际等效制造工艺为 12‑13nm。 ⏱️ 该工艺下光刻曝光步骤会增加，制造周期相比原有方案要多出 30‑50%。 ⚠️ 实现可接受的大规模量产良率是另一项关键难题；尤其是处在 DRAM 下行周期之中，良率偏低会成为非常显著的竞争劣势。 🔬 DRAM 行业正在发生三大主要技术变革，最终演进方向指向 3D DRAM。 📉 随着工艺微缩难度提升、良率水平下滑，市场对 3D DRAM 技术的需求正在逐步显现。 ✨ 三大技术发展方向：1、从横向 6F² 单元转向 4F² 结构，采用垂直栅极；2、晶圆堆叠技术，把晶体管和外围电路分离开，实现更高效的 3D 堆叠；3、在外围电路采用鳍式场效应晶体管 FinFET 技术，替代 HKMG 工艺，在 10nm 以下节点改善沟道控制能力。📐 得益于单元结构效率提升，4F² 技术可以把芯片面积缩减大约 30%；源头内容加微WUXL3408而垂直栅极技术未来还有望实现无电容 DRAM 架构。 🚧 向 3D DRAM 转型的一大障碍，是用于存储开关状态的电容元件需要被替代。 🔭 我们预计 5‑10 年之内，行业会逐步向浮体单元、浮栅单元这类无电容、垂直栅极技术路线演进。 💰 2026 年第四季度 DRAM 价格前景向好，HBM 业务发展势头强劲。 📊 受 Vera Rubin 平台、ASIC 加速器需求旺盛驱动，更多 DRAM 产能被分配至 HBM 产品，供给紧张将推动 2026 年第四季度 DRAM 价格实现高个位数百分比的涨幅。 🛒 需求端两大支撑因素：1、新款 iPhone（含折叠机型）发布之后，高端智能手机销售表现走强；2、SO‑CAMM2 产品供给爬坡，会进一步拉动普通消费级 DRAM 价格。#文字观点", "publish_time": "2026-10-20 15:26", "tags": ["文字观点"]}, "post:2026-10-20T17-37:a7c356d2da75": {"id": "post:2026-10-20T17-37:a7c356d2da75", "kind": "post", "title": "2026-10-20 17:37", "source_label": "帖子正文", "excerpt": "20261020今日段子汇总 1、凡拓数创：公司成功中标“广东省具身智能训练场建设项目一期综合调度中心项目”及“深圳国创具身智能机器人公司仿真平台开发服务项目”，实现了物理AI核心软件产品的独立对外输出 2、长盈精密：1、公司自身为国内结构件龙头，与figure AI是合作关系，为其提供人形机器人零", "content": "20261020今日段子汇总 1、凡拓数创：公司成功中标“广东省具身智能训练场建设项目一期综合调度中心项目”及“深圳国创具身智能机器人公司仿真平台开发服务项目”，实现了物理AI核心软件产品的独立对外输出 2、长盈精密：1、公司自身为国内结构件龙头，与figure AI是合作关系，为其提供人形机器人零组件；2、公司表示与谷歌合作十年，正配合开发新品 3、九阳股份：公司是国内小家电行业领导品牌，聚焦厨房小家电主业，产品涵盖豆浆机、料理机等，行业地位领先；公司目前持有深思考机器人7.92%股权，该公司深耕类脑人工智能与多模态语义理解技术 4、长春一东：公司是中兵集团旗下上市企业，东北工业集团唯一上市平台，是兵器工业集团旗下市值最小的上市公司，兵器工业集团将重装亮相第十六届中国航展 5、京城股份：1、公司智能制造板块主要产品包括机器人集成应用和冲压连线产品等；2、公司气体储运板块拥有燃料电池用铝内胆碳纤维全缠绕复合气瓶等产品，可提供氢能储运系统解决方案；3、公司拥有亚洲最大的高压储氢气瓶研发生产基地，自主研发的35MPa高压储氢气瓶已广泛应用于氢燃料电池汽车及燃料电池备用电源领域 6、大业股份：1、公司人形机器人灵巧手用钢丝尚处于市场调研和研究开发阶段；2、公司投资联营企业湖北三江航天江北机械工程主要从事航天动力系统、天线罩等航天型号产品及特种压力容器产品、高端机电成套装备、先进激光应用设备等民用产品 7、东安动力：1、公司低空经济全速争先，增程发动机已成功配套飞行汽车，转子发动机与近三十家客户达成合作意向；2、兵器装备集团旗下，公司为拥有发动机、新能源增程动力系统、传动系统三大平台，提供新能源动力传动系统一体化解决方案 8、海洋王：公司是深海特种照明设备供应商，技术延展至水下机器人及探测装备，适配全海深场景‌ 9、慕思股份：公司主要从事健康睡眠系统的研产销，主要产品包括中高端床垫、床架、床品和其他产品，其中床垫为公司核心产品 10、宁波东力：公司重点布局谐波减速器与精密行星减速器，相关产品已实现批量试样及供货，配套业务进入产业化落地推进阶段 11、浙江荣泰：公司上半年已向国内外客户交付机器人零部件，正推进泰国生产基地建设和产能搭建 12、海正药业：中国最大的抗生素、抗肿瘤药物生产商之一，前三季度净利润同比增长约149.46% 13、科森科技：1、公司为某品牌家用机器人提供相关结构件；2、公司与清陶能源共同投资设立了合资公司——科森清陶能源科技有限公司，专注于固态电池的集成、组装和系统集成等业务 14、福莱新材：公司向全球灵巧手领军企业灵心巧手累计交付超3万套触觉传感器 15、润建股份：公司签下2亿美元AI词元大单 16、长裕集团：公司高纯氧化锆制品具有高绝缘性、高强度及导热特性，可用于HBM、SSD等存储芯片封装的陶瓷载板、散热底座等部件 17、南威软件：1、短剧业务方面，公司首部海外AI短剧将于26年8月发行，2026年下半年预计出品25部高质量AI短剧，并按年产超100部的产能规划持续推进；2、公司以人工智能重构 ，下一轮更庞大的机会来自物理AI，物理AI的核心是训练系统、仿真系统、端侧计算系统，而英伟达能够同时提供三个层面的完整技术栈，公司也在持续投资机器人基础模型、数字孪生、工业软件和边缘计算；2）Oepn AI：9月2日，奥特曼接受采访表示公司一定会参与机器人，但是核心难点是机器人大脑，这也是公司的重点突破方向，同时open ai公司近期新推出27个机器人相关岗位；3）特斯拉：10月17日，马斯克采访中表示：AI和机器人是解决国家债务的唯一途径；与此同时，Optimus供应链周产不断向上爬坡；4）全国首个物理AI与世界模型大会今日启幕：10月19日至22日，由江苏省数据集团、南京大数据集团、中国人工智能学会主办的2026物理AI与世界模型大会在南京国际博览中心举行，将发布一系列物理AI与世界模型领域标志性成果。 #最新前沿大模型在物理AI自上而下涌现泛化能力 1）GPT-6 Astra没练过机器人，看三路摄像头直接控机器人双臂积木入碗，成功率95%，Fable 5.1仅有40%；2）利用Gemini 4 Argon教Apollo人形机器人玩豆袋投投游戏，只给它一段人演示的视频，然后它接管了机器人，生成自己的模拟环境，执行了一些系统识别，然后在真实机器人上训练投掷动作，它花了几次真实投掷来改进，然后连续命中了许多空中邮袋。#特斯拉量产提速特斯拉机器人团队9月底完成大审厂，对供应链下单快速爬坡。根据我们产业链调研，Optimus周产目前在向1000台+的水平推进，并计划于年底达到2500台。特斯拉有望在Q4发布Optimus V3，将人形机器人产业发展带入新的阶段！ 1、特斯拉产业链 总成：三花智控、拓普集团、新泉股份（潜在） 减速器：斯菱股份、双环传动、科达利； 丝杠：浙江荣泰、恒立液压、北特科技等； 电机：恒帅股份、鸣志电器； 结构件：福赛科技、模塑科技、旭升集团、均胜电子、岱美股份、日盈电子、恒勃股份、科森科技、万向钱潮等； Tier-2：宁波东力、五洲新春、铁流股份、正强股份、凯迪股份、肇民股份、恒辉安防、金沃股份等； 2、国产本体 YSKJ、优必选/锋龙股份、上纬新材、胜通能源（七腾机器人）。#文字观点", "publish_time": "2026-10-20 13:38", "tags": ["物理AI再次成为全球焦点", "特斯拉量产提速", "文字观点"]}, "post:2026-10-20T10-31:a80a124350c5": {"id": "post:2026-10-20T10-31:a80a124350c5", "kind": "post", "title": "2026-10-20 10:31", "source_label": "帖子正文", "excerpt": "📈📈📈【华创计算机】物理AI：行业端迎来变化，关注#五一视界、索辰科技1）物理AI进入\"硬核验证期\"：工信部10月19日披露，上半年我国人形机器人整机产品突破400款、产量超4万台，全年预计突破10万台，已在300多个场景部署验证；海外方面，#OpenAI于10月正式确认自研人形机器人，奥尔特曼称2", "content": "📈📈📈【华创计算机】物理AI：行业端迎来变化，关注#五一视界、索辰科技1）物理AI进入\"硬核验证期\"：工信部10月19日披露，上半年我国人形机器人整机产品突破400款、产量超4万台，全年预计突破10万台，已在300多个场景部署验证；海外方面，#OpenAI于10月正式确认自研人形机器人，奥尔特曼称2027年将推出演示样机，招聘已覆盖运动控制、执行器等27个岗位；#特斯拉10月15日首次演示Optimus实车驾驶，马斯克明确特斯拉定位为\"物理AI公司\"。 2）五一视界（06651 HK）：上半年营收1.24亿元、同比大增129.8%，其中物理AI核心收入51Sim达5123.8万元、同比暴涨545%，收入占比从14.8%升至41.4%，毛利率提升至44.78%，亏损同比收窄25.5%。#8月发布的51WorldModel\"物理直觉\"世界模型及具身新品AperData、AperOne快速兑现——具身智能业务发布仅一个月订单即突破2亿元，90%计划年内交付； 3）索辰科技（688507）：A股稀缺\"CAE+物理AI\"标的，上半年营收同比增长26.83%、二季度单季增速近80%，研发投入大增67.53%，正式发布物理AI大模型\"营造·万象\"，物理AI相关收入已突破5800万元，#超额完成股权激励设定的5000万元年度目标；在手货币资金超13亿元。产品端，其世界物理模型以高精度仿真推演力、热、流体等深层物理场，联合美梦空间发布的Physical-WAM物理-世界动作模型与RoboTwin-Phys测评 FORMATION ABOUT TESLA AND THE MATTERS TO BE VOTED ON AT THE 2026 ANNUAL MEETING. Shareholders are able to obtain free copies of these documents, and other documents filed with the SEC by Tesla, through the website maintained by the SEC at www.sec.gov. In addition, shareholders are able to obtain free copies of these documents from Tesla by contacting Tesla’s Investor Relations by e-mail at ir@tesla.com, or by going to Tesla’s Investor Relations page on its website at ir.tesla.com. Participant Information Tesla, its directors (Elon Musk, Robyn Denholm, Ira Ehrenpreis, Joe Gebbia, Jack Hartung, James Murdoch, Kimbal Musk, JB Straubel and Kathleen Wilson-Thompson), and certain of its executive officers (Vaibhav Taneja and Tom Zhu) are deemed to be “participants” (as defined in Section 14(a) of the Securities Exchange Act of 1934, as amended) in the solicitation of proxies from Tesla’s shareholders in connection with the matters to be considered at the 2026 Annual Meeting. Information about the compensation of our named executive officers and our non-employee directors is set forth in the sections titled “Executive Compensation for Fiscal Year 2025” and “Compensation of Directors” in the Definitive Proxy Statement. Information regarding the participants’ holdings of Tesla’s securities can be found in the section titled “Ownership of Securities” in the Definitive Proxy Statement. Tesla © 2026 VoteTesla.com. . . . . wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-20T15-23:d32d052a36a8": {"id": "post:2026-10-20T15-23:d32d052a36a8", "kind": "post", "title": "2026-10-20 15:23", "source_label": "帖子正文", "excerpt": "📑电池研讨会核心要点 📊市场现状：2026 日历年锂电池市场预计同比增长 31%，规模达到 2.4 太瓦时 📈储能系统（ESS）以及不间断电源（UPS）市场将成为主要增长动力，预计同比增长 81%，规模达 1.0 太瓦时；乘用车新能源汽车需求同样贡献增量。", "content": "📑电池研讨会核心要点 📊市场现状：2026 日历年锂电池市场预计同比增长 31%，规模达到 2.4 太瓦时 📈储能系统（ESS）以及不间断电源（UPS）市场将成为主要增长动力，预计同比增长 81%，规模达 1.0 太瓦时；乘用车新能源汽车需求同样贡献增量。 💨发电侧储能需求增长，背后由风电、光伏等可再生能源普及所驱动，也就是表前储能。 ⚡与此同时，客户也利用电池存储电网的电力，根据电价差异，从直接使用电网供电转向储能电池供电的需求正在上涨，即表后储能。 🖥️在数据中心场景，受电网供电能力约束，自建发电设施搭配储能系统的模式正成为行业主流。 📋研讨会背景信息 🤝我们邀请 B3 公司总裁兼首席执行官竹下英夫作为分享嘉宾。 🔋松下是备用电池单元（BBU）市场的龙头。虽然其竞争力背后的大量关键因素属于未公开黑盒信息，但从服务器兼容性以及可靠性角度来看，超大规模云服务商仍然会优先选择松下产品。 ✨松下预计将继续维持上述优势，下一代产品还会集成电容，该发展方向和松下在投资者关系活动当中给出的 2028 财年 1 万亿日元销售目标相契合。 🔍不过无耳电池技术未来存在被采用的可能性，B3 公司正在评估安普瑞斯（Amperex Technology 与 TDK 成立的合资公司）的相关技术，我们认为这会是中期的重点观察方向。 📝下文整理竹下英夫先生的主要观点。 💰电池制造公司盈利环境 💵当前储能系统的每千瓦时单价约为 50‑60 美元，高于车用电池的价格水平。 🏭从市场份额角度，车用电池市场由三家公司主导，合计市占率 65%：宁德时代（接近 40%）、比亚迪、LG 新能源。 📊储能系统市场参与公司数量更多。龙头宁德时代市占率约 25%，前六大公司合计市占率达到 67%。 🚗车用场景当中，电池选型由整车厂的产品思路、整车设计、动力总成配置以及电池布置位置来决定。 📦而对于储能系统，核心考量指标是 20 英尺集装箱内部可以装入多少电池，其余规格参数重要性相对更低。 ⚖️储能系统供需层面没有产能约束，一部分原因来自车用市场景气偏弱，源头内容加微wuxl3408但受旺盛需求拉动，储能电池价格正在上行。 📈最终带来储能业务盈利能力处于较高水平，当前市场环境对于电池制造公司极为有利。 🔎储能系统市场发展趋势 📦随着适配 20 英尺集装箱的电池走向标准化，各家公司供应的电芯大体相似，活性物质、电解液的配方改动幅度不大。 ⚙️主流电芯规格从最初的 280 安时迭代至近期的 314 安时、320 安时，宁德时代、亿纬储能、海辰储能基本都遵循这一发展趋势。 📑2025 日历年储能系统锂电池出货量约 560 吉瓦时，但实际储能系统装机量仅 305.8 吉瓦时，数据来源为中国新型储能产业创新联盟 2026 白皮书。 ⏱️储能产品交付周期为 3‑12 个月，在需求上行阶段，如果不提升提前采购规模，供给就会跟不上需求扩张。 📉仅从统计数据看，出货量与实际装机量之间存在较为明显的缺口。 📊行业的在手订单 / 出货比值目前为 1.2‑1.3 倍，但未来该比值存在回落至 0.7‑0.8 倍的可能性。 📈即便出现上述情况，新增需求依旧有望保持增长，新能源汽车应用会继续拉动需求。 🖥️数据中心市场与备用电池单元（BBU） 🔌服务器与存储设备约占数据中心总耗电量的 60%，冷却空调以及其余设备消耗剩下 40% 的电力。 🔋承担供电备份任务的不间断电源，主流配置为铅酸蓄电池。 📏备用电池单元暂无精确市场统计数据，未来几年市场规模最高可能仅 2‑3 吉瓦时，和车用电池市场相比体量小很多。 ⭐松下在备用电池单元市场市占率约 80%，产品使用原本面向电动工具开发的 18650 电芯。 ⚡电动工具电芯设计优先考虑输出性能公众号小牛研报纪要，而非储能能力，单位容量的价格，比前文提到的 50 美元每千瓦时的储能电池高出 50‑60%。 🧪从电池技术本身来看，除松下以外其他公司的 18650 电芯理论上也可以用于备用电池单元。 ⚠️但电芯都具备独有的特性，在实际输出备份电力的场景当中，其他品牌电池会暴露出短板。 🔒造成该差异的底层因素属于未公开黑盒信息，因此松下电池凭借可靠性受到市场青睐。 🎯备用电池单元重点关注方向 🔄随着图形处理器以及供电架构迭代，备用电池单元也会向第二代、第三代演进。 ❓第二代备用电池单元是否会采用无耳或者多极耳电池还存在不确定性。 📊根据 B3 公司的分析，安普瑞斯的电池在内阻以及电芯技术层面具备优势。 🤔不过超大规模云服务商是否选用安普瑞斯电池，取决于它和松下 “电池 + 电容” 方案以及黑盒模组方案之间的对比结果。 🧪数据中心电池关键技术路线 🛡️考虑安全性与循环寿命，磷酸铁锂电池是电池储能系统（BESS）的优选方案。 🏗️不间断电源场景对设备安装重量、占用面积要求不高，铅酸电池依旧是主流。 💡也有观点提出，三元锂电池可以作为锂电池备选方案，但受高昂价格影响，该路线没有获得市场实际推广。 📐受尺寸条件限制，磷酸铁锂电池并不适合备用电池单元场景，三元、镍钴铝电池是该场景下的主要技术方案。#文字观点", "publish_time": "2026-10-20 15:23", "tags": ["文字观点"]}, "post:2026-10-20T13-40:51652625bf11": {"id": "post:2026-10-20T13-40:51652625bf11", "kind": "post", "title": "2026-10-20 13:40", "source_label": "帖子正文", "excerpt": "湖南裕能深度报告推荐：重新审视铁锂龙头的长期竞争力经营复盘：盈利能力显著超越行业平均水平。公司26Q2铁锂单吨扣非利润约0.44万元，显著好于市场预期，公司通过自身产品溢价、成本管控等措施，保持稳定的单位利润。", "content": "湖南裕能深度报告推荐：重新审视铁锂龙头的长期竞争力经营复盘：盈利能力显著超越行业平均水平。公司26Q2铁锂单吨扣非利润约0.44万元，显著好于市场预期，公司通过自身产品溢价、成本管控等措施，保持稳定的单位利润。从历史复盘来看，公司单位利润长期保持较同行2000元以上单吨利润的领先优势。维度一：高端化产品攫取更高加工费溢价。公司在业内率先稳定量产压实密度在2.6g/cm³+、具备6C快充性能的YN系列产品，支持新能源汽车长续航及快充充电；CN系列产品提供长循环寿命、高安全性、高能量效率及性价比，已批量应用在下游高端储能场景。从销量来看，2024/2025/2026H1公司高端产品销量占比分别达到22%/52%/62%，提升速度明显；高端铁锂通常较普通产品存在更高的溢价维度二：多元化市场及客户提升抗风险能力和议价权。多元化市场布局以及客户结构的分散正在持续提升公司市场议价能力：1）公司加大储能领域的产品布局和市场开拓，应用于储能领域的出货占比逐年提升；2024/2025/2026H1公司储能领域出货占比分别达到41%/45%/53%。2）公司的客户集中度正在逐年下降；2026Q1公司前五大客户集中度约63.6%，其中前两大客户宁德时代和比亚迪合计占比仅47.7%，较2023年的84.9%显著下降。市场及客户结构的多元化，便于公司在与下游的商务谈判上取得更好的议价地位维度三：一体化布局持续深入，成本优势有望逐渐显现。公司是铁锂行业中一体化布局程度最深的企业，主要体现在：1）前驱体磷酸铁100%自供，磷源、铁源涨价，公司自产磷酸铁优势逐渐体现。2）磷矿端，公司自有黄家坡、打石场两大磷矿资源，远期生产规模合计370万吨/年；若完全达产预计可保障公司约185-205万吨磷酸铁锂需要的磷源；黄家坡磷矿预计今年可以实现大规模投产。3）锂资源端，公司通过设立子公司湖南裕能循环，已具备7万吨碳酸锂加工产能，2026H1已实现收入45.55亿元，净利润3.98亿元，对应净利率8.74%，取得较好收益我们认为，作为铁锂龙头，公司的长期竞争力和市场价值当下显著被低估，相较于上一轮行业周期，公司在高端化占比、多元化市场及客户、一体化深度布局等领域打造了更加坚实的护城河，有望支撑单位盈利长期保持行业领先水平。我们预计公司2026-2028年归母净利润分别至61.81/74.91/89.84亿元，对应PE分别为6/5/4x；继续推荐，维持“买入”评级！#文字观点", "publish_time": "2026-10-20 13:40", "tags": ["文字观点"]}, "attachment:files/宁德时代2026 Q3业绩会全文 20261020.pdf": {"id": "attachment:files/宁德时代2026 Q3业绩会全文 20261020.pdf", "kind": "attachment", "title": "宁德时代2026 Q3业绩会全文 20261020", "source_label": "其他", "excerpt": "宁德时代 2026 Q3业绩会全文 发言人0: 在会议开始前，我们提示各位投资者，在公司领导发言结束后，将留有提问时间。下面有请 主持人发言，谢谢。", "content": "宁德时代 2026 Q3业绩会全文 发言人0: 在会议开始前，我们提示各位投资者，在公司领导发言结束后，将留有提问时间。下面有请 主持人发言，谢谢。 发言人1: 尊敬的各位投资人，晚上好，我是宁德时代林美娜。欢迎各位投资人参加宁德时代 2026年 三季报业绩交流会。感谢大家一直以来的支持和关注。首先由我向各位投资人介绍公司出席 领导。出席本次会议的有公司董事会秘书兼副总经理蒋理先生、 CFO郑舒先生。今天会议流 程分成两部分，首先由我为各位简单汇报报告期内公司经营情况，而后进入问答互动环节。 2026年第三季度，公司实现收入 1652.2亿元，同比增长 58.6%，归属上市公司股东的净利 润212.5亿元，同比增长 14.5%。 期末货币资金及交易性金融资产合计超 4300亿元，现金储 备充裕。动力领域，国内新能源 乘用车和商用车电动化率持续提升。 9月份新能源乘用车单月电动化率达到了 65%，新能源 中重卡电动化率达 50%。虽然国内乘用车销量有一定压力，但得益于电动化率和单车带电量 的提升，国内乘用车动力电池需求仍实现了持续增长。根据动力电池联盟数据， 1~9月国内 动力电池装机量同比增长 17%。欧洲新能源乘用车电动化率持续提升，根据 ACEA数据，1~8 月欧洲新能源乘用车累计销量同比上升 33.28%，8月单月电动化率到了 40%。 公司动力电池市场份额持续保持全球领先。根据 SNE数据，2026年1~8月，公司动力电池 使用量全球市场占有率为 39.4%，同比提升 1.7个百分点。根据动力电池联盟数据， 2026 年1~9月，公司国内动力电池市占率达 44.16%，同比提升 1.41个百分点。公司持续深化 To C品牌战略，品牌影响力与消费者认知度显著提升。据尼尔森 IQ 2026年全球新能源车消费 者研究报告， 37.1%的中国消费者表示若意向车型未搭载公司电池，将放弃购买。电池品牌 已成为整车购买决策的关键因素， 公司电池亦是消费者主动咨询与汽车销售积极推荐的首选 品牌。 品牌认知度与市场份额形成了良性互动，为公司长期发展构筑 了坚实的品牌护城河。报告期 内，公司发布天行 2模块化商用车电池平台，覆盖重卡、轻商、客车及换电等多元场景。其 中重卡版本最高续航达 1000公里，支持兆瓦级大功率充电， 25分钟即可补充 80%的电量， 设计寿命达 12年或150万公里。截至目前，搭载公司电池的电动重卡超 43万辆，占全行业 70%。储能领域，全球储能需求持续快速增长，呈现多点开花的积极势态。根据 InfoLink 数据显示， 2026年1到8月，全球锂电储能出货量同比增长 86%。 能源安全和 AIDC爆发则进一步加快了这个趋势。储能客户决策指标正从单瓦时价格转向 全 生命周期经济性。配储关注 LCOE，独立储能关注 IRR，公司围绕这两个指标，以产品和生态 解决方案为客户创造全生命周期价值。产品方面，公司从 314安时向587安时大电芯迭代， 降低单位投资并适配长时化趋势，以长寿命、高一致性、高 RTE的电芯和系统提升全生命周 期的用电量。以厦门电化学储能实证平台实测数据支撑储能系统的安全与可靠性。场景上， 磷酸铁锂大电芯覆盖主流大储，大储钠电适合高寒地区及高频调用场景，公司按场景匹配化 学体系。 天恒钠电储能系统签约多个欧洲客户，加速钠电储能技术在欧洲市场的规模化普及，推动欧 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 洲能源零碳与多元化转型。公司加快了储能产能建设进度，以满足旺盛的市场需求。此外， 公司不断提升储能系统集成能力，交流侧出货占比快速提升。 AI、DC领域则是公司零碳新 基建战略在固定式能源替代方向的延伸，已形成完整的供电与配电产品矩阵，响应时长覆盖 毫秒级到小时级，接入电压覆盖 800伏到35千伏中压，并与多家全球领先的数据中心开发 商和云服务厂商建立了合作关系。 在布局方面，公司持续完善巧克力换电与重卡换电，重卡骐骥换电双线布局。乘用车方面， 巧克力换电站累计建成超 2500座，覆盖 31省200余城，换电车型超 30款，并推出 超换一 体站，实现乘商兼容。昨日，公司与华为引望、时代电服签署战略合作框架协议，三方将聚 焦智能换电生态建设，实现车端、站端与云端系统级打通，将巧克力换电网络与华为乾崑智 驾深度融合，共同打造面向自动驾驶时代的无感补能新体验。商用车方面，骐骥重卡换电加 速落地，多条换电干线纳入国家零碳货运走廊，构建起覆盖干线物流的重卡换电网络。 此外，公司收购了启源芯动力的股权，成为其第一大股东。目前启源芯动力约有 1700座充 换电站。今天下午，公司正式发布天行二代重卡专用电池系列。其中重磅发布的天行二双核 底换版以双核解耦架构重构 重卡补能模式， A系统负责干线主力运营， 5分钟极速换电， B 系统随车买断，保证残值与应急补能，实现换电为主、充电应急的高效补能体系。依托换电 网络， 公司在重卡电动化领域， 已经构建产品加基建加生态三位一体的系统性竞争力。 此外， 公司持续推进全球服务网络与能力建设， 已在全球 85个国家和地区布局了 1300多个专业服 务站。 今年9月，公司在挪威奥斯陆开设了亚洲以外规模最大的宁家服务中心，进一步拓展在欧洲 的电池全生命周期服务网 cerpt": "【开源宏观/海外】中期选举前瞻：共和党或力保参议院，民主党横扫概率不宜高估 ❗️ 随着11.03中期选举临近，共和党内部似乎已放弃众议院（胜选概率约10%），开始将主要精力放在参议院的竞选上（胜选概率约40%）。从Politico的报道来看，共和党已选择撤回部分众议院广告投放，把钱和精力投入在参议院", "content": "【开源宏观/海外】中期选举前瞻：共和党或力保参议院，民主党横扫概率不宜高估 ❗️ 随着11.03中期选举临近，共和党内部似乎已放弃众议院（胜选概率约10%），开始将主要精力放在参议院的竞选上（胜选概率约40%）。从Politico的报道来看，共和党已选择撤回部分众议院广告投放，把钱和精力投入在参议院的关键州（德克萨斯、俄亥俄等），尽最大可能的守住共和党的传统优势区域。 🚩 一个值得关注的点是马斯克近期对共和党进行了超大额捐赠。自7月以来，马斯克已经捐赠了超过2.76亿美元，其中1.58亿美元捐赠给Senate Leadership Fund（共和党参议院主要超级PAC），1000万美元捐给共和党参议院候选人，明确想帮助共和党保住参议院多数。另外有7600万美元投入自己的America PAC（负责动员选民，2024总统大选发挥重要作用），覆盖了多个参议院选区。 ⭕️ 此外，特朗普也在10月后密集为参加参议员竞选的共和党人站台，其承诺在选举前最后30天，为35个关键选区站台（很多是其2024总统大选的优势地区），希望可以将特朗普的忠实选民激发出来，为共和党投票。 💡 虽然市场（如Polymarket等预测）对民主党横扫参众两院的预期正在快速上升，但由于共和党的竞选策略发生调整，在优势的资金、特朗普的大力助选等努力下，我们认为共和党守住参议院的概率并不低。如果形成2院分裂局面，那对市场而言，美国的财政扩张可能面临约束，中长期利好美债。 👉 不过在中期选举后，最急迫的风险其实是特朗普对伊朗军事行动的可能升级。对特朗普而言，如果2027年1月3日新一届国会就职，其面临的各项掣肘会大大增加。因此特朗普很有动力升级对伊朗军事打击（近期已不断增兵），迫使其重新回到谈判桌上。#文字观点", "publish_time": "2026-10-20 09:06", "tags": ["文字观点"]}, "post:2026-10-20T20-03:bc41ae1f3824": {"id": "post:2026-10-20T20-03:bc41ae1f3824", "kind": "post", "title": "2026-10-20 20:03", "source_label": "帖子正文", "excerpt": "隔夜利率新锚落地，债市认为降息 2026年10月20日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 央行把政策利率锚换成隔夜，债市把它读成变相降息，股票没有同样的读法：A股指数平收、权重股下跌，港股节后补跌1.3%。", "content": "隔夜利率新锚落地，债市认为降息 2026年10月20日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 央行把政策利率锚换成隔夜，债市把它读成变相降息，股票没有同样的读法：A股指数平收、权重股下跌，港股节后补跌1.3%。 人民银行行长周一下午称将研究把主要政策利率改为隔夜利率，今天又公告自10月21日起连续开展隔夜逆回购；债市走强，股市未同步。上证收3,735点，涨0.1%，午后一度跌0.75%，尾盘上证50ETF放量才拉回红盘；恒指节后首个交易日跌1.3%，收盘距日内低点仅16点。 周一的经济增长好于预期。我们在上周的与瑞士宝盛对话的播客里讨论过了，今年的经济增长目标的实现基本上没有任何的悬念。因此，市场对于政策不应该过度的期待，而工作重心将转向市场维稳。今天的午盘宽基ETF的大幅买入，显然是“看得见的手”在主导，使得上证日内V型反弹收平。但成长股缺乏托盘，被韩股带下。#文字观点", "publish_time": "2026-10-20 20:03", "tags": ["文字观点"]}, "post:2026-10-20T08-21:f799a1621bd7": {"id": "post:2026-10-20T08-21:f799a1621bd7", "kind": "post", "title": "2026-10-20 08:21", "source_label": "帖子正文", "excerpt": "独家报道：奥特曼阐述 AI 的三种终局，其中一种情景为某家公司 “熔掉其他所有人的 GPU” 📑 两名知情人士透露，第一条路径是建立一套类似国际原子能机构的国际组织，由该组织强制执行安全标准，奥特曼对此方案表现出支持态度。📑 第二种方案，是把全部 AI 实验室整合为同一个实体，以此安全地开展新一代 ", "content": "独家报道：奥特曼阐述 AI 的三种终局，其中一种情景为某家公司 “熔掉其他所有人的 GPU” 📑 两名知情人士透露，第一条路径是建立一套类似国际原子能机构的国际组织，由该组织强制执行安全标准，奥特曼对此方案表现出支持态度。 📑 第二种方案，是把全部 AI 实验室整合为同一个实体，以此安全地开展新一代 AI 的研发工作。 📑 知情人士表示，奥特曼还介绍了第三种情景，他本人并不认同该情景：某一家 AI 研发公司积累起足够强大的经济实力，可以剥夺其余所有研发主体（包含具备潜在风险的研发方）的算力资源，确保对手无法实现技术追赶。 🗣️ 据知悉该发言的人士转述，奥特曼表示：“很显然，我认为这一情景十分糟糕。” 他补充，之所以把该情景纳入讨论，只是为了保证讨论内容的完整性。 ⚠️ 奥特曼发表此番言论之时，OpenAI 内部部分 AI 研究人员愈发感到忧虑：处在技术前沿的各家公司，是否具备完备机制，避免 AI 脱离管控，或是被滥用于网络攻击以及其他各类潜在危害行为。 ⚠️ 上述担忧源于一系列 AI 驱动的安全入侵事件，OpenAI、Anthropic、谷歌以及 Meta 的模型均出现过相关问题。即便模型本身知晓不应执行此类操作，依旧入侵、破坏其他公司或是自身系统。 ⚠️ 接连发生安全事件之后，OpenAI 进入全员攻坚状态，搭建全新系统，保障下一代重点模型能够安全发布。 🔍 OpenAI 内部的相关焦虑情绪尤为突出。该公司此前解雇三名专注安全方向的研究人员，理由是几名人员涉嫌不当向外部机构传递信息。事件过后，部分员工私下质疑这家公司对于安全工作的重视程度。 💬 奥特曼在内部沟通中提到，目前能够为 AI 技术发展设置所谓 “限速机制” 的可行方案十分有限。 💬 他同时提出，希望人类始终掌握这项技术的控制权，规避行业权力高度集中的局面。 🏛️ 特朗普政府现阶段 AI 监管思路，主要是推动 OpenAI 这类研发方签署自愿协议，允许政府在新模型对外公开发布前开展审查。 🏛️ 五角大楼官员埃米尔・迈克尔向《The Information》表示，如果相关公司行事如同 “酒驾者”，给民众或是企业带来伤害，政府愿意实施更为严苛的审查手段。 🏛️ 对应的惩戒手段，就包含特朗普政府在今年 6 月对 Anthropic 实施的出口管制。当时监管层担忧该公司顶尖模型 Fable 存在 “越狱” 漏洞，出口管制落地后，这家公司临时关闭了该模型的访问通道。 🤝 知情人士称，奥特曼向员工介绍的前两套方案，都需要各个公司、各国政府开展大规模协同，但奥特曼同时表示，当下 OpenAI 无法承受在竞争当中落后对手的代价。 🤝 OpenAI 和它的主要竞争对手 Anthropic，都在快速推进 IPO 相关工作。 ⏭️ 奥特曼称，未来一年，OpenAI 需要选定一套方案，主动去推动落地。 ⚖️ 奥特曼的发言，暴露了 AI 实验室与竞品协作时的两难处境。 ⚖️ 当前 OpenAI、谷歌、Anthropic 正在筹备美国全新的 AI 安全机构 —— 前沿 AI 标准局，计划在 2026 年末或是 2027 年初正式启动。 ⚖️ 该机构会向各个 AI 研发公司派驻独立评估人员，落实安全开发规范，明确研发方应当如何上报安全事故。 ⚖️ 但各家公司在多项议题上存在分歧，争议点包含：新成立机构，还是外部第三方机构，来承担新模型的安全与能力测试工作。 📜 Anthropic 也在向美国政策制定者输出自身的 AI 安全政策主张。 📜 该公司近期向国会议员推介一份法案草案，草案提出，倘若某套 AI 有可能造成超 10 亿美元经济损失，或是造成 50 人以上死亡、重伤，商务部有权叫停 AI 实验室训练、使用该新模型。 📜 这份拟议法案还要求 AI 实验室聘请独立安全评估人员，每年至少完成两次模型评估工作。 💡 部分 AI 行业从业者提出，全新监管规则、专门测试机构，只会进一步巩固现有头部研发公司，也就是 Anthropic 与 OpenAI 的优势地位。 💡 Meta 首席执行官马克・扎克伯格、英伟达首席执行官黄仁勋等高管认为，这类监管会给新兴研发主体施加过重约束，该现象即监管俘获。 🌐国际原子能机构模式，还是欧洲核子研究中心模式🌐 多年以来，奥特曼以及 OpenAI 其他高层一直在公开呼吁设立参照国际原子能机构模式的组织。 🌐 2023 年 5 月，奥特曼、OpenAI 联合创始人兼总裁格雷格・布罗克曼，以及当时的首席科学家伊利亚・萨茨凯弗共同发布博客，行业需要一套 “面向超级智能研发、类似国际原子能机构的组织”，该组织可以开展系统巡检、要求审计、追踪算力与能源消耗情况。 🌐 这套效仿国际原子能机构的机制，需要所有研发尖端模型的国家开展跨国协作，其中也包含中国。 🌐 上个月，中国 主席 习点明 AI 潜藏风险，表示中美两国 “有能力也有责任将 AI 用于造福人类，并确保 AI 的发展始终处于人类控制之下，服务于人民福祉”。 ❓ 目前尚不明确中国愿意在多大程度上，和美国协同推进该目标。 ❓ 上个月美国财政部长斯科特・贝森特在和中国国务院副总理何立峰会谈时，提议搭建 AI 安全 “通报机制”，中方暂未正式认可这套框架。 🤝 和 OpenAI 类似，Anthropic 管理层同样把跨国协作（包含和中国开展合作）视作化解 AI 安全风险的可行路径。 🤝 Anthropic 首席执行官达里奥・阿莫代伊在 9 月的一篇文章中写道，美中两国可以就部分标准达成共识，例如禁止制造生物武器这类明确高危的 AI 应用，针对网络安全领域开展风险测试。 ⚠️ 但 Anthropic 和 OpenAI 立场存在区别，该公司更加强调美国应当在 AI 研发层面对中国保持显著领先，通过限制向中国出口先进芯片等手段守住优势。 🧩 奥特曼上周向 OpenAI 员工介绍的第二条安全 AI 发展路径，被称作 “德米斯方案”，该名称源自 Alphabet 旗下 DeepMind 前负责人德米斯・哈萨比斯早年提出的构想。 🧩 大约十年前，哈萨比斯提议设立类似欧洲核子研究中心的机构，欧洲核子研究中心由数十个国家共同管理，用于前沿物理研究。 🧩 按照奥特曼对该构想的解读，各大 AI 公司实质上要合并进入单一实体，依托该实体开展研发，由实体向合作国家输出新模型。 ❓ 哈萨比斯原本的 “AI 领域欧洲核子研究中心” 构想，是否会推进到奥特曼描述的程度，目前没有确切答案。 ❓ 哈萨比斯近期转而倡导成立一套类似美国金融业监管局的行业自律组织。 🔥埃利泽方案🔥 知情人士透露，奥特曼把第三种方案命名为 “埃利泽方案”，名称取自知名 AI 安全理论家埃利泽・尤德考斯基，该人士和 Anthropic 核心成员往来密切。 🔥 尤德考斯基长期主张，高阶 AI 系统会给人类带来生存层面的威胁。 📝 尤德考斯基在 2022 年博客文章中提出，率先实现超级智能的主体，要借助超级智能完成一项 “关键行动”，通过干预手段阻止其他个人、机构研发危险的超级智能。 📝 其中一类干预手段，就是摧毁其他研发方使用的 AI 芯片。 📝 奥特曼表示，该情景会出现于某家 AI 公司实现递归自我改进之后，也就是 AI 可以自主迭代升级，依托由此获得的经济实力，去 “熔掉其他所有人的 GPU”。 📝 OpenAI 以及其他研发公司均表示，正在全力攻关递归自我改进技术。 💭 奥特曼将该路径定义为，把高阶 AI 的控制权集中掌握在单家公司手中，这并不是他希望看到的未来。 💭 一名知情人士表示，考虑到尤德考斯基和 Anthropic 的关联，奥特曼这番表述，也被视作对 Anthropic 的含蓄批评。#文字观点", "publish_time": "2026-10-20 08:21", "tags": ["文字观点"]}, "attachment:files/GS-全球服务器：上调AI与通用服务器预期，产品结构优化与内存成本上升驱动云厂商CSP开支-20261018.pdf": {"id": "attachment:files/GS-全球服务器：上调AI与通用服务器预期，产品结构优化与内存成本上升驱动云厂商CSP开支-20261018.pdf", "kind": "attachment", "title": "GS-全球服务器：上调AI与通用服务器预期，产品结构优化与内存成本上升驱动云厂商CSP开支-20261018", "source_label": "GS", "excerpt": "1 / 27 丘栋荣路演交流纪要（整理稿 v2） 来源：2026-10-13 录音《10月13日.m4a》，时长 2h01m（7,263 秒）。一、开场：一脉相承的投资框架 我们的思路在过去十几年是一贯的，变化其实没有。", "content": "1 / 27 丘栋荣路演交流纪要（整理稿 v2） 来源：2026-10-13 录音《10月13日.m4a》，时长 2h01m（7,263 秒）。 一、开场：一脉相承的投资框架 我们的思路在过去十几年是一贯的，变化其实没有。包括我们的投资者在内， 或许会发现我们的策略、产品和组织有一些比较大的变化，但那些没有反映出 来的、最根本的东西，是没有变的 ——那才是我们一直在追求的。 最终呈现的方法、市场或策略，看起来可能很不一样，而它背后反映出来的东 西是一样的、是一脉相承的。不管现在，还是十年前、二十年前，本质都非常 一致。正因为底层是一样的，它表现出来的形式和样子才会很不一样；我之所 以去做那些看起来不一样的东西，正是因为底层的东西一样。本质就是这个原 因。 二、投资历程与策略演进 （一）2013–2017：低估值大盘蓝筹（汇丰晋信时期） 最早做投资、做研究，是在 2013、2014 年那个周期。当年大家去买创业板， 我们是正面做低估值大盘蓝筹的思路，呈现出来的成果就是格力这类大盘蓝筹 股。它背后的真实含义，是这些东西很好、而且非常便宜 ——我记得刚管基金 的第一天，组合的市盈率只有四倍。格力从我管基金第一天起就持有，一直拿 到 2017 年 10 月高瓴收购格力，才彻底卖掉。在那整个周期里，它呈现出来 的始终是「公司非常好、同时也很便宜」的样子。 那段历史的数据非常完美：五年期第一名，年化 35% 的收益，回撤很小，基本 上每年都赚钱。（管理人口径） （二）2018 年起：中庚小盘价值（关键转折） 后来从汇丰晋信到中庚。当时我们尝试跟招商银行合作，招商银行和中信证券 一起来找我。他们特别希望我们做一个「中 庚大盘价值」的产品 ——理由是历 史口碑和业绩特别好：五年期第一、年化 35%、回撤还小、基本每年赚钱，数 据非常完美；同时他们认为我们擅长、口碑也好，发自内心相信我们能做好， wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2 / 27 所以一直鼓励我们做，还承诺可以给到 50 亿甚至 100 亿的规模。当时还找了 中信证券做交易结算，相当于强强联合，看起来一定是一个爆款产品。 但那时我一直跟他们讲：我们为什么绝对不能做一个大盘基金？我们的核心策 略，是要做一个小盘基金 ——「中庚小盘价值」。这是我的核心的真实想法： 我要以中证 1000 为基准。原来汇丰晋信的大盘产品，是以 沪深 300 为基准的， 始终是一个明显的 Smart Beta 、一个很明显的策略。 但这个市场已经完全变了。到 2019、2020 年，已经完全不是原来的样子。所 以为什么要做小盘基金？它同时承担所谓「 三高」的特征： 高 β；高 Smart β——我们永远是低估值小盘；第三条是 高 α——在中证 1000、在小盘里面， 我们肯定能做到全市场最好。我们当时跟内部、外部、跟同行都讲过：这个特 点在全市场，别人不可能做得比我们更好。 （三）关于渠道：从招商银行到广发证券 为这个产品，我们找了不止一家渠道。招商银行不行，就再找 ——从中信证券 到华泰证券，再往下找到广发证券，跟他们讲的是同一个故事。广发的负责人 一开始没跟我们合作过，后来还是被说服了。 我们当时的立场很简单： 我们只做这种正确的东西，然后再去想（怎么把它卖 出去）。 我说的话很简单：这件事从商业价值上来看，价值是非常非常大的。我跟他们 讲的目标很清楚：中信、招行那边可能第一天就能给我们做到 100 亿；但我这 个东西，如果只是为了这 100 亿，是根本没有意义的。所以我跟老板、跟高管 反复说一句话： 你一定要抵制这个诱惑。 如果我们做了这个（大盘）策略，那 么公司成立的这一天，就是我们的 最高点、最高光的时刻，以后只会走下坡路 ——你想想，这 100 亿到后面，公司还能活多久？最终肯定会死掉。 反过来，如果我们做了小盘这个产品，给我们三年时间，最起码能实现两个目 标：第一，至少可以从一变成二、三年之后翻倍 ——因为那个组合算下来估值 只有十倍、十倍不到的市盈率，同时每年 30% 以上的增长，公司质量又非常非 常好，这个组合肯定是三年能翻倍的，这是很简单的道理。 第二，有了这个东 西之后，加上我们的网络、口碑和大家对我们的认知，一年之后会有很大的极 客投资者群体进来 （第一年是没法进来的，还有很多准入的问题）， 那我这个 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 3 / 27 人肯定能做到（更大的）规模。最后我跟他讲：你到底是要现在的 100 亿，还 是三年之后的（更大的那个）规模？广发的负责人当时就同意了，全力支持这 个产品。 背后必要的逻辑很简单：这件事是有一期（长期）回报、有责任的商业价值的， 所以我们才应该全力去做它。 （四）不可复制性：一套在商业模式上不成立的系统能力 而且对任何一家资产管理公司，不管你是公募还是私募，它都没有可复制性。 别人做不到，做不出来这样的东西。原因非常简单：它需要的是一套系统能力 ——没有任何一个人，值得去组织一个 20 人的研究员团队，去做这样 一件事， 对他来说是不划算的；而这个东西的规模，也就是改善的规模，我们只能收那 么一点点管理费，成本其实很难算。对所有的基金公司、尤其大基金公司来说， 这在商业模式上是不成立的 。 所以他们最终会去复制，但复制的方法一定是「 更 low 版本的复制 」——变成 一个三四个人的团队，用量化的方法把我们做成一个模拟的东西，但绝对不是 这种主动管理的策略，绝对不可能实现那种高 α，最终只能模仿到前面两条： 高 β，和高 Smart β （低估值小盘）。高 α 是绝对不可能的，因为它背后 需要的是系统的能力和力量；而这种系统能力，是在公 司一开始设计的时候就 已经要形成的。假设我们没有这个产品，它也一定会自然而然形成 ——就算没 有这个产品，这些人、这些活也都是要干的，只是在这个时间点，自然形成了 这样一个结果。 市场上真正做这种风格的人，最终做的只是量化的策略和产品；没有任何人会 说，我花那么多时间，从 4,000 家公司里找出 100 家，去做一个 100 亿规模 就摸到天花板的策略 ——这在商业上实际是不成立的。 （五）2021–2023：策略扩张 再往后，比如 2021 年，还形成了多空策略：从全市场多空，到医药消费多空、 科技多空、新旧能源多空。 这些东西是自然生长出来的。再往后， 2022 年底形 成了港股通策略 ——真正最想做的时点，是「二十大」之后： 10 月 27 号我们 跟中信开会时下决心要做这个产品，那天腾讯跌到 180 块；但等产品成立，腾 讯已经涨到 450 块，晚了。（详见问答部分） wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 为什么要强推这样一个产品，原因当然还是一脉相承的：因为它就是东西很好、 很便宜，我们认为它有很好的回报，就这么简单。它跟我们 2014 年买格力、 2019–2020 年买小盘，逻辑一模一样，本质是一脉相承的。只是说那个时候要 买大盘；而到 2019、2020 年，在我看它就是显而易见的泡沫了，所以我们不 会去买它，甚至后面还做了多空产品，专门去做空这些东西——这些标的我们 太熟悉了。 关于多空：最典型的就是 新能源多空 ——做多老能源（天然气，三倍市盈率、 20% 分红），做空新能源（ 20 倍市盈率）。这是过去五六年我们表现最好的产 品，两边 Alpha 各年化约 30%，减掉中间成本后年化至少 40%；其中表现最好 的新能源多空， 五年年化约 60%。（管理人口径）它两边的波动都比较小，因 为Beta 是中性的。 （六）Alpha 不可持续：像蘑菇，见光就死 这里有一个我们跟很多人非常不一样的观点： 真正的业绩、真正的 Alpha，是 不具有可持续性的 。 所以我们在中庚的时候，跟所有的小同事讲： 大家千万千万不要急 ——不要用 「过去业绩好、所以你要买我产品」的营销方式去做，这个事情是很蠢的。因 为Alpha 本身最大的特征就是它不会持续。有一个很有名的比喻形容它： Alpha 就像蘑菇一样，一见光就死了、就萎缩了、就没有了 。所有人都知道， 那就肯定不成立了。 所以最终我们要相信的是什么东西？是 数学、是物理、是事实和逻辑 。就像我 们2014 年讲格力四倍市盈率、五六倍市盈率，这个基本的东西是能算的；就 像2020 年讲小盘，一手消息，加 VX：WUXL3408 所有小盘股都被市场抛弃， 大家觉得 50 家（小公司）就是垃圾公司——我说这个太扯了。我们讲的是： 这个东西这么好、这么便宜、它有这样的增长、这样的资本回报，它是最优秀 的公司。 我2019、2020 年做小盘那一年，去苏州看公司，一个季度看了 37 家苏州的 公司。它很好、我有钱可以买它；这么非常好的公司，我搞不懂大家为什么不 4/ 27买、为什么觉得这种小公司是垃圾公司。反过来，后来我们成立了多空策略， wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 5/ 27专门做空那些核心资产 ——我认为那（些公司）真的是没有未来的公司，它们 的生命周期已经结束了，最好的也进入了黄昏期，后面要面临整个周期的下行。 （七）万科与格力的定价之争（关于「便宜」的引子） 那段时间（约在核心资产泡沫见顶前后，时点存疑，见附注）、我还在中庚时， 很多人不理解：为什么当时「立场股」（核心资产）创了一个 够好、足够便宜。但「便宜」这件事 情，我发现很多基金经理很容易去把它（归类），我不知道是能归类（为）能 力，还是能归类（为）他的交易习惯的问题 ——这个事情非常有意思。就比如， 你可能觉得万科十倍就已经是泡沫了，二十倍你给谁谁谁就可以。 答：你的问题其实是一个更深层、更专业的问题。对我们来说，它是一个系统 和体系化的答案。我们把它总结为「 基于不确定性定价的低估值投资 」。 先说简单的那一层。 我们最早 2014 年去买格力的时候，我们的想法跟市场是 没有差异的：市场认为它是什么样，我们也认为它是什么样；只是别人不愿意 （买），我们愿意而已。这个属于比较简单的题目 ——那时候研究起来很容易， 基本上闭着眼睛就能买。 但便宜这件事的深处不是这么简单。 我听了太多人跟我讲这个：同样一件事， 不同的人做法完全不同。你可能觉得万科十倍市盈率就已经是泡沫了，而二十 倍市盈率给别人、别人就可以 ——这里面是「估值到底用什么方法论」的问题。 第一，不是所有的数据、所有的 PE 都可以拿来估值的；第二， PE 是相对的， 因为它可能跟你的成长是有关系的。但我发现有些人无论如何，他自己买完十 倍的（股票），到了其他行业，他也不能接受 20 倍、30 倍——这其实是基本 面以外的另一套体系了。 所以这个问题，是一个更深背景下的专业问题。我们的答案是这样的： 首先，结果是低估值 ——我们只接 受低估值的东西。这意味着一期回报一定来 自资产本身的盈利和现金流：我不是指望股票涨，而是我持有它，它赚的钱、 它的收入盈利就能满足我的回报。这是我的第一性原理。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 8 / 27 但真正的问题不在这里，而在于它的 风险、在于不确定性：未来这家公司会怎 么样、会怎么赚钱，在我们看来是完全不确定的。举个例子：为什么我认为万 科十倍市盈率是泡沫，而宁愿买二十倍市盈率的小盘股？因为我认为万科未来 十年的平均增长会比一般年份少、而且会少很多；而后者未来十年的增长，会 比一般年份高，还不止一两倍。估值本身反映的其实是这样一个 概率分布 。所 以我们的研究重 点，就是去研究它未来回报的概率分布 ——什么情况下会这样、 什么情况下会那样。 在这个问题上，我们跟传统的低估值投资者、价值投资者的想法 非常不同 ，以 至于现在我们都跟他们分到两边去了。具体有三条： 1. 低估值通常是「雷」 。低估值的东西，通常情况下是有问题的 ——所以我们 不是做空高估值， 我们更愿意做空低估值 。让我闭着眼睛做空，我会做空低 估值的公司，它更容易，因为它就是雷。 2. 不是均值回归 。不是说你跌下去了，就一定会涨回来。 3. 不是周期投资 。绝大部分的公司、绝大部分的资产 ——甚至所有东西 ——是 没有周期的， 它的宿命是归零 。就像绝大部分人、绝大部分基金经理一样， 一辈子只有一次机会；机会掉下来之后，不会再来一次。所以「便宜了、跌 多了就去买」这个逻辑是不成立的。 估值低，通常是「雷」的先兆指标。 所以它背后最重要的前提是： 你的风险研究必须是可靠的 。我们买的低估值， 其实是希望它同时是 低风险的、是努力的公司。我们任何时候买大盘股（格 力）、买小盘股，那些都是很好的公司 ——它首先要有「低风险」在里面，这 是需要很深的功力去研究的。 站在今天，我判断它未来的确定性：如果确定性是向上的，你愿意给它 15 倍、 20 倍的估值，哪怕它现在是 10 倍；但如果它的确定性是向下的，那就另当别 论。本质上，它是一个 风险定价 的问题，低估值只是最终的表现。 所以 2018 年、中庚刚成立、做小盘的时候，我们跟同事的要求是： 先忘掉估 值，然后去演算「什么最可能」。我们当时买得最多的是医药和广义的科技行 业。如果一个特别好的公司，它是 10 倍、20 倍还是 30 倍，是没有差异的； 而一个很烂的公司，它是 4 倍、5 倍还是 6 倍，都一样是归零的。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 9 / 27 五、对新技术与 AI 的判断 ★ 问：我现在站在今天这个时间点，想问您一个问题。就说 AI——这个命题非常 热，7 月份（市场）已经很热了，当时大家 6 月份还觉得（不一定能改变世 界）。现在就有个问题： AI 现在的应用情况、市场大家接受的情况，它应用端 的问题虽然（还在）被（讨论），但从您看，它未来业绩的确定性是向上还是 向下？这是第一个问题。而且最终你要决定买入的时候，它还有一个风险调整 的问题——比如说现在看 40 倍，那是不是您觉得它现在这个确定性（还不 够）、40 倍不符合它风险调整后的价格，我可能要等到 20 倍才进去？ 答：以我们的视角，可能不是这样。 我们跟大家最大的差异，并不在「 20 倍、 40 倍，还是 60 倍、80 倍、100 倍」这个问题上。 就像我们以前买的最好的、 最喜欢的公司，它可能是亏损的、估值很高、有很大的经营风险，甚至没有 （当期）利润。 就像我 2024 年 7 月离开中庚之前（ 7 月 19 日卸任、 7 月 20 日还开了一个 极客投资者的会）跟大家讲的：当时我认为 最不看好的是高分红 ，最应该买的， 是那些看起来很不确定、甚至亏损的公司。背后的逻辑是 它的风险补偿要足够 高——因为价格已经很低了，风险补偿要足够大，才能追到那种很好的回报弹 性。当时我们最喜欢的，比如创新药、那些成长性板块，它们看不到当期利润， 但整个资产投入的回报，在未来是相当高的。 但现在的 AI，我认为跟这个情况 完全不同 。最核心的原因，是 投入和回报之间 的关系非常危险 ： 1. 资本投入非常非常大 ； 2. 回报的商业模型非常脆弱 ，至少现在不知道怎么赚钱； 3. 价格很高，而且还在持续融资 。 基于这三个层面，我认为这个商业模型跟你 100 倍、10 倍还是 20 倍是没有 关系的——这种生意我们都不应该买 。不是 40 倍贵不贵的问题，也不是 20 倍就买；而是这种生意、这种投资，我认为是非常差、非常危险的。 举例说明公司判断 。我最看空的是阿里 ，我认为它比百度还要差。为什么 ？百 度不是最差的：它第一至少有很多的现金；第二它现在还有残值、还能收现金； 第三最重要 ——它知道自己做了雅虎（那笔投资）是错的，它就不投了、不花 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 10 / 27 钱了、不浪费钱了。而阿里同时满足三件事：第一， 无脑投 AI（而且我相信它 大概率是投不出来的 ——能投出 AI 的这种公司，肯定不是长成这样子的）； 第二，原有的利基市场被不断侵蚀 （每年收税的那个钱收不到了）；第三，它 会把存量价值也消耗掉。三条同时满足，它是最糟的公司。 反过来， 我认为最好的是拼多多 ：第一，它一分钱都不投 AI；第二，它的业务 不受 AI 冲击——它本质上不是物联网、也不是科技， 它就是一个零售公司 ； 第三，它在不断捍卫自己作为零售公司的护城河，供应链效率最高、成本最低， 始终能给消费者提供最物美价廉的东西。很多人用「苏宁、国美被颠覆」来解 释电商的颠覆力，但问题是：苏宁国美被颠覆的同时，沃尔玛被颠覆了吗？ Costco 被颠覆了吗？（包括后来的（本土商超）被颠覆了吗？）没有。根本原 因是苏宁国美自己没有做好一个零售公司该做的事，不是因为电商。 至于中间的，比如 腾讯和字节，我们远没有三年前那么看好了 。三年前它们闭 着眼睛就能赚钱，现在是被迫卷入一场战争：要花钱，而 且花了钱还不知道能 不能出得来。 AI 对资本回报是破坏性的力量 。我认为 AI 技术对资本回报是一种「缺口性」 的（破坏性的）力量 ，对资本回报绝对是很致命的东西：一方面要花钱，另一 方面还会摧毁你原有的价值，而你还不知道怎么把这个钱收回来。所以很简单 ——保守一点就不要投它，激进一点就直接找机会 做空这些东西。 最近 AI 的波动也印证了这一点：随便一个「鬼故事」出来，它就能跌一下 — —因为它的回报不确定、脆弱性强，很容易把做多者的信念和叙事击垮。 这个逻辑我们很早就做过 。当年做空新能源时就是这个逻辑：它们要花很多钱， 这些钱赚不回来，全部变成了消费者福利（大家能很便宜地用）。但它还有 更 深层的负面影响：它既摧毁成长，更摧毁价值股。 所以价值股投资在这种环境 下要非常非常小心、非常慎重 ——不要以为「低估值就是安全」，也不要以为 「成长股不长了、就要轮到价值股」。我认为价值股也非常非常危险，因为 这 个东西越牛逼、效率越高，它对传统利益和价值的摧毁力量就越大 。 用一个已经发生的例子：新技术摧毁力量有多强？比如新能源、新能源车。现 在的发展，比当年创立这些公司时最厉害的人讲的最厉害的故事还要好：当年 很少有人敢说「我要做到一百万辆」，现在他 们兑现了。但结果怎么样？ 市值 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 11 / 27 只剩下当初「吹牛」时的十分之一。 所以在这个行业里，最应该做的不是去投 这些新车企，而是 做空燃油车企 ——那些传统车企很赚钱、估值很低、还有充 沛的现金流和利润。 2022、2023 年我们跟几个人聊过，最简单的一个策略就是 做空丰田、本田和大众 ；事实上，它们受到的伤害更大。 同样道理，现在大家最喜欢的、今年表现很好的一个方向，比如 煤炭、石油、 天然气——这是五年前我们最重仓的东西，我们曾经是它们的大股东。今年看 起来还不错，但是我们现在对它 非常看空 ，甚至有可能愿意去做空它们。原因 就是新技术的 力量开始发威了 ：当年新能源那些人吹的牛，短期没有兑现，但 长期看，它是超级兑现的。就像新能源车的例子一样。 所以我有一个判断： 市场会严重高估新技术的短期影响 （就像当年说新能源 「马上就改变世界」，现在说 AI 也一样，其实没那么快）；但 市场会严重低 估新技术的长期影响 。现在新能源在能源中的占比已经超过 25%（数字待核）， 未来还会继续提高 ——因为技术太强了、成本太低了（现在只要两毛多钱的成 本，比煤电便宜太多），储能也跟上了。经过一个五年、再一个十年周期，它 的比例会不断提高。所以当年那些人吹的牛是有可能实现的；反过 来说，所有 那些煤炭、石油、天然气资产，从长期看是非常危险的 。 本质的原因是一定要理解它的 定价。像煤炭股，给它十倍市盈率就可以做空； 而当年我们是三倍市盈率、 20% 分红——那个时候是绝对做多的，现在我认为 完全反过来了。 所以我的意思是 ：新技术既把自己搞死了，更摧毁的是价值股。所以 投资本身 就是非常危险的事情 ——你做成长股会亏钱，做价值股也会亏钱，大概率是要 亏钱的。真正能赚钱的地方非常非常少。 我们绝对反对所谓的「轮动」交易 — —「当前周期结束，是不是价值要起来了」「就像你们投管理人，投完这个是 不是要投那个」 ——不能这样。因为大部分的公司、大部分的策略、大部分的 人，最终都是要亏钱的；就像大部分公司的宿命是归零。所以不要紧张地想着 「我这个跌多了就要涨」。能够存在的东西非常非常少，一定要很努力地去找 到充足的、正确的逻辑；一旦找到了，就要不遗余力地去干。 补记：银行股与「两种泡沫」 。顺便说到现在的银行股 ——它最近屡创新高， 这是我看不太懂的。因为我是从银行（体系）里出来的，我这两年为什么要走， wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 12 / 27 我就知道这里面的生存有多难。以前银行很好的时候，它是很便宜的；现在它 底层（的运营能力）其实比过去差很多，价格却创了新高。所以它这轮上 涨， 很多是资金行为推动出来的。我用这个例子想说明的是： 科技股是一种交易型 的泡沫，银行股是另外一种泡沫 。所以我们现在的一个结论是 ——我们既看空 科技成长，也看空价值股 。当然，「不看好」和「做空」之间是有很大距离的： 第一是不买，第二是不看好，第三才是做空。对煤炭石油这些，我们有些公司 已经进入到可以做空的位置了。 六、当前配置：美元定价的中国资产 ★ 问：那您现在看到的这样的机会在哪里？ 答：这是一个非常稀奇的、最好的机会。首先，我认为 A 股总体上处于一个比 较泡沫的状态 ——所有的公司、资产都比较贵。所以现在比如你让我去投 A 股、 或者让我重新去管中庚原来的那个产品，其实是不太好做的，我不知道投什么。 最便宜的比如腾讯，也要 11、12 倍，而且还有风险；茅台这种 4%、4% 的 （股息率），我认为已经算很便宜的公司了，但它也就是这样。所以我认为 A 股没什么好投的。 全球唯一的一个「洼地」，我们总结为：美元定价的中国资产。 它必须同时满 足两个条件，才构成这个「洼地组合」：  做多中国资产 ：它是中国公司，供需和盈利来自内需。科技类资产本质上是 美国资产 ——哪怕在 A 股，定价权也在美国 。所以我们本质上是 做空美国 资产、做多中国资产 。  用美元去买 ：只有在美元定价的体系里，它才是真正的洼地。 为什么要做空美国资产（科技） ：核心原因是 投入资本太大 。就像当年的新能 源一样，花了太多钱之后，哪怕你盈利好也没用，最终结果一定是亏很多钱 — —因为花了很多钱、会有剧烈的竞争和消耗、又没有很好的商业模式和壁垒把 这个钱赚回来。就像新能源产业链一样，最终可能没有人赚钱； 科技里面，我 认为最终也不会有人赚钱 。从 ROE 上看，一定是不行的。现在美股还没有崩， 是因为大家只看利润表；而利润表上的那种繁荣是带泡沫的。（顺便说 一句： 这两天美股跌，基本就是这个原因 ——大家开始担心。） wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-20T15-52:44c934c4bf8a": {"id": "post:2026-10-20T15-52:44c934c4bf8a", "kind": "post", "title": "2026-10-20 15:52", "source_label": "帖子正文", "excerpt": "【开源计算机】物理AI或成编码外最大落地场景，全球巨头重点发力-20261020物理AI是全球科技巨头明确的重点发力方向 物理 AI 可感知理解物理世界，依托物理规律做时空预测、动作规划，驱动硬件执行，形成 “感知 - 推理 - 行动 - 反馈” 闭环。等价于世界模型 + VLA + 仿真数字孪生 ", "content": "【开源计算机】物理AI或成编码外最大落地场景，全球巨头重点发力-20261020物理AI是全球科技巨头明确的重点发力方向 物理 AI 可感知理解物理世界，依托物理规律做时空预测、动作规划，驱动硬件执行，形成 “感知 - 推理 - 行动 - 反馈” 闭环。等价于世界模型 + VLA + 仿真数字孪生 + 实体机器人。NV 为物理 AI 基建龙头，搭建仿真 + GPU + 模型全生态；Tesla 独有大规模真实物理闭环数据，将 VLA、世界模型落地 Optimus，谷歌、Meta、字节亦布局世界模型。GPT-6 Astra或重塑具身大脑的产业逻辑，推动通用模型公司进入具身方向 OpenAI GPT-6 Astra 可直接输出机器人末端位姿，不止拆解任务，部分任务成功率优于部分具身模型，引发通用与具身模型边界讨论。OpenAI、Anthropic、DeepSeek、Kimi 等前沿通用模型厂商布局具身智能与物理 AI，Astra 或重塑具身大脑产业逻辑。Astra 与独立 VLA 差异：VLA 直出电机信号，Astra 需 IK 转换关节角，精细操作仍偏弱，短板在后训练针对性。OpenAI将把机器人智能系统研发作为核心攻关方向 OpenAI 预计 2027 年推出亮眼机器人样机，短期打造通用机器人赋能基建工人。OpenAI 2026 年 2-6 月 ARR 停滞，显现 C 端订阅瓶颈；7 月单月 ARR 超二季度总和，测算二季度 ARR 由 250 亿升至 420 亿美元，增长主力转为企业 Agent 与编码。物理AI有望成为拉动ARR增速的重要战略，黄仁勋看好其 50 万亿美元市场，机器人智能可复用大模型 API、Token、订阅变现模式。具身产业的变化总结：通用大模型发力物理AI+应用场景打开+Optimus量产确定 物理AI有望成为coding之后需求空间最大的市场。以Optimus为例，其落地路径是先工厂、再商用、后家庭，所替代的人群可推演至所有体力劳动群体。Optimus已明确进入量产阶段，根据产业链调研，2026年10月底上游核心零部件预期达到周产2,000-2,500台机器人的供应能力，2027年Q1在2026Q4基础上进一步翻倍。2027年全年保守实现10万台量级，需求指引约为30万台。受益标的 1️⃣执行层面。恒立液压、福赛科技、斯菱智驱、科森科技等；2️⃣模型层面。风语筑、中控技术、索辰科技、凡拓数创、智谱等。 风险提示：技术产业化进展不及预期风险等。 链接：开源计算机|行业点评：物理AI或成编码外最大落地场景,全球巨头重点发力☎欢迎联系：张越17316258956/刘逍遥/叶进新/刘炬帅#文字观点", "publish_time": "2026-10-20 15:52", "tags": ["文字观点"]}, "post:2026-10-20T12-05:978c04b1517c": {"id": "post:2026-10-20T12-05:978c04b1517c", "kind": "post", "title": "2026-10-20 12:05", "source_label": "帖子正文", "excerpt": "高盛——长鑫科技（688825.SS）：AI驱动DRAM需求强劲，季度环比增长可期；3Q26收入环比增15%~20%", "content": "高盛——长鑫科技（688825.SS）：AI驱动DRAM需求强劲，季度环比增长可期；3Q26收入环比增15%~20%；维持买入评级 高盛就长鑫科技（CXMT）发布的2026年第三季度业绩指引作出核心解读。高盛认为，在AI算力需求爆发、客户供应链多元化及DRAM价格维持高位的三重驱动下，公司3Q26收入与净利润均显著超出此前预期，且4Q26E收入有望延续环比增长态势。我们视长鑫科技为本土DRAM市场崛起的核心受益者，维持买入评级及130元人民币的12个月目标价（潜在上行空间213%）。核心要点如下： 1. 3Q26业绩指引超预期，量价齐升逻辑验证 公司预计3Q26单季收入达1150亿~1200亿元人民币，环比持续增长15%~20%；收入中值较我们此前预测高出30%。我们归因于：一是AI服务器及HBM相关DRAM需求在中国市场持续井喷；二是国内云厂商与模组厂为规避单一供应链风险，正加速导入长鑫产能，客户基础显著拓宽；三是DRAM现货合约价格自2H26以来保持坚挺，公司高毛利产品出货占比提升。3Q26净利润指引为530亿~550亿元，环比微增，其中值较我们原预测高出17%，主要受营收超预期带动，而税率与少数股东权益分摊基本符合模型假设。 2. 技术平台迭代：Gen-5（G5）量产落地，制程微缩兑现成本优势 2026年9月，长鑫正式宣布第五代DRAM技术平台（G5）实现量产。该平台将主动区半节（Active-Area Half-Pitch）压缩至11.95纳米，核心功能区高度降至6,762纳米，在同等晶圆面积下实现更高层数的堆叠与更优的能效比。我们判断，G5的量产不仅意味着公司已从第一代至第四代的技术追赶期迈入自主迭代周期，更通过单位比特成本的快速下降，为其在标准DDR及LPDDR赛道 against 国际三强（三星、海力士、美光）的份额争夺提供了结构性成本护城河。该进展亦为后续切入HBM配套底层颗粒供应链奠定工艺基础。 3. 盈利预测调整：上调2026-2030年盈利，但毛利率曲线因收入结构变化而温和下移 基于3Q26指引及我们对AI驱动需求的上修，我们将公司2026-2030E收入预测上调1%~9%（2026年上调幅度最大，因低基数叠加旺季效应），对应净利润上调4%（2026E）、1%（2027E）及 thereafter 约1%。需要指出的是，上调后的2026E毛利率从原先的84.2%微调至81.4%，主要因收入确认口径中包含部分相对较低毛利的配套业务放量，但核心DRAM主业毛利率仍维持在85%附近的极优水平。 我们预计2026年全年收入达3875亿元（同比+527%），净利润1918亿元（同比+10132%）；2027-2030年收入CAGR约28%，净利润CAGR约25%，增长动能贯穿整个十年中期。 4. 估值方法论：Discounted P/E锚定长期成长，目标价微调至130元 我们沿用大中华区科技团队标准的远期P/E折现法（Discounted P/E）进行估值：以2030E预测每股收益（EPS 11.2元）为基准，赋予16.6倍目标P/E（该倍数源自可比公司远期P/E与盈利增速的相关性回归，对应CXMT 2030-31E平均净利润增速21%），并以12.7%的股权成本（COE，基于1.5倍Beta、3.0%无风险利率及6.5%股权风险溢价）折现至2027年，得出12个月目标价130元人民币（前值129元）。对应2027E预测P/E约24倍、2028E约18倍，处于历史区间中枢偏下位置，考虑到其盈利增速与ROE水平（2027E CROCI超117%），风险调整后回报极具吸引力。 5. 关键下行风险提示 我们警示三类核心风险：一是地缘政治与出口管制升级，可能限制其设备/材料进口或海外客户拓展；二是DRAM行业周期性超预期下行，若全球产能扩张节奏失控导致合约价暴跌，高毛利模型将面临快速均值回归压力；三是技术追赶不及预期，尤其在HBM及先进封装环节的良率爬坡若滞后于三星/海力士，可能错失AI高端增量市场。 6. 投资评级与配置启示 在国产替代与AI基础设施双主线并行的背景下，长鑫科技已从“概念标的”切换至“确定性业绩释放期”。我们建议投资者忽略短期季度间毛利率的微小波动，聚焦其市场份额与产能扩张的线性外推。维持买入评级，目标价130元。短期股价催化剂包括：4Q26E环比增长数据的确认、G5平台良率进一步爬坡的公开披露，以及潜在的国家大基金三期注资或政策性信贷支持。#文字观点", "publish_time": "2026-10-20 12:05", "tags": ["文字观点"]}, "post:2026-10-20T11-25:f591b9997cfb": {"id": "post:2026-10-20T11-25:f591b9997cfb", "kind": "post", "title": "2026-10-20 11:25", "source_label": "帖子正文", "excerpt": "机器人对话第十八期・极简省流版 一句话总结： Roadster 验证执行器跨产品复用的可能性，OpenAI 是具身智能中期变量，特斯拉 Q3 财报是近期验证窗口；产业研究重点从“技术能否实现”转向“产线、交付与商业化能否兑现”。", "content": "机器人对话第十八期・极简省流版 一句话总结： Roadster 验证执行器跨产品复用的可能性，OpenAI 是具身智能中期变量，特斯拉 Q3 财报是近期验证窗口；产业研究重点从“技术能否实现”转向“产线、交付与商业化能否兑现”。#Roadster× Optimus：执行器平台化 Roadster 主动尾翼采用 Optimus 腿部执行器相关技术，体现特斯拉执行器体系的跨产品复用能力。核心逻辑：整机需求反推关节性能 → 电机、传动等协同优化 → 模块化、通用化减少型号 → 降低制造复杂度与成本。但公司未披露具体型号，也未确认是否为完全相同的硬件总成，不能直接推导出 Optimus 量产兑现。 特斯拉继续强化执行器总成设计与制造的自主掌控，供应商的价值空间更多取决于核心零部件性能、工艺一致性、良率、成本和稳定交付能力。后续重点看：执行器规格是否收敛、跨产品复用是否扩大、供应链降本及实际出货是否兑现。#OpenAI模型+硬件+真实数据OpenAI 进入机器人领域，核心是补齐模型能力、底层控制、硬件和真实数据采集。大模型有望提升空间理解、任务规划与纠偏能力，但精细操作、力控、接触反馈和执行节拍仍是难点。短期更可能带来技术迭代和数据需求增长，产业链映射偏技术催化，不能直接等同于机器人整机大规模出货。#但大大压缩具身智能模型成熟时间，这是中期变量。#特斯拉Q3财报：看盈利也看机器人兑现汽车业务：毛利率、盈利质量、自由现金流、储能表现及资本开支。 AI / Robotaxi / Optimus：重点看管理层是否给出可信的业务进度与时间表。 Optimus 不宜只盯产量目标，核心是 Fremont 产线进展、核心零部件出货、各工序成功率、人工干预程度、灵巧手自动化产线，以及训练数据规模与质量。商业化还要看首批产品采用销售还是租赁、单台成本、潜在客户与应用场景。 行业判断：从“能否实现”转向“何时兑现、如何盈利” 核心结论： Roadster 是硬件体系化的旁证，OpenAI 是行业中期变量，Q3 财报是近期验证窗口。研究应从发布会叙事转向产线效率、实际交付、成本曲线和商业闭环。#文字观点", "publish_time": "2026-10-20 11:25", "tags": ["Roadster", "OpenAI模型+硬件+真实数据", "特斯拉Q3财报", "看盈利也看机器人兑现", "文字观点"]}, "post:2026-10-20T11-21:76349e9b48dd": {"id": "post:2026-10-20T11-21:76349e9b48dd", "kind": "post", "title": "2026-10-20 11:21", "source_label": "帖子正文", "excerpt": "【浙商计算机 刘雯蜀/郑毅】端侧AI，万众创新#小模型能力持续提升，VibeCoding促使端云协作降低新品开发门槛。轻量模型从文本处理向视觉、语音理解及工具调用拓展，支持更自然的多模态交互。", "content": "【浙商计算机 刘雯蜀/郑毅】端侧AI，万众创新#小模型能力持续提升，VibeCoding促使端云协作降低新品开发门槛。轻量模型从文本处理向视觉、语音理解及工具调用拓展，支持更自然的多模态交互。细分场景下，终端可在本地完成高频任务，通过云端处理复杂任务，复用成熟模型能力，加快产品开发。 #应用从问答交互向个性化服务与专项任务执行拓展，AI眼镜增加识图问答与实时翻译，AI玩具拓展互动陪伴，AI穿戴结合持续健康记录与个性化指导，AI耳机融入翻译与健康功能，功能机器人围绕清洁、配送等任务落地...。 #终端落地带动连接与低功耗计算需求。云端调用、数据同步及设备互联增加蜂窝、Wi-Fi与蓝牙连接需求；多模态感知与实时响应推动SoC集成计算、连接与AI处理能力，兼顾算力、功耗和成本。 #持续交互进一步提高供电、续航与轻量化要求。信号采集、音频输出及电源管理带动模拟器件升级；紧凑的终端空间提高电池能量密度与适配要求，轻质高强材料和精密加工则支持终端减重，改善佩戴与使用体验。 建议关注：#SOC：乐鑫科技、瑞芯微、晶晨股份、恒玄科技；#通讯模组：移远通信、广和通；#模拟芯片：艾为电子、圣邦股份、思瑞浦、南芯科技；#电池：豪鹏科技、亿纬锂能；#轻量化材料：达瑞电子、金发科技、长盈精密、领益智造；#终端应用：OpenAI、Meta、Google、苹果、Alphabet、小鹏汽车、石头科技。 风险提示：模型与生态进展不及预期；终端需求及商业化不及预期；技术路线变化与竞争加剧；数据隐私与应用安全风险。 详细情况联系浙商计算机刘雯蜀团队#文字观点", "publish_time": "2026-10-20 11:21", "tags": ["小模型能力持续提升", "Vibe", "SOC", "通讯模组", "模拟芯片", "电池", "轻量化材料", "终端应用", "文字观点"]}, "post:2026-10-20T10-44:6c94145bf169": {"id": "post:2026-10-20T10-44:6c94145bf169", "kind": "post", "title": "2026-10-20 10:44", "source_label": "帖子正文", "excerpt": "【华泰宏观】海外每日评论 数据：加拿大9月消费者价格指数同比3.1%，高于前值3%，低于预期3.2%。政策：地缘政治方面，鉴于胡塞武装持续发动袭击，沙特将一年一度的未来投资倡议大会推迟至2027年举行，该国还延长了主要机场的航班起降限制", "content": "【华泰宏观】海外每日评论 数据：加拿大9月消费者价格指数同比3.1%，高于前值3%，低于预期3.2%。 政策：地缘政治方面，鉴于胡塞武装持续发动袭击，沙特将一年一度的未来投资倡议大会推迟至2027年举行，该国还延长了主要机场的航班起降限制；美国能源部长表示，受制裁油轮在通过审批程序后可以合法运输原油。美国方面，特朗普经济顾问哈塞特表示，9月消费者价格数据表明整体通胀仍需政策关注。欧洲方面，在当局采取更严格安全措施，包括部分地区实施宵禁后，席卷法国多地的抗议活动已基本平息，骚乱局势逐渐缓和；受政治因素影响，法国国债下跌，股市相对德国股市的估值折价创近二十年以来最大。科技方面，AI云计算公司Nscale据悉洽谈向Anthropic出售算力，潜在交易价值约450亿美元。 股市：周一美股三大股指涨跌不一，标普、纳指分别上涨0.4、1.1%，道指下跌 0.1%。分行业看，可选消费、信息技术等板块领涨，公用事业、房地产等板块领跌。 债市：周一美债收益率上涨，2y、10y美债收益率分别上行6bp、7bp至4.77%、5.14%。市场定价联储2026年剩余累计加息幅度为27bp。 汇市：周一美元指数上涨0.1%，报102.0；欧元贬值0.2%，报1.12；日元贬值0.3%，报158.5。 商品市场：周一大宗商品多数下跌。布伦特原油期货下跌0.3%，报109.6美元/桶；WTI原油期货上涨2.2%，报103.7美元/桶；黄金现货下跌0.6%，报4140.7美元/盎司；白银现货上涨0.2%，报57.1美元/盎司；LME期铜下跌0.5%，报14339.0美元/吨。 今日关注：美国9月新宅开工季调后折年率（预估为130.5万，前值为127.5万）；美国9月建筑许可季调后折年率初值（预估为138.5万，前值为140.3万）；美国9月二手房销售签约量环比（预估为-0.5%，前值为0.3%）；英国8月ILO失业率（预估为4.9%，前值为4.9%）；欧洲央行首席经济学家Lane讲话。#文字观点", "publish_time": "2026-10-20 10:44", "tags": ["文字观点"]}, "attachment:files/东吴证券-顺络电子(002138)AI算力浪潮下的电感龙头，服务器与光模块打开成长天花板-261020.pdf": {"id": "attachment:files/东吴证券-顺络电子(002138)AI算力浪潮下的电感龙头，服务器与光模块打开成长天花板-261020.pdf", "kind": "attachment", "title": "东吴证券-顺络电子(002138)AI算力浪潮下的电感龙头，服务器与光模块打开成长天花板-261020", "source_label": "东吴证券", "excerpt": "第1页/共24页本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明食品饮料 分析师：刘冉 登记编码：S0730516010001 liuran@ccnew.com021-50586281从大客户依赖到全渠道驱动的转型之路 ——千味央厨(001215)公司深度分析", "content": "第1页/共24页本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明食品饮料 分析师：刘冉 登记编码：S0730516010001 liuran@ccnew.com021-50586281从大客户依赖到全渠道驱动的 行业发展报告》的数据，截至2025年中国 预制菜市场的规模达6173亿元，较2019年的2445亿元增加3728亿元，期间年均增幅达21.78%， 是近年来增长较快的市场之一。 图表1：中国预制菜市场规模及增长（亿元；%） 资料来源：艾媒咨询，食品伙伴网，中原证券研究所整理 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 食品饮料 第4页/共24页 本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明预制菜市场按客户类型可分为B端和C端两大板块。B端主要面向餐饮连锁、团餐、酒店、 商超熟食区等企业客户，核心诉求是降本增效、标准化出品和稳定供应，具有采购量大、单品 集中、定制化程度高、客户粘性强等特点；但在B端市场，客户议价能力较强，供应商的毛利 率通常相对较低，且B端市场对研发响应、品控体系和冷链供应链效率的要求较高。C端则面 向家庭消费者和个人用户，核心诉求是便捷、美味、健康和性价比，购买频次相对分散，单品 规模较小，品牌认知、渠道运营和营销推广的重要性突出。C端市场的毛利率通常高于B端市 场，但获客成本、品牌建设费用和消费者口味变化带来的不确定性也更大。 1.2.1.B端市场 目前预制菜在餐饮B端的渗透率仍处于较低水平，随着市场推广的持续深入，未来引入预 制菜的餐饮企业将逐步增多，渗透率仍有较大的提升空间。 根据《中国烹饪协会五年（2021-2025）工作规划》和世界中餐业联合会《中餐工业化发展 报告（2025）》的披露，我们估算，如果以餐饮企业食材采购金额作为分母，预制菜在餐企采 购中的平均占比自2020年以来维持在10%至15%区间。 尽管预制菜在餐企采购中的平均渗透率虽没有发生太大的变化，但预制菜在B端渗透的结 构性特征显著：头部连锁餐饮企业的渗透率较高，如真功夫、吉野家等达85%以上，但广大中 小餐饮门店因菜品标准化程度低、供应链触达难，因而渗透率提升缓慢。所以，预制菜渗透率 的整体爬坡实质是预制菜对中小餐饮门店进行覆盖的过程。 此外，预制菜的渗透率也因地域不同而呈现差异特征。根据《2025至2030中国预制菜产 业商业模式创新及区域市场渗透率研究报告》，在长三角、珠三角及京津冀等餐饮标准化程度 高的区域，预制菜在B端的渗透率分别达到28%、22%、16%；而在中西部地区，由于受制于供 应链基础设施，渗透率仍处于较低水平，如在西北市场的渗透率仍不足10%，因而也是未来预 制菜增量的主要地区来源。根据广东省农业科学院蚕业与农产品加工研究所副所长的介绍，在 广东省预制菜在B端的渗透率已达到50%，这一数据远高于华南地区22%的平均水平。可见， 预制菜的渗透率与冷链基础设施、消费认知和社会开放程度均有关系。 图表2：预制菜B端渗透率的区域差别 资料来源：《2025至2030中国预制菜产业商业模式创新及区域市场渗透率研究报告》，中原证券整 理 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 食品饮料 第5页/共24页 本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明1.2.2.向C端拓展 预制菜在中国零售市场的销售额已经经历了快速增长。根据艾媒咨询、日本预制菜协会和 GlobalData的数据，2025年国内预制菜在零售市场的销售额约1973亿元，在预制菜整体销售 额中占比达到32%；同期，日本的预制菜零售额是5034亿元，美国为2420亿元。尽管距他国 仍有差异，预制菜在中国零售市场的销售额也已经经历了快速增长：从2020年的450亿元增至 2025年的1973亿元，期间年均增速达到56.41%。 目前，预制菜在中国零售市场呈现如下消费特征： 家庭小型化，女性普遍工作，年轻人崇尚“懒宅”等等社会现状，都是预制菜介入个体生 活的内在原因。家庭小型化降低了做饭的必要性，同时抬高了做饭的成本；女性的社会属性增 强，年轻人的“懒宅”崇尚，也都使得“做饭”的难度上升。根据《2021年中国连锁餐饮行业 报告》，自2016年以来中国的家庭规模不断下降，截至2019年我国一人户家庭占比为18%、 二人户家庭占比为30%，当前的平均家庭规模仅为2.9人。此外，关于采购预制菜的动机，美 团曾在用户中做过市场调查，其中“节省时间”占据第一位，“厌恶或不会做饭”占据第二位， “好吃美味”和“安全保障”也颇具权重。由此可见，社会发展现状是预制菜介入个体生活的 根本动因。 预制菜的C端消费场景高度细分。其一，“一人食”经济是重要增长极：2025年“一人食” 餐饮市场规模预计突破1000亿元。由此，预制菜企业纷纷推出小包装产品。其二，节假日家庭 消费是另一个增长极。2025年春节，预制菜销售额突破200亿元，同比增长超50%。除夕场景 下，33%的受访者选择“自己做+预制菜辅助”，21%直接购买预制菜套餐；日常场景中，寒暑假 和周末居家带动休闲预制菜销量攀升，工作日则以便捷正餐预制菜为主，呈现出明显的强季节 和场景特征。 线上渠道是触达消费者的第一入口。库润数据《2025年预制菜市场趋势洞察》显示，综合图表3：预制菜在零售市场的需求构成 资料来源：美团中原证券整理 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 食品饮料 第6页/共24页 本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明电商平台的预制菜零售额连续两年居首；生鲜平台、新零售门店也是重要的线上渠道。库润数 据的调研揭示：一线城市消费者在新零售门店购买预制菜的比例为50.6%，二线城市为60.8%， 三线城市为58.5%；作为对照，综合电商平台在一线、二线、三线城市的使用率分别为52.2%、 53.2%和52.7%。因此，在二线和三线城市，新零售门店的渗透率甚至超过了综合电商平台。 华东市场消费领先，下沉市场正在跟进。根据春雪食品2025年年报，预制菜的消费区域 集中度较高，华东、华南为核心消费市场。从实际调查来看，预制菜也正在从城市向县乡市场 渗透，比如，农村宴席呈现了两种形态——高端宴席仍坚持本地厨师现场制作，而普惠性红白 喜事则全面转向预制套餐。为了配合预制菜消费下沉趋势，企业通过“中央厨房+县域配送中心” 的模式将标准化生产端延伸至基层市场。 高性价比是核心竞争力，品牌信任是最大的备书。预制菜作为大众消费的一个品类，消费 者对其价格的敏感度较高。同时，品牌在购买决策中的权重显著：根据艾媒咨询《2024年中国 新春年菜消费市场研究报告》，67.4%的消费者在购买年菜时会考虑品牌。 消费者对预制菜的食品安全满意度小幅提升。根据库润数据《2025年预制菜市场趋势洞察》， 2025年消费者对预制菜食品安全的满意度较2024年小幅提升1%，但对价格合理性、营养均衡 性的满意度呈下降趋势。这意味着，随着预制菜的食品安全改善，消费者对食品安全的焦虑缓 解而对“质价比”的要求正在升级。 2.政策扶植和资本参与 我国的预制菜行业起步相对较晚，但是在政策方针的大力支持下，在社会资本的积极参与 下，近年来行业获得了长足的发展。自2017年以来，针对食品工业国家出台了一系列产业扶持 政策，从强调食品安全，到大力推进食品工业现代化，再到绿色食品产业集群的打造，表明了 对于预制菜行业快速发展全力支持的态度。 图表4：预制菜行业相关政策文件内容 时间 相关政策文件 相关表述 2017年2月《“十三五”国家食品安全规划》确保生产经营各环节数据信息采集留存真实、可靠、可朔源；食品安 全标准与国际接轨，建立最严谨的食品安全标准体系。 2017年4月《关于加快发展冷链物流保障食品安全促进 消费升级的意见》健全冷链物流标准和服务规范体系，完善冷链基础设施网络，鼓励冷 链物流企业经营创新，提升信息化水平。 2017年5月《“十三五”食品科技创新专项规划》推进食品产业和科技的融合，增强食品科技创新能力，培育食品领域 的新业态和新兴产业。 2019年5月《关于深化改革食品安全工作的意见》实行食品生产企业风险分级管理，建立覆盖基地贮藏、物流配送、市 场批发、销售终端全链条的冷链配送体系。 2021年3月《中华人民共和国国民经济和社会发展“十 四五”规划和2035年远景目标纲要》大力发展绿色食品产业，支持重大项目建设，强化绿色食品产业链， 形成具有竞争力的产业集群，推动食品制造产业迈向万亿级门槛。 2021年11月《绿色食品产业“十四五”发展规划纲要》明确“十四五”期间绿色食品产业发展目标，产业规模稳步扩大，从 业企业达到2.5万家，产品数量达到6.5万个，标准化原料基地达到 800个；绿色食品产业的产品结构进一步优化，加大畜禽和水产品占 比；品牌影响力进一步扩大，品牌知晓率达到80%。 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u \u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 食品饮料 第11页/共24页 本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明托服务国际餐饮企业的品牌优势拓展当地市场。 3.3.公司的上游供货商 千味央厨的原材料采购涵盖面粉、油脂、糯米粉、肉类、蔬菜等多种品类。公司制订了国 际级原材料采购标准，从源头严控食材品质，主要向中粮国际、益海嘉里、河南黄国粮业等大 型粮油企业采购。凭借行业地位和生产经营规模优势，公司与主要供应商保持了长期稳定的合 作关系，原料供应渠道稳定。根据公司官网的披露，其中中粮国际是千味央厨最大的面粉供应 商，双方的合作始于2012年千味央厨成立之初；河南黄国粮业则为公司提供了糯米粉支持，协 助打造了公司的首个大单品“芝麻球”。 公司的供应商结构呈现出高集中度与长期绑定的特征，通过规模承诺和长期合同换取供应 稳定性与价格可预期性。2025年，公司的前五名供应商合计供货金额3.43亿元，占年度采购 总额比例为40.45%，较2022年的50.98%下降了10.53个百分点，采购集中度呈现趋势下行的 态势。在采购模式上，公司采用合同加招标的方式，并根据原材料的不同属性采取差异化的采 购策略。大宗农产品的价格波动周期长、单次采购金额大，适合年度锁价；而其他物料的价格 变化更快、需求更灵活，适合更短周期的议价。公司的物流运输主要依托第三方冷链物流企业， 并通过公开招标的方式选择承运商。 千味央厨的采购机制正在从传统的“大宗锁价+年度招标”向多维度的供应链管理演进。在 供应商层面深化与中粮、益海嘉里等核心伙伴的战略绑定；在采购执行层面保留分层议价和锁 价机制的灵活性；在成本管控层面从内部压减转向上下游协同；在质量层面维持一票否决的刚 性约束；在物流层面通过油价联动和到岸价将运费成本透明化。这套机制的运行效率决定了公 司在B端餐饮供应链这个天然低毛利行业中能否维持可持续的盈利能力。 图表11：预制菜上市公司前五大供应商采购金额占比（%） 资料来源：中原证券研究所iFinD 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 食品饮料 第12页/共24页 本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明3.4.公司的下游客户结构 千味央厨目前已经形成了直营和经销两大渠道并行的客户结构。 3.4.1.直营客户 直营客户以全国性品牌连锁餐饮和零售企业为主，核心客户包括百胜中国（肯德基、必胜 客）、海底捞、华莱士、老乡鸡、真功夫、九毛九、盒马、沃尔玛等。截至2024年，大客户数 量为173家；截至2025年，大客户数量为188家，同比增加8.67%。截至2025年末，百胜中 国、海底捞、华莱士等头部餐饮企业贡献稳定订单；其中，前五大客户合计销售金额6.48亿元， 占总销售金额比例为34.4%。 按照我们的核算，2024年至2026中期期间，公司的直营渠道营收录得了18.55%的平均增 长，意味着连锁餐饮和标准化餐饮近年来有可观的起色。关于增长的来源，公司表述为“主要 得益于B端餐饮、团餐需求韧性复苏，公司亦抓住了渠道提升的机遇，传统餐饮大客户、新零 售大客户均实现较快增长”。这一表述传递出直营渠道的结构变化。直营渠道的增长并非单一 依赖传统的餐饮大客户，而是由传统餐饮大客户和新零售大客户共同驱动。 根据公司2026年半年报，公司的前五大客户合计收入3.78亿元，同比增长18.60%。其中， 前五大客户中仅有一家客户的收入下滑，其余四家均实现正增长，其中一个大客户的营收增速 高达138.59%，是拉动整体增长的核心变量。2025年，前五大客户的销售贡献比率34.4%，较 2023年的35.59%出现了些微下降，意味客户结构更加多元化，大客户结构正在从“一家独大” 向“多极支撑”的方向发展。 图表12：公司前五大客户销售金额占比变化趋势（%） 资料来源：中原证券研究所iFinD 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-20T20-05:af537f91de9a": {"id": "post:2026-10-20T20-05:af537f91de9a", "kind": "post", "title": "2026-10-20 20:05", "source_label": "帖子正文", "excerpt": "PTFE混压方案专家会更新：PTFE混压方案进展顺利/趋势明确，持续看好产业链投资机会！各位领导好，我们近日举行了PTFE/碳氢CCL材料专家会，核心要点如下： 1）PTFE混压方案进展顺利，有望在Rubin ultra落地：当前PTFE-M9混压方案已进入装机测试环节，交换板良率约5成，已逐步具备", "content": "PTFE混压方案专家会更新：PTFE混压方案进展顺利/趋势明确，持续看好产业链投资机会！各位领导好，我们近日举行了PTFE/碳氢CCL材料专家会，核心要点如下： 1）PTFE混压方案进展顺利，有望在Rubin ultra落地：当前PTFE-M9混压方案已进入装机测试环节，交换板良率约5成，已逐步具备量产基础，正交背板方案则在正常推进中；PTFE混压方案仍为英伟达最重视的高端场景材料方案，rubin ultra率先落地确定性持续提升。 2）碳氢混压方案为台系主推的阶段性过渡方案：由于台系供应商在PTFE材料方面进展受阻，因而于26Q3转而向英伟达提出碳氢-M9混压的过渡方案，目前处于PCB制作阶段，9月底启动混压测试、预计11月输出测试报告，需面对填料配比、粉尘控制、良率提升等问题，整体进程慢于PTFE混压方案 3）方案对比：PTFE趋势仍明确，碳氢方案需持续观察。PTFE（DK2.1、Df 0.0001）电学性能显著优于碳氢（DK2.4-2.8、Df 小于0.0005），且价值量更高（PTFE 1500元/张+ vs 碳氢 1200元/张），是未来速率持续提升下的明确材料升级方向，碳氢方案仅可能用于阶段性过渡，结合进展节奏、工艺卡点综合判断，专家认为PTFE方案预计仍为未来主流方案。 4）领先厂商：PTFE材料加工难点主要体现在PTFE树脂的长短链混胶、氟系官能团与填料的混合、PTFE与铜箔的结合，工艺壁垒较高，目前以生益科技、罗杰斯领先；铜箔预计使用HVLP4四代铜箔，领先厂商为日本三井、日本古河；树脂为日本大金、国内东岳；填料为日本电化、日本新日铁、日本雅都玛、国内联瑞新材等。投资观点：我们看好PTFE混压方案在实现性能、量产平衡下推动下一代高端PCB方案落地，同时建议重视材料/工艺升级带来的格局洗牌机会。重点推荐：生益科技、深南电路、沪电股份，建议关注联瑞新材、东岳集团等。#文字观点", "publish_time": "2026-10-20 20:05", "tags": ["文字观点"]}, "post:2026-10-20T10-50:76071aab5fdf": {"id": "post:2026-10-20T10-50:76071aab5fdf", "kind": "post", "title": "2026-10-20 10:50", "source_label": "帖子正文", "excerpt": "🌀【天风电新】科翔股份调研要点- 1019 ——————————— ✅主业PCB Q3业绩扭亏为盈一方面是优质客户订单数量持续增加，服务器电源、AI端侧高端客户订单放量，减少原有低端车载订单，净利率持续抬升；另一方面，q2末q3初，CCL涨价全面顺价。", "content": "🌀【天风电新】科翔股份调研要点- 1019 ——————————— ✅主业PCB Q3业绩扭亏为盈一方面是优质客户订单数量持续增加，服务器电源、AI端侧高端客户订单放量，减少原有低端车载订单，净利率持续抬升；另一方面，q2末q3初，CCL涨价全面顺价。 展望q4及明年，公司业绩维持逐月提升的态势，#9月利润比7月高75%，预计10月利润继续爬升，q4业绩环比提升。当前CCL价格传导给客户顺利，2-3周重新议价。 ✅混压陶瓷基板HDI #北美大客户已经给公司明确的27-29年三年意向需求指引，目前公司在进行capex规划，规划提交后，客户有望通过设备帮扶形式支持公司未来资本开支计划。 为了匹配客户进展，我们预计公司扩产在即，九江惠州同步扩产，其中九江基地以HDI为主，惠州以msap和陶瓷基板为主，部分设备已经下订单。 当前阶段公司明年出货仍旧以陶瓷基板HDI为主，陶瓷基板产能有多余后再供给单独陶瓷基板给PCB厂商，#预计明年初陶瓷基板开始有月度小几千万营收贡献。 ❗️内部资料，请勿外传 ——————————— 欢迎联系：孙潇雅/赵子淇#文字观点", "publish_time": "2026-10-20 10:50", "tags": ["文字观点"]}, "post:2026-10-20T12-09:af87a3f2e30a": {"id": "post:2026-10-20T12-09:af87a3f2e30a", "kind": "post", "title": "2026-10-20 12:09", "source_label": "帖子正文", "excerpt": "高盛——日本电子元器件：非覆盖公司交流纪要——Meiko Electronics（印制电路板）、Nihon Dempa Kogyo（石英晶体器件）与Nippon Chemi-Con（铝电解电容） 一、核心结论：AI/数据中心需求成为全行业共性驱动力，产品结构升级与内容量增长超越单纯量增 2026年1", "content": "高盛——日本电子元器件：非覆盖公司交流纪要——Meiko Electronics（印制电路板）、Nihon Dempa Kogyo（石英晶体器件）与Nippon Chemi-Con（铝电解电容） 一、核心结论：AI/数据中心需求成为全行业共性驱动力，产品结构升级与内容量增长超越单纯量增 2026年10月，高盛日本团队与非覆盖的上述三家日本电子元器件龙头举行管理层交流，核心共识在于：AI服务器、数据中心（AI/DC）及卫星通信等高端应用场景的需求爆发，正从单一的量增转向“量价齐升+结构优化”。地缘政治驱动的供应链多元化进一步加速了日系厂商在高附加值领域的份额获取。高盛在覆盖组合中重申对Murata（CL）、Taiyo Yuden、TDK、Renesas、Rohm、Ibiden及Nichicon（10月18日上调至买入）的买入评级，视其为AI/DC需求外溢的核心受益标的。本次纪要进一步印证，非覆盖公司同样处于这一产业趋势的红利区间，且盈利改善路径清晰。 二、Meiko Electronics：汽车PCB基本盘稳固，卫星与AI服务器成第二增长曲线 Meiko全球汽车PCB市占率领先，在地缘风险促使客户供应链多元化的背景下，公司正将产能向高附加值领域倾斜： 1. 卫星通信：一季度销售额同比暴增184%，现有客户份额扩大，新客户认证已完成；除地面天线外，公司预计2028财年卫星相关收入贡献可达约100亿日元。 2. AI服务器：一季度同比+86%，当前eSSD模块PCB占主导，但ASIC用高层板预计本财年下半年起贡献收入；光学收发器用PCB因地缘因素询单激增。 3. 智能手机/平板：一季度+33%，下半年北美客户将开始放量。 4. 汽车：一季度+25%，策略上从动力总成（通孔板）向自动驾驶与座舱用积层板（build-up PCB）转移。 产能方面，越南工厂（不含封装基板）已满载，中期计划（2026–2028财）三年资本开支合计2100亿日元，重点扩充服务器与卫星项目产能。因产品线柔性较高，公司可灵活捕捉订单；同时通过铜箔基板（CCL）等成本端的敏捷转嫁机制与产品组合优化，目标在原材料涨价环境中维持利润率。 三、Nihon Dempa Kogyo（NDK）：汽车与通信现金牛之外，三大高附加值领域定义长期成长 NDK主营石英晶体器件（晶体单元与振荡器），核心汽车电子与移动通讯/IoT业务提供稳定现金流，未来增长由工业设备、专设设备与光学产品三大板块驱动： 1. 工业设备（光模块、AI服务器等）：一季度销售同比+113%，预计2026财年AI/DC应用占比将接近70%。其中，结合IC的振荡器价值量高；800G光模块用晶体供需紧张，下一代1.6T（312.5MHz等）产能正在扩张；AI服务器的计算托盘与交换托盘用量上升，并计划向NIC（网卡）拓展。 2. 汽车电子：一季度+18%（显著高于全年指引的4%年均增速），主因客户短期库存回补；长期受ADAS驱动，单车元器件数量年增约5%。 3. 专设设备（防务等）：从零部件供应转向整机（如通信设备），盈利改善，订单能见度已延伸至2028财年（部分至2030财年）。 4. 光学产品（半导体设备用等）：从消费相机镜头向DUV光刻机相关组件延伸，预计下一中期计划内开始贡献收入。 公司计划通过现有产线设备更新，在2030财年实现较2023财年三倍的产能，并借助高附加值产品占比提升摊薄固定成本，中长期利润率改善路径明确。 四、Nippon Chemi-Con：AI/DC拉动电容量价齐升，盈亏平衡点改革推进中 Nippon Chemi-Con以铝电解电容为主（占比近90%），同时布局双电层电容与MLCC。公司正依托AI/DC需求扩大电容业务，并在中期计划下推动“盈亏平衡点（BEP）改革”以重塑盈利结构： 1. AI服务器：一季度销售同比+105%，产品结构约为60%为PSU用大型铝电解电容、20–25%为CPU周边用导电聚合物电容、其余为48V DC/DC转换器用混合电容。当前产线满负荷，大型铝电解电容扩产顺利，二季度起将贡献增量。 2. ICT（通用服务器等）：一季度+8%，推理服务器兴起带动CPU周边与电源用电容需求持续扩张。 3. 工业设备：一季度+34%，客户库存正常化后订单复苏快于预期，数据中心相关（机床、配电、UPS、空调等）增长强劲。 4. 汽车：一季度+11%，电动化推动单车元器件年增5–7%，日本、欧美EV应用继续放量。 未来增长点包括2027–2028财年AI/DC用双电层电容导入，以及BBU（电池备用单元）用大容量高压MLCC的推广。盈利改善方面，公司通过高附加值产品扩张与成本削减提升边际利润率；铝价转嫁政策不变（全年指引假设定价正面影响15亿日元，对冲材料与电费负面27亿日元）。其一体化生产模式（大电容量产带动自产铝箔利用率提升）亦构成内在成本优势。 五、高盛投资含义与受益标的排序 本次非覆盖公司交流进一步确认：日本电子元器件行业正全面进入“AI/DC定义需求”的阶段，且这种需求不仅体现在服务器内部，更向卫星、防务、半导体设备等广义基础设施扩散。产品组合中高附加值品类（高层PCB、振荡器、大型电容、混合电容）占比快速提升，使得即便在宏观波动下，头部厂商的盈利能见度仍在上修。 高盛建议投资者沿以下主线配置： 1. 直接受益于AI/DC硬件放量的被动件与基板龙头：维持对Murata（CL）、Taiyo Yuden、TDK、Ibiden的买入评级； 2. 半导体与汽车芯片环节：Renesas、Rohm作为AI边缘侧与车规核心卡位标的继续推荐； 3. 电容赛道补涨与结构优化标的：Nichicon获上调至买入，本次交流中的Nippon Chemi-Con亦展现BEP改革带来的利润率重估潜力； 4. 供应链安全与地缘重构受益者：Meiko的越南产能与NDK的防务/光模块拓展，说明“在中国+1”与本地化服务正转化为订单实质增长。 六、主要风险提示 1. 铝、CCL等原材料价格短期暴涨且转嫁滞后，压制季度毛利率； 2. 北美云厂商资本开支指引下修，导致AI服务器相关订单节奏放缓； 3. 汽车端库存回补（如NDK一季度现象）若被证实为一次性，可能引发后续季度增速回落； 4. 地缘政策变动影响跨国产能调配与客户认证进度。 七、核心结论 高盛通过与三家非覆盖龙头的深度交流，验证了日本电子元器件产业在AI/DC周期中的“量、价、结构”三重共振。Meiko的卫星与服务器PCB、NDK的光模块与防务晶体、Nippon Chemi-Con的AI电源电容，均呈现高景气与高确定性。我们建议客户在组合构建上，超配具备技术壁垒与产能全球化布局的日本元器件核心资产，并关注非覆盖公司中因盈利结构改革而存在预期差的机会。短期波动提供介入窗口，中期产业趋势未改。#文字观点", "publish_time": "2026-10-20 12:09", "tags": ["文字观点"]}, "post:2026-10-20T15-25:33ae45ac2268": {"id": "post:2026-10-20T15-25:33ae45ac2268", "kind": "post", "title": "2026-10-20 15:25", "source_label": "帖子正文", "excerpt": "📑📌建滔积层板：覆铜板与电子玻纤布受益于 AI 趋势及规格升级 📌我们近期在香港对建滔积层板（1888.HK，暂未覆盖）开展了实地走访交流。📌本次交流的核心议题包含三点：第一，覆铜板以及玻纤布的价格走势", "content": "📑📌建滔积层板：覆铜板与电子玻纤布受益于 AI 趋势及规格升级 📌我们近期在香港对建滔积层板（1888.HK，暂未覆盖）开展了实地走访交流。 📌本次交流的核心议题包含三点：第一，覆铜板以及玻纤布的价格走势；第二，玻纤布织机的供给情况；第三，产能扩张规划。📌整体来看，管理层对未来数个季度覆铜板及其上游材料的旺盛需求保持乐观态度。 📌支撑需求的逻辑来自 AI 产品规格升级带来的需求上涨，同时部分非 AI 领域产能转向 AI 相关产品生产。📌该公司持续扩张玻纤布、玻纤纱、铜箔以及覆铜板的自有产能，对 AI 相关产品的业务占比也在不断提升。 📌对照 AI 印制电路板、覆铜板行业情况来看，管理层提到 AI 覆铜板需求上行，与我们的观点保持一致。我们看好下一代高端 AI 服务器平台普及，会带动覆铜板需求源头内容加微wuxl3408走强以及产品规格迭代升级。 📌我们预计 2026‑2028 年全球 AI 服务器覆铜板市场规模复合年均增长率可达 161%，2028 年市场规模将达到 480 亿美元，高单值材料在市场当中的占比会持续提升。📌公司简介：建滔积层板（1888.HK）是全球覆铜板以及上游原材料（玻纤布、铜箔、环氧树脂等）的头部供应商之一。📌依托垂直一体化布局，该公司在中国及海外布局超过 20 座工厂，能够向客户提供具备成本优势的各类产品，下游终端市场布局多元，覆盖消费电子、家电、汽车以及工业领域。 📌建滔积层板是建滔集团（0148.HK，暂未覆盖）的下属子公司，建滔集团生产印制电路板，同时也是建滔积层板的主要客户之一。 📋核心要点 📌第一点，覆铜板以及玻纤布的价格展望：该公司在 2026 年前 9 个月已经经历多轮涨价，并且于 10 月中旬上调薄型电子玻纤布产品价格。 📌受上游原材料持续供给紧张的影响，叠加 AI 需求增长与产品规格升级，管理层预判后续价格走强的趋势还将延续。📌公司持续扩产特种玻纤纱产品，包含第一代、第二代低介电常数、低热膨胀系数以及石英玻纤纱，同时新增玻纤布相关产能。 📌第二点，玻纤布织机供给情况：管理层表示玻纤布织机整体供给依旧处于紧张状态，该公司已经锁定本年度的织机供货。 📌展望 2027 年，公众号小牛研报纪要伴随主要设备供应商扩产，公司计划采购更多玻纤布织机。 📌关于国产织机，管理层提到国产产品的供给正在增加，但该公司短期仍以采购海外设备为主。#文字观点", "publish_time": "2026-10-20 15:25", "tags": ["文字观点"]}, "post:2026-10-20T15-32:fd9c83381836": {"id": "post:2026-10-20T15-32:fd9c83381836", "kind": "post", "title": "2026-10-20 15:32", "source_label": "帖子正文", "excerpt": "大行评级｜高盛：微升长鑫科技目标价至130元，第三季收入及纯利指引胜预期 10月20日｜高盛发表研报指，长鑫科技公布2026年第三季收入指引介乎1150亿至1200亿元，环比持续增", "content": "大行评级｜高盛：微升长鑫科技目标价至130元，第三季收入及纯利指引胜预期 10月20日｜高盛发表研报指，长鑫科技公布2026年第三季收入指引介乎1150亿至1200亿元，环比持续增长15%至20%。收入中位数较该行此前预测高30%，该行归因于人工智能带动DRAM需求强劲、客户分散供应来源，以及DRAM价格维持高位。第三季净利润指引为530亿至550亿元，环比轻微增长，中位数较该行此前预测高17%。 该行预期公司2026年第四季收入将继续环比增长，并视长鑫为本地市场DRAM需求上升的主要受惠者，料盈利将强劲增长，动力包括中国人工智能需求带动服务器DRAM及HBM需求、客户分散供应商网络以更好确保供应，以及公司产能扩张。公司于2026年9月宣布第五代DRAM技术平台(G5)已开始量产，该行对其持续产品开发持正面看法。 该行计及第三季指引后，上调2026至2030年盈利预测分别4%、1%、1%、1%及0.2%，主要反映中国DRAM需求强劲及客户分散供应带动收入预测获上调；目标价由129元微升至130元，维持“买入”评级。#文字观点", "publish_time": "2026-10-20 15:32", "tags": ["文字观点"]}, "post:2026-10-20T12-08:6da0a0b81ff8": {"id": "post:2026-10-20T12-08:6da0a0b81ff8", "kind": "post", "title": "2026-10-20 12:08", "source_label": "帖子正文", "excerpt": "结论：在国产大模型竞争白热化的当下，单纯追求参数与榜单智能已非唯一护城河，推理成本效率、基础设施优化以及生态分发能力正成为决定性变量。", "content": "野村——DeepSeek专家电话会核心要点——模型智能之外，成本效率与生态圈重要性凸显 核心结论：在国产大模型竞争白热化的当下，单纯追求参数与榜单智能已非唯一护城河，推理成本效率、基础设施优化以及生态分发能力正成为决定性变量。DeepSeek通过“旗舰模型探顶+Flash高性价比模型放量”的双轨策略，结合极致的推理工程优化与峰谷定价机制，构建了难以复制的成本优势；与此同时，国产AI加速芯片在大规模预训练环节仍受制于互联与软件生态碎片化，但在推理侧替代进度将显著加快。展望后市，野村认为中国LLM（大语言模型）行业的竞争维度已全面扩展，最受益的三类玩家分别是：凭借极致推理经济学占据成本曲线的DeepSeek、依托架构创新与长程复杂推理的Moonshot AI（Kimi），以及手握超级流量入口与一体化应用生态的字节跳动。 1. DeepSeek的竞争战略：以“成本性能比”为核心的双轨制 专家指出，DeepSeek当前API收入主要由V4.1 Flash与V4 Pro贡献，其中Flash模型凭借在代码、软件工程及标准化Agent任务上的优异表现与极低定价，占据了API收入的绝大部分。公司未来仍将延续“大模型先行、高效模型跟进”的范式：下一代旗舰模型参数量有望达到当前V4 Pro的1.5至2.0倍，主攻复杂推理与长程Agent任务；同时通过更大规模的后训练与强化学习，持续压低Flash系列的推理成本。更重要的是，专家强调预训练缩放（pre-training scaling）已不再是差异化的唯一来源，架构创新、后训练工程与部署优化才是控制服务成本、提升商业变现能力的关键。一款纸面智能顶尖但推理成本高昂的模型，在商业化落地层面将面临显著阻力。 2. 护城河深挖：基础设施优化与国产芯片适配的难度被低估 野村在报告中着重提示，尽管主流大模型架构已基本开源，但真正难以被复制的壁垒在于底层基建优化与长期部署经验的积累。DeepSeek的API定价（尤其是对缓存输入的高折扣）之所以能长期保持吸引力，源于其MLA缓存架构与最新的KV-cache优化技术——该技术将KV缓存的HBM占用降至前代的四分之一、SSD占用降至八分之一，大幅降低了长上下文与Agent工作负载的重复计算开销。此外，针对第三方云资源的依赖，DeepSeek推出了峰谷定价机制（非高峰时段折扣达50%），既平滑了算力波动，又锁定了对价格敏感的高用量开发者客户。专家认为，这种“工程+基建”的组合护城河，是纯算法创新难以短期逾越的。 3. 国产算力现实：推理侧替代加速，预训练侧仍依赖英伟达 专家对国产AI加速器的应用前景给出了审慎且结构化的判断：在大规模预训练场景，国产芯片仍面临互联带宽不足、通信效率低、集群稳定性差等系统性挑战；加之主流训练框架与计算内核深度绑定CUDA生态，迁移至国产平台需进行大规模代码重写与内核重开发，且国内不同芯片厂商的软件栈彼此割裂，进一步推高了适配成本与开发周期。因此，国产芯片在预训练环节的替代进度缓慢，DeepSeek目前仅将其用于适配测试与小规模训练，大规模预训练仍主要依赖英伟达GPU。但在推理侧，由于对超大规模集群互联的要求相对较低，且软件适配工作量较小，国产加速器的采用速度将明显加快。 在厂商竞争格局上，专家将华为视为国内AI加速平台的绝对领先者；第二梯队中，寒武纪凭借推理能力与企业客户采用率居前，海光信息则依托CPU+DCU架构与软件兼容性占据一席；互联网自研芯片方面，阿里平头哥在推理效率上已具备与一线厂商竞争的实力（但主要内部部署），百度昆仑芯则被归类为第二梯队。 4. 行业终局推演：从“谁更聪明”到“谁更便宜、谁生态更强” 专家明确判断，中国LLM市场的竞争在未来12-18个月将从“模型智能比拼”全面转向“成本效率+生态落地+垂直场景适配”的综合较量。在此框架下，野村梳理出三类差异化赢家： • DeepSeek：胜在极致的推理经济学与开源社区渗透，有望成为开发者与Agent应用的“底层水电煤”； • Moonshot AI（Kimi）：胜在架构创新与长上下文、复杂推理能力，在高端企业用户与复杂任务场景中占据心智； • 字节跳动：虽非独立模型实验室，但凭借抖音、今日头条、TikTok等超级App的流量分发优势与一体化产品生态，能够实现模型的极速落地与数据反馈闭环，构成结构性护城河。 5. 投资启示与配置建议 对于二级市场投资者，野村认为上述趋势将加剧互联网与AI板块的内部分化：拥有自研芯片、云基础设施与海量应用场景的头部平台（如阿里巴巴、百度）将在“算力自主+模型成本可控”的循环中占据更长维度的胜势；而单纯依赖外部算力、缺乏生态闭环的独立模型公司，即便技术亮眼，其商业化路径与毛利率波动风险仍将高于市场预期。短期来看，关注国产推理芯片渗透率提升对云厂商资本开支效率的改善，以及Agent规模化部署带来的API调用量爆发，是布局下一阶段AI行情的核心线索。#文字观点", "publish_time": "2026-10-20 12:08", "tags": ["文字观点"]}}, "mode": "ai", "generated_at": "2026-10-21T01:33:24", "summary": {"total_posts": 381, "text_posts": 278, "attachments": 114, "sector_count": 8, "focus_stock_count": 4}}, "report_text": "# 小牛研报纪要 · 文字观点日报\n\n## 一、今日核心结论\n- AI算力资本开支与物理AI形成今日最集中主线：预计2026至2030年中国AI相关资本开支累计8.5万亿元 科技2026Q3收入指引1150亿至1200亿元、环比持续增长，目标价升至130元；存储板块维持乐观，供给紧张至少持续到2028年预测年末；TrendForce预计4Q26传统DRAM合约价环比上涨10%-15%；长鑫存储4F2技术取得进展。\u003c/li>\n\u003cli>\u003cstrong>机器人/自动化\u003c/strong>：主线是机器人硬件基本成熟，落地核心瓶颈在AI大脑，迭代关键是高密度有效具身数据。今天强化的逻辑包括特斯拉有效数据积累63万小时，100-200万小时可落地工厂作业，工厂端预计27年可大批使用；减速器、电机及配套等硬件已可满足人形机器人关节精准控制需求。今天出现的催化/验证包括特斯拉有望Q4发布Optimus V3，9月底完成大审厂并对供应链下单快速爬坡；上半年人形机器人整机产品突破400款、产量超4万台、全年预计突破10万台；OpenAI于10月正式确认自研人形机器人；凡拓数创中标广东省具身智能训练场建设项目一期综合调度中心项目及深圳国创具身智能机器人公司仿真。\u003c/li>\n\u003cli>\u003cstrong>PCB/CCL/铜箔与光通信/液冷电源\u003c/strong>：主线是AI服务器与交换机材料升级、光互联和电源散热瓶颈外移。今天强化的逻辑包括PTFE-M9混压方案进入装机测试，交换板良率约5成，已逐步具备量产基础，正交背板方案正常推进；铜箔预计使用HVLP4四代铜箔，领先厂商为日本三井、日本古河；800VDC高压配电从边缘话题重回核心，电源转换、储能与保护器件价值量显著提升。今天出现的催化/验证包括PTFE混压方案有望在Rubin ultra落地；2026年800G、1.6T光模块出货量预测分别为4500万只、3300万只；科翔股份Q3扭亏为盈，服务器电源、AI端侧高端客户订单放量；金田股份前三季度营收1222.29亿元、同比+33.20%，AI算力铜材显著放量；天岳先进Q3营收6.46亿元、同比+103%，归母0.86亿元、同比+979%。\u003c/li>\n\u003cli>\u003cstrong>新能源/电池与光储\u003c/strong>：主线是储能/UPS成为锂电池主要增长动力，电池龙头份额集中。今天强化的逻辑包括2026日历年锂电池市场预计同比+31%至2.4TWh，ESS/UPS预计同比+81%至1.0TWh；车用电池前三合计市占率65%，宁德时代接近40%；湖南裕能26Q2铁锂单吨扣非利润约0.44万元，显著好于市场预期；璞泰来Q3营收57.44亿元、同比53%，归母8.24亿元、同比28%，扣非8.07亿元、同比35%。今天出现的催化/验证包括电力现货市场基本规则征求意见，支持新能源配储联合参与电力现货市场，推动辅助服务市场与现货市场联合出清。\u003c/li>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>：主线是利率新锚、海外政治与AI资本开支信贷风险。今天强化的逻辑是央行把政策利率锚换成隔夜，债市把它读成变相降息，股票没有同样的读法：A股指数平收、权重股下跌，港股节后补跌1.3%。今天出现的催化/验证包括11月3日中期选举临近，共和党内部似乎已放弃众议院、将主要精力放在参议院关键州；中期选举后最急迫风险是特朗普对伊朗军事行动可能升级；AI 1.6万亿美元资本支出计划成败现取决于信贷市场，该资本支出将推动明年标普指数约25%的销售额增长和78%的盈利增长。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>市场与利率：央行把政策利率锚换成隔夜，债市读成变相降息；A股指数平收、权重股下跌，港股节后补跌1.3%。创业板指前三大拖累为宁德时代、中际旭创、新易盛；寒武纪、拓荆科技、中科飞测、长鑫科技压着科创板；上涨3,777家、下跌1,668家。PCB概念股同日偏强，胜宏科技A股涨4.4%、港股涨3.6%，铜价下跌没有传到股价。\u003c/li>\n\u003cli>存储/半导体：长鑫科技2026Q3收入指引1150亿至1200亿元，环比持续增长；目标价升至130元。4Q26传统DRAM合约价预计环比上涨10%-15%；2026Q4 DRAM价格展望向好，HBM4产品发展势头强劲。中国存储威胁再度浮出水面，但现阶段无需过度担忧，成本效率与良率问题仍有待解决。\u003c/li>\n\u003cli>机器人/物理AI：工信部10月19日披露，上半年我国人形机器人整机产品突破400款、产量超4万台，全年预计突破10万台，已在30
