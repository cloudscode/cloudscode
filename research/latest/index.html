e_label": "帖子正文", "excerpt": "2026年11月2日 🔥 核心一：物理AI与具身智能——全球科技巨头竞速，2026年产业兑现拐点确立 核心逻辑： Meta携手傅利叶智能研发人形机器人Max，智元机器人2026年上半年营收接近20亿元，商业化落地加速。全球科技巨头正从大模型竞争向物理AI入口竞争延伸，特斯拉、英伟达、谷歌、Meta持", "content": "2026年11月2日 🔥 核心一：物理AI与具身智能——全球科技巨头竞速，2026年产业兑现拐点确立 核心逻辑： Meta携手傅利叶智能研发人形机器人Max，智元机器人2026年上半年营收接近20亿元，商业化落地加速。全球科技巨头正从大模型竞争向物理AI入口竞争延伸，特斯拉、英伟达、谷歌、Meta持续布局，国内字节、腾讯加速跟进。机器人竞争正从本体量产转向真实场景部署与数据闭环，高质量交互数据有望成为下一阶段核心瓶颈。物理AI本轮能持续的本质在于模型自我进化及各硬件端产业链逐步成熟、商业化加速。 重点关注标的： O链（卡位壁垒）： 立讯精密（OpenAI首批设备已出货，新品未发、设备先行）、长盈精密、奥比中光、福莱新材、创维数字、华依科技 T链（放量逻辑）： 峰岹科技（基本面好）、恒立液压、浙江荣泰、福赛科技、正强股份 数据采集与数字孪生： 凡拓数创（AI 3D数字孪生龙头，上半年AI业务收入+23.7%）、风语筑（物理AI上游空间数据标的）、奥普特（逆周期数据积累优势凸显，上市以来人数从1000扩至4000） 垂类应用： 江顺科技、华锐精密（明年仅10x出头PE）、能科科技 弹性标的： 爱仕达（物理AI数据价值重估）、华是科技 🔥 核心二：AI算力与Agent——Agent任务爆发拉动算力需求，存储/半导体供需紧平衡延续 核心逻辑： 字节专家透露Agent任务放量，单任务GPU资源消耗为普通对话的25-50倍，主要源于多轮工具调用、上下文反复读取和更长思考链。KV Cache的调度效率与存储命中率是推理成本优化关键，中短期成本优化主要靠软件。GPU交期拉长至30-45周（区间上限较上周+5周），MLCC交期拉长至38周（+3周），供需紧张格局未缓解。存储芯片多空博弈激烈，海力士Q4 DRAM位元出货量增长25%，年度增长率将从20%出头升至30%，但长协与紧平衡仍支撑价格。 重点关注标的： AI服务器与算力硬件： 工业富联（AI Server Rack放量叠加强劲现金流，高盛维持买入）、博众精工（OpenAI首批设备已出货）、海康威视（三季度成长加速，2027年PE15X，成长+红利属性） 半导体设备与国产替代： 芯碁微装（Q3经营性利润环比+30%，先进封装加速突破）、卓胜微、华工科技、长鑫科技（基于4F²架构第六代DRAM完成工艺验证，高盛指出毛利率超预期） 存储链： 关注海力士、三星资本开支扩张节奏对供需平衡的影响 网络与安全： 网宿科技（业绩最好的网络安全公司，Q3扣非净利润增速134%，CDN业务亟待重估） 🔥 核心三：消费底部修复——筹码结构历史低位+政策暖风，阻力最小的反弹方向 核心逻辑： 大消费8个行业基金持仓仅7.28%，估值、仓位、预期三低。金融、煤炭、公用高股息资产被加仓后股息率吸引力减弱，风格再切换下兼具股息+低筹码结构的消费板块将是阻力最小的方向。央行座谈会优化互换便利（目前余额1050亿元）和回购增持再贷款（利率由1.25%降至1%，由阶段性安排转为长期制度性安排），两大工具为市场提供底部支撑。茅台三季报略超预期，扭转双降趋势，有望增强市场信心并带动消费板块关注度。 重点关注标的： 白酒龙头： 贵州茅台（前三季营收+2.0%，Q3净利+3.8%，i茅台同比+80%，直销占比提升至54%） 酒店（Q3\"7月探底、9月转正\"）： 锦江酒店（Q3归母+35.88%，境内直营RevPAR+9%连续两季超预期）、首旅酒店（归母+6.54%，扣非+11.27%，轻管理占40-45%利润率更高） 跨境电商（超高景气）： 绿联科技（10月GMV预估同比+116%，27年智慧生活新业务元年）、安克创新（10月GMV预估同比+13%，稳健增长）、极米科技（10月GMV预估同比+60%，北美翻倍增长） 高端服饰（三季报超预期）： 比音勒芬（Q3营收+34%、扣非净利+40%）、地素时尚（Q1-3扣非净利+44.8%）、罗莱生活（Q1-3归母+27.9%） 美妆（双十一亮眼）： 珀莱雅（双十一期间GMV 6亿/yoy+46%）、毛戈平（2.2亿/yoy+191%）、巨子生物（可复美+可丽金2.9亿/yoy+48%） 🔥 核心四：储能与电力设备——龙头分化但27年海外需求有望超预期，电解铝供给天花板确立 核心逻辑： 储能三季报龙头表现分化，大储海外确收节奏长、损益类科目侵蚀利润，但展望乐观——阳光27年储能出货指引翻倍增长，海博26年海外签单30GWh，上能预期27年印度、欧洲、中东非高增长。户储龙头均衡布局盈利稳健，德业指引27年收入增速60-80%，工商储和离网场景可期。电解铝国内4500万吨产能限制不会放开，叠加沙特项目打开第二成长曲线，供给天花板下高分红标的配置价值凸显。 重点关注标的： 储能龙头： 德业股份（Q3逆变器毛利率保持50%左右，27年收入增速指引60-80%）、海博思创（保持高水位库存60亿，26年海外签单30GWh）、上能电气（Q3国内外PCS发货环比显著增长）、阳光电源（Q4储能出货指引20GWh，27年接近120GWh） 电解铝： 创新实业（国内成本1.45万元/吨位于曲线左侧，沙特50万吨项目27年二季度投产，上市首年分红率51.3%） 锂电设备： 联赢激光（Q3营收同比+66.9%，归母净利同比+202.5%，毛利率逐季改善） 🔥 核心五：AI影视/互动影游与游戏——字节入局+世界模型催化，AI内容形态加速从短向长、从单向向交互升级 核心逻辑： 字节近期在全渠道覆盖互动影游征稿，验证了\"6个月内纯靠AI跑出可盈利项目\"的管线可行性。谷歌发布Genie 4世界模型支持实时场景交互及物理规律模拟，PICO新一代旗舰头显Space Pro有望26Q4发布。AI短剧漫剧已进入规模化阶段——2026年1-8月全国上线微短剧43万部，AI剧占比超九成；红果短剧9月MAU达4.3亿（yoy+82%），DAU 2.03亿（yoy+127%）。《影之刃零》发售72小时全平台销量突破400万份，Steam最高同时在线突破83万，国产3A持续推出有助于非移动扩容和出海。 重点关注标的： AI影视/互动影游： 芒果超媒（\"芒果灵创剧场\"储备AI中长剧）、中文在线（AI中剧《魔皇大管家》上线，互动剧《藏局》排播中）、华策影视（《代号：迷失》推进中）、昆仑万维、华是科技 游戏（非移动扩容+AI）： 心动公司（TapTap受益AI创作平权，近期独占爆火桌宠游戏）、腾讯、网易（研发/发行/长线运营积累深厚） ⏰ 近期催化日历 - 11月3日（周一）： 央行+证监会召集券商/公募开会研究推动支持资本市场工具使用；央行+金监局+证监会召集银行研究优化回购增持再贷款 - 11月上旬： 央行11月2日起每个工作日开展隔夜逆回购操作招标 - 10月-11月： 模型厂（Anthropic等）ARR数据发布，若超预期将成为AI交易反弹催化 - 26Q4： PICO新一代旗舰头显Space Pro发布 - 26Q4： 爱奇艺AI季播剧《不羡鸳鸯只羡仙》第一季上线 - 12月： 春节备货启动，奶价有望继续提升 - 27年Q2： 创新实业沙特50万吨电解铝项目投产 消费筹码结构已降至历史低位（7.28%），叠加央行两大工具优化+茅台超预期，风格再切换下消费是阻力最小方向，龙头股息+低仓位构成安全垫。 物理AI与具身智能产业拐点已确立——Meta、字节等巨头加速入局，智元半年营收近20亿验证商业化路径，建议逢低布局O链卡位+T链放量标的。 科技股短期承压但筹码出清接近尾声，反弹需美股AI交易走强信号，关注10-11月模型厂ARR数据及美联储政策动向。#文字观点", "publish_time": "2026-11-02 23:15", "tags": ["文字观点"]}, "post:2026-11-02T08-46:d541eeb184f0": {"id": "post:2026-11-02T08-46:d541eeb184f0", "kind": "post", "title": "2026-11-02 08:46", "source_label": "帖子正文", "excerpt": "📌ASIC 与 NVDA 之争 🎧本周从 Rasgon 和 Dylan Patel 的播客中听到了一些值得思考的有趣片段。🤖Dylan 表示，OpenAI 允许他的团队进入实验室，在其开源基准测试上测试芯片，“运行所有这些开源中国模型，性能优于 Blackwell。", "content": "📌ASIC 与 NVDA 之争 🎧本周从 Rasgon 和 Dylan Patel 的播客中听到了一些值得思考的有趣片段。 🤖Dylan 表示，OpenAI 允许他的团队进入实验室，在其开源基准测试上测试芯片，“运行所有这些开源中国模型，性能优于 Blackwell。” 🧠OpenAI 在设计和编程中大量使用了 AI。 ⏱️芯片调试（Bring-up）过程，NVDA 需要六个月，AMD 需要六到九个月，GOOGL 和 AMZN 需要几个月，而 OpenAI 仅用了约一个半月。 🚀Anthropic 正在启动自己的芯片计划，并希望将时间缩短一半。 💰Dylan 表示，从 600 亿美元的吉瓦级项目中剥离设计利润后，还剩下约 200 亿美元，因此 “你可以用一吉瓦算力的成本支付五吉瓦的规模。” 💡Patel 认为 NVDA 的利润率至少还能维持几年，而 Rasgon 则表示，只要性能增长快于价格增长，NVDA 就能维持其利润率；他指出Blackwell 每吉瓦约 250 亿美元，而性能大幅提升的 Rubin 每吉瓦约 400 亿美元，他认为只有当新一代产品的提升仅为 20% 时，才需要担心。#文字观点", "publish_time": "2026-11-02 08:46", "tags": ["文字观点"]}, "post:2026-11-02T08-07:0aeec9fff6cd": {"id": "post:2026-11-02T08-07:0aeec9fff6cd", "kind": "post", "title": "2026-11-02 08:07", "source_label": "帖子正文", "excerpt": "AI4S+医药行业动态（10.25-10.31）10月25日，英国内阁办公厅发布公告表示，将设立全球首个国家级AI生物安全实验室（AI Biosecurity Lab），以帮助加强其应对新出现生物威胁的防御能力。项目总投入将超过3亿英镑（约合人民币26亿），其中英国政府直接用于建设实验室的1亿英镑资", "content": "AI4S+医药行业动态（10.25-10.31）10月25日，英国内阁办公厅发布公告表示，将设立全球首个国家级AI生物安全实验室（AI Biosecurity Lab），以帮助加强其应对新出现生物威胁的防御能力。项目总投入将超过3亿英镑（约合人民币26亿），其中英国政府直接用于建设实验室的1亿英镑资金，以及OpenAI和Anthropic承诺提供的最高价值两亿英镑的模型额度、算力以及相关技术支持。而AI三巨头中的Google DeepMind则以研究合作伙伴的身份参与，将提供对前沿Gemini和专业科学模型的可靠访问。via 智药局10月26日，Anthropic披露招股书，其中涉及较多在AI制药方面的布局。在开头7位联合创始人致投资者信中提到：“我们相信 AI 将极大加快生物学与医学的发展进程，有望攻克长期困扰人类的疾病，包括癌症、阿尔茨海默病、心脏病、罕见遗传病以及重大传染病。AI 催生了全新的科研与药物研发范式，我们希望打造相关工具，在惠及整个科研界的过程中发挥引领作用。Anthropic 已经和众多生物科技、制药企业合作，助力基础靶点发现与临床试验环节：一方面协助药企科学家攻克药物发现难题，另一方面可将临床试验报告的撰写周期从数月缩短至数分钟。为打造顶尖的科研工具，我们团队需要亲身开展科研与药物发现工作。我们已经依托 Claude 实现生物层面的原创发现：其中包括找到了一类分子机器，它有潜力被开发为全新的生物技术工具，或可用于基因编辑。我们预期 Claude 在不久的将来会支撑更多全新的生物学发现，并将携手合作伙伴开展验证，共同提升整个领域的科研产出效率。”围绕生命科学领域，招股书提到“2026 年全球年度医药支出预计将突破 2 万亿美元。Claude已被我们的客户、生物科技合作伙伴以及内部研究团队用于药物发现与开发。我们正在搭建 AI 智能体，在研发全流程为科学家提供支持。为打造适配行业的顶尖工具，公司持续自建生命科学能力：引入行业专家、搭建分子生物学实验室、收购 Coefficient Bio，并与行业龙头开展合作。除知识类工作以外，我们认为前沿 AI 有能力改造实体作业。依托 Claude 通用能力的迭代以及 Model Hardware Standard（MHS，模型硬件标准），AI 现已可操控实验室与生产设备，包括显微镜、移液工作站以及商用机械臂。我们判断，模型能力的持续叠加，将在全球经济众多其他赛道持续释放变革性机会。两大工具：Claude for Healthcare（面向医疗机构、支付方以及医疗科技企业提供前沿模型，内置领域专业能力，覆盖临床推理、医疗编码、长周期智能体任务）、Claude for Life Sciences（ 覆盖药物开发全链条）；合作方包括全球前十大药企中有九家、前十大医疗公司中有八家，是其年付费10万美元以上的客户。”via Anthropic招股书10月26日，药明康德发布26三季报，药明康德在财报里两次点名AI制药，并明确要将自身的AI和自动化能力同AIDD/AI4S客户的需求联系起来：①药物代谢与动力学业务持续精进科研与服务能力，加快“HI+AI”一体化、自动化建设，全面提升产能、质量和速度，高效满足全球AIDD/AI4S客户快速增长的干湿闭环研发需求，进一步巩固行业领先地位。②持续推进AI及自动化能力建设，赋能药理学、病理学等多个业务场景，敏捷响应AIDD/AI4S客户需要，提供高通量、多样化、定制化、全方位、一体化的湿实验室服务，构建高效互补的新型合作关系。via 智药局10月26日，英矽智能公布其口服泛TEAD抑制剂ISM6331的首次人体试验积极数据，该候选药物由Chemistry42生成式AI平台赋能设计。研究成果入选在西班牙马德里举行的2026年欧洲肿瘤内科学会（ESMO）年会，由宾夕法尼亚大学艾布拉姆森癌症中心Melina E. Marmarelis博士以快速口头报告形式分享。在患有间皮瘤的受试者中，ISM6331达到68.2%的疾病控制率（DCR），即超过半数受试者实现疾病无进展，甚至出现肿瘤缩小。在每日一次130 mg剂量组中，客观缓解率（ORR）达到40.0%，其中75%的响应者在首次肿瘤评估时即观察到快速缓解。截至数据截止日，ISM6331整体耐受性良好，治疗相关不良事件（TRAE）主要为轻度（1–2级），未报告剂量限制性毒性（DLT），且无导致永久停药的TRAE发生。via 英矽智能10月27日，由AI4S基础设施企业、中国独角兽镁伽科技牵头，腾讯云、Twist等伙伴助力，一场全球AI蛋白质设计竞赛Poreva Open正式开赛。AI蛋白质设计大赛，这一原本局限于技术圈的赛事形式，最近因为AI巨头Anthropic的动作，开始频繁出现在公众视野当中。Poreva Open赛事将对超过10000条设计序列进行湿实验验证——是Anthropic赛事计划验证量的两倍，凭借这套全球顶尖的湿实验验证能力，它将AI蛋白质竞赛推进到更真实、客观的实验场。via 智药局10月28日，Anthropic 公布了其生命科学团队与六家机构合作开展药物研发的最新进展，合作方包括 Generate Biomedicines、Divergence Labs、BigHat Biosciences、Enveda、The Column Group等。Anthropic 还披露了收购Mithril Medicine后推进的内部药物研发项目。这些案例覆盖药物研发的不同阶段：从确定靶点、设计分子，到改善候选分子的性质，再到生产质量审核、监管文件准备及临床试验规划。Anthropic 希望通过参与真实研发项目，找出 AI 能够解决的具体瓶颈，并进一步理解模型在科学推理与实际工作中的能力边界。Anthropic指出随着项目推进，他们计划继续将 Claude 在临床试验中的作用扩展到临床试验领域，并寻求更多合作。via ScienceAI10月28日，晶泰科技与新加坡科技研究局（A*STAR）在新加坡创新科技周（SWITCH 2026）期间签署合作备忘录，晶泰科技将作为新加坡材料创新计划 MARVEL-AI 的技术合作伙伴，结合双方在人工智能、机器人自动化实验及材料科学领域的技术与科研优势，共同探索 AI 驱动的材料研发新模式，加速科研成果向产业应用转化。双方计划围绕不同材料研发需求，共同开发定制化实验室自动化解决方案、探索建设联合科研设施，开展计算与实验相结合的材料研究，并推动科研人才交流，探索更高效的材料研发与创新模式。via 晶泰控股10月28日，NVIDIA提出BindClaw，让蛋白设计围绕生物学机制迭代。设计一个能够贴住靶点表面的蛋白，距离实现特定生物学功能，还有一系列需要回答的问题。它能否挡住天然结合伙伴？能否同时招募两个分子？能否只识别靶蛋白的一种状态？这些任务需要的比较对象和实验对照并不相同。生成模型已经能提出大量候选结构，但研究者仍要选择构建体、定位作用界面、准备不同状态，再把预测结果转成下一轮设计决策。高置信度的复合物结构，并不能单独确立抑制、激动或降解功能。英伟达发布的BindClaw技术报告，尝试把这些环节连起来：从用户提示或论文中提取目标，构建针对作用机制的计算测定，再调用蛋白生成后端迭代候选。via BioTender、计算生物视界10月29日，全球顶级生命科学风投平台Flagship Pioneering宣布成立Etcelera公司，这是一家由Cellarity、Etome和Empress Therapeutics三家平台合并而成的公司，旨在开拓人体生物学中的因果智能：能够确定疾病的真正驱动因素，并在药物到达临床之前预测药物在患者身上的作用。通过结合高分辨率的人体转录组数据、先进的化学蛋白质组学和最先进的扰动数据生成，Etcelera的统一平台可以在分子水平上阐明疾病的因果关系。这与Flagship的内部人工智能能力相结合，使Etcelera能够定义新的靶点，并发现和开发针对它们的小分子，从而更有可能取得临床成功。via Medaverse10月29日，AI for Science企业Edison Scientific宣布与跨国药企辉瑞达成合作，将AI科学家Kosmos部署到辉瑞的研发流程中。合作后，Kosmos将整合公开数据源以及辉瑞内部药物研发的专属数据，构建一体化的世界模型，从而为辉瑞科研人员提供支撑，助力研发关键决策，加快潜在新药的研发进程。合作中特别强调了辉瑞积累的大量有效与无效实验数据，拥有177年企业历史，手握95条在研管线，约1845项公开注册临床试验，研发规模在业内也是首屈一指。via 智药局10月30日，金斯瑞生物科技在南京举办2026年集团投资者开放日。面向2035年，金斯瑞提出实现至少40亿美元收入、20%以上经营利润率和累计30亿美元知识产权许可收入的目标，同时推动产品收入占比超过50%、高毛利市场收入占比超过80%。金斯瑞打造连接AI设计与真实生物学的实验验证引擎，通过GenScript Edge整合生物学能力、快速执行、科学深度、灵活自动化与决策级数据，构建从序列到实验数据（Sequence-to-Data）的端到端验证能力，部分验证项目可实现4天交付数据。在一家全球前二十大药企的研发站点，合作从蛋白表达扩展至结合检测和复杂分子的深入表征，2026年上半年相关业务收入同比增长5倍，Sequence-to-Data业务收入占比由23%提升至64%。在一家头部TechBio客户中，金斯瑞支持其开展约1至2周一次的高频迭代，2026年上半年相关业务收入达到去年同期的30倍以上。此外，金斯瑞正通过与Tamarind Bio、礼来TuneLab、英伟达、赛默飞等生态伙伴合作，连接不同模型、平台与药物研发企业。根据管理层分享的客户数据，AIDD相关业务复购周期较传统CRO业务缩短约60%，订单频次提升约2.5倍。集团持续推进自动化与数字化能力建设，其中基因合成已实现100%自动化，蛋白表达、纯化至Assay环节的自动化程度超过60%。via 金斯瑞生物科技#文字观点", "publish_time": "2026-11-02 08:07", "tags": ["文字观点"]}, "attachment:files/兴业证券-电力设备行业周报：OpenAI入局具身智能，特斯拉Optimus进入量产阶段-261101.pdf": {"id": "attachment:files/兴业证券-电力设备行业周报：OpenAI入局具身智能，特斯拉Optimus进入量产阶段-261101.pdf", "kind": "attachment", "title": "兴业证券-电力设备行业周报：OpenAI入局具身智能，特斯拉Optimus进入量产阶段-261101", "source_label": "兴业证券", "excerpt": "请阅读最后评级说明和重要声明 1/23 行业周报 | 电力设备", "content": "请阅读最后评级说明和重要声明 1/23 行业周报 | 电力设备 证券研究报告 行业评级 推荐（维持） 报告日期 2026年11月01日 相关研究 【兴证电新】全球人形机器人量产加 速，数采是破局大脑和数据的关键 - 2026.10.24 【兴证电新】 2026北京风能展举办，风 储一体、 AI赋能、长寿命成技术亮点 - 2026.10.17 【兴证电新】 “十五五”新型电池规划落 地，固态电池产业化节奏明确 - 2026.10.10 分析师：王帅 S0190521110001 wangshuai21@xyzq.com.cn 分析师：胡琎心 S0190526020003 hujinxin@xyzq.com.cn 分析师：董晓彬 S0190520080001 dongxiaobin@xyzq.com.cn 分析师：杨森 S0190523120003 yangsen@xyzq.com.cn OpenAI入局具身智能，特斯拉 Optimus进入量产阶段 推荐标的 光储 德业股份，阳光电源，福莱特，福斯特 锂电 宁德时代、亿纬锂能、中一科技、嘉元科技、佛塑科技、恩捷股份 AIDC电气设备 麦格米特、特锐德、科士达、中恒电气 风电 大金重工、金风科技、明阳智 能、东方电缆 电力设备 平高电气、中国西电、金盘科技 人形机器人 科达利、福莱新材、卧龙电驱 资料来源：兴业证券经济与金融研究院 细分行业： ⚫ 机器人： OpenAI 入局具身智能，特斯拉 Optimus 进入量产阶段。 OpenAI在9月发 布的 GPT-6 Astra模型，尽管并非专门为机器人打造，却展现出能直接用于机器人操作 的潜力。这挑战了既有的技术分工 ——大语言模型负责上层的任务理解和规划，机器人 的具体动作生成依赖专用的机器人模型。 马斯克表示已经在弗里蒙特 9.29亿美元，融资净流入 1,107.74亿美元； 6月底现金及短期投资合计 1,316.51亿美元， 为模型研发及基础设施投入提供资金来源。 ◼算力供给从云采购扩展至专用设施、设备租赁和多芯片调度。 Google、Amazon及Microsoft三大云合同最低支出合计 2,694亿美元，合同延续至 2033—2036年；Broadcom设备租赁金额 1,612亿美元。 Anthropic Direct拆分机房托管与芯片采购，通过 Trainium、TPU及GPU统一承接研发、推理 和内部负载。 ◼建议关注模型能力、应用场景、企业 AI交付和算力基础设施四条方向： ➢大模型：智谱， MiniMax，阿里巴巴； ➢行业应用：金山办公，恒生电子，鼎捷数智； ➢企业AI落地与 FDE：海致科技，深演智能，中科闻歌，明略科技，用友网络； ➢算力基础设施： 寒武纪，海光信息，中际旭创，新易盛，天孚通信。 ◼风险提示：模型与商业化进展不及预期，算力与资金投入风险，法律、监管与股权风险。 下载日志已记录，仅供内部参考 企业采用与持续研发形成业务循环 资料来源： Anthropic S -1，浙商证券研究所 3◼Anthropic以AI研究为基础，向企业交付 Claude模型、平台和应用。 公司成立于 2021年，2023年开始商业化；截至 2026年9月底拥有约 5,300名员工， TTM人均收入超过 660万美元。企业部署带来使用反馈，收入与融资支持后续模 型 和算力投入。 Anthropic核心能力、企业采用及财务模式的关系 下载日志已记录，仅供内部参考 财务速览 资料来源： Anthropic财务速览、 Anthropic S -1，浙商证券研究所4Anthropic季度财务速览（金额：百万美元；比例： %） 季度数据未经审计； Non-GAAP为公司调整口径 。季度财务指标 1Q25 2Q25 3Q25 4Q25 1Q26 2Q26 1. 营业收入 376 787 1,382 2,040 4,731 11,555 同比增长率 1158% 1368% 2. 算力及基础设施费用 944 1,390 2,047 2,945 3,387 5,558 同比增长率 259% 300% 占营业收入比例 251% 177% 148% 144% 72% 48% 3. 人员费用 218 320 489 812 1,295 1,857 同比增长率 494% 480% 占营业收入比例 58% 41% 35% 40% 27% 16% 4. 营销及合作费用 24 96 202 246 1,033 2,135 同比增长率 4204% 2124% 占营业收入比例 6% 12% 15% 12% 22% 19% 5. 其他运营及管理费用 125 181 233 873 683 1,031 同比增长率 446% 470% 占营业收入比例 33% 23% 17% 43% 14% 9% 6.Bartz诉讼和解费用 — — 1,500 — — — 经营支出合计 1,311 1,987 4,471 4,876 6,398 10,581 同比增长率 388% 433% 占营业收入比例 349% 253% 324% 239% 135% 92%季度财务指标 1Q25 2Q25 3Q25 4Q25 1Q26 2Q26 经营利润（ GAAP） -935 -1,200 -3,089 -2,836 -1,667 974 经营利润率 -248.70% -152.50% -223.50% -139.00% -35.20% 8.40% 经营利润环比变化 41.20% 158.40% 股权激励费用 105 181 305 574 924 1,261 非现金慈善捐赠费用 0 0 0 541 126 0 调整后经营利润（ Non-GAAP）-830 -1,019 -1,284 -1,721 -617 2,235 调整后经营利润率 -220.70% -129.50% -92.90% -84.40% -13.00% 19.30% 利息收入 51 64 124 192 349 762 可转债等公允价值变动损益 -5,701 -5,241 -9,165 -14,201 -12,791 -59,597 其他收益净额 0 0 -3 -5 -309 -8,448 所得税费用 7 — 5 8 21 — 净利润（ GAAP） -6,592 -6,377 -12,138 -16,858 -14,439 -66,309 净利润率 -1753.20% -810.30% -878.30% -826.40% -305.20% -573.90% 净利润同比变化 -119.00% -939.80% 特定按市值计价金融工具调整 0 0 稼动率维持较高水平，半导体国产设备及核心零部件需求持续，但扩产及算力相关需求均收到上游物料短缺影响，对当期收入确认形成一定影响；包含存储、设计及制造等环节的半导体板块收入同比+55.3%、环比-23.7%，净利润同比+148.3%、环比-23.1%。消费电子方面，受存储成本上涨向终端传导的影响，整体表现相对平淡，板块收入同比+19.2%、环比+18.4%，净利润同比-2.1%、环比-2.0%，旺季收入增长尚未同步体现为利润改善。 （3）端侧公司上中下游调研反馈及持续推荐：端侧板块受海外头部厂商新品催化板块关注度显著提升，有望成为年终重要主线，部分上游IC厂商如汇顶科技等已有积极合作进展，后续若产业端终端创新加速跟进，端侧厂商有望进一步深度参与创新周期，此外板块整体估值吸引力较强。关注已有头部海外新品合作进展的汇顶科技等，此外漫步者、炬芯科技等细分端侧龙头亦具备较强估值性价比。 （4）存储重点公司业绩会指引、景气展望及趋势：1）长鑫Q3业绩符合预期：营收1187.1亿元，环比+19%；合并净利润889.8亿元，处此前850-900亿元预期上沿；毛利率89.53%，再创新高。少数股权占比较高的长鑫集电、新桥营收及利润环比均增超50%，推升少数股东损益占比至近40%，拖累归母增速，后续或逐步收回少数股权增厚归母；中长期看好G5量产、LPDDR6商业落地及4F²架构推进夯实竞争力。2）国内外存储厂商业绩普遍符合或超预期：利基存储板块北京君正受益车规补涨，业绩超预期；CPU链澜起科技收入、利润及订单均超预期；海外SK海力士营收、利润增速均超预期。3）预计27年国产HBM自给率约30%-40%，国产算力厂商积极布局3D DRAM及LPDDR等显存路线，有望打开国产存储增量空间，缓解国产算力存储供给瓶颈，提升整体交付能力。 （5）新马泰路演反馈：上周我们赴新加坡、马来西亚、泰国与当地投资人路演交流，当地机构在中国A/H市场仓位目前均不高，普遍在5%以下，但历史上可配置到20～30%水平，部分上限可到40～50%，亚洲基金目前大多配置在韩国和台湾市场，个别参与港股IPO的机构反馈因基石投资锁定期的原因目前回报承压。部分机构维持较高现金仓位，对全球市场波动保持谨慎，若未来中国市场存在超额机会，投资人表示愿意增加对中国的投资，我们被问到最多的问题是跌到什么时候可以买。个股及产业方向上，澜起科技、生益科技PTFE材料进展及其产业链影响、国产算力被问及较多，其中，新加坡投资者对壁仞、天数智芯关注较多，马来西亚投资者关注寒武纪、北方华创、中微公司等，泰国投资者则更关注PCB、昆仑芯等。此外，部分HF机构近期已调整消费电子相关持仓平空或由空转多，但投资判断尚未形成明确共识。#文字观点", "publish_time": "2026-11-02 07:37", "tags": ["文字观点"]}, "post:2026-11-02T08-23:b52a2f973bee": {"id": "post:2026-11-02T08-23:b52a2f973bee", "kind": "post", "title": "2026-11-02 08:23", "source_label": "帖子正文", "excerpt": "💬瑞银（UBS）的 Arcuri 分享了关于半导体设备和 TerraFab 的有趣消息，称TerraFab 正试图购买其他芯片制造商的设备交付位次，出价远高于原始买家的支付价格。🔋他称这是 LRCX 和 AMAT 定价权的新来源。", "content": "💬瑞银（UBS）的 Arcuri 分享了关于半导体设备和 TerraFab 的有趣消息，称TerraFab 正试图购买其他芯片制造商的设备交付位次，出价远高于原始买家的支付价格。 🔋他称这是 LRCX 和 AMAT 定价权的新来源。 📊KLAC 告诉瑞银，TerraFab 的工具集已从存储芯片 “完全转向” 逻辑芯片。 🏭Tim 表示，它是基于英特尔（INTC）的 14A 工艺构建的，这让台积电（TSMC）非常愤怒，他认为英特尔明年的台积电晶圆配额可能会被削减。#文字观点", "publish_time": "2026-11-02 08:23", "tags": ["文字观点"]}, "attachment:files/GS-亚太科技：半导体存储：铠侠 26 年第三季度业绩点评；中长期 NAND 向好逻辑不变，推荐 SEC_Hynix APAC Tech Semiconductors Memory Kioxia 3Q26 read-across; mid- to long-term positive NAND outlook intact; Buy SE.pdf": {"id": "attachment:files/GS-亚太科技：半导体存储：铠侠 26 年第三季度业绩点评；中长期 NAND 向好逻辑不变，推荐 SEC_Hynix APAC Tech Semiconductors Memory Kioxia 3Q26 read-across; mid- to long-term positive NAND outlook intact; Buy SE.pdf", "kind": "attachment", "title": "GS-亚太科技：半导体存储：铠侠 26 年第三季度业绩点评；中长期 NAND 向好逻辑不变，推荐 SEC_Hynix APAC Tech Semiconductors Memory Kioxia 3Q26 read-across; mid- to long-term positive NAND outlook intact; Buy SE", "source_label": "GS", "excerpt": "Giuni Lee +65-6889-1025 | giuni.lee@gs.com Goldman Sachs (Singapore) Pte Daiki Takayama +81(3)4587-9870 | daiki.takayama@gs.com Goldman Sachs Japan Co., Ltd.APAC Tech: Semiconducto", "content": "Giuni Lee +65-6889-1025 | giuni.lee@gs.com Goldman Sachs (Singapore) Pte Daiki Takayama +81(3)4587-9870 | daiki.takayama@gs.com Goldman Sachs Japan Co., Ltd.APAC Tech: Semiconductors Memory: Kioxia CY3Q26 read-across; mid- to long-term positive NAND outlook intact; Buy SEC/Hynix2 November 2026 | 2:27AM SGT On October 30, Japanese NAND producer Kioxia (covered by Shuhei Nakamura, Buy) reported its CY3Q26 (FY2Q26) earnings , and we provide read-across to our covered Korean memory suppliers, SK Hynix (Hynix, Buy) and Samsung Electronics (SEC, Buy on CL). Key takeaways include: 1) Solid CY3Q26 results; divergence in CY4Q26 expectations vs. SEC/Hynix due to shipment timing shift and di fferent base e ffect, 2) Expect NAND S/D to remain tight through CY27, providing further upside to pricing, and 3) Multi-year LTAs providing strong visibility into demand beyond CY27-28. Solid CY3Q26 results; divergence in CY4Q26 expectations vs. SEC/Hynix due n to shipment timing shift and di fferent base e ffect: In CY3Q26, Kioxia’s USD-based blended ASP increased by mid-20% qoq, with like-for-like pricing up by low-30%, while bit shipments increased by low-teens, mainly driven by strong data center and enterprise demand. For CY4Q26, Kioxia expects revenue to see slight growth qoq (bit shipment broadly flat qoq while ASP is expected to see a modest increase), as longer-lead-time products, including data center and enterprise SSDs, shift into CY1Q27. While Kioxia’s CY4Q26 guidance is generally below our expectations for SEC/Hynix, we note that this may be due to the shipment timing shift and also the company’s high base e ffect in CY3Q26 relative to the Korean suppliers. Expect NAND S/D to remain tight through CY27, providing further upside to n pricing: Looking into CY27, Kioxia expects NAND S/D conditions to remain tight, supported by continued strength in data center and enterprise demand, leaving further room for ASP increases. While management expects the pace of price increases to moderate following the sharp rise from early to mid-CY26, the company emphasized that there are currently no signs of an ASP decline. We believe this is broadly in line with our view for SEC and Hynix, for which we expect NAND pricing to increase by 34%/30% yoy in CY27E despite a relative slowdown from the sharp increase of +279%/254% in CY26. Multi-year LTAs providing strong visibility into demand beyond CY27-28 : n Kioxia indicated that its CY27 capacity is e ffectively sold out, while more than 50% of its CY28 shipment volume has already been secured under multi-year LTAs. For the remaining CY28 capacity, the company is considering whether to lock in additional customer commitments or retain some capacity to capture potential upside, with discussions still ongoing. With CY27 fully allocated and a Goldman Sachs does and seeks to do business with companies covered in its research reports. As a result, investors should be aware that the firm may have a con flict of interest that could a ffect the objectivity of this report. Investors should consider this report as only a single factor in making their investment decision. For Reg AC certification and other important disclosures, see the Disclosure Appendix, or go to www.gs.com/research/hedge.html . Analysts employed by non-US a ffiliates are not registered/quali fied as research analysts with FINRA in the U.S. Equity Research c45a43530f604d12bcb9a82b5aa6b9f6 substantial portion of CY28 already secured, Kioxia has also begun discussions with customers regarding CY29-30. We believe the extension of LTA discussions into CY29-30 signals the growing chance of a prolonged supply shortage, with customers seeking to secure supply well beyond CY28. This is broadly consistent with the trend we see for SEC and Hynix, where customers are entering into five-year LTAs and asking for even longer period of supply. Price Target Risks and Methodology - Samsung Electronics Valuation methodology: Our 12m 2026E-2027E EV/EBITDA-based SOTP target price for the common share is W500,000. Our 12-month target price for the preference share is W380,000, applying our target preferred-to-common discount of 24%, derived from averaging: 1) the pref discount of the 2-factor model, and 2) the 1-year historical average discount to common shares. We are Buy rated on both the common and preference shares. Key downside risks: 1) major deterioration in memory supply/demand, 2) sharp contraction in smartphone margins, and 3) mobile OLED market share loss. Price Target Risks and Methodology - SK Hynix Inc. Valuation methodology: Our 2026E/27E avg. P/E-based 12m TP is W3,500,000, applying a target P/E multiple of 7.0X. Key risks: Key risks include 1) major deterioration in memory supply/demand and delay in technology migration, 2) weaker demand for smartphones/PCs/servers which would impact overall conventional memory demand, 3) Samsung’s positive HBM business progress which would impact HBM revenue and pro fit, 4) lower AI-related capex which would impact overall HBM demand, and thus HBM revenue/pro fit for the company. Exhibit 1: SEC/Hynix/Kioxia NAND key metrics trend (%) CY1Q24 CY2Q24 CY3Q24 CY4Q2 4 CY1Q25 CY2Q25 CY3Q25 CY4Q25 C Y1Q26 CY2Q26 CY3Q26 CY4Q26E ASP qoq% SEC NAND 31% 22% 7% -6% -15% -5% 5% 24% 89% 67% 17% 10% (in USD) Hynix NAND 30% 17% 15% -4% -20% -9% 11% 31% 71% 56% 26% 7% Kioxia around ile lower than GSe for eMMC/UFS NAND. We reiterate our Buy ratings on SEC (on CL) and Hynix. PC DRAM: 4Q26 pricing forecast still +13-18%; higher than GSe In October, ASP of 8GB DDR4 modules increased by 15% to $170, while ASP of 8GB DDR5 modules reached $165, hence the DDR5 pricing discount compared to DDR4 decreased to 3% (vs. 10% in September). TrendForce estimates PC DRAM contract price will rise by 13-18% qoq, which is higher than our estimates for SEC/Hynix at +8-13%. TrendForce stated that several OEMs have already revised down their 4Q26 and 2027 procurement plans, but also commented that South Korean suppliers are expected to reduce PC DRAM output by more than 20% yoy in 2027 as production capacity shifts toward server memory. Server DRAM: 4Q26 pricing forecast of +10-15%; broadly in-line with GSe October DDR4 and DDR5 64GB module pricing increased by 15% and 11% to $1,490 and $1,685; hence the pricing premium for DDR5 compared to DDR4 decreased to 13% (vs. a 17% premium in September). TrendForce continues to forecast server DRAM pricing to grow +10-15% in 4Q26, broadly in-line with our expectations for SEC/Hynix avg. server DRAM price growth of 11% qoq. Notably, TrendForce raised its 2026 server shipment growth forecast from +17.0% to +19.7%, citing stronger compute requirements from emerging US CSPs such as xAI, and accor dingly, slightly revised up server shipments for 2027. Mobile DRAM: 4Q26 pricing forecast of +0-5%; in line with GSe TrendForce maintained its projection of 4Q26 mobile DRAM pricing growth of +0-5% qoq, with pricing momentum moderating as smartphone brands become more cautious on procurement. TrendForce stated that smartphone brands aggressively built inventory over the past three quarters while simultaneously lowering full-year production targets, reducing their willingness to buy additional inventory. TrendForce’s estimates are in-line with our SEC/Hynix mobile DRAM ASP growth estimate of +3% qoq in 4Q26. Goldman Sachs does and seeks t 原型。 2. 富士康透露正在与OpenAI筹备新合作推进机器人部署。 3. 据《旧金山标准报》报道，特斯拉正准备于2026年12月初开放Optimus人形机器人的消费者预订。但马斯克在推回复no。 人工智能： 1. OpenAI融资目标下调100亿美元、标普将Meta信用评级下调。 2. 周二，5:30-06:00，苹果、Palantir财报及电话会议；周三05:00后，AMD、超微电脑公布财报；周四05:00后，高通、Arm、AppLovin公布财报。 3. 阿里巴巴与Apple达成合作，将千问集成至Apple智能。 4. DeepSeek发布全新Agent架构 让AI指挥AI干活。 5. 村田投入1兆日元（约合人民币数百亿元）大举扩产MLCC，应对AI服务器需求爆发。 6. 高盛：亚马逊、Alphabet、Meta、微软和甲骨文的合计自由现金流将从2025年约2000亿美元的正值，转为今年约负400亿美元，并在2027年进一步恶化至约负1500亿美元，随后市场预计其将在2028年出现反弹。 商业航天： 1. 我国首次载人登月方案：计划2030年前登月，将有2人踏上月球表面。 2. 马斯克预言：2029 年太空 AI 算力将远超地面算力。 半导体： 1. 铠侠12 月季度的营业利润指引仅为 2 万亿日元，大幅不及预期（2.3 -2.5万亿日元）。 多头认为是时间错配问题，空头认为NAND 周期现在基本已经见顶，管理层对27年asp的上升趋势听起来也毫无信心。 2. 联电：受电源管理、车用及AI周边芯片需求拉动，成熟制程产能利用率维持高位，成熟制程2027年预计涨价约10%。 市场相关： 1. 大摩统计1950年以来的中期选举，其后12个月标普500上涨概率100%，平均涨幅16.6%。 2. 悲观观点认为：当AI的增量支出几乎全部依赖外部融资，股价本身就变成了融资条件的函数——股价下跌→融资成本上升→资本开支放缓→盈利预期下修→股价再跌。这就是2026年版的\"AI次级贷\"负反馈。 3. 华发债务风险，传闻理财子单日赎回很大，为了防范风险、保住前期利润，防御性撤退，观点认为撤退持续性不会太强。 4. 国有某大行计划向中国国新和中国诚通各新增千亿级股票回购增持专项贷款额度。 5. 周一央行将与金融监管总局、证监会召集各大银行开会，研究优化股票回购增持再贷款政策。 6. 周一中国人民银行、证监会将召集一些证券公司、基金公司举行会议，研究推动支持资本市场工具使用。 7. 央行支持路径猜测：互换便利，回购增持再贷款，汇金、证金再贷款。感觉第三个最提振情绪，但要等汇金公告。 8. 卖方：基于历史发行情况估算，预计中证500/中证1000跌到5300以下可能会有一些敲入风险，即指数再跌15%左右可能才有比较大的上述风险暴露。 9. 卖方：周一半导体股止跌、油价回落、美债收益率温和下行。三条压力线同时缓解，才是真正意义上的好消息。 策略观察： 1. 周五成交16879亿，增量1169亿。周五3574虽然守住，但一个低开就没了，希望明天盘前利好再多些，美股也反弹吧，如果加速偏离均线下跌，那预期大哥要加力度出手的，周五已经看到流动性问题了，阴跌慢慢出清还能忍，快跌就要出连环风险，不能忍吧，但只是稳住恐慌抛盘，下周仍然是等待风险定价落地的一周，如果还能跌，下下周可下注赔率有望大幅提升。 2. 板块方面，食品饮料、交运和石油石化领涨。观望中等待科技再跌一把后走一个熊中反弹，暂定下下周开始期待，先给点时间消化美股财报后的重估、中选以及中东，同时也要给点时间让科技里的空头卸仓位，消费走得越逆势，说明空头杀出来的越多。 3. 题材方面，周五的机器人低开高走再低走再拉高最后还是低走了，买的人觉得大势底部区域，反弹在即，卖的人看到流动性风险，可能要泥沙俱下，机器人（物理ai）肯定能看很远，但确实也没有足够坚硬的当期基本面可以抵御风险，逆势走强了一阵，也来到要看大势情况的位置了，交易上还是避开损耗，等待下周落定再看，还有航天也观察低位筹码稳不稳。周五就剩下消费大涨，连泸州老窖都涨停了，和银行一起也呼应了美股红利的趋势。#文字观点", "publish_time": "2026-11-02 07:25", "tags": ["文字观点"]}, "post:2026-11-02T10-40:c8b7b788b53c": {"id": "post:2026-11-02T10-40:c8b7b788b53c", "kind": "post", "title": "2026-11-02 10:40", "source_label": "帖子正文", "excerpt": "《空头回合如何结束？（周观点1102）》|东北策略张超越 上周云厂及英特尔财报发出后，全球科技股大幅杀跌，费城半导体周五单日大跌7.2%，几乎回吐当周全部涨幅。", "content": "《空头回合如何结束？（周观点1102）》|东北策略张超越 上周云厂及英特尔财报发出后，全球科技股大幅杀跌，费城半导体周五单日大跌7.2%，几乎回吐当周全部涨幅。上周费城半导体下跌0.8%、科创50、银、黄金分别下跌13.7%、8.8%、3%。 1️⃣流动性环境的边际收紧，依然在主导当前的空头回合。融资环境的收紧预期，使得市场对全球科技股的财报变得更为挑剔。尽管财报显示当前AI需求和相关盈利仍然强劲，但股价对资本开支扩张和现金流恶化的反应更加敏感。9月以来伴随连续加息预期的高涨，此前市场曾热议的AI资本开支可持续性的问题再次成为市场焦点。过去几周，纳指期货QQQ的空头持仓量激增1800万份，增幅高达28%。但是我们也发现，标普500指数ETF（SPY）的空头持仓量却呈现相反趋势。自今年3月以来，SPY的空头持仓减少了4100万份，目前降至约9300万份，接近至少五年来的最低水平。这反映出美国超强盈利基本面背景下，尽管AI叙事再次迎来重大挑战，但美股牛市趋势尚未改变，当前更像是阶段性''消化不良''。但我们也需要意识到流动性环境在资产定价中举足轻重的地位，过去一年以来美股的5轮深度回调，均由美联储加息预期的改善而终结，这一轮我们同样将美联储加息预期的改善视为终结空头回合的最重要潜在催化剂。在这一前提实现之前，科技股将持续承受紧缩金融条件带来的压力，AI投资可持续性的疑虑也将难以消散。 2️⃣对于A股而言，三季度以来的下跌斜率显著超出市场普遍预期，投资者信心的走弱使得下跌速度呈现出非理性状态，乖离率逼近历史极值。出于恢复信心和防范负反馈的考虑，央行、证监会、金融监管总局等部门再次召集证券、基金和银行机构开会，研究推动资本市场支持工具使用及优化回购增持再贷款政策。这一政策与924相比，更多是聚焦深化落地、解决实操摩擦。除结构性支持政策之外，我们交流下来，市场当前更加关注未来是否有财政与货币总量政策协调发力。我们建议如果未来看到例如全面降准降息等级别的总量政策，则应高度重视行情反转的可能性。因为微观政策+总量政策的结合是对中国政策态度的一个更为鲜明的表达，总量政策如果转向则意味着A股极有可能类似924之后，重新进入估值扩张周期。 提供一个视角供领导参考，还请领导派点多多支持～ 风险提示：美伊局势超预期，美国货币政策超预期，美债波动超预期。 证券分析师：张超越（执业证书编号S0550523060002）#文字观点", "publish_time": "2026-11-02 10:40", "tags": ["文字观点"]}, "post:2026-11-02T08-38:bc322c4b4a76": {"id": "post:2026-11-02T08-38:bc322c4b4a76", "kind": "post", "title": "2026-11-02 08:38", "source_label": "帖子正文", "excerpt": "【本周策略观点1102】赔率有望大幅提升，但力度仍然受限 1、虽然一直预期进入技术性熊市，但不影响做超跌反弹的操作，按照牛熊转换经验，也是第一段和最后一段反弹值得参与，目前只不过还没有明确入场信号，也受限于海外的节奏。今天是农历9.24，这个玄学本没多大意义，足见人心思涨，但这周还是等待风险落地的一", "content": "【本周策略观点1102】赔率有望大幅提升，但力度仍然受限 1、虽然一直预期进入技术性熊市，但不影响做超跌反弹的操作，按照牛熊转换经验，也是第一段和最后一段反弹值得参与，目前只不过还没有明确入场信号，也受限于海外的节奏。今天是农历9.24，这个玄学本没多大意义，足见人心思涨，但这周还是等待风险落地的一周，美股中期选举的基准情形是民主党横扫，但对于后续AI、中美和特朗普会不会攻击伊朗，都有很大不确定性，资金还会先选择观望，外围AI交易不见明朗，AI筹码问题就自然悬而未决。目前海外AI叙事也是逆风，明确信号需要等A厂10-11月的ARR，或者美伊冲突、中期选举有没有超预期的事件。 2、周末消息偏中性，美伊谈判信息一边释放，一边又强化增兵，油价居高不下，美股在上周大厂财报利空冲击下大跌，也直接恶化了特朗普的选情，但拖到最后其实也不利于扭转结果，这也是目前资金有预期选后开战的原因。关于巨头财报基本已经结果，暂无关键催化，美股红利趋势也在走强，资金也在走向防御。不过目前看夜盘美股也有反弹，日韩开盘冲击没有那么大，对于A股而言，上周五守住了3574点，但开盘可能低开就要试探下，前面阴跌不至于出流动性风险，但上周五股债双杀，而且大面积开始爆仓（一般持续一周），确实容易连环杀，得先稳住恐慌抛盘，再等待明确右侧信号。 3、国内周末JG都出来发声全力稳市场稳预期，今天还有两场座谈会，分别研究推动支持资本市场工具使用和股票回购支持再贷款，晚间国新和诚通也公告获千亿额度，市场解读是政策底，但也没有多大的预期。只能说再跌大哥可能要猛发力，能够补充流动性，就弱版的24年2-3月，确实按照日历效应，11月的平均收益和胜率都是全年第二高的。目前国内也进入业绩空窗期，题材炒作会活跃，月中下旬就是APEC，还有元首第三次见面预期，风险偏好希望能够提振下。 4、这周有加速赶底的话，赔率就会大大提升，先做一些弹性宽基，创业板50ETF，估值确实是历史第二低了，科创50ETF 也是同节奏的，包括科创100ETF和科创综指ETF。板块里面，渣男证券ETF 刚好跌回去年4月初，流动性救援一般也利好券商。还有就是炒题材妖股，机器人ETF 和卫星ETF 都是观察筹码稳不稳。 （仅供内部参考，不做投资建议，基金投资需谨慎）#文字观点", "publish_time": "2026-11-02 08:38", "tags": ["文字观点"]}, "attachment:files/摩根大通-海油工程-600583-快评：项目执行驱动2026年3季度盈利同比增长16％；现金流稳健改善；在手订单健康.pdf": {"id": "attachment:files/摩根大通-海油工程-600583-快评：项目执行驱动2026年3季度盈利同比增长16％；现金流稳健改善；在手订单健康.pdf", "kind": "attachment", "title": "摩根大通-海油工程-600583-快评：项目执行驱动2026年3季度盈利同比增长16％；现金流稳健改善；在手订单健康", "source_label": "摩根大通", "excerpt": "中国 证券研究 2026 年10月30日 海油工程 - A增持 600583.SS, 600583 CH 快评—项目执行驱动 2026 年3季度盈利同比增长 16% ；现金流稳健改善", "content": "中国 证券研究 2026 年10月30日 海油工程 - A增持 600583.SS, 600583 CH 快评—项目执行驱动 2026 年3季度盈利同比增长 16% ；现金流稳健改善；在手订单健康股价: 6.54 元 2026 年10月29日 目标价 : 7.20 元 目标价截至日期 : 2027 年6月30日 亚太区油气 证券分析师 : 穆磊 AC (86-21) 6106 6319 lei.mu@jpmorgan.com 登记编号 : S1730521050002 摩根大通证券（中国）有限公司 分析师声明及重要披露，包括非美国分析师披露，见第 3页。 业绩快评： 市场应将对海油工程 2026 年3季度业绩做出正面反应，公司报 告净利润 5.88亿元人民币，同比增长 16%。3季度盈利稳健，原因包括： 1) 营收稳定，收入同比增长 12%；2) 海上安装工作量保持满载。这主要得益 于2026 年3季度海内外项目交付稳定，此前 2季度表现强劲。此外，海油 工程的毛利率维持在健康水平， 3季度经营现金流环比大幅增长，有望支撑 海油工程 2026 财年及以后的盈利前景。 主要正面因素 1) 在手订单达 727亿元人民币（截至 3季度末），仍处于年初以来的历史高 位，这可能缓解市场对公司新签合同走势的担忧； 2) 2026 年3季度收入同比 增长 12%，提升了 2026 财年盈利的能见度； 3) 2026 年3季度经营现金流大 幅改善，表明收款纪律增强。 主要负面因素 2026 年3季度毛利率从 2季度的 15%微降至 13.9% 。我们注意到 3季度钢材 加工量保持在高位，同时伴随微幅向下波动，而船舶作业天数增加仍展现出 强劲的项目交付势头。我们认为这可能表明 2026 年1-9月新项目执行不甚均 衡。 市场预期可能发生的变化 自2026 年2季度业绩发布以来，公司股价跑赢大盘（ 8月18日至今上涨 8% ，同期上证综指下跌 8%），或在一定程度上反映了地缘政治紧张局势再度 升级的风险，这种风险可能影响全球能源价格上涨。充裕的在手订单和稳定 的盈利能力有望支撑海油工程 2026 财年的业绩。市场一致预期的 2026 财年 盈利为 22.51 亿元人民币，目前看来实现的可能性有所上升。若要实现全年 市场一致预期， 4季度仍需保持执行动能， 3季度现金流强劲反弹为此带来 信心。若在手订单转化出现任何放缓迹象，均可能构成下行风险。 预期股价反应 我们预计市场将对海油工程 2026 年3季度业绩做出正面反应，原因是盈利 同比稳健复苏、季度毛利率稳定、在手订单充裕且现金流强劲。 2026 年3季 度收入同比增长 12%，净 0已较9月中旬的低点上涨了35%。如果按照历史周回报的标准差来衡量，那一周的涨 幅为2002年以来最大的单周涨幅。从此，那波行情被载入史册，成为了市场参与者至今依然津津乐 道的、当下又翘首以待的“9.24”行情。 今晚，媒体的广泛公开报道了明天周一这三家权威机构将再次开会的重磅消息。这次重要会议还将 有主要的大型银行参与。周一的会议将讨论如何优化两年前创设的再贷款计划。据报道，一些券商 和基金公司已被告知参与此次会议。由于两年前的9.24行情依然萦绕人心，因此在这条重磅新闻见 报之后，各大微信聊天群都不免浮想联翩，并开始讨论两年前的那个秋天的童话是否将在明天重新 上演。 那么，市场参与者应该如何比较明天的这次会议和两年前的那次重若千钧、足以彪炳史册的会议？ 截此，这是这个合集的最后一篇报告。2026.04 新合集征订工作已经开始。这个合集将是今年最后 一个付费合集，里面将包括万众瞩目的《2027年年度展望报告》。我的年度展望报告已经持续了 17年，一直都是市场关注的热点，一直在影响左右市场共识形成和定价。感谢您一路以来的支持。 请点击以下链接订阅：洪灝的宏观策略V+ 2026.04（含2027年年度展望） 两年前的9.24行情的起点，是当时市场的投降式抛售潮（capitulation）。当时，沪深300已较 2024年5月的高点下跌超过13%，逼近五年低点。9月13日，沪深的远期市盈率为10.4倍。上市公 司盈利增长疲弱，房地产市场持续低迷，而一家最大的外资机构那时也下调了对中国股票“超配”的 评级，国际投资者低配中国市场，甚至还在加 然而，就在当时的哀鸿遍野之中，市场迎来了一项实实在在的增量政策。三大部门第一次用央行资 产负债表给股市做出承诺。那一周市场重新定价的，不仅仅是一项简单的流动性工具，而是决策者 对于市场的关注和抉择。那些曾以为决策者会无限容忍市场下跌的投资者，突然被迫空头回补。 fôe°fô_ë÷R V:WUXL3408 而在当时那个流动性稀薄、对于中国市场严重低配的市场里，空头被迫回补制造出了我们当时目睹 的、令人耳晕目眩的轧空行情。当下，海外的大型中概股的空单也到达了历史最高。 然而，当时极度火爆的行情在大约一个交易周里就匆匆消退了。那时的交易教训对于周一乃至下周 的交易都至关重要。2024年10月9日，沪深300指数单日暴跌了7%，随后回吐了前两周的绝大部 分涨幅。事实上，当时的再贷款和互换便利等流动性工具的使用量远低于其有关部门承诺的水平。 据公开数据统计，到了2024年10月下旬，仅约二十多家上市公司提取了约110亿至120亿元来进行 股票回购或者增持，体量仅占3000亿元再贷款额度的一小部分。即便是所有流动性工具全部用足， 两项工具合计也远不足那时沪深两市总市值的1%。 简单地说，政策刺激可以猛烈推动估值暂时上升，然而如果刺激不能改变盈利增长轨迹，那么最终 由估值提升而产生的牛市将因盈利的下滑而终结。对于流动性工具来说，官宣的流动性数字固然重 要，因为这个数字将启动市场上升的触发点，但是流动性工具实际使用的额度才是市场行情得以持 续的燃料，也是市场信心的象征。本周一的会议将包括=银行和其它金融机构，可能是因为决策者 希望能够缩短资金进入市场的时间，并有可能把融资的条件放宽，范围扩大。然而，其效果仍有待 考证。 当下市场的情况与两年前有诸多相似之处，但也有重要的区别。沪深300周五再次大幅杀跌，收于 3,986点。10月单月就下跌7.3%，是2024年十月以来最差的单月表现，而今年年内更是下跌了 13.7%。上证综指年初至今下跌8.6%，恒生指数下跌9.1%。上证已经基本上会吐了9.24以来的全 部涨幅。因此，两次会议前市场的情绪都是空前低迷的，但是按照我们独有的市场情绪指标来衡 量，现在的市场的情绪比两年前略高一些。现在市场的远期市盈率11.6倍，与9.24行情之前的估值 也基本持平，但今年六月的时候还是在15倍出头。也就是说，六月以来在岸市场经历了一次非常凌 厉的估值降级（de-rating)，远期估值在短短的不到四个月里下降了25%。 图一：市场情绪处于极度风险厌恶，类似于9.24前夕。 最重要的是，那轮交易性反弹缺乏盈利支撑。2024年9月初，沪深300远期每股收益一致预期为 352元，10月底却降到了347元。分析师没有因刺激政策上调利润预期。因此，当时沪深35%的涨 幅全部来自估值扩张，而远期市盈率在不到三周内从10.4倍拉升到了14.1倍。当反弹纯粹依赖于估 值倍数的扩张，那么其持续性也取决投资者情绪的高涨可以维持多久。当时在央行拍板之后，其它 各大部门也纷纷进行了后续新闻发布会，但是更多刺激政策的落地远逊于那时市场共识的预期，估 值倍数瞬间回落。 fôe°fô_ë÷R V:WUXL3 空航天复合材料加工也对高端缝制、焊接设备提出更高要求。 ✅ 重点关注：#上工申贝（600843）☎️ #机器人缝制：公司拥有3D立体缝纫机器人、自动缝制工作站等技术，已实现羽绒服智能生产线、汽车座椅自动缝制工作站应用，正推进工业机器人辅助缝纫及AI人形机器人整线解决方案。 ☎️ #商业航天：公司旗下KSL高端缝制设备可应用于航空复合材料加工，超声波焊接设备可应用于宇航服生产制造。 🔥 #核心预期差：市场看到的是传统缝纫机，更值得关注的是公司向#机器人智能制造与#航空航天高端工艺装备升级的产业价值！", "publish_time": "2026-11-02 08:53", "tags": ["航天高端制造需求值得关注", "上工申贝（600843）"]}, "post:2026-11-02T13-22:ab9075ea2a6c": {"id": "post:2026-11-02T13-22:ab9075ea2a6c", "kind": "post", "title": "2026-11-02 13:22", "source_label": "帖子正文", "excerpt": "【国金计算机&科技】德才股份：Q3主业经营情况好转，AI新业务前三季度累计新签合同超11亿元 #单Q3收入同比增长15%_扣非净利润同比扭亏_主业经营情况好转 ——2026年前三季度，公司实现营业收入20.96亿元，同比增长7.09%；归母净利润4670万元，同比下降4.82%", "content": "【国金计算机&科技】德才股份：Q3主业经营情况好转，AI新业务前三季度累计新签合同超11亿元 #单Q3收入同比增长15%_扣非净利润同比扭亏_主业经营情况好转 ——2026年前三季度，公司实现营业收入20.96亿元，同比增长7.09%；归母净利润4670万元，同比下降4.82%；扣非归母净利润2582万元，同比下降20.40%。 ——单Q3实现营业收入8.10亿元，同比增长15.03%，较上半年2.62%的收入增速明显提升；归母净利润248万元，同比增长26.36%；扣非归母净利润123万元，同比扭亏。Q3业务规模增长、回款增加及财务费用减少推动利润改善。 #AI新业务前三季度新签合同11.53亿元_数字内容与服务器业务持续拓展 ——公司前三季度累计新签项目361个，金额44.24亿元，其中新业务累计新签项目161个、金额11.53亿元，占整体新签金额约26%；单Q3新业务新签项目73个、金额1.79亿元。根据公司公告，新业务涵盖数字内容、数字内容工具平台及服务器设备销售，随着前期订单逐步交付，有望持续贡献业务增量。 ——公司新业务新签订单不断、收入逐步兑现，26H1新业务已实现营业收入约1.47亿元，其中德芯智算收入约1.22亿元、奇想无限收入2457万元。 #公司Agent/AI漫剧/AI硬件各项AI业务加速兑现 ——Agent方面，公司持续深化与火山引擎合作，正式加入“万有计划”，具备#专属定制Token资源包、专属GPU算力池免排队调用、专属内容素材库等模型专属权限； 7月28日，火山引擎将奇想无限信控额度由2,000万元提升至5,000万元，#按月滚动使用对应理论年化模型服务采购规模接近6亿元。依托自研Agent平台及模型、算力资源支持，公司正由AI漫剧内容生成向互动影游、广告、电商等更多应用场景拓展。 ——AI漫剧方面，奇想无限已推出《重生1970，从狩猎赶山开始》《镇守百万年，我的绝品徒弟是大帝》等多部AI剧，其中《重生1970，从狩猎赶山开始》位列红果漫剧APP的6月AI剧新剧榜第二名。 ——AI硬件方面，26H1公司新业务新签合同约9.74亿元，26Q2环比增长约85%，随着订单交付及产能爬坡，新业务收入有望逐步释放。 风险提示：AI业务拓展及订单兑现不及预期、互动影游商业化不及预期、经营现金流及回款风险、对外担保风险。 ☎联系人：陈芷婧/鲍淑娴/刘高畅#文字观点", "publish_time": "2026-11-02 13:22", "tags": ["文字观点"]}, "attachment:files/Bernstein-立讯精密（002475.CH）：2026年三季报——苹果业务疲软与汇兑损益拖累盈利，AI服务器组件业务按计划推进.pdf": {"id": "attachment:files/Bernstein-立讯精密（002475.CH）：2026年三季报——苹果业务疲软与汇兑损益拖累盈利，AI服务器组件业务按计划推进.pdf", "kind": "attachment", "title": "Bernstein-立讯精密（002475.CH）：2026年三季报——苹果业务疲软与汇兑损益拖累盈利，AI服务器组件业务按计划推进", "source_label": "Bernstein", "excerpt": "2 November 2026 Asia Tech Hardware Luxshare Precision Industry Co Ltd Rating Outperform Price Target 002475.CH 86.00 CNY Alex Wang, CFA +852 2123 2613 alex.wang@bernsteinsg.com Eth", "content": "2 November 2026 Asia Tech Hardware Luxshare Precision Industry Co Ltd Rating Outperform Price Target 002475.CH 86.00 CNY Alex Wang, CFA +852 2123 2613 alex.wang@bernsteinsg.com Ethan Xu +852 2123 2634 ethan.xu@bernsteinsg.com Ivy Yeh +852 2123 2667 ivy.yeh@bernsteinsg.com Reported EPS F25A F26E F27E 002475.CH (CNY) 2.26 2.60 3.47 OLD -- 2.64 3.48Financials F25A F26E F27E CAGR Revenues (M) 332,344 405,430 459,866 17.6% EBIT Margin (%) 5.8 5.9 6.7 --Valuation Metrics F25A F26E F27E Reported P/E (x) 20.2 17.5 13.1 EV/EBITDA (x) 13.5 11.9 9.9 Source: Bloomberg, Bernstein estimates and analysis.Luxshare 3Q26: Apple weakness and FX weigh on earnings; AI server components on track Luxshare reported 3Q26 earnings on 29 Oct and hosted its earnings call on 31 Oct. 3Q26 earnings missed cons. due to iPhone assembly and FX losses. Revenue grew 22% QoQ and 14% YoY to RMB111bn, beating cons. by 2%. GPM remained resilient despite higher material costs and FX headwinds. Memory cost increases were largely passed through, but other material inflation proved harder to offset. FX reduced 9M26 gross profit by c.RMB5B (1.75ppt of GPM), alongside RMB2.9bn in FX losses, including RMB880M in 3Q. Profit contributions from affiliates/JVs, mainly iPhone assembly business, fell 12% QoQ to RMB1.1B, reflecting demand pulled into 1H and the iPhone 18 base model launch delayed to 1Q27. EPS grew by 7% YoY to RMB 0.7, 14% below cons. Company guides 2026 net profit increase by 15-20% to RMB19.1B-19.9B, vs. buyside expectation of RMB19.5-20B. Communications and auto businesses remain on track. 224G DAC/AAC products have entered volume production, leading peers by roughly one quarter. In optical transceivers, the company has resolved yield issues for 1.6T modules during the NPI phase and targets volume shipments in early 2027. Beyond connectivity, Luxshare has involved in 15 projects in AI cooling components that will drive revenue growth next year. The planned acquisition of KFM Kingdom (3816 HK, not covered) should enhance Luxshare’s metal-processing capabilities in L1-L5 for AI rack. In Auto , Leoni integration continues to progress smoothly with c.70% of new design wins are overseas projects, reducing exposure to intense competition in the domestic market. The acquisition of BWI Group, parent of BWI International (2339 HK, not covered), should strengthen Luxshare’s chassis capabilities, particularly suspension and braking. Non-Apple consumer electronics remain solid, with PC gaining traction and new edge AI device coming for 2027. Despite its recent entry into PC assembly, Luxshare shipped 10M+ units in 9M26 and targets annual volume increases of at least 5mn units, vs. annual shipments of 20–45mn at leading Taiwanese ODMs. News report indicates that Luxshare and Huaqin (603296 CH/3296 HK, not covered) are winning HP and Dell orders from TW peers. T echnology and cost advantages support these gains as Taiwanese ODMs shift resources toward AI servers. In edge AI, management expects new products (likely for OpenAI) to generate revenue from 2027, with potential annual shipments exceeding 10mn units. (continue on page 2)Close Date 30 Oct 2026 002475.CH Close Price (CNY) 45.60 Price Target (CNY) 86.00 Upside/(Downside) 89% 52-Week Range 81.78/43.56 ASIAX 1,787.50 FYE Dec Div Yield 0.1% Market Cap (CNY) (M) 350,250 EV (CNY) (M) 439,053 Performance YTD 1M 6M 12M Absolute (%) (19.6) (7.7) (31.9) (27.6) ASIAX (%) 9.3 (8.3) (2.7) 9.1 Relative (%) (28.9) 0.5 (29.3) (36.7) Source: Bloomberg, Bernstein estimates and analysis. Price Performance, 1YR CNY90 CNY80 CNY70 CNY60 CNY50 11/25 02/26 05/26 07/26 10/2615001600170018001900200021002200 002475.CH ASIAX See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 01 Nov 2026 23:21 UTC Completion Date: 01 Nov 2026 23:21 UTC Alex Wang, CFA +852 2123 2613 alex.wang@bernsteinsg.com 2 November 2026 (continue from page 1) We forecast revenue/EPS CAGRs of 15%/33% over 2026–28E . We model non- Apple revenue to grow a 25%+ revenue CAGR, driven by AI server components (copper interconnects, optical transceivers, cooling and power), PC ODM share gains, and steadily growth in auto segment. We model iPhone shipments down 1% in 2026 and up 2–3% annually in 2027–28, with margin expansion at Lizhen driving 20%+ earnings CAGR in iPhone assembly. Reflecting weaker A-share sentiment, particularly across Apple and optical supply chains, we lower our target P/E to 21x from 25x and roll forward to average 2027– 28E EPS of RMB4.0 (previously 2027E EPS of RMB3.5), maintaining our price target at RMB86. Investment Implications Overall, we view Luxshare as an emerging AI server component platform for global customers, spanning copper and optical connectivity, cooling, and power solutions. Its time-to-market advantage and mass-production capabilities should become increasingly valuable as CSPs seek to manage rising AI server BOM costs. T rading at 13x P/E, the valuation remains attractive, particularly with EPS growth expected to accelerate next year. Outperform. ASIA TECH HARDWARE 2 9WoXnWwVvXoRtMqP6MdN9PnPmMsQsMkPqRmNiNnNpN6MoPnMNZrQqQuOrQmP Alex Wang, CFA +852 2123 2613 alex.wang@bernsteinsg.com 2 November 2026 DETAILS 3Q26 EARNINGS RESULTS EXHIBIT 1: 3Q26 revenue came in 2% above cons., with gross margin largely in line; net profit missed cons. by 13%, primarily due to lower-than-expected earnings contributions from iPhone assembly JV and increased R&D spending Luxshare Difference vs. (RMB in Millions) 3Q25 Actual 2Q26 Actual 3Q26 Actual QoQ YoY Bernstein Consensus Bernstein Consensus Revenue 96,411 90, 达到 710亿元 /1,210 亿元，同比增长 60%/71% ，且 产品结构更有利，盈利能力不断改善。我们预计 2028 年公司净利润为 101亿元（ 2025-28 年复合增速为 36%），其中逾 40%来自数据中心业务 。我们预测数据中心业务敞口扩大和超节点项目中强化的领先地位将支 持估值上调。重申 “增持”评级，截至 2027 年6月的目标价为 118元。 •2026 年3季度经常性净利润增速加快。 2026 年3季度华勤的经常性净 利润同比增长 22%至12亿元，增速高于 2026 年上半年的 11%。收入 比我们的预测高 14%，而毛利率同比 /环比下降，我们将此归因于 “买 卖模式 ”下材料成本上升稀释了利润率，而非底层盈利能力减弱。数 据中心已成为最大收入来源（同比增长 228% ，占总收入的 31%），其 次是 PC（23%）和智能手机（摩根大通预测约占 20%），份额扩大抵 消了下游的疲软并推动增长。 •超节点进入批量交付，未来势头料将更为强劲。 根据我们的供应链调 研，华勤在 2026 年3季度启动超节点批量交付， 9月份单月出货量超 过400柜。我们预计 2026 年4季度及以后的增势将更加强劲，原因是 对三大云服务商客户的交付量全面上升以及国内超节点渗透提速。我 们认为华勤覆盖研发、制造和大规模交付的全栈能力（被视为关键门 槛）应巩固其竞争优势，并在未来的超节点项目中获得领先市场份额 。我们预测 2026/27 年数据中心收入将分别达到 710亿元 /1,210 亿元（ 同比增 60%/71% ），其中 23%/48% 来自超节点， 9%/11% 来自高速交 换机。 •重申“增持”评级，目标价 118元。 7月初以来华勤股价跑赢申万电子 行业指数 37个百分点，我们认为原因在于公司具有韧性的盈利及其竞 争优势支持各项业务普遍打开份额上升空间，这得益于多元化业务布 局和持续的研发支出（ 2020 年至 2026 年前 9个月共 328亿元）。随着 国内超节点需求扩大，我们认为华勤是 ODM 领域的主要受益者，预 计2025-28 年盈利复合增长率为 36%。重申 “增持”评级，截至 2027 年6月的目标价为 118元。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2 中国 证券研究 2026 年10月28日 刘叶 (86-21) 6106-6200 ye.liu@jpmorgan.com 股价表现 年内迄今 1个月 3个月 12个月 绝对 6.4% -7.9% -18.1% -5.2% 相对 13.6% -4.2% -14.6% 2.5% 公司数据 已发行股票数（百万） 1,516 52周股价区间（元） 91.88-56.96 总市值（百万美元） 15,676 汇率 6.67 自由流通股比例 29.0% 三个月日均成交量（百万） 18.22 三个月日均成交额（百万美元） 216.0 波动性（ 90天） 60 指数 SHASHR 彭博 买入 |持有 |卖出 19|0|0 重要指标（财年 12月份结束） 单位：百万元，每股数据单位：元 FY25A FY26E FY27E FY28E 财务预测 收入 171,437 232,185 307,066 378,650 调整后的息税前利润 3,353 4,732 7,710 10,759 调整后的息税折旧摊销前利润 5,048 6,544 9,502 12,497 调整后的净利润 4,054 5,716 7,449 10,113 调整后的每股收益 3.99 3.77 4.91 6.67 彭博一致预期每股收益 2.85 3.92 4.79 5.99 经营活动现金流 (223) 3,494 1,026 6,791 公司自由现金流 (3,655) (231) (2,699) 2,616 利润率和增长率 收入增长率 56.0% 35.4% 32.3% 23.3% 息税前利润率 2.0% 2.0% 2.5% 2.8% 息税前利润增长率 59.6% 41.1% 62.9% 39.6% 息税折旧摊销前利润率 2.9% 2.8% 3.1% 3.3% 息税折旧摊销前利润增长率 59.7% 29.6% 45.2% 31.5% 净利润率 2.4% 2.5% 2.4% 2.7% 调整后的每股收益增长率 38.6% (5.5%) 30.3% 35.8% 财务比率 调整后的有效税率 7.7% 9.7% 10.7% 10.6% 利息覆盖倍数 NM NM NM NM 净债务 /净资产 0.2 0.1 0.2 0.2 净 归母净利润13.4亿元，同环比-68%/-55％，扣非净利润16.9亿元，同环比-58%/-25％，毛利率29.4%，同环比-6.4/-9.2pct。 #光伏逆变器维持高毛利、新能源开发短期拖累。 预计Q1-3收入175亿元；Q3收入66亿元，环比+14%；国内装机下滑、公司海外出货占比提升至60%+，毛利率同增4-5pct至40%+。预计26年出货120GW+，同降15%，但市场结构改善 利润持平，预计27年出货增长10%左右。新能源投资开发Q1-3收入27亿元，同降300%+，因国内电价政策变化及确收低影响，此业务亏损约7亿元，Q4预计确收规模起量，全年有望扭亏为盈。 #储能确收延迟有影响、27年有望翻倍增长。预计Q1-3储能系统收入232亿元，同降19%；其中Q3收入77亿元，同环比-30%/ +15%，出货量达17GWh，但确收仅9~10GWh；Q3储能毛利率21%，环比下滑13pct，主要系碳酸锂价格波动、出口退税退坡、汇率及运费等影响。预计Q4储能出货可达20GWh+ 季度新高，26年出货可实现60GWh+，欧洲拉美等地区需求旺盛，公司订单已实现同比翻倍，因此预计27年出货有望达120GWh，远超行业。盈利上，碳酸锂Q3起已进入降价周期，预计公司Q4毛利率会有所修复，27年碳酸锂继续降价、大电芯降本，预计毛利率提升会更明显，实现27年量价双升！ #构建AI电源生态、AI储能及SST潜力可期。 公司AI储能在手订单2GWh，跟进项目约十几GWh，27年进入订单交付期，后续要继续跟进政策变化。AIDC上 公司已进入英伟达生态链，SST产品与谷歌、AWS等紧密对接，国内已有中标和项目交付，预计27年小批量交付，28年规模化交付阶段；新产品上，今年底到27年陆续推出机架及板载电源、35kv SST等，建立整体备电产品解决方案，未来潜力可期！ #费用率同比有所提升、存货及合同负债环比等比例提升 公司26Q1-3期间费用83.5亿元，同比+6.6%，费用率17%，同比+5.3pct，其中Q3期间费用30亿元，费用率16.7%。26Q1-3经营性净现金流36.5亿元，其中Q3为-0.9亿元，同比减少65.7亿元，主要系收入规模下降以及原材料采购备货需求。26Q3末存货409.7亿元，较26Q2末+27.4%，主要系在途库存及在开发电站的增加。26Q3末合同负债146.7亿元，较26Q2末+25.8%，未来订单饱满。盈利预测：预计26-28年归母净利润100/ 140/ 171亿元，同比-26%/ +40%/+22%，对应PE为13.5/9.7/7.9x，给予27年18x，目标价122，维持“买入”评级。 风险提示：需求不及预期，格局加剧，政策风险等。#文字观点", "publish_time": "2026-11-02 09:00", "tags": ["文字观点"]}, "post:2026-11-02T08-59:bf567f864a95": {"id": "post:2026-11-02T08-59:bf567f864a95", "kind": "post", "title": "2026-11-02 08:59", "source_label": "帖子正文", "excerpt": "【长江电新】逸飞激光近况交流更新1101 1、收购方面，兴启航系光通信耦合设备领域标杆企业，主力出货产品为1.6T硅光耦合设备，3.2T产品与头部联合开发验证，同时持续布局CPO、NPO、CW光源相关耦合方案，其中CW光源已取得千万级小批量订单。3D传感器领域，面向激光雷达器件的耦合自动化产品可应用", "content": "【长江电新】逸飞激光近况交流更新1101 1、收购方面，兴启航系光通信耦合设备领域标杆企业，主力出货产品为1.6T硅光耦合设备，3.2T产品与头部联合开发验证，同时持续布局CPO、NPO、CW光源相关耦合方案，其中CW光源已取得千万级小批量订单。3D传感器领域，面向激光雷达器件的耦合自动化产品可应用于人形机器人、自动驾驶场景；汽车电子和消费电子领域已经和头部客户联合验证，进展顺利。 2、经营方面，收购筹备周期接近1年，兴启航25年之前经营较为稳定，年营收数千万级别，交付规模百台级别，订单7000万左右；截止10月，1.6T硅光设备已累计出货1400余台，全年出货目标为2000台，在手订单4.2亿，全年订单有望超过6亿，27年规模目标实现翻倍以上增长，至少达到十几亿营收规模。技术方面，公司重复定位精度可达50nm级，核心差异化优势在于核心部件全自研，运动控制板卡、系统、仪表仪器均为自主研发。 3、超容方面，公司攻克了超级电容高速装配的核心工艺与装备难点，实现了直径33-60全系列圆柱超级电容装备的出货，已与江海、东阳光、中车等国内头部客户签订了对应订单与产线，部分项目已逐步实现收入转化。与欧洲、日韩头部超级电容企业的更大规模订单合作，相关订单有望于今年年底落地。目前，在手订单超1亿元，今年年底有望突破3亿元，明年订单规模将进一步放大，2027-2028年订单可计划性较强。 4、主业方面，截止Q3末在手订单超过30亿元，新签订单同比50%+。固态电池设备、钠电池设备均已实现批量交付；核心圆柱全极耳电池装备已实现直径18到60全系列的批量交付，其中与日本客户达成深度合作。此外，海外订单从25年个位数提升至今年20-30%。#文字观点", "publish_time": "2026-11-02 08:59", "tags": ["文字观点"]}, "post:2026-11-02T07-24:8de6965845cf": {"id": "post:2026-11-02T07-24:8de6965845cf", "kind": "post", "title": "2026-11-02 07:24", "source_label": "帖子正文", "excerpt": "11月2日股市早报：人形机器人/医药/AI 耳机/食品饮料/白酒/乳业/脑机接口/PCB/固态电池等一、重要财经信息①据业内人士透露，周一央行将与金融监管总局、证监会召集各大银行开会，研究优化股票回购增持再贷款政策。业内猜测，此次会议大概率是金融管理部门为进一步稳定市场做准备。", "content": "11月2日股市早报：人形机器人/医药/AI 耳机/食品饮料/白酒/乳业/脑机接口/PCB/固态电池等一、重要财经信息①据业内人士透露，周一央行将与金融监管总局、证监会召集各大银行开会，研究优化股票回购增持再贷款政策。业内猜测，此次会议大概率是金融管理部门为进一步稳定市场做准备。 ②国有某大行计划向中国国新和中国诚通各新增千亿级股票回购增持专项贷款额度。 ③央行：11月2日起 每个工作日开展隔夜逆回购操作招标。二、今日热点聚焦深南电A：筹划收购天合跟踪不低于51%股权 预计构成重大资产重组华大九天：拟收购奇捷科技不超51%股权 补齐数字逻辑优化设计EDA工具短板高争民爆：拟购买紫源铜业51%股权和晟源矿业100%股权 股票复牌协和电子：控股股东及实控人拟变更为施惠庆 股票复牌人形机器人①Meta已经与中国机器人公司傅利叶智能合作，造出了一款人形机器人原型，内部代号Max，并且已经着手研发第二代。 ②上海：到2028年，实现工业机器人密度达600台/万人，推动8000台人形机器人进工厂，推动AI赋能的新型智能制造装备产业规模突破2000亿元。（大业股份、翔楼新材、福莱新材、新瀚新材）医药美股生物制药巨头礼来公布，2026年第三季度净利润为64.51亿美元，同比增长16%，业绩高于市场预期。减肥及糖尿病药物替尔泊肽相关产品Mounjaro和Zepbound营收分别增长65%和49%。公司将全年营收指引上调至910亿至920亿美元。（百花医药、万邦医药、羚锐制药、九安医疗、近岸蛋白、皓元医药、千红制药、睿智医药）AI 耳机苹果与阿里巴巴宣布达成合作，将千问集成至Apple智能。（歌尔股份、朝阳科技）食品饮料机构：当前正值双11电商走货高峰，行业流通品价盘波动加大，但波动中渠道情绪已较此前持续改观、接货情绪不错，目前飞天茅台原箱批价仍在1700元以上。（青岛食品、巴比食品、好想你、黑芝麻、良品铺子、天味食品、安井食品、西麦食品）白酒机构：当前白酒板块处于周期磨底后期、出清尾声阶段，价格、库存、预期等底部信号已现。（迎驾贡酒、泸州老窖、皇台酒业、古井贡酒、口子窖、今世缘、舍得酒业、山西汾酒）乳业机构：2024年中国B端乳制品市场规模已超400亿，预计2028年将达703亿元，复合增长率14.3%。新式茶饮、咖啡、烘焙等场景正在成为乳品消费的新引擎。（新乳业、阳光乳业、南方乳业、天润乳业、妙可蓝多、伊利股份）脑机接口马斯克披露了其脑机公司Neuralink最新的产品进展，称其首款产品为“心灵感应（Telepathy）”，第二款产品为“盲视（Blindsight）”。（浙江东日、美好医疗、创新医疗）PCBTPCA台湾电路板协会表示，原本只有Low CTE布、Low Dk2、HVLP4这类高阶材料吃紧，现在已经蔓延到CCL、高阶PCB、ABF载板、制程设备与耗材，连部分中低阶材料都开始出现交期拉长或涨价，TPCA预估供应链紧张至少延续到2027年。（金安国纪、满坤科技、宏昌电子、明阳电路）固态电池宁德时代在投资者平台回应了固态电池的相关问题，并称公司在全固态电池上持续坚定投入，技术处于行业领先水平，2027年有望实现小规模生产。（上海洗霸、利元亨、德方纳米、先导智能）航运10月29日，马士基发布公告，宣布上调远东至北欧及地中海航线的运价，新费率自2026年11月16日起生效。10月中旬以来，达飞、马士基、赫伯罗特和地中海航运已相继宣布自10月19日起将远东发往欧洲/地中海/北非的FAK运价上调至4200—4500美元/FEU。（锦江航运、中远海控、招商轮船、中远海能）商业航天《上海市卫星互联网产业创新发展行动方案（2027—2030年）》，明确到2030年，力争实现在轨卫星总数超3000颗、核心产业规模突破800亿元，转化科研成果超100项、培育优质企业等主体超100家、打造标杆示范应用超100项，建成具有全球影响力的卫星互联网产业创新高地。（中国卫星、上海沪工、中国卫通）三、昨日强势板块和个股医药、食品饮料、白酒、脑机接口、机器人、PCB、固态电池等#文字观点", "publish_time": "2026-11-02 07:24", "tags": ["文字观点"]}, "post:2026-11-02T08-44:091d854ffee3": {"id": "post:2026-11-02T08-44:091d854ffee3", "kind": "post", "title": "2026-11-02 08:44", "source_label": "帖子正文", "excerpt": "🌛化学法硅微粉ZJ要点—1101行业再更新 🐟1️⃣行业的主要几种生成法：【溶胶凝胶法/高温氧化法/等离子体法/聚合凝胶法】，#溶胶凝胶法：以硅酸四乙酯、硅酸四甲酯或多聚硅氧烷为硅源（三时纪变体是TAT：先成球，后转化）；#高温氧化法：这套工艺由日本雅都玛在1990年代开发，行业俗称“爆燃法”", "content": "🌛化学法硅微粉ZJ要点—1101行业再更新 🐟1️⃣行业的主要几种生成法：【溶胶凝胶法/高温氧化法/等离子体法/聚合凝胶法】，#溶胶凝胶法：以硅酸四乙酯、硅酸四甲酯或多聚硅氧烷为硅源（三时纪变体是TAT：先成球，后转化）；#高温氧化法：这套工艺由日本雅都玛在1990年代开发，行业俗称“爆燃法”；#等离子体法：把经过超细磨和化学除杂的硅微粉送入等离子炬高温区，快速熔化后在表面张力下成球，国内目前无量产者；#聚合凝胶法：分子内部反应，粒径窄、球形度好、均一性强（北京矽瓷等）。 🐟2️⃣北京矽瓷（瑞晨环保）：1）核心团队由清华大学化学系毕业的丁博士于2023年前后组建创业，专攻硅相关粉体材料，覆盖硅微粉、石英砂、碳化硅、氮化铝、氮化硅、氧化铝等品类；2）硅微粉当前大量推广微米级（6N级）产品，同时布局亚微米级产品；亚微米级产品面向更高端覆铜板，规划占比较多（2027年中2000t）。3）#硅微粉已向山东、江苏、上海、江浙区域客户送样，覆盖M7-M9等级覆铜板客户，多家客户反馈良好；目前已有订单，已签订几个长期订单。#2027年主力产品为M9，同时布局M10，M8产品根据下游客户需求配套生产；#纯度、杂质、粒度分布等指标均对标日本雅都玛。 相关标的：凌玮科技、瑞晨环保、联瑞新材 📖详细内容私信（PCB系列更新至24）#文字观点", "publish_time": "2026-11-02 08:44", "tags": ["溶胶凝胶法", "高温氧化法", "等离子体法", "聚合凝胶法", "文字观点"]}, "post:2026-11-02T13-21:c9c6ef7735b9": {"id": "post:2026-11-02T13-21:c9c6ef7735b9", "kind": "post", "title": "2026-11-02 13:21", "source_label": "帖子正文", "excerpt": "美银——胜宏科技：三季度调整利润贴近买方预期下沿；预计四季度迎来可观复苏", "content": "美银——胜宏科技：三季度调整利润贴近买方预期下沿；预计四季度迎来可观复苏；重申买入评级 胜宏科技（Victory Giant，VGT）三季度报表端净利润显著低于预期，但剔除一次性扰动后的调整净利润落在买方预期区间下沿。我们下调2026至2028年盈利预测11%至27%，目标价由367元降至302元（对应23倍2027年预期市盈率，原倍数25倍），当前股价160.38元，重申买入评级。短期业绩承压源于Vera Rubin新平台爬坡放缓、出货节奏后移及扩产成本前置，但管理层反馈良率已快速修复，泰国A1工厂利用率超预期，四季度有望实现环比可观复苏。 三季度业绩拆解：账面利润失速，主业调整后仍具韧性 三季度营收68.3亿元，同比增34%、环比增12%，低于美国银行证券预期17%、低于市场共识21%。报表归母净利润5.27亿元，同比降52%、环比降66%，较大幅低于预期，主因确认约1.95亿元捐赠支出及超5亿元金融资产公允价值损失。剔除上述扰动后，调整净利润约12亿元，同比增16%、环比增5%，处于买方预期12亿至15亿元的下沿。毛利率34.2%，环比提升2.1个百分点，受益于覆铜板（CCL）成本上涨顺价传导；营业利润17.2亿元，同比增29%，但仍低于我们及共识预期约两成。 经营拐点：平台爬坡与海外产能共振 Vera Rubin平台过去一至两个月良率显著改善，泰国A1工厂10月设备综合直通率（UTR）已达高位，好于预期。光模块方面，mSAP（改进型半加成法）工序当前良率接近80%，产能已被两家客户包满。公司计划2027年新增约200亿元产值的mSAP产能，但应用场景不限于光收发模块，亦覆盖更高层数与新材料体系的高端PCB。尽管英伟达供应链出现新进入者，新客户获取与规格持续升级（层数、材料、制程）将支撑长期单位产能消耗与份额护城河。 盈利预测与估值调整 为反映产能扩张带来的成本负担及短期出货节奏，我们下调2026至2028年每股收益（EPS）预测：2026年由8.05元降至5.91元，2027年由14.70元降至13.12元，2028年由22.90元降至19.45元。新目标价302元采用23倍2027年预期PE，较公司过去十年均值（约26倍）略低，以反映近期AI供应链情绪软化；但需求端仍强，规格升级持续吃掉产能，激进扩产反而强化其产业位势。当前股价对应2026至2028年PE分别为27倍、12倍、8倍，风险收益比仍具吸引力。 投资逻辑与关键风险 核心多头逻辑：AI服务器PCB单机价值量提升、英伟达平台核心供应商地位、泰国/越南/惠州新增产能与客户订单绑定、规格升级带来的均价与毛利弹性。 下行风险：全球AI云资本开支放缓、GPU平台迭代不及预期、竞争对手抢单、服务器机架供应链瓶颈、中美科技摩擦加剧。 上行风险：AI Capex超预期、Rubin及后续平台放量提前、份额进一步集中、地缘约束缓和。#文字观点", "publish_time": "2026-11-02 13:21", "tags": ["文字观点"]}, "post:2026-11-02T08-44:d9f229de248b": {"id": "post:2026-11-02T08-44:d9f229de248b", "kind": "post", "title": "2026-11-02 08:44", "source_label": "帖子正文", "excerpt": "外资机构对中国资产的真实看法（综合三份报告提炼） 基于摩根大通、高盛、野村、德银、花旗、汇丰、摩根士丹利、巴克莱、美银、瑞银等十余家外资机构10月底至11月初的最新观点，可以提炼出外资当前对中国资产的真实态度。一句话概括：战术上谨慎防御，战略上悄然布局", "content": "外资机构对中国资产的真实看法（综合三份报告提炼） 基于摩根大通、高盛、野村、德银、花旗、汇丰、摩根士丹利、巴克莱、美银、瑞银等十余家外资机构10月底至11月初的最新观点，可以提炼出外资当前对中国资产的真实态度。一句话概括：战术上谨慎防御，战略上悄然布局；看空盈利短期表现，看多估值修复与人民币升值；结构上极度分化，主线高度集中在AI硬件链、红利防御和汇率资产。 一、宏观总基调：承认企稳，但不相信\"再加速\" 外资对宏观的判断出奇一致——\"短期不差，长期不强\"。 高盛宏观调查显示，57%的投资者预期未来六个月中国增长动能\"基本不变\"，36%预期放缓，仅8%预期加速；消费和通胀预期同样偏谨慎。 野村将2026Q4 GDP预测从4.5%上调至4.8%（低基数+财政发力），但2027年维持4.0%，低于市场共识4.4%；花旗更悲观，看2027年降至4.1%。 政策判断上，德银和花旗都认为\"今年重大新增刺激的窗口基本关闭\"，政策重心从\"宣布\"转向\"落实\"，实质性加速要等2027年初地方换届完成。 专家解读：外资的真实逻辑是——他们已经接受了\"中国不会有强刺激\"这个前提，并在其中寻找确定性。上调Q4增速是数据层面的，下调2027年是叙事层面的。这意味着他们不赌\"经济V型反转\"，只赌\"政策托底不翻车\"。对个人投资者而言，这是个重要信号：不要指望宏观贝塔行情，赚钱要靠结构阿尔法。 二、股市：最悲观的时刻，恰恰是他们在讨论买点 这是最反直觉的一点。10月A股大跌（沪深300月跌8.5%，成长股跌16%），情绪跌至2024年9月以来最弱，但外资的报告里充斥着\"低位\"\"超配\"\"买入\"的字眼： 估值：MSCI中国前瞻市盈率9.3-9.5倍，处于十年低位（Z-score -1.3）；高盛明确说当前估值\"较历史低谷仅高约10%\"，给出12个月目标80点，隐含约24%美元总回报。 资金流：ETF单周净流入超260亿美元（美银口径），创2025年4月以来最大——外资清楚识别出\"国家队\"在买入，并把这视为底部信号而非干预噪音。 情绪指标：美银直言\"在当前位置大幅削减beta意义有限\"，摩根士丹利维持MSCI中国\"标配\"，基准目标隐含18%上行空间。 专家解读：外资的\"真实看法\"是——这是一个估值底，但不是一个盈利底。他们买的是一个\"下有政策托底、上有盈利弹性\"的赔率结构，而不是对中国经济的信仰投票。注意一个细节：他们用的是\"战术反弹\"（tactical rebound）这个词，说明仓位上仍然是试探性的，一旦盈利下修加速，随时会撤。这与您体系里的\"机会成本优先\"是相通的：底部区域可以用小仓位试探，但加仓必须等盈利预期企稳的信号。 三、风格判断：从\"成长信仰\"切换到\"防御+现金流\" 10月的风格切换是外资观点中表达最强烈的部分： 沪深300成长指数月跌16.2%，价值指数逆势涨1.6%，红利指数微涨0.3%；行业上能源（+3.4%）、日常消费（+2.0%）、金融（+0.5%）是仅有的正收益板块，信息技术暴跌24.5%。 野村直接推荐做多30年期中国国债（目标收益率1.9%），逻辑是信贷需求疲软+险资注资后的长久期配置需求。 券商偏好上，短期推荐低方向性暴露的东方财富、银河证券，本质是\"市场不好时赚通道的钱\"。 专家解读：外资在10月做了一次教科书级的拥挤交易反身性撤退——AI硬件链上半年涨太多、持仓太挤（公募基金信息技术仓位仍占54%），遇到全球AI变现疑虑+加息担忧，先杀估值再说。他们并非看空AI的长期逻辑（下文会讲），而是短期要把盈利兑现、估值合理的资产放在组合前面。翻译成人话：外资现在的排序是——先拿股息和确定性，等成长股杀出\"带血筹码\"再回来捡。 四、汇率：最拥挤、最坚定的一致看多 人民币是三天报告中唯一零分歧的资产： 野村把做空USD/CNH的信念级别上调至最高的5/5，目标6.50（12月底），甚至看到2027年6.30；理由包括11-12月季节性贬值美元的概率80%、企业结汇比例回升至51%、特朗普-习会晤前的政治窗口。 高盛预测12个月目标6.40，\"完全收复疫情后所有贬值幅度\"。 巴克莱和德银的共同结论是：央行管理的是升值\"节奏\"而非\"方向\"——中间价偏弱只是不想让CFETS指数升太快。 唯一的分歧在交易层面：美银亚洲团队反而推荐做空CNH/做多TWD，赌的是\"台湾AI出口强 vs 中国内需弱\"的剪刀差。 专家解读：外资判断人民币的逻辑链条是\"贸易顺差（9月出口+36%）→ 结汇需求释放 → 央行顺水推舟 → 外资回流股市\"。汇率是他们看多中国资产的核心传导枢纽——人民币升值本身就会带来配置盘回流，形成\"汇率升→资金入→股市稳\"的正反馈。这是典型的反身性结构，值得按您体系里的\"反身性五形态\"跟踪回路是否闭合：关键观察点是6.65-6.70关口能否有效突破，以及中间价是否继续放行。 五、产业主线：嘴上卖科技，身体很诚实——AI硬件链是真爱 这里出现了外资观点中最大的\"言行差\"： 表面上：10月信息技术板块暴跌24.5%，深南电路、光迅科技、东山精密月跌超35%，德银量化中国AI敞口低于台韩。 实际上：摩根士丹利的AI硬件报告是全篇最乐观的部分——VR200机架成本780万美元（GB300的两倍），PCB单机架含量提升143%，ABF基板2027年供不应求，CCL的AI相关TAM五年47%复合增长。对鸿海、台光电、沪电、立讯、工业富联的供应链公司普遍\"增持\"。 专家解读：这才是外资的\"真实看法\"——10月卖科技是交易，不是观点。他们砸的是估值，不是逻辑。AI服务器的量价齐升是2026-2027年确定性最高的产业趋势，外资只是在等两个条件：一是全球加息担忧缓和（估值压制解除），二是三季报后筹码出清（公募54%的IT仓位降下来）。台积电式的\"业绩兑现+估值消化\"剧本，他们见过太多次了。对个人投资者，这意味着AI硬件链的回调要区分\"逻辑杀\"和\"情绪杀\"——目前只有情绪杀。 六、信用风险：最大的新变量，也是最大的分歧点 华发事件是三天报告里最值得警惕的边际变化： 华发离岸债单周跌54pt；摩根大通筛查发现45家国企开发商中22家（49%）违反2-3条红线；万科Q3再亏90亿，净负债率130%，现金/短债仅0.2x。 野村复盘2020年永煤事件：利率冲击约25bp后企稳；央行新设BNSF工具就是为了防赎回螺旋。 但外资同时也说：投资级开发商（中海、华润、保利）债券依然稳定，\"纯国企公开债违约\"的共识尚未打破。 专家解读：外资对这件事的真实态度是\"系统性风险不大，但信仰在折价\"。他们担心的不是华发本身，而是\"国企不违约\"这个隐性担保定价体系出现裂缝后，高收益地产债、城投融资、甚至部分弱资质国企永续债都要重新定价。德银提到2026-2027年地方政府债务置换债券（每年2万亿）是否延续，才是真正的压力测试。普通投资者记住一点：地产链的\"国企信仰\"不再是免费的安全垫，地产板块只能买信用最硬的央企（中海、华润），避开所有有展期传闻的主体。 七、总结：外资的\"真实仓位心态\" 综合三天报告，外资当前对中国的真实心态可以浓缩为五句话： 宏观不赌强刺激，政策托底即可——等待12月中央经济工作会议给2027年定调。 股票在估值底部试探性买入——买的是赔率（9.3倍PE+国家队托底），不是信仰。 风格短期防御（红利、金融、消费龙头），中期等科技错杀机会——燕京U8、周大福韧性、美的7%股东回报率这类\"现金流资产\"被反复强调。 人民币是全场最确定的多头——升值周期可能贯穿到2027年，这是回流资金的钥匙。 信用风险是新出现的暗礁——华发事件如果扩散，会推迟外资加仓的节奏，但不改变方向。 最后一句解读：外资现在的状态，像极了您体系里说的\"二类机会\"观察期——大方向认可、赔率合适，但叙事回路尚未完全闭合（盈利还在下修、信用事件未了、成交萎缩至1.5万亿）。他们用笔在写看多，用脚在等信号。我们个人投资者不必抢跑，跟着两个信号操作即可：一是人民币升值能否站稳6.65下方，二是12月中央经济工作会议的财政定调。信号出现前，仓位以防御为主；信号确认后，AI硬件链和券商才是进攻的方向。 免责声明：本文基于上传的机构研究报告内容综合提炼，仅供学习研究参考，不构成任何投资建议。文中涉及的机构观点为报告期内的历史观点，可能存在时效性问题；市场有风险，投资需谨慎，据此操作风险自担。#文字观点", "publish_time": "2026-11-02 08:44", "tags": ["文字观点"]}, "attachment:files/中原证券-研究所月度金股组合（2026年11月）—2026年11月1日_11月30日-20261030.pdf": {"id": "attachment:files/中原证券-研究所月度金股组合（2026年11月）—2026年11月1日_11月30日-20261030.pdf", "kind": "attachment", "title": "中原证券-研究所月度金股组合（2026年11月）—2026年11月1日_11月30日-20261030", "source_label": "中原证券", "excerpt": "1IRHUIo4sYeWbZ9PcM9PoMoOpNtNfQpOmMkPsRrQbRqRpRxNtQmNvPmNmQ", "content": "1IRHUIo4sYeWbZ9PcM9PoMoOpNtNfQpOmMkPsRrQbRqRpRxNtQmNvPmNmQ", "status": "extracted"}, "post:2026-11-02T12-53:bf82fc8306e3": {"id": "post:2026-11-02T12-53:bf82fc8306e3", "kind": "post", "title": "2026-11-02 12:53", "source_label": "帖子正文", "excerpt": "今天东山精密业绩会袁总： 1、现在的光模块龙头，未来也会是NPO龙头，因为是高度定制的。", "content": "今天东山精密业绩会袁总： 1、现在的光模块龙头，未来也会是NPO龙头，因为是高度定制的。到了NPO时代，最重要的就是光芯片和ai pcb 2、紧缺程度从dsp 光芯片 pcb变成dsp pcb 光芯片，东山三个紧缺占2个自己保供 3、dsp就是卡在台积电，台积电明年Q2可能会释放出产能给dsp，头部dsp缺料应该都会有大幅度缓解。从明年全年来看，dsp不会说太紧缺 4、传统pcb顺价非常顺利#文字观点", "publish_time": "2026-11-02 12:53", "tags": ["文字观点"]}, "post:2026-11-02T12-54:c63d32a48c9d": {"id": "post:2026-11-02T12-54:c63d32a48c9d", "kind": "post", "title": "2026-11-02 12:54", "source_label": "帖子正文", "excerpt": "📑高盛中国午间市场简报#交易台📈上证指数上涨 1.16%", "content": "📑高盛中国午间市场简报#交易台📈上证指数上涨 1.16%；上证 50 指数上涨 0.74% 📉深证成指上涨 2.39%，创业板指上涨 3.28% 💴 能扩张伴随良率与利用率爬坡。 高盛在8月《CHIPS IV》中测算：中国DRAM TAM在2026E—28E复合增速约50%，至2028年达2,570亿美元；HBM子市场复合增速约188%，达320亿美元。长鑫作为国产DRAM核心供给方，承接“国际原厂转产HBM留下的标准DRAM缺口”与“国产算力自主可控”双重红利。 四、盈利模型上修 基于3Q26实际毛利结构与规格升级，上修2026E—2030E净利约3%/1%/1%/1%/1%： 2026E营收3,924亿元、净利1,977亿元（EPS 3.09元），毛利率86.5%； 2027E营收6,709亿元、净利3,692亿元（EPS 5.52元），毛利率84.6%； 2028E营收9,014亿元、净利4,843亿元（EPS 7.24元）； 2029—30E营收进一步至1.12万亿/1.39万亿元，净利至6,048亿/7,547亿元。 费用率假设基本不变，上修几乎全部来自毛利率中枢上移，而非单纯涨价假设。 五、投资结论 长鑫正在从“周期反转型标的”重定价为“国产AI基础设施核心资产”： 短期看，4Q26营收环比+4%、毛利率稳于86%—90%高位，业绩兑现度强； 中期看，DDR5放量、LPDDR6旗舰落地、4F²/VSG架构在服务器端导入，是2027—28年利润率韧性的核心； 长期看，中国DRAM自给率提升+HBM生态外溢，支撑2030年前收入CAGR维持20%+。 131元目标价不是对涨价周期的赌博，而是对“技术自主+产能纪律+国产替代刚性需求”的折现。 六、核心跟踪与下行风险 跟踪变量：DDR5/LPDDR6出货占比、4F² RDIMM客户验证节奏、产能利用率与良率、长协（LTA）覆盖率、ASP季度环比、资本开支强度。 下行风险：行业竞争超预期（三星/海力士/美光价格战）、AI资本开支退潮导致服务器DRAM需求不及预期、地缘政治与设备材料限制收紧、4F²量产良率爬坡慢于预期、估值在周期回撤时先行压缩。#文字观点", "publish_time": "2026-11-02 13:21", "tags": ["文字观点"]}, "post:2026-11-02T19-15:46e6a5ba674f": {"id": "post:2026-11-02T19-15:46e6a5ba674f", "kind": "post", "title": "2026-11-02 19:15", "source_label": "帖子正文", "excerpt": "20261102今日段子汇总 1、丝路视觉：公司旗下提亚数科以城市基建、生态建筑等要素搭建三维数字城市底图，实现数字孪生实时图形呈现与应用，其自研提亚引擎作为全流程数据驱动的一站式", "content": "20261102今日段子汇总 1、丝路视觉：公司旗下提亚数科以城市基建、生态建筑等要素搭建三维数字城市底图，实现数字孪生实时图形呈现与应用，其自研提亚引擎作为全流程数据驱动的一站式生产平台持续迭代 2、海看股份：公司与红果、抖音签署AI漫剧合作框架协议，多部作品登上平台原生漫剧榜首。2026年10月16日互动，公司视听传媒智创大模型涵盖中剧与微短剧审核等智能体，海看鲸灵AI影视创作平台面向短剧创作者等开放技术服务 3、冰山冷热：1、冷热产业链综合方案服务提供商；掌握全球先进的二氧化碳跨临界冷热“五合一”零碳技术，为北京冬奥会多个比赛及配套冰场、哈尔滨亚冬会三个冰上场馆提供制冷设备；2、公司主要研究数据中心液冷的冷源部分，着重研发干冷器、氟泵系统、冷水系统，部分产品已实现小批量交付 4、东山精密：1、全球第三的印刷电路板企业、全球第二的柔性线路板企业；2、收购的索尔思具备光芯片IDM全流程自研及量产能力，是国内少数、全球为数不多实现高端EML光芯片规模化量产的企业，光模块方面，索尔思实现全产业链布局，产品覆盖10G至1.6T全速率，并持续推进3.2T及以上下一代光模块研发 5、东方海洋：公司主要从事海水苗种繁育、养殖，水产品加工等，水产品加工主要包括调理食品系列、冷冻鱼片系列、海参系列加工产品等 6、阳光照明：中国最大的节能灯生产和出口基地之一；公司使用自有资金 3,000万元参与蓝星光域（上海）航天科技有限公司融资，完成后阳光照明持有其1.0989%股权。蓝星光域成立于2021年 5月，专注于全场景激光通信解决方案，核心产品包括星载同轨/异轨激光通信终端、机载平流层激光通信终端等，主要应用于卫星间、星地间高速率通信，业务覆盖空天地海全场景空域 7、桂林三金：公司拥有国家中药保护品种21种，核心产品三金片、西瓜霜等产品为全国知名品牌，作用有清热泻火，消肿止痛、治疗咽炎等；第三季度净利润同比增长15.52% 8、沈阳机床：数控机床龙头 基板等产品；胜宏科技Q3调整利润贴近买方预期下沿，预计Q4迎来可观复苏。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线：物理AI与具身智能/机器人。\u003c/strong> 今天强化的逻辑：全球科技巨头正从大模型竞争向物理AI入口竞争延伸，机器人&amp;物理AI仍是Q4产业变化最大的赛道；商业化落地在整机、产能和数据服务环节同步推进。今天出现的催化/验证：Meta携手傅利叶智能研发人形机器人Max，智元机器人2026年上半年营收接近20亿元；Optimus加州第一条全自动化量产线即将下线；万向钱潮机器人产品上半年200台/周、10月下旬达1000台/周、年底挑战2500台/周；道通科技发布AAGI空地智能解决方案品牌。\u003c/li>\n\u003cli>\u003cstrong>主线：AI算力/服务器/存储。\u003c/strong> 今天强化的逻辑：AI服务器机柜放量叠加强劲现金流，国产算力与存储路线继续推进，存储价格呈结构性分化。今天出现的催化/验证：工业富联3Q26业绩符合预期，AI Server Rack放量叠加强劲现金流；立讯精密AI服务器组件业务按计划推进；4Q26 PC端DRAM平均售价预测上调、服务器端/移动端符合预期、NAND低于预期；长鑫科技3Q26毛利率攀至90%；字节自研芯片第二代Ada 2S预计今年Q4以256卡整机柜落地、性能对标H20，第三代计划明年Q4生产对标B200，2027年国产算力卡比例有望升至70%以上。\u003c/li>\n\u003cli>\u003cstrong>主线：光通信/CPO。\u003c/strong> 今天强化的逻辑：光模块产品结构由800G向1.6T升级，光芯片自供增强交付与盈利能力，NPO/CPO新品是后续催化。今天出现的催化/验证：东山精密26Q3营收175.82亿元、同比+73.81%，归母净利润23.32亿元、同比+401.18%；800G出货量逐季提升，1.6T产品已于Q4进入批量出货阶段；中际旭创1.6T光模块放量驱动后续增长，2026年三季报营收与毛利率继续环比抬升；Marvell拟以全股票方式收购Lumentum，每股Lumentum换取4.5股Marvell，按10月28日股价对应每股约1,132美元，溢价约23.9%。风险信息：源杰科技维持“中性”评级，目标价由1,655元下调至788元，政策风险仍是最大悬顶之压。\u003c/li>\n\u003cli>\u003cstrong>主线：PCB/CCL/铜箔。\u003c/strong> 今天强化的逻辑：高阶材料紧张向CCL、高阶PCB、ABF载板、制程设备与耗材蔓延，部分中低阶材料交期拉长或涨价，供应链紧张预估至少延续到2027。今天出现的催化/验证：科翔股份拟投资85亿元扩产陶瓷混压PCB、mSAP基板等产品；胜宏科技Q3调整利润贴近买方预期下沿，预计Q4迎来可观复苏；化学法硅微粉已向山东、江苏、上海、江浙区域客户送样，覆盖M7-M9等级覆铜板。\u003c/li>\n\u003cli>\u003cstrong>主线：宏观/策略与流动性。\u003c/strong> 今天强化的逻辑：科技股大幅杀跌后市场风险偏好偏弱，A股处于震荡筑底与筹码出清阶段，托底信号与反弹等待并存；外资态度表现为战术上谨慎防御、战略上悄然布局。今天出现的催化/验证：费城半导体周五单日大跌7.2%，几乎回吐当周全部涨幅；电子板块本周整体-13%、排名30/30；周五成交16879亿元、增量1169亿元；央行、证监会11月2日会议研究推动支持资本市场工具使用；大摩统计1950年以来中期选举后12个月标普500上涨概率100%、平均涨幅16.6%。风险信息：科技稳不住，市场也稳不住。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>政策与流动性：11月2日上午央行、证监会召开会议，研究推动支持资本市场工具使用；央行与金融监管总局、证监会召集各大银行开会，研究优化股票回购增持再贷款政策；国有超大型银行计划向中国国新、中国诚通新增股票回购增持贷款额度，单家新增额度或达1000亿元。\u003c/li>\n\u003cli>具身智能与机器人：Meta携手傅利叶智能研发人形机器人Max；智元机器人2026年上半年营收接近20亿元；Optimus加州第一条全自动化量产线即将下线；万向钱潮机器人配套10月下旬达1000台/周，年底挑战2500台/周。\u003c/li>\n\u003cli>AI算力与存储：工业富联3Q26业绩符合预期，AI Server Rack放量叠加强劲现金流；立讯精密AI服务器组件业务按计划推进；长鑫科技3Q26毛利率攀至90%；存储价格追踪显示4Q26 PC端DRAM平均售价预测上调、服务器端/移动端符合预期、NAND低于预期。\u003c/li>\n\u003cli>光通信：东山精密26Q3营收175.82亿元、同比+73.81%，归母净利润23.32亿元、同比+401.18%；800G出货逐季提升，1.6T产品已于Q4进入批量出货阶段；Marvell拟以全股票方式收购Lumentum，溢价约23.9%。\u003c/li>\n\u003cli>PCB/CCL：TPCA表示材料紧张已蔓延到CCL、高阶PCB、ABF载板、制程设备与耗材，部分中低阶材料交期拉长或涨价，供应链紧张至少延续到2027；科翔股份拟投资85亿元扩产陶瓷混压PCB、mSAP基板等产品；胜宏科技Q3调整利润贴近买方预期下沿，预计Q4迎来可观复苏。\u003c/li>\n\u003cli>其他基本面：海油工程项目执行驱动2026年3季度盈利同比增长16%，现金流稳健改善、在手订单健康；华勤技术业绩符合预期，超节点启动批量交付，2026年4季度和2027年增势更强；南京银行利息净收入延续高增、资产质量整体平稳；房地产二手房成交同比增势延续，15城现房销售细则落地。\u003c/li>\n\u003cli>市场表现：电子板块本周整体-13%、排名30/30，其中光学光电-6%、消费电子-12%、半导体-13%、其他电子零组件-16%、元器件-18%；费城半导体周五单日大跌7.2%；科技股暴跌后投资者准备迎接股市更多动荡。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>特斯拉Optimus量产线下线节奏、T链产能爬坡与订单兑现，重点验证万向钱潮年底2500台/周目标及机器人零部件批产价格稳定性。\u003c/li>\n\u003cli>OpenAI硬件设备出货与新品发布节奏，立讯精密、博众精工等设备先行逻辑的后续订单验证；Meta-傅利叶Max进展及智元机器人营收兑现。\u003c/li>\n\u003cli>1.6T光模块放量、NPO/CPO新品催化与光芯片自供进展；东山精密1.6T产品Q4批量出货兑现，中际旭创1.6T放量对营收与毛利率的持续拉动。\u003c/li>\n\u003cli>存储价格分化：4Q26 PC端DRAM平均售价上调、服务器端/移动端符合预期、NAND低于预期的后续修正；国产HBM 2027年自给率30%-40%的验证；长鑫科技3Q26毛利率90%的持续性；字节自研芯片落地节奏与2027年国产算力卡比例提升。\u003c/li>\n\u003cli>PCB/CCL供应链紧张延续至2027的验证，科翔股份85亿元扩产落地进度，胜宏科技Q4复苏兑现，化学法硅微粉M7-M9等级覆铜板送样转订单。\u003c/li>\n\u003cli>资本市场工具使用与回购增持贷款额度落地节奏；中期选举结果及外资“战术谨慎、战略布局”态度变化；科技股筹码出清与反弹信号。\u003c/li>\n\u003cli>风险跟踪：立讯精密苹果业务疲软与汇兑损益拖累盈利；源杰科技政策风险；NAND价格低于预期；电子板块大幅调整后的风险偏好修复力度。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>00:33｜2026年11月1日云盘汇总\u003c/li>\n\u003cli>07:22｜盘前热点事件一、昨日热点三季报业绩：津滨发展、永安药业 商业航天：上海沪工、盛洋科技 消费：青岛食品、巴比食品 羊/洋/阳：阳光照明、东方海洋、澳洋健康二、央行、证监会将于周一召开座谈会 研究推动支持资本市场工具使用记者从业内获悉，11月2日上午9时左右，中国人民银行、中国证监会将召开会议，研究推动支持资本市场工具使用。同一天，中国人民银行、金融监管总局、中国证监会还将召集各大银行开会研究优化股票回购增持再贷款政策，会议将在央行举行。\u003c/li>\n\u003cli>07:24｜11月2日：金融、DeepSeek、千问AI、脑机接口等概念股梳理 一、昨夜发酵消息精选。1、金融：据了解，一家国有超大型银行近日计划向中国国新、中国诚通两家央企新增股票回购增持贷款额度，单家新增额度或可达到1000亿元。\u003c/li>
