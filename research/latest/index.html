026-11-01 19:47", "tags": ["文字观点​"]}, "post:2026-11-01T09-57:32036253f9fc": {"id": "post:2026-11-01T09-57:32036253f9fc", "kind": "post", "title": "2026-11-01 09:57", "source_label": "帖子正文", "excerpt": "📌📌野村外汇洞察：美国路演纪要 —— 客户观点与野村立场 📝 我们提炼出本次与客户交流得到的若干核心观察。📝 以下为 10 月 19 日当周，我们在美国开展客户路演，围绕全球外汇以及亚洲利率市场整理的若干核心思考。", "content": "", "publish_time": "2026-11-01 09:57", "tags": ["文字观点"]}, "post:2026-11-01T09-57:7ad283fbac22": {"id": "post:2026-11-01T09-57:7ad283fbac22", "kind": "post", "title": "2026-11-01 09:57", "source_label": "帖子正文", "excerpt": "📌📌美股市场动态：行情正在变动…… 💡 本周开局行情偏强，半导体板块出现需求回暖的积极信号（主要来自长线资金），但本周收尾阶段遭遇猛烈抛售，下跌过程中几乎没有买盘承接。💡 全周来看，资产管理人最终转为净卖出（逆转本周早些时候对科技板块的买入需求），对冲基金资金流整体多空平衡。", "content": "", "publish_time": "2026-11-01 09:57", "tags": ["文字观点"]}, "post:2026-11-01T18-24:47a6de67eb0a": {"id": "post:2026-11-01T18-24:47a6de67eb0a", "kind": "post", "title": "2026-11-01 18:24", "source_label": "帖子正文", "excerpt": "【中信组合策略|周思考】风险资产仍需等待右侧信号 本周全球风险资产继续普跌，A股跌幅尤为夸张。中东问题未缓解，美股大厂财报低预期后，滞胀交易仍在加速。", "content": "", "publish_time": "2026-11-01 18:24", "tags": ["文字观点"]}, "post:2026-11-01T21-22:c94fd8528398": {"id": "post:2026-11-01T21-22:c94fd8528398", "kind": "post", "title": "2026-11-01 21:22", "source_label": "帖子正文", "excerpt": "国内重点车企10月销量跟踪 1、比亚迪10 月交付 490,168 辆，同比 +11.0%，环比 +5.7%。其中纯电 30.57 万辆（同比 +37.4%）、插混 17.74 万辆（同比 -17.2%），出口新能源汽车 17.02 万辆、占当月销量 34.7%。", "content": "", "publish_time": "2026-11-01 21:22", "tags": ["文字观点"]}, "post:2026-11-01T09-55:4ad33f5d9cba": {"id": "post:2026-11-01T09-55:4ad33f5d9cba", "kind": "post", "title": "2026-11-01 09:55", "source_label": "帖子正文", "excerpt": "⭕【阳光电源】2026三季报点评：Q3业绩低于预期，主要系碳酸锂、出口退税、汇兑等影响毛利率，以及储能确收节奏及公允价值损失影响，发货仍高增预计后续将迎来单位盈利见底回升 ➡事件： 公司发布2026三季报，Q3营收、归母、扣非179.50/13.41/16.93亿元、同比-21.5%/-67.7%/", "content": "", "publish_time": "2026-11-01 09:55", "tags": ["储能系统", "测算单Wh净利低于0", "1元", "Wh", "汇兑", "公允价值损失", "文字观点"]}, "post:2026-11-01T18-22:c2c8dfc1b940": {"id": "post:2026-11-01T18-22:c2c8dfc1b940", "kind": "post", "title": "2026-11-01 18:22 t": "", "publish_time": "2026-11-01 18:26", "tags": ["文字观点"]}}, "source_details": {"post:2026-11-01T22-44:698a80660ae1": {"id": "post:2026-11-01T22-44:698a80660ae1", "kind": "post", "title": "2026-11-01 22:44", "source_label": "帖子正文", "excerpt": "【开源计算机】Agent推理驱动服务器升级，AI产业迈向全栈协同-20261101Agent推理拓展持续性算力需求，AI服务器全栈升级打开成长空间 AI应用由单次生成走向多轮交互、长上下文与多智能体协同，推动算力需求从集中建设向持续消耗延伸，为云厂商资本投入与AI服务器需求增长提供支撑。随着新一代整", "content": "【开源计算机】Agent推理驱动服务器升级，AI产业迈向全栈协同-20261101Agent推理拓展持续性算力需求，AI服务器全栈升级打开成长空间 AI应用由单次生成走向多轮交互、长上下文与多智能体协同，推动算力需求从集中建设向持续消耗延伸，为云厂商资本投入与AI服务器需求增长提供支撑。随着新一代整柜方案导入，服务器市场有望呈现出货增长与单机价值提升共振。架构层面，GPU与定制ASIC协同发展，分别发挥通用生态与专用优化优势；HBM扩容提速与先进封装升级增强数据供给能力，超节点及液冷整机柜推动交付形态向系统集成演进。主控层面，工具调用、沙箱执行与任务编排增加CPU负载，服务器CPU由辅助配套向核心调度中枢升级，带来配置比例与产品需求变化。产业竞争正从单芯片峰值性能转向有效Token产出与端到端效率，计算、存储、封装、互连及整机协同升级，有望持续拓展AI服务器产业链价值空间。模型效率提升与多模态应用共振，国产适配及算力建设持续推进 本周AI产业围绕推理效率、跨应用协作与多模态交互持续创新。模型端，OpenAI发布GPT-6.1 Terra，提升电脑操作能力并降低调用价格；谷歌推出Gemini 4 Carbon及世界模型Genie 4，拓展复杂任务与实时交互能力。应用端，腾讯发布Buddy One，连接办公应用并支持跨平台资料检索，同传大模型推动实时语音服务落地。国产生态方面，讯飞发布全国产算力训练的语音基座模型，面壁MiniCPM-OCR完成多芯片平台适配。海外厂商持续推进算力投入与自研芯片布局，有望与模型优化、应用渗透共同推动AI产业发展。AI应用相对表现占优，关注产业升级带来的结构性机会 10月26日至10月30日，计算机指数周度变动为-10.85%，同期沪深300、上证指数、创业板指及科创50分别变动-2.92%、-2.48%、-10.08%和-13.73%。AI细分方向中，AI应用指数累计变动约-10.28%，AI算力指数约-12.91%，应用方向取得约2.63个百分点的相对收益。个股层面，盛天网络上涨11.02%，实丰文化、亿纬锂能分别上涨8.86%和5.57%，顺丰控股、美的集团、吉比特及格力电器均录得上涨，部分个股呈现结构性活力。受益标的 国产算力：寒武纪、海光信息、禾盛新材、沐曦股份、浪潮信息、工业富联等；海外算力：东山精密、胜宏科技、联特科技、德邦科技等；算力租赁：宏景科技、利通电子、协创数据等；大模型：智谱、MiniMax、阿里巴巴、腾讯控股；液冷：盾安环境、同飞股份、恒铭达等。 风险提示：大模型技术迭代不及预期风险等。 链接：开源计算机|行业周报：Agent推理驱动服务器升级，AI产业迈向全栈协同 ☎欢迎联系：张越17316258956/刘逍遥/叶进新/刘炬帅#文字观点", "publish_time": "2026-11-01 22:44", "tags": ["文字观点"]}, "post:2026-11-01T20-59:80f29d6b5337": {"id": "post:2026-11-01T20-59:80f29d6b5337", "kind": "post", "title": "2026-11-01 20:59", "source_label": "帖子正文", "excerpt": "周度大模型趋势跟踪（261101）：Anthropic公开招股书，OpenAI下调融资目标，千问接入苹果与Genie 4发布【旗舰模型智能上沿持续突破】 ①GPT-6.1 Terra上线。10月26日发布，API输入/输出价1/5美元每百万Token、加个仅为Sol一半（输入不超272K）。", "content": "周度大模型趋势跟踪（261101）：Anthropic公开招股书，OpenAI下 FP8算力达1EFLOPS，配备 256TB 全局统一内存，卡间互联带宽达TB级。（IT之家） 🔥网络/存储#英伟达披露下一代CPO技术▪10月31日讯，英伟达展出OOI（中介层上集成光学）技术，OOI将光引擎直接集成到承载GPU的硅中介层之上，让电信号不必绕经有机基板，从而提升传输效率、降低功耗。（财联社） #Marvell正谈判收购Lumentum ▪10月30日讯，据彭博社报道，Marvell Technology正处于收购Lumentum Holdings的深入谈判阶段，最早可能在下周宣布。（光纤在线）#SK海力士开发分层存储技术▪10月28日讯，目前部分AI系统已开始使用SSD承接KV缓存卸载，SK海力士正在开发配套的分层存储技术；SALT-KV是一种软件技术，通过评估每个KV缓存的复用价值与存储成本，优化数据在HBM、DRAM和SSD之间的分配；CMM-Hybrid则是基于CXL的混合内存技术，将完整KV缓存存放于SSD。（CFM） 🔥模型/应用#OpenAI发布GPT-6.1Terra ▪10月26日讯，OpenAI推出GPT-6.1 Terra，主打快速高效，并提升了视觉推理、计算机操作等能力，其标准API价格比GPT-5.6 Terra和GPT-6.1 Sol低50%，适合大批量应用于自动化工作中。（爱范儿）#谷歌发布Gemini4.0 Carbon ▪10月29日讯，谷歌发布Gemini 4.0 Carbon，1M上下文可文本/图像/视频/语音输入。旨在补齐谷歌模型编程能力，价格与Gemini 4.0 Aragon持平。（机器之心） #字节火山引擎MaaS业务上半年收入48亿元 ▪10月30日讯，字节火山引擎的 MaaS业务上半年收入达48亿元，毛利率超55%。主要来源于Seed、Seedance等自研以及DeepSeek、智谱等第三方模型的推理服务。（晚点LatePost） 【重要提示】以上信息为公开资料整理，不涉及投资建议及研究观点，仅供参考，本公司不保证其准确性、完整性与时效性；市场有风险，投资需谨慎！#文字观点", "publish_time": "2026-11-01 18:20", "tags": ["英伟达披露下一代CPO技术", "SK海力士开发分层存储技术", "OpenAI发布GPT-6", "谷歌发布Gemini", "文字观点"]}, "post:2026-11-01T19-36:753ade10fb0c": {"id": "post:2026-11-01T19-36:753ade10fb0c", "kind": "post", "title": "2026-11-01 19:36", "source_label": "帖子正文", "excerpt": "大摩——大中华区半导体：AI半导体供应链、存储、CPO、量子安全 核心结论：亚太半导体行业观点——具吸引力（Attractive）。AI半导体需求前景强劲，但芯片通胀、AI替代效应及中国AI本土化构成短期扰动", "content": "大摩——大中华区半导体：AI半导体供应链、存储、CPO、量子安全 核心结论：亚太半导体行业观点——具吸引力（Attractive）。 AI半导体需求前景强劲，但芯片通胀、AI替代效应及中国AI本土化构成短期扰动；长期看好先进制程、CoWoS封装、HBM及CPO产业链，维持台积电等核心标的超配评级。 一、AI半导体宏观框架：强需求与三重压制 长期需求驱动因素： • 芯片通胀：晶圆、OSAT（封测）及存储成本上升，2026年芯片设计公司毛利率承压，价格弹性将抑制部分终端需求。 • AI替代效应：除需求端受AI替代人力影响外，供应链资源正向AI半导体倾斜，导致非AI领域（如T-Glass、通用存储）出现短缺。 • 中国AI本土化：DeepSeek以低成本推理能力激活国内推理AI需求，本土代工链在AI GPU制造端的配套能力持续增强。 二、 broader半导体周期：逻辑代工产能利用率2026年下半年有望达80% 剔除存储及英伟达AI GPU收入后，非AI半导体增速预计2027年将转负。AI半导体（含云侧与边缘侧）已成为行业增长唯一引擎。 三、台积电三季报及指引深度解析 3Q26业绩回顾： • 营收1.49万亿新台币（同比+50.9%，环比+17.6%），略低于MS预估1.50万亿，但高于市场一致预期。 • 毛利率66.4%（同比扩张696bps，环比收窄131bps），低于MS预估的67.5%。 • 每股盈余（EPS）29.43新台币（同比+68.7%，环比+8.0%），低于MS预估的30.74，高于市场一致预期28.65。 • 营业利润率58.7%，同比扩张808bps。 4Q26指引： • 营收中值区间523亿至543亿美元（环比+14%），MS预估为1686亿新台币，市场预期1609亿。 • 毛利率指引65.0%–67.0%，MS预估68.6%（高于指引上沿，反映对先进制程涨价的乐观预期）。 • EPS指引中值对应35.25新台币（MS预估），环比+19.8%，同比+80.8%。 四、台积电2027年定价权与资本开支 • 先进制程晶圆涨价：受产能持续满载及通胀传导，台积电2027年领先制程（含2nm/3nm）晶圆价格或上调5%–10%。 • 资本开支上修：将2027/2028年资本开支预测分别上调至830亿美元/920亿美元，主要用于2nm及CoWoS产能扩张。 • 2nm需求强劲：预计2026–2028年N2产能复合增速达70%，客户涵盖英伟达、AMD、博通及苹果。 • 制程结构切换：N5产能2027年见顶回落，N3持续扩张，成熟/特种制程2024–2029年复合增速7%。 • AI收入占比跃升：AI半导体收入占总收入比例预计从2024年约15%升至2029年超60%；2026年AI收入占比将突破30%。 五、全球半导体市场及云 capex 追踪 • 全球半导体行业市场2027年预计达2.5万亿美元，其中AI半导体贡献三分之一（约8090亿美元）。 • 主要云服务提供商（CSP）capex增速放缓：2028年合计增速降至12%，预计2027/2028年云capex分别约1.5万亿/1.6万亿美元（含前14大全球CSP，不含主权AI）。 • GPU供应商P/E倍数有望在营收持续环比增长后迎来重估。 六、CoWoS先进封装：供需两旺至2028年 • 台积电CoWoS产能：受AI芯片需求拉动，2028年末全球CoWoS总产能或扩至26万片/月（kwpm）。 • 2027年需求结构：英伟达占49%（122.2万片），博通19%（48.4万片），AMD 14%（34.5万片），联发科7%（18万片），亚马逊AWS 4%（9万片）。 • 功耗与晶圆消耗：2027年GPU/ASIC总功耗预计达数十GW；AI计算晶圆消耗2027年将超550亿美元，英伟达占据绝大部分。 • HBM需求：2027年HBM总消耗量达440亿Gb，英伟达仍为最大买家（占总量60%+），HBM4及12层堆叠成为主流。 七、AI ASIC与芯片测试：定制化浪潮 • CSP自研芯片趋势：谷歌TPU已迭代至第6代，AWS Trainium/Inferentia、Meta MTIA、微软Maia持续放量。即便英伟达GPU性能强劲，CSP仍需定制芯片以优化TCO及供应链安全。 • 关键标的测算： ◦ Alchip（世芯）：2028年Trainium 4收入或达80亿美元，占总收入82%。 ◦ 联发科：TPU v10（Icefish）采用1.4nm，2029年TPU总收入或达700亿美元，占其AI ASIC收入主导。 ◦ KYEC（京元电）：受益于AI GPU、TPU及CPU测试需求爆发，2027年AI相关测试收入占比升至33%+，最大客户（英伟达）贡献营收7.15亿美元。 八、存储：CXMT崛起与结构性短缺 • CXMT（长鑫存储）制程路线图：2026年推进G5（1γ nm），2027年G5+，与三星、SK海力士、美光差距收窄。2028年全球DRAM产能3374kwpm中CXMT或占15%（约500kwpm）。 • HBM布局：CXMT HBM TSV产能2026年20kwpm→2027年40kwpm→2028年70kwpm，2027年按bit出货量占全球HBM市场4.4%。 • 价格与供需：AI存储拉动NAND短缺延续至2026年；NOR Flash 2026年亦面临供不应求；DDR4短缺持续至2H26，现货价受合约价压制。 九、CPO（共封装光学）与量子安全 • CPO市场：台积电PIC产能2026年0.5kwpm→2028年20kwpm，光学引擎实际出货量2028年达7387万颗。FOCI（上诠光纤）受益于英伟达Rubin Ultra机架，2027/2028年英伟达收入占比或达82%/90%，但市场份额面临TFC、康宁等竞争。 • CPO测试流程：涵盖晶圆级、芯片级、模块级共5次插入测试，2027年起规模-up与scale-out交换机产品并行，测试服务商包括SPIL（日月光）及设备商Chroma、Advantest等。 • Allring（Allring Tech）：受益于CPO、新美国客户及非台积电CoWoS扩产，2027年营收预计180亿新台币（同比+79%），CPO占比升至17%。 • 量子安全：各国PQC（后量子密码）迁移路线图以2030年为关键节点（美/欧/英/韩）。非对称加密体系面临量子威胁，PUF（物理不可克隆功能）TAM 2030年约3.1亿美元，量子硬件安全基础设施TAM 2040年达1100亿美元。 十、估值与风险收益框架 • 上行风险：AI capex超预期、先进制程涨价落地、CoWoS/CPO渗透率加速、中国AI需求爆发、存储涨价。 • 下行风险：云capex增速骤降、地缘贸易摩擦、原材料成本粘性、汇率波动、技术迭代不及预期、HBM产能过剩。#文字观点​", "publish_time": "2026-11-01 19:36", "tags": ["文字观点​"]}, "post:2026-11-01T20-58:2347e78dc11b": {"id": "post:2026-11-01T20-58:2347e78dc11b", "kind": "post", "title": "2026-11-01 20:58", "source_label": "帖子正文", "excerpt": "各位领导好，本周我们中信电子组的活动及观点更新如下：【核心推荐】本季度重点看好：豪威集团、长鑫科技、京东方、生益科技、寒武纪；本周科技股延续大幅调整，主动型基金电子配置仍达36%、超配18 ppts，叠加海内外三季报分化及海外巨头AI Capex回报担忧，市场风险偏好进一步下降", "content": "各位领导好，本周我们中信电子组的活动及观点更新如下：【核心推荐】本季度重点看好：豪威集团、长鑫科技、京东方、生益科技、寒武纪；本周科技股延续大幅调整，主动型基金电子配置仍达36%、超配18 ppts，叠加海内外三季报分化及海外巨头AI Capex回报担忧，市场风险偏好进一步下降；资金阶段性向低位、低持仓电子方向分散。基本面角度，AI需求及存储景气仍强，国内半导体设备/材料、国产算力上行拐点明确；当前市场进一步聚焦业绩确定性和持仓结构，前期调整充分、机构持仓较低且有基本面边际改善的方向更值得关注。【下周&本季重点关注事件】苹果FY26四季报（11.2）、AMD三季报（11.3）、华虹宏力三季报（11.5）、台积电10月营收（11.10）、Anthropic The Briefing AI产品发布活动（11.10）、应用材料FY26四季报（11.12）、中芯国际三季报（11.13）、SC26全球超级计算大会（11.15-11.20）。【下周拟进行的调研&反路演活动】中信证券2027年资本市场策略会（武汉11.3-11.5）。【本周内已进行的调研&交流活动】摩尔线程调研、汇顶科技调研、炬芯科技调研、乐鑫科技调研、星宸科技调研、影石创新调研、必易微调研、胜科纳米调研，晶方科技调研，光力科技调研、国力电子调研。 ——其中重点值得更新的部分：汇顶科技：海内外头部客户端侧新品合作积极，四季度预计千万美元级别营收贡献，主业触底明确 ，端侧AI新品与超声波指纹导入海外头部客户有望助力经营拐点提前，建议关注；豪威集团：26Q3盈利环比大幅修复，高价值产品占比提升驱动持续盈利能力改善；汽车新增定点及规格提升、端侧新设备预期及AIDC模拟业务产品扩张构建中期成长性，重点推荐。【本周内已进行的电话会交流】SK海力士、三星电子Q3电话会：1）SK海力士：营收104.62万亿韩元、环比+32%，营业利润83.33万亿韩元、环比+38%，营业利润率80%。HBM4量产良率超目标，预计Q4位元及收入占比超过HBM3E，2027年主要客户HBM量价谈判完成。Q3 DRAM位元约+10%、ASP上涨20%-30%高段，Q4位元预计增长20%中段；NAND位元略降、ASP上涨20%-30%中段，持续聚焦企业级SSD。2027年资本开支将显著增加，全年股东回报计划约100万亿韩元。2）三星：整体营收195.3万亿韩元、环比+14%，营业利润107.4万亿韩元、环比+20%；存储收入140.7万亿韩元、环比+16.5%。HBM4销售额环比增至三倍以上、占HBM收入60%，2027年HBM供货量已按目标价格售罄。Q3 DRAM位元低至中个位数增长、ASP约+20%；NAND位元中个位数增长、ASP上涨10%-20%高段，后续重点扩充服务器DRAM及QLC SSD。全年股东回报预计90-110万亿韩元。#文字观点", "publish_time": "2026-11-01 20:58", "tags": ["文字观点"]}, "post:2026-11-01T19-47:e154eab75775": {"id": "post:2026-11-01T19-47:e154eab75775", "kind": "post", "title": "2026-11-01 19:47", "source_label": "帖子正文", "excerpt": "【东北计算机】20261101 行业周报：继续关注物理AI和硬件技术升级线 —————————————— 计算机 (中信) 指数本周下跌-11.3%，创业板指数本周下跌10.08%，上证指数本周下跌2.48%。板块周涨幅前三为世纪恒通（+25.58%）、运达科技 （+9.45%）、华是科技 （+8.", "content": "【东北计算机】20261101 行业周报：继续关注物理AI和硬件技术升级线 —————————————— 计算机 (中信) 指数本周下跌-11.3%，创业板指数本周下跌10.08%，上证指数本周下跌2.48%。板块周涨幅前三为世纪恒通（+25.58%）、运达科技 （+9.45%）、华是科技 （+8.59%）；周跌幅前三为慧辰股份 （−30.19%）、吉大正元（ −30.15%）、指南针（ −28.30%）。 行业关键变化： 1️⃣ Meta和上海傅利叶联手造首个人形机器人原型Max，二代正在研发（来源：智能纪元AGI）；2️⃣AI相关需求持续升温，推动PCB行业加快向高频高速、高多层、高阶HDI等高端方向升级，PCB上游原材料供给紧俏及成本扰动仍在延续（来源：财联社）；3️⃣铠侠、三星、SK 海力士、美光、闪迪五家全球主要存储芯片厂商，上季度的营业利润和净利润总额首次超过美国五大科技公司（来源：日经亚洲报道）；4️⃣英伟达近日在SEMICON West 2026上公开展示了下一代共封装光学（CPO）技术（财联社）；5️⃣DeepSeek Harness团队10月31日晚在官方公众号发表技术文章《Super-agent设计探索：迈向更自主的Agent系统》（财联社）。 行业重要新闻： 国内 1. 台积电 A14 工艺试产取得 SRAM 微缩突破，计划 2028 年量产，高密度 6T SRAM 单元面积降至 0.017 平方微米以下，降幅超 19%，有望打破持续 8 年的 SRAM 尺寸瓶颈。（来源：科创板日报） 2. 超硬材料行业 “十五五” 规划论证会将于 11 月上海金刚石产业大会同期举办，议题覆盖金刚石热管理、半导体器件等方向（来源：科创板日报） 3. 智元发布具身基座模型 GO-3 Preview，自研 WRAM 原生架构，搭建全链路规模化具身智能学习体系（来源：财联社） 4. 上海发布新一代智能制造行动方案，设定 “54321” 目标，计划至 2028 年推动 8000 台人形机器人进入工厂，AI 赋能智能装备产业规模突破 2000 亿元（来源：第一财经） 国际 1. 三星、SK 海力士本周发布三季报，受益 AI 需求与存储涨价，合计营业利润预计达 184.4 万亿韩元，计划明年 Q2 向英伟达量产交付 8 层 HBM4（来源：财联社） 2. 马斯克看好人形机器人带来庞大内存需求，机构测算 2030 年人形机器人 DRAM 需求有望增长 20 倍，市场对机器人存储增量空间存在分歧（来源：财联社） 3. 闪迪管理层在财报会表示，本季度营收增长 60% 来自销量、40% 来自涨价，公司承诺将 100% 盈余现金返还股东，本财季已投入 50 亿美元股票回购（来源：科创板日报） 4. 英特尔表示服务器 CPU 供不应求，预计 2026、2027 年出货量增速均超 30%，行业 2027-2028 年持续供给受限（来源：财联社） ☎️欢迎联系东北计算机团队#文字观点​", "publish_time": "2026-11-01 19:47", "tags": ["文字观点​"]}, "post:2026-11-01T09-57:32036253f9fc": {"id": "post:2026-11-01T09-57:32036253f9fc", "kind": "post", "title": "2026-11-01 09:57", "source_label": "帖子正文", "excerpt": "📌📌野村外汇洞察：美国路演纪要 —— 客户观点与野村立场 📝 我们提炼出本次与客户交流得到的若干核心观察。📝 以下为 10 月 19 日当周，我们在美国开展客户路演，围绕全球外汇以及亚洲利率市场整理的若干核心思考。", "content": "📌📌野村外汇洞察：美国路演纪要 —— 客户观点与野村立场 📝 我们提炼出本次与客户交流得到的若干核心观察。 📝 以下为 10 月 19 日当周，我们在美国开展客户路演，围绕全球外汇以及亚洲利率市场整理的若干核心思考。客户讨论要点包含以下 6 个方面： 🔹 💡1、对美国科技股中长期整体持乐观态度； 🔹 💡2、部分客户建立美元兑日元多头头寸，客户认为组合资金流动的大背景并未发生改变； 🔹 💡3、市场对美元兑离岸人民币观点分化，但多数客户倾向于认为离岸人民币会相对美元升值； 🔹 💡4、大部分客户看空印尼盾，对新台币持中性态度，倾向看多印度卢比，对韩元的看多情绪最为强烈； 🔹 💡5、多数客户认为，在当前价位美国利率具备估值支撑，同时存在避险资金流入，但也有部分客户对能源价格处于高位保持谨慎； 🔹 💡6、客户倾向于做韩国利率收息交易，但对于香港前端利率的收息交易，认同度相对有限。 📝 综合来看，我们得到的结论是：本次会面的美国客户，大体上并没有为美国股票市场回调做太多头寸布局，这会带来美元兑日元的下行风险。 📝 针对美元兑离岸人民币，经过本次路演之后，更多市场参与者认为，美元兑离岸人民币的下行行情不仅仅会在中期上演，行情落地速度也会快于外汇远期价格所隐含的节奏。 📝 对于其余亚洲货币，我们认同市场一致看空印尼盾的观点，但做空印尼盾的头寸堆积也会带来一定风险。 📝 我们对印度卢比持看空立场，该国国际收支压力依旧存在；同时我们维持观点，韩国与中国台湾地区会受到强劲经常账户顺差支撑。由于寿险资金流动潜力与外汇估值因素，我们相对更加看多新台币，不过受美国股票、科技板块风险扰动，我们对此依旧保持谨慎。 📝 在亚洲利率方面，市场头寸整体并未过度拥挤，但交易倾向于做收益率曲线平坦化交易。 📝 💡客户认为，在能源价格高企的背景下，亚洲各国央行仍面临加息压力，但亚洲财政状况相比发达经济体表现更好，因此亚洲长端利率的期限溢价存在下行空间。 📝 💡总体上客户认同，做多韩国 5‑10 年期利率（持有韩国国债多头），是对冲科技股票进一步抛售的良好工具。 📝 💡香港利率是我们最高确信度的收息交易方向，但客户的看法分歧较大。客户认为，美国经济韧性仍在，美联储应当继续加息；针对香港的套息交易，客户更偏好做空 3‑6 个月外汇掉期点。 📝 💡针对印度市场，尽管市场已经定价大量加息预期，但客户希望看到经济增速进一步走弱或者油价企稳的更多信号，才会开展利率收息、持有印度政府债券多头的交易。 📋 美国客户观点以及野村的思考 💡1、美国客户对美国科技股中长期整体乐观，主要依据是他们认为 “七大科技巨头” 在 2027 年之前，资本开支与盈利表现不会令人失望。 💡 部分客户提到这些公司现金头寸充裕，并且对美国收益率上行并不敏感。 💡 我们的态度相对谨慎，我们强调压力正在逐步累积；彭博 10 月 14 日数据显示，14.8% 的美国科技公司贷款已经陷入困境（即利率较担保隔夜融资利率高出 10%；科技贷款样本总规模 2781 亿美元），美国科技类困境贷款规模正在上升。 💡 同时我们注意到，美国高收益信用违约互换利差过去一个月持续走高，已经接近今年早些时候美以冲突爆发时期的高点。 💡 重要的一点是，即便中长期前景维持乐观，我们的高频指标（ETF 与共同基金资金流向）显示，最近几周海外投资者流入美国组合资产的规模已经放缓，会给本土股票市场以及美元带来压力。 💡 我们同时阐述了我们看空美元的中长期观点，客户对此提出的反对意见有限，逻辑包含以下八点： 🔹 a）全球大型投资者计划进行资产再配置，降低美国资产占比； 🔹 b）市场头寸拥挤叠加科技板块风险； 🔹 c）美国双赤字规模庞大带来持续性融资需求，存在风险； 🔹 d）美联储独立性相关担忧并未消除； 🔹 e）美国经济逐步放缓，和其他主要经济体之间的增长差距收窄； 🔹 f）美国中期选举风险，民调数据偏向民主党； 🔹 g）真实资金、养老金、寿险机构等存在外汇对冲（也就是卖出美元）的潜在需求； 🔹 h）我们对离岸人民币、日元中长期升值的判断。 💡2、部分客户持有美元兑日元多头，部分客户认为本土资本回流日本的趋势并未出现变化。 💡 我们观点与之不同，我们指出美元兑日元面临下行风险，驱动逻辑包含： 🔹 a）我们对美国股票市场环境、风险偏好走弱以及资金汇回本土的担忧，近期已经出现日本投资者卖出海外组合资产的迹象； 🔹 b）外汇干预格局发生改变（即美国方面参与、行动活跃度提升）； 🔹 c）日本央行持续渐进式收紧货币政策，日本 2 年期‑10 年期收益率曲线走向平坦，会限制美元兑日元的上行空间； 🔹 d）日本寿险机构对本土债券的情绪改善，美日政策利差收窄，可能会影响寿险机构对冲比例，同时需要观察家庭部门对日本国债的中长期配置行为。 💡 我们提出做空美元兑日元策略，确信度 3/5，年末目标价位 152.50。 💡3、市场对美元兑离岸人民币观点分化，但大多数客户倾向于离岸人民币升值。 💡 并未形成统一的做空美元兑离岸人民币的共识；部分客户指出做空美元兑离岸人民币会承担负的持有成本，另外一部分客户认为行情只会贴合外汇远期的变化。 💡 我们的看法存在差异，即期汇率下行幅度实际上已经大幅超过外汇远期定价；过去一年离岸人民币相对美元升值 6.4%；过去 12 个月当中有 8 个月份年化升值区间处于 6%‑17%；按月末对比月末口径，12 个月中有 9 个月的表现跑赢外汇远期。 💡 我们的核心观点包含： 🔹 a）出口企业结汇、外汇回款的规模十分强劲； 🔹 b）几乎没有迹象显示官方会打压人民币升值；近期信号显示政策推动扩大人民币的使用与国际化，人民银行也表态汇率对出口的冲击有限； 🔹 c）国际层面存在推动人民币走强的政治压力； 🔹 d）人民币本身竞争力强，生产效率相对占优。 💡 我们给出做空美元兑离岸人民币建议，确信度 4/5，年末目标价位 6.50。 💡4、大多数客户看空印尼盾，对新台币持中性态度，倾向看多印度卢比，对韩元看多情绪最强。 i. 💡做空印尼盾是市场共识；多数客户选择做多美元兑印尼盾，而我们的推荐是做多新加坡元兑印尼盾，确信度 4/5，11 月末目标价位 14440。 💡 在负面政治与政策风险层面，市场与我们观点保持一致；风险因素包含自然资源行业监管、反腐推进、财政评级风险、印尼央行独立性。 💡 同时还存在国际收支方面的挑战：经常账户赤字、债券流入低迷、股票资金流出风险，明晟指数有可能将印尼下调至独立国家分类，会进一步加剧该风险。 ii. 💡针对印度卢比，受印度储备银行近期外汇政策公告影响，客户看多，部分客户将套息收益作为看多印度卢比的理由。 💡 我们推荐做多美元兑印度卢比，确信度 3/5，2027 年 1 月中旬目标 98.5，对应约 4% 的变动空间。 💡 我们的逻辑： 🔹 a）国际收支基本面偏弱，高油价进一步放大经常账户赤字压力； 🔹 b）人工智能变革会给印度软件顺差带来隐忧； 🔹 c）外资股票资金流出（今年至今流出 320 亿美元），外资抛售债券，原因是印度未被纳入彭博全球综合债券指数，令市场失望； 🔹 d）外汇即期储备近期下滑，印度储备银行持有大量美元兑印度卢比远期空头头寸；条件允许时，印度储备银行大概率会增加外汇储备，缩减远期敞口； 🔹 e）印度储备银行已经出台力度很大的外汇政策，但对印度卢比提振效果有限；我们宏观团队预计印度储备银行不会进一步大幅加息。 iii. 💡针对新台币以及韩元：多数客户关注二者强劲的经常账户顺差；市场对韩元看多情绪更高，外资组合资金流出最糟糕的阶段已经过去。 💡 我们认为，尽管美国股票短期前景存在不确定性，韩元依旧面临风险： 🔹 a）韩国央行通过买入外汇，限制美元兑韩元下行，近期外汇干预估算数据可以佐证； 🔹 b）如果全球科技板块出现回调，或者海力士、三星股价大幅上涨，要警惕外资卖出韩国股票带来的冲击；2026 年 9 月韩国股票外资持股规模高达 1.6 万亿美元，一旦科技股抛售，会带来巨大压力。 💡 如果韩国综合指数在海力士、三星带动下大幅上涨，韩元同样会面临多重风险： 🔹 a）再度触及个股持仓上限，基金被迫卖出韩国存储芯片股票（欧盟 UCITS 监管规定）； 🔹 b）韩国国家养老金对外投资规模会随韩国综合指数上涨而提升； 🔹 c）我们分析发现，本土股票走强之后，股票以及多策略对冲基金的美元兑韩元无本金交割远期多头对冲会增加。 💡 韩国金融账户还有其他挑战：韩国零售部门对外投资规模偏高（主要投向美国资产）；韩国对于阿拉斯加投资的态度转变，叠加特朗普相关政策风险，也需要关注。 iv. 💡除非美国科技股出现幅度更大的抛售，我们相对更看多新台币；外汇估值显示新台币显著低估，这有可能引来美国政府的外汇审查，对比近几个月升值的韩元、离岸人民币、日元，这一点尤为突出。 💡 同时，中国台湾地区不会出现韩国那种因为个股持仓上限被迫外资卖股票的情形；在对冲比例偏低的背景下，如果美元开启下行，中国台湾寿险机构有可能重启做空美元兑新台币的外汇对冲交易。 💡5、市场倾向做韩国利率收息，对香港前端利率认同度偏低。 💡 总体来看，市场对我们韩国利率下行的观点没有太多反对声音，我们持有 H27‑5 年期韩国利率互换多头，确信度 4/5。 💡 韩国综合指数近期走弱，进一步支撑韩国利率下行逻辑；年末之前韩国国债发行节奏温和、K 型分化的经济格局、韩国央行已经完成两次加息都是驱动因素。 💡 韩国央行议息会议结束之后，市场存在疑问，央行行长的表态是否比预期更为鹰派，利率收息头寸是否已经过度堆积；但多数客户认为，短期韩国综合指数才是核心驱动，需要关注 10 月 28 日海力士财报。 💡 反观香港市场，针对我们确信度最高（5/5）的 H27‑1 年期香港利率互换多头建议，客户观点分化。 💡 一部分客户认为这本质是美国利率交易，美联储依旧处在加息进程当中。 💡 另一部分客户认同香港套息交易存在机会，市场流动性宽松；但市场倾向选择前端外汇掉期点来实现该交易，而不是利率互换。 💡6、寻找印度利率收息机会，但需要观察经济增长与油价表现。 💡 印度利率是另一大讨论重点，两周前印度储备银行收紧流动性，带动印度利率大幅上行。 💡 整体来看，目前投资者在印度利率市场并未建立明显方向性头寸；市场也在探讨为什么 MIBOR 利率会从流动性盈余阶段快速收紧至流动性赤字阶段。 💡 总体而言，如果油价能够企稳，市场会更倾向利率收息交易，当前市场已经定价多次加息；但部分客户希望看到 GDP、信贷增速放缓的确切信号，或是等待 12 月印度储备银行完成再次加息之后，再开展印度利率收息交易。 💡7、市场对中国利率收息产生兴趣。 💡 中国市场虽然属于贝塔很低的市场，但利率持续下行，正在吸引市场关注；不过中国市场的讨论大部分围绕人民币展开，而非利率互换。 💡 整体交易倾向偏向利率收息，经济并未出现明确的反弹信号，人民银行政策锚正在由 7 天逆回购向隔夜利率转变。 💡 但也有部分客户认为，5 年期利率互换已经跌到 1.40% 以下，位置过低；如果错过了这波下行行情，可以等待价格反弹之后再入场。#文字观点", "publish_time": "2026-11-01 09:57", "tags": ["文字观点"]}, "post:2026-11-01T09-57:7ad283fbac22": {"id": "post:2026-11-01T09-57:7ad283fbac22", "kind": "post", "title": "2026-11-01 09:57", "source_label": "帖子正文", "excerpt": "📌📌美股市场动态：行情正在变动…… 💡 本周开局行情偏强，半导体板块出现需求回暖的积极信号（主要来自长线资金），但本周收尾阶段遭遇猛烈抛售，下跌过程中几乎没有买盘承接。💡 全周来看，资产管理人最终转为净卖出（逆转本周早些时候对科技板块的买入需求），对冲基金资金流整体多空平衡。", "content": "📌📌美股市场动态：行情正在变动…… 💡 本周开局行情偏强，半导体板块出现需求回暖的积极信号（主要来自长线资金），但本周收尾阶段遭遇猛烈抛售，下跌过程中几乎没有买盘承接。 💡 全周来看，资产管理人最终转为净卖出（逆转本周早些时候对科技板块的买入需求），对冲基金资金流整体多空平衡。 💡 不出意料，抛压集中在科技板块核心标的，不过对比过去两周，本次下跌的节奏相对有序。 💡 本轮行情波动带有系统性、自上而下驱动的特征，ETF 成交量占全市场成交比重达到约 31%，为 6 月以来最高的完整交易日水平。 💡 月末资金效应也在影响市场走势。 💡 周四至周五，消费板块相对大盘跑赢，资金出现轮动（资金从科技板块转向防御性必需消费，避险交易），叠加部分标的业绩表现较好，餐饮标的：CMG、WING、EAT，邮轮标的：NCLH、RCL，以及低配板块的回补（CROX、BOOT）。 💡 我们重点跟踪的标普关键点位：100 日均线 7614 点，以及 CTA 中期阈值 7554 点（大部分净空头头寸集中于此）。 📌📌主经纪商周度数据（截至 10 月 29 日收盘）：风险敞口｜美国市场 💡 基本面多空策略总杠杆小幅上升 0.1 个百分点，至 216.3%（处于近一年 66 分位）；美国基本面多空策略净杠杆上行 3.6 个百分点，至 47%（处于近一年 7 分位）。 💡 对冲基金四周内首次净买入美股，主要来自宏观品种的空头回补，其次是个股层面的回补。 💡 尽管科技板块是本周（截至周四）净买入最多的板块，但 10 月截至目前整体仍为大幅净卖出；大型科技股在最近 5 个交易日中有 4 个交易日录得净卖出，说明在业绩密集披露、行情剧烈波动的一周内，风险偏好并未明显修复。 📌📌盘中表现更新（美国东部时间下午 1 点） 💡 全球基本面多空策略产品下跌 1.2%（偏离均值 1.8 倍标准差），主要受贝塔行情与科技板块拖累；科技板块本月截至目前下跌 3.6%，年内收益仍为 + 9%。 💡 聚焦亚洲的基金下跌 1.2%（偏离均值 1 倍标准差），本月截至目前下跌 9.5%，年内收益仍为 + 14%。 💡 TMT 主题基金下跌 3.8%（偏离均值 2.6 倍标准差），本月截至目前下跌 12.6%，年内收益收窄至 + 5.1%。 📌📌下周看点 💡 市场对标普指数在下周五（11 月 6 日）前的隐含波动幅度预期为 1.84%。 💡 这是三季度业绩披露的最后重要一周，苹果将于周一披露业绩，是科技板块的重点标的；市场焦点将转向美国中期选举（周二，Kalshi 定价民主党横扫概率 65%）以及非农就业数据（周五）。 💡 关注季度再融资公告（周三将公布期限细节），观察发行规模与供给安排是否出现变动（市场重点关注长端，尤其 20 年期、30 年期美债供给变化）。#文字观点", "publish_time": "2026-11-01 09:57", "tags": ["文字观点"]}, "post:2026-11-01T18-24:47a6de67eb0a": {"id": "post:2026-11-01T18-24:47a6de67eb0a", "kind": "post", "title": "2026-11-01 18:24", "source_label": "帖子正文", "excerpt": "【中信组合策略|周思考】风险资产仍需等待右侧信号 本周全球风险资产继续普跌，A股跌幅尤为夸张。中东问题未缓解，美股大厂财报低预期后，滞胀交易仍在加速。", "content": "【中信组合策略|周思考】风险资产仍需等待右侧信号 本周全球风险资产继续普跌，A股跌幅尤为夸张。中东问题未缓解，美股大厂财报低预期后，滞胀交易仍在加速。 1、11月多资产月度组合上调了权益仓位，下调了有色、豆粕 1）第一大权重资产依然为【能化】，与10月持平。由于近期大类资产内部呈现更加紊乱的波动和收益变化，夏普模型的调整变得更加灵活，近几个月依然能获得连续的月度正收益。 2）短期美股的风险定价，对其他资产的风险偏好传染比较重要 VIX创4月以来新高，美股AI财报miss，把EPS正式从\"增长定价\"切换到\"现金流定价\"。 目前核心宏观三维度框架：增长、通胀、流动性，三者对现金流风险资产均是利空。11月美伊问题、美国大选、A厂上市、美国通胀数据都是重要观察点。 2、A股单资产，仍在中波垃圾时间 我们上周谈到，上上周五的大阳线并不是见底的明确信号。最重要的原因来自波动率尚未恐慌（没达到25%以上）。上周大盘波动率有所上升，来到21%附近。 创业板地板价，以时间换空间。周五，创业板再创新低，已经甚于2015年。创业板PE TTM跌至26.9，已经低于2018年，仅次于2024的最低值，为历史第二低的估值水平。 中信策略 邓宇林#文字观点", "publish_time": "2026-11-01 18:24", "tags": ["文字观点"]}, "post:2026-11-01T21-22:c94fd8528398": {"id": "post:2026-11-01T21-22:c94fd8528398", "kind": "post", "title": "2026-11-01 21:22", "source_label": "帖子正文", "excerpt": "国内重点车企10月销量跟踪 1、比亚迪10 月交付 490,168 辆，同比 +11.0%，环比 +5.7%。其中纯电 30.57 万辆（同比 +37.4%）、插混 17.74 万辆（同比 -17.2%），出口新能源汽车 17.02 万辆、占当月销量 34.7%。", "content": "国内重点车企10月销量跟踪 1、比亚迪10 月交付 490,168 辆，同比 +11.0%，环比 +5.7%。其中纯电 30.57 万辆（同比 +37.4%）、插混 17.74 万辆（同比 -17.2%），出口新能源汽车 17.02 万辆、占当月销量 34.7%。 2、新势力方面：理想 10 月交付 29,025 辆，环比 -8.8%，同比 -8.6%；蔚来 10 月交付 34,246 辆，环比 -8.5%，同比 -15.2%（蔚来品牌 18,125 辆、乐道 8,383 辆、firefly 7,738 辆）；小鹏 10 月交付 50,237 辆，环比 +21.8%，同比 +19.6%，创单月交付历史新高（海外 13,326 辆，同比 +166%）。 3、传统造车方面：吉利汽车 10 月新能源交付 214,996 辆，环比 +12.6%，同比 +20.9%，首次单月突破 20 万辆、新能源占比升至 69%（该口径含极氪，极氪 10 月交付 32,483 辆，环比 -12.7%，同比 +51.6%）。 4、其他车企方面：零跑 10 月交付 106,127 辆，环比 +0.4%，同比 +51.0%，连续 4 个月月销超 10 万辆；小米汽车 10 月交付超 50,000 辆，环比 +25.0%，同比约 +25.0%；岚图 10 月交付 13,030 辆，环比持平，同比 -24.3%；深蓝 10 月交付 32,602 辆，环比 +8.0%，同比 -11.4%；鸿蒙智行 10 月交付 33,537 辆，环比 -10.5%，同比 -50.8%；上汽通用五菱 10 月交付 99,958 辆，环比 +17.1%，同比 -7.5%。 5、重点车企合计10 月交付 115.4 万辆，环比 +7.2%，同比 +7.4%。#文字观点", "publish_time": "2026-11-01 21:22", "tags": ["文字观点"]}, "post:2026-11-01T09-55:4ad33f5d9cba": {"id": "post:2026-11-01T09-55:4ad33f5d9cba", "kind": "post", "title": "2026-11-01 09:55", "source_label": "帖子正文", "excerpt": "⭕【阳光电源】2026三季报点评：Q3业绩低于预期，主要系碳酸锂、出口退税、汇兑等影响毛利率，以及储能确收节奏及公允价值损失影响，发货仍高增预计后续将迎来单位盈利见底回升 ➡事件： 公司发布2026三季报，Q3营收、归母、扣非179.50/13.41/16.93亿元、同比-21.5%/-67.7%/", "content": "⭕【阳光电源】2026三季报点评：Q3业绩低于预期，主要系碳酸锂、出口退税、汇兑等影响毛利率，以及储能确收节奏及公允价值损失影响，发货仍高增预计后续将迎来单位盈利见底回升 ➡事件： 公司发布2026三季报，Q3营收、归母、扣非179.50/13.41/16.93亿元、同比-21.5%/-67.7%/-57.6%、环比+16.9%/-54.8%/-24.5%，扣非高于归母主要系Q3非经常性损益-3.52亿元，其中金融资产公允价值变动及处置-4.89亿元。 🚀核心观点：Q3毛利率29.4%、同比-6.5pct、环比-9.2pct，主要系：（1）出口退税下降；（2）Q3反映Q1、Q2碳酸锂价格，成本压力大；（3）Q3无关税返还；（4）汇兑损失等影响。导致储能毛利率由34%环比降至21%，单位盈利低于0.1元/Wh。但存货高增，为发出未确收占比较高所致。预计Q4将迎来储能确收高峰，同时盈利能力有望触底回升。订单高增，明年给出储能出货翻倍目标，量利有望较今年大幅改善。 ➡业绩拆分： #光伏逆变器：Q3收入66亿，出货38GW，毛利率40+%，格局稳定毛利率高，出货前三季度同比略降，#单W净利接近4分。#储能系统：Q3收入77亿，出货17GWh，确收9-10GWh，毛利率31%，环比-3pct。确收与出货相差较大与海外确收节奏有关，已反映在存货高增中。毛利率下降与碳酸锂成本高、出口退税下降、关税返还减少、汇兑损失等有关，#测算单Wh净利低于0.1元/Wh。#新能源投资开发：前三季度收入约27亿，亏损约7亿，同比大幅下滑主要因户用光伏萎缩所致。 #海外：26H1收入226.90亿元，同比-10.6%，占比73.4%，较去年同期提升15.1pct。海外收入降幅显著小于国内。 ➡其他影响项：#汇兑：前三季度汇兑损失接近10亿。#公允价值损失：接近5亿，预计主要由参与定增导致金融资产公允价值变动所致。 🚀盈利预测： 假设Q4储能确收节奏恢复，在15-16GWh左右，毛利率恢复至35%左右，盈利能力恢复至0.15元/Wh左右。全年业绩约104亿。明年考虑发货高增，保守假设确收口径增长50%，盈利能力维持在Q4水平，预计27年业绩约150亿左右。今明年估值约13X、9X，底部已现维持推荐。 --------------------#文字观点", "publish_time": "2026-11-01 09:55", "tags": ["储能系统", "测算单Wh净利低于0", "1元", "Wh", "汇兑", "公允价值损失", "文字观点"]}, "post:2026-11-01T18-22:c2c8dfc1b940": {"id": "post:2026-11-01T18-22:c2c8dfc1b940", "kind": "post", "title": "2026-11-01 18:22", "source_label": "帖子正文", "excerpt": "3Q26海外动力电池业绩追踪：松下 Panasonichttps://holdings.panasonic/content/dam/holdings/gl...3Q26业绩表现 能源业务3Q26营收141.01亿元（按照3Q26平均汇率1元人民币兑23.5372日元换算，下同），同比/环比+46.0", "content": "3Q26海外动力电池业绩追踪：松下 Panasonichttps://holdings.panasonic/content/dam/holdings/gl...3Q26业绩表现 能源业务3Q26营收141.01亿元（按照3Q26平均汇率1元人民币兑23.5372日元换算，下同），同比/环比+46.0%/+5.7%；营业利润23.62亿元，同比+54.4%、环比+35.9%；调整后营业利润24.09亿元，同比+55.6%、环比+37.0%；调整后营业利润率17.1%，同比/环比+12.6ppt/+3.9ppt。 3Q26业绩变动原因 ➡营收实现较快增长： （1）车载产品：北美工厂销量进一步提升，主要受益于堪萨斯工厂产能利用率改善，车载电池销售额同比增加443亿日元； （2）工业及消费：数据中心储能系统需求持续旺盛，相关产品销售额同比增加382亿日元。 ➡调整后营业利润同比大幅提升： （1）车载产品：北美工厂销量提升，同时受益于美国关税退税及IRA税收抵免增加，调整后营业利润同比增加391亿日元； （2）工业及消费：数据中心储能系统销售增长带动盈利提升，调整后营业利润同比增加165亿日元。 2027财年展望 ➡汽车电池：美国电动车市场逐步恢复，FY2027 Q2美国电动车销量环比增长约5%，市场需求延续恢复趋势；战略客户持续提升美国市场份额，来自战略客户的需求增长明显快于整体市场。随着堪萨斯及内华达工厂产能利用率改善，公司维持北美动力电池全年销量46GWh的指引不变，较FY2026的38.7GWh增长约19%。 ➡数据中心储能：3Q26数据中心相关业务销售额1,149亿日元，同比增长约58%，约为上年同期的1.6倍；FY2027全年销售目标5,500亿日元，同比增长约70%，约为FY2026的1.7倍。 关注亮点 ➡数据中心业务产能建设取得新进展： 墨西哥第二工厂已于2026年9月正式启动量产，第三工厂计划于FY2028启动量产；日本住之江工厂已于2026年4月开始利用现有车载电池产线向数据中心客户出货，并继续推进住之江及贝塚工厂产线转换；美国堪萨斯工厂计划导入数据中心专用电芯产线，预计FY2029实现量产。同时，公司加快北美供应链本土化，与电源供应商合作提升本地采购能力。 ➡BBU及CBU产品加速落地： 公司计划于FY2027启动采用LIC（锂离子电容器）技术的CBU（Capacitor Backup Unit）量产，并根据未来需求考虑进一步扩产；面向HVDC（高压直流）架构的BBU产品预计于FY2027内完成量产准备。 ➡IRA及美国关税影响： 3Q26能源业务调整后营业利润中计入332亿日元IRA税收抵免，归母净利润中计入413亿日元；FY2027全年预计分别计入1,330亿日元和1,660亿日元，较此前预测分别增加140亿日元和180亿日元。美国关税方面，3Q26确认关税退税147亿日元，关税支出79亿日元，合计形成68亿日元净正面影响；FY2027全年关税净影响预测由此前的-270亿日元上调至-20亿日元，较此前改善250亿日元。 ➡AI相关业务增长超预期，全年指引进一步上调： 3Q26 AI相关业务销售额886亿日元，同比增长约62%，约为上年同期的1.6倍；公司将FY2027全年销售目标由此前的3,100亿日元上调至3,600亿日元，增加500亿日元（其中约200亿日元来自汇率影响）。主要受多层电路板材料、导电性高分子电容器及超级电容器需求增长推动，公司加快苏州、广州、泰国及日本等地相关产能扩张。此外，公司预计AI基础设施相关业务FY2029销售额达到1.6万亿日元，其中Energy业务目标1万亿日元，Industry业务目标6,000亿日元。 以上均来自公开资料#文字观点", "publish_time": "2026-11-01 18:22", "tags": ["文字观点"]}, "post:2026-11-01T19-36:10adfa07b4a1": {"id": "post:2026-11-01T19-36:10adfa07b4a1", "kind": "post", "title": "2026-11-01 19:36", "source_label": "帖子正文", "excerpt": "摩根大通——全球人形机器人：汽车产业视角下的物理AI（Physical AI）进展更新 物理AI正从“demo叙事”切入“工厂部署验证”阶段，汽车产业因其制造场景、数据闭环与供应链能力，成为人形机器人最早规模化落地的试验场。当前行业处于S曲线浅坡段：整机放量慢于预期，但“运动部件+数据采集+仿真训练", "content": "摩根大通——全球人形机器人：汽车产业视角下的物理AI（Physical AI）进展更新 物理AI正从“demo叙事”切入“工厂部署验证”阶段，汽车产业因其制造场景、数据闭环与供应链能力，成为人形机器人最早规模化落地的试验场。当前行业处于S曲线浅坡段：整机放量慢于预期，但“运动部件+数据采集+仿真训练”的供应链先兑现订单与现金流。投资主线由“谁先造出机器人”转向“谁先跑通单位经济性与可复制工作流”。 一、整车厂与机器人本体：节奏分化，工业场景优先 • 特斯拉（Tesla）：Fremont产线已启动Optimus早期生产，但马斯克明确“爬坡缓慢且颠簸”，类比S曲线——受限于约一万个必须同时做对的环节。12个月内内部产量指引仅1万–2万台，外部工业客户交付目标约2027年底。AI5芯片计划2027年4月导入，算力较AI4跃升约10倍；手部灵巧性、耐久与触觉感知仍是最大硬件瓶颈。 • 丰田（Toyota）：2028年起年均投入约64.2亿美元改造工厂，全球部署40万台机器人（含15万台本体+25万台集团内），通过老工匠示范+扩散式大型行为模型（Large Behavior Model）迁移技能；物流侧测试Agility Digit。 • 宝马（BMW）：Landshut工厂构建“物理AI软件栈”（开放平台+生产数据+仿真+运动规划+示教学习），Leipzig与Spartanburg做试点，聚焦柔性、精细操作。 • 奔驰（Mercedes-Benz）+Apptronik：装配线现实落地窗口看2030–2035年；形态不局限于双足，轮式+机械臂更适合装箱、上下料、bin-picking；安全与任务适配优先。 • 本田（Honda）：东京移动展展示轮式Avatar+四指灵巧手，反向重构车身设计以适配机器人装配；线速线束安装成重点验证场景。 • 小鹏（Xpeng）：IRON目标2026年底量产、1H27交付、2H27进欧洲；自研图灵芯片、76自由度、单手21–22自由度，产线自动化率超80%。 • 三菱、奇瑞AiMOGA、Wandercraft（雷诺350台Calvin-40订单）、Humanoid（轮式+1.35bn美元投后估值A轮）同步推进。 二、供应链“卖铲人”逻辑：执行器是BOM与议价权核心 • 运动部件占人形机器人BOM约50%：旋转/直线执行器、谐波减速器、轴承、电机、扭矩传感器、丝杠共同构成价值池。 • 舍弗勒（Schaeffler）：太仓“灯塔工厂”启用（约7,500㎡），实现“机器人造机器人关节”；3Q26新增两大中国客户，全球人形订单储备升至约4亿欧元。角色从零件商升级为“系统+数据+生命周期”供应商，目标用汽车级制造把组件成本压降约30%。 • 产业闭环：自用工厂采集数据→仿真训练（NVIDIA Isaac/Omniverse）→部署验证→反哺迭代。Bosch管制造、Schaeffler管执行器、Siemens管工业验证、NVIDIA管算力与强化学习。 三、软件与数据层：Physical AI的隐藏利润池 • 训练范式从“规则编程”走向Vision-Language-Action（VLA）与示教策略（policy）。 • NEURA推出Neuron AI多模态物理AI基础模型（3D视觉+触觉+音频+语言+状态记忆），与NXAI的xLSTM补长时记忆；RoboGym把研究-训练-工业验证打通。 • Apptronik与Google DeepMind合作，数据反哺Gemini Robotics；特斯拉建Optimus Academy做self-play数据采集。 • 关键指标从“能不能走”转为Time-to-Skill（学会一项任务所需数据与时长）。 四、商业化阈值与约束 • 采用阈值：工业场景小时运营成本需压到10–12美元区间（对比人力约30美元），当前约需2台机器人等效1名工人，2030年有望收敛至1.2–1.3台。 • 真实瓶颈排序：灵巧手＞持续运行寿命＞边缘算力＞数据质量＞成本。 • 先工业（搬运/上下料/质检/装配辅助），再商业服务，最后家用。家庭场景最大但安全认证与ROI最慢。 五、投资映射与选股框架 • 早期超额收益在“可确认订单+可量产工艺”的零部件：执行器平台、谐波/行星减速、3D视觉、触觉传感、边缘计算。 • 整机厂估值需等待：外部交付、复用率、单机经济模型（按5年折旧与运维测算回收期）。 • 区域排序：中国（供应链复用+量产速度）＞美国（算力与模型）＞欧洲（精密制造与工业客户）＞日本（灵巧操作与车企闭环）。 • 风险：量产爬坡低于预期、手部/电池/热管理可靠性不足、训练数据版权与安全事故、地缘与出口管制扰动供应链。#文字观点​", "publish_time": "2026-11-01 19:36", "tags": ["文字观点​"]}, "post:2026-11-01T13-23:7666f7ea07a5": {"id": "post:2026-11-01T13-23:7666f7ea07a5", "kind": "post", "title": "2026-11-01 13:23", "source_label": "帖子正文", "excerpt": "周末舆情热度： ①机器人-特斯拉 Optimus 落地商业化试点消息发酵，海外资本持续加码人形机器人赛道；【长城邓宇亮】Open ai灵巧手：下一个爆发的方向，蚂蚁集团押注机器人“皮肤”", "content": "周末舆情热度： ①机器人-特斯拉 Optimus 落地商业化试点消息发酵，海外资本持续加码人形机器人赛道；【长城邓宇亮】Open ai灵巧手：下一个爆发的方向，蚂蚁集团押注机器人“皮肤”；（九阳股份、敏芯股份、泛亚微透、天元智能、派斯林、沈阳机床、大业股份、金太阳等） ②业绩-三季报披露末端，部分业绩超预期个股受到市场资金的关注。（青岛食品、洪通燃气、传智教育、地素时尚、九安医疗、必易微、合百集团等） ③商业航天-上海六部门发布卫星互联网行动方案，2030年在轨卫星超3000颗、核心产业规模超800亿元。（上海沪工、泛亚微透、沈阳机床、盛洋科技、阳光照明等） ④端侧AI/阿里-阿里苹果阿里正式官宣：将千问集成至Apple智能功能；（端侧AI/敏芯股份、泛亚微透、移远通信、国科微、金太阳等； 阿里/三江购物、壹网壹创、石基信息、数据港、歌尔股份、君正集团等） ⑤医药-礼来两款减肥及糖尿病药物营收分别增长65%和49%，公司市值突破1.3万亿美元；（澳洋健康、桂林三金、百花医药、万邦医药、阳普医疗、永安药业等）#文字观点", "publish_time": "2026-11-01 13:23", "tags": ["文字观点"]}, "post:2026-11-01T18-21:bd4df7d6597d": {"id": "post:2026-11-01T18-21:bd4df7d6597d", "kind": "post", "title": "2026-11-01 18:21", "source_label": "帖子正文", "excerpt": "【智造旗手|东吴计算机王紫敬】智能制造：这轮驱动是政策预期，我们在等下一个即将到来的窗口 有投资者问，最近怎么没更新观点，是不是不看好了？这里统一回应：观点没有变化，智能制造与物理AI是我们持续重点推荐的方向。", "content": "【智造旗手|东吴计算机王紫敬】智能制造：这轮驱动是政策预期，我们在等下一个即将到来的窗口 有投资者问，最近怎么没更新观点，是不是不看好了？这里统一回应：观点没有变化，智能制造与物理AI是我们持续重点推荐的方向。 本轮行情涨的是政策预期。9月全国先进制造业大会明确以新一代智能制造为主攻方向；10月20日工信部表示新一代智能制造政策措施正在研究起草；10月22日八部门印发《产业基础能力提升\"十五五\"规划》；10月23日《国家信息化\"十五五\"规划》提出发展人形机器人等具身智能技术。上海随后连发两份行动方案，明确前瞻布局物理AI、突破世界模型构建与多模态物理感知，推动8000台人形机器人进工厂。政策尚在起草，预期已经先行——这是本轮的主要推动力。 产业进展是加分项。特斯拉2026年三季度财报确认，Optimus已在弗里蒙特工厂的高产量产线上开始生产；据公开报道，GPT-6在公开的物理操作基准测试中已展现出一定的具身任务规划能力。模型具备具身能力的源头是物理世界的数据，这是我们持续看好感知层的原因。 既然驱动力在政策预期，跟踪的重点就应该放在政策窗口。方向不变：人形机器人已列入\"十五五\"六大未来产业，新一代智能制造政策仍在起草，实景实训专项行动要求2026年底形成万台级落地能力。 下一个政策窗口是我们后续跟踪的核心变量。 重点标的：敏芯股份、中控技术、海天瑞声； 建议关注：宇树科技、上纬新材、东土科技、能科科技、奥比中光、索辰科技、海康威视、科远智慧、品茗科技等。#文字观点", "publish_time": "2026-11-01 18:21", "tags": ["文字观点"]}, "post:2026-11-01T18-26:8437352355c1": {"id": "post:2026-11-01T18-26:8437352355c1", "kind": "post", "title": "2026-11-01 18:26", "source_label": "帖子正文", "excerpt": "【国盛计算机臻选】26Q3持仓分析：机构筹码仍处低位，估值性价比凸显 #筹码：26Q3占净值比1.07%、机构筹码处于低位。持仓占比：2026Q3信息传输、软件和信息技术服务业占净值比1.07%，2026Q2为1.23%，环比-0.16pct", "content": "【国盛计算机臻选】26Q3持仓分析：机构筹码仍处低位，估值性价比凸显 #筹码：26Q3占净值比1.07%、机构筹码处于低位。持仓占比：2026Q3信息传输、软件和信息技术服务业占净值比1.07%，2026Q2为1.23%，环比-0.16pct；占股票投资市值比5.28%，2026Q2为5.45%，环比下降0.17pct，处于近五年以来的较低位置。标准配置比例：2026Q3为5.54%，筹码配置集中度进一步走低，较2026Q2的5.73%环比下行0.19pct。重仓持股市值：2026Q3与Q2相比网宿科技、三六零、奔图科技、拓维信息进入重仓持股总市值的前二十名。 #估值：历史分位回落至30.31%、配置性价比凸显。板块估值：当前计算机板块估值已回落至近五年偏低区间，估值历史分位数下行至30.31%，回落至中位数下方，安全边际逐步显现。涨跌幅：本周申万计算机指数累积跌幅10.85%，跑输沪深300；近三月，申万计算机指数回调10.64%，跑赢沪深300的-12.40%。我们认为，伴随宏观经济环境稳步修复，AI产业应用持续渗透，有望推动板块整体盈利中枢持续上移，中长期估值性价比进一步凸显。#建议关注：AI算力：1）GPU：海光信息、寒武纪、天数智芯、壁仞科技、摩尔线程、沐曦股份；2）服务器：中科曙光、华勤技术、紫光股份、浪潮信息；3）租赁：杰创智能、协创数据、宏景科技、东阳光； AI大模型：智谱、Minimax；AI应用：1）B端应用：金蝶国际、中控技术、金山办公、合合信息；2）物理AI：仙工智能、索辰科技、海康威视、大华股份；3）AI4S：迪安诊断、英矽智能；4）AI金融：同花顺、东方财富、指南针； AI供电：杰瑞股份、冰轮环境、东方电气、中国动力、科远智慧； 智驾：德赛西威、万马科技、中科创达、黑芝麻智能； 信创：达梦数据、龙芯中科、奔图科技、润和软件、中国软件。 风险提示：技术迭代不及预期风险；经济下行超预期风险；行业竞争加剧风险。 联系人：孙行臻/徐瀚/李纯瑶/王心悦/夏宇扬#文字观点", "publish_time": "2026-11-01 18:26", "tags": ["建议关注", "文字观点"]}, "post:2026-11-01T09-54:5e0f25deafd0": {"id": "post:2026-11-01T09-54:5e0f25deafd0", "kind": "post", "title": "2026-11-01 09:54", "source_label": "帖子正文", "excerpt": "浙江荣泰＆鼎胜新材＆骄成超声2026年三季报业绩点评 #浙江荣泰：主业维持高增长，机器人业务稳定推进 #业绩符合市场预期。公司26Q1-3营收14.6亿元，同52%，归母净利2.5亿元，同21%，扣非净利2.4亿元，同27%，毛利率35.4%，同-1pct", "content": "浙江荣泰＆鼎胜新材＆骄成超声2026年三季报业绩点评 #浙江荣泰：主业维持高增长，机器人业务稳定推进 #业绩符合市场预期。公司26Q1-3营收14.6亿元，同52%，归母净利2.5亿元，同21%，扣非净利2.4亿元，同27%，毛利率35.4%，同-1pct；其中26Q3营收5.6亿元，同环比45%/8%，归母净利0.9亿元，同环比19%/21%，扣非净利0.9亿元，同环比21%/18%，毛利率33.5%，同环比-5/-3pct。 #大客户放量+欧洲销量亮眼、新能源产品维持高增长。公司Q3收入5.6亿元，同增45%，大客户销量恢复叠加新客户放量，Q3收入维持同比高增速，Q3毛利率33.5%环比略降，我们预计主要系项目确认节奏影响；我们预计后续Stellatis、丰田等车企定点逐步起量，预计27年云母业务收入仍可维持30%+增长。此外，公司泰国和墨西哥两个新生产基地目前正在有序推进建设中，以便对接欧洲和北美客户。后续公司将进一步拓展新型轻量化安全结构件等非云母产品，贡献后续增长点。 #机器人项目+客户持续兑现、毛利率亮眼。当前上海工厂已开始供货，Q3机器人业务收入预计进一步增长，公司泰国工厂产能爬坡中，我们预计公司年底泰国周产提升至1000-2000套，满足海外大客户订单需求；公司在大丝杆、微齿等领域均有突破，大丝杠型号预计27年进一步增加，且与伟创于泰国成立合资公司，布局机电一体化组件等，产品矩阵进一步扩展。公司机器人业务战略清晰，项目持续兑现，国内外客户均拓展顺利，泰国工厂26年可贡献出货，美国工厂预计27年投产，公司后续盈利弹性可观。 #费用率明显提升、经营性现金流健康。公司26Q1-3期间费用2亿元，同75%，费用率14%，同2pct，其中Q3期间费用1亿元，同环比34%/-18%，费用率12%，同环比-1/-4pct；26Q1-3经营性净现金流3.5亿元，同100%，其中Q3经营性现金流0.9亿元，同环比35%/-46%；26Q1-3资本开支2亿元，同30.5%，其中Q3资本开支0.8亿元，同环比0%/15%；26Q3末存货4.6亿元，较年初22%。 #投资建议：预计26-28年归母净利润3.7/5.5/9.0亿元，同比+31%/+51%/+63%，对应PE为75/50/31倍，维持“买入”评级。 风险提示：行业竞争加剧。 #鼎胜新材：经营性单吨净利环比维持，业绩基本符合市场预期 #业绩基本符合市场预期。公司26Q1-3营收230.2亿元，同17%，归母净利7.1亿元，同131%，扣非净利6.9亿元，同138%，毛利率10.8%，同2pct；其中26Q3营收75.5亿元，同环比20%/-8%，归母净利2.3亿元，同环比93%/-20%，扣非净利2.2亿元，同环比89%/-20%，毛利率9.9%，同环比2/-1pct，公司受海外工厂亏损影响0.5亿+业绩环比下滑，若加回，公司利润2.8亿+，环比持平，基本符合市场预期。 #公司满产满销、出货同比高增。我们预计26Q1-3公司锂电铝箔出货19万吨+，其中公司Q3出货接近7万吨，同环比+23%/6%，其中涂炭箔出货占比提升至25%，公司10月起新增产能逐步落地排产提升至2.7万吨，预计Q4出货可环增10%，全年出货27万吨，同增30%，27年出货可维持30%+增长至35-40万吨，其中涂炭箔泰国及镇江新增产能投产，预计出货12万吨+，占比提升至30%+。 #Q3锂电箔经营性利润维持稳定。我们测算公司Q3单吨净利接近0.35万/吨，环比略降，主要系铝箔上涨库存收益减少所致，经营性利润基本不变，考虑后续涂炭箔进一步提升，公司单吨净利有望进一步提升至0.35万/吨+。此外Q3传统铝箔为淡季，出货17万吨环比下滑10%+，产能利用率下降导致单吨环比下降至0.01-0.02万，且公司海外工厂Q3亏损0.5亿左右，导致传统箔业务亏损。 #存货水平稳健、资本开支小幅下滑。公司26Q1-3期间费用16亿元，同24%，费用率7%，同0pct，其中Q3期间费用5亿元，同环比17%/-10%，费用率7%，同环比0/0pct；26Q1-3经营性净现金流5.3亿元，同45%，其中Q3经营性现金流-2.1亿元，同环比-336%/-126%；26Q1-3资本开支3.1亿元，同-15.2%，其中Q3资本开支1.4亿元，同环比-38%/-6%；26Q3末存货45.8亿元，较年初10%。 #投资建议：预计公司26-28年净利润9.9/13.2/16.2亿元，同比+94%/+32%/+23%，对应PE为13/10/8倍，给予27年15倍估值，目标价21.3元，维持“买入”评级。 风险提示：销量不及预期，竞争加剧。 #骄成超声：Q3业绩符合预期，半导体订单持续突破 #Q3业绩符合预期。公司26年Q1-3营收7.4亿元，同增42%，归母净利润1.6亿元，同增66%，扣非净利润1.3亿元，同增68%，毛利率62.5%，同减2.5pct，归母净利率21.2%，同增3.1pct；其中Q3营收2.9亿元，同环比+47%/+17%，归母净利润0.5亿元，同环比+48%/+1%，扣非净利润0.5亿元，同环比+67%/+22%，毛利率60.3%，同环比-4.4/-1.3pct，归母净利率18.3%，同环比+0.1/-2.9pct。 #设备+耗材业务增长稳健、强化半导体领域布局。根据我们测算，Q3设备+耗材端收入1.6亿元，占比55%，预计26年设备端增长50%，耗材端增长30%，贡献收入7亿元；Q3半导体+线束收入近1亿元，占比35%，预计26年贡献收入3-3.5亿元，同增65%。公司向特定对象发行A股股票已获中国证监会同意注册，通过定增募投13.44亿元强化半导体、功率超声产能与研发布局，依托技术平台优势切入航空航天、医疗等新领域培育新增量。 #先进封装领域持续拓展、获头部客户多次复购订单。在先进封装领域，公司推出覆盖晶圆级Wafer400系列、芯片级CDS600系列、面板级PLP600系列的全档位超声波扫描检测系统(C-SAM/SAT)，同步拓展AI服务器液冷板多探头、相控阵超声检测方案。客户进展方面，公司先进超扫设备已获合肥、武汉客户多台复购订单，我们预计26年出货超10台，27年实现翻倍以上增长。合计看，国内先进封装市场空间超100亿，公司竞争优势领先，后续订单有望持续落地，开启第二增长曲线。 #Q3费用率持续下降、经营性现金流转正。公司26年Q1-3期间费用2.8亿元，同增20%，费用率37.5%，同-6.9pct，其中Q3期间费用1亿元，同环比+17%/+6%，费用率33.6%，同环比-8.5/-3.5pct；26年Q1-3经营性净现金流0.8亿元，同增152%，其中Q3经营性现金流0.5亿元，同比+362%，环比转正；26年Q1-3资本开支1.8亿元，同增329%，其中Q3资本开支0.3亿元，同环比+102%/-72%；Q3末合同负债1.8亿元，较Q2末增长2%，Q3末存货5.8亿元，较Q2末增长9%。 #投资建议：预计26-28年归母净利润2.1/4.0/5.6亿元，同增77%/94%/40%，对应PE为55/28/20倍，维持“买入”评级。 风险提示：市场竞争加剧风险。#文字观点", "publish_time": "2026-11-01 09:54", "tags": ["文字观点"]}, "post:2026-11-01T19-35:4607de2ca4cb": {"id": "post:2026-11-01T19-35:4607de2ca4cb", "kind": "post", "title": "2026-11-01 19:35", "source_label": "帖子正文", "excerpt": "摩根大通——中国房地产：华发事件正在考验市场对“国企刚兑”的信仰 一、事件驱动与核心判断 2026年10月26日，彭博披露珠海华发集团（珠海市国资委持股约93.5%、广东省财政厅持股约6.5%）正与债权人磋商部分债务延付及降息，且两笔信托产品出现阶段性逾期；虽随后对部分逾期产品完成兑付，但信用溢出效", "content": "摩根大通——中国房地产：华发事件正在考验市场对“国企刚兑”的信仰 一、事件驱动与核心判断 2026年10月26日，彭博披露珠海华发集团（珠海市国资委持股约93.5%、广东省财政厅持股约6.5%）正与债权人磋商部分债务延付及降息，且两笔信托产品出现阶段性逾期；虽随后对部分逾期产品完成兑付，但信用溢出效应已经形成。华发事件并非简单的个体流动性冲击，而是首次系统性动摇“地方国企不会违约”的市场预设：国企信用的底层逻辑，从来不是资产负债表本身，而是“属地政府兜底能力+政治意愿”的期权价值。 摩根大通做空逻辑链条清晰： • 国企分化重构：央企（central SOE）公开债刚兑概率仍高；地方国企（local SOE），尤其低能级城市、高杠杆、非核心平台，流动性噪声将常态化。 • 资产负债表真相：在筛选的45家国企开发商中，22家（近49%）触及“三条红线”中的两条或三条，违规高度集中于中小市值与地方国企；大盘央企（中海、华润置地、保利、招商蛇口）仍全合规。 • 华发性质定性：非资不抵债，而是期限错配+非标挤兑。底线情景是“公开债不违约、非标可展期”，但估值锚被重定价。 二、股权策略：从“国企β”切向“央企α+现金流护城河” • 超配（OW）：华润置地（1109.HK）、中国海外发展（0688.HK）——强资产负债表、母公司注入与销售回款能力、分红韧性。 • 中性（N）：龙湖、新城、金茂、建发国际、绿城——龙湖靠经营性物业现金流与偿债节奏获得相对收益，但私企标签仍受压。 • 回避高杠杆中小地方国企：华发股份及类似“集团输血型”上市平台，短期受情绪与质押/担保链冲击，需等待珠海国资化债路径清晰。 三、信用与固收视角：高收益地产债重新定价 华发离岸人民币债本周平均下跌约54点，6%永续债单周跌65点至34元附近；情绪传染至绿城2028、龙湖曲线（跌4-8点），但央企IG（中海、华润）几乎零波动。 • 龙湖曲线获摩根大通优选（OW）：正自由现金流、可动用现金超130亿元，2027/28每年仅60-70亿元到期，抛售后2028年债收益率约15.4%，风险收益比占优。 • 绿城、金茂信用底较稳：绿城并表中交集团、账面现金580亿元；金茂背靠中国中化，2027-28到期规模可控。 • 关键区分：公开债（标准化、有舆情底线） vs 非标/信托（可展期、可减息、不触发交叉违约）。 四、“三条红线”筛查结论 红线定义：扣预负债率\u003c70%、净负债率\u003c100%、现金短债比>1倍。 • 合规主力：央企龙头+一线城市国资（华润、中海、保利、招商、越秀边缘达标）。 • 双/三红线违约组：华发集团（净负债率约200%、现金短债比0.36x）、华发股份（两红线）、首开、城建、信达地产、华侨城、京投、光明、金融街等——多为北京/上海/珠海/厦门非核心扩表主体。 • 含义：地方国企“红档”不是新风险，而是被华发事件照亮的旧风险。 五、宏观与化债推演 • 基准情景：属地政府通过资产腾挪（华发铧创股权转格力/交控、回笼45.7亿元）、银行展期、非标重组，保公开债兑付，避免“永煤式”区域信用冲击。 • 压力情景：若珠海一般预算收入（\u003c500亿元/年）无法覆盖华发一年内近1700亿元到期敞口，风险从企业资产负债表平移至城市信用账本，接盘方自身融资空间被消耗。 • 对板块：预售退坡+交付压力下，2027年开发业务仍弱；有租管/IP现金流的开发商（龙湖、华润万象生活）获得信用溢价。 六、投资结论 • 股票端：“国企信仰”从标签溢价转向基本面筛选，只买央企龙头+高分红+低杠杆，回避“集团担保依赖型”地方国企。 • 债券端：做多龙湖中久期、做空弱资质地方国企非标溢出，IG央企利差具备避险配置价值。 • 交易触发点：华发12月离岸债兑付、三季报现金流、珠海国资后续资产划转与银行展期落地。#文字观点​", "publish_time": "2026-11-01 19:35", "tags": ["文字观点​"]}, "post:2026-11-01T18-26:1648101da842": {"id": "post:2026-11-01T18-26:1648101da842", "kind": "post", "title": "2026-11-01 18:26", "source_label": "帖子正文", "excerpt": "野村——阳光电源（300274.SZ）：三季报净利同比降68%，储能毛利率（GPM）承压 核心结论：维持“中性（Neutral）”评级，目标价由120元下调至63元（较2026年10月30日收盘价65.29元隐含约-3.5%空间）。三季报呈现“发货强、确收滞、毛利塌”组合——储能出货高增但确收仅半数", "content": "野村——阳光电源（300274.SZ）：三季报净利同比降68%，储能毛利率（GPM）承压 核心结论：维持“中性（Neutral）”评级，目标价由120元下调至63元（较2026年10月30日收盘价65.29元隐含约-3.5%空间）。三季报呈现“发货强、确收滞、毛利塌”组合——储能出货高增但确收仅半数，滞后电芯成本、出口退税率下调、消费税与汇兑运费共同挤压盈利；2027年合规成本进一步压制毛利率修复。 一、三季报核心数据 2026年三季度单季营收179.5亿元（同比-21.5%、环比+17%）。储能发货17GWh，但受海外项目“发货至确收约6个月”节奏影响，仅确认9-10GWh，对应储能收入77亿元（环比+14%）。综合毛利率由二季度38.6%降至29.4%；储能毛利率由34%骤降至21%。归母净利润13.4亿元（同比-67.7%、环比-55%），扣非净利16.9亿元；利润受金融资产公允价值损失4.89亿元及期间费用率抬至16.4%拖累。 二、毛利率塌方：五重成本叠加 储能毛利收缩主因并非需求失效，而是成本端滞后传导： 1. 上半年高价电芯库存进入确收成本； 2. 电池出口退税率自9%降至6%； 3. 9月1日起消费税开征； 4. 欧元/美元走弱带来汇兑损失； 5. 海外运费上行。 三、四季度确收补量，但2027合规成本刚性 管理层指引四季度储能发货约25GWh，2026全年发货超60GWh；2027年全球储能需求增速预期>30%，国内光伏装机持平略增。价格端已企稳，锂盐回落至8万元/吨附近，但铜铝等辅料仍涨。2027年结构性压制仍在：1月1日起电池出口退税取消，9月起消费税由现行档上修至4%；波兰工厂供给成本较国内高12%-18%；美国FCC重认证与部件重构、欧盟合规要求自2026年8月16日抬升，跨欧美合规支出系统性上行。 四、盈利预测与估值重订 下调2026/2027年EPS至4.18/5.24元（原7.25/8.78元），反映高成本电芯、税改传导与合规费用。目标价63元基于2027年12倍PE（原14倍，历史均值19倍减0.5倍标准差），对应2026-2028年PE为15.6/12.5/11.2倍。当前股价已交易于13倍2027年PE，中性评级本质是对“出货高增但利润率中枢下移”的重新定价。 五、业务结构推演 逆变器：毛利率守稳40%+，格局稳定，海外渠道溢价仍在。 储能：量增确定，但单位经济模型（unit economics）受税与合规侵蚀，毛利率修复慢于预期。 电站/EPC：规模收缩，费用摊薄弱化。 新曲线：AIDC（人工智能数据中心）储能、固态变压器（SST）提供期权，但2027尚难抵毛利压力。 六、风险收益框架 上行：数据中心储能放量超预期；锂价稳定带动储能毛利修复；海外提价顺利传导。 下行：储能政策继续收紧；大型电站需求软化；欧美合规与本地化成本超预期；价格战重启。#文字观点", "publish_time": "2026-11-01 18:26", "tags": ["文字观点"]}, "post:2026-11-01T18-32:2f77df574e02": {"id": "post:2026-11-01T18-32:2f77df574e02", "kind": "post", "title": "2026-11-01 18:32", "source_label": "帖子正文", "excerpt": "【机器人｜又一全球科技巨头下场，产业趋势愈加清晰，重视具身智能历史性产业拐点！】 据路透社11月1日报道，Meta携手中国企业傅利叶智能研发人形机器人Max，并已启动第二代产品开发。", "content": "【机器人｜又一全球科技巨头下场，产业趋势愈加清晰，重视具身智能历史性产业拐点！】 据路透社11月1日报道，Meta携手中国企业傅利叶智能研发人形机器人Max，并已启动第二代产品开发。 我们认为，此次合作的意义不止于一款机器人原型的研发，更在于全球头部科技企业对具身智能战略价值的进一步确认。机器人逐步上升为下一代AI产业竞争的战略制高点。 全球视角看，AI巨头已形成高度一致的战略布局方向。 海外，特斯拉持续推进Optimus，英伟达构建Isaac GR00T物理AI生态，谷歌迭代Gemini Robotics，如今Meta正式加入人形机器人本体研发阵营。国内，字节跳动加速具身智能团队扩张，布局机器人本体、灵巧手及操作模型；腾讯推出Tairos具身智能平台，阿里持续迭代RynnBrain，华为构建CloudRobo开发平台，小米、小鹏推进机器人本体研发与产业化。 我们认为，当前机器人产业最值得重视的边际变化，是全球AI巨头正在由模型竞争向物理AI入口竞争延伸。 AI产业的下一阶段，不再局限于数字世界的内容生成与认知推理，而是向真实物理世界的感知、决策与执行持续拓展。具身智能有望成为大模型能力释放的重要终端载体，机器人则有望成为继智能手机、新能源汽车之后的新一代战略级智能硬件。核心判断：#2026年有望成为机器人产业从主题预期向产业兑现过渡的重要转折窗口。 投资层面，重视机器人板块由事件驱动向产业趋势驱动切换的可能性，重点关注物理AI数据基础设施与OpenAI机器人产业链的增量机会。 一方面，真实世界高质量交互数据正成为制约具身智能模型泛化的关键瓶颈，真机数采、EGO/UMI、灵巧手多模态数据及场景化训练平台有望率先受益，尤其重视已实现数采项目落地、数万小时有效数据积累及数据采购订单突破的企业；另一方面，重点跟踪OpenAI机器人产业链进展，关注机器人视觉感知、高端光学镜头及核心硬件环节，尤其是具备海外头部客户基础和潜在新项目导入机会的细分龙头。 物理AI数据资产的稀缺性与O链的卡位，有望成为下一阶段市场挖掘的重要方向，相关细分领域的产业成长预期与主题交易弹性值得重视。#开普云#天奇股份#力鼎光电 机器人不是AI行情的简单延伸，而是AI走向物理世界的关键产业载体。我们看好具身智能产业中长期发展方向，重视机器人板块产业逻辑强化带来的价值重估机会！ 风险提示：机器人技术迭代、规模化量产及商业化落地进度可能不及预期#文字观点", "publish_time": "2026-11-01 18:32", "tags": ["文字观点"]}, "post:2026-11-01T18-23:6b8af04fb4f8": {"id": "post:2026-11-01T18-23:6b8af04fb4f8", "kind": "post", "title": "2026-11-01 18:23", "source_label": "帖子正文", "excerpt": "麦格米特：短期投入以确保更强竞争力，AI电源进入订单与交付指数型增长区间！#26Q3业绩承压并非AI电源需求转弱，而是主动投入加码、成本传导滞后及汇率波动等因素共同作用的结果。", "content": "麦格米特：短期投入以确保更强竞争力，AI电源进入订单与交付指数型增长区间！ #26Q3业绩承压并非AI电源需求转弱，而是主动投入加码、成本传导滞后及汇率波动等因素共同作用的结果。 1）收入结构仍在爬坡。当前AI电源收入增速显著领先其他业务；前期供应链采购涨价逐步传导至成本端，而公司向客户顺价存在一定时滞，导致毛利率短期承压。 2）战略投入明显前置。公司正处于抢占AI电源行业格局的关键窗口期，26Q3研发费用约3.6亿元，同比+33%。同时，公司持续扩充AI团队、建设产线，定制开发、客户验证和产能储备均形成较大的前置成本。 3）阶段性扰动进一步压低利润。随着备货及应收账款规模扩大，公司资产减值计提增加；叠加汇兑损失及部分投资项目收益转负，进一步拖累了当期利润表现。 #订单端持续释放积极信号，海外AI业务进入多点开花阶段。GB300相关产品持续爬坡，并不断承接新订单；Rubin平台第一代PSU已开发完成、开始交货并投入使用，验证进度加快，且已取得规模订单；#面向VeraRubin平台的1U液冷电源(美国OCP大会获得独家演讲机会)亦已斩获订单，待进入交付期。目前AI业务在手未发货订单较多，在谈预测订单规模更大。随着客户覆盖、产品验证、订单落地和批量发货持续推进，公司海外AI业务的增长路径正逐步清晰。 #全链路平台型能力逐步成型，成长不再依赖少数单品。公司供电产品已覆盖从35kV高压侧到GPU附近0.8V供电环节：柜内拥有33kW、110kW PSU及5.5kW CRPS液冷电源，并覆盖DCDC、逆变器、BBU和超级电容等配套产品；柜外800V HVDC Power Rack已在中美两地同步送测且有明确订单，SST模块已经展出，整机及10kV/35kV产品持续推进，#明年SST会有销售；板载端进一步向二次、三次电源及芯片末端供电延伸(外延进一步拓展垂直供电)。公司正由单一产品供应商向数据中心供电系统方案商升级，产品矩阵与客户覆盖共同打开成长空间。 #投资建议：短期利润承压更多是订单放量前的投入与成本错配。麦格米特正在向全球AI算力基础设施核心供应商跃迁，2027年将是重要的验证节点，订单转化、Rubin放量及差异化产品交付值得重点跟踪。建议重点关注！#文字观点", "publish_time": "2026-11-01 18:23", "tags": ["明年SST会有销售", "文字观点"]}, "post:2026-11-01T21-23:8223c71bbcd2": {"id": "post:2026-11-01T21-23:8223c71bbcd2", "kind": "post", "title": "2026-11-01 21:23", "source_label": "帖子正文", "excerpt": "3Q26台湾电源业绩追踪：光宝LiteOn3Q26业绩表现： ➡️3Q26实现营业收入574.46亿新台币，约合人民币121.54亿元（按照3Q26汇率1:4.73换算，下同），同比+28%、环比+9%；税后净利润74.29亿新台币，约合人民币15.72亿元，同比+60%、环比+4%，创单季历史新高", "content": "3Q26台湾电源业绩追踪：光宝LiteOn3Q26业绩表现： ➡️3Q26实现营业收入574.46亿新台币，约合人民币121.54亿元（按照3Q26汇率1:4.73换算，下同），同比+28%、环比+9%；税后净利润74.29亿新台币，约合人民币15.72亿元，同比+60%、环比+4%，创单季历史新高。3Q26营业毛利率25.9%，环比-1.3ppts；营业利润率15.1%，环比-0.5ppts。 ➡️云端及物联网部门实现营收337.53亿新台币，约合人民币71.41亿元，同比+57%、环比+17%，占总营收59%，环比+4ppts；营业利润71.13亿新台币，同比+114%、环比+2%，营业利润率21.1%，环比-2.9ppts。业绩变动原因： ➡️营收增长： 受益于新一代AI数据中心需求强劲，当前AI相关收入占总营收已超30% ➡️盈利能力维持较高水平： 2Q26部分1Q递延订单集中确认，毛利率阶段性偏高；3Q26毛利率虽环比回落，但不存在明显一次性收益，且高于1H26的24.7%，公司预计2H26整体毛利率高于1H26。4Q26及2027年展望： ➡️公司预计4Q26云端电源业务实现同比、环比双增长，2027年受益于8kW以上PSU、高功率Power Shelf及800V Power Rack出货，产品ASP有望持续提升，若Power Rack按计划于1Q27启动交付，AI服务器电源业务有望延续约70%的同比增长，BBU业务公司预计增长30%以上。2027年AI相关收入占比有望进一步提升至40%–50%。其他关注要点： （1）AI电源与液冷产品 ➡️50V电源系统： ASIC平台8.5kW PSU及BBU已进入量产；Rubin平台110kW Power Shelf、AMD Helios 42英寸Power Shelf公司预计4Q26持续扩大量产。 ➡️800V Power Rack：8月底完成首批产品送样，11月计划第二批送样进行系统整合验证，公司预计1Q27正式出货，具体规模取决于客户部署进度。产品方案由此前660kW提升至880kW，另有客户采用1.5MW方案。 ➡️DC/DC Brick：收购Epic后已于OCP展示全系列800V DC/DC Brick产品，目前进入CSP客户验证阶段，公司预计3Q27开始贡献收入；公司预计潜在年市场规模约300亿新台币。 ➡️CDU：面向Enterprise客户的120kW CDU于3Q26正式量产交付，公司预计4Q26进一步放量；下一代220kW CDU进入设计阶段，10月OCP展示2.6MW级CDU。 （3）全球产能扩张 ➡️2026年资本支出规划由180亿元上调至197亿新台币，越南广宁新厂计划2026年11月开幕，高雄二期公司预计12月取得使用执照，两座新厂投产后中国大陆以外产能有望接近翻倍；美国德州McKinney工厂公司预计2Q27正式运营，进一步强化北美本地交付能力。 （4）下游项目建设及供应链情况 ➡️数据中心建设： 北美AIDC电力供应仍是主要瓶颈，1Q26受缺电影响拉货偏弱，2Q改善后需求快速反弹，3Q部分项目再次放缓，公司预计4Q拉货有所改善。当前CSP资本开支未见明显下修，2027年扩张预期进一步增强，短期建设扰动不改长期增长趋势。 ➡️供应链缺料： PCB、半导体及高压电容等关键物料供应仍偏紧，部分半导体交期超过一年，PCB交期延长至3–6个月。公司通过提前备货及长期协议锁定产能，基本能够满足4Q客户拉货；新平台仍可能受零部件缺料、系统验证及安规认证影响，但目前客户尚未通知推迟产品送样及交付计#文字观点", "publish_time": "2026-11-01 21:23", "tags": ["文字观点"]}, "post:2026-11-01T11-26:51ec97c7e7f6": {"id": "post:2026-11-01T11-26:51ec97c7e7f6", "kind": "post", "title": "2026-11-01 11:26", "source_label": "帖子正文", "excerpt": "汇报2❗【天风电新】科泰电源再更新：海外占比抬升+费用摊薄，Q3净利率8%确认利润拐点-1101 ——————————— #核心观点：26Q3单季归母净利润9298万元、同比+556%、环比+164%，归母净利率8.0%（同比+5.1pct、环比+4.0pct），利润拐点确认。拐点由双轮驱动： 1）", "content": "汇报2❗【天风电新】科泰电源再更新：海外占比抬升+费用摊薄，Q3净利率8%确认利润拐点-1101 ——————————— #核心观点：26Q3单季归母净利润9298万元、同比+556%、环比+164%，归母净利率8.0%（同比+5.1pct、环比+4.0pct），利润拐点确认。 拐点由双轮驱动： 1）海外收入占比抬升带来的收入与盈利能力双升； 2）前期海外认证/新品研发的集中投入进入摊薄期，叠加收入翻倍后的规模效应，费用率下降对净利率形成显著增益。 #【往明后年看北美放量有望推动毛利率/净利率在现有基础上进一步上行，利润增长有望持续跑赢收入】。 🌼驱动一（本质）：海外占比抬升×海外高毛利，盈利中枢系统性上移。 25年海外收入1.68亿元、占比9.55%；26H1外销收入1.78亿元（已超25全年），外销毛利率22.79% vs 内销12.49%。 柴发机组在海外属认证壁垒型市场、盈利水平显著高于国内，海外占比每抬升一段，综合毛利率和净利率中枢就上移一档。Q3毛利率环比+3.5pct至16.2%，即体现海外交付放量，本轮净利率上行具备结构性而非周期性特征。 🌼驱动二（增益）：费用摊薄同步兑现，放大净利率弹性。 Q3单季期间费用率6.72%，同比-4.54pct、较H1的8.81%下降2.09pct；研发费率由H1的4.03%回落至2.40%（单季研发2809万元，低于Q2的4832万元）。此前高额研发费用主要投向海外认证与新品开发，属前置性投入，认证落地后进入收获摊薄期； 叠加租赁厂房为主的轻资产模式（总资产50.55亿、固定资产仅0.93亿），收入翻倍后固定成本摊薄持续释放。同时Q3信用减值净转回147万元（H1净计提1874万元），坏账压力反向。 🌼往后看：北美是下一级火箭，盈利能力有望在现有基础上继续上行。 CE、UL认证已取得，c-UL、CSA推进中；马来西亚子公司落地产能，印尼/马来西亚/泰国服务网点建成。9月初北美AI服务商大面积停机事件强化长时间柴发备电刚需，北美项目毛利率有望显著高于东南亚，27-28年集中交付将推动净利率在8.0%的基础上继续抬升。 🌼#前瞻验证：Q3末合同负债11亿元、较年初+290%、单季再增5亿元。存货24.47亿元系订单备货；前三季度经营现金流1.41亿元、同比+186%，收现比124%。 🌼投资建议： #Q3单季净利率已达8%、高于我们此前对27年6%的假设。预计27/28年收入80/120亿元、按净利率8%对应6.4/9.4亿元净利，北美放量下存在上修空间。#给予27年15X PE、目标市值96亿元，向上空间50%+，维持重点推荐。 ——————————— 欢迎交流：孙潇雅/高鑫#文字观点​", "publish_time": "2026-11-01 11:26", "tags": ["文字观点​"]}, "post:2026-11-01T18-38:c16737196003": {"id": "post:2026-11-01T18-38:c16737196003", "kind": "post", "title": "2026-11-01 18:38", "source_label": "帖子正文", "excerpt": "【中信电池】2026Q3电新行业基金持仓分析#整体持仓：历史罕见的低配电力设备与新能源基金重仓规模1814亿元，环比-26.3%；占基金持仓规模的5.36%，大幅低配，电新行业连续连个季度低配，历史罕见#重仓个股情况：基金持仓规模前五：宁德时代、中国动力、阳光电源、宏发股份、亿纬锂能，其中宁德时代和", "content": "【中信电池】2026Q3电新行业基金持仓分析#整体持仓：历史罕见的低配电力设备与新能源基金重仓规模1814亿元，环比-26.3%；占基金持仓规模的5.36%，大幅低配，电新行业连续连个季度低配，历史罕见#重仓个股情况：基金持仓规模前五：宁德时代、中国动力、阳光电源、宏发股份、亿纬锂能，其中宁德时代和阳光电源同时也是公募基金减持规模前二，中国动力是公募基金增持规模第一 基金持仓占流通盘比例前五：新雷能、蔚蓝锂芯、冰轮环境、爱旭股份、儒竞科技，其中冰轮环境同时也是公募基金减持规模第四 #筹码结构：电力设备↑，锂电储能液冷↓，风格大幅切换 🟥增持规模前五：中国动力、国电南瑞、南网科技、科士达、平高电气 🟥持仓占流通盘比例增加前五：科士达、新雷能、儒竞科技、新风光、中国动力 🟩减持规模前五：宁德时代、阳光电源、鹏辉能源、冰轮环境、德业股份 🟩持仓占流通盘比例减少前五：鹏辉能源、锦浪科技、冰轮环境、艾罗能源、固德威#投资建议：我们认为锂电及储能行业经历明显超额下跌，三季报、去库存、消费税等利空反映较为充分，单从筹码结构层面看有很大反弹空间，叠加碳酸锂跌至~9w，跌幅足以改善储能经济性、对冲消费税影响，继续看好27年锂电行业25~30%增速，看好锂电及储能板块估值修复欢迎交流，中信证券电池与能源管理团队~#文字观点", "publish_time": "2026-11-01 18:38", "tags": ["整体持仓", "历史罕见的低配", "重仓个股情况", "投资建议", "文字观点"]}, "post:2026-11-01T18-23:374e731ec77b": {"id": "post:2026-11-01T18-23:374e731ec77b", "kind": "post", "title": "2026-11-01 18:23", "source_label": "帖子正文", "excerpt": "核心观点：#长期来看，基于目前全球航运船队老龄化及新能源化的底层逻辑，叠加全球地缘政治冲突激烈化、全球贸易格局碎片化趋势，集装箱船、油轮、散货船行情轮动交替演绎，我们判断本轮造船景", "content": "造船行业周度更新系列（33）：新船价格及二手船价均大幅上涨，造船&海工长景气周期趋势向好，重点看好#松发股份、中国船舶、中集集团、中国动力#新船价格及二手船价格均大幅上涨：本周Clarksons新船价格指数187.2点，环比上周上涨0.3%。二手船价格指数达230点，环比上涨3%，继续突破前高。本周Clarksons综合运价平均达76284美元/天，维持历史高位。目前新船价格与二手船价格出现大幅倒挂，根据Clarksons数据，目前一艘3年内VLCC现船价格达1.8亿美金，而一艘VLCC新造船价格仅1.3亿美金。 #2026Q1~Q3新船订单创2007年以来新高： 2026年9月全球新船订单约800万CGT/220亿美金，同比分别增长13%/12%。2026年Q1~Q3全球造船订单约7071万CGT/2050亿美金（油轮/集装箱船/散货船/气体运输船分别占比30%/28%/15%/14%），分别同比增长57%/55%，新船订单量超过2024年前高，创2007年以来新高。目前全球造船厂在手订单约2.26亿CGT/6.01亿DWT，在手订单保障年数4.56年，造船行业景气持续。#核心观点：#长期来看，基于目前全球航运船队老龄化及新能源化的底层逻辑，叠加全球地缘政治冲突激烈化、全球贸易格局碎片化趋势，集装箱船、油轮、散货船行情轮动交替演绎，我们判断本轮造船景气周期可持续至2030年以后。 #短期来看，我们看好2026年造船行业复苏行情，全球新造船订单自25年11月以来延续强劲复苏态势（美国关税/301调查谈判落地、叠加下游油运市场景气持续上行），新船价格指数自26年3月以来已经连续上涨，当下中船、恒力、扬子江等主要船厂业绩已呈现加速释放态势，随着行业贝塔复苏，无论从行业景气度、业绩的确定性和弹性还是估值性价比角度看（#松发股份、中国船舶2027年PE约10倍左右（Wind一致预期）），造船行业为2026值得重点关注和配置的板块，当前时点作重点推荐。#重点关注标的：恒力重工、中集集团、中国船舶、中国动力、扬子江、船舶ETF、苏美达、中船防务H、中国船舶租赁、纽威股份、亚星锚#文字观点", "publish_time": "2026-11-01 18:23", "tags": ["新船价格及二手船价格均大幅上涨", "核心观点", "重点关注标的", "文字观点"]}, "post:2026-11-01T20-58:4c131744f02b": {"id": "post:2026-11-01T20-58:4c131744f02b", "kind": "post", "title": "2026-11-01 20:58", "source_label": "帖子正文", "excerpt": "看好机器人行情持续性，关注船舶海工板块-20261101 1.人形机器人。", "content": "【广发机械】周度观点更新：看好机器人行情持续性，关注船舶海工板块-20261101 1.人形机器人。Astra直接控制机器人，推动通用模型承担任务理解、规划及部分动作决策，真实操作与触觉数据价值进一步提升。SuperMimic大幅提升运控的训练效率、降低算力消耗。本体出货量预期有望上修。当前重点推荐奥比中光、峰岹科技、福莱新材，本体宇树科技、上纬新材，T链继续推荐峰岹科技、恒立液压、北特科技等。 2.船舶。松发股份Q3符合预期，在手订单超500艘船。中国船舶交付节奏受台风及北海船厂火灾影响，叠加重组约7亿元所得税，业绩短期承压，但Q3现金流110亿元、创历史新高。 我们认为真正决定新船需求的仍是船东对远期运力的决策，全球船厂排期、船龄结构及环保政策等中期逻辑未变。继续推荐松发股份、中国船舶等。 3.海工油服。中海油服9月底半潜式钻井平台利用率提升9.4pct至98%，博迈科Q3利润转正，中集来福士26H1利润高增至7.3亿元。 我们认为，海工油服正在迎来政策、订单、业绩三重拐点，板块位置仍低，重点关注海油工程、中海油服、振华重工、中集集团等。 4.AIDC发电。GEV Q3燃气轮机新签订单16.6GW，交付5.3GW，同比+32.5%，全年自由现金流指引大幅上修。FTAI27年Power交付2GW，预收款层面与杰瑞报表互相印证。 两个季度大幅回调后，板块已回到估值与筹码双低位，当前对应28年PE普遍不到20x；美国电力设备禁令细则尚未落地，待风险出清后板块有望迎来极佳布局机会。 5.半导体设备。长川科技业绩超预期，并公告股份回购。华峰测控Q3业绩符合预期，8600已有少量交付。强一股份全年新接订单20亿元以上，存储探针卡Q4看到批量订单。 存储与逻辑扩产共振将持续上修设备订单预期，后道封测设备已进入业绩释放周期，短期收入确认节奏不改中期成长趋势。核心推荐长川科技、强一股份、华峰测控、精智达等。 6.机械行业Q3业绩简述。样本内机械行业26Q3收入增速12%、归母净利润增速要略慢，也体现出汇兑的变化与基数压力。收入端明显加速的板块以光模块设备、液冷为主，船舶、锂电设备、3C设备维持前期高增长趋势，而光伏设备、风电、矿机煤机等板块有一定需求压力，个股间差异度很大。 具体情况欢迎交流#文字观点", "publish_time": "2026-11-01 20:58", "tags": ["文字观点"]}, "post:2026-11-01T21-25:70eb7918a8af": {"id": "post:2026-11-01T21-25:70eb7918a8af", "kind": "post", "title": "2026-11-01 21:25", "source_label": "帖子正文", "excerpt": "给大家一个省流版本的计算机三季报 海光信息：符合预期，中规中矩，26年240亿收入 寒武纪：收入符合预期，利润率超预期，存货大增至120亿 海康威视：存储红利开始减弱 同花顺：收入", "content": "给大家一个省流版本的计算机三季报 海光信息：符合预期，中规中矩，26年240亿收入 寒武纪：收入符合预期，利润率超预期，存货大增至120亿 海康威视：存储红利开始减弱 同花顺：收入利润平滑了，超预期 中科曙光：利润超预期，全年超过30亿，其中海光贡献11亿 金山办公：高基数下，单季度收入利润略有降速 浪潮信息：存货超预期，尽管不符合传统研究员 中控技术：平淡，但是符合预期 华大九天：收入预期超大部人预期，数字全流程布局完成 达梦数据：加回股权激励，利润30%+，信创硬件挤压软件预算 萤石网络：存储红利开始减弱 税友股份：利润确实翻倍，但是包含了卖楼，全年2亿经营利润 合合信息：Q3复苏，收入回到20%+ 新大陆：Q2太好，抬高了预期，Q3硬件增速回落 虹软科技：消费电子不行，虹软很难行，静待花开 思看科技：11月拓竹有发布会，Q4消费级开始出货 鼎捷数智：毛利率下滑较多，订单不错 能科科技：毛利率下滑较多 索辰科技：平淡，但是符合预期，有机器人合作 福昕软件：除了汇兑的影响，Q3收入持平，利润开始兑现#文字观点", "publish_time": "2026-11-01 21:25", "tags": ["文字观点"]}, "post:2026-11-01T19-36:7aed6b71b283": {"id": "post:2026-11-01T19-36:7aed6b71b283", "kind": "post", "title": "2026-11-01 19:36", "source_label": "帖子正文", "excerpt": "结论：市场将3Q26投资损失与产能爬坡放缓误读为景气拐点，实则胜宏正处于\"HDI放量+AI PCB内容升级+mSAP/HLC第二曲线\"的三重增长换挡期。", "content": "野村——胜宏科技：HDI、HLC与mSAP多重增长引擎驱动 评级与定价：维持\"买入（Buy）\"，目标价由447.00港元大幅下调至289.00港元（按10月29日收盘价136.00港元计，隐含上行空间+112.5%）；估值倍数由27倍前瞻市盈率（P/E）压缩至19倍FY27F EPS（13.22元人民币），与万得（WIND）中国PCB板块中位数P/E对齐。当前股价对应FY27F EPS仅9倍，估值吸引力在预期重置后显著提升。 • 3Q26业绩\"表观失速、扣非稳健\"：营收68.31亿元（同比+34.3%，环比+11.8%），归母净利5.27亿元（同比-52.2%，环比-66.4%），主因单季投资损失拖累；扣非归母净利润12.80亿元（同比+16.2%，环比+9.99%），盈利底色未损。毛利率34.2%（同比-1pp，环比+2pp），公司通过PCB提价转嫁材料成本压力，管理层确认4Q26E起GPU/ASIC PCB内容升级将支撑毛利率进一步扩张。 • 盈利预测下调反映产能爬坡节奏：FY26-28F营收下调2%-3%至270.93亿/481.64亿/697.08亿元，净利润下调7%-10%至69.86亿/129.95亿/189.19亿元，核心假设修正为HDI产能释放慢于预期及超大规模AI客户钱包份额竞争加剧。GPM假设同步下调1.3-2.7pp以反映产能爬坡与原材料成本上行。野村预测较万得一致预期低5%-18%，对下一代产品迭代节奏与竞争烈度持更审慎态度。 • HDI为中长期核心α，客户矩阵持续拓宽：除战略级HDI客户英伟达（NVDA US，未评级）外，更多云服务提供商（CSP）如谷歌（GOOG US，未评级）未来有望在交换机与计算板上采用HDI方案。胜宏凭借大规模HDI产能（含设备）与多年研发积累，预计FY26-28F HDI营收CAGR达82%，FY28F占总销售额64%，因高单价与高毛利属性成为主要利润引擎。 • HLC与mSAP打开第二增长曲线：在Cloud/ASIC客户与光模块市场，胜宏正积极扩产高多层板（HLC）与改良半加成法（mSAP）HDI产能，虽基数较低但上行潜力显著。 • 利润率担忧将随产品与材料升级缓解：9M26毛利率受覆铜板（CCL）等原材料涨价及折旧成本攀升挤压，但终端客户GPU/ASIC平台升级加速将推高PCB单板价值量，反向支撑毛利率上行趋势。 • 资本结构与现金流：FY26F Capex达150亿元前置投放，FY26F自由现金流-92.29亿元，但股权融资173亿元+债务发行24.41亿元覆盖资本开支；此后FY27F/28F自由现金流转正至71.48亿/132.01亿元，期末现金分别达202.64亿/326.89亿元，维持净现金状态。 • 核心风险：下游服务器与汽车电子PCB需求不及预期、高端PCB市场竞争加剧挤压利润率、原材料成本超预期上行、全球AI价值链地缘政治紧张升级、关键技术变革（如COWOP）颠覆竞争格局、大客户供应链多元化稀释份额。 核心结论：市场将3Q26投资损失与产能爬坡放缓误读为景气拐点，实则胜宏正处于\"HDI放量+AI PCB内容升级+mSAP/HLC第二曲线\"的三重增长换挡期。目标价由447港元下调至289港元主因估值倍数从27倍压缩至19倍（与板块中位数对齐），但盈利曲线上修与19倍FY27F P/E仍提供112.5%上行空间。当前9倍前瞻PE是AI硬件回调窗口中的深度价值入场点，维持买入。#文字观点​", "publish_time": "2026-11-01 19:36", "tags": ["文字观点​"]}, "post:2026-11-01T18-26:13b9a2964139": {"id": "post:2026-11-01T18-26:13b9a2964139", "kind": "post", "title": "2026-11-01 18:26", "source_label": "帖子正文", "excerpt": "结论：云厂Capex军备赛未结束，AI基建链景气延续", "content": "野村——全球 AI 追踪：亚马逊3Q26业绩解读 • 资本开支与需求能见度：3Q26单季Capex同比+120.1%至773亿美元，维持2026全年约22 \n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：Agent推理拓展持续性算力需求，AI应用由单次生成走向多轮交互、长上下文与多智能体协同，算力需求从集中建设向持续消耗延伸，为云厂商资本投入与AI服务器需求增长提供支撑；新一代整柜方案导入下，服务器市场有望呈现出货增长与单机价值提升共振。\u003c/li>\n\u003cli>今天出现的催化/验证：DeepSeek Harness团队发布Super-agent架构探索，以MIT协议开源研究原型，围绕“连续、高效、主动、持久”探索持续在线、并行处理多任务的Agent形态；GPT-6.1 Terra上线，API输入/输出价1/5美元每百万Token；北美四大CSP维持2026年高位资本开支指引、英伟达披露下一代CPO技术；SpaceX签下400亿美元AI算力融资租赁协议。风险侧，Anthropic公开招股书、OpenAI下调融资目标，引发新一轮AI泡沫担忧。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>半导体/存储\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：亚太半导体行业观点维持具吸引力，AI半导体需求前景强劲；长期需求驱动包括芯片通胀——晶圆、OSAT及存储成本上升，2026年芯片设计公司毛利率承压，价格弹性将抑制部分终端需求；2027年GPU/ASIC总功耗预计达数十GW。\u003c/li>\n\u003cli>今天出现的催化/验证：存储价格韧性超预期，8T NVMe国内面价站稳3200美元，BAT净价2000-2400美元，美国市场售价高达5000美元+，海内外价差维持60%+；NAND位元中个位数增长、ASP上涨10%-20%高段。韩国10月出口保持强劲增长，AI驱动的繁荣继续推动贸易型经济体。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>机器人/物理AI\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：物理AI正从“demo叙事”切入“工厂部署验证”阶段，汽车产业因其制造场景、数据闭环与供应链能力，成为人形机器人最早规模化落地的试验场；当前行业处于S曲线浅坡段，整机放量慢于预期，但“运动部件+数据采集+仿真训练”的供应链先兑现订单与现金流；运动部件占人形机器人BOM约50%，旋转/直线执行器、谐波减速器、轴承、电机、扭矩传感器、丝杠共同构成价值池。\u003c/li>\n\u003cli>今天出现的催化/验证：Meta与中国企业傅利叶智能研发人形机器人Max，并已启动第二代产品开发；特斯拉Optimus落地商业化试点消息发酵，海外资本持续加码人形机器人赛道；3Q26新增两大中国客户，全球人形订单储备升至约4亿欧元。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>新能源车/光储\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：10月销量跟踪显示纯电与出口结构性增长、插混承压；光储环节呈现“发货强、确收滞、毛利塌”组合，储能出货高增但确收仅半数，毛利率承压。\u003c/li>\n\u003cli>今天出现的催化/验证：比亚迪10月交付490,168辆，同比+11.0%、环比+5.7%，纯电30.57万辆、同比+37.4%，插混17.74万辆、同比-17.2%，出口新能源汽车17.02万辆、占当月销量34.7%；吉利汽车10月新能源交付214,996辆，环比+12.6%、同比+20.9%，首次单月突破20万辆、新能源占比升至69%。阳光电源Q3营收、归母、扣非179.50/13.41/16.93亿元，同比-21.5%/-67.7%/-57.6%，主要受碳酸锂、出口退税、汇兑等影响毛利率，以及储能确收节奏及公允价值损失影响；目标价由120元下调至63元，维持中性评级，三季报净利同比降68%，储能GPM承压。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>AI电源/液冷\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：26Q3业绩承压并非AI电源需求转弱，而是主动投入加码、成本传导滞后及汇率波动等因素共同作用的结果；供电产品已覆盖从35kV高压侧到GPU附近0.8V供电环节，柜内拥有33kW、110kW PSU及5.5kW CRPS液冷电源，并覆盖DCDC、逆变器、BBU和超级电容等配套产品；板载端进一步向二次、三次电源及芯片末端供电延伸。\u003c/li>\n\u003cli>今天出现的催化/验证：50V电源系统中，ASIC；AI电源进入订单与交付指数型增长区间。光宝LiteOn 3Q26营收574.46亿新台币、约121.54亿元人民币，同比+28%、环比+9%，税后净利润74.29亿新台币、约15.72亿元人民币，同比+60%、环比+4%，创单季历史新高。科泰电源26Q3单季归母净利润9298万元、同比+556%、环比+164%，归母净利率8.0%，同比+5.1pct、环比+4.0pct，利润拐点确认。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>PCB/光通信\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：市场将3Q26投资损失与产能爬坡放缓误读为景气拐点，实际胜宏科技正处于“HDI放量+AI PCB内容升级+mSAP/HLC第二曲线”三重增长换挡期；9M26毛利率受覆铜板等原材料涨价及折旧成本攀升挤压，但终端客户GPU/ASIC。光模块从800G向1.6T甚至3.2T迭代，散热方案在基板、TIM材料、VC、液冷板等环节发生变化；1.6T EML功耗拆分中40%为光芯片、40%为电芯片、20%为电子元器件。\u003c/li>\n\u003cli>今天出现的催化/验证：胜宏科技维持买入评级，目标价由447.00港元下调至289.00港元，按10月29日收盘价136.00港元计隐含上行空间+112.5%；估值倍数由27倍前瞻P/E压缩至19倍FY27F EPS。广钢气体公告新签3套50k电子大宗气体项目，印证国内电子大宗进入项目密集招标阶段；电子布Q3大部分公司环比继续高增，硅微粉龙头业绩超预期、环比开始跳增。亚马逊3Q26单季Capex同比+120.1%至773亿美元，维持2026全年约2200亿美元指引，2027年将进一步显著抬升；AWS算力预订已看至2027-2029年，单笔容量承诺常达数百兆瓦甚至1GW级。Q3光无源板块代表公司单季营收同比均值+128%、环比+40%，毛利率均值35.4%、同比+3.6pct。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>10月PMI走弱：制造业、非制造业、综合PMI分别为49.3%、49.7%、49.7%，较上月下降0.8、0.5、1.0个百分点；主要矛盾是制造业供需同步转弱，传统建设链和中小企业承压，科技制造及部分服务消费保持韧性，政策加力必要性上升。\u003c/li>\n\u003cli>全球风险资产继续普跌，A股跌幅尤为夸张；美股半导体板块本周开局出现需求回暖的积极信号，主要来自长线资金，但本周收尾阶段遭遇猛烈抛售，下跌过程中几乎没有买盘承接；全周资产管理人最终转为净卖出，对冲基金资金流整体多空平衡。\u003c/li>\n\u003cli>美国基本面多空策略净杠杆上行3.6个百分点至47%，处于近一年7分位；对冲基金四周内首次净买入美股，主要来自宏观品种的空头回补，其次是个股层面。\u003c/li>\n\u003cli>10月车企销量落地：比亚迪交付490,168辆，纯电30.57万辆、插混17.74万辆、出口新能源汽车17.02万辆；吉利新能源交付214,996辆，首次单月突破20万辆，新能源占比69%，极氪10月交付32,483辆、环比-12.7%、同比+51.6%。\u003c/li>\n\u003cli>阳光电源2026三季报低于预期，Q3营收/归母/扣非179.50/13.41/16.93亿元，同比-21.5%/-67.7%/-57.6%；评级维持中性，目标价由120元下调至63元，较2026年10月30日收盘价65.29元隐含约-3.5%空间。\u003c/li>\n\u003cli>DeepSeek发布Super-agent架构探索并开源研究原型；GPT-6.1 Terra上线；Meta与傅利叶智能合作研发人形机器人Max并启动第二代产品开发；特斯拉Optimus落地商业化试点消息发酵；SpaceX签下400亿美元AI算力融资租赁协议。\u003c/li>\n\u003cli>胜宏科技维持买入评级，目标价由447.00港元下调至289.00港元；广钢气体新签3套50k电子大宗气体项目；科泰电源Q3归母净利润9298万元、同比+556%、环比+164%，净利率8.0%确认利润拐点；光宝3Q26税后净利润同比+60%、环比+4%，创单季历史新高。\u003c/li>\n\u003cli>中国稀土拟通过发行股份购买中稀（凉山）稀土有限公司股权并募集配套资金，股票将于11月2日起停牌，预计11月16日前披露相关信息；此次注入意味着公司由以冶炼分离为主的。\u003c/li>\n\u003cli>筹码与指数表现：26Q3信息传输、软件和信息技术服务业占净值比1.07%，2026Q2为1.23%，环比-0.16pct；主动型基金电子配置仍达36%、超配18ppts；电新行业基金重仓规模1814亿元、环比-26.3%，占基金持仓规模5.36%，大幅低配且连续两个季度低配。计算机（中信）指数本周下跌-11.3%，创业板指数下跌10.08%，上证指数下跌2.48%。\u003c/li>\n\u003cli>地产与消费数据：33家房企前三季度收入6674.4亿元、同比-25.6%，归母净利润-465.9亿元、同比-23.2%、同比少亏141亿元；10月信用十强企业销售金额1267亿元、占百强销售总额比例提升至55%，环比+16%、同比-6%，百强整体单月同比-17%、1-10月累计-15%。贵州茅台26Q1-Q3总营收1333亿元、同比+1.8%，归母净利645亿元、同比-0.2%；26Q3总营收、归母净利同比+3.0%、+3.8%，Q3业绩较Q2显著改善。\u003c/li>\n\u003cli>其他公司变化：华新建材签署收购巴西CSN水泥排他性协议，标的公司企业价值127亿巴西里亚尔、折合人民币158.68亿元，收购价格10x EBITDA，标的产能1700万吨左右、对应产能估值933元/吨；中控技术26Q3营收18.71亿元、同比+2.6%，归母净利润-0.09亿元；概伦电子26Q3营收1.8亿元、同比+84.4%，主要系7月末开始并表IP公司锐成芯微&amp;纳能微；淡水河谷Serra Norte 3Q26受新增自动驾驶矿卡投运磨合及矿坑作业条件不利影响，10月日均产量环比提升15%，预计2027年产量基本持平于约6400万吨。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型\u003c/strong>：Agent推理带来的持续性算力消耗能否兑现为云厂商资本开支和AI服务器订单；北美四大CSP 2026年高位资本开支指引及2027年进一步抬升的落地节奏；AWS算力预订2027-2029年及单笔数百兆瓦至1GW级容量承诺的后续兑现；英伟达Kyber机架方案调整——每个机架GPU数量从144减少到72的讨论进展，以及CPO技术导入；DeepSeek Super-agent开源后的生态与商业化进展；海外模型巨头融资遇冷、OpenAI下调融资目标对AI泡沫担忧的后续影响。\u003c/li>\n\u003cli>\u003cstrong>半导体/存储\u003c/strong>：芯片通胀对2026年芯片设计公司毛利率的压力；NAND位元中个位数增长、ASP上涨10%-20%高段的持续性；8T NVMe海内外价差60%+的持续性及北美QLC需求；2027年GPU/ASIC总功耗达数十GW对电源、散热、PCB等环节的拉动。\u003c/li>\n\u003cli>\u003cstrong>机器人/物理AI\u003c/strong>：工厂部署验证进展与整机放量节奏；运动部件占BOM约50%的供应链订单与现金流兑现；全球人形订单储备约4亿欧元后的新增客户与订单；Meta与傅利叶智能第二代产品开发、特斯拉Optimus商业化试点的后续验证。\u003c/li>\n\u003cli>\u003cstrong>新能源车/光储\u003c/strong>：10月销量后的出口与纯电/插混结构变化；阳光电源储能确收节奏、单位盈利见底回升的验证，以及碳酸锂、出口退税、汇兑对毛利率的影响；锂电及储能板块估值修复与27年锂电行业25%-30%增速判断的验证。\u003c/li>\n\u003cli>\u003cstrong>AI电源/液冷\u003c/strong>：麦格米特4Q26及2027年云端电源业务展望；ASIC；光宝、科泰电源盈利拐点的持续性及海外收入占比抬升对盈利能力的拉动。\u003c/li>\n\u003cli>\u003cstrong>PCB/光通信\u003c/strong>：胜宏科技HDI放量、AI PCB内容升级、mSAP/HLC第二曲线的兑现；覆铜板等原材料涨价及折旧对毛利率的影响；光模块1.6T/3.2T迭代下散热方案变化及Marvell收购Lumentum进展，收购条款仅少数高层了解、机构投资者持股比例达81%带来的不确定性；Q3光无源高增的持续性。\u003c/li>\n\u003cli>\u003cstrong>宏观与风险偏好\u003c/strong>：中东问题未缓解、美股大厂财报低预期后的滞胀交易演化；A股风险资产右侧信号；PMI转弱后政策加力必要性；华发事件对“国企刚兑”信仰的考验及信用溢出风险；电子超配18ppts、电新大幅低配连续两季的筹码结构变化。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>09:54｜浙江荣泰＆鼎胜新材＆骄成超声2026年三季报业绩点评 #浙江荣泰：主业维持高增长，机器人业务稳定推进 #业绩符合市场预期。公司26Q1-3营收14.6亿元，同52%，归母净利2.5亿元，同21%，扣非净利2.4亿元，同27%，毛利率35.4%，同-1pct\u003c/li>\n\u003cli>09:54｜DeepSeek发布全新Agent架构 10月31日｜DeepSeek Harness 团队10月31日晚在官方。DeepSeek表示，模型能力提升催生了新的应用形态，个人助手（Personal Agent）开始集中涌现。\u003c/li>\n\u003cli>09:54｜⏯️【浙商李超林成炜宏观团队】10月PMI解读：供需同步转弱，政策加力必要性上升 📊10月制造业、非制造业、综合PMI分别为49.3%、49.7%、49.7%，较上月下降0.8、0.5、1.0个百分点。主要矛盾是制造业供需同步转弱，传统建设链和中小企业承压，科技制造及部分服务消费保持韧性\u003c/li>\n\u003cli>09:55｜【Kyber的回归取决于更低规格的设计】 根据我们的行业研究，客户需求的复苏促使英伟达重启Kyber计划，但正交中平面问题尚未完全解决。目前正在讨论的配置方案将每个机架的GPU数量从144减少到72。\u003c/li>\n\u003cli>09:55｜随着 NVIDIA 的 Kyber 机架一再延期，市场预期已收敛至两个极端。【1】一种观点认为，NVIDIA 已彻底取消 Kyber。\u003c/li>\n\u003cli>09:55｜【国泰海通食饮】贵州茅台：改革逐步发力，Q3业绩企稳26Q3增速转正，利润快于收入 公司26Q1-Q3总营收1333亿元、同比+1.8%，归母净利645亿元、同比-0.2%；其中26Q3总营收、归母净利同比分别+3.0%、+3.8%，环比来看Q3业绩较Q2显著改善，我们预计主要为旺季驱动放量以及提价因素共同作用。\u003c/li>\n\u003cli>09:55｜华新建材收购CSN排他协议点评：南美扩张第一步，继续坚定看好公司海外发展公司公告签署收购巴西CSN水泥排他性协议，标的公司企业价值为127亿巴西里亚尔，折合人民币158.68亿元。根据CSN财报，2025年公司水泥板块EBITDA为12.9亿巴西里亚尔，此次收购价格为10x EBITDA，标的公司产能1700万吨左右，对应产能估值933元/吨产能，从产能收购角度略贵于此前尼日利亚及菲律宾收购。\u003c/li>\n\u003cli>09:55｜AI模型系列（八）：国产旗舰追近，新场景接力可期 #性能：海外进入新一轮旗舰周期、国产旗舰开始追近。9-10月，海外头部厂商在约一个半月内集中完成旗舰换代，AA智能指数（v4.3.2）52分及以上的9款模型中有8款为海外本轮新品，Claude Opus 5.5以58分居首。\u003c/li>\n\u003cli>09:55｜⭕【阳光电源】2026三季报点评：Q3业绩低于预期，主要系碳酸锂、出口退税、汇兑等影响毛利率，以及储能确收节奏及公允价值损失影响，发货仍高增预计后续将迎来单位盈利见底回升 ➡事件： 公司发布2026三季报，Q3营收、归母、扣非179.50/13.41/16.93亿元、同比-21.5%/-67.7%/-57.6%、环比+16.9%/-54.8%/-24.5%，扣非高于归母主要系Q3非经常性损益-3.52亿元，其中金融资产公允价值变动及处置\u003c/li>\n\u003cli>09:56｜通货膨胀、不平等和债务：令华尔街感到恐慌的图表\u003c/li>\n\u003cli>09:56｜股市暴跌，投资者纷纷寻求避险，股市波动性飙升\u003c/li>\n\u003cli>09:56｜本周工作：玻纤专家、钢结构专家，联瑞新材、东方雨虹、鸿路钢构、
