张网”投资）而非“大水漫\n\n**文字观点原文线索：**\n1. `2026-10-22 09:23` 看好国内算力网建设带来的国产算力、算电协同、数据要素板块投资机会上证指数当前运行于3700点一线附近，积极看好短期反弹行情。\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>AI算力硬件进入“量产+液冷/供电升级”验证期。GTC柏林大会明确Vera Rubin已全面量产，发布模块化AI工厂DSX POD；Vera Rubin实现100%液冷设计，DSX POD采用闭环液冷+干冷器，部署时间从六个月缩短至最短14天，设施冷却用水接近于零。机构预估服务器CPU今年出货增幅31%，2027年出货量有望增逾40%。\u003c/li>\n\u003cli>机器人/具身智能催化密集。特斯拉Q3业绩会明确Optimus已在弗里蒙特大规模产线开始早期生产，先部署1-2万台用于数采和训练，1-2个月内发布非预编程视频/Demo，明年底周产2万台；行业叙事从“Demo”转向“Uptime与回报率”，具身数据、触觉芯片与数采基地成为关注点。\u003c/li>\n\u003cli>存储与光通信呈“价格周期分歧+业绩超预期”并存。2024/2025/2026E DRAM ASP同比+54%/+27%/+236%后，投资者对2027年定价情绪谨慎，三星电子HBM业务目标及HBM4定价谈判受关注；仕佳光子前三季度营收27.22亿元同比+74.46%、归母净利5.86亿元同比+95.43%，单季归母净利2.71亿元环比+36%，1.6T产品进入小批量交付，CPO高通道FAU小批量出货。\u003c/li>\n\u003cli>新能源车产业链盈利承压与结构改善并存。宁德时代Q3单位净利润环比降至0.08元/Wh（1H26为0.10元/Wh），受产品结构向低毛利倾斜、增值税出口退税削减及9月起2%国内消费税合计约15亿元额外成本影响；特斯拉Q3亚太交付比例超预期、中国工厂就近配套毛利率改善，但单车净利0.16万美元，同比-41%、环比-30%。\u003c/li>\n\u003cli>宏观策略分歧加大。中国股票策略观点认为中国创新领先但盈利转化滞后，政策预计保持“增量且精准”，通过加快财政执行（如“六张网”投资）而非“大水漫灌”，ETF干预意在培育“慢牛”而非“疯牛”；市场同时存在“谨慎为主、仓位3成以内”和“Q4技术性或大级别反弹”的判断，香港市场交易数据显示恒生指数-2.9%、恒生中国企业指数-3.1%。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/液冷电源\u003c/strong>：主线围绕Vera Rubin全面量产、800V供电与全液冷加速落地。今天强化的逻辑是算力交付、供电散热与物理AI应用同步推进，液冷成为保障高密度算力稳定运行的必然选择；DSX POD模块化AI工厂可将部署时间从六个月缩短至最短14天。催化/验证包括GTC柏林大会明确Vera Rubin已全面量产、100%液冷设计、闭环液冷+干冷器，以及服务器CPU出货预估今年+31%、2027年+逾40%。\u003c/li>\n\u003cli>\u003cstrong>机器人/具身智能\u003c/strong>：主线是特斯拉Optimus量产时间线与物理AI数据闭环。今天强化的逻辑是产能与数据并重，弗里蒙特产线落地和“先部署1-2万台用于数采和训练”的规划，印证物理AI正迈向实质性量产与端到端数据闭环；CIIF巡展显示估值锚点从“Demo”转向“Uptime与回报率”，行业从概念炒作迈入早期部署验证期。催化/验证包括1-2个月内发布Optimus非预编程视频/Demo、12月4日股东大会、明年底周产2万台，以及天奇股份具身智能工业数据采集与实训中心、灿瑞科技三维磁性触觉传感器等具身数据/感知环节。\u003c/li>\n\u003cli>\u003cstrong>半导体/存储\u003c/strong>：主线是内存价格上行周期是否降温的分歧与HBM定价。今天强化的逻辑是AI交易进入第四年，投资者焦点已转向内存价格上行周期是否降温的迹象，尤其在2024/2025/2026E DRAM ASP同比+54%/+27%/+236%之后，对2027年定价情绪谨慎。催化/验证包括内存市场更新指出自上而下与自下而上的视角存在令人困惑的分歧、三季度业绩前瞻，以及三星电子HBM业务目标更新及HBM4定价谈判进展。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>：主线是仕佳光子Q3超预期与1.6T/CPO进展。今天强化的逻辑是无源光器件加速放量、有源光芯片持续突破，400G/800G AWG芯片及组件已规模交付，1.6T产品进入小批量交付，适配800G/1.6T的MT-FA部分产品已批量商用，CPO高通道FAU小批量出货。催化/验证包括仕佳光子前三季度营收同比+74.46%、归母净利同比+95.43%、单季归母净利环比+36%，以及光模块1.6T影响为短期因素、二线光模块季度环比加速度趋势不变、新易盛订单交付有序开展。\u003c/li>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>：主线是中国创新与盈利转化缺口、政策节奏与市场反弹分歧。今天强化的逻辑是中国在电动汽车、电池、光伏、造船、工业机器人、AI及生物科技等领域具备全球竞争力，制造业增加值约占全球三成、商品出口约占全球15%，但权益市场表现显著落后于产业进步；政策预计“增量且精准”，ETF干预平滑波动、抑制过热。催化/验证包括有观点判断Q4技术性或大级别反弹、当前处于恐慌抛售尾声，宏观与市场观点建议谨慎为主、仓位3成以内，以及香港恒生指数-2.9%、恒生中国企业指数-3.1%。\u003c/li>\n\u003cli>\u003cstrong>新能源/汽车\u003c/strong>：主线是宁德时代单位盈利下探与特斯拉Q3成本/交付结构。今天强化的逻辑是宁德时代Q3业绩显著低于市场一致预期，单位净利润环比降至0.08元/Wh，管理层归因于产品结构向低毛利产品倾斜，以及增值税出口退税削减与9月起开征的2%国内消费税合计约15亿元额外成本；特斯拉Q3亚太交付比例超预期、中国工厂就近配套毛利率改善。催化/验证包括预计4Q26宁德时代单位净利小幅回升至0.085–0.09元/Wh、2027年有望重返0.10元附近但中期中枢下修8%–10%，以及特斯拉Q3产量46.44万辆同比+4%、销量48.65万辆同比-2%、单车净利同比-41%。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>GTC柏林大会明确Vera Rubin已全面量产，发布模块化AI工厂DSX POD；Vera Rubin实现100%液冷设计，DSX POD采用闭环液冷+干冷器，部署时间从六个月缩短至最短14天，设施冷却用水接近于零。\u003c/li>\n\u003cli>特斯拉Q3业绩会：Optimus已在弗里蒙特大规模产线开始早期生产，先部署1-2万台用于数采和训练；预计1-2个月内发布新的Optimus演示视频，展示非预先编程固定动作的任务；明年底周产2万台；12月4日股东大会为潜在催化。\u003c/li>\n\u003cli>特斯拉Q3财报：产量46.44万辆，同比+4%、环比+3%；销量48.65万辆，同比-2%、环比+1%；单车净利0.16万美元，同比-41%、环比-30%；单车固定成本环比+13%至0.39万美元/辆；单车可变成本环比-5%至3.07万美元/辆；单车平均售价环比-3%至4.23万美元/辆；积分售卖收入1.13亿美元，同比-73%、环比-23%。\u003c/li>\n\u003cli>宁德时代Q3业绩显著低于市场一致预期，单位净利润环比降至0.08元/Wh（1H26为0.10元/Wh）；管理层归因于产品结构向低毛利产品倾斜，以及增值税出口退税削减与9月起开征的2%国内消费税合计约15亿元额外成本；预计4Q26单位净利小幅回升至0.085–0.09元/Wh，2027年有望重返0.10元附近，但中期中枢较此前模型下修约8%–10%。\u003c/li>\n\u003cli>仕佳光子前三季度营收27.22亿元，同比+74.46%；归母净利5.86亿元，同比+95.43%；单季归母净利2.71亿元，环比+36%；归母净利率22.09%，较上半年提升1.04pp；400G/800G AWG芯片及组件已规模交付，1.6T产品进入小批量交付，MT-FA部分产品已批量商用，CPO高通道FAU小批量出货。\u003c/li>\n\u003cli>内存市场更新：2024/2025/2026E DRAM ASP同比+54%/+27%/+236%后，投资者对2027年定价情绪谨慎；当前自上而下与自下而上的视角存在令人困惑的分歧；三星电子HBM业务目标更新及HBM4定价谈判进展受关注。\u003c/li>\n\u003cli>宏观策略与市场：中国创新领先但盈利转化滞后，三大缺口主导市场分歧；政策预计保持“增量且精准”，通过加快财政执行（如“六张网”投资）而非“大水漫灌”；ETF干预展现平滑波动、抑制过热意图（1月净流出约7000亿元，7月后温和净流入约500亿元），意在培育“慢牛”而非“疯牛”。市场同时存在“谨慎为主、仓位3成以内”和“Q4技术性或大级别反弹”的判断。\u003c/li>\n\u003cli>SpaceX：2027年底算力建设目标指向13GW，为支撑算力扩张计划在2027年额外部署20GW电力与冷却基础设施；三季度营收146亿美元，同比+161%，超出此前120–130亿美元预期，净利润44亿美元实现扭亏；但受债务担忧影响，SpaceX债券走弱，信用风险指标恶化。\u003c/li>\n\u003cli>光伏反内卷政策逐步体系化，供需改善渐行渐近；此前判断三季度应能看到部分龙头光伏公司业绩转正，绝大多数公司三季度业绩大幅减亏。\u003c/li>\n\u003cli>政策与产业安全：八部门印发《产业基础能力提升“十五五”规划》，提到推动人工智能赋能产业基础创新；中办、国办发布关于推动科技创新和产业创新深度融合的意见。PHP官方紧急发布安全更新，修复两个免登录远程代码执行漏洞，波及全球约七成网站，有观点重申看好AI安全。\u003c/li>\n\u003cli>公司业绩与订单：国际医学Q3收入提速，单季归母亏损收窄至-507万元；迈普医学Q1-Q3营收2.94亿元左右、同比+18%，归母净利约0.90亿元、同比+19%；国家数据集团10月20日在河北雄安揭牌成立；福耀玻璃Q3一次性费用合计影响净利1.5亿元、后续由保险赔付，汇率负向影响ASP 2.5个点、加回后Q3 ASP同比+6.5%；杰瑞股份1-3Q26营收119.74亿元、同比+14.9%，单Q3营收43.28亿元、同比+23.0%；燃机订单斩获超31亿美元，FTAI千台机头Q4量产在即，燃机龙头北美数据中心业绩即将加速兑现。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>特斯拉Optimus：1-2个月内非预编程视频/Demo的发布效果，12月4日股东大会潜在催化，弗里蒙特1-2万台数采和训练部署进度，以及明年底周产2万台目标的兑现节奏。\u003c/li>\n\u003cli>英伟达Vera Rubin/DSX POD：800V供电和全液冷升级的落地节奏，DSX POD部署时间能否从六个月缩短至最短14天，闭环液冷+干冷器及液冷供应链的兑现情况。\u003c/li>\n\u003cli>仕佳光子：1.6T产品客户导入与交付规模扩大，CPO高通道FAU从小批量出货向更大规模放量，新增产能释放与新品规模交付。\u003c/li>\n\u003cli>光模块：1.6T物料、DSP及LPO/LRO方案问题解决后的交付恢复，二线光模块季度环比加速度趋势，以及市场对大光Q3业绩及远期增长预期的修正。\u003c/li>\n\u003cli>存储：三星电子HBM业务目标及HBM4定价谈判进展，2027年DRAM定价情绪变化，内存价格上行周期是否出现降温迹象。\u003c/li>\n\u003cli>宁德时代：4Q26单位净利能否回升至0.085–0.09元/Wh，2027年储能出海与神行/凝聚态电池放量能否使单位净利重返0.10元附近，中期中枢下修后的盈利兑现。\u003c/li>\n\u003cli>宏观与市场：政策“增量且精准”与财政执行（如“六张网”投资）力度，ETF资金流向（1月净流出约7000亿元、7月后温和净流入约500亿元）是否延续，Q4反弹判断与“谨慎为主、仓位3成以内”之间的验证。\u003c/li>\n\u003cli>SpaceX：2027年底13GW算力建设目标与额外20GW电力、冷却基础设施部署进度，债务担忧和信用风险指标恶化是否缓解。\u003c/li>\n\u003cli>光伏反内卷：政策体系化后，三季度部分龙头业绩转正、绝大多数公司大幅减亏的验证。\u003c/li>\n\u003cli>燃机/数据中心电力：燃机订单超31亿美元后的交付节奏，FTAI千台机头Q4量产进度，杰瑞股份燃机订单按序交付与毛利率改善的持续性。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>07:48｜【天风医药杨松团队】国际医学2026 三季报点评：Q3 收入提速，单季归母亏损收窄至 -507 万元一、业绩：收入提速，亏损大幅收窄
