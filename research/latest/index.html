价有望继续 领导好，公司发布Q3业绩预告：#业绩：Q3单季度预计营收1,147–1；✔️事件：长鑫发布业绩预告，预计26Q1-Q3实现收入2650-2700亿元，实现归母净利润1310-1\n**重点关注内容提示：** 收入略超预期，Q4涨价有望继续 领导好，公司发布Q3业绩预告：#业绩：Q3单季度预计营收1,147–1；✔️事件：长鑫发布业绩预告，预计26Q1-Q3实现收入2650-2700亿元，实现归母净利润1310-1\n\n**文字观点原文线索：**\n1. `2026-10-17 12:23` 【长鑫科技】Q3预告速评：收入略超预期，Q4涨价有望继续 领导好，公司发布Q3业绩预告：#业绩：Q3单季度预计营收1,147–1,197亿元，同比+589%–619%、环比+15%\n2. `2026-10-17 12:23` 关注合并利润与收入增速 ✔️事件：长鑫发布业绩预告，预计26Q1-Q3实现收入2650-2700亿元，实现归母净利润1310-1325亿元，中值环增17.8%。\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>AI算力主线聚焦；其模型在OpenRouter开源模型Token调用量中占比一度超50%。同时，有观点将OpenAI收入口径500亿vs预期700亿列为10月以来海外AI叙事裂缝之一。\u003c/li>\n\u003cli>存储与先进封装出现密集催化：长鑫存储披露4F²技术进展，计划2026年底前推出基于4F²架构的全新服务器内存产品，消息披露后三星电子、SK海力士、美光、闪迪、铠侠等主要存储供应商股价下跌；但完成客户认证、高良率大规模量产、缩小HBM差距仍需漫长时间。长鑫科技Q3单季营收预计1,147–1,197亿元，同比+589%–619%；北方华创拟收购诺合键维100%股权，强化混合键合布局。\u003c/li>\n\u003cli>市场策略信号偏修复但宏观扰动仍强：洪灝判断当前处于恐慌性抛售后期，所有风险资产超卖，年底前大概率出现一轮强劲反弹；牛熊指标从8.1骤降至7.4，退出卖出区，信号转为中性。与此同时，美股AI信贷风险向权益市场蔓延，信用违约互换和高收益债利差大幅飙升，超预期CPI加剧10月美联储加息担忧，纳指跌2.15%、费城半导体指数过去七天跌超12%、布伦特原油突破110美元/桶。\u003c/li>\n\u003cli>数据中心互连向铜光并存迁移：传统互连结构约90%铜、8%多模光、2%单模光；交换机层CPO将电学路径由约18英寸缩短至约0.5英寸，端口容量可提升4倍（从128×800G至512×800G）。但相关判断认为CPO技术演进晚于预期，2030年后才进入实质渗透期；OCP 2026会议反馈增量信息有限，铜光混合架构逐步获市场认可。\u003c/li>\n\u003cli>AIDC供电落地与军工航天事件催化并行：AEP宣布在怀俄明州建设702MW Bloom SOFC发电项目向Google供电，项目投资约40亿美元、Google签署20年购电协议、预计2028年底全面投运，是今年1月AEP与BE达成1GW/26.5亿美元采购协议的具体落地。第十六届中国航展定档12.7-12.13，海军首次成体系参展，航天科技新展品占比预计70%以上，CZ-10B、海上网系回收装置均为首次亮相。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线：AI算力/大模型——从模型供给走向。\u003c/strong> 今天强化的逻辑：Harness正成为大模型厂商推动Agent落地的必选项，DeepSeek以开源与插件化入局，争取从模型供给走向生态底座；海外OpenAI、Anthropic从编程向通用知识工作拓展，国内阿里、腾讯持续完善产品矩阵；2025年上半年，其模型在OpenRouter开源模型Token调用量中占比一度超50%。今天出现的催化/验证：DeepSeek Harness相关报告讨论；快手可灵4.0于10月15日全量上线，在动态表现、长时长生成和多素材控制等方向升级；中科曙光前三季度营收122.38亿元、同比+38.75%，利润增速远超收入。风险验证：有观点将OpenAI收入口径500亿vs预期700亿列为海外AI叙事裂缝之一。\u003c/li>\n\u003cli>\u003cstrong>主线：半导体/先进封装——存储技术进展与混合键合并购共振。\u003c/strong> 今天强化的逻辑：长鑫存储4F²技术公告及其对三星电子、SK海力士等的影响成为焦点，公司计划2026年底前推出基于4F²架构的全新服务器内存产品，但完成客户认证、实现高良率大规模量产、缩小HBM这类先进DRAM技术差距仍需漫长时间。今天出现的催化/验证：长鑫科技Q3单季营收预计1,147–1,197亿元，同比+589%–619%、环比+15%，有观点认为Q4涨价有望继续；北方华创拟以现金收购诺合键维100%股权，标的主营混合键合设备、已获重复订单，北方华创26H1已发布两款混合键合设备并取得批量订单；ASIC厂商调研关注Google CPU需求持续上修、微软Maia 200加速放量及先进封装/IP业务。\u003c/li>\n\u003cli>\u003cstrong>主线：宏观/策略——超卖反弹信号与AI信贷、通胀逆风并存。\u003c/strong> 今天强化的逻辑：洪灝认为当前市场处于恐慌性抛售后期，所有风险资产超卖，负面因素充分计价，年底前大概率出现一轮强劲反弹；牛熊指标从8.1骤降至7.4，退出卖出区，当前信号转为中性，5月26日卖出信号正式结束。今天出现的催化/验证：美股本周AI信贷风险向权益市场蔓延，信用违约互换和高收益债利差大幅飙升；周三超预期CPI数据加剧市场对10月美联储加息的担忧；纳指收跌2.15%、纳指100跌2.5%、标普500跌1.1%，费城半导体指数过去七天跌超12%，布伦特原油自5月以来首次突破110美元/桶；沃什讲话偏鸽，增量信息有助于向鸽重定价。\u003c/li>\n\u003cli>\u003cstrong>主线：光通信/CPO——铜光并存，CPO渗透时点后移。\u003c/strong> 今天强化的逻辑：AI工作负载将单应用扩展至百万级GPU协同运算，带宽、传输距离与端口密度要求呈指数级跃升，互连从铜主导转向铜光并存；交换机层CPO将光电转换从面板模块移至交换芯片封装边缘，电学路径由约18英寸缩短至约0.5英寸，端口容量可提升4倍（从128×800G至512×800G）。今天出现的催化/验证：相关判断认为CPO技术演进晚于预期，2030年后才进入实质渗透期；OCP 2026增量信息有限，但铜光混合架构逐步获市场认可，安费诺与泰科电子均指出AI基础设施对连接、供电与网络需求持续提升，推高单颗GPU对应器件价值；磷化铟衬底2027-2028年需求预计达200-300万片，CPO驱动单颗芯片面积增加2-3倍、衬底缺陷密度要求从&lt;500严苛至&lt;200。\u003c/li>\n\u003cli>\u003cstrong>主线：液冷/电源——AIDC供电大单落地，燃机转向订单验证。\u003c/strong> 今天强化的逻辑：AEP宣布在美国怀俄明州建设702MW Bloom SOFC发电项目向Google供应电力，项目投资约40亿美元，Google签署20年购电协议，预计2028年底全面投运；该项目是今年1月AEP与BE达成1GW/26.5亿美元采购协议的具体落地，推算BE硬件费用为18.6亿美元（2.65$m/mw）。今天出现的催化/验证：Google在Cheyenne布局包含702MW SOFC、654MW天然气发电机组以及其他1.4GW第三方签约电源；燃机行业观点认为AIDC缺电及全球燃机供需错配下，国内燃机主机厂出海迎来黄金窗口，行业主线从远期空间叙事切换至订单兑现与海外落地能力验证；HVDC电源调研聚焦800V量产验证、2027年需求、供电架构、DrMOS电容供应链等。\u003c/li>\n\u003cli>\u003cstrong>主线：商业航天/卫星——航展与低空经济事件催化。\u003c/strong> 今天强化的逻辑：第十六届中国航展定档12.7-12.13，海军首次成体系参展，有观点认为军G板块或迎年内最强事件催化；航天科技新展品占比预计70%以上，CZ-10B、海上网系回收装置均为首次亮相；全球军贸交付总额超1200亿美元，中国目前占比约5.8%，军贸占比中航空装备占比达40%以上。今天出现的催化/验证：特斯拉Roadster亮相、“特斯拉会飞”冲上热搜，带动低空经济板块出现多股涨停，但需注意轮动风险并关注反无人机方向；对外军贸市场有望打开，军贸产品对利润高且具备涨价预期。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>存储链：长鑫存储4F²技术公告后，三星电子、SK海力士、美光、闪迪、铠侠等主要存储供应商股价下跌；长鑫科技Q3单季营收预计1,147–1,197亿元、同比+589%–619%，有观点认为Q4涨价有望继续；北方华创拟收购诺合键维100%股权，标的主营混合键合设备。\u003c/li>\n\u003cli>数据中心供电：AEP宣布702MW Bloom SOFC项目向Google供电，项目投资约40亿美元、Google签署20年购电协议、预计2028年底全面投运；该项目是今年1月AEP与BE达成1GW/26.5亿美元采购协议的具体落地。\u003c/li>\n\u003cli>光通信：OCP 2026会议反馈增量信息有限，铜光混合架构逐步获市场认可；相关判断认为CPO实质渗透预计2030年后；磷化铟衬底2027-2028年需求预计达200-300万片，CPO驱动规格升级。\u003c/li>\n\u003cli>宏观市场：纳指跌2.15%、费城半导体指数过去七天跌超12%、布伦特原油突破110美元/桶；牛熊指标从8.1降至7.4，退出卖出区；洪灝称当前处于抛售尾声；美股AI信贷风险和高收益债利差飙升；超预期CPI加剧10月美联储加息担忧。\u003c/li>\n\u003cli>军工航天：第十六届中国航展定档12.7-12.13，海军首次成体系参展；航天科技新展品占比预计70%以上，CZ-10B、海上网系回收装置首次亮相；特斯拉Roadster“会飞”带动低空经济多股涨停。\u003c/li>\n\u003cli>新能源/汽车：青岛中国铝业大会给出2027年ex-China产量增量预期330w+、全球过剩80-150万吨；电池材料10月排产预测下调至头部五家环比+1%（此前预期+7%）；浮法玻璃26年总需求下降约10%。\u003c/li>\n\u003cli>机器人：Roadster发布会未提及机器人，有观点将验证锚点放在可核验的产能建设进度；另有观点称飞车可能复制22年机器人行情。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>AI：DeepSeek Harness/Agent生态进展、OpenRouter开源模型Token份额可持续性；快手可灵4.0后续；OpenAI、Anthropic收入与增速口径验证。\u003c/li>\n\u003cli>半导体：长鑫4F²客户认证、高良率量产、2026年底服务器内存产品推出；HBM差距缩小；长鑫Q4涨价兑现；北方华创收购整合与混合键合订单。\u003c/li>\n\u003cli>光通信：CPO量产时点与LITE、COHR的NPO催化；OCP后续；磷化铟4英寸切换与2027供需拐点；800G/1.6T硅透镜需求量。\u003c/li>\n\u003cli>电力：HVDC 800V量产验证、2027年需求、DrMOS电容供应链；燃机订单兑现与海外落地；SOFC项目2028年底投运。\u003c/li>\n\u003cli>宏观：美联储议息、美国中期选举、CPI/通胀、AI信贷利差与油价；洪灝年底反弹判断验证；牛熊指标后续。\u003c/li>\n\u003cli>军工：航展12月催化、军贸订单；低空经济轮动风险。\u003c/li>\n\u003cli>新能源：电池10月排产实际数据；铝全球过剩80-150万吨；玻璃Q4旺季提货与降库；PLS项目3Q29首产。\u003c/li>\n\u003cli>机器人：产能建设可核验进度。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>09:12｜苹果公司任命 Meta 资深人士担任诉讼主管，法务团队重组\u003c/li>\n\u003cli>09:12｜Anthropic 公司向立法者推介人工智能安全法案\u003c/li>\n\u003cli>09:12｜【周六你需要知道的隔夜全球要闻：纳指跌超2% 热门科技股普跌；黄仁勋谈AI市场震荡“这一切都会过去”\u003c/li>\n\u003cli>09:13｜过去七天，费城半导体指数下跌超过 12%，逆向交易者估计已累计获得 320 亿美元的账面总收益。\u003c/li>\n\u003cli>09:13｜欧盟领导人正在支持一系列新的权力，以对抗强制性贸易行为，并可能切断其市场与中国等经济竞争对手的联系。\u003c/li>\n\u003cli>09:13｜由于短期内供应缓解的前景日益渺茫，布伦特原油价格自 5 月以来首次突破每桶 110 美元。\u003c/li>\n\u003cli>09:13｜特朗普、皮查伊甚至奥特曼都对特斯拉的飞行跑车赞不绝口\u003c/li>\n\u003cli>09:13｜人工智能
