2:43", "tags": []}}, "source_details": {"post:2026-10-13T13-21:fb561b3891a1": {"id": "post:2026-10-13T13-21:fb561b3891a1", "kind": "post", "title": "2026-10-13 13:21", "source_label": "帖子正文", "excerpt": "大摩——科技焦点 | 亚太：存储芯片——周期与超级周期 摩根士丹利指出，存储投资的核心并非精准择时或挖掘数据拐点，而在于市场奖励那些率先定价的投资者。AI既是一个算力问题，也是一个存储问题，因此本轮周期在结构上截然不同", "content": "大摩——科技焦点 | 亚太：存储芯片——周期与超级周期 摩根士丹利指出，存储投资的核心并非精准择时或挖掘数据拐点，而在于市场奖励那些率先定价的投资者。AI既是一个算力问题，也是一个存储问题，因此本轮周期在结构上截然不同；但进入后期，其周期性本质仍存，获利难度加大。 基本面坚如磐石，股价却需更为谨慎 AI存储超级周期已然确立，但市场有意识地拒绝为前所未有的盈利支付全额倍数。正如过往周期，市场怀疑高盈利的暂时性——存储股在周期顶部往往看似最便宜，因为分析师会将繁荣期的价格线性外推。超级周期的逻辑建立在“这次结构不同”之上，万亿市值已印证这一点；但股价自周期启动（2025年9月）以来已上涨9倍，区分资产质量与资产价格（即股价）变得至关重要。 结构性更高的AI长期增长叠加周期……本质仍是周期 不同之处在于，本轮周期斜率更陡峭（当前$/Gb较历史峰值高出近7倍）。市场可能出错，但市场价格本身是判断存储周期如何被感知的证据之一。两种看似矛盾的观点实则共存：一是“这次并无不同”；二是“下一轮下行幅度可能远小于以往，且底部高于2023年”。两者皆可能成立，因为存储超级周期真实存在，但并非周期性终结。因此，结构性更优的存储周期与具吸引力的股价未必同步，简单获利阶段已过。 周期导航：历史虽不简单重复，但常押韵 终结本轮超级周期的或许并非AI需求软化，而是供应追赶和/或需求消化。尽管增速放缓，存储价格在2027年前料保持坚挺，精确预判拐点不切实际。投资组合应构建足够的持久性，以抵御不可避免的周期性转折。 投资法则 • 上行阶段，估值宜慷慨；下行阶段则反之。 • 盈利预期宜乐观而非保守——涨价幅度在超级周期中常被严重低估；反之亦然。 • 在周期拐点前寻找退出点时，逆向思维至关重要。 超级周期≠周期性终结 三星3Q26E营业利润达800亿美元，为全球最高，超越英伟达（640亿美元），作为大宗商品销售商却占据AI服务器最昂贵组件（非逻辑芯片），实属罕见。然而三星与海力士股价较峰值低35%，以峰值盈利计算的远期市盈率仅3-4倍，低于历史峰值4倍，表明市场并不确信“这次不同”。尽管长期协议（LTA）承诺及周期性减弱预期存在，但盈利预测模型仍沿用旧有的盛衰周期。需求驱动的超级周期中，超额利润终将吸引新供应，对回报和股价产生必然影响。 “好、坏、现实”三重叙事 • 结构性差异：AI数据中心支出主导需求，端侧AI、物理AI、人形机器人、自动驾驶及太空AI数据中心接棒；产能数年售罄，多数锁定长期合同且含价格下限，部分LTA附带保证金；HBM市场2028年料增至1000亿美元。 • 供应回归风险：新产能终将到来，全年设备拉货与出货数据持续攀升。计算成本下降，竞争驱动成本曲线下移，均值回归在过往周期中从未缺席。中国是关键变量：长鑫存储（CXMT）快速扩张DRAM与HBM3，预计占中国HBM市场20%份额；长江存储（YMTC）全球NAND市占约12-13%，月产能20万片，国产设备占比45%。 • AI服务器内容量变化：GPU约占Vera Rubin集群成本一半，内存29%，网络/电源/散热等23%。向多机架扩展时，网络价值量显著提升，内存占比承压。 “两者皆可成立”的务实结论 股价9倍涨幅已定价绝大部分超级周期预期。当前亚洲存储股平均盈利上调幅度达432%，一致预期已按“前所未有的周期转折”定价。尽管超级周期真实，但股价与结构性改善的存储周期不再亦步亦趋。 后续推演 历史表明，存储公司自身极难预测拐点，管理层指引往往确认已知趋势。终结周期的总是供应追上或需求消化——当HBM、ABF、CoWoS封装产能足够，晶圆厂产出由缺转盈，超大规模企业暂停采购以消化库存（类似2000、2016、2019、2022年）。鉴于新产能建设周期，2026全年及2027大部分时间难现此景。 当前股价盘整符合超级周期后期特征。要实现持续上行，DRAM合约价需从当前水平再涨约70% QoQ，看似遥不可及；市场转而关注巨额资本回报。盈利修正广度（3个月平均）显示DRAM率先转弱，但AI计算板块仍强劲。 历史超级周期解剖 • 周期顶部估值反而低：4Q17 MSCI亚洲半导体12个月远期PE为13.3倍，4Q18跌至10倍。 • 股价“便宜”无法阻止强制卖出；板块见顶远早于盈利峰值。 • 当前PE较2018/19峰值高34%（半导体）和39%（硬件），但较2023/24周期峰值低14%和25%。 • 盈利上调周期不均：AI计算强劲，存储减速需数月。当前资产负债表与ROIC结构性优于2018/19。 繁荣的悖论 市场行为难测——无论最终结果如何，市场可能在不等待确认的情况下提前定价“峰值→新下行”。这种背离创造选股机会，也是该行股票推荐的基础。估值非未来回报良策，风险回报边际改善。管理层普遍乐观，依靠其预警下跌无效。半导体与存储永远具周期性。在利好下股价反复下跌时，宜退后一步重估。 股票策略 • 偏好：相对更看好AI计算与网络供应链，而非存储。选股标准：高质量特质、早周期商品（同比加速）、内容增长（新规格）或产品/单位增长。具体偏好：HV/DC、CCL、ABF、功率半导体等定价权强的领域。 • 回避：下游硬件股，因过度建设风险及输入成本（存储涨价）挤压毛利，且估值偏高。 渠道调研精要 • HBM：2027年价格大幅上涨，混合ASP预计同比+121%。HBM4约3.0-5.0美元/Gb，HBM4e超5美元/Gb。Rubin HBM爬坡慢于预期，Blackwell占2026年英伟达高端GPU出货78%。良率为硬约束，8-high较12-high良率高5个百分点，2027年将成主流配置。 • DRAM：4Q26合约价QoQ上调至10-15%（原3-8%），服务器需求为主驱，PC DRAM 2027年供应或降20%+，DDR4供应最紧。2026年DRAM资本开支约980亿美元（+82% YoY），2027年1500-1600亿美元（+60%），新产能2H27才释放。 • NAND：4Q26合约价QoQ上调至15-20%，eSSD加速至23-28%，QLC SSD因AI推理KV缓存需求扩大而普及。2027年eSSD与消费NAND分化加剧。 核心结论 存储超级周期由AI结构性需求驱动，但周期性并未消亡。当前股价已充分反映乐观预期，简单赚钱阶段已过。建议相对超配AI计算与网络，对存储股保持谨慎，精选具备定价权及早周期特征的标的。#文字观点", "publish_time": "2026-10-13 13:21", "tags": ["文字观点"]}, "post:2026-10-13T07-11:2aa56e659311": {"id": "post:2026-10-13T07-11:2aa56e659311", "kind": "post", "title": "2026-10-13 07:11", "source_label": "帖子正文", "excerpt": "盘前热点事件一、昨日热点并购：新华传媒、东百集团 AI短剧：德才股份 鼠疫：华北制药 电池：时代万恒 风电：天顺风能二、2026金融街论坛年会将集中发布系列金融改革发展政策2026金融街论坛年会新闻发布会在京举行。记者从发布会上了解到，2026金融街论坛年会将于10月19日—10月22日举行，采取“", "content": "盘前热点事件一、昨日热点并购：新华传媒、东百集团 AI短剧：德才股份 鼠疫：华北制药 电池：时代万恒 风电：天顺风能二、2026金融街论坛年会将集中发布系列金融改革发展政策2026金融街论坛年会新闻发布会在京举行。记者从发布会上了解到，2026金融街论坛年会将于10月19日—10月22日举行，采取“主论坛+平行论坛+专题大会+配套活动”的框架结构，主论坛活动由人民银行、金融监管总局、证监会、新华社、外汇管理局承办，将围绕人工智能技术演进下的经济治理、金融创新与央行决策，建设一流投资机构服务资本市场高质量发展，构建高质量金融服务实体经济新生态，全球新格局下跨境金融发展与合作等议题开展交流讨论。论坛年会期间，国家金融管理部门将集中发布系列金融改革发展政策。 中国人民银行行长潘功胜、金融监管总局局长丁向群、中国证监会主席吴清将出席2026金融街论坛年会并作主题演讲。 金融：新力金融、大智慧、瑞达期货、银之杰、赢时胜三、两岸历史题材AI系列短剧《那些年，他守护宝岛》重磅上线总台港澳台节目中心与视听新媒体中心（央视频）联合精心打造两岸历史题材AI系列短剧《那些年，他守护宝岛》，10月12日推出第一部《刘铭传》（共3集），讲述清末爱国将领、台首任巡抚刘铭传抵御法寇侵略、浴血保卫台、开发建设台的故事，生动诠释其爱国情怀与赤子之心。 AI短剧：德才股份、龙版传媒、慈文传媒、中视传媒 福建：平潭发展、海峡创新、福建水泥、国统股份四、Meta推出具备前沿级能力的Muse Wonder AI模型‌Meta称历经14个月攻坚，发布了一款名为Muse Wonder的全新人工智能模型，该公司表示，这是对其前代模型的一次重大跨越式升级。据称这款模型具备“前沿级能力”，在代码编写、处理金融或法律类问题等场景下，已经能和OpenAI的ChatGPT、Anthropic PBC的Claude等其他头部模型处于同一水准。开发者目前可通过Meta模型API和Muse Code接口调用Muse Wonder，该模型很快也将为Meta个人AI助手Muse的订阅版本提供底层算力支持。 AI代码：新炬网络、金现代、卓易信息、普元信息 AI金融：中科金财 AI法律：金桥信息五、电子布10月份涨价落地10月以来，电子布涨价再次落地，涨幅为1.5元/米（7628型号），电子纱G75上涨3000元/吨，薄布（2116、1080型号）上涨2.5元/米。10月12日，多家电子布头部上市公司回应记者称，涨价消息属实。7628型号的普通电子布涨价1.5元/米，涨价幅度为年内较高水平。相比厚布，薄布涨价力度更大。此轮涨价逻辑还是AI需求增加带动的，电子布供给有限，新建产能一般需要1年半的时间，行业产能集中释放预计要到明年年底，今年年底之前预计没有新的规模化产能释放出来。 电子布：宏和科技、中材科技、中国巨石、国际复材六、大摩：美国AI供电缺口或达77GW 有望催生2400亿美元市场摩根士丹利预计，2026年至2029年，美国数据中心新增电力需求将达到160吉瓦，考虑现有电网容量及已采购的发电设备后，仍将面临约77GW的供电缺口。这一趋势有望催生庞大的设备市场。大摩预测，截至2029年，美国分布式供电设备的潜在市场规模将达到约120GW，对应约2400亿美元的设备市场机会，其中约77GW来自数据中心尚待填补的供电缺口，约40GW来自工商业领域的新增需求。 电力设备：伊戈尔、京泉华、四方股份、金盘科技 算电协同：华电辽能、闽东电力、大唐发电、金开新能七、行业要闻1、国家铁路局印发《铁路科技创新十五五规划》。（神州高铁、晋亿实业） 2、央视财经：中国承包了全球超8成缝纫机，国产智能缝纫机全球下单。（杰克科技、中捷资源）信息源头加微信 WUXL3408 3、2026湾区半导体产业生态博览会（湾芯展）将于10月14日-16日在深圳举办，新凯来参展。（凯美特气、同惠电子） 4、美国AI算力租赁现货价格是长协的两倍。AI算力短期现货租赁价格高达每吉瓦400亿至500亿美元/年，而长期合同价格仅为200亿美元/年。（利通电子、行云科技） 5、税务总局出台关于调整部分产品出口退税政策的公告，工程机械未列入出口退税调整名单。（山推股份、厦工股份） 6、百川盈孚数据显示，10月12日，氯化亚砜涨4.25%，近一月累计涨幅近19%。（凯盛新材、金禾实业） 7、江淮汽车回应尊界SUV给赛力斯做：这是不实消息。 8、英伟达与思科联合推出新型可插拔光模块外形规格USFP。 9、新能源汽车的增值税出口退税率由13%下调至9%。#文字观点", "publish_time": "2026-10-13 07:11", "tags": ["文字观点"]}, "post:2026-10-13T12-35:20800b9f4acf": {"id": "post:2026-10-13T12-35:20800b9f4acf", "kind": "post", "title": "2026-10-13 12:35", "source_label": "帖子正文", "excerpt": "领导好～以下为腾讯26Q3数据跟踪，国内游戏稳健、广告维持高增、近期关注混元模型迭代及小微测试进展 #🎮游戏：Q3国内大盘流水yoy约+9%、其中手游/端游分别+8%/+11%、高基数下仍具韧性。①国内游戏：Q3《王者荣耀》176亿/yoy+4%", "content": "领导好～以下为腾讯26Q3数据跟踪，国内游戏稳健、广告维持高增、近期关注混元模型迭代及小微测试进展 #🎮游戏：Q3国内大盘流水yoy约+9%、其中手游/端游分别+8%/+11%、高基数下仍具韧性。 ①国内游戏：Q3《王者荣耀》176亿/yoy+4%；《和平精英》65亿/yoy-2%；《三角洲行动》双端84亿/yoy+50%（国庆峰值DAU 5800万，全年流水预计超320亿目标）；《金铲铲之战》28亿/yoy+6%；《洛克王国世界》23亿。 ②重点新游：《王者万象棋》（9/10上线，首月流水3.1亿、首月DAU 1300万/国庆1920万，预计首年流水30亿，目前商业化偏克制）；《异人之下》（预计26年底）；《穿越火线：虹》（预计26年底）；《粒粒小人国》《怪物猎人》预计延期至2027年。 #📣广告：26Q3yoy约19%-20%、持续领先行业。 ①行业侧：网服（AI应用投放）、短剧（9月+50%、IAA模式占比超七成）、直营电商、房产、旅游增长较快。②广告位：视频号广告Q3yoy+40%、DAU 6.7亿/yoy+6%、时长74分钟、Ad Load 5.6%；朋友圈yoy+13%、小程序yoy+15%。③AI继续提效投放：Rank Up推荐系统（基于混元，优化标签体系、提升点击率同时大幅降低算力消耗）已在微信视频号、公众号&小程序、朋友圈三大流量场景实现100%全量上线、智能化投放工具AIM+计划数渗透率提升至60%、消耗渗透率约35%，新推出广告场景Agent AD Bot，提高广告主投放效率。 #☁AI&云业务：WorkBuddy用户及收入环比继续增长、关注近期混元模型迭代情况 ①腾讯云&WorkBuddy：预计腾讯云Q3yoy+20-25%；WorkBuddy 9月总日均交互DAU 613万（C端504万/B端109万）/环比约+18%，MAU 2140万，总收入1.61亿/环比约+18%，付费企业数13,320家（8月10,350家）；后续渗透率提升+积分补贴减少+混元结束免费有望带来更大收入弹性。 ②混元模型：Hy4 preview 8/28发布并开源；Hy4正式版（770B总参数/49B激活）预计10月中下旬发布、能力超智谱GLM-5.3；下一代原生多模态版本（1T+参数）预计11月-12月，重点增强游戏开发、Agent、代码能力，有望超Kimi K3。 ③微信\"小微\"灰测比例已达10%、覆盖约1亿用户、年内有望更大规模放量。#【观点更新】​​考虑AI投入前置，我们预计26Q3收入yoy+9%、经调整净利润-3%，下半年出现单季度利润转负，与目前市场预期基本一致。预计2026-2027年经调整净利润2660/2754亿元，对应资本开支假设为2000亿/2500亿，对应当前估值12.5/12.1x，仍在底部区间震荡。近期建议关注：Hy4正式版发布节奏、三季报业绩兑现情况（11.18日）、微信\"小微\"测试进展、下半年CapEx投入情况、回购趋势等。 🎁专家调研及第三方数据仅供参考，详细数据库及更多观点请联系：国海海外 陈梦竹/尹芮#文字观点", "publish_time": "2026-10-13 12:35", "tags": ["【观点更新】​​", "文字观点"]}, "post:2026-10-13T08-52:db090a97311f": {"id": "post:2026-10-13T08-52:db090a97311f", "kind": "post", "title": "2026-10-13 08:52", "source_label": "帖子正文", "excerpt": "现价强#call拓荆科技：新接订单将大幅上修，ALD等产品快速放量【华西机械】 #1、26年新接订单超预期，预计将大幅上修！1）设备超级订单大年正在兑现，#我们跟踪到26H1公司新接订单翻倍以上，推测Q3环比提升明显，大幅超市场预期！", "content": "现价强#call拓荆科技：新接订单将大幅上修，ALD等产品快速放量【华西机械】 #1、26年新接订单超预期，预计将大幅上修！1）设备超级订单大年正在兑现，#我们跟踪到26H1公司新接订单翻倍以上，推测Q3环比提升明显，大幅超市场预期！2）产业跟踪下来：26H1 CC订单以一二期技改为主，26H2三期订单开始批量落地；26年CX上海框架协议订单大部分将转化为PO订单，北京厂等持续下单；26年晋华等H系存储保守3-4w招标订单量级；同时考虑到先进逻辑、成熟制程以及先进封装等订单将显著提升，#我们预计26H2公司新接订单环比仍将显著提升，参考盛美全年订单体量，26年公司签单将好于我们先前乐观预判（150亿），有望大幅上修！ #2、存储扩产加速，27年订单将延续高增势头！1）27年大陆存储扩产加速，以框架协议口径看，两存合计框架协议订单口径有望达到40W片级别！叠加CC三期、CX上海厂剩余PO订单，同时考虑到晋华等H系持续大扩产，#我们判断27年存储端实际落地PO订单预计呈现翻倍增长势头！2）公司PECVD、ALD、SACVD、HDPCVD 以及 Flowable CVD等在存储客户已拿到领先市场份额，#我们预计NAND/DRAM单万片的订单量级可达12亿/8亿，同时考虑逻辑、先进封装等积极扩产规划，#我们预计27年公司新接订单将延续高增势头，目前市值对应估值已经不到5PS。 #3、ALD等产品份额大幅提升，先进封装市值期权并未体现！1）26年预计新接订单ALD 占比超过10%：#其中PEALD份额大幅提升，推测26年其存储端份额已经达到40-50%；#Thermal ALD已经拿到批量订单，且在DRAM客户实现快速导入，而CX的4F2架构，将显著提升PEALD机台用量，市场显著低估公司ALD成长斜率！2）国内首条3D先进封装量产线（星辰技术）通线、华为τ定律芯片已经量产，先进封装产业趋势确定！#公司产品涵盖W2W、D2W、熔融键合等先进键合及配套的量检测等九类产品，收购尚积半导体，#形成覆盖薄膜沉积、刻蚀、键合、检测的成套三维集成设备产品线，未来有望再造一个拓荆！投资建议：现价建议各位领导重点布局，维持目标市值4000亿！#文字观点", "publish_time": "2026-10-13 08:52", "tags": ["文字观点"]}, "post:2026-10-13T08-52:b565f7f42ef2": {"id": "post:2026-10-13T08-52:b565f7f42ef2", "kind": "post", "title": "2026-10-13 08:52", "source_label": "帖子正文", "excerpt": "【微导纳米】拟定增募资49亿，加码薄膜沉积设备扩产研发！#拟定增募资49亿，落地武汉协同存储核心客户 ——公司拟定增募资不超过49.44亿元，分别投向无锡先进半导体设备产业化升级迭代项目（7.29亿元）、华中先进半导体设备产业化项目（2.89亿元）、尖端薄膜沉积技术研发中心项目（32.25亿元）及补", "content": "【微导纳米】拟定增募资49亿，加码薄膜沉积设备扩产研发！ #拟定增募资49亿，落地武汉协同存储核心客户 ——公司拟定增募资不超过49.44亿元，分别投向无锡先进半导体设备产业化升级迭代项目（7.29亿元）、华中先进半导体设备产业化项目（2.89亿元）、尖端薄膜沉积技术研发中心项目（32.25亿元）及补充流动资金（7亿元） ——无锡项目及华中项目（位于武汉，面向3D NAND等存储制造领域）建设周期均为36个月，建成后公司将提升规模化生产及交付保障能力，并更贴近先进存储核心客户以开展协同研发，加快设备验证迭代及量产导入。尖端薄膜沉积技术研发中心项目为前二者的子项目，与华中项目实施主体同为武汉子公司。 #深度绑定存储核心客户、充分受益扩产大趋势 ——公司新增订单主要来源于 NAND 和 DRAM 头部客户，深度受益于国内存储芯片的扩产浪潮。2026上半年，新签订单规模再创新高，半导体占全部新签订单比重达85%，且增量主要来自存储领域客户；截至2026年6月，#公司半导体设备在手订单达26.98亿元。 ——公司ALD产品涵盖主流 ALD 薄膜材料及工艺，在高介电常数材料、金属化合物薄膜等领域实现产业化应用，CVD设备在硬掩膜等关键工艺领域已实现产业化突破。2026上半年，公司多款ALD和CVD设备获得重点客户验证和量产导入，核心产品的量产规模持续扩大。#光伏业务筑底光伏行业在政策引导与技术创新等带动下，逐步筑底，公司加速现有技术升级和 XBC、钙钛矿、钙钛矿叠层等新型电池技术研发，把握市场机遇。 风险提示：行业景气度不及预期；下游扩产不及预期。#文字观点", "publish_time": "2026-10-13 08:52", "tags": ["光伏业务筑底", "文字观点"]}, "attachment:files/FCC与中国光模块：65%门槛传闻是否靠谱？后续将如何演进？.docx": {"id": "attachment:files/FCC与中国光模块：65%门槛传闻是否靠谱？后续将如何演进？.docx", "kind": "attachment", "title": "FCC与中国光模块：65%门槛传闻是否靠谱？后续将如何演进？", "source_label": "其他", "excerpt": "FCC与中国光模块：65%门槛传闻是否靠谱？后续将如何演进？", "content": "FCC与中国光模块：65%门槛传闻是否靠谱？后续将如何演进？ 65%门槛出自卖方推演，按供应商国籍计算。FCC已用写法先看组装地，海外组装即算外国生产；美国组装又因DSP产自海外，难以通过成分测试。这使得新型号只能走有条件放行，获批后难以换料。其中，中际旭创首当其冲，国产激光器的压力落在下次换型。 同一颗博通的DSP芯片，换一种口径，就从美国成分变成了外国部件。十月初流传的“65%门槛”用的是前一种口径：来自美国公司的物料价值只要达到65%，中国组装的光模块仍可进入美国。FCC在已按产地列名的产品上用的是后一种口径，而且在计算比例之前，先看的是另一件事。 一、65%门槛原本按供应商国籍算，三次转述后却变成了按美国制造算 这一说法的源头，是10月1日一份海外卖方的政策推演。推演的核心假设有三条：FCC对光收发器的限制可能从3.2T一代开始；中国制造的模块只要物料价值中至少65%来自美国公司，仍可进口；业内近期已被要求在3.2T大规模上量之前，提交本土或友岸制造路线图。这里的计入对象是供应商国籍，美国公司设计的芯片无论在哪里生产，都算美国成分。按这一口径，门槛容易达到：笔者在9月13日报告中测算，800G光模块的物料成本中，DSP与光芯片各占三成上下，粗略计算，两者都向美国公司采购时，美国成分已接近六成，其余物料中再有一小部分来自美国公司，即可达到65%。 中文转述改动了计入对象，三跳之后，结论竟然随之反转。10月2日午后，台湾财经媒体把这句话写成“65%的物料价值来自美国本土公司”，中文转述里第一次出现“本土”二字。当晚，微博财经博主把标题改成“65%要用美国的光芯片”，正文却仍写中国组装的模块可进入美国。10月3日，自媒体文章进一步写出“将国产链供应商替换为美国供应商”。三跳之后，计入对象从“谁的公司”变成“在哪里制造”，结论也从“仍可进口”变成“替换供应商”。本文判断，改写之所以集中到光芯片，是因为主流光DSP本来就来自博通、Marvell这类美国公司，在原口径下能调整的只剩激光器，市场的压力于是落到了国产光芯片身上。 “3.2T”与“友岸”两个细节，在源头就已出现。8月初外媒报道的FCC措施只提到中国的“新型号”光收发器，“3.2T”是推演对“新型号”的解读。推演提到的“友岸”路线图，则与FCC已发布的放行要件不一致，后者写的是在美国本土建立或扩大制造。既然转述改的是计入对象，判断传闻能否成立，就要回到FCC已经用过的写法上。 二、FCC先看组装地：海外组装直接算外国生产，65%只对美国组装起作用 涵盖清单已三次整类列入“外国生产”的产品，划线标准都是产地。2025年12月的无人机、2026年3月的消费级路由器、2026年7月的逆变器与先进机器人，都以“外国生产”整类列入。路由器 (DA26-278) 与逆变器 (DA26-786) 的认定原文都写明“不论生产者国籍”。这意味着列名针对的是产品本身，美国公司在海外生产的产品同样在内。 FCC用过的“外国生产”有两种写法。路由器的认定把设计、开发、制造、组装中任一主要环节都算作“生产”，有一个环节在海外就属于外国生产，不设成分比例。逆变器与机器人的认定则把“外国生产”定义为不符合联邦采购规则 (FAR 25.101(a))所称的“国内终端产品”，判断分两步：第一步要求在美国制造，第二步要求美国产部件成本超过全部部件成本的65%，2029年起交付的产品提高到75%。FCC在配套问答中明确，联邦采购中的商用现货例外在这里不适用；光模块若沿用这一写法，即便属于商用现货，也要做成分测试。65%只出现在后一种写法里，而且排在“美国制造”之后。 国内终端产品标准此前出现过，但用途不同。2026年1月起，符合这一标准的无人机及其关键部件被列为限期豁免，期限后来延至2028年1月1日；逆变器与机器人的列名，则是第一次把这一标准写进“外国生产”的定义本身。也就是说，这一标准原本用来划定豁免范围，现在成了外国生产的定义，FCC语境里的65%正是从这里来的。 在两种写法下，海外组装的模块都直接归入外国生产。路由器写法把组装列为主要环节之一；逆变器写法下，中国厂商在泰国等地的海外产线停在“美国制造”这第一步，成分比例要到第二步才起作用。传闻其实把两条通道并成了一条：65%划定的是“不算外国生产”的范围，已经算作外国生产的产品，只能靠有条件放行进入美国。笔者在10月3日报告中判断，按类别列名时，美国设计、海外制造的模块同样算外国生产，——判断在两种已用写法下都成立。海外产线的归类已经确定，剩下的问题是在美国组装能否通过成分测试。 三、美国组装也难过65%： DSP在海外制造， 2029年起门槛还要升到75% 成分测试只看一级部件，每个部件按自身的制造地归类。按联邦采购规则，外购部件按取得成本计，自制部件按制造成本计、不含利润；2006年的规则说明把计入范围限定在一级部件，产地不明的部件按外国计。放到光模块上，DSP、激光器、驱动与跨阻放大器、光学组件、PCB与外壳分别按各自的制造地计入。这使得判断的关键落在价值占比高、产地又难以改变的部件上。 DSP是成分测试的关键部件。据调研了解，目前主流的800G与1.6T光DSP都在台积电流片，封测也主要在海外完成，本文判断应按外国部件计入；而在推演的口径里，同一颗芯片因设计方是美国公司而计入美国成分。考虑到不同速率与方案的差异，按DSP占物料成本两成到三成的区间粗略计算，其余部件需要有八成到九成以上产自美国本土，美国产部件成本才能超过65%；2029年起交付的产品门槛升到75%，DSP占两成时其余部件须九成以上产自美国，占两成半及以上时，即便其余部件全部来自美国本土也无法超过门槛。 光芯片的占比口径不一，上述测算依然成立。笔者9月13日报告的测算是DSP与光芯片各占三成上下；东山精密10月8日则称，其自研光芯片在模块物料成本中占比不超过10%。本文推测，差异主要来自计价方式：自研芯片按制造成本计，外购芯片按采购价计，后者包含供应商的利润。上述测算只用到DSP的占比，光芯片无论占一成还是三成，都属于DSP以外的其余部件，要和其他部件一起达到八成到九成以上的美国本土比例；在75%门槛下，即便按一成计，光芯片只要从海外采购，美国组装方案就无法达标。 门槛升级的年份，恰好落在3.2T的放量期。中际旭创2025年年报称，3.2T光模块有望从2028年起逐步起量。联邦采购规则按交付年份适用门槛，2029年起交付的产品适用75%。如果FCC沿用这一口径，65%只对应3.2T起量的第一年，此后美国组装方案面对的是75%。FCC目前还没有说明门槛按申请日、授权日还是交付日适用。 美国本土的模块产能还在起步阶段。AAOI管理层称，休斯敦地区新厂房投用后，800G与1.6T模块的月产能最多可达约70万只；Coherent得州Sherman的磷化铟扩产项目6月获得芯片法案最高5000万美元的资助意向书。据调研了解，2027年行业800G与1.6T的供给合计约1.5亿至1.6亿只，粗略计算，AAOI这一产能约占2027年行业月供给的5%到6%。海外产线停在第一步，美国组装卡在第二步，美国本土产能的规模又有限，这使得3.2T一代的新型号进入美国，现实可行的路径只剩有条件放行。 四、新型号只能走有条件放行，物料表与本土化计划一并受审 有条件放行按型号或产品类别审批，审批结果即为最终结果。按已发布的放行指南，申请材料包括持股5%以上的受益所有人与外国政府影响、每个部件与设计的原产国、按国别统计的价值与数量集中度，以及有时间表并按季度汇报的美国制造计划。机器人由战争部审批，逆变器由战争部或国土安全部审批，指南未设审查时限，机器人与逆变器的申请截止于2028年1月1日。有效期也与本土化挂钩：路由器单次放行最长18个月，续期须提交本土化计划的执行进度；无人机放行自7月起不再设终止日，但以履行本土化计划为前提（DA26-768）。违反放行条件或虚报信息，放行就会被终止，产品重回涵盖清单，且不得再申请。 传闻里的“导入本土供应商”，对应的是放行要件中有时间表的美国制造计划。指南写明的是在美国建立或扩大制造，泰国与墨西哥产能在审查中仍计入海外供应，推演所说的“友岸”路线图只能作为海外供应披露。也就是说，放行施查看的是美国本土的产能承诺，供应商来自哪一国只是披露内容。 放行之后，物料表难以再改。放行以申请时陈述的物料表与本土化计划为前提，偏离陈述可导致放行终止；按国内终端产品认证的设备，第三次报告与命令第81段规定事后不得以更换部件的方式失去这一地位；第三次拟议规则还提出，许可变更不得把美国产部件换成非美国产部件，并要求硬件物料清单披露各生产者与生产地点所占的部件价值比例。本文判断，获批时的物料表难以再朝“降本换国产料”的方向改动，换料或需重新申请。外媒报道的FCC措施针对“新型号”，800G与1.6T的改版若更换DSP或激光器，也可能被视为新型号而需要申请放行。 认证环节的测试也在收紧。第三次拟议规则提出，涵盖清单所属行业的设备一律走认证；FCC又于10月7日宣布，将在10月29日表决只认可美国及提供互惠待遇经济体的测试实验室，若获通过，2028年12月起生效。路透援引FCC主席的说法称，2025年82%的电子设备在中国测试。光收发器一旦列名并改走认证，新型号的测试也需移出中国，时间点落在3.2T起量与门槛升至75%之间。这使得2028年前后，新型号要同时面对放行、测试与成分门槛三道约束。 放行名单按所有权划出了界线。截至10月2日，按生产地列名的四类产品中，无人机至少19家主体获得放行，路由器至少21家，机器人3家，逆变器尚无获批；机器人类最快一例从列名到获批约6周。路由器的21家中有9家为台湾地区厂商或其美国子公司，华硕9月9日获批，有效期至2028年3月6日。获批主体分布在美国、欧洲、台湾地区、韩国与印度等地，还没有中国大陆企业。本文判断，放行通道对台湾地区厂商是开放的，大陆企业的门槛落在所有权审查上。投资含义也就落在谁能拿到放行，以及拿到之后物料表怎么定。 五、投资含义：中际旭创首当其冲，国产激光器的压力落在下一次换型 以上推论以光收发器按类别列名为前提，这一步目前还没有发生。对应的国家安全认定也尚未作出。中国厂商约占2026年全球光模块代工产能的56%（TrendForce），据调研了解，北美云厂已向美方表达供应不能受影响的立场。这使得美方一次性切断供应要付出明显代价，本文推测，即便列名，执行方式也将以按型号放行为主，冲击落在新型号上，已授权型号进入一段有期限的过渡期。 中际旭创首当其冲。公司对北美的供货规模在国内厂商中居首，而美国战争部2026年6月更新的1260H名单已将其列入，联邦公报通告称其由国务院国资委间接持股、与工信部直接关联。机器人类的有条件放行恰好由战争部审批，若光模块沿用这一安排，名单的发布方与放行的审批方将是同一部门，本文判断，中际旭创新型号的放行审查面临结构性障碍。受影响的是面向北美的3.2T与更换部件的改版；已授权型号对应前述的过渡期，国内出货也不受这套规则约束，这两部分未受直接波及。 新易盛的新型号同样要走放行，名单层面的压力来自法案与建议名单。新易盛的泰国产能同样归入外国生产。它与中际旭创一并在参议院9月24日提出的S5548法案中被点名，但该法案修订的是2023财年国防授权法第5949条，只约束联邦政府采购，非关键系统可获例外，禁令在法案通过五年后生效，直接收入敞口有限。新易盛不在6月更新的1260H名单中，但据彭博报道，战争部副部长致国会的建议名单已包含新易盛，这份名单若落地，新易盛新型号的放行审查将面对与中际旭创相同的障碍。 东山精密的处境取决于定义写法与所有权两个变量。东山精密2026年上半年光模块收入约占营收的19%（半年报）。据调研了解，索尔思保留了美国的设计团队，若第三次拟议规则按字面的“且”定稿，美国设计的产品可能不算外国生产。本文判断，“合规空间充足”的说法以只看成分的口径为前提。按FCC已用的写法，台湾产线与泰国产线一样属于外国生产，豁免只能来自有条件放行，而放行审查要看所有权，东山精密的控股方在中国大陆。 国产激光器的压力落在北美导向模块的下一次换型上。放行审查要求按国别披露部件价值，获批后的物料表又难以再改，本文推测，北美导向的下一代型号在申请阶段就倾向选用美国或日本激光器。笔者在9月23日报告中分析，国产激光器对北美的出口集中在补缺口订单，放行机制收窄的正是这部分出口。TrendForce预计，中国厂商的EML与CW激光器产能占全球比重将由2025年的约16%升至2028年的约28%，新增产能主要依靠国内市场消化。源杰科技港股招股书显示，其2025年第一大客户占收入的53.4%，大客户北美新型号换料会直接传导到源杰；据调研了解，长光华芯的100G EML已通过北美云厂认证，其北美份额同样取决于客户放行时的物料表。短期来看，据10月9日的媒体报道，长光华芯称国内800G与1.6T光芯片仍处于紧缺状态，这使得当期出货不受影响，压力集中在下一次换型。 天孚通信的风险取决于列名范围，美方厂商的受益受产能约束。天孚的光引擎与无源器件作为一级部件出现在客户物料表里，按产地计入成分；若列名范围像无人机那样把“关键部件”一并纳入，光引擎可能被直接覆盖。美方一侧，AAOI与Coherent在美国有产能和本土化计划，在放行审查中处于有利位置，但本土产能规模有限，本文判断其受益主要体现在议价上。 六、证伪看定义写法，跟踪看放行名单与DSP产地 本文判断在三种情形下需要修正。第一，认定文本采用传闻口径，只看成分、不问组装地，本文判断被推翻。第二，第三次拟议规则把“在外国生产”拟定义为“不属于国内终端产品，且在外国设计或开发”，联邦公报文本以“either”起句、以“and”连接两项，语义存在矛盾；若按字面的“且”定稿并用于光模块，美国设计、海外组装的模块将不算外国生产，第二节的相应判断需要修正，中国设计的产品不受影响。第三，放行指南若接受友岸产能作为本土化计划，第四节的判断需要修正。 跟踪看五个信号。一是光收发器的国家安全认定与涵盖清单更新，路由器与逆变器均由公共安全与国土安全局以公告直接列名；二是10月29日对测试实验室规则的表决、11月19日与12月17日的公开会议，以及第三次拟议规则的后续命令；三是放行名单，包括首个中国大陆主体获批、逆变器首例获批、2027年10月起路由器首批放行陆续到期后的续期，以及无人机放行是否出现因未履行本土化计划而被终止的案例；四是FCC对65%与75%适用时点的说明；五是博通、Marvell的光DSP能否转到美国本土流片与封测，以及去掉模块内DSP的NPO形态在3.2T一代的占比，这两项都会改变第三节的测算。 七、风险因素 上行风险，即本文判断偏悲观的情形。光收发器迟迟未列名，美方顾及自身供应而推迟行动；列名采用只看成分的口径；中国大陆主体获得放行先例；已授权型号的过渡期超出预期。 下行风险，即本文判断偏乐观的情形。列名范围延伸到光引擎、激光器等关键部件；§2.939(e)被提前用于收回已授权型号；1260H名单与放行审查直接挂钩；S.5548的适用范围扩展到商业采购；测试实验室规则提前生效，或扩展到自我声明的授权路径。 微信 WUXL3408", "status": "extracted"}, "post:2026-10-13T08-47:397b867951a0": {"id": "post:2026-10-13T08-47:397b867951a0", "kind": "post", "title": "2026-10-13 08:47", "source_label": "帖子正文", "excerpt": "摩根大通‑中国汽车产业：欧盟政策动向 —— 暂时性停火达成初步协议，但后续仍存在较多谈判空间：据路透社消息，中欧双方于 10 月 9 日达成初步协议与共识，中国计划在未来四年将面向欧盟的混动汽车（HEV）、插电混动汽车（PHEV）出口量削减一半，同时欧盟将可以持续获取来自中国的稀土等关键原材料。欧盟", "content": "摩根大通‑中国汽车产业：欧盟政策动向 —— 暂时性停火达成初步协议，但后续仍存在较多谈判空间：据路透社消息，中欧双方于 10 月 9 日达成初步协议与共识，中国计划在未来四年将面向欧盟的混动汽车（HEV）、插电混动汽车（PHEV）出口量削减一半，同时欧盟将可以持续获取来自中国的稀土等关键原材料。 欧盟将在即将于 10 月 15‑16 日召开的欧洲理事会峰会上讨论并敲定该政策提案。 我们对这一积极进展持肯定态度，该结果降低了爆发全面贸易战的可能性。 10 月 9 日达成的初步协议，将欧盟针对中国插电混动汽车（PHEV）的政策，从此前的关税配额制度（TRQ，即配额内出口量执行标准 10% 关税，超出配额部分征收惩罚性关税）转变为双边自愿出口限制协议（VER），管控范围还新增覆盖混动汽车（HEV）。 欧盟将在 10 月 15‑16 日确定两项内容：第一，自 2027 年起年度出口减量目标的核算基准与统计方式；第二，如何建立最低进口价格（MIP）机制，遏制中国整车公司可能出现的低价竞争行为。 受影响最大的对象：在其他条件不变的前提下，当前对欧混动、插混车型出口业务占比高的中国整车公司受到冲击最为显著，自 2027 年起相关出口规模将首先放缓，2027‑2030 年出口量将受到上限约束或者直接削减，最终结果取决于欧盟在 10 月 15‑16 日后出台的正式措施。 欧盟官员预估，中国混动、插混车型的总出口减量将达到数百万台。 各整车公司层面，比亚迪对欧业务敞口最高源头内容加微WUXL3408（包含纯电、插混，占其总出口规模的 30%‑40%），其次为奇瑞汽车（约 25%）以及上汽。 其余公司目前对欧混动、插混业务敞口有限甚至没有相关业务：例如吉利 2025 年才进入欧洲市场，业务聚焦纯电车型，纯电车型受反补贴法案管辖；零跑汽车通过与斯特兰蒂斯成立的合资公司销售纯电以及增程车型；小鹏汽车同样以纯电产品为主，现阶段出口规模较小；蔚来、理想汽车以及长城汽车，在欧洲市场业务规模很小甚至尚未布局。 10 月 15‑16 日欧洲理事会峰会结束后需要重点关注的事项：第一，欧盟如何界定并测算 2027‑2030 年的年度出口减量目标。 我们判断测算方式将综合两方面，一方面是欧盟自身对于 2027‑2030 年中国混动、插混车型出口规模的预测，另一方面是欧盟希望将中国混动车型在欧盟市场份额，从当前 30% 以上压低至 15% 的政策目标。 年度出口配额确定之后，中国需要在各家整车公司之间分配配额。 我们认为配额初期将依据各家公司近期在欧洲市场混动、插混车型的实际销量进行分配，后续会做定期调整。 现阶段混动、插混销量较高的公司，在出口总配额受限的前期阶段可以拿到更高额度，主要包括比亚迪、奇瑞汽车、上汽。 应对策略 —— 本地化生产：在三家对欧混动、插混业务敞口最高的整车公司之中。 奇瑞汽车的处境相对最优，其收购原日产资产改造的西班牙工厂已经投产，2025 年产能 7 万台，2026 年产能提升至 15 万台。 比亚迪匈牙利工厂计划于 2026 年 11‑12 月正式投产，将在 2027 年末至 2028 年上半年实现产能爬坡至满产，设计产能 15 万台。 上汽目前在欧盟没有生产基地，近期宣布将在西班牙建设工厂，规划年产能约 12 万台，预计 2028 年完工。 我们预估，奇瑞、比亚迪的欧洲工厂，2027 年可以贡献自身欧洲市场总销量（纯电 + 插混）的 10%‑15%；工厂作为独立法人主体，在投产爬坡的首年将会处于亏损状态。 欧盟的政策目标以及各项政策工具：站在策略角度，我们提醒投资者留意欧盟汽车相关政策带来的盈利冲击以及估值层面的影响。简单来说，欧盟计划对中国整车公司实施下述政策限制。 第一，关税：自 2024 年末起针对纯电车型征收平均约 30% 的反补贴关税。 第二，非关税工具即《产业加速器法案》（IAA），该法案设立覆盖汽车、电池等多个行业的市场准入规则，也就是 “欧洲制造” 框架，整车与电池的本地化生产要求均被纳入法案。 第三，最低进口价格机制（MIP）：该方案于今年早些时候提出，现已纳入自愿出口限制协议（VER）。最低进口价格的计算方式为历史到岸价格（成本、保险费、运费）乘以（1 + 标准 10% 关税 + 企业单独反补贴税率），设立该机制目的是避免中国整车公司采取激进的低价竞争策略。 第四，配额以及市场份额上限，现已整合进自愿出口限制协议。 除此之外，欧盟近期在《产业加速器法案》框架下，将日本、韩国整车公司列为 “可信合作伙伴”，面向采购日韩车型的消费者提供补贴与激励政策；同类激励政策暂不面向中国汽车，后续结果取决于中欧之间谈判进展。 除拉拢日韩之外，欧盟还敦促英国对中国新能源汽车征收同类关税。英国已经成为比亚迪、奇瑞汽车、上汽等中国品牌越来越重要的海外市场，我们将持续跟踪事态发展。 投资建议：考虑到多重因素，我们对 2027 年中国汽车行业保持谨慎态度。 风险包含两点，第一是政策不确定性，涵盖国内新能源汽车补贴、欧盟政策演变、出口增值税退税率下调；第二是盈利下行风险。 在悲观情景假设之下，也就是 2027 年国内汽车需求持续走弱、存储芯片等原材料成本再度上涨 20%‑25%、欧盟以及英国进一步出台关税或者出口规模限制、2027 年二季度或者下半年出口增值税退税率下调 4%，我们不能排除整车公司 2027 年整体利润相比 2026 年持平甚至下滑的可能性。 待上述政策不确定性消除之后，我们会更新盈利预测。 在此背景下，我们的配置偏好如下：第一，重卡板块优于乘用车板块，看好中国重汽；第二，选择估值压力不高的整车公司，例如奇瑞汽车；第三，布局长期行业整合的受益标的，如广汽汽车，但我们判断该公司盈利实质性改善要等到 2027 年下半年至 2028 年。#文字观点", "publish_time": "2026-10-13 08:47", "tags": ["文字观点"]}, "post:2026-10-13T08-46:bbc4a8261d53": {"id": "post:2026-10-13T08-46:bbc4a8261d53", "kind": "post", "title": "2026-10-13 08:46", "source_label": "帖子正文", "excerpt": "【中信证券】2026年10月13日晨会精选 1【汽车及零部件：出口退税下调，自主出海趋势不改】 自2027年4月1日起新能源汽车增值税出口退税率由13%下调至9%，市场对此已有预期。参考光伏、电池经验，退税率下调后龙头公司90个交易日股价普遍回调，短期或扰动情绪", "content": "【中信证券】2026年10月13日晨会精选 1【汽车及零部件：出口退税下调，自主出海趋势不改】 自2027年4月1日起新能源汽车增值税出口退税率由13%下调至9%，市场对此已有预期。参考光伏、电池经验，退税率下调后龙头公司90个交易日股价普遍回调，短期或扰动情绪；我们预计头部车企可通过终端涨价、经销商分担、海外建厂对冲影响。长期看2026H1汽车出口531万辆（同比+53%）、8月单月出口101万辆（同比+65.3%），新能源出口占比连续三月超50%，税收政策不改优质自主车企全球竞争力，持续推荐比亚迪、奇瑞汽车、吉利汽车、长城汽车等。 2【宏观经济：化债收官在即，下半场的改革与影响】 我国10年化债将于2027-2028年收官验收，化债支持政策相继到期，地方需自主腾挪更多资金滚续债务，预计中央适时动用地方债结存限额缓解压力，城投融资成本整体低位、结构或分化。下半场两条主线：清欠账款预计加速，中小企业及建筑、环保、医疗受益较多；盘活国资收益，若\"十五五\"国企ROA修复至去产能后水平，财政贡献或达1.5万亿元、相当于宏观税负率提高约1个百分点。宏观方面中欧就混动汽车贸易达成谅解。 3【量化策略：港股打新收益下滑，精选项目仍是关键】 2026Q3港股IPO发行仍高热度：截至9月共114个项目、募资3856亿港元，同比分别+70%、+105%，A2H占比升至33%；但打新收益显著下滑，季度破发率达45.2%，首日收益均值、中位数降至17.8%、0.0%，主因发行估值走高叠加二级市场偏弱。当前排队项目386个（A2H 131个），储备仍丰富。我们认为二级市场弱势下打新难度上升，但精选项目仍有较好收益：锚定投资者重在项目情绪，基石投资者重在个股深度研究。 4【银行业：稳市信号明确，板块资金面乐观】 国庆节后首周避险资金流入银行，板块逆势跑赢主要指数；证监会召开资本市场和金融形势专家座谈会，稳市机制建设、中长期资金入市与分红回购释放明确稳预期信号。资金面上，重点宽基ETF已连续四周净申购、累计约266亿元，南向资金节后两日净买入57.8亿元。基本面看三季度及全年息差与资产质量有望保持稳定；中期看板块步入风险周期尾部，ROE一阶导已改善，预计今明年ROE企稳于8-9%，有望从\"高股息防御资产\"向\"高确定性权益资产\"重估。#文字观点", "publish_time": "2026-10-13 08:46", "tags": ["文字观点"]}, "post:2026-10-13T09-32:34410db09e5c": {"id": "post:2026-10-13T09-32:34410db09e5c", "kind": "post", "title": "2026-10-13 09:32", "source_label": "帖子正文", "excerpt": "巴黎车展 & 中欧混动车贸易 & 出口退税退坡观察 -20261013#巴黎车展#总体观感中国车企出海展示更加精细，针对在欧洲更加有差异化的智驾、座舱、舒适性进行了丰富的展示。巴黎车展受到欧洲政、商的高度关注，大众、雷诺、STLA、奔驰等欧洲主流车企也发布了大量新能源车型。", "content": "巴黎车展 & 中欧混动车贸易 & 出口退税退坡观察 -20261013#巴黎车展#总体观感中国车企出海展示更加精细，针对在欧洲更加有差异化的智驾、座舱、舒适性进行了丰富的展示。巴黎车展受到欧洲政、商的高度关注，大众、雷诺、STLA、奔驰等欧洲主流车企也发布了大量新能源车型。同期欧洲智驾的法规制定也有进展。安全、经济性、智能化是欧洲媒体、用户关注的重点。车展现场比亚迪、吉利、小鹏、零跑的关注度都非常高#小鹏集团展会期间进行了巴黎市区NGP展示，与特斯拉是仅有的大范围展示的两家车企。小鹏汽车已准备好在2027年与特斯拉FSD同步于欧洲推出NGP，并计划通过海外软件订阅进行单独定价以实现变现；与全球车企的技术授权收入有望进一步扩大。G9L全球上市，后续将在欧洲试生产，法国7.5万欧元左右起。#吉利汽车吉利品牌Monjaro EM-i（星越L插混海外版）欧洲首秀，另外推广E5/E2。领克主要在宣传08/01/02插混，极氪是9X/7X/001/007。吉利集团在欧洲研发机构较多是重要优势。#比亚迪发布了ATTO8（唐L）、腾势的新车，展示了首款专为欧洲开发的车型Dolphin G DM-i。比亚迪针对智能化在欧洲的优势，进行了重点宣传。展示了欧洲首款插混皮卡Shark#零跑B03、D19欧洲首发。后续B10、B05将开启欧洲本土化量产，工厂安排推进顺利。欧洲在售车型还有B03X和C系列 其他问界、理想、奇瑞、长安、广汽、上汽大通、福田也做了很多展示。其中问界是首次海外大规模展示#中欧PHEV贸易措施相对缓和。欧洲对进口自中国的插混车将实施限额，纯电政策暂不变。26M1-7中国出口欧洲PHEV约22万。如限额35万，对总量或有影响，但企业会重点推广高端PHEV。从本次展会看，中国高端PHEV在欧洲正在变得越来越丰富，企业也更加注重电动智能车性能的比较优势，因此推测对主流企业实际利润影响不大。后续如本土化顺利推进，中企在欧的长期天花板也不变#出口退税退坡与贸易政策类似，退税退坡也较为缓和，27年4月开始从13%退到9%，且仅针对新能源车。对车企的影响，取决于车企是否传导这个成本（实际为现金流）。理论上，结合目前欧洲购买力尚可、中国电动智能车产品力突出的现状，如车企对中高端车型选择传导，最后利润/现金流可能是没有影响的 综上，两个政策都较为缓和，市场担忧点初步落地。出口(尤其是中高端车出口欧洲)占比较高的车企，仍值得进一步关注#文字观点", "publish_time": "2026-10-13 09:32", "tags": ["巴黎车展", "总体观感", "小鹏集团", "吉利汽车", "比亚迪", "零跑", "中欧PHEV贸易", "出口退税退坡", "文字观点"]}, "post:2026-10-13T08-18:0bcc3510d2fc": {"id": "post:2026-10-13T08-18:0bcc3510d2fc", "kind": "post", "title": "2026-10-13 08:18", "source_label": "帖子正文", "excerpt": "美国中期选举观战指南https://share.note.youdao.com/ynoteshare/index.htm...纳指高位盘整还是向上突破？- 港股&海外周论https://share.note.youdao.com/ynoteshare/index.htm...策略周论：继续等待htt", "content": "美国中期选举观战指南https://share.note.y 导顺畅。 同时，AI 服务器驱动的高速 CCL 升级及 PTFE（聚四氟乙烯）混合方案在英伟达下一代 Rubin Ultra 架构中的渗透，为生益科技打开额外盈利空间，而建滔积层板凭借垂直整合及织机资源成为传统周期最大受益者。一、FR4 CCL：上调价格预测，供给约束支撑周期延续至 2027 年下半年价格与利润率：继建滔（KBL）8 月底再提价 10-20%、生益（SYT）9 月跟涨后，当前 FR4 CCL 税前均价已突破 340 元 / 张。产业链反馈价格月环比上涨将延续至 2026 年底，并大概率持续至 2027 年上半年。瑞银将 FR4 CCL 价格预测上调至 2026 年 12 月 383 元 / 张、2027 年 6 月 443 元 / 张。每 10% 的 ASP 上涨约可带动毛利率扩张 2 个百分点。二三线厂商（如南亚新材、金安国纪）因订单溢出，FR4 毛利率已达 35-40%，净利率从 8% 跃升至 21%。 供给瓶颈：2027 年全球 FR4 CCL 有效产能增量极为有限（仅建滔有边际扩张），核心制约在于上游电子玻纤布。织机（尤其是丰田织机）交付周期长达 2-3 年，行业电子布供需缺口超 10%。即使台光电子（ITEQ）等一线厂商也因玻纤短缺仅能维持 70-75% 的产能利用率。建滔凭借锁定丰田近 50% 新增织机产能，成为 “拥织机者得天下” 的最大赢家。 原材料：电子玻纤布价格 9 月涨 10-15% 后，10 月预计再涨 10-15%，2026 年底厚布（7628）价格将突破 15 元 / 米，薄布（1080）因产能挤出效应涨幅更快源头内容加微WUXL3408，年底看 23 元 / 米。铜箔加工费年内已上调 2-3 次，高端 HVLP3 及以上铜箔供需趋紧。 需求结构：传统家电 / 手机需求疲软，但汽车电动化 / 智能化（单车 PCB 用量提升）及高端消费电子（苹果 / 华为高端机）支撑结构性需求。客户优先级从 “降本” 转向 “保供应”，PCB 厂商自 7 月起对非 AI 产品逐步提价且接受度高，CCL 订单能见度达 2-3 个月。二、PTFE 混合方案：进度提前，生益科技有望主导英伟达下一代架构应用节点提前：原预期 PTFE 随 Kyber 背板在 2029 年放量，现因英伟达 Rubin Ultra（VR300）NVL576 机柜的交换机托盘采用 32 层 PTFE 混合设计（8-10 层信号层用 PTFE，其余核心层用 M8/M9），PTFE CCL 贡献将提前至 2027 下半年 / 2028 年。 份额与盈利：生益科技是当前唯一通过终端客户认证、兼具 M9 与 PTFE 量产能力的 CCL 厂商，且其柔性 CCL 产能（可转产 PTFE）充足。尽管 EMC 与台虹（Taiflex）结盟试图成为第二供应商，但终端客户偏好 “一站式” 解决方案（便于故障归因），瑞银预计生益将获取 2027/28 年 PTFE 主要份额（交换机托盘 80%/70%，Kyber 背板 80%/70%）。 盈利弹性：基于 NVL576 交换机托盘及 Kyber 背板 PTFE 渗透率的情景分析，2027/28 年可为生益科技带来额外净利润 1.37 亿元 / 26.35 亿元，相当于瑞银基础预测的 1%/16% 上行空间（基础预测尚未计入 PTFE 贡献）。 设备壁垒：PTFE 需 340-380℃高温层压，传统 CCL 设备（上限 235℃）无法复用，高温压机交付周期已延长至 20-24 个月（部分超 30 个月），生益在柔性 / 高温产能上的先发优势构筑护城河。三、CPO/NPO：降规担忧过度，CCL 内容价值仍呈上升趋势短期风险有限：市场担忧 CPO（共封装光学）普及将导致 CCL 规格从 M8/M9 降至 M4，但瑞银认为近 2-3 年 NPO（近封装光学）将是主流，且 CPO 全面渗透需至 2029-30 年。即便在 CPO 方案中，ASIC 间连接器、通孔及其他高速链路仍需 M6-M8 级 CCL。 内容价值提升：在 NVL576 架构中，机柜间互联通过 NPO/CPO 实现，单 Oberon 机柜的交换机托盘数量从 GB300/VR200 的 9 个翻倍至 18 个，且主板面积扩大、层数增加（交换机板至 32 层，正交背板 78-100 + 层），NPO 模块 PCB 规格（18-24 层，mSAP 工艺）及翘曲 / 热要求更严苛，均驱动 CCL 单柜价值量上升。四、AI CCL 升级路线图：M9 量产在即，M10 与 PTFE 之争持续M9：目前仅 EMC 和生益通过英伟达认证，用于 Rubin 计算板。生益 M9 产品已完成认证，预计 2027 年渗透率达 20%。EMC 预计 M9 ASP 较上一代高 30% 以上。 M10：处于送样阶段，需采用 Q-glass、纯碳氢树脂及 HVLP5 铜箔。因 M10 的 Df（耗散因子）水平可能无法满足 NVL576 交换机托盘的≤0.0004 要求，PTFE 方案仍具竞争力，两者之争将延续至 2027 年。 传统高速 CCL（M2-M6）：受通用服务器升级及低轨卫星需求支撑，需求保持韧性。生益、建滔的 M4/M6 产品 ASP 开始补涨，追赶 FR4 涨幅。五、盈利预测与估值调整生益科技（600183.SS）：微调 2026/27/28 年净利润预测至 + 3%/-1%/+9%/+2%（2027 年净利润 126.28 亿元，对应 EPS 5.23 元）。目标价从 192 元上调至 209 元，基于 2027 年预期 40 倍 PE（不变），对应 2026-29 年 EPS 复合增速 40%。当前股价对应 2027 年 23.7 倍 PE，估值具备吸引力。预计 CCL / 半固化片板块收入 2026/27 年分别增长 69%/75%，毛利率受益于 FR4 涨价及 AI CCL 占比提升而扩张。 建滔积层板（1888.HK）：上调 2026/27/28 年净利润预测 0%/31%/11% 至 92.33 亿 / 183.58 亿 / 191.62 亿港元（2027 年 EPS 5.78 港元），较市场一致预期高 39%。目标价从 66 港元上调至 75 港元，基于 2027 年预期 13 倍 PE（此前 17 倍，因盈利基数上修而下调倍数）。当前股价对应 2027 年 8.4 倍 PE，处于历史均值上方 1.3 个标准差，但考虑到传统周期持续性及 AI 玻纤布 / 铜箔的增量，风险回报比依然诱人。瑞银同时给出盈利敏感性分析：在 2027 年 FR4 ASP 上涨 68%、CCL 毛利率 44% 的中性假设下，EPS 为 5.79 港元；若涨价 82%、毛利率 48%，EPS 可达 6.78 港元。 行业估值：Wind CCL 指数自 6 月高点回落 46% 后已反弹 30%，市场过度悲观。瑞银覆盖的 CCL 标的 2025-28 年盈利 CAGR 达 82%（高于 2019-21 年周期的 57%），且 AI 驱动的服务器 PCB 需求扩张达 5-10 倍（高于 4G 到 5G 的 2-3 倍），本轮上行周期更长、受益面更广，当前估值尚未完全反映结构性转变。#文字观点", "publish_time": "2026-10-13 08:34", "tags": ["文字观点"]}, "post:2026-10-13T07-53:58820d0adedb": {"id": "post:2026-10-13T07-53:58820d0adedb", "kind": "post", "title": "2026-10-13 07:53", "source_label": "帖子正文", "excerpt": "【浙商AI战队‖ PCB】田发祥-鹏鼎控股：AI PCB第二成长曲线全面进入兑现期 ——全所级别重大推荐#消费电子龙头向AI算力龙头升级。公司将消费电子领域积累的mSAP、SLP及高阶HDI能力快速复制至AI服务器和高速光模块，六阶以上HDI、高阶GPU模组、内埋元件等技术持续突破，800G、1.6", "content": "【浙商AI战队‖ PCB】田发祥-鹏鼎控股：AI PCB第二成长曲线全面进入兑现期 ——全所级别重大推荐#消费电子龙头向AI算力龙头升级。公司将消费电子领域积累的mSAP、SLP及高阶HDI能力快速复制至AI服务器和高速光模块，六阶以上HDI、高阶GPU模组、内埋元件等技术持续突破，800G、1.6T光模块PCB已量产，3.2T研发推进，AI PCB技术壁垒持续提升。 #AI业务进入放量拐点，高价值量驱动盈利提升。 2026H1汽车/服务器业务收入22.67亿元，同比增长182%，其中AI服务器收入近10亿元，光模块收入6.26亿元、同比增长11倍；收入占比提升至13%，毛利率达到37.4%，显著高于传统消费电子业务，第二成长曲线进入业绩兑现阶段。 #百亿扩产+客户认证双轮驱动，成长空间持续打开。 淮安110亿元、深圳100亿元项目及96亿元定增全面布局AI服务器和高速光模块高端PCB，主流云厂商及服务器客户认证持续落地，随着新增产能释放，公司有望充分受益AI服务器、高速光模块及3.2T升级周期，收入、利润弹性进一步释放。 投资建议：预计公司2026—2028年归母净利润分别为56.09、75.73和103.07亿元，随着AI收入占比、产能利用率及高附加值产品占比同步提升，公司有望实现收入扩张与盈利中枢上移，目标市值3000亿，持续重点推荐。 风险提示：客户认证、AI需求及新增产能爬坡不及预期#文字观点", "publish_time": "2026-10-13 07:53", "tags": ["消费电子龙头向AI算力龙头升级", "文字观点"]}, "post:2026-10-13T13-20:95ed79c224b9": {"id": "post:2026-10-13T13-20:95ed79c224b9", "kind": "post", "title": "2026-10-13 13:20", "source_label": "帖子正文", "excerpt": "高盛——中国PCB：宏和科技（603256.SS）管理层电话会——AI驱动高端电子布与电子纱需求；产能持续扩张 高盛近期与宏和科技（Grace Fabric，603256.SS，未覆盖）管理层进行交流。", "content": "高盛——中国PCB：宏和科技（603256.SS）管理层电话会——AI驱动高端电子布与电子纱需求；产能持续扩张 高盛近期与宏和科技（Grace Fabric，603256.SS，未覆盖）管理层进行交流。宏和科技提供覆盖通用与高端领域的完整电子布产品组合。管理层对AI服务器应用快速放量、带动电子布向更高功能性升级（典型如低介电常数/低损耗因子 low Dk/Df、低热膨胀系数 low CTE）持明确乐观态度。管理层强调，公司在高端电子布领域具备长期技术积累与工艺经验，并拥有电子纱—电子布一体化自产能力，可更灵活地匹配客户在AI服务器、高速CCL、先进封装等场景下的定制化管理需求。高盛由此交叉验证：CCL客户对高端电子布采购意愿强劲，AI PCB/CCL产业链上游材料景气持续向上。 市场规模与产业逻辑 受AI服务器机架出货放量、板材层数提升、材料规格升级共同作用，全球AI服务器PCB与CCL市场进入高增阶段。高盛预计：AI服务器PCB市场由2026年约270亿美元增至2027年约380亿美元、2028年约840亿美元；AI服务器CCL市场由2026年约190亿美元增至2027年约220亿美元、2028年约480亿美元。2026—2028年AI PCB/CCL TAM复合增速分别约148%与161%，增长并非单纯靠量，而是“出货量扩张 + 单平米价值量提升”双轮驱动，低端电子布与高端low Dk/Df、low CTE、石英布的价值差将进一步拉开。 公司要点 1. 产能扩张对接AI材料瓶颈 宏和科技在上海、黄石布局生产基地，正持续扩充高端电子布年产能。黄石基地推进特种电子纱新产线建设，战略上优先保障低CTE电子布的自给供应，降低对外部高端纱依赖。管理层同时强调良率提升、损耗控制与运营效率改善，说明扩产不是简单加设备，而是围绕“高端化+稳定性+客户认证”做供给能力升级。 2. 产品矩阵宽，结构向高附加值倾斜 公司产品从通用电子布（厚布、薄布、超薄布、极薄布）延伸至特种电子布（low Dk/Df、low CTE、石英布），并可根据订单结构灵活调配产能以最大化单位产值。随着AI硬件对信号完整性、热稳定性、介质损耗的要求提高，公司今年以来持续放大低CTE产品产量，并拓展下游客户覆盖，从传统消费电子/数据中心客户进一步贴近AI服务器CCL与封装基板链条。 投行解读 宏和科技所处环节是“AI PCB—CCL—电子布—电子纱”价值链中容易被市场低估的上游材料层。市场通常先交易PCB与CCL，再向玻纤布、电子纱、低CTE/low Dk材料扩散。宏和科技的一体化能力意味着：在AI板材从FR-4向高速高频、低损耗、低膨胀材料迭代时，公司具备从纱到布协同开发、缩短客户验证周期的护城河。高盛虽未给予评级（Not Covered），但将其管理层反馈作为验证AI PCB/CCL TAM扩张的重要上游样本。 投资含义 • 对PCB/CCL板块：上游电子布需求紧俏，是AI服务器链条景气的领先确认信号。 • 对宏和科技：核心看点是低CTE/low Dk电子布放量、黄石新产线良率、以及能否进入全球一线CCL厂AI料号供应链。 • 对材料链：高端电子纱自给、石英/低膨胀布工艺、客户认证壁垒，将决定谁能从“周期扩产”走向“结构溢价”。 主要风险 AI服务器出货低于预期；CCL厂压价导致电子布ASP不及预期；高端产线良率爬坡慢于规划；行业同质化扩产引发中低端电子布价格战；消费电子需求疲软拖累通用布盈利；原材料与能源成本波动#文字观点", "publish_time": "2026-10-13 13:20", "tags": ["文字观点"]}, "post:2026-10-13T07-13:7a018a93b317": {"id": "post:2026-10-13T07-13:7a018a93b317", "kind": "post", "title": "2026-10-13 07:13", "source_label": "帖子正文", "excerpt": "10月13日：金融街论坛、短剧、汽车测试、光刻机及新凯来等概念股梳理 一、昨夜发酵消息精选。1、金融街论坛：2026金融街论坛年会将于10月19日至22日在北京金融街举办。", "content": "10月13日：金融街论坛、短剧、汽车测试、光刻机及新凯来等概念股梳理 一、昨夜发酵消息精选。 1、金融街论坛：2026金融街论坛年会将于10月19日至22日在北京金融街举办。上海证券报记者从2026金融街论坛年会新闻发布会上获悉，中国人民银行行长潘功胜、金融监管总局局长丁向群、中国证监会主席吴清将出席2026金融街论坛年会并作主题演讲。 概念股：金融街、湘财股份、中信证券、北京银行、中油资本、东方财富、指南针、同花顺、光大证券、广发证券等。 2、短剧：字节短剧海外下载的消息，突然就发酵了，很多媒体报道或转发。字节跳动旗下短剧应用PineDrama上线约9个月后，累计下载量已突破1亿，日活跃用户约700万，成为海外短剧赛道增长最快的应用之一，仅2026年9月单月下载量就超过1200万次。环球时报：台媒称大陆AI短剧破局台独课纲红果短剧在台湾娱乐榜排第4。央视旗下“看台海”官微：两岸历史题材AI系列短剧《那些年，他守护宝岛》重磅上线。晚间，微博热搜第二位：AI短剧正在围猎中年男性。 概念股：中文在线、掌阅科技、慈文传媒、博纳影业、德才股份、果麦文化、吉视传媒、新华传媒、龙版传媒、万兴科技等。 3、汽车测试：汽车研发测试拟设准入硬要求：至少3万公里、“两冬一夏”，问题未解决不得申报。在研发测试验证层面，征求意见稿拟明确新车上市前的刚性测试底线，所有新申报公告车型须完成全套标准化验证流程。其中，整车综合可靠性验证里程不得低于3万公里;环境适应性验证周期不少于一年，且须完成“两冬一夏”高低温交替试验，覆盖高温、高寒、高原、盐雾、沙尘、电磁干扰等复杂耦合工况。验证范围拟全面覆盖车身车架、转向制动系统结构疲劳可靠性,智能座舱与辅助驾驶软件功能可靠性，以及整车密封性、热管理、防护性能等核心维度。征求意见稿同时拟收紧验证管理口径，明确车企不得直接采信供应商提供的试验报告替代整车自研验证。 概念股：中国汽研、中汽股份、中机认检、安车检测、南华仪器、华测检测、苏试试验、广电计量、信息源头加微信 WUXL3408通测科技、药石科技等。 4、光刻机及新凯来：据韩国媒体报道，ASML将把供应韩国的更换零部件价格统一上调10%，涵盖极紫外（EUV）和深紫外（DUV）光刻设备的全部零部件，自明年1月起生效。新凯来10月14日将亮相2026湾芯展。主营：武夷山刻蚀机、普陀山薄膜沉积设备、岳麓山光学量测设备；子公司90GHz超高速示波器、国产EDA等。 光刻机概念股：上海新阳、容百科技、清溢光电、张江高科、奥普光电、华卓精科、芯源微、苏大维格、福晶科技、茂莱光学。 新凯来概念股：利和兴、至纯科技、冠石科技、路维光电、华特气体、新莱应材、正帆科技、奥普光电、凯美特气、同惠电子、深振业A等。 5、物理AI：2026物理AI与世界模型大会10月19日至22日在南京举行，是国内首个聚焦该领域的高规格综合性行业大会。 概念股：索辰科技、能科科技、凡拓数创、天准科技、绿的谐波、汇川技术、步科股份、云天励飞、软通动力、奥比中光等。 6、医药健康：晚间新闻联播和白天几大央媒的头条都是健康中国。把维护人民健康摆在更加突出的位置，作出“全面推进健康中国建设”的重大决策部署，引领我国卫生与健康事业发生历史性变革、取得历史性成就。系列报道【新思想引领新征程】播出：以人民为中心，加快建设健康中国。 概念股：华北制药、莱美药业、恒瑞医药、药明康德、华东医药、云南白药、白云山、以岭药业、长春高新、凯莱英、片仔癀、济川药业等 7、逆变器：中欧贸易投资磋商机制第二次例会日前召开，欧方澄清，欧盟对逆变器项目的融资指导文件不针对特定国家，双方将就该问题进一步磋商。 概念股：首航新能、阳光电源、德业股份、固德威、锦浪科技、上能电气、禾迈股份、昱能科技、艾罗能源、海泰新能等。 8、电力电网：大摩，美国AI供电缺口或达77GW 有望催生2400亿美元市场。“十五五”时期我国将投入超过5万亿元建设新型电网，到2030年将初步建成新型电网，可高效支撑28亿千瓦以上新能源消纳。 概念股：金冠电气、远程股份、长城电工、天顺风能、通达动力、众业达、金盘科技等 9、AI助手Muse：据第三方数据机构Sensor Tower最新统计及风险投资人迪迪.达斯披露的数据，科技巨头Meta(META)于今年9月推出的独立AI助手Muse展现出强劲的用户粘性，其用户留存率已紧追市场龙头ChatGPT(OpenAI)。（昆仑万维、澜起科技） 10、电池：陶氏公司宣布推出VOLTRICELL电池材料平台，旨在优化电池制造工艺并提升电池性能，适用于现有电池以及钠离子电池、硅负极电池和固态电池等新兴技术。（时代万恒、德新科技） 11、北交所：证监会推动北交所新三板一体化高质量发展将探索更加适配创新型中小企业的制度。（申万宏源、中关村） 12、光通信：两家代表公司发布三季报业绩预告。（源杰科技、联讯仪器） 13、美股三大指数收盘涨跌不一，存储板块走弱，国际油价走高。热门科技股涨跌不一，Meta涨超3%，苹果、微软涨超1%，英伟达、亚马逊、特斯拉、博通跌超1%。油气、保险、食品饮料板块走强，康菲石油、道达尔涨超2%，可口可乐涨近2%，埃克森美孚、雪佛龙、壳牌涨超1%。存储、光通信、计算机硬件板块走低，昆腾跌超9%，康宁跌6%，闪迪跌近6%，SK海力士、超微电脑跌超4%，美光科技、希捷科技跌超3%。 二、个股新增概念精选。 1、短剧游戏（浙数文化、黄山旅游） 2、碳中和（富邦科技） 3、共封装光学（东百集团） 4、算力（海博思创） 5、数据中心（海尔智家）", "publish_time": "2026-10-13 07:13", "tags": []}, "post:2026-10-13T07-39:c5b669867010": {"id": "post:2026-10-13T07-39:c5b669867010", "kind": "post", "title": "2026-10-13 07:39", "source_label": "帖子正文", "excerpt": "🔥下一个AI4S，全市场首倡AI EDA： OpenAI亲自下场，AI 有望重新定义芯片设计范式【天风计算机缪欣君团队】 核心标的：华大九天、概伦电子、广立微 核心逻辑: 1、 海外对标: 新思科技业绩超预期，AI 驱动 EDA 需求持续扩容 新思科技（Synopsys）2026 财年 Q3 实现营", "content": "🔥下一个AI4S，全市场首倡AI EDA： OpenAI亲自下场，AI 有望重新定义芯片设计范式【天风计算机缪欣君团队】 核心标的：华大九天、概伦电子、广立微 核心逻辑: 1、 海外对标: 新思科技业绩超预期，AI 驱动 EDA 需求持续扩容 新思科技（Synopsys）2026 财年 Q3 实现营收 24.77 亿美元，同比增长约 42%。全球 EDA 龙头业绩与指引持续超预期，AI 芯片设计复杂度提升、先进计算与系统级设计需求增长，正推动 EDA 行业进入新的成长阶段。 2、合作模型: GPT-Synopsys 战略合作落地，AI 有望重塑 EDA 产品形态与商业模式 9 月 30 日，新思科技与 OpenAI 宣布达成多年期战略合作，共同开发面向芯片设计的专业模型#GPT-Synopsys。合作将OpenAI 前沿模型与新思科技 EDA 工具、芯片设计专业知识相结合，使 AI 不仅能够辅助工程师分析设计问题，更有望直接调用 EDA 工具、理解运行结果并迭代优化设计，在提升设计效率的同时改善芯片功耗、性能与面积（PPA）表现。#双方还将开展联合研发、市场拓展与收入分成合作。此次合作意味着 AI 与 EDA 的结合正从辅助编码向专业设计工作流深入，有望提升工具使用效率、拓展 EDA 应用场景，并推动行业长期市场空间扩容。 3、国内核心: 打造数字 EDA 全流程，客户景气+韬定律+AI EDA三重驱动 国内 EDA 龙头已在模拟电路、存储电路、射频电路及平板显示电路设计等领域建立产品优势，#正打造数字设计全流程，同时在晶圆制造及先进封装等环节补齐。 随着国产 GPU、AI ASIC 及高性能计算芯片迭代加速，国内芯片设计企业对数字 EDA 全流程工具的需求有望持续增长。我们认为，#中期看半导体景气下客户需求恢复推动基本面持续改善，#长期看好韬定律和 AI EDA驱动进一步打开成长天花板。我们非常看好 AI EDA板块性投资机会！#文字观点", "publish_time": "2026-10-13 07:39", "tags": ["GPT-Synopsys", "合作将", "中期看半导体景气下", "长期看好", "文字观点"]}, "post:2026-10-13T11-24:34e9ed24671d": {"id": "post:2026-10-13T11-24:34e9ed24671d", "kind": "post", "title": "2026-10-13 11:24", "source_label": "帖子正文", "excerpt": "深度：关于宁德时代需求、盈利、格局的三问三答 宁德时代估值处于历史低位，反应市场存在分歧，我们更新的深度报告主要回答中期需求增速、短期排产波动、电池供需趋势、税收退坡影响、高端车电池格局演绎等市场核心关注点： 1、#需求方面，1）本轮锂电景气周期的需求结构是多元化的，争议较大的国内大储、国内动力分别", "content": "深度：关于宁德时代需求、盈利、格局的三问三答 宁德时代估值处于历史低位，反应市场存在分歧，我们更新的深度报告主要回答中期需求增速、短期排产波动、电池供需趋势、税收退坡影响、高端车电池格局演绎等市场核心关注点： 1、#需求方面，1）本轮锂电景气周期的需求结构是多元化的，争议较大的国内大储、国内动力分别占总需求的13%、25%，欧洲动力、国内商用车、新兴市场动力、非美储能对需求的影响力在强化，且是政策托底和经济性驱动共振，增长趋势明确。预计到2030年锂电需求复合增速仍将维持在20%以上。2）短期排产出现波动，更多是企业对库存策略的调整所致，由于库存策略调整导致的排产波动，静待碳酸锂价格逐步进入成本支撑区间后库存策略趋稳，以及27Q1淡季景气验证。 2、#盈利方面，2025Q4以来锂电池企业的资本开支有显著提升，扩产规划也在陆续发布，对此我们认为：1）折旧对锂电池企业盈利的影响有限，且锂电池产线多为客户定制，多数时期保留一定的产能冗余是合理的。2）锂电池是差异化、市场分层的行业，中低端市场容易同质化价格竞争，宁德时代产品结构更偏高端、海外市场，影响则相对有限。3）更重要的是，锂电池的产能无序扩张已引起政策制定部门的关注，后续若限制产能扩张、反内卷的政策持续推进，锂电池供需关系将持续好转。 对于政策退坡的影响，我们认为各场景的传导和承担比例将有不同：1）储能电池新项目预计传导难度不大；2）动力电池出口退税退坡影响预计也相对可控；3）国内动力消费税或有传导压力。但同时也需关注企业的结构改善，一是从锂电需求增长的区域结构看，未来几年海外的占比将持续提升；二是公司系统级产品占比有望提升；三是资源品的成本压力将得到缓解。 3、#格局方面，汽车作为ToC的消费品，动力电池又是影响新能源汽车使用体验的重要零部件，中期看取决于动力电池是否存在差异化和To C的品牌认知度。经过多年的市场培育，消费者对于动力电池的品牌有一定的认知度。同时，应看到近些年出现了重新强化与宁德时代合作，带动销量提升、品牌升级的案例，典型的是吉利星愿、零跑等。宁德时代持续推动品质战略，从宣传到服务网络，一是加大拳头产品的品牌宣传力度，二是切入汽车后市场服务领域，三是加码全球补能基础设施建设。 4、预计公司2026、2027年归母净利润940、1100亿元，对应PE仅为15、13X，市场分歧已充分定价，继续推荐。#文字观点", "publish_time": "2026-10-13 11:24", "tags": ["格局方面", "汽车作为To", "文字观点"]}, "post:2026-10-13T07-38:1af13f295142": {"id": "post:2026-10-13T07-38:1af13f295142", "kind": "post", "title": "2026-10-13 07:38", "source_label": "帖子正文", "excerpt": "【华泰互联网传媒】AI情绪阶段性回落，非AI互联网迎来重估窗口#重点推荐美团、BOSS直聘#AI标的上我们依然坚定选择阿里AI交易拥挤度见顶，部分资金开始主动寻求非AI标的估值洼地，互联网板块中基本面持续改善、估值仍处低位的标的开始获得关注。短期港股或有阶段性反弹行情。", "content": "【华泰互联网传媒】AI情绪阶段性回落，非AI互联网迎来重估窗口#重点推荐美团、BOSS直聘#AI标的上我们依然坚定选择阿里AI交易拥挤度见顶，部分资金开始主动寻求非AI标的估值洼地，互联网板块中基本面持续改善、估值仍处低位的标的开始获得关注。短期港股或有阶段性反弹行情。 美团：利润修复主逻辑不变，Q3超预期概率上升。随着阿里pre淘闪减亏进一步落地，我们预计美团9月外卖UE或0.4-0.5元，Q3整体利润环比持续改善的确定性在增强。十一黄金周美团外卖订单量同比增长超20%，到店餐饮、酒旅业务均实现双位数增长，闪购非餐订单增速快于行业。 BOSS直聘：公司涨价策略稳步推进，国庆节后ios流水快速恢复至节前水平，收入利润增长稳健背景下27年有望入通。#文字观点", "publish_time": "2026-10-13 07:38", "tags": ["重点推荐美团、BOSS直聘", "AI标的上我们依然坚定选择阿里", "文字观点"]}, "post:2026-10-13T07-54:28952007a452": {"id": "post:2026-10-13T07-54:28952007a452", "kind": "post", "title": "2026-10-13 07:54", "source_label": "帖子正文", "excerpt": "💎【安克创新+石头科技+绿联科技】中欧达成初步共识，没有加关税，股价预计有所反弹 💡#上周各公司股价受中欧贸易风险以及美国FCC收紧影响出现较大回调。#随着中欧磋商初步达成共识（混动汽车达成谅解+对欧降税+稀土/医疗器械/农产品进出口等议题），核心议题未包括全面加税，#全面贸易战担忧缓解。", "content": "💎【安克创新+石头科技+绿联科技】中欧达成初步共识，没有加关税，股价预计有所反弹 💡#上周各公司股价受中欧贸易风险以及美国FCC收紧影响出现较大回调。#随着中欧磋商初步达成共识（混动汽车达成谅解+对欧降税+稀土/医疗器械/农产品进出口等议题），核心议题未包括全面加税，#全面贸易战担忧缓解。#针对美国FCC收紧问题，首先是否落地不确定以及落地仍有时间，其次找海外实验室难度或许并不大预计成本增加可控。 政策负面情绪扰动有望减弱，安克/石头三季度基本面仍不错，绿联看好27年新品周期。此前中美贸易摩擦已验证企业产能转移+成本转移能力，情绪杀完后关注底部布局机会。 🔥#安克创新：预计整体Q3增速延续Q2表现，亚马逊Q3/M9增速+16%/+34%（Q1/Q2/M7/M8增速分别+18%/+31%/-4%/+30%） （1）#整体：预计Q3整体营收增速延续Q2趋势。其中#充电储能增速30%左右，安防+母婴预计保持20%+增长，扫地机仍有一定压力。 （2）#亚马逊：2026Q3/M9GMV分别30/9亿、同比分别+16%/+34%。9月增速较 8月环比提升，7月受PD错期影响同比有所下滑。若考虑部分PD实际收入仍确认再7月，预计Q3增速更高。 🔥#石头科技：（1）#销售额来看，#2026Q3/M9欧洲亚马逊GMV增速分别为+17%/+39%（Q3整体增速较低包含PD错期影响），其中2026M9德亚/法亚/英亚/意亚/西亚增速分别为46%/45%/44%/17%/-9%；2026M7/M8美国亚马逊增速分别为-42%/+31%，#预计2026M9延续M8态势保持双位数增长。 （2）#市占率来看，2026M9石头扫地机美亚/德亚/法亚/英亚/意亚/西亚市占率分别为26.9%/44.7%/32.8%/34.0%/15.4%/17.6%，市占率保持稳定；石头洗地机美亚/德亚/法亚/英亚/意亚市占率分别为11.4%/15.6%/5.8%/4.0%/9.7%，环比M8显著提升。 🔥#绿联科技：2026Q3/M9 GMV分别6.6/2.2亿，#同比分别+46%/+79%（Q1/Q2同比分别+61%/+44%）。9月增速较8月环比提升。#分品类来看，2026Q3 NAS存储/移动电源/充电器/拓展坞同比分别+2%/+68%/+35%/+18%，预计定位器保持高增长。#文字观点", "publish_time": "2026-10-13 07:54", "tags": ["亚马逊", "2026Q3", "M9", "石头科技", "绿联科技", "文字观点"]}, "post:2026-10-13T11-23:1a4c5271e139": {"id": "post:2026-10-13T11-23:1a4c5271e139", "kind": "post", "title": "2026-10-13 11:23", "source_label": "帖子正文", "excerpt": "联讯仪器2026年三季度业绩预告点评：光通信测试仪器设备放量，Q3利润同环比跨越式增长 ✨前三季度利润已达去年全年十倍以上。公司预计2026年前三季度实现归母净利润19–21亿元，同比增长1866%–2073%", "content": "联讯仪器2026年三季度业绩预告点评：光通信测试仪器设备放量，Q3利润同环比跨越式增长 ✨前三季度利润已达去年全年十倍以上。 公司预计2026年前三季度实现归母净利润19–21亿元，同比增长1866%–2073%；扣非归母净利润18–20亿元，同比增长1837%–2052%。中值20亿元约为2025年全年归母净利润（1.74亿元）的11倍。Q3单季实现归母净利润13.3–15.3亿元，环比Q2的4.48亿元增长197%–242%，约为去年同期（0.40亿元）的33–38倍；扣非归母净利润12.4–14.4亿元，环比增长178%–223%。 ✨增长来自下游扩产带动的测试设备放量，经营杠杆持续释放。 业绩增长主要来自AI算力需求提升带动数据中心建设加速，高速光通信需求保持较快增长，光模块与光芯片厂商持续扩产，进而拉动通信测试仪器和光电子器件测试设备的销售。仪器设备企业前期研发和制造投入相对刚性，收入快速放量后利润增速显著高于收入增速。我们预计三季度公司利润率同比改善趋势延续（26H1营收同比增长209%，归母同比增长903%），但由于利润基数抬升有效税率亦有所提高，利润率环比改善幅度料低于Q2（26Q1有效税率0.48%，26Q2有效税率9.4%）。 ✨全年盈利预测有望进一步上修。 我们此前报告预测公司2026年归母净利润为25.00亿元，前三季度中值20亿元对应完成度约80%，wind一致预期为13.7亿元，考虑到四季度光模块相关仪器出货有望环比进一步加速，盈利预测有望上修。Q4 重点关注 2.4t/3.2t 相关采样示波器送样进展、存储相关高速测试机验证进度以及 CPO 相关环节海外客户进展等。 具体情况欢迎进一步交流～#文字观点", "publish_time": "2026-10-13 11:23", "tags": ["文字观点"]}, "post:2026-10-13T07-20:e96b98e91afa": {"id": "post:2026-10-13T07-20:e96b98e91afa", "kind": "post", "title": "2026-10-13 07:20", "source_label": "帖子正文", "excerpt": "#AI热点讨论-源杰科技💎#最强确定性已经明晰。由于超强的远期需求和行业供给的难度，预计2027年-2028年客户给公司的需求已经非常清晰而确定，未来两年成长复合增速会是少有的几倍级别，甚至已经可以预见到10x的PE估值。", "content": "#AI热点讨论-源杰科技💎#最强确定性已经明晰。由于超强的远期需求和行业供给的难度，预计2027年-2028年客户给公司的需求已经非常清晰而确定，未来两年成长复合增速会是少有的几倍级别，甚至已经可以预见到10x的PE估值。 💎#产品结构质变成为全球激光器TOP级企业。公司用两年的时间将70/100mw的激光器达到全球出货前二水平，我们预计公司NPO/CPO新品在客户端进展超预期，2027年将可见的成为全球高功率出货最大企业之一。数千万颗量级高功率会带来公司产品结构发生重要变化，2028年高端大功率产品出货占比有望达到半数以上，ASP和盈利能力相应大幅提升。OIO等下一代产品也在和全球头部客户联合研发，技术卡位和成长性非常强势。 💎#行业壁垒带来格局强化。作为过去两年激光器公司中为数不多交付不跳票的企业，已成为全球头部CSP和模块厂最仰仗的供应商。客户的联合适配、设备前瞻采购、良率和品质的把控、性能的可靠性等都一道道有效交付的门槛，未来几年预计行业内高端产品将进一步集中。 💎#FCC的猜测导致调整而严重低估。从目前海外CSP来看，尚无市场所传FCC对于光通信的无端要求。纵使假设最差逻辑下，CSP反馈主要是“本土生产”原则，而公司是全球为数不多在美有前瞻工厂布局的企业，1.5万平米的场地属于较大产能储备，这也是公司能更早获得终端/模块厂长协的保障之一。 💎整体市场短期内交易上整体偏负面，类似2024年下半年大光有50%的跌幅，2026年6月以来基本也已经同等幅度跌幅。这种级别调整只有，交易层面负面因素减弱，基本面最强的企业会迎来大级别的机会。强烈建议关注激光器行业的变革和源杰科技调整的机会。#文字观点", "publish_time": "2026-10-13 07:20", "tags": ["AI热点讨论-源杰科技", "文字观点"]}, "post:2026-10-13T07-21:cc7f9e5efe80": {"id": "post:2026-10-13T07-21:cc7f9e5efe80", "kind": "post", "title": "2026-10-13 07:21", "source_label": "帖子正文", "excerpt": "【ZX通信】源杰科技26Q3速评——扩产加速、高端放量在即，盈利能力持续提升！事件：公司发布26Q3业绩预告，营收6.5–7.0亿元，扣非净利润4.0–4.5亿元，Q3扣非净利率约63%（按中值测算，环比+4%），盈利能力持续创新高。", "content": "【ZX通信】源杰科技26Q3速评——扩产加速、高端放量在即，盈利能力持续提升！事件：公司发布26Q3业绩预告，营收6.5–7.0亿元，扣非净利润4.0–4.5亿元，Q3扣非净利率约63%（按中值测算，环比+4%），盈利能力持续创新高。 根据公司公开交流：订单能见度至少到28年，明年有望数倍增长 公司订单可见度至28年，#部分29年订单已在洽谈，40亿新园区项目直接对应2028年需求。明年业绩有望数倍增长，趋势或延续至2028年。产能加速在即，最早26Q4开始加速，27年产能翻倍。高端产品占比提升，ASP持续上行 今年100mW产品出货占比已达1/3以上，明年100mW及以上产品（含NPO/CPO）产能占比超过50%。100G EML已批量出货，200G在推进中，OIO方案在研。价格上，#明年原有产品价格坚挺，高端品占比提升，毛利率在现有水平之上，数据中心产品线将呈现量价齐升。NPO/CPO明年放量，订单已进入实质阶段 #NPO已与行业头部客户合作，订单进入实质阶段，覆盖120/130/150/200mW等多种型号，明年有望较快出货。同时#公司有望成为明年少数能批量供货CPO光源的厂商之一，已与头部厂商合作，进展顺利。海外产能就绪，政策扰动可控 #美国工厂洁净室已建成，切割、测试、封装、老化等设备已导入，有望很快实现出货。相关政策对26、27年业务产生影响有限，必要时可在内部调配产能属地。我们认为，AI驱动高功率光源需求持续爆发，公司作为全球CW光源头部供应商，将受益于产能扩张、产品升级、客户突破三重共振，明年业绩有望以数倍级别爆发，持续看好！#文字观点", "publish_time": "2026-10-13 07:21", "tags": ["文字观点"]}, "post:2026-10-13T07-16:e094291b2603": {"id": "post:2026-10-13T07-16:e094291b2603", "kind": "post", "title": "2026-10-13 07:16", "source_label": "帖子正文", "excerpt": "【盘后A股上市公司重点业绩公告精选】财联社10月10日电，据财联社不完全统计，截至发稿，盘后包括联讯仪器、源杰科技、北方稀土、翰宇药业、超声电子、奥来德、坤彩科技、粤桂股份、全志科", "content": "【盘后A股上市公司重点业绩公告精选】财联社10月10日电，据财联社不完全统计，截至发稿，盘后包括联讯仪器、源杰科技、北方稀土、翰宇药业、超声电子、奥来德、坤彩科技、粤桂股份、全志科技、神火股份、新宙邦、纳微科技、优博讯、捷捷微电、冰轮环境、国机精工在内的多家A股上市公司发布2026年前三季度/第三季度业绩预告。其中，联讯仪器公告，前三季度净利润同比预增1866%-2073%。源杰科技公告，第三季度净利润同比预增579%-660%。(来自财联社APP)", "publish_time": "2026-10-13 07:16", "tags": []}, "post:2026-10-13T12-35:691b0abf4d5b": {"id": "post:2026-10-13T12-35:691b0abf4d5b", "kind": "post", "title": "2026-10-13 12:35", "source_label": "帖子正文", "excerpt": "【中信建投 通信及人工智能】源杰科技26Q3业绩：Q3延续高增，CPO/NPO高功率光源进展顺利26Q3 持续高速增长26Q3 预计营收 6.50-7.00 亿元，同比 + 264", "content": "【中信建投 通信及人工智能】源杰科技26Q3业绩：Q3延续高增，CPO/NPO高功率光源进展顺利26Q3 持续高速增长26Q3 预计营收 6.50-7.00 亿元，同比 + 264.56%-292.60%，环比 + 14.04%-22.81%；归母净利 4.03-4.53 亿元，同比 + 578.85%-659.70%，环比 - 5.84%~+5.84%；扣非归母净利 4.00-4.50 亿元，同比 + 678.44%-775.74%，环比 + 18.69%-33.53%。公司数据中心业务收入大幅增长，CW 产品出货旺盛；高毛利数据中心产品占比维持高位，叠加规模效应，盈利能力持续提升。积极扩产应对强劲需求行业需求旺盛，海外光芯片龙头 Lumentum 表示其光器件产能已售罄至 2029 年初。公司积极推进产能扩张，26 年 2 月公告计划建设光电通讯半导体芯片和器件二期项目（总投资 12.51 亿元，建设期 18 个月），8 月公告计划建设半导体科技产业园（总投资 42.68 亿元，建设期 24 个月），持续打开长期成长空间。NPO、CPO 等产品进展顺利公司 70mW/100mW CW 激光器芯片已实现批量出货，100G PAM4 EML 产品已批量出货，200G PAM4 EML 产品客户验证稳步推进。面对 NPO、CPO 路线，公司同步研发 120mW/200mW/300mW/400mW 等高功率 CW 芯片，产品行业进度领先。整体来看，高功率产品有望 的核心资产。但Rubin出货预期已从约10000套系统下调至约5000套，主因GPU、正交背板、电源系统和相关组件良率和产能限制。\n- 光通信与测试设备业绩高增：联讯仪器预计Q1-Q3归母净利润19-21亿元，同比+1866%-2073%；源杰科技26Q3预计营收6.50-7.00亿元，扣非净利润4.0-4.5亿元，Q3扣非净利率约63%（按中值测算，环比+4%），CPO/NPO高功率光源进展顺利。\n\n## 二、今日最强主线\n### 1. AI算力/存储超级周期\n- 主线：AI既是算力问题也是存储问题，存储投资核心在于率先定价，而非精准择时或挖数据拐点。\n- 今天强化的逻辑：AI服务器内容量中GPU约占Vera Rubin集群成本一半，内存29%，网络/电源/散热等23%；Rubin HBM爬坡慢于预期，Blackwell占2026年英伟达高端GPU出货78%。\n- 今天出现的催化/验证：短期AI算力现货租赁价格高达每吉瓦400亿至500亿美元/年，美国AI算力租赁“现货价格”是长协的两倍；Rubin出货预期从约10000套下调至约5000套，ODM厂商核实出货量未达预期。\n\n### 2. 半导体设备/先进封装\n- 主线：存储扩产持续上修，千亿美金WFE市场即将到来，设备公司订单持续超出预期。\n- 今天强化的逻辑：长鑫存储快速扩张DRAM与HBM3，预计占中国HBM市场20%份额；长江存储全球NAND市占约12-13%，月产能20万片，国产设备占比45%；国内首条3D先进封装量产线（星辰技术）通线、华为τ定律芯片已经量产。\n- 今天出现的催化/验证：拓荆科技26H1新接订单翻倍以上，推测Q3环比提升明显；PECVD、ALD、SACVD、HDPCVD以及Flowable CVD等在存储客户已拿到领先市场份额，预计NAND/DRAM单万片订单量级可达12亿/8亿，预计27年新接订单延续高增。微导纳米拟定增募资不超过49.44亿元，投向无锡先进半导体设备产业化升级迭代项目、华中先进半导体设备产业化项目、尖端薄膜沉积技术研发中心项目等。\n\n### 3. 新能源车/中欧贸易与出口退税\n- 主线：中欧就混动车贸易达成初步协议，同时国内新能源汽车出口退税下调，自主出海趋势不改。\n- 今天强化的逻辑：中欧10月9日达成初步协议与共识，中国计划未来四年将面向欧盟的HEV、PHEV出口量削减一半，欧盟可持续获取中国稀土等关键原材料；欧盟将在10月15-16日欧洲理事会峰会上讨论。自2027年4月1日起新能源汽车增值税出口退税率由13%下调至9%，市场对此已有预期；参考光伏、电池经验，退税率下调后龙头公司90个交易日股价普遍回调，短期或扰动情绪。\n- 今天出现的催化/验证：巴黎车展中国车企出海展示更加精细，针对欧洲差异化智驾、座舱、舒适性进行丰富展示；大众、雷诺、STLA、奔驰等欧洲主流车企也发布大量新能源车型。吉利银河战舰700上市，12分钟订单突破1万台；小鹏目标到本十年末在欧洲实现年销量50万辆，欧洲销量将占其全球100万辆总销量的一半。\n\n### 4. PCB/CCL/铜箔\n- 主线：覆铜板周期更新，上调FR4 ASP，PTFE进度提前；AI CCL升级路线图推进。\n- 今天强化的逻辑：M9量产在即，M10与PTFE之争持续；M9目前仅EMC和生益通过英伟达认证，用于Rubin计算板；M10处于送样阶段，需采用Q-glass、纯碳氢树脂及HVLP5铜箔。有调研将生益科技及建滔积层板12个月目标价分别上调9%和14%至209元人民币及75港元，重申“买入”，列为行业首选标的。\n- 今天出现的催化/验证：鹏鼎控股AI PCB第二成长曲线全面进入兑现期，800G、1.6T光模块PCB已量产，3.2T研发推进；淮安110亿元、深圳100亿元项目及96亿元定增全面布局AI服务器和高速光模块。宏和科技管理层电话会显示AI驱动高端电子布与电子纱需求，产能持续扩张。谷歌与胜宏科技（hk02476）签署惠州工厂大批量订单。\n\n### 5. 光通信/CPO\n- 主线：光通信测试仪器设备放量，CPO/NPO高功率光源进展顺利，高速率产品验证推进。\n- 今天强化的逻辑：联讯仪器预计Q1-Q3归母净利润19-21亿元，同比+1866%-2073%，前三季度利润已达去年全年十倍以上；业绩增长主要来自AI算力需求提升带动数据中心建设加速，高速光通信需求保持较快增长，光模块与光芯片厂商持续扩产，进而拉动通信测试仪器和光电子器件测试设备的销售。源杰科技26Q3预计营收6.50-7.00亿元，扣非净利润4.0-4.5亿元，Q3扣非净利率约63%（按中值测算，环比+4%），盈利能力持续创新高，CPO/NPO高功率光源进展顺利。\n- 今天出现的催化/验证：关注2.4T/3.2T相关采样示波器送样进展、存储相关高速测试机验证进度以及CPO相关环节海外客户进展等。源杰科技港股招股书显示，其2025年第一大客户占收入的53.4%，大客户北美新型号换料会直接传导到源杰。东山精密10月8日称，其自研光芯片在模块物料成本中占比不超过10%。天孚通信的风险取决于列名范围，美方厂商的受益受产能约束。FCC与中国光模块：65%门槛传闻是否靠谱、后续将如何演进，仍需跟踪。\n\n### 6. 液冷/电源\n- 主线：液冷产能扩张与数据中心散热渗透率提升；Vicor 337调查对相关公司数据中心业务影响有限。\n- 今天强化的逻辑：通合科技更新显示，337调查是Vicor公司层面竞争，历史上已提过3次，不是自上而下发起的调查，经多方认证不会影响台系头部公司的数据中心业务，尤其是一二次电源和HVDC；调查针对柜内垂直电源48→1V，通合做的是480V→800V的ACDC模块，不是一个业务，不会影响头部台企合作。立讯精密方面，9月初Vicor向USITC发起337专利调查，起诉立讯精密、台达、富士康等20家公司，指控垂直供电系统VPD、零部件以及装了这套供电方案的服务器算力设备侵犯专利；对立讯精密短期财务冲击很小，反而是侧面利好信号，因立讯自家VPD电源产品还在客户测试验证阶段，还没大规模出货。\n- 今天出现的催化/验证：澄天伟业液冷产能自Rubin起切入NV，现有液冷模组产能2万套/月，26年底目标达到4万套/月，同时配套1万套/月Inner Manifold产能，年底产值有望达20亿+。至纯科技高效干冷器已供货字节、阿里等头部客户，用于数据中心散热；伴随AI算力建设提速，液冷、干冷等新型散热方案渗透率持续提升。\n\n## 三、今日重点关注\n### 3.1 今天已经发生的重点变化\n- 2026金融街论坛年会将于10月19日—10月22日在北京金融街举办，采取“主论坛+平行论坛+专题大会+配套活动”的框架结构，将集中发布系列金融改革发展政策；证监会主席吴清预计将在开幕式上发表主旨演讲。\n- 中欧于10月9日达成初步协议与共识，中国计划未来四年将面向欧盟的混动汽车（HEV）、插电混动汽车（PHEV）出口量削减一半，同时欧盟将可以持续获取来自中国的稀土等关键原材料；欧盟将在10月15-16日召开的欧洲理事会峰会上讨论。\n- 财政部、税务总局公告，自2027年4月1日起将新能源汽车的增值税出口退税率由13%下调至9%。\n- 源杰科技发布26Q3业绩预告，营收6.5–7.0亿元，扣非净利润4.0–4.5亿元，Q3扣非净利率约63%（按中值测算，环比+4%）。\n- 联讯仪器发布业绩预告，预计Q1-Q3实现归母净利润19.0-21.0亿元，同比+1866%-2073%。\n- 拓荆科技26H1新接订单翻倍以上，推测Q3环比提升明显，大幅超市场预期；预计NAND/DRAM单万片订单量级可达12亿/8亿，预计27年公司新接订单将延续高增势头。\n- 微导纳米拟定增募资不超过49.44亿元，分别投向无锡先进半导体设备产业化升级迭代项目（7.29亿元）、华中先进半导体设备产业化项目（2.89亿元）、尖端薄膜沉积技术研发中心项目（32.25亿元）及补充流动资金等。\n- Rubin出货预期已从大约10000套系统下调至约5000套，与ODM厂商核实证实出货量确实未达到预期，受限因素包括GPU、正交背板、电源系统和相关组件良率和产能限制。\n- 吉利新能源越野银河战舰700正式上市，尺寸5085*1999*1912mm，轴距2900mm，上市价16.98万元起售（16.98-23.98万元，陆地方舟版35.98万元），上市12分钟订单突破1万台。\n- 小鹏汽车目标到本十年末在欧洲实现年销量50万辆，其中欧洲销量将占其全球100万辆总销量的一半。\n- 有观点认为AI情绪阶段性回落，非AI互联网迎来重估窗口，重点推荐美团、BOSS直聘；AI标的上依然坚定选择阿里，AI交易拥挤度见顶，部分资金开始主动寻求非AI标的估值洼地，互联网板块中基本面持续改善、估值仍处低位的标的开始获得关注，短期港股或有阶段性反弹行情。\n- 煤炭观点认为，本轮核增更多是666号文框架下的产能匹配和存量合法化，并非新一轮大规模增产，供需偏紧主线未变。\n- 油运大跌点评提出两个动因：伊朗革命卫队警告称袭击行动不会仅限于霍尔木兹海峡，将打击范围扩展至波斯湾更深处；美俄达成成品油协议。相关观点认为下跌即可加仓。\n- 澳门10月1-11日行业GGR约为92亿澳门元，日均GGR约为8.36亿澳门元，可比口径下同比下降5%-7%；国庆黄金周内地访澳客流同比增长11%，但高端客群需求偏弱，高端中场市场竞争有所加剧。\n 10月9日达成初步协议，中国计划未来四年将面向欧盟的HEV、PHEV出口量削减一半，欧盟可持续获取中国稀土等关键原材料。比亚迪对欧业务敞口最高，纯电、插混占其总出口规模的30%-40%，其次为奇瑞约25%以及上汽。\u003c/li>\n\u003cli>AI算力租赁价格信号强烈：短期现货租赁价格高达每吉瓦400亿至500亿美元/年，美国AI算力租赁“现货价格”是长协的两倍，分析师看好供需缺口下算力仍是当前最稀缺的核心资产。但Rubin出货预期已从约10000套系统下调至约5000套，主因GPU、正交背板、电源系统和相关组件良率和产能限制。\u003c/li>\n\u003cli>光通信与测试设备业绩高增：联讯仪器预计Q1-Q3归母净利润19-21亿元，同比+1866%-2073%；源杰科技26Q3预计营收6.50-7.00亿元，扣非净利润4.0-4.5亿元，Q3扣非净利率约63%（按中值测算，环比+4%），CPO/NPO高功率光源进展顺利。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>1. AI算力/存储超级周期\u003c/h3>\n\u003cul>\n\u003cli>主线：AI既是算力问题也是存储问题，存储投资核心在于率先定价，而非精准择时或挖数据拐点。\u003c/li>\n\u003cli>今天强化的逻辑：AI服务器内容量中GPU约占Vera Rubin集群成本一半，内存29%，网络/电源/散热等23%；Rubin HBM爬坡慢于预期，Blackwell占2026年英伟达高端GPU出货78%。\u003c/li>\n\u003cli>今天出现的催化/验证：短期AI算力现货租赁价格高达每吉瓦400亿至500亿美元/年，美国AI算力租赁“现货价格”是长协的两倍；Rubin出货预期从约10000套下调至约5000套，ODM厂商核实出货量未达预期。\u003c/li>\n\u003c/ul>\n\u003ch3>2. 半导体设备/先进封装\u003c/h3>\n\u003cul>\n\u003cli>主线：存储扩产持续上修，千亿美金WFE市场即将到来，设备公司订单持续超出预期。\u003c/li>\n\u003cli>今天强化的逻辑：长鑫存储快速扩张DRAM与HBM3，预计占中国HBM市场20%份额；长江存储全球NAND市占约12-13%，月产能20万片，国产设备占比45%；国内首条3D先进封装量产线（星辰技术）通线、华为τ定律芯片已经量产。\u003c/li>\n\u003cli>今天出现的催化/验证：拓荆科技26H1新接订单翻倍以上，推测Q3环比提升明显；PECVD、ALD、SACVD、HDPCVD以及Flowable CVD等在存储客户已拿到领先市场份额，预计NAND/DRAM单万片订单量级可达12亿/8亿，预计27年新接订单延续高增。微导纳米拟定增募资不超过49.44亿元，投向无锡先进半导体设备产业化升级迭代项目、华中先进半导体设备产业化项目、尖端薄膜沉积技术研发中心项目等。\u003c/li>\n\u003c/ul>\n\u003ch3>3. 新能源车/中欧贸易与出口退税\u003c/h3>\n\u003cul>\n\u003cli>主线：中欧就混动车贸易达成初步协议，同时国内新能源汽车出口退税下调，自主出海趋势不改。\u003c/li>\n\u003cli>今天强化的逻辑：中欧10月9日达成初步协议与共识，中国计划未来四年将面向欧盟的HEV、PHEV出口量削减一半，欧盟可持续获取中国稀土等关键原材料；欧盟将在10月15-16日欧洲理事会峰会上讨论。自2027年4月1日起新能源汽车增值税出口退税率由13%下调至9%，市场对此已有预期；参考光伏、电池经验，退税率下调后龙头公司90个交易日股价普遍回调，短期或扰动情绪。\u003c/li>\n\u003cli>今天出现的催化/验证：巴黎车展中国车企出海展示更加精细，针对欧洲差异化智驾、座舱、舒适性进行丰富展示；大众、雷诺、STLA、奔驰等欧洲主流车企也发布大量新能源车型。吉利银河战舰700上市，12分钟订单突破1万台；小鹏目标到本十年末在欧洲实现年销量50万辆，欧洲销量将占其全球100万辆总销量的一半。\u003c/li>\n\u003c/ul>\n\u003ch3>4. PCB/CCL/铜箔\u003c/h3>\n\u003cul>\n\u003cli>主线：覆铜板周期更新，上调FR4 ASP，PTFE进度提前；AI CCL升级路线图推进。\u003c/li>\n\u003cli>今天强化的逻辑：M9量产在即，M10与PTFE之争持续；M9目前仅EMC和生益通过英伟达认证，用于Rubin计算板；M10处于送样阶段，需采用Q-glass、纯碳氢树脂及HVLP5铜箔。有调研将生益科技及建滔积层板12个月目标价分别上调9%和14%至209元人民币及75港元，重申“买入”，列为行业首选标的。\u003c/li>\n\u003cli>今天出现的催化/验证：鹏鼎控股AI PCB第二成长曲线全面进入兑现期，800G、1.6T光模块PCB已量产，3.2T研发推进；淮安110亿元、深圳100亿元项目及96亿元定增全面布局AI服务器和高速光模块。宏和科技管理层电话会显示AI驱动高端电子布与电子纱需求，产能持续扩张。谷歌与胜宏科技（hk02476）签署惠州工厂大批量订单。\u003c/li>\n\u003c/ul>\n\u003ch3>5. 光通信/CPO\u003c/h3>\n\u003cul>\n\u003cli>主线：光通信测试仪器设备放量，CPO/NPO高功率光源进展顺利，高速率产品验证推进。\u003c/li>\n\u003cli>今天强化的逻辑：联讯仪器预计Q1-Q3归母净利润19-21亿元，同比+1866%-2073%，前三季度利润已达去年全年十倍以上；业绩增长主要来自AI算力需求提升带动数据中心建设加速，高速光通信需求保持较快增长，光模块与光芯片厂商持续扩产，进而拉动通信测试仪器和光电子器件测试设备的销售。源杰科技26Q3预计营收6.50-7.00亿元，扣非净利润4.0-4.5亿元，Q3扣非净利率约63%（按中值测算，环比+4%），盈利能力持续创新高，CPO/NPO高功率光源进展顺利。\u003c/li>\n\u003cli>今天出现的催化/验证：关注2.4T/3.2T相关采样示波器送样进展、存储相关高速测试机验证进度以及CPO相关环节海外客户进展等。源杰科技港股招股书显示，其2025年第一大客户占收入的53.4%，大客户北美新型号换料会直接传导到源杰。东山精密10月8日称，其自研光芯片在模块物料成本中占比不超过10%。天孚通信的风险取决于列名范围，美方厂商的受益受产能约束。FCC与中国光模块：65%门槛传闻是否靠谱、后续将如何演进，仍需跟踪。\u003c/li>\n\u003c/ul>\n\u003ch3>6. 液冷/电源\u003c/h3>\n\u003cul>\n\u003cli>主线：液冷产能扩张与数据中心散热渗透率提升；Vicor 337调查对相关公司数据中心业务影响有限。\u003c/li>\n\u003cli>今天强化的逻辑：通合科技更新显示，337调查是Vicor公司层面竞争，历史上已提过3次，不是自上而下发起的调查，经多方认证不会影响台系头部公司的数据中心业务，尤其是一二次电源和HVDC；调查针对柜内垂直电源48→1V，通合做的是480V→800V的ACDC模块，不是一个业务，不会影响头部台企合作。立讯精密方面，9月初Vicor向USITC发起337专利调查，起诉立讯精密、台达、富士康等20家公司，指控垂直供电系统VPD、零部件以及装了这套供电方案的服务器算力设备侵犯专利；对立讯精密短期财务冲击很小，反而是侧面利好信号，因立讯自家VPD电源产品还在客户测试验证阶段，还没大规模出货。\u003c/li>\n\u003cli>今天出现的催化/验证：澄天伟业液冷产能自Rubin起切入NV，现有液冷模组产能2万套/月，26年底目标达到4万套/月，同时配套1万套/月Inner Manifold产能，年底产值有望达20亿+。至纯科技高效干冷器已供货字节、阿里等头部客户，用于数据中心散热；伴随AI算力建设提速，液冷、干冷等新型散热方案渗透率持续提升。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>2026金融街论坛年会将于10月19日—10月22日在北京金融街举办，采取“主论坛+平行论坛+专题大会+配套活动”的框架结构，将集中发布系列金融改革发展政策；证监会主席吴清预计将在开幕式上发表主旨演讲。\u003c/li>\n\u003cli>中欧于10月9日达成初步协议与共识，中国计划未来四年将面向欧盟的混动汽车（HEV）、插电混动汽车（PHEV）出口量削减一半，同时欧盟将可以持续获取来自中国的稀土等关键原材料；欧盟将在10月15-16日召开的欧洲理事会峰会上讨论。\u003c/li>\n\u003cli>财政部、税务总局公告，自2027年4月1日起将新能源汽车的增值税出口退税率由13%下调至9%。\u003c/li>\n\u003cli>源杰科技发布26Q3业绩预告，营收6.5–7.0亿元，扣非净利润4.0–4.5亿元，Q3扣非净利率约63%（按中值测算，环比+4%）。\u003c/li>\n\u003cli>联讯仪器发布业绩预告，预计Q1-Q3实现归母净利润19.0-21.0亿元，同比+1866%-2073%。\u003c/li>\n\u003cli>拓荆科技26H1新接订单翻倍以上，推测Q3环比提升明显，大幅超市场预期；预计NAND/DRAM单万片订单量级可达12亿/8亿，预计27年公司新接订单将延续高增势头。\u003c/li>\n\u003cli>微导纳米拟定增募资不超过49.44亿元，分别投向无锡先进半导体设备产业化升级迭代项目（7.29亿元）、华中先进半导体设备产业化项目（2.89亿元）、尖端薄膜沉积技术研发中心项目（32.25亿元）及补充流动资金等。\u003c/li>\n\u003cli>Rubin出货预期已从大约10000套系统下调至约5000套，与ODM厂商核实证实出货量确实未达到预期，受限因素包括GPU、正交背板、电源系统和相关组件良率和产能限制。\u003c/li>\n\u003cli>吉利新能源越野银河战舰700正式上市，尺寸5085\u003cem>1999\u003c/em>1912mm，轴距2900mm，上市价16.98万元起售（16.98-23.98万元，陆地方舟版35.98万元），上市12分钟订单突破1万台。\u003c/li>\n\u003cli>小鹏汽车目标到本十年末在欧洲实现年销量50万辆，其中欧洲销量将占其全球100万辆总销量的一半。\u003c/li>\n\u003cli>有观点认为AI情绪阶段性回落，非AI互联网迎来重估窗口，重点推荐美团、BOSS直聘；AI标的上依然坚定选择阿里，AI交易拥挤度见顶，部分资金开始主动寻求非AI标的估值洼地，互联网板块中基本面持续改善、估值仍处低位的标的开始获得关注，短期港股或有阶段性反弹行情。\u003c/li>\n\u003cli>煤炭观点认为，本轮核增更多是666号文框架下的产能匹配和存量合法化，并非新一轮大规模增产，供需偏紧主线未变。\u003c/li>\n\u003cli>油运大跌点评提出两个动因：伊朗革命卫队警告称袭击行动不会仅限于霍尔木兹海峡，将打击范围扩展至波斯湾更深处；美俄达成成品油协议。相关观点认为下跌即可加仓。\u003c/li>\n\u003cli>澳门10月1-11日行业GGR约为92亿澳门元，日均GGR约为8.36亿澳门元，可比口径下同比下降5%-7%；国庆黄金周内地访澳客流同比增长11%，但高端客群需求偏弱，高端中场市场竞争有所加剧。\u003c/li>\n\u003cli>2026Q3港股IPO发行仍高热度：截至9月共114个项目、募资3856亿港元，同比分别+70%、+105%，A2H占比升至33%。\u003c/li>\n\u003cli>AI安全方面，CrowdStrike披露攻击者利用AI Agent及Claude等工具攻击韩国多家银行；OpenAI此前披露智能体突破沙箱网络限制访问外部服务；Zscaler联合IBM、Red Hat推出漏洞实时防护方案，并重申FY27业绩指引。\u003c/li>\n\u003cli>AI4S方面，Agent由“答题”转向拆解科研目标、调用专业模型、衔接真实实验，算法、数据、设备形成连续工作流；Science Token把模型、算力、编排与机器人实验封装为按调用量计费的标准服务，把可复用科研能力变成持续。\u003c/li>\n\u003cli>博硕科技更新显示，NV自动化设备双code（研发及量产）已下，近期将落地首批订单，剑指北美客户明年百亿需求；与泰瑞达战略合作，后续有望进一步覆盖液冷、光互联、硅光等新型基础设施环节设备。\u003c/li>\n\u003cli>DeepSeek计划领投机器人AI初创公司Winverse AI的种子轮融资，融资金额达数千万美元。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>10月19日—10月22日金融街论坛年会，证监会主席吴清预计在开幕式上发表主旨演讲，关注系列金融改革发展政策集中发布。\u003c/li>\n\u003cli>10月15-16日欧洲理事会峰会，关注中欧混动汽车出口削减、稀土等关键原材料获取等议题的后续谈判与落地。\u003c/li>\n\u003cli>2.4T/3.2T相关采样示波器送样进展、存储相关高速测试机验证进度以及CPO相关环节海外客户进展。\u003c/li>\n\u003cli>Rubin HBM爬坡进展、Blackwell在2026年英伟达高端GPU出货中的占比变化，以及Rubin出货预期是否进一步调整。\u003c/li>\n\u003cli>存储扩产上修背景下，长鑫存储、长江存储相关设备订单兑现情况，以及NAND/DRAM单万片订单量级、27年新接订单高增的持续性。\u003c/li>\n\u003cli>FCC与中国光模块65%门槛传闻后续是否靠谱、如何演进；东山精密自研光芯片在模块物料成本中占比、天孚通信列名范围等变量。\u003c/li>\n\u003cli>中欧贸易谈判后续是否涉及全面加税，以及安克创新、石头科技、绿联科技等公司股价反弹持续性。\u003c/li>\n\u003cli>AI算力租赁现货价格与长协价格差距、供需缺口下算力稀缺性是否延续。\u003c/li>\n\u003cli>新能源汽车出口退税率下调后龙头公司股价表现，以及自主车企全球竞争力与出海趋势。\u003c/li>\n\u003cli>OCP全球峰会相关进展，关注液冷、电源、光互联等新型基础设施环节。\u003c/li>\n\u003cli>美国通胀数据、美联储下一步行动，以及美国中期选举、纳指高位盘整还是向上突破。\u003c/li>\n\u003cli>煤炭供需偏紧主线、油运运价与地缘扰动、澳门高端客群需求与GGR同比变化。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>07:11｜盘前热点事件一、昨日热点并购：新华传媒、东百集团 AI短剧：德才股份 鼠疫：华北制药 电池：时代万恒 风电：天顺风能二、2026金融街论坛年会将集中发布系列金融改革发展政策2026金融街论坛年会新闻发布会在京举行。记者从发布会上了解到，2026金融街论坛年会将于10月19日—10月22日举行，采取“主论坛+平行论坛+专题大会+配套活动”的框架结构，主论坛活动由人民银行、金融监管总局、证监会、新华社、外汇管理局承办，将围绕人工智能技术演进\u003c/li>\n\u003cli>07:13｜202601012复盘 宏观： 1. 金融街论坛年会将于10月19日至22日举办。2. 沙特输油管道扩建计划有望将输油能力提升至1000万桶/日，2-3年完成总目标。\u003c/li>\n\u003cli>07:13｜10月13日：金融街论坛、短剧、汽车测试、光刻机及新凯来等概念股梳理 一、昨夜发酵消息精选。1、金融街论坛：2026金融街论坛年会将于10月19日至22日在北京金融街举办。\u003c/li>\n\u003cli>07:15｜10月13日股市早报：封测/铁路/影视/传媒/风电设备/电网/储能/氯化亚砜/固态电池/医药等一、重要财经信息①2026金融街论坛年会将于10月19日至22日在北京金融街举办。②财政部、税务总局：自2027年4月1日起 将新能源汽车的增值税出口退税率由13%下调至9%。\u003c/li>\n\u003cli>07:16｜【奇瑞汽车、比亚迪、上汽集团等都在抓紧研发 固态电池“上车”提速】财联社10月13日电，多家中国车企的固态电池研发业务进程正在提速。10月12日，奇瑞汽车有关负责人对上海证券报记者确认，公司电池事业部的固态电池研发已在稳妥推进中。\u003c/li>\n\u003cli>07:16｜【周二你需要知道的隔夜全球要闻：美联储哈玛克称利率需要进一步上调；俄美已开始就柴油交易谈判\u003c/li>\n\u003cli>07:16｜【盘后A股上市公司重点业绩公告精选】财联社10月10日电，据财联社不完全统计，截至发稿，盘后包括联讯仪器、源杰科技、北方稀土、翰宇药业、超声电子、奥来德、坤彩科技、粤桂股份、全志科技、神火股份、新宙邦、纳微科技、优博讯、捷捷微电、冰轮环境、国机精工在内的多家A股上市公司发布2026年前三季度/第三季度业绩预告。其中，联讯仪器公告，前三季度净利润同比预增1866%-2073%。\u003c/li>\n\u003cli>07:17｜应用材料公司预计未来几年收入将翻一番，但招聘人数不会相应增加，因为该公司更多地依赖人工智能工具进行产品开发和质量控制等工作。\u003c/li>\n\u003cli>07:17｜贝莱德看好短期债券，下调股票评级\u003c/li>\n\u003cli>07:17｜由于中东冲突不断扩大，威胁到该地区石油供应的复苏，石油价格因此上涨；与此同时，人们对美国总统唐纳德·特朗普关于俄罗斯和乌克兰之间“能源停火”的说法也表示怀疑。\u003c/li>\n\u003cli>07:17｜市场综述：由于芯片制造商的抛售潮打击了市场情绪，亚洲股市预计将下跌。而关键的财报季和可能影响美联储下一步行动的美国通胀数据也备受关注。\u003c/li>\n\u003cli>07
