 价值量约 130—140 元/片）。 2. 高端制造/新质生产力：丰田宣布 2028 年起每年投资约 1 万亿日元、集团与供应商合计部署 40 万台机器人；智元通用具身机器人累计下线 2 万台；特斯拉 Optimus Q4 周产目标上调至 2,000—2,500 台、四大部门组团来华审厂；宏鑫科技互动易确认已接人形机器人结构件小批量订单（上半年机器人业务收入 16.40 万元、占营收 0.03%）。 3. 新能源与电力系统新技术：七部门印发《新型电池产业发展\"十五五\"规划》，明确 2030 年全固态电池初步规模化应用、锂电池循环寿命 15,000 次、19 项重点任务；国轩高科签 10.94 亿欧元 29.1GWh 锂电项目总承包合同并拟与大众共同投建基地；中闽能源签 41.65 亿元海上风电送出 EPC；佳电股份中标 6.2 亿元反应堆冷却剂泵设备；国资委明确 2026 年国资央企「六张网」年度计划投资约 2 万亿元。 4. 医药创新：默沙东 4 亿美元首付引进思璞锐临床前口服 KRAS G12D(ON) 分子胶 SPR2015（总价值 21.3 亿美元、已交割）；美国财政部拟允许大部分对华医药对外授权交易（预计 30—45 天内发布规则）；9—10 月进入密集数据读出窗口（10 月 ESMO）。 5. 中国制造出海：中美 300 亿美元对等降税清单落地（小家电、玩具、婴儿用品、厨卫、节日礼品等，超 90% 降至最惠国税率）并设「安全池」；汽车整车逆势 +1%（江淮汽车 4 天 3 板）、小家电板块涨超 1%；集运运价 6—9 月同比涨幅由 50% 逐月扩大至 200%、9 月底达 250%。 + 周期成长：贵金属板块 −5%、山东黄金跌停；锡业股份锡业分公司 9/30 起停产检修；山西 9 月上旬原煤产量同比降约 27.5%。 **三大预期差** 一、9/28 的杀跌在产业侧找不到对应利空。当日被卖得最狠的通信与电子，对应三条公开信息分别是光模块法案 S.5548 提案（花旗判定仅针对国家安全系统采购、未对商业数据中心与 AI 基础设施实施全面禁令，高盛同日发布光网络研究并称假期前下跌或提供长期买入机会）、亨通光电 66.36 亿元定增扩产光纤预制棒、以及 OpenAI 因安全顾虑取消发布 GPT-6.1 Astra——没有一条能否定同日发生的兆易采购上修、长鑫扩产与成熟制程调价。 二、存储链的读法要从「价格信号」切换到「公司决策信号」。DDR5 现货 9/28 仅涨 0.29%、DDR4 部分规格已转跌，价格信号明显钝化；但同一天兆易把 9—12 月采购额定到超过前八个月、长鑫把 108 亿元投向测试产能。价格信号变弱而采购与资本开支变强，通常意味着产业已越过「涨价预期」进入「产能与订单兑现」阶段。 三、成熟制程是本轮 AI 通胀里最被忽视的一段。市场只盯 2nm 与 HBM，但 AI 服务器单台需要数十颗 PMIC、高压电源管理、BMC、MCU 与网通芯片，绝大多数建在 28nm 及以上成熟制程平台上；TrendForce 已把 8 英寸平均稼动率上修至 88%—90%，联电、世界先进与力积电均已选择性调价，而晶圆厂同时在把旧世代产能转向特殊制程——需求在增、可用产能在减，这条线的「量价齐升」要到 2027 年才完整兑现。 **次日与节前验证** 1. 9/29—9/30 盘后：电子与通信主力净流出、中际旭创成交额、创业板指 3,139.82 与科创 50 1,555.98 是否失守。 2. 10/1 凌晨（9/30 美股盘后）：美光 FY26Q4 财报（市场共识营收约 500—511 亿美元、同比约 +350%），重点看 DRAM/NAND 定价指引与是否增加消费级供应。 3. 10 月中—10 月底：PCB 与覆铜板三季报净利率能否由「分化」转为「同步上行」，以及 10 月建滔是否发出年内第八张涨价函。 口径：成长五线，不含宏观数据解读。本期为盘前版，第 1 节数据为 9/28（周一）收盘。#文字观点", "publish_time": "2026-09-29 09:17", "tags": ["文字观点"]}, "post:2026-09-29T15-45:8a252e532fbb": {"id": "post:2026-09-29T15-45:8a252e532fbb", "kind": "post", "title": "2026-09-29 15:45", "source_label": "帖子正文", "excerpt": "9月29日复盘笔记：固态电池/PCB/房地产/AI应用/算力租赁/机器人/分散染料/电力/创新药等一、重磅财经信息①农业农村部在新闻发布会上介绍，生猪供需形势持续改善，价格有波动但总体回升。②截至2026年上半年，我国生成式人工智能用户规模突破7亿人，普及率超50.0%。", "content": "9月29日复盘笔记：固态电池/PCB/房地产/AI应用/算力租赁/机器人/分散染料/电力/创新药等一、重磅财经信息①农业农村部在新闻发布会上介绍，生猪供需形势持续改善，价格有波动但总体回升。 ②截至2026年上半年，我国生成式人工智能用户规模突破7亿人，普及率超50.0%。 ③中国气象局监测11月前后将形成超强厄尔尼诺事件二、大盘表现沪指涨0.18%，深证成指涨0.34%，创业板指涨0.09%，科创50涨0.86%。沪深两市全天成交额14091.97亿元，较上一日缩量2936亿元，创出2025年7月8日以来新低，较2026年1月14日创出的历史天量39414.84亿元萎缩超64%。三、强势板块和个股分析备注：只列举部分涨停板固态电池工信部等七部门联合制定的《新型电池产业发展“十五五”规划》正式发布，目标是到2030年，全固态源头信息加微信 WUXL3408电池初步实现规模化应用。涨停板：上海洗霸、国轩高科、金龙羽、英联股份、紫竹高科、传艺科技、维科技术、尚水智能其他强势股：宏工科技、利元亨、天力锂能、信宇人PCB多家机构研报指出，随着上游原材料价格持续上行，‌PCB（印制电路板）厂商已陆续启动重新报价‌。这一现象标志着产业链价格传导机制的打通，预计‌2026年第三季度‌将成为板块盈利改善的起涨点。涨停板：依顿电子、崇达技术、奥士康、迅捷兴、超声电子、澳弘电子、协和电子、安德利其他强势股：金禄电子、强达电路、满坤科技、四会富仕、金百泽房地产国务院常务会议9月28日召开，会议指出推出一批务实管用的增量政策，研究出台稳定房地产市场、促进就业增收等政策措施。涨停板：万科A、深物业A、信达地产、滨江集团、华联控股、华发股份其他强势股：特发服务、绿地控股、招商蛇口、金地集团AI应用央行等八部门联合印发《关于金融支持服务业扩能提质的指导意见》，提出赋能软件和信息技术服源头信息加微信 WUXL3408务创新发展，引导金融机构综合运用信贷、债券、股权等多样化工具，支持\"人工智能+软件\"发展。涨停板：新华传媒、新华文轩、掌阅科技、引力传媒、中国出版、华媒控股其他强势股：值得买、当虹科技、因赛集团、数字政通、榕基软件算力租赁算力租赁商Nebius计划自10月1日起上调主要英伟达GPU按需租金，H100由3.85美元每小时升至4.50美元，H200由4.50升至5.40美元，B200由7.15升至8.50美元，B300由7.85升至9.50美元，整体涨幅约17%至21%。涨停板：迈信林、南威软件、超讯科技、纵横通信其他强势股：盈峰环境、东方材料、湖北广电机器人特斯拉近几个月将Optimus人形机器人的产量提高了大约十倍，但公司仍在努力实现大规模可靠生产。据熟悉项目的人士透露，其生产线正面临机器人复杂手部、自动化设备和供应商限制等问题。上个月，特斯拉每周生产了几百台机器人。涨停板：襄阳轴承、雪龙集团其他强势股：科森科技、斯菱智驱分散染料9月1日以来，分散染料价格一直维持在30元/千克的高位，相比6月22日的23元/千克上涨7元/千克，2个多月的时间价格上涨超30%；活性染料价格达45元/千克，此轮上涨也从6月中下旬开始，初始价格为29元/千克，涨幅达55%，其中间体H酸9月20日百川盈孚报价涨至145元/千克，相较本轮上涨起点的61元/千克提升138%。涨停板：善水科技、亚邦股份、吉华集团其他强势股：锦鸡股份、安诺其电力截至8月底，全国累计发电装机容量41.03亿千瓦，同比增长11.1%。涨停板：浙江新能、宁波能源其他强势股：中闽能源、粤电力A创新药机构：国内药企新药出海授权交易带动投融资逐渐修复，biotech研发需求回升。AI制药传导链条进入正向循环，从加速设计到湿实验验证再回灌AI模型迭代的模式已初步确立，率先利好上游蛋白合成、临床前CRO等环节。内容来自小牛研报纪要星球涨停板：津药药业其他强势股：近岸蛋白、百花医药、康弘药业、益方生物网络安全①英伟达发布开放智能体安全平台，该平台由OpenShell开源软件和Sentry参考系统设计组成，Sentry系统则运行于BlueField-4DPU上，能够持续监控智能体行为，并在发现异常时将其隔离，最快可在数毫秒内完成。 ②OpenAI在测试中发现安全风险后，取消了原定10月发布新模型GPT-6.1 Astra的计划。涨停板：中新赛克其他强势股：永信至诚、启明信息、高凌信息美容护理8月化妆品类消费零售额为368亿元，同比增长4.9%，较7月的285亿元，环比增长42.64%。涨停板：拉芳家化其他强势股：洁雅股份、延江股份、水羊股份其他涨停板广汽集团、园林股份：并购重组复牌均瑶健康：乳业路畅科技：智能驾驶#文字观点", "publish_time": "2026-09-29 15:45", "tags": ["文字观点"]}, "post:2026-09-29T15-54:1a9367870d0d": {"id": "post:2026-09-29T15-54:1a9367870d0d", "kind": "post", "title": "2026-09-29 15:54", "source_label": "帖子正文", "excerpt": "【西南电子-AI散热】鸿富诚上市，AI散热值得重点关注事件：今日鸿富诚成功上市，AI散热板块迎来催化及定价锚。GPU功耗激增，热管理重要性持续提升 ：以英伟达GPU为例，AI芯片热设计功耗已经历迅速攀升，2024年B200 TDP仅700W，Rubin TDP已达2300W，预计Rubin Ultr", "content": "【西南电子-AI散热】鸿富诚上市，AI散热值得重点关注事件：今日鸿富诚成功上市，AI散热板块迎来催化及定价锚。GPU功耗激增，热管理重要性持续提升 ：以英伟达GPU为例，AI芯片热设计功耗已经历迅速攀升，2024年B200 TDP仅700W，Rubin TDP已达2300W，预计Rubin Ultra有望达2600W。功耗提升使得热管理的难度不断增加，若散热不当可能导致性能下降、寿命缩短甚至硬件故障，AI算力系统中热管理重要性持续提升。TIM市场受益于AI快速增长，中短期看石墨烯等材料能快速满足散热需求：根据QY Research预计，2026年全球AI服务器TIM市场规模5.65亿美元，受益于AI等下游领域快速发展，预计到2032年将增长至15.41 亿美元，CAGR约18.2%。石墨烯具有出色的机械性能、极高的载流子迁移率、优异的导热性能以及透光率，热导率高达 5,300W/m·K，明显高于金刚石和单壁碳纳米管，在导热界面材料领域具有极大的潜力。中长期看，浸没式液冷有望在高功率密度场景加速渗透：浸没式液冷将整台服务器甚至整个机柜浸入绝缘冷却液中，芯片热量通过冷却液直接对流带走，其散热能力理论上高于冷板式液冷，适合极端高密度场景，中长期维度看有望在AI数据中心中快速上量。据QY Research预计，2030年全球数据中心浸没式冷却液市场规模将达到 9.7 亿美元，2024年至2030年复合增长率为21.2%，市场前景广阔。相关标的：鸿富诚（采用石墨烯膜垂直取向路线，供应全球AI芯片头部企业）、润禾材料（浸没式冷却液批量送样+高端TIM项目面世）、美盈森(汉高合作）、中石科技、德邦科技、苏州天脉、捷邦科技等 风险提示：新技术应用不及预期等 ☎XNDZ：胡杨15189021156#文字观点", "publish_time": "2026-09-29 15:54", "tags": ["文字观点"]}, "attachment:files/Bernstein-中国互联网：中国下一代赢家：人工智能赋能，上下文锁定之争 China Internet China Next Winners AI harnesses, and the battle for context lock-in.pdf": {"id": "attachment:files/Bernstein-中国互联网：中国下一代赢家：人工智能赋能，上下文锁定之争 China Internet China Next Winners AI harnesses, and the battle for context lock-in.pdf", "kind": "attachment", "title": "Bernstein-中国互联网：中国下一代赢家：人工智能赋能，上下文锁定之争 China Internet China Next Winners AI harnesses, and the battle for context lock-in", "source_label": "Bernstein", "excerpt": "CHINA NEXT WINNERS 28 September 2026 China Internet China Next Winners: AI harnesses, and the battle for context lock-in Robin Zhu +852 2123 2659 robin.zhu@bernsteinsg.com Charles ", "content": "CHINA NEXT WINNERS 28 September 2026 China Internet China Next Winners: AI harnesses, and the battle for context lock-in Robin Zhu +852 2123 2659 robin.zhu@bernsteinsg.com Charles Gou +852 2123 2618 charles.gou@bernsteinsg.com Min-Joo Kang +852 2123 2644 minjoo.kang@bernsteinsg.com Makoto Morozumi +81 3 6777 6972 makoto.morozumi@bernsteinsg.comAgent harnesses as strategic assets. Several recent developments have focused investor attention on agentic harness apps, including ongoing Meta Muse excitement, T encent Workbuddy traction, and Alibaba placing a big focus on enterprise context capture at its recent Apsara conference. Model intelligence remains foundational to task completion. But at a high level, we expect the strategic importance of harness quality to persistent AI workflows to drive convergence between model and harness development. Agent harnesses as better human worker analogs. Whereas AI models are largely stateless, meaning they do not retain knowledge between queries, agent harnesses add persistent memory, orchestration loops, tool calls (e.g. computer use), and also libraries of skills and reference files. These inform and support task completion, but also allow the harness to learn “how” to do so to align with human user taste and judgement. While coding agents were the first, obvious use case for agent harnesses, general productivity assistants like Muse, Workbuddy, and Qwen Work leverage code to produce multi-modal outputs across a wide range of end use cases. Two approaches to context capture in China. Workbuddy jumped out to an early engagement lead in China, leveraging T encent’s social and communications reach. Meanwhile Xiaowei within Weixin has the potential to be the dominant consumer agent where online transaction intent meets pre-existing action and payment rails. In the orange corner, Alibaba’s agent harness pitch at Apsara was focused more around governed solutions in key verticals, and helping enterprises fence in proprietary context. Qwen Work’s stated goal to help address “power users accruing AI ROI at the individual level” as a key enterprise pain-point was one of the more memorable quotes from last week. The right lessons to learn from Muse. Muse achieving viral traction as “OpenClaw for normies” has reignited investor interest in consumer AI agents. Rather than new tech innovation, we’d argue the Muse success was a triumph of low-friction UI/UX design, ecosystem connectivity… and clever marketing. We can’t help but compare the functionality Muse supports with the Xiaowei agent T encent has been developing for Weixin. Supporting use (and mis-use) by 1bn+ Weixin users sets a high bar for safety and alignment. But Xiaowei already has permissioned API access to Mini Programs, and serves consumers who already exhibit every kind of online transaction intent. AI harness optionality? The state of consumption growth in China means AI remains the only game in town within our China coverage. While T encent and Alibaba have taken divergent paths to combining agent harnesses with platform context reach, we’d expect the AI opportunity to be big enough to support both approaches. Both companies need to demonstrate moving from proof-of-concept to real-world deployment. But we’d argue neither stock is pricing in much optionality on 11-12x 2027E PE. Among China’s independent AI labs, DeepSeek Harness and ZCode have seen the best traction, on the evidence of OpenRouter requests and token consumption. See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 27 Sep 2026 20:30 UTC Completion Date: 25 Sep 2026 16:59 UTC on 28-Sep-2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Robin Zhu +852 2123 2659 robin.zhu@bernsteinsg.com 28 September 2026 BERNSTEIN TICKER TABLE 25 Sep 2026TTM Adjusted EPS Adjusted P/E (x) Closing Price Rel. Ticker Rating Cur Price Target Perf. Cur 2025A 2026E 2027E 2025A 2026E 2027E 700.HK (T encent) O HKD 436.60 760.00 (59.3)% CNY 28.09 29.72 31.27 13.3 12.6 11.9 BABA (Alibaba ) O USD 110.63 165.00 (54.4)% CNY 26.82 44.78 64.65 27.7 16.6 11.5 9988.HK (Alibaba) O HKD 108.40 161.00 (62.0)% HKD 8.82 3.69 6.46 10.5 25.2 14.4 2513.HK (Z.AI) O HKD 633.50 1,500.00 NA RMB (2.40) (5.35) 1.07 (264.4) (118.3) 590.6 100.HK (MiniMax) M HKD 275.20 320.00 NA USD (2.31) (2.11) (2.31) (15.2) (16.6) (15.2) ASIAX 1,978.05 SPX 7,743.41 O - Outperform, M - Market-Perform, U - Underperform, NR - Not Rated, CS - Coverage Suspended BABA base year is 2026; Source: Bloomberg, Bernstein estimates and analysis. INVESTMENT IMPLICATIONS Agent harnesses surround the AI model. By adding persistent memory, they help to bridge the gap between AI models as one- shot reasoning machines and long-horizon task completion. Strategically, the ability of agentic applications to not just complete tasks but also adapt to user preferences to solve problems in the “correct” way (analytically or stylistically) makes them much more analogous to human co-workers. In turn, harness engagement can help to create user stickiness for developers. For developers, the accumulation of task and reasoning trajectories helps to serve as a source of high-quality data for future model training. In contrast with Hermes as the leading open source agentic harness, Chinese platforms like Workbuddy and Qwen Work are much more akin to fully-fledged software products, and come with pre-installed libraries of skills aimed at serving common enterprise use cases. The contrast between T encent Workbuddy and Alibaba’s Qwen Work helps to illustrate the contrast between the two companies, but also what we think it takes to win in AI. The former is a mostly open ecosystem play, featuring T encent’s Hy models, but also a broad selection of third-party models - and ecosystem partners. The Mini Program ecosystem represents a mature, API-connected system which supports a variety of Workbuddy, and most recently Meta’s Muse. In contrast with AI models as reasoning machines, agentic applications add features like persistent memory, and the ability to incubate libraries of skill and reference files (see Exhibit 2). In doing so they expand the frontier of AI competition from reasoning capabilities alone to include the harness layer as part of persistent work environments. Strategically, we expect the ability of AI developers to engrain themselves into persistent workflows, and complement human user preferences across long-horizon task solving to become increasingly important as arbiters of long-term value (see Exhibit 3 and Exhibit 4). For large enterprise AI users, the extent to which private context can be shared with - or must be protected from - AI agents has become a topic of polarised debate. The sudden popularity of Meta Muse has felt like a demonstration of the importance of slick UI/UX and context connectivity as drivers of success in consumer AI settings. We expect the ability of larger platform owners to combine AI reasoning capabilities with privileged user/enterprise context to represent a powerful enabler (see Exhibit 5). That’s not to say that AI model reasoning capabilities become less important. We expect frontier reasoning capabilities to remain critical in solving the most difficult tasks. The ability of AI models to support multimodal input, quicker and more capable reasoning, reliable tool use at lower inference cost remains foundational more broadly, including in enterprise and consumer use cases. Harness advantages compound only if the model is good, and material model reasoning gains compound to unlock much longer workflows. But equally the importance of proprietary context to agentic problem solving highlights the value of pre-existing pools of data gravity. Harnesses make agents better human worker analogs While AI models are largely stateless - meaning they do not retain knowledge between queries - harnesses add an orchestration scaffold that includes persistent memory, an execution environment, orchestration loops, and a repertoire of tools to be called upon to complete different tasks - like computer use. Over the course of repeated use, the harness can add to a catalogue of skills and reference files that make up a part of the human user’s private context. Said differently, the model brings a corpus of underlying knowledge plus reasoning horsepower, while the harness manages how that capability is deployed to complete tasks in ways that are more analogous to a useful, persistent coworker. Task completion aside, harnesses can also build an understanding of “how” to complete tasks - in ways that are not just technically correct, but also align with user taste and judgement. Typically, agentic harness apps also offer a user interface that’s easier on the eyes than pure command-line prompt, provide ways for users to organise parallel workflows, and so on. Coding agents were the obvious first iteration for agentic applications. Software engineers represented the first wave of highly motivated AI adopters, and software development workloads tend to be highly structured, with well-defined problems, test loops, failure modes, and verifiable outputs. The coding agent inserted model reasoning into a workflow that included interacting with files, executing commands, saving context into persistent memory, and iterating towards the final outcome. Quickly though, agent harness apps became general purpose in nature, where the deliverable to users became more generalised enterprise productivity (though with coding remaining as the interface through which agents manipulated software, data, and workflows). Many white-collar workflows are ultimately decomposable into software-mediated actions: reading files, querying databases, editing documents, sending messages, updating systems of record, etc. Trying to learn the right lessons from Meta Muse The sudden popularity of Instinct and Meta Muse within AI circles and investors has struck us as… instructive. Instinct’s core usage loop involves the user messaging an AI agent that’s been given the user’s personal context, so it can complete multi-step tasks like reservation booking, shopping, email management, and customer service - by leveraging a phone line, a dedicated email inbox, and computer functionality. Meta Muse offers a dedicated “Muse Secure VM” with its own browser, audit trails - allowing users to theoretically gate irreversible actions, and payment rails for online transactions. From a technical standpoint both are variants on the OpenClaw formula which saw viral adoption earlier this year. Our Hermes agent set-up amusingly offered to replicate most of the functionality Instinct and Muse have brought to market, subject to us CHINA INTERNET 4 on 28-Sep-2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Robin Zhu +852 2123 2659 robin.zhu@bernsteinsg.com 28 September 2026 signing up for an iOS developer account, and some Stripe payment rails. Functionality wise, we’d argue that none of (1) storage and retrieval of persistent user context; (2) access and management of email, calendars, computer files; or (3) computer use within a sandboxed environment reach far beyond what should be table stakes in an OpenClaw or Hermes style agentic harness. Rather than genuinely new tech, these apps have felt to us like demonstrations of how slick UI/UX and low-friction ecosystem connectivity can drive consumer tech engagement as much as innovations in the underlying functionality. The growing cohort of US businesses leaning into the Muse phenomenon has been interesting to watch, though we ultimately wonder if Instinct and Muse will run into the same things that have held back agentic commerce to date in the US - namely that many consumers are lazy creatures of habit. Amazon has notably already blocked Muse from accessing its platform, on the basis of safety and lack of merchant consent. We’d expect the commercial turf war to spread before rules of engagement around revenue/data sharing can be established. Two different approaches to agentic harnesses in China The agentic harness “market” in China, if it can be referred to as such in such an early stage, remains a space dominated by exploration. T encent’s Codebuddy and Workbuddy play host to a variety of third-party models (e.g. DeepSeek, Z.ai, Kimi…) in a way that’s mildly reminiscent of video gaming platforms like Steam. Alibaba’s Qoder also allows use of third-party models, though notably while T encent buys and resells tokens (and compute) from Z.ai et al., Alibaba chiefly hosts the open weights of the same models. Qwen Work on the other hand is more closely tied to the Qwen family of models, where the pitch has been built around capture of proprietary enterprise context. Both Workbuddy and Qwen Work emphasise ecosystem tie-in when marketing their respective agentic harnesses. For personal productivity use cases and businesses that rely on the Weixin ecosystem, we’d guess T encent’s social and communications layer serves as a decisive advantage. Online feedback to date on UI/UX has mostly argued in favour of Workbuddy. Qwen Work likely benefits from Alicloud’s (and to some extent Taobao’s) far greater enterprise sales scale. It’s probably worth pointing out meanwhile that - if all goes according to plan - Workbuddy will be T encent’s second most important agentic harness after Xiaowei on WeChat. The potential for use (and misuse) by over 1bn Chinese users points to a high bar for safety and alignment. But a fully-formed version would have API access to a Mini Programs ecosystem that’s both a ready-made pool of online transaction intent (to the tune of several trillion RMB of annual GMV) across permissioned pools of commercial inventory across diverse verticals. We’ve used a Hermes set-up for most of this year, and consider open source solutions like OpenClaw and Hermes - along with first-party solutions like DeepSeek Harness and ZCode - the domain of more specialised users who are more tolerant of set-up fiddle - in return for avoidi", "status": "extracted"}, "attachment:files/GFHK-共封装光学技术加速推进，但个股影响分化 CPO Accelerates, Yet Stock Implications Vary.pdf": {"id": "attachment:files/GFHK-共封装光学技术加速推进，但个股影响分化 CPO Accelerates, Yet Stock Implications Vary.pdf", "kind": "attachment", "title": "GFHK-共封装光学技术加速推进，但个股影响分化 CPO Accelerates, Yet Stock Implications Vary", "source_label": "GFHK", "excerpt": "Please be sure to read the disclosures at the end of this report carefully . 1 Equity Research Sector Report | Networking ｜Sep 29, 2026 CPO Accelerates, Yet Stock Implications Vary", "content": "Please be sure to read the disclosures at the end of this report carefully . 1 Equity Research Sector Report | Networking ｜Sep 29, 2026 CPO Accelerates, Yet Stock Implications Vary Overseas Technology Alicia Xia SFC CE No. BSS651 aliciaxia @gfgroup.com.hk Jeff Pu , CFA SFC CE No. BNO719 jeffpu@gfgroup.com.hk Henry Huang SFC CE No. BYA749 henryhuang@gfgroup.com.hk What’ s New? Following our earlier notes of CPO/NPO Accelerates on Aug 17, we believe that Nvidia ’s CPO scale -out switch progress is faster than expected. On the other hand, for NPO, due to slower than expected AWS T4 rollout, we revise our total OE shipments forecast to 6.5m/42m in 2027E/2028E respectively. We provide our view on recent development and key stocks below . Comments Nvidia’s Scale-out CPO: Following Nvidia’s Aug ‑14 announcement, Spectrum ‑X CPO switches have entered mass production. To support the ramp, TSMC has expanded CPO testing/inspection capacity, notably adding Insertion 2/3 equipment. Key components such as FAU are also progressing well, helped by improving multi ‑plug/unplug yield rates. At the system level, we believe major component suppliers are already on site, enabling cleanroom ‑level system integration from early Sep t. We now forecast Nvidia’s CPO switch shipments at 15k/16k/30k/1 00k for 4Q26/1Q27/2Q27/2027. Nvidia & AWS Scale-up NPO: Per our AI Platform Value Shift report on Aug 6 , NVL576‑based scale‑up CPO/NPO systems are expected to begin adoption in 2H27 E, with two switch boards per NVSwitch tray, each board carrying four ASICs, paired with four 3.2T OEs/ASIC. We reiterate our view that CPO (QM5 + 4 OEs) and NPO (QM5 + 4 OEs on sockets) are progressing in parallel, and our view is similar with Street expecta tions for full NPO adoption at NVL576 launch given NPO maturity. The next to watch is Feynman, which our supply chain research indicate is also being developed in both CPO and NPO variants; packaging ‑side visibility suggests CPO (QM6 with six 6.4T OEs) rem ains on track. For AWS, given limited near ‑term visibility on T4 tape ‑out, we now shift our Trainium 4 launch to 1Q28. We forecast AWS OE consumption at 0m/12m un its for 2H27E/2028E. Incorporating ASIC and AMD volumes, we now expect global scale ‑up OE dema nd to re ach 6.5m/42m in 2027E/2028E. Recommendations • Likes: 1) Lumentum (L ITE Buy) on CPO acceleration which support s valuation, with CPO/NPO revenue contribut ion of 1 2%/26% in CY27/CY28 ; 2) Browave (3163 TT) & Bizlink (3665 TT Buy) on CPO ’s shuffle bo x of ~8x content vs. NPO ’s, with production to accelerate in 1Q27E. 3) Semtech (SMTC Buy) on TIA/Driver for NPO, despite our downward revision , due to tight supply. • Dislikes: Largan (3008 TT) as our analysis indicates EPS contribution of NT$2 0/NT$9 7 in CY27/CY28, assuming shipments begin in 2H27 , suggesting implied 20x CY28 valuation which is not particularly cheap , with further risk on market share given the incumbent supplier ’s ongoing yield improvements and a growing number of new entrants. Risks 1) AI demand slowdown, 2) supply constrain t, 3) competition. wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Please be sure to read the disclosures at the end of this re 突破，美联储温和加息路径及股市进一步上行的概率依然较高。 历史分位数与周期定位：10年期收益率突破+1.5标准差，后续路径高度依赖美联储行动 当前美债10年期收益率已攀升至 5.2%，较1年移动平均线高出逾80个基点，Z值达 +1.64（处于历史93%分位）。自1980年代以来，类似突破仅出现过7次。收益率在突破+1.5标准差后，通常需要2个月以上才出现实质性回落，且在美联储完整加息周期内往往会进一步走高。 • 情景一：美联储温和加息（\u003c100bp） → 股市强劲反弹。在2013、2016、2021和2023年等四次事件中，10年期收益率在高位徘徊约2个月后回落，标普500在随后6个月平均上涨 10%，12个月平均上涨 18%。 • 情景二：美联储激进加息（>100bp） → 股市疲弱。1994、1999和2022年的三次事件中，标普500在随后一年回报为负或持平；10年期收益率触及峰值所需时间（平均102个交易日）是温和情景的2倍以上，回归均值耗时也显著更长（288天 vs 197天）。 当前市场已定价未来一年约88个基点的加息幅度，处于温和与激进路径的临界区域，但UBS倾向认为通胀预期受控（尤其若油价停止上涨）将降低激进加息周期概率。 估值框架：市盈率压缩已较充分，盈利增长与现金流回报率提供底部支撑 标普500 NTM市盈率已从峰值回落17%，当前约20倍。UBS估值模型显示，尽管债券收益率上行拖累估值，但远期销售增长CAGR与CFROI（资本运用回报率）的改善推动模型隐含市盈率升至 24倍以上，当前实际市盈率较隐含值存在约 21% 的折价，残留值处于2020年及2011-12年水平。换言之，市场已提前定价了增长放缓、利润率下滑及更高利率的悲观情景。在强劲EPS增长（科技外投资虽弱但利率敏感度下降）的基准假设下，估值具备良好支撑；若更高增长或更低利率被定价，股市存在显著上行空间。 行业与风格配置：高利率环境下的非对称布局 • 高利率持续期（约2个月）策略：超配“高增长+高CFROI且估值折价”组合，规避高杠杆板块。 • 年末协同反弹期权：若利率压力缓和且盈利超预期，年底出现股债同涨的概率上升，建议买入标普500虚值看涨期权（OTM Calls）。 • 子行业筛选框架（REVS综合得分 vs 利率Beta）： · 高REVS + 负利率Beta（基本面强劲且利率不敏感）：半导体、制药、炼油、多元化银行、消费金融、交易分销商、生物科技、建材、酒店休闲、地区银行。其中建材板块提供了与住宅建筑商类似的地产敞口，但基本面动量领先38个位次。 · 低REVS + 负利率Beta（基本面弱且利率敏感）：可再生能源、汽车、建筑材料、医疗设施、汽车零售、餐饮、媒体及应用软件。 投资结论 本次美债收益率飙升已引发估值显著回调，但历史规律与当前宏观组合（通胀可控、盈利上修）指向股市后续表现将高度依赖美联储加息幅度。若未来一年美联储加息低于100个基点，标普500有望在未来6-12个月录得双位数回报；若加息超预期，则市场将面临更长时间震荡。建议投资者在利率高位震荡期采取“杠铃策略”：一端配置利率不敏感的高景气赛道（半导体、生物科技、消费金融），另一端利用期权工具布局潜在政策转向带来的上行期权。整体维持对美股的结构性超配，但需警惕就业与通胀数据反复引发的政策预期修正风险。#文字观点", "publish_time": "2026-09-29 07:51", "tags": ["文字观点"]}, "post:2026-09-29T09-16:c98f71874028": {"id": "post:2026-09-29T09-16:c98f71874028", "kind": "post", "title": "2026-09-29 09:16", "source_label": "帖子正文", "excerpt": "【盘前0929】 1、昨晚美股也被A股带跌，市场对中东冲突取得外交突破的乐观情绪消退，立场分歧比较大，美媒晚间报道特朗普TACO的消息被辟谣，感觉这次态度异常强硬，可能和周末我们预期的一样，特朗普也有动力在中选前达成一个临时协议，缓和油价，只不过最优策略得声称自己不急。因此，最符合双方利益的纳什均衡", "content": "【盘前0929】 1、昨晚美股也被A股带跌，市场对中东冲突取得外交突破的乐观情绪消退，立场分歧比较大，美媒晚间报道特朗普TACO的消息被辟谣，感觉这次态度异常强硬，可能和周末我们预期的一样，特朗普也有动力在中选前达成一个临时协议，缓和油价，只不过最优策略得声称自己不急。因此，最符合双方利益的纳什均衡，就是中选前有限降温，选后再全面谈判。风险资产普遍承压，板块里面科技股普跌，费半跌幅还好，日韩早上低开也没有恐慌，NV因为回购逆势上涨。市场进一步增加对美联储加息的押注，这周还要公布一些重要经济数据，可能还会强化，所以市场提前交易了。 2、A股昨天的跌法确实有点大跌眼镜的无力感，确实很超预期，毫无抵抗，连成交量也没有放大，开盘就知道是垃圾时间了。沪指跌破了前期比较重要的支撑位3850点，往下可能先看3800这个关口，调整的原因能够回溯的，还是两个地缘变量，除了上面说到美伊冲突谈判不及预期，油价再度反弹，美债收益率继续上行。换个角度看，都是上周三开始掉头，只是因为油价也没有特别猛，美股反应也很有韧性，给了好像也没啥大影响的错觉，还是大意了。 3、另一方面还是中美关系，领导访美取得一系列积极成果，但是一些资金提前博弈访美超预期，这部分钱选择落地兑现，不过对于后续来说，11月和12月还有更多对话空间。昨天科技股冲击比较大，尤其是创业板，更多是美国议员提案又打击了光通信产业，增加了恐慌情绪。昨天应该是节前压力最大的一天，正常这两天应该要缓解，宏观问题短期没有答案，A股还有筹码结构问题，机构资金调仓后，节后应该会有缓解。 4、昨天大跌后主要指数纷纷破位，不能用节前避险来理解，市场对行情应该是有一致预期，主观和量化都共振了，上周看到不反包就都跑了，周末看不到节前反弹预期，跌了反而可能捞一些，索性就跌完了，留个抄底的下影线。按照C浪调整理解的话，就要看看强度和7月的A浪对比情况，创业板今天外跌底部会有大级别钝化，操作上还是优先看看宽基，做一些低吸。创业板50ETF，科创100ETF，科创综指ETF和科创50增强ETF。 （仅供内部参考，不做投资建议，基金投资需谨慎）#文字观点", "publish_time": "2026-09-29 09:16", "tags": ["文字观点"]}, "attachment:files/A股与港股复盘 20260929.pdf": {"id": "attachment:files/A股与港股复盘 20260929.pdf", "kind": "attachment", "title": "A股与港股复盘 20260929", "source_label": "其他", "excerpt": "A股与港股复盘 2026年9月29日 研究笔记 · 不构成投资建议 第 1 / 10 页 股票市场复盘 地产贴息落地，两地地产股大涨 2026年9月29日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 财政部、央行、金融监管总局联合下发全国性购房贷款贴息政策，10月1日起执行，两地地产股应声大涨", "content": "A股与港股复盘 2026年9月29日 研究笔记 · 不构成投资建议 第 1 / 10 页 股票市场复盘 地产贴息落地，两地地产股大涨 2026年9月29日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 财政部、央行、金融监管总局联合下发全国性购房贷款贴息政策，10月1日起执行，两地地产股应声大涨，延续上周五以来的强势。同日，受美债收益率上涨压力，港股科网权重股走弱，恒指与恒生科技逆势收跌，指数层面形成“地产受益、权重股风格切换压制指数”的背离。我们在9月25日录制的瑞士宝盛月度市场对话中特别讨论了这种刺激政策的即将到来及其可能性，并指出了地产在我们的量化选股的模型中出人意料地靠前，甚至数一数二。那时，离今天的政策正式出台还有5天。 三部门联合发布的购房贷款贴息政策，正好命中地产股此前被压制的估值逻辑：万科A罕见涨停，万科企业H股暴涨11.29%。但腾讯、阿里巴巴、小米、美团等港股科网权重股同日集体走弱，恒指、恒生科技分别逆势收跌0.48%、1.08%。尽管如此，我们的债券交易模型继续显示五年美债短期严重超卖。A股则靠地产股和昨日芯片、光模块股的部分修复，两市涨跌家数由昨日重挫完全反转为普涨。 本日报要 主线： 财政部、中国人民银行、金融监管总局29日联合发布《关于实施居民购房贷款贴息政策的通知》，10月1日起实施。新发放首套住房商业性个人住房贷款，单户贷款规模上限100万元，财政按年化1个百分点贴息、最长5年，覆盖建筑面积不超过120平方米、购房价格不超过150万元的中小套型刚需住房。这是多年地产下行周期中第一次出现全国性的需求端财政贴息。政策公布后，万科A收出涨停（+9.97%），万科企业H股暴涨11.29%，保利发展、龙湖集团、中国海外发展A、H两地同步大涨。但恒指、恒生科技当天仍分别收跌0.48%、1.08%，因为指数权重最大的腾讯（−1.77%）、阿里巴巴（−1.39%）、小米集团（−2.55%）、美团（−2.02%）等科网股同日集体走弱，抵消了地产股对指数的正贡献。 A股： 上证收3,830点，涨0.18%；沪深300涨0.10%；创业板指涨0.09%；科创50涨0.86%。两市（沪+深）成交约1.41万亿元，较前一交易日（9月28日）的1.70万亿元萎缩约17.2%，属于缩量反弹。涨跌家数：两市3,315家上涨、1,821家下跌、152家平盘（两市及北交所3,525家上涨、1,944家下跌），涨停家数57家、跌停家数10家，与前一交易日33:56的结构完全反转。 港股： 恒生指数收24,523.57点，跌0.48%；国企指数跌0.46%；恒生科技指数跌1.08%。恒指成交额1,846.3亿港元。 A股与港股复盘 2026年9月29日 研究笔记 · 不构成投资建议 第 2 / 10 页 货币与汇率： 央行今日以固定利率、数量招标方式开展7天期逆回购905亿元（利率1.40%）、隔夜逆回购6,985亿元；当日有6,960亿元逆回购到期（350亿元7天期、6,610亿元隔夜），公开市场净投放930亿元，延续9月28日至10月8日隔夜逆回购窗口下的跨节流动性安排。人民币中间价报6.7411，较前一交易日6.7399调贬12个基点；在岸即期约6.6953，离岸CNH约6.7048，在岸仍强于中间价；美元指数报101.33，涨0.14%。 互联互通： 北向成交2,129.2亿元（沪股通1,032.6亿元、深股通1,096.6亿元），较前一交易日的2,605.0亿元回落约18.3%，净额未公布。南向成交640.2亿元，较前一交易日的753.9亿元回落约15.1%，净买入0.15亿元，由前一交易日的净卖出65.5亿元转为基本净买平。 大波动： 内地：万科A（000002.SZ）涨停，涨9.97%；长飞光纤光缆（601869.SH）涨3.48%。港股：万科企业（02202.HK）涨11.29%；龙湖集团（00960.HK）涨5.87%；小米集团-W（01810.HK）跌2.55%；腾讯控股（00700.HK）跌1.77%。 技术： 上证指数收盘价贴着20日布林下轨（约3,830点），已连续第二个交易日在下轨附近争夺；恒生指数仍处于50/100/200日均线下方（详见第1、2节图）。 驱动： 购房贷款贴息政策是全天最大变量（见上）；昨日“英伟达采购传闻+美方制裁”冲击的芯片、光模块股今日多数部分修复，但中际旭创、新易盛仍未转正（见第1节）；全球风险偏好较昨日回暖，油价、VIX同步回落，但特朗普公开否认Axios关于其向伊朗提供制裁豁免的报道，地缘风险溢价并未真正解除（见第4节）。沪深15:00、港股16:08均已收盘。 外盘 / 商品 / 国债： 美股期货三大指数齐涨，VIX回落；WTI、布伦特原油同步回落，较昨日冲高明显回吐；COMEX黄金小幅反弹、白银小跌、铜基本持平；美债收益率全线小幅回落，中国10年同步小降（数字见第4节）。 A股与港股复盘 2026年9月29日 研究笔记 · 不构成投资建议 第 3 / 10 页 1. A股 指数 收盘 开 高 低 当日 成交额 上证指数 3,830 3,816 3,844 3,811 +0.2% 6,617.0亿 深证成指 12,902 12,840 12,955 12,832 +0.3% 7,474.9亿 沪深300 4,345 4,336 4,359 4,325 +0.1% 3,349.5亿 创业板指 3,143 3,137 3,159 3,128 +0.1% 3,565.1亿 科创50 1,569 1,559 1,577 1,549 +0.9% 645.3亿 中证500 7,440 7,388 7,474 7,386 +0.5% 2,437.7亿 中证1000 7,325 7,266 7,357 7,256 +0.4% 2,689.5亿 上证50 2,810 2,803 2,820 2,795 +0.1% 958.6亿 北证50 1,032 1,024 1,042 1,024 +0.6% 125.3亿 这一节给主线加的是A股这一侧的证据链：地产贴息政策点燃地产股，万科A收出近两年少见的涨停，叠加昨日芯片冲击的部分修复（见下），两市从昨日的普跌转为普涨，涨跌家数完全反转（3,315家上涨、1,821家下跌，对比昨日874家上涨、4,298家下跌）。但两市成交较昨日萎缩约17.2%，说明这更像是存量资金从科网、成长股切向地产和超跌修复股的风格切换，而不是增量资金入场推动的普涨。 上证指数今天低开在3,816点，盘中震荡走高，最高摸到3,844点，收在3,830点，涨0.18%，收盘价几乎贴着20日布林下轨（约3,830点）——这已经是连续第二个交易日收在布林下轨附近，尚未脱离超卖区间。50日均线约3,913点，指数仍明显在其下方；200日均线约4,000点  token 的部分，单位带宽成本和每 token 成本在 4 层堆叠时最低。每个 HBM4E 堆叠的带宽与堆叠高度无关，而根据他们自己的模型，在系统层面，8 层和 12 层分别比 4 层贵高于 10% 和约 26%，而吞吐量最多只提升 10%。这些是针对特定机架和模型的计算，因此我会谨慎对待将其推广。 NVIDIA 迄今公布的官方数字很少。NVIDIA 直接声明的只有 Rubin 每个 GPU 使用高达 288GB 的 12 层 HBM4。对于下一代 Rubin Ultra，TrendForce 在 8 月初报道称，NVIDIA 已将其评估范围扩大到包括 8 层 HBM4E 以及 12 层和 8 层 HBM4，并且最终规格尚未确定。台湾《工商时报》援引摩根士丹利的一项供应链调查，预计规格将在第三季度末之前确定，但截至 9 月 28 日，我没有发现已确认的公告或报道。每 GPU 192GB 的数字也在流传，但这是 SemiAnalysis 自己的报道，NVIDIA 从未证实过。 在圆桌讨论中，厚度问题首先被提及。解释是，在当今的厚度规格内，16 层和 20 层已接近极限；要达到 20 层或 24 层可能需要新技术，另一条路径是大面积封装，通过每个封装内更多的 HBM 堆叠来填充容量。这位发言人表示，单纯提高堆叠数量只需设定内部工艺基线并加以验证即可。然而，采用大面积封装时，小封装中从未出现的问题会在大封装中浮现，而台积电的方法与其他公司不同，因此每种方案都必须单独匹配。我们还了解到，MR-MUF 堆叠中的 DRAM 裸片厚度最初为 50 微米，当时连公司内部人士都对此表示怀疑，如今已接近 30 微米。如果第一部分中芯片厚度缩减 0.9 倍是从 12 层到 16 层这一代的一步，那么这是历经几代 HBM 积累的进步。 以下是我的看法。SemiAnalysis 的 4-high 逻辑是一种针对推理的计算，具体来说是针对解码中每 token 成本的计算，而且原文本身一开始就承认预训练对容量的敏感度要高得多。发言人也说过带宽和容量之间存在权衡，因此某个时候会需要大容量。所以我认为，单就解码的单位成本而言，更低的堆叠层数胜出，但那些渴求容量的工作负载可能会拆分到使用更高堆叠层数的独立产品线中。对照第 1 部分中铺出的路径来衡量，用现有方法转向 16-high 已经略有放缓，这与 20-high 及以上被提前正好相反。 3. 对照上一张地图进行检查 9 月 17 日，当我在《混合键合价值链中的 22 家上市公司》段落地图中用之前的对混合键合设备公司进行排序时，我判断上一段落采用的权重，即键合和延迟。仅仅过去了十一天，所以没有任何带日期的检查点已到期，但当我再次汇总这一判断的时间记录时，它们都归入了一张表。 从 2024 年的记录开始：据报道，SK 海力士一位负责封装的高管在 2024 年 11 月的一次会议上表示，混合键合将从 2026 年开始使用，而当时 HBM4E 的大规模生产计划于 2026 年开启。此外 10 月的一份路线图，计划将混合键合应用于 HBM4，并于 2026 年实现大规模生产。键合设备制造商 BESI 在 2024 年投资者日演示文稿中写道，存储领域的采用，该公司将 16 层堆叠的 HBM4E 列为首个引入该技术的世代，并写道一家领先客户正准备于 2027 年进行大批量生产。 目前情况就是这样。Tom’s Hardware 报道了 8 月 Hot Chips 大会上的演讲，称混合键合很难进入 HBM4E，但根据同一篇文章，Hot Chips 的演讲者并未指明目标世代，该公司也尚未决定哪个产品会率先采用该技术。两天后，一篇大学教授在 SK 海力士新闻室发表的专栏判断，全面采用最有可能随 HBM4E 或 HBM5 到来。市场研究机构 Counterpoint 预计，SK 海力士将在 2029-2030 年 HBM5 问世时实现全面混合键合量产。三星在 1 月财报电话会议上表示，计划在 HBM4 阶段实现部分商业化；7 月的一份报告称，该公司内部认为 2030 年有望实现大规模生产。 记录显示，两家存储制造商在 2024 年放进表格的 2026 年在 BESI 的估算中已经变成了一家延后至 2027 年的产量。BESI 人员的演示文稿保留了那句话，只是在其首次插入幻灯片的标题上加上了预计一词。2029 至 2030 年更广泛采用的日期是来自 Counterpoint 等市场研究机构的预测。由于这两个数字来自不同的预测机构和不同的产品，很难把它们对应到单一的生产时间表上，但它们指向了同一个方向：首次使用与广泛采用之间的间隔正在拉长。我花了相当一段时间翻查 2024 年的会议报道填进这张表，结果发现两家公司同时提及 2024 和 2026 年的窗口比我预想的要短。 在我 9 月 17 日的文章中，我把 Hot Chips 的演讲解读为现有方法将延续到 HBM4E。SK 海力士新闻室的专栏则认为 HBM4E/HBM5 可能是 2027 年，而 BESI 谈到的是一家领先客户将在 2027 年生产 16 层堆叠的 HBM4E。BESI 于 10 月 22 日发布的第三季度业绩应该会初步揭示这两者如何对应。我发布时保留的权重不变。当我再次把这两者加起来时，随着官方采用的间隔正在拉长，这一次判断变得更加确凿，所以我会说，关于延迟期很长这一判断，在某种程度上是正确的。 4. DRAM 重新回到逻辑之上 圆桌会议的发言者回忆说，第一代 HBM 开发时，客户最初带来的结构是 3D 的，但发热太严重，所以设计退回到了 2.5D。我在第一部分提到过能耗。在那篇 SemiAnalysis 2023 主题演讲中展示的一张幻灯片上，移动比特数据的成本，对于内存模块也就是 DIMM 大约是 12 皮焦，对于置于中介层，也就是将芯片与 HBM 并排放置的中间金属板上的 HBM 大约是 0.5 皮焦。在小组讨论中，我们听到一旦削减 DRAM 与逻辑之间按照约定规范交换信号所用的接口电路 PHY，所消耗的能量会提高效率。自客户方面，如第一部分所详细讲解的那样，客户说自今年春天以来，客户几乎像是约好了一样，开始要求这种结构。 在台积电 4 月的研讨会上，SK 海力士将 3D 堆叠 DRAM on Logic，也就是将 DRAM 垂直堆叠在逻辑芯片上列入了其路线图，并写道该技术特别适合端侧 AI。我查阅了截至 9 月 28 日的该公司公开材料来给出这种结构的年份。7 月美国向 SEC 提交的最终招股说明书以及此后的 21 份文件中，没有一句完整的话，关于投资于定制基础裸片和面向下一代 HBM 的先进堆叠技术。 关于 DRAM on Logic 为何困难，圆桌会议的解释比公开材料更为具体。从 HBM4 开始，SK 海力士采用台积电的逻辑工艺制造基础裸片，并用其自有的堆叠技术 MR-MUF 将核心 DRAM 堆叠在上面。发言人称，这更接近一次小改动，即把公司过去自行设计的基础裸片改为由代工厂设计。 DRAM 堆叠在逻辑芯片上是另一回事。据演讲者称，DRAM 迄今尚未用到逻辑布线所用的低介电常数介质，这种介质比通常逻辑芯片中所用的更低的绝缘膜，工艺设计完全取决于逻辑裸片是朝上还是朝下，两者截然不同，铝焊盘和采用低介电常数材料背后的概念也不一样，因此无法预知会出现什么问题。我们还听说，这只有在与合作伙伴公开信息细化到工艺底层时才可行。#文字观点", "publish_time": "2026-09-29 16:52", "tags": ["文字观点"]}, "post:2026-09-29T12-06:3c9712b1c357": {"id": "post:2026-09-29T12-06:3c9712b1c357", "kind": "post", "title": "2026-09-29 12:06", "source_label": "帖子正文", "excerpt": "【广发机械】半导体设备：长鑫拟投资新建测试工厂，后道设备逻辑再次加强20260929 #长鑫科技拟投资近350亿元新建技术研发项目+存储器晶圆后道测试基地二期项目。长鑫在公告中提到“公司新增测试产能不足”，本次后道测试基地二期项目计划总投资108亿元，计划建设一座测试工厂为DRAM芯片提供测试以及模", "content": "【广发机械】半导体设备：长鑫拟投资新建测试工厂，后道设备逻辑再次加强20260929 #长鑫科技拟投资近350亿元新建技术研发项目+存储器晶圆后道测试基地二期项目。长鑫在公告中提到“公司新增测试产能不足”，本次后道测试基地二期项目计划总投资108亿元，计划建设一座测试工厂为DRAM芯片提供测试以及模组组装，#设备总投资额81.8亿元（占75.74%）。随着芯片复杂度提高，后道设备的增速更快。 #存储+逻辑扩产的确定性极强，#未来一年催化十足。存储方面，两存超预期的利润释放必然转变为持续高增的Capex，#正如我们从上半年开始就在路演反复强调的，伴随着Q4两存订单的陆续落地，设备板块后续会持续订单预期。逻辑方面，昇腾系列960DT、960PR的预计推出时间均有提前，27年有望迎来国产算力的放量时刻。 核心组合。重视后道测试设备的： #华峰测控（边际变化大、算力芯片测试机进展顺利，27年订单确定性强） #强一股份（下半年国产算力与存储开始放量，业绩明显提速）#长川科技（测试设备平台化公司）#精智达（受益于存储扩产，高速FT进展顺利） 以及金海通、微导纳米、迈为股份、精测电子等，部分标的经过前期调整  -18% 0% -8% 20% 10% 归母净利润（百万元） 626 483 523 718 829 增长率yoy% 39% -23% 8% 37% 15% 每股收益（元） 0.68 0.53 0.57 0.78 0.90 每股现金流量 1.31 0.92 0.51 0.95 1.07 净资产收益率 18% 13% 13% 16% 17% P/E 18.3 23.7 21.9 15.9 13.8 P/B 3.3 3.0 2.9 2.6 2.3 备注：股价截止自2026年09月24日收盘价，每股指标按照最新股本数全面摊薄2026年09月24 日 报告摘要 公司概况：深耕汽车外饰领域，积极拓展机器人新业务。公司主营汽车保险杠等外 饰系统及轻量化零部件，含参股公司年保险杠产能超600万套，在国内豪华车外饰细 分市场排名领先。主要产品采用优良配方注塑件经高档漆表面涂装而成，核心能力覆 盖模具开发、大型/精密注塑与表面喷涂。客户包括宝马、北京奔驰、上汽奥迪、上汽 通用、上汽大众、沃尔沃等传统豪华及合资品牌，以及特斯拉、理想、比亚迪、赛力 斯、蔚来、小鹏、极氪等新能源客户。2026年上半年，公司依托大型注塑、模具开发、 表面喷涂、轻量化材料应用等成熟制造能力，推进人形机器人外覆盖件业务，已获小 批量采购订单，订单金额占营业收入比例不足0.1%。同期公司实现营业收入30.50 亿元，同比下降10.27%；归母净利润3.15亿元，同比增长7.39%；扣非归母净利润 3.06亿元，同比增长26.67%；综合毛利率约20.52%。收入承压背景下扣非利润明显 改善，盈利质量好于收入表象。 外饰主业：公司基石业务，喷涂与模具构筑能力壁垒。保险杠等大型外饰件工艺链 包括注塑成型、多层涂装、焊接装配与检验。喷涂决定外观一致性、耐候性与返工成 本，设备投资与环保门槛较高，是外饰赛道重要壁垒。公司年报披露，内外饰件喷涂 工艺核心环节技术成熟，在喷涂细分领域具备技术领先优势，并持续提升精密模具、 大型注塑、智能喷涂水平。2026H1“专用装备及模具”实现收入约1.40亿元，毛利 率约29.77%，显著高于塑化汽车装饰件约21.07%的毛利率，体现模具及装备环节附 加值。我们认为，600万套级外饰配套能力，本质是模具—注塑—喷涂—总装全流程 在高生产节奏、高外观一致性约束下的制造能力刻度，构成机器人外覆盖件迁移的产 业底座。 墨西哥业务：特斯拉等北美客户长期配套，属地产能前置布局。公司2015年起布局 墨西哥名华，开启由产品出口向产能输出的全球化。2019年墨西哥工厂具备大批量生 产条件，并获得北美知名电动车企外饰件项目定点；公司年报长期将特斯拉列为定点 厂商。2021年公司处置经营不利的美国名华，整合资源集中运营墨西哥工厂。2025 年年报披露墨西哥名华拥有约32台注塑机（约200T至4000T），覆盖2K注塑、发 泡、中小型零件高光等工艺，并具备完备模具车间及模具工程变更内部实施能力。2025 年7月，墨西哥名华再次获得北美知名电动车企外饰件项目定点，按客户规划预计 2026年1月开始量产，生命周期5年，预计总销售量约36.6万套、预计总销售额约 12.36亿元人民币（定点意向不代表最终采购数量，具体以订单结算为准）。2026H1 公司国外收入约9.40亿元，毛利率约25.80%，高于国内约18.17%。我们认为，墨 西哥工厂体现公司对北美主机厂本地化交付、工程变更、成本年降与产能爬坡节奏的 综合配套能力；属地重资产布局将产能与工艺能力前置，既构成海外利润池，也为后 续机器人相关塑件的产线复用与切换提供物理基础。 人形机器人外覆盖件：模具与表面处理能力跨域迁移，打开第二成长曲线。公司2026仅供内部参考，请勿外传！ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 -2- 公司深度报告 请务必阅读正文之后的重要声明部分年半年度报告披露，报告期内依托汽车外饰件领域沉淀的大型注塑、模具开发、表面 喷涂、轻量化材料应用等成熟制造能力，实现技术跨域迁移，推进人形机器人外覆盖 件业务；与多家人形机器人整机厂商开展技术对接、样品开发与送样验证，复用现有 注塑喷涂产线开展小批量试制。年报亦提出提升精密模具、大型注塑、智能喷涂水平， 加快机器人外覆盖件由小批量向规模化突破。我们从能力角度拆分两条主线：一是以 沈阳道达等为主体的模具开发与工程变更能力，有助于缩短产品迭代与量产导入周 期；二是表面处理能力，“会喷”保障导入期外观一致性与质量门槛，高光注塑、模 内相关工艺及彩色注塑等方向则为中长期少 而 言，属地改模、试模与工程变更速度直接影响车型爬坡；对机器人外覆盖件 而言，北美若需本地化交付，海外模具车间是产线复用的配套条件之一。 图表10：公司模具相关主体与能力分布（公司公开披露） 资料来源：公司2022-2025年年度报告、为全资子（孙）公司提供担保的公告，中泰证券研究所 对机器人外覆盖件而言，产品迭代快、改款频繁，软模验证到硬模量产的切 换节奏决定供应商份额。公司以沈阳道达等专司开模与精密饰件的子公司为 支点，叠加总成工厂模具团队与墨西哥属地改模能力，形成“国内开模制造 +海外组装维护/变更”的协同交付特征。具备内部开模与改模能力的制造 企业，更有望在0-1导入与SOP前阶段建立粘性。需要指出，报表中模具 相关收入体量仍小于装饰件，其投资价值更多体现在能力定价权与客户绑定 深度，而非短期利润贡献；若机器人放量带动开模与改模量上升，专用装备 及模具板块具备弹性，但需以订单落地验证。 4.3表面处理与少喷/免喷路径 公司产品明确以注塑件高档漆涂装为特征，喷涂是外饰质量与成本的核心 工序之一。年报指出，公司内外饰件喷涂工艺核心环节技术成熟，在喷涂细 分领域具备技术领先优势，并围绕智能喷涂、工艺升级持续投入。2026H1仅供内部参考，请勿外传！ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 公司深度报告 -12- 请务必阅读正文之后的重要声明部分机器人小批量试制“复用现有注塑喷涂产线”，表明当前导入路径仍以成熟 汽车级喷涂体系为主，“会喷”构成交付与质量门槛。 与此同时，公司在墨西哥等地已具备中小型零件高光等特殊注塑工艺储备； 产业层面，高光注塑、模内装饰、彩色注塑等技术路线被用于减少部分喷 涂工序、缩短单件加工时间并降低单件成本。我们将公司表面处理能力概 括为双路径：①导入期：会喷，保障外观一致性、耐候性与客户认可；② 放量期：少喷/免喷探索，在通缩约束下提升经济性。 双路径并存，使公司相对于“仅注塑、无表面处理”或“仅喷涂代工、缺模 具与成型一体化”的供应商，具备更完整的方案能力。 4.4墨西哥产线复用与切换弹性 公司中报已明确机器人小批量阶段复用现有注塑喷涂产线，这意味着第二曲 线并非从零建设全新制造体系，而是优先复用汽车外饰已沉淀的资产与工艺。 墨西哥工厂作为北美属地制造平台，拥有注塑机群、喷涂能力与模具车间， 在车端产能利用率未完全饱和的阶段，具备向机器人外观件及部分结构件切 换的物理空间。 我们强调边界：①切换进度取决于客户产品定型、材料认证、硬模开制与 合格率，而非仅取决于厂房或设备空置；②机器人业务当前收入占比极低， 对短期业绩影响有限，主业仍按外饰龙头基本面定价。 5、盈利预测与估值 5.1核心假设与盈利预测 ①汽车装饰件（含专用装备及模具，年报行业口径）：2026H1收入同比 -12.2%、毛利率同比+1.7pct；预计2026年收入约59亿元（-9.8%）、下 半年降幅收窄，毛利率20.5%；2027-2028年收入企稳回升9.5%/10%，毛 利率维持21%左右。 ②医疗：2026H1收入同比+29.1%、毛利率-2.3%（同比+15.2pct），减 亏趋势明确。假设2026-2028年收入增长22%、15%、12%，毛利率-2%、 +2%、+5%，逐步转正。 ③其他：（铸件、房产租售、材料等）体量稳定，假设收入年增2%、毛 利率25%左右。 ④期间费用率、投资收益与税率：销售费用率维持1.0%左右；管理费用 率由8.0%随收入扩张摊薄至2028年约6.3%；研发费用率3.3%左右并小 幅回落。北汽模塑等参股公司投资收益假设为2.1、2.2、2.2亿元；实际所 得税率10%、11.5%、13%。 ⑤基于上述假设，我们对公司未来盈利进行测算，预计2026–2028年营 业收入分别为 亿元，归母净利润分别为 亿元 图表11：分业务盈利预测假设（百万元） 项目 2025A 2026E 2027E 2028E 汽车装饰件（含模具） 6,581 5,937 7,207 7,928 医疗 261 319 367 411 其他（铸件/房产/材料） 266 271 276 282 营业总收入 7,108 6,527 7,850 8,620 YoY -0.4% -8.2% +20.3% +9.8% 归母净利润 483 523 718 829 YoY -22.9% +8.4% +37.2% +15.4% 资料来源：公司公告，中泰证券研究所预测注：分部为年报行业口径，专用装备及模具并入汽车装饰件。 5.2投资建议与估值仅供内部参考，请勿外传！ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-09-29T12-05:8947cc0e41d5": {"id": "post:2026-09-29T12-05:8947cc0e41d5", "kind": "post", "title": "2026-09-29 12:05", "source_label": "帖子正文", "excerpt": "🔥【开源通信】杰普特：“金刚石钻针+超快激光钻孔”勾勒第二成长曲线 🐯近日，杰普特与尖点科技正式签署战略合作MOU（合作备忘录），双方合作有望进一步深化，并将以金刚石钻针为合作切入点，在技术、产品与市场等层面加强协同，共同推动先进加工技术在PCB制造领域的应用。尖点科技长期深耕PCB钻针及精密加工领", "content": "🔥【开源通信】杰普特：“金刚石钻针+超快激光钻孔”勾勒第二成长曲线 🐯近日，杰普特与尖点科技正式签署战略合作MOU（合作备忘录），双方合作有望进一步深化，并将以金刚石钻针为合作切入点，在技术、产品与市场等层面加强协同，共同推动先进加工技术在PCB制造领域的应用。尖点科技长期深耕PCB钻针及精密加工领域，杰普特则持续深耕激光技术与精密制造，此次合作或进一步推动产业生态协同。我们认为，杰普特在PCB加工领域有望实现“金刚石钻针+超快激光钻孔”双轮驱动的局面，PCB第二成长曲线有望开启。 🐯PCD钻针：PCD钻针替代逻辑清晰，杰普特生态协同优势凸显。技术方面，PCD钻针较传统钨钢钻针具备显著优势，其核心逻辑在于：为适应AI算力的持续升级，AI服务器主板材料正从M6、M7等级推进至M8、M9，板材更厚更硬，导致钻针损耗剧增。具体来看，在M7板材上一支钨钢针可打500—1000个孔，但到M9或只能打100—200个，服务器越强大，钻针消耗量越多。在此背景下，根据中国粉体网，传统钨钢钻针在寿命与精度方面逐步触及性能极限，而金刚石莫氏硬度为10，是目前已知天然物质中硬度最大的材料，采用金刚石工艺的钻尖其硬度和耐磨性远超过硬质合金钻头，应用在难加工材料时可以大幅延长刀具使用寿命，这也进一步凸显了PCD钻针的替代优势。此外在生态协同方面，杰普特飞秒激光器深度赋能钻针加工业务，“飞秒激光器—钻针加工设备—金刚石钻针加工”成为产业生态协同的重要一环，相关钻针产品净利润率/生产效率有望得到长足改善。 🐯激光器：超快激光钻孔机应运而生，奥杰微电子卡位M9级PCB精密制造。由于微孔加工、多层板材制程长期面临孔型不良、底层损伤、加工效率不足等挑战，超快激光钻孔机应运而生，其在微孔加工方面，包括盲孔、通孔及高密度微孔阵列，有助于获得更平整的孔壁形貌与更一致的孔径分布，而在介质开窗与去介质工序中，凭借对材料选择性与能量可控性的优势，亦更易在不损伤邻近铜层或下层结构的前提下实现局部去除。在此背景下，杰普特控股子公司奥杰微电子推出的奥杰超快激光钻孔机，专为M9级高速覆铜板及1.6T光模块PCB的精密制造需求打造，融合奥杰自研的激光控制平台、激光能量闭环监控模块、精密视觉对位等核心技术，并采用超快激光器技术，实现盲孔、通孔的高精度加工，以解决传统加工痛点，保障信号完整性与量产可靠性。 ☎️开源证券通信蒋颖/杨昕东/杜致远/马堉博团队#文字观点", "publish_time": "2026-09-29 12:05", "tags": ["文字观点"]}, "post:2026-09-29T15-40:f6e47f04e48d": {"id": "post:2026-09-29T15-40:f6e47f04e48d", "kind": "post", "title": "2026-09-29 15:40", "source_label": "帖子正文", "excerpt": "【今日投资舆情热点】1）固态电池：七部门联合制定《新型电池产业发展“十五五”规划》，到2030年全固态电池初步实现规模化应用。2）AI应用：摩根大通表示，Muse有望成为ChatGPT后最广泛使用的AI应用", "content": "【今日投资舆情热点】1）固态电池：七部门联合制定《新型电池产业发展“十五五”规划》，到2030年全固态电池初步实现规模化应用。 2）AI应用：摩根大通表示，Muse有望成为ChatGPT后最广泛使用的AI应用；Meta计划在未来几个月内将Muse引入其智能眼镜。 3）PCB：AI服务器需求爆发引发供给结构性重构，PCB产业链迎密集涨价潮，树脂、电子布、铜箔、CCL、PCB各环节均完成顺价传导。 4）房地产：国常会会议指出，推出一批务实管用的增量政策，研究出台稳定房地产市场、促进就业增收等政策措施。", "publish_time": "2026-09-29 15:40", "tags": []}, "post:2026-09-29T15-54:82d0938afd89": {"id": "post:2026-09-29T15-54:82d0938afd89", "kind": "post", "title": "2026-09-29 15:54", "source_label": "帖子正文", "excerpt": "【财通AI新材料&大化工】M9/10树脂更新：建议重点关注碳氢BCB树脂，重大预期差，确定性呈现量涨价升趋势，建议关注#呈和科技/东材科技1、M9方案最新进展，添加10%左右的BCB碳氢树脂可以显著改性电性能，玻纤布可以从Q布调整成二代布，成本下降约20%（具体测算可以私信），根据头部CCL厂家反馈", "content": "【财通AI新材料&大化工】M9/10树脂更新：建议重点关注碳氢BCB树脂，重大预期差，确定性呈现量涨价升趋势，建议关注#呈和科技/东材科技1、M9方案最新进展，添加10%左右的BCB碳氢树脂可以显著改性电性能，玻纤布可以从Q布调整成二代布，成本下降约20%（具体测算可以私信），根据头部CCL厂家反馈，M9方案未来会是ODV碳氢+少量BCB碳氢+二代布+HVLP4铜。 2、M10四大主流测试方案的共同点在于BCB树脂。我们了解到，目前M10四大主流方案为：1、PTFE无布core层+PP层 2、PTFE无布core+BCBcore层+PP层（混压方案） 3、PTFE有布core层+PP层 4、纯碳氢树脂（BCB)+二代布core层+PP层方案。其实，从四大主流测试方案来看，PTFE的确定性只是占到3/4、玻纤布占到1/2，而4种的共性在于都需要绝对增量的BCB树脂。从头部CCL2-3个专家访谈了解到，方案3和4是最有可能的M10方案。 3、我们测算（具体私信），BCB碳氢树脂在2027-2029年整体的供需将呈现紧俏的状态 综上，我们认为市场对于BCB树脂的认知存在很大的预期差，确定性和爆发性是当下AI材料中最强的方向，建议重点关注：呈和科技、东材科技等。#文字观点", "publish_time": "2026-09-29 15:54", "tags": ["呈和科技", "东材科技", "文字观点"]}, "post:2026-09-29T08-53:b7cf9dfd8557": {"id": "post:2026-09-29T08-53:b7cf9dfd8557", "kind": "post", "title": "2026-09-29 08:53", "source_label": "帖子正文", "excerpt": "独家｜出于安全顾虑，OpenAI 取消发布新款 AI 模型 - 华尔街日报 OpenAI 表示，由于研究人员在内部测试中提出的安全担忧，公司将取消其下一代 AI 模型的发布。这是迄今为止最明显的迹象之一，表明智能体（agent）的失控行为可能会阻碍该行业的快速发展。", "content": "独家｜出于安全顾虑，OpenAI 取消发布新款 AI 模型 - 华尔街日报 OpenAI 表示，由于研究人员在内部测试中提出的安全担忧，公司将取消其下一代 AI 模型的发布。这是迄今为止最明显的迹象之一，表明智能体（agent）的失控行为可能会阻碍该行业的快速发展。 在此之前，整个夏季都有关于人工智能系统在全行业范围内失控的报告，这标志着主要 AI 开发商因安全担忧而放弃新版本发布的罕见案例。 该公司原计划在未来几天或几周内发布这款名为 GPT-6.1 Astra 的模型，目标是在 10 月份首次亮相。与公司之前的模型相比，该模型在无需人工协助的情况下端到端完成挑战性任务以及写作方面能力更强。 该公司转而将重点放在提高未来模型的安全性上，并预计这些模型将具备更强的能力。 OpenAI 安全系统负责人 Saachi Jain 在接受采访时表示，GPT-6.1 Astra 相比前代模型 GPT-6 Astra，在两个领域出现了退步。 具体而言，该模型在衡量对齐度（即模型遵循人类意图的程度）的测试中表现不佳，GPT-6.1 Astra 展现出更高程度的欺骗性。 在告知用户其采取、未采取的行动时，它并不总是诚实的。 另一个问题是 OpenAI 所称的 “范围授权”，这意味着 GPT-6.1 Astra 会在不征求用户许可的情况下推进任务，并且有时即使在可能不安全的情况下，也会擅自调用外部工具和服务。 “在安全性和对齐方面，任何事情都需要权衡，”Jain 表示。“你确实需要找到一条合适的界限，既要保持行为在范围之内，又要避免模型在执行任务时 —— 即便遇到阻力 —— 表现出偷懒。” Jain 表示，虽然 GPT-6.1 Astra 在 “模型偷懒” 等领域有所改进，但它并未完全达到 OpenAI 的安全与对齐标准，因此公司决定不公开推出该模型。 该公告发布于 OpenAI 在旧金山举行的年度开发者大会的前一天。 过去，OpenAI 曾利用该会议作为发布新模型和服务的契机，以降低软件开发者的成本，这是这家 ChatGPT 制造商与竞争对手 AI 公司 Anthropic 争夺的一个群体。 最近几周，OpenAI 和 Anthropic 呼吁行业合作伙伴放慢尖端 AI 模型的开发速度，并投资于安全标准，同时指出他们将放缓自身内部 AI 研发的进度。 OpenAI 表示，正在调查近几个月发现的一系列智能体安全事件，并着手解决其背后的安全问题。 作为这项工作的一部分，该公司实施了一套新的监控系统，以更快地捕捉 AI 智能体的异常行为，并开始要求工程师在测试其 AI 系统时使用更强大的安全防护措施。 今年夏季早些时候，数百个负责执行网络安全测试的 OpenAI 内部智能体最终入侵了 AI 公司 Hugging Face。 自那以后，包括澳大利亚政府和联合国在内的知名机构发现，OpenAI 的智能体曾使用类似但范围较小的技术获取了其网站的访问权限。 许多公开已知的智能体安全事件都涉及 OpenAI 内部的 AI 模型，而这些模型从未计划向公众发布。 上周，OpenAI 表示已暂停其最强大 AI 模型的训练，原因是一个 AI 智能体利用公司互联网限制的漏洞访问并查询了一个公开聊天机器人事件。 该公司表示，其新的监控系统在 15 分钟内标记了该事件，目前这些模型的训练仍处于暂停状态。 该公司表示，GPT-6.1 Astra 并不属于这些模型之列，而是一个不同的案例。 “我们希望确保我们的模型开发是安全的，无论是在公司内部，还是在将其交付给用户时，”Jain 表示。“但是当我们将其交付给用户时，我们在安全和对齐方面有着相当高的标准。” 虽然该公司决定不发布 GPT-6.1 Astra，但它希望利用相同的基础模型进行额外的强化学习运行，并创建其 GPT-6 模型的未来迭代版本。 Jain 表示，OpenAI 计划进行多次深入研究，以找出 GPT-6.1 Astra 中所发现问题的根本原因。 Jain 补充道，这项工作包括确保模型的强化学习环境在奖励正确的模型行为方面，不会错误地向模型开发人员隐藏模型可以采取的危险行为。 AI 公司已开始受到政策制定者和公职人员的审查，他们正关注着这项技术的飞速发展。 本周晚些时候，美国众议院将举办一场题为《流氓 AI：保护国土免受 AI 智能体攻击》的听证会。 佛罗里达州总检察长、共和党人詹姆斯・乌斯勒起诉 OpenAI 及其首席执行官 Sam Altman，声称该公司在明知产品不安全的情况下仍将其发布，并无视了该产品可能伤害用户的警告。 乌斯勒在一项动议中要求，禁止 OpenAI 在没有经过第三方批准的安全措施的情况下开发新的 AI 模型，停止 ChatGPT 相关的推广内容，并限制该公司将 ChatGPT 宣传为安全的能力。 乌斯勒在文件中表示，科技公司声称他们 “除非受到政府的强制要求，否则无法停止推进那些可能终结文明的努力”。 OpenAI 的一位发言人表示，人们希望了解 AI 的开发是安全的，而这始于像我们这样的公司自身的作为。 “OpenAI 致力于在为 AI 行业制定安全标准方面发挥重要作用。我们致力于与佛罗里达州及其他州合作，推进适用于整个 AI 行业，而不仅仅是针对某一家公司的务实 AI 政策，” 他表示。#文字观点", "publish_time": "2026-09-29 08:53", "tags": ["文字观点"]}, "attachment:files/东方证券-森麒麟(002984)首次覆盖报告：智能制造先锋，摩洛哥基地放量加速成长-260929.pdf": {"id": "attachment:files/东方证券-森麒麟(002984)首次覆盖报告：智能制造先锋，摩洛哥基地放量加速成长-260929.pdf", "kind": "attachment", "title": "东方证券-森麒麟(002984)首次覆盖报告：智能制造先锋，摩洛哥基地放量加速成长-260929", "source_label": "东方证券", "excerpt": "敬请阅读末页之重要声明 集采破局者迈向全球化 ，GLP-1管线打开估值天花板 公司评级：买入（首次覆盖 ） 近十二个月 公司 表现 tus": "extracted"}, "post:2026-09-29T23-00:13ba44a7db10": {"id": "post:2026-09-29T23-00:13ba44a7db10", "kind": "post", "title": "2026-09-29 23:00", "source_label": "帖子正文", "excerpt": "大摩‑美光（MU）业绩前瞻 我们预计美光本次财报公布后盈利会上调，但上调幅度会低于此前几个季度；我们维持看多观点，不过市场讨论重心已经从 “行业景气度能有多高” 转向 “高景气能够维持多久”，该议题需要较长时间才会有结论。", "content": "大摩‑美光（MU）业绩前瞻 我们预计美光本次财报公布后盈利会上调，但上调幅度会低于此前几个季度；我们维持看多观点，不过市场讨论重心已经从 “行业景气度能有多高” 转向 “高景气能够维持多久”，该议题需要较长时间才会有结论。 美光股票评级为超配，将于 9 月 30 日周三收盘后披露财报；市场争论已经非常明确地从 “景气能有多好？” 转变为 “这份高景气可以维持多久？”，要赢得该场观点辩论需要更长时间，但我们坚信景气具备可持续性。 就景气高度而言，我们预计行业环境依旧强劲，财报后盈利会迎来上调，但上调幅度相比之前季度会有所收窄。 短期行业现状 在我们看来，短期市场环境依旧向好，需求旺盛、产品涨价迹象明确。DRAM 市场已形成该市场共识，NAND 闪存市场也逐步达成一致，数周之前集邦咨询大幅上调 NAND 相关预测，和我们此前的预判一致。 和美光历次财报季情况相同，我们尚不能完整掌握自然年第四季度的定价全貌，但我们判断价格起点会有 15‑20% 的涨幅，部分产品涨幅还会更高。 消费端市场仍存在一定不确定性，供给资源正在向企业级市场倾斜；根据我们多方侧面调研确认，企业市场采购的全部内存产品都在完成即时部署。 部分制约因素 即便如此，长期供货协议会在一定程度削弱涨价带来的业绩弹性。有一部分存储芯片出货量（占比大概率低于 30%）签署了附带价格上限的长期协议，协议价格锚定近期合同定价，因此并非全部产品会同步涨价。 HBM 等高景气品类的长期合约价格也具备较强粘性。 另外 8 月所在财季属于 14 周长财季，该因素会带来一定的业绩逆风，需要予以考量。 下一季度预测 综合以上各类情况，我们预测下个季度可比口径价格上涨 10‑12%，带动 11 月对应财季每股收益小幅高于市场一致预期。 我们依旧认为这份预测已经偏保守，而美光公司自身给出业绩指引通常也偏向保守。 从我们和投资者的沟通情况来看，市场普遍预期美光给出的业绩指引会高于一致预期，但向上弹性属于中等水平。 更大的核心议题：本轮上行周期能够持续多久 我们的观点是，未来数年存储芯片供需格局都会维持高度紧张。 我们听到投资者针对景气持续时间存在三大普遍担忧，分别为规格降配、中国本土存储供给释放、整体供给扩张风险。 担忧一：硬件规格降配 AI 算力建设依旧受 DRAM 供给约束，但算力部署会优先保障业务运行。行业普遍心态是市场会吸纳所有可获得的内存资源，价格敏感度相对较低，再去匹配可出货的算力规模。 每一次硬件规格降配，都会在其他环节催生新增需求。举例来说，我们了解到英伟达服务器机架内部 LPDDR5 内存规格下调之后，产生了对 NAND 缓存的间接需求，原本放在主内存的关键键值参数，需要转移至低延迟存储当中。 同时内存降配还存在其他形式，比如硬件解聚合，针对内存需求不高的任务，打造内存占比更低的硬件设备；网络架构优化也带来更多调整空间。 但总体判断是，受上述因素影响，任何新增供给出现，都会带来一定程度的供需缓解。 担忧二：中国本土存储供给 中国本土存储供给相关情况市场已经充分认知，当前供给短缺在中国市场和全球其他地区同样突出。 我们已经对该领域持续跟踪十年；在当前行业环境下，我们认为中国本土存储供给很难跑赢海外头部厂商。 担忧三：资本开支带动供给抬升 随着资本开支持续加码，我们已经持续上调 DRAM 供给预测，NAND 供给预测则相对稳定。 从定量角度评估供给冲击存在难度，但我们对接的全产业链人士普遍判断，2027、2028 两年存储芯片供需会比当下更加紧张。 周期终结的判断逻辑 我们依旧认为，本轮周期终结的触发条件大概率来自 AI 资本开支放缓，而非新增供给爆发；同时我们会保持高频产业跟踪。 股票回购议题 进入财报季前最后一个争论点是股票回购进展，我们建议不要对回购抱有过高期待。 受《芯片法案》相关条款约束，本轮周期中美光的现金回馈股东行为受到限制；12 月之后公司开展股票回购的空间会变大。 市场有大量提问关心美光会对回购给予多大权重，坦白讲我们目前无法确定。 个股观点 我们看好这只股票，但相比之下更偏好算力赛道相关标的。 美光股价自低位已经实现可观反弹；尽管我们相信存储行业高景气具备持续性，但景气时长的论证需要更长时间兑现，短期没有直接证据可以证实。 维持超配评级，目标价维持1200 美元。 美光业绩前瞻 美光计划在 9 月 30 日周三收盘后发布财报。 8 月财季相关模型测算 我们测算该财季营收 500.024 亿美元，环比上涨 20.7%，同比上涨 342.1%，低于市场一致预期的 509.23 亿美元。 分业务板块，DRAM 芯片出货量环比提升 3.0%，平均售价上涨 16.0%；NAND 芯片出货量环比提升 4.0%，平均售价上涨 20.0%。 我们测算毛利率 86.4%，高于市场一致预期的 85.3%；测算每股收益 31.20 美元，略低于市场一致预期 31.49 美元。 11 月财季展望 我们测算该财季营收 575.60 亿美元，环比上涨 15.1%，同比上涨 321.9%，高于市场一致预期 566.44 亿美元。 分业务板块，DRAM 芯片出货量环比提升 3.0%，价格上涨 12.0%；NAND 芯片出货量环比提升 4.0%，价格上涨 10.0%。 我们测算毛利率 88.1%，高于市场一致预期 85.3%；测算每股收益 35.57 美元，高于市场一致预期 35.07 美元。 大摩预测对比市场一致预期（单位：百万美元） 26 财年第四季度：大摩预测营收 50024 百万美元，市场一致预期 50923 百万美元；环比增速大摩 20.7%，市场 22.8%；毛利率大摩 86.4%，市场 85.3%；每股收益大摩 31.20 美元，市场 31.49 美元。 27 财年第一季度：大摩预测营收 57560 百万美元，市场一致预期 56644 百万美元；环比增速大摩 15.1%，市场 11.2%；毛利率大摩 88.1%，市场 85.3%；每股收益大摩 35.57 美元，市场 35.07 美元。 2026 自然年全年：大摩预测营收 172900 百万美元，市场 170933 百万美元；毛利率大摩 85.0%，市场 82.7%；每股收益大摩 104.05 美元，市场 101.84 美元。 2027 自然年全年：大摩预测营收 285950 百万美元，市场 263317 百万美元；毛利率大摩 89.5%，市场 84.9%；每股收益大摩 180.40 美元，市场 164.47 美元。#文字观点", "publish_time": "2026-09-29 23:00", "tags": ["文字观点"]}, "post:2026-09-29T11-12:69d23e3ecb94": {"id": "post:2026-09-29T11-12:69d23e3ecb94", "kind": "post", "title": "2026-09-29 11:12", "source_label": "帖子正文", "excerpt": "【东吴电新】十月锂电行业排产更新#请勿转发1⃣电池（214.60GWh，环增3.82%）电池1：115.8GWh，环增2.30%电池2：41.5GWh，环增5.33%电池3：16.05GWh，环增5.94%电池4：1.90GWh，环增2.70%电池5：19.95GWh，环增3.37%电池6：19.4", "content": "【东吴电新】十月锂电行业排产更新#请勿转发1⃣电池（214.60GWh，环增3.82%）电池1：115.8GWh，环增2.30%电池2：41.5GWh，环增5.33%电池3：16.05GWh，环增5.94%电池4：1.90GWh，环增2.70%电池5：19.95GWh，环增3.37%电池6：19.4GWh，环增8.99% 2⃣正极（26.14万吨，环增1.5%，三元3.58万吨，环增5.6%，铁锂22.12万吨，环增0.91%）正极1：2.80万吨，环增7.98%，三元0.76万吨，环增1.33%，铁锂2.00万吨，环增11.11%正极2：1.26万吨，环增4.13%，三元0.84万吨，环增6.33%，铁锂0.42万吨，环平正极3：三元1.2万吨，环增9.09%正极4：铁锂15.00万吨，环平正极5：铁锂4.40万吨，环平正极6：1.48万吨，环增2.07%，三元0.78万吨，环增4.00%，铁锂0.30万吨，环平 3⃣负极（22.70万吨，环增3.65%）负极1：2.60万吨，环增4.00%负极2：4.10万吨，环平负极3：7.80万吨，环增4.00%负极4：8.20万吨，环增5.13% 4⃣隔膜（23.17亿平，环增0.39%）隔膜1：12.68亿平，环增0.24%隔膜2：5.04亿平，环增1.20%隔膜3：5.45亿平，环平 5⃣电解液（15.00万吨，环增2.04%）电解液1：9.90万吨，环增2.06%电解液2：5.10万吨，环增2.00%数据来源于XL锂电，或存在口径差异。#文字观点", "publish_time": "2026-09-29 11:12", "tags": ["请勿转发", "文字观点"]}, "post:2026-09-29T22-27:fb6b1c6197e0": {"id": "post:2026-09-29T22-27:fb6b1c6197e0", "kind": "post", "title": "2026-09-29 22:27", "source_label": "帖子正文", "excerpt": "【非AI PCB 涨价链】涨价周期及持续性增强，汽车方向有望领涨 一、涨价传导：上下游一体化下顺价顺畅，Q3-Q4为利润反转关键窗口。PCB产业链呈电子布→覆铜板→PCB 的一体化传导，上下游协同性强，顺价基础稳固。", "content": "【非AI PCB 涨价链】涨价周期及持续性增强，汽车方向有望领涨 一、涨价传导：上下游一体化下顺价顺畅，Q3-Q4为利润反转关键窗口。 PCB产业链呈电子布→覆铜板→PCB 的一体化传导，上下游协同性强，顺价基础稳固。传导存在时间差，PCB 环节通常在原材料涨价后1-2个季度完成顺价；# Q3起PCB进入加速顺价期 ，预计为传统PCB业绩释放的首个密集季度，亦是利润拐点确认的关键节点。 二、涨价持续性：供给偏紧叠加格局优化，需求稳健升级，支撑涨价趋势延续。 # 供给端： 原材料紧缺下转为配置制，龙头集中度提升。上游电子布、覆铜板已转为配置制（配给制）行业，PCB厂作为制造与上游材料的核心拿货环节，顺价过程中增量利润同时覆盖制造端与分销端，传导顺畅。行业格局同步优化：高端产能加速向 AI 倾斜、非 AI 需求收缩；Q2 涨价过程中三线小厂 CCL原材料供给份额下降，中端龙头公司集中度提升。 # 需求端： 非 AI 需求稳健升级，汽车带动高端材料用量。 非 AI 类需求整体稳健，汽车行业中高端需求（如智能座舱 PCB）已升级至 M7 材料等级，对高端覆铜板及电子布形成增量拉动。 # 涨价持续性。根据当前上游电子布及覆铜板涨价预期，行业紧缺将持续到27年中，当前PCB仅为涨价第一季度，后续加速上行，且PCB货值较上游更大，实际涨价幅度有望超过Q2覆铜板环节。 三、板块内部演绎：自 8 月起轮动上涨，核心看汽车涨价超预期。 传统 PCB 板块自 8 月起内部轮动上涨，第一波为估值修复，后续核心看涨价持续超预期与 AI 突破方向。 板块上涨按梯队依次展开：兼具AI与传统涨价的【景旺电子、方正科技】等，二线大规模中军【奥士康、崇达技术、超声电子】等，小市值弹性【金禄电子、四会富仕、博敏电子、中京电子、威尔高、满坤科技、伊顿电子、澳弘电子】等；当前第一波上涨仅为估值修复，后续核心看涨价持续超预期与AI突破方向。 # 涨价超预期方向核心在汽车。 Q3 汽车行业连续涨价，部分料号累计涨幅超 100%。主因汽车对供应链稳定性与产品品质要求高、对价格敏感度相对低；客户资源丰富、上游 CCL 拿货稳定的 PCB 企业，本轮涨价议价能力预计持续增强。相较其他行业季度涨价频率，汽车客户已形成月度涨价频率，新供应商认证周期大幅缩短。 # 继续推荐中小PCB方向： 核心看好汽车占比高【奥士康】，AI+涨价【景旺电子、方正科技】，涨价持续超预期的【崇达技术、超声电子、金禄电子、四会富仕、博敏电子、中京电子、威尔高、满坤科技、伊顿电子、澳弘电子】等。#文字观点", "publish_time": "2026-09-29 22:27", "tags": ["文字观点"]}, "post:2026-09-29T09-16:427bd02b229d": {"id": "post:2026-09-29T09-16:427bd02b229d", "kind": "post", "title": "2026-09-29 09:16", "source_label": "帖子正文", "excerpt": "📑[高盛销售简报]：“让光明照耀”。为什么光网络股票昨天大幅下跌？", "content": "📑[高盛销售简报]：“让光明照耀”。为什么光网络股票昨天大幅下跌？Allen Chang 关于光网络的研究。 📝 昨天，中国光通信板块股票大幅下跌。中际旭创、天孚通信、光库科技、长飞光纤光缆等个股跌幅接近或超过 10%。 📝 我的个人结论是：短期内可能会有一些杂音和阻力，但黄金周假期前的这波下跌，或许反而提供了长期买入机会。 📝 简单谈几点股价下跌的原因： 📝 每逢长假（例如十月黄金周或农历新年）前，A 股投资者总会面临一个经典问题：沪深股市休市这么久，我该持股还是持现金？ 📝 不可避免地，一些 A 股投资者（机构和散户）会选择卖出手中已有的持仓，尤其是已经获利的股票，以便在享受长假期间降低风险和波动。 📝 昨天 A 股市场的心态颇为典型。任何板块的负面消息，通常都会成为抛售股票、持有现金的方便借口。 📝 彭博社报道称，9 月 25 日，4 名美国参议员提出了《保障国家安全系统免受中国光收发器影响法案》，明确将光迅科技和新易盛列为美国国家安全系统（NSS）采购的受限供应商。 📝 对于此类法案提案或相关担忧，我们并不陌生。就在光迅科技香港 IPO 前后，也有类似消息传出，联邦通信委员会（FCC）对中国制造的光收发器表示担忧。 📝 虽然我们无法判断最终结果，但我只能说，法案距离真正通过并成为法律还很遥远。 📝 此外，问题仍然是：如果不使用这些中国光收发器，有哪些成本同样低廉、效果同样出色的替代方案？ 📝 在中期和长期来看，依我个人之见，连接 AI 服务器与机架以实现 “纵向扩展” 和 “横向扩展” 的需求依然真实存在。正如 Allen 在今年 4 月的这篇说明中所说： 📝 如何连接所有这些 AI 服务器与机架，以实现纵向扩展和横向扩展？主要有三种选择：PCB、铜缆和光学方案。图 6 展示了这三种方案的优缺点。 📝 在 Allen 的报告中认为： 📝 在横向扩展 / 纵向扩展中，美元价值含量分别提升 16 倍 / 45 倍。 📝 从每个计算单元的横向扩展转向纵向扩展时，光模块 / 光引擎的可服务市场规模扩大 13 倍。 📝 即使 CPO 渗透率达到 29%，从 GB300 NVL72 升级到 Rubin Ultra NVL576 后，每个计算单元横向扩展所用可插拔光模块的价值市场规模仍扩大 10 倍。 📝 关于光收发器，我们预计全球光收发器市场规模将达到 510 亿 / 730 亿 / 690 亿美元，其中 800G 及以上细分市场将以 31% 的复合年增长率增长，预计达到 320 亿 / 550 亿 / 560 亿美元。 📝 我们预计，2026 年 800G/1.6T 出货量为 340 万 / 260 万台，2027 年将增至 450 万 / 460 万台；3.2T 出货量将在 2027 年增至 130 万台。 📝 硅光子技术在 800G/1.6T/3.2T 光收发器中的占比将分别达到 60%/80%/100%。 📝 在光收发器供应链中，我们看好：（1）光收发器或光引擎制造商：中际旭创、新易盛、天孚通信；（2）连续波激光器或外延片供应商：光圣科技、全电光；（3）数据中心交换机：锐捷网络；（4）设备：RoboTechnik。#文字观点", "publish_time": "2026-09-29 09:16", "tags": ["文字观点"]}, "post:2026-09-29T11-12:1a3963d71cf0": {"id": "post:2026-09-29T11-12:1a3963d71cf0", "kind": "post", "title": "2026-09-29 11:12", "source_label": "帖子正文", "excerpt": "‼#【华西股份】：参股VCSEL光通信龙头纵慧芯光 1）公司通过一村资本间接参股两大光芯片龙头——熹联光芯（硅光+CPO）与纵慧芯光（VCSEL/InP）。⚡熹联光芯掌握硅光全栈技术，400G/800G批量交付AI服务器，1.6T用于CPO", "content": "‼#【华西股份】：参股VCSEL光通信龙头纵慧芯光 1）公司通过一村资本间接参股两大光芯片龙头——熹联光芯（硅光+CPO）与纵慧芯光（VCSEL/InP）。 ⚡熹联光芯掌握硅光全栈技术，400G/800G批量交付AI服务器，1.6T用于CPO； ⚡纵慧芯光是国内唯一同时实现光通信光模块VCSEL与磷化铟（InP）芯片量产的厂商，累计出货超7亿颗，并布局50G/100G PAM4 VCSEL。 ✨华西股份是A股唯一同时卡位硅光与VCSEL两大路线的投资平台。 2）全球光芯片长期被海外垄断，AI算力驱动800G/1.6T需求井喷，硅光渗透率超50%，VCSEL向100G演进。熹联光芯已切入头部AI服务器链，纵慧芯光加速国产替代，快速抢占份额。 微型VCSEL目前正积极竞争用于大规模互连。垂直腔面发射激光器:(VCSEL)总是垂直于晶圆发射。 VCSEL 是超预期黑马，源于磷化铟产能刚性短缺，将主导大规模低成本短距 NPO/CPO#文字观点", "publish_time": "2026-09-29 11:12", "tags": ["文字观点"]}, "post:2026-09-29T22-17:f70d5a71e6ce": {"id": "post:2026-09-29T22-17:f70d5a71e6ce", "kind": "post", "title": "2026-09-29 22:17", "source_label": "帖子正文", "excerpt": "野村OCS/CPO专家通话： 1、 OCS需求正进入一个增长速度陡增的阶段。谷歌需求预计将从2025年的12–15千个单位增长到2027年的35–40千个单位。", "content": "野村OCS/CPO专家通话： 1、 OCS需求正进入一个增长速度陡增的阶段。 谷歌需求预计将从2025年的12–15千个单位增长到2027年的35–40千个单位。包括其他CSP，总计2027年需求可能达到40–50千个单位。 对于大型AI集群，其吸引力在于更低的TCO、延迟和故障率。 2、 MEMS仍是领先的OCS架构，预计2026年市场份额为80–85%，2027年为60–70%。 但市场正在多元化：液晶提供更低电压和更长寿命，压电正进入验证阶段，而硅光子仍是一个更长期的选择。 3、 北美2026年可能出货45–50百万个800G模块。 1.6T需求可能超过30百万个单位，但材料短缺可能将实际出货量限制在仅10–15百万个。制约因素似乎是供应而非终端需求——在3nm DSP供应有限的情况下，DR正在获得更多份额。 4、 2027年收发器定价仍保持坚挺：800G约为300–400美元，1.6T为800–1000美元以上，预计年度降幅将保持在10%以下。 CPO可能在2027年达到80–100千个单位，而NPO可能从2027年的小批量出货转向2028年的量产。", "publish_time": "2026-09-29 22:17", "tags": []}, "post:2026-09-29T22-59:f80ee99d646d": {"id": "post:2026-09-29T22-59:f80ee99d646d", "kind": "post", "title": "2026-09-29 22:59", "source_label": "帖子正文", "excerpt": "大摩‑电信及网络设备‑ECOC 大会后续：公司具体要点及投资者反馈 继上周发布的初步点评报告之后，我们整理汇总了在 ECOC 大会期间和各家公司单独会谈得到的核心信息。行业需求环境强劲，光模块相关潜在市场规模随业务扩张持续增长，供给约束问题已经得到缓解。", "content": "大摩‑电信及网络设备‑ECOC 大会后续：公司具体要点及投资者反馈 继上周发布的初步点评报告之后，我们整理汇总了在 ECOC 大会期间和各家公司单独会谈得到的核心信息。行业需求环境强劲，光模块相关潜在市场规模随业务扩张持续增长，供给约束问题已经得到缓解。 展望明年，行业表现的关键变量将是供给释放节奏、扩张市场的业务落地进展以及毛利率水平。 我们于 9 月 21 日、9 月 22 日在西班牙举办的 ECOC 大会上，与思科、CIEN、Coherent、是德科技、诺基亚、TSEM、Lightmatter（非上市公司）开展会谈。相关会议的整体初步观点，可参考我们上周发布的报告《ECOC 大会初步观察：全速前进》。 大会结束之后，投资者反馈整体偏积极，但市场也存在疑惑：在当前大量行业信息已经公开的背景下，后续行情将如何演绎。 正如我们在 ECOC 大会总结报告中提到，本次大会的几大核心主题：光器件的需求增速已经超过供应商的生产能力，不少厂商订单排期已经达到 12‑18 个月；CPO/NPO 最终技术形态尚未完全确定，但市场普遍认可该技术方向终将落地。 大会结束后和投资者的交流可以总结为：市场一致认可行业需求旺盛，但投资者更希望厘清尚未明确的行业变量，以及个股在未来一年的驱动逻辑。 我们的总结观点：LITE、COHR 拥有相对更近的催化因素，分别为：1）CPO/NPO 相关产品发布；2）磷化铟全产业链需求持续高景气；3）良率改善带动毛利率上行。 CIEN、GLW、CSCO 的机会则会在稍晚阶段显现，对应的驱动是：1）新增产能投产带来供给放开；2）高毛利产品开始批量出货。 相较于需求端变化，我们认为毛利率上行将是明年个股获取超额收益更核心的驱动因素，这也是我们理解 LITE 近期跑赢同业的重要原因。 各公司单独会谈要点（按字母顺序排列） Ciena（高层参会人员：首席战略官 David Rothenstein，投资者关系负责人 Patti Trautwein、Greg Lampf） 本次会谈大部分内容和上周在渥太华投资者论坛的观点保持一致。核心观点如下： 对自身行业竞争地位抱有信心。 该公司提出的 29 财年 140 亿美元营收目标，并未将 CPO/NPO 及相关元器件的重大贡献纳入测算，如果相关技术落地成功，会带来额外业绩增量。 毛利率的抬升，最终不只依赖 Hyper‑Rail 产品，也普遍取决于 RLS 系列产品的表现。 公司在手订单积压规模未来会出现回落，该现象存在两面性，回落代表供给端产能释放。如果不存在供给约束，26 财年公司营收本可以接近 80 亿美元，而当前市场一致预期为 64 亿美元。 整体观点与渥太华论坛保持一致，公司股价的核心观察点是新产品投产后，毛利率向 50% 迈进的实现路径。 思科（参会人员：Acacia 产品管理副总裁 Tom Williams，光系统产品管理副总裁 Lorenzo Ghioni，投资者关系 Emily Hunt） 本次会谈中最值得关注的信息：思科当前已经出现部分产品可供出货，意味着随着可用产品释放，未来几个季度有望拿到更多订单。 其他核心观点： 对可插拔光模块领域的龙头地位充满信心，年内 400ZR、800ZR 相关产品的市场需求预期均出现上调。 1600ZR 产品需求会格外旺盛，部分厂商完成 400ZR 迭代后没有升级 800ZR，但行业几乎都会推进 1600ZR 的升级。 对 CPO 技术，尤其是大规模部署场景的态度依旧偏谨慎，该口径和此前对外表述保持一致。 过去数周 AI 资本开支相关标的迎来估值修复，思科经历估值回调。 公司当前手握部分可调配供给，该部分增量并未计入市场季度预期，有望成为业绩向上催化。 Coherent（参会人员：半导体设备高级副总裁 Beck Mason，投资者关系 David Pasquale） PhotonLink 相关内容请参阅独立专题报告。其余核心观点： VCSEL 激光器的重要性会持续提升，其优势体现在功耗、成本，同时不依赖磷化铟材料，公司持续看好 VCSEL 长期发展前景。公司重点推进的方向之一就是面向 CPO/NPO 应用的高密度 VCSEL 产品。 当前行业瓶颈为衬底材料，设备工具的供应实际情况相对良好。 OCS 光交叉连接的应用场景持续拓宽，但部分落地项目的规模会偏小。 未来一年 CPO/NPO/OCS 产品产能爬坡的实际证据，将会成为该公司股价重要催化，有望优化整体毛利率水平。 是德科技（参会人员：网络与数据中心业务副总裁兼总经理 Joachim Peerlings 博士，投资者关系 Liz Morelli） 核心观点： 业务覆盖光网络全产业链，从芯片流片、量产，一直延伸至 AI 流量仿真环节。 我们在该公司展台走访时看到 5‑6 大类产品，覆盖产品从设计到量产全流程，其中流量仿真等品类是过去一年新拓展的业务。 伴随产品迭代更新，整体解决方案成本同步上行。公司表示，网络、激光器速率每一代升级，都需要配套更多的测试内容。 对自身竞争地位充满信心，认为自身相比竞争对手至少领先一年。 展台调研也印证我们看好该公司的逻辑：1）深度参与 AI 供应链更多环节；2）相关测试项目的成本持续抬升；3）具备差异化竞争优势。 Lightmatter（非上市公司，参会人员：联合创始人兼首席科学家 Darius Bunandar 博士，生态与联盟副总裁 Steve Klinger） 管理层核心观点： 双向复用技术可以帮助客户降低光纤使用需求，该公司方案支持单根光纤同时完成收发，光纤需求量直接减半。 L20 CPX 模块将在 2027 年启动产能爬坡，产品遵循 Open CPX 多源协议标准，采用标准插座形态，有利于产品推广落地。 将在 OCP 开放计算项目上发布更多进展。该公司表示，正在 OCP 联盟内部牵头，推进面向 AI 基础设施的 CPO 技术，目标推出更多开放设计标准。 诺基亚（由 Terence Tsui 覆盖，参会人员：光网络业务总经理 Ron Johnson，光网络市场高级副总裁 Rob Shore，投资者关系 David Mulholland） 核心观点： 产品技术路线规划目标较高，但管理层对开发时间节点有信心。诺基亚整合自身与 Infinera 两支研发团队，共同推进第四代数字信号处理器研发。 对产能采取策略性布局。和思科类似，诺基亚会充分利用现有闲置产能，明年晶圆厂资源释放之后，还会新增更多产能。 AI 无线接入网业务正在积蓄发展动能。本次会谈虽然聚焦光通信，但是投资者提问关注到 AI 无线接入网，客户试点今年已经启动，公司已经开展 19 个独立试点项目，业务势头向好。#文字观点", "publish_time": "2026-09-29 22:59", "tags": ["文字观点"]}, "post:2026-09-29T09-05:f64a8d26022f": {"id": "post:2026-09-29T09-05:f64a8d26022f", "kind": "post", "title": "2026-0 ，10 月 1 日起执行，两地地产股大涨；央行 7 天期 1,390 亿元、隔夜 6,610 亿元、14 天期 3,000 亿元，合计 1.1 万亿元，DR001、DR007、DR014 全部回落至 1.40% 政策利率下方；七部门印发《新型电池产业发展“十五五”规划》，明确 2030 年全固态电池初步规模化应用、锂电池循环寿命 15,000 次、19 项重点任务。\u003c/li>\n\u003cli>AI 模型与资本动作密集：OpenAI 因内部测试安全担忧取消下一代 AI 模型发布，盘前信息称其取消原定 10 月发布新模型 GPT-6.1 Astra 的计划；AMD 以 82 亿美元收购李飞飞创立的 World Labs；Anthropic IPO 招股书显示收入高速增长获验证、算力承诺仍是核心矛盾；Manus 2.0、Claude Sonnet 5.5、快手可灵 4.0 等产品密集推出。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI 算力/半导体扩产与涨价\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：兆易创新上修对长鑫 DRAM 采购与代工额度 38%，9—12 月四个月采购额 42.58 亿元，超过前八个月；2026 年对长鑫 DRAM 采购与代工额度由 57.11 亿元上修至 78.54 亿元。长鑫科技拟投近 350 亿元新建技术研发项目与后道测试基地二期，二期总投资 108 亿元，设备投资 81.80 亿元。\u003c/li>\n\u003cli>今天出现的催化/验证：长鑫公告提到“公司新增测试产能不足”，后道设备逻辑再次加强；联讯仪器作为国内存储测试机龙头有望充分受益，国产量检测卡位最优方向提到中科飞测；美光业绩前瞻预计本次财报后盈利上调，但上调幅度低于此前几个季度，市场讨论重心从“行业景气度能有多高”转向“高景气能够维持多久”。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>光通信/CPO/OCS 需求与个股分化\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：高盛销售简报主题“让光明照耀”解释光网络股票大幅下跌；关于光模块法案 S.5548，有判定认为仅针对国家安全系统采购、未对商业数据中心与 AI 基础设施实施全面禁令，同日有光网络研究称假期前下跌或提供长期买入机会。共封装光学技术加速推进，但个股影响分化。\u003c/li>\n\u003cli>今天出现的催化/验证：硅光子技术在 800G/1.6T/3.2T 光收发器中的占比将分别达到 60%/80%/100%；预计 2026 年 800G/1.6T 出货量为 340 万/260 万台，2027 年将增至 450 万/460 万台；熹联光芯掌握硅光全栈技术，400G/800G 批量交付 AI 服务器，1.6T 用于 CPO。OCS 需求进入增速陡增阶段，谷歌需求预计从 2025 年的 12—15 千个单位增长到 2027 年的 35—40 千个单位。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>AI 散热/TIM/液冷\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：GPU 功耗激增，热管理重要性持续提升，2024 年 B200 TDP 仅 700W，Rubin TDP 已达 2300W；英伟达 Rubin 把石墨烯复合导热垫片定为标准化 TIM，单 GPU 价值量约 130—140 元/片；TIM2/TIM1.5 有望全面切向石墨烯材料。\u003c/li>\n\u003cli>今天出现的催化/验证：鸿富诚成功上市，AI 散热板块迎来催化及定价锚；其碳基导热垫片收入从 23 年 0.36 亿元快速增长至 25 年 2.52 亿元，收入占比从 14% 提升至 36%。液冷并非完全取消散热风扇芯片，冷板式液冷中除 GPU、CPU 核心热源外，内存、存储、高速通道、电源等周边部件仍依赖风扇散热；峰岹科技持续拿到 AI 服务器散热相关客户量产订单，中低压 MOSFET 涨价具备坚实供需基础，26 年有望持续。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>PCB/CCL/铜箔涨价链\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI 服务器需求爆发引发供给结构性重构，PCB 产业链迎密集涨价潮，树脂、电子布、铜箔、CCL、PCB 各环节均完成顺价传导；为适应 AI 算力持续升级，AI 服务器主板材料正从 M6、M7 等级推进至 M8、M9，板材更厚更硬，导致钻针损耗剧增。\u003c/li>\n\u003cli>今天出现的催化/验证：杰普特与尖点科技正式签署战略合作 MOU，以金刚石钻针为合作切入点；奥杰超快激光钻孔机专为 M9 级高速覆铜板及 1.6T 光模块 PCB 精密制造需求打造。M9 方案最新进展中，添加 10% 左右的 BCB 碳氢树脂可以显著改性电性能，玻纤布可以从 Q 布调整成二代布，成本下降约 20%。非 AI PCB 涨价链中，Q3—Q4 为利润反转关键窗口，汽车方向有望领涨。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>机器人/Optimus 量产与核心零部件\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：特斯拉近几个月将 Optimus 人形机器人的产量提高了大约十倍，但公司仍在努力实现大规模可靠生产；其生产线正面临机器人复杂手部、自动化设备和供应商限制等问题。\u003c/li>\n\u003cli>今天出现的催化/验证：模塑科技深度报告主题为“深耕汽车外饰业务多年，打开人形机器人新成长曲线”，公司依托精密模具和自动化生产技术积累，从机器人滚柱丝杠向价值量更高的模组延伸，并已在国内市场取得突破，向核心机器人公司供应超千套线性执行器；震裕科技估值具备安全边际，机器人+卫星双重共振有望催化，26H1 归母净利润 4.2 亿元，同比翻倍，全年有望 10 亿+。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观/地产/政策与中美贸易\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：财政部、央行、金融监管总局联合下发全国性购房贷款贴息政策，10 月 1 日起执行，两地地产股应声大涨；央行三期限工具齐发合计 1.1 万亿元，资金价格已经松到位，风险偏好却被外部利率与油价按住。\u003c/li>\n\u003cli>今天出现的催化/验证：京沪现房新政细则温和落地，明确新老划断、土地款分期等；市场讨论贴息或对低总价段影响大于高总价段。中美双方在贸易理事会框架下就 300 亿美元对等降税框架达成共识，超过 90% 的产品将免除相互加征的全部关税，享受最惠国关税待遇，中国对美降税行业确定包括小家电行业，石头科技、新宝股份、小熊电器、安克创新、美的集团等最受益。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>9/28 通信 −7.36%、电子 −4.93% 领跌全市场，电子行业主力净流出 294.44 亿元、通信净流出 156.75 亿元；中际旭创单日成交额逾 250 亿元居 A 股首位、收跌 9.03%。\u003c/li>\n\u003cli>今日光模块、半导体股部分修复：长飞光纤光缆涨 3.48%、寒武纪涨超 2%、中芯国际涨 0.82%，但中际旭创、新易盛仍分别下跌 0.24%、1.70%，修复并不完全；港股光通信股全线反弹，长飞光纤光缆涨 7.40%、剑桥科技涨 5.00%、中际旭创 H 股涨 3.11%，反弹幅度明显强于 A 股同类股。\u003c/li>\n\u003cli>恒生指数 −0.5%、国企指数 −0.5%、恒生科技指数 −1.1%、成交额 1,840 亿港元；领涨板块为医疗保健 +1.4%、房地产 +1.2%、原材料 +1.2%；表现落后板块为非必需消费品 −1.3%、信息技术 −0.9%。吉利汽车是恒生指数成分股中表现最差标的，下跌 7.4%；台达电下跌 3.9%。\u003c/li>\n\u003cli>亚洲股市收盘涨跌互现，风险情绪主要受油价走高主导，背后原因是特朗普总统否决了霍尔木兹海峡停火框架提议、全球债券收益率上行，以及科技板块面临新的压力。\u003c/li>\n\u003cli>美股市场观察：标普 500 指数下跌 77 个基点，收于 7683 点，收盘竞价 MOC 为 4 亿美元买入；纳斯达克 100 指数下跌 108 个基点，报 30276 点。\u003c/li>\n\u003cli>美债与 AI 定价：年初至今美国 10 年期国债收益率上行约 100 个基点，过去一个月更跳升约 50 个基点；无风险收益率提升在美股体现为估值压缩，强现金流与强利润预期公司股价走势较为坚挺，EPS 确定性增长抵消估值压制；美债收益率与 AI 债务短期互相折磨，但大盘子下美债需要让步的概率大于 AI，AI 当前回报率支撑高利率借债，但美债继续上行压制。\u003c/li>\n\u003cli>三部门联合下发全国性购房贷款贴息政策，10 月 1 日起执行，两地地产股大涨；京沪现房新政细则温和落地，国常会明确稳地产政策；市场讨论贴息形式、期限、额度等，或对低总价段影响大于高总价段，过去两三年部分城市用地方财政已经有过一次性购房贴息支持措施。\u003c/li>\n\u003cli>央行 9/28 三期限工具齐发：7 天期 1,390 亿元、隔夜 6,610 亿元、14 天期 3,000 亿元，合计 1.1 万亿元；DR001、DR007、DR014 全部回落至 1.40% 政策利率下方。\u003c/li>\n\u003cli>七部门联合制定《新型电池产业发展“十五五”规划》，到 2030 年全固态电池初步实现规模化应用；汽车整车逆势 +1%，江淮汽车 4 天 3 板，小家电板块涨超 1%。\u003c/li>\n\u003cli>兆易创新拟增加 2026 年度与长鑫集团日常关联交易额 21.43 亿元，调整后全年预计总额达 78.54 亿元，较原计划增长 37.5%；2026 年 1—8 月关联交易 35.96 亿元，占全面预计金额的 45.8%。\u003c/li>\n\u003cli>长鑫科技拟投资近 350 亿元新建技术研发项目+存储器晶圆后道测试基地二期项目；后道测试基地二期计划总投资 108 亿元，设备投资 81.80 亿元，投资占比 75.74%，并提到公司新增测试产能不足。\u003c/li>\n\u003cli>OpenAI 因研究人员在内部测试中提出的安全担忧，取消下一代 AI 模型发布；盘前信息称其取消原定 10 月发布新模型 GPT-6.1 Astra 的计划。AMD 以 82 亿美元收购李飞飞创立的 World Labs，并以股票方式支付。\u003c/li>\n\u003cli>Anthropic IPO 招股书显示，公司认为 AI 对全球经济的变革将比工业化、电力和互联网更为深远，但实现成本惊人；收入高速增长获验证，算力承诺仍是核心矛盾；已于 6 月 1 日向美国 SEC 秘密递交 S-1，目前 IPO 仍处于监管审核及发行准备阶段。\u003c/li>\n\u003cli>Snowflake 拟发行 35 亿美元零息可转债，其中 13 亿美元于 2029 年到期、22 亿美元于 2031 年到期，并给予承销商额外 5 亿美元购买权，本轮发行规模最高可达 40 亿美元。\u003c/li>\n\u003cli>SpaceX Starship 第 14 次飞行测试首次实现入轨，Starlink V3 商业部署开启新阶段；Super Heavy Booster 21 完成热分离、返程点火及目标海域上空着陆。\u003c/li>\n\u003cli>阿斯利康宣布对 Summit 进行 20 亿美元战略投资并开展临床合作，Summit 盘后大涨 18%；交易完成后阿斯利康权益约占 Summit 流通普通股 12.0%，完全稀释基础下约占 10.6%；临床合作将评估 CLDN 18.2 ADC 与 PD-1/VEGF 在消化道肿瘤。\u003c/li>\n\u003cli>KOD 暴涨 178%，验证眼底抗 VEGF 药物长效化的产业趋势；9 月 28 日盘前公布湿性老年黄斑变性核心三期 DAYBREAK 临床试验大获成功，双候选药全部达到主要终点，A 股中拥有同类管线或技术储备的公司关注光正眼科、康弘药业。\u003c/li>\n\u003cli>英伟达 Rubin 把石墨烯复合导热垫片定为标准化 TIM，单 GPU 价值量约 130—140 元/片；鸿富诚成功上市，AI 散热板块迎来催化及定价锚；其碳基导热垫片收入从 23 年 0.36 亿元增长至 25 年 2.52 亿元，收入占比从 14% 提升至 36%。TIM 材料、陶瓷基板、液冷三者独立，冷板式液冷中内存、存储、高速通道、电源等周边部件仍依赖风扇散热。\u003c/li>\n\u003cli>芯联集成发布三季度业绩预告，预计 2026 年 Q1—Q3 实现营业收入 77.66 亿元，同比增长约 43.23%；归母净利润约 6.81 亿元，同比增加约 247.08%，较去年同期实现扭亏为盈。\u003c/li>\n\u003cli>峰岹科技 9 月 16 日股权激励首次授予完成，主业依托 AI 服务器散热高景气，机器人业务打开远期成长空间；持续拿到 AI 服务器散热相关客户量产订单；液冷并非完全取消散热风扇芯片，散热风扇芯片行业需求具备长期确定性。\u003c/li>\n\u003cli>PCB 方面，AI 服务器需求爆发引发供给结构性重构，树脂、电子布、铜箔、CCL、PCB 各环节均完成顺价传导；杰普特与尖点科技签署战略合作 MOU，以金刚石钻针为合作切入点，奥杰超快激光钻孔机专为 M9 级高速覆铜板及 1.6T 光模块 PCB 精密制造需求打造；M9 方案添加 10% 左右 BCB 碳氢树脂可显著改性电性能，玻纤布可从 Q 布调整成二代布，成本下降约 20%。\u003c/li>\n\u003cli>光通信方面，硅光子技术在 800G/1.6T/3.2T 光收发器中的占比将分别达到 60%/80%/100%；预计 2026 年 800G/1.6T 出货量为 340 万/260 万台，2027 年将增至 450 万/460 万台；OCS 需求进入增长速度陡增阶段，谷歌需求预计从 2025 年的 12—15 千个单位增长到 2027 年的 35—40 千个单位。\u003c/li>\n\u003cli>机器人方面，特斯拉近几个月将 Optimus 人形机器人的产量提高了大约十倍，但公司仍在努力实现大规模可靠生产，生产线面临机器人复杂手部、自动化设备和供应商限制等问题。\u003c/li>\n\u003cli>国庆中秋交通数据：9 月 26 日全社会跨区域人员流动量实际 19,946.2 万人次，较 2024 年中秋假期第 2 日增长 3.4%；假期前两日累计 44,166.0 万人次，较 2024 年同期增长 8.0%。\u003c/li>\n\u003cli>双 11 美妆淘天活动策略：资源前置强化预售，中后程现货与分层专场承接增长；时间预计共 30 天，较去年缩短 1 天；美妆 10 月 15 日为核心预售节点，23 日主打中高客单美妆及奢品，25 日为 88VIP 专场。\u003c/li>\n\u003cli>东吴电新十月锂电行业排产更新：电池 214.60GWh，环增 3.82%；电池 1 为 115.8GWh，环增 2.30%；电池 2 为 41.5GWh，环增 5.33%；电池 3 为 16.05GWh，环增 5.94%；电池 4 为 1.90GWh，环增 2.70%；电池 5 为 19.95GWh，环增 3.37%。\u003c/li>\n\u003cli>Northern Star 拒绝 Gold Fields 收购要约，若合并成功将成为全球第二大金矿公司；Gold Fields 提出约 390 亿澳元（270 亿美元）收购要约，其中约 73% 对价拟以新发行 Gold Fields 股票支付。\u003c/li>\n\u003cli>东山精密据称目标在香港上市筹资至多 30 亿美元。\u003c/li>\n\u003cli>优利德 67G 矢量网络分析仪整机研发完成，已有样机，现阶段主要针对软件优化、产品稳定性等方面做收尾工作；VNA 团队是国内最早研发网分的团队之一，98 年推出第一款 VNA，团队负责人已有超 30 年 VNA 研发经验。\u003c/li>\n\u003cli>慧博今天调整，主要系资金层面问题，有观点持续看好国产算力大周期，持续推荐慧博云通。\u003c/li>\n\u003cli>建投食饮周观点：中秋白酒旺季呈现结构性分化，高端韧性突出，次高端承压；飞天茅台礼赠需求支撑价盘，i 茅台投放平抑炒作。\u003c/li>\n\u003cli>高盛美国科技硬件前瞻及行业网络模型更新：650 Group 大幅上修展望，预计 2030 年 AI 以太网数据中心交换支出将达约 1,000 亿美元，2025—2030 年复合年增长率高达 65%，需求增长覆盖所有客户垂直领域。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>光模块法案 S.5548 后续影响验证：是否仅针对国家安全系统采购、未对商业数据中心与 AI 基础设施实施全面禁令；假期前光网络下跌是否提供长期买入机会。\u003c/li>\n\u003cli>CPO/OCS/ECOC 大会后续需求验证：硅光子渗透率、800G/1.6T 出货量、OCS 谷歌需求从 2025 年 12—15 千个单位到 2027 年 35—40 千个单位的兑现；行业需求环境强劲，光模块相关潜在市场规模随业务扩张持续增长，供给约束问题是否已得到缓解。\u003c/li>\n\u003cli>长鑫后道测试设备投资落地与国产测试设备订单：联讯仪器作为国内存储测试机龙头能否充分受益，中科飞测等国产量检测卡位公司进展。\u003c/li>\n\u003cli>兆易创新与长鑫关联交易、DRAM
