也会削弱 OpenAI 的定价参照。 DealBook 报道称，OpenAI 拟把先筹资高约 300 亿美元，报道中 MGX、SoftBank 出资细节受到质疑，不能当作最终承诺。 Sarah Friar 的融资完成提到持续约 1.25 亿美元获得融资，并否认削减融资规模的说法，强调优质项目仍能获得资本；这与媒体报道存在冲突，本期没有最终交易金额，也没有消除争议的新收入或利润率披露。 对 AI 基建而言，融资初衷有助于降低客户付款风险；但同时压低未来资本开支，设备商订单又可能承压，资金安全改善与供应扩张未必同步发生。 分歧与判断 分歧与判断：不能机械地对 OpenAI 套一个固定折价；客户结构、收入模式、资金覆盖期和算力需求都不同。 分歧与判断：不能机械地对 OpenAI 套一个固定折价；客户结构、收入模式、资金覆盖期和算力需求都不同。 04 | 微软不再续租 Oracle 算力：需求见顶，还是旧硬件换代？ Bloomberg 报道微软逐步结束与 Oracle 安排，原因是一 2023 年开始、用于合微软规模。 这不足以推导微软全面退出 Oracle，或终止所有第三方算力采购。 多头认为合同相对小，释放的算力可以重新出租，不能因此保留旧资源？这可能暴露硬件有效寿命和残值风险。 本期反复把芯片型号与 A100、也有人指出，2023 年合同可能涉“已无价值”早成结论。 另一处混淆是 6 月关于合同不续、安全认证和潜在融资认定为同一件事。 对 nvcloud 更有价值的问题是：客户是在升级外租设备，还是客户不续约本身，并不能替代这些答案。 价格不是完全同质的商品：芯片代际、能效、网络和合规都会影响价格。 直接的租赁商也未必获得更高回报。若效率提升的收益被竞争转给客户，供应商也未必获得更高回报。 分歧与判断 价格不是完全同质的商品：芯片代际、能效、网络和合规都会影响价格。 05 | 选举之后，政策交易出现了反向催化 Bloomberg Intelligence 的新估算认为，政治阻力可能约 2027 基线支出上限 1 万亿美元预算，5%-7%，最多约 10GW 容量超过原先上限时间。 这是分析情景，既不是取消清单，也不是已经发生的支出削减。 对交付年份存在明显分歧：一派认为 2027 年多数项目已开工，风险要落在 2028 年；另一派认为融资和电力仍可影响更早交付。 项目状态证明，不能只用“已规划”或“已获批”概括。 Trump 表态改善公共支持预期，但没有代表州和支持建设的实际审批。 约北建设时间 02:59，出现众议院法案可能加速数据中心及电力进程程序，争取年底前通过。被引的 BAA 立法最快下周可能推进。 多头看眼前的立法窗口；反方看民主党可能拖延，以及社区和环保方面的反对。推进表决不等于通过，通过也不等于所有项目立即通电。 分歧与判断 政策就可能推进建设，也可能带来许可提速，不能只按单向坏消息跟踪立法进度，适用范围和具体项目；现阶段还不能把政策改善计入已交付容量。 06 | TSMC 研究先进存储，离改变供需还有多远？ 据 Nvidia 报道转述为，TSMC 正考虑与先进存储芯片，并非商业量产产品 3D DRAM。 偏空解释是：Nvidia 希望扩大供给、降低存储成本，长期可能削弱现有厂商的议价能力。偏多解释是：制造难度高、良率和成本积累深，短期难量产仍需多年。 3D DRAM 被讨论为更远期问题，因此不宜直接冲减近两年利润；但长期存储供需若体现在供给扩张，也要看整体需求增速。 据近期报道说法并不一致：有人报整体 2%–3%，也有人报 DDR5 16GB 仍溢价约 1.5%，不能拼成一条现货价格指数，也缺少统一品类、时间和渠道口径。 分歧与判断 短期订单能见度和长期经济性，也不能互相替代；短期订单能见度和长期经济性，也不能互相替代。 分歧与判断：当期现货和股票反弹分开看。预期变化一天价涨跌，既可能有估值和持仓原因，也可能包含长期供给预期变化。 07 | Bloom 的优势，到底是供应不发货，还是产品更适合？ 约 70MW，Bloom 项目电力方案被重新挖掘：因项目配套铺设与此前 NTT DATA 的 900MW 协议是不同项目、规划容量不等于当期交付或收入，两者也不应直接相加成年内订单兑现。 一派看短期替代：大型项目获取订单、若持续供电则供恢复，这部分优势也可能减弱。 另一派看结构：海外排放许可、更小单元的冗余、故障时损失更少，也可靠性需要比较整个系统，不能只比较单个模块大小，噪声和能效取决于具体配置。 往期，随后被提出作为：周路的 Innio 替代方案，最初提到 2025 年 12–18 个月 CAT、Wartsila 更后。也有开发商反馈无法在 18 个月内拿货。 设备开发成本不低，不等于总成本低。往复式发动机运营用容高， ": "SPCX 有望在 2028 年达到 1 吉瓦的在轨计算能力 目前已制定了热设计方案：芯片运行温度更高，每颗卫星都配备一个 NVL72 机架。SpaceX 已公布 AI1 的峰值功率为 250 kW，平均功率为 175 kW，散热器面积为 160 m²，但未公布其运行温度。根据我们六月份的散热器数据表反推，这意味着散热器表面温度为 65-75℃，芯片结温为 80-90℃。我们的行业调查证实了这一点：太空版芯片的结温为 80-90℃。从工程角度来看，这是可行的，因为地面机架中的芯片在满负荷运行时温度通常高于 80℃，而且温度本身对芯片来说不是问题；真正的限制因素是内存。在轨道上，较高的运行温度对于散热而言意义重大：在真空中，热量只能通过辐射散失，而辐射能力与温度的四次方成正比。如果像地面上那样以 40℃的温度散热，则需要 240-290 平方米的散热器；通过更高的运行温度，一颗 2 吨的卫星可以携带一个 NVL72，一艘星舰可以携带 40 颗卫星，而且不需要在轨组装。 计算有效载荷已确定：太空版的 NVL72，代号 Kessel。今年 8 月，SpaceX 宣布与 NVIDIA 合作设计 AI1 的计算有效载荷，采用 Vera CPU 和 Rubin GPU。太空机架构于 10 月最终确定：它保留了 72 GPU 的 NVLink 架构，将 48U 的地面立式机架压缩到 9U 的扁平机箱中，并将重量减轻到几百公斤。第一代产品专注于推理；大型模型训练仍在地面进行。芯片和 HBM 均为标准部件。辐射问题通过外部屏蔽罩、HBM 内置的 ECC 纠错机制和系统级容错机制解决，散热则通过直接连接到外部散热器的单液冷回路进行，这使得屏蔽罩、散热器和结构部件对先进材料和轻质合金的需求更加集中。 供应链订单已到位：SpaceX 已向一家领先的服务器 ODM（原始设计制造商）订购了 6000 个太空专用机架，用于 2027 年的交付。该 ODM 是 SpaceX 项目中唯一的联合设计制造商 (JDM)。SpaceX 计划于 2027 年 5 月完成新产品导入 (NPI)，以便及时交付测试卫星，并于 12 月完成生产。这 6000 个机架相当于 43.2 万个 GPU，按地面机架价格计算，硬件价值约为 420 亿至 450 亿美元；如果每个卫星配备一个机架，则总容量为 1.05 GW。该计划的生命周期总量为～30000 个机架，与第一阶段的计划相符，即～30000 颗卫星，或～216 万个 GPU，每个机架 72 个，相当于 5.25 GW（峰值 7.5 GW）；前 6000 个机架是其中的五分之一。 地面资源的限制正推动计算向轨道转移。民主党在 11 月 3 日的中期选举中赢得了国会两院的控制权，而即将上任的德克萨斯州州长承诺，在州议会制定相关规则之前，将暂停新建数据中心。地面数据中心在许可、电网连接和成本分摊方面的压力日益增加，而这种影响主要体现在 2028 年之后新增的容量上，届时 Starmind 项目也将扩展规模。轨道计算无需土地、电网连接或水源，也无需州或地方政府的数据中心许可。随着地面容量限制的日益收紧，轨道计算的吸引力也越来越大。 乐观情景：到 2028 年底，在轨计算能力将达到 1 吉瓦。在我们的乐观情景下，星舰在 2028 年有 1220 次发射机会（星基计划扩容至 100 次，加上 LC-39A 发射台的 44 次和 SLC-37 发射台的 76 次），其中 70%（即 154 次）用于发射计算卫星。每次发射 40 颗卫星，足以发射全部 6000 个机架，因此我们预计到 2028 年底，在轨计算能力将达到 1 吉瓦（平均每颗卫星的计算有效载荷功率为 175 千瓦）。 前方还有两个检查点。预计最早也要到 11 月下旬才能进行的第 15 次飞行，将会尝试用发射塔回收火箭的两个级；成功回收并再次飞行，才能确保 2027 年能够进行 30 到 40 次发射。2027 年 5 月由星舰发射的测试卫星将提供首批在轨热数据，并验证每颗卫星 175 千瓦的平均功率是否能在轨道上实现，而这正是我们引力波估算的基础。#文字观点", "publish_time": "2026-11-07 18:30", "tags": ["文字观点"]}, "post:2026-11-07T20-45:fff861fbafa5": {"id": "post:2026-11-07T20-45:fff861fbafa5", "kind": "post", "title": "2026-11-07 20:45", "source_label": "帖子正文", "excerpt": "大模型及落地场景信息速递20261107 • OpenAI 新一轮首期仅到账 1 放出强烈的 “政策底 ”信号；不过投 资者仍在等待流动性和盈利数据确认的持久市场底。当前沪深 300指数动态 市盈率为 11.5倍，较长期中枢低约 0.5个标准差，估值已不再昂贵。与此同 时，我们跟踪的拥挤度（ 图 9）和动量指标（ 图 10）也正逼近底部。但需注 意，沪深 300指数 2026 年3季度的盈利提示：全年每股收益同比增速存在 下行风险，或将从当前约 23%回落至未来几个季度的高个位数至低双位数区 间（图 5），这也限制了动态每股收益的上调空间。因此，我们维持杠铃策 略，一端配置高股息防御标的，另一端是成长标的。股息端，随着大型国有 银行股息率跌破 4%，我们继续筛选基本面稳健（盈利增长稳健、估值合理、 股息率高于 4%）的其他标的，详见 图 2。如果明年追加城投债置换额度， 有望成为部分区域性银行的正面催化剂。成长端，本轮回调后，更多 AI基 础设施细分领域的风险回报比改善： 晶圆制造设备和后道设备现已加入存储、 服务器 /交换机 ODM/OEM 之列，其动态市销率处于历史均值附近，同时增 长前景良好（摩根大通首选：华峰测控、中微公司、北方华创、华勤技术） 。 本报告 图 10-图 11列示了我们筛选出的全部 A股AI基础设施和 CXO/ 创新 药标的清单。 •政策底已经确立。 2026 年11月2日，中国金融监管部门在人民银行同日 召开两场 “稳市”会议：上午，中国人民银行和中国证监会召集部分证券 公司和基金公司，研究推动支持资本市场工具更广泛的使用，直接向股市 注入流动性，以提振信心和预期；随后，中国人民银行会同金融监管总局、 中国证监会召集各大银行开会，研究优化股票回购增持再贷款工具。据报 道，一家国有超大型银行近日计划向中国国新、中国诚通两家央企新增股 票回购增持贷款额度，单家新增额度或可达 1,000 亿元；与此同时，同日 还启动了每日隔夜逆回购操作，并伴随相关利率调整。我们认为，这两场 会议确立了政策底：这些直接针对股市的工具，释放出协同缓冲估值的意 图。尽管如此，持久的市场底需靠实打实的落地以确立，其验证取决于上 述工具能否转化为实际的信贷额度提取、回购执行和持续的股市资金流入。 因此，我们将这套政策组合视为下行支撑，而非估值重估的触发因素：逢 低吸纳；只有当流动性传导效果验证政策底已转化为市场底后，再提升信 心。 •沪深 300的2026 年每股收益面临下调压力；创新驱动的 AI/医疗保健以及 处于上行周期的大宗商品所提供的支撑，可能会被居民消费趋于务实背景 下的消费端所抵消。 截至 10月31日，沪深 300指数 99%市值成分股已披 露2026 年3季度业绩，中芯国际是唯一例外。 2026 年3季度，已披露样 2 中国 市场策略 2026 年11月4日 张晓宁 (86-21) 6106 6328 erin.zhang@jpmorgan.com 本每股销售额（ SPS）同比增长约 5%，每股收益同比下降约 4%，净利润 率同比收缩 91个基点。在有季度一致预期数据的 207只成分股中，超预 期/低于预期的比例为 38%/60% 。分行业看， 2026 年3季度， IT、材料、 医疗保健、房地产和能源对每股收益同比做出正向贡献，但被金融（尤其 是保险）、必需消费、可选消费、工业和公用事业所抵消。能源是唯一超 预期比例超过 50%、且每股销售额与每股收益同比均表现稳健的板块。展 望后市，前三季度已实现每股收益同比增长 7.4% ，而 2026 全年一致预期 为22.7% ，二者之间的缺口对应 4季度每股收益增速需达到约 101% ，实现 难度较大。 我们的敏感性分析 （图 5）显示， 2026 年4季度每股收益同比 增速介于 -10% 至+50% 区间，对应 2026 全年每股收益同比增速在 5%- 14%，处于 2018-25 年历史每股收益增长区间的上限（ 图 16）。随着市场 对12月中上旬中央政治局会议 /中央经济工作会议将宣布更多国内政策支 持的预期升温，年底前市场对沪深 300动态每股收益同比增速的一致预期 可能维持在中高双位数的水平。 我们预计行业层面的分化将持续，创新驱 动、政策支持的 IT和医疗保健将是结构性的每股收益增长驱动力。只要 全球石油供应不出现立即反转，能源也可做出正向贡献。房地产可能继续 沿扭亏为盈的路径推进。消费端若出现实质性好转，将带来上行惊喜。 •近期回调后，更多 A股AI细分领域的估值回到有吸引力的水平。 我们此 前讨论了 地缘政治风险的持续担忧如何抑制了投资者对 A股AI标的的兴 趣，而近期我们交流的投资者又浮现新的担忧：美国超大规模云厂商债务 融资的可持续性、 ARR 增长的下一个驱动力，以及这些因素如何影响 A 股中的 AI全球供应链标的。摩根大通全球 /区域策略师总体上认为这种担 忧过度。摩根大通北美企业信用团队指出，美国科技行业投资级、高收益 债信用利差走阔，已导致公开市场发债节奏显著放缓，而股权发行增加可 能是更持久、更真实的趋势。摩根大通亚洲股票策略团队指出，超大规模 云厂商层面的投资回报率在 30%以上，资金约束可以克服，当前 AI资本 开支的增长势头能够延续。我们重申，未来一两个季度，这仍是围绕 A 股AI基础设施代理标的风险回报比的问题。可以说，在 中国政府规定的 投资目标 支持下，本土 AI供应链的订单储备 /收入增长的可见度更强。结 合最新估值和增长状况，我们继续看好 存储 ，以及 服务器 /交换机 ODM/OEM （摩根大通首选：华勤技术）；同时 晶圆制造设备和后道设备 的动态市销率也接近均值水平，并得到 摩根大通中国科技团队 近期供应链 调研的支撑： AI相关组件测试时间延长、存储资本开支高于预期、先进逻 辑国产化推动中国半导体设备行业需求增长加速（摩根大通首选股：华峰 测控、中微公司、北方华创）。 •居民消费趋于务实：能省则省，钱花在刀刃上。 居民部门继续降杠杆。据 我们估算，截至 2026 年3季度末居民债务 /可支配收入比约 129% ，居民债 务/GDP 比为 56.4% ，均略高于 2019 年的水平。在此背景下，更多居民持 续削减 “炫耀”型可选消费，转而优先将钱花在对自身重要的商品和服务 上，即那些 “用起来很好 ”，而非 “别人看起来很好 ”的物品。 摩根大通 中国消费团队 也认为，尽管短期整体消费趋势低迷，但体验驱动型增长中 蕴藏阿尔法机会。能够提供独特的情感共鸣型消费体验的消费板块和业内 公司，可进一步扩大消费者心智份额，且估值获得支撑。目前 A股消费板 NBkYnXwW8WmMnPaQdNaQtRoOpNtNfQpOmNiNrRmR6MrQsPMYsPyRuOpNnN 3 中国 市场策略 2026 年11月4日 张晓宁 (86-21) 6106 6328 erin.zhang@jpmorgan.com 块内，中大盘旅游 /酒店 /健康生活方式类代理标的的供给有限。摩根大通 中国消费团队还看好 海澜之家 。摩根大通的姚倩指出， 3季度主品牌海澜 之家保持稳健增长，运动服饰业务维持两位数的强劲增长，而奥莱业务正 在进行运营调整。她持续看好海澜之家，原因在于： 1）高性价比主品牌 的韧性表现； 2）新业务发展稳健：运动服饰是逐渐被验证的成长型业务， 利润持续改善，奥莱拓店有望重新加速，推出小型门店并进行海外扩张。 •境内客户针对后续政策支持的问询升温，集中在三个方向。 10月底我们在 北京和上海路演期间，被问的最多的问题之一是：如果出口增长在高基数 与贸易摩擦压力下增速放缓，后续是否会出台需求侧刺激政策。具体来说 ，客户问询主要集中在三个方面： 1）房贷利率补贴能否进一步扩围，覆 盖更多购房者？ 2）是否会出台力度更大的生育 /育儿补贴 /税收优惠？ 3） 城投债置换方案能否获得追加资金，以帮助缓解金融抑制？ 12月中上旬中 央政治局会议 /中央经济工作会议之后，情况可能会更加明朗。我们认为中 大盘地产龙头、童装（摩根大通首选： 森马服饰 ）和区域性银行（摩根大 通首选： 渝农商行 ）最有可能受益于此类政策预期。 •2026 年3季度 A股出口商表现强劲但分化明显，定价权和汇率是核心变量 。海外收入占比高于 50%的沪深 300指数成分股当季表现强于平均水平， 每股销售额增长约 78%，每股收益增长 27%，但净利润率收缩 368个基点 。CXO 龙头药明康德 表现领跑出口商，且没有地缘政治隐患，展示出真正 的定价权：毛利率 54.2% ，订单储备增长 36%至767亿元，净利润增长 61%。相比之下，汽车整车厂商的增长动力虽然主要来自海外，却面临未 来贸易局势紧张的风险。例如，比亚迪三季度业绩强劲，利润增长 28%， 海外销量增长 92%至134万辆，但其股价似乎受制于近期的中欧协议，即 自2027 年起削减中国插混车对欧出口配额，首年为 35万辆，第二年起每 年上调 6%，为期四年。对那些已经面临海外扩张限制的企业而言，盈利 增速的影响已然显现： 赛轮轮胎 三季度利润下降 47%，反映出反倾销关税 和汇率影响； 南山铝业 受到关税豁免取消、 232条款关税冲击，利润下降 10.6% 。人民币升值同样挤压定价权偏弱出口企业的利润， 三一重工 、徐 工机械 、杰瑞股份 、中联重科 和华友钴业 等企业均报告汇兑损失即为佐证。 •我们重申对沪深 300指数的积极看法 ，基于一致预期未来 12个月每股收 益同比增长 19%。国内银行间流动性依然充裕，但市场层面指标持续在低 位波动， “国家队 ”注资的信号有限。全球流动性收紧周期，似乎进一步 压制了沪深 300未来 12个月市盈率； CME FedWatch 预计到 2026 年底 /27 年还将加息 1次/3次。在此环境下，我们维持杠铃配置策略，成长端配置 AI基础设施和 CXO/ 创新药等增长主题；另一端配置高股息标的。中国政 策制定者平衡股票发行和回购的举措，也有望在未来几个季度为高股东回 报主题提供支撑。相对于 MSCI 中国指数，我们更加看好沪深 300指数， 原因是后者的 AI基础设施敞口更高，且国家队资金提供了下行缓冲的期 权价值。 4 中国 市场策略 2026 年11月4日 张晓宁 (86-21) 6106 6328 erin.zhang@jpmorgan.com 图 1：14日相对强弱指数（ RSI）\u003c20的A股AI基础设施标的筛选 股票代码 公司名称 细分领域 14日RSI 688012.SH 中微公司 晶圆制造设备 14.3 688037.SH 芯原微 晶圆制造设备 19.1 688200.SH 华峰测控 后道设备 19.4 688702.SH 盛科通信 连接芯片 19.0 301165.SZ 锐捷网络 服务器 /交换机 ODM/OEM 19.0 300502.SZ 新易盛 光器件 19.4 688498.SH 源杰科技 光器件 16.8 300870.SZ 欧陆通 电源（服务器） 15.8 资料来源：万得（ 2026年10月30日） 图 2：自由流通市值超过 100亿元、连续三个季度盈利增长， 2026/2027 年预期每股收益正增长， 市净率 \u003c3倍，滚动 12个月自由现金流为正，股息率高于 4%的A股标的筛选 股票代码 公司名称 自由流通市值（十亿元） 最近季度市净率（ x） 滚动 12个月股息率（ x） 600153.SH 建发股份 13 0.6 8.3 601838.SH 成都银行 43 0.9 7.1 002807.SZ 江阴银行 11 0.6 6.9 002532.SZ 天山铝业 35 1.7 5.4 002558.SZ 巨人网络 22 2.3 5.2 000807.SZ 云铝股份 51 2.1 5.0 601600.SH 中国铝业 65 1.7 4.9 300628.SZ 亿联网络 17 5.0 4.9 000333.SZ 美的集团 421 3.1 4.7 600036.SH 招商银行 533 1.0 4.6 601577.SH 长沙银行 23 0.5 4.5 600919.SH 江苏银行 193 0.8 4.4 600926.SH 杭州银行 84 0.9 4.3 605117.SH 德业股份 34 7.8 4.3 600000.SH 浦发银行 120 0.4 4.2 601998.SH 中信银行 46 0.7 4.0 600901.SH 江苏金租 17 1.6 4.0 资料来源：万得（ 2026年10月30日） 特此鸣谢香港摩根大通证券（亚太）有限公司的刘颖、香港摩根大通证券（亚太）有限公司 /J.P. Morgan Broking (Hong Kong) Limited 的 黄天和 J.P. Morgan Securities Singapore Private Limited 的Rajiv Batra 对本报告的编制提供帮助。 dPLMJEjrzhnW0zlQYQA0HVwboyI796fk0QkRQ/081eFtgLvg8pNaHzjM/6VZBZvB 5 中国 市场策略 2026 年11月4日 张晓宁 (86-21) 6106 6328 erin.zhang@jpmorgan.com 主要图表 图 3：2021年以来 A股ETF累计资金流入 资料来源：万得（ 2026年10月30日）图 4：按指数划分的 A股ETF资金流向 资金流入 （十亿元）2023年12月18日- 2024年2月9日 2024 年2月19日- 2026年1月9日 3Q26 10月 沪深 300 254.3 356.7 35.9 155.5 上证 50+A50 35.1 30.0 1.1 15.8 A500 0.0 204.9 39.4 29.1 中证 500 32.5 31.6 17.3 10.4 中证 1000 29.8 58.0 19.3 15.7 中证 2000 6.2 -5.4 3.7 1.5 创业板指 24.6 -15.1 43.5 58.1 科创板 9.4 -71.0 76.6 53.7 红利指数 12.2 60.5 -17.3 7.7 消费指数 -2.4 33.0 -2.1 1.1 半导体指数 -0.4 -25.4 132.1 -0.1 IT硬件指数 0.0 0.7 29.8 -3.0 其他 -0.9 184.2 91.4 33.2 合计 400.3 842.6 4 润增长 137% ），中航 光电 3季度收入增长 48%/ 利润增长 172% ，确认补库周期开启；海康威视 3季 度利润增长 37%，验证安防龙头盈利复苏。 石油、煤炭和石化 2026 年3季度，能源是沪深 300中唯一超预期比例超过 50%，且每股销售额 / 每股收益同比均为正的板块。在油价中枢持续高企的背景下，上游石油巨头均 实现两位数的利润增长：中石油前三季度净利润增长 21.9% （3季度增长 21.6% ，创同期新高），中石化前三季度净利润增长 30.0% ，3季度加速至 57.2% （炼油利润率回升、化工亏损收窄），中海油前三季度增长 16.8% （净 10 中国 市场策略 2026 年11月4日 张晓宁 (86-21) 6106 6328 erin.zhang@jpmorgan.com 产量 593.7 百万桶油当量），尽管 3季度增速因油价环比走弱收敛至 2.7% 。煤 炭龙头走势趋同：中国神华的煤电路港一体化模式平滑煤价波动，前三季度净 利润增长 3.8% ，高股息防御属性凸显；陕西煤业盈利质量板块最佳，量价齐 升推动毛利增加 106亿元（净利润增加 34.2% ）；兖矿能源利润弹性最大， 3 季度净利润增长 73.3% （煤价反弹叠加煤化工协同）。中煤能源一体化布局的 对冲效果，使其利润基本持平（ +2.1% ）。要点：在整体净利润率普遍收缩的 季度，能源是最明显的具备防御性 /盈利为正的板块，上游勘探开发和动力煤 是板块内最清晰的阿尔法来源。 非能源大宗商品 2026 年3季度材料的积极贡献高度集中于四条同步变动的金属线上：伦敦金属 交易所铜价创历史新高，电解铝价格中枢在产能触顶背景下上移，稀土价格在 配额制度下反弹，钨精矿及 PCB 微钻 AI需求驱动特种金属公司业绩提升 —— 1-9月紫金矿业净利润增长 51.9% ，洛阳钼业增长 68.2% ，江铜集团增长 94.0% ，铜陵有色增长 184.8% （3季度单季增长 516.8% ），云南铝业增长 164.0% ， 中铝集团创纪录增长 64.8% ，北方稀土增长 136.6% （3季度增长 161.1% ），中 钨高新增长 227.9% 。化工企业在 2025 年低基数的基础上大幅回升：万华化学 的MDI 价差扩大，驱动 1-9月净利润增长 71.0% （已超过 2025 年全年水平） 、荣盛石化增长 802% 、恒力石化增长 104% 、卫星化学增长 141% 、宝丰能源 增长 60%。但消极方面的分歧信号同样明显：钢铁面临 “强供应弱需求 ”的形 势，宝钢 3季度扣非净利润下降 40.5% ；水泥需求疲软，海螺水泥 3季度净利 润下降 88.9% ；黄金股呈现出反直觉的 “高金价、低股价 ”模式—— 3季度金 价回调叠加刚性成本，导致山东黄金自上市以来首次出现季度亏损（ 3季度亏 损3.63亿元人民币）。要点：大宗商品贝塔系数主要由铜 /铝/稀土 /钨驱动；黄 金、钢铁和水泥是材料板块中的负异常值。 金融 银行业 1-9月表现出 “收入普遍上升、净息差企稳 ”的模式：六大行合计将收 入增速拉高至 7-12% ，净息差同比上升 1-4个基点，存款成本下降抵消了贷款 重定价压力；但股份制银行的表现严重分化 ——中国光大银行和华夏银行的净 利润下降逾 18-24% ，原因是投资收益下滑 /资产质量拨备。城商行普遍超越股 份制银行：宁波银行、江苏银行、南京银行实现收入两位数增长，而上海银行 的季度投资收益大跌，拖累利润下滑 24%。保险业是本季度最大的拖累：五大 险企的净利润合计同比下降约 35%，主要是由于 3季度股市调整导致公允价值 损失扩大；但负债端新业务价值仍保持正增长（中国人寿增长 13.1% ，处于领 先地位），营业利润保持稳定。 1-9月券商的累计增速较高，但 3季度分化明 显——中信证券和华泰证券的 3季度收入 /净利润同比负增长（自营投资收入下 降），而中金公司和招商证券凭借投行 /做市业务逆势增长。 公用事业 2026 年3季度公用事业板块普遍承压。水电受干旱影响：长江电力 3季度收入 下降 13.5%/ 净利润下降 23.4% ，原因是发电量受抑，但股息逻辑仍未改变；华 能水电和国投电力表现不一 ——华能水电 3季度净利润增长 8.4% ，原因是超 出预期的高电价抵消了枯水期来水的影响，而国投电力 3季度发电量增长 11 中国 市场策略 2026 年11月4日 张晓宁 (86-21) 6106 6328 erin.zhang@jpmorgan.com 14.6% ，但利润下降 6.9% ，原因是雅砻江水文条件和电价下降。火电表现最差 ：华能国际 3季度净利润下降 77.8% （仅 12亿元人民币），国电电力下降 69.3% ，华电国际下降 68.3% ，浙能电力转亏 ——全部受制于上网电价下降以 及刚性燃料成本，煤电盈利能力大幅收窄。核电是少数几个积极贡献因素之一 ：中国核电 3季度净利润增长 3.8% ，其中核电发电量增长 8%，中广核电力增 长15%，原因是容量和利用率均有提升。新能源运营商发电量增长（三峡能源 增长 9.3% ），但利润下降 57.9% ，原因是电价下降以及减值拖累利润 ——呈现 出“量增利跌 ”的模式。要点：核电是唯一实现正面盈利的细分板块；水电依 赖于天气条件，火电表现较差。 房地产与建筑 建筑行业国企的订单基本稳定，但收入确认和利润率持续走低。中国建筑 3季 度收入下降 20.0%/ 净利润下降 26.7% ，尽管 1-9月新签合同基本持平（下降 0.1% ），海外新签合同增长 66.9% ；中国中铁 3季度净利润下降 33.5% ；中国 铁建 3季度净利润下降 84.0% （仅 6.58亿元人民币），业内表现最差，因受到 资产减值和项目结算时点的影响；中国交建毛利率下降 1.1个百分点至 9.9% ； 中国电建 3季度净利润下降 59.2% 。但两家公司是例外，即中国化学（唯一正 增长者，净利润增长 4.3% ，得益于化工 EPC和海外订单）和中国中冶（ 3季 度收入下降 21.2% ，但净利润增长 29.9% ，原因在于低基数和结算时点）。房 地产销售依然承压： 1-9月万科亏损 239亿元人民币，但 3季度亏损收窄 44% （合同销售额同比下降 48.2% ）；保利发展 3季度实现盈利（ 1-9月销售额 1,812 亿元人民币，下降 10.2% ，优于行业整体）；招商蛇口 3季度净利润下降 92.8% ，结转毛利率下降 2.5个百分点。要点：尽管订单稳定，但建筑业仍处 于利润率和收入确认下行通道；房地产市场正在磨底，头部公司的亏损正在收 窄，但需求尚未迎来拐点。 消费 2026 年3季度消费需求普遍疲软，内部分化明显。白酒的深度调整依然明显： 贵州茅台是第一个恢复季度收入正增长的公司，增速达 3.0% （净利润增长 3.8% ），也是唯一一个实现季度正增长的高端白酒公司；相对之下，五粮液 3 季度收入下降 37.7%/ 净利润下降 48.3% ，泸州老窖分别下降 37.1%/57.0% ，山 西汾酒分别下降 18.1%/34.5% ，洋河股份录得季度亏损（亏损 7.71亿元人民币 ，收入下降 61.1% ）——受价格压力和渠道库存高企的影响，中高端及区域性 企业普遍下降一半。今世缘是难得的亮点（收入增长 15.5% ）。食品 /饮料疲软 ：伊利 3季度净利润下降 5.6% ，海天味业下降 15.4% ，原因是餐饮复苏乏力， 东鹏饮料增速放缓至 +0.8% 。受农业下行周期拖累，牧原股份录得季度亏损 32.4亿元人民币（虽然 9月养殖成本跌破 11.5元人民币 /公斤），温氏股份 1-9 月亏损 49.6亿元人民币。家电行业急剧分化： 3季度美的逆势上扬，实现净利 润增长 25.9% ，原因是出口结构优化、对冲收益和毛利率提升；格力下降 43.3% ，海尔下降 12.3% ，原因是内需疲软和以旧换新的效应减弱。中国中免 收入下降 4.7% ，但得益于采购成本和费用管控，净利润回升 24.6% 。要点：日 常消费仍处于去库存阶段；美的和贵州茅台是两个防御性标的；猪周期和中高 端白酒是两个表现较差的板块。 12 中国 市场策略 2026 年11月4日 张晓宁 (86-21) 6106 6328 erin.zhang@jpmorgan.com 媒体 /互联网 在媒体 /互联网板块，广告板块表现疲软（分众传媒下滑 9%）；游戏板块出现 分化——巨人网络凭借一款爆款游戏实现利润翻倍，世纪华通稳步增长；而影 视/长视频板块承压严重（光线传媒前三季度利润暴跌 98%，芒果超媒前三季 度利润下滑 95%）。结论： AI硬件是 3季度唯一的高景气主题；传统手机产 业链及消费类广告仍处于去库存 /复苏乏力阶段。 医疗保健 医疗保健是沪深 300本季度唯一实现正盈利贡献的板块，但板块内部创新药 /CXO 出海标的与集采承压 /传统标的之间严重分化。 CXO 和创新药龙头领涨： 药明康德 3季度收入增长 38.0%/ 净利润增长 136.7% ，在手订单创历史新高， 达到 767亿元，因 TIDES 爬坡及 CXO 业务复苏，上调财年收入指引至 619亿 元；恒瑞医药 3季度净利润增长 88.9% ，随着产品管线进入集中兑现期，创新 药收入占比升至 64.6% ；联影医疗前 3季度海外收入增长 50.3% ，兑现了高端 影像设备出海逻辑。分销和设备类标的保持稳健：上海医药 3季度净利润增长 57.2% ，得益于投资收益及效率提升；迈瑞医疗业绩持 x ）均实现增长，且 2026 年下半年 iPhone 产品结构较 2025 年下 半年改善（ Pro/Max 机型占比更高）。立讯精密在高端机型上的业务敞 口较高，将从中受益。因此，合资企业收入（主要来自 iPhone 组装业 务） 2026 年3季度实现 31%的同比增长，且利润率提升。 •通信 /汽车电子业务强劲增长，交付提速。 在消费电子业务稳步增长的 同时，立讯精密的通信和汽车电子业务正步入更强劲的扩张期。我们 看到通信业务取得令人鼓舞的进展，并预计得益于铜互连和缆线背板 批量交付、以及光模块通过客户验证后进入量产，强劲增长将延续。 与此同时，公司正利用莱尼的全球平台加速汽车电子业务的海外扩张 ，而对京西国际的收购则拓宽了其智能底盘产品组合。对高利润率项 目以及运营效率的重视应能支撑利润率改善。总体而言，我们预计到 2028 年，汽车电子 /通信业务将贡献超 60%的毛利。 •市场担忧已反映在股价中；给予 “增持”评级。 受人民币升值影响， 立讯精密的毛利受到约 50亿元的负面冲击，在 2026 年前 3季度录得 29亿元的汇兑损失。因此， 2026 年3季度 52亿元的净利润较指引区 间下限低了 3%。不过，公司仍预计 2026 年4季度盈利增长提速，同 比增幅达 19-35% 。当前估值对应 12倍的 2027 年预期市盈率，较 A股 同业以及公司自身历史均值分别折让 24%和38%——我们认为利空因 素已被消化。我们将 2026- 28 年盈利预测下调 4-8% ，以反映价格压力 及汇率不利因素；预测 2027/28 年盈利同比增长 42%/32% 。将截至 2027 年6月的目标价下调至 88元，基于 21倍的 12个月动态市盈率（ 此前为 22倍；这是考虑到宏观不确定性）；维持 “增持 ”评级。 2 中国 证券研究 2026 年11月3日 冯令天 (86-21) 6106 6359 billy.feng@jpmorgan.com 股价表现 年内迄今 1个月 3个月 12个月 绝对 -19.9% -8.0% -15.4% -27.8% 相对 -10.8% -2.0% -10.1% -18.5% 公司数据 已发行股票数（百万） 7,738 52周股价区间（元） 81.78-43.56 总市值（百万美元） 52,912 汇率 6.65 自由流通股比例 61.6% 三个月日均成交量（百万） 97.76 三个月日均成交额（百万美元） 780.0 波动性（ 90天） 56 指数 SHASHR 彭博 买入 |持有 |卖出 25|1|0 重要指标（财年 12月份结束） 单位：百万元，每股数据单位：元 FY25A FY26E FY27E FY28E 财务预测 收入 332,344 406,198 486,771 574,322 调整后的息税折旧摊销前利润 43,836 31,684 41,205 52,024 调整后的息税前利润 13,142 16,972 24,024 34,079 调整后的净利润 16,600 19,574 27,734 36,508 调整后的每股收益 2.28 2.53 3.58 4.72 彭博一致预期每股收益 2.35 2.69 3.75 4.96 经营活动现金流 17,325 60,531 47,087 57,116 公司自由现金流 (579) 41,819 30,677 40,618 利润率和增长率 收入增长率 23.6% 22.2% 19.8% 18.0% 息税折旧摊销前利润率 13.2% 7.8% 8.5% 9.1% 息税折旧摊销前利润增长率 88.8% (27.7%) 30.1% 26.3% 息税前利润率 4.0% 4.2% 4.9% 5.9% 净利润率 5.0% 4.8% 5.7% 6.4% 调整后的每股收益增长率 23.4% 11.0% 41.7% 31.6% 财务比率 调整后的有效税率 7.1% 11.5% 11.8% 11.8% 利息覆盖倍数 57.1 76.9 107.9 1,415.9 净债务 /净资产 0.3 0.1 0.0 NM 净债务 /息税折旧摊销前利润 0.8 0.6 0.0 NM 已动用资本回报率 7.8% 6.8% 7.9% 10.2% 净资产收益率 21.5% 18.9% 20.8% 23.0% 估值 公司自由现金流收益率 (0.2%) 11.9% 8.7% 11.5% 股息率 1.0% 1.0% 1.5% 2.2% 企业价值 /收入 1.2 1.0 0.8 0.6 企业价值倍数 9.3 12.5 9.2 6.8 调整后的市盈率 19.9 18.0 12.7 9.6 投资理据和估值概要 我们预期 iPhone 组装业务将继续推动立讯精密的增长， 原因是市场份额持续 关注的配置方向并未因此逆转，但短期风险扩大，入场节奏需要更加审慎。标普500及纳指100分别下跌4.36%及6.36%，费城半导体指数下跌约12%。市场担忧数据中心审批及监管趋严，拖慢AI建设进度，卖压由芯片蔓延至数据中心、电力设备及大型科技股。目前市场主要交易政策与资本开支预期变化，不宜将相关政策倡议等同于已实施的全国性限制措施。不过，在此前较高的增长预期下，建设节奏的不确定性已足以触发估值及仓位调整。 避险资产提供了部分缓冲。美市尾盘，2年期及10年期美债收益率分别回落至约4.47%及4.84%，现货黄金上涨约0.7%，美元兑日元回落至157.6附近。信用市场虽出现压力，苹果75亿美元债券发行仍吸引约310亿美元订单，显示优质发行人仍有资金承接。情绪方面，VIX单日上涨近70%至28.18，避险需求明显升温。资金层面，外资机构数据显示，CTA的美国股票仓位已降至3月底以来低位，但低仓位不等于卖压耗尽，若跌势延续，仍需关注趋势信号转弱带来的进一步减仓或增空压力。 短期重点关注今晚非农、政策沟通及美债收益率。市场预期10月非农新增约6.5万人、失业率维持4.2%。若就业温和增长、薪资压力不过热，或有助缓和加息担忧；若数据明显走弱，则需警惕衰退忧虑抵消利率下行的估值支持。同时，数据中心及电力审批指引能否更清晰、信用条件能否稳定，也将影响反弹的持续性。 配置上，国产替代、现金流稳健的平台型科技公司及非美资产，仍是我们关注的方向，但在外围波动的情况下，现阶段应优先控制仓位，降低杠杆及AI硬件链集中度；防御端以现金及短久期高质量债券为主，黄金与日元适度分散。后续重点观察VIX回落、半导体不再创新低、市场宽度改善，以及信用利差趋稳，待企稳信号相互印证后再分批布局，不急于抢第一轮反弹。#文字观点", "publish_time": "2026-11-07 10:10", "tags": ["文字观点"]}, "attachment:files/中信建投-医疗器械与服务行业：季度业绩持续改善，板块性机会逐渐显现-261105.pdf": {"id": "attachment:files/中信建投-医疗器械与服务行业：季度业绩持续改善，板块性机会逐渐显现-261105.pdf", "kind": "attachment", "title": "中信建投-医疗器械与服务行业：季度业绩持续改善，板块性机会逐渐显现-261105", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业深度·2027年投资策略报告 季度业绩 持续改善， 板块性 机会逐渐显现 核心观点 Q3多家公司业绩超预期，器械板块业绩拐点已现 ，看好2027 年投资机会，建议加配 医疗器械板块。短期来看，业绩改善个股 存在业绩估值修复机会。长期来看，器械投资机会来自创新、出 海和并购整合，板块创新性和国际化能力得到认可、估值正在被 重塑。医疗服务： 中长期来看我国医疗服务渗透率仍有提升空间， 长期看好差异化定位的连锁医疗服务公司和区域医疗服务龙头。 摘要 医疗器械：器械板块业绩拐点已现，看好 2027年投资机会 Q3多家公司业绩超预期、 27年有望业绩改善，板块效应将 逐步体现。受耗材集采、医疗合规要求提升等因素影响， A股申 万医疗器械指数2021-2024年持续下跌，2025年先涨后跌，2026 年初反弹后回落。随着政策影响逐步出清，企业战略调整后业绩 逐步复苏，器械板块正在迎来估值、业绩双修复。 Q3联影医疗、 惠泰医疗、新产业、微电生理等多家公司 Q3收入或利润超预期， 重点关注2027年业绩增长及持续改善的公司，未来有望实现业 绩估值双击。 预计多个高值耗材和 IVD板块的集采及降价政策影 响将于年底或明年初逐步出清，板块性投资机会 逐步凸显。 长期看好创新和国际化投资机会 ：长期来看，医疗器械投资 机会来自创新、出海和并购整合，板块的创新性和国际化能力得 到认可、估值正在被重塑 。医疗器械板块具有全球竞争力的改进 式创新、突破式创新的产品正在被逐步认可，也有一批公司积极 战略拓展第二增长曲线、实现海外业务高增长，估值迎来上涨。 1）创新： 研发投入与技术创新是公司实现国产替代和国际化 的前提，依托中国的工程师红利、产业链等优势，医疗器械产品 实现改进式创新较为容易，有较多的 me-too和me-better。中国部 分医疗器械创新产品从跟随模仿到领跑全球，正在国际上逐步崭 露头角；创新药板块大涨之后，医疗器械板块具有全球竞争力的 改进式创新、突破式创新的产品正在被逐步认可，也有一批公司 积极战略拓展第二增长曲线、实现海外业务高增长，估值迎来上 涨。美股多家器械公司上市以来实现了 10倍或100倍的增长， 未来中国也将出现实现数倍增长的全球化企业。 维持 强于大市 袁清慧 SAC:S1440520030001 SFC:BPW879 王在存 SAC:S1440521070003 SFC:BVA292 朱红亮 SAC:S1440521080001 李虹达 SAC:S1440521100006 SFC:BUT196 朱琪璋 SAC :S1440522070002 刘慧彬 SAC:S1440523050001 SFC: BXF087 郑涛 SAC:S1440524060004 吴严 SAC:S1440524060003 喻胜锋 SAC:S1440524110002 华冉 SAC:S1440525100002 贺菊颖 SAC:S1440517050001 SFC:ASZ591 发布日期： 2026年11月05日 医疗器械与服务 下载日志已记录，仅供内部参考 行业深度报告 医药生物 请务必阅读正文之后的免责条款和声明。 2）出海：未来医疗器械板块中越来越多的投资机会来自国际化，越来越多中国医疗器械的改进式或突破式 创新登上国际舞台；国际业务空间更为广阔，多家器械公司 26H1海外业务高增长、国际业务占比将超过国内， 国际业务长期空间大的公司也有望迎来估值重塑。中国器械公司在全球的成长空间非常广阔，随着股东结构中 的国际投资人占比提升，估值有望向美股创新器械公司靠拢。 3）并购：并购是全球医疗器械龙头重要成长路径，未来我们将见证越来越多的行业并购。 医疗服务：中长期来看我国医疗服务渗透率仍有提升空间，长期看好差异化定位的连锁医疗服务公司和区 域医疗服务龙头。医改政策对医院的影响与 DRG、集采、医疗服务价格调整等多重因素有关，随着政策方向逐 步清晰和逐步落地，技术实力强、管理精细的民营医院 龙头有望于2027年实现业绩企稳或修复。 消费医疗服务：2027年建议关注眼科等医疗服务需求端的回暖。随着 DRG/DIP3.0政策实施，白内障、基 础眼病等业务的医保政策负面影响有望逐步减弱，屈光等消费医疗需求端有望逐步回暖。 严肃医疗服务：2027年预计部分行业龙头公司呈现温和复苏的趋势，收入增长仍需依靠诊疗量提升、新院 区爬坡、新业务拓展。 DRG/DIP 3.0原则上于2027年3月底前落地，分组进一步细化，对疑难重症及部分创新 技术的支付支持更加精准，有望改善相关病例的成本补偿；但病组规则的调整也可能使部分 病例的支付水平承 压，切换初期仍需关注医院适应情况。 风险提示：行业竞争激烈程度强于预期； 行业政策风险；研发不及预期风险；审批不及预期风险；宏观环 境波动风险；中东地缘政治风险。 下载日志已记录，仅供内部参考 1 请务必阅读正文之后的免责条款和声明。 行业深度报告 医药生物 目录 医疗器械：短期关注业绩修复节奏，长期看好创新、出海、并购 ................................ ............................ 2 整体观点：器械板块业绩拐点已现，看好 2027年投资机会，建议加配 ................................ ............ 2 细分领域观点：各板块业绩节奏有所差异，有望陆续迎来业绩拐点 ................................ ................. 8 创新：从跟随到并跑，从改进式创新到突破式创新 ................................ ................................ ........ 19 国际化：汇率变化对业绩带来短期扰动，国产器械公司加速全球化布局 ................................ ........ 36 并购：医疗器械龙头重要成长路径，国内公司通过并购拓展产品线和渠道 ................................ ..... 42 医疗服务：短期政策影响边际趋稳，看好眼科医疗服务需求回暖 ................................ .......................... 47 风险分析 ................................ .. 的时间，对短期市场 招投标活动带来一定影响，市场需求暂时积压。 3）2024Q4-2025Q4：2024年设备以旧换新项目开始逐步落地， 叠加此前积压的需求逐步释放， 24Q4开始行业采购需求持续显著改善。 4）26Q1-Q3：26H1招标数据有所下滑， 主要受到招采节奏、设备以旧换新项目落地节奏、 25H1基数较高等因素的影响；在设备更新项目加速落地的驱 动下，26Q3行业招采需求显著改善。 展望Q4和明年：行业招标景气度需根据政策来判断，同时关注各地设备集采进展。 今年1-5月份医疗设 备行业多个品类招标数据下滑， 6-9月份好转， 预计与医疗设备更新政策在各地逐步落地有关； 展望 Q4和明年， 行业招标景气度跟新一轮设备更新政策支持力度、设备集采趋势等政策相关，若行业招标数据持续好转，建议 关注Q4和明年医疗设备企业业绩好转的可能性，同时医疗设备集采或迎来加速，建议关注不同品类、不同公司 受集采影响的趋势。尽管行业招标景气度存在波动、医疗设备集采对不同企业的量价影响存在不确定性，但高 端设备、内镜等领域高景气持续，看好有新品放量或出海高增长的公司。看好迈瑞医疗的年度改善趋势、联影 医疗的海外高增长趋势、开立医疗和澳华内镜等公司的低位布局机会。 下载日志已记录，仅供内部参考 9 请务必阅读正文之后的免责条款和声明。 行业深度报告 医药生物 图2：国内磁共振月度招标数据（亿元、 %） 图3：国内CT月度招标数据（亿元、 %） 数据来源：众成医械，中信建投证券 数据来源：众成医械，中信建投证券 图4：国内超声月度招标数据（亿元、 %） 图5：国内内窥镜月度招标数据（亿元、 %） 数据来源：众成医械，中信建投证券 数据来源：众成医械，中信建投证券 -100%-50%0%50%100%150%200%250% - 5.00 10.00 15.00 20.00 25.00 30.00 35.00 MR-金额MR-增速-50%0%50%100%150%200%250% 0.05.010.015.020.025.030.035.040.0 25-01 25-02 25-03 25-04 25-05 25-06 25-07 25-08 25-09 25-10 25-11 25-12 26-01 26-02 26-03 26-04 26-05 26-06 26-07 26-08 26-09 CT-金额CT-增速 -100%-50%0%50%100%150% 0.05.010.015.020.025.030.035.0 超声-金额超声-增速-50%0%50%100%150% 0.05.010.015.020.025.030.035.0 25-0125-0225-0325-0425-0525-0625-0725-08 25-0925-1025-1125-12 26-0126-0226-0326-04 26-0526-0626-0726-0826-09 内窥镜-金额内窥镜-增速 下载日志已记录，仅供内部参考 10 请务必阅读正文之后的免责条款和声明。 行业深度报告 医药生物 图6：迈瑞医疗国内月度招标数据（亿元、 %） 图7：联影医疗国内月度招标数据（亿元、 %） 数据来源：众成医械，中信建投证券 数据来源：众成医械，中信建投证券 图8：开立医疗国内月度招标数据（亿元、 %） 图9：澳华内镜国内月度招标数据（亿元、 %） 数据来源：众成医械，中信建投证券 数据来源：众成医械，中信建投证券 设备集采：Q4和明年集采范围预计进一步扩大，继续看好创新和出海趋势 展望Q4和明年，设备集采范围预计进一步扩大。 2026年7月14日，卫健委等三部门联合发布《关于进一 步做好公立医疗卫生机构医用设备集中采购工作的通知》，要求各省 2026年底前需完成一轮乙类大型医用设备 集中采购，2027年6月底前各省至少确定 1个市地开展医用设备集中采购试点并完成一轮集中采购工作。 此后， 多个省市响应卫健委号召，逐步推进省级设备集采， 截至2026年9月底，黑龙江、陕西、湖南、山东、辽宁、 内蒙古、重庆、天津、山西等省/市卫健委陆续推出集采相关方案 或发布集采设备目录或开展集采前市场调研 。 设备集采此前已在部分地区实施，继续看好创新和出海趋势。 1）设备集采此前已有预期，如福建、安徽等 地以及多个市县曾开展设备集采； 2）大型设备集中采购的政策目标及采购方式与药品及耗材集采存在明显差异， 以往来看部分企业受益 于集采，关注部分赛道及企业国产化率、 市占率、量价趋势；3）并未唯低价论：坚持优-50%0%50%100%150%200%250% - 5.00 10.00 15.00 20.00 25.00 迈瑞医疗-金额迈瑞医疗-增速-50%0%50%100%150%200% 之后的免责条款和声明。分析师：马鲲鹏 makunpeng@csc.com.cn SAC 编号： S1440521060001 SFC 中央编号：BIZ759分析师：李晨 lichenbj@csc.com.cn SAC 编号： S1440521060002 SFC 中央编号：BSJ178分析师：王欣宇 wangxinyu@csc.com.cn SAC 编号： S1440525070014 仅供内部参考，请勿外传 三季报综述：营收利润小幅提速，主动出清夯实拨备 •核心观点：9M26上市银行营收大个位数增长、利润小个位数增长，增速较上半年均有所提升。信贷规模稳健扩张，资产端收益率降幅趋缓，叠加负 债成本持续优化，净息差边际企稳，净利息收入保持较快增长。中收仍有一定压力，其他非息收入改善支撑营收。资产质量整体稳定，但部分区域 性银行不良生成压力有所上升，零售、小微及对公房地产等重点领域风险仍需关注。展望全年，预计上市银行营收保持较好增长，利润维持小个位 数稳定增长。目前银行板块以对冲市场为主，建议选择兼顾基本面优异且保持行业领先、股息率扎实的标的。 •9M26上市银行营收保持大个位数增长，息差边际企稳，净利息收入稳健增长，中收承压，其他非息增速回升但银行间仍有分化： 9M26上市银行营 业收入同比增长7.79%，增速较1H26提升0.4pct，其中国有行、股份行、城商行、农商行分别同比增长 9.44%、3.72%、8.82%、3.16%。具体来看，净 利息收入同比增长8.34%，增速较1H26持平，主要受益于规模稳健扩张，以及负债成本持续压降推动息差边际企稳。中收同比下降 2.0%，预计主要 是结算清算、信用卡等手续费收入仍有压力。上市银行核心营收同比增长 6.8%，较1H26下降0.4pct，其中国有行、股份行、城商行、农商行分别同 比增长7.6%、2.9%、12.0%、6.7%。其他非息同比增长 13.6%，较1H26提升4.8pct，主要受益于债券公允价值变动损益改善及去年同期低基数效应。 其中，国有行保持20%以上增长，股份行增速由负转正，城农商行降幅有所收窄，银行间表现仍有分化。 •9M26利润同比小个位数增长，营收明显回暖的背景下，部分银行开始主动出清不良、增厚拨备安全垫。 9M26上市银行归母净利润同比增长 3.78%， 增速较1H26提升0.8pct。其中国有行、城商行、农商行同比增长 6.14%、4.48%、3.85%，股份行则同比降低 2.8%，相对承压。国有行、农商行利润增 速较1H26分别提升1.74pct、0.01pct，股份行、城商行较 1H26降低0.24pct、2.76pct。业绩归因来看，成本收入比下降、其他非息也分别正向贡献净利 润3.1%、2.0%。负向贡献因子来看，拨备多提、息差收窄仍是主要拖累项，分别负向贡献利润增速 4.3%、3.1%，息差收窄拖累影响在逐步减弱，前 三季度拨备多提明显延缓了利润释放。预计是在营收趋势向好的情况下，部分银行在风险相关政策尚未退坡前主动确认出清不良、计提拨备。 •扩表速度小幅放缓，对公信贷仍是主要投向，零售需求偏弱： 3Q26上市银行总资产同比增长 7.6%，较2Q26下降0.2pct；贷款同比增长6.3%，较2Q26 下降0.2pct。信贷增量主要由对公贷款贡献，涉政、大基建及“金融五篇大文章”等领域仍是主要投向。部分优质区域性银行信贷增长较快，但行业 整体有效信贷需求仍有待改善。零售贷款需求持续偏弱，三季度票据融资对信贷投放形成一定补充。 •存款增速小幅回升，定期化趋势延续，存款占负债比重下降： 3Q26上市银行存款同比增长 6.5%，较2Q26提升0.3pct，其中国有行、股份行、城商行、 农商行分别同比增长6.3%、6.0%、10.0%、5.7%。上市银行存款占总负债比重较 1H26下降0.4pct至70.6%，广义同业负债占比基本持平。存款结构方 面，定期存款占比较2Q26提升0.8pct至59.0%，定期化趋势仍在延续，负债结构优化仍需时间。 •资产端收益率降幅趋缓，负债成本持续改善，净息差边际企稳： 3Q26上市银行净息差（测算值）季度环比小幅上升 1bp至1.51%，其中国有行、股份 行、城商行、农商行净息差季度环比分别上升 2bps、持平、上升1bp、上升2bps，至1.35%、1.55%、1.53%、1.54%。3Q26上市银行资产收益率（测算 值）环比2Q26下降2bps至2.51%，今年以来LPR持续按兵不动，另一方面，监管端“反内卷”等缓解银行资产端竞争压力的导向明确，目前贷款利率 继续大幅下行的空间已经相对有限。 3Q26上市银行负债成本环比 2Q26下降2bps至1.31%，受益于定期存款逐步到期重定价和银行自主的存款结构优 化，负债成本大幅压降，有力托底息差。 仅供内部参考，请勿外传 投资建议 •中收仍有压力，其他非息增速回升，银行间表现分化： 9M26上市银行非息收入同比增长 6.4%，较1H26提升1.2pct，其中净手续费收入同比下降 2.0%， 其他非息收入同比增长 13.6%，较1H26提升4.8pct。资本市场保持活跃，部分银行财富管理业务表现较好，但结算清算、银行卡等手续费收入仍有压 力。其他非息方面，三季度债券利率下行，公允价值损益改善，助力其他非息收入增速回升。分板块来看，国有行其他非息保持较快增长，股份行 增速由负转正，城农商行降幅有所收窄，银行间仍存在一定分化。 •资产质量整体稳定，不良生成压力有所分化，拨备计提力度加大： 3Q26上市银行不良率为1.22%，整体保持稳定；拨备覆盖率约 229%，风险抵补能 力仍较充足。9M26上市银行信用成本（年化）为 0.77%，同比上升9bps，拨备计提力度有所加大。分板块来看，国有行不良率整体稳定，不良生成 率维持在50–70bps的较低水平；部分股份行及城农商行不良生成压力有所上升，其中上海银行、兰州银行不良生成率相对较高，部分农商行不良生 成率边际抬升。重点领域方面，对公贷款资产质量整体较好，房地产风险持续出清，零售、小微贷款风险仍在暴露。部分银行在营收改善的背景下 加大风险出清及拨备计提力度，短期拖累利润释放，但有利于夯实资产质量。预计后续资产质量整体保持稳定，重点领域风险改善仍需等待经济基 本面进一步修复。 •规模保持大个位数稳健增长，息差同比降幅收窄、环比逐步企稳，中收趋势回暖，营收延续较好增长态势；信用成本有所抬升，利润保持小个位数 稳定增长。1）规模方面，有效信贷需求尚未明显修复，预计全年信贷增量同比基本持平或略有多增，涉政领域及“金融五篇大文章”等对公贷款 仍是主要投向。2）息差方面，2026年以来LPR持续按兵不动，叠加监管端“反内卷”导向明确，资产端收益率降幅逐步收窄；同时，随着高成本定 期存款陆续到期重定价，负债成本持续压降，预计息差同比降幅收窄、环比逐步企稳。 3）中收方面，货币政策保持宽松，资本市场活跃有望带动 财富管理等相关手续费收入持续回暖，中收增速有望进一步改善。 4）其他非息方面，债市维持低位震荡，随着去年同期高基数效应逐步消退，其 他非息收入压力有所缓解，预计全年对营收增长的影响相对有限，但银行间分化及收入波动仍较明显。 5）资产质量方面，预计不良率、拨备覆盖 率维持合理稳定区间，对公房地产风险持续出清，零售、小微信贷风险仍在暴露。部分核心营收趋势向好、利润释放空间较大的银行，或将利用 “金融十六条”等风险缓释政策尚未退出的窗口期，加快不良确认与处置、加大拨备计提力度，推动风险尽早出清。 •投资建议：银行板块目前以对冲市场为主，防御、避险属性较强，以底线思维、高置信度、高胜率为核心诉求的配置型需求仍是主力。经济预期未 见向上拐点前，板块内部难以全面切换至顺周期品种。板块内部或根据短期基本面及股息率比价频繁轮动，建议兼顾基本面优异且保持行业领先、 股息率扎实的标的。具体标的来看，海外银行板块继续重点推荐港股国际大行：渣打集团、汇丰控股。内资银行板块上，重点推荐： 1）无再融资 摊薄风险、股息率较高且扎实的标的，如招商银行、沪农商行等。 2）国有大行H股、A股。3）再融资摊薄风险有限，能够通过利润释放迅速回补， 且自身具备一定顺周期属性的攻守兼备品种：如南京银行、成都银行、江苏银行等。 4）继续关注顺周期基本面优质个股。如：宁波银行、常熟银 行等。 仅供内部参考，请勿外传 目录 •一、盈利综述：营收、利润增速提升，净利息收入保持较好增 长 •二、规模 •三、价格 •四、非息收入 •五、资产质量 •六、行业观点 4 仅供内部参考，请勿外传 1.1 9M26银行业营收、利润增速较上半年有所提升 5•9M26上市银行营业收入同比增长 7.79%，营收增速较1H26提升0.4pct。其中国有行、股份行、城商行、农商行分别同比增 长9.44%、3.72%、8.82%、3.16%。国有行、股份行、城商行、农商行营业收入增速较 1H26分别上升0.06pct、0.93pct、 0.72pct、1.14pct。 •9M26上市银行归母净利润同比增长 3.78%，增速较1H26提升0.8pct。其中国有行、城商行、农商行同比增长 6.14%、 4.48%、3.85%，股份行则同比降低 2.8%。国有行、农商行利润增速较 1H26分别提升1.74pct、0.01pct，股份行、城商行较 1H26降低0.24pct、2.76pct。整体来看，9M26业绩表现有所分化，其中股份行利润有所承压，国有行、城商行和农商行表 现相对较优。 资料来源：公司财报，中信建投 图表1：营收同比：国 t": "锂电池材料价格周报https://share.note.youdao.com/ynoteshare/index.htm...#笔记链接", "content": "锂电池材料价格周报https://share.note.youdao.com/ynoteshare/index.htm...#笔记链接", "publish_time": "2026-11-07 18:26", "tags": ["笔记链接"]}, "post:2026-11-07T18-32:52d6f33a4031": {"id": "post:2026-11-07T18-32:52d6f33a4031", "kind": "post", "title": "2026-11-07 18:32", "source_label": "帖子正文", "excerpt": "本周工作：洁净室、钢结构专家交流，中材国际、隧道股份、凯伦股份、兔宝宝、伟星新材、亚厦股份、上海建工、三棵树、四川路桥、苏交科、华新建材、中国交建、中国巨石、科顺股份等公司交流。【财通建筑建材】建材周观点1107：美中选利好成本/出海/新能源主线，布局中长期底部的传统品种核心观点：本周沪深300涨1", "content": "本周工作：洁净室、钢结构专家交流，中材国际、隧道股份、凯伦股份、兔宝宝、伟星新材、亚厦股份、上海建工、三棵树、四川路桥、苏交科、华新建材、中国交建、中国巨石、科顺股份等公司交流。【财通建筑建材】建材周观点1107：美中选利好成本/出海/新能源主线，布局中长期底部的传统品种核心观点：本周沪深300涨1.73%，申万建材涨3.62%，传统建材表现较好，而受美国民主党中期选举大胜影响，市场对AI资本开支放缓担心加剧，导致科技相关品种周内大幅波动。我们认为美中选主要利好三方面建材：1）受益于油价及相关产品价格下行品种。今年以来消费建材成本压力显著，但防水等行业还是体现了较好的顺价能力，建议关注防水、涂料龙头；2）出海品种。若油价回落带动通胀回落，美联储加息预期或边际缓和，使得新兴市场资本开支的资金成本压力减轻，此前市场已担心高利率下海外固投高增的持续性；3）新能源相关品种，民主党更加支持新能源建设，光伏玻璃等品种存在主题性催化。综合而言，我们认为传统的消费建材品种本身已处于底部市值，具备中长期的布局价值，成本缓和有望形成股价催化。而玻璃、水泥等龙头品种从重置成本、股息率的角度出发也具备足够安全边际。当前无论从市场风偏、中期赔率、持仓拥挤度等角度看，传统龙头均值得重视。后续若科技β企稳，电子布板块或有较好的反弹机会，千亿附近的中国巨石，即使从反弹角度看，赔率也不错。建材行业跟踪：10 月建材板块各细分企业发货与经营表现分化明显。防水板块节奏不一，前期涨价预期带动的前置备货，使得头部企业卷材端需求有所回落，防水涂料、砂粉品类韧性相对更强；其余防水企业整体需求平稳，小幅正增为主。涂料企业受益于去年同期低基数叠加下游四季度备货，出货表现亮眼。玻璃板块，龙头浮法产销表现好于光伏，行业整体价格偏弱，库存压力仍存，环比去库力度有限。板材企业基础板材需求偏弱，但定制订单需求向好，收入端仍承压。塑料管道企业需求整体平稳，有小幅改善。玻纤赛道结构性特征突出，粗纱价格平稳，部分海外导向的制品企业虽尝试提价，但海外客户接受度不足，发货表现平淡；电子纱、电子布景气持续上行，板块整体库存仍在抬升。水泥价格环比有所修复，同比依旧承压，库容比环比回落，库存出现去化迹象。整体来看，建材下游需求尚未出现全面回暖，板块内部分化加剧，玻纤电子产业链景气突出，地产后周期细分订单端已有边际积极信号。本周推荐组合：东方雨虹，兔宝宝，北新建材，旗滨集团，海螺水泥，中国巨石#文字观点", "publish_time": "2026-11-07 18:32", "tags": ["文字观点"]}, "post:2026-11-07T11-33:44131081b555": {"id": "post:2026-11-07T11-33:44131081b555", "kind": "post", "title": "2026-11-07 11:33", "source_label": "帖子正文", "excerpt": "这是界面新闻（财联社）今天发布的新闻 早在10月13号，尊界就启动了召回方案： “问题源于一级供应商某汽车零部件厂商的压铸工艺缺陷，涉事批次的刹车踏板支架在铸造过程中存在内部气孔隐患，在长期受力下可能出现疲劳断裂，问题涉及2026年9月1日至9月28日生产的共3217辆尊界V800车型。” 启动召回", "content": "这是界面新闻（财联社）今天发布的新闻 早在10月13号，尊界就启动了召回方案： “ 具体包括 DSP、 mSAP 和 MLCC 三种关键元器件的短缺。此外，硅光技术的良率未达理想⽔平，也对出货量造成了⼀定影响。 Q02基于第三季度的表现，能否回顾⼀下 2026 年前两个季度的出货数据，并提供第四季度（10 ⽉⾄ 12 ⽉） 800G 和 1.6T 光模块的出货量预期？ 2026 年第⼀季度（1 ⽉⾄ 3 ⽉）， 800G 光模块的出货量为 130 多万只。第⼆季度（4 ⽉⾄ 6 ⽉）， 800G 出货量增⻓ ⾄接近 170 万⾄ 180 万只，同期的 1.6T 出货量仅为⼗⼏万只，数量⾮常少。展望第四季度（10 ⽉⾄ 12 ⽉），预计 800G 的出货量将接近 300 万只，⽽ 1.6T 的出货量预计将达到 70 万⾄ 80 万只，平均每⽉出货约⼆⼗⼏万只。 Q03如何看待 2027 年 1.6T 光模块的整体市场规模？公司在⼿订单情况如何，以及当前出货量预测与早 期规划存在差异的主要原因是什么？ 预计 2027 年整个 1.6T 光模块市场的出货量不会特别巨⼤，估计在 4,000 万⾄ 5,000 万只的范围内，公司的市场份 额⼤约在 10%⾄ 20%之间。尽管⽬前在⼿订单显⽰出强劲的需求，但实际出货量受限于多个因素。当前预测低于早 期规划（如 700 万⾄ 800 万只）的主要原因在于供应链的持续瓶颈，特别是 DSP、 mSAP 和 MLCC 的短缺，以及 产品良率爬升的不确定性。出货量会根据这些变量动态调整，例如，若下⼀季度良率实现突破，出货量便可能增加。 Q042027 年 1.6T 市场是否会受到 DSP 供应的显著影响？Marvell 和 Broadcom 等主要供应商的 3nm DSP 产能情况如何，以及这对光模块⼚商的出货能⼒构成了怎样的限制？ 预计 2027 年 Marvell 和 Broadcom 的 3nm DSP 产能都将⾮常紧张，台积电的产能可能⽆法满⾜需求。根据市场 信息， Broadcom 计划向新易盛供应约 2000 万颗 1.6T DSP，向旭创供应 1,000 多万颗；同时， Marvell 也计划向 旭创供应 1,000 多万颗，接近 2000 万颗。这意味着旭创总共能获得约 3,000 万⾄ 3,500 万颗 1.6T DSP。考虑到良 率损耗，最终能实现的出货量会打折扣。因此，市场实际出货量不会像预期的那样达到 1 亿只或更多。1.6T 光模块受限于 DSP、 mSAP 及 MLCC 供应瓶颈， 2027 年全球出货预期下修 2027 年 800G 需求依然强劲，全球规模看 8,000-9,000 万只；公司策略：在 1.6T 缺料时增加 800G 出货以稳业 绩，并突破阿⾥、字节等国内客⼾ 3nm DSP 产能极度紧张，预计 2027 年 Broadcom 与 Marvell 向头部模块⼚合计供应有限，成为限制 1.6T 放量的 核⼼变量 技术路径演进： 1.6T 硅光 FR 产品预计 2027 年 Q1 放量并冲击 200G EML 价格； 3.2T 时代 EML 仍为⾸选，异质 集成受限于良率短期难产 1 / 4 Q05鉴于光模块⾏业持续⾯临供应链瓶颈，这些挑战的具体表现是什么？这是否为规模较⼩的 DSP 公司 （如 MaxLinear、 Credo）带来了发展机会？ 供应链问题体现在不同阶段⾯临不同的物料短缺。例如， 2026 年第⼀、⼆季度主要短缺 VCSEL，第三季度则⾯临 DSP 和 mSAP 的短缺，近期瓶颈则转向 mSAP 和 MLCC。虽然有消息称 MLCC 短缺问题可能在 2027 年第⼀季度 得到解决，但 DSP 的紧张状况预计仍将持续。这种供应格局确实为 MaxLinear、 Credo 等规模较⼩的 DSP 公司创 造了利好，但其能否抓住机遇，关键在于他们是否具备 1.6T DSP 的研发和量产能⼒。⽬前这些公司的主⼒产品仍集 中在 800G 领域。 Q062027 年 800G 光模块市场的需求前景如何？公司在该市场的定位和策略是怎样的？ 2027 年 800G 光模块市场需求依然旺盛。预计仅中国国内市场就有 2000 万只的需求，这将推动全球 800G 市场规模 达到⾄少 8,000 万⾄ 9,000 万只。公司也计划向国内主要客⼾如阿⾥、字节、腾讯等出货 800G 产品，以实现市场 突破。在 1.6T 光模块因缺料或良率问题导致出货受阻时，公司会策略性地增加 800G 产品的出货量，以确保整体业 绩的稳定。 Q07当前 800G 和 1.6T 光模块的价格分别是多少？ ⽬前 800G 光模块的价格， FR 版本⼤约在 423 美元，基于硅光技术的低功耗版本价格在 312 ⾄ 320 美元之间，⽽ 基于 EML 的版本价格则在 350 ⾄ 600 美元的范围内。对于 1.6T 光模块， FR 版本的价格仍在 1,000 美元以上， DR 版本的价格约为 900 美元，预计下⼀轮价格将降⾄ 850 美元。 Q08EML、 CW 等激光器的当前价格⾏情以及 Coherent 在 CW 激光器⽅⾯的布局和出货计划是怎样的？ 在激光器价格⽅⾯， 70mW 的 CW 激光器价格约为 3.5 美元， 100mW 的约为 5 美元。预计下⼀波价格调整后， 70mW 的可能降⾄ 3 到 3.2 美元， 100mW 的则可能降⾄ 4.5 美元左右。 Coherent 本⾝不⽣产 70mW 和 100mW 的 CW 激光器，其货源主要来⾃向仕佳光⼦、源杰、永⿍和古河的采购。 Coherent ⽬前正⾃主研发 400mW 的⾼ 功率 CW 激光器，计划于 2027 年 Q1 开始出货，并于 Q2 实现⼤规模量产，届时⾼功率 CW 激光器的⽉产能预计⾄ 少将达到 150 ⾄ 160 万。 Q09100G 和 200G DML 及 EML 激光器的当前价格、 Coherent 的产能规划与外购策略是怎样的？ 100G DML 的价格在 6.5 ⾄ 7 美元之间。 200G DML 的价格根据不同规格有所差异， DR 版本在 12 ⾄ 17 美元之 间，取⼀个较合理的价格约为 15 美元，⽽ LR 版本的价格则在 22 美元以上。 Coherent 的 EML 产能约为 4,800 万 只，其中 80%为 100G， 20%为 200G。公司计划在 2027 年将总产能翻倍⾄ 1 亿只，届时 200G 的产能占⽐将提升 ⾄ 50%⾄ 54%，其余为 100G。尽管⽬标是在 2026 年 Q4 实现产能翻倍，但考虑到 6 英⼨产线的进展，实现该⽬标 的难度较⼤。在供应链⽅⾯， Coherent ⽬前约有 50%的 EML 芯⽚需要外购，其中 100G EML 的供应商包括索尔 思，⽽ 100G 和 200G EML 均有向 Lumentum 采购。 Q10如何看待未来 EML 激光器的价格⾛势，特别是考虑到 200G EML 的供应情况？ 预计到 2027 年， 100G EML 的价格将进⼀步下探⾄ 6 美元左右。对于 200G EML，尽管⽬前市场供应紧张，但其 价格难以⻓期维持坚挺，预计会有约 15%的合理降幅。近期 Lumentum 虽有涨价意向，但市场已出现应对策略。由 于 200G EML 价格⾼昂，尤其是在 1.6T FR 光模块中成本占⽐较⾼，业界正在积极开发基于硅光技术的 FR 光模块 作为替代⽅案。预计这类硅光产品将在 2027 年 Q1 开始放量，这将对 200G EML 的市场需求和价格构成冲击。 Q11对于 1.6T、 2.4T 及 3.2T 光模块，它们各⾃的产品⽣命周期将如何演进？下⼀代主流速率会是 2.4T 还是 3.2T？ 800G 光模块在北美市场的需求预计将在 2027 年达到顶峰，随后开始下降。 1.6T 光模块从 2026 年、 2027 年才开 始起量，其⽣命周期预计⾄少会持续到 2028 年，甚⾄可能更⻓。⾄于下⼀代速率， 2.4T 预计将在 2028 年下半年开 2 / 4VX£ºWUXL3408 始放量，当年出货量预计在 1,000 万⾄ 1,200 万只之间，但这部分需求主要来⾃⾕歌，其他⼚商⽬前没有明确的 2.4T 部署计划。 Q12⾕歌明年（2027 年）下半年 1.6T 光模块的采购量预计将如何分配给各供应商？ ⾕歌在 2027 年下半年预计将有接近 200 万⽀ 1.6T 光模块的需求。在供应商分配⽅⾯，旭创预计将占据主要份额， 剩余的份额将由 Coherent 和 Lumentum ⽠分，其中 Coherent 的份额可能会略⾼于 Lumentum。⽬前， Coherent 内部已成⽴⼀个 Transmission 事业部，并调动了原相⼲业务部⻔的资源来⽀持其相⼲光（Coherent- lite）产品的开发。 Q13⾕歌⾃⾝在降低成本⽅⾯有何举措？ 为实现成本控制，⾕歌正在⾃主研发 DSP，并与其他公司合作开发 2.4T 光模块所需的其他电芯⽚，以减少对 Marvell 或 Broadcom 等供应商的依赖。这种模式类似于⾕歌与旭创在 FR 光模块上的合作，通过采⽤定制化组件， ⾕歌采购 1.6T FR 光模块的价格相⽐市场价低了⾄少 100 美元。⾕歌正将此模式应⽤于 2.4T 产品，以期在未来节省 更多成本。 Q14除了光模块业务， Coherent 在明年（2027 年）针对数据中⼼市场，其 NPO/CPO 和 OCS 等新产品 的出货节奏是怎样的？ Coherent 在数据中⼼领域的增量主要来⾃ OCS 和 CPO 相关产品。 OCS ⽅⾯，预计在今年（2026 年）第四季度将有⾸批约 100 ⾄ 200 台的出货，单价约为 12 万美元，总⾦额约 2000 多万美元。⾕歌将在 2027 年第⼀季度完成测试，若测试顺利， Coherent 规划明年（2027 年）全年的 OCS 出货量 为 4,000 ⾄ 6,000 台。这部分增量预计将从 2027 年第⼆季度或第三季度开始显现。 CPO 相关产品⽅⾯，主要包括 ELSFP （外置光源）和 DFAU。 ELSFP 预计在 2027 年第⼀季度开始⼩批量出货，数 量为⼏万个。从第⼆季度开始，⽉出货量将增⾄近 20 万个。预计 2027 年全年 ELSFP 的出货量在 250 万⾄ 300 万 ⽀之间。以单价 450 ⾄ 500 美元估算，这部分业务将带来显著增量。此外， DFAU 产品单价约 200 多美元，预计明 年（2027 年）将从第⼆季度开始⼤批量出货。 Q15综合各项业务增⻓， Coherent 明年（2027 年）的整体收⼊预期和季度表现将呈现怎样的趋势？其 DCI 互联业务的增⻓情况如何？ 结合 OCS、 CPO 及光模块业务的增⻓， Coherent 在 2027 年的业绩表现预计将⼗分可观。虽然部分产品（如 1.6T 光模块和 CPO）的放量时间相较于最初预期有所推迟，但整体增⻓趋势明确。在 DCI 互联业务⽅⾯，预计也将实现 稳健增⻓。 Q16请问明年（2027 年）主要的业务增⻓点预计将来⾃哪些领域？ 明年（2027 年）的增⻓主要来源于⼏个⽅⾯。⾸先，相⼲光模块预计将贡献超过 1 亿美元的增⻓。然⽽，真正的核 ⼼增量将集中在 CPO 相关的 ELS、 DFAU 和 OCS 产品，以及 1.6T 光模块。其他业务板块，例如 AO 类产品，增⻓ 不⼤。⾄于⼯业激光业务，明年（2027 年）能维持现有⽔平已属不易。 Q17考虑到 1.6T 光模块等新产品的情况，当前季度的⽑利率⽔平如何？未来⽑利率的⾛势预期是怎样 的？ 当前季度，由于 1.6T 光模块出货量有限，其⽑利率⽔平不⾼，表现中规中矩。要实现 41%或 42%以上的⽑利率⽔ 平，可能还需要⼀到两个季度的时间。 3 / 4 Q18从技术路径来看， 1.6T 光模块倾向于采⽤ CW 激光器⽅案，那么未来更⾼速率的 2.4T 和 3.2T 光模 块将主要采⽤何种激光器⽅案？ 2.4T 速率的需求⽬前主要来⾃⾕歌，因其需要配合⾃家的 TPU 进⾏ OCS 和 3D/6D ⽹络架构。其他 CSP ⼚商预计 不会⼤规模采⽤ 2.4T，⽽是直接转向 3.2T。除英伟达可能在 2028 年部署 3.2T 外，其他 CSP ⼚商的 3.2T 需求预计 要到 2029 年才会出现，这反映了⾕歌和英伟达在技术上领先其他⼚商⼀到两年的普遍规律。从技术实现上看，硅光 ⽅案在不采⽤异质集成的情况下，单通道速率上限约为 200G。对于 1.6T （8x200G）尚可满⾜，但 3.2T 若采⽤ 16 个通道，功耗将难以控制。因此，异质集成（如薄膜铌酸锂）成为⼀个⽅向，但⽬前其良率极低，且成本⾼昂。因 此，当前主流⽅案仍然是磷化铟。在 ECOC 等展会上， Coherent、 Lumentum 等⼚商已推出 400G EML 的 DEMO，尽管配套的电⼝速率尚有差距（200G 或 300G），但在未来的可插拔光模块中， 400G EML 预计将成为主 流⽅案。技术选择的优先级依次为 EML、 CW （200G），最后在没有其他选择时才会考虑薄膜⽅案。 Q19除了可插拔光模块， CPO/NPO 以及⾼功率 CW 激光器等新兴技术⽅案的进展如何？ ⽬前市场上仅观察到⾕歌有 3.2T 可插拔光模块的形态，⽽英伟达尚未展⽰类似产品，其未来可能通过 CPO、 NPO 或 OCS 等⽅案直接集成光互联。尽管如此，当数据中⼼规模扩展到数⼗万张计算卡时，可插拔光模块仍是必需的。 ⼀个显著的新技术趋势是将 WDM 波分复⽤技术应⽤于单根光纤传输，以实现单模化。近期在 ECOC 和 OCP 上已出 现⽤于 CPO/NPO 的⾼功率 CW 激光器，其将⼋个波⻓合为⼀体，这正是为未来的 FR 架构准备的。 Coherent 内部 也在积极布局，包括 400G EML、 PhotonLink 以及这种⼋波⻓波分复⽤的⾼功率 CW 激光器。 Q20对于明年（2027 年） CPO 和 NPO 的市场规模有何预期？CPO 放量将对产业链哪些环节和公司产⽣ 利好？ 预计明年（2027 年） NPO 的量不会很⼤，可能仅在⼀两百万只的规模。相⽐之下， CPO 的增⻓确定性更⾼，将成 为市场主⼒。预计明年（2027 年） CPO 交换机的出货量⾄少为 10 万⾄ 15 万台，后年（2 体，投标人最多参投、中标一个标段。公司动态： 【晶科能源】公司披露担保进展，本次为旗下36家子公司合计提供9.3亿元担保，涵盖供应链金融及综合授信敞口担保。截至披露日，公司合并范围内担保总额388.65亿元，无逾期担保，相关担保在股东会审批额度内，风险整体可控。 【通威股份】公司发布控股股东股份质押公告，本次质押2800万股用于自身经营，截至目前累计质押7.44亿股，占其持股36.56%，占公司总股本16.54%。集团偿债能力良好，质押风险可控，不会变更公司控制权。 【TCL中环】11月6日，公司披露发行股份购买资产暨关联交易停牌进展。公司股票自11月2日起停牌，预计停牌不超10个交易日。目前各方正推进方案协商论证，交易仍存在不确定性，股票将继续停牌。今日行情：上证综指：-1.10%；沪深300：-1.44%；光伏行业指数：+0.85%#文字观点", "publish_time": "2026-11-07 12:04", "tags": ["文字观点"]}, "post:2026-11-07T18-25:be021adebb88": {"id": "post:2026-11-07T18-25:be021adebb88", "kind": "post", "title": "2026-11-07 18:25", "source_label": "帖子正文", "excerpt": "据知情人士透露， 软银集团和 ABB 有限公司正在考虑剥离一项巨型机器人交易中的中国部分，以寻求挽救这笔被北京方面阻挠的交易的方法。", "content": "据知情人士透露， 软银集团和 ABB 有限公司正在考虑剥离一项巨型机器人交易中的中国部分，以寻求挽救这笔被北京方面阻挠的交易的方法。", "publish_time": "2026-11-07 18:25", "tags": []}, "post:2026-11-07T10-21:35d75297f294": {"id": "post:2026-11-07T10-21:35d75297f294", "kind": "post", "title": "2026-11-07 10:21", "source_label": "帖子正文", "excerpt": "关于近期市场几个传言的产业链调研反馈情况： 1. 传闻Me­ta砍单光模块。产业链专家调研到Me­ta由于自身数据中心建设de­l­ay，下修了27年光模块需求，主要涉及索尔思和剑桥科技。", "content": "关于近期市场几个传言的产业链调研反馈情况： 1. 传闻Me­ta砍单光模块。产业链专家调研到Me­ta由于自身数据中心建设de­l­ay，下修了27年光模块需求，主要涉及索尔思和剑桥科技。索尔思离职专家表示，Me­ta26年光模块真实交付在1200万只左右，都是800G；明年真实采购量预计在2000万只出头，800G+1.6T 2.传闻Me­ta砍单amd服务器。台湾产业链调研到的情况：amd专家回复说没有听说Me­ta砍单，供应链专家也回复没听到。 3.传闻谷歌砍单CPU服务器。台湾产业链调研的情况： 谷歌需求无法被供应链满足，谷歌采购专家说没有砍单，主要是上游供应链缺乏物料，现在听到博通的交换机芯片比较缺，原因包括载板比较紧缺，不单是台积电的产能缺#文字观点", "publish_time": "2026-11-07 10:21", "tags": ["文字观点"]}, "post:2026-11-07T10-10:976a40f1f498": {"id": "post:2026-11-07T10-10:976a40f1f498", "kind": "post", "title": "2026-11-07 10:10", "source_label": "帖子正文", "excerpt": "🚀【华创化工&AI新材料】#光智科技：与Coherent签署不低于6.01亿美元磷化铟衬底供货意向协议#事件：11月6日，公司公告控股子公司广东先锐科技与全球光通信龙头Coherent签署长期供货意向协议，拟于2027—2029年向Coherent位于瑞士、瑞典的工厂供应6英寸磷化铟（InP）衬底", "content": "🚀【华创化工&AI新材料】#光智科技：与Coherent签署不低于6.01亿美元磷化铟衬底供货意向协议#事件：11月6日，公司公告控股子公司广东先锐科技与全球光通信龙头Coherent签署长期供货意向协议，拟于2027—2029年向Coherent位于瑞士、瑞典的工厂供应6英寸磷化铟（InP）衬底，预计交易金额不低于6.01亿美元。 🔥 全球龙头客户突破，验证6英寸磷化铟衬底竞争力。Coherent是全球领先的光通信与光电子器件供应商，产品广泛应用于AI数据中心和高速光通信。此次合作意味着光智科技6英寸磷化铟衬底获得国际头部客户认可，有望进一步打开全球客户市场。我们深度研究公司及行业，拥有完善的产业资源，欢迎联系我们交流。 联系人：孙维容/王锐#文字观点", "publish_time": "2026-11-07 10:10", "tags": ["文字观点"]}, "attachment:files/北美光模块厂商调研_ 800G_1.6T光模块季度出货节奏及2027年需求展望261107.pdf": {"id": "attachment:files/北美光模块厂商调研_ 800G_1.6T光模块季度出货节奏及2027年需求展望261107.pdf", "kind": "attachment", "title": "北美光模块厂商调研_ 800G_1.6T光模块季度出货节奏及2027年需求展望261107", "source_label": "其他", "excerpt": "调研纪要 · 光通信 北美光模块⼚商调研 800G/1.6T 光模块季度出货节奏及 2027 年需求展望， 2.4T Coherent Lite 及 NPO 预计 2H27 导⼊， Google 下⼀代光互连需求与供应链份额展望 聚焦：旭创、新易盛、Marvell、Coherent 原⽂ 6 ⻚ 3 个要点 33 组问答整理版 ⼀核⼼要点 ⼆专家问答 Q01", "content": "调研纪要 · 光通信 北美光模块⼚商调研 800G/1.6T 光模块季度出货节奏及 2027 年需求展望， 2.4T Coherent Lite 及 NPO 预计 2H27 导⼊， Google 下⼀代光互连需求与供应链份额展望 聚焦：旭创、新易盛、Marvell、Coherent 原⽂ 6 ⻚ 3 个要点 33 组问答整理版 ⼀核⼼要点 ⼆专家问答 Q01今年（2026 年）下半年 Q3、 Q4， 400G、 800G、 1.6T 光模块的出货节奏是怎样的？ Q3 季度， 400G 光模块每季度出货量基本保持在 12 万只左右，单价约为 150 美元。 800G 光模块 Q3 季度出货量在 55 万只到 60 万只之间，单价约为 400 美元。 1.6T 光模块在 9 ⽉份才开始⼤批量出货， Q3 季度预计出货量在 3 万 只到 5 万只之间，单价约为 850 美元。 Q02Q2 时 800G 出货量是 50 到 55 万只， Q3 是 55 到 60 万只，增⻓约 10%，这个增⻓是符合预期的 吗？还是 800G 的拉货有放缓？ 800G 出货量增⻓约 10%，主要是产能扩张带来的结果，并⾮拉货放缓。每个季度产能⼤约扩张 10%到 15%。 Q2 季 度 1.6T 光模块并未完全开始⼤批量出货，当时每⽉仅进⾏⼩批量试产，实际出货量在 1 万只到 1 万 5 只之间。 9 ⽉ 份才开始⼤批量出货。 Q03现在看 Q4， 1.6T 光模块出货情况会有怎样的增⻓？ Q4 扩产计划是季度产能达到 24 万只，但受 DSP 原材料供应限制，预计 Q4 最多出货 8 万只左右。由于 1.6T 整体出 货计划延迟了⼀个季度，导致今年（2026 年） DSP 锁单没有提前预判推迟，未锁⾜订单。此外，第⼆季度 Marvell 的 DSP 产能出现问题，未能满⾜预期需求。第三、第四季度开始⼤批量出货， Marvell 也⽆法补⾜ Q2 的需求。 Q04DSP 供应商只有 Marvell ⼀家吗？ 是的，只有 Marvell ⼀家。 Q05今年（2026 年）下订单或锁产能后，明年（2027 年） 1.6T 的爬坡还会受 DSP 供应限制吗？ 明年（2027 年）不会受限，因为已提前锁定明年（2027 年）的 DSP 需求，锁单量约为 350 万只。 Q06明年（2027 年）整体需求如何？ 明年（2027 年）产能规划为全年 600 万只，包括 800G 和 1.6T，产能分配暂定为 5 ⽐ 5。若 1.6T 订单增多，可能 会调整 800G 产能分配给 1.6T。800G/1.6T 光模块出货及 2027 年需求展望 Google 光模块供应链及竞争格局 NPO 及 2.4T Coherent Lite 量产时间表与需求预测 1 / 4 Q07明年（2027 年） 800G 和 1.6T 客⼾给的 forecast 有可⻅度吗？800G 和 1.6T 各⾃需求多少？ 明年（2027 年） 800G 需求约为 250 万只， 1.6T 客⼾订单接近 400 万只，但产能预计⽆法扩展到如此规模。 Q08扩产受限主要受限在哪⼀步？ 公司规划不希望在国内扩产过多，所有后⼯序扩产都在泰国，泰国扩产进度较国内慢。今年（2026 年）产能约为 300 万只，明年（2027 年）需翻倍，扩产压⼒较⼤。 Q091.6T 客⼾需求接近 400 万只，这个需求是 Google ⼀家的需求吗？ 是的， 1.6T 客⼾需求接近 400 万只，主要来⾃ Google。 Google 需求量很⼤，但公司产能只能满⾜ 90%以上给 Google，剩余约 10%产能分配给其他客⼾。 Q10Google 明年（2027 年）整体 1.6T 和 800G 需求是多少？ 明年（2027 年） Google 的 1.6T 需求接近 3000 万只， 800G 需求约为 1100 万只。 Q11除了公司之外，其他供应商情况如何？FCC 政策会影响供应商份额吗？ ⽬前 FCC 政策不会影响供应商份额。⼀供、⼆供、三供的份额暂时没有太⼤变化，但整体需求增⻓较快，会有新供 应商进⼊供应链。每家都在扩产，但进度跟不上份额增⻓。 Q12新的供应商是哪家？ 主要是⽴讯。 Q13NPO 现在有什么进展？ NPO 是较为明确的下⼀代产品，预计明年（2027 年）下半年会有 NPO 需求。 Q14⾕歌 NPO 模块是 Lumentum 在帮他们做吗？ 不是。 NPO 的⼀供、⼆供、三供都在研发，需求在明年（2027 年）下半年。 NPO ⽴项在 Q3 季度开始， Coherent 和 Cloudlight 也是 Q3 左右⽴项，旭创相对较早，主要以这三家为主。 Q151.6T DSP 紧缺情况下，明年（2027 年）价格会怎样？ ⽬前 DSP 尚未涨价，虽然物料紧缺，明年（2027 年）预计仍会持续紧缺。国内第⼀梯队光模块⼚已提前锁定⼤部分 份额，暂未收到涨价通知。部分第三、第四梯队的⼩型公司收到 DSP 明年（2027 年）可能涨价或 Q4 拿不到货的通 知。 Q16由于扩产都在泰国，整体扩产进度慢⼀些，这种情况是其他光模块⼚商也会遇到，还是公司⾃⾝扩产 节奏慢？ 公司在海外扩产今年（2026 年）是第⼆年，制造系统逐步完善，进度⽐前⼀两年快，但仍处于磨合阶段。每家公司 都会经历扩产磨合期，旭创、新易盛等在海外已有四五年，扩产进度相对较快。公司预计明年（2027 年）或后年扩 产计划会加快。 Q17⾕歌 Coherent Lite 项⽬相⼲光模块是在公司这边做吗？ Coherent Lite 项⽬也是 Google 的⼀供、⼆供、三供在研发，⽐ NPO 早约两个⽉⽴项。 2.4T Coherent Lite 配套 明年（2027 年）下半年 V9，与 NPO 同步推进。 2 / 4 Q18明年（2027 年） Coherent Lite 出货预期或需求情况如何？ 明年（2027 年）份额暂未确定，整体需求约为 500 万只，主要在明年（2027 年）下半年到 2028 年上半年。 2028 年需求指引接近 2000 万只。 Q19公司产能规划上，明年（2027 年）能满⾜多少相⼲光模块出货？ 明年（2027 年）上半年开始送样，旭创和 Coherent 基本上旭创会最先送样，下半年开始交付。订单主要取决于哪 家公司产品最先通过认证，若三家同时通过认证，⽐例会延续 1.6T 现有分配。 Q20现在⼀供、⼆供、三供的⽐例情况⼤致如何？ ⽬前三家占⽐为 50%、 25%到 30%、 15%到 20%。 Q21相⼲光模块价值⼤致是多少？1500 到 2000 美⾦？ 基本上是 1.6T 的两倍。 Q22它的光电芯⽚供应商⽅案已经确定了吗？光芯⽚包括 DSP，⽤的是什么⽅案？是哪家代⼯？ 因为这是 Google 定制类产品，⽬前光芯⽚没有完全指定，可以⾃⾏选择，但电芯⽚基本全部采⽤ Marvell。 Q23Marvell 提供 DSP、 Driver、 TIA 这套完整⽅案吗？ 是的。 Q24⾕歌投资的 Celero 公司会⾃研 DSP 吗？这两个⽅案有在同步验证吗？ ⽬前公司没有采⽤。现在 DSP 指定为 Marvell，因为电⼝都是单波 300G，也是 Marvell 定制芯⽚。 Q252027 年需求 500 万只， 2028 年 2000 万只，这个需求有上调过吗？还是⼀直是这个⼝径？ ⽬前没有收到上修通知，还是最初的需求。最初得到的通知是明年（2027 年）接近 500 万左右的需求。 Q26按照需求和现在的供货⽐例分配，公司产能会有问题吗？ 从产能来看，明年（2027 年）会单独为这类产品安排产线。如果量产，肯定会单独建产线，但这还没有纳⼊明年 （2027 年）的扩产计划。 Q27建产线周期要多久？要提前多久做？ 建产线主要是针对项⽬采购新设备，或者⽤现有 800G、 1.6T 设备转做 2.4T。有固定⼯⼚，产线调整就是重新采购 或转产。 Q281.6T、 800G 架，计划2027年交付用于太空数据中心；2028乐观情景1220次发射机会中70%（154次）用于发射计算卫星；第15次飞行最早11月下旬，将尝试用发射塔回收火箭两个级。\u003c/li>\n\u003cli>机器人大脑进展：苹果研究团队披露人形机器人自主控制系统HALO，arXiv论文《Perceptive Humanoid Motion from Simulation》，在6个未预先扫描或建图的真实环境中开展360次单项任务测试；AI大模型公司赋能机器人大脑被视为大势所趋，机器人有望是物理AI商业化最大分支。\u003c/li>\n\u003cli>市场与宏观：美股三大指数收盘涨跌不一，道指跌0.46%，纳指涨1.09%，标普500涨0.32%，芯片股反弹推动纳指收涨1%；但宏观观点认为市场关注点从政策制衡带来的宏观利好转向AI基础设施扩张可能面临的政策约束，短期风险扩大；两融余额约2.307万亿元，较前一交易日增约66亿，结束连降、连续两日转正。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线：AI算力/大模型。\u003c/strong> 今天强化的逻辑：OpenAI完成110亿美元融资、估值1.25万亿美元；Anthropic 10月ARR预计82.33B$、环比9月增长7.2%；但微软逐步终止与甲骨文的AI云容量租赁协议，谷歌收购Crusoe位于怀俄明州东南部的数据中心，字节跳动正考虑扩大巴西东北部数据中心项目。今天出现的催化/验证：OpenAI完成融资后预计下周向投资者简报；Anthropic计划下周开始面向潜在投资者正式推介IPO；微软近几个月在拒绝续签合同后逐步关闭从甲骨文租用的计算能力。\u003c/li>\n\u003cli>\u003cstrong>主线：光通信/CPO。\u003c/strong> 今天强化的逻辑：1.6T光模块供应链瓶颈压制预期，CPO与OCS开启第二增长极；光芯片调研显示27年200G EML产能加速扩张但需求缺口仍较大，硅光渗透率预计由26年40%提升至27年60%—70%，大功率CW Laser配套需求快速增长，28年单波400G EML导入及3.2T光模块技术路线受关注；Meta下修27年光模块需求涉及索尔思和剑桥科技，但索尔思离职专家称26年真实交付约1200万只800G，明年预计2000万只出头800G+1.6T。今天出现的催化/验证：光智科技与Coherent签不低于6.01亿美元6英寸InP衬底供货意向协议；ABF载板调研显示27年供需缺口扩大至20%以上；光模块调研显示2.4T Coherent Lite及NPO预计2H27导入，Google下一代光互连需求与供应链份额受关注。\u003c/li>\n\u003cli>\u003cstrong>主线：半导体/先进封装。\u003c/strong> 今天强化的逻辑：包含AI数据中心所用HBM在内的存储芯片需求保持稳健；有转述称台积电正考虑3D DRAM，但并非商业量产产品，设备开发成本不低不等于总成本低；美国政策变化短期很难转化为芯片订单的下滑。今天出现的催化/验证：市场担忧美国中期选举民主党拿下国会参众两院“蓝潮”冲击韩国半导体，AI芯片最大需求来源数据中心建设一旦节奏受限将显著影响芯片市场；英伟达人工智能芯片出口成为民主党国会打击目标；芯片股反弹推动纳指收涨1%。\u003c/li>\n\u003cli>\u003cstrong>主线：宏观/策略。\u003c/strong> 今天强化的逻辑：美股由板块分化转为广泛抛售，市场关注点从政策制衡带来的宏观利好转向AI基础设施扩张可能面临的政策约束，配置方向未逆转但短期风险扩大；市场预期10月非农新增约6.5万人、失业率维持4.2%；华尔街预计美国债务2月达41.1万亿美元上限，财政部最早2月触及借款上限。今天出现的催化/验证：交易员表示美国股市剧烈抛售已将市场恐慌推至极端水平，历史经验预示中期强劲反弹；两融余额2.307万亿增66亿结束连降连续两日转正；创业板指数单只样本最高从20%逐步下调至15%，12月14日落地，前五大权重宁德时代14.46%、中际旭创11.39%、新易盛5.81%、东方财富5.37%、汇川技术2.64%。\u003c/li>\n\u003cli>\u003cstrong>主线：商业航天/卫星。\u003c/strong> 今天强化的逻辑：SpaceX 2028年有望达1吉瓦在轨计算能力，已制定热设计方案，芯片运行温度更高，每颗卫星配备NVL72机架；AI1峰值250kW平均175kW，散热器面积160m²，未公布运行温度；已订购6000个机架计划2027交付专门用于太空数据中心；2028乐观情景1220次发射机会中70%（154次）用于发射计算卫星。今天出现的催化/验证：第15次飞行最早11月下旬，将尝试用发射塔回收火箭两个级；马斯克表示本季度政府机构付款占SpaceX收入不到10%，上一季度16.6%。\u003c/li>\n\u003cli>\u003cstrong>主线：机器人/自动化。\u003c/strong> 今天强化的逻辑：AI大模型公司赋能机器人大脑是大势所趋，机器人有望是物理AI商业化最大分支；苹果研究团队在预印本。今天出现的催化/验证：软银集团和ABB有限公司正在考虑剥离一项巨型机器人交易中的中国部分，以寻求挽救这笔被北京方面阻挠的交易。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>OpenAI完成110亿美元融资，估值1.25万亿美元；首期仅到账110亿美元（原定目标300亿的三分之一），整轮最高200亿；最大出资方换成阿联酋MGX财团，软银与Coatue只洽谈数亿美元量级；预计下周向投资者简报。\u003c/li>\n\u003cli>Anthropic计划11月IPO，以1.25万亿至1.75万亿美元估值筹资800亿至1000亿美元；IPO买家认为估值可能低至1.2万亿美元；10月ARR预计82.33B$，环比9月增长7.2%；计划下周开始面向潜在投资者正式推介。\u003c/li>\n\u003cli>微软正在逐步终止与甲骨文的AI云容量租赁协议，近几个月在拒绝续签合同后逐步关闭从甲骨文租用的计算能力；谷歌收购Crusoe位于怀俄明州东南部的数据中心；字节跳动正考虑扩大巴西东北部数据中心项目。\u003c/li>\n\u003cli>光智科技公告控股子公司广东先锐科技与Coherent签署长期供货意向协议，拟于2027—2029年向Coherent瑞士、瑞典工厂供应6英寸磷化铟衬底，交易金额不低于6.01亿美元。\u003c/li>\n\u003cli>产业链调研反馈：Meta因自身数据中心建设delay下修27年光模块需求，主要涉及索尔思和剑桥科技；索尔思离职专家称Meta 26年光模块真实交付约1200万只，都是800G，明年真实采购量预计2000万只出头，800G+1.6T。\u003c/li>\n\u003cli>苹果研究团队披露机器人“大脑”研究进展，涉及人形机器人自主控制系统HALO；软银集团和ABB有限公司正在考虑剥离一项巨型机器人交易中的中国部分。\u003c/li>\n\u003cli>创业板指数编制调整：单只样本股最高从20%逐步下调到15%，12月14日落地；前五大权重股为宁德时代14.46%、中际旭创11.39%、新易盛5.81%、东方财富5.37%、汇川技术2.64%。\u003c/li>\n\u003cli>两融余额约2.307万亿元（披露至11/5，较前一交易日增约66亿，结束连降、连续两日转正）；两市融资余额22709.77亿元、较上日增66.22亿元。\u003c/li>\n\u003cli>澳门博彩业绩分化：永利澳门3Q26澳门业务营收同比降8.2%至9.2亿美元，经调整物业EBITDAR同比降17.2%至2.55亿美元，低于市场预期；银河娱乐26Q3营收同比+4%/环比+7%至126.9亿港元，经调整EBITDA同比+10%/环比+9%至36.9亿港元，略优于预期，VIP赢率偏高带来约5.8亿港元正向影响。\u003c/li>\n\u003cli>Tapestry集团26Q3收入18.9亿美元，固定汇率同比+12%超预期；调整后EPS 1.82美元，较市场预期1.56美元高16.4%，GAAP每股收益1.76美元同比+38%，全年指引再度上调；海外奢侈品与香化26Q3整体分化，软奢延续二季度放缓，硬奢较软奢坚韧但同样放缓。\u003c/li>\n\u003cli>煤炭：晋陕蒙442家煤矿周度产量2630万吨，同比-3.0%，环比-0.4%；产能利用率79.5%，同比-2.7pct，环比-0.3pct；中国神华大跌6%，板块单日跌幅近4%。\u003c/li>\n\u003cli>建材：全国水泥平均出货率约45%，同比-1.0pct，环比-3.5pct；7628电子布价格14.5-14.8元/米，环比+11%；粗纱价格环比持平，电子布价格上涨。\u003c/li>\n\u003cli>光伏：中广核西藏阿里雪域高原零碳光储热电示范项目5万千瓦光热电站成功并网，为当前全球海拔最高并网光热电站；项目总装机15万千瓦，含10万千瓦光伏、5万千瓦光热，配套大型熔盐电加热装置，可并网、离网双模式运行；尊界V800因一级供应商压铸工艺缺陷召回3217辆（2026年9月1日至9月28日生产）。\u003c/li>\n\u003cli>医药：莫德纳公布两年来首次季度盈利；2026 ESMO中国创新药持续突破，竞争与差异化并存；医疗器械与服务季度业绩持续改善。\u003c/li>\n\u003cli>策略会：参会人数2000～3000，AI分论坛热度最高；固收和资配分论坛谈债券时间上升到30%（前几次10%，都在聊股）。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>OpenAI下周投资者简报及融资到账、整轮最高200亿的后续；Anthropic下周IPO正式推介、估值区间与10月ARR恢复增长持续性。\u003c/li>\n\u003cli>微软终止甲骨文AI云容量租赁的后续范围与节奏；谷歌Crusoe数据中心、字节巴西数据中心项目进展；AI基础设施扩张面临的政策约束。\u003c/li>\n\u003cli>Meta 27年光模块需求下修与26/27年真实交付、采购量的验证；1.6T光模块供应链瓶颈、CPO/OCS第二增长极；2.4T Coherent Lite及NPO 2H27导入；Google下一代光互连需求与供应链份额；ABF载板27年供需缺口扩大至20%以上；光智科技与Coherent协议执行。\u003c/li>\n\u003cli>光芯片：27年200G EML产能加速扩张但需求缺口仍较大，硅光渗透率由26年40%到27年60%—70%，大功率CW Laser配套需求，28年单波400G EML导入及3.2T光模块技术路线。\u003c/li>\n\u003cli>半导体：美国中期选举“蓝潮”对韩国半导体及AI数据中心建设节奏影响；英伟达AI芯片出口政策；台积电3D DRAM考虑与HBM需求。\u003c/li>\n\u003cli>商业航天：星舰第15次飞行最早11月下旬尝试发射塔回收两级；SpaceX 6000个机架2027交付与2028年1吉瓦在轨计算能力；政府机构付款占比变化。\u003c/li>\n\u003cli>机器人：苹果HALO后续测试与商业化；AI大模型赋能机器人大脑；软银和ABB机器人交易中国部分剥离进展。\u003c/li>\n\u003cli>宏观：10月非农数据（预期新增6.5万、失业率4.2%）；美国债务2月达41.1万亿美元上限及财政部借款上限；两融余额连续转正持续性；创业板指数调整12月14日落地。\u003c/li>\n\u003cli>消费/医药：Tapestry全年指引上调后表现；奢侈品软奢放缓与硬奢韧性；莫德纳癌症疫苗商业化；ESMO中国创新药竞争差异化。\u003c/li>\n\u003cli>澳门博彩VIP赢率影响的可持续性；永利澳门低于预期与银河娱乐略优的后续验证。\u003c/li>\n\u003cli>光伏/新能源：中广核项目并网后运行；尊界召回后续；光伏玻璃主题催化；锂电池材料价格周报。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>10:07｜Anthropic IPO 买家认为其估值可能低至 1.2 万亿美元\u003c/li>\n\u003cli>10:07｜【国联民生能源 周泰团队】主产地产量同比下降，周环比下降 截至11月1日当周，晋陕蒙442家煤矿周度产量2630万吨，同比-3.0%，环比-0.4%；产能利用率79.5%，同比-2.7pct，环比-0.3pct。\u003c/li>\n\u003cli>10:07｜Anthropic计划11月IPO，以1.25万亿至1.75万亿美元估值筹资800亿至1000亿美元：FT#文字观点\u003c/li>\n\u003cli>10:07｜华尔街策略师预计，美国财政部最早可能在2月份触及借款上限，这将导致在2027年底面临资金危机之前，需要采取非常规措施。\u003c/li>\n\u003cli>10:07｜Alphabet Inc.旗下的谷歌收购了 Crusoe 位于怀俄明州东南部的数据中心，在 Crusoe 未能锁定客户后，谷歌接手了该项目。\u003c/li>\n\u003cli>10:08｜马斯克表示，本季度来自政府机构的付款将占 SpaceX 收入的不到 10%，而最近一个季度这一比例为 16.6%。\u003c/li>\n\u003cli>10:08
