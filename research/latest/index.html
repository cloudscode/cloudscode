场需求旺盛，上游玻璃布、玻璃纱供应紧张且价格大幅上涨，即日起对使用2", "content": "", "publish_time": "2026-10-14 20:09", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-14T07-40:4589d04faf0b": {"id": "post:2026-10-14T07-40:4589d04faf0b", "kind": "post", "title": "2026-10-14 07:40", "source_label": "帖子正文", "excerpt": "AI 科技早报｜2026.10.14🔥头条速递谷歌 Gemini 4 Argon 正式上线财联社 谷歌新一代旗舰大模型 Gemini 4 Argon 今日全球开放，最大上下文100 万词元，主打金融、法律、长文档分析、大型代码重构。面向 Google AI Pro/Ultra 订阅用户，开发者可通过", "content": "AI 科技早报｜2026.10.14🔥头条速递谷歌 Gemini 4 Argon 正式上线财联社 谷歌新一代旗舰大模型 Gemini 4 Argon 今日全球开放，最大上下文100 万词元，主打金融、法律、长文档分析、大型代码重构。面向 Google AI Pro/Ultra 订阅用户，开发者可通过 API 调用；限时优惠价仅为竞品约 1/5，11 月底恢复常规定价。官方基准测试中，在 19 项评测拿下 13 项第一，对标 GPT-6 Astra。阶跃星辰发布原生智能体手机 STEPX Neo，售价 3999 元10 月 13 日上海发布会，阶跃星辰推出大模型原生智能体手机，先行版 3999 元，包含开发工具与 12 个月 Token 权益。10 月 13 日开启预售，10 月 16 日首销。定位硬件 + AI 服务一体化终端，模型厂商直接下场做 AI 手机。 🧠模型与终端面壁智能 MiniCPM-V 4.7 发布：35B MoE 多模态模型，可在 iPhone 17 Pro Max 运行，仅占用约 3GB 内存，实现 13+ token/s 解码，端侧大模型轻量化再突破。英伟达 DLSS 5 模型更新提速 10 倍：新版 3D 神经渲染模型参数精简、显存占用下降，4K 游戏性能显著提升，10 月 16 日推送，支持 RTX50 系显卡。 🧱算力 & 产业更多加微WUXL3408高盛研报：HBF 高带宽闪存有望破解 AI 内存墙：AI 推理爆发，存储瓶颈制约算力，HBF 新型闪存可降低 AI 基建成本，成为算力新方向。2026 人工智能产业大会今日济南开幕：大会主题 “AI 赋能新型工业化”，300 余家企业参会，华为、浪潮、英伟达等集中展示工业 AI 落地方案。行业预警：英特尔、博通 CEO 提示 AI 扩张最大瓶颈或是资本：算力建设资金成本走高，市场担忧大量 AI 基建投入回报不确定性，融资约束或将大于芯片、电力短缺问题。 📌海外快讯 OpenAI 一名工程师因在会议室安装加密录音设备被 FBI 逮捕，OpenAI 称无模型权重、源代码及客户数据泄露。 Meta 近期发布 Muse Wonder 系列新模型，智能评测分数大幅提升，智能体能力持续迭代。 📊一句话观点 大模型竞争进入长上下文 + 专业领域比拼阶段；端侧原生 AI 手机、轻量化多模态模型加速落地；算力行业重心从单纯堆 GPU，转向存储、资本成本约束。#文字观点", "publish_time": "2026-10-14 07:40", "tags": ["文字观点"]}, "post:2026-10-14T08-50:29a62442650c": {"id": "post:2026-10-14T08-50:29a62442650c", "kind": "post", "title": "2026-10-14 08:50", "source_label": "帖子正文", "excerpt": "Meta Muse 的调研 Muse在公司的战略定位是什么？它更像是一个新的consumer AI的产品实验，还是personal superintelligence战略下可能最核心的消费者入口之一？", "content": "Meta Muse 的调研 Muse在公司的战略定位是什么？它更像是一个新的consumer AI的产品实验，还是personal superintelligence战略下可能最核心的消费者入口之一？ 专家：关于第一个问题，muse 有多重要？刚才提到两个极端，一个是它是一个试验性的产品，另外一个是它是符合 meta 未来的核心战略的。目前认为它是趋于两者之中的一个地位。目前来看 meta 的 muse，它已经有非常高的一个采纳率。显然没有把它在内部当做跟 instagram、whatsapp、facebook 等同样的一种重要的地位。这个重要地位指的是在资源分配，还有一些保障上面。地位肯定没有那么高，但是目前来看的话，它已经是meta 在对于用户AI执行层面，superintelligence ai 的一个重要的战略，它不再是一个实验性的产品。如果用10分来比的话，它应该是10分当中应该能打8分，在重要性方面。与之对比的是在超级人工智能的模型，还有基础设施建设方面，这个是十分当中是满分的一个重要性。目前来看，还不知道muse会否是一个终极面对消费者的界面，能够触达到几亿甚至几十亿的用户。目前来看的话，它作为一个 agent 能够完成一些购物，规划旅游，客服服务，还有多层或多步骤的一些相关任务。至于说未来的一些目标，认为有四个层面：第一个层面是从今年的1亿的DAU的数量增加到明年的3亿的DAU的数量。第二，成熟的用户，它的留存率能够达到30%~40%。然后他们在使用的过程当中，每一个用户能够完成几个有意义的任务。第三个层面，希望对于那些需要多个步骤完成的任务，能够达到90%的完成率。对于其他的一些情况，希望明年能够达到80%~90%的完成率。第四个层面是使用频率，对于一些用户来说，希望能够达到每周完成3到4项的任务，这些任务就包括了购物、旅行、个人的行政事务的处理等等的任务，都可以每周三到五次。 如果对于以上提到的这些指标进行排序的话，现在对于Muse这款产品，最关注或者最核心的指标是什么？第二个问题是怎么看待，据外部统计数据，现在 muse 这款产品的下载量已经开始走平，DAU的增长趋势也开始放缓。应该如何看待这些指标的增长趋势放缓？ 专家：第一个问题要排序的话，认为第一个应该是留存率的问题。目前D30和D90，就是30天和90天留存率。已经做的还不错，有PMF的一个任务来作为一个指标，这里指的是不包括用户完全自愿的使用，而是留存的客户情况。第二个是Agent，它在任务方面的成功率和完成率如何，这里指的是端到端的完成，不用人工来进行挽救。那么希望达到的目标是简单任务90%，复杂的多步骤的任务是80%。排名第三的是对于有意义的用户的留存，这里的有意义指的是每周使用产品3~5次，并且完成的是一些有意义的任务。对比无意义的用户指的是那些经常会打开muse，但是不怎么使用它，或者说使用的那个任务没有什么意义，这样的一种情况。第四，要看DAU、WAU以及MAU，希望它的规模能够有所增长。第五，会是延时率和变现的情况。所以总体来看，北极星应该是留存度的情况。 关于所提到的第二个问题，现在希望能够去获得用户，与之相比是让用户能够活跃，还有与之相比就是要让用户得以留存，所以是获取、活跃和留存三个东西是比较看重的。目前来看，每个月的下载量的确出现了增幅的放缓。但是D30的留存率从18%提升到了31%。然后，任务完成的成功率指的是每个用户每周使用产品的任务完成率/成功率，从1.6%提升到了2.3%。这说明产品本身变得更加的好，变得更加的健康。那么如果说下载量已经到了一个瓶颈期，但是看到其他的一些数据，比如D30的量达到20%、50%，每周的使用应该是不小于两次，然后DAU、MAU能够留存50%左右，那么对于 meta 来说就是一个不错的成绩。所以抛开DAU不看，其实最大的担忧并不是下载率，而是怎么样把用户的好奇心转变为习惯性的使用muse来完成一些任务。公司有what's app、ins、facebook，还有自己的AI所以要获取用户本身并不是一个难点，但是要让用户每个星期对 muse 的使用数量得以提升，比如到5~10次。这个转换才是真正想要做到的一些事情。因此认为对于公司来说，26到27年，怎么样把用户从其他的一些公司的平台迁移过来，并且每周做一些有意义的使用，这会是非常看重的一件事情。 刚才提到D30的留存率，Muse应该是9月8号才上线，想知道D30留存率的指标具体是怎么得到的？然后能否展开讲讲PMF？ 专家：的确产品是9月8号发布，现在还不到30天。用的是数学方面的外推法来进行的估算。啊，比如会测算D1、D3、D7、D14，然后来估算D30的情况。目前收集到的数据是D1是55%，D3是35%，D7是30%。第二个问题，PMF本身是一个比较宏观的或比较多元的、多维度的测量方式，不是一个单一的测量纬度。比如PMF它是一个 funnel 的过程，就是要从用户的获取到用户的激活到成功使用，并且完成一项任务，到完成多项任务，到习惯性使用，到最后留存，是一个这样的过程。所以看到的是，用户要去使用它，并且多次的使用它，最后得以留存。所以第一周PMF会看它的下载数量如何。然后会发现DAU信息本身可能是一个具有误导性的数据。因为Meta本身就可以用其他的方式来获得大量的流量。所以DAU本身好，不见得就意味着这个产品就做得好。所以PMF有四个不同的指标。第一个是有百分之多少的新用户成功的完成了一次的有意义的任务。第二个指标是，他们完成这些任务的成功率如何？人工介入的情况如何？以及节省了多少时间？第三，他对同一个功能、同一个任务的重复使用的情况如何？因为要知道，很多的用户的两种任务之间毫无关联。关键要看他们是否对同一个任务不停地进行使用、重复性的使用。第四，要看整体的留存率，比如要看D3、16、19、10，如果还要增加一个的话，还要看到的情况是留存的成功率的情况。比如会问用户在刚加入的时候使用这个工具的成功率是多少？然后在第一周、第二周、第三周，再问同样的问题，看成功率是否有增加。所以认为PMF是一个更加全面的统计维度，要比DAU单一的维度来得更加的准确和完整。 要想让使用数量得以提升的关键点或者难点是什么？目前有没有通过什么举措进行提升？ 专家：在获得用户方面其实困难不大，也就是说其，distribution 并不是一个难点。那 meta 这边可以通过whatsapp、meta ai、facebook、instagram 这样的不同的软件或 app 来让 Muse可以轻易的得到几百万甚至上千万、上亿用户的一个关注。但是一个人成功的使用了一次，他是否三天后还记得有这么一个 agent 的存在，再会使用呢？这是一个很大的麻烦。认为挑战主要出现在五个方面。第一个方面，用户用完一次过后，很可能会忘记Muse的存在，它不像有个人要做某种搜索引擎的搜索，而是要把一些任务完全转交给agent 来做。大部分人在自然而然的情况底下，不会养成这样一种习惯。因此应对方式是提供一种语境。让meta来去告诉用户Muse可以完成什么样的任务，或者说之前做了一个任务，但是没有完全做完，来提醒他，让用户可以再次的进入到Muse这个界面，再使用它。第二个问题是，产品可靠度现在做的还不够好，可靠度不高可能会影响用户对产品的信心。比如说，要让他来完成改时间、订机票，或者说购物这样的一些行为。如果成功率不高或出现了失误的情况，用户可能就不会再使用。目标是要对于简单的任务达到90%的完成率、成功率，复杂多步骤的任务达到80%的完成率。那么对于一些没完成的任务，会实行自动的回溯，对这个行为或这个任务进行再完成，让用户再试一次的方式，对他们进行留存。第三，就是任务有很多，怎么样让用户重复性的去使用这个任务，或者说这个用户用起来可能会觉得比较繁琐，打个比方，用户在使用agent的时候，可能需要给他一些指令。给这个指令本身可能需要花3分钟，但是可能一个人独立完成这个任务只需要花4分钟。这种情况下，大部分的用户就会觉得纯属浪费时间，没有必要把这么一个任务交给agent来进行完成。那么，采取的措施就是通过记忆的方式来记住用户已经用过或使用过什么功能、完成过什么样的任务，然后生成一个固定的模板，或者说设立一个默认的设置，让用户下一次使用的时候变得更加的简洁、更加的快速。第四个情况是，很多用户不知道什么样的任务可以交给 agent 来完成。因为 agent 本身是一个非常泛的一个概念，或者他们完成的任务种类非常多。所以跟其他的 agent 不一样的点在于，Muse在面对用户给到的信息的时候，会直接的在那个方框里面告诉他，Agent 可以做什么。可以帮你预定，可以帮你取消一些订阅，可以帮你做客户服务相关的一些工作等等。第五的挑战是来自于要跨不同的API，或者是浏览器，用户的认证过程比较复杂，需要先登录，然后做几次的不同维度的身份认证，然后再进入某一个网页，并且可能在使用过程当中可能要换不同的网页。要用浏览器，还要用其他的一些工具，那么这种情况下，通过API还有Connector帮他简化身份认证的流程，并且比较好的去处理 token 的使用，仅在敏感时候才有人工来进行介入。这样的情况下，会发现能够减少人们去把任务交给 agent 的时间成本。比如说要让一个任务成功，可能要给这个 agent 八个不同的指令。并且需要花6分钟才能够完成。那即便这个任务能够成功，会发现后续用户要重复使用agent的概率就会比较低。所以要让agent能够比较快地介入到用户的日常使用，比如对于预算的管理等等。那么，能尽量做到一分钟来去完成认证，一分钟完成审核，然后可能还要让用户花45秒的这个精力放在这个上面。所以想法是尽量的对任务的过程进行精简，提供一个所谓任务的上下文，这样可以更好的让用户得以留存。比如Agent可以知道用户之前吃过哪一家餐厅，然后也可能会通过用户instagram上面分享的一个图片或分享的一些信息，来转移成Agent可能想做的一件事情。比如他可能在上面发过想去某一个地方，然后把它转移到Agent 里面来帮他完成任务，这可能是跟传传统的这些Agent不一样的一个地方。 对于不同难度任务的workload来讲，现在整体任务成功率如何？ 专家：所谓的复杂任务指的是可能要调用多个agents的一些任务。目前来看，简单任务的成功率是87%，12个月到18个月之后，目标是95%，这里包括了简单的搜索、总结、产品对比信息和获取的这样一些简单的任务。对于中等难度的任务，目前成功率81%，一年到一年半之后目标是93%，这包括了购物、搜索、重新约时间，还有帮助客户完成填表格这样的任务。对于复杂任务，目前的成功率是65%，12个月到18个月之后，目标是85%，包括跨网站的旅行订阅、机票预定，客户服务的一些解决方案，以及任何需要可能多步骤的任务，比如先登录、再做身份认证的这样一些任务。最后是极为复杂，叫做长任务的一些任务，叫long horizon tasks。目前的成功率50%，12个月到18个月之后，目标是75%，这包括了比如从一个浏览器的一个Tab转到另一个Tab，或从一个浏览器的Tab转到另外一个完全不相关的APP，并且对这个东西能够实现recovery等等。目前来看，会发现很多任务仅仅达到90%是不够的。比如，要定一个2000美元的机票，或者要做一些生活当中的行政方面的工作，会发现90%是远远不够的。比如，定机票如果只有90%的准确率的话，对于用户来说，可能是有大的麻烦；必须要达到98%、99%以上的准确率，才能够让用户有信心。目前来看，存在的差距其实并不是基础模型本身的智能程度不够，而是怎么样把一些简单的问题多步骤以后，让它的完成率或成功率依然达到比较好的程度。目前对于简单的任务，理想情况是95%，但现在只有87%。造成的因素，包括浏览器的一些原因，包括延时或其他的一些因素，都拉低了简单任务的成功率。而对于复杂任务，情况就更难了。因为复杂任务的工作流里面可能有十个步骤。即便每一个步骤都能达到96%的准确率，十个步骤相乘到最后的结果，从端到端的成功率只有66.5%。所以，要想达成一个多步骤任务的工作流，实现90%的准确率，这个难度是不低的。需要模型本身变得更加的智能，也需要它在checkpoint、autoretrieve等其他的方面做得更好，因此工程师目前的目标是要让整个系统的准确率或可靠率得以提升，而这个任务的挑战难度是极大的。 刚才提到用户的认证过程很复杂，特别是涉及到跨不同的API或者浏览器任务的时候，可以通过API接入或者是Connector的方式去简化身份认证流程。那是不是可以理解成未来在Personal Agent的工作流里，更多的是倾向于使用更多的API或Connector的方式，而不会很大程度上依赖browser这种方式？ 专家：这是一个很好的问题。这个理解基本上正确，但这并不意味着brower use在未来将会完全消除。目前来看，API、Connector还有browser，都会进行使用。未来的确API、包括其他的一些用途的比例会有提高。但这并不意味着browser use就不那么重要。从目前MUSE的使用频次或贡献比来看。Browser use大概是60%，API和Connector 30%，然后API和Browser的混合是10%。未来的目标希望达成Browser use 25%，API和Connector 60%，然后API和Browser的混合20%。目前从准确度和可靠度来看，Browser use是70%，以第一人称接入是87%，API和Browser的混合是95%。所以最后得出答案，应该说在未来Browser use肯定不会消失，因为互联网上有这么多的不同的服务都可以通过网页来进行浏览，而发现能够真正提供Agent包括API服务的，可能只有几百个或几千个，远远不够覆覆盖网上所有的服务类型。而从Muse这边来看的话，一定要达成对于API和Connector的使用，因为未来会变得很重要。但是绝对不能够放弃对于浏览器和电脑的使用。想象一下，如果放弃了对浏览器的控制和调用，就意味着仅能够在一定限度范围内的生态系统当中，并且对进行认可的公司或品牌内部进行使用，就不能够去调用所有人可能都会使用的各种各样类型的浏览器和上面的网页。可以看到像uber、shopify等不同的一些公司，他们都在开发对agent友好的功能，能够让agent来进行调用，同时也要允许agent能够使用浏览器。所以预计未来3到5年，重复性的一些工作流会是以API跟connector 为主的，但是浏览器的使用和调用也会长期并存。 如何看待比如亚马逊对于Muse这款产品封杀的一些情况，以及如果OpenAI、Anthropic、谷歌也都推出personal ai agent，muse的差异化优势是什么？ 专家：亚马逊的反应表明，个人Agent（Personal Agent）市场不会发展成为一个可以自由操作所有网站的单一超级Agent。竞争核心在于谁能够掌握消费者关系，以及谁能够控制交易层。亚马逊对Muse的限制范围更广，也同时抵制来自OpenAI、Google和Perplexity的Agent。亚马逊自身拥有购物Agent——Alexa for Shopping，并且能够访问亚马逊的一方购物场景数据（first-party shopping context）。Google采取了完全不同的架构路径，将Agent能力引入Search和Gemini，并与Shopify、Etsy、Wayfair、Target和Walmart等零售商共同开发通用购物车（universal cart）、支付基础设施以及开放式商业协议（open commerce protocols）。OpenAI正在构建Agent基础设施，包括Agent API以及商业广告整合能力。 因此，Muse面临的竞争结构可以分为三个层级： 第一层为个人Agent层（Personal Agent Layer）：包括Muse、ChatGPT、Gemini等，核心战略资产是用户关系、记忆能力以及意图编排（intent orchestration）能力。 第二层为服务垂直Agent层（Service Vertical Agent Layer）：包括亚马逊购物Agent、旅游Agent、银行Agent等，核心优势是专有库存数据以及业务流程。 第三层为执行基础设施层（Execution Infrastructure Layer）：包括API、UCP、MCP协议、支付系统、浏览器等，核心目标是完成交易执行。 Muse的目标定位是个人Agent层。Muse并不需要取代亚马逊的购物智能，而是希望成为消费者用于协调和管理各种服务的核心Agent。如果主要平台限制Muse，其实际价值和可用性将受到影响；但如果商家认为Agent能够成为有效的客户获取渠道，并开放API和连接器（connectors），Muse的能力将进一步增强。目前，亚马逊正在限制Muse，而Shopify则正在推动与Muse以及Shop Pay的整合。Meta表示，Muse支持链接支付方案（link payments plans）、Shop Pay支持，并且设计目标是能够跨越第三方服务运行。未来三到五年，每个市场可能会存在2–4个主要的横向个人Agent（horizontal personal agents），用户将通过这些个人Agent与大量嵌入式垂直Agent进行交互。竞争优势并不在于Llama、GPT还是Gemini模型本身，而在于分发能力、个人上下文理解、服务连接能力以及执行可靠性。Meta具备独特优势，其能够将个人Agent与WhatsApp、Instagram、Facebook中的通信和社交场景连接，并最终延伸至Meta智能眼镜。Google拥有Search、Android、Chrome、Gmail和Maps生态；亚马逊拥有电商、Prime和Alexa生态；OpenAI拥有ChatGPT直接面向消费者的用户关系，以及快速扩张的Agent生态系统。个人Agent市场竞争格局正在快速演变。未来市场不会由一个能够处理所有任务并覆盖所有平台的单一Agent主导，而更可能形成分层结构：个人Agent负责协调用户意图，垂直Agent负责管理专业化工作流程，执行基础设施负责完成交易。战略优势将集中在分发、上下文理解、连接能力以及可靠性方面，各大厂商将依托自身生态系统强化Agent能力。Muse的定位是成为主要的个人Agent，通过连接用户与大量服务实现价值，同时需要适应平台政策限制以及商家整合过程中带来的机会与挑战。#文字观点", "publish_time": "2026-10-14 08:50", "tags": ["文字观点"]}, "post:2026-10-14T11-59:c6c5eea22a66": {"id": "post:2026-10-14T11-59:c6c5eea22a66", "kind": "post", "title": "2026-10-14 11:59", "source_label": "帖子正文", "excerpt": "Google Gemini 4 Argon正式发布：专业Agent能力突破，旗舰模型性价比竞争加剧🔥 1⃣ #专业Agent能力显著提升，金融、法律领域表现突出。10月13日Google发布Gemini 4 Argon，支持原生多模态及1M上下文，重点强化复杂推理与长周期任务执行。", "content": "Google Gemini 4 Argon正式发布：专业Agent能力突破，旗舰模型性价比竞争加剧🔥 1⃣ #专业Agent能力显著提升，金融、法律领域表现突出。10月13日Google发布Gemini 4 Argon，支持原生多模态及1M上下文，重点强化复杂推理与长周期任务执行。根据官方测试，Argon在金融Agent测试中取得65.4%，领先GPT-6 Astra及Claude Fable 5.1；法律Agent任务表现同样显著领先竞品，显示其在高价值专业知识工作场景的能力进一步提升。 2⃣ #综合任务执行能力进入第一梯队，Agent工程化持续推进。Argon在综合专业任务基准Vals Index取得68.9%，超过Astra及Fable 5.1；在自动化执行、工具调用等任务中表现突出，Coding能力亦处于前沿水平，但部分复杂软件工程基准仍落后于竞品。模型竞争正从单一推理能力向复杂工作流执行能力延伸。 3⃣ #首发定价具备竞争力，旗舰模型价格分层进一步清晰。Argon当前API价格为输入/输出2/10美元每百万Token，与GPT-6.1 Sol持平，仅为Fable 5.1（10/50美元）的20%；12月起Argon将上调至4/20美元，仍低于Fable 5.1。其隐式缓存命中享受95%折扣，模型商业化竞争进一步转向性能、调用成本与任务完成效率的综合比较。 4⃣ #近期前沿模型密集迭代，Agent成为共同演进方向。OpenAI GPT-6.1 Sol强化Coding、Computer Use及复杂专业任务；Anthropic Fable 5.1聚焦长周期Agent与知识工作；Meta Muse Wonder系列强化复杂任务处理与个人智能体能力。各家模型从通用问答向自主调用工具、持续执行复杂任务的Agent演进，金融、法律、研发等高价值场景成为重点突破方向。 整体来看，前沿模型呈现三大趋势：①专业Agent能力持续突破，从通用推理向高价值任务执行延伸；②旗舰模型价格分层加剧，单位任务成本成为重要竞争指标；③模型与工具、应用生态深度融合，真实任务完成率和商业化效率的重要性持续提升。#文字观点", "publish_time": "2026-10-14 11:59", "tags": ["文字观点"]}, "attachment:files/20261013 市场逻辑精选.pdf": {"id": "attachment:files/20261013 市场逻辑精选.pdf", "kind": "attachment", "title": "20261013 市场逻辑精选", "source_label": "其他", "excerpt": "2026.10.13 一、当下市场重点题材方向 冰雪经济：哈尔滨冰雪大世界规模升级，传出有望携手海外IP巨头 合作 催化因素：10月13日盘中市场流传未经证实消息，哈尔滨冰雪大世界计划 联动迪士尼打造冰雪奇缘主题专区；另外10月12日黑龙江冰雪旅游发展 促进会，在广州完成2026-2027冰雪季推介及启动仪式。", "content": "2026.10.13 一、当下市场重点题材方向 冰雪经济：哈尔滨冰雪大世界规模升级，传出有望携手海外IP巨头 合作 催化因素：10月13日盘中市场流传未经证实消息，哈尔滨冰雪大世界计划 联动迪士尼打造冰雪奇缘主题专区；另外10月12日黑龙江冰雪旅游发展 促进会，在广州完成2026-2027冰雪季推介及启动仪式。 项目规模：第28届哈尔滨冰雪大世界园区规划占地扩至125万㎡，刷新历 史最大规模记录，整体冰、雪耗材总量可达40万立方米。项目围绕冰雪景 观打造、游乐体验、文艺演出、冰雪赛事、IP主题运营、配套服务六大板 块，打造沉浸式冬季冰雪文旅项目。 行业空间：国务院办公厅相关文件提出目标，2027年国内冰雪经济整体规 模达到1.2万亿元，2030年提升至1.5万亿元。根据行业报告测算，本冰雪 季冰雪参与人群约3.08亿人次，冰雪运动消费规模2050亿元；《中国冰雪 旅游发展报告(2026)》预判冰雪旅游人次将达到3.6亿，旅游收入突破4500 亿元。园区扩建将直接拉动制冰造雪、环境模拟相关设备需求；10月15-17 日北京将举办冬博会，四季度冰雪板块迎来季节性催化窗口。 重点标的 哈空调：核心业务是空冷器、节能换热设备，和冰雪大世界运营主体同属 哈尔滨市国资委体系，分归工投系、马迭尔文旅系。 冰山冷热：业务覆盖工业制冷、冷链业务以及冰雪环境模拟相关空调环境 业务；2026年8月拿下呼伦贝尔新能源汽车全季冰雪试验基地项目，合同 金额2.7亿元，承建12.7万㎡全季节试验舱。 其他关联标的：龙江交通（黑龙江省内唯一上市高速企业，运营哈大高 速）、大连圣亚（哈尔滨极地公园运营方，企鹅IP存在和冰雪大世界联动 wåÆf t\u0003ÿ\u001a\\\u000fr ", "title": "AI Agent CPU 调研", "source_label": "其他", "excerpt": "AIAgentCPU调研 国产电商云财务Agent扩面后CPU用量大增的动因、浏览器复 用进程后的CPU开销、ARM长约后的x86/ARM采购选择 一、调研概述 本调研聚焦三大核心议题：（1）头部电动车品牌与国产电商云的Agent落 地案例，不同部门的CPU用量变化及应用扩面的条件；（2）API编排、文档解 析与代码沙箱的资源口径，并发、池化及工程优化对CP", "content": "AIAgentCPU调研 国产电商云财务Agent扩面后CPU用量大增的动因、浏览器复 用进程后的CPU开销、ARM长约后的x86/ARM采购选择 一、调研概述 本调研聚焦三大核心议题：（1）头部电动车品牌与国产电商云的Agent落 地案例，不同部门的CPU用量变化及应用扩面的条件；（2）API编排、文档解 析与代码沙箱的资源口径，并发、池化及工程优化对CPU测算的影响；（3）x86 与ARM的兼容性、功耗和部署计划，企业任务选用高端或普通CPU的条件。 以下为专家观点Q&A整理。 二、API编排与工具调度资源消耗 1.API与工具编排的vCPU消耗 Q：对于Agent任务中API与工具编排这类负载，其活跃状态下占用的vCPU 核数以及单次任务消耗的vCPU秒数分别是多少？ A：API与工具编排属于普通的调度任务，负载较轻。通常情况下，3到4 个vCPU可以满足其每秒的调度负载需求，这对应于大约2个物理CPU核。这 类任务的存活时间非常短，通常在0.1秒或0.3秒的量级，因此单次任务的资源 消耗很低。需要注意的是，具体的消耗会因使用的模型和其中的幻觉工程不同而 存在差异，因此无法提供一个适用于所有场景的精确到毫秒级别的数据。 Q：在进行智能体编排时，不同模型或其工程化实现会对调度产生何种影 响？如果仅关注CPU调度执行本身，而不考虑智能体思考或等待GPU的时间， 其资源消耗是怎样的？ A：智能体的能力取决于模型，而其运行生命周期的效率则取决于工程化实 现。因此，不同的模型和工程实现会影响最终的资源消耗。在实测的产品运行环 境中，一次典型的编排任务大约需要消耗2到4个vCPU，执行时间在0.1到0.3 秒之间。 Q：在执行一次编排任务时，实际瞬时占用的vCPU核数是多少？之前提到 的2到4个vCPU是指负载消耗，还是指需要同时占用2到4个物理核心？ A：单次执行一个简单编排任务时，实际瞬时占用的vCPU资源非常少，通 常在0.1到0.2个vCPU的粒度。之前提到的2到4个vCPU是指在并发较高的 情况下，该负载在单位时间内所消耗的总资源量，而不是指单次任务需要同时占 用多个核心。理论上，一个拥有4个vCPU的计算单元，在单位时间内可以并发 处理数十个甚至上百个此类仅消耗零点几个vCPU的编排任务。目前的技术目标 是希望将单次任务的消耗降低到0.0几vCPU，但当前为保证加载成功率，实际 能做到的是0.1到0.2vCPU的水平。 Q：在评估资源消耗时，有两种计算方法：一种是计算并发任务在某一时刻 占用的vCPU总量；另一种是计算任务在一段时间内消耗的总vCPU秒。这两 种计算方法是否都需要考虑集群的CPU利用率？ A：这两种计算方法的口径不同，对利用率的考虑也不同。第一种方法，即 计算特定时刻并发任务占用的vCPU总量，是不需要除以利用率的。这种计算方 式关注的是任务执行瞬间所需的即时资源量。第二种方法，即基于总任务量和完 成时间来规划资源池容量时，则需要考虑集群的CPU利用率。例如，当需要评 估一个特定规模的集群能在多长时间内处理完一批并发任务时，利用率就成为一 个关键参数。目前，Sandbox集群的CPU平均利用率通常可以达到50%至60%， 在优化情况下可以达到65%至70%，而行业普遍水平可能在50%以下。 Q：对于轻量级的API编排任务，典型的并发量能达到多少？ A：并发量是产品层面的一个考量，通常在构建智能体时已经设定了CPU利 用率的上限，用户无需过多关注。产品层面可以支持每分钟5,000甚至1万次的 并发。对于轻量级的API编排任务，典型的并发量可以设置在256到512之间。 这个并发量指标是针对一个虚拟机而言的，而非单个vCPU。 三、PDF文档解析资源消耗 1.PDF解析的vCPU消耗 Q：对于PDF文档解析任务，其vCPU资源消耗情况如何？解析内容的复 杂性，例如是否包含图片、字体大小或文本密度，是否会影响处理耗时？ A：PDF文档解析的资源消耗主要取决于是否需要执行OCR。在不含OCR 的情况下，处理一页PDF文档大约需要每秒6到8个vCPU。如果文档中包含图 片或表格等需要进行OCR识别的内容，资源消耗会增加，通常需要每秒10个 vCPU起步。解析时间是以单位时间内消耗的vCPU数量来计算的。文档中的字 体大小或文本密度对解析耗时没有影响，关键影响因素是表格和图片的存在。 Q：对于PDF文档解析任务，如果从资源消耗总量的角度看，解析一页需要 消耗6到8个vCPU秒；那么从瞬时资源占用的角度看，执行这项任务需要占 用多少个vCPU？ A：\"消耗6到8个vCPU秒\"的准确理解是，在执行PDF解析任务的每一秒， 都需要消耗6到8个vCPU。因此，如果一个解析任务需要10秒钟完成，并且 每秒消耗6个vCPU，那么总的资源消耗就是60个vCPU秒。这个\"6到8个vCPU\" 即代表了任务执行期间瞬时占用的vCPU数量。这个资源消耗模型是固定的，不 能通过减少vCPU数量来延长执行时间，例如不能将其拆分为使用3个vCPU执 行20秒来完成。 Q：对于一个需要消耗10秒乘以6个vCPU的任务，如果将其vCPU资源 减半或减少至1个，同时延长执行时间，该任务是否仍然可以运行？ A：理论上可以运行，但这是一种较为理想化的情况。具体可行性取决于任 务的复杂程度。对于纯文本PDF的文字提取这类简单任务，通常仅需0.1个vCPU 即可满足。而对于包含图片等复杂元素的PDF解析任务，虽然通常需要6个vCPU 或更多，但也可以通过降低vCPU配置来执行，例如使用0.5个vCPU处理一个 带图片的扫描版PDF解析任务。这种情况下，任务肯定可以运行，但响应速度 会变慢，延迟会显著增长。只要不低于任务运行所需的最低资源阈值，通过延长 执行时间来换取较低的vCPU并发是可行的。 四、检索任务资源消耗 1.不同类型检索任务的vCPU消耗 Q：不同类型的检索任务分别需要消耗多少vCPU资源？ A：检索任务的vCPU消耗量因其具体类型而异。对于轻量级的本地检索， 例如基于关键词的小型文本库检索，所需的计算资源大约为0.2vCPU-秒。对于 更复杂的向量检索，资源消耗会更高，大约需要1个vCPU-秒。综合来看，一个 通用的检索任务资源消耗范围可以参考0.2至0.5vCPU-秒。 Q：不同类型的检索任务，其vCPU的消耗量分别是多少？ A：检索任务的vCPU消耗量因类型而异。向量检索的消耗量大约在1到2 个vCPU秒之间。对于深度检索，例如处理大量长文档的场景，其消耗量显著增 加，大约在3到5个vCPU秒的量级。这些数据都是以每秒消耗的vCPU数量来 计算的，即在提供相应数量vCPU的情况下，任务可以在一秒内完成。 Q：深度检索任务在实际部署时，最低和常规推荐的vCPU配置分别是多少？ A：对于深度检索任务，推荐的最低配置为0.3个vCPU。在常规应用中，通 常会配置到0.5个vCPU以并行处理。至于轻量级检索任务，其vCPU需求更低， 可以分配0.1、0.03甚至0.01个vCPU。目前，利用园区内的碎片化资源为智能 体执行任务，最低已可以实现0.01vCPU的分配。 五、网页浏览任务资源消耗 1.不同复杂程度网页的vCPU消耗 Q：浏览不同复杂程度的网页，其vCPU的消耗情况是怎样的？ A：浏览网页的vCPU消耗取决于页面的复杂性。对于简单的网页，大约需 要2到3个vCPU。然而，对于包含复杂动态内容、GPU渲染或需执行脚本代码 的重度网页，vCPU需求会大幅上升，可能需要60个vCPU左右，甚至上百个。 这类任务还涉及页面截图或文件提取等操作。 Q：在并发场景下，加载不同复杂程度的网页通常需要占用多少vCPU资源？ 最低启动配置是多少？ A：在并发加载场景下，对于包含动态内容、GPU渲染和脚本执行的复杂网 页，通常会占用30到50个vCPU，并发数一般设定在20左右。对于以文本和 少量图片为主的简单网页，并发启用时也需要十几个vCPU。网页加载任务存在 最低资源要求，不仅是CPU时间，还涉及内存加载，因此最低也需要10个vCPU 才能启动，使用如0.1或0.5个vCPU是难以运行的。 Q：运行不同复杂度的网页浏览任务，例如轻度浏览、数据提取或页面截图， 各自需要消耗多少vCPU资源？ A：轻度网页浏览任务可以适当降低vCPU消耗，但由于仍包含渲染和脚本 代码执行，需要保持一定的资源。对于复杂任务，例如数据提取或页面截图，则 需要消耗更多资源。 六、Python沙箱与代码执行任务资源消耗 1.Python沙盒任务的vCPU消耗 Q：运行一个Python沙盒任务，根据其负载的简易和复杂程度，分别需要 消耗多少vCPU？ Q：常规Python执行任务的vCPU配置标准是怎样的，以及推荐的并发数 是多少A：简单的 Python沙盒任务，如数据分析，大约消耗 5到10个vCPU。对于 复杂任务，例如涉及复杂循环、大文件处理或高级绘图的负载，则至少需要 30 到50个vCPU。qq1490929960 ？ A：常规的Python执行任务，至少需要配置20个以上的vCPU才能顺畅运 行。对于这类代码执行任务，建议的并发数在40以上，最好能达到50或80。 Q：为什么代码执行任务建议的并发数达到40以上，会高于网页浏览任务 在智能体场景下的20并发？ A：代码执行的并发数设置得更高，是因为程序的执行逻辑通常比网页浏览 更复杂，可能涉及更多的代码调用。网页浏览任务可以等待，通过降低并发来分 散请求，用户可以排队。但程序执行具有即时性，如果并发数过低，一个包含循 环或复杂逻辑的程序可能需要很长时间才能运行完毕。单位时间内更高的并发数 意味着系统能接收并开始处理更多的请求，避免后续请求因并发池已满而被拒绝 或标记为失败。程序的执行逻辑和复杂度决定了它需要更高的并发来处理，这与 网页浏览的负载特性不同。 Q：在代码沙箱中执行复杂代码任务，通常需要占用多少vCPU资源？ A：对于在代码沙箱中执行的复杂代码任务，通常需要配置大约40个vCPU。 对于常规的复杂循环计算，40至50个vCPU是常见的配置。 Q：在何种情况下，代码执行任务会需要几百个vCPU？常规串行计算与重 度并行计算所需的vCPU配置分别是多少？ A：当涉及并行程序或并行计算时，可能会需要上百个vCPU。具体来看， 常规的串行计算任务，保持在30至40个vCPU即可满足需求。而对于重度的并 行计算，配置150至160个vCPU，甚至180个vCPU都属于正常范围，因为许 多并行计算的量级可能更高。 Q：在实际部署中，为单个客户请求并行运行30到40个vCPU是否常见？ 企业级复杂算力任务通常会部署多少vCPU？ A：目前为单个客户请求并行运行30到40个vCPU的情况比较少，仅在特 定案例中出现过。对于企业中真正复杂的算力任务，常规配置大约在100个vCPU 左右并行运行，这属于相对偏高的配置。一般而言，常规的程序执行任务，建议 按照30个vCPU左右进行测算，因为这类任务不仅是简单的代码执行，还需要 解决一个闭环问题，例如绘图等操作本身就非常消耗内存，过低的配置可能导致 无法加载。 七、多模态任务资源消耗 1.不同类型多模态任务的vCPU消耗 不同多模态任务的vCPU资源消耗情况如下： （1）图像编解码、归一化、转换及切片等处理：处理一张图片大约需要12 个vCPU。 （2）短视频片段的多帧抽取与视频解码：处理5到10帧的片段大约需要消 耗50至60个vCPU秒。 （3）高分辨率图像计算：例如生成图表、工程绘图或处理大型表格，大约 需要20至30个vCPU。 （4）沙箱环境中运行视觉编码任务：例如使用英特尔AMX技术将一张图 像从H.265编码格式转换为H.266格式，单次运行大约需要30至40个vCPU。 八、智能体应用场景与用户资源消耗 1.智能体常规应用场景 Q：除了多模态任务，目前智能体还有哪些常见的、资源消耗较大的应用场 景？ A：目前，除了多模态处理，智能体常规且已在生产环境中规模化落地的主 要应用包括解析文档、执行检索任务以及代码浏览。其他更重度的应用场景尚未 大规模落地。智能体技术自2026年才开始大规模应用，目前在生产环境中的最 佳实践刚刚起步。 2.用户vCPU资源消耗 Q：对于一个Agent产品的用户，平均每个活跃用户在执行任务时实际会占 用多少vCPU资源？ A：在采用超分资源分配模式下，平均每个用户在实际执行任务时，消耗的 vCPU资源大约为1到2个。尽管系统可能会为用户配置更高的资源上限，但实 际运行时的平均消耗远低于此，以控制运营成本。 Q：在C端和B端场景下，同时在线并执行任务的用户通常占日活跃用户的 比例是多少？ A：并发在线执行任务的用户占日活跃用户的比例在不同场景下有所差异。 在C端场景，由于短任务较多，该比例相对较高。而在B端场景，例如钉钉这 类应用，由于长任务占比较高，并发在线用户的比例会低一些。 Q：在用户能够拉起更多沙箱的情况下，并发用户中拉起沙箱的比例未来达 到20%-30%是否合理？ A：如果用户能够拉起更多的沙箱，例如用于处理PDF文档、代码浏览、多 模态预处理等任务，那么并发用户中拉起沙箱的比例有可能达到20%至30%。 目前并非所有并发用户都能拉起沙箱，若未来这一功能普及，该比例可能会非常 高。 Q：现阶段用户拉起更多沙箱的主要瓶颈是什么，是智能体的可用性还是用 户需求不足？ A：主要瓶颈在于智能体。用户需求是巨大的，但关键在于智能体是否足够 好用，以及用户是否愿意使用。此外，智能体的数量也需要大幅增加。当智能体 数量足够多，生态系统全面化之后，用户的所有长短程任务，包括自行构建的任 务，都可以通过智能体沙箱来处理，从而推动其广泛应用。 3.资源池化与虚拟机构建 Q：市场上存在为每位用户配置2-4个vCPU或8个vCPU的现象，但实际 活跃使用量可能仅为1-2个vCPU。这是否意味着服务商在运营中通过并发和资 源池化技术，使得用户实际使用的资源与名义配置并不完全对应？ A：是的，产品配置中标明的vCPU数量通常是指其虚拟机的规格，类似于 一个售价单位。在实际运营中，服务商会进行CPU的池化处理。此外，系统可 能会根据不同的任务负载，通过推荐系统来动态推荐和分配资源。 Q：在通过并发和资源池化技术处理不同用户的请求时，如何避免因共享内 存池而导致的记忆混乱问题？另外，像Meta这类公司按用户分配资源的方式与 主流CSP按任务分配资源的方式有何根本区别？ A：在资源池化中，确实会通过各类技术手段来避免数据混乱。关于资源分 配方式，Meta的Muse可能是按用户维度进行切分，这种方式对于拥有自有数据 中心且资金雄厚的公司或许可行。然而，主流CSP通常不会这样做，它们更倾 向于从任务维度去切分和分配资源，这种模式更具成本效益。例如，一个用户可 能同时拉起多个沙箱，每个沙箱占用的资源从0.01个vCPU到两三个vCPU不 等。因此，分析这类服务的资源消耗应聚焦于任务维度，而非为每个用户分配一 个持久化的VM。 Q：Meta的Muse按用户切分资源的方式，与CSP的处理方法具体有何不 同？如果Meta使用外部CSP，其资源请求是否会再次被CSP进行处理？ A：两者在资源超分的层级上存在差异。可以将物理服务器视为第一级资源。 Meta在其物理服务器上创建VM，这属于第一次超分。而CSP在VM之上，会 进一步进行资源的池化和调度，这可以理解为第二次超分。因此，如果Meta使 用外部CSP的服务，CSP自身肯定会对其资源请求进行二次超分处理。 Q：厂商在产品宣传中提到的\"为每位用户分配一个虚拟机\"的说法，在实际 运营中是否意味着该虚拟机完全归属于单个用户？ A：这种说法更多的是一个产品概念或宣传口径，尤其是在进行成本核算时 采用的视角，而非技术上的完全独占。在实际运营中，所谓的\"个人虚拟机\"仍然 是可以被迁移或降配的。用户购买的是服务，底层资源，即具体分配了多少vCPU、 内存或存储，以及这些资源位于哪个物理服务器上，对用户是透明的。这种宣传 方式主要是为了便于统计和市场沟通，并不代表真实、恒定的用户资源消耗量。 如果严格按照宣传口径为每位活跃用户配置固定的高性能虚拟机，对CPU的需 求将是巨大的。 九、工程优化方法 1.工程优化手段及效果 Q：在AIAgent任务中，有哪些工程优化方法可以节省vCPU用量？具体的 优化幅度是多少？ Q：先前提供的各类任务vCPU消耗数据，例如基础浏览器消耗2-3个vCPU、 动态复杂浏览器消耗上百个vCPU，是优化前还是优化后的标准A：工程优化方法及其效果因具体场景而异。对于单张图片的多模态处理任 务，若采用英特尔的 AMX技术， vCPU的消耗量可以降低约 50%。对于浏览器 类任务，可以通过任务池化的方式，复用已创建的浏览器进程实例，避免每次都 进行冷启动，这种方法可以节省 30%以上的 CPU开销。此外，还存在其他多种 优化手段。例如，通过任务熔断、优化镜像加载、利用基于 K8s的沙箱容器技 术，以及针对向量检索和 Embedding 采用大页内存等方式，综合可以实现 10% 至30%的vCPU消耗降低。 qq1490929960 ？ A：先前提供的vCPU消耗数据均为优化前的状态，仅包含了部分优化，并 非所有优化措施都已实施。因此，这些数据仍有进一步优化的空间。以浏览器任 务为例，在当前基础上至少还可以再降低30%的消耗，即按照七折进行估算。 Q：考虑到CPU资源可能出现的紧缺情况，从长期来看，各类AIAgent任 务的极限优化潜力有多大？ A：各类任务的极限优化潜力存在差异。对于多模态预处理任务，在现有优 化基础上，常规情况下可以再下降20%至30%，在极致情况下，总优化幅度可 以达到40%至50%。对于浏览器类任务，通过极致优化，总消耗量可以降低50% 至70%。在特定的冷启动场景下，优化幅度甚至可能达到80%至90%，但常规 评估以50%为准更合理。其他环节的优化潜力也相当可观。例如，通过快照克隆 方式实现的预热池，在创建任务时可以减少80%至90%的CPU消耗；通过混合 调度智能体任务，可以显著提升集群利用率，从而节省20%至30%的CPU消耗。 目前已有专门团队在进行这些复杂的优化工作。 十、CPU紧缺预期与智能体数量增长 1.CPU紧缺判断 Q：既然工程优化的空间如此之大，是否意味着长期来看CPU并不会持续 紧缺，除非任务量出现十倍以上的增长？ A：尽管优化手段多样且幅度显著，但CPU资源在未来确定会面临紧缺。其 根本原因在于，智能体的数量增长将远超十倍或百倍，预计会达到数百倍甚至千 倍的量级。因此，当前市场对CPU需求的增长是被低估的。如果英特尔和AMD 维持现有产能而不进行扩张，在未来三年内，其市场份额很可能会被ARM抢占。 2.智能体数量增长预期 Q：业界对于智能体数量将实现百倍乃至千倍增长的预期，是否有具体的数 据或信号可以支撑？ A：目前观察到，进行AI化转型的客户，其内部智能体的数量正在显著增加。 例如，像比亚迪或米哈游等公司，其员工个人也开发和使用了大量智能体。这种 增长趋势难以精确预估，因为智能体本身具备再创造新智能体的能力。一个智能 体为完成复杂任务，可能会通过编写代码生成新的智能体进行协同工作，这就导 致了数量的衍生式增长。物理世界的用户增长可以匡算，例如基于100万用户， 假设每个企业客户部署1,000个智能体，可以得出一个大致的数量。但虚拟世界 中由智能体自我繁衍产生的数量则难以估量。", "status": "extracted"}, "post:2026-10-14T07-49:4fc53c6e704d": {"id": "post:2026-10-14T07-49:4fc53c6e704d", "kind": "post", "title": "2026-10-14 07:49", "source_label": "帖子正文", "excerpt": "摩根大通——半导体与半导体设备：2026年三季度行业前瞻：供应约束、AI动能及周期性复苏支撑进一步业绩上修与股价持续跑赢 一、整体观点：基本面持续改善，选股逻辑聚焦供应瓶颈与AI敞口 进入2026年三季度财报季，我们对半导体及半导体设备板块维持建设性但精选的立场。过去三个月，板块基本面持续向好，核心", "content": "摩根大通——半导体与半导体设备：2026年三季度行业前瞻：供应约束、AI动能及周期性复苏支撑进一步业绩上修与股价持续跑赢 一、整体观点：基本面持续改善，选股逻辑聚焦供应瓶颈与AI敞口 进入2026年三季度财报季，我们对半导体及半导体设备板块维持建设性但精选的立场。过去三个月，板块基本面持续向好，核心驱动力与年初至今的超额表现（SMH指数+68%）一致：AI基础设施投资维持高位、半导体供应链普遍供应紧张、非AI终端市场周期性复苏范围扩大。我们预计多数覆盖公司三季度业绩将稳健，且四季度/2027年指引偏向积极，延续过去数个季度的“超预期+上调指引”节奏。然而，本季度市场焦点将从已被充分认知的需求强度，转向供应端——包括约束最严峻的环节、持续时间，以及新增产能何时能实质性缓解各细分市场（如先进制程代工、存储器等）的紧张局面。板块内部动态分化显著：AI计算、定制芯片、网络、存储器、设备以及模拟芯片各自面临不同的供需格局、定价环境和上修路径。我们维持精选策略，偏好那些AI敞口大、供应受限增长、具备定价权及/或受益于周期性复苏扩大的标的。首选标的：AVGO、MRVL；超配评级的NVDA、AMD（计算），MU、SNDK（存储），TXN、ADI（模拟），AMAT、LRCX、KLAC（设备）；中小盘偏好ALAB、AMKR、MKSI。 二、GPU/XPU（加速计算）：供需失衡延续，定制XPU与网络成AI堆栈增长最快层 AI/加速计算需求持续加速，市场对云厂商（超大规模及新云）2026/2027/2028年资本开支的一致预期已上调至同比+97%/+47%/+9%，因供应受限且需求能见度延伸至2030年代。我们预计NVDA、AMD、AVGO、MRVL的指引将继续显示2027年 backlog/订单能见度上行，短期增长瓶颈在于供应（先进制程代工、HBM、先进封装及日益突出的电力），而非需求。AI计算结构正转向异构，定制XPU/ASIC在加速器总可用市场（TAM）中的份额将持续提升——预计从2025年的约32%升至2026年的约43%、2027年的约56%，主要受超大规模厂商TCO优势的内部项目推动。AVGO和MRVL仍是定制硅领域的最佳受益者，NVDA（商用GPU）和AMD（MI4xx/MI5xx上量）保持领先。网络已成为AI堆栈中增长最快的环节之一，以太网数据中心交换机、DCI等市场至2030年的复合增速达31%-43%，800G向1.6T的过渡及以太网在AI数据中心的份额提升是核心驱动。AI变现指标（backlog改善、长期承诺延长、云/AI业务营业利润扩大）支持AI资本开支在2028年及以后维持高位。主要风险仍在于供应链产能瓶颈及2027年后资本开支的可持续性，但我们认为风险平衡偏向超预期。 三、CPU（通用计算）：代理式工作负载提振服务器CPU，内存涨价压制PC 2026年下半年计算市场呈现分化：服务器CPU需求因代理式AI推理工作负载（依赖CPU进行上下文管理、任务编排和推理服务）而大幅加速；PC则受内存驱动的材料成本（BOM）通胀压制。服务器CPU TAM在2030年前将保持50%以上的复合增速，AMD的EPYC Gen 5（Turin）及上量的Gen 6（Venice）正从INTC手中夺取份额（预计AMD在2026年二季度的x86服务器CPU收入份额~41%还有上行空间，未来几年收入复合增速超60%）。PC方面，受内存涨价影响，2026年整体出货量预计同比中高个位数至低双位数下降，上半年需求提前透支使下半年更疲软；高端商用PC相对韧性更强，AMD Ryzen在商用领域继续优于INTC，INTC的18A制程上量及定价支持部分抵消份额流失。整体而言，AI相关标的（NVDA、AMD）的前瞻指引将偏积极，而消费端敞口大的标的（如INTC的PC业务）需更谨慎，内存成本压力是2026下半年至2027年消费计算的主要悬顶之剑。 四、模拟芯片：供应趋紧叠加定价权修复，但全面补库存尚未启动 预计模拟板块三季度业绩及四季度指引整体偏向积极，工业、航空航天与国防（A&D）、数据中心需求持续改善，汽车通过内容量提升维持韧性，渠道库存已较健康。但过去约90天宏观不确定性上升，客户可能仍聚焦按当前消耗采购而非补充库存。因此，本季度投资者需回答的关键问题是：改善的订单活动、偏低的渠道库存及更坚挺的交期，能否推动2027年更广泛的库存回补，还是需求继续贴近消耗率水平。定价是另一观察杠杆，鉴于年内各公司采取的提价行动（如ADI实施额外涨价、TXN计划四季度及明年更广泛提价），定价将成为2026下半年至2027年更显著的顺风，即使需求逐步正常化，也能为收入/利润率改善创造空间。我们继续偏好ADI和TXN，因其广泛暴露于具有持久结构性需求驱动的市场（工业、A&D、数据中心相关电源）。 五、存储器：供需紧张深化至2028年，SCA/LTA框架重塑商业模式，HBM定价进入新机制 存储器板块呈现三大主导主题： 1. 结构性供需紧张加剧：美光（MU）明确2027/2028年供应紧张度显著甚于2026年，比特需求“远高”于DRAM行业20%低段/NAND 20%中段的出货增速。摩根大通全球团队测算，即使考虑去规格化，2026/2027/2028年供需缺口仍达约20%/19%/15%，至2028年累计HBM短缺达23周；2025/2026年“从现有产能压榨更多”的顺风正在消退。 2. SCA/LTA（供应/长期协议）重塑商业模式：MU的SCA数量从16份增至26份，覆盖至2030年35%以上的收入，其中2027财年超75%的产出已承诺，带来前所未有的前瞻能见度。新SCA按当前高位定价签署（vs. 此前二季度队列），将MU的跨周期毛利率底部重新锚定在远高于历史峰值水平（参考~62%毛利率）。 3. HBM进入新定价机制：MU已锁定2027年HBM价格“同比显著更高”（自1月1日起重置），行业首款定制HBM4E（MU/NVDA的NVHBM）成为关键竞争力验证。叠加数据中心SSD的爆发（MU第四财季数据中心SSD收入达100亿美元，同比10倍，受KV缓存卸载及HDD替代驱动），以及SNDK的NBM框架，存储器正从周期性波动向结构性成长转型。资本配置上，MU将大幅增加再投资（2027财年资本开支>550亿美元 vs. 2026财年~270亿美元）并提高股东回报（2026年12月9日CHIPS法案周年后100%超额现金用于回购等）。尽管年初至今股价强劲，但我们认为估值仍未充分反映商业模式的结构性改善，即将到来的财报季有望通过更多SCA/LTA披露催化板块重估。 六、半导体设备（WFE）：需求强劲但洁净室约束或限制转化，KLAC风险收益比最优 设备板块基本面仍积极，但核心争论已从“WFE是否改善”转向“收入上修能否持续，抑或洁净室/厂房准备开始限制需求向出货和收入的转化”。摩根大通模型预计2026/2027/2028年WFE市场同比+31%/+38%/+17%，其中代工/逻辑（F/L）和DRAM是主要上行来源，NAND相关支出相对克制。我们超配整个设备板块，但大盘股中首选KLAC——其年初至今表现落后同行（KLAC +66% vs. LRCX +91%、AMAT +102%），市场此前更奖励直接受益于内存资本开支的标的，而KLAC的过程控制组合更多受益于新节点爬坡、良率学习和工艺复杂度提升（当前周期主要由产能扩张驱动）。我们认为2027年这一动态将向KLAC倾斜，因代工/逻辑将占增量WFE增长的更大份额，且周期性增长将从单纯产能扩张扩大到工艺复杂度提升，KLAC的过程控制产品将更受益，共识收入预期有上行空间。 七、EDA/IP：AI驱动设计复杂度提升，代理式AI变现成为核心议题 EDA/IP基本面保持强劲，芯片和系统复杂度上升、超大规模XPU/ASIC项目、3DIC先进封装推动每个设计启动的EDA强度增加，对接口/存储器IP需求扩大。需求正从芯片级向系统级设计扩展（多物理场和3DIC仿真），拓宽TAM。代理式AI的讨论已从“是否蚕食EDA”转向“AI能解锁多少增量TAM及变现节奏”。CDNS和SNPS均预计将给出积极指引，关键争论点在于：代理式AI变现速度、定制IP/特许权使用费采用轨迹（尤其是SNPS在亚马逊AOIP披露后的管道转化），以及CDNS在英特尔和三星代工厂的定位改善能否转化为增量份额收益。我们继续将SNPS和CDNS视为EDA核心持仓。 八、其他细分板块要点 • 网络/通信基础设施：AI集群扩大使网络成为最清晰的投资故事之一，AVGO（以太网交换、光DSP等全面组合）、MRVL（从光DSP/定制硅扩展至AI基础设施平台）、ALAB（服务器/机架内高速连接）是首选。 • 消费/移动设备：2026年全球智能手机出货预计同比-16.7%，压力集中在低端，但收入TAM因ASP上升（~581美元）仍增6%；苹果受益于高端化，iPhone内容敞口大的供应商（AVGO、SWKS）相对受益。 • 汽车半导体：库存修正基本结束，但复苏由内容量增长和区域性强劲驱动，而非车辆生产广泛反弹；全球轻型车产量3Q26预计同比-2%，宏观逆风下我们对汽车敞口大的标的持谨慎态度，相对更偏好工业/航空航天/数据中心相关的模拟公司（TXN、ADI）。 • 工业半导体：复苏面较汽车更干净，能源基础设施、A&D、自动化测试、工厂自动化、医疗及数据中心电源等领域需求强劲，多数公司指引积极，继续偏好TXN、ADI、MCHP。#文字观点", "publish_time": "2026-10-14 07:49", "tags": ["文字观点"]}, "post:2026-10-14T22-07:472076616cd9": {"id": "post:2026-10-14T22-07:472076616cd9", "kind": "post", "title": "2026-10-14 22:07", "source_label": "帖子正文", "excerpt": "OCP 大会 —— 光通信、封装、存储器与电力成为焦点🤖AI 基础设施创新正在向机架级协同优化方向转变，智能体 AI 拉动推理算力需求，带来光互联、先进封装、存储器架构、供电领域的投资机会。🎯核心要点 🔌光互联：CPO 向着机架级规模化部署推进，可插拔光模块依旧具备横向扩展优势。", "content": "OCP 大会 —— 光通信、封装、存储器与电力成为焦点🤖AI 基础设施创新正在向机架级协同优化方向转变，智能体 AI 拉动推理算力需求，带来光互联、先进封装、存储器架构、供电领域的投资机会。🎯核心要点 🔌光互联：CPO 向着机架级规模化部署推进，可插拔光模块依旧具备横向扩展优势。📦定制 ASIC 与封装：联发科观察到 3.5D 集成方案获得更多采用，2.5D 封装已经接近物理极限。 💾存储器架构：SK 海力士借助 MARS 架构与 HBF 技术，着力解决推理算力容量与 KV 缓存瓶颈。 ⚡电力与散热：单机架功率突破 200kW，加速推动 800V 直流供电、垂直供电方案以及液冷技术落地。 🔍CPO 方面：光互联规模化落地距离现实越来越近。 🖥️一套搭载 64 颗 XPU、支持 CPO 的计算机架完成演示，展现出加速器之间直连光链路的发展潜力。 📶随着单通道 200G 电信号逐步逼近物理极限，光互联的规模化部署将愈发重要，对于定制化 XPU 产品尤其如此。 ✅但凭借可维护性与成本优势，可插拔光器件仍将在横向扩容场景下保持出货量领先地位。 ⚠️封装良率、光纤对准、可靠性依旧是 CPO 商业化落地的核心挑战。 🧩先进封装：行业发展正在超越传统 2.5D 方案。 📐联发科提到部分定制 ASIC 设计已经接近 10 倍光罩尺寸。 💡3.5D 集成方案相比传统 2.5D 互联，可实现约 10 倍的芯片间能效提升。📈管理层预计未来 3‑5 年 3.5D 集成的渗透率将持续上行。 🔧联发科同时强调定制化 HBM、专用芯片间互联接口、DTCO 设计协同优化的重要性。 📊随着系统复杂度持续抬升，先进封装、定制 ASIC 设计服务迎来结构性机会。 💾存储器：带宽之外，存储容量同样变得至关重要。📂SK 海力士推出 MARS 解耦内存架构。 ⚡借助共享 KV 缓存访问而非重复计算，该架构可将首 token 生成耗时提升 3‑5 倍。 🔎HBF 目标实现约 HBM 一半的带宽，但容量达到 HBM 的 14 倍，样品预计 2028 年初推出。 🧠推理工作负载将越来越需要融合 HBM、DRAM、NAND 的异构内存架构，存储器应用范围有望跳出传统 GPU 外挂 HBM 的范畴。 🔥电力与散热：成为下一级别的系统层面约束条件。 ❄️6 千瓦级双面冷板、垂直供电、先进微通道冷却方案完成演示，凸显散热压力持续加剧。 🔋向 800V 直流供电转型，能够降低电能转换损耗、提升功率密度。 🖥️与此同时，AMD Helion 智能体 AI 机架架构表明，在 GPU 基础设施之外，CPU 的增量需求同样会得到拉动。 🏗️供电能力、先进冷却、系统集成能力，将会成为越来越关键的差异化竞争要素。#文字观点", "publish_time": "2026-10-14 22:07", "tags": ["文字观点"]}, "post:2026-10-14T11-17:a8deacf22eb2": {"id": "post:2026-10-14T11-17:a8deacf22eb2", "kind": "post", "title": "2026-10-14 11:17", "source_label": "帖子正文", "excerpt": "半导体与硬件：OCP 首日五大要点花旗核心观点我们参加了在加利福尼亚州圣何塞举办的 OCP 大会首日活动，梳理出五大核心要点。我们与美满电子进行交流，认为微软 Maia XPU 的放量规模尚未完全体现在该公司的营收预测框架之中。", "content": "半导体与硬件：OCP 首日五大要点花旗核心观点我们参加了在加利福尼亚州圣何塞举办的 OCP 大会首日活动，梳理出五大核心要点。 我们与美满电子进行交流，认为微软 Maia XPU 的放量规模尚未完全体现在该公司的营收预测框架之中。 我们认为，英伟达与思科联合推出可插拔模块标准，对 LITE 以及 COHR 属于中性偏利好信号。 AMD 推出 Helion 平台，延续了其推广开放人工智能基础设施的战略，将自身定位为垂直整合平台之外的替代选择。 我们从服务器原始设备制造商处了解到混合铜光架构以及机架级系统集成相关进展。 1）Maia 成为微软主要推理平台；美满电子大概率成为核心受益方 我们认为微软相关业务的放量规模尚未完全体现在美满电子的营收框架中，更多资料加微信:wuxl3408如果部署能够按预期落地，相比现有的定制硅芯片预测，该公司存在潜在上行空间。 2）英伟达 / 思科 USFP 标准延长可插拔模块生命周期 英伟达联合思科推出面向 400G 每通道节点的可插拔标准，这释放出重要信号：可插拔模块至少在下一代产品中依旧占据核心地位，延长该类模块的生命周期，对于 LITE 与 COHR 属于中性偏利好。 3）AMD Helion：智能体人工智能机架 ⚙在公司 Helios 机架级架构基础之上，Helion 平台允许客户针对自身人工智能智能体的特定需求，自定义调整中央处理器性能、核心密度、功耗以及图形处理器加速能力，同时遵循开放、基于标准的基础设施方案。 首席执行官苏姿丰在主题演讲中表示，Helios 已经向 Meta、微软、甲骨文以及各类人工智能实验室等主要客户交付产品，同时公布 AMD 中央处理器路线图的下一代产品 —— 第六代 AMD EPYC Verano。 4）混合铜‑光架构 对于大规模部署场景，博通预计网络架构会更多依据传输距离选择互联方案：机架内部采用铜缆，发挥其成本、功耗以及延迟优势；机架之间以及集群之间使用光互联，以此满足传输距离与可扩展性的核心需求。 5）人工智能是机架级系统层面的问题 人工智能基础设施越来越成为机架级系统层面的问题，而不再是单台服务器层面的问题。 慧与、联想、戴尔以及超微均表示，不断提升的功耗需求、液冷技术的普及以及持续增长的部署复杂度，正推动行业转变思路，将机架视作核心计算单元。OCP 大会首日亮点1）Maia 成为微软主要推理平台；美满电子大概率成为核心受益方 在今日的 OCP 全球峰会上，微软表示 Maia 将会成为自家第一方产品的主要推理平台，从 2027 年开始实现吉瓦级规模部署。 我们认为这对于微软的核心 XPU 供应商美满电子而言属于重大利好。 本次公布的规格显示单颗芯片搭载 288GB HBM4，2027 年启动生产。 和上一代产品的差异十分关键，我们认为 Maia 300 标志着微软与美满电子的合作从边缘业务正式升级为完整的 XPU 项目。 部署规模十分庞大：单机架搭载 96 颗芯片，数量为 Maia 200 的两倍，集群芯片规模可达 12000 颗以上。 结合微软披露的细节，以及路透社 8 月 10 日报道的台积电产能沟通信息：2027 年产能超 30 万颗，长期目标超 100 万颗。 在我们看来，这意味着微软有望成长为继亚马逊云科技 Trainium 之后，又一个大规模定制硅芯片业务，进一步缓解投资者对于客户集中度的担忧。 我们在 OFC 大会和美满电子投资者关系团队进行沟通，对方表示 2030 财年 120 亿美元以上的定制业务营收目标，全部已经对应已拿下的项目，达成该目标不需要再获取新的设计订单。 针对微软 Maia 业务的规模，该团队重申此前观点：该项目体量超过当前两个定制 XPU 项目之和。 ⚠针对新项目，管理层表示，受部署时间节奏影响（该环节并不完全由公司掌控），他们在业绩展望上会刻意保持保守。 我们认为微软业务的放量规模尚未充分体现在美满电子的营收框架当中，如果相关部署按计划落地，相较于现有定制硅芯片预测，公司存在潜在业绩上行空间。 2）英伟达 / 思科 USFP 标准延长可插拔模块生命周期 英伟达与思科在 OCP 全球峰会上公布超高密度小型可插拔模块（USFP）规划。 这是一套全新光模块形态，面向单通道 400Gb/s 电信号，首批产品在 OSFP 尺寸下实现 16 个全双工通道。 两家公司表示，该产品带宽与前面板密度达到当前单通道 200G 可插拔模块的 4 倍，能效约为后者的 1.3 倍；无需模块内置冷却，散热最高可达 100 瓦，总双向带宽最高可达 12.8Tb/s。 泰科电子与安费诺为配套笼座、连接器以及模块合作厂商，开放规范将通过多方协议社区发布。 官方尚未公布产品上市时间。 我们注意到 16 通道、单通道 400G，单向带宽为 6.4Tb/s，因此我们判断 12.8Tb/s 为双向合计带宽，或是面向未来 32 通道版本，我们等待后续发布会披露更多细节。 我们认为 USFP 代表思科与英伟达合作持续深化的最新进展。 双方合作始于 2025 年 2 月，思科 Silicon One 成为 Spectrum‑X 内部唯一第三方芯片；后续进一步发展为思科推出基于英伟达芯片的交换机，包括 2026 年 3 月 GTC 大会发布的 102.4T N9100（基于 Spectrum‑6）；最近在 8 月，双方扩展安全人工智能工厂方案，面向新云与主权云客户配套超微计算硬件。 通过 USFP 项目，思科从集成英伟达技术，升级为和英伟达共同定义行业互联标准。 这进一步巩固思科作为英伟达自有交换机产品线之外，英伟达首选以太网合作伙伴的定位，尤其在企业、新云、主权云部署场景，思科的渠道与运营模式具备差异化优势。 对 COHR 与 LITE 的判断：中性偏利好 在我们看来，英伟达牵头推出单通道 400G 可插拔标准，释放重要信号：可插拔模块至少下一代仍占据核心地位，延长模块生命周期。 🛡LITE 与 COHR 和英伟达战略对齐，降低被排除在外的业务风险。 我们测算，16 通道、单通道 400G 的模块，会提升单端口激光器数量以及激光器性能要求。 这契合 LITE 在激光器领域的龙头地位，也利好 COHR 垂直整合的磷化铟业务，其核心依托 6 英寸 Sherman 晶圆厂，而晶圆供给是整个行业的核心约束。 ⚠但有三点需要持续跟踪： 思科自身通过 Acacia 以及硅光平台开展可插拔光模块业务，其光学团队共同主导本次标准制定，这会让思科配套端口拥有更快的上市时间优势。 单插槽带宽提升 4 倍，会带来每比特部署对应的模块出货量下降，需要依靠平均售价提升来保障单端口营收。 本次发布重点强调简化信号处理的光学设计，更多资料加微信:wuxl3408即便大部分模块厂商并不供应数字信号处理器，依然可能降低模块物料成本，带来模块价格压力。 本次发布的合作厂商名单，并未包含 COHR 以及 Lumentum 这类光模块厂商，我们认为后续多方协议的会员名单才是关键观察指标。 3）AMD Helion 智能体人工智能机架 AMD 推出 Helion，这是一套基于开放计算项目（OCP）规范、面向智能体人工智能基础设施的开放设计蓝图。 ⚙在公司 Helios 机架级架构基础之上，Helion 旨在让客户与合作伙伴在部署人工智能智能体工作负载时拥有更高灵活性，实现中央处理器与图形处理器的组合配置。 该平台允许客户针对自身人工智能智能体的特定需求，自定义调整中央处理器性能、核心密度、功耗以及图形处理器加速能力，同时遵循开放、基于标准的基础设施方案。 我们认为 Helion 延续了 AMD 推广开放人工智能基础设施、生态互通的战略，将自身定位为高度垂直整合人工智能平台之外的替代选择。 通过允许客户针对新兴智能体人工智能工作负载优化计算与加速资源，AMD 希望扩大自身中央处理器、图形处理器产品在下一代人工智能部署当中的应用规模。 除此之外，首席执行官苏姿丰在主题演讲中表示，Helios 已经向 Meta、微软、甲骨文以及各类人工智能实验室等主要客户完成交付；同时公布 AMD 中央处理器路线图下一代产品 —— 第六代 AMD EPYC Verano。 4）混合铜‑光架构 大会多场讨论印证我们的观点：下一代人工智能网络将由混合铜‑光架构主导。 随着人工智能集群规模扩张、跨机架计算域不断扩大，网络对于带宽密度、传输距离、延迟以及能效的要求持续提升。 但博通与安费诺均强调，铜缆技术的生命周期比很多投资者预想的更长。 400G PAM6 信号技术、共封装铜缆以及系统架构的迭代，能够把电互联带宽推向更高水平，甚至有望突破单机架限制，未来数年内铜缆依旧会在人工智能基础设施中发挥作用。 Meta 则介绍面向人工智能机架的光背板架构，用来解决纯铜架构的物理局限。 这套方案可以大幅提升机架级带宽，同时保留现有机架的可维护性、散热以及运行特性。 Meta 表示光背板可以实现带宽密度阶跃式提升，无需对机架部署、运维、散热模式做重大改动。 Meta 已经展出光背板原型，代表该技术已经脱离概念设计阶段。 放到更大的集群层面，Meta 人工智能基础设施内部光纤部署规模巨大；Prometheus（吉瓦级数据中心园区）光纤总长度约 300‑400 万公里。 这体现出当人工智能集群跨多栋建筑、需要海量东西向带宽时，光互联的重要性持续提升。 Hyperion 园区（5 吉瓦以上）更多资料加微信:wuxl3408的光器件占比预计会进一步提高，也凸显 Meta 和康宁达成数十亿美元供货协议的战略意义。 针对大规模部署场景，博通预计网络架构会更多依据传输距离选择互联方案：机架内部采用铜缆，发挥其成本、功耗以及延迟优势；机架之间以及集群之间使用光互联，以此满足传输距离与可扩展性的核心需求。 为支撑这一转变，博通推出 ICX 封装技术，让铜互联与光互联可以共存于同一个封装内，支撑灵活的混合网络架构。 展望更远未来，博通看好光计算互联（OCI），该技术有望兼具光模块的传输距离优势，同时功耗表现接近铜缆，助力搭建规模更大、效率更高的人工智能集群。 结合博通下一代 Tomahawk 交换芯片产品以及行业标准化工作，这条技术路线和整个行业向混合互联演进的大方向高度契合。 ⚠随着人工智能基础设施规模扩大，近封装光学、共封装光学会逐步落地，但该技术落地依旧面临诸多约束：设备可维护性、光学对准、可维修性、光纤管理、制造产能以及整体系统复杂度。 行业参与者强调，光互联的成功落地，不仅需要光引擎本身创新，芯片‑光纤耦合、高密度连接器生态、跨服务器 / 机架 / 集群的复杂光纤布线架构同样需要迭代。 在此背景下，泰科电子推出 Fusion‑Fold 制造工艺，依靠自动化高精度光学组装技术提升规模化能力，有望缓解制造与可靠性层面的部分瓶颈。 行业逐步形成共识：下一代人工智能系统会根据传输距离选用最合适的互联方案，短距离机架内扩容场景使用铜缆更多资料加微信:wuxl3408；机架之间、集群之间长距离横向扩展场景使用光模块。 行业并非简单从铜缆全面切换至光模块，而是走向混合架构，在性能、成本、可靠性、可制造性、可扩展性之间取得最优平衡，服务大规模人工智能基础设施。 5）人工智能是机架级系统层面的问题 🖥人工智能基础设施越来越成为机架级系统层面的问题，而不再是单台服务器层面的问题。 慧与、联想、戴尔以及超微均表示，不断提升的功耗需求、液冷技术的普及以及持续增长的部署复杂度，正推动行业转变思路，将机架视作核心计算单元。 当人工智能集群进化到类似超级工厂的部署规模，项目成功与否不再取决于单台服务器，而是取决于一套完整集成方案，涵盖供电、散热、存储、网络、部署服务以及全生命周期管理。 行业参与者同样强调开放标准、运维自动化、生态协作的价值，以此缩短部署周期、最大化图形处理器利用率，管理日趋复杂的人工智能环境。 慧与谈到，人工智能工作负载、功耗提升以及液冷需求正在从根本上改变数据中心架构，行业的视角从单台服务器，转变为把整套机架当作一台计算机。 基础设施不断解耦，供电托架、散热分配单元这类组件和服务器相互独立，带来全新运维挑战：设备通信、拓扑发现、上电时序、遥测管理、全生命周期管理。 慧与提出需要开放计算项目打造厂商中立行业标准，未来机架级基础设施需要一套统一管理框架，可以适配各类服务器、机架与管理架构，拒绝封闭私有系统。 ⏱联想谈及大规模人工智能基础设施落地扩张的现实难题，运营商的核心指标是缩短 “首令牌时间”，也就是硬件投入到产出可用人工智能业务的间隔。 人工智能集群已经达到超级工厂级别，互联组件数量庞大带来运维复杂度指数级上升，系统可用性变得至关重要。 联想提出成功部署需要四大核心环节：架构优化设计、复杂基础设施的获取与建设、部署阶段系统验证、长期运维支持。 联想同时强调，现代人工智能数据中心的设计优先考量供电与散热能力，而非物理占地空间；更多资料加微信:wuxl3408智能体人工智能等新兴工作负载快速迭代，给供应链以及部署进度带来巨大压力。 戴尔科技与超微都提出，人工智能基础设施复杂度与数据量持续提升，需要集成式机架级方案，兼顾性能、 d margin expansion. We raise earnings estimates and price targets for Unimicron and NYPCB and reiterate OW on both. More capacity, but limited near-term relief: Suppliers are stepping up investment, but several newly announced projects are not scheduled to ramp until late 2028-30 or beyond. Our updated supply-demand model continues to indicate undersupply from 2027 through 2030, with tighter supply in CY27-28, which should only be more favorable to pricing. Therefore, capacity additions announced in the past few months do not, in our view, diminish the magnitude of pricing gains over the next two years. CY27 pricing should accelerate, amid tighter supply-demand in CY27-28, but visibility on the magnitude remains limited: We see ABF substrate prices rising 25%+ in CY27, below buy-side expectations of ~50%. Our supply/demand outlook points to undersupply next year, with larger substrates, higher layer counts, and greater manufacturing complexity further constraining usable output. Raw material cost pass-through was a key driver of CY26 price increases, we expect supply tightness to play a greater role in CY27. This should allow pricing to outpace cost inflation, driving faster margin expansion. We remain constructive on pricing, but the magnitude and timing of increases depends on customer-level negotiations. With pricing a segment-wide tailwind, we prefer Unimicron for its stronger CY27 capacity growth: As supply tightens, the ability to deliver incremental volume should become a key differentiator. We favor suppliers bringing capacity online in CY27 over those whose expansion plans contribute in later years. Unimicron’s Guangfu II ramp should add 10-15% to capacity in CY27, compared with 5-10% growth at NYPCB through debottlenecking, giving Unimicron greater scope to benefit from both pricing and volume growth. Unimicron is also our preferred play heading into earnings, as more demanding expectations for NYPCB leave less room for an upside surprise. But we remain OW on NYPCB given its networking and AMD CPU exposure, alongside its proactive pricing strategy. We reiterate Overweight on Unimicron and NYPCB: Reflecting stronger earnings trajectories, we raise our EPS estimates for both companies. Based on upside to our revised price targets, our order of preference is Unimicron (NT$1,775 PT; 24x CY28e P/E; 41% upside), followed by NYPCB (NT$2,000 PT; 22x CY28e P/E; 39% upside). Potential risks: 1) Weaker demand for PCs, general servers, and AI servers; 2) meaningful capacity expansion plans; 3) T-glass shortage; 4) CoWoP displacing ABF substrates.Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. October 14, 2026 08:00 AM GMT Not for redistribution without written consent of Morgan Stanley wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 M Idea 2Supply/Demand Update: Undersupply Deepens in CY27–28 Our updated model points to a wider supply shortfall in CY27–28, despite additional capacity: Incorporating the latest expansion plans and semiconductor demand forecasts, we now expect ABF substrate demand to exceed available supply by 9.3% in CY27 and 13.7% in CY28, versus 6.2% and 9.4% previously. This represents a widening of 3.1ppt and 4.3ppt, respectively, relative to our prior estimates. We maintain our view that CY26 is a broadly balanced market, followed by increasingly tight supply over the next two years. The main demand upgrade comes from other ASICs, including Chinese AI chips: We raise our shipment assumptions for this category to 6.4mn units in CY27 and 8.7mn in CY28, from 4.6mn and 6.2mn previously. Our Nvidia GPU and server CPU forecasts remain largely unchanged, while we lower AMD GPU estimates while also keeping CY27 Trainium and TPU shipments largely unchanged. The tighter substrate outlook therefore reflects stronger demand across a broader set of ASIC suppliers, rather than higher shipment assumptions for every major AI platform. We also raise our substrate content assumptions for select chips based on our latest supply chain checks, lifting our substrate demand estimates across some segments, including server CPUs and networking. Higher supply assumptions provide limited relief in CY27-28: We now include additional capacity announcements that have been announced recently, including two additional Kinsus factories, scheduled to come online in CY28 and CY29, beyond the CY27 expansion already in our model. Several larger projects, however, contribute later. NYPCB’s new site starts ramping in 2H29, while SEMCO’s Sejong expansion begins mass production in September 2028 and its project in Vietnam is scheduled to begin operations by June 2030. These additions increase medium-term supply but do not prevent the modeled shortfall from worsening through CY28. Increasing substrate complexity adds to the pressure on usable output: Larger body sizes, higher layer counts, and more demanding manufacturing processes constrain the output available to meet demand, even as suppliers expand installed capacity. With the supply gap widening in CY27-28, we expect tightness to become a more important pricing driver than raw material cost pass-through. This supports our forecast for 25%+ price increases in CY27 and further increases in C U 互联效率要求的提升带来 scale-up市场的爆发；集群之间的互联 （组成超大的集群）带来 scale-across的需求。传统铜缆受物理限 制无法实现跨机架XPU等高速互联，集成光学是突破铜互连物 理瓶颈、支撑大规模 XPU全互连的关键路径，因此 NPO、CPO 等集成光学方案具备明确的部署必要性。 事件： 2026年10月6日，Marvell投资者日，公司给出FY2031收入目 标700–900 亿美元 （中值800亿美元） ， 对应FY26–31收入CA GR 约55%–60%，即“五年约十倍”。 简评 1、 TAM上调至4000亿美金，互联市场增速最快 。 2026年10月6日，Marvell在纽约举办了投资者日，由董事长兼 CEO Matt Murphy与高管团队宣讲，就未来的发展战略、收入目 标做出了乐观指引，展现了在 AI数据中心资本开支增长的背景 下，公司业务发展的信心。 公司预计到2030日历年，可触达数据 中心TAM约3850亿美元，加通信及其他约 150亿美元，合计约 4000亿美元，CAGR约45%（CY25-CY30）。其中互连约650亿 美元，CAGR约65%，增长的动力包括scale-out持续增长，scale- up与scale-across新机会；交换与存储约 850亿美元，CA GR约 40%； 定制业务约2350亿美元，CAGR约55%，主要来自于XPU 的放量；通信及其他约150亿美元。 对于Marvell自身收入目标而言，2026财年收入约82亿美元， 2027财年预计约120亿美元，同比增长47%，2028财年预计约 200亿美元，同比增长约 67%，增速提升，到2031财年，预计营 收区间700亿—900亿美元，中位800亿美元，按中值计算，五 年营收增长约10倍，CAGR约55%—60%。其中互连约375亿 美元，CAGR约60-70%；交换与存储约100亿美元，CA GR约 40%-50%；定制业务约300亿美元，CAGR约75%-85%；通信及 其他约25亿美元。 从Marvell的展望来看，未来数据中心的投资中，互联是增速最 快的方向， 集群规模的扩大带来 scale-out持续增长； 集群内GPU 互联效率要求的提升带来 scale-up市场的爆发；集群之间的互联 （组成超大的集群）带来 scale-across的需求。 维持 强于大市 于海宁 yuhaining@csc.com.cn SAC 编号:S1440526080004 曹添雨 caotianyu@csc.com.cn 010-56135167 SAC 编号:S1440522080001 湛子杭 zhanzihang@csc.com.cn SAC 编号:S1440526040002 发布日期： 2026年10月13日 市场表现 相关研究报告 26.10.11 【中信建投通信】:周报2026年10 月第1期：Marvell上调长期增长指 引，台积电业绩高增，AI算力与高 速互连景气持续 26.09.28 【中信建投通信】:周报2026年9月 第4期：Meta Muse加速智能体商 业化，云栖大会强化全栈 AI布局 26.09.20 【中信建投通信】:周报2026年9月 第3期：智谱商业化提速，海外算 力需求延续高景气 26.09.14 【中信建投通信】:周报2026年9月 第2期： 光博会彰显高速互联景气， Oracle高增验证AI算力需求延续 26.09.10 【中信建投通信】:行业综述：AI算 力景气延续， 持仓再创新高， 云厂商 资本开支持续加码 -6%44%94%144% 2025/10/13 2025/11/13 2025/12/13 2026/1/13 2026/2/13 2026/3/13 2026/4/13 2026/5/13 2026/6/13 2026/7/13 2026/8/13 2026/9/13 通信上证指数通信 仅供内部参考，请勿外传 1 行业简评报告 通信 请务必阅读正文之后的免责条款和声明。 2、 从scale-across、scale-out到scale-up、scale-in，光互联渗透率逐步提升。 当前scale-across、scale-out等长距离传输使用的是光纤，而 scale-up、scale-in等短距离场景使用的更多的是铜 缆。当前AI集群scale‑up流量占数据中心总流量 85%， 传统铜缆受物理限制无法实现跨机架 XPU等高速互联， 集成光学是突破铜互连物理瓶颈、支撑大规模 XPU全互连的关键路径，因此 NPO、CPO等集成光学方案具备 明确的部署必要性。 图表1：当前不同场景的铜连接与光连接 图表2：未来不同场景的铜连接与光连接 资料来源：Marvell，中信建投 资料来源：Marvell，中信建投 NPO（Near‑Package Optics，近封装光学）是Marvell面向scale-up互连提供的集成光学封装形态之一，其核心 优势在于支持现场可更换、故障影响半径小、网络可重配置性强，适配看重运维灵活性的客户需求。 Marvell管 理层提到，其NPO方案将Fast Pipe、Flat Pipe等光引擎放置在XPU、交换芯片邻近的板卡位置，缩短高速电信 号走线距离，同时保留光引擎可独立更换、现场运维的工程优势，规避 CPO早期封装、热管理与维修难题。 CPO（Co‑Packaged Optics，共封装光学）是Marvell面向远期更高性能的 scale‑up终极技术方案，同时也是集成 度最高的光学方案，可实现最优性能、最低延迟与最低功耗，适配看重极致性能的客户。比如， CPO方案可以 将Flat Pipe光引擎ASIC（内部集成驱动芯片、 TIA、控制器、模拟SerDes）与XPU、交换芯片共同集成至同一 个封装基板，最大程度压缩电信号传输路径，并通过取消 DSP等方式进一步降低延迟与功耗。 图表3：NPO方案具备可现场更换等优点 图表4：CPO方案具备低延迟低功耗等优点 资料来源：Marvell，中信建投 资料来源：Marvell，中信建投 我们认为，scale-up领域中光互连将成为主流连接方案， NPO将率先放量，CPO则是性能及功耗更优的终局方 案。随着Scale-up的domain逐步增加，信号传输带宽的不断提升，电信号在金属介质中传输距离受到很大的限 仅供内部参考，请勿外传 2 行业简评报告 通信 请务必阅读正文之后的免责条款和声明。 制，同时传输过程中也会产生大量的热，功耗更大，影响 GPU、XPU和交换机芯片的性能，而光互连能够解决 距离、带宽等瓶颈。针对 scale‑up场景，Marvell同步推进NPO和CPO技术路线，将提供三类均适配 NP O或 CPO的产品：一是直接提供驱动芯片（ Driver）、跨阻放大器（TIA）等核心芯片；二是面向超大规模云厂商提 供Fast Pipe和Flat Pipe两类集成化光引擎产品。 3、 scale-up互联协议百花齐放，Marvell支持UALink、E SUN以太网等主流协议。 Marvell基于Teralynx平台的51T产品量产放量，预计下一财年大幅超过 10亿美元。旗舰Teralynx T100是首款 且唯一在完整100Tb/s带宽下运行的单片全光罩极限尺寸裸片，集成 512个200G SerDes，延迟较主要竞争对手 降低约20%或更多，功耗更低，后续布局200T、400T以太网交换芯片。相较于已经成熟出货的scale-out侧的 产品，scale-up侧的产品正处于爆发前夕，公司推出支持 UALink、ESUN等协议的scale-up侧芯片产品。 图表5：Marvell Switch芯片规划 图表6：Marvell Switch芯片规划 资料来源：Marvell，中信建投 资料来源：Marvell，中信建投 近期国内对于超节点关注度极高，而超节点的核心之一则是 scale-up域的扩大，为节点内的 GPU提供高速互联 的带宽，而性能优异的 scale-up软（协议）硬（芯片）则是关键。当前针对 scale-up能够提供成熟软硬件解决方 案的主要是英伟达（NVLink）以及华为（UB），这两家公司在计算以及网络能力方面均有深厚的积累。对于其 他厂商而言，亦在积极探索，一是网络交换芯片厂商，如 Broadcom、Marvell、盛科通信、楠菲微等，基于开源 的ESUN、SUE、UALink等协议，打造针对scale-up域的switch芯片，并适配各个GPU公司；二是像寒武纪、 海光信息、平头哥等 GPU公司也在积极地研发scale-up域相关的switch芯片，并在自己的GPU集群中试点应 用。预计在未来的一至两年内， scale-up相关的协议仍将是并行发展的态势，短期内或不会收敛，但大致可以分 为以太和非以太路线。 但不管哪种路线，集群内的互联都将是未来增速最快的方向之一。 4、风险提示。 云厂商资本开支不及预期， AI商业化进程不及预期， NPO/CPO商业化进程不及预期 。NPO各家方案众多，供 应链适配存在一定难度； CPO当前成本高于传统可插拔方案， 削弱系统 TCO优势， 目前供应商集中于Broadco m、 NVIDIA、 台积电及其生态合作伙伴 ， 缺乏成熟标准与开放生态 。国际环境变化对供应链的安全和稳定产生影响， 对相关公司向海外拓展的进度产生影响 ；关税影响超预期；市场竞争加剧，导致毛利率快速下滑 ；汇率波动影 响外向型企业的汇兑收益与毛利率，包括 ICT设备、光模块/光 nt": "📄鹏鼎控股：董事长调研：AI 服务器及光模块 PCB 需求增长，推动加速扩产近期，我们在深圳与鹏鼎控股（002938.SZ，未覆盖）董事长开展走访交流。 交流核心议题包含：①光模块 PCB 增长前景；②AI 服务器 PCB 业务机遇；③覆铜板（CCL）成本情况；④PCB 产能扩张规划。 整体来看，管理层对 AI 需求崛起以及 PCB 规格升级持乐观态度，公司持续扩充 AI PCB 产能，以此把握高速光收发模块、AI 服务器带来的增量收入机会。 管理层强调，公司在改良型半加成法（mSAP）工艺以及高端 HDI 解决方案方面积累了丰富经验，能够支撑客户向要求不断提升的全新 AI 平台完成产品迁移。 横向参考：管理层对于 AI PCB 的乐观表态，与我们对 AI 基础设施上行周期的积极判断保持一致。 我们预判：①AI 服务器以及高速交换机的 PCB 规格将迎来升级；②AI 服务器当中 PCB 与覆铜板（CCL）的单车价值量将会提升；③全球范围内 AI PCB、更多资料加微信:wuxl3408覆铜板（CCL）需求持续上行；④对比传统主流 PCB 产品，AI PCB 与覆铜板（CCL）拥有更高平均售价以及利润率，将利好头部 PCB、覆铜板（CCL）公司，支撑其未来数年业绩实现强劲增长。 给予买入评级：ZDT、胜宏科技、维信电子、沪电股份、深南电路。 鹏鼎控股持有 ZDT 70‑80% 的绝对控股权。 鹏鼎控股依托 ZDT 平台运营多处生产基地，布局包含中国大陆、中国台湾、泰国以及印度。ZDT 为全球 PCB 头部供应公司，销售额市场份额位居全球第一；该公司于 2023 年在中国深圳启动 ABF 载板业务，在全部 ABF 载板供应公司当中，其来自中国市场的 ABF 业务收入占比最高。 ✨核心要点 🔹1. mSAP 工艺 PCB 产能扩张：公司持续为光收发模块客户推进改良型半加成法（mSAP）PCB 产线爬坡，主力供应 800G、1.6T 相关产品。 🔹 管理层表示，公司是 mSAP 技术领域的早期入局公司。 🔹 伴随 2027 年起 1.6T 及以上规格光模块需求提升，公司计划持续扩张 mSAP 产线产能。 🔹 管理层同时提到，公司也正和客户联合研发 NPO、3.2T 光模块对应的 PCB 产品。 🔹2. 覆铜板（CCL）成本：整体上，管理层判断，受旺盛需求驱动，覆铜板（CCL）的平均售价将会继续上行。 🔹 管理层表示，公司已经和上游供应公司建立深度合作关系，以此保障原材料供给。 🔹 在 PCB 产品定价策略层面，管理层称公司会综合考量三大因素：①上游原材料成本；②客户接受程度；③特定产品的供需格局。#文字观点", "publish_time": "2026-10-14 11:20", "tags": ["文字观点"]}, "post:2026-10-14T12-00:4f01dfb7abf9": {"id": "post:2026-10-14T12-00:4f01dfb7abf9", "kind": "post", "title": "2026-10-14 12:00", "source_label": "帖子正文", "excerpt": "高盛——中国PCB行业——鹏鼎控股（002938.SZ）董事长调研：AI服务器与光模块PCB需求升温；强劲需求驱动产能扩张加速 高盛近期在深圳与鹏鼎控股（002938.SZ，未覆盖）董事长进行了实地调研，核心议题聚焦四大维度：（1）光模块PCB增长前景", "content": "高盛——中国PCB行业——鹏鼎控股（002938.SZ）董事长调研：AI服务器与光模块PCB需求升温；强劲需求驱动产能扩张加速 高盛近期在深圳与鹏鼎控股（002938.SZ，未覆盖）董事长进行了实地调研，核心议题聚焦四大维度：（1）光模块PCB增长前景；（2）AI服务器PCB机遇；（3）覆铜板（CCL）成本走势；（4）PCB产能扩张规划。鹏鼎控股为全球PCB龙头臻鼎科技（ZDT，未覆盖）的控股子公司，ZDT持股70%—80%，鹏鼎运营网络覆盖中国大陆、中国台湾、泰国及印度。ZDT为全球市场份额第一的PCB供应商，2023年起在深圳切入ABF载板业务，且在中国ABF载板供应商中对华收入敞口最高。 • 核心增长逻辑：AI基础设施上行周期中的PCB规格升级与价值量跃升 管理层对AI需求持续升温及PCB规格升级持明确乐观态度，公司正加速扩充AI PCB产能以捕捉高速光模块与AI服务器带来的增量收入机会。管理层强调，公司在mSAP（改良型半加成法）及高端HDI方案领域积累了深厚经验，能够有效支撑客户向更高技术要求的新AI平台迁移。高盛指出，管理层对AI PCB的积极表态与高盛关于AI基础设施上行周期的判断形成共振。高盛预期：（1）AI服务器与高速交换机PCB规格将持续升级；（2）AI服务器中PCB及CCL的单机价值量（dollar content）将显著提升；（3）全球AI PCB及CCL需求将保持强劲增长；（4）相较于主流PCB，AI PCB及CCL具备更高的平均售价（ASP）与利润率，这将持续利好领先PCB及CCL厂商，并支撑其未来数年强劲的盈利增长。高盛当前买入评级标的包括：臻鼎科技（ZDT）、胜宏科技、沪电股份、生益科技、深南电路。高盛此前已将2027年全球PCB/CCL市场规模（TAM）预测分别上调38%/18%。 • 关键调研要点 1. mSAP PCB产能扩张：卡位1.6T及以上光模块升级浪潮 公司正持续爬坡面向光模块客户的mSAP PCB产线，目前主力产品为800G/1.6T光模块PCB。管理层强调公司是mSAP技术的早期进入者，具备先发优势。受2027年起1.6T及以上光模块需求放量的拉动，公司计划继续扩大mSAP产线产能。同时，公司正与客户合作开发NPO（近封装光学）及3.2T光模块PCB产品，提前锁定下一代技术迭代红利。 2. CCL成本与定价策略：供需紧平衡推升ASP，深度绑定上游保供 管理层预计，受强劲需求拉动，CCL整体ASP将继续上行。公司已与上游供应商建立深度合作伙伴关系以确保原材料供应安全。在PCB定价策略上，管理层明确将综合考量三大变量：（1）上游材料成本；（2）客户接受度；（3）特定产品的供需格局，在成本传导与份额维护间寻求动态平衡。 • 投资映射与策略启示 本次调研进一步验证了高盛对中国PCB/CCL板块在AI算力驱动下的结构性看好逻辑。AI服务器与高速光模块对PCB的层数、材料（高频高速CCL）及制程精度（mSAP/HDI）提出严苛要求，技术壁垒与价值量同步抬升，行业份额将持续向具备高端制程能力的头部厂商集中。鹏鼎控股凭借mSAP先发优势及全球化产能布局，有望在AI PCB增量市场中占据可观份额。#文字观点", "publish_time": "2026-10-14 12:00", "tags": ["文字观点"]}, "post:2026-10-14T08-44:a388fbfa511b": {"id": "post:2026-10-14T08-44:a388fbfa511b", "kind": "post", "title": "2026-10-14 08:44", "source_label": "帖子正文", "excerpt": "市场调整后机构交流内部策略观点： 本轮真正持续赎回的主力，是二季度高位进入科技的保险和固收+资金。按规模加权，固收+基金与科技的相关系数从2025年的0.145升至今年二季度的0.24，目前已回落至0.149", "content": "市场调整后机构交流内部策略观点： 本轮真正持续赎回的主力，是二季度高位进入科技的保险和固收+资金。按规模加权，固收+基金与科技的相关系数从2025年的0.145升至今年二季度的0.24，目前已回落至0.149；等权口径也从0.13升至0.194，再回到0.14。两种口径都指向同一结论：二季度新增科技仓位大约已出清70%至80%，仍有20%至30%待消化，即保险资金的科技筹码出清已进入后程。时间进入10月后，部分险企开启2027年“开门红”业务部署，新的保费也会带动新的险资增量资金。 与此同时，9月以来科创50、创业板和中证2000等ETF依然持续获国家长线资金持续流入（7-9月的流入力度是过去2年最强的），周五集中承接+证 监会/新质生产力等政 策信号集中释放，这意味着，前低（3741）位置底部区域较为明确。A股容易因资金负反馈循环产生短期超跌，而这种超跌又都会孕育着一波反弹机会。 但需要指出的是，主要指数跌破年线后，市场对科技和牛市的怀疑明显上升。投资者逢反弹减仓的“牛市心态”被打破或可能对未来科技反弹的高度产生影响。 8月以来，纳指100、费城半导体指数分别上涨8.7%、11.6%，科创50、创业板指却分别下跌10.9%、9.0%。海外持续交易AI资本开支扩张，A股却反复交易远期政 策风险，预期差正在扩大。A股与美股科技板块分化原因主要在两个层面。资金层面，高美债利率带来的高融资成本环境下，高增长资产愈发稀缺，全球AI领域投资资金集中回流美股AI核心标的，是美股AI科技表现更具韧性的首要原因；A股AI板块此前交易拥挤度高、估值偏高，在资金流出压力下出现明显下跌。 风险层面，节后科技板块连续受到FCC制裁光模块、PCB涉军传闻、337电源调查、欧盟准备动用贸易工具等外围消息扰动，导致A股AI相关标的存在出口供应链风险，形成估值折价和风险偏好折价，该因素在当前市场缩量、弱预期环境下存在过度定价悲观预期的可能。但问题在于，市场正把“潜在风险”当成“确定利空”。真正值得警惕的应该是海外CAPEX下修、订单增速拐头、产品价格及利润率持续恶化，而不是股价下跌后，倒过来寻找产业见顶的理由。 本轮下跌始于中美元首会晤后，美债收益率破5%。3月以来，霍尔木兹海峡封锁造成全球供应链中断和各国对美债的抛售，是本轮美债利率上升的主因，美国存量债务和AI资本开支仅是放大器。基准情景是特朗普在10月选举压力下回到务实框架，美伊达成阶段性协议，油价和美债收益率有所回落；若继续拖延，选举失利后的党内和国会约束也会迫使其转向。区别只是拐点出现在10月、11月，还是最迟明年1至2月。 AI硬科技方向的持续性行情需等待美债（全球流动性贴现率）压力缓解、中美科技供应链担忧边际缓和，以及国产链订单业绩超预期后，有望触发超跌反弹行情。本轮科技股调整因以上宏观预期层面压制，而非基本面因素，国产链三季度业绩预期参考小秘圈内卖方梳理的表格，并未出现导致国内芯片产业盈利预期显著下修的催化因素，电子信息制造业8月收入增速较7月环比微升，叠加韩国存储厂商扩产预期，国内AI资本开支、半导体设备的盈利预期均处于上修通道。 硬科技中的北美链近期受中美AI产业趋势的干扰更多，中美的AI产业脱钩是中期确定性趋势，双方均有自主可控的意愿；FCC限制并不影响2026年的盈利，但是会限制2028年新技术带来估值扩张空间，所以跌的是远期估值；FCC限制只是大摩的预测，实际开会等到10月27日，所以“利空”尚未落地；国内光模块、光通信厂商目前仍无法脱离海外供应链，相关标的相对海外科技公司将长期存在估值折价；若转型国产算力供应链，将面临利润水平下降的问题。 当前美债长端利率易涨难跌，但继续创新高的难度不断提升，市场需实现对高利率的脱敏，核心是AI相关标的盈利上升斜率超过利率上涨幅度。景气验证窗口在2026年10月下旬到11月的三季报披露期，海外AI龙头、国内科技公司的三季报是产业景气度的重要验证节点，若盈利增长斜率能够覆盖利率上升幅度，资产价格将出现对冲式上涨。当前AI板块经历约1个季度的情绪消化，交易拥挤度已回落至低位；虽然宏观因素变差，但AI产品数据和叙事变好，三季度临近更加关注个股业绩和催化。 美国中期选举最新进展以及相关影响。截至2026年10月10日，海外博彩平台数据显示，民主党同时拿下参众两院的概率约为60%，民主党拿下众议院、共和党保住参议院的概率约为30%。特朗普明确表示中期选举前不会攻击伊朗，美伊谈判具有建设性，预计选举前油价波动将有所缓和。假如共和党掌控两院，对美股最利好；假如民主党拿下众议院、共和党保住参议院，美股后续倾向于上涨；假如民主党同时拿下参众两院（概率最高），是当前海外市场最担心的情景，民主党或将推出更严格的企业监 管和税收政 策，削弱总统推动AI投资等产业政 策的能力，导致美股存在调整风险，美元、美债收益率也有回落空间。 10月短期来看，市场处于箱体震荡下沿，具备超跌反弹基础，核心支撑包括ETF增量资金流入、证 监会座谈会释放稳定市场信号、海外油价和美债利率未出现边际恶化、10月美联储无加息风险。若国内政 策、经济预期未发生根本性变化，反弹空间上看上证综指4000点附近存在明显阻力；如果后续年底中央政治局会议、中央经济工作会议的政 策预期升温，反弹空间可能有所上升，但目前政 策预期整体偏温和，反弹幅度不会太大。超跌反弹的基础是超跌甚至错杀的品种。 年内中期来看，当前市场整体环境存在边际走弱的压力，基本面方面，国内内需尚未出现明显回暖，海外利率处于上升通道，若后续利率上升过快，海外经济可能出现明显下行；行业层面，AI资本开支目前仍保持较强韧性，但边际上已经出现转弱趋势，中期选举后相关板块环境可能比当前更差，包括数据中心建设进度等环节都有走弱可能，对机构来说接下来当不适合继续像上半年一样大举加仓和全面平铺硬科技板块，但也无法直接判定AI、费城半导体指数已经见顶，所以会缩圈聚焦于更有景气度超预期与估值空间上修预期的预期差与性价比品种（国产链+海外链小光），而非抱团预期与估值已提前透支共识但逻辑与资金面已出现破坏的散户集中营与大市值品种（海外链大光），并且考虑其他行业自下而上微观机会或低位有催化的相关主题炒作机会（网络安全+短剧主题等）。 机构对后市走势的基准判断，未来1-2个季度市场整体处于偏震荡状态，目前箱体震荡的下沿基本确立，可以先参与当前的反弹行情，结构性行情仍会延续一段时间；第一阶段（9月下旬，小反弹）：加息落地利空出尽后估值修复。第二阶段（10下旬-11月，中大反弹）：产业催化下的业绩驱动行情，10月下旬美股AI龙头三季报及后续资本开支指引，国内10月底A股三季报披露，这是AI产业景气重要验证期。若届时长端利率随财政预期降温回落，那么AI科技年内第二波将毫无疑问。第三阶段（11月-12月）：存在估值切换与地缘政治的波动，届时观察增量资金环境能否改善、机构重仓股调整是否充分，且美联储加息节奏、国际关系等外部不确定性是否更为清晰。拉长到1年维度，市场下行概率会随时间推移不断上升，历史经验牛市不过三年，整体偏谨慎，预期收益需要相应降低，逢高减仓，除非后续海外经济下行后国内出台强政 策拉动内需，才有可能出现风格切换、走出结构牛行情，目前该假设暂不成立。操作上不需要在短期反弹后立刻急于大幅减仓，但要做好长期市场下行的战略准备。---xz#文字观点", "publish_time": "2026-10-14 08:44", "tags": ["文字观点"]}, "post:2026-10-14T07-24:4c837c61ff36": {"id": "post:2026-10-14T07-24:4c837c61ff36", "kind": "post", "title": "2026-10-14 07:24", "source_label": "帖子正文", "excerpt": "202601013复盘 宏观： 1. 霍尔木兹和阿曼湾一天之内有6艘商船遇袭。2. 胡塞武装称，“沙特阿美旗下石油设施将成为其合法打击目标”。", "content": "202601013复盘 宏观： 1. 霍尔木兹和阿曼湾一天之内有6艘商船遇袭。 2. 胡塞武装称，“沙特阿美旗下石油设施将成为其合法打击目标”。 人工智能： 1. 建滔积层板对使用2116及以下薄布为原材料的板料及PP提价15%。 2. 松下发布电子线路板材料价格调整的通知，多种类覆铜板价格+200%。 3. 村田考虑进一步扩大产能以满足巨大的AI需求。 4. 国巨预计新一轮涨价在26年10月底-11月落地，预计高容调价50%或更多、中低容10-30%。 5. 兴森科技Q3业绩超预期。 6. 美银10月调查显示，全球投资者对科技股持仓达2020年8月以来最高峰，半导体被评为全市场最拥挤交易；但45%受访者预期2027年出现AI泡沫，42%否定，多空分歧剧烈。 7. AMD 苏姿丰对CPU市场前景表达了强烈信心，并将2026年定性为\"推理之年\"。 8. 比尔盖茨：“网络攻击很可能将成为我们未来一年面临的最突出挑战。” 军工： 卖方：行业配置比例当前处于历史低位，考虑“十五五”规划有望落地并带动内需订单持续兑现。 航运： 卖方：“暗航穿梭”和红海绕行导致有效运力大幅收紧，地缘风险缓解和新船大规模交付之前（明年VLCC有效新增供给仅30艘），效率损失不可逆。 市场相关：更多加微WUXL3408 南华早报报道，将收紧对期货量化交易的监管，以遏制股市暴跌带来的风险。 策略观察： 1. 今日成交16891亿，增量1381亿。白天韩国跌+美股夜盘继续跌，加深了恐慌，指数居然开盘后直接冲到3741，都到3741了，那不V反而是超预期，韩国跌是存储自己的问题，除非美国大崩盘，不然我们很难击破3700。创业板还是没那么确定，破了2900又拉回来，还没找到震荡区间底部在哪，一个台阶一个台阶找，要不是美股也没顶住，我们也不至于今天开盘能这么惨，这波双创都是ai涨上来的，太吃美股了，但美股应该短期不至于崩盘，所以我们每一层台阶也是一步一步更扎实，连续跌了有人捞，谁还无脑卖呢。 2. 板块方面，军工、通信和商贸零售（消费题材）领涨，军工应该是偏布局思维的资金，冲着明年预期，不是短线流，科技跌那么多，给了个整体性反抽也无可厚非，但追也只能极个别结构，大部分都是一涨就需要回踩。 3. 题材方面，科技开盘修复领涨的是pcb和光模块设备，业绩披露都不错，重点还是筹码结构好，之前重点说过pcb这个优势，后面下午反弹起来就是普涨了，逻辑和筹码都相对好的上游器件弹性也挺好。纯投机也持续性，九阳继续带着羊年概念冲，善水带着化工涨价冲。今天盘面也简单，不多看了，三倍做多身体早点睡了。#文字观点", "publish_time": "2026-10-14 07:24", "tags": ["文字观点"]}, "post:2026-10-14T07-56:0f2cef84e734": {"id": "post:2026-10-14T07-56:0f2cef84e734", "kind": "post", "title": "2026-10-14 07:56", "source_label": "帖子正文", "excerpt": "美国中期选举观战指南知识星球-安全中心纳指高位盘整还是向上突破？- 港股&海外周论知识星球-安全中心策略周论：继续等待知识星球-安全中心宏观策略周论：跌到位了吗？", "content": "美国中期选举观战指南知识星球-安全中心纳指高位盘整还是向上突破？- 港股&海外周论知识星球-安全中 甚至以下，实质上仍然需要结合 EPS 增长率，若EPS仍有5%以上增长，不考虑税收和摩擦成本，隐含回报率在 10%。同时还需要考虑大类资产的 预期回报率比较，如果某些板块短期股价大幅拉升，在存 量市场博弈下，拉平后的涨幅使得高股息的吸引力再 次体现，而全年对低利率环境的假设，也使得高股息的投资策略应该是年度为主。同时，对未来不确定性，高 股息得益于商业模式的稳定性值得享受一定的估值溢价。 以上是我们之前的策略观点，而更新的观点主要是港股的资金来源发生了很大变化， 一方面跨境E TF规 模在扩大，另一方面外资通过 E TF方式也在进入港股市场，这给港股铁公基资产带来更多的资金流 。而在A 股层面，行业因子或者基本面因子当下并不是决定股价的主要矛盾。我们比较了过去两年 ETF在铁公基各个标 的中的配置比例。研究发现， ETF持股比例超过主动规模，多数高股息标的甚至沪深 300权重股很多都已经被 指数资金所定价。我们认为驱动2026年红利资产的因素：（ 1）全市场预期的回报率是否会回落到 20%以内； （2）美联储降息的速度与空间；（ 3）红利资产本身的基本面变化，如高速公路、高铁等价格体系的修正。我 们仍然看好优质红利资产如皖通高速、京沪高铁等核心资产。 风险分析 高铁建设速度不及预期 近年来高铁建设快速发展的过程中，部分地区存在盲目建设高铁、地铁现象，出现“重高速轻普速、重投 入轻产出”等情况，导致铁路企业面临较大的经营问题，债务压力倍增。若部分建成高铁经营问题较大，或将 导致高铁建设速度放缓，全国高铁组网进程放慢，从而导致全国高铁网络不平衡性持续性超出预期，带来高铁 企业业绩提升放缓。 能源价格大幅提升风险 受国际原油价格波动影响，能源价格存在大幅度上涨的风险。其次，俄乌冲突带来国际能源市场不稳定性 增加，导致国内能源安全保障面临一定压力，能源价格存在大幅提升风险，带来铁路企业成本大幅上涨。 其他运输方式的竞争风险 高速铁路具有准点率高、载客量大、经济舒适、受自然气候影响小等优点。 2016-2019年京沪高铁持续优 化列车开行方案，客座率稳步提高、列车开行质量不断提升，与公路客运、航空客运形成了差异化竞争的局面。 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 7 铁路公路 行业动态报告 请务必阅读正文之后的免责条款和声明。 但是，如果未来公路网持续扩张完善、航空客运准点率和服务水平不断提高，仍可能影响旅客出行选择，如果 出现大幅影响旅客周转量的情况，将对公司的经营产生一定负面影响。 清算政策调整的风险 由于铁路行业“全程全网”的业务特点，需要不同铁路运输企业之间相互提供路网服务。为建立铁路运输 企业之间公平、公正、公开的清算秩序，原铁道部、原铁路总公司先后制定了《铁路运输进款清算办法》（铁 财〔2005〕16号）《中国铁路总公司关于明确有关财务清算事项的通知》（铁总财〔 2016〕230号）等相关规 定。2016-2018年，清算政策保持了基本稳定，确保了铁路运输进款清算的顺利进行，京沪高铁也实现了良好 的经济效益。未来随着生产要素价格水平提高、路网服务质量提升、行业特点及供求关系变化，国铁集团清算 项目、清算范围、清算价格可能出现调整，如果出现不利变化，将对公司的经营业绩产生一定影响。 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 8 铁路公路 行业动态报告 请务必阅读正文之后的免责条款和声明。 分析师介绍 梁骁 交运行业分析师，南开大学硕士，先后供职于中集集团物流板块、顺丰控股、京东物 流，曾参与撰写《国家多式联运标准修订建议报告》并为交通物流相关十四五规划建 言献策，2022年加入中信建投证券研究发展部，覆盖快递快运 /仓储运输/供应链物流/ 跨境物流/铁路货运/航空物流，具有丰富的交运物流行业研究经验以及资源，擅于把 握和挖掘公司长期价值，工作地北京。 韩军 全球交通运输及全球能源首席分析师，曾供职于上海国际航运研究中心， 3年政府规 划与市场咨询经验，曾负责或参与为交通运输部、上海市交通委、港航企业等提供决 策咨询服务二十余项。 10 年交通运输行业证券研究经验，深入覆盖航运、港口、高 铁、快递、物流板块，擅长把握周期性和政策性投资机会。 2021第十九届新财富最 佳分析师交通运输行业第五名。 宗枫 中信建 赛道、拥有差异化管线组合的平台型公司 ，复宏汉霖、映恩生物、信立泰、 泽璟制药等；（3）在控费环境下仍能通过产品升级和结构优化保持利润增厚的具有强竞争力的真创新产品公司 ，中国生物制药、海思科、迪 哲医药、艾力斯等。 CXO板块：海外整体需求稳健，国内需求逐步回暖，弹性更强，持续看好 CXO板块成长空间。海外投融资大环境进入季度间波动，不同阶段、不 同疾病领域的CXO服务需求进一步分化，国内投融资活动景气度持续上行，弹性更强，持续看好 CXO板块成长空间。AI对制药及医药外包行业影响 短期有限、但市场对新技术对长期的行业发展变革的影响已初步达成共识，早期研发阶段（ CRO）影响呈分化趋势，生产段（ D、M）整体利好。 近年来在新一代生物药、 ADC、多肽药物快速发展下，相关 CXO需求迅速增加，双多抗、新一代 ADC/XDC、小核酸等细分领域也有望迎来新的发 展阶段。长期来看，我们看好 CXO板块发展潜力及成长空间。 上游板块：国内市场需求逐步恢复，产业链国产替代仍是趋势。 制药产业链板块当前呈现 “利润修复、国产化率提升与国际化 ”并行的特征。制药 产业链整体营收已企稳，毛利率和净利率持续回升。头部企业通过产品结构优化、降本增效和国际渠道布局，实现了利润端的改善。整体来看，行 业长期受益于国产替代（政策驱动、性价比优势）和需求回暖，反映行业整体逐步企稳并处于复苏通道 。未来行业将通过并购整合加速国产化进 程，头部企业有望在政策红利下突破技术壁垒，提升市场份额。 下载日志已记录，仅供内部参考 创新药：恒瑞医药 SHR-1139和SHR-1819二期数据入选 EADV口头报告 第35届欧洲皮肤病与性病学会年会（ EADV）于2026年9月30日至10月3日在奥地利维也纳举行。大会期间，恒瑞医药自主 研发的IL-23p19/IL-36R双抗SHR-1139注射液、IL-4Rα单抗卓托奇拜单抗注射液（ SHR-1819）的两项研究入选口头报告。 SHR-1139治疗中重度斑块状银屑病 II期研究中期分析显示，第 16周主要终点PASI90应答率各剂量组均显著优于安慰剂组（均 P\u003c0.0001），其中600mg组达92.7%；在仅给药1次或2次方案下疗效可稳定维持至 1年，600mg单次给药组一年PASI90应答 率为90%、PASI100应答率为65%。 SHR-1819治疗成人结节性痒疹 II期研究结果显示，第 16周600mg负荷+300mg Q2W组WI-NRS较基线降低≥4分的受试者比 例为63.3%，优于安慰剂组的 40.0%。IL-23p19/IL-36R双抗、IL-4Rα单抗两项研究入选口头报告 资料来源：公司公告，Insight，中信建投 图：SHR-1139 项目临床进展 3下载日志已记录，仅供内部参考 42026年9月28日，Summit Therapeutics 宣布阿斯利康拟以 20亿美元认购其新发行的可转换优先股，对应转股价格 18.36美 元/股，即前一周五个交易日的成交量加权平均价（ VWAP）加10%，预计本周内交割。同时，双方达成依沃西单抗临床合作： 拟近期探索其与阿斯利康 Sone-Ve在部分GI肿瘤中的联用。另外，双方另签署谅解备忘录，拟进一步开展依沃西与阿斯利康多 款肿瘤药物（包括 ADC）的联合临床研究。 本次合作将ADC组合拓展为跨瘤种治疗的骨架，并与下一代免疫治疗联合。阿斯利康希望将 ADC打造为跨瘤种治疗方案的基础 药物，并与下一代免疫治疗联合，拓宽 ADC的适用人群与治疗获益。此次合作中，依沃西单抗作为 PD-1/VEGF双抗，一方面与 CLDN18.2 ADC Sone -Ve探索GI肿瘤联合治疗，另一方面拟与阿斯利康多款 ADC及其他抗肿瘤药物开展组合研究。 Summit表 示，依沃西单抗与包括 ADC在内的新型抗肿瘤药物联用，旨在结合肿瘤细胞杀伤、抗肿瘤免疫及肿瘤微环境等互补作用。创新药：阿斯利康 20亿美元入股 SUMMIT，依沃西全球价值跃升 Summit获阿斯利康20亿美元战略入股，推进依沃西联合其 CLDN18.2 ADC开发 资料来源：公司公告，中信建投要素 内容 投资方 阿斯利康 投资总金额 20亿美元，认购可转换优先股 入股价格 对应普通股价18.36美元/股 认购股数 约108,955股可转换优先股 定价基准 前一周五个交易日的成交量加权平均价（ VWAP）加10% 股数/ 转换比例 约108,955股优先股，按1:1000转换为普通股表：Summit Therapeutics 与阿斯利康战略股权投资核心要素 下载日志已记录，仅供内部参考 510月6日，ArriVentBioPharma公布产品甲磺酸伏美替尼片单药治疗既往未经治疗、携带 QD。 疗效方面：非小细胞肺癌 cORR35.7%，mPFS5.5个月，mOS13.4个 月；胰腺癌cORR35.1%，mPFS5.5个月，mOS9.9个月，且疗效呈 线数梯度（二线、三线、四线的 ORR为62.5%，31.3%，23.1%， mPFS为6.9、5.5、4.1 个月），支持往前线推进。 ≥3 级TRAE 36.5%， 总体可控，既往免疫治疗史者毒性更高。肠癌疗效欠佳（ 9 例仅1 例缓 解），未来或需联合抗 EGFR。 安全性方面，3 级及以上治疗相关不良事件 36.5%，以恶心、呕吐、腹 泻为主，既往用过免疫检查点抑制剂者更高（ 42.9% vs 28.1%），大 多停留在1–2 级，1 例5 级事件为感染性休克。创新药： GFH375临床I期结果发表于 NatureMedicine 劲方药业口服KRAS G12D抑制剂I期详细结果公布 资料来源：公司公告，Nature Medicine，中信建投图：GFH375的抗肿瘤活性 下载日志已记录，仅供内部参考", "status": "extracted"}, "post:2026-10-14T12-01:42b532b6be83": {"id": "post:2026-10-14T12-01:42b532b6be83", "kind": "post", "title": "2026-10-14 12:01", "source_label": "帖子正文", "excerpt": "瑞银——全球电池供应链——AIDC与电池专家电话会纪要 瑞银举办全球电池供应链专家电话会，邀请前伊顿分布式电力基础设施副总裁兼总经理Herve Tardy，就AI数据中心（AIDC）电力基础设施展开深度解读，核心覆盖备用电池单元（BBU）、不间断电源（UPS）及电池储能系统（BESS）三大领域。• ", "content": "瑞银——全球电池供应链——AIDC与电池专家电话会纪要 瑞银举办全球电池供应链专家电话会，邀请前伊顿分布式电力基础设施副总裁兼总经理Herve Tardy，就AI数据中心（AIDC）电力基础设施展开深度解读，核心覆盖备用电池单元（BBU）、不间断电源（UPS）及电池储能系统（BESS）三大领域。 • UPS：高增、高毛利、强定价权 市场当前同比增速约20-25%，即便向800V直流架构转型可能短期压制增速，未来数年仍有望维持15%以上的复合年增长率。受产能瓶颈制约，当前交货期长达30-35周，价格较去年上涨约10%。设备端利润率强劲，净利润率可达20%。电池约占UPS系统总价值的15%。产品形态正由单纯备电向电能质量优化（滤波、削峰及微电网接口）演进。新增产能已全面转向锂离子电池，铅酸电池仅用于存量系统替换。市场欢迎安全性更高的电池化学体系以应对热失控风险，但镍锌（NiZn）及钠电（Na-ion）技术成熟度尚不足以替代锂电。三星SDI（评级买入）正扩大美国UPS产能布局。整体而言，UPS赛道具备持久的高增长、高毛利与强定价权特征。 • BBU：服务器级补电，非替代性增量 BBU主要应用于服务器（OCP标准及AI GPU/ASIC机架），不用于网络设备或传统企业场景。相比CBUs（超级电容）更擅长应对GPU瞬时功率尖峰（需瞬间再充电），BBU定位于秒级至分钟级备电。在单机柜功率密度迈向600kW-1MW的高密场景下，电池大概率将从机柜内（白区）移至机房公共区域（灰区）形成池化资源。超大规模云厂商偏好集成系统而非离散组件。价格优先级低于保护性能与响应速度。对电气OEM厂商而言，BBU是UPS业务的补充性增量，而非替代关系。 • BESS：长时备电互补，无份额侵蚀 BESS面向长时运行（作为柴油发电机替代方案，备电小时级），BBU覆盖短时备电，UPS则承载其余负载及过渡需求。近期BESS需求走强得益于电动汽车需求疲软带来的电池价格走软；若EV市场复苏，电池供应趋紧可能反向制约BESS。BESS对UPS呈增量互补关系，不构成份额威胁。 • 重点标的与估值风险 三星SDI（006400.KS，买入，目标价未披露）为本次电话会核心受益标的。瑞银基于分类加总估值法（SOTP）给予定价。关键上行风险包括：电动汽车需求复苏快于预期、斩获新OEM客户，以及美国政策对EV的扶持立场；关键下行风险涵盖：各国监管及原材料价格波动、核心客户智能手机出货调整、EV渗透率变化、OLED材料业务进展不及预期，以及电池安全问题引发的诉讼与大规模召回。电池行业整体对安全事件及关税、采购规则、出口管制等政策高度敏感。#文字观点", "publish_time": "2026-10-14 12:01", "tags": ["文字观点"]}, "post:2026-10-14T13-10:485c1b528e31": {"id": "post:2026-10-14T13-10:485c1b528e31", "kind": "post", "title": "2026-10-14 13:10", "source_label": "帖子正文", "excerpt": "中国汽车出口：退税下调正式落地，预计分三个阶段提高均价10 月 12 日，财政部宣布新能源汽车出口增值税退税率由 13% 下调至 9%，政策将于2027 年 4 月 1 日正式生效，政策覆盖全部新能源汽车品类，包含乘用车与商用车。政策落地时间以及调整幅度符合市场预期，但此次出口退税下调公告发布在中欧", "content": "中国汽车出口：退税下调正式落地，预计分三个阶段提高均价10 月 12 日，财政部宣布新能源汽车出口增值税退税率由 13% 下调至 9%，政策将于2027 年 4 月 1 日正式生效，政策覆盖全部新能源汽车品类，包含乘用车与商用车。 政策落地时间以及调整幅度符合市场预期，但此次出口退税下调公告发布在中欧插混汽车协议声明之后，叠加 9 月国内乘用车销量疲软，以及我们对 2026 年第四季度保守的预判（2026 年第四季度国内电动汽车同比下滑 11.3%），大概率会引发短期市场的负面情绪。 相较于奇瑞、上汽，比亚迪、吉利的新能源汽车出口占比更高，两只标的短期交易情绪或将受到相对更大的冲击。 不过基本面层面的下行风险有限，退税下调仅占到海外乘用车零售价格的 1.6‑2%，公司可以通过缩减经销商返利、上调厂商建议零售价，或是依托规模效应、更多资料加微信:wuxl3408锂价下行带来的成本缩减轻松消化该部分影响。 叠加欧盟潜在配额政策，我们进一步预计从 2027 财年开始，中国乘用车海外售价将会迎来温和上调，涨价分为下面三个阶段推进。 中国出口退税下调带来的影响 国内整车公司的出口退税是按照车辆离岸价进行核算。 根据我们测算，海外乘用车零售价格是中国离岸价格的 2‑2.5 倍，该价差主要来自进口关税、物流、当地认证费用以及经销商利润。 我们估算，退税下调仅占到整车公司海外乘用车零售价格的 1.6%‑2.0%，实际影响有限，可以由汽车制造公司、经销商共同消化，甚至可以传导至终端市场。 2027 财年中国整车综合均价或将分三阶段抬升 我们预计，销往欧盟的中国产混动汽车价格将自 2027 年起分三阶段上行，核心逻辑如下；10 月 11 日彭博社消息显示，混动车型总配额为 35 万台，该配额主要依靠产品结构升级（在有限配额内整车公司优先投放高价值车型），叠加适度缩减经销商折扣，推高中国产混动汽车在欧盟市场的综合均价。 第一阶段：配额初期大概率为固定总规模，首年配额总量为 35 万台。整车公司会优先投放高毛利、高均价车型，不再主推低价入门混动车型，这会推高出口综合均价。此前基准预测假设大量低价混动 HEV、插混 PHEV 车型出口，在配额约束下，上汽、吉利、比亚迪会把配额分配给更高配置、更高售价的版本，不再向欧盟市场大量投放低价入门车型，由此抬升全部中国混动车型出口的平均售价。 第二阶段：如果每一个自然年度内配额被提前耗尽，经销商会缩减折扣力度，甚至上调全部主力产品的销售均价；终端零售折扣收窄，实际成交价格上行，直至向大众、丰田、斯泰兰蒂斯这类全球主流品牌的价格水平靠拢。 第三阶段：在欧盟本土生产、不受配额约束的混动车型，会维持原有价格参与市场竞争，该因素会限制中国混动汽车的涨价空间。#文字观点", "publish_time": "2026-10-14 13:10", "tags": ["文字观点"]}, "post:2026-10-14T20-12:f52fe8676ffd": {"id": "post:2026-10-14T20-12:f52fe8676ffd", "kind": "post", "title": "2026-10-14 20:12", "source_label": "帖子正文", "excerpt": "20261014今日段子汇总 1、富春股份：1、参股公司东阳留白影视文化有限公司系短剧《风声之双生谜局》的出品方；2、公司持续深化 “精品游戏 + 知名 IP” 战略，目前拥有《仙境传说 RO》《古剑奇谭三》《秦时明月》《梦幻龙族》等众多优秀 IP的游戏研发授权 2、莱美药业：四川大学华西医院联合恩", "content": "20261014今日段子汇总 1、富春股份：1、参股公司东阳留白影视文化有限公司系短剧《风声之双生谜局》的出品方；2、公司持续深化 “精品游戏 + 知名 IP” 战略，目前拥有《仙境传说 RO》《古剑奇谭三》《秦时明月》《梦幻龙族》等众多优秀 IP的游戏研发授权 2、莱美药业：四川大学华西医院联合恩施州中心医院 价格高频均价较2025年总体上涨，逻辑在于需求持续增长、产 业链价格多年调整致部分产能出清，以及开工率提升，但不同细分 产品逻辑有差异。截至10月8日：碳酸锂价格12.20万元/吨，较 2026年初上涨1.67%，氢氧化锂价格较年初上涨3.11%。 维持行业“强于大市”投资评级。截至2026年10月9日：锂电池和 创业板估值分别为19.56倍和36.21倍，结合行业发展前景和估值 水平，维持行业“强于大市”评级。结合锂电池行业发展趋势、国 内外新能源汽车行业发展特点、锂电产业链价格走势以及细分领域 业绩概况，建议持续围绕三条主线布局。 风险提示：国内外宏观经济下滑超预期；新能源汽车销售不及预期； 行业政策执行力度不及预期；行业竞争加剧；细分领域价格大幅波动； 系统风险。 9484 下载日志已记录，仅供内部参考 第2页/共33页锂电池 本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明内容目录 行情回顾.........................................................................................................5 1.1.板块表现.........................................................................................................................5 1.2.豫股标的市场表现...........................................................................................................5 板块业绩概况.................................................................................................6 2.1.板块营收与净利润...........................................................................................................6 2.2.细分领域营收与净利润增速............................................................................................8 2.3.板块盈利能力..................................................................................................................9 2.4.板块分红........................................................................................................................11 2.5.行业高景气....................................................................................................................11 豫股锂电池业绩............................................................................................12 3.1.豫股锂电池业绩概况.....................................................................................................12 3.2.豫股标的业绩................................................................................................................14 锂电池出货高增长........................................................................................15 4.1.我国锂电池出口高增长....................................... 日均交互DAU 613万（C端504万/B端109万）/环比约+18%，MAU 2140万，总收入1.61亿/环比约+18%，付费企业数13,320家（8月10,350家）；后续渗透率提升+积分补贴减少+混元结束免费有望带来更大收入弹性。 ②混元模型：Hy4 preview 8/28发布并开源；Hy4正式版（770B总参数/49B激活）预计10月中下旬发布、能力超智谱GLM-5.3；下一代原生多模态版本（1T+参数）预计11月-12月，重点增强游戏开发、Agent、代码能力，有望超Kimi K3。 ③微信\"小微\"灰测比例已达10%、覆盖约1亿用户、年内有望更大规模放量。#【观点更新】​​考虑AI投入前置，我们预计26Q3收入yoy+9%、经调整净利润-3%，下半年出现单季度利润转负，与目前市场预期基本一致。预计2026-2027年经调整净利润2660/2754亿元，对应资本开支假设为2000亿/2500亿，对应当前估值12.5/12.1x，仍在底部区间震荡。近期建议关注：Hy4正式版发布节奏、三季报业绩兑现情况（11.18日）、微信\"小微\"测试进展、下半年CapEx投入情况、回购趋势等。 🎁专家调研及第三方数据仅供参考，详细数据库及更多观点请联系：国海海外 陈梦竹/尹芮#文字观点", "publish_time": "2026-10-14 07:42", "tags": ["【观点更新】​​", "文字观点"]}, "post:2026-10-14T12-00:b22cb0349c58": {"id": "post:2026-10-14T12-00:b22cb0349c58", "kind": "post", "title": "2026-10-14 12:00", "source_label": "帖子正文", "excerpt": "【建投电子】10月份核心推荐，“三华”组合领导，9月份中下旬，反弹一小段受美国加息宏观等扰动，导致科技等流动资产继续下杀，当前，我们认为科技迎来很好的布局窗口，Q4底部布局，等待反弹。我们推荐“三华”组合，华虹宏力、华峰测控、北方华创。", "content": "【建投电子】10月份核心推荐，“三华”组合领导，9月份中下旬，反弹一小段受美国加息宏观等扰动，导致科技等流动资产继续下杀，当前，我们认为科技迎来很好的布局窗口，Q4底部布局，等待反弹。我们推荐“三华”组合，华虹宏力、华峰测控、北方华创。“三华”组合背后，代表我们坚定看好自主可控，我们为什么继续看好？又回归我们对科技的初心：1）“十五五”时期是中国半导体产业从“追赶替代”跨越到“高水平自立自强”的关键历史节点，产业正迎来全链条攻坚的大周期；2）长鑫和长存2027年高斜率扩产（预计新增30万片），预计能维持好几年的，先进制造和成熟的Fab扩建陆续落地；3）景气度导致Q4产业备货期提前来，供应链短缺持续，自主可控具有科技的β以及自身内循环的a，还有一个长存上市的催化剂。 【华虹宏力】扩产速度加快，有能力承接AI需求外溢：资本开支方面，Fab 9A将在7月达到满产，设备已全部安装，Q3开始满载运行，另一座新厂9B于今年3月开工，2027年开始产能爬坡。Q3收入指引，预计收入在7.7-7.8亿美元之间，毛利率在16%-18%。 【华峰测控】基本盘下游封测和设计资本开支加速，叠加代工厂先进需求订单二次成长曲线。代表产品8600系列产品性能已实现与爱德万最高配置的5G版本93K测试机1:1对标，客户预期2027年需求达到100台，短期国内市场份额达到20%，长期达到50%，对应全球测试机的市场规模为116亿美元，公司的未来预期对应20亿元以上收入。 【北方华创】器件尺寸微缩（Device Scaling），逐步传导到设备迭代；2026年起，外部环境变化推动国内Fab厂主动与设备厂商开展联合攻关，行业从早期参数对标转向正向设计，正向设计比例大幅提升，回归底层技术逻辑、紧扣客户需求开发产品。作为国内半导体设备平台的龙头企业，除光刻机之外，刻蚀、薄膜、离子注入等全覆盖，当前晶圆厂房建设速度明显提升，两存+先进制程+先进封装等扩产落地，大的资本开支投入受益明显。 ☎️：孙芳芳 15618077298#文字观点", "publish_time": "2026-10-14 12:00", "tags": ["文字观点"]}, "attachment:files/OCS调研AI数据中心需求趋势.pdf": {"id": "attachment:files/OCS调研AI数据中心需求趋势.pdf", "kind": "attachment", "title": "OCS调研AI数据中心需求趋势", "source_label": "其他", "excerpt": "OCS调研 AI数据中心需求趋势|液晶材料壁垒|MEMS/液晶/硅光波导 路线竞争 聚焦：Google/NVIDIA/八亿时空/秋田微/腾景科技/海泰新光/旭创 /nEye等 主题概览 本文围绕OCS（光交换系统）领域的核心技术路线与供应链格局展开，涵盖 液晶OCS光交换模组的内部结构与工作原理、成本结构、液晶材料壁垒、MEMS/ 液晶/硅光波导三种技术路线", "content": "OCS调研 AI数据中心需求趋势|液晶材料壁垒|MEMS/液晶/硅光波导 路线竞争 聚焦：Google/NVIDIA/八亿时空/秋田微/腾景科技/海泰新光/旭创 /nEye等 主题概览 本文围绕OCS（光交换系统）领域的核心技术路线与供应链格局展开，涵盖 液晶OCS光交换模组的内部结构与工作原理、成本结构、液晶材料壁垒、MEMS/ 液晶/硅光波导三种技术路线竞争格局，以及英伟达、华为、中际旭创等厂商的 布局进展。以下为专家观点整理。 一、请详细解释一下液晶OCS光交换模组的内部结构及其光路工作原 理？ 小端口液晶OCS的核心光交换模组，其中两个部分是核心的液晶模组单元， 它们内部含有液晶分子材料，负责实现光路的切换。Flex软板穿过缝隙连接到 后端的电路部分，用于传输电信号。电路通过软板控制液晶模组单元内液晶分子 的极化方向，从而实现对光路的二维阵列控制。由于需要X和Y两个方向的控制， 因此配置了两个液晶单元。 两个FAU（光纤准直头），它们连接着外部的光纤，负责将外部光路导入模 组。核心的光路切换功能主要在这两个液晶单元内完成。 二、一个光交换模组对应多少个端口？例如，在一个64×64的系统 中，是否一个模组对应一个端口？ 一个模组并非只对应一个端口。具体的端口数量取决于接入的光纤数量，一 根光纤（一个通道）对应一个端口。这套模组可以对应多个端口，通常是16个 或以上，例如16个接收端口和16个发送端口。因此，一套64端口的OCS系统 方案，需要使用四套这样的光交换模组，相应地也就需要八个液晶单元。 三、在一套64×64端口的液晶OCS系统中，这种光交换模组的整机 售价是怎样的？ 对于64×64端口的系统，实现规模化生产后，整机售价大约在25,000至 30,000美元之间。行业内通常按端口计价，客户可接受的价格范围是每个端口 400至500美元。以此计算，300多端口的系统售价可达十几万美元，而64端口 的系统售价则在两三万美元的水平。 四、在单个光交换模组的成本中，各个组件的价值量是如何分布的？ 在这个模组中，价值量最高的是液晶单元。单个液晶单元的成本起步价为 1,200美元。由于一个模组需要两个液晶单元，仅这两个单元的成本就达到了 2,400美元，占据了整个模组的绝大部分价值。其他部分如FAU（光纤准直头） 和壳体等，价值相对较低。 五、在光交换系统中，硅基液晶材料的价值量是多少？其技术壁垒和 核心难点体现在哪些方面？ 单独采购硅基液晶材料的成本大约为每单元250美金。该材料的技术要求相 较于普通显示用液晶材料更高，主要体现在需要具备更高的双折射率和更低的粘 度，同时对内部金属杂质的控制也更为严格。其核心难点在于材料配方，属于定 制化开发。尽管制造工艺的难度属于中上水平，但配方是关键。 公司会主导规格制定和验证，并向供应商提供配方，而供应商则负责保证生 产工艺。 六、单个16×16端口模块是如何构成一套完整的64×64端口系统 的？其售价和成本结构是怎样的？ 一套64×64端口的系统是由四个16×16端口的模块拼接组成的。单个模块 （包含八个液晶单元）可以构成一套系统，其售价约为2,400美金。目前，这种 模块是构建更大端口系统的基本单元。 未来规划中，正在考虑设计集成度更高、体积不变但端口更大的小型化模组， 届时可能会减少基本单元的使用数量，但现阶段仍以此为基准。 七、以64×64端口的系统为例，液晶材料在整机中的价值量及其在 物料清单和最终售价中的占比分别是多少？ 一套64×64端口的系统包含八个液晶材料单元，每个单元成本为250美金， 因此液晶材料的总价值为2,000美金。该系统的整机售价在2.5万至3万美金之 间。基于此计算，液晶材料成本占整机BOM成本的约20%，占最终售价的比例则 不到10%。 八、对于更大端口的320端口方案，其构成方式和成本结构是否与 64×64端口方案保持一致？未来产品研发方向是否会改变这一结 构？ 320端口的方案同样是通过拼接方式实现，可以理解为在64×64端口方案 的基础上乘以五。其成本结构中，液晶材料占BOM成本约20%的比例关系保持不 变。 未来的研发方向是设计集成度更高、端口更多的液晶模组，例如使用更少数 量的单元模块实现更多的光路传输。虽然单个模组的通道数增加可能会导致其使 用的液晶材料增多，不能简单地认为液晶材料用量会减半，但整体趋势是向高集 成度、大端口的方向发展。 九、目前液晶材料的供应情况如何？公司自身的产能和外部采购是怎 样的关系？ 公司具备一部分液晶材料的自产能力，但过去产能并未扩充。从2016年开 始，公司便与八亿时空等液晶材料供应商进行对接，其交付一直较为稳定。过去， 基于液晶方案的OCS产品主要应用于电信市场，需求量不大，年出货量仅为几百 台（少则两三百台，多则六百台），主要用于库存补充和设备替换，没有大规模 扩充。 从今年（2026年）开始，随着产品应用于AI数据中心领域，并已向谷歌、 英伟达等客户出货，预计未来几年需求将出现爆发式增长，因此会更多地寻求外 部供应商。 十、公司在自制液晶相关部件时，具体负责哪些工序？ 在自制流程中，公司会从供应商处采购瓶装的高纯度混合液晶材料，然后自 行完成后续的模组集成工序，即将定制的液晶材料贴合到塑成的模组上。模组的 安装和集成是由公司自己完成的。 十一、请介绍一下公司在混合液晶原材料、LCoS芯片封装及液晶单 元生产等环节的供应链策略，以及未来的外包计划？ 公司的供应链策略正从垂直整合向量产导向的外包模式转变。在原材料端， 公司采用八亿时空的混合液晶。在生产流程上，公司过去自行完成将混合液晶通 过真空灌注和封装工艺集成到硅基LCoS芯片上的步骤，之后再进行外壳封装并 连接软板，形成最终的液晶单元。 鉴于未来需求量巨大，为实现快速扩产，公司计划将液晶单元的生产环节外 包。目前，公司更倾向于专注于最后的光学系统集成与整机装配环节，未来甚至 不排除将整机装配也进行外包。 十二、在混合液晶原材料供应方面，公司是否有分散供应商的计划？ 目前没有分散供应商的计划。主要原因是现阶段的采购量不大，若分散给多 个供应商，每个供应商的订单量会更少，不利于合作。公司曾接触过海外的默克 等厂商，但因采购量太小，对方没有合作兴趣。 此外，混合液晶是核心材料，引入过多供应商可能会导致不同批次原材料的 性能差异与波动，进而影响后续整机组装的良率。当前，这部分原材料成本在总 成本中占比不高，因此维持单一供应商对整体影响有限。 十三、公司与供应商秋田微的合作模式是怎样的，目前的合作进展如 何？ 在合作模式上，公司提供设计方案并指定核心原材料（例如，若八亿时空的 产品通过验收，则会指定秋田微采购其混合液晶），由秋田微负责液晶单元的组 装。 十四、对于八亿时空和秋田微这两家供应商，是否存在验证不通过的 风险公司在三个月前开始与秋田微对接。经过评估，其液晶模组制造工艺与公司 的需求匹配度较高，且报价具有优势。因此，秋田微被视为未来产能扩张的重点 合作对象。 qq1490929960 ？ 供应商验证不通过的风险不大。对于八亿时空，双方自2016年起已有长期 对接，合作基础稳固。对于秋田微，尽管对接时间较短，但由于公司会指定核心 材料并提供配方，且自身在该领域积累了多年经验，有能力协助供应商解决可能 出现的工艺问题。 十五、秋田微所负责的液晶模组组装环节，其毛利率水平如何？公司 是否会将更多工艺环节交由其处理？ 秋田微负责的模组组装环节，预计毛利率低于上游原材料供应商八亿时空的 水平。目前，将液晶材料涂覆到LCoS芯片上的核心工艺步骤仍由公司自己完成， 主要因为该工艺至关重要，且秋田微作为新供应商尚未正式导入。 公司计划先通过下个季度订单的交付情况，评估其在液晶单元组装环节的表 现。如果合作顺利，未来会考虑将涂覆等更多工艺步骤交由其负责，这也有望进 一步提升其毛利率。 十六、随着未来产量达到数万台甚至更高，公司在混合液晶材料和液 晶模组组装环节的供应商策略会有何变化？ 随着业务发展，越是下游和后端的环节，寻找供应商的难度会越低。对于液 晶模组组装环节，当需求量达到数万台甚至几十万台时，可能会引入除秋田微以 外的其他供应商以分散风险。 十七、在OCS的供应链中，除了八亿时空，还有哪些核心供应商？未 来是否有新的供应商加入？ 目前供应链中的核心供应商包括提供转接头的腾景科技，以及秋田微和八亿 时空。未来，海泰新光有机会进入供应链体系，主要供应偏振分光器、滤光片、 准直棱镜等光学器件。 海泰新光的核心技术优势在于镀膜工艺，其原有主业是为医疗内窥镜提供各 类镀膜玻璃片和滤光片，目前正寻求拓展至通信领域。不过，其供应环节的价值 量低于八亿时空。 十八、目前OCS市场主要存在MEMS、液晶和硅光波导三种技术路线， 如何看待这些路线的特点、竞争格局及未来演变？ MEMS是当前的主流方案，主要得益于谷歌的大量采用。液晶方案目前市场 参与者较少，但华为、中际旭创等后续有计划布局。液晶方案过去的主要劣势是 切换速度慢于MEMS，但经过第二代方案优化后，这一差距已显著缩小。 液晶方案的核心优势在于其全固态设计，没有运动部件，可靠性极高，可实 现十年以上的使用寿命，远超客户通常三年的使用预期。基于高可靠性和综合性 价比，英伟达倾向于选择液晶方案。 从市场份额看，液晶方案过去在OCS市场占比不足15%，预计在硅光波导方 案成熟前，其份额有望增长至40%左右。硅光波导方案是更新的技术，其核心优 势在于高集成度和快速的切换速度，更契合未来AI应用对小型化和高频数据切 换的需求，在液晶方案之后具备相当大的发展潜力。 十九、硅光波导方案在技术上面临的主要挑战是什么，这对其应用场 景有何影响？ 硅光波导方案当前面临的最大技术挑战是插损过高。目前液晶和MEMS方案 的插损在2.0-2.5dB的水平，而硅光波导方案的插损普遍在7-10dB，部分产品 甚至高达20多dB。高插损直接限制了其端口规模的扩展能力。 例如，去年（2025年）基于波导方案的产品仅能做到32端口，今年（2026 年）提升至64端口，而液晶方案可以轻松实现300以上的大端口规格。因此， 波导方案短期内难以应用于谷歌等采用Scale-out架构的大规模、数百端口集群 中。 二十、既然硅光波导方案存在插损高、端口规模受限的问题，它在哪 些场景下具备应用潜力？ 尽管存在插损问题，但硅光波导方案在对端口规模要求不高的场景中仍有应 用机会，例如小型的推理集群以及英伟达机柜内部的Scale-up场景。在这些应 用中，虽然对插损并非没有要求，但由于端口数量少，较高的插损水平尚在可接 受范围内。 波导方案实现大端口的方式是通过级联基本单元，例如将多个32×32单元 级联成一个64×64的交换矩阵。然而，每一次级联都会使光路拉长，理论上会 公司未来的潜在订单规模可达数万台。从更长远的角度看，公司与英伟达的 初步沟通表明，他们计划在2028年于其Feynman架构中进行规模化部署。目前， 英伟达已在与公司接洽，定制液晶方案的OCS。预计到2028年规模部署后，其 OCS总需求量将达到20万台级别。 二十二、华为和中际旭创在液晶OCS领域的进展如何，是否会对公司 构成影响额外增加至少 3dB 的插损，级联层数越多，总插损就越大，这进一步限制了其在 大规模端口场景的应用。 qq1490929960 二十一、关于英伟达的OCS 订单情况，未来的整体需求规划是怎样 的？ ？ 目前从事液晶方案的厂商较少，有更多参与者实际上有助于扩大产业链规模 并降低成本。中际旭创的液晶方案启动时间较晚，其MEMS方案于今年（2026年） 3月发布，光波导方案于去年（2025年）9月与nEye合作，因此其液晶产品预 计要到2028年甚至2029年才能推出，对公司影响不大。 华为确实有实力且计划进入液晶方案领域，这是他们目前欠缺的核心原材 料。华为目前仍处于摸索阶段，量产时间尚不明确，预计可能比中际旭创稍快， 但最早也要到2028年。因此，公司在未来两年内基本没有竞争对手。 二十三、液晶OCS最核心的技术壁垒是否在于液晶配方？ 液晶配方确实是核心技术壁垒，它直接决定了整机的可靠性、分辨率、稳定 性及插损等关键性能指标。不过，这并非唯一的门槛。从拥有配方到最终制成 OCS产品，整个链条还包括将液晶材料通过填充工艺制成硅基液晶单元，再到整 机组装等多个环节，每一步都存在技术难点。但从最上游和最核心的角度来看， 配方无疑是关键所在。 二十四、液晶配方供应商是否与其他厂商存在合作，以及相关的保密 和保供协议情况如何？ 公司与配方供应商签订了保密协议，要求其对公司的配方保密。同时，公司 还签署了保供协议，确保其在明年（2027年）乃至后年（2028年）上半年内， 不能向其他厂商供应相关产品。目前，该供应商未向其他厂商供货。尽管未来技 术扩散难以完全避免，但公司的配方自身也在不断升级。 二十五、液晶OCS制造过程中的填充工艺难度如何？这项技术是否有 其他应用领域？ 填充工艺的主要难点在于过程控制，需要边生产边检测，以确保液晶材料中 没有气泡或暗斑，这对于填充的速度、压力和温度控制有较高要求，属于工艺经 验的积累，其技术门槛相对低于液晶配方本身。 这项技术主要应用于通信领域，包括电信市场以及现在的数据中心OCS。此 前在电信领域用量不大，目前尚未观察到在其他新的应用领域有规模化应用。 二十六、除了公司之外，目前是否有其他厂商具备稳定量产液晶OCS 的能力？ 在通信领域，目前只有公司具备这项技术。华为虽然有意向，但目前也尚未 研发成功。因此，截至目前，其他厂商尚不具备稳定量产的能力。 二十七、钒酸钇晶体在液晶OCS产品中的具体作用是什么？ 钒酸钇晶体主要用于偏振分光，实现光路的双折射。在产品结构中，它通常 贴装在准直器的后方，位于光纤、准直器等组成的进光/出光模块与负责光路控 制分配的模块之间。", "status": "extracted cosystem with a shared implementation framework rather than only a broad architectural vision. However, we also observed debate over whether pluggable NPO offers materially better flexibility and serviceability than CPO. Key concern on CPO is that optical failure could result in scrapping an entire ASIC assembly. Overall, we observed growing discussion and interests in NPO, implying a greater likelihood of accelerated commercialization over the next 12-18 months, in our view. Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. Key Takeaways Connectivity has become the bottleneck, and NPO is a potential solution. We observed growing discussion and interest in NPO at the conference. October 14, 2026 08:47 AM GMT Not for redistribution without written consent of Morgan Stanley wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 M Update 2Disclosure Section The information and opinions in Morgan Stanley Research were prepared or are disseminated by Morgan Stanley Asia Limited (which accepts the responsibility for its contents) and/or Morgan Stanley Asia (Singapore) Pte. (Registration number 199206298Z) and/or Morgan Stanley Asia (Singapore) Securities Pte Ltd (Registration number 200008434H), regulated by the M 技术三大行业、 合计占八成以上。 摘要 结论一：9月IPO上市集中于高端制造与硬科技等实体产业。 当月上市21家，行业集中于汽车底盘、专用设备、金属材料、 医疗耗材、新能源配套等制造领域，以实体产业为主。储备端机 械设备22家居首，电子、计算机、医药生物各 16家并居第二， 汽车15家、电力设备14家紧随，制造与硬科技六大行业合计占 在审项目超五成。募资上 9月IPO合计216.9亿元，中金公司保 荐项目51.7亿元居首；在审项目以 1至10亿元中小体量为绝对 主体、合计占72%，长存控股330亿元为超大体量个案。 结论二：本月上市保荐前三为国泰海通、中金公司、中信建 投，储备前三为中信证券、国泰海通、中信建投。 具体看，上市 端国泰海通4单居首、中金公司与中信建投各 3单，三家合计10 单、占47.6%；募资端中金公司51.7亿元、承销保荐费3.1亿元 双居第一，对比8月头部梯队轮换、华泰联合 9月无落地项目。 储备端中信证券26单居首、国泰海通24单、中信建投19单， 中金公司16单与前三构成第一梯队，中小券商储备体量与板块 布局与头部形成梯队落差。 结论三：过去一年撤否以主动终止撤回为主，金额集中于科 创板、项目集中于制造与硬科技赛道。 过去一年撤否项目合计81 家、拟募资规模602.35亿元，主动终止撤回77家占95.1%，科 创板以201.01亿元居各板块金额之首。行业 分布上，上材料23 家、工业23家、信息技术20家，三大行业合计66家、占八成 以上；二级行业化工 15家、机械12家、硬件设备10家、半导 体8家靠前。撤否项目呈中小体量、审核周期偏长特征，单项目 拟募中位数4.70亿元、逾七成在10亿元以内，受理至撤否中位 周期13.2个月。 维持 强于大市 赵然 zhaoran@csc.com.cn 021-68801600 SAC 编号:S1440518100009 SFC 编号:BQQ828 吴马涵旭 wumahanxu1@csc.com.cn SAC 编号:S1440522070001 研究助理：刘桥莲 liuqiaolian@csc.com.cn 发布日期： 2026年10月13日 市场表现 相关研究报告 26.10.09 【中信建投非银金融】证券Ⅱ :券商 密集回购增持，注销式回购增厚股 东回报 26.09.16 【中信建投非银金融】证券Ⅱ :证券 公司IPO与股权投资全景(2026年8 月) 26.08.31 【中信建投非银金融】证券Ⅱ :26H1 证券业业绩综述：投资业务占近半， 科创股权成新引擎 26.06.08 【中信建投非银金融】证券Ⅱ :2026 年中期策略：证券业研究框架新范 式 26.05.28 【中信建投非银金融】证券Ⅱ :资本 市场改革深化下，券商“科创属性” 价值重估 -21%-11%-1%9%19% 202 5/10 /13 202 5/11 /13 202 5/12 /13 202 6/1/13 202 6/2/ 13 202 6/3/ 13 202 6/4/ 13 202 6/5/ 13 202 6/6/ 13 202 6/7/ 13 202 6/8/ 13 202 6/9/13 证券Ⅱ上证指数证券Ⅱ 仅供内部参考，请勿外传！ 行业深度报告 证券Ⅱ 请务必阅读正文之后的免责条款和声明。 目录 核心观点................................ ................................ ................................ ................................ ................ 1 摘要................................ ................................ ................................ ................................ ....................... 1 一、2026年9月A股IPO概况 ................................ ................................ ................................ .............. 1 1、IPO已上市情况 ................................ ................................ ................................ ......................... 1 （1）已上市数量及分布 .... 14T08-59:3eff1a015abf": {"id": "post:2026-10-14T08-59:3eff1a015abf", "kind": "post", "title": "2026-10-14 08:59", "source_label": "帖子正文", "excerpt": "【国海机械】九州一轨：继续强call❗️回调即是布局窗口，当前位置至少翻倍以上空间！#全市场最底部#晶禧：未来2-3年主要利润来源、支撑200亿左右市值卡位：硅光晶圆切割服务是硅光模块全新增量工艺环节，客户为中际旭创、新易盛、羲禾科技、熹联光芯等硅光芯片、光模块领域头部企业。", "content": "【国海机械】九州一轨：继续强call❗️回调即是布局窗口，当前位置至少翻倍以上空间！#全市场最底部#晶禧：未来2-3年主要利润来源、支撑200亿左右市值卡位：硅光晶圆切割服务是硅光模块全新增量工艺环节，客户为中际旭创、新易盛、羲禾科技、熹联光芯等硅光芯片、光模块领域头部企业。弹性：硅光增速远高于光模块行业增速，明年行业相比今年约增长4倍。按照明年全球硅光晶圆切割市场20亿、公司份额50%算，晶禧净利润约5-6亿元，给40倍估值，对应市值约200亿。延伸：NPO、CPO对晶禧是量价齐升的过程。 #通创九州：金刚石全产业链协同优势突出、提供远期弹性产品：主要布局单晶金刚石散热片和第四代半导体材料金刚石芯片基板。优势：借力江苏通用金刚石全产业链设备布局优势，MPCVD良率较高、且后道激光加工/表面更具优势。相对于传统长晶/磨料路径，更贴近芯片级基板与散热应用及后道加工，价值量与客户粘性逻辑更强。估值：参考国机精工、四方达、沃尔德等公司估值，通创九州给100-200亿远期期权，穿透下去九州持股44%，对应市值约50-100亿。#空间主业30亿+晶禧200亿+金刚石70亿=300亿。后续金刚石进展更清晰后，可看400-500亿。 ———————— 最新近况等，欢迎私信交流：国海机械 张钰莹/闫智/对口销售#文字观点", "publish_time": "2026-10-14 08:59", "tags": ["全市场最底部", "空间", "文字观点"]}, "attachment:files/AI芯片及硅光大厂专家交流 261013.pdf": {"id": "attachment:files/AI芯片及硅光大厂专家交流 261013.pdf", "kind": "attachment", "title": "AI芯片及硅光大厂专家交流 261013", "source_label": "其他", "excerpt": "保偏光纤龙头调研 CPO需求爆发、国内企业具备PCVD工艺壁垒、康宁认证通过 开始释放订单 ——— 核心要点 保偏光纤成为CPO外部光源稳定传输首选方案，具备高扩展性，可兼容未 来更高功率与速率需求。需求爆发式增长：因FAU良率极低，实际备货量需超配3-4倍。", "content": "保偏光纤龙头调研 CPO需求爆发、国内企业具备PCVD工艺壁垒、康宁认证通过 开始释放订单 ——— 核心要点 保偏光纤成为CPO外部光源稳定传输首选方案，具备高扩展性，可兼容未 来更高功率与速率需求。 需求爆发式增长：因FAU良率极低，实际备货量需超配3-4倍。 竞争格局：长飞光纤凭借PCVD工艺代差及大棒技术领先，是目前国内唯一 能较好满足高精度需求的企业；烽火等处于追赶及扩产期。 价格趋势：高精度产品维持30-40元/米，远高于军工陀螺光纤（2元/米）； 低精度产品已降至20元/米以下，未来仍有下行空间。 供应链决策：英伟达等终端客户拥有最终供应商指定权。 以下内容来自资深行业专家： ——— Q1：保偏光纤在CPO外部光源方案中的作用机制是什么，以及为何 被视为一项刚需技术？ 当前保偏光纤的需求增长主要由CPO驱动。CPO方案选配的1,310nm高功 率外部光源，其功率、波长及偏振态易受外界环境影响，因此需要一种能将光源 稳定传输至光引擎的介质。经过系统和器件厂商的验证，保偏光纤能有效满足这 一稳定传输的需求。相较于过去采用温控、振动控制等方式来稳定光源，使用保 偏光纤是一种更简便且技术成熟的方案，因此已成为当前的首选。 Q2：从技术演进的角度看，用于外部光源的保偏光纤未来是否有可 能被其他耦合方案替代？ 替代方案的研究始终在进行中。通信系统设计通常会同时探索光方案和电方 案。目前，保偏光纤是在CPO有限空间内相对容易实现的方案，并且其扩展性 良好，能够兼容未来光源速率和功率的持续提升。尽管电学方案理论上也能实现 类似功能，但其实现成本更高，且在后续扩展性方面可能面临更大挑战。 Q3：CPO领域对保偏光纤的需求量级、增长节奏以及具体的测算逻 辑是怎样的，尤其是在考虑良率损耗的情况下？ 近期行业内的讨论显示，保偏光纤不仅面临量的增长，对质的要求也同样迫 切，其性能已成为限制FAU良率的关键因素之一。目前国内仅长飞光纤的产品 能较好地满足应用需求，同时长飞也在推动产品性能升级，对光纤外径精度提出 了更高要求。由于光纤本身及FAU器件的良率较低，导致保偏光纤的实际消耗 量远大于最终的装配量。具体测算方面，单个CPO模组完成装配后，其内部保 偏光纤的总长度不超过150米，但为了制成这150米的FAU链路，实际消耗的 光纤长度可能高达1公里。综合考虑各环节的生产良率，最终的备货量与实际用 量之间可能存在三到四倍的超配关系。根据康宁公司的预测，2027年保偏光纤 的需求量预计至少达到十几万公里，2028年可能迅速增长至30多万公里，并有 望在2030年达到100多万公里的规模，显示出极快的增长速度。 Q4：用于AI领域的保偏光纤与传统用于军工陀螺仪的保偏光纤，在 技术规格和应用上有何异同，以及未来的发展趋势是怎样的？ 两者在技术上有共通之处，但也存在显著差异。初期光纤陀螺与当前CPO 的外部光源均使用1,310nm波长，光源类型也具有可比性。然而，由于陀螺仪 对传输距离要求极高（光纤环路可达3公里），其技术路线已转向1,550nm长 波长以追求更高精度。CPO则因封装集成和硅光基底的特性，首选传输距离较 短（板间互联通常不超过5-10米）的1,310nm波长。一个共同的趋势是向细径 化发展。陀螺仪为减小体积已采用细径光纤，而CPO为实现更高密度的多芯FAU 互联，未来也将从当前的125微米外径转向80微米。由于CPO领域的FAU不 像MPO那样有严格的插芯通用性要求，各家可以自行设计V型槽尺寸，这为采 用80微米细径保偏光纤提供了便利。应用上的核心区别在于，陀螺仪使用的是 带涂层的光纤，考核的是数公里长度的综合平均性能。而CPO使用的是剥除涂 层的裸纤，属于器件型应用，对每1米光纤性能的一致性要求极高，这对光棒的 均匀性和拉丝工艺的控制能力提出了巨大挑战。 Q5：目前军工和AI领域保偏光纤的价格水平如何，未来的供需关系 和价格走势将如何演变？ 两个市场的价格和前景差异显著。军工陀螺仪光纤市场需求主要在中国，年 需求量稳定在15万公里左右多年，且今年（2026年）需求量有下降趋势。经过 长飞、烽火、长盈通等国内厂商的激烈竞争，陀螺保偏光纤价格已降至极低水平。 相比之下，用于CPO的器件型保偏光纤价格较高。此前，康宁的报价约为每米 90至100元，长飞和藤仓的报价在每米70至80元。目前，高精度器件保偏光 纤的价格依然维持在每米30至40元。未来，如果低精度产品的市场需求放量， 且长飞、烽火等厂商均可供应，其价格仍有下行空间。 Q6：考虑到2028年至2030年保偏光纤需求将大幅增长，且各厂商 均在扩产，应如何判断此轮需求的紧缺周期？ 尽管需求展望非常乐观，但判断紧缺周期需要谨慎。 Q7：目前国内保偏光纤的主要扩产厂商有哪些，具体的扩产进展如 何？ 当前进行保偏光纤扩产的厂商主要包括长飞、烽火和长盈通。长飞已专门新 建厂房用于CPO的保偏光纤生产，该项目由庄总特批，厂房正在建设中，设备 也在同步准备，由于设备自产，进度相对可控。烽火的厂房已于今年5月建成， 设备正在分批安装到位，扩产规模较大。长盈通也在扩产，但步伐相对较小。保 偏光纤目前面临的瓶颈不仅是产能，更关键的是技术突破，预计技术难题的解决 可能还需要持续大半年时间，因此高精度产品的紧缺状况仍将持续。 Q8：从生产工艺角度看，PCVD与MCVD的效率差异有多大，以及 国内主要采用PCVD工艺的原因是什么？ PCVD工艺的效率远高于MCVD，大约是MCVD的4到5倍，相当于一台 PCVD设备的产能需要五台MCVD设备才能实现。此外，PCVD能够制造应力 更深的应力棒，为保偏光纤后续的性能迭代提供了更好的支撑，并且可以生产大 棒，而MCVD只能生产小棒，这是一个显著的限制。国内之所以主要采用PCVD， 源于历史上的自制能力问题。2000年左右，国外对中国禁运光纤，国家委托长 飞和烽火进行研发。当时烽火在预制棒技术上尚有不足，而长飞集团当时仅拥有 PCVD工艺，因此便采用PCVD技术成功研制出保偏光纤。 Q9：国内主要厂商在PCVD设备和工艺能力方面存在哪些差距？ 国内两大PCVD厂商长飞和烽火在设备和工艺上均存在差距。设备配置方 面，烽火的设备水平大致相当于长飞十年前的水平，存在代差。工艺能力方面， 烽火也稍逊于长飞。在同等设备条件下，长飞凭借在工艺参数研究上的领先优势， 生产出的预制棒在均匀性和性能参数上表现更优。长盈通的技术水平则介于长飞 和烽火之间，因其拥有部分关键技术人才，表现稍好。 Q10：考虑到主要厂商的PCVD设备均为自研，这是否意味着扩产 不存在设备瓶颈？ 目前影响良率的主要环节在于预制棒的质量。不同厂商生产的预制棒本身就 存在差异，若预制棒不均匀，后续拉丝等工序也难以弥补。其次是拉丝能力，长 盈通和烽火在拉丝工艺控制方面与长飞仍有差距。当前保偏光纤对精度的要求极 高，达到正负0.1至0.2微米，这超越了以往任何光纤产品的标准，对所有厂对于长飞、烽火这类厂商而言，由于设备均为自研，扩产确实不存在设备瓶 颈。qq1490929960 Q11：当前行业内各家厂商的良率水平如何？在预制棒、拉丝等环节 中，影响良率的关键因素是什么？ 商 都是挑战。长飞因其在多种光纤拉丝工艺上的长期积累和广泛的平台经验，在这 一领域具备明显优势。目前，各厂商仍在预制棒的均匀性上投入主要精力，例如 确保打孔和芯棒、应力棒从前到后的一致性，同时也在努力提升拉丝的稳定性。 Q12：军用陀螺光纤的良率相对较高的原因是什么？ 军用陀螺光纤的良率之所以高于目前用于器件的保偏光纤，主要是因为其精 度要求没有那么高。此外，军用陀螺光纤拉的是细径光纤，同样一根芯棒可以拉 出超过两倍的长度，成品率因此较高。而当前器件FAU所用的保偏光纤，由于 精度要求严苛，在生产过程中前后两端浪费较多，导致成功率偏低。 Q13：保偏光纤生产所需的母棒和石英套管目前的供应情况如何？这 对成本和未来降本路径有何影响？ 保偏光纤经过光纤厂商生产后，会供给像康宁这样的公司，再由康宁分发给 FAU器件制造商进行加工。在国内，太辰光、天孚等都可能为康宁供货，而长 飞的产品则全部供给其子公司长芯盛和博创。在供应商选型方面，最终决策权在母棒和石英套管供应方面，长飞和烽火具备较大优势，它们采用 VAD加 OVD工艺直接制造大棒，产品一致性更好。长盈通目前正在通过与 菲利华合作 解决这一问题，此前它主要采购套管与自制芯棒进行封装，这种方式可能因芯棒 与套管间的间隙导致偏心等参数偏差。目前石英套管供应也比较紧张。不过，从 成本角度看， 鉴于当前保偏光纤的高售价， 原材料成本并非关键制约因素。 例如， 即使套管价格从每公斤 2000元涨至 5,000元，分摊到每米光纤的成本增量也微 乎其微。当前行业关注的焦点是产品性能参数的提升以及未来工艺路线的演进。 长飞已在全力研究大棒工艺，这不仅能降低成本，更重要的是能通过拉制更长的 均匀段来提升产品均匀性。能否掌握大棒工艺，将是制约长盈通等厂商未来提升 精度和产出率的关键瓶颈。 qq1490929960 Q14：保偏光纤的下游客户体系是怎样的？终端客户与综合部件商在 供应商选择上的决策权如何划分？ 掌 握在终端客户手中，例如在当前的AI应用场景下，英伟达等终端厂商拥有决定 权，康宁并没有光纤选型的决定权。光纤的型号和厂家均由终端客户指定。长飞 的供货资质由英伟达确认，长盈通能为康宁供货也需要得到英伟达的认可。这种 模式与以往数据中心建设中类似，当时字节、阿里、腾讯、华为等终端厂商会统 一指定长飞和康宁为多模光纤供应商并直接谈定价格。不同之处在于，现在通过 康宁供货的厂商，其产品价格由康宁来定价。 Q15：康宁遴选供应商的认证流程是怎样的？长盈通目前处于哪个阶 段？ 康宁的供应商认证流程大致如下：首先，技术团队评估潜在供应商的技术能 力、质量体系和产线；随后，供应链团队洽谈合作方式并进入报价环节，通常为 阶梯价格；报价后，运营、采购等团队会到现场进行最终确认。完成确认后，供 应商开始送样，样品需获得康宁技术和运营部门的认可，运营部门会负责将光纤 对接给下游FAU等厂家进行验证。样品认证通过后，供应链或采购部门会正式 洽谈下单价格，并下达订单。此后，价格会根据供货量增长或产品参数变化等因 素进行不定期商谈。目前，长盈通的光纤已通过初步认证，样品良率尚可，能够 使用但也存在一些问题。为满足2027年第一季度的需求，康宁已向长盈通下达 了一个小批量采购订单。同时，长盈通仍在持续优化其光纤产品并送样验证，这 是一个供货与新品验证同步进行的循环过程。 Q16：康宁未来的下单节奏以及在不同供应商之间的份额分配逻辑是 怎样的？ 康宁的下单节奏预计将按季度进行，每个季度的订单量会根据约两个月的供 货周期和三至四个月的付款周期滚动安排。在供应商份额分配上，主要依据三个 维度进行考量：首先是供货情况，即订单交付的及时性；其次是产品质量的稳定 性；最后是价格。康宁内部会根据供应商上个季度的综合表现进行打分，并据此 在每个季度动态调整各家的供货份额。 Q17：国内其他新进入者如亨通、中天、永鼎等在保偏光纤领域的进 展如何？ 在新进入者中，亨通的进展相对较快，目前正在扩充保偏光纤产能，但其 PCVD设备当前主要用于生产需求同样火爆的多模光纤。亨通的保偏产品仍在进 行性能优化，尚未达到送样水平，但被认为是下一个最有希望进入供应链的厂商。 中天则相对落后，仍处于人才招募阶段，短期内难以取得突破。永鼎引进了亨通 的技术人员，预计技术成熟还需要一段时间。这几家相对有希望，其他厂商则更 为早期。 Q18：长盈通目前在保偏光纤方面的产能配置如何，以及与多模光纤 等其他产品切换的灵活性怎样？ 长盈通现有8台PCVD设备，目前并未全部用于生产保偏光纤，约有3至4 台在进行间断性调试和生产，其余设备则用于生产同样供应紧张的多模光纤。公 司正在补充新的PCVD设备，预计在今年底或明年一季度将有新产能释放。产 能切换的灵活性较高，从多模光纤产线切换至保偏光纤产线大约只需一个月时 间，且没有效率损失。切换的主要风险在于原料残留可能对管道造成污染，影响 产品衰减性能。因此，一旦切换至保偏光纤生产，通常会持续一段时间，不会立 即切回。若需要切回生产多模光纤，可能会先生产一段时间的掺氟管以清洁管道， 降低损耗。", "status": "extracted"}, "post:2026-10-14T07-30:4420f2445d9e": {"id": "post:2026-10-14T07-30:4420f2445d9e", "kind": "post", "title": "2026-10-14 07:30", "source_label": "帖子正文", "excerpt": "【盘后A股上市公司重点业绩公告精选】财联社10月13日电，据财联社不完全统计，截至发稿，盘后包括盐湖股份、中钨高新、浪潮信息、兴森科技、恩捷股份、宝鼎科技、富春染织、星宸科技、苏常", "content": "【盘后A股上市公司重点业绩公告精选】财联社10月13日电，据财联社不完全统计，截至发稿，盘后包括盐湖股份、中钨高新、浪潮信息、兴森科技、恩捷股份、宝鼎科技、富春染织、星宸科技、苏常柴A、杰创智能、乐鑫科技、震裕科技、金力永磁、湘电股份和甘肃能源在内的多家A股上市公司发布2026年前三季度/第三季度业绩预告。其中，宝鼎科技公告，前三季度净利润同比预增537%-614%。中钨高新公告，前三季度净利润同比预增219%-241%。(来自财联社APP)", "publish_time": "2026-10-14 07:30", "tags": []}, "post:2026-10-14T08-08:f028d9695263": {"id": "post:2026-10-14T08-08:f028d9695263", "kind": "post", "title": "2026-10-14 08:08", "source_label": "帖子正文", "excerpt": "看着人们对长鑫科技 的 4F² 感到震惊，并声称长鑫科技已经赶上西方的存储技术，真是令人啼笑皆非。", "content": "看着人们对长鑫科技 的 4F² 感到震惊，并声称长鑫科技已经赶上西方的存储技术，真是令人啼笑皆非。 长鑫科技看着人们对 CXMT 的 4F² 感到震惊，并声称 CXMT 已经赶上西方的存储技术，真是令人啼笑皆非。 长鑫科技的 DUV 光刻技术已经达到了极限。它目前的目标是在相对宽松的 13 至 14 纳米制程节点上，从 6F² 光刻技术过渡到 4F² 光刻技术，从而延长 DUV 光刻技术的寿命。它并非直接跳到 4F² 光刻技术以超越使用 EUV 光刻技术的西方存储器制造商。人们把因果关系搞反了。 三星和 SK 海力士并非因为愚蠢才迟迟不推出 4F²技术。如果他们现在想量产 4F²，完全可以做到。他们之所以不这么做，唯一的原因是良率不足。 我真的搞不懂 CXMT 引发的这波抛售潮是怎么回事。#文字观点", "publish_time": "2026-10-14 08:08", "tags": ["文字观点"]}, "post:2026-10-14T22-06:9df0c72af3f3": {"id": "post:2026-10-14T22-06:9df0c72af3f3", "kind": "post", "title": "2026-10-14 22:06", "source_label": "帖子正文", "excerpt": "长鑫科技的技术突破，在四个交易日内引爆了全球半导体市场，将一场拥挤的AI内存交易推向清算时刻。", "content": "长鑫科技的技术突破，在四个交易日内引爆了全球半导体市场，将一场拥挤的AI内存交易推向清算时刻。 高盛策略师Robert Quinn在最新报告《纳斯达克期货：内存崩溃》中，通过持仓数据还原了这场抛售的结构：投机性\"快钱\"在行情见顶的那一周将纳斯达克期货多头仓位推至一年高位，随后遭到止损出局；而规模约700亿美元的资产管理
