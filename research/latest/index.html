润2.1亿元，较Q2的0.7亿元环比*3，预计金宝归母1.7亿元，主要系覆铜板涨价弹性；兴森科技Q3扣非净利润落在2.95-3.25亿元区间，大幅超出机构1.5亿元预期，环比增幅207%-238%，前三季度扣非4.2-4.5亿元，同比+182%-202%。建滔积层板10月13日发布涨价通知，因薄布市场需求旺盛，上游玻璃布、玻璃纱供应紧张且价格大幅上涨。\u003c/li>\n\u003cli>光通信/OCP成为AI基础设施焦点：CPO向着机架级规模化部署推进，可插拔光模块依旧具备横向扩展优势；中际旭创展示Open CPX MSA可插拔共封装/近封装光模块、XPO MSA 12.8T超高密度液光模块，以及与康宁、住友、AFL合作推出的SDM4标准，并推出行业首款USFP 400G/通道模块；获增持评级，H股目标价1385港元。保偏光纤成为CPO外部光源稳定传输首选方案，需求爆发式增长，因FAU良率极低，实际备货量需超配3-4倍。\u003c/li>\n\u003cli>策略与风险：本轮科技股调整因宏观预期层面压制，而非基本面因素；电子信息制造业8月收入增速较7月环比微升，国内AI资本开支、半导体设备盈利预期均处于上修通道。本轮真正持续赎回的主力，是二季度高位进入科技的保险和固收+资金，固收+基金与科技的相关系数从2025年的0.145升至今年二季度的0.24，目前已回落至0.149。今日成交16891亿，增量1381亿；证监会会议释放维稳信号，ETF份额触底回升。风险端需关注地缘冲突、油价波动、未经证实主题消息及出口退税调整对部分公司短期情绪冲击。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>1. AI算力/大模型与Agent\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：Gemini 4 Argon开放、OpenAI Agent基础设施、Agent CPU用量变化。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：Gemini 4 Argon支持100万词元上下文，强化复杂推理与长周期任务执行；OpenAI正在构建Agent API以及商业广告整合；国产电商云财务Agent扩面后CPU用量大增，浏览器复用进程后CPU开销、ARM长约后的x86/ARM采购选择成为调研焦点。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：Gemini 4 Argon今日全球开放并可API调用；AI Agent CPU调研覆盖头部电动车品牌与国产电商云的Agent落地案例、API编排、文档解析与代码沙箱资源口径；腾讯26Q3数据跟踪显示国内游戏大盘流水yoy约+9%，手游/端游分别+8%/+11%，近期关注混元模型迭代及小微测试进展。\u003c/li>\n\u003c/ul>\n\u003ch3>2. 半导体/存储/先进封装/设备\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：供应瓶颈、AI动能、存储紧张至2028年。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：美光明确2027/2028年供应紧张度显著甚于2026年；预计NVDA、AMD、AVGO、MRVL指引继续显示2027年backlog/订单能见度上行；推理工作负载需要融合HBM、DRAM、NAND的异构内存架构；先进封装、定制ASIC设计服务迎来结构性机会。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：ASML Q3销售额117亿欧元，毛利率57.5%，高于一致预期147bps，预计产能提升；华为麒麟9050系列芯片实现量产落地，采用逻辑折叠堆叠架构；长鑫科技4F²技术突破在四个交易日内引爆全球半导体市场，将拥挤的AI内存交易推向清算时刻；国内晶圆厂设备零部件供应短缺推动国产化加速，ABF载板更多capex、更多紧张。\u003c/li>\n\u003c/ul>\n\u003ch3>3. PCB/CCL/铜箔\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：三季报超预期与CCL涨价。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：宝鼎科技26Q3预告中值利润2.1亿元，较Q2的0.7亿元环比*3，最大增量来自CCL涨价带来增量利润弹性，后续华正、生益、南亚等披露财报情况类似；兴森科技Q3扣非2.95-3.25亿元，大幅超机构1.5亿元预期，环比207%-238%；AI服务器当中PCB与覆铜板单车价值量将会提升。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：建滔积层板10月13日发布涨价通知，因薄布市场需求旺盛，上游玻璃布、玻璃纱供应紧张且价格大幅上涨；鹏鼎控股董事长调研显示AI服务器及光模块PCB需求增长，推动加速扩产；英伟达并行测试碳氢方案，此前市场更倾向PTFE方案，目前方案仍处并行测试阶段并未定型，预计2026年底确定最终方案，N选择方案优先级为电性能达标&gt;可量产性。\u003c/li>\n\u003c/ul>\n\u003ch3>4. 光通信/CPO/OCS\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：OCP大会、CPO机架级部署、保偏光纤。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：AI基础设施创新向机架级协同优化方向转变，智能体AI拉动推理算力需求，带来光互联、先进封装、存储器架构、供电领域投资机会；CPO向机架级规模化部署推进，可插拔光模块依旧具备横向扩展优势；保偏光纤成为CPO外部光源稳定传输首选方案，具备高扩展性，可兼容未来更高功率与速率需求。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：中际旭创展示Open CPX MSA、XPO MSA 12.8T、SDM4多芯光纤标准及行业首款USFP 400G/通道模块；保偏光纤需求爆发式增长，因FAU良率极低，实际备货量需超配3-4倍，国内企业具备PCVD工艺壁垒，康宁认证通过开始释放订单；光迅科技Q3业绩有望高于市场预期的5-6亿利润，业绩拐点；联讯仪器与源杰科技均公告称业绩高增长；OCS调研覆盖液晶OCS光交换模组内部结构、成本结构、液晶材料壁垒及MEMS/液晶/硅光波导三种技术路线。\u003c/li>\n\u003c/ul>\n\u003ch3>5. AIDC电力/液冷/电源\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：表后发电、备用电源、HVDC、SOFC。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：数据中心正专注于使用表后天然气涡轮机作为主要电源，估计需求为100GW，并预计大多数未来建设的数据中心将由表后供电，因公众反对使用电网；燃料电池减少对备用的需求，并在800V提供电力，这与新的数据中心架构相关；电池约占UPS系统总价值的15%，新增产能已全面转向锂离子电池，铅酸电池仅用于存量系统替换。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：美国亚利桑那州Grande Valley数据中心获得有条件用地许可，拟配置3693台Bloom Energy 325kW SOFC系统，总规模约1.2GW；金盘科技2026年前三季度营收61.0亿元，同比+17.5%，归母净利润5.4亿元，同比+12%，海外&amp;AIDC订单爆发高增；科泰电源柴发出货量价齐升，海外及欧美占比提升进一步提升盈利能力，海外内燃机龙头交期延长，康明斯、卡特彼勒、罗罗等大功率数据中心备用发电机组产能排产已延至2027—2028年；通合科技向AIDC一次电源延伸，HVDC打开第二增长曲线。\u003c/li>\n\u003c/ul>\n\u003ch3>6. 宏观策略/机器人/新能源车\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：科技调整、维稳信号、出口退税、机器人业绩兑现。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：本轮科技股调整因宏观预期层面压制，而非基本面因素；本轮持续赎回主力是二季度高位进入科技的保险和固收+资金，固收+基金与科技相关系数从2025年0.145升至今年二季度0.24，目前回落至0.149；证监会会议释放维稳信号，ETF份额触底回升。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：今日成交16891亿，增量1381亿；新能源汽车出口增值税退税率由13%下调至9%，2027年4月1日正式生效，覆盖乘用车与商用车，预计分三个阶段提高均价10%；金力永磁预计2026年前三季度归母净利润7.35-8.00亿元，中值7.68亿元，同比+48.9%，单Q3中值3.05亿元，同比+45.0%，机器人业务持续兑现；北特科技身体丝杠2025年交付约1万根，2026H1约1万根，2026年7-8月约1万根，手部丝杠2026年上半年起量，7-8月双月交付超4万根；富春染织前三季度净利润预增1347.69%到1519.01%，投资10亿元建设PEEK材料人形机器人轻量化与半导体精密注塑项目。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>AI：Google Gemini 4 Argon今日全球开放，最大上下文100万词元，主打金融、法律、长文档分析、大型代码重构；OpenAI一名工程师因在会议室安装加密录音设备被FBI逮捕，OpenAI称无模型权重、源代码及客户数据泄露；Meta Muse调研关注其战略定位、亚马逊封杀情况及与OpenAI/Anthropic/谷歌personal AI agent的差异化优势；腾讯26Q3国内游戏大盘流水yoy约+9%，手游/端游分别+8%/+11%，《王者荣耀》176亿/yoy+4%。\u003c/li>\n\u003cli>半导体：美光明确2027/2028年供应紧张度显著甚于2026年；ASML Q3销售额117亿欧元，毛利率57.5%，高于一致预期147bps；华为麒麟9050系列芯片实现量产落地，采用逻辑折叠堆叠架构；长鑫科技4F²技术突破在四个交易日内引爆全球半导体市场；ABF载板更多capex、更多紧张；国内晶圆厂设备零部件供应短缺推动国产化加速。\u003c/li>\n\u003cli>PCB/CCL：宝鼎科技26Q3预告中值利润2.1亿元，较Q2的0.7亿元环比*3；兴森科技Q3扣非2.95-3.25亿元，超机构1.5亿元预期，环比207%-238%，前三季度扣非4.2-4.5亿元，同比+182%-202%；建滔积层板10月13日发布涨价通知，因薄布市场需求旺盛，上游玻璃布、玻璃纱供应紧张且价格大幅上涨；鹏鼎控股董事长调研显示AI服务器及光模块PCB需求增长，推动加速扩产；看好国产ABF载板放量机遇。\u003c/li>\n\u003cli>光通信：OCP大会首日光通信、封装、存储器与电力成为焦点；中际旭创展示Open CPX MSA、XPO MSA 12.8T、SDM4标准及USFP 400G/通道模块，获增持评级，H股目标价1385港元；保偏光纤需求爆发式增长，FAU良率极低，实际备货量需超配3-4倍；光迅科技Q3业绩有望高于市场预期5-6亿利润；联讯仪器与源杰科技公告业绩高增长；九州一轨硅光晶圆切割服务客户为中际旭创、新易盛、羲禾科技、熹联光芯等。\u003c/li>\n\u003cli>AIDC电力：数据中心专家电话会对表后BTM发电持乐观态度，预计未来几年建设的大多数新数据中心将采用BTM，表后天然气涡轮机需求估计100GW；美国亚利桑那州Grande Valley数据中心获有条件用地许可，拟配置3693台Bloom Energy 325kW SOFC系统，总规模约1.2GW；金盘科技前三季度营收61.0亿元，同比+17.5%，归母净利润5.4亿元，同比+12%；科泰电源柴发出货量价齐升；通合科技HVDC打开第二增长曲线。\u003c/li>\n\u003cli>新能源/机器人：恩捷股份预计26Q1-3归母净利15.4-20.5亿元，扣非16.3-21.4亿元，对应Q3归母中值9.8亿元，同环比14253%/+74%，扣非中值9.7亿元，同环比14195%/65%，业绩大超市场预期；新能源汽车出口增值税退税率由13%下调至9%，2027年4月1日生效；金力永磁前三季度归母中值7.68亿元，同比+48.9%；北特科技丝杠交付逐级爬坡；人形机器人端侧芯片低算力版本如瑞芯微RK3588算力6TOPS，高算力芯片面向高带宽吞吐量，机器人芯片功耗约束相对更小，但对通信性能与原始算力要求更高；有电池制造商第三季度AI端侧订单放量延续高位。\u003c/li>\n\u003cli>策略/宏观：今日成交16891亿，增量1381亿；证监会召开资本市场与金融形势专家座谈会，释放维稳信号，ETF份额触底回升；特朗普明确表示中期选举前不会攻击伊朗，美伊谈判具有建设性，预计选举前油价波动将有所缓和；霍尔木兹和阿曼湾一天之内有6艘商船遇袭，胡塞武装称沙
