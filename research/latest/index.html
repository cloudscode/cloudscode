AI产业链后续发展。 【投资建议】 下载日志已记录，仅供内部参考 信息技术 行业动态报告  国产大模型公司：【智谱】【腾讯】【阿里巴巴】 【MiniMax】；  重视有垂类专业数据优势、需要精细化运营的公司，壁垒更高： 【汇量科技】【快手】【美图】 2、全球AI产业进展 大模型：Opus 5发布，与4.8同价；继续关注Q3模型迭代 Claude Opus 5于7月24日发布，与Opus 4.8同价，多项跑分反超价格两倍的 Fable 5。Opus 5 定价 $5/$25 每百万token（与4.8 一致，为Fable 5一半），1M token 上下文。跑分：SWE-bench Verified 96.0% （4.8为88.6%）、SWE-bench Pro 79.2%（4.8为69.2%）、Frontier-Bench 43.3%（Fable 5为33.7%）、ARC- AGI-2 90.4%、OSWorld 2.0 70.6%（超Fable 5的66.1%，成本不到后者 1/3）。 图1:大模型智能水平指数： Opus 5目前评分最高 数据来源：Artificial Analysis，中信建投证券 阿里7月19日小范围推出Qwen3.8-Max-Preview，参数量达2.4T，在代码工程和专业办公等场景中表现 出色。Qwen3.8-Max-Preview已上线阿里Token Plan个人版，目前预览版在持续迭代， 正式版将于近期发布并 开源。 继续关注Q3模型更新： 1、GLM 5.3/5.5或将于8月发布，预计GLM 5.5参数过万亿。 下载日志已记录，仅供内部参考 信息技术 行业动态报告 2、MiniMax海螺3近期有望发布，M3大参数版本有望9-10月发布。 3、DeepSeek V4.1、GPT 6、Qwen 3.8\\Qwen 4、Hy4有望Q3发布。 4、继续关注Gemini 3.5 Pro的发布节奏。 商业化：Opus 5改变了高端模型性价比前沿 ，K3将开源模型智能水平拉至接近闭源模型 我们认为：模型能力是支撑定价的核心，定价分化将继续存在；但综合价格或将呈现下降趋势。 Opus 5 的意义在于用Opus档价格交付Fable档能力，改变了高端模型的性价比前沿 1/本周Opus 5发布，模型能力较Opus 4.8提升，而价格与其保持一致；此前， GPT 5.6、GLM 5.2均采用 了同样的变相降价的举动。 2/上周Kimi K3显著提价，因算力紧缺已暂停会员订阅开放，体现了头部模型的议价能力。 图2:全球主流大模型定价梳理（统一划归为美金） 数据来源：各公司官网，中信建投证券 本周大模型公司数据中心 /算力建设进展规划突出。我们认为：1）反映了对AI产业趋势的坚定、对 AI需 求持续增长的看好； 2）Infra是大模型公司优化训推成本的关键，而优化推理成本是在日趋激烈的竞争中率先 实现自我造血、赢得价格战的关键。 1/OpenAI将2030年前基础设施支出预估由约 6000亿上调至7500亿美元（+25%），并将启动收购数据 中心项目Project Camellia。该数据中心项目投资200亿美元、签约3.2GW电力、2028-2032年投运，并已聘请 xAI 前数据中心负责人。 AMD与Anthropic签“芯片+股权”大单。Anthropic将从2027年上半年起采购至多 2GW的AMD 下载日志已记录，仅供内部参考 信息技术 行业动态报告 Instinct MI450 系统；AMD随部署里程碑向 Anthropic 股权投资至多50亿美元（其首笔投资） 。 谷歌本周2Q26财报上修资本开支指引：26年为1950～2050亿美元，相较此前指引 1800～1900 亿，中 值提升150 亿。2027 年仍表述为“显著增长”。 据第一财经，智谱落地 1GW级国产AI算力数据中心。 此外，Meta或将于下周7.29财报官宣云业务。 2/商业化变现端，大模型公司在切入更多落地场景。本周， OpenAI推出OpenAI Presence——帮助企业部 署AI Agent的产品,Presence的核心功能是将AI Agent与企业内部数据、策略、现有软件及工作流连接起来， 帮助企业更好地运行 AI Agent。此外，使用过程中， Codex会提出改进建议。我们认为：核心目的是加快商业 化、优化UE。一方面，从大模型 API/订阅变现拓展至企业软件市场；同时有望加快、加深企业在生产环境对 AI Agent的部署。 Token调用：本周OpenRouter调用量环比略有下滑预计系模型限免优惠到期， Kimi调 用占比提升 本周（7.20-7.26）预计OpenRouter token调用58.2万亿，环比下滑7. 美元（预期811亿），同比 +14%。搜索广告 632.7 亿美元，增速 +17%（上个季度 +19%）。YouTube 广告 110.6 亿美元，增速 +13%（上个季度 +11%） 2 / Gemini 4 开训：\"迄今最激进的预训练 \"。财报披露 Gemini 4 已开训，表述为\"迄今最激进的预训练 \"，并明确\"下一代前沿模型需要大得多的基座模型 \"；3.5 Pro 仍在合作伙伴测试中、暂无时间表（距上代 Pro 已约 150 天）。Gemini App MAU 9.5 亿，2月为7.5 亿，API每分钟 220亿token。 3/Q3起扩大第三方算力采购并提示 “毛利温和压力”，TPU对外销售收入大头是 2027年及以后确认，员工 人数19.89 万人（+6.3%）。 下载日志已记录，仅供内部参考 信息技术 行业动态报告 【Meta】7 月 29 日财报，或官宣云业务，关注云业务和CapE x指引 1 /Q2 财报（7/29 盘后）有望宣布启动云计算业务 ，并关注AI CapE x指引。多家媒体本周报道，Meta 或在 7 月 29 日财报时宣布启动云业务（待财报验证）。铺垫已足够充分： AWS 计算业务资深高管 Dave Brown 即将加入并聚焦数据中心建设；扎克伯格此前称 \"几乎每周\"都有公司寻求其模型或溢价租用闲置算力。 我们认为，若官宣落地， Meta 将成为继 Oracle 之后又一家从\"自用 capex\"转向\"算力产品化\"的巨头，云业务 的收入弹性将直接改变其 capex 的市场叙事（从成本项变投资项）。 2/此外关注Muse Image正式上线后的用户采用率，以及与广告业务协同，有望与 Advantage+创意工具打 通。 【xAI】马斯克官宣 Grok 4.6 两周内、4.7 四周内发布，迭代压缩到 \"两周一版\" 1 / 马斯克 7 月 24 日 X 发帖：\"Grok 4.6 in 2 weeks and Grok 4.7 in 4 weeks\" 。该时间表若兑现，两个 版本都将在 8 月底前落地。此前（7 月 18 日）马斯克已透露 Grok 4.6 为 2 万亿参数模型、\"全面优于 1.5T 的 Grok 4.5\"，目标追上/超越 Kimi K3（2.8T）同时保持接近 4.5 的速度与 token 效率。我们认为，xAI 的策略是用自有 Colossus 算力把迭代节奏压到极限，以速度对冲单点模型能力的差距 ——2T 参数的 4.6 也 让\"国产 vs xAI\"的万亿参数竞赛正式开打。 2 / Grok 4.5 全量上线消费端，办公插件四面出击 。7 月 22 日 grok.com/X/iOS/Android 全面切换至 Grok 4.5；本周连续推出 Grok for Excel（7/20）、Grok for Outlook（7/21）、Google Workspace 插件（7/24， 覆盖 Sheets/Slides/Docs）；Grok Build 上线 Workflows（7/23），可把大任务拆给最多 1024 个并行 agent 执 行。我们认为，xAI 在微软和谷歌的办公腹地同时插旗，打法是 \"模型免费嵌入、靠 SuperGrok 订阅变现\"， 对办公 Agent 的定价体系是潜在扰动。 3 / Cursor 上线 Router 智能路由，收购协同开始落地 。7 月 22 日 Cursor 上线 Router，优先调用自家 模型（Grok 4.5、Composer 2.5），据称 Teams/Enterprise 客户每次 commit 成本最高降 60%。我们认为，这 是 SpaceX 收购 Cursor（预计 Q3 交割）后\"算力+模型+工具\"闭环的第一个可见动作 ——用路由把任务导回 自家模型，本质是把分发变成数据和毛利。 【DeepSeek】V4 正式版灰度放量 1 / V4 满血版本周灰度放量，实测接近 Opus 4.8 级别。本周大量开发者拿到 V4 GA 灰度权限 （Flash/Pro 双版本，标配 100 万 token 上下文），首轮实测：整体接近 Opus 4.8 级别，编码直追 GPT-5.6 Sol，Agent 能力与 3D/SVG 生成显著增强；全量上线时点官方尚未明确（各方信源不一，待核实）。 7 月 24 日旧模型 ID（deepseek-chat/reasoner）正式退役，业务须全部切换至 V4 系列。 下载日志已记录，仅供内部参考 信息技术 行业动态报告 【智谱】据第一财经，公司落地1GW国产算力中心 1 / 7 月 21 日，据第一财经，公司落地 1GW 级国产 AI 算力数据中心（全部采用国产芯片，为国内公 开落地最大级别国产算力项目之一），并完成对国产异构算力软件公司中科加禾（源自中科院计算所编译实验 室）的收购 近期公司有望发布 GLM-5.3，后续期待万亿以上参数的 GLM-5.5。若万亿参数版本落地，将加入国产 3～5T 跃迁的第一梯队。 【MiniMax】期待Q3的大版本模型 根据The Information ，据知情人士，MiniMax 正研发参数规模达 2.7 万亿 的新一代模型（内部代号 \"M3 Pro\"，正式名未定），体量远超现旗舰 M3（4280 亿 参数），计划开源、最早今年三季度发布。 【月之暗面】K3 权重定档 7 月 27 日开放，启动 Pre-IPO 估值目标 500 亿美元 1 / 特别提示：K3将在7 月 27 日放权重。月之暗面官方此前披露 K3（2.8 万亿参数）完整权重将于 7 月 27 日前开放；据 TRAE 社区及多个技术博客确认，权重、训练文档与私有化部署套件定档 7 月 27 日 （下周一）经 Hugging Face发布，模型文件约 594GB、Modified MIT 协议、最低 4×H100 起跑。 2/ K3需求旺盛，暂停会员订阅。公司7月19日晚发布声明：K3发布以来，用户请求量大超预期，逼近 现有集群的承载上限，即日起，暂停 C端新用户订阅，已订阅用户不受影响。随着新算力陆续到位，将陆续开 放订阅名额。此外，对于后续新订阅用户，将拆分 Kimi主权益和Kimi Code权益，以便更精准匹配算力。 3 /启动 Pre-IPO，目标投前 500 亿美元。彭博 7 月 22 日报道，月之暗面计划 8 月启动 Pre-IPO 轮融 资谈判、目标投前估值 500 亿美元，当前一轮（投前 315 亿美元）预计几天内完成， 最快 6 个月内赴港上 市。估值一年内从 43 亿美元升至 500 亿美元。支撑是 ARR 三个月内从 1 亿升至 3 亿美元（6 月中）、 API 收入占比超七成。 【昆仑万维】发布并开源新一代可交互世界模型 Matrix-Game 3.5，重点关注天工AI业务ARR及艾捷科 芯芯片进展。 1/Matrix-Game 3.5推动模型能力向真实场景延伸 ，并坚持开源。此次更新主要体现在： 1）引入Patch Memory，让世界模型的“记忆”更长； 2） PRoPE+Warped RoPE ，让位置编码学会“几何”，更理解视角与空 间的关系；3）动静解耦记忆：避免同一物体的不同姿态污染记忆 ；4）实时推理：720P 20FPS，真正可玩的交 互世界；5）自动化数据管线：让 AI从“看视频”升级为“理解世界”。此外，该模型几乎未新增参数，通过架构 优化实现能力的提升。 下载日志已记录，仅供内部参考 信息技术 行业动态报告 2/7月2日公司宣布，旗下天工AI在今年Q2实现ARR的突破，AI Native模型与产品业务ARR超8亿美 元。其中AI短剧平台业务ARR超7亿美元，AI工具业务ARR突破1亿美元。 3/艾捷科芯新一轮融资后估值 40亿，流片成功后估值有望再提升。 【行情回顾】 大模型及AI 应用相关公司。上涨： 智谱 +11.74%，汇量科技 +1.69%。下跌：MINIMAX-W -9.26%，赤 子城科技 -6.29%，美图公司 -0.76%。 美股重要科技公司：上涨： 超微电脑 +24.48%，美光科技 +8.48%，AMD +5.28%，博通 +2.99%，英伟 达 +1.99%，台积电 +1.27%，阿斯麦 +0.54%。下跌：甲骨文 -9.03%，Meta -7.87%，谷歌-A -7.79%，Palantir -7.15%，微软 -3.08%，苹果 -0.22%。 二、港股互联网 &消费 【个股更新】 【腾讯】基本面稳健无需担忧； WorkBuddy 团队再推设计 Agent「Miora」 1 / 关于本周股价调整：游戏流水担忧系误读，无需担忧基本盘 。7 月 22 日腾讯盘中最多跌 7.1%（创 2025 年 4 月以来最大单日跌幅），市场传闻二季度游戏流水不佳、叠加 AI 投入拖累利润的担忧。其一， SensorTower 等第三方平台对流水的拟合度从 2024 年底以来持续下降，腾讯端游占比持续提升（三角洲 /无畏 契约/英雄联盟端游占比都不低，估算端游占游戏收入至少 30%），且海外游戏收入约占 30%（Supercell、 Riot、Miniclip、GGG 等工作室的部分手游、 PC 流水均不在监测范围内）；其二， 1Q26 末腾讯递延收入存 量 1413 亿元、环比 +28%，随长青游戏占比提升、递延周期拉长，收入将比流水更加平滑稳定。我们预估 Q2 游戏收入仍保持 10% 左右增长，海外投行亦发声认为市场对追踪  。美国主导早期研发与高端定价 ，但跨国药企专利悬崖下需求旺盛 ，中国资产全球性价比凸显 ，内外协同空间广阔 。 国内的价值重塑：聚焦高质量发展 ，筑牢创新与合规根基 。①政策：聚焦高质量发展 ，集采优化、多元化支付、医疗服务价改推进； ②制药链：创新药进入 商业化放量期，关注供应链安全； ③器械：国产替代向中高端延伸 ，看好出海、新科技（AI、脑机接口）及并购整合等新技术落地； ④跟踪中药、药店、医 疗服务等行业触底回升与转型升级的机会 。 出海的价值重塑：多维突破 ，构建全球化新格局 。①创新药：BD常态化，迈入国际化2.0时代；②产业链：国内和海外需求回暖； ③原料药：化解短期扰动 ， 向特色原料药/CDMO转型；④器械：开拓海外市场 ，创新器械自主销售与 BD并行；⑤血制品/疫苗：静丙海外注册 、疫苗出海模式多元 。 2 下载日志已记录，仅供内部参考 内容摘要 存量压力逐步出清，行业整体重回增长。创新企业通过差异化突围，全球化价值兑现。 展望2026年下半年，我们看好： 创新主线：国家政策鼓励行业创新；同时建议积极关注前沿技术的发展。创新药及制药企业（ ADC、二代IO、小核酸、减重、 TCE、AI制药）、创 新药产业链公司（临床前 CXO、AI CXO、CDMO）、器械（AI、脑机接口、手术机器人等）。创新药及制药领域的相关公司包括：恒瑞医药、信达 生物、康方生物、百济神州、科伦药业、科伦博泰、石药集团 /新诺威、荣昌制药、中国生物制药、和黄医药、海思科、信立泰、泽璟制药等；创新 药产业链领域相关公司包括：药明康德、药明合联、药明生物、凯莱英、康龙化成、昭衍新药、百奥赛图等；器械领域的相关公司包括联影医疗、 惠泰医疗、海泰新光等； 出海主线：中国医药产业逐步具备全球竞争力，长期看医药行业有望走出全球性大公司，但投资人也需对出海带来的挑战有充分预期，这必定是一 个长期而曲折的过程。代表性的细分行业是创新药和器械公司，对公司产品及团队国际竞争力的评估是最核心的选股依据。创新药领域关注已有重 磅品种license-out或者co-development的公司，相关公司有百济神州、恒瑞医药、信达生物、康方生物、科伦博泰、三生制药、荣昌生物、百利 天恒等；器械领域包括迈瑞医疗、联影医疗、华大智造等；疫苗领域包括康泰生物、康希诺及欧林生物等。 边际变化主线：（ 1）政策改善：包括医药流通、高值耗材、电生理赛道、医疗设备，看好高端设备进口替代和出海。更新主线，流通领域相关公司 包括国药控股、上海医药、华润医药及九州通等；高值耗材的集采政策逐步出清，关注电生理赛道、医疗设备采购恢复常态化，看好高端设备进口 替代和出海，相关公司包括联影医疗、惠泰医疗等。 （2）需求量价边际回暖： 医疗服务板块消费医疗温和复苏，严肃医疗政策影响边际趋稳，长期 刚需属性不变。中药经历渠道调整后有望在基药目录等催化下边际改善；医药零售加速向“健康驿站”转型升级。 整合主线：建议重点关注器械及中药子行业、部分制药企业、央国企。 风险提示：行业政策风险；研发不及预期风险；审批不及预期风险；宏观环境波动风险。 3 下载日志已记录，仅供内部参考 目录 3风险提示2投资建议及个股分析海外需求持续叠加国内投融资持续回暖，推动行业估值修复1 下载日志已记录，仅供内部参考 下载日志已记录，仅供内部参考 5外需与内需向好推动行业估值修复 CXO板块发展阶段回顾： 1）国内CXO行业2018年起受益于海内外重磅药物品种涌现、国内政策支持及美国降息周期等多重有利因素 ，进入高速成长阶 段，板块业绩及估值双升， 2020年新冠需求进一步推高需求及估值水平。 2）2021年中至2023年，受国内新药研发监管审批政策收紧、本土商业化瓶颈显现、 地缘政治冲突加剧、美元加息周期开启、新冠需求消退等影响，行业需求下滑，业绩及估值双双进入调整期。 3）2024年初《生物安全法案》进一步加重产 业链脱钩担忧，板块估值进一步下滑至严重偏离基本面水平，部分龙头公司估值从此前高点的未来 12个月2-4xPEG下滑至不到0.5xPEG。4）2024年下半年 以来，随着美元降息预期走强、龙头公司订单 /业绩表现超预期、法案未能落地等因素驱动，行业估值开始修复。 2025年以来，随着市场对 《生物安全法案》 实质影响认知回归理性、头部公司业绩持续超预期、 CXO板块估值持续向基本面修复。后续随着 AI制药热度提升、创新药景气度延续，行业 beta持续向好。5） 26年受潜在加息预期、港股流动性收紧等因素影响、板块表现调整后进入再平衡阶段、估值趋近业绩导向。板块（ TTM）PE平均估值回升至约25x水平，12 个月前瞻市盈率在 15-20x，多数公司当前股价距 2027年1xPEG仍有较大 ：国内和海外需求回暖； ③原料药：化解短期扰动 ， 向特色原料药/CDMO转型；④器械：开拓海外市场 ，创新器械自主销售与 BD并行；⑤血制品/疫苗：静丙海外注册 、疫苗出海模式多元 。 2 下载日志已记录，仅供内部参考 内容摘要 存量压力逐步出清，行业整体重回增长。创新企业通过差异化突围，全球化价值兑现。 展望2026年下半年，我们看好： 创新主线：国家政策鼓励行业创新；同时建议积极关注前沿技术的发展。创新药及制药企业（ ADC、二代IO、小核酸、减重、 TCE、AI制药）、创 新药产业链公司（临床前 CXO、AI CXO、CDMO）、器械（AI、脑机接口、手术机器人等）。创新药及制药领域的相关公司包括：恒瑞医药、信达 生物、康方生物、百济神州、科伦药业、科伦博泰、石药集团 /新诺威、荣昌制药、中国生物制药、和黄医药、海思科、信立泰、泽璟制药等；创新 药产业链领域相关公司包括：药明康德、药明合联、药明生物、凯莱英、康龙化成、昭衍新药、百奥赛图等；器械领域的相关公司包括联影医疗、 惠泰医疗、海泰新光等； 出海主线：中国医药产业逐步具备全球竞争力，长期看医药行业有望走出全球性大公司，但投资人也需对出海带来的挑战有充分预期，这必定是一 个长期而曲折的过程。代表性的细分行业是创新药和器械公司，对公司产品及团队国际竞争力的评估是最核心的选股依据。创新药领域关注已有重 磅品种license-out或者co-development的公司，相关公司有百济神州、恒瑞医药、信达生物、康方生物、科伦博泰、三生制药、荣昌生物、百利 天恒等；器械领域包括迈瑞医疗、联影医疗、华大智造等；疫苗领域包括康泰生物、康希诺及欧林生物等。 边际变化主线：（ 1）政策改善：包括医药流通、高值耗材、电生理赛道、医疗设备，看好高端设备进口替代和出海。更新主线，流通领域相关公司 包括国药控股、上海医药、华润医药及九州通等；高值耗材的集采政策逐步出清，关注电生理赛道、医疗设备采购恢复常态化，看好高端设备进口 替代和出海，相关公司包括联影医疗、惠泰医疗等。 （2）需求量价边际回暖： 医疗服务板块消费医疗温和复苏，严肃医疗政策影响边际趋稳，长期 刚需属性不变。中药经历渠道调整后有望在基药目录等催化下边际改善；医药零售加速向“健康驿站”转型升级。 整合主线：建议重点关注器械及中药子行业、部分制药企业、央国企。 风险提示：行业政策风险；研发不及预期风险；审批不及预期风险；宏观环境波动风险。 3 下载日志已记录，仅供内部参考 目录 3风险提示2投资建议及个股分析海外需求持续叠加国内投融资持续回暖，推动行业估值修复1 下载日志已记录，仅供内部参考 下载日志已记录，仅供内部参考 5外需与内需向好推动行业估值修复 CXO板块发展阶段回顾： 1）国内CXO行业2018年起受益于海内外重磅药物品种涌现、国内政策支持及美国降息周期等多重有利因素 ，进入高速成长阶 段，板块业绩及估值双升， 2020年新冠需求进一步推高需求及估值水平。 2）2021年中至2023年，受国内新药研发监管审批政策收紧、本土商业化瓶颈显现、 地缘政治冲突加剧、美元加息周期开启、新冠需求消退等影响，行业需求下滑，业绩及估值双双进入调整期。 3）2024年初《生物安全法案》进一步加重产 业链脱钩担忧，板块估值进一步下滑至严重偏离基本面水平，部分龙头公司估值从此前高点的未来 12个月2-4xPEG下滑至不到0.5xPEG。4）2024年下半年 以来，随着美元降息预期走强、龙头公司订单 /业绩表现超预期、法案未能落地等因素驱动，行业估值开始修复。 2025年以来，随着市场对 《生物安全法案》 实质影响认知回归理性、头部公司业绩持续超预期、 CXO板块估值持续向基本面修复。后续随着 AI制药热度提升、创新药景气度延续，行业 beta持续向好。5） 26年受潜在加息预期、港股流动性收紧等因素影响、板块表现调整后进入再平衡阶段、估值趋近业绩导向。板块（ TTM）PE平均估值回升至约25x水平，12 个月前瞻市盈率在 15-20x，多数公司当前股价距 2027年1xPEG仍有较大空间。 数据来源：Wind（20260706），中信建投证券020406080100120140 0%100%200%300%400%500%600% 2019-01-04 2020-04-04 2021-07-04 2022-10-04 2024-01-04 2025-04-04 2026-07-04医疗研发外包(申万)沪深300医药生物(申万)PE（申万医药外包） 20Q2全 球疫 情爆 发， 美元进入降息周期； 20Q3起，海 外供 应 链 向国内转移，国内CXO 企业优势凸显 21H1板块业绩持续兑 现21年7月，CDE “以临 床价值为 供应链安全； ③器械：国产替代向中高端延伸 ，看好出海、新科技（AI、脑机接口）及并购整合等新技术落地； ④跟踪中药、药店、医 疗服务等行业触底回升与转型升级的机会 。 出海的价值重塑：多维突破 ，构建全球化新格局 。①创新药：BD常态化，迈入国际化2.0时代；②产业链：国内和海外需求回暖； ③原料药：化解短期扰动 ， 向特色原料药/CDMO转型；④器械：开拓海外市场 ，创新器械自主销售与 BD并行；⑤血制品/疫苗：静丙海外注册 、疫苗出海模式多元 。 2 下载日志已记录，仅供内部参考 内容摘要 存量压力逐步出清，行业整体重回增长。创新企业通过差异化突围，全球化价值兑现。 展望2026年下半年，我们看好： 创新主线：国家政策鼓励行业创新；同时建议积极关注前沿技术的发展。创新药及制药企业（ ADC、二代IO、小核酸、减重、 TCE、AI制药）、创 新药产业链公司（临床前 CXO、AI CXO、CDMO）、器械（AI、脑机接口、手术机器人等）。创新药及制药领域的相关公司包括：恒瑞医药、信达 生物、康方生物、百济神州、科伦药业、科伦博泰、石药集团 /新诺威、荣昌制药、中国生物制药、和黄医药、海思科、信立泰、泽璟制药等；创新 药产业链领域相关公司包括：药明康德、药明合联、药明生物、凯莱英、康龙化成、昭衍新药、百奥赛图等；器械领域的相关公司包括联影医疗、 惠泰医疗、海泰新光等； 出海主线：中国医药产业逐步具备全球竞争力，长期看医药行业有望走出全球性大公司，但投资人也需对出海带来的挑战有充分预期，这必定是一 个长期而曲折的过程。代表性的细分行业是创新药和器械公司，对公司产品及团队国际竞争力的评估是最核心的选股依据。创新药领域关注已有重 磅品种license-out或者co-development的公司，相关公司有百济神州、恒瑞医药、信达生物、康方生物、科伦博泰、三生制药、荣昌生物、百利 天恒等；器械领域包括迈瑞医疗、联影医疗、华大智造等；疫苗领域包括康泰生物、康希诺及欧林生物等。 边际变化主线：（ 1）政策改善：包括医药流通、高值耗材、电生理赛道、医疗设备，看好高端设备进口替代和出海。更新主线，流通领域相关公司 包括国药控股、上海医药、华润医药及九州通等；高值耗材的集采政策逐步出清，关注电生理赛道、医疗设备采购恢复常态化，看好高端设备进口 替代和出海，相关公司包括联影医疗、惠泰医疗等。 （2）需求量价边际回暖： 医疗服务板块消费医疗温和复苏，严肃医疗政策影响边际趋稳，长期 刚需属性不变。中药经历渠道调整后有望在基药目录等催化下边际改善；医药零售加速向“健康驿站”转型升级。 整合主线：建议重点关注器械及中药子行业、部分制药企业、央国企。 风险提示：行业政策风险；研发不及预期风险；审批不及预期风险；宏观环境波动风险。 3 下载日志已记录，仅供内部参考 目录 3风险提示2投资建议及个股分析海外需求持续叠加国内投融资持续回暖，推动行业估值修复1 下载日志已记录，仅供内部参考 下载日志已记录，仅供内部参考 5外需与内需向好推动行业估值修复 CXO板块发展阶段回顾： 1）国内CXO行业2018年起受益于海内外重磅药物品种涌现、国内政策支持及美国降息周期等多重有利因素 ，进入高速成长阶 段，板块业绩及估值双升， 2020年新冠需求进一步推高需求及估值水平。 2）2021年中至2023年，受国内新药研发监管审批政策收紧、本土商业化瓶颈显现、 地缘政治冲突加剧、美元加息周期开启、新冠需求消退等影响，行业需求下滑，业绩及估值双双进入调整期。 3）2024年初《生物安全法案》进一步加重产 业链脱钩担忧，板块估值进一步下滑至严重偏离基本面水平，部分龙头公司估值从此前高点的未来 12个月2-4xPEG下滑至不到0.5xPEG。4）2024年下半年 以来，随着美元降息预期走强、龙头公司订单 /业绩表现超预期、法案未能落地等因素驱动，行业估值开始修复。 2025年以来，随着市场对 《生物安全法案》 实质影响认知回归理性、头部公司业绩持续超预期、 CXO板块估值持续向基本面修复。后续随着 AI制药热度提升、创新药景气度延续，行业 beta持续向好。5） 26年受潜在加息预期、港股流动性收紧等因素影响、板块表现调整后进入再平衡阶段、估值趋近业绩导向。板块（ TTM）PE平均估值回升至约25x水平，12 个月前瞻市盈率在 15-20x，多数公司当前股价距 2027年1xPEG仍有较大空间。 数据来源：Wind（20260706），中信建投证券020406080100120140 0%100%200%300%400%500%600% 2019-01-04 2020-04-04 2021-07-04 2022-10-04 2024-01-04 2025-04-0 ish_time": "2026-07-26 11:47", "tags": ["笔记链接"]}, "post:2026-07-26T18-34:e2657b0d0d98": {"id": "post:2026-07-26T18-34:e2657b0d0d98", "kind": "post", "title": "2026-07-26 18:34", "source_label": "帖子正文", "excerpt": "锂电池材料价格周报https://share.note.youdao.com/ynoteshare/mobile.ht...光伏价格周报https://share.note.youdao.com/ynoteshare/mobile.ht...#笔记链接", "content": "锂电池材料价格周报https://share.note.youdao.com/ynoteshare/mobile.ht...光伏价格周报https://share.note.youdao.com/ynoteshare/mobile.ht...#笔记链接", "publish_time": "2026-07-26 18:34", "tags": ["笔记链接"]}, "attachment:files/宁德时代2026年半年.docx": {"id": "attachment:files/宁德时代2026年半年.docx", "kind": "attachment", "title": "宁德时代2026年半年", "source_label": "其他", "excerpt": "宁德时代2026年半年报业绩解读会 由我向各位投资人介绍公司的出席领导。出席本次会议的有公司董事会秘书兼副总经理蒋理先生，CFO郑舒先生。", "content": "宁德时代2026年半年报业绩解读会 由我向各位投资人介绍公司的出席领导。出席本次会议的有公司董事会秘书兼副总经理蒋理先生，CFO郑舒先生。今天会议流程分成两部分，首先由我为各位简要汇报报告期内的公司经营情况，然后进入问答互动环节。2026年上半年，公司经营业绩持续稳健增长，报告期内公司实现收入2769.2亿元，同比增长54.8%。归属上市公司股东的利润432.8亿元，同比增长40%。 二年化ROE 24.2%，持续在较高水平。动力业务国内市场份额提升。根据中国汽车动力电池产业创新联盟数据，2026年1到6月，公司在国内市场乘用车装车量份额达46.7%，同比提升5.6个百分点。其中公司国内三元动力电池装车量份额达到75.2%，同比提升4.3个百分点。 报告期内，公司以先进产品、优质服务获得客户认可。其中，神行电池凭借在高性能、超快充、高安全等方面的综合优势，成为高端纯电车型的配套优选。逍遥超混增程电池助力客户推出兼具大电量、长纯电续航的热销增程式混动车型。海外市场稳步推进，根据SNE数据，2026年1到5月，公司海外市场份额为33.7%，同比提升3.7个百分点。随着公司海外基地建设运营的逐渐成熟，公司以先进的产品以及优质的服务持续助力宝马、戴姆勒、沃尔沃、塔塔等海外客户取得亮眼市场表现，同时助力国内品牌车企奇瑞、吉利、上汽、长城、零跑等拓展海外市场。产品技术持续引领乘用车领域。公司发布了全球领先的第三代神行超充电池、第三代麒麟电池、麒麟凝聚态电池、第二代逍遥增混电池以及钠新电池，满足超快充、高性能、宽温域、高安全等性能要求，其中第三代神行超充电池和第三代麒麟电池均可实现峰值充电倍率15C，助力补能效率大幅提升。商用车领域，公司发布了天行二新车全场景定制化系列解决方案，面向城配、城际、末端配送及航区运输等核心场景，满足多元运营需求。 储能业务产业协同推进，开放共赢。公司秉承开放共赢的合作理念，与全球系统集成商、投资商、开发商、电网公司及EPC总包商、核心贡献企业等客户及伙伴推进生态共建及合作，供应国内市场。公司与海博思创签署为期三年、总规模达67GWh的钠离子电池储能战略合作协议，推动钠电迎来产业化拐点。公司携手供应链企业落地2000MWh单体下行独立储能项目，打造网侧项目标杆。海外市场，公司在德国、西班牙、智利、马来西亚、澳大利亚等国家中标多个储能系统集成项目，其中欧洲项目涵盖黑启动应用场景，通过规模化的储能集成系统落地支撑当地电网安全。公司持续推出交互创新产品，发布了全球首款具备宽温域适配、模块化设计的实证场站型钠电储能解决方案，均衡钠电储能系统，可大幅提升整站在线率，显著优化运维成本。 国内市场，公司持续量产交付全球领先的天恒6.25兆瓦时集装箱式液冷电池舱，其加载的587安时大容量储能专用电芯已实现规模化交付。海外市场，公司量产交付全球首款9兆瓦时超大容量储能系统解决方案，该方案搭载高温电池技术，适配高温场景，并集成于集装箱系统。根据Wood Mackenzie报告期内发布数据，2025年公司位列全球储能系统集成商Grade A排名前三，成为可融资性行业标杆，并在全球、欧洲、亚太、韩国、中国等多个市场榜单的集成产品出货量中位列TOP 10。 生态方面，换电生态网络布局乘用车领域。截至报告期发布日，全国累计建成巧克力换电站约2000座，覆盖31个省份180座城市。随着换电网络的逐步完善，公司与多家车企的多个乘用车品牌发布换电车型超20款。同时公司已发布了全面适配800伏高压平台的巧克力26号电池。商用车领域，公司与解放、陕汽、重汽等整车企业持续合作，深入推动换电车型升级与换电网络建设，在山东、山西等核心区域打造1.5小时干线补能圈，实现五条换电干线纳入国家零碳货运走廊建设，并在常熟高速干线场景规模化应用。在海外，公司与英国新能源科技公司Joule Energy宣布将成立合资公司，共同建设欧洲重卡换电网络，推动欧洲公路货运电动化转型。此外，公司推进换电站升级为超换一体站，逐步构建可换可充、超换联动的智能网络。 资本方面，公司高度重视股东回报，坚持以高强度科技创新驱动业务拓展，在保持技术、产品、服务领先优势的同时，积极为股东创造长期价值。2026年4月，公司完成H股50亿美金配售，助力全球战略加速推进。公司于本报告披露同步公告了董事会审议通过2026年中期分红方案，预计分红总额达65亿元。此外公司董事会还审议通过200到400亿A股股份回购方案，回购的股份将用于注销并减少公司注册资本。该议案已提交股东大会进一步审议。关于公司上半年经营情况，简要汇报如上。 嘉宾2：下面有请。 嘉宾3：尾号26981的参会者进行提问。请您优先播报您的姓名和机构名。由于时间关系，请最多提问两个问题，谢谢。 嘉宾4：蒋总、郑总和美娜总好，我是东吴证券的电新首席曾朵红。首先恭喜公司取得非常不错的业绩，同时也推出了非常巨额的回购。我第一个问题是想问一下我们二季度的发货量以及动储的比例，进而再延伸问一下我们对下半年及明年动储需求的展望。第二个问题是市场非常关心的，就是前面美娜总提到的储能大电芯587系列，今年产能和产量、产能爬坡情况以及未来放量的节奏。另外储能方面还想延伸问一下市场端，前面中东项目有一些变化，大家比较关心海外储能市场我们做系统方面的策略，会不会有价格竞争的手段，以及整体策略的考虑。主要是这两个方面。 嘉宾2：好的，谢谢东吴证券的提问。我们的中报刚刚发布，可以看到上半年的整体情况。我们上半年整体的销售量（不叫出货量）比去年同比增长了差不多60%。其中动储里面，储能占到了1/4，比之前的比例有所提升，这体现了公司在储能方面的布局和比例提升。说到中东或海外的情况，我觉得公司不光在国内储能增长，海外储能业务增速也非常快，甚至订单速度可能比国内还更快。另外，现在不管是国内还是海外，都面临价格内卷的问题。但我们一直坚持高质量发展，用高品质、长寿命、高安全的电池作为给客户的承诺和底线。Robin经常说，我们不卷价格，卷价值。所以竞争都会有，但我们会坚持好既有的策略和方针，不管是储能还是动力，不管是国内还是海外。讲到储能，我们不仅卖电芯，在系统集成、综合服务、售后等方面，包括大总包，在海外布局也逐渐开展。我们相信凭借好的产品性能、品质、安全和整个服务质量，能赢得客户认可。谢谢。 嘉宾4：好的，蒋总，另外我们对于需求的展望怎么看？动力和储能方面。 嘉宾2：你说需求的展望是指什么时间维度？ 嘉宾4：下半年以及明年。 嘉宾2：下半年和明年，我们现在看市场情况非常好。你可以从我们的排产情况来看，下半年趋势是比较确定的。明年有很多因素叠加，但我们仍然比较看好。所以我们今天上半年产能都是打满的，从库存中也可以看出我们为下半年做了准备。公司以实际行动表明对市场的认可和看好。之前也有一些传闻，大家关心是不是有人说需求不好，但市场这么大，什么产品都有。请各位分析师和投资朋友相信公司的官方表达，不要听小道消息。谢谢。 嘉宾4：明白，回购也能看出信心很强。蒋总，587储能电芯的出货情况和产能爬坡情况能不能也说一下？ 嘉宾2：情况很好，推出来之后客户很认可，我们很快进行了规模化交付，这是一个很好的产品，结合了各方面的甜点，很受客户认可。具体产品细节不需要过多关注了吧。 嘉宾4：明白，好的，我暂时问这么多。谢谢。 嘉宾2：谢谢蒋总，谢谢郑舒总。 嘉宾3：好，下面有请尾号8505的参会者进行提问。请优先播报您的姓名和机构名，由于时间关系，请最多提问两个问题，谢谢。 嘉宾6：蒋总、郑总、美娜总好，我是摩根的Rebecca。第一个问题是关于价格部分，分成两个小问题：一是近期的消费税和之前初步的出口退税政策，我们要怎么理解这些政策对我们跟客户谈价的影响，是否可以把这部分税传导到客户？二是与价格相关的，虽然管理层之前说过价格合同有金属联动，但现在车厂客户日子较难过，除了合同价格联动，我们有没有看到车厂客户要求更多返利？目前返利情况怎么样？ 嘉宾2：好的，谢谢。郑舒总来回答。 嘉宾5：你好，谢谢Rebecca。我回答第一个问题，关于消费税和出口退税。出口退税是之前有比较明确的消息，消费税是上上两周的新安排。实际上，无论是出口退税还是消费税，都是新的国家政策，有利于头部企业获取中国整个产业链在国际竞争中的优势，包括在国内运营中更有序，对头部更有利。整体上价格传导方面，我们跟客户进行充分沟通，大家共同分担增加的这部分成本。总体上对我们整体经营情况影响不大，是可以很好安排的，能跟下游客户共同商量。第二个问题，金属联动我们一直有在执行。关于返利，今年我们的几个主要客户在市场上表现不错，出货量从我们这边的订货量也有显著增加。我们的返利协议是与量挂钩的，如果他们在市场端有很好表现，我们在返利机制上也会按照协议进行部分兑现。大概就是这个情况，谢谢。 嘉宾2：对，从财务报表中也可以看到我们一直有体现对客户的反馈。 嘉宾6：谢谢郑总。想跟进一下，您提到跟客户协商税收传导，出口退税是较早出来的政策，这部分是已经协商完了吗？还是大部分已经协商完了？ 嘉宾5：出口退税是分阶段进行调整的，从13个点到9个点，到接下来二季度、三季度、四季度面临的4个点到2027年的0，是一个逐渐的过程。过程中我们会跟主要客户进行协商，有一定比例的分摊。大的方向上，各方还是能比较妥善地沟通。具体谈的比例不太方便透露，但客户都很愿意共同面对并顺利传达。 嘉宾2：好的，谢谢。 嘉宾6：我刚刚第一个问题有两个小点。第二个问题相对长远一点，关于AIDC的布局。我们看到近期两个月公司有很多投资方面的动作，市场应该怎么想象宁德时代在未来五年内在AIDC的布局？除了储能电芯之外，我们还有计划做其他什么部分？最近也看到很多这方面的工作，谢谢。 嘉宾2：好，谢谢Rebecca的问题。你看到我们的一些动作。AI的事情大家都看到，从GPT以来，AI发展非常迅速，模型能力快速提升，对算力的需求飞速增长，也带来了芯片、存储等基础设施的巨大需求。但AIDC基础设施的建设还没有被完全重视起来，特别是IDC对能源的需求、供电系统的要求有非常独特或更高的要求。我们看到了这个节奏性的机会，可以为数据中心基础设施提供一整套能源解决方案，覆盖从中压侧到灰区、白区的整个供电，并提供最好的设备和储能及备用解决方案。所以这个布局是有的。AI基础设施未来的前景非常远大，我们对未来的期望很高。谢谢。 嘉宾3：下面有请尾号0751的参会者进行提问。请您优先播报您的姓名和机构名。由于时间关系，请最多提问两个问题，谢谢。 嘉宾7：各位好，我是长江电新的分析师曹海花。我这边两个问题。第一个是看到我们上半年财报披露的产能，年化大概能到1050个GWh，在建产能大概有764个GWh。这些在建产能是否都能在2027年落地？或者说2027年有效产能预计能到多少？第二个是钠电方面，最近我们看到了合计约7个多GWh的钠电大单，我们对钠电的产业规划和初步目标在这个时点上有没有更新？ 嘉宾2：谢谢长江的朋友。第一个问题，从产能角度看，不管是已投产建成产能还是在建产能，相比之前都有一些提升。就像我们之前交流的，我们对未来市场看得很清楚，所以提前开展了产线和产能建设。但客观讲，去年到今年上半年产能利用率仍然非常满，很多情况下没有完全满足客户需求，受制于产能建设。这些产能在未来一两年内大部分应该可以建成投产，但我不敢说全部都是大部分。第二个问题，对于钠电，我们在今年4月新品发布会和车展上有过交流，陆续看到客户开始签钠电订单，国内有大的集成商，欧洲集成商也签了订单。国内外客户对钠电产品认可程度很高。我们已经开展了相关产线建设和供应链布局，会快速完成产线建设并开始交付，谢谢。 嘉宾7：明白，那能不能结合我们对需求的判断和产能建设进度，给一个有效产能的增速区间？ 嘉宾5：我们的产能规划是根据总需求来看的。现在钠电逐渐有一些规模化的订单，大的订单。但我想强调，我们的产线是锂钠可共线的，所以总体的新产能中就包括了钠电扩张。将来如果钠电需求超出预期，我们也可以快速灵活调整产线，不用特别担心在产能方面的准备。 嘉宾7：我主要是想问锂电这块的产能，大家确实比较想知道您对需求或相关范围的一些判断，毕竟我们是这个行业最有话语权的角色。 嘉宾2：之前东吴的朋友也在问下半年和明年的需求，我们这边已经做了回复。从目前我们手上的信息，包括排产和产能线，可以看到我们对未来几年是很有信心、很有把握的，所以我们才做这么大的投产。你可以根据这个大致框架出我们对市场的展望。尽管大家可能有很多担心和质疑，但整个电气化市场的发展已经不是单一某个点开花。大家觉得乘用车 的多个问题。 一、经营业绩概览 2026年上半年，公司实现收入2769.2亿元，同比增长54.8%；归母净利润432.8亿元，同比增长40%；年化ROE达24.2%，持续处于较高水平。动力电池业务国内市场份额提升，乘用车装车量份额达46.7%（同比+5.6pct），其中三元动力电池份额达75.2%（同比+4.3pct）。海外市场稳步推进，1-5月海外市场份额33.7%（同比+3.7pct）。公司通过先进产品（如神行超充、麒麟、逍遥增混、钠新电池等）和优质服务赢得客户认可，商用车领域发布了天行二新车全场景定制化解决方案。 二、储能业务 储能业务高速增长，公司与海博思创签署67GWh钠离子电池储能战略合作协议，并落地2000MWh独立储能项目。海外中标多个系统集成项目，涵盖黑启动等场景。公司发布了宽温域、模块化设计的钠电储能解决方案，以及天恒6.25MWh集装箱式液冷电池舱和9MWh超大容量储能系统。根据Wood Mackenzie数据，2025年公司位列全球储能系统集成商Grade A前三，成为可融资性标杆。 三、换电生态 换电网络快速扩张，乘用车领域全国累计建成巧克力换电站约2000座，覆盖31个省份180座城市，发布换电车型超20款，并推出适配800V平台的巧克力26号电池。商用车领域与解放、陕汽、重汽等合作，在山东、山西等区域打造1.5小时干线补能圈，五条换电干线纳入国家零碳货运走廊。海外与Joule Energy合作建设欧洲重卡换电网络。公司推进超换一体站，构建可换可充、超换联动的智能网络。 四、资本与股东回报 公司完成H股50亿美元配售，助力全球战略。董事会审议通过2026年中期分红方案（预计65亿元）和200-400亿元A股股份回购方案（用于注销减少注册资本），彰显对股东回报的重视。 五、问答环节要点 出货量与需求展望：上半年销售量同比增长约60%，储能占比提升至1/4。公司对下半年和明年需求非常看好，产能利用率饱满，提前备货。市场担忧纯电动销量放缓、补贴退坡等，但公司认为电气化是多市场、多领域、多区域的全面趋势，新兴市场增速更快，动力电池单车带电量提升和商用车爆发带来增量，储能需求国内外均强劲。 价格与税收政策：出口退税和消费税是新的国家政策，有利于头部企业。公司通过与客户充分沟通，共同分担成本，影响整体可控。金属联动持续执行，返利与量挂钩，主要客户出货量增长带来返利兑现。 AIDC布局：宁德时代定位零碳科技公司，不仅提供储能产品，还提供数据中心一整套能源解决方案，覆盖中压侧到灰区、白区的供电，并涉及风光开发、绿电等。AIDC是零碳大战略的一部分，未来将通过投资、技术研发、合作开发等多种方式推进，不会轻率行动，但会坚定布局。 产能建设：在建产能大部分将在未来一两年内建成投产。公司根据需求预判提前建设，产能利用率高。钠电产线可与锂电共线，灵活调整。锂电产能规划基于对市场的信心，无需过度担心产能准备。 钠离子电池：钠电已获得国内外大客户订单（如海博思创67GWh、欧洲集成商等），供应链成熟，产线建设中。成本优势随规模化显现，但更突出的是宽温域、低温、长循环等性能优势。 欧洲市场与匈牙利工厂：欧洲电动车增速30%，渗透率超30%，趋势明确；储能需求增长更快。匈牙利工厂电芯模组厂已投产，电芯厂建成，处于最后审批阶段，公司注重合规与ESG，按节奏推进。 毛利率与单位净利：公司整体毛利率稳定，单位净利（每瓦时净利）过去十几个季度相对稳定，是真实盈利能力的体现。毛利率波动受产品结构、原材料价格数学影响，盈利能力本质稳定。新业务投入（如C端宣传、换电）导致销售费用略有增加，属合理区间。 确收与发货关系：从排产到发货到确认收入存在时间差，储能系统级交付周期长（可能超过6个月），上半年储能占比提升导致确收节奏慢于发货，但后续会逐步确认。 上游资源：公司从2019年开始布局供应链，今年成立时代资源集团统筹资源。具体矿端（如枧下窝）以政府公告为准，公司将保障供应、降低成本。 股东回报：回购是case by case的决策，基于公司发展前景、财务状况和股价低估，未来能否常态化需综合考虑融资、监管等因素。公司始终对未来充满信心。 储能占比与海外趋势：当前储能收入中国占5-6成，海外接近5成，pack占六成以上。未来海外占比将持续提升，因海外电动化起步晚、空间大。 零碳与AIDC落地：公司零碳方案未来一两年将逐步落地，AIDC是其中一环。国家政策推动零碳方向，落地速度会加快。 总体来看，宁德时代上半年业绩优异，各项业务全面开花，管理层对下半年及未来需求保持乐观，并通过技术创新、产能建设、全球布局、生态合作及股东回报等多维度举措，巩固行业领先地位。", "status": "extracted"}, "attachment:files/HSBC-锂——越过峰顶.pdf": {"id": "attachment:files/HSBC-锂——越过峰顶.pdf", "kind": "attachment", "title": "HSBC-锂——越过峰顶", "source_label": "HSBC", "excerpt": "4FRHUIn3oUcUeU8OcM6MpNqQsQpRjMnNsNeRsQmR7NmNmNvPmMmRMYmMmR", "content": "4FRHUIn3oUcUeU8OcM6MpNqQsQpRjMnNsNeRsQmR7NmNmNvPmMmRMYmMmR", "status": "extracted"}, "post:2026-07-26T22-04:ddbb1894180c": {"id": "post:2026-07-26T22-04:ddbb1894180c", "kind": "post", "title": "2026-07-26 22:04", "source_label": "帖子正文", "excerpt": "周观点：国产大模型迭代提速，7月游戏版号创年内新高AI：月之暗面于7月16日发布新一代旗舰模型Kimi K3，模型总参数规模达2.8万亿，具备100万Token上下文窗口及原生视觉理解能力，为目前全球参数规模最大的开源模型，完整权重预计于7月27日发布。本周，阿里发布新一代旗舰基座模型Qwen3.8", "content": "周观点：国产大模型迭代提速，7月游戏版号创年内新高AI：月之暗面于7月16日发布新一代旗舰模型Kimi K3，模型总参数规模达2.8万亿，具备100万Token上下文窗口及原生视觉理解能力，为目前全球参数规模最大的开源模型，完整权重预计于7月27日发布。本周，阿里发布新一代旗舰基座模型Qwen3.8-Max预览版，参数规模达2.4万亿，复杂推理、代码及多模态能力进一步提升；DeepSeek V4正式版进入灰度测试，包含Flash和Pro两个版本，整体性能及编码能力继续向全球头部闭源模型靠拢，并首次引入峰谷计费机制，进一步降低非高峰时段的模型调用成本。我们认为，近期国产头部厂商密集推进旗舰模型迭代，大参数开源模型的供给节奏快于此前预期，模型能力持续向复杂推理、代码生成、长上下文及多模态方向升级，同时推理成本与服务效率不断优化，有望进一步降低AI应用开发和部署门槛，加快AI Agent、内容生产及企业服务等场景落地；参数规模及推理复杂度提升亦将持续拉动高端推理算力需求，带动国内云服务商AI业务收入及盈利能力改善。短期建议关注Qwen3.8、DeepSeek V4正式版、MiniMax 3....", "publish_time": "2026-07-26 22:04", "tags": ["文字观点"]}, "attachment:files/GS-全球数据中心容量更新——扩容预期上调，供需紧平衡持续.pdf": {"id": "attachment:files/GS-全球数据中心容量更新——扩容预期上调，供需紧平衡持续.pdf", "kind": "attachment", "title": "GS-全球数据中心容量更新——扩容预期上调，供需紧平衡持续", "source_label": "GS", "excerpt": "Asia Pacific Equity Research 23 July 2026 J P M O R G A N Technology - Hardware Albert Hung AC (886-2) 2725-9875 albert.hung@jpmchase.com J.P. Morgan Securities (Taiwan) Limited/ J", "content": "Asia Pacific Equity Research 23 July 2026 J P M O R G A N Technology - Hardware Albert Hung AC (886-2) 2725-9875 albert.hung@jpmchase.com J.P. Morgan Securities (Taiwan) Limited/ J.P. Morgan Securities (Asia Pacific) Limited/ J.P. Morgan Broking (Hong Kong) Limited Anthony Leng (886-2) 2725-9240 anthony.leng@jpmorgan.com J.P. Morgan Securities (Taiwan) Limited Gokul Hariharan (852) 2800-8564 gokul.hariharan@jpmorgan.com J.P. Morgan Securities (Asia Pacific) Limited/ J.P. Morgan Broking (Hong Kong) Limited Jerry Tsai (886-2) 2725-9867 jerry.tsai@jpmorgan.com J.P. Morgan Securities (Taiwan) LimitedAlphabet (OW, covered by J.P. Morgan US Internet Analyst Doug Anmuth) reported Jun-Q earnings before the Asia market open today. The key implications for the Asian tech supply chain are as follows: Google •Google’s Jun-Q Capex was US$45bn (+26% QoQ, +100% YoY), in line with market expectations. Server spending comprised 60% of the Capex while the remaining 40% of spending was for datacenter build-out and networking equipment. We believe CSPs have been increasing the server spending mix in total Capex given their recent Capex raise driven by the component cost hikes . •Google has raised its full-year 2026 Capex to US$195-205bn (~120% YoY growth at the midpoint) from US$180-190bn, driven by strong customer demand and an acceleration in capacity delivery. This is the second round of Capex increase in a row and implies ~50% HoH Capex growth in 2H26. Looking into next year, Google expects a significant Capex uptick despite the high base this year due to undersupplied computing power. •Google continues to see supply constraints and expects an increase in usage of third-party capacity in 3Q26 to support the strong demand. Of note, Google Gemini’s DAU has tripled YoY and the token consumption rate increased 38% QoQ in 2Q26. This bodes well for the pricing dynamics of NeoCloud vendors as well as server brands, in our view. •Google’s cloud revenue was up 24%/82% QoQ/YoY in Jun-Q with continued margin improvement to 35.6% vs. 32.9%/20.7% in 1Q26/2Q25. Cloud revenue accelerated significantly from 63% YoY growth last quarter and was 10% better than Street estimates, driven by strength across core GCP, AI solutions, and AI infrastructure. AI cloud revenue significantly outgrew core product revenue due to strong demand for enterprise AI products. •Google Cloud’s backlog increased by US$50bn+ QoQ to US$514bn in 2Q26, driven by strong demand for Google’s Enterprise AI products. The majority of the order backlog is related to traditional GCP contracts. Management expects to recognize 50% of the total backlog as revenue over the next 2 years, which implies a quarterly run rate of Google Cloud revenue to reach US$30bn+ from the current level of ~US$25bn. •Google started delivering TPU systems to customer datacenter in 2Q26 but expects a muted revenue contribution from the business this year. Management targets a more significant ramp-up exiting this year and expects a majority of the TPU revenues from the existing agreements with customers to be in the next year. This implies stronger TPU-related revenue momentum for the supply chain vendors next year. •The strong capex plan bodes well for general servers, AI ASIC servers, and the GPU server food chain. Key potential beneficiaries include Hon Hai (2317 TT, covered by Gokul Hariharan), EMC (2383 TT, covered by Jerry Tsai), Unimicron (3037 TT, covered by Jerry Tsai), ASPEED (5274 TT), Delta (2308 TT) and Inventec (2356 TT). See page 3 for analyst certification and important disclosures, including non-US analyst disclosures.Servers Read-through from Google’s Jun-26 earnings 2Albert HungAC (886-2) 2725-9875 albert.hung@jpmchase.comAsia Pacific Equity Research 23 July 2026 J P M O R G A N J.P. Morgan views on the server industry •Google’s upbeat capex outlook, solid core businesses, and strong demand indicators are positive for both AI and non-AI server food chains. The accelerating Capex spending in 2H26 bodes well for the revenue momentum for Google’s server supply chain. •Continued supply constraints and increasing third-party capacity supports bode well for server brands and component vendors. •Our top pick in the Taiwan ODM supply chain is Wiwynn . We also like server component vendors such as Delta , ASPEED , Unimicron , EMC , and Lotes . Server brands such as Lenovo and ASUSTek could also benefit f 二） 🌟A股牛市周期中MACD背离回溯 基于2005年以来五大指数序列数据，日线背离属高频信号，2018-2022年间平均触发近5次，对8%以上调整胜率仅65%；周线背离每轮牛市出现1-3次，胜率高达90%，可作中期仓位管理参考。2019年4月四大指数同步日线背离，回调13%-20%；2021年2月创业板指日周线共振，最深回撤22%，为典型案例。 ❓判定标准与化解路径 顶背离核心为价格新高而DIF快线或柱状图峰值未同步上行，表明内生动能衰减，严格须以DIF下穿DEA确认。化解路径有二：价格下跌消化，DIF回落零轴下方触底；或强势拉升使DIF突破前高化解，如2026年1月国际金价。 📊每轮牛市平均出现1-3次周线背离 截至2026年7月，五类股指日线背离平均3-4次，周线层面除科创50外均已触发1次背离，上证综指结构与2021年存在相似性。推演来看，后续更可能呈宽幅震荡、向上弹性有限的结构性行情。强势行情中背离可能连续失效，不宜作单一决策依据，须综合量能、政策面与基本面判断。 🔍风险提示：指标主观及...", "publish_time": "2026-07-26 14:23", "tags": ["文字观点"]}, "attachment:files/东吴证券-策略周评：如何把握后续的科技硬件修复机会-260726.pdf": {"id": "attachment:files/东吴证券-策略周评：如何把握后续的科技硬件修复机会-260726.pdf", "kind": "attachment", "title": "东吴证券-策略周评：如何把握后续的科技硬件修复机会-260726", "source_label": "东吴证券", "excerpt": "CXO ：板块 Beta 稳中向好， 个股订单加速兑现", "content": "CXO ：板块 Beta 稳中向好， 个股订单加速兑现证券研究报告 ·行业动态报告 ·医药行业周报 发布日期：2026年7月26日 本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下，本报告亦可能由中信建投（国际）证券有限公司在香港提供。请务必阅读正文之后的免责条款和声明。分析师：袁清慧 yuanqinghui@csc.com.cn SAC编号：S1440520030001 SFC编号：BPW879分析师：王在存 wangzaicun@csc.com.cn SAC编号：S1440521070003分析师：刘若飞 liuruofei@csc.com.cn SAC编号：S1440519080003 SFC编号：BVX723分析师：沈毅 shenyibj@csc.com.cn SAC编号：S1440525080005 SFC编号：BXW250分析师：贺菊颖 hejuying@csc.com.cn SAC编号：S1440517050001 SFC编号：ASZ591分析师：汤然 tangran@csc.com.cn SAC编号：S1440524100001 下载日志已记录，仅供内部参考 核心观点 核心观点：国内CXO行业经历22-24年的调整阶段后，受益海外投融资率先回暖 ，24年国内头部CXO公司海外订单展现复苏态势 ，随着25年国内创新药资产 实现大规模对外授权 ，带动国内投融资25H2持续复苏，行业内需同样企稳回升 。26年至今国内创新药行业的长期结构性机会持续兑现 ，国内投融资持续改 善，新药物形式赛道持续火热并进一步放量 ，我们认为26年国内CRO/CDMO行业的新签订单及业绩会加速增长 ，带动CXO产业链进入新一轮发展阶段 。 行业迎来改善趋势 ，创新相关板块表现更为明显 。2025年，医药行业全板块营业收入同比下降 0.56%，相比25Q1-Q3降幅有所收窄；2026年Q1，医药行 业全板块营业收入同比增长 2.16%，整体看，医药行业收入在2026年一季度迎来改善趋势 。2025年，医药行业全板块扣非归母净利润同比下降 18.91%。 2026年Q1，医药行业全板块扣非归母净利润同比增长 2.69%，扣非归母净利润呈现改善趋势 。2026年Q1，生物制药上游、CRO/CMO、医疗服务、化学制 剂、家用器械、高值耗材板块呈现收入和扣非归母净利润的双重增长 ，其中CRO/CMO增长最为明显。 全球视角：创新价值凸显 ，中国力量加速渗透 。中国医药具有“创新升级+供应链韧性”优势，2025年创新药海外授权首付款大幅超去年全年 ，器械也在 积极探索出海路径 。美国主导早期研发与高端定价 ，但跨国药企专利悬崖下需求旺盛 ，中国资产全球性价比凸显 ，内外协同空间广阔 。 国内的价值重塑：聚焦高质量发展 ，筑牢创新与合规根 持续时长和环境复杂度较高的超长程Agent任务上Fable 5表现更好。Opus 5默认饱和式自测，使其在复杂任务综合成本或反超Fable 5。总结来说，Opus 5凭借其更全面的能力、更高的输出稳定性、更低的使用成本，正在成为更多用户的日常使用首选。 ❷开源模型在北美引发激烈讨论：Kimi K3 发布后闭源阵营估值焦虑显现，市场开始追问蒸馏是否会大幅缩短Frontier Lab的领先窗口，模型层的终局是垄断还是大宗商品化。Anthropic 以中国厂商\"工业级蒸馏\"为由游说封禁中国开源模型，但业内反驳的观点也直指要害：真要阻止蒸馏，限制访问或 KYC 实名即可，最应该出手的是Anthropic自己，安全叙事更...", "publish_time": "2026-07-26 18:53", "tags": ["大模型产业更新-0726", "文字观点"]}, "attachment:files/Nomura-中国机器人产业：2026上海WAIC纪要——本体量产化、大脑仍滞后、数据成硬约束.pdf": {"id": "attachment:files/Nomura-中国机器人产业：2026上海WAIC纪要——本体量产化、大脑仍滞后、数据成硬约束.pdf", "kind": "attachment", "title": "Nomura-中国机器人产业：2026上海WAIC纪要——本体量产化、大脑仍滞后、数据成硬约束", "source_label": "Nomura", "excerpt": "Asia Pacific Equity Research 23 July 2026 J P M O R G A N Technology - Hardware Albert Hung AC (886-2) 2725-9875 albert.hung@jpmchase.com J.P. Morgan Securities (Taiwan) Limited/ J", "content": "Asia Pacific Equity Research 23 July 2026 J P M O R G A N Technology - Hardware Albert Hung AC (886-2) 2725-9875 albert.hung@jpmchase.com J.P. Morgan Securities (Taiwan) Limited/ J.P. Morgan Securities (Asia Pacific) Limited/ J.P. Morgan Broking (Hong Kong) Limited Anthony Leng (886-2) 2725-9240 anthony.leng@jpmorgan.com J.P. Morgan Securities (Taiwan) Limited Gokul Hariharan (852) 2800-8564 gokul.hariharan@jpmorgan.com J.P. Morgan Securities (Asia Pacific) Limited/ J.P. Morgan Broking (Hong Kong) Limited Jerry Tsai (886-2) 2725-9867 jerry.tsai@jpmorgan.com J.P. Morgan Securities (Taiwan) LimitedAlphabet (OW, covered by J.P. Morgan US Internet Analyst Doug Anmuth) reported Jun-Q earnings before the Asia market open today. The key implications for the Asian tech supply chain are as follows: Google •Google’s Jun-Q Capex was US$45bn (+26% QoQ, +100% YoY), in line with market expectations. Server spending comprised 60% of the Capex while the remaining 40% of spending was for datacenter build-out and networking equipment. We believe CSPs have been increasing the server spending mix in total Capex given their recent Capex raise driven by the component cost hikes . •Google has raised its full-year 2026 Capex to US$195-205bn (~120% YoY growth at the midpoint) from US$180-190bn, driven by strong customer demand and an acceleration in capacity delivery. This is the second round of Capex increase in a row and implies ~50% HoH Capex growth in 2H26. Looking into next year, Google expects a significant Capex uptick despite the high base this year due to undersupplied computing power. •Google continues to see supply constraints and expects an increase in usage of third-party capacity in 3Q26 to support the strong demand. Of note, Google Gemini’s DAU has tripled YoY and the token consumption rate increased 38% QoQ in 2Q26. This bodes well for the pricing dynamics of NeoCloud vendors as well as server brands, in our view. •Google’s cloud revenue was up 24%/82% QoQ/YoY in Jun-Q with continued margin improvement to 35.6% vs. 32.9%/20.7% in 1Q26/2Q25. Cloud revenue accelerated significantly from 63% YoY growth last quarter and was 10% better than Street estimates, driven by strength across core GCP, AI solutions, and AI infrastructure. AI cloud revenue significantly outgrew core product revenue due to strong demand for enterprise AI products. •Google Cloud’s backlog increased by US$50bn+ QoQ to US$514bn in 2Q26, driven by strong demand for Google’s Enterprise AI products. The majority of the order backlog is related to traditional GCP contracts. Management expects to recognize 50% of the total backlog as revenue over the next 2 years, which implies a quarterly run rate of Google Cloud revenue to reach US$30bn+ from the current level of ~US$25bn. •Google started delivering TPU systems to customer datacenter in 2Q26 but expects a muted revenue contribution from the business this year. Management targets a more significant ramp-up exiting this year and expects a majority of the TPU revenues from the existing agreements with customers to be in the next year. This implies stronger TPU-related revenue momentum for the supply chain vendors next year. •The strong capex plan bodes well for general servers, AI ASIC servers, and the GPU server food chain. Key potential beneficiaries include Hon Hai (2317 TT, covered by Gokul Hariharan), EMC (2383 TT, covered by Jerry Tsai), Unimicron (3037 TT, covered by Jerry Tsai), ASPEED (5274 TT), Delta (2308 TT) and Inventec (2356 TT). See page 3 for analyst certification and important disclosures, including non-US analyst disclosures.Servers Read-through from Google’s Jun-26 earnings 2Albert HungAC (886-2) 2725-9875 albert.hung@jpmchase.comAsia Pacific Equity Research 23 July 2026 J P M O R G A N J.P. Morgan views on the server industry •Google’s upbeat capex outlook, solid core businesses, and strong demand indicators are positive for both AI and non-AI server food chains. The accelerating Capex spending in 2H26 bodes well for the revenue momentum for Google’s server supply chain. •Continued supply constraints and increasing third-party capacity supports bode well for server brands and component vendors. •Our top pick in the Taiwan ODM supply chain is Wiwynn . We also like server component vendors such as Delta , ASPEED , Unimicron , EMC , and Lotes . Server brands such as Lenovo and ASUSTek could also benefit from the strong Neocloud demand with favorable pricing dynamics. Figure 1: Google’s reported capex and qoq trend -35%32% 10% -10%-1% -10%0%1%8% -8%24% -6%53% -30%7%4% -17%10%17%37% 9%10% -1%9%20%31% 7%16%28%26% -40%-30%-20%-10%0%10%20%30%40%50%60% - 5,000 10,000 15,000 20,000 25,000 30,000 35,000 40,000 45,000 50,000 1Q19 3Q19 1Q20 3Q20 1Q21 3Q21 1Q22 3Q22 1Q23 3Q23 1Q24 3Q24 1Q25 3Q25 1Q26 Google capex (US$mn) qoq Source: Company data.Figure 2: Google’s reported capex and yoy trend -36%12%27% -15%29% -12%-20%-9%-1%2%26%16%65% 24% 7%19% -36%1%11%45%91%91% 62% 30%43%70%83%95%107%100% -60%-40%-20%0%20%40%60%80%100%120% - 5,000 10,000 15,000 20,000 25,000 30,000 35,000 40,000 45,000 50,000 1Q19 3Q19 1Q20 3Q20 1Q21 3Q21 1Q22 3Q22 1Q23 3Q2  "2026-07-26 18:55", "source_label": "帖子正文", "excerpt": "【广发机械】周度总结更新-mSAP扩产+长鑫上市，继续看好半导体设备、PCB设备、船舶-20260726 本周（7.20-7.24）油服海工（+10%）、AIDC发电（+8%）和半导体设备涨幅靠前（+7%）；核电设备（-7%）、液冷（-6%）和3C设备（-5%）跌幅靠前。", "content": "【广发机械】周度总结更新-mSAP扩产+长鑫上市，继续看好半导体设备、PCB设备、船舶-20260726 本周（7.20-7.24）油服海工（+10%）、AIDC发电（+8%）和半导体设备涨幅靠前（+7%）；核电设备（-7%）、液冷（-6%）和3C设备（-5%）跌幅靠前。 1.#半导体设备。台积电Q2继续上调全年CAPEX预期至600-640亿美金，预计近期涨价10%；Kimi算力紧缺并暂停C端新用户订阅，国产算力也到了放量的临界点。长鑫募资579亿，下周即将上市。 两存的优异业绩会拉长扩产的持续性，未来5年存在3倍扩产空间；逻辑方面受益于华为tao定律及国产算力放量。我们依然强烈看好下半年半导体设备行情，推荐长川、强一、精智达、华峰、精测、迈为等。#腾讯会议：662-316-532长鑫IPO，继续看好封测设备 2.#PCB设备。鹏鼎、红板宣布mSAP扩产项目，分别投资100亿、50亿元，建设周期4-5年。本轮PCB的特点是#AI驱动Capex密度质变，制程进步推动全链条半导体化，带来#价值膨胀+格局优化+估值提升，核心推荐芯碁、大族、鼎泰、中钨、三孚新科、东威等。 #腾讯会议：...", "publish_time": "2026-07-26 18:55", "tags": ["腾讯会议", "662-316-532", "文字观点"]}, "attachment:files/CCL行业专家纪要20260724.pdf": {"id": "attachment:files/CCL行业专家纪要20260724.pdf", "kind": "attachment", "title": "CCL行业专家纪要20260724", "source_label": "其他", "excerpt": "4FRHUIn3oUcUeU8OcM6MpNqQsQpRjMnNsNeRsQmR7NmNmNvPmMmRMYmMmR", "content": "4FRHUIn3oUcUeU8OcM6MpNqQsQpRjMnNsNeRsQmR7NmNmNvPmMmRMYmMmR", "status": "extracted"}, "attachment:files/GS-三星电机（009150.KS）：再获AI服务器MLCC大额订单；维持“买入”.pdf": {"id": "attachment:files/GS-三星电机（009150.KS）：再获AI服务器MLCC大额订单；维持“买入”.pdf", "kind": "attachment", "title": "GS-三星电机（009150.KS）：再获AI服务器MLCC大额订单；维持“买入”", "source_label": "GS", "excerpt": "Giuni Lee +82(2)3788-1177 | giuni.lee@gs.com Goldman Sachs (Asia) L.L.C., Seoul Branch Taeyong Lee +82(2)3788-0981 | taeyong.lee@gs.com Goldman Sachs (Asia) L.L.C., Seoul Branch Da", "content": "Giuni Lee +82(2)3788-1177 | giuni.lee@gs.com Goldman Sachs (Asia) L.L.C., Seoul Branch Taeyong Lee +82(2)3788-0981 | taeyong.lee@gs.com Goldman Sachs (Asia) L.L.C., Seoul Branch Daiki Takayama +81(3)4587-9870 | daiki.takayama@gs.com Goldman Sachs Japan Co., Ltd.Samsung Electro-Mechanics (009150.KS): Announces another large-scale MLCC order, likely for AI servers; Buy23 July 2026 | 6:08PM KST On July 23, Samsung Electro-Mechanics (SEMCO) announced through a public disclosure ( link) that it has signed a W295bn MLCC contract with a “global large customer”. Of note, it has been less than a month since SEMCO publicly announced a large-scale MLCC order value of W454bn ( link) on June 30. The value of these two contracts combined represents 16% of SEMCO’s MLCC revenue last year and 12% of MLCC revenue we expect for this year, which is quite sizable in our view considering SEMCO’s largest customers typically comprise ~10% of the company’s MLCC revenue. We believe both contracts are related to AI server MLCC where demand is growing sharply due to strong growth of AI server shipment and AI server specs upgrades. We expect SEMCO AI server MLCC revenue to grow 6.4x from 2025 to 2028 and reach 28% of MLCC revenue by 2028. Given both contracts have a contract period running from January 1, 2027 to December 31, 2027, we view the early procurement of 2027 MLCC volume as a positive signal of tight MLCC supply condition. This is consistent with our expectation of SEMCO’s MLCC UTR remaining at a 90+% level throughout our forecasting period due to solid demand for AI server and auto MLCC, which should also act as a tailwind for pricing. Price Target Risks and Methodology - Samsung Electro-Mechanics Valuation: We are Buy rated on Samsung Electro-Mechanics with a SOTP-based (2027E-2028E EV/EBITDA driven) 12-month TP of W2,600,000. Key downside risks: A stronger-than-expected industry MLCC supply increase and weaker-than-expected demand for AI server/auto/smartphones. Investment Thesis - Samsung Electro-Mechanics Samsung Electro-Mechanics (SEMCO) is a leading global electronic component supplier with the second-largest market share in multi-layer ceramic capacitor (MLCC). We expect the 1) solid MLCC demand from AI server and auto and 2) strong FC-BGA growth driven by AI customer expansion will lead to solid OP yoy growth and are Buy rated on the name. Goldman Sachs does and seeks to do business with companies c c Wilson +1(212)902-5924 | dominic.wilson@gs.com Goldman Sachs & Co. LLC Vickie Chang +1(212)902-6915 | vickie.chang@gs.com Goldman Sachs & Co. LLCGlobal Markets Comment: Distinguishing AI Risks—Size of the Pie vs. Share of the Pie 23 July 2026 | 10:40AM EDT We showed recently that as the value built into AI-related equities has grown, n more optimistic assumptions about the ultimate economic gains for US companies from AI are needed to justify it. This likely makes the market more vulnerable to challenges to the more optimistic story. Although robust earnings may dominate valuation concerns for now, we think investors should focus on the potential challenges to the theme and their consequences for portfolios. In weighing those risks, a key distinction is whether a shock or risk shifts views on n the likely aggregate value of AI-related innovation or on the distribution of that value (or both). Put simply, some worries are about the size of the pie and some are about how the pie is shared. We illustrate that this distinction is critical to understanding the impact of di fferent challenges to the AI theme on markets and volatility. Only aggregate shocks are likely to have reliable, broad cross-asset impacts. For n those with broad exposure to US equities, these are the shocks that matter most and macro hedges are likely to be available to protect against them. For those with more speci fic AI-related exposures, hedging is more challenging, since distributional shocks may also a ffect portfolios but have less reliable impacts on macro assets. For aggregate shocks to AI exposures, equity indices and rates so far appear to n show clearer responses than FX and commodities. Except when higher rates are themselves the source of the risk, worries about the aggregate gains from AI are likely to push US yields lower. Aggregate shocks also have more scope to push equity index volatility higher than distributional shocks. Distinguishing AI Risks—Size of the Pie vs. Share of the Pie Pressure on semiconductor stocks over the last month has revived questions about the potential risks to AI-related equities and ways to hedge against those risks. A month ago, we looked again at what a macro approach to valuing the gains from AI says about the value that the market has assigned to AI relative to what the economy can deliver. That exercise showed that the value that had been built into AI-related equities has continued to grow and that more optimistic assumptions about the Present Discounted Value (PDV) of economic gains from AI that will accrue to companies were now needed to justify it. We also highlighted how the market has disproportionately rewarded the companies supplying the AI investment boom over Investors should consider this report as only a single factor in making their investment decision. For Reg AC certification and other important disclosures, see the Disclosure Appendix, or go to www.gs.com/research/hedge.html . Economics Research the last 6-9 months. So alongside the risks to the market view of the aggregate gains from AI, there might also be risks to the market’s view of the distribution of winners and losers. This set-up has, in our view, left the market vulnerable to any challenges to the more optimistic story. Robust earnings may dominate valuation concerns with the investment boom likely to continue to extend, but we still think investors should focus on the potential challenges to the theme and their consequences for portfolios. Our general view is that precision about the nature of any potential “shock” is key to understanding its cross-asset impact. The challenge is that there are a bewildering number of di fferent possible narratives that could create risk to the current AI story. Although each may have its own speci fic characteristics, we think it useful to try to think of ways to organize and simplify these di fferent kinds of worries. Aggregate value or its distribution In weighing those risks, we think a key distinction is whether a shock/risk shifts views on the likely aggregate value of AI-related innovation or on the distribution of that value (or both). Put simply, some worries are about the size of the pie, and some are about how the pie is shared. We have already shown that this distinction is critical to understanding recent trends in equity volatility , but it is also critical to the cross-asset footprint. This distinction is embedded in the macro approach we have taken to looking at the value that we expect from AI. Our global economics team has calculated the Present Discounted Value of the additional GDP from the productivity gains that they expect from AI under our baseline assumptions. This de fines the expected aggregate value of AI gains measured from today. To derive the value that should accrue to equity holders, we then need expectations of how that value is distributed . As Exhibit 1 shows, some portion of that should accrue to US companies in the form of higher pro fits. Those higher pro fits in turn will ultimately be shared among di fferent types of companies: hyperscalers; infrastructure providers, like semiconductor, memory and power producers; model builders and other AI companies; and non-AI companies.1 Some portion of those gains will also accrue to US consumers and workers and the same potential corporate and consumer bene ficiaries are represented on the non-US side too. 1 These “gains” could be negative for some segments if, for instance, AI-focused companies reduced pro fits for non-AI companies. 23 July 2026 2Goldman Sachs Global Markets Comment 9WrUkVNAoYtMsNpQ8OcM8OpNrRpNrPiNnNoRiNtRqM7NmNnRwMmQnRuOnOpM So far, most of the AI-related value has accrued to US AI-focused companies and some key non-US companies, especially in Asia. The focus of our work so far has largely been on comparing estimates of the economic gains for US companies and the distribution of those gains across the major categories of US companies Exhibit 2 . From that narrower perspective, anything that distributes value away from US companies—away from the the top-left segment of Exhibit 1 —including an increased share or AI gains going to consumers or non-US producers, is a shock to the “aggregate” value for the US equity market, even if the overall value of AI to the global economy does not change. We stick here to this narrower distinction between dynamics that a ffect the “aggregate” value of AI gains for the US corporate sector and those that a ffect its distribution across US companies. But it is easy to expand that view of what “aggregate” means through the lens of the framework that we set out here. Exhibit 1: AI economic gains will ultimately be split across a wide range of groups Source: Goldman Sachs Global Investment Research 23 July 2026 3Goldman Sachs Global Markets Comment Different drivers of aggregate and distributional shocks The forces driving market views of the aggregate value of AI and its distribution are generally di fferent. Perceptions of the aggregate value from AI are most likely to be affected by things that shift one or more of the five key parameters that underpin our global team’s estimates of the value of future AI revenues to US companies ( Exhibit 3 ): Productivity growth : the overall value of the innovation in improving work 1. practices. Adoption rate : how quickly those productivity gains are being realized. 2. Capital share : how much of those gains accrue to companies, which depends in turn 3. on the ability to monetize the innovations. International share : how much can US companies capture a share of non-US gains 4. or vice versa. Discount rate: the cost of capital for AI-related companies given financing needs 5. and the uncertainty around potential revenues. Exhibit 2: Our dominant focus has been on comparing value built into US companies and the potential capital revenues from AI 31 28 26 23 18 16 14 9 05101520253035 05101520253035 S&P 500 GS Estimate - US Combined Positive*GS TMT AI Basket shock that has helped producers and hurt consumers of chips. But beyond this dynamic, the market has also implicitly made judgments about the split between AI-related companies and the ultimate corporate users of AI products (assigning the bulk of AI-related value to the former) and about the capacity of AI disruption to shift pro fits away from incumbent firms in non-AI related industries (software, insurance, real estate). Shifts in views on issues that a ffect those divisions may not change expectations of aggregate pro fitability but will change how it is allocated. Classifying AI concerns We think using this framework to specify how a particular risk reduces or distributes value is a helpful exercise. Classifying di fferent concerns along this axis can still be challenging (and open to challenge!). Some shocks are more obviously aggregate shocks; some are more obviously distributional; and for some it is less clear: Worries that focus on slower adoption or concern about the scope of use cases are n likely to be aggregate shocks. They would lower estimates of some key parameters Exhibit 3: Views on the value of AI will shift if investors adjust their views on the key parameters 922 5 514 71413 8916 051015202530 051015202530 Low (10%)High (20%)Low (6%)High (19.2%)Low (28%)High (60%)Faster Slower 0% Share 50% Share GS Base- line Discount Rate Productivity Capital Share Adoption Rate Share of Non-US RevenuesPresent Discounted Value of AI Revenues to US Companies, Varying Assumptions$tn $tn Source: Goldman Sachs Global Investment Research 23 July 2026 5Goldman Sachs Global Markets Comment that drive aggregate value (lower productivity growth, lower adoption rates). Difficulties in monetizing AI-related products or competition in models or n applications that lower the cost of the innovation (as opposed to pessimism about the innovation itself) could function as a shock to the aggregate value that will accrue to US companies by distributing the gains more to consumers (lower capital share). But US corporate consumers could also bene fit, and lower-cost products could accelerate adoption, which could shift the potential distribution of value towards them and mitigate the aggregate impact. Innovations by non-US companies could also distribute value away from US companies even if the broad value of AI-related innovations remains high. Reduced willingness from the market to finance the AI investment boom would also n look more like an aggregate shock. But a decision to slow capital spending because infrastructure looks su fficient could have more of a distributional flavor, reallocating value to hyperscalers from suppliers of the investment boom. Capacity expansion or competition in the semis/memory space or model innovation n to rely on fewer or cheaper chips could hurt semiconductor producers, but by alleviating shortages would bene fit corporate consumers, so would potentially be a distributional impact. To the extent that those gains are passed through to final consumers too (instead of accruing to companies), it could also have some aggregate impact. Displacement or disruption of incumbent companies through fear of AI are obviously n distributional at some level but could also have aggregate implications for US public market pro fits if they result in increased gains to consumers or if the corporate winners are outside the US public markets. Macro shocks—tighter monetary policy, a renewed rise in oil prices or a weakening in n the labor market (AI-related or otherwise)—would function more like aggregate shocks, a ffecting value in the overall space. Given the value that has been built into AI-related companies, heavy positioning in many of these areas, and the financing needs of the AI boom, macro shocks could disproportionately a ffect AI bene ficiaries vs. the rest of the broader market. But the nature of the macro shock likely matters here too, given that some shocks (higher oil prices, for instance) may a ffect other marke
