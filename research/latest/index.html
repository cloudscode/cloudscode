"]}, "attachment:files/AI材料20260723.pdf": {"id": "attachment:files/AI材料20260723.pdf", "kind": "attachment", "title": "AI材料20260723", "source_label": "其他", "excerpt": "AI材料20260723 参会人：无参会人信息 1、半导体材料行业发展底层逻辑 ·AI上游材料研究框架：按下游应用划分梳理上游材料研究框架， 下游景气度会带动上游材料及相关设备的需求，二者联动逻辑清 晰。大摩曾拆解英伟达新旧两代服务器的物料成本对比，其中英 伟达新一代服务器中存储、PCB、MUCC的成本较上一代显著提升， 验证下游AI硬件迭代对上游材料需求的", "content": "AI材料20260723 参会人：无参会人信息 1、半导体材料行业发展底层逻辑 ·AI上游材料研究框架：按下游应用划分梳理上游材料研究框架， 下游景气度会带动上游材料及相关设备的需求，二者联动逻辑清 晰。大摩曾拆解英伟达新旧两代服务器的物料成本对比，其中英 伟达新一代服务器中存储、PCB、MUCC的成本较上一代显著提升， 验证下游AI硬件迭代对上游材料需求的拉动作用，后续将按下游 板块划分逐一梳理上游相关材料的具体情况。 ·电子化学品产业转移规律：电子化学品遵循产业转移法则，低 端产业优先转移，配套材料同步跟随，技术难度低的材料优先实 现国产化：无高频高速需求的PCB产业成熟度高，相关化学品国 产化率高、估值较低；半导体领域国产化关注度高、估值较高； 面板领域则介于二者之间。半导体产业发展历程来看，半导体产 业先后经历美国主导、日本70-80年代崛起、韩台后续承接三个 阶段，日本材料企业因早期技术积累、上下游联动模式形成高壁 垒，长期占据全球主导地位。不同区域发展模式差异明显：韩国 采用IDM一体化模式，受2018年日本光刻胶断供推动材料国产化， 当前已占据一定市场份额；中国台湾因代工模式未重点发展材料 产业，材料在制造成本中占比不足5%但对产品性能影响关键，因 此优先使用成熟设备材料保障代工产品合格，不愿承担试错风险。 ·国内材料发展机遇与路径：2018年后半导体产业从全球化转向 区域化、本土化，自主可控、国产替代趋势加速，为国内半导体 材料行业带来极佳发展窗口期。国内半导体材料企业的成长路径 主要分为两类：一类是横向拓展多个品类，走平台化发展路线打 开成长空间；另一类是从国产替代走向全球化供应，切入日韩、 中国台湾等半导体聚集地市场。半导体材料企业可通过平台化或 全球化打开成长空间，当前平台化路径落地难度更低，多数企业 通过内生或并购布局多品类。 ·半导体材料品类划分标准：半导体材料可按与技术节点的相关 性划分为两大类：一类是通用型产品，包括硅片、高纯试剂、高 纯气体等，与技术节点无关，壁垒较低，以成本竞争为主，仅需 满足纯度、杂质含量要求即可使用，无体系变化，客户粘性较弱， 最终竞争核心为成本优势与客户资源。另一类是制程类产品，包 括光刻胶、抛光液等，与技术节点强相关，多为定制化，壁垒高、 客户粘性强，除纯度要求外多为配方型定制产品，需跟随客户技 术迭代共同升级，护城河更深厚。 2、半导体前道制造材料细分分析 ·硅片赛道分析：硅片具备重资产、标准品属性，商业模式与早 年面板行业类似。其核心竞争壁垒集中在客户端，硅片质量直接 影响芯片良率，客户认证门槛极高，切换意愿较低。当前国内硅 片企业毛利率偏低，核心原因包括阶段性产能过剩、价格竞争压 力大、设备折旧负担重，同时十二寸大硅片等高端品类仍待进一 步突破。国内硅片赛道第一梯队划分清晰，轻掺第一梯队包括沪 硅产业、奕斯伟，重掺第一梯队包括立昂微、中环股份，行业整 体处于加速发展阶段，后续需下游替换意愿提升才能迎来更好发 展。 ·薄膜沉积材料分析：薄膜沉积共有三类技术，分别为PVD物理 气相沉积、CVD化学气相沉积、ALD原子层沉积，不同技术配套材 料不同：PVD配套材料为金属类靶材，CVD、ALD配套材料为前驱 体。当前国内靶材、前驱体赛道竞争格局清晰，核心企业已实现 较好市场突破：雅克科技通过早期收购韩国企业，配合国内产业 发展占据国内前驱体市场主导地位，与海力士、三星的合作已深 入新一代产品开发，逐步实现海外替代；江丰电子在国内靶材领 域具备显著市场优势，同样实现海外市场突破，两类赛道企业均 将受益于后续行业扩产。 ·光刻环节材料分析：光刻环节配套材料品类较多，覆盖光刻胶、 掩膜版、显影液、剥离液、刻蚀液等。 光刻胶是该环节技术难度最高的产品，属于定制化品种，由树脂、 感光剂、添加剂、溶剂组成，不同芯片、同芯片不同厂商工艺均 存在差异，导致产品型号数量极多。该赛道需要高强度研发投入， 积累足够多型号才能形成规模效应，早期阶段难以实现盈利，投 资逻辑以产品突破和导入带来的估值提升为主。当前全球光刻胶 市场被日本JSR、TOK、住友、信越垄断，国内正处于国产化配套 阶段，晶圆厂与相关企业合作优先铺开品类覆盖，国内领先企业 包括彤程新材、鼎龙股份、上海新阳、恒坤新材，未上市企业中 华为旗下珠海基石也处于领先地位。 掩膜版商业模式随制程差异分化：28纳米以下先进制程以晶圆厂 自供为主，28纳米以上成熟制程以第三方供应为主。当前全球掩 膜版市场被日本HOYA、TOPPAN垄断，国内国产化率较低，多数企 业出货集中在面板、功率器件领域，国内领先企业技术突破进展 清晰：清溢光电已实现180纳米节点量产，正推进65-130纳米节 点技术研发；路维光电已实现180纳米节点量产，募投项目瞄准 28-130纳米制程；龙图光照130纳米成熟制程产品为国内龙头， 珠海厂已规划28-65纳米产能，国产化正逐步推进。 ·湿化学品与特气分析：湿化学品、电子特气两个赛道具备共性 特征：品类繁多、市场整体零散，中低端产品已进入同质化竞争 阶段，高端产品仍待国产化突破，不同细分品种需单独分析。其 中湿化学品分为高纯类试剂和功能性配方试剂，国内领先企业包 括上海新阳、新福电子；电子特气品类超过200种，仅三氟化氮、 六氟化钨属于大品类，其余单个品种市场规模较小，国内领先企 业包括以大品种起家的中船特气、以小品种起家的华特气体，二 者发展战略不同，均在行业内处于领先地位。 ·电子大宗气赛道分析：电子大宗气主要包括氮气、氧气等大品 类，供气模式特殊，需在晶圆厂内部建设提纯、供气装置，实现 24小时现场制气，业务属性同时连接设备与耗材：前期跟随下游 晶圆厂招标推进，项目落地后进入耗材供应逻辑。该赛道进入壁 垒极高，现场供气一旦出现问题将导致整座晶圆厂停摆，且供应 商更换周期长，无十二寸产线运营经验的企业很难进入招标环节。 十万片产能的晶圆厂每小时氮气用量可达8-10万方，过去行业被 林德、法液空、空气化工等海外企业垄断，国内广钢气体继承原 林德合资公司的宝贵资产，在自主可控背景下已拿到长存、长鑫、 华虹等核心项目，将受益于新一轮晶圆厂扩产周期。 ·抛光材料赛道分析：抛光环节核心配套材料为抛光垫和抛光液， 两个赛道的国内竞争格局清晰，均已跑出核心龙头企业：鼎龙股 份在抛光垫领域、安集科技在抛光液领域均占据国内市场主导地 位，是国内核心晶圆厂的绝对主供。两个赛道壁垒较高，行业格 局稳定，相关企业具备较强的扩产受益属性，将随下游晶圆厂产 能扩张实现业绩增长。 3、半导体前道材料投资逻辑 ·行业投资主线梳理：半导体行业行情演绎路径清晰，2025年下 半年存储芯片开始涨价，进入2026年后市场交易逻辑逐步从芯片 涨价转向扩产主线，其中国内长存、长鑫的扩产确定性最高。直 接受益标的核心筛选标准为竞争格局稳定、下游市场份额较高， 典型代表如鼎龙股份的抛光垫、雅克科技的前驱体等，整个赛道 具备同涨同跌特征，行情表现主要取决于下游行业景气度。同时 可结合催化因素筛选具备高超额收益的个股，催化因素分为两类： a.行业层面催化包括晶圆厂上市节点，如二季度五六月份市场交 易长鑫上市逻辑，对应长鑫供应敞口较大的公司受益弹性更高； 后续市场将转向交易长存上市逻辑，长存核心供应商将迎来催化。 b.个股层面催化包括产品涨价、新产品突破、新客户拓展，尤其 是国产材料企业若成功打入海力士、三星等海外供应链，将构成 极强业务催化。 ·核心标的雅克科技推荐：雅克科技为当前最核心推荐标的，核 心竞争优势突出：一是业务平台化布局、出海进展均处于国内绝 对领先地位；二是核心客户卡位优势显著，为长鑫最核心材料供 应商，前驱体产品在长鑫的份额达七八成，是长鑫第一大材料供 应商。同时公司近期业务边际变化积极，进一步验证投资逻辑： 2026年7月1日起，公司前驱体产品对海力士的供应价格平均上 涨20%，其余客户的涨价事宜正在洽谈中；硅微粉品类原本主要 应用于环氧塑封料填料领域，目前已成功打入斗山高频高速覆铜 板供应链，多品类产品均取得积极进展，短期催化确定性高。 4、半导体封测材料投资分析 ·封测材料行业发展逻辑：封测材料品类更加细分，单个产品市 场规模较前道更小，国内此前以传统封装为主，传统封装材料在 下游成本占比偏低，且海外在该领域无相关限制，叠加封测厂材 料使用存在客户指定性，导致传统封装材料国产化率偏低。当前 随着先进封装快速发展，半导体工艺技术竞争逐步向封装环节倾 斜，先进封装产业链自主可控需求迫切，倒逼封测材料进入国产 替代加速阶段。当前封测材料行业的发展阶段类似2021年前道制 造材料的节点，即相关材料刚完成0到1的突破，即将进入1到 100的放量阶段，且技术迭代频繁持续催化估值，未来2-3年行 业将进入业绩与估值共振阶段，具备较好的投资机会。 ·封测材料标的筛选逻辑：封测材料行业具备强者恒强、赢者通 吃的特性，下游客户为保障良率及产品稳定性，通常仅配置1-2 家供应商，其中一供份额占比至少六七成，一般不需要三供，因 此企业的技术卡位与客户卡位的先发优势至关重要，有先发优势 的企业可优先享受技术红利。投资这类标的时，优先关注业绩增 速而非短期业绩绝对体量，核心交易逻辑是企业未来卡位的确定 性，只要增速达标就不算业绩不及预期。 ·核心标的艾森股份推荐：优中选优重点推荐艾森股份，其核心 投资价值体现在：a.技术卡位优势突出：是国内封装光刻胶领域 的领先企业，产品已进入各大封测厂放量阶段，目前国产厂商中 基本仅其一家布局该品类，同时是长鑫HBM封装光刻胶的核心供 应商，带有显著的长鑫HBM核心标签；电镀液业务是国内两大龙 头之一，与上海新阳并列第一梯队。b.拓展空间存在预期差：半 导体电镀产品技术可下沉应用于IC载板、PCB板电镀产品，跨领 域核心壁垒为客户壁垒，而鹏鼎为公司股东之一，具备天然客户 资源优势，可顺利实现产品拓展，市场空间进一步打开，存在市 场尚未充分认知的预期差。 5、半导体材料涨价逻辑分析 ·涨价一般逻辑与特殊情况：半导体材料涨价的常规逻辑为技术 迭代带来产品价值量提升，而非单纯的产品价格上涨，过往涨价 逻辑相对较弱，更多遵循量的增长逻辑，技术迭代过程中同时具 备通胀属性。2026年中船六氟化钨涨价属于特殊情况，核心驱动 为上游原材料出口限制导致成本端上升，海外企业面临原材料供 应不足、停产风险，全球供需格局收紧，市场对其价格预期较为 乐观。 ·涨价品种投资观点：当前市场对涨价品种的热情较上一轮更弱， 此前市场对价格预期打满，股价存在一定透支，调整后需要看到 更明确的确定性信号才会催生行情。后续核心观测指标包括两点： a.六氟化钨对日本零出口，需观测日本企业是否出现确定性停产； b.海关发布的六氟化钨出口数据及价格。六氟化钨5月价格为140 多万元/吨，6月涨至150多万元/吨，涨价幅度收窄。后续需确 认价格能否进一步大幅提升，才会带动更强的一波行情，短期内 对涨价品种持更加谨慎的态度。 6、PCB相关材料投资分析 ·PCB材料整体需求逻辑：AI服务器发展带动PCB行业需求提升， 层数增加拉动材料用量上涨，性能升级带动材料体系持续迭代。 当前化工领域重点覆盖PCB材料中的树脂、硅微粉两类，电子布 归属建材组覆盖，后续将重点介绍该板块。 ·电子布赛道投资逻辑：电子布是当前PCB材料中逻辑最硬的赛 道，核心支撑来自两方面：一是产能端存强约束，织布机整体产 能限制较大，行业扩产难度高；二是特种布持续挤占普通布产能， 带动普通布、特种布全品类进入持续提价周期，目前暂无产能端 松绑迹象。 ·树脂赛道迭代与投资逻辑：PCB树脂体系随AI服务器升级持续 迭代，整体路径从低阶到高阶依次为PPO→OPE→碳氢→ODD→BCB， 不同技术阶段核心受益标的存在差异：a.2023-2024年AI服务器 加速上量，所用树脂以聚苯醚（PPO）体系为主，圣泉在该产品领 域处于绝对领先地位，是当时高频高速树脂的核心关注标的，东 材彼时主打BMI、活性酯等马六及以下等级产品；b.服务器向马 七、马八、马九迭代过程中，东材在碳氢类树脂领域率先突破， 且依托此前作为台光BMI类树脂长期供应商、份额较高的合作基 础，ODP产品快速在台光实现放量，行业投资焦点从PPO转向碳 氢的过程中，市场关注重点从圣泉转向东材；c.2025年年中市场 交易马九代服务器行情时，东材是国内唯一布局BCB树脂的企业， 股价表现显著领先圣泉。当前板块经历较大回调后对应明年估值 均处于低位，后续核心观测点包括两方面：一是马九代服务器放 量下东材相关树脂的上量进度；二是马九向马十代迭代的技术路 线选择，若延续碳氢类树脂方向，东材仍将保持领先，若采用PTFE 方案，东岳、昊华等企业将成为本轮技术迭代的核心关注标的。 ·硅微粉分析与投资观点：硅微粉作为 PCB 填料，需求确定性高， 不受树脂体系变化影响，添加比例与整体价值量持续提升，但行 业持续增多，竞争格局弱于树脂环节。 投资优先级方面，板块反 弹阶段优先关注价值量更高的树脂环节，硅微粉赛道核心标的联 瑞等当前性价比并未显著高于树脂赛道标的；反弹结束进入新阶 段后，需重点跟踪树脂体系技术路线变化判断后续投资机会。本 次交流重点覆盖半导体、PCB 方向材料，其余零散领域未做详细 讨论。", "status": "extracted"}, "attachment:files/Kimi K3投研能力实测20260723.pdf": {"id": "attachment:files/Kimi K3投研能力实测20260723.pdf", "kind": "attachment", "title": "Kimi K3投研能力实测20260723", "source_label": "其他", "excerpt": "KimiK3投研能力实测20260723 参会人：无参会人信息 1、K3基础参数与技术特性 ·分享背景与内容规划：近期K3市场热度发酵剧烈，当前存在算 力储备不足、一票难求的现状，想要使用K3的用户极多，但能够 实现规模化应用的用户偏少。本次分享围绕两大核心方向展开： 一是K3能力与投研场景的结合路径，二是商景科技团队针对K3 的能力测评结果。", "content": "KimiK3投研能力实测20260723 参会人：无参会人信息 1、K3基础参数与技术特性 ·分享背景与内容规划：近期K3市场热度发酵剧烈，当前存在算 力储备不足、一票难求的现状，想要使用K3的用户极多，但能够 实现规模化应用的用户偏少。本次分享围绕两大核心方向展开： 一是K3能力与投研场景的结合路径，二是商景科技团队针对K3 的能力测评结果。 ·核心参数与开源计划：K3是当前全球参数规模最大的开源模型， 核心参数如下：总参数量2.8万亿，采用MOE混合专家架构，共 有896个专家，推理阶段同时激活16个专家，上下文窗口达百万 级（100万token），原生支持视觉理解多模态能力。按照计划， K3将在7月27日之前全面开源，行业可重点关注其开放后的应 用落地机会。 ·技术创新与通用表现：K3相对上代K2模型有三大核心技术创 新，支撑其扩展效率大幅提升：a.采用自研KD-A混合线性助力 机制，保障信息在更长序列、更深模型内顺畅流动；b.搭配残差 注意力机制，与KD-A共同构建K3核心骨架；c.应用Stable LatentMOE框架，扩大MOE稀疏度，可在896个专家中高效激活 对应16个专家。在各类通用测评benchmark中，K3的前端编码 能力已超过Fibo五、GPT5.6so两款全球最强闭源模型，稳定领 先其他同类模型，相关表现对华尔街造成较大冲击，中美两地近 期相关报道较多。 2、IRB投研测评体系与整体结论 ·测评场景定位与定性结论：本次测评聚焦投研专业场景，投研 场景下用户真实问题深度远高于公开市场日常C端对话问题，对 大模型专业能力要求更高。测评定性结论显示，K3在时效性判断、 证据边界控制、前提纠错等投研核心维度表现突出，多项得分超 过GPT-4.5、Open4.8，整体推理能力进入第一梯队。从IRB测评 集综合评分结果来看，K3综合表现仅次于Fiber-5，比GPT5.5 更胜一筹，8个重要测评维度得分表现优异。 ·测评集构建逻辑与规模：本次测评依托的IRB测评集全称为 InvestmentResearchBenchmark（投资研究测评集），是商景科 技自建的投研场景专属专业测评工具。该测评集来源为Alpha Engine平台用户提交的问题，运营团队针对用户反馈回答效果不 佳的问题，与客户一对一沟通并获授权后整理形成错题集，目前 累计已达近万道投研易错题、难题规模，覆盖去年、今年的投研 难点问题，对投研能力测评具备标杆性参考意义。 ·评分规则与权威性：IRB测评覆盖18个投研领域，从相关性、 有用性、流畅性、连贯性、一致性5个维度开展评分，采用人机 双盲评分机制保障结果客观：首先以市面公认的最强模型对标标 准答案，评估大模型回答结果与标答的偏离度，再由商景科技内 部专家测评团队开展人工打分，最终结合两方结果得到最终评分。 因测评题库规模较大，最终结果质量较高，已获得业内一致认可。 3、K3投研能力测评核心结果 ·综合评分与成本对比：大模型测评中，CloudFAB-5以94分排 名第一，是当前表现最好的模型，GPT-5.5以92.36分排名第二， K3以90分排名第三，为当前国产最强模型，性能超过市场常用 的Open4.8、Gemini3.1Pro两款模型。成本方面，K3单任务 成本为1.47，远低于CloudFAB-5的8.4、GPT-5.5的3.2。当前 用户使用K3时额度消耗过快属于短期现象，核心原因是Kimi整 体算力更多向模型训练端倾斜，推理端算力储备不足，属于K3 出圈后的计划外情况，后续随着K3基础算力扩容，其行业成本竞 争力将进一步凸显。 ·分项能力表现：针对K3的能力，从上下文忠实度、事件还原准 确性、金融问题回答专业度、推理深度、指令遵循能力等8个维 度进行深度二阶指标打分，测评结果显示K3在各分项上的得分与 CloudFAB-5、GPT-5.5基本不相上下，相比其他模型有稳定提升。 ·核心纪律性优势：K3在推理链条关键节点具备更强的纪律性， 适配B端专业投研场景需求，核心优势包括四点：a.面对财务指 标、产业链关键信息等多来源信息冲突的情况，可锚定最新事实， 不会被过期数据拉偏结论；b.信息不充分、存在证据缺口时，不 会通过幻觉填补因果链，避免B端用户因模型幻觉流失信任；c. 可主动核验用户输入的错误数据或前提，先指出错误再做解答， 不会顺着错误假设推导结论；d.多个机构存在观点分歧时，可提 取共识并标注分歧，不会用模糊共识回避矛盾。 4、K3测评案例与差距分析 ·投研场景测评案例：从三类典型投研场景对K3的投研能力完成 测评，核心表现如下： a.日内事件归因题：测评背景为光通信板块日内出现严重分化， 天府通信接近跌停但中际旭创、新易盛仅小幅回调，需在无实锤 利空公开信息的背景下完成事件归因。K3得分88.3分，首先明 确未发现天府通信的实锤利空，随后基于估值溢价、资金结构、 板块轮动三个维度的间接证据搭建归因框架，未编造不存在的事 实。对比来看，Open4.8为完善归因逻辑编造了不存在的公司公 告、客户变动信息，GPT5.5也编造了公司回应订单正常、市场传 闻减持的不实内容，均存在严重幻觉问题。 b.债券行情分析题：要求分析三季度债券市场行情走势，梳理市 场主流观点分歧，属于推理纪律类题型。K3得分94.3分，该题 涉及两个数据源的DR001指标存在冲突，其中万得iFinD、MCP 数据源的数据正确，另一来源数据错误，K3准确筛查识别出正确 数据源并引用，未采取多来源取均值的错误处理方式，符合金融 投研需优先采信高质量数据源的核心要求。 c.多框架整合题：要求阐述A股牛市通常经历的阶段、各阶段主 导风格与资配思路，结合市场观点分歧判断当前市场所处阶段。 K3输出清晰的“估值修复-资金正反馈-盈利兑现”三段判断方法 论，同时给出明确的配置建议，获得买方用户的高度认可。对比 Open4.8仅给出教科书式的多阶段划分罗列，未在多元观点分歧 中给出明确判断与配置动作，不符合题干要求。后续将开放全部 测评结果与定量评分标准，支持用户在平台自主完成大模型投研 能力打分。 ·与顶尖模型的差距分析：以东山精密SOTP分布估值题为案例， 可明确K3与顶尖模型的能力边界：测评题目要求以专业投资者视 角，对东山精密主业+索尔思光电业务做分业务定价，拆分800G 光模块、1.6T光模块、光芯片等产线的收入利润贡献并完成估值。 K3在该题得分90分，已完成基础分布估值框架搭建，实现主业 与索尔思光电的业务拆分，进一步拆分索尔思内部产品线，通过 出货量×单价测算收入，再完成利润、PA、估值倍数的全流程建 模，符合题目基本要求。 但对比顶尖模型Fable-5仍存在明显差距，本次测评中仅Fable-5 自动补充了反向市值隐含预期验证环节：在正向搭建估值模型后， 基于当前市值逆向拆解，明确当前市场预期已经反映2026年的利 润兑现，市场核心分歧在于2027年能否实现150亿-200亿的利 润目标，以及光芯片外售能否成为独立的估值增量，该能力对应 高级分析师的投研要求，也是中级分析师与高级分析师的核心差 异点。 当前K3已属于市面第一梯队大模型，在推理纪律性上表现突出， 但在深度投研框架的前瞻性、建模深度上与顶尖模型仍存在差距， 未来提升路径清晰，需完成从优秀分析师向资深买方投资人的能 力跃迁，也侧面反映AI产业距离AGI的进度不断推进。 5、AlphaEngine核心功能介绍 ·产品定位与模型接入：AlphaEngine定位为帮助机构投资者获 取阿尔法的投研引擎，网页端入口为alphaengine.top，同时支 持APP端、桌面端使用，官方优先推荐桌面端，可获得媲美海外 顶级agent工具如CodeX、CloudCode的丝滑原生使用体验。产 品目前已完整搭载K3模型，同时内置大模型竞技场，接入了包括 全球最强的Fable-5、海外顶级搜塔模型Premier等多种主流模 型，支持用户一键切换不同模型对同一个问题进行直接测评，使 用灵活性极强。该产品为开放生态，用户如果购买了对应厂商的 codingplan，仅需配置自有APIkey即可直接使用对应模型，无 需额外支付平台费用。目前K3后台硬件资源相对紧张，后续算力 扩容后使用体验会进一步提升。 ·SkillMarketplace与资源：平台上线了SkillMarketplace 功能，已经封装了多款优质投研skill，其中代表性的Serenity 工具封装了“七步心法”投研框架，既可以从AI领域相关新闻中 筛选出高弹性小票，也可实现事件驱动的投资机会挖掘：比如分 析美光日本广岛扩产事件时，可跳出对美光本身的业绩影响分析 逻辑，挖掘事件带动的日本本土供应商投资机会，用户仅需通过 斜杠调用即可直接使用该skill。官方会通过自有公众号不定期 分享优质投研skill，方便用户获取最新的投研工具资源。 6、AI投研行业趋势与发展建议 ·AI投研阶段定位：当前AI投研正处于AO3到AO4的切换阶段， 即从中级分析师能力向AI基座能力升级的阶段。今年约20%的用 户已不满足于PPT制作、Excel处理等基础功能，开始使用产品 开展深度投研工作。以海外AI链投资研究场景为例，可借助AI 完成英伟达新旧机柜硬件价值量对比分析：将GB300机柜与VR200 机柜的BOM表自动比对生成Excel，可得出两大机柜单托盘价值 量上涨57%，其中SSD价值量上涨70%，超芯片价值量上涨47%， BlueField的DPU价值量上涨240%，风扇环节因采用纯液冷方案 被移除；后续还可通过AI自动识别各环节对应的英伟达供应商， 跟踪相关标的业绩弹性，设置定时任务每日扫描相关公司财报动 态，自动生成日度报告。 ·行业核心趋势：AI投研行业目前有两大并行趋势，同时催生三 大核心行业变化，将重构整个投研生态： a.两大并行趋势：第一是投研平权，非AI领域的投研人员借助 AlphaEngine、AlphaCloud等工具，可快速将自身对AI领域的认 知从50分提升至80-85分，降低跨领域研究门槛；第二是超级个 体，高认知分析师可将自身积累的投研能力封装为数字化skill， 形成个人能力延伸，突破此前单人最多覆盖2个行业、20只个股 的上限，实现投研能力规模化。例如魔改开源GFDMAskill可实 现定量加定性选股，还可批量分析93只自选股的风险等级，每日 自动生成自选股日报。 b.三大核心行业变化：第一是弥合主动投资与量化投资的隔阂， AI可辅助投资人实现因子的webcoding，完成定量定性结合的判 断，例如可自动生成缠论代码，搭建本地网页展示个股缠论形态， 两中枢背驰形态一目了然；第二是催生新型金融机构组织形态， 大模型能力提升带动个体投研能力升级后，需要匹配新型组织模 式才能实现组织能力的同步提升；第三是重构投研服务模式，买 方侧AI投研需求已从前两年的会议纪要生成、去年的专业问题解 答，升级至当前的选股辅助需求；卖方侧已从传统的研报、会议 观点输出，升级至投研skill输出，未来将进一步升级为agent 服务能力输出。 ·AGI方向与发展建议：DeepSeek等头部AI厂商的发展路径显示， 可持续学习能力是大模型向AGI冲刺的最后一公里。当前大模型 普遍存在顺行性遗忘问题，不具备动态调参的自我迭代能力，若 可实现大模型自我训练、自主优化算法结构与注意力机制的循环 跑通，将实现智力的无限飞升，目前人类距离该节点已不远。今 年IRB模型测评集的区分度已经明显下降，去年模型得分分布在 60-80分区间，今年普遍达到80分以上，后续将优化测评集难度， 提升区分度。针对AI投研时代的发展，给出两方面建议：个人层 面，需从当下开始构建专属于自身的独特上下文，留存访谈纪要、 个人投研逻辑等内容，搭建本地专属知识库；企业层面，需构建 专属高价值数据库，打造独家数据壁垒，形成AI时代的核心护城 河。 7、AlphaEngine配套服务说明 ·产品配套政策：AlphaEngine定位为助力机构投资者获取Alpha 的功能引擎，当前产品可通过两大渠道使用：网页端访问地址为 alphaengine.top，桌面端可在网页端下载AlphaCloud安装使用。 产品体验配套规则如下：a.平台为每位用户预充值积分，可免费 体验K3模型，若后续使用量较大，则需充值积分继续使用；b.平 台同时支持体验飞波五模型，用户可直接操作对比K3与飞波五的 功能差异。 平台鼓励用户多上手实操体验各类AI能力应用，通过实际使用感 受保持对相关业务的敏感度，有后续单独交流需求的用户可进一 步对接联系。 8、热点问题答疑 ·测评与技术类问题：a.测评模型选择：未使用GPT5.6测评是 因为当前以Fable-5作为与GPT-4.6能力相当或更优的第一梯队 标杆，其测评结果已够用，不存在模型取舍问题，后续会补充 GPT4.65、4.6等模型的测评结果。b.K3的harness优化：K3本 身为建模能力提升，每一代新模型都需做专属harness调优，当 前线上产品仍基于cloudoffice搭建整套harness，后续会针对 K3做单独优化；随着基模能力提升，harness层工作将逐步简化， 类似此前提示词工程随OpenAIO1等具备深度思考能力的模型出 现逐渐淡出应用，原本在harness层实现的数据多路校验等功能， 未来基模可自行完成有效识别。c.K3的训练优化：K3未针对投 研场景做预训练，专业场景优化应通过后训练实现，Kimi团队已 在强化学习方向布局，相关能力已体现在K3中，K3在医疗、教 育等其他专业领域的表现可参考对应专业应用公司的测评结果。 ·产品与体验类问题：a.模型接入规划：已接入MiniMax、智谱、 Kimi、千问、DeepSeek等主流模型，后续将接入小米MIMO等更 多主流模型；支持用户直接购买大模型厂商的codingplan，费 用直接支付给大模型厂商，配置key后即可使用，无需额外在平 台充积分，实现token自由；若使用平台内置的顶级模型，可选 择在平台充值积分，积分按成本折扣提供服务。b.大模型使用体 验：K3与Claude的拟人化差异源于训练数据集不同，投研场景 下更看重结论准确性、思考过程清晰度，拟人化维度影响较小； K3算力充裕后可作为主力模型，算力不足阶段可先用ClaudeOpus 作为主力模型，使用体验优于其他模型；个人日常积分消耗低时 每日几百积分，高时每日3000多积分，使用K3成本更低，K3输 入成本为3美元，输出成本为15美元，比GPT5.6便宜一半，远 低于Fable-5的50美元成本。c.数据与功能规划：产品已对接 全市场A股、港股、美股的财报、行情、会议纪要、国内研报、 海外券商研报、专家网络纪要访谈等专业数据，支持自定义接入 万得、同花顺等三方数据库，当前已支持接入IMA数据，近期将 上线公众号文章、有道云笔记同步功能。 ·测评与数据类问题：a.测评标准答案来源：测评的标准答案由 内部专家团队制定，而非从公开研报、媒体报道中搜索获取，每 个问题都对应唯一准确的事实性答案，不存在偏差；专家团队同 时负责产品功能设计、AI能力建设、测评级专业答案维护生成等 工作，保障评分的专业性与客观性。b.个人上下文跨工具统一： 个人上下文跨工具统一建议采用本地知识库存储，不要将知识库 上传云端与单一产品绑定，可使用Obsidian（黑曜石）等本地知 识管理工具，将读书笔记、估值模型底稿、行业公司研究底稿等 数据留存本地；产品支持接入本地文件、Obsidian等本地知识库， 用户可通过一句话指令灵活接入万得MCP、同花顺MCP、Obsidian MCP等各类数据源，实现数据自主可控与跨工具调用，官方默认 提供同花顺、IAV两个连接器，其余连接器可由用户自定义接入。", "status": "extracted"}, "post:2026-07-25T22-49:8bb3f8c3bbfc": {"id": "post:2026-07-25T22-49:8bb3f8c3bbfc", "kind": "post", "title": "2026-07-25 22:49", "source_label": "帖子正文", "excerpt": "韩美峰会合作协议相关问题：韩国代表团访美期间，和英伟达、OpenAI 及其余美国公司达成了哪些合作协议？相关协议会对三星电子、SK 海力士股价产生何种影响？", "content": "韩美峰会合作协议相关问题：韩国代表团访美期间，和英伟达、OpenAI 及其余美国公司达成了哪些合作协议？相关协议会对三星电子、SK 海力士股价产生何种影响？ 协议核心内容整理 整体合作总规模：韩美企业达成合计 9500 亿美元产业合作，其中 SK 集团相关合作规模 7500 亿美元，包含与英伟达达成 5000 亿美元长期芯片采购意向、前置 GPU 和 HBM 显存批量预购订单；合作条款包含长期设备采购、资本投资、分阶段产能交付等多重约束条款。 SK 电讯合作：与英伟达共建吉瓦级 AI 数据中心，落地 Vera Rubin 新一代芯片、SK 自研 HBM4 存储配套算力园区。 三星电子合作：与博通达成 2000 亿美元长期供货协议，批量供应 HBM 高端显存、配套存储芯片，绑定长期量产交付条款。 NAVER、现代汽车等其余韩国公司同步和英伟达、博通、OpenAI 落地配套算力、芯片、AI 模型合作框架协议。 对产业链标的影响 利好 SK 海力士：谷歌、英伟达两大算力龙头长期锁定 HBM 存储采购，存储芯片量价齐升逻辑持续强化，中长期业绩增长确定性大幅提高。 三星电子：20...", "publish_time": "2026-07-25 22:49", "tags": ["文字观点"]}, "post:2026-07-25T22-49:01b0f5adac6d": {"id": "post:2026-07-25T22-49:01b0f5adac6d", "kind": "post", "title": "2026-07-25 22:49", "source_label": "帖子正文", "excerpt": "韩美企业签署超 9500 亿美元半导体合作协议，加码吉瓦级 AI 算力基建 在旧金山 AI 峰会结束后的高层会谈结束后，总统办公室对外公布，韩国与美国的多家公司已达成总额超 9500 亿美元的大规模半导体供应合作协议。协议核心规模拆解：三星电子与博通签署 2000 亿美元 展 AI板块波动加剧，市场情绪降温。美股回落，美债利率上行，美元指数回升，金价、油价上涨。", "content": "【申万宏源宏观·周精粹第91期】 一、要闻回顾：国内推出服务业领域“十五五”规划，海外关注美伊冲突进展 AI板块波动加剧，市场情绪降温。美股回落，美债利率上行，美元指数回升，金价、油价上涨。国内方面，上证指数回升，10Y中债利率小幅回落至1.73%，CNY升值至6.78。 国内宏观：“十五五”注重服务业扩能提质 7月20日，国常会强调要充分释放服务业发展潜力，系统推进“六张网”规划建设。 7月22日，《体育强国建设“十五五”规划》发布，指出到2030年产业规模突破7万亿元。 7月23日，证监会召开座谈会强调，综合施策全力维护市场平稳运行，提升资本市场韧性。 7月23日，国务院印发《全民健身计划（2026—2030年）》，指出人均体育场地面积达4平方米左右。 6月，广义财政收入、支出同比分别回落至1.8%、-11.9%。 海外宏观：美众议院要求停止对伊战争 7月24日，美国国会众议院通过决议，要求特朗普政府停止对伊朗战争。 7月，美国标普制造业PMI初值降至53.8%，为3月来最低水平。 美国上周初请失业金人数较前周骤降至18.7万，低于市场预期。 韩国二季度GDP同比3.7%，...", "publish_time": "2026-07-25 22:50", "tags": ["文字观点"]}, "post:2026-07-25T22-46:ef164da262d0": {"id": "post:2026-07-25T22-46:ef164da262d0", "kind": "post", "title": "2026-07-25 22:46", "source_label": "帖子正文", "excerpt": "截止7月25日 周一开盘已知利空： 1、美股存储、科技、半导体隔夜大跌， 2、游资方某君 封涨停 被罚1.75亿；3、长鑫科技上市，日内成交额1000亿以上", "content": "截止7月25日 周一开盘已知利空： 1、美股存储、科技、半导体隔夜大跌， 2、游资方某君 封涨停 被罚1.75亿； 3、长鑫科技上市，日内成交额1000亿以上；2万亿市场吸血占比5%； 4、宁德时代史上最强回购，开盘越高成交量越大；预估成交200亿；2万亿市场吸血占比1%; 4、彭博--监管机构审查量化算法，更严格限制措施； 5、方星海被突然控制，受牵连资本、量化、财团要第一时间跑路离场； 6、受4、5影响 量化机构在下周开始调仓、降低频率、离场等因素，指数存在波动。#文字观点", "publish_time": "2026-07-25 22:46", "tags": ["文字观点"]}, "post:2026-07-25T22-52:8aad0661768a": {"id": "post:2026-07-25T22-52:8aad0661768a", "kind": "post", "title": "2026-07-25 22:52", "source_label": "帖子正文", "excerpt": "本轮美伊冲突升级的本质是特朗普为了谈判免费通航的短期投机行为。展望后续，冲突或持续，但在油价大幅上行或中选更加临近时有望降级。", "content": "本轮美伊冲突升级的本质是特朗普为了谈判免费通航的短期投机行为。展望后续，冲突或持续，但在油价大幅上行或中选更加临近时有望降级。 短期看，特朗普近期仍希望对伊朗#维持极限施压的立场，而市场对石油涨价的定价理性成分上升，恐慌成分下降，这或印证了我们短期特朗普TACO阈值抬升、安全感增强、局势易升难降、油价易涨难跌的观点。 中期看，我们仍认为特朗普①必须结束战争，②必须压降油价，③必须酝酿降息环境，因此#必须降级以配合中期选举。不论美国作出如何鹰派姿态，看底层逻辑伊朗仍是美国的谈判对手，而不是战争敌人。 详见报告： 《美伊的下一步走势：理性推演》【兴证策略张启尧团队】美伊的下一步走势：理性推演#文字观点", "publish_time": "2026-07-25 22:52", "tags": ["文字观点"]}, "attachment:files/GS-美股股票每周综述：全市场持仓、资金流向与盘面观察要点 US Equities Weekly Rundown Positioning, Flows, and Observations Across the Floor.pdf": {"id": "attachment:files/GS-美股股票每周综述：全市场持仓、资金流向与盘面观察要点 US Equities Weekly Rundown Positioning, Flows, and Observations Across the Floor.pdf", "kind": "attachment", "title": "GS-美股股票每周综述：全市场持仓、资金流向与盘面观察要点 US Equities Weekly Rundown Positioning, Flows, and Observations Across the Floor", "source_label": "GS", "excerpt": "", "content": "", "status": "failed"}, "attachment:files/Markets_Macro 宏观_市场.pdf": {"id": "attachment:files/Markets_Macro 宏观_市场.pdf", "kind": "attachment", "title": "Markets_Macro 宏观_市场", "source_label": "其他", "excerpt": "", "content": "", "status": "failed"}, "post:2026-07-25T22-50:d39f2504ca28": {"id": "post:2026-07-25T22-50:d39f2504ca28", "kind": "post", "title": "2026-07-25 22:50", "source_label": "帖子正文", "excerpt": "【东北计算机】江海股份：高端电容产能扩张，继续看好NV/CSP后续电源扩容带来的产品放量事件：7月23日，江海股份AI、智能汽车、新能源、储能专用电容器项目一期工程正式启动。项目总投资50亿元，其中一期工程计划投资10亿元，达产后预计年产专用电容器1.5亿只，预计新增年产值20亿元。", "content": "【东北计算机】江海股份：高端电容产能扩张，继续看好NV/CSP后续电源扩容带来的产品放量事件：7月23日，江海股份AI、智能汽车、新能源、储能专用电容器项目一期工程正式启动。项目总投资50亿元，其中一期工程计划投资10亿元，达产后预计年产专用电容器1.5亿只，预计新增年产值20亿元。 #AI&新能源双轮驱动、做多电解电容=做多电源功率 AI芯片功耗持续抬升，PSU、大功率整流单元对大容量、长寿命高端铝电解电容需求显著扩容；新能源车800V高压平台加速渗透，带动车载OBC、DC-DC、BMS等高压化升级，拉动车规电容价值量提升。本次江海高端产能落地，印证高端被动元件供需紧平衡具备持续性，国内头部厂商有望承接需求增长与日系替代双重红利。 #多品类平台优势叠加高端产能扩张、产品结构优化有望推动盈利中枢持续抬升 公司是国内稀缺平台型电容厂商，依托铝电解电容深厚技术积淀与优质客户资源，横向布局薄膜电容、超级电容，构建多品类协同优势。本次扩产聚焦算力、车载等高景气赛道专用产品，有望持续提升高端产品营收占比，带动整体盈利中枢上移，深度受益于 AI 电源功率升级与国产替代加速的双重产业红利。 风...", "publish_time": "2026-07-25 22:50", "tags": ["文字观点"]}, "post:2026-07-25T16-26:dd89faa3b994": {"id": "post:2026-07-25T16-26:dd89faa3b994", "kind": "post", "title": "2026-07-25 16:26", "source_label": "帖子正文", "excerpt": "宁德时代2026年半年报及电话会议交流要点：经营情况：2026年上半年，公司营业收入2769.17亿元，同比增长54.80%；归母净利润432.84亿元，同比增长41.98%", "content": "宁德时代2026年半年报及电话会议交流要点：经营情况：2026年上半年，公司营业收入2769.17亿元，同比增长54.80%；归母净利润432.84亿元，同比增长41.98%；扣非净利润390.13亿元，同比增长43.44%，基本每股收益9.51元，加权平均净资产收益率12.08%。公司拟每10股派发现金红利14.11元，并计划以200亿至400亿元回购股份并注销。全球龙头地位进一步巩固：公司动力电池继续保持全球第一，2026年1-5月全球市占率40.2%，同比提升2.2个百分点，国内乘用车市场份额46.7%。储能电池出货量依然位列全球第一，并在国内外储能集成项目中活跃，强化行业领导者优势。换电：截至2026年7月，全国累计建成巧克力换电站约2000个，覆盖31个省份180个城市；AIDC：高度看好AIDC领域的用电
