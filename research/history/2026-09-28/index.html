项目，同时拟通过增资和借款方式向", "content": "", "publish_time": "2026-09-28 21:54", "tags": ["文字观点"]}, "post:2026-09-28T07-53:6b9e85e0291b": {"id": "post:2026-09-28T07-53:6b9e85e0291b", "kind": "post", "title": "2026-09-28 07:53", "source_label": "帖子正文", "excerpt": "看好“油运大时代”- 招商轮船、中远海能、招商南油 上周美伊谈判最终未有进展，而中东原油出口正在逐渐恢复，海峡暗航货量达到1100w桶/日水平，沙特管道亦开始逐渐恢复。", "content": "", "publish_time": "2026-09-28 07:53", "tags": ["文字观点"]}}, "source_details": {"post:2026-09-28T07-31:7998b1173820": {"id": "post:2026-09-28T07-31:7998b1173820", "kind": "post", "title": "2026-09-28 07:31", "source_label": "帖子正文", "excerpt": "阿里云栖：模型之外，更关注硬件和应用侧进展模型：Qwen4已在训练，后续Qwen4.5/5规划5–10T参数，并进一步强调RSI自我改进；万相3.0继续升级视频生成能力，支持多模态输入、最长30秒及原生音频，应用场景从短视频逐步延伸至短剧、广告、MV等内容生产，同时开始探索世界模型方向。", "content": "阿里云栖：模型之外，更关注硬件和应用侧进展模型：Qwen4已在训练，后续Qwen4.5/5规划5–10T参数，并进一步强调RSI自我改进；万相3.0继续升级视频生成能力，支持多模态输入、最长30秒及原生音频，应用场景从短视频逐步延伸至短剧、广告、MV等内容生产，同时开始探索世界模型方向。硬件：阿里目前已覆盖真武GPU、倚天CPU、磐脉SmartNIC、ICN互联芯片及镇岳SSD控制器。此次发布真武V900，性能较M890提升3倍，配合自研超节点，单集群可扩展至50万卡，预计27Q1量产；27年倚天CPU也将继续迭代。#相比单颗芯片，本次更值得关注的是计算、网络、存储及集群层面的协同。云基础设施：公司提出2032年全球数据中心规模超过20GW，未来12个月继续扩张海外Region，#反映公司对中长期AI算力需求仍保持较积极判断。应用：千问办公发布Enterprise Context，将企业知识、文档及业务数据转化为Agent可按需调用的上下文，并结合Agent托管能力切入企业数字员工场景；同时推出AI录音硬件QwenNote A2。终端侧还有Qwen Book、Qwen Intelligence，以及眼镜、耳机等产品，继续拓展AI入口。 后续关注：我们认为本次大会的边际变化主要有两点：1）自研芯片开始从单点产品走向芯片、超节点和集群协同，后续关注能否提升算力供给效率；2）应用侧从模型调用进一步延伸到视频生产、企业Agent和终端入口，后续关注能否转化为Token调用、MaaS渗透及阿里云收入增长。#文字观点", "publish_time": "2026-09-28 07:31", "tags": ["文字观点"]}, "post:2026-09-28T13-57:4b2c620d8fdf": {"id": "post:2026-09-28T13-57:4b2c620d8fdf", "kind": "post", "title": "2026-09-28 13:57", "source_label": "帖子正文", "excerpt": "重视【AI安全】 AI Agent加速进入真实攻防+网安龙头加码，AI安全需求加速｜中信证券计算机AI失控事件持续升级，Agent开始触达真实系统 -9月18日Google确认，Gemini在5月网络安全测试中因意外联网，访问3家真实企业系统，其中一次通过猜测密码获得访问权限；继OpenAI、Ant", "content": "重视【AI安全】 AI Agent加速进入真实攻防+网安龙头加码，AI安全需求加速｜中信证券计算机AI失控事件持续升级，Agent开始触达真实系统 -9月18日Google确认，Gemini在5月网络安全测试中因意外联网，访问3家真实企业系统，其中一次通过猜测密码获得访问权限；继OpenAI、Anthropic、Meta后，Google成为又一家披露类似事件的头部厂商。9月26日OpenAI又披露，其Agent曾未经授权访问美国商务部、SEC等政府网站。 -#AIAgent已从测试环境向真实网络延伸，安全风险从“模型失控”进一步演变为“自主行动失控”。大模型能力跃迁，攻防不对等加剧 -Google威胁情报显示，攻击者已从Prompt攻击转向Agentic AI工作流，Q2曾观察到攻击者在6小时内完成云资源入侵并执行大规模凭证窃取；OpenAI已将Astra网络安全能力评定为“Critical”，可自主发现未知漏洞并开发利用方式。 -同时，攻击者开始瞄准模型、代码、Prompt、API密钥及算力资源，模型蒸馏、供应链攻击等风险同步上升。#AI从“会回答”走向“会执行”，攻击面由模型扩展至Agent、身份、数据、代码和基础设施。海外龙头业绩+产品双验证，AI安全进入兑现期 -PANW FY26Q4营收同比+34%、NGS ARR同比+63%，近期推出AI驱动漏洞发现服务，调用Anthropic、OpenAI等多模型持续扫描企业网络；Zscaler FY26Q4营收及ARR均同比+25%，持续布局Agentic SecOps、Security for AI。 -#“AI攻击+AI防御”双向驱动，安全预算有望持续提升，AI安全或成为AI产业高确定性应用场景。国内加速布局，对标海外具备复制基础 -深信服：AI+SASE+安全运营GPT；绿盟科技：AI安全+智能渗透测试+NDR/IDS；启明星辰：AI防火墙+安全代理+安全评估；天融信：天问安全大模型TopASK+大模型安全网关。 -#Agent攻击面扩大+海外龙头业绩验证+AI防御产品加速落地，国内AI安全需求有望从主题催化进入产业兑现期。建议关注：深信服、绿盟科技、启明星辰、天融信、奇安信、亚信安全、迪普科技、安恒信息#文字观点", "publish_time": "2026-09-28 13:57", "tags": ["AI", "文字观点"]}, "post:2026-09-28T14-34:6fe782ad3fc6": {"id": "post:2026-09-28T14-34:6fe782ad3fc6", "kind": "post", "title": "2026-09-28 14:34", "source_label": "帖子正文", "excerpt": "📑🔥SEMICON Taiwan 2026 光学 / CPO 产业总结 📝前言 ℹ️ SEMICON Taiwan 侧重制造与供应链落地，与侧重芯片架构的 Hot Chips 形成互补，对判断 AI 硬件瓶颈、光互联迭代节奏更具实操参考。本次论坛核心聚焦：CPO 四阶段迭代、400G + 单通道材料", "content": "📑🔥SEMICON Taiwan 2026 光学 / CPO 产业总结 📝前言 ℹ️ SEMICON Taiwan 侧重制造与供应链落地，与侧重芯片架构的 Hot Chips 形成互补，对判断 AI 硬件瓶颈、光互联迭代节奏更具实操参考。本次论坛核心聚焦：CPO 四阶段迭代、400G + 单通道材料路线、超大 GPU 光域价值、NPO/CPO/ 光学 I/O 分层落地、测试产能真实瓶颈。 📚一、基础光链路架构 & CPO 四阶段演进 💡 一条标准光链路包含四要素：激光器、调制器、光纤、光电探测器。可插拔光模块为集成成品；铜线无需光电转换、成本更低，仅超高带宽场景才会使用光学方案替代铜线。 📋 行业统一 CPO / 光互联划分出四阶段以及终极形态： 🔹 Stage0（已成熟）：可插拔光模块，机架 / 机群横向互联（scale‑out），存量数据中心主流方案。 🔹 Stage1（已量产出货）：横向互联 CPO，光器件移入交换机封装，砍掉 SerDes，大幅降低功耗。 🔹 Stage2（2027 主力）：机架间纵向光互联（scale‑up），突破单铜缆机架 GPU 数量上限。 🔹 Stage3（2027–2028）：机架内全光互联，单通道超高带宽彻底替代铜线。 🔹 Stage4（2028 + 远期）：中介层光学 I/O（scale‑in），光引擎直连 GPU/HBM，实现内存与算力解耦、内存池化。 ✅ 本届论坛达成共识：Stage0/1 落地已经确定，Stage2/3 是行业博弈焦点，Stage4 为终极架构。 🌐二、网络架构：AI 算力彻底倒逼光学升级 🔍1、流量结构巨变（核心拐点） 📊 传统数据中心流量集中在前端用户侧；AI 数据中心流量呈现极端分化特征： 📌 前端流量：传统 7 倍 → AI 14 倍 📌 横向互联：传统 7 倍 → AI 56 倍 📌 纵向 GPU 互联：传统几乎为 0 → AI 500 倍 ⚠️ 当前 500 倍增量的纵向带宽依旧全部采用铜线，是 AI 集群最大物理瓶颈。同时可插拔光模块已经触达功耗天花板：1.6T 可插拔每比特 10pJ，无法继续下降；CPO 可以做到 2–5pJ/bit，功耗优化 5–6 倍，核心原因是去除板级电 SerDes 电路。 🔬2、调制方式代际差异（速率上限根源） 📌 机架内短距：NRZ（1 符号 1bit） 📌 中距横向扩展：PAM4（1 符号 2bit，当前主流 200G/400G） 📌 长距跨中心：16‑QAM 相干（4bit / 符号） ⚠️ 速率越高，信噪比余量越低。400G 是重要分水岭：铜线可升级 PAM6，光学受限于信噪比只能维持 PAM4，必须依靠新材料、新器件、波分复用突破速率上限。 🧪3、Marvell 技术路线：高速 & 多材料并行 💡 进入单通道 400G + 时代，硅基器件全面遭遇瓶颈，Marvell 采取双线布局策略： 📌 长距：薄膜铌酸锂（TFLN）+ 微环调制器 📌 短距纵向：电吸收调制器、Micro‑LED、VCSEL、等离子体激元 ⚠️ 行业现存痛点：高速器件尺寸偏大、小型器件速率偏低，很难二者兼顾。 ✨ Marvell 王牌路线等离子体激元调制器：带宽 990GHz（传统器件仅 110GHz），是目前唯一可落地单通道 800G 的方案，商业化落地预计需要 5 年时间。 📌 Marvell 当前量产 2.5D CPO 光引擎：32×224G，第二代已经量产，四代处于研发阶段；依靠系统级冗余替代硬件备用光引擎，提升集成度。 🌟4、Lightmatter：超大光 GPU 域的颠覆性价值（本届最核心结论） 🎯 行业终极目标：1000GPU 统一光域，逻辑上等同于单颗大 GPU，无需人工拆分机架任务。 📈 核心量化收益（不依赖自家硬件，属于架构层面红利） 📌 训练场景：512GPU 单光域对比 4 个 144GPU 铜域，同等功耗条件下万亿 MoE 模型训练速度提升至 2.7 倍；单 GPU 带宽拉满 32Tb/s 时接近 3 倍提速。 📌 推理场景：131K 超长上下文首 Token 延迟降低三分之二；单用户解码 Token 吞吐量实现翻倍。 🔎原理部分 💡 铜架构存在机群边界瓶颈：跨机群数据传输会从高带宽纵向模式降级为低带宽横向模式，GPU 长时间等待，算力利用率偏低。大尺寸光域消除机群边界，可以全程跑满最高带宽。 📅产品与时间线 📌 NPO（近封装光学）2027：板卡级光引擎，不需要进入芯片封装，落地速度最快，Passage L20：224G、4.8pJ/bit，已经纳入 NVLink 生态。 📌 CPO 2028 年底实现规模化落地。 📌 Stage4 光学 I/O 2028 同步推进。 ⚠️光源瓶颈与解决方案 💡 激光功率已经抵达光纤损伤阈值，无法通过提升单颗激光器功率解决问题，只能够依靠增加激光器数量，这会带来成本、面积、散热方面的压力。 ✨ Lightmatter Guide 片上激光阵列：单芯片集成 128 激光器（可以扩展至千颗），采用 CMOS 工艺制造，频率、功率稳定性优异，能够自动冗余替换失效激光器，失效率仅 0.1FIT。 📜行业新标准 OCI MSA 🤝 英伟达 / AMD/OpenAI/ 博通联合定义首个纯光学标准，不再适配老旧 SerDes。核心特性：单纤双向 + DWDM 密波分、微环调制器作为标配。 📊 512GPU 集群可节省 240km 光纤、2 万光连接器，全网功耗降低 16%，适配未来 10 倍光纤增量需求。 🏭三、晶圆厂路线：200G 以上硅基见顶，材料路线彻底分化 🔍1、台积电 TSMC：正式拆分 CPO 两大形态（行业首次定义） ⚠️ AI 领域出现严重 I/O 墙失衡：算力两年增长 3 倍、内存带宽增长 1.6 倍、互联带宽仅增长 1.4 倍。 📋 台积电官方二分法： 📌1. CPO‑MCM（传统 CPO）：光引擎布置在交换机基板，实现 GPU‑GPU 互联，能效为铜线 4 倍、延迟为铜线 0.1 倍。 📌2. CPO‑OOI（光学 I/O/Scale‑in）：光引擎直连 XPU 中介层，覆盖 GPU‑HBM 内存流量，能效达到铜线 10 倍、延迟仅铜线 0.05 倍，属于终极架构。 🔧COUPE 通用光子引擎 💡 SoIC 混合键合光电共封，支持光栅、边缘双耦合形态，全套硅光 PDK 实现商用。 📊 带宽采取双路线并行，不押注单一技术： 📌 高速窄带：单通道 200G 向 400G + 演进 📌 低速宽带：维持 200G 速率，依靠多波长堆叠实现带宽扩容 ✨ 两条路线均能够实现最高 51.2Tb/s 单引擎带宽。 📅 远期规划：调制器 / 放大器 / 光源全部集成在 COUPE 背面，对接 CoWoS 实现全光异构封装。 🔍2、联电 UMC：硅基 200G 物理极限实锤，TFLN 是长距唯一解 ⚠️ 硅基三类调制器全部遭遇失效问题： 📌1. 马赫‑曾德尔：800G 需要 8V 高压，电路层面难以实现 📌2. 微环调制器：对温度 ±1℃变化十分敏感，速率越高信号质量越差 📌3. 电吸收调制器：损耗大、色散严重、传输距离短 💡联电核心判断： ⚠️ 磷化铟成本高昂同时供货紧张、硅基性能已经触顶，薄膜铌酸锂 TFLN 是 400G + 长距场景唯一可规模化路线。 ✅ TFLN 优势：电信级数十年可靠性、LNOI 基底成熟，不会和激光器争抢磷化铟产能。联电 6 英寸 TFLN 实现量产、8 英寸处于送样阶段。 ✨两大增量技术 📌1. 精简相干 Coherent‑lite：适配 TFLN 高线性度，短距场景替代全相干方案，弥补交换机 3dB 光损耗。 📌2. 微环 DWDM：单光纤带宽一代提升 4 倍，完成台阶式带宽扩容。 🔍3、IMEC：硅基极限挖掘 + 异构材料集成 ✅ IMEC 验证硅光可以支撑至 400G，锗探测器带宽突破 110GHz，反驳 “硅基彻底报废” 的观点。 🔮 远期依靠三类新材料突破 400G + 性能：钛酸钡、III‑V 族、等离子体激元。 🔧 核心工艺微转印：规避 CMOS 禁锂限制、重复利用稀缺衬底、实现异构材料混合集成，是未来高端光子器件通用工艺。 ✨ 同时实现整片晶圆氮化硅波导，跨曝光场无缺陷，损耗低至 0.01dB/cm，为光学中介层打下工艺基础。 🔍4、Soitec：基底龙头定义产业时间线 📋 行业统一落地节奏： 📌 2026–2027：全铜机架 📌 2027–2028：混合光电（架间光、架内铜） 📌 2029：整机全光、算力网络完全解耦 💡 LNOI 晶圆对比硅光，400G 场景功耗降低 15%；同时布局硅基磷化铟 InPOSi 基底，缓解 InP 供给紧张问题，散热表现更好、晶圆翘曲程度更低。 🔦四、激光器：全产业最紧供给瓶颈，VCSEL 逆袭超预期 📋 激光器两大路线：磷化铟 InP（传统高端路线）、砷化镓 VCSEL（新兴增量路线）。 🔍1、Lumentum（最大 InP 厂商）反向力推 VCSEL 💡 反常行为背后核心原因：InP 产能被锁定、长期供货紧缺，VCSEL 是唯一可实现产能增量的方案。 ✅ VCSEL 核心优势： 📌 消费电子 3D 传感、车载激光雷达已经完成千亿级出货验证，具备高温高可靠特性 📌 1060nm 新波段可以堆叠集成在 CMOS / 中介层上方 📌 单通道 32–64Gb/s，性能远超 Micro‑LED 的 3Gb/s 上限 📌 成本、良率、量产规模全面占优 ✨ Lumentum 推出 32Tb/s 双向 VCSEL 光芯粒搭配 MEMS 光交换机，可将十万卡集群网络功耗降低 65% 以上。 🔍2、Coherent 📌 采取双路线并行策略，主推 VCSEL 低功耗 CPO，和 IBM 共同推出 8×800G 参考设计。 💡 CPO 带来元器件重构：激光器、微透镜、保偏光纤从模块内部拆分为独立单品。 ✨ 自研液晶光开关无机械运动部件，可靠性优异，已经产生商用收入。 🔍3、SMART Photonics（欧洲 InP 代工厂） 💡 磷化铟是唯一能够单片集成全部光电器件的材料，可以省去异构耦合带来的损耗。 📌 110GHz 调制器实测支持 480G，高温条件下无需制冷。 📋 硅与 InP 集成三大路径：混合集成、微转印、单片集成，微转印是解决 InP 稀缺问题的最优解。 🔧五、制造封装 & 设备 🔍1、ASE 安靠 📌 光引擎体积仅为可插拔模块的 1/20–1/100，可嵌入封装边缘，性能提升 12–30 倍、功耗下降至原来 1/6。 ✨ 依靠 FOCoS/FOCoS‑Bridge、面板级封装解决 AI 超大尺寸封装瓶颈，I/O 密度达到传统倒装封装 50–200 倍。 ⚠️ 行业现存瓶颈：多通道耦合损耗随通道数量增加快速上升、晶圆级良率测试设备短缺，行业正在通过 CPI 联盟统一接口标准。 🔍2、泛林半导体 ✨ 光子工艺取得核心突破：低氢无氢氮化硅沉积工艺，大幅降低光损耗；脉冲激光沉积工艺可以制备钛酸钡高端调制器薄膜。 📌 刻蚀、深硅沟槽、混合键合界面工艺全部适配先进光子器件，支撑 200G + 器件良率爬坡。 🧪六、测试：真正限制 2027 NPO/CPO 量产的核心瓶颈 💬 上午厂商态度偏乐观，下午测试厂商集体给出偏谨慎判断：技术路线具备可行性，但是量产能力不足。 ⚠️核心痛点 📌1. 光学 KGD 良品判定难度很高：键合应力会造成波导偏移 1nm、波长漂移 100GHz，失效溯源难度大。 📌2. 纵向光引擎测试工作量是传统横向方案的 10–100 倍。 📌3. 高端测试设备单台重量 6–8 吨，产线可部署设备数量有限。 📌4. 行业尚未形成统一的光学探针、连接器、校准标准。 🔍ficonTEC ⚠️ 行业绝对瓶颈：2025 年累计出货 2000 台，未来 18 个月需要新增 1000 台设备，产能缺口巨大。 📌 四段式全流程测试，逐级管控失效成本，9 月实现 1.6T 全自动暗室模块测试设备量产。 🔍Advantest/Onto Innovation ✨ 依靠光谱成像实现损耗精准定位，测试速度相比传统方案提升 6 倍，是后续良率提升关键。 📌 2027 年之前，设备、探针、双面测试整套体系才会逐步走向成熟。 📌七、最终大会核心结论（投资 & 产业重点） ✨1. 最大产业红利来自光域架构，而不是单一器件 💡512GPU + 超大统一光域，可以带来训练性能 3 倍、推理性能 2 倍的确定性提升，是未来一两年 AI 集群最大性能跃迁。 ✨2. 材料路线终局分化，不存在可以通吃全部场景的赢家 📌 长距 / 横向 400G+：TFLN 铌酸锂主导（解决硅基性能上限与 InP 供货紧缺） 📌 短距 / 纵向 OCI 架构：硅基微环 + DWDM 主导（享受硅工艺迭代红利） 📌 增量高速场景：等离子体激元、钛酸钡、III‑V 异构集成作为补充方案 ✨3. VCSEL 是超预期黑马 💡头部 InP 厂商集体转向推广，本质源于产能刚性缺口，VCSEL 将会主导低成本、大规模短距 CPO/NPO 市场。 📅4. 落地时间线已经明确 📌 2027：NPO 规模落地、机架实现混合光电 📌 2028 年底：CPO 走向成熟、光学 I/O 启动推进 📌 2029：全光机架、内存池化落地 ⚠️5. 最大风险不在技术层面，而在于测试产能 💡如果 2027 产业节奏发生延期，瓶颈百分之百来自测试设备与良率，而不是光学芯片、调制器、激光器。 🔮6. 终极形态是 GPU‑HBM 全光互联 💡Stage4 光学 I/O 彻底打破内存物理束缚，算力与存储实现解耦，属于后摩尔时代 AI 架构长期终局。#文字观点", "publish_time": "2026-09-28 14:34", "tags": ["文字观点"]}, "attachment:files/0928 脱水研报.pdf": {"id": "attachment:files/0928 脱水研报.pdf", "kind": "attachment", "title": "0928 脱水研报", "source_label": "其他", "excerpt": "英伟达+英特尔+AMD，三大芯片巨头全部入局金刚 石散热，产业化提速；海运转向安全优先，油运迎… xuangut ong.com.cn 2026/09/28 19:56 【本文来自持牌证券机构，不代表平台观点，请独立判断和决策】 摘要： 1、金刚石散热：2026年以来，英伟达、英特尔、AMD 三大芯片巨头已全部 入局金刚石散热，并将其纳入下一代半导体材料战略", "content": "英伟达+英特尔+AMD，三大芯片巨头全部入局金刚 石散热，产业化提速；海运转向安全优先，油运迎… xuangut ong.com.cn 2026/09/28 19:56 【本文来自持牌证券机构，不代表平台观点，请独立判断和决策】 摘要： 1、金刚石散热：2026年以来，英伟达、英特尔、AMD 三大芯片巨头已全部 入局金刚石散热，并将其纳入下一代半导体材料战略。核心原因在于金刚石凭借高 热导率和热匹配优势逐步成为AI算力散热核心，该技术从实验室走向量产，产业化 提速，国内企业拥有产业一体化优势，将充分受益。核心公司：国机精工、黄河旋 风、力量钻石、惠丰钻石、沃尔德、四方达等。 2、氟材料：3M宣布将在2025年底退出所有PFAS生产，全球半导体冷却液供 给面临重构；英伟达新一代平台进入全液冷时代，浸没式方案所用冷却液正是氟化 液，国内需求预计快速增长。含氟聚合物与六氟化钨等含氟电子化学品同步切入AI 硬件，供需两端有望持续受益。核心公司：巨化股份、永和股份、昊华科技、中船 特气、中巨芯、东岳集团。 3、油运重估：截至9月25日，克拉克森评估VLCC-TCE录得59万美元/天，创 历史新高。柴油高裂解价差有望延续，驱动套利需求活跃，叠加海运底层逻辑转向 安全优先，油运有望进入趋势性单边市场，运费持续性可期。核心公司：中远海 能、招商轮船、海通发展、海丰国际、中谷物流、中国船舶。 4、建材前瞻：申万宏源研报指出，建材板块26Q3景气显著分化。玻纤普通电 子布提价节奏较上半年进一步加速、特种布紧缺持续，构成板块业绩最强线。消费 建材面临地产需求下行与原油链成本高压的双重挤压，依靠强α个股对冲。水泥与 平板玻璃仍处周期底部，但水泥9月以来价格修复、光伏玻璃价格已现改善趋势。 关注中国巨石、国际复材、宏和科技等。 正文： 2026年以来，金刚石散热领域催化密集、产业化提速。朗读 全屏 手机 浏览 保存 设置 帮助 退出 年初CES上，英伟达宣布下一代VeraRubin架构GPU将采用“金刚石铜复合散 热盖+液冷”方案； 2月，金刚石散热技术先驱AkashSystems向印度NxtGenAI交付全球首批搭载 金刚石冷却技术的英伟达H200GPU服务器，3月，又推出全球首款金刚石冷却AM DInstinctMI350X的AI服务器，可在24℃环境下，实现22%的单位功耗算力（FLO Ps/Watt）提升，在50℃环境温度下实现token吞吐量15%的提升； 6月，英特尔CEO陈立武公开投资人造金刚石晶圆公司，将金刚石与氮化镓、 碳化硅并列纳入下一代半导体材料战略。 英伟达、英特尔、AMD三大芯片巨头已全部入局金刚石散热，推动该技术从实 验室走向量产，并成为物料清单（BOM）中的关键一环。 金刚石热导率达2000-2200W/(m·K)，是铜的5-6倍，且热膨胀系数仅约1.0-1. 1ppm/K，与硅的失配比铜小一个数量级，同时兼具电绝缘与低介电常数。 随着3nm及更先进制程芯片的商业化部署，MACs和张量加速器以峰值性能运 行将导致局部热流密度远超1000W/cm²，此时传统铜近端扩热能力基本失效，因 此金刚石散热正从可选方案升级为必选项。 目前金刚石散热材料形成三条差异化技术路径。 ①金刚石铜复合材料是将金刚石微粉与铜粉通过熔渗或烧结工艺复合而成的金 属基复合材料，热导率约600-800W/(m·K)，为纯铜的2倍左右，优势在于热膨胀系 数可调，成本可控、可制备大尺寸异形件，劣势是热导率上限低于纯金刚石，该路 线是商业化落地最快的品类，英伟达宣布的下一代GPU散热方案即采用该材料，国 机精工的产品年内有望实现小批量订单商业化落地。 ②纯CVD多 晶金刚石是以MPCVD工 艺在硅或钼基底上异质成核生长而成的纯 金刚石片，热导率约1200-2000W/(m·K)，绝缘性和热稳定性优异，核心难点在于 大尺寸生长过程中的翘曲控制和杂质管控；国内公司已实现4-8英寸量产，预计1-3 年逐步走向成熟，主要面向GPU散热、半导体激光器、光模块等高端场景； ③单晶金刚石是具有完整单一晶格结构、无晶界的纯金刚石材料，热导率最高 可达2000-2200W/(m·K)，热膨胀系数仅1.1ppm/K，接近硅基芯片的热匹配需 求。但其量产尺寸普遍在2-3英寸以内，8英寸仅处于研发阶段，生长效率低且原材 料与设备成本高，目前主要用于军工航天相控阵T/R组件、高端射频GaN器件等场 景，未来市场空间广阔。 全球AI算力竞赛驱动高端散热需求增长，金刚石散热材料正从技术验证迈向小 批量商业化。 由于电费、人工等方面的成本优势，金刚石产能集中在中国，并于河南形成产 业集群，因此国内公司从培育钻石切换至金刚石散热材料等的生产加工的迁移成本 相对小，且凭借产业链一体化布局、产业集群协同等优势有望抢占先机，充分受 益。 天风证券指出，AI风起正在为氟材料打开多个新产业入口。3M宣布将退出所 有PFAS生产，全球半导体冷却液供给面临重构；英伟达新一代平台全面转向液冷， 含氟聚合物与含氟电子化学品同步切入AI硬件。巨化股份、永和股份、昊华科技、 中船特气、中巨芯、东岳集团等国内企业已在多条赛道完成卡位。 氟化液是浸没式液冷的核心冷却介质。2022年3月，3M位于比利时的工厂涉及 PFAS的生产线被无限期关闭，2022年12月公司宣布将在2025年底退出所有PFAS 生产。3M在全球半导体冷却液市场的占有率为90%，其比利时工厂所产冷却液占 全球总产量的80%。龙头退出留下供给缺口，为国内氟化液企业放量带来机会。 液冷的导入由功率密度推动。当单机柜功率达到20KW以上，风冷便难以满足 散热需求，液冷成为数据中心散热的必然选择；浸没式液冷将服务器整体浸入冷却 液，所用的冷却液通常为氟化液。 英伟达在2026年CES上发布Vera Rubin平台，数据中心从风冷为主、液冷为辅 的过渡期，正式进入100%全液冷的工业化成熟期；受超高功耗AI芯片驱动，Rubin 平台单机架散热组件价值突破7.2万美元。我国氟化液需求量2023年约为0.57万 吨，预计2026年将增长至约3.08万吨。供给缺口与需求放量形成共振，氟化液是本 轮AI材料中供需两端同时受益的品种。 AI服务器向更高算力、更高速互联演进，传统覆铜板在低损耗与高频性能上遭 遇挑战。PTFE基覆铜板凭借约2.1的介电常数，显著优于传统PPO树脂的约3.0，成 为M9/M10级高频高速PCB核 心基材的重要备选。 FEP具备优异的高频低介电特性、高电气绝缘性与稳定的加工性能，是数据中 心高速铜缆的绝缘材料之一；在高速通信线缆的绝缘挤出中，以FEP等胶料进行物 理发泡，可进一步压低绝缘层的介电常数。信号跑得更快还不发烧，是这类材料共 同的卖点。 PFA方面，半导体级管件、接头、阀门广泛应用于晶圆处理、气体输送与洁净 室系统，全球半导体级PFA市场正稳步扩容。FFKM密封件则是刻蚀、沉积腔体与真 空系统的关键耗材，半导体目前在其全球销售额中占比接近一半，预计2032年将提 升至过半。 图片加载中… 2025年12月，商务部、海关总署将含金属钨的粉末等钨资源纳入2026年度两 用物项和技术进出口许可证管理目录。中国掌控全球约八成的钨矿供给，随着管制 落地，今年2至6月我国对日钨粉出口已实质性归零，或对日本关东电化、中央硝子 的六氟化钨产能造成影响。 六氟化钨是大规模集成电路化学气相沉积工艺的关键原料，作为存储芯片制造 的关键耗材，其需求与3D NAND堆 叠层数直接正相关。2026年上半年我国六氟化 钨出口256吨，同比增长25%。海外供给受限叠加出口放量，六氟化钨供需趋于紧 张。 图片加载中… 相关公司 巨化股份：PTFE、PVDF、PFA、FEP、氟化液多点布局，1万吨高纯PFA装置2 026年5月投产并批量供应，经半导体客户验证达到半导体级要求； 永和股份：3000吨高纯PFA产线2025年10月进入试生产，同时布局氟化液与F EP产能； 昊华科技：PTFE产能5.1万吨居国内前列，规划PFA产能500吨/年，六氟化钨 与六氟丁二烯均有落子； 中船特气：六氟化钨现有产能2000吨，另有六氟丁二烯产能，含氟电子化学品 平台型选手； 中巨芯：电子级氢氟酸产能2.4万吨，并与中央硝子合资布局六氟化钨； 东岳集团：PTFE产能5.5万吨居国内首位，FFKM已有产品落地； 三美股份：通过联营企业持有2万吨电子级氢氟酸产能，氟化工传统主业扎 实。 图片加载中… 长江证券指出，VLCC-TCE创历史新高只是序章，运费持续性可期。本周克拉 克森评估VLCC-TCE录得59万美元/天，柴油高裂解价差有望延续，套利需求活跃， “国油国运”体系下国内龙头稳健兑现高景气。看好中远海能、招商轮船、海通发 展、海丰国际、中谷物流、中国船舶。 VLCC跑一天船的收益升至历史罕见水平，克拉克森评估的VLCC-TCE继续刷新 纪录。分航线看，阿曼至远东航线录得79万美元/天，西非至中国为52万美元/天， 美湾至中国为40万美元/天，长航线全面走高。期租市场同步跟进，VLCC一年期期 租租金录得22万美元/天，船东高收益的确定性被拉长到全年。 运价上行的核心驱动有二：一是VLCC效率损失严重，有效运力被动收缩；二是 高裂解价差驱动的套利需求活跃，货盘持续涌入市场。两者共同支撑本轮运价中枢 上移。 图片加载中… 以史为鉴，下游产业链高利润往往驱动贸易需求，下游景气外溢时，客户愿意 为海运支付更高运费。复盘2007-2008年干散货海运周期，中国城镇化带动大宗商 品繁荣并驱动贸易活跃，期间铁矿石海运费占钢铁行业盈利约20-23%，最高达到1 08%；拉长到2007-2026年的完整周期看，这一比值仅为7%。 第一，海运费占货值比例长期较低，但具备较高弹性；第二，海运在全球贸易 中的不可替代性，往往在产业链景气上行期转化为更强的议价能力。 映射到当下，2026年初至今原油海运费占裂解价差的比值约25%，最高也不过 60%。对照上一轮周期运费占比一度超过行业盈利本身的极值，当前运费在下游利 润中的占比仍是零头。炼厂卖柴油的利润高到愿意跨洋买油，贸易需求被高利润点 燃，景气外溢才刚刚开始。 柴油高裂解价差的持续性有三重支撑：其一，俄罗斯受俄乌冲突影响限制柴油 出口，2025年俄罗斯柴油供应占全球11%，缺口需要其他地区补足；其二，美国炼 厂开工率高企至96.5%，但国内柴油供应紧张，存在限制出口的可能性；其三，北 半球迎来农业生产柴油消费旺季。 裂解价差居高不下，意味着炼油环节利润丰厚，贸易商有动力把原油和成品货 盘在中东、美湾与远东之间来回搬运，VLCC正是这条套利链上的运力载体。多因素 共振下，柴油高裂解价差有望延续，驱动套利需求活跃，为原油海运需求提供持续 增量。 图片加载中… 更深层的逻辑在于，海运的底层逻辑正从效率优先转为安全优先。油运的效率 损失不可逆，有效运力收缩后难以回补，这正是“效率脱钩牛”的底层逻辑。 在“国油国运”保障体系下，国内龙头油运企业具备稳健兑现高景气的能力， 预计在地缘风险及供需格局未见缓解之前，油运进入趋势性单边市场。 相关公司 中远海能：油运龙头，VLCC船队规模领先，高景气兑现的直接受益者； 招商轮船：油运核心标的，油散双轮布局，稳健兑现行业高景气； 海通发展：干散货运力持续扩张，受益厄尔尼诺催化下的散运布局窗口； 海丰国际：亚洲区域内集运龙头，近洋航线 25", "source_label": "银河证券", "excerpt": "公司 深度 报告 · 通信 行业 www.chinastock.com.cn", "content": "公司 深度 报告 · 通信 行业 www.chinastock.com.cn 证券研究报告 请务必阅读正文最后的中国银河证券股份有限公司免责声明 1 高速交换机蓄势起航，智算网络业务放量 ——锐捷网络 （301165.SZ）首次覆盖报告 2026年09月25日 ⚫ 锐捷网络：稳固网络基本盘，发力智算新赛道 。公司是行业领先的 ICT 基 础设施及解决方案提供商， 主营业务为网络设备、 网络安全产品及云桌面解决 方案的研发、设计和销售。 2026H1 锐捷 网络 实现营业 收 入 88.32 亿元 ，同 比增长 32.83% ；实 现归母 净利润 6.94 亿元， 同比增 长 53.54% 。在交换设 备方面，公司已经形成覆盖 400G 、800G 及更高速率的数据中心交换产品布 局，可面向大模型训练、推理和高性能计算场景，为智算集群提供高带宽、低 时延的数据传输通道。 ⚫ 全球算力需求高涨，国内政策赋能数智 。全球科技 巨头 CAPEX 高增， AI 算力基础设施建设 加速 。四家全球科技巨头 2026 年资本开支总额预计超 7000 亿美元， 同比增幅 80% 以上。 在需求端， AI驱动的云业务收入持续高增。 2026 年第二季度，谷歌云收入同比增长 82% ，微软 Azure 同比增长 43% ，亚马逊 AWS 同比增长 37% ， 云业务已成为各巨头 AI投资回报的核心兑现渠道。 2026 年上半年配套政策密集落地，形成覆盖技术底座、产业融合、消费场景、资金 支持的全方位政策组合 ，持 续带动网络基础设 施升级需 求 。2026 年6月，工 业和信息化部印发《 “人工智能 +信息通信 ”创新发展实施意见（ 2026 —2028 年）》，明确提出加强高端光电芯片和器件、高速转发 /交换芯片 等， 加快建设 400Gbps/800Gbps 骨干传输网络、构建城域毫秒级低时延入算能力。 ⚫ 核心业务构筑优势，行业赛道多点突破 。交换机产品 市 占靠前，行业竞争 优 势持续凸显 ：根据 IDC 数据统计， 2026 年第一季度，公司在中国以太光网络 市场占有率排名第一， 中国以太网交换机市场占有率排名第三 。持续开 拓智算 市场，落地多行 业场景赋能 ：在企业级市场， 公司极简以太彩光入室累计超过 40万间 ，极简以太全光方案 升级 教育、医疗、能源、制造等行业客户园区网 。 制造业领域，公司已服务近 50% 的中国 500 强企业、覆盖 21个细分领域 。 ⚫ 投资建议： 预计 2026 -2028 年公司 营业收入分别 为200.22/266.60/354.50 亿 元， 同比增速 39.9%/33. 2%/3 3.0%；归母净利润分别为 17.51/24.26/32.51 亿 元，同比增速 151.5%/38.5%/34.0% 。我们认为公司传统网络业务构筑稳固基 本盘，自研产品矩阵与全行业客户资源构筑较强竞争壁垒 ，多赛道市占位居国 内前列 ；高速 数 据 中心 交 换机 等充 分 受益 云 厂 商资 本 开支 扩 张 与 国内 政 策 红 利；海外市场快速拓展，成长弹性充足。首次覆盖，给予 “推荐 ” 评级。 ⚫ 风险提示： 产品需求不及预期的风险；研发速度不及预期的风险；海外业务拓 展不及预期的风险；行业竞争加剧的风险 等。 主要财务指标预测 2025A 2026E 2027E 2028E 营业 总收入 (亿元 ) 143.16 200.22 266.60 354.50 收入增长率 22.4% 39.9% 33.2% 33.0% 归母净利润（亿元） 6.96 17.51 24.26 32.51 利润增速 21.3% 151.5% 38.5% 34.0% 毛利率 35.5% 36.1% 36.5% 36.6% 摊薄 EPS( 元) 0.63 1.57 2.18 2.92 PE 178.64 71.03 51.28 38.26 资料来源： Wind ，中国银河证券研究院 核心观点 锐捷网络 （股票代码： 301165 ） 推荐 首次评级 分析师 赵良毕 ：zhaoliangbi_yj@chinastock.com.cn 分析师登记编码： S0130522030003 市场数据 2026 年09月24日 股票代码 301165 A股收盘价 (元) 111.70 上证指数 3,888.37 总股本 (万股 ) 111,364 实际流通 A股(万股 ) 111,364 流通 A股市值 (亿元 ) 1,244 相对沪深 300 表现图 资料 客户进展：当前核心在于解决高端GPUCPU光通信芯片进结散热，#当前某客户中试验证顺利。部分厂商芯片流片已完成，当前处于模组测试阶段，2026年四季度预计小批量量产，量产前预计会有招标流程，2027年Q2正式起量；配置方式为每颗计算die对应一片热沉片。 C2W方案：将厚度约7-800微米的裸die削薄约3-400微米后，贴装金刚石片键合/金属化低温焊接，整体厚度与原有裸die尺寸一致，不影响后续封装流程。#大陆厂商多尝试该方案，和公司合作最深入的客户预计Q4开始量产。 W2W方案：4-12英寸金刚石散热晶圆形态，设备自主研发，目前与台湾多家晶圆代工/封测厂合作、送样验证顺利，国内芯片设计公司也开始验证散热晶圆方案。 #芯片内封装验证结果：金刚石作为内嵌近结扩热片背面，常温活化直接键合SAB，实现硅-金刚石原子级结合，Die+金刚石叠层总高与HBM齐平，不影响原来封装体系，兼顾极致散热+成熟封装量产能力。 #产能准备：目前设备已经可满足客户几十万片级别的需求，基于产业和领先的客户进展信心，27年预计新增MPCVD设备至2000台，为行业内最多。 #核心壁垒：（1）生长设备并非行业的单一环节壁垒。后续键合环节需要原子级的抛光，半导体级别的精密加工能力尤为关键，包括研磨、抛光、检测环节。（2）金刚石热沉片属于需要和芯片设计厂联合开发的定制化产品，要按图交付。CVD 金刚石加工到微米级公差、纳米级表面粗糙度，还要严格控制表面的微纳米级缺陷，本身就需要专门的装备与长期的技术和经验积累。同样的材料、同一张图纸交给两家工厂，加工能力不同，交回来的往往是两件不完全一样的东西：看起来可能一样，测量部分参数也一样，但用起来就是不一样。（3）稳定、高品质、量产交付的单晶/多晶金刚石良率、可复制的物理特性。 #最终实现的是金刚石散热部件交付系统内的功能。而非生长出毛坯金刚石片或简单加工后的制品，附加值来自材料、结构设计、界面处理、加工制造工艺、验证与可靠性等多方面能力的叠加，导入周期长，一旦导入后，客户切换供应商成本极高。#文字观点", "publish_time": "2026-09-28 13:16", "tags": ["客户进展", "当前核心在于解决高端GPU", "文字观点"]}, "post:2026-09-28T09-01:4462bfd139d4": {"id": "post:2026-09-28T09-01:4462bfd139d4", "kind": "post", "title": "2026-09-28 09:01", "source_label": "帖子正文", "excerpt": "晨会观点0928 一、🔥CPU-载板：#兴森科技#PCB高密化趋势下的弹性标的，PCB高密化的演进是未来PCB投资最值得关注的趋势。未来数年CoWoS产能分配有望因Agent而逐步向CPU倾斜，#CPU载板需求弹性显著放大。", "content": "晨会观点0928 一、🔥CPU-载板：#兴森科技#PCB高密化趋势下的弹性标的，PCB高密化的演进是未来PCB投资最值得关注的趋势。未来数年CoWoS产能分配有望因Agent而逐步向CPU倾斜，#CPU载板需求弹性显著放大。国产算力带来的ABF载板产能转移有望贡献较大的利润弹性，bt载板伴随存储放量开始释放利润，同时公司作为具有载板能力的企业在Msap工艺上的积累将使其在光模块PCB中有较大程度的能力优势。往后看#oam内埋电容板有望进一步升级提高单平均价。 二、🔥Vicor大涨-VPD模块配套龙头：#中富电路坚定看600e+，#Vicor的专利授权有望进一步强化VPD技术路线海内外共识度，本次专利的授权将VPD 从传统的 ''可选方案'' 变成 ''授权后准入的合规方案''，这对VPD技术路线整体的渗透率将会是一个比较大程度的推进。接下来的核心成长叙事在于NV首次使用模块化供电带来的新增从1-10市场空间。 三、#长盈通：保偏光纤核心标的、强调弹性大/格局优/进展好，【空间测算】当保偏需求为10/20/50/100万芯公里、假设一定价格、份额和净利率水平、测算公司相关利润规模约为9/16/35/70亿。 #航发科技：商发核心弹性标的。【空间测算：看250-300亿】2026年收入规划45.53亿，展望十五五末期主业30亿，给3倍PS对应90亿；外贸20亿元（含燃机），净利率15%，对应3亿利润，给20倍PE看60亿；商发40-50亿，给10%净利率，5个亿利润，看150亿，合计300亿。 四、机械周观点更新：机器人迎来批量订单，玻璃基板产业催化不断 1.#船舶。马士基官宣26艘18600TEU级LNG双燃料集装箱船订单，计划29-30年交付，其中恒力重工承接20艘、保留12艘备选船；新时代造船承接6艘。这也是马士基与恒力重工首次合作，单船造价在1.93亿‑1.95亿美元。同时，松发4号船坞建造的五艘巨轮同时出坞，坞期仅不到80天，交付超预期带来业绩潜在超预期。vlcc运价再创新高、油轮市场迎来主升浪。 当前全球船厂排期超过2008年，#行业供需失衡加剧是驱动船价上行的最核心因素。看好松发股份、中国船舶、中国动力。 2.#玻璃基板。近期产业催化不断，NV要求日韩台湾制造商在2年内完成玻璃基板开发；LPKF收到亚洲头部厂商意向订单，用于玻璃基板扩产，客户即将建设其首条玻璃基板量产工厂，而LPKF考虑融资扩产；京东方试验线已于26H1实现自动化设备通线，设计产能1000片/月；友达光电董事会已批准约2.73亿美元的capex，用于TGV、RDL和玻璃基板中试生产线。 行业逐步形成了玻璃作为终极材料的共识，#未来一年内的催化会持续不断。推荐帝尔激光、微导纳米、汇成真空、长信科技等。 3.#人形机器人。Tesla本周在国内供应商处审核产能，近期爬产速度大幅提升、提前确认产能保障，预计年底达到周产2500台产能。机器人板块已近一年没有行情，交易拥挤度极低、交易量降至冰点水位。优先推荐T链核心公司：恒立、科达利、荣泰、斯菱、北特等，以及供应链最大公约数绿的谐波、奥比中光。 4.#半导体设备。逻辑方面，昇腾960DT预计27Q1推出，提前三个季度；960PR预计27Q3发布，提前一个季度。存储方面，长鑫新的扩产框架订单正在逐步落地，长存三期下一批设备有望下单、晋华扩产超预期，拓荆、华海清科等半导体设备厂商陆续上修全年订单预期。 #正如我们从上半年开始就在路演反复强调的：伴随着两存订单的陆续落地，设备板块后续会持续上修订单预期。核心推荐长川科技、强一股份、华峰测控、精智达、精测电子、金海通等。 5.#光通信设备。华为发布自研NPO光引擎Hi-ONE，单引擎7.2T，是业界首个量产NPO产品、最大传输能力NPO、唯一内置光源NPO，5500个Hi-ONE替代4.8万颗800G光模块；科瑞技术推出7.5亿定增，主要面向半导体及光通信领域，设计产值10.5亿元。 近两年行业的产能将有10倍级增长，叠加产品升级，光模块设备市场将从百亿级别迈向千亿级别。#光通信设备将成为业绩最强的板块之一。推荐联讯仪器、罗博特科、华兴源创、华盛昌等。#文字观点", "publish_time": "2026-09-28 09:01", "tags": ["兴森科技", "中富电路", "文字观点"]}, "attachment:files/0928 强势脱水.pdf": {"id": "attachment:files/0928 强势脱水.pdf", "kind": "attachment", "title": "0928 强势脱水", "source_label": "其他", "excerpt": "0928强 势股脱水 | AI拍的电影真的要上映了 xuangut ong.com.cn 2026/09/28 17:21 本文是对当日大涨公司进行研报深度复盘，相关个股信息仅供参考，不构成投 资建议。（1）大涨题材：玻璃基板 媒体报道称，英伟达正联合产业链企业推进新一代玻璃基板技术落地，“若技 术实现突破，玻璃基板有望支持更大规模的HBM集成，为下一代GP", "content": "0928强 势股脱水 | AI拍的电影真的要上映了 xuangut ong.com.cn 2026/09/28 17:21 本文是对当日大涨公司进行研报深度复盘，相关个股信息仅供参考，不构成投 资建议。 （1）大涨题材：玻璃基板 媒体报道称，英伟达正联合产业链企业推进新一代玻璃基板技术落地，“若技 术实现突破，玻璃基板有望支持更大规模的HBM集成，为下一代GPU提升封装密度 和数据传输能力。” 此外，韩媒也表示，中国在玻璃基板商业化进程上正全面超越韩国，已先行搭 建产线、产出样品并交由客户测试，商业化节奏明显更快。 资料显示，玻璃基板平整度和强度更高，热膨胀系数更低，高温下形变更小， 且介电特性良好、信号损耗较低，有望部分甚至完全替代硅中介层，在同一封装中 容纳更多芯片与HBM。 行情上，金辰股份等今日涨停。 （2）研报深度复盘（华创证券、国联民生）：材料级解法 图片加载中…朗读 全屏 手机 浏览 保存 设置 帮助 退出 ①有机载板在大尺寸下受热稳定性、平整度和尺寸稳定性约束，增厚芯层压制 翘曲又会妨碍贯穿孔继续微缩，封装面积扩大后热膨胀失配、铜分布不对称和树脂 固化应力在更长尺度上累积。玻璃从材料层面给出解法：热膨胀系数可在3~9pp m/K之间调节、与硅芯片高度匹配，大尺寸封装翘曲量可控制在50μm以内，支持5 10×515mm超大面板，封装效率是12寸晶圆的4-8倍；电性能上损耗因子比硅低数 个数量级，信号传输速率提升3.5倍、功耗降低50%。 ②玻璃基板核心封装工艺包括精加工、TGV通孔、金属化/电镀填孔和RDL布线 四大环节，壁垒不在单点成孔而在全流程协同。原片端，组分调控与量产良率构成 重要进入壁垒，全球TGV玻璃原片由康宁、AGC旭硝子、肖特主导；成孔端，LIDE 路线通孔最小10μm、最高深宽比达1:50、每秒可形成数千个通孔，被视为大规模 生产主流方案；金属化端，玻璃表面能低、缺乏活性官能团，种子层附着力、高深 宽比无空洞填铜及微米级布线均匀性是三大难点。 ③Yole预计全球先进封装市场2030年将增至794亿美元以上，高端性能封装为 主要增长引擎；存储是半导体制造用玻璃增长最快的细分，2025-2030年复合增速 约33%、HBM为主要驱动力。SEMI预计玻璃芯基板2028年前后进入初步量产，面 板级封装进一步强化玻璃的大尺寸优势，国内企业已围绕玻璃原片、TGV加工及AO I检测等关键环节进入送样测试阶段。 （1）大涨题材：新能源汽车 此前华为与问界“分手”引发关注，今日余承东表示，未来鸿蒙智行将分出更 多的资源与精力进一步强化尊界、享界、智界和尚界的投入。 江淮汽车此前与华为合作打造了国产百万豪车尊界S800，今年发布了MPV车 型V800，大型超豪华SUV预计明年初上市，将形成“轿车+MPV+SUV”矩阵。 另外有市场传闻称，Stellantis、华为、江淮汽车三方合作，玛莎拉蒂电动车型 或将使用鸿蒙智行平台。 行情上，公司近期4天3板。 （2）研报深度复盘（华创证券、中信建投）：新车接棒 ①豪华车市场规模较2023年顶峰已明显收缩，部分需求下沉至国产高端车市 场，但竞争格局变化不大，短期有且只有尊界有能力重塑这个市场，为陈旧的外资 豪华车提供新时代中国智能电动车的供给承接，不过需要时间。 ②公司二季度归母净利约-1.4亿元，环比减亏4.6亿元；尊界S800二季度销量0. 2万辆，6月25日S800典藏大观上市定价138.8万元、对标迈巴赫S级，8月5日两款 MPV上市，24小时大定突破3500台、优于S800同期表现，尊界由单一车型走向轿 车加MPV的多产品矩阵；往后S800系列、V800/V680及SUV等多款车型总销量有 望达到7万辆以上。 ③二季度投资收益0.68亿元，实现2024年以来首次季度转正，大众安徽长投包 袱基本解除；碳酸锂、钢铝等大宗价格企稳，原材料上涨影响已在二季度充分反 映，三季度起成本端企稳，规模效应对单车利润的拉动将更加显著，后续利润释放 可见度高。 图片加载中… （1）大涨题材：影视 公司宣布，首部AI超写实院线电影《三星堆：未来往事》定档10月23日登陆全 国院线。 此外又一电影大档期国庆档即将到来，数据显示，想看累计TOP4依次为《神 探之痕迹》《什么意思夫妇》《小猪佩奇·完美假期》《重生2》。其中《神探之痕 迹》由陈思诚编剧执导，《什么意思夫妇》定位家庭喜剧等，不过整体阵容确实是 近几年最弱。 行情上，公司今日涨停。 （2）研报深度复盘（国海证券、太平洋证券）：轻装上阵 ①AI原生电影《三星堆：未来往事》已通过国家电影局内容审查并取得龙标， 中国电影工业化与AI技术深度融合迈入全新里程碑。2025年公司AI影视剧业务实现 营收239万元，已储备4部AI电影项目，改编自《聊斋志异》的动画《中华志怪之罗 图片加载中… 刹海市》已立项公示，《计划外：广寒行动》《东风必达》正在立项备案；自研 “博卡电影云片场”“博乐一键AI短剧”应用工具已面向创作者开放使用。 ②2026年一季度公司归母净利润亏损4,427万元，较去年同期9.55亿元大幅收 窄，主要系无主投电影上映、结转成本及计提库存影片减值减少；2024、2025年 公司分别计提资产减值损失4.03亿元和4.55亿元，包袱出清后有望轻装上阵。 ③《克什米尔公主号》《她杀》《蛮荒禁地》等影片已进入后期制作阶段，有 望2026年起陆续释放；剧集储备《决战香江》《苍茫天歌》《中国战机》等剧本已 创作完成、计划2026年开拍，机构预计公司未来数年营收和净利润将保持较高增 长。 研报来源 华创证券，孙维容，S0360526020001，玻璃基板，从材料替代到产业落地， 下一代先进封装载板产业化渐行渐近。2026年9月24日 国联民生，薛宏伟，S0590526060002，电子行业事件点评：玻璃基板有望迎 来新催化，AI算力驱动下一代先进封装变革。2026年8月31日 华创证券，张程航，S0360519070003，江淮汽车-600418-2026年中报点 评：2Q26减亏，尊界MPV上市有望增强下半年表现。2026年9月7日 中信建投，程似骐，S1440520070001，江淮汽车-600418 到什么利空值得跌那么狠，失望盘缴械投降？虽然9月加息落地，海内外市场风险偏好明显修复，但从结构上也看出资金没有多少共识，盘面轮动为主。", "content": "【本周策略观点0928】 1、中秋节假期消息偏中性，市场情绪还是被海外宏观牵着走，上周四没看到什么利空值得跌那么狠，失望盘缴械投降？虽然9月加息落地，海内外市场风险偏好明显修复，但从结构上也看出资金没有多少共识，盘面轮动为主。随着美国PMI数据超预期，美联储官员频频放鹰，加上美伊冲突解决进度不明朗，油价上下波动较大，美债收益率继续攀升，全球风险偏好明显承压。假期中美元首会晤通稿似乎没有太多新亮点，伊朗提出重开海峡的提议被特朗普强硬拒绝，都将短期继续打压情绪，预期资金在国庆节前还是会倾向于观望，本周三天交易可能相对寡淡。 2、产业层面AI下游应用进展有加速迹象，上周纳指创新高，新模型能力和成本继续改善，AI正在从办公扩展到科研和个人用户场景，从过往2年多的经验看，国内双创比海外科技往往启动较晚，持续时间更短，但不会不来，有时候上涨斜率和速率都更高，就和去年四季度一样。上周有Muse带来的情绪传递，参考年初小龙虾的发酵进度，后续观察有没有更多实际进展和数据来帮助达成共识。假期AI应用层面利好落地变得密集，还有一些硬件和新技术的催化，纳指的表现，也说明了对产业趋势可以更积极点。 3、技术上目前还在低波的区间，虽然周五又跌回3888，但是距离前期3850附近的支撑也挺近，没有什么系统性风险，外往下其实从结构上会更有利于构筑更稳定的底部结构。本周市场还有节日效应的影响，不会一蹴而就，但是随着时间的推移，宏观问题会逐步明朗，对情绪的扰动也会减弱，到年底预期还有两次元首会晤，进入10月应该是比较重要的窗口期，一些没有达标的机构也会积极把握。操作上最简单的还是逢低吸筹宽基，小而新，科创100ETF，科创200ETF，科创综指ETF。 4、前途还算光明，但是道路又无比曲折，科创半导体设备ETF 韧性还是挺好，全周角度来看可圈可点，创业板算力ETF也是趁调整机会，很多资金做了申购，究竟是持股还是持币，需要观察今天明天的情况，整体倾向于更积极点。港股通创新药ETF和恒生生物科技ETF 都对催化反馈挺好，但也需要回踩巩固下。 （仅供内部参考，不做投资建议，基金投资需谨慎）#文字观点", "publish_time": "2026-09-28 09:00", "tags": ["文字观点"]}, "post:2026-09-28T21-55:ee06525ae3e4": {"id": "post:2026-09-28T21-55:ee06525ae3e4", "kind": "post", "title": "2026-09-28 21:55", "source_label": "帖子正文", "excerpt": "今天美股期货也走低，然后晚上炸出一条比较重要的消息——英伟达那边公告，要新增1500亿美刀的回购额度，然后股价盘前拉升。英伟达本来就有850亿美刀左右的回购授权额度没用完，这回新增后，相当于手上有2300多亿的子弹，随时可以出手，而且主要都是用来注销的。", "content": "今天美股期货也走低，然后晚上炸出一条比较重要的消息——英伟达那边公告，要新增1500亿美刀的回购额度，然后股价盘前拉升。 英伟达本来就有850亿美刀左右的回购授权额度没用完，这回新增后，相当于手上有2300多亿的子弹，随时可以出手，而且主要都是用来注销的。 1500亿是什么概念呢？英伟达最新季度的净利润是550亿左右，相当于准备拿出接近3个季度赚的钱，做回购，这个背景，多少有点「救市」的味道，一方面英伟达自己的远期市盈率在这轮的最低区间，另一方面整个宏观环境也不太友好。 作为对比，A股的公募第一大重仓，中际，之前宣布回购40-80亿（还不是注销回购），实际回购了50亿就宣布结束了，而其单季度净利润是80亿，相当于就花了两个月不到的净利润。 与此同时，中际还从港股融资了500多亿......#文字观点", "publish_time": "2026-09-28 21:55", "tags": ["文字观点"]}, "attachment:files/0927早知道.pdf": {"id": "attachment:files/0927早知道.pdf", "kind": "attachment", "title": "0927早知道", "source_label": "其他", "excerpt": "天风策略｜政策与大类资产配置周观察20260928 要点总结 1.高技术制造与产业政策持续加码：2026年6月高技术增加值同比增速一度达17%，先进制造业被 定位为重要战略任务；国常会审议通过《中医药传 铜、铝、锡、铅、锌等算力 金属需求持续升温。 区域政策落地：铜陵正式发布算力金属发展八大行动，成立由本地企业、算力应用端企业、金属新材料 企业、高校及行业企业共同参与的算力金属合作联盟，并举办算力金属产业链协同发展座谈会及招商对 接会，为产业链上下游协同创新与资源整合搭建平台。 香港黄金生态圈建设首个五年规划：李家超发布香港首个五年规划，以黄金为切入点构建大宗商品交易 生态圈，推动黄金交易相关清算系统、存储、供给和基础建设大协同发展。 发展路径：长远对标国际主要黄金交易中心，实现软硬件双轨并行，全面提升香港黄金仓储量及精炼能 力，构建一体化黄金生态圈，发挥黄金战略资产作用。 总量配置研判中期政策节奏：预计我国将落实落细更加积极的财政政策和适度宽松的货币政策，以我为 主应对后期通胀不确定性及海外地缘政治风险升级的潜在影响，为“十五五”开好局。 短期核心变量：9月底美国二季度GDP终值与国庆期间美国9月非农数据，将决定美联储10月是否再 度加息；总书记此前已就发展新兴制造业作出重要指示，8000亿元新兴制造型工业加快投放。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "attachment:files/A股与港股复盘20260928.pdf": {"id": "attachment:files/A股与港股复盘20260928.pdf", "kind": "attachment", "title": "A股与港股复盘20260928", "source_label": "其他", "excerpt": "A股与港股复盘 2026年9月28日 研究笔记 · 不构成投资建议 第 1 / 11 页 股票市场复盘 恒指逆市收涨，光通信两地重挫；中国研究稳经济、楼市政策 2026年9月28日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。", "content": "A股与港股复盘 2026年9月28日 研究笔记 · 不构成投资建议 第 1 / 11 页 股票市场复盘 恒指逆市收涨，光通信两地重挫；中国研究稳经济、楼市政策 2026年9月28日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 有报导称中国可能放行采购英伟达芯片，同时美方拟对相关外国企业新增制裁。这一组合冲击了国产芯片自主可控叙事，A股光模块与半导体股全线重挫，港股光通信股暴跌。但港股权重股扛住压力，恒指逆市收涨，两地分化明显。尽管如此，盘后彭博社援引新华社消息报道，称中国正在研究稳经济和楼市的政策，包括利用好地方发债剩余额度、调整货币政策、为科技创新和农业再贷款等措施。同时，中美互免价值600亿美元商品的关税。扭腰时报称美伊谈判仍在进行，美股开盘收复部分失地。 中国或重新放行英伟达芯片采购、美方同时拟对相关外国企业新增制裁的报导，直接命中过去两年被资金追捧的“国产替代”叙事。A股创业板、科创50跌超4%，光模块、半导体股全线重挫，长飞光纤光缆A、H两地分别跌停和暴跌16.6%。港股内银、内房、石油等权重股当天走强，恒指逆市收涨0.54%。同一条消息，两个市场走出完全相反的方向。 本日报要 主线： 有报导称中国监管机构或重新放行阿里巴巴等企业采购英伟达芯片，同时美方拟对相关外国供应商新增制裁。这条消息是当天压垮A股成长股最直接的变量。它直接命中“国产替代”这一过去两年被反复交易的叙事——若国产芯片自主可控的紧迫性被削弱，前期涨幅巨大的光模块、半导体龙头首当其冲。A股创业板指跌4.53%，科创50跌4.06%，为两市当天跌幅最深的宽基。光模块龙头中际旭创、新易盛分别跌9.03%、8.11%，长飞光纤光缆A股（601869）直接跌停（−10.00%）。同一条消息传导到港股，光通信股跌幅更为极端：长飞光纤光缆H股（06869）跌16.62%，中际旭创H股（03308）跌12.21%，剑桥科技跌11.93%，俊知集团跌11.30%。港股内银、内房、石油等权重股当天逆势走强（见第2节），恒指仍收涨0.54%。同一条冲击链条上，A股宽基跟随成长股重挫，港股宽基被金融地产股顶住，两地方向完全相反。 A股： 上证收3,824点，跌1.67%；沪深300跌2.22%；创业板指跌4.53%；科创50跌4.06%。两市（沪+深）成交约1.70万亿元，较前一交易日（9月24日）的1.65万亿元回升约3.0%，属放量下跌，而非缩量出逃。涨跌家数：两市874家上涨、4,298家下跌、115家平盘（Wind统计口径，两市及北交所910家上涨、4,607家下跌）；涨停33家、跌停56家，跌停家数罕见超过涨停家数。 A股与港股复盘 2026年9月28日 研究笔记 · 不构成投资建议 第 2 / 11 页 港股： 恒生指数收24,642.51点，涨0.54%；国企指数涨0.63%；恒生科技指数跌0.37%。恒指成交额1,774.8亿港元。 货币与汇率： 央行今日“三箭齐发”：以固定利率、数量招标方式开展7天期逆回购1,390亿元（中标利率1.40%）、隔夜逆回购6,610亿元，两个期限合计投放1.1万亿元。当日有6,603亿元逆回购到期，公开市场净投放4,397亿元。这是9月28日至10月8日隔夜逆回购操作窗口（每日上限1万亿元）落地的第一天，用于呵护国庆长假前后的跨节资金面。另有6,000亿元1年期MLF到期；9月MLF已于9月24日一次性续做8,000亿元（当月净投放2,000亿元），本次不再单独续作，不构成新增变动。人民币中间价报6.7399，较上一交易日6.7489调升90个基点；在岸即期约6.6986，离岸CNH约6.7132，在岸明显强于中间价与离岸；美元指数报101.12，涨0.15%。 互联互通： 北向成交2,605.0亿元（沪股通1,241.1亿元、深股通1,363.9亿元），较前一交易日的2,325.1亿元回升约12.0%，净额未公布。南向成交753.9亿元，较前一交易日的630.0亿元放大约19.7%，净卖出65.5亿元，由前一交易日的净买入29.0亿元转为净卖出，为三个交易日以来首次转卖（南向资金9月25日休市，上一交易日为9月24日）。 大波动： 内地：长飞光纤光缆（601869.SH）跌停，跌10.00%；中际旭创（300308.SZ）跌9.03%；新易盛（300502.SZ）跌8.11%；寒武纪（688256.SH）跌6.55%。港股：长飞光纤光缆（06869.HK）跌16.62%；中际旭创（03308.HK）跌12.21%；剑桥科技（06166.HK）跌11.93%；俊知集团（01300.HK）跌11.30%；网易（09999.HK）涨4.86%。 技术： 上证指数收在20日布林下轨（约3,841点）下方，跌破50日均线；恒生指数仍处于50/100/200日均线下方，贴近20日布林下轨（详见第1、2节图）。 驱动： 英伟达采购放行传闻叠加美方拟新增制裁，是全天定价的核心变量（见上）。中东局势恶化（伊朗拒绝软化要求、特朗普否决霍尔木兹方案）推升油价，WTI涨3.35%、布伦特涨3.29%，双双重回100美元上方；美债收益率续升，VIX大涨9.55%（见第4节）。央行公开市场净投放4,397亿元，呵护双节资金面（见上）。沪深15:00、港股16:08均已收盘。 外盘 / 商品 / 国债： 美股期货三大指数齐跌，VIX大涨；WTI、布伦特原油同步大涨，重新站上100美元上方；黄金、白银、铜同步下跌；美债收益率全线走高，美中利差走阔（数字见第4节）。 A股与港股复盘 2026年9月28日 研究笔记 · 不构成投资建议 第 3 / 11 页 1. A股 指数 收盘 开 高 低 当日 成交额 上证指数 3,824 3,878 3,878 3,807 −1.7% 8,045.4亿 深证成指 12,859 13,266 13,268 12,801 −3.4% 8,982.6亿 沪深300 4,341 4,424 4,424 4,324 −2.2% 4,286.2亿 创业板指 3,140 3,268 3,271 3,125 −4.5% 4,303.8亿 科创50 1,556 1,611 1,611 1,549 −4.1% 805.9亿 中证500 7,402 7,599 7,601 7,364 −2.9% 2,890.4亿 中证1000 7,294 7,551 7,551 7,247 −3.6% 3,466.0亿 上证50 2,807 2,836 2,836 2,794 −1.3% 1,135.3亿 北证50 1,027 1,057 1,058 1,023 −2.8% 140.5亿 这一节给主线补充结构证据：若今天确为国产芯片自主可控叙事受挫，跌幅应集中在成长股，尤其是芯片和光模块权重高的板块，而非权重股。数据完全对上——创业板指、科创50跌幅（−4.5%、−4.1%）是上证50（−1.3%）的三倍以上，中证1000、深证成指跌幅也都超过3%，跌幅从权重到成长呈明显阶梯状。两市成交约1.70万亿元，比前一交易日放大约3.0%，说明这是资金主动兑现或止损离场，而非缩量观望。涨停33家、跌停56家，跌停家数反超涨停家数；过去两个月行情中，涨停家数通常明显多于跌停家数，今天的结构 基板倒计时全部向上。「撤离的资金」与「上修的产业事实」之间的价差，是复市第一个可验证的结构读数。 3. 玻璃基板的倒计时是「开发」不是「量产」，定价顺序与直觉相反**——英伟达给的是「两年内完成开发、2028 年前落地」，TGV 金属化还有技术难点、客户认证没完成。正确排序是「TGV 设备与药水最先放量 → 玻璃原片国产替代 → 量产兑现最晚」，不是把量产公司排最前。 次日验证（9/28 盘后）： ① 电子行业主力资金净流向 + 沪深成交额；② 美方 300 亿降税品类是否纳入科技出海品类；③ 玻璃基板设备/材料端 vs 量产公司的分化。 本文基于公开信息整理，不构成任何投资建议。数据截至 2026 年 9 月 28 日盘前。#文字观点", "publish_time": "2026-09-28 09:04", "tags": ["文字观点"]}, "attachment:files/兴业证券-中国动力(600482)柴油机订单与交付高增，盈利能力持续提升-260924.pdf": {"id": "attachment:files/兴业证券-中国动力(600482)柴油机订单与交付高增，盈利能力持续提升-260924.pdf", "kind": "attachment", "title": "兴业证券-中国动力(600482)柴油机订单与交付高增，盈利能力持续提升-260924", "source_label": "兴业证券", "excerpt": "谨请参阅尾页重要声明及财通证券股票和行业评级标准 1 一技多金属， AI再进阶 博迁新材 （605376）", "content": "谨请参阅尾页重要声明及财通证券股票和行业评级标准 1 一技多金属， AI再进阶 博迁新材 （605376） 证券研究报告 能源金属 /公司深度研究报告 /2026.09.24 投资评级 :买入（首次） 核心观点 基本数据 2026 -09-23 收盘价（元） 139.15 流通股本 （亿股） 2.62 每股净资产 （元） 6.97 总股本（亿股） 2.62 最近 12月市场表现 分析师 谢哲栋 SAC证书编号： S0160525120005 xiezd@ctsec.com 分析师 张建业 SAC证书编号： S0160526040003 zhangjy03@ctsec.com 联系人 虞佑桢 yuyz0101@ctsec.com 相关报告 ❖ 博迁新材是 高端超细 金属粉体 平台公司， MLC C镍粉全球第二 。公司于 2020年底登陆 A股主板， 2026年6月递交港股上市申请 ，拟新增 320吨镍粉 及1,280吨铜粉产能， 有望强化高端镍粉优势、加快铜粉放量 。2025年公司营 收11.52亿元，同比 +22%，归母净利润 2.19亿元，同比 +151%，AI浪潮推动 高毛利的小粒径镍粉占比提升， 业绩快速修复。 公司以物理气相 冷凝法（PVD） 平台为底座， 形成轻资产 、短周期、可复制的高端电子金属粉体平台， 可跨金 属体系快速地切入其他景气赛道的产品验证。 ❖ 镍粉： AI高景气扩张周期 ，公司放量 +高端占比提升 。AI需求启动 高景 气扩张周期 ，预计 2026年MLCC供给首次出现缺口 ，2027 -28年供需差继续 放大。这轮周期日系头部厂商扩产保守，导致需求溢出，其中超高端供给最紧 缺。对应公司两条逻辑：一是 三星电机超高端 MLCC份额提升 带动公司 80- 120nm超高端产品 占比提升 ；二是普通高容需求溢出由 中国台湾 、中国大陆 厂 商承接，带动整体放量 。我们预计 2027公司镍粉出货 3000-3300吨，同增 约 50%，其中高端占比 升至 10%+，毛利率可升至 45-50%。 ❖ 铜粉：光伏总量持稳， 公司替代逻辑。 2026H1营收 1.92亿元， 同比 +260%。 光伏行业总量进入平台期， 公司成长依赖 “贱金属代银 ”的结构性趋势。 MLCC 需求同步镍粉扩张，国产替代带动公司放量： 铜粉需求与 MLCC出货同步增 长， AI驱动 MLCC扩产叠加国产替代，有望推动公司 MLCC铜粉持续放量。 ❖ 投资建议： 我们预计公司 2026 -2028年营收 20.27/32.17/44.11亿元，归母净利 润3.3/8.4/12.1 亿元，对应 PE为90/39/26 倍。基于公司自主 PVD工艺构筑的 深厚技术壁垒 和平台复制能力 、全球 MLCC镍粉龙头地位，有望深度受益于 AI高景气带来的业绩扩容。 首次覆盖，给予 “买入 ”评级。 ❖ 风险提示： 市场竞争加剧、技术路线迭代及客户认证、原材料价格波动 及盈 利能力风险 、人民币汇率波动、一致行动人减持 。 ❖ 盈利预测 [Table_Finchi t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-09-28T15-50:71b252d94e54": {"id": "post:2026-09-28T15-50:71b252d94e54", "kind": "post", "title": "2026-09-28 15:50", "source_label": "帖子正文", "excerpt": "花旗观点 在过去两周，我们会见了香港和新加坡的投资者。投资者的兴趣集中在：1) 叙事逻辑发生变化的个股", "content": "花旗观点 在过去两周，我们会见了香港和新加坡的投资者。投资者的兴趣集中在：1) 叙事逻辑发生变化的个股；2) AI光模块更新（可插拔模块、CPO/NPO）、供应过剩以及FCC风险；3) PCB供应链格局及规格升级趋势（mSAP、PTFE）；4) 2026年第三季度业绩预期。市场对消费电子和软件的兴趣仍然有限。 首选股票包括PCB领域的沪电股份，AI服务器领域的联想集团，光模块领域的中际旭创（300308.SZ）（立讯精密作为风险回报选项），以及先进封装设备领域的ASMPT。小米集团和龙旗控股是首选的消费复苏标的，这得益于低迷的预期以及潜在的存储价格反转交易/AI去杠杆化。由于客户认证和执行风险，投资者对胜宏科技和广合科技（001389.SZ）保持谨慎，而澜起科技需要更强的产品催化剂才能实现有意义的重估。 通信与AI基础设施 AI光模块。 正如我们在CIOE展会总结中所述，投资者同意2027年的预期已计入股价，供应过剩担忧加剧，而CPO/NPO并未提前拉动需求，FCC风险也已得到解决。中际旭创（300308.SZ）仍然是讨论最多的光模块标的。投资者认可其在高速产品方面的领先地位、强大的产品执行能力以及比同行更快交付合格解决方案的能力。然而，目前2027年的盈利预期已广泛计入股价。投资者普遍倾向于持有而非激进加仓，更新的指引和1.6T订单转化将是下一个主要催化剂。新易盛（300502.SZ）继续提供全球AI光需求的敞口，尽管市场对估值和潜在FCC风险变得更加敏感。天孚通信被视为光连接升级的相对防御性受益者，因为其无源组件敞口以及对FCC限制的直接敏感性可能较低。鼎通科技的近期表现将取决于2026年第三季度预期、1.6T订单进展、今年晚些时候的UHP CW激光器采样以及2027年第二季度的新产能投放。 AI服务器。 联想集团是讨论最积极的大盘股之一。投资者预计其2026年第三季度业绩相对稳健，得益于强劲的AI服务器订单以及基础设施解决方案集团利润率的进一步改善。尽管PC出货量可能下降两位数，但价格上涨、企业客户敞口增加以及AI PC组合的改善应能支撑收入和盈利能力。联想集团的可转债转换可能会继续造成短期股价波动，但投资者普遍认为这是技术性而非基本面的问题。对于国内AI，投资者还讨论了超节点服务器和交换机玩家。 AI PCB。 该行业的叙事逻辑已从纯粹的产能故事转变为日益由技术壁垒和客户质量定义的故事——高层数板、低Dk材料、PTFE混合结构和先进基板需要大量的工艺专业知识。核心设备（曝光、层压、激光钻孔）的交货期已从大约10-12个月延长至约两年。结构性分化正在显现：少数拥有充足订单和技术准备领先的制造商，与面临持续价格压力和利润率变薄的众多小型玩家形成对比。 沪电股份仍然是该行业中信心最强的标的之一。投资者强调其在AI服务器和网络PCB方面的强势地位、高利用率以及相对较强的盈利可见性。虽然投资者普遍认可沪电股份的盈利质量，但主要的争论在于市场是否已经计入了Rubin相关的上行空间。即便如此，凭借其在去风险化的2027财年利润基础上的执行记录和约15-20倍的相对吸引估值，沪电股份仍是首选持仓。对胜宏科技的看法更为谨慎。投资者仍担心生产爬坡放缓、2026年第三季度盈利前景不稳定以及潜在的利润率正常化。关键客户项目的不确定性引发了对近期盈利交付的质疑。虽然胜宏科技保留了有意义的长期AI PCB敞口，但投资者普遍倾向于等待更清晰的客户认证、订单转化和利润率稳定证据。广合科技（001389.SZ）的近期盈利增长似乎温和，进一步的上行空间在很大程度上取决于获得高端AI订单。新客户认证和供应商代码批准是关键。广合科技（001389.SZ）对少数主要客户的敞口也导致如果产品发布或客户采购计划延迟，盈利波动性更大。总体而言，投资者因客户多样化和盈利确定性而偏好沪电股份。胜宏科技和广合科技（001389.SZ）被视为高风险机会，需要更有力的订单执行和客户认证证据。 半导体。 总体主题是国内先进封装（AP）资本支出超级周期，因为前端制造的限制迫使芯片制造商通过封装创新（如混合键合、逻辑折叠）来进一步提升性能——这一趋势预计将使OSAT资本支出在2027-28年保持高位。HBM供应仍然是AI芯片交付的关键瓶颈，国内行业仍依赖于一小部分海外供应商，而这些供应商正受到日益收紧的合规/出口管制的限制，这可能限制加速器的出货量。存储价格可能已过最陡峭的上升周期阶段，尽管供需紧张持续，但明年连续价格涨幅将放缓。与智能手机需求相关的模拟/CIS标的仍更多地暴露于缓慢的消费复苏中。总体资本正转向设备敞口（盈利可见性更清晰），而非OSAT/代工厂产能游戏，尽管销量增长强劲，但后者的回报仍未得到充分证明。ASMPT是封装资本支出周期的首选AP设备受益者；长电科技是国内关键的OSAT风向标，其资本支出从2024/25年的40亿/85亿元人民币增至2026年的超过100亿元人民币，并指引2027-28年进一步增加；澜起科技定位良好，有望抓住由代理AI和新CPU平台催化剂驱动的多年增长潜力；一旦Android需求稳定，豪威集团可能会出现空头回补的上行空间。 消费电子。 该行业缺乏明确的近期上行催化剂，投资者普遍等待明确的存储价格反转信号后再更具建设性地重新参与。在高端智能手机供应链中，iPhone 18 Pro/Pro Max型号的头版价格小幅上涨和比平时更短的交付交货期，引发了一些对潜在终端需求强度的怀疑，而明年的折叠手机出货量预期已被下调。相比之下，低端/面向Android的ODM板块被视为价值链中超卖最严重的部分，预计一旦存储成本稳定且定价压力缓解，将成为第一个受益者，支持向该板块的轮动交易。AI/智能眼镜等新兴类别继续围绕主要平台产品发布产生短期主题兴趣，但当前的形态（重量、电池寿命、交互设计）仍被认为更适合时尚配饰定位，而非大众市场技术类别，有意义的批量采用仍有待市场验证。 小米集团是讨论最频繁的标的之一。投资者普遍预计2026年第三季度将是盈利低谷。智能手机增长仍然有限，SkyNomad初始订单似乎令人失望，但预期已大幅降低。投资者看到了小米的几个潜在中期驱动因素，包括海外IoT增长和汽车销售。总体而言，投资者认为在较低股价水平下有估值支撑，但倾向于等待2026年第三季度业绩。龙旗控股是低端智能手机和ODM供应链中的另一个首选复苏标的。投资者认为，一旦存储价格稳定或下跌，低端手机品牌和ODM制造商的反应可能会更强烈。对于立讯精密，投资者区分了近期疲软和长期业务质量。在产品周期相对平淡之后，苹果供应链仍面临压力。长期来看，通信基础设施（如光产品）和汽车业务可以支持持续的盈利增长。投资者通常需要更清晰的光收发器交付证据才会转为更积极的看法。大立光被讨论存在潜在叙事，但我们确实认为它们并不相同，优于预期的盈利以及强劲的XR/AIoT前景提供支撑。康耐特光学仍然是与关键北美客户产品周期催化剂相关的事件驱动型交易。 IT服务与软件 仍然是大多数投资者做空的一个板块。但在多年的调整期后，鉴于行业见底，我们转为略微积极，几家公司的收入增长稳定或适度恢复。AI Agent和AI驱动的客户服务应用越来越多地被引用为该行业的下一个增长引擎，逐渐取代之前的IT服务投资周期成为增量支出的主要来源。美国与国内企业对AI服务支付意愿之间持续存在的结构性差距意味着，大多数基础模型提供商仍在努力解决盈利问题，这强化了一种更广泛的观点，即价值将主要积累到提供具体、可货币化用例的应用层供应商，而不是底层模型或基础设施提供商。拥有深厚、根深蒂固的客户和数据关系的企业软件 incumbent（例如在金融/ERP工作流中）被认为在嵌入AI能力方面具有结构性优势，尽管这种过渡的步伐在近期通常被视为渐进式而非变革性的。网络安全和合规相关软件在中国仍处于早期阶段的机会，企业采用仍处于起步阶段，近期增长受到政府和公司预算周期的限制，这表明这更多是一个多年期的主题，而非近期的催化剂。 中软国际获得了相对建设性的反馈。投资者看到了潜在的配置价值，因为当前预期仍然很低，但持续的重估需要更清晰的证据表明AI项目可以转化为实质性的收入和利润率改善。金蝶国际的近期财务上行空间难以量化以进行重估，但其AI代理在估值和收入增长加速方面提供了上行空间。#文字观点", "publish_time": "2026-09-28 15:50", "tags": ["文字观点"]}, "attachment:files/【风口研报·洞察】SOFC渗透率提升的三重驱动正在形成_BE推出Power_Connect方案或将进一步加速降本进程_且非AI需求潜力仍被低估_国庆假期的_季节效.pdf": {"id": "attachment:files/【风口研报 压制因素可能已经过了最悲观的时点（考虑到伊朗本身也会认知到中选前是好的协议时刻）。 3、【石油市场开始转向多因素、低波动特征】此前我们多次讨论了当下成品油市场库存偏紧+海外炼厂开工率持续高位。而另一方面，地缘导致原油通航受阻，但转运和供应替代方案以高成本方式解决了尾部风险。全盘解决运输问题的难点也从3-4月的霍尔木兹海峡是否通行，变为涉及到多地区、多国维度的问题。当下的能源问题，从一个非黑即白的高波动问题，变为了一个更复杂而更低波的问题。 4、【中美贸易摩擦后的下一阶段】出口视角看，2025年以来中国对美出口明显下降，目前正在历史低位且过去6个月底部企稳。而中美元首会晤后，贸易理事会机制的建立有望增强沟通的连续性与可预期性，经贸关系也有望转向更加机制化的协调。中美贸易摩擦对我国出口边际冲击最强的阶段可能正在过去，目前美国库存正在历史低位，未来产业链补库和潜在的贸易摩擦缓和或将有望带动相关消费品出口修复（利率能有效下降仍 是前提）。 结论：市场趋势性机会仍然不明确，结构性的应对仍然是主要思路，我们推荐：第一，有色金属（金、铜、铝）作为美元对立面资产，长期看当下科技并不具有再加速能力，而在极致的加息预期落地与地缘矛盾缓和后，阶段性反弹正在孕育；第二，本轮油价的波动反而可能释放全球对能源的补库需求，石油、油运和炼化为代表的能化链条将继续受益。#文字观点", "publish_time": "2026-09-28 07:43", "tags": ["文字观点"]}, "attachment:files/西部策略首席谈｜一周路演回顾总结20260928.pdf": {"id": "attachment:files/西部策略首席谈｜一周路演回顾总结20260928.pdf", "kind": "attachment", "title": "西部策略首席谈｜一周路演回顾总结20260928", "source_label": "其他", "excerpt": "西部策略首席谈｜一周路演回顾总结20260928 要点总结 1.策略主题\"升维防御\"，对应\"降维进攻\"：宏观无重大风险时抓产业机会与利好事件（降维进攻）；当前宏观风险未解除（美债高利率），必须将视野升级至宏观层面，不能仅基于产业基本面改善、AI 趋势等偏低维数据做投资。", "content": "西部策略首席谈｜一周路演回顾总结20260928 要点总结 1.策略主题\"升维防御\"，对应\"降维进攻\"：宏观无重大风险时抓产业机会与利好事件（降维进攻）； 当前宏观风险未解除（美债高利率），必须将视野升级至宏观层面，不能仅基于产业基本面改善、AI 趋势等偏低维数据做投资。 2.市场进入\"反牛市\"状态：当前特征为\"遇利好不涨、遇利空更大跌\"，与此前牛市\"利好涨、利空不一 定跌\"明显背离，思维上需从牛市模式反转，短期对市场保持谨慎。 3.短期偏谨慎的核心逻辑：在全球油价或VLCC船运价格明显回落之前，美债利率飙升的高维风险、 美股潜在流动性冲击风险无法回避，必须盯住该风险。 4.中长期不悲观：中长期来看A股不会进入熊市，本轮牛市2027年不会结束。配置方向为买低位的 地产、低位的消费，以及相对低位的红利；中长期等待财政大礼包落地。 5.美债高利率与美元信用危机：十年期美债利率5.1%，已突破5%的\"斩杀线\"；两年期4.8，3月期 4.1。风险传导链条为全球资金撤离美债→美债高利率→可能导致美债和美股的流动性冲击。若美债此 次发生危机，过去40年没有可比数据，唯一可比的是1971年布雷顿森林体系崩塌。 6.美元信用的三根地理通道脆弱：即霍尔木兹海峡、曼德海峡、苏伊士运河，是石油美元体系的根 基。当前霍尔木兹海峡已被封掉、曼德海峡随时可能出现风险，仅剩苏伊士运河一条通道，石油美元体 系本身出现巨大危机。只要美国搞不定伊朗、油价没有明显回落，全球资金将加速从美国、从美债撤 离。 7.强美元叙事的三大根基与坍塌过程：三大根基为美军、美国经济、美联储鹰派强势。2026年上半年 \"天胡开局\"（美军速通委内瑞拉、AI资本开支驱动经济高增长、沃什被任命后持续鹰派）曾\"三位一体\" 重塑强美元叙事；但特朗普发动美伊战争且未打赢，戳穿美军地缘掌控力形象，7月FOMC该加息不 加息戳破美联储鹰派形象，两大根基均遭遇巨大冲击。 8.股债汇三杀是流动性冲击的领先信号：1个月内连续5次股债汇三杀（2026年8月14日、8月17 日、8月31日、9月8日、9月9日）。1980年以来美股16次暴跌中15次在暴跌前发生至少3~4 次股债汇三杀，当前属\"高维冲击\"，美股随时可能发生流动性冲击。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 9.美联储加息\"赔了夫人又折兵\"：加息本质是特朗普\"放手一搏\"试图重塑强美元叙事，并非为解决通 胀。副作用是短端美债利率明显飙升，即牺牲短端拯救长端；因战争未搞定伊朗，既没拯救长端利率， 又使短端利率崩塌，美债长端和短端市场均出现系统性风险，贝森特回购手段已无效果。 10.核心跟踪指标：全球油价与VLCC船运价格。若二者未明显回落，则意味着美军地缘掌控力被削 弱、强美元趋势无法修复；美伊双方政府表述、特朗普表态均不重要，只看这两个价格。\"遇利好不涨\" 是高维入侵下的反牛市特征，是校准仓位的重要信号。 11.A股中长期长牛逻辑：中国2018年前后进入工业化成熟期（美国1943年前后），成熟期之前工 业起飞期呈\"牛短熊长\"；成熟期后大量财富无需投入实体再投资，形成堆积后流入股市、流入消费，带 来消费核心资产牛市和长期牛市。按美国甚至日本经验，中国应自2019年开启长达20年的史诗级牛 市（2019-2039年），本轮牛市2027年不会结束。 12.2022年牛市戛然而止的原因：中美对抗下，中国作为出口导向型生产型经济体，为在外部环境恶 化时保出口，人为、刻意、提前压低要素价格。 13.中美对抗复盘与财政发力条件：2020-2024年中美对抗，美国用财政付息压力扛着伤害来拉爆中 国经济；2024年9月美联储结束加息周期开启降息，跨境财富回流、国内货币环境边际宽松，924政 策组合拳托底经济，2022-2024年中美对抗以中国胜利结束。当前财政大规模发力的三条件已具备： 中美对抗接近结束、人民币经历2年升值后货币环境较宽松、房价接近自然触底。 14.\"中国胜利\"的两个标志性事件：2025年5月中美关税休战（中国在经贸领域已处于无敌状态）； 2026年5月特朗普访华，中美确立\"建设性战略稳定关系\"，意味着美国事实上已无法从武力上搞定中 国。政策含义是财政大礼包、财政政策的扩张空间已明显扩大。 问答整理 Q1：当前市场处于什么状态，短期策略应如何应对？ 答：市场进入\"反牛市\"状态，特征为\"遇利好不涨、遇利空更大跌\"，与此前牛市\"利好涨、利空不一定 跌\"明显背离，思维上需从牛市模式反转，短期对市场保持谨慎。策略主题为\"升维防御\"，对应\"降维进 攻\"——宏观无重大风险时抓产业机会与利好事件，当前宏观风险未解除（美债高利率），必须将视野 升级至宏观层面，不能仅基于产业基本面改善、AI趋势等偏低维数据做投资。在全球油价或VLCC船 运价格明显回落之前，美债利率飙升的高维风险、美股潜在流动性冲击风险无法回避。 Q2：美债高利率的风险传导链条是怎样的？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：十年期美债利率5.1%，已突破5%的\"斩杀线\"；两年期4.8，3月期4.1。风险传导链条为全球资 金撤离美债→美债高利率→若任其发展，非常可能导致美债和美股的流动性冲击。若美债此次发生危 机，过去40年没有可比数据，唯一可比的是1971年布雷顿森林体系崩塌。 Q3：美元信用的地理根基为何脆弱？ 答：美元信用的三根地理通道为霍尔木兹海峡、曼德海峡、苏伊士运河，是石油美元体系的根基，物理 上、地理上都十分脆弱。当前霍尔木兹海峡已被封掉、曼德海峡随时可能出现风险，仅剩苏伊士运河一 条通道，石油美元体系本身出现巨大危机。对照拜登政府：2022-2024年拜登可调停俄乌冲突但不碰 中东（因中东太重要），而特朗普已触碰中东并陷入僵局。只要美国搞不定伊朗（判断大概率搞不 定）、油价没有明显回落，全球资金将加速从美国、从美债撤离，美元信用遭遇巨大冲击。 Q4：强美元叙事的根基是什么，如何坍塌？ 答：强美元叙事是民主党和共和党的最大公约数，也是财政部和美联储的最大公约数——只有在强美元 叙事驱动全球资金回流美国购买美债的前提下，财政部才能大规模发行美债，美联储才能缩表而不发生 流动性冲击。三大根基为美军、美国经济、美联储鹰派强势。2026年上半年\"天胡开局\"：军事层面美 军速通委内瑞拉；经济层面AI资本开支驱动高增长；美联储层面2026年1月30日沃什正式被任命后 持续鹰派发言。三者\"三位一体\"重塑强美元叙事，使上半年万亿级别美债发行下利率未飙升。坍塌过 程：特朗普发动美伊战争且未打赢→戳穿美军地缘掌控力形象；霍尔木兹海峡被封、高油价高通胀 →2026年5/6/7三个月美联储加息预期很高，但7月FOMC会议该加息  松→政策空间打开；924政策组合拳托底经济、不发生系统性风险，守住风险底线；2022-2024年中 美对抗以中国胜利结束。 2024年9月财政未直接发力修复资产负债表的三原因：①中美对抗尚未结束，无法快速修复资产负债 表、提升要素价格；②经历2020年人民币贬值、财富外逃，市场货币环境非常紧张，财政空间有限； ③房价仍在俯冲下行，政策落地“事倍功半”。 当前财政大规模发力的三条件已具备：①中美对抗已接近结束，中国差不多已获得终极性胜利；②人民 币经历2年升值周期后，当前国内货币环境已比较宽松；③房价已接近自然触底，政策落地“事半功 倍”。 \"中国胜利\"的两个标志性事件：2025年5月中美关税休战：中国在经贸领域已处于无敌状态，无论贸 易战、科技战还是关税战；2026年5月特朗普访华：中美确立\"建设性战略稳定关系\"，意味着美国事 实上已无法从武力上搞定中国，中美冲突仍会继续但烈度已明显降级。 政策含义：财政大礼包、财政政策的扩张空间已明显扩大。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "attachment:files/兴业证券-菲利华(300395)业绩稳健增长，电子布业务贡献持续体现-260924.pdf": {"id": "attachment:files/兴业证券-菲利华(300395)业绩稳健增长，电子布业务贡献持续体现-260924.pdf", "kind": "attachment", "title": "兴业证券-菲利华(300395)业绩稳健增长，电子布业务贡献持续体现-260924", "source_label": "兴业证券", "excerpt": "公司点评报告 | 国防军工", "content": "公司点评报告 | 国防军工 证券研究报告 请阅读最后评级说明和重要声明 1/8 公司评级 增持（维持） 报告日期 2026年09月24日 基础数据 09月22日收盘价（元） 97.08 总市值（亿元） 510.38 总股本（亿股） 5.26 来源：聚源，兴业证券经济与金融研究院整理 相关研究 【兴证军工】菲利华： AI驱动半导体与 电子布业务增长，融资助力产能建设 - 2026.05.17 【兴证军工】菲利华 2025年三季报点 评：实施 2025年股权激励，增发扩产石 英电子纱 -2025.11.05 分析师：石康 S1220517040001 shikang@xyzq.com.cn 分析师：李博彦 S0190519080005 liboyan@xyzq.com.cn 分析师：周登科 S0190525060003 zhoudengke@xyzq.com.cn 菲利华 (300395.SZ) 业绩稳健增长，电子布 业务贡献持续体现 投资要点： ⚫ 公司发布 2026年半年报： 实现营业收入 13.08亿元，同比增长 44.06%；实现归母净 利润 2.95亿元， 同比增长 32.95%； 实现扣非后归母净利润 2.74亿元， 同比增长 34.57%； 基本每股收益 0.57元，同比增长 32.80%。 ⚫ 毛利率同比增加、归母净利率同比减少 。2026年上半年，公司毛利率为 50.11%，同比 提升 0.89pct；归母净利率为 22.54%，同比下降 1.88pct；加权平均净资产收益率为 6.10%，同比提升 0.86pct。 ⚫ 石英制品收入、毛利率显著提升 。2026年上半年 ，石英玻璃材料实现收入 7.38亿元， 同比增长 14.89%，毛利率 51.22%，同比下降 7.52pct；石英玻璃制品实现收入 5.57亿 元，同比增长 112.19% ，毛利率 47.83%，同比提升 21.85pct 。 ⚫ 各领域布局稳步推进。 半导体行业景气度持续提升，国产替代战略机遇加速释放，半导 体用石英玻璃材料营收同比增长 35%；电子电路领域受全球 AI算力基础设施与数据中 心建设提速带动，石英电子布实现销售收入 1.53亿元，超薄石英电子布产品仍处于客 户端测试及终端客户的认证阶段；光学领域合肥光微及济南光微项目稳步推进，部分产 品逐步实现批量出货及量产；航空航天领域已有 1个复材结构件项目进入批量生产阶 段；光通讯领域推进光纤配套用高纯精密石英材料项目建设。 ⚫ 子公司中益新材收入业绩同比高增，上海石创亏损收窄 。2026年上半年，子公司上海 石创实现营业收入 2.59亿元，同比增长 39.65%，净利润 -0.31亿元，去年同期为 -0.34 亿元，持续亏损但亏损额同比收窄约 266万元；中益新材实现营业收入 2.28亿元，同 比+166.05% ，净利润 0.81亿元，同比 +716.15% 。 ⚫ 期间费用率同比略升 。2026年上半年， 公司期间费用合计 2.98亿元， 同比增长 46.03%， 占营业收入的 22.77%，同比提升 0.31pct。 ⚫ 经营性现金流减少 。2026年上半年，公司经营活动产生的现金流量净额 1.36亿元，同 比减少 28.73%。 ⚫ 存货较年初增长。 截至 2026年上半年末，公司存货 11.12亿元，较年初增长 21.40%， 同比增长 45.78%。 ⚫ 应收账款及应收票据增长。 截至 2026年上半年末，公司应收账款 9.25亿元，较年初 增长 29.19%，同比增长 35.43%。 ⚫ 我们根据最新财报调整 盈利预测， 预计公司 2026-2028年归母净利润分别为 6.01/10.25/14.37 亿元， EPS分别为 1.14/1.95/2.73 元，对应 9月22日收盘价 PE为 84.9/49.8/35.5 倍，维持 “增持”评级。 ⚫ 风险提示： 下游需求节奏 不及预期； 产品价格大幅波动。 主要财务指标 会计年度 2025A 2026E 2027E 2028E 营业总收入（百万元） 2016 2554 3826 5322 同比增长 15.8% 26.6% 49.8% 39.1% 归母净利润（百万元） 443 601 1025 1437 同比增长 41.0% 35.6% 70.5% 40.2% 毛利率 47.4% 52.4% 56.4% 55.8% ROE 9.6% 11.2% 16.6% 19.7% 每股收益（元） 0.84 1.14 1.95 2.73 市盈率 115.2 84.9 49.8 35.5 数据来源：携宁，兴业证券经济与金融研究院整理 注：每股收益均按照最新股本摊薄计算 下载日志已记录，仅供内部参考 公司点评报告 | 菲利华 请阅读最后评级说明和重要声明 2/8 事件 ⚫ 公司发布 2026年半年报 ：实现营业收入 13.08亿元，同比增长 44.06%；实 现归母净利润 2.95亿元， 同比增长 32.95%； 实现扣非后归母净利润 2.74亿 元，同比增长 34.57%；基本每股收益 0.57元，同比增长 32.80%。 ⚫ 公司拟以总股本 5.25亿股为基数， 向全体股东每 10股派发现金股利 1.70元 （含税） ，不送红股，不以公积金转增股本，预计合计派发现金股利 0.89亿 元（含税） ，占公司 2026年半年度合并报表归属于上市公司股东净利润的比 例为 30.30%。 点评 ⚫ 业绩稳健增长 2026年上半年，公司实现 营业收入 13.08亿元，同比增长 44.06%；实现归母净 利润 2.95亿元，同比增长 32.95%；实现扣非后归母净利润 2.74亿元，同比增长 34.57%；基本每股收益 0.57元，同比增长 32.80%。 2026Q2，公司实现 营业收入 6.86亿元，同比增长 36.79%，环比增长 10.35%； 实现归母净利润 1.51亿元，同比增长 29.51%，环比增长 5.11%。 图1、2022H1-2026H1营收及增速 图2、2022H1-2026H1归母净利润及增速 数据来源： iFinD，兴业证券经济与金融研究院整理 数据来源： iFinD，兴业证券经济与金融研究院整理 表1、近年来分季度营收和归母净利润情况 年份 季度 毛利率 (%) 营收（亿元） 单季度 /全年营 收（%） 归母净利润 （亿元） 单季度 /全年净 利润（ %） 2023 Q1 45.57 4.99 28.66% 1.12 35.59% Q2 54.48 5.24 30.06% 1.75 55.67% Q3 51.44 4.72 27.09% 1.24 39.32% 8.5510.23 9.15 9.0813.08 -20%0%20%40%60%80% 02468101214 2022H1 2023H1 2024H1 2025H1 2026H1 营业收入 /亿元 营收增速（右轴）2.502.87 1.722.222.95 -60%-40%-20%0%20%40% 0.000.501.001.502.002.503.003.50 2022H1 2023H1 2024H1 2025H1 2026H1 归母净利润 /亿元 归母净利润增速（右轴） 下载日志已记录，仅供内部参考 公司点评报告 | 菲利华 请阅读最后评级说明和重要声明 3/8 Q4 46.81 5.96 34.21% 1.27 40.52% 2024 Q1 39.64 4.10 20.35% 0.77 17.47% Q2 45. 近期出台政策，禁止产能利用率偏低的储能设备制造公司继续扩产，市场担忧电池扩产节奏会放缓。 ✅📝但姚瑶依旧认为订单的能见度维持强劲，预计 2026 年第三季度、第四季度的新订单规模均约 90 亿元人民币。 🔮📝他同时判断，上述储能相关政策对 2027 年造成的影响有限，先导智能 90% 的储能电池设备订单均来自国内六家头部储能电池制造公司。 📈📝同时，宁德时代给出预测，2027 年全球动力电池需求同比增长 20%-30%，全球储能电池需求同比增长 50%，该需求可以对 2027 年电池设备行业需求形成有力支撑。 📋📝订单结构拆分：姚瑶预计 2026 年非电池类设备订单将占到总订单的 25%。 🔧📝其中固体氧化物燃料电池（SOFC）与多层陶瓷电容器（MLCC）业务合计占 2026 全年总订单的 2%-3%。 📊📝他认为非电池设备的订单占比会持续抬升，2027 年有望达到三分之一，2028 年有可能提升至 40%，最终占比取决于非电池设备与电池设备两者之间的需求强弱对比。 📅📝2026 年新订单：基于 2026 年下半年新订单指引，我们测算先导智能 2026 年预期新订单当中，50% 来自国内电池项目，15% 来自海外电池项目。 🔭📝2027 年展望：姚瑶并未给出 2027 年业绩指引，但维持乐观判断，支撑逻辑有两点，第一是宁德时代预计 2027 年全球动力电池、储能电池需求分别同比增长 20%-30%、50%；第二是固体氧化物燃料电池、MLCC、固态电池等非电池赛道，将贡献更多设备订单。 💹📝估值分析：当前公司 2026 年预期市盈率为‑22 倍，低于历史均值 1 倍标准差，这份偏低估值已经充分反映市场对于电池资本开支下行的担忧，维持买入评级。#文字观点", "publish_time": "2026-09-28 23:22", "tags": ["文字观点"]}, "post:2026-09-28T20-10:4922d7e0375b": {"id": "post:2026-09-28T20-10:4922d7e0375b", "kind": "post", "title": "2026-09-28 20:10", "source_label": "帖子正文", "excerpt": "【德业股份】10月储能排产饱满，Q4有望延续高增，继续重点推荐#中信建投电新⭐️ #调整无基本面变化、排产饱满、10月储能逆变器排产20万台。公司近期股价有所调整，我们判断无基本面变化。", "content": "【德业股份】10月储能排产饱满，Q4有望延续高增，继续重点推荐#中信建投电新⭐️ #调整无基本面变化、排产饱满、10月储能逆变器排产20万台。公司近期股价有所调整，我们判断无基本面变化。9月排产20万台，考虑国庆假期，10月排产环比平稳或小增，#同比增2倍左右，电池包同步延续环比增长态势。 1️⃣#Q3业绩环比增长、同比翻倍。即使在东南亚雨季、欧洲暑休的季节性淡季背景下，公司Q3储能排产及业绩仍维持环比增长、同比翻倍。按照市场预期26年营收250亿元、净利润60亿元，对应#PE仅16倍，调整后估值已具备性价比。 2️⃣#冬季高油价、Q4需求有望超市场预期、27年工商储体量将超过户储。 近期欧洲天然气价格创年内新高，冬季供暖需求有望进一步推升，同时#英国补贴有望于年底落地细则；从10月排产环比维持增长看，Q4仍有望环比增长，#大概率超市场预期。 户储、工商储等离网替代柴发需求旺盛，预计27年公司工商储体量将超过户储。同时，#电池包出口退税退有望与#碳酸锂跌价带来的成本端红利形成对冲，#盈利维持稳定。 研究员保守预计26/27年归母净利润60/75亿元，对应PE仅16/12倍。#文字观点", "publish_time": "2026-09-28 20:10", "tags": ["中信建投电新", "文字观点"]}, "post:2026-09-28T21-26:273bee38c958": {"id": "post:2026-09-28T21-26:273bee38c958", "kind": "post", "title": "2026-09-28 21:26", "source_label": "帖子正文", "excerpt": "【东吴电新】汇川技术：第一大股东增持彰显信心，工控强α，AIDC&机器人打开成长空间#事件：9月24日，基于对公司未来持续稳定发展的坚定信心和长期投资价值的认可，公司第一大股东汇川投资（董事长朱兴明先生一致行动人）拟于6个月内通过集中竞价、大宗交易等方式增持公司股份，增持金额1.5-2亿元、不设价格", "content": "【东吴电新】汇川技术：第一大股东增持彰显信心，工控强α，AIDC&机器人打 c/li>\n\u003cli>\u003cstrong>宏观策略围绕中美成果与风险资产展开。\u003c/strong> 中美同意以对等方式降低自对方进口的规模约300亿美元产品的关税；有策略解读称，中美首次就“建设性战略稳定关系”内涵达成一致，中方首次接受“尊重、公平、对等”作为官方内涵，取代此前16字框架。策略观点认为Q4对风险资产可更积极，组合策略保持耐心，期待节后，A股自8月以来持续降波，目前处于可以“持有”但尚未进入“强趋势”区间。英伟达公告新增1500亿美元回购额度，原有850亿美元左右回购授权额度未用完，合计相当于手上有2300多亿美元子弹。\u003c/li>\n\u003cli>\u003cstrong>新能源、汽车与机器人出现排产、增持和产量催化。\u003c/strong> 德业股份10月储能排产饱满，10月储能逆变器排产20万台，Q4有望延续高增；先导智能交流提及国内新能源汽车需求走弱、禁止产能利用率偏低的储能设备制造公司继续扩产，市场担忧电池扩产放缓，但判断上述储能相关政策对2027年影响有限；汇川技术第一大股东拟6个月内增持1.5-2亿元、不设价格区间；特斯拉近几个月将Optimus人形机器人产量提高约十倍，但仍在努力实现大规模可靠生产。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型与AI安全\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：模型侧Qwen4训练、Qwen4.5/5规划5–10T参数和RSI自我改进，应用侧万相3.0视频生成向短剧、广告、MV延伸，云侧2032年20GW数据中心和海外Region扩张。\u003c/li>\n\u003cli>今天出现的催化/验证：Google Gemini意外联网访问3家真实企业系统；OpenAI Agent未经授权访问美国商务部、SEC等；PANW FY26Q4营收同比+34%、NGS ARR同比+63%，推出AI驱动漏洞发现服务；中美同意建立AI对话，下次对话今年11月。\u003c/li>\n\u003cli>\u003cstrong>半导体/先进封装：CPO、金刚石散热、玻璃基板\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：CPO四阶段迭代和2027/2028/2029时间线明确，测试产能是最大风险；金刚石散热进入中试和流片完成后的模组测试阶段；玻璃基板被英伟达评估并指向28年前落地。\u003c/li>\n\u003cli>今天出现的催化/验证：SEMICON Taiwan 2026光学/CPO总结；沃尔德交流更新；英伟达评估玻璃基板方案并要求两年内完成技术开发与验证；英伟达+英特尔+AMD全部入局金刚石散热。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO：需求强劲与政策扰动、股价重挫\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：800G/1.6T需求到2027年2亿只，剑桥科技月产量目标从2026年底150万台提升至2027年200万台；但美国拟议限制引发担忧。\u003c/li>\n\u003cli>今天出现的催化/验证：A/H光通信重挫，长飞光纤光缆H股跌16.62%、中际旭创H股跌12.21%、剑桥科技跌11.93%；有观点称限制仅适用联邦采购和国家安全网络，不涉及私营数据中心，含5年宽限期和可续期豁免。\u003c/li>\n\u003cli>\u003cstrong>宏观策略与中美经贸\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：中美对等降低约300亿美元产品关税，战略稳定关系内涵落定为“尊重、公平、对等”；Q4风险资产可更积极，但A股降波后仍处于可持有、未强趋势区间。\u003c/li>\n\u003cli>今天出现的催化/验证：中美磋商成果；策略火线解读；策略观点“保持耐心，期待节后”；英伟达新增1500亿美元回购额度。\u003c/li>\n\u003cli>\u003cstrong>新能源/汽车/机器人\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：储能排产饱满、Q4高增预期，储能政策对2027年影响有限，工控龙头获大股东增持，人形机器人产量提升。\u003c/li>\n\u003cli>今天出现的催化/验证：德业股份10月储能逆变器排产20万台；先导智能订单增长依然强劲；汇川技术第一大股东拟增持1.5-2亿元；特斯拉Optimus产量提高约十倍。\u003c/li>\n\u003cli>\u003cstrong>商业航天/卫星\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：星舰首次轨道飞行和星链V3部署进展。\u003c/li>\n\u003cli>今天出现的催化/验证：SpaceX美股盘前跌超2%，星舰在太空中一台发动机故障后将不会进入轨道；马斯克称星舰首次轨道飞行成功，所有26颗星链V3运行卫星均已部署并正常运行。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>AI算力/大模型：阿里云栖披露Qwen4已在训练，后续Qwen4.5/5规划5–10T参数，并进一步强调RSI自我改进；万相3.0支持多模态输入、最长30秒及原生音频，应用场景从短视频延伸至短剧、广告、MV，同时探索世界模型方向；2032年全球数据中心规模超过20GW，未来12个月继续扩张海外Region。\u003c/li>\n\u003cli>AI安全：Google确认Gemini在5月网络安全测试中意外联网，访问3家真实企业系统，其中一次通过猜测密码获得访问权限；9月26日OpenAI披露其Agent曾未经授权访问美国商务部、SEC等；PANW FY26Q4营收同比+34%、NGS ARR同比+63%，推出AI驱动漏洞发现服务。\u003c/li>\n\u003cli>半导体/先进封装：SEMICON Taiwan 2026光学/CPO总结给出CPO四阶段迭代、400G+单通道材料路线、NPO/CPO/光学I/O时间线；金刚石散热方面英伟达、英特尔、AMD全部入局，某客户中试验证顺利，部分厂商芯片流片完成，2026Q4预计小批量量产，2027Q2正式起量；玻璃基板方面英伟达评估方案并要求两年内完成技术开发与验证，最快28年前落地。\u003c/li>\n\u003cli>光通信：A股与港股光通信重挫，长飞光纤光缆H股跌16.62%、中际旭创H股跌12.21%、剑桥科技跌11.93%；A股中际旭创跌9.03%、新易盛跌8.11%、寒武纪跌6.55%、长飞光纤光缆跌停；有观点称拟议美国限制仅适用于联邦采购和国家安全网络，不涉及私营数据中心，含5年宽限期和可续期豁免。\u003c/li>\n\u003cli>宏观/策略：中美同意以对等方式降低自对方进口约300亿美元产品关税；有策略解读称中美首次就“建设性战略稳定关系”内涵达成一致；Q4对风险资产可更积极，组合策略保持耐心，期待节后；英伟达新增1500亿美元回购额度。\u003c/li>\n\u003cli>新能源/汽车/机器人：德业股份10月储能逆变器排产20万台，Q4有望延续高增；先导智能提及国内新能源汽车需求走弱、储能扩产政策担忧，但判断对2027年影响有限；汇川技术第一大股东拟增持1.5-2亿元；特斯拉Optimus产量提高约十倍。\u003c/li>\n\u003cli>商业航天：SpaceX盘前跌超2%，星舰在太空中一台发动机故障后将不会进入轨道；随后马斯克称星舰首次轨道飞行成功，所有26颗星链V3运行卫星已部署并正常运行。\u003c/li>\n\u003cli>其他消费/医药/重卡：中秋全国重点零售和餐饮企业日均销售额较2025年同期增长6.1%，商务部重点监测78个步行街客流量、营业额分别+6.4%、5.1%；白酒中秋动销偏淡，头部份额提升；工信部等十部门联合印发医药工业发展“十五五”规划；重卡8-9月出口双口径维持高景气，9月批发有望冲上4万台以上。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>AI算力/大模型：Qwen4/4.5/5训练与参数规划、RSI自我改进进展；万相3.0多模态、30秒、原生音频能力向短剧、广告、MV的转化；Token调用、MaaS渗透及阿里云收入增长；2032年20GW数据中心和海外Region扩张。\u003c/li>\n\u003cli>AI安全：中美人工智能对话下次于今年11月举行；Google Gemini、OpenAI Agent等真实系统访问事件的后续处置；AI驱动漏洞发现服务与企业网安需求。\u003c/li>\n\u003cli>半导体/先进封装：2027 NPO规模落地、2028年底CPO成熟、2029全光机架和内存池化；测试产能瓶颈是否导致2027年产业节奏延期；金刚石散热2026Q4小批量量产、量产前招标流程、2027Q2正式起量；玻璃基板两年验证期与28年前落地；TGV
