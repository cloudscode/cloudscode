lish_time": "2026-08-13 08:43", "tags": ["文字观点"]}, "attachment:files/【九点特供】单季资本开支528亿元！腾讯大幅增加算力采购，分析师看好大厂正循环效应已经形成，国产算力替代进入加速期；宇树人形机器人累计生产下线约18000台.pdf": {"id": "attachment:files/【九点特供】单季资本开支528亿元！腾讯大幅增加算力采购，分析师看好大厂正循环效应已经形成，国产算力替代进入加速期；宇树人形机器人累计生产下线约18000台.pdf", "kind": "attachment", "title": "【九点特供】单季资本开支528亿元！腾讯大幅增加算力采购，分析师看好大厂正循环效应已经形成，国产算力替代进入加速期；宇树人形机器人累计生产下线约18000台", "source_label": "其他", "excerpt": "Mikko的全球市场⽇志（2026年8⽉12⽇）\u0001 要闻\u0001 中国\u0001 • 央⾏：及时谋划出台务实管⽤的增量政策，加⼤逆周期调节⼒度\u0001 • 腾讯电话会：AI投⼊回报空间已现，WorkBuddy⽑利率已显著改善，算⼒出租为“安全垫”\u0001 • 布鲁可“闯美”⻅成效，上半年海外收⼊增⻓逾两倍\u0001 • ⾯壁智能启动IPO辅导：端侧模型赶上AI⼿机浪潮？\u0001 海外\u0001 • 全⾯符", "content": "Mikko的全球市场⽇志（2026年8⽉12⽇）\u0001 要闻\u0001 中国\u0001 • 央⾏：及时谋划出台务实管⽤的增量政策，加⼤逆周期调节⼒度\u0001 • 腾讯电话会：AI投⼊回报空间已现，WorkBuddy⽑利率已显著改善，算⼒出租为“安全垫”\u0001 • 布鲁可“闯美”⻅成效，上半年海外收⼊增⻓逾两倍\u0001 • ⾯壁智能启动IPO辅导：端侧模型赶上AI⼿机浪潮？\u0001 海外\u0001 • 全⾯符合预期，美国7⽉CPI同⽐涨幅收窄⾄3.4%，核⼼CPI同⽐放缓⾄2.5%\u0001 • 韩媒：三星、SK海⼒⼠酝酿“史诗级”分红回购\u0001，合计或超1400亿美元\u0001 • ⾸次直投韩股！韩媒称淡⻢锡拟“抄底”三星、海⼒⼠\u0001 • 报道：三星电机玻璃基板可靠性评估未过关，量产时间推迟\u0001 • 陈⽴武：英特尔最初是内存公司，正探索“下⼀代内存架构”，已挖来SK海⼒⼠的⼈才\u0001 • ⻢斯克：五年后AI占SpaceX价值99%，我们必须取得AI的胜利；押注AI代理赛道，SpaceX\u0001AI推出 Grok\u0001Bot，对标Anthropic与OpenAI\u0001 • 追平OpenAI！Gemini⽉活⽤⼾突破10亿，为⾕歌史上增速最快产品\u0001 • Lumentum电话会：CEO称“超⼤功率激光器需求正远超产能”，“NPO机会完全是增量” \u0001 • 从奢侈品到廉价符号，钻⽯市场正加速崩溃\u0001 今⽇⽬录\u0001 • 腾讯⼴告加速但⾃由现⾦流转负（1）\u0001 • 英特尔靠涨价抢回营收份额（1）\u0001 • AI数据中⼼电源⾰命来了（1）\u0001 • ⽇本减税钱从哪来（1）\u0001 ✏GS：腾讯控股，2026年第⼆季度业绩初评\u0001 1.⼴告收⼊超预期增⻓，AI赋能成效显著。第⼆季度⼴告收⼊同⽐增⻓22%，加速于⼀季度 的20%及⾼盛预期的18%。这⼀增⻓主要得益于AI技术增强以及闭环交易模式的推动，显 ⽰出公司在营销服务领域的强劲动⼒。\u0001 2.资本⽀出⼤幅上升影响⾃由现⾦流，但具备下⾏保护。第⼆季度资本⽀出激增⾄530亿元 ⼈⺠币（⼀季度为320亿元），导致⾃由现⾦流转负⾄-140亿元。市场关注点集中在资本 ⽀出前景、投资回报率及折旧对下半年的影响。公司指出，若需控制成本，可通过腾讯云 以有吸引⼒的价格租赁外部AI基础设施，从⽽提供下⾏保护。\u0001 3.AI战略聚焦新特许经营产品，混元与⼯作助⼿进展良好。公司战略重⼼转向AI特许经营产 品（如混元Hy、⼯作助⼿WorkBuddy和⼩微Xiaowei）。第⼆季度新AI产品亏损1 05亿元 （⼀季度为88亿元）。混元3（Hy3）在产品集成⽅⾯取得显著进展，参数更⼤的混元4 （Hy4）预计今年晚些时候发布；⼯作助⼿在中国⽣产⼒AI办公代理中⽤⼾数处于领先地 位。\u0001 4.游戏业务符合预期，国内增⻓加速抵消国际疲软。游戏收⼊同⽐增⻓11%，符合市场预 期。其中国内游戏收⼊增⻓加速⾄17%，主要受《王者荣耀》和《洛克王国》贡献；国际 游戏收⼊同⽐下降1%，《VALORANT》和《PUBG\u0001MOBILE》的增⻓被Supercell系列表 现放缓所抵消。\u0001 5.⾦融科技与云业务稳健增⻓。⾦融科技收⼊在⽀付、财富管理和消费贷款服务增加的推动 下实现增⻓。云收⼊增速加速⾄低⼆⼗位数百分⽐，主要受益于AI需求、国际扩张及通⽤ 云服务\u0001uptake\u0001的增加。\u0001 ✏瑞银：CPU⾏业更新，2026年第⼆季度出货量超预期，英特尔营收 份额改善\u0001 1.服务器CPU出货量超越季节性常态，ARM与AMD在单位份额上持续增⻓，但英特尔在营 收份额上有所回升。2026年第⼆季度，服务器CPU总出货量环⽐增⻓约9%（同⽐增⻓ 27%），优于通常的+1%季节性表现。尽管ARM和AMD在单位出货量上的份额继续增⻓ （ARM环⽐增40bps⾄17.6%，AMD增90bps⾄28.4%，英特尔降140bps⾄53.9%），但 在x86市场的营收份额⽅⾯，英特尔环⽐增加了160个基点⾄55.4%。这主要得益于英特尔 平均售价（ASP）环⽐上涨22%，⽽AMD仅上涨7%。\u0001 2.PC\u0001CPU出货量⼤幅反弹，英特尔虽失单位份额但获营收份额提升。第⼆季度PC\u0001CPU总出 货量环⽐增⻓10%，远⾼于五年中位数-2%，标志着在⼀季度下降13%后的强劲反弹。其 中笔记本单元环⽐增⻓16%，⽽台式机单元下降7%。在单位份额上，英特尔流失110个基 点⾄59.1%，AMD增加30个基点⾄25.6%，ARM增加90个基点⾄15.3%。然⽽，在营收⽅ ⾯，英特尔在笔记本和台式机市场的份额分别环⽐增加210个基点和240个基点，得益于 其PC\u0001ASP环⽐上涨9%，⽽AMD\u0001ASP环⽐下降6%。\u0001 3.2026年PC市场前景谨慎，预计全年单位出货量将下降。鉴于内存价格通胀以及产品组合 向⾼端倾斜，低端⾄中端PC需求受到抑制。UBS预测2026年全球PC单位出货量将同⽐下 降约11%，其中台式机下降约13%，笔记本下降约10%，全年全球PC出货量约为2.42亿 台。2027年预计仅恢复2%的年增⻓率，原因是内存价格持续⾼企及Windows\u000111过渡后 的替换周期正常化。\u0001 4.CPU市场竞争加剧，多架构并存成为趋势。随着更多⼚商进⼊CPU市场，竞争⽇益激烈。 ARM预计在2027年推出136核⼼的AGI平台，⾼通⽬标在2028年推出250+核⼼CPU。英特 尔的服务器路线图因Coral\u0001Rapids的推出及多线程技术的回归⽽更具竞争⼒。不同⼯作负 载对架构的需求多样化，如代理编码⼯作负载⻘睐低核⼼数、低延迟设计（如NVDA的 Grace），⽽⾮编码⼯作负载则\u0001favor\u0001⾼核⼼数和多线程性能（利好AMD）。\u0001 英特尔、AMD和ARM整体CPU市场份额（按出货量）\u0001 ✏瑞银：AIDC电源架构2.0，固态变压器（SST）机遇与新份额增⻓周 期\u0001 1.固态变压器（SST）将成为AIDC⾸选电源架构，2030年渗透率有望达40%。随着AI数据 中⼼（AIDC）机架功率密度持续上升，电源架构升级迎来拐点。SST凭借更⾼效率、更⼩ 占地和更好的集成灵活性，预计将从2027年下半年开始抢占市场份额，到2030年在AIDC 领域的渗透率将从2027年的不⾜5%提升⾄40%，成为AIDC电源系统的⾸选架构。\u0001 2.SST具备显著的经济性和技术优势，可降低AIDC总拥有成本（TCO）14%。相⽐传统不 间断电源（UPS），SST可将电⼒效率提⾼约4%，减少40-50%的铜⽤量，并将占地⾯积 减少80%。尽管SST的前期成本是UPS的两倍以上，但由于架构简化、能源损失降低和运 营⽀出节省，预计可使AIDC的TCO降低14%，从⽽提升每⽡特代币产出，推动云服务提供 商（CSP）更快采⽤。\u0001 3.中国供应商有望凭借技术和成本优势⻓期收获市场份额。虽然海外电源系统巨头⽬前主导 SST演进，但瑞银认为中国公司凭借在电⼒电⼦、⾼压碳化硅（SiC）器件、⾼频变压器 和中压绝缘⽅⾯的技术专⻓，以及制造规模和成本优势，将在⻓期获得市场份额。具备系 统集成能⼒和客⼾渠道优势的企业将最能捕捉CSP的需求。\u0001 4.上调阳光电源盈利预测，重申“买⼊”评级。瑞银认为阳光电源（Sungrow）和科⼠达 （Kstar）是SST领域的主要受益者。鉴于SST业务潜在的盈利贡献，瑞银将阳光电源 2028-2030年的每股收益（EPS）预测上调5-18%，并重申对其“买⼊”评级，⽬标价上 调⾄165元⼈⺠币。\u0001 英伟达机架功率代际演进\u0001 ✏GS：探索⽇本消费税削减的资⾦来源，⾮税收⼊与特别税收措施难 以填补缺⼝\u0001 1.通过⾮税收⼊和缩减特别税收措施完全覆盖约5万亿⽇元消费税削减缺⼝的难度极⼤。尽 管⽇本政府表⽰不依赖国债为⻝品消费税削减提供资⾦，⽽是主要通过缩减“特别税收措 施”和增加“⾮税收⼊”来筹资，但⾼盛分析认为这两项来源难以提供⾜够的资⾦。⾸ 先，⾮税收⼊中约⼀半来⾃外汇储备的利息收⼊，预计2027财年可额外转移约1万亿⽇ 元，但这远低于5万亿⽇元的缺⼝。其次，特别税收措施的缩减已在2026年预算中实施， 进⼀步⼤幅缩减的空间有限，且⾯临政治阻⼒。\u0001 2.外汇储备资本收益转⼊预算⾯临制度和程序障碍，短期内难以实现。虽然外汇储备因⽇元 贬值积累了超过80万亿⽇元的留存收益（含未实现资本收益），理论上可转⼊政府预算， 但实际上缺乏明确的财务省程序允许将外汇留存收益直接转⼊⼀般账⼾。此外，若要通过 出售外汇资产变现，可能引发市场波动或需发⾏融资票据，这本质上仍增加了政府债务负 担，且⽴法修订耗时较⻓，⽆法赶上2027财年预算编制。\u0001 3.⻓期财政可持续性更取决于2029年引⼊的永久性可退还税收抵免的资⾦来源。相⽐为期 两年的临时性消费税削减，2029年起计划引⼊的永久性可退还税收抵免（基准情景下每年 约3万亿⽇元）对公共债务与GDP⽐率的影响更为深远。由于外汇盈余波动⼤且特别税收 措施缩减空间有限，为这⼀永久性减税寻找稳定的永久资⾦来源极具挑战性，若失败将显 著加剧⽇本⻓期的财政⻛险。\u0001 4.名义上不使⽤⾚字融资债券并不意味着国债发⾏总量不增加。政府预算中，国债发⾏并不 ⼀定与特定⽀出或减税挂钩。政府可以声称利⽤⾃然增加的税收收⼊来资助减税，但这可 能导致原本应由⾃然增收覆盖的其他⽀出转⽽依赖⾚字融资债券。因此，投资者应关注的 是政府国债发⾏总量的最终增加幅度，⽽⾮官⽅宣称的特定资⾦来源。\u0001 ⽇本⾮税收⼊构成：外汇储备盈余约占⼀半\u0001 看推\u0001 中东战⽕对⽯油供应的冲击远超历史，油价却\"淡定\"得反常\u0001 全球⻩⾦⼤发现枯竭：连续两年零重⼤发现，创历史⾸次\u0001 AI\u0001Token使⽤量七个⽉暴涨超10倍：从6.4万亿到69万亿\u0001 关税影响减弱：多类消费品价格涨幅回落\u0001 关税阴影下，美国铜进⼝量激增\u0001 美国劳动成本增⻓放缓，通胀降温在望\u0001 ⻩⾦ETF中的散⼾情绪：追涨杀跌的典型模式\u0001", "status": "extracted"}, "attachment:files/【电报解读】SpaceX计划到明年年底将现有算力规模扩大约十倍，机构称算力瓶颈仍是AI产业核心约束，这家公司表示产品已用于xAI超级计算机中心.pdf": {"id": "attachment:files/【电报解读】SpaceX计划到明年年底将现有算力规模扩大约十倍，机构称算力瓶颈仍是AI产业核心约束，这家公司表示产品已用于xAI超级计算机中心.pdf", "kind": "attachment", "title": "【电报解读】SpaceX计划到明年年底将现有算力规模扩大约十倍，机构称算力瓶颈仍是AI产业核心约束，这家公司表示产品已用于xAI超级计算机中心", "source_label": "其他", "excerpt": "Mikko的全球市场⽇志（2026年8⽉12⽇）\u0001 要闻\u0001 中国\u0001 • 央⾏：及时谋划出台务实管⽤的增量政策，加⼤逆周期调节⼒度\u0001 • 腾讯电话会：AI投⼊回报空间已现，WorkBuddy⽑利率已显著改善，算⼒出租为“安全垫”\u0001 • 布鲁可“闯美”⻅成效，上半年海外收⼊增⻓逾两倍\u0001 • ⾯壁智能启动IPO辅导：端侧模型赶上AI⼿机浪潮？\u0001 海外\u0001 • 全⾯符", "content": "Mikko的全球市场⽇志（2026年8⽉12⽇）\u0001 要闻\u0001 中国\u0001 • 央⾏：及时谋划出台务实管⽤的增量政策，加⼤逆周期调节⼒度\u0001 • 腾讯电话会：AI投⼊回报空间已现，WorkBuddy⽑利率已显著改善，算⼒出租为“安全垫”\u0001 • 布鲁可“闯美”⻅成效，上半年海外收⼊增⻓逾两倍\u0001 • ⾯壁智能启动IPO辅导：端侧模型赶上AI⼿机浪潮？\u0001 海外\u0001 • 全⾯符合预期，美国7⽉CPI同⽐涨幅收窄⾄3.4%，核⼼CPI同⽐放缓⾄2.5%\u0001 • 韩媒：三星、SK海⼒⼠酝酿“史诗级”分红回购\u0001，合计或超1400亿美元\u0001 • ⾸次直投韩股！韩媒称淡⻢锡拟“抄底”三星、海⼒⼠\u0001 • 报道：三星电机玻璃基板可靠性评估未过关，量产时间推迟\u0001 • 陈⽴武：英特尔最初是内存公司，正探索“下⼀代内存架构”，已挖来SK海⼒⼠的⼈才\u0001 • ⻢斯克：五年后AI占SpaceX价值99%，我们必须取得AI的胜利；押注AI代理赛道，SpaceX\u0001AI推出 Grok\u0001Bot，对标Anthropic与OpenAI\u0001 • 追平OpenAI！Gemini⽉活⽤⼾突破10亿，为⾕歌史上增速最快产品\u0001 • Lumentum电话会：CEO称“超⼤功率激光器需求正远超产能”，“NPO机会完全是增量” \u0001 • 从奢侈品到廉价符号，钻⽯市场正加速崩溃\u0001 今⽇⽬录\u0001 • 腾讯⼴告加速但⾃由现⾦流转负（1）\u0001 • 英特尔靠涨价抢回营收份额（1）\u0001 • AI数据中⼼电源⾰命来了（1）\u0001 • ⽇本减税钱从哪来（1）\u0001 ✏GS：腾讯控股，2026年第⼆季度业绩初评\u0001 1.⼴告收⼊超预期增⻓，AI赋能成效显著。第⼆季度⼴告收⼊同⽐增⻓22%，加速于⼀季度 的20%及⾼盛预期的18%。这⼀增⻓主要得益于AI技术增强以及闭环交易模式的推动，显 ⽰出公司在营销服务领域的强劲动⼒。\u0001 2.资本⽀出⼤幅上升影响⾃由现⾦流，但具备下⾏保护。第⼆季度资本⽀出激增⾄530亿元 ⼈⺠币（⼀季度为320亿元），导致⾃由现⾦流转负⾄-140亿元。市场关注点集中在资本 ⽀出前景、投资回报率及折旧对下半年的影响。公司指出，若需控制成本，可通过腾讯云 以有吸引⼒的价格租赁外部AI基础设施，从⽽提供下⾏保护。\u0001 3.AI战略聚焦新特许经营产品，混元与⼯作助⼿进展良好。公司战略重⼼转向AI特许经营产 品（如混元Hy、⼯作助⼿WorkBuddy和⼩微Xiaowei）。第⼆季度新AI产品亏损1 05亿元 （⼀季度为88亿元）。混元3（Hy3）在产品集成⽅⾯取得显著进展，参数更⼤的混元4 （Hy4）预计今年晚些时候发布；⼯作助⼿在中国⽣产⼒AI办公代理中⽤⼾数处于领先地 位。\u0001 4.游戏业务符合预期，国内增⻓加速抵消国际疲软。游戏收⼊同⽐增⻓11%，符合市场预 期。其中国内游戏收⼊增⻓加速⾄17%，主要受《王者荣耀》和《洛克王国》贡献；国际 游戏收⼊同⽐下降1%，《VALORANT》和《PUBG\u0001MOBILE》的增⻓被Supercell系列表 现放缓所抵消。\u0001 5.⾦融科技与云业务稳健增⻓。⾦融科技收⼊在⽀付、财富管理和消费贷款服务增加的推动 下实现增⻓。云收⼊增速加速⾄低⼆⼗位数百分⽐，主要受益于AI需求、国际扩张及通⽤ 云服务\u0001uptake\u0001的增加。\u0001 ✏瑞银：CPU⾏业更新，2026年第⼆季度出货量超预期，英特尔营收 份额改善\u0001 1.服务器CPU出货量超越季节性常态，ARM与AMD在单位份额上持续增⻓，但英特尔在营 收份额上有所回升。2026年第⼆季度，服务器CPU总出货量环⽐增⻓约9%（同⽐增⻓ 27%），优于通常的+1%季节性表现。尽管ARM和AMD在单位出货量上的份额继续增⻓ （ARM环⽐增40bps⾄17.6%，AMD增90bps⾄28.4%，英特尔降140bps⾄53.9%），但 在x86市场的营收份额⽅⾯，英特尔环⽐增加了160个基点⾄55.4%。这主要得益于英特尔 平均售价（ASP）环⽐上涨22%，⽽AMD仅上涨7%。\u0001 2.PC\u0001CPU出货量⼤幅反弹，英特尔虽失单位份额但获营收份额提升。第⼆季度PC\u0001CPU总出 货量环⽐增⻓10%，远⾼于五年中位数-2%，标志着在⼀季度下降13%后的强劲反弹。其 中笔记本单元环⽐增⻓16%，⽽台式机单元下降7%。在单位份额上，英特尔流失110个基 点⾄59.1%，AMD增加30个基点⾄25.6%，ARM增加90个基点⾄15.3%。然⽽，在营收⽅ ⾯，英特尔在笔记本和台式机市场的份额分别环⽐增加210个基点和240个基点，得益于 其PC\u0001ASP环⽐上涨9%，⽽AMD\u0001ASP环⽐下降6%。\u0001 3.2026年PC市场前景谨慎，预计全年单位出货量将下降。鉴于内存价格通胀以及产品组合 向⾼端倾斜，低端⾄中端PC需求受到抑制。UBS预测2026年全球PC单位出货量将同⽐下 降约11%，其中台式机下降约13%，笔记本下降约10%，全年全球PC出货量约为2.42亿 台。2027年预计仅恢复2%的年增⻓率，原因是内存价格持续⾼企及Windows\u000111过渡后 的替换周期正常化。\u0001 4.CPU市场竞争加剧，多架构并存成为趋势。随着更多⼚商进⼊CPU市场，竞争⽇益激烈。 ARM预计在2027年推出136核⼼的AGI平台，⾼通⽬标在2028年推出250+核⼼CPU。英特 尔的服务器路线图因Coral\u0001Rapids的推出及多线程技术的回归⽽更具竞争⼒。不同⼯作负 载对架构的需求多样化，如代理编码⼯作负载⻘睐低核⼼数、低延迟设计（如NVDA的 Grace），⽽⾮编码⼯作负载则\u0001favor\u0001⾼核⼼数和多线程性能（利好AMD）。\u0001 英特尔、AMD和ARM整体CPU市场份额（按出货量）\u0001 ✏瑞银：AIDC电源架构2.0，固态变压器（SST）机遇与新份额增⻓周 期\u0001 1.固态变压器（SST）将成为AIDC⾸选电源架构，2030年渗透率有望达40%。随着AI数据 中⼼（AIDC）机架功率密度持续上升，电源架构升级迎来拐点。SST凭借更⾼效率、更⼩ 占地和更好的集成灵活性，预计将从2027年下半年开始抢占市场份额，到2030年在AIDC 领域的渗透率将从2027年的不⾜5%提升⾄40%，成为AIDC电源系统的⾸选架构。\u0001 2.SST具备显著的经济性和技术优势，可降低AIDC总拥有成本（TCO）14%。相⽐传统不 间断电源（UPS），SST可将电⼒效率提⾼约4%，减少40-50%的铜⽤量，并将占地⾯积 减少80%。尽管SST的前期成本是UPS的两倍以上，但由于架构简化、能源损失降低和运 营⽀出节省，预计可使AIDC的TCO降低14%，从⽽提升每⽡特代币产出，推动云服务提供 商（CSP）更快采⽤。\u0001 3.中国供应商有望凭借技术和成本优势⻓期收获市场份额。虽然海外电源系统巨头⽬前主导 SST演进，但瑞银认为中国公司凭借在电⼒电⼦、⾼压碳化硅（SiC）器件、⾼频变压器 和中压绝缘⽅⾯的技术专⻓，以及制造规模和成本优势，将在⻓期获得市场份额。具备系 统集成能⼒和客⼾渠道优势的企业将最能捕捉CSP的需求。\u0001 4.上调阳光电源盈利预测，重申“买⼊”评级。瑞银认为阳光电源（Sungrow）和科⼠达 （Kstar）是SST领域的主要受益者。鉴于SST业务潜在的盈利贡献，瑞银将阳光电源 2028-2030年的每股收益（EPS）预测上调5-18%，并重申对其“买⼊”评级，⽬标价上 调⾄165元⼈⺠币。\u0001 英伟达机架功率代际演进\u0001 ✏GS：探索⽇本消费税削减的资⾦来源，⾮税收⼊与特别税收措施难 以填补缺⼝\u0001 1.通过⾮税收⼊和缩减特别税收措施完全覆盖约5万亿⽇元消费税削减缺⼝的难度极⼤。尽 管⽇本政府表⽰不依赖国债为⻝品消费税削减提供资⾦，⽽是主要通过缩减“特别税收措 施”和增加“⾮税收⼊”来筹资，但⾼盛分析认为这两项来源难以提供⾜够的资⾦。⾸ 先，⾮税收⼊中约⼀半来⾃外汇储备的利息收⼊，预计2027财年可额外转移约1万亿⽇ 元，但这远低于5万亿⽇元的缺⼝。其次，特别税收措施的缩减已在2026年预算中实施， 进⼀步⼤幅缩减的空间有限，且⾯临政治阻⼒。\u0001 2.外汇储备资本收益转⼊预算⾯临制度和程序障碍，短期内难以实现。虽然外汇储备因⽇元 贬值积累了超过80万亿⽇元的留存收益（含未实现资本收益），理论上可转⼊政府预算， 但实际上缺乏明确的财务省程序允许将外汇留存收益直接转⼊⼀般账⼾。此外，若要通过 出售外汇资产变现，可能引发市场波动或需发⾏融资票据，这本质上仍增加了政府债务负 担，且⽴法修订耗时较⻓，⽆法赶上2027财年预算编制。\u0001 3.⻓期财政可持续性更取决于2029年引⼊的永久性可退还税收抵免的资⾦来源。相⽐为期 两年的临时性消费税削减，2029年起计划引⼊的永久性可退还税收抵免（基准情景下每年 约3万亿⽇元）对公共债务与GDP⽐率的影响更为深远。由于外汇盈余波动⼤且特别税收 措施缩减空间有限，为这⼀永久性减税寻找稳定的永久资⾦来源极具挑战性，若失败将显 著加剧⽇本⻓期的财政⻛险。\u0001 4.名义上不使⽤⾚字融资债券并不意味着国债发⾏总量不增加。政府预算中，国债发⾏并不 ⼀定与特定⽀出或减税挂钩。政府可以声称利⽤⾃然增加的税收收⼊来资助减税，但这可 能导致原本应由⾃然增收覆盖的其他⽀出转⽽依赖⾚字融资债券。因此，投资者应关注的 是政府国债发⾏总量的最终增加幅度，⽽⾮官⽅宣称的特定资⾦来源。\u0001 ⽇本⾮税收⼊构成：外汇储备盈余约占⼀半\u0001 看推\u0001 中东战⽕对⽯油供应的冲击远超历史，油价却\"淡定\"得反常\u0001 全球⻩⾦⼤发现枯竭：连续两年零重⼤发现，创历史⾸次\u0001 AI\u0001Token使⽤量七个⽉暴涨超10倍：从6.4万亿到69万亿\u0001 关税影响减弱：多类消费品价格涨幅回落\u0001 关税阴影下，美国铜进⼝量激增\u0001 美国劳动 ，长鑫链条设备公司明年新签订单增速持续高企。精智达作为长鑫敞口最大的设备公司，去年半导体订单基本都来自于长鑫，今年总订单中逾50%来自于长鑫，将最为受益。", "content": "【东方通信-半导体】长鑫敞口最大的公司——精智达，十年磨一剑，霜刃未曾试 距产业调研，长鑫明年扩产量级有望15-20万片，beat市场最乐观预期，长鑫链条设备公司明年新签订单增速持续高企。精智达作为长鑫敞口最大的设备公司，去年半导体订单基本都来自于长鑫，今年总订单中逾50%来自于长鑫，将最为受益。15-20万片扩产对应75-100亿测试机，公司在长鑫将达到至少60%以上份额，对应明年超过50亿长鑫订单。 在下一代际的18Gbps FT超高速机上，精智达取得了重大突破，关键的ASIC芯片进展十分顺利，已经进入击球区。去年9Gbps FT的验证标志性事件就是3月底的ASIC芯片验证顺利，半年后整机验证通过拿到了首台订单，这一次也类似。在9Gbps FT率先突破的精智达，再一次在18Gbps FT率先实现了安打。你可以一直相信精智达！ 欢迎联系：舒迪/王传晟#文字观点", "publish_time": "2026-08-13 11:32", "tags": ["文字观点"]}, "attachment:files/拥抱AI算力新材料黄金周期20260812.pdf": {"id": "attachment:files/拥抱AI算力新材料黄金周期20260812.pdf", "kind": "attachment", "title": "拥抱AI算力新材料黄金周期20260812", "source_label": "其他", "excerpt": "拥抱 AI 算力新材料黄金周期 20260812 要点总结 1.核心逻辑：AI 算力爆发驱动上游材料量价估值三重共振 2026 年建材行业整体总量承压、结构极致分化，但 AI 相关新材料是穿越周期的高景气主线。底层传导链：算力需求爆发 → AI 服务器、高速交换机、光模块迭代升级 → PCB 向更高层数、更 高频更高速演进 → 先进封装技术突破 → 对 ", "content": "拥抱 AI 算力新材料黄金周期 20260812 要点总结 1.核心逻辑：AI 算力爆发驱动上游材料量价估值三重共振 2026 年建材行业整体总量承压、结构极致分化，但 AI 相关新材料是穿越周期的高景气主线。 底层传导链：算力需求爆发 → AI 服务器、高速交换机、光模块迭代升级 → PCB 向更高层数、更 高频更高速演进 → 先进封装技术突破 → 对 PCB 基材和半导体封装载板提出全新性能要求。 关键概念为“乘数效应”：AI 基建对材料端的拉动不仅是数量增加，而是数量增加、用量提升、单 位价值量提升三者的叠加，需求弹性远大于服务器出货量本身的增长。 2.两条投资主线：PCB 上游材料（电子布）与玻璃基板 第一条主线：PCB 上游材料（电子布）正兑现业绩和涨价，属于相对确定性的机会，赚当下的钱。 第二条主线：玻璃基板面向未来先进封装解决方案，产业化正在加速，属于成长性机会，赚未来卡 位的钱。 两条主线一近一远，共同构成 AI 新材料黄金周期的核心投资方向。 3.AI PCB 与 AI CCL 市场规模高速增长 根据电子团队测算，AI PCB 整体市场规模 2027 年同比增长 110%以上，处于翻倍级别的高速增长 通道，2027 年约 380 亿美金体量，其中光模块相关弹性最大。 AI 全球 CCL 规模：2026 年约 210 亿美金，2027 年接近 291 亿美金；其中 AI CCL 从 2026 年约 55 亿美金快速增长到 2027 年接近 115 亿美金，接近翻倍增长。 市场对该赛道预期持续上修，未来几年 AI PCB 和 AI CCL 复合增速均为两到三位数量级的同比增 长。 4.乘数效应的量化拆解：用量提升与价值量升级 以英伟达 GB200 和 GB300 架构对比：PCB 层数已攀升至 28-34 层，需搭载 M7 级别超低损耗介 质；下一代服务器 PCB 层数可能突破 40 层，材料等级升级至 M8-M10 级别。 行业整体：AI 服务器 PCB 平均层数从 2023 年的 18 层快速增长至 2025 年的 32 层。 单台 AI 服务器对 CCL 的需求量约为传统服务器的 5-7 倍。 以英特尔为例，AI 服务器所需 CCL 平均均价较传统平台有翻倍增长。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 价值量拆分：GPU 的 ASP 约为通用服务器的 10 倍，PCB 价值量提升约 6 倍，CCL 价值量增长约 4 倍。 无论是英伟达 GPU 路线还是各大云厂 ASIC 路线，材料升级方向和节奏高度一致，均向 M8/M9、 二代布、Q Glass 等高端产品快速升级迁移；量产时间集中在 2026-2027 年，为上游材料高景气提 供确定的需求锚点。 5.供给端约束：技术壁垒高、扩产周期长、产能刚性 用于 AI 服务器、交换机、载板的高频高速材料（特种电子布、四代/五代铜箔、PPO 和碳氢树脂 等）普遍存在较大供需缺口。 原因包括：技术壁垒高、量产难度大、良率提升难度大；扩产和认证周期长（多需 1-2 年以上）； 产业处于起步阶段，短期扩产节奏跟不上需求爆发速度。 普通材料也开始出现供给紧张：核心生产设备被挤占（高端电子布与普通电子布通用的织布机交付 周期长且依赖进口），AI 需求爆发持续挤占传统领域供给；企业资本开支均投向 AI 方向，普通材 料产能投放非常有限。 6.材料端升级路径系统梳理 CCL：从 M6 快速推进到 M7-M8，加速向 M9-M10 迈进。 电子布：从 E-Glass 转向 Low DK 1 代、2 代、3 代，再到 Q Glass；特种电子布供给相对集中、弹 性低，是材料链重要瓶颈之一，且特种布挤压普通布产能，导致各品类电子布均出现供给紧张。 铜箔：从一代、二代向四代升级，成为 AI 主流，目前四代供应相对紧缺，未来还将升级到五代。 树脂：从环氧树脂向 PPO、碳氢树脂升级，PTFE 方案也在测试中；电子级 PPO 和碳氢树脂相对紧 缺。 7.电子布产业链与价值量分析 产业链：电子纱 → 电子布 → 覆铜板（CCL）→ PCB，价格沿此链条向下游传导。 生产流程：电子纱经整经、上浆、织造、后处理制成电子布；电子布浸渍树脂、附铜箔压合为 CCL；CCL 再加工成 PCB。 价值量占比：玻纤电子布约占 CCL 成本 20%，CCL 约占 PCB 成本 30%-40%；电子布在 PCB 成本 占比不到 10%，但技术壁垒高、供给刚性最强，涨价弹性和确定性较强。 分类维度：按厚薄分为厚布、薄布、超薄布、极薄布（越薄技术难度越高、信号传输越快、附加值 越高）；按性能分为普通布、Low DK、Low CTE、Q Glass。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 性能梯度价值差异：E-Glass 介电损耗约 0.006，用于普通消费电子；Low DK 2 代降至约 0.0019，为 AI 服务器标配；Q Glass 的 Df 值降至 0.0004，介电和热膨胀极低，面向超高速交换 机、AI 芯片载板、顶级服务器方案。 8.电子布高景气：量价齐升，Low DK 2 代布为当下最有弹性方向 自 2025 年 Q4 以来，普通电子布库存快速下降、价格持续上涨，行业步入涨价大周期。 Low DK 2 代布市场：2025-2026 年需求增长 40%以上，2026-2027 年维持高增长；2025 年 Low DK 电子布应用领域中 AI 服务器和交换机占 72.3%，为绝对主力，其余为光模块、车载雷达等 场景，需求高度绑定 AI。 放量节奏：随着英伟达 Rubin、谷歌 TPU v8/v9、亚马逊服务器及 800G/1.6T 交换机陆续量产， M7/M8/M9 CCL 渗透率快速提升，预计 2026 年下半年需求迎来快速释放；M8 为当前 CCL 出货 主力，主要使用 Low DK 2 代布，M9 可能用 2 代布控制成本。 供给端壁垒：2 代布熔融温度接近 7 布，纱线更细更脆、断纱率更高，布面缺陷控制难度大；国内 厂家扩产速度较慢，海外企业扩产意愿较弱，短期扩产节奏难以匹配需求高速增长。 判断：Low DK 2 代布供需缺口显性，价格有望随需求放量上涨，是未来半年到一年最确定的弹性 方向。 9.普通电子布（1 代布）涨价节奏与供需测算 自 2025 年 Q4 起普通电子布逐月涨价，近期涨幅加大，薄布涨幅大于厚布。 7628 系列薄布价格从年初 4.7 元涨至 7 月份 8.6 元，8 月份进一步上涨；行业基本处于零库存状 态，存在明确供需缺口，预计后续仍有较大涨价空间。 涨价主因：供给端 AI 和薄布挤占织布机产能，电子纱新增产能较少；需求端消费电子偏弱但 ECS 整体需求好于预期，AI、新能源汽车、充电桩、储能等均在拉动需求。 供需测算（三类情景假设：消费电子需求悲观/中性/乐观分别同比下滑 20%/15%/10%，通信同比 增长 20%，汽车同比增长 2%，其他产业同比增长 10%）：中性预期下 2026 年普通电子布存在供 需缺口，2027 年缺口进一步放大。 10.供给双重制约：织布机与电子纱两把锁 织布机缺口：2026 年缺口约 600 台，2027 年缺口约 1000 台（中性情景）。 缺口形成原因：AI 需求快速增长；薄布占比提升。生产效率排序：AI 电子布织布机效率低于 E- Glass 薄布，再低于普通厚布；AI 电子布和薄布良率要求更高，优先占用织布机，导致有限织布机 被高端产品挤占，挤占效应从 AI 电子布传导至薄布、厚布。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 织布机核心供应商为日本丰田，国产织布机在张力控制、良率稳定性上仍有差距，设备端瓶颈决定 供给刚性。 电子纱紧缺：2026-2028 年电子纱 50G 代代产能同比增长约 11%、3%和 6.4%，新增产能有限； 考虑产品结构升级（网包布升级）和织布机限制，实际产能增速可能更低。 现实印证：5-7 月 775 电子纱价格环比涨幅高于 7628 电子布，说明电子纱同样紧张。 电子纱和电子布均为重资产行业，企业资本开支重心转向利润率更高的 AI 电子布，新增供给预计长 期保持低位，拉长本轮景气周期。 11.玻璃基板：面向下一代先进封装的成长性机会 背景：AI 算力需求推动半导体产业从单纯追求先进制程转向先进制程、先进封装、先进材料三者协 同演进。 传统材料在尺寸拓展、翘曲控制、介电损耗、CTE 值匹配等方面约束显现，玻璃基板凭借高平整 度、低介电损耗、尺寸稳定性好、CTE 值可调等优势补上缺口。 玻璃不仅是结构支撑材料，还可通过 TGV、RDL 多层互联等工艺升级为高密度互联平台，成为 AI 时代先进封装不可或缺的材料。 产业化信号：英特尔、台积电等巨头均在发力，产业化节奏明显加快；康宁推出下一代玻璃光互联 组件“玻璃桥”，将玻璃基板功能从结构支撑和电互联载体升级为集成电互联、光波导、光耦合、 封装接口的光电协同平台，单位面积价值量显著提升。 12.玻璃基板市场规模与国产化进展 IC 载板市场：2024 年先进载板市场约 142 亿美金，在 AI 需求推动下 2030 年有望达到 300 亿美 金。 玻璃基板凭借 Low CTE 值、Low DK 值、尺寸稳定性和平整度优势，有望在高档场景逐步替代传统 有机基板；当前渗透率极低，潜在空间广阔，远期市场空间为千亿级别。 国内进展：国产玻璃基板已逐步形成“终端需求牵引、封测平台验证、国产材料及加工配套”的完 整产业链雏形，在华为等终端需求牵引下，国产替代进度有望加快。 投资方向：围绕原片、精加工、辅材三大环节，优选有实质产业布局、核心工艺能力、客户验证进 展的公司。 13.投资结论与建议 AI 算力爆发给上游新材料带来量价估值三重共振的黄金周期，AI 材料是穿越周期核心主线。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª PCB 上游材料（电子布为代表）：核心抓手是量价弹性，建议关注未来几个季度最为紧缺的 AI 电 子布方向——紧缺主线为 2 代布，紧缺副线为 T 布；同时关注传统 1 代布涨价和供给变化节奏；四 代铜箔相对紧缺、国产替代空间大；电子级 PPO 和碳氢树脂相对紧缺。供给刚性背景下，龙头企业 有望迎来量价提升、业绩弹性超预期的投资机会。 玻璃基板：核心抓手是跟踪产业化变化，把握领先布局、客户验证领先的标的，有望率先享受估值 重塑机会。 问答整理 Q1：为什么说 AI 材料的需求弹性会远大于服务器出货量本身的增长？ 答：核心在于“乘数效应”。AI 基建对材料端的拉动不是简单的数量增加，而是数量增加、用量提 升、单位价值量提升三者的叠加。以单台 AI 服务器为例，对 CCL 的需求量是传统服务器的 5-7 倍， PCB 层数从 2023 年的 18 层增长到 2025 年的 32 层，材料等级从 M6 升级到 M7/M8 甚至 M9/M10，CCL 均价翻倍增长。因此，即使服务器出货量增速有限，材料端的需求弹性也会被大幅放 大。 Q2：AI PCB 和 AI CCL 的市场规模有多大？增速如何？ 答：根据电子团队测算，AI PCB 整体市场规模 2027 年同比增长 110%以上，2027 年约 380 亿美金体 量，其中光模块相关弹性最大。AI 全球 CCL 规模 2026 年约 210 亿美金，2027 年接近 291 亿美金； 其中 AI CCL 从 2026 年约 55 亿美金快速增长到 2027 年接近 115 亿美金，接近翻倍增长。未来几年 复合增速均为两到三位数量级，且预期还在持续上修。 Q3：电子布在 PCB 产业链中的价值量占比如何？为什么它是本轮升级中弹性最大的环节？ 答：玻纤电子布约占 CCL 成本 20%，CCL 约占 PCB 成本 30%-40%，电子布在 PCB 成本占比不到 10%。虽然成本占比不高，但电子布是这轮升级中技术壁垒相对较高、供给相对刚性的环节，因此涨价 的弹性和确定性都比较强。 Q4：电子布如何分类？不同性能等级的价值差异有多大？ 答：按 K海⼒⼠的⼈才\u0001 • ⻢斯克：五年后AI占SpaceX价值99%，我们必须取得AI的胜利；押注AI代理赛道，SpaceX\u0001AI推出 Grok\u0001Bot，对标Anthropic与OpenAI\u0001 • 追平OpenAI！Gemini⽉活⽤⼾突破10亿，为⾕歌史上增速最快产品\u0001 • Lumentum电话会：CEO称“超⼤功率激光器需求正远超产能”，“NPO机会完全是增量” \u0001 • 从奢侈品到廉价符号，钻⽯市场正加速崩溃\u0001 今⽇⽬录\u0001 • 腾讯⼴告加速但⾃由现⾦流转负（1）\u0001 • 英特尔靠涨价抢回营收份额（1）\u0001 • AI数据中⼼电源⾰命来了（1）\u0001 • ⽇本减税钱从哪来（1）\u0001 ✏GS：腾讯控股，2026年第⼆季度业绩初评\u0001 1.⼴告收⼊超预期增⻓，AI赋能成效显著。第⼆季度⼴告收⼊同⽐增⻓22%，加速于⼀季度 的20%及⾼盛预期的18%。这⼀增⻓主要得益于AI技术增强以及闭环交易模式的推动，显 ⽰出公司在营销服务领域的强劲动⼒。\u0001 2.资本⽀出⼤幅上升影响⾃由现⾦流，但具备下⾏保护。第⼆季度资本⽀出激增⾄530亿元 ⼈⺠币（⼀季度为320亿元），导致⾃由现⾦流转负⾄-140亿元。市场关注点集中在资本 ⽀出前景、投资回报率及折旧对下半年的影响。公司指出，若需控制成本，可通过腾讯云 以有吸引⼒的价格租赁外部AI基础设施，从⽽提供下⾏保护。\u0001 3.AI战略聚焦新特许经营产品，混元与⼯作助⼿进展良好。公司战略重⼼转向AI特许经营产 品（如混元Hy、⼯作助⼿WorkBuddy和⼩微Xiaowei）。第⼆季度新AI产品亏损1 05亿元 （⼀季度为88亿元）。混元3（Hy3）在产品集成⽅⾯取得显著进展，参数更⼤的混元4 （Hy4）预计今年晚些时候发布；⼯作助⼿在中国⽣产⼒AI办公代理中⽤⼾数处于领先地 位。\u0001 4.游戏业务符合预期，国内增⻓加速抵消国际疲软。游戏收⼊同⽐增⻓11%，符合市场预 期。其中国内游戏收⼊增⻓加速⾄17%，主要受《王者荣耀》和《洛克王国》贡献；国际 游戏收⼊同⽐下降1%，《VALORANT》和《PUBG\u0001MOBILE》的增⻓被Supercell系列表 现放缓所抵消。\u0001 5.⾦融科技与云业务稳健增⻓。⾦融科技收⼊在⽀付、财富管理和消费贷款服务增加的推动 下实现增⻓。云收⼊增速加速⾄低⼆⼗位数百分⽐，主要受益于AI需求、国际扩张及通⽤ 云服务\u0001uptake\u0001的增加。\u0001 ✏瑞银：CPU⾏业更新，2026年第⼆季度出货量超预期，英特尔营收 份额改善\u0001 1.服务器CPU出货量超越季节性常态，ARM与AMD在单位份额上持续增⻓，但英特尔在营 收份额上有所回升。2026年第⼆季度，服务器CPU总出货量环⽐增⻓约9%（同⽐增⻓ 27%），优于通常的+1%季节性表现。尽管ARM和AMD在单位出货量上的份额继续增⻓ （ARM环⽐增40bps⾄17.6%，AMD增90bps⾄28.4%，英特尔降140bps⾄53.9%），但 在x86市场的营收份额⽅⾯，英特尔环⽐增加了160个基点⾄55.4%。这主要得益于英特尔 平均售价（ASP）环⽐上涨22%，⽽AMD仅上涨7%。\u0001 2.PC\u0001CPU出货量⼤幅反弹，英特尔虽失单位份额但获营收份额提升。第⼆季度PC\u0001CPU总出 货量环⽐增⻓10%，远⾼于五年中位数-2%，标志着在⼀季度下降13%后的强劲反弹。其 中笔记本单元环⽐增⻓16%，⽽台式机单元下降7%。在单位份额上，英特尔流失110个基 点⾄59.1%，AMD增加30个基点⾄25.6%，ARM增加90个基点⾄15.3%。然⽽，在营收⽅ ⾯，英特尔在笔记本和台式机市场的份额分别环⽐增加210个基点和240个基点，得益于 其PC\u0001ASP环⽐上涨9%，⽽AMD\u0001ASP环⽐下降6%。\u0001 3.2026年PC市场前景谨慎，预计全年单位出货量将下降。鉴于内存价格通胀以及产品组合 向⾼端倾斜，低端⾄中端PC需求受到抑制。UBS预测2026年全球PC单位出货量将同⽐下 降约11%，其中台式机下降约13%，笔记本下降约10%，全年全球PC出货量约为2.42亿 台。2027年预计仅恢复2%的年增⻓率，原因是内存价格持续⾼企及Windows\u000111过渡后 的替换周期正常化。\u0001 4.CPU市场竞争加剧，多架构并存成为趋势。随着更多⼚商进⼊CPU市场，竞争⽇益激烈。 ARM预计在2027年推出136核⼼的AGI平台，⾼通⽬标在2028年推出250+核⼼CPU。英特 尔的服务器路线图因Coral\u0001Rapids的推出及多线程技术的回归⽽更具竞争⼒。不同⼯作负 载对架构的需求多样化，如代理编码⼯作负载⻘睐低核⼼数、低延迟设计（如NVDA的 Grace），⽽⾮编码⼯作负载则\u0001favor\u0001⾼核⼼数和多线程性能（利好AMD）。\u0001 英特尔、AMD和ARM整体CPU市场份额（按出货量）\u0001 ✏瑞银：AIDC电源架构2.0，固态变压器（SST）机遇与新份额增⻓周 期\u0001 1.固态变压器（SST）将成为AIDC⾸选电源架构，2030年渗透率有望达40%。随着AI数据 中⼼（AIDC）机架功率密度持续上升，电源架构升级迎来拐点。SST凭借更⾼效率、更⼩ 占地和更好的集成灵活性，预计将从2027年下半年开始抢占市场份额，到2030年在AIDC 领域的渗透率将从2027年的不⾜5%提升⾄40%，成为AIDC电源系统的⾸选架构。\u0001 2.SST具备显著的经济性和技术优势，可降低AIDC总拥有成本（TCO）14%。相⽐传统不 间断电源（UPS），SST可将电⼒效率提⾼约4%，减少40-50%的铜⽤量，并将占地⾯积 减少80%。尽管SST的前期成本是UPS的两倍以上，但由于架构简化、能源损失降低和运 营⽀出节省，预计可使AIDC的TCO降低14%，从⽽提升每⽡特代币产出，推动云服务提供 商（CSP）更快采⽤。\u0001 3.中国供应商有望凭借技术和成本优势⻓期收获市场份额。虽然海外电源系统巨头⽬前主导 SST演进，但瑞银认为中国公司凭借在电⼒电⼦、⾼压碳化硅（SiC）器件、⾼频变压器 和中压绝缘⽅⾯的技术专⻓，以及制造规模和成本优势，将在⻓期获得市场份额。具备系 统集成能⼒和客⼾渠道优势的企业将最能捕捉CSP的需求。\u0001 4.上调阳光电源盈利预测，重申“买⼊”评级。瑞银认为阳光电源（Sungrow）和科⼠达 （Kstar）是SST领域的主要受益者。鉴于SST业务潜在的盈利贡献，瑞银将阳光电源 2028-2030年的每股收益（EPS）预测上调5-18%，并重申对其“买⼊”评级，⽬标价上 调⾄165元⼈⺠币。\u0001 英伟达机架功率代际演进\u0001 ✏GS：探索⽇本消费税削减的资⾦来源，⾮税收⼊与特别税收措施难 以填补缺⼝\u0001 1.通过⾮税收⼊和缩减特别税收措施完全覆盖约5万亿⽇元消费税削减缺⼝的难度极⼤。尽 管⽇本政府表⽰不依赖国债为⻝品消费税削减提供资⾦，⽽是主要通过缩减“特别税收措 施”和增加“⾮税收⼊”来筹资，但⾼盛分析认为这两项来源难以提供⾜够的资⾦。⾸ 先，⾮税收⼊中约⼀半来⾃外汇储备的利息收⼊，预计2027财年可额外转移约1万亿⽇ 元，但这远低于5万亿⽇元的缺⼝。其次，特别税收措施的缩减已在2026年预算中实施， 进⼀步⼤幅缩减的空间有限，且⾯临政治阻⼒。\u0001 2.外汇储备资本收益转⼊预算⾯临制度和程序障碍，短期内难以实现。虽然外汇储备因⽇元 贬值积累了超过80万亿⽇元的留存收益（含未实现资本收益），理论上可转⼊政府预算， 但实际上缺乏明确的财务省程序允许将外汇留存收益直接转⼊⼀般账⼾。此外，若要通过 出售外汇资产变现，可能引发市场波动或需发⾏融资票据，这本质上仍增加了政府债务负 担，且⽴法修订耗时较⻓，⽆法赶上2027财年预算编制。\u0001 3.⻓期财政可持续性更取决于2029年引⼊的永久性可退还税收抵免的资⾦来源。相⽐为期 两年的临时性消费税削减，2029年起计划引⼊的永久性可退还税收抵免（基准情景下每年 约3万亿⽇元）对公共债务与GDP⽐率的影响更为深远。由于外汇盈余波动⼤且特别税收 措施缩减空间有限，为这⼀永久性减税寻找稳定的永久资⾦来源极具挑战性，若失败将显 著加剧⽇本⻓期的财政⻛险。\u0001 4.名义上不使⽤⾚字融资债券并不意味着国债发⾏总量不增加。政府预算中，国债发⾏并不 ⼀定与特定⽀出或减税挂钩。政府可以声称利⽤⾃然增加的税收收⼊来资助减税，但这可 能导致原本应由⾃然增收覆盖的其他⽀出转⽽依赖⾚字融资债券。因此，投资者应关注的 是政府国债发⾏总量的最终增加幅度，⽽⾮官⽅宣称的特定资⾦来源。\u0001 ⽇本⾮税收⼊构成：外汇储备盈余约占⼀半\u0001 看推\u0001 中东战⽕对⽯油供应的冲击远超历史，油价却\"淡定\"得反常\u0001 全球⻩⾦⼤发现枯竭：连续两年零重⼤发现，创历史⾸次\u0001 AI\u0001Token使⽤量七个⽉暴涨超10倍：从6.4万亿到69万亿\u0001 关税影响减弱：多类消费品价格涨幅回落\u0001 关税阴影下，美国铜进⼝量激增\u0001 美国劳动成本增⻓放缓，通胀降温在望\u0001 ⻩⾦ETF中的散⼾情绪：追涨杀跌的典型模式\u0001", "status": "extracted"}, "post:2026-08-13T07-43:193bab74d92f": {"id": "post:2026-08-13T07-43:193bab74d92f", "kind": "post", "title": "2026-08-13 07:43", "source_label": "帖子正文", "excerpt": "Lumentum业绩会要点和观点FY26Q4收入同比+109%、环比+24%至10.1亿美元，#连续第8个季度收入增长、连续第3个季度环比增长超20%；Non-GAAP毛利率环比+2.5pct至50.4%，营业利润率环比+4.4pct至36.6%，EPS 3.23美元。", "content": "Lumentum业绩会要点和观点FY26Q4收入同比+109%、环比+24%至10.1亿美元，#连续第8个季度收入增长、连续第3个季度环比增长超20%；Non-GAAP毛利率环比+2.5pct至50.4%，营业利润率环比+4.4pct至36.6%，EPS 3.23美元。激光芯片方面，需求持续强劲。200G EML收入占EML总收入#已超过25%，EML与CW激光器预计26H2至2027年持续高增；泵浦激光器出货同比+80%，快速扩产下仍供不应求，预计未来几个季度#出货进一步增长4倍，并已与多家客户签署长协。光模块方面，#本季度以800G为主，1.6T已开始出货，并预计自下季度加速放量、持续至2027年。OCS方面，#本季度出货环比翻倍，FY27Q1预计首次实现单季收入超1亿美元；26H2约4亿美元收入目标仍按计划兑现，2027年需求信号强劲，公司同步推进内部扩产及外部代工。OCS需求由#多年期、数十亿美元Purchase Agreement支撑。CPO方面，核心客户生产计划未推迟、需求信号进一步增强；预计#超高功率激光芯片27H2开始放量，对应客户Scale-up光互联于2028年部署...", "publish_time": "2026-08-13 07:43", "tags": ["文字观点"]}, "post:2026-08-13T09-08:f54e780fa8b2": {"id": "post:2026-08-13T09-08:f54e780fa8b2", "kind": "post", "title": "2026-08-13 09:08", "source_label": "帖子正文", "excerpt": "【ZX通信】Coherent FY26Q4业绩全面超预期，AI光互联景气度持续验证！Coherent FY26Q4营收20.5亿美元（同比+34%），Non-GAAP EPS 1.74美元（同比+74%），毛利率40.2%（同比+215bps），均超市场预期。", "content": "【ZX通信】Coherent FY26Q4业绩全面超预期，AI光互联景气度持续验证！Coherent FY26Q4营收20.5亿美元（同比+34%），Non-GAAP EPS 1.74美元（同比+74%），毛利率40.2%（同比+215bps），均超市场预期。FY27Q1指引收入22-24亿美元，EPS 1.85-2.05美元，中值较一致预期高8%和10%；FY27Q4收入将突破30亿美元，毛利率随磷化铟扩产持续抬升，订单已排至CY28 ！800G产能稳增，1.6T爬坡快于3个月前预期，全年订单基本排满。磷化铟仍是核心瓶颈，本季度末产能同比翻倍（提前一季），CY27年末再翻倍；6英寸产线良率已超3英寸，成本优势显著。CPO无推迟、NPO并行深化，过去3-6个月CSP参与度显著提升，对COHR二者价值量接近；PhotonLink平台9月发布，定位集成光学一站式方案，预计12月贡献收入，CPO将先在Scale-out放量，Scale-up预计27下半年贡献收入。CEO表示，目前光模块进口限制仅为传闻，若未来落地，公司作为美系最大光模块供应商将直接受益。建议关注：#汇绿生态：Coherent...", "publish_time": "2026-08-13 09:08", "tags": ["汇绿生态", "文字观点"]}, "post:2026-08-13T10-06:b245dd77f3e2": {"id": "post:2026-08-13T10-06:b245dd77f3e2", "kind": "post", "title": "2026-08-13 10:06", "source_label": "帖子正文", "excerpt": "【申万计算机】电芯片-与光同行：国产化拐点20260813#近期MACOM电话会强调TIA、Driver机会： 1）TIA/Driver市场规模与激光器/探测器相当 2）NPO架构仍需TIA、Driver，器件不可替代，且要求小型化、多通道、低功耗 3）MACOM业绩beat原因为单波100G、20", "content": "【申万计算机】电芯片-与光同行：国产化拐点20260813#近期MACOM电话会强调TIA、Driver机会： 1）TIA/Driver市场规模与激光器/探测器相当 2）NPO架构仍需TIA、Driver，器件不可替代，且要求小型化、多通道、低功耗 3）MACOM业绩beat原因为单波100G、200G电芯片 #AAOI创始人同样点出TIA、Driver重要性 “我们面临的最大运营挑战，是800G和1.6T光模块所需的DSP和TIA芯片。” AOI 正在与 DSP/TIA 供应商每周进行密切沟通，以争取更多供应量，并愿意为获取供应#支付更高的溢价。#国内光通信电芯片产业迈入导入期DSP：集益威、韬润半导体等进入上市流程，400G DSP已有应用 TIA、Driver：优迅股份、中晟微、英思嘉等进入单波100G、200G产品导入期 建议重点关注： 优迅股份、金字火腿、博泰车联、裕太微等#文字观点", "publish_time": "2026-08-13 10:06", "tags": ["近期MACOM", "支付更高的溢价", "国内光通信电芯片产业迈入导入期", "文字观点"]}, "attachment:files/Nomura-全球AI趋势追踪：Lumentum业绩的传导效应.pdf": {"id": "attachment:files/Nomura-全球AI趋势追踪：Lumentum业绩的传导效应.pdf", "kind": "attachment", "title": "Nomura-全球AI趋势追踪：Lumentum业绩的传导效应", "source_label": "Nomura", "excerpt": "EQUITY: TECHNOLOGYGlobal AI Trend TrackerGlobal Markets Research 12 August 2026 Read-through on LITE results Quick Note Lumentum (LITE US, Not rated) reported its June quarter resu", "content": "EQUITY: TECHNOLOGYGlobal AI Trend TrackerGlobal Markets Research 12 August 2026 Read-through on LITE results Quick Note Lumentum (LITE US, Not rated) reported its June quarter results on 12 August after US market close. Management discussed product development progress and supply-demand for EML (Electro-absorption Modulated Laser) and CW (Continuous Wave) laser, NPO (Near Packaged Optics) and OCS (Optical Circuit Switch). From the earnings call, we think the demand for both 100G/200G EML and high-power CW lasers remains robust in FY26-27F, with unchanged supply-demand imbalance. We think the shortage of optical chips globally should offer an opportunity for Yuanjie Technology (688498 CH, Buy) to gain global market share in optical laser chips. Moreover, the shortage of optical chips also validates a continued uptrend for the optical transceiver market in FY26-27F, while technology upgrades (800G to 1.6T and SiPh) and component shortages should benefit market leaders, i.e., InnoLight (300308 CH, Buy), who has strong execution on supply chain management, in our view. In addition, we think NPO should be an incremental opportunity for the optical communication sector, which is beneficial to Yuanjie, Innolight and TFC (300394 CH, Buy), in our view. Company performance and guidance 4QFY26 revenue surged 109% y-y to USD1.01bn, driven by scale out and scale up across product lines.• Components revenue in 4QFY26 was USD649mn, reflecting 22% q-q and 103% y-y growth, with laser portfolio continuing to demonstrate strong momentum across every sector. Shipments of narrow-line width laser assemblies grew over 130% y-y.• Pump laser shipments grew 80% y-y, and management expects a 4x increase over the next several quarters , remaining effectively ‘sold out’ despite its rapid capacity expansion. The company holds a market share of 70-80% in pump lasers and has a technology roadmap to increase price and output.• For laser chips, the company delivered another record-breaking quarter for EMLs, primarily driven by strong demand for 100G devices. Momentum for 200G EML s is also accelerating rapidly, now accounting for over 25% of total EML revenue .• 4QFY26 systems revenue reached USD357mn, representing a 30% q-q and 123% y-y increase, driven by both cloud transceivers and OCS. For cloud transceivers, LITE achieved record 800G shipments while initiating production of 1.6T modules .• Management expects the 1.6T transceiver uptake to intensify starting in 1QFY27E, and sustain through calendar 2027E .• Management anticipates 1QFY27E net revenue to be USD1.225-1.275bn, with the USD1.25bn midpoint reflecting over 130% y-y growth.• EML and CW laser: strong demand signal for both EML and CW lasers in 2H26E and 2027E Management expectsdemand for both EML and CW lasers to grow significantly in 2H26E and 2027E . To capture the coming 200G/300G EML opportunities, LITE is expanding capacity across two Indium phosphide (InP) wafer fabs in Japan .• The company remains on track to deliver over 50% y-y EML unit growth by the December-2026 quarter , while the company is allocating additional capacity to CW lasers. •Research Analysts China Technology Bing Duan - NIHK bing.duan1@nomura.com +852 2252 2141 Ethan Zhang - NIHK ethan.zhang@nomura.com +852 2252 2157 See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts.Production Complete: 2026-08-12 06:22 UTC Management still sees a significant supply-demand imbalance in CW and EMLs lasers.• Management remains confident in a demand ramp-up for ultra-high power laser chips in 2H27E, ahead of customer scale-up deployments in 2028E.• Management noted CW lasers are capturing a significant portion of transceiver output, particularly for 1.6T silicon photonics applications, while EMLs are anticipated to regain meaningful share at 3.2T.• The die size of CW lasers has been significantly reduced, improving performance and allowing for a considerable closing of the margin gap with EMLs, lthough EMLs remain better.• Both 200G EML and CW lasers are accretive to corporate margins, with 200G EMLs currently representing 25% of the mix margin and projected to exceed 50% by mid-2027E .• InP: locked additional InP substrate from AXT Management noted that the demand for ultra-high-power lasers has surprisingly surged, necessitating additional Indium phosphide substrate supply. Lumentum has secured additional substrate help from AXT (AXTI US, Not rated) to respond to this surge in demand.• The company is actively seeking to sign long-term agreements for more capacity at its Greensboro facility, with potential new arrangements expected in the coming quarters.• NPO: projected to be largely commercialized in late 2027E-2028E The part of customer base is currently prioritizing near packaged architectures (NPO) as an intermediate step to the eventual adoption of CPO.• Management noted NPO is an incremental opportunity not fully factored into prior financial targets, which significantly increasing the optical TAM.• Customers are evaluating two types of laser chips for NPO, a mid-power laser integrated directly with the optical engine, and a high-power laser used in an external light source (ELS) module.• LITE were recently given first ELS module purchase for delivery by 2H27.• The timing for NPO opportunities is similar to the lead CPO customer's scale-up, with high-powered laser types expected sooner, and NPO is projected to reach the market in late 2027E-2028E.• The family of NPO and CPO lasers utilizes common design and process know-how to achieve industry-leading efficiency across 120-milliwatt, 150-milliwatt, and 400- milliwatt output levels.• OCS: on track to reach USD400mn OCS guide for 2H26E; strong demand to continue in 2027E OCS has been doubled shipments from 3QFY26 to 4QFY26 , and the management guided triple-digit OCS revenue growth for 1QFY27 .• Management is tracking to the USD400mn OCS guide for 2H2026, having resolved earlier supply chain issues.• The demand signal for 2027 continues to be incredibly strong , according to the company, adding that it has started the initial work to add capacity with contract manufacturers, as well as continuing to increase output in its internal factories.• LITE is now planning higher and lower port count products, including specialized in- tray offerings.• Nomura | Global AI Trend Tracker 12 August 2026 2 8XvYmXMBoYqPoRsN8OdN9PnPqQpNsMjMrRyQjMrQmObRpNmMvPsOzRwMsPtN Appendix A-1 This report has been produced by Nomura International (Hong Kong) Ltd. (NIHK), Hong Kong. See Disclaimers for Nomura Group entity details. Analyst Certification I, Bing Duan, hereby certify (1) that the views expressed in this Research report accurately reflect my personal views about any or all of the subject securities or issuers referred to in this Research report, (2) no part of my compensation wa s, is or will be directly or indirectly related to the specific recommendations or views expressed in this ied on page 1 and, if applicable, with the contributions of one or more Nomura Group entities whose employees and their respective affiliations are specified on page 1 or identified elsewhere in this publication. The term \"Nomura Group\" used herein refers to Nomura Holdings, Inc. and its affiliates and subsidiaries including: (a) Nomura Securities Co., Ltd. ('NSC') Tokyo, Japan, (b) Nomura Financial Products Europe GmbH (‘NFPE’), Germany, (c) Nomura International plc ('NIplc'), UK, (d) Nomura Securities International, Inc. ('NSI'), New York, US, (e) Nomura International (Hong Kong) Ltd. (‘NIHK’), Hong Kong, (f) Nomura Financial Investment (Korea) Co., Ltd. (‘NFIK’), Korea (Information on Nomura analysts registered with the Nomura | Global AI Trend Tracker 12 August 2026 5 Korea Financial Investment Association ('KOFIA') can be found on the KOFIA Intranet at http://dis.kofia.or.kr , (g) Nomura Singapore Ltd. (‘NSL’), Singapore (Registration number 197201440E, regulated by the Monetary Authority of Singa", "status": "extracted"}, "attachment:files/Rubin Ultra NVL576规格升级，互联环节迎量价齐升.docx": {"id": "attachment:files/Rubin Ultra NVL576规格升级，互联环节迎量价齐升.docx", "kind": "attachment", "title": "Rubin Ultra NVL576规格升级，互联环节迎量价齐升", "source_label": "其他", "excerpt": "今天上午的会议由我和我们组两位同事研究员A和研究员B跟大家更新一下NV1576机柜连接形式的一些基本变化。我们可以看到，英伟达在过去三年中，推出了非常多尝试性的机柜连接形式。", "content": "今天上午的会议由我和我们组两位同事研究员A和研究员B跟大家更新一下NV1576机柜连接形式的一些基本变化。我们可以看到，英伟达在过去三年中，推出了非常多尝试性的机柜连接形式。其基本目的都是为了获取更快的互联速度和更大的集群规模，也就是我们所说的超节点或NVLink域的互联集群。这个产品的推出，更多是为了应对更大规模的训练集群和模型推理。在构建更大集群的过程中，英伟达在过去的公开场合也发布了非常多版本。其中有些版本由于技术上的瓶颈，可能被暂缓或取消。而现在又发布了一些新版本。我们看到这些版本的迭代，根本原因在于每个技术细节的突破速度不平衡。 在构建更大集群时，有几个基本的互联方向。一个是在载板或ABF层上做互联，或者interposer上的互联，如Die to Die互联或HBM与GPU的互联，速度通常最高。再往外是PCB上的互联，再往外是同一机柜内PCB之间或柜内铜缆互联。再往外是柜间互联（麻烦静下音，啊，对）。每个互联的速率也不同，难度也不一样。 现在我们看到Rubin Ultra最开始是四die版本，现在开始走向双die版本，而且即便是目前，四die版本也有很多研发路径。我们看到的根本方向是，不管英伟达实际推出的方案怎么变，其目标不变：就是做一个集群规模更大、能够共享NVLink域的集群，用于训练更大的大模型。在这个过程中，可能由于台积电CoWoS的reticle size限制、PCB层数、光互联稳定性等问题，有很多技术上的平衡和取舍，这也是过去几年NVL576版本多次更迭的根本原因。我们觉得不管最后使用哪种技术，方向和目标是非常清楚一致的。我们需要做的事情主要是跟踪这四层互联在发展中遇到的问题、攻克的技术难关，以及哪些可能放在下一代产品上推出。所以我们认为整个大的集群规模仍然在不断扩大。 这里面相关的受益方向包括载板越做越大，PCB层数变多，每块PCB上的互联密度增加，柜间通信速率提升，柜内通信速率提升，也包括这半年最热的5768机柜互联。其中两层光网络连接是核心受益方向。接下来时间，交给两位同事，研究员A主要更新NVSwitch交换机芯片产品为什么变多以及变多的核心逻辑。研究员B更多关注光通信这块。两位的汇报可能略有重叠，但没关系，大家可以从不同角度理解NV2576机柜形式的变化。下面有请研究员A更新相关内容。 研究员A（通信行业）：好的，主持人，各位领导早上好。我这边先重点讲一下Rubin Ultra NVL576或Rubin Ultra NVL72机柜与Rubin NVL72机柜的差异。Rubin Ultra不管是NVL576还是NVL72，其基础单元仍然是NVL72单rack机柜。NVL72机柜分为两个版本：不可拓展版本和可拓展版本。可拓展版本可以通过8个NVL72之间的互联拓展成为NVL576超节点形式。不可拓展版本只能采用NVL72超节点形式，不能升级为NVL576。 针对Rubin Ultra机柜，我先汇报一下Rubin Ultra NVL72与上一代Rubin NVL72机柜的差异。第一点差异在于交换托盘。Rubin Ultra NVL72机柜包含18层交换托盘，相较于Rubin NVL72提高了一倍。Rubin NVL72机柜只有9层方案，交换托盘层数实现翻倍增长。第二点差异在于PCB板。Rubin Ultra芯片的最大功耗提高到2.6千瓦，比Rubin的2.3200.3000瓦提高了300瓦。为了满足更高的供电需求和更复杂的供电密度、线路，PCB板层数从26层提高到30层。所以与Rubin NVL72相比，Rubin Ultra NVL72的重点升级环节是交换托盘和PCB。这是Rubin Ultra NVL72和Rubin NVL72之间的差异。 再汇报一下Rubin Ultra NVL72可拓展版本和不可拓展版本的差异。在不可拓展版本中，单个交换托盘只放置两颗交换芯片，即72个计算芯片对应36颗交换芯片，配比与Rubin NVL72完全一致。而在可拓展版本中，单个交换托盘放置四颗交换芯片，即4乘以18等于72颗交换芯片，计算芯片和交换芯片配比变为1比1，交换芯片需求量相较于Rubin NVL72和不可拓展版本实现翻倍。另外，不可拓展版本主要采用铜缆连接，而可拓展版本中机柜间互联会使用CPO或NPO方案。具体细节由我们组里的研究员B老师进一步分享。 那么在NVL576中，为什么需要增加交换芯片数量？或者为什么在可拓展版本NVL72中要把交换芯片与算力芯片配比提高到1比1？关键原因在于NVL576含有两层高速scale up网络。一层是机柜内的互联，72卡之间通过NVLink连接；另一层是机柜间的互联，8个NVL72之间也采用NVLink协议进行高速互联，这与不可拓展版本形成显著差异。不可拓展版本通常走以太网或IB协议，网络带宽相比NVLink低了一个数量级左右。所以，可拓展版本NVL72有两层高速scale up域网络，比不可拓展版本多了一层，因此交换芯片配比有显著提高。这就是为什么NVL576需要大幅增加交换芯片数量。 另一个问题是为什么英伟达将Rubin Ultra NVL72的交换托盘数量从九层升级到18层。我们认为关键原因在于为NVL576方案做准备。NVL576需要八个可拓展版本NVL72，而可拓展版本单个机柜需要72颗交换芯片，单层交换节点只能容纳四颗交换芯片，所以需要72除以4等于18层交换托盘。但对于不可拓展版本NVL72，内部只有36颗交换芯片。按理说九层交换托盘可以满足需求，但英伟达在不可扩展版本也使用18层交换托盘，我们认为可能是为了简化服务器组装产线。所以针对整个Rubin NVL72机柜，采用统一设计方案，不管可拓展还是不可拓展版本，大体设计雷同，以简化组装产线。这是Rubin Ultra NVL72交换托盘从九层升级到18层的核心原因。后续关于NPO和CPO的内容，请我们组内的研究员B老师做更深度解读。 研究员B（通信行业）：好的，感谢研究员A。各位老师早上好。我这边来把最近大家讨论比较多的Rubin Ultra NVL576的情况，我稍微... 主持人/通信/半导体分析师：打断一下，你有一个PPT在线上对吧？ 研究员B（通信行业）：对，在线上。 主持人/通信/半导体分析师：各位投资者如果想了解更详细，可以转到进门财经客户端看PPT内容，可能听得更清楚。 研究员B（通信行业）：好的，我继续。整体情况还是想做一个回顾。因为很多老师可能对于研究员A刚刚说的机柜形式变化，以及一些基本概念如alba和博还不太清楚，所以后面为了让大家更好理解，前面先做一定补充。 首先，这个机柜我们学习了很久。从224年开始学习NVL72机柜。从八卡的下一代25年英伟达GTC上公布的NVL72机柜，上面十个compute tray，下面八个，中间九个交换托盘，分别有72张GPU和18颗交换芯片。右边就是我们常说的拓扑结构，因为了解机柜内的通信架构，以及后面拆解NVL1576光模块数量时，最终都要回归到本质的网络拓扑结构。右边其实就是一个全互联。英伟达的NVLink一直在追求全互联。全互联就是每一颗GPU有一条链路直接连接到交换机芯片。所以整个机柜的NVLink链路就是72乘18等于1296条。我们经常聊到的5184根铜缆，是因为每条NVLink链路双向，加上差分对，再乘4，所以是5184。这是NVL72的情况。 然后我们再讲一下整个机柜的演进变化。从NVL72出来之后，到25年GTC上，老黄公布了Rubin Ultra NVL1576，基于die版本，命名基于机柜内的die数量。但本质上老黄想做的就是把scale up扩大。刚刚主持人也说了，随着模型参数量和MOE专家数量的大幅提升，我们更加追求低延迟域，尽量把模型切分或专家放在低延迟的scale up域，这也是老黄做大scale up的底层推动力。 最开始，老黄想法比较简单，追求第一性原理，希望以最低成本做scale up。朴素想法是尽量把所有芯片装在一个机柜里，机柜间互联距离短，可以用铜缆。所以他推出了我们说的开板，也就是大家常讲的NVL72，学术名叫Oberon。然后576或沿用下来的144，去年和今年年初发的144，都叫开放机柜，本质是正交背板版本。 按照最初Oberon机柜的规划，正面有四个canister，每个canister理解成一个小的NVL72或小机柜，全部插在一个里面。里面有18个刀片，每个刀片是compute tray，上面放两个物理GPU。每个物理GPU当时对应八个Rubin Ultra die。所以整个机柜共576个die，命名为Rubin Ultra NVL576。背后总共放了六个switch，一正一反插在中间的正交背板上。大家常聊的正交背板英文叫midplane，即正交中板。它本质上取消了机柜内的无源铜缆，与DAC是竞争关系，与光无关。机柜内，老黄的原则是有铜用铜，能用铜的地方都用铜，用不了铜才考虑光。所以老黄想扩大机柜，本质还是想多用铜。但随着时间的推移，从25年GTC推出Rubin Ultra 576，到26年发生了一些变化。26年GTC上老黄完全没有演示。 上一次是25年出现这个机型，整体架构发生了大变化，命名之前叫Khyber 576，后来直接改成Khyber 144。老黄解释说是重新按照物理GPU颗数命名，没有提单颗Rubin Ultra现在是几die。后来我们五月份跟市场说Rubin Ultra可能变成两die，后来被爆出因为大芯片尺寸、光罩尺寸变大后的良率问题，现在台积电那边Rubin Ultra已是两die版本。这是第一次Khyber 144的变动：正面变成两个canister，里面18个compute tray，每个tray上四颗物理实体的Rubin Ultra，背面12个switch tray。之前每个canister里一个switch tray，现在做了一个大的交换板，横跨上下两个canister，将它们互联，整个机柜大约72颗交换芯片。 上个月（7月初）市场讨论了一波Khyber机柜的变动，可能正交背板也有延迟等问题。老黄采访中说明可能会有一个better solution，更好的版本。但我们目前不知道后续形态会有什么变化，这是后续的不确定性。 整体看下来，英伟达推出的机柜从Oberon到Khyber，能够落地或持续出货稳定下来的只有Oberon版本，即我们常见的NVL72。Khyber 576已经夭折，Khyber 144目前可能有变化，但具体变化未知。所以对于老黄来说，扩大scale up域的事情推了两年，但目前还没有看到具体实现方式。 GTC上我们认为英伟达又换了其他方向尝试。26年三月份GTC上，老黄第一次提出了新的NVL576版本，但没有给出明确样机，示意图是八个Oberon NVL72组成的NVL576。老黄现场说它是一个scale up，走NVLink的版本。实际上英伟达官网的技术文档blog里能查到相关原型机，由8台GB200组成，通过二层光互联组成NVL576系统，内部命名Polyfer。所以从英伟达内部看，三月份以来他们对于576的实验或原型机已经出来了。我们认为这款设备在未来单机柜scale up难以推动、工程化落地难度较高的前提下，会成为未来很长一段时间scale up域扩大的方向和形式。 好，这是对整体机柜的回顾。现在基本上GPU侧有两个主要方向：Oberon和Khyber。但Khyber整体形态还不确定。 后续我们要大概测算每个机柜的NVLink switch数量，因为昨天讨论比较多的为什么机柜从九个switch tray变成18个。底层逻辑是芯片交换带宽的双向带宽提升，但NVLink switch的交换容量没有提升。如果看spec，从Blackwell到Rubin NVL72到Rubin Ultra三代，芯片间双向带宽从1.6TB/s升级到3.6TB/s，但交换容量从NVLink 5到NVLink 6甚至NVLink 7始终是3.6TB/s。所以带来一个问题：在做Blackwell NVL72时，有72张卡，NVLink 5交换容量3.6TB/s。计算交换芯片颗数时，因为是一层互联，所有GPU的流量要被交换芯片承载。本质上，GPU发出的单向流量等于交换芯片的总容量。所以72个GPU的双向带宽除以2（转单向）等于交换芯片颗数乘以交换容量。通过公式：72*双向带宽/交换容量，得到Blackwell这代约18颗。 同样道理，到NVL72这一代，双向带宽double了，但交换容量没有double，所以机柜内部交换芯片数量double到36颗。此时NVL72机柜还是九个switch tray，按原始版本，每个switch tray配4颗交换芯片，达到36颗。 这时面临一个问题：往Rubin Ultra NVL576走时，需要承载二层网络。单机柜内部互联打满后，还要把GPU信号往柜外传，与其他机柜互联。所以柜内芯片不仅要承担一层GPU上行流量，还要作为机柜流量出口，对外互联。这导致柜内NVLink switch的流量double了。所以对于单机柜，当需要二层交换机互联时，交换芯片数量比单一NVL72机柜再翻一倍，从36变成72。如果还是原来的9个switch tray，每个tray上要放8颗交换芯片，对PCB板要求、单tray功耗和散热都变得相当复杂和严苛。 基于此，英伟达做了一个变化，把整个交换机容量变多，从九升级到18。这样在做NVL576版本时，为了达到机柜内72颗交换芯片，每个switch tray只需放四颗交换芯片，基本按照之前老NVL72版本的能力，供应商有能力做。非576版本可能再减少一半，每张tray两颗交换芯片。这是整个机柜的演进，也是最近领导关心的NVL72 switch tray提升的底层原因。对于这块，研究员A也提到，PCB肯定是量增逻辑，功率问题也会带来一定价值，这是PCB层面。 对于光互联层面，NPO和CPO来看，我们认为交换tray本身的提升对NPO和CPO的边际增量不大。但我们一直跟市场提的是，NVL576本身是一个非常大的产业趋势。未来scale up域越来越大，模型参数量大幅提升，如Kimi K3 2.8T，Claude Fiber 5T，甚至Mistral和字节要做10T模型，MOE专家数量、单次激活数量都在增加。梁文锋相关采访也提到未来模型朝这个方向。在scaling law没有撞墙的情况下，低延迟scale up域越来越重要，会越来越大。现在看到NVL576，老黄规划NVL1152，未来可能更大。 Scale up域的变大是CPU和NPU需求量扩大的底层逻辑。在这种情况下，考虑机柜内一层还是用铜缆，按照CSP或英伟达的成本最优解，机柜内能用铜缆就用铜缆，二层上光互联，因为机柜间距离变长，电损耗高，高速情况下很难用铜缆，只能用光。这将是未来非常大的NPO和CPO增量。 目前3米的爆料中，多机柜互联有两个版本：CPO版本和NPO版本。未来可能不同CSP根据自己架构和技术选择。大体如此。 对于二层，领导们可能关心模块配比计算。这跟柜外scale out网计算方式不同。scale out根据组网层数，比例可能是1:2、1:4、1:6。但对于二层scale up组网，光引擎或OE计算主要依托GPU双向互联带宽和拓扑架构。目前市场未最终确认二层组网形态，可能是英伟达一直做的all-to-all full mesh的Clos胖树架构，也可能简化做二层Dragonfly，我们不得而知。 假设以胖树架构为例，二层组网的带宽流量应等于八个机柜所有一层的双向带宽。计算光引擎OE数量时，用576个GPU乘以GPU双向带宽，再乘以8（转换成Tbps），再除以未来switch侧配的光引擎带宽（3.2T），得到OE数量。具体数字是5180 3333点2T，对应单个GPU是1:9，相当于按现在组网就是一层。在机柜内，绿色的NVLink switch侧会有一个OE，再到柜外的交换机侧也有一个OE，这是胖树组网。Semi 3米的测算是按1:4算的，我们觉得可能涉及双向带宽或对NVLink switch带宽的理解不同，计算口径问题，无伤大雅。最后光模块是3.6T还是3.2T的口径问题。如果变成Dragonfly，外部交换机可能取消，光引擎数量可能减半。整体来说，NVL576组网对光引擎、NPO、CPO的拉动非常大。 按照市场测算，我们之前做过测算，整体市场容量在百分百渗透率下大概是scale out市场的3到4倍。在变化层面或NPO、CPO方面我就汇报到这里。看好的方向是CPO和NPO共同需要的上游，如带FAU的致尚科技、长盈通的保偏光纤。未来1到2个月会有更多催化，包括与NV的测试进展、FAU测试进展、长盈通和康宁的测试结果等。领导们可以持续关注。我们相信随着NVL1576渗透率提升，CPO和NPO相关板块及配套上下游会大放异彩。今天就汇报到这里，感谢各位领导。看主持人是否需要做其他总结。 主持人/通信/半导体分析师：好的，谢谢研究员A和研究员B的介绍。整体我们觉得，就昨天的PCB层数变多，边际变化可能更多来自报告本身。我们觉得现在更加明确的是整个NV1576，尤其是8机柜版本的方向的确立。今年上半年以来，细节逐渐丰满，产品确定性大幅提升。如果大家在意结构性机会和升级，最显性变化是：第一，87柜之间的互联增加CPO和NPO；第二，机柜内部交换芯片颗数翻倍，交换芯片与GPU比例有明显变化；第三，交换托盘层数的提升。我们认为这三个是目前变化最显性的方向。如果关注NVL576 8机柜方向的投资机会，主要在CPO（天孚通信、致尚科技、长盈通、炬光科技等）和NPO（中际旭创、光库科技等）。交换芯片方面，映射到A股如盛科通信等交换芯片领先企业。PCB板方面，昨天涨停的景旺电子、沪电股份、生益科技等供应链参与企业。我们认为这是比较明确的投资方向。排序为CPO、NPO、交换芯片、PCB板。具体标的欢迎会后沟通。以上是今天会议全部内容，大家关心细节变化和后续产业进展，欢迎会后与我们团队深度交流。谢谢大家。 总结： 本次会议主要讨论了英伟达Rubin Ultra NVL576机柜的规格升级及其对产业链的影响。会议由主持人主持，研究员A和研究员B分别从交换芯片和光通信角度进行了详细分析。 首先，会议回顾了英伟达在机柜连接形式上的演进历程。英伟达过去三年推出了多种尝试性机柜连接形式，旨在提升互联速度和集群规模，以应对更大规模的训练和推理需求。然而，由于技术瓶颈，部分方案被暂缓或取消。目前，英伟达的方向是构建更大的NVLink域集群，但每个技术细节的突破速度不平衡，导致方案多次更迭。 在机柜架构方面，Rubin Ultra NVL72相较于上一代Rubin NVL72有两大升级：交换托盘层数从9层翻倍至18层，PCB板层数从26层提升至30层，以满足更高功耗和供电需求。Rubin Ultra NVL72分为可拓展和不可拓展版本。可拓展版本通过8个NVL72机柜互联形成NVL576超节点，交换芯片与GPU配比达到1:1（72颗交换芯片），而不可拓展版本仅为1:2（36颗）。可拓展版本采用NPO或CPO方案进行机柜间互联，不可拓展版本则使用铜缆。 进一步地，会议解析了NVL576需要增加交换芯片数量的原因：它包含两层高速scale up网络（机柜内和机柜间），而不可拓展版本只有一层。交换托盘层数的增加是为了简化产线设计，并为NVL576方案做准备。同时，芯片双向带宽从1.6TB/s提升至3.6TB/s，但交换芯片容量未变，导致交换芯片数量翻倍。若机柜间互联采用二层网络，交换芯片需求再翻倍至72颗，因此switch tray从9个增至18个。 在光互联方面，NVL576的推广将极大拉动NPO和CPO需求。机柜内仍以铜缆为主，但机柜间距离较长，需采用光互联。二层scale up组网的光引擎数量计算基于GPU双向带宽和拓扑结构，以胖树架构为例，每GPU对应约9个光引擎（OE），市场规模预计为scale out网络的3-4倍。未来可能采用Dragonfly架构，光引擎数量减半。上游材料如FAU、保偏光纤等有望受益。 投资机会方面，会议认为最显性的变化是：8机柜互联增加CPO/NPO、交换芯片颗数翻倍、交换托盘层数提升。推荐顺序为CPO（天孚通信、致尚科技、长盈通、炬光科技等）、NPO（中际旭创、光库科技等）、交换芯片（盛科通信等）、PCB板（景旺电子、沪电股份、生益科技等）。整体来看，NVL576方案的确定性正在提升，相关产业链值得持续关注。", "status": "extracted"}, "post:2026-08-13T07-49:8d0c31867995": {"id": "post:2026-08 镀”是mSAP移载式电镀首选。 订单：2026年预计交付设备50台，订单已排满，产能利用率100%；2027年预计交付100台，同样为满产状态，目前已开始排产2027年第四季度的订单。2026年、2027年订单中50%为用于mSAP工艺的SVCP设备，其余为普通VCP、龙门设备 客户情况：现有客户中超过一半为长期合作客户，2027年现有客户的mSAP设备订单普遍较2026年增长1-2倍。26年第一大客户：深南电路 价格情况：用于mSAP的设备单台售价2000多万元，普通VCP售价1000万元左右，中低端常规VCP仅需几百万元。 2026年6-7月股价回调主要受三个因素影响：整体市场环境走弱、内地收益互换（TRS）政策暂停导致内地投资者只能卖不能买、部分股东因自身流动性需求被动减持，并非基本面发生变化#文字观点", "publish_time": "2026-08-13 11:29", "tags": ["文字观点"]}, "attachment:files/华润置地深度报告解读20260812.pdf": {"id": "attachment:files/华润置地深度报告解读20260812.pdf", "kind": "attachment", "title": "华润置地深度报告解读20260812", "source_label": "其他", "excerpt": "华润置地深度报告解读 20260812 要点总结 1.报告核心逻辑与盈利结构跨越 本次为开元地产对华润置地的第二篇深度报告，核心聚焦公司经营逻辑，主要看点包括盈利结构历 史性跨越、开发业务聚焦核心城市、购物中心竞争壁垒及 REITs 双平台闭环。去年公司收租和收费型业务的核心净利润贡献首次超过地产开发业务，非开发类业务利润占比达 60%以上，公司正从购物", "content": "华润置地深度报告解读 20260812 要点总结 1.报告核心逻辑与盈利结构跨越 本次为开元地产对华润置地的第二篇深度报告，核心聚焦公司经营逻辑，主要看点包括盈利结构历 史性跨越、开发业务聚焦核心城市、购物中心竞争壁垒及 REITs 双平台闭环。 去年公司收租和收费型业务的核心净利润贡献首次超过地产开发业务，非开发类业务利润占比达 60%以上，公司正从购物中心开发商向城市运营商转变。 2.三条增长曲线战略规划 公司董事会主席在业绩会上提出“15·17·3”三条曲线高效协同战略规划。 第一曲线（开发销售业务） ：定位为业绩基本盘及营收和现金流主要贡献者，十五五期间销售规模 目标 2500 亿元，利润占比 40%。 第二曲线（经营性不动产收租） ：涵盖购物中心、写字楼、酒店等，定位为利润和稳定现金流主要 贡献者，目标收入 300 亿元，贡献 50%利润。 第三曲线（轻资产管理收费） ：即华润万象生活，目标收入 200 亿元（超过要卖意收入），贡献 10%–15%利润。 三条曲线合计非开发类业务利润占比超 60%，公司已跳脱传统开发类房企估值体系。 3.收入与利润结构表现 去年收租和收费型业务收入 433 亿元，同比增长 4%，收入占比 15.4%；核心净利润贡献 116 亿 元，同比增长 12%，利润占比达 51.8%，同比提升 11.2 个百分点，首次超过开发业务并突破 50%。 开发业务结转毛利率 15.5%，同比下降 1.3 个百分点，但行业内仍处较高水平；经营性不动产毛利 率高达 71.8%，同比提升 1.8 个百分点；轻资产管理毛利率 35.5%，同比提升 2.5 个百分点。 高毛利经常性业务占比提升有效对冲开发业务利润率下行。 4.融资成本优势与商业模式正反馈 截至去年末，公司债权融资成本降至 2.72%，同比下降 39 个基点，在行业资金压力较大的背景下 提供较大容错空间和逆势扩张弹药。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 2025 年购物中心一贝塔成本回报率 9.8%，写字楼 5.5%，较 2.2%–2.7%的平均融资成本有较大空 间。 正反馈机制：每年超 250 亿元收租现金流提升信用评级→降低融资成本→以低成本在核心城市高价 拿地→优质项目提升利润→进一步增强信用；同时通过 REITs 平台资本循环减少资金沉淀，降低对 外部融资依赖，优化资本结构。 5.住宅开发业务：销售与拿地 去年签约销售金额 2336 亿元，同比下降 10.5%；签约面积 922 万方，同比下降 19%；签约均价超 25000 元/平，同比增长 10%；一线城市销售占比同比提升 7 个百分点至 45%。 公司自去年以来在核心城市持续推出高端改善项目，在上海、北京、深圳、杭州等城市产品溢价能 力和去化表现优秀；一线城市布局与城市整体开发深度绑定，如深圳湾深耕 20 年、上海黄浦江畔 和老城厢布局、北京中央别墅区精准铺排。 标杆项目：深圳湾云玺单日销售 130 亿元，创全国开盘单日记录；北京瑞源获“三冠王”；上海云 起滨江等多个高端盘去化表现优异。 去年获取 3 个项目，新增权益地价 674 亿元，拿地权益比 73%（同比提升 5 个百分点），拿地强 度（拿地金额/销售金额）39%，处行业较高水平；城市结构上一线城市占 64%、二线 35%、三四 线仅 1%。 今年上半年全权益拿地金额 277 亿元；7 月联合保利拿下上海杨浦滨江宅地，总价超 160 亿元，一 线城市强势补仓。 拿地均价自 2020 年以来持续攀升，去年达 2.7 万元/平，同比提升 3%，体现核心城市核心地段的 高价拿地策略。 6.高价拿地的底气来源 一是对核心城市改善需求的判断，深圳、上海、北京标杆项目验证了好房子好产品的议价能力。 二是 2.7%的融资成本提供低资金成本支撑，使公司有能力承受更高地价。 7.标杆豪宅项目分析 深圳湾云玺 ：公司在深圳后海深耕 20 年，已开发华润大厦（春笋）、深圳湾万象城、深圳湾体育 中心、深圳湾文化广场等，形成投资开发运营一体化生态。2024 年 12 月华润与中海经 295 轮竞 价，以总价 185 亿元拿下深圳湾项目；项目由六位国际大师设计，户型可自由重构，每户两套方案 可选，全户型标配转角客厅和超大全景落地窗，70%户型无遮挡看海；去年 11 月底首开当日销售 130 亿元，创全国开盘单日记录。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 上海云起滨江 ：去年 8 月华润置地和南方集团以协议方式获取上海后滩和黄浦庆运地块组团包，总 价 245 亿元；项目位于浦东世博后滩黄浦江 S 湾核心，是上海“一江一河”战略中最具标志性的滨 水段落；拿地 3 个月后（去年 11 月底）即入市，首开 122 套当日售罄，后续加推六七次持续热 销，去化率基本 90%以上。 两个标杆项目印证公司在一线城市核心区域拥有从拿地、勾地、打造到营销去化的完整闭环能力， 在产品、品牌及客户信任度全链条上行业领先。 8.购物中心运营：规模与市占率 截至去年末，在营购物中心 98 座，总建筑面积超 1200 万方，在 27 个城市实现两座以上购物中心 布局。 购物中心运营逻辑本质是通过极致运营能力、品牌矩阵和招商能力创造消费流量并变现，而非简单 收租，这一差异决定了华润与传统开发商商业板块的估值差距。 98 座购物中心中 82 座零售额在当地市场排名前三，54 座城市排名第一，体现高市占率消费入口优 势。 去年购物中心零售额接近 2400 亿元，同比增长 22%，同店同比增长 12%，大幅高于社零增速；零 售额占社零总额比例达 0.5%。 购物中心租金收入 219 亿元，同比增长 13.5%；毛利率连续三年超 75%，经营利润率和一贝塔成 本回报率连续三年提升；租售比稳定超 11%；2025 年出租率维持 97%以上高位。 9.购物中心招商与品类结构 截至去年末合作品牌超 9200 个，其中重奢品牌 123 个，重奢门店数量全国排名第一。 重奢品类除 2022 年受宏观扰动增速降至 1.5%外，其余年份均双位数增长，部分年份超 30%；非 重奢品类表现更突出，各年度增幅均大幅跑赢社零增速。 零售额构成中重奢占比从 2020 年 46%降至去年 36%，非重奢占比提升至 64%，实现双轮驱动均 衡发展，证明全品类购物中心运营的全局优势。 公司为内地重奢商场数量最多的企业；根据营商网数据，截至今年 5 月内地共有 88 个高端商场 （档次指数 9 分以上且有一定数量非专柜形式进驻的奢侈品品牌），占全国存量购物中心比例仅约 1%；华润在内地有 13 个已开业重资产高端商场，大幅领先于恒隆、太古等。 与新城、龙湖对比：华润单购物中心零售额 24.4 亿元，远高于龙湖和新城；租金坪效 151 元/平/ 月，优于龙湖和新城；主要因华润购物中心聚焦高能级城市且重奢商场较多，重奢商场对高端品牌 议价能力强，租金回报远高于普通商场。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 10.购物中心未来开业计划与十五五目标 今年预计新开业 5 个重资产购物中心，分别位于广州、东莞、西安、武汉、佛山。 广州白鹅潭万象城为华润在广州第一座万象城，定位 M1 级重奢，位于广佛江白鹅潭站上盖，无缝 连接广州地铁 11 号线、22 号线、28 号线四条线路，将打造超级交通、超级景观的超大规模滨江综 合体。 根据十五五规划，到 2030 年末在营购物中心达 127 个，即未来五年每年平均开业 6 座重资产商 场。 11.大会员体系与数字化平台 去年华润万象生活收购华润网络，完成业务整 ：参考成熟市场，啤酒销量大致随人口走，渗透率见顶后按每年约 0.5%-1%的增速下 行，行业总量预计每年微跌。 价格层面：2024 年后高端化明显降速，2026 年增速与前几年预计不会有太大差距；拉长看，对比 美国、日本及欧洲南美国家，温和经济增长环境下啤酒价格驱动力应能恢复至每年 2%-3%的增 长。 3.渠道变化：非现饮占比提升与新零售崛起 第一条主线：餐饮放缓导致非现饮渠道销量占比持续提升，部分公司已提升至 60%以上，行业层面 目前约为 60%非现饮对 40%现饮，与疫情前完全相反（彼时餐饮占比约 60%）。餐饮及夜店渠道 高端啤酒更好卖，渠道变化对高端啤酒形成一定压制；但部分公司已在非现饮市场布局高端产品及 结构升级单品，局部市场已见成效。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 第二条主线：新零售/即时零售快速发展，消费者从到店点单转向线上点单（便捷性+性价比），趋 势明显扩散。带来两点变化： 消费者获取不同品牌、不同品类啤酒的成本降低、变得更挑剔，要求啤酒公司在产品和品牌层面做 更好平衡，积极与平台合作提升消费者触达率，否则份额将自然下降。华润、青岛、重庆、燕京等 主流啤酒公司均已参与这一趋势改革。 渠道壁垒缩小，瓦解了传统啤酒大公司的区域渠道优势。过去啤酒竞争的核心是区域割据（运输半 径有限+经营渠道壁垒），现在啤酒品类变得“更容易进攻、更难以防守”，对未来格局带来更多 变数，对品牌和产品工作提出更高要求。 4.近期旺季表现：世界杯未兑现催化，关注餐饮与通胀两条线索 6-7 月及 8 月整体啤酒销售疲弱，世界杯并未兑现对啤酒的提振作用。原因包括天气与经济影响， 以及今年体育赛事不如往年有刺激性（世界杯时间不利，去年苏超及区域赛事热度更高）。 第一条关键变量是餐饮：啤酒从去年四季度到春节表现不错、二季度走弱，与餐饮相关性非常高。 虽然餐饮渠道占比已降至 40%左右，但多数高端啤酒（喜力、珠江 97 纯生等）销售场景仍以餐饮 为主，餐饮复苏对啤酒景气改善至关重要。 第二条线索是通胀：啤酒历史上是从通胀受益的资产，在温和通胀周期中受益程度仅次于白酒，与 乳制品、肉类接近。复盘美国、日本啤酒高端化，均绑定经济周期向上趋势；日本在 90 年代地产 泡沫破裂、餐饮外食率下行之前迎来十年高端化，此后 30 年价格和结构均无提升。后续需观察通 胀能否在需求催化下形成涨价预期。 喜力近期提价后动销未受影响，需求仍强、增速未放缓、提价成功传导。但这更多反映大单品周期 仍在上行阶段、阶段性供需偏紧，而非广谱性需求复苏；当前多数公司提价概率较低，核心约束在 需求。 5.华润啤酒推荐逻辑一：啤酒利润有韧性的龙头，量价企稳稳中有增 华润啤酒为行业销量口径规模最大、渠道覆盖面最广的公司，拥有喜力这一高速增长的中高端抓 手。行业缺乏弹性状态下，公司具备韧性稳住 EPS 和现金回报。 回顾 2025 年：公司计提了白酒减值（前期收购金沙形成商誉所致的一次性事项）；2026 年是否继 续减值存在可能性但尚不能下结论，白酒需求春节后仍未到彻底右侧。 2025 年定价端有阶段性压力（费用投放等原因），均价同比下滑；2026 年量价两端预计均比去年 更好。销量方面，2025 年总量有约 1.4 个百分点的销量提升（中低档表现较好），2026 年预计维 持或略低；价格方面，2026 年表现预计略好。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 喜力大单品表现突出：母公司公告显示，喜力中国区授权协议下上半年销量增长约 30%，明显高于 市场预期。驱动力包括：①在广东、福建、浙江、江苏等局部市场形成扩散性势能；②渠道拓展 （如山姆渠道啤酒销量中喜力遥遥领先），品牌力在中产群体口碑中持续扩散；③行业存量格局下 大单品此消彼长，部分竞品处于量缩份额流出状态，喜力、U8、珠江 97 纯生等增长具有一致性超 预期特征。 喜力高增长的持续性判断：提价后价盘向下顺价、大盘提升、费用端收缩，仍维持强劲增长，体现 大单品生命周期处于前中期；对比历史上同价格带（差两元左右）的大单品，150-200 万吨可能是 中期维度可见的天花板，且在格局此消彼长下喜力将持续吃掉竞品份额。 6.华润啤酒推荐逻辑二：分红扎实+估值安全边际+顺周期赔率 分红角度：2025 年分红约 10.2 亿元人民币，派息率按调整口径约 53%，股息率约 5%出头。未来 随着国企对股息率和回报的要求提升，分红率有望稳中有进，仍有提升空间。 估值角度：当前收盘价对应市盈率约 10.7 倍，过去 12 个月股息率约 5.2%，处于相对底部。参考 海外啤酒龙头（日本、美国、欧洲）过去 20-30 年估值中枢基本在 18-20 倍静态 PE（日本相对略 低但仍 25 倍以上），中国啤酒行业进入稳态后估值底部有迹可循。 总结：当下华润啤酒安全边际较高，经济偏弱环境下可按高股息消费龙头配置（分红率持续提升+ 估值 10 倍出头+大单品抓手稳住 EPS）；若经济转强，将体现顺周期弹性（中国啤酒高端化下半场 或估值向海外龙头靠拢），形成较好赔率。 7.其他推荐方向：阿尔法标的（燕京、珠江） 燕京啤酒：拥有强势大单品 U8，处于全国化中期阶段，外部市场价格和份额表现较强，在头部啤 酒公司激励市场取得良好增长和份额提升，成长性一定程度上超越前期市场预期。 珠江啤酒：更多依托广东区域代产品和渠道优势提升份额和利润，大单品 97 纯生今年表现不错， 近期受天气影响略有走弱，但行业份额和公司逻辑角度仍具成长性。 配置建议：追求阿尔法或更强成长可选燕京、珠江（估值相对更高）；兼顾业绩稳定、风控和顺周 期空间，华润啤酒更为均衡。 问答整理 Q1：喜力上半年 30%的销量增长，核心驱动因素是什么？持续性如何？ 答：核心因素有两点。第一，喜力在局部市场形成了扩散性势能，强势市场包括广东、福建、浙江、江 苏等区域，整体势能表现不错；同时渠道也在拓展，如山姆渠道的啤酒销量中喜力一直遥遥领先，印证 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 了其品牌力在中产群体中的口碑扩散效应。第二，行业总量处于存量状态，很多大单品呈现明显的此消 彼长，部分单品今年表现较弱、处于量缩份额流出的状态，喜力、U8、珠江 97 纯生等大单品的增长具 有一致性超预期特征。持续性方面，今年提价之后价盘向下顺价、大盘提升、费用端收缩，仍维持强劲 增长，说明大单品生命周期还处于前中期；对比历史上同价格带的大单品，150-200 万吨可能是中期 维度可见的天花板，且在格局此消彼长下喜力会持续吃掉竞品份额。 Q2：喜力提价后动销未受影响，是否代表行业性需求复苏信号？ 答：我们认为这不太代表广谱性的需求复苏，更多反映的是喜力作为大单品周期仍在上行阶段，阶段性 供需偏紧使其有提价的能力和意愿，并且能够成功传导下去。当前其他公司提价的概率较低，核心约束 还是在于需求。广谱性提价至少需要等待到明年，观察明年旺季之前或明年春节有没有比较好的表现。 Q3：华润啤酒 2026 年是否还会继续计提白酒减值？ 答：存在这个可能性，但目前还不能下结论。整体白酒今年的需求从春节后的情况来看还不是特别好， 还没有到彻底右侧的状态。需要继续观察后续白酒需求的恢复情况。 Q4：华润啤酒当前估值和股息率水平如何？ 答：按照当前收盘价计算，华润啤酒市盈率约 10.7 倍，按过去 12 个月股息计算股息率约 5.2%。我们 认为这是一个相对比较扎实的底部位置。 Q5：华润啤酒 2025 年的分红和派息率情况如何？未来分红趋势怎么看？ 答：2025 年分红约 10.2 亿元人民币，派息率按调整口径约 53%，股息率约 5%出头。我们认为未来随 着国企对股息率和回报要求的提升，公司分红率会稳中有进，整体分红还有提升空间。 Q6：如何看啤酒行业未来的提价节奏？ 答：历史上啤酒是从通胀受益的资产，在温和通胀周期中受益程度仅次于白酒，与乳制品、肉类接近。 后续需要观察通胀能否在需求催化下形成涨价预期。当前广谱性提价的概率较低，核心约束在需求端， 至少需要等待到明年观察春节或旺季前的表现。 Q7：华润啤酒 2026 年量价两端相比 2025 年会有怎样的变化？ 答：我们认为今年量价两端可能都会比去年表现相对更好。量方面，2025 年总量有约 1.4 个百分点的 销量提升（中低档表现较好），2026 年预计能维持这样的状态或略低；价格方面，2025 年因一次性 费用投入及相关影响，均价同比下滑，2026 年表现预计会略好，尤其是喜力 30%左右的销量增长对整 体均价有明确的提振效果。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 原文 华润啤酒 20260811_原文 2026 年 08 月 13 日 发言人 这个内容，我是国泰中食品饮料的分析师杨鑫，今天我来汇报一下，我们对于这个啤酒行业和华润啤酒 的一个看法，一些推荐的逻辑。首先还是跟进一下行业近期的一个情况。这样我们再阐述一下对于公司 的一个推荐的一些要点。 发言人 先讲的行业，其实这个行业，啤酒行业大家都知道，其实已经进入了一个成熟的偏存量的阶段。二三年 之前，整个高端化消费升级的进程下，其实啤酒另外一波轰轰烈烈高端化，整个价格利润其实都有一个 非常明显的一个提升。到 24 年开始，由于整个宏观经济和消费的一个下台阶，其实高端化也是明显开 始趋弱。但是由于成本端的 S25 也是开始享受一定的红利，所以啤酒企业也好，整个行业也好，就报 表端其实还是能够体现出一定的这个利润增长。但是到今年其实我们看在年初的时候，其实春节整个啤 酒的销量表现还是相对 W附近，下游客户提货积极性提高，Q4排产有望上修，我们预计全年排产超1.2TWh。27年需求，根据公司对供应商的备货指引，27年公司排产增速同比超30%。 2、 中游材料有望涨价：隔膜+负极 隔膜供应较为紧张，Q3可能提价，负极Q3有望给中游传导原材料价格。 3、 新技术快速放量：快充+凝聚态+钠电池 快充：神行二代年底放量，下游客户对超充系列电池需求提升；凝聚态：高端车型即将放量，在换电体系中示范性运营；钠电池：今年储能端出货约1GWh，在手订单充沛，明年出货30+GWh。#文字观点", "publish_time": "2026-08-13 08:49", "tags": ["文字观点"]}, "attachment:files/海外储能近况更新20260811.pdf": {"id": "attachment:files/海外储能近况更新20260811.pdf", "kind": "attachment", "title": "海外储能近况更新20260811", "source_label": "其他", "excerpt": "海外储能近况更新 20260811 要点总结 1.2026 年全球储能需求总览与 2027 年展望 2026 年全球储能装机预计约 450GWh，其中中国约 250GWh，海外合计约 200GWh。2027 年海外市场整体增速预计约 40%，主要驱动力来自欧洲、中东、东南亚等新兴市场的放量， 以及美国市场的稳步增长。", "content": "海外储能近况更新 20260811 要点总结 1.2026 年全球储能需求总览与 2027 年展望 2026 年全球储能装机预计约 450GWh，其中中国约 250GWh，海外合计约 200GWh。 2027 年海外市场整体增速预计约 40%，主要驱动力来自欧洲、中东、东南亚等新兴市场的放量， 以及美国市场的稳步增长。 海外市场因基数较低，增速显著快于国内。 2.欧洲市场：需求爆发，订单饱满 2025 年欧洲储能装机约 17-18GWh；2026 年预计落地订单超过 40GWh，主要驱动力除西欧国家 储能项目有序发展外，中欧、东欧独立储能需求激增。 2027 年预计欧洲装机可达 60GWh，未来两年累计有望超过 100GWh。 主要企业订单情况：海博思创 2026 年上半年在欧洲签约 10GWh 订单；特斯拉上海工厂收到欧洲 超过 25GWh 的两年锁单，相当于一大半产能预留给欧洲。 底层驱动逻辑：欧洲新能源渗透率高，燃煤/燃气受地缘政治影响供给不稳定，核电退役且新增核电 需 7-10 年落地，短期内只能依靠储能满足电力调节需求。 欧洲工商业储能盈利模式成熟，自由电力市场下工厂配储可参与电力交易，发展持续向好。 欧洲目前无强制 4 小时以上长时储能配置政策，但市场化交易机制下，业主倾向于做长时长以增加 交易频次和收益（如英国项目从 1 小时→2 小时→4 小时演进），一般 4 小时为经济性上限。 3.北美市场：稳步增长，AI 数据中心配储占比快速提升 2026 年北美装机预计约 60GWh，2027 年预计 75-80GWh。 市场结构：AI 数据中心配储占比 2026 年约 10%，2027 年预计提升至 30%-40%；其余为独立储 能和风光配储。 关注大容量并网法案能否落地，若落地将进一步加速储能增长（数据中心通过配储可加速并网）。 数据中心对合规性要求高，但价格敏感度相对较低；FCC（联邦监管）对新产品（尤其是与 SST 挂 钩的新型 PCS）影响较大，老款已认证产品不受影响、市场接纳度高。 美国主流逆变器厂家本身为 SMA、特斯拉等，中国企业多与当地厂家合作，FCC 对中国直流侧和 集成影响不大，主要影响阳光电源等个别企业。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 4.中东市场：长期看好，短期受地缘政治扰动 2026 年受美伊战争影响，部分项目延期，装机预计与去年持平，约十几个 GWh（不到 20GWh）。 2027 年预计装机可达 30GWh：阿布扎比数据中心项目（阳光+比亚迪合计约 20GWh）将形成装 机，另有沙特 8GWh 项目及其他北非区域项目。 新项目储备丰富：沙特 12GWh 单体项目已于 7 月全球邀标；阿联酋数据中心二期预计 40GWh 体 量；迪瓦 7 光伏项目（比亚迪中标）明年交付，投标电价约 2.1 美分/kWh。 底层逻辑：中东光照资源全球领先，新能源渗透率高，电网对储能需求大；沙特战略为节省天然气 用于出口，以储能平抑新能源电力；燃油电站陆续退役（三四十年寿命），能源结构转型刚需。 数据中心迁入是重要催化，但同时也受战争因素影响。 5.澳洲市场：稳步增长，利润率较高 2026 年装机预计约 12GWh，2027 年预计 15GWh。 澳洲大储项目开发难度高，但开发成功后利润率较高，设备价格相对较好。 户用储能方面，澳洲补贴政策有变化，对公司户用电芯需求无明显增长。 6.东南亚及其他新兴市场：超预期增长 东南亚 2026 年装机预计 7-8GWh，2027 年预计翻倍。 增长驱动：①能源结构依赖天然气，国际气价波动大，推动能源转型；②美伊战争影响中东数据中 心发展，部分海外数据中心向东南亚（尤其是马来西亚）转移。 菲律宾已出现 GWh 级单体项目。 印度 2026 年加上东南亚合计约 10GWh，未来可能成为每年 10-20GWh 体量的独立市场，但价格 低、商务条款差。 拉美 2026 年约 5GWh，未来持续增长。 户储/工商储方面，东南亚需求旺盛（公司电池客户反馈积极）；拉美目前未见明显需求；欧洲工商 业发展良好；美国户用市场有客户增长可观。 7.储能与燃气轮机配套方案及技术趋势 数据中心负荷波动大（30%-120%），对电网频率冲击大，燃气轮机调速慢于电化学储能，两者必 须配合使用（储能先顶前几秒，燃机随后跟进）。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 全球燃机供需缺口预计到 2035 年都无法解决，未来更多项目将转向光伏+储能方案，储能配比将 更大。 主流配比方案：按燃机功率的 20%配 4 小时储能，或按 30%-40%功率配比，能量与燃机功率比例 约 0.8-1。 数据中心有 2C/3C 高倍率需求，锂电池无法满足，需依赖钠电（可闪充闪放）；当前锂电路径通过 做长时长增加冗余来服务调频。 美国纯离网光储项目目前经济性不划算（美国落地电价 7-8 美分/kWh，光储成本需 13-14 美分 /kWh），但中东、东南亚等光照好、成本低的地区已有纯离网项目（如中东配比接近 20 倍储 能）。 8.价格趋势与竞争格局 欧洲当前价格良好，直流侧约 90 美金/kWh FOB，厂家订单已排至 2027 年二季度，今年基本不愁 卖。 交流侧价格：当地 PCS 约 65 美金/kW（4 小时折算约 13 美金/kWh），中国 PCS 约 45-50 美金 /kW（4 小时折算约 10 美金/kWh），整套系统价格约 100 美金/kWh 出头。 2027 年上半年价格预计稳定，产能已满；下半年需观察锂矿价格走势。 市场消息称锂矿价格可能上涨，已有客户愿意付定金锁价以规避涨价风险。 行业竞争格局趋于理性：国家控制无序产能扩张，龙头企业形成价格默契，竞争模式从低价抢市场 转向技术迭代降本（类似逆变器行业的演变路径）。 一线集成商（如阳光电源、特斯拉）策略：不追求最低价中标，通常溢价 5%-10%，通过财务模型 向业主展示全生命周期综合成本优势（衰减更慢、运维成本更低）。 二线集成商策略：技术承诺对标一线，价格便宜 5%-10%，先靠低价打入市场，再做品牌升级提 价。 头部厂家还通过本地化布局（如远景在西班牙设厂）应对欧洲碳排评标趋势。 9.汇率风险管理 厂家常用三种方式管理汇率风险：①报价时预留 5%-10%汇率 buffer；②通过外汇掉期/期权锁定 汇率；③极少数强势企业在合同中写入汇率参考条款（如参考汇率 6.78，波动超 10%调价），但 客户普遍不接受此类条款。 国际化企业可通过海外工厂收美金付美金，自然对冲汇率风险。 10.钠电对锂电的替代趋势 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 预计未来 2-3 年钠电将形成较好的价格竞争力，届时锂电可能面临主动降价压力以延缓替代进程。 钠电优势：安全性好（物理+化学）、原材料全球充足（海水提钠，无供应链卡脖子风险）、高倍 率性能（可闪充闪放）、循环寿命长（理论上 2 万-25000 次，可支撑 40 年使用）。 钠电劣势主要在能量密度，但锂电已接近能量密度发展瓶颈。 钠电替代锂电被认为是必然趋势，锂矿企业除降价外缺乏有效应对手段。 问答整理 Q1：2027 年海外储能需求整体展望？大储、户储、工商储分别怎么看？ 答：2026 年全球储能装机预计约 450GWh，海外约 200GWh。欧洲今年预计超过 40GWh（去年仅 17-18GWh），明年约 60GWh；北美今年约 60GWh，明年 75-80GWh；澳洲今年约 12GWh，明年 15GWh；中东今年受美伊战争影响与去年持平（不到 20GWh），明年可达 30GWh；东南亚今年 7- 8GWh，明年翻倍；印度今年加东南亚合计约 10GWh；拉美约 5GWh。户储和工商储方面，公司做电 芯，从客户需求看，东南亚需求旺盛，欧洲工商业发展良好，澳洲户用因补贴变化无明显增长。 Q2：美国大储市场中，风光配套和 AI 数据中心配储的比例大概是多少？ 答：2026 年 AI 数据中心配储约占整个美国市场的 10%，2027 年预计提升至 30%-40%，其余为独立 储能和风光配储。 Q3：独立储能、风光配储、AIDC 配储受 FCC 等合规条款影响程度是否不同？ 答：理论上都是存量项目，受冲击一样，直流侧必须用合规电池。但数据中心客户以急为主，对成本不 太敏感，对合规性关注更高。FCC 对老款已认证产品没有影响，市场接纳度高；对新产品尤其是与 SST 挂钩的新型 PCS 影响较大。 Q4：燃气轮机+储能的组合方案，2027 年及远期增长的持续性如何？ 答：持续性很强。数据中心负荷波动大（30%-120%），对电网频率冲击大，燃机调速慢于电化学储 能，必须配合使用。全球燃机供需缺口到 2035 年都解决不了，未来更多项目会转向光伏+储能，配比 会更大。 Q5：燃机+储能方案中，主流的配比、时长、放电速度有什么要求？ 答：每个项目不同，没有标准方案。常见的是按燃机功率的 20%配 4 小时，或按 30%-40%功率配 比，能量与燃机功率比例约 0.8-1。目前更多往长时储能走。数据中心有 2C/3C 高倍率需求，锂电池无 法满足，需等钠电成熟。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Q6：美国数据中心配储中，燃气轮机配套和纯离网光伏配套各占多少？ 答：目前拆不了那么细。光储纯离网在美国还不经济，需要时间发展，但未来量会起来。中东等地区已 有纯离网项目，配比接近 20 倍储能。 Q7：美国纯离网光储经济性如何？ 答：算不过来。美国落地电价约 7-8 美分/kWh，光储成本需 13-14 美分/kWh，差将近两倍。未来若 建设紧迫度需求高于经济性诉求，光储项目体量才会增加。光储一体方案更适合中东、东南亚等光照 好、成本低的地区。 Q8：欧洲东欧、西欧等不同区域市场驱动因素有什么分化？ 答：底层逻辑没有太多不一样。欧洲新能源渗透率高，燃煤不发展，燃气受俄乌战争和美伊战争影响供 给不稳定，核电退役且新增需 7-10 年，短期内只能靠储能。此外欧洲也在发展数据中心业务。欧洲只 能做光储，这是最便宜的可行能源形式。短期看不到天花板，等七八年后核电上来才会有天花板。 Q9：欧洲制裁、贸易壁垒对订单有影响吗？ 答：对订单没有影响，对欧洲 PCS 有影响。部分东欧项目用 EBRD 融资可能对中国 PCS 有影响，但欧 洲对直流侧没有太大限制，且欧洲没有本土直流侧制造能力，80%多还是从中国进口。PCS 方面，欧洲 本土品牌（如 PESMA）本身也与中国企业合作，影响不大。 Q10：中东下半年会有更多储能招标释放吗？ 答：会。迪瓦 7 项目上礼拜刚开标（光伏项目，比亚迪中标，投标电价约 2.1 美分/kWh，明年交 付）。沙特有 12GWh 单体项目 7 月已全球邀标；阿联酋数据中心二期听说 40GWh 体量；光这两个项 目就 52GWh。中东每个国家基本都有 1GWh 左右的 pipeline。 Q11：澳洲煤电加速退役是否会带来额外增量需求？ 答：这个没有研究太细，澳洲我们做得相对较少。能源结构上煤电退役导致新能源需求变大，需求可能 变大，但没有太多影响。 Q12：东南亚、拉美等地区的户储和工商储需求趋势？ 答：东南亚挺多，从卖电池角度看到很多客户有需求。拉美目前没有太多看到，我们做得比较少。欧洲 工商业不错，盈利模式成熟。美国户用市场有一个专门做户用的客户增长量还可以。 Q13：海外是否有 4 小时以上长时储能强制配置的政策？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 答：海外没有明确强制政策。国内冀北要求 4 小时及以上才批电网接入，是最明确的。海外如英国是市 场化驱动，储能稀缺、收益好，业主愿意做长时长增加交易频次，一般做到 4 小时为经济性上限。 Q14：欧洲价格趋势如何？国内企业竞争是否加剧导致单位盈利下滑？ 答：欧洲价格很好，厂家订单基本签到明年二季度，今年不愁卖。直流侧约 90 美金/kWh FOB。阳光 电源市占率最高，报高价，不会压低价格水平。 Q15：交流侧价格区间大概多少？ 答：当地 PCS 约 65 美金/kW（4 小时折算约 13 美金/kWh），中国 PCS 约 45-50 美金/kW（4 小时 折算约 10 美金/kWh），整套系统约 100 美金/kWh 出头。 Q16：明年价格会稳定还是继续下降？锂矿价格波动是否影响报价？ 答：明年上半年肯定稳定，产能已满，不太可能短时间降价。锂矿方面我们听到的消息是要涨，已有客 户愿意付定金锁价。明年下半年看不清。整体指引是产能扩张趋于理性、龙头企业有价格默契，竞争模 式转向技术迭代降本而非压缩毛利。 Q17：一线和二线集成商的报价策略有什么差异？ 答：一线集成商（如阳光、特斯拉）不想最低价  下实现增⻓。云收⼊增速加速⾄低⼆⼗位数百分⽐，主要受益于AI需求、国际扩张及通⽤ 云服务\u0001uptake\u0001的增加。\u0001 ✏瑞银：CPU⾏业更新，2026年第⼆季度出货量超预期，英特尔营收 份额改善\u0001 1.服务器CPU出货量超越季节性常态，ARM与AMD在单位份额上持续增⻓，但英特尔在营 收份额上有所回升。2026年第⼆季度，服务器CPU总出货量环⽐增⻓约9%（同⽐增⻓ 27%），优于通常的+1%季节性表现。尽管ARM和AMD在单位出货量上的份额继续增⻓ （ARM环⽐增40bps⾄17.6%，AMD增90bps⾄28.4%，英特尔降140bps⾄53.9%），但 在x86市场的营收份额⽅⾯，英特尔环⽐增加了160个基点⾄55.4%。这主要得益于英特尔 平均售价（ASP）环⽐上涨22%，⽽AMD仅上涨7%。\u0001 2.PC\u0001CPU出货量⼤幅反弹，英特尔虽失单位份额但获营收份额提升。第⼆季度PC\u0001CPU总出 货量环⽐增⻓10%，远⾼于五年中位数-2%，标志着在⼀季度下降13%后的强劲反弹。其 中笔记本单元环⽐增⻓16%，⽽台式机单元下降7%。在单位份额上，英特尔流失110个基 点⾄59.1%，AMD增加30个基点⾄25.6%，ARM增加90个基点⾄15.3%。然⽽，在营收⽅ ⾯，英特尔在笔记本和台式机市场的份额分别环⽐增加210个基点和240个基点，得益于 其PC\u0001ASP环⽐上涨9%，⽽AMD\u0001ASP环⽐下降6%。\u0001 3.2026年PC市场前景谨慎，预计全年单位出货量将下降。鉴于内存价格通胀以及产品组合 向⾼端倾斜，低端⾄中端PC需求受到抑制。UBS预测2026年全球PC单位出货量将同⽐下 降约11%，其中台式机下降约13%，笔记本下降约10%，全年全球PC出货量约为2.42亿 台。2027年预计仅恢复2%的年增⻓率，原因是内存价格持续⾼企及Windows\u000111过渡后 的替换周期正常化。\u0001 4.CPU市场竞争加剧，多架构并存成为趋势。随着更多⼚商进⼊CPU市场，竞争⽇益激烈。 ARM预计在2027年推出136核⼼的AGI平台，⾼通⽬标在2028年推出250+核⼼CPU。英特 尔的服务器路线图因Coral\u0001Rapids的推出及多线程技术的回归⽽更具竞争⼒。不同⼯作负 载对架构的需求多样化，如代理编码⼯作负载⻘睐低核⼼数、低延迟设计（如NVDA的 Grace），⽽⾮编码⼯作负载则\u0001favor\u0001⾼核⼼数和多线程性能（利好AMD）。\u0001 英特尔、AMD和ARM整体CPU市场份额（按出货量）\u0001 ✏瑞银：AIDC电源架构2.0，固态变压器（SST）机遇与新份额增⻓周 期\u0001 1.固态变压器（SST）将成为AIDC⾸选电源架构，2030年渗透率有望达40%。随着AI数据 中⼼（AIDC）机架功率密度持续上升，电源架构升级迎来拐点。SST凭借更⾼效率、更⼩ 占地和更好的集成灵活性，预计将从2027年下半年开始抢占市场份额，到2030年在AIDC 领域的渗透率将从2027年的不⾜5%提升⾄40%，成为AIDC电源系统的⾸选架构。\u0001 2.SST具备显著的经济性和技术优势，可降低AIDC总拥有成本（TCO）14%。相⽐传统不 间断电源（UPS），SST可将电⼒效率提⾼约4%，减少40-50%的铜⽤量，并将占地⾯积 减少80%。尽管SST的前期成本是UPS的两倍以上，但由于架构简化、能源损失降低和运 营⽀出节省，预计可使AIDC的TCO降低14%，从⽽提升每⽡特代币产出，推动云服务提供 商（CSP）更快采⽤。\u0001 3.中国供应商有望凭借技术和成本优势⻓期收获市场份额。虽然海外电源系统巨头⽬前主导 SST演进，但瑞银认为中国公司凭借在电⼒电⼦、⾼压碳化硅（SiC）器件、⾼频变压器 和中压绝缘⽅⾯的技术专⻓，以及制造规模和成本优势，将在⻓期获得市场份额。具备系 统集成能⼒和客⼾渠道优势的企业将最能捕捉CSP的需求。\u0001 4.上调阳光电源盈利预测，重申“买⼊”评级。瑞银认为阳光电源（Sungrow）和科⼠达 （Kstar）是SST领域的主要受益者。鉴于SST业务潜在的盈利贡献，瑞银将阳光电源 2028-2030年的每股收益（EPS）预测上调5-18%，并重申对其“买⼊”评级，⽬标价上 调⾄165元⼈⺠币。\u0001 英伟达机架功率代际演进\u0001 ✏GS：探索⽇本消费税削减的资⾦来源，⾮税收⼊与特别税收措施难 以填补缺⼝\u0001 1.通过⾮税收⼊和缩减特别税收措施完全覆盖约5万亿⽇元消费税削减缺⼝的难度极⼤。尽 管⽇本政府表⽰不依赖国债为⻝品消费税削减提供资⾦，⽽是主要通过缩减“特别税收措 施”和增加“⾮税收⼊”来筹资，但⾼盛分析认为这两项来源难以提供⾜够的资⾦。⾸ 先，⾮税收⼊中约⼀半来⾃外汇储备的利息收⼊，预计2027财年可额外转移约1万亿⽇ 元，但这远低于5万亿⽇元的缺⼝。其次，特别税收措施的缩减已在2026年预算中实施， 进⼀步⼤幅缩减的空间有限，且⾯临政治阻⼒。\u0001 2.外汇储备资本收益转⼊预算⾯临制度和程序障碍，短期内难以实现。虽然外汇储备因⽇元 贬值积累了超过80万亿⽇元的留存收益（含未实现资本收益），理论上可转⼊政府预算， 但实际上缺乏明确的财务省程序允许将外汇留存收益直接转⼊⼀般账⼾。此外，若要通过 出售外汇资产变现，可能引发市场波动或需发⾏融资票据，这本质上仍增加了政府债务负 担，且⽴法修订耗时较⻓，⽆法赶上2027财年预算编制。\u0001 3.⻓期财政可持续性更取决于2029年引⼊的永久性可退还税收抵免的资⾦来源。相⽐为期 两年的临时性消费税削减，2029年起计划引⼊的永久性可退还税收抵免（基准情景下每年 约3万亿⽇元）对公共债务与GDP⽐率的影响更为深远。由于外汇盈余波动⼤且特别税收 措施缩减空间有限，为这⼀永久性减税寻找稳定的永久资⾦来源极具挑战性，若失败将显 著加剧⽇本⻓期的财政⻛险。\u0001 4.名义上不使⽤⾚字融资债券并不意味着国债发⾏总量不增加。政府预算中，国债发⾏并不 ⼀定与特定⽀出或减税挂钩。政府可以声称利⽤⾃然增加的税收收⼊来资助减税，但这可 能导致原本应由⾃然增收覆盖的其他⽀出转⽽依赖⾚字融资债券。因此，投资者应关注的 是政府国债发⾏总量的最终增加幅度，⽽⾮官⽅宣称的特定资⾦来源。\u0001 ⽇本⾮税收⼊构成：外汇储备盈余约占⼀半\u0001 看推\u0001 中东战⽕对⽯油供应的冲击远超历史，油价却\"淡定\"得反常\u0001 全球⻩⾦⼤发现枯竭：连续两年零重⼤发现，创历史⾸次\u0001 AI\u0001Token使⽤量七个⽉暴涨超10倍：从6.4万亿到69万亿\u0001 关税影响减弱：多类消费品价格涨幅回落\u0001 关税阴影下，美国铜进⼝量激增\u0001 美国劳动成本增⻓放缓，通胀降温在望\u0001 ⻩⾦ETF中的散⼾情绪：追涨杀跌的典型模式\u0001", "status": "extracted"}, "post:2026-08-13T12-40:75da8dd4f122": {"id": "post:2026-08-13T12-40:75da8dd4f122", "kind": "post", "title": "2026-08-13 12:40", "source_label": "帖子正文", "excerpt": "【ZX机械】微导纳米大涨，半导体设备继续重点推荐Q2CX高层拜访公司，公司在CX的ALD/LPCVD/ PECVD份额有望显著突破，公司有望成为在两长均取得大额订单的设备公司。订单上调：公司25年半导体新签订单18亿，年初指引27亿（+50%），当前正式上调至40亿+水平（+100%以上），我们预计", "content": "【ZX机械】微导纳米大涨，半导体设备继续重点推荐Q2CX高层拜访公司，公司在CX的ALD/LPCVD/ PECVD份额有望显著突破，公司有望成为在两长均取得大额订单的设备公司。 订单上调：公司25年半导体新签订单18亿，年初指引27亿（+50%），当前正式上调至40亿+水平（+100%以上），我们预计全年有望到60亿级别。公司在两长每万片设备含份额价值量约3-4亿。按照明年两长扩产30万片左右计算，公司明年订单有望100亿级别 我们认为国产半导体设备是目前科技板块确定性最高的赛道之一。公司市值/明年订单比例最低的公司，性价比最高。未来随着300层以上NAND、HBM等先进制程的扩产，以及除ALD外在LPCVD和PECVD领域进展提速。公司将成为半导体设备重要弹性标的，同时与国内大客户的合作加深与先进逻辑的进展将构成高赔率期权，我们对公司有长期跟踪与模型拆分，欢迎联系交流！ 中信机械（李越/胡彬/王浩宇）#文字观点", "publish_time": "2026-08-13 12:40", "tags": ["文字观点"]}, "post:2026-08-13T10-08:e781600a286c": {"id": "post:2026-08-13T10-08:e781600a286c", "kind": "post", "title": "2026-08-13 10:08", "source_label": "帖子正文", "excerpt": "🧧【国投硬科技】炬光科技业绩说明会点评：光通信多产品线加速放量，CPO/NPO、OCS打开未来业绩想象空间 📝26H1公司实现营收4.19亿元，同比增长6.57%，归母净利润-6722.88万元。经营质量持续改善，综合毛利率由去年同期约32%提升至43%，同比+11pct，经营活动现金流净额2950", "content": "🧧【国投硬科技】炬光科技业绩说明会点评：光通信多产品线加速放量，CPO/NPO、OCS打开未来业绩想象空间 📝26H1公司实现营收4.19亿元，同比增长6.57%，归母净利润-6722.88万元。经营质量持续改善，综合毛利率由去年同期约32%提升至43%，同比+11pct，经营活动现金流净额2950万元；研发投入约8908万元，维持高位，约占营收21%。利润端主要受资产减值、股份支付及汇兑损失等阶段性因素影响，剔除相关非现金项目后，#经营层面已基本接近盈亏平衡。🎁分业务看，公司持续向光通信、消费电子、泛半导体制程三大高成长方向倾斜资源。26H1光通信收入6688万元，#同比+215%，为增长最快业务；消费电子收入2891万元，同比+65%；泛半导体制程收入约1.1亿元，同比+18%。工业、汽车及医疗健康等传统业务整体承压，公司主动收缩低毛利、低增长项目，资源进一步向新兴业务集中。 🎁光通信业务加速由验证走向量产。1️⃣目前可插拔光模块仍贡献约六至七成光通信收入，微透镜、微透镜阵列等产品已在部分海外客户实现规模化供应；2️⃣OCS约占光通信收入20%，N×N大通道微透镜阵列#已通过L...", "publish_time": "2026-08-13 10:08", "tags": ["经营层面已基本接近盈亏平衡", "文字观点"]}, "attachment:files/产业变化依然指向 Rubin.docx": {"id": "attachment:files/产业变化依然指向 Rubin.docx", "kind": "attachment", "title": "产业变化依然指向 Rubin", "source_label": "其他", "excerpt": "好的，线上各位投资人早上好，我是电子团队首席。今天我和两位同事（一位负责PCB，一位负责光通信）共同为大家解读近期热议的几个问题。", "content": "好的，线上各位投资人早上好，我是电子团队首席。今天我和两位同事（一位负责PCB，一位负责光通信）共同为大家解读近期热议的几个问题。首先，关于Rubin Ultra，从Rubin的Oberon NVL72方案到5L的NVL576方案的架构变化。近期我们看到SemiAnalysis以及海外其他机构发布了一些相关细节，稍后我们进行解读。第二个方向，Lumentum和Coherent的财报表现超预期，其中涉及NPO、CPO、光通信的磷化铟芯片等，以及OCS的进展，我们将进行跟进分析。第三个方面，结合我们最近在底部推荐的Rubin产业链，我们持续调研和密集路演，后面将汇报看好Rubin的主要逻辑和标的。以上就是三个主要方向。 首先汇报Rubin Ultra NVL576的基本架构。过去两年，我们持续更新方案，从NVL72到NVL500，中间有288过渡版，再到NVL576，有多种方案。之前的方案都指向集中互联，使用一个或四个大机柜上下互联，在scale up中更多采用正交背板和光，预期用于NVL576超大型机柜。目前SemiAnalysis的报告显示，最终的NVL576 Rubin Ultra形态是由八个基础Oberon NVL72机柜互联组成，即8个NVL72构成NVL576。 在单个机柜上，主要变化在于存储和scale up。存储方面，按之前预期，memory cost从单机柜占比40%左右下降到NVL576的28%左右。而scale up占比从NVL72机柜BOM成本的4%提升到NVL576的12%，所以增量主要来自scale up。之前市场只认可scale up侧NPO的增量，对PCB增量不认可，但设计方案显示PCB用量也大幅提升。之前的Oberon NVL72架构是8+9+8，即16个compute tray加9个switch tray。 而NVL576方案是八个NVL72柜子加中间三个柜子，主要变化来自switch托盘。之前是9个switch托盘，在NVL576中增加到18个，翻倍。数量变为9+18+9，上面9个compute tray，中间18个switch tray，下面9个compute tray，上面还有PSU电源插槽。 增加switch tray数量并压缩托盘高度，主要是为了维持单个机柜高度，同时利用背板、中背板或正交背板实现机柜内NVLink连接。而机柜间的scale out方向则指向NPO和CPO，其中NPO在Rubin Ultra上的扩展版本成熟度更高。 对于NPO，由于交换托盘数量和密度大幅提升，需要更高带宽，之前的铜缆背板方案无法满足，必须升级到NPO和CPO。初期会大规模引入NPO，后续可能进入CPO。因此，这个架构与市场之前预期的NVL576架构有很大差异。 主要差异在于，之前市场认为scale up主要来自正交背板的价值量增长，以及机柜间使用448G SerDes的cable cartridge或光模块。但实际报道的八个柜子组成NVL576的方案，目前以NPO和后续CPO为主。在单个柜的scale up中，增量主要来自switch tray的PCB以及中背板或正交背板。所以这与之前预期的Rubin Ultra方案有较大区别。 我们认为增量主要来自几个方向。第一，显性的是switch tray中PCB板的价值量提升，重点关注switch tray的PCB板、上游CCL、铜箔、电子布等产业链标的，如沪电股份、深南电路、胜宏科技，上游如生益科技、国际复材、宏和科技等。后续我们同事会详细展开。 NPO光方面，增量来自NPO数量的增长以及相对于1.6T光模块的结构性增量。NPO数量增长主要受益方是旭创，内部结构性增长包括高功率CW光源（如源杰、众山等）以及保偏光纤从0到1的增量，还包括FA的增量，这些都是较强的方向。这是我们对Rubin Ultra NVL576架构的解读。另外，关于Lumentum和Coherent两家公司，它们给出了明确指引，包括当期业绩、长期目标、下季度指引、代售订单、长期情况，以及NPO、CPO、光芯片、OCS的情况，我们简要梳理汇报。 首先关于Lumentum和Coherent，当期业绩均超预期。Lumentum营收10.1亿美元，预期9.8亿美元；Coherent营收25.5亿美元，超出预期19.2-20亿美元区间。指引方面，Coherent明确2027财年第三季度末营收可突破30亿美元，当前季度数据中心业务增速有望超过80%，在手订单和长期情况良好。Lumentum的泵浦激光器三年期长期交付协议预计市场份额70%-80%，远期出货量再增加四倍。OCS获得未来多年10亿美元采购协议，并拿下行业首单CPO的ELSFP外置光源模组订单，预计2027年下半年开始交付。Coherent订单可见度也高，客户订单已延伸至2028年，长期协议锁定至2030年末。 所有新品（CPO、NPO、OCS）均已对接头部客户，样品和批量订单落地，长期锁定量价情况良好。关于NPO，我们认为2027年下半年到2028年开始集中爬坡，Coherent节奏类似，2027年下半年开始贡献批量收入。CPO方面，2027年下半年CW光源逐步爬坡，支撑2028年规模化CPO集群交付。Coherent在scale up集群的CPO将于2027财年第二季度起量，比Lumentum早一个季度，scale up机架CPO 2027年下半年落地。OCS方面，Lumentum预期2027年第一季度迎来三季度营收破亿里程碑，并锁定多家规模化商用客户；Coherent也表示2027年OCS收入将显著提速。 市场对NPO、CPO、OCS的表述积极，尤其NPO和CPO的长期和在手订单指引超预期。结合财报和NVL576架构变化，作为最底部推荐Rubin产业链的卖方，我们继续强调看好Rubin的逻辑。我们从产业链走访看到，光、PCB、ODM全部上调今年第三季度及下半年指引。从六月下旬开始，Rubin对上游核心物料拉货备货交期很强，七月到九、十月是集中采购上量期，十月份左右开始批量交付下游。以光、PCB为代表的上游优势产业链核心物料在三季度将加速。电源、液冷、800V HVDC、从0到1的液冷变化等产业链变化较大的环节，核心参与公司及上游物料在三季度、四季度业绩将体现，ODM公司四季度将加速。 整条产业链指向英伟达新产品生命周期开启。英伟达股价强势，全球投资人见证了伟大新产品生命周期的开始。存储等长期订单协议的签署缓解了机柜出货和BOM成本压力。随着英伟达股价抬升和产业链明确进展，我们目前位置继续强Call英伟达Rubin产业链，认为这是今年下半年主线主力方向。相关PCB、光、ODM、液冷、电源、主力供电和上游核心物料都是关注重点。接下来请同事详细梳理Rubin Ultra的NPO、CPO情况及个股情况。 感谢首席，各位领导好，我是负责光通信的分析师。Lumentum、Coherent、旭创的电话会进一步确认了NPO和CPO的产业趋势，尤其是Coherent和Lumentum首次在电话会中大规模讨论NPO，落地进展超预期。 之前市场好奇NPO应用场景，SemiAnalysis报告确定NPO用于NVL576柜内scale up的柜间互联。架构为上面9个compute tray，下面9个compute tray，中间18个switch tray，switch tray采用NPO，后面用背板连接。该架构在两个月前已与市场提及，但当时市场情绪不佳，NPO交易不充分。 我们之前一直建议关注有源部分（源杰，六月底交易NPO预期），NPO市场空间新增约100亿给光芯片，提升源杰估值。无源部分关注光库科技、长盈通、太辰光等。NPO对无源器件提升明显，FA从CPO的36通道提升到NPO的72通道，价值量大幅提升。叠加康宁在国内活动，长盈通表现优秀。 七月和八月NPO最大变化是总量从3000万只提升到5000多万只，核心是谷歌量提升。落地场景已摸清，落地时间从明年下半年八月份开始交付5000万只，跨度从明年下半年到后年某区间。 NPO和CPO并非对立，NPO用于scale up层，CPO用于scale out层。之前市场将CPO预期下调至明年10万台，但产业链调研显示明年仍是20万台，主要是4.2层。近期思科对CPO有加单，整体进度符合预期，尤其是工业富联的排产。明年总体超过20万台。 CPO推荐标的持续不变：旭创、中际旭创、天孚通信、罗博特科。旭创电话会显示CPO和NPO订单可见度提升，一季度业绩虽为负（因计提和费用），扣非后利润转正，超预期，预计二季度业绩进一步提升。建议持续关注。以上是CPO和NPO的核心产业变化，具体测算欢迎联系。接下来请同事讲PCB变化。 下面汇报PCB相关情况。本次switch tray数量翻倍，之前Rubin一代（包括GB200、GB300）是9个tray，现在变为18个，数量显著增加，给PCB带来量的提升。 PCB规格尚未完全定案，可能采用M8或M8.5方案。层数可能与Rubin持平或增加。方案未完全落地，对应NVL72和NVL576可能推出两个版本：NVL72用两个switch芯片，NVL576用四颗芯片，规格可能不同。目前确定数量变动，规格后续升级待定。假设单价不变，市场空间可翻倍。按20万柜假设测算，整体市场空间增量可达300亿-400亿元。若switch tray有层数或材质升级，空间将进一步增长。单一switch变量在2028年给PCB市场空间带来约10%的提升，增量显著。 具体到供应商，弹性更大。PCB高度定制化，AI PCB市场有多家对应细分客户。NV switch领域重点出货的供应商更受益于compute tray和switch tray。compute tray可能升级到M9方案，搭配5+20+5（约30层），是潜在升级点。midplane方案未完全确定材质和层数，多版本在跑。 落地节奏方面，Ultra处于早期，变动概率大，但量增逻辑清晰。价格方面，后续会越来越清晰，价格提升一定会有。初期版本如上。576对NPO的提升也拉动MSAP领域，MSAP龙头如鹏鼎、深南电路、景旺、红板、胜宏等在26-27年加大MSAP布局，后续受益。NPO规格比1.6T光模块提高，1.6T是6阶MSAP，NPO可能升级到8阶，工艺复杂度更高，价值量提高。 switch受益标的：已在供的胜宏、景旺等龙头企业显著受益。CCL环节生益科技等龙头值得关注。新方案对PCB拉动明显，超预期。之前NVL72方案在Ultra环节无预期，所以超预期。近期出货情况好，compute tray、midplane、switch tray出货情况好。 对比GB300和Rubin：GB300量增贡献不明显，仅在去年10月备货量上升，对应PCB厂商四季度到一季度有增量，但其他月度数据与GB200基本一致。Rubin则非常明显，五月六月拉货猛，相当于之前一个季度量；七月有波动，八月回到高位。Rubin相比GB300有清晰量价齐升逻辑。 Rubin产业无需质疑，GB300时部分投资者质疑代际通胀逻辑，但Rubin展现的通胀清晰可见。静待三季度四季度报表，产业链公司会有不错表现。Rubin产业是重要主线。 上游受益方向：树脂、布、铜。布和铜逻辑不变，二代布和四代铜仍是Rubin和Rubin Ultra主力产品，重点关注相关标的。树脂环节变化较大，前期预期在PPO，现在M8材料碳氢树脂起量，M9升级到高端BMI碳氢，放量显著。当前switch tray价值量翻倍，Rubin拉货好，关注碳氢树脂标的如东材科技。 下一代随着M9产品推出（如LPU、UBB、1.6T交换机等），树脂交易逻辑会逐步清晰，但相比二代布和四代铜逻辑后置。目前市场关注度不高，但后续景气度和稀缺性会显现。以上是PCB上下游情况。本次汇报内容至此，后续欢迎联系详细测算。 全文总结： 本次路演主要围绕英伟达Rubin系列（特别是Rubin Ultra NVL576）的架构变化、产业链增量以及相关公司业绩指引展开，共分为三个部分。 一、Rubin Ultra NVL576架构变化与增量方向 Rubin Ultra NVL576由8个Oberon NVL72机柜互联组成，单个机柜内switch tray数量从9个翻倍至18个，结构变为9+18+9（上、中、下三层）。主要变化在于scale up占比提升（从4%升至12%），存储成本占比下降（从40%降至28%）。增量主要体现在： PCB：switch tray数量翻倍，价值量提升，同时compute tray、midplane可能升级，带动PCB及上游CCL、铜箔、电子布需求。 NPO/CPO：机柜间互联采用NPO（初期）和CPO（后续），替代无法满足带宽的铜缆方案。NPO数量增长，且规格高于1.6T光模块，带动高功率CW光源、保偏光纤、FA等结构性增量。 二、Lumentum/Coherent财报指引及产业趋势 两家公司当期业绩均超预期，后续指引积极： Coherent预计2027财年三季度末营收突破30亿美元，数据中心业务增速超80%，订单延伸至2028年。 Lumentum泵浦激光器长期协议份额70%-80%，远期出货量增四倍；OCS获10亿美元协议，首单CPO外置光源模组2027年下半年交付。 NPO/CPO/OCS均对接头部客户，NPO 2027下半年至2028年集中爬坡，CPO 2027下半年起量，OCS 2027年收入显著提速。 结合产业链调研，光、PCB、ODM已上调三季度及下半年指引，Rubin上游物料自六月下旬起拉货强劲，预计三季度加速，四季度批量交付。 三、PCB产业链具体变化与标的 switch tray：数量翻倍，规格可能升级（M8/M8.5，层数增加），按20万柜测算，市场空间增量达300-400亿元，单一变量贡献约10%提升。 compute tray：可能升级至M9（30层），midplane方案未定。 MSAP：NPO向8阶升级，带动鹏鼎、深南、景旺、胜宏等受益。 上游材料：二代布、四代铜为Rubin主力产品；树脂环节从PPO向碳氢树脂、BMI碳氢升级，东材科技等值得关注。 出货节奏：Rubin拉货量远超GB300，五月六月相当于此前一个季度，七月波动后八月重回高位，量价齐升逻辑清晰。 对比GB300：GB300仅去年十月有短暂备货增量，Rubin则持续强劲，代际通胀明确。 整体结论：Rubin产业链已进入实质拉货期，下半年业绩有望加速兑现，是今年主线方向。建议重点关注PCB（沪电、深南、胜宏、生益等）、NPO/CPO光器件（旭创、源杰、天孚、光库、长盈通等）、ODM、液冷、电源及上游核心物料。", "status": "extracted"}, "post:2026-08-13T12-38:fafd1442860b": {"id": "post:2026-08-13T12-38:fafd1442860b", "kind": "post", "title": "2026-08-13 12:38", "source_label": "帖子正文", "excerpt": "继续重申7️⃣月以来对MiniMax的推荐 【广发计算机刘雪峰团队】MiniMax更新：港股通落地，H3推动模型与商业化共振 #港股通正式落地、增量资金可期。MiniMax于8月6日正式纳入港股通，南向资金配置通道打开，有望改善流动性，并强化港股稀缺大模型标的的估值锚。", "content": "继续重申7️⃣月以来对MiniMax的推荐 【广发计算机刘雪峰团队】MiniMax更新：港股通落地，H3推动模型与商业化共振 #港股通正式落地、增量资金可期。MiniMax于8月6日正式纳入港股通，南向资金配置通道打开，有望改善流动性，并强化港股稀缺大模型标的的估值锚。 #H3正式发布并开源、全模态能力与性价比进一步强化。MiniMax于7月31日发布H3，并于8月3日开源模型权重，通过开源进一步拓展开发者生态及下游应用。H3统一理解多模态上下文，支持最高15秒、2K分辨率及原生双声道音频生成，并强化复杂指令、内容编辑和多模态参考生成能力。同时，H3在2K分辨率下单位时长价格低于主流模型的1/3，兼具较强模型能力、开放生态与推理性价比。 #模型迭代加速、商业化弹性值得关注。随着M3、H3等模型持续升级，MiniMax已形成语言、视频、语音、音乐等全模态模型矩阵。后续公司有望沿M3架构进一步向更大参数规模演进，持续验证预训练Scaling能力，并强化Coding、Agent及多模态能力。后续关注API调用、ARR增长及推理效率提升，模型能力有望持续向商业价值兑现。 详情参阅：2...", "publish_time": "2026-08-13 12:38", "tags": ["文字观点"]}, "attachment:files/0812评级日报.pdf": {"id": "attachment:files/0812评级日报.pdf", "kind": "attachment", "title": "0812评级日报", "source_label": "其他", "excerpt": "华润啤酒近况交流 20260811 要点总结 1.行业整体判断：短期承压，中期量稳价增 啤酒行业已进入成熟偏存量阶段。2023 年之前，高端化消费升级驱动价格和利润明显提升", "content": "华润啤酒近况交流 20260811 要点总结 1.行业整体判断：短期承压，中期量稳价增 啤酒行业已进入成熟偏存量阶段。2023 年之前，高端化消费升级驱动价格和利润明显提升；2024 年起，受宏观经济和消费下行影响，高端化趋势明显趋弱，但成本端（尤其大麦）红利使报表端仍 能体现一定利润增长。 2026 年春节销量表现相对不错，但进入旺季（6-7 月）后行业数据走弱，7 月受天气及餐饮疲软约 束，量和价两端均有一定压力。 中期维度看，参考成熟市场经验，啤酒行业呈“量稳价增”特征，温和通胀年份行业增量能跑赢通 胀，稳态利润可实现中单位数到高单位数增长。 短期向上催化需观察消费环境及餐饮复苏动力；广谱性提价预计需等待至明年（2027 年）春节或 旺季前的表现。 2.行业总量与价格：产量微降，利润增长，价格驱动力待恢复 按国家统计局口径，2025 年啤酒产量约 3530 万千升，同比下降约 1%；规上口径收入基本持平， 利润增长 12%，受益于结构提升和成本红利。 成本端：2025 年大麦和包材均有红利，大麦同比 2024 年接近双位数下滑；2026 年大麦同比仍可 能下降，但包材（铝及其他主要包材）会有一定扰动。 长期总量判断：参考成熟市场，啤酒销量大致随人口走，渗透率见顶后按每年约 0.5%-1%的增速下 行，行业总量预计每年微跌。 价格层面：2024 年后高端化明显降速，2026 年增速与前几年预计不会有太大差距；拉长看，对比 美国、日本及欧洲南美国家，温和经济增长环境下啤酒价格驱动力应能恢复至每年 2%-3%的增 长。 3.渠道变化：非现饮占比提升与新零售崛起 第一条主线：餐饮放缓导致非现饮渠道销量占比持续提升，部分公司已提升至 60%以上，行业层面 目前约为 60%非现饮对 40%现饮，与疫情前完全相反（彼时餐饮占比约 60%）。餐饮及夜店渠道 高端啤酒更好卖，渠道变化对高端啤酒形成一定压制；但部分公司已在非现饮市场布局高端产品及 结构升级单品，局部市场已见成效。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 第二条主线：新零售/即时零售快速发展，消费者从到店点单转向线上点单（便捷性+性价比），趋 势明显扩散。带来两点变化： 消费者获取不同品牌、不同品类啤酒的成本降低、变得更挑剔，要求啤酒公司在产品和品牌层面做 更好平衡，积极与平台合作提升消费者触达率，否则份额将自然下降。华润、青岛、重庆、燕京等 主流啤酒公司均已参与这一趋势改革。 渠道壁垒缩小，瓦解了传统啤酒大公司的区域渠道优势。过去啤酒竞争的核心是区域割据（运输半 径有限+经营渠道壁垒），现在啤酒品类变得“更容易进攻、更难以防守”，对未来格局带来更多 变数，对品牌和产品工作提出更高要求。 4.近期旺季表现：世界杯未兑现催化，关注餐饮与通胀两条线索 6-7 月及 8 月整体啤酒销售疲弱，世界杯并未兑现对啤酒的提振作用。原因包括天气与经济影响， 以及今年体育赛事不如往年有刺激性（世界杯时间不利，去年苏超及区域赛事热度更高）。 第一条关键变量是餐饮：啤酒从去年四季度到春节表现不错、二季度走弱，与餐饮相关性非常高。 虽然餐饮渠道占比已降至 40%左右，但多数高端啤酒（喜力、珠江 97 纯生等）销售场景仍以餐饮 为主，餐饮复苏对啤酒景气改善至关重要。 第二条线索是通胀：啤酒历史上是从通胀受益的资产，在温和通胀周期中受益程度仅次于白酒，与 乳制品、肉类接近。复盘美国、日本啤酒高端化，均绑定经济周期向上趋势；日本在 90 年代地产 泡沫破裂、餐饮外食率下行之前迎来十年高端化，此后 30 年价格和结构均无提升。后续需观察通 胀能否在需求催化下形成涨价预期。 喜力近期提价后动销未受影响，需求仍强、增速未放缓、提价成功传导。但这更多反映大单品周期 仍在上行阶段、阶段性供需偏紧，而非广谱性需求复苏；当前多数公司提价概率较低，核心约束在 需求。 5.华润啤酒推荐逻辑一：啤酒利润有韧性的龙头，量价企稳稳中有增 华润啤酒为行业销量口径规模最大、渠道覆盖面最广的公司，拥有喜力这一高速增长的中高端抓 手。行业缺乏弹性状态下，公司具备韧性稳住 EPS 和现金回报。 回顾 2025 年：公司计提了白酒减值（前期收购金沙形成商誉所致的一次性事项）；2026 年是否继 续减值存在可能性但尚不能下结论，白酒需求春节后仍未到彻底右侧。 2025 年定价端有阶段性压力（费用投放等原因），均价同比下滑；2026 年量价两端预计均比去年 更好。销量方面，2025 年总量有约 1.4 个百分点的销量提升（中低档表现较好），2026 年预计维 持或略低；价格方面，2026 年表现预计略好。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 喜力大单品表现突出：母公司公告显示，喜力中国区授权协议下上半年销量增长约 30%，明显高于 市场预期。驱动力包括：①在广东、福建、浙江、江苏等局部市场形成扩散性势能；②渠道拓展 （如山姆渠道啤酒销量中喜力遥遥领先），品牌力在中产群体口碑中持续扩散；③行业存量格局下 大单品此消彼长，部分竞品处于量缩份额流出状态，喜力、U8、珠江 97 纯生等增长具有一致性超 预期特征。 喜力高增长的持续性判断：提价后价盘向下顺价、大盘提升、费用端收缩，仍维持强劲增长，体现 大单品生命周期处于前中期；对比历史上同价格带（差两元左右）的大单品，150-200 万吨可能是 中期维度可见的天花板，且在格局此消彼长下喜力将持续吃掉竞品份额。 6.华润啤酒推荐逻辑二：分红扎实+估值安全边际+顺周期赔率 分红角度：2025 年分红约 10.2 亿元人民币，派息率按调整口径约 53%，股息率约 5%出头。未来 随着国企对股息率和回报的要求提升，分红率有望稳中有进，仍有提升空间。 估值角度：当前收盘价对应市盈率约 10.7 倍，过去 12 个月股息率约 5.2%，处于相对底部。参考 海外啤酒龙头（日本、美国、欧洲）过去 20-30 年估值中枢基本在 18-20 倍静态 PE（日本相对略 低但仍 25 倍以上），中国啤酒行业进入稳态后估值底部有迹可循。 总结：当下华润啤酒安全边际较高，经济偏弱环境下可按高股息消费龙头配置（分红率持续提升+ 估值 10 倍出头+大单品抓手稳住 EPS）；若经济转强，将体现顺周期弹性（中国啤酒高端化下半场 或估值向海外龙头靠拢），形成较好赔率。 7.其他推荐方向：阿尔法标的（燕京、珠江） 燕京啤酒：拥有强势大单品 U8，处于全国化中期阶段，外部市场价格和份额表现较强，在头部啤 酒公司激励市场取得良好增长和份额提升，成长性一定程度上超越前期市场预期。 珠江啤酒：更多依托广东区域代产品和渠道优势提升份额和利润，大单品 97 纯生今年表现不错， 近期受天气影响略有走弱，但行业份额和公司逻辑角度仍具成长性。 配置建议：追求阿尔法或更强成长可选燕京、珠江（估值相对更高）；兼顾业绩稳定、风控和顺周 期空间，华润啤酒更为均衡。 问答整理 Q1：喜力上半年 30%的销量增长，核心驱动因素是什么？持续性如何？ 答：核心因素有两点。第一，喜力在局部市场形成了扩散性势能，强势市场包括广东、福建、浙江、江 苏等区域，整体势能表现不错；同时渠道也在拓展，如山姆渠道的啤酒销量中喜力一直遥遥领先，印证 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 了其品牌力在中产群体中的口碑扩散效应。第二，行业总量处于存量状态，很多大单品呈现明显的此消 彼长，部分单品今年表现较弱、处于量缩份额流出的状态，喜力、U8、珠江 97 纯生等大单品的增长具 有一致性超预期特征。持续性方面，今年提价之后价盘向下顺价、大盘提升、费用端收缩，仍维持强劲 增长，说明大单品生命周期还处于前中期；对比历史上同价格带的大单品，150-200 万吨可能是中期 维度可见的天花板，且在格局此消彼长下喜力会持续吃掉竞品份额。 Q2：喜力提价后动销未受影响，是否代表行业性需求复苏信号？ 答：我们认为这不太代表广谱性的需求复苏，更多反映的是喜力作为大单品周期仍在上行阶段，阶段性 供需偏紧使其有提价的能力和意愿，并且能够成功传导下去。当前其他公司提价的概率较低，核心约束 还是在于需求。广谱性提价至少需要等待到明年，观察明年旺季之前或明年春节有没有比较好的表现。 Q3：华润啤酒 2026 年是否还会继续计提白酒减值？ 答：存在这个可能性，但目前还不能下结论。整体白酒今年的需求从春节后的情况来看还不是特别好， 还没有到彻底右侧的状态。需要继续观察后续白酒需求的恢复情况。 Q4：华润啤酒当前估值和股息率水平如何？ 答：按照当前收盘价计算，华润啤酒市盈率约 10.7 倍，按过去 12 个月股息计算股息率约 5.2%。我们 认为这是一个相对比较扎实的底部位置。 Q5：华润啤酒 2025 年的分红和派息率情况如何？未来分红趋势怎么看？ 答：2025 年分红约 10.2 亿元人民币，派息率按调整口径约 53%，股息率约 5%出头。我们认为未来随 着国企对股息率和回报要求的提升，公司分红率会稳中有进，整体分红还有提升空间。 Q6：如何看啤酒行业未来的提价节奏？ 答：历史上啤酒是从通胀受益 胀，稳态利润可实现中单位数到高单位数增长。 短期向上催化需观察消费环境及餐饮复苏动力；广谱性提价预计需等待至明年（2027 年）春节或 旺季前的表现。 2.行业总量与价格：产量微降，利润增长，价格驱动力待恢复 按国家统计局口径，2025 年啤酒产量约 3530 万千升，同比下降约 1%；规上口径收入基本持平， 利润增长 12%，受益于结构提升和成本红利。 成本端：2025 年大麦和包材均有红利，大麦同比 2024 年接近双位数下滑；2026 年大麦同比仍可 能下降，但包材（铝及其他主要包材）会有一定扰动。 长期总量判断：参考成熟市场，啤酒销量大致随人口走，渗透率见顶后按每年约 0.5%-1%的增速下 行，行业总量预计每年微跌。 价格层面：2024 年后高端化明显降速，2026 年增速与前几年预计不会有太大差距；拉长看，对比 美国、日本及欧洲南美国家，温和经济增长环境下啤酒价格驱动力应能恢复至每年 2%-3%的增 长。 3.渠道变化：非现饮占比提升与新零售崛起 第一条主线：餐饮放缓导致非现饮渠道销量占比持续提升，部分公司已提升至 60%以上，行业层面 目前约为 60%非现饮对 40%现饮，与疫情前完全相反（彼时餐饮占比约 60%）。餐饮及夜店渠道 高端啤酒更好卖，渠道变化对高端啤酒形成一定压制；但部分公司已在非现饮市场布局高端产品及 结构升级单品，局部市场已见成效。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 第二条主线：新零售/即时零售快速发展，消费者从到店点单转向线上点单（便捷性+性价比），趋 势明显扩散。带来两点变化： 消费者获取不同品牌、不同品类啤酒的成本降低、变得更挑剔，要求啤酒公司在产品和品牌层面做 更好平衡，积极与平台合作提升消费者触达率，否则份额将自然下降。华润、青岛、重庆、燕京等 主流啤酒公司均已参与这一趋势改革。 渠道壁垒缩小，瓦解了传统啤酒大公司的区域渠道优势。过去啤酒竞争的核心是区域割据（运输半 径有限+经营渠道壁垒），现在啤酒品类变得“更容易进攻、更难以防守”，对未来格局带来更多 变数，对品牌和产品工作提出更高要求。 4.近期旺季表现：世界杯未兑现催化，关注餐饮与通胀两条线索 6-7 月及 8 月整体啤酒销售疲弱，世界杯并未兑现对啤酒的提振作用。原因包括天气与经济影响， 以及今年体育赛事不如往年有刺激性（世界杯时间不利，去年苏超及区域赛事热度更高）。 第一条关键变量是餐饮：啤酒从去年四季度到春节表现不错、二季度走弱，与餐饮相关性非常高。 虽然餐饮渠道占比已降至 40%左右，但多数高端啤酒（喜力、珠江 97 纯生等）销售场景仍以餐饮 为主，餐饮复苏对啤酒景气改善至关重要。 第二条线索是通胀：啤酒历史上是从通胀受益的资产，在温和通胀周期中受益程度仅次于白酒，与 乳制品、肉类接近。复盘美国、日本啤酒高端化，均绑定经济周期向上趋势；日本在 90 年代地产 泡沫破裂、餐饮外食率下行之前迎来十年高端化，此后 30 年价格和结构均无提升。后续需观察通 胀能否在需求催化下形成涨价预期。 喜力近期提价后动销未受影响，需求仍强、增速未放缓、提价成功传导。但这更多反映大单品周期 仍在上行阶段、阶段性供需偏紧，而非广谱性需求复苏；当前多数公司提价概率较低，核心约束在 需求。 5.华润啤酒推荐逻辑一：啤酒利润有韧性的龙头，量价企稳稳中有增 华润啤酒为行业销量口径规模最大、渠道覆盖面最广的公司，拥有喜力这一高速增长的中高端抓 手。行业缺乏弹性状态下，公司具备韧性稳住 EPS 和现金回报。 回顾 2025 年：公司计提了白酒减值（前期收购金沙形成商誉所致的一次性事项）；2026 年是否继 续减值存在可能性但尚不能下结论，白酒需求春节后仍未到彻底右侧。 2025 年定价端有阶段性压力（费用投放等原因），均价同比下滑；2026 年量价两端预计均比去年 更好。销量方面，2025 年总量有约 1.4 个百分点的销量提升（中低档表现较好），2026 年预计维 持或略低；价格方面，2026 年表现预计略好。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 喜力大单品表现突出：母公司公告显示，喜力中国区授权协议下上半年销量增长约 30%，明显高于 市场预期。驱动力包括：①在广东、福建、浙江、江苏等局部市场形成扩散性势能；②渠道拓展 （如山姆渠道啤酒销量中喜力遥遥领先），品牌力在中产群体口碑中持续扩散；③行业存量格局下 大单品此消彼长，部分竞品处于量缩份额流出状态，喜力、U8、珠江 97 纯生等增长具有一致性超 预期特征。 喜力高增长的持续性判断：提价后价盘向下顺价、大盘提升、费用端收缩，仍维持强劲增长，体现 大单品生命周期处于前中期；对比历史上同价格带（差两元左右）的大单品，150-200 万吨可能是 中期维度可见的天花板，且在格局此消彼长下喜力将持续吃掉竞品份额。 6.华润啤酒推荐逻辑二：分红扎实+估值安全边际+顺周期赔率 分红角度：2025 年分红约 10.2 亿元人民币，派息率按调整口径约 53%，股息率约 5%出头。未来 随着国企对股息率和回报的要求提升，分红率有望稳中有进，仍有提升空间。 估值角度：当前收盘价对应市盈率约 10.7 倍，过去 12 个月股息率约 5.2%，处于相对底部。参考 海外啤酒龙头（日本、美国、欧洲）过去 20-30 年估值中枢基本在 18-20 倍静态 PE（日本相对略 低但仍 25 倍以上），中国啤酒行业进入稳态后估值底部有迹可循。 总结：当下华润啤酒安全边际较高，经济偏弱环境下可按高股息消费龙头配置（分红率持续提升+ 估值 10 倍出头+大单品抓手稳住 EPS）；若经济转强，将体现顺周期弹性（中国啤酒高端化下半场 或估值向海外龙头靠拢），形成较好赔率。 7.其他推荐方向：阿尔法标的（燕京、珠江） 燕京啤酒：拥有强势大单品 U8，处于全国化中期阶段，外部市场价格和份额表现较强，在头部啤 酒公司激励市场取得良好增长和份额提升，成长性一定程度上超越前期市场预期。 珠江啤酒：更多依托广东区域代产品和渠道优势提升份额和利润，大单品 97 纯生今年表现不错， 近期受天气影响略有走弱，但行业份额和公司逻辑角度仍具成长性。 配置建议：追求阿尔法或更强成长可选燕京、珠江（估值相对更高）；兼顾业绩稳定、风控和顺周 期空间，华润啤酒更为均衡。 问答整理 Q1：喜力上半年 30%的销量增长，核心驱动因素是什么？持续性如何？ 答：核心因素有两点。第一，喜力在局部市场形成了扩散性势能，强势市场包括广东、福建、浙江、江 苏等区域，整体势能表现不错；同时渠道也在拓展，如山姆渠道的啤酒销量中喜力一直遥遥领先，印证 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 了其品牌力在中产群体中的口碑扩散效应。第二，行业总量处于存量状态，很多大单品呈现明显的此消 彼长，部分单品今年表现较弱、处于量缩份额流出的状态，喜力、U8、珠江 97 纯生等大单品的增长具 有一致性超预期特征。持续性方面，今年提价之后价盘向下顺价、大盘提升、费用端收缩，仍维持强劲 增长，说明大单品生命周期还处于前中期；对比历史上同价格带的大单品，150-200 万吨可能是中期 维度可见的天花板，且在格局此消彼长下喜力会持续吃掉竞品份额。 Q2：喜力提价后动销未受影响，是否代表行业性需求复苏信号？ 答：我们认为这不太代表广谱性的需求复苏，更多反映的是喜力作为大单品周期仍在上行阶段，阶段性 供需偏紧使其有提价的能力和意愿，并且能够成功传导下去。当前其他公司提价的概率较低，核心约束 还是在于需求。广谱性提价至少需要等待到明年，观察明年旺季之前或明年春节有没有比较好的表现。 Q3：华润啤酒 2026 年是否还会继续计提白酒减值？ 答：存在这个可能性，但目前还不能下结论。整体白酒今年的需求从春节后的情况来看还不是特别好， 还没有到彻底右侧的状态。需要继续观察后续白酒需求的恢复情况。 Q4：华润啤酒当前估值和股息率水平如何？ 答：按照当前收盘价计算，华润啤酒市盈率约 10.7 倍，按过去 12 个月股息计算股息率约 5.2%。我们 认为这是一个相对比较扎实的底部位置。 Q5：华润啤酒 2025 年的分红和派息率情况如何？未来分红趋势怎么看？ 答：2025 年分红约 10.2 亿元人民币，派息率按调整口径约 53%，股息率约 5%出头。我们认为未来随 着国企对股息率和回报要求的提升，公司分红率会稳中有进，整体分红还有提升空间。 Q6：如何看啤酒行业未来的提价节奏？ 答：历史上啤酒是从通胀受益的资产，在温和通胀周期中受益程度仅次于白酒，与乳制品、肉类接近。 后续需要观察通胀能否在需求催化下形成涨价预期。当前广谱性提价的概率较低，核心约束在需求端， 至少需要等待到明年观察春节或旺季前的表现。 Q7：华润啤酒 2026 年量价两端相比 2025 年会有怎样的变化？ 答：我们认为今年量价两端可能都会比去年表现相对更好。量方面，2025 年总量有约 1.4 个百分点的 销量提升（中低档表现较好），2026 年预计能维持这样的状态或略低；价格方面，2025 年因一次性 费用投入及相关影响，均价同比下滑，2026 年表现预计会略好，尤其是喜力 30%左右的销量增长对整 体均价有明确的提振效果。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 原文 华润啤酒 20260811_原文 2026 年 08 月 13 日 发言人 这个内容，我是国泰中食品饮料的分析师杨鑫，今天我来汇报一下，我们对于这个啤酒行业和华润啤酒 的一个看法，一些推荐的逻辑。首先还是跟进一下行业近期的一个情况。这样我们再阐述一 3-54:2ee5a3989453", "kind": "post", "title": "2026-08-13 13:54", "source_label": "帖子正文", "excerpt": "【东北电子】寒武纪：预付款是需求的具现，82.48亿元存货打开收入接力26H1实现营收59.96亿元，同比+108.13%", "content": "【东北电子】寒武纪：预付款是需求的具现，82.48亿元存货打开收入接力26H1实现营收59.96亿元，同比+108.13%；归母净利润23.11亿元，同比+122.61%。Q2营收31.11亿元，同比+75.83%、环比+7.84%；归母净利润12.98亿元。预付款是存货增长的来源，存货是收入增长动力。芯片设计公司从需求到收入的传导顺序是“客户需求确定→向代工厂投片、预付款增加→晶圆回片、存货增加→交付确收”，三项指标通常依次滞后约一个季度。因此，Q2营收环比仅+7.84%，更多反映新一轮投片后存货尚未转化为收入，而非需求走弱。投片大幅增加，存货接近翻倍。25Q4至26Q1，预付款由7.45亿元增至18.97亿元，新一轮大规模投片启动；26Q2存货由44.97亿元增至82.48亿元，创历史新高。按历史传导节奏，该批存货对Q3收入构成充分支撑；Q2预付款又增至29.14亿元，环比+53.6%，对Q3存货和Q4收入形成接续。投片渠道畅通，存货向收入转化条件改善。此前供应不确定阶段，存货中需保留较高比例的安全库存；本轮预付款连续大额投放并按季转化为存货，表明投片渠道畅通、产能供应有保障，防御...", "publish_time": "2026-08-13 13:54", "tags": ["文字观点"]}, "post:2026-08-13T20-12:2a7f34855632": {"id": "post:2026-08-13T20-12:2a7f34855632", "kind": "post", "title": "2026-08-13 20:12", "source_label": "帖子正文", "excerpt": "华为是国内AI芯片市场的明确领导者，但制造产能仍是瓶颈 华为被认为是中国国内AI芯片市场的明确领导者，预计出货量将达到120万片。", "content": "华为是国内AI芯片市场的明确领导者，但制造产能仍是瓶颈 华为被认为是中国国内AI芯片市场的明确领导者，预计出货量将达到120万片。其中约60%以独立硬件形式销售，25%通过服务器销售，15%通过公共云（GPU租赁）销售。阿里巴巴的平头哥半导体（T-Head）位居第二梯队，紧随其后的是寒武纪和海光信息。尽管进展显著，但制造产能仍然是国内芯片供应的主要瓶颈，华为目前的订单需求远超其计划出货量。#文字观点", "publish_time": "2026-08-13 20:12", "tags": ["文字观点"]}, "post:2026-08-13T08-03:8ec97ebc9678": {"id": "post:2026-08-13T08-03:8ec97ebc9678", "kind": "post", "title": "2026-08-13 08:03", "source_label": "帖子正文", "excerpt": "【广发电子】NV Rubin Ultra 机架变化三大利好 根据SemiAnalysis，当前 Rubin Oberon 机架采用“10+9+8”的托盘布局，Rubin Ultra", "content": "【广发电子】NV Rubin Ultra 机架变化三大利好 根据SemiAnalysis，当前 Rubin Oberon 机架采用“10+9+8”的托盘布局，Rubin Ultra Oberon 机架托盘布局调整为“9+18+9”。 增量1️⃣Compute Tray PCB层数从 26 层增加到 30 层 ，Compute Tray 单卡PCB价值量进一步提升。利好：胜宏科技、鹏鼎控股。 增量2️⃣NVLink Switch 托盘数量从 9 个增加到 18 个，带动Switch Tray PCB单机柜数量翻倍。利好：胜宏科技、沪电股份、鹏鼎控股、景旺电子、方正科技等。 增量3️⃣ 第二层scale up网络采用NPO，单卡对应新增4个NPO，NPO中mSAP价值量相比1.6T光模块显著增长。利好：鹏鼎控股、景旺电子、方正科技等#文字观点", "publish_time": "2026-08-13 08:03", "tags": ["文字观点"]}, "post:2026-08-13T12-49:6ed4f6d4a4a7": {"id": "post:2026-08
