blish_time": "2026-08-13 23:24", "tags": ["文字观点"]}, "post:2026-08-13T11-30:f8ea2e9a4a16": {"id": "post:2026-08-13T11-30:f8ea2e9a4a16", "kind": "post", "title": "2026-08-13 11:30", "source_label": "帖子正文", "excerpt": "北美科技观点：反攻仍在进行时，优选强阿尔法标的 🚀东山精密：光模块凭借物料优势斩获多家北美客户，未来几个季度出货量环比翻倍增长，新一线光模块厂商地位加速确立。", "content": "北美科技观点：反攻仍在进行时，优选强阿尔法标的 🚀东山精密：光模块凭借物料优势斩获多家北美客户，未来几个季度出货量环比翻倍增长，新一线光模块厂商地位加速确立。光芯片与北美多家客户达成战略协作，深度受益于NPO/CPO产业趋势，有望成为光芯片环节的核心受益者。市值对标xys！ 🚀大族激光/数控：超快激光设备迎来产业化拐点，全面受益于1.6T光模块、NPO及NV下一代主板升级需求，百亿级爆款设备市场加速开启。 🚀深南电路：PCB六边型战士，在msap/ABF/BT等高端PCB领域头部玩家，未来几年相关领域迎来爆发式发展，公司有望深度受益。 🚀高端CCL及其供应链：海外CCL高端订单持续外溢，生益科技作为大陆高端CCL龙头，引领大陆高端CCL全球份额从1成左右快速提升，联瑞新材/呈和科技系核心材料供应商。#文字观点", "publish_time": "2026-08-13 11:30", "tags": ["文字观点"]}, "post:2026-08-13T17-39:687973875432": {"id": "post:2026-08-13T17-39:687973875432", "kind": "post", "title": "2026-08-13 17:39", "source_label": "帖子正文", "excerpt": "关注催化，科技情绪触底后，从筹码结构较好的应用率先反弹，硬件MLCC、PCB、半导体等跟上普涨，材料端同步修复，建议重点关注各细分赛道龙头。", "content": "【申万宏源化工】化工新材料推荐：科技反弹后逐步分化聚焦，材料端如何布局？ 一、强AI相关方向：短期买反弹，中长期买持续性和确定性 #短期轮动反弹、推荐细分赛道龙头、关注催化，科技情绪触底后，从筹码结构较好的应用率先反弹，硬件MLCC、PCB、半导体等跟上普涨，材料端同步修复，建议重点关注各细分赛道龙头。 #中长期分化、聚焦核心、关注持续性与确定性，此前AI带动各板块景气，买的无非是量、价、新产业/技术趋势，后续看： 从量、价角度看，上一轮行情预期较为充分，尤其涨价预期，在AI板块基本面未有重大变化前，重复上一轮故事资金参与兴趣减弱，因此市场会进一步聚焦核心，建议重点关注技术壁垒、扩产壁垒跟高的赛道，具备更高的持续性和确定性，具体标的核心关注产品壁垒、格局和市场地位，重点推荐半导体核心材料标的#雅克科技、鼎龙股份、广钢气体、安集科技； 从新技术趋势角度看，建议重点关注半导体封测方向，先进封装发展加速产业链国产化替代进程，未来2-3年半导体技术变化更多集中在封测环节，材料企业迎来业绩+估值共振，标的方面关注业绩增速与技术客户卡位，重点推荐#...", "publish_time": "2026-08-13 17:39", "tags": ["艾森股份、华海诚科、天承科技", "文字观点"]}, "attachment:files/ptfe方案进展及硅微粉行业机会.docx": {"id": "attachment:files/ptfe方案进展及硅微粉行业机会.docx", "kind": "attachment", "title": "ptfe方案进展及硅微粉行业机会", "source_label": "其他", "excerpt": "高阶化学球硅的国内主要企业是联瑞、凌玮、锦逸这三家，其他还有量比较小的，比如雅克科技下面的公司。", "content": "各位同事，大家上午好啊。欢迎参加我们团队组织的这个系列会。本场我们其实主要还是重申一下对硅微粉这个行业的一个推荐。我们周二也请了生益的专家，做了一个交流，核心其实是探讨PTFE方案最终采用的概率，预计可能在85亿左右。 当前主流的方案主要有两个：一个是PTFE CCL加碳氢PP，另一个是M10级别的碳氢CCL加M10级别的碳氢PP。PTFE方案的进展方面，生益应该是进展最快的，他们送样的结果已经通过了六家板厂的测试，七月份将进行终端厂商的测试。另外，台光和联茂也分别在今年的四月份和六月份开始送样。PTFE的测试结论预计在四季度出来。当前进展最快的是生益，其次是台光、台耀，南亚和罗杰斯进展相对偏慢。 这个方案我们认为对硅微粉行业会有比较大的带动。以前硅微粉是辅材，在CCL的成本结构里占比大概在七八个点。但在PTFE方案下，它可能会成为主材，填充量会有大幅增加。我们和专家交流了解到，一块板子里大概有1到1.3公斤的PTFE（根据厚度），铜箔约0.37公斤，硅微粉至少会在0.3到0.4公斤，填充量会达到50%到65%。 尤其是PTFE对介电常数和损耗系数要求更高，所以大概率都会用到化学法的球硅。这不仅是量的增加，也是价值量的增加。价值量方面，M5、M7、M9级别或PTFE级别的硅微粉，日系化学法的价格在100万/吨，国内大概是50万到80万/吨。 高阶化学球硅的国内主要企业是联瑞、凌玮、锦逸这三家，其他还有量比较小的，比如雅克科技下面的公司。国瓷材料有1000吨产能，但级别、价格和性能上可能还有差异。从生益科技的供应商来看，主要是联瑞和凌玮两家。周二专家表态可能是各占一半，但具体量我们还要再核实。苏州锦逸主要供台光、生益，还有三十几家未上市的公司，他们也开发了化学法球硅，目前在斗山、生益、台光做认证。从量的角度来说，最大的是联瑞和凌玮。我们团队也在覆盖球硅，近期也在积极推荐。周一我们在客户群里重点提示了这个板块的机会，今天表现非常不错。下面把时间交给研究员，我们有个PPT和深度报告，可以再简单过一下，重申一下这个板块的核心梳理，有请。 大家好，我是团队研究员。我今天再给大家过一遍行业深度。我们认为后续化学球硅的价值量提升主要体现在两个方面：一是性能提升带来的价格提升，二是存在较大的供需缺口，会进一步带来需求提升和价格提升。 硅微粉主要用于填充材料，最开始是用于降低膨胀系数。随着高频高速性能的介入，开始要求其具备低的介电常数和低介电损耗。硅微粉的类型从角形演化出了球形。球形又分为火焰法、直燃法和化学合成法三种工艺。火焰法只能做微米级颗粒，纯度不好；直燃法纯度和球化度较好，但难以精确控制亚微米或纳米级的粒径分布；化学合成法纯度接近100%，球化率、球形度和粒径均匀性都很好。化学合成法从角形粉发展到现在，具备较大的工艺壁垒，比如容易团聚，要在分散度、球化率、球形度、均匀性等方面保持很小的窗口非常难。 我们简单列了一下头部厂商的积累时间。日本雅都玛在90年代创造了直燃法，到2000年，头部企业已占全球高端球硅70%以上份额。国内企业如联瑞，2000年开始布局高端球硅，2006年布置了第一条高端化学球硅生产线。凌玮收购子公司江苏辉迈，其实控人16年前就从事该行业，从16年建立公司到现在也有十年时间。工艺积累时间很长，短期内不具备相关经验积累很难进入。 另外，下游客户定制性强。不同覆铜板厂商对硅微粉、铜箔、树脂的介电常数和介电损耗是总包概念，对原材料质量要求不一致，所以上游原材料企业一旦进入供应链，可替代性就很小。 硅微粉下游主要应用于电子封装和覆铜板。增量最大的包括高频高速覆铜板和电子封装里的HBM（可能用到low alpha球硅，价值量较大）。传统覆铜板中硅微粉填充比在10%几，到M8、M9已提到30%左右，下一代M9可能提到35%到40%，如果到PTFE方案用量会更大。 作为填充料，硅微粉是不是必须选项？我们和专家及公司交流了解到，要保证低膨胀系数、低介电常数、低介电损耗、高导热性，以及高填充率下的流动性和分布均匀性，球形硅微粉是最优选择，暂时没有其他可替代方案。覆铜板中高性能球硅比例预计到2027年将提升到56%以上。 CCL中硅微粉存在明确的迭代路径：M1、M5以角形粉为主，单价500到5000元/吨；M6开始切入火焰法微米级球硅，单价1到2万/吨；M7、M8用到直燃法亚微米球硅，国内单价10到20万/吨；下一代M9全面切入溶胶凝胶亚微米球硅，国内单价30到60万/吨。不同代际产品价格跃升非常大，能做的厂商越来越少，价格越来越高。展望M10，产品可能向纳米级延伸，填充比例和价值量都会有大跃升。硅微粉企业的量和价弹性都非常强。后续AI服务器和四大云厂资本开支高企，硅微粉将随着M8、M9市场规模放量而持续放量。 我们做了测算：M8和M9如果2027、2028年分别以6000万张、1万万张计算，单张覆铜板重量1100克，树脂重量占比44%，化学球硅填充比40%，对应单张化学球硅需求量200克。对应27、28年球硅需求量分别为1.21万吨和2.1万吨。另外，PCB板向多层发展，中间要加半固化片，其结构和覆铜板的core板一样，材料用量一致。台光、生益新投建产能中，半固化片和覆铜板需求用量接近3:1。分别按比例乘，再考虑10%损耗，对应27、28年化学球硅用量分别为4万吨和8.5万吨。如果考虑涨价预期，27、28年按40、50万/吨价格计算，市场规模到27年160亿元，到28年约400亿元。 PTFE方案下，化学球硅填充率提到60%到70%，这部分PCB板主要用于交换机背板，按30%比例乘，对应27、28年化学球硅用量为4.77万吨和10万吨。PTFE方案下用量更多，但就算方案不成型，下一代M8、M9的球硅用量也很大。PTFE方案更多是催化作用，下一代方案本身球硅量就会非常大。 先进封装方面，覆铜板对硅微粉要求是low Dk、low Df和膨胀系数，先进封装特别是HBM对low alpha射线有较大要求。先进封装以前用微米级产品即可满足。从需求端看，环氧塑封料市场年复合增速个位数，能为微米级球硅带来稳定需求。高性能low alpha球硅是后续增量，HBM到3、4代易出现alpha射线软错误，需要填low alpha球硅和球铝。后续市场规模持续放量，low alpha球硅单价卖到一两百万/吨，比覆铜板用化学球硅还贵。这也是联瑞表现好于凌玮的原因之一，联瑞卡位好，low alpha球硅布局领先，是全球仅次于雅都玛的第二家稳定供应企业。 供给端，高端球硅由日本企业占据，日本电话、日本农村、清水铁占全球70%以上份额。亚微米和纳米级领域，雅都玛是绝对第一梯队。新增产能方面，能做亚微米的企业以电话和雅都玛为主，电话目前没有扩产计划，雅都玛的新产能要到27年底、28年初投产。26、27年日本厂商没有新产能。矢野经济2025年披露亚微米球硅市场规模约5亿元，按单价8万/吨算对应6000多吨，雅都玛70%份额约4000多吨。26年全球出货预期约9000吨到1万吨，日本6000吨加国内3000吨（联瑞2000吨，其他1000吨）。如果按前面测算，M8、M9覆铜板27年用量达4.2万吨，PTFE方向更多，但供给端量还很小，存在较大供需错配窗口，会导致价格进一步上行。国内价格比日本价格低很多，随着国产替代，国内厂商价格会向日本厂商价格趋同。 国内高端化学球硅布局核心企业主要有联瑞、凌玮、锦逸三家。30G还在验证，未进供应链，暂不考虑。进入下游四大厂商供应链的主要是这三家。联瑞之前一直做硅微粉，25年结构里角形粉和球硅为主，球硅营收除以出货4.2万吨，单价1.5万，对应熔融法物理法球硅，中低端产品。26年后核心增量在化学球硅，25年下半年投了600吨项目，准备募投3600吨化学球硅项目，预计今年底达到3000吨产能，27年通过技改提到5000吨。预计今年亚微米产品出货1500吨。客户方面，生益是联瑞二股东，较合理认为后续较大份额会给联瑞（比如一半）。联瑞在斗山、松下也有供货。6月10日联瑞和生益发了关联交易，全年关联交易额从1.83亿提到3.41亿，增幅90%。上半年关联交易额小几千万，剩下主要在下半年，符合下半年M8、M9放量带来高端球硅需求放量的情况，增加的部分应主要聚焦高端化学球硅。 凌玮科技26年并表江苏辉迈70%股权。江苏辉迈行业深耕时间长，之前稳定供应贸易，在生益有供货，但量还小。后续准备新建3000吨产能，预计今年底建成前端，明年上半年后端建成。从节奏看，联瑞比凌玮快一些。 锦逸卡位好，正在上市，有全系列工艺手法包括化学合成法。客户主要是台光，70%营收来自台光，50%毛利也来自台光，绑定强。如果锦逸上市，排位可把联瑞和锦逸排第一，确定性最强，凌玮排第二，弹性更大。 从盈利端看，主要按两方面：一是按现有规划，联瑞按5000吨出货、单价50万/吨、净利率6-7、给20-30倍PE，净利润约20亿，对应市值约600亿，还有空间。凌玮按同样预测，弹性可能更大。二是按生益份额预测，生益27、28年出货预期分别按1800和4200万张算，对应全球占比30%-40%，对亚微米球硅需求量0.73和1.69万吨。给联瑞50%、凌玮25%市占率，联瑞28年需求接近9000吨，净利润约30亿，30倍PE接近1000亿市值，弹性较大。凌玮25%占比对应4000吨需求，利润约14亿，30倍PE约450-500亿市值，弹性也很大。 综合来看，硅微粉一方面性能提升带来价格提升，另一方面有明确供需缺口，后续价格会随下游需求释放而提涨。国内几家硅微粉企业正处在价值量提升窗口，后续弹性充足。以上是对高端化学球硅的讲解，如有疑问可以私信我。今天会议到此结束，谢谢大家。 对全文的详细总结： 本次会议主要重申了对硅微粉行业的推荐，重点讨论了PTFE方案进展及其对硅微粉需求的影响，并详细分析了高端化学球硅的市场前景、供需格局、国内厂商布局及投资价值。 一、PTFE方案进展与硅微粉价值提升 当前主流覆铜板方案有PTFE CCL加碳氢PP和M10级别碳氢CCL加碳氢PP两种。PTFE方案进展最快的是生益科技，其送样已通过六家板厂测试，七月份将进行终端测试；台光和联茂也已开始送样，预计四季度出结论。相比传统方案，PTFE方案中硅微粉从辅材变为主材，填充量从10%-30%大幅提升至50%-65%，每块板子硅微粉用量约0.3-0.4公斤，且要求使用更高价的化学法球硅（国内50-80万/吨，日系100万/吨），量价齐升。 二、硅微粉技术迭代与价格跃升 硅微粉从角形粉发展到球形粉，再细分为火焰法、直燃法和化学合成法。化学合成法工艺壁垒高，纯度接近100%，球形度、粒径分布均匀，是高端应用的首选。随着CCL代际升级（M1→M9），硅微粉类型从角形粉→火焰法球硅→直燃法球硅→溶胶凝胶球硅，单价从500-5000元/吨跃升至30-60万/吨，每代价格提升数倍。下一代M10/PTFE方案将向纳米级延伸，填充比例和价值量进一步提升。 三、需求测算与市场空间 M8/M9覆铜板：假设2027、2028年出货量分别为6000万张、1亿张，单张耗用化学球硅约200克，对应球硅需求1.21万吨、2.1万吨。考虑半固化片（用量约覆铜板的3倍）及10%损耗，2027、2028年化学球硅总需求预计达4万吨、8.5万吨，对应市场规模（按40-50万/吨）为160亿元、400亿元。 PTFE方案：若填充率提至60%-70%，且主要用于交换机背板（按30%比例），对应2027、2028年化学球硅用量4.77万吨、10万吨，用量更大。 先进封装：HBM等应用对low alpha球硅需求增长，单价高达100-200万/吨，提供额外增量。 四、供给端与供需缺口 全球高端球硅（亚微米及以下）主要由日本企业（雅都玛、电话等）占据，它们占70%以上份额。但日本厂商在2026-2027年没有新产能投产（雅都玛新产能27年底/28年初才投产），而国内需求正快速爆发。2026年全球亚微米球硅出货预期约9000-10000吨（日本6000吨+国内3000吨），而2027年仅M8/M9覆铜板需求就达4.2万吨，供需缺口巨大，将推动价格持续上行。国内厂商价格目前仅为日系的一半左右，随着国产替代，价格有向日系趋同的空间。 五、国内核心厂商分析 联瑞新材：生益科技是其二股东，绑定紧密，现有产能规划预计2025年底达3000吨（化学球硅），2027年通过技改至5000吨。2025年关联交易额大幅提升90%，体现了高端球硅的放量。在low alpha球硅领域是继雅都玛后全球第二家稳定供应企业，布局领先。 凌玮科技：收购江苏辉迈70%股权，深耕行业多年，有生益等客户，但量仍小。规划新建3000吨产能，节奏略慢于联瑞，弹性更大。 锦逸科技：未上市，但卡位优秀，与台光深度绑定（70%营收来自台光），全工艺路线包括化学法，认证中。若上市，确定性可与联瑞并列第一梯队。 六、投资价值与弹性测算 联瑞：按5000吨出货、单价50万/吨、净利率约6-7、PE 20-30倍，净利润约20亿，市值约600亿；若按生益份额（50%），2028年需求近9000吨，净利润约30亿，30倍PE对应市值近1000亿。 凌玮：按类似方法，2028年对应4000吨需求，利润约14亿，30倍PE对应市值约450-500亿，弹性更大。 结论：硅微粉行业正经历由PTFE方案及代际升级驱动的量价齐升，供需缺口明确，国内头部企业处于价值量提升窗口期，具备高弹性。重点推荐联瑞新材、凌玮科技，关注锦逸科技上市进展。", "status": "extracted"}, "post:2026-08-13T11-03:379a092f04b1": {"id": "post:2026-08-13T11-03:379a092f04b1", "kind": "post", "title": "2026-08-13 11:03", "source_label": "帖子正文", "excerpt": "光模块液冷Cage双雄跟踪更新：鼎通科技与奕东电子的百亿机遇 受益于1.6T光模块的放量，液冷Cage赛道正迎来一次历史性的产业机遇。", "content": "光模块液冷Cage双雄跟踪更新：鼎通科技与奕东电子的百亿机遇 受益于1.6T光模块的放量，液冷Cage赛道正迎来一次历史性的产业机遇。与多数依赖“国产替代”逻辑的科技赛道不同，该领域在全球范围内已经形成了极具确定性的双寡头垄断格局，相关核心标的——鼎通科技与奕东电子，在未来两年内的利润释放将具备极高的确定性。 一、行业大势：1.6T放量驱动，液冷Cage迎“量价齐升”爆发 随着AI算力需求的飞速增长，光模块的传输速率正加速从800G向1.6T乃至3.2T迭代。速率的提升不可避免地带来了功耗的急剧攀升。当1.6T光模块功耗突破45W时，其热流密度已超过100W/cm2，远超传统风冷的散热极限，从而使得液冷散热成为必选项。 这种技术更迭带来了显著的“量价齐升”效应： 1. function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
