内外同频共振 国内：腾讯WorkBuddy 6 月月访问量 2097 万次登顶国内桌面端办公 Agent（超第二、三名之和），并 联合腾讯文档推出人机双写协同；阿里内测“千问办公”，整合 QoderWork、悟空、MuleRun 三条 Agent 产 品线；字节将飞书产品并入豆包、飞书销售服务体系与火山引擎整合，集中力量打 B 端办公。 海外：OpenAI 整合 Codex 后的 Agent 产品周活迅速突破 1000 万，CFO 内部信披露 7 月单月 ARR 已超整个二季度。背景是 C 端格局已经固化——截至 6 月，豆包月活 3.82 亿、通义千问 1.67 亿、 DeepSeek 1.3 亿，前三座次连续两个季度未变，大厂竞争焦点自然转向 B 端。我们认为，办公 Agent 是下 半年 AI 应用确定性最高的方向，模型厂的竞争正从 C 端聊天转向组织工作流入口。 3 / 多模态进入开源时刻：海螺 3 把开源视频模型带进第一梯队 7 月 31 日 MiniMax 发布海螺 H3 并宣布开放权重：Artificial Analysis 盲测文生视频（含音频）Elo 1242 全球第 2、视频编辑全球第 1，首次将开源视频模型带进第一梯队； 2K 定价约 0.8 元/秒，为同业旗舰 的 1/3~1/2。我们认为，开源+性价比将进一步降低多模态使用门槛、提升渗透率。 仅供内部参考，请勿外传！ 信息技术 行业动态报告 【投资建议】重视低位、业绩向好 /稳健的互联网+游戏标的投资机会，同时继续关注大模型公司。  互联网：【腾讯控股】【阿里巴巴】【哔哩哔哩】  游戏：【网易】【巨人网络】【心动公司】【恺英网络】等  重视有垂类专业数据优势、需要精细化运营的公司，壁垒更高： 【美图】【汇量科技】等  多模态相关标的  国产大模型公司：【智谱】【MiniMax】 2、全球AI产业进展 大模型：DeepSeek V4 Flash 正式版发布；多模态模型密集上线。继续关注 Q3模型迭代 DeepSeek V4 Flash正式版7月31日正式上线。官方称Agent 能力大幅增强、基准远超 V4-Pro- Preview：Terminal Bench 2.1达82.7；284B 总参/13B 激活，结构与预览版一致、仅重做后训练 Artificial Analysis当天放榜：V4-Flash 智能指数 50 分，反超自家V4-Pro 6分，仅低于GPT-5.6 Luna（51 分）1 分， 测试 token 用量较上代降 12%。 图1:大模型智能水平指数： DeepSeek V4 Flash正式版评分50，较GLM 5.2（max）低1分 数据来源：Artificial Analysis，中信建投证券 仅供内部参考，请勿外传！ 信息技术 行业动态报告 Seedance 2.5正式上线，海螺3把开源视频模型带进第一梯队。 1）7月31日，Seedance 2.5正式发布（正 在陆续上线即梦AI、豆包专业版等平台， API 服务也将在近期上线火山方舟），延续了 2.0统一的多模态音视 频联合生成架构，重点突破长叙事能力、多模态参考能力和编辑能力。 2）同日，MiniMax 发布海螺 H3 并宣 布开放权重：Artificial Analysis 盲测文生视频（含音频） Elo 1242 全球第 2、视频编辑全球第 1，首次将开源 视频模型带进第一梯队； 2K 定价约0.8元/秒，为同业旗舰的1/3~1/2。 继续关注Q3模型更新： 1、GLM 5.3/5.5或将于8月发布，预计GLM 5.5参数过万亿。 2、MiniMax M3大参数版本有望9-10月发布。 3、DeepSeek V4 Pro满血版官方定档8月。 4、马斯克X发帖：Grok 4.6将于8月7日发布 5、GPT 6、Qwen 3.8\\Qwen 4、Hy4有望Q3发布。 6、继续关注Gemini 3.5 Pro的发布节奏。 商业化：token继续降价；OpenAI 7月ARR或提速增长，办公 Agent进展快 本周token综合成本继续下降： 降价与开源叠加，前沿模型可得性提升、使用成本下降 。 1/API定价：7月31日，DeepSeek V4 Flash正式版发布，每百万tokens输入/输出人民币1/2元，峰时翻 倍，为国内前沿模型的最低价。 OpenAI宣布GPT-5.6系列降价，Luna版降低80%；Terra版降低20%，定价 已低于Kimi K3；Sol不降价，但推出快速模型，速度提升至 2.5倍，价格翻倍，智能水平不变。 印证此前我们 的判断：模型能力是支撑定价的核心，定价分化将继续存在；但综合价格或将呈现下降趋势。 2/开源：Kimi K3（2.8T）  "source_label": "帖子正文", "excerpt": "📰独家：长鑫存储计划在北京建设第二座芯片工厂，并就其融资事宜进行洽谈，消息人士称📅8 月 3 日（路透社）—— 据两位知情人士透露，中国市值最大的芯片制造公司长鑫存储（CXMT），正考虑在北京建设第二座存储芯片工厂，并正在与一处由当地政府扶持的科技制造中心开展融资相关谈判。📈该计划落地的背景是，受人", "content": "📰独家：长鑫存储计划在北京建设第二座芯片工厂，并就其融资事宜进行洽谈，消息人士称📅8 月 3 日（路透社）—— 据两位知情人士透露，中国市值最大的芯片制造公司长鑫存储（CXMT），正考虑在北京建设第二座存储芯片工厂，并正在与一处由当地政府扶持的科技制造中心开展融资相关谈判。 📈该计划落地的背景是，受人工智能基础设施投入带动，全球芯片供给出现短缺，长鑫存储希望借此扩充产能。 🏙️这一事件也凸显出国内各地方政府争相吸引长鑫存储落地建厂的竞争持续加剧，这家存储芯片制造公司在上月完成规模 86 亿美元的首次公开募股后，正在大力推进产能扩张，本次 IPO 是中国大陆半导体行业史上规模最大的上市融资交易。 📰路透社此前曾报道，长鑫存储已经在上海、合肥推进新工厂建设，同时还在和其他多地政府洽谈新建生产设施。 🏭上述全部项目完全投产后，公司整体晶圆产能有望实现翻倍，月产能突破 60 万片 12 英寸晶圆。 📍知情人士表示，这座全新的北京 12 英寸晶圆厂选址亦庄，地处北京市中心东南方向约 20 公里（12 英里），长鑫存储在此已有一座正在运营、量产动态随机存取存储器（DRAM）芯片的晶圆工厂。 🔒相关...", "publish_time": "2026-08-03 18:11", "tags": ["文字观点"]}, "attachment:files/国泰海通计算机｜国产超节点与AI算力近况更新20260802.pdf": {"id": "attachment:files/国泰海通计算机｜国产超节点与AI算力近况更新20260802.pdf", "kind": "attachment", "title": "国泰海通计算机｜国产超节点与AI算力近况更新20260802", "source_label": "其他", "excerpt": "国泰海通计算机｜国产超节点与 AI 算力近况更新-20260802 一、超节点性能对标与参数取舍逻辑 NVL72 与国产超节点性能对比 ：NVL72 的核心硬件优势在于 NVL C2C 互联可实现 Grace CPU 与 GPU 缓存一致性，推理端高容量 TV Cache 可卸载到内存，极大拓展 超长上下文能力，该能力是一体化硬件设计的结果，与单纯的内存、带", "content": "国泰海通计算机｜国产超节点与 AI 算力近况更新-20260802 一、超节点性能对标与参数取舍逻辑 NVL72 与国产超节点性能对比 ：NVL72 的核心硬件优势在于 NVL C2C 互联可实现 Grace CPU 与 GPU 缓存一致性，推理端高容量 TV Cache 可卸载到内存，极大拓展 超长上下文能力，该能力是一体化硬件设计的结果，与单纯的内存、带宽优势不属 于同一维度。 国产超节点方面 ：仅华为具备 CPU、GPU、互联带宽全栈自研能力，阿里接近华为 水平，其余第三方厂商的超节点均采用解耦架构，硬件层面已存在较大差距，互联 协议改造效率也远低于具备一体化设计能力的厂商，最终性能差距明显。 软件层面 ：当前大量模型预训练多采用 FP8 到 FP6、FP16 混合精度，更多场景已 使用 FP4，BF16 精度资源消耗更高，易出现内存溢出，效率低于主流精度方案，且 量化后需要投入大量研发成本保障模型准确度，因此当前国产超节点暂无法直接对 标 NVL72。 当前国产超节点应对方式 ：多通过数量堆叠的方式弥补效率不足，主流产品包括 深腾 3-84、1024 卡 950P、阿里 PPU1.5 代替久 128，二线国产超节点也在推进相关 研发工作。 参数取舍优先级 ： 1. 利用率第一位：推理端最终追求 token 成本，利用率提升 是核心目标； 2. 延时其次：延时的硬件限制属于物理约束，可通过软件优化提升 部分性能； 3. 规模最后：受利用率、延时的前置限制，当前规模难以大幅扩张， 后续可通过 scale up 方式进行弥补。 硬件制约因素 ：超节点规模、延时的核心硬件制约因素为芯片 C Die 的 Serdes 数 量与互联芯片带宽，协议开发效率与厂商自研芯片能力正相关。国际厂商博通已对 原 TH 芯片进行改造推出 TF BOM，抢占超节点赛道市场。 二、CSP 招标逻辑与交换芯片替代 CSP 招标核心考量因素 ： 1. 供应链安全与持续供应能力：一线 CSP 引入国产 CPU 最小量级为万片以上，需对芯片进行系统性优化以适配自身软件栈。CSP 不会为采 购硬件接受硬件厂商提供的自研软件避免被绑定，要求芯片厂商针对 CSP 需求做定 制化软件开发。 2. 软件栈开放程度：直接决定其能否大规模应用到 CSP 的整体平 台中，原厂算子层开发能力与投入会影响 CSP 后续软件研发投入及上线周期，和最 终成本直接相关。 总线架构偏好 ：CSP 对专有总线/开放以太网无特殊偏好，更倾向自研超节点内部 芯片与协议，2024-2025 年提出的纯以太网互联方案均未通过。 盛科交换芯片替代进展：当前主流国产超节点产品包括摩尔线程S6000、碧润 BR200、阿里PPU1.5代等。目前盛科芯片替代进度较慢，仅摩尔线程二期采用润科 交换芯片，其余超节点大多采用自研方案或小型第三方厂商开发的芯片，盛科暂无 大规模scaleup场景应用。 三、超节点量产堵点与采购格局 量产核心堵点：CDie主芯片供应是当前国产超节点最大量产堵点。次一级堵点包 括高端PCB交期较长，100kW以上机柜的高压直流电源研发进度及高压安规问题， 以及互联芯片、Serdes供应不足。散热件、结构件从当前订单递交情况来看无供 应压力，处于正常工程研发进度。 各领域客户采购结构：1.互联网CSP采购：-阿里PPU1.5代总规划50万片， 80%为超节点用于公有云，剩余风冷机型用于混合云；同时引入升腾950PR作为第 二大规模采购芯片，以四进三或五进三的方式储备1-2款国产芯片作为备选，海光 DCU早已引入测试，最终备选厂商暂未明确；-字节跳动采购寒武纪芯片，升腾 950PR2026年5月开始交付，总量约十几万张，具体交付节奏暂不明确。2.运 营商采购：以升腾产品占比最高，摩尔线程S6000超节点大概率进入中国移动数据 中心，其下一代芯片die规划量50万以上，最终交付规模与前端销量挂钩。3. 政企客户采购：以价格为核心考量，阿里PPU1.5代交付上限有限，1.7代正在加 速研发，未来出货规模更大。 自研与第三方超节点关系：互联网厂商首选自研超节点，整套系统自研可实现最 高token效率、最优成本，第三方超节点仅为替补，只有具备大规模供应能力才可 能成为互补。政企客户更偏好开箱即用的交付方式，首次采购成本是其核心考量因 素。 迁移与适配开发成本：跨平台迁移成本较低，在CSP投资中占比极小，CSP更关注 设备对自身软件线的适配性。设备适配开发成本较高，通常需百人团队驻场6个月 以上才能实现设备稳定运行。 四、国产超节点性能测试与产能节奏 推理性能测试数据（风冷八卡机器token生成效率）：-PPU1.5代风冷机型：可 实现5万/台/月的token生成效率，超节点尚未完成优化的前提下效率已达风冷机 型的2-3倍，对应128集群还可再乘以芯片数量放大规模效应。PPU1.5是已测产 品中投入产出比最高的选项；-沐曦风冷机型：token生成效率约为2.5万/台/ 月，目前其C600超节点尚未推出；-摩尔线程S500：效率约为3-3.5万/台/ 月，但存在显存不足的短板，实际商用场景中需搭配英伟达集群做TTN0效果更 佳；-海光BW1100：效率低于3万/台/月，核心原因并非芯片性能不足，而是算 子软件优化投入不足，导致优化成本较高。 各厂商超节点产能节奏：-昆仑芯P800超节点：华三出货量小于100柜，中兴 出货量在300-500柜区间；-必润BR200：目前仍处于仿真阶段，尚未拿到完整 样片，2027年上半年计划交付近400柜，采用博通TFOne交换机的84卡超节点 架构，后续有两个核心客户要求扩容至万卡规模；-海光：过往交付主要面向郑 州数据中心，以自主交付为主；-寒武纪690：目前处于小批量量产阶段，已进 入阿里采购目录，但交付规模及测试情况尚不明确，主要交付自用；-升腾：当 前主力交付910C产品，或受产能影响部分ODM商仍在交付910B4，950TR交付节奏 加快，预计2026年底总交付规模可达30-50万张。 五、国产AI芯片评估与训练能力分析 超节点出货规模与整机份额：华三2026年核心布局PPU机型，下半年PPU出货规 模为6000-10000台；磐久128超节点由其他两家ODM厂商交付，总规划规模约40 万片。升腾相关出货数据暂不明确。 国产AI芯片性能梯队排序：-第一梯队（两款产品）：-阿里PPU1.5代：当 前实测token效率最高的产品，依托成熟制程控制生产成本，同时阿里在软件栈优 化上投入力度大，自有大软件平台保障了产品兼容性与使用效果；-升腾950： 采用FP架构，对模型的支持效率较高，除过于复杂的模型或有CSSP要求的场景 外，实际使用效率表现优异。-第二梯队（产品各有优劣）：-沐曦C550：软 件兼容性最佳，无需依赖原厂支持即可完成适配，软件适配投入成本较低，单台月 成本低于2.5万即可回本，但硬件性能相对偏弱；-海光DCU：芯片本身性能优 异，但算子优化不足，无法充分发挥芯片实际效率。-其余厂商下一代芯片暂未 量产，暂无有效实测数据。 国产芯片基础模型训练能力：当前国产AI芯片尚未出现成熟的大规模基础模型预 训练商用案例。公开可查的相关实践仅有两类：其一为华为开展的小规模模型预训 练，参数规模仅为数十B，体量较小参考价值有限，无公开完整测试数据；其二为 阿里PPU1.0代产品，为美国对华芯片限制出台前流片，仅用于涉密特殊项目，无 公开完整测试数据。整体来看，目前国内暂无表现优异的可用于基础模型预训练的 商用AI芯片。 六、液冷部署进展与超节点技术现状 液冷技术分路径进展：-冷板式液冷：交付进度良好，ODM厂商已基本具备批量 交付能力，落地进度取决于大型CSP或运营商的机房配套环境是否支持大规模交 付；-浸没式液冷：当前参与厂商较少，处于先导项目投入测试阶段，针对单芯 片小于1000W的高密场景测试，预计2027年上半年实现明确量产交付。 头部厂商液冷产品交付节奏：-阿里盘古九128超节点：预计2026年9-10月量 产交付；-海光DCU：采用两相变浸没式液冷，已具备量产交付能力；-昆仑 芯：原有液冷超节点规模较小，以32卡为主，P900以液冷版本超节点为主；- 摩尔线程S6000：风冷采用单die芯片、液冷采用双die芯片，液冷版本最大可支 持256卡，2026年初启动定型设计，预计2027年上半年交付；-BR200液冷超节 点：为8卡设计，首批预计2027年3月小批量交付约几十柜，年中将推出互联芯 片等全栈国产的第二版本，预计2027年Q4/年底有望实现万卡规模交付。 国产超节点技术路线划分 ： - 第一类：具备核心自研能力的厂商： - 升腾：从 CPU、GPU/加速卡到互联芯片全硬件自研，同时具备灵渠全栈内置语义交互研发能 力，紧耦合程度最高； - 阿里磐久 128：核心优势为互联芯片研发能力强，紧耦 合程度仅次于升腾，二者最大差距在软件栈兼容性。 - 第二类：其余国产芯片厂 商：核心短板为 C Die 的 I/O 设计（含 Serdes 数量、外引脚设计）以及与第三方 互联芯片（国产代表为圣科、中兴微、可通智联）的适配难度，因芯片与互联芯片 非同一家设计，难以实现无缝连接、性能最优。 2026年下半年放量情况 ：仅升腾 950、阿里盘古、昆仑芯 P900 具备量产能力，其 余厂商产品均未达量产阶段；其中昆仑芯 P900 为上一代产品，软件栈优化不足， 部分领域适用性有限。 七、超节点相关技术趋势分析 PCIe在超节点中的作用与趋势 ： - 超节点产品设计中，GPU 加速卡做 scale up 时优先通过 RDMA 网卡实现对外互联，或直接出光连接交换柜，PCIe 的作用被弱 化，训练、推理场景尽量减少 PCIe 拓扑的使用。 - PCIe 芯片需求趋势：短期需 求无上涨空间，未来将向边缘/侧端推理场景演进，当模型通过量化、优化压缩后 可部署在单卡实现侧端、边缘端推理时，PCIe 卡将具备应用空间。 - 八卡 PCIe 机组长时间存在，由于超节点采购成本高，仅 CSP 和运营商能够承担，普通行业客 户更倾向于优先低成本落地，八卡 SM 模组适配当前参数量持续提升的模型部署需 求，将长期存在。 ASIC推理芯片的分流影响 ：当前 ASIC 专用推理芯片暂不会对 GPGPU 形成实质性分 流，核心原因是大模型仍处于快速迭代阶段，ASIC 研发人力资源投入成本极高， 一旦模型迭代，前期所有投入将全部归零。仅 CSP 自研的 ASIC 芯片可在部分非常 特定的领域少量采用，大规模推理 token 生成场景目前较少使用这类芯片，当前大 规模推理部署仍以 GPGPU 为主。 内存池化对内存需求的影响 ：超节点内存池化和内存需求量属于两个维度的问 题，内存池化的核心作用是降低 token 成本、提升超长上下文能力，可实现 GPU 的 key cache 通过 CPU 管理的内存做 offload，优化 token 效率与问答体验，并不会 降低内存需求，反而为支持超长上下文可能加大内存投入。CXL 等共享内存池技术 目标是降低内存消耗量，但落地尚早，预计 2028 年左右才能明确应用趋势，当前 阶段优先保障模型使用体验。 HBM 内存墙的突破路径 ：HBM 内存墙的核心突破方向为工艺与材料，多层堆叠的散 热问题是核心瓶颈，需通过材料选型解决多层间热量传导、外部散热问题，才能实 现 HBM 堆栈与 C die 的封装。国产 3D DRAM 方面，东方创新 DF100 0 处于初步尝试 阶段，当前良率偏低，成本与现有 HBM 差距不大，暂无完整的应用效果数据。针对 内存墙性能提升，硬件是核心基础，软件仅能起到辅助加强作用，算子优化可大幅 提升性能，其余软件层面内存相关优化效率提升有限，若 CPU 性能不足，KV Cache offload 到 CPU 的效果不佳。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408", "status": "extracted"}, "attachment:files/中泰证券-机械行业周报(8.3-8.7)：看多光模块测试，关注玻璃基板、机器人、农机-260802.pdf": {"id": "attachment:files/中泰证券-机械行业周报(8.3-8.7)：看多光模块测试，关注玻璃基板、机器人、农机-260802.pdf", "kind": "attachment", "title": "中泰证券-机械行业周报(8.3-8.7)：看多光模块测试，关注玻璃基板、机器人、农机-260802", "source_label": "中泰证券", "excerpt": "请务必阅读正文之后的重要声明部分看多光模块测试，关注玻璃基板、机器人、农机 ——机械周报（8.3-8.7） 机械设备", "content": "请务必阅读正文之后的重要声明部分看多光模块测试，关注玻璃基板、机器人、农机 ——机械周报（8.3-8.7） 机械设备证券研究报告/行业定期报告 2026年08月02日 评级：增持（维持） 分析师：谢校辉 执业证书编号：S0740522100003 Email：xiexh@zts.com.cn 分析师：王子杰 执业证书编号：S0740522090001 Email：wangzj06@zts.com.cn 分析师：王风涤 执业证书编号：S0740526040002 Email：wangfd@zts.com.cn 基本状况 上市公司数 608 行业总市值(亿元) 58,758.49 行业流通市值(亿元) 49,954.89 行业-市场走势对比 相关报告核心观点 光模块测试：“产品为王，时间优先”，需求爆发中，产业景气度持续兑现 板块观点：我们旗帜鲜明的看好光模块测试板块行情，核心逻辑在于量价齐升， 需求爆发。光模块技术高速迭代背景下，测试属于充分受益技术迭代的高通胀环 节，“产品为王，时间优先”，即能率先推出满足新一代光模块测试（1.6/3.2T）需 求的公司（测试仪器以采样示波器为主），有望赢得先机，进而吃到行业红利。同 时，NPO（近封装光学）产业加速发展，其属于是从可插拔光模块向CPO演进 的过渡方案，3.2T的NPO测试与1.6T光模块类似（即NPO与1.6T的单波速率 均为200Gbps），对测试仪器厂商是新增需求。 板块逻辑：①技术迭代：我们认为，一代光模块，需要一代测试仪器，根据联讯 仪器的招股书，800G光模块需要50G带宽的采样示波器进行测试，而1.6T的光 模块，则需要65G带宽的采样示波器进行测试，前一代的仪器不能复用，测试仪 器随着光模块技术的迭代而快速升级；②高通胀：随着光模块技术升级，新一代 的测试仪器较前一代价值量持续提升，根据联讯招股书，2022年到2025年前三 季度，其采样示波器单价从11.56万元/台提升至28万元/台，因此我们认为，光 模块测试仪器产业会随着技术的迭代，市场空间将逐步打开。根据我们在外发报 告《光模块测试仪器专题报告：AI算力驱动代际升级，国产替代正当时》中的测 算，全球800G以上光模块测试仪器需求2026-2028年预计达463.1亿元，市场 持续快速扩容。③玩家缩圈：我们认为，光模块技术从800G到1.6T，再到未来 的2.4T和3.2T，其测试门槛大幅提升，对供应商提出更高要求，无法跟随光模块 技术快速迭代的测试仪器厂商将会被淘汰，头部玩家数量减少，份额集中度提升， 且由于技术壁垒持续提高，头部玩家盈利水平有望不断提升，进而充分吃到行业 红利。 建议关注：联讯仪器、优利德、华兴源创（普赛斯）、鼎阳科技、普源精电、华盛昌 等。 玻璃基板：头部厂商相继加注玻璃基板，持续看好设备端投资机遇。 又一重大合作落地，玻璃基板产业投入持续升温。近期蓝思科技全资子公司蓝思国际 与英特尔正式签署合作备忘录，双方将重点围绕TGV先进封装技术展开深度合作， 涵盖玻璃基板穿孔成型、高精度激光加工、金属通孔沉积及多层互连布线等核心工艺， 聚焦玻璃基板核心技术突破。国内产业资本持续看好玻璃基板赛道，并持续加大相关 技术与产线投入。 华为拟定玻璃基板量产规划，海内外协同完善产业生态。近日华为初步敲定玻璃基板 国内量产规划，计划2027年实现量产并优先搭载于昇腾系列AI加速卡，合作制造主 体包括京东方、维信诺、云天半导体、AKMMeadville四家企业，量产节奏较三星等 韩系厂商提前约一年。华为加快玻璃基板商用落地，以此助推AI半导体芯片市场空间 拓展，而玻璃基板是该战略重要底层载体。此外，在协同产业链搭建本土材料与设备 供应链的同时，华为持续向韩国材料、零部件及设备厂商开放合作窗口，通过海内外 产业链协同共建良性产业生态。 产业化加速可期，设备先行受益。设备决定玻璃基板量产节奏，产业化红利有望率先 兑现。当前行业综合良率正处于75%向85%量产门槛突破的关键阶段，设备能力 已成为良率提升与规模化量产的核心制约因素。同时，玻璃基板产线中设备投资占 比高达70%，叠加海内外龙头持续加码产能布局及国产替代加速推进，国内设备厂商 有望率先受益于新增产能建设与设备导入需求。 建议关注：【激光通孔】大族数控、帝尔激光、英诺激光、德龙激光、杰普特；【PVD 镀膜】汇成真空等；【通孔填充】东威科技等；【闪蚀/蚀刻】欧克科技等。 人形机器人：基本面如期推进，板块逐步进入右侧区间 一、谷歌发布机器人大模型：Google发布新一代机器人模型GeminiRobotics2，以 解决物理世界的AI难题。具体看，是三个模型：1.GeminiRobotics2:VLA模型，将 视觉/语言转位电机控制指令。2.GeminiRoboticsER2:推理模型，负责任务规划、交 下载日志已记录，仅供内部参考 行业定期报告 -2- 请务必阅读正文之后的重要声明部分互和工具调用。3.On-Device2:端侧本地推理，小于200个示例适配新本体。特点能 力：1.长序列任务处理：ER2基于连续视频流跟踪任务进度，实时调整。长序列本质 上是ER2的能力体现。2.多机器人协作：共享语义理解并通信与交互，从而实现协作。 这一安排也为一套软件不同本体提供基础，推理层与硬件解耦、从而实现跨本体通用 性，我们可以认为巨头的机器人软件在技术收敛。2.巨头围绕物理世界AI持续投入研 发可见效果显著，资本市场大可不必担心“机器人脑子不好用”的问题。软件/硬件/ 量产三驾马车都在齐头并进。3.产业进展在今年是真正迎来技术收敛与落地速度超预 期的，坚定看好。机器人是最大的AI应用，天花板够高且进展够快。 二、T链进展：Fremont工厂（百万台级规划）开始制造Optimus，德州工厂（千万 台级规划）已开工土建。核心传动件供应商：已正式下达PO采购订单，真金白银量 产备货，计划近期启动量产。从百台级起，向千台级爬坡。外观件及配合件供应商： 设计已锁定，进入订单流程。 模型及算力：AI5已流片，AI6计划于今年年底流片，均为服务于机器人的专用高效 端侧算力芯片。特斯拉Cortex2训练基础设施已上线，表明其面向自动驾驶与机器 人模型训练的底层算力体系仍在扩容。其他：谷歌DeepMind新发GeminiRobotics on-device，为离线本地运行的VLA模型，少量演示即可学会新动作；Momenta上 市等。 量产已从\"研发\"转向\"落地\"。特斯拉工程VPLarsMoravy近期接受访谈，核心讨论 量产落地，要点如下：强调规模化量产：团队在汽车上的规模化生产经验可直接复用 至机器人，无论是生产流程还是设备自动化团队，大规模生产都是特斯拉机器人项目 的三大核心优势之一。模块化/非长链式生产布局：各零部件由模块化产线组装，产线 体积较汽车更小，自动化团队调试后即可快速落地。高度评价供应商及供应商团队： 供应商快速、灵活地应对设计修改，体现出成熟的配套响应能力。自制还是采购：保 密、资本开支、资源禀赋与供应商共同迭代等多维度动态考量。 总结：量产已至。讨论的核心不再是设计、研发，而是量产、落地。投资建议：26年 下半年-27年板块基本面持续兑现，从中筛选具备稳定量产交付能力和核心份额的标 的。【北特科技】大小丝杠核心供应商，产能建设进度领先，占据领先份额。减速器 【斯菱智驱】、【科达利】；注塑件【恒勃股份】、【模塑科技】等。 农机：国内结构升级与海外市场扩张双轮驱动下的周期性复苏与成长性重估 25年全年，大中小型拖拉机产量分别为11.53万台、22.89万台、12.05万台， 同比分别+1.4%、-6%、-15.4%。大型拖拉机成为唯一正增长的品类，中小型持 续萎缩。当前行业复苏并非普惠式的总量回升，而是以“大型化、高端化”为特 征的供给侧结构性复苏。不具备技术迭代能力的中小企业仍在加速出清。 政策导向已从“普惠补贴”全面转向“扶优扶强”，技术领先的龙头企业将持续收 割市场份额。现行《2024—2026年农机购置与应用补贴实施意见》重点支持高性 能播种机、智能高速插秧机、大型智能高端联合收获机械等。 出口方面，25年全年，中国累计出口拖拉机185,539辆，同比增长20.2%；累计 出口金额达897,508万元，同比增长34.2%，金额增幅明显高于数量增幅，反映 出口产品单价和结构在提升。 以一拖股份为代表的龙头企业正将国际化提升至战略高度，依托国机集团等平台 协同出海，完善海外渠道与服务网络。2025年一拖股份的出口销量增速达41%， 远超行业平均水平，海外业务正成为平抑国内周期波动、贡献核心增量的重要引 擎。持续看好以【一拖股份】为首的国内优质农机企业表现。 风险提示：产业化进程不及预期，下游需求不及预期，行业竞争加剧等。 下载日志已记录，仅供内部参考 行业定期报告 -3- 请务必阅读正文之后的重要声明部分投资评级说明 评级说明 股票评级买入预期未来6~12个月内相对同期基准指数涨幅在15%以上 增持预期未来6~12个月内相对同期基准指数涨幅在5%~15%之间 持有预期未来6~12个月内相对同期基准指数涨幅在-10%~+5%之间 减持预期未来6~12个月内相对同期基准指数跌幅在10%以上 行业评级增持预期未来6~12个月内对同期基准指数涨幅在10%以上 中性预期未来6~12个月内对同期基准指数涨幅在-10%~+10%之间 减持预期未来6~12个月内对同期基准指数跌幅在10%以上 备注：评级标准为报告发布日后的6~12个月内公司股价（或行业指数）相对同期基准指数的相对市场表现。 其中A股市场以沪深300指数为基准；新三板市场以三板成指（针对协议转让标的）或三板做市指数（针对 做市转让标的）为基准；香港市场以摩根士丹利中国指数为基准，美股市场以标普500指数或纳斯达克综合 指数为基准（另有说明的除外）。 $$LargePositionMessageStart$$ $$LargePositionMessageEnd$$ 重要声明 中泰证券股份有限公司（以下简称“本公司”）具有中国证券监督管理委员会许可的证券投资咨询业务资格。 本报告基于本公司及其研究人员认为可信的公开资料或实地调研资料，反映了作者的研究观点，力求独立、客 观和公正，结论不受任何第三方的授意或影响。本公司力求但不保证这些信息的准确性和完整性，且本报告中 的资料、意见、预测均反映报告初次公开发布时的判断，可能会随时调整。本公司对本报告所含信息可在不发 出通知的情形下做出修改，投资者应当自行关注相应的更新或修改。本报告所载的资料、工具、意见、信息及 推测只提供给客户作参考之用，不构成任何投资、法律、会计或税务的最终操作建议，本公司不就报告中的内 容对最终操作建议做出任何担保。本报告中所指的投资及服务可能不适合个别客户，不构成客户私人咨询建议。 市场有风险，投资需谨慎。在任何情况下，本公司不对任何人因使用本报告中的任何内容所引致的任何损失负 任何责任。 投资者应注意，在法律允许的情况下，本公司及其本公司的关联机构可能会持有报告中涉及的公司所发行的证 券并进行交易，并可能为这些公司正在提供或争取提供投资银行、财务顾问和金融产品等各种金融服务。本公 司及其本公司的关联机构或个人可能在本报告公开发布之前已经使用或了解其中的信息。 中泰证券股份有限公司事先未经本公司书面授权 行任何形式的翻版、发布、复制、转载、刊登、篡改，且不得对本报告进行有悖原意的删节或修改。 下载日志已记录，仅供内部参考", "status": "extracted"}, "post:2026-08-03T08-06:3777576c750a": {"id": "post:2026-08-03T08-06:3777576c750a", "kind": "post", "title": "2026-08-03 08:06", "source_label": "帖子正文", "excerpt": "【本周策略观点0803】8月心态更积极，蓄势等震荡反弹 1、上周全球股市都自救来遏制流动性负反馈，宏观超级周和科技大厂财报，国内重要IPO和会议都相继落地，周末消息面自然偏积极，进入8月市场也有理性客观的理由，风险偏好需要喘息和修复。外围，特朗普称同意取消对伊朗的打击，虽然持续性未知，但本周TACO", "content": "【本周策略观点0803】8月心态更积极，蓄势等震荡反弹 1、上周全球股市都自救来遏制流动性负反馈，宏观超级周和科技大厂财报，国内重要IPO和会议都相继落地，周末消息面自然偏积极，进入8月市场也有理性客观的理由，风险偏好需要喘息和修复。外围，特朗普称同意取消对伊朗的打击，虽然持续性未知，但本周TACO预期也会加强。国内zzj会议虽然增量信息不多，但目前基本面数据不好，国常会提出用好用足各项存量政策，及时谋划出台务实管用的增量政策，接下来货币宽松政策蓄力预期，还有后续元首互访，都是有利于修复。产业层面催化聚焦在AI应用、电网核电和机器人方面，和周五结构差不多。 2、维 chment:files/【天风轻纺孙海洋-周观点W30】消费配置价值显现.pdf": {"id": "attachment:files/【天风轻纺孙海洋-周观点W30】消费配置价值显现.pdf", "kind": "attachment", "title": "【天风轻纺孙海洋-周观点W30】消费配置价值显现", "source_label": "【天风轻纺孙海洋", "excerpt": "近期市场宽幅震荡，展望后市我们预计消费板块或在资金催化、流动性提升及关注度改善 等方面具备正向配置机会；当前我们思路：①立足业绩向上及稳健价值：关注东方甄选、 登康口腔、伟星股份、罗莱生活、太阳纸业、家联科技及申洲国际、比音勒芬等，并新增 推荐昂立教育", "content": "近期市场宽幅震荡，展望后市我们预计消费板块或在资金催化、流动性提升及关注度改善 等方面具备正向配置机会；当前我们思路：①立足业绩向上及稳健价值：关注东方甄选、 登康口腔、伟星股份、罗莱生活、太阳纸业、家联科技及申洲国际、比音勒芬等，并新增 推荐昂立教育；②立足第二曲线具估值弹性品种：华达科技、天安新材、恒林股份等。 新东方好未来财报明确赛道价值 新东方：步入稳健价值成长新阶段 本周新东方披露年报FY26non-gaap归母净利5.7亿美金（yoy11%），业务多点开花， K12、大学生及东方甄选均实现可观增长；FY27营收指引14-18%同时Margin增长，当前 对应约13.6xPE，同时发布5亿美金股东回报。 新东方在消费领域具备优于大盘及教育赛道的成长能力；我们乐观预期未来几年成长达成 cagr双位数以上，稳健增长能力突出；从各业务线FY27预期看： ①K12同增中高双（K9更快）；行业龙头新东方好未来具备扎实成长功底及业务体系，有 效平衡节奏与盈利；教培在双减后经历短期爆发后进入平稳期，在消费赛道中仍具备增长 韧性及刚性；行业不再盲目扩张，新东方克制开店；看好其持续保持稳健成熟成长能力； ②大学生同增中双，出国低单；出国业务近两年受外部影响拖累较大，当前逐步平稳对业 务影响减轻；大学生受益在校生规模增长及完善服务内容增长优于预期；新东方在出国及 大学生领域具备较强市场地位及话语权，看好优势进一步释放； ③东方甄选提速（甄选FY26yoy30%，其中FY26H2yoy50%+）;甄选为新东方体系近两年孵 化最成功的业务形态，将借助新东方学习中心拓展线下体验店，加快自营品牌发展，优化 会员制度营运，并提升供应链效率；我们看好东方甄选成长持续性及对新东方积极贡献。 新东方具备穿越周期，持续自我突破的组织能力；当前体量规模其实已超越双减前巅峰， 具备更健康稳定的业务类型及盈利前景，建议积极关注。 昂立教育：（8月金股）重视盈利拐点 核心结论：今年是昂立教育重要业绩拐点年；净利率有望同比大幅度提升。今年昂立教育 我们认为或可类比23年学大教育与25年东方教育（彼时我们均坚定前瞻发声，明确运营 周期拐点）；随后公司净利率同比大幅度扩张，直接提振并重构市场对业绩体量预期； 我们预计今年公司扣非后净利或在1.5亿左右；净利率10%左右；结束多年增收不增利 （过去几年亏损持续收窄）。26Q3旺季公司有望在去年（扣非3KW）基础上继续大幅度 增长；此前公司业绩预告，26H1扣非2.5KW同比扭亏。 教培行业模式成熟，公司固有规模效应及运营杠杆，双减以来公司多年营收扩张净利承压 （25年扣非600W扭亏为盈）；近两年公司明确优化业务体系、严控总部成本费用；我们 预计26年起，公司将交付规模化利润体量及常态化净利率预期； 昂立目前以区域小班课为主，行业普遍净利率10-20%；未来伴随教师人效、学生续费及总 部控费继续发力，净利率有望继续向上。 26年4月公司公告拟用公积金弥补亏损；截至25年底母公司财报累计未分配利润-3.3 亿，公司计划使用盈余公积+资本公积弥补亏损；#伴随历史包袱出清；我们认为不排除26 年起公司将进行现金分红回馈股东。 [玫瑰]近期教育板块包括新东方/好未来表现强势，我们认为核心或系行业在低关注度及预 期情况下正常流动性及估值修复，目前教育（教培）行业运行平稳，建议自下而上关注公 司变化。 此外教育关注东方教育、行动教育、学大教育、凯文教育、传智教育等。 东方甄选：7月GMV延续高增，观点延续 东方甄选抖音月度20260801（三方数据仅供参考）：7月提速，新开自营服饰、自营纸品 家清账号表现出色。我们观点延续，稀缺具备成长/叙事/社会价值的优质消费品；FY26H2 剔除股权费用和汇兑损失（我们预计FY26H2合计1亿+），FY26H2调后净利或4亿+，全 年6.5-7亿；同比倍增环比提速。 具体来看：①以抖音为核心线上渠道提速显著，伴随与平台合作深入及公司运营系统化深 度调整升级，更加适配常态化成长；②以产品为核心导向更加坚定明确，产品及售后团队 显著扩容，推新速度及产品结构显著改善，均已取得积极成效；③近期西安郑州线下店开 业，显著调动当地新东方团队灵活自主性，有效扩宽客源及品牌曝光。我们预计FY27及 28保持趋势，建议积极关注。 纺服策略：织造及家纺先行 今年来纺服板块表现低迷，一方面系内需环境走弱，拖累服饰金饰终端景气；另一方面外 贸持续受汇率/原料及客户库存干扰；当前板块处于历史低位，预期底估值底，市场高切低 或迎流动性优化；行情或先于基本面触底，板块策略我们优选织造+家纺： ①汇率原料等不利因素消化，其中涨价传导错配窗口收窄；汇率预期逐步稳定汇兑压力缓 解； ②客户结构优势显现，其中Uniqlo持续上调，ADS延续复苏，NKE运营见底；头部供应链 份额提升新客户开拓明确； ③织造宏观侧改善，26H1我国纺织品服装出口额为历史同期较高水平；其中纺织品同增 3.5%;服装同降0.7%降幅收窄； ④家纺观点延续，其是纺服赛道稍有具备稀缺增长叙事及明确红利属性的细分品类，客单 价提升分红率提升。 相关标的【织造】伟星/晶苑/申洲/华利/百隆/新澳等；【家纺】罗莱/水星/富安娜等； 【服饰】比音/江南/森马等；【金饰】老铺/潮宏基/六福等 伟星股份：拉链市场超预期表现 近期我们组织拉链行业专家电话会，释放乐观产业信号；行业景气优于预期，伟星优势有 望放大。YKK中国FY27Q1（26年4-7月）销额或同增双位数以上，其中外销或显著快于大 盘；且5月提价后毛利率快速提升。 外贸增长较快或系25年4月关税影响低基数，26年关税预期稳定后海外订单快速回流国 内；#我们乐观预期伟星订单表现，国内具备更扎实产业链配套及订单响应效率，较东南亚 优势明显。 内贸慢于外贸或系订单更加分散，小批量多批次更加明显，大订单分拆下派；伟星快反及 服务优势凸显；得益灵活机制及服务售后，适配当下内需品牌下单趋势。 当前头部品牌普遍推动供应链多元化，积极发展二供三供以分散风险；从拉链产业格局 看，由过去一家独家变为一超多强；伟星等厂商成长机会凸显。 目前YKK5月起已启动金属拉链提价，我们预计伟星等逐步跟进；原料涨价与下游顺价错配 期逐步收敛，有效提振毛利率预期；建议积极关注。 登康口腔：十五五锁定成长节奏 近期比音伟星等表现突出，共同点或在传统消费稀缺成长性；登康口腔成长扎实明确，优 质品牌消费，产品及渠道功力深厚，十五五规划（5年翻倍）锁定成长。公司明确发展意 志，具备可靠达成路径，集团体系化赋能可期；我们从渠道及产品深度梳理： @线上：规模与利润协同，优化产品结构（单品突破升级为爆品矩阵，毛利率进一步提 升），优化考核机制（规模和利润双KPI），完善费用投入（流量运营升级为内容资产运 营）。 @线下：优势渠道巩固深化，渠道覆盖广且深，与经销商利益绑定、忠诚度高；26年提出 打造500个百万县域进展顺利，同时加大即时零售、美妆集合店、OTC等新渠道开拓。 @产品：已跑通“市场洞察-产品研发-功效验证-放量”爆品方法论，目前实现两款销售过亿 大单品；未来将爆品模型同步复制到多品类赛道； 公司拥有4个国家级、8个省部级科研平台，为口腔行业独有；十五五将投资上亿元建设 科创中心，同时产品研发完全立足于东方人口腔需求。 @第二曲线：组织保障已落地，其中智能口腔赛道打造智能品牌形象，迭代电刷、冲牙器 新品；口腔医疗赛道推动专业级口腔产品民用化。 登康作为优质国企，市场化机制明确，治理结构完善可靠；底部区间建议积极关注。 此前观点： 260726：东方甄选财报靓丽，黑纸淡季不淡，关注自下而上机会 260719：运动服饰26Q2平稳，关注底部消费机会 260712：鼓励新型零售上市，优衣库再上调指引 260705：轻纺26Q2前瞻 260628：景气拥抱恒林裕同聚杰，价值聚焦东方甄选 260621：轻纺转型标的再梳理 260614：布局新兴景气及价值成长 260607：恒林仙鹤延续景气，家联行动发布激励 260531：电解纸逻辑增量，恒林潜力可期；关注底部消费 260524：亚玛芬继续强势，关注优质跨境品种 260517：亚朵（家纺）超预期，东方甄选成长延续，关注出口变化 260503：财报回顾：家纺超预期，服饰稳健织造分化，金饰受益金价，个护向上造纸改 善，地产链出口链承压 260426：家纺表现突出，成长股息兼备 260419：把握稀缺成长，美棉加速上行 260412：涨价行情强化，优衣库再上调指引，重视东方甄选变化 260405：26Q1业绩前瞻，东方甄选提速 260329：东方甄选运营加码，金价高波关注菜百老铺，安踏多品牌成效显 260322：顾家发布智能新品，李宁收入指引乐观，天立国际盈喜 26031 绕近期国内外宏观事件及大宗商品市场走势展开全面分析。核心结论为：市场 受美伊冲突反复、美联储议息会议内部分歧加剧、国内政治局会议定调等宏观因素主导， 不同板块表现分化显著。贵金属与有色金属受原油波动影响较小，走势相对稳健；原油化 工板块跟随油价剧烈波动；黑色板块因需求疲弱及政策预期落空大幅下挫；农产品板块波 动加大，两粕先涨后跌，鸡蛋、生猪、白糖延续弱势。 宏观方面，美伊冲突在军事对抗升温后出现新进展，特朗普称同意取消对伊打击以换取协 议，但双方核心分歧仍大，霍尔木兹海峡通行情况依然是决定油价的核心变量。美联储7 月议息会议维持利率不变，但投票结果从6月的12:0骤降至9:3，三位地区联储主席主张 加息，内部分歧显著加大；主席沃什传递信号模糊，市场对其抗通胀信誉产生质疑，长端 美债收益率大幅上行。国内政治局会议定调\"疏通存量、精准发力\"，强调加大逆周期调节 力度，但以存量政策回补为主，未出台大规模增量刺激。 各板块核心观点如下： 能源化工：原油受地缘消息影响波动极大，周度下跌4-5%。美伊核心分歧仍大，地 缘博弈可能陷入长期拉扯。即使霍尔木兹海峡恢复通行，成品油库存极低、中国炼厂开工 缓慢等因素也将限制油价回落空间，布伦特预计在80-100美元区间震荡。化工品方面，乙 二醇、PP、PE基本面较好，库存低位且需求正常；尿素若下半年出口放开，有较可观涨 幅；甲醇、纯苯、PTA等基本面偏弱。 有色金属：铜、锡基本面较好，铜矿紧张持续，加工费深度负值，库存偏低，消费有 韧性，建议回调做多；锡受印尼政策扰动及半导体高景气支撑，维持强势；锌有挤仓风险 但国内库存偏高，波动较大；铝近月偏强、远月有供应回升预期。 黑色板块：全系增仓放量破位下跌，焦煤、铁矿跌幅居前。核心原因包括淡季需求持 续承压、政治局会议缺乏增量政策导致预期支撑丧失、资金集中增仓打压。铁矿呈现\"供强 需弱\"格局，但基差转正、8月复产预期、长协谈判等潜在利多值得关注，建议前期空单逢 低止盈，不建议追空。可关注螺纹10-1反套机会。 农产品：两粕上周增仓拉涨后本周减仓重挫，缺乏实质性利多，建议观望。鸡蛋供应 端持续修复，盘面存在特殊交易逻辑，远月合约弱势明显。生猪供应压力仍大，产能去化 效果存疑，趋势下跌延续。白糖长线看空，国内外供需宽松格局未变，26年内所有合约建 议偏空思路。 会议实录 大家好，欢迎参加新湖期货五线四板块精品会线上活动。会议正式开始之前，先做一下免 责声明：即将分享的内容只代表各位研究员自己的观点，不构成您的投资建议。 我们先看一下这周大宗商品市场的整体表现。这一周，国内商品普遍下跌。美伊三方的冲 突不断变化，连续轰炸14天后，上周日美国暂停了对伊朗的攻击，市场快速出清地缘风险 溢价。周初油价大跌，带动能源化工等板块大幅下行。但中东局势并不稳定，周三美伊战 火重新燃起，周末前市场担心局势进一步升级。不过从目前消息看，特朗普暂时取消了周 末对伊朗的行动。 受原油价格短期剧烈波动影响，国内商品指数周初大跌，之后油价反弹、美元指数重挫， 多数商品逐渐止跌震荡。分板块看，各板块差异较大。贵金属和有色板块受原油价格剧烈 波动影响很小，大多数品种要么持稳，要么偏强。原油化工板块跟随油价节奏波动，但波 幅明显小于国际原油。黑色板块在周四、周五突然启动大跌模式。农产品大多数品种波动 幅度也很大，尤其是两粕，上周怎么涨上去，这周就怎么跌回来。 先看宏观方面。这周是超级央行周，主要国家依次召开议息会议，美联储议息会议依然是 重中之重。韩国科技股大跌造成的冲击仍然存在，地缘冲突依然是市场关注焦点。另外， 国内政治局会议等重要事件也值得关注。 首先请黄婷丽就近期的国内外宏观重要事件或数据做解读及展望。 黄婷丽：宏观方面，本周超级央行周来袭，美英日央行依次召开议息会议。7月美联储议 息会议备受瞩目，连续第5次按兵不动，但投票结果显示内部分歧显著加剧。日本央行维 持利率不变，但政策信号明显转鹰，日元在逼近40年低位后突然暴涨。 地缘方面，美伊冲突出现新进展——特朗普称收到伊朗暂缓攻击的请求，同意取消对伊打 击以换取协议。但美伊双方目前仍处于低烈度加高频的长期化冲突阶段，全面失控风险可 控，但达成完全协议难度依然较高，霍尔木兹海峡方面的分歧仍显著。 美联储7月议息会议维持联邦基金利率3.5%-3.75%不变，但投票结果从6月的12:0骤降至 9:3，三位新上任的地区联储主席一致投下反对票，主张加息25个基点，显示内部分歧显 著加大。前瞻指引效率进一步减弱，未公布点阵图和经济预测，声明中对经济活动及通胀 的评估与6月完全一致。主席沃什会后讲话传递信号模糊，未提供明显方向性信息。对通 胀的表态左右摇摆，虽然强调2%通胀目标，但又提及更广泛的通胀目标选择，带来反应函 数模糊化。叠加其提到的政策行动延期风险（倾向于等待五大改革工作组结果后再行 动），显示出沟通策略上出现了一定的鸽派迹象，引发市场对其抗通胀信誉的质疑。 会后收益率曲线呈现不对称异常走势——短端收益率回落，但长端10年和30年国债收益 率大幅上行，凸显市场对短期和中长期利率路径的分歧。美元指数回落，似乎在反映市场 对沃什表面鹰派的不信任投票。沃什上任初期以强硬鹰派形象巩固美联储独立性，但从五 大改革工作组展现的政策构想看，包括模糊沟通、采用另类数据、生产力叙事等，似乎正 在重塑格林斯潘时代的思路。尤其是AI供给侧逻辑叙事，暗含了其中期鸽派形象。 基准情形下，我们认为美联储依然不降息也不加息，年内保持利率不变。但需注意，内部 分歧持续加大，以及沃什此次表现出的市场不信任投票，后续若出于维护联储独立性和抗 通胀信誉的考虑，预防性加息的尾部风险有所抬升。 国内方面，7月政治局会议正式召开，政策重心在疏通存量、精准发力，释放积极定调、 加大逆周期调节力度的同时，仍以存量政策回补为主。措辞边际变化积极，宏观政策更加 强调发力提效。财政需求侧刺激仍是下半年稳增长核心抓手，强调加快进度。货币政策延 续适度宽松总基调，强调综合运用并适时调整货币政策工具，降准降息仍在工具箱中，但 时间选择将更注重灵活性。扩内需扩消费仍是重心，继续扎实推进\"六张网\"建设，产业政 策重要性进一步强化，深入实施\"人工智能+\"行动，继续综合整治内卷式竞争。资本市场定 调更加积极，将\"提升资本市场韧性和信心\"与\"深化资本市场投融资综合改革\"深度绑定， 政策重心从短期维稳托底转向长期制度建设。地产方面表述不多，仅继续强调\"稳定房地产 市场\"。 反映到资产价格：本周美元指数整体承压，周五收于100关口下方，主要受美联储利率路 径不确定性及日韩政府干预汇市压力影响。黄金走势震荡，一方面受美元走弱支撑，但美 债收益率回升限制上行空间。油价明显下跌，录得四周来首度收跌，随着部分供应路线改 善，市场重新关注库存及供需平衡。股市方面，亚马逊、谷歌、微软三大云计算巨头财报 后暴涨，拉动美股三大指数收涨；韩国股市剧烈震荡，周初受AI板块估值担忧及芯片股抛 售大幅下挫，随后微软等科技股财报缓解AI投资泡沫担忧，带动半导体资金回流，周五出 现历史级反弹，收复部分失地。 短期加息预期回落对风险资产压制有所缓和，有色贵金属价格震荡上行。但美债实际收益 率上行似乎在反映市场在定价远期更大幅度加息预期，以及对美联储公信力的不信任投 票。下周起美国制造业PMI、非农就业、CPI等数据将依次公布，美国经济数据仍是短期利 率路径重要指引。8月底沃什在杰克逊霍尔会议上的讲话也可能是关键政策窗口，需警惕 预防性加息尾部风险升温。 主持人：总体来看，宏观方面需关注的点很多。美伊冲突应该会持续，但全面失控不太可 能。下周美国重要经济数据关系着美联储短期利率路径变化。我们觉得鹰派顶点应该已 到，年内可能既不加息也不降息。韩国科技股尾部风险仍存，需关注后续政府政策。国内 政治局会议与市场预期一致，措辞比预期更积极。 接下来看能源类。这周原油及相关品种价格波动很大，由中东地缘局势主导。国内新能源 三个品种维持弱势。后期原油价格如何变化，有请严丽丽分析。 严丽丽：油价受地缘消息影响波动极大，周度下跌4-5%。地缘政治局势消息反复，美伊核 心分歧依然很大，市场对双方达成实质性共识的预期在降温，地缘博弈可能陷入长期拉 扯。对原油而言，重点需关注霍尔木兹海峡和曼德海峡的实际通行情况，这是决定油价走 势的核心变量。霍尔木兹海峡出口量维持低位，回到今年3-5月状态，约两三百万桶/天。 沙特从延布港出口量继续小幅下降，往南走比例下降，往北走经苏伊士运河的量有所增 加，但受限于苏伊士运河VLCC船不能过及曼德海峡管束限制，总体增量有限。 从基本面看，全球石油库存已回到正常状态，与2月相比去库了4亿多桶。2月时库存压 力非常大，原有库存仍存在一定缓冲，6月中下旬释放了一定浮库。7-8月总体不是那么紧 缺，但下游成品油库存已在极低水平。战略储备释放空间大幅收窄，节奏会进一步放缓。 往后看，美国即将进入飓风季，可能影响炼厂加工量，中国炼厂开工恢复缓慢，将进一步 加剧成品油压力。汽油、柴油、航煤、燃料油库存都非常低，但柴油压力更大。当前处于 汽油消费旺季尾声，即将进入柴油消费旺季，但由于中东炼厂开工、中国炼厂开工及俄罗 斯柴油出口禁令，全球炼厂开工短期很难上来。因此，即便霍尔木兹海峡短期恢复正常运 行，油价也很难回到前期低点，因为成品油裂解价差会反作用于原油。此外，随着美国中 期选举临近，需关注特朗普政府可能采取的应对措施。总体来看，后面油价仍维持窄幅区 间震荡，但区间较前期收窄，布伦特预计在80-100美元区间。风险点在于美伊双方互相攻 击能源设施，但可能性不大。 再看双规产业链。总体来说，双规产业链在新能源中表现较差，主要原因是需求不好，供 需压力仍大。多晶硅供给侧目前处于丰水期，产量小幅增长，增量主要来自西南地区，但 部分企业检修导致华北地区开工小幅回落，整体供给增量仍大于减量。8月排产可能在11 万吨左右，环比增加。下游消费继续回落，硅片端开工继续下降，企业进一步执行降负 荷；电池片企业谨慎采购为主，行业去库偏缓；组件价格运行平稳，排产变化不大。终端 采购谨慎，逐渐小波累库。多晶硅价格受宽松基本面及高库存压制，现货价格可能继续摸 底。建议关注政策带来的扰动，但成本核定及能耗政策对价格支撑有限，建议反弹做空。 可关注两个套利机会：一是11-12反套（11月底仓单集中注销，多头接货无法滚动到12 月，需给出较大贴水；12月处于枯水期，生产成本较高，供应端有支撑）；二是12-04正 套（04合约面临交割标准切换，价值中枢下移，远月合约趋弱，价差可能走扩）。 主持人：地缘局势主导下的原油价格确实很难预判，后期需关注美伊局势变化，尤其是双 方是否会在能源设施方面有进一步举动。即便海峡恢复通行，因成品油库存低、中国炼厂 开工等原因，油价暂时很难回落到前期低点。多晶硅国内供需宽松、高库存，价格弱势运 行，反弹做空为主。 接下来看化工板块。这周化工品多数跟随原油价格波动，海峡再度封锁的影响此前已反复 分析。在原油价格难预判的背景下，化工品操作难度很大。哪些品种机会确定性更高？有 请肖涵分析。 肖涵：美伊冲突在近期彻底平息不太可能，但在美国11月选举前也不会特别严重恶化， 原油可能在20美元区间内来回波动，化工品总体灵活操作为主。6月中旬至7月中旬，霍 尔木兹海峡曾开放一个月，有一定数量原油及化工品被运出，国内化工品负荷有所回升， 进口也增加。但7月中旬后海峡再次关闭，化工品及生产原料的进口将再次减少。对行情 影响较大的是乙二醇和甲醇，甲醇与伊朗关系更紧密，变动幅度更大。化工品原料进口方 面，听闻本月中国部分需进口石脑油的厂家将再次降负。海峡第一次关闭时，因缺少石脑 油，亚洲化工装置曾严重降负，化工品进口量大幅减少，这是当时推动价格上涨的重要因 素。中国化工品进口来源主要有两个方向——霍尔木兹海峡附近地区和周边亚洲国家，出 口也主要到周边地区。未来需关注亚洲装置负荷，特别是韩国装置。国内化工品装置方 面，除需进口石脑油的装置可能再次降负外，油化工品利润压缩严重，基本亏损，其他装 置也可能再次降负。 目前化工品中，乙二醇、PP、PE基本面较好。乙二醇现实和预期都较好，社会库存及仓单 偏低，09合约临近交割，进口依存度仍较大（去年约30%），海峡关闭后进口量从每月六 七十万吨降至10万吨甚至更低，未来进口预期仍将维持极低水平，现货流通性收紧。PP 和PE虽弹性不如液体品种，但基本面较好，主要体现在需求正常——内盘负荷回升、净进 口增加、价格反弹的情况下，库存低位仍在继续去化，整条产业链各环节库存都很低，两 油库存已降至60万吨以下。PP09合约贴水现货500元以上。 此外，可关注尿素。这个品种上半年几乎没有讲过，基本面很差，库存压力很大，原因是 近几年产能投放很大、产量高，加上农需旺季结束，更重要的是前7个月出口受限。上半 年市场多次炒作开放出口，但均为假消息。下半年有所区别：目前库存确实很大，国内农 需下半年弱于上半年，所以下半年有可能放开出口。若下发出口配额，价格上方空间大概 在2000-2100元左右，较当前价格约有300多点上涨幅度。 其余化工品中，苯乙烯现阶段较好，库存也很低，但随检修装置重启及8月进口可能增 加，将进入累库通道。甲醇目前需求状况很差，短期因进口货源大量到港出现快速累库， 但这一部分到港应在8月上旬结束，8月中下旬后进口将再次减少，届时可观察库存变 化。PX和PTA产业链，PX虽供应减少，但下游PTA大幅降负，库存去化较慢；PTA去库 环比可观，但绝对库存量仍不低，现货仍较宽裕。这些品种相对偏弱，行情较大程度上仍 受美伊冲突影响。 主持人：乙二醇、塑料、PP基本面不错，有利多题材。如果下半年尿素出口放开，应有可 观涨幅。甲醇、纯苯基本面相对较弱，若油价走高，做多选基本面更好的品种；若油价下 跌，做空甲醇、纯苯策略更好。化工品需根据中东局势变化灵活操作。 接下来看有色板块。这周有色板块多数品种要么震荡，要么偏强，不少品种基本面不错， 比如铜、锡。有请孙康文就主要品种基本面及后期走势做分析。 孙康文：这周铜、锌等连续几周小幅上涨，但涨幅不大，宏观影响更大。美联储维持利率 不变，市场对主席讲话的理解有一定利多，美元指数大幅下跌，对价格走强有助力。 铜的基本面较好，逻辑没有变化——铜矿一直紧张，加工费仍在下跌，深陷负值，今年甚 至明年上半年都看不到明显缓解。海外矿紧张已导致减产，国内暂时没有大规模减产，但 后面也可能发生。矿的问题对价格有较强支撑。美铜与伦铜价差进一步走强，美铜升水 500多美金，将继续支撑非美市场铜往美国运，非美市场铜供应进一步减少。LME铜库存 持续下降，国内库存也偏低，基本面支撑较强。消费端有韧性，新能源、新能源汽车、光 伏、储能、AI等带动电缆消费较强。铜基本面不错，宏观一旦改善，重心将上移，建议以 多配为主。中东局势反复会带来阶段性扰动，但重心不会下移，有回调机会可以做多。 锡的情况类似，国内外现货市场表现没那么强，LME现货一直贴水，但库存偏低。矿端缅 甸复产不及预期，国内冶炼厂开工没有明显上升。印尼政策对精锡出口有扰动，供给端有 扰动。消费端锚定AI及半导体市场，半导体维持高景气度，锡将维持较强走势，我们一直 比较看好。 锌近期有不错走势，更多在于海外有挤仓风险，矿端也比较紧张，加工费走低，对价格有 支撑。但国内库存较高，这一波不太建议参与，波动风险较大。 铝这周内盘比外盘强，可能是市场对供应过剩预期过度修正，实际当前市场仍短缺，还没 到交易过剩的阶段，过剩可能要到明年或更晚。海外仍有很多不确定性，铝可能修复性反 弹，但力度不会太大。可考虑买近抛远正套，近月偏强，远月有供应回升预期。 主持人：铜基本面很好，后期有宏观利好题材容易上涨。锡有印尼政策扰动、消费故事及 半导体等方面潜在利多，以回调做多思路对待。铜和锡是当前比较看好的两个有色品种。 接下来看黑色板块。这周四周五，黑色板块多数品种突然大幅直线下跌，焦煤、铁矿跌幅 很大。什么原因导致下跌？跌势能否延续？有请陆贝涵分析。 陆贝涵：这一周黑色全系增仓放量破位下跌，黑链指数周环比跌幅3.56%，周五夜盘继续 加速下跌，铁矿跌破700关键支撑位，螺纹再次跌破3000。从跌幅看，焦煤、铁矿等炉料 更大，成材较小。盘面利润角度，在负反馈螺旋中，盘面利润反而走阔。双焦的期现基差 能解释部分原因——这周焦煤盘面主线交易逻辑是山西长治原有煤矿复产，定价远月供应 恢复预期，导致双焦盘面格外弱，加上近期海漂煤到港量集中，仓单交割博弈对盘面施压 更明显。但现货端主焦煤仍有实际供应缺口，支撑现货价格偏稳。双焦基差大幅走扩，导 致实际钢厂利润环比表现比盘面更弱。 随着价格大幅下挫，钢厂利润开始逐步亏损，山西部分钢厂有新的检修陆续排上来，现实 负反馈路径已成立并逐步运行。资金维度看，核心在于淡季需求持续承压，直接导火索是 周四政治局会议后，下一个可能观察国内宏观政策的窗口期要放到10月，在此之前缺乏重 要会议释放政策，导致市场在弱现实背景下预期和情绪失去支撑，螺纹空头集中增仓下 跌，带动整个板块破位下行。 后续看，时间和驱动的重要性比估值绝对价格更重要。下一个重要时间窗口放在8月中下 旬，随淡旺季切换，下游需求可能边际改善，加上焦煤09合约交割博弈结束、仓单换月后 近月压力逐步缓解，届时可观察是否随需求边际改善带动黑色价格底部企稳。策略方面， 维持铁矿偏空观点，新增关注螺纹10-1反套机会。 铁矿近期处于利空兑现、消化利空情绪阶段，价格从情绪惯性看还有一定回落空间。基本 面确实较弱，需求端下游都在淡季，唐山环保限产导致铁水加速下跌。原先认为环保限产 后铁水会快速恢复，但钢价大幅下跌后钢厂利润走差，削弱了复产预期，铁水恢复节奏要 打折扣，对铁矿需求有压力。供应端，6月半年度冲量结束后，7月缓慢低位回升，海漂库 存逐步兑现到国内港口。整体看，铁矿是供强虚弱格局，基本面不太乐观，价格可能还有 回调空间。 但价格往下走的过程中，有一些潜在利多风险：第一，基差——之前看空09合约是因为升 水自由操盘成本，但盘面大幅下挫后基差再度转正，现货端比较抗跌，8月复产节奏虽慢 但仍在陆续恢复，现货刚需边际有支撑；第二，8月复产节奏慢于预期，反而对钢材有 利，有助于消化淡季库存压力；第三，8月力拓又要与中矿谈长协，之前FMG长协至今未 谈定，两个大矿长协问题不排除8月再出来干扰市场情绪；第四，海运费上周先抑后扬回 到偏高水平，随着国内铁矿价格大幅下跌，巴西FOB离岸价格再度承压大挫，若观察到高 成本非主流矿因价格下跌出现供应减量，将是较强底部支撑信号。因此，虽然维持铁矿偏 空观点，但建议前期空单逢低逐步止盈，规避追空风险，不建议继续追空。 螺纹10-1反套方面，01合约受弱现实压制较大。去年下半年到今年，螺纹钢规格加价导 致实际利润好于理论值，钢厂实际减产效果不好，特别是近两周进一步减产驱动不足。淡 季螺纹库存仍在累库通道，库销比较高，对01形成较大压力。从价差估值看，10-1价差 处在近三年偏高水平，后续可能有进一步走缩空间。需注意跟踪螺纹仓单变化，过去三年 仓单交割压力较大，进一步利空近月合约，但今年仓单处于中性偏低水平，交割方面对近 月压制没有过往那么大，将一定程度限制反套深度。 主持人：短期黑色板块下跌原因：一是需求本身就弱，钢厂需求负反馈；二是7月30日 政治局会议缺乏增量政策，是导火索；三是资金操作助推。双焦有远月供应增量预期，时 间和驱动比绝对价格更重要，8月下旬是关键节点，看能否企稳。铁矿供强虚弱，但有一 些潜在利多，建议前期空单止盈，不追空，可关注螺纹10-1反套机会。 接下来讲农产品板块。这周农产品很多品种波动非常大，上周还一片乐观做多情绪，这周 急转直下。油脂跟随原油周初下跌后弱势震荡，两粕上周增仓快速拉涨，这周减仓重挫。 生猪、鸡蛋、白糖趋势下跌延续。短期波动大，有原油价格剧烈波动的情绪传导，但更多 是因为很多品种现实基本面偏空，虽边际上有一些利多预期或消息扰动，但缺乏实质性利 多。盘面急速上涨后，偏空扰动下下跌风险较大。上周我们比较谨慎，只把油粕纳入做多 观察池，从这周验证看，油粕确实还比较弱，没到明显反转节点。短期单边方面，将鸡蛋 和生猪分别纳入做空一般关注及观察池。原油价格难预判，对油脂影响不能忽视，油粕暂 时观望。套利方面，菜籽油价差回落，但波段做多逻辑没变，下跌企稳后可继续关注波段 做多机会。 重点看鸡蛋和生猪。鸡蛋方面，国内供应端随时间推移不断修复，老鸡淘汰及新开产持续 改善供应格局。需求方面，中秋节备货需求预计8月10日左右启动，但盘面对此题材交易 有较大阻碍——08合约对应中秋旺季，但8月10日备货刚开始时08合约已进入交割月， 投机资金受持仓规模限制无法有效参与；09合约是中秋节后交割合约，面临节后消费回落 基本面变化；四季度合约更承受前期补栏蛋鸡陆续开产带来的新增供应压力。远月合约在 节后需求走弱、供给增量双重预期下价格持续走低，跌幅明显大于近月。盘面形成特殊交 易局面——现货尚未迎来需求旺季，但投机资金只能交易旺季过后的弱势合约，短期盘面 情绪偏弱，可能有进一步下行空间。 生猪方面，从7月初盘面已出现新一轮趋势下跌，这周跌势延续。7月30日政治局会议提 到\"稳定生猪等农畜产品生产和价格，促进农民稳定增收\"，但市场反应有限，仅远月合约 稍有反应。基本面看，现实端供应压力仍是重要利空驱动。二季度官方能繁存栏降幅较 大，接近正常保有量，理论上产能去化接近完成，但行业生产效率不断提升，3780万头能 繁带来的育肥猪出栏量是否已降低到合理水平，市场仍存疑虑。从饲料行业数据看，上半 年猪饲料产能同比增幅8%，创历史新高，现实供给偏大问题仍难解决。盘面回归弱现实逻 辑，持续打压升水，远月合约也谨慎对待产能去化政策到位的预期。短期近月合约受前期 压栏及二育影响，后期出栏供应压力仍存；远月合约虽有产能去化题材，但市场对估值担 忧仍存在，后期走势可能偏弱。 简单提一下白糖，这周跌幅较大。我们一年多以来一直长线看空白糖，这周白糖再度向下 突破，09合约创年内新低。国内食糖生产前景很好，前期洪水对增产影响较小，国内外供 需压力下，26年内所有白糖合约建议偏空思路。国际市场厄尔尼诺题材主要影响印度产 量，但不确定性较大——下雨天少虽不利于甘蔗拔节，却有利于糖分积累。整体看，国内 外食糖供需宽松基本面未反转。如果厄尔尼诺延续到明年2月，预计26年底到27年初可 能是国际及国内食糖阶段性触底筑底阶段。 以上是农产品的所有观点。今天分享的内容就是这些，非常感谢大家参加，下周同一时间 再见。", "status": "extracted"}, "post:2026-08-03T09-02:acef47f3f2eb": {"id": "post:2026-08-03T09-02:acef47f3f2eb", "kind": "post", "title": "2026-08-03 09:02", "source_label": "帖子正文", "excerpt": "【华安电新&汽车】研究观点周度更新 -------------------------- ★电动车：小米澎程新车定价超预期，整车推荐超豪华和出海。★电网设备：算力网4万亿投资强化AI电力需求，SST产业化元年订单集中兑现 ★风电：关注国内海风和欧洲海风启动节奏 ★光伏：产业链仍在磨底阶段，关注新技术", "content": "【华安电新&汽车】研究观点周度更新 -------------------------- ★电动车：小米澎程新车定价超预期，整车推荐超豪华和出海。 ★电网设备：算力网4万亿投资强化AI电力需求，SST产业化元年订单集中兑现 ★风电：关注国内海风和欧洲海风启动节奏 ★光伏：产业链仍在磨底阶段，关注新技术加速行业出清节奏 ★储能：零碳工厂规划推动微电网建设，美国逆变器FCC政策落地 ★氢能：工业规划定调，绿氨出海破局 ★人形机器人：宇树8月即将上市，推荐机器人链核心标的 -  比亚迪人形机器人八月发布 ，零跑汽车月销突破 10万 中游制造 /汽车 7月27日至 8月2日，汽车行业整体上涨 +5.3%。本周，机器人板块催化多， 其中比亚迪宣布人形机器人 将于八月发布 、宇树科技 科创板 IPO于8月10日 开始申购、 智元机器人已启动赴港上市流程 、奇瑞墨甲机器人全球累计交付突 破2000台。车企销量方面， 零跑 7月交付首破 10万台，同比增幅 102%，这 也是造车新势力品牌首次实现单月交付突破十万台。 新车方面， 小米汽车举行 第二次技术发布会，正式推出 N90与N70两款增程 SUV，标志着小米汽车进 军增程赛道 。建议关注机器人板块行情催化、车企新车 &销量表现。 ❑ 市场板块行情回顾 本周 CS汽车+5.3%。（7月27日至 8月2日，下同）上证指数周度涨跌幅 为+0.5%，深证成指周度涨跌幅为 -1.4%，创业板周度涨跌幅为 -3.9%。本周 各行业板块上涨居多，涨幅居前的行业板块为 CS传媒（ +12.8%）、CS消 费者服务（ +10.6%）和 CS综合（ +10.5%）；跌幅居前的行业板块为 CS 通信（ -10.5%）、CS电子（ -8.6%）和 CS机械（ -0.1%）。 汽车产业链各板块行情： 本周，汽车行业 二级板块 全面上涨，其中商用车板 块和乘用车板块周度涨幅居前，周涨幅分别为 +11.8%和+7.0%；汽车服务和 汽车零部件板块涨幅相对靠后，周涨幅分别为 +6.7%和+3.3%。汽车行业三 级板块全面上涨，其中商用载货车 周度涨幅居前，周涨幅为 +17.3%；综合 乘用车板块和摩托车板块周 涨幅分别为 +8.2%和+7.3%；底盘与发动机系统 板块和汽车电子电气系统板块涨幅相对靠后， 周涨幅分别为 +2.4%和+2.9%。 ❑ 个股行情回顾 汽车板块个股： 本周，汽车板块个股 上涨居多。其中，涨幅居前的个股有明 新旭腾（ +54.3%）、捷众科技（ +34.5%）、江淮汽车（ +33.8%）；跌幅居 前的个股有飞龙股份 （ -28.2%） 、 祥鑫科技 （ -28.0%） 、 兴瑞科技 （ -21.1%）。 重点覆盖个股： 本周，已覆盖个股周度 上涨居多。其中，涨幅居前的个股为 江淮汽车（ +33.8%）、贝斯特（ +16.6%）和继峰股份（ +15.6%）；跌幅居 前的个股有华懋科技（ -13.9%）、嵘泰股份（ -8.8%）和银轮股份（ -6.0%）。 ❑ 本周行业动 态：本周，部分车企公布 7月销量，比亚迪 7月销量突破 41.9 万辆，海外销售再创新高 ；奇瑞集团 7月销售汽车 27.7万辆，同比增长 23.3%，其中出口 20.3万辆，同比增长 70.1%，连续五个月刷新中国汽车 单月出口纪录 ；理想汽车 7月交付 30,468辆；蔚来公司交付新车 35,934台； 小鹏汽车 7月交付 38,027台；小米汽车 7月交付再超 3万辆。Robotaxi 方 面，曹操出行首度开放 Robotaxi 无人化测试 ；Momenta 获德国全境 L4级 测试许可。 ❑ 投资建议： 整车方面 推荐出口销量表现优异或有爆款车潜力的比亚迪和长城 汽车，重点关注华为链主要合作车企江淮汽车、长安汽车和上汽集团。商用 车重点推荐宇通客车、 潍柴动力 和中国重汽。 机器人链汽零重点关注拓普集 团、银轮股份、新泉股份、嵘泰股份、隆盛科技、恒帅股份 和爱柯迪等。智 能驾驶领域关注文远知行 -W、小马智行 -W、伯特利和德赛西威等。 脑机接 口领域重点推荐道氏技术。 零部件方面看好具备成本、 产品优势的龙头企业， 重点推荐福耀玻璃、星宇股份，关注继峰股份 。 行业规模 占比% 股票家数（只） 268 5.2 总市值（十亿元） 3841.7 3.6 流通市值（十亿元） 3325.9 3.5 行业指数 % 1m 6m 12m 绝对表现 -7.7 -23.1 -5.8 相对表现 0.1 -20.6 -18.4 资料来源： 公司数据、 招商证券 相关报告 1、《新一轮行业稳增长方案启动， 特斯拉业绩受多因素拖累 —汽车行业 周报》 2026 -07-27 2、《首个禁售燃油车省份确认， MONAL03 大定数据亮眼 —汽车行业 周报》 2026 -07-19 3、《6月汽车出口首破百万辆，零跑 正式进入墨西哥市场 —汽车行业周 报》2026 -07-12 汪刘胜 S1090511040037 wangls@cmschina.com.cn 梁镫月 S1090525070007 liangdengyue@cmschina.com.cn -20-10010203040 Aug/25 Nov/25 Mar/26 Jul/26(%) 汽车 沪深 300 汽车行业周报 仅供内部参考，请勿外传 敬请阅读末页 B激活即达到了国产前沿模型水平。 2 /办公Agent集中爆发：海内外同频共振 国内：腾讯WorkBuddy 6 月月访问量 2097 万次登顶国内桌面端办公 Agent（超第二、三名之和），并 联合腾讯文档推出人机双写协同；阿里内测“千问办公”，整合 QoderWork、悟空、MuleRun 三条 Agent 产 品线；字节将飞书产品并入豆包、飞书销售服务体系与火山引擎整合，集中力量打 B 端办公。 海外：OpenAI 整合 Codex 后的 Agent 产品周活迅速突破 1000 万，CFO 内部信披露 7 月单月 ARR 已超整个二季度。背景是 C 端格局已经固化——截至 6 月，豆包月活 3.82 亿、通义千问 1.67 亿、 DeepSeek 1.3 亿，前三座次连续两个季度未变，大厂竞争焦点自然转向 B 端。我们认为，办公 Agent 是下 半年 AI 应用确定性最高的方向，模型厂的竞争正从 C 端聊天转向组织工作流入口。 3 / 多模态进入开源时刻：海螺 3 把开源视频模型带进第一梯队 7 月 31 日 MiniMax 发布海螺 H3 并宣布开放权重：Artificial Analysis 盲测文生视频（含音频）Elo 1242 全球第 2、视频编辑全球第 1，首次将开源视频模型带进第一梯队； 2K 定价约 0.8 元/秒，为同业旗舰 的 1/3~1/2。我们认为，开源+性价比将进一步降低多模态使用门槛、提升渗透率。 仅供内部参考，请勿外传！ 信息技术 行业动态报告 【投资建议】重视低位、业绩向好 /稳健的互联网+游戏标的投资机会，同时继续关注大模型公司。  互联网：【腾讯控股】【阿里巴巴】【哔哩哔哩】  游戏：【网易】【巨人网络】【心动公司】【恺英网络】等  重视有垂类专业数据优势、需要精细化运营的公司，壁垒更高： 【美图】【汇量科技】等  多模态相关标的  国产大模型公司：【智谱】【MiniMax】 2、全球AI产业进展 大模型：DeepSeek V4 Flash 正式版发布；多模态模型密集上线。继续关注 Q3模型迭代 DeepSeek V4 Flash正式版7月31日正式上线。官方称Agent 能力大幅增强、基准远超 V4-Pro- Preview：Terminal Bench 2.1达82.7；284B 总参/13B 激活，结构与预览版一致、仅重做后训练 Artificial Analysis当天放榜：V4-Flash 智能指数 50 分，反超自家V4-Pro 6分，仅低于GPT-5.6 Luna（51 分）1 分， 测试 token 用量较上代降 12%。 图1:大模型智能水平指数： DeepSeek V4 Flash正式版评分50，较GLM 5.2（max）低1分 数据来源：Artificial Analysis，中信建投证券 仅供内部参考，请勿外传！ 信息技术 行业动态报告 Seedance 2.5正式上线，海螺3把开源视频模型带进第一梯队。 1）7月31日，Seedance 2.5正式发布（正 在陆续上线即梦AI、豆包专业版等平台， API 服务也将在近期上线火山方舟），延续了 2.0统一的多模态音视 频联合生成架构，重点突破长叙事能力、多模态参考能力和编辑能力。 2）同日，MiniMax 发布海螺 H3 并宣 布开放权重：Artificial Analysis 盲测文生视频（含音频） Elo 1242 全球第 2、视频编辑全球第 1，首次将开源 视频模型带进第一梯队； 2K 定价约0.8元/秒，为同业旗舰的1/3~1/2。 继续关注Q3模型更新： 1、GLM 5.3/5.5或将于8月发布，预计GLM 5.5参数过万亿。 2、MiniMax M3大参数版本有望9-10月发布。 3、DeepSeek V4 Pro满血版官方定档8月。 4、马斯克X发帖：Grok 4.6将于8月7日发布 5、GPT 6、Qwen 3.8\\Qwen 4、Hy4有望Q3发布。 6、继续关注Gemini 3.5 Pro的发布节奏。 商业化：token继续降价；OpenAI 7月ARR或提速增长，办公 Agent进展快 本周token综合成本继续下降： 降价与开源叠加，前沿模型可得性提升、使用成本下降 。 1/API定价：7月31日，DeepSeek V4 Flash正式版发布，每百万tokens输入/输出人民币1/2元，峰时翻 倍，为国内前沿模型的最低价。 OpenAI宣布GPT-5.6系列降价，Luna版降低80%；Terra版降低20%，定价 已低于Kimi K3；Sol不降价，但推出快速模型，速度提升至 2.5倍，价格翻倍，智能水平不变。 印证此前我们 的判断：模型能力是支撑定价的核心，定价分化将继续存在； 日发布最新公告，承诺全 面下线一级 /二级委托分销合作模式（即金特牌），取消不合理的“全网最低价” 要求，下线酒店调价工具，建立全新的商家分级合作模式、流量机制以及公平合 理的新佣金模式，并严格保证酒店的自主经营权 &自主定价权。长期来看，携程 依旧具有稳定的流量心智、中高 星酒店库存、流量分发 &酒店定价权，通过自身 流量属性解决中高星单体酒店库存能力出众，规则调整不影响公司长期护城河。 受燃油成本上影响 出行需求短期回落， 关注 OTA估值修复弹性 。26年4月以来， 受美伊战争影响带来的国际油价上升引发的航班成本下降 ,国内航班旅客量呈现 短期承压趋势，国内出境航班客运量增速短期有所回落 ，7-8月国内机票燃油附 加费持续回落， 后续油价如能修复长线游 &出入境游仍有较强弹性空间。随着休 闲旅游需求增长，在航班、签注限制放宽的大背景下，出入境游长期依旧有望成 为出行链中增速最快的细分板块，利好布局出入境的携程集团 ；受反垄断 &燃油 成本上升影响，目前 OTA估值显著回调，但长期来看成长性在出行链中依旧处 于领先水平，建议关注底部布局机会。 风险提示：拓店进度不及预期，燃油成本持续上涨，行业竞争加剧，反垄断监管 政策的不确定性 农业-李秋燕：持续推荐优质养殖股，种植重视厄尔 尼诺催化 生猪：能繁母猪产能加速去化显效， 重点推荐优质养殖股 。截至 Q2末能繁母猪 存栏已降至 3780万头，季环比 -3.2%。当前猪价对应养殖端深亏，各养殖主体 现金流恶化；另一方面，近期生猪产能调控相关政策密集出台，政策端持续加码 生猪产能调控， 猪板块迎布局窗口，重点布局优质养殖股：首推牧原、温氏，弹 性票看好德康、立华、神农、天康等。 禽养殖：黄羽鸡消费逐步转旺，看好优质禽企盈利释放。 1）黄羽鸡： 7月起黄 羽鸡消费转旺，预计黄鸡高景气有望持续；禽料成本近期有所回落，看好黄羽鸡 仅供内部参考，请勿外传！ 敬请阅读末页的重要说明 8 行业简评报告 盈利释放，重点推荐立华股份、德康农牧。 2）白羽鸡：受前期海外引种大幅下 滑、 种鸡质量下降影响， 优质父母代供应偏紧， 后续也将影响商品代鸡苗的供给。 看好种禽端景气，重点推荐全产业链价值提升的圣农发展。 种植： 超强厄尔尼诺气候酝酿中， 关注新季作物生产。 7月USDA报告下修 26/27 季全球玉米及小麦产量预期，利好粮价中枢抬升；大豆产量预期上修，供应较宽 松。种植链上游的种子（购种积极性提升）以及中游的种植（种植收益提升）景 气度均有望提升。关注厄尔尼诺极端气候，推荐隆平、康农、登海、大北农，关 注荃银。 风险提示： 农产品价格上涨不达预期；猪价表现 /公司规模扩张低于预期，突发 大规模不可控疫情，重大食品安全事件。 仅供内部参考，请勿外传！ 敬请阅读末页的重要说明 9 行业简评报告 分析师承诺 负责本研究报告的每一位证券分析师，在此申明，本报告清晰、准确地反映了分析师本人的研究观点。本人薪酬的 任何部分过去不曾与、现在不与，未来也将不会与本报告中的具体推荐或观点直接或间接相关。 评级说明 报告中所涉及的投资评级采用相对评级体系，基于报告发布日后 6-12个月内公司股价（或行业指数）相对同期当地 市场基准指数的市场表现预期。其中， A股市场以沪深 300指数为基准；香港市场以恒生指数为基准；美国市场以 标普 500指数为基准。具体标准如下： 股票评级 强烈推荐：预期公司股价涨幅超越基准指数 20%以上 增持：预期公司股价涨幅超越基准指数 5-20%之间 中性：预期公司股价变动幅度相对基准指数介于 ±5%之间 减持：预期公司股价表现弱于基准指数 5%以上 行业评级 推荐：行业基本面向好，预期行业指数超越基准指数 中性：行业基本面稳定，预期行业指数跟随基准指数 回避：行业基本面转弱，预期行业指数弱于基准指数 重要声明 本报告由招商证券股份有限公司（以下简称“本公司” ）编制。本公司具有中国证监会许可的证券投资咨询业务资格。 本报告基于合法取得的信息，但本公司对这些信息的准确性和完整性不作任何保证。本报告所包含的分析基于各种 假设，不同假设可能导致分析结果出现重大不同。报告中的内容和意见仅供参考，并不构成对所述证券买卖的出价， 在任何情况下，本报告中的信息或所表述的意见并不构成对任何人的投资建议。除法律或规则规定必须承担的责任 外，本公司及其雇员不对使用本报告及其内容所引发的任何直接或间接损失负任何责任。本公司或关联机构可能会 持有报告中所提到的公司所发行的证券头寸并进行交易，还可能为这些公司提供或争取提供投资银行业务服务。客 户应当考虑到本公司可能存在可能影响本报告客观性的利益冲突。 本报告版权归本公司所有。 本公司保留所有权利。 未经本公司事先书面许可， 任何机构和个人均不得以任何形式 ；浙能电力间接持有浙江金七门核 电项目 14.81%权益，该项目股东还包含阿里系等民企。 绿色低碳规划解读 ：工信部印发工业绿色低碳十五规划，以培育壮大绿色生产力 为主线，系统部署“一个行动、四个能力、两个体系”共 7 项任务。规划明确多项 资源回收利用量化目标： a. 2030 年再生有色金属产量目标 2500 万吨，废钢铁年回收量 3 亿吨、废塑料 2200 万吨、废纸 8000 万吨、废旧轮胎 2100 万吨； b. 废旧动力电池提取的锂、钴、镍金属占同期动力电池所需资源比重目标为 10%-15%； c.废光伏组件、废风机叶片年利用量目标分别为8万吨、17万吨。 政策利好三类主体：一是具备规范化产能与固废处理技术的资源化利用企业；二是 技术储备深厚、具备核心研发能力的低碳装备制造企业，后续订单获取能力更强； 三是绿电运营商，规划鼓励绿电直连、源网荷储一体化模式，要求大幅提升新建算 力设施、零碳工厂绿电使用比例，拓展绿电消纳场景。 3、后续板块投资方向指引 两大投资主线梳理：前期提出的风格切换难以一蹴而就的预判已得到上周行情走势 初步验证，后续指数出现波动属正常情况。后续板块投资可沿两条主线布局：a. 算力反弹线：重点布局算力协同相关标的，涵盖绿电、垃圾发电等方向；b.红利 防守线：优先选择基本面稳定的红利属性标的，具体包含水电、核电，今年火电整 体虽面临业绩压力，但火力协同标的如华能表现相对更优，还有此前市场关注度较 低的水务板块，其红利防守标签属性突出，若红利风格持续演绎，将吸引资金布 局。以电力为主的公用事业板块是科技成长与防守红利的最大公约数，本周开始板 块行情或出现短期分化，边打边撤的操作思路具备可行性，公用事业板块的行情支 撑逻辑成立。 Q&A Q:上周中证红利指数的表现及板块分化情况如何？ A:上周中证红利指数上涨3.1个百分点，尽管周一和周五受科技反弹行情影响表 现疲软，但中间三天支撑了整体涨幅。环保板块是唯一跑赢红利指数的板块，显示 红利内部存在分化：传统红利标签股票如长江电力走势震荡，而机器人、小金属等 前期热门概念票涨幅显著，反映出短期风格切换过程中存在暂停或反复信号。 Q:上周国常会核准的核电机组数量、项目分布、运营主体及技术路线具体情况如 何？ A:上周国常会核准八台核电机组，对应四个核电项目：浙江金七门核电二期工程 三四号机组、辽宁庄河核电一期工程一二号机组由中国核电运营；广东太平岭核电 三期工程五六号机组由中国广核运营；山东莱阳核电一期工程一二号机组由电投核 能运营。技术路线方面，莱阳项目采用两台国和一号机组，系山东荣成示范项目后 的首批批量化建设项目；其余三个项目均采用华龙一号技术融合升级版。核准后国 内核电机组总数达120台，总装机容量约1.35亿千瓦。 Q:本次核电核准对行业发展趋势及主要上市公司的影响如何？ A:本次核准符合十五五规划中核电平稳建设的政策节奏，强化了行业规模化、常 态化建设趋势，成长确定性与长期景气度进一步巩固。中国核电获核准四台机组， 项目储备更为丰厚；中国广核与电投核能各核准两台，项目建设节奏平稳，短期资 本开支压力可控。大唐发电通过参股大唐核电间接参与庄河核电一期工程，核电权 益版图扩大；浙能电力通过参股中核浙能源持有浙江金启门核电项目 14.81%权 益，该项目亦有阿里系等民企参与。 Q: 工信部印发的《工业绿色低碳发展十五五规划》提出的核心量化目标及产业影 响是什么？ A: 规划以培育绿色生产力为主线，设定明确量化目标：到 2030 年，再生有色金属 产量达 2500 万吨；废钢铁、废塑料、废纸、废旧轮胎年回收利用量分别达 3 亿 吨、2200 万吨、8000 万吨、2100 万吨；废旧动力电池中锂、钴、镍提取占比达同 期需求的 10%~15%；废光伏组件、废风机叶片利用量分别达 8 万吨、17 万吨。规划 强调绿色装备供给与低碳科技创新能力，利好技术储备深厚、具备核心研发能力的 资源化利用及低碳装备制造企业；同时鼓励绿电直连、源网荷储一体化模式，提升 新建算力设施与零碳工厂的绿电使用比例，拓展绿电消纳场景，对绿电运营商形成 实质性利好。 Q: 当前市场风格切换背景下，公用事业板块的投资逻辑与细分方向有哪些？ A: 市场风格切换呈现震荡特征，公用事业板块作为科技成长与防守红利属性的最 大公约数，后续分化为两条主线：一是科技协同方向，包括算力配套的绿电、垃圾 发电等；二是红利防守方向，聚焦基本面稳定的水电、核电，火力一体化标的，以 及具备强红利标签的水务板块。操作上建议采取边打边撤策略，公用事业板块在风 格轮动中的配置逻辑依然成立。", "status": "extracted"}, "post:2026-08-03T07-48:1a64c66ad0a9": {  ，近期大型科技公司的 CDS价格上涨不能直接解读为针对这些公司信用风险的担忧 ，而是要更 多的看到加息预期对于九期需求的意志 ，恰好不利于投资己的大型科技公司的长久期债券融资需求。 发言人 23:11 好，这就是我今天汇报的全部内容 ，谢谢。 发言人 23:17 各位大家周日晚上好 ，我是华川竣工王小川。 发言人 23:21 下面我来给大家介绍一下进攻的周宝。 发言人 23:25 E6636BB1012F9B6DA981D91E6DDB8DB48EBBBE5C536DD190AAEC463F44DFE58A9E7B9DEC435CE1D4A81D178E631F40F8316DA4C3E29B28025B3BAC7E5102CE988B32D35", "status": "extracted"}, "post:2026-08-03T11-35:ecac9460aa38": {"id": "post:2026-08-03T11-35:ecac9460aa38", "kind": "post", "title": "2026-08-03 11:35", "source_label": "帖子正文", "excerpt": "剑桥科技更新，光模块最大弹性标的，明年仅5x估值： 1、目前海外csp都处于临门一脚的状态，oracle最快。", "content": "剑桥科技更新，光模块最大弹性标的，明年仅5x估值： 1、目前海外csp都处于临门一脚的状态，oracle最快。 2、通过南京镭芯向axt锁了2500w美金磷化铟衬底。 3、永鼎大订单，来自jq。 4、深度投资了镭芯，跳过光芯片厂商直接锁定上游。 5、硅光芯片不缺，有5家供应商，源杰、永鼎、仕佳、镭芯、联亚。 6、dsp跟marvell锁料非常充分。 7、zlf承接了jq 新产线订单，对应年底新增1000w支产能。 8、1.6t试产完成，开始批量。 如需详细数据，欢迎私信。#文字观点", "publish_time": "2026-08-03 11:35", "tags": ["文字观点"]}, "post:2026-08-03T19-21:adb96b262d5c": {"id": "post:2026-08-03T19-21:adb96b262d5c", "kind": "post", "title": "2026-08-03 19:21", "source_label": "帖子正文", "excerpt": "【松发股份】70亿定增股票正式上市，现市值1500亿元左右，浙商重点推荐，三年一倍股，持续力推！", "content": "【松发股份】70亿定增股票正式上市，现市值1500亿元左右，浙商重点推荐，三年一倍股，持续力推！这是2024年以来最大的A股民营企业再融资，是近期相近规模定增项目中审核用时最短、发行底价折扣率最高的民营企业之一。 预计公司新增订单趋势向好。二季报业绩大超预期之后，期待年报、明年年报业绩超预期！ 【松发股份】全球船舶民企龙头，量利齐升再创恒力新辉煌！船舶行业中强阿尔法品种，未来空间大，持续力推！#文字观点", "publish_time": "2026-08-03 19:21", "tags": ["文字观点"]}, "attachment:files/招商证券-计算机行业周观察：海外CSP大厂财报更新，聚焦AI商业化变现能力-260802.pdf": {"id": "attachment:files/招商证券-计算机行业周观察：海外CSP大厂财报更新，聚焦AI商业化变现能力-260802.pdf", "kind": "attachment", "title": "招商证券-计算机行业周观察：海外CSP大厂财报更新，聚焦AI商业化变现能力-260802", "source_label": "招商证券", "excerpt": "2、寒武纪：计划拟授予 500万股，其中首次授予 400万股（ 80%），预留 100 万股（ 20%）。", "content": "敬请阅读末页的重要说明 证券研究报告 | 行业定期报告 2026年08月02日 推荐（维持） 计算机周观察 20260802 TMT及中小盘 /计算机 本轮财报披露后，海外头部科技企业股价呈现显著分化，微软、亚马逊迎来大 涨，谷歌（ Alphabet ）与 Meta股价明显回调。我们认为市场定价核心逻辑已 从单纯聚焦 AI投入转向考核 AI 资本开支的变现效率、现金流韧性、以及商业 化落地路径清晰度 。 ❑ 市场对 AI的估值逻辑已由单纯聚焦资本开支，转向重点衡量 AI投入的变现 效率与现金流韧性。 本轮财报披露后，海外头部科技企业股价呈现显著分化， 微软、亚马逊迎来大涨，谷歌（
