-27 11:43", "source_label": "帖子正文", "excerpt": "汇报2❗️【天风电新】SOFC：渗透率持续提升的三个逻辑，以及仍被低估的增长潜力-0926 ———————————— 无论是北美的审批机制、SOFC自身的降本迭代，还是未来800V DC渗透率提升，都有利于SOFC渗透率提升。BE的订单也已经从依赖几家大客户，进入到下游全面铺开的阶段，SOFC的产业", "content": "", "publish_time": "2026-09-27 11:43", "tags": ["文字观点"]}, "post:2026-09-27T19-00:fa2010434fc1": {"id": "post:2026-09-27T19-00:fa2010434fc1", "kind": "post", "title": "2026-09-27 19:00", "source_label": "帖子正文", "excerpt": "【开源机械】曙光8000金刚石散热方案亮相央视，金刚石散热落地加速！重视＃沃尔德、建议关注国机精工、力量钻石、四方达 ＃央视站台背书报道金刚石散热方案！", "content": "", "publish_time": "2026-09-27 19:00", "tags": ["技术路线", "晶圆级方案（wafer", "文字观点"]}, "post:2026-09-27T19-43:44fef8129fda": {"id": "post:2026-09-27T19-43:44fef8129fda", "kind": "post", "title": "2026-09-27 19:43", "source_label": "帖子正文", "excerpt": "#【算力散热主线】曙光8000央视亮相，高功率AI集群多路线散热技术共振，国产散热方案加速产业化！🎉🎉🎉 央视播出《超级工程-曙光8000》，公开国内十万卡级国产AI超算集群建设成果。", "content": "", "publish_time": "2026-09-27 19:43", "tags": ["新型散热技术国产化替代进程持续提速", "文字观点"]}}, "source_details": {"post:2026-09-27T09-28:284b8c8b6ea4": {"id": "post:2026-09-27T09-28:284b8c8b6ea4", "kind": "post", "title": "2026-09-27 09:28", "source_label": "帖子正文", "excerpt": "瑞银——亚太半导体行业核心观点 2026年9月：云端AI需求走强驱动全行业供应趋紧 一、行业总览与核心仓位 年初至今费城半导体指数（SOX）累计上涨88%，UBS覆盖的亚太半导体标的均价上涨90%，其中台积电涨61%、联发科涨263%、联电涨225%，同期道指仅涨7%、台湾加权指数涨65%。UBS维", "content": "瑞银——亚太半导体行业核心观点 2026年9月：云端AI需求走强驱动全行业供应趋紧 一、行业总览与核心仓位 年初至今费城半导体指数（SOX）累计上涨88%，UBS覆盖的亚太半导体标的均价上涨90%，其中台积电涨61%、联发科涨263%、联电涨225%，同期道指仅涨7%、台湾加权指数涨65%。 UBS维持对台积电的买入评级。基本面层面，预计N2制程代工需求至2028年将达约32万片/月，超越N3量产第三年的需求规模。竞争格局可控，台积电在先进制程代工及先进封装领域有望维持80%以上的市占率与技术领导地位。 成熟制程代工方面，考虑到中国大陆产能扩张趋于理性、台积电将成熟产能调配至先进封装，叠加需求复苏，UBS对今明两年供需改善持建设性看法，维持与市场共识相左的乐观判断。在成熟制程标的中，偏好联电，近期将力晶（PSMC）评级上调至买入，核心逻辑为基本面改善与供需格局优化。 先进封装领域，UBS给予日月光买入评级。随着先进封装对下一代云端及边缘AI的赋能作用日益关键，日月光有望显著受益于附加价值提升与利润率改善，当前仍处于盈利上调周期的早段。 在中国台湾无晶圆厂（Fabless）阵营中，UBS看好联发科在谷歌TPU大市场中的结构性份额提升及ASIC业务的上行期权；服务器赛道则偏好信骅（Aspeed），逻辑在于其TAM加速扩张与单芯片价值量持续提升。 二、先进封装格局：英特尔EMIB-T vs. 台积电CoPoS 先进封装已从前道制程微缩的必要补充，升级为芯片级整体性能的核心使能环节。即便英特尔EMIB-T平台获取一定份额，UBS研判台积电在先进封装领域仍具结构性优势。 EMIB-T采用嵌入式硅桥直接贴装于基板，省去大面积硅中介层，架构更简洁，具备成本效率与超大规模封装（12倍光罩尺寸以上）的延展性，量产目标窗口为2027年下半年。其短板在于大尺寸基板良率目前仅约50%（对比HPC ABF基板80%），且需证明量产良率可提升至90%以上，同时前道代工（台积电）与后道封装（英特尔）的协同亦构成执行风险。 台积电CoPoS则从晶圆形态迁移至方形面板形态，通过中介层实现芯片贴装，计划于2028年量产，首发客户预计为英伟达Feynman架构，AMD及ASIC客户随后跟进。其优势在于更高的互连密度、更优的信号/电源完整性，以及eDTC、iCap、3D堆叠乃至CPO的系统性技术升级路径。主要挑战在于翘曲控制与全新面板级设备链的成熟度。 UBS压力测试显示，即便假设2030年英特尔EMIB-T占据先进封装行业12%的份额，台积电仍可维持约65%至70%的市占率；在更激进的下行情景中（英特尔份额达17%），台积电份额仍守住63%，2026至2030年销售额复合增速达49%。两者大概率走向共存而非赢家通吃——EMIB-T服务于成本敏感与供应链多元化诉求，CoPoS则锁定最高性能与执行可靠性需求。 三、谷歌TPU崛起与联发科份额拐点 谷歌TPU已确立双轨并行战略。博通作为谷歌TPU设计服务独家伙伴长达十年，但近年谷歌正将更多前端设计收归内部。受台积电N3及CoWoS产能极度紧张制约，UBS预计谷歌将在2026年下半年至2027年同时推进博通v8i与联发科v8t项目，并在2028年TPU v9世代维持双轨放量。 UBS测算，联发科在TPU设计服务中的单芯片收费约为博通的一半，成本优势显著。2026年博通预计出货TPU占总量的90%，联发科占10%；至2027年，联发科份额将跃升至40%。按场景分析，联发科2027年TPU出货量有望达450万颗，对应营收约180亿美元，占其总营收比重升至46%，公司正由传统手机芯片厂商向\"云端+边缘AI无晶圆厂\"完成结构性跃迁。 TPU相较GPU的核心竞争力在于：张量核心内的矩阵乘法单元采用脉动阵列计算，能效显著优于GPU的频繁数据搬运架构；自v4引入的稀疏核心专司混合专家模型（MoE）的稀疏查找与路由，进一步拉升计算效率。TPU Ironwood的单token推理成本已低于英伟达Blackwell。 四、单GW级AI服务器对台积电的产能与销售弹性量化 伴随OpenAI及多家超大规模云厂商陆续宣布GW级服务器项目，UBS量化了每1GW服务器建设对台积电的拉动效应：每1GW需消耗约2至5千片/月（kwpm）的先进制程（N3/N2）产能及约3至6kwpm的CoWoS产能；对应逻辑环节晶圆厂设备（WFE）支出约10至20亿美元；台积电作为云端AI核心代工厂，每1GW增量可带来约10至20亿美元营收弹性，相当于其2025年总销售额的1.0%至1.5%。 不同架构的芯片单位GW消耗差异显著：英伟达Blackwell Ultra/Rubin世代每GW为台积电贡献约11亿美元营收，Rubin Ultra/Feynman世代升至14至19亿美元（受制程迁移、单机架GPU颗数增加及先进封装升级驱动）；博通设计的谷歌TPU v7 Ironwood因单芯片面积较小且架构效率导向，每GW对台积电营收拉动达19亿美元，占机架价值量的11%（GPU仅占4%至6%）；AMD MI450因小芯片设计，每GW对台积电产能需求最低，约1kwpm N2产能。 已披露的AI算力承诺总额超过1.4万亿美元，其中OpenAI与英伟达、AMD、谷歌、博通等达成的GW级合作协议构成核心增量来源，直接映射到台积电、日月光、联电等亚太半导体供应链的订单能见度。 五、共封装光学（CPO）：AI加速的下一战场 随着数据中心带宽需求持续攀升，光纤正加速替代铜缆用于长距离互连。CPO将光学引擎紧耦合至交换机或加速器的封装内，是解决更高带宽、更优信号完整性与更低功耗的关键路径。UBS判断，CPO技术成熟度仍需约三年培育期，传统可插拔光模块在未来两至三年仍为主流方案，两者将长期共存。 UBS基准情景预测，全球光模块整体可寻址市场（SAM）将由2025年的120亿美元增至2030年的320亿美元，复合增速22%，其中CPO方案占比由2025年的零升至2030年的20%（约65亿美元）。上行情景下，AI算力加速部署推动光模块市场以30%复合增速扩张，2030年CPO占比可达25%（约138亿美元）。 硅光子产业本身增速更快，UBS预计2025至2030年复合增速达35%，2030年行业销售额达61亿美元，台积电凭借EIC、PIC及光学引擎堆叠制造能力，市占率将从2025年的50%逐步提升至2030年的80%，对应营收贡献由0.6%升至2.0%。 供应链层面，CPO的渗透将强化台积电在云端AI的护城河；日月光有望攫取光纤阵列单元（FAU）耦合与交换机板级封装的显著份额；ABF基板厂商因基板级光学集成推高布线密度与层数需求而间接受益；传统可插拔光模块供应商（如Coherent、Lumentum、Innolight）及DSP供应商（如Marvell）则面临混合影响。CPO规模化拐点预计出现在2026年下半年至2027年（英伟达Rubin机架的scale-out互联率先导入），scale-up互联的全面CPO化则大概率延后至2029年。 六、关键标的估值与评级速览 UBS当前覆盖的亚太半导体核心标的评级与估值框架如下： 晶圆代工板块：台积电（买入）、联电（买入）、力晶（买入）、世界先进（中性）、稳懋（买入）、华虹（中性）、中芯国际（买入）。 无晶圆厂板块：世芯（买入）、祥硕（买入）、信骅（买入）、创意电子（买入）、联发科（买入）、 Faraday（中性）、联咏（中性）、谱瑞（中性）、瑞昱（中性）、矽力杰（买入）。 半导体后端与硅晶圆板块：All Ring（买入）、Amkor（买入）、日月光（买入）、ASMPT（买入）、颀邦（买入）、致茂（买入）、固得（买入）、GPTC（买入）、宏致（买入）、京元电子（买入）、力成（中性）、环球晶圆（买入）。 七、核心风险与定价逻辑 内存成本通胀对终端品牌毛利率构成双向挤压——DRAM占PC物料成本比重已从24%激增至59%，直接压制智能手机与PC的出货量与半导体需求。传统消费电子疲软与库存去化周期拉长形成负反馈，与AI算力链的极度紧缺构成2026年科技硬件市场最核心的分化格局。估值层面，AI供应链标的2027年预期市盈率普遍位于15至60倍区间，2028年盈利高增将显著消化估值溢价；非AI标的则面临盈利下修风险。#文字观点", "publish_time": "2026-09-27 09:28", "tags": ["文字观点"]}, "post:2026-09-27T11-44:07288f267854": {"id": "post:2026-09-27T11-44:07288f267854", "kind": "post", "title": "2026-09-27 11:44", "source_label": "帖子正文", "excerpt": "【中金传媒】传媒领域AI应用相关更新 260927通用AI#Anthropic9月23日，Claude发布Opus 5.5，Agent能力可通过视觉理解、代码生成和工具调用完成3D场景搭建开发、游戏生成。#OpenAI9月22日，OpenAI发布GPT-6 Sol及Luna，延续Astra技术路线", "content": "【中金传媒】传媒领域AI应用相关更新 260927通用AI#Anthropic9月23日，Claude发布Opus 5.5，Agent能力可通过视觉理解、代码生成和工具调用完成3D场景搭建开发、游戏生成。#OpenAI9月22日，OpenAI发布GPT-6 Sol及Luna，延续Astra技术路线，API价格较5.6同档降低约50%。#Google近期，Google正与Shopify商家合作，使得消费者无需跳转商家网站，即可通过对话在AI场景中完成购物、结账等操作。AI视频生成#字节跳动9月22日，火山引擎上线Seedance 2.5 Draft模式，可先用480P快速生成样片验证创意后再用1080P生成终版#芒果超媒9月30日，红色主题AIGC纪录片《重生筑成昆，血肉凿天路》将在芒果TV上线；该片由新闻中心《首发》团队主创，联合芒果TV平台运营中心、AI产业化中心共同打造。#博纳影业10月23日，首部AI超写实院线电影《三星堆：未来往事》将于院线上映，影片由博卡电影云片场生成制作，所有角色为原创数字形象，不含真实演员的数字复制#爱诗科技9月23日，爱诗科技发布PixVerse R2世界模型，提升生成质量、长程一致性及多模态控制能力；支持局部视频修改及互动影游、数字人生成。#虎鲸文娱9月22日，虎鲸文娱推出AI影视制作与管理平台“鲸锐AI”，支持精细镜头控制、全流程制作及大型团队协作，计划10月启动内测。AI 音乐#腾讯音乐据《读佳》报道，腾讯音乐正内测AI音乐创作工具MusicBuddy，可通过AI完成灵感创作、精修发行、宣推经营。张雪晴/余歆瑶/曹嘉扬/李京 欢迎联系我们获取AI应用资料集#文字观点", "publish_time": "2026-09-27 11:44", "tags": ["Anthropic", "OpenAI", "Google", "字节跳动", "芒果超媒", "博纳影业", "爱诗科技", "虎鲸文娱", "腾讯音乐", "文字观点"]}, "post:2026-09-27T19-07:73c8e038596d": {"id": "post:2026-09-27T19-07:73c8e038596d", "kind": "post", "title": "2026-09-27 19:07", "source_label": "帖子正文", "excerpt": "【中金互联网】互联网周思考：对云栖及Muse的若干想法阿里：三大基石夯实AI能力，持续创新引领行业趋势。阿里在本次云栖大会上表示将AI模型、AI芯片、AI云列为智能时代三大基石：模型端千问通过RSI与Scaling冲击5–10T参数（Qwen4.5/5），Qwen 3.8 Max上线两月Token消", "content": "【中金互联网】互联网周思考：对云栖及Muse的若干想法阿里：三大基石夯实AI能力，持续创新引领行业趋势。 阿里在本次云栖大会上表示将AI模型、AI芯片、AI云列为智能时代三大基石：模型端千问通过RSI与Scaling冲击5–10T参数（Qwen4.5/5），Qwen 3.8 Max上线两月Token消耗增12倍；芯片端平头哥真武V900提前至27Q1发布、性能达M890的3倍、单集群可扩至50万卡；云端目标2032年全球数据中心超20GW，对应我们静态测算FY33外部收入约1,750亿美元。 我们此前曾一度理解阿里的“AI+云”战略是两件事，或至多是两件有一定关联度的事，但本次云栖让我们深切感受到，Coding不止是提效方式，它把原有应用重写并容器化，未来云将变成支撑AI原生的云，而阿里恰恰在这一过程中，在芯片、基础设施和模型层面持续激进创新，让跟随者去跟随公司已经迭代或部分否定的东西，让模仿者去模仿公司已经放弃的版本，我们看好公司在云业务上竞争优势的持续释放。Meta：Muse引发市场重估氛围，国内能否映射有待商榷。 Muse在北美发布后气势如虹，下载量、活跃用户数、真实好评数据均可圈可点，并带动Meta近期明显超额收益，市场也期待能否因此重估腾讯个人Agent主题。但我们认为，Meta本身受益于短视频商业化趋势和AI提效广告的趋势，主业一直处在相对快速的增长通道上，但市场基于此前对公司管理层激进风格的担忧，在美股“七姐妹”中一直给公司偏低的估值水平；而本次Muse恰好给了一个市场认可公司管理层魄力、结构性重估的契机。 腾讯虽然广告业务亦可圈可点，但广告占比低，且金融受累于宏观、游戏存在产品周期，主业增速能维持在10%左右已属不易，市场基于对公司竞争壁垒、回报股东态度的认可，在互联网板块中一直给公司中高等级的估值水平（今年资本开支大增带来现金流与利润压力后估值也被压缩）；若期待腾讯因此重估，则意味着公司股价要对抗来自整个中概互联网板块低估值的地心引力，难度亦较大。#文字观点", "publish_time": "2026-09-27 19:07", "tags": ["文字观点"]}, "attachment:files/科技二次探底成功，算力撑起AI新主线20260926.pdf": {"id": "attachment:files/科技二次探底成功，算力撑起AI新主线20260926.pdf", "kind": "attachment", "title": "科技二次探底成功，算力撑起AI新主线20260926", "source_label": "其他", "excerpt": "科技二次探底成功，算力撑起AI新主线20260926 要点总结 1.AI算力是应用落地的核心幕后支撑。各类AI应用如同台前演员，算力提供强大技术支持", "content": "科技二次探底成功，算力撑起AI新主线20260926 要点总结 1.AI算力是应用落地的核心幕后支撑。各类AI应用如同台前演员，算力提供强大技术支持；用户操 作背后涉及海量参数传输与电信号高速处理，凸显算力的硬核地位与不可或缺性。 2.液冷技术正加速替代风冷成为AIDC主流散热方案。随着单机柜功率提升，风冷难以满足能耗需 求；液冷通过分水器循环散热、采用高导热低导电液体，具备PUE更低、部署快（集装箱模式45天交 付）、适配绿电等优势，市场需求预计2025年集中爆发。 3.国产算力与大模型突破形成良性协同循环。中国已实现从底层芯片到系统集成自主可控，测试表明 国产服务器推理调优无碍；2025年起国产大模型成本优化与技术突破将直接拉动国产算力需求，两者 相辅相成带动整体输出效率提升。 4.算力租赁市场呈现供不应求态势，全链路生态快速扩张。当前算力资源紧张且已全量出租，企业通 过调度平台盘活闲置算力；同时布局“电力-算力-产业”全链路，结合海外多地建中心与绿电直连模 式，推动算力服务多元化落地。 5.算力投资逻辑具备高确定性，基础设施层估值更具性价比。相比大模型赛道迭代快、不确定性高， 算力作为底层刚需无论何种模型胜出均需配套；当前基础设施类国产算力估值绝对值与拥挤度较低，调 整后投资确定性更强。 6.科技行情尚未结束，建议采用定投策略平滑波动。七月前过热回调属正常现象，AI产业景气度依然 高企；面对高弹性高波动的科技资产，投资者应控制仓位上限，搭配红利资产构建组合，并通过定投分 散风险。 问答整理 Q1：AI算力在背后扮演了什么角色？ 答：各类AI应用如同台前演员，而AI算力则是最伟大的幕后搭台人，为各类AI功能的实现提供了强 大的技术支持。 Q2：本次活动中与哪位嘉宾一起云逛展？ 答：在本次活动中，与创业板算力ETF天弘基金经理洪明华一起云逛展。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q3：AI大模型在生活中有哪些应用场景？ 答：AI大模型在生活中有越来越多的应用，包括但不限于查询攻略、撰写文案以及实时语音同传等， 它们已经融入到日常生活中，成为随时待命的全能助手。 Q4：在点击手机屏幕发送信息的几秒钟内，背后发生了什么？ 答：在点击手机屏幕发送信息的几秒钟内，实际上发生了几十亿甚至上百亿个参数瞬间被传输到千里之 外的数据中心的过程。数亿电信号在光纤中高速传递，然后再将答案送回用户的手机，这一幕后运行的 硬核力量就是AI魔法运转的核心。 Q5：成都金域天下科技有限公司在此次展会上主要展示了什么产品及特色？ 答：成都金域天下科技有限公司在展会上主要展示了集运旗下的蒜粒租赁品牌——集资算，提供了算力 平台租赁、底层算力AI基础设施产品JC，并表示未来将往通运工厂方向进行演进。 Q6：集资算平台的核心技术和产品亮点是什么？ 答：集资算平台是基于全栈自研技术构建的，拥有纯资源路线的能力，支持GPU云服务器容器以及裸 金属服务，并且是国内首家同时提供这些能力整合的服务商。该平台不仅面向终端用户，还为合作伙伴 提供快速进入AI算力行业的解决方案。 Q7：950车型在市场中扮演什么角色？ 答：950车型目前是多个竞品争夺的目标，它主要面向易购市场，采用多种GPU卡定型模式进行发 展。这种模式能够融合海外国产卡，并凭借中国内地大陆强大的能源和电力基础设施优势，实现更健壮 的性能。 Q8：中国在云计算出海方面有哪些亮点？ 答：中国的云计算出海亮点在于利用丰富的能源与电力基础设施资源，尤其是水电资源，在降低运营成 本的同时，通过网络技术使海外用户不再关注基础设施的具体位置，从而将本地优势转化为全球市场竞 争力。 Q9：国产化趋势对相关企业增长的影响如何？ 答：国产化浪潮推动了包括国有企业和民营企业在内的众多企业向云计算方向转型。以某集运服务为 例，其营收客户数和增长率在过去三年中实现了3至5倍的增长，预示着未来五年内可能保持高速增长 态势，尤其是在算力需求日益增长的背景下，国产化趋势将显著影响市场格局。 Q10：液冷技术在数据中心中的应用现状与前景如何？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：深圳市电力电脑设备技术有限公司作为一线厂商，分享了他们从2020年开始专注于液冷业务，并 在AI30夜里迅速抓住红利流量，目前已成为行业领先的公司。液冷技术对于提升服务器性能、节能减 排以及满足不断增长的算力需求至关重要，特别是在高密度计算和大型数据中心中，液冷改造后的设备 性能可发挥至100%，PUE值更低，符合国家最新政策要求。随着AI、大数据等领域的发展，液冷市 场的订单量和客户数呈现爆发式增长，预示着未来5到10年内，液冷赛道将拥有巨大的市场份额，是 投资者和企业关注的重点。 Q11：液冷技术市场目前的发展状况如何？ 答：液冷技术作为一项新技术，市场需求在2025年才开始大量出现。随着市场需求的增长，许多上市 公司和资本看到了商机，纷纷投资并购入相关企业进入这个赛道。其中，该公司自2021年开始涉足液 冷领域，凭借较早的进入优势以及自主研发、自主设计的能力，在行业中具有一定竞争力。 Q12：公司在液冷领域的竞争优势有哪些？ 答：公司的竞争优势主要体现在三个方面：首先，作为较早进入液冷行业的企业，拥有强大的自主研发 能力；其次，公司拥有一支专业的外贸团队和30多人的研发团队，并且产品已通过全球认证（如CE、 UI等），并在全球范围内拥有众多经销商伙伴，产品已成功推向全球一百多个国家；最后，公司在不 断寻求与上下游企业的合作机会，以加速液冷技术的应用落地和市场拓展。 Q13：液冷服务器的工作原理是什么？ 答：液冷服务器通过分水器将冷水分配到八块冷板及CPU区域，冷水在芯片中吸收热量后变成热水， 再通过红色管路汇集到分流器，随后排入机柜上方的接水盘，最终流入室外进行循环散热。该过程采用 蓝色代表冷水，红色代表热水，形成循环降温系统，且该系统可对潜在的漏水情况进行实时监控和报 警，确保设备安全。 Q14：液冷服务器所使用的液体及其优点是什么？ 答：液冷服务器内部使用的是一种具有高导热性和低导电性的液体，如PG25或其他一次水、乙醇、丙 二醇等混合液。这种液体不仅能够高效传导热量，而且不易导电，从而降低了滋生细菌和形成结构的风 险，保证了整个系统的稳定性和安全性。 Q15：液冷集装箱如何实现快速部署及优势？ 答：液冷集装箱通过简单地拖至所需地点即可快速完成部署，接上电源即可使用，大大简化了传统数据 中心建设的复杂流程。这种解决方案在全球范围内，尤其是在阿里巴巴国际平台上已成功交付多个案 例，并以其快速部署能力著称，交付周期仅需45天即可交付标准的20尺或40尺集装箱。此外，国内 可根据客户需求定制不同尺寸，而海外则需经过船级社认证，但仍能提供二手车和四手车标准厂房选 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 项。相较于传统建设方式，液冷集装箱解决方案在效能成本上有显著优势，能够在偏远地区快速落地， 利用当地绿电资源，如水电、风力发电或太阳能发电，实现高效、低成本的数据中心部署。 Q16：美芝威灵在数据中心热管理领域的创新产品与技术有哪些？ 答：美芝威灵作为一家源于美的集团的企业，依托三十多年在热管理和精密制造领域的深厚积累，专注 于数据中心与储能热管理温控的核心部件领域。在本次大会上，他们展示了覆盖风冷和液冷场景的产 品，包括室外干冷气冷却塔、冷水机组、浮泵机组等室外冷源设备，以及风墙、机房空调、CPU配套 的压缩机、风机阀、屏蔽泵机械泵等产品。其中，特别强调了涡旋变频压缩机这一智能核心设备，该产 品能有效结合风冷与液冷的优势，通过与浮泵的协同工作，在不同环境下智能调节冷媒流量，从而提升 整体能效，降低能耗，尤其适用于北方寒冷地区的数据中心场景。 Q17：离心风机在数据中心散热系统中的作用及与轴流风机的差异是什么？ 答：离心风机在数据中心风冷换热系统中扮演着关键角色，其工作原理是利用离心力将风道中的冷风散 出，相较于轴流风机，离心风机的风向流向不同，推力更强，有助于提高散热效率。在不同的应用场景 下，如室外侧的干冷器散热或精密空调、两端风墙等二次侧设备的散热，离心风机因其较大的功率而显 得更为有效。尽管在某些场景下，液冷成为主流方向，但风冷与液冷仍然存在协同工作的情况，根据客 户需求和设备设计来选择适用的风机类型。 Q18：为什么当前服务器及AIGC升级导致风冷方案无法满足能耗需求，液冷成为主流？ 答：随着服务器及AIGC技术的不断升级，单机柜功率日益增高，原有的风冷方案已经无法有效地提供 足够的散热能力。因此，在新的技术趋势下，液冷技术逐渐崭露头角并成为AIDC领域的主流选择。尽 管如此，风冷与液冷并未完全取代对方，而是以并行且相互补充的方式存在，分别在不同的环节承担不 同的功能。 Q19：万界数据公司如何通过一站式AI应用平台服务各行各业并推动行业落地？ 答：万界数据公司构建了一个集算力基础设施与模型应用于一体的一站式AI服务平台，该平台在全国 各地建设了多个授权中心，拥有高达22000匹的算力规模，并致力于打造全国算力一张网的服务体 系。此外，平台还提供了诸如AI视频生成、智能全链路服务等多元应用，例如通过延安芥末产品可实 现一站式视频生成服务，包括AI短剧、电影和各类宣传片制作。通过连接需求方与专业创作团队，万 界数据成功将AI技术应用于文旅、文创等多个领域，极大地缩短了视频制作周期和成本，提升了产出 效率和质量，同时也展示了其在IP孵化及商业化运作上的潜力。 Q20：如何通过全链路的电力转化来构建生态并提升算力利用率？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：在全链路中，从底层电力开始，逐步转化为算力，再将算力应用于各种产业场景。该公司已经全面 布局了全链路产品，包括算力，并通过建设租赁公司对外提供算力服务。他们利用调度平台分配算力资 源，以确保整体可用率和高效状态，并通过灵活调度闲置算力，如闲时算力或利用率未达100%的算力 资源，来提高整体使用的效率。 Q21：当前租赁算力的市场状况如何？ 答：目前，租赁算力的需求呈现供不应求的状态，市场较为紧张。所有范围内的算力都已出租，且不仅 用于内部固定使用，还通过适时调配闲置算力以提升资源利用率。此外，预计未来五年在线算力将达到 10万台以上，规模相当大，租赁客户群体多元化，包括互联网大厂、运营商、高校以及各种大小型企 业。 Q22：公司在国际市场的拓展计划及算力来源多样化是如何实现的？ 答：公司在国内外多地（如西班牙、巴西、东南亚、蒙古等）推进算力中心建设，并计划将国产卡产品 推向海外市场。目前，已在全球范围内建立了多元化的算力来源，利用丰富的电力资源，尤其是利用风 电水电充足的地区，采用绿电直连、储能与电网协同等方式，建设更加清洁、稳定的算力设施。同时， 通过与新能源和智算中心共建模式，促进新能源电力的消纳和数据中心稳定算力的保障。 Q23：公司如何利用自身优势推动生态发展及算力服务创新？ 答：公司在算力增长迅速的基础上，开发了莱蒙AI智能体平台、研接目平台以及聚合max平台等三大 平台，对应通用大模型和行业大模型业务，快速启动并成功进入相关生态领域。由于拥有自有算力和基 础设施，公司能够为平台提供保障，并将自有算力与平台联动，形成良好的业务协同效应。目前正处于 融资阶段，借助政府支持和其他合作伙伴力量扩展数据中心设施，同时利用技术实力和专利软著等完成 了平台的推广，实现了从底层算力到行业大模型的整体优势。 Q24：湘说你们本地算力相较于其他云服务有何优势？ 答：我们通过本地提升XOS后，在本地拥有基础办公功能，即使在网络不稳定或无网络的情况下，也 能流畅地完成文字办公（如word、excel和powerpoint操作）以及视频学习等常见任务。这种离线 使用场景填补了传统云端应用对网络依赖的短板，实现了类似本地设备的使用体验。 Q25：针对企业定制化需求，你们的产品有哪些特点？ 答：我们将推出基于企业需求定制的操作agent，例如正在内测的小费助手语音助手，它可以理解并执 行诸如请假、审批等非标准化操作。此外，会议助手也支持语音控制开会、邀请人员等功能，这些都体 现了对用户个性化需求的灵活响应和高效处理。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ªQ26：对于会议系统，能否详细说明其特点和功能？ 答：我们的会议系统支持通过语音指令快速启动会议，如“小金同学帮我打开一个腾讯会议”，并能自 动邀请相关人员加入会议。未来还会兼容更多会议软件，实现语音操控摄像头、麦克风等设备，极大地 简化了会议操作流程，提升了会议效率。 Q27：端测与云端如何协同工作以降低成本并提升性能体验？ 答：目前，端测算力与云端后台紧密结合，端测的 talking 均使用金山云后台的抽风算例，大部分日常 操作和算力需求可由本地提供，节省了大量成本。同时，随着云端算力成本的快速下降，用户在语音唤 醒、AI agent 操作等方面的成本也将显著降低，从而带来更好的性能体验和经济效益。 Q28：中国在 AI 算力产业链中的布局情况如何？ 答：中国在 AI 算力产业链的布局非常全面，不仅拥有自主可控的 AI 大模型，而且国产算力与大模型的 协同效果已经相当好。例如，有测试结果显示，在国产服务器上进行 6 天的 62T 推理调量，这表明从 底层国产芯片到超节点再到系统集成，整个产业链条已基本没有问题，形成了良性循环。 Q29：当前中国的 AI 生态现状及特点是什么？ 答：目前，中国的 AI 生态已进入良性循环阶段，体现在拥有自主知识产权的大模型、自主可控的 AI 芯 片以及表现优势明显的 AI 应用。各个组成部分如算力、大模型到应用形成了一种协同效应，并且有企 业开始将不同业务整合在一个生态体系内，比如万界数据不仅自研算力，还开发上层应用以实现与底层 算力的协同。 Q30：AI 算力市场需求增长情况如何？ 答：AI 算力市场需求呈现爆发式增长态势。周度的 AI 调用量同比增长达到 20 倍，国内云厂商 2022 年的资本开支增长 80%。从周度调用量数据可以看出，整个算力需求持续快速上升，同时中国大模型 市场份额也稳步提升。此外，资本开支数据进一步印证了未来两年 AI 算力投资将保持较高增速，供需 失衡的现象更加明显，对提供 AI 算力的企业产生了积极影响，如议价能力增强、毛利率提高，甚至出 现与大模型厂商合作分成的新模式，这些都为相关企业提供利好条件。 Q31：国产算力爆发是否可以被视为与国产大模型突破相辅相成的？ 答：是的，从 2026 年开始，国产算力的爆发与中国的国产大模型突破是相辅相成的。例如，2025 年 的 Siguang RE 大模型在全球第一梯队中崭露头角，并且在保持相同智能水平的同时实现了成本最低 化。这一系列国产大模型（如 Deep Sec V4.1 和 GPT5.3 等）的突破，带动了国内对国产算力的需求 增长，进而促进了国产算力与国产大模型的进一步适配，提升了整体输出效率并降低了单位成本。 _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008QQ£º1490929960 Q32：国产大模型的崛起如何影响国产算力市场的发展？ 答：国产大模型的成功应用和爆发性增长，不仅带动了国产算力需求的快速增长，还促使国产算力与国 产大模型之间的协同效应增强。这种情况下，国产算力呈现蒸蒸日上的态势，相关企业如凯米和DC的 微信等已经达到了全球成本前沿，预计在未来几年内将带来更快的增长率。同时，随着蒜粒成本不断下 降、用户使用成本降低以及性能提升，用户体验将大幅提高，从而迎来一个显著的爆发式增长。 Q33：国产算力需求增长是否会在资本市场上有体现？ 答：国产算力需求的爆发肯定会反映到资本市场中，拉动从应用端到基础设施建设的投资增长，尤其是 数据中心（IDC）等环节。此外，政策层面也对国产算力网给予了高度重视，将其与水网、电网并列为 国家战略基础设施，并预计在未来有新增投资计划。这将对国产算力建设提供高确定性的投资环境，相 较于海外算力链可能受到制裁等不确定因素的影响，国产算力更具优势。 Q34：创业板算力指数有何独特之处？ 答：创业板算力指数专注于国产算力领域，其成分股中超70%为国产算力相关企业，并且聚焦于创新 成长型中小市值品种。该指数的编制方案使得其在芯片及计算设备权重配置上更为侧重，AABC（数据 中心）相关权重占比超过40%，这不仅反映了国产算力较高的占比，也体现了其较强的弹性特征。因 此，该指数对于追踪国产算力领域投资机会具有较高参考价值。 Q35：在企业调整和资本市场中，为何会选择配置AIDC相关基础设施？ 答：选择配置AIDC基础设施是因为它具有爆发性需求、确定性强的特点，相较于模型的迭代更新不确 定性较大，通过增加这种确定性配置可以增强整个产品的增长确定性。 Q36：大模型赛道的竞争状况如何？ 答：大模型赛道竞争激烈，如谷歌曾领先但很快被OpenAI等公司超越。国内的千问、GLM和Deep 等模型在推出新版本后也可能在2-3周或一个月内达到高光期，但随后会被其他大模型厂商的新模型取 代，因此对于从事大模型研发的公司来说，不确定性较大。 Q37：对于算力投资逻辑的看法是什么？ 答：对于算力的投资逻辑，其优势在于稳定性（确定性）较高，因为无论哪个模型胜出，都需要足够的 算力支持。尤其对于国产算力，由于政策端的支持以及海外存在制裁风险，国产算力具有更好的确定性 和领先追赶态势。 Q38：如何理解科技股高弹性与高波动性的双刃剑？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：科技股高弹性意味着上涨时收益较大，但下跌时跌幅也不小。投资者需评估自身风险承受能力，将 科技股作为卫星配置，并控制好科技赛道整体配置的仓位上限，以平衡风险与收益，确保投资心态稳 定。 Q39：对于当前科技股行情的看法？ 答：在七月份之前，市场出现过热迹象，之后的调整是对高拥挤度的自然回调。尽管短期调整，但从需 求端和投入端看，AI产业景气依旧较高。调整过后，只要AI产业持续向上发展，产业链上的公司仍有 较好的投资机会。 Q40：近期AI投资有哪些值得关注的方向？ 答：近期AI投资方向出现明显分化，国产算力与海外算力呈现一定的分化格局，其中国产算力由于政 策、建设进度以及国产大模型和算力突破等方面的确定性较强，表现更为亮眼。具体投资方向上，可以 关注偏芯片类和基础算力类的国产算力指数。 Q41：国产算力相较于海外算力有哪些优势？ 答：国产算力在政策支持、建设进度和技术突破（如华为升腾系列芯片及服务器技术升级）等方面表现 出色，具有一定的领先优势，并且在高弹性与高波动性中提供了更好的确定性。 Q42：在AI产业爆发的过程中，产业链爆发的顺序是怎样的？ 答：按照黄天心提出的五层蛋糕理论，产业链爆发通常从新建环节开始，之后大概率会延续到基础设施 层的爆发。 Q43：近期基础设施板块的营收和净利润增长情况如何？ 答：根据最新的年报数据显示，基础设施板块在当期维持了高速的增长态势，并且从库存、预付款与营 收的比例等方面也反映出持续向好的趋势。 Q44：为什么对于基础设施类国产算力的投资更值得看好？ 答：相比芯片类贯穿力较强但拥挤度较高的资产，基础设施类国产算力的估值绝对值和拥挤度较低，在 经过调整后，其作为相对低估、低拥挤度的资产，投资确定性会更好。 Q45：科技股行情是否结束，现在是否是合适上车时机？ 答：尽管科技股出现了一定调整，但整个科技股行情还未结束。AI产业依然保持高景气度和高速增 长，需求端和投入端的数据均表明行业并未见顶，因此，在经过较大调整后，二级市场的投资机会依然 存在。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q46：面对高波动的科技类指数型产品，普通投资者应该如何布局？ 答：建议普通投资者采用定投方式来平滑和分散风险，同时控制此类高波动产品在投资组合中的仓位上 限。推荐在配置科技类资产的同时，适当配置红利类资产，以降低整体组合的波动性，更好地管理投资 心态。 Q47：如何全面把握AI投资机会？ 答：天弘基金在AI产业布局广泛，涵盖了能源层（如绿色电力）、芯片层（科创芯片设计）、基础设 施层（创业板算力、零计算等）、应用层（港股科技、互联网等）。建议投资者按层次布局相关产品， 构建既有科技弹性又有红利保护的投资组合。 原文 会议信息时间：9月24日参会人：无章节速览思维导图问答回顾发言人问：AI算力在背后扮演了什么 角色？ 发言人答：各类AI应用如同台前演员，而AI算力则是最伟大的幕后搭台人，为各类AI功能的实现提 供了强大的技术支持。 发言人问：本次活动中与哪位嘉宾一起云逛展？ 发言人答：在本次活动中，与创业板算力ETF天弘基金经理洪明华一起云逛展。 发言人问：AI大模型在生活中有哪些应用场景？ 发言人、发言人答：AI大模型在生活中有越来越多的应用，包括但不限于查询攻略、撰写文案以及实 时语音同传等，它们已经融入到日常生活中，成为随时待命的全能助手。 发言人问：在点击手机屏幕发送信息的几秒钟内，背后发生了什么？ 发言人答：在点击手机屏幕发送信息的几秒钟内，实际上发生了几十亿甚至上百亿个参数瞬间被传输 到千里之外的数据中心的过程。数亿电信号在光纤中高速传递，然后再将答案送回用户的手机，这一幕 后运行的硬核力量就是AI魔法运转的核心。 发言人问：成都金域天下科技有限公司在此次展会上主要展示了什么产品及特色？ 发言人答：成都金域天下科技有限公司在展会上主要展示了集运旗下的蒜粒租赁品牌——集资算，提 供了算力平台租赁、底层算力AI基础设施产品JC，并表示未来将往通运工厂方向进行演进。 发言人问：集资算平台的核心技术和产品亮点是什么？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 未知发言人答：集资算平台是基于全栈自研技术构建的，拥有纯资源路线的能力，支持GPU云服务器 容器以及裸金属服务，并且是国内首家同时提供这些能力整合的服务商。该平台不仅面向终端用户，还 为合作伙伴提供快速进入AI算力行业的解决方案。 发言人问：950车型在市场中扮演什么角色？ 发言人答：950车型目前是多个竞品争夺的目标，它主要面向易购市场，采用多种GPU卡定型模式进 行发展。这种模式能够融合海外国产卡，并凭借中国内地大陆强大的能源和电力基础设施优势，实现更 健壮的性能。 发言人、发言人问：中国在云计算出海方面有哪些亮点？ 发言人、发言人答：中国的云计算出海亮点在于利用丰富的能源与电力基础设施资源，尤其是水电资 源，在降低运营成本的同时，通过网络技术使海外用户不再关注基础设施的具体位置，从而将本地优势 转化为全球市场竞争力。 发言人、发言人问：国产化趋势对相关企业增长的影响如何？ 发言人、发言人答：国产化浪潮推动了包括国有企业和民营企业在内的众多企业向云计算方向转型。 以某集运服务为例，其营收客户数和增长率在过去三年中实现了3至5倍的增长，预示着未来五年内可 能保持高速增长态势，尤其是在算力需求日益增长的背景下，国产化趋势将显著影响市场格局。 发言人问：夜冷技术在数据中心中的应用现状与前景如何？ 发言人答：深圳市电力电脑设备技术有限公司作为一线厂商，分享了他们从2020年开始专注于液冷业 务，并在AI30夜里迅速抓住红利流量，目前已成为行业领先的公司。液冷技术对于提升服务器性能、 节能减排以及满足不断增长的算力需求至关重要，特别是在高密度计算和大型数据中心中，液冷改造后 的设备性能可发挥至100%，PUE值更低，符合国家最新政策要求。随着AI、大数据等领域的发展， 夜冷市场的订单量和客户数呈现爆发式增长，预示着未来5到10年内，夜冷赛道将拥有巨大的市场份 额，是投资者和企业关注的重点。 发言人问：液冷技术市场目前的发展状况如何？ 发言人、发言人答：液冷技术作为一项新技术，市场需求在2025年才开始大量出现。随着市场需求的 增长，许多上市公司和资本看到了商机，纷纷投资并购入相关企业进入这个赛道。其中，该公司自 2021年开始涉足液冷领域，凭借较早的进入优势以及自主研发、自主设计的能力，在行业中具有一定 竞争力。 发言人、发言人问：公司在液冷领域的竞争优势有哪些？ 发言人、发言人答：公司的竞争优势主要体现在三个方面：首先，作为较早进入液冷行业的企业，拥 有强大的自主研发能力；其次，公司拥有一支专业的外贸团队和30多人的研发团队，并且产品已通过 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 全球认证（如CE、UI等），并在全球范围内拥有众多经销商伙伴，产品已成功推向全球一百多个国 家；最后，公司在不断寻求与上下游企业的合作机会，以加速液冷技术的应用落地和市场拓展。 发言人问：液冷服务器的工作原理是什么？ 发言人答：液冷服务器通过分水器将冷水分配到八块冷板及CPU区域，冷水在芯片中吸收热量后变成 热水，再通过红色管路汇集到分流器，随后排入机柜上方的接水盘，最终流入室外进行循环散热。该过 程采用蓝色代表冷水，红色代表热水，形成循环降温系统，且该系统可对潜在的漏水情况进行实时监控 和报警，确保设备安全。 发言人问：液冷服务器所使用的液体及其优点是什么？ 发言人答：液冷服务器内部使用的是一种具有高导热性和低导电性的液体，如PG25或其他一次水、 乙醇、丙二醇等混合液。这种液体不仅能够高效传导热量，而且不易导电，从而降低了滋生细菌和形成 结构的风险，保证了整个系统的稳定性和安全性。 发言人问：液冷集装箱如何实现快速部署及优势？ 未知发言人答：液冷集装箱通过简单地拖至所需地点即可快速完成部署，接上电源即可使用，大大简 化了传统数据中心建设的复杂流程。这种解决方案在全球范围内，尤其是在阿里巴巴国际平台上已成功 交付多个案例，并以其快速部署能力著称，交付周期仅需45天即可交付标准的20尺或40尺集装箱。 此外，国内可根据客户需求定制不同尺寸，而海外则需经过船级社认证，但仍能提供二手车和四手车标 准厂房选项。相较于传统建设方式，液冷集装箱解决方案在效能成本上有显著优势，能够在偏远地区快 速落地，利用当地绿电资源，如水电、风力发电或太阳能发电，实现高效、低成本的数据中心部署。 发言人问：美芝威灵在数据中心热管理领域的创新产品与技术有哪些？ 发言人答：美芝威灵作为一家源于美的集团的企业，依托三十多年在热管理和精密制造领域的深厚积 累，专注于数据中心与储能热管理温控的核心部件领域。在本次大会上，他们展示了覆盖风冷和液冷场 景的产品，包括室外干冷气冷却塔、冷水机组、浮泵机组等室外冷源设备，以及风墙、机房空调、CPU 配套的压缩机、风机阀、屏蔽泵机械泵等产品。其中，特别强调了涡旋变频压缩机这一智能核心设备， 该产品能有效结合风冷与液冷的优势，通过与浮泵的协同工作，在不同环境下智能调节冷媒流量，从而 提升整体能效，降低能耗，尤其适用于北方寒冷地区的数据中心场景。 发言人、发言人问：离心风机在数据中心散热系统中的作用及与轴流风机的差异是什么？ 发言人、发言人答：离心风机在数据中心风冷换热系统中扮演着关键角色，其工作原理是利用离心力 将风道中的冷风散出，相较于轴流风机，离心风机的风向流向不同，推力更强，有助于提高散热效率。 在不同的应用场景下，如室外侧的干冷器散热或精密空调、两端风墙等二次侧设备的散热，离心风机因 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 其较大的功率而显得更为有效。尽管在某些场景下，液冷成为主流方向，但风冷与液冷仍然存在协同工 作的情况，根据客户需求和设备设计来选择适用的风机类型。 发言人问：为什么当前服务器及AIGC升级导致风冷方案无法满足能耗需求，液冷成为主流？ 发言人答：随着服务器及AIGC技术的不断升级，单机柜功率日益增高，原有的风冷方案已经无法有 效地提供 前；展望HBM未来两年紧缺或加剧，明年价格将显著上涨；2027年消费类存储短缺不会缓解，价格将持续上行；海外原厂长协签订、股东回报持续，我们看好存储原厂表现，推荐长鑫科技。此外CPU链拉货加快，多核化下单CPU配置内存条数量提升，带动内存接口及配套芯片成长加速，重点推荐聚辰股份、澜起科技。 （4）云栖大会及国产算力更新反馈及持续推荐：阿里发布最新芯片真武V900以及发布AL144超节点，V900算力约为前代M890的3倍，可扩展至50万卡，划2027Q1量产及部署；同时对AI基建投入方向明确，2032年阿里云运营的全球数据中心规模超过20GW，进一步强化国内算力需求。近期国产算力厂商新产品迭代加速，与海外差距进一步缩小，当前核心瓶颈仍在供给端，我们持续看好国产算力上游长鑫科技（HBM），中芯华虹（先进制程），以及头部设计公司。#文字观点", "publish_time": "2026-09-27 20:20", "tags": ["文字观点"]}, "post:2026-09-27T22-34:deabb5fe06de": {"id": "post:2026-09-27T22-34:deabb5fe06de", "kind": "post", "title": "2026-09-27 22:34", "source_label": "帖子正文", "excerpt": "各位领导，今天我们外发了【电子行业26Q3业绩前瞻】，供领导们参考 整体来看：#我们预计26Q3电子行业在AI趋势浪潮下整体业绩维持高景气。其中AI通胀方向最佳，PCB/CCL、存储、AI电源相关公司业绩表现强劲，此外受益于AI订单外溢的半导体制造/封测产业链整体订单趋势持续景气", "content": "各位领导，今天我们外发了【电子行业26Q3业绩前瞻】，供领导们参考 整体来看：#我们预计26Q3电子行业在AI趋势浪潮下整体业绩维持高景气。其中AI通胀方向最佳，PCB/CCL、存储、AI电源相关公司业绩表现强劲，此外受益于AI订单外溢的半导体制造/封测产业链整体订单趋势持续景气；其次自主可控方向趋势延续，半导体国产设备及零部件端订单快速增长、交付偏紧，下游算力荒持续背景下国产算力相关公司收入/订单保持跨越式增长，静待利润端改签；消费电子整体仍然需求平淡，其中有AI敞口、独立成长逻辑的中上游公司表现更优，面板行业有涨价逻辑的公司业绩更为强势。 我们预计表现相对亮眼的细分板块有：PCB/CCL、存储原厂及利基存储设计、AI电源、CPU链、FAB龙头、设备龙头、合封存储的IC设计公司及新品放量公司等。预计业绩表现亮眼的公司有：①PCB/CCL：生益科技、南亚新材、兴森科技、沪电股份、深南电路、景旺电子、奥士康；②存储：长鑫科技、澜起科技、聚辰股份、兆易创新、普冉股份；③AI电源：三环集团、风华高科、昀冢科技、顺络电子、江海股份、新节能、圣邦股份、纳芯微、优迅股份；④半导体设备/零部件：联讯仪器；⑤消费电子：立讯精密、蓝特光学、永新光学、国科微、富瀚微、星宸科技、瑞芯微、睿创微纳；⑥面板/LED：三利谱、木林森。 展望2026Q4及2027年，我们认为电子行业投资主线仍将继续围绕“自主可控、AI算力”两大方向展开。一方面，国内算力芯片、晶圆制造、设备和先进封装加速形成产业闭环，相关公司订单及业绩有望持续兑现；另一方面，AI服务器配套零部件需求景气，相关供应链公司业绩有望持续兑现。我们继续看好基本面强、业绩兑现度高且具备国产替代空间的细分方向。#文字观点", "publish_time": "2026-09-27 22:34", "tags": ["文字观点"]}, "attachment:files/国产算力观点更新.docx": {"id": "attachment:files/国产算力观点更新.docx", "kind": "attachment", "title": "国产算力观点更新", "source_label": "其他", "excerpt": "今天主要由我来汇报一下我们对国产算力的最新观点。首先结合最新的信息，对部分头部厂商，如华为、寒武纪和沐曦的情况进行梳理，最后做一个总结。", "content": "今天主要由我来汇报一下我们对国产算力的最新观点。首先结合最新的信息，对部分头部厂商，如华为、寒武纪和沐曦的情况进行梳理，最后做一个总结。这次电话会大概分为这几个内容。 第一，关于最新的国产算力情况。大厂的Capex在明显上修：由于海外高端卡缺货，采购开始加速转向国产，国产卡的产能现在非常紧张，再叠加HBM涨价，行业进入量价齐升的状态。基本上HBM的涨价都可以顺价传导到芯片的厂价中去。单卡受限的话，主要就靠组网、交换的环节，斜率是最高的。我们认为从现在九月底到春节前，整个Capex的预期，包括GPU的下单以及业绩，都有望持续落地，所以这个阶段适合布局国产算力。关于Capex上修，像字节今年年初的时候Capex是1700亿，现在大概已经上调到2700亿了；按七年保守预计增加20%，乐观的话增加50%。所以根据交换机厂商的订单数来看，基本上是翻倍以上的增长，幅度很大。但现在海外高端卡的到货仍然非常慢，据我们了解，现在每个月能留在国内的B卡基本上只有1000台服务器。服务器基本上得组到万卡集群，而且价格都非常高，这个拿货的价格，3D版本大概在1400万到1500万。 对整个算力体系来说，国产卡会加速替代，特别是推理端，推理端首选国产卡。Capex上修和海外卡受限，不仅会带来国产卡订单的爆发，据我们了解，包括摩尔线程、沐曦在内的厂商，明年的整体收入指引（或者说理论上限）都已经上修。摩尔线程最新的交流已经把明年的收入上限上调，在没有短缺的情况下，每年收入希望往410亿甚至更高的地方走，沐曦基本上也是。各家包括燧原、壁仞也是，基本上都在上修明年整体收入指引的预期。 第二块是传导。字节那边国产方面的采购占比，近一两年内已经上调了多次，基本上近百亿以上了。国内GPU在三、四季度会有规模更大的追加订单；同时四季度国内GPU测试结果发布、下单的催化非常密集。像沐曦的C700目前已经内测完成，四季度开始送到腾讯等各家厂商去测试，性能非常优异，基本上可以跟690，包括寒武纪950DT这些对标。壁仞也是，他们的芯片目前测下来的参数基本上接近660，跟华为的旗舰产品差不多，基本都要进入四季度送样阶段。所以四季度整个国产算力的催化非常多。像A客户27年的卡类预算，基本上6到7成给到自研芯片，出货有望持续翻倍。 然后关于一些小卡，像寒武纪昆仑芯，基本都可以；腾讯的P800基本上可以平替H20，目前基本完成他们全部自研模型的适配。天数智芯显存的性价比比较突出，也开始进入一些大型采购平台，性能认证基本上在九月底到十月初出结果。摩尔线程那边的性能还在测试，基本上是推理卡，后面他们自己也会大批量采购，因为他们视频推理的需求整体比较强。所以约束就是产能。现在交流下来，HBM对产能的限制可能远大于晶圆这块，HBM可能是约束放量的核心因素。除此之外还有2.5D封装，目前国内先进封装的产能大部分被华为锁定了。所以HBM紧张的情况基本上要到明年年中才能缓解。 基本上现在HBM的报价至少三五倍以上地涨，现货价格已经数倍于长期价格。像H公司基本上都在提价，倒逼GPU，整个产业链都在传导。因为需求非常旺，加上上游涨价，整个价格处于量价齐升的状态。今年二季度到明年上半年，基本卖的都是低价库存，所以提价可以直接增厚毛利率，传导到明年的业绩上去。这是产能方面的情况。除此之外，现在国内基本上都是用集群换单卡：海外卡受限制，国内卡的方案就是几张卡抵海外的一张卡，用集群来弥补单卡性能和架构的问题。现在单卡受限了，就放大超节点互联。 互联这边都要通过交换芯片。万卡规模情况下，交换芯片和设备的需求相较于传统组网基本提高差不多十倍，至少是GPU的三倍。所以现在头部CSP基本上都在自研交换芯片。服务器和交换机也开始分开招标了，交换机由交换机厂商提供。整体方案开始渗透到一些政企和中小客户，这一块体量比较大。所以头部交换机厂商下半年的超节点收入会有大幅提升。 后面就是云栖大会，阿里发布新一代大模型，字节后面也会启动27年的预算。十月CSP第三批超节点招标基本开始，业绩中首次能够同步体现涨价和放量。所以我们觉得要关注他们的GPU下单，包括国产的1.2T，还有光模块的放量，年底的话按N+2这样的过程。我们认为后面整个国产算力的催化还蛮多的，十月是一个比较核心的验证节点，可以看到整个行业的盈利能力是否有重要的体现。现在国产算力板块四季度是一个板块性的行情。这个利润主要来自成本端向上下游的传导，现在基本上的头部厂商都在涨价，涨价核心因素主要还是内存这一块。这是整个国产算力的大体逻辑。 除此之外，我们更新一下目前各家的大概情况。先讲华为。华为现在昇腾的总出货量，26年大概是翻了两倍以上，其中950交流下来大概是90万颗，910大概是40万颗，大概是这样一个情况。其次，27年应该规划了差不多300万颗，内部目标基本上是400到500万颗。其中950PR，26年的时候差不多75万颗左右，到27年预期提到120到130万颗，也是接近翻倍的增长。950DT差不多受产能限制比较严重，在HBM限制下，26年的预期是15万到十几万颗，27年的话占比在60%以上，主要取决于HBM的供给。910这块，910差不多40万颗，910C大概36到37万颗，加上910B等5万颗。27年910系列基本上会开始逐步退出，下一个就是960。鲲鹏CPU，26年大概是140到155万颗，其中AI占比大概25%，27年大概是200万颗，大概是这样一个情况。 核心采购客户，第一个是Z客户。Z客户整个采购以PR为主，部分是DT版，还是用H公司的卡去做PR，基本上已经上架8万卡并部署，950用来做Z公司大模型的推理和强化学习。T公司基本上是PR、DT都会下单，今年采购量15万卡。第三个是A公司，A公司自研的平头哥AI卡利用率相对一般，产品主要通过云上加一些部署来推进。H公司目前的客户是B公司，其次星球小牛研报纪要是T公司，第三是A公司，占比产品基本上都在二三成不等。核心产品就三块：950PR、950DT和下一代的960。内存这一块，950的PR是60GB的LPDDR，或者说是128GB的HBM3E，到DT版本大概会升到HBM3。下一代主要是用HBM3E。目前制程方面，950PR是N+工艺，Die Size达到400mm²，960会到6纳米，基本上用三星和SMIC那边的代工，以CoWoS配置为主。另外高零点这一块，基本上现在已经15000卡了，NPU是标配。这是H公司的情况。 第二是寒武纪。寒武纪的主要产品是MLU370、580、590，然后基本上30系列开始逐步退出历史，590现在是最主力。字节、阿里这边的需求其实非常大。涨价前，10万卡大概等于120亿收入，100万张卡等于1200亿收入；现在涨价后，规模就非常夸张了。主要用的是HBM3存储，所以整个也受到HBM的一定限制，但最近其实都在缓解，只要一缓解整个业绩就会上去。订单方面，按照新一代的经验，非常肯定是非常夸张的，主要用在Z公司的视频生成Agent，甚至大模型的推理。成本售价这块，590基本上晶圆主要是向SMIC购买的，基本上是现货，价格趋于涨停。然后HBM现在明显涨价，之前的话是HBM3两三万，原价3到4万。现在持续涨价、成倍涨价，大概是这样一个情况。所以HBM对整个成本的影响非常大。ABF载板，大尺寸的差不多4000块钱。第三块是CoWoS，CoWoS这块大概3000块钱成本，再加上GPU差不多5000块钱，正好是早期的整机成本差不多4万块钱。现在还在大幅提升，整个报价随着HBM涨价大幅提升，所以这块的售价肯定要不断顺价往上提。客户结构主要是A公司、T公司，那类公司主要拿660做一些训练，当然这样就不太行。寒武纪大概是这样情况。 然后是沐曦。沐曦26年保守有50亿以上的收入，对27年的指引，公司那边的口径也上调到200到300亿的水平。主要来自后续新平台明年订单的放量，再加上价格的增加。目前看下一代的芯片产品，主要采用GPU架构，跟海光那边的DCU差不多，理论上比较适合训练。基本上沐曦这三家的情况就给大家梳理到这里，其他的还有摩尔线程、壁仞。这些内容比较多，这次电话会议就先简单过一下各家的基本情况。我们的观点是，四季度国产算力的催化还是比较多的。寒武纪27年可能是150亿的收入，差不多是7000亿的市值。像沐曦这些，明年可能往两三百亿去做，现在基本上都是2000亿左右的市值吧？所以相比寒武纪，我觉得有很大的提升空间。所以整体来说，我们认为这些公司的业绩弹性比较好，是比较好的配置场景。今天的电话会议内容基本上就是这些，感谢各位。 以上为微调后的全文，内容基于上传的会议记录整理。 全文总结 本次电话会议围绕国产算力的最新变化展开，核心判断是：在大厂Capex上修、海外高端卡受限、HBM涨价的共同作用下，国产算力进入“量价齐升”阶段，四季度催化密集，有望形成板块性行情。以下按四个部分详细梳理。 一、核心逻辑：量价齐升，国产替代加速 需求端：大厂Capex明显上修。字节年初Capex约1700亿，现已上调至约2700亿；按七年维度保守预计增加20%、乐观增加50%，从交换机厂商订单看增幅为翻倍以上。海外高端卡（B卡）到货极慢，每月能留在国内的仅约1000台服务器，且单台价格高达1400万–1500万元（3D版本），还需组万卡集群，成本高昂，推动采购加速转向国产卡。 供给端：国产卡产能紧张，HBM是放量核心约束（限制程度大于晶圆），报价至少三五倍上涨，现货价格数倍于长期价格；2.5D先进封装产能大部分被华为锁定，HBM紧张预计持续到明年年中。 价格端：HBM涨价可顺价传导至芯片厂价，行业整体量价齐升；今年二季度至明年上半年厂商消化低价库存，提价将直接增厚毛利率并体现在明年业绩。 技术路线：单卡受限背景下，国内普遍“用集群换单卡”（多张国产卡抵一张海外卡），并放大超节点互联；万卡规模下交换芯片与设备需求约为传统组网的10倍（至少为GPU的3倍），头部CSP自研交换芯片，服务器与交换机分开招标，利好头部交换机厂商下半年超节点收入。 二、订单与催化：四季度为密集验证期 字节国产采购占比近一两年多次上调，已达百亿以上；国内GPU三、四季度存在规模更大的追加订单。 四季度催化 致美国AI融资可持续性的担忧。但美国企业的融资渠道多元化，除债权以外亦可通过股权，产业资本和减少股票回购等方式支持CAPEX。中性场景下我们估算2027年可承接美国AI企业CAPEX体量为7420亿美元。相对来看，本周德州叫停数据中心建设，甲骨文也向Project Jupiter开发商发出不可抗力通知，两个事态的发展显示数据中心将是美国中期选举前后两党博弈最重要方向之一。若民主党赢得众议院，则可能推动数据中心相关议题获得更高的国会关注，并延长项目从规划到投产的兑现周期，从而增加已形成商业承诺的Hyperscaler面临的算力交付延期风险。三季度至今，TLT跑输标普500达 10.8bps，处于2002年以来的80%分位。历史上，在股债单季回报差超过8个百分点的34个历史样本中，下一季度TLT平均上涨0.8%、18次为正。后续美债存在一定的均值回归倾向，但幅度有限、胜率仅略过半，再平衡带来的更可能是TLT的温和企稳，而非趋势性反转。相较之下，美股的动量延续在历史上更为稳定。 港股：恒生科技与恒生生物科技的跷跷板效应 2026年以来由于增量资金有限，不同行业之间轮动效应明显增强。在资金总量相对有限的情况下，恒生科技和生物科技作为弹性较高、估值对流动性较为敏感的两类成长型赛道，更容易形成此消彼长的配置关系。2025年年初至9月中旬，南向资金分别净流入恒生科技和恒生生物科技2404和792亿港元，外资分别流出1955和158亿港元，南向有效对冲了外资流出，使两个板块最终均保持净流入态势。相比之下，2026年以来南向对恒生科技和恒生生物科技的净流入分别降至约213和25亿港元，流入力度明显减弱。同期外资对恒生科技净流出720亿港元，对恒生生物科技净流入753亿港元，成为影响两个板块走势的主要资金因素。由于2026年南向资金流入相对偏弱，尤其是6月以来外资持续回流港股，主导了边际定价权。在外资持续流出恒生科技、流入生物科技的背景下，形成了前者偏弱、后者偏强的格局。整体来看，高利率环境下恒生科技和恒生生物科技指数均显著承压。在当前全球流动性趋紧的预期下，建议投资者优先关注电力、电信、公用事业等防御属性较强且分红稳定的优质行业。#文字观点", "publish_time": "2026-09-27 20:47", "tags": ["文字观点"]}, "post:2026-09-27T09-31:80ccdaa9cfb3": {"id": "post:2026-09-27T09-31:80ccdaa9cfb3", "kind": "post", "title": "2026-09-27 09:31", "source_label": "帖子正文", "excerpt": "高盛——美国市场周报：股票投资者当下正在为哪些因子支付溢价？核心宏观叙事：宏观不确定性压制仓位与宽度，隐含\"补涨\"期权 高盛美国组合策略团队（Ben Snider 等）指出，宏观不确定性已显著拖累股票投资者仓位与市场广度。", "content": "高盛——美国市场周报：股票投资者当下正在为哪些因子支付溢价？ 核心宏观叙事：宏观不确定性压制仓位与宽度，隐含\"补涨\"期权 高盛美国组合策略团队（Ben Snider 等）指出，宏观不确定性已显著拖累股票投资者仓位与市场广度。其编制的美股投资者仓位情绪指标已降至 -0.9，与3月市场底部时的读数持平；尽管对冲基金、共同基金及零售投资者综合仓位较长期历史并不算极度低迷，但若宏观背景转暖，投资者存在明确的加仓空间。与此同时，市场广度急剧恶化——标普500指数距8月中旬历史高点仅差1%，但中位成分股较其52周高点低16%，该广度指标已跌至互联网泡沫以来最低水平。高盛认为，这种极端窄化的广度意味着，一旦宏观不确定性消退，指数整体存在上行潜力，近期滞涨的\"落后者\"亦有望迎来显著的\"追赶式\"反弹。 估值：利率与盈利\"超赚\"双重挤压，远期P/E回落至10年均线 年初至今标普500回报约14%，但远期P/E已从22倍收缩至19倍，恰好等于10年均值。估值压缩的第一重驱动是利率上行——实际10年期美债收益率过去一个月飙升53个基点，突破了历史上与负回报相关的\"两个标准差限速\"。尽管P/E倍数下降，但股票风险溢价（ERP）近两年基本稳定在3%附近，标普盈利收益率与实计10年期国债收益率之间的\"收益率差\"亦保持平稳。第二重驱动是投资者对企业\"超赚\"（over-earning）的担忧： hyperscaler（超大规模云厂商）今年资本开支预计达8,000亿美元，贡献了标普500约一半的盈利增长；但随着capex增速放缓与折旧费用上升，AI投资对盈利的提振效应将逐步消退甚至转为拖累。此外，半导体供应约束带来的利润率红利及私募股权账面增值亦不可持续。 盈利质量：基于趋势盈利的CAPE处于历史极值，自由现金流收益率提供锚 当前盈利的异常强劲导致基于近期盈利的估值倍数与基于趋势盈利的估值出现巨大裂口。周期性调整市盈率（CAPE）已攀升至历史高位区间，仅次于1999-2000年科技泡沫峰值。相比之下，自由现金流收益率（FCF Yield）不受上述扭曲因素影响——当前美股FCF收益率约3.3%，低于4.4%的历史中位数，但与近几十年多数时期相当，提供了更\"干净\"的估值锚。 宏观估值模型：19倍P/E隐含ROE约22%，反映对盈利可持续性的合理怀疑 高盛的宏观P/E估值模型纳入国债收益率、通胀与ROE三个变量。当前19倍P/E较模型隐含公允价值低约10%，这一折价合理反映了市场对当前盈利水平可持续性的怀疑，但并非过度悲观。给定当前通胀与利率，19倍P/E对应的ROE约为22%——较当前实际ROE低逾200个基点，但仍是历史高位（与2021年并列最高）。换言之，市场正在为盈利均值回归定价。 行业内与因子层面：盈利解释力达数十年新高，价值因子顺风减弱 行业层面，ROE对板块估值差异的解释力已升至数十年最高水平，P/B与ROE的关系高度紧密。这一窄化特征对价值因子（Value Factor）构成逆风：高盛行业中性多空价值因子（GSMEFVAL）自2025年中以来回报超25%，但当前估值离散度收窄叠加经济接近趋势增长的预期，暗示价值因子未来跑赢空间有限。 投资者当下究竟在为什么买单？答案是：长期营收增长 横截面回归分析显示，营收增长（尤其是3年期前瞻销售增长）是当前个股估值的最重要驱动因子。当前市场特征为：投资者对3年期销售增长支付高于平均的溢价，而对1年期销售增长支付的溢价低于平均——这反映了投资者对近期盈利持续性的不确定（无论是AI投资周期带来的\"超赚\"还是AI颠覆风险），因而将定价权重更多放在长期增长前景上。 选股框架：在分析师长期增长预期分歧最大的高成长股中挖掘Alpha 高盛筛选了罗素1000中市值超50亿美元、3年销售增速预期超10%的标的，按分析师3年销售预测的标准差排序，列出预期分歧最宽（Exhibit 17）与最窄（Exhibit 18）的两组名单。分歧最宽的20只股票包括SpaceX（SPCX，3年销售增速预期72%，分歧系数0.31）、IREN、Rambus、IonQ、Rocket Lab、Bloom Energy、Semtech、Palantir（PLTR，EV/FY3销售27倍）、Tesla（TSLA）等，集中于信息技术、工业与通信服务板块；分歧最窄的20只包括Jersey Mike's Subs、Samsara（IOT）、SailPoint、Edwards Lifesciences、Zscaler、Netflix（NFLX）、Spotify（SPOT）、HubSpot（HUBS）等，估值离散度极低（分歧系数0.01-0.02），多为现金流可见度较高的SaaS与消费平台。高盛建议投资者在自身具备差异化长期增长判断的标的中积极生成Alpha。 盈利与回报预测： 高盛自上而下预测：2025年标普500 EPS 275美元（+12%），2026年375美元（+36%），2027年415美元（+11%）。年底目标价8,000点，12个月目标价8,700点（隐含约13%上行空间）。共识预期与策略师预期基本趋同。板块层面，信息技术（权重39%）贡献2026年盈利增量的60%，通信服务（+55%）与能源（+82%）亦录得高增速；但2027年通信服务与可选消费盈利预计收缩。 资金流向与情绪： 股票基金单周净流出约100亿美元，终结连续数周净流入；固收基金单周净流入174亿美元。货币基金单周增116亿美元。高盛情绪指标-0.9，处于可加仓区间。共同基金方面，大盘成长型YTD平均回报9%，65%跑赢基准；大盘价值型YTD回报13%，但仅7%跑赢基准。 跨资产与宏观预测摘要： 高盛宏观研究预测：标普500 3个月/6个月/12个月目标分别为8,000/8,300/8,700；10年期美债收益率预计从当前4.9%降至12个月4.5%；欧元/美元至1.12；美元/日元至150；黄金至5,140美元/盎司；布伦特原油至78美元/桶（当前105美元，预示大幅回调）。板块配置上，高盛给予医疗保健（Health Care）与材料（Materials）超配评级。 关键风险： 利率上行速度超预期突破\"速度限速\"触发股票重定价；AI capex周期见顶后盈利拖累幅度超预期；市场广度持续恶化引发动量因子剧烈反转；估值离散度过低导致价值因子持续跑输；宏观不确定性（财政、地缘、通胀粘性）阻碍仓位修复与落后者补涨。#文字观点", "publish_time": "2026-09-27 09:31", "tags": ["文字观点"]}, "post:2026-09-27T20-41:3bca9ac5367a": {"id": "post:2026-09-27T20-41:3bca9ac5367a", "kind": "post", "title": "2026-09-27 20:41", "source_label": "帖子正文", "excerpt": "周观点：国货备战双11，看好珀莱雅毛戈平领跑20260927🔥当前板块核心催化转向双十一前置备战，国货品牌已启动大促备货、新品投放与达人排期，多家头部美妆品牌提前锁定直播间资源，推出秋冬护肤新品与大促套装，蓄力旺季销售。大众护肤作为双十一主战场，备货积极性最高，国货性价比优势有望进一步释放。", "content": "周观点：国货备战双11，看好珀莱雅毛戈平领跑20260927🔥当前板块核心催化转向双十一前置备战，国货品牌已启动大促备货、新品投放与达人排期，多家头部美妆品牌提前锁定直播间资源，推出秋冬护肤新品与大促套装，蓄力旺季销售。大众护肤作为双十一主战场，备货积极性最高，国货性价比优势有望进一步释放。目前板块估值处于修复区间，随着大促预热开启，市场预期逐步抬升。整体看，双十一为四季度最重要的业绩验证窗口，优先关注产品矩阵完善、抖音/天猫渠道运营能力强、促销策略稳健的国货珀莱雅、毛戈平等。同时需留意促销内卷带来的毛利率压力，持续跟踪预售数据、品牌动销及行业监管政策变化。本周重点回顾： 美容护理行业26H1业绩回顾：需求韧性助力营收稳健，盈利端持续分化。化妆品板块业绩表现：营收彰显韧性，利润端分化加剧。 1️⃣在港股方面，毛戈平延续较快增长，上美股份、巨子生物阶段性承压。 2️⃣在A股方面，若羽臣维持高增长，上海家化、贝泰妮、润本股份等表现相对较好，珀莱雅业绩趋稳，润本股份等公司营收利润双高增，华熙生物、丸美生物等业绩仍处调整阶段。整体来看，板块由前期普遍增长逐步转向结构性分化，头部公司的品牌、渠道与经营效率差异进一步体现。在盈利能力方面，化妆品板块毛利率整体提升，但受投流费用高企等因素影响，销售费用率持续攀升，叠加管理效率等因素，板块整体净利率表现分化。本周新闻回顾： 联手韩妆PDRN巨头，上美要再造现象级品类。国货美妆上市公司上美股份与韩国再生医学企业 PharmaResearch 达成战略合作，将共同运营后者旗下丽驻兰化妆品，深耕中国 PDRN 再生护肤赛道。PDRN 即多聚脱氧核糖核苷酸，和人体 DNA 相似度高，具备良好修复功效，全球市场规模持续增长，国内化妆品备案数量近年大幅上涨。PharmaResearch 拥有三十余年 PDRN 技术积累，丽驻兰是韩国医美领域知名品牌。投资推荐 1⃣核心推荐：珀莱雅、毛戈平、上美股份、林清轩、上海家化 2⃣期待业绩增速边际改善的：润本股份、巨子生物、贝泰妮、丸美生物、华熙生物、四环医药、美丽田园医疗健康 3⃣电商代运营+个护自有品牌推荐：若羽臣、水羊股份、青木科技、壹网壹创#文字观点", "publish_time": "2026-09-27 20:41", "tags": ["文字观点"]}, "attachment:files/AI的下一个瓶颈是光：ECOC2026为2027年定下了什么.pdf": {"id": "attachment:files/AI的下一个瓶颈是光：ECOC2026为2027年定下了什么.pdf", "kind": "attachment", "title": "AI的下一个瓶颈是光：ECOC2026为2027年定下了什么", "source_label": "其他", "excerpt": "1、国内宏观经济与财政展望 ·8月经济运行特征分析： 8月经济整体延续外热内冷的核心格局，生产与出口边 际走强，投资处于底部震荡区间，消费增速持续放缓，内需仍是经济运行的主要 拖累。生产端内外需分化边际收敛， 8月内需型产业产出增速回升至 1.1%，较7 月的-1%明显修复", "content": "1、国内宏观经济与财政展望 ·8月经济运行特征分析： 8月经济整体延续外热内冷的核心格局，生产与出口边 际走强，投资处于底部震荡区间，消费增速持续放缓，内需仍是经济运行的主要 拖累。生产端内外需分化边际收敛， 8月内需型产业产出增速回升至 1.1%，较7 月的-1%明显修复；外需型行业增速回落至 5.1%，较7月的6.2%有所下行，K型 分化略有收窄，内需行业修复是分化收敛的核心贡献力量。投资端分化同样有所 收窄，内外需投资增速差从 7月的11.2个百分点收敛至8月的10.6个百分点， 整体仍保持外需强于内需的特征。新旧动能切换的 K型分化特征边际收敛但仍 然显著，高技术产业与整体工业生产增速差从 7月的12.4个百分点收窄至8月 的11.5个百分点，主要来自传统工业行业修复的贡献；新经济与旧经济的投资 增速差仍维持在6-7个百分点的高位区间震荡，在两新两重政策引导和产业升级 驱动下，资本开支向新兴领域倾斜的结构性趋势未发生根本性改变。整体来看 8 月经济分化程度较 7月边际收敛，但内外需分化、新旧经济分化的 K型特征仍 然非常显著。 ·后续经济走势展望：短期来看经济仍将延续总量筑底、结构分化的特征。供给 端，极端天气扰动消退、基数效应、全球半导体周期回升及产业政策支撑，将支 撑电子设备、高端装备等新动能维持高景气，但地产偏弱、部分上游原材料行业 去库存压力会对生产端形成反复扰动。 需求端， 固定资产投资仍处于探底过程中， 地产二手房市场有所改善但尚未传导至新房， 地产开发投资仍处于深度磨底阶段； 广义基建投资受资金和项目储备约束，暂未看到明显改善；消费端促销和暑期效 应完全退潮后，汽车、金银珠宝等大宗可选消费降幅进一步扩大，仅通讯器材受 换机潮支撑有一定景气支撑，居民消费意愿边际修复幅度非常有限，受消费能力 掣肘，后续消费增长动能高度依赖政策催化和收入预期。当前内需持续偏弱的现 实凸显了宏观政策加码托底的紧迫性， 但生产端和出口的边际改善对冲了部分内 需下行压力，也在一定程度上延缓了总量政策加码的判断，四季度大概率是前期 逆周期调节与总量托底政策的落地窗口期，增量政策出台概率不高，仍以存量工 具落地为主。 ·8月财政收支情况分析： 8月狭义财政收入增速出现回落，广义财政收入包含以 税收为主的第一本账和以土地财政为主的第二本账。收入端央地分化显著，中央 财政收入受外需和高端制造支撑增速仍处于高位，地方财政收入因与土地、房地 产绑定较深，相关税种下滑明显，对税基形成侵蚀，地方收入仍处于明显走弱的 状态。税收结构方面，企业所得税和个人所得税保持高增长，反映部分行业盈利 和居民收入对税收贡献较大；作为第一大税种的增值税回落，说明经济修复内生 动能仍有待巩固；消费税成为收入拖累，与消费转弱的趋势相互印证，主要受高 基数和消费需求偏弱共同影响；非税收入由负转正， 可作为逆周期调节工具对冲 税收缺口、弥补税收不足，但税收占第一本账财政收入的 70%-80%，非税收入对 冲能力相对有限。支出端狭义支出增速转负，央地支出延续分化，地方受财力偏 紧、项目储备不足、化债优先级较高、项目审核严格等因素约束，支出连续负增 长；支出结构有保有压，民生、科技支出保持相对较好增速，基建类支出整体偏 弱，延续去年底以来的运行特征。第二本账方面，土地财政降幅收窄但房企资金 链偏紧、拿地意愿偏弱的局面仍在延续，土地市场仍处于磨底状态。 ·财政政策后续展望：后续经济的温和修复仍有待财政发力，预计后续财政政策 大概率将加快专项债发行使用，优化支出结构托底经济，同时兼顾地方债务风险 的处置与防范。政策重心将从过去一两年的总量导向转向更偏结构导向，发力更 加精准，总量层面不会轻言扩张，结构层面持续调整，同时守住风险底线。后续 财政发力的核心观察窗口为政策性金融工具和专项债形成实物工作量的进度， 这 是判断财政对经济支撑力度的核心变量。 当前财政传导框架为政府发债叠加财政 收入形成可支配资金，资金落地后转化为财政支出带动财政存款下降，最终传导 至实物工作量，后续需重点关注该财政链条的后半段传导效率。叠加去年低基数 效应，四季度财政对经济的支撑作用是当前重要的观察点，下半年财政发力仍有 一定空间。 2、A股市场投资策略研判 ·市场整体走势判断：未来 1-2个季度，A股既无大涨创新高的动力，也无大跌创 新低的基础，整体呈横盘震荡格局，运行区间为 3800-4200点。其中四季度为偏 弱震荡，12月至明年一季度为偏强震荡，大级别行情窗口将在年底开启， 9-10月 即使出现反弹高度也较为有限。大涨难的核心逻辑有两点：一是短期基本面不存 在大级别上修的支撑条件；二是四季度增量资金入场难度较大，国内多数投资者 年末有结账预期，风险偏好整体呈下降趋势。大跌难的核心逻辑则是当前市场对 国际关系紧张、美债波动、美联储加息、地缘冲突等各类负面风险因素已经计价 较为充分，向下空间已经被大幅压缩。 ·市场核心矛盾拆解：当前市场核心约束来源于两大层面，一是基本面预期短期 无大级别上修动力，二是四季度增量资金供给不足。从市场结构来看，仅约 30 只存在交易结构问题的机构重仓股总市值约 10万亿，仅占A股总市值约100万 亿的十分之一，即使该类标的再下跌 20%，对整体市场的影响也十分有限，宽基 指数安全性较高。该类机构重仓股本身基本面扎实、估值已经处于偏低区间，估 值风险已经充分消化，但受当前市场微观结构受损、投资者信心不足、增量资金 缺失的约束，满仓持有的投资者实际成为潜在空头，导致其股价阶段性脱离基本 面，更多反映交易结构风险，暂难出现大幅反弹。 A股5000多家上市公司中绝 大多数不存在交易结构问题，微观结构健康，产业迭代与创新的行情将优先在该 类标的上演绎。 ·科技领域投资方向：科技板块优先推荐国产线相关标的，核心投资逻辑主要有 三点：一是政策与产业需求支撑，今年下半年国家算力网建设启动，后续北方地 区将加大算力中心建设力度，算力建设可看作新型基建范畴，将直接带动国产芯 片及上游原材料、零部件需求增长，叠加日本对国内相关供应链的断供影响，北 方华创近期披露因物料紧张导致出货减速，零部件、原材料的国产替代需求十分 迫切；二是金融条件充分，国内低利率环境下，银行、信托、城投公司均可参与 算力中心、数据中心项目建设，项目 IRR可覆盖成本，建设周期具备足够金融支 撑；三是交易结构健康，国产线相关标的股东户数未出现大幅增加，在存量资金 博弈的环境下反弹动力更足。 核心受益环节包括国产芯片、 上游零部件及原材料， 投资过程中需注意避开解禁标的。 ·其他领域投资方向：除国产科技线外，还有两大方向具备配置价值： a.黄金及安 全需求提升的战略资源品，当前美债已经不再是单一无风险资产，叠加地缘政治 冲突持续、国际关系紧张的背景，相关品种的避险属性与战略价值凸显，具备明 确配置逻辑；b.大金融及高分红板块，四季度属于增量资金不足的减量环境，机 构投资者普遍有提升组合稳定性、降低风险敞口的需求，该类标的收益确定性更 强，适合作为四季度底仓配置。当前阶段市场整体处于鸡肋行情，适合灵活账户 参与小市值标的、国产线相关标的的阶段性反弹机会，大级别行情需要等待 12 月份之后增量资金环境改善、负面风险因素充分消化后再布局。 3、跨季债市投资展望 ·9月债市走势复盘：从历史同期运行规律来看，往年 9月债市普遍跌多涨少，核 心原因是往年9月通常会出台补充政策对债市形成压制。 今年 9月债市整体呈现 上涨走势，核心驱动因素来自两方面：一是财政政策定力充足，今年地方债发行 规模减少，且多用于化债而非形成实物工作量，对贷款的带动作用偏弱，同时明 年为化债换挡之年，原有 2万亿相关额度退出，供需层面也对债市形成支撑，不 会对债市形成明显冲击；二是货币政策并非单向将资金从银行引向实体，也会配 套资金宽松政策向银行投放流动性，资金面维持宽松。今年 9月债市偏强走势反 映出市场对债市中期的乐观判断，市场普遍认为中期利率将稳定下行，因此才会 在假期前主动配置债券资产，愿意承担假期相关风险提前布局。 ·后续债市走势判断：国债期货增仓是支撑本轮债市上涨的重要外生增量买入力 量，30年国债期货TL合约09合约换12合约前持仓为25-26万手，换仓后一度 降至20万手左右，9月底持仓已经回升至 26万手，超出此前预期的 23-24万手 的水平。当前期现联动逻辑健康，期货市场增仓节奏均匀，私募做多国债期货的 对手盘为券商，券商为对冲空单会同步买入现券，目前券商仍在持续买入现券， 上涨动能已经有效传导至现货市场，并非期货端内卷推高价格。走势判断方面， 10月假期后债市上涨、利率下行的冲击力会有所减弱，大概率会因前期涨幅较 高出现情绪性回调，但回调幅度有限， TL合约上方压力位为 118.5元，下方支 撑位为116.5元，支撑位较此前有所上调。 ·跨季债市投资建议：从机构资产配置角度来看，债市资金面稳定性较强：年底权 益市场缺乏明确机会，商品价格大涨后利空因素不稳定，多空均难操作，因此固 收加产品负债端稳定， 不会出现大规模资金流出， 机构也不会大幅收缩利率敞口， 债市不存在大幅资金流失的风险 ，机构最多只会调整不同利率资产的结构，不会 整体抛售利率资产。跨季核心策略为降波但不止盈：不建议大幅止盈或者降低整 体仓位，尤其不建议减掉带票息的资产，仅可做降波操作，即换掉部分波动高、 票面利率低的资产。具体配置建议：假期前可适当将弹性资产的仓位调整至超长 利率债、高票息地方债、超长信用债、中长期信用债品种； 10月假期后如果出现 震荡、利率上行或者国债期货价格下行，都是配置 30年国债的良好机会。 4、A股主题投资机会分析 ·近期主题交易热度分析： 7月以来主题交易热度整体呈降温态势， 8月中上旬出 现一波回升后再度回落，上周较上上周热点主题交易热度无明显边际变化，维持 低位运行，日均成交额、日均换手率均延续低位水平，主题波动率收敛。周度主 题轮动效应明显， 上周表现活跃的板块包括： a.黄酒， 连续两周保持较高活跃度； b.创新药、CXO，上周中前段表现活跃，周五出现回调； c.地产相关主题，上周 整体活跃度较高； d.冰雪旅游、传媒等新方向也有不错表现。回调板块方面，受 美债利率进一步抬升影响，贵金属、 AI上游材料（如六氟化钨）、工业金属上周 出现明显回调。当前市场压制因素包括：海外流动性、地缘风险反复对 AI板块 估值形成压制；AI产业叙事存在较大分歧，处于从量变到质变的阶段；叠加假 期临近，市场成交量相对萎缩。当前策略建议延续挖掘国内算力网投资、自主化 新技术应用带来的结构性投资机会。 ·国产半导体主题逻辑：国产半导体投资逻辑清晰，政策、投资、项目落地形成三 重共振：a.政策端，7月底政治局会议后，国内算力网建设部署密集落地； b.投资 端，“十五五”期间算力网新增投资达 4万亿元，每年配套 8000亿元政策金融工 具支持，互联网大厂投资强度强劲，未来几年将维持较高投资增速； c.项目端， 相关项目落地进度明显加快， 2027年将是我国算力网建设明显加速的年份。需 求端支撑充足， 国内头部前沿大模型在推理环节开始越来越多采用国产算力生态， 国模国新逻辑下国产算力集群需求端表现强劲， 叠加地缘博弈加速卡脖子环节国 产化，进一步强化投资逻辑。重点看好两大细分方向： a.国产GPU，直接受益于 大模型大规模资产集成建设； b.先进半导体全产业链，包括半导体制造、先进封 装、关键设备环节。 ·其他主题投资逻辑：当前还看好三大投资方向，核心逻辑及受益环节如下： 1. 自主新技术主题： 核心催化为华为近期密集发布超级节点产品， 最新发布的采 用NPO技术的生成960超级点，可支持10万亿参数规模大模型的训练与推理， 国内自主新技术落地应用节奏较快，华为引领的超节点技术进展领先。全球层面 算力架构在scale up和scale out演进过程中，光互联迭代速度较快，受益环节包 括：a.超级点全产业链， 涵盖交换芯片、 交换机、 服务器； b.scale up架构下的NPO、 CPU投资机会。 2. AI for science主题：核心催化为上周诺和诺德与 Anthropic展开合作，利用AI 工具推进药物研发， AI工具可大幅缩短新药研发周期、改善研发成果、衍生新 治疗方法。当前AI应用从早前的coding逐步渗透到AI for science、金融及企业 端部署，将反向抬升 AI硬件端需求天花板预期。 3. 先进材料主题：重点关注散热材料、覆铜板、电容上游材料，以及自主化率提 升背景下的光刻材料、大硅片、掩膜板、靶材等环节。 年底阶段市场将提前预期 2027年算力投资增量，国内算力网投资确定性较强， 政策、投资、项目落地节奏形成共振，建议围绕上述方向布局。 5、全球大类资产配置展望 ·全球市场交易主线梳理： 9月18日至25日当周，全球跨资产交易主要围绕两条 核心主线展开：一是美国经济继续展现增长韧性，美联储加息预期进一步升温； 二是AI商业化及产业相关进展支撑美股大型科技股表现。 两条主线共同作用下， 市场呈现美债收益率和利率波动率明显上行的特征， 10年期美债收益率盘中最 高升至5.22%-5.23%，30年期美债收益率一度突破 5.5%， 二者均达多年来高位； 收益率曲线呈熊陡走势， 10年期与2年期美债利差走阔至 36BP，长端收益率涨 幅高于短端。同时美股并未随美债收益率上行同步走弱，海外股市与债市定价出 现明显分化。当前美国 9月综合PMI初值达58.4，处于扩张区间，制造业与服 务业均保持强劲扩张，进一步验证美国经济的增长韧性。 ·海外宏观与政策分析：美联储 9月加息落地后，市场关注点已从是否加息转向 后续还要加息几次。 9月18日至25日期间，多名美联储官员发声强调美国通胀 仍然过高，必要时将继续收紧货币政策，推升市场对美联储加息的担忧。当前美 国经济呈现企业活动强劲与居民信心低迷并存的特征：一方面 9月综合PMI初 值58.4，制造业、服务业均保持强劲扩张；另一方面密歇根大学消费者信心虽有 小幅上修，但仍低于 8月水平。美债方面，多重因素共振推动多期限美债收益率 上行：一是强劲PMI数据推升美联储加息预期，二是油价反弹加剧通胀担忧， 三是5年期、10年期美债拍卖需求相对偏弱。美元方面，受美国经济增长和利 率支撑，叠加日元、欧元疲软，美元连续 2周上涨，周涨幅约 0.8%。黄金方面， 本周整体呈震荡下行走势，美联储加息预期升温、美元上涨、美债实际收益率上 行共同压制金价，伦敦金一度跌至 4250美元/盎司附近，全周跌幅超 2%，周五 虽略有企稳但仍处于 4300美元/盎司下方；COMEX黄金库存单周下降 14.7%， 该变动为统计口径和合约制度调整影响，与市场关联度较低，短期黄金能否企稳 取决于美联储加息预期是否继续升温，以及 10年期美债实际收益率何时见底。 ·大类资产走势与配置建议：各主要大类资产走势及核心驱动因素如下： a.原油： 当周走势受地缘消息反复影响，布油与 WTI原油走势分化。周初伊朗表态若美 国减轻军事压力、解除港口封锁可 7日内重开霍尔 况如何？ 发言人答：9月中国进口原油运价综合指数较九月初上涨约80%，受地缘局势影响，VLCC运价大幅 上涨，这对相关航运公司有立竿见影的影响。 发言人问：对于中国股市和美国股市有何看法？ 未知发言人答：A股市场虽然起步较晚，但在过去几年中已取得显著进步，并且拥有许多优秀的上市 公司。投资者应基于自身能力范围选择适合的投资策略，并随着经验和知识的增长逐步寻找市场机遇。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-09-27T13-45:c4c9c04867aa": {"id": "post:2026-09-27T13-45:c4c9c04867aa", "kind": "post", "title": "2026-09-27 13:45", "source_label": "帖子正文", "excerpt": "ECOC总结： 一、总基调：方向一致，节奏和架构分裂 ● 方向没分歧：AI 数据中心需要更高带宽、更低功耗、光进铜退。● 节奏有分歧：800G 还在放量，1.6T 上量，3.2T/448G/lane 预研", "content": "ECOC总结： 一、总基调：方向一致，节奏和架构分裂 ● 方向没分歧：AI 数据中心需要更高带宽、更低功耗、光进铜退。 ● 节奏有分歧：800G 还在放量，1.6T 上量，3.2T/448G/lane 预研；NPO/CPO 不是“要不要”，而是“哪家云厂、哪款交换机、哪一年”。 ● 技术表现喜忧参半：部分 1.6T DSP/光引擎/硅光链路跑通，部分 NPO 散热、外置光源、可靠性、测试良率还没闭环。 二、客户路线图分化 ● 超大规模云厂：有的继续堆可插拔（800G/1.6T），把 CPO 推到 2028； ● 有的先上 NPO 做过渡，把激光器/驱动器/TIA 放交换机外或近封装； ● 英伟达、Broadcom、Marvell、Cisco/Acacia、Lumentum、Coherent、MACOM 各自生态不同，标准阵营（Open CPX / XPO / OIF / CPO MSA）互相咬。 三、技术/部件层面的“喜忧参半” ● 喜： ● 1.6T 可插拔价格下行但放量确定（800G ~$400，1.6T ≤$1000 这类口径） ● MACOM 的 TIA/Driver 在 NPO 里内容量显著提升（SMTC/MACOM 逻辑） ● Lumentum OCS、Coherent 激光器/材料、Tower 硅光代工、Soitec 光子 SOI 受关注 ● 忧： ● CPO 大规模量产推迟到 2028 甚至更晚 ● 外置激光源、液冷/散热、光口可维护性、交换机 ASIC 与光引擎协同仍是工程坑 ● 激光器与 DSP 产能是瓶颈，不是需求 四、对“半导体与半导体设备”的含义 ● 光通信把 模拟 RF、InP/GaAs/硅光、DSP、SerDes、测试测量、特色代工 拉进 AI 资本开支链； ● 传统 WFE（光刻/刻蚀/薄膜）逻辑还在，但 AI 光互联新增了： ● 硅光/异质集成 ● 高速光电驱动 ● 光器件封测 ● 光子特色工艺（Tower、Soitec、AMS Osram micro-VCSEL 等） ● 巴克莱偏好：能吃到“可插拔延长窗口 + NPO 内容量提升”的部件/代工，而不是单纯赌 CPO 一步到位。 五、一句话总结 ECOC 2026 给美国半导体的信号是：AI 光互连是真超级周期，但可插拔没死、NPO 是过渡、CPO 推迟、标准未定、产能和工程能力比“路线图PPT”更重要。#文字观点", "publish_time": "2026-09-27 13:45", "tags": ["文字观点"]}, "post:2026-09-27T17-20:c3f136eef833": {"id": "post:2026-09-27T17-20:c3f136eef833", "kind": "post", "title": "2026-09-27 17:20", "source_label": "帖子正文", "excerpt": "汇报4❗️【天风电新】陶瓷基板更新｜服务器市场空间再增加-0927 ——————————— 第一， 从应用范围看，除我们一直强调的服务器内陶瓷基板应用于HBM TEC、CPO交换机 TEC（外置光源处）、PCB内嵌陶瓷基板（计算板中），#新增CPO交换机光引擎及下一代正交背板中应用。第二，我们再次强", "content": "汇报4❗️【天风电新】陶瓷基板更新｜服务器市场空间再增加-0927 ——————————— 第一， 从应用范围看，除我们一直强调的服务器内陶瓷基板应用于HBM TEC、CPO交换机 TEC（外置光源处）、PCB内嵌陶瓷基板（计算板中），#新增CPO交换机光引擎及下一代正交背板中应用。 第二，我们再次强调行业景气度极高，从粉体【旭光】到金属化【富乐德】【国瓷】均稼动率拉满，翻倍以上规模扩产，其中最新指引❗️#phononic27年对【国瓷】最低需求指引220w片，对应20+e营收规模。 ⭐CPO交换机 ✅光引擎TEC用于稳定硅光PIC和探测器温度，压制波长漂移，消除与FAU的温差，规避热膨胀导致的耦合偏移。产品形态为Micro-TEC，#CPOTEC长期暴露在ASIC高散热的周围，温控要求为±0.1℃，且封装要求厚度极薄，因此价值量极高。 以NVIDIA Quantum-X800举例，1.6T交换机配置72个光引擎，对应72颗TEC，单颗TEC量产后价格为60美金，以50%毛利率40%BOM成本假设，单颗陶瓷基板12美金，对应单台CPO交换机价值量达864美元。 ✅ELS外置光源模块TEC要求波长稳定性高、单个ELS可同时为多个光引擎供光，寿命要求高。 以NVIDIA Quantum-X800举例，1.6T CPO交换机对应18个模块，单模块UHP版本采用2套TEC+2块光源基板，单价值量为123+69美元，以TEC 50%毛利率40%BOM成本假设，对应单模块陶瓷基板94美元，对应单台CPO交换机价值量达1689美元。 以上合计CPO交换机陶瓷基板总价值量2553美元，1.8w左右人民币。假设27/28年CPO交换机10/40w，单台价值量1.8w/1.6w，则对应市场空间18/64e，增速达3.5倍。 ⭐正交背板 当前#NV在积极试验正交背板中氮化硅陶瓷基板的使用，核心作用是氮化硅陶瓷基板起到骨架的作用，防止PCB板因温度升高导致的卷翘问题。 球硅+陶瓷基板可以看作整体的解决方案，未来正交背板大概率使用PTFE方案，硅微粉（二氧化硅）添加比例达60%+，#添加硅微粉后的树脂与氮化硅陶瓷基板的热膨胀系数更加接近，既能够保持pcb的状态又可以减少分层等问题。 仅考虑计算板中添加陶瓷基板市场空间27/28年32/189亿元，正交背板需求有望带动市场空间翻倍增长。 投资建议 1、推荐绑定TEC全球龙头的【国瓷材料】、【科创新源】、【富乐德】。 2、推荐PCB-陶瓷基板进展最快的【科翔股份】，其次【泰金-胜宏科技】。 3、光模块先发优势明显【中瓷电子】以及新进一体化【旭光电子】。#文字观点", "publish_time": "2026-09-27 17:20", "tags": ["CPO", "文字观点"]}, "post:2026-09-27T22-17:c3d91dce5f55": {"id": "post:2026-09-27T22-17:c3d91dce5f55", "kind": "post", "title": "2026-09-27 22:17", "source_label": "帖子正文", "excerpt": "【东财通信】美提案影响有限，板块有望回归产业升级+业绩兑现9月25日，美国四名两党参议员联名提出《保护国家安全系统免受中国光模块影响法案》，点名中际旭创、新易盛，并将其固件、组件纳入穿透条款。其约束范围限于联邦政府''国家安全系统''采购，且设有五年过渡期，找不到替代来源可逐笔申请豁免。", "content": "【东财通信】美提案影响有限，板块有望回归产业升级+业绩兑现9月25日，美国四名两党参议员联名提出《保护国家安全系统免受中国光模块影响法案》，点名中际旭创、新易盛，并将其固件、组件纳入穿透条款。其约束范围限于联邦政府''国家安全系统''采购，且设有五年过渡期，找不到替代来源可逐笔申请豁免。整体来看，该提案属于联邦采购层面的窄口径限制，不涉及商业市场销售禁令。从立法进程看，提案落地存在较大不确定性。国会提案多止步于委员会环节，参议院还需60票方可终结辩论，目前仅四人联署，推动力度有限；叠加10月初休会、中期选举及跛脚鸭会期的时间约束，以及ITIC等产业界反对、美国本土厂商有技术无规模难以承接供应，综合判断本届会期内大概率停滞失效，或留待下届改搭国防授权法的便车。从中际旭创、新易盛的收入结构看，两家公司主要收入来自海外云服务商的AI算力建设，政府订单占比极低，军规级采购与云厂商的商用光模块分属两个市场，本次提案对两家公司经营层面的实质影响预计有限。我们认为，周一板块可能受到情绪层面扰动，但参考此前FCC相关事件的影响进程，市场对这类信息已有所消化、逐步脱敏，后续仍将以产业趋势为 B两类板卡，两款板卡的结构工艺、材料 等级有哪些具体特点？ A：谷歌TPU v7项目配套的OAM与UBB板卡，均采用高多层板的工艺结构设 计，整体工艺方案中不涉及 HDI技术，贴合谷歌高端服务器 PCB的工艺迭代方 向。虽然OAM板卡与UBB板卡在整体层数、内部结构布局上存在一定差异， 但两款板卡所采用的核心基材材料等级保持一致， 用料标准统一， 保障了 TPU v7 整机的性能稳定性与一致性。 Q：对比谷歌TPU v7版本，全新的TPU v8板卡在结构设计、基材材料选用上 有哪些核心升级与变化？ A：谷歌TPU v8板卡相较于v7版本，材料分层选用更加精细化、高端化，针对 性区分信号层与电源层用料。其中核心信号层全面升级采用 M8等级高端材料， 电源层则搭配稳定性更强的 M7等级材料。整体板卡为 24层结构设计，内部核 心层采用M8与M6等级材料混合搭配的方案，主要适配信号层下方配套电源层 的硬件结构设计需求，实现性能与稳定性的双重提升。 Q：谷歌TPU v7、v8、v9三代产品的量产落地、市场推出的具体时间节点分别 是什么？ A：谷歌三代TPU芯片产品的迭代落地节奏明确、时间节点清晰。其中 TPU v7 版本技术最为成熟，已于 2024年正式实现规模化量产；迭代升级的 TPU v8版 本，在完成前期研发、测试验证后，于 2026年4月正式开启产能上量、批量供 货；全新一代的TPU v9产品目前仍处于研发打磨阶段，行业预计将在 2027年 下半年正式推出落地。 Q：谷歌TPU v8项目的核心PCB供应商包含哪些企业，胜宏科技具体切入该供 应链的时间与供货背景是什么？ A：谷歌TPU v8项目的主力PCB供应商主要为TTM和沪电两大头部企业。胜 宏科技从2025年开始提前布局谷歌 v8供应链体系， 核心依托台光品牌的基材材 料切入供货体系。受松下整体产能紧张、供货不足的影响，谷歌开始拓展台光作 为备选核心材料供应商， 胜宏科技主打推广台光材料， 借此顺利进入谷歌供应链， 并且在2025年下半年正式产生实际出货量，实现批量供货。 Q： 在谷歌PCB供应链的松下材料体系中， 沪电、 TTM的订单份额分别是多少， 深南电路是否属于核心供应商？ A：在谷歌采用的松下材料供应链体系内，沪电占据的订单份额大约维持在 30% 左右。TTM作为核心老牌供应商，整体订单占比显著更高，是 v8项目的主力供 货企业。而深南电路并未进入谷歌 TPU系列核心供应链体系，不属于谷歌 AI服 务器PCB的主要供应商，基本未参与 v7、v8核心项目的供货配套。 Q：谷歌现阶段的AI服务器主板，工艺设计上是否采用了 HDI技术，整体工艺 发展趋势是什么？ A： 目前谷歌所有在研、 量产的 AI服务器主板项目， 均没有采用 HDI工艺技术， 彻底摒弃了传统的 HDI设计方案。现阶段谷歌高端服务器 PCB的核心工艺发展 趋势十分明确， 持续聚焦高多层板结构设计， 通过提升板材层数、 优化分层结构， 适配高端AI服务器高算力、高传输、高稳定性的运行需求，成为其硬件迭代的 核心工艺方向。 Q：谷歌服务器机柜配套的交换机板卡，在基材材料等级选用上有哪些具体标准？ A：谷歌服务器机柜搭载的交换机板卡，采用分层差异化的材料选用方案，适配 不同电路模块的性能需求。其中负责信号传输的核心信号层，统一采用高端 M8 等级基材材料，保障高速信号传输的稳定性与速率。而负责供电的电源层则采用 混合用料模式，搭配 M6等级基材以及常规的 FR-4基础材料，在保障供电稳定 的同时，合理控制整体生产成本。 Q：谷歌项目所用的 M8等级基材，配套的玻璃纤维布与铜箔分别采用第几代规 格？ A：适配谷歌项目的 M8等级高端基材，在核心辅料选材上采用双规格并存的模 式。玻璃纤维布同时搭载一代 Low DK规格与二代规格产品，两种规格同步配套 使用。在铜箔选材方面， M8基材统一配套HVLP3等级的三代铜箔，该规格铜 箔稳定性、适配性完全匹配谷歌高端 PCB的生产与使用标准，是现阶段量产高 端板材的核心用料。 Q：行业M9等级基材目前的量产进度如何，对应的核心技术规格、铜箔选用标 准是什么？ A：更高端的M9等级基材目前尚未实现正式规模化量产，整体处于面向各行业 头部客户送样打样、测试验证的阶段，暂未形成商用落地。在技术规格上， M9 基材完成全面升级，配套的铜箔规格迭代升级为四代铜，相较于 M8所用的三代 铜箔，性能指标进一步提升，将适配下一代高端 AI服务器TPU v9产品的生产 需求。 Q：谷歌目前商用的 CCL基材方案中，铜箔最高迭代到第几代，是否已导入四 代铜箔？ A： 谷歌现阶段所有已经落地商用的 CCL覆铜板方案， 无论采用的是松下基材体 系还是EMC基材体系，核心配套的铜箔规格最高仅迭代至三代铜箔，也就是 HVLP3等级铜箔。截至目前，谷歌所有量产 TPU项目均未导入四代铜箔材料， 四代铜箔仅适配未量产的 M9高端基材，暂无规模化商用场景。 Q：一张常规双面CCL覆铜板，整体的铜消耗用量大概为多少，测算标准是什 么？ A：行业内可通过标准化规格精准测算铜消耗量，以常规采用 18微米（1/2oz） 铜箔制作的双面CCL覆铜板为标准样本，单张成品板材整体的铜消耗用量大约 在200克至210克区间，该测算数据为行业通用标准，可作为常规双面板铜材采 购、成本核算的核心参考依据。 Q：2026年1月至8月HVLP3三代铜箔的月均采购量是多少，近期采购趋势及 单月峰值如何？ A：统计2026年1月至8月的整体采购数据，企业 HVLP3三代铜箔的月均采购 量稳定在90吨。从整体趋势来看， HVLP3铜箔的采购量呈现持续稳步上行的增 长态势，市场需求持续扩张。其中近期单月采购量达到阶段性峰值，最新一个月 的采购规模已提升至 110吨，需求增长趋势明确。 Q：HVLP3三代铜箔的核心供应商有哪些，各供应商采购占比、产品品质是否 存在差异？ A：目前HVLP3三代铜箔的核心供货厂商共有三家，分别为日本福田、卢森堡、 德福。现阶段德福是企业最核心的铜箔供应商，整体采购量占比达到 60%。企业 早期主要采购日本福田的铜箔产品， 德福产品则是在 2026年正式导入采购体系。 三家供应商的产品均经过严格资质评估与测试验证， 适配 M8等级高端板材生产， 整体产品品质与初代日本福田标杆产品保持同一水准，无明显品质差距。 Q：企业暂未采购三井三代铜箔的核心原因是什么？ A：企业未采购三井的三代铜箔主要有两大核心原因。一方面企业早期已完成日 本福田铜箔产品的资质认证与供应链导入，供应链体系成熟稳定，无需更换供应 商。 另一方面三井旗下三代铜箔产品在市场价格上不具备竞争优势， 性价比偏低。 同时当前高端铜箔行业整体产能普遍紧张， 现有成熟供应商产能已基本满足生产 需求，无需新增采购三井产品。 Q：除谷歌之外，还有哪些头部客户使用三代铜箔，四代铜箔目前的实际应用场 景是什么？ A：除核心客户谷歌外，亚马逊以及国内部分 CSP头部云服务商，现阶段高端 PCB用料最高同样仅使用到三代铜箔， 暂无四代铜箔商用案例。 目前四代铜箔的 应用场景高度单一， 仅配套尚未量产的 M9等级高端基材， 暂无规模化落地场景。 同时非松下供应链体系的客户，例如英伟达 M8系列产品，在基材与铜箔的选型 标准上与谷歌体系存在一定差异。 Q：企业现阶段亚马逊业务的合作现状如何，亚马逊当前核心 CCL供应商是哪 些？ A：受高端板材整体产能紧张的影响，企业现阶段优先保障核心客户谷歌的订单 供货，产能资源全面向谷歌倾斜。过去半年时间内，企业主动推掉了亚马逊的大 部分合作订单，目前亚马逊业务的整体合作份额已经大幅缩减、占比极低。当前 亚马逊CCL覆铜板的核心供应商主要为 EMC与台耀两大厂商，基本替代了原 有供货体系。 Q：亚马逊Trainium 3（T3）项目OAM、UBB板卡的层数、材料等级分别是什 么，企业是否参与供货？ A： 亚马逊Trainium 3（T3） 项目的UBB板卡采用26层结构设计， 基材选用 EMC 的892K等级材料（即M8等级），配套HVLP4铜箔，该板块企业未参与供货。 T3项目的OAM板卡为24层结构，采用M6等级基材，企业在该板块拥有部分 供货份额。T3项目OAM板卡的CCL供应商包含松下、台光、生益，其中生益 的M6等级基材已成功导入该项目供应链，企业目前主要供货亚马逊 Trainium 2 （T2）系列产品。 Q：德福供应的三代铜箔价格区间是多少，近期价格走势有何变化，不同规格价 格差异如何？ A：德福三代HVLP3铜箔以行业通用的 18微米规格为例，市场单价区间维持在 每公斤24至25美金。从近期市场走势来看，高端三代铜箔资源持续紧张，价格 呈现逐月上涨的态势，涨价趋势稳定。在不同规格产品中， 12微米规格的三代铜 箔产品价格最高，在所有规格中溢价最为明显，整体价格梯度随规格迭代呈现差 异化走势。 Q：德福、日本福田、卢森堡三家三代铜箔供应商的产品价格差异具体有多大？ A：三家主流供应商的三代铜箔产品存在明确的价格梯队差异，以德福产品价格 为基准，卢森堡品牌的铜箔产品定价最高，整体价格比德福高出约 30%；日本福 田的进口铜箔产品价格次之，比德福国产铜箔价格高出约 10%。整体呈现卢森堡 ＞日本福田＞德福的价格格局，而德福在品质对标进口产品的同时，具备显著的 价格优势。 Q：当前三代HVLP3铜箔的整体市场供应格局如何，是否存在供给紧张问题？ A：目前三代HVLP3铜箔的行业整体供应状态持续偏紧，供需缺口较为明显。 核心原因是能够稳定量产、 且产品品质达标适配高端 AI服务器PCB生产的厂商 数量较少，国内具备规模化供货能力的优质厂商尤为稀缺。叠加下游谷歌、亚马 逊等头部客户需求持续放量，行业产能爬坡速度跟不上需求增长，导致高端三代 铜箔长期处于供不应求的状态。 Q：谷歌下一代TPU v9产品的预计推出时间、核心材料等级方案分别是什么？ A：结合当前行业供应链的研发与迭代进度，谷歌下一代 TPU v9产品预计将在 2027年第三季度正式推出。在核心用料方案上， TPU v9完成全面升级，不再沿 用v7、v8的M6、M7、M8混搭方案，确定采用全新的 M9等级基材搭配M7等 级基材的组合方案， 配套四代铜箔用料， 整体性能相较于前代产品实现大幅升级。", "status": "extracted"}, "attachment:files/大模型观点更新.docx": {"id": "attachment:files/大模型观点更新.docx", "kind": "attachment", "title": "大模型观点更新", "source_label": "其他", "excerpt": "中秋电话会：大模型观点更新 今天由我向各位领导汇报我们关于大模型板块的相关观点。当前市场上大模型发展迅速，今天主要以科普的形式，为大家讲解大模型的研究体系。", "content": "中秋电话会：大模型观点更新 今天由我向各位领导汇报我们关于大模型板块的相关观点。当前市场上大模型发展迅速，今天主要以科普的形式，为大家讲解大模型的研究体系。 大模型主要分为三块。第一块，大模型是AI产业的通用智能底座，技术演进推动能力边界持续拓展。当前大模型是深度学习规模化发展的核心产物，依托超大规模参数与海量数据训练，实现了通用智能能力的突破，推动人工智能从单一的专用任务工具向通用问题求解系统升级。行业历经统计学习、深度学习、Transformer预训练范式确立、规模驱动能力涌现等阶段，目前正向着多模态感知、复杂推理、智能体执行、端侧部署等核心方向持续进阶，能力范围也从单文本交互延伸至多模态融合理解、逻辑推理、闭环任务执行与全终端适配，应用前景广阔。 第二块是全链路技术体系迭代，架构、训练、推理全栈优化突破效率瓶颈。Transformer架构凭借全局并行建模与长程依赖捕捉能力，奠定了现代大模型的技术根基。预训练环节从粗放式参数规模扩张转向精细化、效率化，数据工程成为核心壁垒；混合专家架构、百万级长上下文训练、多模态统一训练等训练技术持续突破；算法、工程、架构、硬件四维全栈优化，推动训练算力效率持续提升。后训练完成从技术能力到可用能力的关键跃迁，逐步从指令微调、对齐强化向智能体适配、安全合规全维度升级，成为基础能力向工业价值转化的核心载体。算子优化、显存调度、量化压缩与端云协同架构等多维度降本提效，为大模型工程化落地提供了效能支撑。 第三块是垂直场景应用加速，技术下沉驱动产业价值逐步兑现。通用技术能力的可复用性决定了大模型的产业落地宽度，行业专属场景的适配性则决定价值兑现的深度。当前大模型正经历从技术概念验证到规模化试点落地的周期跨越，在AI编程、金融、制造、医疗等高价值赛道持续实现商业化进展。AI编程工具实现用户规模与企业付费双轮驱动的增长，成为商业化落地最快的垂直赛道；金融行业落地则从前台交互到中后台运营全链路渗透，落地节奏较为明显。随着智能体、多模态、端侧化等技术的持续突破，大模型或将从单点效率工具向全局优化系统升级，产业价值兑现节奏有望持续加速。下面我们具体来看每个环节的内容。 第一块，大模型依托通用智能能力覆盖多元化的应用场景。目前大模型是人工智能发展中最具代表性的技术形态之一，按照处理的模态可分为语言大模型、视觉大模型、音频大模型以及多模态大模型。语言大模型以自然语言理解和生成为核心，以GPT、DeepSeek为代表，广泛应用于对话、创作、代码与知识检索等场景；视觉大模型聚焦图像与视频的处理、分割和生成，以SAM、Stable Diffusion为代表；多模态大模型通过统一架构融合文本、图像、语音等信息，当前以GPT-4、Gemini为标杆。大模型的通用技术能力是其区别于单点AI工具的核心标志。自然语言理解和处理是实现人机自然交互的核心能力，本质是对自然语言的深度理解与灵活运用，覆盖词法分析、句法分析、语义分析、语用推理全链路，可精准识别文本中的实体、关系、情感与意图。 多模态感知是模拟人类多感官认知机制，让AI同时处理并融合文本、图像、音频、视频、三维空间等多模态信息的能力。内容生成是AI基于海量数据学习的规律与范式，按需生成结构化、高质量原创内容的核心能力，覆盖文本、图像、音频、视频、代码、工业设计稿等多元形态。记忆机制是AI存储、检索、运用信息并维持交互连续性的底层支撑能力。逻辑推理规划是AI从感知记忆迈向认知决策的核心能力，基于已知信息开展演绎、归纳、因果等多类型推理，并拆解复杂目标、制定可执行的路径。工具调用与行动是AI突破自身能力边界、连接现实世界以执行任务的核心能力。安全对齐是保障人工智能合规、可控、正向应用的底线能力，确保AI的行为和输出符合人类价值观与法规伦理规范。 大模型的通用技术能力与可复用性，决定了大模型的产业落地宽度；行业专属场景的适配性，则决定了大模型价值兑现的深度。其中，AI编程工具是大模型赋能应用开发者生产力的规模化落地标杆，也是大模型垂直应用中商业化路径最成熟、用户付费意愿最强的赛道。GitHub Copilot联合OpenAI打造了全球商业化规模领先的IDE内AI编程体系，截至2026年初，付费用户已达470万，同比增长75%。Cursor是Anysphere推出的AI原生独立代码编辑器，ARR从2024年的1亿美元飙升至2026年2月的20亿美元。目前，AI编程工具已实现用户规模与企业付费的双轮快速增长，伴随行业大模型能力提升，上下文长度瓶颈也在持续突破。金融行业则是大模型垂直应用中核心高价值场景落地的验证标杆。 微软作为全球领先的大模型厂商，于2025年7月正式推出金融AI助手，这是其首款面向特定行业的定制服务，帮助从业人士构建审计、风险调查、财务分析模型，实现投资机会识别与投研人员能力提升。2025年Copilot for Finance完成第二次更新，新增Excel插件、数据连接器和预置的Agent Skills，以更适配金融工作场景。2025年5月，Symphony发布了面向金融服务的多款AI Agent。作为摩根大通、高盛、花旗等金融机构的AI供应商，Symphony的客户结构已向金融行业倾斜，据公司披露，前五大客户中有超过40%来自金融行业，目前金融服务已成为其第二大营收来源，仅次于科技行业。 除金融行业外，制造、医药等行业未来有望成为非常大的应用场景。其中医疗行业对技术的容错率要求较低，技术方案必须达到医学级精度，这也决定了大模型在医药行业的应用必须遵循合规优先、价值落地、风险可控的原则。2026年7月，医渡科技发布了新一代医疗大模型，带来全新升级的导诊AI，基于1000亿医学数据及OPD多科室专家融合机制，实现了从轻量问诊到复杂计算服务的能力。 第二部分，我们主要讲解Transformer架构。Transformer架构是现代通用大模型演进的核心根基，是一种基于自注意力机制的深度学习模型架构，目前是人工智能领域的底层核心架构。2017年，Google研究团队在其经典论文《Attention Is All You Need》中首次提出Transformer深度学习架构，用于优化机器翻译等序列转换任务，解决了循环神经网络与卷积神经网络主流架构的固有缺陷。Transformer架构以注意力机制为核心，不仅突破了长程依赖建模的瓶颈，更从根本上释放了并行计算潜力，标志着序列建模范式从循环神经网络向注意力机制的根本性转移。 注意力机制是Transformer架构的核心创新，通过计算序列内部任意两个Token之间的关联权重，实现全局语境信息的动态聚合。具体而言，模型将输入向量映射为查询（Query）、键（Key）、值（Value）三个矩阵，通过缩放点积注意力计算：将Query与Key进行矩阵乘法并做尺度缩放，经Softmax函数归一化得到反映各Token相关性的注意力权重，再对Value矩阵进行加权求和。Transformer的整体架构由编码器和解码器两个模块对称构建：编码器由N个相同的层串联而成，每层包含一个多头自注意力子层和一个全连接前馈神经网络；解码器同样由N个相同的层堆叠，并在编码器基础上增加了交叉注意力层。得益于卓越的长程建模能力，Transformer已成为大模型产业的核心技术，其编码器—解码器范式及自注意力思想深刻影响了GPT等主流模型的设计路线。Transformer架构的提出不仅革新了序列建模的底层范式，更催生了Encoder-Decoder、Encoder-Only、Decoder-Only三条差异化的技术路线。在下游应用中，Decoder-Only展现出最突出的规模扩展性和通用性能：该架构摒弃编码器模块，仅保留解码器堆叠，通过三角因果掩码确保每个Token仅能关注历史信息，以极简结构实现高效的自回归文本生成。 2018年，OpenAI基于该架构提出GPT，首次在大规模无标注语料上验证了生成式预训练的有效性，确立了预训练+微调范式；同年，Google推出了基于Encoder-Only架构的BERT。从GPT-1/2/3到后续千亿参数模型，表明Decoder-Only架构不仅是生成式AI的核心，更是驱动大模型从实验室走向规模化商业的关键。伴随大模型技术的深入发展，预训练的全链路效率决定了大模型的能力上限。预训练底层技术框架定义了大模型的通用能力基础，架构与训练机制分别构成预训练体系的骨架与动能，决定模型的能力上限和训练成本。目前Transformer架构仍是当下训练的绝对主流。 现在单一架构难以满足从训练到推理的全链路需求，混合架构成为架构选型的主要方式。当前千亿参数以上的旗舰模型主流配置为Transformer+MoE，通过稀疏激活以较低算力扩充模型容量，突破参数扩张带来的算力瓶颈。例如DeepSeek V3以671B总参数、37B激活参数，实现了与同等规模闭源模型相当的性能水平。具体而言：通用高质量生成以Decoder-Only纯稠密架构为主流选择，多任务超大容量场景采用MoE稀疏架构，端侧低延迟部署则采用Transformer混合架构。 训练演进的主线是从单一任务、长周期、粗放式训练，转向多任务混合、动态自适应的精细化设计。Next Token预测是目前所有生成式预训练模型的核心任务，其本质是自回归语言建模。训练过程普遍拆分为热身、稳定、衰减三个阶段，并依托分布式框架与混合精度加速训练。其中，数据工程是预训练竞争的核心壁垒：它将原始数据处理为标准化训练语料，起点是平衡覆盖率、质量与合规性的多元数据。预训练过程的本质，是将来源各异、质量参差的原始数据加工为质量分层明确、领域配比平衡、去重彻底的标准语料库，并实现各环节闭环监控。数据环节以Common Crawl开放网页数据为基础来源，格式统一与去重是清洗的基础环节，决定后续处理的效率与样本有效性；噪声过滤与质量打分构成语料质量控制的核心手段，筛选标准已从规则判断升级为语义级量化评估。 去重、脱敏和分层存储是语料合规性与可用性的最终保障，是数据处理不可省略的强制性环节。数据配比决定语料库的知识结构上限，其方法已从人工经验演进为数据驱动的优化。数据处理能力之所以成为预训练的核心壁垒，根本原因在于算力平台与数据引擎对大模型算力转化的影响。 国内外在预训练语料上的差距，首先体现在语料总量与高质量语料来源的匮乏上，这意味着国内模型在有限的语料空间下，可用于训练的有效数据受到制约。预训练以提升效率为核心目标，通过全栈优化突破成本约束。 目前预训练成本优化的核心目标，在于提升训练效率、压缩单位Token的训练成本。算法、工程、架构、硬件四维协同是工程化降本的关键，其中算法优化以高效率为核心主线，并配套数值量化、加速优化等辅助手段。混合线性注意力等是原生算法层面的结构性创新，通过注意力机制的改进，从根本上去除冗余、降低计算复杂度。 数据并行是工程化程度最高、应用最广泛、最成熟的系统运行方案，也是绝大多数大模型训练集群采用的标准技术。其原理是将完整的模型权重、优化器状态与梯度缓存复制到每张卡上；训练时将全局批次数据切分为与卡数量等量的子批次，各卡独立完成前向计算与梯度反向传播，计算完成后通过AllReduce等通信算子同步全局梯度，再基于一致的全局梯度独立更新模型参数，从而保证各卡模型参数始终保持一致。其次就是流水线并行与张量并行。 计算卡是大模型预训练的核心载体，其规格水平决定了算力上限与训练成本极限，核心参数围绕算力密度、显存容量、带宽、数值精度支持等维度展开。当前工业界训练机型普遍采用支持FP8张量核心的高端加速卡，可在保证训练精度的同时，相比BF16混合精度将算力密度提升一倍。算子融合优化是依托GPU硬件架构特性进行的适配优化，也是硬件适配维度下单位算力收益显著的优化手段。 多维度技术评估可全面量化预训练模型的训练效果与技术能力。当前AI行业已广泛采用多维度评测基准与评估框架，从核心能力层面对预训练模型开展全面的量化评估。 当前多项技术突破持续推动大模型训练能力边界不断拓展。第一个是万亿参数MoE训练：它是当前大模型突破纯稠密架构算力约束、实现技术能力领先的核心技术。随着大模型能力提升，对参数规模的需求持续增长，传统稠密架构面临算力成本随参数规模线性增长的难题，MoE专家架构通过稀疏激活机制，打破了算力与参数规模之间的强耦合关系。MoE训练的核心运行机制，是通过门控网络实现数据与专家的动态匹配，在参数规模大幅扩容的同时，维持训练与推理的高效性。根据Google Switch Transformer等研究，MoE架构模型相比同等规模的稠密模型，仅增加少量开销即可大幅提升训练效率。其核心在于前向传播中每个Token仅由少数专家处理，不需要全量专家参与，从而节省网络与算力资源。目前，万亿参数级MoE训练已完成核心验证，并在头部厂商范围内进入规模化应用阶段，成为全球头部大模型厂商构筑技术壁垒的核心抓手。 海外Google、DeepMind等厂商的超大规模旗舰模型不仅采用MoE架构持续扩容，MiniMax、零一万物等厂商的新一代旗舰模型也均依托万亿级MoE训练实现能力跃升。其中，最新V3系列模型采用迭代升级的架构，形成旗舰版与轻量化产品的分层布局；另有部分新模型以稀疏激活MoE为核心技术，在统一架构上实现了多模态训练与推理的一体化。 超长上下文模型是拓展长程依赖建模能力、支持长链路复杂场景的核心技术演进方向。百万级Token的超长上下文训练已成为头部企业模型的核心技术，并在头部厂商范围内进入工程化应用阶段，是头部模型构筑能力产业化优势的重要基础。其次是多模态统一预训练，它打破了单模态能力边界，是推动大模型向多模态通用智能演进的核心技术。目前多模态预训练已完成从早期多模态融合到统一架构的演进，头部厂商主推的方案依托统一框架实现跨模态融合建模。 下一步是关于大模型硬件的专题。整个大模型预训练依赖于多维度的硬件体系支持，这一部分我们后续放在GPU与CPU专题中详细讲解。 大模型后训练完成从基础能力到可用能力的关键跃迁，决定模型如何完成具体任务。与预训练学习通用知识不同，目前头部大模型厂商的后训练路径呈现差异化分化。后训练主要从指令对齐、推理与理解能力强化、Agent执行与安全迭代等层面分层推进。推理模型成熟、Agent场景落地路径与测评体系完善三重因素共振，推动后训练从输出结果优化向全链路行为塑造升级。后训练范式的升级推动了数据产业的价值逻辑重构，核心要素已从单纯的样本规模，转向任务设计、平台规则与训练环境的体系化能力。 下一块是关于推理环节，主要包括几点。第一，大模型推理的核心本质是自回归生成，全流程遵循标准化的分层计算链。当前，端边云协同的分层推理架构已成为替代纯云端集中模式、实现推理降本增效的主流部署形态。 大模型的推理优化覆盖硬件、算法、架构、系统调度等多个维度，其中硬件利用效率是核心优化机制。推理过程主要受访存带宽瓶颈与无效计算制约，KV Cache约束是推理算力利用率偏低公众号小牛研报纪要的重要原因，KV Cache优化是突破该约束的核心基础路径。KV Cache与显存空间的管理，是制约存储能力与部署成本的核心机制，通过缓存并复用历史KV，避免重复的历史计算，可显著降低单位生成Token的计算复杂度。 当前大模型推理的综合效能评估，构建了性能与效果的二元衡量框架。其中，系统性能直接决定部署成本，用户体验是推理优化的核心目标，模型效果是技术落地的底线约束，所有效率优化均以效果可控为前提。两者共同构成推理方案的完整评价框架，以延迟等指标刻画系统性能。以上就是我们关于推理环节的主要观点。本次会议内容大致到此为止，感谢各位投资者，谢谢大家参加。 会议助理 本次会议。用AI进宝获得优质复盘资料，更多专业AI工具和投研内容，打开进门APP领取会员体验。祝您工作顺利，再见。 全文总结 这份材料是一份大模型行业研究的电话会纪要，以科普形式系统梳理了大模型的研究体系，整体框架为“通用智能底座—全链路技术体系—垂直场景落地”三大板块。 一、大模型是AI产业的通用智能底座 定位与演进：大模型是深度学习规模化发展的核心产物，依托超大参数与海量数据训练实现通用智能突破，推动AI从专用工具向通用问题求解系统升级；行业历经统计学习、深度学习、Transformer预训练范式确立、规模驱动能力涌现等阶段，正走向多模态感知、复杂推理、智能体执行和端侧部署。 模态分类：语言大模型（GPT、DeepSeek）、视觉大模型（SAM、Stable Diffusion）、音频大模型和多模态大模型（GPT-4、Gemini为标杆）。 七大核心能力：自然语言理解与处理（词法、句法、语义、语用全链路）、多模态感知、内容生成（文本、图像、音频、视频、代码、设计稿）、记忆机制、逻辑推理规划、工具调用与行动、安全对齐。 二、全链路技术体系：架构、训练、推理全栈优化 Transformer架构：2017年Google以《Attention Is All You Need》首次提出；核心是自注意力机制（Query/Key/Value矩阵、缩放点积、Softmax加权），由编码器与解码器对称构建；催生Encoder-Decoder、Encoder-Only、Decoder-Only三条路线，其中Decoder-Only凭借规模扩展性与通用性能成为主流；2018年OpenAI的GPT确立“预训练+微调”范式，Google的BERT验证Encoder-Only路线。 架构选型：单一架构难满足全链路需求，混合架构成主流——千亿参数旗舰标配Transformer+MoE（如DeepSeek V3，671B总参数/37B激活参数对标闭源模型）；通用生成选Decoder-Only纯稠密，超大容量选MoE稀疏，端侧低延迟选Transformer混合架构。 预训练：核心任务是Next Token预测，训练分热身、稳定、衰减三阶段，用分布式框架与混合精度加速；数据工程是核心壁垒，涵盖Common Crawl基础语料、格式统一、去重、噪声过滤、质量打分、脱敏分层存储与数据配比；分布式训练包括数据并行、流水线并行、张量并行；计算卡决定算力上限，FP8张量核心较BF16使算力密度翻倍，另有算子融合等硬件适配优化。 三大技术突破：万亿参数MoE训练（门控网络动态匹配、稀疏激活打破算力与参数的强耦合，头部厂商已规模化应用）、超长上下文训练（百万级Token，支撑长链路复杂场景）、多模态统一预训练（打破单模态边界，向多模态通用智能演进）。 后训练：完成从基础能力到可用能力的关键跃迁，沿指令对齐、推理理解、Agent执行、安全迭代分层推进；推理模型成熟、Agent场景落地与测评体系完善三重因素共振，推动后训练从输出优化转向全链路行为塑造；数据产业价值从样本规模转向任务设计、平台规则与训练环境的体系化能力。 推理：核心本质是自回归生成；端边云协同的分层推理架构成为主流部署形态；优化覆盖硬件、算法、架构、系统调度，主要受访存带宽与KV Cache约束，KV Cache优化是核心突破路径；综合效能采用性能—效果二元评价框架，性能决定部署成本、用户体验是优化目标、模型效果是底线约束。 三、垂直场景应用加速，产业价值逐步兑现 落地逻辑：通用能力可复用性决定落地宽度，行业场景适配性决定兑现深度；正从概念验证走向规模化试点。 AI编程（商业化最快赛道）：GitHub Copilot截至2026年初付费用户470万、同比增长75%；Cursor（Anysphere）ARR从2024年的1亿美元飙升至2026年2月的20亿美元；实现用户规模与企业付费双轮驱动。 金融：微软2025年7月推出首款行业定制服务金融AI助手，Copilot for Finance二次更新加入Excel插件、数据连接器与Agent Skills；Symphony 2025年5月发布多款金融AI Agent，前五大客户超40%来自金融业，金融服务已成其第二大营收来源。 医疗：容错率要求极低、需医学级精度，遵循合规优先、价值落地、风险可控原则；医渡科技2026年7月发布新一代医疗大模型，基于1000亿医学数据与OPD多科室专家融合机制，实现从轻量问诊到复杂计算服务。 四、结论与展望 大模型正从单点效率工具向全局优化系统升级，产业价值兑现节奏有望持续加速；硬件体系（GPU/CPU）将另设专题详解。", "status": "extracted"}, "post:2026-09-27T09-29:ae225eb4a4f6": {"id": "post:2026-09-27T09-29:ae225eb4a4f6", "kind": "post", "title": "2026-09-27 09:29", "source_label": "帖子正文", "excerpt": "瑞银——APAC科技：布局AI与存储上行周期 宏观与终端需求：AI服务器独撑增长，传统消费电子全面承压 • 超大规模云厂商资本开支2026-27年预期分别同比大增97%和45%，较前期再上修4%和3%。ASIC与CPU因成本优势获更大渗透空间。", "content": "瑞银——APAC科技：布局AI与存储上行周期 宏观与终端需求：AI服务器独撑增长，传统消费电子全面承压 • 超大规模云厂商资本开支2026-27年预期分别同比大增97%和45%，较前期再上修4%和3%。ASIC与CPU因成本优势获更大渗透空间。服务器整体出货量2026-27年预计同比各增19%和17%。 • 智能手机：2026年出货量预计同比下滑10%至11.4亿部，2027年续跌3%。5G手机出货量首现负增长（-1%）。 • PC：2026年出货量预计同比降11%至2.41亿台，2027年再降4%。消费级与企业级同步走弱。 • 内存价格暴涨成为核心变量：32GB DDR5价格较2025年二季度飙涨370%，1TB SSD涨310%。内存占PC BOM成本比例从24%激增至59%，整机出厂价被动抬升83%，直接压制终端需求。UBS因此大幅下修PC与智能手机全年预测。 • 非AI传统半导体（剔除存储与CPU）2026年营收预计仅增29%，与AI云端半导体124%的增速形成极端分化。 半导体行业：存储超级周期启动，AI云端占比将突破半数 • 2026年全球半导体总营收预计同比飙升118%至1.63万亿美元，2027年再增49%至2.43万亿美元。其中存储芯片是核心引擎——2026年存储营收预计跳增317%至9600亿美元，2027年续增72%至1.65万亿美元。 • AI云端计算半导体营收2026年预计达5310亿美元（同比+124%），占总行业比重33%；2027年翻倍至1.18万亿美元，占比跃升至49%。非AI云端半导体仅维持低个位数至低双位数增长。 • 细分品类中，MPU（2026年+35%）、CMOS逻辑（2026年+44%）受益于AI基础设施；模拟芯片与MCU复苏温和。 投资主线与标的筛选（UBS偏好） • IC设计服务：项目管线饱满、可寻址市场扩张，看好创意电子（GUC）、世芯（Alchip）； Faraday中性。 • 无晶圆厂IC：精选边缘AI敞口与估值折让标的，看好义隆（Elan）、祥硕（Asmedia）；联咏（Novatek）、谱瑞（Parade）中性。 • 特色工艺与后端代工：聚焦涨价受益与技术迁移标的，看好致茂（Chroma）、颀邦（Chipbond）、京元电子（ChipMOS）；力成（Powertech）中性。 • 显示、化合物半导体与硬件：AI相关机遇受益标的，看好智邦（Accton）、嘉泽（Lotes）、稳懋（WinSemi）；友达（AUO）中性；群创（Innolux）沽售。 • 晶圆代工与存储：台积电（Buy）、联电（Buy）、中芯国际（Buy）、华邦（Buy）、南亚科（Buy）；华虹中性。 • 硬件ODM/零组件：鸿海、广达、纬创、纬颖、英业达等AI服务器代工链全面看好；Delta、Liteon、King Slide等电源与零组件优选。 关键风险与定价逻辑 • 内存成本通胀对品牌厂毛利率形成双向挤压：BOM中内存占比逼近六成，而ODM与品牌利润率被严重稀释。 • 传统消费电子需求疲软与库存去化拉长形成负反馈，与AI算力链的极度紧缺构成2026年科技硬件市场最核心的分化格局。 • 估值层面，AI供应链标的2026年预期PE普遍位于15-60倍区间，2027年盈利高增将显著消化估值；非AI标的则面临盈利下修风险。#文字观点", "publish_time": "2026-09-27 09:29", "tags": ["文字观点"]}, "post:2026-09-27T20-47:f2210ef42ec0": {"id": "post:2026-09-27T20-47:f2210ef42ec0", "kind": "post", "title": "2026-09-27 20:47", "source_label": "帖子正文", "excerpt": "美股科技周观点（9/21~9/25）：市场对META Muse是否过于乐观？----------------------------------- 市场总结：围绕META Muse的AI Agent、油价主导的宏观预期等继续成为本周市场焦点，市场重回动量交易模式。", "content": "美股科技周观点（9/21~9/25）：市场对META Muse是否过于乐观？ ----------------------------------- 市场总结：围绕META Muse的AI Agent、油价主导的宏观预期等继续成为本周市场焦点，市场重回动量交易模式。期间虽有Anthropic、OpenAI新模型发布，但市场对此反应平淡。和年初Anthropic Claude讨论类似，市场围绕Muse不断寻找AI Agent场景中的潜在赢家、输家，费城半导体指数（SOX）+6.8%，CPU、存储、信息安全等子板块领涨，互联网、应用软件则成为潜在输家； Hypercaler：META凭借Muse成为阶段性赢家，而市场则开始担心Muse带来的潜在互联网流量格局变化，谷歌、亚马逊成为市场看衰对象，同时这种担忧开始迅速扩展至保险销售、财富管理、电信等行业领域，和年初的Anthropic Claude何其相似。较过往竞品，Muse上手简单、强调隐私和安全，目前虽登上美国App Store下载榜首，但DAU不足100万（限流因素），后续规模增长仍需克服复杂任务处理稳定性、用户行为习惯（信任等）、成本可持续性（很难想象1亿用户对应的算力资源消耗）等问题。市场阶段性的非理性狂热远超我们预期，但本身亦反映了市场当下对AI应用的强烈渴望。我们继续维持头部CSP底仓配置的观点，并建议逆向思维，短期个股更为偏好：谷歌、微软； 半导体硬件：和过去两周判断一致，AI Agent主题、短期新模型密集发布等，推动市场叙事阶段性转向半导体硬件，CPU继续引领市场，其他子板块则出现广泛的内部轮动，反映当下市场快速变化、混沌的内在交易逻辑，但显然市场关注焦点正在向推理、AI应用侧趋势性迁移。在三季报开启前，我们判断美股半导体硬件仍将继续保持上行势头，考虑到板块内部的不断切换，SOX为最佳做多对象； 软件&互联网：三季报之前，预计AI Agent将继续主导板块表现，潜在赢家、输家的讨论本身就是嬗变的主观因素驱动，短期带来明显的波动性。应用软件、互联网短期料缺乏趋势性机会，更多依赖于三季报乐观数据&展望的注入。信息安全、基础软件虽面临持续的高估值的担忧，但作为典型的动量股，成长性依然是最为核心的支撑； 未来1~3个月判断：美债收益率不断创下新高，但特朗普TACO的临界点亦在快速逼近。考虑到短期前沿模型密集发布、宏观悲观预期见顶等，我们继续维持未来1个月、三季报开启前市场的乐观看法，优选半导体硬件。伴随10月中旬三季报开启，以及中期选举的临近，市场波动性料将显著加剧，预计三季报后市场交易逻辑逐步趋于清晰； 下周关注：1）宏观&行业：美国8月核心PCE、9月就业数据；2）公司：美光（MU）财报、OpenAI年度开发者大会。#文字观点", "publish_time": "2026-09-27 20:47", "tags": ["文字观点"]}, "attachment:files/人工智能安全的意外投资案例｜摩根士丹利专栏26092420260926.pdf": {"id": "attachment:files/人工智能安全的意外投资案例｜摩根士丹利专栏26092420260926.pdf", "kind": "attachment", "title": "人工智能安全的意外投资案例｜摩根士丹利专栏26092420260926", "source_label": "其他", "excerpt": "人工智能安全的意外投资案例｜摩根士丹利专栏 26092420260926 要点总结 1.服务重置与号码状态管理：对话核心围绕服务重置失败及号码无法释放至网络的技术问题展开，强 调需优先核查号码状态、确认服务中断原因，并通过重新连接服务来恢复正常运行。2.跨区域通信限制与国际漫游：讨论重点涵盖美国与中国间通话的地域性限制、国际漫游功能以及特 定服务代码的使用限", "content": "人工智能安全的意外投资案例｜摩根士丹利专栏 26092420260926 要点总结 1.服务重置与号码状态管理：对话核心围绕服务重置失败及号码无法释放至网络的技术问题展开，强 调需优先核查号码状态、确认服务中断原因，并通过重新连接服务来恢复正常运行。 2.跨区域通信限制与国际漫游：讨论重点涵盖美国与中国间通话的地域性限制、国际漫游功能以及特 定服务代码的使用限制，指出部分功能可能因地区政策或技术壁垒而无法完全开放。 3.多方协同与服务质量优化：针对技术转移、座席可用性及无效信息处理等问题，双方探讨了提升沟 通效率的具体路径，强调遵循标准操作流程、加强中美技术协作以保障服务准确性。 4.系统故障排查与设置调整：针对号码拨号失败及服务连接异常，明确原因为过期或错误的服务限制 拦截了正常数据处理，解决方向在于全面检查服务配置能力并及时更新相关设置参数。 问答整理 Q1：提到的服务存在什么问题？ 答：服务重置过程中出现错误，导致号码无法被正确释放至网络。具体错误代码及涉及号码的详细信息 在原始记录中未予明确。 Q2：行业服务代码及现有费率的具体情况如何？ 答：行业服务代码当前状态为“待处理”（pending），表明其暂不可用或信息尚未同步；现有服务费 率同样未在记录中给出明确数值。 Q3：目前讨论的限制措施具有何种性质？ 答：属于针对“开放服务”的暂时性管控限制，主要体现为服务行业内的通话拦截或功能调用受限。 Q4：导致号码拨号失败与服务连接中断的根本原因是什么？ 答：系过期或未生效的服务限制规则仍在后台运行，阻断了号码的正常解析与路由。典型表现为首次呼 叫无法建立连接，必须重新拨号方可尝试。 Q5：应采取哪些步骤来解决该服务异常？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：需进入后台核查并修正服务配置，重点清除过期或冲突的限制策略，以确保号码拨号逻辑与服务链 路能够顺畅对接。 Q6：日常运维中应重点检查服务与号码的哪些维度？ 答：需评估系统对号码的处理承载能力，并定期审计限制规则的生效状态；同时建议及时更新服务底层 设置，彻底清理待处理或历史遗留的限制项。 原文 会议信息时间：9月24日参会人：无全文摘要本次对话集中讨论了移动通信服务中的技术问题，涉及 USBG、AI、号码复位、服务恢复以及国际漫游等关键领域。讨论内容涵盖了服务重启、号码释放、网 络连接与数据传输的问题，及其对用户体验的影响。此外，对话还特别关注了地理和地区性挑战，例如 美国与中国间通话的限制。涉及到的具体操作包括号码验证、服务代码使用以及某些功能可能受到的地 域限制，体现了技术性较强且包含大量专业术语的特性。 章节速览00:00关于服务重置与号码存在的技术沟通对话围绕服务重置问 \u00008", "status": "extracted"}, "post:2026-09-27T19-03:e1b95a1beb34": {"id": "post:2026-09-27T19-03:e1b95a1beb34", "kind": "post", "title": "2026-09-27 19:03", "source_label": "帖子正文", "excerpt": "受供应紧张影响，VR200 物料清单中多个组件的价格大幅上涨，包括内存、ABF 载板、MLCC 和 PCB。1. 内存 +435% 2. PCB +233% 3. MLCC +182% 4. ABF 载板 +82%", "content": "受供应紧张影响，VR200 物料清单中多个组件的价格大幅上涨，包括内存、ABF 载板、MLCC 和 PCB。 1. 内存 +435% 2. PCB +233% 3. MLCC +182% 4. ABF 载板 +82%", "publish_time": "2026-09-27 19:03", "tags": []}, "post:2026-09-27T09-29:0580513a1cd1": {"id": "post:2026-09-27T09-29:0580513a1cd1", "kind": "post", "title": "2026-09-27 09:29", "source_label": "帖子正文", "excerpt": "伯恩斯坦——甲骨文“不可抗力”事件对甲骨文、Bloom Energy及 broader 数据中心行业的影响 9月24日，甲骨文（Oracle）向其位于新墨西哥州Dona Ana县的“Project Jupiter”未来数据中心建筑商发出“不可抗力”（Force Majeure）通知，导致甲骨文股价当", "content": "伯恩斯坦——甲骨文“不可抗力”事件对甲骨文、Bloom Energy及 broader 数据中心行业的影响 9月24日，甲骨文（Oracle）向其位于新墨西哥州Dona Ana县的“Project Jupiter”未来数据中心建筑商发出“不可抗力”（Force Majeure）通知，导致甲骨文股价当日下跌约4%，Bloom Energy（BE）股价下跌约3%（BE的燃料电池原计划为该数据中心供电）。伯恩斯坦认为市场对两家公司的抛售均属过度反应。对于BE，商业合同关系保持完整，合同条款未发生任何变更，甲骨文仍承诺在项目建设中使用BE的燃料电池。 “不可抗力”通知的实质影响 在未看到具体合同条款的情况下，伯恩斯坦推测该通知的核心目的在于覆盖或有事件并保留全部选择权，包括：延迟向数据中心承包商或分包商（含电力/冷却环节）付款；并可能赋予甲骨文在合同约定的启用日期前的任何时候取消合同的选项。此举亦向政府机构及政界释放信号，表明若项目持续延误，甲骨文理论上可退出，从而影响当地税收与就业。然而，这并不改变伯恩斯坦对甲骨文的原有投资逻辑。 数据中心行业的结构性洞察 超大规模云厂商（hyperscalers）在租赁合同中通常内置基于交付日期、服务等级协议（SLA）等的补救与取消条款。据伯恩斯坦与行业专家的交流，包括甲骨文在内的超大规模厂商有意签署了超出实际需求的额外数据中心容量（非硬件）合同，以此作为缓冲以应对延误和取消，尤其在它们将房东基础扩展至标准高信誉开发商之外后，这一策略更为普遍。这提醒市场：并非所有数据中心及合同都具有同等确定性。 对甲骨文（ORCL）的影响：估值已充分反映风险，下行空间有限 • Project Jupiter原计划于2028年晚些时候才向客户开放，管理层在财报中明确表示“建设 definitely on track……这些站点不会对FY27收入或盈利指引产生任何影响”。因此，即便延误兑现，对FY27甚至FY28收入均无冲击。 • 甲骨文已签约的容量远超当前需求，且可通过其他数据中心满足客户要求。 • 关键的是，当前甲骨文股价估值实质上已完全剔除OCI AI业务的任何收入/利润贡献，有时甚至隐含负价值。因此，若这些数据中心及相关收入成本消失，理论上甲骨文股价反而应上涨。 • 伯恩斯坦维持甲骨文“与大盘持平”（Market-Perform）评级，目标价325美元（基于12个月调整后EPS预期15.54美元，给予23.5倍调整后P/E，并加回每股净现金-40.7美元）。 对Bloom Energy（BE）的影响：合同完好，首选供应商地位未动摇 • Project Jupiter（约2.5 GW）是BE披露储备中最大的部署项目。2025年7月BE曾在约60天内为甲骨文数据中心搭建现场电源（目标90天），促成2026年4月双方签署主服务协议（MSA），甲骨文拟采购最多2.8 GW BE燃料电池，其中1.2 GW已签约。2026年4月下旬，甲骨文宣布放弃原燃气轮机设计，全面改用规模高达2.5 GW的燃料电池微电网，这对BE是重大胜利。 • 伯恩斯坦认为，BE仍是甲骨文项目的首选供应商，甲骨文仍致力于履行与BE的合同。商业上无任何取消或重新定价。 • 维持BE“与大盘持平”评级，目标价282美元（基于41倍EV/EBITDA，对应2H27/1H28 blended调整后EBITDA）。 对 broader 数据中心市场的影响：优选顶级开发商 事件凸显了数据中心合同的差异性。伯恩斯坦通信基础设施团队继续偏好顶级开发商，通过“建筑商信誉分析”对市场储备进行概率加权。具体评级： • Digital Realty（DLR）：跑赢大盘（Outperform），目标价226美元（基于27倍NTM+1调整后每股运营资金AFFO 8.36美元）。 • Equinix（EQIX）：跑赢大盘（Outperform），目标价1,270美元（基于约25倍NTM+1 AFFO 51.19美元）。 结论 甲骨文的“不可抗力”通知是风险管理和期权价值的体现，而非项目根本性失败的信号。对BE而言，合同关系稳固，技术路线（燃料电池微电网）未受挑战。行业层面，超大规模厂商的容量缓冲策略及开发商信誉分化将持续主导数据中心投资逻辑。伯恩斯坦维持对甲骨文、BE、DLR及EQIX的原有评级及目标价。#文字观点", "publish_time": "2026-09-27 09:29", "tags": ["文字观点"]}, "post:2026-09-27T11-43:28bb389843ee": {"id": "post:2026-09-27T11-43:28bb389843ee", "kind": "post", "title": "2026-09-27 11:43", "source_label": "帖子正文", "excerpt": "汇报2❗️【天风电新】SOFC：渗透率持续提升的三个逻辑，以及仍被低估的增长潜力-0926 ———————————— 无论是北美的审批机制、SOFC自身的降本迭代，还是未来800V DC渗透率提升，都有利于SOFC渗透率提升。BE的订单也已经从依赖几家大客户，进入到下游全面铺开的阶段，SOFC的产业", "content": "汇报2❗️【天风电新】SOFC：渗透率持续提升的三个逻辑，以及仍被低估的增长潜力-0926 ———————————— 无论是北美的审批机制、SOFC自身的降本迭代，还是未来800V DC渗透率提升，都有利于SOFC渗透率提升。BE的订单也已经从依赖几家大客户，进入到下游全面铺开的阶段，SOFC的产业趋势已经形成。 首先，北美燃机的瓶颈已经不仅是交付周期拉长一个问题，新项目审批面临日益增大的阻力。原因在于社区担心燃机的碳排放、噪音、污染以及对水资源的大量消耗。Oracle、Nebuis均转向SOFC，推动项目更快通过审核。在未来的决策中，Time to Power的权重会大幅提升。 其次，近期BE推出的Power Connect方案，把接线、测试和电气集成等工作提前在工厂完成。通过模块化设计，减少现场作业量，将安装时间再缩短40%。历史上BE保持了每年两位数成本下降，未来以先导基电为代表的等国内供应商的导入，布局了上游关键材料和设备，并有望覆盖80%的BOM，将帮助BE完成加速降本。 最后，目前北美高压变压器交付周期3~4年，中压开关柜2~3年，高压断路器1.5年。若采用SOFC+800V DC方案，可节约变电站、中压开关柜等投资。根据BE测算，1GW AI数据中心采用SOFC+800V DC后，5年非算力TCO可降低55亿美元、降幅21%。 在AI需求爆发之前，SOFC应用主要集中在家庭热电联供、离网工商业分布式、备用电等市场。由于成本较高，下游应用并未完全打开。AI带动SOFC加速降本，并实现与燃机平价，将在公用事业等市场替代燃机（依然是高效、环保、低噪、节水等优势），成为主力电源。因此# 非AI领域的SOFC需求仍被市场低估。 2025年全球燃机新签订单100GW，26Q1新签订单29GW、26Q2新签订单38GW。若其中有一半被SOFC替代，则意味着# SOFC装机有可能到50~80GW。 ⭐投资建议： 目前市场仅意识到AIDC对SOFC的需求拉动，而忽略了SOFC放量降本后对非AIDC领域的替代。我们不仅看好SOFC在AIDC离网场景的应用，更认为其有希望成为北美的主力能源。继续看好SOFC系统集成商及BE供应链。 SOFC系统集成商推荐：BE、潍柴动力、三环集团、云意电气。 BE供应链推荐：先导基电、振华股份、春晖智控、壹连科技、京泉华、三环集团、中原内配、星源材质（邦瓷电子）等。 ———————————— 欢迎交流：孙潇雅/敖颖晨#文字观点", "publish_time": "2026-09-27 11:43", "tags": ["文字观点"]}, "post:2026-09-27T19-00:fa2010434fc1": {"id": "post:2026-09-27T19-00:fa2010434fc1", "kind": "post", "title": "2026-09-27 19:00", "source_label": "帖子正文", "excerpt": "【开源机械】曙光8000金刚石散热方案亮相央视，金刚石散热落地加速！重视＃沃尔德、建议关注国机精工、力量钻石、四方达 ＃央视站台背书报道金刚石散热方案！", "content": "【开源机械】曙光8000金刚石散热方案亮相央视，金刚石散热落地加速！重视＃沃尔德、建议关注国机精工、力量钻石、四方达 ＃央视站台背书报道金刚石散热方案！ 央视《超级工程—曙光8000》披露曙光8000冷却方案：金刚石散热器直接与芯片裸片焊接，成为唯一通过验证的散热选材。 ＃纯金刚石和金刚石铜路线匹配使用，互相促进。金刚石铜属于远端散热路线，和芯片端热沉片互不干涉、可配套使用，反而属于相互促进，金刚石铜散热使得散热量上限提升，芯片近端解决单一热点温度过高的问题更迫在眉睫。芯片近端-金刚石热沉片： #应用进展：近端散热路线，解决局部热点、移动热源导致的降频问题。国内多家在做封装表面材料更换测试，国内封装厂已为至少4-5家芯片厂商完成样品打样。#技术路线：晶圆级方案（waferto wafer）由台积电主推，匹配整片晶圆；chip to wafer是国内主流，单颗die单独贴装金刚石。 #成本测算：按计算die面积核算，400平方毫米die单晶热沉片采购约1500元、多晶约2000元，叠加贴装工艺后单颗综合成本提升约2500元；800平方毫米约5000元，1600平方毫米约10000元。搭载2颗400平方毫米die的产品新增成本约5000元，对应近20万元的产品售价，成本占比极低，性价比突出，新品还有4die版本。 #性能增益：核心作用是均热防降频，可使芯片设计结温下降约15度，全核心运行频率提升约0.2GHz，部分核心超频可提升0.3-0.4GHz，＃算力平均提升约20%，能让芯片稳定跑满标称峰值算力，解决原有峰值算力不可持续的痛点。 #厂商进度：部分厂商芯片流片已完成，当前处于模组测试阶段，2026年四季度预计小批量量产，量产前预计会有招标流程，2027年Q2正式起量；配置方式为每颗计算die对应一片热沉片。金刚石复合铜冷板： #定位：远端散热路线，和芯片端热沉片互不干涉、可配套使用，属于纯铜材料的升级优化方案。 #量产进展：目前量产规模最大的是曙光，郑州项目10万台浸没式冷板/蒸发器采用铜基掺杂金刚石材料，换热效率比常规纯铜高一倍多。 #适配性：兼容被动风冷、液冷、浸没式等多种散热场景，成本提升幅度小，商业化可行性高。 #成本效果：仅冷板凸台用金刚石铜的方案，常规冷板约300元/块，升级后成本增加400-500元，上浮10%-15%，可实现降温5-8度；全板采用金刚石铜的成本至少比传统冷板贵一倍。 重点看好沃尔德在金刚石散热片在GPU端、金刚石铜冷板在F、L等客户落地进展，持续关注国机精工，四方达，力量钻石。#文字观点", "publish_time": "2026-09-27 19:00", "tags": ["技术路线", "晶圆级方案（wafer", "文字观点"]}, "post:2026-09-27T19-43:44fef8129fda": {"id": "post:2026-09-27T19-43:44fef8129fda", "kind": "post", "title": "2026-09-27 19:43", "source_label": "帖子正文", "excerpt": "#【算力散热主线】曙光8000央视亮相，高功率AI集群多路线散热技术共振，国产散热方案加速产业化！🎉🎉🎉 央视播出《超级工程-曙光8000》，公开国内十万卡级国产AI超算集群建设成果。", "content": "#【算力散热主线】曙光8000央视亮相，高功率AI集群多路线散热技术共振，国产散热方案加速产业化！🎉🎉🎉 央视播出《超级工程-曙光8000》，公开国内十万卡级国产AI超算集群建设成果。随着AI算力集群规模化扩容、芯片功耗持续提升，#新型散热技术国产化替代进程持续提速。本次曙光8000超算集群采用系统化散热架构，#以浸没相变液冷作为整机核心散热方案，是超大规模智算集群稳定运行的基础保障。该方案将集群整体 同比增97%和45%，较前期上修4%和3%。\u003c/li>\n\u003cli>今天出现的催化/验证：OpenAI 9月22日发布GPT-6 Sol及Luna，API价格较5.6同档降低约50%；Anthropic 9月23日发布Claude Opus 5.5，Agent能力可通过视觉理解、代码生成和工具调用完成3D场景搭建开发、游戏生成；阿里云栖大会将AI模型、AI芯片、AI云列为智能时代三大基石，千问通过RSI与Scaling冲击5–10T参数，Qwen 3.8 Max上线两月Token消耗。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体/先进封装/存储\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：供应趋紧与内存成本通胀延续，HBM缺货下Rubin Ultra或从12Hi降为8Hi以满足更多GPU出货，总需求未减少且外溢至DRAM/NAND；国内半导体设备、Fab、国产算力自主可控，以及全球AI驱动的PCB、AI电源和存储等方向持续受看好。\u003c/li>\n\u003cli>今天出现的催化/验证：VR200 BOM中内存+435%、PCB+233%、MLCC+182%、ABF载板+82%；DRAM占PC物料成本从24%激增至59%；台积电CoPoS从晶圆形态迁移至方形面板形态，通过中介层实现芯片贴装；电子26Q3业绩前瞻预计AI通胀方向最佳，半导体制造/封测产业链订单趋势持续景气。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI数据中心对更高带宽、更低功耗、光进铜退方向无分歧，但节奏和架构分裂；800G放量、1.6T上量、3.2T/448G预研，客户路线图分化，有的继续堆可插拔把CPO推到2028。\u003c/li>\n\u003cli>今天出现的催化/验证：NVIDIA Quantum-X800 1.6T交换机72个光引擎/72颗TEC，单颗TEC量产后60美金，单台CPO交换机陶瓷基板价值量864美元；1.6T可插拔价格下行但放量确定；美国法案点名中际旭创、新易盛，但约束范围限于联邦政府国家安全系统采购，设有五年过渡期，找不到替代来源可逐笔申请豁免；中际旭创9月21日获FCC认证。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>PCB/CCL/电子布与陶瓷基板/玻璃基板\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：电子布到CCL涨价链传导顺畅，电子布延续供不应求，产品结构调整缩减传统电子纱及电子布供应量，供需格局持续优化。\u003c/li>\n\u003cli>今天出现的催化/验证：宏瑞兴对CCL/PP再提价+10%/15%，预计10月电子布价格继续上行，双节后或迎新一轮提价；中国玻璃基板商业化超越韩国，京东方玻璃基板推进顺利；陶瓷基板新增CPO交换机光引擎及下一代正交背板应用，国瓷材料27年客户订单指引20e+、q1释放业绩；AI服务器PCB专家交流显示谷歌TPU v7/v8/v9节奏，胜宏科技2025年切入v8供应链、下半年实质出货。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>液冷/电源/SOFC与散热\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：SOFC渗透率提升的三个逻辑包括北美审批机制、自身降本迭代、未来800V DC渗透率提升；BE订单已从依赖几家大客户进入下游全面铺开阶段。\u003c/li>\n\u003cli>今天出现的催化/验证：甲骨文9月24日向新墨西哥州Project Jupiter未来数据中心建筑商发出不可抗力通知，甲骨文股价当日跌约4%，Bloom Energy股价跌约3%；BE与甲骨文主服务协议拟采购最多2.8 GW燃料电池，其中1.2 GW已签约；1GW AI数据中心采用SOFC+800V DC后5年非算力TCO可降低55亿美元、降幅21%；曙光8000金刚石散热方案亮相央视，重视沃尔德，关注国机精工、力量钻石、四方达。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：美债收益率再度飙升，B级及以下企业债信用利差开始反弹，无风险利率和信用利差同步上行再度导致美国AI融资可持续性担忧；但美国企业融资渠道多元化，除债权以外亦可通过股权、产业资本和减少股票回购等方式支持CAPEX；宏观不确定性阻碍仓位修复与落后者补涨。\u003c/li>\n\u003cli>今天出现的催化/验证：10月底加息概率升至66%，十年期美债收益率突破5%，美元指数持续升值至101上方；有估算显示六家美国超大规模云服务商将在2026–27年花费约1.73万亿美元用于AI基础设施；中美达成八点成果共识，包括战略稳定定调、APEC/G20互挺、300亿对等降税、贸易理事会、禁毒联合执法、AI对话、两军危机沟通等；历史国庆假期后A股短期多上涨，短期做多窗口可能已开启，可持股过节。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>OpenAI 9月22日发布GPT-6 Sol及Luna，延续Astra技术路线，API价格较5.6同档降低约50%；Anthropic 9月23日发布Claude Opus 5.5，Agent能力可通过视觉理解、代码生成和工具调用完成3D场景搭建开发、游戏生成。\u003c/li>\n\u003cli>阿里云栖大会表示将AI模型、AI芯片、AI云列为智能时代三大基石；模型端千问通过RSI与Scaling冲击5–10T参数（Qwen4.5/5），Qwen 3.8 Max上线两月Token消耗。\u003c/li>\n\u003cli>甲骨文9月24日向新墨西哥州Dona Ana县Project Jupiter未来数据中心建筑商发出不可抗力通知，甲骨文股价当日跌约4%，Bloom Energy股价跌约3%。\u003c/li>\n\u003cli>电子板块本周共4个交易日整体-1.6%，其中电子零组件-2.7%、消费电子-2.8%，周内整体先扬后抑；Meta旗下AI智能体Muse走红，市场重新评估Agent对CPU需求的拉动，美股AMD、Intel等CPU相关标的明显走强。\u003c/li>\n\u003cli>VR200物料清单中多个组件价格大幅上涨：内存+435%、PCB+233%、MLCC+182%、ABF载板+82%；DRAM占PC物料成本比重已从24%激增至59%。\u003c/li>\n\u003cli>宏瑞兴对CCL/PP再提价+10%/15%，产业链价格传导通畅，预计10月电子布价格有望继续上行，幅度较9月相当；双节后或迎新一轮提价；中国在玻璃基板商业化方面正在超越韩国，京东方玻璃基板推进顺利。\u003c/li>\n\u003cli>美国四名两党参议员联名提出《保护国家安全系统免受中国光模块影响法案》，点名中际旭创、新易盛，并将其固件、组件纳入穿透条款；约束范围限于联邦政府国家安全系统采购，设有五年过渡期，找不到替代来源可逐笔申请豁免；中际旭创9月21日获得三系列产品FCC认证。\u003c/li>\n\u003cli>美债抛售与美联储加息预期主导全球波动：10月底加息概率升至66%，十年期美债收益率突破5%，美元指数持续升值至101上方；美国30年期国债收益率突破5.5%；纽约联储主席威廉姆斯称今年年底前再次加息是合理的。\u003c/li>\n\u003cli>机器人方面，弗里蒙特Optimus产能将于10月明显起量，预计11月左右提升至周产1k+；科森科技独家供应特斯拉人形机器人躯干+肢体注塑/发泡外观件，单套价值量1000美金，9月初已接15000套订单，3个月交付期、10月起交付，26年机器人业务收入预计1e。\u003c/li>\n\u003cli>国瓷材料27年客户订单指引20e+，q1即可释放业绩，PCB内嵌陶瓷基板直接对接NV；麦格米特谷歌万套级超容柜订单已敲定，叠加xAI相关PowerShelf约50%份额；硅电容核心解决超高频去耦，27年将迎来产业化元年。\u003c/li>\n\u003cli>中美达成八点成果共识，包括战略稳定定调、APEC/G20互挺、伊朗和国际水道共识、300亿对等降税、贸易理事会、禁毒联合执法、AI对话、两军危机沟通等。\u003c/li>\n\u003cli>医药AI4S方面，英伟达披露其蛋白质设计模型Proteina-Complexa模型的湿实验验证论文，针对127个目标测试100万个粘合剂，多家上市公司为其供应商。\u003c/li>\n\u003cli>其他行业变化包括：北京率先落地828新政细则，以8月28日新老划断，细化预售门槛、现房定金1%及土地款首付不低于50%、余款两年免息等；Uxin 26Q2收入11.51亿元（YoY +74.9%，QoQ +7.2%），零售量19,610台（YoY +88.8%），毛利率-0.7%（QoQ -7.7pct）。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>AI算力承诺与云厂资本开支兑现：AI算力承诺超1.4万亿美元，超大规模云厂2026-27年资本开支增97%/45%，关注订单能见度向台积电、日月光、联电等亚太半导体供应链映射。\u003c/li>\n\u003cli>不同架构芯片单位GW对台积电营收贡献：Blackwell Ultra/Rubin世代每GW约11亿美元，Rubin Ultra/Feynman世代升至14至19亿美元，受制程迁移、单机架GPU颗数增加及先进封装升级驱动。\u003c/li>\n\u003cli>存储与成本传导：Rubin Ultra是否从12Hi降为8Hi；HBM缺货对DRAM/NAND的外溢；VR200 BOM涨价对终端品牌毛利率的双向挤压，以及DRAM占PC物料成本从24%到59%后的智能手机与PC出货影响。\u003c/li>\n\u003cli>电子布/CCL提价链：10月电子布价格、双节后新一轮提价；宏瑞兴提价传导；ABF方面预计Q4日本企业有望开始转产，国产替代望提速。\u003c/li>\n\u003cli>光通信：1.6T可插拔放量与价格；CPO推到2028的客户路线；3.2T/448G预研；美国法案豁免与替代来源；中际旭创FCC认证后续；NVIDIA Quantum-X800 CPO交换机TEC与陶瓷基板价值量。\u003c/li>\n\u003cli>先进封装/材料：台积电CoPoS从晶圆形态迁移至方形面板形态的计划；玻璃基板客户验证与量产投资；陶瓷基板在CPO交换机光引擎及下一代正交背板应用；国瓷材料27年订单与q1业绩释放。\u003c/li>\n\u003cli>液冷/电源：甲骨文不可抗力事件对甲骨文、Bloom Energy及数据中心行业影响；BE燃料电池2.8GW、1.2GW合同进展；SOFC+800V DC降TCO逻辑；曙光8000金刚石散热产业化。\u003c/li>\n\u003cli>机器人：Optimus 10月量产拐点、11月周产1k+；科森科技10月交付、15000套订单、美国预留周产6000套；上半年全球人形机器人出货量同比增长近3倍，中国厂商占97%以上份额。\u003c/li>\n\u003cli>宏观：美债收益率、加息概率、信用利差、美元指数、AI融资渠道；中美八点成果落地、APEC/G20、300亿对等降税、AI对话；国庆后A股表现与节前科技成长配置窗口。\u003c/li>\n\u003cli>业绩兑现：电子26Q3业绩前瞻预计AI通胀方向最佳，PCB/CCL、存储、AI电源强劲，半导体制造/封测订单景气；关注基本面强、业绩兑现度高且具备国产替代空间的细分方向。\u003c/li>\n\u003cli>医药AI4S：英伟达Proteina-Complexa湿实验验证，127个目标测试100万个粘合剂，上市公司供应商验证。\u003c/li>\n\u003cli>新能源/汽车/其他：锂电池材料价格周报；恒力石化“油、煤、化”一体化与新材料延伸；埃泰克域控制器份额连续三年第一；日联科技三笔并购协同；Uxin Q2经营数据。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>09:27｜2026年9月26日云盘汇总\u003c/li>\n\u003cli>09:28｜瑞银——亚太半导体行业核心观点 2026年9月：云端AI需求走强驱动全行业供应趋紧 一、行业总览与核心仓位 年初至今费城半导体指数（SOX）累计上涨88%，UBS覆盖的亚太半导体标的均价上涨90%，其中台积电涨61%、联发科涨263%、联电涨225%，同期道指仅涨7%、台湾加权指数涨65%。UBS维持对台积电的买入评级。\u003c/li>\n\u003cli>09:29｜中国在玻璃基板商业化方面正在超越韩国。当韩国企业还在验证个别工艺、研究量产投资时，中国已抢先一步从生产线建设入手，在产品生产和客户验证方面加速推进。\u003c/li>\n\u003cli>09:29｜伯恩斯坦——甲骨文“不可抗力”事件对甲骨文、Bloom Energy及 broader 数据中心行业的影响 9月24日，甲骨文（Oracle）向其位于新墨西哥州Dona Ana县的“Project Jupiter”未来数据 document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
