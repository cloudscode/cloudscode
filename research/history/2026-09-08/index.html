8a93624a": {"id": "post:2026-09-08T09-12:b3ab8a93624a", "kind": "post", "title": "2026-09-08 09:12", "source_label": "帖子正文", "excerpt": "#华泰睿思农业银行、工商银行同日公告合计定增募资2600亿元（农行1600亿、工行1000亿），用于补充核心一级资本，财政部、中国烟草为主要认购对象，其中财政部认购金额达2000亿元。本次定增是中央立足经济金融形势、围绕稳增长扩内需化风险推出的一揽子经济增量政策之一，对国有大行长远发展和股东价值提升", "content": "", "publish_time": "2026-09-08 09:12", "tags": ["华泰睿思", "文字观点"]}, "post:2026-09-08T09-14:efb6c077fc73": {"id": "post:2026-09-08T09-14:efb6c077fc73", "kind": "post", "title": "2026-09-08 09:14", "source_label": "帖子正文", "excerpt": "📑半导体｜收益风险比向好的区间💡 周期强度持续得到验证，供给紧张程度预计将在 2027 年进一步加剧。💱 虽然存在汇率下行带来的业绩下行风险，但估值修复的逻辑已经确立。", "content": "", "publish_time": "2026-09-08 09:14", "tags": ["文字观点"]}, "post:2026-09-08T15-55:d26168d5017a": {"id": "post:2026-09-08T15-55:d26168d5017a", "kind": "post", "title": "2026-09-08 15:55", "source_label": "帖子正文", "excerpt": "9月8日复盘笔记：化肥/农药/农牧饲渔/传媒/CRO/光纤/农业/房地产/6G/零售/芯片/煤炭等一、重磅财经信息海关总署：1至8月集成电路累计出口金额达2567.51亿美元，同比", "content": "", "publish_time": "2026-09-08 15:55", "tags": ["文字观点"]}}, "source_details": {"post:2026-09-08T20-03:a66030ec3e79": {"id": "post:2026-09-08T20-03:a66030ec3e79", "kind": "post", "title": "2026-09-08 20:03", "source_label": "帖子正文", "excerpt": "【东北计算机】20260908【英特尔PC CPU预计10月再度涨价10%，低毛利小核产品线或停产退市，服务器CPU产能持续紧张】 —————————————— 1、据台湾《电子时报》报道，英特尔PC CPU预计10月再度涨价10%，同时毛利率偏低的小核产品线或将启动停产退市，此举旨在拉升毛利率，过", "content": "【东北计算机】20260908【英特尔PC CPU预计10月再度涨价10%，低毛利小核产品线或停产退市，服务器CPU产能持续紧张】 —————————————— 1、据台湾《电子时报》报道，英特尔PC CPU预计10月再度涨价10%，同时毛利率偏低的小核产品线或将启动停产退市，此举旨在拉升毛利率，过去依靠降价抢占市场份额的策略已不再适用；服务器CPU产能持续紧张，景气周期延续至2028年（来源：财联社） 2、苹果一改短期议价惯例，据称与铠侠签订为期三至五年、不设价格上限的NAND闪存长期供货协议，TrendForce预计256GB版iPhone 18 Pro三季度存储成本将比一年前高出近四倍，存储芯片采购模式正整体转向长协（来源：财联社） 3、Anthropic决定放弃收购以色列AI初创公司Decart，此前预计交易规模60亿美元；收购初衷为借助Decart的算力优化技术解决Claude模型跨芯片优化问题，交易告吹原因尚未披露，业内猜测或与尽调发现、IPO复杂度等因素有关（来源：财联社） 4、三星电子得州泰勒工厂本月底将试产2nm芯片，初期月产能5万片，当前全部产能已被预订满，已获特斯拉、博通等企业订单，公司预期今年2nm订单量较去年翻番以上；泰勒二期计划年底开工，目标2030年量产（来源：财联社） 5、三星电子正加快人形机器人原型开发，目标2027年1月CES首次公开展示自研人形机器人，项目直接向联席CEO卢泰文汇报，机器人AI软件与硬件两条线由同一高管统一指挥，以加快开发速度（来源：科创版日报） ☎️欢迎联系东北计算机团队#文字观点", "publish_time": "2026-09-08 20:03", "tags": ["文字观点"]}, "post:2026-09-08T07-52:eb8438d14b7b": {"id": "post:2026-09-08T07-52:eb8438d14b7b", "kind": "post", "title": "2026-09-08 07:52", "source_label": "帖子正文", "excerpt": "为什么 OpenAI 的 GPT-6 Astra 是转折点？（三星证券）🎯三星证券认为，GPT-6 Astra 的真正变化不在于问题解决分数，而在于无需人类监督也能自主完成任务的时间和复杂度的显著增加。", "content": "为什么 OpenAI 的 GPT-6 Astra 是转折点？（三星证券）🎯三星证券认为，GPT-6 Astra 的真正变化不在于问题解决分数，而在于无需人类监督也能自主完成任务的时间和复杂度的显著增加。🧭 现有 AI 在任务变长时容易忘记目标或因中间错误而动摇失败，但 Astra 在长时间任务的稳定性和多步骤处理能力上有了显著提升。 🤖 如有需要，它能同时运行多个代理，从而扩大了 AI 所能承担的任务范围本身。 ⏳ 三星证券将此解读为 AI 自主持续工作的“时间视界”扩展的变化。 📊 即使是同样的 Astra，在标准环境下最高为 62.7%，但在 OpenAI 的提供商适配器环境中可高达 99.9%。 🔧 模型本身不变，仅改变状态管理、内存和上下文保持方式，性能就拉开约 37 个百分点。 💾 提供商适配器是一种延续先前推理状态、压缩旧内容仅保留重要上下文的方式。 ⚙️ 这种方式执行时间增加了 3.7 倍，但令牌减少了 49%，评估成本也从 2.6 美元降至 1.9 美元。 📉 与之前的 GPT-5.6 Sol 在相同标准环境下仅 7.8% 相比，差距显而易见。 🔑 今后，不仅仅是模型智能，内存、工具、上下文管理和执行环境设计也将成为决定性能的关键因素。 🧪 OpenAI 已将 AI 代理正式投入下一代模型研究中。 🎓 目标是超越几天任务的自动化研究实习生，到 2028 年 3 月打造自主性更高的自动化 AI 研究者。 👩‍🔬 截至 2026 年 8 月中旬，一名研究员的一天劳动时间相当于约 3.1 天份量的代理任务在运行。 💻 最初以编码为主，但现在已扩展到执行、监控、调试、问题解决和结果分析。 🔀 研究员开始并行运行多个代理，即使是几小时以上的任务，成功案例也在增加。 📈 以研究组织员工中位数为基准，代理输出令牌从 2025 年 12 月到 2026 年 8 月增加了约 124 倍，实验执行次数也增加了 1.7~1.8 倍。 🔁 性能提升驱动研究自动化，更多实验加速下一代模型开发，反过来又提升性能，形成循环结构。 ⚠️ 目前还难以视为完全的递归自我改进阶段，研究方向和模型部署等核心判断仍由人类负责。 💡 模型效率提升后，单个任务的令牌和成本减少，但任务变长、代理并行运行时整体推理需求反而增大。 🔌 实际上，将 Astra 的 GPU 分配量减少 59.2% 后，节省的约 85% 资源又流向其他实验，导致其他模型分配量增加 17.2%。 ♻️ 效率提升并不减少计算需求，而是多余资源立即重新投入额外研究。 🏗️ 迄今 AI 多以 API 形式叠加到软件特定功能上，但今后代理取代整个业务流程的可能性更大。 🌐 当代理跨多个软件处理用户业务本身时，现有的 SaaS 角色也可能动摇。 🛠 软件公司需超越附加 AI 功能，将自家产品转变为代理工作舞台。 📏 过去比较令牌单价和模型性能，今后工作成功率、工作完成成本以及节省的人力时间将成为更重要的标准。 💰 即使模型稍贵，若能少依赖人力并完成任务，实际经济收益可能更大。 ⚖️ 竞争天平正从“谁制造最聪明模型”转向“谁能长期稳定低成本完成实际业务”。#文字观点", "publish_time": "2026-09-08 07:52", "tags": ["文字观点"]}, "post:2026-09-08T07-53:e578ab5468aa": {"id": "post:2026-09-08T07-53:e578ab5468aa", "kind": "post", "title": "2026-09-08 07:53", "source_label": "帖子正文", "excerpt": "【国海海外】小米集团（1810HK）秋季旗舰新品发布会Highlights：为进一步刺激全年汽车销量，新车定价仍维持20~30万元价格带#玄戒芯片：①玄戒O3：采用3nm。CPU采用十核全大核架构，CPU多核性能相比上代提升60%。", "content": "【国海海外】小米集团（1810HK）秋季旗舰新品发布会Highlights：为进一步刺激全年汽车销量，新车定价仍维持20~30万元价格带#玄戒芯片：①玄戒O3：采用3nm。CPU采用十核全大核架构，CPU多核性能相比上代提升60%。GPU采用16核G2-Ultra NX，性能较上代提升85%。搭载了为大模型深度优化的NPU，Tensor算力200TOPS ②玄戒O100：高带宽AI加速芯片，采用6nm 3D晶圆级堆叠，达到1.22TB/s的超高带宽 ③玄戒D100：国内首颗3nm智驾芯片，采用20核高性能CPU，16核高算力NPU，最高160GB统一内存，支持200B模型本地运行#消费电子终端：①折叠机-小米18Fold：搭载玄戒O3芯片，采用长鑫LPDDR6，2亿像素主摄（采用三星HP5旗舰CIS芯片），使用双层UTG超薄玻璃，柔性屏幕触控（采用创新有机柔性材料，定价10999元起步，于9月10日10点正式开售 ②小米平板9 pro max也搭载玄戒O3，起售价4799元#小米汽车①N70系列为中大型五座增程SUV，用纯电车高效的热管理技术做好增程车，空间更大、安全配置更强、灵活好开，智能满配。N70 Max基于Pro版本的基础上，增加了双电机四驱、154km续电续航（24kWh电量）、空气弹簧（连续阻尼可变减震器）、HUD抬头显示。售价方面，#N70Pro定价20.99万元，#N70Max定价23.99万元，低于此前上市的车型。 ②#N90Max定价26.99万元，为大七座旗舰增程SUV，既是商务旗舰，又是家庭旗舰，CLTC综合续航1705km。#N90Max探索版定价29.99万元，配备升降顶舱#文字观点", "publish_time": "2026-09-08 07:53", "tags": ["玄戒芯片", "消费电子终端", "小米汽车", "文字观点"]}, "attachment:files/强势股脱水 260907.pdf": {"id": "attachment:files/强势股脱水 260907.pdf", "kind": "attachment", "title": "强势股脱水 260907", "source_label": "其他", "excerpt": "364.98 1702.00 206.10 46.120907强势股脱水 | 交期延长至 12-14个月，本土自 给率不足 5%的AI硬件缺上加缺 2026/09/07 17:26 ①光通信： AI模型迭代带动算力集群扩容，光模块延续高景气，头部厂商单季归母净利润同比增 长两倍以上并积极锁产；预付账款与存货显示行业备货力度空前，两家龙头合计潜在可交付模块 超", "content": "364.98 1702.00 206.10 46.120907强势股脱水 | 交期延长至 12-14个月，本土自 给率不足 5%的AI硬件缺上加缺 2026/09/07 17:26 ①光通信： AI模型迭代带动算力集群扩容，光模块延续高景气，头部厂商单季归母净利润同比增 长两倍以上并积极锁产；预付账款与存货显示行业备货力度空前，两家龙头合计潜在可交付模块 超2800万只；光电转换正向芯片附近迁移， CPO成为更高交换容量下的中长期主线。 ②ABF载板：新一代 AI芯片封装面积大幅增加，载板供应缺口预计从 2026下半年的 8%-10% 扩大 至2028年的42%-51% ；上游增层膜由海外单一厂商垄断，削减对大陆供货后本土自给率不足 5% 的矛盾凸显，国产化导入提速；这家内资载板龙头上半年封装基板收入同比增长 110.76%，高端 产品规模化量产。 ③机器人：头部本体企业中报收入高增，人形机器人收入同比增长 14倍以上、销量 921台，量产 叙事落到报表与订单；零部件从送样验证跃迁至批量供应，一家精密制造企业上半年人形零组件 交付量已超去年全年；上半年国内人形机器人出货量占全球 97%，量产验证进入关键窗口。 本文是对当日大涨公司进行研报深度复盘，相关个股信息仅供参考，不构成投资建议。 1、光通信：靠大光和大饼 （1）大涨题材：光模块 +CPO 行业上， OpenAI正式发布新一代模型 GPT-6 Astra表现惊艳，黄仁勋表示 “GPT -6 Astra使用超 过10万块英伟达 Grace Blackwell NVLink72 训练完成。 AGI已经到来。下一步 40万块GPU即将 上线。 ” 此外，外资大行高盛上调光模块预测，预计 2028年市场规模达 1485亿美元，同时给出光模块 龙头中际旭创超高目标价。 国内方面，作为全球光电行业的风向标盛会，第二十七届中国国际光电博览会将于 9月9—11 日在深圳国际会展中心举办。 行情上，多重催化下，光通信相关产业链迎来爆发，剑桥科技等涨停，太辰光、源杰科技、 中际旭创等涨超 10%。 01   （2）研报深度复盘（申万宏源、国盛证券、中泰证券）：备货空前 ①中报面延续高景气。 SW 通信 26Q2 营收增长 6% ，毛利率提升至 30% ，景气度排序上光模块 光芯片居首，其后依次为光器件、光纤、网络设备等环节。龙头厂商中际旭创二季度归母净 利润79亿元，同比增长 228% ，与新易盛同保持 40% 以上毛利率，并均在积极锁产。 ②往交付端看，预付账款代表企业已支付但尚未收货的资金，本质是正在锁定的上游产能， 属于景气度的前置信号；剔除发出商品后的存货，才能真实反映已到位的交付储备。从中报 数据看，模块厂预付款普遍大幅增长，头部厂商库存水平可支撑约半年的生产消耗；按单位 成本与均价折算， 两家头部厂商合计潜在可交付模块数超过 2800 万只，为下半年持续出货提 供物料保障。 ③技术路线上，光电转换位置正从前面板移向 ASIC 附近，以压缩越来越难补偿的高速电信号 传输。 NPO 把可独立制造、测试和更换的光引擎部署到 ASIC 附近，保留良率隔离与维修弹 性，是当前近封装光学较现实的工程化过渡平台； CPO 进一步将交换 ASIC 与光引擎共同封 装，是交换容量向 102.4T 及以上演进的中长期主线。产业链价值将向高功率 CW 激光器、 ELS、 FAU 、高密度连接等环节重新分配， 其中FAU 与高密度连接的增量相对更具普适性 。 2、ABF：一样稀缺 （1）大涨题材： PCB   作为算力硬件另一大核心， PCB 今日也表现突出，其中的 ABF 载板细分据调研称交期延长至 12-14个月，全球六大 ABF 基板供应商产能已基本售罄。 原因主要是新一代 ASIC 与 GPU 平台规格快速升级，先进封装芯片体积持续放大，单颗芯片占 用产线时间显著增加，同时上游 ABF 增层膜供应极度集中，全球 90% 以上甚至 95% 的 ABF 增层 膜供应由日本味之素一家公司掌握，味之素部分产能已被预订至 2027 年，新工厂计划 2028 年 动工、 2032 年投产， 2032 年前无大规模新产能释放。 行情上，深南电路旗下广州广芯封装基板项目已累计投资 47.76 亿元，项目进度 77.7% ，包括 BT类产品和 ABF 类产品，公司今日涨停。 02   （2）研报深度复盘（天风证券、华鑫证券、国盛证券）：交期拉长 ①市场机构预测， ABF 载板供应缺口 2026 年下半年约 8%-10% ， 2028 年上看 42%-51% ；客户 已开始洽谈 2029 年之后的长期产能承诺，部分二线供应商甚至以竞标方式拍卖剩余产能。增 层膜环节，味之素近期削减中国大陆市场 30% 供货量， 大陆ABF 本土自给率不足 5% 的矛盾进 一步凸显 ，本土厂商验证与量产导入正在加速。   ②国产化进展方面，华正新材 CBF 积层绝缘膜已在国内主要 IC 载板厂商开展验证，青山湖研 发中心与产线具备批量订单交付能力；另一家从调味品跨界的企业借鉴味之素路径，通过公 开摘牌取得类 ABF 膜厂商 46% 股权，产品已进入头部 IC 载板与 PCB 厂商供应链。 ③平台型厂商方面，深南电路 2026 上半年实现营收 153 亿元，归母净利润同比增长超六成，其 中封装基板业务收入同比增长 110.76% ； FC-BGA 高端载板 22 层及以下产品已规模化量产、更 高层数研发打样按期推进；无锡 AI 算力电子电路项目建成后，将提升 AI 服务器与交换机用高 速、高密、高多层 PCB 的供给能力。 3、机器人：都回来了？ （1）大涨题材：机器人 科技方面，机器人关注也较高，市场传出加单新闻。 根据此前特斯拉规划，三四季度是人形机器人产能爬坡关键验证期。机构表示，其人形机器 人战略已全面进入 “ 施工图 ” 阶段：弗里蒙特工厂开始改造为 Optimus 专属产线，长期规划上， 年产能达 100 万台，德州超级工厂同步搭建第二代生产线（ 1000 万台）。 AI 层面，特斯拉已完 成AI5芯片流片。 此外， OpenAI 新模型展现出的 AI 多模态进化能力也为机器人带来加成。 行情上，美格智能、浙江荣泰等多股涨停。 03   （2）研报深度复盘（国联民生证券、国金证券、万联证券）：报表兑现 ①本体端率先兑现。宇树科技上半年实现收入 11.52 亿元，同比增长 48.54% ；优必选全尺寸人 形机器人收入同比增长 1445% 、销量 921 台，同比增近二十倍， 量产叙事从概念宣讲落到报表 与订单。 ②除本体外，核心零部件同步越过送样阶段、进入小批量交付。拓普集团成立独立的机器人 执行器事业部，产品由执行器向躯体结构件延伸；三花智控机电执行器批量交付与产线爬坡 并行推进；长盈精密上半年人形机器人精密零组件交付约 86 万件，已超过 2025 年全年 69 万件 的交付量 。 ③产业侧， 2026 年上半年中国人形机器人出货量已超 4 万台、全球占比 97% ； Figure 与 AI 基础 设施公司 Nscale 签署战略合作，计划基于英伟达新平台部署最高 10 万颗 GPU 、初始算力承诺 35亿美元；智元机器人开源强化学习数据集，星尘智能发布面向异步推理场景的在线强化学 习框架。 研报来源   本资讯中的内容来自持牌证券机构，意见仅供参考，并不构成对所述证券买卖做出保证。投资者不应将本资讯作 为投资决策的唯一参考因素。亦不应以本资讯取代自己的判断。 本文内容和观点不代表选股通 APP平台观点，请独立判断和决策。在任何情况下，选股通 APP不对任何人因使用 本平台中的内容所引致的任何损失负任何责任。申万宏源，刘菁菁， A0230522080003 ，通信行业 26H1总结：通信，光互联景气度延续，光 模块光器件领跑。 2026年9月3日 国盛证券，宋嘉吉， S0680519010002 ，通信行业：预付款里的 “发货密码 ”—从中报看光模块 的交付储备。 2026年8月30日 中泰证券，王芳， S0740521 120002，通信设备行业从铜互联、可插拔光模块到 NPO与 CPO：光学向芯片靠近， AI算力互联的演进主线。 2026年8月29日 天风证券，孙潇雅， S1110520080009 ，电力设备行业点评： AI促进ABF膜国产化加速。 2026 年9月2日 华鑫证券，庄宇， S1050525120003 ，AI算力行业周报：英伟达发布 NVHBM重构内存架构， ABF载板交期拉长。 2026年9月1日 国盛证券，佘凌星， S0680525010004 ，深南电路：深耕电子互联数十年，内资领先 PCB+IC 载板供应商。 2026年9月6日 国联民生证券，汪海洋， S05905251 10064，人形机器人行业周报：技术迭代与资本共振，人 形机器人产业化持续提速。 2026年9月7日 国金证券，陈传红， S1130522030001 ，机器人行业点评：机器人板块中报总结。 2026年9月 2日 万联证券，李晨崴， S02705251 10001，人形机器人行业跟踪报告： Figure推出index项目， 通过全球用户采集真实任务数据。 2026年9月1日 *免责声明：文章内容仅供参考，不构成投资建议 *风险提示：股市有风险，入市需谨慎 选股通 APP  ", "status": "extracted"}, "attachment:files/A股与港股复盘20260908.pdf": {"id": "attachment:files/A股与港股复盘20260908.pdf", "kind": "attachment", "title": "A股与港股复盘20260908", "source_label": "其他", "excerpt": "A股与港股复盘 2026年9月8日 研究笔记 · 不构成投资建议 第 1 / 15 页 股票市场复盘 油价重燃 日元狂飙 2026年9月8日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 外盘油价与利率压力重新抬头，A股因此把周一算力硬件领涨的成长行情反手做了回来——资金从拥挤的半导体、算力、电", "content": "A股与港股复盘 2026年9月8日 研究笔记 · 不构成投资建议 第 1 / 15 页 股票市场复盘 油价重燃 日元狂飙 2026年9月8日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 外盘油价与利率压力重新抬头，A股因此把周一算力硬件领涨的成长行情反手做了回来——资金从拥挤的半导体、算力、电池撤向石油石化、农业、地产、煤炭、医药等低估值顺周期方向。这是一次高低切换而不是风险规避：涨停73家、跌停0家、上涨3,305家，两市成交约1.96万亿元，与周一基本持平；港股跟随外围小幅回落，恒生科技最弱。 隔夜袭击致沙特多处能源设施停产、布伦特逼近100美元（+3.3%）、美债10年收益率重回4.80%、逼近8月的19个月高位，外盘的油价-利率压力因此重新抬头；A股顺势把周一算力硬件领涨的成长行情反手做回来，创业板跌1.2%、科创50跌1.5%、宁德时代跌3.7%、寒武纪跌3.1%，资金切向石油石化（中国石化涨4.1%）、农化种植（亚盛集团、敦煌种业、中粮糖业涨停）、地产、煤炭、医药，上证靠这些顺周期权重收涨0.2%到3,941点；但这是高低切换不是恐慌——涨停73家、跌停0家、3,305家上涨，两市成交约1.96万亿元，与周一基本持平。港股跟随小幅回落，恒指跌0.4%、恒生科技跌1.6%，中芯国际跌4.3%、联想集团跌6.2%，能源股（中海油、中石化）逆势走强。 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 A股与港股复盘 2026年9月8日 研究笔记 · 不构成投资建议 第 2 / 15 页 本日报要 主线段： 今天是把周一反过来的一天。周一A股走的是算力硬件领涨的普涨行情，创业板涨3.4%、科创50涨2.4%、深证成指涨1.9%，上证只涨0.1%——成长赛道的钱把中小盘和题材一起抬起来。周二隔夜风向变了：中东冲突再度升级，袭击导致沙特多处能源设施停产，胡塞武装宣称发动新一轮打击，霍尔木兹改道延续，布伦特原油一度逼近100美元、涨3.3%，WTI涨2.8%到94美元；美债10年收益率回到4.80%、重新逼近8月盘中4.82%的19个月高位，30年到5.27%；金价反而跌0.8%——外盘涨的是能源不是避险资产，上周「地缘溢价部分回吐、滞胀式利率冲击已退潮」的判断，两个交易日就作废了。A股顺着这个背景做了高低切换：拥挤了一个多月的半导体、算力硬件、电池、消费电子集体走弱，半导体板块跌1.3%、消费电子跌1.1%、电子板块主力资金净流出约92亿元居首，宁德时代跌3.7%、寒武纪跌3.1%、工业富联跌2.7%、中芯国际跌2.1%，创业板指跌1.2%、科创50跌1.5%。撤出来的钱去了低估值和顺周期：农化制品板块涨4.6%、石油石化涨3.6%、煤炭涨3.0%、医疗服务涨2.9%、房地产涨2.0%、钢铁涨2.4%，中国石化涨4.1%、中国石油涨2.5%，亚盛集团4连板、敦煌种业3连板、中粮糖业涨停带动种植与农产品加工。上证指数因此逆着深市收涨0.2%到3,941点，靠的是石油石化和资源权重。关键是，这不是一次恐慌出逃：全天涨停73家、跌停0家，上涨3,305家对下跌1,877家，两市成交约1.96万亿元、和周一的约1.95万亿基本持平——量没有萎缩，是同一批钱在两个风格之间搬家。港股是这条链的跟随端：恒指低开后全天在低位徘徊、收25,317点跌0.4%，恒生科技跌1.6%，中芯国际跌4.3%、联想集团跌6.2%、快手跌2.8%、小米跌2.1%，硬件和互联网权重一起弱；但港股的能源股跟A股同向走强，中国海洋石油涨3.9%、中国石油化工股份涨4.0%、兖矿能源涨3.5%。南向资金连续第二日净买入、且力度较周一明显放大（见互联互通）。 A股： 上证指数收3,941点涨0.2%，深证成指收13,703点跌0.5%，沪深300收4,559点跌0.4%，创业板指收3,360点跌1.2%，科创50收1,591点跌1.5%，中证500涨0.1%、中证1000涨0.3%，上证50收2,909点跌0.1%，北证50收1,086点跌1.0%。沪市成交9,155.7亿元、深市成交10,447.7亿元，两市合计约19,603.4亿元，与周一约1.95万亿基本持平（沪市较周一放量、深市基本持平）。涨跌家数（两市，交易所口径）3,305:1,877:102，计入北交所为3,465:2,044:117；涨停73只、跌停0只（东方财富官方涨停板/跌停板池），盘中炸板38家，最高连板为爱仕达（002403，4板，小家电）、百大集团（600865，4板，一般零售）、亚盛集团（600108，4板，种植业，封板资金全场居首约5.55亿元）。 A股与港股复盘 2026年9月8日 研究笔记 · 不构成投资建议 第 3 / 15 页 港股： 恒生指数收25,317点跌0.4%（低开25,252、全日最低25,226），国企指数收8,397点跌0.4%，恒生科技收4,455点跌1.6%（最低4,447）。恒指成分成交约2,061.7亿港元（腾讯行情口径），较周一约2,096.7亿港元微缩，两日都远低于上周五反弹日的约2,768.6亿港元；国企成分约541.7亿、恒生科技成分约521.4亿港元。恒指波幅指数收17.5、跌1.9%——现金盘小跌、波幅指数也回落，对冲波动的成本没有上升。 货币与汇率： 央行9月8日以固定利率、数量招标开展10亿元7天期逆回购，中标利率1.40%持平；近一周7天逆回购存量已压到零附近、当日到期量极小，公开市场净投放约10亿元、规模象征性。9月7日已按计划等量续作5,000亿元3个月期买断式逆回购（到期日12月5日），当月中期流动性等量对冲；无MLF、无降准，政策利率与LPR（8月20日报价）未动。人民币中间价报6.7804，较周一6.7795下调9个基点（人民币中间价 导体设备周期里最值得拆开研究的一块。先看 DRAM 供给： 2026 DRAM 位元供给：+32% 2027 DRAM 位元供给：+38% 其中： HBM 位元增速｜+55% / +57% 非 HBM DRAM｜+30% / +36% 如果 2027", "content": "HBM 设备需求量的测算逻辑 HBM 可能是这轮半导体设备周期里最值得拆开研究的一块。 先看 DRAM 供给： 2026 DRAM 位元供给：+32% 2027 DRAM 位元供给：+38% 其中： HBM 位元增速｜+55% / +57% 非 HBM DRAM｜+30% / +36% 如果 2027 年 DRAM ASP 再成长约 10%，搭配 38% 位元供给增速，DRAM 市场规模可能进一步大幅扩张。 但我觉得设备端更有意思的问题其实是： HBM 从 12‑high 改成 8‑high，设备需求是不是就会下降？ 答案没有这么简单。 Rubin Ultra 预计可能同时存在不同 HBM 配置： HBM4e 8‑high HBM4 12‑high HBM4 8‑high 12‑high 为了塞进相同封装高度： 晶片厚度必须下降约 40%， 晶片间间距也缩小约 13%。 所以 HBM 堆得越高，真正困难的不是单纯 “多几颗晶片”。 而是： 怎么确保十几层超薄晶片可以精准堆叠，而且良率还能维持。 这让几个制程管控环节变得非常重要： ①凸点检测 ②晶片对位 ③翘曲管控 ④先进封装检测 因此，即使 HBM 从 12‑high 调整到 8‑high，也不代表制程步骤或设备需求会等比例下降。 真正值得追踪的反而是另一件事： HBM 能不能顺利走向 16‑high 甚至更高？ 如果能持续往 16‑high+ 发展，混合键合与更高强度的制程管控需求可能进一步出现。 但如果 HBM 技术路线最后停留在较低堆叠高度，混合键合导入速度可能慢于预期，制程管控强度也可能较早见顶。 所以 HBM 的设备投资逻辑，不能只看： 「HBM 出货多少？」 还要看： 堆叠高度 × 晶片厚度 × 良率 × 封装复杂度 × 检测强度 HBM 表面上是存储器相关逻辑， 但设备端看下去，其实越来越像一场良率管理加上制程管控的问题#文字观点", "publish_time": "2026-09-08 20:00", "tags": ["文字观点"]}, "post:2026-09-08T08-01:8f307d9cafe3": {"id": "post:2026-09-08T08-01:8f307d9cafe3", "kind": "post", "title": "2026-09-08 08:01", "source_label": "帖子正文", "excerpt": "DRAM 及晶圆厂设备支出相关测算数据💾 DRAM：预计 2026/27 年 DRAM 晶圆厂设备支出（WFE）将超过 1200 亿美元，我们模型显示2026 年为 530 亿美元（同比 + 70%），2027 年为 700 亿美元（同比 + 33%）。🔬 先进行逻辑：预计先进行逻辑晶圆厂设备支出（", "content": "DRAM 及晶圆厂设备支出相关测算数据💾 DRAM：预计 2026/27 年 DRAM 晶圆厂设备支出（WFE）将超过 1200 亿美元，我们模型显示2026 年为 530 亿美元（同比 + 70%），2027 年为 700 亿美元（同比 + 33%）。 🔬 先进行逻辑：预计先进行逻辑晶圆厂设备支出（WFE）在 2026 年增长 72%，2027 年增长 50%。 📊 市场对 2027/2028 年约 2300 亿美元 / 3000 亿美元的预期。 💡 估计每 GW 的 WFE 与 Vera Rubin（34 亿美元）大致一致。 ☁️ 超大规模云服务商资本支出在 2027 年达到 1.2 万亿美元，相当于29GW 的计算能力。 🏭 2027/28 年 TeraFab 晶圆厂设备支出（WFE）20 亿美元，2029 年 60 亿美元。 📈 模型显示 2026/27 年位供应增长 32%/38%，其中HBM 位增长 55%/57%，非 HBM 位增长 30%/36%。 💰 估计 DRAM 总潜在市场规模（TAM）为 9790 亿美元，基于 ASP 上涨 10% 和供应增长 38%。", "publish_time": "2026-09-08 08:01", "tags": []}, "post:2026-09-08T17-31:dd85e79ddd37": {"id": "post:2026-09-08T17-31:dd85e79ddd37", "kind": "post", "title": "2026- 务协议，预计总金额7.96亿元 48、博瑞传播：公司旗下每经科技2026年重点推广新增的AI舆情和GEO服务等产品线，核心产品雨燕智宣已接入通义千问大模型并入驻阿里云百炼平台，客户覆盖金融、政府、上市公司及媒体领域 49、黑猫股份：国内炭黑行业龙头；公司介孔碳产品已进入中试阶段，目前中试产品已送客户试样推广，主要用于硅碳负极材料及电容炭领域 50、法尔胜：1、参股的普天法尔胜光通信有限公司主要产品为光纤预制棒、光纤、光缆，上述产品可以应用于在运营商基础网络通信及广播电视通信领域；2、公司成功推出了性能优良的熊猫型保偏光纤，产品成功应用于神州七号和天宫一号等国家重大特大型号任务中 51、中粮糖业：国内糖业巨头，覆盖糖全产业链，糖总经营量300万吨，占全国糖总消费量的20% 52、合众思壮：1、北斗导航行业龙头企业之一，拥有完整军工资质；2、在无人驾驶领域，公司目前主要聚焦非道路工程机械无人驾驶技术的研究，并在农机自动驾驶系统领域已经实现规模化应用 53、华锦股份：公司偏三甲苯产能2.8万吨 54、深物业A：深圳国资委控股的深圳投资控股公司旗下；主营房地产开发、房屋租赁、物业管理，餐饮业务和仓储业务 55、保龄宝：国内功能糖龙头之一，全球5家赤藓糖醇生产商之一 56、天禾股份：公司目前已在试点地区开展农业植保无人机代理销售，未来将视市场情况在省内部分种植核心区代理农业植保无人机的销售工作 57、苏垦农发：公司是国内一体化种植龙头，拥有耕地119万亩，一季度净利润同比增加16.66% 58、永安药业：公司是牛磺酸行业龙头 59、金牛化工：1、公司主营业务为控股子公司金牛旭阳的甲醇生产和销售，产能为20万吨/年，采用焦炉气制甲醇工艺；2、公司签4.36亿元风力发电机组设备采购合同 60、中曼石油：公司业务涵盖勘探开发、油服工程、石油装备制造，已形成成熟完备的钻采一体化服务能力，油气装备涵盖从钻机整机到顶驱、泥浆泵、自动猫道等关键部件一系列产品体系 61、武汉凡谷：公司微波器件产品（如微波双工器、微波滤波器）是卫星中继通信和微波点对点通信的核心部件 62、贵州燃气：公司拟发行股份购买贵州页岩气勘探开发有限责任公司100%股权，标的公司实现高纯气体生产领域零的突破，高纯氦气日均产出超200立方米 63、三孚股份：1、商务部对原产于日本的进口二氯二氢硅实施临时反倾销措施，唐山三孚电子材料曾代表国内产业提起调查申请；2、公司电子特气产品应用于存储芯片等领域 64、和邦生物：公司化肥产品主要为通过联碱法生产的氯化铵，设计年产能为125万吨/年 65、赤天化：贵州最大的甲醇生产企业；公司化工业务涵盖尿素、甲醇及复合肥的生产和销售，具备年产52万吨尿素、10万吨复合肥、5万吨车用尿素的生产能力 66、众泰汽车：汽车整车制造企业，拥有众泰、江南、君马等自主品牌；25年大幅减亏 67、瑞尔特：公司注册地位于福建厦门海沧区，专注于卫浴配件产品和智能卫浴产品 68、世联行：公司专注房地产服务，旗下拥有“红璞公寓”、 “世联空间”、“小样社区”等多个品牌 69、奥浦迈：公司专门从事细胞培养产品与服务 70、科森科技：1、公司为某品牌家用机器人提供相关结构件；2、公司与清陶能源共同投资设立了合资公司——科森清陶能源科技有限公司，专注于固态电池的集成、组装和系统集成等业务#市场段子#文字观点", "publish_time": "2026-09-08 17:31", "tags": ["市场段子", "文字观点"]}, "post:2026-09-08T15-37:3d8cb1390a0d": {"id": "post:2026-09-08T15-37:3d8cb1390a0d", "kind": "post", "title": "2026-09-08 15:37", "source_label": "帖子正文", "excerpt": "⭕深度报告复盘：《美国多年对华新能源持续施压，但股价核心矛盾仍是行业需求、盈利能力等经济指标》#🥇【21号】中信建投电新⭐美多年来持续对华新能源供应链打压限制，核心意图为#推动制造业回流。但：1️⃣若需求刚性但替代供应不足，政策“严表态、缓落地”：出现#过渡期、豁免或合规路径。", "content": "⭕深度报告复盘：《美国多年对华新能源持续施压，但股价核心矛盾仍是行业需求、盈利能力等经济指标》#🥇【21号】中信建投电新⭐美多年来持续对华新能源供应链打压限制，核心意图为#推动制造业回流。但：1️⃣若需求刚性但替代供应不足，政策“严表态、缓落地”：出现#过渡期、豁免或合规路径。2️⃣若需求与替代供应兼备泽政策持续加码：#关税、反规避、销售禁令等，依次封堵、逐级挤压。 ⭐报告复盘新能源行业过去数年与美斗争经验及股价表现——结论为： 1️⃣光伏：需求若替代强，中国企业对美出口空间持续收窄。 2️⃣锂电：需求偏弱且企业全球化能力强，不依赖于美国市场，政策冲击仅会对股价形成短期压制（不改变长期趋势）。 ⭐推演储能： 3️⃣储能：我们认为#决定性因素仍为全球出货、储能单位盈利、ROE和现金流，后续核心矛盾为全球需求及上有供应链价格变化情况。#中信建投电新张芷菡/朱玥/李曼亚#文字观点", "publish_time": "2026-09-08 15:37", "tags": ["🥇【21号】中信建投电新", "推动制造业回流", "但", "过渡期、豁免或合规路径", "中信建投电新", "文字观点"]}, "post:2026-09-08T17-22:38e6b650338b": {"id": "post:2026-09-08T17-22:38e6b650338b", "kind": "post", "title": "2026-09-08 17:22", "source_label": "帖子正文", "excerpt": "高盛中国市场日报#交易台指数表现： SCHOMP 上涨 0.20%，STAR 50 下跌 1.52% 上证 50 下跌 0.10%，ChiNext（创业板）下跌 1.15% 沪深 300 下跌 0.36%，中证 500 上涨 0.15% 中国 A 股总成交额：1.98 万亿元人民币 A 股市场行情分", "content": "高盛中国市场日报#交易台指数表现： SCHOMP 上涨 0.20%，STAR 50 下跌 1.52% 上证 50 下跌 0.10%，ChiNext（创业板）下跌 1.15% 沪深 300 下跌 0.36%，中证 500 上涨 0.15% 中国 A 股总成交额：1.98 万亿元人民币 A 股市场行情分化，高股息板块再度跑赢大盘。 板块层面，电池板块走弱是市场关注度最高的行情变化。 消息面上，理想汽车决定采用自研电池，直接带动宁德时代股价走弱。 除此之外，化工板块再度上行，反映出行业供需格局可能发生基本面变化。 CRO 以及国内医药标的同样小幅走高，成为 A 股市场当中的防御配置方向；AI 板块仅反弹一日之后再度回落。 电动车板块整体承受适度抛压；消息层面看，周度新能源汽车订单环比上涨 16%，同比下滑 26%，数据变化主要受新车型发布因素影响。 理想汽车、比亚迪、蔚来周度订单环比增速表现最强，分别为 136%、27%、10%，增长主要来自全新车型以及改款车型上市，例如理想 MEGA 改款车型，以及比亚迪 9 月 2 日发布的海狮 08 EV/DM 车型。 行业数据方面，8 月新能源汽车零售渗透率、批发渗透率分别达到 66%、64%，7 月对应数值为 64%、65%。 资金流向：当前卖方力度略占上风，买卖比例 1.1 比 1。 资金买入方向：CRO、化工板块。 资金卖出方向：AI、必需消费板块。#文字观点", "publish_time": "2026-09-08 17:22", "tags": ["交易台", "文字观点"]}, "attachment:files/华创证券-潍柴动力(000338)2026年中报点评：2Q业绩符合预期，数据中心发电放量提速-260907.pdf": {"id": "attachment:files/华创证券-潍柴动力(000338)2026年中报点评：2Q业绩符合预期，数据中心发电放量提速-260907.pdf", "kind": "attachment", "title": "华创证券-潍柴动力(000338)2026年中报点评：2Q业绩符合预期，数据中心发电放量提速-260907", "source_label": "华创证券", "excerpt": "证 券 研 究 报 告 证监会审核华创证券投资咨询业务资格批文号：证监许可（ 2009）1210号 公司研究 卡车 2026年09月07日 潍柴动力（ 000338）2026年中报点评 强推 （维持） 2Q业绩符合预期 ，数据中心发电放量提速 目标价： 42.4元/49.5港元 当前价： 26.85元/32.14港元 事项： ❖ 公司发布 2026年中报， ", "content": "证 券 研 究 报 告 证监会审核华创证券投资咨询业务资格批文号：证监许可（ 2009）1210号 公司研究 卡车 2026年09月07日 潍柴动力（ 000338）2026年中报点评 强推 （维持） 2Q业绩符合预期 ，数据中心发电放量提速 目标价： 42.4元/49.5港元 当前价： 26.85元/32.14港元 事项： ❖ 公司发布 2026年中报， 1H26营收 1,232亿元、同比 +9%，归母净利 77.0亿 元、同比 +36%，扣非归母净利 61.2亿元、同比 +19%；2Q26营收 606亿元、 同比 +9%，归母净利 46.2亿元、同比 +57%，扣非归母净利 31.3亿元、同比 +18%。 评论： ❖ 2Q业绩符合预期， 扣非稳健增长。 2Q26公司营收 606亿元、 同环比 +9%/ -3%， 同期行业重卡批发 34.3万辆、同环比 +25%/+8% ；毛利率 21.5%、同环比 - 0.6PP/+0.1PP ，重卡主业受新能源、天然气份额波动影响 ；期间费率 13.0%、 同环比 -1.2PP/ -0.2PP，其中财务费率 0.5%、同比 +0.9PP，主因欧元汇兑损益变 动。 1H26利润总额 113.8亿元、同比 +54%，对应利润率 9.2%、同比 +2.7PP， 高于 26年股权激励 9%的全年目标。 另外，中期分红 58%，与 25年全年持平。 ❖ AIDC：1H26电力能力板块占归母净利比例已达 20%。1H26公司发电产品销 量6.5万台、同比 +31%，其中 M系列大缸径发动机 6700台、同比 +32%。同 期数据中心柴发销量 1400余台，已超越 2025年全年总量，并成功切入全球顶 级数据中心及头部云厂商核心供应链。数据中心 气发已成功通过 CE、UL认 证；SOFC已与欧洲、亚太等地区客户签署合作协议 。 ❖ 母公司：营收稳增，但 盈利受重卡需求变化影响 。1H26母公司营收 208亿元、 同比 +7%，其中发动机 175亿元、同比 +8%；毛利率 28.8%、同比 -3.8PP，较 2H25亦下滑 1.4PP，估计与重卡发动机价格竞争及产品结构变化有关。净利 - 投资收益 34.7亿元、同比 -9%，对应该口径净利率 16.7%、同比 -3.1PP。 ❖ 陕重汽 &法士特：盈利能力 修复。陕重汽 1H26整车销量 7.6万辆、同比 +5%， 其中出口 3.1万辆、同比 +16%创历史同期新高，新能源重卡销量同比 +45%； 营收 259亿元、同比 +3%，净利 10.0亿元、同比 +178%，净利率 3.9%、同比 +2.4PP，对应单车净利 1.3万元、较 1H25的0.5万元大幅提升。法士特营收 72亿元、同比 +10%，对应变速箱销量 48.1万台、同比 +4%，净利 3.1亿元、 同比 +92%，净利率 4.2%、同比 +1.8PP。潍柴雷沃营收 105亿元、同比 +7%， 净利 5.9亿元、同比 +3%，净利率 5.6%、同比 -0.2PP。 ❖ 凯傲：净利同比大幅修复，智能自动化业务高增。 凯傲口径， 1H26营收 56.9 亿欧元、同比 +3.5%，其中工业车辆和服务 40.8亿欧元，智能自动化解决方案 16.3亿欧元、同比 +17.6%；净利润 2.08亿欧元、同比 +334%，1H25因效率计 划计提，净利仅 0.48亿欧元，基数较低。 2Q单季营收 29.2亿欧元、同环比 +8%/+5% ，净利 1.15亿欧元、同环比 +22%/+25% 。潍柴口径， 1H26营收 457 亿元、同比 +6%，净利 15.3亿元、同比 +434%，净利率 3.4%、同比 +2.7PP。 ❖ 投资建议： 公司 2Q业绩符合预期， 扣非业绩延续稳健增长；电力能源 柴发、 气发、 SOFC业务持续推进 。根据 2026年中报，我们将公司 2026 -2028年归母 净利预期由 146亿、 176亿、 210亿元调整为 146亿、 202亿、 240亿元，对应 增速 +34%、+38%、+19%，对应 A股PE 16倍、 12倍、 10倍， H股PE 16倍、 12倍、 10倍。潍柴为国内 AIDC主电稀缺标的，我们对其 主业和 AIDC分部 估值，综合给予 27年目标 PE 18.2倍。 A股目标价 42.4元，维持“强推”评 级； H股目标价 49.5港元，维持“强推”评级。 ❖ 风险提示： 宏观经济低于预期、海外经济增长低于预期、 AIDC业务拓展不及 预期、天然气涨价超预期、排放标准相关政策推出不及预期。 [ReportFinancialIndex] 证券分析师：张程航 电话： 021-20572543 邮箱： zhangchenghang@hcyjs.com 执业编号： S0360519070003 证券分析师：李昊岚 邮箱： lihaolan@hcyjs.com 执业编号： S0360524010003 公司基本数据 总股本 (万股 ) 864,022.06 已上市流通股 (万股 ) 495,639.25 总市值 (亿元 ) 2,319.90 流通市值 (亿元 ) 1,330.79 资产负债率 (%) 64.49 每股净资产 (元) 11.09 12个月内最高 /最低价 35.34/13.77 市场表  知识星球：小牛研报纪要 微信：WUXL3408 知识星球：小牛研报纪要 微信：WUXL3408", "status": "extracted"}, "post:2026-09-08T13-33:bf196d46890a": {"id": "post:2026-09-08T13-33:bf196d46890a", "kind": "post", "title": "2026-09-08 13:33", "source_label": "帖子正文", "excerpt": "【国金电子】重点看好海光芯正，全栈硅光公司，产能释放弹性巨大具备全栈硅光能力，自研硅光pic芯片，具备成本优势，已展出1.6T硅光和6.4T NPO产品。实现海外客户突破，与不同客户合作推进800G硅光、1.6T、NPO、CPO解决方案。", "content": "【国金电子】重点看好海光芯正，全栈硅光公司，产能释放弹性巨大具备全栈硅光能力，自研硅光pic芯片，具备成本优势，已展出1.6T硅光和6.4T NPO产品。实现海外客户突破，与不同客户合作推进800G硅光、1.6T、NPO、CPO解决方案。27年产能释放弹性巨大，27年年化光模块产能达1000万只，包含百万只1.6T产能。匹配公司采购公告，27年锁定千万颗DSP芯片。年化收入100e，按照15％净利率计算，当前27年pe仅7X 欢迎联系国金电子樊志远团队 周焕博/应明哲#文字观点", "publish_time": "2026-09-08 13:33", "tags": ["文字观点"]}, "post:2026-09-08T17-22:0548c45928a8": {"id": "post:2026-09-08T17-22:0548c45928a8", "kind": "post", "title": "2026-09-08 17:22", "source_label": "帖子正文", "excerpt": "Evercore 发布 LITE 报告后的买方反馈 初始覆盖后反馈：多头与空头辩论 你需要知道的一切：在我们近期启动对 LITE 的覆盖之后，我们就该股开展了多次讨论，除去 AI 相关带来的抛售因素之外，投资者关注的焦点与质疑主要集中在估值、产能、LITE 与 COHR 之间的对比（相关讨论数量非常", "content": "Evercore 发布 LITE 报告后的买方反馈 初始覆盖后反馈：多头与空头辩论 你需要知道的一切：在我们近期启动对 LITE 的覆盖之后，我们就该股开展了多次讨论，除去 AI 相关带来的抛售因素之外，投资者关注的焦点与质疑主要集中在估值、产能、LITE 与 COHR 之间的对比（相关讨论数量非常多）以及英伟达（NVDA）业务敞口这几个方面。 空头的核心观点是：光通信本质上属于周期性行业，当前行业已经处在周期顶部位置，对于一家过去 12 个月股价涨幅超过 500% 的周期性资产而言，当下的估值倍数处于偏高区间。另外，市场当中存在一种观点，认为市盈率更低的 COHR，是布局该赛道主题的更好选择。 多头则看好 LITE 持续获取定价权的能力，同时公司拥有多元化增长路径，例如 OCS（光交换）、NPO/CPO（近封装 / 共封装光学）、EML（电吸收调制激光器）以及收发器业务，这就意味着即便部分业务发展不及预期，公司依旧可以在数年时间里维持 100% 以上的营收增长。值得一提的是，LITE 的首席执行官在近期一场会议当中表示，受益于 OCS 业务的强劲表现，公司的每股收益运行率可以达到 40 美元，而投资者当下掌握的相关测算数值或许会远高于该水平。现在存在的核心疑问是，OCS 业务的快速放量，究竟来自下游终端需求拉动，还是行业竞争格局变化带来的结果。 空头的担忧…… 1. 周期性资产估值倍数过高：有反对观点提出，光通信本质是周期性行业，随着行业资本开支接近峰值，LITE 很难维持 20 多倍至 30 倍的高估值倍数，尤其是该公司股价过去 12 个月涨幅已经超过 500%。 2. 磷化铟（InP）产能即将释放：磷化铟产能开始加速投产，有可能造成 LITE 的定价权不如过去一年。空头重点提及 LITE 新建的格林斯伯勒工厂、COHR 的 6 英寸可扩展晶圆厂，以及来自国内的供应增量。 3. COHR 更具吸引力：作为和 LITE 最为接近的竞争对手，COHR 当前交易估值存在折价，投资者正在对这家公司展开研究，原因在于伴随 COHR 进一步扩充产能、提升 6 英寸晶圆良率，公司的毛利率存在上行空间。 4. 英伟达（NVDA）敞口：简单来讲，LITE 大约 27% 的营收和英伟达挂钩，所以投资者会提出疑问：为什么不直接投资英伟达？毕竟英伟达估值存在折价，同时股价波动更低、业务布局也更加多元化。 多头的兴奋点…… 1. TAM（潜在市场规模）爆发式增长：市场预计 AI 光通信市场将保持大约 40% 的复合年增长率，到 2030 财年对应潜在市场规模可以达到 900 亿美元。LITE 是少数能够参与 AI 建设全部阶段（纵向扩展、横向扩展、跨域扩展）的公司之一，拥有独特的行业卡位。 2. EML 是护城河：LITE 在电吸收调制激光器领域拥有 50‑60% 左右的市场份额，同时在磷化铟制造环节相比同行具备良率优势，依托自身技术实力，市场预计这一优势还可以继续维持。 3. 利润表上行空间可观：受益于潜在市场规模扩张叠加定价权优势，LITE 有望在未来数年维持 100% 以上的增长。与此同时，AI 业务落地可以显著增厚盈利水平，CPO 以及 OCS 业务的毛利率大约可以达到 60‑70%，公司毛利率拥有向上改善的空间。 4. 供给依旧小于市场需求：即便大量新增产能陆续投产落地，LITE 的出货量依旧相比市场需求缺口大约 30%，该现状会持续对公司定价权形成支撑。#文字观点", "publish_time": "2026-09-08 17:22", "tags": ["文字观点"]}, "post:2026-09-08T11-10:3f43c773b5f0": {"id": "post:2026-09-08T11-10:3f43c773b5f0", "kind": "post", "title": "2026-09-08 11:10", "source_label": "帖子正文", "excerpt": "OCS进展加速！讯石光通信的OCS专题——OCS加速部署，行业前景广阔 华为演讲：Google和英伟达提到在Scale up、Scale out和Scale across全面部署OCS，OCS实现更低成本、低时延、低功耗。", "content": "OCS进展加速！讯石光通信的OCS专题——OCS加速部署，行业前景广阔 华为演讲：Google和英伟达提到在Scale up、Scale out和Scale across全面部署OCS，OCS实现更低成本、低时延、低功耗。千卡集群，OCS相比2层CLOS，提升约10%的吞吐收益。 H3C演讲：OCS光交换相比电交换，时延降低32% 凌云光演讲：DBS技术OCS超高可靠性，已出货OCS产品累计运行188亿端口小时 lumentum演讲：2026年OCS总潜在市场规模（TAM）将超过25亿美元，并随着规模化部署机遇的释放，到2030年增长至超过80亿美元OCS标的推荐 1）腾景科技：同时覆盖MEMS+液晶方案，已实现二维准直器阵列、大尺寸纯YVO2钒酸钇晶体及部分光学元组件量产 2）光库科技：子公司武汉捷普为谷歌OCS主力代工厂，可自供高速环形器、隔离器与光纤阵列等核心无源器件 3）德科立：硅基波导OCS整机商，与欧洲iPronics合作、拥有整机代工能力，可提供SOA光放大器 4）炬光科技：覆盖产品包括高通道密度V型槽阵列、微棱镜透镜阵列等核心光学元件 5）天通股份：薄膜铌酸锂核心供应商，对应下一代单通道400G调制器。 6）凌云光：将展出RDCN光互联解决方案，以光路交换（OCS）与GPU直出光口（光I/O）协同为核心，构建面向千卡级Scale-up和万卡级Scale-out网络的超高速、低时延全光互联架构，支持8×8～384×384灵活光交换。凌云光为Polatis提供OCS交换机代工服务。 7）光迅科技：光迅科技掌握MEMS mirror阵列芯片的设计、封装、测试等关键环节的能力；基于多款阵列芯片的定制开发，可支持覆盖从64×64到384×384端口的全系列OCS产品需求。#文字观点", "publish_time": "2026-09-08 11:10", "tags": ["文字观点"]}, "attachment:files/脱水研报 260907.pdf": {"id": "attachment:files/脱水研报 260907.pdf", "kind": "attachment", "title": "脱水研报 260907", "source_label": "其他", "excerpt": "0光模块里最不起眼的连接件， CPO一来身价暴 涨，FAU从一维变二维垂直耦合；市场规模扩容 10倍以上！", "content": "0光模块里最不起眼的连接件， CPO一来身价暴 涨，FAU从一维变二维垂直耦合；市场规模扩容 10倍以上！ AI芯片电感是三次供电核心元件，这 几家公司已打入英伟达、谷歌产业链 ——0907 脱 水研报 2026/09/07 20:36 今日内容： 1、光模块里最不起眼的连接件， CPO一来身价暴涨， FAU从一维变二维垂直耦合，这些公司率 先卡位。 2、市场规模扩容 10倍以上！ AI芯片电感是三次供电核心元件，这几家公司已打入英伟达、谷歌 产业链。 3、风电板块上半年经营承压， 6月装机出现拐点、 7月招标数据明显提速，下半年需求或逐步释 放。 4、免费配额缩减 +历史结转直接清零，碳市场新规彻底改写行业，半个月内交易量暴涨 132%， 真正的低碳化工工艺迎来重估。 【本文来自持牌证券机构，不代表平台观点，请独立判断和决策】 摘要： 1、FAU耦合： FAU是光模块里连接内外光路的无源小件，精度要到亚微米级，直接影响耦合 效率。 800G用两个 8通道， 3.2T CPO直接上 36通道、还要二维垂直耦合，价值量翻几倍。 全 球FAU市场2025年2.27亿美元， 2030年CPO配套就干到 30亿美元（超 10倍）。 天孚通信、 太辰光、仕佳光子、光库科技这些国内厂卡位高通道 FAU，接康宁 /Coherent/ 英伟达博通的 单。 2、AI芯片电感： 中信建投研报指出，未来芯片电感面临量、价，结构多重驱动。算力增长带 动电感需求量上升、芯片功率提升带动单位电感用量增加、电感性能要求升级带动电感类型 升级及价值量提升。 AI芯片电感从 2025年到2028年市场规模扩容 10倍以上。关注铂科新材、 龙磁科技等。 3、风电拐点： 国金证券研报指出，风电板块上半年经营承压。但 6月以来，国内风电装机出 现明显拐点， 7月以来，国内央国企业主招标明显提速。下半年常规装机旺季背景下，国内需 求将逐步释放。关注金风科技、东方电缆等。 4、碳市场： 全国碳市场扩围后首份覆盖发电、钢铁、水泥、铝冶炼四大行业的统一配额方案 落地，配额边际收紧：燃煤机组基准值下调，预分配比例从 70%降到50%，历史配额结转机 制取消。方案落地半个月，碳市场成交量环比翻倍， 8月成交均价 98.15元/吨，较 7月上涨 9.1%。电力侧，基准值下移叠加调峰补偿算法改向，深度调峰成为火电机组第二条获取配额 的路径；化工侧，新建产能实行等量减量置换，存量工艺间碳成本差异最高超 600元/吨，一 体化龙头和低碳工艺企业迎来价值重估。关注：宝丰能源、华鲁恒升、卫星化学、中盐化 工。 正文： 1、光模块里最不起眼的连接件， CPO一来身价涨， FAU从一维变二维垂直耦 合，这些公司率先卡位   招商证券研报指出， FAU 是光模块里连接内外光路的无源小件，精度要到亚微米级，直接影 响耦合效率。 800G 用两个 8 通道， 3.2T CPO 直接上 36 通道、还要二维垂直耦合，价值量翻几 倍。 全球 FAU 市场 2025 年 2.27 亿美元， 2030 年 CPO 配套就干到 30 亿美元（超 10 倍）。 天孚 通信、太辰光、仕佳光子 、光库科技 这些国内厂卡位高通道 FAU ，接康宁 /Coherent/ 英伟达博 通的单。 1）光模块里最不起眼的连接件， CPO 一来身价暴涨 FAU是光模块核心的无源内连光器件，近年的市场规模跟随高速光模块放量而提升。 FAU 是连 接光模块 / 光引擎内部有源光器件和外部线路的无源光器件，常以 MT-FA 的形态出现， 其制造 精度达到亚微米级，直接影响有源产品的耦合效率和最终信号质量。 01 随着光模块 / 光引擎的传输速率和传输通道数量提升， FAU 的通道数、以及精度、损耗、一致 性等性能指标的要求也同步提升。近年来， FAU 跟随高速光模块的放量而实现量价齐升。 02 2）800G 用 16 通道、 3.2T CPO 直接 36 通道： FAU 无源件价值量翻几倍 CPO/NPO 等高密度互联方案对 FAU 的通道数与技术规格均大幅提升，将为 FAU 提供可观的市 场空间。 以3.2T CPO 光引擎为例，配套的单个 FAU 达 36 通道（ 32 通道单模光纤 +4 通道保偏光纤），制 造难度和价值量远超 800G/1.6T 光模块中由两个 8 通道 FA 组成的 FAU ， FAU 的结构也有所升 级。为了追求更高的密度， FAU 从一维结构迭代至二维结构，并且支持垂直耦合；为了追求 更佳可维护性和更低量产成本， FAU 向可拆卸和被动对准演进。 03   随着Scale up 光互联的渗透率开始提升， CPO/NPO 将催化高通道 FAU 的需求爆发。 Global Information 估计 2025 年全球光模块 FAU 市场规模约 2.27 亿美元，弗若斯特沙利文测算到 2030 年仅CPO 配套 FAU 的市场规模就可达 30 亿美元，是如今光模块 FAU 市场规模的十倍以上。 04 3）中国 FAU 厂商已经卡位 中国FAU 厂商对无源光器件的工艺理解和积累深厚，头部厂商已有较好卡位 20.5%。 #康豪机电估值50.1亿元。本次上市公司收购康豪机电100%股权，交易对价为50.1亿元。发行价格为29.75元/股，因此增发1.68亿股，增发后公司总股份为4.93亿股。标的公司2026-2029年业绩承诺分别不低于3.5、4.0、4.7、5.3亿元。 #估值定价基本符合预期看好公司长期发展。增发后公司总股本为4.93亿，考虑配套融资可能略高于5亿总股本，基本符合我们之前给市场的预期。预计合并后明年主业利润大约为12-13亿元，给予25x PE，对应300e市值。公司明后两年预计累计交付燃机机组1GW，对应单年利润大约为8-10亿，给予30x PE，新增大约300e市值，对应总市值600e。如果按照29年单年1GW交付能力估算，新增大约500e市值，对应总市值800e。当前股价对应增发后市值320亿，仍有较大空间。 ☎️联系人：郭倩倩/葛小川#文字观点", "publish_time": "2026-09-08 09:23", "tags": ["文字观点"]}, "post:2026-09-08T14-44:e352eb1a3af5": {"id": "post:2026-09-08T14-44:e352eb1a3af5", "kind": "post", "title": "2026-09-08 14:44", "source_label": "帖子正文", "excerpt": "劝降书：稻定律在A股打败了韬定律 ——致国产算力、半导体、先进封装诸君的劝降书 诸位搞“韬定律”的朋友： 你们不卷纳米卷时延，不拼光刻拼折叠，逻辑折叠、三维异构、混合键合、超节点互联，一套“时间缩微”替代“几何缩微”的打法，确实比老摩尔定律聪明。国产算力、AI芯片、先进封装、Chiplet、EDA适", "content": "劝降书：稻定律在A股打败了韬定律 ——致国产算力、半导体、先进封装诸君的劝降书 诸位搞“韬定律”的朋友： 你们不卷纳米卷时延，不拼光刻拼折叠，逻辑折叠、三维异构、混合键合、超节点互联，一套“时间缩微”替代“几何缩微”的打法，确实比老摩尔定律聪明。 国产算力、AI芯片、先进封装、Chiplet、EDA适配、晶圆代工与设备材料，一条链讲得天花乱坠，资金也确实抱过团。 但劝你们一句：别把“换道”当成“立刻变现”。 韬定律要落地，混合键合间距、晶圆翘曲、对准精度、良率爬坡、EDA三维时序适配，全是三到五年的工程活；超节点、液冷、光互连、大模型推理商业化，每一个都要资本开支，每一个都要客户真掏钱。 可二级市场上，国产算力链一度把“架构创新”折算成“明年利润”，把“2031年等效先进节点”折算成“下个季度订单”，估值跑到产业前面太远，获利盘一多，流动性稍紧、财报稍不及预期，就是折叠不是折叠、是回撤。 我们稻定律不玩这个。春播、夏管、秋收、冬储，一年几季，亩产多少、粮价多少、转基因渗率多少、抗逆品种卖多少，都是土里长出来的账。强厄尔尼诺扰动全球主产国，小麦、稻米、玉米库存消费比同步承压，国内种业振兴、生物育种扩面、转基因推广目标往8000万亩走，粮价上行再往种子、农化、种植收益传导——这套逻辑不性感，但可验证、可复盘、可被农户用脚投票。 你们韬定律拼有效算力，我们稻定律拼有效亩产；你们怕散热、怕良率、怕估值证伪，我们怕旱涝、怕虫灾、怕政策低价兜底——但人再怎么换显卡，不能不停吃饭；AI再怎么提效，不能替代口粮。 所以别硬扛了。高位算力先减仓，先进封装、半导体设备材料、AI基础设施换成种业、粮食、农化、种植；用稻定律压一压韬定律的波动。等你们良率跑顺、超节点真交付，再回来谈“时间缩微”也不迟。 此致 敬礼 一位老实的种子贩子 顿首 2026.9.8 于玉米地旁#文字观点", "publish_time": "2026-09-08 14:44", "tags": ["文字观点"]}, "post:2026-09-08T17-21:143fbf0fb986": {"id": "post:2026-09-08T17-21:143fbf0fb986", "kind": "post", "title": "2026-09-08 17:21", "source_label": "帖子正文", "excerpt": "【3D打印】苹果工艺代际切换驱动需求激增，重点关注设备龙头 ⚙️事件：苹果9月9日举行秋季发布会，发布iPhone 18 Pro系列及首款折叠屏iPhone；2027年iPhone发布20周年，外观与结构创进一步扩容。", "content": "【3D打印】苹果工艺代际切换驱动需求激增，重点关注设备龙头 ⚙️事件：苹果9月9日举行秋季发布会，发布iPhone 18 Pro系列及首款折叠屏iPhone；2027年iPhone发布20周年，外观与结构创进一步扩容。果链3D打印已从验证迈入规模化量产。 苹果硬件创新周期叠加钛合金结构件“增材替代减材”的工艺代际切换，正推动金属3D打印从穿戴/接口小件向折叠铰链、中框等高价值量环节延伸；产业化奇点临近，设备端有望最先放量，加工服务与后道工艺同步受益。 3D打印板块逻辑：1️⃣3C需求拐点来临，设备弹性显著：钛合金比强度高、质感优，金属3D打印解决传统CNC加工成本高，良率低，周期长的痛点，完美匹配折叠屏与高端穿戴轻薄化需求，#预计果链3D打印设备市场空间有望超120亿元，后续随渗透率与技术变革仍有扩容。 2️⃣苹果示范+安卓跟进，#钛合金向铝合金延伸打开远期空间：苹果折叠机与20周年机型有望成为中框级量产拐点，带动国产安卓高端机型跟进，材料亦有望从钛向铝合金等拓展；3️⃣液冷场景加速：液冷板等场景送样加速。7-8月需求明显加速，铜材3D打印散热件已通过客户测试。#3D打与传统工艺差异化竞争，面向复杂拓扑等传统工艺无法满足的冷板需求。 建议关注： 【3D打印设备】铂力特、华曙高科、大族激光； 【后处理】①CNC：创世纪； ②磨抛：宇晶股份；③PVD镀膜设备：汇成真空（独供） 【核心部件】金橙子、奥普特。#文字观点", "publish_time": "2026-09-08 17:21", "tags": ["钛合金向铝合金延伸打开远期空间", "文字观点"]}, "attachment:files/Barclays-为AI供电：数据中心的政治博弈.pdf": {"id": "attachment:files/Barclays-为AI供电：数据中心的政治博弈.pdf", "kind": "attachment", "title": "Barclays-为AI供电：数据中心的政治博弈", "source_label": "Barclays", "excerpt": "0JPFWGo4rX9ZbZ6McM7NoMpPtRsMiNnNwPfQpPoQbRpOtQvPmMuMwMrRpQ", "content": "0JPFWGo4rX9ZbZ6McM7NoMpPtRsMiNnNwPfQpPoQbRpOtQvPmMuMwMrRpQ", "status": "extracted"}, "post:2026-09-08T08-07:c027793bd9d4": {"id": "post:2026-09-08T08-07:c027793bd9d4", "kind": "post", "title": "2026-09-08 08:07", "source_label": "帖子正文", "excerpt": "为什么 OpenAI 的 GPT-6 Astra 是转折点？（三星证券） - GPT-6 Astra 的真正变化不在于问题解决分数，而在于无需人类监督也能自主完成任务的时间和复杂度的显著增加 - 现有 AI 在任务变长时容易忘记目标或因中间错误而动摇失败，但 Astra 在长时间任务的稳定性和多步骤", "content": "为什么 OpenAI 的 GPT-6 Astra 是转折点？ （三星证券） - GPT-6 Astra 的真正变化不在于问题解决分数，而在于无需人类监督也能自主完成任务的时间和复杂度的显著增加 - 现有 AI 在任务变长时容易忘记目标或因中间错误而动摇失败，但 Astra 在长时间任务的稳定性和多步骤处理能力上有了显著提升 - 如有需要，它能同时运行多个代理，从而扩大了 AI 所能承担的任务范围本身 - 三星证券将此解读为 AI 自主持续工作的“时间视界”扩展的变化 - 即使是同样的 Astra，在标准环境下最高为 62.7%，但在 OpenAI 的提供商适配器环境中可高达 99.9% - 模型本身不变，仅改变状态管理、内存和上下文保持方式，性能就拉开约 37 个百分点 - 提供商适配器是一种延续先前推理状态、压缩旧内容仅保留重要上下文的方式 - 这种方式执行时间增加了 3.7 倍，但令牌减少了 49%，评估成本也从 2.6 美元降至 1.9 美元 - 与之前的 GPT-5.6 Sol 在相同标准环境下仅 7.8% 相比，差距显而易见 - 今后，不仅仅是模型智能，内存、工具、上下文管理和执行环境设计也将成为决定性能的关键因素 - OpenAI 已将 AI 代理正式投入下一代模型研究中 - 目标是超越几天任务的自动化研究实习生，到 2028 年 3 月打造自主性更高的自动化 AI 研究者 - 截至 2026 年 8 月中旬，一名研究员的一天劳动时间相当于约 3.1 天份量的代理任务在运行 - 最初以编码为主，但现在已扩展到执行、监控、调试、问题解决和结果分析 - 研究员开始并行运行多个代理，即使是几小时以上的任务，成功案例也在增加 - 以研究组织员工中位数为基准，代理输出令牌从 2025 年 12 月到 2026 年 8 月增加了约 124 倍，实验执行次数也增加了 1.7~1.8 倍 - 性能提升驱动研究自动化，更多实验加速下一代模型开发，反过来又提升性能，形成循环结构 - 目前还难以视为完全的递归自我改进阶段，研究方向和模型部署等核心判断仍由人类负责 - 模型效率提升后，单个任务的令牌和成本减少，但任务变长、代理并行运行时整体推理需求反而增大 - 实际上，将 Astra 的 GPU 分配量减少 59.2% 后，节省的约 85% 资源又流向其他实验，导致其他模型分配量增加 17.2% - 效率提升并不减少计算需求，而是多余资源立即重新投入额外研究 - 迄今 AI 多以 API 形式叠加到软件特定功能上，但今后代理取代整个业务流程的可能性更大 - 当代理跨多个软件处理用户业务本身时，现有的 SaaS 角色也可能动摇 - 软件企业需超越附加 AI 功能，将自家产品转变为代理工作舞台 - 过去比较令牌单价和模型性能，今后工作成功率、工作完成成本以及节省的人力时间将成为更重要的标准 - 即使模型稍贵，若能少依赖人力并完成任务，实际经济收益可能更大 - 竞争天平正从“谁制造最聪明模型”转向“谁能长期稳定低成本完成实际业务”", "publish_time": "2026-09-08 08:07", "tags": []}, "attachment:files/MS-软件行业观察：北美路演反馈.pdf": {"id": "attachment:files/MS-软件行业观察：北美路演反馈.pdf", "kind": "attachment", "title": "MS-软件行业观察：北美路演反馈", "source_label": "MS", "excerpt": "M Foundation Software Snippets | Europe Feedback from North America Marketing Important events in the world of Software & Services in the week ahead, and key MS research / stories ", "content": "M Foundation Software Snippets | Europe Feedback from North America Marketing Important events in the world of Software & Services in the week ahead, and key MS research / stories from the past week.Morgan Stanley & Co. International plc+ George W Webb Equity Analyst George.Webb@morganstanley.com +44 20 7425-2686 Mark Hyatt Equity Analyst Mark.Hyatt@morganstanley.com +44 20 7677-3663 William Richards Research Associate William.Richards1@morganstanley.com +44 20 7425-0269 Technology - Software & Services Europe Industry View In-Line 1) Feedback from our North America Marketing trip: We returned from joint Software & Services and Semiconductors marketing across New York, Toronto, and San Francisco last week. During European trips earlier in the Summer, live discussion topics skewed towards Semis, with Software interest largely confined to the sector- level and around SAP. In contrast, this trip showed stronger engagement towards Software, a better belief in the sector's durable growth prospects, and conversations that focused on identifying relative winners rather than debating whether the sector itself is impaired. While SAP continued to be a centre of many discussions, there was clear interest in several other names; Amadeus, RELX, and Nemetschek were perhaps the three more frequently discussed names (quick comments on these names after the photo) . Exhibit 1:A late summer view from Presidio park out to San Francisco's Golden Gate bridge Source: Morgan Stanley Research RELX discussions were largely with existing holders who were constructively inclined towards the equity story, but who recognised the lack of obvious near-term Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. Key Takeaways Feedback from our North America Marketing trip Making the Case that SaaS is A.L.I.V.E. Netcompany wins >£200m NHS England contract (#Netcompany) Bloomberg report suggests S&P Global is considering a spin of CapIQ (#Wolters Kluwer) Temenos: 3Q Should Repair the Miss, but 4Q Is the Real Test (#Temenos)September 6, 2026 03:00 PM GMT M Foundation 2catalysts and the likelihood that AI-related debates would persist. Amadeus engagement came from a mix of holders and non-holders looking to learn more about the story, particularly against a backdrop of travel-related headwinds weighing on current performance and a perception of relatively limited AI risk. Nemetschek discussions were mainly non-holders interested in the stock considering its sector-lagged price performance (still down >25% YTD) looking to better understand mid-term growth durability factors, particularly around the recent HCSS acquisition. Lastly, interest in IT Services was limited with sentiment remaining sceptical; Capgemini was brought up a handful of times, but largely to sense-check whether there were any reasons to be more constructive and largely as a footnote at the end of meetings. All in all, a reassuring mood-check from across the pond, and chimed with many of the core points we raised in our recent mid-year outlook: A Pause in the Downtrend, or a New Beginning? 2) Making the Case that SaaS is A.L.I.V.E. As our marketing feedback above suggests, and as we noted in our mid-year outlook, we think there are several reasons why investor sentiment on software has become incrementally positive. Adam Wood (Head of US Software) this week outlined some of the core underlying pillars that he thinks support the AI bull case for the sector. He writes \"While 2Q results did not establish a fundamental case for reacceleration, they provided modest evidence that SaaS remains ALIVE - with Application Control, Less Seat Dependence, Inference Leverage, Value Expansion, and Embedded Distribution providing a moat.\" The high-level summary of the five reasons why SaaS is A.L.I.V.E. in an AI era is shown below. Within his coverage, he remains positive on ServiceNow and Atlassian, with less conviction in Workday and Intuit. He is also modestly more positive on Salesforce given recent rate of change improvement in upside to guidance. See Adam's full note here. •'A' for Application Control: Software will remain the foundational layer on which agents operate, rather than the primary target of replacement. •'L' for Less Seat Dependence: Seat erosion does not imply TAM erosion. •'I' for Inference Leverage: Model commoditization improves SaaS differentiation and margins. •'V' for Value Expansion: AI expands the addressable budget from software to labor spend. •'E' for Embedded Distribution: Distribution remains a durable competitive advantage. 3) Netcompany wins >£200m NHS England contract (#Netcompany ): Thursday's press release indicated a £215m 5-year partnership that will see Netcompany \"operate and transform the digital services that underpin the NHS' national adult screening programmes\", which cover more than 15 million invitations a year including breast, cervical and bowel cancers. The contract is the latest in a string of strategically important deals that Netcompany has won in the UK in recent years, such as a deal signed with HMRC in December 2025 to deliver the next phase of the Trader Support Service for businesses conducting trade between Great Britain & Northern Ireland, with an initial £94m year value (over the initial 5-year term). We eZpWlUxUtVsNrOsNaQaO6MnPnNmOpRfQoOxOfQrRsN6MpOtMuOtQyRvPmRyQ M Foundation Morgan Stanley Research 3think this new £215m NHS deal will flow through Netcompany's revenue base, but the contract will be delivered with an ecosystem of UK partners, and with a commitment from them that at least 33% of contract revenue will be to small and medium-sized businesses. We believe Netcompany will book the total contract revenue through its own P&L, but with partner revenues offset within the cost base. Still, the deal is clearly material versus our pre-existing c. £113m UK revenue forecast for FY26e, and likely means the UK segment remains the highest growth geographical segment in FY27e. Depending on the shape of the contract ramp, perhaps £30m+ / DKK c. 260m+ of revenue contribution in FY27e could imply 2.5% upside to our FY27e revenue forecast and underpin another year of high-single-digit % organic revenue growth, continuing to outperform the broader IT Services sector. As we have discussed recently, our Underweight view here acknowledges a positive view on Netcompany's growth potential, but with greater confidence in rebuilding (recently weak) free cash flow conversion needed for a more positive stance. Exhibit 2:Netcompany has scaled its UK segment revenues (without M&A) at a c. 14% CAGR from DKK 338m in 2018 to DKK 982m (/ €132m) FY26e Source: Company data, Morgan Stanley Research estimates (e) 4) Bloomberg report suggests S&P Global is considering a spin of CapIQ (#Wolters Kluwer ): Toni Kaplan (Head of US Business Services Research) wrote this week that, according to an unconfirmed report by Bloomberg, S&P is exploring a spin-out of its Capital IQ Pro data and research platform. CapIQ is sized at \u003c6% of group revenue. Toni's view is that the potential exploration of strategic options is positive, as it could alleviate the AI-risk overhang on S&P's Market Intelligence segment. Rather than focusing on this specific potential transaction, we address whether portfolio simplification could become a tangible way for companies to address AI-related valuation debates. This feels particularly relevant in Information Services, where many companies operate across multiple, disparate segments and product portfolios. Wolters Kluwer is a good example; it has five segments, each containing several distinct product areas. While this diversification has historically been a strength, we think it has become more challenging for investors over the past 18 months for two reasons. First, the breadth of the portfolio makes it harder to analyse the group and gain comfort around competitive and AI-related risks across every business. Second, concerns around a single product area can cast a shadow over the broader equity story. In our view, this can sometimes become disproportionately important to perceptions of the group. Ultimately, management teams may increasingly need to answer two questions: 1) are the assets under M Foundation 4scrutiny fundamentally challenged, and therefore no longer worth investing in and retaining; and 2) could a sale or spin-out unlock value by removing a perceived drag on the valuation of the remaining group? The second question is particularly nuanced, as management must weigh the realisable value of the asset against the valuation discount it may be imposing on the rest of the company. 5) Temenos: 3Q Should Repair the Miss, but 4Q Is the Real Test (#Temenos ): While 2Q earnings were largely reassuring across our coverage, Temenos was one of the few names that disappointed; it materially missed on the top line, with Subscription & SaaS (S&S) down c. 13% in cc and c. 18% below consensus. Management attributed this to timing rather than demand, with a small number of large European deals slipping beyond quarter-end. Management stated at the time that most of the c. $20m shortfall had already been signed in the first three weeks of July. That gives us confidence Temenos can clear its “at least 30%” 3Q S&S growth guide and largely repair the 2Q miss. But 3Q does not settle the debate – even at 30% growth, 9M26 S&S growth would still be tracking at only c. 8% cc versus the +9% FY26 guide, leaving work to do in 4Q. Our latest analysis implies Temenos would need c. $171m of S&S revenue in 4Q – a record quarter – with subscription licence revenue likely needing to grow >20% y/y for a third straight year. Maintenance may provide some upside, but we think investors will care more about the S&S exit rate given what it says about FY27 and the mid-term ARR story. At c. 23x CY26e P/E post-SBC for c. 8% FY26-28e EPS CAGR, we still see limited room for execution risk and remain Underweight with a CHF59 price target. Exhibit 3:Key week ahead events Monday Tuesday Wednesday Thursday Friday 07/09/2026 08/09/2026 09/09/2026 10/09/2026 11/09/2026 Oracle 1Q27 Results Adobe 3Q26 Results Key MS Europe Coverage Other Global Stocks Industry Event Other Source: Morgan Stanley Research pGK29fQpZKdaSE8JuUQsHgNfhFXiK5vdzWmm6tFQCsIpbUTjyjH29uxk 看点：AI 算力驱动光模块厂商加速扩产，光通信测试需求进入高增通道。公司是国内头部电子测量仪器供应商，可为光模块、AI芯片、电源等下游客户提供测试仪器。", "content": "【长城机械】鼎阳科技 公司看点：AI 算力驱动光模块厂商加速扩产，光通信测试需求进入高增通道。公司是国内头部电子测量仪器供应商，可为光模块、AI芯片、电源等下游客户提供测试仪器。预计年内推出1.6T采样示波器（核心芯片自研，客户与现有源表、电源客户重叠）。#文字观点", "publish_time": "2026-09-08 19:58", "tags": ["文字观点"]}, "attachment:files/深度拆解CPO20260908.pdf": {"id": "attachment:files/深度拆解CPO20260908.pdf", "kind": "attachment", "title": "深度拆解CPO20260908", "source_label": "其他", "excerpt": "微信：WUXL3408 微信：WUXL3408 微信：WUXL3408", "content": "知识星球：小牛研报纪要 微信：WUXL3408 知识星球：小牛研报纪要 微信：WUXL3408 知识星球：小牛研报纪要 微信：WUXL3408", "status": "extracted"}, "post:2026-09-08T17-21:1da07a7382c0": {"id": "post:2026-09-08T17-21:1da07a7382c0", "kind": "post", "title": "2026-09-08 17:21", "source_label": "帖子正文", "excerpt": "易德龙-液冷风机半导体AI服务器明年占利润比例超过一半，驱动公司利润端快速上行： ⭐液冷风机：公司大客户为EBM-papst，受益数据中心爆发EBM公司FY26美国业务增长26%至4亿欧元，美国规划翻倍产能。公司给客户提供风机控制模组，公司墨西哥有稀缺产能27年开始提供整机组装，整机组装净利润率20", "content": "易德龙-液冷风机半导体AI服务器明年占利润比例超过一半，驱动公司利润端快速上行： ⭐液冷风机：公司大客户为EBM-papst，受益数据中心爆发EBM公司FY26美国业务增长26%至4亿欧元，美国规划翻倍产能。公司给客户提供风机控制模组，公司墨西哥有稀缺产能27年开始提供整机组装，整机组装净利润率20%，未来行业增长+公司组装份额提升有望达到20亿以上营收4~5亿利润！ ⭐半导体零部件：给射频电源做控制板组装等，25年0.6亿元营收，26年1.2~1.5亿，每年翻倍指引，未来有望贡献1亿元以上利润 26/27年2.8/3.7亿元对应明年不到15x！#文字观点", "publish_time": "2026-09-08 17:21", "tags": ["文字观点"]}, "post:2026-09-08T07-57:5724e0ad324f": {"id": "post:2026-09-08T07-57:5724e0ad324f", "kind": "post", "title": "2026-09-08 07:57", "source_label": "帖子正文", "excerpt": "今世缘交流要点 20260907行业趋势判断：目前100-300元价位段逆势扩张，高端次高端都是承压收缩，但是次高端体感寒意更深。但长期看，次高端承上启下，会诞生全国化大单品，国缘将继续巩固抢位。", "content": "今世缘交流要点 20260907行业趋势判断：目前100-300元价位段逆势扩张，高端次高端都是承压收缩，但是次高端体感寒意更深。但长期看，次高端承上启下，会诞生全国化大单品，国缘将继续巩固抢位。动销情况：淡雅省内一半以上的区域实现了终端订单和开瓶的增长，#省外从销售规模和开瓶实现了达两位数的增长，四开、对开宴席场次同比增长双位数。库存情况：#二季度库存有所下降，库存主要取决于动销，如果动销是顺畅的，库存就不是大问题。目前动销顺畅，库存良性，未来希望库销比持续向下。产品布局：淡雅现阶段对公司规模起到支撑作用，但中长期结构向上不会改变。百元以内高沟复兴和百元以上V系提升仍是重要增量。三开主要针对苏南乡镇市场，未来会适时推出。经营策略：今年以稳为主，稳百亿大盘，稳市场价盘，稳终端信心。十五五希望增速快于行业，省外快于省内。未来稳固100-500元主线，同时坚定向上突围。省内规模仍在增长，保持深耕。省外安徽和山东2025年度首次销售额过3亿，未来希望贡献度持续提升。欢迎联系详细交流，恳请鼎力支持🏆~#文字观点", "publish_time": "2026-09-08 07:57", "tags": ["文字观点"]}, "post:2026-09-08T09-12:fc80b84fd734": {"id": "post:2026-09-08T09-12:fc80b84fd734", "kind": "post", "title": "2026-09-08 09:12", "source_label": "帖子正文", "excerpt": "#华泰睿思AI行情从科技延伸至基建，涉及全球诸多产业链，传统行业分类已难以承载。我们重构了一套适配AI研究的分层体系，并得出三组结论：产业链内部的轮动由各层级预期盈利增长率的拐点决定，而并非产业链位置或相对估值，据此外推，半导体IP与设备、AI服务器硬件、数据中心基建、AI软件与安全未来数月或相对占", "content": "#华泰睿思AI行情从科技延伸至基建，涉及全球诸多产业链，传统行业分类已难以承载。我们重构了一套适配AI研究的分层体系，并得出三组结论：产业链内部的轮动由各层级预期盈利增长率的拐点决定，而并非产业链位置或相对估值，据此外推，半导体IP与设备、AI服务器硬件、数据中心基建、AI软件与安全未来数月或相对占优；地区格局收敛于中美两极，各有优势，又相互关联；中国A股和港股的AI公司可以分为海外链和国产链，切换取决于海外Capex与国产进展的相对节奏。最后，我们横跨全球挑选头部公司，组成AI全产业链篮子，供投资者选股参考。#文字观点", "publish_time": "2026-09-08 09:12", "tags": ["华泰睿思", "文字观点"]}, "post:2026-09-08T09-12:b3ab8a93624a": {"id": "post:2026-09-08T09-12:b3ab8a93624a", "kind": "post", "title": "2026-09-08 09:12", "source_label": "帖子正文", "excerpt": "#华泰睿思农业银行、工商银行同日公告合计定增募资2600亿元（农行1600亿、工行1000亿），用于补充核心一级资本，财政部、中国烟草为主要认购对象，其中财政部认购金额达2000亿元。本次定增是中央立足经济金融形势、围绕稳增长扩内需化风险推出的一揽子经济增量政策之一，对国有大行长远发展和股东价值提升", "content": "#华泰睿思农业银行、工商银行同日公告合计定增募资2600亿元（农行1600亿、工行1000亿），用于补充核心一级资本，财政部、中国烟草为主要认购对象，其中财政部认购金额达2000亿元。本次定增是中央立足经济金融形势、围绕稳增长扩内需化风险推出的一揽子经济增量政策之一，对国有大行长远发展和股东价值提升具有重要战略意义。我们认为本轮定增通过补充核心一级资本、发挥资本杠杆撬动作用，有利于大行更好发挥服务实体经济、维护金融稳定的压舱石作用，支撑国有大行做优做强，增强业务开展能力与股息支付可持续性。#文字观点", "publish_time": "2026-09-08 09:12", "tags": ["华泰睿思", "文字观点"]}, "post:2026-09-08T09-14:efb6c077fc73": {"id": "post:2026-09-08T09-14:efb6c077fc73", "kind": "post", "title": "2026-09-08 09:14", "source_label": "帖子正文", "excerpt": "📑半导体｜收益风险比向好的区间💡 周期强度持续得到验证，供给紧张程度预计将在 2027 年进一步加剧。💱 虽然存在汇率下行带来的业绩下行风险，但估值修复的逻辑已经确立。", "content": "📑半导体｜收益风险比向好的区间💡 周期强度持续得到验证，供给紧张程度预计将在 2027 年进一步加剧。 💱 虽然存在汇率下行带来的业绩下行风险，但估值修复的逻辑已经确立。 ⚠️ 这是风险回报比具备吸引力的区间，维持目标股价与买入评级。 📊 风险回报比具备吸引力的区间 💸 受汇率下行影响，存在业绩下行风险，宏观不确定性带来的 AI 资本开支延期可能性等因素，会成为制约美光科技股价上行的因素。 ✅ 即便如此，依然维持目标股价与买入评级，理由在于周期强度得到进一步确认，供给紧张加剧的逻辑也愈发明确。 🏭 企业部门与贸易部门（主要是汇率）均会强化相关逻辑，维持对三星电子、SK 海力士的买入评级。 🔍 1.2027 年供给紧张加剧逻辑得到验证 📈 市场此前的共识是，相较于 2026 年，2027 年供给紧张的程度会进一步加剧。过去一个月，机构上调了 2027 年供给紧张加剧的相关目标。 📦 ① 需求端展望：部分高价产品预计 2028 年 HBM 需求达到 400 亿 Gb 以上。 📊 机构测算，2027 年全球 HBM 出货量约 366 亿 Gb。机构判断，设备厂商的出货规划时间窗口将拉长至 5 年以上。 ⚠️ 高价位产品的出货时间存在不确定性，当前行业很难实现 100% 的设备利用率。在产能紧张的环境下，为消化库存，实际需求会明显低于供给。 🌍 在宏观风险降低的海外市场，需求强周期重启的可能性较高。 🏭 ② 供给端的生产约束：市场对生产端的限制因素已经显现。目标价格上调，是因为企业多次上调目标。 📉 但本轮 Fab 产出的产品变化，需要优先向生产端反馈，预计 2027 年全球 DRAM 产出，将被限制在较前期高出 20% 的水平。 💴 2. 汇率下行背景下依然具备韧性 💹 3Q26 汇率下行带来影响，基准汇率 1450 韩元，新假设汇率 1350 韩元。以此为基准，三星电子 3Q26 营业利润预期由 105.5 万亿韩元下调至 74.7 万亿韩元。 📉 此前基准预期：三星电子 110 万亿韩元，SK 海力士 77 万亿韩元。 ⚠️ 即便汇率下行，企业业绩的下行幅度也有限。三星电子 DRAM 产量改善带来效果，SK 海力士 HBM4 量产会拉动 DRAM 平均售价。 🔧 ① 三星电子：DRAM 1c 良率目前预估改善至 80%。基于改良工艺，即便良率继续提升，也存在产能瓶颈。 ⌛ DRAM 1c 的产能释放还需要时间。对比预期，良率改善后的产品功耗效率还有提升空间。 🏭 低功耗环境下，需要把 DRAM 1c 产能优先投入 HBM4 生产，但是良率改善效果，无法完全抵消部分产品的供给增量。 📈 ② SK 海力士：依托 HBM4 量产带来的效果，预计将缩小与竞品的 DRAM 平均售价差距。 🚧 HBM4 产品的认证相关噪声会部分传导至市场，但不会造成大规模供给受限。 📋 投资意见：超配 📌 观点维持，目标价位维持。 ⭐ 三星电子：买入，目标股价 560000 韩元。 ⭐ SK 海力士：买入，目标股价 3200000 韩元。#文字观点", "publish_time": "2026-09-08 09:14", "tags": ["文字观点"]}, "post:2026-09-08T15-55:d26168d5017a": {"id": "post:2026-09-08T15-55:d26168d5017a", "kind": "post", "title": "2026-09-08 15:55", "source_label": "帖子正文", "excerpt": "9月8日复盘笔记：化肥/农药/农牧饲渔/传媒/CRO/光纤/农业/房地产/6G/零售/芯片/煤炭等一、重磅财经信息海关总署：1至8月集成电路累计出口金额达2567.51亿美元，同比", "content": "9月8日复盘笔记：化肥/农药/农牧饲渔/传媒/CRO/光纤/农业/房地产/6G/零售/芯片/煤炭等一、重磅财经信息海关总署：1至8月集成电路累计出口金额达2567.51亿美元，同比增长103.9%。二、大盘表现截止收盘，沪指涨0.20%，深证成指跌0.52%，创业板指跌1.15%，科创50跌1.52%。沪深京三市成交额接近2万亿，较昨日小幅放量。三、强势板块和个股分析备注：只列举部分涨停板化肥/农药周末以来，国内尿素市场行情显著上行。据9月7日最新报价，主流地区中小颗粒尿素出厂报价已上调至1750-1820元/吨，单日涨幅达50-150元/吨。涨停板：华昌化工、和邦生物、川发龙蟒、赤天化、金正大、泸天化、潞化科技、华锦股份、天禾股份其他强势股：川金诺、六国化工、兴发集团、江山股份农牧饲渔泰国糖业协会行业协会表示，始于今年10月的2026-2027榨季，泰国糖产量可能降至1000万吨以下；此外今年全球鱼粉第一大供应国秘鲁受厄尔尼诺现象及幼鱼占比偏高等因素影响，2026年捕捞配额同比大幅下降，供应极度紧张，鱼粉价格大幅上涨。涨停板：中粮糖业、粤桂股份、保龄宝、红棉股份、华康股份其他强势股：三元生物、冠农股份、中水渔业传媒国家版权局印发《版权工作“十五五”规划》。涨停板：中信出版、博瑞传播、中国出版、读者传媒、慈文传媒、上海电影、生意宝其他强势股：龙版传媒CRO随着创新药BD交易持续活跃，药企研发资金趋于充裕，为抢占创新药研发窗口、保障项目进度，药企对外部研发服务的付费意愿提升，CRO企业在手订单呈“量价齐升” 态势。涨停板：永安药业、东亚药业、精华制药、澳洋健康、奥浦迈其他强势股：近岸蛋白、万邦医药、泓博医药、皓元医药、凯莱英光纤工信部印发《信息通信行业发展“十五五”规划》。其中提到，推进算力传输通道 0G、 800G 、 1.6T 光模块用无源内连光器件均\n\n\n### 源杰科技（688498.SH）· 当天提及 1 次\n\n**今日逻辑摘要：** 中际旭创等涨超 10%。\n**重点关注内容提示：** 中际旭创等涨超 10%。\n\n**命中附件原文线索：**\n1. `强势股脱水 260907`\n精炼内容总结：行情上，多重催化下，光通信相关产业链迎来爆发，剑桥科技等涨停，太辰光、源杰科技、 中际旭创等涨超 10%。\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>存储与先进封装景气预期全面上修。DRAM晶圆厂设备支出2026/27年将超1200亿美元，其中2026年为530亿美元、同比+70%，2027年为700亿美元、同比+33%；HBM位元增速预计2026/27年达+55%/+57%。渠道调研显示2027年供应短缺强度将比2026年更严重，有客户提出2028年HBM需求超过400亿Gb，亦有客户希望将合同期限延长至5年以上。\u003c/li>\n\u003cli>AI硬件端涨价与缺货信号密集。英特尔PC CPU预计10月再度涨价10%，低毛利小核产品线或停产退市；服务器CPU产能紧张，景气周期延续至2028年。苹果据称与铠侠签订为期三至五年、不设价格上限的NAND闪存长期供货协议，TrendForce预计256GB版iPhone 18 Pro三季度存储成本将比一年前高出近四倍。\u003c/li>\n\u003cli>GPT-6 Astra被今日多份材料视为AI转折点。核心变化不在于问题解决分数，而在于无需人类监督也能自主完成任务的时间和复杂度显著增加，长任务稳定性与多步骤处理能力明显提升；OpenAI已将AI代理正式投入下一代模型研究中。训练端规模继续放大（超10万块GPU），推理端因电脑操作与长任务执行能力跃迁而扩容，并对互联与液冷等硬件环节形成利好。\u003c/li>\n\u003cli>光通信/CPO/OCS方向出现行情与产业逻辑共振。CPO带动FAU从一维变二维垂直耦合，市场规模扩容10倍以上；光模块头部厂商单季归母净利润同比增长两倍以上并积极锁产，预付与存货显示备货力度空前。盘面上剑桥科技涨停，太辰光、源杰科技、中际旭创等涨超10%。\u003c/li>\n\u003cli>A股资金面出现明显高低切换。今日将周一算力硬件领涨的成长行情反手做回，创业板跌1.2%、科创50跌1.5%，宁德时代跌3.7%、寒武纪跌3.1%；资金切向石油石化（中国石化涨4.1%）、农化种植、地产、煤炭、医药，上证靠顺周期权重收涨0.2%至3941点。LME铜9月7日最高涨至14550美元/吨，突破前高再创历史新高。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>主线1：存储涨价与半导体设备资本开支周期\u003c/h3>\n\u003cul>\n\u003cli>今天强化的逻辑：DRAM晶圆厂设备支出2026年预计530亿美元（同比+70%）、2027年700亿美元（同比+33%）；2027年全球DRAM位元供给预计仅增加20%出头，DRAM平均售价预计2026Q3环比+15.8%、Q4环比+7.2%、2027年同比+23.9%。供给紧张程度预计2027年进一步加剧，周期强度持续得到验证。\u003c/li>\n\u003cli>今天出现的催化/验证：HBM需求端出现“2028年超400亿Gb”级别的客户诉求与5年以上长约诉求；探针卡、KGD测试等检测环节被强调为核心瓶颈，HBM检测被描述为越来越像“良率管理+制程管控”问题。\u003c/li>\n\u003c/ul>\n\u003ch3>主线2：AI硬件缺货与涨价扩散\u003c/h3>\n\u003cul>\n\u003cli>今天强化的逻辑：AI硬件“缺上加缺”成为焦点，交期延长至12-14个月，本土自给率不足5%；英特尔服务器CPU产能紧张延续至2028年，PC CPU涨价10%显示厂商放弃以降价抢份额的策略，转向毛利修复；苹果与铠侠签订多年期无价格上限闪存长约，表明存储采购模式从短期议价转向长期锁量。\u003c/li>\n\u003cli>今天出现的催化/验证：三星得州泰勒工厂本月底将试产2nm芯片，初期月产能5万片且全部产能已被预订满，已获特斯拉、博通等订单；泰勒二期计划年底开工，目标2030年量产。\u003c/li>\n\u003c/ul>\n\u003ch3>主线3：光通信/CPO/OCS及无源器件\u003c/h3>\n\u003cul>\n\u003cli>今天强化的逻辑：AI模型迭代带动算力集群扩容，光模块延续高景气；OCS被Google和英伟达在Scale up、Scale out、Scale across场景中提及全面部署；无源器件在NPO/CPO/OCS时代重要性持续提升，国内企业在本轮产能扩展与客户拓展后有望真正“站起来”。\u003c/li>\n\u003cli>今天出现的催化/验证：光模块PCB向mSAP升级成为重要产业趋势，兴森科技客户当前订单已超产能；剑桥科技涨停，光通信产业链多股涨超10%；FAU环节被测算随CPO切换市场规模扩容10倍以上。\u003c/li>\n\u003c/ul>\n\u003ch3>主线4：AI电力与散热/AIDC基础设施\u003c/h3>\n\u003cul>\n\u003cli>今天强化的逻辑：“超节点、液冷、光互连、大模型推理商业化，每一个都要资本开支，每一个都要客户真掏钱”；数据中心柴发机组热交换系统国产化龙头卡位明确，康豪机电在国内数据中心柴发机组热交换系统占有率72.2%，在中国柴油发电机组热交换系统市场占有率13.6%、排名第一；液冷风机受益数据中心爆发，客户FY26美国业务增长26%至4亿欧元并规划翻倍产能。\u003c/li>\n\u003cli>今天出现的催化/验证：潍柴动力2Q业绩符合预期，数据中心发电放量提速；长源东谷并购康豪机电草案发布，被评价为卡位“缺电赛道”；麦格米特Q4电源出货大概率加速，主要得益于Vera Rubin电源放量。\u003c/li>\n\u003c/ul>\n\u003ch3>主线5：国产算力芯片与AI终端新品\u003c/h3>\n\u003cul>\n\u003cli>今天强化的逻辑：GPT-6 Astra在长时间任务上的稳定性显著提升，可同时运行多个代理，推理期间的安全与运行监控带来增量算力需求；字节加码实时World Model，AI应用从文本走向空间视频生成。\u003c/li>\n\u003cli>今天出现的催化/验证：华为正式发布三折叠手机Mate XT 2，全新旗舰芯片麒麟9050 Pro首次采用“逻辑折叠”技术；小米秋季旗舰发布会推出玄戒O3芯片（3nm、CPU十核全大核、多核性能相比上代提升60%），新车定价维持20~30万元价格带并出现4分钟锁单破万；三星电子加快人形机器人原型开发，目标2027年1月CES公开亮相。\u003c/li>\n\u003c/ul>\n\u003ch3>主线6：资金面高低切与顺周期修复\u003c/h3>\n\u003cul>\n\u003cli>今天强化的逻辑：26Q2公募基金科技持仓占比达60%以上历史高位，外资同步加仓，但险资逆势减仓电子、社保基金对科技关注度偏低，长线资金相对更关注高性价比方向（险资加仓高股息，社保加仓有色、工程机械）；产业链内部轮动由各层级预期盈利增长率的拐点决定。\u003c/li>\n\u003cli>今天出现的催化/验证：外盘油价与利率压力重新抬头，A股从半导体、算力、电源等拥挤方向切向石油石化、农化种植、地产、煤炭；中国石化涨4.1%，亚盛集团、敦煌种业、中粮糖业涨停；农业银行、工商银行同日公告合计定增募资2600亿元用于补充核心一级资本，其中财政部认购2000亿元。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>市场风格反转：A股将周一算力硬件领涨的成长行情反手做回，创业板跌1.2%、科创50跌1.5%，上证收涨0.2%至3941点；成交量方面中国A股总成交额1.98万亿元人民币。\u003c/li>\n\u003cli>存储/半导体设备关键数据集中释放：DRAM晶圆厂设备支出2026年预计530亿美元（同比+70%）、2027年700亿美元（同比+33%）；先进行逻辑晶圆厂设备支出2026年增长72%、2027年增长50%。\u003c/li>\n\u003cli>HBM需求反馈强于预期：渠道调研显示2027年供应短缺比2026年更严，部分客户提出的2028年HBM需求超过400亿Gb，单一客户需求水平已超过2026年全球HBM出货量估计值。\u003c/li>\n\u003cli>英特尔CPU涨价事件发酵：PC CPU预计10月再度涨价10%，低毛利小核产品线或启动停产退市，服务器CPU产能紧张延续至2028年。\u003c/li>\n\u003cli>光通信板块行情爆发：剑桥科技涨停，太辰光、源杰科技、中际旭创等涨超10%；多份专题聚焦FAU等连接件在CPO时代的价值重估。\u003c/li>\n\u003cli>大宗与再通胀交易升温：LME铜9月7日最高涨至14550美元/吨，创历史新高；成品油9月出口计划量439万吨、同比+27%；继印尼棕榈油减产后，泰国白糖也出现减产，厄尔尼诺影响蔓延。\u003c/li>\n\u003cli>大行资本补充落地：农业银行、工商银行公告合计定增募资2600亿元，其中财政部认购2000亿元，中国烟草为主要认购对象之一。\u003c/li>\n\u003cli>华为、小米、字节新品与技术事件密集：华为发布Mate XT 2及麒麟9050 Pro；小米举行秋季旗舰发布会并公布玄戒O3；字节被报道正在开发实时空间视频生成大模型。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>苹果秋季发布会（9月9日）：iPhone 18 Pro系列及首款折叠屏iPhone发布后，关注存储成本上行对终端BOM的影响、折叠屏结构创新对3D打印及相关设备环节的拉动，以及2027年iPhone发布20周年带来的外观与结构升级预期能否延续。\u003c/li>\n\u003cli>存储/半导体设备景气验证：跟踪DRAM平均售价上行节奏（2026Q3环比+15.8%、Q4环比+7.2%、2027年同比+23.9%），以及HBM长约（5年以上）与2028年超大额需求能否落实；同时留意汇率下行对相关公司业绩的潜在拖累。\u003c/li>\n\u003cli>HBM与先进封装检测链验证：KGD测试、探针卡消耗量是否如逻辑推演般成倍增长，HBM探针卡验证进展以及DRAM探针卡客户导入的阶段性突破。\u003c/li>\n\u003cli>光通信/CPO产业节奏：跟踪1.6T产品放量、3.2T从2027年开始出货的节奏，以及OCS在Google、英伟达Scale up/Scale out/Scale across场景中的实际部署进展；关注无源器件国内厂商在康宁/Coherent/英伟达/博通供应链中的卡位订单落地。\u003c/li>\n\u003cli>AI电力与冷却资本开支兑现：跟踪Vera Rubin电源放量节奏、数据中心柴发与热交换系统订单，以及液冷风机/整机组装业务在墨西哥等地的产能释放。\u003c/li>\n\u003cli>国产算力新品后续验证：三星泰勒工厂2nm本月底试产及特斯拉、博通订单执行情况；三星泰勒二期年底开工进展；三星人形机器人2027年1月CES展示计划是否如期推进。\u003c/li>\n\u003cli>资金面高低切是否延续：关注公募科技持仓60%以上历史高位下，险资减电子、社保关注度偏低所预示的性价比再平衡，以及大行定增落地后对市场流动性和银行板块估值的影响。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>07:52｜为什么 OpenAI 的 GPT-6 Astra 是转折点？（三星证券）🎯三星证券认为，GPT-6 Astra 的真正变化不在于问题解决分数，而在于无需人类监督也能自主完成任务的时间和复杂度的显著增加。\u003c/li>\n\u003cli>07:53｜【国海海外】小米集团（1810HK）秋季旗舰新品发布会Highlights：为进一步刺激全年汽车销量，新车定价仍维持20~30万元价格带#玄戒芯片：①玄戒O3：采用3nm。CPU采用十核全大核架构，CPU多核性能相比上代提升60%。\u003c/li>\n\u003cli>07:53｜【华福计算机】又来助攻！字节加码实时World Model，World Generation产业链再迎催化！\u003c/li>\n\u003cli>07:53｜近一周公募基金大幅加仓的行业有：电新 有色 石油石化 交运 国防军工 其中电新 石油石化 交运已经连续出现加仓 近一周公募基金大幅减仓的行业有：汽车 饮品饮料 建材 煤炭 其中汽车 饮品饮料 建材 煤炭已经连续出现减仓\u003c/li>\n\u003cli>07:53｜我们继续看好无源器件赛道，其在NPO/CPO/OCS时代重要性、创新性持续提升，国内企业在本轮产能扩展、客户拓展后有望真正“站起来”，中报业绩的大幅增长仅是起点。核心标的：太辰光、东田微、蘅东光#文字观点\u003c/li>\n\u003cli>07:53｜【Astra利好AI硬件】 训练端继续放大（训练超10万块GPU），推理端因电脑操作/长任务执行能力跃 迁而扩容，同时推理期间的安全与运行监控带来增量算力需求，利好互联与液冷等环节。核心标的：#1、光：（模块）易中天/光迅/联特、（无源）衡东光/太辰光/致尚等\u003c/li>\n\u003cli>07:53｜再谈当下传媒观点，建议重视游戏配置机会 核心观点维持：1）市场回到了用放大镜找应用边际变化的阶段。2）游戏仍是板块内机构配置首选 历史上的传媒是一个关注度对估值影响极大的板块，当前正处在底部放量+关注度的修复过程中，建议对边际变化高看一眼，题材资金会选择外部催化方向进行轮动，基本面资金会选择低估值景气度进行修正。\u003c/li>\n\u003cli>07:54｜‼️【浙商证券‖轻工纺服史凡可/马莉等】期待您的支持！复盘26年全球成熟市场消费K型分化，我们深度推荐比音勒芬、西锐 等高端消费优质品种，同时在全球化时代精确把握英科医疗、英科再生、致欧科技、晶苑国际 的经营向上拐点。\u003c/li>\n\u003cli>07:54｜——聚焦【超强阿尔法】标的！【AI装备】 1、AIDC发电设备：杰瑞股份、涛涛车业 2、金刚石散热：斯莱克、九州一轨 3、光模块测试仪器：联讯仪器、优利德 4、PCB/PCB钻针：科翔股份、杰美特 【周期价值】 1、船舶：松发股份、中国船舶 2、工程机械：恒立液压、三一重工 3、非洲电解铝：华通线缆#文字观点\u003c/li>\n\u003cli>07:56｜特朗普： 在美国，再也不会有庞巴迪的产品了！他们的产品质量实在不怎么样！\u003c/li>\n\u003cli>07:57｜【小米集团】澎程定价再超预期，增程大有可为 澎程正式定价超预期，4分钟锁单破万！车型：新增标准版N70Pro，搭载210kW单电机、52kWh电池，CLTC纯电351km/综合1351km\u003c/li>\n\u003cli>07:57｜☀️【千禾味业】推荐更新：电商团队焕新加大投入，品牌迭代加速，股东回报增强（2026-9）产品&amp;渠道收入增量—— 电商新团队（base杭州，朱总牵头）6月末到位，#7~8月电商高增长且预计后续可持续，目标重回历史高点；双节、双十一都是关键验证节点。\u003c/li>\n\u003c/ul>\n\u003ch3>附件正文\u003c/h3>\n\u003cul>\n\u003cli>A股与港股复盘20260908｜A股与港股复盘 2026年9月8日 研究笔记 · 不构成投资建议 第 1 / 15 页 股票市场复盘 油价重燃 日元狂飙 2026年9月8日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 外盘油价与利率压力重新抬头，A股因此把周一算力硬件领涨的成长行情反手做了回来——资金从拥挤的半导体、算力、电池撤向石油石化、农业、地产、煤炭、医药等低估值顺周期方向。\u003c/li>\n\u003cli>Barclays-为AI供电：数据中心的政治博弈｜0JPFWGo4rX9ZbZ6McM7NoMpPtRsMiNnNwPfQpPoQbRpOtQvPmMuMwMrRpQ\u003c/li>\n\u003cli>MS-LG电子（066570.KS）——AI冷却基础设施的规模化建设｜BGOEUIiAtZ8YdX6MaO9PnPqQmOtNkPoOuNkPqQpRbRqRoNNZpPtMxNsQwP\u003c/li>\n\u003cli>MS-日本化工行业——AI相关标的暂歇，价值股提供上行空间｜0JQGZFm2oU8YdXbRbP7NpNrRpNpRjMrRwPkPpPpR7NnMnOuOnMpPvPnNtN\u003c/li>\n\u003cli>MS-软件行业观察：北美路演反馈｜M Foundation Software Snippets | Europe Feedback from North America Marketing Important events in the world of Software &amp; Services in the week ahead, and key MS research / stories from the past week.Morgan Stanley &amp; Co.\u003c/li>\n\u003cli>华创证券-潍柴动力(000338)2026年中报点评：2Q业绩符合预期，数据中心发电放量提速-260907｜证 券 研 究 报 告 证监会审核华创证券投资咨询业务资格批文号：证监许可（ 2009）1210号 公司研究 卡车 2026年09月07日 潍柴动力（ 000338）2026年中报点评 强推 （维持） 2Q业绩符合预期 ，数据中心发电放量提速 目标价： 42.4元/49.5港元 当前价： 26.85元/32.14港 document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');

function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
