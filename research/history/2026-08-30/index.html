, "source_details": {"post:2026-08-30T19-19:5dfa23623746": {"id": "post:2026-08-30T19-19:5dfa23623746", "kind": "post", "title": "2026-08-30 19:19", "source_label": "帖子正文", "excerpt": "【国海计算机·周观点·0830】#智谱发布GLM-5.3-Flash、调用超10万张国产芯片、NVIDIA新增“Scale-In” 🔥计算 ＃ MiniMax与阿里云合作规模大幅扩大 ▪8月28日讯，MiniMax将2026年至2028年三年累计阿里云服务采购上限由3.75亿美元大幅提高至12亿美元", "content": "【国海计算机·周观点·0830】#智谱发布GLM-5.3-Flash、调用超10万张国产芯片、NVIDIA新增“Scale-In” 🔥计算 ＃ MiniMax与阿里云合作规模大幅扩大 ▪8月28日讯，MiniMax将2026年至2028年三年累计阿里云服务采购上限由3.75亿美元大幅提高至12亿美元（约合人民币80.66亿元），增幅达到220%。其中，2026年至2028年采购上限分别提升至3亿、4亿和5亿美元。（云头条） ＃Anthropic或将租用Nscale约450亿美元的AI算力。 ▪8月27日讯，Anthropic或将租用Nscale约450亿美元的AI算力，预计Nscale将从2027年底开始为Anthropic提供Vera Rubin计算能力。（IT之家） 🔥网络/存储 # NVIDIA新增“Scale-In”、AI网络再扩一层 ▪8月24日讯，NVIDIA在Hot Chips期间正式把 Scale-In定义为AI Networking的“第五个支柱”，它主要解决AI Factory的南北向网络，实现了多租户网络、高性能存储访问、硅内安全、弹性配置和实时可观测性，同时保持基础设施处理不受主机计算资源控制。（NVIDIA） # Intel披露Xeon Diamond Rapids架构 ▪8月24日讯，Diamond Rapids产品最高256颗全新核心，配备28 GB末级缓存（LLC），16通道内存，速率高达12800 MT/s，128通道PCIe 6.0和CXL 3.0，此外还推出首款采用UCIe标准的英特尔处理器Wildcat Lake，主要应用于笔记本电脑和边缘平台。（Intel）#长鑫官宣LPDDR6内存量产▪8月29日讯，长鑫存储发布消息，LPDDR6内存正式量产。据了解，玄戒O3首家支持长鑫LPDDR6，小米18 Fold首发搭载。（财联社） 🔥模型/应用 # OpenAI下一代模型Astra灰度测试 ▪8月30日讯，OpenAI下一代模型Astra灰度测试结果显示，其前端能力强大，可统一的视觉语言、复杂元素之间的空间关系、页面层级，以及交互所需的代码结构。同时还优化了端到端训练的多Agent编排以处理超长周期任务；并有望推出持久推理模式支持即时自我修正。（新智元） # 智谱发布GLM-5.3-Flash ▪8月26日讯，智谱正式上线并开源了 GLM-5.3 Flash，上下文窗口百万token，为原生多模态模型，支持图片、视频、文件、Coding以及 Computer Use。定价每百万 Token 输入 0.4 元，输出1.4 元，为GLM-5.3 的 1/20；发布前曾调用超10 万张国产芯片做推理服务（APPSO） # DeepSeek前7月营收4.75亿元 ▪8月27日，2026年前7个月，DeepSeek实现营收约4.75亿元人民币，约为其2025全年营收的十倍。同期净亏损约7.15亿元人民币，整体毛利率44.6%；而去年全年净亏损为9.35亿元。（投资家） ⚠注：以上为根据公开信息整理，不涉及投资观点 ☎详询：国海计算机刘熹/唐锦珂/谢婧茹/朱谞晟#文字观点", "publish_time": "2026-08-30 19:19", "tags": ["长鑫官宣LPDDR6内存量产", "文字观点"]}, "post:2026-08-30T19-33:15f330587a04": {"id": "post:2026-08-30T19-33:15f330587a04", "kind": "post", "title": "2026-08-30 19:33", "source_label": "帖子正文", "excerpt": "【申万计算机周报】液冷产业趋势持续确认！智谱发布GLM 5.3 Flash！", "content": "【申万计算机周报】液冷产业趋势持续确认！智谱发布GLM 5.3 Flash！#液冷核心看超节点扩容！英伟达持续推进Vera Rubin量产，AI基础设施正由单机、单柜进一步向Pod级超节点演进。GPU柜、CPU柜、网络及存储系统协同部署，液冷对象从核心计算芯片扩展至整柜及多机架系统，液冷设计单元由Rack向Row、Pod持续延伸。后续重点关注三类增量：一是超节点带来的CDU、Manifold及整体解决方案扩容；二是微通道冷板、UQD等核心零部件技术升级；三是液冷向CPU、网络设备及高速光互联持续外溢。产业进入规模交付阶段后，头部客户认证、量产可靠性和持续交付能力更加重要。#国产模型继续沿“更高效率”方向演进！智谱发布GLM 5.3 Flash，围绕推理效率重新训练和重构，以较低参数激活承接高频Coding、Agent及专业办公负载，同时保持较强复杂任务能力。高性能Flash模型有望成为Agent与办公应用的重要流量入口。在模型能力保持较高水平的情况下进一步降低单位推理成本，有望推动调用频次、任务时长和Agent使用深度继续提升。原生多模态、开源权重与国产芯片规模化服务同步推进，有望加快模型、应用、推理框架和本土算力之间的协同优化。 【近期周报】 0822：关注AI数据中心高速互联！电芯片国产化加速！#小程序://申万宏源研究/LDoxpaMejqfpvbo 0815：关注华为超节点进展！国产大模型多更新！#小程序://申万宏源研究/Vcrh4TdQ6tmUqSo 0807：从美股软件行情看FDE！#小程序://申万宏源研究/8WdaODUfwgqTOtl 0731：DeepSeek-V4-Flash继续展现国产模型超高性价比！#小程序://申万宏源研究/Tbyp8O8rXe2K2CI#文字观点", "publish_time": "2026-08-30 19:33", "tags": ["液冷核心看超节点扩容", "国产模型继续沿“更高效率”方向演进", "文字观点"]}, "post:2026-08-30T19-17:ebdb1623ba32": {"id": "post:2026-08-30T19-17:ebdb1623ba32", "kind": "post", "title": "2026-08-30 19:17", "source_label": "帖子正文", "excerpt": "【东北计算机】20260830行业周报：再谈技术升级线 —————————————— 行情复盘：计算机(中信)指数本周上涨1.11%，创业板指数本周下跌3.42%，上证指数本周上涨1.20%。板块周涨幅前三为楚天龙（+44.64%）、中安科（+27.37%）、汇金股份（+22.77%）", "content": "【东北计算机】20260830行业周报：再谈技术升级线 —————————————— 行情复盘：计算机(中信)指数本周上涨1.11%，创业板指数本周下跌3.42%，上证指数本周上涨1.20%。板块周涨幅前三为楚天龙（+44.64%）、中安科（+27.37%）、汇金股份（+22.77%）；周跌幅前三为ST佳缘（-26.19%）、魅视科技（-11.62%）、和达科技（-11.52%） 行业观点： 1. 持续关注HBM全球供需缺口放大；2.PCB中关注mSAP、关注hvlp4、碳氢树脂、化学法硅微粉升级确定性，关注PTFE进展带来的（核心是生益产业链）价值传导重塑；3.电源板块关注技术升级线，关注HVDC、SST、电容升级、垂直供电方向；4.持续关注国产链积极变化，关注NPO、CPO产业链，短期市场风格中小盘更占优。 行业重要新闻： 国内 1. 月之暗面被爆正与微软、亚马逊、谷歌洽谈Kimi K3模型托管，争取最高30%收入分成，阿里亦推进开源AI模型分成合作（来源：金十数据） 2. 腾讯、阿里、字节完成AI办公业务整合，分别推出WorkBuddy、千问办公、豆包工作，IDC预计 2026国内企业级AI智能体市场达449亿元，行业进入实质付费阶段（来源：科创板日报） 3. 智谱AI开源GLM‑5.3‑Flash模型性能对标Claude Opus4.8，依托10万张国产算力卡首次大规模服务全球业务（来源：科创板日报） 4. 腾讯混元开源Hy4‑preview大模型，总参数770B、激活参数49B，上下文长度达1M，已在多款腾讯产品同步首发（来源：科创板日报） 国际 1. 美光HBM设计架构研究员警告，AI加速器计算性能每两年增长3倍，同期HBM发展速度还不足每两年2倍，这可能将加剧内存的短缺（来源：财联社） 2. 英伟达Groq 3 LPX机架量产，配套Vera Rubin平台，较上代每兆瓦吞吐量提升30倍、Token成本降35倍，主打AI智能体低延迟推理（来源：科创板日报） 3. 亚马逊大幅上调硬件设备零售价，部分产品涨幅高达60%，内存短缺预计将持续至2027年，DRAM芯片还将继续涨价（来源：财联社） 4. SK海力士CEO称HBM短缺或将延续至2030年底，美国印第安纳封装工厂洁净室2028年10月启用，2030年在美投资及资产总额预计超450亿美元（来源：财联社） ☎️欢迎联系东北计算机团队#文字观点", "publish_time": "2026-08-30 19:17", "tags": ["文字观点"]}, "attachment:files/野村证券 - 中国月度报告：8月数据前瞻 - 2026-08-27_Jing Wang，Harrington Zhang(原文).pdf": {"id": "attachment:files/野村证券 - 中国月度报告：8月数据前瞻 - 2026-08-27_Jing Wang，Harrington Zhang(原文).pdf", "kind": "attachment", "title": "野村证券 - 中国月度报告：8月数据前瞻 - 2026-08-27_Jing Wang，Harrington Zhang(原文)", "source_label": "野村证券", "excerpt": "Economics - Asia ex-JapanAsia InsightsGlobal Markets Research 27 August 2026 China monthly: August data preview Activity data indicated a further slowdown in growth in July, after ", "content": "Economics - Asia ex-JapanAsia InsightsGlobal Markets Research 27 August 2026 China monthly: August data preview Activity data indicated a further slowdown in growth in July, after real GDP growth fell markedly to 4.3% y-o-y in Q2 from 5.0% in Q1. We expect a limited growth rebound in August, as weak domestic demand persists. Policymakers are gradually stepping up their efforts. Last week, the NDRC hosted a series of meetings to urge faster spending on investment, the MOF doubled down on the interest subsidy program and a couple of top- tier cities recently rolled out another round of local property easing measures. However, w e expect a limited boost from these policy easing measures and maintain our below- consensus GDP growth forecast of 4.3% for Q3, especially in view of the worsening fiscal contraction with faster fiscal revenue growth of 11.7% y-o-y and slower fiscal expenditure growth of 0.5% in July. We expect Beijing, under rising pressure to support growth, to unveil more policy measures later this year. That said, the nature of a K-shaped economy will likely preclude large-scale stimulus measures. We expect subdued PMIs and mixed activity data We expect the official manufacturing PMI to remain muted at 49.2 in August, unchanged from July, while the official non-manufacturing PMI might stay weak, edging up to 49.2 in August from 49.0 in July. The negative impact from frequent typhoons in July is likely to subside in August, while domestic demand remains on the weak side. By contrast, the RatingDog manufacturing PMI, which surveys more SMEs and exporters in the eastern coastal region of China, is likely to stay above 50, thanks to the global AI boom, though moderating to 50.4 in August from 50.9 in July. On major activity data, we expect resilient export growth of 22.2% in August, little changed from 23.9% in July. Thanks to export resilience, we expect IP growth to increase slightly to 4.7% y-o-y in August from 4.5% in July. By contrast, amid weak domestic demand, we forecast retail sales and FAI growth of 0.5% y-o-y and -10.9% in August, which compare with July readings of 0.6% and -12.8%, respectively. We expect higher inflation and lower credit growth We expect CPI inflation to increase to 0.8% y-o-y in August from 0.5% in July, due mainly to price rebounds in oil, gold and food, as well as rising chip prices. In sequential terms, we expect CPI inflation to rise to 0.3% m-o-m in August from -0.1% in July, above the 0.0% recorded in August 2025. PPI inflation is also likely to increase in August, rising to 3.8% y-o-y from 3.5% in July, owing to the resurgence in oil prices amid a re-escalation of the Middle East conflict. On a sequential basis, implied PPI inflation should rise to 0.3% m- o-m in August from -0.7% in July, above the 0.0% recorded in August 2025. We expect credit growth, which is measured as year-on-year growth in outstanding aggregate financing (AF), to slow again to 7.2% y-o-y in August from 7.4% in July, as the net financing of government bonds has yet to accelerate.Research Analysts Asia Economics Jing Wang - NIHK jing.wang@nomura.com +852 2252 1011 Harrington Zhang - NIHK harrington.zhang@nomura.com +852 2252 2057 Ting Lu - NIHK ting.lu@nomura.com +852 2252 1306 See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts. ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 August data preview Official manufacturing PMI in August: 49.2 (July: 49.2) Official non-manufacturing PMI in August: 49.2 (July: 49.0) RatingDog manufacturing PMI in August: 50.4 (July: 50.9) We expect official manufacturing PMI to stay weak in August, unchanged from 49.2 in July, especially in view of the weakness in EPMI. China’s EPMI (Emerging Industries PMI), a non-seasonally adjusted leading indicator of the official PMI, came in at 47.8 in August, below the August average of 48.2 in 2023-25. Also, its sequential change in August was zero, weaker than the average of 1.6pp in 2023-25. The official non-manufacturing PMI is likely to increase slightly in August to 49.2 from 49.0 in July, as the impact on outdoor activities from unfavourable weather conditions in July subsided. However, the improvement might be limited, due to stubbornly weak domestic demand. We expect the RatingDog manufacturing PMI (formerly the Caixin manufacturing PMI), which surveys more SMEs and exporters in the eastern coastal region of China, to moderate to 50.4 in August from 50.9 in July. Growth in imports from Korea climbed further to 118.6% y-o-y on 1-20 August from 96.3% in July, while growth in exports to Korea moderated to 27.9% from 31.4%. The strength in exports has been largely driven by the price effect. For example, export growth in RMB terms remain elevated at 17.8% y- o-y in July (June: 20.7%), while export growth in volume terms slowed markedly to 5.5% y- o-y in July from 11.6% in June (May: 4.5%), according to China Customs. Industrial production growth in August: 4.7% y-o-y (July: 4.5%) We expect industrial production (IP) growth to increase modestly to 4.7% y-o-y in August from 4.5% in July, as typhoon-induced supply disruptions eased and production activity in the oil-related sectors continued to recover gradually, while production of construction- related raw materials continued to decline amid the property bust. High-frequency data related to the oil and chemical industries The operating rate of Shandong oil teapot refineries rebounded further to 56.9% at end-August from 54.3% at end-July, 46.9% at end-June and 53.6% at end-May. Its monthly average operating rate improved to 4.4pp above last year’s August levels from 3.2pp above in July and 1.4pp above in June, but still below 6.2pp above in May, 7.0pp above in April and 9.7% above in March.• The operating rate of purified terephthalic acid (PTA) factories edged up to 61.5% at end-August from 61.1% at end-July from 55.6% at end-June and 55.5% at end-May, while its monthly average operating rate rose slightly to 21.8pp below last year’s August levels from 22.3pp below in July.• The operating rate of polyester filament yarns (PFY) factories in Jiangsu and Zhejiang provinces was largely steady, with their monthly average at 16.5pp below last year’s August levels, little changed from 17.9pp below in July.• Other high-frequency data The weekly operating rate of cement factories inched down to 1.0pp above last year’s August levels from 1.1pp above in July.• The weekly cement shipment-to-output ratio moderated fell to 1.8pp below last year’s August levels from 0.3pp below in July.• Growth in weekly steel rebar output at major steel mills fell to -15.7% y-o-y in August from -5.1% in July, while output growth of crude steel also fell to -6.0% from -5.2%.• Growth in the daily average volume of coal burned at power plants in eight provinces in South China increased to -0.7% y-o-y in August from -6.0% in July.• Export growth in August: 22.2% y-o-y (July: 23.9%) Import growth in August: 29.1% y-o-y (July: 27.6%) Trade balance in August: USD108.2bn (July: USD112.3bn) We expect export growth to remain elevated at 22.2% y-o-y in August, slowing very Nomura | Asia Insights 27 August 2026 2 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 slightly from the strong reading of 23.9% in July, as we forecast persistently strong export momentum in the near term. We expect import growth to edge up modestly to 29.1% y-o-y in August from 27.6% in July, driven by a slightly higher base and strong price effects. We also expect the crude oil price rebound taking place since late July to feed into in China's import data in August, owing to the approximate 20-day shipping window from the Persian Gulf to China. That said, we expect China’s imports of crude in volume terms to remain well inside negative growth territory in August. Additionally, ongoing price increases across a range of semiconductor products – particularly memory chips – are adding further upward pressure to import values. As a result, we expect the trade surplus to narrow modestly to USD108.2bn in August from USD112.3bn in July. Higher-frequency trade-related data According to the Ministry of Transport, growth in weekly container throughput at major ports dropped slightly to -1.6% y-o-y on a month-to-date basis (as of 23 August) from 1.3% in July. On imports, the year-over-year change in the China Import Dry Bulk Freight Index (CDFI), which reflects freight rates for dry bulk cargo (including iron ore, coal, grain and nickel ore) imported into China, currently track at 39.7% y-o-y on a month-to-date basis in August, little changed from 39.6% in July. Brent crude oil price growth surged again to 33.5% y-o-y on a month-to-date basis in August from 17.6% in July. CPI inflation in August: 0.8% y-o-y (July: 0.5%) We expect CPI inflation to rebound to 0.8% y-o-y in August from 0.5% in July, due mainly to higher prices of food, oil, gold and chips, while underlying inflation remains subdued, in our view. In sequential terms, CPI inflation is likely to increase to 0.3% m-o-m in August from -0.1% in July, above the 0.0% recorded a year earlier. On food prices, according to high-frequency data from the MARA, the Agricultural Product Wholesale Price Index increased by 2.5% m-o-m in August, following a 0.6% decrease in July, with its y-o-y change at -0.3%, up from -0.8% in July. Egg price inflation eased further to 33.9% y-o-y in August from 36.1% in July, while pork price inflation remained firmly negative at -21.3% y-o-y in August, albeit up from -24.0% in July. For energy prices, retail gasoline prices were boosted by a notable RMB685/tonne on 1 August but reduced by RMB230/tonne on 15 August, leading to a gain of 7.5% m-o-m in August, which could add 0.23pp to headline m-o-m CPI inflation. For gold, its average spot prices rebounded by 7.5% m-o-m in August, with its y-o-y change at 30.0%, up from 22.0% in July. We estimate higher gold prices could boost headline m-o-m CPI inflation by 0.04pp in August. PPI inflation in August: 3.8% y-o-y (July: 3.5%) We expect PPI inflation to rebound to 3.8% y-o-y in August from 3.5% in July, due mainly to price rebounds in oil and non-ferrous metals. Support from AI-related electronic products will remain intact. On a sequential basis, PPI inflation might rise to 0.3% m-o-m in August from -0.7% in July, above 0.0% in August 2025. Amid the re-escalation of Middle East tensions, average Brent prices increased by 9.1% m-o-m in August, following a 2.4% decrease in July, with its year-on-year change rebounding to 33.3% from 17.6%. The rebound in oil price inflation should boost PPI inflation in the oil-related sectors, which together account for 14.1% of the PPI basket, according to our estimates. Global LME price inflation increased to 38.6% y-o-y in August from 32.6% in July, which should continue to support price inflation in the non-ferrous related industries that make up 7.3% of the PPI basket. Also, surging global chip prices should continue to push up PPI inflation in the computer, communications and other electronic equipment manufacturing sector, which accounts for 12.8% of the PPI basket. For raw material-related indices, the m-o-m change in prices of Nanhua industrial raw materials increased to 2.4% in August from -4.0% in July. The m-o-m change in prices of raw materials tracked by the NBS increased to 0.9% m-o-m in August from -0.6% in July. Nomura | Asia Insights 27 August 2026 3 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 Retail sales growth in August: 0.5% y-o-y (July: 0.6%) We expect retail sales growth to edge down to 0.5% y-o-y in August from 0.6% in July, thanks to a low base from last year. Underlying momentum of consumption is still weighed down by payback effects of the scaled-back trade-in programme, subdued consumer confidence, as well as negative price effects from domestic fuel and consumer electronics, driven by imported inflation. By components, we expect retail sales growth in autos, catering and merchandise excluding autos of -17.8% y-o-y, 0.7% and 2.6%, respectively, in August versus -17.0%, 1.4% and 2.5% in July. On auto sales, according to early estimates from the CPCA, volume growth in passenger car retail sales remains subdued at -21.7% y-o-y in August, dropping further from -20.9% in July. We expect auto sales to be the main drag for headline retail sales due to the scaled-back trade-in programme and the increase in the EV purchase tax from 0% to 5%. For other components, growth in the catering sector is likely to remain soft, given the lacklustre tourism spending during summer holiday, despite a low base from last year due to the new austerity rule . Growth in merchandise sales excluding autos is likely to remain soft across major durable goods categories on the payback effect from the trade-in programme. Households are also likely to cut spending on petroleum-related products and consumer electronics, given rising prices led by imported inflation. FAI growth in August: -10.9% y-o-y (July: -12.8%) FAI growth in August: year-to-date: -7.2% y-o-y (July: -6.7%) We expect fixed asset investment (FAI) growth to improve slightly to -10.9% y-o-y in August from -12.8% in July, taking the cumulative year-to-date growth to -7.2% in August from -6.7%. Despite this modest monthly improvement, we see no material recovery in FAI growth in August. The persistent weakness reflects subdued fiscal support, with net issuance of government bonds again falling below year-earlier levels in August. This continued shortfall in bond issuance has constrained public investment spending, limiting the scope for a meaningful rebound in overall FAI activity. Property investment growth in August (single-month): -28.0% y-o-y (July: -27.5%) Property investment growth in August (year-to-date): -20.2% y-o-y (July: -19.2%) We expect property investment growth to worsen to -28.0% y-o-y in August from -27.5% in July, as the property bust lingers. On high-frequency data, growth in new home sales by floor space in the Wind survey of 20 major cities dropped to -6.9% y-o-y in August from 5.0% in July. Growth in existing home sales volumes in a sample of 18 cities moderated to 7.6% y-o-y in August from 9.5% in July. As the fruits of AI-driven growth are mainly reaped by a few “smart” cities, especially large top-tier cities, we see a striking geographic divide in housing markets, especially for new home markets. Among the Wind 20 city sample, growth in new home sales by floor space in tier-1 cities increased further to 16.8% y-o-y in August from 13.3% in July, while sales growth in tier-2 and lower-tier cities fell to -12.1% y-o-y and -23.1%, respectively, from 1.8% and -8.1%. In the past, a recovery in housing markets of top-tier cities could be used as a leading indicator for lower-tier cities. However, this time around could be different. By siphoning resources from legacy cities to smart cities, the AI boom could worsen a geographical imbalance already in place, making a broader recovery of the national property market even more difficult. Indeed, the Iceberg index, a leading indicator based on the lowest listing housing prices, recorded a 0.5% m-o-m decline in August, unchanged from July. Aggregate financing (AF) in August: RMB1,705bn (July: RMB1,402bn) New RMB loans in August: RMB150bn (July: -RMB340bn) Outstanding AF growth in August: 7.2% y-o-y (July: 7.4%) Outstanding RMB loan growth in August: 5.0% y-o-y (July: 5.1%) M2 growth in August: 7.8% y-o-y (July: 7.7%) We expect credit growth – measured as year-on-year growth in outstanding aggregate financing (AF) – to drop further to 7.2% y-o-y in August, from 7.4% July, as relatively strong corporate bond issuance was once again largely offset by soft government bond Nomura | Asia Insights 27 August 2026 4 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 QQ£º1490929960 issuance. Growth in outstanding RMB loans is also likely to soften to 5.0% y-o-y in August from 5.1% in July. In absolute terms, we forecast new AF and new RMB loans of RMB1,705bn and RMB150bn, respectively, in August, up from year-earlier levels of RMB2,566bn and RMB590bn. On bond issuance, according to Wind's estimates using deal-level bond data, net government bond financing – for both central and local governments – is RMB1,105bn in August (as of 26 August), below its year-earlier level of RMB1,329bn. For other major bond categories (as of 26 August), net corporate bond financing totalled RMB88bn, significantly below its year-earlier level of RMB168bn. Net bond financing for LGFVs was -RMB121bn, above its year-earlier level of -RMB14bn. Property developers' net bond financing was -RMB31n, below its year-earlier level of RMB7bn. Short-term liquidity conditions eased in August. The average DR007 edged down to 1.399% on a month-to-date basis from 1.418% in July, now in line with the PBoC's 7-day OMO reverse repo rate of 1.40%, while the monthly average of 10-year CGB yields dropped notably to 1.699% from 1.738%. Nomura | Asia Insights 27 August 2026 5 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 Fig. 1: Forecast for economic indicators Forecast Jul 26 Jun 26 Q2 26 Q1 26 2025 2024 Aug 26 Economic survey Official mfg PMI Index 49.2 49.2 50.3 50.2 49.6 49.6 49.8 31-Aug Official non-mfg PMI Index 49.2 49.0 50.2 49.9 49.7 50.2 50.9 增加3/16亿，天数存货/预付款20/19亿，环比增加13/13亿元，为后续几个季度的收入放量打下基础。目前HBM是国产算力放量的新瓶颈，考虑相关国产算力厂商已开启积极备货，以及国产HBM突破在即，我们看好国产算力后续放量趋势。重点推荐先进存储领域的长鑫科技，先进制程领域的中芯国际/华虹宏力，建议关注头部设计公司寒武纪等，以及配套产业链华勤技术等。 （4）CSEAC 2026无锡半导体展前瞻：8月31日至9月2日，CSEAC 2026将在无锡举办，展览面积超7万平方米，设置8个展馆，参展企业超1400家，同期举办23场论坛及发布活动。按约1200个独立展位估算，核心部件及材料、晶圆制造设备、封测设备分别约占45%、35%、20%。大会主要看点包括：中微公司、微导纳米等集中发布设备新品；刻蚀与薄膜沉积论坛聚焦器件三维化；量检测向电子束、在线量测及AI决策升级；5场先进封装论坛讨论键合、减薄、测试及热控。我们认为，投资主线集中在三维化带来的刻蚀、ALD及金属化设备增量，量检测国产替代，以及AI驱动的先进封装和后道设备扩产，建议关注北方华创、中微公司、拓荆科技、微导纳米、中科飞测、华海清科、芯源微、长川科技、金海通，此外关注京仪装备、珂玛科技、富创精密。#文字观点", "publish_time": "2026-08-30 19:18", "tags": ["文字观点"]}, "post:2026-08-30T20-12:45ceaaae08fd": {"id": "post:2026-08-30T20-12:45ceaaae08fd", "kind": "post", "title": "2026-08-30 20:12", "source_label": "帖子正文", "excerpt": "电子行业更新0830电子行业中报业绩总结反馈。当前中报披露接近尾声，我们判断，整体看电子行业景气度持续提升，盈利增速进一步加快", "content": "电子行业更新0830电子行业中报业绩总结反馈。当前中报披露接近尾声，我们判断，整体看电子行业景气度持续提升，盈利增速进一步加快；据我们测算，电子板块Q2收入同比增速接近100%，利润同比增速显著快于收入同比增速。需求端，AI数据中心相关需求维持高增长，汽车电子补库与工业需求复苏形成支撑；供给端，部分环节稼动率处于高位，中上游价格上涨趋势延续。分板块看，我们认为业绩强势主线较 Q1 进一步强化：涨价方向的存储、CCL受益涨价表现最佳，AI方向的存储、PCB、电源相关公司业绩持续高景气，自主可控方向的Fab、封测稼动率持续提升且涨价节奏明确；其他方向来看，消费电子的苹果、华为链表现亮眼，IC设计端有合封存储业务的IC设计公司及自身新品放量逻辑的公司表现更佳。综合来看，我们预计业绩表现相对亮眼的细分板块有：存储、CCL、自主可控算力、先进制造、功率、设备龙头、果链龙头、合封存储的IC设计公司等。国产算力基本面更新及持续推荐。8月26日，智谱发布最新大模型，性能对标Opus4.8，大规模测试流量全部由国产芯片提供算力支持，据OpenRouter官网，其每日免费提供的100T算力相当于OpenRouter一周的使用量，且单Token成本已经达到N卡水平。我们认为，国模配国芯持续推进，国产卡在推理阶段已经能支持大规模算力需求；根据壁仞科技、天数智芯发布的中报，其收入均在10亿元上下，壁仞存货/预付款为12/27亿元，环比增加3/16亿元，天数存货/预付款20/19亿元，环比增加13/13亿元，我们认为这为后续几个季度的收入放量打下基础。目前，我们判断，HBM是国产算力放量的新瓶颈，考虑相关国产算力厂商已开启积极备货，以及国产HBM突破在即，我们看好国产算力后续放量趋势。重点推荐先进存储领域的长鑫科技，先进制程领域的中芯国际/华虹宏力，建议关注头部设计公司寒武纪等，以及配套产业链华勤技术等。CSEAC 2026无锡半导体展前瞻。8月31日至9月2日，CSEAC 2026将在无锡举办，约1200个独立展位中，核心部件及材料、晶圆制造设备、封测设备分别约占45%、35%、20%。大会主要看点包括：中微公司、微导纳米等集中发布设备新品；刻蚀与薄膜沉积论坛聚焦器件三维化；量检测向电子束、在线量测及AI决策升级；5场先进封装论坛讨论键合、减薄、测试及热控。我们认为，投资主线集中在三维化带来的刻蚀、ALD及金属化设备增量，量检测国产替代，以及AI驱动的先进封装和后道设备扩产，建议关注北方华创、中微公司、拓荆科技、微导纳米、中科飞测、华海清科、芯源微、长川科技、金海通，此外关注京仪装备、珂玛科技、富创精密。#文字观点", "publish_time": "2026-08-30 20:12", "tags": ["文字观点"]}, "post:2026-08-30T19-17:3557ae06bee0": {"id": "post:2026-08-30T19-17:3557ae06bee0", "kind": "post", "title": "2026-08-30 19:17", "source_label": "帖子正文", "excerpt": "【广发机械】周度观点更新：中报陆续落地，重视半导体设备+液冷-20260830 1.#半导体设备。长江存储26Q1收入470亿，归母净利润338亿，净利率71%", "content": "【广发机械】周度观点更新：中报陆续落地，重视半导体设备+液冷-20260830 1.#半导体设备。长江存储26Q1收入470亿，归母净利润338亿，净利率71%；长鑫科技26Q2业绩大超预期，近利润745亿，qoq+126%。从设备的中报来看，后道业绩普遍要优于前道，主要在于订单确认周期较快、敞口结构不同。长川、华峰、金海通等业绩兑现度较好，精智达、精测等有望迎来订单突破。两存的优异业绩会拉长扩产的持续性，未来5年存在3倍扩产空间；逻辑方面受益于韬定律及国产算力放量，我们依然强烈看好下半年半导体设备行情。 2.#液冷。Rubin全液冷带来液冷渗透率跃升，叠加国产供应链从0到1切入北美，大宗算力需求带来的液冷渗透必然带来核心部件的批量订单与产能扩张。中报业绩表现整体一般，但下半年订单有望落地，是边际变化最大的AI设备方向。推荐申菱环境、飞龙股份、大元泵业、冰轮环境、创世纪、金田股份等。 3.#PCB设备。芯碁微装业绩超预期兑现，26Q2归母1.73亿、yoy+92%；毛利率、净利率同环比大幅提升，主要系高精度设备占比提升。同时，mSAP和载板订单持续饱满、价值量通胀斜率陡峭，先进封装与海外客户对接中。PCB设备今年景气度极高，中报业绩兑现度极高，后续需要观察mSAP、载板的方量速度及个股在先进封装的暴露度。推荐芯碁微装、鼎泰高科等。 4.#光模块设备。旭创26Q2CAPEX多达28.7亿、yoy+420%、qoq+49%。光模块后道检测环节已经陆续兑现业绩，联讯仪器利润率超预期，1.6T产品全面放量，自研采样芯片已成功流片，CPO端持续开拓。伽蓝特26H1订单6亿，6月份并表带动华盛昌业绩高增长。 5.#出口链。板块上半年受到汇兑影响较大，Q2进一步对于毛利率有所冲击，但需求侧表现较为强劲，预计从Q3开始板块进入连续4个季度低基数区间。其中，造船是业绩兑现最好、估值相对底部的板块之一，确定性造就远期空间。推荐船舶、工程机械、高机等。 今晚20:00 进门财经（带ppt），#行业框架第七讲：液冷设备研究框架欢迎交流。#文字观点", "publish_time": "2026-08-30 19:17", "tags": ["光模块设备", "旭创26Q2", "行业框架第七讲", "液冷设备研究框架", "文字观点"]}, "post:2026-08-30T21-26:505c889b4fe6": {"id": "post:2026-08-30T21-26:505c889b4fe6", "kind": "post", "title": "2026-08-30 21:26", "source_label": "帖子正文", "excerpt": "【中金传媒】周报：A股中报业绩收官，《无限大》定档 本周（8/24-8/28）：A股申万传媒指数涨0.22%/沪深300跌0.21%/上证指数涨1.20%/创业板指数跌3.42%；海外恒生指数跌1.63%/恒生科技指数跌3.38%/纳斯达克指数涨0.85%。", "content": "【中金传媒】周报：A股中报业绩收官，《无限大》定档 本周（8/24-8/28）：A股申万传媒指数涨0.22%/沪深300跌0.21%/上证指数涨1.20%/创业板指数跌3.42%；海外恒生指数跌1.63%/恒生科技指数跌3.38%/纳斯达克指数涨0.85%。 ☀️评论 本周板块小幅上涨，关注优质标的估值修复。周内传媒板块小幅上涨，业绩期个股业绩表现分化。我们认为部分子板块和个股具备较强确定性，商业模式优秀且技术布局领先的标的，更有望在市场风格再平衡中快速回弹、凸显价值。 展望后续，我们建议把握以下投资线索：1）游戏赛道低估值、高景气度，商业模式具备优势，关注后续游戏产品节奏；2）持续关注AI商业化进展和技术迭代。 1️⃣社交社区：快手举行2026光合创作者大会。会上披露，当前每天在快手上发布作品数量超5,800万个，近一年超过2.7亿用户发布作品。公司亦表示，“短直一体”（短视频、直播一体运营）经营理念下计划进一步深化“好主播”和“好作者”的短直双向循环。公司加强AI工具对创作者赋能；截至2026年7月有效消费AIGC用户数达到2.8亿人，发布AIGC作品的万粉以上作者相比去年翻了13倍。建议关注快手通过流量扶持、AI工具赋能等方式持续激励创作者，优化主站用户生态，并强化变现的进展。 2️⃣游戏：多家中国厂商参展科隆展并更新新游进展，微信小游戏进一步加大激励力度。中国厂商方面，本次展会超50家中国厂商参展。网易都市题材开放世界游戏《无限大》宣布将于2027年1月15日全球上线，我们认为公司多储备游戏势头较好有望开启新一轮产品周期。8月24日，微信小游戏宣布升级2026年“首发新游激励金”政策。我们认为，小程序游戏仍处于用户及大盘增长的红利期，此次激励政策优化有望推动小游戏供给改善，进一步优化小游戏生态。 ☀️估值与建议 调整东方明珠盈利预测，维持其他覆盖公司盈利预测与估值和评级，调整详见图表2。A股推荐游戏板块（世纪华通/恺英网络等），关注分众传媒股息价值；港美股推荐网易/阅文集团/快手/心动公司/欢聚，关注音乐（腾讯音乐/网易云音乐）/猫眼娱乐/大麦娱乐。 风险 宏观景气度低于预期，监管政策变化，盈利修复较慢。#文字观点", "publish_time": "2026-08-30 21:26", "tags": ["文字观点"]}, "post:2026-08-30T21-28:f7c90906a62b": {"id": "post:2026-08-30T21-28:f7c90906a62b", "kind": "post", "title": "2026-08-30 21:28", "source_label": "帖子正文", "excerpt": "🍭【天风金属】黄金：Jackson Hole偏鹰短期压制金价，但金的长逻辑不变——短期聚焦美联储独立性博弈 20260830 短期无持续利好支撑，资金JH会议前避险，黄金周内冲高回落。伦敦金价格-3.24%至4453.67美元/盎司，COMEX黄金主连合约价格-3.38%至4504.1美元/盎司，S", "content": "🍭【天风金属】黄金：Jackson Hole偏鹰短期压制金价，但金的长逻辑不变——短期聚焦美联储独立性博弈 20260830 短期无持续利好支撑，资金JH会议前避险，黄金周内冲高回落。伦敦金价格-3.24%至4453.67美元/盎司，COMEX黄金主连合约价格-3.38%至4504.1美元/盎司，SPDR黄金ETF持仓量-4.85吨至1042.36吨；伦敦银价格-3.65%至66.342美元/盎司，COMEX白银主连合约价格-2.78%至67.09美元/盎司，SLV白银ETF持仓量+64.65吨至15359.51吨。 Jackson Hole会议整体偏鹰，市场上调加息预期。美联储主席沃什表示，尽管近期通胀有所改善，但尚不足以确认底层通胀正以足够快的速度回归2%目标，并强调若通胀改善不及预期，美联储仍“有工作要做”；同时认为当前金融条件并不紧张，劳动力市场保持稳健，并继续弱化前瞻指引。 讲话后市场明显向鹰派重定价，9月加息25bp概率由前一日约35%升至约60%以上，2Y美债收益率上行约12bp、10Y上行约5bp，美元指数上涨约0.5%；贵金属承压，伦敦金当日下跌约2.2%，美股冲高回落，标普500和纳指分别收跌约0.3%和0.5%。 JH会议后，市场交易的矛盾点为如何看待本轮周期美联储的独立性： #长期来看1️⃣2026年的美国经济是否能支撑美联储的独立性，回看历史上敢于顶住总统的政治压力的主席任职时间多为1950-1970年代时期，彼时是美国战后实体经济的黄金时代，经济的强大造就了经济学家敢于对抗政治的底气，而现在市场处于大政府时代，经济政策要摆脱政治维持独立性在此时难度较大；2️⃣ 沃什自身背景与部分历史联储主席有所不同。沃什并非传统学院派经济学家或长期央行官僚，其职业经历更多来自金融市场与政策实践；其提及的精神导师乔治·舒尔茨虽接受芝加哥学派经济学训练，但沃什本人并不具备深厚的传统学术经济学背景。因此，相较于凭借专业学术权威和长期央行履历建立政策独立性的传统联储主席，沃什自身的专业权威基础相对偏弱，在面对白宫政治压力时，未必具备同等强度的制度与个人抗衡能力。3️⃣沃什与特朗普的频繁交谈，这种总统与央行行长之间保持沟通的情况，在联储历史上鲜有。 #短期角度美联储独立性更加具体的聚焦在了9月FOMC的利率决议上的博弈，短期博弈的锚点在9.4的8月非农就业数据、9.11的8月CPI数据。除此之外，重点关注9月特朗普与贝森特的发言中是否有对财政货币政策的指向。整体9月波动加大：9.15日中期选举的初选结果；9月底中美元首会面。在此重要政治关口，经济数据是否支持加息至关重要，尤其是核心CPI数据是否能够持续回落将影响市场方向。但考虑到中长期联储独立性以及美债等问题，黄金向上方向不变。#文字观点", "publish_time": "2026-08-30 21:28", "tags": ["文字观点"]}, "post:2026-08-30T19-15:be986ad0ffe8": {"id": "post:2026-08-30T19-15:be986ad0ffe8", "kind": "post", "title": "2026-08-30 19:15", "source_label": "帖子正文", "excerpt": "【华创地产】地产新政的真实影响是什么？1、从预售制度的调整（按揭贷款发放的时间从封顶改为竣备），和现房销售的推出，政策的核心都在指向，将不确定性从居民转给开发商。", "content": "【华创地产】地产新政的真实影响是什么？ 1、从预售制度的调整（按揭贷款发放的时间从封顶改为竣备），和现房销售的推出，政策的核心都在指向，将不确定性从居民转给开发商。这过程中的现金流风险，制度用开发贷的优化做了一定补偿。但价格风险、去化风险对开发商更为不利。 2、这一方面会导致开发商IRR降低，利润率的风险增加，从而对远期ROE有冲击。另一方面会导致开发商减少拿地，并对地价和土地出让金产生冲击。这点市场并无分歧。 3、我们想强调的是，地产周期并非基于蛛网模型的供需周期，而是总需求波动的经济周期。地产通过土地财政对于总需求曲线的冲击，远远强于住宅本身供需关系。这也是这两年的供地悖论：供少了影响财政收入冲击经济，供多了新房和二手房竞价。现房销售导致的开发商拿地减少并不从根本上改变这个矛盾。 4、前期路演我们甚至给过一个更强的推论，如果二手房价格企稳能带来什么？结论是，如果无法推动总需求曲线右移，房价企稳无法形成自我闭环。 5、产业制度解决行业效率的问题，宏观制度解决总需求问题，两者并不同向。从个体居民购房福利角度，此政策无疑给了居民更优的选择权。 单戈（15210984979）#文字观点", "publish_time": "2026-08-30 19:15", "tags": ["文字观点"]}, "post:2026-08-30T19-46:51df8b82becc": {"id": "post:2026-08-30T19-46:51df8b82becc", "kind": "post", "title": "2026-08-30 19:46", "source_label": "帖子正文", "excerpt": "【长江电新】协鑫科技：毛利亏损收窄，LFP进展积极 事件： 1、协鑫科技发布半年度业绩公告： 公司2026H1实现总营业收入57.77亿元，同比增长0.73%；毛利润亏损4.34亿元，同比收窄38.1%，#整体负毛利率收窄至-7.5%", "content": "【长江电新】协鑫科技：毛利亏损收窄，LFP进展积极 事件： 1、协鑫科技发布半年度业绩公告： 公司2026H1实现总营业收入57.77亿元，同比增长0.73%；毛利润亏损4.34亿元，同比收窄38.1%，#整体负毛利率收窄至-7.5%；拥有人应占亏损20.81亿元，同比有所扩大。 2、公司发布磷酸铁锂与硅碳负极业务重大进展公告： 1）乐山一期20万吨磷酸铁锂（LFP）正极材料已于2026年6月正式投产，预计2026年10月底前实现满产；二期20万吨新增产能已启动建设，预计2027Q1末投产。公司采取一步法铁红法工艺为全球首创，显著提升成本与环保优势，目前订单已充分覆盖全部规划产能，#客户为行业龙头企业。2）徐州万吨级硅碳负极及配套多孔碳中试项目已顺利投产，复用颗粒硅生产设施改造升级硅碳负极产线，大幅降低资本开支，压缩投建周期。此外公司计划在乐山建成全球最大硅碳负极生产基地。 1、颗粒硅方面，公司成本优势持续领跑，2026Q2平均现金成本进一步降低至25.09元/kg；但受产业链价格降低影响，2026Q2公司颗粒硅含税均价3.3万元/吨，拖累公司业绩。 2、财务数据方面，公司毛利润亏损幅度收窄，净利润亏损扩大，主要原因在于其他亏损与金融资产减值，此外转型期费用有所增加。2026H1公司计提物业、厂房及设备减值1.72亿元，汇兑净亏损1.05亿元，同时确认金融资产减值2.98亿元，对短期盈利形成压制。 3、协鑫科技硅锂碳同构多级增长，完成从”颗粒硅单项冠军”向”全球化多产品新能源材料平台”转型。锂电材料、钙钛矿、半导体硅基材料第二增长曲线逐步显现，对于协鑫科技而言，LFP材料业务与光伏硅料有望形成“硅料降本→光伏装机增长→储能需求上升→LFP出货增长”正向循环。技术护城河与产业协同效应显著，有望重塑公司估值体系。#文字观点", "publish_time": "2026-08-30 19:46", "tags": ["客户为行业龙头企业", "文字观点"]}, "post:2026-08-30T19-13:0417934ff28b": {"id": "post:2026-08-30T19-13:0417934ff28b", "kind": "post", "title": "2026-08-30 19:13", "source_label": "帖子正文", "excerpt": "【环保-成长-中报】天楹绿醇投产在即，山高环能有望量价齐升，浙富高纯铟投产，武汉天源收购磷化铟衬底资产。#1、中国天楹。", "content": "【环保-成长-中报】天楹绿醇投产在即，山高环能有望量价齐升，浙富高纯铟投产，武汉天源收购磷化铟衬底资产。 #1、中国天楹。中报利润2.13亿（+1%），符合预期，辽源一期10万吨绿色甲醇预计9月试产，安达10万吨主体已封顶，下游已与等签订长协。 #2、山高环能。中报利润6510万元（+60.47%），看好公司后续量价齐升。公司当前餐厨产能5870t/d，目标逐步实现8000-1万t/d。同时UCO价格有望受益SAF需求释放及厄尔尼诺带来的植物油减产。此外，公司过提升产能利用率、优化生产工艺、降低融资成本等方式持续降低单吨成本，有望降低至5000以下。 #3、浙富控股。中报利润13.56亿元（+139%），银、锡的量价齐升，以及铑、钌、铱等稀贵金属贡献的毛利增量。公司对铜维持约40%的套保比例。年产100吨的6N级高纯铟产线技改预计7月底完成，8月投入试生产，下半年有望贡献20-30吨产量。同时，公司规划了高纯碲、锗及铂族金属（铑、钌、铱）等扩产项目，打造新增长极。 #4、武汉天源。中报利润0.77亿元（-41%），主要受股权激励支付费用及环保项目节奏影响，新疆乌苏1GW光伏项目首期575MW已于6月底并网发电，公司加速布局储能，在手2.3GWh，2026年8月以750万对价收购中讯半导体60%股权，布局磷化铟（InP）衬底，标的目前已具备2-4英寸生产技术条件。#文字观点", "publish_time": "2026-08-30 19:13", "tags": ["文字观点"]}, "post:2026-08-30T19-28:c7120d18b2b9": {"id": "post:2026-08-30T19-28:c7120d18b2b9", "kind": "post", "title": "2026-08-30 19:28", "source_label": "帖子正文", "excerpt": "【博迁新材】AI用高端镍粉放量蓄势待发，光伏铜代银产业化落地 #事件：上半年营收8.90亿元，同比+71.60%；归母净利润1.36亿元，同比+28.50%。", "content": "【博迁新材】AI用高端镍粉放量蓄势待发，光伏铜代银产业化落地 #事件：上半年营收8.90亿元，同比+71.60%；归母净利润1.36亿元，同比+28.50%。按板块分，镍粉营收5.57亿元（+40.75%），毛利润1.88亿元（+27.05%），毛利率33.82%（-3.65pct）；铜粉营收1.92亿元（+260.14%），毛利润0.56亿元（+263.62%），毛利率29.02%（+0.27pct）。 #持续投产扩建、开拓市场、上半年费用有所增长。其中汇率波动导致汇兑损益增加，财务费用1460.27万元（+2112.12%），管理费用3478.41万元（+39.79%），销售费用477.46万元（+41.54%），研发费用3168.62万元（+37.01%）；上述费用合计8584.76万元，同比增加3381.55万元，增幅64.99%。 #AI用高端MLCC需求高速增长、超细纳米镍粉为核心材料之一。AI浪潮推动下，MLCC加速向超薄介电层、高堆叠层数方向迭代，其中超细纳米镍粉为其性能升级核心材料，120nm及以下镍粉需求激增。公司是全球纳米镍粉龙头，为全球极少数能量产120nm等小粒径高端镍粉的供应商，量产80nm镍粉达到全球顶尖水平，有显著的技术壁垒和议价能力。三星电机继6月接4500亿韩元AI服务器用MLCC订单之后，7月再新接价值约3000亿韩元合同，下半年高端产品出货预计将显著增加。 #光伏以铜代银进程推进。PVD工艺生产的纳米级铜粉，产品颗粒纯度、粒径控制、形貌及性能一致性等方面性能好，在铜粉后续抗氧化性处理、分散性、导电性及光伏金属化界面兼容性等方面具有突出优势。BC电池铜代银技术加速推进，已进入以铜为核心的贱金属替代实质产业化阶段；随着银价上涨，TOPCon企业也有望加速贱金属替代进程。 #供不应求、产能已经多轮扩张、未来有望继续增长。2025年四季度以来，公司已经进行三次产能扩张，镍粉（原粉）产能分别增加1800吨、640吨和600吨，全部投产后公司产能将从此前的不足3000吨增加至近6000吨。同时铜粉产能此前600吨，年中新增800吨。鉴于下游需求的高速增长，未来镍粉及铜粉产能将进一步扩张。 盈利预测：预计公司2026-2028年营收26.7/48.8/72.3亿元，归母净利润7.4/15.8/25.2亿元，对应PE为54/25/16倍，维持“买入”评级。#文字观点", "publish_time": "2026-08-30 19:28", "tags": ["文字观点"]}, "post:2026-08-30T14-13:551edf71739b": {"id": "post:2026-08-30T14-13:551edf71739b", "kind": "post", "title": "2026-08-30 14:13", "source_label": "帖子正文", "excerpt": "PTFE专家小范围&产业链调研📒：成熟度可期0830更新（无废话版） 继我们上半年4月更新PTFE后，今年下半年伴随switch tray再测试（层数比正交少，又重新尝试），整体我们认为，1）良率确实在持续提升，2）目前仍处于测试而非大规模放量，各家方案有差异，3）中长期技术升级较为确定。🐟1️⃣P", "content": "PTFE专家小范围&产业链调研📒：成熟度可期0830更新（无废话版） 继我们上半年4月更新PTFE后，今年下半年伴随switch tray再测试（层数比正交少，又重新尝试），整体我们认为，1）良率确实在持续提升，2）目前仍处于测试而非大规模放量，各家方案有差异，3）中长期技术升级较为确定。 🐟1️⃣PTFE处于罗杰斯M9水平：PTFE的DK值为2.0-2.2，DF值为0.0008-0.001，属于罗杰斯材料体系中M9等级，性能明显优于M8材料，目前PTFE CCL成本约为2200元/平方米，成本高企的核心原因是当前量产良率较低；传统成熟应用的PTFE通信板因工艺成熟、良率高，成本仅为500-600元/平方米。 🐟2️⃣很多人没讲明白结构差异，各家应用方案有差异（#该部分不分享JY，感兴趣☎️）： →正交背板（Feynman）：目前较为确定采用PTFE方案无布，3块26层选择生益5300（纯PTFE CCL）+09（#碳氢树脂膜替代PP ） 方案，块之间892K2 PP（M8二代布）； →Switch tray：目前测试的有5300+09，5300+m9Q，5300+m10Q，含布不含布均在测，#边际上依然利好我们此前说的HVLP4、碳氢树脂&PPO、硅微粉。 🐟3️⃣边际上到底谁受益了？ 1）PTFE树脂成本低，#但是价格同样在2000元以上CCL（SY）最受益，也许利润率会提升至70～80%；2）PCB板厂：核心中的核心是SN；3）HVLP4、碳氢树脂&PPO、硅微粉。 🐟🐑总结相关：生益科技、深南、生益电子、胜宏、德福科技、东材科技、圣泉集团、凌玮科技、联瑞新材、东岳集团。 以上仅作为产业链更新数据参考，实际请持续跟踪产业实际进展，PCB产业链ZJ纪要更新至22（核心看2️⃣）#文字观点", "publish_time": "2026-08-30 14:13", "tags": ["文字观点"]}, "post:2026-08-30T14-16:83497d0c4d9b": {"id": "post:2026-08-30T14-16:83497d0c4d9b", "kind": "post", "title": "2026-08-30 14:16", "source_label": "帖子正文", "excerpt": "【天风新材料】东材科技2026中期业绩交流要点 #高速高频树脂 1）进入规模化放量阶段，2026年1-7月收入6.6亿元，已超过2025年全年5.9亿元，全年预计超过16亿元。2）整体毛利50%+，不同品类差异较大15%-60%", "content": "【天风新材料】东材科技2026中期业绩交流要点 #高速高频树脂 1）进入规模化放量阶段，2026年1-7月收入6.6亿元，已超过2025年全年5.9亿元，全年预计超过16亿元。 2）整体毛利50%+，不同品类差异较大15%-60%；客户诉求以保供为主，价格整体稳定。 #客户与验证 1）已进入台系及国内头部 CCL 厂供应体系，客户包括生益科技、台燿、斗山、松下、南亚、华正、腾辉电子等。 2）眉山已有15家+客户对接，9月将与核心客户沟通现有及2027年需求。 3）M8已于2025Q3开始出货，2026H1客户验证重新活跃；M9及M10、M11仍处于下游和终端客户路线探索阶段。 #眉山一期 1）一期总投资约7亿元，8月底完成试车、9月6日转试生产，是本次产能释放核心。 2）规划产能包括3500吨碳氢（ODV/BCB约8:2）、3500吨双马、5000吨聚苯醚、4000吨活性酯固化剂、4000吨含磷酚醛树脂。 3）碳氢/双马/聚苯醚均已完成或进入试生产，预计年底月产分别达到 150/150/120吨。 #二期及中长期规划 1）已预留一期旁136亩土地，方向包括树脂前驱体、双马树脂、碳氢树脂、聚苯醚。 2）前驱体用于保障供应链和降本，双马树脂为当前扩产确定性较高的方向。 3）2027-2029 年，预计产销量分别为 1.2/1.7/2.4 万吨，其中双马为最大品类，分别为 6000/8000/10000 吨。 4）收入目标2028年35 亿+、2029年70-71 亿。 #成本与产能柔性 1）降本路径包括上游阶梯降价、2027H2 前驱体自主布局、眉山投产后规模效应摊薄制造费用。 2）油价影响相对有限，核心成本变量为技术路线、定制化程度和良率。 3）部分反应釜可在特定工艺步骤共线生产，但并非完全通用。如需详细纪要请联系，恳请支持：鲍荣富/王丹/于那18610713604/周丹丹/上官京杰/林晓龙/曾子峻#文字观点", "publish_time": "2026-08-30 14:16", "tags": ["文字观点"]}, "post:2026-08-30T19-28:278607456c0f": {"id": "post:2026-08-30T19-28:278607456c0f", "kind": "post", "title": "2026-08-30 19:28", "source_label": "帖子正文", "excerpt": "紫光股份26H1：业绩增长强劲，AI算力快速发展上半年业绩实现高速增长 26H1，公司实现营业收入635.16亿元，同比增长33.93%，归母净利润21.67亿元，同比大幅增长108.18%。核心子公司新华三营收499.75亿元，同比+37.28%，净利润23.88亿元，同比+29.03%。", "content": "紫光股份26H1：业绩增长强劲，AI算力快速发展上半年业绩实现高速增长 26H1，公司实现营业收入635.16亿元，同比增长33.93%，归母净利润21.67亿元，同比大幅增长108.18%。核心子公司新华三营收499.75亿元，同比+37.28%，净利润23.88亿元，同比+29.03%。 业绩增长主要系核心子公司新华三业务规模扩大，销售增加所致，同时财务优化贡献显著，财务费用由去年同期的7.10亿元降至本期的-1.15亿元，同比减少116.25%。AI基础设施业务高速增长，超节点开启商业化元年 公司推出的UniPoD S80000系列超节点产品，覆盖32卡至1024卡全品类，兼容多厂商CPU、GPU、NPU、DPU等异构算力，可支持万亿参数大模型训练。超节点作为系统级解决方案，技术壁垒较高，有望重构服务器行业价值及格局。AI网络需求强劲，高端交换机市场地位稳固 根据IDC数据，26Q1公司在中国数据中心交换机市场份额达35.8%，位列第一。公司已推出全系列单芯片102.4T智算交换机，并引入CPO、NPO等先进技术。海外业务进入发展新阶段 26H1海外业务持续快速扩张，营业收入29.41亿元，同比+53.25%。公司正积极把握“中资出海”和海外智算中心建设机遇。随着海外自主渠道网络已具规模，公司将进一步加大资源投入，提升收入规模和盈利水平。新华三并表比例提升直接增厚利润 公司于2026年上半年完成对新华三6.98%股权的收购，持股比例由81%提升至87.98%，直接增厚了归母净利润。 资料来源：公司财报 【重要提示】以上信息为公开资料整理，不涉及投资建议及研究观点，仅供参考，本公司不保证其准确性、完整性与时效性；市场有风险，投资需谨慎！#文字观点", "publish_time": "2026-08-30 19:28", "tags": ["文字观点"]}, "post:2026-08-30T19-24:5bff828b096e": {"id": "post:2026-08-30T19-24:5bff828b096e", "kind": "post", "title": "2026-08-30 19:24", "source_label": "帖子正文", "excerpt": "【浙商轻工史凡可】中报综述：回调坚定推荐造纸β和出海α，重视高分红配置观点：中报内需造纸β尤其箱板/特种龙头强势，传统消费仍受地产&消费力不足制约；出海强α个股表现优秀如布鲁可、乐舒适、西锐、两个英科、致欧、裕同等。", "content": "【浙商轻工史凡可】中报综述：回调坚定推荐造纸β和出海α，重视高分红配置观点：中报内需造纸β尤其箱板/特种龙头强势，传统消费仍受地产&消费力不足制约；出海强α个股表现优秀如布鲁可、乐舒适、西锐、两个英科、致欧、裕同等。底部建议关注高分红的公牛、晨光、建霖、永艺。造纸：补库叠加旺季驱动本周Suzano纸浆提涨20美金，纸浆涨价有望支撑特种纸后续价格表现，持续关注特种纸龙头表现#仙鹤；箱板纸与废纸本周价格有小幅回落，预计9-10月旺季仍能延续提涨，维持推荐#太阳#玖龙，关注#理文#林平。包装：1）金属包装中期靓丽、Q2盈利环比提升，后续关注9月末客户谈价与中期出海，推荐#奥瑞金#宝钢；2）塑料包装高油价下顺价利润韧性强，#永新Q2收入+11%、利润-1%；#紫江Q2利润+7%。潮玩：#布鲁可出海保持景气，谷歌指数向上；#泡泡猫BUBU新品图流出；#晨光26Q2传统线下转正，科力普稳健，持续回购提升股东回报，股息率4%+。个护：#乐舒适26H1销量超预期印证非洲&拉美消费需求增长+产品渗透率提升β无虞，公司产品/渠道/供应链/组织多维度领先，长期成长确定性强；#润本线上竞争缓解+线下开拓；#登康大单品仍在成长期，营销投入重转化&ROI驱动盈利提升；#百亚品牌势能无虞份额、终端份额仍在提升；#若羽臣核心品牌高增驱动业绩靓丽。家居：1）中报定制普遍承压，软体下滑幅度相对较窄，#顾家H1外贸+19%、内销毛利率+2pct，利润主要受汇兑拖累。2） 推荐经营层面边际向好的稳成长+低估值+高股息的#建霖（股息率6%+）；成长关注#悍高#好太太。烟草：#思摩尔26H1收入新高（+20%）、期待26H2美国口味烟放开、HNB多客户策略落地。#中烟利空出尽，26H1卷烟出口盈利能力大幅提高且H2预期改善。#华宝26H1收入+16%，非港股报告期间盈利2.12亿元（+10%），香精与调味品板块高增。出海：本周#西锐26H1收入&利润超预期，新品订单超预期、三年激励发布；#英科医疗伴随持续扩产+新产线成本优势提升&规模效应释放驱动底部利润抬升；#英科再生三框增速超预期+墙板延续高增；#致欧策略调改成长提速、Q3有望延续；#匠心汇兑压制业绩，品牌、渠道布局深化，低位建议关注。AI+：1）液冷：#裕同H1扣除激励费用利润+12%、还原汇兑高增，液冷即将进入放量兑现期；#金富Q2液冷并表收入2.76亿元、利润超4kw，新拓台达、富士康。2）AI眼镜：销冠雷鸟iO主打全天候主动式AI、双目显示；3）3D打印：#创想三维26H1收入+13%，9.7入通。 风险提示：下游需求不及预期，竞争加剧等#文字观点", "publish_time": "2026-08-30 19:24", "tags": ["仙鹤", "太阳", "林平", "奥瑞金", "宝钢", "永新", "紫江", "布鲁可", "泡泡", "晨光", "乐舒适", "润本", "登康", "百亚", "若羽臣", "顾家", "建霖（股息率6%+）", "悍高", "好太太", "思摩尔", "中烟", "华宝", "西锐", "英科医疗", "英科再生", "致欧", "匠心", "裕同", "金富", "创想三维", "文字观点"]}, "post:2026-08-30T20-26:5afc79525809": {"id": "post:2026-08-30T20-26:5afc79525809", "kind": "post", "title": "2026-08-30 20:26", "source_label": "帖子正文", "excerpt": "安克创新26H1点评：三大品类延续高增，毛利改善驱动弹性释放 事件：8月30日，公司发布中期业绩， #按半年度看，26H1公司实现营业收入166.05亿元/+29.1%，归母净利润17.02亿元/+45.9%，扣非归母净利润14.39亿元/+49.7%；#按单季度看，26Q2实现收入89.97亿元/", "content": "安克创新26H1点评：三大品类延续高增，毛利改善驱动弹性释放 事件：8月30日，公司发布中期业绩， #按半年度看，26H1公司实现营业收入166.05亿元/+29.1%，归母净利润17.02亿元/+45.9%，扣非归母净利润14.39亿元/+49.7%； #按单季度看，26Q2实现收入89.97亿元/+30.9%，归母净利润12.30亿元/+83.3%，扣非归母净利润8.92亿元/+70.9%。收入结构 #品类：三大核心品类均保持高增，充电储能为核心增长引擎。2026H1充电储能/智能创新/智能影音分别实现收入89.30/41.86/34.85亿元，同比+31.0%/+28.8%/+24.5%，收入占比分别为53.8%/25.2%/21.0%。其中，1）充电储能延续较高景气，移动充电新品持续迭代，同时SOLIX围绕欧洲阳台光储、澳大利亚户储及美国便携储能持续扩品，7月公司与澳大利亚分销商OSW进一步签署3GWh新能源储能战略合作协议；2）智能创新积极拓展创意打印、母婴等新品类，UV Printer E1持续推进产品体验和耗材生态建设；3）智能影音持续推进端侧AI落地，Liberty 5 Pro系列搭载自研Thus AI音频芯片，进一步强化产品差异化。 毛利率方面，26H1充电储能毛利率49.01%/+8.40pct，智能创新毛利率47.41%/-2.22pct，智能影音毛利率54.78%/+5.72pct；公司综合毛利率49.82%/+5.09pct。其中营业成本增长明显慢于收入增速，除产品结构及经营改善外，公司明确披露本期收到退回的部分上年度缴纳IEEPA关税为上半年毛利率大幅提升的重要因素。 #渠道：独立站建设优化，非亚马逊线上渠道增长更快，渠道多元化持续推进。26H1线上收入113.50亿元/+30.8%，占比68.4%；线下收入52.55亿元/+25.4%，占比31.7%。线上渠道中，亚马逊实现收入76.99亿元/+19.8%，收入占比由49.97%下降至46.37%；其他第三方平台收入18.14亿元/+95.8%，官网收入18.37亿元/+39.2%，占比提升至11.06%。公司持续推进第三方平台、官网及线下零售网络协同发展，收入增量对单一亚马逊渠道的依赖进一步下降。 #区域：北美、欧洲均保持接近30%以上增长，新兴区域同步拓展。2026H1北美实现收入75.64亿元/+32.7%，占比45.6%；欧洲收入44.32亿元/+29.3%，占比26.7%；中国及其他地区收入46.09亿元/+23.2%。欧洲受消费级储能等新品类快速扩张推动，北美继续深化渠道及品牌建设，公司同时加快澳大利亚、东南亚、拉美等潜力市场布局。财务结构 #财务：毛利改善覆盖研发和财务费用投入，扣非盈利能力显著提升。1）毛利端，26H1综合毛利率49.82%/+5.09pct，其中关税退回对成本端形成明显正贡献；26Q2毛利率约55.1%；2）费用端，26H1销售/管理/研发/财务费用率分别约20.62%/3.32%/11.26%/0.87%，同比-1.35/-0.30/+1.97/+1.15pct；销售费用率明显优化，但公司继续大幅加码研发，研发投入18.69亿元/+56.5%，研发费用率提升近2pct。财务费用由上年同期-0.36亿元升至1.45亿元，主要受汇率波动带来的汇兑损失、可转债利息及手续费增加影响。3）减值方面，26H1资产减值损失4.44亿元，主要为存货跌价准备，较上年同期2.38亿元有所增加；期末存货账面价值67.34亿元，较2025年末49.97亿元增长34.8%，主要系公司主动备货及业务量增加。5）26H1归母/扣非净利率分别为10.25%/8.66%，同比+1.18/+1.19pct；所得税率约15.9%，同比提升约8pct，主要受利润增长及全球最低税支柱二规则适用影响，一定程度压制利润释放。 #分红：延续较高股东回报力度。公司拟实施2026年中期分红，每10股派发现金红利8元，预计现金分红4.70亿元，占26H1归母净利润的27.64%。#文字观点", "publish_time": "2026-08-30 20:26", "tags": ["文字观点"]}, "post:2026-08-30T19-20:a76722d6104b": {"id": "post:2026-08-30T19-20:a76722d6104b", "kind": "post", "title": "2026-08-30 19:20", "source_label": "帖子正文", "excerpt": "【PCB产业链】涨价继续加速，PTFE与M-SAP打开新一轮价值量提升——周度推荐 20260830 本周PCB产业链继续强化“#涨价兑现+工艺升级”主线。建滔启动年内第七轮调价，FR-4统一上涨10%，7628以下薄布PP上涨20%", "content": "【PCB产业链】涨价继续加速，PTFE与M-SAP打开新一轮价值量提升——周度推荐 20260830 本周PCB产业链继续强化“#涨价兑现+工艺升级”主线。建滔启动年内第七轮调价，FR-4统一上涨10%，7628以下薄布PP上涨20%；松下宣布9月起普通多层板及载板材料最高提价30%。电子布库存处于低位，8月价格环比约涨20%，产业链预计9月仍有提价可能。AI客户成本传导相对顺畅，电子布、CCL及高端PCB有望继续兑现量价齐升。 #PTFE有望成为2027年材料升级的重要方向。Rubin Ultra的NVSwitch及正交背板正在评估M9/M10与PTFE混压方案，目前有布或混压路线的产业化难度低于纯无布方案。核心观察点是材料送样及小批量订单，现阶段仍属于技术验证。材料端重点关注具备高端CCL和PTFE方案积累的生益科技，以及受益高端硅微粉用量提升的联瑞新材；加工端关注深南电路、生益电子、胜宏科技等。 #M-SAP进入光模块需求与板厂扩产共振阶段。800G向1.6T、3.2T升级后，光模块PCB布线密度明显提高，1.6T产品最小线宽线距向15μm级收缩，传统减成法已难以满足精度和良率要求，M-SAP逐步由可选工艺转向高端光模块及类载板的核心工艺。与此同时，CoWoP等先进封装方案的PCB线宽线距约20—30μm，进一步打开M-SAP应用边界。需求牵引下，鹏鼎、深南、兴森、景旺、红板、方正等板厂相继规划M-SAP产线，行业进入集中扩产期，并同步拉动超快激光钻孔、高精度LDI、电镀及CCD成型设备需求。芯碁微装26H1 PCB直接成像设备收入同比增长85%，已经验证高端LDI量价齐升。重点关注具备高端光模块和类载板工艺能力的鹏鼎控股、深南电路、景旺电子等。#文字观点", "publish_time": "2026-08-30 19:20", "tags": ["文字观点"]}, "post:2026-08-30T19-24:95c80c450bb4": {"id": "post:2026-08-30T19-24:95c80c450bb4", "kind": "post", "title": "2026-08-30 19:24", "source_label": "帖子正文", "excerpt": "20260830 科技纪要 电子：海外算力核心看好光和PCB，国产推荐存储与半导体设备材料 英伟达财报展望FY28收入增长约70%，且强调若不受供应约束可实现“100%增长”。长鑫财报单Q2归母净利润超500亿，盈利能力不输海外原厂。", "content": "20260830 科技纪要 电子：海外算力核心看好光和PCB，国产推荐存储与半导体设备材料 英伟达财报展望FY28收入增长约70%，且强调若不受供应约束可实现“100%增长”。长鑫财报单Q2归母净利润超500亿，盈利能力不输海外原厂。龙头公司的优秀业绩和指引，提振市场AI硬件信心，海外算力核心看好光和PCB，国产推荐存储与半导体设备材料。 a、光模块：索尔思客户订单进展良好，预计2027年收入150亿美金以上、30% 以上利润率，加上非索尔思部分，公司明年有望做到400亿利润水平，继续推荐#东山精密。b、PCB：Rubin 链供应链反馈订单提升，近期有变化的标的优选# 景旺电子、方正科技，稳健品种选# 沪电股份、鹏鼎控股、深南电路。近期胜宏科技中报业绩利空出尽，PTFE有进展的情况下生益科技值得关注。 c、存储与供应链：短期关注HBM行业进展，推荐精智达、芯源微、中科飞测；中期看两存扩产，推荐北方华创、中微、拓荆、微导纳米；远期看空间，推荐精测电子。 通信：板块情绪已接近见底，筹码出清，AI产业叙事蓄力中，看好硬件回归基本面 a、 结合近期海外财报和指引、头部DSP厂商和PIC流片厂商的反馈，我们判断27年800G/1.6T光模块需求非常强劲，且格局集中；3.2T/6.4T NPO需求也非常强劲，预计28年出货指数级增长。坚定看好# 中际旭创、新易盛、东山精密、源杰科技。 b、保偏光纤：NPO/CPO的0-1增量，从ELSFP模组→PIC链路需使用保偏光纤。# 近期产业交流针对2030年保偏光纤市场空间预期乐观，形成催化，关注#长盈通。c、OCS&薄膜铌酸锂：谷歌TPU v9的6D Torus架构或带来显著光连接增量，2.4T光模块配比提升，其中轻相干方案或用到薄膜铌酸锂，关注# 天通股份、安孚科技 ；OCS端口配比同样看到巨大弹性，关注# 腾景科技、德科立。 d、FAU-MMC：BOM占比从光模块内的10-15%的提升到NPO/CPO光引擎内的30%，且伴随通道数增长，产品壁垒提升，利润率或改善；首推# 天孚通信（无源实力最强）、蘅东光、仕佳光子（FAU/MMC+二线光芯片）、太辰光、长芯博创（MPO中报均超预期、Q3继续高增）、光库科技（安捷讯收购待验证）、杰普特、瑞可达、电连技术等新切入厂商。 计算机：持续推荐AI4S板块金斯瑞和国产算力 a、国产算力近期财报、供应担忧利空逐步出尽，寒武纪、天数、海光、壁仞迎来低位买点期。模型侧利空出尽，伴随后续新模型推荐#智谱。算租继续推荐#宏景、#行云。 b、持续推荐AI4S铲子股#金斯瑞生物科技：模型迭代需要闭环数据反馈，公司基因合成/蛋白表达全球市占率第一（高于Twist），伴随中报拐点显现，有望迎来持续重估。 传媒：继续推荐有安全边际的游戏板块和AI多模态 a、游戏：看好#腾讯。混元4.0作为团队重建后第三大版本，主打生产力场景​​，维持开源且价格具竞争力，通过高频迭代与性价比策略，深耕垂直场景，加速抢占B端生产力市场；A股游戏估值12-13倍有安全边际，继续推荐#完美、巨人、华通、恺英、三七等。 b、AI多模态：继续推荐#昆仑万维、中文在线、掌阅、快手；AI+广告推荐易点、汇量。#文字观点", "publish_time": "2026-08-30 19:24", "tags": ["东山精密", "长盈通", "文字观点"]}, "post:2026-08-30T19-19:136c9b1b859f": {"id": "post:2026-08-30T19-19:136c9b1b859f", "kind": "post", "title": "2026-08-30 19:19", "source_label": "帖子正文", "excerpt": "【申万宏源通信】周观点更新（20260830） 中报集中披露，分版块总结如下。整体上中报业绩验证光通信核心环节高景气，光器件/网络设备环节相对超预期，重视部分底部反转机会。", "content": "【申万宏源通信】周观点更新（20260830） 中报集中披露，分版块总结如下。整体上中报业绩验证光通信核心环节高景气，光器件/网络设备环节相对超预期，重视部分底部反转机会。 #光模块光芯片板块：26H1延续了24年、25年收入增长加速、利润率抬升趋势。光模块厂商增速和利润率分化原因：高速率产品占比（800G高景气+1.6T放量高增，产品结构高端化等）、客户结构、核心供应链的掌控力（高端光芯片激光器和InP衬底供给）。供需缺口下及CPO趋势下，光芯片源杰科技、仕佳光子等表现亮眼。算力基建持续投入，capex仍为重要指数。 #光器件：26H1总体高质量增长、收入高增+利润率提升同步兑现！ 无源光器件市场需求高景气，带动相应公司业绩高增，较多Q2单季度增速50-100%区间，代表性蘅东光/致尚科技/杰普特单Q2收入增速112%/67%/54%。板块平均毛利率从23Q1的27%稳步抬升至26Q2的37%（累计+10pct），反映产品结构升级（高速MPO/FAU占比提升）+规模效应显现。 #网络设备：整体超预期、交换机加速放量、超节点蓄势待发 Q2互联网客户数据中心交换机集中交付，锐捷/紫光单Q2收入增速42%/33%，利润增速66%/99%。从预付款项、合同负债等先行指标、结合超节点放量趋势看，预计26H2-27年网络侧业绩弹性将持续。 #光纤：优异业绩验证价格上行和产品结构升级 光纤提价叠加产能向A1/A2等高端产品迁移，长飞/中天/永鼎利润增速达889%/52%/58%。AI算力、DCI及无人机需求共振，有望支撑26H2-27年量价与产品结构持续改善。#IDC：订单先行、扩张周期无虞受芯片部署、项目交付及上架爬坡周期影响，26H1多数IDC公司业绩增速较温和。但订单角度，GDS、VNET等头部企业订单规模已创历史新高，具备能评和订单的核心公司有望进入交付、上架、收入及利润依次释放的正循环。 #物联网：龙头率先业绩拐点，重视底部机会，长期看端侧AI创新。此前存储涨价与车载部分客户变化等影响盈利，目前存储压力逐步缓解，下游需求旺盛，端侧AI+机器人+车载等增量明确，同时如广和通收购航盛电子等利好催化。端侧公司已调整较久，行业H2有望模型政策产品等多重催化。 #运营商：Capex大幅投向AI算力、分红率持续提升 业绩普遍小幅下滑，主因增值税税目调整+行业新旧动能转换。AI算力投资周期重启，派息率稳中有升，移动/电信H1分红率约为69%/75%。 欢迎联系申万宏源通信团队～ （刘菁菁15021130724/郝知雨/陈力扬/包轩豪/黄俊儒/赵航/林起贤18926086984等）#文字观点", "publish_time": "2026-08-30 19:19", "tags": ["IDC", "订单先行、扩张周期无虞", "文字观点"]}, "post:2026-08-30T19-27:3db3a25271d4": {"id": "post:2026-08-30T19-27:3db3a25271d4", "kind": "post", "title": "2026-08-30 19:27", "source_label": "帖子正文", "excerpt": "天风通信丨华懋科技：#当前位置重点推荐、低位&富创业绩持续兑现度好&FCC不受影响&有积极变化 🔥华懋科技发布公告，更新提交问询函材料和购买资产草案。预计近期收购恢复，后持续推进流程。", "content": "天风通信丨华懋科技：#当前位置重点推荐、低位&富创业绩持续兑现度好&FCC不受影响&有积极变化 🔥华懋科技发布公告，更新提交问询函材料和购买资产草案。预计近期收购恢复，后持续推进流程。 1.公司业绩持续高增，业绩承诺2.5亿（26H1已实现约2.2亿，业绩持续兑现度好），#收购不存在实质障碍。26年预计出货800g 1300万只+，1.6t 300万只+，#27年根据订单forecast预计800和1.6t出货均可达2000万只，28年npo放量。 2.富创优越亮点梳理如下 ①绑定大客户：深度合作Cohr和Lite，均为1.6T核心供应商（1.6T Cohr约90%份额，LITE约60%份额）。 ②新客户拓展：新拓展包括AAOI，华工（NPO），以及#Marvell进入光引擎，28年有望放量。 ③光模块明年800G&1.6T市场或达到各1亿颗，公司光模块pcba份额约20%，#对应明年光模块有望实现12-13亿利润。 ④公司客户3起量明显，有望受益国产算力放量持续爆发（明年有望实现2-3亿利润）。客户2铜连接业务也呈现大幅度增长（预计明年约1亿利润）。 ⑤26H1实现2.2亿利润且未来数个季度有望持续环比40%增长，27年或将持续爆发增长（#整体富创优越27年预计18亿左右利润）。 3.富创优越未来NPO/CPO放量核心受益。 公司目前NPO/CPO客户已有多家，包括目前的核心大客户以及Marvell光引擎新突破，华工光迅NPO，以及J客户突破中。NPO/CPO价值量和单颗利润对比1.6T进一步提升（封装难度升级，预计单支利润翻倍）。#看好28年NPO增量10亿+利润。4.先进封装不断布局。参股25%中科智芯，目前更名为华懋智芯。公司具备先进封装能力，#该公司已掌握晶圆级封装、扇出型晶圆封装、2.5D/3D、TSV等先进封装核心技术。 🚀当前位置，考虑明年并表，预计有望实现约20亿+利润。目前低估值，有进展催化，NPO/CPO/OCS受益，重点推荐。 ☎️天风通信团队#文字观点", "publish_time": "2026-08-30 19:27", "tags": ["看好28年NPO增量10亿+利润", "文字观点"]}, "post:2026-08-30T22-22:4e12a2f921d8": {"id": "post:2026-08-30T22-22:4e12a2f921d8", "kind": "post", "title": "2026-08-30 22:22", "source_label": "帖子正文", "excerpt": "【ZX通信】重点推荐——OCS产业链：从“谷歌定制”到AI网络刚需！核心变化点：NV未来或称为OCS的最大买家！", "content": "【ZX通信】重点推荐——OCS产业链：从“谷歌定制”到AI网络刚需！核心变化点：NV未来或称为OCS的最大买家！ 根据产业链调研，NV正在督促Cohr，Lite与国内厂商推进OCS进度，这与本周LIte CEO在德意志银行2026科技大会提到的“体量比谷歌更大的客户”相吻合。目前NV OCS的应用场景覆盖Scale up+Scale out+ Scale across，我们了解可能会采用OCS+CPO/NPO混合布局的架构，有望有效降低成本+功耗，提升网络弹性+故障恢复能力。我们认为OCS未来有望成为AI网络的标配，而非此前市场认为的谷歌链，市场空间会显著大幅提高。哪些标的最受益？ 目前投资线索有两条，一条是Cohr/Lite/旭创 OCS整机的上游器件供应商，另一条是和OCS配套的Coherent Lite模块：1、OCS整机上游器件供应商#腾景科技：产品覆盖MEMS+液晶+压电陶瓷全方案，目前是Cohr偏振分光棱镜、晶体光楔等核心光学件，高通道准直器阵列核心供应商，#价值量非常高，泰国工厂还在验证第二家海外整机客户，订单弹性被NV放量直接打开。#光库科技：MEMS链核心供应商，海外龙头的2D Fiber Array主力供应方+子公司是潜在装调代工方。#炬光科技：MEMS方案的2D Lens Array供应商，国内外龙头均有采购。#东田微：海外核心客户的无源新晋供应商，未来有望拓展OCS上游器件。2、Coherent Lite模块#天通股份：国内薄膜铌酸锂绝对龙头，2028年TFLN+硅光Coherent Lite模块会配合OCS一起上量，且2.4T第一代就有导入机会。同时我们认为2028年3.2T光模块也有望放放量，有望迎来OCS+可插拔+NPO三轮驱动！#文字观点", "publish_time": "2026-08-30 22:22", "tags": ["腾景科技", "光库科技", "炬光科技", "东田微", "天通股份", "文字观点"]}, "post:2026-08-30T19-49:20c5be980fd6": {"id": "post:2026-08-30T19-49:20c5be980fd6", "kind": "post", "title": "2026-08-30 19:49", "source_label": "帖子正文", "excerpt": "📑胜宏科技增长验证转向利润率修复📊胜宏科技（300476.SZ）2026 年第 2 季度收入 61.1 亿元，环比增长 10.7%、同比增长 29.5%，但分别低于美银和市场预期 ", "content": "📑胜宏科技增长验证转向利润率修复📊胜宏科技（300476.SZ）2026 年第 2 季度收入 61.1 亿元，环比增长 10.7%、同比增长 29.5%，但分别低于美银和市场预期 3.2% 与 5.8%。 💼营业利润 15.32 亿元，环比下降 1.0%，亦低于两项预期 7.8% 与 16.4%。 💰同期净利润 15.68 亿元，环比增长 21.7%、同比增长 28.3%，分别超出美银和市场预期 9.6% 与 4.4%，主要由较高公允价值收益推动。 📉毛利率则从第 1 季度 34.5% 降至 32.1%，净利润超预期未反映主营经营同步改善。 ⚠️利润率承压源于新平台量产前的成本投入。 👔管理层称，公司为第 3 季度平台爬坡提前增加员工并确认新增产能折旧，员工数环比增加 30% 以上。 🔍若 Vera Rubin 按期放量，人员和设备利用率提升将成为单位成本下降与毛利率修复的条件。 📈美银模型预计，第 3 季度收入和营业利润分别环比增长 35% 与 44%，第 4 季度再分别增长 40% 与 56%。 🎯中期支撑来自订单可见性延伸至 2027 年、管理层计划于 2027 年底前把产能提升至 1000 亿元人民币，并拓展 ASIC、光模块 mSAP 及国内服务器项目。 🔎后续需验证第 3 季度至第 4 季度毛利率能否逐季回升、Vera Rubin 产能能否转化为收入，以及英伟达供应链 50% 以上份额能否维持。 ❗风险包括竞争加剧、AI 云资本开支或 GPU 升级放缓、机架供应链瓶颈、2026 年自由现金流仍为负，以及盈利预测低于市场预期。#文字观点", "publish_time": "2026-08-30 19:49", "tags": ["文字观点"]}, "post:2026-08-30T23-11:1d55e9cb7c24": {"id": "post:2026-08-30T23-11:1d55e9cb7c24", "kind": "post", "title": "2026-08-30 23:11", "source_label": "帖子正文", "excerpt": "高盛——胜宏科技（300476.SZ）：下一代 GPU 和 ASIC AI 服务器 PCB 驱动 2026 年下半年增长", "content": "高盛——胜宏科技（300476.SZ）：下一代 GPU 和 ASIC AI 服务器 PCB 驱动 2026 年下半年增长；2026 年二季度收入环比加速；买入 一、 核心业绩回顾 胜宏科技 2026 年二季度收入 61.1 亿元人民币，同比增长 29%，环比增长 11%。这一表现低于高盛预测及彭博一致预期约 16% 和 6%，主要归因于 AI PCB 产能爬坡慢于预期——由于 AI 服务器内部数据传输对精度和技术要求更高，其产能建设周期通常长于传统 PCB。二季度毛利率同样低于预期，原因是关键原材料（如 AI 覆铜板 CCL）成本上升。不过，公司营业费用率仅 6.0%，优于预期，反映出运营效率改善；叠加高于预期的非经营性收入，二季度净利润同比增长 28%，环比增长 22%，符合彭博一致预期，但较分析师预测低 11%。截至二季度末，公司存货水平环比大增 51% 至 59 亿元人民币，这将为下半年下一代 GPU 和 ASIC AI 服务器 PCB 的出货增长提供有力支撑。上半年资本支出同比飙升 228% 至 71 亿元人民币，彰显公司在 AI PCB 产能扩张上的坚定投入。随着 AI PCB 向更高层数、更高端 CCL 升级，其产能消耗将远超传统产品，高盛预计产能扩张将使公司更好地捕捉日益增长的 AI PCB 终端需求。 二、 AI PCB 市场前景 高盛在全球 AI PCB 总可寻址市场（TAM）更新中，将 2026 年和 2027 年预测分别上调 35% 和 38%，预计 2026 至 2028 年价值 TAM 将分别达到 140 亿美元、380 亿美元和 840 亿美元。核心驱动因素包括：全球 GPU 和 ASIC AI 服务器出货量增加、主要厂商产能扩张、AI PCB 规格向高多层升级以支持数据传输，以及单机柜 AI 服务器的美元含量提升。高盛对胜宏科技维持积极看法，理由有六点：AI 基础设施投入加大；AI PCB 向高多层规格升级带动单机价值量上升；AI 服务器中 PCB 替代铜缆的趋势；客户群向 ASIC AI 服务器 PCB 拓展；研发与资本支出承诺；高度自动化的生产线与仓储管理。 三、 盈利预测调整 基于二季度业绩，高盛将胜宏科技 2026 年净利润预测下调 13%，主要反映收入和毛利率的降低。其中，2026 年收入预测下调 10%，以体现二季度收入不及预期；毛利率预测下调，源于原材料成本上升及新产能爬坡带来的折旧压力；营业费用率预测则因运营效率改善而下调。2027 至 2030 年盈利预测基本维持不变。 四、 估值与目标价 胜宏科技当前股价为 263.05 元人民币（2026 年 8 月 27 日收盘价），高盛给予的 12 个月目标价为 550.00 元人民币，潜在上行空间达 109.1%，维持“买入”评级。预测数据显示，公司 2026 年至 2028 年预期收入分别约为 329 亿元、647 亿元和 879 亿元人民币；同期每股收益（EPS）预计分别为 10.00 元、20.84 元和 27.46 元人民币。估值方面，2026 年预期市盈率约 26.3 倍，2027 年降至 12.6 倍。 五、 关键风险 主要下行风险包括：AI 服务器出货爬坡速度慢于预期；AI 服务器 PCB 规格升级进度不及预期；市场竞争比预期更为激烈。#文字观点", "publish_time": "2026-08-30 23:11", "tags": ["文字观点"]}, "post:2026-08-30T19-18:f0aaa2397048": {"id": "post:2026-08-30T19-18:f0aaa2397048", "kind": "post", "title": "2026-08-30 19:18", "source_label": "帖子正文", "excerpt": "🔥【长鑫科技】中报点评：业绩大超预期，具备深度战略投资价值 #26Q2公司业绩全面超预期（大幅超指引上沿/超市场乐观预期）： 营收995亿元（yoy+977%，qoq+96%）", "content": "🔥【长鑫科技】中报点评：业绩大超预期，具备深度战略投资价值 #26Q2公司业绩全面超预期（大幅超指引上沿/超市场乐观预期）： 营收995亿元（yoy+977%，qoq+96%）； 净利润745亿元（同比扭亏，qoq+126%）； 归母净利润528亿元（同比扭亏，qoq+113%），市场乐观预期在500亿上下； 毛利率87.6%（yoy+75pcts，qoq+8pcts）； 净利率74.9%（yoy+89pcts，qoq+10pcts）。#产品及市场结构快速升级DDR系列高端产品量价齐升，26H1收入695亿元（yoy+1540%），营收占比提升至46%，毛利率达88.4%。 LPDDR系列（主攻手机、车载等高景气应用）收入782亿元（yoy+636%），毛利率82.6%，新一代LPDDR6面世。 公司服务器端、AI相关产品、PC端等终端需求强势增长，服务器和AI相关产品营收比重持续提升，驱动整体产品结构向高价值端跃迁，DDR/LPDDR/HBM三线并进。#扩产与技术“跳代”，厚植护城河产线扩张及效率提升，合肥一期/二期、北京一期多线达产，折旧在H1已大幅下降至营收的10%，显著释放规模效应。 HBM（高带宽存储）/DDR5/LPDDR6等高端产品突破，技术平台“跳代升级”，缩短与海外龙头的代际差距。#LPDDR6首发量产，国际并跑2026年8月29日，长鑫科技正式对外宣布其自主研发的最新一代低功耗内存芯片LPDDR6实现全球首次量产，并官宣将首批搭载于即将上市的小米18 Fold折叠旗舰手机。中国厂商首次在高端存储标准制订与商用节奏上进入全球第一梯队，助推国产DRAM进入结构性突破新阶段。东方科技巨擘，迎来戴维斯双击时刻 2026年上半年，长鑫科技交出了一份极为亮眼的中报：业绩绝对值与增速均为行业翘楚，盈利结构优化，现金流充沛，产品结构加速高端化，行业和公司层面α与β共振。长期看，随着AI相关需求持续爆发、国产替代提速、表外产能注入兑现，长鑫科技有望在全球DRAM竞争格局中地位进一步提升，展现极高的长期成长弹性与战略投资价值#文字观点", "publish_time": "2026-08-30 19:18", "tags": ["产品及市场结构快速升级", "扩产与技术“跳代”", "厚植护城河", "LPDDR6首发量产", "国际并跑", "文字观点"]}, "post:2026-08-30T20-18:f2a1ddd42aad": {"id": " /盎司。\n\n## 二、今日最强主线\n\n1. **AI 算力/大模型**\n   - 主线：AI 算力需求持续扩张，云厂商采购上限与算力租赁合同规模大幅提高，AI 基础设施向 Pod 级超节点演进。\n   - 今天强化的逻辑：MiniMax 将 2026-2028 年阿里云采购上限提高至 12 亿美元（+220%）；Anthropic 或将租用 Nscale 约 450 亿美元算力；英伟达 FY28 展望增长约 70%。\n   - 今天出现的催化/验证：智谱发布 GLM-5.3-Flash、调用超 10 万张国产芯片；NVIDIA 新增“Scale-In”；紫光股份 26H1 营收 635.16 亿元（+33.93%）、归母净利润 21.67 亿元（+108.18%）。\n\n2. **半导体/先进封装**\n   - 主线：存储涨价、国产算力放量及中报业绩持续验证，市场对存储、半导体设备及 Fab 等景气方向关注度高。\n   - 今天强化的逻辑：长鑫科技 26Q2 业绩全面超预期，Q2 净利润 528.43 亿元；长江存储 26Q1 收入 470 亿元、归母净利润 338 亿元、净利率 71%。\n   - 今天出现的催化/验证：长鑫科技中报点评、路透报道长鑫存储于周五起诉五角大楼、粤芯半导体取得 IPO 注册批文。\n\n3. **PCB/CCL/铜箔**\n   - 主线：“涨价兑现+工艺升级”，PTFE 与 M-SAP 打开新一轮价值量提升。\n   - 今天强化的逻辑：PTFE 的 DK 值 2.0-2.2、DF 值 0.0008-0.001，处于罗杰斯 M9 等级，性能优于 M8；PTFE CCL 成本约 2200 元/平方米，核心原因是量产良率较低。\n   - 今天出现的催化/验证：建滔启动年内第七轮调价（FR-4 上涨 10%、7628 以下薄布 PP 上涨 20%）；东材科技高速高频树脂进入规模化放量阶段，2026 年 1-7 月收入 6.6 亿元、超过 2025 年全年 5.9 亿元，全年预计超 16 亿元。\n\n4. **光通信/CPO**\n   - 主线：海外算力核心看好光和 PCB；OCS 从“谷歌定制”走向 AI 网络刚需。\n   - 今天强化的逻辑：FAU-MMC 的 BOM 占比从光模块内 10-15% 提升到 NPO/CPO 光引擎内 30%，且伴随通道数增长、产品壁垒提升；谷歌 TPU v9 的 6D Torus 架构或带来显著光连接增量。\n   - 今天出现的催化/验证：观点称 NV 未来或成为 OCS 最大买家；CPO、OCS、SiPh 器件驱动测试与组装设备增长（罗博特科）；光芯片（源杰科技、仕佳光子等）表现亮眼。\n\n5. **液冷/电源**\n   - 主线：OCP 高压电源架构升级，PDB 模块成为核心变化，利好具备强芯片能力的电源公司。\n   - 今天强化的逻辑：PDB 架构（800/±400V→54V 电源模块）是未来 ±400V、800V 高压架构下最核心的变化，后续形态包括 ±400-54V、800-54V、800-6V 等；对纹波控制、瞬态响应的高要求使产业链向具备强芯片能力的公司集中。\n   - 今天出现的催化/验证：英飞凌、意法半导体在服务器电源领域涨价约 30%-40%；国内厂商芯联集成涨价约 10%-20%；碳化硅功率器件缺货程度排序为服务器>汽车>充电桩>工业>储能。\n\n6. **宏观/策略**\n   - 主线：A 股中报业绩收官，市场风格分化（上证 +1.20%、创业板指 -3.42%）；地产新政将不确定性从居民转给开发商。\n   - 今天强化的逻辑：黄金短期承压，Jackson Hole 偏鹰压制金价；贵金属承压，伦敦金当日下跌约 2.2%，美股冲高回落。\n   - 今天出现的催化/验证：地产预售制度调整（按揭贷款发放时间从封顶改为竣备）、现房销售推出；9 月波动加大，9 月 15 日中期选举初选结果待观察。\n\n## 三、今日重点关注\n\n### 3.1 今天已经发生的重点变化\n- **AI 算力/大模型**：MiniMax 将 2026-2028 年阿里云服务采购上限提高至 12 亿美元（+220%）；智谱发布 GLM-5.3-Flash，调用超 10 万张国产芯片；NVIDIA 新增“Scale-In”；紫光股份 26H1 营收 635.16 亿元（+33.93%）、归母净利润 21.67 亿元（+108.18%）。\n- **半导体/存储**：长鑫科技中报大超预期（26Q2 营收 995 亿元，上半年净利 776.05 亿元）；路透报道长鑫存储于周五起诉五角大楼；粤芯半导体于本周五取得 IPO 注册批文。 内冲高回落，伦敦金 -3.24% 至 4453.67 美元/盎司。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>AI 算力/大模型\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：AI 算力需求持续扩张，云厂商采购上限与算力租赁合同规模大幅提高，AI 基础设施向 Pod 级超节点演进。\u003c/li>\n\u003cli>今天强化的逻辑：MiniMax 将 2026-2028 年阿里云采购上限提高至 12 亿美元（+220%）；Anthropic 或将租用 Nscale 约 450 亿美元算力；英伟达 FY28 展望增长约 70%。\u003c/li>\n\u003cli>今天出现的催化/验证：智谱发布 GLM-5.3-Flash、调用超 10 万张国产芯片；NVIDIA 新增“Scale-In”；紫光股份 26H1 营收 635.16 亿元（+33.93%）、归母净利润 21.67 亿元（+108.18%）。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：存储涨价、国产算力放量及中报业绩持续验证，市场对存储、半导体设备及 Fab 等景气方向关注度高。\u003c/li>\n\u003cli>今天强化的逻辑：长鑫科技 26Q2 业绩全面超预期，Q2 净利润 528.43 亿元；长江存储 26Q1 收入 470 亿元、归母净利润 338 亿元、净利率 71%。\u003c/li>\n\u003cli>今天出现的催化/验证：长鑫科技中报点评、路透报道长鑫存储于周五起诉五角大楼、粤芯半导体取得 IPO 注册批文。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：“涨价兑现+工艺升级”，PTFE 与 M-SAP 打开新一轮价值量提升。\u003c/li>\n\u003cli>今天强化的逻辑：PTFE 的 DK 值 2.0-2.2、DF 值 0.0008-0.001，处于罗杰斯 M9 等级，性能优于 M8；PTFE CCL 成本约 2200 元/平方米，核心原因是量产良率较低。\u003c/li>\n\u003cli>今天出现的催化/验证：建滔启动年内第七轮调价（FR-4 上涨 10%、7628 以下薄布 PP 上涨 20%）；东材科技高速高频树脂进入规模化放量阶段，2026 年 1-7 月收入 6.6 亿元、超过 2025 年全年 5.9 亿元，全年预计超 16 亿元。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：海外算力核心看好光和 PCB；OCS 从“谷歌定制”走向 AI 网络刚需。\u003c/li>\n\u003cli>今天强化的逻辑：FAU-MMC 的 BOM 占比从光模块内 10-15% 提升到 NPO/CPO 光引擎内 30%，且伴随通道数增长、产品壁垒提升；谷歌 TPU v9 的 6D Torus 架构或带来显著光连接增量。\u003c/li>\n\u003cli>今天出现的催化/验证：观点称 NV 未来或成为 OCS 最大买家；CPO、OCS、SiPh 器件驱动测试与组装设备增长（罗博特科）；光芯片（源杰科技、仕佳光子等）表现亮眼。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>液冷/电源\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：OCP 高压电源架构升级，PDB 模块成为核心变化，利好具备强芯片能力的电源公司。\u003c/li>\n\u003cli>今天强化的逻辑：PDB 架构（800/±400V→54V 电源模块）是未来 ±400V、800V 高压架构下最核心的变化，后续形态包括 ±400-54V、800-54V、800-6V 等；对纹波控制、瞬态响应的高要求使产业链向具备强芯片能力的公司集中。\u003c/li>\n\u003cli>今天出现的催化/验证：英飞凌、意法半导体在服务器电源领域涨价约 30%-40%；国内厂商芯联集成涨价约 10%-20%；碳化硅功率器件缺货程度排序为服务器&gt;汽车&gt;充电桩&gt;工业&gt;储能。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：A 股中报业绩收官，市场风格分化（上证 +1.20%、创业板指 -3.42%）；地产新政将不确定性从居民转给开发商。\u003c/li>\n\u003cli>今天强化的逻辑：黄金短期承压，Jackson Hole 偏鹰压制金价；贵金属承压，伦敦金当日下跌约 2.2%，美股冲高回落。\u003c/li>\n\u003cli>今天出现的催化/验证：地产预售制度调整（按揭贷款发放时间从封顶改为竣备）、现房销售推出；9 月波动加大，9 月 15 日中期选举初选结果待观察。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>AI 算力/大模型\u003c/strong>：MiniMax 将 2026-2028 年阿里云服务采购上限提高至 12 亿美元（+220%）；智谱发布 GLM-5.3-Flash，调用超 10 万张国产芯片；NVIDIA 新增“Scale-In”；紫光股份 26H1 营收 635.16 亿元（+33.93%）、归母净利润 21.67 亿元（+108.18%）。\u003c/li>\n\u003cli>\u003cstrong>半导体/存储\u003c/strong>：长鑫科技中报大超预期（26Q2 营收 995 亿元，上半年净利 776.05 亿元）；路透报道长鑫存储于周五起诉五角大楼；粤芯半导体于本周五取得 IPO 注册批文。\u003c/li>\n\u003cli>\u003cstrong>PCB/CCL\u003c/strong>：建滔启动年内第七轮调价（FR-4 上涨 10%、7628 以下薄布 PP 上涨 20%）；PTFE 专家及产业链调研更新：良率持续提升、仍处测试阶段、PTFE CCL 成本约 2200 元/平方米。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>：中报验证光通信核心环节高景气，光器件/网络设备环节相对超预期；汇聚科技上半年利润同比 +164%；《后西游记》定档 2026 年 8 月 31 日，为国内首部上电视的 AI 长剧（首部 100% 由 Seedance 2.0、Seedance 2.5 提供 AI 技术支持，无真人演员参与，采用“边审边播”模式）。\u003c/li>\n\u003cli>\u003cstrong>电源/功率器件\u003c/strong>：英飞凌、意法半导体在服务器电源领域涨价约 30%-40%；国内厂商芯联集成涨价约 10%-20%；碳化硅功率器件缺货程度排序为服务器&gt;汽车&gt;充电桩&gt;工业&gt;储能。\u003c/li>\n\u003cli>\u003cstrong>商业航天/卫星\u003c/strong>：中国卫通推出“卫星移动数据业务”，首批适配便携抛物面、车载平板及相控阵动中通三款认证终端；SpaceX 与路易斯安那州宣布建设“Starbase Louisiana”，规划 10 座发射台、投资最高 1000 亿美元。\u003c/li>\n\u003cli>\u003cstrong>新能源/汽车\u003c/strong>：协鑫科技 2026H1 总营收 57.77 亿元（+0.73%），毛亏 4.34 亿元（同比收窄 38.1%），负毛利率收窄至 -7.5%；博迁新材上半年营收 8.90 亿元（+71.60%）、归母净利润 1.36 亿元（+28.50%），AI 用高端镍粉放量、光伏铜代银产业化落地。\u003c/li>\n\u003cli>\u003cstrong>市场/策略\u003c/strong>：A 股中报披露接近尾声，电子行业景气度持续提升、盈利增速加快；黄金周内冲高回落，伦敦金 -3.24% 至 4453.67 美元/盎司、COMEX 黄金主连 -3.38% 至 4504.1 美元/盎司。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>AI 算力\u003c/strong>：英伟达 Vera Rubin 量产进度；Nscale 自 2027 年底起向 Anthropic 提供 Vera Rubin 计算能力；国产算力超节点 Q3 开始规模出货、Q4 爬坡。\u003c/li>\n\u003cli>\u003cstrong>存储/半导体\u003c/strong>：长鑫科技后续季度业绩兑现与存储涨价延续性；先进存储（长鑫科技）、先进制程（中芯国际/华虹宏力）景气验证；半导体设备、Fab 自主可控方向。\u003c/li>\n\u003cli>\u003cstrong>PCB/CCL\u003c/strong>：PTFE 从测试走向大规模放量的时点、良率与成本下降节奏；东材科技高速高频树脂全年收入预计超 16 亿元。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>：OCS 产业链是否进入放量（NV 或成为最大买家）；谷歌 TPU v9 6D Torus 架构带来的 2.4T 光模块配比提升与薄膜铌酸锂方案进展。\u003c/li>\n\u003cli>\u003cstrong>电源/功率器件\u003c/strong>：碳化硅功率器件缺货与服务器电源涨价向产业链的传导（英飞凌/意法半导体 30%-40%、芯联集成 10%-20%）。\u003c/li>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>：9 月波动加大，关注 9 月 15 日中期选举初选结果；黄金短期聚焦美联储独立性博弈。\u003c/li>\n\u003cli>\u003cstrong>商业航天\u003c/strong>：SpaceX 星舰后续试飞计划：首次开展轨道级飞行并部署星链 V3 卫星，拟在墨西哥湾溅落，为第 15 次试飞尝试塔架回收积累数据；Starbase Louisiana 建设进展。\u003c/li>\n\u003cli>\u003cstrong>新能源\u003c/strong>：协鑫科技 LFP 材料业务与光伏硅料“硅料降本→光伏装机增长→储能需求上升→LFP 出货增长”正向循环验证；马斯克称 SpaceX 和 Tesla 在尽可能快地每年建设 100 吉瓦太阳能生产能力，几年内仍依赖天然气补充。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>08:35｜南方航空2026半年报点评【国联民生交运】2026H1收入947亿元，同比+10%；归母净亏损37.0亿元（上年同期亏损15.3亿元）\u003c/li>\n\u003cli>08:35｜巨星农牧26年中报业绩交流要点#26H1业绩拆分：养殖亏损7.92亿元，皮革亏损0.46亿元，合计归母亏损8.38亿元。#生产指标：26H1PSY30头，育肥成活率95%，断奶仔猪成本264元/头，26H1完全成本12.6元/公斤以内，7月降至12.4元/公斤，Q4目标12元/公斤以内。\u003c/li>\n\u003cli>08:35｜【长川科技】2026中报点评：业绩高速增长，测试机龙头充分受益于SoC&amp;存储共振【东吴机械】 👉测试机与分选机需求旺盛，业绩实现高速增长：2026H1公司营业收入为34.61亿元，同比+59.7%，其中测试机收入18.71亿元，同比+49.7%，占比54.1%，分选机收入11.58亿元，同比+63.3%，占比33.5%，其他收入4.31亿元，同比+107.5%，占比12.5%；归母净利润为9.64亿元，同比+125.7%\u003c/li>\n\u003cli>08:36｜蓝色光标（300058）26Q2财报点评：毛利率提升显著，26H1 AI驱动收入约28亿元、yoy+81% #毛利率提升计划进展顺利、Q2毛利率3.3% ▶26H1收入346亿元、yoy+7%；归母2.1亿元，yoy+119%。\u003c/li>\n\u003cli>08:36｜海澜之家26H1点评：Q2收入平稳、利润承压，新业务投入加大，高分红延续 2026H1公司实现收入/归母净利润/扣非净利润124.20/14.88/14.37亿元，分别同比+7.38%/-5.86%/-8.24%；其中26Q2实现收入/归母净利润/扣非净利润57.59/5.39/4.92亿元，分别同比+7.06%/-16.53%/-23.24%。\u003c/li>\n\u00
