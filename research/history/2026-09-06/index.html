bd23aad": {"id": "post:2026-09-06T21-02:767f1bd23aad", "kind": "post", "title": "2026-09-06 21:02", "source_label": "帖子正文", "excerpt": "浙商机械大制造【船舶行业】BDI指数强势上涨，2026年船舶行业有望量价齐升，持续推荐！", "content": "", "publish_time": "2026-09-06 21:02", "tags": ["文字观点"]}, "post:2026-09-06T22-34:59a4f9ac1cf0": {"id": "post:2026-09-06T22-34:59a4f9ac1cf0", "kind": "post", "title": "2026-09-06 22:34", "source_label": "帖子正文", "excerpt": "【船舶】BDI指数强势上涨，未来几年散货船有望迎来订单高峰期，船舶行业有望量利齐升，持续力推！", "content": "", "publish_time": "2026-09-06 22:34", "tags": ["文字观点"]}, "post:2026-09-06T20-27:7f1470163d74": {"id": "post:2026-09-06T20-27:7f1470163d74", "kind": "post", "title": "2026-09-06 20:27", "source_label": "帖子正文", "excerpt": "关注后续产能投放和订单落地催化。", "content": "", "publish_time": "2026-09-06 20:27", "tags": ["文字观点"]}, "post:2026-09-06T17-59:dff31422dca4": {"id": "post:2026-09-06T17-59:dff31422dca4", "kind": "post", "title": "2026-09-06 17:59", "source_label": "帖子正文", "excerpt": "重点关注： 1）端侧及应用：海康威视、大华股份、萤石网络、中科创达、德赛西威、道通科技等", "content": "", "publish_time": "2026-09-06 17:59", "tags": ["文字观点"]}}, "source_details": {"post:2026-09-06T16-04:f54916092f17": {"id": "post:2026-09-06T16-04:f54916092f17", "kind": "post", "title": "2026-09-06 16:04", "source_label": "帖子正文", "excerpt": "【3C计算机】GPT-6 Astra初步实测点评本周的关注点主要是GPT-6 Astra和Fable-5.1两款全球最前沿的模型，随着GPT-6 Astra面向更多用户的开放，更多真实的测评体验开始放出，我们周末也做了一些测试，初步结论是Astra推理效率领先，复杂编程基本追平Fable，并在3D建", "content": "【3C计算机】GPT-6 Astra初步实测点评本周的关注点主要是GPT-6 Astra和Fable-5.1两款全球最前沿的模型，随着GPT-6 Astra面向更多用户的开放，更多真实的测评体验开始放出，我们周末也做了一些测试，初步结论是Astra推理效率领先，复杂编程基本追平Fable，并在3D建模、Computer Use等场景具有突出特点 1️⃣ Coding&Agent能力相比GPT-5.6 Sol提升明显，基本追平Fable-5.1，在前端编程方面审美大幅提升，相比Fable系列已无明显差距；后端方面参考部分专业开发者的明显也有明显进步；且GPT-6在长上下文能力上有较大提升，支撑了其在复杂长任务场景的优势 2️⃣ 3D场景建模与Computer Use是突出的特色能力，尤其是在3D方面，GPT-6结合Blender已经能够完成对多种精细复杂3D场景的建模，并且做到可交互，进而实现简单的3D类游戏，这类案例对于用户感知较为直观也有很多案例；Computer Use方面这次提升的是对用户鼠标和键盘控制的精度和速度，这方面需要和Mac结合效果更好，我们这次没有做测试但参考其他测评反馈也效果不错 3️⃣ 长上下文能力有明显提升，真正意义上做到100万上下文的基本无Context丢失与低幻觉，先前很多支持100万上下文的模型实际上到了50万以上就会出现明显的Context丢失问题，但GPT-6基本能实现完全的支撑，因此其在超长任务的执行中相比前代模型能够拉开更大的差距，真正能够实现长时间自主工作 4️⃣ 科研任务能力是另一特点，尤其是在数学领域，这点与Fable-5.1提升方向一致，我们并无法进行测试但参考一些数学家最近的工作（孪生素数、费马大定理），我们预计后续还会有更多GPT-6与数学研究结合领域创新成果发布 5️⃣ 追求高Token效率，但实际使用成本依然不低，此次OpenAI官方表示GPT-6具有很高的Token效率，完成同样的任务需要更少的Token，因此即使单价上涨但综合任务成本增加不多；但实测下来GPT-6的成本还是很高的，体感的用量消耗速度是5.6 Sol的2-3倍，但相比Fable系列依然具有性价比优势GPT-6此次的更新相比GPT-5.6有明显的进步，虽然说没有全面超越Fable，但可以说已经没有哪方面明显落后，并且有自己的显著长板；再结合OpenAI在算力Infra端的供给优势，我们认为其与Anthropic之间的竞争态势将进一步发生变化，同时前沿模型的能力边界仍在进一步推进向前#文字观点", "publish_time": "2026-09-06 16:04", "tags": ["文字观点"]}, "post:2026-09-06T20-03:69ad5930122c": {"id": "post:2026-09-06T20-03:69ad5930122c", "kind": "post", "title": "2026-09-06 20:03", "source_label": "帖子正文", "excerpt": "#GPT-6(Astra)发布点评-0906： ❶OpenAI发布“全球最智能且对齐程度最高的模型”GPT-6 Astra，定价$10/50全面对标Fable 5；#这是OpenAI首次用超10万张GPU完成的超大训练规模，证明“超大规模算力+超大参数”是scaling路线仍未触顶", "content": "#GPT-6(Astra)发布点评-0906： ❶OpenAI发布“全球最智能且对齐程度最高的模型”GPT-6 Astra，定价$10/50全面对标Fable 5；#这是OpenAI首次用超10万张GPU完成的超大训练规模，证明“超大规模算力+超大参数”是scaling路线仍未触顶；#据外媒报道Astra采用了recurrent depth/ looped transfomer架构，即重复利用好同一组网络层进行多轮内部计算，但代价是思维链可读性降低；OpenAI官方给到的线索有 1）Astra的CoT可监测性显著下降、2）Astra的计算图深度在GPT-4的2倍以内、3）无CoT能力/CoT控制能力明显增强； ❷Astra的能力提升体现在：1）#ComputerUse能力变强：Astra的ComputerUse能力被OpenAI认为是最具质变的能力，Astra现在相当于一种通用 GUI Connector，能够直接看屏幕并操作鼠标键盘，因此Agent不再依赖每个软件单独开发API/Connector，大幅扩展可操作软件的范围&自动化开发过程中的验收测试环节；2）#视觉理解与专业内容生产能力变强：Astra 对软件状态、视觉空间结构及生成结果的理解和判断能力增强，并结合 Coding + ComputerUse 操作 Blender/UE/KiCad/CAD/SolidWorks，可用于 3D建模/工业设计、游戏制作、PCB设计、3D打印等；在AutomationBench上GPT-5.6 Sol（18.1%）→Astra（41.4%），意味着Astra正在把AI从“会使用工具”推向“能在专业软件环境里独立完成工作流”； ❸#Astra在模型性能、适用场景、三方测评等均呈现割裂感。官方口径下的FrontierMath_Tier4、OSWorld_2.0、Terminal-Bench等全面刷新纪录，但Artificial_Analysis仅与前代Sol持平，在知识/经济价值基准反而进一步回落。#这意味着成本敏感的低中价值场景不再具备使用Astra的经济性、建议沿“单任务价值量×成功率”框架筛选受益领域，比如科学研究/创新工程/工业软件等高价值密度场景；例如，OpenAI和Anthropic近期动作表明“物理和数字世界融合”是模型迭代的确定性趋势，而Astra优势高度集中在\"长链路+可验证+跨世界\"领域。AI首次实质进入数学知识生产过程，Astra参与将短素数间隙上界从240推进至186、并改进一项80余年未动的大素数间隙结果；生命科学侧可直接操作测序软件检查数据质量、在Jupyter构建细胞追踪工作流，但生命科学专项基准绝对水平仍低、湿实验级科研依旧建议观察Anthropic的进展； ❹ComputerUse是本次发布最深远的影响变量，而工业软件是本次最直接受到影响的领域。#Astra不会摧毁基础工业软件、但会影响“以界面操作熟练度为核心的技能溢价”，基础工业软件巨头们的接口壁垒被绕过，目前最硬核的演示为Astra在KiCad中从原理图出发完成元器件放置与铜线布线、输出可制造 PCB，且叠加BenchCAD的几何重建能力，打通“自然语言→工程图纸/三维模型”链路。#但距离替代专业工程师核心设计环节仍有明显距离： 芯片设计的核心环节（RTL 编写/功能验证/逻辑综合/仿真/Sign-off）均无公开验证；演示集中于概念建模与原型阶段，未验证参数化精确建模/仿真求解精度/工程责任归属；工业企业核心设计数据（图纸/版图/工艺库）涉及安全审计与数据主权问题。#未来工业软件的TAM也有可能随usage-base的新付费模式&AI带来的更多设计起点数等因素而变大，我们建议积极看待模型→应用→算力的需求拉动链条。 DJN/Colin#文字观点", "publish_time": "2026-09-06 20:03", "tags": ["文字观点"]}, "post:2026-09-06T18-01:6348a598299f": {"id": "post:2026-09-06T18-01:6348a598299f", "kind": "post", "title": "2026-09-06 18:01", "source_label": "帖子正文", "excerpt": "【国金计算机&科技】摩尔线程×趋境科技：GLM-5.3真实生产场景落地，国产GPU商业化加速 【GLM-5.3真实生产流量落地，国产GPU跨越规模商业化拐点】 摩尔线程与趋境科技基于MTT S5000及MUSA软件平台落地国产P/D异构推理方案，目前已投入生产并承接智谱GLM-5.3真实业务Toke", "content": "【国金计算机&科技】摩尔线程×趋境科技：GLM-5.3真实生产场景落地，国产GPU商业化加速 【GLM-5.3真实生产流量落地，国产GPU跨越规模商业化拐点】 摩尔线程与趋境科技基于MTT S5000及MUSA软件平台落地国产P/D异构推理方案，目前已投入生产并承接智谱GLM-5.3真实业务Token流量。生产运行中实现平均超过50 TPS生成速度、超90% KV Cache命中率及99.9%稳定性。区别于此前国产GPU更多停留在参数发布、模型适配及Benchmark测试，本次S5000已经进入真实采购、集群部署和持续Token生产，我们认为标志着国产GPU正从“模型适配”真正走向规模商业化。 【同成本用户承载量提升3倍，Token性价比优势得到真实业务验证】 联合方案采用P/D异构架构，由MTT S5000承担Prefill阶段输入计算及KV Cache生成，与Decode侧高带宽GPU协同，通过针对不同负载进行资源优化提升整体Token生产效率。实际生产环境中，方案实现同等成本下支持用户量扩大3倍、性价比提升1倍；4—5台S5000组成Prefill资源池后，输入Token处理性价比相比国际先进算力方案提升一倍，商业价值进一步得到验证。 【持续联合AI Infra厂商，率先跑通“国产模型×国产芯片”商业闭环】 此次与趋境科技合作并非摩尔线程首次联合AI Infra厂商推进国产GPU推理落地。8月摩尔线程已与硅基流动联合发布P/D分离异构算力混部白皮书，此次进一步在GLM-5.3真实生产流量中实现商业化落地，体现摩尔线程持续通过与头部AI Infra厂商协同，强化推理软件栈、资源调度及系统级优化能力。摩尔线程已率先跑通头部国产模型真实流量的商业闭环，而不仅停留于纸面参数和适配验证，有望率先受益于国产模型需求持续增长及国产算力渗透率提升的产业趋势。#文字观点", "publish_time": "2026-09-06 18:01", "tags": ["文字观点"]}, "attachment:files/MS-甲骨文公司（ORCL.US）——2027财年一季度前瞻.pdf": {"id": "attachment:files/MS-甲骨文公司（ORCL.US）——2027财年一季度前瞻.pdf", "kind": "attachment", "title": "MS-甲骨文公司（ORCL.US）——2027财年一季度前瞻", "source_label": "MS", "excerpt": "M Update Too Early To Dream The Dream, But Valuation Creates Attractive Tactical Set Up if Execution Can Be Proven Out. Oracle shares are down -25%+ relative to 4Q26 results, and n", "content": "M Update Too Early To Dream The Dream, But Valuation Creates Attractive Tactical Set Up if Execution Can Be Proven Out. Oracle shares are down -25%+ relative to 4Q26 results, and now trading at ~14x consensus FY28E NGAAP EPS (~17x GAAP P/E), as investors look to build more conviction in ORCL's ability to execute on its pivot to GPUaaS, following 4Q26 results in which FY27 revenue and EPS guidance underwhelmed relative to expectations, with capex guidance (on a gross / reported basis) surprising slightly to the upside. These concerns have been compounded, albeit to a lesser degree, by the underwhelming growth trajectory in the core Cloud Applications business seen in the 2H of FY26 (namely in Fusion and Netsuite). While proving out execution will likely take several quarters of strong results, we see a tactically positive set up into 1Q27 results given intra-quarter share performance and current valuation. Specifically, (1) we see potential for GPUaaS to drive Cloud Revenue towards the high end of the guide at ~63% YoY (vs. 58%-64% guide, (Exhibit 1) as capacity added in FY26 scales to run rate monetization, complemented by incremental monetization from the 'nearly' 1GW of capacity expected to be brought on-line in Q1. (2) Bullish reads from recent neocloud What’s Changed Oracle Corporation (ORCL.N) From To Price Target $207.00 $210.00Oracle Corporation | North America F1Q27 Preview – A Good Set- Up into Results, But Still A Long Road Ahead We see an attractive tactical set-up into F1Q27: our assessment of the GPUaaS ramp supports cloud growth near the high end of guide, checks point to stabilizing Cloud Apps and improving multicloud DB momentum, while valuation leaves room for upside if OCI execution is proven.Morgan Stanley & Co. LLC Sanjit K Singh Equity Analyst Sanjit.Singh@morganstanley.com +1 415 576-2060 Adam Wood Equity Analyst Adam.Wood@morganstanley.com +1 212 761-3656 Jamie Reynolds Research Associate Jamie.Reynolds@morganstanley.com +1 212 761-2087 Oracle Corporation (ORCL.N, ORCL UN) Software | United States of America Stock Rating Equal-weight Industry View Attractive Price target $210.00 Shr price, close (Sep 3, 2026) $154.04 Mkt cap, curr (mm) $452,084 52-Week Range $345.69-114.51 Fiscal Year Ending 05/26 05/27e 05/28e 05/29e EPS ($)** 7.63 8.03 9.94 12.87 Prior EPS ($)** 7.28 7.80 8.28 - P/E 34.9 23.1 18.6 14.2 EPS ($)§ 7.47 8.07 11.05 15.68 Div yld (%) 0.9 1.3 1.3 1.3 Unless otherwise noted, all metrics are based on Morgan Stanley ModelWare framework ** = Based on consensus methodology § = Consensus data is provided by Refinitiv Estimates e = Morgan Stanley Research estimates Quarterl y EPS ($) 2027e 2027e 2028e 2028e Quarter 2026 Prior Current Prior Current Q1 1.47 1.54 1.68 1.83 2.18 Q2 2.26 1.70 1.82 1.93 2.30 Q3 1.79 2.13 2.16 2.20 2.64 Q4 2.11 2.42 2.36 2.32 2.81 e = Morgan Stanley Research estimates Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report.Key Takeaways Tactical set-up: shares -25%+ since 4Q26, ~14x FY28E Cons NGAAP EPS; modest FY27 raise could drive upside if OCI delivers. Back-of-envelope GPUaaS ramp supports ~63% cloud growth, near high end of 58-64% guide, as FY26 capacity monetizes and ~1GW is added in 1Q. Neocloud prints are directionally bullish for GPUaaS pricing & contract economics; more pre-pay/BYOC deals could also ease funding/credit concerns. Checks support Cloud Apps stability and stronger multicloud DB momentum, but OCI remains the key post-print stock driver. Remain EW as we look to build more conviction in long term execution; raise PT to $210 (from $207) on revised estimates. September 4, 2026 03:54 AM GMT ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 M Update 2prints, seeing potential for ORCL to benefit either directly from stronger pricing on new contracts, or alternatively, via incremental pre-pay/BYOC contracts (helping to ease concerns on the credit side). (3) Stability in Cloud Applications revenue growth, given two consecutive quarters of deferred revenue growth outpacing reported revenue growth, and constructive channel checks. Should this play out, we'd expect a modest upward revision to FY27 revenue and EPS, which given investor sentiment, should be enough to drive a positive reaction. What could go wrong? Beyond a weaker OCI print, we think the two risk factors on the quarter are (a) weaker than expected gross margins on account of OCI capacity ramp and (b) an upward revision to capex . See Scope for Stronger Performance in Total Cloud Revenue, Driven by GPUaaS. Oracle's F1Q27 guidance calls for 58%-64% YoY (57%-63% cc) growth in total cloud revenue in 1Q. Assuming stable / slightly improved growth in the Cloud business (ex GPUaaS), this implies ~$1.5bn of sequential dollars added to OCI to hit the midpoint, and ~$7.3bn of total OCI revenue. While this screens aggressive from a headline perspective, rough math implies that performance towards the high end of the guided range is not out of the question. On GPUaaS, we think this implies ~1.6GW of power being monetized at run rate, assuming $10bn of ARR/GW (consistent with illustrative contract economics at the October 2025 Analyst Day). Applying this math to our 4Q26 estimate implies ~1.1GW of power at run-rate monetization exiting FY26, slightly below the 1.2GW+ management indicated having delivered in FY26. The company also outlined expectations to deliver nearly 1GW of capacity in 1Q27 alone. If we assume that the residual difference between the estimated 4Q26 exit scales to run rate in 1Q27, and that half of the 1Q27 capacity is also monetized at run rate, we see scope for ORCL to post cloud revenue towards the high end of guidance, coming in closer to 63% YoY. Exhibit 1:See Scope for ORCL To Print Cloud Revenue Growth Towards High End of Guidance, Driven by GPUaaS 1Q26A 2Q26A 3Q26A 4Q26A FY26A 1Q27E MSe Database (OCI) 693 715 776 845 3,029 901 GPUaaS 896 1,353 1,998 2,645 6,892 3,845 Traditional OCI 1,758 2,011 2,113 2,297 8,180 2,436 Total OCI 3,347 4,079 4,888 5,787 18,101 7,182 Cloud Applications 3,839 3,898 4,026 4,126 15,889 4,270 Total Cloud Revenue 7,186 7,977 8,914 9,913 33,990 11,452 Total Cloud growth, YoY 59.4% GW unless noted Annualized revenue per GW monetized ($mm) $10,000 4Q26 exit — power monetized at run rate 1.06 FY26 capacity delivered (per mgmt commentary) 1.20 Residual FY26 capacity not yet monetized at run rate 0.14 1Q27 incremental capacity delivered 0.90 Assumed in-quarter monetization rate 50% 1Q27 incremental power monetized 0.45 Total 1Q27 power monetized at run rate 1.65 Implied 1Q27 GPUaaS revenue $4,125 Implied 1Q27 total cloud revenue (all else at MSe) $11,732 Implied total cloud growth, YoY 63.3% Low Mid High Total cloud growth guidance, YoY 58% 61% 64% Implied total cloud revenue 11,354 11,569 11,785 Less: Cloud Applications (held at MSe) (4,270) (4,270) (4,270) Implied Total OCI 7,084 7,300 7,516 Less: Database and Traditional OCI (held at MSe) (3,337) (3,337) (3,337) Implied 1Q27 GPUaaS revenue 3,747 3,963 4,178 Implied GPUaaS QoQ growth ($) 1,102 1,318 1,533 Implied Total OCI QoQ growth ($) 1,297 1,513 1,729 Implied power monetized at run rate (GW) 1.50 1.59 1.67 Bottom-up power monetized at run rate (GW) 1.65 1.65 1.65Cloud Revenue Trajectory Bottom-Up: GPU Power Monetization Bridge Top-Down: Power Monetization Implied by Guidance Source: Company Data, Morgan Stanley Research ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 aVuZgZwVsUrOrOsN6MaO9PoMmMsQoQkPnNwPeRoOnQ9PqRyQuOmMmQNZtPsM M Update Morgan Stanley Research 3Bullish Neocloud Prints Directionality Positive For ORCL GPUaaS into F1Q... CRWV and NBIS both gave bullish AI infrastructure pricing commentary on their latest prints. CRWV cited a 5-10ppt higher contribution margin on 2Q-signed contracts and a ~25% price increase across SKUs on strong demand, plus older- generation chip ASPs holding at levels seen ~1Y ago. NBIS echoed this: a) mid-term contracts (~1-3Y) yielding ~$20-$25M/MW vs the ~$10M/MW implied by ORCL's illustrative contract economics at the Oct '25 Analyst Day; b) \u003c6mo contracts trending to $40-$50M/MW and higher in some cases; and c) its first capacity auction in Q2 clearing at the highest Blackwell-generation prices to date, 15% above prior peak. NBIS added Q2 deals above $20m/MW with sub-two-year paybacks come online from late Q4 and \"can serve as the baseline for pricing early next year.\" ...However, ORCL indicated at 4Q26 earnings that 98% of its AI Datacenter capacity is contracted. We are unsure how much of the broader 10GW ambition that references, or over what duration, and as a result – lean conservative on whether the inflection in AI capacity pricing can emerge as a material near-term upside driver for ORCL. Still, we would expect longer-dated capacity and contracts signed intra-quarter to see similar dynamics, potentially showing up in mid-CY27 results. Separately, the bullish pricing data points also suggest that ORCL can continue to expand its RPO base of pre-pay/BYOC GPUaaS contracts (~$75bn as of 4Q26), which depending on scale, could incrementally ease credit/funding concerns ahead of greater FCF yield post FY28. In-Line SaaS Prints Drove Positive Reactions; Directionally Supportive For ORCL, But OCI Still The Driver. In Signs of Life: Making the Case That SaaS Is ALIVE (3 Sep 2026) , we showed that large-cap application SaaS names posting CY27 revenue revisions of +/-1% following CY2Q26 results outperformed the broader software group by an average 18% over the subsequent five days, against 4% underperformance on comparable revisions a year prior. WDAY illustrates the point: a largely in-line quarter (revenue +0.5% vs consensus) drove a +5.8% 1-day move, with CRM (+0.1% vs consensus) up +22.6%. We attribute this to depressed starting valuations, with group EV/FCF entering the season ~60% below the 3Y average, and to the AI bear case not yet showing up in results – despite little evidence of fundamental reacceleration. We do not see any reason that ORCL shouldn’t also benefit from a similar dynamic, but remain of view that the investor focus remains squarely on the trajectory of OCI. Put another way, in-line / slight upside to cloud results is not enough on its own to drive a positive post print reaction, but should be complementary if OCI delivers. What We Heard in Checks: Channel partners spoke to stability in Cloud Applications, complemented by broad based optimism with respect to ORCL's ramping multicloud database capability. Importantly, we did not pick up on any material disruption in channel engagement following the large scale RIF implemented earlier this year. Anecdotally, we also heard that ORCL is gaining traction for AI workloads in select enterprise verticals – an area we have leaned more cautious. While too early to give credit, this is something we will continue to monitor. •(+) Multicloud Database Commentary Positive. Across conversations with the channel, Database@Azure / AWS / GCP consistently came up as ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 M Update 4increasing activity, with two saying partners indicating broader availability is pulling some customers from evaluation into migration earlier than otherwise. One partner with visibility into live deployments called Exadata in the hyperscalers among the strongest parts of its Oracle business, putting activity past awareness and pilots. We would still distinguish this from broad OCI share gains; the opportunity is protecting and expanding Oracle's Database wallet. Still, multicloud was the most consistent positive signal in our work and the strongest support for improving Cloud Database growth in coming quarters. While we continue to embed more modest growth in Cloud Database relative to the multiyear targets, this is an area we lean constructive and look to give more credit as acceleration is proven out. •(+/=) Cloud Applications Commentary Largely Indicative of Stability . After 2FY26's Fusion and NetSuite modest deceleration, our checks provided some evidence conditions are becoming less negative. One partner cited improving qualified Fusion ERP and HCM discussions, including renewed evaluations from customers weighing SAP S/4HANA migration cost and complexity. A reseller-oriented check was more cautious, citing limited new-logo activity and a pipeline supported partly by multiyear renewals. SAP's ECC support extension also appears to have deferred part of the forced-decision catalyst that could have benefited Fusion, though selected customers still weigh Oracle against a costly S/4HANA migration. Commentary on embedded application AI also screen muted, with moderate adoption of native functionality and one check seeing customers favor custom agents on external foundation models. However, with checks indicative of stability, and ORCL having seen two consecutive quarters of deferred revenue growth ahead of reported Cloud Applications revenue, we lean constructive on the potential for improved growth to materialize in FY27. •(+/=) Core OCI Remains Anchored to Oracle Workloads, While Enterprise AI Adds Early Optionality. Conversations focused on continued lift-and-shift and modernization work, anecdotal evidence of greater mid-market focus and no material deterioration in Oracle's engagement with large partners. Partners also reported no meaningful difficulty provisioning conventional compute or database workloads – suggesting ORCL has not run into major capacity issues intra-quarter (excluding GPUaaS, where partner visibility is far more limited). Less established is whether OCI is becoming a broad strategic hyperscaler for workloads without an Oracle anchor: one check said generic storage, networking and compute for custom applications still typically land elsewhere, with another indicating that greenfield data and AI-platform projects often favor competitors such as Databricks (private), Snowflake, Postgres or MongoDB. On AI infrastructure, two checks pointed to improving enterprise interest from an early base. One large-deal partner called its visible AI-native pipeline inference-weighted, with recently signed capacity generally online during 2027; a large GSI sees more financial-services and pharmaceutical customers evaluating OCI as an enterprise \"AI factory,\" driven partly by proximity to existing Oracle data, though GPU work remains a small share of activity. Pricing, availability and database proximity appear the most tangible differentiators. ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 jHxk2FTFK10ma1ECtqP+Z8H7yJe7HTNC4anUpA/IwOPQEFAqajAECT8db8dmM4dp M Update Morgan Stanley Research 5Changes to Our Model: With this preview, we are updating our estimates for 4Q26 results, and extending the forecast horizon to include FY29 and FY30. On topline, our estimates remain largely unchanged through the forecast horizon (with FY29/ FY30 consistent with prior SOTP work). While FY27 EPS moves ~3% higher (primarily via below the line items), our FY28 NGAAP EPS estimates increase ~20% to $9.94 (vs. A-Day guide of ~$10.70 / consensus of $10.76), primarily on account of giving credit for ~200bps of YoY expansion in implied GPUaaS gross margins, reaching ~19% in FY28 (directionality consistent with management commentary for YoY improvement). This compares to our prior estimate of ~12%, which was based on the output of our prior GPUaaS model, and reflected was a primarily function of the mismatch implied by the timing disclosure associated with ORCL's un- commenced lease balance relative to our revenue implied capacity footprint forecast (see: Oracle Corporation: Computing the Upside – And the Cost (23 Apr 2026 ). While we remain of the view that there is meaningful execution risk embedded in ORCL's multi year outlook, we think it is more reasonable to be anchoring closer to our FY27 estimate given the implied improvement seen in GPUaaS margins through FY26. However, we plan to re-asses the trajectory in more detail post Q1 results. Opex estimates remain in the LSD% growth range post FY27. On capex, FY27 comes lower to reflect the high end of management's guidance on a gross/net basis, FY28 unchanged, and modest upward revision to FY29/FY30 (to ~ $62bn/$59bn, relative to our prior forecast of ~$56bn/$53bn, respectively). Exhibit 2:Latest Model Reflects Incremental GPUaaS Gross Margin in FY28 – but Remain Cautious on Scaling to Guided 30-40% Steady State Range for FY30 Source: Company Data, Morgan Stanley Research Remain EW, $210 PT (from $207). While our EPS estimates move higher on account of improved GPUaaS gross margin trajectory discussed above, we are slightly increasing our PT to $210 (from $207 previously) using ~19x CY28e NGAAP EPS of $10.98. This implies a ~0.9x PEG (CY26-CY28 CAGR), a discount to ORCL's historical average of ~1.6x given execution risk and lack of FCF support through forecast period given GPUaaS investment. Our revised PT compares to our prior base case of $207, which reflected 25x FY28e NGAAP EPS of $8.28. ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 M Update 6Exhibit 3:ORCL Shares Trade Below the 5-Year Average on a NTM PEG Basis 0.0x5.0x10.0x15.0x20.0x25.0x30.0x35.0x40.0x45.0x50.0x Aug-18 Nov-18 Feb-19 May-19 Aug-19 Nov-19 Feb-20 May-20 Aug-20 Nov-20 Feb-21 May-21 Aug-21 Nov-21 Feb-22 May-22 Aug-22 Nov-22 Feb-23 May-23 Aug-23 Nov-23 Feb-24 May-24 Aug-24 Nov-24 Feb-25 May-25 Aug-25 Nov-25 Feb-26 May-26 Aug-26Oracle Price to NTM EPS (P/E) ORCL 5-Year Average Source: Refinitiv, FactSet, Morgan Stanley Research Exhibit 4:Oracle Job Listings Have Trended Slowed Meaningfully Following RIF 0200040006000800010000120001400016000180002000022000240002", "status": "extracted"}, "attachment:files/Bernstein-全球半导体与硬件：中国智能手机追踪——“618”购物节后，季节性放缓幅度大于往常.pdf": {"id": "attachment:files/Bernstein-全球半导体与硬件：中国智能手机追踪——“618”购物节后，季节性放缓幅度大于往常.pdf", "kind": "attachment", "title": "Bernstein-全球半导体与硬件：中国智能手机追踪——“618”购物节后，季节性放缓幅度大于往常", "source_label": "Bernstein", "excerpt": "M Update Beijing Health Check 289 | Asia Pacific DRG/DIP 3.0 Read – Deepening Reform, With Resource Direction to True InnovationMorgan Stanley Asia Limited+ Alexis Yan, CFA Equity ", "content": "M Update Beijing Health Check 289 | Asia Pacific DRG/DIP 3.0 Read – Deepening Reform, With Resource Direction to True InnovationMorgan Stanley Asia Limited+ Alexis Yan, CFA Equity Analyst Alexis.Yan@morganstanley.com +852 2239-7953 China Healthcare Asia Pacific Industry View Attractive Related notes: Medical Devices: China MedTech Reimbursement Update call takeaways (4 Sep 2026) China Healthcare: Takeaways from Inaugural Morgan Stanley China Biopharma Symposium (23 Jun 2026) Beijing Health Check 284: More Liberal Pricing for Innovative Drugs in China (15 Apr 2026) Surgical robotic-assisted procedures classified separately, highlighting support for innovation: The DRG 3.0 framework introduced nine groups for robotic-assisted surgeries, reflecting their technical complexity and providing clearer reimbursement expectations. Other examples of the shift toward a more value-oriented reimbursement framework include the addition of 33 new groups for interventional procedures, new categories for complex combined surgeries, separate grouping of hematological malignancies and solid tumors, further differentiation between bilateral and unilateral procedures, and greater age stratification for patients aged \u003c6 and >70. We view these changes as broadly positive for innovative medtech companies, including Edge Medical, APT Medical, Zylox-Tonbridge, and Peijia . Clearer special-case negotiation mechanisms may also support broader innovation: The NHSA explicitly states that the special-case negotiation mechanism is intended to support hospitals adopting new drugs, new consumables, and new technologies, as well as treating complex and critically ill patients. Under DRG 3.0, special-case cases may account for up to 5% of total DRG discharges at the regional pooling level, while tertiary hospitals retain flexibility to exceed this threshold.Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. Key Takeaways Two years into DRG/DIP 2.0 and leveraging a more powerful database, the NHSA released the DRG/DIP 3.0 guidelines on Sep 2 to further guide clinical practice. It provides more explicit support for innovative technologies, such as robot- assisted surgeries, by classifying them separately and establishing a clearer reimbursement pathway. Granularity also improved across intervention procedures, complex combined- surgery groups, the separation of hematology from solid tumors, and more age stratification. By contrast, the framework remove ~3,000 severe complications/co-morbidities (MCC) and 1,500+ CC, suggesting tighter oversight of upcoding, overdiagnosis, and treatment. Innovative drugs could also benefit indirectly from more detailed patient stratification, special-case negotiation mechanisms, and budget savings. September 4, 2026 04:03 AM GMT ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 M Update 2Valuation Methodology and Risks Zylox-Tonbridge Medical Technology Co. (2190.HK) Base case, discounted cash flow methodology. Key assumptions include a WACC of 11%, per- petual growth of 3%, and a long-term corporate tax rate of 15%. Our DCF model starts from 2026. Risks to Upside nFaster-than-expected sales ramp-up of key products nFaster pipeline rollouts nAccretive M&A or investment Risks to Downside nRising competition for key product categories nEarlier-than-expected volume-based procurement with negative sales/margin impact nPipeline setbacks Shenzhen Edge Medical (2675.HK) DCF. Key assumptions include: (1) a 9.0% WACC, in line with other established domestic med- tech peers; (2) a 4.0% terminal growth rate (vs. the typical 3%), reflecting the robust growth outlook; and (3) a 15% steady corporate tax rate. Our DCF model begins in 2026. Risks to Upside nExpansion of endoscopic robot quota in China nBroader medical insurance reimbursement, and other supportive policy nFaster pipeline development nFaster penetration in overseas markets Risks to Downside nEarly-stage commercialization nExecution on international growth nIntensifying competition in China and overseas nRegulatory changes nPotential clinical or pipeline setbacks APT Medical Inc (688617.SS) Base case. We use DCF methodology, as we think it appropriately captures APT Medical's healthy operating cash flow in the outer years. Key DCF assumptions: 1) 8.8% WACC, in line with our assumed WACC for other A-share-listed Medtech names; 2) 3.5% terminal growth rate, above the typical 3.0% for our coverage to factor in the sustainable growth in the outer years; and 3) 13.5% steady corporate tax rate. Our DCF model starts from 2026e. Risks to Upside ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 9WrUhYMBuWqPoRsN7NcM8OtRrRmOrPiNqQxOjMrRsP8OqRyRwMoMnMwMmOtR M  should carefully read Morgan Stanley Research, in its entirety, and not infer the contents from the rating alone. In any case, ratings (or research) should not be used or relied upon as investment advice. An investor's decision to buy or sell a stock should depend on individual circumstances (such as the investor's existing holdings) and other considerations. Global Stock Ratings Distribution (as of August 31, 2026) The Stock Ratings described below apply to Morgan Stanley's Fundamental Equity Research and do not apply to Debt Research produced by the Firm. For disclosure purposes only (in accordance with FINRA requirements), ", "status": "extracted"}, "post:2026-09-06T17-57:69c9130e54f5": {"id": "post:2026-09-06T17-57:69c9130e54f5", "kind": "post", "title": "2026-09-06 17:57", "source_label": "帖子正文", "excerpt": "高盛——日本科技：半导体资本设备——2026年中国台湾半导体展（Semicon Taiwan）：设备需求强劲得到再度确认 一、核心结论 高盛于中国台湾半导体展期间，为投资者安排了展位参观。本次巡展整体确认了设备市场持续景气的判断——中国台湾供应链强劲的资本开支意愿是核心驱动力。", "content": "高盛——日本科技：半导体资本设备——2026年中国台湾半导体展（Semicon Taiwan）：设备需求强劲得到再度确认 一、核心结论 高盛于中国台湾半导体展期间，为投资者安排了展位参观。本次巡展整体确认了设备市场持续景气的判断——中国台湾供应链强劲的资本开支意愿是核心驱动力。台积电（TSMC）截至7月的2026年设备采购量预测，较其2025年末展望已扩大1.9倍。在高盛覆盖的半导体资本设备（SPE）标的中，维持对Lasertec（亚太地区确信买入名单）、Disco、东京电子（Tokyo Electron）及荏原制作所（Ebara）的买入评级。 二、重点公司巡展要点 东京电子（Tokyo Electron，买入） 9月2日上午的公司IR Tech Talk由代表董事、高级执行副总裁兼COO石田浩（Hiroshi Ishida）等多位高管出席。核心要点：（1）在满足旺盛资本开支需求、提供广泛设备供应的同时，公司正致力于强化支持体系，以缩短设备产能爬坡周期；（2）新技术将逐步引入涂胶显影机、刻蚀机、沉积设备、清洗设备及先进封装（探针台、键合机等）领域；（3）同时，公司强调需在研发领域设定优先级，以争取市场份额提升。 据为东京电子探针台提供台湾现场工程支持的HTSI（Hermes Testing）透露，东京电子探针台需求预计从2025年到2026年翻倍，到2027年再翻倍，表明晶圆测试需求持续强劲。 荏原制作所（Ebara，买入） 近期CMP（化学机械平坦化）设备市场份额增长的核心背景在于：需要金属膜CMP的工艺步骤范围不断扩大（这是荏原的强项领域），叠加其用于测量膜厚以确定精确抛光终点的卓越测量技术（终点检测，EPD）。公司将后段制程视为未来整体CMP市场的增长驱动力，原因是CMP抛光时间往往长于前段制程（尤其是先进封装中的再布线层）。 东京精密（Tokyo Seimitsu，卖出） 最新探针台型号AP3000W的占地面积设计可容纳日益增大的测试机，凭借高温控制等关键特性，需求主要来自OSAT（外包半导体封装测试）客户，需求保持强劲。公司管理层在二季度业绩发布会上表示，二季度半导体订单量有望达到与一季度高位相当的水平。 Lasertec（买入，亚太确信买入名单） 关于2025年10月发布的新款A200HiT ACTIS型号，公司表示已获得来自多家客户针对3nm/2nm节点的量产订单，并预计在2027年上半年获得1.4nm应用的订单（与客户评估完成时间吻合）。Lasertec补充称，ACTIS的竞争版图基本未变，公司继续保持100%的市场份额。 芝浦机械（Shibaura Mechatronics，未覆盖） 公司一季度从两家OSAT获得大量倒装芯片键合机订单，预计将于2027年上半年出货，后续视客户投资计划存在追加订单的可能。同时，面向310mm方形面板级封装（PLP）的设备及混合键合机仍在客户评估中，公司预计客户量产时间线约在2028年。 日本迈可罗尼克斯（Japan Micronics，未覆盖） 高盛再度确认DRAM及HBM（高带宽内存）探针卡需求保持强劲，确保产能是公司及同业面临的紧迫课题。公司同时指出，HBM探针卡的单价随每一代迭代呈上升趋势。关于近期部分客户探索降低HBM堆叠层数的动向，公司表示迄今未产生实质性影响，客户问询依然活跃。 三、评级与目标价概览（非表格呈现） • 荏原制作所（Ebara，买入）：12个月目标价7,900日元。估值方法基于市净率（P/B）与高盛对2027财年ROE预测的关联性。主要下行风险包括半导体资本开支进入下行周期、中国CMP设备制造商竞争力增强、半导体器件新技术采用缓慢，以及原油/液化天然气价格及炼化毛利下滑。 • Lasertec（买入）：12个月目标价70,000日元。估值方法基于全球SPE板块平均EV/EBITDA倍数18倍及高盛对2028财年预测，并附加50%的板块相对溢价。主要下行风险包括新进入者导致市场份额下降、晶圆厂ACTIS采用进展不力、客户对先进制程节点的投资意愿减弱，以及日元兑美元快速升值。 • 东京精密（Tokyo Seimitsu，卖出）：12个月目标价16,500日元。估值方法基于全球SPE板块平均EV/EBITDA倍数18倍及高盛对2028财年预测，并附加40%的板块相对折价。主要上行风险包括半导体订单超预期（尤其是与生成式AI相关）、量测仪器板块大幅超预期，以及股东回报优于预期。 • 东京电子（Tokyo Electron，买入）：12个月目标价90,000日元。估值方法基于全球SPE板块平均EV/EBITDA倍数18倍及高盛对2028财年预测，并附加30%的板块相对溢价。主要下行风险包括半导体行业库存调整阶段延长、出口限制进一步收紧，以及利率上行压力下估值倍数承压。 四、主要风险提示 1. 半导体行业资本开支若进入下行周期，将对设备需求构成系统性压制； 2. 中国本土设备制造商竞争力快速提升，可能侵蚀日本厂商市场份额； 3. 先进制程节点（如1.4nm及以下）的客户投资意愿若减弱，将影响Lasertec等公司的订单能见度； 4. 地缘政治因素及出口管制收紧可能扰动全球半导体供应链； 5. 汇率波动（尤其是日元升值）对出口导向型设备商的盈利构成下行风险。#文字观点", "publish_time": "2026-09-06 17:57", "tags": ["文字观点"]}, "post:2026-09-06T21-01:1695303f0086": {"id": "post:2026-09-06T21-01:1695303f0086", "kind": "post", "title": "2026-09-06 21:01", "source_label": "帖子正文", "excerpt": "【东北计算机】20260906行业周报：再次，持续关注技术升级线 —————————————— 行情复盘：本周交易日为8月31日–9月4日。上证指数本周下跌0.56%，创业板指数本周下跌4.03%，深证成指本周下跌3.13%。", "content": "【东北计算机】20260906行业周报：再次，持续关注技术升级线 —————————————— 行情复盘：本周交易日为8月31日–9月4日。上证指数本周下跌0.56%，创业板指数本周下跌4.03%，深证成指本周下跌3.13%。计算机板块内部分化：AI应用、数字货币偏强，算力硬件、半导体走弱；申万计算机周内主力资金净流入约169亿元，电子板块净流出居前。板块内活跃股以楚天龙（数字货币，11天7板、周五再封板）、竞业达、新炬网络等应用端为主；浪潮信息、国科微等硬件标的调整幅度较大。 行业观点： 1.导热材料升级，液冷方案升级是散热确定性方向，且商业化推进比想象中要快，石墨烯、液态金属、金刚石。2.PCB：继续关注mSAP&M8→9升级线，PTFE&LPU技术方案的演进带来的产业链上下游联动，筹码短期影响较大。中小盘关注：3.GPT-6大模型更新，AGI世界更进一步，关注AI应用相关进展和多模态AI相关落地情况。4.技术升级外溢带来的其他的分支&小光新面孔。5.电源分支继续关注sst、VPD等新方向。 行业重要新闻： 国内 1、燧原科技9月2日科创板申购，发行价142.18元/股；长存控股IPO审核状态变更为“已问询”（来源：科创板日报） 2、字节新一代豆包手机将搭载长鑫10667Mbps LPDDR5X；澜起科技CXL 3.2芯片已导入三星、SK海力士（来源：财联社） 3、长电科技拟定增不超65亿元扩产高端先进封装；精智达签订15.76亿元半导体测试设备订单（来源：财联社） 4、华为更新韬定律论文：麒麟2026晶体管密度提升55%，同性能下NPU/GPU/CPU功耗分别降66%/58%/41%（来源：科创板日报） 5、七部门提出探索算力设施800V高压直流供电，推动超百千瓦单机柜部署（来源：财联社） 国际 1、博通上调AI半导体指引：2026财年580亿美元，2027/2028财年目标1150/2300亿美元，并开始向谷歌量产交付TPU 8I（来源：财联社） 2、台积电称设备需求自去年底几乎翻倍，全球在建晶圆厂接近20座（来源：财联社） 3、美光计划年底前扩产HBM4，新增最多6万片/月，产能有望较去年翻倍（来源：科创板日报） 4、郭明錤称英伟达重启Rubin CPX，预计2027年一季度投产并配备168GB HBM4（来源：科创板日报） ☎️欢迎联系东北计算机团队#文字观点", "publish_time": "2026-09-06 21:01", "tags": ["文字观点"]}, "post:2026-09-06T22-01:96e6565d5ffb": {"id": "post:2026-09-06T22-01:96e6565d5ffb", "kind": "post", "title": "2026-09-06 22:01", "source_label": "帖子正文", "excerpt": "华为再论韬定律，半导体设备迎来布局良机 📌 华为何庭波发布韬定律第二篇论文，核心是通过逻辑折叠和三维混合键合缩短芯片内部互连，在提高晶体管密度的同时降低功耗。麒麟2026的芯片晶体管密度从约每平方毫米1.55亿提升到2.38亿个，跃升55%。", "content": "华为再论韬定律，半导体设备迎来布局良机 📌 华为何庭波发布韬定律第二篇论文，核心是通过逻辑折叠和三维混合键合缩短芯片内部互连，在提高晶体管密度的同时降低功耗。麒麟2026的芯片晶体管密度从约每平方毫米1.55亿提升到2.38亿个，跃升55%。在同等性能的测试条件下，对比前代平面架构麒麟9030 Pro，麒麟2026的NPU功耗下降66%，GPU功耗下降58%，CPU性能大核功耗下降41%，在晶体管数量暴涨的同时，完成同等工作的芯片工作温度更低。芯片从平面集成走向立体集成，工艺步骤、互连数量和制造复杂度同步提升。 📉 半导体设备板块近期连续回撤，产业逻辑没有发生变化。国内晶圆厂扩产加速、先进芯片工艺升级、国产设备份额提升三条主线继续兑现，当前位置建议积极抄底半导体设备。 🏭 前道设备受益于国内存储、先进逻辑扩产，韬定律有望加速下游扩产节奏，刻蚀、薄膜沉积、涂胶显影及键合设备等需求全面增加。建议关注北方华创、中微公司、拓荆科技。此外，芯源微有较大基本面突破，产业进展顺利，建议重点关注。 🚀 后道测试是韬定律更直接的增量方向。芯片堆叠层数和互连数量增加，测试复杂度、测试时长及良率管理要求同步提升，芯片CoT倍数级提升，带动ATE、分选机、探针台、SLT和老化设备需求量增长。封测厂capex有望进一步上修，建议重点关注金海通、长川科技、华峰测控。#文字观点", "publish_time": "2026-09-06 22:01", "tags": ["文字观点"]}, "post:2026-09-06T16-05:c85857f04774": {"id": "post:2026-09-06T16-05:c85857f04774", "kind": "post", "title": "2026-09-06 16:05", "source_label": "帖子正文", "excerpt": "今天的大事： 1、特朗普又发飙了。昨晚非农数据大超预期，但特朗普又在喊降息，而且言论越来越激进！", "content": "今天的大事： 1、特朗普又发飙了。昨晚非农数据大超预期，但特朗普又在喊降息，而且言论越来越激进！ 他喊话美联储：如果不降息，就切断与部分国家的贸易往来。这个施压有点离谱了。另外，贝森特也在喊话：伊朗战事结束油价或跌至40美元，万斯也表态希望降息。 沃什是川普提名上来的，他讲话再鹰派。但特朗普、万斯、贝森特都不希望加息，美联储胳膊很难拧不过大腿的。下周五晚老美披露8月CPI数据，这才是决定9月美联储是否加息的关键，那就拭目以待吧。 目前看，分析师给出9月加息概率50%，10月概率62%。估计接下来还有反复拉扯，但刀锋还是那个观点，11月份中期选举前加息概率很小。 2、马斯克预警AI电力缺口。马斯克在G20峰会上警告，AI芯片产量激增正引发严重的全球电力危机，2027年预计将出现至少15吉瓦的电力缺口，电力已取代芯片成为AI扩张的最大瓶颈。 总之，“AI的尽头是算力，算力的尽头是电力”。马斯克喊话电力了 ，下周A股智能电网、变压器、储能、绿电这些方向，看资金跟不跟了！ 3、“史上最大IPO”进程推迟了。今天的最新消息是：Anthropic的IPO进程推迟了！最早10月中旬启动路演，比预期要晚一些。 原因还是估值压力太大，2万亿美元的估值，1000亿美元的募资额。哪怕美股流动性很强大，但也可能要喝一壶的！ 还有一个原因，由于中国AI大模型企业的巨大竞争压力，导致OpenAI和Anthropic被迫大幅降价，导致两家公司最新披露的ARR明显不及预期。这对估值也会带来影响的。投资者会有疑问，OpenAI和Anthropic性能上并没有甩开中国大模型，凭什么这么贵。 4、美股硬科技大涨。昨晚老美8月非农爆冷，但美股走的很有韧性，道指-0.51%，纳斯达克-0.29%，标普-0.38%！ 费城半导体指数大涨3.37%，存储、光通信板块大涨，闪迪涨超11%，SK海力士涨超8%，美光科技涨超6%！英伟达和纳斯达克再次逼近历史新高了。 A股硬科技一直都喜欢炒“美股映射”，下周一怎么也要跟着反弹一下，不能再这么摆烂了。硬科技如果起来的话，双创板块就可以喘一口气了！给市场带来一些信心。#文字观点", "publish_time": "2026-09-06 16:05", "tags": ["文字观点"]}, "post:2026-09-06T17-51:64a8de1e39fb": {"id": "post:2026-09-06T17-51:64a8de1e39fb", "kind": "post", "title": "2026-09-06 17:51", "source_label": "帖子正文", "excerpt": "领导好，继续躺平均衡配置等待科技右侧信号，本周更新如下： 1） 本周的非农就业数据在季节因素的影响下headline大超预期到165k（一致预期/部分买方/我的预期在50-65k不等），剔除掉酒店服务业和政府就业这些7-8月一加一减的项目，其他增长主要是建筑等周期行业。这几个月的非农数据质量比较低", "content": "领导好，继续躺平均衡配置等待科技右侧信号，本周更新如下： 1） 本周的非农就业数据在季节因素的影响下headline大超预期到165k（一致预期/部分买方/我的预期在50-65k不等），剔除掉酒店服务业和政府就业这些7-8月一加一减的项目，其他增长主要是建筑等周期行业。这几个月的非农数据质量比较低，我会更看重维持在4.1%的失业率和月环比0.27%的薪资增速，这说明就业市场依然强劲。北美三大上仙（懂王+贝森特+沃什）虽然基于KPI经常互搏，但在经济增长方面的表态是一致的，经济增长强韧，这和非农的数据吻合，我认为也是为何非农数据实际上对市场的影响小的原因。周五数据出炉后美股、美元、美债和黄金并没有清晰的趋势性变化，只有之前拉胯的硬件股获得了回流。 2） 海外宏观下周将迎来重要的美国通胀信号（CPI；周五），这将是下下周FOMC会议前决定性的关键数据，尤其在市场定价9月美联储加息概率50%的当下。我预计核心CPI的月环比0.22%左右，跟市场一致预期相同。我觉得其实0.22%的月环比（考虑到6-7月的三月平均综合）是有理由论证未来6个月的CPI会愈加靠近2%的最终目标，就足以说服美联储的多数票委维持利率不变的决议了。假如宏观是制约成长股的核心问题，那么这个问题预计在下周五就能敲定。通胀若低于预期，除了懂王发力外，更有可能是服务业和租金指标的大幅下行；通胀若高于预期，边际变化很可能发生在电子产品价格上涨、物流运输成本推升和油价预期上。 3） 对于A股，牢骚太盛防肠断。市场都回归微盘+红利的熊市策略了，那么基本面即使有新的催化（比如GPT6）与，外盘硬件即使已经开始走出右侧了，A股也很难反应。领导您比我的感受一定更深，在一高开就想着怎么低走，一拉升就想着怎么抢跑的时候，基本面和海外映射都很难有定价权。在资金面出清前很难看到基本面变化形成的合力，那么既然博弈的手速拼不过量化，躺平等待右侧信号似乎是最优解了。从基本面角度来看，最有可能出现右侧信号的还是科技。有关GPT6等新的变化，我等体验和学习之后再向领导汇报。 以上。省流：均衡配置等待科技股右侧信号。#文字观点", "publish_time": "2026-09-06 17:51", "tags": ["文字观点"]}, "post:2026-09-06T20-02:447e733ec6da": {"id": "post:2026-09-06T20-02:447e733ec6da", "kind": "post", "title": "2026-09-06 20:02", "source_label": "帖子正文", "excerpt": "【中国人保沟通核心内容概览】 1. 资本补充必要性：1）大型国有保险集团可以进一步发挥好经济减震器、社会稳定器，彰显头雁作用，加大对于五篇大文章的资本供给，在服务经济社会高质量发展的过程中实现经济价值与股东回报的提升。2）前瞻性做好资本储备，测算提升综合/核心偿付能力充足率6.1pct，完成后对应值", "content": "【中国人保沟通核心内容概览】 1. 资本补充必要性：1）大型国有保险集团可以进一步发挥好经济减震器、社会稳定器，彰显头雁作用，加大对于五篇大文章的资本供给，在服务经济社会高质量发展的过程中实现经济价值与股东回报的提升。2）前瞻性做好资本储备，测算提升综合/核心偿付能力充足率6.1pct，完成后对应值为252.8%/203.8%。 2. 为什么选择定增：公司与专业中介机构研究确认，1）定增可以夯实核心一级资本，债务工具只能补充核心二级资本和附属资本；2）定增效率更高，对市场影响更小，配股需要全体股东参与认购，可转债转股过程中时滞性难以把控；3）向czb定向发行，不会抽取资金。 3. 只在A股做的原因：兼顾新老股东权益保护，落实国家前瞻性部署，严格遵守内地、相关市场信息披露及审议程序，选择A股单边：1）降低股东利益摊薄，A股股价高于H；2）坚定看好长期发展的积极信号。 4. 募资规模如何确定：1）政策环境；2）资本需求（偿二代二期）；3）统筹兼顾资本补充及股东权益保护。 5. 为什么选择目前时点：综合宏观政策导向、监管要求、估值水平统筹研判，1）服务国家战略，推动经营业绩稳步增长；2）前瞻性夯实稳健经营资本底座；3）保障老股东利益及中小股东权益。 6. 发行对象为czb的原因：对公司基本面及发展前景的深度认可，传递积极信号，仍将坚持dps稳定增长的分红策略。 7. 时间表预期：9/6完成董事会审议，计划9月底提交股东会审议，取得监管注册批复后择机落地。 8. 资金用途规划：扣除发行费用后全部用于充实资本金：1）深耕保险主业，支持实体经济；2）夯实资本基础，为优化业务结构提供支撑；3）强化风险管控的主动性。 9. 发行定价：市场化定价原则，不低于定价基准日（即发行期首日）前20个交易日交易均价，通过合理定价保护股东权益。 10. 定增的影响及摊薄影响：总股本、净资产增加，EPS、DPS将出现一定程度摊薄，本次发行规模占净资产比重较低，摊薄水平有限，预计影响可以较快形成填补。假设9/4前20个交易日交易均价对应增发股份数目测算为20.26亿股，占总股本比重为4.6%。#文字观点", "publish_time": "2026-09-06 20:02", "tags": ["文字观点"]}, "post:2026-09-06T13-47:c3991c2631c9": {"id": "post:2026-09-06T13-47:c3991c2631c9", "kind": "post", "title": "2026-09-06 13:47", "source_label": "帖子正文", "excerpt": "❗汇报2【天风电新】科泰电源更新推荐：订单/收入先行爆发实现翻倍，北美停机事件强化备电刚需‑260905 —————————— #核心观点：科泰电源订单/合同负债前瞻指标翻倍验证高景气、收入先行爆发实现同比翻番；随着海外高毛利业务占比抬升+规模效应释放，毛利率、净利率具备向上弹性。", "content": "❗汇报2【天风电新】科泰电源更新推荐：订单/收入先行爆发实现翻倍，北美停机事件强化备电刚需‑260905 —————————— #核心观点：科泰电源订单/合同负债前瞻指标翻倍验证高景气、收入先行爆发实现同比翻番；随着海外高毛利业务占比抬升+规模效应释放，毛利率、净利率具备向上弹性。 叠加9月3日OpenAl、Claude（Anthropic）与Grok（xAI）三家主要AI服务商的北美服务器集群发生大面积中断，进一步强化柴发备用电源的刚性需求。公司2026‑2028年收入可见度高，当前市场关注度偏低，报表端改善显现、股价显著低估。 🌼外部催化：9月3日北美数据中心停机事件凸显长时间备用供电刚需。储能仅可覆盖短时缺口，无法替代柴发；北美数据中心柴发配置倍率本就偏高，事故后备电必要性进一步强化，利好北美业务拓展。 🌼订单/合同负债先行爆发，收入高增可见度高。 截至26H1，公司在手订单约40亿元，相较25年末20亿元实现翻倍；基于订单确收周期3~6个月左右推算，26上半年新签订单约35亿元，且当前新签节奏仍在加速，#预计26全年新签订单保守70‑80亿元（25全年收入不足18亿元）。 截至26年中，公司合同负债6亿元，较25年末2.8亿元翻倍以上增幅，交叉验证订单高增。26H1营收15亿元对应出货约600台对应，基于在手订单测算Q3/Q4收入有望维持同比翻倍水平。产能采用租赁厂房快速扩产模式，可匹配订单增长。 🌼海外占比持续抬升，盈利弹性逐步兑现。 2025年海外收入占比30‑40%，2026年预计突破50%，2027年有望抬至60‑70%，绝大部分增量来自海外；其中国内毛利率约10%‑12%、东南亚毛利率约15%‑18%，预计欧美毛利率高于东南亚。 26Q2研发费用4800万为阶段性高点（海外认证等费用），预计后续费用回落至正常水平；叠加规模效应（以租赁厂房为主，增量成本可控），#净利率进入上行通道（若Q2研发费用维持此前平均1350万水平、则净利率约较当前表观翻番至8%）。 北美26年已有3‑4个待落地项目，此外还有较多北美项目对接中；3MW机型单台500‑600万元，单项目意向订单几十至上百台不等，预计2027年迎来大规模放量，带动毛利率结构性抬升。 🌼总结：订单高景气+海外盈利结构优化+外部事件催化三重逻辑共振。当前市场预期足够低，报表质量改善显著，后续有望业绩估值双击。 保守测算：预计27年收入80亿、净利率6%对应近5亿元净利润。按当前趋势28年收入有望120亿、净利率7‑8%对应8‑10亿利润。 给予27年25X PE，目标市值125亿，70%+空间，重点推荐。 —————————— 欢迎交流：孙潇雅/高鑫#文字观点", "publish_time": "2026-09-06 13:47", "tags": ["文字观点"]}, "post:2026-09-06T22-06:93eb86ec56fa": {"id": "post:2026-09-06T22-06:93eb86ec56fa", "kind": "post", "title": "2026-09-06 22:06", "source_label": "帖子正文", "excerpt": "❗【天风汽车】AIDC电源威迈斯、锐明技术更新：主业有底+AI实质性突破- 0906 ——————————— 总结：继续重点推荐主业有底、绑定TI切入NV的威迈斯，同时建议关注主业有底、HVDC已开启小批量发货的锐明技术。⭐威迈斯：绑定TI 1、主业：今年6-7亿利润，预计明年9亿利润，其中1-2亿", "content": "❗【天风汽车】AIDC电源威迈斯、锐明技术更新：主业有底+AI实质性突破- 0906 ——————————— 总结：继续重点推荐主业有底、绑定TI切入NV的威迈斯，同时建议关注主业有底、HVDC已开启小批量发货的锐明技术。 ⭐威迈斯：绑定TI 1、主业：今年6-7亿利润，预计明年9亿利润，其中1-2亿增量来自电动重卡，1-2亿增量来自直接间接出海及国内市占率提升。 2、AIDC进展：预计9月和TI签约有进展，TI三次电源芯片处于NV验证冲刺阶段，看好公司借TI独家ODM代工顺利进入NV二次、三次电源。26年8月已在美国注册公司，考虑海外建厂。 3、AI利润测算：按28年费曼芯片500万张卡，芯片功耗4500瓦，二次电源单瓦价值量0.7元，三次电源单瓦价值量1.5元，28年二/三次电源市场158/338亿元。假设TI&威迈斯在NV8%份额，对应28年40亿收入，假设20%净利率，28年8亿净利润增量。 4、盈利预测：预计公司27/28年总利润9/18亿元，PE分别18/9x。 ⭐锐明技术：绑定维谛 1、主业：26年受存储涨价影响，预计今年3亿利润。若明年原材料涨价顺价，则利润有望修复，保守预计27/28年利润分别4/5亿元。 2、AI 电源进展 UPS：为维谛代工，8月出货较3月单月翻倍，27年预计1亿美金+。 #HVDC小批量出货：原±400VMeta方案改为800V方案，8月已出货其中4个模组，剩下8个模组Q3发完，今年完成验证，27年量产。维谛是HVDC核心参与方之一，改方案后切入Google等客户更顺。 3、AI利润测算：27年UPS1亿美金收入、按10%净利率对应0.7亿利润，HVDC假设明年5亿人民币收入，按15%净利率对应0.75亿利润，AI电源明年1.5亿利润。 28年，假设28年考虑冗余后的总装机30GW，ASP 2元/W，对应28年600亿市场，按维谛15%份额对应90亿收入。按锐明30%代工份额对应27亿收入，15%净利率，4亿利润，叠加UPS1亿利润，AI电源28年5亿利润。 4、盈利预测：预计公司27/28年总利润5.5/10亿元，PE分别16/9x。 ——————————— 欢迎交流：孙潇雅/庄恬心#文字观点", "publish_time": "2026-09-06 22:06", "tags": ["文字观点"]}, "post:2026-09-06T17-57:b3e9cbdb9d0a": {"id": "post:2026-09-06T17-57:b3e9cbdb9d0a", "kind": "post", "title": "2026-09-06 17:57", "source_label": "帖子正文", "excerpt": "高盛——中国工业科技——机器人及自动化：亚洲领袖峰会2026纪要：需求轮动、全球扩张与人形机器人动能 高盛在香港举办亚洲领袖峰会，期间与约40家工业科技及机器人自动化领域公司进行了投资者会议。本纪要提炼关键赛道与公司的管理层反馈，核心结论如下： 1. 锂电池设备需求预期修正，订单向头部集中：尽管市场", "content": "高盛——中国工业科技——机器人及自动化：亚洲领袖峰会2026纪要：需求轮动、全球扩张与人形机器人动能 高盛在香港举办亚洲领袖峰会，期间与约40家工业科技及机器人自动化领域公司进行了投资者会议。本纪要提炼关键赛道与公司的管理层反馈，核心结论如下： 1. 锂电池设备需求预期修正，订单向头部集中：尽管市场担忧国内锂电池产能扩张审批收紧及新增产能见顶，但企业调研显示3Q26需求环比持平或微增，后续增长更依赖头部客户拉动。锂电将不再是2026下半年至2027年增速最快的下游，需求正轮动至3C、半导体、光学、MLCC、SOFC等利基领域。苹果2027年机型外形变更是未来1-2年最明确的中期催化剂。我们维持先导智能（300450.SZ/0470.HK，买入/买入）作为锂电订单集中化最清晰受益者的看好立场，其政策风险可控，3Q26订单能见度已至2027年8月。怡合达（301029.SZ，买入）锂电需求仍稳健但增量贡献下降，我们更偏好客户结构集中于顶级电池厂且具备非锂电业务期权的一线设备供应商。 2. 终端需求驱动轮动，苹果创新周期提振3C自动化：除锂电外，自动化需求驱动正变得更为多元。3C领域，多家公司强调2027年前景改善与苹果新机型/20周年外形变更相关，将带动3D打印、机器视觉、AOI及过程控制模块的设备增量需求。大族激光（002008.SZ，中性）在3D打印领域催化剂最明确，管理层预计苹果供应链2026-27年总需求约100亿元人民币，公司目标占据约50%份额。奥普特（688686.SS，中性）和凌云光（688400.SS，中性）在机器视觉替代方面更具优势，凌云光消费电子收入预计2026年增长20%+、2027年30%+。半导体后端自动化相关的FA需求（夹具、治具）将利好怡合达，毛利率超40%；奥普特亦通过全栈视觉硬件与集成能力切入光模块/半导体/工业AI。先导智能的MLCC/SOFC及固态电池业务基数小但增速快，1H26固态订单已近10亿元，毛利率50%+。 3. 海外扩张为结构性主线，欧洲为近期最实质亮点：欧洲因本地制造、客户成本压力及份额提升机会成为海外扩张焦点。埃斯顿（002747.SZ/2715.HK，卖出/中性）是欧洲利润率改善的典型案例，欧洲毛利率达50-60%（中国为30-35%），计划2026年底在波兰启动机器人组装，2027年底实现“欧洲制造”。双环传动（002472.SZ，买入）海外放量更明确，今年海外外资品牌出货量将超100万套（主要在欧洲，份额已双位数）。 4. 人形机器人供应链展现强劲增长与战略卡位：多家核心部件公司表现出色。绿的谐波（688017.SS，中性）目标未来三年产能每年至少翻倍，长期谐波减速器产能目标超1000万台。三花智控（002050.SZ/2050.HK，中性/买入）机器人团队规模同比翻倍，在灵巧手、热管理、传感器领域具备多元期权，已获头部客户批量订单，但近期更明确的增长驱动仍是数据中心液冷。凌云光 embodied AI 数据采集收入预计2026年翻倍至约1亿元。来福谐波（3952.HK，未覆盖）人形应用占1H26谐波减速器销售约30%，产能目标2027年达月产15-16万台。 重点公司详情 • 埃斯顿：海外收入占比短期仍低，但高毛利贡献已具意义。欧洲扩张稳步推进，目标份额提升依赖性价比优势与本地化工程支持，初期聚焦中小型客户。售后市场收入预计从2025年约1亿元增至2026年约1.7亿元（同比+70%）。具身智能方面，公司认为“大脑”而非人形形态是关键突破，目前不与基础模型内部竞争，而是与阿里云等合作提供机身与数据。 • 大族激光：3D打印设备苹果链需求约100亿元，公司目标份额50%，首批订单预计2026年9月下达、11月出货。光纤/预制棒业务（杭州永通）已并表，2026年预计销售3-5亿元、净利0.5-1亿元。空心光纤产能年底将达8-10万芯公里。 • 大族数控（301200.SZ/3200.HK，未覆盖）：超快激光钻孔设备1H26销售超1亿元，主要受益光模块应用；CO2激光钻孔设备将随AI PCB在4Q26-2027年放量，公司较海外对手有约20%价格折扣。 • 来福谐波：谐波减速器月产能目标2026年底8万台、2027年底15-16万台。人形机器人应用占1H26销售约30%，正与 Harmonic Drive Systems 合作开发产品。 • 先导智能：国内产能控制风险可控，政策针对低利用率中小厂商，CATL、亿纬等头部客户审批不受影响。3Q26订单环比持平或增长，能见度至2027年8月。AIDC储能成为主要上行变量，北美客户开始需求AIDC储能方案。非锂电业务中MLCC、SOFC、固态电池正从低基数向早期规模化迈进。 • 绿的谐波：国内谐波减速器月产约10万台，公司目标三年产能年增至少一倍，长期产品线产能超1000万台（当前10倍）。与SKF的JV主要保障人形机器人轴承供应，未来可能独立对外销售全系列机器人轴承。 • 凌云光：中期目标收入CAGR约20%、经常性净利CAGR约40%。消费电子机器视觉受益折叠屏等复杂工艺，苹果链占集团收入约20%。光通信代理业务2026年预计收入7-8亿元（同比+50%+）。元客视界 embodied AI 数据采集收入2026年预计翻倍至1亿元。 • 三花智控：机器人业务从执行器拓展至灵巧手模块、热管理及传感器。数据中心液冷仍是近期更明确增长驱动，一次侧产品占比下降、二次侧占比提升，数据中心收入去年约14亿元，今年预计增约50%至20亿元，未来几年增速可维持50-100%。 • 奥普特：苹果供应链替代从FATP/组装/模块/3D打印/AOI全面铺开，在光源设计等全栈视觉能力支撑下，工业AI护城河深厚，不仅提供硬件更提供软硬一体方案。 • 双环传动：海外汽车齿轮份额稳步提升，特斯拉突破或带来上行期权。同轴齿轮是核心增长驱动，1H26出货30-40万套，2H26月均预计8万套。智能传动齿轮客户结构优化，从扫地机器人向泳池清洁、割草机、办公、汽车、电踏车拓展。 • 怡合达：锂电从2026高增长驱动转为2027稳健支撑，3C/半导体成为新增长极。锂电收入占比约26%，增速正正常化；3C受益苹果新机型设备更新，半导体后端自动化需求毛利率40%+。公司FA市场份额约10%，目标五年后达20%，增长主要来自长尾SME渗透而非大客户成熟产品。 估值与目标价（部分） • 先导智能A/H：12个月目标价50.9元/46.4港元，基于2027E P/E 30x/24x（H股较A股折价20%），买入。 • 双环传动：目标价45.5元，基于2027E P/E 25x，买入。 • 怡合达：目标价35.7元，基于2027E P/E 32x，买入。 • 三花智控A/H：目标价38.6元/40.0港元，基于2030E P/E 25x折现至2027E，中性/买入。 • 大族激光：目标价115.0元，基于2027E P/E 30x，中性。 • 绿的谐波：目标价186.7元，基于2030E P/E 50x折现至2027E，中性。 • 凌云光：目标价40.1元，主业务30x 2030E P/E折现加智谱股权价值，中性。 • 埃斯顿A/H：目标价14.7元/11.6港元，基于2030E P/E 35x/25x折现，卖出/中性。 • 奥普特：目标价105.0元，基于2027E P/E 35x，中性。#文字观点", "publish_time": "2026-09-06 17:57", "tags": ["文字观点"]}, "post:2026-09-06T16-03:83d637afacac": {"id": "post:2026-09-06T16-03:83d637afacac", "kind": "post", "title": "2026-09-06 16:03", "source_label": "帖子正文", "excerpt": "特斯拉Cybercab硬件创新观察 & 19点电话会解读 -20260906 Cybercab的硬件，整体是做了极简设计。电池、电路、内饰都是减法为主，但线控底盘创新较多 # EMB 本次亮相的Cybercab的一个亮点是EMB（电子机械制动），之前基本没有展示。", "content": "特斯拉Cybercab硬件创新观察 & 19点电话会解读 -20260906 Cybercab的硬件，整体是做了极简设计。电池、电路、内饰都是减法为主，但线控底盘创新较多 # EMB 本次亮相的Cybercab的一个亮点是EMB（电子机械制动），之前基本没有展示。数年前，特斯拉就与一些线控制动厂商对接过EMB，但是一直没有量产。本次是EMB在特斯拉的首次落地。EMB是革命性的全干式线控制动，响应周期可低至几十毫秒，在配合算法、减少刹车距离上都会有贡献；EMB完全取消液压系统，是下一代全干式线控底盘的物理底座，看好后续渗透率提升。推荐国产制动龙头，EMB已经配套理想L9的 # 伯特利 # 线控转向 Cybercab不用方向盘的背后，是线控转向(SBW)系统的支持。SBW可以实现方向盘与转向机构的解耦，也支持无方向盘的设计。SBW的ASP明显高于普通EPS（提升50%+）。# 耐世特 的SBW已经深度配套全球主要龙头车企。看好SBW全球渗透率提升，推荐耐世特#文字观点", "publish_time": "2026-09-06 16:03", "tags": ["文字观点"]}, "post:2026-09-06T22-00:d7371bb1051e": {"id": "post:2026-09-06T22-00:d7371bb1051e", "kind": "post", "title": "2026-09-06 22:00", "source_label": "帖子正文", "excerpt": "周度大模型趋势跟踪（260906）本周重点事件梳理观点一：前沿模型继续提升长任务、真实世界任务能力 #GPT-6Astra发布、ComputerUse成为核心增量。9月3日推出，标准API输入/输出价为10/50美元每百万Token，均为Sol的2.5倍。", "content": "周度大模型趋势跟踪（260906）本周重点事件梳理观点一：前沿模型继续提升长任务、真实世界任务能力 #GPT-6Astra发布、ComputerUse成为核心增量。9月3日推出，标准API输入/输出价为10/50美元每百万Token，均为Sol的2.5倍。该模型可直接填写表单、更新CRM、操作Excel和Power BI，也可使用KiCad、Blender等专业软件，并直接生成文档、PPT、表格及分析结果，AutomationBench由18.1%升至41.4%。Agent应用空间由Coding进一步向办公、科研及设计延伸； #ClaudeFable5.1发布、长时编码与科研能力升级。9月1日推出，标准API输入/输出价仍为10/50美元每百万Token，与Fable 5持平，缓存读取价降低75%。模型更善于定位代码问题根因、持续执行复杂项目并自检，知识工作与科研能力同步提升；有望以相同Token单价承接更复杂的编码和研究任务。观点二：轻量模型能力持续上移 #Gemini3.8Flash发布、轻量模型加速承接复杂Agent任务。9月2日，Google推出3.8 Flash及受限开放的Cyber版；Flash年内促销输入/输出价为0.75/3.75美元/百万Token，但AA智能指数可高达47分（同5.6Terra）。Vals金融Agent评测中，3.8较3.7准确率提高约2.4pct，平均每题成本亦增约35.4%。观点三：模型产业竞争向上下游延伸，Anthropic上市为重要催化节点 #英伟达正式宣布拟收购HuggingFace、模型分发生态成为布局重点。9月3日，英伟达宣布已同意以约129.3亿美元收购Hugging Face；公司承诺平台继续支持多云、多类芯片，开发者无需绑定英伟达算力。 #Anthropic据报延后IPO时间表。据路透社，目前公司预计于9月下旬公开招股书（此前预期9月初）、最早10月中旬启动路演，11月美国中期选举前数日完成上市。OpenRouter 数据 track（周期约8.29-9.5） 相较前一滚动窗口，总Token约114.50万亿（-0.3%）；文本请求约50.27亿次（+8.0%），Token总量基本持平，请求数继续增长。 按slug口径，#Hy4preview以14.07万亿Token、约+639.5%贡献最大绝对增量（约+12.17万亿，上期上线初期基数较低）；GLM-5.3、MiniMax M3和GPT-5.6 Luna分别约+126.6%、+112.0%、+80.3%。#文字观点", "publish_time": "2026-09-06 22:00", "tags": ["文字观点"]}, "post:2026-09-06T17-57:78f0692c0927": {"id": "post:2026-09-06T17-57:78f0692c0927", "kind": "post", "title": "2026-09-06 17:57", "source_label": "帖子正文", "excerpt": "高盛——罗博特科（300757.SZ）—— Semicon Taiwan董事长访展：光子IC规模化趋势将驱动测试与组装设备需求；买入评级 高盛举办罗博特科董事长及FiconTest负责人交流会，并参观公司在Semicon Taiwan的展位。", "content": "高盛——罗博特科（300757.SZ）—— Semicon Taiwan董事长访展：光子IC规模化趋势将驱动测试与组装设备需求；买入评级 高盛举办罗博特科董事长及FiconTest负责人交流会，并参观公司在Semicon Taiwan的展位。管理层强调光子IC自动化生产与测试需求极为强劲，直接拉动公司设备订单。公司2026年二季度业绩大幅超预期（报告链接），印证了高盛对罗博特科在CPO（共封装光学）、NPO（近封装光学）、OCS（光电路交换）及光模块等趋势中深度受益的积极判断。考虑到公司在光子IC领域全面的设备覆盖及软硬件一体化自动化能力，高盛认定罗博特科为光子IC规模化趋势的核心受益标的。维持\"买入\"评级，12个月目标价796元人民币（基于2031年预期市盈率20.7倍，以11.3%的股权成本贴现回2027年；对应2027-2029年预期EPS复合增长率50%，隐含2027年预期市盈率35倍）。 一、光子IC需求前景：二十五年积累，一年释放 管理层指出，过去二十五年光子技术并未跟随半导体工艺持续微缩，而如今在生成式AI驱动下，光子必须与半导体协同进化，这催生了对光子测试、组装等设备的巨大需求以实现光子规模化。管理层表示，未来一年内公司目标出货的设备数量将超过过去二十五年累计出货量的50%以上；未来五年所需产能将超过过去二十五年的总和——这组数据直观反映了光子规模化需求的爆发强度。管理层特别强调光子测试设备的紧迫性：行业要求在18-24个月内，将光子测试速度提升至与电子IC/半导体测试同等的快速与可扩展水平，而电子IC测试体系的建立耗费了五十年。 二、光子测试设备：全链条覆盖，晶圆/裸片/模块四级测试闭环 公司提供从晶圆级到裸片级再到完整模块级的全面测试设备，对应四个插入测试节点（Insertion 1-4）。核心逻辑是\"失效发现越早，成本损失越低\"。公司不仅覆盖整个测试链条，且各测试步骤之间具备数据关联性与可追溯性，帮助客户精准定位失效来源。 晶圆级测试（Insertion 1&2）：公司提供双面晶圆测试设备，并于2026年三季度推出全新一代产品，完全符合全球领先晶圆厂的通信基础设施要求。该设备可处理晶圆翘曲、实现精密对准、满足复杂温控需求，并保证机台间重复性与数据相关性。公司目标明年将晶圆级测试时间缩短50-60%。 裸片级测试（Insertion 3）：公司提供双面裸片测试设备，可应对小芯片、窄间距的测试挑战。目标明年将裸片级测试速度提升4倍。 模块级测试（Insertion 4）：设备可覆盖ELSFP、OSFP等多种架构。模块测试需同时处理多个芯片与光纤线缆，显著提升了测试复杂度与温控要求。管理层表示目标是通过更多并行步骤缩短测试时间。 三、竞争优势：三大核心壁垒 管理层归纳公司三大竞争优势： 1. 主动对准：提供极高精度对准能力，公司自主研发运动控制软件及控制器； 2. 高度自动化：提供全自动化生产线，使客户能够实现无人化工厂运营； 3. AI/数字孪生：允许客户通过AI软件在实验室中模拟生产过程（如光收发器的封装与组装）。公司强调其不仅提供测试设备，还提供组装设备，使客户能够实现光收发器的全自动化生产。 四、估值与目标价方法论 12个月目标价796元人民币基于2031年预期市盈率20.7倍，以11.3%的股权成本贴现回2027年。目标倍数源自消费电子同业PEG&M相关性分析（2026年预期市盈率对应2027年净利润同比增速与营业利润率），其中罗博特科2032年预期净利润同比增长2%，2032年预期营业利润率32%。 五、主要下行风险 1. 市场竞争烈度超预期； 2. 光连接终端需求不及预期； 3. 光伏市场下行周期幅度与持续时间超预期（公司传统业务涉及光伏自动化设备）。#文字观点", "publish_time": "2026-09-06 17:57", "tags": ["文字观点"]}, "post:2026-09-06T22-00:6d12939f63df": {"id": "post:2026-09-06T22-00:6d12939f63df", "kind": "post", "title": "2026-09-06 22:00", "source_label": "帖子正文", "excerpt": "周报：AI长剧上星引领板块情绪修复，关注AI内容应用行情机遇 本周（8/31-9/4）：A股申万传媒指数涨6.03%/沪深300跌1.33%/上证指数跌0.56%/创业板指数跌4.03%；海外恒生指数涨0.26%/恒生科技指数跌0.77%/纳斯达克指数涨0.40%。", "content": "周报：AI长剧上星引领板块情绪修复，关注AI内容应用行情机遇 本周（8/31-9/4）：A股申万传媒指数涨6.03%/沪深300跌1.33%/上证指数跌0.56%/创业板指数跌4.03%；海外恒生指数涨0.26%/恒生科技指数跌0.77%/纳斯达克指数涨0.40%。 ☀评论 本周传媒板块反弹。本周行情的核心驱动为国内首部AI长剧《后西游记》上星播出。8月31日该剧登陆芒果TV与湖南卫视黄金档。这是AI生成内容首次进入卫视黄金档，市场对AI影视从“降本工具”向“独立内容形态”演进的预期得到强化。 展望后续，我们建议把握以下投资线索： 1）游戏赛道低估值、高景气度，商业模式具备优势，关注产品周期明确的头部厂商； 2）持续关注AI商业化进展和技术迭代，关注已跑通AI内容商业模式的平台型公司及产业链相关标的； 3）IP价值重估，AI技术降低IP影视化门槛后，IP储备丰富的公司迎来资产重估窗口。 1️⃣AI文娱：关注多模态模型迭代、AI影视内容生产升维。8月31日芒果TV出品、芒果TV AIGC创新内容中心制作的神话剧《后西游记》第一季“花果山篇”上线芒果TV，并登陆湖南卫视黄金档，为国内首部AIGC长剧。建议关注影视内容领域AIGC产能释放节奏与价值外溢空间。多模态模型方面，本周在AI世界模型、AI 3D模型领域，多厂商迭代模型，并推进融资，具体包括李飞飞World Labs、Runway、影眸科技等。我们认为，AI世界模型、3D模型仍处于模型迭代推动行业应用渗透、变现提升的早期阶段，建议关注后续模型的持续迭代，及融资、产业合作对技术迭代的保障。 2️⃣游戏：8月版号如期发放，发放量再创新高，一定程度印证游戏行业的政策友好环境。8月版号如期发放，国产游戏版号209个，连续2个月国产版号发放量创近五年新高，1-8月发放数同增26%；发放进口游戏版号6个；审批变更游戏版号12个。 ☀估值与建议 维持盈利预测/估值/目标价。A股推荐游戏板块(世纪华通/恺英网络等)，关注分众传媒；港美股推荐网易/阅文集团/快手/心动公司/欢聚，关注音乐(腾讯音乐/网易云音乐)/猫眼娱乐/大麦娱乐。 ☀风险 宏观景气度低于预期，监管政策变化，盈利修复较慢。#文字观点", "publish_time": "2026-09-06 22:00", "tags": ["文字观点"]}, "post:2026-09-06T22-43:e8d199e31e0d": {"id": "post:2026-09-06T22-43:e8d199e31e0d", "kind": "post", "title": "2026-09-06 22:43", "source_label": "帖子正文", "excerpt": "韬定律V2（第二篇论文）关于液冷散热的真实结论 论文完全没有得出“液冷散热不重要”的结论，市场这个说法属于误读、自媒体过度演绎。论文原文真实观点 1.V1版本几乎没谈热管理", "content": "韬定律V2（第二篇论文）关于液冷散热的真实结论 论文完全没有得出“液冷散热不重要”的结论，市场这个说法属于误读、自媒体过度演绎。 论文原文真实观点 1.V1版本几乎没谈热管理；V2专门新增散热章节，反而承认逻辑折叠3D堆叠会带来更严峻的散热挑战：多层垂直堆叠后，上层芯片遮挡下层散热通路，热流密度上升，散热是架构的核心瓶颈之一。 2.给出芯片设计端解法：热感知分区布局 在EDA布图阶段，把高功耗计算模块在垂直方向错开堆叠，不让多个高热模块上下叠在一起，从源头避免热点叠加；同时逻辑折叠缩短走线RC损耗，同等性能下整体芯片功耗、功率密度小幅下降（移动端实测功率密度仅比基线高5.6%）。 ⚠️论文明确写清楚：该手段只能缓解热压力，不能根治堆叠散热难题，层数继续提高，热约束会限制可折叠电路规模，散热依旧是硬约束。 3.区分移动端和AI算力两大场景 - 手机移动端（麒麟2026）：通过架构优化把功率密度控制住，不需要强制上液冷，传统散热方案尚可hold住； - AI服务器、高密度智算场景：论文路线图明确，未来多层逻辑折叠AI芯片，热流密度会大幅抬升，液冷依旧是必需基础设施，没有否定液冷价值。 市场流传“液冷不重要”错在哪 1.断章取义：拿手机端功率密度可控的实测结果，直接外推到AI服务器，误以为全部场景都不需要液冷； 2.混淆两个层级： - 芯片内部热优化（热感知布局）：属于芯片设计，降低发热源头； - 整机机柜液冷：属于系统散热基础设施。 韬定律V2做的是降低源头发热压力，不是消灭散热需求。高密度AI算力场景，芯片内部再优化，整机层面依然依赖液冷、金刚石热沉等散热手段。 简单总结 1.移动端逻辑折叠芯片，架构优化后热压力可控，不用液冷； 2.AI智算高密度堆叠芯片，论文确认散热仍是重大瓶颈，液冷依旧是刚需，没有被替代； 3.“韬定律第二篇得出液冷散热不重要”是二级市场自媒体误读，不是论文原文结论。#文字观点", "publish_time": "2026-09-06 22:43", "tags": ["文字观点"]}, "post:2026-09-06T17-52:0dd07f88fb1c": {"id": "post:2026-09-06T17-52:0dd07f88fb1c", "kind": "post", "title": "2026-09-06 17:52", "source_label": "帖子正文", "excerpt": "【长江电新】储能：担忧因素均已按最悲观定价，现在就是布局明年的最好时点 1、半年报之后，储能投资信心受挫，关注度跌至年内谷底。我们认为这反而是左侧布局的最好时机：明年估值普遍10-15倍，海外需求强势无分歧，诸多担忧因素（北美贸易壁垒、竞争格局、原料涨价等）均已讨论充分，股价按照最悲观预期定价。", "content": "【长江电新】储能：担忧因素均已按最悲观定价，现在就是布局明年的最好时点 1、半年报之后，储能投资信心受挫，关注度跌至年内谷底。我们认为这反而是左侧布局的最好时机：明年估值普遍10-15倍，海外需求强势无分歧，诸多担忧因素（北美贸易壁垒、竞争格局、原料涨价等）均已讨论充分，股价按照最悲观预期定价。此刻一旦需求利好落地，高增预期强化，#参考历史往往存在估值快速修复&切明年的弹性机会。 2、需求预期将逐步明确的信心在于： 1）户储，年内可期待两方面强催化：一是补贴政策，除了英国补贴，其他欧亚国家受地缘冲突常态化影响，油气紧缺问题达到历史级别，户储相关补贴政策随时会新增落地；二是涨电价及缺电，除了地缘冲突之外，厄尔尼诺也带来电力需求增长，扩大电力缺口。下半年海外居民电价预计上涨，亚洲各国缺电亦或加剧。在此背景下，#户储Q4需求有望环增。2）大储，重要的是强化海外需求高增的预期。目前无论是企业口径、还是能够跟踪到细分市场招中标数据，均指引#明年海外需求增速将超过50%，甚至更高。后续企业交流口径、订单进展等有望构成催化。同时AIDC相关进展可锦上添花。 3、继续坚定强调储能的底部机会！标的层面，户储推荐德业、锦浪、思格等，大储推荐阳光、海博、正泰电源、海伦哲等。#文字观点", "publish_time": "2026-09-06 17:52", "tags": ["户储Q4需求有望环增", "文字观点"]}, "post:2026-09-06T18-24:377f47609d3d": {"id": "post:2026-09-06T18-24:377f47609d3d", "kind": "post", "title": "2026-09-06 18:24", "source_label": "帖子正文", "excerpt": "AI材料观点-韬定律提升散热材料要求20260906 1、PCB材料：周五美国硬件公司大幅上涨（非农数据表明经济强—资本开支持续—分子端边际定价强于分母端流动性定价），A股映射，情绪上利好。PTFE方案预计9-10月有望落地，继续关注硅微粉、PTFE树脂。", "content": "AI材料观点-韬定律提升散热材料要求20260906 1、PCB材料：周五美国硬件公司大幅上涨（非农数据表明经济强—资本开支持续—分子端边际定价强于分母端流动性定价），A股映射，情绪上利好。PTFE方案预计9-10月有望落地，继续关注硅微粉、PTFE树脂。 2、导热散热材料：韬定律会提升散热、导热材料要求，如封装内部用的low α球铝、氮化铝；热界面材料；整机系统散热材料。# 联瑞新材、国瓷材料 3、电子气体：9月氩气价格继续加速上行，较8月初涨幅超100%。另重点关注六氟化钨在9月涨价落地情况。 4、氧化锆、玻璃基板、ABF膜仍保持景气，重点跟踪价格和客户突破及订单变化。 风险提示：需求不及预期#文字观点", "publish_time": "2026-09-06 18:24", "tags": ["文字观点"]}, "post:2026-09-06T21-04:c9fe343efaa9": {"id": "post:2026-09-06T21-04:c9fe343efaa9", "kind": "post", "title": "2026-09-06 21:04", "source_label": "帖子正文", "excerpt": "⚠️高端 ABF 生产仍受 T‑Glass 短缺制约，导致公司无法捕获约 10‑15% 的潜在月收入。📌Kinsus 产能扩张规划📈Kinsus 计划在 2027 年将高端 ABF 产能扩大约 25%。", "content": "⚠️高端 ABF 生产仍受 T‑Glass 短缺制约，导致公司无法捕获约 10‑15% 的潜在月收入。 📌Kinsus 产能扩张规划📈Kinsus 计划在 2027 年将高端 ABF 产能扩大约 25%。 🔧扩产将涉及在台湾工厂安装新设备，而不是转换现有 BT 生产线，且所需材料分配已获得保障。 📌BT 与存储业务情况💾存储产品目前占 BT 基板收入的约一半。 📊美国客户已连续几个季度上调其 DRAM 和 NOR 需求预测。 📌光学通信业务发展🔌从 800G 向 1.6T 和 3.2T 的过渡需要更精细的电路和更好的信号完整性，从而推动 mSAP 需求。 💰光学通信基板具有更高的层数、平均售价和利润率，该项目预计将产生约 20% 的毛利率。 📌BT 产线利用率以及远期扩产思路📉BT 利用率目前约为 75%，预计年底达到 85%。 ✅现有产能仍有充足余地，因此无需立即扩产。 📅Kinsus 计划在第四季度开始与客户讨论 2027‑2029 年产能需求，并将根据实际订单做出投资决策。 🚀如果光学通信需求显著放量，公司最早可能在 2027 年中期考虑进一步扩产。#文字观点", "publish_time": "2026-09-06 21:04", "tags": ["文字观点"]}, "post:2026-09-06T22-00:18aebe9189ba": {"id": "post:2026-09-06T22-00:18aebe9189ba", "kind": "post", "title": "2026-09-06 22:00", "source_label": "帖子正文", "excerpt": "领导好，给大家再汇报一下我们对【芯碁微装】的观点更新，最近我们一直强调公司在海外的先进封装业务进展非常超预期，这其中包括即将送样的台系龙头封测厂以及美系龙头晶圆厂，尤其值得重视的是这两个都是CoPoS封装的设备，之前也给大家汇报过，CoPoS对芯碁的直写光刻设备来说不是可选项，而是必选项，尤其最近台", "content": "领导好，给大家再汇报一下我们对【芯碁微装】的观点更新，最近我们一直强调公司在海外的先进封装业务进展非常超预期，这其中包括即将送样的台系龙头封测厂以及美系龙头晶圆厂，尤其值得重视的是这两个都是CoPoS封装的设备，之前也给大家汇报过，CoPoS对芯碁的直写光刻设备来说不是可选项，而是必选项，尤其最近台系龙头晶圆厂也开始测试直写，可以说全球先进封装用直写光刻的趋势已经越来越明确，芯碁的机台一旦在海外通过验证，市值空间将跃升一个大台阶。 当然，国内先进封装也在持续大扩产，包括甬矽、通富以及上周刚公告的长电，每家都是百亿级别capex，尤其值得重视的是国产龙头存储厂和晶圆厂都有可能入局先进封装，可以说先进封装赛道一定是未来capex最靓的赛道，此时是买先进封装设备是最好的时候！ 当然芯碁的pcb业务也是处在爆单的状态，包括msap和载板，公司目前订单完全接不过来，后续我相信随着新产能的上马，利润弹性非常大！ 再次提醒重视先进封装行业巨大的capex增量，重视先进封装赛道【金铲子】芯碁微装，坚定看2500e市值！最近回调提供了非常好的买入机会！#文字观点", "publish_time": "2026-09-06 22:00", "tags": ["文字观点"]}, "post:2026-09-06T17-54:68c6d0fd267b": {"id": "post:2026-09-06T17-54:68c6d0fd267b", "kind": "post", "title": "2026-09-06 17:54", "source_label": "帖子正文", "excerpt": "下一阶段收益将更多来自科技内部重新筛选 开源策略 短期看，交易拥挤初步消化，科创50隐含波动率下降，科技板块内细分机会或显现，配置上建议均衡配置，把握科技与再平衡机会。再平衡方向：（1）继续重点推荐小微盘，重点关注中证2000和万得微盘股", "content": "下一阶段收益将更多来自科技内部重新筛选 开源策略 短期看，交易拥挤初步消化，科创50隐含波动率下降，科技板块内细分机会或显现，配置上建议均衡配置，把握科技与再平衡机会。 再平衡方向：（1）继续重点推荐小微盘，重点关注中证2000和万得微盘股；（2）关注净利润增速超预期行业：电子、国防军工、计算机、石油石化、有色金属、非银金融；（3）行业再平衡重点关注有色、基础化工、新能源、农业、医药，以及造船等部分中游制造；（4）银行、公用事业、电力等高股息方向在高波动市场中具备较好的风险收益比。 中期看，科技仍是中期主线，全面普涨的Beta难度明显上升，下一阶段收益将更多来自科技内部重新筛选。配置上继续寻找“二次点火+叙事张力”的交集，重点关注AI材料、国产算力链，海外算力链中的PCB、光模块上游，编程Agent、企业级Agent等AI应用方向，以及电力设备、电力、能源金属、液冷等科技外溢形成的新景气方向。#文字观点", "publish_time": "2026-09-06 17:54", "tags": ["文字观点"]}, "post:2026-09-06T17-58:a38cabfe449d": {"id": "post:2026-09-06T17-58:a38cabfe449d", "kind": "post", "title": "2026-09-06 17:58", "source_label": "帖子正文", "excerpt": "高盛——剑桥科技（603083.SS）——2026年亚洲领导者大会纪要：高速光模块产能爬坡", "content": "高盛——剑桥科技（603083.SS）——2026年亚洲领导者大会纪要：高速光模块产能爬坡；越南与墨西哥产能扩张中 翻译精华 高盛发布剑桥科技（603083.SS / 6166.HK，未覆盖）在2026年亚洲领导者大会上的管理层交流纪要。核心讨论聚焦于三大主题：（1）800G/1.6T高速光模块的产能爬坡；（2）全球产能扩张进展；（3）NPO/CPO（近封装光学/共封装光学）的技术机遇。整体而言，管理层对800G/1.6T光模块的强劲需求保持乐观，公司正持续扩大中国、墨西哥及越南的产能布局。考虑到激光器、DSP芯片等上游材料的供应紧张，公司继续与产业合作伙伴紧密协作以保障供应链安全。管理层预计，到2026年底公司光模块年产能将不低于600万只。同时，公司计划在2026年下半年推进1.6T和LPO（线性驱动插拔光模块）产品的量产与客户认证，并拓展至ELSFP（外置激光器小型可插拔）、XPO及NPO等解决方案。 高速光模块产能扩张细节 剑桥科技采取多地分散化生产策略以对冲地缘与贸易风险。具体进展如下： • 墨西哥：管理层表示，宽带产品的试生产已于2026年上半年完成，目标在2027年初启动面向美国客户的光模块生产。 • 越南：生产基地已通过客户验证，有力支撑了公司海外产能扩张的推进。 • 中国：浙江制造中心二期嘉善工厂已于2026年3月投产运营。 对光模块行业的投资启示 管理层对高速光模块需求的积极表态，与高盛关于AI资本开支驱动下800G及以上光模块加速放量的观点形成共振。高盛预计，2026/2027/2028年全球光模块市场规模将分别达到510亿美元、730亿美元和690亿美元，其中800G及以上细分市场将以31%的复合年增长率扩张，规模分别达到320亿美元、550亿美元和560亿美元。这一需求侧的强劲动能，为剑桥科技等具备全球化产能布局的上游供应商提供了明确的增长能见度。 公司概况 剑桥科技成立于2005年，是领先的光模块供应商。公司产品主要面向品牌客户（如思科），并正积极拓展至云服务提供商（CSP）。其产品线涵盖高速光收发模块、无线与宽带接入、运营商以太网及边缘计算，支撑下一代电信与数据中心网络。公司附属机构遍布美国、中国、日本、马来西亚及欧洲。 主要风险 包括：上游关键芯片（激光器、DSP）供应短缺超预期；海外产能建设进度不及预期；客户认证周期延长；行业竞争加剧导致价格压力；以及全球贸易政策变动对跨境供应链的潜在扰动。#文字观点", "publish_time": "2026-09-06 17:58", "tags": ["文字观点"]}, "post:2026-09-06T21-02:767f1bd23aad": {"id": "post:2026-09-06T21-02:767f1bd23aad", "kind": "post", "title": "2026-09-06 21:02", "source_label": "帖子正文", "excerpt": "浙商机械大制造【船舶行业】BDI指数强势上涨，2026年船舶行业有望量价齐升，持续推荐！", "content": "浙商机械大制造【船舶行业】BDI指数强势上涨，2026年船舶行业有望量价齐升，持续推荐！核心投资逻辑 #1、民船行业上行趋势：周期近期上行，行业量利齐升，干散货船订单后续有大幅增长可能 1）价：截至2026年8月底，克拉克森周度新船价格指数报收186.34点，2026年以来上涨0.92%，2021年以来上涨47%，位于历史峰值97%分位。其中，箱船、油轮、散 多方确认**：中国台湾半导体展调研整体确认设备需求强劲，中国台湾供应链强劲资本开支是核心驱动；DRAM 及 HBM 探针卡需求保持强劲；同时国内精智达签订 15.76 亿元半导体测试设备订单。\n- **华为韬定律第二篇论文成为半导体与散热的核心讨论点**：麒麟 2026 晶体管密度从约每平方毫米 1.55 亿提升至 2.38 亿个、跃升 55%，同性能下 NPU/GPU/CPU 功耗分别降 66%/58%/41%；且市场关于“液冷散热不重要”的说法被指属于误读与过度演绎。\n- **机器人产业链出现拐点级订单信号**：T 链首次一次性下达约 5k 台量级订单，核心供应商反馈该量级为首次出现；人形应用占谐波减速器 1H26 销售约 30%，有厂商产能目标为 2027 年月产 15-16 万台。\n\n## 二、今日最强主线\n\n### 主线 1：前沿大模型能力竞赛（GPT-6 Astra 与 Fable-5.1 直接对标）\n- **今天强化的逻辑**：多家测算与实测显示，Astra 推理效率领先，复杂编程基本追平 Fable；3D 建模、Computer Use 场景成为差异化增量，长上下文能力明显提升，被认为真正意义上实现 100 万上下文的基本无 Context 丢失与低幻觉。\n- **今天出现的催化/验证**：GPT-6 Astra 发布点评强调其“全球最智能且对齐程度最高”的定位，并披露定价 10/50 美元全面对标 Fable 5；有观点将 Anthropic 的发布节奏（Fable 5.1 → Astra → Fable 5.2）与 9 月 ARR 再加速、为 IPO 造势的线索关联。\n\n### 主线 2：AI 算力供给与国产算力商业化验证\n- **今天强化的逻辑**：Astra 以超 10 万张 GPU 完成训练，强化“超大规模算力+超大参数”叙事；戴尔已向 CoreWeave 交付首批生产用 NVIDIA Vera Rubin NVL72 机架，显示新一代算力硬件进入交付阶段；国产侧基于 MTT S5000 及 MUSA 软件。\n- **今天出现的催化/验证**：有报道称 DeepSeek 计划在内蒙古建设的大型数据中心部署至少 16 万颗华为下一代昇腾 950DT 芯片用于推理，若按计划完成，将成为已知规模最大的国产 AI 芯片集群之一。\n\n### 主线 3：半导体设备与先进封装（Semicon Taiwan 景气 + 韬定律发酵）\n- **今天强化的逻辑**：中国台湾半导体展调研确认设备市场持续景气，中国台湾供应链资本开支意愿为核心驱动力；310mm 方形面板级封装（PLP）设备及混合键合机仍在客户评估中，客户量产时间线约在 2028 年；高端 ABF 生产仍受 T-Glass 短缺制约，有厂商因此无法捕获约 10-15% 潜在月收入。\n- **今天出现的催化/验证**：华为韬定律第二篇论文发布，聚焦逻辑折叠与三维混合键合，麒麟 2026 晶体管密度跃升 55%、同性能功耗显著下降；精智达签订 15.76 亿元半导体测试设备订单；2026 年二季度全球 DRAM 市场营收同比 +385%、环比 +57%。\n\n### 主线 4：宏观数据与成长股定价逻辑切换\n- **今天强化的逻辑**：8 月非农 headline 数据大超预期至 165k（一致预期及部分买方预期在 50-65k 不等），但剔除酒店服务业与政府就业等季节项后，其他增长主要来自建筑等周期行业，失业率维持在 4.1%、薪资月环比 0.27%，有观点认为近几个月非农数据质量偏低。\n- **今天出现的催化/验证**：按旧脚本“非农好→利率升→杀成长股”，但费半逆势上涨 3% 以上，AOI +5.13%、Lumentum +4%；市场定价从“利率单一变量”切换为“利率 vs 盈利确定性”的两边拔河，AI 硬件端盈利确定性成为边际定价主导。\n\n### 主线 5：AI 功耗外溢——备电、电源与散热\n- **今天强化的逻辑**：9 月 3 日 OpenAI、Claude（Anthropic）与 Grok（xAI）三家主要 AI 服务商北美服务器集群发生大面积中断，强化柴发备用电源的刚性需求；韬定律第二篇论文的散热解读被澄清为误读，真实观点并非“液冷散热不重要”。\n- **今天出现的催化/验证**：科泰电源订单/合同负债前瞻指标翻倍验证高景气，收入先行爆发实现同比翻番，海外高毛利业务占比抬升与规模效应释放有望带动利润率向上弹性；七部门提出探索算力设施 800V 高压直流供电，推动超百千瓦单机柜部署。\n\n### 主线 6：机器人产业化拐点与智能出行硬件\n- **今天强化的逻辑**：T 链首次一次性下达约 5k 台大批量订单，被视作本体量产 S 曲线拐点将至的标志，后续有望看到大订单陆续落地；谐波减速器环节人形应用占 1H26 销售约 30%，产能目标指向 2027 年月产 15-16 万台。\n- **今天出现的催化/验证**：有深圳产业链调研认为，产业约束瓶颈已从其他环节转移至算力与真机数据；特斯拉 Cybercab 硬件展示 EMB 电子机械制动等线控底盘创新；特斯拉 AI 负责人称待“v15 计划中的下一项技术”整合完成后，Robotaxi 全天候运营能力或于“下个月左右”上线。\n\n## 三、今日重点关注\n\n### 3.1 今天已经发生的重点变化\n- Anthropic 发布 Claude Commerce Agents 开源蓝图，开放 Shopping Agent、Merchant Agent 完整参考架构，覆盖零售、旅游、电信、票务等真实商业场景，AI 电商从“聊天导购”进入交易转化阶段。\n- 中国人保发布定增公告，拟向财政部发行 A 股股票、募集资金不超过 150 亿元；同日国寿集团、中国太平官网公告分别获财政部注资 350 亿元、70 亿元。另有分析提及 26 年特别国债 3000 亿元用于注资银行的线索及财政部对保险央企注资的考虑。\n- 国内三大主要保险集团获注资/定增、美国行政令专家会、AIGC 长剧上星等事件集中落地：《后西游记》第一季“花果山篇”登陆湖南卫视，成为卫视首播的 AIGC 长剧。\n- 华为已定档 9 月 7 日召开全场景新品发布会，苹果秋季新品发布会定档北京时间 9 月 10 日，AI 手机/折叠屏进入 9 月密集发布窗口。\n- 光纤领域出现供给端变化：今年宣布扩产的厂家已全部推迟扩产，且尚不清楚何时能稳定出产，主要受国产设备需求量太大、出厂调试问题较多影响；D 纤价格已突破今年最高位。\n- 美国军方表示对三艘伊朗原油油轮发动袭击，以报复伊朗伊斯兰革命卫队用弹道导弹袭击两艘美国海军军舰。\n\n### 3.2 接下来要继续跟踪的验证点/催化点\n- 下周五美国通胀信号（CPI）是宏观能否继续制约成长股的关键验证点；特朗普针对降息的激进表态与 8 月非农数据结构质量偏低的问题需持续跟踪。\n- GPT-6 Astra 面向更多用户开放后的稳定测评反馈：复杂编程是否持续追平 Fable、Computer Use 与 Mac 结合的实际效果（本次多未实测）、100 万上下文低幻觉能力在更大规模任务中的表现。\n- Anthropic 与 OpenAI 的发布节奏博弈：Fable 5.1 → Astra → Fable 5.2（IPO 前）的节奏假设，以及 9 月 ARR 再加速线索能否被后续数据验证。\n- 9 月 9-11 日中国光博会：关注 OCS、光芯片、薄膜铌酸锂、无源光器件四大方向；光迅科技将推出 320×320 端口 OCS，腾景、光库、天孚、炬光等厂商预计带来前沿 OCS 零组件。\n- PCB 材料端验证点：PTFE 方案预计 9-10 月有望落地，六氟化钨 9 月涨价落地情况；高端 ABF 的 T-Glass 短缺制约何时缓解，以及 Kinsus 计划 2027 年将高端 ABF 产能扩大约 25% 的推进节奏。\n- T 链订单连续性：首批约 5k 台订单之后，是否出现更多大订单；供应商产能扩张能否匹配“年底非线性起量”的排产预期。\n- 国产算力落地：DeepSeek 采购 16 万颗昇腾 950DT 的报道是否兑现，以及国产 AI 芯片集群的产能投放与订单落地催化。\n- 特斯拉 Robotaxi 运营进度：v15 计划中“下一项技术”完成整合后，24 小时全天候运营能力能否于“下个月左右”如期上线。\n- 甲骨文 2027 财年一季度前瞻：有报告提示其股价相对 4Q26 业绩后已下跌 25% 以上，估值的战术性吸引力需以执行落地为前提来验证。\n\n## 四、高价值内容摘录\n\n### 文字观点\n- 07:51｜两个光纤的事情。第一个是今天问了一下，现在所有今年说扩产的厂家全部推迟了，并且目前还不太清楚什么时候能稳定出产，主要问题是国产设备需求量太大了，他们出厂的设备调试出了很多问题，进而导致现在为了D纤调产能，D纤价格已经突破今年最高位了。\n- 07:52｜美国军方表示，对三艘伊朗原油油轮发动袭击，以报复伊朗伊斯兰革命卫队用弹道导弹袭击两艘美国海军军舰。\n- 12:45｜周末舆情热度： ①AI手机/折叠屏-9月密集发布，新机旗舰大战一触即发:①华为已定档9月7日召开全场景新品发布会;②苹果秋季新品发布会已定档北京时间9月10日\n- 13:46｜路透社：鸿海称AI需求强劲，第三季度业绩将超市场预期 鸿海预测，第三季度的业绩表现会好于市场预期，主要原因是人工智能 ong>：多家测算与实测显示，Astra 推理效率领先，复杂编程基本追平 Fable；3D 建模、Computer Use 场景成为差异化增量，长上下文能力明显提升，被认为真正意义上实现 100 万上下文的基本无 Context 丢失与低幻觉。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：GPT-6 Astra 发布点评强调其“全球最智能且对齐程度最高”的定位，并披露定价 10/50 美元全面对标 Fable 5；有观点将 Anthropic 的发布节奏（Fable 5.1 → Astra → Fable 5.2）与 9 月 ARR 再加速、为 IPO 造势的线索关联。\u003c/li>\n\u003c/ul>\n\u003ch3>主线 2：AI 算力供给与国产算力商业化验证\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：Astra 以超 10 万张 GPU 完成训练，强化“超大规模算力+超大参数”叙事；戴尔已向 CoreWeave 交付首批生产用 NVIDIA Vera Rubin NVL72 机架，显示新一代算力硬件进入交付阶段；国产侧基于 MTT S5000 及 MUSA 软件。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：有报道称 DeepSeek 计划在内蒙古建设的大型数据中心部署至少 16 万颗华为下一代昇腾 950DT 芯片用于推理，若按计划完成，将成为已知规模最大的国产 AI 芯片集群之一。\u003c/li>\n\u003c/ul>\n\u003ch3>主线 3：半导体设备与先进封装（Semicon Taiwan 景气 + 韬定律发酵）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：中国台湾半导体展调研确认设备市场持续景气，中国台湾供应链资本开支意愿为核心驱动力；310mm 方形面板级封装（PLP）设备及混合键合机仍在客户评估中，客户量产时间线约在 2028 年；高端 ABF 生产仍受 T-Glass 短缺制约，有厂商因此无法捕获约 10-15% 潜在月收入。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：华为韬定律第二篇论文发布，聚焦逻辑折叠与三维混合键合，麒麟 2026 晶体管密度跃升 55%、同性能功耗显著下降；精智达签订 15.76 亿元半导体测试设备订单；2026 年二季度全球 DRAM 市场营收同比 +385%、环比 +57%。\u003c/li>\n\u003c/ul>\n\u003ch3>主线 4：宏观数据与成长股定价逻辑切换\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：8 月非农 headline 数据大超预期至 165k（一致预期及部分买方预期在 50-65k 不等），但剔除酒店服务业与政府就业等季节项后，其他增长主要来自建筑等周期行业，失业率维持在 4.1%、薪资月环比 0.27%，有观点认为近几个月非农数据质量偏低。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：按旧脚本“非农好→利率升→杀成长股”，但费半逆势上涨 3% 以上，AOI +5.13%、Lumentum +4%；市场定价从“利率单一变量”切换为“利率 vs 盈利确定性”的两边拔河，AI 硬件端盈利确定性成为边际定价主导。\u003c/li>\n\u003c/ul>\n\u003ch3>主线 5：AI 功耗外溢——备电、电源与散热\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：9 月 3 日 OpenAI、Claude（Anthropic）与 Grok（xAI）三家主要 AI 服务商北美服务器集群发生大面积中断，强化柴发备用电源的刚性需求；韬定律第二篇论文的散热解读被澄清为误读，真实观点并非“液冷散热不重要”。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：科泰电源订单/合同负债前瞻指标翻倍验证高景气，收入先行爆发实现同比翻番，海外高毛利业务占比抬升与规模效应释放有望带动利润率向上弹性；七部门提出探索算力设施 800V 高压直流供电，推动超百千瓦单机柜部署。\u003c/li>\n\u003c/ul>\n\u003ch3>主线 6：机器人产业化拐点与智能出行硬件\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：T 链首次一次性下达约 5k 台大批量订单，被视作本体量产 S 曲线拐点将至的标志，后续有望看到大订单陆续落地；谐波减速器环节人形应用占 1H26 销售约 30%，产能目标指向 2027 年月产 15-16 万台。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：有深圳产业链调研认为，产业约束瓶颈已从其他环节转移至算力与真机数据；特斯拉 Cybercab 硬件展示 EMB 电子机械制动等线控底盘创新；特斯拉 AI 负责人称待“v15 计划中的下一项技术”整合完成后，Robotaxi 全天候运营能力或于“下个月左右”上线。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>Anthropic 发布 Claude Commerce Agents 开源蓝图，开放 Shopping Agent、Merchant Agent 完整参考架构，覆盖零售、旅游、电信、票务等真实商业场景，AI 电商从“聊天导购”进入交易转化阶段。\u003c/li>\n\u003cli>中国人保发布定增公告，拟向财政部发行 A 股股票、募集资金不超过 150 亿元；同日国寿集团、中国太平官网公告分别获财政部注资 350 亿元、70 亿元。另有分析提及 26 年特别国债 3000 亿元用于注资银行的线索及财政部对保险央企注资的考虑。\u003c/li>\n\u003cli>国内三大主要保险集团获注资/定增、美国行政令专家会、AIGC 长剧上星等事件集中落地：《后西游记》第一季“花果山篇”登陆湖南卫视，成为卫视首播的 AIGC 长剧。\u003c/li>\n\u003cli>华为已定档 9 月 7 日召开全场景新品发布会，苹果秋季新品发布会定档北京时间 9 月 10 日，AI 手机/折叠屏进入 9 月密集发布窗口。\u003c/li>\n\u003cli>光纤领域出现供给端变化：今年宣布扩产的厂家已全部推迟扩产，且尚不清楚何时能稳定出产，主要受国产设备需求量太大、出厂调试问题较多影响；D 纤价格已突破今年最高位。\u003c/li>\n\u003cli>美国军方表示对三艘伊朗原油油轮发动袭击，以报复伊朗伊斯兰革命卫队用弹道导弹袭击两艘美国海军军舰。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>下周五美国通胀信号（CPI）是宏观能否继续制约成长股的关键验证点；特朗普针对降息的激进表态与 8 月非农数据结构质量偏低的问题需持续跟踪。\u003c/li>\n\u003cli>GPT-6 Astra 面向更多用户开放后的稳定测评反馈：复杂编程是否持续追平 Fable、Computer Use 与 Mac 结合的实际效果（本次多未实测）、100 万上下文低幻觉能力在更大规模任务中的表现。\u003c/li>\n\u003cli>Anthropic 与 OpenAI 的发布节奏博弈：Fable 5.1 → Astra → Fable 5.2（IPO 前）的节奏假设，以及 9 月 ARR 再加速线索能否被后续数据验证。\u003c/li>\n\u003cli>9 月 9-11 日中国光博会：关注 OCS、光芯片、薄膜铌酸锂、无源光器件四大方向；光迅科技将推出 320×320 端口 OCS，腾景、光库、天孚、炬光等厂商预计带来前沿 OCS 零组件。\u003c/li>\n\u003cli>PCB 材料端验证点：PTFE 方案预计 9-10 月有望落地，六氟化钨 9 月涨价落地情况；高端 ABF 的 T-Glass 短缺制约何时缓解，以及 Kinsus 计划 2027 年将高端 ABF 产能扩大约 25% 的推进节奏。\u003c/li>\n\u003cli>T 链订单连续性：首批约 5k 台订单之后，是否出现更多大订单；供应商产能扩张能否匹配“年底非线性起量”的排产预期。\u003c/li>\n\u003cli>国产算力落地：DeepSeek 采购 16 万颗昇腾 950DT 的报道是否兑现，以及国产 AI 芯片集群的产能投放与订单落地催化。\u003c/li>\n\u0 <script>
