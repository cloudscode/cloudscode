前市场了解到的数据是5到6G瓦，请问这个数值是已经确定的落地计划，还是一个初步的规划值？", "content": "关于明年（2027年）新增的G瓦数规划，此前市场了解到的数据是5到6G瓦，请问这个数值是已经确定的落地计划，还是一个初步的规划值？ 目前这仍属于规划阶段，但该规划已相当接近实际且较为精确。具体来看，明年（2027年）自建的总容量规划已从原先的超过6G瓦下调至约5G瓦。此外，AWS计划通过租赁方式增加约1.8至2G瓦的容量。因此，总计新增容量约为7G瓦，公司认为有能力实现这一目标。 这7G瓦的新增容量是指明年（2027年）规划动工的项目，还是指明年能够实际通电并产生经济效益的落地项目？ 这7G瓦是指明年（2027年）能够最终通电并直接产生经济效益的落地容量。这些数据中心的投资实际上在至少三年前就已经开始，是一个滚动的过程。部分设备，如交付周期在一年以上的设备，可能是在今年（2026年）或更早些时候投入的，而明年主要进行内部其他配套设施的建设。 明年（2027年）7G瓦的落地容量是否意味着资本支出压力巨大？因为这部分容量可能主要使用Rubin架构的GPU，其相关支出可能在今年（2026年）已经支付了大部分，从而减轻明年的现金流压力？ 基建方面的资本开支确实大部分已在前几年投入。至于GPU卡的采购规划，是根据明年（2027年）能够实际上线的容量来制定的。AWS负责交付机柜和卡的部门会依据这7G瓦的目标进行交付规划，确保交付的数据中心容量与此匹配，避免资源闲置或效益不达标。因此，这7G瓦可以理解为能够实际上线的GPU卡的总容量。 市场预期远低于7G瓦，若按此规模，并考虑存储价格上行，单G瓦资本开支可能接近600亿元。请问实际情况是否如此？ 市场估算的单G瓦资本开支可能偏高，因为其测算基础通常是NVIDIA的GPU。AWS的规划主要基于自研的Rubin卡，如果使用Trainium系列产品，单G瓦成本可能只有市场估算的一半左右。在存储方面，AWS已通过签订长期协议来控制成本和价格上限，因此这部分开支并没有那么高。 以NVIDIA的Rubin架构GPU为例，单G瓦的存储价值量（不含GPU本身）可能接近250亿元。请问基于自研的Trainium系列产品，单G瓦的存储价值量大概是多少？ 明年（2027年）上半年上线的主要是Trainium Three，其存储价值量占整个服务器机柜价值的比例约为50%，即存储与服务器的价值大致为1:1。Trainium Four预计要到明年下半年Q3或Q4才会出货。此外，AWS整个机柜的成本也相对更低。 如果基于Trainium系列GPU的单G瓦资本开支约为300亿元，这个数值是否包含了土建和电力等基础设施成本？ 这300亿元的资本开支不完全包含基础设施成本，土建部分是另外计算的。这笔开支可以大致理解为150亿元的Trainium系列GPU卡，加上另外150亿元的存储价值。需要说明的是，AWS计算存储价值时，已将GPU卡本身包含的HBM和DRAM等存储单元的价值剥离出来。 确认一下，基于Trainium系列产品的单G瓦存储价值量约为150亿元，而基于Rubin架构的测算值约为250亿元。请问这150亿元的估算是基于当前Q2的合约价，还是已经考虑了Q3之后的价格上涨预期？ AWS的DRAM采购基本已经通过长期协议锁定，因此价格是依据长协价计算的。对于其他存储容量，AWS会根据对明年（2027年）价格的预期进行测算，但届时预计也会转为长期协议采购。 对于长期采购协议，价格是固定不变的吗？ 价格并非完全恒定，但协议中会设定一个价格上限，实际采购将按照该上限执行，不会超过这个预设的最高价。 单GW算力建设的投资价值量大概是多少？ 如果将训练和推理的硬件全部计算在内，包括GPU和内存等组件，单GW算力建设的总投资额不会超过300亿元。 在明年规划的7 GW增量算力中，Rubin架构GPU的占比大概是多少？ Rubin架构GPU的占比较少。根据规划，明年将采购约100万张英伟达GPU，其中最多一半为Rubin架构，另一半仍为Blackwell架构。与此同时，AWS自研的Trainium芯片采购量将接近300多万片，两者比例约为3.5:1。考虑到Rubin架构GPU的功耗更高，折算成功率后，其在7 GW增量算力中的占比大约为1-2 GW。 对于2028年的资本开支规划以及市场对其可持续性的担忧，公司有何展望？ 2028年的资本开支规划尚未最终定案，因为数据中心的具体排产计划还未完全明确。预计资本开支仍会保持增长，但增幅不会像近两年这么大。关于明年的资本开支，预计不会达到市场预期的3,000亿美元，可能会有所下修，这主要是因为部分组件价格昂贵或供应受限。 对于明年（2027年）计划上线的约7,000万左右的资本开支，将如何分配给Anthropic、OpenAI、自用以及其他客户？ 在总计划中，Anthropic、OpenAI两者合计超过50%。余下的部分，常规的计算机存储（computer storage）将占据30%至40%，其余部分则分配给包括内部电商业务在内的其他客户。 考虑到Anthropic和OpenAI在云业务中资本开支占比较高，如果这两家公司在2027至2028年继续保持高增长，是否意味着公司同期的资本开支也将持续高增长？ 是的，公司与这两家大模型厂商签有长期协议。只要它们的增速不减，公司就会持续保证其增长所需的资源支持。 在除去Anthropic和OpenAI之外的客户中，中小型公司主要使用AI服务还是传统云服务？另外，从业务构成来看，AI业务的算力消耗与收入贡献之间是何种关系？ 中小型客户同时使用AI和传统云服务，呈现混合使用的状态。在业务构成上，算力消耗与收入贡献并不直接挂钩。例如，AI业务可能消耗了超过60%的算力资源，但其产生的收入尚未达到总收入的50%，超过一半的收入仍然来自传统云业务。 剔除Anthropic和OpenAI这类大型模型厂商后，其他中小型企业客户调用AI API所产生的收入，其增速及占比提升情况如何？ 这部分中小型企业客户的AI相关收入增长速度不及两家头部大模型厂商。从AI收入增长的排序来看，今年（2026年）增长最快的是Anthropic和OpenAI；其次是外部的中小型企业；再次是公司内部的其他业务部门，如零售等。这些客户确实在调用AI服务，但其增速相对较慢。 大型模型厂商在AWS平台上主要通过哪些方式使用资源？这些方式与中小型企业有何不同？ 大型模型厂商主要通过两种途径使用AWS资源：一是直接租赁裸金属服务器（bare metal）进行计算，这部分有长期协议支持；二是通过AWS的Bedrock平台向企业级用户销售其模型API，AWS会对此进行抽成，目前的抽成比例接近50%。通过Bedrock平台销售API的模式增长非常迅速，这对AWS而言利润更高，同时也能帮助大模型厂商触达更多使用AWS的企业客户。相比之下，一般的中小型企业主要以租赁裸金属算力为主，较少通过平台销售API。 其他主要云服务厂商明年（2027年）或后年的资本开支计划是怎样的？ 对于具体的吉瓦数规划不甚了解，但对资本开支有所耳闻。Google原先的计划较为激进，其2027年的资本开支预计是最大的，可能比AWS公司要大。Microsoft相对保守，Meta的投入仍然较多，预计在1,600亿至2000亿美元之间。Oracle的规模则小得多，预计不足1,000亿美元。 目前算力资源，特别是用于AI训练的NVIDIA GPU和存储等环节的使用率情况如何？ 目前算力使用率几乎是满负荷状态，尤其是NVIDIA GPU的使用率超过90%，其中用于训练的Trainium芯片使用率也达到了92%。通常认为80%是比较良性的使用率水平。基本上，今年（2026年）采购的设备一经安装便立即处于满负荷运转状态。这种高负载情况主要针对AI相关的工作负载，非AI机柜的使用率则处于正常水平，没有特别高。 对于非AI业务的存量基础设施，未来的建设策略是什么？ 一般不会再新建非AI机柜，主要是进行设备更替。例如，设备使用五年后会进行更换，通常会替换为最新一代的CPU。这种做法旨在提升算力，但机柜数量通常不会再扩张。唯一的例外是在新区域进行建设，例如在墨西哥、巴西等之前没有AWS覆盖的地区新建数据中心。 综合各家云服务商及新兴云厂商的规划，明年（2027年）上线的总吉瓦数可能接近28至30吉瓦，当前的电力、土地和土建等基础设施能否支撑如此大规模的扩张？这些规划是否存在下修的可能？ 目前的规划是比较乐观的估计，虽然已经经历过下修。尤其是在北美或美国地区，大概率会继续下修。公司通常在9月份前制定一个三年度（2027-2029年）规划，但更精确的年度计划会在次年1月份根据届时情况重新制定。到明年（2027年）1月，对于当年能实际获得的吉瓦数将有更清晰的判断。因此，当前规划在未来半年内可能还会缩小。各家在北美的自建数据中心规模可能都在5吉瓦左右，如果无法达到目标，可能会通过增加租赁、电力共享（power share）、主机托管或在海外市场补充等方式来弥补。 在实现明年（2027年）数据中心扩张规划的过程中，最主要的瓶颈环节是什么？ 今年（2026年）最大的瓶颈是芯片供应不足，导致机柜数量不够。但从明年（2027年）开始，主要瓶颈将转变为数据中心的可用性。因为芯片供应通过长期协议和提前预付款等方式，明年的供应量已基本得到保证。然而，数据中心的投资建设是基于早前（如5吉瓦级别）的规划进行的，如果明年的实际需求远超原有规划，数据中心的供应将成为限制因素。 在资源有限的情况下，如何对新到货的芯片进行安装优先级排序？当前供应链的主要瓶颈是机柜还是芯片等其他组件？ 在芯片供应有限时，AWS会进行分批或优先排序安装。例如，当同时有NVIDIA卡、自研的TRAINING卡以及其他类型的卡（如AMD或用于inference的卡）到货时，AWS会优先安装NVIDIA卡，然后是Trainium卡，而其他卡的安装则会暂缓。就2026年而言，核心的瓶颈在于芯片，特别是AWS自研的Trainium卡供应相对紧张，相比之下，NVIDIA卡的供应情况尚可。机柜、网络或存储等其他组件并非当前最主要的制约因素。 考虑到因交付问题导致的功耗规划（吉瓦数）下修对资本市场可能被解读为利空，这是否也意味着鉴于AWS强劲的需求，增长周期实际上被拉长了，呈现出“短空长多”的态势？ 可以这么理解。一旦数据中心的问题在2027至2028年得到解决，或者AWS能够将设施部署到海外，收入仍会上升。总体趋势是需求高于供给，这一状况在2029年之前不太可能改变，只是不同阶段的制约因素不同。2026年的瓶颈主要是芯片、液冷或光模块，而2027年的制约因素将主要是数据中心。 当前是否有明确的信号表明资本开支会因需求减弱而非交付问题被削减？ 2026年至今并未观察到因需求减弱而削减资本开支的迹象。从另一个侧面看，半导体设备供应商（如应用材料）的订单情况非常乐观，其订单量甚至超过了2000年时的水平，这反映了半导体行业的真实需求。这些设备的交付周期很长，例如，现在下的设备订单可能要到2027年才能交付，其产出的晶圆则要到2027年底或2028年才能开始生产。因此，市场对2028年之前的需求基本没有太大疑虑，相关的产能投入，包括台积电的2纳米、3纳米制程以及内存产能，很多都已通过长期合同锁定。这类长期合同通常一签就是五年，为未来的需求提供了一个底线保障。 关于AWS目前3,600亿美元的积压订单，其可被100%执行的比例大概是多少？ 目前积压订单的具体执行比例尚不清楚，这属于销售范畴。不过，在当前供给相对紧张的情况下，AWS会尽力执行所有已签订的合约，这主要是一个时间问题。公司通常不会毁约，除非是客户方面不再需要。公司现在也鼓励客户签订长期合同，并通过价格杠杆等方式尽量减少短期零散订单。只要公司的容量能够跟上，这些积压订单基本上都会被执行。 明年（2027年）规划的7吉瓦新增容量是否已基本被预订完毕？其中AI和传统云业务的构成是怎样的？ 明年7吉瓦新增容量中，用于AI的部分已基本被预订完毕。这7吉瓦的总量中包含了传统云业务，AI部分的增量大约为5吉瓦，不会达到6吉瓦，因为公司的传统云业务体量较大。需要说明的是，除了少数专用的AI数据中心（如为Anthropic项目服务的\"mount project\"和\"renie\"），公司大部分自建的数据中心都是混合工作负载（mix work）模式，同时承载AI和非AI业务。而新增容量中用于传统业务的部分，通常是为了在巴西、墨西哥等新区域进行市场扩张，属于先期投资，客户会后续逐步引入。 对于AI业务中Rubin这类机柜，其单机柜资本开支的体量大约是多少？其中存储部分的成本构成是怎样的？ Rubin这类机柜的资本开支大约在500万美元左右，未达到600万美元。此成本构成中，约一半来自于存储部分，主要包括HBM和DRAM。采购策略上，倾向于从供应商处购买包含核心部件（如GPU、NVLink）的最低配置版本，即减配了部分SoC和DRAM，然后根据自身需求自行添加其余组件，以规避供应商在附加组件上设定的高利润率。 在服务器架构设计上，是否会采用多个（例如两到四个）Rubin机柜共享一个独立的内存机柜（Memory Pooling）的方案？以及NAND存储是部署在柜内还是柜外？ 目前不太倾向于采用大规模内存池化、设置独立内存机柜的方案，主要原因是DRAM成本过高。即使需要此类配置，也倾向于自行组建而非直接采购供应商提供的集成方案，以控制成本。对于NAND存储的部署，虽然柜内也会配置一部分，但基本上以柜外部署为主。 柜外NAND存储的配置比例，例如几个计算柜对应多少存储，是否有具体规划？ 具体的配置方案尚未最终确定。由于Rubin机柜计划于2026年第四季度才正式上线，相关的规划将在明年（2027年）完成。 关于NPU产品，其订单和出货的预期时间节点是怎样的？市场预期的1.5亿只NPU光模块需求是否可能发生变化？ NPU产品与Trainium 4这一代芯片严格绑定，预计Trainium 4在2026年下半年或年底开始出货，因此NPU的真正放量时间点将在2028年。这比市场之前的预期要慢一些，可能会出现一定的延迟。市场对1.5亿只NPU光模块的需求预期也可能因此受到影响。此外，公司计划在2027年开始销售自研芯片，届时将采用不同于现有产品的节奏，可能会以板卡或定制机柜的形式提供给客户，而不仅仅是纯粹的训练或推理芯片。 市场上有观点认为CPO方案因良率和维护成本问题进展较慢，NPU方案在未来一两年内是否会成为更确定的主流技术路线？ CPO方案确实面临良率较低和维护成本高昂的挑战，一旦损坏需要整体更换，这影响了其推广。相较之下，NPU的进展相对更快。 关于存储产品的价格，当前NAND闪存的价格趋势如何？2026年第三季度的价格与第二季度相比有何变化？ NAND价格存在一个长期协议中的上限价格（Ceiling Price），只要市场现货价未触及此上限，则按当前市场价执行。目前尚未触及上限。以折算成ESSD后的单GB价格计算，2026年第三季度的价格大约在0.4至0.5美元之间。与第二季度相比，第三季度NAND价格环比涨幅显著。 DRAM在2026年第三季度的价格走势如何？ DRAM价格已基本趋于平稳，未出现大幅上涨。由于大部分已签订长期供货协议，第三季度的价格基本与第二季度持平，或略有小幅上涨，但远未触及协议的上限价格。部分7月份新签的协议将在第四季度开始执行。目前单价大约在2.3美元左右。 为何NAND闪存不像DRAM那样普遍签订长期供货协议？ 主要原因是供应商预期NAND价格的上涨周期会比DRAM更长。由于当前NAND单价较低，供应商希望通过维持现货交易来更长时间地享受价格上涨带来的收益。签订长期协议会锁定未来（如2027、2028年）的收入上限，这不符合供应商的利益。 关于NAND和DRAM的采购，能否介绍一下明年的合约谈判进展、价格预期以及主要的供应商情况？ 公司70%的SSD是通过采购NAND颗粒（Raw NAND）后自行组装完成。主要的NAND颗粒供应商并非三星、海力士等大厂，而是Micron、Sandisk、Kioxia等规模相对较小的厂商。目前，以Sandisk为代表的供应商普遍预期价格将继续上涨，因此不太愿意立即签订长期合约。尽管如此，预计到2026年Q3或Q4，随着谷歌等行业主要参与者完成签约，其他厂商也会跟进，届时2027年的合约基本会敲定。从价格预期来看，DRAM的合约价格可能在每GB 2.2至2.3美元左右，NAND则在每GB 0.45至0.5美元之间，这一价格水平在可接受范围内，因为不接受则意味着无法获得供应量。 在与存储原厂进行价格谈判时，公司的议价能力如何？尤其是在2027年至2030年的长期协议中，有哪些可以商谈的空间？ 在2027年和2028年的价格谈判中，议价权非常有限，基本处于供应商“不接受就没量”的强势地位。不过，供应商为了锁定2029年和2030年的收入，愿意在谈判中做出一些让步。具体而言，他们愿意牺牲2027-2028年部分潜在的收入上限，以换取在2029-2030年市场可能下行时获得有保障的收入。可谈判的空间主要体现在两个方面：一是2029-2030年的底价（floor price）和采购量；二是预付款问题，供应商希望现在收取一笔预付款，然后在2029-2030年通过返点形式返还。 在长期协议中，2027年和2028年的底价（floor price）是如何设定的？供应商愿意现在谈判长期协议的深层原因是什么？ 长期协议中设定了底价，例如DRAM的底价大约是最高成本（C0）的一半，约为每GB 1美元左右，但市场价格触及此底价的可能性不大。供应商当前愿意积极商谈长期协议，主要是出于对未来市场竞争格局的担忧。他们预见到中国的长鑫存储和长江存储上市后，其新增产能将对整个行业造成巨大冲击。因此，供应商希望通过签订长期协议来提前锁定公司的购买力，以应对2029-2030年可能出现的市场威胁。 在长期协议中，2027年至2030年锁定的采购量占总需求量的比例分别是多少？ 锁定的采购量比例随年份而变化。2027年锁定的量接近总需求量的100%；2028年约为预估需求量的90%，保留了约10%的弹性空间。对于2029年和2030年，由于需求预测不确定性较大，目前仅锁定了预估需求量的70%至80%，保留了20%至30%的灵活采购空间，以便在市场出现更低价格时进行采购。 请问公司对2027年和2028年DRAM、HBM及NAND的需求量增长预期分别是多少？ 2027年，DRAM的需求量预计为1.3至1.5 EB，HBM的需求量约为1.5 EB。对于NAND，2027年的需求增量预计为130 EB。进入2028年，整体需求将呈现微增态势。在已锁定的长期协议中，DRAM和HBM的总量将在2027年的基础上增加约10%至20%，达到3 EB左右（DRAM和HBM各占一半）。需要指出的是，公司预期的实际需求增长速度会快于协议锁定的增长部分。至于2028年NAND的需求量，由于供应商目前商谈意愿不强，尚未形成明确的框架，预计到今年9月会有更清晰的数据。 对于NAND的长期供应，是否存在担忧？ 对NAND的长期供应并不特别担心。首先，NAND的供应商数量较多，目前至少有五家可供选择。其次，长江存储等中国厂商上市后将释放大量产能，这部分产能可以吸收如阿里云等其他用户的需求，从而间接缓解市场供应压力。虽然当前NAND价格上涨较快，但从长期来看，其供应将比DRAM更为充足。主要的挑战可能集中在2027年和2028年，但考虑到NAND本身价格相对便宜，即使价格上涨，总体影响仍在可控范围内。 公司如何看待CXL内存池化技术？该技术是否会对未来的内存采购策略产生影响？ CXL技术内部也经常讨论。这项技术的好处在于能够通过池化增加内存容量并提高利用率。然而，从整体市场角度看，虽然单体利用率提高了，但CXL技术的应用反而可能会促进内存总使用量的增加。 在当前DRAM成本压力下，公司内部是否有考虑采用NAND替代部分DRAM的技术方案？ 目前尚未大规模采用NAND替代DRAM的方案。主要原因是NAND的读写速度远低于DRAM，存在数量级上的差距。虽然NAND可以用于分担一部分存储任务，但无法满足实时运算场景下对DRAM性能的要求。 鉴于上游硬件（如计算卡、存储）成本上涨，AWS客户对价格调整的接受程度如何？ 价格上涨主要影响的是按需实例（散单）用户，而与主要客户签订的长期协议价格并未大幅上涨，具体价格取决于协议期限和使用量。公司不希望大量服务按需实例客户，因为这会导致容量需求的剧烈波动。因此，价格杠杆也被用作一种策略，旨在引导客户转向签订长期协议，以稳定容量规划。 亚马逊推出的AI Agent等新产品，目前是否主要处于尝试阶段，其对零售业务的实际影响如何？ 这些AI产品的推出更多是为了提高内部运营效率，预计对营业收入的增长影响有限。无论是由人工客服还是AI Agent提供导购服务，消费者的购买力是相对固定的，因此不会引起销售额的巨大变化。其主要益处在于提升内部工作效率，可能有助于减少招聘需求或进行人员优化。 面对2026年自由现金流可能转负以及未来发债的可能性，公司内部是如何看待这一资本策略的？ 公司的长期增长逻辑是持续将所获利润全部投入到业务发展中，这一策略也为资本市场（华尔街）所接受。只要有投资者愿意购买债券，这种模式就可以持续。这与微软的策略不同，微软更注重盈利能力，会削减不赚钱的部门，例如对Xbox业务的调整，在硬件发展上非常谨慎，追求高利润增长。而公司的核心是注重增长，利润率是次要考虑因素。 AWS针对Anthropic和OpenAI等大客户的云服务定价策略是怎样的？长期协议中是否包含成本转嫁机制？ 与这两家客户的定价主要包含两种模式。第一种是基于长期协议的算力租赁，协议在2026年初已经签订，涵盖了特定时期、特定数量和类型的计算卡。第二种是在AWS Bedrock平台上销售其模型API时进行的收入分成。当企业客户（如苹果）通过Bedrock调用Anthropic的模型时，AWS会先从客户支付的费用中抽取一定比例（例如，对Anthropic为50%）的收入，然后再进行结算。如果客户在下半年或2027年需要新增当前长期协议之外的NVIDIA计算卡，则需要另行商议新的定价。 现有的长期协议中虽然包含一定的成本转嫁条款，但其调整幅度不足以覆盖当前物料价格的涨幅。不过，通过API销售进行收入分成的模式受成本上涨的影响较小，且利润空间更大。公司和合作伙伴都希望API销售业务能快速增长，因为其主要面向企业客户，这与Anthropic和OpenAI拓展企业市场的目标一致。 从投资回报的角度看，新建一个AI数据中心的ROI水平和资本支出的现金层面大致需要多久可以收回？ 从多年维度看，AI数据中心的投资回报率预计将高于公司当前的整体运营利润率（operating margin），可能达到40%至50%或更高。以API收入分成为例，公司直接从客户收入中抽取高达50%的分成，这部分收益的利润率非常可观。关于资本支出的具体现金回本周期，目前尚未进行精确测算。 对于AI相关的电力消耗规划，2027年的增长似乎有所放缓，主要原因是什么？ 2027年增速放缓的主要瓶颈在于物理层面的限制，例如数据中心的建设速度。为应对这些限制，公司可能会更多地采用自研的、功耗较低的芯片。此外，自研芯片部门计划于2027年独立，届时其部分产能将出售给外部客户，而不再全部由内部消化。 从建设角度来看，当前的工作状态是否非常繁忙？市场对2028年及以后增长放缓的担忧是否普遍？ 当前的工作状态与之前任何一个扩张周期没有本质区别，始终处于非常繁忙的阶段，持续在为数据中心寻找土地和计算卡资源。市场对短期波动的敏感更多是消息层面的反应。对于增长前景，市场普遍认为2029年增速可能会放缓，但对2028年的情况尚不明确，因为当前行业变化速度很 月4日复盘笔记：算力硬件/PCB/算力租赁/AI应用/机器人/CRO/创新药/半导体/液冷/电网设备等一、重磅财经信息①工信部召开光伏行业座谈会，进一步解读宣贯光伏组件强制性国家\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>阿里巴巴正式发布新一代基座大模型Qwen3.8，总参数量2.4万亿；同日DeepSeek V4 Flash完成标准任务平均成本约0.03美元，约为Fable 5的百分之一，大模型成本下探与算力需求叙事并行强化。（来源：07:16 20260803复盘帖；10:27 DeepSeek成本帖）\u003c/li>\n\u003cli>美股云厂大涨验证“投资-回报”闭环：美股七巨头指数创3月31日以来最佳单日表现，谷歌总市值超苹果升至全球第二、亚马逊再创新高；集邦咨询预计2026年全球九大云厂商合计资本支出规模突破8867亿美元，同比增幅接近90%。（来源：07:23 隔夜全球要闻；18:12 周二舆情热度）\u003c/li>\n\u003cli>光互连全面走强：应用光电涨超16%、Lumentum涨超9%、Coherent涨超9%；Lumentum披露InP产能再增50%、1.6T光模块交付第一梯队、CPO已商业化出货；中际旭创获美国资本集团增持275.7万股H股，持仓比例5.06%。（来源：08:18 东吴通信；07:25 兴证通信）\u003c/li>\n\u003cli>电子行业高景气延续：长江电子2026中期策略指出产业链多环节存在供给瓶颈，行业呈供不应求与价格上涨格局；SK海力士与闪迪发布高带宽闪存（HBF）行业首套标准规范。（来源：09:45 长江电子；09:57 SK海力士声明）\u003c/li>\n\u003cli>《新型电力系统建设“十五五”规划》正式发布，是首个专门针对新型电力系统建设的五年规划，2030年核心目标包括总装机54亿kW、非化石能源发电量占比50%。（来源：07:27 长江电新；07:16 股市早报）\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>主线1：AI算力/大模型——CSP商业化闭环与算力资产重估\u003c/h3>\n\u003cul>\n\u003cli>今天强化的逻辑：全球云厂走入健康“投资-回报”闭环；大模型步入利润兑现期，单Token成本迅速下降；云厂在手订单高增，逻辑链提及微软、亚马逊、甲骨文云业务在手订单分别同增110%。（来源：08:35 hcdx；主线逻辑链）\u003c/li>\n\u003cli>今天出现的催化/验证：阿里发布Qwen3.8（2.4万亿参数）；DeepSeek V4 Flash单任务成本约0.03美元；OpenRouter最新一周AI大模型调用量榜单前五全部由中国企业研发；全国首单Token算力工厂科创债落地，无锡高新区发行6亿元专项用于Token算力工厂。（来源：07:16；10:27；15:35；09:49）\u003c/li>\n\u003cli>对应证据来源：AI算力/大模型主线证据包；07:26 东吴计算机；07:24 华泰计算机\u003c/li>\n\u003c/ul>\n\u003ch3>主线2：光通信/CPO——业绩指引走高与上游材料价值重估\u003c/h3>\n\u003cul>\n\u003cli>今天强化的逻辑：800G、1.6T高速光模块进入快速放量阶段，磷化铟（InP）是高速EML激光器、CW激光器等核心器件的重要衬底材料；海外短期内难以形成成熟、高良率的1.6T光模块供应体系。（来源：逻辑链；19:14 光模块产业链帖）\u003c/li>\n\u003cli>今天出现的催化/验证：美股光互联走强；Lumentum披露InP产能再增50%、OCS签下数十亿美元多年期协议、CPO已商业化出货；中际旭创获海外长线资金大幅增持；Coherent专家交流显示通讯业务占总营收75%。（来源：08:18；07:25；附件Coherent专家交流）\u003c/li>\n\u003cli>对应证据来源：光通信/CPO主线证据包；07:16 复盘帖提及英伟达称CPO步入量产阶段\u003c/li>\n\u003c/ul>\n\u003ch3>主线3：半导体/先进封装——存储新层级HBF与供给瓶颈\u003c/h3>\n\u003cul>\n\u003cli>今天强化的逻辑：存储受AI数据中心分级存储架构与推理需求驱动，HBM、DRAM、NAND及HBF技术持续放量；半导体设备
