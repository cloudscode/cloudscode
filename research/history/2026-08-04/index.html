 "content": "【hcdx】资本开支大于现金流很正常，云巨头盈利消解Capex焦虑，迎接ai拐点 全球云厂盈利开启正向循环，半导体及硬件产业迎长线布局良机 从最新财报及产业调研来看，海内外头部云厂走入健康的“投资-回报”闭环。海外方面，2026年Q2亚马逊AWS（营收+37%，利润率39.4%）、谷歌云（营收+82%，利润率35.6%）、微软Azure（营收+32%）；从订单规模看，微软、亚马逊、甲骨文的云业务在手订单分别#同增110%（Azure算力+Office365）、#100%+（AI模型+Trainium芯片等）、#363%（算租），AI放大效应十分显著！国内方面，阿里云Q2 EBITDA提升到11.4%（Q3环比再提升），#大模型ARR年底预期300亿。大模型步入利润兑现期，单Token成本迅速下降 一方面，智谱GLM5.2等模型#单Token算力消耗已大幅下降，带动每月25万亿Token消耗转化为约7亿元收入。当前API售卖毛利率达40%（年底冲刺55%），本地化部署毛利达45%-50%。另一方面，阿里云年内已对GPU及存储#提价10%（预计Q3再涨5%-20%），MaaS业务毛利率从...", "publish_time": "2026-08-04 08:35", "tags": ["同增110%", "100%+", "363%", "大模型ARR年底预期300亿", "文字观点"]}, "post:2026-08-04T10-27:31e867d68752": {"id": "post:2026-08-04T10-27:31e867d68752", "kind": "post", "title": "2026-08-04 10:27", "source_label": "帖子正文", "excerpt": "#DeepSeek再度降低AI使用成本，单项任务成本仅约Fable 5的百分之一 8月3日，Artificial Analysis数据显示，DeepSeek V4 Flash完成一项标准任务的平均成本约为0.03美元，折合人民币约0.2元；Fable 5约为3.15美元，折合人民币约21元，两者相差", "content": "#DeepSeek再度降低AI使用成本，单项任务成本仅约Fable 5的百分之一 8月3日，Artificial Analysis数据显示，DeepSeek V4 Flash完成一项标准任务的平均成本约为0.03美元，折合人民币约0.2元；Fable 5约为3.15美元，折合人民币约21元，两者相差约105倍。API定价方面，DeepSeek V4 Flash每百万输入、输出Token分别为0.14美元和0.28美元，Fable 5分别为10美元和50美元。国产模型成本持续下降，有望降低AI应用门槛，推动推理调用量及算力基础设施需求增长。 【杭钢股份600126】杭钢云+1152P智算+DeepSeek部署适配 1、杭钢云计算数据中心规划机柜9670个，已建成7872个；截至2025年底，累计4104个机柜投入运营，承载服务器29103台。 2、公司投资2.94亿元建设杭钢云高性能智能算力服务项目，规划构建1152P（FP16）智能算力集群，建成后将面向行业AI应用及开发者提供弹性算力服务，目前项目正在推进。 3、公司子公司具备DeepSeek软件部署适配经验。低成本模型有望...", "publish_time": "2026-08-04 10:27", "tags": ["文字观点"]}, "attachment:files/ai中下游买什么.docx": {"id": "attachment:files/ai中下游买什么.docx", "kind": "attachment", "title": "ai中下游买什么", "source_label": "其他", "excerpt": "关于明年（2027年）新增的G瓦数规划，此前市场了解到的数据是5到6G瓦，请问这个数值是已经确定的落地计划，还是一个初步的规划值？目前这仍属于规划阶段，但该规划已相当接近实际且较为精确。", "content": "关于明年（2027年）新增的G瓦数规划，此前市场了解到的数据是5到6G瓦，请问这个数值是已经确定的落地计划，还是一个初步的规划值？ 目前这仍属于规划阶段，但该规划已相当接近实际且较为精确。具体来看，明年（2027年）自建的总容量规划已从原先的超过6G瓦下调至约5G瓦。此外，AWS计划通过租赁方式增加约1.8至2G瓦的容量。因此，总计新增容量约为7G瓦，公司认为有能力实现这一目标。 这7G瓦的新增容量是指明年（2027年）规划动工的项目，还是指明年能够实际通电并产生经济效益的落地项目？ 这7G瓦是指明年（2027年）能够最终通电并直接产生经济效益的落地容量。这些数据中心的投资实际上在至少三年前就已经开始，是一个滚动的过程。部分设备，如交付周期在一年以上的设备，可能是在今年（2026年）或更早些时候投入的，而明年主要进行内部其他配套设施的建设。 明年（2027年）7G瓦的落地容量是否意味着资本支出压力巨大？因为这部分容量可能主要使用Rubin架构的GPU，其相关支出可能在今年（2026年）已经支付了大部分，从而减轻明年的现金流压力？ 基建方面的资本开支确实大部分已在前几年投入。至于GPU卡的采购规划，是根据明年（2027年）能够实际上线的容量来制定的。AWS负责交付机柜和卡的部门会依据这7G瓦的目标进行交付规划，确保交付的数据中心容量与此匹配，避免资源闲置或效益不达标。因此，这7G瓦可以理解为能够实际上线的GPU卡的总容量。 市场预期远低于7G瓦，若按此规模，并考虑存储价格上行，单G瓦资本开支可能接近600亿元。请问实际情况是否如此？ 市场估算的单G瓦资本开支可能偏高，因为其测算基础通常是NVIDIA的GPU。AWS的规划主要基于自研的Rubin卡，如果使用Trainium系列产品，单G瓦成本可能只有市场估算的一半左右。在存储方面，AWS已通过签订长期协议来控制成本和价格上限，因此这部分开支并没有那么高。 以NVIDIA的Rubin架构GPU为例，单G瓦的存储价值量（不含GPU本身）可能接近250亿元。请问基于自研的Trainium系列产品，单G瓦的存储价值量大概是多少？ 明年（2027年）上半年上线的主要是Trainium Three，其存储价值量占整个服务器机柜价值的比例约为50%，即存储与服务器的价值大致为1:1。Trainium Four预计要到明年下半年Q3或Q4才会出货。此外，AWS整个机柜的成本也相对更低。 如果基于Trainium系列GPU的单G瓦资本开支约为300亿元，这个数值是否包含了土建和电力等基础设施成本？ 这300亿元的资本开支不完全包含基础设施成本，土建部分是另外计算的。这笔开支可以大致理解为150亿元的Trainium系列GPU卡，加上另外150亿元的存储价值。需要说明的是，AWS计算存储价值时，已将GPU卡本身包含的HBM和DRAM等存储单元的价值剥离出来。 确认一下，基于Trainium系列产品的单G瓦存储价值量约为150亿元，而基于Rubin架构的测算值约为250亿元。请问这150亿元的估算是基于当前Q2的合约价，还是已经考虑了Q3之后的价格上涨预期？ AWS的DRAM采购基本已经通过长期协议锁定，因此价格是依据长协价计算的。对于其他存储容量，AWS会根据对明年（2027年）价格的预期进行测算，但届时预计也会转为长期协议采购。 对于长期采购协议，价格是固定不变的吗？ 价格并非完全恒定，但协议中会设定一个价格上限，实际采购将按照该上限执行，不会超过这个预设的最高价。 单GW算力建设的投资价值量大概是多少？ 如果将训练和推理的硬件全部计算在内，包括GPU和内存等组件，单GW算力建设的总投资额不会超过300亿元。 在明年规划的7 GW增量算力中，Rubin架构GPU的占比大概是多少？ Rubin架构GPU的占比较少。根据规划，明年将采购约100万张英伟达GPU，其中最多一半为Rubin架构，另一半仍为Blackwell架构。与此同时，AWS自研的Trainium芯片采购量将接近300多万片，两者比例约为3.5:1。考虑到Rubin架构GPU的功耗更高，折算成功率后，其在7 GW增量算力中的占比大约为1-2 GW。 对于2028年的资本开支规划以及市场对其可持续性的担忧，公司有何展望？ 2028年的资本开支规划尚未最终定案，因为数据中心的具体排产计划还未完全明确。预计资本开支仍会保持增长，但增幅不会像近两年这么大。关于明年的资本开支，预计不会达到市场预期的3,000亿美元，可能会有所下修，这主要是因为部分组件价格昂贵或供应受限。 对于明年（2027年）计划上线的约7,000万左右的资本开支，将如何分配给Anthropic、OpenAI、自用以及其他客户？ 在总计划中，Anthropic、OpenAI两者合计超过50%。余下的部分，常规的计算机存储（computer storage）将占据30%至40%，其余部分则分配给包括内部电商业务在内的其他客户。 考虑到Anthropic和OpenAI在云业务中资本开支占比较高，如果这两家公司在2027至2028年继续保持高增长，是否意味着公司同期的资本开支也将持续高增长？ 是的，公司与这两家大模型厂商签有长期协议。只要它们的增速不减，公司就会持续保证其增长所需的资源支持。 在除去Anthropic和OpenAI之外的客户中，中小型公司主要使用AI服务还是传统云服务？另外，从业务构成来看，AI业务的算力消耗与收入贡献之间是何种关系？ 中小型客户同时使用AI和传统云服务，呈现混合使用的状态。在业务构成上，算力消耗与收入贡献并不直接挂钩。例如，AI业务可能消耗了超过60%的算力资源，但其产生的收入尚未达到总收入的50%，超过一半的收入仍然来自传统云业务。 剔除Anthropic和OpenAI这类大型模型厂商后，其他中小型企业客户调用AI API所产生的收入，其增速及占比提升情况如何？ 这部分中小型企业客户的AI相关收入增长速度不及两家头部大模型厂商。从AI收入增长的排序来看，今年（2026年）增长最快的是Anthropic和OpenAI；其次是外部的中小型企业；再次是公司内部的其他业务部门，如零售等。这些客户确实在调用AI服务，但其增速相对较慢。 大型模型厂商在AWS平台上主要通过哪些方式使用资源？这些方式与中小型企业有何不同？ 大型模型厂商主要通过两种途径使用AWS资源：一是直接租赁裸金属服务器（bare metal）进行计算，这部分有长期协议支持；二是通过AWS的Bedrock平台向企业级用户销售其模型API，AWS会对此进行抽成，目前的抽成比例接近50%。通过Bedrock平台销售API的模式增长非常迅速，这对AWS而言利润更高，同时也能帮助大模型厂商触达更多使用AWS的企业客户。相比之下，一般的中小型企业主要以租赁裸金属算力为主，较少通过平台销售API。 其他主要云服务厂商明年（2027年）或后年的资本开支计划是怎样的？ 对于具体的吉瓦数规划不甚了解，但对资本开支有所耳闻。Google原先的计划较为激进，其2027年的资本开支预计是最大的，可能比AWS公司要大。Microsoft相对保守，Meta的投入仍然较多，预计在1,600亿至2000亿美元之间。Oracle的规模则小得多，预计不足1,000亿美元。 目前算力资源，特别是用于AI训练的NVIDIA GPU和存储等环节的使用率情况如何？ 目前算力使用率几乎是满负荷状态，尤其是NVIDIA GPU的使用率超过90%，其中用于训练的Trainium芯片使用率也达到了92%。通常认为80%是比较良性的使用率水平。基本上，今年（2026年）采购的设备一经安装便立即处于满负荷运转状态。这种高负载情况主要针对AI相关的工作负载，非AI机柜的使用率则处于正常水平，没有特别高。 对于非AI业务的存量基础设施，未来的建设策略是什么？ 一般不会再新建非AI机柜，主要是进行设备更替。例如，设备使用五年后会进行更换，通常会替换为最新一代的CPU。这种做法旨在提升算力，但机柜数量通常不会再扩张。唯一的例外是在新区域进行建设，例如在墨西哥、巴西等之前没有AWS覆盖的地区新建数据中心。 综合各家云服务商及新兴云厂商的规划，明年（2027年）上线的总吉瓦数可能接近28至30吉瓦，当前的电力、土地和土建等基础设施能否支撑如此大规模的扩张？这些规划是否存在下修的可能？ 目前的规划是比较乐观的估计，虽然已经经历过下修。尤其是在北美或美国地区，大概率会继续下修。公司通常在9月份前制定一个三年度（2027-2029年）规划，但更精确的年度计划会在次年1月份根据届时情况重新制定。到明年（2027年）1月，对于当年能实际获得的吉瓦数将有更清晰的判断。因此，当前规划在未来半年内可能还会缩小。各家在北美的自建数据中心规模可能都在5吉瓦左右，如果无法达到目标，可能会通过增加租赁、电力共享（power share）、主机托管或在海外市场补充等方式来弥补。 在实现明年（2027年）数据中心扩张规划的过程中，最主要的瓶颈环节是什么？ 今年（2026年）最大的瓶颈是芯片供应不足，导致机柜数量不够。但从明年（2027年）开始，主要瓶颈将转变为数据中心的可用性。因为芯片供应通过长期协议和提前预付款等方式，明年的供应量已基本得到保证。然而，数据中心的投资建设是基于早前（如5吉瓦级别）的规划进行的，如果明年的实际需求远超原有规划，数据中心的供应将成为限制因素。 在资源有限的情况下，如何对新到货的芯片进行安装优先级排序？当前供应链的主要瓶颈是机柜还是芯片等其他组件？ 在芯片供应有限时，AWS会进行分批或优先排序安装。例如，当同时有NVIDIA卡、自研的TRAINING卡以及其他类型的卡（如AMD或用于inference的卡）到货时，AWS会优先安装NVIDIA卡，然后是Trainium卡，而其他卡的安装则会暂缓。就2026年而言，核心的瓶颈在于芯片，特别是AWS自研的Trainium卡供应相对紧张，相比之下，NVIDIA卡的供应情况尚可。机柜、网络或存储等其他组件并非当前最主要的制约因素。 考虑到因交付问题导致的功耗规划（吉瓦数）下修对资本市场可能被解读为利空，这是否也意味着鉴于AWS强劲的需求，增长周期实际上被拉长了，呈现出“短空长多”的态势？ 可以这么理解。一旦数据中心的问题在2027至2028年得到解决，或者AWS能够将设施部署到海外，收入仍会上升。总体趋势是需求高于供给，这一状况在2029年之前不太可能改变，只是不同阶段的制约因素不同。2026年的瓶颈主要是芯片、液冷或光模块，而2027年的制约因素将主要是数据中心。 当前是否有明确的信号表明资本开支会因需求减弱而非交付问题被削减？ 2026年至今并未观察到因需求减弱而削减资本开支的迹象。从另一个侧面看，半导体设备供应商（如应用材料）的订单情况非常乐观，其订单量甚至超过了2000年时的水平，这反映了半导体行业的真实需求。这些设备的交付周期很长，例如，现在下的设备订单可能要到2027年才能交付，其产出的晶圆则要到2027年底或2028年才能开始生产。因此，市场对2028年之前的需求基本没有太大疑虑，相关的产能投入，包括台积电的2纳米、3纳米制程以及内存产能，很多都已通过长期合同锁定。这类长期合同通常一签就是五年，为未来的需求提供了一个底线保障。 关于AWS目前3,600亿美元的积压订单，其可被100%执行的比例大概是多少？ 目前积压订单的具体执行比例尚不清楚，这属于销售范畴。不过，在当前供给相对紧张的情况下，AWS会尽力执行所有已签订的合约，这主要是一个时间问题。公司通常不会毁约，除非是客户方面不再需要。公司现在也鼓励客户签订长期合同，并通过价格杠杆等方式尽量减少短期零散订单。只要公司的容量能够跟上，这些积压订单基本上都会被执行。 明年（2027年）规划的7吉瓦新增容量是否已基本被预订完毕？其中AI和传统云业务的构成是怎样的？ 明年7吉瓦新增容量中，用于AI的部分已基本被预订完毕。这7吉瓦的总量中包含了传统云业务，AI部分的增量大约为5吉瓦，不会达到6吉瓦，因为公司的传统云业务体量较大。需要说明的是，除了少数专用的AI数据中心（如为Anthropic项目服务的\"mount project\"和\"renie\"），公司大部分自建的数据中心都是混合工作负载（mix work）模式，同时承载AI和非AI业务。而新增容量中用于传统业务的部分，通常是为了在巴西、墨西哥等新区域进行市场扩张，属于先期投资，客户会后续逐步引入。 对于AI业务中Rubin这类机柜，其单机柜资本开支的体量大约是多少？其中存储部分的成本构成是怎样的？ Rubin这类机柜的资本开支大约在500万美元左右，未达到600万美元。此成本构成中，约一半来自于存储部分，主要包括HBM和DRAM。采购策略上，倾向于从供应商处购买包含核心部件（如GPU、NVLink）的最低配置版本，即减配了部分SoC和DRAM，然后根据自身需求自行添加其余组件，以规避供应商在附加组件上设定的高利润率。 在服务器架构设计上，是否会采用多个（例如两到四个）Rubin机柜共享一个独立的内存机柜（Memory Pooling）的方案？以及NAND存储是部署在柜内还是柜外？ 目前不太倾向于采用大规模内存池化、设置独立内存机柜的方案，主要原因是DRAM成本过高。即使需要此类配置，也倾向于自行组建而非直接采购供应商提供的集成方案，以控制成本。对于NAND存储的部署，虽然柜内也会配置一部分，但基本上以柜外部署为主。 柜外NAND存储的配置比例，例如几个计算柜对应多少存储，是否有具体规划？ 具体的配置方案尚未最终确定。由于Rubin机柜计划于2026年第四季度才正式上线，相关的规划将在明年（2027年）完成。 关于NPU产品，其订单和出货的预期时间节点是怎样的？市场预期的1.5亿只NPU光模块需求是否可能发生变化？ NPU产品与Trainium 4这一代芯片严格绑定，预计Trainium 4在2026年下半年或年底开始出货，因此NPU的真正放量时间点将在2028年。这比市场之前的预期要慢一些，可能会出现一定的延迟。市场对1.5亿只NPU光模块的需求预期也可能因此受到影响。此外，公司计划在2027年开始销售自研芯片，届时将采用不同于现有产品的节奏，可能会以板卡或定制机柜的形式提供给客户，而不仅仅是纯粹的训练或推理芯片。 市场上有观点认为CPO方案因良率和维护成本问题进展较慢，NPU方案在未来一两年内是否会成为更确定的主流技术路线？ CPO方案确实面临良率较低和维护成本高昂的挑战，一旦损坏需要整体更换，这影响了其推广。相较之下，NPU的进展相对更快。 关于存储产品的价格，当前NAND闪存的价格趋势如何？2026年第三季度的价格与第二季度相比有何变化？ NAND价格存在一个长期协议中的上限价格（Ceiling Price），只要市场现货价未触及此上限，则按当前市场价执行。目前尚未触及上限。以折算成ESSD后的单GB价格计算，2026年第三季度的价格大约在0.4至0.5美元之间。与第二季度相比，第三季度NAND价格环比涨幅显著。 DRAM在2026年第三季度的价格走势如何？ DRAM价格已基本趋于平稳，未出现大幅上涨。由于大部分已签订长期供货协议，第三季度的价格基本与第二季度持平，或略有小幅上涨，但远未触及协议的上限价格。部分7月份新签的协议将在第四季度开始执行。目前单价大约在2.3美元左右。 为何NAND闪存不像DRAM那样普遍签订长期供货协议？ 主要原因是供应商预期NAND价格的上涨周期会比DRAM更长。由于当前NAND单价较低，供应商希望通过维持现货交易来更长时间地享受价格上涨带来的收益。签订长期协议会锁定未来（如2027、2028年）的收入上限，这不符合供应商的利益。 关于NAND和DRAM的采购，能否介绍一下明年的合约谈判进展、价格预期以及主要的供应商情况？ 公司70%的SSD是通过采购NAND颗粒（Raw NAND）后自行组装完成。主要的NAND颗粒供应商并非三星、海力士等大厂，而是Micron、Sandisk、Kioxia等规模相对较小的厂商。目前，以Sandisk为代表的供应商普遍预期价格将继续上涨，因此不太愿意立即签订长期合约。尽管如此，预计到2026年Q3或Q4，随着谷歌等行业主要参与者完成签约，其他厂商也会跟进，届时2027年的合约基本会敲定。从价格预期来看，DRAM的合约价格可能在每GB 2.2至2.3美元左右，NAND则在每GB 0.45至0.5美元之间，这一价格水平在可接受范围内，因为不接受则意味着无法获得供应量。 在与存储原厂进行价格谈判时，公司的议价能力如何？尤其是在2027年至2030年的长期协议中，有哪些可以商谈的空间？ 在2027年和2028年的价格谈判中，议价权非常有限，基本处于供应商“不接受就没量”的强势地位。不过，供应商为了锁定2029年和2030年的收入，愿意在谈判中做出一些让步。具体而言，他们愿意牺牲2027-2028年部分潜在的收入上限，以换取在2029-2030年市场可能下行时获得有保障的收入。可谈判的空间主要体现在两个方面：一是2029-2030年的底价（floor price）和采购量；二是预付款问题，供应商希望现在收取一笔预付款，然后在2029-2030年通过返点形式返还。 在长期协议中，2027年和2028年的底价（floor price）是如何设定的？供应商愿意现在谈判长期协议的深层原因是什么？ 长期协议中设定了底价，例如DRAM的底价大约是最高成本（C0）的一半，约为每GB 1美元左右，但市场价格触及此底价的可能性不大。供应商当前愿意积极商谈长期协议，主要是出于对未来市场竞争格局的担忧。他们预见到中国的长鑫存储和长江存储上市后，其新增产能将对整个行业造成巨大冲击。因此，供应商希望通过签订长期协议来提前锁定公司的购买力，以应对2029-2030年可能出现的市场威胁。 在长期协议中，2027年至2030年锁定的采购量占总需求量的比例分别是多少？ 锁定的采购量比例随年份而变化。2027年锁定的量接近总需求量的100%；2028年约为预估需求量的90%，保留了约10%的弹性空间。对于2029年和2030年，由于需求预测不确定性较大，目前仅锁定了预估需求量的70%至80%，保留了20%至30%的灵活采购空间，以便在市场出现更低价格时进行采购。 请问公司对2027年和2028年DRAM、HBM及NAND的需求量增长预期分别是多少？ 2027年，DRAM的需求量预计为1.3至1.5 EB，HBM的需求量约为1.5 EB。对于NAND，2027年的需求增量预计为130 EB。进入2028年，整体需求将呈现微增态势。在已锁定的长期协议中，DRAM和HBM的总量将在2027年的基础上增加约10%至20%，达到3 EB左右（DRAM和HBM各占一半）。需要指出的是，公司预期的实际需求增长速度会快于协议锁定的增长部分。至于2028年NAND的需求量，由于供应商目前商谈意愿不强，尚未形成明确的框架，预计到今年9月会有更清晰的数据。 对于NAND的长期供应，是否存在担忧？ 对NAND的长期供应并不特别担心。首先，NAND的供应商数量较多，目前至少有五家可供选择。其次，长江存储等中国厂商上市后将释放大量产能，这部分产能可以吸收如阿里云等其他用户的需求，从而间接缓解市场供应压力。虽然当前NAND价格上涨较快，但从长期来看，其供应将比DRAM更为充足。主要的挑战可能集中在2027年和2028年，但考虑到NAND本身价格相对便宜，即使价格上涨，总体影响仍在可控范围内。 公司如何看待CXL内存池化技术？该技术是否会对未来的内存采购策略产生影响？ CXL技术内部也经常讨论。这项技术的好处在于能够通过池化增加内存容量并提高利用率。然而，从整体市场角度看，虽然单体利用率提高了，但CXL技术的应用反而可能会促进内存总使用量的增加。 在当前DRAM成本压力下，公司内部是否有考虑采用NAND替代部分DRAM的技术方案？ 目前尚未大规模采用NAND替代DRAM的方案。主要原因是NAND的读写速度远低于DRAM，存在数量级上的差距。虽然NAND可以用于分担一部分存储任务，但无法满足实时运算场景下对DRAM性能的要求。 鉴于上游硬件（如计算卡、存储）成本上涨，AWS客户对价格调整的接受程度如何？ 价格上涨主要影响的是按需实例（散单）用户，而与主要客户签订的长期协议价格并未大幅上涨，具体价格取决于协议期限和使用量。公司不希望大量服务按需实例客户，因为这会导致容量需求的剧烈波动。因此，价格杠杆也被用作一种策略，旨在引导客户转向签订长期协议，以稳定容量规划。 亚马逊推出的AI Agent等新产品，目前是否主要处于尝试阶段，其对零售业务的实际影响如何？ 这些AI产品的推出更多是为了提高内部运营效率，预计对营业收入的增长影响有限。无论是由人工客服还是AI Agent提供导购服务，消费者的购买力是相对固定的，因此不会引起销售额的巨大变化。其主要益处在于提升内部工作效率，可能有助于减少招聘需求或进行人员优化。 面对2026年自由现金流可能转负以及未来发债的可能性，公司内部是如何看待这一资本策略的？ 公司的长期增长逻辑是持续将所获利润全部投入到业务发展中，这一策略也为资本市场（华尔街）所接受。只要有投资者愿意购买债券，这种模式就可以持续。这与微软的策略不同，微软更注重盈利能力，会削减不赚钱的部门，例如对Xbox业务的调整，在硬件发展上非常谨慎，追求高利润增长。而公司的核心是注重增长，利润率是次要考虑因素。 AWS针对Anthropic和OpenAI等大客户的云服务定价策略是怎样的？长期协议中是否包含成本转嫁机制？ 与这两家客户的定价主要包含两种模式。第一种是基于长期协议的算力租赁，协议在2026年初已经签订，涵盖了特定时期、特定数量和类型的计算卡。第二种是在AWS Bedrock平台上销售其模型API时进行的收入分成。当企业客户（如苹果）通过Bedrock调用Anthropic的模型时，AWS会先从客户支付的费用中抽取一定比例（例如，对Anthropic为50%）的收入，然后再进行结算。如果客户在下半年或2027年需要新增当前长期协议之外的NVIDIA计算卡，则需要另行商议新的定价。 现有的长期协议中虽然包含一定的成本转嫁条款，但其调整幅度不足以覆盖当前物料价格的涨幅。不过，通过API销售进行收入分成的模式受成本上涨的影响较小，且利润空间更大。公司和合作伙伴都希望API销售业务能快速增长，因为其主要面向企业客户，这与Anthropic和OpenAI拓展企业市场的目标一致。 从投资回报的角度看，新建一个AI数据中心的ROI水平和资本支出的现金层面大致需要多久可以收回？ 从多年维度看，AI数据中心的投资回报率预计将高于公司当前的整体运营利润率（operating margin），可能达到40%至50%或更高。以API收入分成为例，公司直接从客户收入中抽取高达50%的分成，这部分收益的利润率非常可观。关于资本支出的具体现金回本周期，目前尚未进行精确测算。 对于AI相关的电力消耗规划，2027年的增长似乎有所放缓，主要原因是什么？ 2027年增速放缓的主要瓶颈在于物理层面的限制，例如数据中心的建设速度。为应对这些限制，公司可能会更多地采用自研的、功耗较低的芯片。此外，自研芯片部门计划于2027年独立，届时其部分产能将出售给外部客户，而不再全部由内部消化。 从建设角度来看，当前的工作状态是否非常繁忙？市场对2028年及以后增长放缓的担忧是否普遍？ 当前的工作状态与之前任何一个扩张周期没有本质区别，始终处于非常繁忙的阶段，持续在为数据中心寻找土地和计算卡资源。市场对短期波动的敏感更多是消息层面的反应。对于增长前景，市场普遍认为2029年增速可能会放缓，但对2028年的情况尚不明确，因为当前行业变化速度很快，预测为时尚早。与其他几大云厂商（如谷歌）交流得到的信息也类似，他们2027年的规划也大致在5到6吉瓦的水平，但普遍认为完全兑现存在较大难度，因为所有厂商的规划总和可能已超过电网和土地等基础设施的实际承载能力。", "status": "extracted"}, "attachment:files/亚马逊专家交流.docx": {"id": "attachment:files/亚马逊专家交流.docx", "kind": "attachment", "title": "亚马逊专家交流", "source_label": "其他", "excerpt": "关于明年（2027年）新增的G瓦数规划，此前市场了解到的数据是5到6G瓦，请问这个数值是已经确定的落地计划，还是一个初步的规划值？目前这仍属于规划阶段，但该规划已相当接近实际且较为精确。", "content": "关于明年（2027年）新增的G瓦数规划，此前市场了解到的数据是5到6G瓦，请问这个数值是已经确定的落地计划，还是一个初步的规划值？ 目前这仍属于规划阶段，但该规划已相当接近实际且较为精确。具体来看，明年（2027年）自建的总容量规划已从原先的超过6G瓦下调至约5G瓦。此外，AWS计划通过租赁方式增加约1.8至2G瓦的容量。因此，总计新增容量约为7G瓦，公司认为有能力实现这一目标。 这7G瓦的新增容量是指明年（2027年）规划动工的项目，还是指明年能够实际通电并产生经济效益的落地项目？ 这7G瓦是指明年（2027年）能够最终通电并直接产生经济效益的落地容量。这些数据中心的投资实际上在至少三年前就已经开始，是一个滚动的过程。部分设备，如交付周期在一年以上的设备，可能是在今年（2026年）或更早些时候投入的，而明年主要进行内部其他配套设施的建设。 明年（2027年）7G瓦的落地容量是否意味着资本支出压力巨大？因为这部分容量可能主要使用Rubin架构的GPU，其相关支出可能在今年（2026年）已经支付了大部分，从而减轻明年的现金流压力？ 基建方面的资本开支确实大部分已在前几年投入。至于GPU卡的采购规划，是根据明年（2027年）能够实际上线的容量来制定的。AWS负责交付机柜和卡的部门会依据这7G瓦的目标进行交付规划，确保交付的数据中心容量与此匹配，避免资源闲置或效益不达标。因此，这7G瓦可以理解为能够实际上线的GPU卡的总容量。 市场预期远低于7G瓦，若按此规模，并考虑存储价格上行，单G瓦资本开支可能接近600亿元。请问实际情况是否如此？ 市场估算的单G瓦资本开支可能偏高，因为其测算基础通常是NVIDIA的GPU。AWS的规划主要基于自研的Rubin卡，如果使用Trainium系列产品，单G瓦成本可能只有市场估算的一半左右。在存储方面，AWS已通过签订长期协议来控制成本和价格上限，因此这部分开支并没有那么高。 以NVIDIA的Rubin架构GPU为例，单G瓦的存储价值量（不含GPU本身）可能接近250亿元。请问基于自研的Trainium系列产品，单G瓦的存储价值量大概是多少？ 明年（2027年）上半年上线的主要是Trainium Three，其存储价值量占整个服务器机柜价值的比例约为50%，即存储与服务器的价值大致为1:1。Trainium Four预计要到明年下半年Q3或Q4才会出货。此外，AWS整个机柜的成本也相对更低。 如果基于Trainium系列GPU的单G瓦资本开支约为300亿元，这个数值是否包含了土建和电力等基础设施成本？ 这300亿元的资本开支不完全包含基础设施成本，土建部分是另外计算的。这笔开支可以大致理解为150亿元的Trainium系列GPU卡，加上另外150亿元的存储价值。需要说明的是，AWS计算存储价值时，已将GPU卡本身包含的HBM和DRAM等存储单元的价值剥离出来。 确认一下，基于Trainium系列产品的单G瓦存储价值量约为150亿元，而基于Rubin架构的测算值约为250亿元。请问这150亿元的估算是基于当前Q2的合约价，还是已经考虑了Q3之后的价格上涨预期？ AWS的DRAM采购基本已经通过长期协议锁定，因此价格是依据长协价计算的。对于其他存储容量，AWS会根据对明年（2027年）价格的预期进行测算，但届时预计也会转为长期协议采购。 对于长期采购协议，价格是固定不变的吗？ 价格并非完全恒定，但协议中会设定一个价格上限，实际采购将按照该上限执行，不会超过这个预设的最高价。 单GW算力建设的投资价值量大概是多少？ 如果将训练和推理的硬件全部计算在内，包括GPU和内存等组件，单GW算力建设的总投资额不会超过300亿元。 在明年规划的7 GW增量算力中，Rubin架构GPU的占比大概是多少？ Rubin架构GPU的占比较少。根据规划，明年将采购约100万张英伟达GPU，其中最多一半为Rubin架构，另一半仍为Blackwell架构。与此同时，AWS自研的Trainium芯片采购量将接近300多万片，两者比例约为3.5:1。考虑到Rubin架构GPU的功耗更高，折算成功率后，其在7 GW增量算力中的占比大约为1-2 GW。 对于2028年的资本开支规划以及市场对其可持续性的担忧，公司有何展望？ 2028年的资本开支规划尚未最终定案，因为数据中心的具体排产计划还未完全明确。预计资本开支仍会保持增长，但增幅不会像近两年这么大。关于明年的资本开支，预计不会达到市场预期的3,000亿美元，可能会有所下修，这主要是因为部分组件价格昂贵或供应受限。 对于明年（2027年）计划上线的约7,000万左右的资本开支，将如何分配给Anthropic、OpenAI、自用以及其他客户？ 在总计划中，Anthropic、OpenAI两者合计超过50%。余下的部分，常规的计算机存储（computer storage）将占据30%至40%，其余部分则分配给包括内部电商业务在内的其他客户。 考虑到Anthropic和OpenAI在云业务中资本开支占比较高，如果这两家公司在2027至2028年继续保持高增长，是否意味着公司同期的资本开支也将持续高增长？ 是的，公司与这两家大模型厂商签有长期协议。只要它们的增速不减，公司就会持续保证其增长所需的资源支持。 在除去Anthropic和OpenAI之外的客户中，中小型公司主要使用AI服务还是传统云服务？另外，从业务构成来看，AI业务的算力消耗与收入贡献之间是何种关系？ 中小型客户同时使用AI和传统云服务，呈现混合使用的状态。在业务构成上，算力消耗与收入贡献并不直接挂钩。例如，AI业务可能消耗了超过60%的算力资源，但其产生的收入尚未达到总收入的50%，超过一半的收入仍然来自传统云业务。 剔除Anthropic和OpenAI这类大型模型厂商后，其他中小型企业客户调用AI API所产生的收入，其增速及占比提升情况如何？ 这部分中小型企业客户的AI相关收入增长速度不及两家头部大模型厂商。从AI收入增长的排序来看，今年（2026年）增长最快的是Anthropic和OpenAI；其次是外部的中小型企业；再次是公司内部的其他业务部门，如零售等。这些客户确实在调用AI服务，但其增速相对较慢。 大型模型厂商在AWS平台上主要通过哪些方式使用资源？这些方式与中小型企业有何不同？ 大型模型厂商主要通过两种途径使用AWS资源：一是直接租赁裸金属服务器（bare metal）进行计算，这部分有长期协议支持；二是通过AWS的Bedrock平台向企业级用户销售其模型API，AWS会对此进行抽成，目前的抽成比例接近50%。通过Bedrock平台销售API的模式增长非常迅速，这对AWS而言利润更高，同时也能帮助大模型厂商触达更多使用AWS的企业客户。相比之下，一般的中小型企业主要以租赁裸金属算力为主，较少通过平台销售API。 其他主要云服务厂商明年（2027年）或后年的资本开支计划是怎样的？ 对于具体的吉瓦数规划不甚了解，但对资本开支有所耳闻。Google原先的计划较为激进，其2027年的资本开支预计是最大的，可能比AWS公司要大。Microsoft相对保守，Meta的投入仍然较多，预计在1,600亿至2000亿美元之间。Oracle的规模则小得多，预计不足1,000亿美元。 目前算力资源，特别是用于AI训练的NVIDIA GPU和存储等环节的使用率情况如何？ 目前算力使用率几乎是满负荷状态，尤其是NVIDIA GPU的使用率超过90%，其中用于训练的Trainium芯片使用率也达到了92%。通常认为80%是比较良性的使用率水平。基本上，今年（2026年）采购的设备一经安装便立即处于满负荷运转状态。这种高负载情况主要针对AI相关的工作负载，非AI机柜的使用率则处于正常水平，没有特别高。 对于非AI业务的存量基础设施，未来的建设策略是什么？ 一般不会再新建非AI机柜，主要是进行设备更替。例如，设备使用五年后会进行更换，通常会替换为最新一代的CPU。这种做法旨在提升算力，但机柜数量通常不会再扩张。唯一的例外是在新区域进行建设，例如在墨西哥、巴西等之前没有AWS覆盖的地区新建数据中心。 综合各家云服务商及新兴云厂商的规划，明年（2027年）上线的总吉瓦数可能接近28至30吉瓦，当前的电力、土地和土建等基础设施能否支撑如此大规模的扩张？这些规划是否存在下修的可能？ 目前的规划是比较乐观的估计，虽然已经经历过下修。尤其是在北美或美国地区，大概率会继续下修。公司通常在9月份前制定一个三年度（2027-2029年）规划，但更精确的年度计划会在次年1月份根据届时情况重新制定。到明年（2027年）1月，对于当年能实际获得的吉瓦数将有更清晰的判断。因此，当前规划在未来半年内可能还会缩小。各家在北美的自建数据中心规模可能都在5吉瓦左右，如果无法达到目标，可能会通过增加租赁、电力共享（power share）、主机托管或在海外市场补充等方式来弥补。 在实现明年（2027年）数据中心扩张规划的过程中，最主要的瓶颈环节是什么？ 今年（2026年）最大的瓶颈是芯片供应不足，导致机柜数量不够。但从明年（2027年）开始，主要瓶颈将转变为数据中心的可用性。因为芯片供应通过长期协议和提前预付款等方式，明年的供应量已基本得到保证。然而，数据中心的投资建设是基于早前（如5吉瓦级别）的规划进行的，如果明年的实际需求远超原有规划，数据中心的供应将成为限制因素。 在资源有限的情况下，如何对新到货的芯片进行安装优先级排序？当前供应链的主要瓶颈是机柜还是芯片等其他组件？ 在芯片供应有限时，AWS会进行分批或优先排序安装。例如，当同时有NVIDIA卡、自研的TRAINING卡以及其他类型的卡（如AMD或用于inference的卡）到货时，AWS会优先安装NVIDIA卡，然后是Trainium卡，而其他卡的安装则会暂缓。就2026年而言，核心的瓶颈在于芯片，特别是AWS自研的Trainium卡供应相对紧张，相比之下，NVIDIA卡的供应情况尚可。机柜、网络或存储等其他组件并非当前最主要的制约因素。 考虑到因交付问题导致的功耗规划（吉瓦数）下修对资本市场可能被解读为利空，这是否也意味着鉴于AWS强劲的需求，增长周期实际上被拉长了，呈现出“短空长多”的态势？ 可以这么理解。一旦数据中心的问题在2027至2028年得到解决，或者AWS能够将设施部署到海外，收入仍会上升。总体趋势是需求高于供给，这一状况在2029年之前不太可能改变，只是不同阶段的制约因素不同。2026年的瓶颈主要是芯片、液冷或光模块，而2027年的制约因素将主要是数据中心。 当前是否有明确的信号表明资本开支会因需求减弱而非交付问题被削减？ 2026年至今并未观察到因需求减弱而削减资本开支的迹象。从另一个侧面看，半导体设备供应商（如应用材料）的订单情况非常乐观，其订单量甚至超过了2000年时的水平，这反映了半导体行业的真实需求。这些设备的交付周期很长，例如，现在下的设备订单可能要到2027年才能交付，其产出的晶圆则要到2027年底或2028年才能开始生产。因此，市场对2028年之前的需求基本没有太大疑虑，相关的产能投入，包括台积电的2纳米、3纳米制程以及内存产能，很多都已通过长期合同锁定。这类长期合同通常一签就是五年，为未来的需求提供了一个底线保障。 关于AWS目前3,600亿美元的积压订单，其可被100%执行的比例大概是多少？ 目前积压订单的具体执行比例尚不清楚，这属于销售范畴。不过，在当前供给相对紧张的情况下，AWS会尽力执行所有已签订的合约，这主要是一个时间问题。公司通常不会毁约，除非是客户方面不再需要。公司现在也鼓励客户签订长期合同，并通过价格杠杆等方式尽量减少短期零散订单。只要公司的容量能够跟上，这些积压订单基本上都会被执行。 明年（2027年）规划的7吉瓦新增容量是否已基本被预订完毕？其中AI和传统云业务的构成是怎样的？ 明年7吉瓦新增容量中，用于AI的部分已基本被预订完毕。这7吉瓦的总量中包含了传统云业务，AI部分的增量大约为5吉瓦，不会达到6吉瓦，因为公司的传统云业务体量较大。需要说明的是，除了少数专用的AI数据中心（如为Anthropic项目服务的\"mount project\"和\"renie\"），公司大部分自建的数据中心都是混合工作负载（mix work）模式，同时承载AI和非AI业务。而新增容量中用于传统业务的部分，通常是为了在巴西、墨西哥等新区域进行市场扩张，属于先期投资，客户会后续逐步引入。 对于AI业务中Rubin这类机柜，其单机柜资本开支的体量大约是多少？其中存储部分的成本构成是怎样的？ Rubin这类机柜的资本开支大约在500万美元左右，未达到600万美元。此成本构成中，约一半来自于存储部分，主要包括HBM和DRAM。采购策略上，倾向于从供应商处购买包含核心部件（如GPU、NVLink）的最低配置版本，即减配了部分SoC和DRAM，然后根据自身需求自行添加其余组件，以规避供应商在附加组件上设定的高利润率。 在服务器架构设计上，是否会采用多个（例如两到四个）Rubin机柜共享一个独立的内存机柜（Memory Pooling）的方案？以及NAND存储是部署在柜内还是柜外？ 目前不太倾向于采用大规模内存池化、设置独立内存机柜的方案，主要原因是DRAM成本过高。即使需要此类配置，也倾向于自行组建而非直接采购供应商提供的集成方案，以控制成本。对于NAND存储的部署，虽然柜内也会配置一部分，但基本上以柜外部署为主。 柜外NAND存储的配置比例，例如几个计算柜对应多少存储，是否有具体规划？ 具体的配置方案尚未最终确定。由于Rubin机柜计划于2026年第四季度才正式上线，相关的规划将在明年（2027年）完成。 关于NPU产品，其订单和出货的预期时间节点是怎样的？市场预期的1.5亿只NPU光模块需求是否可能发生变化？ NPU产品与Trainium 4这一代芯片严格绑定，预计Trainium 4在2026年下半年或年底开始出货，因此NPU的真正放量时间点将在2028年。这比市场之前的预期要慢一些，可能会出现一定的延迟。市场对1.5亿只NPU光模块的需求预期也可能因此受到影响。此外，公司计划在2027年开始销售自研芯片，届时将采用不同于现有产品的节奏，可能会以板卡或定制机柜的形式提供给客户，而不仅仅是纯粹的训练或推理芯片。 市场上有观点认为CPO方案因良率和维护成本问题进展较慢，NPU方案在未来一两年内是否会成为更确定的主流技术路线？ CPO方案确实面临良率较低和维护成本高昂的挑战，一旦损坏需要整体更换，这影响了其推广。相较之下，NPU的进展相对更快。 关于存储产品的价格，当前NAND闪存的价格趋势如何？2026年第三季度的价格与第二季度相比有何变化？ NAND价格存在一个长期协议中的上限价格（Ceiling Price），只要市场现货价未触及此上限，则按当前市场价执行。目前尚未触及上限。以折算成ESSD后的单GB价格计算，2026年第三季度的价格大约在0.4至0.5美元之间。与第二季度相比，第三季度NAND价格环比涨幅显著。 DRAM在2026年第三季度的价格走势如何？ DRAM价格已基本趋于平稳，未出现大幅上涨。由于大部分已签订长期供货协议，第三季度的价格基本与第二季度持平，或略有小幅上涨，但远未触及协议的上限价格。部分7月份新签的协议将在第四季度开始执行。目前单价大约在2.3美元左右。 为何NAND闪存不像DRAM那样普遍签订长期供货协议？ 主要原因是供应商预期NAND价格的上涨周期会比DRAM更长。由于当前NAND单价较低，供应商希望通过维持现货交易来更长时间地享受价格上涨带来的收益。签订长期协议会锁定未来（如2027、2028年）的收入上限，这不符合供应商的利益。 关于NAND和DRAM的采购，能否介绍一下明年的合约谈判进展、价格预期以及主要的供应商情况？ 公司70%的SSD是通过采购NAND颗粒（Raw NAND）后自行组装完成。主要的NAND颗粒供应商并非三星、海力士等大厂，而是Micron、Sandisk、Kioxia等规模相对较小的厂商。目前，以Sandisk为代表的供应商普遍预期价格将继续上涨，因此不太愿意立即签订长期合约。尽管如此，预计到2026年Q3或Q4，随着谷歌等行业主要参与者完成签约，其他厂商也会跟进，届时2027年的合约基本会敲定。从价格预期来看，DRAM的合约价格可能在每GB 2.2至2.3美元左右，NAND则在每GB 0.45至0.5美元之间，这一价格水平在可接受范围内，因为不接受则意味着无法获得供应量。 在与存储原厂进行价格谈判时，公司的议价能力如何？尤其是在2027年至2030年的长期协议中，有哪些可以商谈的空间？ 在2027年和2028年的价格谈判中，议价权非常有限，基本处于供应商“不接受就没量”的强势地位。不过，供应商为了锁定2029年和2030年的收入，愿意在谈判中做出一些让步。具体而言，他们愿意牺牲2027-2028年部分潜在的收入上限，以换取在2029-2030年市场可能下行时获得有保障的收入。可谈判的空间主要体现在两个方面：一是2029-2030年的底价（floor price）和采购量；二是预付款问题，供应商希望现在收取一笔预付款，然后在2029-2030年通过返点形式返还。 在长期协议中，2027年和2028年的底价（floor price）是如何设定的？供应商愿意现在谈判长期协议的深层原因是什么？ 长期协议中设定了底价，例如DRAM的底价大约是最高成本（C0）的一半，约为每GB 1美元左右，但市场价格触及此底价的可能性不大。供应商当前愿意积极商谈长期协议，主要是出于对未来市场竞争格局的担忧。他们预见到中国的长鑫存储和长江存储上市后，其新增产能将对整个行业造成巨大冲击。因此，供应商希望通过签订长期协议来提前锁定公司的购买力，以应对2029-2030年可能出现的市场威胁。 在长期协议中，2027年至2030年锁定的采购量占总需求量的比例分别是多少？ 锁定的采购量比例随年份而变化。2027年锁定的量接近总需求量的100%；2028年约为预估需求量的90%，保留了约10%的弹性空间。对于2029年和2030年，由于需求预测不确定性较大，目前仅锁定了预估需求量的70%至80%，保留了20%至30%的灵活采购空间，以便在市场出现更低价格时进行采购。 请问公司对2027年和2028年DRAM、HBM及NAND的需求量增长预期分别是多少？ 2027年，DRAM的需求量预计为1.3至1.5 EB，HBM的需求量约为1.5 EB。对于NAND，2027年的需求增量预计为130 EB。进入2028年，整体需求将呈现微增态势。在已锁定的长期协议中，DRAM和HBM的总量将在2027年的基础上增加约10%至20%，达到3 EB左右（DRAM和HBM各占一半）。需要指出的是，公司预期的实际需求增长速度会快于协议锁定的增长部分。至于2028年NAND的需求量，由于供应商目前商谈意愿不强，尚未形成明确的框架，预计到今年9月会有更清晰的数据。 对于NAND的长期供应，是否存在担忧？ 对NAND的长期供应并不特别担心。首先，NAND的供应商数量较多，目前至少有五家可供选择。其次，长江存储等中国厂商上市后将释放大量产能，这部分产能可以吸收如阿里云等其他用户的需求，从而间接缓解市场供应压力。虽然当前NAND价格上涨较快，但从长期来看，其供应将比DRAM更为充足。主要的挑战可能集中在2027年和2028年，但考虑到NAND本身价格相对便宜，即使价格上涨，总体影响仍在可控范围内。 公司如何看待CXL内存池化技术？该技术是否会对未来的内存采购策略产生影响？ CXL技术内部也经常讨论。这项技术的好处在于能够通过池化增加内存容量并提高利用率。然而，从整体市场角度看，虽然单体利用率提高了，但CXL技术的应用反而可能会促进内存总使用量的增加。 在当前DRAM成本压力下，公司内部是否有考虑采用NAND替代部分DRAM的技术方案？ 目前尚未大规模采用NAND替代DRAM的方案。主要原因是NAND的读写速度远低于DRAM，存在数量级上的差距。虽然NAND可以用于分担一部分存储任务，但无法满足实时运算场景下对DRAM性能的要求。 鉴于上游硬件（如计算卡、存储）成本上涨，AWS客户对价格调整的接受程度如何？ 价格上涨主要影响的是按需实例（散单）用户，而与主要客户签订的长期协议价格并未大幅上涨，具体价格取决于协议期限和使用量。公司不希望大量服务按需实例客户，因为这会导致容量需求的剧烈波动。因此，价格杠杆也被用作一种策略，旨在引导客户转向签订长期协议，以稳定容量规划。 亚马逊推出的AI Agent等新产品，目前是否主要处于尝试阶段，其对零售业务的实际影响如何？ 这些AI产品的推出更多是为了提高内部运营效率，预计对营业收入的增长影响有限。无论是由人工客服还是AI Agent提供导购服务，消费者的购买力是相对固定的，因此不会引起销售额的巨大变化。其主要益处在于提升内部工作效率，可能有助于减少招聘需求或进行人员优化。 面对2026年自由现金流可能转负以及未来发债的可能性，公司内部是如何看待这一资本策略的？ 公司的长期增长逻辑是持续将所获利润全部投入到业务发展中，这一策略也为资本市场（华尔街）所接受。只要有投资者愿意购买债券，这种模式就可以持续。这与微软的策略不同，微软更注重盈利能力，会削减不赚钱的部门，例如对Xbox业务的调整，在硬件发展上非常谨慎，追求高利润增长。而公司的核心是注重增长，利润率是次要考虑因素。 AWS针对Anthropic和OpenAI等大客户的云服务定价策略是怎样的？长期协议中是否包含成本转嫁机制？ 与这两家客户的定价主要包含两种模式。第一种是基于长期协议的算力租赁，协议在2026年初已经签订，涵盖了特定时期、特定数量和类型的计算卡。第二种是在AWS Bedrock平台上销售其模型API时进行的收入分成。当企业客户（如苹果）通过Bedrock调用Anthropic的模型时，AWS会先从客户支付的费用中抽取一定比例（例如，对Anthropic为50%）的收入，然后再进行结算。如果客户在下半年或2027年需要新增当前长期协议之外的NVIDIA计算卡，则需要另行商议新的定价。 现有的长期协议中虽然包含一定的成本转嫁条款，但其调整幅度不足以覆盖当前物料价格的涨幅。不过，通过API销售进行收入分成的模式受成本上涨的影响较小，且利润空间更大。公司和合作伙伴都希望API销售业务能快速增长，因为其主要面向企业客户，这与Anthropic和OpenAI拓展企业市场的目标一致。 从投资回报的角度看，新建一个AI数据中心的ROI水平和资本支出的现金层面大致需要多久可以收回？ 从多年维度看，AI数据中心的投资回报率预计将高于公司当前的整体运营利润率（operating margin），可能达到40%至50%或更高。以API收入分成为例，公司直接从客户收入中抽取高达50%的分成，这部分收益的利润率非常可观。关于资本支出的具体现金回本周期，目前尚未进行精确测算。 对于AI相关的电力消耗规划，2027年的增长似乎有所放缓，主要原因是什么？ 2027年增速放缓的主要瓶颈在于物理层面的限制，例如数据中心的建设速度。为应对这些限制，公司可能会更多地采用自研的、功耗较低的芯片。此外，自研芯片部门计划于2027年独立，届时其部分产能将出售给外部客户，而不再全部由内部消化。 从建设角度来看，当前的工作状态是否非常繁忙？市场对2028年及以后增长放缓的担忧是否普遍？ 当前的工作状态与之前任何一个扩张周期没有本质区别，始终处于非常繁忙的阶段，持续在为数据中心寻找土地和计算卡资源。市场对短期波动的敏感更多是消息层面的反应。对于增长前景，市场普遍认为2029年增速可能会放缓，但对2028年的情况尚不明确，因为当前行业变化速度很快，预测为时尚早。与其他几大云厂商（如谷歌）交流得到的信息也类似，他们2027年的规划也大致在5到6吉瓦的水平，但普遍认为完全兑现存在较大难度，因为所有厂商的规划总和可能已超过电网和土地等基础设施的实际承载能力。", "status": "extracted"}, "post:2026-08-04T09-45:672c79a1df91": {"id": "post:2026-08-04T09-45:672c79a1df91", "kind": "post", "title": "2026-08-04 09:45", "source_label": "帖子正文", "excerpt": "【长江电子杨洋团队】电子行业2026年中期投资策略：拥抱产业趋势，电子行业高景气方向持续演绎 AI发展浪潮下，电子硬件需求迎来快速扩张，产业链多环节仍存在供给瓶颈，多级供应链备货体系进一步放大供给缺口，行业呈现供不应求与价格上涨格局。展望未来半年到一年，电子板块沿产业趋势配置机会丰富：存储受AI数据", "content": "【长江电子杨洋团队】电子行业2026年中期投资策略：拥抱产业趋势，电子行业高景气方向持续演绎 AI发展浪潮下，电子硬件需求迎来快速扩张，产业链多环节仍存在供给瓶颈，多级供应链备货体系进一步放大供给缺口，行业呈现供不应求与价格上涨格局。展望未来半年到一年，电子板块沿产业趋势配置机会丰富：存储受AI数据中心分级存储架构与推理需求驱动，HBM、DRAM、NAND及HBF技术持续放量；PCB&CCL受算力需求、正交背板、高速材料升级与涨价周期推动；半导体设备材料、晶圆制造和先进封装受长周期扩产和先进制程演进支撑；消费电子、面板、元器件等环节围绕AI主线和技术创新，亦有望迎来新成长曲线。#文字观点", "publish_time": "2026-08-04 09:45", "tags": ["文字观点"]}, "post:2026-08-04T09-57:08505d5decc6": {"id": "post:2026-08-04T09-57:08505d5decc6", "kind": "post", "title": "2026-08-04 09:57", "source_label": "帖子正文", "excerpt": "SK海力士发布声明称，SK海力士与闪迪推出高带宽闪存(HBF)的行业首套标准规范，HBF属于下一代存储技术。两家企业组建联盟约六个月后达成这一里程碑进展。", "content": "SK海力士发布声明称，SK海力士与闪迪推出高带宽闪存(HBF)的行业首套标准规范，HBF属于下一代存储技术。两家企业组建联盟约六个月后达成这一里程碑进展。谷歌与Tenstorrent同样加入该HBF联盟。HBF是介于高带宽内存(HBM)与固态硬盘之间的新型存储层级；该技术兼具接近HBM的高速数据传输能力，同时依托NAND闪存技术实现存储容量大幅扩容。 快克智能，公司TCB热压键合设备目前针对HBM堆叠工艺进行开发，未来可根据HBF具体应用进行设备迭代。 鸿利智汇，公司HBF产品已经通过了部分客户的可靠性测试，目前正在推广。 飞凯材料，公司有生产应用于半导体先进封装领域的功能型湿电子化学品、锡球和EMC环氧塑封料，其均可应用于HBF和HBM的制造工艺当中，目前已实现稳定量产。 圣泉集团，公司已配合产业链完成多款HBM和HBF材料的国产化开发，如萘酚型环氧树脂及特殊的固化剂等。 壹石通，公司的高端芯片封装用Low-α球形氧化铝产品适用于全场景的封装，可用于HBF封装。#文字观点", "publish_time": "2026-08-04 09:57", "tags": ["文字观点"]}, "post:2026-08-04T14-25:493865cdb87e": {"id": "post:2026-08-04T14-25:493865cdb87e", "kind": "post", "title": "2026-08-04 14:25", "source_label": "帖子正文", "excerpt": "【华创AI新材料&大化工】艾森股份：更新可转债方案，募资5.14亿元加码高端电子化学品产能艾森股份公告，根据2025年年度股东会授权，第三届董事会第二十五次会议审议通过《关于调整公司向不特定对象发行可转换公司债券方案的议案》等6项议案。本次调整将可转债募集资金总额由不超过5.24亿元调减至不超过5.", "content": "【华创AI新材料&大化工】艾森股份：更新可转债方案，募资5.14亿元加码高端电子化学品产能艾森股份公告，根据2025年年度股东会授权，第三届董事会第二十五次会议审议通过《关于调整公司向不特定对象发行可转换公司债券方案的议案》等6项议案。本次调整将可转债募集资金总额由不超过5.24亿元调减至不超过5.14亿元，主投项目金额保持4.74亿元不变、补充流动资金由5,000万元调减至4,000万元；募投项目名称由\"集成电路材料华东制造基地一期项目\"变更为\"电子制造关键材料华东研发和制造基地项目（一期）\"。AI芯片、HBM（高带宽存储）、CPO（共封装光学）等先进封装技术驱动半导体材料需求结构性扩张。HBM从8层向12层、16层演进，堆叠层数每翻一番光刻工艺次数大致翻倍，光刻胶及配套试剂需求呈超线性扩张。当前高端光刻胶自给率不足5%、光刻胶配套树脂自给率不足10%、超纯电子化学品对外依存度超70%，\"卡脖子\"风险突出。国家集成电路产业投资基金三期500亿元定向支持\"材料-设备-晶圆厂\"联合研发，高端电子化学品国产替代有望进入加速期。本次募投项目\"电子制造关键材料华东研发和制造基地项目（一期）\"由...", "publish_time": "2026-08-04 14:25", "tags": ["文字观点"]}, "attachment:files/中信建投-机械设备行业周观点：宇树IPO顺利推进看好机器人板块后续进展，半导体设备关注涨价及出海-260803.pdf": {"id": "attachment:files/中信建投-机械设备行业周观点：宇树IPO顺利推进看好机器人板块后续进展，半导体设备关注涨价及出海-260803.pdf", "kind": "attachment", "title": "中信建投-机械设备行业周观点：宇树IPO顺利推进看好机器人板块后续进展，半导体设备关注涨价及出海-260803", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业动态 周观点：宇树IPO顺利推进看好机器人板块 后续进展，半导体设备关注涨价及出海 核心观点 （1）人形机器人：谷歌DeepMind发布全新机器人模型，宇树 IPO渐行渐近，特斯拉人形机器人迈向量产， 板块催化不断。 （2）AIDC发电设备：需求高景气与产能扩张共振，供需缺口 延续，坚定看好国产燃机出 海。（3）工程机械：6月挖机内外 销继续超预期，低位坚定布局。 （4）半导体设备：全球半导体 设备进入大周期，关注 去日化+出海。（5）锂电设备：固态电 池产业化全链推进，中试验证与设备订单双轨并行。 行业动态信息 人形机器人：谷歌发布全新机器人模型，宇树 IPO渐行渐近。 谷歌DeepMind发布全新机器人模型，机器人 大脑能力持续提 升，有望助力其在终端场景加速落地；宇树 IPO确定询价日， 上市进程渐行渐近；特斯拉Optimus迈向量产，供应链反馈积 极，板块多重催化共振。物理 AI是人工智能的下一波浪潮，机 器人是AI最好的物理载体之一，产业发展趋势明确。头部厂商 积极推进人形机器人在工业、商业等场景下的应用；随着机器 人泛化水平提高，预计其落地场景将进一步扩大， 2026年有望 成为人形机器人垂类应用大年。 V3发布及量产、国产机器人新 品发布、机器人公司 IPO推进、应用落地持续为板块行情带来 催化，建议聚焦优质环节。 AIDC发电设备：需求高景气与产能扩张共振，供需缺口延续， 坚定看好国产燃机出海。 需求端：贝克休斯获得 76台NovaLT16 工业燃气轮机订单，总发电能力约 1.3GW，主要用于北美数据中 心及油气领域的快速部署电源； AEP二季度新增锁定约3GW燃 气轮机资源，累计已锁定约 13GW，并在评估2035年前另外获得 10GW燃机资源的可能性。供给端：贝克休斯 2026Q2业绩会宣 布进一步扩充产能，燃机产能到 2028年末将较2026年翻倍，动 力系统业务新增产能到位后可支 持50亿美元的年产能，其中燃 机约占一半。此外，微软、亚马逊继续上调 AI基础设施投入，行 业终端需求尚未出现降温。我们的观点：本周需求端仍然保持高 景气，海外CSP厂商上调资本开支计划，贝克休斯获得超 1GW 燃机订单。供给端GEV、贝克休斯持续上调扩产计划，行业供需 缺口仍然较大。国产燃机产业链正凭借交付能力以及高性价比优 势加快拓展海外市场，坚定看好国产燃机出海 。 维持 强于大市 许光坦 xuguangtan@csc.com.cn SAC 编号:S1440523060002 SFC 编号:BWS812 陈宣霖 chenxuanlin@csc.com.cn SAC 编号:S1440524070007 籍星博 jixingbo@csc.com.cn SAC 编号:S1440524070001 吴雨瑄 wuyuxuan@csc.com.cn SAC 编号:S1440525070008 乔磊 qiaoleibj@csc.com.cn 010-56135085 SAC 编号:S1440525070006 发布日期： 2026年08月03日 市场表现 0%20%40%60% 202 5/7/21 202 5/8/ 21 202 5/9/ 21 202 5/10 /21 202 5/11 /21 202 5/12 /21 202 6/1/ 21 202 6/2/21 202 6/3/ 21 202 6/4/ 21 202 6/5/ 21 202 6/6/ 21 机械设备上证指数机械设备 仅供内部参考，请勿外传 机械设备 行业动态报告 请务必阅读正文之后的免责条款和声明。 工程机械:6月挖机内外销继续超预期 ， 低位坚定布局。 2026年6月销售各类挖掘机25445台， 同比增长35.3%。 其中：国内销量10898台（含电动挖掘机65台），同比增长33.9%；出口14547台（含电动挖掘机34台），同 比增长36.4%。国内、外增速提速，今年挖机内销呈现较为明显的旺季后移，因为今年春节相比去年较晚，国内 挖机自3月以来恢复较高的同比正增长，预计后续将继续维持增长。出口维持较强表现，并未受国际形势、关 税变化、降息等扰动，中国工程机械高增态势依旧维持。 国内格局改善，头部企业开始涨价。 5月1日起，三 一、徐工、柳工、山推等公司宣布对挖机进行约 5%的涨价，三一、徐工对起重机产品也进行涨价，反映年初以 来的行业价格战趋缓，转向良性发展。 半导体设备：全球景气周期持续确认，关注涨价 +出海。SEMI更新预测、预计半导体设备未来 3年持续增长。 SEMI预计2026年全球半导体制造设备销售额将创下 1659亿美元的历史新高，同比 +23.2%。增长势头预计将 持续至2028年，总设备销售额有望达到创纪录的 2295亿美元，实现连续五年增长。 台积电上修26年资本开 支。台积电预计2026年全年资本支出为600亿至640亿美元，此前预估为 520亿至560亿美元，上调80亿美 元，幅度约15%。ASML整体业绩全面超市场及公司前期指引。 季度总净销售额93.26亿欧元，同比+21%、环 比+6.4%，大幅超越公司前期 84–90亿欧元指引及市场88.5亿欧元一致预期，年内第 二次上调全年业绩目标， AI算力+存储复苏双驱动行业高景气，盈利结构持续优化。 全球半导体设备零部件正经历一轮历史罕见的全链 条涨价潮。半导体产业链的定价权正从芯片终端向设备与零部件环节结构性上移。零部件企业规模较小、固定 成本占比高，涨价直接转化为利润；同时产线扩产周期长达 12-18个月，供给弹性最差。重视阀门管路、陶瓷 件、射频电源、GAS BOX等海外供应商交期延长带来的国产替代诉求与涨价逻辑。 锂电设备：固态电池产业化从电芯到系统全链推进，中试验证与设备订单双轨并行。 一是量产建设端，恩力动 力无锡2GWh先进电池Pack智造基地7月30日投产，构建固态电池系统研发、测试验证与智造一体化平台， 聚焦高端电摩、低空飞行器与人形机器人等战略新兴场景，公司 2026年重点推出1-20Ah全固态电芯，硫化物 路线能量密度覆盖270-600Wh/kg，从电芯到系统的产业化能力持续完善。二是材料与技术端，硫化物电解质 百吨级产线Q3集中投产节点临近，天赐材料液相法降本 30%-40%、新宙邦氧化物千吨线年内落地的产业化路 径清晰，材料端从实验室验证走向规模化供应，为全固态电芯量产奠定基础。三是设备端，订单先于业绩持续 兑现，先导智能、海目星 、利元亨等头部企业整线交付能力持续验证，设备端订单领先电芯端 6-12个月，固 态装备从1到N商业化加速。产业化节奏方面，行业当前处于 2026中试元年阶段，2027年示范装车、2030 年规模放量为产业共识，头部企业全固态大规模量产仍需跨越界面一致性、良率与成本等工程化门槛。当前板 块处于\"材料突破+量产验证+设备兑现\"三重共振窗口期，继续看好锂电设备与固态电池板块配置价值。 机械板块重点推荐： 中国动力、东威科技、杰瑞股份、中国船舶、恒立液压、奥比中光、三一重工、豪迈科 技、埃科光电、中微公司、先导智能、博众精工、徐工机械、中集集团、华测检测、迈为股份。 风险分析：国内宏观经济波动的风险、海外市场波动的风险、下游扩产不及预期的风险。 仅供内部参考，请勿外传 机械设备 行业动态报告 请务必阅读正文之后的免责条款和声明。 目录 总体观点：看好半导体设备产业趋势，高阶 mSAP工艺类载板积极扩产利好 PCB设备龙头.................................... 1 专用设备重点子行业观点 .................................................................................................................................................................. 3 工程机械 ....................................................................................................................................................................................... 3 半导体设备 .................................................................................................................................................................................. 3 AIDC发电设备 ........................................................................................................................................................................... 4 PCB设备 ...................................................................................................................................................................................... 4 3C设备 ......................................................................................................................................................................................... 5 油服设备 ....................................................................................................................................................................................... 5 电梯................................................................................................................................................................................................ 5 轨交设备 ....................................................................................................................................................................................... 6 矿山机械 ................................................................................................................... 位。相关受益标的： 1）大光：重点推荐中际旭创，建议关注新易盛； 2）小光：建议关注光迅科技、联特科技、汇绿生态、剑桥科技、东山精密、长芯博创、华工科技、COHR、FN、AAOI等； 3）新光：CPO产业链，重点推荐天孚通信，建议关注炬光科技、罗博特科、致尚科技、蘅东光、LITE、COHR等；OCS产业链，建议关注炬光科技、德科立、腾景科技、光库科技、LITE、COHR等；DCI...", "publish_time": "2026-08-04 08:18", "tags": ["文字观点"]}, "post:2026-08-04T19-14:2b79afb7b96b": {"id": "post:2026-08-04T19-14:2b79afb7b96b", "kind": "post", "title": "2026-08-04 19:14", "source_label": "帖子正文", "excerpt": "【光模块产业链｜上游关键材料有望迎来价值重估】 近期海外再度传出#拟进一步限制中国光模块相关出口的消息，市场短期情绪受到扰动。但从产业链角度看，我们认为真正值得关注的并非下游光模块组装，而是国产替代难度更高、资源属性更强的上游关键材料环节。", "content": "【光模块产业链｜上游关键材料有望迎来价值重估】 近期海外再度传出#拟进一步限制中国光模块相关出口的消息，市场短期情绪受到扰动。但从产业链角度看，我们认为真正值得关注的并非下游光模块组装，而是国产替代难度更高、资源属性更强的上游关键材料环节。 当前800G、1.6T高速光模块正进入快速放量阶段，#磷化铟（InP）已成为高速EML激光器、CW激光器等核心器件的重要衬底材料，是AI光互联产业链中不可替代的关键基础材料。随着全球算力中心持续升级，对高性能光芯片需求快速增长，磷化铟供给长期偏紧，产业链议价能力有望进一步提升。 与此同时，海外短期内难以形成成熟、高良率的1.6T光模块供应体系，国内头部厂商亦已提前布局东南亚产能，具备一定风险缓冲能力。因此，即便外部限制进一步升级，对全球供需格局的实质影响仍存在较大不确定性，更多或体现为产业链预期与估值的重新定价。 从投资主线来看，建议重点关注具备资源壁垒和材料壁垒的上游环节。#有研新材持续布局磷化铟及化合物半导体材料，是国产替代的重要方向；#云南锗业拥有稀缺锗资源及材料优势，有望受益于高端光电子产业升级。此外，铌酸锂材料作为高速光通信的重要...", "publish_time": "2026-08-04 19:14", "tags": ["有研新材", "云南锗业", "天通股份、福晶科技", "文字观点"]}, "post:2026-08-04T07-25:649912042278": {"id": "post:2026-08-04T07-25:649912042278", "kind": "post", "title": "2026-08-04 07:25", "source_label": "帖子正文", "excerpt": "🔥【兴证通信】中际旭创获海外大资金增持，AI光互联长期价值持续获认可#海外长线资金大幅增持旭创，#彰显对公司和产业趋势的长期信心。近期美国资本集团增持旭创275.7万股H股股份，持仓比例5.06%，价值约27.02亿港元。", "content": "🔥【兴证通信】中际旭创获海外大资金增持，AI光互联长期价值持续获认可#海外长线资金大幅增持旭创，#彰显对公司和产业趋势的长期信心。近期美国资本集团增持旭创275.7万股H股股份，持仓比例5.06%，价值约27.02亿港元。#美国资本集团是全球规模最大的主动资产管理机构之一，#管理规模超过3万亿美元，投资风格偏长期价值。此次增持体现海外机构对于旭创全球竞争力以及AI光通信长期产业趋势的认可。#云厂商持续强势，#AI资本开支与收入增长正形成正循环。近期微软、谷歌、亚马逊等海外CSP表现亮眼，市场正在重新认可AI基础设施投入逻辑。尤其亚马逊AWS强调AI需求依然旺盛，未来收入有望达1万亿美金，算力供给仍存在压力，持续加大数据中心、服务器和网络基础设施投入，AI资本开支正在逐步转化为云业务增长动力。#继续看好光通信产业链。当前板块调整更多来自市场情绪扰动，产业基本面并未改变。随着AI应用持续扩展，800G、1.6T需求持续提升，2.4T、NPO、CPO等下一代光互联逐步落地，#光通信龙头仍具备长期成长空间，低估严重。#文字观点", "publish_time": "2026-08-04 07:25", "tags": ["文字观点"]}, "attachment:files/Coherent专家交流.docx": {"id": "attachment:files/Coherent专家交流.docx", "kind": "attachment", "title": "Coherent专家交流", "source_label": "其他", "excerpt": "公司的主要收入构成是怎样的，其中光模块业务的占比如何？Coherent的业务主要分为通讯和工业两大板块，其中通讯业务占总营收的75%。", "content": "公司的主要收入构成是怎样的，其中光模块业务的占比如何？ Coherent的业务主要分为通讯和工业两大板块，其中通讯业务占总营收的75%。通讯业务内部又细分为数通和电信两个领域。数通业务基本由光模块业务构成，未来会增加CPO、NPO等新产品收入。电信业务的核心产品之一是相干ZR光模块，此外还包括WSS波长选择开关、光放大系统以及OCS等非模块产品。从整体来看，光模块是主要收入来源。以2025年的数据为例，光模块业务的总营收约为30亿美元，占整个通讯业务板块收入的75%至80%。 30亿美元的光模块营收是否包含了ZR相干光模块？如果不包含，数通光模块和ZR相干光模块的业务规模分别是多少？ 这30亿美元的营收主要指数通领域的各类短距光模块，不包括ZR相干光模块。ZR相干光模块虽然出货量不大，年出货量在10万只以内，但其单价较高。具体而言，400G ZR光模块的售价约为2,200美元，800G ZR光模块的售价可达4,000美元以上，平均售价按3,000美元计算，该部分业务规模约为3亿美元。因此，业务规模可以理解为30亿美元的数通短距光模块和3亿美元的电信长距相干光模块。 在数通短距光模块业务中，主要的产品规格、技术方案以及市场占比是怎样的？ 目前数通短距光模块业务中，800G、400G和1.6T是三个主要规格，合计占光模块业务总量的90%以上。剩余的10%主要是200G和100G等存量市场产品，而3.2T规格的产品目前仍在内部开发阶段，预计到2028年才会出货。在技术方案上，目前仍以EML方案为主，硅光方案的总体占比不到20%。不过，随着产品速率的提升，硅光方案的占比会逐步增加。例如，400G及以下速率的产品几乎全部采用EML方案；800G产品中，硅光方案的占比已开始超过20%；预计在未来的1.6T产品中，硅光方案的占比将进一步提升至50%以上。 400G光模块的具体技术方案、应用场景以及2026年第一季度的出货量情况如何？ 400G光模块主要采用两种技术方案。一种是VCSEL方案，其成本和功耗较低，主要应用于100米以内的短距离互联场景。另一种是EML方案，适用于最远可达2公里的长距离互联。在出货量方面，400G产品的需求量正在逐步减少，2026年第一季度的出货量已从峰值时期的单季75万只下降至约65万只。 对于400G光模块业务，2026年未来几个季度的出货趋势是怎样的？ 从趋势来看，出货量将保持稳定但略有下降。公司目前的战略重心已转向800G和1.6T产品的产能扩张，因为400G市场竞争激烈，价格和毛利率都偏低，同时海外客户的需求也正向更高速率产品升级，因此公司不会对400G业务投入更多资源进行扩产。 针对400G光模块业务，2027年和2028年的产能规划和出货量预期是怎样的？ 公司不会为400G产品线投入新的资本开支，但会利用现有产能进行生产。预计到2027年，存量产能仍能支持每年250万只的生产能力，但考虑到需求下降，实际出货量预计在此基础上减少10%至15%。对于2028年，预计出货量将在此基础上继续下降。 2026年400G光模块的价格趋势如何？ 400G光模块的价格仍在持续下降。市场上，国内厂商的部分400G产品价格甚至已低至100美元。根据技术方案的不同，价格存在差异。目前公司出产的400G光模块平均售价约为150美元。 若400G光模块售价维持在150美元，未来几年其毛利率是否会随着产线成熟而提升？ 预计400G产品的毛利率将稳定，但难以实现显著提升。一方面，部分核心物料的价格仍在上涨；另一方面，公司不会再为400G产品投入额外的研发资源进行成本优化。虽然设备折旧和研发成本摊销的减少可能会带来轻微的毛利率提升，但整体空间不大。同时，由于竞争对手会降价，若公司不降价，预计400G产品的出货量将会下降。 关于800G光模块，目前硅光方案的占比约为20%，未来这一比例的目标是多少？硅光方案是否能带来更高的毛利率？ 未来800G光模块中硅光方案的占比目标是提升至50%，以对标国内如中际旭创等厂商（其硅光占比已超50%，部分厂商甚至达到70%-80%）。关于毛利率，自研硅光芯片通常可以实现更高的毛利率，但外购硅光芯片的成本较高，其综合毛利可能与传统的EML方案相差不大。对于公司而言，由于部分硅光芯片仍需外购，而传统EML方案的芯片为自研，成本相对较低，因此目前硅光方案并未展现出明显的成本优势。推动硅光方案占比提升的主要原因在于，传统EML芯片供应受限，而硅光方案的供应链相对不紧张，扩产速度更快、潜力也更大。 800G光模块的硅光方案与EML方案在成本和售价上是否存在差异？ 在成本端，硅光方案因使用CW光源等因素，综合评估下来比传统EML方案的成本低约10%至15%。在售价端，两者也存在差异。例如，目前800G的EML方案售价约为400美元，而硅光方案的售价约为360美元，差价约为10%。 2027年800G光模块的出货量目标、产能规划以及硅光方案的占比预期是怎样的？ 预计2027年800G光模块的出货量将同比增长50%左右。届时公司不会再对800G进行大规模的新产线投资，增长主要通过产能优化和增加外包代工来实现。出货量仍会逐季增加，但不会再有新的大规模产线投入，因为公司的投资重点将转向价格和利润率更高的1.6T产品。在技术方案上，2027年800G硅光方案的占比目标是达到50%。 对2028年800G光模块市场的展望如何，包括出货量和硅光方案占比的趋势？ 预计到2028年，800G光模块的出货量将开始下滑，下滑速度可能与400G类似，约为每年百分之十几，不会出现急剧下降。届时，硅光方案的占比预计将稳定在50%左右，不会有特别大的提升。此前提高硅光占比主要是为了在市场高速增长期利用其供应链优势抢占市场份额。当需求达到峰值并开始萎缩后，公司将维持EML和硅光方案之间50%对50%的平衡。 2027年800G光模块的单价趋势如何？ 800G光模块的价格预计将持续下降。这主要是由于规模效应的提升以及新竞争者的不断进入，为了获取更多市场份额，公司会继续降价，但预计不会牺牲毛利。通过研发迭代、效率提升和生产成本的降低，可以对冲降价影响。 考虑到2028年800G光模块可能不再是主流产品，其价格降幅是否会进一步扩大？ 2028年800G光模块价格降幅超过15%的可能性确实存在。届时，如果市场需求增长停滞，而各厂商的产能已经完全释放，供求关系可能发生反转。在竞争加剧的情况下，为了出货量，可能需要以牺牲毛利为代价进行更大幅度的降价。相较之下，2027年的降价预计不会影响毛利率。 1.6T光模块目前的市场供需状况、2026年的出货量计划？ 1.6T光模块是公司自2025年下半年开始量产的最新主力产品，当前市场需求极其旺盛，供需缺口超过30%。公司正在大力扩产，计划2026年全年出货300万至350万只。 1.6T光模块不同技术方案的单价分别是多少？EML版本价格较高的原因以及未来的价格趋势是什么？ 目前1.6T光模块的单价根据技术方案有所不同，EML版本的售价为1,200美元，硅光版本的售价为900美元。EML版本价格偏高，主要是因为现阶段采用的Lumentum EML芯片涨价较多。公司拥有六英寸磷化铟工厂，计划于2026年下半年开始导入自研EML芯片。自研芯片的引入将有效降低成本，未来EML版本与硅光版本的价差预计将控制在200美元以内。 公司EML芯片的采购策略是怎样的，是否仅有1.6T产品线从Lumentum采购？ 公司目前所有速率光模块的EML芯片均从外部采购，主要供应商包括Lumentum和住友等，以确保核心物料有两到三家供应商。其中，Lumentum因其产品性能较好且产能较大而成为主要供应商。对于800G光模块，目前已有约30%的EML芯片实现自供，未来目标是将自供比例提升至70%。而用于1.6T光模块的200G EML芯片，现阶段则100%从Lumentum等外部厂商采购，自研芯片尚未导入。 关于EML芯片价格的变动趋势，市场传闻2026年涨价、2027年继续上涨、后年停止上涨的说法是否准确？ 从当前的供需关系来看，EML芯片价格的变动趋势存在较大不确定性。2026年EML芯片确实非常紧缺，200G EML芯片的价格已上涨30%。由于1.6T光模块的需求预计在2027年将增长三倍，Lumentum等厂商2027年的产能也已被预订完毕，因此200G EML芯片在2027年可能因持续紧缺而进一步涨价。展望2028年，Lumentum于2026年3月宣布收购一家工厂，计划将其改造为生产AI用磷化铟芯片，预计2028年年中投产，届时EML芯片产能将大幅提升，供应紧张的局面或将缓解，价格可能随之下降。此外，如果索尔思（东山精密）、长光华芯等国产EML芯片能够成功导入海外客户，也可能促使价格更早回落。 鉴于上游物料供应紧张，公司向上游供应商预定产能的周期发生了怎样的变化？ 采购周期已显著提前。以往，公司通常会提前半年向上游供应商预定产能。但由于当前市场供应极度紧张，且存在超额订购现象，采购策略已发生改变。公司在2026年6月前就已完成2027年全年物料的预定，并计划在2026年年底前锁定2028年的物料。这意味着订货周期已从过去的半年延长至一年，未来甚至可能需要提前两年进行。 在与上游供应商（如Lumentum）签订供货协议时，是采用锁量锁价还是锁量不锁价的模式？如果未来需求不及预期，取消订单的机制是怎样的，例如预付定金的比例是多少？ 目前与Lumentum这类供应商的合作模式已经从过去的锁量锁价转变为锁量不锁价，尤其是在商谈2027年及以后的交付计划时。价格将根据市场供需关系动态调整，并且大概率呈上涨趋势。对于远期订单，例如计划在2026年年底前确定的2028年订单，需要预付定金。如果最终采购量未达到约定规模，定金将不予退还。定金比例通常在30%至40%之间。以公司2026年6月与上游磷化铟衬底供应商AXT的合作为例，公司为未来三年的交货计划预付了数千万美元定金，后续交付的货款将直接从中抵扣；若采购量未达到要求，该笔定金同样不予退还。采购这些上游物料和设备主要是为了支持内部光芯片产能的扩张。公司计划在2026年和2027年实现光芯片产能每年翻倍。目前，公司不仅向AXT等供应商采购衬底，也在向爱思强等厂商订购MOCVD设备，这类设备的交付周期已超过14个月。当前，公司生产的光芯片基本仅供内部消耗，不对外销售。 1.6T光模块在2027年和2028年的平均销售价格预计将如何变化？ 预计2027年，得益于规模效应，1.6T光模块价格会下降，但降幅将小于800G，因为其供需缺口依然严重。具体来看，EML方案的价格可能降至1,000美元，硅光方案降至800美元，整体均价约为900美元。到2028年，随着更多厂商具备生产能力，市场竞争加剧，预计价格降幅会加大至每年15%左右，届时行业扩产速度可能会超过需求增长速度，供需关系将有所缓和。 1.6T光模块中，EML方案与硅光方案的出货量占比在2026年至2028年期间预计将如何演变？ 2026年，硅光方案已开始出货，预计全年占比可达到35%。到2027年，硅光方案的占比将至少达到50%，甚至可能提升至60%。展望2028年，硅光方案的占比预计将进一步提升，主要原因是硅光方案的降本速度快于EML方案。尽管EML的核心芯片价格在2028年可能有所下降，但其降价速度预计仍将慢于硅光。 公司光模块业务的下游客户构成及各主要客户的收入占比情况如何？ 公司的下游客户主要是北美的CSP大厂，包括谷歌、微软、AWS、英伟达和Meta。其中，谷歌和英伟达是最大的两个客户，两家合计占光模块业务总营收的40%以上。 公司与主要客户在产品设计、需求确认及价格谈判方面的年度合作周期是怎样的？ 公司与大客户的合作主要通过年度集中采购招标的形式进行，通常在每年的第四季度（10月至11月）确定下一年度的合作细节，包括市场份额、产品价格以及交付计划。新价格从次年1月开始生效。一旦年度价格确定，通常在年内会保持稳定。 在数据中心互联业务中，CPO和NPO产品的客户分别是哪些？ CPO产品目前的客户是英伟达。对于NPO产品，公司主要直接与CSP厂商对接，而不是通过博通。当前已明确提出NPO需求的客户包括AWS、Meta和谷歌。 请问如何理解NPO？它与传统可插拔光模块在形态、功能和部署位置上有何区别？ NPO，也称为光引擎（Optical Engine），可以理解为光模块中更为核心和精简的部分。如果将一个传统的可插拔光模块（Pluggable Module）比作一个完整的系统（如一辆汽车），那么NPO就相当于其中的发动机。传统光模块是一个集成了协议、软件、DSP等复杂信号处理功能的系统，其核心功能是光电转换。相比之下，NPO专注于光电转换这一核心功能，不包含DSP和数据处理软件，因此系统更为精简。 在物理形态和部署位置上，NPO的尺寸更小，集成度更高。它并非像传统光模块那样插在设备外部的插槽上（类似于PC的USB接口），而是被设计成可插拔的形式，通过特定的插座安装在设备内部的主板上，紧邻核心芯片。尽管部署在内部，但行业标准组织（如OIF光互联论坛）仍在定义其标准尺寸、接口以及可插拔的插座设计，使其具备可插拔的特性。 NPO产品的市场定位是什么？其当前主流规格、价格水平以及未来的技术迭代路径是怎样的？ NPO主要面向高规格应用场景，目前行业主流开发的是3.2T速率的产品。在价格方面，一个3.2T的NPO售价大约在1,000至1,200美元之间。相较于售价约1,000美元的1.6T传统光模块，NPO的每Gbit成本仅为其一半，这主要得益于其省去了DSP等组件，系统更为简化。尽管单位成本较低，但由于其速率高，单个产品的总价值依然不低。 从市场定位来看，NPO未来并非主要用于替代传统光模块，而是旨在替代机柜内部（scale-up）的铜缆互联，从而开辟一个全新的增量市场。对于传统光模块厂商而言，进入NPO领域意味着业务的全新增长点。 技术迭代方面，NPO的速率将进一步向6.4T甚至12.8T演进。目前，华为等公司正在国内推动相关的NPO标准制定工作。 NPO产品在2026年和2027年的出货节奏、市场规模及主要厂商份额预期如何？ NPO作为一种新方案，目前仍处于客户测试阶段。预计2026年全年出货量较小，主要为样品送测和小批量交付，总量预计不超过5万只。通常情况下，每个客户的测试需求量约为2000至3,000只。 展望2027年，市场需求预计将达到2000万只，但考虑到供应紧张的状况，实际出货量可能在800万至900万只。在此市场规模下，中际旭创预计将占据超过50%的市场份额。 NPO产品的价格在2028年及以后将呈现怎样的变化趋势？ NPO产品的价格下降速度预计会比较快。这主要是因为该方案普遍采用硅光技术集成，且不含DSP和EML等高成本组件。硅光方案在实现规模化量产后，其降价速度通常快于EML方案，同时良率和生产效率的提升也更快。预计其价格每年可以实现20%的降幅。 关于2028年的出货量，目前客户尚未给出明确的指引。 CPO方案的出货时间规划是怎样的，特别是在scale-out和scale-up两种应用场景下有何不同？ CPO方案的出货时间因应用场景而异。应用于scale-out场景的CPO已于2026年7月开始出货，尽管初期数量不大。而CPO的核心市场，即应用于scale-up场景（柜内GPU直连），原先普遍预期在2027年下半年开始放量，但由于英伟达Rubin Ultra芯片的重新设计及机架的推迟，这一时间点可能会推后到2028年初。Scale-up互联对带宽密度要求更高，对功耗要求更低，与长距离的scale-out硅光互联在技术要求上有所不同。 针对英伟达的scale-out CPO方案，公司从何时开始供货？具体产品是什么，以及2026年的出货量预期是多少？ 公司预计从2026年第四季度开始为英伟达的scale-out CPO方案配套出货ELS模组。目前，英伟达CPO方案中的核心硅光芯片及光引擎封装由其委托台积电代工，并未采用第三方方案。因此，公司当前的角色是提供外围配套产品，即包含自产CW激光器的ELS。在公司开始供货前，英伟达所用的ELS由Lumentum独家供应。英伟达计划在2026年出货2万台CPO设备，并已于7月开始产能爬坡，预计第三季度可出货约4,000至5,000台。 公司在CPO方案中供应的CW激光器和ELS模组的具体规格、价格、以及市场竞争格局是怎样的？ 公司供应的CW激光器规格为400mW，在自有的6英寸磷化铟晶圆厂生产。作为对比，Lumentum的规格为350mW，在4英寸晶圆厂生产。在价格方面，单颗400mW的CW激光器售价为35美金。公司将8颗此类激光器集成为一个ELS模组，模组售价可达500美金。一台CPO设备需要16个ELS模组。在市场格局上，该领域壁垒较高，能供应大功率CW光源的厂商较少，主要为Lumentum和公司。公司与英伟达有深度合作关系，例如英伟达高层曾出席公司位于德克萨斯州的磷化铟工厂扩产奠基仪式。 除了ELS模组，公司是否还为英伟达的CPO方案提供其他产品？ 是的，除了ELS模组，公司还在为英伟达提供名为DFAU的产品，这也是CPO方案中的一项刚需组件。 请介绍一下DFAU这款产品，其在英伟达CPO中的具体应用，以及公司在2027年的市场份额？ 该产品是光纤阵列单元，作为光纤接头应用于光引擎中。在英伟达的CPO中，每台CPO需要使用32个可插拔的FAU。目前，天孚通信是该产品的第一大供应商，公司位居第二。预计到2027年，公司有机会获得25%以上的市场份额。 对于DFAU这款产品，2028年的出货量增长预期以及年度价格降幅是怎样的？ 根据英伟达给出的指引，预计2028年DFAU的出货量将实现三倍的增长。关于价格方面，年度降幅预计在10%左右，而不是15%至20%。 除了数通产品，公司在电信领域还有哪些重点产品？ 在电信领域，除了相干光模块这一主要产品外，OCS也是公司未来的重点产品之一。 公司出货的OCS产品形态是怎样的？其具体规格、单价、2026年的出货目标及各季度的出货节奏如何？ 公司出货的OCS是一台独立的设备，而非整个机柜，一个机柜大约可以容纳4到8台此类设备。具体产品规格为320通道，单台售价高达13万美元。2026年的出货目标是1,400台左右。由于生产和调试过程复杂，前两个季度合计出货了500台，下半年计划出货约900台。 2027年OCS产品的出货量目标、潜在客户以及价格变动情况是怎样的？ 2027年计划出货4,000台，如果市场拓展顺利，甚至可能达到5,000台，目前市场需求非常旺盛。当前主要客户是谷歌，但英伟达在测试公司的方案后也表示满意，未来可能会采购。此外，Meta、AWS、微软等公司也对OCS表现出兴趣，公司目前有十个潜在客户。价格方面，对于新客户，单价将维持在13万美元；而对于谷歌这类采购量持续放大的老客户，价格预计会有所下降。 2028年OCS产品的出货量预期如何？与Lumentum等竞争对手相比，公司的市场地位和技术路线有何不同？ 2028年的出货量很大程度上取决于与英伟达的合作进展，如果合作敲定，公司有信心出货量达到1万台以上。目前，谷歌主要采购Lumentum所采用的MEMS技术方案，因此现阶段公司的规模明显小于他们，例如Lumentum2027年从谷歌获得的订单预计就将达到1万台。公司的技术路线与MEMS不同，采用的是硅基液晶方案，该方案获得了英伟达的青睐。凭借与英伟达的紧密合作关系，公司有机会在2028年达到与Lumentum同等的市场规模。 展望2028年及以后，OCS产品的价格趋势和产品迭代计划是怎样的？ 现有320端口的OCS产品价格可能会持续下降至10万美元。但与此同时，公司也在进行产品升级，计划推出规格更高的512端口OCS。新产品的定价会更高，这将对整体平均售价产生积极影响。 请介绍一下公司相干光模块产品的应用场景、产品形态及其主要客户群体？ 公司的相干光模块主要用于数据中心之间的互联，产品形态是可插拔的，其外形尺寸与短距离光模块相似。尽管外形相似，但内部构造完全不同，在同等速率下，相干光模块的成本和价格可能比短距离模块高出十倍。公司的客户群体包括直接销售的微软和谷歌，同时也通过设备商进行销售，例如北美的Ciena、诺基亚，以及欧洲的ADTN和ADVA。 公司向Ciena等客户销售的产品具体是CW laser还是模块？其中是否包含窄线宽激光器和pump laser等核心器件？ 公司直接向Ciena这类相干传输设备商销售的是模块。相干模块需要使用窄线宽激光器，而长距离传输的模块则需要用到pump laser。这两种激光器公司均能自研，并且是当前市场极度紧缺的核心技术。Ciena之所以采购公司的模块，是因为其自身虽然也能生产模块，但无法获取到这些关键的激光器。此前，市场上pump laser主要由Lumentum供货，但其目前产能严重不足。公司凭借自产自销的优势，吸引了包括Ciena在内的许多客户前来采购模块。Ciena甚至提出希望直接购买公司的pump laser，但公司倾向于直接销售附加值更高、利润更丰厚的模块产品。 400G和800G相干光模块的单价分别是多少？预计2026年全年的出货量以及1.6T模块的量产时间点是怎样的？ 400G ZR模块的售价约为2000美元，800G模块的售价约为4,000美元。预计2026年全年，400G模块的出货量约为8万只，800G模块的出货量约为2.5万只。相干模块的技术迭代通常比数据中心内部使用的短距模块晚一代，目前行业内800G相干模块于2026年才刚开始上量，而前两年市场主流是400G。因此，1.6T相干模块的规模化应用预计要到2028年之后。 2026年400G和800G相干光模块的出货节奏是怎样的？对2027年和2028年的出货量增长有何预期？ 2026年400G模块的出货量呈现逐季环比提升的态势，每个季度的环比增幅在15%至20%之间。800G模块从2026年第二季度开始出货，该季度出货量约为5,000只，预计下半年将出货2万只。展望2027年，市场需求依旧旺盛，预计400G模块的出货量将增长60%，800G模块的出货量有望增长两倍，即总量达到2026年的三倍。1.6T模块在2027年预计不会有出货。对于2028年，预计400G模块的增速将放缓至20%至30%；800G模块仍将是市场主力，出货量有机会实现翻倍增长；而1.6T模块将开始初步出货。 相干光模块的ASP年降预计是多少？ 预计相干光模块的ASP年降幅度在15%左右。 相干光模块主要应用于哪些场景？其市场需求的持续性如何？ 相干光模块主要应用于数据中心出口的DCI传输设备上。在一个万卡集群规模的数据中心，可能会配置几十台DCI设备，大约需要插接2000个左右的相干光模块。目前数据中心之间的大规模互联建设尚未完全展开，市场需求的可持续性很强。一方面，大量现有数据中心尚未完成互联，这需要相当长的时间；另一方面，未来将不断有新增的数据中心需要进行连接。预计到2030年之前，数据中心互联都将是一个高增长的需求领域。 在电信业务板块中，相干光模块和OCS的合计收入占比是多少？其余业务的构成和增长前景如何？ 在电信业务板块中，相干光模块与OCS的合计收入占比约为70%。剩余的30%业务中，一部分是尚未出货的新产品，如用于DCI网络中继放大、扩大传输距离的多轨放大器，预计未来每年有30%至40%的增长潜力。另一部分是传统的电信设备，如WSS等，这部分业务目前在电信板块的占比已降至15%至20%左右，基本没有增长，其表现主要取决于AT&T、Verizon等客户的资本开支。公司当前的核心增长动力主要来自CSP客户。 工业业务板块未来的年度增长预期如何？ 工业业务板块的增长与宏观经济环境直接相关。目前，包括碳化硅和激光加工设备在内的业务已经止跌回稳，但考虑到整体经济环境中，除AI领域外，汽车、常规制造业等行业的投资增长并不显著，新工厂开工或产能扩张的需求有限。因此，对工业业务板块的增长持谨慎乐观态度，预计年同比增长率可能在10%左右。", "status": "extracted"}, "post:2026-08-04T07-35:c4a117404081": {"id": "post:2026-08-04T07-35:c4a117404081", "kind": "post", "title": "2026-08-04 07:35", "source_label": "帖子正文", "excerpt": "【中金风光公用环保】光伏主产业链重点公司及行业动态日报0803行业动态： 1. 印度Cosmic PV已顺利拿下中央邦污染监管部门核发的建厂许可，正式落地1.1GW N型 TOPCon电池制造项目。该项目为其中央邦4GW大型电池基地的一期工程，预计2027-2028财年正式投产。", "content": "【中金风光公用环保】光伏主产业链重点公司及行业动态日报0803行业动态： 1. 印度Cosmic PV已顺利拿下中央邦污染监管部门核发的建厂许可，正式落地1.1GW N型 TOPCon电池制造项目。该项目为其中央邦4GW大型电池基地的一期工程，预计2027-2028财年正式投产。项目整体占地60英亩，土地租期长达99年，投产后将专注量产主流N型高效电池产品，补齐印度本土高端光伏产能短板。 2. 德国自8月1日起新建并网光伏项目的上网电价补贴下调1%。由经济部长Katherina Reiche提出的《2027可再生能源法》草案上周顺利通过内阁审议，法案明确计划在2030年全面取消光伏项目上网电价补贴。 3. 8月3日，国家发展改革委 国家能源局关于印发《新型电力系统建设“十五五”规划》的通知，就电力系统、各类电源“十五五”发展目标给出规划。到2030年，新型电力系统初步建成：绿色低碳的电力供给格局基本形成，非化石能源发电量占比达到50%，实现28亿千瓦以上新能源高水平消纳。 4. 近日，协鑫集团旗下昆山协鑫光电材料有限公司完成D1轮超亿元融资，本轮融资由金信资本领投。协鑫光电表示，本轮资...", "publish_time": "2026-08-04 07:35", "tags": ["文字观点"]}, "post:2026-08-04T09-39:3fae135c4d1c": {"id": "post:2026-08-04T09-39:3fae135c4d1c", "kind": "post", "title": "2026-08-04 09:39", "source_label": "帖子正文", "excerpt": "首次覆盖【东吴电新】宏工科技：国内物料处理设备龙头，固态打开第二增长曲线 #专注物料自动化处理、多行业布局持续增长。宏工科技成立于08年，以锂电池物料自动化处理为核心业务，同时依托成熟的物料处理技术，横向拓展至食品医药、精细化工、橡胶塑料等行业，构建“一核多翼”的业务矩阵。", "content": "首次覆盖【东吴电新】宏工科技：国内物料处理设备龙头，固态打开第二增长曲线 #专注物料自动化处理、多行业布局持续增长。宏工科技成立于08年，以锂电池物料自动化处理为核心业务，同时依托成熟的物料处理技术，横向拓展至食品医药、精细化工、橡胶塑料等行业，构建“一核多翼”的业务矩阵。25年锂电池厂商恢复扩产，公司主业订单大幅回暖，全年新增订单35.54亿元，其中新能源板块31.97亿元、非新能源板块3.57亿元。26年Q1公司收入4.72亿元，同增82%，归母净利润7604万元，同增339%，订单执行带动业绩大幅改善。 #核心产品转化率提升、拓展非新能源领域、推进服务后市场布局、打造短期-中期-长期三大增长极。1）短期看：公司设备由通用配套设备向关键工艺设备升级，传统通用配套设备是成本加成定价，但是关键工艺设备是价值定价，部分场景毛利率高5pct以上，随着后续核心设备放量及整线渗透率提升，以及海外高毛利市场的拓展，盈利中枢有望上移；2）中期看：横向拓展众多领域，降低单一行业依赖度，规划30年非新能源收入占比升至40%；3）长期看：进一步拓展商业模式，从卖设备向服务市场拓展，围绕核心设备维保、...", "publish_time": "2026-08-04 09: 色低碳技术逐步成熟推动 全球船舶向绿色低碳发展，全球船舶动力 有望迎来新的变革。 公司柴油机动力主要应用于船舶市场，为各型船舶提供动力、电力，属于 船舶配套行业，与船舶行业景气度密切相关。 2025年，中国三大造船指标 造船完工量、新接订单量和手持订单量分别占世界市场份额的 56.1%、69% 和66.8%，连续16年保持世界第一。国内新船 在手订单量大幅增长，再创 历史新高，主要造船企业订单饱满。在此背景下， 2025年，我国船用柴油 机市场延续高景气，主要发动机制造企业手持订单饱满，市场规模稳步增 长，产品结构持续优化，盈利能力继续改善。作为国内主要船用柴油机制 造企业， 公司在船用低速机、远洋船用中速机和舰船用中高速机领域国内 市场份额均排名第一。 燃气轮机 发展向好， 跳出船舶单一周期 AIDC建设激化北美缺电矛盾，海外燃机供需缺口带来中国燃机出海机会 。 中国动力 100%全资子公司 ——哈尔滨广瀚动力技术发展有限公司主要从 事燃气轮机业务 ，致力于构建研发、生产、全寿命服务一体化的中小型工 业燃气轮机体系， 目前已形成功率覆盖 5~50MW 产品系列。 盈利预测 中国动力主要业务涵盖柴油机动力、燃气动力、蒸汽动力、综合电力、化 学动力、热气机动力、核动力 (设备)等七类动力业务及机电配套业务，为集 高端动力装备研发、制造、系统集成、销售及服务于一体的一站式动力需 求解决方案供应商。基于公司 业务布局， 我们预计中国动力 2026-2028年 营业收入将分别达到 671/778/889亿元，同比增长 16%/16%/14%；归母净 利润分别为 29/41/56 亿元。首次覆盖 ，给予 “增持” 评级。 风险提示：下游造船需求不足风险 、毛利率提升不及预期风险 、燃气轮机 需求不足风险 、蓄电池需求不及预期 、汇率波动风险 、股价波动风险 财务数据和估值 2024 2025 2026E 2027E 2028E 营业收入 (百万元 ) 51,696.62 57,799.96 67,147.28 77,776.89 88,942.38 增长率 (%) 14.62 11.81 16.17 15.83 14.36 EBITDA (百万元 ) 3,534.79 4,989.15 7,768.65 10,891.76 15,335.28 归属母公司净利润 (百万元 ) 1,390.87 1,300.89 2,906.73 4,052.15 5,556.96 增长率 (%) 78.43 (6.47) 123.44 39.41 37.14 EPS(元/股) 0.62 0.58 1.28 1.79 2.45 市盈率 (P/E) 43.65 46.69 21.03 15.09 11.00 市净率 (P/B) 1.55 1.52 1.46 1.38 1.29 市销率 (P/S) 1.17 1.05 0.91 0.79 0.69 EV/EBITDA 8.86 2.96 7.51 2.07 3.54 资料来源： wind，天风证券研究所 -15%-1%13%27%41%55%69%83% 2025-08 2025-12 2026-04中国动力 沪深300 仅供内部参考，请勿外传 公司报告 | 首次覆盖报告 请务必阅读正文之后的信息披露和免责申明 2 内容目录 1. 专精特新引领技术迭代，业务增长与财务稳健性协同提升 ................................ ..................... 5 1.1. 公司定位：一站式动力需求解决方案供应商 ................................ ................................ .....5 1.2. 数次并购重组打造动力龙头 ................................ ................................ ................................ ....5 1.3. 船用发动机为最核心板块 ................................ ................................ ................................ ......... 5 1.3.1. 柴油动力为公司最核心板块 ................................ ................................ ......................... 5 1.3.2. 营收稳健增长，归母 /扣非净利持续提升 ............................ 级补救单位等 3种途径合规；对 于SU，可选择平衡其他船舶的二级合规赤字、储存供后续报告期使用或作为捐款自愿取 消。 图13：IMO净零框架下的 GFI履约示意 图 资料来源： 《中国可持续航运燃料发展报告 2025》、天风证券研究所 2.2.3. 欧盟排放交易体系 扩展至航运业 根据道可特国际贸易与跨境租赁 公众号， EU ETS 是全球首个也是最大的 “总量管制与交 易”体系，其基本原理是为特定行业的温室气体总排放量设定一个逐年递减的上限，并向 覆盖范围内的企业分配或拍卖排放配额。 企业必须为其每一吨的排放量交回一个配额，配额可以在市场上自由交易。 随着总量的收 紧，配额变得稀缺，其市场价格便会上升，从而激励企业通过节能减排来降低合规成本。 根据 2023 年 5 月通过的修订版《 ETS 指令》 ，自 2024 年 1 月 1 日起，航运业被正式 纳入 EU ETS。 根据道可特国际贸易与跨境租赁 公众号， 对于受 EU ETS 规制的航运公司而言，其核心合 规义务构成一个年度循环，主要包括两大环节： 1、 监测、报告与核查 ：在每个报告年度结束后， 公司需根据监测数据计算其在 EU ETS 覆 盖范围内的总排放量，编制年度排放报告，并聘请经认可的独立第三方机构对报告进 行核查，以确保其准确性和合规性。 2、 购买与交回配额： 航运公司必须在次年 9 月 30 日之前，为其上一年度经核查的排放 总量，在欧盟统一登记簿 中交回等量的排放配 额。这些配额需要公司自行从市场上购 买，主要渠道包括成员国政府组织的定期拍卖或在二级市场上向其他公司购买。配额 的价格由市场供需决定，波动性较大，这对航运公司的现金流管理和成本预算构成了 直接挑战。未能在规定期限内足额交回配额的公司，将面临每吨排放 100 欧元（外加 通胀调整）的罚款，并且仍需在次年补交所欠的配额，合规要求极为严格。 2.2.4. 可持续航运燃料 逐渐替代燃油 IMO净零框架生效后将能通过经济手段调节燃油和可持续航运燃料的成本， 推动可持续航 运燃料应用 。为推动 2050年净零排放目标的实现， IMO在2025年4月批准“IMO净零 框架”草案，国际航 运减排方向逐渐从提高船舶能效转向管控船舶燃料的全生命周期排 放，使用可持续航运燃料成为 实现减排目标的根本路径。 仅供内部参考，请勿外传 公司报告 | 首次覆盖报告 请务必阅读正文之后的信息披露和免责申明 11 根据 IMO第4次GHG报告，国际航运燃料年消耗量约 2.20-2.39亿吨当量燃油，预计到 2050年燃料需求增至约 2.59亿吨。 CCS基于 IMO 2023 温室气体减排战略的分阶段目标 测算得出： 2030年国际航运需使用可持续航运燃料替代约 13%的燃油， 总需求量约为 5400万吨； 2040年需替代约 65%的燃油，总需求量约 3亿吨； 2050年需替代约 91%的燃 油，总需 求量约 4.5亿吨。 图14：2030 -2050年全球国际航运燃料需求预测 资料来源： 《中国可持续航运燃料发展报告 2025》、天风证券研究所 2.2.5. LNG为近中期过渡方案 ，甲醇和绿氨有望成为 中国远期方案 双燃料发动机 是一种关键的过渡性解决方案 。双燃料发动机能够同时兼容传统液体燃料与 替代气体燃料 ，目前替代气体燃料以 LNG为主，未来可扩展至氨和氢，在实现减排的同时 保持运营灵活性 的开发与采用。 双燃料发动机具备在常规液态燃料以及气态燃料上均能运 行的卓越能力。这种固有的灵活性为显著减少有害大气排放物提供了极具吸引力的途径， 同时还能保持在全球和区域贸易路线上的操作适应性 。 从船型来看， 集装箱船成为替代燃料低速机规模化应用的核心，低速主机的 LNG运输船 已全部采用 LNG动力。应用于各类船型的低速机的燃料结构中， 集装箱船是替代燃料低速 机应用占比最高的主流船型，也是 LNG动力的核心应用场景，以功率计，应用于集装箱船 的低速机中有 55.9%为替代燃料动力，其中包含 45.3%的LNG动力和 10.5%的甲醇动力。在 油轮和散 货船这两大主流船型应用场景下，以功率计，低速机中传统燃料动力类型占比均 达90%以上，替代燃料机使用比例低。此外，新建造的 LNG运输船所选配的低速机已全部 采用 LNG动力。 另外， 值得注意是， 近些年汽车运输船对于替代燃料的使用比例一直较高， 主要为 LNG动力和甲醇动力， 2025年新成交的应用于汽车运输船的低速机中 77.8%为LNG 动力、 15.6%为甲醇动力 。 仅供内部参考，请勿外传 公司报告 | 首次覆盖报告 请务必阅读正文之后的信息披露和免责申明 12 图15：2025年不同船型的主机燃料结构（功率计） 资料来源： 动力产业联盟创新中心 、天风 按此规模，并考虑存储价格上行，单G瓦资本开支可能接近600亿元。请问实际情况是否如此？ 市场估算的单G瓦资本开支可能偏高，因为其测算基础通常是NVIDIA的GPU。AWS的规划主要基于自研的Rubin卡，如果使用Trainium系列产品，单G瓦成本可能只有市场估算的一半左右。在存储方面，AWS已通过签订长期协议来控制成本和价格上限，因此这部分开支并没有那么高。 以NVIDIA的Rubin架构GPU为例，单G瓦的存储价值量（不含GPU本身）可能接近250亿元。请问基于自研的Trainium系列产品，单G瓦的存储价值量大概是多少？ 明年（2027年）上半年上线的主要是Trainium Three，其存储价值量占整个服务器机柜价值的比例约为50%，即存储与服务器的价值大致为1:1。Trainium Four预计要到明年下半年Q3或Q4才会出货。此外，AWS整个机柜的成本也相对更低。 如果基于Trainium系列GPU的单G瓦资本开支约为300亿元，这个数值是否包含了土建和电力等基础设施成本？ 这300亿元的资本开支不完全包含基础设施成本，土建部分是另外计算的。这笔开支可以大致理解为150亿元的Trainium系列GPU卡，加上另外150亿元的存储价值。需要说明的是，AWS计算存储价值时，已将GPU卡本身包含的HBM和DRAM等存储单元的价值剥离出来。 确认一下，基于Trainium系列产品的单G瓦存储价值量约为150亿元，而基于Rubin架构的测算值约为250亿元。请问这150亿元的估算是基于当前Q2的合约价，还是已经考虑了Q3之后的价格上涨预期？ AWS的DRAM采购基本已经通过长期协议锁定，因此价格是依据长协价计算的。对于其他存储容量，AWS会根据对明年（2027年）价格的预期进行测算，但届时预计也会转为长期协议采购。 对于长期采购协议，价格是固定不变的吗？ 价格并非完全恒定，但协议中会设定一个价格上限，实际采购将按照该上限执行，不会超过这个预设的最高价。 单GW算力建设的投资价值量大概是多少？ 如果将训练和推理的硬件全部计算在内，包括GPU和内存等组件，单GW算力建设的总投资额不会超过300亿元。 在明年规划的7 GW增量算力中，Rubin架构GPU的占比大概是多少？ Rubin架构GPU的占比较少。根据规划，明年将采购约100万张英伟达GPU，其中最多一半为Rubin架构，另一半仍为Blackwell架构。与此同时，AWS自研的Trainium芯片采购量将接近300多万片，两者比例约为3.5:1。考虑到Rubin架构GPU的功耗更高，折算成功率后，其在7 GW增量算力中的占比大约为1-2 GW。 对于2028年的资本开支规划以及市场对其可持续性的担忧，公司有何展望？ 2028年的资本开支规划尚未最终定案，因为数据中心的具体排产计划还未完全明确。预计资本开支仍会保持增长，但增幅不会像近两年这么大。关于明年的资本开支，预计不会达到市场预期的3,000亿美元，可能会有所下修，这主要是因为部分组件价格昂贵或供应受限。 对于明年（2027年）计划上线的约7,000万左右的资本开支，将如何分配给Anthropic、OpenAI、自用以及其他客户？ 在总计划中，Anthropic、OpenAI两者合计超过50%。余下的部分，常规的计算机存储（computer storage）将占据30%至40%，其余部分则分配给包括内部电商业务在内的其他客户。 考虑到Anthropic和OpenAI在云业务中资本开支占比较高，如果这两家公司在2027至2028年继续保持高增长，是否意味着公司同期的资本开支也将持续高增长？ 是的，公司与这两家大模型厂商签有长期协议。只要它们的增速不减，公司就会持续保证其增长所需的资源支持。 在除去Anthropic和OpenAI之外的客户中，中小型公司主要使用AI服务还是传统云服务？另外，从业务构成来看，AI业务的算力消耗与收入贡献之间是何种关系？ 中小型客户同时使用AI和传统云服务，呈现混合使用的状态。在业务构成上，算力消耗与收入贡献并不直接挂钩。例如，AI业务可能消耗了超过60%的算力资源，但其产生的收入尚未达到总收入的50%，超过一半的收入仍然来自传统云业务。 剔除Anthropic和OpenAI这类大型模型厂商后，其他中小型企业客户调用AI API所产生的收入，其增速及占比提升情况如何？ 这部分中小型企业客户的AI相关收入增长速度不及两家头部大模型厂商。从AI收入增长的排序来看，今年（2026年）增长最快的是Anthropic和OpenAI；其次是外部的中小型企业；再次是公司内部的其他业务部门，如零售等。这些客户确实在调用AI服务，但其增速相对较慢。 大型模型厂商在AWS平台上主要通过哪些方式使用资源？这些方式与中小型企业有何不同？ 大型模型厂商主要通过两种途径使用AWS资源：一是直接租赁裸金属服务器（bare metal）进行计算，这部分有长期协议支持；二是通过AWS的Bedrock平台向企业级用户销售其模型API，AWS会对此进行抽成，目前的抽成比例接近50%。通过Bedrock平台销售API的模式增长非常迅速，这对AWS而言利润更高，同时也能帮助大模型厂商触达更多使用AWS的企业客户。相比之下，一般的中小型企业主要以租赁裸金属算力为主，较少通过平台销售API。 其他主要云服务厂商明年（2027年）或后年的资本开支计划是怎样的？ 对于具体的吉瓦数规划不甚了解，但对资本开支有所耳闻。Google原先的计划较为激进，其2027年的资本开支预计是最大的，可能比AWS公司要大。Microsoft相对保守，Meta的投入仍然较多，预计在1,600亿至2000亿美元之间。Oracle的规模则小得多，预计不足1,000亿美元。 目前算力资源，特别是用于AI训练的NVIDIA GPU和存储等环节的使用率情况如何？ 目前算力使用率几乎是满负荷状态，尤其是NVIDIA GPU的使用率超过90%，其中用于训练的Trainium芯片使用率也达到了92%。通常认为80%是比较良性的使用率水平。基本上，今年（2026年）采购的设备一经安装便立即处于满负荷运转状态。这种高负载情况主要针对AI相关的工作负载，非AI机柜的使用率则处于正常水平，没有特别高。 对于非AI业务的存量基础设施，未来的建设策略是什么？ 一般不会再新建非AI机柜，主要是进行设备更替。例如，设备使用五年后会进行更换，通常会替换为最新一代的CPU。这种做法旨在提升算力，但机柜数量通常不会再扩张。唯一的例外是在新区域进行建设，例如在墨西哥、巴西等之前没有AWS覆盖的地区新建数据中心。 综合各家云服务商及新兴云厂商的规划，明年（2027年）上线的总吉瓦数可能接近28至30吉瓦，当前的电力、土地和土建等基础设施能否支撑如此大规模的扩张？这些规划是否存在下修的可能？ 目前的规划是比较乐观的估计，虽然已经经历过下修。尤其是在北美或美国地区，大概率会继续下修。公司通常在9月份前制定一个三年度（2027-2029年）规划，但更精确的年度计划会在次年1月份根据届时情况重新制定。到明年（2027年）1月，对于当年能实际获得的吉瓦数将有更清晰的判断。因此，当前规划在未来半年内可能还会缩小。各家在北美的自建数据中心规模可能都在5吉瓦左右，如果无法达到目标，可能会通过增加租赁、电力共享（power share）、主机托管或在海外市场补充等方式来弥补。 在实现明年（2027年）数据中心扩张规划的过程中，最主要的瓶颈环节是什么？ 今年（2026年）最大的瓶颈是芯片供应不足，导致机柜数量不够。但从明年（2027年）开始，主要瓶颈将转变为数据中心的可用性。因为芯片供应通过长期协议和提前预付款等方式，明年的供应量已基本得到保证。然而，数据中心的投资建设是基于早前（如5吉瓦级别）的规划进行的，如果明年的实际需求远超原有规划，数据中心的供应将成为限制因素。 在资源有限的情况下，如何对新到货的芯片进行安装优先级排序？当前供应链的主要瓶颈是机柜还是芯片等其他组件？ 在芯片供应有限时，AWS会进行分批或优先排序安装。例如，当同时有NVIDIA卡、自研的TRAINING卡以及其他类型的卡（如AMD或用于inference的卡）到货时，AWS会优先安装NVIDIA卡，然后是Trainium卡，而其他卡的安装则会暂缓。就2026年而言，核心的瓶颈在于芯片，特别是AWS自研的Trainium卡供应相对紧张，相比之下，NVIDIA卡的供应情况尚可。机柜、网络或存储等其他组件并非当前最主要的制约因素。 考虑到因交付问题导致的功耗规划（吉瓦数）下修对资本市场可能被解读为利空，这是否也意味着鉴于AWS强劲的需求，增长周期实际上被拉长了，呈现出“短空长多”的态势？ 可以这么理解。一旦数据中心的问题在2027至2028年得到解决，或者AWS能够将设施部署到海外，收入仍会上升。总体趋势是需求高于供给，这一状况在2029年之前不太可能改变，只是不同阶段的制约因素不同。2026年的瓶颈主要是芯片、液冷或光模块，而2027年的制约因素将主要是数据中心。 当前是否有明确的信号表明资本开支会因需求减弱而非交付问题被削减？ 2026年至今并未观察到因需求减弱而削减资本开支的迹象。从另一个侧面看，半导体设备供应商（如应用材料）的订单情况非常乐观，其订单量甚至超过了2000年时的水平，这反映了半导体行业的真实需求。这些设备的交付周期很长，例如，现在下的设备订单可能要到2027年才能交付，其产出的晶圆则要到2027年底或2028年才能开始生产。因此，市场对2028年之前的需求基本没有太大疑虑，相关的产能投入，包括台积电的2纳米、3纳米制程以及内存产能，很多都已通过长期合同锁定。这类长期合同通常一签就是五年，为未来的需求提供了一个底线保障。 关于AWS目前3,600亿美元的积压订单，其可被100%执行的比例大概是多少？ 目前积压订单的具体执行比例尚不清楚，这属于销售范畴。不过，在当前供给相对紧张的情况下，AWS会尽力执行所有已签订的合约，这主要是一个时间问题。公司通常不会毁约，除非是客户方面不再需要。公司现在也鼓励客户签订长期合同，并通过价格杠杆等方式尽量减少短期零散订单。只要公司的容量能够跟上，这些积压订单基本上都会被执行。 明年（2027年）规划的7吉瓦新增容量是否已基本被预订完毕？其中AI和传统云业务的构成是怎样的？ 明年7吉瓦新增容量中，用于AI的部分已基本被预订完毕。这7吉瓦的总量中包含了传统云业务，AI部分的增量大约为5吉瓦，不会达到6吉瓦，因为公司的传统云业务体量较大。需要说明的是，除了少数专用的AI数据中心（如为Anthropic项目服务的\"mount project\"和\"renie\"），公司大部分自建的数据中心都是混合工作负载（mix work）模式，同时承载AI和非AI业务。而新增容量中用于传统业务的部分，通常是为了在巴西、墨西哥等新区域进行市场扩张，属于先期投资，客户会后续逐步引入。 对于AI业务中Rubin这类机柜，其单机柜资本开支的体量大约是多少？其中存储部分的成本构成是怎样的？ Rubin这类机柜的资本开支大约在500万美元左右，未达到600万美元。此成本构成中，约一半来自于存储部分，主要包括HBM和DRAM。采购策略上，倾向于从供应商处购买包含核心部件（如GPU、NVLink）的最低配置版本，即减配了部分SoC和DRAM，然后根据自身需求自行添加其余组件，以规避供应商在附加组件上设定的高利润率。 在服务器架构设计上，是否会采用多个（例如两到四个）Rubin机柜共享一个独立的内存机柜（Memory Pooling）的方案？以及NAND存储是部署在柜内还是柜外？ 目前不太倾向于采用大规模内存池化、设置独立内存机柜的方案，主要原因是DRAM成本过高。即使需要此类配置，也倾向于自行组建而非直接采购供应商提供的集成方案，以控制成本。对于NAND存储的部署，虽然柜内也会配置一部分，但基本上以柜外部署为主。 柜外NAND存储的配置比例，例如几个计算柜对应多少存储，是否有具体规划？ 具体的配置方案尚未最终确定。由于Rubin机柜计划于2026年第四季度才正式上线，相关的规划将在明年（2027年）完成。 关于NPU产品，其订单和出货的预期时间节点是怎样的？市场预期的1.5亿只NPU光模块需求是否可能发生变化？ NPU产品与Trainium 4这一代芯片严格绑定，预计Trainium 4在2026年下半年或年底开始出货，因此NPU的真正放量时间点将在2028年。这比市场之前的预期要慢一些，可能会出现一定的延迟。市场对1.5亿只NPU光模块的需求预期也可能因此受到影响。此外，公司计划在2027年开始销售自研芯片，届时将采用不同于现有产品的节奏，可能会以板卡或定制机柜的形式提供给客户，而不仅仅是纯粹的训练或推理芯片。 市场上有观点认为CPO方案因良率和维护成本问题进展较慢，NPU方案在未来一两年内是否会成为更确定的主流技术路线？ CPO方案确实面临良率较低和维护成本高昂的挑战，一旦损坏需要整体更换，这影响了其推广。相较之下，NPU的进展相对更快。 关于存储产品的价格，当前NAND闪存的价格趋势如何？2026年第三季度的价格与第二季度相比有何变化？ NAND价格存在一个长期协议中的上限价格（Ceiling Price），只要市场现货价未触及此上限，则按当前市场价执行。目前尚未触及上限。以折算成ESSD后的单GB价格计算，2026年第三季度的价格大约在0.4至0.5美元之间。与第二季度相比，第三季度NAND价格环比涨幅显著。 DRAM在2026年第三季度的价格走势如何？ DRAM价格已基本趋于平稳，未出现大幅上涨。由于大部分已签订长期供货协议，第三季度的价格基本与第二季度持平，或略有小幅上涨，但远未触及协议的上限价格。部分7月份新签的协议将在第四季度开始执行。目前单价大约在2.3美元左右。 为何NAND闪存不像DRAM那样普遍签订长期供货协议？ 主要原因是供应商预期NAND价格的上涨周期会比DRAM更长。由于当前NAND单价较低，供应商希望通过维持现货交易来更长时间地享受价格上涨带来的收益。签订长期协议会锁定未来（如2027、2028年）的收入上限，这不符合供应商的利益。 关于NAND和DRAM的采购，能否介绍一下明年的合约谈判进展、价格预期以及主要的供应商情况？ 公司70%的SSD是通过采购NAND颗粒（Raw NAND）后自行组装完成。主要的NAND颗粒供应商并非三星、海力士等大厂，而是Micron、Sandisk、Kioxia等规模相对较小的厂商。目前，以Sandisk为代表的供应商普遍预期价格将继续上涨，因此不太愿意立即签订长期合约。尽管如此，预计到2026年Q3或Q4，随着谷歌等行业主要参与者完成签约，其他厂商也会跟进，届时2027年的合约基本会敲定。从价格预期来看，DRAM的合约价格可能在每GB 2.2至2.3美元左右，NAND则在每GB 0.45至0.5美元之间，这一价格水平在可接受范围内，因为不接受则意味着无法获得供应量。 在与存储原厂进行价格谈判时，公司的议价能力如何？尤其是在2027年至2030年的长期协议中，有哪些可以商谈的空间？ 在2027年和2028年的价格谈判中，议价权非常有限，基本处于供应商“不接受就没量”的强势地位。不过，供应商为了锁定2029年和2030年的收入，愿意在谈判中做出一些让步。具体而言，他们愿意牺牲2027-2028年部分潜在的收入上限，以换取在2029-2030年市场可能下行时获得有保障的收入。可谈判的空间主要体现在两个方面：一是2029-2030年的底价（floor price）和采购量；二是预付款问题，供应商希望现在收取一笔预付款，然后在2029-2030年通过返点形式返还。 在长期协议中，2027年和2028年的底价（floor price）是如何设定的？供应商愿意现在谈判长期协议的深层原因是什么？ 长期协议中设定了底价，例如DRAM的底价大约是最高成本（C0）的一半，约为每GB 1美元左右，但市场价格触及此底价的可能性不大。供应商当前愿意积极商谈长期协议，主要是出于对未来市场竞争格局的担忧。他们预见到中国的长鑫存储和长江存储上市后，其新增产能将对整个行业造成巨大冲击。因此，供应商希望通过签订长期协议来提前锁定公司的购买力，以应对2029-2030年可能出现的市场威胁。 在长期协议中，2027年至2030年锁定的采购量占总需求量的比例分别是多少？ 锁定的采购量比例随年份而变化。2027年锁定的量接近总需求量的100%；2028年约为预估需求量的90%，保留了约10%的弹性空间。对于2029年和2030年，由于需求预测不确定性较大，目前仅锁定了预估需求量的70%至80%，保留了20%至30%的灵活采购空间，以便在市场出现更低价格时进行采购。 请问公司对2027年和2028年DRAM、HBM及NAND的需求量增长预期分别是多少？ 2027年，DRAM的需求量预计为1.3至1.5 EB，HBM的需求量约为1.5 EB。对于NAND，2027年的需求增量预计为130 EB。进入2028年，整体需求将呈现微增态势。在已锁定的长期协议中，DRAM和HBM的总量将在2027年的基础上增加约10%至20%，达到3 EB左右（DRAM和HBM各占一半）。需要指出的是，公司预期的实际需求增长速度会快于协议锁定的增长部分。至于2028年NAND的需求量，由于供应商目前商谈意愿不强，尚未形成明确的框架，预计到今年9月会有更清晰的数据。 对于NAND的长期供应，是否存在担忧？ 对NAND的长期供应并不特别担心。首先，NAND的供应商数量较多，目前至少有五家可供选择。其次，长江存储等中国厂商上市后将释放大量产能，这部分产能可以吸收如阿里云等其他用户的需求，从而间接缓解市场供应压力。虽然当前NAND价格上涨较快，但从长期来看，其供应将比DRAM更为充足。主要的挑战可能集中在2027年和2028年，但考虑到NAND本身价格相对便宜，即使价格上涨，总体影响仍在可控范围内。 公司如何看待CXL内存池化技术？该技术是否会对未来的内存采购策略产生影响？ CXL技术内部也经常讨论。这项技术的好处在于能够通过池化增加内存容量并提高利用率。然而，从整体市场角度看，虽然单体利用率提高了，但CXL技术的应用反而可能会促进内存总使用量的增加。 在当前DRAM成本压力下，公司内部是否有考虑采用NAND替代部分DRAM的技术方案？ 目前尚未大规模采用NAND替代DRAM的方案。主要原因是NAND的读写速度远低于DRAM，存在数量级上的差距。虽然NAND可以用于分担一部分存储任务，但无法满足实时运算场景下对DRAM性能的要求。 鉴于上游硬件（如计算卡、存储）成本上涨，AWS客户对价格调整的接受程度如何？ 价格上涨主要影响的是按需实例（散单）用户，而与主要客户签订的长期协议价格并未大幅上涨，具体价格取决于协议期限和使用量。公司不希望大量服务按需实例客户，因为这会导致容量需求的剧烈波动。因此，价格杠杆也被用作一种策略，旨在引导客户转向签订长期协议，以稳定容量规划。 亚马逊推出的AI Agent等新产品，目前是否主要处于尝试阶段，其对零售业务的实际影响如何？ 这些AI产品的推出更多是为了提高内部运营效率，预计对营业收入的增长影响有限。无论是由人工客服还是AI Agent提供导购服务，消费者的购买力是相对固定的，因此不会引起销售额的巨大变化。其主要益处在于提升内部工作效率，可能有助于减少招聘需求或进行人员优化。 面对2026年自由现金流可能转负以及未来发债的可能性，公司内部是如何看待这一资本策略的？ 公司的长期增长逻辑是持续将所获利润全部投入到业务发展中，这一策略也为资本市场（华尔街）所接受。只要有投资者愿意购买债券，这种模式就可以持续。这与微软的策略不同，微软更注重盈利能力，会削减不赚钱的部门，例如对Xbox业务的调整，在硬件发展上非常谨慎，追求高利润增长。而公司的核心是注重增长，利润率是次要考虑因素。 AWS针对Anthropic和OpenAI等大客户的云服务定价策略是怎样的？长期协议中是否包含成本转嫁机制？ 与这两家客户的定价主要包含两种模式。第一种是基于长期协议的算力租赁，协议在2026年初已经签订，涵盖了特定时期、特定数量和类型的计算卡。第二种是在AWS Bedrock平台上销售其模型API时进行的收入分成。当企业客户（如苹果）通过Bedrock调用Anthropic的模型时，AWS会先从客户支付的费用中抽取一定比例（例如，对Anthropic为50%）的收入，然后再进行结算。如果客户在下半年或2027年需要新增当前长期协议之外的NVIDIA计算卡，则需要另行商议新的定价。 现有的长期协议中虽然包含一定的成本转嫁条款，但其调整幅度不足以覆盖当前物料价格的涨幅。不过，通过API销售进行收入分成的模式受成本上涨的影响较小，且利润空间更大。公司和合作伙伴都希望API销售业务能快速增长，因为其主要面向企业客户，这与Anthropic和OpenAI拓展企业市场的目标一致。 从投资回报的角度看，新建一个AI数据中心的ROI水平和资本支出的现金层面大致需要多久可以收回？ 从多年维度看，AI数据中心的投资回报率预计将高于公司当前的整体运营利润率（operating margin），可能达到40%至50%或更高。以API收入分成为例，公司直接从客户收入中抽取高达50%的分成，这部分收益的利润率非常可观。关于资本支出的具体现金回本周期，目前尚未进行精确测算。 对于AI相关的电力消耗规划，2027年的增长似乎有所放缓，主要原因是什么？ 2027年增速放缓的主要瓶颈在于物理层面的限制，例如数据中心的建设速度。为应对这些限制，公司可能会更多地采用自研的、功耗较低的芯片。此外，自研芯片部门计划于2027年独立，届时其部分产能将出售给外部客户，而不再全部由内部消化。 从建设角度来看，当前的工作状态是否非常繁忙？市场对2028年及以后增长放缓的担忧是否普遍？ 当前的工作状态与之前任何一个扩张周期没有本质区别，始终处于非常繁忙的阶段，持续在为数据中心寻找土地和计算卡资源。市场对短期波动的敏感更多是消息层面的反应。对于增长前景，市场普遍认为2029年增速可能会放缓，但对2028年的情况尚不明确，因为当前行业变化速度很快，预测为时尚早。与其他几大云厂商（如谷歌）交流得到的信息也类似，他们2027年的规划也大致在5到6吉瓦的水平，但普遍认为完全兑现存在较大难度，因为所有厂商的规划总和可能已超过电网和土地等基础设施的实际承载能力。", "status": "extracted"}, "post:2026-08-04T09-50:1213b943009f": {"id": "post:2026-08-04T09-50:1213b943009f", "kind": "post", "title": "2026-08-04 09:50", "source_label": "帖子正文", "excerpt": "【国金宏观】海外科技信息追踪-20260804https://share.note.youdao.com/ynoteshare/index.htm...一是AI监管正由芯片出口进一步延伸至前沿模型能力、发布审查和跨境访问。美国拟建立前沿模型发布前自愿提交及网络攻击能力测试机制", "content": "【国金宏观】海外科技信息追踪-20260804https://share.note.youdao.com/ynoteshare/index.htm...一是AI监管正由芯片出口进一步延伸至前沿模型能力、发布审查和跨境访问。美国拟建立前沿模型发布前自愿提交及网络攻击能力测试机制；中国则将美国模型的网络攻击能力纳入国家安全关切，并研究在美国进一步限制中国AI企业时采取实体清单或制裁等反制措施。 二是中国模型竞争继续沿“能力提升＋低成本＋开放权重”推进。阿里发布2.4万亿参数Qwen3.8-Max并计划开放权重；DeepSeek V4-Flash每项基准测试平均成本仅0.03美元，但综合能力仍落后于Kimi K3及美国产业前沿模型，低成本与高性能之间的分层进一步显现。 三是AI需求正在重塑全球存储产能配置。三大存储原厂2027年DRAM与HBM产能已接近完成分配，部分客户获配量可能仅为申报需求的60%—70%，AI服务器对产能的优先占用继续挤压PC和手机；长鑫存储则考虑在北京建设第二座12英寸DRAM工厂，上海、合肥等扩产项目完全投产后，其月产能可能增至60万片以上。 四是AI供应链短...", "publish_time": "2026-08-04 09:50", "tags": ["文字观点"]}, "post:2026-08-04T07-28:61dd6685af22": {"id": "post:2026-08-04T07-28:61dd6685af22", "kind": "post", "title": "2026-08-04 07:28", "source_label": "帖子正文", "excerpt": "简单谈谈我对美股云暴涨的理解。最近一两周我一直认为，大模型爆发阶段a股最受益的就是算租或者token分成，今晚的美股充分展示了这一论断。", "content": "【招商海外商社】沪上阿姨2026上半年公开业绩交流会纪要https://share.note.youdao.com/ynoteshare/index.htm...#笔记链接", "publish_time": "2026-08-04 07:28", "tags": ["笔记链接"]}, "attachment:files/中泰证券-绿盟科技(300369)立足AI安全前沿，老牌安全厂商焕新启航-260801.pdf": {"id": "attachment:files/中泰证券-绿盟科技(300369)立足AI安全前沿，老牌安全厂商焕新启航-260801.pdf", "kind": "attachment", "title": "中泰证券-绿盟科技(300369)立足AI安全前沿，老牌安全厂商焕新启航-260801", "source_label": "中泰证券", "excerpt": "请务必阅读正文之后的重要声明部分立足AI安全前沿，老牌安全厂商焕新启航 绿盟科技（300369.SZ） 软件开发", "content": "请务必阅读正文之后的重要声明部分立足AI安全前沿，老牌安全厂商焕新启航 绿盟科技（300369.SZ） 软件开发证券研究报告/公司深度报告 2026年08月01日 评级：增持（首次） 分析师：苏仪 执业证书编号：S0740520060001 Email：suyi@zts.com.cn 分析师：刘一哲 执业证书编号：S0740525030001 Email：liuyz03@zts.com.cn 基本状况 总股本(百万股) 810.62 流通股本(百万股) 807.70 市价(元) 7.44 市值(百万元) 6,031.03 流通市值(百万元) 6,009.31 股价与行业-市场走势对比 相关报告公司盈利预测及估值 指标 2024A 2025A 2026E 2027E 2028E 营业收入（百万元） 2,358 2,541 2,765 3,020 3,313 增长率yoy% 40% 8% 9% 9% 10% 归母净利润（百万元） -365 -45 29 65 111 增长率yoy% 63% 88% 165% 123% 70% 每股收益（元） -0.45 -0.06 0.04 0.08 0.14 每股现金流量 0.17 0.27 0.20 0.31 0.35 净资产收益率 -14% -2% 1% 3% 5% P/E -16.5 -133.3 206.2 92.3 54.3 P/B 2.4 2.3 2.6 2.7 2.7 备注：股价截止自2026年07月31日收盘价，每股指标按照最新股本数全面摊薄 报告摘要 立足AI安全前沿，老牌安全厂商焕新启航。绿盟科技是国内领先的企业级网络安全 解决方案供应商，也是较早从事网络安全的企业之一。公司于2000年成立，2014年 在深交所创业板上市。公司自创立以来始终专注于信息安全领域，通过持续的自主研 发和技术创新，在全球范围内，为政府、金融、运营商、能源、交通、科教文卫等行 业用户，提供企业级全线网络安全产品、全方位安全解决方案和体系化安全运营服务。 公司业绩整体稳健，收入增长整体稳定，费用率在积极管控下近年持续下降，亏损快 速收窄。2025年，公司实现营业收入25.41亿元，同比增长7.78%；归母净利润为 亏损0.45亿元，亏损同比减少87.60%。同时，公司自 及规范性文件为行业市场纵 深推进和拓展带来了新的发展机遇，切实推进着我国网络安全保障体系持续 完善发展。根据IDC《中国IT安全市场预测，2025-2029》显示，在政策 法规持续强化、企业安全投入意愿提升以及新技术应用加速的共同作用下， 中国网络安全市场保持稳健增长。IDC预计到2026年，整体市场规模有望 突破800亿元人民币，2024-2029年年复合增长率达到8.9%。网络安全已 成为数字经济发展中不可或缺的关键基础能力。 2.2行业利好政策频发，驱动行业加速发展 仅供内部参考，请勿外传 公司深度报告 -11- 请务必阅读正文之后的重要声明部分2025年国家围绕“扎实推动高质量发展”这一全局目标，统筹推进战略规 划、法规标准、市场推进、产业赋能等要素综合施策。随着法律法规的颁布 实施，带动各行业单位持续加大网络安全建设投入，推动关键信息基础设施 和重要业务系统安全防护能力发展，2025年10月，第十四届全国人大常 委会第十八次会议表决通过关于修改《网络安全法》的决定，并于2026年 1月1日起施行。此次修订不仅意味着合规要求升级，更是重构安全与发展 的平衡逻辑。此外，国家陆续颁布如《个人信息出境认证办法》《人工智能 生成合成内容标识办法》《关键信息基础设施商用密码使用管理规定》《国 家数据基础设施建设指引》《国家网络安全事件报告管理办法》等法律法规、 标准、安全指南，构筑起基础法律体系。未来各行业网络安全政策将持续细 化落地，在操作层面不断推进落实“三法一条例”的制度要求，健全我国网 络安全政策法规体系。 图表13：2025年以来网络安全行业部分重要政策汇总 时间 部委 政策名称 主要内容 2025/1国家发展改革委、 国家数据局《公共数据资源登记管理暂行 办法》国家数据局加强公共数据资源登记管理，推进登记服务标准化，依托登 记信息和政务数据目录，建立健全公共数据资源目录。建设国家公共数 据资源登记平台，实现与各省级公共数据资源登记平台对接，推动登记 信息互联互通。在全国范围内实现电子凭证“一证一码”，支撑登记信 息的查询和共享。 2025/2国家互联网信息办 公室《个人信息保护合规审计管理 办法》对合规审计活动的开展、合规审计机构的选择、合规审计的频次、个人 信息处理者和专业机构在合规审计中的义务等作出细化规定，旨在为个 人信息处理者开展个人信息保护合规审计提供系统性、针对性、可操作 性的规范，提升个人信息处理活动合法合规水平，保护个人信息权益。 2025/3国家互联网信息办 公室、工业和信息 化部等四部门《人工智能生成合成内容标识 办法》按照《互联网信息服务算法推荐管理规定》、《互联网信息服务深度合 成管理规定》、《生成式人工智能服务管理暂行办法》相关要求开展人 工智能生成合成内容标识活动的，应当符合《标识办法》相关要求。 2025/4国家市场监督管理 总局《网络交易合规数据报送管理 暂行办法》主要规定了网络交易合规数据报送、使用和管理相关内容。 2025/4国家密码管理局、 国家互联网信息办 公室、公安部《关键信息基础设施商用密码 使用管理规定》规范关键信息基础设施商用密码使用，保护关键信息基础设施安全。 2025/5 中国人民银行《中国人民银行业务领域数据 安全管理办法》规范中国人民银行业务领域数据的安全管理并促进开发利用。 2025/5公安部、国家互联 网信息办公室等六 部门《国家网络身份认证公共服务 管理办法》主要规定了四个方面内容：一是明确了国家网络身份认证公共服务及网 号、网证的概念、申领方式；二是明确了使用国家网络身份认证公共服 务的效力、应用场景；三是强调了国家网络身份认证公共服务平台、互 联网平台等对数据安全和个人信息保护的责任；四是对未成年人申领、 使用国家网络身份认证公共服务作出特殊规定。 2025/6 国务院 《政务数据共享条例》推进政务数据安全有序高效共享利用，提升政府数字化治理能力和政务 服务效能，全面建设数字政府。 2025/6 国家网信办《数据出境安全评估申报指南 （第三版）》《指南》规定，数据处理者因业务需要向境外提供重要数据和个人信息， 符合数据出境安全评估适用情形的，应当根据《数据出境安全评估办法》 和《促进和规范数据跨境流动规定》，按照申报指南申报数据出境安全 评估。 2025/7 国务院《关于深入实施“人工智能+” 行动的意见》旨在推动人工智能技术与经济社会各领域深度融合，并于2025年12月 入选当年国内十大科技新闻。 2025/9国家互联网信息办 公室《国家网络安全事件报告管理 办法》自2025年11月1日起施行，《办法》主要对网络安全事件报告适用范 围、监管职责、报告主体、报告流程、报告时限、报告内容等提出规范 要求。 2025/10中央网信办、国家 发展和改革委员 tle": "2026-08-04 18:12", "source_label": "帖子正文", "excerpt": "周二舆情热度： ①算力硬件-机构称，预计2026年全球九大云厂商合计资本支出规模将突破8867亿美元，同比增幅接近90%。", "content": "周二舆情热度： ①算力硬件-机构称，预计2026年全球九大云厂商合计资本支出规模将突破8867亿美元，同比增幅接近90%。（中威电子、宏景科技、利通电子、协创数据、盈峰环境等） ②AI应用-全球多模型聚合平台OpenRouter发布最新一周Al大模型调用量榜单，排名前五的产品全部由中国企业研发。（传智教育、汉仪股份、华凯易百、中威电子、天娱数科、国安股份等） ③机器人-机构称，特斯拉、宇树、智元等稳步推进量产节奏，人形机器人正处于迈向规模化商业化的破晓时刻。（胜通能源、中威电子、格力博、泰坦股份、明新旭腾、京基智农、山子高科、飞利信等） ④云服务-亚马逊云业务营收增速创18个季度新高，九大云服务商(CSP)在7月底迎来一轮资本支出上调潮。（美利云、飞利信、利通电子、润建股份、宏景科技、东阳光等） ⑤低价股-市场高低切效应显著，低价股作为长时间被压制抽血的板块，价值有望得到重估（凯撒文化、山子高科、实达智能、国安股份、奥瑞德、大晟文化、飞利信等） ⑥Palantir-AI应用拐点将至？Palantir业绩炸裂，美股盘后飙涨近15%（国安股份、飞利信、中新赛克、慧辰股份、国投智...", "publish_time": "2026-08-04 18:12", "tags": ["文字观点"]}, "post:2026-08-04T07-26:8c53e7876843": {"id": "post:2026-08-04T07-26:8c53e7876843", "kind": "post", "title": "2026-08-04 07:26", "source_label": "帖子正文", "excerpt": "【东吴计算机】美股云和租赁大涨，商业模式闭环与地位升级 美股云厂微软涨5%（连续三日涨24%），谷歌涨5%（连续三日涨11%），亚马逊涨5%（连续三日涨26%）。", "content": "【东吴计算机】美股云和租赁大涨，商业模式闭环与地位升级 美股云厂微软涨5%（连续三日涨24%），谷歌涨5%（连续三日涨11%），亚马逊涨5%（连续三日涨26%）。 算力租赁nebius涨12%，coreweave涨15%。 北美云业务商业闭环。亚马逊2026年Q2，AWS云服务营收422亿美元，同比增长37%，云利润166亿美元，同比增长64%，云利润率39.4%。微软Azure及其他云服务收入同比增长43%。公司预计下一季度固定汇率口径下，Azure增速约为45%。 云业务地位升级。模型开源与token价格降低，将促进下游应用对云的需求，进一步拉动云业务的增长和提升盈利能力。同时，模型开源，云厂自己部署大模型，云业务在AI产业链里的地位也将提升，分得更多利润。 算力租赁也将同步受益。一方面，算力租赁做为云业务的支撑和补充，需求将一进步提升。另一方面，token分成商业模式的落地以及模型开源，部分算力租赁公司也将晋升为“新云厂”，行业地位提升。 相关标的： 云：阿里巴巴、金山云、优刻得等。 算力租赁：宏景科技、协创数据、利通电子、盈峰环境、中威电子、行云科技等。 风险提示...", "publish_time": "2026-08-04 07:26", "tags": ["文字观点"]}, "post:2026-08-04T09-42:2b23372004b0": {"id": "post:2026-08-04T09-42:2b23372004b0", "kind": "post", "title": "2026-08-04 09:42", "source_label": "帖子正文", "excerpt": "关注大模型与云厂为代表的5大主线： 杭州D模型：利通电子 北京K模型：行云科技 北京Z模型：宏景科技 北京Z云：香江控股 杭州A云：协创数据&宏景科技 A云新秀：金刚光伏&京基智农", "content": "【华福计算机】美股云计算持续大涨，算租就是A股的云，强烈推荐❗20260804 #大模型的超额收益在向云计算转移。开放权重模型崛起，云计算受让更多产业议价权，当前国内外云计算产业数据&叙事强势，是AI板块阻力最小方向。 #算力租赁是国内高端云资源的唯一来源。国内云计算高端算力紧缺，算力租赁是唯一解题答案，当前在产业链占据有利位置，算力租赁就是A股的云计算。 建议重点关注大模型与云厂为代表的5大主线： 杭州D模型：利通电子 北京K模型：行云科技 北京Z模型：宏景科技 北京Z云：香江控股 杭州A云：协创数据&宏景科技 A云新秀：金刚光伏&京基智农 联系人：袁家亮/钱劲宇#文字观点", "publish_time": "2026-08-04 09:42", "tags": ["文字观点"]}, "attachment:files/0803脱水研报.pdf": {"id": "attachment:files/0803脱水研报.pdf", "kind": "attachment", "title": "0803脱水研报", "source_label": "其他", "excerpt": "关注行云科技、利通电 子、宏景科技等。核心 公司包括 行云科技 、利通电子 、宏景科技 等。", "content": "28.03 60.80一个月 3份订单一个比一个价格高， “客户主动提 价+翻倍锁量 ”抢算力，算力租赁行业后续业绩会 炸裂；龙头估值砸到 15-25倍，机构持仓不到 0.1%，这个被机构遗弃的板块，基本面却率先回 暖了——0803 脱水研报 2026/08/03 19:50 今日内容： 1、一个月 3份订单一个比一个价格高， “客户主动提价 +翻倍锁量 ”抢算力，算力租赁行业后续业绩 会非常炸裂。 2、燃气轮机细分子行业！受益于 AIDC建设，大缸径气缸套及活塞价值量或更高。 3、“十五五 ”首批8台核电机组落地，核电审批常态化 +技术升级双轮驱动，核电量价双拐点已现， 布局窗口已至。 4、龙头估值砸到 15-25倍，机构持仓不到 0.1%，这个被机构遗弃的板块，基本面却率先回暖了。 【本文来自持牌证券机构，不代表平台观点，请独立判断和决策】 摘要： 1、算力租赁： 浙商证券指出，行云科技 7月内连续与三家客户签署补充协议，合同涨幅最高 达201%。三笔加价构成三层兜底：价格兜底转嫁硬件涨价风险、规模兜底锁定产能优先分配 权、条款兜底确保收入下限。三笔订单年租金收敛至 226-239万元统一价格带，上游供应商接 受利润分成。算力租赁业务供需两旺，业绩兑现确定性显著抬升。关注行云科技、利通电 子、宏景科技等。 2、气缸套： 华源证券研报覆盖了一个燃气轮机细分子行业大缸径气缸套 &活塞。气缸套是镶 在内燃机缸体内的筒形零件；活塞则是在进气、压缩、做功、排气等各冲程中在气缸内进行 往复运动的部件，二者是发动机中工作条件最恶劣、最关键的零件之一。两者都有望受益于 AIDC建设需求。相关公司中原内配、渤海汽车等。 3、核电： 长江证券研报指出， “十五五 ”首批8台核电机组获批，延续常态化审批，中国核电 / 中广核 /电投产融分别获 4/2/2台，在建待建机组达 22/20/6台。《新型能源体系规划》明确 2030年在运核电装机达 1.1亿千瓦。辽宁、广西试点机制电价（差价结算）有望向粤浙闽苏推 广，稳定核电收益预期。本次核准华龙一号 2.0版（金七门二期、太平岭三期）和国和一号 （莱阳一期）并举，技术升级 +模块化建造打开中游增量。核电量价双拐点已现，中国核电、 中广核电力 H，关注中游建设环节。 4、美护： 国泰海通证券研报指出，美护板块跌了一年（申万美容护理 YTD -18% ），机构持 仓不到 0.1%、龙头估值砸到 15-25倍，但基本面没崩： 26H1化妆品社零 +6%、6月单月 +13%，彩妆 +13%、美发 +17%，雅诗兰黛兰蔻等高端外资双位数复苏。 故事从 “国货狂奔 ”切 到“高端修复 +底部捡便宜 ”，珀莱雅、毛戈平、巨子生物、贝泰妮、爱美客都在坑里等着风格 再平衡。 正文： 1、一个月 3份订单一个比一个价格高， “客户主动提价 +翻倍锁量 ”抢算力，算力 租赁行业后续业绩会非常炸裂   浙商证券指出， 行云科技 7月内连续与三家客户签署补充协议 —— 下游在验证交付能力后主动 加价锁量，三笔合同涨幅最高达 201% ，高额的违约金更是锁死了收入下限。这一变化标志算 力租赁定价逻辑正从 “ 谁能拿到 GPU” 切换至 “ 客户是否愿意加钱 ” ，行业进入加价潮阶段。核心 公司包括 行云科技 、利通电子 、宏景科技 等。 1）从签约潮到加价潮：一月三签、最高涨 201% 行云科技 在2026年 7 月内，接连与 VC 客户、 V 客户、 VB 客户签下三笔补充协议， 下游客户在 加价锁定算力。 01 02 2）三层递进锁定收入确定性 ①第一层：价格兜底 —— 客户主动提价，为硬件涨价风险兜底。 B300服务器国内渠道报价已从年初约 400 万元 / 台升至 7 月约 1450 万元 / 台，美国官方售价约 55 万美元，算力硬件价格处于快速上行通道。对算租厂商而言，最大经营风险是 “ 高价采购设 备、低价签长期合同 ” 的错配 —— 而三家客户在签约后仅 1-3 个月内主动重签合同提价，实质是 把硬件涨价风险从算租厂商转嫁回了需求方。这意味着项目收益率在设备采购前即被锁定， 而非事后被动承担成本上行。 ②第二层：规模兜底 —— 翻倍锁量，为产能扩张兜底。 VB客户在仅交付 8 个单元的情况下，直接将订单量翻倍至 256 个单元，并要求 8 个月内完成全 部交付。客户在供给紧缺期锁定的并非当下算力，而是未来 8 个月的产能优先分配权 —— 规模 翻倍验证的是供不应求的持续性，而非一次性的需求脉冲。 ③第三层：信用与条款兜底 —— 违约金 + 保证金 + 固定收入，锁定收入下限。 三笔订单的客户结构（ 1 家央企上市公司 +1 家头部大模型厂商）本身即为履约信用背书，条款 设计进一步强化了收入确定性。   VC合同则约定任何一方提前终止构成严重违约，违约金为剩余租金的 100% 。 03 3）从 “签约潮 ” 到 “ 加价潮 ” ：算力租赁定价逻辑切换 26年上半年算力租赁板块的上涨主要由 “ 签约潮 ” 驱动 —— 市场定价的是供给端的拿卡能力，本 质上是在交易 “ 谁能拿到 GPU” 。 而行云科技 三签补充协议标志着行业正在进入 “ 加价潮 ” 阶段，定价逻辑从供给端切换至需求端 ——市场开始验证： “ 客户是否真的愿意为算力付更多钱？ ” 04 4）相关公司 算力租赁老牌龙头： 利通电子 、协创数据 、宏景科技 等； 转型算力租赁且有成效： 行云科技 、杰创智能 、华策影视 、平治信息 等； IDC业务：东阳光、润泽科技 、三人行等； 美股算租龙头： Nebius ， CoreW eave 。 2、燃气轮机细分子行业！受益于 AIDC 建设，大缸径气缸套及活塞价值量或更 高   华源证券研报覆盖了一个燃气轮机细分子行业大缸径气缸套 & 活塞。气缸套是镶在内燃机缸体 内的筒形零件；活塞则是在进气、压缩、做功、排气等各冲程中在气缸内进行往复运动的部 件，二者是发动机中工作条件最恶劣、最关键的零件之一。两者都有望受益于 AIDC 建设需 求。 价值量方面 ，中原内配 单只气缸套价值量为几十元；单只活塞价值量依据材质（例如铝 / 钢） 等不同而有所不同，单价在几十元、几百元甚至千元不等。预计对应大缸径产品价值量或更 高，大缸径气缸套及活塞作为发动机的重要组成部分，将受益于 AIDC 建设需求。 供应格局方面 ，活塞、气缸套的供应商主要包括马勒、辉门、 中原内配 、渤海汽车 等，其中 中原内配 在大缸径气缸套业务（截至 2026 年 4 月，中原内配 大缸径气缸套产品成功配套卡特彼 勒、康明斯、帕金斯、颜巴赫、潍柴、玉柴等，且目前已跻身大缸径气缸套行业核心企业行 列，市场占有率稳居行业前列）、 渤海汽车 在大缸径活塞业务（大缸径活塞的产能利用率一 直维持在较高水平）上布局较积极。 从毛利率水平看， 2021~2025 年中原内配 气缸套毛利率位于 24%~33% 间，渤海汽车 活塞毛利 率位于 13%~20% 间；从部分公司的净利率水平看，气缸套业务方面， 2021~2025 年中原内配 集团安徽有限责任公司净利率位于 18%~26% 间、河南中原吉凯恩气缸套有限公司净利率位于 9~17%间；活塞业务方面， 2023~2025 年滨州渤海活塞有限公司净利率位于 1%~4% 间， 2021~2025 年中内凯思汽车新动力系统有限公司净利率波动则较大。 05 06   3、“十五五 ” 首批 8 台核电机组落地，核电审批常态化 + 技术升级双轮驱动，核电 量价双拐点已现，布局窗口已至 长江证券研报指出， “ 十五五 ” 首批 8 台核电机组获批，延续常态化审批， 中国核电 /中广核 /电投 产融分别获 4/2/2 台，在建待建机组达 22/20/6 台。《新型能源体系规划》明确 2030 年在运核电 装机达 1.1 亿千瓦。辽宁、广西试点机制电价（差价结算）有望向粤浙闽苏推广，稳定核电收 益预期。本次核准华龙一号 2.0 版（金七门二期、太平岭三期）和国和一号（莱阳一期）并 举，技术升级 + 模块化建造打开中游增量。核电量价双拐点已现， 中国核电 、中广核电力 H ， 关注中游建设环节。 1）“十五五 ” 首批 8 台机组获批，延续常态化审批节奏 7月31日，国务院常务会议审议决定核准辽宁庄河一期、山东莱阳一期、浙江金七门二期和广 东太平岭三期等 4 个核电项目，共计 8 台百万千瓦级机组；会议指出，要按照全球最高安全标 准建设和运营核电机组，加强全链条全领域安全监管，务必确保核电安全万无一失。其中， 中国核电 /中国广核 /电投产融获得核准的机组数量分别为 4 台、 2 台、 2 台； 此次核准后， 中国核电 /中国广核 /电投产融核准在建及待建核电机组分别达到 22 台、 20 台、 6 台。自 2019 年核电核准重启以来， 2022-2025 年连续四年每年核准 10 台及以上核电机组，本 次“十五五 ” 首批 8 台机组核准落地，进一步验证核电常态化审批方向，同时考虑到目前尚处年 中，全年核准节奏仍需持续跟踪。 此外，此次核准也与《新型能源体系建设 “ 十五五 ” 规划》提出的 “ 积极安全有序发展核电 ” 相呼 应，同时规划明确到 2030 年我国在运核电装机将达到 1.1 亿千瓦左右，随着核电建设的持续推 进，中国核电 、中国广核 等核电运营商有望持续受益于行业景气度提升。 2）机制电价试点有望陆续推广，收益预期趋稳支撑长期投资 核准常态化打开成长空间的同时，收益预期的稳定性是支撑长期投资的前提。此前，随着电 力市场建设提速，核电入市比例持续提升，市场电价波动带来的收益不确定性，与核电长期   发展、大规模投资所需要的稳定回报之间存在一定错配。而 2026 年辽宁及广西率先试点核电 机制电价：核电机组参与市场交易，同时对一定规模电量按照机制电价进行差价结算。 展望来看，长江证券认为桂辽率先试点的核电机制电价后续有望在广东、浙江、福建、江苏 等其他核电大省推广，核电电价有望获得系统性支撑，在保留市场价格信号的同时，为核电 长期投资所需的合理收益提供稳定器。 当前时点来看，核电量价双维度均迎来拐点，机制电价推动电价预期趋于稳定，同时核电运 营商在 “十五五 ” 期间也将迎来成长的加速兑现，此外本次核电审批落地持续验证政策的积极态 度，看好核电运营商的长期投资价值与当前低位布局机会。 3）核准常态化夯实产业链需求，技术升级打开模块化增量空间 此次核准的 8 台机组中，莱阳一期 2 台机组采用 “ 国和一号 ” 核电技术，金七门二期、太平岭三 期以及庄河一期等 6 台机组均采用 “ 华龙一号 ” 核电技术，其中金七门二期、太平岭三期被确定 为华龙一号 2.0 版示范项目。 华龙一号 2.0 版采用中国标准、自主化软件和优化的能动与非能动安全系统，在智能控制、模 块化建造等方面运用先进技术，使工程量大幅降低，安全性、先进性和经济性得到全方位提 升，具备更强的综合竞争力。核电审批的常态化推进叠加技术升级，有望进一步增强中游核 电建设尤其是模块化业务的需求确定性。 4）相关标的 当前核电量价双维度均迎来拐点：一方面， “ 十五五 ” 期间核电产能扩张将迎来加速兑现；另一 方面，市场化电价上涨预期明确叠加机制电价试点有望推广，共同支撑核电电价修复。此次 “十五五 ”首批 8 台机组核准落地，持续验证政策积极态度与行业长期成长方向。 长江证券认为，当下即是 “ 十五五 ” 期间核电板块最好的布局窗口， 中国核电 与中广核电力 H ， 中游核电建设环节的布局机遇。 4、龙头估值砸到 15-25 倍，机构持仓不到 0.1% ，这个被机构遗弃的板块，基本 面却率先回暖了 国泰海通证券研报指出，美护板块跌了一年（申万美容护理 YTD -18% ），机构持仓不到 0.1%、龙头估值砸到 15-25 倍，但基本面没崩： 26H1 化妆品社零 +6% 、 6 月单月 +13% ，彩妆 +13%、美发 +17% ，雅诗兰黛兰蔻等高端外资双位数复苏。 故事从 “ 国货狂奔 ” 切到 “ 高端修复 +底部捡便宜 ” ，珀莱雅、毛戈平、巨子生物、 贝泰妮、爱美客都在坑里等着风格再平衡。 1）美妆大盘维持稳健增长，彩妆、美发表现亮眼 据国家统计局， 2026 年 H1 限额以上化妆品零售额同比增长 6% 、跑赢社零整体 5pct ，其中受益 于大促及低基数、 6 月化妆品社零同比增长 13% 、彰显行业成长性。据品观数据， 2026H1 主 流电商美妆 2709 亿元，同比增长 5.5% ，表现稳健。 07 分平台看， 26H1 抖音、天猫美妆 GMV 同比 +14% 、 +5% ，抖音维持快速增长、但增速相对收 敛；分品类看， 26H1 主流电商护肤、彩妆、美发护发 GMV 同比 +1% 、 13% 、 17% ，彩妆、美   发表现亮眼，大众护肤压力较为明显。 08 2）高端美奢延续复苏， 26H1 多高端外资美妆品牌实现高增 据品观数据， 26H1 高端外资美妆复苏明显，雅诗兰黛、兰蔻、 LAMER 、 SKII 、赫莲娜、 YSL、修丽可等品牌线上 GMV 实现双位数增长，护肤品类高端复苏明显，彩妆及洗护高端及 平价品牌均有较好表现。 09 10 国泰海通证券认为主因：第一，高端消费修复背景，从奢侈品集团财报看， 2026Q2 爱马仕、 LVMH、开云集团亚太除日本地区可比营收同比 +3% 、 +2% 、 -1% ，延续 25H2 起的边际改善趋 势，欧莱雅中国 26H1 高端 获批，延续常态化审批，中国核电 / 中广核 /电投产融分别获 4/2/2台，在建待建机组达 22/20/6台。《新型能源体系规划》明确 2030年在运核电装机达 1.1亿千瓦。辽宁、广西试点机制电价（差价结算）有望向粤浙闽苏推 广，稳定核电收益预期。本次核准华龙一号 2.0版（金七门二期、太平岭三期）和国和一号 （莱阳一期）并举，技术升级 +模块化建造打开中游增量。核电量价双拐点已现，中国核电、 中广核电力 H，关注中游建设环节。 4、美护： 国泰海通证券研报指出，美护板块跌了一年（申万美容护理 YTD -18% ），机构持 仓不到 0.1%、龙头估值砸到 15-25倍，但基本面没崩： 26H1化妆品社零 +6%、6月单月 +13%，彩妆 +13%、美发 +17%，雅诗兰黛兰蔻等高端外资双位数复苏。 故事从 “国货狂奔 ”切 到“高端修复 +底部捡便宜 ”，珀莱雅、毛戈平、巨子生物、贝泰妮、爱美客都在坑里等着风格 再平衡。 正文： 1、一个月 3份订单一个比一个价格高， “客户主动提价 +翻倍锁量 ”抢算力，算力 租赁行业后续业绩会非常炸裂   浙商证券指出， 行云科技 7月内连续与三家客户签署补充协议 —— 下游在验证交付能力后主动 加价锁量，三笔合同涨幅最高达 201% ，高额的违约金更是锁死了收入下限。这一变化标志算 力租赁定价逻辑正从 “ 谁能拿到 GPU” 切换至 “ 客户是否愿意加钱 ” ，行业进入加价潮阶段。核心 公司包括 行云科技 、利通电子 、宏景科技 等。 1）从签约潮到加价潮：一月三签、最高涨 201% 行云科技 在2026年 7 月内，接连与 VC 客户、 V 客户、 VB 客户签下三笔补充协议， 下游客户在 加价锁定算力。 01 02 2）三层递进锁定收入确定性 ①第一层：价格兜底 —— 客户主动提价，为硬件涨价风险兜底。 B300服务器国内渠道报价已从年初约 400 万元 / 台升至 7 月约 1450 万元 / 台，美国官方售价约 55 万美元，算力硬件价格处于快速上行通道。对算租厂商而言，最大经营风险是 “ 高价采购设 备、低价签长期合同 ” 的错配 —— 而三家客户在签约后仅 1-3 个月内主动重签合同提价，实质是 把硬件涨价风险从算租厂商转嫁回了需求方。这意味着项目收益率在设备采购前即被锁定， 而非事后被动承担成本上行。 ②第二层：规模兜底 —— 翻倍锁量，为产能扩张兜底。 VB客户在仅交付 8 个单元的情况下，直接将订单量翻倍至 256 个单元，并要求 8 个月内完成全 部交付。客户在供给紧缺期锁定的并非当下算力，而是未来 8 个月的产能优先分配权 —— 规模 翻倍验证的是供不应求的持续性，而非一次性的需求脉冲。 ③第三层：信用与条款兜底 —— 违约金 + 保证金 + 固定收入，锁定收入下限。 三笔订单的客户结构（ 1 家央企上市公司 +1 家头部大模型厂商）本身即为履约信用背书，条款 设计进一步强化了收入确定性。   VC合同则约定任何一方提前终止构成严重违约，违约金为剩余租金的 100% 。 03 3）从 “签约潮 ” 到 “ 加价潮 ” ：算力租赁定价逻辑切换 26年上半年算力租赁板块的上涨主要由 “ 签约潮 ” 驱动 —— 市场定价的是供给端的拿卡能力，本 质上是在交易 “ 谁能拿到 GPU” 。 而行云科技 三签补充协议标志着行业正在进入 “ 加价潮 ” 阶段，定价逻辑从供给端切换至需求端 ——市场开始验证： “ 客户是否真的愿意为算力付更多钱？ ” 04 4）相关公司 算力租赁老牌龙头： 利通电子 、协创数据 、宏景科技 等； 转型算力租赁且有成效： 行云科技 、杰创智能 、华策影视 、平治信息 等； IDC业务：东阳光、润泽科技 、三人行等； 美股算租龙头： Nebius ， CoreW eave 。 2、燃气轮机细分子行业！受益于 AIDC 建设，大缸径气缸套及活塞价值量或更 高   华源证券研报覆盖了一个燃气轮机细分子行业大缸径气缸套 & 活塞。气缸套是镶在内燃机缸体 内的筒形零件；活塞则是在进气、压缩、做功、排气等各冲程中在气缸内进行往复运动的部 件，二者是发动机中工作条件最恶劣、最关键的零件之一。两者都有望受益于 AIDC 建设需 求。 价值量方面 ，中原内配 单只气缸套价值量为几十元；单只活塞价值量依据材质（例如铝 / 钢） 等不同而有所不同，单价在几十元、几百元甚至千元不等。预计对应大缸径产品价值量或更 高，大缸径气缸套及活塞作为发动机的重要组成部分，将受益于 AIDC 建设需求。 供应格局方面 ，活塞、气缸套的供应商主要包括马勒、辉门、 中原内配 、渤海汽车 等，其中 中原内配 在大缸径气缸套业务（截至 2026 年 4 月，中原内配 大缸径气缸套产品成功配套卡特彼 勒、康明斯、帕金斯、颜巴赫、潍柴、玉柴等，且目前已跻身大缸径气缸套行业核心企业行 列，市场占有率稳居行业前列）、 渤海汽车 在大缸径活塞业务（大缸径活塞的产能利用率一 直维持在较高水平）上布局较积极。 从毛利率水平看， 2021~2025 年中原内配 气缸套毛利率位于 24%~33% 间，渤海汽车 活塞毛利 率位于 13%~20% 间；从部分公司的净利率水平看，气缸套业务方面， 2021~2025 年中原内配 集团安徽有限责任公司净利率位于 18%~26% 间、河南中原吉凯恩气缸套有限公司净利率位于 9~17%间；活塞业务方面， 2023~2025 年滨州渤海活塞有限公司净利率位于 1%~4% 间， 2021~2025 年中内凯思汽车新动力系统有限公司净利率波动则较大。 05 06   3、“十五五 ” 首批 8 台核电机组落地，核电审批常态化 + 技术升级双轮驱动，核电 量价双拐点已现，布局窗口已至 长江证券研报指出， “ 十五五 ” 首批 8 台核电机组获批，延续常态化审批， 中国核电 /中广核 /电投 产融分别获 4/2/2 台，在建待建机组达 22/20/6 台。《新型能源体系规划》明确 2030 年在运核电 装机达 1.1 亿千瓦。辽宁、广西试点机制电价（差价结算）有望向粤浙闽苏推广，稳定核电收 益预期。本次核准华龙一号 2.0 版（金七门二期、太平岭三期）和国和一号（莱阳一期）并 举，技术升级 + 模块化建造打开中游增量。核电量价双拐点已现， 中国核电 、中广核电力 H ， 关注中游建设环节。 1）“十五五 ” 首批 8 台机组获批，延续常态化审批节奏 7月31日，国务院常务会议审议决定核准辽宁庄河一期、山东莱阳一期、浙江金七门二期和广 东太平岭三期等 4 个核电项目，共计 8 台百万千瓦级机组；会议指出，要按照全球最高安全标 准建设和运营核电机组，加强全链条全领域安全监管，务必确保核电安全万无一失。其中， 中国核电 /中国广核 /电投产融获得核准的机组数量分别为 4 台、 2 台、 2 台； 此次核准后， 中国核电 /中国广核 /电投产融核准在建及待建核电机组分别达到 22 台、 20 台、 6 台。自 2019 年核电核准重启以来， 2022-2025 年连续四年每年核准 10 台及以上核电机组，本 次“十五五 ” 首批 8 台机组核准落地，进一步验证核电常态化审批方向，同时考虑到目前尚处年 中，全年核准节奏仍需持续跟踪。 此外，此次核准也与《新型能源体系建设 “ 十五五 ” 规划》提出的 “ 积极安全有序发展核电 ” 相呼 应，同时规划明确到 2030 年我国在运核电装机将达到 1.1 亿千瓦左右，随着核电建设的持续推 进，中国核电 、中国广核 等核电运营商有望持续受益于行业景气度提升。 2）机制电价试点有望陆续推广，收益预期趋稳支撑长期投资 核准常态化打开成长空间的同时，收益预期的稳定性是支撑长期投资的前提。此前，随着电 力市场建设提速，核电入市比例持续提升，市场电价波动带来的收益不确定性，与核电长期   发展、大规模投资所需要的稳定回报之间存在一定错配。而 2026 年辽宁及广西率先试点核电 机制电价：核电机组参与市场交易，同时对一定规模电量按照机制电价进行差价结算。 展望来看，长江证券认为桂辽率先试点的核电机制电价后续有望在广东、浙江、福建、江苏 等其他核电大省推广，核电电价有望获得系统性支撑，在保留市场价格信号的同时，为核电 长期投资所需的合理收益提供稳定器。 当前时点来看，核电量价双维度均迎来拐点，机制电价推动电价预期趋于稳定，同时核电运 营商在 “十五五 ” 期间也将迎来成长的加速兑现，此外本次核电审批落地持续验证政策的积极态 度，看好核电运营商的长期投资价值与当前低位布局机会。 3）核准常态化夯实产业链需求，技术升级打开模块化增量空间 此次核准的 8 台机组中，莱阳一期 2 台机组采用 “ 国和一号 ” 核电技术，金七门二期、太平岭三 期以及庄河一期等 6 台机组均采用 “ 华龙一号 ” 核电技术，其中金七门二期、太平岭三期被确定 为华龙一号 2.0 版示范项目。 华龙一号 2.0 版采用中国标准、自主化软件和优化的能动与非能动安全系统，在智能控制、模 块化建造等方面运用先进技术，使工程量大幅降低，安全性、先进性和经济性得到全方位提 升，具备更强的综合竞争力。核电审批的常态化推进叠加技术升级，有望进一步增强中游核 电建设尤其是模块化业务的需求确定性。 4）相关标的 当前核电量价双维度均迎来拐点：一方面， “ 十五五 ” 期间核电产能扩张将迎来加速兑现；另一 方面，市场化电价上涨预期明确叠加机制电价试点有望推广，共同支撑核电电价修复。此次 “十五五 ”
