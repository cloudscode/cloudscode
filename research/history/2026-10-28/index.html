产线的兑现验证）、\"新\"（从0到1的边际催化）。逐层提炼如下。 第一层：\"缺\"——涨价逻辑的能见度被集体拉长 存储：从\"涨价\"升级为\"长约锁量\"。 SK海力士在Q3业绩沟通中确认，已与14家核心客户签署覆盖2027—2028年超半数产能的五年长协，且嵌入区间内随市调价机制；HBM4将于Q4成为出货与收入主力，供不应求有望延续至2030年。长协锁量+浮动定价的意义在于：把AI服务器乃至后续机器人的内存需求，从\"预期\"直接映射为可兑现的量价与现金流。对应链条上，海力士/三星是弹性本体，北方华创、中微公司、拓荆科技对应扩产设备，香农芯创、德明利对应模组与渠道分润——上午澜起、兆易、君正、佰维、江波龙的集体走强，正是这条线的高弹性表达。 CCL/PCB：缺口看到2029年，瓶颈在材料不在需求。 TPCA展后反馈确认，高端覆铜板供需缺口至少延续至2029年，AI服务器与高速网络需求增速持续快于扩产，玻纤布（尤其薄布/Low Dk）、高端铜箔及压合设备的交期构成刚性瓶颈，配额保供与涨价已成常态。规格向M10/M11及混压方案升级，一线厂商景气能见度拉长至2030年。注意一个细节：中低端产品涨幅更大——紧缺沿供应链向下游传导时，瓶颈环节（宏和科技的薄电子布、中国巨石的特种玻纤）拿到的涨价弹性最纯。 具身数据：一个新的\"缺货\"品种正在诞生。 具身数据采集确认进入千万小时级采购年：海外基模厂商2027年单家采购指向千万小时，全球总需求向亿小时突破，单价稳定在300—400元/有效小时，订单从散单跃升为十万小时级大单。当\"数据\"本身开始按小时计价、出现长单锁量，其价值重心就从本体下沉至数据基建——数采设备与数据服务成为堆量阶段唯一可规模化兑现的卖铲环节。这是今日十条中最有\"从0到1\"成色的一条，也是上午奥比中光、当虹科技等\"数据+感知\"标的被资金选中的底层逻辑。 第二层：\"真\"——业绩与产线开始替叙事投票 特斯拉Optimus：产线爬坡落地，主线从讲故事切换为爬坡兑现。 特斯拉确认弗里蒙特改造产线已启动早期量产爬坡，设计上限年化约100万台；现阶段下线机型全部自用，加码投放1—2万台进入Academy做真机具身数采，以外售推迟至2027年底换取制造闭环验证。灵巧手执行器与零部件良率仍是核心卡点。这条信息的含金量在于\"产能锚点落地\"——T链订单随内部部署逐季放量的确定性抬升，丝杠（恒立液压、北特科技）、减速器（双环传动、宁波东力）、结构件与数采（福赛科技、福莱新材）是弹性最先释放的环节。上午双环传动涨停、福赛科技20cm，盘面已经提前按这条线索定价。 南亚新材：一份\"涨价传导\"的标准答卷。 Q3营收35.4亿环比+48%，归母净利9.90亿环比大增218%，净利率从13%跃升至28%，毛利率环比+16.4pct至38.1%——驱动因素拆解得极为干净：产线满载下FR-4涨价顺畅传导、M6及以上高速产品出货占比超20%、月出货近80万张较上半年近乎翻倍。这份财报等于替整个CCL板块做了业绩压力测试：涨价逻辑不是PPT，是真金白银的净利率跃迁。生益科技、金安国纪同链共振，东材科技眉山高速树脂9月起出货、Q4有望贡献近2亿营收增量，卡位台系BMI一供与M8/M9碳氢稀缺供应，属于\"材料瓶颈中的瓶颈\"。 恒瑞医药：创新药商业化拐点+BD常态化兑现。 Q3营收89.53亿同比+20.55%、环比+22.39%，创新药销售50.62亿环比回升18.19%，授权收入推动归母净利同比近九成。恒瑞上午以12.14亿主力净流入居全市场第二，是科技狂潮中机构资金\"高低搭配\"的去向——估值处历史偏低区间+管线密集兑现，构成防御与成长的交集。 第三层：\"新\"——三条从0到1的边际催化 谷歌Genie4：世界模型从\"可交互视频\"跃迁为实时仿真沙盒。 场景一致性翻倍至2分钟以上、原生生成环境音与实时对话、引入Gemini做多步因果推理——应用直指机器人与Agent训练前的模拟试错。sim-to-real数据成本下降将加速具身智能的数据飞轮，物理AI训练基础设施的配置优先级被进一步强化。上午当虹科技20cm涨停，正是资金对\"世界模型+真机数据闭环\"这一新叙事的直接响应。 Anthropic披露Claude覆盖药物研发全流程。 靶点评估、分子设计、先导优化、临床规划直至监管申报全线打通：一个月自主生成约3.5万个抗体设计、结合力提升超10倍、质控审核压缩约89%。投资主线已从\"模型能力叙事\"切换为\"工作流嵌入+湿实验验证+资产兑现\"——具备实验闭环与订单变现能力的平台（晶泰控股、金斯瑞等）优先受益。 国产3A《影之刃零》明日全球发售。 预购约85万份（对应约4300万美元）、Metacritic开分88（高于《黑神话：悟空》同期）、海外玩家占比超七成，首周销量具备冲击300—500万份的爆款基础。对板块的意义在于\"二次验证国产3A工业化与全球发行能力\"，催化游戏板块从历史低位估值修复——腾讯、顺网科技、心动公司等分发与流量环节弹性最直接。 提炼后的三点结论 今日上午的盘面与午间催化高度同构：机器人（Optimus爬坡+Genie4+数据采购年）、存储（海力士长协）、CCL（TPCA缺口+南亚新材业绩）、创新药（恒瑞Q3）、AI应用（影之刃零）——资金不是在炒朦胧预期，而是在追逐一条条\"能见度被拉长的兑现路径\"。 \"长协锁量\"是本轮涨价行情的新变量：存储与具身数据都出现了多年期长约，这意味着涨价的持续性和盈利的能见度远超一轮普通周期，估值锚有理由上移；但长协也意味着新进入者的窗口正在关闭，链条内部要更挑剔地选瓶颈环节。 节奏上注意两个时间窗：宇树科技明日（10月29日）三季报预披露、《影之刃零》明日全球发售——两个事件窗口都可能造成对应板块的高位分歧，追高的性价比在下降，分歧后的右侧确认更值得等待。 免责声明：本文仅为对公开市场信息与产业动态的整理与逻辑提炼，其中涉及的个股与行业仅为产业链梳理示例，不构成任何投资建议或买卖依据。文中业绩数据、产能规划、订单信息等均源自公开渠道转述，未经逐项核实，可能存在偏差或滞后。市场有风险，投资需谨慎，请投资者独立判断、自担风险。#文字观点", "publish_time": "2026-10-28 13:10", "tags": ["文字观点"]}, "post:2026-10-28T07-42:c42a804f713d": {"id": "post:2026-10-28T07-42:c42a804f713d", "kind": "post", "title": "2026-10-28 07:42", "source_label": "帖子正文", "excerpt": "Anthropic经济模型趋势乐观，关注智谱回调后的投资机会【东吴传媒互联网张良卫团队】 事件：Anthropic昨晚披露了S1文件，一些乐观信号： 1）经济模型趋势乐观：虽然单位任务成本的下降，但得益于算力效率提升，公司保持了利润率的快速提升，26Q2公司实现经调整经营净利率19%。算力效率仍在快", "content": "Anthropic经济模型趋势乐观，关注智谱回调后的投资机会【东吴传媒互联网张良卫团队】 事件：Anthropic昨晚披露了S1文件，一些乐观信号： 1）经济模型趋势乐观：虽然单位任务成本的下降，但得益于算力效率提升，公司保持了利润率的快速提升，26Q2公司实现经调整经营净利率19%。算力效率仍在快速提升中，截至2026年6月30日的三个月，收入同比增长1,368%，而同期算力与基础设施开支仅增长300%。每美元算力产出在26Q2达到2.08x，是25Q1的5.2倍。 2）商业化潜力上，NRR达到900%但应用场景仍然极具拓展潜力。截至2026年9月30日，Anthropic的净收入留存率（NRR）达到约900%，尽管保持如此高的NRR，但公司认为全球经济中的采用仍处于早期，网络安全是公司最重要的近期机遇之一，而随着Claude的前沿能力超越当前市场、开启全新市场，其他行业将随之跟进——触达机器人、先进制造与物流等领域，并加速科学研究的进展（含药物发现与材料科学）。 观点重申：1）智谱在Q3进行了积极的融资，预计算力储备有望得到显著加强，且算力效率也处于快速提升阶段，参考Anthropic趋势，后期有望看到智谱在财务上的积极改善；2）智谱当前估值明显低于一级市场可比公司；3）LLM在物理AI场景的进展，有望为智谱未来开辟新的应用场景，包括Openai以及Anthropic也均在发力布局。维持公司“买入”评级。 风险提示：新模型迭代不及预期；竞争格局不确定。#文字观点", "publish_time": "2026-10-28 07:42", "tags": ["文字观点"]}, "post:2026-10-28T23-02:83b6824ac949": {"id": "post:2026-10-28T23-02:83b6824ac949", "kind": "post", "title": "2026-10-28 23:02", "source_label": "帖子正文", "excerpt": "【国金计算机&科技】德才股份：谷歌Genie 4发布催化互动影游，奇想无限《零号档案：降临》已率先落地 #谷歌Genie4世界模型发布_互动影游有望成为AI应用新主线 ——10月27日，谷歌DeepMind发布新一代世界模型Genie 4，实现高拟真虚拟世界的实时生成与交互，支持通过自然语言动态修改", "content": "【国金计算机&科技】德才股份：谷歌Genie 4发布催化互动影游，奇想无限《零号档案：降临》已率先落地 #谷歌Genie4世界模型发布_互动影游有望成为AI应用新主线 ——10月27日，谷歌DeepMind发布新一代世界模型Genie 4，实现高拟真虚拟世界的实时生成与交互，支持通过自然语言动态修改场景，并同步生成环境音效、人物对话及动作反馈。我们认为，Genie 4进一步推动AI内容生成从单向视频向实时、可交互的虚拟世界演进，有望降低互动游戏、互动影视的内容开发门槛，推动互动影游产业加速发展。 #奇想无限首部AI原生互动影游已上线_自研平台及爆款IP打造先发优势 ——9月19日，奇想无限首部AI原生互动影游《零号档案：降临》正式上线，基于抖音播放量超2亿的爆款AI短剧IP《零号档案》正版授权打造，完整保留原剧世界观、核心人物及悬疑剧情设定。与传统AI短剧单向观看不同，互动影游允许玩家自主参与剧情，通过不同选择触发分支故事与多种结局，实现从“观看故事”向“参与故事”的转变。 ——技术方面，公司依托自研AI互动影游生成平台，构建具备剧情自主推进、人物人设记忆、动态情绪交互、多分支逻辑校验及全流程素材自动生成能力的互动游戏智能体，无需专业游戏引擎开发即可完成剧情搭建、画面渲染、交互设计与平台适配。#互动影游是AI漫剧消费周期的进一步拓展延伸， 推动爆款IP从单一视频内容向可交互、可重复体验的游戏化产品拓展，公司已具备产品落地经验及IP合作基础，有望受益于世界模型技术进步及互动影游产业发展。 #公司Agent/AI漫剧/AI硬件各项AI业务加速兑现 ——Agent方面，公司持续深化与火山引擎合作，正式加入“万有计划”，具备#专属定制Token资源包、专属GPU算力池免排队调用、专属内容素材库等模型专属权限； 7月28日，火山引擎将奇想无限信控额度由2,000万元提升至5,000万元，#按月滚动使用对应理论年化模型服务采购规模接近6亿元。依托自研Agent平台及模型、算力资源支持，公司正由AI漫剧内容生成向互动影游、广告、电商等更多应用场景拓展。 ——AI漫剧方面，奇想无限已推出《重生1970，从狩猎赶山开始》《镇守百万年，我的绝品徒弟是大帝》等多部AI剧，其中《重生1970，从狩猎赶山开始》位列红果漫剧APP的6月AI剧新剧榜第二名。 ——AI硬件方面，26H1公司新业务新签合同约9.74亿元，26Q2环比增长约85%，随着订单交付及产能爬坡，新业务收入有望逐步释放。 风险提示：AI业务拓展不及预期、互动影游商业化不及预期、对外担保风险、成本上涨风险。 ☎联系人：陈芷婧/鲍淑娴/刘高畅#文字观点", "publish_time": "2026-10-28 23:02", "tags": ["文字观点"]}, "attachment:files/A股与港股复盘 20261028.pdf": {"id": "attachment:files/A股与港股复盘 20261028.pdf", "kind": "attachment", "title": "A股与港股复盘 20261028", "source_label": "其他", "excerpt": "A股与港股复盘 2026年10月28日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 美股韩股点火，港A二次反弹 2026年10月28日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 存储和AI硬件的反弹这次从海外传来：SK海力士业绩点燃韩股涨6.6%、隔夜美股半导体涨3.6", "content": "A股与港股复盘 2026年10月28日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 美股韩股点火，港A二次反弹 2026年10月28日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 存储和AI硬件的反弹这次从海外传来：SK海力士业绩点燃韩股涨6.6%、隔夜美股半导体涨3.6%，创业板指涨3.4%恰好收回周二的跌幅；10月23日那次反弹两个交易日就被抹掉，这次要看外盘能不能守住 周二美股纳指涨1.2%、费城半导体指数涨3.6%；今天SK海力士公布业绩，韩国KOSPI涨6.6%；A股创业板指涨3.4%，收盘价刚好回到10月26日水平，等于周二跌幅被一次收回。中际旭创涨10.3%、新易盛涨8.1%、兆易创新涨7.8%；沪深A股上涨3,872家、下跌1,175家。港股幅度小得多：恒生科技涨1.4%，恒指只涨0.2%，南向连续第11个交易日净卖出。10月23日稿的证伪条件在周一、周二应验：创业板指两天累计跌5.1%，中际旭创、新易盛都连跌两天；所以今天是第二次反弹，不是上一次的延续。 显然，昨晚的Anthropic IPO市场反响热烈、META增发超五倍认购和今天海力士炸裂的三季度盈利点燃了市场的风险偏好。以前是担心算力不够，现在是担心市场钱不够。其实，这些都是市场的叙事，要涨的时候讲好的，要跌的时候就怒向刀丛觅利空。今天还是在路上，不写了。 本日报要 主线段： 存储和AI硬件的反弹这次从海外传来：SK海力士业绩点燃韩股涨6.6%、隔夜美股半导体涨3.6%，创业板指涨3.4%恰好收回周二的跌幅。起点在周二美股：纳斯达克综合指数涨1.2%，费城半导体指数涨3.6%；Anthropic公开提交IPO招股书，缓和了市场对AI商业化和融资的担忧，Meta的250亿美元股票发行认购需求约为发行规模的五倍。今天上午SK海力士公布第三季度营业利润83.3万亿韩元、营收104.6万亿韩元，分别比市场预期高约9%和7%，并宣布股东回报计划，新增部分约60万亿韩元（彭博口径约450亿美元）；公司称存储芯片供应紧张将持续到2030年。SK海力士股价涨约11%，韩国KOSPI涨6.6%，收6,012点，是7月31日以来最大单日涨幅，日经指数涨1.1%。 A股随后高开：创业板指开盘涨1.8%，全天最低只是9:40的涨0.6%，11:30涨3.0%，午后最高涨3.9%，收盘涨3.4%，一直在前收之上，没有出现10月23日那种先跌后涨的路径。中际旭创涨10.3%，成交235.7亿元居全市场第一；新易盛涨8.1%，兆易创新涨7.8%，寒武纪涨4.9%。港股同向但幅度小得多：中芯国际涨5.4%，中际旭创H股涨8.3%，恒生科技涨1.4%，恒指涨0.2%。这次反弹能否守住 A股与港股复盘 2026年10月28日 研究笔记 · 不构成投资建议 第 2 / 13 页 是个问题。10月23日的反弹同样来势很猛，由午间公告和ETF买盘带动，周一、周二创业板指累计跌5.1%，两天的下跌把它抹掉；那一次的触发点在A股内部，这一次来自外盘业绩，性质不同，但美联储决议（约10月29日02:00 HKT）和微软、Alphabet财报都在今天夜里。 A股： 上证收3,681点，涨0.9%；沪深300涨0.8%；创业板指涨3.4%；科创50涨2.4%；中证1000涨2.3%；北证50涨1.6%。沪深两市成交1.63万亿元，较昨天放量约1,675亿元。上涨3,872家、下跌1,175家、平盘175家（沪深A股，不含北交所）。涨停家数72家、跌停家数5家（沪深，东方财富涨停池）。 港股： 恒生指数收23,095点，涨0.2%；国企指数涨0.3%；恒生科技指数涨1.4%。恒指成交1,814.3亿港元，较昨天1,783.5亿港元增约1.7%。恒指波幅指数VHSI跌4.0%至19.5；指数上涨而波动率下降，用期权对冲波动的成本回落。 货币与汇率： 人民银行今天开展1,510亿元7天期逆回购，利率1.40%；同时开展1万亿元隔夜逆回购，合计约1.15万亿元。隔夜逆回购连续第二天用满每日1万亿元上限；7天期操作从周一的560亿元、周二的4,120亿元回落。公告未列隔夜利率和当日到期量，净投放额不写。人民币中间价6.7165，较前一日6.7171调升6个基点；在岸即期约6.666，离岸CNH约6.665，两者几乎无差；中间价弱于在岸即期约506个基点，10月23日稿为约480个基点。美元指数约102.4，较上一收盘持平。 互联互通： 北向成交2,513.9亿元，较昨天2,253.2亿元增约11.6%，净额未公布。南向成交670.4亿港元，较昨天600.6亿港元增约11.6%；全天净卖出8.0亿港元（买入331.2亿港元，卖出339.2亿港元）。昨天净卖出12.4亿港元，方向未变；连续第11个交易日净卖出，自10月13日以来累计净卖出304.0亿港元；最近5日累计净卖出150.1亿港元。 大波动： 内地方面，百普赛斯（301080.SZ）、斯迪克（300806.SZ）、莱美药业（300006.SZ）涨20.0%；西安奕材（688783.SH）跌17.2%，鼎通科技（688668.SH）跌11.4%，金山办公（688111.SH）跌8.8%。港股方面，脑动极光-B（06681.HK）涨52.3%，金斯瑞生物科技（01548.HK）涨11.2%，恒瑞医药（01276.HK）涨10.8%；滴普科技（01384.HK）跌23.1%，粤海投资（00270.HK）跌8.7%，新东方-S（09901.HK）跌7.3%。 技术： 上证收于20日布林下轨之上、20日至200日四条均线之下，RSI(14)为35.6；恒指收于20日布林下轨之上、全部均线之下，RSI(14)为32.9；创业板指位于全部均线之下（详 期持续，高带宽存储挤占晶圆产 能加剧标准型存储供应紧张。公司存储封测主要布局于新科金朋江阴及上海盛碟，A股增发项目包含高 密存储产能建设，盛碟董事会正讨论追加投资。 问答整理 Q1：近期HBM等核心物料紧张对国内加速卡需求产生影响，公司是否感受到2.5D相关需求 放缓？对未来一两年相关收入规模是否有影响？ 答：当前高端先进封装的核心约束在供给端而非需求侧，前端晶圆产能和存储供应紧张是全行业现象， 但客户真实需求并未减弱，反映的是供需不平衡。先进晶圆端及存储供应来源正日趋多元，产能放量节 奏逐步缓解和加速，客户针对不同应用场景灵活配置存储方案，选择多元化反而带来封装需求。公司正 积极推进不同封装方式的产品导入，判断客户需求增长趋势超出行业现有产能承接能力，该局面未来一 两年将持续，先进封装产能处于比较确切的状态，海外客户情况类似。竞争能力已不单靠某一项单点技 术（如单纯2.5D），而是向客户提供包括散热、供电可靠性、大规模量产、供应链在内的综合解决方 案，\"大者恒大、强者恒强\"格局将更明显。长电科技稳步推进高端先进封装工厂扩展及先进技术研发导 入，江阴高端先进工厂收入预计2027年达到数十亿元量产规模，同时扩充其他工厂高端先进封装能 力，开发新一代3D堆叠技术。公司已做好3D先进封装规模化量产的产线准备，当前3D工艺以TCB 技术为主，同时布局面向下一代的更高密度混合键合技术，主设备已开始进场，客户样品验证工作积极 推进；并已启动晶圆级高密度混合键合技术开发，持续完善3D高密度集成技术布局。 Q2：国内工厂产能利用率很高，从边际看哪些需求会进一步加强，哪些需求有放缓迹象？ 答：三季度国内工厂主要产能维持高位，先进封装产能需求非常旺盛。消费类、手机类产品受市场需求 本身及供应链存储芯片供应问题影响，相比AI先进封装需求有所减弱，从手机市场出货规模也可看 出。海外三个工厂分两类：两个以数据中心AI相关业务为核心的工厂，成效换挡非常明显，不断有新 产品导入，如负责新科金朋的韩国工厂三季度收入增长超50%，四季度扩产持续落地逐步释放；另一 家偏重通信类、消费类产品的韩国工厂，公司顺应市场和客户需求有意识调整产能，腾挪场地、资金及 部分设备资源向AI基础设施业务集中，将该工厂与其他两家工厂统筹管理，以应对数据中心算力、高 密电源管理等更强需求。 Q3：传统业务和先进封装业务未来的毛利率趋势如何展望？ 答：公司今年毛利率呈逐级改善趋势，三季度单季达17.5%，已接近上一轮周期高位区间，主要得益于 海外工厂产品结构优化及先进封装布局成效显现。高端先进封装因技术和资金门槛较高、价值较高，整 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 体盈利能力和毛利率优于传统业务；新工厂和新产线处于导入期，折旧影响造成阶段性费用较高，公司 通过缩短导入期推动新业务尽快起步。传统业务受益于产能利用率非常高，毛利率持续改善，同时推进 传统封装先进化（如非BGA等高价值产品）并获更多客户认可。展望四季度及明年，高附加值产能持 续释放、海外业务结构进一步优化，主流封装保持稳定，预计毛利率呈稳中有升趋势。 （vx:362336789） Q4：CPO和NPO光电合封当前客户端进展如何？规模化营收和量产节点大概在什么时候？ 答：CPO量产技术已做好准备，产线准备已完成。根据客户最新预测，2.5D平台CPO产品明年一季 度将首先在海外工厂开始商业化生产，量逐步爬坡，更大规模行业量产应用预计发生在2028年， 2027年开始量产爬坡；国内工厂紧随其后，根据国内客户应用端认证逐步开展。同步面向CPO的 2.5D/3D及超大规模倒装方案，正与多家客户积极开发验证新一代CPO技术。NPO客户产品导入意 愿增长非常快，国内外客户均如此，推广速度比CPO更快，目前已有几家客户在国内工厂开始生产， 海外工厂NPO项目也刚开始。NPO在工艺技术和供应链上几乎已无瓶颈，故应用端推广较快；CPO 的关键变量在于芯片堆叠、光引擎良率、光耦合精度、面向CPO的2.5D先进封装供给能力，以及可 靠性验证、热管理、光电测试能力，需与客户及客户的客户持续优化精进。明年开始CPO生产，2028 年形成更大产量时相关工艺问题将逐步解决。 Q5：今年资本开支上调至173亿元，多出的73亿元主要投向哪些方面？明年资本开支趋势 如何？ 答：前三季度固定资产资本开支已达88.9亿元，较去年同期接近翻倍，大部分为产能扩充类项目并逐 步向产能转化释放，但需求更加旺盛，订单仍难以满足。新增投入方向延续既有战略：应用领域围绕 AI带来的数据中心需求增长，以及汽车电子和工业等可见性强的领域；技术工艺层面聚焦先进封装特 别是高端先进封装投入持续加速。具体用途上，产能扩充占新增资本开支8成以上，约20%用于研发 和基建，研发主要面向CPO、NPO、面板级封装、3D封装等研究性及工艺投入，基建因洁净室仍较 紧缺也有一部分投向。展望明年，本轮周期需求可见度明显拉长，资本开支将保持高位，预计延续今年 开支强度，借AI基础设施建设结构性机遇，促进业务结构优化和商业模式转型。 Q6：晶圆代工价格趋势如何？未来是否还有涨价意愿？涨价基于成本传导还是供需？ 答：价格联动机制自去年以来启动，原材料价格持续走高后公司开始联动，获越来越多客户理解和认 同。原因一方面是大宗原材料价格上涨，客户有同步认知；另一方面公司加大先进封装投入、产品技术 升级带来投资增加和成本上升，先进封装的价值创造也获产业链越来越多认同。整体看25年成本传导 或原材料上涨感受更明显，26年以后成本与供需两方面因素都有，更深层面是封装价值在产业链和客 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 户角度获得更多认同。公司作为代工企业将持续做好成本管控，提供高性价比方案。随着结构优化、先 进封装占比提升，在供应链持续紧张和产能紧缺情况下，相关价格调整将获客户积极响应。新科金朋海 外工厂下半年启动价格调整后落地情况非常理想，海外客户整体涨幅在两位数以上（各家因产品类型和 沟通有所差异）。（vx:362336789） Q7：CPU业务进展及未来如何规划？远期可展望多大体量？ 答：面向数据中心的CPU需求增加已非常清楚。近两个季度接到的新项目中CPU项目越来越多，项目 数量超过GPU；客户数量也在增多，甚至传统做IP生态的企业也在自研服务器芯片并成为公司客户， 为未来扩大超大尺寸CBGA、2.5D等盈利打开新增长空间，国内外同时出现该倾向。与全球领先IP生 态平台企业及海外主流CPU厂家的合作正稳步推进。推理CPU数量多、对成本要求更严格，数据中心 CPU中一方面采用2.5D平台，另一方面不少企业采用MCM加封装形式，将DRAM直接集成以提高 运行效率和整体性能，头部国际客户相关项目2027年上半年将逐步在公司工厂进入量产。全年看CPU 业务体量在公司自身也许不亚于GPU业务体量，有望成为运算电子板块的重要增量。 Q8：存储行业国内爆发放量，若考虑存储相关客户，目前扩产规划如何？ 答：受AI需求带动，本轮存储上行周期持续时间较长，存储仍处紧缺状态，晶圆厂产能向高带宽存储 倾斜，加剧标准型存储产品供应紧张，存储市场价格过去一年多持续上涨，很多成熟厂商签署长期供货 协议并加速落地。判断未来随存储价格趋稳，国际客户产能将开始扩张，存储需求确定性非常高；国内 市场也是存储大厂提升份额、大力扩张的好时机。长电体系内存储封测主要布局在新科金朋江阴及上海 盛碟，将围绕存储特别是运算相关高密度存储封测加大投入，A股增发项目包含高密存储相关产能建 设；盛碟半导体已收到客户关于提升资本开支的需求，正于董事会层面讨论，预计后续追加投资。 Q9：面板级封装此前提到明年完成客户验证、2028年中计划投产，目前验证和订单进展如 何？ 答：高密度面板级封装是公司近两年研发重点，与玻璃基板封装技术结合。面板级封装工艺开发按计划 顺利推进，已完成基于长电科技高密度扇出技术的310×310面板级高密度封装核心工艺流程验证，并 在该高密度扇出解决方案平台上建立光刻胶涂胶、光刻显影、溅射等关键内部能力。中试线设备已陆续 交付进场，预计2027年二季度中试线全线拉通后具备给客户商业化打样能力。玻璃环节方面，玻璃芯 及面向面板级玻璃中介层的开发工艺已进入工艺验证阶段。公司看好面板级封装及与玻璃基板的结合， 正与国际头部CPU企业CEO交流相关合作，面向面板级特别是TGV工艺能力需国内外产业链及客户 紧密协同，希望通过协同开发加速推进，力争2028年进入商业生产阶段。（vx:362336789） Q10：通讯电子板块（包括长电韩国）四季度和明年前景如何展望？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：通信类智能手机市场受供应链特别是存储芯片影响，需求不及期待，个人消费习惯也在变化，三季 度该块营收不及预期，四季度虽有所增长但整体市场大环境如此。公司选择主动调整而非被动等待：韩 国面向AI数据中心的工厂与面向通信类的两家工厂从今年开始整体资源统筹管理，加速\"腾笼换鸟\"， 将宝贵的生产资源、场地资源从消费类通信类业务适当向数据中心算力、电力、存力等AI基础设施业 务集中。考虑到韩国工厂明年面向数据中心需求仍在明显上调，该统筹方向将坚决执行，本次资本开支 上修带来的产能也将向更高附加价值方向集中。两家工厂统筹管理后合计规模可实现更大增长，提供更 高利润。 Q11：海外业务占比不低，地缘政治风险下部分公司产生汇兑损失，公司如何应对汇率风险？ 四季度及明年展望如何？ 答：前三季度汇率波动幅度不同，财务上体现季节性差异，但前三季度汇兑损失较去年有所扩大。公司 国际业务占比较高，美元贬值总体不利，今年前三季度人民币贬值幅度较去年明显增加。举措主要有两 方面：一是降低风险敞口，已对香港人民币贷款进行调整和转换，并压缩盛碟美元货币资金保有量；二 是在坚持汇率风险中性管理原则前提下进行一定套期保值安排。三季度因韩元对美元大幅升值导致单季 账面汇兑损失较高，但韩元也采取了套保并有一定程度对冲，因波动幅度较大未完全对冲，若走势反转 则可能体现为收益。公司上半年在新加坡成立海外财资中心，将持续关注汇率走势、加强管控，借助该 平台加强全球资金调配和汇率风险统筹管理能力。 原文 长电科技261027_原文2026年10月28日00:26发言人00:02大家好，我是长电科技吴洪坤。 发言人00:04欢迎各位海内外投资者及分析师参加长电科技2026年第三季度业绩说明会。 发言人00:10本次会议以电话会议和网络文字互动的形式结合召开。 发言人00:14出席本次会议的公司领导还有公司董事首席执行长CEO郑丽先生，以及公司董事、首席 执法部长CFO梁臻先生，独立董事顾铁博士和董事会秘书袁燕女士。 发言人00:28本次会议由三部分组成，首先公司CEO郑总和CFO梁总将向大家介绍公司最新的发展 业绩情况，发言完后交留有提问的时间。 发言人00:38首先我们开始电话问答，最后将进行文字互动。 发言人00:42文章。 发言人00:42下面我们首先有请公司首席执行长CEO郑利先生发言，谢谢。 发言人00:50好，谢谢宏坤，也非常感谢各位投资人分析师朋友来参加今天长电科技的2026年第三季 度的业绩说明会。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 发言人01:03第三季度在整个行业景气持续上行的环境下，长电科技延续了上半年的良好发展势头。 发言人01:13这个三季度的营业收入同比环比都实现了双位数的增长，毛利率也延续扩张，盈利能力 得到了进一步的增强。 发言人01:29那么从业务的结构来看公司围绕数据中心的算力、存力、电力数据的运力以及和工业汽 车电子应用领域的布局的更换，收入结构不断向高成长高附加价值的领域在集中。 发言人01:51前三季度我们运算电子收入接近了100亿元的大关，占比也达到了31%，相比去年同期 增长了54%点。 发言人02:06那么汽车电子的业务也实现了收入达到35亿元，同比增长了30%，占比也超过了 10%，达到11%点。 发言人02:19工业领域的收入也是稳步的增长。 发言人02:24公司在这个市场景气上行期间，我们积极的推进面向全面面向先进封装的成功换掉成 效，已经在收入结构当中越来越清晰的得到了提现，数据中心的业务第三季度我们来自运算电子的业务 继续保持快速的成长，收入同比增长超过了80%。 发言人02:59那么市场对各类陷阱的结构分层更加的清晰，特别是在高端侧训练和旗舰的推理芯片， 继续依托2.5D3D封装和高态带宽存处的协同演进，大量定制化的ACC和K芯片，也会在选择成本更 加优化，高密度的集成的方案。 发言人03:32从头部客户的角度来看，前后到一体化的多供应链的布局，也在从一个可选项变成了一 个保障交付，保障确定性的一个必行方面的公司。 发言人03:48那些正在获得更多的订单的机会，进入量产环节的产品也在持续的增加。 发言人04:00在电源管理和功力管理方面，这AI数据中心的工号跃升，持续推动了供电架构的升级。 发言人04:10高效供电成为AI基础设施扩张的一个重要的约束。 发言人04:17公司的高密度电影管理相关的业务，自25年以来迎来了高速的成长。 发言人04:26我们也看到相关的券商九月份发布的报告，AI电源市场规模在五年以内会扩大十倍以 上。 发言人04:36那么长电科技前三季度的AI电源收入也突破了20亿元，同比增长超过了2倍。 发言人04:45那么随着供电架构继续向高压直流模块封装内化演进，这个业务成长性在未来的几年会 持续的兑现。 wåÆf t\u00 %。 五、为什么港股砍得更狠：H/A溢价重估 H股仍较A股溢价约30%，而比亚迪H股较A股折价超35%。大摩将目标H/A溢价由20%砍至0%，逻辑有三： 其一，3Q证明“技术领导力”不能自动兑现为短期毛利，离岸稀缺溢价松动； 其二，香港市场流动性走弱，A/H两地上市群体H股折价普遍扩大； 其三，边际买家要看到“海外储能放量+组合归一+单位净利企稳”三重验证后才愿重建溢价。 结论：H股未来3个月仍是波动率资产，路径阻力最小方向是H/A价差继续收敛。 六、长期叙事未破，但重估需新产品周期 乐观情形（Bull，A股570元 / H股未给同比例乐观价）：钠电、凝聚态电池、换电联盟（华为、吉利加入）、AI数据中心储能高端化，打开溢价回归空间，估值回到15倍EV/EBITDA。 悲观情形（Bear，A股135元 / H股155港元）：电池 commodity化，二线厂技术差距收窄，OEM与储能开发商只看单价，单位毛利腰斩，估值跌至3倍EV/EBITDA（周期品定价）。 基准情形：不是太阳能式结构崩盘，而是“成长溢价”暂歇，等下一轮产品周期确认。#文字观点", "publish_time": "2026-10-28 09:09", "tags": ["文字观点"]}, "post:2026-10-28T17-12:d482970796f2": {"id": "post:2026-10-28T17-12:d482970796f2", "kind": "post", "title": "2026-10-28 17:12", "source_label": "帖子正文", "excerpt": "【hcdx】皖仪科技：26Q3利润同环比大幅度增长 26Q3公司营收2.55亿元，同比+21.07%，环比+20.92%；归母净利润0.34亿元，同比+35.85%，#环比+78.96%", "content": "【hcdx】皖仪科技：26Q3利润同环比大幅度增长 26Q3公司营收2.55亿元，同比+21.07%，环比+20.92%；归母净利润0.34亿元，同比+35.85%，#环比+78.96%；扣非归母净利润0.27亿元，同比+78.77%，#环比+188.48%。26Q3公司毛利率为52.15%，同比+4.17 pct，环比+0.47 pct；销售净利率为13.15%，同比+1.43 pct，环比+4.26 pct。 工业检漏龙头优势稳固，半导体与新能源加速渗透：公司在氦质谱检漏领域具备深厚技术积淀，正从传统制冷领域向半导体制造工艺设备、锂电池与储能检测等高壁垒场景深化拓展。伴随半导体关键制程设备国产验证加速以及海外产能交付，检漏设备成长确定性强。#半导体AMC打破台企长期垄断：晶圆制造及先进封装工序对洁净度要求极高，AMC（气态分子污染物）在线监测是贯穿关键工序的刚需环节（只要有洁净度要求就需要），整体市场空间达数亿元。 公司依托气体采样与分析核心能力，凭借二氧化硫/氨气分析仪、在线离子色谱等设备成功切入晶圆厂洁净车间。该领域客户验证周期长、进入壁垒高，此前主要由台湾厂商垄断。公司作为国产替代先行者，渗透势头强劲，25年该板块收入超800万元，26H1已达到800+万元，仅半年时间即追平去年全年，即将迎来爆发式增长。#AI液冷检漏深度受益液冷产业化：伴随AI算力全液冷标准推行，液冷系统的高精度气密性检测需求激增。公司依托核心的氦质谱/氢质谱检漏技术与智能制造优势，系统性突破了液冷行业高精度密封检测与高速产线节拍的技术瓶颈，成功构建适配AI服务器液冷系统的全流程气密检测解决方案，精准覆盖冷板、管路、接头、液冷分配装置（CDU）等所有核心部件。 26H1已实现营收2,707万元。液冷已实质性成为支撑公司业绩高增的关键第二曲线。 公司股权激励设定26/27年营收10.66/ 12.79亿元，归母净利润1/ 2亿元。按照27年2亿净利润目标，公司目前仅17倍，建议关注！#文字观点", "publish_time": "2026-10-28 17:12", "tags": ["环比+78", "96%", "半导体AMC打破台企长期垄断", "AI液冷检漏深度受益液冷产业化", "文字观点"]}, "post:2026-10-28T13-00:764320ba7cf2": {"id": "post:2026-10-28T13-00:764320ba7cf2", "kind": "post", "title": "2026-10-28 13:00", "source_label": "帖子正文", "excerpt": "#关注【中重科技】6月份物理AI 龙头 #订单高增推动主业景气向上、Q1业绩拐点、Q2业绩加速 受益于新兴市场钢铁景气向上，公司海外订单 接受产品涨价，印证我们的判断：已经锁定上游原材料的行业头部公司依旧掌握定价权。全产业链普遍可以向下传导成本压力，但不同细分板块涨价的可持续性需要重点观察。产业链上下游公司都计划继续上调产品价格，以此消化原材料成本上涨。 该现象覆盖上游的玻璃布、基板芯板、覆铜板，一直延伸到下游 PCB 板块。 不只 AI 业务占比高的公司，消费类产品业务占比较高的公司同样存在涨价动作。 虽然当前全行业定价能力表现强劲，但涨价能否持续需要持续监控，尤其是消费产品业务占比较高的 PCB 制造公司，消费终端产品对成本的敏感度要高得多。 材料与产品设计升级仍在持续。本次展会展出大量材料与设计迭代方案，用来匹配 AI、低轨卫星、光通信应用的高速增长需求。 其中包含市场预期将于 2028 年实现量产爬坡的 HVLP5 产品；台耀化学技术论坛重点介绍 M10/M11 等级覆铜板转向碳氢、聚四氟乙烯材料路线（分为含玻璃布、不含玻璃布两种方案）；面向 800G/1.6T 光收发模块的 12‑14 层任意层改良型半加成法 PCB；还有适配低轨卫星 PCB 的覆铜板材料升级方案。 供给紧张逻辑复盘：材料、覆铜板、PCB 全产业链涨价。 即便覆铜板公司持续推进扩产，受原材料、设备供给双重约束，覆铜板需求依旧大于供给。下面总结 TPCA 展会调研当中讨论到的核心领域以及各类瓶颈。 原材料板块 玻璃布：供给紧张局面至少延续至 2027 年下半年，很难把高端产线的产能转去生产低端产品。 联茂电子（ITEQ）：受玻璃布供给不足影响，公司产能利用率被限制在约 75%；如果原材料供给充足，利用率可以超过 90%。 联茂电子正在对中国大陆供应商提供的 E‑玻璃布开展认证，希望以此保障原材料供应；上游玻璃布厂商持续涨价，联茂电子也会同步向下传导原材料成本。行业预计玻璃布紧缺至少延续至 2027 年中后期。 金居开发（Kinsus）：只有 T‑玻璃布出现实质性紧缺，紧缺状态预计持续到 2027 年，同时 E‑玻璃布同样供给不足。 南亚塑胶：E‑玻璃布供给十分紧张。低介电玻璃布和 E‑玻璃布配方、生产工艺均不相同，很难在两者之间切换产能。南亚塑胶内部可以自产玻璃布，但产出全部留给自身覆铜板生产，不会对外销售。 生益电子：玻璃布是最大瓶颈，根源在于丰田织布机设备供货不足。玻璃布供应商优先生产高端低介电玻璃布，造成中低端产品严重紧缺。中国大陆产织布机存在纱线断裂带来的良率问题，因此至少到 2027 年，丰田织布机依旧是不可或缺的核心设备。 铜箔：将成为 2027 年新的供给瓶颈。 铜箔科技（Co‑Tech）：随着云林第三工厂产能爬坡，HVLP4 铜箔月产能预计到 2027 年 10 月由 200 吨提升至 800 吨。马来西亚一座 3 万吨产能工厂（HVLP4/5 产品）计划 2028 年末投产，2030 年年中全部建成。 AI/ASIC 服务器已经把 M8+HVLP4 作为标准配置，从 2026 年第四季度开始，客户大量签订长期协议锁定供货。高端铜箔供给缺口预计超过 30%，供给紧张的情况要到 2029 年才会得到缓解。 HVLP5 产品制造难度高，良率仅 50‑60%，客户认证周期需要 1‑2 年。 联茂电子：全球仅有四家供应商可以生产 HVLP4 及以上等级铜箔，三家来自日本，一家来自中国台湾，供应商扩产进度跟不上需求增长。 三菱：铜箔供给将会收紧，但紧缺程度预计会弱于玻璃布。HVLP5 产品预计 2028 年开始量产爬坡，而 HVLP4 在 2030 年之前都会是主要增长动力。 覆铜板生产设备。 台耀化学（TUC）：亚洲金属是覆铜板处理设备的核心供应商，该公司订单积压已经排到 2029 年，覆铜板公司新扩产计划将会面临设备获取困难。 覆铜板与 PCB 产能：供给紧缺持续到 2029‑2030 年。 联茂电子：预计覆铜板供给紧张状态会维持至 2029 年。 亿鑫（EMC）：低端覆铜板紧缺程度甚至高于高端产品，低端覆铜板缺口预计持续到 2027 年末。 康鹏（Compeq）：高层数厚型 HDI 板至少到 2028 年都会处于供给短缺，全部扩产项目将在 2028 年末完工。 生益科技：头部覆铜板公司已经停止供应 M6 及以下等级中低端覆铜板，出现价格倒挂现象，FR4 产品盈利能力甚至高于 M6 产品。头部公司优先守住高端市场份额，这给二线公司带来发展机会。 价格层面：行业共识为涨价将持续。 Resonac：原材料价格持续上行，看不到调价停止的迹象。 Unitech：2026 年第二季度才启动涨价，在此之前继续消化成本就会陷入亏损。即便很多客户业务属于消费类应用，到目前为止客户都接受涨价。 对比 AI 终端产品，消费终端产品平均售价低很多，Unitech 无法判断客户还能承受多大幅度的涨价，但现阶段没有停止涨价的打算。 联茂电子：中低端产品涨价幅度会高于高端产品，定价参考中国大陆同行。 金居开发：2026 年每季度 7‑8% 的涨价完全用来传导成本。只有未来 T‑玻璃布紧缺缓解、基板产能成为核心约束条件时，高层数大尺寸 ABF 基板才会出现溢价空间。 产品规格升级成为必然趋势 覆铜板技术路线： 亿鑫（EMC）：M8（892K）属于主流标准产品，出货量超 100 万张；M9（896K3，Q‑glass 材料）已经量产。 M10（898K4，Df 约 0.0004）2026 年 5 月送出样品，预计 2026 年末完成认证，2027 年下半年供给 Rubin Ultra 相关产品；M11 尚处于实验室研发阶段，规划 2028 年推出。2027 年市场主流依旧是 M7‑M9 系列。 联茂电子：M7 产品几乎全部供给 ASIC 芯片，是 2027 年增长核心驱动力。公司看到中低端覆铜板拥有更高毛利率，未来会考虑提升对应产出。 南亚塑胶：M11 产品将采用 LDK2 玻璃布，南亚塑胶自身不具备 Q‑glass 生产能力。 台耀化学（TUC）： 10 级材料（TU‑963）基于碳氢体系；11 级材料（TU‑973）基于聚四氟乙烯体系；两类产品均提供 LDK2、Q‑glass、无布薄膜多种版本。 TU‑963 在 10GHz 条件下 Dk/Df 参数为 2.85‑3.0 / 0.00039‑0.0004，对比竞品参数 3.0 /0.0005；目前已有样品，计划 2027 年量产。 TU‑973 在 10GHz 条件下 Dk/Df 参数为 2.7 /0.00026‑0.00029，竞品对应参数 2.7 /0.00037；已有样品，计划 2027‑2028 年量产。 台耀化学技术论坛更多要点：聚四氟乙烯与碳氢材料。 台耀化学对于聚四氟乙烯材料的解读：全聚四氟乙烯板材需要在 380 摄氏度完成压合（传统工艺约 220 摄氏度），压合时长超过 6 小时，压力‑600psi，如果做全聚四氟乙烯板材会耗尽现有产线全部产能。 台耀化学更推崇混合设计方案，外层使用碳氢材料，内层使用聚四氟乙烯；如果反过来外层使用聚四氟乙烯，内层碳氢材料会因为聚四氟乙烯需要的高温压合条件出现损坏。 26.56GHz 条件下信号损耗数据：全聚四氟乙烯方案每英寸损耗 0.37‑0.40 分贝；全碳氢方案每英寸损耗 0.43‑0.47 分贝。 和部分同行不一样，台耀化学表示可以自主生产聚四氟乙烯材料。但最终是由客户决定台耀只供应聚四氟乙烯芯板、还是同时供应芯板与半固化片。 玻璃布发展方向：优先 Q‑glass，不允许降级使用低端材料。 南亚塑胶、建滔、铜箔科技：客户不会接受降级使用更低规格玻璃布。高端铜箔不会搭配低端玻璃布，玻璃布本身直接影响信号传输表现。 铜箔科技：全球仅有两家 Q‑glass 供应商，供给存在潜在限制，部分客户会转向完全无布的设计，这也是客户正在推进的技术方向。 金居开发：正在和英伟达做 T‑玻璃布 + E‑玻璃布混合芯板认证，用来缓解 T‑玻璃布供给短缺问题。HDI 以及改良型半加成法（mSAP），有望拉动 AI 单机价值新一轮增长。光互连技术把 HDI、mSAP 带入 AI 数据中心。光模块越来越靠近 ASIC 芯片，从现在可插拔模块演进到 NPO（距离 ASIC 约 150 毫米）、CPO（距离 ASIC 约 50 毫米），单链路对应的 PCB 价值持续提升。 光模块 PCB：成为新的竞争战场。 康鹏（Compeq）：400G、800G、1.6T 产品均已量产；2026 年出货量以 800G 为主，1.6T 产品会在 2027 年末实现规模上量。 从 400G 升级到 800G/1.6T，基板方案由 M6 基材的 3+4+3 结构 HDI，升级为 M7N 基材的 12‑14 层任意层 mSAP。 NPO 光引擎使用 12 层任意层板，18 层版本处于开发阶段。 志超科技（ZDT）：800G、1.6T 光模块产能在 2026‑2027 年已经全部售罄，公司持续扩产。 志超拥有服务美国消费类客户积累十年的 mSAP 工艺经验，良率爬坡速度快。公司同时向多家覆铜板供应商采购，保障原材料供给。 HDI 板材：层数与板厚同步提升。 志超科技：行业大多关注 HDI 可做的层数，但板厚也是关键指标。传统 HDI 板厚度一般 2‑3 毫米；AI 相关 HDI 板厚度越来越多达到 3‑5 毫米甚至更厚，制造难度随之上升。#文字观点", "publish_time": "2026-10-28 09:39", "tags": ["文字观点"]}, "post:2026-10-28T10-50:9a20c6be18c2": {"id": "post:2026-10-28T10-50:9a20c6be18c2", "kind": "post", "title": "2026-10-28 10:50", "source_label": "帖子正文", "excerpt": "逸飞激光：收购兴启航卡位CPO耦合设备，大圆柱+BBU+光通信三线并进！事件：公司公告，拟以现金4亿元收购深圳市兴启航自动化设备有限公司100%股权，标的评估值4.03亿元、增值率532.56%，业绩承诺2026–2028累计扣非净利≥9,300 万元，年均≥3,100 万元 ", "content": "逸飞激光：收购兴启航卡位CPO耦合设备，大圆柱+BBU+光通信三线并进！ 事件：公司公告，拟以现金4亿元收购深圳市兴启航自动化设备有限公司100%股权，标的评估值4.03亿元、增值率532.56%，业绩承诺2026–2028累计扣非净利≥9,300 万元，年均≥3,100 万元 ；支付节奏：首期60%（2.40 亿）→第二期20%（0.80亿，挂钩2026–2027累计承诺净利 6,200万达成率≥80%）→第三期20%（0.80 亿） 。本次交易在董事会权限内、无需股东会审议，不构成关联交易与重大资产重组，资金来源为超募资金 2.24 亿元 + 自有/自筹。 1、#标的系光模块耦合设备全品类平台、产品卡位CPO/1.6T，深圳兴启航系国家级高新、深圳专精特新，是国内少数覆盖TO-CAN、COB、BOX(Lens)、FA光纤阵列全品类耦合设备的企业。具备激光焊接、UV紫外胶固化、热固化能力，#客户为全球头部光模块厂商。设备端受益于 800G→1.6T→CPO 的迭代周期，且价值量与技术壁垒均高于传统光模块组装设备。2025年净利1,115.55万元；2026年1–5月净利1,034.39万元。 2、#协同激光工艺能力×精密对准能力、从单机走向整线。逸飞的核心能力是激光焊接+精密运动控制+整线自动化（锂电电芯装配线、模组/PACK 线），兴启航的核心是亚微米级光路对准+耦合工艺+光模块封装产线。逸飞由此从锂电单一优势领域向“多元化智能装备平台”升级。#当前订单大几个亿、目标新签订单15-20亿、利润率有望40-50%。 3、#主业同步改善、大圆柱和BBU&超容构筑安全垫。2026Q3公司单季营收3.40亿元（+137.25%）、归母1,838.53万元，毛利率提升6pct至26.28%，合同负债10.79亿元、较上年末+97.98%。主业方面今年1~9月约23亿，全年约30亿+，目前主业已有25亿以上，四季度拐点较明确，但需看韩国项目确认收入情况。此外超容方面德国客户有望逐步落地。 4、展望来看，本次收购是公司进一步外延（收购无锡新聚力51%，布局半导体AMHS），平台化路径清晰。往后看，①兴启航并表+CPO/1.6T设备放量；②超容/BBU逐步放量；③锂电主业盈利兑现，三条线共振。维持推荐。#文字观点", "publish_time": "2026-10-28 10:50", "tags": ["标的系光模块耦合设备全品类平台、产品", "客户为全球头部光模块厂商", "设备端受益", "协同激光工艺能力×精密对准能力、从单", "当前订单大几个亿、目标新签订单15-", "主业同步改善、大圆柱和BBU&超容构", "文字观点"]}, "post:2026-10-28T12-44:9b8e55324a72": {"id": "post:2026-10-28T12-44:9b8e55324a72", "kind": "post", "title": "2026-10-28 12:44", "source_label": "帖子正文", "excerpt": "ASMPT：Q3订单超预期，TCB及光通信需求强劲 📊 Q3收入及调整后EPS超预期，订单创历史新高。公司实现收入6.69亿美元（同比+48.7%，环比+6.3%）", "content": "ASMPT：Q3订单超预期，TCB及光通信需求强劲 📊 Q3收入及调整后EPS超预期，订单创历史新高。公司实现收入6.69亿美元（同比+48.7%，环比+6.3%）；新增订单11.28亿美元（同比+137.9%，环比+24.7%），明显好于此前环比高个位数增长指引，订单收入比升至1.69。调整后毛利率42.9%，持续经营业务调整后净利润6.90亿港元（同比+486.3%，环比+8.2%）。其中SMT分部利润环比+44.1%，贡献本季主要盈利增量。 🚀 Q4收入指引6.70亿至7.30亿美元，中值同比+37.5%、环比+4.6%，高于市场预期。SMT收入预计环比双位数增长；SEMI受先进封装产品交期较长影响，预计环比持平。Q4订单预计同比仍显著增长、环比低于Q3，主要因Q3 SMT包含逾1亿美元大单及提前下单。公司预计AI需求将支撑2027年收入持续增长，先进封装订单转收入的节奏值得关注。 🔥 逻辑TCB需求持续强劲。C2S订单创历史新高，主要由领先逻辑客户的OSAT合作伙伴对更大尺寸复合芯片封装的需求驱动；C2W获得全球领先IDM先进CPU重复订单，支持客户端计算及AI推理。HBM方面，设备采购节奏仍与HBM4推出计划密切相关，部分大规模技术升级投资延后，公司认为扩产及选择性升级需求仍在。 💡 光通信订单与收入创新高。800G、1.6T及下一代光模块量产爬坡带动设备需求，可插拔光模块方案取得重要订单。AMICRA在NPO（近封装光学）取得批量订单突破，并获得领先通信服务商的高精度光模块键合设备首单；CPO持续深化与多家全球领先客户合作，光通信业务的客户及应用覆盖进一步拓展。#文字观点", "publish_time": "2026-10-28 12:44", "tags": ["文字观点"]}, "attachment:files/1028脱水研报.pdf": {"id": "attachment:files/1028脱水研报.pdf", "kind": "attachment", "title": "1028脱水研报", "source_label": "其他", "excerpt": "280.04 300.35光互联替代铜缆拉动保偏光纤需求高增，从价格 战打到涨价 650%，光纤告别薄利模式开启价值重 估；PCB下一个升级方向是无布， 28年起高速放 量，市场空间 3年从105亿干到 1600亿——1028 脱 水研报 2026/10/28 19:56 今日内容： 1、光互联替代铜缆拉动保偏光纤需求高增，从价格战打到涨价 650%，光纤告", "content": "280.04 300.35光互联替代铜缆拉动保偏光纤需求高增，从价格 战打到涨价 650%，光纤告别薄利模式开启价值重 估；PCB下一个升级方向是无布， 28年起高速放 量，市场空间 3年从105亿干到 1600亿——1028 脱 水研报 2026/10/28 19:56 今日内容： 1、光互联替代铜缆拉动保偏光纤需求高增，从价格战打到涨价 650%，光纤告别薄利模式开启价 值重估。 2、PCB下一个升级方向是无布， 28年起高速放量，市场空间 3年从105亿干到 1600亿，这些材料 价值量弹性高。 3、复盘全球酒店龙头成长路径：万豪 20年涨12.53倍、洲际 13.72倍，会员和信用卡费才是重估 的主引擎。 4、橡胶涨 25%、轮胎只涨 3%，这轮不是真赚钱，是龙头靠海外工厂 “躲关税 +锁成本 ”。 【本文来自持牌证券机构，不代表平台观点，请独立判断和决策】 摘要： 1、光纤： 光纤需求正从通信刚需切换为 AI算力刚需。光纤预制棒占产业链 70%利润，扩产周 期长达 1.5~2年，供给刚性凸显， AI光纤又挤占普通光纤产能， A2类预制棒均价自 2025年初以 来涨幅近 550%，G.657.A2 光纤涨幅达 650%。智算中心光纤布线量较传统场景增长数倍甚至 十倍以上， 2026年以来中国光纤光缆出口值从 1月的30.5亿元升至 7月的80.4亿元， CPO规模 化落地还将拉动保偏光纤等高毛利品种放量，行业摆脱薄利模式开启价值重估。关注：长飞 光纤、烽火通信、亨通光电、中天科技、长盈通、长进光子。 2、PCB无布： AI机柜互连速率向 448Gbps 演进，玻纤布与树脂介电常数不同引发的玻纤效 应，让传统有布材料接近损耗与信号完整性瓶颈，无布化成为高速铜互联升级的关键一步。 VR300 NVL576 交换板最可能率先规模采用无布方案，全无布组合有望优先落地。测算无布 PCB市场空间 2028年约1125亿元、 2029年约1600亿元，价值向 CCL/PP制造环节集中， M10 级CCL单价约为 M8的2.7倍。核心公司：胜宏科技、深南电路、景旺电子、东材科技。 3、酒店龙头： 国际酒店龙头 20年走出万豪、洲际等十倍股，全球酒店 Top30市值约 81%集中 在欧美，中国公司仅占 8.2%。定价差距的核心是平台能力：美国连锁化率 73%、客房供给低 速增长，龙头以会员网络、品牌矩阵和轻资产收费把房价生意做成消费平台，特许经营费与 信用卡变现持续增厚现金流，估值中枢从疫前 10-15倍抬升至 15-20倍。反观国内，连锁化率 2025年为41.8%，龙头估值中枢 8-12倍仍低于海外，行业处于周期预期底部，供给侧整合与 品牌升级仍有空间，中线看龙头有潜力实现估值重估。关注：锦江酒店、首旅酒店。 4、轮胎： 东方证券研报指出，橡胶、炭黑比去年涨了 25%-60% ，轮胎厂集体发涨价函（多涨 2%—5% ），但涨价追不上成本，短期还是 “卖一条亏一条 ”。 出口倒是量价齐升： 9月出口均 价创年内新高。 欧盟关税加码，逼着龙头把订单转去海外工厂。 逻辑很简单：国内卷价格， 海外有基地的龙头靠 “就近生产 +避关税 ”穿越成本周期。标的：赛轮轮胎、森麒麟。 正文：   1、光互联替代铜缆拉动保偏光纤需求高增，从价格战打到涨价 650% ，光纤告 别薄利模式开启价值重估 2025年以来， Meta 、亚马逊先后与康宁签下多年期供货协议，英伟达亦与康宁长期合作， AI 竞赛蔓延到底层传输介质。光纤需求正从通信刚需切换为 AI 算力刚需。光纤预制棒占产业链 70%利润，扩产周期 1.5~2 年， A2 类预制棒均价自 2025 年初以来涨幅近 550% ， G.657.A2 光纤 涨幅达 650% 。智算中心光纤用量较传统场景增数倍至十倍以上，供需缺口叠加特纤放量，行 业开启价值重估。关注： 长飞光纤 、烽火通信 、亨通光电 、中天科技 、长盈通、长进光子 。 1）预制棒供给刚性，鲜有大规模扩产 光纤预制棒是产业链的核心壁垒，利润约占产业链的 70% ，扩产周期长达 1.5~2 年，行业前期 价格战后鲜有大规模扩产，中国预制棒生产已处于满负荷运行状态。高毛利的 AI 光纤抢占大 量光棒产能，普通光纤被迫减产，运营商集采在 2026 年迎来复苏，海外出口强劲反弹。 A2类光纤预制棒均价从 2025 年初的 22~30 元 / 等效芯公里涨至 2026 年中的 160 元，涨幅近 550%，G.657.A2 光纤从 2025 年的 32 元 / 芯公里涨至 2026 年 4 月的 240 元，涨幅达 650% 。 2026年以来， 烽火通信 、杭电股份 、远东股份 先后披露定增预案， 烽火通信 拟募资不超 29.13 亿元，投向多模和特种光纤工厂、超大规格光纤预制棒产业化等项目。 自2026年 8 月 14 日起，中国对原产于印度的进口单模光纤继续征收反倾销税，实施期限 5 年， 守住国内光纤价格底盘。 2025 年美国康宁以 19.5% 份额稳居全球首位，中国四家头部企业合 计份额接近 50% 。 01 2）需求从通信刚需切换到算力刚需 单个万卡 GPU 集群仅服务器内部互连就需数万芯公里光纤，数据中心内部的光纤布线量较传 统场景增长数倍甚至十倍以上，英伟达 DGX SuperPOD 仅 32 台 GPU 服务器的配置就需要 384 条400GE 光纤链路。根据 CRU 预计， AI 驱动的光纤需求占比将从 2024 年的不足 5% 攀升至 2027年的 35% 。 02   2025年全球光纤出货量 6.62 亿芯公里，中国占 56.3% 。中国光纤光缆出口值从 2026 年 1 月的 30.5亿元攀升至 7 月的 80.4 亿元。 03 3）CPO落地重构光纤盈利结构 铜缆传输瓶颈已到极限， CPO （光电共封装）让光信号保持到芯片附近，可降低约 40% 的总 体拥有成本，功耗降低 50% 以上。根据 Yole 数据，全球CPO 市场规模将从 2024 年的 4600 万美 元增长至 2030 年的 81 亿美元，年复合增长率高达 137%；Cignal AI 保守估计， 2030 年每年 CPO端口部署量将超 3000 万个。 CPO交换机内部采用保偏光纤互连，带动该高毛利品种放量。保偏光纤市场规模将从 2025 年 的22亿元增至 2032 年的 44 亿元，年复合增长率 10.8% ，高于光纤整体的 5.8% ；康宁、藤仓、 长飞光纤 合计占约 42% 份额，格局有望重塑。空芯光纤也在走向现网， 中国移动 深港专线时 延降至 1毫秒，损耗实测低于 0.09dB/km 。 04 过去光纤行业以普通 G.652D 单模光纤为主，毛利率常年徘徊在 10% 左右；多模光纤、低损耗 G.654.E、空芯光纤等 AI 光纤毛利率远高于普通光纤，正在成为新的利润增长点。 05 看好拥有预制棒产能与特纤先发优势的头部企业。   长飞光纤 是全球光纤预制棒、光纤光缆龙头， 2026 年上半年光传输产品营收同比增长 59.2%，毛利率达 63.11% ，空芯光纤损耗低至 0.040dB/km 。 烽火通信 掌握自主光纤预制棒核心工艺， 2026 年上半年光纤线缆营收同比增长 47.95% 至 29.65亿元，毛利率同比提升 16.78pcts 至 42.26% 。亨通光电 2026年上半年光通信业务营收同 比增长超 130% ，毛利率超 60% 。 中天科技 2026年上半年 AI 算力光纤 G.657.A2 出货量同比增长两倍以上，中标金额超 15 亿元的 数据中心用 MPO 光纤跳线项目，海外销售额同比增长 80% 以上。 长盈通深耕光纤陀螺核心器件光纤环，具备保偏光纤与空芯光纤技术储备。 长进光子 聚焦特种光纤，掺稀土光纤贡献 2025 年营收的 88% ， 2026 年上半年毛利率 64.8% 。 2、PCB下一个升级方向是无布， 28 年起高速放量，市场空间 3 年从 105 亿干到 1600亿，这些材料价值量弹性高 AI机柜互连速率从 224Gbps 向 448Gbps 演进，玻纤效应让传统有布材料接近损耗与信号完整 性瓶颈，无布化成为高速铜互联升级的关键一步。 VR300 NVL576 交换板最可能率先规模采 用无布方案，全无布组合有望优先落地；测算无布 PCB 市场空间 2028 年约 1125 亿元、 2029 年 约1600亿元，价值向 CCL/PP 环节集中。相关公司： 胜宏科技 、深南电路 、景旺电子 、东材科 技。 1）玻纤效应卡住高速信号，交换板率先向无布升级 英伟达 Rubin 、 Rubin Ultra 、 Feynman 机柜互连速率分别向 224 、 337 、 448Gbps 演进，对应 CCL向 M9 、 M9+ 、 M10 升级；自 Rubin Ultra 代际起，传统有布材料将难以满足更高速率下的 损耗要求。 核心原因是玻纤布与树脂介电常数不同，高速信号传输出现偏差，去除玻纤布可提升介电均 匀性。 无布化的材料形态可划分为 无布CCL 、无布 PP/ 树脂膜与 RCC：无布 CCL 用于芯板，无布 PP 用于层间绝缘粘结， RCC/ 树脂膜用于芯板外积层。 06 无布应用分为算力 PCB 与光模块两种场景，共同目标是降低损耗、提升信号完整性，差异在 切入位置与材料形态。 算力PCB 采用无布 CCL/PP ，由信号层向芯板骨架深入，面向高层数、大尺寸交换板。 光模块则采用 RCC/ 无布树脂膜聚焦芯板外积层，以薄介质和 mSAP 实现微孔、细线 路。 07   2）全无布组合有望优先落地， NVL576 机柜放量， 2028 年无布 PCB 空间破千亿 预计VR300 NVL576 交换板形成四种 Core 加 PP 组合： CCL Core 分 PTFE 无布与碳氢无布两 档，PP分 M9 Q 布与碳氢无布两档。其中 全无布方案在高频性能与材料经济性上具备优势，有 望优先落地并成为主要方向 ；含Q布方案作为量产供应或加工可靠性不足时的备选。 放量节奏系于 VR300 NVL576 机柜出货。研报预计 2027 年、 2028 年分别出货 500 套、 6000 套，对应无布 PCB 市场空间 2027 年约 106 亿元、 2028 年约 1125 亿元、 2029 年约 1600 亿元。分 方案看， PTFE 无布 CCL 加碳氢无布 PP 的组合 2028 年市场规模将达 362 亿元，成为交换板主流 方案。 08 材料端同步受益。无布 CCL 市场空间 2027 年、 2028 年分别约 12 亿元、 116 亿元，配套 PP 分别 约11亿元、 131 亿元，两项合计 2028 年约 247 亿元。上游材料 2028 年配套空间约 58 亿元，其中 碳氢树脂约 27 亿元，占上游材料总规模约 47% ，为价值量占比最高的材料。 09   3）价值向 CCL/PP 集中，龙头定价能力增强 无布方案以低价树脂替代高价高端玻纤布，叠加高性能溢价，高端 CCL 提价显著， 预计M9、 M10级 CCL 的 ASP 分别约为 M8 的 1.8 倍、 2.7 倍。 性能升级主要在 CCL/PP 制造端实现，低损耗性能由树脂配方、成膜及压合工艺决定， CCL/PP厂定价能力相对较强； PCB 厂主要承担加工适配，预计无布化带来的利润提升相对有 限。后续随良率提升和规模化降本，材料成本与售价差有望进一步扩大。 10 4）相关公司 ①PCB制造端：具备 PTFE 等高速材料量产或加工能力，多家入列英伟达 OCP 全球峰会 NVLink PTFE Board 展示名单，相关公司包括 胜宏科技 、深南电路 、景旺电子 。 ②树脂材料端 ：高速电子树脂布局完善， 2 万吨 / 年高速电子材料项目已启动投料试车， M10 树 脂处于下游验证阶段，相关公司包括 东材科技 。 ③光模块 RCC 积层端：1.6T光模块 RCC 应用产业化推进，量产与认证案例陆续落地，相关公 司包括四会富仕 （800G RCC 光模块板已量产， 1.6T 样品获终端认证）、 中际旭创 （子公司苏 州旭创授权专利提出 RCC 加 mSAP 方案）、 宏昌电子 （GBF C+ 增层膜获相关板厂认证）、 迅 捷兴、则成电子。 3、复盘全球酒店龙头成长路径：万豪 20 年涨 12.53 倍、洲际 13.72 倍，会员和信 用卡费才是重估的主引擎 全球酒店 Top30 市值约 81% 集中在欧美，中国公司市值占比仅 8.2% ，万豪、洲际 20 年走出十 倍股。分化定价的核心是平台能力：美国客房连锁化率达 73% ，龙头靠会员网络、品牌矩阵 与轻资产收费，把房价生意做成可持续变现的消费平台，估值中枢从疫前的 10-15 倍抬升至   15-20倍。国内连锁化率 2025 年为 41.8% ，龙头估值中枢 8-12 倍仍低于海外，周期预期底部存 在重估空间。关注：锦江酒店、首旅酒店。 1）全球酒店市值八成在欧美，定价差距不在客房在平台 全球酒店上市公司 Top30 样本中，欧美公司市值占比约 81% ，中国公司数量占 20% 、市值占比 却只有 8.2% ；美国仅五家公司就贡献约 65% 的总市值，万豪与希尔顿合计约 56% 。 11 龙头的长期回报同样惊人， 2006 年 10 月至 2026 年 10 月，万豪、洲际前复权股价分别达到期初 的12.53倍、 13.72 倍。 市值差异与客房数量并无线性关系，定价更多取决于品牌网络能否持续转化为扩张、盈利与 现金回报 ：高加盟及管理占比提高利润率，会员直销降低获客成本，品牌跨区域复制扩大增 长边界，美国龙头因此按全球消费平台定价，中国正处于效率平台向品牌资产跃迁的阶段。 平台定价背后是供需与渠道的差异。 2023-2025 年美国客房供给增速仅 0.2% 、 0.5% 、 0.7% ， 2024年客房连锁化率达 73% ，高于中国的 41.8% ；北美官渠直销占比也高于亚太，较早建立 的品牌与会员体系让集团保留更强的客源组织能力。 2）景气只决定波动，估值中枢从 10-15 倍抬到 15-20 倍靠平台 欧美酒店集团估值持续受周期影响，但中枢已经分层。 疫前估值中枢在 10-15 倍， 2023 年至 2026年 10 月，希尔顿、万豪平均远期 EV/EBITDA 分别为 17.9 倍、 16.0 倍，较 2010-2019 年明 显上移， 2026 年上半年进一步升至 20.5 倍、 18.1 倍。 中枢上移的支撑来自平台扩张。万豪 2016 年收购喜达屋后推进会员统一， 2019-2025 年期初 已有品牌贡献 83% 的系统房量净增，矩阵化能力突出。希尔顿 2017 年分拆酒店资产后， Home2、 Tru 等品牌持续拓宽开发空间。 精选国际是反例，矩阵化接力受限， 2025 年 Comfort 、 Quality 加盟合同退出率约 3.2% 、 6.1%，高于 Courtyard 、 Hampton 约 0.7% 。 会员网络是平台能力的客源基础。 2025 年末万豪会员接近 2.71 亿、希尔顿 2.43 亿；网络覆盖 扩大、会员复用增强、业主投资吸引力提升、品牌矩阵接力扩张的飞轮已经形成。 3）轻资产加多元变现，把会员网络变成持续现金 收费结构持续优化，降低对物业经营利润提成的依赖。 2019-2025 年，万豪、希尔顿特许经营 费占毛收费比重分别由 49.7% 、 48.8% 升至 61.1% 、 80.1% ，总部费用占毛收费比重同步摊 薄，盈利和现金流随之改善。 会员与品牌价值还在客房之外变现。万豪信用卡品牌费由 2019 年的 4.10 亿美元增至 2025 年的 7.16亿美元， 2024-2025 年万豪加盟费增加 2.12 亿美元，其中约 1.05 亿美元来自信用卡及其他 品牌收费增长，已接近房量增长的贡献 。两家同期经营现金流年均复合增速分别为 11.4% 、 7.4%，为持续分红回购提供支撑。 现金创造进一步支撑股东回报。万豪 2026 年股东返还指引超过 45 亿美元，希尔顿约 35 亿美 元；洲际的中长期框架下，收费利润率年均提高 100-150 个基点，支撑调整 EPS 年均增长 12%-15% 的机会。 4）回到中国：周期预期底部，龙头折价孕育重估空间   中国现代化酒店起步至今才 20 余年， 2025 年连锁化率 41.8% ，仍低于美国的 73% 。国内已跑 出通过产品更新和门店迭代形成的效率龙头，以及基于用户体验形成的中高端龙头，会员积 累与平台化建设体现在差异化溢价和市占率稳步提升上。 当前龙头估值较海外同一资本市场公司仍有折价， 华住、亚朵 EV/EBITDA 中枢为 8-12 倍，而 海外龙头中枢已抬升至 15-20 倍。国内市场供给侧整合、品牌升级仍有提升空间，龙头品牌与 供应链等创新性变现走出特色成长路线，股东回报红利属性亦开始体现，中线看龙头有潜力 实现估值重估。 12 受益方向上，整合提效与推进整合、具备周期修复弹性的锦江酒店、首旅酒店值得关注。按 盈利预测，锦江酒店 2025-2028 年利润复合增速约 19% ，首旅酒店约 15% 。 4、橡胶涨 续至2036年，其他主要协议也覆盖2028年之后，部分存在不可取消、最低支付安排。8 年维度披露的上限是 8000 多亿的投资。 5️⃣ 后续定价看未来指引，也要防利润率短期回落 单看报表，Anthropic的成长性与经营杠杆非常突出，但不少历史增长和盈利信息此前已有报道。更能推动下一阶段预期的，是非Coding收入能否放量、2027—2028年收入与现金流指引，以及新增算力上线后的利润率。 85.4%的H1计算毛利率也要看口径：云渠道收入按总额确认，渠道费用列在销售营销中；机械扣掉全部职能销售营销费用后，收入余量约62%，还需覆盖研发和管理。公司同时提示，近期将增加采购单价更高的短期算力，压缩经营利润率。 总额的来说： 这份 S1 给了一个更清晰的标准，路边社的信息以后都会在这些信息上比较，确实高了算力的长期置信度，但 arr 增长的问题还没有解决，后面就等指引了。大票也具备反弹的条件了。#文字观点", "publish_time": "2026-10-28 07:42", "tags": ["文字观点"]}, "post:2026-10-28T22-42:fd53e6aabb1f": {"id": "post:2026-10-28T22-42:fd53e6aabb1f", "kind": "post", "title": "2026-10-28 22:42", "source_label": "帖子正文", "excerpt": "【臻宝科技】Q3营收同比+32%，国产非金属零部件龙头高速成长！📖事件：公司发布26年三季报，Q3业绩： 【收入】3.11亿元，yoy+32.4%，qoq+19.3%", "content": "【臻宝科技】Q3营收同比+32%，国产非金属零部件龙头高速成长！ 📖事件：公司发布26年三季报，Q3业绩： 【收入】3.11亿元，yoy+32.4%，qoq+19.3%； 【归母】0.74亿元，yoy+2.3%，qoq+32.0%； 【扣非】0.70亿元，yoy+1.9%，qoq+31.7%； 【毛利率】48.2%，yoy-4.8pct，qoq+1.6pct； 👉下游半导体制造行业高增长态势延续且产线稼动率持续维持高位，叠加零部件国产化进程持续推进，驱动公司营业收入实现增长。 🌹“原材料+零部件+表面处理”一体化平台 公司是国内非金属零部件龙头，产品广泛应用于刻蚀、薄膜设备，高度适配存储、先进逻辑产线； 此外，公司布局单晶硅棒等原材料，并重点攻克静电卡盘、氮化铝加热器等“卡脖子”环节，持续完善一体化平台型布局。 🌹非金属零部件国产替代空间极大 2024年fab厂直采零部件国产化率不足10%，长期被Ferrotec、Hana等海外公司主导，亟需国产替代；公司24年直供Fab硅零部件、石英零部件均本土第一，国产替代卡位核心。 预计28年非金属零部件、显示面板零部件、表面处理市场分别有望达227/27/94亿元，合计约348亿元，替代空间广阔。 🌹公司卡位核心先进制程&存储的同时还具备出海存储厂逻辑 公司25H1零部件用于先进制程占比超6成！核心产品已批量供货于14nm及以下逻辑、200L+ 3D NAND、20nm及以下DRAM等产线，客户涵盖国内主流先进逻辑、存储厂商。 公司已对大连海力士稳定批量供货，且已供货新加坡GF和联电，此外公司已与美光建立合作，具备出海逻辑！ 🌹股东阵容豪华 股东包括长存系、中芯系、华虹系京东方系、大基金二期、及上海半导体装备等，阵容豪华。 风险提示：行业景气度不及预期；技术迭代不及预期等。#文字观点", "publish_time": "2026-10-28 22:42", "tags": ["文字观点"]}, "post:2026-10-28T22-32:170e2e43736d": {"id": "post:2026-10-28T22-32:170e2e43736d", "kind": "post", "title": "2026-10-28 22:32", "source_label": "帖子正文", "excerpt": "#出处未知机器人大行情的分析-20261028 大盘两次翻转两次和机器人批量涨停共振，这个现象非常关键：大盘杀跌、恐慌盘出来的时候，资金不愿意去老主线（算力、存储等），就会找一个新故事+筹码干净+催化密集的板块抱团，这就是典型的逆势主线特征： 1. 叙事升级：从人形机器人 → 物理AI（具身智能） ", "content": "#出处未知机器人大行情的分析-20261028 大盘两次翻转两次和机器人批量涨停共振，这个现象非常关键：大盘杀跌、恐慌盘出来的时候，资金不愿意去老主线（算力、存储等），就会找一个新故事+筹码干净+催化密集的板块抱团，这就是典型的逆势主线特征： 1. 叙事升级：从人形机器人 → 物理AI（具身智能） 这次不再只是减速器、电机的硬件老故事，现在讲的是AI从屏幕里走到现实世界，英伟达、OpenAI、特斯拉全部加码物理AI；国内出了人形机器人国标、九部门政策、上海专门发文支持物理AI装备，政策+海外巨头共振，故事容量足够大，装得下大量资金。 ​ 2. 产业催化密集，不是单一消息 特斯拉Optimus量产时间表落地、宇树科技大会持续放演示、国内人形整机放量、场景开始落地（电力、仓储、工厂），催化是一串、不是一次性利好，资金愿意反复回来做 。 ​ 3. 前期跌了很久，筹码结构好 板块之前长时间、大幅度调整，机构持仓低、拥挤度低，没有大量套牢盘一涨就砸；所以游资、短线资金拉起来阻力小，容易扩散到全产业链（轴承、丝杠、减速器、传感器、电机、整机），一扩散就出现几十只涨停。 ​ 看多的理由 ： 1、赛道空间足够大：物理AI/具身智能是AI下一个大方向，不是一个小细分题材； ​ 2、催化持续有：后面还有产业大会、整机新品、量产验证、政策落地，不是一次性消息； ​ 3、已经走出逆势辨识度：大盘跌它能独立走强，大盘震荡它继续扩散，这是主线的标志； ​ 4、梯队完整：有趋势中军（宇树这类）、连板高标、分支龙头、低位补涨小票，梯队搭起来了。#文字观点", "publish_time": "2026-10-28 22:32", "tags": ["出处未知", "文字观点"]}, "attachment:files/物理AI专家对话——数采会是下一个风口吗？20261027.pdf": {"id": "attachment:files/物理AI专家对话——数采会是下一个风口吗？20261027.pdf", "kind": "attachment", "title": "物理AI专家对话——数采会是下一个风口吗？20261027", "source_label": "其他", "excerpt": "物理AI专家对话——数采会是下一个风口吗？20261027 要点总结 1.数据与模型是具身智能的两大胜负手，数据是当前最大短板：具身智能从实验室走向商业表演等场 景后，真实物理世界操作能力的核心瓶颈在于数据。", "content": "物理AI专家对话——数采会是下一个风口吗？20261027 要点总结 1.数据与模型是具身智能的两大胜负手，数据是当前最大短板：具身智能从实验室走向商业表演等场 景后，真实物理世界操作能力的核心瓶颈在于数据。当前数据采集主要有三种模式：真机遥操作采集、 仿真环境生成数据、无本体数据采集。 2.三种数据采集方式各有优劣：真机遥操作技术最成熟，但需购买部署大量机器人本体并聘请专业采 集人员，成本高、效率低；仿真数据存在sim-to-realgap；无本体采集（源自MIT等高校论文）无需 部署机器人本体，通过夹爪或头环等轻量设备即可在真实工作场景中采集人类操作数据，成本低、效率 高。 3.今年三季度起物理AI数据需求明显爆发：需求方从单纯的具身模型公司扩展到通用大语言模型公 司，后者在模型能力触及天花板后，从纯语言模型向多模态、再向物理AI模型演进，开始寻求物理AI 数据提升模型能力。行业对数据的需求规模达数千万小时甚至上亿小时。 4.工业与物流是当前优先落地场景，家庭场景相对复杂：模型厂商普遍看好工业和物流场景率先落 地，因其具备旺盛的具身智能需求、付费能力，且存在大量简单重复性劳动。德玛已在自有工厂部署第 一人称无本体数据采集设备，采集空包、上包、分拣、码垛等场景数据；家庭场景则通过社会众包采集 网络（家庭主妇、居家人员佩戴设备）获取数据。 5.模型路线从VLA转向世界模型与端到端：随着规模化数据供给明确，行业从传统VLA技术路线转向 以世界模型和端到端技术为代表的路线。美国某公司今年8月发布首个基于百万第一人称数据的模型， 国内自然进化上个月也发布首个百万级数据的端到端世界模型，国内外模型代差进一步缩短。 6.真机数据占比将持续弱化，但不会完全消失：英伟达今年2月论文已将真机数据从100%弱化到 10%-20%。行业目标是先用真实世界无本体数据训练基模，再搭配少量真机数据做后训练和对齐，适 配不同机器人本体，类比Windows系统适配不同电脑仍需少量驱动程序。 7.德玛积极布局全模态数据，今年4月发布M异构解决方案：德玛从去年部署真机训练场到今年布局 无本体数据采集，今年4月在国内行业率先发布M异构解决方案，包含完整采集硬件和全自动数据采 集管理管线，已构建较广泛众包采集网络，是国内少有的能部署从真实数据、无本体数据到真实场景后 训练部署全模态数据的公司。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 8.无本体采集成本较真机采集降低约100倍：真机采集需投入机器人本体加采集设备约40万元，专 业采集人员加机器人每天仅能采集1-2小时有效数据；无本体采集设备为万元级（未来有望降至千元 级），设备寿命2-3年，每岗位每天可积累5-6小时有效数据，每小时采集成本从数千元降至数十 元。 9.当前采集以视觉为主，力觉触觉尚待成熟：无本体采集主要设备为含多目相机的头环，以第一视角 记录操作过程，通过算法还原手部关节。力觉传感器价格高（三副采集手套数万元）、可用性差（1-2 周即损坏），行业当前聚焦让模型具备初步泛化和操作能力，以视觉为主，未来将补齐触觉、温度、力 觉等多模态信息。 10.数据生意壁垒在于模型认知、规模化部署能力与场景资源：一是对模型有充分认知，知道什么数据 对模型有用（前期部分中小公司采集的数据大部分无用）；二是能快速规模化部署采集能力，实现百万 至千万小时数据规模，模型厂商倾向绑定少数几家数据公司；三是拥有丰富场景资源，德玛在工业、物 流场景有自有工厂和大量客户积累。 11.德玛定位整合场景、数据、模型、本体，与多家厂商开放合作：德玛与蚂蚁宁波签署战略合作（蚂 蚁宁波聚焦机器人世界模型/大脑），并与优必选等本体厂商及大脑厂商合作，整合成可落地解决方 案。今年年底将发布垂类模型，在分拣、搬运等简单场景达到七八十分效果，后续通过POC部署持续 优化。 12.数据需求是长期过程，模型规模将持续扩大：类比大语言模型和自动驾驶，模型追求通用和泛化需 海量数据。当前受算力和数据规模限制，模型参数约数百亿级别，未来有望达千亿、万亿规模。从70 分提升到80分、90分所需数据量呈指数级增长，且未来复杂工况和长流程工作流将进一步推高数据需 求。 问答整理 Q1：今年以来德麦琴是否感受到训练数据订单的变化？OpenAI等参与具身智能大脑层面， 对数据采集热度是否有明显提升？ 答：是的，特别是今年三季度以来，明显感觉到物理AI数据需求从原来单纯的具身模型公司转向通用 大语言模型公司，后者也开始寻求物理AI数据提升模型能力。数据和模型、算力是AI行业三驾马车， 模型公司最稀缺的是数据。随着无本体数据采集模式兴起，行业看到数据规模化的前景（行业称为\"数 据规模定律\"），无本体采集成本低、效率高，使数千万小时甚至上亿小时的数据供给成为可能。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 OpenAI及国内通用大语言模型公司在模型触及天花板后，从纯语言模型向多模态、再向物理AI模型 演进，三季度起市场迎来需求爆发。 Q2：面向不同场景，解决方案有何不同？物流领域机器人用储备模型配合技能包数据采集训 练，更复杂场景是否还需物理AI模型突破？ 答：模型能力当前受限于算力和数据，数据短缺导致通用场景泛化操作能力尚未达到真实落地水平。与 主流模型公司交流，其诉求有二：一是对具身智能需求旺盛、有付费能力；二是场景存在大量简单重复 性劳动。家庭场景最多变、相对复杂；工业和物流是模型厂商普遍看好优先落地的场景，德玛数据采集 也集中在这两个场景，家庭场景也有在谈。家庭场景数据供给相对充足，可通过慢行构建的社会众包采 集网络，由家庭主妇或居家人员佩戴设备在家采集。工业物流与德玛自身资源禀赋有关，德玛有良好物 流生产场景，已在自有工厂部署第一人称无本体采集设备，采集工人真实劳动场景，通过自主数据管理 系统打包成规模化数据集。物流场景当前仍有大量空包、上包、分拣、码垛等简单重复劳动，适合部署 无本体设备采集数据。（ ） Q3：如何看待OpenAI、英伟达、谷歌等海外模型路线的优劣势？哪种可能较快跑出来？ 答：模型与数据相辅相成。最早押注VLA路线是因当时语言数据最充足。随着新数据路线明确和规模 化数据供给，行业从传统VLA转向以世界模型和端到端技术为代表的路线。美国某公司今年8月发布 首个基于百万第一人称数据的模型，在厨房、家庭场景展现不错的泛化操作效果；国内自然进化上个月 发布国内首个百万级数据端到端世界模型。国内外模型代差进一步缩短，都从VLA转向世界模型，更 强调端到端和整体操作的通用泛化。除具身公司外，通用大语言模型公司也开始将人类真实数据特别是 第一人称无本体数据加入模型，物理AI前景看到明显曙光。 Q4：OpenAI等通用大模型用在机器人上效果不错，后续是否会带来技术变革？ 答：通用大模型公司和具身公司从不同方向朝通用物理AI目标前进。OpenAI为代表的项目，语数王 总在大会上提到已开始把通用大模型部署到语数机型上。不同路线都在从信息AI大语言模型转向物理 AI方向。通用大语言模型公司对千卡万卡算力基建更熟悉，拥有庞大算力也能很好消化数据，对数据 使用情况乐观，未来方向展现良好进展。 Q5：物理AI大脑能否进化到不需要真机训练？还是绕不开真机训练？ 答：终极目标是用更高效率使用数据。当前技术路线在逐渐弱化真机数据，因其成本高、采集慢，但当 前技术条件下对真机数据使用仍较熟悉。英伟达今年2月论文已将真机数据从100%弱化到10%- 20%。与国内外模型厂商交流，目标都是尽可能降低真实数据，主要通过真实世界无本体数据训练基 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008vx:WUXL3408 模，再搭配少量真机数据做后训练和对齐，适配不同机器人本体。类比Windows系统可适配不同电 脑，但仍需少量驱动程序，真机数据价值主要在此。 Q6：模型趋势是减少真机训练，德玛业务对应真机训练层面，如何应对可能不利的趋势？ 答：德玛一直积极部署多模态数据，从去年真机训练场到今年无本体数据采集，今年4月在国内行业率 先发布M异构解决方案，包括完整采集硬件和全自动数据采集管理管线。当前已构建较广泛众包采集 网络，努力构建真实场景数据集，紧密跟随行业技术趋势，是国内少有的能部署从真实数据到无本体数 据再到真实场景后训练部署全模态数据的公司，布局非常领先。 Q7：无场景数据指哪方面？ 答：即第一人称数据采集，佩戴轻量头环和手环，在真实场景中由工人、家庭主妇等佩戴设备采集人类 真实操作数据。 Q8：可否理解为真机训练和数据采集蛋糕可能变少，但德玛竞争力足够，通过强化竞争力实 现技术进步拿到更多份额？ 答：除真机数据外，德玛已较早部署第一人称无本体数据。未来主粮或主教材应是无本体第一人称数 据，德玛已在国内较早部署；真机数据相当于维生素，仍需要但规模比不上无本体数据。整体数据市场 规模未来乐观。模型公司研发费用主要两块：算力和数据，数据是具身智能产业链投资主要方向。 （ ） Q9：请再展开分享真机和无本体数据的优缺点。 答：真机数据好处是直接，采集机器人关节运动角度等数据，模型训练使用难度小；缺点是采集成本 高、效率低，需购买机器人本体（十几万到数十万元），雇专人搭建场景遥控操作，一个采集人员加一 台机器人每天仅采集1-2小时有用数据，近两年真机数据规模未达行业规模化需求。无本体数据采集不 依赖机器人本体，无需购买机器人，从第一性原理出发，人类每天都在生产大量数据只是未被记录。德 玛开发系列采集硬件，头环以第一视角记录手部操作和胳膊运动，经数据管线加工成模型可用数据集。 各行业工作人员正常工作即可记录数据，一个岗位每天工作8小时可积累5-6小时有效数据，且岗位无 处不在，千行百业都可佩戴设备采集，为模型训练提供源源不断的数据来源，即行业所说的规模效应。 Q10：无本体数据采集的成本结构如何？ 答：主要成本为一次性采集设备，万元级别，未来有望降至千元级别；同时给真实场景工作人员少量采 集补贴。每小时采集成本从数千元降至数十元，单位时间降低100倍。原先部署真机采集，投入一台 本体加采集设备需达40万元。采集硬件为电子设备，正常使用2-3年不成问题。当前规模未完全铺 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008vx:WUXL3408 开，希望构建万人甚至10万人采集规模，随着设备量产和研发费用分摊，单纯BOM成本会较快下 降。 Q11：目前主要采集设备有哪些？未来可能增加哪些设备？ 答：M异构解决方案主要设备为含多目相机的头环，以第一视角记录操作过程，通过算法还原手部关 节和操作方式，变成模型可用数据。人对物理世界认知超过50%-60%通过视觉获取。未来需补齐力 觉、触觉等信息，行业有触觉手套、力觉手套、肌肉电极（EMG）等方案反向推算手部力量。当前设 备主要是视频、音频数据，未来随产业链成熟将补齐触觉、温度等感官信息，与机器人模型训练对齐。 Q12：工业和物流场景很需要力觉和触觉（拿不同重物），之前未做是技术未攻克还是需求不 迫切？ 答：类比采集数据是为机器人模型准备教科书，当前教科书处于通识教育阶段，以视觉为主。力觉主要 问题是传感器价格未下来，力觉采集手套三副就要数万元，可用性差，约1-2周就损坏，传感器件尚未 成熟。当前模型厂商最聚焦让模型具备初步泛化和操作能力，所以以视觉为主。随着产业和模型能力成 熟，将从通识教育教材转向专门教育教材，产业与行业相辅相成。 Q13：目前模型训练市场训练时长达到1万小时级别？ 答：前期行业VLA模型或早期数据规模在数千小时到1万小时。最新无本体方向因数据规模能快速拉 起，通过佩戴简单设备采集手部操作，可快速把数据规模推到数十万甚至数百万小时。当下领先模型的 门槛是百万小时人类数据，明后年随世界模型发展，百万小时门槛可能降到10万小时。类比大语言模 型参数规模，当前模型规模较小只能吃较少数据，具身智能模型要达到GPT-3或GPT-4那样初步通用 泛化操作能力，需要上亿小时数据规模。 Q14：针对物料搬运等具体场景，目前模型能力下实现实用操作需10万小时训练；明后年模 型泛化能力强化后，训练时长会否大幅压缩？ 答：逻辑应反过来理解：随着模型能力增加，所需数据规模（小时数）会越来越多，类比人需要看更多 书才能学会更多知识技能。未来物流和工业场景机器人展现良好操作能力，可能需要千万甚至上亿小时 数据规模，能吃下更多数据。这不是训练时长概念，而是预先采集更多数据用于预训练或后训练，对模 型进行训练和调整，类比大语言模型参数规模越来越大。模型越发达，所需数据越多，泛化通用操作能 力越强，工业、物流、生活各场景部署进程会加快。（ ） Q15：德玛物流场景方案（自研模型+数据采集训练）是否会持续执行？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008vx:WUXL3408 答：一个具身智能机器人或通用机器人在场景落地，需要：好的操作本体、能力不错的模型、足够数据 训练、好的部署场景。德玛与行业整体厂商和模型厂商建立良好合作，近期与蚂蚁宁波签署战略合作 （蚂蚁宁波聚焦机器人世界模型/大脑）。德玛对场景有深刻认识，积累大量数据，与领先模型厂商和 本体厂商合作，目标是让机器人在场景真正用起来。德玛定位是整合场景、数据、模型、本体，借助市 场渠道和服务网络在客户场景落地应用。当前聚焦两点：一是采集足够多数据，积累对场景的理解和数 据；二是以开放态度与优必选、资源等本体和大脑厂商合作，整合成真正可落地的解决方案。 Q16：蚂蚁宁波的模型方案大概是什么参数级别和思路？ 答：今年年底会发布垂类模型。该模型采用多模态、多样性、高质量数据训练，所需数量级并不大。目 标是在分拣、搬运等较简单场景达到七八十分效果，能开始简单应用，类比小孩子学走路跑步。通过 POC客户端部署时，再根据实际场景进一步调整优化，部署和POC过程中也积累实际数据和应用。模 型刚出来约70分效果，POC测试完成后提升到80分甚至更高才好向客户部署。后续所需数据量不一 定全靠自己专门采集，客户端也可不断积累。从70分到80分所需数据量比以前更高，80到90或更 高水平所需数量级呈指数级提升。蚂蚁宁波合作模型的具体参数待12月正式发布时披露。 Q17：数据采集行业竞争格局如何？主要参与玩家有哪些？ 答：数据对模型作用直接且重要。目前参与方除专业数据公司外，各家具身模型公司也推出自己的采集 方案，但主要自用，同时积累数据采集认知并反馈给专业数据公司。行业格局：最顶层是客户即模型公 司；中间层是行业主流数据采集公司；最下层是拥有场景的服务公司或原人力资源公司，可快速组织较 多人力资源，部署设备实现数据回流采集。 Q18：数据生意的壁垒主要在哪些方面？ 答：第一，要对模型有充分认知，与模型厂商保持良好沟通，知道什么数据对模型有用。前期有中小公 司看似门槛不高地佩戴设备快速采数据，但大部分数据无用。第二，能快速部署扩展数据采集能力，实 现百万小时、千万小时规模化数据。模型公司数据需求巨大，但不可能无限对接很多数据公司，倾向绑 定少数几家实现规模化供给。第三，拥有丰富场景，能按模型公司要求规模化采集数据。以德玛为例， 在工业、物流场景本身有优势，无论自有工厂还是大量物流行业客户，都是过往积累。 Q19：若海外世界模型（如英伟达GR00T）非常发达，进入物流物料搬运场景只需少量技能 包和操作演示就能学会，实操效果很快很好，是否有这种可能性？ 答：类比大语言模型和自动驾驶，模型最终追求通用和泛化，需学习各种数据、各种能力来充分认识理 解物理世界。即使今天各家大模型公司仍在追求数据规模，自动驾驶公司也通过不停路试和用户真实操 作回流数据。具身智能所需数据规模可能比自动驾驶和大语言模型成百上千倍，数据需求是长期过程。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0 量产光模块与光芯片的厂商。75mW CW已大规模外销，26H1光芯片收入同比+424.6%，毛利率转正至40.7%；400mW CW、3.2T NPO均已送样，预计27年规模量产。NPO/CPO时代不再是“标准件”，需要与客户平台共同定义，能同时调光芯片和光引擎的厂商迭代最快，公司的双栈能力可快速变现。 #红筹架构+海外产能早布局，制裁风险低。公司在香港上市，注册在BVI英属维京群岛。2024年就提前完成海外产能布局，泰国基地二期已投产，美国新泽西工厂运营超10年可独立生产光芯片与光模块。目前海外需求均产于泰国，免征美国关税，若FCC落地可直接切换美国生产。 #北美大客户突破，报表已开始兑现。美国客户C已跃居第一大客户（26H1占比21.0%），终端直通北美CSP。报表端，26H1美国收入同比+95.8%，数通毛利率同比+4.5pct至27.1%。公司现已实现800G/1.6T量产，明年大规模爆发，境外占比和毛利率还有上行空间。#文字观点", "publish_time": "2026-10-28 13:07", "tags": ["文字观点"]}, "post:2026-10-28T09-21:d2e5f20a006b": {"id": "post:2026-10-28T09-21:d2e5f20a006b", "kind": "post", "title": "2026-10-28 09:21", "source_label": "帖子正文", "excerpt": "大摩——大中华区科技硬件：2026年TPCA展会要点总结 一、PCB供应链标的偏好排序（基于目标价上行空间） 摩根士丹利在PCB供应链覆盖范围内的首选顺序为：TUC（联茂）、EMC（台耀）、Co-Tech（钴技）、UMTC（南电）、NYPCB（楠梓电）、GCE（金像电）。二、核心产业要点 第一，PT", "content": "大摩——大中华区科技硬件：2026年TPCA展会要点总结 一、PCB供应链标的偏好排序（基于目标价上行空间） 摩根士丹利在PCB供应链覆盖范围内的首选顺序为：TUC（联茂）、EMC（台耀）、Co-Tech（钴技）、UMTC（南电）、NYPCB（楠梓电）、GCE（金像电）。 二、核心产业要点 第一，PTFE CCL材料路线博弈。 纯PTFE覆铜板具备最优信号完整性，是部分客户中板及交换PCB的首选，但加工难度显著。高多层板制程需接近400摄氏度的特殊高温压机，标准真空压机无法满足。台湾CCL供应商对PTFE态度偏保守，正同步探索碳氢化合物基材、碳氢加PTFE混合方案以及BCB（苯并环丁烯）基材等替代路线。下一代AI服务器机架的CCL材料选择预计最迟于2027年年中确认。摩根士丹利判断，若最终未采用PTFE基CCL，结果将偏向利好EMC与TUC，对生益科技略偏负面。 第二，基板CCL产能扩张与盈利改善。 EMC展出的S572T产品为当前最先进基板CCL，将于2026年第四季度进入量产，2027年出货量逐季攀升。EMC预计其基板CCL产能至2028年末将较当前水平增长一倍以上，并已取得多家主流ABF基板客户认证，同时额外认证了低CTE玻璃供应来源以保障原料安全。基板CCL产品毛利率高于传统PCB CCL，该业务占比提升将结构性改善EMC的盈利能力。Unimicron等基板制造商也将因此获得替代供应渠道，具正面意义。 第三，薄型电子玻纤布供应持续紧张。 多家CCL供应商将薄型E玻纤布列为关键材料瓶颈，普遍预期短缺及价格上行将贯穿2027年上半年，部分供应商认为可能延续至2027年下半年。核心制约在于日本制织机供应不足，且现有产线正转向LDK及T玻纤布生产以响应AI需求拉动。部分玻纤布厂商对采用非丰田织机持谨慎态度，因缺陷率偏高且维修成本不具经济性。 第四，ABF层压机成为基板扩产关键瓶颈。 EPM（永恒精密机械）在全球ABF真空层压机市场占据95%以上份额，设备交期已拉长至至少两年。EPM新绿地产能直至2029年方可投产，过渡期内仅能通过优化现有产线及租赁第三方闲置产能缓解瓶颈。一座新ABF基板厂依布局不同至少需要10套以上最先进三段式真空层压机及前置追踪机。此瓶颈意味着新绿地ABF基板产能最早需至2029年才能开始爬坡，2027至2028年ABF基板供应缺口将加深。 第五，玻璃芯基板短期难商业化。 未来两到三年内玻璃芯基板不具备商业可行性。核心障碍为微裂纹检测及封装可靠性问题，ABF多层压合后现有自动光学检测工具无法有效识别微裂纹。此外，高深宽比玻璃通孔的金属化工艺亦极具挑战。 第六，基板大尺寸化推升良率管控难度。 至2028年基板尺寸将迈向230毫米乘230毫米，单面板仅能产出四颗基板。此规格下，面板上任何单点缺陷即意味着25%的良率损失，对制程控制提出极高要求。 三、投资推论 ABF层压机交期至少两年，新产能最早2029年释放，2027至2028年ABF基板供不应求格局将加剧，支撑摩根士丹利对先进封装基板需求的正面判断。CCL材料路线不确定性将于2027年中消除，EMC与TUC为当前相对受益标的。#文字观点", "publish_time": "2026-10-28 09:21", "tags": ["文字观点"]}, "post:2026-10-28T21-15:32af860fc1cb": {"id": "post:2026-10-28T21-15:32af860fc1cb", "kind": "post", "title": "2026-10-28 21:15", "source_label": "帖子正文", "excerpt": "浙商机械【杰美特】单Q3归母净利润实现扭亏，涂层钻针有望突破，持续推荐！2026Q3单季度，公司实现营收2.0亿元，同比+34%", "content": "浙商机械【杰美特】单Q3归母净利润实现扭亏，涂层钻针有望突破，持续推荐！ 2026Q3单季度，公司实现营收2.0亿元，同比+34%；归母净利润0.01亿元，#同比、环比扭亏。2026Q1-Q3，公司实现营收5.1亿元，同比+15%；亏损0.1亿元，同比减亏48%。核心逻辑：新一代PCB钻针新秀，技术迭代阿尔法强 1️⃣行业： AIPCB板材升级、层数提升，新一代涂层钻针渗透率有望抬升 PCB板材向M8、M9升级，层数从12-16层提升至24-40层。钻针寿命由1000孔（M8）降至100-200孔（M9），急需升级。 金刚石涂层钻针寿命较普通PCB钻针可提升10倍以上，有望加速应用。 2️⃣戴尔蒙德（公司持股52%）：新一代PCB涂层钻针新秀，白针扩产业绩有望释放 #戴尔蒙德CVD金刚石涂层技术优势显著。公司CVD纳米金刚石涂层拥有十余年技术积累与规模化量产优势，#已服务国内多家头部PCB企业。 #业绩：戴尔蒙德5月31日并表，6月实现收入2791万元，#净利润686万元（净利率25%），并承诺： 2026-2028 年净利润分别不低于 3500、5000、6500万元，#三年合计净利润目标为1.5亿元。公司股权激励目标：戴尔蒙德2026-2028年净利润分别不低于4850万元、6800万元、8450万元，#三年合计净利润目标为2亿元。#戴尔蒙德后续自建白针产能，涂层针业绩有望释放。 1）CVD金刚石涂层钻针：目前月产能约100万支，27年底有望达300-500万支/月。 2）PVD镀膜钻针：目前月产能约1000万支，27年底有望达7000万-1亿支/月。 风险提示：高端钻针需求不及预期风险；技术迭代；市场竞争加剧；戴尔蒙德扩产及产能利用率提升不及预期；并购整合不及预期 ☎【浙商机械 王华君18610723118/周向昉/蒋逸18158576706/秦乐恒15221680140】#文字观点", "publish_time": "2026-10-28 21:15", "tags": ["同比、环比扭亏", "三年合计净利润目标为1", "5亿元", "三年合计净利润目标为2亿元", "文字观点"]}, "post:2026-10-28T13-32:7a002b402f73": {"id": "post:2026-10-28T13-32:7a002b402f73", "kind": "post", "title": "2026-10-28 13:32", "source_label": "帖子正文", "excerpt": "长鑫科技将开始生产HBM3E内存，尽管良率只有20%-30%--消息人士#文字观点", "content": "长鑫科技将开始生产HBM3E内存，尽管良率只有20%-30%--消息人士#文字观点", "publish_time": "2026-10-28 13:32", "tags": ["文字观点"]}, "post:2026-10-28T13-13:09ef44a85962": {"id": "post:2026-10-28T13-13:09ef44a85962", "kind": "post", "title": "2026-10-28 13:13", "source_label": "帖子正文", "excerpt": "逸飞激光（688646）点评：收购头部光模块耦合设备公司，重点推荐！", "content": "逸飞激光（688646）点评：收购头部光模块耦合设备公司，重点推荐！20261028事件：根据公司10.27公告，公司拟以现金方式收购深圳市兴启航自动化有限公司100%股权，交易作价4E。按照最低标准业绩承诺静态PE约为12.9倍，按照截止当前在手订单6E+26年全年展望8E+30%净利率仅2倍PE。#光模块耦合产品矩阵全面兴启航是光模块耦合设备头部企业（对标拟上市公司#猎奇智能等），深耕光模块封装与自动化耦合设备领域十余载，产品覆盖TO-CAN、COB、BOX（Lens）、FA光纤阵列等全品类耦合设备，覆盖激光焊接、UV紫外胶固化、热固化等全工艺路径，并向CPO共封装设备、1.6T以上高速耦合设备等前沿领域延伸。#客户覆盖全球核心光模块龙头目前兴启航客户覆盖东山精密、新易盛 、纳真科技、新菲光、迅特、昂纳集团、剑桥科技。根据披露，24年、25年、26年1-5月分别实现收入5900、5400、3700万元，归母净利润1200、1100、1000万元，对应毛利率44%、43%、42%，归母净利率21%、21%、28%。我们预计26年订单达8E以上，按照30%净利率，利润增厚2.4E以上，伴随国内外客户合作持续深入，27年新签订单有望爆发增长。#宝马引领大圆柱趋势加速;圆柱设备龙头再起航 根据头部圆柱电池公司反馈，宝马为代表的海外车企下一代车型大圆柱份额占比有望大幅度提升，国内外电池企业和整车企业有望共振，公司系圆柱设备龙头，我们预计公司大圆柱设备（极耳成型、极耳柔平等）26年新签订单近30E，同比+50%，且订单结构中高毛利（国内10%净利率，海外30%）海外占比（25年5%，26年30%）持续提升，充分受益大圆柱渗透率提升。#深度合作全球BBU、超容龙头;订单迅速爆发 伴随IT单机柜功率提升，BBU和超级电容后续成为服务器电源重要趋势，渗透率快速提升。公司目前深度合作松下（全球BBU龙头）、江海（电容龙头）等全球头部企业，超级电容目前新签订单达4E以上。展望27年，锂电设备2E（30E订单*70%交付比例*10%净利率）+超容设备1E利润+光模块设备2-3E利润=合计5-6E，当前10倍左右估值，其中主业大圆柱和超容、BBU都是渗透率刚起量低渗透率阶段，外延并购标的光模块客户持续突破爆发力极强，当前市值显著低估，重点推荐！#文字观点", "publish_time": "2026-10-28 13:13", "tags": ["光模块耦合产品矩阵全面", "客户覆盖全球核心光模块龙头", "文字观点"]}, "post:2026-10-28T17-36:6a8ff3471ef3": {"id": "post:2026-10-28T17-36:6a8ff3471ef3", "kind": "post", "title": "2026-10-28 17:36", "source_label": "帖子正文", "excerpt": "【国泰海通通信】天孚通信:有源持续改善，NPO/CPO趋势明确事件点评: 公司发布三季度业绩，q3实现营收19.23亿元，同比增长31.50%", "content": "【国泰海通通信】天孚通信:有源持续改善，NPO/CPO趋势明确事件点评: 公司发布三季度业绩，q3实现营收19.23亿元，同比增长31.50%；实现归母净利润8.79亿元，同比增长55.78%。我们点评如下:业绩略低预期，有源持续改善。市场普遍预期q3利润在9以上，最终实现为8.79亿元，略低市场预期。我们认为公司从第二季度末开始有源光器件关键瓶颈物料供给情况较上半年有所改善，但从物料到货到成品出货交付需要一定周期，预计相关供应改善对公司经营业绩的积极影响将在第四季度更加明显释放。公司整体盈利能力较为稳定，毛利率净利率整体环比持续稳定在65%/45%附近。NPO/CPO趋势明确，公司布局领先。OCP2026英伟达首先展示CPO scale up的rubin ultra nvl576方案，体现出对CPO需求的认可。从CPO供应链物料及近期GTC柏林对CPO产能提升幅度看，2027-2028年CPO增长幅度较好，公司作为较为核心的无源和elsfp合作厂商，有望充分受益。NPO层面，公司在多通道fau的技术能力和耦合技术平台，也有望充分发挥优势。 欢迎交流 余伟民/王彦龙/黎明聪 18819251936#文字观点", "publish_time": "2026-10-28 17:36", "tags": ["文字观点"]}, "post:2026-10-28T21-12:b57b01385e00": {"id": "post:2026-10-28T21-12:b57b01385e00", "kind": "post", "title": "2026-10-28 21:12", "source_label": "帖子正文", "excerpt": "【西部通信】天孚通信2026Q3业绩点评：物料端大幅缓解，需求持续增长 #26Q3单季度营收/归母净利润19.23/8.79亿元，利润同比增速环比显著上行。", "content": "【西部通信】天孚通信2026Q3业绩点评：物料端大幅缓解，需求持续增长 #26Q3单季度营收/归母净利润19.23/8.79亿元，利润同比增速环比显著上行。公司单Q3营收19.23亿元，同比+31.50%，环比+28.41%；归母净利润8.79亿元，同比+55.30%，环比+23.47%。单Q3收入同比增速较前三季度整体明显抬升。公司业绩加速增长受益于物料端的缓解和下游需求的持续高景气。 #毛利率环比微增，费用率环比改善，归母净利率环比微降。2026Q3公司毛利率约65.05%，同比+11.37pp，环比+0.39pp，主要受益于高速光器件产品结构升级及规模效应。费用端，Q3四项费用率合计约8.58%，同比+1.4pp，环比-1.73pp。Q3归母净利率约45.72%，同比+7.01pp，环比-1.8pp。其他项目中，主要是资产减值损失和信用减值损失环比多计提了2750万元（来自应收账款和存货规模的提升）、所得税费用环比增加5629万元。 #战略性备货加大，体现于存货大幅增长，合同负债高增预示需求景气高。存货、合同负债分别环比增长37.1%、226.8%。“购买商品、接受劳务支付的现金”环比增长132.8%。 #产品研发和交付、产能扩产、股权激励稳步推进。公司已成功完成1.6T光引擎规模量产和CPO配套光器件的研发，面向CPO领域配套的FAU、ELS外置光源等相关产品已实现稳定交付；产能端，公司泰国生产基地持续扩产，产能布局与下游需求相匹配。激励层面，公司2026年通过限制性股票激励计划以及中期分红方案，彰显发展信心。 #展望：AI算力高景气延续，CPO卡位打开中长期成长空间。公司深度布局光引擎、FAU、ELS等CPO核心部件，随着1.6T光模块上量叠加CPO渗透率提升，收入端有望延续快速增长态势。 【西部通信】陈彤/程莹/邱海涛#文字观点", "publish_time": "2026-10-28 21:12", "tags": ["文字观点"]}, "post:2026-10-28T10-48:fdbc1547afd1": {"id": "post:2026-10-28T10-48:fdbc1547afd1", "kind": "post", "title": "2026-10-28 10:48", "source_label": "帖子正文", "excerpt": "铜冠铜箔2026年三季报点评：涨价与结构升级共振，技改打开产能弹性 1、铜冠铜箔发布 2026 年三季报，实现营收 65.33 亿元（同比 +37.99%）、归母净利润 3.39 ", "content": "铜冠铜箔2026年三季报点评：涨价与结构升级共振，技改打开产能弹性 1、铜冠铜箔发布 2026 年三季报，实现营收 65.33 亿元（同比 +37.99%）、归母净利润 3.39 亿元（同比 +439.75%）、扣非净利润 3.28 亿元（同比 +582.38%）。单看 2026Q3，营业收入 25.12 亿元（同比 +44.58%、环比 +25.0%）、归母净利润 1.24 亿元（同比 +345.34%、环比 +13.95%）、扣非净利润 1.20 亿元（同比 +406.69%、环比 +14.25%）。 2、经营端来看，公司出货接近1.8万吨，其中电子箔占比逐步提升（超过50%），或接近1w左右，其中高端铜箔（RTF+HVLP）占比突破50%，其中HVLP-4铜箔环比进一步提升（Q1单月个位数吨，Q2单月提升至两位数吨）。盈利端来看，锂电铜箔半年度调价，26H1上涨1-2k，HTE/RTF铜箔价格Q3出现积极变动，盈利增厚明确。估算公司表观单吨盈利接近7k（综合口径），考虑到Q3铜价波动导致有铜损影响，预计经营性单吨盈利实现7-8k，环比改善明确。 3、此外，公司公告拟实施两项技术改造项目，总投资15,416.07万元，提升高附加值HVLP电子电路铜箔产能。项目一：池州厂区（新增1条表处机）生箔机系统改造，总投资6,600.12万元；项目二：铜陵厂区（新增表处机）锂电铜箔转产，总投资8,815.95万元，两个项目建设周期12月，已备案，尚待环评。 4、展望来看，公司作为HVLP铜箔的核心放量主力，RTF/HVLP铜箔出货有望延续攀升态势，且短期以良率改善额产线技改驱动高质量起量，高端铜箔的出货弹性显著。盈利端，结构升级、加工费回升与账期缩短三重因素共振，共同支撑中期盈利空间。继续推荐。#文字观点", "publish_time": "2026-10-28 10:48", "tags": ["文字观点"]}, "post:2026-10-28T11-05:ca2ac0dfbe3c "report_text": "# 小牛研报纪要 · 文字观点日报\n\n## 一、今日核心结论\n- **AI硬件“缺货—涨价—兑现”继续强化。** TPCA展后反馈确认，高端覆铜板供需缺口至少延续至2029年；HVLP4及以上等级铜箔全球仅四家供应商，三家来自日本、一家来自中国台湾，扩产进度跟不上需求增长。存储端长协锁量+浮动定价，把AI服务器乃至后续机器人的内存需求从“预期”映射为可兑现的量价与现金流。\n- **机器人主线向物理AI/数据采集迁移。** Optimus产能节点逐渐落地后，真机数据成为下一个瓶颈；截至10月27日前后一个月，特斯拉在美国多地集中释放Optimus数据采集、标注、审核、硬件配套及项目管理岗位，主要集中Palo Alto、Fremont、Austin。弗里蒙特工厂已进入初期爬坡，早期下线机器人优先投入“Optimus Academy”做训练数据采集，对外交付预计在2027年底前后。\n- **光通信/CPO与PCB升级出现密集催化。** 800G、1.6T光模块产能在2026-2027年已经全部售罄，康鹏400G、800G、1.6T产品均已量产；逸飞激光拟以现金4亿元收购兴启航100%股权，切入CPO耦合设备；ASMPT Q3收入6.69亿美元、同比+48.7%，订单创历史新高；天孚通信Q3营收19.23亿元、同比+31.50%。\n- **液冷/电源需求从订单与盈利端兑现。** Rubin量产爬坡、100%液冷方案释放产业链需求；台系散热龙头7月营收奇鋐186亿新台币、同比+57%，双鸿38亿新台币、同比+117%；Vertiv Q3整体内生订单同比增速超100%；沪电26Q3归母净利率28.3%，较26Q2的22.5%提升5.8个百分点，归母净利润26.99亿元，环比大增60.5%。\n- **AI大模型ROI出现积极信号。** Anthropic S-1显示，26Q2经调整经营净利率19%；每1美元算力及基础设施费用对应的收入从2025Q1的0.40美元升至2026Q2的2.08美元，达到原来的5.2倍；净收入留存率约900%，同一批老客户季度收入达到一年前约9倍，增长从头部客户向外扩散。\n\n## 二、今日最强主线\n- **主线一：AI算力硬件“缺货—涨价—兑现”**\n  - 今天强化的逻辑：高端覆铜板供需缺口至少延续至2029年，材料、覆铜板、PCB全产业链涨价；HVLP4及以上等级铜箔供给高度集中，扩产进度跟不上需求增长，材料与设备交期构成刚性瓶颈；存储长协锁量+浮动定价强化量价与现金流可见度。\n  - 今天出现的催化/验证：TPCA展后反馈确认缺口延续；SK海力士利润飙升七倍；长鑫科技将开始生产HBM3E，良率只有20%-30%；拉姆研究将2026年全球晶圆制造设备市场规模预测从1500亿至1540亿美元上调至约1550亿美元；长电科技Q3单季营收114.3亿元、同比+13.5%、环比+10.3%。\n\n- **主线二：机器人/物理AI数据采集**\n  - 今天强化的逻辑：产能节点落地后，真机数据成为下一个瓶颈；数据采集被定位为模型放量期斜率最陡峭的环节，数据环节可能是十倍、百倍增速；触觉与灵巧手是数采链条中具备设备、耗材、本体标配三重属性的不可压缩项。\n  - 今天出现的催化/验证：特斯拉集中释放Optimus数据采集、标注、审核等岗位；弗里蒙特工厂进入初期爬坡，早期机器人优先投入训练数据采集；机器人批量涨停与大盘两次翻转共振，被描述为逆势主线特征，叙事从人形机器人升级到物理AI；华中数控、均普智能、弘景光电等帖子围绕本体、数采、相机展开。上半年全球人形机器人出货量同比增长三倍达2.2万台，但科教素材与C端文娱商业合计占比仍达60%，制造加仓储仅占18%。\n\n- **主线三：光通信/CPO与PCB升级**\n  - 今天强化的逻辑：800G、1.6T光模块产能售罄，CPO设备卡位价值提升；光互联替代铜缆拉动保偏光纤需求高增，从价格战打到涨价650%；PCB下一个升级方向是“无布”，28年起高速放量，市场空间3年从105亿干到1600亿。\n  - 今天出现的催化/验证：志超科技800G、1.6T产能在2026-2027年全部售罄并持续扩产；逸飞激光拟4亿元收购兴启航100%股权，标的评估值4.03亿元、增值率532.56%，业绩承诺2026-2028累计扣非净利≥9300万元；ASMPT Q3收入6.69亿美元、同比+48.7%、环比+6.3%，订单创历史新高；天孚通信Q3营收19.23亿元、同比+31.50%，归母净利润8.79亿元。\n\n- **主线四：液冷/电源**\n  - 今天强化的逻辑：Rubin量产爬坡、100%液冷方案释放产业链需求，抬升赛道确定性；上游订单率先验证，液冷渗透率预计由25年的33%提升至27年60%。\n  - 今天出现的催化/验证：台系散热龙头7月营收奇鋐186亿新台币、同比+57%，双鸿38亿新台币、同比+117%；Vertiv Q3整体内生订单同比增速超100%，分区域美洲内生增速66.2%、亚太48.3%、欧非中东19.3%；沪电26Q3归母净利率28.3%，较26Q2提升5.8个百分点，归母净利润26.99亿元、环比大增60.5%。\n\n- **主线五：三季报分化与评级调整**\n  - 今天强化的逻辑：业绩期最后几天，三季报对个股仍有直接影响，即使此前市场对业绩已有预期；数据不佳的公司股价反应剧烈。\n  - 今天出现的催化/验证：跌幅前四家公司万泽股份、理工导航、紫光国微、光威复材均因三季报数据不佳；九号公司26Q3归母利润3.43亿元、同比-37.18%，但回购规模由1.5-3亿上调至3.5-7亿且全部用于注销；泡泡玛特Q3集团收入同比下降45%-50%；宁德时代港股评级由增持下调至中性；东山精密港股首日破发，公开发售仅获0.52倍认购、孖展0.39倍，为自去年2月以来港股公开认购倍数最低的新股。\n\n## 三、今日重点关注\n### 3.1 今天已经发生的重点变化\n- **存储与指数**：长鑫科技已被纳入上证综指，权重4.67%，居第一大权重股；当日涨3.2%，成交161.9亿元居全市场第二；长鑫科技将开始生产HBM3E，良率只有20%-30%。\n- **半导体设备/封装**：拉姆研究将2026年全球晶圆制造设备市场规模预测从1500亿至1540亿美元上调至约1550亿美元；长电科技前三季度营收309.5亿元、同比+8%，Q3单季营收114.3亿元、同比+13.5%、环比+10.3%。\n- **光通信/PCB**：逸飞激光拟4亿元收购兴启航100%股权；ASMPT Q3收入6.69亿美元、同比+48.7%，订单创历史新高；天孚通信Q3营收19.23亿元、同比+31.50%，归母净利润8.79亿元；保偏光纤从价格战打到涨价650%；PCB“无布”方向28年起高速放量，市场空间3年从105亿到1600亿。\n- **机器人/物理AI**：特斯拉在美国多地集中释放Optimus数据采集、标注、审核、硬件配套及项目管理岗位；机器人批量涨停与大盘两次翻转共振；数采专家提到国内有给Oai供数据的数采企业（间接），Oai主要数采供应商为maxinsights和mecka，后续国内raw data提供方可能是下一波数采行情重点。\n- **液冷/电源**：Rubin量产爬坡、100%液冷方案释放需求；台系散热龙头7月营收奇鋐186亿新台币、同比+57%，双鸿38亿新台币、同比+117%；Vertiv Q3内生订单同比增速超100%；沪电Q3归母净利率28.3%、归母净利润26.99亿元、环比+60.5%。\n- **三季报/评级/新股**：中国平安三季报发布会称对CSM持续好转有信心，投资策略不会因市场波动而波动，坚持六个匹配原则、加大另类资产配置；九号公司Q3归母3.43亿元、同比-37.18%，回购加码至3.5-7亿元且全额注销；泡泡玛特Q3收入同比-45%到-50%；宁德时代港股评级由增持下调至中性；东山精密港股首日破发、公开发售0.52倍认购。\n- **个股业绩**：铜冠铜箔Q3营收25.12亿元、同比+45%、环比+15%，归母净利润1.24亿元、同比+345%；石英股份1-3Q26归母净利1.33亿元、同比-1.77%，扣非归母0.89亿元；鼎通科技Q3营收5.09亿元、同比+36.89%，当日跌11.4%。\n\n### 3.2 接下来要继续跟踪的验证点/催化点\n- **CCL/铜箔**：高端覆铜板供需缺口延续至2029年的持续性，配额保供与涨价是否延续；HVLP4及以上等级铜箔扩产进度与供给格局。\n- **存储**：长协锁量+浮动定价的落地节奏；长鑫科技HBM3E良率（20%-30%）与量产进展。\n- **机器人/物理AI**：Optimus对外交付预计2027年底前后，跟踪弗里蒙特初期爬坡、数据采集岗位释放及Optimus Academy训练数据采集进展；数采是否成为下一风口，视觉/触觉数据采集核心入口及国内raw data提供方进展。\n- **光通信/CPO**：800G、1.6T产能售罄与扩产节奏；逸飞收购兴启航后2026-2028累计扣非净利≥9300万元业绩承诺兑现；ASMPT订单向收入转化；天孚通信物料缓解与NPO/CPO趋势。\n- **液冷/电源**：Rubin量产爬坡与100%液冷方案释放节奏；Vertiv订单增速向收入转化；液冷渗透率由25年33%提升至27年60%的验证。\n- **三季报 个百分点，归母净利润26.99亿元，环比大增60.5%。\u003c/li>\n\u003cli>\u003cstrong>AI大模型ROI出现积极信号。\u003c/strong> Anthropic S-1显示，26Q2经调整经营净利率19%；每1美元算力及基础设施费用对应的收入从2025Q1的0.40美元升至2026Q2的2.08美元，达到原来的5.2倍；净收入留存率约900%，同一批老客户季度收入达到一年前约9倍，增长从头部客户向外扩散。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线一：AI算力硬件“缺货—涨价—兑现”\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：高端覆铜板供需缺口至少延续至2029年，材料、覆铜板、PCB全产业链涨价；HVLP4及以上等级铜箔供给高度集中，扩产进度跟不上需求增长，材料与设备交期构成刚性瓶颈；存储长协锁量+浮动定价强化量价与现金流可见度。\u003c/li>\n\u003cli>今天出现的催化/验证：TPCA展后反馈确认缺口延续；SK海力士利润飙升七倍；长鑫科技将开始生产HBM3E，良率只有20%-30%；拉姆研究将2026年全球晶圆制造设备市场规模预测从1500亿至1540亿美元上调至约1550亿美元；长电科技Q3单季营收114.3亿元、同比+13.5%、环比+10.3%。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线二：机器人/物理AI数据采集\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：产能节点落地后，真机数据成为下一个瓶颈；数据采集被定位为模型放量期斜率最陡峭的环节，数据环节可能是十倍、百倍增速；触觉与灵巧手是数采链条中具备设备、耗材、本体标配三重属性的不可压缩项。\u003c/li>\n\u003cli>今天出现的催化/验证：特斯拉集中释放Optimus数据采集、标注、审核等岗位；弗里蒙特工厂进入初期爬坡，早期机器人优先投入训练数据采集；机器人批量涨停与大盘两次翻转共振，被描述为逆势主线特征，叙事从人形机器人升级到物理AI；华中数控、均普智能、弘景光电等帖子围绕本体、数采、相机展开。上半年全球人形机器人出货量同比增长三倍达2.2万台，但科教素材与C端文娱商业合计占比仍达60%，制造加仓储仅占18%。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线三：光通信/CPO与PCB升级\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：800G、1.6T光模块产能售罄，CPO设备卡位价值提升；光互联替代铜缆拉动保偏光纤需求高增，从价格战打到涨价650%；PCB下一个升级方向是“无布”，28年起高速放量，市场空间3年从105亿干到1600亿。\u003c/li>\n\u003cli>今天出现的催化/验证：志超科技800G、1.6T产能在2026-2027年全部售罄并持续扩产；逸飞激光拟4亿元收购兴启航100%股权，标的评估值4.03亿元、增值率532.56%，业绩承诺2026-2028累计扣非净利≥9300万元；ASMPT Q3收入6.69亿美元、同比+48.7%、环比+6.3%，订单创历史新高；天孚通信Q3营收19.23亿元、同比+31.50%，归母净利润8.79亿元。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线四：液冷/电源\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：Rubin量产爬坡、100%液冷方案释放产业链需求，抬升赛道确定性；上游订单率先验证，液冷渗透率预计由25年的33%提升至27年60%。\u003c/li>\n\u003cli>今天出现的催化/验证：台系散热龙头7月营收奇鋐186亿新台币、同比+57%，双鸿38亿新台币、同比+117%；Vertiv Q3整体内生订单同比增速超100%，分区域美洲内生增速66.2%、亚太48.3%、欧非中东19.3%；沪电26Q3归母净利率28.3%，较26Q2提升5.8个百分点，归母净利润26.99亿元、环比大增60.5%。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线五：三季报分化与评级调整\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：业绩期最后几天，三季报对个股仍有直接影响，即使此前市场对业绩已有预期；数据不佳的公司股价反应剧烈。\u003c/li>\n\u003cli>今天出现的催化/验证：跌幅前四家公司万泽股份、理工导航、紫光国微、光威复材均因三季报数据不佳；九号公司26Q3归母利润3.43亿元、同比-37.18%，但回购规模由1.5-3亿上调至3.5-7亿且全部用于注销；泡泡玛特Q3集团收入同比下降45%-50%；宁德时代港股评级由增持下调至中性；东山精密港股首日破发，公开发售仅获0.52倍认购、孖展0.39倍，为自去年2月以来港股公开认购倍数最低的新股。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>存储与指数\u003c/strong>：长鑫科技已被纳入上证综指，权重4.67%，居第一大权重股；当日涨3.2%，成交161.9亿元居全市场第二；长鑫科技将开始生产HBM3E，良率只有20%-30%。\u003c/li>\n\u003cli>\u003cstrong>半导体设备/封装\u003c/strong>：拉姆研究将2026年全球晶圆制造设备市场规模预测从1500亿至1540亿美元上调至约1550亿美元；长电科技前三季度营收309.5亿元、同比+8%，Q3单季营收114.3亿元、同比+13.5%、环比+10.3%。\u003c/li>\n\u003cli>\u003cstrong>光通信/PCB\u003c/strong>：逸飞激光拟4亿元收购兴启航100%股权；ASMPT Q3收入6.69亿美元、同比+48.7%，订单创历史新高；天孚通信Q3营收19.23亿元、同比+31.50%，归母净利润8.79亿元；保偏光纤从价格战打到涨价650%；PCB“无布”方向28年起高速放量，市场空间3年从105亿到1600亿。\u003c/li>\n\u003cli>\u003cstrong>机器人/物理AI\u003c/strong>：特斯拉在美国多地集中释放Optimus数据采集、标注、审核、硬件配套及项目管理岗位；机器人批量涨停与大盘两次翻转共振；数采专家提到国内有给Oai供数据的数采企业（间接），Oai主要数采供应商为maxinsights和mecka，后续国内raw data提供方可能是下一波数采行情重点。\u003c/li>\n\u003cli>\u003cstrong>液冷/电源\u003c/strong>：Rubin量产爬坡、100%液冷方案释放需求；台系散热龙头7月营收奇鋐186亿新台币、同比+57%，双鸿38亿新台币、同比+117%；Vertiv Q3内生订单同比增速超100%；沪电Q3归母净利率28.3%、归母净利润26.99亿元、环比+60.5%。\u003c/li>\n\u003cli>\u003cstrong>三季报/评级/新股\u003c/strong>：中国平安三季报发布会称对CSM持续好转有信心，投资策略不会因市场波动而波动，坚持六个匹配原则、加大另类资产配置；九号公司Q3归母3.43亿元、同比-37.18%，回购加码至3.5-7亿元且全额注销；泡泡玛特Q3收入同比-45%到-50%；宁德时代港股评级由增持下调至中性；东山精密港股首日破发、公开发售0.52倍认购。\u003c/li>\n\u003cli>\u003cstrong>个股业绩\u003c/strong>：铜冠铜箔Q3营收25.12亿元、同比+45%、环比+15%，归母净利润1.24亿元、同比+345%；石英股份1-3Q26归母净利1.33亿元、同比-1.77%，扣非归母0.89亿元；鼎通科技Q3营收5.09亿元、同比+36.89%，当日跌11.4%。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>CCL/铜箔\u003c/strong>：高端覆铜板供需缺口延续至2029年的持续性，配额保供与涨价是否延续；HVLP4及以上等级铜箔扩产进度与供给格局。\u003c/li>\n\u003cli>\u003cstrong>存储\u003c/strong>：长协锁量+浮动定价的落地节奏；长鑫科技HBM3E良率（20%-30%）与量产进展。\u003c/li>\n\u003cli>\u003cstrong>机器人/物理AI\u003c/strong>：Optimus对外交付预计2027年底前后，跟踪弗里蒙特初期爬坡、数据采集岗位释放及Op <script>

</script></body></html>
