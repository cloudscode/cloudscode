 "kind": "attachment", "title": "长江证券-计算机行业2026半年报业绩综述：温和修复趋势延续，把握AI变革下结构性需求增量-261022", "source_label": "长江证券", "excerpt": "表2：2026半年度及2026Q2 IT基础设备公司整体营收、归母净利润及其增速 股票代码 上市公司 细分行业分类 营收（亿元） 归母净利润（亿元） 26H1 26Q2 26H1同比 增速 26Q2同比 增速 26H1 26Q2 26H1同比 增速 26Q2同比 增速 000158.SZ 常山北明", "content": "", "status": "extracted"}}, "source_details": {"post:2026-10-23T13-56:86c2b8b45cb7": {"id": "post:2026-10-23T13-56:86c2b8b45cb7", "kind": "post", "title": "2026-10-23 13:56", "source_label": "帖子正文", "excerpt": "中美大模型26Q4展望：最悲观阶段已过，把握长线机遇 合计ARR未见放缓，最悲观阶段已过。7月以来，市场担忧AnthropicARR增速放缓，全球科技股随之回调。", "content": "中美大模型26Q4展望：最悲观阶段已过，把握长线机遇 合计ARR未见放缓，最悲观阶段已过。7月以来，市场担忧AnthropicARR增速放缓，全球科技股随之回调。但从两家合计口径看，OpenAI与Anthropic在8-9月月均新增ARR159亿美元，接近4月约170亿美元的合计增量；若按月度增量150亿美元外推，年底两家合计ARR有望达到1800亿美元，为2025年末的5.9倍，增速仍快于此前两年的4.7倍和3.8倍。Anthropic11月IPO或披露更多基本面信息，给予更明确指引，届时模型或迎来新一轮资金配置和再平衡。 长期看AI仍处于商业化早期，短期看企业级落地迎来验收，Q4ARR或将重拾升势。目前，模型付费与用量高度不均衡，前1%企业员工的AI支出为前10%的10倍、前50%的576倍；加州人均模型使用量是西弗吉尼亚州的6.5倍、美国是印度的21倍，均呈现出和移动互联网时代相似的早期商业化特征。而移动互联网的经验表明，技术的普及需要经历从集中到平权的过程，即便仅考虑需求向更多企业、场景与地区扩散，商业化空间仍然广阔。OpenAI、Anthropic分别在年中成立FDE公司，大型企业完整FDE部署需6-12个月，首批项目或26Q4验收、交付和续约。叠加AnthropicIPO窗口临近，ARR有望重拾升势，市场情绪有望反转。 RSI闭环加速，Cowork、AI4S、AIDD、AIforChipDesign等新场景率先落地。Claude主导的研发工作占比从3月的1%提升至8月的26%，AI深度协作及以上的工作占比超过90%；OpenAI每1个人类工作日对应3.1个Agent工作日。但RSI完全闭环仍需时间，Cowork、AI4S、AIDD、AIforChipDesign等场景将率先贡献增量；C端Muse上线17天下载超340万，个人智能Agent临界点也在临近。 关注标的：智谱、MiniMax。最悲观阶段已过，国产模型后训练终将在夹缝中突围。国产模型8月ARR合计约83亿美元，相当于海外18个月前的水平，合计估值仅为海外十分之一，但模型能力仅落后约3～6个月。国产模型的更低基数、更快增速、更具吸引力的估值，叠加Anthropic上市带来升势，有望推动国产模型系统性重估。同时关注腾讯、阿里巴巴、小米等具备模型业务的互联网公司。 欢迎联系科技与新兴产业组！#文字观点", "publish_time": "2026-10-23 13:56", "tags": ["文字观点"]}, "post:2026-10-23T14-01:f0b719ae5ff4": {"id": "post:2026-10-23T14-01:f0b719ae5ff4", "kind": "post", "title": "2026-10-23 14:01", "source_label": "帖子正文", "excerpt": "【科技】中美大模型26Q4展望：最悲观阶段已过，把握长线机遇 合计ARR未见放缓，最悲观阶段已过。7月以来，市场担忧AnthropicARR增速放缓，全球科技股随之回调。", "content": "【科技】中美大模型26Q4展望：最悲观阶段已过，把握长线机遇 合计ARR未见放缓，最悲观阶段已过。7月以来，市场担忧AnthropicARR增速放缓，全球科技股随之回 有大量住房的大型机构投资者继续购买独栋住宅。 12、印度将100万吨进口糖免税政策延长至12月31日。 13、巴拿马运河管理局发布2026财年报告，2026财年运河总收入达到66亿美元，较上一财年增长16.6%。 14、惠誉将2027年飞机租赁行业展望下调至恶化。惠誉称，持续高企的燃油价格、空域中断以及借贷成本上升可能削弱航空公司的信用状况。 15、美股走势分化，道指涨0.02%，纳指跌2.6%，标普500指数跌1.21%，热门科技股纷纷下挫，半导体、存储、芯片跌幅居前，费城半导体指数收跌6.72%，泛林集团跌超11%，SpaceX、科磊跌超9%，闪迪、SK海力士、英特尔、AMD跌超8%。 16、WTI原油期货结算价为99.47美元/桶，上涨2.32美元，涨幅2.39%。布伦特原油期货结算价为113.17美元/桶，上涨4.35美元，涨幅4%。 17、COMEX黄金期货收跌2.66%，报4039.8美元/盎司；COMEX白银期货跌5.34%，报54.63美元/盎司。(来自财联社APP)#文字观点", "publish_time": "2026-10-23 07:30", "tags": ["文字观点"]}, "attachment:files/A股与港股复盘 20261023.pdf": {"id": "attachment:files/A股与港股复盘 20261023.pdf", "kind": "attachment", "title": "A股与港股复盘 20261023", "source_label": "其他", "excerpt": "A股与港股复盘 2026年10月23日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 黑云压城城欲摧，甲光向日金鳞开 2026年10月23日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 A股没有跟着隔夜美股半导体暴跌走下去：午间光模块龙头集体发布经营公告并回购，午后创业板指", "content": "A股与港股复盘 2026年10月23日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 黑云压城城欲摧，甲光向日金鳞开 2026年10月23日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 A股没有跟着隔夜美股半导体暴跌走下去：午间光模块龙头集体发布经营公告并回购，午后创业板指由跌2.1%后翻红，收涨4.2%，昨天的AI硬件抛售至少停止了一天。 周四美股纳指跌2.6%、费城半导体指数跌6.7%。周五A股先低开低走；午间五家光模块公司公告经营正常，新易盛宣布回购8亿至10亿元；13:00开盘后创业板指由跌2.1%翻红，收涨4.2%。沪深A股上涨4,196家、下跌887家。恒生科技涨2.0%，MINIMAX-W涨16.7%；南向仍净卖出，规模明显缩小。昨天稿设定的验证条件命中：创业板指收在2,577点之上，中际旭创、新易盛不再收跌。尽管外盘并未缓和。 我们在昨天10月22日上午观察盘面技术面，当时相对强弱指数已经下降到了20以下，甚至在日间达到了1字头。我们认为按照当时这样的拋售速度，拋售潮将在这两天内进入尾声。同时，在今天上午上证被恐慌盘砸到3,574点的时候判断今天将出现深V。果然，宽基ETF的大额认购显示国家队今天出手稳住市场，市场的稳定性和直接政策市将成为今年余下时间的主题。别人悲观，我们就反其道而行之。 本日报要 主线段： A股没有跟着隔夜美股半导体暴跌走下去：午间光模块龙头集体发布经营公告并回购，午后创业板指由跌2.1%翻红，收涨4.2%，昨天的AI硬件抛售至少停了一天。起点仍在美国：周四纳斯达克综合指数收跌2.6%，为6月23日以来最大单日跌幅；费城半导体指数收跌6.7%，比昨天稿记下的开盘后读数（跌4.3%）又多跌了2.4个百分点，说明抛售在美国盘中继续加深。 担忧的内容与昨天一样，是AI的资本开支与融资：Meta跌8%，CoreWeave跌超10%，美光跌6%，英伟达跌4%；黄仁勋说新型云厂商的需求“火爆到难以想象”，但资本供应不足正在限制扩张，富国银行交易员认为这句话再次引发了对信贷风险承受力的担忧。高盛大宗经纪业务称，三大主流股票策略周四是疫情以来第一次同一天跌幅都超过1%。亚洲时段先是韩国KOSPI早盘一度跌超4%，收盘反而涨0.3%，日经指数收跌0.3%。 A股走势相同：上证低开，10:20见到全天最低3,574点，创业板指同时见到2,495点（跌3.2%），上午收盘仍跌2.1%。转折在午间：中际旭创、新易盛、天孚通信、光迅科技、源杰科技五家光模块公司陆续发布公告，称经营秩序正常、订单充足，新易盛 paving the way to a strong 2027", "source_label": "MS", "excerpt": "M Idea NVIDIA Corp. | North America NVIDIA GTC Berlin: paving the way to a strong 2027 We attended Nvidia's GTC Berlin this week, and come away with ongoing conviction that the com", "content": "M Idea NVIDIA Corp. | North America NVIDIA GTC Berlin: paving the way to a strong 2027 We attended Nvidia's GTC Berlin this week, and come away with ongoing conviction that the company continues to effectively manage challenges in supply chain, land/power/shell, and funding - and even benefit from those challenges; reiterate OW/ Top Pick in semis. No big surprises, but NVIDIA continues to add to its considerable advantages heading into 2027. The Vera Rubin cycle is starting to pick up steam, though we didn't get some of the details we might have expected on next year's Rubin Ultra. But with demand remaining very strong, the focus is on closing the gap between CY27 revenue guidance of 70%, and demand growth which mgmt has characterized as 100%. To that end, the supply chain additions on substrate, packaging and test, are an important bit of blocking and tackling. We continue to see the biggest bottleneck as TSMC 3 nm wafers, which could free up over time. The DSX POD, detailed below, won't get the attention of more technology oriented announcements, but could be an important differentiator . We see NVIDIA's advantage coming from higher tokens per GW vs. competitors, but have also found the arguments that NVIDIA provides faster bring-up time, longer mean time between failure, and longer asset life than competing products as very compelling. DSX POD deals with the bring-up time, reducing months of wait time before assets can become productive by providing references for ODMs to build completely functional clusters than can be brought up very rapidly. This directly speaks to the cash flow issues of neoclouds, which will be able to reduce the time that assets are unproductive which could help bridge funding concerns. Details from Jensen's keynote presentation: Nvidia usually opts to discuss the most relevant product announcements at its flagship GTC in March, limiting the amount of new color on the roadmap around the event. However, we did hear key updates in terms of Nvidia's product momentum outside of the core business (software, PCs, physical AI), and Nvidia's role in alleviating LPS constraints with DSX, Morgan Stanley & Co. LLC Joseph Moore Equity Analyst Joseph.Moore@morganstanley.com +1 212 761-7516 Mason Wayne Research Associate Mason.Wayne@morganstanley.com +1 212 761-6012 Ella Tulchinsky Equity Analyst Ella.Tulchinsky@morganstanley.com +1 212 761-2222 Nicole Kozhukhov Research Associate Nicole.Kozhukhov@morganstanley.com +1 212 761-1636 Shane Brett Equity Analyst Shane.Brett@morganstanley.com +1 212 761-1022 Cate Folan Research Associate Cate.M.Folan@morganstanley.com +1 212 296-3520 NVIDIA Corp. (NVDA.O, NVDA US) Top Pick Semiconductors | United States of America Stock Rating Overweight Industry View Attractive Price target $300.00 Shr price, close (Oct 21, 2026) $221.97 Mkt cap, curr (mm) $5,411,711 52-Week Range $243.37-164.27 Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report.Key Takeaways Focus on supply chain, with substantial long term commitment on substrates (adding SEMCO), expansions in CoWoS, and commitment for test capacity \"DSX POD\" has an understated importance; could lead to dramatic improvement in bring-up times, which can significantly improve cash flows of a neocloud The market is reacting to concerns around supply chain, land power shell, and funding - we remain convinced that all 3 aspects are opportunities for NVDA Reiterate OW, $300 target, Top Pick in semis October 22, 2026 01:32 AM GMT Not for redistribution without written consent of Morgan Stanley M Idea 2DSX POD, and DSX MaxLPS, and continued Rubin leadership in terms of tokens per watt and tokens per dollar, both contributing to ongoing excitement about the company's strategic positioning. The Nvidia DSX POD is a new reference design for Vera Rubin systems built inside modular containers, with integration and validation occurring before delivery. That streamlines the deployment process, allowing the customer to take delivery and begin producing tokens in days vs several months. The new form factor can help improve working capital cycles for their customers, and extend Nvidia's platform advantage with a quicker time to first token. The DSX POD is part of the broader DSX AI factory reference architecture, where during the keynote we heard about MaxLPS allowing customers to use 30% less power with no change in token output. Nvidia will have 10+ customers in Europe adopting the DSX platform for Vera Rubin AI factories. Nvidia is also releasing new software for agentic AI safety, the OpenShell Reference Architecture. OpenShell is an open-source framework built on Linux that keeps each AI agent in its own sandbox and limits what it can access. Nvidia Sentry, which runs on BlueField-4, adds a second layer that monitors agents from outside the system. Management said most major frontier labs, OS vendors, and security companies have adopted it, and Nvidia is working with an AI lab on OpenShell agents. For Nvidia, it extends its content in agent deployments beyond Rubin GPUs to Vera CPUs and BlueField-4. Nvidia's AI RAN initiative continues to make progress, Nvidia made the first commercial phone call on T-Mobile’s network with Nokia on CUDA, after roughly eight years of work, with AI to be layered on top. Jensen talked to ~100,000 sites and ~100 GW of distributed telco base stations and data centers eventually becoming distributed AI infrastructure. As far as autonomous vehicles, four more brands will be Hyperion-compatible , which supports Nvidia’s push to make Hyperion the industry-standard autonomous vehicle architecture, which will eventually be connected to ride-hailing networks. In humanoids, Nvidia is launching Agile ONE SN , a reference humanoid built with Agile Robots, shipping preassembled with compute and software in 1Q next year. Separately from the keynote, Nvidia announced new plans for further capacity expansion in substrates, advanced packaging, testing and optical engines. In substrates the combination of IBIDEN, SEMCO, and Unimicron will 2.5x capacity over the next three years. Amkor plans to expand CoWoS-R wafer capacity by more than 300% by the end of 2028 to support growth across CPUs and LPUs. In the back-end Nvidia has committed a $1.1bn capacity reservation to support KYEC's new US facilities and equipment, with HVM expected in April 2027. Nvidia expects its total semi test capacity to 2x from 2026 to 2027. In CPO SPIL's expansion targets a 15x increase by mid-2027, with expectations for another 2x by the end of 2028. M Idea Morgan Stanley Research 3Risk Reward - NVIDIA Corp. (NVDA.O) $300.00 ~20 our MW CY27 EPS estimate of $15.01, in-line with the broader market and a discount to compute semis peers (AMD/AVGO/INTC) as high marketshare and gross margins leave limited levers for multiple expansion in the near term. Morgan Stanle y Estimates MeanConsensus Price Target Distribution $180.00 $515.00 Source: Reﬁnitiv, Morgan Stanley Research MS Rating▪Blackwell remains the premiere solution for gen-AI workloads, where compute demand continues to outstrip supply ▪We see continued upward pressure to estimates as demand strength continues, with Rubin expected to maintain Nvidia's performance leadership position Consensus Rating Distribution 97%Overweight 2%Equal-weight 2%Underw 开发高转矩密度磁路设计、高精度伺服控制算法及耐冲击轻量化结构，可配套服务机器人、协作机器人及高端医疗器械等领域 15、林州重机：公司与中科院自动化研究所签订共建“工业机器人技术工程中心协议书”，致力于工业用智能机器人和高新技术领域的核心技术研发 16、睿能科技：1、公司代理的功率器件、高速接口芯片及电源管理芯片适配人形机器人，已进入多家头部整机和关节模组厂商；2、公司是国内领先的 IC 产品授权分销商，分销多种集成电路芯片，且拥有 “芯天下” 系列存储芯片，还掌握 Chiplet 相关技术，其存储芯片封装已实现量产 17、兆威机电：1、公司产品应用于机器人领域，持续推动微型传动及驱动系统在灵巧手、机器人关节等场景应用，灵巧手产品商业化进程持续推进；2、公司的微型传动系统可以应用于AR/VR领域，如磁感应系统、瞳距调节驱动系统、头部自动松紧装置、智能眼镜隐藏式微型扬声器等 18、襄阳轴承：1、公司部分精密轴承产品可应用于谐波减速器等，目前已经完成产品试制并送样；2、公司是湖北省军民融合企业，根据2024年报东风公司的军车轴承一直指定公司独家供应 19、海辰药业：1、以心脑血管药为主的医药制造商，核心产品注射用盐酸兰地洛尔为国内独家首仿品种；第三季度净利润同比增长757.50%；2、公司硫化锂已完成中试线建设，正在试生产；固态电池粘合剂正在小试工艺开发 20、豪美新材：华南地区最具规模的汽车轻量化铝基新材料企业，前瞻布局人形机器人、低空飞行器、液冷散热器等新兴赛道 21、山东威达：国内重要的高端智能装备制造和智能制造解决方案服务企业；子公司苏州德迈科成功推出智能穿梭车、多层堆垛机、伺服电机、高速并联机器人、MES/WMS软件等智能产品以及机器人包装装备等智能装备，能够为制造业客户提供一站式的智能制造解决方案 22、海天瑞声：1、公司开展具身智能数据服务，具备机器人硬件适配、模型理解与数据工程化交付能力，依托100余台机器人实现数据产出；2、AI训练数据服务商，此前与华为联合发布“海天瑞声×昇腾DeepSeek数据飞轮智能体”，并深度参与华为昇腾一体机及陕西智慧文旅等项目，形成软硬件协同解决方案 23、密尔克卫：第三方化工供应链龙头；公司服务领域已拓宽至芯片半导体领域 24、启明星辰：公司一季度预计净利润同比增长2279.31%至3281.13%，前期布局的业务与前置投入，自一季度起逐步转化为实际收入；与中国移动协同效应持续增强，尤其在云安全方向的联合营销举措落地见效 25、风语筑：公司联手宇树科技共同打造杭州市具身智能展示与应用推广中心，深度参与国家级中试基地配套建设 26、晶丰明源：公司是国内 LED 照明驱动芯片龙头企业，推出新一代单级高PF恒压控制器BP83323，该产品以第三代碳化硅（SiC）器件集成为核心，采用单级APFC + 反激恒压输出的创新拓扑架构，支持全电压（90-264Vac）输入，可实现高达150W的输出功率，为高性能AC/DC电源设计提供了具备竞争力的解决方案 27、绿盟科技：1、公司积极拓展云安全市场，围绕运营商公有云的安全原子能力打磨云安全产品技术硬实力；2、公司迭代“风云卫”AI安全能力平台并推出AI安全一体机“清风卫”，构建“评估-防护-响应”全栈AI安全体系，清风卫产品获公安三所“大模型安全防护围栏”认证 28、天奇股份：公司与银河通用、优必选科技等提供包括轮式、双足等多品类机器人产品及差异化智能制造解决方案，银河通用成为2026春晚指定具身大模型机器人 29、恩捷股份：公司目前硫化锂的中试产线已经搭建完成，正在产能爬坡中，目前硫化锂以自供为主，同时也在送样下游客户，小批量出货，会密切关注行业技术发展和动态，稳步推进公司全固态电池材料的拓展 30、尚太科技：国内负极材料领域主要厂商；公司表示现阶段可验证的固态电池负极材料存在继续使用石墨类负极材料的可能性，公司对固态电池适配负极材料以及负极材料其他新技术的发展方向 31、能科科技：1、公司灵智具身智能AI训推平台面向工业场景，开发四足、轮式、人形、机械臂等七款具身形态场景应用；2、公司凭借工业领域经验基于开源和闭源大模型形成多行业AI Agent，与头部客户合作开展AI+智能制造 ；打造“乐系列”产品与AI融合 ，开展“灵系列”AI 新产品研究；3、商业航天是公司战略重点，已服务航天客户多年，并与卫星企业围绕算力及AI场景深度合作 32、洛轴股份：1、公司围绕国产机器人产业发展需求，开展相关产品研发，并参与起草国内工业机器人轴承国家标准，其中RV减速器轴承、机械臂轴承、滚珠丝杠等产品处于小批量供货阶段；2、公司可研制生产600千瓦至20兆瓦以上风电轴承，20兆瓦级海上风电主轴轴承获河南省首台套认定\" 33、新华百货：宁夏地区最大的商业零售企业，拟 同比增长7.96%；归母净利润16.17亿元，同比增长69.58%；扣非归母净利润15.61亿元，同比增长99.17%。单Q3实现营业收入114.25亿元，同比增长13.53%；归母净利润7.73亿元，同比增长59.99%；扣非归母净利润7.53亿元，同比增长117.43%。公司上海临港78亿元高端先进封测项目有序推进，拟定增募资不超过65亿元，重点投向高性能计算先进封装、晶圆级封装及高密度存储封测等领域。 📮业务：重点领域需求增长，先进封装产能布局加快 ➡️运算电子：2026年前三季度收入同比增长54%，营收占比30.9%，AI基础设施及端侧需求增长带动相关业务扩张。 ➡️汽车电子：前三季度收入同比增长30%，营收占比11.3%，成为公司重要增长方向。 ➡️盈利能力：高附加值产品增加，叠加智能制造及精益生产降本，前三季度毛利率同比提升2.3个百分点，扣非归母净利润同比增长99.17%。 ➡️扩产进展：上海临港78亿元高端先进封测项目已完成全资子公司设立及工商注册。65亿元定增方案已获有权国资审批单位批准，后续仍需履行相关审核程序，募投方向覆盖高性能计算、电源模组、晶圆级封装及高密度存储封测。 📮板块趋势：先进封装持续扩产落地，重视封测厂及设备增量机会 AI算力需求持续增长，带动高性能计算、先进存储等领域对高密度封装的需求提升，先进封装成为封测厂商重点扩产方向。长电科技持续加大高端封测资本开支，扩产项目稳步推进，同时订单增长、产能利用率维持高位，带动盈利能力明显改善，体现出先进封装扩产与业绩增长的双重驱动。 随着扩产项目逐步进入建设及设备导入阶段，RDL光刻、激光加工、刻蚀、电镀及清洗、PVD/CVD、晶圆减薄与CMP、临时键合及解键合、TCB及混合键合、检测等设备需求有望逐步释放。建议重点关注先进封装板块扩产景气度及国产设备增量机会。 ⚠️风险提示：下游需求不及预期；先进封装项目建设及产能爬坡不及预期；行业竞争加剧。 🎁东吴电子：陈海进/刘玥娇#文字观点", "publish_time": "2026-10-23 09:10", "tags": ["文字观点"]}, "attachment:files/存储龙头调研：2027年HBM4定价与份额展望.pdf": {"id": "attachment:files/存储龙头调研：2027年HBM4定价与份额展望.pdf", "kind": "attachment", "title": "存储龙头调研：2027年HBM4定价与份额展望", "source_label": "其他", "excerpt": "存储龙头调研：2027年HBM4定价与份额展望，中 国市场溢价显著 资深行业专家调研纪要｜2026年10月 核心要点 •2027年HBM4定价分化：海力士为抢占份额采取积极定价策略，低于美光报价。•产能结构调整：2027年HBM产能增速约70%，月产达20万片，占DRAM总产能30%", "content": "存储龙头调研：2027年HBM4定价与份额展望，中 国市场溢价显著 资深行业专家调研纪要｜2026年10月 核心要点 •2027年HBM4定价分化：海力士为抢占份额采取积极定价策略，低于美光报价。 •产能结构调整：2027年HBM产能增速约70%，月产达20万片，占DRAM总产能30%； 数据中心业务出货占比将升至60%。 •中国市场高溢价：受出口管制影响，HBM3及以上产品经东南亚转运进入中国，售价较出厂 价溢价数倍。 专家问答实录 第1问三星与英伟达最新签订的HBM4价格是多少？ 根据2026年10月初的信息，三星与英伟达已签订2027年的HBM4供货价格，定为每Gigabit 4.5美元。 第2问与此前市场预期的3.5美元相比，三星HBM4的定价高出许多，其原因 是什么？三星与海力士之间存在的价格差异是否主要源于技术规格（如Pin Speed），以及海力士在定价策略上有何考量？ 此前3.5美元左右的预期价格可能对应的是海力士的产品。三星HBM4的定价预期一直在4.0 至4.5美元的区间。两家公司的价格差异部分源于技术因素，但更关键的原因在于海力士的市 场策略。为了在2027年获得最大的市场份额并维持行业第一的地位，海力士愿意牺牲部分价 格，采取了非常积极的定价策略。 第3问三星在价格高出20-30%的情况下，为何英伟达仍会采购其产品，三星是 否有降价以争取40%市场份额的计划？ 三星与英伟达之间没有类似于海力士的特殊合作模式。海力士通过向英伟达提供价格优惠的 HBM，来换取GPU卡的优先供应，以支持其SK集团的数据中心业务发展，这种合作模式使 得双方可以接受更灵活的价格安排。 第4问除了英伟达之外，2027年HBM4对博通等其他大客户的销售价格是多 少？三星和海力士的定价策略是否存在差异？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 三星向博通提供的HBM4价格与英伟达的水平相当，因为博通明年的采购量也很大，与英伟达 相差不远。对于AMD等规模较小的客户，价格可能会更高。海力士向博通的报价也与三星基 本一致。 第5问HBM4E的定价情况如何？与服务器DRAM相比，其毛利率水平是否存 在差距？ 在HBM4E方面，三星进度最快，尽管定价较高，但HBM的毛利率仍不及服务器DRAM。经 过测算，若要使HBM4或HBM4E的毛利率达到与服务器DRAM相当的80%以上的水平， 其售价需要达到5.5美元以上。因此，无论是4.5美元还是5.0美元的售价，其盈利能力仍低 于顶级的服务器DRAM产品。 第6问当前的HBM定价水平是否会影响三星未来的扩产计划？ 会有一定影响，但影响不是特别大。三星对于生产HBM的意愿并非特别强烈，主要原因是其 毛利率最高的依然是服务器DRAM。如果市场允许，公司更倾向于最大化服务器DRAM的销 售。HBM的生产还需要在封装等环节进行额外投资，流程相对复杂。然而，鉴于当前AI需求 主要由HBM驱动，而其他产品需求相对疲软，公司不得不接受并适应这一市场现状。 第7问三星目前及未来的HBM市场份额目标是多少？ 当前三星的HBM市场份额在30%至33%之间，2027年的目标是提升至40%。 第8问2027年的HBM价格和市场份额是否已经确定？ 2027年的HBM价格已确定为4.5美元。市场份额方面，目前仅确定了英伟达的部分。根据测 算，三星在英伟达的份额预计为35%至40%，但由于博通及其他客户的份额尚未最终确定， 整体市场份额还未完全落定。 第9问尽管三星的HBM4报价较高，为何仍能在英伟达获得显著份额？ 三星之所以能在报价较高的情况下获得份额，主要得益于其供应能力。自2026年7月底，三 星是唯一能够大规模供货的公司，出货量超过海力士，因此英伟达在供应商选择上空间有限。 第10问HBM4E产品的出货时间表和预期价格是怎样的？ 三星已向客户送交HBM4E的测试样品，进度快于美光。预计在2026年底前完成验证样品交 付。HBM4E的预期价格约为每Gigabit5.0美元或更高。 第11问CommodityDRAM在2026年第三季度的价格表现如何，以及第四季 度的价格预期是怎样的？ 2026年第三季度，不同应用的CommodityDRAM价格存在差异。服务器DRAM价格约为2.7 美元，手机LPDRAM价格在1.5至1.6美元之间，而PCDRAM价格约为1.0美元。与第二 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 季度相比，服务器DRAM价格上涨了10%至15%。对于第四季度，目前预计价格涨幅在0%至 5%之间，但这一预期尚不确定。 第12问目前向中国市场销售HBM产品的政策限制是怎样的，实际销售是如何 进行的？ 根据美国规定，HBM3及以上版本的产品不能直接销售到中国。实际操作中，这些产品会先销 售至马来西亚、新加坡、印尼等国家，再间接进入中国市场。因此，无法直接追踪具体的中国 客户。通过这种方式，HBM产品在中国的售价远高于原始出货价。 第13问对于字节跳动这类在海外设有数据中心的公司，HBM的销售政策有何 不同？ 对于字节跳动在新加坡的数据中心，可以直接供货。但是，其位于中国国内的业务则无法直接 销售。 第14问对于向中国销售HBM产品的限制政策，未来是否可能发生变化？ 预计当HBM4E或HBM5成为市场主流时，针对HBM3或HBM3E的销售限制可能会放宽。 第15问HBM3及以上版本产品不能直接销售到中国的规定是从何时开始的， 这对中国客户的采购行为有何影响？ 该规定自2024年底开始实施。在2025年及2026年初，由于市场对未来价格走势判断不清， 且当时DRAM整体价格尚未上涨，中国客户并未大规模囤货。HBM价格通常一年商定一次并 全年固定，在2025年第三季度商议2026年价格时，市场并未预见到今年的大幅涨价。随着 2026年价格的显著上涨以及对2027年供应短缺的预期，中国客户的囤货意愿已变得非常强 烈。 第16问2027年HBM和DRAM的产能规划及增长预期分别是多少？ 2027年，分配给HBM的产能将显著增加。按比特增长率（bitgrowth）计算，HBM的增速预 计在70%左右；按绝对产能计算，月产能将达到约20万片。对于DRAM整体而言，包括 HBM在内的总月产能规划为70万片左右，这意味着HBM在总DRAM产能中的占比将达到 近30%。 第17问2027年不同应用领域的普通DRAM以及DRAM整体的增长预期是多 少？ 2027年普通DRAM的增长率因应用领域而异。服务器DRAM预计将有50%的增长，而PC 和手机领域的DRAM可能会出现负增长。将HBM和普通DRAM合并计算，DRAM整体的比 特增长率预计在30%左右。非HBM部分的增速相对较慢，大约在20%的水平。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 第18问当前NAND各细分市场的价格水平如何，以及2026年第三季度和第四 季度的价格涨幅预期是怎样的？ 目前企业级NAND的价格约为每GB0.37至0.38美元，接近0.4美元，预计2027年将稳定在 0.4美元左右。手机用NAND价格约为0.25美元，PC用NAND价格在0.17至0.18美元。回 顾2026年第三季度，企业级NAND价格上涨了15%至20%。展望第四季度，预计企业级 NAND将上涨5%至10%，手机用NAND涨幅可达20%，而PC用NAND价格预计将保持平 稳，不会上涨。 第19问TrendForce等第三方机构预测2026年第四季度NAND价格将有10% 至15%的综合性上涨，这一预测与公司的观点有何差异？ 第三方机构预测的10%至15%综合平均售价（blendedASP）涨幅，可能是由于手机NAND 市场正在经历补涨行情。如果将所有应用领域合并计算，这个涨幅是可以实现的。然而，从各 个细分市场来看，情况有所不同。公司主要关注的企业级NAND市场，其价格已接近上限， 进一步大幅上涨的空间有限，因此公司预计其涨幅不会那么高。目前服务器和PC领域的涨价 幅度已放缓，而手机领域正处于补涨阶段，这拉高了整体的平均售价。 第20问为什么2026年第四季度手机NAND可以涨价，而PCNAND却不能？ 三星在NAND市场的议价能力与其他厂商相比如何？ PCNAND无法涨价的主要原因是联想、戴尔、惠普等主要PC厂商不接受涨价幅度。而在手机 领域，尽管OPPO、vivo、小米等中国厂商从2026年第三季度起表示价格过高难以承受，但公 司可以将产能转向三星内部的手机部门和苹果。这两家公司能够接受价格上涨，并通过终端产 品价格进行传导。在议价能力方面，由于公司的供应量最大，在谈判中能锁定更多数量，因此 拥有更强的定价权。相比之下，海力士、美光等厂商的供应量较少，其销售价格通常会比公司 更低。这一情况在DRAM市场同样适用。 第21问2026年第四季度DRAM在服务器、手机和PC各应用领域的价格涨幅 预期是多少？ 2026年第四季度，服务器DRAM的价格预计上涨5%至10%，但达到10%的难度较大。手机 DRAM的价格涨幅预计在20%左右，具体来说，第三季度的价格约为1.6美元，第四季度的 目标涨幅在20%至23%之间。PCDRAM的价格则基本保持平稳，涨幅在0%到3%之间。 第22问当前DRAM产品在不同应用领域的出货量（按Gigabit计）占比结构 是怎样的？ 从2026年第四季度的出货量（按Gigabit计）来看，DRAM的产品组合中，服务器部分占比约 为35%至37%，HBM占比为15%至17%，两者合计为数据中心贡献了约55%的出货量。手 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 机应用占比约20%。此外，有10%至15%的裸晶圆直接销售给中国的模组厂。剩余不到10%的 份额分配给PC和汽车等其他应用。预计到2027年，数据中心（包含服务器和HBM）的合计 占比可能提升至60%。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "attachment:files/AI服务器OEM厂商调研_ 26年xAI机柜订单与出货节奏展望.pdf": {"id": "attachment:files/AI服务器OEM厂商调研_ 26年xAI机柜订单与出货节奏展望.pdf", "kind": "attachment", "title": "AI服务器OEM厂商调研_ 26年xAI机柜订单与出货节奏展望", "source_label": "其他", "excerpt": "载板调研：2026下半年启动成本驱动型涨价，联手 Intel布局12nm应对周期风险 资深行业专家调研纪要 核心要点 •计划2026年下半年启动涨价以消化上游硅片及化学品成本压力。•涨价幅度依制程先进程度而定，竞争激烈的8英寸产品维持原价。", "content": "载板调研：2026下半年启动成本驱动型涨价，联手 Intel布局12nm应对周期风险 资深行业专家调研纪要 核心要点 •计划2026年下半年启动涨价以消化上游硅片及化学品成本压力。 •涨价幅度依制程先进程度而定，竞争激烈的8英寸产品维持原价。 •2027年下半年成熟制程或面临供过于求，公司通过与Intel合作开发12nm制程应对。 专家问答实录 第1问请问UMC在2026年下半年及2027年上半年的成熟制程涨价预期是怎 样的，具体将在何时开始执行调价？ 公司官方宣布将从2026年下半年开始进行价格调涨。具体的调涨幅度和范围将根据产品种 类、技术节点以及客户是否签订长期合约而有所不同。对于未签订长期合约的客户，若在2026 年下半年投产，将直接采用涨价后的新价格进行议价；而对于已签订长期合约的客户，将在现 有合约履行完毕后，再以新价格进行议价。从涨价幅度来看，技术节点越先进，涨幅相对越 高。例如，22纳米制程虽然属于成熟制程范畴，但相对先进，其涨价幅度预计在3%至8%之 间。而40纳米或65纳米等更为成熟的节点，涨幅可能在3%至5%。特殊制程产品的涨价幅度 会更大，这类产品不局限于特定技术节点，可在28纳米、40纳米、65纳米乃至八英寸晶圆上 生产，通常应用于认证周期长、客户不易更换代工厂的车规或工控领域。由于客户粘性较高， 公司拥有更强的话语权，不必担心因涨价导致订单流失。然而，对于部分竞争激烈的成熟制 程，尤其是大部分八英寸晶圆的产品，公司将保持价格不变。这些制程技术已相对落后，设备 折旧早已摊销完毕，涨价空间有限，强行提价很可能导致订单流失。此次涨价的主要原因是原 材料成本的上升。例如，主要硅片供应商日本信越化学已于2026年6月1日宣布，其生产的 不同等级（如RF、SOI）硅片将开始涨价，最高涨幅可达15%。同时，光刻胶及其他化学品的 供应商在下半年也面临调价压力。综合测算，这些原材料成本的上涨导致公司的生产成本增加 了约3%至4%。因此，本次价格调整主要是为了消化上游成本的增幅，以维持毛利率水平稳 定，而非提升毛利率。 第2问2026年上半年成熟制程的价格变动情况如何？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2026年上半年，市场环境实际上对公司施加了降价压力。但公司成功守住了价格，并未进行任 何价格调整。进入下半年，由于原材料成本开始上涨，公司已无法继续承受成本压力，因此必 须启动涨价。 第3问原材料价格在2026年下半年之后是否会持续上涨？ 原材料价格的上涨通常是阶段性的，不会无限持续。以硅片为例，其供需关系类似于期货，公 司的采购部门会通过与供应商签订长期合约来锁定价格和保证供货，以进行风险对冲。尽管供 应商在2026年下半年开始涨价，但公司尚有部分库存可以应对。同时，为了保障未来几个月 库存用尽后的生产，公司已开始为下一批生产进行备料，并与供应商就涨价后的供货稳定性进 行协商。通常情况下，供应商的价格检讨周期大约为一年，不会频繁地逐月调整。 第4问UMC对2027年的价格策略有何展望？ 2026年下半年开始洽谈并下单的客户，其产品需要经过认证、光罩制作等流程，实际完成下单 并开始出货的时间点普遍会落在2027年第一季度。因此，2026年下半年这一轮的价格上涨， 其影响将主要体现在2027年第一季度的出货价格上。 第5问价格谈判的频率是怎样的，是按年度还是季度进行调整？ 价格并非基于固定的时间周期进行检讨。大部分客户都签有长期供货合约。以台南的F12A厂 为例，其月产能约为13万片，其中签订LTA的客户所占的产能大约为8至9万片，这部分长 约产能占总产能的比例至少达到三分之二，约70%。因此，价格波动对这部分客户的影响很 小。剩余约三分之一的产能则面向没有签订长约的“散户”客户。 第6问未签订长期供货合约的“散户”客户主要包含哪些类型，以及公司如何处 理他们的小批量订单？ 未签订LTA的客户主要是规模较小的设计公司（designhouse），例如许多来自中国大陆的设 计公司，其月下单量可能不足1,000片。由于签订LTA的门槛是月下单量需达到15,000片， 这些小客户无法满足签约条件。针对这类客户，公司采用“共乘”模式，将十几家小设计公司的 订单集中起来，绘制在同一套光罩上。通过这种方式，例如将10家月需求1,000片订单的客户 整合，就能形成1万片的批量，从而便于进行生产。 第7问签订长期供货合约的主要目的是什么？在当前的需求环境下，客户是否 仍有必要签订LTA？ 签订LTA的核心目的并非保证价格，而是为了保障产能供给的稳定性以及订单的确定性。对 于月下单量超过15,000片的客户，公司会要求必须签订合约。这是因为大批量订单需要投入大 量产能和资源，签订合约可以确保客户不会随意取消或大幅削减订单，从而避免公司的稼动率 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 因此受损。反之，若客户下单量仅一两千片，则属于散客，无需签约。因此，是否签订LTA 取决于客户自身的订单量，只要月下单量超过15,000片，就必须签约以确保双方利益。 第8问预计明年（2027年）签订长期供货合约的客户将占总产能的多大比例？ 目前无法确定明年LTA在产能中的具体占比，需要等待合约实际签订后才能知晓。 第9问考虑到中国大陆28纳米产能的释放，公司对22/28纳米制程节点明年的 需求和产能占比有何展望？ 尽管中国大陆过去三年陆续开出了不少28纳米产能，市场竞争加剧，但22/28纳米的需求依 然畅旺。这主要源于两个方面的动态：首先，许多原先使用40纳米制程的客户正在向28纳米 升级；其次，部分现有的28纳米客户也在向22纳米升级。因此，更先进制程的需求依然存 在。22/28纳米制程在网通芯片领域，如Wi-Fi7或未来6G相关芯片，仍然具备很高的应用价 值，这些应用并不需要2纳米或3纳米等顶尖工艺。从产品线结构来看，22/28纳米制程的营 收占比过去在33%至35%之间，预计明年（2027年）将进一步提升至38%，显示出不减反增 的趋势。 第10问对于2027年即将到期的长约，其续约价格的预期涨价幅度是多少？市 场传闻的15-20%涨幅是否可能实现？ 2027年的价格调整会基于涨价后的新价格进行谈判。预期涨幅在3%至8%之间。市场传闻的 15-20%涨幅过于夸张，基本不可能实现。以22纳米晶圆为例，目前平均售价约为4,000美 元，若上涨20%，即增加800美元至4,800美元，这一价格将接近TSMC的16纳米制程费 用，从而丧失市场竞争力，导致客户流失。因此，定价策略必须参考竞争对手在不同技术节点 的产品售价，避免跨级别的定价。 第11问与UMC相比，中国内地晶圆代工厂（如中芯国际、华虹）明年的价格 涨幅预计如何？双方的价差会发生什么变化？ 中国内地厂商的涨幅空间会相对较大，这主要是因为他们过去定价通常对标台湾地区的价格， 并提供约10%或更多的折扣。随着此轮价格调整，预计到2027年，他们与UMC之间的价差 将缩小至5%以内。 第12问在成熟制程领域，TSMC和Intel的价格策略是怎样的？他们是否也进 行了价格调整？ TSMC在价格上非常坚挺，因为其市场地位稳固。对于22/28纳米这类成熟制程，TSMC成熟 制程的毛利率低于先进制程，因此接单意愿不强。TSMC的生产模式倾向于单一工厂专注于特 定技术世代（如N5、N7），为布局更先进的制程，原有生产22/28纳米的产能可能会被转换 或淘汰。因此，这部分业务的增减对TSMC整体盈利影响甚微，他们不会因此主动调整价格策 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 略。至于Intel，其作为IDM厂商，代工业务本身盈利能力不强，生产成本相对较高，因此在 价格上也没有太多调整空间。 第13问从整个周期来看，预计2027至2028年成熟制程的供需平衡状况如何？ 特别是22/28nm等制程节点，届时是否存在供过于求的风险？ 存在这种可能性，这也是公司所担忧的。22/28nm这些产品自2022年以来已经推广了四年 多，对于客户而言，产品会面临更新换代的需求，因为终端用户也期望产品升级。为了应对 2027至2028年后28nm节点产品可能出现的需求疲软以及客户的升级需求，公司已提前布 局，在大约两年前开始与Intel合作导入12nm制程。目前12nm的开发进展顺利，已于今年 （2026年）完成PDK验证，计划2027年开始试产，并于2028年实现正式量产，以承接届时 客户的升级需求。从22nm升级至12nm，对客户而言，性能可提升20%，Diesize能缩小 10%，这将是推动产品更新换代的一个重要诱因。同时，在2028年这个时间点推出12nm制 程，也有助于公司进一步与中国大陆的晶圆厂形成技术代差，12nm制程所需的关键光刻设备 受到出口管制，大陆厂商目前无法实现。 第14问关于与Intel在12nm制程上的合作，有传闻称Intel方面对此合作的推 进并不积极，因为其自身需求旺盛，这是否可能导致合作进展放缓？另外，双方 的合作模式是否涉及技术授权费或收入分成？ 公司与Intel的合作并非单向的技术授权，而是基于双方技术的互补与整合。公司拥有14nm技 术，而他们有12nm技术，双方通过技术加成，各取所长。关于利润分配，并非简单地将获利 对半分成，而是根据生产环节和客户来源进行划分。具体的生产模式是，采用FinFET工艺且 需要EUV光刻机的前段制程在Intel位于Arizona的工厂完成；生产完成的半成品晶圆会运至 台湾，由公司完成后段的Copperline制程（约11道工序）。这种台美两地分工生产的模式有 助于降低整体制造成本。在费用和收费模式上，主要分两种情况：第一，如果客户由Intel方面 引入（包括Intel自身的需求），Intel完成前段制程后，公司将对其提供的后段代工服务收取 相应的成本和利润，然后将成品晶圆交还给Intel。Intel最终以何种价格销售给其客户，以及其 最终利润，公司并不介入。第二，如果客户由公司引入并向公司下单，公司则会向Intel采购完 成前段制程的半成品晶圆（其报价已包含其成本和利润），然后由公司完成后续生产并销售给 公司的客户，中间的价差即为公司的利润。因此，双方是“各赚各的”，不存在直接的利润分 成。 第15问考虑到Intel自身也拥有成熟的制程能力，其与公司展开合作的主要动 机是什么？ Intel与公司合作有其明确的商业目的，核心在于其居高不下的生产成本。由于在美国本土的人 力、电力及土地等成本远高于亚洲地区，Intel在晶圆代工业务上面临巨大的成本压力，这使得 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 其代工业务开展得非常辛苦。即便是成本管控能力极强的TSMC，其在Arizona的工厂也面临 同样的成本挑战。因此，通过与公司合作，将部分生产环节转移至台湾，可以有效降低整体的 制造成本，从而提升其在代工市场的竞争力。 第16问请分析与Intel合作的动因，以及双方各自的优势和合作模式？ 与Intel合作的动因主要基于双方的互补优势。首先，在人力成本方面，Intel以美元计价的薪 酬使其人力成本约为台湾地区的三倍，这构成了合作的经济基础。其次，在技术层面，虽然 Intel在先进制程上领先，但在成熟制程领域，公司的技术实力与其在伯仲之间。具体到后段的 copperline制程，其线宽线距是前段的3到5倍，因此公司现有的制造能力不仅绰绰有余，甚 至在某些方面更具优势。对于Intel而言，此次合作有几个层面的考量。第一，他们当前正集中 资源攻克18A、14A等先进制程，对于已有的成熟制程技术投入的心思有限。第二，通过合 作，Intel可以将其库存的成熟技术，利用公司既有的客户升级需求进行推广，实现技术变现， 否则这部分技术将面临缺乏客户的窘境。从更长远的角度看，未来双方甚至有可能在3nm制 程上展开合作。合作模式将延续现有分工，即Intel负责前段制程，公司负责后段制程。这种 模式对公司的好处显而易见：无需承担EUV光刻机等昂贵设备的资本支出，因为Intel已完成 相关投资且设备折旧摊提已近尾声。公司可以利用现有的22/28nm设备来生产3nm的后段 copperline，因为线宽要求完全在现有设备能力范围内，无需新增设备投资。同时，公司现有 的22/28nm设备折旧已基本摊提完毕，生产成本极具竞争力。因此，该合作能让公司在不增加 额外资本支出的情况下，获取3nm技术并利用现有产能，实现双赢。 第17问从整个成熟制程的供需平衡来看，预计何时可能出现供过于求的状况， 并对稼动率产生影响？ 整体成熟制程的供需状况需要分应用领域来看。用于网通或displaydriver等领域的成熟制程确 实会面临饱和与降价的压力。然而，用于特殊制程（SpecialtyProcess）的应用则不一定面临同 样情况。目前，特殊制程大约占公司业务的三分之一，涵盖12英寸和8英寸晶圆。具体到降 价压力，预计将主要集中在22/28nm节点，因为其产品生命周期偏长，需求会相对疲软。至于 出现供过于求的时间点，预计会在2027年下半年发生。为了应对这一周期性变化，公司的策 略是在2028年将12nm制程的量产顺利接续上来。计划从2027年下半年开始，与部分客户洽 谈新订单向12nm升级的事宜，以便在2028年能够开始投片。 第18问公司所提及的特殊制程具体包含哪些，与中芯国际、华虹等同业相比有 何差异化？ 公司的特殊制程主要包括BCD（Bipolar-CMOS-DMOS）、EmbeddedFlash以及HV（High Voltage）等。与中芯国际和华虹相比，公司的特殊制程在应用方向上存在明显区隔。他们的特 殊制程更多地应用于工控领域的电源管理IC，而公司则主要聚焦于车用领域。公司的车用领域 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 布局可以追溯到车用IC大规模缺货时期，当时公司因此获益。车用IC的特点是认证周期非常 长，例如IATF16949认证就需要三年时间，远超ISO9001，并且产品备料周期长达7年，因 此客户绑定非常紧密。公司在早期投入了大量成本和时间，最终取得了车用市场的准入资格。 具体产品包括车用的EmbeddedFlash、车用EmbeddedHV，以及服务器内部使用的电源控制芯 片。因此，公司的市场定位与华虹、中芯国际等偏向工控领域的厂商形成了差异化竞争。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-23T09-34:cf29f2bc8af0": {"id": "post:2026-10-23T09-34:cf29f2bc8af0", "kind": "post", "title": "2026-10-23 09:34", "source_label": "帖子正文", "excerpt": "【中信前瞻】美股半导体硬件剧烈调整点评：广泛的抛售，但预计将很快结束 -------------------- 市场表现：隔夜美股科技股再次出现全面、剧烈的抛售，费城半导体指数下跌6.7%，盘中一度下跌超过7%，除了AI属性相对偏弱的模拟芯片之外，半导体设备、存储、光通信、CPU等大幅下挫。MEGA", "content": "【中信前瞻】美股半导体硬件剧烈调整点评：广泛的抛售，但预计将很快结束 -------------------- 市场表现：隔夜美股科技股再次出现全面、剧烈的抛售，费城半导体指数下跌6.7%，盘中一度下跌超过7%，除了AI属性相对偏弱的模拟芯片之外，半导体设备、存储、光通信、CPU等大幅下挫。MEGA 7中，除了苹果之外，其他个股亦都被波及，债券、软件成为资金避险方向，反应市场全面的抛售、降杠杆； 触发因素：投资者原本希望META、Lam等公司的财报为脆弱的市场注入新的稳定剂，但显然未能如愿：1）META财报并无太多有趣内容，所谓的承诺负债等已经讨论了几个月，算不上新内容，但是公司做了一件看似极其聪明、利己，但是给市场带来无限恐慌的事情，就是暂时搁置2027年的capex指引，把不确定性和压力留给市场，同时抛出一个创设C类股计划，为后续的巨额股权融资做准备。看似精明的算计、安排，却瞬间让脆弱的市场不堪重负；1）Lam营收短期受到下游客户洁净室、供应链瓶颈等因素的约束，未能满足市场的激进预期； 问题根源：过去几周，中东问题焦灼&升级、中期选举不确定性等，带来的广泛的宏观压力（流动性收紧、债券收益率上行等）成为美股市场下行的主要根源。同时OpenAI、Anthropic的ARR数据，DRAM的竞争、META财报等行业因素更多扮演了稻草的角色。同时和7月份抛售相异的地方在于，宏观压力带来的长端债券收益率的上行，导致市场风险偏好的快速收敛，而AI脆弱环节个股债券CDS到股票价格的传导，进一步放大了市场的短期波动、恐慌，并使得市场开始全面交易AI CAPEX增速放缓的情形； 后续判断：未来1~2周，市场仍需要等待三家CSP（微软、亚马逊、谷歌）财报中关于capex指引、AI ROI的表述，以及中期选举不确定性的消除。考虑到当下市场恐慌、抛售更多来自于宏观压力、中期产业叙事担忧（短期基本面并没有看到任何瑕疵），以及市场做空仓位&流动性压力极端位置、中期选举之后不确定消除&中东战事政治意义下降、股票回购重启等，我们预计市场将在经历短期的痛苦之后快速迎来反弹。#文字观点", "publish_time": "2026-10-23 09:34", "tags": ["文字观点"]}, "post:2026-10-23T13-43:ea3299c41b88": {"id": "post:2026-10-23T13-43:ea3299c41b88", "kind": "post", "title": "2026-10-23 13:43", "source_label": "帖子正文", "excerpt": "12家主观私募核心观点（2026年10月） 宏观外部：9月美联储加息，美债收益率走高，海外高利率延续；中美周期错位，海外利率压制成长，但AI产业景气仍在", "content": "12家主观私募核心观点（2026年10月） 宏观外部：9月美联储加息，美债收益率走高，海外高利率延续；中美周期错位，海外利率压制成长，但AI产业景气仍在；中东地缘推升油价、油运周期走强。 国内市场：A股9月普遍回调、成交萎缩，处于政策底明确、盈利底尚未确认阶段，存量/减量博弈，AI板块交易拥挤度去化，市场以结构性机会为主，难有普涨行情。 各私募核心分歧&重点方向 1. 泽元任文启：看空港股，信贷脉冲、两融指标提示A股偏谨慎；地产投资逻辑受损；大宗商品谨慎乐观，创新药要重视出海风险。 2. 复胜陆航：红利做底仓，关注港口航运供需错配；AI应用付费转化尚待验证，坚持均衡灵活。 3. 聚鸣刘晓龙：高现金仓位，重点跟踪Meta Muse代表的C端AI消费机会；担忧美债利率压制权益。 4. 聚鸣王文祥：重仓AI科技，算力产业链长期确定性强，但内需消费承压，指数短期承压，自下而上选估值合理成长股。 5. 仁桥夏俊杰：AH几乎满仓，认为并非全面熊市；AI泡沫出清，期待政策发力；长期看好科技过后服务业、幸福感相关方向。 6. 高毅邓晓峰：A股AI板块因拥挤度大幅回撤；国内经济K型分化；降低AI供应链仓位，转向半导体、互联网、化工。 7. 领久魏晓康：满仓AI产业链（海外存储、半导体、算力）；看好AI Agent、AI制药，优选具备现金流回报壁垒龙头。 8. 浑瑾李岳：高利率不是核心矛盾，AI新产业高回报会虹吸资金；看好Meta的C端AI；油运供需格局向好，周期有望拉长。 9. 望正王鹏辉：权益仓位下调；AI仍是长期主线，看应用商业化兑现；期待国内财政地产政策效果，看好制造业边际回暖。 10. 青蚨刘振华：以中观确定性为锚，减量市场中布局高性价比筹码；重点券商（业绩估值剪刀差）、快递、化工、港口航运，重视三季报验证逻辑。 11. 冲积陈忠：全球进入资产再定价，警惕高估值长久期资产；中长期看好AI产业链，同时跟踪国内政策带来内需修复机会。 12. 红筹邹奕：本轮回调属于良性压力测试；AI改变资本流向，看重有实物产能的AI环节；看好人民币资产中长期重估机会。 共识清单 ①外部约束：美联储高利率、美债高收益率、地缘风险是重要外部压制； ②AI：长期产业趋势认可，但国内AI交易拥挤，需要业绩、订单、付费兑现，分化加剧，重点关注C端Agent应用（Meta‑Muse）； ③A股：短期难全面牛市，结构性为主，等待盈利验证； ④机会方向：红利资产、油运航运、半导体/算力硬件； ⑤风险：内需偏弱、地产修复不及预期、海外流动性收紧。 风险提示：以上仅为机构观点整理，不构成投资建议。#文字观点", "publish_time": "2026-10-23 13:43", "tags": ["文字观点"]}, "post:2026-10-23T12-06:def96d1f26fa": {"id": "post:2026-10-23T12-06:def96d1f26fa", "kind": "post", "title": "2026-10-23 12:06", "source_label": "帖子正文", "excerpt": "美股大跌极有可能促成 A 股真正见底 ------------ 原油涨、美股跌、 AI 债券跌、黄金跌、美债利率下行，#这是典型的衰退交易。#市场近期担忧的风险主要是：中东地缘冲突再度升级、美国“借钱投资”的 AI 产业链在高利率环境下难以为继。", "content": "美股大跌极有可能促成 A 股真正见底 ------------ 原油涨、美股跌、 AI 债券跌、黄金跌、美债利率下行，#这是典型的衰退交易。#市场近期担忧的风险主要是：中东地缘冲突再度升级、美国“借钱投资”的 AI 产业链在高利率环境下难以为继。 如果这两个担忧真的成立，滞胀的宏观环境将进一步明确，叠加美联储的加息，走向衰退的概率也在加大。 但是，当 AI 开始降温的时候，美国通胀中真正值得担忧的部分也在降温，由于美国并没有形成通胀工资螺旋、就业也呈现低薪增长的扭曲结构，#美联储持续加息的风险实际上正在随着AI 的降温而大幅下降。 当然，中东地缘冲突再度大幅升级是一种难以预测的尾部风险。 如果刨除这种尾部风险，实际上宏观层面正在经历由“AI 过热+流动性收缩”向“AI 降温+流动性缓和”的转换，#风格的切换必然会带来前期主线的下跌。考虑美股对 A 股风偏的传染效应，这可能会带来 A 股的继续调整，但由于 A 股、尤其是 AI 本硬件轮的调整已经明显领先于美股，所以空间可能已经提前跌了出来，#美股的大跌极有可能促成A 股真正意义上的见底。 与此同时，#黄金可能再次来到了配置区间。在衰退冲击完成后，黄金的长短期逻辑将重新共振，实际利率对长期逻辑的压制正在缓和，同时伦敦金也已经跌至4000美元的强支撑位置，当前位置具备配置价值。 #风险提示：以上分析仅建立在中东地缘没有实质性升级的前提之下，中东地缘冲突存在较大的不确定性。 财通宏观·张伟#文字观点", "publish_time": "2026-10-23 12:06", "tags": ["这是典型的衰退交易", "市场近期担忧的风险主要是", "美联储持续加息的风险实际上正在随着", "风格的切换必然会带来前期主线的下跌", "美股的大跌极有可能促成", "文字观点"]}, "attachment:files/东吴金属 锡产业专家会：近期锡价走势分析与后市研判.pdf": {"id": "attachment:files/东吴金属 锡产业专家会：近期锡价走势分析与后市研判.pdf", "kind": "attachment", "title": "东吴金属 锡产业专家会：近期锡价走势分析与后市研判", "source_label": "其他", "excerpt": "东吴金属锡产业专家会：近期锡价走势分析与后市研判 要点总结 1.锡铜比从统计上限回归是10月以来锡价下跌的核心跨品种线索：锡与铜同为宏观顺周期品种，20 年以上长周期锡铜比维持稳定区间。2026年4月起锡铜比突破26年历史上不足6次的上限，主因一 季度锡价快涨而铜价滞后", "content": "东吴金属锡产业专家会：近期锡价走势分析与后市研判 要点总结 1.锡铜比从统计上限回归是10月以来锡价下跌的核心跨品种线索：锡与铜同为宏观顺周期品种，20 年以上长周期锡铜比维持稳定区间。2026年4月起锡铜比突破26年历史上不足6次的上限，主因一 季度锡价快涨而铜价滞后；截至10月已大幅回归，印证一季度锡价相对其他有色品种存在泡沫，本轮 下跌属品种间价值回归，后续跨品种波动率有望下降。 2.价格波动可拆解为交易属性、宏观属性与板块趋势属性：2026年上半年锡交易属性快速走扩、资金 集中参与单一品种；10月起交易属性快速收缩，宏观与板块趋势属性合计放大。锡盘面较小，对宏观 扰动呈高贝塔，波动历来大于铜等顺周期品种。 3.本轮上涨逻辑与2024/2025年供应扰动截然不同，核心是AI\"算力金属\"叙事：2024-2025年交易 缅甸佤邦停产、非洲矿扰动；2025年底至2026年转为需求端AI叙事，上半年商品与中韩美AI芯片 股同步上涨，9月起观点与价格明显分化，美股AI相关权益与债务融资收缩，产业端开始重审2027年 云厂商资本开支增速。年初\"算力短缺+订单延续至2027/2028年\"叙事已充分计入价格，四季度价格 螺旋被突破。 4.宏观压制与LME持仓结构转弱：美联储12月加息25bp概率较大，若11月底至12月初落地将对 年底有色价格形成整体压制。LME商业空头（主要空头）持仓强度三季度末以来未进一步上升，多头 资金持仓强度亦下降，短期难以再现单边持续上涨。 5.供给端：进口矿宽松、TC回升：2026年1-8月中国进口锡精矿折金属量累计同比+23%，增量主 要来自缅北复产，但缅甸开工率仅恢复至40%~50%并维持半年以上，复产节奏远不及预期。进口矿缺 口从2025年7-8月近3年峰值15,000吨收窄至10月的-5,000吨，TC如期小幅上涨，锡价下行叠加 TC上涨使冶炼利润率10月以来提高约0.2~0.5个百分点。 6.印尼供应续降，2027年1月1日新交易所是年初核心催化：预计2026年印尼全年交易量较2025 年下滑约5%，两个交易所交易量及官方锡锭出口均下滑4%~5%。新交易所中期意图提高透明度与定 价话语权，实质影响在于压缩偷采走私的表外产量；若年初运行不流畅导致出货节奏慢于2026年，是 值得关注并参与的交易机会。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 7.年度矿端产量测算：2026年+0.74%、2027年+3.29%：2026年增量集中在缅甸，印尼等地部分 减量相抵。2027年非洲给小幅增产、亚洲上行（主要来自缅甸，给月均2,000吨中性指引，高于 2026年月均1,500吨），印尼给介于2025-2026年之间的预估；供应链脆弱性使实际落地不确定性 较大。 8.需求端：淡季重心下移、下游对价格高度敏感：下半年消费绝对体量重心较上半年下滑，8-9月备货 回暖有限。下游呈\"三档价格规律\"，最大日度采购量逐月下台阶（8月对应42万、9月41.5万、10月 仅月初39万左右），反推在手订单并不如年初\"AI需求直接起飞\"预期充足。 9.焊料大类2026年全球需求约-3%（约-6,600吨），2027年边际回升近3%（约+5,000吨）：结 构体量排序为光伏＞汽车＞消费电子。2027年光伏给全球约+5%改善增速，汽车与通信（含服务器） 继续增长，消费电子仍可能下滑但降幅收窄，家电基本持平。半导体销售累计同比增速呈见顶形态，大 周期或于2026年底至2027上半年回落。 10.AI对锡的真实拉动当前仍有限：光模块增速高但耗锡量小、难以单独拆分；AI当前类似2010年 代初期光伏，若AI服务器及配套硬件维持30%~40%年化增速，约三四年后有望成长为较大单一市 场，但目前AI耗锡占比仅个位数，边际拉动尚不强劲。 11.库存：上期所仓单偏低但无实质供给瓶颈：LME库存较前期低点更充裕，偏低主要是上期所仓单 （云锡停产检修致现货阶段性偏紧及产业交割行为）。产业端原料不紧张、冶炼开工率有上行趋势，社 会库存波动区间稳定，不宜对低库存过度解读。 12.年度平衡与2027年展望：2026年元素口径\"供增需减\"、边际过剩，但增量锡矿未顺利转化为锡 锭，以原料/备货/周转库存形式滞留产业链；锡锭口径\"供需双弱\"，基本面定价权不高，行情更多由热 钱与投机资金推动。2027年\"供需双增\"、基本面偏中性、波动率下降，保留供应脆弱性带来的利多想 象。催化剂：短期看印尼新交易所落地，年度看缅甸复产节奏、光伏出清改善与半导体周期见顶回落， 宏观看12月加息落地。 问答整理 Q1：今年许多投资者因AI金属概念而关注锡品种，但年底复盘来看，该叙事似乎并未落地为 实际需求的增长。这一差异的原因是什么？是否因为实际产业中耗锡环节与市场关注的环节不 同，还是存在其他原因？未来应如何理性预期AI发展对锡需求的拉动？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：今年上半年市场对AI拉动锡需求的热门观点主要集中在光模块和服务器的单耗量，与股票市场炒 作的标的关联度较高。光模块市场增速虽高，但其耗锡量体量不大，甚至难以单独拆分。在股票与商品 价格螺旋上涨过程中，股票市场中的热门概念传递至商品市场，但在市场相对狂热时并未对该概念进行 客观理性的分析。AI目前的需求增速个人仍十分看好，当前AI类似于2010年代左右的光伏产业。光 伏经历持续四五年左右的高速增长后，已成为最大的单一需求品类。若AI产业能够保持当下的景气 度，AI服务器及其他配套硬件设施未来能够持续保持30%到40%左右的年化同比增速，三四年后该市 场也会成长为较大的单一市场。但目前AI自身占比仅为个位数，即便增速再翻一倍，放到锡庞大的需 求盘子中，其边际拉动作用仍不强劲。 Q2：供给端方面，今年存在矿端相对宽松但锡锭持续偏紧的现象，这一现象是否因TC一直偏 低所致？TC上涨是否确实困难？若后续TC进一步上涨，锡锭端的补充是否会对锡价形成潜在 利空？ 答：TC上涨难度确实较大。从产业结构看，当前处于卖方市场，拥有矿源的企业在TC议价过程中较 为强势，加工费上涨会损害上游利益，因此上游反对加工费上涨。冶炼产能过剩导致冶炼端在加工费议 价过程中不占优势。原料开始明显宽松后，加工费在绝对价格和相对价格上均出现小幅上涨。今年矿源 宽松而锡锭偏紧，主要是冶炼厂认为利润率不够充足，提高产能利用率的动机不强。冶炼端实际开工率 较低，后续只要有利可图、不至于亏损，开工率弹性相对较大。这实际上是上游与中游相互试探的过 程，若冶炼端持续不开工，货源将囤积在上游手中，因此后续加工费仍有上调空间，冶炼厂开工率也有 上升空间，锡锭紧张的局面将有明显改善。 Q3：在锡价上涨阶段，矿端不肯给冶炼厂让利；而当前价格下跌后，矿端反倒愿意给冶炼厂 让利，这一现象是否与常理相悖？ 答：锡价上涨阶段与佤邦复产时点基本重合，去年佤邦大约11月开始出货，当时货源尚未明显宽松， 上游议价权较高，没有意愿让渡加工费。当前价格虽然下跌，但上游为防止资金周转率降低或自身囤积 过多货源，可能会考虑让渡一部分加工费。这需结合上游实际库存和经营情况来看，与价格涨跌有一定 关联性，但不是唯一决定因素。 Q4：印尼方面，过去三年锡产量持续偏低，其原因在于政策层面还是矿端资源禀赋问题？往 后展望两到三年，印尼产量恢复至此前较高水平的概率更大，还是出于资源保护需求进一步收 紧甚至出现限制锡锭出口的概率更大？ 答：今年曾赴印尼调研。过去一两年印尼体现出的产量和出口量确实较低，人为因素占较大比重，主要 是配额调整以及反腐导致冶炼厂频繁关停移交等问题。印尼锡资源品位并没有在这两年出现断崖式下 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 跌，只要政策端扰动不过于频繁并且愿意进行资本开支，印尼能够完全维持原有的锡矿产量。印尼锡行 业的管理精细度和政府管理能力相较于中国较为落后。长期来看，印尼产量会逐年下滑，政府出于经济 利益或资源保护主义的角度有可能会收缩或加强国内管理，一旦加强管理会导致过去粗放甚至非法的部 分产量受到直接影响。往后一两年，没有对印尼产量快速反弹上升的预期，仍会维持不确定性较高、实 际产量较低的格局。 Q5：如何评价锡今年的基本面表现？基于明年供需预判，明年的锡基本面相较今年是改善还 是恶化？对明年的锡价应如何把握？ 答：今年基本面到年底大概率呈现供增需减的格局。基于去年平衡表，今年边际上锡元素过剩，相较于 去年在边际上形成利空。但供应增量部分的锡矿并没有非常顺利地转化为锡锭，更多是作为产业原料库 存、备货库存或周转库存储存在产业链中，没有实际投入生产运营环节。因此从锡锭角度看，今年是供 需双弱，供应没有十分明显的改善，需求整体比去年偏弱。基本面对于锡价的定价权并不高，今年的行 情更多受到热钱和较大投机资金的参与推动。明年边际上会呈现供需双增，但需保留对价格利多的想 象，因为每年对次年供应都有增长预期，而锡供应链的脆弱性会导致很多增长预期最终无法落地。明年 基本面对于价格整体偏中性，供应端确定性并不十分可靠，在情绪释放之后基本面影响偏中性，价格波 动率会下降。 原文 1.近期锡价下跌复盘：锡铜比统计回归与波动结构拆解10月以来锡价快速下挫、基本面无明显利空： 本次为东吴金属有色资源品与新材料双周电话会第二期（聚焦锡），对近期价格波动做复盘归因，并展 望2026、2027年供需基本面与修复可能。 锡铜比从统计上限回归是近期下跌最核心的跨品种线索：锡与铜同为宏观顺周期品种，20年以上长周 期看锡铜比基本维持稳定区间；本轮锡价相对铜价跌幅明显更深。 2026年4月起锡铜比突破统计意义上合理区间上限，过去26年中突破上限次数不足6次；主因一季 度至二季度上半段锡价快速上涨、铜价涨幅节奏明显滞后，锡铜比被拉得非常高。 4月起多次提示纯期货“空锡多铜”对冲策略，截至10月锡铜比已大幅回归，印证2026年一季度锡 价相对铜价及其他有色品种存在一定泡沫。 本轮下跌从跨品种套利角度看是品种间价值回归，目前已回到相对合理区间，后续品种间差异波动的波 动率可能下降。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 价格波动三项拆解：交易属性快速收缩、宏观属性与板块趋势属性放大：2026年上半年锡交易属性走 扩迅速且幅度大，对应较多资金集中参与锡单一品种交易；10月起交易属性收缩非常快，宏观属性与 板块趋势属性两者合计放大较快。 锡盘面相对较小，宏观扰动较大时对宏观因素冲击呈现较高贝塔，导致波动幅度历来大于铜等顺周期品 种。 2.行情驱动拆解：AI“算力金属”叙事的定价与退潮本轮上涨与2024/2025年供应扰动逻辑显著不 同：2024、2025年市场交易重点在缅甸佤邦停产、非洲矿扰动等供应端冲击；2025年底至2026年 这轮行情则是需求端催化出与AI强相关的“算力金属”概念，2026年上半年在资本叙事与官媒报道推 动下推进程度非常高。 上半年商品与AI芯片股同步上涨、9月起观点与价格明显分化：2026年前两个季度锡价与中国、韩 国、美国AI芯片制造相关股票标的同步上涨；三季度价格开始分化，10月起分化程度较高，统一观点 从9月起出现非常明显的分化。 海外资金面同步降温：美股AI相关权益融资、债务融资近期明显收缩；韩国三星、海力士两只明星股 受限制杠杆或流动性问题影响，近期波动幅度较大。 产业端重审2027年云厂商资本开支增速：产业面开始更冷静地审视云厂商2027年资本开支增速能否 预期经常无法落地，人为或不可抗力因素较多，供应端确定性 并不十分靠谱。 2027年在这波情绪释放之后，基本面对价格影响偏中性，并可能导致价格波动率下降。 催化剂梳理：短期（2027年一季度）：印尼新交易所2027年1月1日落地，若运行不流畅或企业适 应新流程导致出货节奏比2026年更慢，构成最值得关注并参与的交易机会；往后一两年印尼产量无快 速反弹预期、维持高不确定性与低实际产量格局。 年度维度（2027年）：缅甸复产节奏是最大变量——当前开工率仅40%~50%，2027年指引给月均 2,000吨（高于今年月均1,500吨的恢复水平），若实际提产超预期将直接影响中国原料宽松程度；光 伏行业出清改善后重入正轨支撑焊料需求（全球约+5%）；同期消费电子仍下滑、家电持平，半导体 大周期或于2026年底至2027上半年见顶回落形成需求端拖累。 更长维度：印尼资源出口政策持续收紧，最终方向是把资源留在政府手中并在印尼国内建设产业链环 节；AI服务器及配套硬件若维持30%~40%年化增速，三四年后有望成长为比较大的单一耗锡市场。 宏观变量：12月加息25bp若在11月底至12月初落地，将对年底有色价格形成一段整体压制；锡铜 比已回归相对合理区间，跨品种波动率有望下降。 问答整理1今年许多投资者因AI金属概念而关注锡品种，但年底复盘来看，该叙事似乎并未落地为实 际需求的增长。这一差异的原因是什么？是否因为实际产业中耗锡环节与市场关注的环节不同，还是存 在其他原因？未来应如何理性预期AI发展对锡需求的拉动？ 今年上半年市场对AI拉动锡需求的热门观点主要集中在光模块和服务器的单耗量，与股票市场炒作的 标的关联度较高。光模块市场增速虽高，但其耗锡量体量不大，甚至难以单独拆分。在股票与商品价格 螺旋上涨过程中，股票市场中的热门概念传递至商品市场，但在市场相对狂热时并未对该概念进行客观 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 理性的分析。AI目前的需求增速个人仍十分看好，当前AI类似于2010年代左右的光伏产业。光伏经 历持续四五年左右的高速增长后，已成为最大的单一需求品类。若AI产业能够保持当下的景气度，AI 服务器及其他配套硬件设施未来能够持续保持30%到40%左右的年化同比增速，三四年后该市场也会 成长为较大的单一市场。但目前AI自身占比仅为个位数，即便增速再翻一倍，放到锡庞大的需求盘子 中，其边际拉动作用仍不强劲。 2供给端方面，今年存在矿端相对宽松但锡锭持续偏紧的现象，这一现象是否因TC一直偏低所致？TC 上涨是否确实困难？若后续TC进一步上涨，锡锭端的补充是否会对锡价形成潜在利空？ TC上涨难度确实较大。从产业结构看，当前处于卖方市场，拥有矿源的企业在TC议价过程中较为强 势，加工费上涨会损害上游利益，因此上游反对加工费上涨。冶炼产能过剩导致冶炼端在加工费议价过 程中不占优势。原料开始明显宽松后，加工费在绝对价格和相对价格上均出现小幅上涨。今年矿源宽松 而锡锭偏紧，主要是冶炼厂认为利润率不够充足，提高产能利用率的动机不强。冶炼端实际开工率较 低，后续只要有利可图、不至于亏损，开工率弹性相对较大。这实际上是上游与中游相互试探的过程， 若冶炼端持续不开工，货源将囤积在上游手中，因此后续加工费仍有上调空间，冶炼厂开工率也有上升 空间，锡锭紧张的局面将有明显改善。 3在锡价上涨阶段，矿端不肯给冶炼厂让利；而当前价格下跌后，矿端反倒愿意给冶炼厂让利，这一现 象是否与常理相悖？ 锡价上涨阶段与佤邦复产时点基本重合，去年佤邦大约11月开始出货，当时货源尚未明显宽松，上游 议价权较高，没有意愿让渡加工费。当前价格虽然下跌，但上游为防止资金周转率降低或自身囤积过多 货源，可能会考虑让渡一部分加工费。这需结合上游实际库存和经营情况来看，与价格涨跌有一定关联 性，但不是唯一决定因素。 4印尼方面，过去三年锡产量持续偏低，其原因在于政策层面还是矿端资源禀赋问题？往后展望两到三 年，印尼产量恢复至此前较高水平的概率更大，还是出于资源保护需求进一步收紧甚至出现限制锡锭出 口的概率更大？ 今年曾赴印尼调研。过去一两年印尼体现出的产量和出口量确实较低，人为因素占较大比重，主要是配 额调整以及反腐导致冶炼厂频繁关停移交等问题。印尼锡资源品位并没有在这两年出现断崖式下跌，只 要政策端扰动不过于频繁并且愿意进行资本开支，印尼能够完全维持原有的锡矿产量。印尼锡行业的管 理精细度和政府管理能力相较于中国较为落后。长期来看，印尼产量会逐年下滑，政府出于经济利益或 资源保护主义的角度有可能会收缩或加强国内管理，一旦加强管理会导致过去粗放甚至非法的部分产量 受到直接影响。往后一两年，没有对印尼产量快速反弹上升的预期，仍会维持不确定性较高、实际产量 较低的格局。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 5如何评价锡今年的基本面表现？基于明年供需预判，明年的锡基本面相较今年是改善还是恶化？对明 年的锡价应如何把握？ 今年基本面到年底大概率呈现供增需减的格局。基于去年平衡表，今年边际上锡元素过剩，相较于去年 在边际上形成利空。但供应增量部分的锡矿并没有非常顺利地转化为锡锭，更多是作为产业原料库存、 备货库存或周转库存储存在产业链中，没有实际投入生产运营环节。因此从锡锭角度看，今年是供需双 弱，供应没有十分明显的改善，需求整体比去年偏弱。基本面对于锡价的定价权并不高，今年的行情更 多受到热钱和较大投机资金的参与推动。明年边际上会呈现供需双增，但需保留对价格利多的想象，因 为每年对次年供应都有增长预期，而锡供应链的脆弱性会导致很多增长预期最终无法落地。明年基本面 对于价格整体偏中性，供应端确定性并不十分可靠，在情绪释放之后基本面影响偏中性，价格波动率会 下降。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-23T20-58:e92eea50bf65": {"id": "post:2026-10-23T20-58:e92eea50bf65", "kind": "post", "title": "2026-10-23 20:58", "source_label": "帖子正文", "excerpt": "【广发纺服】涉机器人业务上市公司 & 产业链更新 20261023 智元机器人：10 月 23 日联合北大发布 ViGAR——首个面向全尺寸人形机器人的''世界-动作模型''，仿真与真机结论一致（水果摆放域内 0.72、域外 0.43），模型权重与训练代码全部开源；AI WAVE 首项成果''具身推", "content": "【广发纺服】涉机器人业务上市公司 & 产业链更新 20261023 智元机器人：10 月 23 日联合北大发布 ViGAR——首个面向全尺寸人形机器人的''世界-动作模型''，仿真与真机结论一致（水果摆放域内 0.72、域外 0.43），模型权重与训练代码全部开源；AI WAVE 首项成果''具身推理''数据集同步开源，覆盖九类推理、分三档难度，为首个真实场景 Physical Agent 数据集。 特斯拉：Q3 电话会确认 Optimus 在弗里蒙特进入早期爬坡、首批达量产质量下线，但灵巧手仍是最大硬件难点，周产 2 万台至少还需一年，AI5 约 2027 年 4 月集成、2027 年底才对外交付；为补真实数据，将建''Optimus 学院''先造 1—2 万台机器人自我对弈练习。Q3 营收 280.46 亿美元、营业利润同比 -56%、研发支出 27.61 亿美元同比 +69%，未披露 Optimus 产量与订单。 宇树科技：10 月 23 日午后 20CM 涨停、报 624 元涨 20%，市值重返 2500 亿元上方，6 个交易日累涨约 47%；王兴兴称 G1 累计下线约 1—2 万台，但大规模普及门槛是年产千万台，公司正预研物理 AI 自进化 V1.0 并设千万元级世界物理 AI 大赛，同时启动 ''宇创计划'' 五年孵化 200 + 生态企业。 优必选：第十九届欧洽会（成都）上与中欧数字协会签约，锚定机器人欧洲市场拓展与技术协同。 广发纺服涉及机器人业务公司：南山智尚（灵巧手腱绳，包覆材料，皮肤衣等）；恒辉安防（灵巧手腱绳，机器人手套/防护件，电子皮肤）；康隆达（UHMWPE纤维，机器人手套/脖颈/腰封等柔性关节保护件，腱绳验证）；兴业科技（天然皮革基柔性电子皮肤，参股众擎机器人）；富春染织（PEEK改性材料，外骨骼机器人）；台华新材（锦纶/尼龙66，机器人外衣织物）；云中马（持股中玺新材料，UHMWPE腱绳上游原料）；聚杰微纤（人工肌肉仿生纤维）。 联系人：糜韩杰 / 左琴琴 / 董建芳 / 钟泽宇#文字观点", "publish_time": "2026-10-23 20:58", "tags": ["文字观点"]}, "post:2026-10-23T10-53:fc3544a208b9": {"id": "post:2026-10-23T10-53:fc3544a208b9", "kind": "post", "title": "2026-10-23 10:53", "source_label": "帖子正文", "excerpt": "【华安医药】推荐医疗器械：已披露公司的Q3业绩依然稳健，且有亮点，底部推荐 一、核心观点 1. 政策端的扰动在多个细分板块影响缩小或见底：门诊量Q3逐渐提升，内需（无论是院端还是零售端）的需求在恢复；集采影响，IVD领域的检测服务价格征求意见稿多个省份已下发，价格整体平移，对IVD厂家出家价影响较小", "content": "【华安医药】推荐医疗器械：已披露公司的Q3业绩依然稳健，且有亮点，底部推荐 一、核心观点 1. 政策端的扰动在多个细分板块影响缩小或见底：门诊量Q3逐渐提升，内需（无论是院端还是零售端）的需求在恢复；集采影响，IVD领域的检测服务价格征求意见稿多个省份已下发，价格整体平移，对IVD厂家出家价影响较小；神经介入耗材国家集采已开始产品信息维护；脊柱、运动医学、人工晶状体等耗材续采已开展；设备端手术机器人的集采在调研过程中，出海加速。 2. Q3业绩：此前并未对器械板块公司的业绩抱有很大预期，但已披露的公司来看，普遍较为稳健增长。此前由于计提减值的也基本出清，主业仍在稳健增长。我们认为，从竞争格局的角度，医疗器械板块本身创新属性多为渐进式创新，头部公司的竞争优势会随时间有复利加成，竞争格局持续有利于头部公司，时间换空间的角度，这些头部公司未来的业绩增长持续性确定性高，超预期的可能性高。 3. 估值：板块自2021年高点持续下跌，2025年的牛市也未惠及医疗器械板块，股价下跌50%以上，当前并不拥挤。 4. 配置：建议按市值排序，加权配置百亿以上的医疗器械龙头公司。 二、Q3业绩已披露且有亮点的公司 1. 迪安：Q3收入转正、毛利提升、利润高增、现金流稳健，医疗AI方向重点投入 2. 三诺：Q3利润端改善显著，CGM国内高增，海外拓展持续，AI小诺智能体赋能患者端提升粘性 3. 迈普：Q3收入+14%，利润端+18%，止血纱产品高增，脑机重点投入 4. 三鑫：Q3收入+15%，利润端+11%，高毛利湿膜透析器产品高增 5. 美好医疗：Q3收入+19%，利润端+16%，血糖线业绩高增，脑机卡位优势 风险提示：集采与价格治理超预期；设备招投标及装机不及预期；汇率波动；海外拓展与新品放量不及预期；新品注册不及预期；竞争加剧。#文字观点", "publish_time": "2026-10-23 10:53", "tags": ["文字观点"]}, "attachment:files/国泰海通证券-万凯新材(301216)首次覆盖报告：瓶片主业筑底，布局新材料开拓新增长极-261023.pdf": {"id": "attachment:files/国泰海通证券-万凯新材(301216)首次覆盖报告：瓶片主业筑底，布局新材料开拓新增长极-261023.pdf", "kind": "attachment", "title": "国泰海通证券-万凯新材(301216)首次覆盖报告：瓶片主业筑底，布局新材料开拓新增长极-261023", "source_label": "国泰海通证券", "excerpt": "请务必阅读正文之后的免责条款部分 股 票 研 究 公 司 首 次 覆 盖 证 券 研 究 报 告 股票研究 / [Table_Date] 2026.10.23 瓶片主业筑底 ，布局新材料开拓新增长极 万凯新材 (301216 ) [Table_Industry] 基础化工 /原材料 [Table_Invest] 首次覆盖 评级 增持 目标价格 (元): 17", "content": "请务必阅读正文之后的免责条款部分 股 票 研 究 公 司 首 次 覆 盖 证 券 研 究 报 告 股票研究 / [Table_Date] 2026.10.23 瓶片主业筑底 ，布局新材料开拓新增长极 万凯新材 (301216 ) [Table_Industry] 基础化工 /原材料 [Table_Invest] 首次覆盖 评级 增持 目标价格 (元): 17.38 [Table_CurPrice] 当前价格： (元) 14.76 [Table_Market] 交易数据 52周内股价区间 (元) 14.76 -30.98 总市值 (百万元 ) 8,564 总股本 /流通 A股(百万股 ) 580/544 流通 B股/H股(百万股 ) 0/0 [Table_Balance] 资产负债表摘要 (LF) 股东权益 (百万元 ) 6,582 每股净资产 (元) 11.34 日进行为期2周品质体系审核，公司非常有希望在11月 底第10包（T10）发包时获得项目；奔驰已于2026年9月正式拿到气囊+安全带业务并启动开发；特 斯拉中国区实验全部通过、资料已交北美团队评估，共研项目预计10月底立项，立项成功即可直接进 入供应商体系。 6.海外收入规划清晰、利润率显著优于国内：大众T10量产（2029年底）后安全带+气囊年销售额预 估约10亿元；斯兰蒂斯2029~2030年收入约12~13亿元；若大众、奔驰订单2030年量产，外资客 户收入可做到15~16亿元甚至接近20亿元。海外项目毛利率优异：奥迪E4项目约45%，特斯拉项目 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 35%~40%。客户倾向由中国直接供货（欧洲已建第三方仓库），北美由马来西亚工厂经墨西哥港供 货。 7.气体发生器自供打开气囊盈利空间：第一条产线2026年10月试生产，单线月产能约11万发； 2027年全年用量预估约600万个，计划明后年合计建成5条线、月产能达50万发。气体发生器可为 气囊贡献约7~8个百分点毛利率，火药资质完全落地后约10个百分点，气囊中长期毛利率有信心做到 30%以上；火药资质产线已投入，2026年底应可落地。 8.分业务毛利率展望：安全带2026年Q2~Q3毛利率约29%，对2027年维持30%以上有信心（支 撑来自新品发包定价更高、临山工厂自动化升级、斯兰蒂斯2027年收入预计约2亿元且毛利率近 40%）；气囊受益气体发生器自供，中长期看30%以上；方向盘当前约13%，通过安徽二期集中布 局、加热垫2027年全部自制、电子开关资质推进、HOD方向盘领先突破来改善盈利。 9.Q3收入增量与客户结构：Q3收入环比增量约1.5亿元，吉利约+4700万、奇瑞约+3300万、五菱 约+2300万、零跑/比亚迪/小鹏各约+1000万，6个客户合计贡献约90%增量，主要来自7~8月后气 囊、方向盘新项目量产放量。前五大客户为吉利、奇瑞、零跑、长城、理想，吉利与奇瑞各占约 25%、26%，合计约占营业额50%。 10.资本开支与分红策略：临山工厂260亩买地加基建投入6亿元、总投入约9亿元，目前几个工厂 剩余基建投入约3亿元，建成后可支撑2030年100亿营收目标，后续主要为设备产线投入。 2026~2027年为负重期，2027年下半年起进入\"轻装上阵\"阶段；资本开支大幅下降且稳定后将考虑提 高分红率、向高股息公司靠拢。 11.竞争格局与产品力：被动安全是汽车零部件中竞争格局最好的行业之一，公司在行业需求承压背景 下收入逆势高两位数增长，印证份额提升。对标奥托立夫，松原通过垂直一体化自产零配件，卖出一套 安全带等于同时卖出整套零配件，成本上可超越对手；行业主要玩家产品结构趋同、技术同质化，核心 比拼成本控制与利润率，竞争对手不会踩踏式亏本报价。 问答整理 Q1：公司2026年前三季度毛利率与净利率同比承压的主要原因是什么？四季度毛利率和净 利率环比改善的驱动因素是什么？ 答：前三季度毛利率同比承压主要来自四方面：一是客户年降约3个百分点，公司通过采购商务竞价、 内部改善稀释约1.5个百分点，净传导压缩约1.5个百分点；二是安徽基地126亩基地去年投产，厂房 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 及设备于去年底至今年转固，折旧摊销同比增加4800万元，影响毛利率约1.35个百分点；三是上半 年市场不及预期，前期组织与人员规模布置带来人效影响，叠加社保基数调整影响约0.3个百分点；四 是产品结构变化，高毛利安全带收入占比由约59%降至约50%，方向盘、气囊增速更快，影响约1个 百分点。综合看，前三季度毛利率同比下降4.96个百分点，其中客户返利及年降影响约2.9个百分点 （含为加快气体发生器在吉利、奇瑞、零跑、五菱等核心客户导入而适当让渡）、折旧摊销影响约 1.35个百分点、生产相关人力成本影响约0.86个百分点、产品结构影响约1.06个百分点，内部降本 增效提升约1.43个百分点。Q3环比Q2改善主要来自营业额逐步释放带来的规模效应，以及公司针对 上半年情况重新树立降本活动、对采购物料深入分析和工厂内部改善；预计Q4随营业额提升规模效应 释放更快。展望未来，对安全带毛利率维持30%以上有信心；Q3气囊毛利率约21%~22%，气体发生 器9月起在某一前五大客户量产导入并逐步推广至奇瑞、吉利、零跑，预计明年完成约50%导入，可 为气囊贡献约7~8个百分点毛利率，中长期气囊毛利率有望做到30%以上。 Q2：公司2026年海外客户及外资、合资客户拓展情况如何？大众、特斯拉、奔驰等重点客 户分别有哪些进展？ 答：大众集团方面，公司自2025年9月开始正式沟通，德国专家9月到松原考察技术和制造能力；10 月底回访欧洲奥迪并陆续拜访大众、斯柯达、西雅特等客户，行程约10天。2026年9月20日德国奥 迪采购VP到访考察，奥迪中国品质团队同步初审；VP回德国后一周内即启动对松原的品质审核系 统。进入壁垒较高，团队含在大众工作6年的项目经理和6年大众经验的工程师，累计拜访6次、每 次一周以上。奥迪中国质量团队将于2026年12月17~26日进行为期约2周品质体系审核。公司非常 有希望在11月底大众集团第10包（T10）发包时获得项目，该包约每两年一次、含至少5个以上品牌 车型，仅安全带月装车量不低于10万台。会议当天（10月22日）公司在安徽大众VCTC完成最后一 轮沟通，整体评价非常高，次日将正式向欧洲各品牌发出对松原的高评价邮件。奔驰方面，2026年5 月体系突破进入，9月正式拿到奔驰气囊+安全带业务，项目已启动开发。特斯拉方面，2025年9月 初开始沟通，2026年6月中国区全套实验结束、结果非常好，中国区技术团队批准通过，资料已交北 美技术团队评估；另一条共研项目路线预计10月底立项，立项成功后特斯拉将发包给公司，可直接进 入供应商体系。特斯拉品质、采购、技术团队已于2026年1月29日到余姚总部做体系+工厂预审 核。公司已有10个大众（含奥迪）项目在开发，其中2个已量产。 Q3：公司未来两年海外收入端有何规划、销售目标和增长幅度？ 答：基于大众集团第10包业务，公司计划2026年底拿到业务，定点约在发包后三个月（2027年2月 左右），开发周期约两年半，2029年底正式量产；仅承接T10业务，大众安全带加气囊海外业务量产 后的年销售额预估约10亿元。斯兰蒂斯方面，2026年上半年取得三个项目定点、金额合计接近30亿 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 元，叠加2024年取得的两个项目定点，预计2029~2030年收入约12~13亿元。若大众、奔驰订单 于2030年量产，外资客户收入有望做到15~16亿元至接近20亿元。大众集团除第10包外每月都有 新项目发放；2026年3月曾参与奥迪E4电动车（A4平台）报价，技术方案和价格获认可，但因德国 方面需以该项目抵扣对供应商停掉项目的索赔而未拿到；上周收到奥迪E6发包（A6对应电动平台）， 同步推进国家认可；国内奥迪Q5L项目同步做气囊报价。上述10亿元预估仅基于T10项目，后续仍 将持续承接大众其他发包。 Q4：公司海外项目及特斯拉项目的利润率水平如何，相比国内项目高出多少？海外客户是否 存在海外交货要求，公司海外工厂建设节奏如何？ 答：海外项目利润率较好，奥迪E4项目毛利率约45%。特斯拉方面已进行两轮报价，即使在国内竞争 激烈环境下，特斯拉项目毛利率仍可做到35%~40%，分产品有差异，插锁类产品毛利率更高。海外工 厂方面，欧洲大众最初要求海外建厂，公司报了欧洲建厂供货与中国直接供货两种价格，客户综合对比 后近期倾向不在欧洲建厂以降低自身成本压力。北美市场计划由马来西亚工厂供货至墨西哥港再运至北 美，马来西亚工厂作为北美供货基地；欧洲市场主要从中国国内直接供货。公司已在欧洲建立第三方仓 库，经近一年沟通，大众对第三方仓储和物流运输安排表示认可。 Q5：公司四季度收入展望如何？在10月批发零售同比降幅较大的背景下，是否已考虑行业整 体销量偏弱的预期？三季度收入环比加速增长的主要增量和客户拆分如何？ 答：公司每月滚动预测。10月截至近期客户装车产值约2.3亿元，前一周因国庆假期装车量较低，最 近一周单日装车产值约1300万元，预计10月底保守可做到3.8亿元。尽管国内零售数据偏弱，但公 司产品油车、电车、内销、出口均适用，且市场份额仍较低，主要通过存量市场获取新订单、新客户、 新项目实现增长，主机厂零售波动影响相对有限。根据客户滚动预测，11、12月营收预计分别约 4~4.2亿元，Q4整体营收预计约12亿元。Q3收入环比提升约1.5亿元，主要增量来自吉利约4700 万元、奇瑞约3300万元、五菱约2300万元，零跑、比亚迪、小鹏各约1000万元左右，上述6个客 户合计贡献增量约1.3~1.4亿元、占总增量约90%，主要受益于7、8月以来气囊和方向盘新项目量 产。Q3净利率接近10个点，主要因7、8月单月营业额仅约2.2~2.4亿元；9月单月营业额提升至约 3.4~3.5亿元，单月利润率回升至约12个点。预计Q4收入11~12亿元较有信心，单月收入约4亿元 时毛利率和净利率将明显提升。2027年整体收入约45亿元、保持30%以上增速，全年利润率按12% 左右中性预估；中长期2030年营收突破100亿元目标不变，当前剩余基建投入约3亿元，后续主要投 入为设备产线。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q6：如果明年行业需求不出现大幅下滑但也没有大幅增长，公司是否会再次出现额外的年降 压力？公司与整车厂交流中年降的态度如何？ 答：年降每年都会存在，仅程度不同。公司所在被动安全赛道存在一定专业壁垒，年降幅度不会出现无 底线的异常情况。公司通过内部改善消化吸收相关影响，近2~3年年降对利润影响约1~2个百分点， 均已通过内部改善吸收。随着明年产能释放、收入规模做到约45亿元，规模效益将体现得更明显，可 抵消年降影响；从Q3、Q4相较Q2的变化看，已明显感受到规模效益的体现。 Q7：公司三季度和四季度利润率提升除出货量增加外，是否还有产品升级逻辑？单车价值量 和单品价格提升的空间如何？ 答：汽车行业普遍存在老产品持续年降、新产品以新项目重新定价的规律，新项目毛利可从新起点保 持。随着高端方向盘、ACOD方向盘、加热方向盘等产品增加，单品价值可提升至200多元、300多 元甚至400元，毛利率水平也相对更高。气囊产品今明两年逐步投入后将增加盈利水平。公司还在预 研电动安全带、小型安全带等产品并与客户共研，具备一定领先性，前期市场定价将好于普通产品。公 司持续通过产品升级换代和技术领先提升产品单价及项目单车价值。 Q8：公司2026年三季度前五大客户收入及占比情况如何？ 答：Q3前五大客户整体变化不大，主要为吉利、奇瑞、零跑，另有长城和理想。吉利和奇瑞收入占比 各约25%、26%，合计约占公司营业额50%。由于统计口径较多，未对产品在客户出口车型中的占比 进行详细拆分。 Q9：公司大客户吉利和奇瑞出口车型收入占公司收入比例如何？国内与出海车型的下单价格 是否完全一样？ 答：项目定点时国内外项目价格可能并不一样；若车辆在国内采购零部件后同时面向国内和海外销售， 对供应商的供货价格通常一致；若要求公司直接将产品送至海外，价格则会不同。出口车型受各国法规 要求不同影响，对产品配置和性能要求也不同。若产品结构完全相同，国内和海外价格体系一致；若出 口产品因法规和性能要求发生结构性变化，定价会有所不同。通常出口欧洲等法规要求更高的地区，对 产品性能要求更高，价格也高于国内同类产品。 Q10：公司后续资本开支下降、利润稳定后，分红策略是否会有变化？ 答：近几年是公司产能投入大年，临山工厂260亩土地购地和基建投入为6亿元，总投入约9亿元， 支出主要集中在土地和基建。第二个五年计划目标收入做到100亿元，因此过去几年做了较多产能前 置投入。当资本开支逐步稳定、厂房土地等投入下降后，后续投入将主要集中于产线设备、金额较小。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 该阶段稳定后，公司将考虑提高分红率，并尽量向高股息公司特征靠拢；但当前资本开支较大阶段，提 高分红尚不现实。 Q11：公司产品与奥托立夫在产品及性能上是否存在差异？公司通过哪些流程或质量体系控制 提升产品质量？ 答：奥托立夫产品主要追求性价比，并非在性能上做到极致；原先日本高田的产品性能实际上优于奥托 立夫。奥托立夫具备优化设计、提升性能的能力，但过高性能意味着较高成本，因此其整体成本控制较 好。松原的核心差异在于垂直一体化布局，安全带零部件自制，销售安全带的同时带动零部件销售；而 奥托立夫更多赚取安全带的组装费用，零部件成本留在供应商端。公司通过垂直一体化可在安全带领域 超越奥托立夫，且客观上奥托立夫安全带产品设计技术难度并不高。海外客户如德国大众对技术要求严 格，已审核过公司产品结构、实验结果及量产车型性能表现，认为公司在产品设计上与奥托立夫不存在 差异。目前安全带行业主要参与者奥托立夫、均胜、松原、延锋的产品结构接近、原理相近，核心竞争 在于更好的成本控制和利润率水平。 Q12：公司气体发生器自供比例目前达到什么水平？明年气囊毛利率较今年预计有多大提升空 间？ 答：气体发生器第一条产线已 答：金属碳基复合材料结合了金属针的力学性能与薄膜的电学性能，主要应用于芯片测试环节。核心特 性为可重复使用，并支持直接在晶圆上进行测试。该产品属于耗材，因测试过程中探针会因接触和通电 产生磨损，达到一定磨损程度后需更换。在芯片测试流程中，该材料主要用于建立芯片与测试机台之间 的电性连接：通过接触芯片焊盘点，将测试机台信号传输至芯片内部，同时将芯片反馈信号回传至机 台，从而完成功能检测。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q5：公司的金属碳基复合材料产品在市场上的定位和竞争策略是什么？ 答：公司市场定位为成为国内主要的金属碳基复合材料供应商之一。竞争策略核心在于产品性能与成本 控制，通过自主研发提供性能稳定且具有成本优势的产品，以满足国内客户需求并逐步占据重要市场份 额。公司正积极推进新项目并与潜在大客户接触，目前已有项目处于送样测试阶段，等待客户结果反 馈，同时持续进行市场拓展以获取更多客户认可与订单。 Q6：在新一代产品中，是否确定采用了石墨烯垫片方案？该领域的竞争格局如何，特别是国 内的竞争对手以及海外企业（例如汉高）是否也涉足此业务？目前的供应情况是怎样的？ 答：目前可确认新一代产品中已确定采用石墨烯垫片方案。竞争格局方面，国内存在部分竞争对手，但 技术上与鸿富诚存在一定差距；海外主要竞争者为汉高，但汉高并未直接生产石墨烯垫片，而是采取采 购石墨烯原材料后加工成垫片产品的模式。在此模式下，汉高既是鸿富诚的客户（采购鸿富诚原材 料），又是竞争对手（在垫片产品层面）。由于鸿富诚掌握从原材料到最终产品的一体化生产能力，因 此具备技术与成本优势。供应方面，今年下半年公司已开始向客户小批量供货，预计明年随着客户需求 增长，供应量将显著提升、市场份额相应扩大；尽管明年公司可能占据较大市场份额，但预计仍会有其 他供应商进入并分占部分市场空间。 Q7：三季度利润环比下降的原因是什么？ 答：三季度利润环比下降属正常情况，主要原因是公司在六月至八月期间进行了产线调试，以应对三季 度末及四季度的订单需求。公司大额订单于九月下旬下达，产能亦于此时完全释放。 Q8：如果明年RubinUltra项目也确定采用公司的石墨烯垫片方案，相较于Rubin，其单机 柜或单芯片对应的价值量趋势如何？若同样以10万个机柜的需求量计算，RubinUltra项目 能带来的价值量大约是多少？ 答：RubinUltra的单机价值量将有所提升。价值提升原因在于，虽然机柜数量可能相似，但Rubin Ultra方案中使用了面积更大、性能更优的垫片。不过，关于明年的具体方案选择目前仍存在不确定 性，因此该预测相对保守。 Q9：除了英伟达之外，公司在客户拓展方面有何新进展或计划？ 答：公司主要收入来源集中于英伟达与AMD等几大客户。除上述两家外，公司也在积极拓展其他客 户，例如交换机领域客户。在国内市场，公司与腾讯等企业保持交流，并接触过浙江文建及部分金融领 域客户。不过在2025年之前，公司在这些领域的投入相对有限。预计今年和明年的订单增长将主要来 源于国内客户。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q10：在产品品类拓展方面，公司是否有向热管理等其他方向发展的计划？ 答：目前没有向热管理等其他领域拓展的计划。公司核心业务仍聚焦于现有产品线，并计划在现有基础 上进行调整与优化。 Q11：如果在GPU上采用微通道盖板，是否还需要使用TIM材料，例如石墨烯导热垫片？ 答：在GPU采用微通道盖板的方案中，仍需使用焊接材料，具体而言需要一层TIM材料。下一代产品 预计将由模组厂商而非台积电负责制造，届时仍会用到此类焊接材料。 Q12：公司是否涉足导热凝胶业务？下游客户主要是哪些，以及该业务的盈利能力如何？ 答：公司今年开始涉足导热凝胶业务，此为全新立项项目。该业务能够实现盈利，但利润空间相对较 小。 Q13：公司的导热凝胶产品是否属于第二梯队？如果是，主要原因是性能问题还是因为该技术 本身并非散热主流方案？ 答：公司产品并非性能不佳。在材料领域，能否进入客户供应链，性能是决定性因素，必须达到客户要 求，不存在性能不足却仍能获得订单的情况。产品成功导入的关键在于能否满足客户的性能标准。 原文 国内散热材料大厂：Rubin和RubinUltra单机价值量 一、Rubin系列散热材料价值量与技术路线主持人：请介绍鸿富诚的 因此该预测相对保守。 八、非英伟达客户拓展进展主持人：除了英伟达之外，公司在客户拓展方面有何新进展或计划？ 鸿富诚：公司主要收入来源集中于英伟达与AMD等几大客户。除上述两家外，公司也在积极拓展其他 客户，例如交换机领域客户。在国内市场，公司与腾讯等企业保持交流，并接触过浙江文建及部分金融 领域客户。不过在2025年之前，公司在这些领域的投入相对有限。预计今年和明年的订单增长将主要 来源于国内客户。 九、热管理领域拓展计划主持人：在产品品类拓展方面，公司是否有向热管理等其他方向发展的计划？ 鸿富诚：目前没有向热管理等其他领域拓展的计划。公司核心业务仍聚焦于现有产品线，并计划在现有 基础上进行调整与优化。 十、微通道盖板方案下的TIM材料需求主持人：如果在GPU上采用微通道盖板，是否还需要使用 TIM材料，例如石墨烯导热垫片？ 鸿富诚：在GPU采用微通道盖板的方案中，仍需使用焊接材料，具体而言需要一层TIM材料。下一代 产品预计将由模组厂商而非台积电负责制造，届时仍会用到此类焊接材料。 十一、导热凝胶业务发展现状与盈利能力主持人：公司是否涉足导热凝胶业务？下游客户主要是哪些， 以及该业务的盈利能力如何？ 鸿富诚：公司今年开始涉足导热凝胶业务，此为全新立项项目。该业务能够实现盈利，但利润空间相对 较小。 十二、导热凝胶产品梯队定位与导入逻辑主持人：公司的导热凝胶产品是否属于第二梯队？如果是，主 要原因是性能问题还是因为该技术本身并非散热主流方案？ 鸿富诚：公司产品并非性能不佳。在材料领域，能否进入客户供应链，性能是决定性因素，必须达到客 户要求，不存在性能不足却仍能获得订单的情况。产品成功导入的关键在于能否满足客户的性能标准。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-23T13-00:8ccd12099689": {"id": "post:2026-10-23T13-00:8ccd12099689", "kind": "post", "title": "2026-10-23 13:00", "source_label": "帖子正文", "excerpt": "下周地缘博弈加剧，军贸避险机会凸显20261023 ———————— 以色列大选、美国中期选举即将进入关键阶段，美以伊三方博弈持续加剧，市场避险情绪升温。军贸板块近期受航展催化关注度高，地区军事冲突持续抬升行业景气度与订单兑现预期，根据近期调研路演反馈，科技资金开始增配军贸，我们认为目前军贸板块仍有", "content": "下周地缘博弈加剧，军贸避险机会凸显20261023 ———————— 以色列大选、美国中期选举即将进入关键阶段，美以伊三方博弈持续加剧，市场避险情绪升温。军贸板块近期受航展催化关注度高，地区军事冲突持续抬升行业景气度与订单兑现预期，根据近期调研路演反馈，科技资金开始增配军贸，我们认为目前军贸板块仍有上涨动能。 以色列议会大选将于10月27日开启，根据《耶路撒冷邮报》10月21日汇总的多频道民调数据，内塔尼亚胡当前选情处于不利局面。虽然内塔尼亚胡持续渲染伊朗威胁，试图依靠安全议题拉拢右翼选民，但当前民调结果显示该策略拉动选票效果有限，选举最终大概率会进入悬浮议会，后续组阁谈判难度较大。 美国定于11月3日举行中期选举，预测市场Polymarket的交易隐含概率显示，民主党拿下众议院控制权的概率约91%-92%，拿下参议院控制权概率约64%-65%，具备过半胜率。众议院控制权门槛为218席，民主党仅需要小幅净增席位即可翻转；参议院层面由于共和党当前手握53席，且本次共和党防守席位更多，选情相比众议院更为焦灼。 随着以色列大选临近，市场持续关注美以是否会在下周推出针对伊朗的新动作，央视新闻10月22日援引美国知情官员消息，美以军方已经制定中期选举结束之后对伊朗实施高强度打击的预案，打击目标覆盖伊朗核设施、能源基础设施、导弹无人机仓库，虽然特朗普公开表态选前暂不发起打击，但以色列仍然存在独立行动的可能性。面对持续的军事威胁，伊朗方面表态强硬，新华网消息显示伊朗高层多次警告，任何针对伊朗本土的军事冒险，都会迎来远超以往强度的反击。 全球资本市场避险情绪显著升温，10月22日美股交易时段纳斯达克100指数最大跌幅扩大至3%，核心驱动是AI资本开支回报担忧叠加中东地缘冲突带来通胀与利率上行预期，资金主动降低高估值成长股仓位进行避险操作。在各大赛道当中，军贸板块拥有明确的航展和地缘事件催化，局势紧张抬升海外国家防空装备、无人机、导弹等武器采购预期，板块逻辑从单纯情绪炒作逐步向海外订单兑现切换。根据路演反馈，上周起机构资金开始关注军贸，本周机构仓位配置逐步增加，尤其是科技资金将军贸视作避险板块，目前科技仓位仍然较高，在避险情绪催化下，我们认为仍有增量资金配置军贸的空间，目前板块仍具备上涨动能。 反无：锐科激光、四川九洲、新光光电 军机：洪都航空、中航沈飞、中航成飞 雷达：国睿科技、航天南湖 无人机：洪都航空、中无人机 弹药：国科军工、长城军工 地面：内蒙一机、光电股份#文字观点", "publish_time": "2026-10-23 13:00", "tags": ["文字观点"]}, "attachment:files/上海证券-计算机行业周报：大模型竞争加剧，国产算力验证景气度-261022.pdf": {"id": "attachment:files/上海证券-计算机行业周报：大模型竞争加剧，国产算力验证景气度-261022.pdf", "kind": "attachment", "title": "上海证券-计算机行业周报：大模型竞争加剧，国产算力验证景气度-261022", "source_label": "上海证券", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业深度 海外REITs市场增配资金多元，国内对 照路径渐明——REITs全球视野系列（一） 核心观点 制度与工具完善拓宽资金来源，关注稳健分派与经营修复机会。 C-REITs供给持续扩容，资金端建设需同步推进。美日经验表明， 放宽投资约束有助于扩大配置型资金参与，外资活跃交易影响边 际定价，指数工具则拓宽机构与居民的配置渠道。国内可分阶段 释放险资、理财及居民需求，逐步完善社保养老参与机制和跨境 渠道，引导资金承接能力随供给扩容提升；在相关条件逐步落地 的情景下，测算长期配置规模约9100亿元。机构间REITs较低 的收益水平反映资产荒下的配置需求，当前公募 REITs估值已具 备吸引力。建议以保租房、市政环保及数据中心等分派稳健的资 产构筑底仓，关注部分仓储物流及高速公路的经营修复机会。 摘要 C-REITs资产供给迈入新阶段，资金来源与配置渠道亟待新变 量。截至2026年9月，89只上市REITs总市值约2305亿元， 资产覆盖商业不动产、能源、交通等主要类型。国内主要机构持 有人仍集中于原始权益人、产业资本、券商及保险；相较美日以 基金、资管和信托账户间接配置为主，资金准 入、产品工具和跨 境渠道仍有拓展空间。 海外配置型资金：投资约束放宽扩大 REITs配置需求，逆周期 增持增强市场承接。 美国养老金持股约束放宽后，持有占比由 1993年约12%升至1998年约30%；日本央行2010—2022年累 计买入约341亿元J-REIT，并在市场承压阶段加大购入。 海外交易型资金：外资增配承接 J-REIT扩容，活跃交易影响边 际定价。2004—2007年，外资持有占比由约 10%升至29%；2025 年交易金额占比约52%， 显著高于同年8月约23%的持有市值占 比。外资兼具配置与交易属性，跨境渠道有助于拓宽资金来源并 增强二级市场流动性。 配置工具：指数产品降低 REITs组合投资门槛，ETF拓宽机构 配置渠道。2015—2025年，J-REIT ETF规模由0.34万亿日元增 至2.52万亿日元，银行持有规模由 0.19万亿日元增至1.24万亿 日元，并于2021年超过直接持有规模。宽基 ETF承载近九成市 场规模，场外指数基金形成渠道补充；国内可优先培育宽基核心 产品，覆盖不同投资者需求。 海外经验借鉴：分阶段拓宽资金来源，低估值布局确定性与修复 弹性。短期险资投资规则完善、公募参与扩围及指数工具发展， 中长期逐步拓宽社保养老及境外资金渠道，引导资金承接能力随 供给扩容提升，测算长期C-REITs配置规模约9100亿元。机构 间REITs较低的收益水平反映稳定收益资产的配置需求， 当前公 募产权类REITs平均现金分派率约4.7%，具备一定配置吸引力。 建议以保租房、市政环保及数据中心等确定性资产构筑底仓，兼 顾仓储物流及部分高速公路的经营修复弹性。 维持 强于大市 黄啸天 huangxiaotian@csc.com.cn S 800G多模Driver/TIA为当前基本盘，2026年交付量预计400万至500万颗：公司核心业务聚 焦400G/800G的100G/lane多模Driver与TIA，约占多模市场40%份额；单模TIA今年交付仅约 100万颗，单模市场90%以上由Semtech和Marvell占据。多模月出货量在二三十万至七八十万颗之 间波动。 2.1.6TDriver已量产并配套NVIDIADSP方案，2026年订单近200万颗：Marvell和Broadcom 的1.6TDSP均集成Driver，公司1.6TDriver主要配套NVIDIA方案，对应约100万个1.6T光模 块，下半年需求高于上半年；2027年计划交付500万至600万颗。 3.200GPD是2026-2027年最大增长引擎，产能规划翻倍以上：当前月交付约1000万至1500万 颗，2026年底目标月产能提升至约3000万颗、全年交付约1亿颗；2027年计划年产能提升至3亿颗 以上，为2027财年收入增长最大贡献来源。 4.1.6TTIA进度落后，送样测试中：目前在新易盛和旭创送样测试，若2026年Q4测试顺利，预计 2027年Q1-Q2获订单；若需版本迭代则可能推迟半年。200GTIA自2025年3月送样以来已迭代四 个版本，仍存问题，落后于Semtech（已通过主要客户测试并获批量订单）。 5.CWLaser具备七至八成放量确定性，瓶颈在磷化铟产线产能：75mW和100mW规格已在旭创、 新易盛等客户获良好测试反馈，但磷化铟产线产能不足导致无法承接大批量订单；前提是优先保障 200GPD产能稳定，放量首年目标500万至800万颗。 6.1.6T产品价值量显著提升：1.6TDriver单颗ASP10至15美元（800G为4至6美元），单模块 用两颗约20美元；1.6TTIA单颗约15美元、单模块两颗；200GPD单价约2美元、单模块八颗总成 本15至16美元；1.6TDSPASP100至120美元。 7.Google2.4TCoherentLite项目确定性高，2027年下半年量产：2027年需求约200万只， 2028年增至千万只以上，搭配TPUv8/v9；DSP方案已确定Marvell（含DSP+Driver+TIA）与 Celero（搭配Macom的Driver/TIA）两家，均在InnoLight、Coherent处前期测试。技术门槛高于 PAM4，开发周期至少一年（PAM4约半年）。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 8.NPO与3.2T为2027年潜在增量：NPO产品尚处开发阶段、未向CSP送样，但Driver/TIA方案 已进入旭创、新易盛及菲尼萨的前期NPO样品；NVIDIA预计2027年NPO需求1000万至1600万 颗，公司方案已包含NV的3.2T需求；Amazon原预计800万至1000万颗需求或因Trainium4推 迟而延后。 9.其他产品线：ACCLinearEqualizer与相干Driver/TIA：LinearEqualizer配合Google下一代 TPUv8机架ACC铜缆方案，处导入验证阶段，预计2027年Q1-Q2起量；相干产品2026年 400G/800G合计发货约150万个，但价值量极高（400GZR一套Driver+TIA超100美元，800G ZR超200美元）。 10.TIA整体市场空间约20亿美元，电信业务增长缓慢：800G、1.6T及NPO场景下TIA市场规模 约20亿美元；电信业务为运营商基站提供射频器件，年增长维持个位数；工业与国防业务近两年受益 于美国军工项目拉动，增长良好。 问答整理 Q1：与三个月前相比，当前数据中心市场在订单执行和需求方面有何变化？800G（单模、多 模）和1.6T产品的交付情况、2026年三四季度的执行情况及2027年需求展望如何？ 答：800G电芯片方面，公司主要提供多模Driver和TIA。单模Driver通常由DSP集成，单模TIA市 场主要由Semtech和Marvell占据，份额超过90%。公司今年单模TIA交付量预计仅约100万颗， 主要用于个别项目。核心业务聚焦400G和800G的100G/lane多模Driver与TIA，预计2026年全 年交付400万至500万颗，约占多模市场40%份额。多模市场主要有两种成熟方案：Marvell全套方 案，以及Broadcom的DSP搭配公司Driver和TIA。近几个月多模需求稳定，月出货量在二三十万颗 至七八十万颗之间波动。800G光芯片方面，公司已不涉足100G/lanePD，100GEML亦无市场份 额。1.6T方面，公司近期已实现1.6TDriver量产，主要配套NVIDIA的DSP方案；Marvell和 Broadcom的1.6TDSP均集成Driver。2026年NVIDIA已下达近200万颗Driver订单，对应100 万个1.6T光模块，下半年需求高于上半年。1.6TTIA尚处样品测试阶段，Marvell和Semtech进展更 快。1.6T光芯片核心产品为200GPD，2026年是产能爬坡关键阶段，上半年交付较少，当前月交付 约1000万至1500万颗，目标年底月产能提升至约3000万颗，力争2026年全年向所有客户总计交 付约1亿颗。 Q2：基于当前市场情况，公司对2027年的产品交付和产能有何具体规划？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：2027年业务重心主要围绕1.6T产品线。1.6TDriver方面，根据NVIDIA需求预测，计划2027 年全年交付500万至600万颗。200GPD方面，计划将年产能提升至3亿颗以上，较2026年1亿颗 交付目标增长超过两倍，为既定扩产计划。1.6TTIA正在新易盛和旭创送样测试，若2026年Q4测试 顺利，预计2027年Q1或Q2开始获订单；若测试不顺需版本迭代，可能推迟半年发布。CWLaser 预计2027年放量，75mW和100mW规格今年已在旭创、新易盛等主流客户处获良好测试反馈，主 要瓶颈在于磷化铟产线产能不足，未能承接大批量订单；若明年产线产能释放，将带来新的收入增长 点。 Q3：CWLaser业务2027年成功放量的确定性有多大？预计能达到怎样的规模？ 答：CWLaser放量具备七成至八成的确定性。前提是必须优先确保200GPD产能稳定，因为许多客 户已锁定公司直至2027年底的PD产能。只要PD产能稳定达到年产3亿颗以上目标，公司即可调配 资源推进CWLaser生产。放量首年若实现500万至800万颗交付量，即为较为理想的开端。 Q4：请介绍数据中心光模块中各类芯片的单价情况，特别是800G和1.6T产品中的 Driver、TIA、PD和DSP？ 答：800G产品中，单颗Driver和TIA单价约4至6美元，单个模块需两颗Driver和两颗TIA，该部 分组件在光模块BOM成本中占比约10%至15%。800GPD竞争充分、价格透明，单通道单价0.3至 0.4美元，8通道800G模块中PD总成本约3美元。800GDSP单价约40至50美元。1.6T产品中各 类芯片价值量显著提升：单颗Driver价格翻倍，无论200G/lane硅光Driver还是EMLDriver，ASP 均在10至15美元之间，单模块两颗总价约20美元；1.6TTIA目前由Marvell与DSP绑定独家供 应，单颗约15美元，单模块同样两颗；200GPD单价约2美元，单模块八颗，总成本15至16美 元；1.6TDSP的ASP在100至120美元之间。 Q5：除了Driver、TIA和PD，公司在数据中心领域还布局了哪些其他产品线？ 答：还包括用于ACC（有源铜缆）的LinearEqualizer，目前与Semtech合作较好，尚未大规模放 量，正处于Google导入验证阶段，将配合Google下一代TPUv8机架中的ACC铜缆互联方案，预 计2027年Q1或Q2正式起量。此外，公司在相干光模块领域拥有传统优势产品相干Driver和TIA， 相干市场本身规模有限，预计2026年全年400G和800G相干产品总发货量约150万个，但价值量极 高：一套用于400GZR模块的Driver和TIA价值超过100美元，800GZR一套超过200美元。 Q6：基于当前产品布局和市场需求，公司2027财年收入增长的主要驱动力来自哪些业务？ 答：根据预估，2027财年整体收入增长最大贡献来自200GPD产品，其次1.6TDriver亦是增速较快 的产品线。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Q7：公司其他业务板块，如电信、工业与国防在2027财年的增长前景如何？ 答：电信业务增长预计较为缓慢，主要为运营商基站提供射频器件，受近年来运营商硬件投资保守影 响，年增长率基本维持个位数水平，远不及数据中心业务的翻倍式增长。工业与国防业务近两年增长态 势良好，主要受益于美国部分军工项目拉动。 Q8：从时间节奏上看，公司业务在2026年下半年及2027年将呈现怎样的放量趋势？有哪些 关键的新产品或项目值得关注？ 答：2026年Q3、Q4业务加速的主要驱动力是PD产品放量。2027年有几个关键增长点：首先是 2.4T的CoherentLite项目，这是全新增量市场，对公司至关重要；其次是NPO产品放量，NPO目 前尚处开发阶段且未向CSP送样，但公司Driver和TIA方案已进入旭创、新易盛及菲尼萨等厂商的前 期NPO样品中，NVIDIA预计2027年对NPO有1000万至1600万颗需求，NV的3.2T需求公司方 案已包含在内，若顺利放量将是重大利好；原先预计Amazon也有800万至1000万颗需求，但由于 其Trainium4项目可能推迟，该部分需求或将延后。 Q9：Google的2.4TCoherentLite项目何时放量？该项目的确定性如何？ 答：该项目已经非常确定，计划于2027年下半年实现量产。Google已明确将在其下一代数据中心网 络（OCS组网）中导入CoherentLite技术，采用OCS作为spine直接连接rack，显著减少中间层架 构复杂度。 Q10：CoherentLite项目的总体需求量、产业链准备情况以及技术门槛如何？ 答：需求方面，该项目预计2027年需求量为200万只，2028年将增长至千万只以上，主要与TPU v8和v9搭配使用。产业链方面，目前正在评估OCS以及CoherentLite光模块的开发与交付进度能 否满足2027年量产计划。技术门槛方面，CoherentLite光模块技术难度高于PAM4模块，开发周期 也更长：通常800G或1.6T的PAM4模块开发周期约半年，而CoherentLite模块至少需要一年时 间。 Q11：CoherentLite项目中的DSP芯片供应商方案是怎样的？ 答：目前已确定两家DSP供应商方案。第一家是Marvell，其方案将包含DSP、Driver和TIA；第二 家是硅谷初创公司Celero（由Google投资），其方案将搭配Macom的Driver和TIA。目前两个方 案都已在模块商（如InnoLight、Coherent）处进行前期测试。 Q12：TIA产品的市场空间有多大？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：经测算，800G、1.6T及NPO应用场景下的TIA整体市场规模约为20亿美元。目前行业内该代 TIA做得较好的是Marvell和Semtech，其产品已实现批量生产。公司TIA产品进度相对落后，目前 仍在测试阶段，若一切顺利，预计能在2027年Q2实现批量生产，将为数据中心业务带来显著收入增 长。 Q13：公司200GTIA产品的开发迭代情况以及与行业主要竞争对手的进度对比是怎样的？ 答：公司200GTIA产品早在2025年3月就已送样，但由于存在一些问题，至今已迭代四个版本，目 前测试中仍发现问题。相比之下，竞争对手Semtech尽管其TIA产品也经历多次迭代，但内部迭代速 度更快，目前已在主要客户处通过测试并获得批量订单。不过根据从InnoLight等客户处获得的信息， Semtech当前这一代TIA在某些应用场景下仍存在缺陷，可能还需改进。总体而言，Semtech进度快 于公司，但双方均面临持续优化的挑战。 原文 光电芯片调研_26_27年200GPD出货目标和产能规划光电芯片调研纪要：聚焦2026至2027年 200GPD出货目标与产能规划、1.6TDriver及CWLaser加速放量、1.6TTIA客户导入节点、谷歌 CoherentLite项目量产时间表与需求展望，以及NPO与3.2T新产品布局下Driver/TIA价值量提升 趋势。调研核心涵盖Marvell、Semtech、博通、英伟达、旭创与新易盛等产业链关键环节。 会议议题涵盖：800G与1.6T光芯片及电芯片需求与价格趋势；200GPD扩产及新产品量产进展； Google2.4TCoherentLite项目部署规划与NPO、3.2T等下一代光互连技术研发商业化进展；公司 业务增长及竞争格局展望。 一、800G与1.6T电芯片及光芯片需求交付现状主持人：与三个月前相比，当前数据中心市场在订单 执行和需求方面有何变化？具体到800G（单模、多模）和1.6T产品的交付情况，2026年第三、四季 度的执行情况以及对2027年需求的展望如何？ 专家：关于800G电芯片，公司主要提供多模Driver和TIA。单模Driver通常由DSP集成，而单模 TIA市场主要由Semtech和Marvell占据，份额超过90%。公司今年单模TIA交付量预计仅约100 万颗，主要用于个别项目。公司核心业务聚焦于400G和800G的100G/lane多模Driver与TIA，预 计2026年全年交付量可达400万至500万颗，约占整个多模市场40%的份额。目前多模市场主要有 两种成熟方案：一是Marvell的全套方案，二是Broadcom的DSP搭配公司的Driver和TIA。近几 个月多模产品需求保持稳定，月出货量在二三十万颗至七八十万颗之间波动。 在800G光芯片方面，公司已不涉足100G/lanePD，在100GEML领域亦无市场份额。在1.6T产品 方面，公司已于近期实现1.6TDriver量产，主要配套NVIDIA的DSP方案。Marvell和Broadcom wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 的1.6TDSP方案均集成了Driver。2026年NVIDIA已下达近200万颗Driver订单，对应100万个 1.6T光模块，且下半年需求将高于上半年。1.6TTIA产品目前尚处于样品测试阶段，Marvell和 Semtech在该领域进展更快。 针对1.6T光芯片，核心产品为200GPD。2026年是产能爬坡的关键阶段，上半年交付量较少。当前 月交付量约为1000万至1500万颗，目标是年底将月产能提升至3000万颗左右，力争2026年全年 向所有客户总计交付约1亿颗。 二、2027年产能规划与核心产品线展望主持人：基于当前的市场情况，公司对2027年的产品交付和 产能有何具体规划？ 专家：2027年的业务重心将主要围绕1.6T产品线展开。首先，在1.6TDriver方面，根据NVIDIA的 需求预测，公司计划2027年全年交付500万至600万颗。其次，对于200GPD，公司计划将年产能 提升至3亿颗以上，相较于2026年1亿颗的交付目标，增长超过两倍，这是一项既定的扩产计划。 此外，公司的1.6TTIA产品正在新易盛和旭创进行送样测试。若2026年第四季度测试进展顺利，预 计将在2027年第一或第二季度开始获得订单；若测试不顺需进行版本迭代，则可能推迟半年发布。最 后，公司的CWLaser产品预计也将在2027年实现放量。75mW和100mW规格的产品今年已在旭 创、新易盛等主流客户处获得良好测试反馈。目前的主要瓶颈在于磷化铟产线产能不足，导致未能承接 大批量订单。若明年该产线产能得以释放，CWLaser业务将为公司带来新的收入增长点。 主持人：对于CWLaser业务，其在2027年成功放量的确定性有多大？预计能达到怎样的规模？ 专家：CWLaser业务的放量具备七成至八成的确定性。其前提是必须优先确保200GPD的产能稳 定，因为许多客户已锁定公司直至2027年底的PD产能。只要PD产能能够稳定达到年产3亿颗以上 的目标，公司即可调配资源推进CWLaser的生产。在放量首年，若CWLaser能实现500万至800 万颗的交付量，即为较为理想的开端。 三、芯片单价结构与BOM成本分析主持人：请介绍一下数据中心光模块中各类芯片的单价情况，特别 是800G和1.6T产品中的Driver、TIA、PD和DSP？ 专家：在800G产品中，单颗Driver和TIA的单价约为4至6美元。由于单个模块需使用两颗 Driver和两颗TIA，这部分组件的成本在光模块BOM成本中占比约为10%至15%。800GPD市场 竞争充分且价格透明，单通道单价为0.3至0.4美元，因此一个8通道800G模块中PD的总成本约 为3美元。800GDSP单价约为40至50美元。 在1.6T产品中，各类芯片的价值量显著提升。单颗Driver的价格翻倍，无论是200G/lane硅光 Driver还是EMLDriver，其ASP均在10至15美元之间，单个模块使用两颗Driver的总价约为20 美元。1.6TTIA目前由Marvell与DSP绑定独家供应，价格较高，单颗约为15美元，单个模块同样 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 需要两颗。200GPD的单价约为2美元，单个模块使用八颗，总成本在15至16美元。1.6TDSP的 ASP则在100至120美元之间。 四、其他产品线布局与收入驱动因素主持人：除了Driver、TIA和PD，公司在数据中心领域还布局了 哪些其他产品线？ 专家：公司在数据中心领域的产品线还包括用于ACC（有源铜缆）的LinearEqualizer。该产品目前公 司与Semtech合作较好，但尚未大规模放量，正处于Google的导入验证阶段。该产品将配合 Google下一代TPUv8机架中的ACC铜缆互联方案，预计在2027年第一或第二季度正式起量。此 外，公司在相干光模块（CoherentLiteModule）领域拥有传统优势产品，即相干Driver和TIA。尽 管相干市场本身规模有限，预计2026年全年400G和800G相干产品总发货量约为150万个，但其 产品价值量极高。例如，一套用于400GZR模块的Driver和TIA价值超过100美元，用于800GZR 模块的一套则超过200美元。 主持人：基于当前的产品布局和市场需求，公司对2027财年的收入增长主要的增长驱动力来自哪些业 务？ 专家：根据预估，公司2027财年的整体收入增长最大贡献将来自200GPD产品，其次1.6TDriver 亦是增速较快的产品线。 主持人：公司其他业务板块，如电信、工业与国防在2027财年的增长前景如何？ 专家：电信业务增长预计较为缓慢，主要为运营商基站提供射频器件。受近年来运营商硬件投资保守影 响，该业务板块年增长率基本维持在个位数水平，远不及数据中心业务的翻倍式增长。工业与国防业务 近两年增长态势良好，主要受益于美国部分军工项目拉动。 五、2026下半年至2027年放量节奏与下一代技术布局主持人：从时间节奏上看，公司业务在2026 年下半年及2027年将呈现怎样的放量趋势？有哪些关键的新产品或项目值得关注？ 专家：2026年第三、四季度业务加速的主要驱动力是PD产品的放量。展望2027年，有几个关键增 长点。 首先是2.4T的“CoherentLite”项目，这是一个全新的增量市场，对公司至关重要。其次是NPO产 品的放量。尽管NPO产品目前尚处于开发阶段且未向CSP送样，但公司的Driver和TIA方案已进入 旭创、新易盛及菲尼萨等厂商的前期NPO样品中。NVIDIA预计在2027年对NPO有1000万至 1600万颗的需求，NV的3.2T需求公司的方案已包含在内，若能顺利放量将是重大利好。原先预计 Amazon也有800万至1000万颗的需求，但由于其Trainium4项目可能推迟，该部分需求或将延 后。 主持人：Google的2.4TCoherentLite项目何时放量？该项目的确定性如何？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 专家：该项目已经非常确定，计划于2027年下半年实现量产。Google已明确将在其下一代数据中心 网络（OCS组网）中导入CoherentLite技术，采用OCS作为spine直接连接rack，显著减少了中 间层架构复杂度。 主持人：CoherentLite项目的总体需求量、产业链准备情况以及其技术门槛如何？ 专家：需求方面，该项目预计在2027年需求量为200万只，到2028年将增长至千万只以上，主要 与TPUv8和v9搭配使用。产业链方面，目前正在评估OCS以及CoherentLite光模块的开发与交 付进度能否满足2027年的量产计划。技术门槛方面，CoherentLite光模块的技术难度高于PAM4模 块，开发周期也更长。 通常800G或1.6T的PAM4模块开发周期约为半年，而CoherentLite模块至少需要一年时间。 主持人：CoherentLite项目中的DSP芯片供应商方案是怎样的？ 专家：目前已确定两家DSP供应商方案。第一家是Marvell，其方案将包含DSP、Driver和TIA。第 二家是硅谷初创公司Celero（由Google投资），其方案将搭配Macom的Driver和TIA。目前这两 个方案都已在模块商（如InnoLight、Coherent）处进行前期测试。 六、TIA产品市场空间与竞品进度对比主持人：TIA产品的市场空间有多大？ 专家：经测算，800G、1.6T及NPO应用场景下的TIA整体市场规模约为20亿美元。目前行业内该 代TIA做得较好的是Marvell和Semtech，其产品已实现批量生产。公司的TIA产品进度相对落后， 目前仍在测试阶段。若一切顺利，预计能在2027年Q2实现批量生产，这将为数据中心业务带来显著 的收入增长。 主持人：公司200GTIA产品的开发迭代情况以及与行业主要竞争对手的进度对比是怎样的？ 专家：公司的200GTIA产品早在2025年3月就已送样，但由于存在一些问题，至今已迭代四个版 本，目前测试中仍发现问题。相比之下，行业内的竞争对手如Semtech，尽管其TIA产品也经历了多 次迭代，但其内部迭代速度更快，目前已在主要客户处通过测试并获得批量订单。不过，根据从 InnoLight等客户处获得的信息，Semtech当前这一代TIA在某些应用场景下仍存在缺陷，可能还需 要改进。总体而言，Semtech的进度要快于公司，但双方均面临持续优化的挑战。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-23T15-04:750f7ec2d539": {"id": "post:2026-10-23T15-04:750f7ec2d539", "kind": "post", "title": "2026-10-23 15:04", "source_label": "帖子正文", "excerpt": "看好：蘅东光（绑定AFL、Coherent）、天孚通信（英伟达等）、光库科技（Coherent+旭创）、仕佳光子（MPO多客户+康宁FAU）、致尚科技（SenkoMPC+Viaph", "content": "光通信反弹，优先看无源光器件——业绩Q2/Q3连续超预期、价值量通胀、不受政策压制 持续看好：蘅东光（绑定AFL、Coherent）、天孚通信（英伟达等）、光库科技（Coherent+旭创）、仕佳光子（MPO多客户+康宁FAU）、致尚科技（SenkoMPC+Viaphoton订单）、杰普特（Viaphoton订单+Coherent合作）、太辰光（康宁、康普）、汇聚科技（谷歌MPO+shuffle进展）等#文字观点", "publish_time": "2026-10-23 15:04", "tags": ["文字观点"]}, "post:2026-10-23T20-44:b6001c7775d6": {"id": "post:2026-10-23T20-44:b6001c7775d6", "kind": "post", "title": "2026-10-23 20:44", "source_label": "帖子正文", "excerpt": "【国金通信丨国产算力】寒武纪发布26Q3业绩：备货指标再创新高261023 业绩符合预期，战略备货加码，存货、应付共振指向Q4及明年交付放量。", "content": "【国金通信丨国产算力】寒武纪发布26Q3业绩：备货指标再创新高261023 业绩符合预期，战略备货加码，存货、应付共振指向Q4及明年交付放量。寒武纪26Q1-3实现营收95.26亿元，同比+106.76%，归母净利润37.15亿元，同比+131.49%。其中，单26Q3营收35.31亿元，同/环比分别+104.47%/+13.5%；归母净利润14.04亿元，同/环比+147.74%/+8.2%；扣非归母13.58亿元，同/环比+168.13%/+10.3%。单Q3归母净利率39.8%（同比约+7pct）。毛利率环比继续提升，研发投入显著加码。前三季度毛利率约56.5%（同比+1.2pct）；单26Q3毛利率升至约58.7%（环比+2.6pct），连续两个季度环比上行。前三季度销售/管理/研发/财务费用率合计约15.0%，同比下降约7.6pct，收入翻倍下费用杠杆充分释放。单26Q3研发投入5.23亿元，同比+73.66%，费用率14.80%（同比-2.63pct），绝对额较上半年季度均值（约3.5亿元）提升近50%，指向下一代芯片及软件生态研发投入提速。存货及应付等备货先行指标再创新高。期末存货116.65亿元，Q3单季环比增加约34.2亿元；应付票据及账款67.93亿元，Q3单季环比增加约26.32亿元，存货、应付票据共振指向Q4及明年交付放量。前三季度公司计提存货跌价准备5.02亿元（去年同期0.87亿元，同比多增约4.1亿元），其中上半年已计提3.97亿元、Q3单季新增约1亿元，计提节奏环比收敛；连同信用减值损失转回0.15亿元，合计减少前三季度利润总额4.87亿元（约占归母净利润13%、拖累前三季度净利率约5pct），计提规模占期末存货余额约4.3%。 风险提示：AI算力需求不及预期；供应链及上游产能风险；存货跌价进一步计提风险。#文字观点", "publish_time": "2026-10-23 20:44", "tags": ["文字观点"]}, "post:2026-10-23T21-05:7c155d8dcb42": {"id": " 2个 百分点，毛利增长与收入增长基本同步。 现金流：销售回款改善，经营现金净流出收窄 应收账款由增转降，营运资金占用压力缓解。2026H1行业期末应收账款为2646.79亿元，同 比下降2.51%；应收账款占上半年营收的比重由 87.09%降至80.38%。行业现金回收能力有 所增强，业务扩张伴随的应收资金占用得到控制，经营质量继续改善。 销售回款持续改善，经 营现金净流出进一步收窄。2026H1行业经营活动现金流量净额为 -317.70亿元，较上年同期 的-333.67亿元改善15.96亿元，净流出收窄4.78%。回款增长快于收入、应收占比下降与经 营现金流改善相互印证，现金回收成为本期经营修复的另一条主线；经营现金流仍为净流出， 则反映业务运行中的资金投入压力尚存，现金端修复弱于利润端。 细分行业：IT基础设备盈利兑现突出， G端与B端修复节奏呈结构性分化 IT基础设备盈利兑现突出，G端与B端修复节奏呈结构性分化。具体来看：1）AI相关板块的 业绩分化加深，IT基础设备率先体现收入增长与利润率提升的双重拉动。 2026H1 IT基础设备 收入和归母净利润分别增长 12.14%和49.31%，二季度利润增速进一步升至 52.63%，盈利弹 性持续释放；2）G端呈现龙头利润增长、部分板块减亏与传统政务需求承压并存的格局； 3） B端修复节奏分化，工业软件和金融 IT二季度改善，汽车IT与能源IT盈利承压。 投资建议：需求拉动增长的弹性仍 偏弱，关注AI带来的结构性增量 下半年仍需重点关注AI技术变革下的结构性需求增量。当前计算机板块基本面迎来底部拐点， 但需求拉动增长的弹性偏弱。行业营收、净利润增速边际回暖，不过整体景气修复缓慢，全面 反转仍需验证。因而展望下半年，仍应重点关注 AI技术变革所带来的结构性需求增量。建议 关注：1）大模型：国产大模型加速迭代，有望 ARR的快速提升；2）国产算力：模型持续迭 代带动计算资源需求增加，新技术架构、超节点、 CPU值得重点关注；3）云计算：上游涨价 叠加下游高景气推动云计算涨价，收入侧带来直接提振； 4）应用：随着Agent+Harness成为 全新AI应用形态，数据工具等 Infra赛道有望收获增量价值，具备“数据 +流程+用户”闭环的 平台公司拥有核心壁垒。 风险提示 1、AI等底层技术变革不及预期； 2、下游客户信息化支出修复不及预期。 市场表现对比图(近12个月) 资料来源：Wind 相关研究 [Table_Report]•《AI4S进行时：玩家布局&扩产均加速，行业多 点共振，坚定看好产业趋势》2026-09-24 •《Agentic Cloud：云计算的下一次范式迁移》 2026-08-31 •《AI沉思录（五）：Coding之后，智能的下一步 是什么？》2026-08-28 -30%-13%3%20% 2025/10 2026/2 2026/6 2026/10软件与服务沪深3002026-10-22%% %% %% %%research.95579.com 2 请阅读最后评级说明和重要声明 3 / 23 行业研究 | 专题报告 目录 计算机行业上市公司 2026年半年报经营综述 .............................................................................. 5 营收延续温和增长，合同负债提供支撑 ......................................................................................................... 5 扣非利润实现扭亏，盈利修复进一步深化 ...................................................................................................... 6 费用率持续下行，经营效率改善 .................................................................................................................... 7 销售回款改善，经营现金净流出收窄 ............................................................................................................. 8 细分行业：IT基础设备盈利兑现突出， G端与B端修复节奏呈结构性分化 ............................. A股没有跟着隔夜美股半导体暴跌走下去。\u003c/li>\n\u003cli>三季报与产业催化密集：大族激光1-9月新增订单约243亿元、全年收入大概率超300亿元创新高；BE 26Q3营收12.4亿美元同比+138%并调升全年收入指引至45亿美元左右；智元发布ViGAR世界-动作模型，杰克科技计划10/28发布缝制人形机器人。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型：合计ARR未见放缓，最悲观阶段已过。\u003c/strong> 今天强化的逻辑是OpenAI与Anthropic在8-9月月均新增ARR 159亿美元，接近4月约170亿美元的合计增量；OpenAI每1个人类工作日对应3.1个Agent工作日。今天出现的催化/验证包括中美大模型26Q4展望、英伟达柏林GTC大会为2027年强劲表现铺路、OpenAI融资轮计划以1.25万亿美元融资前估值筹集300亿美元。\u003c/li>\n\u003cli>\u003cstrong>存储/HBM4与先进封装：2027年定价与产能结构变化。\u003c/strong> 今天强化的逻辑是2027年HBM4定价分化，海力士为抢占份额采取积极定价策略、低于美光报价；2027年HBM产能增速约70%，月产达20万片，占DRAM总产能30%。今天出现的催化/验证包括存储龙头调研、DISCO 2Q营收/净利润1428/461亿日元、同比+36.4%/+43.5%，Q3出货指引in line，AI及CPO需求延续，设备/耗材出货占比63%/23%、同比+66%/+45%；长电科技前三季度营收309.52亿元、同比+7.96%，先进封装扩产持续推进。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO与光模块：订单与测试能力验证。\u003c/strong> 今天强化的逻辑是五家光模块公司陆续公告经营秩序正常、订单充足，中际旭创称供应链稳定、产能充足，海外主要客户订单已排至2027年；新易盛拟回购A股8亿至10亿元。今天出现的催化/验证包括优利德67GHz矢量网络分析仪正式发布，匹配1.6T光模块电气接口与下一代高速器件测试，支持扩展至110GHz；MXL Q3收入2.18亿美元、同比+72%、环比+29%，Q4指引2.4-2.6亿美元、中值好于一致预期2.26亿美元；A股未跟随隔夜美股半导体暴跌。\u003c/li>\n\u003cli>\u003cstrong>PCB/设备与消费电子创新：订单与涨价传导。\u003c/strong> 今天强化的逻辑是大族激光1-9月新增订单约243亿元，其中PCB约100亿元、3C约40亿元、锂电约25亿元、封测约7亿元；供应链存储、PCB等部件上游供应偏紧，公司做了策略性备货，并预计在26Q4及27Q1做涨价传导；超节点行业客户POC测试进展顺利，互联网客户亦稳步拓展，预计27年放量。今天出现的催化/验证包括大族激光Q3单季收入80.61亿元、归母净利润8.89亿元、扣非归母净利润8.93亿元，全年收入大概率超过300亿元创历史新高；电子布织机在手订单超万台、交付排至2028年底；科翔股份26Q3归母净利润3.1亿元，陶瓷混压PCB业绩有望释放。\u003c/li>\n\u003cli>\u003cstrong>机器人/物理AI：模型与产品发布催化。\u003c/strong> 今天强化的逻辑是智元机器人10月23日联合北大发布ViGAR，为首个面向全尺寸人形机器人的“世界-动作模型”，仿真与真机结论一致，水果摆放域内0.72、域外0.43，模型权重与训练代码全部开源；杰克科技计划10/28发布缝制人形机器人，全球服装工人近1亿，10%简单重复工序可替代对应1000万工人，保守按10w/台对应万亿级空间，效率已达人工60%-70%、过客户认可线。今天出现的催化/验证包括ViGAR发布、杰克科技10/28发布会、将建“Optimus学院”先造1—2万台机器人自我对弈练习。\u003c/li>\n\u003cli>\u003cstrong>宏观策略与风险：海外流动性压制与A股韧性。\u003c/strong> 今天强化的逻辑是隔夜美股科技股全面剧烈抛售，费城半导体指数下跌6.7%、盘中一度下跌超过7%，除AI属性相对偏弱的模拟芯片外，半导体设备、存储、光通信、CPU等大幅下挫；问题根源包括中东问题焦灼升级、中期选举不确定性等带来的广泛宏观压力，流动性收紧、债券收益率上行。今天出现的催化/验证包括A股没有跟着隔夜美股半导体暴跌走下去，午间光模块龙头集体发布经营公告并回购；点评预计市场短期痛苦后快速反弹；宏观外部方面，9月美联储加息、美债收益率走高、海外高利率延续，中美周期错位，海外利率压制成长，但AI产业景气仍在；风险包括内需偏弱、地产修复不及预期、海外流动性收紧。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>大模型ARR数据更新：OpenAI与Anthropic在8-9月月均新增ARR 159亿美元，接近4月约170亿美元的合计增量；OpenAI每1个人类工作日对应3.1个Agent工作日。\u003c/li>\n\u003cli>美股半导体硬件剧烈调整：费城半导体指数下跌6.7%、盘中一度下跌超过7%，半导体设备、存储、光通信、CPU等大幅下挫；MEGA 7中除苹果外其他个股亦被波及。\u003c/li>\n\u003cli>光模块龙头午间集体公告：中际旭创、新易盛、天孚通信、光迅科技、源杰科技陆续公告经营秩序正常、订单充足；中际旭创称供应链稳定、产能充足，海外主要客户订单已排至2027年；新易盛拟回购A股8亿至10亿元；A股没有跟着隔夜美股半导体暴跌走下去。\u003c/li>\n\u003cli>存储龙头调研：2027年HBM4定价分化，海力士为抢占份额采取积极定价策略、低于美光报价；2027年HBM产能增速约70%，月产达20万片，占DRAM总产能30%。\u003c/li>\n\u003cli>DISCO 2Q业绩：营收/净利润1428/461亿日元，同比+36.4%/+43.5%，基本in line；2Q出货创新高，Q3出货指引in line，AI及CPO需求延续；设备/耗材出货占比63%/23%，同比+66%/+45%。\u003c/li>\n\u003cli>大族激光Q3数据：单季度收入80.61亿元、归母净利润8.89亿元、扣非归母净利润8.93亿元；1-9月新增订单约243亿元，其中PCB约100亿元、3C约40亿元、锂电约25亿元、封测约7亿元；全年收入大概率超过300亿元创历史新高；供应链存储、PCB等部件上游供应偏紧，预计26Q4及27Q1做涨价传导。\u003c/li>\n\u003cli>机器人产业催化：智元机器人10月23日联合北大发布ViGAR，首个面向全尺寸人形机器人的“世界-动作模型”，仿真与真机结论一致，模型权重与训练代码全部开源；杰克科技计划10/28发布缝制人形机器人，效率已达人工60%-70%、过客户认可线；将建“Optimus学院”先造1—2万台机器人自我对弈练习。\u003c/li>\n\u003cli>光通信测试新品：优利德67GHz矢量网络分析仪正式发布，匹配1.6T光模块电气接口与下一代高速器件测试，支持扩展至110GHz，迈入国内第一梯队。\u003c/li>\n\u003cli>三季报其他变化：BE 26Q3营收12.4亿美元、同比+138%，毛利率33.8%、增长约4.53pct，营业利润2.25亿美元、同比大幅增长，调升全年收入指引至45亿美元左右；亿纬锂能Q3营收277亿元、同比+64.6%，归母净利润19.4亿元、同比+60.2%，扣非归母净利润16.4亿元、同比+111%、环比+23%；宝光股份Q3归母净利润2097万元、同比+70.99%；爱旭股份Q3归母净利润4457万元、环比二季度增长超3.5亿元、时隔五个季度再次实现整体扭亏为盈。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>大模型ARR新增能否延续，OpenAI融资轮以1.25万亿美元融资前估值筹集300亿美元的进展。\u003c/li>\n\u003cli>2027年HBM4定价分化与海力士份额策略，HBM产能增速约70%、月产20万片、占DRAM总产能30%的兑现情况；DISCO Q3出货指引及AI/CPO需求延续性。\u003c/li>\n\u003cli>光模块订单排至2027年的兑现、新易盛8亿至10亿元回购执行；优利德67GHz矢量网络分析仪在1.6T光模块电气接口与下一代高速器件测试中的放量。\u003c/li>\n\u003cli>大族激光26Q4及27Q1涨价传导、超节点POC测试与27年放量、全年300亿元收入目标兑现。\u003c/li>\n\u003cli>杰克科技10/28缝制人形机器人发布、智元ViGAR开源后应用进展、“Optimus学院”先造1—2万台机器人自我对弈练习的进展。\u003c/li>\n\u003cli>电子布织机交付排至2028年底、L
