bf": {"id": "post:2026-08-22T19-28:eee7cd9a68bf", "kind": "post", "title": "2026-08-22 19:28", "source_label": "帖子正文", "excerpt": "【亿纬锂能】观点更新：固态电池前瞻布局，打开远期估值弹性；主营业务新品放量，高景气度证伪弱预期固态电池是电池行业中长期核心技术主线，本周末人民日报再call固态，体现了官方对电池方向前沿科技的重视。", "content": "【亿纬锂能】观点更新：固态电池前瞻布局，打开远期估值弹性；主营业务新品放量，高景气度证伪弱预期固态电池是电池行业中长期核心技术主线，本周末人民日报再call固态，体现了官方对电池方向前沿科技的重视。我们认为亿纬锂能完成技术、产品、产能三位一体布局，在国内电池厂商中处于第一梯队，具备较强预期差。公司设有固态电池研究院，技术路线上主流路线并行，兼顾离子电导率与界面稳定性，产品矩阵分层清晰，已经推出龙泉二号、三号、四号三款硫化物/卤化物复合电解质固态电池，以及高分子凝胶半固态电池初代产品龙泉二号2025年下线，主打人形机器人、低空飞行器、AI高端装备等对能量密度和轻量化要求高的场景，已拿到机器人头部客户定点。龙泉三号在二号基础上迭代材料与界面，优化压力要求和体积能量密度，在原有场景基础继续上向高端消费电子延伸。龙泉四号2026年3月下线，容量升级到60Ah大容量软包电芯，面向整车PACK，具备车规电芯基础容量规格，工作压力控制 ≤5MPa；对比行业其他硫化物固态大幅降低整车对加压壳体的结构成本、重量负担，具备实用化潜力，已向车企送样验证。 规划2028年推出更高能量密度的高比能全固态产品，技术迭代节奏明确可跟踪 。产能端，成都专属固态基地落地，一期具备60Ah电芯制造能力，二期中试产能建成，打通小试‑中试的工业化链路，同时同步布局半固态技术，形成半固态过渡、全固态攻坚的双线发展格局 。商业化策略采用“高端装备＋消费电子先行，车载逐步渗透”，优先在小批量高毛利场景兑现技术价值，再向乘用车市场延伸。主营业务方面，2026H1营收465.9亿、同比增长62%，利润33.01亿，同比增长105.66％。公司H1出货80GWh，同增60%，其中动力35.8GWh，同增66%，储能44.5GWh,，同增55%；Q2出货46GWh，同环比+66%/ +31%。预计26年出货200GWh,同增65%。不但原有优势储能电池高速增长，动力电池在大圆柱以及商用车的带动下，增速更是远超行业。公司统计各产品线27年需求，整体增速50%＋，其中乘用车在大圆柱的拉动下预计100%增长，储能和商用车部分产能可共线预计40-50%增长，不管乘用车，商用车还是储能，产能都无法满足客户的全部需求，增速完全取决于取决新增产能释放和产能如何分配。结合其他公司释放的指引情况，比如宁德时代释放未来5年20~30％的增长预期，且明年快于该区间的增长指引；鹏辉认为往明年以及后年展望，完全看不到需求衰退的迹象。之前部分市场参与方对行业下半年以及后续的弱预期已被完全证明。 #预计亿纬锂能2026-2027年归母净利润72、107e，对应PE 16、11X，结合增速来看公司主业被大幅低估，完全没有体现电池端的成长性，固态电池等新技术的预期更是完全被忽略，后续有极大修复空间#文字观点", "publish_time": "2026-08-22 19:28", "tags": ["文字观点"]}, "post:2026-08-22T12-35:1c7ff3bc298b": {"id": "post:2026-08-22T12-35:1c7ff3bc298b", "kind": "post", "title": "2026-08-22 12:35", "source_label": "帖子正文", "excerpt": "☀️【华创社服】途虎-W 2026年中报点评：门店加速扩张、份额逆势提升，盈利阶段性承压、股东回报加码 📊 收入延续双位数增长，盈利阶段性承压。2026H1公司实现收入87.8亿元，同比+11.4%", "content": "☀️【华创社服】途虎-W 2026年中报点评：门店加速扩张、份额逆势提升，盈利阶段性承压、股东回报加码 📊 收入延续双位数增长，盈利阶段性承压。2026H1公司实现收入87.8亿元，同比+11.4%；因部分业务线引入POP商家入驻模式、收入由总额法转净额法确认，还原口径影响后可比收入同比约+13%。分业务看，轮胎及底盘零部件收入同比+19%；汽车保养收入同比+6.4%；汽配龙还原后可比收入同比+13.8%、毛利率同比升至27.5%；广告及其他品牌活动收入同比+11.0%。利润端，经调整净利润2.4亿元、经调整净利率2.7%，经调整EBITDA 3.27亿元。整体毛利率23.3%，经调整运营费用率22.8%（同比+0.4pcts）；公司维持中长期毛利率30%、费用率20%目标不变。 🌍 用户与份额：交易用户再上台阶，份额逆势提升。截至6月底，平台注册用户1.75亿（同比+2,470万）；过去12个月全渠道交易用户3,100万（同比+17.2%），用户年复购率65.2%（同比+0.7pcts）。途虎APP+微信小程序合计平均月活2,330万（同比+10%），支付转化率同比+1.6pcts；抖音、美团第三方渠道支付用户数同比+200%。行业承压背景下（上半年行业轮胎销量-2%、机油销量-7%、汽油零售-17%），公司全平台轮胎销量同比+18%、机油销量同比+12%，市场份额逆势提升；其中18寸及以上大规格轮胎销量占比由27%升至33%。 🏨 门店加速扩张，万店目标有望提前达成。上半年净增工厂店817家，截至6月底全球途虎工厂店8,825家（同比净增1,620家）。中国内地工厂店8,804家，县级覆盖率70%；一线城市门店占比60%，单店平均覆盖约3.7万辆乘用车，距\"每2万辆保有量一家店\"阶段性目标仍有近一倍空间。新加盟商申请线索同比+100%，现有加盟商到期续约率90%+，开业6个月以上加盟店盈利比例约90%。公司预计超额完成全年新开千店目标，原定2027年底的万店目标有望提前达成。 📈 业务结构升级，新能源与快修贡献增量。新能源交易用户530万、占全部交易用户17.2%（同比+4.3pcts），保外C端新能源装修收入同比+250%。快修业务收入同比+50%以上，SKU达17万个（同比+89%）。美容业务线上支付订单同比+46%、单日峰值超17万单。AI相关研发费用同比+50%、占研发费用比例突破10%，AI代码采纳率超90%、研发交付时长下降约35%。 💰 股东回报加码，美国上市推进。2026年至今回购与信托购买合计4,350万股（约占期末已发行股份5.3%）；6月底宣布未来两年回购不少于5,000万股并注销、同时扩大信托购买上限，两项合计最高15亿港元。公司已向美国证券交易委员会提交上市申请，拟港股、美股两地主要上市。期末现金储备76.5亿元，经调整自由现金流2.25亿元，资产负债表稳健。 ☕️ 欢迎联系 饶临风/高惠远#文字观点", "publish_time": "2026-08-22 12:35", "tags": ["文字观点"]}, "attachment:files/中金公司-亿纬锂能(300014)1H26业绩符合预期，看好动储结构改善加速-260821.pdf": {"id": "attachment:files/中金公司-亿纬锂能(300014)1H26业绩符合预期，看好动储结构改善加速-260821.pdf", "kind": "attachment", "title": "中金公司-亿纬锂能(300014)1H26业绩符合预期，看好动储结构改善加速-260821", "source_label": "中金公司", "excerpt": "亿纬锂能 亿纬锂能(300014) ： ：1H26 业绩符合预期 业绩符合预期 看好动储结构改善加速 看好动储结构改善加速 2026-08-21 1H26 业绩符合市场预期 公司 1H26 营收 456.91 亿元、同比 +62.20% ，归母净利润 33.01 亿元、同比 +105.66% ，扣非净利润 24.51 亿元、同比 +111.89% ；其中 2", "content": "亿纬锂能 亿纬锂能(300014) ： ：1H26 业绩符合预期 业绩符合预期 看好动储结构改善加速 看好动储结构改善加速 2026-08-21 1H26 业绩符合市场预期 公司 1H26 营收 456.91 亿元、同比 +62.20% ，归母净利润 33.01 亿元、同比 +105.66% ，扣非净利润 24.51 亿元、同比 +111.89% ；其中 2Q26 收入 250.12 亿元，同比 +62.69% ，归母净利润 18.55 亿元，同比 +268.00% ，扣非归母净利润 13.37 亿 元，同比 +294.05% 。 1H26 及 2Q26 业绩符合市场预期。 发展趋势 2Q 动力、储能电池出货同环比加速，盈利水平环比改善。公司动力电池出货 21.4GWh ，同比 +88.9% 、环比 +49.0% ，主 要受益于商用车的高增、宝马大圆柱及国内新客户的上量；储能电池出货 23.6GWh ，同比 +47.3% 、环比 +13.4% ，行业较高景 气度驱动下储能延续较高增速。盈利方面，伴随电池顺价逐步落地、以及客户 / 产品结构优化，我们估计 C、燃机OEM客户资源。Mico今年底与冰轮成立合资公司，在烟台生产电堆降本，明年合资公司正式交付。 ⭐投资建议： 按产值规划确定性，假设27/28年液冷收入100/150亿元，20%净利率，预计27/28年数据中心冷却利润分别20/30亿元，叠加主业5-6亿利润，总利润有望达到25/36亿元，当前市值对应PE分别16/11xPE，继续重点推荐。 假设xAI等订单&国内灵活交付&机头自制超预期，数据中心北美组装所需人工极少，国内产能可优先支持有需求客户，乐观情境下27年液冷收入/净利润可能在120/24亿，总利润29亿元，当前市值对应27年PE14x。 ——————————— 欢迎交流：孙潇雅/庄恬心#文字观点", "publish_time": "2026-08-22 22:01", "tags": ["文字观点"]}, "post:2026-08-22T21-10:c20f770eb656": {"id": "post:2026-08-22T21-10:c20f770eb656", "kind": "post", "title": "2026-08-22 21:10", "source_label": "帖子正文", "excerpt": "远东股份中报点评：扣非大幅度增长，液冷全新期待-0822晚 🐟1️⃣#营收创新高、扣非大幅度增长。2026年上半年，公司实现营业收入129.92 亿元，同比+0.12%，创同期新高", "content": "远东股份中报点评：扣非大幅度增长，液冷全新期待-0822晚 🐟1️⃣#营收创新高、扣非大幅度增长。2026年上半年，公司实现营业收入129.92 亿元，同比+0.12%，创同期新高；归母净利润2.05 亿元，同比+43.13%，扣非归母净利润 1.99 亿元，同比+73.35%。其中算力、人工智能和机器人新兴市场，实现营业收入 8.34 亿元，同比增长 57.21%。 🐟2️⃣#AI：先进散热&全光互联齐飞。1）#散热：公司已从提供单一产品供给升级为全栈热管理综合解决方案服务商，产品范围覆盖芯片级-机柜级-系统级。自主研发如 Manifold、机架式液冷 CDU、机柜式液冷 CDU、CPU/GPU 液冷模组、TIM （液态金属界面导热材料） 、 内存及 CPU 一体化液冷模组等全系列算力散热产品。 2）#光纤爆发增长、全球客户突破迅速：实现营业收入同比增长286.70%，净利润同比增长 472.31%。a.已顺利通过多家全球头部CSP技术认证，并批量供货。b.北美头部云服务商企业MPO/MTP 预端接跳线产品顺利完成测试。c.全球通信基础设施龙头企业成功进入供应商体系，并开始批量供货。d.全球光互联领域领先企业：与多家行业头部企业深入开展保偏光纤研发合作。#文字观点", "publish_time": "2026-08-22 21:10", "tags": ["营收创新高、扣非大幅度增长", "AI", "先进散热&全光互联齐飞", "文字观点"]}, "post:2026-08-22T22-11:1534cdc904fb": {"id": "post:2026-08-22T22-11:1534cdc904fb", "kind": "post", "title": "2026-08-22 22:11", "source_label": "帖子正文", "excerpt": "【XB 机械】蓝思科技（300433.SZ）2026 年半年报点评：Q2 业绩逆势超预期，AI 端侧 + 算力 + 商业航天多轮驱动，开启 6‑8 个季度超级景气向上周期 1. Q2 单季盈利逆势超预期，结构优化推动毛利率强劲修复，经营拐点已现 财务表现：公司 2026 年上半年实现营业收入 288", "content": "【XB 机械】蓝思科技（300433.SZ）2026 年半年报点评：Q2 业绩逆势超预期，AI 端侧 + 算力 + 商业航天多轮驱动，开启 6‑8 个季度超级景气向上周期 1. Q2 单季盈利逆势超预期，结构优化推动毛利率强劲修复，经营拐点已现 财务表现：公司 2026 年上半年实现营业收入 288.66 亿元（YoY‑12.42%），毛利率 16.43%（YoY +2.21pct），归母净利润 5.77 亿元（YoY‑49.52%）。其中 2026Q2 单季度实现营业收入 147.27 亿元（QoQ +4.16%），归母净利润 7.26 亿元（YoY +1.77%），实现强劲扭亏为盈；单季度综合毛利率达 18.20%（YoY +2.47pct，QoQ 显著提升）。 超预期原因：在上半年行业面临存储芯片价格上涨扰动下游整机成本及汇兑净损失（财务费用汇兑净损失达 4.92 亿元）的双重重压下，公司主动优化低附加值组装业务，推进 “减量提质”； 智能手机与电脑类业务毛利率逆势提升至 16.17%（YoY +2.99pct，Q2 达 17.91%）；智能汽车及座舱业务营收 33.72 亿元（YoY +6.56%），Q2 提速至 YoY +10.11%、毛利率 12.69%，体现出极强的精密制造抗周期韧性与阿尔法能力。 2. 未来 6‑8 个季度景气向上大周期确立：传统消费电子迎来大客户创新大年，资本开支与产能准备就绪 大客户创新浪潮将至：下半年起北美大客户及安卓阵营高端折叠屏、AI 手机、AIPC 陆续迭代发布。公司在 UTG 超薄柔性玻璃、3D 玻璃、钛金属中框复合结构件及 3D 打印工艺上实现全面卡位与深度前置预研，核心高单价组件将加速交付。 业绩释放节奏：随着主动调整后的高附加值产品出货占比提升，叠加全球 AI 端侧硬件换机潮与前瞻性产能（东园项目、越南二园等）的逐步释放，公司将迎来连续 6 至 8 个季度的收入与利润双向向上扩张周期。 3. 新兴成长赛道全面开花：具身智能、AI 算力基材、商业航天构筑第二三成长曲线 具身智能 / 机器人：构筑 “链主” 地位，灵巧手、高精度关节模组、机身轻量化结构件及整机组装全栈布局，与智元、中国移动等生态伙伴深度绑定，海外头部大客户小批量出货顺利，出货体量稳居行业前列；其他智能终端板块上半年收入 5.34 亿元（YoY +46.92%），高弹性正在兑现。 AI 算力侧与先进封装： TGV 玻璃基板：突破激光诱导 + 化学蚀刻技术，实现百万级通孔 0ppm 不通率、最小孔径达 10 微米；与英特尔签署战略合作备忘录，联合攻坚 TGV 先进封装，并同步推进 3 万平 TGV 专用厂房建设。 服务器散热与结构件：松山湖园区液冷模组、高精密机柜通过头部算力厂商认证；战略并购切入柜内空芯光纤配套组件；企业级 SSD 固态硬盘已批量出货，HDD 玻璃盘片通过客户验证并小批量出货。 商业航天：自研航天级 UTG 超薄柔性玻璃具备极轻薄、耐极端太空温差及抗辐射特性，搭载公司 UTG 太阳翼方案的卫星已成功发射并完成太空在轨验证，顺利进入客户量产认证周期，开辟千亿级链制造新蓝海。 【XB 机械团队总结与展望】 蓝思科技在经历行业外部扰动与主动结构调整后，二季度的强劲逆势反转已无可辩驳地宣告了基本面最至暗时刻的过去！这不仅是一张高质量的季度成绩单，更是未来 6 到 8 个季度超级景气向上周期的发令枪。 从消费电子玻璃龙头，到全面贯通 “AI 端侧硬件（折叠屏 / AI 眼镜 / 具身智能）+ AI 算力底层底座（TGV 先进封装 / 液冷 / 服务器机柜 / 空芯光纤）+ 商业航天特种材料” 的全球精密制造超级平台 —— 蓝思科技正凭借三十年脆性与金属加工的不可替代壁垒，站上新一轮科技革命的最核心风口。估值底部与业绩向上拐点共振，战略级重估空间全面打开，坚定看好，重点推荐！#文字观点", "publish_time": "2026-08-22 22:11", "tags": ["文字观点"]}, "attachment:files/HK_A_Recap_2026-08-21 re.pdf": {"id": "attachment:files/HK_A_Recap_2026-08-21 re.pdf", "kind": "attachment", "title": "HK_A_Recap_2026-08-21 re", "source_label": "HK_A_Recap_2026", "excerpt": "A股与港股复盘 2026年8月21日 研究笔记 · 不构成投资建议 第 1 / 11 页 股票市场复盘 黄金白银领涨大宗商品 2026年8月21日 · 沪深15:00 / 港股16:08 交易时段： 沪深15:00收盘，港股16:08收盘。下一交易日为2026-08-24（周一）。", "content": "A股与港股复盘 2026年8月21日 研究笔记 · 不构成投资建议 第 1 / 11 页 股票市场复盘 黄金白银领涨大宗商品 2026年8月21日 · 沪深15:00 / 港股16:08 交易时段： 沪深15:00收盘，港股16:08收盘。下一交易日为2026-08-24（周一）。 截至： 2026-08-21（收市后）。 主线： 算力硬件接棒创新药，两地同步验证。A股由CPO、光模块、PCB等AI硬件链放量领涨，北向资金同步加仓；港股智谱、MiniMax解禁首日不跌反涨。另一边，创新药与CXO板块明显退潮，哈药股份跌停。市场焦点已从上周的创新药切换至本周的算力硬件。 一句话： A股四大宽基全线收红，但领涨的已不是上周那批创新药。中际旭创、新易盛、生益科技这条光模块/PCB链放量涨停，北向资金十大成交股被同一批名字占据；港股智谱、MiniMax解禁首日双双涨超一成，算力硬件逻辑两地共振。代价是药明康德、恒瑞医药转跌，哈药股份直接跌停，创新药退潮速度与上周上涨一样快。 贝森特加码回购长端美债引发量宽联想。芯片其实也是商品，因为它有供应有限的特征，而股票钞票都可以随便印。因此，今天的行情就是商品行情——芯片、黄金白银、原油，农产品也蠢蠢欲动。我们在今天星球的长文中讨论了史诗级厄尔尼诺和各个主要农产品的关系。美元持续走弱，大宗商品交易应延续。 数据来源见上方总述。 本日报要 算力硬件接棒，两地共振： 今天最值得记录的并非四个指数的涨幅，而是涨的标的发生更换。A股光模块与PCB链（中际旭创、新易盛、生益科技、国瓷材料、太辰光、通鼎互联）放量拉升，多股涨停或逼近涨停，东方财富沪深港通十大成交股显示北向资金今日买入最多的也是这批名字；港股智谱、MiniMax恰逢上市以来首个解禁窗口，通常该日易受抛压压制，但两只股票收盘反而涨超一成。代价写在对立面：药明康德、恒瑞医药双双转跌，哈药股份直接跌停，上周还在涨停潮中的创新药板块，这两日退潮速度不亚于上涨时。明日有一干净的验证点——中际旭创今晚发布年报，市场将用这份成绩单回答今日的涨停是否有业绩支撑。 A股： 上证收3,905点，涨0.04%，仍在50/100/200日均线下方，今日阳线未收复任何均线；深证成指涨0.87%，创业板指涨1.43%领跑，科创50仅涨0.04%。两市成交合计1.88万亿元，较前一交易日缩量约2001亿元。指数普涨之下，个股跌多涨少：沪深两市涨2431家、跌2663家、平189家（东方财富数据中心，16:12口径，不含北交所），涨停54家、跌停13家、炸板率23.94%。 A股与港股复盘 2026年8月21日 研究笔记 · 不构成投资建议 第 2 / 11 页 港股： 恒指收26,009点，涨1.2%，五连阳，全周累计升892点，收盘价即当日最高点（技术位置见第2节）；国企指数涨1.0%，恒生科技涨1.4%领先。主板全日成交约2572亿港元。 货币与汇率： 人民币中间价6.7817，较周四（8月20日）的6.7808贬值9点；但在岸市场价报6.7200、离岸CNH报6.71995，两地价差仅约0.5点，即期比中间价强617点，显示市场定价的人民币强于央行参考中枢。美元指数98.78，昨天下跌后今天基本持平。公开市场操作：央行今日开展7天期逆回购95亿元，中标利率1.40%，全额满足一级交易商需求（到期规模未见独立披露）。 互联互通： 北向全日成交2680.9亿元（沪股通1258.5亿+深股通1422.4亿），净额未公布——港交所调整披露机制后不再公布沪深股通实时买卖净额；南向净卖出76.30亿元（买入463.92亿/卖出540.21亿），连续第三个交易日净卖（前两日分别净卖104.1亿、106.2亿），卖出规模未放大。南向连续卖、恒指却连续涨，说明这轮港股上涨主要并非南向资金推动。 大波动： 内地：通鼎互联+10.0%、国瓷材料+7.9%、新易盛+6.8%；恒瑞医药−3.6%、药明康德−3.0%、哈药股份跌停−10.0%。港股：MiniMax+11.9%、智谱+10.4%、老铺黄金+7.5%；泡泡玛特−3.1%、阿里巴巴-W−2.5%。 技术： 上证收在50/100/200日均线（3958/4013/4013）下方，距布林中轨（3893）不远，今日阳线未修复均线；恒指已站上50/100/200日均线（24710/25201/25700），收盘26009距布林上轨（26163）仅约0.6%，两地强弱明显不同步。 驱动： 沪深15:00已收市，港股下午盘16:08收市。当日无国家统计局宏观数据发布（早稻产量属例行农业统计，不构成对盘面的驱动，故本节不展开）。 外盘 / 商品 / 国债： 美股期货盘前（约美东09点）标普+0.3%、纳指+0.15%、道指+0.55%，VIX回落至15.48；WTI持平于86.83，布伦特94.04；COMEX黄金4584.85（+1.5%）逼近4600关口，白银69.60（+2.3%）、铜6.59（+1.8%）同步走强；美债10年4.72%、30年5.26%、2年4.22%，中国10年1.69%，中美利差约302个基点。 A股与港股复盘 2026年8月21日 研究笔记 · 不构成投资建议 第 3 / 11 页 1. A股 来源：东方财富 push2delay 实时行情（开高低、成交额）；涨跌家数、主力资金锁东方财富数据中心「大盘资金流向」（16:12更新，沪深两市口径不含北交所）；涨停/跌停锁东方财富「涨停板行情」页（沪深两市口径）。 指数 收盘 当日 开 / 高 / 低 成交额 上证指数 3,905 +1.48（+ 123 2645 mark.li@bernsteinsg.com Edward Hou, CFA +852 2123 2623 edward.hou@bernsteinsg.com Yipin Cai, CFA +852 2123 2669 yipin.cai@bernsteinsg.comWe track the Korea export data as it is a good early indicator for Samsung’s & SK hynix’s HBM revenue in the same quarter, and update this tracker with the Jul data. Details of our methodology can be found in our prior note . The dataset can be downloaded at this link. Overall HBM export remained robust, up 13% QoQ vs. Apr. It retreated by 32% MoM on seasonality but still went up 13% QoQ. YoY increase was also solid at 64%. Data suggested Samsung 3Q26 HBM revenue could beat our estimates. Export from S. Chungcheong (where Samsung packages HBM) was up 122% QoQ vs Apr. And it suggests Samsung’s 3Q26 HBM revenue to rise 80% QoQ, & 30% ahead of our forecast. Export for SK hynix was surprisingly weak. Export from N. Chungcheong & Icheon was down ~27% MoM & QoQ, and regression predicts SK hynix 2Q26 HBM revenue to fall 20% QoQ, significantly below our estimates. We attribute it to the delayed HBM4 shipment for Rubin, but believe its HBM4 shipment should catch up in later months. Samsung still led in HBM4 shipment, & perhaps with price notably above HBM3/3E’s. As HBM has much higher dollar value per weight, we track “value per weigh” as it may be directionally suggestive of HBM price change. Jul “value per weight” rose another 21% MoM for Samsung but only mildly for SK hynix, signaling earlier HBM4 shipment by Samsung. Samsung’s “value per weigh” has also doubled from the prior level, suggesting price perhaps improving notably from HBM3/3E to 4. Data showed HBM price has been insulated from the volatility of conventional memory price. Conventional memory price surged, but SK hynix’s HBM price, as suggested by value per weight, largely stayed in the same range as before. Export to Malaysia exhibited continued strength. It rose further to US$1.3B in Jul, with Samsung staying high but increase mainly from SK hynix. Generally export to Malaysia has been growing meaningfully over the past few quarters. We assume it’s for Intel’s EMIB but are puzzled why HBM import rose so early. Overall Jul data came in strong for Samsung but surprisingly weak for SK hynix. Jul data suggests Samsung HBM revenue can substantially outgrow SK hynix in 3Q26, and likely claim market share lead too. This is in line with our view of improving HBM4 position by Samsung. That said we think SK hynix HBM4 ramp should eventually happen this year and help gain some share back. Additionally, HBM contract price increase next year should trigger an upward revision for 2027 for both. Conventional memory price rise should continue in 3Q26 and HBM price increase should bring earnings revisions. We see continued price increase in 3Q27 & also HBM price hike in 2027. We remain structurally constructive on Samsung, SK hynix & Micron but cautious on KIOXIA on China competition (see our sector update ). Our detailed SOTP valuation also finds KIOXIA over-valued. See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 21 Aug 2026 02:52 UTC Completion Date: 21 Aug 2026 02:52 UTC on 21-Aug-2026 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 BERNSTEIN TICKER TABLE 20 Aug 2026TTM Reported EPS Reported P/E (x) Closing Price Rel. Ticker Rating Cur Price Target Perf. Cur 2025A 2026E 2027E 2025A 2026E 2027E 005930.KS (SEC- Samsung) O KRW 273,000 440,000 255.5% KRW 6,611.53 48,393 77,273 41.3 5.6 3.5 005935.KS (SEC-Pref - Samsung)O KRW 191,200 374,000 197.9% KRW 6,611.53 48,393 77,273 28.9 4.0 2.5 SMSN.LI (Samsung) O USD 4,822.00 7,350.00 251.3% USD 116.15 812.39 1,290.80 41.5 5.9 3.7 000660.KS (SK hynix) O KRW 1,710,000 3,300,000 566.7% KRW 60,341 395,677 568,862 28.3 4.3 3.0 MU (Micron) O USD 974.33 1,300.00 711.8% USD 8.29 67.39 158.99 117.6 14.5 6.1 285A.JP (KIOXIA) U JPY 52,950 40,000 2166.0% JPY 1,014.00 10,013 9,656.84 52.2 5.3 5.5 ASIAX 1,954.75 EM 1,814.53 SPX 7,641.16 O - Outperform, M - Market-Perform, U - Underperform, NR - Not Rated, CS - Coverage Suspended MU estimate is Adjusted EPS; MU valuation is Adjusted P/E (x); Source: Bloomberg, Bernstein estimates and analysis. INVESTMENT IMPLICATIONS Samsung Electronics: We rate Samsung Electronics Outperform with price target of KRW 440,000. SK hynix : We rate SK hynix Outperform with price target of KRW 3,300,000. GLOBAL MEMORY 2 on 21-Aug-2026 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 DETAILS Korea Customs Service has released export data for Jul. As our previous note found, the export data for certain memory products bears close correlation with HBM revenues of Samsung and SK hynix. We hence track the monthly data to provide investors a preview on HBM revenues from the two companies in the same quarter. Details of our methodology can be found in the previous note . You may also download the export data at this link . Jul export data suggested faster than expected growth of Samsung HBM revenue into 3Q26. On the other hand, SK hynix’s 3Q26 HBM revenue may fall below our projection and also below Samsung’s in 3Q26. •Jul Korea total multichip memory export to Taiwan and Malaysia was down by 32% MoM, from Jun’s historical high. The dip was most likely due to seasonality and QoQ growth (vs Apr) actually continued at 13% and YoY growth also remained strong at 64% YoY ( Exhibit 1 ). As we analyzed before, multichip memory export to Taiwan and Malaysia tracked closely with HBM revenues of Samsung and SK hynix and therefore the Jul data indicated continued strong and accelerating momentum into 3Q26. •If we focus on the export from S. Chungcheong Province, where Samsung’s back-end fabs are and likely where its HBM is packaged, Jul export remained very robust at US$2.2B. It was down 35% MoM from the seasonally high in Jun but up 122% QoQ from Apr. And we also note that Jul single month export by Samsung remained higher than SK hynix, for the second consecutive month since Jun ( Exhibit 2 ). The QoQ increase in Jul export was strong ( Exhibit 3 ), and according to the regression using historical data, the Jul data suggested ~US$12B in HBM revenue for Samsung in 3Q26, notably ahead of our estimate of US$9.3B by ~30%, and represented ~80% QoQ growth ( Exhibit 4 ). If we run the regression using only data points from 1Q25, the predicted 3Q26 HBM revenue would be even a bit higher at $12.6B ( Exhibit 5 ). Samsung’s HBM export monthly seasonality has consistently been very backend loaded since 1Q25, with first month of quarter averaging less than 20% of quarterly total, and should 3Q26 follow the same pattern, we should see meaningful increases in Aug and Sep exports ( Exhibit 6 ). Overall Samsung’s HBM export has been stronger than our expectation in recent months, and does align with Samsung’s guidance of the rapid ramp of HBM4 sales in 2H26. We hence remain positive on Samsung’s HBM share gain this year (see Samsung 2Q26 earnings takeaway ). •For SK hynix, we have identified that its HBM export should come nearly all from N. Chungchoeng Province and Icheon City, where its wafer fabs are. In contrast to Samsung, hynix’s Jul export data was much weaker, dropping by 28% MoM and also 27% QoQ (vs Apr) ( Exhibit 7 ). The QoQ drop also contrasts sharply with our expectation of QoQ increase in HBM revenue in 3Q26 ( Exhibit 8 ). Regression finds that the export value suggests only US$5.6B HBM revenue by SK hynix in 3Q26, ~20% below 2Q26 and 55% below our forecast, which would also put it behind Samsung ( Exhibit 9 ). SK hynix’s monthly seasonality was much more balanced than Samsung’s, meaning it is less likely to significant rebound in Aug and Sep exports (Exhibit 10 ). We think the light Jul data is likely related to the delayed HBM4 shipment which SK hynix also alluded to in its earnings (see takeaway ), and this delay is likely due to the delay of NVIDIA Rubin. So we think it is still possible to see more meaningful recovery later this quarter. We also note if we apply the most backend loaded seasonality (2Q24) since 2024, SK hynix’s 3Q26 HBM revenue may reach US$12B, similar to our estimate. All things considered, data still suggested that SK hynix HBM growth momentum will likely fall below our expectation and its market share perhaps will drop below Samsung’s. GLOBAL MEMORY 3 on 21-Aug-2026 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 EXHIBIT 1: Being a close proxy for HBM shipment, Korea multichip memory export to Taiwan and Malaysia remained robust in Jul, rising 13% QoQ. 4.26.1 .%8319%164% -200%-100%0%100%200%300%400%500%600%700%800%900% 0.01.02.03.04.05.06.07.0 Jan-22 Apr-22 Jul-22 Oct-22 Jan-23 Apr-23 Jul-23 Oct-23 Jan-24 Apr-24 Jul-24 Oct-24 Jan-25 Apr-25 Jul-25 Oct-25 Jan-26 Apr-26 Jul-26 YoYUS$BKorea Multichip Memory Export to TW+MY TW+MY YoY Source: Korea Custom Service, KITA, company reports and Bernstein analysis EXHIBIT 2: Export from S. Chungcheong was down 35% MoM but up 122% QoQ vs. Apr. 05001,0001,5002,0002,5003,0003,5004,000 Jan-22 Apr-22 Jul-22 Oct-22 Jan-23 Apr-23 Jul-23 Oct-23 Jan-24 Apr-24 Jul-24 Oct-24 Jan-25 Apr-25 Jul-25 Oct-25 Jan-26 Apr-26 Jul-26US$MMultichip Memory Export from S. Chungcheong to TW+MY vs Samsung HBM Revenue S. Chungcheong Export Samsung HBM (Qtrly/3) Samsung HBM revenue in 3Q26 is Bernstein estimate Source: Korea Custom Service, KITA, company reports, Bernstein estimates and analysis GLOBAL MEMORY 4 on 21-Aug-2026 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 EXHIBIT 3: The data was notably higher than Apr’s, possibly indicating Samsung 3Q26 HBM revenue to be ahead of our projection. 0.01.02.03.04.05.06.07.08.09.010.0 1Q22 2Q22 3Q22 4Q22 1Q23 2Q23 3Q23 4Q23 1Q24 2Q24 3Q24 4Q24 1Q25 2Q25 3Q25 4Q25 1Q26 2Q26 3Q26US$BQtrly Samsung HBM Revenue vs. 1st Month Multichip Memory Export from S. Chungcheong to TW+MY S. e of the conventional DRAM price hike. The blended average might have even declined YoY when we consider SK hynix’s larger scale in HBM and the falling value per weight trend for the company. That said, we believe that suppliers and customers are negotiating the HBM contracts and prices for 2027 now. We expect this to trigger an upward revision for 2027 earnings, and this will also support memory stock prices in the near term. EXHIBIT 11: Value per weight continued to surge substantially at Samsung but remained more or less flattish at SK hynix, suggesting an earlier and faster ramp up of HBM4 at Samsung. 01002003004005006007008009001000 Jan-22 Apr-22 Jul-22 Oct-22 Jan-23 Apr-23 Jul-23 Oct-23 Jan-24 Apr-24 Jul-24 Oct-24 Jan-25 Apr-25 Jul-25 Oct-25 Jan-26 Apr-26 Jul-26US$K/KgKorea Multichip Memory Export Value per Weight to TW+MY S. Chungcheong Export N. Chungcheong Export + Icheon Export Other Provinces Source: Korea Custom Service, KITA and Bernstein analysis Export to Malaysia stayed high in Jul despite seasonality headwinds. It is likely for Intel EMIB, but we wonder why the increase happened so early. Besides that we found no sign of new HBM packaging sites in Korea or new export destination countries. •Korea total multichip memory export to all countries was US$10.1B in Jul, down 20% MoM on seasonality but up 24% QoQ, thanks to both growth in HBM and also surging prices of conventional memory. Taiwan and Malaysia accounted for 41% of the total export, down QoQ from 45% in Apr, as price increase made conventional memory export value to other destinations rise more ( Exhibit 12 ). Looking at export value per weight chart, Taiwan and Malaysia continued to lead other destinations by a wide margin, and hence we continued to only include Taiwan and Malaysia as the primary destination of HBM export from Korea ( Exhibit 13 ). Expo", "status": "extracted"}, "post:2026-08-22T16-57:25f107de51f7": {"id": "post:2026-08-22T16-57:25f107de51f7", "kind": "post", "title": "2026-08-22 16:57", "source_label": "帖子正文", "excerpt": "长存：#从国产替代追赶到全球技术领跑，重视产业链投资机会【华西机械】 #1、从国产替代的追赶到全球技术领跑！25年底长鑫招股书披露，这是第一次中国硬科技给资本市场的强烈震撼，更多集中在爆炸的财报数据，客观来说当下国内DRAM技术仍处于追赶的阶段！", "content": "长存：#从国产替代追赶到全球技术领跑，重视产业链投资机会【华西机械】 #1、从国产替代的追赶到全球技术领跑！25年底长鑫招股书披露，这是第一次中国硬科技给资本市场的强烈震撼，更多集中在爆炸的财报数据，客观来说当下国内DRAM技术仍处于追赶的阶段！#不同于长鑫，#长存则实现了全球技术领先与财务利润双重炸裂的震撼！1）22 年长存推出 Xtacking 3.0 技术，成为全球首批推出 200 层以上 3D NAND Flash 产品的企业，首次领先世界先进水平，#重塑全球3DNAND 技术发展路线！#25年成为中国大陆为数不多的与国际头部厂商达成专利交叉授权的集成电路企业（三星等巨头绕不开公司专利）！2）26Q1公司营收470亿元，归母净利润334亿元，同样显著超过长鑫营收/净利润体量！我们注意达到早在24年长存已经实现盈利，甚至优于同期铠侠、美光等海外巨头，一定程度折射出本土NAND龙头的成本优势！ #2、长存具备较大扩产空间，持续利好设备CAPEX！1）整体上看，26Q1全球NAND FLASH销售金额预计超过450亿美元，以此估算长存全球份额10-15%；细分看，#26Q1长存固态硬盘（企业级、消费级、个人等）占比仅10%，#而同期铠侠数据中心/SSD（企业/PC）收入占比超过60%！很容易得出一个结论：国产替代+AI产业红利，长存具备更大的成长弹性，依赖于持续的扩产！2）25/26Q1长存经营现金流金额高达327亿、267亿元，叠加自身爆炸的盈利能力，26-27年其加速扩产，同时我们产业跟踪到其四期、五期同步建设，电子大宗气体招标很快落地！3）从存储技术的演进看：不止3D NAND FLASH，后续3D DRAM也是大的技术演进方向，我们有理由相信长存在DRAM领域的技术布局，同样产业可以得到验证！ #3、备品备件是半导体设备一个重要的成长逻辑！1）目前二级市场仅以新设备需求算空间，而忽略了后市场对设备公司市值远期弹性！以LAM、AMAT为例，最新财年客户支持及相关收入占比达到36%、23%，且持续稳定增长！2）梳理长存主要原材料采购发现：#备品备件占比持续提升，23-26Q1其相关收入占比41%、49%、52%、59%，我们判断拓荆、华创、中微等龙头公司后续备品备件订单量可以得到印证，给设备公司中长期市值再造30%以上！投资建议：长存敞口/份额较高的重点推荐#拓荆、华创、中微、京仪、广钢、华海等，长存有望实现0-1突破的重点推荐#精测+芯源微！#文字观点", "publish_time": "2026-08-22 16:57", "tags": ["重塑全球3D", "文字观点"]}, "post:2026-08-22T16-58:9fbf23e719a2": {"id": "post:2026-08-22T16-58:9fbf23e719a2", "kind": "post", "title": "2026-08-22 16:58", "source_label": "帖子正文", "excerpt": "伯恩斯坦 —— 韩国存储出口追踪（7 月）：三星 HBM4 持续上量，SK 海力士因 Rubin 延期承压？整体 HBM 出口表现稳健，虽受季节性因素影响环比降 32%，但较 4 月仍环比增 13%，同比大增 64%。", "content": "伯恩斯坦 —— 韩国存储出口追踪（7 月）：三星 HBM4 持续上量，SK 海力士因 Rubin 延期承压？ 整体 HBM 出口表现稳健，虽受季节性因素影响环比降 32%，但较 4 月仍环比增 13%，同比大增 64%。 三星 HBM4 上量超预期，份额有望反超 三星 HBM 出口强势，其 HBM 封装所在地忠清南道的 7 月出口较 4 月环比暴增 122%。 回归模型预测三星 2026 年三季度 HBM 收入将环比增长 80% 至 120 亿美元，较伯恩斯坦此前预期高出 30%。 支撑信号来自 “单位重量出口价值”：三星该指标 7 月环比再涨 21%，较 4 月已翻倍，是 SK 海力士同期的近 4 倍，印证其 HBM4 出货更早、定价显著高于 HBM3/3E。 叠加出口季节性特征（季度内后两个月出口占比更高），8‑9 月三星 HBM 出口有望继续冲高，三季度大概率夺回 HBM 市场份额第一。 SK 海力士受 Rubin 延期拖累，后续或迎修复 SK 海力士表现弱于预期：其 HBM 主要产地忠清北道和利川市的 7 月出口环比、较 4 月均下滑 27%。 回归模型预测其三季度 HBM 收入将环比降 20% 至 56 亿美元，较预期低 55%，规模将落后于三星。 下滑主要源于英伟达 Rubin 芯片延期导致 HBM4 出货节奏后移，SK 海力士虽已在二季度开始 HBM4 量产，但 7 月单位重量出口价值仅微升，暂未体现大规模 HBM4 出货。 不过伯恩斯坦认为其 HBM4 上量将在年内逐步兑现，后续有望收复部分份额。 其他关键观察 HBM 价格独立于传统存储：传统存储价格自 2025 年三季度以来涨约 5 倍，但 HBM 价格整体保持平稳，当前溢价主要来自产品结构升级（HBM4 占比提升）而非同规格涨价，2027 年 HBM 合约价谈判已启动，有望成为明年盈利上修的催化剂。 马来西亚出口持续高增：7 月韩国对马来西亚多芯片存储出口环比再增 20% 至 13 亿美元，创高位，主要受益英特尔 EMIB 先进封装需求，三星是主要贡献方，也反映其 HBM 客户认可度持续拓宽。 投资评级与风险提示：伯恩斯坦维持三星电子、SK 海力士、美光 “跑赢大盘” 评级，目标价分别为 44 万韩元、330 万韩元、1300 美元；因 NAND 领域中国公司竞争压力，维持铠侠 “跑输大盘” 评级，目标价 4000 日元，认为其当前估值仍偏高。 短期存储价格上行与 HBM 盈利上修将支撑板块情绪，长期需跟踪长鑫存储、长江存储的技术与产能进展。#文字观点", "publish_time": "2026-08-22 16:58", "tags": ["文字观点"]}, "post:2026-08-22T19-27:0871e5ed5434": {"id": "post:2026-08-22T19-27:0871e5ed5434", "kind": "post", "title": "2026-08-22 19:27", "source_label": "帖子正文", "excerpt": "雅创电子模拟沙龙交流要点更新#行业景气模拟进入上行周期，AI是核心驱动。光模块最火，800G快速跑量、1.6T开始布局", "content": "雅创电子模拟沙龙交流要点更新#行业景气模拟进入上行周期，AI是核心驱动。光模块最火，800G快速跑量、1.6T开始布局；汽车、机器人、阳台储能需求向上，消费相对偏弱。渠道2027年指标较2026年保守翻1.5倍，增长确定性较高。#价格结构性涨价而非普涨，芯片厂商主要逐料号、逐客户谈判。国产模拟龙头已发涨价函，某模拟厂商部分料号最高涨80%，某料号涨幅达39%；某功率厂商平均涨15%、部分涨30%。当前看26H2-27H1价格趋势向上。#产能8寸晶圆极度紧缺，国内厂商交期波动较大，TI部分料号交期达98周，但交付确定性更高。#国产替代LDO、运放、比较器、驱动等中低端产品替代较快；ADC、DAC、AFE等高端模拟国产替代仍处早期；DrMOS及多相控制器技术门槛高、主要用于服务器。车规通用料国产化率已升至30-50%，欧美厂商在华份额持续承压。#南芯起家集成MOS芯片、电荷泵做到全球第一；自研BCD工艺，2020年与中芯签长期战略合作。DrMOS公司目标2028-29年做到国内1/3份额；2028年前后迎放量节点，2030年汽车/AI/消费/工业均衡、海外占比30%+，4-5年冲击100亿收入，稳态毛利率 50%、净利率 20%。汽车业务2023年3000万、2025年达到2亿、2026年目标再翻倍。另布局HBM第四代独立供电LDO+DrMOS、SOCAMM、企业级SSD电荷泵等存储电源。#雅创电子分销+模拟设计双轮：2019年收韩国Tamul、2022-23年收欧创芯，2025年参股类比。模拟设计营收2025年约3.5亿，重点布局智能驱动、eFuse、马达。2027年模拟收入确定性翻倍。分销端2026H1代理收入已达2025全年，村田订单为2017年以来最旺；存储代理拥有铠侠/南亚/海力士/国内原厂等资源，同样实现爆发式增长。#文字观点", "publish_time": "2026-08-22 19:27", "tags": ["行业景气", "价格", "产能", "国产替代", "南芯", "雅创电子", "文字观点"]}, "attachment:files/Bernstein-全球存储：韩国 7 月存储出口跟踪：三星持续扩产 HBM4，但 SK 海力士受 Rubin 项目拖累？ Global Memory Korea Memory Export Tracker (Jul) Samsung continued ramping HBM4, but SK hynix delayed by Rubin？.pdf": {"id": "attachment:files/Bernstein-全球存储：韩国 7 月存储出口跟踪：三星持续扩产 HBM4，但 SK 海力士受 Rubin 项目拖累？ Global Memory Korea Memory Export Tracker (Jul) Samsung continued ramping HBM4, but SK hynix delayed by Rubin？.pdf", "kind": "attachment", "title": "Bernstein-全球存储：韩国 7 月存储出口跟踪：三星持续扩产 HBM4，但 SK 海力士受 Rubin 项目拖累？ Global Memory Korea Memory Export Tracker (Jul) Samsung continued ramping HBM4, but SK hynix delayed by Rubin？", "source_label": "Bernstein", "excerpt": "21 August 2026 Global Memory Korea Memory Export Tracker (Jul): Samsung continued ramping HBM4, but SK hynix delayed by Rubin?Mark Li +852 2123 2645 mark.li@bernsteinsg.com Edward ", "content": "21 August 2026 Global Memory Korea Memory Export Tracker (Jul): Samsung continued ramping HBM4, but SK hynix delayed by Rubin? Mark Li +852 2123 2645 mark.li@bernsteinsg.com Edward Hou, CFA +852 2123 2623 edward.hou@bernsteinsg.com Yipin Cai, CFA +852 2123 2669 yipin.cai@bernsteinsg.comWe track the Korea export data as it is a good early indicator for Samsung’s & SK hynix’s HBM revenue in the same quarter, and update this tracker with the Jul data. Details of our methodology can be found in our prior note . The dataset can be downloaded at this link. Overall HBM export remained robust, up 13% QoQ vs. Apr. It retreated by 32% MoM on seasonality but still went up 13% QoQ. YoY increase was also solid at 64%. Data suggested Samsung 3Q26 HBM revenue could beat our estimates. Export from S. Chungcheong (where Samsung packages HBM) was up 122% QoQ vs Apr. And it suggests Samsung’s 3Q26 HBM revenue to rise 80% QoQ, & 30% ahead of our forecast. Export for SK hynix was surprisingly weak. Export from N. Chungcheong & Icheon was down ~27% MoM & QoQ, and regression predicts SK hynix 2Q26 HBM revenue to fall 20% QoQ, significantly below our estimates. We attribute it to the delayed HBM4 shipment for Rubin, but believe its HBM4 shipment should catch up in later months. Samsung still led in HBM4 shipment, & perhaps with price notably above HBM3/3E’s. As HBM has much higher dollar value per weight, we track “value per weigh” as it may be directionally suggestive of HBM price change. Jul “value per weight” rose another 21% MoM for Samsung but only mildly for SK hynix, signaling earlier HBM4 shipment by Samsung. Samsung’s “value per weigh” has also doubled from the prior level, suggesting price perhaps improving notably from HBM3/3E to 4. Data showed HBM price has been insulated from the volatility of conventional memory price. Conventional memory price surged, but SK hynix’s HBM price, as suggested by value per weight, largely stayed in the same range as before. Export to Malaysia exhibited continued strength. It rose further to US$1.3B in Jul, with Samsung staying high but increase mainly from SK hynix. Generally export to Malaysia has been growing meaningfully over the past few quarters. We assume it’s for Intel’s EMIB but are puzzled why HBM import rose so early. Overall Jul data came in strong for Samsung but surprisingly weak for SK hynix. Jul data suggests Samsung HBM revenue can substantially outgrow SK hynix in 3Q26, and likely claim market share lead too. This is in line with our view of improving HBM4 position by Samsung. That said we think SK hynix HBM4 ramp should eventually happen this year and help gain some share back. Additionally, HBM contract price increase next year should trigger an upward revision for 2027 for both. Conventional memory price rise should continue in 3Q26 and HBM price increase should bring earnings revisions. We see continued price increase in 3Q27 & also HBM price hike in 2027. We remain structurally constructive on Samsung, SK hynix & Micron but cautious on KIOXIA on China competition (see our sector update ). Our detailed SOTP valuation also finds KIOXIA over-valued. See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 21 Aug 2026 02:52 UTC Completion Date: 21 Aug 2026 02:52 UTC on 21-Aug-2026 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 BERNSTEIN TICKER TABLE 20 Aug 2026TTM Reported EPS Reported P/E (x) Closing Price Rel. Ticker Rating Cur Price Target Perf. Cur 2025A 2026E 2027E 2025A 2026E 2027E 005930.KS (SEC- Samsung) O KRW 273,000 440,000 255.5% KRW 6,611.53 48,393 77,273 41.3 5.6 3.5 005935.KS (SEC-Pref - Samsung)O KRW 191,200 374,000 197.9% KRW 6,611.53 48,393 77,273 28.9 4.0 2.5 SMSN.LI (Samsung) O USD 4,822.00 7,350.00 251.3% USD 116.15 812.39 1,290.80 41.5 5.9 3.7 000660.KS (SK hynix) O KRW 1,710,000 3,300,000 566.7% KRW 60,341 395,677 568,862 28.3 4.3 3.0 MU (Micron) O USD 974.33 1,300.00 711.8% USD 8.29 67.39 158.99 117.6 14.5 6.1 285A.JP (KIOXIA) U JPY 52,950 40,000 2166.0% JPY 1,014.00 10,013 9,656.84 52.2 5.3 5.5 ASIAX 1,954.75 EM 1,814.53 SPX 7,641.16 O - Outperform, M - Market-Perform, U - Underperform, NR - Not Rated, CS - Coverage Suspended MU estimate is Adjusted EPS; MU valuation is Adjusted P/E (x); Source: Bloomberg, Bernstein estimates and analysis. INVESTMENT IMPLICATIONS Samsung Electronics: We rate Samsung Electronics Outperform with price target of KRW 440,000. SK hynix : We rate SK hynix Outperform with price target of KRW 3,300,000. GLOBAL MEMORY 2 on 21-Aug-2026 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 DETAILS Korea Customs Service has released export data for Jul. As our previous note found, the export data for certain memory products bears close correlation with HBM revenues of Samsung and SK hynix. We hence track the monthly data to provide investors a preview on HBM revenues from the two companies in the same quarter. Details of our methodology can be found in the previous note . You may also download the export data at this link . Jul export data suggested faster than expected growth of Samsung HBM revenue into 3Q26. On the other hand, SK hynix’s 3Q26 HBM revenue may fall below our projection and also below Samsung’s in 3Q26. •Jul Korea total multichip memory export to Taiwan and Malaysia was down by 32% MoM, from Jun’s historical high. The dip was most likely due to seasonality and QoQ growth (vs Apr) actually continued at 13% and YoY growth also remained strong at 64% YoY ( Exhibit 1 ). As we analyzed before, multichip memory export to Taiwan and Malaysia tracked closely with HBM revenues of Samsung and SK hynix and therefore the Jul data indicated continued strong and accelerating momentum into 3Q26. •If we focus on the export from S. Chungcheong Province, where Samsung’s back-end fabs are and likely where its HBM is packaged, Jul export remained very robust at US$2.2B. It was down 35% MoM from the seasonally high in Jun but up 122% QoQ from Apr. And we also note that Jul single month export by Samsung remained higher than SK hynix, for the second consecutive month since Jun ( Exhibit 2 ). The QoQ increase in Jul export was strong ( Exhibit 3 ), and according to the regression using historical data, the Jul data suggested ~US$12B in HBM revenue for Samsung in 3Q26, notably ahead of our estimate of US$9.3B by ~30%, and represented ~80% QoQ growth ( Exhibit 4 ). If we run the regression using only data points from 1Q25, the predicted 3Q26 HBM revenue would be even a bit higher at $12.6B ( Exhibit 5 ). Samsung’s HBM export monthly seasonality has consistently been very backend loaded since 1Q25, with first month of quarter averaging less than 20% of quarterly total, and should 3Q26 follow the same pattern, we should see meaningful increases in Aug and Sep exports ( Exhibit 6 ). Overall Samsung’s HBM export has been stronger than our expectation in recent months, and does align with Samsung’s guidance of the rapid ramp of HBM4 sales in 2H26. We hence remain positive on Samsung’s HBM share gain this year (see Samsung 2Q26 earnings takeaway ). •For SK hynix, we have identified that its HBM export should come nearly all from N. Chungchoeng Province and Icheon City, where its wafer fabs are. In contrast to Samsung, hynix’s Jul export data was much weaker, dropping by 28% MoM and also 27% QoQ (vs Apr) ( Exhibit 7 ). The QoQ drop also contrasts sharply with our expectation of QoQ increase in HBM revenue in 3Q26 ( Exhibit 8 ). Regression finds that the export value suggests only US$5.6B HBM revenue by SK hynix in 3Q26, ~20% below 2Q26 and 55% below our forecast, which would also put it behind Samsung ( Exhibit 9 ). SK hynix’s monthly seasonality was much more balanced than Samsung’s, meaning it is less likely to significant rebound in Aug and Sep exports (Exhibit 10 ). We think the light Jul data is likely related to the delayed HBM4 shipment which SK hynix also alluded to in its earnings (see takeaway ), and this delay is likely due to the delay of NVIDIA Rubin. So we think it is still possible to see more meaningful recovery later this quarter. We also note if we apply the most backend loaded seasonality (2Q24) since 2024, SK hynix’s 3Q26 HBM revenue may reach US$12B, similar to our estimate. All things considered, data still suggested that SK hynix HBM growth momentum will likely fall below our expectation and its market share perhaps will drop below Samsung’s. GLOBAL MEMORY 3 on 21-Aug-2026 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 EXHIBIT 1: Being a close proxy for HBM shipment, Korea multichip memory export to Taiwan and Malaysia remained robust in Jul, rising 13% QoQ. 4.26.1 .%8319%164% -200%-100%0%100%200%300%400%500%600%700%800%900% 0.01.02.03.04.05.06.07.0 Jan-22 Apr-22 Jul-22 Oct-22 Jan-23 Apr-23 Jul-23 Oct-23 Jan-24 Apr-24 Jul-24 Oct-24 Jan-25 Apr-25 Jul-25 Oct-25 Jan-26 Apr-26 Jul-26 YoYUS$BKorea Multichip Memory Export to TW+MY TW+MY YoY Source: Korea Custom Service, KITA, company reports and Bernstein analysis EXHIBIT 2: Export from S. Chungcheong was down 35% MoM but up 122% QoQ vs. Apr. 05001,0001,5002,0002,5003,0003,5004,000 Jan-22 A export value per weight rose MoM but only modestly and the overall trend remained flattish. We hence conclude no sign of meaningful HBM4 shipment in the mix. And it was likely due to the slight delay of NVIDIA Rubin, though SK hynix guided that HBM4 has already begun mass production in 2Q26 and will enter full ramp in 2H26. And hence we should see value per weight rising more notably in coming months. •Another important observation is while the price of conventional memory has increased ~5x since 3Q25, the data suggested that of HBM has been much steadier. Export value per weight from S.Chungcheong has been better thanks to Samsung’s earlier HBM4 shipment & hence mix improvement, rather than a like-for-like HBM price hike. And the improvement vs. the prior level thus far has been only 2x, still significantly below the size of the conventional DRAM price hike. The blended average might have even declined YoY when we consider SK hynix’s larger scale in HBM and the falling value per weight trend for the company. That said, we believe that suppliers and customers are negotiating the HBM contracts and prices for 2027 now. We expect this to trigger an upward revision for 2027 earnings, and this will also support memory stock prices in the near term. EXHIBIT 11: Value per weight continued to surge substantially at Samsung but remained more or less flattish at SK hynix, suggesting an earlier and faster ramp up of HBM4 at Samsung. 01002003004005006007008009001000 Jan-22 Apr-22 Jul-22 Oct-22 Jan-23 Apr-23 Jul-23 Oct-23 Jan-24 Apr-24 Jul-24 Oct-24 Jan-25 Apr-25 Jul-25 Oct-25 Jan-26 Apr-26 Jul-26US$K/KgKorea Multichip Memory Export Value per Weight to TW+MY S. Chungcheong Export N. Chungcheong Export + Icheon Export Other Provinces Source: Korea Custom Service, KITA and Bernstein analysis Export to Malaysia stayed high in Jul despite seasonality headwinds. It is likely for Intel EMIB, but we wonder why the increase happened so early. Besides that we found no sign of new HBM packaging sites in Korea or new export destination countries. •Korea total multichip memory export to all countries was US$10.1B in Jul, down 20% MoM on seasonality but up 24% QoQ, thanks to both growth in HBM and also surging prices of conventional memory. Taiwan and Malaysia accounted for 41% of the total export, down QoQ from 45% in Apr, as price increase made conventional memory export value to other destinations rise more ( Exhibit 12 ). Looking at export value per weight chart, Taiwan and Malaysia continued to lead other destinations by a wide margin, and hence we continued to only include Taiwan and Malaysia as the primary destination of HBM export from Korea ( Exhibit 13 ). Expo", "status": "extracted"}, "attachment:files/Bernstein-韩国存储出口追踪（7月）：三星HBM4持续上量，SK海力士因Rubin延期承压？.pdf": {"id": "attachment:files/Bernstein-韩国存储出口追踪（7月）：三星HBM4持续上量，SK海力士因Rubin延期承压？.pdf", "kind": "attachment", "title": "Bernstein-韩国存储出口追踪（7月）：三星HBM4持续上量，SK海力士因Rubin延期承压？", "source_label": "Bernstein", "excerpt": "21 August 2026 Global Memory Korea Memory Export Tracker (Jul): Samsung continued ramping HBM4, but SK hynix delayed by Rubin?Mark Li +852 2123 2645 mark.li@bernsteinsg.com Edward ", "content": "21 August 2026 Global Memory Korea Memory Export Tracker (Jul): Samsung continued ramping HBM4, but SK hynix delayed by Rubin? Mark Li +852 2123 2645 mark.li@bernsteinsg.com Edward Hou, CFA +852 2123 2623 edward.hou@bernsteinsg.com Yipin Cai, CFA +852 2123 2669 yipin.cai@bernsteinsg.comWe track the Korea export data as it is a good early indicator for Samsung’s & SK hynix’s HBM revenue in the same quarter, and update this tracker with the Jul data. Details of our methodology can be found in our prior note . The dataset can be downloaded at this link. Overall HBM export remained robust, up 13% QoQ vs. Apr. It retreated by 32% MoM on seasonality but still went up 13% QoQ. YoY increase was also solid at 64%. Data suggested Samsung 3Q26 HBM revenue could beat our estimates. Export from S. Chungcheong (where Samsung packages HBM) was up 122% QoQ vs Apr. And it suggests Samsung’s 3Q26 HBM revenue to rise 80% QoQ, & 30% ahead of our forecast. Export for SK hynix was surprisingly weak. Export from N. Chungcheong & Icheon was down ~27% MoM & QoQ, and regression predicts SK hynix 2Q26 HBM revenue to fall 20% QoQ, significantly below our estimates. We attribute it to the delayed HBM4 shipment for Rubin, but believe its HBM4 shipment should catch up in later months. Samsung still led in HBM4 shipment, & perhaps with price notably above HBM3/3E’s. As HBM has much higher dollar value per weight, we track “value per weigh” as it may be directionally suggestive of HBM price change. Jul “value per weight” rose another 21% MoM for Samsung but only mildly for SK hynix, signaling earlier HBM4 shipment by Samsung. Samsung’s “value per weigh” has also doubled from the prior level, suggesting price perhaps improving notably from HBM3/3E to 4. Data showed HBM price has been insulated from the volatility of conventional memory price. Conventional memory price surged, but SK hynix’s HBM price, as suggested by value per weight, largely stayed in the same range as before. Export to Malaysia exhibited continued strength. It rose further to US$1.3B in Jul, with Samsung staying high but increase mainly from SK hynix. Generally export to Malaysia has been growing meaningfully over the past few quarters. We assume it’s for Intel’s EMIB but are puzzled why HBM import rose so early. Overall Jul data came in strong for Samsung but surprisingly weak for SK hynix. Jul data suggests Samsung HBM revenue can substantially outgrow SK hynix in 3Q26, and likely claim market share lead too. This is in line with our view of improving HBM4 position by Samsung. That said we think SK hynix HBM4 ramp should eventually happen this year and help gain some share back. Additionally, HBM contract price increase next year should trigger an upward revision for 2027 for both. Conventional memory price rise should continue in 3Q26 and HBM price increase should bring earnings revisions. We see continued price increase in 3Q27 & also HBM price hike in 2027. We remain structurally constructive on Samsung, SK hynix & Micron but cautious on KIOXIA on China competition (see our sector update ). Our detailed SOTP valuation also finds KIOXIA over-valued. See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 21 Aug 2026 02:52 UTC Completion Date: 21 Aug 2026 02:52 UTC Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 BERNSTEIN TICKER TABLE 20 Aug 2026TTM Reported EPS Reported P/E (x) Closing Price Rel. Ticker Rating Cur Price Target Perf. Cur 2025A 2026E 2027E 2025A 2026E 2027E 005930.KS (SEC- Samsung) O KRW 273,000 440,000 255.5% KRW 6,611.53 48,393 77,273 41.3 5.6 3.5 005935.KS (SEC-Pref - Samsung)O KRW 191,200 374,000 197.9% KRW 6,611.53 48,393 77,273 28.9 4.0 2.5 SMSN.LI (Samsung) O USD 4,822.00 7,350.00 251.3% USD 116.15 812.39 1,290.80 41.5 5.9 3.7 000660.KS (SK hynix) O KRW 1,710,000 3,300,000 566.7% KRW 60,341 395,677 568,862 28.3 4.3 3.0 MU (Micron) O USD 974.33 1,300.00 711.8% USD 8.29 67.39 158.99 117.6 14.5 6.1 285A.JP (KIOXIA) U JPY 52,950 40,000 2166.0% JPY 1,014.00 10,013 9,656.84 52.2 5.3 5.5 ASIAX 1,954.75 EM 1,814.53 SPX 7,641.16 O - Outperform, M - Market-Perform, U - Underperform, NR - Not Rated, CS - Coverage Suspended MU estimate is Adjusted EPS; MU valuation is Adjusted P/E (x); Source: Bloomberg, Bernstein estimates and analysis. INVESTMENT IMPLICATIONS Samsung Electronics: We rate Samsung Electronics Outperform with price target of KRW 440,000. SK hynix : We rate SK hynix Outperform with price target of KRW 3,300,000. GLOBAL MEMORY 2 fYuZkVMBvXqPqPtMaQ8Q9PpNpPnPsMfQpPwOeRtRpO9PnMpOwMrNoQNZmNsM Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 DETAILS Korea Customs Service has released export data for Jul. As our previous note found, the export data for certain memory products bears close correlation with HBM revenues of Samsung and SK hynix. We hence track the monthly data to provide investors a preview on HBM revenues from the two companies in the same quarter. Details of our methodology can be found in the previous note . You may also download the export data at this link . Jul export data suggested faster than expected growth of Samsung HBM revenue into 3Q26. On the other hand, SK hynix’s 3Q26 HBM revenue may fall below our projection and also below Samsung’s in 3Q26. •Jul Korea total multichip memory export to Taiwan and Malaysia was down by 32% MoM, from Jun’s historical high. The dip was most likely due to seasonality and QoQ growth (vs Apr) actually continued at 13% and YoY growth also remained strong at 64% YoY ( Exhibit 1 ). As we analyzed before, multichip memory export to Taiwan and Malaysia tracked closely with HBM revenues of Samsung and SK hynix and therefore the Jul data indicated continued strong and accelerating momentum into 3Q26. •If we focus on the export from S. Chungcheong Province, where Samsung’s back-end fabs are and likely where its HBM is packaged, Jul export remained very robust at US$2.2B. It was down 35% MoM from the seasonally high in Jun but up 122% QoQ from Apr. And we also note that Jul single month export by Samsung remained higher than SK hynix, for the second consecutive month since Jun ( Exhibit 2 ). The QoQ increase in Jul export was strong ( Exhibit 3 ), and according to the regression using historical data, the Jul data suggested ~US$12B in HBM revenue for Samsung in 3Q26, notably ahead of our estimate of US$9.3B by ~30%, and represented ~80% QoQ growth ( Exhibit 4 ). If we run the regression using only data points from 1Q25, the predicted 3Q26 HBM revenue would be even a bit higher at $12.6B ( Exhibit 5 ). Samsung’s HBM export monthly seasonality has consistently been very backend loaded since 1Q25, with first month of quarter averaging less than 20% of quarterly total, and should 3Q26 follow the same pattern, we should see meaningful increases in Aug and Sep exports ( Exhibit 6 ). Overall Samsung’s HBM export has been stronger than our expectation in recent months, and does align with Samsung’s guidance of the rapid ramp of HBM4 sales in 2H26. We hence remain positive on Samsung’s HBM share gain this year (see Samsung 2Q26 earnings takeaway ). •For SK hynix, we have identified that its HBM export should come nearly all from N. Chungchoeng Province and Icheon City, where its wafer fabs are. In contrast to Samsung, hynix’s Jul export data was much weaker, dropping by 28% MoM and also 27% QoQ (vs Apr) ( Exhibit 7 ). The QoQ drop also contrasts sharply with our expectation of QoQ increase in HBM revenue in 3Q26 ( Exhibit 8 ). Regression finds that the export value suggests only US$5.6B HBM revenue by SK hynix in 3Q26, ~20% below 2Q26 and 55% below our forecast, which would also put it behind Samsung ( Exhibit 9 ). SK hynix’s monthly seasonality was much more balanced than Samsung’s, meaning it is less likely to significant rebound in Aug and Sep exports (Exhibit 10 ). We think the light Jul data is likely related to the delayed HBM4 shipment which SK hynix also alluded to in its earnings (see takeaway ), and this delay is likely due to the delay of NVIDIA Rubin. So we think it is still possible to see more meaningful recovery later this quarter. We also note if we apply the most backend loaded seasonality (2Q24) since 2024, SK hynix’s 3Q26 HBM revenue may reach US$12B, similar to our estimate. All things considered, data still suggested that SK hynix HBM growth momentum will likely fall below our expectation and its market share perhaps will drop below Samsung’s. GLOBAL MEMORY 3 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 EXHIBIT 1: Being a close proxy for HBM shipment, Korea multichip memory export to Taiwan and Malaysia rema  MEMORY 7 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 surging very strongly by another 21% MoM and was already more than double vs. Apr & nearly 4x vs. SK hynix’s Jul data (Exhibit 11 ). We believe this was most likely driven by rising shipment of HBM4, which should command notably higher value per weight than HBM3/3E. Samsung guided its HBM4 sales to >3x QoQ in 3Q26 and to account for well over 60% of its total HBM sales in 2H26, and the export data has been well supporting the guidance. •For SK hynix, export value per weight rose MoM but only modestly and the overall trend remained flattish. We hence conclude no sign of meaningful HBM4 shipment in the mix. And it was likely due to the slight delay of NVIDIA Rubin, though SK hynix guided that HBM4 has already begun mass production in 2Q26 and will enter full ramp in 2H26. And hence we should see value per weight rising more notably in coming months. •Another important observation is while the price of conventional memory has increased ~5x since 3Q25, the data suggested that of HBM has been much steadier. Export value per weight from S.Chungcheong has been better thanks to Samsung’s earlier HBM4 shipment & hence mix improvement, rather than a like-for-like HBM price hike. And the improvement vs. the prior level thus far has been only 2x, still significantly below the size of the conventional DRAM price hike. The blended average might have even declined YoY when we consider SK hynix’s larger scale in HBM and the falling value per weight trend for the company. That said, we believe that suppliers and customers are negotiating the HBM contracts and prices for 2027 now. We expect this to trigger an upward revision for 2027 earnings, and this will also support memory stock prices in the near term. EXHIBIT 11: Value per weight continued to surge substantially at Samsung but remained more or less flattish at SK hynix, suggesting an earlier and faster ramp up of HBM4 at Samsung. 01002003004005006007008009001000 Jan-22 Apr-22 Jul-22 Oct-22 Jan-23 Apr-23 Jul-23 Oct-23 Jan-24 Apr-24 Jul-24 Oct-24 Jan-25 Apr-25 Jul-25 Oct-25 Jan-26 Apr-26 Jul-26US$K/KgKorea Multichip Memory Export Value per Weight to TW+MY S. Chungcheong Export N. Chungcheong Export + Icheon Export Other Provinces Source: Korea Custom Service, KITA and Bernstein analysis Export to Malaysia stayed high in Jul despite seasonality headwinds. It is likely for Intel EMIB, but we wonder why the increase happened so early. Besides that we found no sign of new HBM packaging sites in Korea or new export destination countries. •Korea total multichip memory export to all countries was US$10.1B in Jul, down 20% MoM on seasonality but up 24% QoQ, thanks to both growth in HBM and also surging prices of conventional memory. Taiwan and Malaysia accounted for 41% of the total export, down QoQ from 45% in Apr, as price increase made conventional memory export value to other destinations rise more ( Exhibit 12 ). Looking at export value per weight chart, Taiwan and Malaysia continued to lead other destinations by a wide margin, and hence we continued to only include Taiwan and Malaysia as the primary destination of HBM export from Kore", "status": "extracted"}, "post:2026-08-22T12-36:874173255d68": {"id": "post:2026-08-22T12-36:874173255d68", "kind": "post", "title": "2026-08-22 12:36", "source_label": "帖子正文", "excerpt": "全球烟草5年涨幅冠绝消费，增长型红利主线再迎催化【国金轻工&新消费】 中国HNB近期出现积极变化，政策与组织层面同步推进。7月28日，国家烟草专卖局组织起草的《加热卷烟》强制性国家标准征求意见稿于全国标准信息公共服务平台正式发布，征求意见期至9月26日。", "content": "全球烟草5年涨幅冠绝消费，增长型红利主线再迎催化【国金轻工&新消费】 中国HNB近期出现积极变化，政策与组织层面同步推进。7月28日，国家烟草专卖局组织起草的《加热卷烟》强制性国家标准征求意见稿于全国标准信息公共服务平台正式发布，征求意见期至9月26日。国内HNB产业从海外试销向规范化、标准化运营迈出关键一步，后续正式稿出台有望为产业放量奠定制度基础。同时，人事与组织机制出现边际变化，为产业规范化发展优化条件。 烟草板块表现亮眼，思摩尔国际发布2026H1业绩，多业务线释放积极信号。2026H1公司实现营收72.1亿元，同比+19.9%，创历史同期新高；经调整净利润（剔除吸入治疗业务亏损后）8.9亿元，同比+7.1%。①雾化业务受益水果口味监管政策边际趋严下大客户加速备货，，叠加欧洲一次性产品出清后换弹需求承接，下半年欧美雾化业务均有望提速。②HNB成长业务延续高增，H1实现营收9.6亿元，同比+322.1%，核心客户产品持续拓展全球市场，Q3有望进一步承接新客户增量。③降本增效叠加换弹占比提升驱动产品结构改善，盈利能力持续修复；同时公司首次明确雾化医疗为投资业务（H1亏损1.32亿元），未来研发核心投入将聚焦HNB，费用端有望持续优化。 【策略会预告】团队首席将于9月9日下午在上海策略会进行专题汇报——《从烟草涨幅5年冠绝全球消费，看增长型红利主线弹性》。 过去五年，全球烟草板块在消费品中涨幅持续领先，其底层逻辑在于：稳定的股息分红提供安全边际，新型烟草产品渗透打开内生增长空间，叠加头部企业优秀的经营质量与定价权，共同构筑了\"防御+成长\"的稀缺属性。 当前时点，国内HNB强制性国家标准征求意见稿已正式发布，产业规范化发展提速；中烟体系组织架构亦出现积极变化，出海协同与资本运作效率有望提升。新型烟草作为确定性极高的消费趋势，正处于政策催化与产业放量的关键窗口，产业链相关标的兼具业绩确定性与估值弹性，诚邀各位领导关注交流。 🔮国金轻纺家电新消费赵中平19867713319/毕先磊/储天舒/谢俪丹15750768025/叶秋含/单欣桐#文字观点", "publish_time": "2026-08-22 12:36", "tags": ["文字观点"]}, "post:2026-08-22T22-01:85cb508ff035": {"id": "post:2026-08-22T22-01:85cb508ff035", "kind": "post", "title": "2026-08-22 22:01", "source_label": "帖子正文", "excerpt": "进入垃圾时间？据统计，自1990年以来的历届中期选举年中，标普500指数在8月中旬至10月中旬期间出现至少-7%回撤的概率高达近90%（除2006年为少数平稳例外）。", "content": "进入垃圾时间？ 据统计，自1990年以来的历届中期选举年中，标普500指数在8月中旬至10月中旬期间出现至少-7%回撤的概率高达近90%（除2006年为少数平稳例外）。这段区间内的平均波段最大跌幅（Max Intra-period Drawdown）约为-10%至-14%。 一般来说，选举造成的政策不确定性是让市场趋向保守的主要原因，夏末流动性枯竭也是下跌的主要助力。 以今年的状况来看，似乎也不会太乐观：反AI（反对建设数据中心或加强审查）的公投与议员声势越来越高，对明年的建厂进度造成更大不确定性。国债与公司债持续发行并在市场吸金，加上故作神秘不知道在想啥的美联储，眼看殖利率就要持续创高。再加上股市从七月底的谷底也反弹了不少，似乎今年的选前修正很难不发生？ 最近整理了一些统计资料也不禁让我更加担心。Epoch用空拍图统计的美国明年大型数据中心完工只有5.x GW，比今年的8GW+大幅减少。Google和Meta公布的\"asset not in service\"显示，今年资本支出买的料件有40%+没有使用（也就是库存）。在我们讨论长短料问题一阵子后，发现明年最短的料可能是“电”。 其实这些不是新议题，在美国也讨论了一阵子，只是越接近选举，被再次拿来讨论的机会就增加不少。历史经验也提醒我们，这些疑虑大概选前就会在股价上反应大半，选后不确定性解除、利空出尽的概率反而增加。 在操作上，原本缺货涨价的产业不确定性会增加不少。但CSP以及BTM（表后供电）却可能是最大受惠族群。#文字观点", "publish_time": "2026-08-22 22:01", "tags": ["文字观点"]}, "attachment:files/广发证券-兴业证券(601377)泛财富与泛自营深化转型，加码ROE提升动能-260821.pdf": {"id": "attachment:files/广发证券-兴业证券(601377)泛财富与泛自营深化转型，加码ROE提升动能-260821.pdf", "kind": "attachment", "title": "广发证券-兴业证券(601377)泛财富与泛自营深化转型，加码ROE提升动能-260821", "source_label": "广发证券", "excerpt": "01 / 16 请务必阅读末页的免责声明 识别风险 价值 发现 [Table_IndustryAndDate]", "content": "01 / 16 请务必阅读末页的免责声明 识别风险 价值 发现 [Table_IndustryAndDate] 证券研究报告 | 中报点评 | 证券Ⅱ | 2026/08/21 [Table_Title] 兴业证券（ 601377.SH ） 泛财富与泛自营深化转型， 加码 ROE提升动能 [Table_Invest] 公司评级 买入 当前价格 5.78 元 合理价值 7.47 元 前次评级 买入 [Table_Summary] 业绩高增，杠杆与 ROE 显著提升。 公司披露 2026年中报，上半年营业收入 67.3亿元，同比 +24.5%； 归母净利润 21.29亿元，同比 +60%。26Q2单季度归母净利润 13.44亿元，同比 +65%，环比 +71%。 26H1管理费率降至 52.2%，较去年同期下滑 13.1pct。2026H1净资产同比 +2.2%、剔除代理款项杠杆 倍数升至 4.17倍，达到历史最高。年化 ROE升至 7.2%，较 2025年末上升 2.27个百分点。 重资产业务快速修复，财富资管明显回暖。 据公司利润表， 2026H1（1）投资净收益（含公允） 19.47 亿元，同比 +10%，占比 29%；（2）资管（含基金）收入 13.1亿元，同比 +28%；兴证资管坚持 “固定 收益+多元资产 ”（E&FICC）的发展方向，管理规模同比 +10%；兴全基金公募基金规模达到 8492亿元， 较上年末增长 13.4%。（3）经纪业务净收入同比 +68%，占比 31%；（4）投行业务收入 2.14亿元， 同比-2%；（5）利息净收入 6.83亿元，同比 -17%，两融利息收入同比 +19.8%，两融余额 519亿元， 较上年末增长 24%。 财富管理业务深化买方转型， 根据公司半年报， “知己理财 ”品牌影响力与客户覆盖面持续扩大， 测算股 基市占提升至 1.46%，26H1新开户市占率与活跃户规模再创历史新高，兴业证券 APP（优理宝）月活 同比增速居头部证券类 APP首位。资产托管与基金服务业务保持竞争优势，期末存续服务私募产品数 量排名行业第六位。 机构与交易业务持续强化研究赋能、 客需服务及投资管理能力。 自营权益类证券 /净 资本较去年末提升 5.36pct达到 18.29%，加速从传统方向性博弈向多资产、多策略组合配置转型，权 益投资公司稳步推进多元策略迭代，持续开展 REITs、私募 FOF等领域的策略储备与实盘运作，进一 步丰富收益来源，增强组合韧性。兴证香港 以“大财富、大机构、大投行 ”深化跨境业务布局。 盈利预测和投资建议。 公司大资管能力突出，自营业务贡献业绩弹性，高管换届战略深化提升变革机 遇，预计公司 2026 -2027 年实现归母净利润 36.3 亿元、 42.2 亿元，考虑到公司 18年以来 1X- 1.5XPB 的估值中枢，给予公司 2026 年1.1XPB 估值，每股合理价值为 7.47 元，维持 “买入”评级。 风险提示。 市场竞争加剧；经济超预期下行；市场波动加大导致业绩不达预期；佣金率下滑等 。 [Table_PicQuote] 相对市场表现 [Table_Author] 陈福 SAC 执证号： S0260517050001 SFC CE No. BOB667 chenfu@gf.com.cn 严漪澜 SAC 执证号： S0260524070005 yanyilan@gf.com.cn 请注意，严漪澜并非香港证券及期货事务监察委员 会的注册持牌人，不可在香港从事受监管活动。 [Table_DocReport] 相关研究 兴业证券（ 601377.SH ）:业绩弹性可 期，泛财富业务高增 2026 -05-01 兴业证券（ 601377.SH ）:泛自营弹性凸 显，泛财富优势巩固 2026 -03-30 兴业证券（ 601377.SH ）:业绩弹性可 期，自营财富高增 2025 -10-31 盈利预测 [Table_Finance] 百万元 人民币 2024A 2025A 2026E 2027E 2028E 营业收入 12354 11841 14549 16415 18267 增长率 (%) 16% 21% 23% 13% 11% 归母净利润 2164 2870 3627 4221 4966 增长率 (%) 10% 33% 26% 16% 18% EPS （元 /股） 0.25 0.33 0.42 0.49 0.58 市盈率 23.23 17.51 13.86 11.91 10.12 市净率（ x） 0.92 0.90 0.86 0.81 0.76 ROE (%) 3.4% 4.3% 5.4% 5.8% 6.7% 数据来源：公司财务报表，广发证券发展研究中心 -20%-12%-4%4%12%20% 08/25 10/25 12/25 02/26 04/26 06/26 08/26 兴业证券 沪深300 仅供内部参考，请勿外传！ 请务必阅读末页的免责声明 02 / 16 [Table_PageText1] 中报点评 | 兴业证券 目录索引 一、盈利高速增长，杠杆与 ROE 同步提升 ................................ ............................... "extracted"}, "post:2026-08-22T09-24:02ed9ab6260c": {"id": "post:2026-08-22T09-24:02ed9ab6260c", "kind": "post", "title": "2026-08-22 09:24", "source_label": "帖子正文", "excerpt": "【中信建投通信及人工智能】中际旭创2026年半年报点评：业绩增速持续亮眼，未来Scale-up带来的市场增量可观 2026年上半年，得益于800G、1.6T光模块出货快速增长，公司营收持续高速增长。产品方案及结构不断优化叠加规模生产带来运营效率提升，公司盈利能力进一步提升。", "content": "【中信建投通信及人工智能】中际旭创2026年半年报点评：业绩增速持续亮眼，未来Scale-up带来的市场增量可观 2026年上半年，得益于800G、1.6T光模块出货快速增长，公司营收持续高速增长。产品方案及结构不断优化叠加规模生产带来运营效率提升，公司盈利能力进一步提升。 2026年上半年，公司实现营业收入417.78亿元，同比增长182.49%；实现归母净利润136.51亿元，同比增长241.70%；实现扣非归母净利润130.92亿元，同比增长229.32%；上半年毛利率46.25%，同比大幅提升6.93pcts。 2026年二季度单季，公司实现营收222.81亿元，同比+174.57%，环比+14.29%；实现归母净利润79.17亿元，同比+228.19%，环比+38.05%；单季毛利率进一步提升至46.42%。 光互连需求景气度高企。27年800G、1.6T需求预计持续高增。Rubin Ultra、TPU v9架构等下一代产品将在Scale-up层面形成对光互连的显著拉动，NPO光模块、2.4T轻相干光模块等新品将在27年开始释放需求并在28年显著增长。预计未来光互联在整体Capex中的投资占比将明显提升。 作为全球光互联龙头，公司依托硅光、相干等核心技术的先发优势和经验积累，持续加强1.6T、3.2T及更高速率光模块等产品研发投入，同时积极开发NPO、XPO、CPO、OCS等产品，预计将充分受益于全球AI高速光互联需求持续扩容，成长空间广阔。#文字观点", "publish_time": "2026-08-22 09:24", "tags": ["文字观点"]}, "post:2026-08-22T22-13:f0b9b1fe3b22": {"id": "post:2026-08-22T22-13:f0b9b1fe3b22", "kind": "post", "title": "2026-08-22 22:13", "source_label": "帖子正文", "excerpt": "【浙商计算机 童非】Micro LED光互联进入验证期 核心变化：Micro LED的价值正在从“显示”延伸至“通信” AI集群规模持续扩大，服务器内部与机柜内短距互联对功耗、带宽密度和可靠性提出更高要求。传统路线以铜互联、VCSEL、硅光等为主，而Micro LED提供了另一种思路：利用微米级发光", "content": "【浙商计算机 童非】Micro LED光互联进入验证期 核心变化：Micro LED的价值正在从“显示”延伸至“通信” AI集群规模持续扩大，服务器内部与机柜内短距互联对功耗、带宽密度和可靠性提出更高要求。传统路线以铜互联、VCSEL、硅光等为主，而Micro LED提供了另一种思路：利用微米级发光阵列，将大量低功耗光源并行化，用“多通道并行”替代单通道极限提速。 Micro LED成为短距光源阵列，短距优势显著 Micro LED用于光互联，核心是作为可高速调制的微型发光阵列，与CMOS驱动/接收、光学耦合、封装基板以及光模块/光引擎集成，形成短距并行光互联方案。潜在应用形态包括AOC、短距并行光模块，在集成架构上可采用CPO方案、主要面向板级至机柜级的短距光互连场景。Micro-LED CPO在1-10米具备显著优势。未来有望伴随AI scale-up网络升级打开新空间。 产业奇点加速临近 → 2025年：微软提出MOSAIC光互连架构，技术路线定调 → 2026年：Credo计划推出Micro-LED光通信高速样机 → 2025年：华灿光电（京东方子公司）全球首条6英寸量产线首批光通信样品交付海外客户 → 2026年：京东方与康宁推进光互联及封装基板等合作 → 2028年：CPO市场预计加速起量 → 2030年：TrendForce预估Micro-LED CPO市场达8.48亿美元 相关标的 Micro LED光源：# 华灿光电、国星光电、兆驰股份、三安光电 利润贡献； #铜成本上升的原因：公司铜精矿和电积铜的生产成本上升幅度较大，分别是16%和17.7%，原因有：（1）入选品位下降；（2）柴油和药剂成本上升；（3）采剥导致运距上升；（3）矿权出让收益金增加；（4）副产品单吨计价，未冲减生产成本。 #依然强烈看好紫金的未来，特别是在旗下资源重估的情况下，市场对于紫金的资源价值和管理价值都没有任何的溢价，反而是折价，我们认为是不公平的。#一个分析师的灵魂发问：为什么紫金的PE会低于神华？？？资源、管理、盈利都有绝对的优势情况下发生了！！！！#文字观点", "publish_time": "2026-08-22 12:36", "tags": ["紫金的中报我看到了什么关键词", "文字观点"]}, "attachment:files/平安证券-电力设备及新能源行业逆变器7月出口跟踪：澳洲单月回落，不改增长预期-260821.pdf": {"id": "attachment:files/平安证券-电力设备及新能源行业逆变器7月出口跟踪：澳洲单月回落，不改增长预期-260821.pdf", "kind": "attachment", "title": "平安证券-电力设备及新能源行业逆变器7月出口跟踪：澳洲单月回落，不改增长预期-260821", "source_label": "平安证券", "excerpt": "福斯特 福斯特(603806) ：光伏胶膜主业净利回升 ：光伏胶膜主业净利回升 感光干膜利润锦上添花 感光干膜利润锦上添花 2026-08-20 2026 1H 业绩符合我们预期 公司 1H 实现收入 69.88 亿元，同比 -12.2% ；归母净利润 8.42 亿元，同比 +69.8% ，其中 2Q26 实现收入 36.15 亿元，同比 - 16.6% ", "content": "福斯特 福斯特(603806) ：光伏胶膜主业净利回升 ：光伏胶膜主业净利回升 感光干膜利润锦上添花 感光干膜利润锦上添花 2026-08-20 2026 1H 业绩符合我们预期 公司 1H 实现收入 69.88 亿元，同比 -12.2% ；归母净利润 8.42 亿元，同比 +69.8% ，其中 2Q26 实现收入 36.15 亿元，同比 - 16.6% ，环比 +7.2% ；归母净利润 5.3 亿元，同比 +461% ，环比 +70% 。 1H 毛利率 17.05% ，同比 +4.90ppt ；净利率 12% ，同比 +5.8ppt 。 2Q26 毛利率 20.07% ，同比 +8.7ppt ，环比 +6.24 ppt ；净利率 14.66% ，同比 +12.62ppt ，环比 +5.45ppt 。 我们认为，公司收入下降主要系 1H 国内光伏装机同比 -66% ，组件端需求疲软导致公司 1H 光伏胶膜销售量下滑至 12.2 亿 平方米，同比 -11.97% ，收入 60.3 亿元，同比 -15.00% 。利润上升较多系光伏胶膜原材料涨价获得库存收益，胶膜海外销售占比 提升推动利润结构向好，感光干膜利润贡献增加三方面共同支撑。 发展趋势 2H 光伏胶膜毛利率结构有望进一步优化。受限于目前国内电价下滑及需要满足最低制造成本要求导致的组件价格上升， 我们认为 2H 组件端需求相较于 1H 基本持平；海外方面，印度已经放松对电池端进口的限制，下半年印度组件开工率有望提升， 胶膜需求增加有望拉动国内胶膜出口量增加。我们预期今年公司胶膜海外销售量占比约 30-40% ，整体利润率结构持续向好。 感光干膜高端产品销售占比有望提升至 30% 。公司感光干膜 1H 已实现销售量 1.1 亿平方米，同比 +21.92% ，收入 3.9 亿 元，同比 +19.69% 。我们预期今年销售量有望达到 2.5 亿平方米。价格方面，由于高端产品较为稀缺，海外供应商价格目前处于 上行通道，我们认为公司产品价格可以维持较好水平。考虑到销量增长叠加高毛利产品占比增加，我们测算全年净利有望达到 1 亿元。 盈利预测与估值 维持 2026/2027 盈利预测不变。当前股价对应 2026/2027 年 24.00/20.40 倍市盈率。维持跑赢行业评级，目标价维持 24.00 元不变，对应 37.90 倍 2026 市盈率和 32.30 倍 2027 市盈率，较当前股价有 58.30% 的上行空间。 风险 海外及下游光伏组件需求不及预期，主要原材料价格上涨波动风险，项目扩产进度不及预期风险。 仅供内部参考，请勿外传", "status": "extracted"}, "post:2026-08-22T22-12:bcfba90f1235": {"id": "post:2026-08-22T22-12:bcfba90f1235", "kind": "post", "title": "2026-08-22 22:12", "source_label": "帖子正文", "excerpt": "飞荣达：Q2净利率创新高、“昇腾950DT+华为Mate90+1.6T光模块”多轮驱动 #26Q2业绩同比+62%、近业绩预告上限 ✔2026H1，公司营收37.09亿元，同比+28.64%；归母净利润2.53亿元，同比+52.09%", "content": "飞荣达：Q2净利率创新高、“昇腾950DT+华为Mate90+1.6T光模块”多轮驱动 #26Q2业绩同比+62%、近业绩预告上限 ✔2026H1，公司营收37.09亿元，同比+28.64%；归母净利润2.53亿元，同比+52.09%；扣非归母净利润2.60亿元，同比+91.30%。2026Q2，营收20.65亿元，同比+21.34%；归母净利润1.75亿元，同比+61.78%。 ✔2026Q2，毛利率22.27%、同比+1.27pct、环比+1.37pct；#净利率8.28%、同比+1.65pct、环比+3.49pct，为近五年新高。 ✔2026H1末，存货14.25亿元，同比+31.09%，主要系销售订单持续增长导致备货增加所致。其中，发出商品账面价值2.17亿元，较年初+98.06%，#存货高增奠定后续增长基础。#AI服务器+交换机散热需求快速增长、消费电子业务逆势增长 ✔＃AI服务器+交换机散热需求快速增长，相关业务与多个重要客户的合作有序推进、订单量持续提升。公司在服务器、数据中心等领域的散热产品包含TIM材料、各类散热器、风扇、3D VC散热器、单相/两相液冷冷板模组、流量控制仪、CDU等，#多类产品已批量交付。＃9月17日华为全联接大会将更新昇腾进展。 ✔＃在消费电子行业承压背景下，公司相关业务实现逆势增长，主要得益于配套产品的#单机价值量较传统普通机型有所提升、高价值产品出货占比较高，同时公司在头部客户的市场份额稳步提升。未来， ＃华为Mate90或于9月下旬发布，公司在新机型的单价与市占率有望继续向好。 ✔1.6T光模块驱动散热+TIM材料需求显著增长。公司光模块散热产品包括相变材料、吸波材料和散热器、导热凝胶等，＃目前公司光模块散热产品已在国内外头部光模块厂商认实现供货，并在积极拓展新的光模块优质客户。 ＃预计2026/2027年净利润分别为8/15亿元，看2027年50xPE对应750亿。#文字观点", "publish_time": "2026-08-22 22:12", "tags": ["存货高增奠定后续增长基础", "多类产品已批量交付", "文字观点"]}, "attachment:files/Bernstein-北美数据中心制冷与电气设备采购现状——30张图表全景解析.pdf": {"id": "attachment:files/Bernstein-北美数据中心制冷与电气设备采购现状——30张图表全景解析.pdf", "kind": "attachment", "title": "Bernstein-北美数据中心制冷与电气设备采购现状——30张图表全景解析", "source_label": "Bernstein", "excerpt": "20 August 2026 U.S. Multi Industry & Electrical Equipment US Industrials: 30 exhibits on the state of cooling and electrical equip. procurement in North American Data Centers Varun", "content": "20 August 2026 U.S. Multi Industry & Electrical Equipment US Industrials: 30 exhibits on the state of cooling and electrical equip. procurement in North American Data Centers Varun Govindaraj +1 917 344 8543 varun.govindaraj@bernsteinsg.com Chad Dillard +1 917 344 8469 chad.dillard@bernsteinsg.com Alasdair Leslie +44 20 7762 4952 alasdair.leslie@bernsteinsg.com Sunaina Ocalan .+1 917 344 8503 sunaina.ocalan@bernsteinsg.com Madison Rezaei +1 917 344 8622 madison.rezaei@bernsteinsg.com Specialist Sales Steve Song +1 917 344 8401 steve.song@bernsteinsg.comWe ran a survey of 50 data center procurement leaders (~40% hyperscalers, ~60% colos / neoclouds / enterprise DCs) making purchase decisions for North American projects to understand where ever-changing market dynamics currently sit. We did this at the equipment level (e.g., for PDUs, CDUs, Chillers, etc.) offering a level of granularity that we do not believe exists for investors today. Key insights highlighted below. The raw survey data can be accessed here . Ordering patterns: Double ordering (or more accurately, excess ordering) seems to be a phenomenon for ~50% or more of the respondent set. When it does take place, we see the magnitude of excess orders are north of 20% for a material share of the respondent set (and in some cases north of 50% excess equipment) with some nuance by product type. Excess capacity concerns seem overblown; in most cases lead times have tightened, not lowered. Cancellation penalties also seem to be more punitive than we initially anticipated (we were worried customers could cancel orders for \u003c10% of their down payment; that does not seem to be the case). Our takeaway here is that we expect to see near- term market strength for equipment players, and even if data center build slows, relatively punitive cancellation terms could incentivize customers to still take delivery of some equipment. However, it also implies that longer-term, equipment demand is being pulled forward and when capex does slow, customers will likely have surplus stock of cooling and power making the slowdown all the more painful. Modular and pre-fab: Modular and pre-fab are expected to increase significantly in prevalence over the coming months (~60% of respondents expect an increase while 40% expect it to remain relatively unchanged). ~50% would find value in having both IT/ cooling pods and power pods, however, there still does not seem to be a strong impact on willingness to source both these types of pods from a single vendor even when offered. Company Perceptions: While we expected some combination of Vertiv / Eaton / Schneider to top these results, Schneider in particularly seems to be >20% of spend for ~60% of respondents (across both power and cooling). Vertiv was a major supplier for around ~40% of respondents while Eaton is around 20% for power and 30% for cooling. Power Generation: While this survey was primary focused on cooling and electrical equipment, we did ask a question about BTM, and ~60% of respondents believe new data center projects will be powered using BTM at least in part for primary gen. 800V DC: ~45% of respondents have an 800V DC project already under operation or expect it to be underway by 2027. The remainder expect their initial 800V DC capacity to come online by 2028 or later. This is largely in line with our expectations that the vast majority of ramp up happens in 2028 or later (since all responses here refer to the initial project). Schneider, Siemens, ABB, GE Vernova, and Eaton seem to lead the pack in perception (>50% of respondents would be willing to purchase an SST from these players), although we acknowledge that this is a rapidly changing space and new launches / progress will likely shift the balance here. See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 20 Aug 2026 20:30 UTC Completion Date: 20 Aug 2026 19:54 UTC Varun Govindaraj +1 917 344 8543 varun.govindaraj@bernsteinsg.com 20 August 2026 BERNSTEIN TICKER TABLE 19 Aug 2026TTM Adjusted EPS Adjusted P/E (x) Closing Price Rel. Ticker Rating Cur Price Target Perf. Cur 2025A 2026E 2027E 2025A 2026E 2027E VRT (Vertiv) O USD 261.00 368.00 82.7% USD 4.20 6.60 9.06 62.2 39.5 28.8 NVT (nVent) O USD 156.88 229.00 54.9% USD 3.34 5.15 6. 前瞻 Global Memory Tech Weekly theme Hynix buyback implication, upbeat spot price, tech tour preview", "source_label": "BofA", "excerpt": "21 August 2026 Global Memory Korea Memory Export Tracker (Jul): Samsung continued ramping HBM4, but SK hynix delayed by Rubin?Mark Li +852 2123 2645 mark.li@bernsteinsg.com Edward ", "content": "21 August 2026 Global Memory Korea Memory Export Tracker (Jul): Samsung continued ramping HBM4, but SK hynix delayed by Rubin? Mark Li +852 2123 2645 mark.li@bernsteinsg.com Edward Hou, CFA +852 2123 2623 edward.hou@bernsteinsg.com Yipin Cai, CFA +852 2123 2669 yipin.cai@bernsteinsg.comWe track the Korea export data as it is a good early indicator for Samsung’s & SK hynix’s HBM revenue in the same quarter, and update this tracker with the Jul data. Details of our methodology can be found in our prior note . The dataset can be downloaded at this link. Overall HBM export remained robust, up 13% QoQ vs. Apr. It retreated by 32% MoM on seasonality but still went up 13% QoQ. YoY increase was also solid at 64%. Data suggested Samsung 3Q26 HBM revenue could beat our estimates. Export from S. Chungcheong (where Samsung packages HBM) was up 122% QoQ vs Apr. And it suggests Samsung’s 3Q26 HBM revenue to rise 80% QoQ, & 30% ahead of our forecast. Export for SK hynix was surprisingly weak. Export from N. Chungcheong & Icheon was down ~27% MoM & QoQ, and regression predicts SK hynix 2Q26 HBM revenue to fall 20% QoQ, significantly below our estimates. We attribute it to the delayed HBM4 shipment for Rubin, but believe its HBM4 shipment should catch up in later months. Samsung still led in HBM4 shipment, & perhaps with price notably above HBM3/3E’s. As HBM has much higher dollar value per weight, we track “value per weigh” as it may be directionally suggestive of HBM price change. Jul “value per weight” rose another 21% MoM for Samsung but only mildly for SK hynix, signaling earlier HBM4 shipment by Samsung. Samsung’s “value per weigh” has also doubled from the prior level, suggesting price perhaps improving notably from HBM3/3E to 4. Data showed HBM price has been insulated from the volatility of conventional memory price. Conventional memory price surged, but SK hynix’s HBM price, as suggested by value per weight, largely stayed in the same range as before. Export to Malaysia exhibited continued strength. It rose further to US$1.3B in Jul, with Samsung staying high but increase mainly from SK hynix. Generally export to Malaysia has been growing meaningfully over the past few quarters. We assume it’s for Intel’s EMIB but are puzzled why HBM import rose so early. Overall Jul data came in strong for Samsung but surprisingly weak for SK hynix. Jul data suggests Samsung HBM revenue can substantially outgrow SK hynix in 3Q26, and likely claim market share lead too. This is in line with our view of improving HBM4 position by Samsung. That said we think SK hynix HBM4 ramp should eventually happen this year and help gain some share back. Additionally, HBM contract price increase next year should trigger an upward revision for 2027 for both. Conventional memory price rise should continue in 3Q26 and HBM price increase should bring earnings revisions. We see continued price increase in 3Q27 & also HBM price hike in 2027. We remain structurally constructive on Samsung, SK hynix & Micron but cautious on KIOXIA on China competition (see our sector update ). Our detailed SOTP valuation also finds KIOXIA over-valued. See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 21 Aug 2026 02:52 UTC Completion Date: 21 Aug 2026 02:52 UTC on 21-Aug-2026 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 BERNSTEIN TICKER TABLE 20 Aug 2026TTM Reported EPS Reported P/E (x) Closing Price Rel. Ticker Rating Cur Price Target Perf. Cur 2025A 2026E 2027E 2025A 2026E 2027E 005930.KS (SEC- Samsung) O KRW 273,000 440,000 255.5% KRW 6,611.53 48,393 77,273 41.3 5.6 3.5 005935.KS (SEC-Pref - Samsung)O KRW 191,200 374,000 197.9% KRW 6,611.53 48,393 77,273 28.9 4.0 2.5 SMSN.LI (Samsung) O USD 4,822.00 7,350.00 251.3% USD 116.15 812.39 1,290.80 41.5 5.9 3.7 000660.KS (SK hynix) O KRW 1,710,000 3,300,000 566.7% KRW 60,341 395,677 568,862 28.3 4.3 3.0 MU (Micron) O USD 974.33 1,300.00 711.8% USD 8.29 67.39 158.99 117.6 14.5 6.1 285A.JP (KIOXIA) U JPY 52,950 40,000 2166.0% JPY 1,014.00 10,013 9,656.84 52.2 5.3 5.5 ASIAX 1,954.75 EM 1,814.53 SPX 7,641.16 O - Outperform, M - Market-Perform, U - Underperform, NR - Not Rated, CS - Coverage Suspended MU estimate is Adjusted EPS; MU valuation is Adjusted P/E (x); Source: Bloomberg, Bernstein estimates and analysis. INVESTMENT IMPLICATIONS Samsung Electronics: We rate Samsung Electronics Outperform with price target of KRW 440,000. SK hynix : We rate SK hynix Outperform with price target of KRW 3,300,000. GLOBAL MEMORY 2 on 21-Aug-2026 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 DETAILS Korea Customs Service has released export data for Jul. As our previous note found, the export data for certain memory products bears close correlation with HBM revenues of Samsung and SK hynix. We hence track the monthly data to provide investors a preview on HBM revenues from the two companies in the same quarter. Details of our methodology can be found in the previous note . You may also download the export data at this link . Jul export data suggested faster than expected growth of Samsung HBM revenue into 3Q26. On the other hand, SK hynix’s 3Q26 HBM revenue may fall below our projection and also below Samsung’s in 3Q26. •Jul Korea total multichip memory export to Taiwan and Malaysia was down by 32% MoM, from Jun’s historical high. The dip was most likely due to seasonality and QoQ growth (vs Apr) actually continued at 13% and YoY growth also remained strong at 64% YoY ( Exhibit 1 ). As we analyzed before, multichip memory export to Taiwan and Malaysia tracked closely with HBM revenues of Samsung and SK hynix and therefore the Jul data indicated continued strong and accelerating momentum into 3Q26. •If we focus on the export from S. Chungcheong Province, where Samsung’s back-end fabs are and likely where its HBM is packaged, Jul export remained very robust at US$2.2B. It was down 35% MoM from the seasonally high in Jun but up 122% QoQ from Apr. And we also note that Jul single month export by Samsung remained higher than SK hynix, for the second consecutive month since Jun ( Exhibit 2 ). The QoQ increase in Jul export was strong ( Exhibit 3 ), and according to the regression using historical data, the Jul data suggested ~US$12B in HBM revenue for Samsung in 3Q26, notably ahead of our estimate of US$9.3B by ~30%, and represented ~80% QoQ growth ( Exhibit 4 ). If we run the regression using only data points from 1Q25, the predicted 3Q26 HBM revenue would be even a bit higher at $12.6B ( Exhibit 5 ). Samsung’s HBM export monthly seasonality has consistently been very backend loaded since 1Q25, with first month of quarter averaging less than 20% of quarterly total, and should 3Q26 follow the same pattern, we should see meaningful increases in Aug and Sep exports ( Exhibit 6 ). Overall Samsung’s HBM export has been stronger than our expectation in recent months, and does align with Samsung’s guidance of the rapid ramp of HBM4 sales in 2H26. We hence remain positive on Samsung’s HBM share gain this year (see Samsung 2Q26 earnings takeaway ). •For SK hynix, we have identified that its HBM export should come nearly all from N. Chungchoeng Province and Icheon City, where its wafer fabs are. In contrast to Samsung, hynix’s Jul export data was much weaker, dropping by 28% MoM and also 27% QoQ (vs Apr) ( Exhibit 7 ). The QoQ drop also contrasts sharply with our expectation of QoQ increase in HBM revenue in 3Q26 ( Exhibit 8 ). Regression finds that the export value suggests only US$5.6B HBM revenue by SK hynix in 3Q26, ~20% below 2Q26 and 55% below our forecast, which would also put it behind Samsung ( Exhibit 9 ). SK hynix’s monthly seasonality was much more balanced than Samsung’s, meaning it is less likely to significant rebound in Aug and Sep exports (Exhibit 10 ). We think the light Jul data is likely related to the delayed HBM4 shipment which SK hynix also alluded to in its earnings (see takeaway ), and this delay is likely due to the delay of NVIDIA Rubin. So we think it is still possible to see more meaningful recovery later this quarter. We also note if we apply the most backend loaded seasonality (2Q24) since 2024, SK hynix’s 3Q26 HBM revenue may reach US$12B, similar to our estimate. All things considered, data still suggested that SK hynix HBM growth momentum will likely fall below our expectation and its market share perhaps will drop below Samsung’s. GLOBAL MEMORY 3 on 21-Aug-2026 Mark Li +852 2123 2645 mark.li@bernsteinsg.com 21 August 2026 EXHIBIT 1: Being a close proxy for HBM shipment, Korea multichip memory export to Taiwan and Malaysia remained robust in Jul, rising 13% QoQ. 4.26.1 .%8319%164% -200%-100%0%100%200%300%400%500%600%700%800%900% 0.01.02.03.04.05.06.07.0 Jan-22 Apr-22 Jul-22 Oct-22 Jan-23 Apr-23 Jul-23 Oct-23 Jan-24 Apr-24 Jul-24 Oct-24 Jan-25 Apr-25 Jul-25 Oct-25 Jan-26 Apr-26 Jul-26 YoYUS$BKorea Multichip Memory Export to TW+MY TW+MY YoY Source: Korea Custom Service, KITA, company reports and Bernstein analysis EXHIBIT 2: Export from S. Chungcheong was down 35% MoM but up 122% QoQ vs. Apr. 05001,0001,5002,0002,5003,0003,5004,000 Jan-22 Apr-22 Jul-22 Oct-22 Jan-23 Apr-23 Jul-23 Oct-23 Jan-24 Apr-24 Jul-24 Oct-24 Jan-25 Apr-25 Jul-25 Oct-25 Jan-26 Apr-26 Jul-26US$MMultichip Memory Export from S. Chungcheong to TW+MY vs Samsung HBM Revenue S. Chungcheong Export Samsung HBM (Qtrly/3) Samsung HBM revenue in 3Q26 is Bernstein estimate Source: Korea Custom Service, KITA, company reports, Bernstein 链条（液冷+电源+光互联）景气兑现**\n  - 今天强化的逻辑：xAI算力订单超预期带动液冷需求爆发，Bernstein以30张图表全景解析北美数据中心制冷与电气设备采购现状；JPM调研鸿海精密称AI服务器需求强劲、ASIC与CPO放量在即。（来源：22:01冰轮环境帖、附件：Bernstein-北美数据中心制冷与电气设备采购现状、JPM-鸿海精密）\n  - 今天出现的催化/验证：冰轮环境xAI累计60多台大型水冷离心机组订单；中际旭创Q2业绩超预期、Q3预期环比提速；蓝思科技Q2业绩逆势超预期，“AI端侧+算力+商业航天”多轮驱动；飞荣达Q2净利率创新高、“昇腾950DT+华为Mate90+1.6T光模块”多轮驱动。（来源：9:24、22:11、22:12帖子）\n\n- **主线：存储/半导体（HBM4放量节奏与国产替代）**\n  - 今天强化的逻辑：韩国7月存储出口数据显示三星HBM4持续上量，SK海力士受Rubin延期承压，马来西亚多芯片存储出口环比再增20%至13亿美元，受益Intel EMIB先进封装需求。（来源：16:58伯恩斯坦帖、附件：Bernstein-全球存储）\n  - 今天出现的催化/验证：BofA全球存储科技周报主题为海力士回购影响、现货价格向好、技术巡礼前瞻；华西机械强调长存从国产替代追赶到全球技术领跑，后续3D DRAM是大的技术演进方向。（来源：16:57帖、附件：BofA-全球存储科技）\n\n- **主线：光通信/CPO（Scale-up增量+新技术路线）**\n  - 今天强化的逻辑：中际旭创依托硅光、相干核心技术，持续加强1.6T、3.2T研发，同时开发NPO、XPO、CPO、OCS等产品，预计充分受益全球AI高速光互联需求扩容。（来源：9:24中信建投帖）\n  - 今天出现的催化/验证：旭创H1财报中XPO是业界首款整合液冷的可插拔光学方案、NPO是“放置在主机ASIC附近、物理上分离的光模块”；Micro LED光互联进入验证期，价值正从“显示”延伸至“通信”。（来源：12:36旭创H1财报帖、22:13浙商计算机帖）\n\n- **主线：锂电/新能源（资金承接+估值修复）**\n  - 今天强化的逻辑：新能源车销量虽下滑，但海外大幅增长、储能增长显著，整体出货量市场预计是去年2倍；市场需要板块承载高位出来的天量资金。（来源：12:36锂矿帖）\n  - 今天出现的催化/验证：亿纬锂能1H26营收456.91亿元、同比+62%，业绩符合预期，看好动储结构改善加速，JPM管理层指引2027年出货量增长50%；固态电池获人民日报再call，体现官方对电池方向前沿科技的重视。（来源：19:28亿纬锂能帖、附件：中金公司-亿纬锂能、JPM-亿纬锂能）\n\n- **主线：机器人/具身智能（量产爬坡+产业拐点）**\n  - 今天强化的逻辑：这轮行情本质是供应商锁定+本体真正开始量产爬坡，t链自2月调整半年、筹码高度出清，产业进展却在加速。（来源：12:36供应商锁定帖）\n  - 今天出现的催化/验证：自动化线8月中调试完成、9月EDI产量继续上修；世界机器人大会开幕、荣耀机器人破人类百米纪录；MS与野村证券同步覆盖宇树科技，认为产业从教育研发向商业应用加速切换。（来源：12:37、16:59帖子，附件：MS-宇树科技IPO映射、野村证券-C宇树）\n\n## 三、今日重点关注\n### 3.1 今天已经发生的重点变化\n- 中际旭创2026Q2收入223亿元（yoy+175%，qoq+14%），归母净利润79亿元（yoy+228%，qoq+38%），业绩增速超市场预期，Q2毛利率达46.4%。（来源：9:24招商通信帖、9:25广发通信帖）\n- 亿纬锂能1H26营收456.91亿元、同比+62%，业绩符合市场预期，看好动储结构改善加速。（来源：附件：中金公司-亿纬锂能）\n- 冰轮环境xAI今年累计下60多台大型水冷离心机组订单，公司份额20%-30%，按马斯克指引26年底算力2GW。（来源：22:01天风汽车帖）\n- 韩国7月存储出口数据落地：三星HBM4持续上量，SK海力士受Rubin延期承压，整体HBM出口环比降32%但同比大增64%。（来源：16:58伯恩斯坦帖）\n- 蓝思科技、飞荣达、远东股份等一批中报/半年报集中发布，AI算力相关公司业绩普遍超预期或高增。（来源：22:11、22:12、21:10帖子）\n\n### 3.2 接下来要继续跟踪的验证点/催化点\n- 中际旭创Q3业绩是否如预期环比提速，以及800G、1.6T后续需求持续性。（来源：9:24招商通信帖、9:25广发通信帖）\n- 冰轮环境明年xAI新增8GW算力对应的订单落地情况，以及磁悬浮机组（R
