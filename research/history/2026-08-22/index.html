· 当天提及 1 次\n\n**命中附件原文线索：**\n1. `HK_A_Recap_2026-08-21 re`\n来源：HK_A_Recap_2026；正文摘录：TradingView Lightweight Charts · 日线至2026-08-21 · 布林=20日均±2σ · 上涨红、下跌绿 A股与港股复盘 2026年8月21日 研究笔记 · 不构成投资建议 第 5 / 11 页 个股：北向资金今日买入最多的名字，与涨幅榜前列高度重合——寒武纪、紫金\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>光模块龙头中际旭创2026Q2业绩超市场预期，多家券商集中点评，普遍认为Q3业绩有望环比提速，AI高速光互联需求持续高增。（来源：9:24中信建投、9:24招商通信、9:25广发通信、12:36中信通信，附件：HK_A_Recap_2026-08-21 re）\u003c/li>\n\u003cli>存储主线今日最强催化来自韩国7月出口数据：三星HBM4持续上量，而SK海力士因Rubin项目延期承压；BofA周报同步指向现货价格向好与海力士回购影响。（来源：16:58伯恩斯坦帖、附件：Bernstein-全球存储、Bernstein-韩国存储出口追踪、BofA-全球存储科技）\u003c/li>\n\u003cli>冰轮环境作为xAI液冷弹性标的被重点提示，今年累计已下60多台大型水冷离心机组订单，测算明年xAI新增8GW算力对应的收入与利润增量弹性较大。（来源：22:01天风汽车帖，附件：Bernstein-北美数据中心制冷与电气设备采购现状）\u003c/li>\n\u003cli>锂电/新能源今日出现资金承接逻辑：锂矿被认为价值低估、后续可能有资金持续流入，医药已承载部分分流资金，市场认为下一站是锂电池板块；亿纬锂能被测算2026-2027年归母净利润72、107亿元，对应PE 16、11X，主业被大幅低估。（来源：12:36锂矿帖、19:28亿纬锂能帖、12:36紫金中报帖）\u003c/li>\n\u003cli>机器人产业拐点信号被强化：自动化线8月中调试完成、本体量产迅速爬坡，9月EDI产量继续上修；世界机器人大会开幕，荣耀机器人破人类百米纪录；宇树科技IPO被外资行首次覆盖并映射产业加速。（来源：12:37自动化线帖、12:36供应商锁定帖、16:59浙商机械帖，附件：MS-宇树科技IPO映射、野村证券-C宇树首次覆盖）\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线：AI算力链条（液冷+电源+光互联）景气兑现\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：xAI算力订单超预期带动液冷需求爆发，Bernstein以30张图表全景解析北美数据中心制冷与电气设备采购现状；JPM调研鸿海精密称AI服务器需求强劲、ASIC与CPO放量在即。（来源：22:01冰轮环境帖、附件：Bernstein-北美数据中心制冷与电气设备采购现状、JPM-鸿海精密）\u003c/li>\n\u003cli>今天出现的催化/验证：冰轮环境xAI累计60多台大型水冷离心机组订单；中际旭创Q2业绩超预期、Q3预期环比提速；蓝思科技Q2业绩逆势超预期，“AI端侧+算力+商业航天”多轮驱动；飞荣达Q2净利率创新高、“昇腾950DT+华为Mate90+1.6T光模块”多轮驱动。（来源：9:24、22:11、22:12帖子）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：存储/半导体（HBM4放量节奏与国产替代）\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：韩国7月存储出口数据显示三星HBM4持续上量，SK海力士受Rubin延期承压，马来西亚多芯片存储出口环比再增20%至13亿美元，受益Intel EMIB先进封装需求。（来源：16:58伯恩斯坦帖、附件：Bernstein-全球存储）\u003c/li>\n\u003cli>今天出现的催化/验证：BofA全球存储科技周报主题为海力士回购影响、现货价格向好、技术巡礼前瞻；华西机械强调长存从国产替代追赶到全球技术领跑，后续3D DRAM是大的技术演进方向。（来源：16:57帖、附件：BofA-全球存储科技）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：光通信/CPO（Scale-up增量+新技术路线）\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：中际旭创依托硅光、相干核心技术，持续加强1.6T、3.2T研发，同时开发NPO、XPO、CPO、OCS等产品，预计充分受益全球AI高速光互联需求扩容。（来源：9:24中信建投帖）\u003c/li>\n\u003cli>今天出现的催化/验证：旭创H1财报中XPO是业界首款整合液冷的可插拔光学方案、NPO是“放置在主机ASIC附近、物理上分离的光模块”；Micro LED光互联进入验证期，价值正从“显示”延伸至“通信”。（来源：12:36旭创H1财报帖、22:13浙商计算机帖）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：锂电/新能源（资金承接+估值修复）\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：新能源车销量虽下滑，但海外大幅增长、储能增长显著，整体出货量市场预计是去年2倍；市场需要板块承载高位出来的天量资金。（来源：12:36锂矿帖）\u003c/li>\n\u003cli>今天出现的催化/验证：亿纬锂能1H26营收456.91亿元、同比+62%，业绩符合预期，看好动储结构改善加速，JPM管理层指引2027年出货量增长50%；固态电池获人民日报再call，体现官方对电池方向前沿科技的重视。（来源：19:28亿纬锂能帖、附件：中金公司-亿纬锂能、JPM-亿纬锂能）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：机器人/具身智能（量产爬坡+产业拐点）\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：这轮行情本质是供应商锁定+本体真正开始量产爬坡，t链自2月调整半年、筹码高度出清，产业进展却在加速。（来源：12:36供应商锁定帖）\u003c/li>\n\u003cli>今天出现的催化/验证：自动化线8月中调试完成、9月EDI产量继续上修；世界机器人大会开幕、荣耀机器人破人类百米纪录；MS与野村证券同步覆盖宇树科技，认为产业从教育研发向商业应用加速切换。（来源：12:37、16:59帖子，附件：MS-宇树科技IPO映射、野村证券-C宇树）\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>中际旭创2026Q2收入223亿元（yoy+175%，qoq+14%），归母净利润79亿元（yoy+228%，qoq+38%），业绩增速超市场预期，Q2毛利率达46.4%。（来源：9:24招商通信帖、9:25广发通信帖）\u003c/li>\n\u003cli>亿纬锂能1H26营收456.91亿元、同比+62%，业绩符合市场预期，看好动储结构改善加速。（来源：附件：中金公司-亿纬锂能）\u003c/li>\n\u003cli>冰轮环境xAI今年累计下60多台大型水冷离心机组订单，公司份额20%-30%，按马斯克指引26年底算力2GW。（来源：22:01天风汽车帖）\u003c/li>\n\u003cli>韩国7月存储出口数据落地：三星HBM4持续上量，SK海力士受Rubin延期承压，整体HBM出口环比降32%但同比大增64%。（来源：16:58伯恩斯坦帖）\u003c/li>\n\u003cli>蓝思科技、飞荣达、远东股份等一批中报/半年报集中发布，AI算力相关公司业绩普遍超预期或高增。（来源：22:11、22:12、21:10帖子）\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>中际旭创Q3业绩是否如预期环比提速，以及800G、1.6T后续需求持续性。（来源：9:24招商通信帖、9:25广发通信帖）\u003c/li>\n\u003cli>冰轮环境明年xAI新增8GW算力对应的订单落地情况，以及磁悬浮机组（Rubin）采购占比是否提升。（来源：22:01天风汽车帖）\u003c/li>\n\u003cli>金刚石散热能否从主题投资切换到基本面投资，关注几亿元、几十亿元订单落地与业绩兑现。（来源：12:37金刚石散热帖）\u003c/li>\n\u003cli>液冷下游Q3放量是否兑现，代工链（T2）如金富科技、五洋自控的业绩释放节奏。（来源：12:36液冷帖）\u003c/li>\n\u003cli>存储现货价格走势、海力士回购影响，以及三星HBM4上量对产业链的带动。（来源：附件：BofA-全球存储科技、Bernstein-全球存储）\u003c/li>\n\u003cli>长存/长鑫产业链投资机会，特别是半导体设备备品备件成长逻辑与3D DRAM技术演进方向。（来源：16:57华西机械帖）\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>帖子\u003c/strong>（09:24）｜【中信建投通信及人工智能】中际旭创2026年半年报点评：业绩增速持续亮眼，未来Scale-up带来的市场增量可观\u003c/li>\n\u003cli>\u003cstrong>帖子\u003c/strong>（09:24）｜【招商通信】中际旭创中报点评：26Q2业绩超预期，Q3业绩预计环比提速\u003c/li>\n\u003cli>\u003cstrong>帖子\u003c/strong>（22:01）｜【天风汽车】冰轮环境更新：xAI弹性标的，向上看自制机头提升盈利能力 -0822\u003c/li>\n\u003cli>\u003cstrong>帖子\u003c/strong>（19:28）｜【亿纬锂能】观点更新：固态电池前瞻布局，打开远期估值弹性\u003c/li>\n\u003cli>\u003cstrong>帖子\u003c/strong>（22:13）｜【浙商计算机 童非】Micro LED光互联进入验证期\u003c/li>\n\u003cli>\u003cstrong>帖子\u003c/strong>（16:58）｜伯恩斯坦-韩国存储出口追踪（7月）：三星HBM4持续上量，SK海力士因Rubin延期承压？\u003c/li>\n\u003cli>\u003cstrong>附件\u003c/strong>（正文已提取）｜JPM-鸿海精密（2317.TW）：J.P. Morgan Asia Tech Tour纪要：AI服务器需求强劲，ASIC与CPO放量在即，维持“超配”评级（21 August 2026）\u003c/li>\n\u003cli>\u003cstrong>附件\u003c/strong>（正文已提取）｜Bernstein-北美数据中心制冷与电气设备采购现状——30张图表全景解析（20 August 2026）\u003c/li>\n\u003cli>\u003cstrong>附件\u003c/strong>（正文已提取）｜BofA-全球存储科技：每周主题：海力士回购带来的影响、现货价格向好、技术巡礼前瞻（21 August 2026）\u003c/li>\n\u003cli>\u003cstrong>附件\u003c/strong>（正文已提取）｜中金公司-亿纬锂能(300014)1H26业绩符合预期，看好动储结构改善加速-260821（2026-08-21）\u003c/li>\n\u003c/ul>\n\u003ch2>五、覆盖说明\u003c/h2>\n\u003cul>\n\u003cli>今日总帖数118篇，其中正文帖子113篇，带“文字观点”标签52篇；覆盖时段09:21~23:52。\u003c/li>\n\u003cli>附件总数281个：正文成功提取228个，仅识别到文件名46个，正文提取失败7个。\u003c/li>\n\u003cli>仅识别到文件名的附件（如天风证券-中富电路(300814)AI电源架构升级驱动、军工行业-叙事交替星辰未远——商业航天2026年中期展望20260821、军工行业-九天揽日万星生辉-太空光伏迎来产业化拐点20260821、2026年经济形势展望、启航工程专题、AIGC行业洞察、非银行业深度30讲等）因只有文件名没有正文，未作为正文级结论使用，仅在覆盖面中说明其存在。\u003c/li>\n\u003cli>正文提取失败的附件（如东方证券-安克创新首次覆盖报告）亦未纳入结论。市场复盘类内容（如HK_A_Recap中提及的“北向资金今日买入最多——寒武纪、紫金”、“天孚通信逆板块下跌、成交140.6亿仍是全场第一大”）仅作为个股盘面线索呈现，未扩展解读。\u003c/li>\n\u003c/ul>\n\u003ch2>六、stocks.json命中来源索引\u003c/h2>\n\u003ch3>仕佳光子（688313.SH）· 当天提及 2 次\u003c/h3>\n\u003cp>\u003cstrong>命中附件原文线索：\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003ccode>杰普特-仕佳光子20260821\u003c/code>\u003c/li>\n\u003cp>来源：杰普特；正文摘录：ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶Ð\u003c/p>\n\u003c/ol>\n\u003ch3>天孚通信（300394.SZ）· 当天提及 1 次\u003c/h3>\n\u003cp>\u003cstrong>命中附件原文线索：\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003ccode>HK_A_Recap_2026-08-21 re\u003c/code>\u003c/li>\n\u003cp>来源：HK_A_Recap_2026；正文摘录：300394 天孚通信 273.08 −1.2% 同属光模块链但今天逆板块方向下跌，成交140.6亿仍是全场第一大，说明资金在这只票上有分歧。\u003c/p>\n\u003c/ol>\n\u003ch3>炬光科技（688167.SH）· 当天提及 1 次\u003c/h3>\n\u003cp>\u003cstrong>文字观点原文线索：\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003ccode>2026-08-22 22:13\u003c/code> 【浙商计算机 童非】Micro LED光互联进入验证期 核心变化：Micro LED的价值正在从“显示”延伸至“通信” AI集群规模持续扩大，服务器内部与机柜内短距互联对功耗、带宽\u003c/li>\n\u003c/ol>\n\u003ch3>寒武纪（688256.SH）· 当天提及 1 次\u003c/h3>\n\u003cp>\u003cstrong>命中附件原文线索：\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003ccode>HK_A_Recap_2026-08-21 re\u003c/code>\u003c/li>\n\u003cp>来源：HK_A_Recap_2026；正文摘录：TradingView Lightweight Charts · 日线至2026-08-21 · 布林=20日均±2σ · 上涨红、下跌绿 A股与港股复盘 2026年8月21日 研究笔记 · 不构成投资建议 第 5 / 11 页 个股：北向资金今日买入最多的名字，与涨幅榜前列高度重合——寒武纪、紫金\u003c/p>\n\u003c/ol>"}</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
