时，同比增长1.7%。全国最大用电负荷创历史新高，达到15.6亿千瓦。其中全国充换电服务业、互联网数据服务用电量增长强劲，分别为172亿、102亿千瓦时，同比增速分别达到51.2%、37.9%。涨停板：新能股份其他强势股：立新能源、芯能科技、闽东电力煤炭9月22日，生意社炼焦煤基准价为2373.75元/吨，与本月初(2268.75元/吨)相比，上涨了4.63%。涨停板：大有能源其他强势股：云煤能源、郑州煤电、晋控煤业、陕西黑猫江淮汽车：消息称玛莎拉蒂与华为、江淮汽车开展长期产业合作谈判#文字观点", "publish_time": "2026-09-22 15:48", "tags": ["文字观点"]}, "post:2026-09-22T17-10:451ed75902fb": {"id": "post:2026-09-22T17-10:451ed75902fb", "kind": "post", "title": "2026-09-22 17:10", "source_label": "帖子正文", "excerpt": "瑞银 —— 亚太科技策略：人工智能（AI）需求未见放缓迹象 📝💡核心结论：瑞银（UBS）亚太科技策略团队认为，AI 算力投资周期具备高度可持续性，需求能见度已延伸至 2028 年。📝✨代理式人工智能（Agentic AI）正成为 AI 普及的关键拐点，叠加超大规模（Hyperscale）及新云（Ne", "content": "瑞银 —— 亚太科技策略：人工智能（AI）需求未见放缓迹象 📝💡核心结论：瑞银（UBS）亚太科技策略团队认为，AI 算力投资周期具备高度可持续性，需求能见度已延伸至 2028 年。 📝✨代理式人工智能（Agentic AI）正成为 AI 普及的关键拐点，叠加超大规模（Hyperscale）及新云（Neocloud）厂商经营性现金流（OCF）预期上调 30%，行业资本开支（Capex）与 OCF 的融资缺口仍属可控。 📝📊板块配置排序上，瑞银首选内存（Memory）> 半导体设备（Semiscap）> 多层陶瓷电容器（MLCC）> 精选中国台湾地区半导体（Select Taiwan Semis）。 📝🔍关键辩论一：AI 周期是否可持续？📝✅瑞银观点：是。 📝🚀代理式 AI 的爆发正显著提振 AI 加速器及配套内存需求。 📝💰2027 年超大规模及新云厂商的 OCF 预测上调 30%，尽管资本开支与 OCF 的融资缺口仍是首要风险，但基于当前现金流生成能力，该缺口具备可管理性。 📝🔍关键辩论二：内存上行周期是否可持续？📝✅瑞银观点：是。 📝📈瑞银将动态随机存取存储器（DRAM）上行周期延长预期至 2028 年二季度，NAND 闪存上行周期预期至 2027 年四季度。 📝💵2027 年内存行业总收入预计突破1.64 万亿美元，其中超大规模及新云厂商将消耗逾 50% 的产能，主要风险在于整体可负担性。 📝📜瑞银预计，长期供应协议（LTA）将覆盖超过 50% 的行业出货量，意味着超过 40% 的定价将转为固定 / 固定（Fixed/ Fixed）模式。 📝🔎英伟达（NVIDIA）Rubin Ultra 的 HBM（高带宽内存）降规并未削弱需求，服务器 DDR5 及固态硬盘（SSD）需求持续存在上行空间。 📝👀投资者关注点将日益聚焦于股东回报。 📝🔍关键辩论三：除内存外，瑞银看好哪些板块？📝✅瑞银观点： 📝🔧半导体设备（Semiscap）方面，先进逻辑晶圆厂设备（WFE）需求明显回升，韩国资本开支预测上调，CPU 及 AI ASIC（专用集成电路）需求与测试周期支撑测试设备厂商。 📝🇨🇳🇹🇼中国台湾半导体方面，台积电（TSMC）AI/HPC（高性能计算）订单能见度延伸至 2029/2030 年，日月光（ASE）的 LEAP（先进封装）进展顺利，联发科（MediaTek）在谷歌（Google）TPU V9 的布局稳固。 📝⚡MLCC（多层陶瓷电容器）方面，AI 服务器需求持续强劲，挤压其他应用领域产能。 📝⭐区域首选标的包括：关键买入建议 —— 三星电子（Samsung Electronics）、联发科、东京电子（Tokyo Electron）、北方华创（NAURA）。 📝📋股票评级与目标价更新：📝📌瑞银维持对三星电子（目标价 53.5 万韩元，潜在上行 95.3%）、SK 海力士（目标价 300 万韩元，潜在上行 60.6%）、台积电（目标价 3650 新台币，潜在上行 47.2%）、小米（中性，目标价 30.4 港元，潜在上行 10.2%）等核心覆盖标的的评级。 📝📑最看好名单（Most Preferred）新增台达电、DI Corp、京元电子，剔除创意电子、Hansol Chem 及纬颖； 📝📉最不看好名单（Least Preferred）剔除华虹半导体，新增瑞昱半导体，当前包括华硕、仁宝、德赛电池、韩美半导体、群创光电、大立光、LG Display、LG 电子、卓胜微、和硕、瑞昱半导体及小米。 📝📈估值与仓位指标：📝🧮当前亚太科技板块远期市盈率（PE）均值为 5.4 倍（2026 年预期）、4.0 倍（2027 年预期）及 3.2 倍（2028 年预期）。 📝🏆内存子板块估值领先，2027 年预期 PE 达 4.3 倍。 📊📊拥挤度评分（Crowding Score）显示，台积电（20.3）、三星电子（14.0）、SK 海力士（16.8）处于高位，而小米（-15.5）、中芯国际（SMIC，-2.3）则呈现负向拥挤度，暗示低配或做空交易拥挤。 📝📊瑞银量化研究显示，三星及 SK 海力士的杠杆 ETF 交易占比近期显著攀升，反映零售资金活跃度提升。 📝💸超大规模厂商资本开支追踪：📝📊2026 年全球前 12 大超大规模厂商资本开支总额预计达1.01 万亿美元（同比增长 98.5%），2027 年预计达1.45 万亿美元（同比增长 43.5%）。 📝📈其中，内存支出占比将从 2025 年的 14% 飙升至 2027 年的 64%。 📝🗺️英伟达（NVIDIA）AI GPU（图形处理器）路线图显示，2026 年 Blackwell Ultra（GB300）及 2027 年 Rubin 架构将主导增长，Rubin Ultra 将采用 HBM4E，单机架平均售价（ASP）较 Blackwell 高出 70% 至 700 万‑800 万美元。 📝🔬先进封装与 CoWoS 产能：📝📊瑞银预计，2027 年底全球 CoWoS（Chip‑on‑Wafer‑on‑Substrate）总产能将达到 270kwpm（千片晶圆 / 月），其中台积电（TSMC）占比约 67%。 📝📌英伟达（NVIDIA）仍将占据约 46% 的 CoWoS 产能分配，但非英伟达需求（主要来自 AMD、谷歌 TPU、亚马逊 Trainium 等 ASIC）正快速攀升，2027 年预计占行业总需求的 54%。 📝⚠️英特尔（Intel）的 EMIB‑T（嵌入式多芯片互连桥接‑先进版）技术若成功量产，至 2030 年可能夺取先进封装市场 13%‑18% 的份额，对台积电 CoWoS 构成潜在竞争。 📝📦内存供需与 HBM 展望：📝📈2027 年 DRAM 比特（Bit）终端消费预计同比增长 39%，其中AI 服务器 HBM 需求将达 615.2 亿 Gb，占 DRAM 总需求的 11%。 📝🚀HBM4 将于 2026 年开始放量，SK 海力士在 HBM4 的份额预计维持在 55%‑60%，三星电子通过提升 1c 纳米制程良率，目标在 2027 年以 41% 的 HBM 比特份额超越 SK 海力士（37%）。 📝💽NAND 闪存方面，2027 年服务器 SSD 需求预计同比增长 55%，但整体 NAND 行业产能利用率将维持在 1.3m wpm（百万片晶圆 / 月）左右，供需维持紧平衡。 📝📱传统硬件与 PC / 智能手机：📝📉受内存成本飙升挤压，瑞银将 2027 年全球 PC 出货量预期下调至2.31 亿台（同比萎缩 4%），智能手机出货量下调至11.05 亿部（同比萎缩 3%）。 📝🔍UBS Evidence Lab 消费者调查显示，尽管换机周期缩短至 2.86 年，但50% 的延迟购买者归因于内存涨价，消费者正通过降低规格或推迟购买来应对。 📝🍎智能手机方面，苹果 iPhone 18 Pro/Pro Max 构建量预计同比持平至增长 5%，三星凭借自供内存优势，2027 年出货量预计稳定在 2.58 亿部（同比增长 3%），小米则面临安卓阵营内存成本冲击，2027 年出货量前景存在不确定性。#文字观点", "publish_time": "2026-09-22 17:10", "tags": ["文字观点"]}, "post:2026-09-22T14-39:fef924ccc08a": {"id": "post:2026-09-22T14-39:fef924ccc08a", "kind": "post", "title": "2026-09-22 14:39", "source_label": "帖子正文", "excerpt": "【招商商社互联网】阿里云栖大会主论坛重点内容总结算力#GPU自研芯片：发布新一代 AI芯片真武V900，是目前中国算力性能最强的AI芯片，性能达到M890的3 倍，将在27Q1正式量产售卖。2028Q3将进一步推出真武J900。", "content": "【招商商社互联网】阿里云栖大会主论坛重点内容总结算力#GPU自研芯 fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 三，与Astra和Fable5.1并列。相较于Fable5.1，目前还稍有差距。 3.2026年底千问对比国内KIMI、智谱，Coding与Agent能力 竞争格局 时间放在2026年第四季度，单从Coding能力来看，千问4的水平预计将略等于 KIMIK3，同时略大于智谱GLM5.3。 4.若千问4Coding能力仅与KIMIK3相当，如何实现赶超 Fable5.1的目标 需要从两个层面理解： 1.在权威测评榜单上，千问4的目标是进入全球前三； 2.在基于开发者反馈的真实应用场景中，尤其是在长任务处理上，目前版本相较于 KIMIK3还稍弱一点，到年底目标是“略等于K3”。后续千问4.1版本将致力于追赶 甚至超过K3，巩固“国内第一、全球前三”定位。 目前国内第一梯队大致排序：千问、KIMI、智谱。DeepSeekV4系列表现未达预期主 要是Harness部分偏弱；DeepSeek正在通过4.2版本以及开源Harness弥补短 板，补强后有望进入第一梯队，处于第三或第四位置。 6.千问海外测评表现优异，但实际代码能力与智谱相当、略逊Kimi 的原因 两点核心原因： 1.先发与数据回流差异：智谱AI、Kimi早期1‑2个季度具备先发优势，被Cursor 等头部编程工具接纳为备选，更早拿到场景数据回流用于强化学习；千问从3.6版5.千问4系列采用激进全新技术架构（ 3.8flash 为先行版本）背后 考量 千问4系列最重要变化在于 注意力机制 ，和千问 3系列差异巨大。旧架构为 GQA， 新架构采用 混合注意力架构（ GDN+QSA 叠加），对模型层数、注意力机制层、线性 注意力层进行调整与增加，完成整体架构升级。从计算效率看， 3.8系列已经拥有较高 计算效率。 qq1490929960 本 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 才开始使用该类回流数据，晚约一个季度。 2.奖励模型方案差异：智谱AI使用三种不同权重的奖励模型做强化与评测，该方案 现阶段效果优于千问。 7.国内大模型能力收敛、梯队差距缩短至三个月内的行业判断 国内头部前四家厂商模型能力趋于收敛，核心原因：模型架构、注意力机制、训练范式、 数据回流机制关键点高度相似。 竞争转向：基础模型同质化后，竞争焦点不再是基础模型本身，转向Agent生态构 建。竞争由单一模型比拼升级为系统化竞争，重点打造中间层与配套工具链，Astra就 是该趋势的典型代表。 8.Agent生态竞争下，腾讯、阿里、字节的生态入口优势判断 拥有入口流量的企业具备先机。以腾讯Workbuddy为例，用户规模领先；即便客户选 用Kimi等第三方模型，腾讯仍可获取中间调用层数据；使用自研模型则可获得完整数 据回流。 未来竞争关键：掌握更大入口流量、率先形成数据回流闭环；即使初始模型偏弱，持续 数据反馈也可以拉动能力提升。腾讯目前处于第二梯队靠前，预计1‑2个季度有望进 入第一梯队。 9.算力约束下国内参数上限3‑5T，海外训练超10T参数模型， 国内外差距是否会继续扩大 国内外存在代差，代差周期已经由12个月缩短至约6个月。海外在原创技术保持引 领，国内更多是跟随复制海外验证可行的技术路径。该跟随范式预计持续至2028年前； 2026‑2027国内仍处于追赶状态，维持约半年代差。 10.国内外大模型核心差距，国内追赶关键点 纯粹模型层面差距在持续收敛；核心差距转移到生态能力层。海外具备大量第三方软件、 指令级对接工具生态。国内追赶关键：打通整合海外工具或国产替代工具，构建完整生 态，该问题不能单纯依靠算力解决。 11.RSI发展现状与判定进入RSI阶段关键指标 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 RSI是大模型训练的终极目标之一，行业整体处于RSI早期阶段；当前仅实现半自动、 局部递归改进，尚未做到全自动自我迭代。真正全自动化RSI可独立完成数据收集、 架构与算法自我迭代。 判断进入RSI阶段关键指标：大版本更新周期。当前行业普遍半年一个大版本；若 缩短至两个月，则标志进入RSI阶段。 海外Astral的RSI水平约2.5，属于半自动化，架构、算法探索依旧依赖人工， 尚未实现AI完全自主探索。 12.高性价比Flash模型普及，未来定价竞争格局，是否会爆发 token价格战 未来竞争不再是单纯token单价价格战，而是Agent完成任务的平均总成本竞争。 Flash高性价比模型的核心价值不是简单降价，而是降低完整Agent任务链路的总 token消耗。 系统可智能调度：简单子任务交给Flash模型，复杂核心环节调用Max旗舰模型， 优化整体成本。最终比拼不同难度任务下Agent方案的平均成本与执行效率，目标实 现“越用越智能，越用越便宜”。 14.token价格长期下行是否会挤压MaaS利润率 不会挤压利润率，核心逻辑是价跌量增，依靠调用规模增长对冲单价下行。同时业务分 层收费： 1.API调用（token计量）； 2.面向终端用户的订阅付费模式，用户感知不到token消耗，为利润留出空间13. Qwen4 定价策略，对比 Qwen‑3.8 Max Qwen4旗舰模型定价 略高于 Qwen‑3.8 Max。参考： Qwen‑3.8 Max 原价36元/ 百万token，折扣后 18元/百万token。新版本初期会提供优惠折扣，未来会考虑 和Flash模型组合销售。 定价指扣扣ºÅ1490929960 导原则：保障高利用率。价格抬升来自参数量增加，激 活 参数量大于上代（例：新模型激活 140B，上代 95B），显存资源消耗更高。 。 15.训练追求降本，但旗舰模型定价上行，如何和“价跌量增”协调 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 模型训练环节会通过架构优化、稀疏化、分组注意力持续降本；但产品定价会核算成本 基础上叠加利润空间（举例60%利润空间）。定价由产品商业规则约束，不会随训练 成本下降立刻大幅降价。 16.阿里MaaS、腾讯不做MaaS主打Workbuddy，商业模式差 异解读 二者殊途同归。 •MaaS1.0：狭义，仅售卖模型API； •MaaS2.0：广义综合服务，包含API、Agent、订阅、AI原生应用产品包。 腾讯自研模型API竞争力有限，选择侧重Agent产品（Workbuddy），本质也是MaaS 服务，只是产品侧重点不同。 17.API直接调用与Agent工具间接调用模型，用户使用习惯差异 两类使用方式： 1.直接调用API：开发者将密钥嵌入工作流、编程环境，面向具备编程能力的专业开 发人员； 2.间接使用：通过集成API的第三方工具（Cursor、Windows12、ClaudeCode等） 使用模型，面向普通使用者。 18.Workbuddy类产品如何降低门槛扩大用户群体 面向无编程背景普通白领，把API技术细节封装在可视化界面背后，用户无需懂开发 即可操作。用户空间对比：全球付费编程客户约600万；白领群体3.6亿；若实现 20‑30%付费转化，付费用户可达7000万，是编程付费群体十倍以上。 19.MaaS业务EBITDA利润率提升潜力与驱动因素 中长期EBITDA具备显著提升空间，三大驱动： 1.算力资源分配优化：未来1‑2年算力依旧紧张，算力优先供给高价值、高付费能 力客户，优化收入与定价结构； 2.客户渗透率提升：推动存量上云客户使用AI服务；同时已使用AI客户拓展业务 场景，场景数量从二三十个拓展至五六十个； 3.产品模式升级：由单纯售卖API转向模型+Agent+应用综合方案，单次推理 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 token消耗显著抬升，提升业务价值。 20.字节跳动云与大模型定价策略，价格战对阿里云客户的冲击 字节两大价格武器：更低算力租赁、更低模型调用价格，主要抢夺价格敏感中小客户， 该类客户多云部署，对价格敏感。 阿里云头部、腰部大客户受价格战影响有限：业务与云平台深度绑定，迁移成本极高， 不会因为小幅降价迁移，大客户绑定关系稳固。 同时专家对字节大模型梯队位置解读：字节资源、人才、数据储备充足，但大模型处在 第二梯队，原因： 1.资源向Seedance、即梦等视频生成业务倾斜； 2.内部模型团队分散（豆包、即梦独立运作），缺少统一底层工程架构规划，跨模态 技术难以互相赋能； 3.基础模型整套训练链路停留在约一年前的范式，未完成升级；即使算力充足，未来 一年内很难突破进入第一梯队。 21.开源模型商业化策略与后续节奏 旗舰模型发布策略调整：2026年4‑8月曾闭源；后续策略为先发布新版本，延迟 1‑2个月再开放权重，视行业竞争动态调整，智谱、Kimi开源会倒逼自身跟进开源。 商业逻辑：即便权重开源，万亿级大模型绝大多数客户受算力约束无法本地部署，仍会 选择云上调用，完成商业闭环、流量回流。开源协议为Apache2.0，个人免费；商业 化售卖需要获取官方授权，再开展商业谈判。 22.是否达成海外CSP厂商类似Kimi的30%收入分成合作 暂未和海外CSP厂商做收入分成合作；当前模型能力尚未达到顶尖，议价不足；未来 若被AWS、微软、Google认可部署，才会探讨分成模式。 国内采用直供分销模式：智谱、Kimi部署到云平台，平台代为销售、收入分成；平台 不承担算力，但承担开票结算成本。对客户价值：一站式云商场，可以同时采购模型API 和其他云产品，支持打包折扣。 利润率差异：自研模型利润率更高；分销第三方模型平台收取25%分成，扣除开票等 成本后利润率偏低。 23.算力分配：自研训练推理、阿里云大客户、被投企业算力供给优 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 先级 阿里云算力分配四优先级： 1.第一优先级：自研模型训练、推理； 2.第二优先级：阿里云头部外部客户； 3.Kimi这类被投企业：按投资协议承诺提供算力，以算力券抵扣现金，内部跨部门 结算； 分配原则：先保障第一优先级资源，剩余算力再供给外部合作方。 24.AI厂商自建算力浪潮，对云厂商的冲击 AI公司自建算力主要解决底层模型；上层业务开发、数据处理、应用构建大概率依旧 跑在云厂商平台。类比：客户外购“鞋子（底层模型）”，但全套上层配套“衣服配饰（应 用与云服务）”继续采购云平台；云厂商核心壁垒是完整基础服务生态，不会被自建算 力削弱。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "attachment:files/20260921 市场逻辑精选.pdf": {"id": "attachment:files/20260921 市场逻辑精选.pdf", "kind": "attachment", "title": "20260921 市场逻辑精选", "source_label": "其他", "excerpt": "逻辑红宝书2026-9-21 特别提示:下述涉及的题材或公司,内容罗列和篇幅长短,与后续涨跌无关,亦均非进行推荐,仅 作研究辅助。投资者应自主决策,注意风险。", "content": "逻辑红宝书2026-9-21 特别提示:下述涉及的题材或公司,内容罗列和篇幅长短,与后续涨跌无关,亦均非进行推荐,仅 作研究辅助。投资者应自主决策,注意风险。 一、市场热点 创新药:美国拟开放中国新药授权,BD出海持续景气 驱动:2026年9月18日盘后市场消息(未证实),美国财政部正在草拟对华药企投资新规,拟放 行中国新药授权交易,草案倾向于允许美企与中国药企开展绝大多数医药授权许可交易,仅把 可武器化的病原体、生物技术划为红线。 BD出海: 1)机构表示,中国创新药企业的BD项目已占全球技术出海的75%,未来应更多地参与全球市 场销售,因此大药企更鼓励采取newco和coco的模式,而小药企只要不授权核心技术平台, 管线授权也不会受限。 2)出海端,2026年上半年中国对外BD首付款50.00亿美元,同比增长78.50%,对外BD里程碑 97亿美元,同比增长50.1%,中国创新药BD出海持续景气。 AI制药: 1)近期Anthropic被着手建设湿实验室,用于生物学研究,并与诺和诺德达成合作,双方将利用 Anthropic的AI模型与ClaudeScience支持药物发现与研发。2)机构调研表示,Anthropic需开 拓coding以外的新垂类,AI4S(AIforScience)为重要方向,AI4S具备高壁垒(数据封闭、客户信 任周期长)和增量价值(发现新物质可创造巨大市场),龙头效应比较明显。 核心公司: 华北制药:1)公司奥木替韦单抗注射液为我国狂犬病防控领域批准的第一个重组人源抗狂 犬病毒单抗,治疗用生物制品1类新药,奥木替韦单抗高浓度注射液已完成临床试验并上报 CDE,基因重组抗狂犬病毒抗体组合制剂正在开展期临床。2)公司在研创新药包括生物药重组 破伤风疫苗、四价重组诺如病毒疫苗、基因重组人血白蛋白、长效重组人促 "source_label": "帖子正文", "excerpt": "伯恩斯坦——中国半导体：澜起科技（Montage）：CXL深度解析——DDR4复用带来的新增长引擎 核心结论：伯恩斯坦认为，DDR4复用有望成为CXL内存扩展控制器（MXC）的首个大规模商业应用，并可能成为澜起科技的新增长引擎。受代理式人工智能（Agentic AI）驱动，全球服务器DRAM（动态随", "content": "伯恩斯坦——中国半导体：澜起科技（Montage）：CXL深度解析——DDR4复用带来的新增长引擎 核心结论：伯恩斯坦认为，DDR4复用有望成为CXL内存扩展控制器（MXC）的首个大规模商业应用，并可能成为澜起科技的新增长引擎。受代理式人工智能（Agentic AI）驱动，全球服务器DRAM（动态随机存取存储器）供需缺口持续扩大，而通过CXL MXC将退役的DDR4内存重新利用于DDR5世代服务器，具备显著的成本优势。伯恩斯坦预计，到2030年，DDR4复用对应的全球CXL MXC（内存扩展控制器）潜在市场规模（TAM）将达到约82亿美元。假设澜起科技在中国市场占据50%份额、在非中国市场占据10%份额，该业务将为其2028年预期收入带来约10%的上行空间。基于此，伯恩斯坦将澜起科技2027年及2028年每股收益（EPS）分别上调2%和11%，重申其H股（6809.HK）520.00港元、A股（688008.CH）400.00元人民币的目标价及“跑赢大盘”（Outperform）评级。 一、CXL技术演进与DDR4复用的商业逻辑。 1）CXL（Compute Express Link，计算快速链路）技术诞生不足十年，已从利基提案演变为重塑数据中心架构的通用标准。CXL 1.0/1.1确立了基于PCIe（外围组件互连高速）的缓存一致性协议；CXL 2.0引入交换（Switching）技术，实现跨主机的内存池化，为DDR4复用奠定基础；CXL 3.0/3.1进一步迈向机架级可组合架构。DDR4复用有望成为推动CXL从生态建设转向大规模部署的“杀手级应用”，并为后续的内存池化与共享铺路。 2）三大应用场景：直连扩展（Point-to-point）通过MXC芯片增加单机内存容量，无需CXL交换机；交换式池化（Switch-based Pooling）通过CXL交换机将内存资源在多个CPU/GPU（通用计算单元）间动态分配，减少闲置容量；CXL Fabric/全局附加内存（G-FAM）支持跨节点共享内存，降低数据移动开销，但商业成熟度最低，需要更长的落地周期。 3）重塑内存层级：高带宽内存（HBM）受封装与成本限制容量，本地DDR（双倍数据速率内存）扩展受限于CPU内存通道与DIMM（双列直插式内存模块）插槽。CXL附加DRAM（动态随机存取存储器）作为“温内存层”（Warm Memory Tier），填补了本地DDR（延迟约80-120纳秒）与NVMe SSD（固态硬盘，延迟约50-150微秒）之间的性能鸿沟，其延迟约为150-300纳秒，单设备容量可达0.25-2TB以上，为AI（人工智能）推理、检索增强生成（RAG）等场景提供更具性价比的容量扩展。 二、DDR4复用的经济性与市场空间测算。 1）供需缺口驱动：伯恩斯坦预测2025至2028年全球服务器DDR需求复合年增长率（CAGR）将达47%，而同期整体DRAM位元容量增速仅约24%。受HBM（高带宽内存）制造资源挤占及新增产能爬坡缓慢影响，预计2027年与2028年全球服务器DDR短缺量将分别达到约55亿GB和110亿GB。 2）成本优势显著：服务器更新周期通常为5至7年，而DRAM（动态随机存取存储器）使用寿命可达10年以上。通过CXL MXC，DDR5世代的CPU（中央处理器）可访问退役的DDR4内存。基于2026年8月合约价测算，128GB的DDR4复用配置（含MXC及附加卡成本）总购置成本约920美元，相比同等容量的原生DDR5（约3500美元）节省74%（约2580美元）；64GB配置亦可节省约59%。 3）TAM（潜在市场规模）测算：伯恩斯坦采用自下而上方法，假设2028至2030年CXL-enabled DDR4复用将解决50%的服务器DDR容量缺口。结合每GB扩展容量的MXC价值量，预计全球CXL MXC潜在市场规模（TAM）到2030年将达约82亿美元。若澜起科技在中国及非中国市场分别取得50%和10%的份额，将带来相当于其2028年预期销售额约10%的增量收入。 三、技术可行性与工作负载适配性。 1）PCIe（外围组件互连高速）通道资源充足：通用服务器CPU（如英特尔Sapphire Rapids拥有80条PCIe 5.0通道，AMD EPYC 9004在单路配置下拥有128条通道）通常具备足够的I/O（输入/输出）余量来支持1至2个MXC设备，而AI（人工智能）服务器因加速卡与高速网络占用大量通道，机会成本较高。 2）性能边界与局限性：CXL扩展带宽取决于上游PCIe链路与下游DDR4接口的上限。以澜起科技M88MX5891方案为例，其采用PCIe 5.0 x8连接，单向理论带宽约31.5GB/s，下游单通道DDR4-3200提供25.6GB/s带宽，整体性能约相当于一个原生DDR4通道，远低于多通道本地内存子系统。延迟是更关键的性能惩罚，低负载下CXL内存访问延迟约为本地DRAM的2至2.5倍（约200-270纳秒），高负载下排队延迟将进一步恶化。 3）AI（人工智能）工作负载适配：最适合DDR4复用的场景是需要大容量内存但“热工作集”（Hot Working Set）占比较低的任务。代理沙盒（Agent Sandbox）与虚拟机（VM）内存是最佳切入点，大量分配的内存处于空闲或温数据状态；非活跃/前缀键值缓存（KV Cache）、RAG（检索增强生成）/向量数据库的长尾数据、推荐系统/嵌入表的冷数据也是理想目标。有效的内存分层（Tiering）策略可将热数据保留在本地DDR，温数据置于CXL DDR4中。 四、竞争格局与澜起科技的核心优势。 1）CXL MXC（内存扩展控制器）市场目前高度集中，主要参与者包括澜起科技、Astera Labs（Astera实验室）、Marvell（美满电子）以及Meta（元平台公司）的内部解决方案。Meta的方案属于自用性质，并非商业竞争对手。 2）澜起科技的M88MX5891芯片采用相对简洁的PCIe 5.0 x8 + 单DDR4通道 + 2 DPC（DIMM Per Channel，每通道DIMM数）架构，支持两颗DDR4 DIMM。该设计以较低的控制器成本实现了较小的容量增量，非常适合成本敏感的DDR4复用场景，与Astera Labs和Marvell动辄支持12颗DIMM的大容量方案形成差异化。 3）澜起科技作为早期MXC（内存扩展控制器）供应商及中国本土唯一具备意义的商用MXC（内存扩展控制器）厂商，拥有成熟的服务器内存接口客户基础。其现有内存接口芯片业务与CXL（计算快速链路）复用架构高度协同，有利于在国内云服务提供商（CSP）中率先实现认证与部署。通用服务器是初期主要目标市场，最终收入转化取决于CSP（云服务提供商）认证进度、板卡部署规模及竞争份额。 五、财务预测调整与估值。 1）模型更新：伯恩斯坦将CXL（计算快速链路）带来的增量收入纳入模型，2026年至2030年收入预测较此前基准有所调整，其中2028年上调10.3%，2029年上调13.5%，2030年上调19.0%。2027年与2028年每股收益（EPS）分别上调2%和11%至5.69元和11.74元。 2）估值与目标价：A股目标价400.00元人民币基于51倍两年期远期市盈率（2BF P/E）；H股目标价520.00港元，较A股目标价溢价15%（汇率按1:1.13计算），以反映全球投资者将其视为稀缺的中国AI（人工智能）敞口标的，且不受实体清单限制或出口管制逆风的影响。H股对应两年期远期市盈率（2BF P/E）为59倍。 3）主要风险：内存及人工智能数据中心（AIDC）服务器需求不及预期；竞争加剧导致份额流失及利润率下滑；未能成功推出面向AIDC（人工智能数据中心）网络市场的新产品。#文字观点", "publish_time": "2026-09-22 12:54", "tags": ["文字观点"]}, "post:2026-09-22T12-54:1efd12310461": {"id": "post:2026-09-22T12-54:1efd12310461", "kind": "post", "title": "2026-09-22 12:54", "source_label": "帖子正文", "excerpt": "瑞银——全球输入输出（I/O）半导体：ASIC（专用集成电路）与CPU（中央处理器）走向舞台中央，驱动下一波CoWoS（晶圆级芯片尺寸封装）产能扩张 核心结论：云端AI（人工智能）芯片需求结构发生根本性转变，ASIC与CPU接棒GPU（图形处理器）成为CoWoS产能扩张的新引擎，2027至2028年", "content": "瑞银——全球输入输出（I/O）半导体：ASIC（专用集成电路）与CPU（中央处理器）走向舞台中央，驱动下一波CoWoS（晶圆级芯片尺寸封装）产能扩张 核心结论：云端AI（人工智能）芯片需求结构发生根本性转变，ASIC与CPU接棒GPU（图形处理器）成为CoWoS产能扩张的新引擎，2027至2028年产能能见度持续上修。 瑞银（UBS）基于中国台湾峰会调研及产业分析，将2027年底全球CoWoS总产能预期从260kwpm（千片晶圆/月）进一步上调至270kwpm，远高于2026年底的160kwpm。即便考虑到英特尔（Intel）EMIB-T及台积电（TSMC）CoPoS（基板级扇出型封装）在2028至2029年针对大尺寸AI（人工智能）加速器的产能爬坡，2028年的产能扩张需求依然明确。这一趋势反映出云端AI芯片需求愈发强劲且多元化，尤其是CPU与ASIC在2028至2029年仍将主要依赖CoWoS工艺。同时，异构集成（Heterogeneous Integration）向更大封装尺寸演进也显著消耗了更多产能。在供应端，随着外包半导体封装测试厂（OSAT）能力的提升及总体产能需求扩大，CoWoS供应格局正加速多元化。在Chip on Wafer（CoW）环节，日月光（ASE）的扩产最为激进，预计其产能将从2026年底的20kwpm激增至2027年底的70kwpm，而台积电与安靠（Amkor）的CoW产能预计在2027年底分别为180kwpm与20kwpm。在Wafer on Substrate（WoS）环节，除与日月光合作外，台积电可能在2028年引入新的OSAT合作伙伴进行量产。 ASIC（专用集成电路）研发成果进入兑现期，超大规模云厂商（Hyperscaler）需求爆发。 经过数年投入，大型云厂商及AI原生公司在自研AI加速器和CPU方面取得实质性进展。在AI加速器领域，微软（Microsoft）的Maia 300性能表现具备竞争力，预计2027年Maia 200/300出货量将达到5万/35万颗，较2026年总计约10万颗大幅增长。OpenAI的Jalapeno项目预计将在2027年从2026年的15万颗激增至60至70万颗。Meta的MTIA项目也瞄准更高出货量，2027年目标约为45万颗，尽管其能见度略低于微软和OpenAI。谷歌（Google）TPU（张量处理器）和亚马逊（Amazon）Trainium等大型项目进展顺利，预计2027年谷歌TPU封装需求将从2026年的410万颗增至900万颗，亚马逊Trainium从250万颗增至320万颗。 英伟达（Nvidia）与AMD（超威半导体）需求预期上调，Rubin架构与Venice CPU成关键增量。 瑞银将英伟达2027年AI GPU（图形处理器）产量预测从820万颗上调至880万颗，主要源于Rubin架构出货量预期提升及约20万颗Rubin CPX（计算扩展版）的贡献。Rubin Ultra由于采用相似的封装架构及HBM（高带宽内存）规格下调，预计将从2027年年中开始更为平滑且快速地爬坡。对于AMD，考虑到服务器CPU Venice的强劲放量，瑞银将其2027年CoWoS需求预测上调11%，预计Venice CPU在2027年出货量可能达到500万颗，高于此前400万颗的预期。受限于产能紧张，瑞银维持AMD 2027年AI加速器出货量190万颗的预测不变。 股票推荐：首选台积电、联发科（MediaTek）与日月光，关注先进封装设备商。 在云端AI半导体供应链中，瑞银的首选标的包括：台积电（全球领先的云端AI晶圆代工厂）、联发科（为谷歌TPU提供设计服务并拥有新ASIC机会，关键买入评级）以及日月光（先进封装与测试）。瑞银预计，包含先进封装在内的后端业务，在2026至2027年预计将占台积电营收的12%至16%。即便面临英特尔EMIB的竞争，台积电先进封装销售额在2026至2030年仍有望维持约50%的年复合增长率（CAGR）。先进封装与测试的关键设备供应商也将受益于CoWoS产能加速扩张及封装结构向更大、更复杂演进的趋势，瑞银看好全智科技（All Ring）、志圣工业（GPTC）、致茂电子（Chroma）、弘塑科技（Hon Precision）及ASMPT。瑞银将志圣工业的目标价从5,000新台币下调至4,300新台币，基于相同的33倍2027至2028年预期平均市盈率（PE）。瑞银将志圣工业2026至2028年每股盈利（EPS）预测下调25%、21%及8%，主要反映2026年工具单位销售收入确认减少及平均售价（ASP）假设下调。重申买入评级，因瑞银认为志圣工业将是先进封装产能扩张的关键受益者。瑞银同时看好信骅科技（Aspeed）强劲的BMC（基板管理控制器）前景，以及世芯电子（Alchip）在亚马逊Trainium 3和Trainium 4项目中的机会。#文字观点", "publish_time": "2026-09-22 12:54", "tags": ["文字观点"]}, "attachment:files/国内先进封装市场调研‑1：最新市场供需现状及 CoWoS‑L 发展展望.pdf": {"id": "attachment:files/国内先进封装市场调研‑1：最新市场供需现状及 CoWoS‑L 发展展望.pdf", "kind": "attachment", "title": "国内先进封装市场调研‑1：最新市场供需现状及 CoWoS‑L 发展展望", "source_label": "其他", "excerpt": "国内先进封装市场调研‑1：最新市场供需现状及 CoWoS‑L发展展望 CoWoS‑L与CoWoS‑S方案成本及良率对比，各封测厂良率表现及后续提升预期 （通富/渠梁/长电/华天科技） 核心要点 1.国内先进封装市场供需现状及CoWoS‑L发展展望 2.CoWoS‑L与CoWoS‑S方案成本及良率对比 3.各封测厂CoWoS‑S和CoWoS‑L良率对比及后续提", "content": "国内先进封装市场调研‑1：最新市场供需现状及 CoWoS‑L发展展望 CoWoS‑L与CoWoS‑S方案成本及良率对比，各封测厂良率表现及后续提升预期 （通富/渠梁/长电/华天科技） 核心要点 1.国内先进封装市场供需现状及CoWoS‑L发展展望 2.CoWoS‑L与CoWoS‑S方案成本及良率对比 3.各封测厂CoWoS‑S和CoWoS‑L良率对比及后续提升预期 专家问答观点整理 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª1、国内先进封装产业的发展现状、供需关系、竞争格局以及未来展 望 国内先进封装市场目前呈现 需求大于供给 的态势。 先进封装技术， 特别是 2.5D CoWoS 类技术， 主要应用于 AI逻辑芯片和 AI训练大算力芯片卡等产品。 国内市场对这类 AI 芯片卡的需求，无论是来自头部企业还是主流 Fabless 公司，供给都远远跟不上。 在竞争格局方面，国内有多家从事先进封装相关业务的企业，例如盛合晶微、通富微电 和华天科技。然而，其中许多公司并未像盛合晶微或华天那样，针对国内产品提供全流 程的先进封装测试服务。 大部分订单占比实际上是先进封装前的准备工作或封装后的一 系列测试工作，只有小批量订单在运行较为先进的工艺，例如 CoWoS‑L（中介层硅 桥）这类技术。 qq1490929960 展望未来， 2.5D封装技术的发展路径将经历几个阶段： 1.尽管CoWoS‑S目前工作成本较高，但其市场需求量仍会持续上升，短期内不会 被成本更低的 CoWoS‑L技术替代 。 2.随着CoWoS‑L技术的成熟，市场将逐渐由 CoWoS‑S向CoWoS‑L过渡。 3.长期来看，业界将向成本更低、布局更长远的 玻璃基板 CoWoS 类技术演进，国 内已有企业在此领域进行布局。 此外， 3D封装是另一个与先进封装强相关的未来趋势，但其发展进程相较于 2.5D技 _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 术并不稳妥。3D封装不仅涉及微凸块堆叠，还需攻克混合键合(HybridBonding， HB)技术。目前HB相关技术的发展不会太快，预计从2.5D向3D的转换至少需要 5‑8年的时间。 2、先进封装的产能是否是限制国产AI芯片出货节奏的核心瓶颈？ 先进封装产能确实是影响国产AI芯片（如华为、寒武纪等公司的产品）出货量的重要 外部因素之一。但另一个关键限制来自于芯片设计公司自身，即其先进封装工艺流程的 研发尚未完全成熟和稳定。 先进封装工艺的开发并非由封装厂单方面提供方案，而是芯片设计公司从产品设计源头 就需要与晶圆厂、封装厂进行联合开发，以确定能实现产品最佳性能的工艺流程。目前， 这些芯片公司自身的封装工艺流程方案仍在不断变化，尚未最终定型，也缺乏足够的信 心将其固化。 3、国产AI芯片出货的主要限制因素究竟是先进制程产能，还是先 进封装的良率问题？ 核心限制在于先进封装环节，而非先进制程的晶圆供应。Fab厂（如中芯国际）提供的 GoodDie良率实际上是相当高的，但在后道封装制程中，整体良率会出现下降，这直 接关联到封装工艺。 关于晶圆供应，并非是产能不足。晶圆生产有其固有的流片周期，例如一批12英寸晶 圆最快也需要一个半月。因此，目前用于封装的晶圆实际上在几个月前就已经生产备好。 之所以没有立即下放到封装厂，主要原因是考虑到当前先进封装的良率较低。一片晶圆 的成本非常高，如果因为封装良率低导致每片晶圆最终产出的合格芯片数量过少，那么 除了高昂的封装成本外，还需要承担原材料成本的巨大损耗，从而无法实现盈利。 此外，先进封装的成本也存在问题。理论上，更先进的工艺（如CoWoS‑L）应通过 降本增效实现比传统工艺（如CoWoS‑S）更低的成本。但目前情况恰恰相反，由于 新工艺尚不成熟，其封装成本反而更高。例如，寒武纪的卡无法满足字节跳动等客户的 大量需求，一个原因就是其采用的CoWoS‑L先进封装工艺良率把控不佳，同时工艺 未定型也导致设备机台和材料损耗的成本居高不下。 4、目前市场上采用CoWoS‑L封装方案的主要产品有哪些？ 目前在AI逻辑芯片或AI训练卡领域，采用CoWoS‑L方案的主要产品包括华为的 昇腾960和寒武纪的MLU690。这两款产品均采用了双Die设计，并结合HBM进 行2.5D封装。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 此外，市场上也有其他厂商在进行CoWoS‑L相关的业务，但他们的产品主要应用于 更低端的领域，其目的更多是将原有的类CoWoS‑S方案转换为CoWoS‑L以实现 成本降低，与前述用于高端AI芯片的应用场景不同。华天科技也在涉足CoWoS‑L， 主要是为了对其原有的低端产品线（如MOS管、消费级电压模块）进行技术升级和 成本优化，以提升市场竞争力。 5、CoWoS‑L与CoWoS‑S两种封装方案的成本差异有多大， 未来成本趋势如何？ 理论上，仅从封测环节来看，CoWoS‑L方案的成本相比CoWoS‑S能够降低约 35%。 展望未来，随着CoWoS‑L技术方案趋于稳定，例如在2027年或之后，当更多产品 进入规模化量产阶段，其成本预计将持续下降。成本降低的主要驱动力将来自于国产原 材料和设备的替代，以及早期高价采购的设备折旧完毕，达到资本回报目标。 6、目前市场上主流的CoWoS‑S和CoWoS‑L方案产品，其各 自的良率表现如何？ 不同方案和产品的良率存在差异。 数 CoWoS‑L方案 1.寒武纪MLU690：该产品为双Die设计，目前仍处于研发和升级迭代阶段，虽有 部分产品已交付，但良率尚未稳定CoWoS‑S方案 1.华为昇腾 910系列：该系列产品的晶圆良率较高。以昇腾 910C为例，由于是双 Die设计，每颗成品消耗两个 Die，因此在相同 Die产出下，成品 量约为 910B的 一半。 2.华为昇腾 950系列（ 950PR和950DT）：这两款产品方案相似，均为双 Die设 计。其晶 ¿Û¿ÛºÅ 1490929960 圆产出约为 140个Die，其中好的 Die不到70个 。950PR最终可封装成 30多颗成品，而 950DT的良率相对较低，成品数约为 20 颗左右，甚至可能只有十几颗，目前仍处于产能爬坡阶段。 3.寒武纪 MLU590 ：该产品为单 Die设计，采用 CoWoS‑S方案。每片晶圆大约 有140个Die，其中好的 Die约为70个，最终可封装成 50多颗成品。 。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2.华为昇腾960：该产品方案与MLU690类似，但目前进度稍慢于寒武纪，尚未有 产品交付。其良率预计会比MLU690略低。 7、针对华为昇腾950PR，其HBM配置的高低版本在良率和成本 上有何区别？ 昇腾950PR的HBM配置存在高低两个版本，这种差异主要体现在封测成本上，而 对最终产品的良率没有影响。 低配版本（或称青春版）通过减少CoWoS‑S方案中中介层（SiliconInterposer）的 使用，并以有机基板作为替代，从而显著降低了原材料投入和整体封测成本。 8、从研发和量产进度来看，寒武纪MLU690与华为昇腾960目前 存在哪些差异？ 目前来看，寒武纪在CoWoS‑L方案上的进度要快于华为。寒武纪的研发迭代频率更 高，并且已经向终端市场交付了部分MLU690产品，市场需求正推动其加速更新和量 产进程。相比之下，华为的昇腾960尚未有产品交付。 9、如何区分不同封测厂商在CoWoS‑L类封装技术上的差异？是 否可以认为目前盛合晶微在该领域的市场份额和良率是最高的？ 不同封测厂商在CoWoS‑L类封装技术上的差异，主要体现在其具体的封装方案上。 例如，盛合晶微采用的是一种CoWoS‑L类的封装，而长电的方案则基于其XDFOI 全栈式技术，两者有所不同。因此，要判断技术路线的差异，可以观察特定产品主要在 哪家封测厂进行量产。 目前，盛合晶微在头部客户的CoWoS‑L封装业务中占据了最高的份额，其良率在几 家主要供应商中也相对最高。 10、展望未来，盛合晶微在CoWoS‑L封装良率上的领先地位是 否会持续，还是可能存在变数？ 大概率来看，其他厂商在短期内（例如半年内）难以超越盛合晶微。要在CoWoS‑L领 域取得突破，需要深厚的技术积累和量产经验，仅仅通过购买设备或挖角团队难以迅速 提升良率和产能。 •新建一条月产能为4000片的CoWoS‑L产线，纯成本投资高达约100亿人民 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 币，且建设周期长达两到三年。 •盛合晶微的新产线投资约60多亿，成本较低得益于政府投资和国产设备替代。 更关键的是，具备CoWoS‑S量产经验的厂商可以将现有产线在短时间内（约两周） 切换至CoWoS‑L生产。尽管切换后产能爬坡需要五到六个月才能达到原有的4000 片月产能水平，但这远快于新建产线。因此，拥有CoWoS‑S基础的厂商具备显著的 先发优势。 11、对于CoWoS‑S和CoWoS‑L封装技术，未来半年到一年 的良率提升预期是怎样的？ 从封测厂的角度看，目前客户的CoWoS‑L产品良率虽然不算非常高，但对外公布或 在调研中提及的数据已达到\\\\60%‑70%\\\\的水平。 预计到2027年第二季度至第三季度之间，随着客户产品设计和封测流程的优化， CoWoS‑L的良率将大概率提升，从而带动产量的增长。良率的提升是放量的前提， 否则高昂的晶圆和封测成本将导致亏损。良率提升不仅取决于封测端，也受到晶圆端设 计和客户不断变化的封测流程的显著影响。 12、客户为何会频繁变动其封测流程，这种变动对良率会产生怎样的 影响？ 客户变动封测流程主要是为了进行数据对比、老化考核以及工艺的不断试错和优化。这 种变动对良率的影响不一，有时会导致良率下降，有时则会带来小幅提升。 先进封装的工艺整合周期很长，客户需要为更长远的技术路线做准备。例如，在实现 2.5DCoWoS‑L量产后，需要为向3D堆叠演进进行前置准备。未来，HBM可能不 再以堆叠好的半成品形式交付，而是以HBM晶圆的形式直接送到封测厂，进行3D堆 叠后再完成2.5D封装，这要求封测流程具备相应的整合与演进能力。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "attachment:files/光通信 DSP 调研：2027 年 1.6T DSP 供需与产能，良率、长协与客户份额，CPONPO 及玻璃基板技术演进等.pdf": {"id": "attachment:files/光通信 DSP 调研：2027 年 1.6T DSP 供需与产能，良率、长协与客户份额，CPONPO 及玻璃基板技术演进等.pdf", "kind": "attachment", "title": "光通信 DSP 调研：2027 年 1.6T DSP 供需与产能，良率、长协与客户份额，CPONPO 及玻璃基板技术演进等", "source_label": "其他", "excerpt": "光通信DSP调研：2027年1.6TDSP供需与产能，良 率、长协与客户份额，CPO/NPO及玻璃基板技术演进等 聚焦Marvell、中际旭创、新易盛、Coherent、索尔思等 调研覆盖主题 •良率、交付周期及长协/预付款机制 •800G/1.6T制程演进与LPO/NPO/CPO去DSP化路线 •FCC限制、先进封装/玻璃基板及光纤耦合设备 专家问答观点整", "content": "光通信DSP调研：2027年1.6TDSP供需与产能，良 率、长协与客户份额，CPO/NPO及玻璃基板技术演进等 聚焦Marvell、中际旭创、新易盛、Coherent、索尔思等 调研覆盖主题 •良率、交付周期及长协/预付款机制 •800G/1.6T制程演进与LPO/NPO/CPO去DSP化路线 •FCC限制、先进封装/玻璃基板及光纤耦合设备 专家问答观点整理 1、MaxLinear主要向哪些客户提供LPO方案？LPO方案号称免 DSP，这具体是指什么？另外，公司是否也提供分立式方案？ MaxLinear主要向二线厂商提供LPO方案以及一些定制化方案，例如为中际旭创和 Coherent提供的方案。 LPO方案免DSP，并非指完全没有DSP功能，而是指不需要一颗专门的DSP芯片， 其功能被集成到其他部分，这在短距离传输中是可行的。 MaxLinear提供的主要是分立式方案，包含TIA和Driver等组件。公司与Marvell类 似，基本都提供集成式方案，不提供分立式方案。 3、2027年1.6T光模块预期需求量约6000万‑6500万颗，与 DSP供应量看似匹配，是否准确2、谷歌、微软、亚马逊、 META、OpenAI 以及英伟达等一线云厂 商是否主要使用公司和 Marvell 的DSP方案？ 是的，一线云厂商，如谷歌、微软、亚马逊、 META、OpenAI 和英伟达，很少使用 MaxLinear 等二线厂商的 DSP方案。不过，在某些需要分立器件的特定情况下，可能 会采用 MaxLinear 的TIA和Driver产品。MaxLinear 的DSP主要是在主流供应商 缺货时作为补充，其客户群体以二线厂商为主。 qq1490929960 ？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 模块厂商在采购时通常会报出比实际需求更大的数量。这主要是因为过去两年光芯片和 DSP普遍缺货，厂商需要维持一定的库存水平以应对云厂商可能出现的突发性加单。 因此，公司不仅会参考模块厂商的订单，还会通过分析云厂商交换机的实际部署端口数 来核实真实需求，以避免DSP库存积压在囤货客户手中，而真正有需求的云厂商却无 法获得供应。 4、光模块组装环节的行业良率水平是怎样的？1.6TDSP芯片本身 的良率如何？ 目前800G光模块的组装良率已经很高，相比之下，1.6T光模块的良率尚未达到同等 水平。此外，1.6TDSP芯片本身的良率也面临挑战。 5、800GDSP的供应情况和交货周期如何？其采用的是何种制程工 艺？ 800GDSP的供应目前没有那么紧张，交货周期将大幅缓解，预计2026年下半年会从 2025年的36‑40周缩短至30周以下。 800GDSP早期采用7纳米工艺，后来为降低功耗，主流产品已转向5纳米工艺。随 着英伟达GPU、谷歌TPU等ASIC芯片转向3纳米甚至2纳米制程，5纳米的产 能得到了释放，供应状况已大为改善。 6、1.6TDSP是否必须采用3纳米工艺？ 是的，1.6TDSP的主流芯片基本都采用3纳米工艺。虽然第一代产品曾使用5纳米 工艺，但因功耗过大而未被广泛采用。 7、传闻SourcePhotonics正与部分厂商合作，通过7nmDSP芯 片来解决供应问题，这一方案的可行性如何？ 短期内，采用7nmDSP芯片确实可以缓解部分供应紧张的问题。然而，从性能角度 看，一线大厂可能不会采用此方案，主要瓶颈在于功耗。 目前光模块，尤其是交换机上使用的光模块，对功耗非常敏感，云厂商对几瓦的功耗差 异都十分在意。以800G光模块为例，其平均功耗约为25瓦，其中DSP芯片的功 耗占比接近一半。 经验数据：7nm工艺的DSP相比5nm工艺，功耗要高出约30%。例如7nmDSP wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 功耗10瓦，同等条件下5nm约7瓦。 3瓦的差距对于一线云厂商至关重要，交换机通常配置64个甚至128个端口，累积 的功耗差异巨大。例如，100多个端口就意味着超过300瓦的额外功耗，这可能使一 台交换机的总功耗增加三分之一，给数据中心的功耗和散热系统带来严峻挑战。尽管如 此，在严重缺货的情况下，客户为了保证供应，也只能接受这种功耗较高的模块。 8、对于1.6TDSP芯片，产能分配主要遵循哪些规则，例如长期协 议、预付款或与交换机捆绑销售，哪种方式的约束力最强？ 产能分配约束力排序：长期协议（长协）＞预付款＞普通临时订单。 1.长期协议（约束力最强）：公司与旭创、新易盛、Coherent等主要客户都签订了 长协。长协意味着在有产能的情况下，公司必须优先保证这些客户的供应，同时他们也 需承诺一个最低订购量。由于800G和1.6T芯片存在较长的交货周期，例如两个季 度，公司就需要提前两个季度开始生产，确保准时交付；违约会面临高额罚金。 2.预付款：当长协客户有临时增单需求时，新增产能无法保证原定周期交付，客户通 过预付货款争取优先排产；可以加急处理，但无法保障长协级别的准时交付。 3.小客户临时加单：无优先保障，按标准24‑30周周期排队。 目前台积电的DSP产能非常紧张，基本没有余量应对客户的临时加单。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª9、美国 FCC提出的限制进口中国光模块的提案，解读具体内容和 潜在影响 FCC提案核心两点： 1.计划对源自中国产地的新型号光模块进行进口限制； 2.限制扣扣号 1490929960 主要针对从中国直接发货的产品，暂未明确限制中国公 司在美国海外生产基地产出的产品。 市场有一种观点认为，只要光模块采用海外 DSP芯片，影响就不会太大。但该提案距 离正式立法还有很长路径，甚至存在被否决可能。如果完全切断中国供应，美国本土 Coherent 、Molex等厂商短期无法填补巨大市场缺口，会对美国数据中心基建造成重 大连锁冲击。 提案更深层目的是倒逼光模块厂商把工厂落地美国，推动 AI与光通信产业链向美国本 土回流。 _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 10、FCC提案背景下，是否会造成2026年内DSP分配优先供给 海外光模块厂商？ \\\\2026年内预计不会有太大影响，现有型号基本不受波及。\\\\潜在风险更多指向未来 新推出、新采购的源自中国的产品，可能增加审查环节；该提案尚非生效法案。 不存在DSP优先供给海外光模块厂商的安排；海外厂商产能体量有限。全球前十光模 块厂商中国占七席，产能产线建设与良率爬坡周期约一年，海外短期很难复制。 11、未拿到头部CSP订单的国内光模块厂商获取DSP难度？ 是的，难度更大。非头部客户大多没有长协，以短期订单、预付款订单为主，DSP分 配优先级更低。产能紧张时订单无法100%履约；例如500万片订单，实际可能仅交 付200‑300万片，该情况预计持续到2027年。 为英伟达、谷歌等大客户供货的厂商凭借长协更容易拿到DSP；部分长协为英伟达牵 头、模块厂参与的三方协议。 12、云厂商深度绑定合作模式如何影响DSP供应优先级？ 公司与头部云厂商为深度战略绑定，不限于DSP，常将交换机芯片、DSP、光芯片打 包销售。头部云厂商属于最高优先级供应对象，保障供应关乎整套生态合作，不能轻易 断供。 13、英伟达是否把部分DSP订单锁定给索尔思，索尔思能否拿到 长期稳定份额？ 传闻存在可能性。索尔思具备光芯片+光模块自研自产，是合格的二、三供应商，缺 货阶段订单会提升。 但要成为长期核心供应商挑战较大： 1.芯片厂商与谷歌、英伟达等存在深度生态绑定，大规模切换供应商验证成本极高； 2.Marvell等厂商现有DSP方案性能处于行业第一梯队。 索尔思更大概率扮演第三、第四供应商角色。 14、台积电晶圆产能分配：AI芯片、交换机芯片、DSP芯片优先 级？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 1.第一优先级：TPU、AI大算力芯片，利润贡献最高； 2.第二优先级：大型交换机芯片（Tomahawk、Jericho系列），Die面积大、利润 率高； 3.DSP芯片优先级相对靠后。 台积电也会兼顾生态平衡，如果DSP严重短缺，即使AI、交换机芯片充足，数据中 心部署也会停滞。DSP的Die尺寸偏小，少量晶圆即可产出大量DSP；台积电一边 扩产一边做内部动态产能调配。 15、AI芯片扩产是否会挤占DSP晶圆产能？ 当前AI芯片扩产主要消耗新增晶圆产能，不会抢占存量DSP产能。2026年DSP 供应缺口大约40%，属于缺货最严重的芯片品类。 16、头部厂商长协订单若需求不及预期，释放的DSP配额是否会 流转其他厂商？ 理论可行，但属于小概率事件。目前主流光模块厂商长协订单本身就无法被充分满足， 几乎不会出现富余配额外溢；至今没有观察到终端需求不及预期的现象。 17、交换机芯片与DSP是否存在捆绑销售？ 直接捆绑销售更多面向云厂商。面向光模块厂商时，如果客户同时采购公司光芯片与 DSP，会提供深度协同性能优化，实现整套方案最佳性能，属于深度技术合作，非强制 绑定售卖。 18、云厂商采购光模块是否会指定DSP/光芯片供应商？1.6T时 代该趋势是否会加强？ 云厂商采购会明确光模块内部器件配置要求；但芯片缺货背景下无法做到100%指定， 允许在Marvell等合格供应商之间替换并重新调优。 拥有交换机‑DSP‑光芯片完整生态的厂商会推动方案绑定，批量采购有折扣，并且自 家器件经过联合调优。一旦方案在云厂商完成大规模验证，就会被优先指定。 1.6T时代该绑定指定趋势会进一步加强：1.6T供给端更加集中，系统稳定性权重很高； 更换器件需要重新做完整可靠性验证，替换成本高昂，形成较强生态壁垒。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 19、LPO技术对DSP市场的冲击？ LPO会带来少量冲击，但整体影响有限。 LPO适用场景：机柜内部二三十米以内的短距离互联。而谷歌、英伟达的算力集群， 计算节点之间连接距离持续拉大；当传输距离超出LPO能力，仍然需要NPO、CPO。 应用场景边界限制了LPO的市场空间。 20、CPO技术对DSP市场的影响、规模化进展、核心技术瓶颈？ CPO对DSP市场冲击较大，但是短期难以大规模落地。两大核心瓶颈： 1.光纤耦合工艺：CPO内部光纤可达上千根，对耦合设备精度、效率要求极高； 2.玻璃基板工艺：由有机基板向玻璃基板切换，玻璃材质脆，布线、打孔工艺良率难 题尚未完全解决。只有攻克以上工艺，CPO才能大规模放量。 21、2027年NPO方案发展判断；NPO与CPO性能成本对比 受CPO量产不确定性影响，NPO在2027年会作为重要过渡方案大规模导入。 •交换机端预测：公司约一半（2.5万台）、英伟达约一半（5万台）交换机将采用 NPO方案替代不及预期的CPO；按单台交换机平均等效100个端口系数换算，对应 NPO规模约1200万只。该数值是情景推演，渗透率仍存在不确定性。 •NPO定位：行业普遍判定属于过渡形态。CPO成熟之后，模块厂商价值会被压缩 到耦合环节，核心价值向芯片、代工厂转移，因此模块厂商主观上希望拉长NPO生命 周期。 性能功耗对比： •NPO去掉DSP，功耗节省30%‑40%； •CPO规模化后功耗可节省60%‑70%，功耗优势显著高于NPO； •成本：CPO大规模量产后，成本会显著低于NPO与传统可插拔光模块；NPO 成本下降空间有限。 速率演进上，3.2T及以上传统可插拔模块会遭遇物理瓶颈，传统磷化调制不够，需要 薄膜铌酸锂等新工艺；模块厂商未来机会更多集中在轻相干、中长距离相干光模块领域。 22、NPO/CPO普及后，DSP紧缺何时缓解？ 随着NPO、CPO、LPO等去DSP化方案渗透率抬升，独立DSP需求会明显下滑。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 行业判断：2028‑2029年之前去DSP方案渗透率有限，DSP仍是主流；行业技术 转折点大约在2029‑2030年，CPO有望大规模成为主流。之后DSP更多退守相干 /轻相干中长距离传输场景。 重要判断：即便有新技术演进，DSP在2029‑2030年之前仍将持续缺货。 23、剑桥科技等厂商宣布光模块产能大幅扩张，是否已经对应DSP 加单？ 尚未看到匹配的订单。产线建设完成不等于产出；1.6T高度依赖良率，旭创、新易盛 良率行业领先。如果良率不足，产能越大亏损越大，产品售价无法覆盖良率带来的损耗。 剑桥科技目前暂无DSP加单；只有良率改善或者拿到云厂商长期锁定大订单之后，才 会出现预付款长协锁单动作。调研信息截止2026年二季度末。 24、CPO光纤耦合、玻璃基板产业链主要玩家 1.光纤耦合环节 ￮设备端：ficonTEC、联讯，提供高精度自动化耦合设备，ficonTEC设备交付 周期至少6个月以上； ￮工艺执行方：中际旭创、新易盛、天孚通信等；台积电负责光芯片、光引擎制 造，光电耦合交由外部厂商完成。 2.玻璃基板产业链 ￮基板原材料：康宁、京东方，京东方角色类似康宁，可预埋部分元器件； ￮精密加工（覆铜、打孔）：三星电机等专业厂商。 整套链条需要基板供应商、精密加工厂、晶圆代工厂深度协同。 25、各大云厂商1.6TDSP锁单规模梯队 第一梯队（订单体量最大）：谷歌、英伟达； 第二梯队：微软、亚马逊； 第三梯队：Meta、甲骨文，规模较第一梯队低20%‑30%； xAI订单规模相对很小。 26、1.6TDSP长协占比、价格策略 1.长协订单占全部1.6TDSP订单大约70%；剩余30%产能，大型云厂商可通过 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 预付款进行紧急加单，但不保证交付。 2.价格策略：不会接受客户加价来优先排产；芯片价格跟随台积电代工、原材料成本 微调，工艺成熟理论具备降价空间；受强劲需求拉动，未来1‑2年不会主动降价。 27、芯片厂商的多代工布局：台积电、三星、英特尔 当前主要产能依靠台积电；已经和三星、英特尔接触评估流片、先进封装良率与成本， 推动第二、第三供应商。 •三星：现阶段更多处于评估阶段； •英特尔：重点评估EMIB先进封装、18A工艺。 行业信息：预计2027年约200‑300万颗TPU先进合封产能会转移到英特尔 EMIB，缓解台积电CoWoS产能缺口。英伟达等企业也会推动部分先进制程与先进 封装向外分散。 28、光模块失效后，DSP芯片是否可以回收复用？ 光模块报废之后，DSP芯片可以从失效模块上取下回收复用。 29、200GPD器件销售策略 公司自研200GPD，PD属于标准化光器件，无强算法绑定，客户可以自由选择别家 供应商；仅做产品推荐，不存在设计层面强制锁器件。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-09-22T12-54:9fd103e1fbcd": {"id": "post:2026-09-22T12-54:9fd103e1fbcd", "kind": "post", "title": "2026-09-22 12:54", "source_label": "帖子正文", "excerpt": "伯恩斯坦——中国电动汽车及亚洲新兴机器人路演要点：走出低谷 核心结论：伯恩斯坦举办了中国首届人形机器人与汽车供应链路演及第四届中国电动汽车与电池价值链路演。行业参与者对2027年中国国内汽车需求普遍持谨慎态度，预计同比持平或负增长，主要受制于消费疲软、政策支持有限及出口增值税（VAT）退税下调风险。", "content": "伯恩斯坦——中国电动汽车及亚洲新兴机器人路演要点：走出低谷 核心结论：伯恩斯坦举办了中国首届人形机器人与汽车供应链路演及第四届中国电动汽车与电池价值链路演。行业参与者对2027年中国国内汽车需求普遍持谨慎态度，预计同比持平或负增长，主要受制于消费疲软、政策支持有限及出口增值税（VAT）退税下调风险。出口虽仍是核心增长引擎，但预计增速将从今年的异常高位回落。行业整合与反内卷（anti-involution）政策推动下，供应链付款条件与商业行为有所改善。整车厂（OEM）垂直整合加速，尤其在电池与半导体领域，以驱动降本与供应链韧性。人形机器人商业化临近，但大规模普及仍需三至五年。 一、宏观需求与政策逆风。 1）国内需求疲软：2026年前8个月（8M）中国批发汽车销量同比下降5.3%，其中国内需求下降19.7%，出口激增71.8%。8月单月国内需求进一步走弱，季节性调整年化销量（SAAR）估测为1940万辆，低于6月和7月的2070万至2080万辆。行业参与者预计2027年国内需求同比持平或负增长。 2）出口韧性但存隐忧：前8个月出口达715万辆，同比增长66.7%，新能源汽车（NEV）出口增长超120%，占总量近半。但中国汽车工业协会（CAAM）副秘书长指出，出口数据衡量的是发运量而非最终零售量，2026年上半年出口与海外实际零售之间存在约150万辆的缺口。巴西因关税预期提前抢运，欧洲面临贸易政策不确定性。 3）出口增值税退税风险：投资者主要关注现行13%出口增值税退税可能下调。行业参与者认为更可能分阶段削减（如从13%降至9%），而非立即完全取消。比亚迪（BYD）和吉利（Geely）表示，4个百分点的降幅可通过成本优化与供应链效率提升基本抵消，但若降至0%则可能需要向终端客户部分转嫁成本。 4）产能过剩与政府整合：中国政府日益重视解决产能过剩问题，最新公布的广汽（GAC）与一汽（FAW）潜在重组（可能涉及丰田合资企业）是早期信号。行业专家认为，OEM新增产能需通过收购或整合现有设施实现，而非新建绿地项目，产能利用率不足者将面临进一步重组或关闭。“十五五”规划重申了整合与产能合理化目标。 二、OEM垂直整合与供应链演变。 1）电池与半导体自研：在需求疲软、竞争加剧、盈利承压背景下，OEM将垂直整合视为战略重点。理想（Li Auto）已将电芯采购扩展至欣旺达（Sunwoda）和中航锂电（CALB），并开发自有电池包集成技术。小米（Xiaomi）开发了“龙甲”电池平台，降低对宁德时代（CATL）的依赖。主要OEM正加速自研高级驾驶辅助系统（ADAS）芯片，继蔚来（NIO）、小鹏（XPeng）、理想之后，小米确认了芯片野心，比亚迪也被广泛认为在采取类似策略。OEM强调降本与供应链安全是核心收益，小鹏指出已实现的成本节约已超过相关研发支出，尽管投资者仍担忧其与英伟达（Nvidia）等行业领导者的技术竞争力。 2）反内卷成效：自去年政府推出反内卷举措以来，供应商普遍反映OEM付款条件与商业行为改善，OEM在年度降价谈判中更为自律，行业行为与供应链可持续性逐步好转。 三、人形机器人：商业化临近，但大规模普及仍需时日。 1）商业化时间表：OEM与汽车供应商仍积极参与人形机器人开发，但多数认为有意义的商业化仍需三至五年。小鹏在OEM中商业化时间表最为激进，目标2027年初量产，初期部署于国内外经销商展厅。比亚迪等其他OEM正评估制造场景应用，劳动力替代与生产率提升潜力显著。 2）美国供应链放量：美国关键客户的人形机器人生产正在爬坡，大规模生产可能于10月启动，年底周产能达约2000台。这标志着关键客户与供应链需求的重要拐点，但各供应商能持续获取多少份额仍不确定。 3）案例展示：在亿纬锂能（EVE Energy）参观时，人形机器人“带领”了展厅参观，突显了该技术战略重点。 四、电池技术路线与储能（ESS）前景。 1）固态电池：因未解决的技术挑战，固态电池距大规模商业化仍需数年，早期部署预计在利基市场（如人形机器人、电动垂直起降飞行器（eVTOL）），乘用车广泛采用更为遥远。 2）钠离子电池：采用时机主要视锂价而定。比亚迪确认已具备钠离子电池产能，并正将其部署于储能应用。 3）储能前景：行业参与者对储能前景远比投资者乐观，预计明年需求增长20%至50%。长期来看，预计2030年前中国储能市场复合年增长率（CAGR）约20%，海外储能市场约30%。 五、自动驾驶竞争升级与数据壁垒。 1）L2++竞争白热化，L3成新差异化来源：但商品化若快于预期，持续差异化空间或有限。除L3外，小鹏、Momenta等ADAS领导者正拓展至L4 Robotaxi与Robovan领域，侵入小马智行（Pony AI）、文远知行（WeRide）等专用L4玩家领地，竞争边界日益模糊，行业竞争强度将进一步上升。 2）数据是关键赋能因素：行业参与者普遍认为数据是自动驾驶进步的关键，但对真实数据与合成数据相对重要性的看法存在分歧。对于Robotaxi，监管审批与牌照可能仍是大规模部署的主要瓶颈。 六、重点公司路演要点。 1）比亚迪（BYD，跑赢大盘，目标价130.00港元/114.00元人民币）：技术驱动份额提升，国内市占率升至约25%至26%，且未依赖大幅降价，主要靠闪充及新一代电池平台等技术升级。海外扩张是核心增长引擎，2026年海外销售目标超180万辆、2027年250万辆，2030年前（不含北美）长期目标500万辆。闪充生态系统被视为最重要竞争差异化，涵盖电池、车辆架构、充电基础设施、储能与电力电子。第二代刀片电池产能仍是近期生产瓶颈，月产量预计月增约2万套。能源存储（ESS）前景积极，2025年系统出货60吉瓦时（GWh）。 2）小米（1810.HK，跑赢大盘，目标价35.00港元）：SkyNomad上市标志进入增程式电动（EREV）SUV领域，客户群较SU7/YU7更年长（35至40岁），注重空间与家庭需求。电动汽车毛利率目标20%，电池采购多元化至欣旺达、中航锂电，并深入参与电池开发与集成。欧洲是全球化首站，德国预计2027年下半年首发，右舵市场2028年跟进。人工智能（AI）生态强调核心技术的所有权，自研3纳米智能手机芯片是重要里程碑，未来将整合至汽车应用。 3）吉利（175.HK，跑赢大盘，目标价25.00港元）：中国新能源汽车渗透率已近三分之二，未来增长将放缓，坚持多能源战略（燃油、混动、插混、纯电）。出口是主要增长引擎，海外单车利润约1.2万至1.5万元人民币，正从“直营+经销商”模式转向轻资产合作伙伴模式，利用福特、沃尔沃、雷诺、宝腾现有产能，海外产能预计超80万辆。退税削减与欧洲本地化要求可控。 4）小鹏（9868.HK/XPEV，市场同步，目标价78.00港元/20.00美元）：自动驾驶与AI优势来自自研图灵芯片、基础模型及超百万联网车辆采集的真实数据。海外交付预计今年至少翻倍至约4.8万辆。Robotaxi车队已在广州内部运营，预计第四季度向公众开放，2027年初移除安全员。人形机器人目标年底量产，初期月产能约1000台，先部署于门店。自研图灵芯片累计降本已超其研发支出。 5）蔚来（NIO/9866.HK，市场同步，目标价5.00美元/39.00港元）：换电仍是竞争核心，超100万辆车队中近50%用电量来自换电，超4000座换电站构成网络效应。换电站单站资本支出（CAPEX）约200万元人民币，日换电50至60次可达盈亏平衡，目前日均约30次。公司正与多家OEM洽谈换电平台授权。服务生态贡献显著，单车年服务收入超1000至2000元人民币，毛利率40%至50%。 6）理想（LI/2015.HK，市场同步，目标价14.50美元/57.00港元）：行业正从电气化转向智能化，AI、自动驾驶与半导体成主要差异化来源。垂直整合深化，自研Mach 100芯片、视觉语言动作（VLA）模型、线控底盘架构与第三代增程器。国内需求疲软但新能源渗透率持续上升，海外市场最佳情景下或贡献30%销量。 7）零跑（Leapmotor，9863.HK，未覆盖）：成本领先优势源于电子基因、创始人主导的工程文化与强大供应链，年销量约100万辆、垂直整合度约70%。整车毛利率约10%至11%，整体毛利率12%至13%，长期目标12%至14%。Stellantis合资企业是海外战略核心，西班牙将成主要生产基地。 8）Momenta（6880.HK，未覆盖）：中国城市导航辅助驾驶（NOA）软件市场份额约60%，累计获26家OEM的219个定点，105个已量产（SOP），剩余114个待商业化。量产ADAS业务已盈亏平衡，预计明年整体盈亏平衡。L3是下一催化剂，奥迪E7X预计2027年下半年首发其L3方案。正从国内供应商向全球ADAS供应商转型。 9）小马智行（PONY，2026.HK/PONY，未覆盖）：Robotaxi已超越试点阶段，年中车队约2000辆，年底目标3500辆，运营城市年底扩至20余个。第七代平台已在广州、深圳实现单车经济盈亏平衡，物料清单（BOM）成本从约30万元降至27万元，目标短期内低于24万元。中东是海外最成熟市场，欧洲通过克罗地亚切入。坚持“AI司机提供商”模式，避免重资产。强调L4与L2+差距远大于普遍认知，强化学习、世界模型与合成数据生成是关键壁垒。#文字观点", "publish_time": "2026-09-22 12:54", "tags": ["文字观点"]}, "post:2026-09-22T17-09:1d0ed432e99a": {"id": "post:2026-09-22T17-09:1d0ed432e99a", "kind": "post", "title": "2026-09-22 17:09", "source_label": "帖子正文", "excerpt": "今日市场点评0922：指数冲高回落显分歧 🔆 行情总览： 🌀 今日A股冲高回落，沪指收+0.06%、深成指-0.05%、创业板指+0.01%（早盘一度涨超2%），成交2.15万亿再创阶段新高。个股层面，约3000股飘绿。", "content": "今日市场点评0922：指数冲高回落显分歧 🔆 行情总览： 🌀 今日A股冲高回落，沪指收+0.06%、深成指-0.05%、创业板指+0.01%（早盘一度涨超2%），成交2.15万亿再创阶段新高。个股层面，约3000股飘绿。传媒与AI应用集体走强，创新药延续2连板；航运、油气、风电调整。 🌀 港股分化，恒指+0.18%、恒科+0.34%，大模型股智谱-6%、MINIMAX-4%，资金在AI内部从模型向平台股切换。南向资金净买入超50亿港元。 🌀 外围市场，韩KOSPI高开2.2%后基本抹平收+0.15%；现货黄金失守4300美元。 🔆 核心事件与观点 🌀 放量不涨，2.15万亿成交+指数平收，获利盘借情绪兑现，新资金接产业逻辑入场。半导体早盘受昨夜费半+4.29%映射高开冲高，而随着时间推移最终由AI应用/传媒承接。资金正在算力主线内部切换，与昨夜美股Meta行情的结构相近。 🌀 云栖大会阿里抛出密集信息，2032年数据中心20GW、真武V900算力提升3倍、5-10万亿参数模型、千问手机Qwen Intelligence。中国云厂商的资本开支叙事正式对标美国超大规模厂商，国产“芯片-模型-终端”全栈闭环首次完整亮相，中国AI正在从“对标追赶”迈入“生态建设”的新阶段。 🌀 芬兰、挪威等多国领导人联合倡议管控前沿AI，而外交部回应中美将就AI安全风险举行会谈。元首访美前夕，AI安全对话被正式摆上中美议程，对国产模型的出海合规框架可能隐含中期利好。 ⚠️ 风险提示：中美元首会晤成果出现预期差风险；短融ETF天量提示大资金的风险偏好与盘面情绪背离，警惕高位题材股的集体波动风险。 🌹 欢迎大家与我们讨论，请联系国联民生宏观团队陶川/林彦#文字观点", "publish_time": "2026-09-22 17:09", "tags": ["文字观点"]}, "post:2026-09-22T12-49:679f070a0a62": {"id": "post:2026-09-22T12-49:679f070a0a62", "kind": "post", "title": "2026-09-22 12:49", "source_label": "帖子正文", "excerpt": "大摩宏观策略谈：内需未稳，外扰再起？https://share.note.youdao.com/ynoteshare/index.htm...宏观策略周论：加息如何影响中国市场？", "content": "大摩宏观策略谈：内需未稳，外扰再起？https://share.note.youdao.com/ynoteshare/index.htm...宏观策略周论：加息如何影响中国市场？https://share.note.youdao.com/ynoteshare/index.htm...离岸人民币汇率破6.7 - 升值归因、分歧与展望https://share.note.youdao.com/ynoteshare/index.htm...节前对A股的思考https://share.note.youdao.com/ynoteshare/index.htm...本轮反弹空间几何？时间几何？https://share.note.youdao.com/ynoteshare/index.htm...#笔记链接", "publish_time": "2026-09-22 12:49", "tags": ["笔记链接"]}, "attachment:files/万联证券-日本央行9月会议点评：日央行如期加息，强调通胀超调风险-260921.pdf": {"id": "attachment:files/万联证券-日本央行9月会议点评：日央行如期加息，强调通胀超调风险-260921.pdf", "kind": "attachment", "title": "万联证券-日本央行9月会议点评：日央行如期加息，强调通胀超调风险-260921", "source_label": "万联证券", "excerpt": "主题策略：加息如何影响中国市场？主题策略：加息如何影响中国市场？", "content": "主题策略：加息如何影响中国市场？ 主题策略：加息如何影响中国市场？ 2026-09-21 9 月 FOMC 上，美联储如期加息 25bp 。对于加息本身，与我们此前多次提示的情形一致，即从维护美联储信誉的角度，最好 是加（《如何才能 “ 预防式加息 ” ？》、《沃什转鹰意味着什么？》）；对市场影响，加息后的反应也与我们提示的基本类似，即 加息有助于稳定市场预期，且加息的影响更多是提前计入，所以兑现时反而是利空出尽，市场会 “ 反着做 ” （《如果加息会发生什 么？》）。总结而言，我们与市场最大的不同，就是认为会加息、但不认为加息是洪水猛兽，加息不是坏事，不加息也未必是好 事，加息后美债利率一度回落、市场反而反弹，也印证了这一点。潜在风险来自持续且大幅的加息（如三次以上），但现在不具 备连续加息的基础，除非油价彻底失控（《美联储加息一次够么？》）。 相比全球市场，市场更关注的是美联储加息如何影响中国市场，尤其是对海外流动性更敏感的港股市场。 综合来看，有如下几个结论： 1 ）与全球类似，整体影响幅度也与加息周期的长短和大小直接相关，例如短暂的加息或降 息，影响多是提前计入，如 2024 年和 2025 年降息，而长期且大幅加息影响要大很多，如 2022 年加息； 2 ）美联储只是其中一 个、甚至有些时候不是主导的影响变量，例如降息周期市场依然可以跌，外资流出，如 2019 年，而加息周期市场依然可以涨， 且外资流入，如 2017 年； 3 ）一般情况下，相比 A 股，港股整体对美联储政策变动的敏感度更大，尤其是因联系汇率制度加息而 更敏感的本地地产与金融股，现金流久期较长的成长板块也会承压。 放在当下： 1 ）美联储连续且大幅加息的基础并不存在，更可能是短暂预防式加息，类似 1997 年； 2 ）但当前中国自身的 内需基本面偏弱，又会放大外部扰动，所以两两相抵，整体影响依然有限，更类似 2025 年降息的反例。但是，如果变成连续且 大幅的加息，在内在基本面疲弱下影响就会明显放大，需要防范。 只要加息就有大影响？短暂加息与持续收紧要区别看待，全球资产和中国市场均是如此与全球市场类似，美联储加息对中 国市场的影响大小，也要看加息本身的幅度与时长。复盘 1990 年以来六轮加息，虽然全球市场在加息后平均都有不同程度下 跌，但不同加息周期的差异很大，因此不能不区分情形地看简单平均。 持续且大幅的加息，影响会明显放大。持续大幅加息不仅推高无风险利率、压制风险偏好，还会通过提高融资成本、收紧 金融条件对实际增长和金融市场造成更大冲击。历史上五轮连续加息，恒生指数和上证指数在加息后一个月的平均跌幅大于 1997 年的 “ 预防式加息 ” 。以 2022-2023 年为例： 美联储在 16 个月内累计加息 525bp ， 10 年美债利率直到 2023 年 10 月才见顶。紧缩冲击最集中的 2022 年 3 月至年底，除 美元和短端美债外，股票、长债、黄金等资产普跌（《如果加息会发生什么？》）；中国市场也不能幸免， 10 年美债利率从 2022 年 3 月的 1.7% 攀升至 2022 年 10 月 4.2% 的期间，恒生指数和上证指数分别下跌 33% 和 14% ，甚至跑输标普 500 （ -13% ）。 相反，短暂 “ 预防式加息 ” 影响有限，且通常 “ 反着走 ” 。 1997 年 3 月底美联储仅加息 25bp ，加息落地后两到三周美债利率见 顶，美股也见底回升；中国市场也是类似，恒指加息后一周下跌 5.3% ，随后迎来反弹，上证指数则持续上涨，加息后一周上涨 4.1% 。 降息也有类似规律， 2019 、 2024 和 2025 年都是 3 次的短暂降息，美债利率在降息前下行，降息后反而见底回升。对中国 市场的影响也很有限： 1 ） 2019 年，恒指和上证在降息前的 2019 年 6 月均有反弹，降息后反而分别下跌 5.3% 和 0.4% ，呈现利好 兑现的局面； 2 ） 2024 年 AH 两地受 “924” 政策影响在 10 月初大涨，随后美联储虽还有两次降息，但恒指和上证反而分别下跌 4.3% 和 2.6% ； 3 ） 2025 年也是类似，恒指在宽松交易下两周反弹 3.2% ，利好兑现后于 10 月初见顶回落，即便后续还有两次降 息，上证指数则震荡持平。 因此，美联储政策影响的大小不在 “ 加息 ” 或 “ 降息 ” 这一标签本身，而要区分加息的时长与幅度。 加息有多大影响？对中国市场而言，并不是主导变量对于中国市场，美联储货币政策只是其中一个、甚至一些时候都不是 主导的变量，国内基本面更为关键。 2017 年和 2019 年提供了两个方向相反、但逻辑一致的例子： 2017 年美联储持续加息，但中国市场大幅上涨、并伴随外资流入。 2016 年 12 月至 2017 年底，美联储累计加息 4 次共 100bp ， 2017 年 10 月又启动缩表；但同期棚改等政策支持带动中国基本面明显改善，信用周期扩张， 2017 年上证和恒指分别 上涨 7% 和 36% ，主动外资也于 2017 年 4 月后转为流入中国市场，至 2017 年底累计流入约 17 亿美元。 仅供内部参考，请勿外传 2019 年恰恰相反，美联储降息，中国市场反而走弱，外资也依然流出。 2019 年 7 月至 10 月，美联储连续降息 3 次共 75bp ，但由于中国信用周期震荡走弱，叠加中美贸易摩擦，美联储降息后 1 个月，上证和恒指分别下跌 2.2% 和 8.6% ，主动外资 并未因海外流动性转松流入，降息期间反而流出约 35 亿美元。 以上两个反例表明，美联储加息降息对中国市场会有影响，但并非主导。究其原因，美联储政策的影响更多体现在短期的 分母端，对港股的传导比 A 股更为直接；但影响分子端需要更长时间，通过美国金融条件、海外需求、中国出口和企业盈利逐步 传导。因此，美联储短周期的政策调整难以改变中国市场趋势；只有国内基本面偏弱时，才会凸显外部影响。 加息对谁的影响更大？港股比 A 股敏感，本地地产金融与科技更敏感 AH 两地市场和不同板块对加息的敏感度也有差异： 1 ）受离岸市场开放金融体系，以及联系汇率制度跟随美联储加息影响，港股对美联储加息更敏感，加息前后通常跑输 A 股； 2 ） 板块层面，香港本地的地产、金融因为香港跟随美联储加息也会更敏感； AH 两地成长板块因为高估值也会更敏感。具体来看： 预防式加息：港股跑输 A 股。 1997 年美联储加息后 1 个月，恒生指数下跌 1% ，上证指数上涨 14% ，港股跑输 A 股。 板块上，港股通信服务和房地产跌幅较大，加息后 1 个月分别下跌 5.9% 和 5.0% ，公用事业、可选消费分别下跌 2.3% 和 2.0% ，但信息技术、原材料和金融板块上涨，预防式加息下因为影响较短，也并非所有利率敏感板块都会承压。 A 股地产、原材 料和医疗保健板块领跌，加息后 1 个月分别下跌 4.8% 、 4.3% 和 3.7% ，工业、公用事业、金融等板块上涨。 连续加息：港股依然跑输 A 股，利率敏感和科技板块跌幅更深，行业下跌范围扩大至周期板块。历史上五轮连续加息，初 期港股均会跑输 A 股，恒指加息后 1 个月内最大跌幅中位数为 -12% ，超过上证指数的 -11% ，且加息前港股已经承压，加息前至 加息后一个月恒指收益中位数为 -13% ，上证指数则为 -10% 。 板块上，港股房地产、信息技术、通信服务、金融板块偏弱，历史上五轮连续加息，加息后一个月收益中位数分别约为 - 4.7% 、 -3.9% 、 -3.8% 和 -2.9% ，能源和原材料也下跌约 4% ，受全球需求影响的周期板块同样承压。 A 股金融、消费和原材料承 压较大，加息后一个月金融、可选消费、原材料和必需消费板块收益中位数分别约为 -13% 、 -10.2% 、 -9.1% 和 -7.7% ，信息技术 也下跌约 6% 。 当前更像哪个阶段？加息节奏类似 1997 年，结合基本面类似 2025 年的反面 首先，本轮大概率是短暂的 “ 预防式加息 ” ，更接近 1997 年，美国当前基本面并不支持连续且大幅加息。一方面， 9 月 FOMC 会议表态并未进一步释放明显超预期的鹰派信号，点阵图给出的年内一次加息和明年没有加息低于市场担心和 CME 期货 此前隐含的大幅加息预期（《美联储加息一次够么？》）。另一方面，高利率会抑制传统需求，美国 30 年期按揭利率升至近 7% ，成屋销售已再度回落，甚至 AI 投资对融资成本的敏感度也在上升，美国基本面未必 “ 扛 ” 得住连续加息。因此，除非油价大 幅失控，当前不具备连续加息的基础。我们测算，若油价中枢维持在 100 美元以上甚至更高， CPI 将无法继续走低，从而给 美联储带来更大压力；但若油价三四季度中枢降至 80 美元， CPI 同比会在年底回落至 3% 左右，美联储进一步大幅加息的必要性 也将下降（《美联储加息一次够么？》）。 其次，当前中国基本面偏弱，外部扰动容易被放大，更类似 2025 年底以来的信用周期震荡。正如 2019 年中国信用周期震 荡，美联储降息都无法有效提振市场，那 2026 年以来信用周期震荡走弱，加息反而可能会放大影响。今年财政增量有限，且资 金投向仍更多集中于科技和产业升级，对居民消费、地产等传统信用部门带动不足，尽管三季度信用周期可能小幅扩张，也不改 变全年偏弱格局。 因此，当前美联储连续且大幅加息的基础并不存在，更可能是短暂预防式加息，类似 1997 年；但中国自身的内需基本面 偏弱，又会放大外部的扰动，所以两两相抵，整体影响依然有限，更类似 2025 年降息的反例：市场在短暂扰动后回归基本面定 价，恒生指数冲高后于 10 月 2 日见顶回落，上证指数则震荡持平；板块层面，降息后一个月原材料、资本品、保险板块领涨， 信息技术、房地产、医疗保健板块领跌，也说明预防式降息影响有限，否则利率敏感和科技板块本应上涨。当然，在极端风险 下，如果变成连续且大幅加息，影响就会明显放大，需要防范。 当前策略：市场 “ 反着走 ” ，加息落地缓解估值压制，但上行空间仍受基本面约束指数层面，加息影响逐步消化，符合我们 提示的 “ 反着走 ” 的规律。美联储加息落地后，上周五市场已经反弹，恒指上涨 0.6% ，上证指数上涨 0.9% 。若美联储不持续大幅 加息，扰动可能暂告段落。其中，港股对美债利率的敏感程度高于 A 股，加息落地或缓解前期估值压制，尤其是恒科。但在信用 周期震荡、结构分化的格局下，上行空间依然有限，更多是波段行情和 “ 赔率 ” 思维。 仅供内部参考，请勿外传 板块层面，科技看产业、周期压制减少、消费看政策、分红做对冲。 1 ）科技仍是主线，随着加息影响消化，前期估值压 制较多、但基本面仍有支撑的方向也有更大修复弹性，但整体空间仍取决于产业进展。 2 ）有色等周期板块在加息兑现后承受的压制会逐步减少，但黄金的上行空间不如不加息大，除非加息持续并拖累全球需 求和增长，才会明显承压。 3 ）消费板块依然取决于国内财政政策发力和倾斜情况，目前进展有限。 4 ）分红则作为其他板块都 疲弱时的 “ 哑铃型 ” 对冲。 此外，值得关注的是实际受加息影响的香港本地地产和银行板块。今年以来香港本地地产和银行指数上涨 10% 和 35% ，主 要得益于香港地产的持续修复，中原地产指数上涨 12.5% ，也是恒指跑赢恒科的原因。香港地产的修复与去年底美联储降息以及 大量新增需求密不可分：加息前香港金管局基本利率为 4% ，按最优惠贷款利率 BLR 减 175bp 测算，部分浮息按揭利率为 3.25% ， 7 月 A 类私人住宅毛租金回报率则为 3.4% ，超过按揭利率；此次加息后，基本利率走高至 4.25%1 ， BLR 尚未同步上调 2 ，后续如果调整，可能产生一定影响。 仅供内部参考，请勿外传", "status": "extracted"}, "attachment:files/长城证券-曲美家居(603818)曲径连山海，美居焕新生-260921.pdf": {"id": "attachment:files/长城证券-曲美家居(603818)曲径连山海，美居焕新生-260921.pdf", "kind": "attachment", "title": "长城证券-曲美家居(603818)曲径连山海，美居焕新生-260921", "source_label": "长城证券", "excerpt": "请仔细阅读本报告末页声明", "content": "请仔细阅读本报告末页声明 证券研究报告 | 公司深度报告 2026年09月21日 曲美家居（ 603818.SH ） 曲径连山海，美居焕新生 财务指标 图说中国宏观周报：海外 图说中国宏观周报：海外AI 投资变化影响多大 投资变化影响多大 2026-09-21 近来海外 AI 资本开支持续大幅扩张，并通过全球 AI 产业链对中国经济形成外溢影响。一方面，海外数据中心和 AI 基础设施 建设带动服务器、光模块、 PCB 、通信设备及相关零部件需求，支撑中国相关产品出口", "content": "图说中国宏观周报：海外 图说中国宏观周报：海外AI 投资变化影响多大 投资变化影响多大 2026-09-21 近来海外 AI 资本开支持续大幅扩张，并通过全球 AI 产业链对中国经济形成外溢影响。一方面，海外数据中心和 AI 基础设施 建设带动服务器、光模块、 PCB 、通信设备及相关零部件需求，支撑中国相关产品出口；另一方面，海外订单增长也改善了国内 AI 产业链企业的收入预期，进而带动扩产投资，对固定资本形成带来拉动作用。展望 2027 年，根据市场一致预期，海外 AI 资本 开支规模预计仍将增长，但同比增速或较 2026 年的高位回落。若海外 AI 资本开支增速放缓，会对中国经济产生什么边际影响？ 一、海外 AI 资本开支仍在扩张，但增速或自 26Q4 起回落我们主要聚焦美国 AI 资本开支变化的影响。 2026 年二季度，亚 马逊、 Alphabet 、微软、 Meta 和甲骨文五家代表性云厂商资本开支同比增长 86.5% ，延续较快扩张态势。然而，根据 FactSet 一 致预期，以云厂商为代表的海外 AI 资本开支规模预计仍将增长，但同比增速自 26Q4 或有所放缓。我们认为，除了高基数因素 外，增速放缓或也与融资、物理和安全治理等约束逐渐显性化有关。 一是随着资本存量快速扩大，企业投资回报和融资约束逐渐增强。过去两年云厂商资本开支快速扩张，自由现金流有所承 压，对外部融资的依赖上升。在长端利率维持相对高位、部分云厂商信用利差上行的背景下，融资成本上升可能进一步提高新增 投资的回报门槛。与此同时，前期形成的大量资本存量也意味着未来折旧摊销压力上升。在 AI 商业化仍需进一步兑现的情况 下，近期 ROIC 与 WACC 之间的差距也有所收窄，企业资本配置可能逐渐由前期的抢算力、拼规模转向更加关注投资回报验 证，从而导致 AI 资本开支增速放缓。 二是物理约束开始限制项目落地速度。数据中心扩张对电网容量、电力价格、水资源和土地提出更高要求。 2025 年以 来，美国部分地区围绕数据中心用电、用水及社区成本的争议升温，并通过暂停审批、提高准入要求等方式加强约束，数据中心 项目扩张被迫降速 1 。海外 AI 基础设施扩张或面临着 “ 需求较强、但项目落地受限 ” 的压力。 三是安全治理风险或导致资本开支放缓。随着 AI 自主完成复杂任务的能力快速提升，实际运行中的风险事件也在增多 2 ， AI 安全治理的重要性与紧迫性同步上升。近期 Anthropic CEO Dario Amodei 提出应适度放缓前沿模型能力提升速度 3 ，为第 三方评测和风险防控留出更多时间。若类似倡议进一步转化为行业协调或监管要求，前沿模型大型训练周期可能拉长，从而对训 练算力需求增速形成边际约束。 二、出口渠道：海外 AI 资本开支放缓或降低出口对 GDP 的拉动若海外 AI 资本开支放缓，会对中国经济产生什么影响？我 们认为，首先最直接的影响来自出口。海外数据中心建设需要大量服务器、光模块、 PCB 、网络设备及电子零部件，其中中国供 应链具有较强参与度，因此过去一轮海外 AI 投资上行与中国出口改善具有较明显的同步性。 从季度数据来看，我们发现海外 AI 资本开支增速大致领先中国出口和 AI 链产品出口同比约一个季度。我们测算显示，海 外 AI 资本开支同比每提高 10 个百分点，中国 AI 链产品出口同比约提高 2.8 个百分点，对应传导系数约为 0.28 。按照当前的一致 预期，主要云厂商 AI 资本开支同比或由 2026 年的 89.9% 回落至 2027 年的 38.6% ，降幅约 51.3 个百分点，对应中国 AI 链产品出 口同比增速仍维持正增长，或边际放缓 10 个百分点左右。不过，我们预计，明年海外 AI 资本开支预计仍保持正增长，对中国 AI 链出口仍有一定拉动，只是贡献较今年或有所回落。 三、投资渠道：外需放缓的影响相对更为滞后 海外 AI 需求除直接带动出口外，还可能通过提高国内 AI 产业链企业订单和产能利用率，进一步影响 AI 产业链的投资。因 此，海外 AI 资本开支对国内投资的影响本质上是一个外需引致的投资效应。 我们基于 A 股 AI 产业链 4 上市公司数据，以境外收入占比对企业固定资产投资进行加权，构造与海外需求相关的 AI 产业链 投资指标。我们测算表明，海外 AI 资本开支变化对国内 AI 产业链投资存在更长的传导时滞，海外 AI 资本开支大致领先 AI 产业链 投资约一年，传导系数约为 0.49 。这也符合企业从获得海外订单、确认产能缺口，到扩建厂房和购置设备需要一定时间的经济逻 辑。 从对经济增长的边际影响看，与出口渠道不同，由于投资传导存在较长时滞， 2026 年海外 AI 资本开支高增长对国内投资 的支撑仍可能延续至 2027 年。按当前测算，我们预计，但随着 2027 年海外 AI 资本开支降速逐渐传导，至 2028 年对国内投资的 贡献程度相较此前可能有所下降。 总结来看，从影响渠道上看，海外 AI 资本开支放缓对中国经济的影响并非同步发生：出口渠道反应较快，投资渠道反应 滞后。因此，我们预计， 2027 年主要影响可能首先体现为出口拉动减弱，而此前海外订单带来的扩产投资仍形成一定缓冲，至 下载日志已记录，仅供内部参考 2028 年投资渠道的滞后影响可能逐步显现。 最后，需要说明的是，我们的测算属于静态的局部均衡分析，主要识别海外 AI 需求变化的影响。若国内 AI 资本开支延续 较快增长，特别是国内云厂商、算力基础设施建设以及国产替代相关投资继续扩张，可能对海外需求放缓形成一定对冲。另外， 若 AI 渗透率在企业业务中增加，用云厂商估算国内 AI 投资或有低估，而 AI 产业链投资的实际韧性也可能强于本文仅基于海外需 求变化得到的测算结果。 市场观察 全球权益涨跌互现，美债曲线熊平，美元走强，铜金上涨、原油回落。权益方面，中国 8 月工业增加值同比加快 0.7 个百 分点至 5.2% ，社零仅增 0.4% ，供强需弱格局延续。沪深 300 下跌 0.1% ，电子、通信和机械领涨。美联储加息 25bps 至 3.75%— 4.00% ，点阵图暗示年内或再加息一次，抗通胀立场强化。标普 500 下跌 0.1% ，纳斯达克上涨 0.7% ；恒生指数下跌 0.2% ，日经 225 上涨 1.6% ，德国 DAX 下跌 1.0% 。债券方面，中国 1 年、 10 年国债收益率分别上行 0.1bps 、下行 0.8bps 至 1.23% 、 1.68% ； 美国 2 年、 10 年国债收益率分别上行 13bps 、 5bps 至 4.76% 、 5.01% ，期限利差收窄 8bps ；日本、德国 10 年国债收益率分别上 行 0.6bps 、下行 1bp 至 2.99% 、 3.55% 。汇率方面，美元指数上涨 1.1% 至 100.2 ，人民币对美元升值 0.2% 至 6.70 ，对欧元、日元 亦升值。商品方面，伦铜、伦金分别上涨 2.4% 、 0.7% ，布伦特原油下跌 0.9% ；内盘方面，玻璃、螺纹钢、生猪分别下跌 7.3% 、 0.4% 、 3.4% 。 美联储鹰派加息重塑抗通胀公信力，但本轮紧缩或较 2022 年温和。 9 月 FOMC 以 12 比 0 全票通过加息 25bps ，将政策利 率区间上调至 3.75%—4.00% ；点阵图显示年末利率预测中位数由 3.8% 升至 4.1% ，暗示年内或再加息一次。决策一致性及利率 指引均体现出抑制通胀预期的决心（《美联储用鹰派加息重塑公信力》）。不过，本轮通胀回升更多体现为原油价格扰动下的能 源涨价，目前尚未重现 2021 年的广泛上行。 8 月能源 CPI 同比升至 16% ，而核心 CPI 、食品饮料同比仅为 2.4% 、 2.6% ，低于上 一轮加息前（ 2022 年 2 月）的 6.5% 、 7.6% ，且均处于下行通道，非能源分项的持续上行压力相对有限。此外，美国当前亦缺乏 工资通胀螺旋的基础。工资去通胀与单位劳动成本增速回落并存，尚未形成工资和物价相互推升的循环（《沃什改革下的 “ 货币 财政协同 ” 》）。往前看，我们预计，若油价冲击未进一步传导至工资和核心服务，加息节奏和幅度或较 2022 年温和；若能源涨 价持续并带动通胀扩散，紧缩力度仍可能超出预期。 上周高频数据跟踪 9 月第 3 周，食品价格由涨转跌，菜篮子产品批发价格 200 指数周环比下跌 0.3% ，其中猪肉、水果价格周环比分别上涨 2.6% 、 1.1% ，蔬菜价格周环比下跌 1.1% 。大宗商品价格由涨转跌，南华工业品指数周环比下跌 2.0% ，同比 +13.6% ，其中玻 璃、 PVC 、焦煤、纯碱、焦炭等周环比跌幅较大。 线下消费场景活跃度增速放缓，城市商圈到访人数同比上涨 2.1% ，增速有所减缓。耐用品消费承压， 4 类大家电零售额 4WMA 同比 -17.1% ，乘用车零售量 4WMA 同比 -23.3% ，二者降幅均有所扩大。房地产销售偏弱运行，样本城市商品房成交面积 同比 -21.4% ，降幅扩大；样本城市二手房成交面积同比  核心结论： 继瑞银（UBS）全球大宗商品团队下调全球锂价预测后，瑞银基于详细的供需成本曲线分析，进一步将2027年预测中国锂价大幅下调至每吨12万元人民币（此前预测为每吨20万元），但该价格仍高于当前市场计价水平（即每吨10万元）。瑞银认为，当前市场可能过度担忧中国电池储能系统（BESS）电池的潜在去库存风险，同时忽视了江西反腐调查给供给侧带来的下行风险。因此，瑞银全面下调中国锂业股的盈利预期与目标价，但重申所有覆盖股票的买入评级。 需求端关键辩论：电池库存是否预示2027年锂需求下行风险？ 2026年前8个月，基于正极材料和电解液产量的中国电池相关锂需求同比增长约60%，远超电动汽车（EV）销量和电池储能系统装机量所隐含的终端市场需求约45%的同比增速。瑞银的供应链分析表明，锂化学品、正极材料、电池及原始设备制造商（OEM）环节的库存处于中低水平，但电池储能系统整合商及下游渠道的库存偏高。核心下行风险在于，电池储能系统项目从招标到实际装机的转化速度放缓，可能引发去库存并拖累2027年的电池产量。瑞银预测，占锂总需求约30%的电池储能系统电池需求在2027年的同比增速将降至30%（2026年预计为64%），反映出去库存风险及基数效应。因此，瑞银预计2027年全球锂需求增速将放缓至15%，基于全球成本曲线，这对应每吨12万元的碳酸锂价格。相比之下，当前市场计价已隐含每吨10万元的锂价（对应纯锂生产商18至20倍市盈率），这相当于在全球成本曲线上仅对应约10%的锂需求增长。 供给端关键辩论：2027年基准供给预测的风险是偏向上行还是下行？ 瑞银基准情景假设2027年全球锂供给同比增长22%，其中江西锂云母的增量有限，且津巴布韦的所有锂辉石产量均可继续出口。然而，瑞银认为这两个假设均存在下行风险，包括江西锂云母运营因反腐调查而进一步中断，以及津巴布韦在实施出口禁令后，其2027年出口配额存在不确定性。在下行供给情景中，瑞银假设2027年全球锂供给仅同比增长10%。相比之下，市场共识当前假设供给同比增长30%，实质上计价了江西锂云母生产不会受到任何干扰。 基于成本曲线的锂价情景分析： 在基准情景下，瑞银预测2027年锂需求增长15%，供给增长22%，市场处于紧平衡状态，对应中国碳酸锂价格（含增值税）为每吨12万元，或不含增值税每吨15,617美元。在下行情景中，假设需求增长10%，供给增长30%，市场将过剩23.3万吨碳酸锂当量（LCE），价格将逼近成本曲线底部，对应中国碳酸锂价格（含增值税）为每吨78,761元。在上行情景中，假设需求增长20%，供给增长仅10%，市场将出现47.9万吨的缺口，需要更高成本的供给来平衡市场，对应中国碳酸锂价格（含增值税）为每吨17万元。 盈利预测调整与估值更新： 基于更新后的锂价预测，瑞银将所覆盖的中国锂业股2027年盈利预测下调了50%至56%，并基于保持不变的目标企业价值倍数（EV/EBITDA）相应下调目标价。具体调整如下：天齐锂业（002466.SZ）目标价由93.18元下调至52.13元；赣锋锂业A股（002460.SZ）由110.45元下调至57.05元；赣锋锂业H股（1772.HK）由106.86港元下调至44.28港元；青海盐湖工业（000792.SZ）由49.80元下调至34.92元。瑞银重申对上述所有四只股票的买入评级，认为当前中国锂业股已被过度抛售。#文字观点", "publish_time": "2026-09-22 12:54", "tags": ["文字观点"]}, "attachment:files/中金公司-电新双周报：风电设备招标增长可观；人形机器人量产提速-260921.pdf": {"id": "attachment:files/中金公司-电新双周报：风电设备招标增长可观；人形机器人量产提速-260921.pdf", "kind": "attachment", "title": "中金公司-电新双周报：风电设备招标增长可观；人形机器人量产提速-260921", "source_label": "中金公司", "excerpt": "电新双周报：风电设备招标增长可观；人形机器人量产提速 电新双周报：风电设备招标增长可观", "content": "电新双周报：风电设备招标增长可观；人形机器人量产提速 电新双周报：风电设备招标增长可观；人形机器人量产提速 2026-09-21 行业近况 2026 年 9 月 7 日至 9 月 18 日，风电 / 光伏 / 电网设备 / 新能源车 / 储能 / 工控设备涨跌幅 +4.5%/+1.4%/-1.7%/-2.9%/-3.4%/- 4.6% 。 评论 新能源车中游：排产逐步进入旺季，消费税加征或短期影响锂电盈利、但中长期有望向 焦新质生产力，通过“区域渗透+赛道扩张+资质补强”的并购策略切入高景气赛道，2025年以来完成中认通测、中鼎检测等标的整合，新兴业务增速显著优于传统板块；第二曲线布局高端科学仪器与检测装备，打造“感知-测量-验证-装备-场景”一体化能力，并逐步构建“检测设备+服务+认证”协同优势；第三曲线前瞻卡位质量科技服务未来产业，储备长期动能。我们看好公司作为从传统建工向综合检测平台转型的稀缺标的，外延并购驱动成长路径清晰，预计公司2026-2028年归母净利润分别为0.36/0.62/0.82亿元，同比增长67.3%/71.5%/32.4%，首次覆盖，给予“买入”评级。内生增长筑牢基本盘，外延并购打开新空间。公司坚持“内生增长+外延并购”双轮驱动，内生维度，多板块协同推动业务结构优化，2026H1生命科学与消费品板块营收1.6亿元，同比大增112%，为核心增长引擎；新能源与汽车板块营收0.8亿元；工业与先进制造板块营收1.5亿元，同比增长7%；工程服务板块营收2.7亿元，虽有所下滑但回款改善；外延维度，公司聚焦高景气赛道，先后完成对中认通测、中鼎检测、冠标检测、中水华盈等标的的收购，同时稳步推进全球化，业务覆盖印尼、新加坡等多个国家。收购中水华盈69.62%股权，补强新能源检测版图。7月公司公告拟以自有资金6,158万元收购中水华盈（广州）69.62%股权，交易完成后公司间接持有中水国信（广州）55%股权，26-28年扣非净利润目标为1000/1400/2100万元。中水国信为聚焦风电、光伏、储能等新能源领域的专业检测技术服务机构，拥有CNAS、CMA、承装（修、试）电力设施许可证等资质，可充分满足新能源场站并网验收、参数复测等检测需求。客户层面，中水国信客户与华能、华电、大唐、国家电投等主流发电央企建立稳定合作关系，市场拓展能力稳步增强；经营层面，中水国信依托新型电力系统产业政策红利与新能源并网检测扩容的行业增量机遇，叠加自身全国化网点布局、高壁垒检测资质体系及深度绑定的优质客户，未来成长空间广阔。通过本次收购，公司将布局新能源涉网试验、并网检测、储能检测等细分业务，实现向新能源电力技术服务板块战略延伸，打开长期成长空间。 ☎欢迎联系：开源中小盘 周佳#文字观点", "publish_time": "2026-09-22 20:03", "tags": ["文字观点"]}, "attachment:files/UBS-中国锂行业：虽已脱离峰值，但已超跌.pdf": {"id": "attachment:files/UBS-中国锂行业：虽已脱离峰值，但已超跌.pdf", "kind": "attachment", "title": "UBS-中国锂行业：虽已脱离峰值，但已超跌", "source_label": "UBS", "excerpt": "ab 21 September 2026Global Research China Lithium Off the peak but oversold Cutting China lithium price assumptions Following UBS Global Commodity team's cuts to its global lithium", "content": "ab 21 September 2026Global Research China Lithium Off the peak but oversold Cutting China lithium price assumptions Following UBS Global Commodity team's cuts to its global lithium price assumptions, we further cut our China lithium price assumption to Rmb120k/t (from Rmb200k/t) for 2027E according to our detailed cost curve analysis of supply demand under the base case scenario (demand/supply up 15%/22% YoY), but still above what's priced in (i.e. Rmb100k/t). We think the current market is likely overly concerned about the potential destocking of China BESS battery while ignoring the downside risk in supply attributed by the anti-corruption investigation in Jiangxi. Hence, we cut our China lithium stocks' earnings estimates and price target but reiterate our Buy ratings. Concern on China ESS battery destocking remains a key downside risk China's battery-related lithium demand (based on cathode/electrolyte production) has risen ~60% YoY in 8M26, outpacing the ~45% YoY growth implied by end-market demand from EV sales and BESS installations ( Figure 4 ). Our supply chain analysis indicates low to moderate inventories across lithium chemicals, cathodes, batteries and OEMs, but elevated inventories at BESS integrators and downstream channels. The key downside risk is slower conversion of BESS project tendering into installations, which could drive destocking and weigh on battery production in 2027E (see details here). We forecast BESS battery demand, accounting for ~30% of total lithium demand, to grow 30% YoY in 2027E versus 64% in 2026E, reflecting destocking risks and a higher base. Consequently, we expect total lithium demand growth to moderate to 15% YoY in 2027E, supporting a lithium price of Rmb120k/t LCE based on the global cost curve. In contrast, the current market is pricing in a lithium price of Rmb100k/t LCE (i.e. 18-20x PE on pure lithium producers, Figure 25 S e n s i t i v i t y o f C h i n a ' s l i t h i u m c o m p a n i e s ' n e t p r o f i t a t t r i b u t a b l e t o s h a r e h o l d e r s a n d i m p l i e d 2 0 2 7 E P E s a t c u r r e n t s h a r e p r i c e s t o l i t h i u m p r i c e s), which implies ~10% lithium demand growth on the global cost curve. Chinese-controlled supply in 2027E may face downside risk UBS's base case assumes 22% YoY growth in global lithium supply in 2027E, with limited incremental output from Jiangxi lepidolite and continued exports of all Zimbabwean spodumene production. However, we see downside risks to both assumptions, including further disruptions to Jiangxi lepidolite operations amid anti- corruption investigations and uncertainty over Zimbabwe's 2027 export quotas following its export ban. Under its downside supply scenario, UBS assumes global lithium supply growth of 10% YoY in 2027E. By comparison, market consensus currently assumes 30% YoY supply growth, effectively pricing in no disruption to Jiangxi lepidolite production. Cutting earnings and price targets, while maintaining Buy ratings Based on our updated lithium price forecasts, we cut our 2027E earnings estimates for our China lithium coverage by 50-56% and hence cut the price targets based on unchanged target EV/EBITDA multiples. We reiterate our Buy ratings on all covered stocks (see Figure 1 below) as we believe our China lithium coverage has been overcorrected. Figure 1: Summary of our rating, estimate and price target changes Source: UBS estimates. Note: Price as of 21 September 2026. This report has been prepared by UBS Securities Asia Limited. ANALYST CERTIFICATION AND REQUIRED DISCLOSURES, including information on the Quantitative Research Review published by UBS, begin on page 30. Equities China Basic Materials Sky Han Analyst sky.han@ubs.com +852-3712 4548 Sharon Ding Analyst sharon.ding@ubs.com +852-2971 6284 Robin Chen Associate Analyst robin.chen@ubs.com +852-2971 8678 Lachlan Shaw Analyst lachlan.shaw@ubs.com +61-3-9242 6387 Levi Spry Analyst levi.spry@ubs.com +61-3-9242 6709 Joshua Spector, CFA Analyst joshua.spector@ubs.com +1-212-713 6188 Dim Ariyasinghe Analyst dim.ariyasinghe@ubs.com +61-3-9242 6385 Christopher Perrella Analyst christopher.perrella@ubs.com +1-212-713 1443 China Lithium 21 September 2026 ab 2China Lithium UBS Research China Lithium Sector Thesis Map UBS Research THESIS MAP MOST FAVORED QSLI, Tianqi Lithium, Ganfeng Lithium A/HLEAST FAVORED N/A Q: Is downstream battery inventory signalling downside risks to 2027E lithium demand? Yes, primarily in ESS. EV batteries remain in an active destocking cycle with low inventory risk. In ESS, inventories have started to build again. While China BESS shipments remain supported by exports and domestic BESS bid winning, slower conversion from bid winning to installations and potential front-loading exports in 2026E could trigger downstream destocking, implying downside risk for 2027E lithium demand. See more details here. Q: Is risk in our base-case 2027E lithium supply forecast skewed to the upside or downside? Downside. In its base case, b a s e c a s e UBS forecasts 2027E global lithium supply to rise 22% YoY, where we assume limited increments in Jiangxi lepidolite supply due to regulatory environments, while all Zimbabwe spodumene production remains available for export. We see downside risks from lower- than-expected Zimbabwe export quotas, tighter-than-expected restrictions on incremental Jiangxi supply, and slower ramp-ups across new lithium projects globally. See more details here. Q: What lithium carbonate price is implied by our supply-demand scenarios and 2027E cost curve analysis? Our base case points to a China lithium carbonate price of Rmb120,000/t (incl. VAT) or US$15,617/t (excl. VAT) in 2027E. In our base case, we forecast lithium demand to grow 15% YoY and supply 22% YoY, implying a tight balance in 2027E. See more details here. We forecast China lithium carbonate spot prices to average Rmb120,000/t in 2027E. We believe China lithium stocks are pricing in a lithium carbonate price of Rmb100,000/t (including VAT) compared with the current spot price of Rmb138,500/t (including VAT), as reported by SMM on 16 September 2026. Based on our updated lithium price forecasts, we cut our 2027E earnings estimates for our China lithium coverage by 50-56%, placing us largely in line with consensus. We update the price targets for our China lithium coverage – QSLI from Rmb49.80 to Rmb34.92, Ganfeng-A from Rmb110.45 to Rmb57.05, Ganfeng-H from HK$106.86 to HK$44.28, and Tianqi from Rmb93.18 to Rmb52.13 – and reiterate our Buy ratings on all four stocks. We believe the current China lithium stocks has been overcorrected. We carried out a detailed analysis of lithium demand and supply in different scenarios given the big debate and also a comprehensive analysis on cash cost curve. In our base case, we forecast lithium demand to grow by 15% YoY and supply by 22% YoY, implying a tight balance in 2027E. Based on our cost curve analysis, this balance corresponds to a China lithium carbonate price of Rmb120,000/ t (incl. VAT) or US$15,617/t (excl. VAT) . Figure 2: UBS Global Primary Lithium Cash Cost Curve Source: UBSe, Company profiles. Pivotal Questions WHAT´S PRICED IN? UBS VIEW EVIDENCE China Lithium 21 September 2026 ab 3China Lithium UBS Research Key debate on demand side: Are battery installations signalling downside risks to 2027E lithium demand? We see some downside risk to lithium demand in 2027E, primarily attributed to 1) downstream destocking risk of BESS battery producers and system integrators; 2) potentially, upstream lithium producers' CAPEX may start to outpace downstream battery producers. In our base case, we forecast global lithium demand to increase 15% YoY in 2027E, with EV battery demand up 10% YoY and ESS battery demand up 30% YoY, where we considered the downstream ESS battery producers and integrators to do some destocking. In our upside case, we assume global lithium demand to increase 20% YoY in 2027E; while in our downside case, we assume global lithium demand to grow 10% YoY in 2027E, where we consider an even bigger destocking. Inventory puzzle along the whole lithium-ion battery supply chain We have analysed the inventory along the whole supply chain of lithium-ion battery from upstream lithium mines/convertors, to midstream cathode and electrolyte producers, to downstream battery producers, and to integrators and ESS project owners. We maintain the conclusion that the upstream to midstream inventory level is quite low, the downstream battery producers' inventory level not high, while ESS battery integrators and project owners' : CPCA, China Customs, SMM, UBSFigure 20: China electric passenger vehicle inventory vs inventory days Source: CPCA, China Customs, SMM, UBS CAPEX expansion of upstream and downstream As of Q226, we see the downstream battery producers' CAPEX to outpace the upstream lithium producers. However, recently, we have seen several headlines suggesting that the future expansion of BESS battery will be constrained due to anti-involution. While at the current lithium price, the upstream lithium producers are still incentivized to expand. Hence, we may potentially see upstream lithium producers' CAPEX outpace that of the downstream battery producers. Figure 21: Capex gap between China's battery producers (YoY %) and lithium producers (YoY %) during the same period vs. spot price for Li2CO3 Source: Company data, Wind, SMM, UBSFigure 22: Capex gap between China's battery producers (YoY %) and lithium producers (YoY %), with China battery producers' capex lead 1 year vs spot price for Li2CO3 Source: Company data, Wind, SMM, UBS China Lithium 21 September 2026 ab 7Key debate on supply side: Is risk in our base-case 2027 lithium supply forecast skewed to the upside or downside? We review and update our global supply, but would like to highlight the downside risks in our 2027E supply forecasts. In our base case , we forecast 2027E global lithium primary and secondary supply of 2,626kt LCE, up 22% YoY or 468kt LCE incremental , assuming some impact on volume from Jiangxi lepidolite operations and no material disruption of Zimbabwe's exports. A key assumption in our forecasts concerns supply from Jiangxi, similar to what happended in Shanxi for coking coal supply disruption. Given the current mining compliance and approval environment, we assume regulatory requirements continue to be applied conservatively and therefore we assume Jiangxi lepidolite supply flat YoY in 2027E in the base case scenario. At the same time, our base case assumes that all spodumene concentrate produced in Zimbabwe remains available for export in 2027, with no material impact from export ban on spodumene concentrate. While market discussions have increasingly focused on the volume of pipeline projects scheduled for commissioning in 2027, we believe the risk to supply remains skewed to the downside. In our downside scenario for supply , we assume global lithium primary and secondary supply to be 2,359kt LCE, up 10% YoY or 201kt LCE incremental , assuming that 1) Jiangxi lepidolite operations are largely off due to the investigation by anticorruption authorities; and 2) Zimbabwean government strictly conducts an export ban based on the construction progress of downstream lithium sulphate plant. By contrast, in our upside scenario for supply , supply could increase to 2,846kt LCE, up 30% YoY or 678kt LCE incremental , which assumes 1) production in Jiangxi normalises, allowing currently constrained supply to re-enter the market; 2) Zimbabwean producers are able to export their full production volumes; and 3) all major pipeline projects are delivered on schedule, ramping up efficiently and becoming effective supply more quickly than expected. However, new capacity is still unlikely to be available at full run-rate from the beginning of the year, with most projects requiring a gradual ramp-up process. What lithium price is implied by our supply- demand scenarios and 2027E cost curve analysis? Our base case points to a China lithium carbonate price of Rmb120,000/t (incl. VAT) or US$15,617/t (excl. VAT) in 2027E We derive our lithium price forecasts by combining our supply-demand scenarios with our global lithium cost curve. In our base case, we forecast lithium demand to grow by 15% YoY and supply by 22% YoY, implying a tight balance in 2027E. Based on our cost curve analysis, this balance corresponds to a China lithium carbonate price of Rmb120,000/t (incl. VAT) or US$15,617/t (excl. VAT) . Figure 23: UBS Global Primary Lithium Cash Cost Curve (Base case for both supply and demand) Source: UBSe, Company files China Lithium 21 September 2026 ab 8Downside case: price moves closer to the cost-curve floor Under our downside case scenario , we assume weaker-than-expected ESS battery demand hence downstream destocking, as well as stronger-than-expected supply growth. We assume lithium demand to increase at 10% YoY and supply to grow at 30% YoY, resulting in a market surplus of 233kt LCE. Demand : We assume weaker-than-expected ESS battery demand, reflecting: 1) a moderation in BESS export demand following this year's front-loading; and 2) domestic BESS installations falling materially short of current bid winning levels, leading to slower-than-expected inventory drawdown across the lithium value chain. Supply : We assume: 1) production in Jiangxi normalises and the currently constrained supply will re-enter the market; 2) Zimbabwean producers are able to export their full production volumes without any material constraints from export quota; and 3) major pipeline projects currently under construction are delivered on schedule, ramp up efficiently and become effective supply faster than expected. Under such conditions, prices would move further down the cost curve towards marginal cost producers, implying a China lithium carbonate price of Rmb78,761/t (incl. VAT) or US$10,250/t (excl. VAT) in 2027E. Upside case: Supply disappointments coul", "status": "extracted"}, "post:2026-09-22T18-28:a960a68239ff": {"id": "post:2026-09-22T18-28:a960a68239ff", "kind": "post", "title": "2026-09-22 18:28", "source_label": "帖子正文", "excerpt": "【东财通信】光通信观点更新：忽略短期博弈，重视以光代存的产业趋势Meta Muse推动算力需求预期再上修，光互连底层逻辑强化。Meta于9月初推出个人AI智能体Muse，上线约12天登顶美区应用免费榜、累计下载破百万。", "content": "【东财通信】光通信观点更新：忽略短期博弈，重视以光代存的产业趋势Meta Muse推动算力需求预期再上修，光互连底层逻辑强化。Meta于9月初推出个人AI智能体Muse，上线约12天登顶美区应用免费榜、累计下载破百万。每个用户独占常驻云虚拟机，算力消耗重心从训练转向长驻推理与多步骤工具编排，总推理与CPU编排负载指数级抬升，市场由此打消此前”AI算力需求边际放缓“的担忧。对光通信而言，总算力节点数与东西向流量有望同步放大，推动光互连需求提升，且高密度、低功耗诉求进一步加速NPO/CPO渗透与迭代。光通信板块近期催化密集，NPO/CPO起量节奏渐明。华为全连接大会发布全球首个采用NPO技术的超节点，预计27年上市，下一代光互连技术产业化在即。9月ECOC 2026展会与10月美国OCP展会接连登场，预计将集中展示最前沿的硅光、CPO、OCS等技术进展以及下一代网络架构方案，或将成为行业情绪的重要催化剂，市场关注度有望持续升温。我们预计，NPO或将于26Q4小批量出货，27H2大规模放量；CPO有望于27Q1起量，27H2-28年大规模放量。中美经贸接触释放缓和信号，光模块出海的监管不确定性逐步消退。习特会纽约首日经贸磋商结束，聚焦AI与贸易，美国财长“非常成功”的表态有助于缓解市场对FCC等监管压力压制光通信龙头的担忧，并修复此前因海外收入不确定性而受抑的估值预期。我们仍然认为光通信是当前AI算力赛道中确定性最高、产业趋势最明确的方向之一。光互连将内存从计算芯片旁的本地稀缺资源转化为跨机架、可共享的内存池，可降低对持续涨价存储颗粒的依赖，并提升内存利用率与推理效率，以光代存产业趋势较为明确。此外，从800G向1.6T演进的过程中，单模块价值量显著提升，叠加NPO/CPO技术升级，光通信产业链的景气度具备较强的持续性和抗扰动能力，量价齐升逻辑更为清晰，龙头公司的业绩兑现度也更高。因此在中长期维度上，依然看好这一方向的配置价值。 #建议重点关注：中际旭创、新易盛、天孚通信、、九州一轨、华工科技、光迅科技、联特科技、汇绿生态、长光华芯、炬光科技。欢迎联系：csy,wyj,clh#文字观点", "publish_time": "2026-09-22 18:28", "tags": ["文字观点"]}, "post:2026-09-22T22-13:d181c171150c": {"id": "post:2026-09-22T22-13:d181c171150c", "kind": "post", "title": "2026-09-22 22:13", "source_label": "帖子正文", "excerpt": "野村于 9 月 22 日举办AI 专家电话会，邀请了一位来自 AI 基础设施服务提供商的专家。专家主要讨论了 800G／1.6T 数字信号处理器（DSP）的供需、技术壁垒和供应瓶颈、DSP 行业竞争格局和价格趋势，以及跨阻放大器（TIA）与驱动器的价格和产品进展。", "content": "野村于 9 月 22 日举办AI 专家电话会，邀请了一位来自 AI 基础设施服务提供商的专家。专家主要讨论了 800G／1.6T 数字信号处理器（DSP）的供需、技术壁垒和供应瓶颈、DSP 行业竞争格局和价格趋势，以及跨阻放大器（TIA）与驱动器的价格和产品进展。主要观点如下 800G 与 1.6T DSP 的供需情况 据专家介绍，2025 年 800G DSP 出货约 2,500 万至 2,600 万颗，1.6T DSP 出货超过 300 万颗。 专家估计，2026 年 800G DSP 出货接近 5,000 万颗；1.6T DSP 需求可能超过 2,000 万颗，但实际出货估计为 1,600 万至 1,700 万颗。800G DSP 采用 7 纳米和 5 纳米制程，而 1.6T DSP 需要目前产能不足的 3 纳米制程。专家预计，1.6T DSP 产能在 2027 年下半年将明显增加。 专家估计，2027 年 800G DSP 出货将达到 1.2 亿至 1.5 亿颗；需求不仅来自 AI 数据中心，也来自进入设备更新周期的电信市场。2027 年 1.6T DSP 需求估计为 6,000 万至 7,000 万颗，而供应量约为 4,000 万至 5,000 万颗，产能与良率将继续提升。 高端 DSP 的技术壁垒与竞争格局 专家称，2026 年是用于 1.6T 光收发模块的 3 纳米 DSP 首次大规模出货的一年，但仍有几项瓶颈：一是良率偏低；二是前向纠错（FEC）等算法尚有需要修复的问题；三是高速 DSP 接口与网络交换机之间存在兼容性问题。 DSP对新进入者而言技术壁垒较高，原因如下： 1）制造工艺需要先进制程（7nm 以下），流片成本极高； 2）前向纠错、误码率、均衡技术、色温及色散补偿等信号处理算法相关技术难度较高； 3）功耗管理与热控制同样存在挑战。 部分第二梯队厂商也能生产 800G DSP，但缺少强大的客户生态。DSP 测试需要光模块制造商与最终客户共同参与，每轮测试可能持续约两年。因此终端客户更换供应商的成本高，倾向于继续与现有供应商合作。 中国的部分 DSP 厂商，例如 Sitrus Technology 和 Joywell Semiconductor，已在开展 800G DSP 业务。 Coherent Lite DSP 的采用 谷歌在 TPU 和OCS网络中使用 2.4T Coherent Lite 光收发模块。Coherent Lite DSP 是从传统相干 DSP（用于电信或长距离网络）定制而来，以适用于 AI 数据中心网络；它只使用单一固定波段（O 波段），覆盖 2 至 20 公里的距离。 Coherent Lite DSP 的技术壁垒低于现有传统相干 DSP，但高于标准 PAM4 DSP。 800G 和 1.6T DSP 的价格趋势 据专家介绍，目前 800G DSP 长期供货协议价格为每颗 45 至 70 美元，1.6T DSP 的 LTA 价格为每颗 120 至 150 美元；零售价格比长期协议价高 10% 至 20%。 专家认为，随着产能增加，DSP 价格将在 2027 年小幅下降，其中 800G DSP 可能下跌约 10%，1.6T DSP 的跌幅预计更小。 TIA 和驱动器的发展 专家表示，领先的 TIA 和驱动器制造商已经量产单通道 200G 产品；单通道 400G TIA 和驱动器仍处于开发阶段，主要技术难点是同时实现高线性度、低噪声和低功耗。 由于 TIA 与驱动器可采用 28 纳米先进制程，中国厂商已量产 100G TIA 和驱动器，200G 产品则处于送样阶段。不过，在产品稳定性和客户验证周期等方面，中国厂商与海外厂商仍存在差距。 NPO 与 CPO 对电芯片的影响 为了降低功耗，NPO和CPO将移除 DSP。移除 DSP 后，均衡、误码和失真纠正等功能，将由 TIA／驱动器和交换芯片分别承担一部分。这也对 TIA 与驱动器的线性度提出更高技术要求。#文字观点", "publish_time": "2026-09-22 22:13", "tags": ["文字观点"]}, "post:2026-09-22T20-03:f5ebf697fb7a": {"id": "post:2026-09-22T20-03:f5ebf697fb7a", "kind": "post", "title": "2026-09-22 20:03", "source_label": "帖子正文", "excerpt": "水晶光电上涨逻辑（文字版） 一句话：苹果链现金流托底，HDD玻璃基板\"缺货\"打开第二成长曲线，业绩从2026H2起逐季加速，估值却在历史均值下方。第一层：基本盘——苹果链的价值量与份额双升（确定性最高） 公司当前利润主体是北美大客户：红外截止滤光片（IRCF）份额目前20-30%，管理层指引1-2年", "content": "水晶光电上涨逻辑（文字版） 一句话：苹果链现金流托底，HDD玻璃基板\"缺货\"打开第二成长曲线，业绩从2026H2起逐季加速，估值却在历史均值下方。 第一层：基本盘——苹果链的价值量与份额双升（确定性最高） 公司当前利润主体是北美大客户：红外截止滤光片（IRCF）份额目前20-30%，管理层指引1-2年内提升至50%，即份额翻倍；微棱镜模块绑定潜望式长焦渗透率提升，出货量已大幅增长，且2028年潜望式迎来第二代设计，棱镜ASP进一步上移；涂布滤光片随高端机型供货占比提升持续放量。这一层的意义不只是增长，而是托底——它保证了公司在AI新业务兑现前，利润和现金流不会塌方，给左侧布局提供了容错空间。 第二层：核心弹性——HDD玻璃基板，\"要么涨要么缺\"的标准样本（2027-2028兑现） AI训练推理带来数据量爆炸，近线机械硬盘成为存力底座，云厂商锁定大容量产能，合约价在供需错配中上涨——需求端在抢。而HAMR硬盘迈向40TB以上容量，传统铝基板无法满足平整度和刚性要求，玻璃基板成为唯一路径——供给端有硬约束。水晶的\"超精密原子级光学加工能力\"恰好卡位这个环节：2026年小批量爬坡，2027年几百万颗，2028年几亿颗，ASP约2美元，对应15亿以上收入、占总收入近15%。这是典型的从0到1，且是天时（AI存力周期）+地利（供给硬约束）共振的从0到1。 第三层：提前兑现的期权——光通信元器件（2027H1） AI数据中心光模块从400G向800G/1.6T迭代，供应链设备紧张反而加速了公司滤片、微透镜的导入——2027年上半年开始大批量出货。它不等CPO，吃的是当下可插拔光模块放量的确定性增量。 第四层：远期免费期权——AR光波导与CPO 反射光波导产线已建成、通过客户认证，是某关键客户FoV超50度型号的唯一方案，等待杀手级应用引爆；TGV玻璃基板、等离子交换波导卡位CPO，十五五后期量产。这两层当前估值里基本没给钱，属于\"涨了是惊喜\"的部分。 第五层：业绩与估值的错位（赔率来源） 2026年上半年\"增收不增利\"是投入期假象——研发+45.6%、股份支付、汇兑摆动压制了利润表，但毛利率在提升（Q2单季33.8%，超预期4.1pct）、经营现金流+44%。美银预测2026-2028年净利复合增速25%，其中Q3苹果拉货季单季净利+29%是首个验证点，节奏上是逐季加速。而股价从4月44.3元回撤43%至25元附近，对应2026年24倍、2028年15.5倍PE，低于历史均值27倍——概念退潮完成出清，新业务的账还没被定价。 逻辑链收口：向下的风险有苹果链现金流和低于均值的估值封住；向上的空间由HDD玻璃基板的\"缺货+从0到1\"打开，光通信和AR提供层层期权。本质上是用苹果链的钱，买AI存力的票——Q3财报和HDD小批量爬坡是两个验证节点，验证前是观察仓，验证后才是重仓窗口。#文字观点", "publish_time": "2026-09-22 20:03", "tags": ["文字观点"]}, "post:2026-09-22T12-55:9fe65a3af259": {"id": "post:2026-09-22T12-55:9fe65a3af259", "kind": "post", "title": "2026-09-22 12:55", "source_label": "帖子正文", "excerpt": "联讯仪器：扰动不改看好，回调即布局机会 公司股价调整主要系市场担心8月海关数据和1.6T示波器竞争。我们认为三季度业绩无需担心，新玩家切入头部光模块厂商难度较高，联讯的份额优势不会被颠覆，短期扰动不改坚定看好： 1⃣海关数据：8月\"其他示波器\"出口2.98亿元，环比-21%，但仍为年内次高，7–8月", "content": "联讯仪器：扰动不改看好，回调即布局机会 公司股价调整主要系市场担心8月海关数据和1.6T示波器竞争。我们认为三季度业绩无需担心，新玩家切入头部光模块厂商难度较高，联讯的份额优势不会被颠覆，短期扰动不改坚定看好： 1⃣海关数据：8月\"其他示波器\"出口2.98亿元，环比-21%，但仍为年内次高，7–8月合计已超过二季度全季。联讯三季度交付向国内大客户倾斜，美国客户又由马来西亚基地发货，这两部分都不计入出口，因此业绩与海关数据并非直接映射。 2⃣竞争格局：近期华兴源创、鼎阳科技、电科思仪均披露了1.6T示波器相关布局、市场担心份额变化。但据我们产业链调研，旭创1.6T仍由是德和联讯主供，新易盛情况类似。国内其他厂商中普赛斯进度最快，但800G仍在验证，1.6T尚未进入。光模块测试全检、验证周期长，27年放量期客户优先看交付，新玩家短期难获实质份额。 3⃣业绩与催化：1.6T测试仪器进入大规模出货期，三季度利润有望环比高增，四季度进一步提升，我们预计全年利润有望显著高于市场一致预期。短期关注存储测试机年底整机验证及订单落地，中期看CPO测试产品放量，继续坚定看好！ 具体情况欢迎交流~#文字观点", "publish_time": "2026-09-22 12:55", "tags": ["文字观点"]}, "attachment:files/国内先进封装市场调研‑2：2027年国内先进封装市场供需展望，头部公司扩产规划及CoWoS‑S、CoWoS‑L大致分配，先进封装价格表现及后续变化预期，CoWoS‑S过渡到CoWoS‑L对毛利影响等.pdf": {"id": "attachment:files/国内先进封装市场调研‑2：2027年国内先进封装市场供需展望，头部公司扩产规划及CoWoS‑S、CoWoS‑L大致分配，先进封装价格表现及后续变化预期，CoWoS‑S过渡到CoWoS‑L对毛利影响等.pdf", "kind": "attachment", "title": "国内先进封装市场调研‑2：2027年国内先进封装市场供需展望，头部公司扩产规划及CoWoS‑S、CoWoS‑L大致分配，先进封装价格表现及后续变化预期，CoWoS‑S过渡到CoWoS‑L对毛利影响等", "source_label": "其他", "excerpt": "盛合晶微承接了华为目前80%的订单，盛合公司的产线， 包括大部分机台，都是针对华为或寒武纪这类客户的产品需求进行特制化定制的，这些 机台只能运行其特定产品。目前L类产品的月供货量中寒武纪的订单占 比较多。", "content": "国内先进封装市场调研‑2：2027年国内先 进封装市场供需展望，头部公司扩产规划及 CoWoS‑S、CoWoS‑L大致分配，先进 封装价格表现及后续变化预期，CoWoS‑S 过渡到CoWoS‑L对毛利影响等‑通富/渠 梁/长电 调研专家观点整理 本文核心要点 1.2027年国内先进封装市场供需展望 2.头部公司扩产规划及CoWoS‑S、CoWoS‑L大致分配 3.先进封装价格表现及后续变化预期 4.CoWoS‑S过渡到CoWoS‑L对行业毛利影响 专家观点 1、华为目前在扶持渠梁作为其先进封装的第二供应商，将对盛 合晶微产生什么影响？未来如何判断双方的竞合关系？ 华为开发渠梁作为第二供应商，并同时在发展第三、第四供应商，这属于其内部的供应 链管理策略。尽管华为对外宣称扶持渠梁是为了优化CoWoS‑L类产品，但从业务布 局来看，未来先进的高端产品大概率不会放在渠梁。华为可能会将一部分技术相对成熟、 跑量型的低端产品订单释放给渠梁。 这样的安排对双方都有利：一方面，盛合晶微可以将产能和精力集中于附加值更高的高 端系列芯片封测订单；另一方面，华为通过渠梁确保了普通类型产品的稳定交付，同时 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 也能投入更多资源于更高端产品的研发。 因此，盛合晶微后续将继续与华为在高端系列订单上深化合作，而渠梁等其他供应商主 要承接低端跑量型产品的订单。客户在选择高端产品供应商时，更倾向于拥有丰富量产 经验和成熟技术方案的厂商，新进入者即使有资金和团队，其技术爬坡周期也会很长。 2、盛合晶微作为华为一供的地位未来是否可能动摇，例如降为 二供或三供？ 盛合晶微作为一供的地位不可能动摇。这主要基于以下几点： 1.从封测经验来看，盛合晶微具备显著优势。 2.双方存在协议性要求。盛合晶微承接了华为目前80%的订单，盛合公司的产线， 包括大部分机台，都是针对华为或寒武纪这类客户的产品需求进行特制化定制的，这些 机台只能运行其特定产品。 3.客户也通过团队入股等方式与公司进行合作。此外，盛合公司与华为签订了一份长 期战略协议。 3、如何看待国内先进封装行业中短期的供需变化，以及各厂商 产能扩充的速度与难度？ 关于供需情况，主要依据是接收到的实际需求、客户预留产能的预测以及来片计划，而 非依赖外部信息。 从工艺发展路径看，目前主要分为两条路线，其中CoWoS路线以及其他3D封装技 术在短期内不会有大量变化，仍处于缓慢的研发爬坡过程。对于CoWoS‑S类产品， 目前处于稳步上升阶段，且各客户的订单占比已经固定，可以根据分配的额度较准确地 推算出其出货量或需求。 展望2027年，产能预计将以每月1000片的速度继续增长，但明年将出现一个关键 的转折点：S类产品的需求量会下降，而L类产品的需求量将上升。这主要是因为L 类产品的工艺发展已接近量产时间节点。届时，封测端会将一部分S类产线转换为L 类产线。 具体而言，S类产能在2027年第二至第三季度间达到峰值后会逐渐回落，最终稳定 在与当前相似的每月8000‑9000片的水平，并不会像市场预测的那样持续翻倍增长。 与此同时，L类产品的产能将显著提升。目前L类产品的月供货量中寒武纪的订单占 比较多。盛合公司已为寒武纪、华为等在2027年三四月份预留了几千片的L类月产 能规划。这表明未来的发展趋势是将部分S类产能转向L类。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 4、请确认并梳理一下盛合公司S类和L类产品具体的产能数 据及未来的增长规划？ 当前基准时间：2026年9月 •当前月产能：S类产品为7500片，L类产品为2000片。 •2026年年底目标： ￮S类产品月产能目标：12000片 ￮L类产品月产能：3000多片，不足4000片 ￮S+L总月产能合计：15000多片 •2027年产能变化： a.S类产品达到15000‑16000片/月的产能峰值后，预计第三、四季度开始 回落，最终稳定在8000‑9000片/月。下降的产能将逐步转移给L类产品。 b.L类产品产能爬坡需要时间：即使分配4000片的产能，当月实际可能仅产出 几百片，需要3‑4个月才能接近目标；L类产品2027年月增长量达不到1000 片。 c.2027年底S+L总月产能预计2万片出头。 5、考虑到国内AI芯片的整体需求，预计2027年先进封装产 能是否会实现翻倍增长？同时，其他中小封装厂进入 CoWoS‑S和CoWoS‑L市场，能否对盛合晶微等头部厂商 形成有效补充？ 预计2027年国内先进封装产能无法实现翻倍增长。 •需求端：海光、沐曦等小头部客户虽然有一定体量，但其增速和占比远不及华为等 主要客户，且其产品多处于试错或实验室研发阶段，旨在开发差异化产品，避免同质化 竞争。这些小头部客户的产品导入周期至少需要六个月，且在同质化产品上不具备价格 优势，利润空间有限。 qq1490929960 •供给端：盛合晶微已占据头部客户约\\\\70%‑80%\\\\的CoWoS类封装份额。 a.长电科技主要承接研发类需求产品； wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 b.通富微电约85%‑90%的订单来自海外AMD，其宣称将在2027年内收回 2.5D或CoWoS类产线投资，但业务主要集中在CoWoS前期CP测试及后道 测试等部分工序代工，并非全流程服务； c.其余厂商技术相对落后。 因此，尽管头部厂商预留产能兑现概率较高，但整体供给侧2027年不会出现特别快速 的增长。 6、国内封测厂在先进封装领域实现大规模放量的核心瓶颈是什 么？ 国内封测厂放量的核心瓶颈分为外部因素与内部因素两方面。 外部因素 1.上游晶圆厂的放片速率； 2.芯片设计公司客户的研发进度和工艺整合完整度。 晶圆供应本身压力有限，封测厂接收的晶圆一般为数月前生产。真正关键问题：芯片 设计公司对封测流程信心不足、良率缺少稳妥方案。单片晶圆价值高昂，若一片晶圆 仅产出十几至二三十个成品，成本会急剧抬升，产生巨额资金损失。 内部因素 涉及产线建设完整度与放量水平，包括新增产线建设周期、设备机台约束。 1.新增产线预计2027年6月可上线跑量，CoWoS‑S转向CoWoS‑L的产线 改造节点相对稳妥；国产替代设备不存在障碍，关键海外机台已提前预订。 2.新成立企业的难点：海外机台交付周期长达一年以上，还需要订购易损备件，拉长 准备周期；海外设备厂商服务响应弱于国内，故障只能依靠更换备件，影响生产效率。 7、如何展望未来先进封装服务的价格趋势，特别是盛合晶微为 华为、寒武纪等主要客户提供的服务价格？ 未来的价格趋势判断需基于当前的价格水平。目前，不同客户的定价标准存在差异。 1.华为：价格不受市场波动影响，诸如月度涨幅、插队费等，双方协商锁定固定价格。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2.其余商业客户：跟随市场上行，封测价格平均每月上涨30%‑35%；小头部客户如 果要锁定产能、加急排产，需要额外支付插队/加急费用。 CoWoS‑L价格显著高于CoWoS‑S：举例，若S类5万元/片，则L类至少6 万元/片。当前L类高价属于非正常阶段，后续具备降价空间，原因有两点： 1.当前L良率不稳定，封测厂收取高价，但不承担良率偏低带来的客户芯片成本损 失，与良率已经成熟稳定的S类不同； 2.当前L类光刻沿用S类涂胶‑曝光‑显影工艺，没有采用无掩模直写光刻；后续 技术成熟、良率提升，成本与价格有望下行。 8、目前国内不同厂商的S和L产品价格差异有多大？是否存 在某些厂商通过不包含特定费用来提供更低报价的情况？ 国内各厂商S、L产品直接报价差距一般仅几千元。部分厂商低价报价，往往未包含机 台调试、人工、加急、耗材损耗等成本，把全部成本纳入核算后，整体实际总成本差距 不大。 盛合晶微的竞争优势：部分核心流程完全自研，不采购半成品做简单加工；同时布局光 刻胶原材料研发，现阶段仍采购日系产品，未来国产替代落地后可进一步压缩成本。 9、展望明年（2027年），S和L产品的价格趋势将如何演变？ ￮降价仅针对提前半年至一年给出订单预测的头部大客户；1.CoWoS‑S：价格走向稳定，当下加急订单附加额外费用的现象将消失；市场重心 向L产品转移。 ¿Û¿ÛºÅ 1490929960 2.CoWoS‑L：将成为价格层面的核心变量。 ￮新导入的中小客户，产品稳定性、订单可预测性弱，会消耗更多机台工时与耗 材，价格维持当前高位，要实现价格回归常态，需要稳定量产2‑3年。 参考比价关系：S类正常价格约为L类价格下调35%。 10、在先进封装领域，采用国产光刻胶替代能带来多大的降本空 间？国内哪些厂商的光刻胶产品表现较好？ 光刻胶成本影响主要集中在S工艺版本的L产品。当L产品产量达到S的量级， 工艺会改用新设备替代光刻胶，即DY直写光刻设备，省去研磨、涂胶、光刻、显影 整套工序，不再需要多套光刻掩模版，单产品需要7‑15块掩模版，掩模版是一笔可 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 观成本。 DY设备采购成本由封测厂和客户共同分摊，该设备也可以帮客户省去新产品研发阶段 的掩模版支出。因此DY设备会在L方案中替 3ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>AI算力与大模型：阿里云栖大会发布新一代AI芯片真武V900，称性能达到M890的3倍，将在27Q1正式量产售卖，2028Q3推出真武J900；阿里目标到2032年阿里云运营的全球数据中心规模超过20GW；云栖大会提出未来机器思考总量有望达到人类1000倍以上，阿里从“大模型能力竞争”走向“模型+Agent+AI云”全栈布局。Meta Muse上线后多数据点显示下载量超预期，C端Agent价值加速验证，并提振CPU/ASIC需求叙事。\u003c/li>\n\u003cli>半导体/先进封装与存储：有观点预计2027年ASIC/XPU在AI加速器单元出货中占比升至54%，超过GPU；ASIC与CPU接棒GPU成为下一波CoWoS产能扩张新引擎，2027至2028年产能能见度持续上修；2027年DRAM比特终端消费预计同比增长39%，其中AI服务器HBM需求达615.2亿Gb，占DRAM总需求11%；澜起科技CXL DDR4复用被视为新增长引擎。\u003c/li>\n\u003cli>光通信/CPO：Meta Muse推动算力需求预期再上修，光互连底层逻辑强化；9月ECOC 2026展会与10月美国OCP展会接连登场，或成硅光、CPO、OCS等技术进展催化；光通信DSP调研覆盖2027年1.6T DSP供需、产能、良率、长协、CPO/NPO及玻璃基板技术演进，专家认为2027年DSP价格小幅下降，800G DSP可能下跌约10%，1.6T DSP跌幅预计更小，1.6T DSP产能2027年下半年明显增加。\u003c/li>\n\u003cli>宏观/汽车/锂：伯恩斯坦路演显示行业参与者对2027年中国国内汽车需求普遍谨慎，预计同比持平或负增长，受消费疲软、政策支持有限及出口VAT退税下调风险影响；瑞银将2027年中国锂价预测下调至每吨12万元，仍高于当前市场计价每吨10万元；中金宏观周报关注海外AI资本开支持续扩张通过全球AI产业链对中国经济的外溢影响。\u003c/li>\n\u003cli>算力租赁与电源：Nebius最新调价通知显示拟自10月1日起再次大幅提价，海内外算租延续涨价趋势，算力仍是稀缺资产；维谛专家交流显示HVDC在26Q4就有小批量订单，市场认为28年才有订单存在落差，到Rubin Ultra阶段将实现全直流800V供电。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型与端侧AI/CPU叙事\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：阿里云栖大会明确客户AI需求非常强劲，将全力投入AI基础设施建设，目标到2032年阿里云运营的全球数据中心规模超过20GW；发布真武V900，性能达M890的3倍，27Q1量产，2028Q3推真武J900；Qwen持续Scaling，阿里全面迈向Agent时代；Meta Muse爆火，C端Agent价值加速验证，CPU:GPU配置比例提升叙事受到关注。\u003c/li>\n\u003cli>今天出现的催化/验证：云栖大会主论坛；国联民生计算机称Muse上线6天下载量超90万次、通过20美元+订阅模式收费；中信互联网称Muse上线第10天美区下载量突破73万，登顶美国App Store iPhone免费总榜第1；国泰海通称Muse上线首12天iOS下载量达180万次，高于ChatGPT同期130万次；有帖子称DeepSeek全面改用华为国产芯片训练大模型。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体/先进封装/存储\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：ASIC/CPU接棒GPU，2027 ASIC/XPU占比升至54%；CoWoS产能能见度上修；DRAM/HBM需求增长，CXL DDR4复用成为澜起科技新增长引擎。\u003c/li>\n\u003cli>今天出现的催化/验证：瑞银全球I/O半导体观点；伯恩斯坦澜起科技CXL深度解析；内存供需与HBM展望数据；国内先进封装市场调研1/2覆盖CoWoS-L与CoWoS-S成本良率、封测厂良率、2027年供需展望；寒武纪被提及先进封装产能影响出货。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>光通信/CPO/DSP\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：Meta Muse推动算力需求预期再上修，光互连底层逻辑强化；800G向1.6T演进，单模块价值量提升，叠加NPO/CPO技术升级，光通信产业链量价齐升逻辑更清晰。\u003c/li>\n\u003cli>今天出现的催化/验证：东财通信称9月ECOC 2026与10月美国OCP展会接连登场，或成行业情绪催化剂；光通信DSP调研覆盖2027年1.6T DSP供需与产能、良率、长协与客户份额、CPO/NPO及玻璃基板技术演进；野村9月22日AI专家电话会讨论800G/1.6T DSP供需、技术壁垒、供应瓶颈、竞争格局和价格趋势；剑桥科技目前暂无DSP加单。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：Meta Muse爆火，AI Agent趋势再起，CPU需求前景再度被市场关注；PCB大厂更多聚焦GPU算力板，产能供给紧张，CPU主板订单更多发往外协厂；PCB厂商已陆续启动重新报价。\u003c/li>\n\u003cli>今天出现的催化/验证：博敏电子PCB/CCL行业再call称业绩面超预期；澳弘电子拟3.3亿元投建高端PCB定制化生产基地；招商电子PCB行业跟踪报告称AI需求驱动高景气周期，供需、涨价与技术迭代交叉验证。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>算力租赁/液冷/电源\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：海内外算租延续涨价趋势，算力仍是稀缺资产；HVDC从理论阶段加速转向产业实操，订单时点早于市场预期。\u003c/li>\n\u003cli>今天出现的催化/验证：Nebius最新调价通知显示拟自10月1日起再次大幅提价；维谛专家称HVDC在26Q4就有小批量订单，台达维谛麦米都会有小批量订单，到Rubin Ultra阶段将实现全直流800V供电；国金机械称卡特彼勒为AIDC缺电核心受益，2026H1发电收入59.2亿美元（+34.3%），26Q2总在手订单同比+92.3%。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观策略/汽车/锂/机器人\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：2027年中国国内汽车需求预计同比持平或负增长；锂价预测下调但市场可能过度担忧BESS去库存；人形机器人量产提速。\u003c/li>\n\u003cli>今天出现的催化/验证：伯恩斯坦中国电动汽车及亚洲新兴机器人路演；瑞银中国锂行业报告将2027年中国锂价预测下调至每吨12万元；万联证券日本央行9月会议点评：日央行如期加息，强调通胀超调风险；中金电新双周报称风电设备招标增长可观、人形机器人量产提速；七腾发布会发布机器人大模型SevnceBrain。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>阿里云栖大会：发布新一代AI芯片真武V900，性能达M890的3倍，27Q1正式量产售卖，2028Q3推出真武J900；阿里目标2032年阿里云运营全球数据中心规模超20GW；吴泳铭提出未来机器思考总量有望达到人类1000倍以上；Qwen持续Scaling，阿里全面迈向Agent时代。\u003c/li>\n\u003cli>Meta Muse与CPU叙事：Meta Muse上线后下载量超预期，Meta股价大涨11.4%，创2025年4月以来最大单日涨幅；久其软件作为Meta官方授权代理商；腾讯、海光等被视为对应Meta&amp;AMD的CPU叙事映射。\u003c/li>\n\u003cli>半导体链：瑞银称ASIC与CPU接棒GPU成为CoWoS产能扩张新引擎，2027至2028年产能能见度持续上修；伯恩斯坦称DDR4复用有望成为CXL MXC首个大规模商业应用，并可能成为澜起科技新增长引擎；2027年DRAM比特终端消费预计同比+39%，AI服务器HBM需求达615.2亿Gb，占DRAM总需求11%。\u003c/li>\n\u003cli>光通信：Meta Muse推动算力需求预期再上修；ECOC 2026与OCP展会临近；光通信DSP调研与野村专家电话会聚焦800G/
