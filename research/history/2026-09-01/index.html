原科技（688801.SZ）拟于上交所科创板开展首次公开发行，计划募资约 61.2 亿元人民币。 本次 IPO 发行价格定为 142.18 元人民币。 CPO 板块 中际旭创计划回购 40 亿元‑80 亿元人民币（折合 12 亿美元）的公司股份，用于员工持股计划或是股权激励计划。 本次回购价格上限为每股 1200 元人民币。 回购期限自董事会审批通过起，不超过 12 个月。 AI 大模型 1工信部表示，我国将探索 “首购首用” 以及风险补偿机制，以此推动大模型、AI 智能体以及代币服务的采购规模提升。 2智谱 AI 截至 6 月的半年营收达到 9.54 亿元人民币，但该数值较分析师平均预期低约 30%。 中国电网科技 电力变压器出口跟踪：7 月美国变压器生产者物价指数上涨 7.6%；市场关注数据中心建设延期以及大宗电力设备订单的相关问题。 玻纤板块 1中国巨石（600176.SH）上调 9 月份电子布产品价格，厚布上调 15%，薄布上调 20%。 2中复连众（301526.SZ）计划通过定向增发募集最高 50 亿元人民币，主要用于扩建高速电子玻纤布以及面向 AI 领域的超低成本 Q 布产能。 消费板块 我国商务部联合其他六部门发布消费升级方案，目标到 2030 年实现 60 万亿元人民币的零售销售规模。 汽车 / 新能源汽车板块 工信部提议，将新能源汽车强制道路测试里程翻倍至 30000 公里，以此应对市场顾虑，避免测试流程缩短拉低安全标准、损耗公众信任。#文字观点", "publish_time": "2026-09-01 08:58", "tags": ["交易台", "文字观点"]}, "attachment:files/中信建投-通信行业：英伟达业绩指引乐观，MiniMax ARR大幅增长，AI产业持续高景气-260830.pdf": {"id": "attachment:files/中信建投-通信行业：英伟达业绩指引乐观，MiniMax ARR大幅增长，AI产业持续高景气-260830.pdf", "kind": "attachment", "title": "中信建投-通信行业：英伟达业绩指引乐观，MiniMax ARR大幅增长，AI产业持续高景气-260830", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况 下，本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况 下，本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业动态 英伟达业绩 指引乐观，MiniMax ARR 大幅增长，AI产业持续高景气 核心观点 英伟达FY2027 Q2实现营收962.2亿美元，同比增长106%。展望 FY2027 Q3，公司预计营收达到 1080亿美元±2%，对应同比增长 约89%。英伟达指引2028财年收入增长约70%，如果供应链不受 限的情况下，增速预计更快。 总体看，全球AI资本开支仍处于强劲上行周期。 MiniMax商业化进程明显加速， 2026年上半年实现收入约 1.17亿 美元，同比增长283.1%，其中二季度收入环比增长 81.8%；进入 三季度后增长进一步提速， 7月Token消耗量已达到1月的20倍， 8月ARR突破8亿美元。我们认为，MiniMax Token调用量与ARR 同步高速增长，反映国产大模型正从模型能力提升加速迈向规模 化商业变现，随着Agent等高Token消耗场景渗透率提升，有望 进一步拉动推理侧算力需求。今年以来，国产大模型进步神速， 我们建议持续关注国内 AI产业链相关标的。 行情回顾 本期通信板块有所回调。 通信（申万）指数下跌 3.13%，跑输沪 深300指数2.92pcts。二级子行业（申万）中，通信服务下跌 0.27%，通信设备下跌3.54%。 推荐组合 本期推荐：中际旭创、新易盛、工业富联、中国移动、亿联网 络、移远通信。 上期回顾：上期投资组合“中际旭创、新易盛、联讯仪器、中国移 动”，相同权重测算平均下跌 4.72%，跑输通信(申万)指数 1.60pcts，跑输沪深300指数4.51pcts。 持续关注：AI算力与云计算（中际旭创、新易盛、天孚通信、源 杰科技、联讯仪器、仕佳光子、 工业富联、鼎通科技、华工科 技、光迅科技、锐捷网络、 润泽科技等）；运营商（中国移动、 中国电信、中国联通）； 光纤光缆（长飞光纤、亨通光电 ropic 已与英国 AI 基础设施公司 Nscale 达成协议，将租用价值约 450 亿美元的 AI 算力。一位知情人士向 TechCrunch 透露了这一消息。成立仅两年的 Nscale 已经与微软等科技巨头达成合作。根据此次协议， Nscale 将 通过英伟达最新的 Vera Rubin 芯片系统，为 Anthropic 提供计算能力。Vera Rubin 是英伟达新一代旗舰级芯片 系统，由六种不同的芯片协同工作，被视为目前最前沿的芯片架构之一。知情人士称，这批算力预计将从 2027 年底开始为 Anthropic 的 AI 服务提供支持。据报道，双方的合作期限长达 6 年，相关计算资源将来自 Nscale 位 于美国西弗吉尼亚州的旗舰数据中心。这只是 Anthropic 近期疯狂扩充算力的最新一笔交易。过去 8 个月里， 为了更好地与 OpenAI 等竞争对手展开竞争， Anthropic 一直在大规模提升自身的计算能力。本月早些时候， Anthropic 刚刚与 AI 云计算初创公司 Volta 签署了一项价值 100 亿美元（现汇率约合 673.7 亿元人民币）的协 议。Volta 成立于今年 1 月，根据协议，Anthropic 将在未来 6 年内获得来自 Volta 位于挪威数据中心的云计算 资源。（C114通信网） 【OpenAI 前研究员巴雷特 佐夫重返谷歌，助力 Gemini 研发】巴雷特 · 佐夫（Barret Zoph）今年曾因与 Thinking Machines Lab 首席执行官米拉 · 穆拉蒂（Mira Murati）发生分歧而突然离职，并转投 OpenAI。如今， 这位 Thinking Machines Lab 联合创始人再次换了东家。 Alphabet 旗下谷歌宣布，佐夫将加入公司，出任研究副 总裁。佐夫本科毕业于南加州大学信息科学研究所自然语言小组， 2016 年入职 Google Brain 从事大语言模型研 究，2022 年 8 月加入 OpenAI 参与 ChatGPT 研发，负责后训练团队日常管理及基础模型产品化部署。 2024 年 9 月 26 日宣布从谷歌离职，加入 Thinking Machines Lab ，担任联合创始人及首席技术官。 2026 年 1 月，佐夫从 Thinking Machines Lab 离职，回归 OpenAI。“我们期待巴雷特回到谷歌，并将他在强化学习（ RL）和后训练 方面的专业经验带到 Gemini 团队。”谷歌发言人托马斯 · 舍恩菲尔德（Thomas Schoenfelder）在一份声明中 表示。佐夫于今年 1 月离开 Thinking Machines Lab ，当时与他一同离职的还有联合创始人卢克 · 梅茨（Luke Metz）以及另一名员工萨姆 · 舍恩霍尔茨（Sam Schoenholz）。三人随后都加入了 OpenAI，在加入 Thinking Machines Lab 创业之前，他们三人都曾在 OpenAI 工作。（C114通信网） 5G/6G 【中国电信首度披露5G-A用户数，累计468万户】中国电信公布2026年第二季度主要运营数据。期间，中国 电信移动用户数净增 188万户，移动用户数累计 4.4243亿户。其中，5G网络用户数当季净增 837万户，5G网 络用户数累计3.2250亿户，渗透率提升至 72.9%。有线宽带用户数方面，当季减少 28万户，有线宽带用户数 累计2.0128亿户，千兆宽带用户渗透率达到 34.3%。值得一提的是，中国电信在 2026年上半年业绩报告中提 到，中国电信的5G-A用户数达到468万户。据悉，中国电信正全面加快新型基础设施强基扩容，推进 5G-A网 络升级，规模部署载波聚合超 15万站和Redcap超70万站。（C114通信网） 卫星互联网 【Omdia：卫星物联网进入快速扩张期 LE O引领连接增长】来自Omdia的最新研究显示，卫星物联网正进入 快速扩张期，预计卫星物联网连接数将从 2023年的770万增长至2035年的1.977亿，复合年增长率（ CA GR） 仅供内部参考，请勿外传 5 通信 行业动态报告 请务必阅读正文之后的免责条款和声明。 达31%。其中，低地球轨道（ LEO）卫星物联网连接数在预测期内预计将以 88.6%的复合年增长率增长，这主 要得益于卫星的快速部署、带宽与可用性的提升以及连接成本的下降。地球静止轨道（ GEO）卫星市场也将推 动增长，不过其复合年增长率相对温和，为 7.3%。Omdia物联网首席分析师John Canali表示：“尽管卫星市 场的技术进步显著，但技术推出 的时机同样至关重要。随着物联网的成熟，企业越来越需要无信号盲区的全球 覆盖能力，以及在地面连接不可用时更强的系统韧性。当物联网设备支持日益广泛的数据密集型模型和自动化 应用时，这些需求将变得更加迫切。” Omdia预计，卫星连接将在农业与环境监测、国防与军事、能源与公用 事业以及交通与物流等关键物联网垂直领域得到广泛应用。（ C114通信网） 【FCC批准审查亚马逊5105颗D2D卫星星座计划】据悉，美国联邦通信委员会（ FCC）已同意审查亚马逊提 交的发射5105颗D2D低地球轨道（LEO）卫星星座的计划申请，并设定了 一系列截止日期和公众意见征询期。 该服务计划于2028年开始部署。FCC在一份声明中表示：“经初步审查，我们认为该申请符合提交条件，并 就该申请及相关豁免请求征求意见。”据了解， Amazon Leo申请提议部署一组D2D卫星，轨道高度在510公 里至580公里之间，分布在五个轨道层级，标称运行寿命为 6至8年，并计划在寿命结束时主动退轨。该系统 将在1.6 GHz和2.4 GHz频段运行服务链路，并在 Ka和V频段运行遥测、跟踪和指令 (TT&C) 以及馈线链路。 该公司表示，L和S频段可用于在美国以外地区提供服务链路。 亚马逊星座的三个中纬度轨道层将服务于人口 稠密地区，而两个高纬度轨道层将服务于包括极地地区在内的偏远地区。 Amazon Leo此前已宣布与沃达丰、 DirecTV、Herotel和澳大利亚国家宽带网络等运营商建立合作关系，并希望继续与移动网络运营商和其他合作 伙伴密切合作。该公司再次确认，这项基于卫星的服务将与包括 iPhone和Apple Watch在内的苹果设备兼容， 并将与Amazon Leo的宽带服务融合，该宽带服务计划于今年晚些时候正式推出。该公司专有的 D2D系统此前 主要面向车载连接和物联网应用。亚马逊近期 以115.7亿美元收购了卫星运营商 Globalstar，这笔交易包括 Globalstar的无线电频谱。预计交易将于 2027年完成。（C114通信网） 量子科技 【郭光灿院士成为硅臻芯片的显名股东 】据硅臻芯片近日发布的消息：公司完成中国科学技术大学赋权，成为 首个完成中科大赋权的光量子计算企业。 赋权完成后，郭光灿院士成为硅臻芯片的实名股东之一，硅臻也成为 了郭光灿院士除本源量子外第二家显名持股的量子计算企业。企查查数据显示，郭光灿院士持有本源量子约 8.05%股份，为本源量子第四大股东；持有硅臻芯片 1%股份。此外，本源量子也持有硅臻芯片约 1.56%股份。 资料显示，硅臻芯片成立于 2020年，由中国科学技术大学研究员、中国科学技术大学光学与光学工程系执行 主任、中国密码学会量子密码专业委员会副主任委员兼秘书陈巍，中国科学院量子信息重点实验室副主任任希 锋，以及中科大博士丁禹阳三位联合创始人创立。就在上周，硅臻芯片完成了超亿元融资。本轮融资由韦豪创 芯、共达电声联合领投，华策影视、苏创投、苏金控、创领资本、后浪资本等机构跟投。融资资金将主要用于 万比特专用光计算集群与通用量子计算芯片组的研发。硅臻芯片表示，此次完成中国科大赋权，是 硅臻芯片产 业化进程中的重要节点。未来，硅臻芯片将进一步发挥科研成果与产业工程能力的协同优势，加速量子计算技 术从“实验室里的可能性”走向“产业世界里的生产力”，推动量子计算迈向更大规模、更高性能和更广泛的 商业应用。（C114通信网） 仅供内部参考，请勿外传 6 通信 行业动态报告 请务必阅读正文之后的免责条款和声明。 【国芯科技：量子安全芯片出货超 20万颗，已投资合肥硅臻、泓格后量子、信大壹密 】8月27日晚间，国芯 科技（688262.SH）披露了2026年半年度报告。报告显示，上半年公司实现营业收入 3.13亿元，同比增长 83.66%；归母净利润-8186.45万元，较上年同期减亏 454.67万元。分业务看，芯片定制服务收入 1.59亿元，同 比增长133.56%，成为本轮增长最大增量来源； AI芯片与高性能计算芯片定制订单充沛，为下半年持续增长奠 定基础。报告指出，在量子安全及抗量子密码领域，国芯科技已成为国内少数实现“算法 IP—芯片产品—模组 方案—头部客户应用—生态协同布局”全链条贯通的芯片设计企业。其中在量子安全芯片方面，国芯科技量子 安全芯片及量子噪声源芯片、光量子噪声源后处理芯片出货量高速增长，累计出货量超过 20万颗，客户包括 合肥硅臻、问天量子等。上述产品主要应用于电力、电信等关键领域。报告显示， 国芯科技量子安全芯片 A5Q 由端安全芯片A5、光信号处理芯片AGC001和两颗光量子噪声源芯片采用多芯片封装技术合封而成，其中 AGC001和光量子噪声源芯片为公司参股公司合肥硅臻芯片技术有限公司的产品。在抗量子密码方面，抗量子 密码卡CCUPHPQ01在报告期内实现应用出货，客户包 将同比增长约43%（以2026年约1580亿美元为基准），其中存储器领域支出将同比增长约53%（DRAM增长约60%，NAND增长约30%），而代工/逻辑芯片领域支出将同比增长约34%。对于2028年，我们预计支出结构将进一步向代工/逻辑芯片领域倾斜，整体晶圆厂设备支出将同比增长约22%，但代工/逻辑芯片领域支出增幅将超过30%，存储器领域总体支出将增长约10%（其中NAND的增长幅度将超过DRAM）。 三年间可能会发生很多变化，但就目前的情况来看，2029年的前景依然十分乐观。这与我们的观点一致，即到那时，WFE市场的规模有望突破3000亿美元。 展望2028年，我们看到晶圆制造设备支出的驱动因素将发生转变：预计代工/逻辑领域的支出将达到约1500亿美元，同比增长33%，占据新增支出的绝大部分——即每年增加的500亿美元中约有75%来自该领域。这一趋势将有利于在代工/逻辑领域拥有更高业务占比的半导体设备厂商。具体而言，我们的预测中包含了来自台积电的约590亿美元、英特尔的约240亿美元、三星代工的约80亿美元，以及SpaceX旗下Terafab的约110亿美元设备支出", "publish_time": "2026-09-01 21:00", "tags": []}, "attachment:files/中信建投-基础化工行业：英伟达Q2业绩大超预期驱动AI算力高景气延续-260830.pdf": {"id": "attachment:files/中信建投-基础化工行业：英伟达Q2业绩大超预期驱动AI算力高景气延续-260830.pdf", "kind": "attachment", "title": "中信建投-基础化工行业：英伟达Q2业绩大超预期驱动AI算力高景气延续-260830", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业动态 英伟达Q2业绩大超预期驱动 AI算力高 景气延续 核心观点 当前AI通胀来到了材料端， 而材料环节的标的更加分散， 而且多数强势 公司在日本，2025年下半年以来双边关系的紧张更有加速迹象。供给端 进口替代，需求端AI通胀成为几乎完美的组合。我们判断，对日本进口 替代主题会有更多演绎空间，继续关注半导体材料进口替代交易，关注 国内半导体材料企业加速进口替代的认证节奏以及投资机会。 行业动态信息 继续关注进口替代交易下的材料选择 。日本半导体材料企业在全球半导 体材料市场份额较高，据我们统计在 19种主要材料中有14种市占率第 一。一方面是产业趋势带来的需求膨胀，一方面是国别关系紧张带来的 供给替代逻辑，关键材料的进口替代有望进一步演绎。我们筛选出目前 日企市占率较高的细分赛道， 关注国产替代加速带来的投资机会： 光掩 模版、空白掩模版、半导体前驱体、 CMP抛光垫、光刻胶及单体、陶瓷 粉体、InP衬底、PI膜、高端氟材料、湿电子化学品、大硅片等。 英伟达Q2业绩大超预期驱动AI算力高景气延续。英伟达当地时间8月 26日公布二季度总营收962亿美元，环比增长18%，同比大增106%； 数据中心业务营收890亿美元，同比上涨117%，成为业绩核心驱动力。 本季度通用会计准则与非通用会计准则毛利率均达 75%，GAAP摊薄每 股收益2.46美元，非GAAP摊薄每股收益2.22美元。英伟达给出三季 度指引，预期营收1080亿美元（浮动±2%），该预期未计入中国区数 据中心算力业务收入，毛利率预期 74%。二季度公司通过回购与分红向 股东返还260亿美元，剩余回购授权额度 990亿美元。英伟达首席财务 官Colette Kress称，英伟达明年业绩增速将加快，预计 2028财年营收增 长70%。她另外表示， “即便在我们的现有规模下，需求仍在加速增长。 客户预测显示，我们明年的增长将实现翻倍”。 特朗普签行政令：电池储能系统被纳入禁令清单 。8月26日，美国总统 特朗普签署 《宣布国家紧急状态以保障美国大型电力系统安全》 行政令。 大型变压器、发电机和断路器之外，电池储能系统（ BESS）、并网逆变 器，以及服务于关键基础设施的不间断电源，首次被明确列入这类国家 安全审查。这意味着，中国储能产品进入美国，面对的不再只是关税和 税收抵免限制。 美国政府将拥有更直接的行政权力， 决定产品能否进口、 能否部署、能否继续运行。目前看，行政令直接针对储能系统、逆变器 等大型电力系统设备，没有单独点名电芯，也没 有宣布禁止全部中国储 能产品。具体实施规则，将在未来 120天内由美国能源部制定。 风险提示：相关政策执行力度不及预期、相关技术迭代不及预期、安全 事故影响开工、原料价格巨幅波动、下游需求不及预期。 维持 强于大市 杨晖 yanghui1@csc.com.cn SAC 编号:S1440525120006 郑轶 zhengyi1@csc.com.cn SAC 编号:S1440526030007 王鲜俐 wangxianli@csc.com.cn SAC 编号:S1440526030003 吴宇 wuyu1@csc.com.cn SAC 编号:S1440526030001 陈俊新 chenjunxin@csc.com.cn SAC 编号:S1440526030009 申起昊 shenqihao@csc.com.cn SAC 编号:S1440526030008 发布日期： 2026年08月30日 相关研究报告 26.08.24 【中信建投基础化工】:出口旺季来临， 本周硅片大涨；SK海力士宣布大额回购计划 26.08.23 【中信建投基础化工】:超强厄尔尼诺强化粮价上涨潜力和农资需求 26.08.22 【中信建投基础化工】:7月化工出口数据分析：同比增速放缓，石化板块表现突出 26.08.17 【中信建投基础化工】:欧盟强制掺混SAF政策持续兑现 26.08.17 【中信建投基础化工】:化工逐渐进入旺季，关注Q3环比改善的板块和个股 基础化工 下载日志已记录，仅供内部参考 基础化工 行业动态报告 请务必阅读正文之后的免责条款和声明。 目录 化工新材料行业更新 ........................................................................................................................................................................... 1 化工新材料子行业信息更新 ............................................................................................................................................................ 10 1. 行业跟踪：新能源材料：特朗 普签行政令：电池储能系统被纳入禁令清单 .................................................... 10 2. 行业跟踪：消费电子材料：苹果折叠屏 iPhone首年出货有望破千万，折叠屏产业链迎来放量拐点 ..... 14 3. 行业跟踪：机器人前沿材料：行业级四足机器人企业获国资近亿元注资 ........................................................ 15 4. 行业跟踪：氢能：五大城市群试点获批且 80亿奖补力促全链条应用 ............................................................... 17 5. 行业跟踪：纯化过滤材料：久吾高科提锂专利获省级表彰且牵头行业标准筑牢壁垒 .................................. 20 6. 行业跟踪：半导体材料：英伟达 Q2业绩大超预期驱动AI算力高景气延续 .................................................. 23 7. 行业跟踪：合成生物学：本周赖氨酸、苏氨酸、缬氨酸市场整体承压运行 .................................................... 27 8. 行业跟踪：再生及可降解材料：长荣航空扩大 SAF合作，企业减排需求加速释放 ..................................... 35 风险分析..................................................................................................................................................................................... 做多动能边际收 敛，止盈诉求升温。本周 10Y国债利率上行0.5bp至1.69%，30Y国债收益率上行1.5bp至2.19%。 债市展望：近期债市多空力量博弈加剧，短期来看，利率缺乏趋势性下行的催化，做多赔率有所收窄，预计维 持窄幅震荡格局。后续建议重点跟踪四方面变量：一是央行对长端单边下行的容忍度与潜在调控；二是交易盘 拥挤度与止盈兑现压力；三 是9月政府债供给放量对资金面的边际扰动；四是财政货币增量政策的落地节奏。 三、美股：主要指数小幅收涨，半导体与小盘股逆势下跌 。 美股回顾：本周美股主要指数小幅收涨，标普 500上涨0.49%，收复上周跌幅的三分之一，道琼斯上涨 0.53%，纳斯达克综合指数上涨 0.85%。利率敏感板块下跌，罗素 2000下跌1.51%、收在7月以来低位，费城 半导体指数下跌2.31%。等权重标普500全周下跌0.44%。 板块上，通信服务上涨 1.43%、信息技术上涨1.30%、金融上涨1.08%居前，其余八个板块下跌，医疗保健下 跌1.98%、工业下跌1.73%、能源下跌1.51%、地产下跌1.33%居后。本周有两条主线。一是英伟达预计 2028 下载日志已记录，仅供内部参考 请务必阅读正文之后的免责条款和声明。 宏观经济研究 宏观动态报告 财年收入增长约70%、远高于市场此前约 45%的预期。软件股受赛富时业绩与指引带动集体修复，赛富时全周 上涨22.4%。二是美联储主席杰克逊霍尔讲话：周五短端利率跳升，小盘股与半导体承压。能源板块跟随油价 回落，布伦特全周下跌 5.4%至每桶89.31美元，霍尔木兹海峡临时通道谈判与对伊朗制裁力度不及措辞是主要 原因。 美股展望：我们预计短期内美股维持震荡，定价的主导变量转向美联储货币政策路径。杰克逊霍尔 讲话后9月 加息的隐含概率升至五成以上， 9月11日的8月CPI数据与9月15日至16日的议息会议是接下来的两个验证 点，若通胀读数偏强，利率敏感的小盘股与高估值成长股承压更明显。英伟达的指引把人工智能硬件链的盈利 预期上修，但市场对供应商为客户融资的讨论并未消退，业绩后次日的回落显示获利了结压力仍在。财报季接 近尾声，标普500成分公司本季盈利同比增长接近 32%，盈利仍是指数的主要支撑。 四、境外利率：本周美债短端跳升、长端回落 。 本周境外利率汇率回顾 ： 美联储主席沃什在杰克逊霍尔的首次讲话把定价压力从长端移回短端，曲线明显平坦化。全周 2年期上行10 个基点至4.34%，10年期下行1个基点至4.73%，30年期下行5个基点至5.22%，30年期与2年期的利差从 103个基点收窄至88个基点。 周初油价回落与财政部或动用一般账户现金支持长债回购的报道推动收益率下行，周二 30年期收在5.17%、 为8月5日以来低位。周五主席讲话称通胀数据“令人担忧”、 2%目标“坚定且固定”、当前金融条件不具 约束性、利率是实现使命的主导工具， 2年期单日上行14个基点，9月加息的隐含概率从约35%升至约58%。 本周非美发达经济体债券收益率多数上行，其中英债上行约 4BP至5.07%，德债上行约2BP至3.27%，日债上 行约5BP至2.93%。 境外利率展望： 美债：沃什讲话明确了7月会议缺失的政策反应函数，短端利率重新成为通胀上行风险的释放阀，长端压力获 得一定程度的释放，这一格局能否延续取决于后续数据与政策的跟进。我们预计 8月核心通胀环比仍在 0.2% 附近、9月大概率按兵不动，但若 8月物价数据偏强，加息的可能性已经打开。若通胀超预期而 9月美联储再 次按兵不动且不作清晰解释，曲线存在重演 7月会议后长端抛售的风险 。 非美利率：短期内，中东局势延续紧张态势，能源价格维持高位，叠加全球财政压力上升，主要发达经济体长 端收益率仍面临上行压力。但部分央行降息预期及经济数据分化，可能限制收益率进一步快速上行。 五、汇率：Jackson Hole偏鹰后美元反弹，非美货币普遍承压 。 本周汇率回顾：本周外汇市场整体呈现 “前半周美元偏弱、Jackson Hole后美元快速反弹”的格局。美元指数周 初延续弱势，在98.8—99.2区间震荡，市场继续交易财政端压制长端利率、弱美元和黄金走强的逻辑。但周五 下载日志已记录，仅供内部参考 请务必阅读正文之后的免责条款和声明。 宏观经济研究 宏观动态报告 Jackson Hole会议释放偏鹰信号，市场重新上修美联储加息预期，美元指数快速拉升至 99.7附近，日内涨幅超 过0.5%。整体来看，美元并未延续此前单边下行，反而在关键会议后重新回到 99.5上方，说明市场对“弱美元 交易”仍缺乏一致性，美元短期重新回到区间震荡状态。 汇率展望：美元指数短期可能继续围绕 100上下震荡。若市场继续上修美联储加息预期，美元仍可能挑战 100 关口，黄金和高Beta非美货币将继续承压；但若后续数据重新显示美国增长放缓，美元反弹可能更多是 Jackson Hole后的短线修正，而非新一轮趋势上行。人民币方 面，重点观察中间价是否继续向 6.78下方调整。 如果中间价保持克制，人民币即便受益于美元走弱，升值斜率也会有限；如果中间价明显下调，则可能打开 USDCNH向6.70下方运行的空间。 六、商品市场：基本面支撑铜价逆势。 本周大宗商品回顾： 本周杰克逊霍尔年会沃什鹰派首秀再次改变了市场对美联储的定价 ——9月加息概率从约35%飙升至约50- 60%，年内至少一次加息几乎被完全定价， 2年期美债收益率创2009年以来最鹰的杰克逊霍尔反应，这意味着 \"更高利率\"重新成为大宗商品的定价核心变量。 黄金在经历了8月上旬以来的暴力反弹后，进入高位震荡回调阶段，结束了此前连续三周的强劲上涨势头。 本周铜市在\"矿端紧缺、非美低库存、关税虹吸 \"三重基本面支撑下高位震荡偏强，周五沃什鹰派讲话落地后， 宏观压制有所增强，但铜的基本面韧性使其抗跌性强于黄金等纯金融属性资产。 本周原油市场属于高位技术性回调和地缘风险溢价回吐的一周。在美伊冲突降温的背景下，油价自上周高点回 落约4%-5%，但供应偏紧、库存低位的基本面仍为油价提供了较强支撑，后半周价格企稳回升。 全球大宗商品展望： 黄金：沃什讲话已为加息打开窗口但保留弹性，黄金短期面临 流动性逆风或转向震荡，但中长期多头逻辑（美 元信用弱化、央行购金、财政担忧）未被破坏。 原油：美伊博弈短期难有定论，油价大概率维持高位宽幅震荡格局。 铜：9月的决策窗口，美国铜关税政策落地节奏仍是主导全球铜贸易流向的核心变量。若落地将支撑铜价，若 延期/豁免则前期囤货逻辑证伪、铜价存回调压力。 下载日志已记录，仅供内部参考 请务必阅读正文之后的免责条款和声明。 宏观经济研究 宏观动态报告 目录 一、大类资产价格的表现 .................................................................................................................................................................. 1 （一）A股 .................................................................................................................................................................................... 1 （二）港股 .................................................................................................................................................................................... 2 （三）美股 .................................................................................................................................................................................... 2 （四）中债 .................................................................................................................................................................................... 3 （五）海外利率 ........................................................................................................................................................................... 4 （六）汇率 .......................................................................... 元，主因行业供需失衡、成本及汇兑等压力。公司加速海外拓展，BC组件销量同比增125%，并推进光储一体化及储能业务。 今日行情：上证综指：+0.86%；沪深300：+0.35%；光伏行业指数：-3.43%#文字观点", "publish_time": "2026-09-01 08:53", "tags": ["文字观点"]}, "post:2026-09-01T08-58:0313ad2ee547": {"id": "post:2026-09-01T08-58:0313ad2ee547", "kind": "post", "title": "2026-09-01 08:58", "source_label": "帖子正文", "excerpt": "伯恩斯坦——阳光电源（300274）：历史表明应趁恐惧买入。特朗普总统第14420号行政令加剧了市场对阳光电源美国公用事业相关电力设备业务的担忧，但未必意味着彻底禁令。", "content": "伯恩斯坦——阳光电源（300274）：历史表明应趁恐惧买入。 特朗普总统第14420号行政令加剧了市场对阳光电源美国公用事业相关电力设备业务的担忧，但未必意味着彻底禁令。这并非美国首次试图保护大容量电力系统免受所谓外国威胁——六年前的第13920号行政令基于类似国家安全理由，最终造成的商业干扰有限，限制主要集中在国防相关应用而非更广泛的电力市场，此后中国对美电力设备出口仍持续增长。未来120天内美国能源部（DOE）的规则制定将决定最终商业影响。当前估值已充分反映美国业务显著恶化的预期：伯恩斯坦估算美国贡献约20%营收和27%毛利；在完全退出美国的极端情景下，估值仅降至每股90余元区间，与当前股价基本持平。基准情景假设阳光电源在更严格监管下仍可继续进入美国市场。伯恩斯坦将目标价从185元下调至151元，但维持\"跑赢大盘\"评级。8月27日收盘价98.84元，较目标价有53%的上行空间。 行政令对比与历史经验 2020年5月的第13920号行政令与2026年8月的第14420号行政令在底层逻辑上几乎一致：均将外国行为体描述为日益利用美国大容量电力系统漏洞，均强调电力基础设施对国家安全的重要性，均认为外国设备可能带来网络安全和运营风险。区别在于，14420号行政令覆盖范围更广——明确将电网连接逆变器、PCS（储能变流器）和电池储能系统纳入，对阳光电源更具实质影响。此外，新行政令赋予DOE更大权限，可将条件强加于已安装设备，规则制定期限从150天缩短至120天，并更明确推动美国本土制造能源基础设施。 但历史经验表明，行政令本身并不决定最终结果。2020年行政令虽建立了类似国家安全框架，实际影响有限：DOE并未禁止所有中国变压器或电力设备进入美国，限制仅适用于为指定国防设施服务的少数公用事业公司。2021年拜登政府上台后该行政令被暂停，相关禁令三个月后被撤销，一年后紧急状态到期，从未实施全国范围禁令或大规模设备更换。此后中国电力变压器对美出口量仍持续增长。伯恩斯坦认为，14420号行政令面临与2020年相同的结构性制约：美国仍需大量电力基础设施投资，国内制造产能仍在建设中，能源转型供应链仍高度依赖全球采购。在DOE发布详细实施指引前，不宜假设重大财务影响。 美国业务风险敞口与情景分析 阳光电源美国业务风险集中在大型逆变器、PowerTitan储能系统和PCS产品（连接69kV及以上输电网络的设备），而工商业和户用产品因连接配电网受影响较小。伯恩斯坦估算美国占阳光电源逆变器出货量的约15%、储能出货量的约32%，且美国项目定价和利润率高于平均水平（逆变器ASP溢价25%、毛利率溢价8个百分点；储能ASP溢价15%、毛利率溢价5个百分点）。由此推算，美国贡献约182亿元营收（占集团21%）和约77亿元毛利（占集团27%）。 情景分析显示：即使美国收入减少50%，集团营收仅下降约10%，毛利下降约14%；完全退出美国将使营收下降约21%、毛利下降约27%，集团毛利率从32%压缩至29%。在完全退出情景下，2025-2030年营收CAGR从基准的11%降至6%，净利润CAGR从12%降至3%，DCF估值从151元降至96元。但伯恩斯坦强调，这仅是压力测试而非基准预期。管理层认为现有产品仍有多年销售窗口期，美国业务更可能逐步萎缩而非突然消失。 2026年二季度业绩：喜忧参半，下半年有望走强 上半年营收309亿元（同比-29%），二季度营收约154亿元，低于市场共识预期的243亿元，主因中国光伏需求疲软及中东大型储能项目交付减少。但盈利能力大幅超预期：二季度毛利率39%（共识预期29%），净利润约30亿元与共识基本持平。二季度毛利率环比从33%升至38%，净利率从14%升至19%。 订单可见度改善：合同负债升至117亿元（约合年化营收的19%），存货增加49亿元（为下半年交付备货）。历史上合同负债是阳光电源营收的强领先指标，当前水平与管理层\"全年交付严重后倾\"的预期一致——超过60%的年度储能发货量安排在下半年。 分业务看：逆变器上半年出货66GW（去年同期76GW），营收108亿元，盈利能力因海外占比提升而改善。储能上半年出货25GWh（同比+28%），但营收降至154亿元（同比-13%），因中东项目贡献减弱及行业定价下降；储能毛利率从一季度的约30%升至二季度的35%。 管理层展望 FCC设备限制方面，现有认证产品可继续销售，主要影响未来产品认证和新机型审批。管理层认为美国产品更新周期较慢，当前产品可维持多年销售窗口。 14420号行政令方面，管理层指出许多光伏和储能项目连接电压为13.8kV和34.5kV，不属于输电级别，可能不在行政令直接范围内。最终影响取决于DOE如何界定配电网资产与大容量电力系统的边界。公司计划通过加速欧洲、亚太、拉美和分布式能源市场增长来降低对美国依赖，并探索与海外供应商合作的替代路径。 AIDC（AI数据中心）机遇方面，管理层极为看好，预计相关需求未来数年年增速超100%。公司已获约2GWh数据中心储能订单，潜在管道超10GWh。产品涵盖数据中心储能部署和固态变压器（SST）等电力基础设施。SST已有数台交付客户，预计四季度投入商业运营，35kV平台原型预计2027年完成，2027年为小规模商用验证年，2028-2030年 broader 商业化。 毛利率方面，逆变器毛利相对稳定，大型储能毛利因项目周期变长、锂价波动和竞争而趋势性下行，但竞争已开始缓和，部分弱势竞争者退出，预计还需1-2年行业整合。 储能出货方面，上半年25GWh不足全年交付量的40%，隐含全年出货约63-70GWh。欧洲储能需求预期上调至2026年74GWh，未来三年年增速预计超50%。超过60%的全年储能发货将在下半年完成。 盈利预测与估值 伯恩斯坦下调盈利预测以反映光伏需求走弱和储能定价压力加大，同时WACC从8.6%下调至8.2%。目标价从185元降至151元，基于DCF估值（WACC 8.2%，永续增长率2%）。当前股价对应约12倍2027年市盈率，处于历史低位。2025年实际EPS 6.55元；2026年预期从8.22元下调至6.93元；2027年预期从9.33元下调至7.95元。 主要风险 下行风险：AI支出削减导致储能需求放缓；美国关税进一步提高；库存高企和毛利率压力；行业碎片化及价格敏感导致市场份额流失；针对中国供应商的政策转向。#文字观点", "publish_time": "2026-09-01 08:58", "tags": ["文字观点"]}, "attachment:files/东方金属18讲  镁：奇点已至，镁业腾飞 - 晨起半小时，迎接金九银十.docx": {"id": "attachment:files/东方金属18讲  镁：奇点已至，镁业腾飞 - 晨起半小时，迎接金九银十.docx", "kind": "attachment", "title": "东方金属18讲 镁：奇点已至，镁业腾飞 - 晨起半小时，迎接金九银十", "source_label": "东方金属18讲  镁：奇点已至，镁业腾飞", "excerpt": "1. 镁行业核心观点与驱动逻辑：镁合金渗透率提升，镁价中短期低位窄幅震荡 行业整体观点：中短期镁价围绕相对低位窄幅波动，预计镁锭价格区间为15500-16500元/吨；核心投资建议是关注镁合金渗透率提高的逻辑，而非镁价本身的弹性。", "content": "1. 镁行业核心观点与驱动逻辑：镁合金渗透率提升，镁价中短期低位窄幅震荡 行业整体观点：中短期镁价围绕相对低位窄幅波动，预计镁锭价格区间为15500-16500元/吨；核心投资建议是关注镁合金渗透率提高的逻辑，而非镁价本身的弹性。 渗透率提升的双重驱动 成本端：镁的成本较低，带来高性价比（当前镁铝比长期维持在0.7~0.75左右，显著低于1.5的性价比阈值）。 技术端：半固态成型设备及工艺取得明显进步，解决了传统镁合金压铸的耐腐蚀性差、成型精度低、延伸率不达标等核心痛点。 当前阶段判断：镁合金在下游应用处于渗透率提高的起点，仍在量变阶段，尚未达到因渗透率提升驱动镁价大幅上行的质变阶段。 中长期展望：往后看3-5年，随着镁合金压铸需求从量变到质变演变，可能推动镁价出现抬升；但当前仍维持窄幅波动态势。 2. 当前镁价基本面：供给收缩后温和复产，需求淡季疲弱，成本端构筑底部支撑 价格表现 7月至今，国内镁价（以陕西主流出厂价为基准）在15700-16000元/吨区间窄幅运行，后续窄幅波动态势预计延续。 供给端：7月大幅收缩，9月起温和复产 7月国内镁锭产量约95000吨，较6月的104500吨环比下降约9%，降幅较大。 产量收缩的两大原因： 主产区陕西府谷县、神木县企业集中安排淡季设备检修，日均产出降幅较大。 镁锭价格长期低位，高成本企业冶炼亏损持续扩大，不少工厂主动借检修下调生产负荷。 复产进度：8月上旬起府谷、神木主产区冶炼厂陆续恢复生产，但截至8月底9月初复产体量仍不大，后期检修产能将进入复产通道；按6-7月减量幅度计算，9月后日均产出环比有近10个点的增长空间，但受价格偏低影响，复产意愿不强，产量回升偏温和。 需求端：内需、出口同步疲弱 国内下游核心应用为汽车和3C电子（合计占镁合金需求超60%），8月15日前镁合金加工企业开工率不高，主动囤货意愿匮乏。 7月国内镁合金总产量仅约39000吨，环比6月下降约9%。 7月国内镁产品出口总量约35000吨，环比6月下降约12%；海外终端客户多为价格接受方，“买涨不买跌”心态更显著。 成本端：底部支撑明确 镁锭成本核心为白云石原料成本和煤炭能源成本，当前两者对价格底部支撑均较为明确。 综合判断：当前镁价呈典型周期类金属摸底阶段特征，长周期维持在行业生产成本线附近窄幅波动，原料成本端已到底部区间，向下无大幅跌幅空间。 3. 镁合金渗透率逻辑的核心变量：成本性价比 + 技术工艺两大历史痛点正被解决 历史渗透率提升缓慢的两大阻碍 成本波动剧烈：2020-2021年新能源汽车放量期间，镁价从17000-18000元/吨最高涨至接近70000元/吨，涨幅超过3倍，远超铝价，导致镁合金相对铝无竞争优势。 2024年底的现状差距：新能源汽车领域单车用镁量平均仅约10公斤，而单车用铝量约220公斤，铝用量为镁的20倍以上。 技术缺陷：镁表面无法像铝一样自然形成致密氧化膜，耐腐蚀性较差；2022-2023年以前镁合金主要局限于汽车密闭结构件。传统铝合金压铸工艺用于镁合金会产生夹杂和气孔多、后期成型和热处理困难等问题。 4. 核心边际变化之一：镁铝比降至历史性低位，性价比逻辑进入质变窗口 镁铝比的边际变化 当前镁铝比长期维持在0.7~0.75左右，阶段性甚至更低；而此前最高接近3。 铝价受国内产能天花板约束及海外电力成本高企支撑，处于历年相对高位；镁价则处于低位，形成剪刀差。 性价比的量化测算 关键是镁铝比低于1.5时，镁具备明显性价比：镁密度比铝低三分之一，同样体积零部件用镁重量更低，叠加价格更低，双重降重+降本。 以压铸电机外壳为例： 按铝价21000元/吨、镁价23000元/吨的保守假设测算，镁合金材料成本比铝合金低约30%；叠加模具摊销、电耗、人工等综合优势，镁合金综合成本低约20%。 若按当前价格水平（原文为镁价16000元/吨、铝价24000元/吨）测算，降本幅度接近40%。 由此，2025年上半年至今，镁的性价比优势已明显打开，成为去年下半年至今下游汽车零部件工厂增加镁合金下单的核心原因。 5. 核心边际变化之二：半固态注射成型技术突破 + 大型设备吨位跃升 半固态注射成型工艺的核心突破（2025年四季度至今持续进步） 耐腐蚀性改善：通过原料注射端的配方改善，直接影响镁合金表面耐腐蚀性能。 力学性能改善：通过设备大型化及压铸过程改善，相较传统压铸，抗拉强度、延伸率等力学性能明显提升。 代表型号的性能对比 国内当前应用较多的镁合金型号AZ91D（可在宝武镁业展厅/工厂看到），实际应用表现已优于最传统的压铸铝合金型号ADC12。 实验室层面：上海交大研发的KT系列半固态镁合金数据已明显优于铝合金ADC12性能。 大型设备的边际进展 截至2025年下半年，国内外头部半固态成型设备厂商制造设备吨位普遍达到3000吨以上；而2023年以前1000~2000吨已属大吨位。 大吨位设备直接支撑大尺寸、多种类镁合金压铸件的生产能力。 产品结构升级的印证（以相关厂商展厅为例） 2021-2022年以前：产品以小件、薄壁件为主，如汽车中控支架等，普遍重量在1公斤以内。 当前：大型压铸件占比显著提升，包括车门门板、仪表盘大骨架、驱动电机外壳（原重量20-30公斤）等，价值量和利润率均有明显提升。 6. 需求端领域之一：新能源汽车——降本诉求驱动单车用镁量提升，测算空间接近翻倍 需求占比结构 汽车占镁合金下游应用的70%；镁合金占原镁总需求的50%，折算汽车镁合金占原镁需求约40%；叠加3C电子后合计占比约50-60个点。 镁合金最核心用途即替代铝合金，驱动来自轻量化和成本的双重诉求。 自行车用镁量提升空间 行业协会《节能与新能源汽车技术路线图》给出2031年单车用镁量提升幅度至7~45公斤，相较当前水平有接近翻倍的增长空间（当前单车约10公斤）。 需求总量测算 假设全球新能源汽车渗透率到2030年达到35%~40%（中性假设），新能源汽车领域镁合金需求从当前的约100万吨增至2030年约400万吨，增幅接近4倍，核心假设在于单车用量的显著提升，仍在持续跟踪过程中。 7. 需求端领域之二：人形机器人——减重刚需场景，镁合金为刚需材料 减重需求显著高于新能源汽车 数据依据：人形机器人重量每降低10%，能耗可减少5.5%。 从各家主机厂产品代际迭代（1代、2代、3代）看，重量均较前一代大幅降低，包括特斯拉及国内宇树、优必选等产品。 镁合金的适配性能 除减重外，镁合金的导热散热、减震、电磁兼容等性能更契合人形机器人需求；相比新能源汽车，镁合金对人形机器人更属于刚需。 主流主机厂的镁合金应用实例 特斯拉：旋转关节壳体、膝关节自身结构。 小鹏Iron机器人：脊椎骨盆、腿部框架。 智元、宇树：腰部、足部结构均采用镁合金材料。 需求体量测算（中性假设） 单台人形机器人用镁合金12公斤： 100万台出货量对应需求仅1.2万吨，对整体需求盘拉动有限。 1亿台出货量对应需求达120万吨（非常远期）。 投资含义：即便100万台出货量对总量拉动不大，头部镁合金零部件厂商有望率先受益于订单释放。 8. 量变到质变的关键变量与风险点 尚需跟踪的关键制约因素 2026年上半年，国内鲜中美工厂发生生产安全事故，目前仍在恢复过程中。 该事件导致下游企业对镁合金行业存在一定疑虑，是尚未出现质变级别放量的可能原因之一；整体工艺仍有进步空间。 渗透率大方向不会改变，性价比逻辑与技术迭代均处于量变积累过程中。 9. 相关企业分析 宝武镁业 拥有可展示AZ91D型号应用成果的展厅/工厂，技术端具备直接可见的验证载体。 拥有直接对接下游汽车零部件厂商的子公司。 定位：量增过后，中期维度具有镁价弹性预期的核心标的。 轩业众宇 产品结构已由2021-2022年以前的1公斤以内小件、薄壁件切换为当前以大型压铸件为主，包括车门门板、仪表盘大骨架、驱动电机外壳（20-30公斤级），价值量与利润率均有明显提升。 选手们 与宝武镁业为同赛道标的；量增阶段核心看点在于与下游新能源汽车零部件厂商的合作及放量节奏更快。 两公司多数时候呈同涨同跌特征，均值得中长周期维度关注，产业大逻辑未变。", "status": "extracted"}, "post:2026-09-01T08-53:7a2caf0ec73a": {"id": "post:2026-09-01T08-53:7a2caf0ec73a", "kind": "post", "title": "2026-09-01 08:53", "source_label": "帖子正文", "excerpt": "光通信液冷，光互联速率跃迁下不容忽视的散热新方向 🎉我们看好AI算力集群扩容的beta下，受益液冷渗透率提升+新技术演进的光通信散热赛道的高成长性，大陆供应链切入机会更大，建议关注光模块VC、液冷Cage及共封装交换机液冷机会。🌹光通信部件具有较强的液冷需求。", "content": "光通信液冷，光互联速率跃迁下不容忽视的散热新方向 🎉我们看好AI算力集群扩容的beta下，受益液冷渗透率提升+新技术演进的光通信散热赛道的高成长性，大陆供应链切入机会更大，建议关注光模块VC、液冷Cage及共封装交换机液冷机会。 🌹光通信部件具有较强的液冷需求。光模块中的激光器、调制器、驱动芯片、DSP等核心器件对温度较为敏感，高温不仅会影响器件效率和传输性能，也可能降低信号稳定性、使用寿命及系统可靠性。随着光模块速率持续由 400G向 800G、1.6T及更高速率升级，单模块功耗不断提升，传统风冷散热能力逐步接近边界，VC均热板、液冷Cage及交换机液冷等方案的重要性持续提升。 🌹光通信液冷是兼具需求增长和单位价值量提升的高斜率赛道。一方面，AI算力集群持续扩容，scale-out、scale-up及scale-across共同驱动光互联需求增长，光通信行业具有较强的Beta；另一方面，光通信液冷渗透率提升的同时，光模块向更高速率演进，以及NPO、CPO、XPO等新技术出现，也将推动光通信散热空间持续增长。我们预计，光模块VC市场 2027 年有望达 50.3 亿元，同比+257.4%，液冷cage市场则同时受益于光模块出货量增长、液冷渗透率提升及单端口价值量增加，具备更高的弹性，2027 年光模块液冷cage市场空间为 125 亿元，同比+776.5%。 🌹大陆供应商具备切入光通信液冷供应链的较大机会。 光模块领域，大陆光模块产业链具备较强的制造和产业集群优势，因此大陆散热部件厂商更容易依托客户协同、快速响应和成本控制能力导入光模块VC、TIM等部件。光模块Cage领域，其生态相对开放，大陆厂商在风冷Cage时代已经切入部分海外头部连接器供应链，液冷时代有望沿用既有供应关系和制造能力，同时光模块cage属于人工密集型产业，大陆厂商优势明显 🎉我们推荐光模块VC卡位领先，NPO、TIM材料有望贡献新增长的中石科技，建议关注布局光模块VC和服务器液冷的思泉新材。#文字观点", "publish_time": "2026-09-01 08:53", "tags": ["文字观点"]}, "post:2026-09-01T14-43:464ed634185b": {"id": "post:2026-09-01T14-43:464ed634185b", "kind": "post", "title": "2026-09-01 14:43", "source_label": "帖子正文", "excerpt": "【国盛电子】东山精密：光芯片+光模块平台化龙头腾飞 光芯片+光模块业务整合效应显现，新增产能和新客户的导入大超预期。索尔思已打入m，n，o，a等多家北美一线龙头客户，x等新客户进展十分顺利，NPO/CPO也已经拿到北美客户订单，光芯片净利润率预期高达50%以上。", "content": "【国盛电子】东山精密：光芯片+光模块平台化龙头腾飞 光芯片+光模块业务整合效应显现，新增产能和新客户的导入大超预期。索尔思已打入m，n，o，a等多家北美一线龙头客户，x等新客户进展十分顺利，NPO/CPO也已经拿到北美客户订单，光芯片净利润率预期高达50%以上。光模块利润率30％以上，在手订单充沛，显著增厚当期利润。同时布局eml+cw，目前已与外部硅光企业开展合作并布局自研硅光模块产品，后续技术方案坚持EML与硅光双路线并行。 我们预期东山今年四个季度业绩预期一季比一季更强，下半年斜率比上半年更加陡峭，产能逐渐爆发！索尔思拥有稀缺的EML光芯片+光模块IDM一体化能力，可量产100G/200GEML光芯片，在高端光芯片供给紧缺环境下，具备产能调配与交付响应优势。 追加5亿美元扩建，光芯片+光模块项目投资上调至17亿美元。当前索尔思光电现有光芯片与光模块产能已难以匹配行业景气度及下游客户需求。本次产能扩建将有效弥补产能缺口，支撑下游客户中长期大规模采购需求。 我们重申东山精密做为唯一一家光芯片+光模块的龙头公司，扩产后产能预期超过北美龙头。目前明年对应的PE仅为10x出头，较同行业相比仍为最便宜的光芯片公司，继续强call! 风险提示：下游需求不及预期#文字观点", "publish_time": "2026-09-01 14:43", "tags": ["文字观点"]}, "post:2026-09-01T21-03:0beb60844006": {"id": "post:2026-09-01T21-03:0beb60844006", "kind": "post", "title": "2026-09-01 21:03", "source_label": "帖子正文", "excerpt": "❗️中报数据跟踪01：光测试半年报分析：Q2下游资本开支增速高达500%，采样示波器+KGD技术壁垒深厚【天风机械】 行业空间：AI 算力驱动光模块厂商加速扩产，光通信测试需求进入高增通道。我们测算 800G/1.6T/3.2T 光模块出货量将从 2025 年的 2500 万台增至 2028 年的 ", "content": "❗️中报数据跟踪01：光测试半年报分析：Q2下游资本开支增速高达500%，采样示波器+KGD技术壁垒深厚【天风机械】 行业空间：AI 算力驱动光模块厂商加速扩产，光通信测试需求进入高增通道。我们测算 800G/1.6T/3.2T 光模块出货量将从 2025 年的 2500 万台增至 2028 年的 2.3 亿台，#对应光通信检测仪器市场空间从2025年的44亿元增至2028年的396亿元，其中采样示波器市场空间从 19 亿元增至 214 亿元，26-28 年复合增速超过 120%；KGD分选设备受益于光芯片测试需求放量，#2028年全球需求约2800台、市场规模达70亿元。 景气验证：下游资本开支与半年报数据同步印证行业高景气：26Q2 光模块环节资本开支同比 +413%、光芯片同比 +535%，光测试设备板块 26H1 营收 +62%、归母净利 +148%，合同负债 +159%、毛利率升至 50.9%，订单与盈利质量同步改善，扩产信号明确。#半年报重点数据：1)下游资本开支统计：26上半年 光模块资本开支同比 +413%，Q2扩产加速；2）板块合同负债同比增速高达159%，其中联讯+罗博特科的合同负债占行业60%+；3）光测试设备 26H1 扣非归母净利润率达到16%、同比+8pct；4）光测试设备 26H1存货同比增长53%。 格局与标的：上游 IC 芯片占示波器成本近 40%，是国产替代的核心壁垒。联讯仪器为国内唯一具备 50GHz 以上采样保持芯片自主设计能力的企业，研发强度约 25%，显著高于是德科技的 19% 和安捷伦的 7%，对标是德科技光通信测试口径（收入占比约 25%-30% 且快速上升）最具可比性，高端示波器国产替代正加速落地， 重点标的：#我们测算板块标的普遍具备30-50%的赔率空间，建议重点关注：联讯仪器、罗博特科、华盛昌、优利德、鼎阳科技等。#文字观点", "publish_time": "2026-09-01 21:03", "tags": ["半年报重点数据", "文字观点"]}, "post:2026-09-01T13-00:418470cb336a": {"id": "post:2026-09-01T13-00:418470cb336a", "kind": "post", "title": "2026-09-01 13:00", "source_label": "帖子正文", "excerpt": "【东吴电子陈海进】超节点深度报告新发 —— 回归算力 + 超节点产业趋势 国产算力：从 \"缺卡\" 到 \"高效用卡\"，系统组织能力成关键#需求端：DeepSeek V4、质谱 等国产大模型商业化放量，日均 Token 调用量突破 140 万亿，智能算力规模 2026-2028 年维持约 40% 年增速", "content": "【东吴电子陈海进】超节点深度报告新发 —— 回归算力 + 超节点产业趋势 国产算力：从 \"缺卡\" 到 \"高效用卡\"，系统组织能力成关键#需求端：DeepSeek V4、质谱 等国产大模型商业化放量，日均 Token 调用量突破 140 万亿，智能算力规模 2026-2028 年维持约 40% 年增速，国产算力需求持续释放。#供给端：国产加速卡缺口逐步缓解（2025 年国产算力卡出货约 165 万张、份额约 41%），主要矛盾转向系统级组织能力，Scale Up 高带宽域 + 整柜液冷 / 供电工程成为释放有效算力的关键。 超节点：AI 算力基建核心形态，国产算力破局之策 超节点通过高带宽、低时延的 Scale Up 互联，把数十至数百张加速卡组织成一个逻辑计算体，直击大模型训练中的通信墙、功耗墙和复杂度墙。全球 AI 算力架构加速向超节点切换，英伟达 GB200 NVL72 确立整柜级标杆的同时，国内华为昇腾 384、中科曙光 scaleX 万卡超集群、阿里磐久 128 等自研超节点密集落地，2026 年 2 月中科曙光全国首个 3 万卡国产 AI 算力池上线、华为昇腾 384 已规模化部署超 500 套，国产算力正从分布式集群加速迈向高密度系统级架构。 产业 β：超节点重塑服务器价值链，整柜交付与互联环节价值跃升 超节点把竞争从单卡性能推向整柜协同，高速互联、交换芯片、连接器、铜缆/光互联、液冷、供电及整柜交付的重要性全面提升。国产算力扩容叠加超节点渗透率提升，有望共同打开新一轮产业链成长空间。 超节点集群深度研究报告链接：【东吴电子陈海进】超节点集群深度——超节点方案重塑AI算力产业趋势，开启系统级算力新周期⚠️风险提示：市场需求，竞争，地缘政治风险等 深度跟踪【华勤技术】【盛科通信】【寒武纪】【海光信息】【壁仞科技】【摩尔线程】#文字观点", "publish_time": "2026-09-01 13:00", "tags": ["需求端", "供给端", "文字观点"]}, "post:2026-09-01T14-55:a1c62982a7aa": {"id": "post:2026-09-01T14-55:a1c62982a7aa", "kind": "post", "title": "2026-09-01 14:55", "source_label": "帖子正文", "excerpt": "📌三星的 zNAND‑O 看起来很棒📊拥有 10 倍 DRAM 位密度，对比传统闪存，具备 7 倍更高的读取带宽，同时拥有 7 倍更出色的读取功耗效率。💾3D NAND 可以为 HBM 分担大量内存容量压力，尤其适用于推理工作负载，这类场景当中，并不是全部数据都需要达到 HBM 级别的延迟。", "content": "📌三星的 zNAND‑O 看起来很棒📊拥有 10 倍 DRAM 位密度，对比传统闪存，具备 7 倍更高的读取带宽，同时拥有 7 倍更出色的读取功耗效率。 💾3D NAND 可以为 HBM 分担大量内存容量压力，尤其适用于推理工作负载，这类场景当中，并不是全部数据都需要达到 HBM 级别的延迟。 📅首批样品计划在 2028 年推出。 📋zNAND‑O：zNAND‑O 的核心组件 🔹比特 / 单元：SLC（单级单元） 🔹堆叠技术：V10 BV‑NAND + TSV（硅通孔） 🔹集成方案：将 NPU 与 zNAND‑O 封装在同一个封装内 🔹接口：UCle 标准 🔹封装：针对移动端适配做优化 🔹可扩展性：通过核心裸片堆叠实现纵向扩容，通过多颗 zNAND‑O 实现横向扩容 🚀zNAND‑O：迈向高带宽闪存的第一步 ⚡性能：zNAND‑O 读取延迟小于 3 微秒；带宽 200GB/s（4 高）、400GB/s（8 高） 🔋功耗：200GB/s 工况功耗小于 10 瓦，400GB/s 工况功耗小于 20 瓦 📐面积与可扩展性：占用面积小巧；可以通过纵向扩容、横向扩容两种方式实现性能与容量拓展 🗓️时间规划：2028 年提供样品 ✨“具备类似 LPDDR DRAM 的顺序读取性能，同时拥有更大容量” 📱面向移动 / 固定场景（100B 模型） 📈位密度达到 DRAM 的 10 倍 ⚙️zNAND‑O：读取带宽达到传统闪存的 7 倍，读取功耗效率同样为传统闪存的 7 倍 📲面向片上设备市场，带宽大于 200GB/s#文字观点", "publish_time": "2026-09-01 14:55", "tags": ["文字观点"]}, "post:2026-09-01T19-32:275e8588f5a9": {"id": "post:2026-09-01T19-32:275e8588f5a9", "kind": "post", "title": "2026-09-01 19:32", "source_label": "帖子正文", "excerpt": "友：事到如今，能否斩钉截铁地说AI牛100%已经结束？果：科学地说：不能，永远不能在熊市已进行得血流成河前就说牛市已结束。", "content": "友：事到如今，能否斩钉截铁地说AI牛100%已经结束？ 果：科学地说：不能，永远不能在熊市已进行得血流成河前就说牛市已结束。 你说得对，越科学，越废话。 因为科技牛见顶，本就没有百分百充分条件，毕竟你永远可以想象明天会更好。 ARR低预期，可以是一时的，CAPEX低预期、下修乃至见顶，都可以是一时的， 至于十年期国债收益率是4.5%、5% 还是5.5%、加息一次、三次还是五次也都不能充分推出市场走熊。 反过来，没有绝对的充分条件也意味着条件“差不多”时， 随时见顶也不奇怪。 我们只能接受灰度决策，做一个概率判断。 我们一直说： 科技牛见顶重点讨论三个问题： 龙头企业市值透支？ 技术迭代与营收放缓 ？ 流动性收紧与利率高企 ？ 那现在环境，我们的判断： 以Coding AI为主驱动的这轮AI agent行情已结束，在下一个AI应用重要突破出现前，不适合ALL IN AI， 如果迟迟再等不到这个突破 ，等到的却是利率持续上升，那这轮美股AI牛会随着美国宏观周期见顶下行预期而终结。 这个过程里我们需要平衡调整好AI配置比例，不宜等明眼人都看出AI牛已结束时再从ALL IN AI 调整为零AI = 为时已晚。#文字观点", "publish_time": "2026-09-01 19:32", "tags": ["文字观点"]}, "attachment:files/电子  液态金属行业五问五答.docx": {"id": "attachment:files/电子  液态金属行业五问五答.docx", "kind": "attachment", "title": "电子 液态金属行业五问五答", "source_label": "其他", "excerpt": "1. 液态金属行业核心催化与关注逻辑 苹果折叠屏发布会为短期核心催化：2026年9月9日苹果发布会将发布折叠屏产品，该产品有望应用液态金属作为铰链转轴材料方案，此前液态金属主要应用于以华为为代表的高端安卓品牌折叠屏的部分产品中。苹果超高端折叠屏凭借庞大的高端机存量用户基础，远期市场空间可观", "content": "1. 液态金属行业核心催化与关注逻辑 苹果折叠屏发布会为短期核心催化：2026年9月9日苹果发布会将发布折叠屏产品，该产品有望应用液态金属作为铰链转轴材料方案，此前液态金属主要应用于以华为为代表的高端安卓品牌折叠屏的部分产品中。苹果超高端折叠屏凭借庞大的高端机存量用户基础，远期市场空间可观；若苹果折叠屏落地液态金属方案，将反向推动液态金属在安卓品牌中应用的延伸，行业有望迎来放量拐点。 折叠屏轻薄化与高可靠性趋势驱动材料升级：折叠屏铰链需要在有限空间内兼顾结构强度、尺寸精度、反复开合寿命等要求，材料路线因此逐步向液态金属倾斜，构成液态金属后续放量的产业基础。 液态金属此前应用规模有限：液态金属材料的成型成本较高，而转轴的另一个方案MIM成本相对更低，因此过去液态金属需求主要来自少数高端机型及特定结构件；其他应用领域如汽车、高尔夫球杆等规模均不大。据第三方数据，2022年液态金属市场规模不足1亿美金，龙头公司2024年液态金属收入约1个多亿，市场体量过去并不大。 2. 液态金属材料特性与加工工艺 液态金属本质为非晶合金：区别于传统晶态金属内部原子排列呈周期性，液态金属为非晶排列结构，呈玻璃态结构，又称“金属玻璃”。其特点是高强度、高硬度、高弹性，且在耐磨性、耐腐蚀性方面表现较好，适合用作铰链转轴材料。 材料体系与应用场景 原材料主要包括锆基、铜、铝，当前通常采用锆基液态金属；产业化后材料更加多元，包括铁基、铁镍基、钴基等非晶合金。 铁基、铁镍基、钴基主要应用于变压器、电感器、磁屏蔽等领域；锆基主要用于高强度高硬应用领域，正逐步向消费电子高附加值结构件拓展。 非晶合金终端应用已覆盖航空航天、电力电子、消费电子、医疗、体育用品等领域；消费电子中的具体应用包括手机SIM卡卡托、手环表壳、USB接口、光学镜头支架等。 加工流程与产业化核心环节：先购买原材料，经真空熔炼、压铸形成母合金，再进行后道切割、CNC、表面处理等环节。产业化核心在于前段的铸造成型过程与后道的精细化处理及外观表面处理。 3. 折叠屏铰链技术演变与多工艺路线对比 铰链结构从U型迭代至水滴型：铰链需在折叠屏闭合与展开过程中完成多角度悬停卡位，涉及高精密的限位与阻尼设计，且需反复开合，影响整机厚度、折痕控制、悬停及长期可靠性。 U型铰链：结构简单，但厚度较厚。 球棒型铰链：相较U型有改进，但中间存在缝隙。 水滴型铰链：通过扩大屏幕弯折半径分散折叠应力，实现无缝或减少折痕，并支持多角度悬停，为当前主流方案。水滴型结构所需精密零部件数量大幅增加，以OPPO Find N为例，水滴型结构件数量达136个，而传统U型约60个。 折叠屏铰链设计趋同、材料与工艺路线并行 各家铰链结构设计本质趋同（均倾向水滴型），但命名各异，材料重点不同，部分采用“火箭钢”、碳纤维、钛合金等，材料路线尚未完全收敛，新型材料仍在测试中。 工艺路线并行，主要包括MIM、CNC、冲压、液态金属压铸等。液态金属采用压铸成型，供应链短；不同材料在成形能力和量产效率上存在差异，多工艺并行以匹配不同零部件的复杂度、精度和性能要求。 MIM与液态金属、CNC的对比 MIM：适合大批量生产，模具完成后将金属粉末加热熔化、冷却成型、再烧结，理论精度较高、原材料利用率高；但因烧结后存在收缩环节，大件会放大尺寸精度差异，因此主要应用于小件，此前以手机卡托、镜头金属环为主，穿戴类和电脑领域也较多应用。 CNC：属于减材加工工艺，适用度较高。 液态金属：主要应用在折叠屏转轴，属于增材制造工艺，过程控制的最核心环节在压铸成型环节。 华为液态金属应用现状：华为Mate XT外折转轴采用液态金属，内折采用MIM；华为折叠电脑也采用液态金属转轴。目前折叠屏铰链中液态金属的主要应用仍集中在华为产品上。 4. 市场空间测算与相关企业 折叠屏销量基数和渗透率假设 2024年安卓折叠屏销量为1800万部，其中华为和三星为主力，年销量各约500万~600多万部；荣耀约200多万部；其他品牌多在100万级或几十万级。 高端机折叠屏渗透率参考：华为与三星折叠屏出货占其高端机比例接近20个百分点；三星峰值出货1000多万部，同样相当于其高端机的约20%。 苹果手机过去出货为2亿多部，未来可能达3亿部；若按约20%渗透率测算，苹果折叠屏远期出货天花板约在5000万~6000万部。 液态金属铰链市场空间敏感性测算 高端机市场年销量约3亿多部，测算核心变量为折叠屏渗透率与液态金属转轴ASP。 假设折叠屏渗透率为25%、转轴ASP为10美金：若液态金属完全渗透，对应市场约8亿美金；若仅一半手机采用液态金属转轴，对应约4亿美金。 对比过去不足10亿的市场体量，液态金属增量空间显著。除手机外，折叠电脑、折叠Pad等场景同样可能采用液态金属转轴，其转轴更长、价值量更高，有望进一步打开空间。乐观情形下，市场或从大几十亿向百亿级别突破。 相关企业分析：目前全球范围内液态金属可见玩家可能仅宜安科技，为当前重点关注的标的。 5. 风险提示 技术迭代风险：液态金属为新方案，若客户新机今年落地使用后，后续技术路线可能存在变化；3D打印、MIM等工艺同样可以制造转轴，存在替代风险。 成本与客户意愿风险：液态金属成本相对于MIM更高，其他厂商是否愿意采用更高成本方案存在不确定性。 供应链集中度风险：客户是否允许仅一家液态金属公司独供自家产品存在不确定性，供应链分散化需求可能对格局产生影响。", "status": "extracted"}, "post:2026-09-01T08-54:3eb2a2f5ad56": {"id": "post:2026-09-01 正文", "excerpt": "高盛——澜起科技（688008）：内存接口芯片产品结构升级，新产品上量", "content": "高盛——澜起科技（688008）：内存接口芯片产品结构升级，新产品上量；2026年二季度符合指引；买入评级 澜起科技（Montage）2026年二季度实现净利润11.5亿元，同比增长81%、环比增长36%，符合高盛预期及公司此前给出的业绩指引。二季度营收18.75亿元，同比增长33%，增长驱动力来自DDR5接口芯片的放量，以及创新产品（MRCD/MDB、PCIe Retimer、CKD、CXL MXC）的扩张。二季度毛利率为61.8%，低于高盛预期的67.1%及市场共识预期的66.6%，管理层解释这主要由于产品结构变化所致。管理层预计，新一代DDR5/DDR6接口芯片的持续迁移将推动增长，而MRCD/MDB产品预计从2027年起逐步放量。高盛对澜起在内存互连芯片领域的领先地位及其不断扩展的AI互连产品组合保持积极看法，维持\"买入\"评级。 二季度业绩关键数据 二季度营收18.75亿元（同比+33%），归母净利润11.50亿元（同比+81%），每股收益0.94元。毛利率61.8%（去年同期60.4%，上季度69.8%），营业利润率37.4%，净利润率61.3%。营收与净利润均符合或略高于高盛预期，但毛利率因产品组合变化而低于预期。 DDR5产品迁移持续推进 管理层表示，2026年上半年DDR5第三代和第四代产品占RCD出货量的比重已超过50%，DDR5第五代接口芯片已开始批量出货。澜起于今年6月完成了DDR5第六代产品的送样，同时DDR6第一代产品正在研发中。管理层认为，AI推理对CPU重要性的提升，以及每颗CPU内存通道数量的增加，将共同推动内存模组需求及互连芯片内容量的增长。 创新产品预计2027年起逐步放量 2026年上半年，MRCD/MDB、PCIe Retimer、CKD和CXL MXC等创新产品合计营收达5.38亿元，同比增长81%，增长主要由PCIe Retimer和CKD芯片驱动。管理层预计，随着支持的CPU平台及相关生态系统逐步成熟，MRCD/MDB产品将从2027年开始实现有意义的批量上量。澜起正准备PCIe 6.x Retimer于2027年量产，并计划在2026年下半年完成PCIe 7.0 Retimer、PCIe Switch以及高速以太网PHY Retimer工程样品的流片。 盈利预测调整 结合澜起二季度业绩，高盛将2026-2032年盈利预测下调约2%，主因CKD收入增长慢于预期导致营收预测下调，同时出于成本压力考虑降低了毛利率假设。尽管如此，高盛对创新产品未来收入贡献的增加仍持乐观态度。具体调整方向：2026年预期营收从82.12亿元下调至81.06亿元，净利润从33.6亿元上调至34.4元（因二季度净利润实际表现略高于此前预期）；2027年预期营收从111.85亿元下调至111.21亿元，净利润从43.7亿元下调至42.6亿元；2028年预期营收从157.38亿元下调至155.67亿元，净利润从59.6亿元下调至57.8亿元。后续年份盈利预测亦有小幅下调。 估值与目标价 基于2026-2032年盈利预测的调整，高盛将澜起A股和H股的目标价分别下调至380元人民币和572港元。A股12个月目标价380元，基于48.1倍（此前为48.0倍）2030年预期摊薄市盈率，该目标市盈率倍数由同业市盈率与净利润增长相关性推导得出。H股12个月目标价572港元，基于66.4倍（此前为66.2倍）2030年预期市盈率，并假设H股较A股存在38%的估值溢价，人民币兑港元汇率按1.09计算。截至8月28日收盘，A股股价213元，较目标价有78.4%的上行空间；H股股价285港元，较目标价有100.7%的上行空间。维持\"买入\"评级。 主要风险（下行） 1）内存接口芯片市场增长弱于预期；2）新产品推出进度慢于预期；3）市场竞争比预期更为激烈。#文字观点", "publish_time": "2026-09-01 08:58", "tags": ["文字观点"]}, "post:2026-09-01T22-07:0ec9aaaf3372": {"id": "post:2026-09-01T22-07:0ec9aaaf3372", "kind": "post", "title": "2026-09-01 22:07", "source_label": "帖子正文", "excerpt": "【东北计算机】20260901【燧原科技科创板发行价定为142.18元/股，网上网下申购日为9月2日】 —————————————— 1、央视报道，2026年国产AI芯片需求约40", "conten 466.5亿美元创历史最高月度纪录；长鑫IPO进程、长存上市预期强化2026年两存扩产逻辑，每万片NAND/DRAM扩产有望带动近百亿开支增量。\n- **AI算力需求侧景气延续**：智谱8月ARR达16亿美元超市场预期，上调全年指引至24亿美元，核心驱动力为GLM-5.3发布后API业务量价齐升及十万卡级国产芯片集群规模化推理带来的成本优化；Anthropic与英伟达投资的云服务商Lambda签署价值350亿美元云计算协议。\n- **AI硬件细分新方向获强化**：光模块向800G/1.6T演进推动光通信液冷（VC均热板、液冷Cage、交换机液冷）需求提升；AI芯片功率升级驱动DrMOS用量线性扩容，2027年对应市场约250亿元，国产替代验证加速；AI PCB板块下半年业绩确定性获看好，调整被视为布局良机。\n\n## 二、今日最强主线\n\n### 主线1：AI算力/大模型——Token通缩与算力成本高企并存\n- **今天强化的逻辑**：OpenAI与Anthropic将融资获取的资金持续向Azure、AWS采购算力，为云大厂带来云业务营收；AI基础设施租赁成本持续走高而Token平均价格不断下行，挤压模型公司毛利；政策红利更偏向具有交付能力的应用与服务层，而非模型层与算力层。\n- **今天出现的催化/验证**：Silicon Data Token支出指数跌至1美元（2025年12月有统计以来最低）；智谱8月ARR达16亿美元并上调全年指引至24亿美元；Anthropic与Lambda签署350亿美元云服务协议；国产大模型商业化放量，日均Token调用量突破140万亿，智能算力规模2026-2028年维持约40%年增速；国内首部上星AIGC长剧《后西游记》登陆湖南卫视黄金档；蓝色光标26H1 AI驱动收入28.45亿元（+81.4%）、Token消耗破2万亿（是2025全年2倍）、出海广告收入291亿（占总收入84%+）、KreadoAI接入Gemini 3.0、EC-Agent已跑200+智能体；国务院国资委举办中央企业“AI for Science”人才特训班开班。\n\n### 主线2：半导体/先进封装——存储扩产预期与设备端景气共振\n- **今天强化的逻辑**：长鑫IPO进程、长存上市预期下，2026年两存扩产预期逐步强化，每万片NAND/DRAM扩产有望带动近百亿开支增量；混合键合设备已应用在3D NAND、CIS等领域，未来有望拓展至AI芯片、HBM、3D DRAM等领域。\n- **今天出现的催化/验证**：拓荆科技股权激励落地；WFE预测再次上调，明年晶圆厂设备支出有望约2250亿美元；韩国8月芯片出口466.5亿美元创历史新高；三星zNAND-O具备10倍DRAM位密度、7倍更高读取带宽及7倍更出色的读取功耗效率，可为HBM分担大量内存容量压力；8月总出口额达983亿美元为有史以来第三高月份，其中芯片出口功不可没。\n\n### 主线3：光通信/CPO——光互联速率跃迁下的散热新方向\n- **今天强化的逻辑**：光模块速率持续由400G向800G、1.6T及更高速率升级，单模块功耗不断提升，传统风冷散热能力逐步接近边界，VC均热板、液冷Cage及交换机液冷等方案重要性持续提升；NPO、CPO、XPO等新技术出现推动光通信散热空间持续增长；大陆供应链切入机会更大。\n- **今天出现的催化/验证**：索尔思具备稀缺的EML光芯片+光模块IDM一体化能力，可量产100G/200G EML，已打入多家北美一线龙头客户，NPO/CPO已拿到北美客户订单，光芯片净利润率预期高达50%以上；光通信测试Q2下游资本开支增速高达500%；第27届CIOE中国光博会上薄膜铌酸锂产业链集中亮相，材料端天通控股展出铌酸锂/钽酸锂晶圆。\n\n### 主线4：液冷/电源——AI芯片功率升级驱动DrMOS用量扩容\n- **今天强化的逻辑**：单芯片DrMOS用量随功耗升级线性提升——芯片功耗从500W→1000W→2000W，DrMOS用量从40-50颗→60-80颗→80颗+；2027年AI芯片对应DrMOS市场约250亿元，当前以海外英飞凌、MPS、瑞萨垄断为主；海外厂商扩产慢、交期拉长，客户主动寻求第二供应商意愿增强，为国产DrMOS导入头部客户创造窗口期。\n- **今天出现的催化/验证**：同飞股份在海外AIDC领域的客户和产品品类持续扩圈；CSP客户对液冷环节集成度要求提升，冷板厂商普遍不具备CDU生产能力，急需寻求代工以扩展提供散热整体解决方案的能力；国产算力&液冷方向建议重视低位标的：恒铭达（昇腾液冷）、意华股份（华为高速线模组+液冷cage）、英唐智控（国产OCS整机）。\n\n### 主线5：宏观/策略——美债收益率新高的鹰派信号重估\n- **今天强化的逻辑**：油价大幅上行、全期限收益率曲线陡峭化；美联储主席沃什释放鹰派信号后利率前景不确定性构成阻力，9月政策会议之前暂时放弃看涨美股立场；国内投资者态度依旧偏谨慎，不少人对上证综指月线MACD指标存在担忧。\n- **今天出现的催化/验证**：5年期与10年期美债收益率创2025年1月以来新高；德国8月CPI同比初值2.9%（前值2.8%，预期3%）；9月核心事件将持续落地：924中美元首会晤、Anthropic上旬披露招股书、4日美国非农、11日CPI、15日FOMC、2日博通财报、8日甲骨文财报、下旬美光财报；本周五非农就业数据发布后美股下跌的可能性更大。\n\n### 主线6：新能源/汽车——光伏需求走弱与结构性反转预期\n- **今天强化的逻辑**：海外光伏需求走弱、国内工商业储能交付减少，叠加研发及市场投入、汇兑损失，相关公司业绩承压；储能定价压力加大，盈利预测被下调。\n- **今天出现的催化/验证**：盈利预测被下调以反映光伏需求走弱和储能定价压力加大，同时WACC从8.6%下调至8.2%；特朗普第14420号行政令加剧市场对阳光电源美国公用事业相关电力设备业务的担忧，但未必意味着彻底禁令，历史表明应趁恐惧买入；光伏行业指数-3.43%；钙钛矿《单结钙钛矿光伏组件》及《单结钙钛矿光伏组件I-V测试方法》两项团体标准获批发布（8月28日），推动钙钛矿光伏产业标准化和商业化进程。\n\n## 三、今日重点关注\n\n### 3.1 今天已经发生的重点变化\n- **Token价格创历史新低**：Silicon Data大模型Token支出指数跌至1美元，为2025年12月有统计以来最低。\n- **Anthropic签署350亿美元云服务协议**：与英伟达投资的云服务商Lambda签署，数据中心由Hut 8持有、坐落于得克萨斯州努埃塞斯县，英伟达自身持有该数据中心的租约。\n- **智谱8月ARR超预期**：8月ARR达16亿美元并上调全年指引至24亿美元，GLM-5.3发布后API业务量价齐升，十万卡级国产芯片集群规模化推理带来成本优化。\n- **工信部AI应用服务商培育专项行动公开**：计划2026年底服务商资源池突破2000家、2027年底突破3000家。\n- **拓荆科技股权激励落地**：拟向不超1200人授予股票期权，占2026年6月30日总员工人数59.5%，含董事长等11位高管。\n- **正帆科技发布股权激励计划草案**：拟向69名董事、高管及核心技术（业务）人员一次性授予500万份股票期权，行权价66.53元/股，锚定百亿营收目标。\n- **WFE预测上调**：2026/2027/2028年晶圆厂设备支出预测被再次上调，明年有望攀升至约2250亿美元。\n- **韩国8月芯片出口创新高**：半导体出货量466.5亿美元，创历史最高月度纪录。\n- **美敦力与康诺思腾战略合作**：美敦力拟向康诺思腾战略投资约7亿美元，并有权在美国以外的部分已获批市场分销Sentire思腾®腔镜手术机器人。\n- **美债收益率创阶段新高**：5年期与10年期美债收益率创2025年1月以来新高。\n- **SHEIN今日港股上市**：发行2.8亿B类股，发行价48.56港元/股，对应市值约2062亿港元、折合264.5亿美元。\n- **首部上星AIGC长剧播出**：《后西游记》今日上线芒果TV并登陆湖南卫视黄金档，全程AIGC完成画面与人物演绎，100%由Seedance 2.0/2.5提供AI技术支持。\n- **8月游戏版号创年内新高**：共下发215款，单月发放数量首次突破200款。\n\n### 3.2 接下来要继续跟踪的验证点/催化点\n- **9月2日**：燧原科技科创板网上网下申购（发行价142.18元/股）；博通财报。\n- **9月3日**：特斯拉Cybercab（无人驾驶出租车）发布会。\n- **9月4日**：美国非农就业数据发布。\n- **9月8日**：甲骨文财报；**9月9日**：苹果发布会，有望发布折叠屏产品，液态金属铰链为短期核心催化。\n- **9月11日**：美国CPI；**9月15日**：FOMC会议。\n- **9月内**：Anthropic上旬披露招股书展望具体财务数据、中下旬确定发行估值；下旬美光财报；924中美元首会晤；美伊是否升级与油价上涨风险。\n- **半导体存储链**：长鑫IPO进程、长存上市预期对2026年两存扩产和设备开支的验证。\n- **AI商业化**：智谱24亿美元全年ARR指引的兑现情况；国产大模型日均Token调用量（当前140万亿）的持续放量；AI应用服务商资源池扩容进度。\n- 关标的： - 国际复材301526 玻璃玻纤：定增落地，加速向高利润的二代布和Q布等高端产品结构升级，巩固龙头地位 - 宏和科技603256 玻璃玻纤：同为国内少数具备二代布量产\n\n**文字观点原文线索：**\n1. `2026-09-01 20:57` 1.行情进入9月，财报不确定性因素消退。\n\n\n### 芯原股份（688521.SH）· 当天提及 1 次\n\n**今日逻辑摘要：** 恒玄科技 （AI眼镜SoC主 控）、力芯微 （穿戴电源 管理芯片 ）、水晶光电 （AR光波导光学）、中科\n**重点关注内容提示：** 恒玄科技 （AI眼镜SoC主 控）、力芯微 （穿戴电源 管理芯片 ）、水晶光电 （AR光波导光学）、中科\n\n**命中附件原文线索：**\n1. `20260901 市场逻辑精选`\n精炼内容总结：◇相关公司： 恒玄科技 （AI眼镜SoC主 控）、力芯微 （穿戴电源 管理芯片 ）、水晶光电 （AR光波导光学）、中科创达 （端侧AI方 案）、芯原股份 （AR芯片定制）。\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Token价格创有统计以来新低，与算力租赁价格高企形成反差\u003c/strong>：Silicon Data发布的大模型Token支出指数已跌至1美元，Token价格创2025年12月有统计以来的历史最低水平；而H100 GPU租赁价格指数并未明显下行，AI基础设施租赁成本走高挤压模型公司毛利，亏本经营成为行业常态。\u003c/li>\n\u003cli>\u003cstrong>AI政策红利偏向应用与服务层\u003c/strong>：8月31日工信部公开《关于开展人工智能应用服务商培育专项行动的通知》，计划2026年底全国服务商资源池内数量突破2000家、到2027年底突破3000家，并探索通过首购首用、风险补偿等模式加大大模型、智能体、Token等服务采购力度。\u003c/li>\n\u003cli>\u003cstrong>半导体设备端催化密集\u003c/strong>：拓荆科技股权激励落地（拟覆盖不超1200人，占2026年6月30日总员工人数59.5%）；晶圆厂设备支出预测被再次上调，明年有望攀升至约2250亿美元；韩国8月芯片出口466.5亿美元创历史最高月度纪录；长鑫IPO进程、长存上市预期强化2026年两存扩产逻辑，每万片NAND/DRAM扩产有望带动近百亿开支增量。\u003c/li>\n\u003cli>\u003cstrong>AI算力需求侧景气延续\u003c/strong>：智谱8月ARR达16亿美元超市场预期，上调全年指引至24亿美元，核心驱动力为GLM-5.3发布后API业务量价齐升及十万卡级国产芯片集群规模化推理带来的成本优化；Anthropic与英伟达投资的云服务商Lambda签署价值350亿美元云计算协议。\u003c/li>\n\u003cli>\u003cstrong>AI硬件细分新方向获强化\u003c/strong>：光模块向800G/1.6T演进推动光通信液冷（VC均热板、液冷Cage、交换机液冷）需求提升；AI芯片功率升级驱动DrMOS用量线性扩容，2027年对应市场约250亿元，国产替代验证加速；AI PCB板块下半年业绩确定性获看好，调整被视为布局良机。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>主线1：AI算力/大模型——Token通缩与算力成本高企并存\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：OpenAI与Anthropic将融资获取的资金持续向Azure、AWS采购算力，为云大厂带来云业务营收；AI基础设施租赁成本持续走高而Token平均价格不断下行，挤压模型公司毛利；政策红利更偏向具有交付能力的应用与服务层，而非模型层与算力层。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：Silicon Data Token支出指数跌至1美元（2025年12月有统计以来最低）；智谱8月ARR达16亿美元并上调全年指引至24亿美元；Anthropic与Lambda签署350亿美元云服务协议；国产大模型商业化放量，日均Token调用量突破140万亿，智能算力规模2026-2028年维持约40%年增速；国内首部上星AIGC长剧《后西游记》登陆湖南卫视黄金档；蓝色光标26H1 AI驱动收入28.45亿元（+81.4%）、Token消耗破2万亿（是2025全年2倍）、出海广告收入291亿（占总收入84%+）、KreadoAI接入Gemini 3.0、EC-Agent已跑200+智能体；国务院国资委举办中央企业“AI for Science”人才特训班开班。\u003c/li>\n\u003c/ul>\n\u003ch3>主线2：半导体/先进封装——存储扩产预期与设备端景气共振\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：长鑫IPO进程、长存上市预期下，2026年两存扩产预期逐步强化，每万片NAND/DRAM扩产有望带动近百亿开支增量；混合键合设备已应用在3D NAND、CIS等领域，未来有望拓展至AI芯片、HBM、3D DRAM等领域。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：拓荆科技股权激励落地；WFE预测再次上调，明年晶圆厂设备支出有望约2250亿美元；韩国8月芯片出口466.5亿美元创历史新高；三星zNAND-O具备10倍DRAM位密度、7倍更高读取带宽及7倍更出色的读取功耗效率，可为HBM分担大量内存容量压力；8月总出口额达983亿美元为有史以来第三高月份，其中芯片出口功不可没。\u003c/li>\n\u003c/ul>\n\u003ch3>主线3：光通信/CPO——光互联速率跃迁下的散热新方向\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：光模块速率持续由400G向800G、1.6T及更高速率升级，单模块功耗不断提升，传统风冷散热能力逐步接近边界，VC均热板、液冷Cage及交换机液冷等方案重要性持续提升；NPO、CPO、XPO等新技术出现推动光通信散热空间持续增长；大陆供应链切入机会更大。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：索尔思具备稀缺的EML光芯片+光模块IDM一体化能力，可量产100G/200G EML，已打入多家北美一线龙头客户，NPO/CPO已拿到北美客户订单，光芯片净利润率预期高达50%以上；光通信测试Q2下游资本开支增速高达500%；第27届CIOE中国光博会上薄膜铌酸锂产业链集中亮相，材料端天通控股展出铌酸锂/钽酸锂晶圆。\u003c/li>\n\u003c/ul>\n\u003ch3>主线4：液冷/电源——AI芯片功率升级驱动DrMOS用量扩容\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：单芯片DrMOS用量随功耗升级线性提升——芯片功耗从500W→1000W→2000W，DrMOS用量从40-50颗→60-80颗→80颗+；2027年AI芯片对应DrMOS市场约250亿元，当前以海外英飞凌、MPS、瑞萨垄断为主；海外厂商扩产慢、交期拉长，客户主动寻求第二供应商意愿增强，为国产DrMOS导入头部客户创造窗口期。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：同飞股份在海外AIDC领域的客户和产品品类持续扩圈；CSP客户对液冷环节集成度要求提升，冷板厂商普遍不具备CDU生产能力，急需寻求代工以扩展提供散热整体解决方案的能力；国产算力&amp;液冷方向建议重视低位标的：恒铭达（昇腾液冷）、意华股份（华为高速线模组+液冷cage）、英唐智控（国产OCS整机）。\u003c/li>\n\u003c/ul>\n\u003ch3>主线5：宏观/策略——美债收益率新高的鹰派信号重估\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：油价大幅上行、全期限收益率曲线陡峭化；美联储主席沃什释放鹰派信号后利率前景不确定性构成阻力，9月政策会议之前暂时放弃看涨美股立场；国内投资者态度依旧偏谨慎，不少人对上证综指月线MACD指标存在担忧。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：5年期与10年期美债收益率创2025年1月以来新高；德国8月CPI同比初值2.9%（前值2.8%，预期3%）；9月核心事件将持续落地：924中美元首会晤、Anthropic上旬披露招股书、4日美国非农、11日CPI、15日FOMC、2日博通财报、8日甲骨文财报、下旬美光财报；本周五非农就业数据发布后美股下跌的可能性更大。\u003c/li>\n\u003c/ul>\n\u003ch3>主线6：新能源/汽车——光伏需求走弱与结构性反转预期\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：海外光伏需求走弱、国内工商业储能交付减少，叠加研发及市场投入、汇兑损失，相关公司业绩承压；储能定价压力加大，盈利预测被下调。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：盈利预测被下调以反映光伏需求走弱和储能定价压力加大，同时WACC从8.6%下调至8.2%；特朗普第14420号行政令加剧市场对阳光电源美国公用事业相关电力设备业务的担忧，但未必意味着彻底禁令，历史表明应趁恐惧买入；光伏行业指数-3.43%；钙钛矿《单结钙钛矿光伏组件》及《单结钙钛矿光伏组件I-V测试方法》两项团体标准获批发布（8月28日），推动钙钛矿光伏产业标准化和商业化进程。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Token价格创历史新低\u003c/strong>：Silicon Data大模型Token支出指数跌至1美元，为2025年12月有统计以来最低。\u003c/li>\n\u003cli>\u003cstrong>Anthropic签署350亿美元云服务协议\u003c/strong>：与英伟达投资的云服务商Lambda签署，数据中心由Hut 8持有、坐落于得克萨斯州努埃塞斯县，英伟达自身持有该数据中心的租约。\u003c/li>\n\u003cli>\u003cstrong>智谱8月ARR超预期\u003c/strong>：8月ARR达16亿美元并上调全年指引至24亿美元，GLM-5.3发布后API业务量价齐升，十万卡级国产芯片集群规模化推理带来成本优化。\u003c/li>\n\u003cli>\u003cstrong>工信部AI应用服务商培育专项行动公开\u003c/strong>：计划2026年底服务商资源池突破2000家、2027年底突破3000家。\u003c/li>\n\u003cli>\u003cstrong>拓荆科技股权激励落地\u003c/strong>：拟向不超1200人授予股票期权，占2026年6月30日总员工人数59.5%，含董事长等11位高管。\u003c/li>\n\u003cli>\u003cstrong>正帆科技发布股权激励计划草案\u003c/strong>：拟向69名董事、高管及核心技术（业务）人员一次性授予500万份股票期权，行权价66.53元/股，锚定百亿营收目标。\u003c/li>\n\u003cli>\u003cstrong>WFE预测上调\u003c/strong>：2026/2027/2028年晶圆厂设备支出预测被再次上调，明年有望攀升至约2250亿美元。\u003c/li>\n\u003cli>\u003cstrong>韩国8月芯片出口创新高\u003c/strong>：半导体出货量466.5亿美元，创历史最高月度纪录。\u003c/li>\n\u003cli>\u003cstrong>美敦力与康诺思腾战略合作\u003c/strong>：美敦力拟向康诺思腾战略投资约7亿美元，并有权在美国以外的部分已获批市场分销Sentire思腾®腔镜手术机器人。\u003c/li>\n\u003cli>\u003cstrong>美债收益率创阶段新高\u003c/strong>：5年期与10年期美债收益率创2025年1月以来新高。\u003c/li>\n\u003cli>\u003cstrong>SHEIN今日港股上市\u003c/strong>：发行2.8亿B类股，发行价48.56港元/股，对应市值约2062亿港元、折合264.5亿美元。\u003c/li>\n\u003cli>\u003cstrong>首部上星AIGC长剧播出\u003c/strong>：《后西游记》今日上线芒果TV并登陆湖南卫视黄金档，全程AIGC完成画面与人物演绎，100%由Seedance 2.0/2.5提供AI技术支持。\u003c/li>\n\u003cli>\u003cstrong>8月游戏版号创年内新高\u003c/strong>：共下发215款，单月发放数量首次突破200款。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>9月2日\u003c/strong>：燧原科技科创板网上网下申购（发行价142.18元/股）；博通财报。\u003c/li>\n\u003cli>\u003cstrong>9月3日\u003c/strong>：特斯拉Cybercab（无人驾驶出租车）发布会。\u003c/li>\n\u003cli>\u003cstrong>9月4日\u003c/strong>：美国非农就业数据发布。\u003c/li>\n\u003cli>\u003cstrong>9月8日\u003c/strong>：甲骨文财报；\u003cstrong>9月9日\u003c/strong>：苹果发布会，有望发布折叠屏产品，液态金属铰链为短期核心催化。\u003c/li>\n\u003cli>\u003cstrong>9月11日\u003c/strong>：美国CPI；\u003cstrong>9月15日\u003c/strong>：FOMC会议。\u003c/li>\n\u003cli>\u003cstrong>9月内\u003c/strong>：Anthropic上旬披露招股书展望具体财务数据、中下旬确定发行估值；下旬美光财报；924中美元首会晤；美伊是否升级与油价上涨风险。\u003c/li>\n\u003cli>\u003cstrong>半导体存储链\u003c/strong>：长鑫IPO进程、长存上市预期对2026年两存扩产和设备开支的验证。\u003c/li>\n\u003cli>\u003cstrong>AI商业化\u003c/strong>：智谱24亿美元全年ARR指引的兑现情况；国产大模型日均Token调用量（当前140万亿）的持续放量；AI应用服务商资源池扩容进度。\u003c/li>\n\u003cli>\u003cstrong>AI硬件\u003c/strong>：AI PCB板块下半年新品拉货带来的业绩斜率验证；索尔思NPO/CPO北美客户订单落地与新增产能、新客户导入进展；同飞股份海外AIDC客户拓展；国产DrMOS供应商验证进展。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>07:51｜高盛 CAS：周一市场逐日盯市报告🌆晚上好。这里是周一的逐日盯市报告，油价大幅上行，全期限收益率曲线陡峭化，5 年期与 10 年期美债收益率创下 2025 年 1 月以来新高。\u003c/li>\n\u003cli>07:51｜Anthropic 签署由英伟达支持的 350 亿美元云服务协议📰据知情人士透露，Anthropic 已经和英伟达（NVDA，涨幅 1.48%）投资的云服务商 Lambda 签署一份价值 350 亿美元的云计算协议，英伟达自身持有该数据中心的租约。🏗️这座数据中心由比特币矿商兼数据中心开发公司 Hut 8，坐落于得克萨斯州努埃塞斯县。\u003c/li>\n\u003cli>07:52｜正帆科技：股票期权激励计划锚定百亿营收目标，强化半导体业务成长导向【建投机械-半导体设备】 事件 公司发布《2026年股票期权激励计划（草案）》，拟向69名董事、高级管理人员及核心技术（业务）人员一次性授予500万份股票期权，占草案公告时总股本的1.57%，无预留权益，股票来源为公司定向发行A股普通股。行权价格及预计费用 行权价格为66.53元/股。\u003c/li>\n\u003cli>07:52｜MLCC 行业，未来有望迎来三大催化因素📌TrendForce 集邦咨询，提出三星电机存在涨价可能性 📝据 TrendForce 集邦咨询分析，三星电机预计将在第四季度，面向 OEM、ODM 客户推进涨价。📎一直以来，包括三星电机在内的大部分公司，主要针对流通渠道进行涨价。\u003c/li>\n\u003cli>07:52｜摩根士丹利🤔Meta 如今能否成为 2025 年下半年的谷歌？🤔我们详细阐述了对于 Meta 青少年用户相关诉讼和解事件的看法，并且类比 2025 年的谷歌，我们思考 Meta 的产品管线是否即将迎来集中落地，Meta 的估值倍数是否即将迎来扩张。\u003c/li>\n\u003cli>07:53｜【长城机械 孙培德】3D打印：消费电子端大规模订单窗口期来临！apple27年将推出20周年款20 Pro/Pro Max，首次在直屏旗舰中采用钛合金中框，中框上下两个U型短边采用3D打印工艺\u003c/li>\
