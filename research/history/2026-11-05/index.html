年增速45%–70%，18层及以", "content": "", "publish_time": "2026-11-05 19:17", "tags": ["文字观点"]}}, "source_details": {"post:2026-11-05T09-18:752ff0b0739c": {"id": "post:2026-11-05T09-18:752ff0b0739c", "kind": "post", "title": "2026-11-05 09:18", "source_label": "帖子正文", "excerpt": "🔥电子：超跌反弹优先国产算力：供给约束引发超跌，需求明确指向长期成长#反弹为什么首选国产算力本轮急跌的扰动源在海外，FCC限制传闻叠加美股AI硬件波动。但国产算力的核心定价逻辑不是北美资本开支，而是模型迭代、需求扩容与国产替代斜率：算力基建投资规划明确要求八成AI芯片来自国内供应商，算力网建设已纳入", "content": "🔥电子：超跌反弹优先国产算力：供给约束引发超跌，需求明确指向长期成长#反弹为什么首选国产算力本轮急跌的扰动源在海外，FCC限制传闻叠加美股AI硬件波动。但国产算力的核心定价逻辑不是北美资本开支，而是模型迭代、需求扩容与国产替代斜率：算力基建投资规划明确要求八成AI芯片来自国内供应商，算力网建设已纳入PSL支持领域，需求端由市场与政策双重驱动长期成长，景气与美股科技链相对绝缘。 #业绩正从叙事走向兑现，供给约束有望逐步缓和 市场此前对国产算力的质疑是“只有故事、没有利润”，三季报国产GPU公司单季扭亏、营收创历史新高。逻辑上这是“量增”主导、不含涨价预期的品种，避开了涨价链“景气不可永续”的估值约束；而此前HBM供给约束引发市场对明年增长确定性的担忧，近期产业链情况显示HBM供给紧张有望逐步走向缓和，恰是反弹资金最偏好的属性。#建议关注算力芯片设计&端侧AI、半导体设备与上游材料、先进封装，反弹中的分歧点是国产主线的加仓窗口。 🔥通信：反弹时刻关注海外+国产AI超跌核心品种 #海外AI算力：悲观预期缓解，看好27年AI变现 美国中期选举落地，此前市场担心民主党议员拿下德州后数据中心政策有较大逆风，但实际上数据中心占GDP比重高，最终是把电网和基建成本转嫁给开发商，而非停建；叠加战争预期缓解，后续加息预期或有所缓解，整体悲观预期有缓解。当下市场对27-29年海外Capex预期已有充分修正，我们看好27年更多商业模式的AI变现，包括2C/垂类Agent和Enterprise AI。Capex端继续看好光通信作为占比提升环节，网络方向创新加速，超节点、Scale-up/Scale-across/Scale-in、内存池化等技术带来新增量，是穿越Capex周期的alpha品种。重点关注：#中际旭创、#源杰科技、#新易盛、#天孚通信、#光库科技、#仕佳光子、#联讯仪器 #国产AI算力：AI基建拉动内需，供给与融资双改善 看好27年AI基建成为拉动内需的方向之一。供给侧，HBM供应有望改善，带动国产芯片放量；融资侧，国内CSP厂商仍有一定加杠杆空间，看好服务器、交换机、光模块等ICT设备及上游环节。重点关注：#光迅科技、#华工科技、#紫光股份、#盛科通信、#锐捷网络 #散热：从资产负债表拐点进入业绩放量大拐点 Q4国内Tier1陆续进入批量交付阶段，份额有望伴随客户新品导入逐步提升，明年将从资产负债表拐点进入业绩放量大拐点，重点推荐#英维克、#申菱环境。此外，明年0→1的光模块散热新领域，有望进入供应链突破+预期放量推动的主升浪阶段（对应服务器液冷2025年行情），重点关注#中石科技、#苏州天脉 🔥计算机：反弹时刻重视国产算力#Q3经营向好国产算力板块三季报龙头业绩稳健增长，摩尔、沐曦、燧原等单季收入环比加速明显，且毛利率保持较高水平，板块经营趋势持续向上。#供给担忧边际缓解此前市场对国算的核心担忧在于HBM供应不足导致出货不及预期，近期国产供给进展积极；且从Q3线索看各家存货、预付款均保持高增，积极备货保障2027年交付。#新产品推进顺利H2以来各家搭载下一代最新产品陆续回片、送测，逐步将于27年进入量产新周期。2027年产品结构切换+涨价，板块收入爆发确定性高。#悲观预期+筹码杀跌已经充分龙头估值处于低位，反弹时刻建议重视。核心标的：#寒武纪、#海光信息、#天数智芯、#摩尔线程、#燧原科技、#沐曦股份、#壁仞科技 🔥传媒：AI应用产业趋势明确，继续推荐AI短剧/物理AI#数据与产品双催化QM 9月数据：红果免费短剧MAU 4.3亿（+82%）、微信绿泡泡1.6亿（新增），时长持续增长、产业趋势明确；腾讯hy4正式推出并首次引入视觉理解能力，字节空间视频模型有望12月推出。继续推 I 模型的工程师的每日支出上限从 300 美元下调至 200 美元。", "content": "苹果削减内部 AI 使用预算以降低支出 苹果公司正在削减员工使用人工智能的预算，作为缩减开支努力的一部分，尽管该公司正寻求将 AI 置于其业务的核心地位。 据知情人士透露，上个月，苹果悄然将部分使用 AI 模型的工程师的每日支出上限从 300 美元下调至 200 美元。 知情人士表示，该公司目前正计划对部分工程团队进行进一步削减，可能将其每日津贴降至仅 100 美元。由于相关讨论尚未公开，知情人士要求匿名。 这些变化凸显了苹果面临的平衡难题：既要控制成本，又要鼓励员工将人工智能更深入地融入日常工作。 该公司正致力于利用人工智能实现工程流程和其他内部运营的现代化，但同时也对员工使用该技术的支出施加了更严格的限制。 9 月 1 日接任苹果首席执行官的约翰・特努斯（John Ternus）正推动公司以更高、更精简的方式运行。 知情人士表示，工程部门以外的许多团队已经面临每日 100 美元的上限，但苹果已考虑将某些团队的限额降至低至 25 美元。 因工作需要更高额度的员工可以向高级领导层申请豁免。 总部位于加利福尼亚州库比蒂诺的苹果公司发言人拒绝置评。 这些预算涵盖了 “Token（令牌）”，即人工智能模型在处理请求时所处理的文本和其他数据单位。 人工智能提供商通常根据消耗的 Token 数量收费，而更先进的模型通常成本更高。 编写和调试软件代码等复杂任务可能会消耗大量的 Token。 这些限制反映了整个科技行业更广泛的转变：最初鼓励广泛尝试人工智能的公司，现在正日益加强对成本的审查。 目前的挑战在于，如何在不损害最初促使公司拥抱该技术的效率提升的前提下，确定可以削减多少支出。 内部对这些变化的反应不一。 一些员工表示，很少有员工能用完每天 300 美元的额度，这使得之前的限制显得过于慷慨。 另一些人则将削减额度视为更广泛裁员的信号，加剧了对潜在裁员的担忧。 据彭博新闻社报道，苹果的一些部门已经聘请了外部顾问来评估其效率和运营情况，这引发了员工对未来可能进行重组的焦虑。 新任首席执行官约翰・特努斯（John Ternus）正推动公司以更少管理层层级、更快且更精简的方式运行。 目前尚不清楚削减开支能带来多少实际收益，尤其是考虑到部分员工并未达到之前的限额。 如果苹果继续进一步削减，其影响可能会变得更加显著，可能会迫使重度用户寻求豁免，以维持对他们所依赖工具的使用。 与此同时，苹果公司的整体支出有所上升。 该公司本周表示，受基础设施和人工智能（AI）成本上升的推动，2026 财年研发支出增长了 32%。 全公司的运营支出增长了 22%，达到 755 亿美元，占净销售额的 16%。 苹果员工可以使用一系列 AI 服务，包括 Anthropic 公司的 Claude、OpenAI 的 ChatGPT 以及谷歌的 Gemini。 一些团队被指示使用成本较低的模型，或依赖在设备本地运行的 AI 模型。 苹果并不是唯一一家寻求控制 AI 支出的公司。 微软公司也收紧了内部 AI 支出的额度，而特斯拉公司则对员工的 AI 支出设定了每周 200 美元的限制。 与此同时，Uber 技术公司将个人 AI 编程工具的使用上限设定为每月 1500 美元。 Meta Platforms 公司则引入了 Token 预算，并鼓励员工转向使用内部开发的 AI 工具。#文字观点", "publish_time": "2026-11-05 08:33", "tags": ["文字观点"]}, "attachment:files/中信建投-机械设备行业周观点：物理AI推动数采需求爆发，船舶订单持续景气-261102.pdf": {"id": "attachment:files/中信建投-机械设备行业周观点：物理AI推动数采需求爆发，船舶订单持续景气-261102.pdf", "kind": "attachment", "title": "中信建投-机械设备行业周观点：物理AI推动数采需求爆发，船舶订单持续景气-261102", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业动态 周观点：物理AI推动数采需求爆发 ，船舶订 单持续景气 核心观点 （1）船舶：船价连续7个月环比回升，全年油轮订单有望维持高 位，散货船订单或将接力成为下一阶段景气主线 ，本轮景气周期延 续。（2）液冷：液冷走向模块化预制，进一步打开成长空间 。（3） 半导体设备：订单需求持续旺盛，出海逐步打开空间。 （4）人形 机器人：巨头加速布局， 智元发布首个物理 AI价值度量衡Worken， 重视物理AI的板块性行情。（5）AIDC发电设备：GEV上调燃 机签约规模目标，行业供需缺口仍然延续 。（6）工程机械：9月挖 机内外销共振向上，关注年底估值切换及海外需求是否超预期。 行业动态信息 人形机器人：巨头加速布局，智元发布 首个物理AI价值度量衡 Worken。GPT-6惊艳效果有望加速产业核心具身大脑发展， OpenAI、Meta入局，Tesla推进量产，进一步明确产业趋势。 未 来1-2个月特斯拉有望发布 Optimus非预编程任务视频，展现机 器人能力。机器人公司积极推动“大脑”、“小脑”、“本体”等多维 度能力建设，随着机器人泛化水平提高，预计其落地场景将进一 步扩大。物理AI是人工智能的下一波浪潮，机器人是 AI最好的 物理载体之一，国内外预计催化不断，建议聚焦优质环节。 AIDC发电设备：GEV上调燃机签约规模目标，行业供需缺口仍 然延续。需求端：GE V第三季度新增燃机订单及产能预留合计 11GW，其中8GW为预留协议、3GW为直接订单，另有13GW既 有预留协议转为正式订单；现在手订单 及产能预留达122GW，并 将全年接单预期从125GW上调至至少130GW。贝克休斯也披露 两项合计约1.6GW的AIDC发电设备订单。此外，加拿大客户宣 布将东方汽轮机G50采购合作规模由10台扩大至30台。燃机需 求仍处较高景气度。供给端：BNEF预计已宣布的扩产计划将推动 全球燃机年产能到2030年提升超过50%，三巨头贡献新增35GW 产能中的28GW，但单晶叶片、锻件、特种合金、发电机等 上游环 节仍然制约交付。我们的观点：GE V再度上调全年接单预期，全 球燃机订单保持景气， 美国燃气发电在建规模及 AIDC相关项目占 比同步提升。重型燃机交付槽位稀缺，部分客户需要通过模块化设 备缩短投产周期，热端零部件仍然制约重型燃机交付，燃气内燃机 市场也在快速增长，行业供需缺口仍将延续。东 方电气G50燃机 维持 强于大市 许光坦 xuguangtan@csc.com.cn SAC 编号:S1440523060002 SFC 编号:BWS812 籍星博 jixingbo@csc.com.cn SAC 编号:S1440524070001 吴雨瑄 wuyuxuan@csc.com.cn SAC 编号:S1440525070008 乔磊 qiaoleibj@csc.com.cn 010-56135085 SAC 编号:S1440525070006 发布日期： 2026年11月02日 市场表现 -14%-4%6%16%26%36% 202 5/11 /3 202 5/12 /3 202 6/1/ 3 202 6/2/3 202 6/3/ 3 202 6/4/ 3 202 6/5/ 3 202 6/6/ 3 202 6/7/ 3 202 6/8/ 3 202 6/9/3 202 6/10 /3 机械设备上证指数机械设备 下载日志已记录，仅供内部参考 机械设备 获海外客户扩大采购，国产燃机凭借更短的交付周期、较高的性价比及不断增强的产品竞争力，有望加快获取 海外市场份额。坚定看好国产燃机出海，重点看好整机 【中国动力】【杰瑞股份】 等，推荐零部件【应流股份】 【万泽股份】等。 工程机械：9月挖机内外销继续共振向上 ，板块将迎来逐季度改善。 2026年9月销售各类挖掘机22717台，同 比增长14.4%。其中：国内销量9911台（含电动挖掘机218台），同比增长7.16%；出口12806台（含电动挖 掘机65台），同比增长20.7%。预计后续将继续维持增长。出口维持较强表现，并未受国际形势、关税变化、 加息预期等扰动，中国工程机械高增态势依旧维持。 国内格局改善，头部企业开始涨价。 三一、徐工、柳工、 山推等公司宣布对挖机、起重机等产品进行涨价，反映年初以来的行业价格战趋缓，行业转向良性发展。 半导体设备：全球景气周期持续确认，关注出海进程 。SEMI更新预测、预计半导体设备未来 3年持续增长。 SEMI预计2026年全球半导体制造设备销售额将创下 1659亿美元的历史新高，同比 +23.2%。增长势头预计将 持续至2028年，总设备销售额有望达到创纪录的 2295亿美元，实现连续五年增长。 台积电上修26年资本开 支。台积电预计2026年全年资本支出为600亿至640亿美元， "title": "A股与港股复盘 20261105", "source_label": "其他", "excerpt": "A股与港股复盘 2026年11月5日 研究笔记 · 不构成投资建议 第 1 / 11 页 股票市场复盘 港股继续领涨，互联网平台接棒硬件 2026年11月5日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 资金从芯片硬件转向中国互联网平台。", "content": "A股与港股复盘 2026年11月5日 研究笔记 · 不构成投资建议 第 1 / 11 页 股票市场复盘 港股继续领涨，互联网平台接棒硬件 2026年11月5日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 资金从芯片硬件转向中国互联网平台。费城半导体周三继续跌3.1%，今天韩国KOSPI跌5.3%、收在7月以来最低，A股光模块和PCB领跌，科创50盘中涨5.0%、收盘只涨1.7%；同一天恒指涨3.7%、恒生科技涨5.5%，领涨的是腾讯、阿里、小米、网易，港股的硬件股长飞光纤、建滔积层板各跌12%以上。 全球的芯片仓位在减，减下来的钱有一部分去了估值低的中国平台股，所以港股大涨、A股指数几乎持平。恒指今天是2025年2月以来最大的单日涨幅，但VHSI同时涨11.9%，显示肥尾事件可以是双向的；南向在这样的上涨里却净卖出213.3亿港元，所以港股的买盘很可能是来自南向以外的资金。 盗版自损福报。 本日报要 主线段： 周三美股的走势已经给出了今天的方向：道指涨3.0%，标普500涨1.6%，费城半导体指数却跌3.1%，英伟达跌3.2%，资金在美股内部从芯片换到了传统板块。今天亚洲接着做了同一件事，只是换成了各自市场的版本。芯片权重最重的韩国受伤最深，KOSPI跌5.3%，收5,384点，是7月以来最低的收盘，离今年6月的高点已经跌了四成；日经225跌1.8%。A股的光模块和PCB领跌，中际旭创跌7.5%，新易盛跌5.5%，科创50早盘一度涨5.0%，随后一路回落，收盘只涨1.7%。港股方向相反：恒指涨3.7%，2018年9月以来1,999个交易日里只有26天涨得比它多，是2025年2月以来最大的单日涨幅；恒生科技涨5.5%。领涨的全是互联网平台，腾讯涨7.2%，阿里涨8.4%，小米涨8.8%，网易涨9.1%，携程涨8.2%；港股的硬件股则和A股一起跌，长飞光纤跌12.5%，建滔积层板跌12.4%，联想跌6.9%。彭博把这一天称为价值轮动，钱从硬件和半导体转向被低估的中国互联网平台。 A股： 上证收3,690点，涨0.1%；深证成指涨1.2%，创业板指涨0.9%，科创50涨1.7%，中证500涨1.8%，中证1000涨2.1%，北证50涨1.8%，沪深300涨0.3%，上证50涨0.1%。沪深两市成交21,179.5亿元，比周三多802.5亿元（+3.9%）。沪深北共4,868家上涨、625家下跌、77家平盘。涨停84只（沪深），跌停0只，炸板48只。 A股与港股复盘 2026年11月5日 研究笔记 · 不构成投资建议 第 2 / 11 页 港股： 恒生指数收24,797点，涨3.7%；国企指数涨3.9%；恒生科技指数涨5.5%，收4,154点。恒指成交3,566.7亿港元，比周三多50.6%。恒指波幅指数VHSI收21.19，涨11.9%，指数大涨而对冲波动的成本没有下降。 货币与汇率： 人民银行今天开展2,630亿元隔夜逆回购，操作利率1.25%；周三的2,575亿元隔夜逆回购今日到期，按隔夜口径净投放55亿元。人民币中间价报6.7156，较周三调升24个基点；在岸即期约6.6675，离岸CNH约6.6660，中间价比即期弱约481个基点。美元指数101.57，基本持平。 互联互通： 北向成交3,201.6亿元，比周三的3,391.8亿元少5.6%，净额未公布。南向成交1,411.9亿港元，比周三的975.3亿港元多44.8%；全天买入599.3亿港元、卖出812.6亿港元，净卖出213.3亿港元，是2018年以来1,999个交易日里第四大的单日净卖出。周三是净卖出32.8亿港元，今天方向不变、规模放大了五倍多。 大波动： 内地方面，睿创微纳（688002.SH）跌15.4%，中际旭创（300308.SZ）跌7.5%，沪电股份（002463.SZ）跌5.8%；中科飞测（688361.SH）涨9.0%，通富微电（002156.SZ）涨6.9%，中微公司（688012.SH）涨5.8%。港股方面，长飞光纤光缆（06869.HK）跌12.5%，建滔积层板（01888.HK）跌12.4%，联想集团（00992.HK）跌6.9%；网易（09999.HK）涨9.1%，小米集团（01810.HK）涨8.8%，阿里巴巴（09988.HK）涨8.4%。 技术： 上证盘中最高摸到20日均线（布林中轨）后回落，收在中轨下方12点，仍低于50日、100日和200日均线。恒指收在20日布林上轨上方，并站上50日和100日均线，仍低于200日均线（详见第1、2节图）。 驱动： 沪深15:00、港股16:08均已收盘。周三美股收盘，道指涨3.0%，标普500涨1.6%，纳指涨1.4%，费城半导体指数跌3.1%，英伟达跌3.2%。同一天WTI原油跌8.3%、布伦特跌8.7%，彭博称中期选举结果让特朗普对伊朗动武的言论降温。收盘后，A股多家当天大跌或大涨的公司公告回购，中微公司拟回购4亿至5亿元，睿创微纳实控人提议回购5,000万至1亿元，山东黄金拟回购3亿至4亿元并注销。 外盘 / 商品 / 国债： 周四美东盘前，标普500期货涨0.2%，纳指期货跌0.6%，道指期货涨0.7%，VIX在16.81。WTI涨0.8%，布伦特涨1.6%；COMEX黄金涨1.8%，白银涨1.2%，铜跌0.3%；美国10年期国债收益率降1个基点，中国10年期国债收益率降1个基点（数字见第4节）。 A股与港股复盘 2026年11月5日 研究笔记 · 不构成投资建议 第 3 / 11 页 1. A股 指数 收盘 开 / 高 / 低 当日 成交额 上证指数 3,690 +0.1% 9,797.1亿 深证成指 11,471 +1.2% 11,382.4亿 沪深300 4,113 +0.3% 6,220.9亿 创业板指 2,567 +0.9% 5,761.1亿 科创50 1,287 +1.7% 1,172.6亿 中证500 6,741 +1.8% 3,888.5亿 中证1000 6,650 +2.1% 4,196.6亿 上证50 2,811 +0.1% 1,672.4亿 北证50 910 +1.8% 173.7亿 A股今天是个股普涨、指数不动的一天。上涨家数是下跌家数的近八倍，中证1000涨2.1%，可上证只涨0.1%，因为权重里的芯片硬件在跌。各宽基都低开，开盘几乎就是全天最低，随后冲高，科创50最高到1,329点，比周三收盘高5.0%，创业板指最高2,626点；收盘时科创50把三分之二的盘中涨幅还了回去，回吐的主要是芯片硬件。芯片内部分成了两半：设备和封测在涨，中微公司涨5.8%，北方华创涨4.8%，中科飞测涨9.0%，通富微电涨6.9%；光模块、PCB和存储在跌，中际旭创跌7.5%，成交307.8亿元仍是全市场第一，新易盛跌5.5%，东山精密跌5.5%，沪电股份跌5.8%，长鑫科技跌3.5%。跌的这一半，正是和英伟达、韩国存储同一条产业链的股票。新能源接过了一部分资金，宁德时代涨4.4%，阳光电源涨4.9%，光伏设备11只涨停，和周三美股光伏ADR大全新能源涨9.9%、阿特斯涨6.7%同步。 A股与港股复盘 2026年11月5日 研究笔记 · 不构成投资建议 第 4 / 11 页 上证收3,690点，盘中最高3,702点，正好碰到20日均线（布林中轨）3,702点，没有站上去，收在中轨下方12点；布林下轨3,583点、上轨3,820点。50日均线3,826点、100日均线3,894点和200日均线3,987点都在上方。创业板指在20日均线2,677点下方约4%，科创50在20日均线1,311点下方约2%，盘中一度站上，收盘又回到下方。 今天涨停84只，周三是118只；炸板48只，封板率约64%，周三约78%；跌停0只。涨停最多的是光伏设备（11只），其次是专用设备、半导体（各4只）和广告营销、电网设备（各3只）。连板最高4板，是闽发铝业和浙文影业。 代码 名称 收盘 当日 驱动 688361 中科飞测 269.00 +9.0% 半导体检测设备，成交67.3亿元 002156 通富微电 45.25 +6.9% 芯片封测，成交67.6亿元 688012 中微公司 254.00 +5.8% 刻蚀设备，成交121.0亿元，收盘后公告回购 300274 阳光电源 85.14 +4.9% 光伏逆变器与储能，成交130.5亿元 300750 宁德时代 264.06 +4.4% 动力电池，成交184.0亿元 688002 睿创微纳 129.40 −15.4% 红外芯片，成交36.8亿元，收盘后实控人提议回购 300308 中际旭创 493.33 −7.5% 光模块，成交307.8亿元 002463 沪电股份 81.00 −5.8% PCB，成交85.1亿元 300502 新易盛 185.61 −5.5% 光模块，成交217.3亿元 002384 东山精密 89.10 −5.5% PCB与光模块，成交159.7亿 图表、做视觉数学推理，还能直接操作电脑。 6. 卖方：民主党大佬们都是满手ai持仓。特朗普不会签署限制AI的法案，而且民主党也没有足够多的席位来推翻总统否决权。（问题是大佬持仓大头其实并不是资本开支方向） 7. 卖方：科技巨头自行解决供电需求的动力进一步增强，利好SOFC。（美股be跌了） 8. 黄河旋风全面调升培育钻石毛坯出厂售价10%。 9. 卖方：国产算力关注二线芯片交付兑现：三季报拐点坐实，订单外溢与超节点交付共振。 10. 磷化铟：2—3 英寸衬底价格已率先回落，4—6 英寸有效产能缺口仍在七成左右，真正的过剩考验大概率会推迟到 2030 年前后。 11. 马斯克再抛狂言：AI算力将100%搬上太空。到2028年底至2029年，轨道AI算力有望追平甚至超越地面新增算力；再往后，地面计算将显得“微不足道”。 物理ai： 1. 王兴兴：明年是机器人行业临界点，具身智能很快就会迎来“ChatGPT时刻”，但最大的问题还是AI模型的输入输出与真实世界的对齐还差了一点。 2. 京东未来五年采购300万台机器人。 3. 市场担心民主党利空马斯克，进而利空特斯拉，不过此次交易的主要是其他大厂都入局具身智能。 新能源： 1. 民主党掌管国会 → 清洁能源抵免不再收紧 → 政策环境改善 → 太阳能、储能、核电估值修复。更多加微WUXL3408 2. 卖方：26年预计大储装机230-250GWh，从开工情况看，12月并网有望达到100GWh。预计2027年国内新型储能达300GWh，结构上增量主要来自风光配储及绿电直连。 医药： 1. 中国生物制药宣布与勃林格殷格翰签署战略选择权及许可协议，里程碑合计最高70亿美元。 2. 诺和诺德口服减肥药大卖，并公布了全年销售额和利润预期区间，预计全年按固定汇率计算的调整后销售额增长率为-2%至+2%，市场预期增速为-2.35%。 有色： 1. 民主党胜选→实际利率下行 → 美元走弱 → 避险需求上升 → 金价上行。财政受限+财政纪律 → 利差优势收窄，但美元信用提升。 2. 民主党胜选→AI 立法受阻+铜的进口税可能被搁置 → AI 用铜增量下修 +成本下降→ 需求预期降温 → LME 铜承压。 策略观察： 1. 今日成交20521亿，增量3365亿。从结果看，大哥应该是算好了，中选落地就猛干，所以熊反提前了，那就先不管持续不持续，跟着冲就完了，第二天再去弱存强，指数应该是需要震荡下再上，做结构吧。 2. 板块方面，电子、通信和有色领涨，好久没见到顺指数三剑客了，死去的记忆回来了。如果费半还是延续目前的走势，明天硬件还是承压的，美股交易的还是数据中心建设受挫逻辑，海外链本身今天也是偏跟随的反抽。 3. 题材方面，民主党概念集体拉升，新能源，创新药、黄金、国产科技等等，毫无疑问强度最高的是国产科技，其他轮动拉升吧，逻辑都有，但没有排他性，而且都偏主题交易，所以交易筹码结构为主，轮动预期。Ai硬件下午也抢筹修复，但是看强度也仅是反抽。机器人和传媒这两个本来没反弹前就涨了，提前押反弹，可惜指数反弹，资金下午都去超跌了，机器人有马斯克的情绪利空，正好跟别的线的抢筹比起来，显得有分歧，结果晚上特斯拉也没跌多少，此外还有spacex算力要上天的概念，毕竟地面容不下了，这个和光伏设备叠加，但spacex应该真是被民主党利空到。#文字观点", "publish_time": "2026-11-05 07:23", "tags": ["文字观点"]}, "post:2026-11-05T09-58:af0347708cf4": {"id": "post:2026-11-05T09-58:af0347708cf4", "kind": "post", "title": "2026-11-05 09:58", "source_label": "帖子正文", "excerpt": "【CICC】Morning Call 261105 ——策略—— 【反弹能延续吗？】 外部不确定性下降，A股稳市机制不断加码，积极信号明显增加。", "content": "【CICC】Morning Call 261105 ——策略—— 【反弹能延续吗？】 外部不确定性下降，A股稳市机制不断加码，积极信号明显增加。我们认为超短期不排除行情仍有一定波折，但市场阶段低点可能正在过去，当前至12月A股有望迎来修复行情。 【主党“横扫”的资产含义】 短期市场侧重以“纠偏”（军事、美联储、关税）为目标的制衡，美股仍有支撑，而美债利率和美元小幅走弱。但随着时间推移，“为反对而反对”的干扰风险（财政、AI）逐渐显现 ——宏观—— 【横扫之后：美国中选落地的三重影响】 我们维持此前判断，选举落地或推动政策不确定性下降，对市场而言构成风险出清契机。 【增长强劲，通胀平稳——中国香港2026年3季度经济点评】 2026年三季度，中国香港实际GDP预估同比增长5.2%，较二季度增速加快1.0个百分点，季调环比增长1.9%，整体呈现持续回升趋势。 ——专题研究—— 【三季度纯债基金贡献多数增长，债基久期拉长、金融信用债持仓占比上升】 权益市场走弱下，主动纯债和指数债券基金成为主要增长来源，背后资金或多来自于理财。金融信用债占比上升，利率债久期继续拉长，背后与利率债走强，机构加大金融债投资有关 ——个股—— 【00325.HK(布鲁可)观点聚焦】 出海提速，品类进阶。我们认为布鲁可已进入海外成长的提速期，业绩兑现度明显增强。我们在本篇报告中对公司全球市场空间、海外各市场渠道特征、竞争格局进行了系统梳理。 ——行业—— 【中剧专题：从试验田到商业化突破】 近年来，长视频行业面对微短剧新势力围城，用户时长被分流，会员与广告收入增长乏力显现，亟待破晓时刻。中剧崛起补充生态，平台侧谋求变局。#文字观点", "publish_time": "2026-11-05 09:58", "tags": ["文字观点"]}, "post:2026-11-05T13-06:01eb7aa349fb": {"id": "post:2026-11-05T13-06:01eb7aa349fb", "kind": "post", "title": "2026-11-05 13:06", "source_label": "帖子正文", "excerpt": "【中信互联网】利率拐点叠加资金回流，看好本轮港股互联网超过7月修复行情宏观面：美债利率下行预期升温，外溢流动性利好港股。中期选举民主党横扫后，市场对财政扩张收敛与美联储进一步宽松的预期升温，美债利率存在快速下行的可能。", "content": "【中信互联网】利率拐点叠加资金回流，看好本轮港股互联网超过7月修复行情宏观面：美债利率下行预期升温，外溢流动性利好港股。中期选举民主党横扫后，市场对财政扩张收敛与美联储进一步宽松的预期升温，美债利率存在快速下行的可能。截至11月4日，恒生科技NTM PE为17.6x（Wind一致预期），处于近5年16.2%分位，低于7月行情启动前（6月30日）的18.2x、20.8%分位，当前性价比更为突出。全球流动性外溢下，对利率敏感度高、估值处于低位的恒生科技有望率先受益。资金面：配置低位叠加空头回补，交易层面边际流动性改善。据我们跟踪，恒科及互联网板块的整体配置仍处低位：外资主流仓位低配中国、且在中国资产内部低配互联网；南向资金四季度以来（截至11月4日）累计净流出104亿元，配置亦处低位。短期看，前期“long tech short internet”的对冲基金空头头寸存在回补需求，short cover带动交易层面边际流动性改善；中期看，流动性外溢过程中，两类长线资金均具备回补低配板块的动力。基本面：EPS修复进入兑现期，Q3/Q4业绩将提供明确验证。根据Visible Alpha一致预期，板块Non-GAAP净利润增速已于26Q2触底，26Q3/Q4主要互联网公司Non-GAAP净利润合计有望同比增长8%/37%；2026/27年头部互联网公司Non-GAAP净利润增速约6%/21%。即时零售等传统业务亏损明确收缩，随着本轮业绩季陆续披露，EPS上修既提供安全边际，也将成为行情延续的催化。历史类比：复盘7月，资金在波动中选择低估值、低配置方向，本轮驱动力更具持续性。7月硬件板块波动显著放大（SOX、KOSPI及存储龙头大幅回撤），资金自拥挤的硬件头寸流出，最终流向恒科与互联网。7月全月，恒生科技/港股互联网指数分别上涨8.0%/18.8%。此前7月行情的结束，主要源于市场对头部互联网公司融资的进一步担忧，以及硬件头寸的重新拥挤。本轮的核心驱动来自民主党中期选举大胜后的利率回调，属于相对慢变量、确定性更强，有望带来更长期且持续的资金回补。叠加当前恒科估值较7月行情启动前更低，我们认为资金将再度选择恒科与互联网。核心观点：利率下行带来流动性外溢，叠加空头回补、资金低配与EPS修复兑现，当前恒科估值低于7月行情启动前，且本轮利率驱动较7月更具持续性，港股互联网有望复刻并延续7月的收敛修复行情。继续看多港股互联网。#文字观点", "publish_time": "2026-11-05 13:06", "tags": ["文字观点"]}, "attachment:files/摩根大通-爱尔眼科-300015-3季度营收符合预期，净利润受减值及税负上升拖累.pdf": {"id": "attachment:files/摩根大通-爱尔眼科-300015-3季度营收符合预期，净利润受减值及税负上升拖累.pdf", "kind": "attachment", "title": "摩根大通-爱尔眼科-300015-3季度营收符合预期，净利润受减值及税负上升拖累", "source_label": "摩根大通", "excerpt": "中国 证券研究 2026 年11月2日 爱尔眼科 - A 中性 300015.SZ, 300015 CH 3季度营收符合预期，净利润受减值及税负上升拖累 ▼股价（ 2026 年11月2日）： 8.68 元 目标价（ 2027 年12月）： 9.50 元 之前（ 2027 年12月）： 9.70 元", "content": "中国 证券研究 2026 年11月2日 爱尔眼科 - A 中性 300015.SZ, 300015 CH 3季度营收符合预期，净利润受减值及税负上升拖累 ▼股价（ 2026 年11月2日）： 8.68 元 目标价（ 2027 年12月）： 9.50 元 之前（ 2027 年12月）： 9.70 元 证券研究报告 医疗健康 证券分析师 : 赵悦伦 , CFA AC (86-21) 6106 6256 eric.zhao@jpmorgan.com 登记编号 : S1730524050001 摩根大通证券（中国）有限公司 重要变更（财年 12月份结束） 旧 新 Δ 调整后的每股收益 - 26E (元) 0.29 0.27 -6.3% 调整后的每股收益 - 27E (元) 0.43 0.41 -4.0% 风格敞口 资料来源：风格敞口数据源自摩根大通全球市场策略团队；其他所有图表中的数据均为公司数据或摩根大通估算 分析师声明及重要披露，包括非美国分析师披露，见第 6页。 爱尔眼科报告 2026 年3季度收入 64亿元（同比增长 7.1% ），基本符合我们 的预期；归母净利润同比下降 11.6% 至9.41亿元，低于摩根大通预期。扣非 净利润同比下降 9.8% 至9.73亿元。业绩不及预期的部分原因是减值计提和 税负上升。公司 2026 年3季度确认资产减值损失约 1.5亿元（主要是商誉相 关），以及金融资产公允价值变动损失 2,800 万元。同时，实际税率从 2025 年3季度的 16.6% 上升至 2026 年3季度的 26.9% ，进一步拖累净利润，主要 系部分子公司税收优惠待遇发生变化所致。经营层面， 3季度屈光手术量企 稳（正如我们此前预期），价格持续改善；白内障手术量依然承压，部分被 高端自费项目占比提升所抵消；视光业务量持续增长，价格相对稳定。总体 而言，我们看到核心业务出现企稳的积极信号，但诊疗量尚未出现明确复苏 迹象。我们维持 “中性”评级，但将截至 2027 年12月的目标价从 9.7元小 幅下调至 9.5元。 •屈光手术量企稳，价格贡献增量增长。 继今年前期表现偏弱之后， 2026 年3季度屈光手术量同比基本持平，但尚未出现实质性复苏。单台手术平 均收入继续提升，我们估计增速为 5%左右，得益于术式结构改善以及高 价值术式渗透率提升。我们认为，鉴于屈光手术的可选消费属性，手术量 企稳是积极信号，但手术量增长提速仍需消费需求实现持续性复苏。我们预计 ，短期屈光手术收入增长仍将主要依靠客单价提升，而非手术量的显著反弹。 •白内障手术量依然疲弱，高端化支撑客单价。 据管理层披露， 2026 年3季 度白内障手术量继续下降。然而，随着高端自费治疗项目的营收占比提升 ，单台手术的平均收入持续改善。 •视光业务仍相对具韧性；老视提供新的增长机会。 2026 年3季度视光业务 量增速仍为各版块之首，均价基本保持稳定，是集团韧性相对较强的内生 增长来源。我们预计，近视防控及其他经常性眼健康服务需求将继续提供 支撑。同时，管理层看好老视相关治疗机会，预计该业务 2026 年将实现 约1亿元收入。虽然体量相对于集团整体收入基数仍然较小，但我们认为 随着认知度提升，老视治疗有望提供增量增长机会。 •模型更新。 鉴于 2026 年3季度营收表现基本符合预期，我们对收入预测 不作重大调整。但受减值计提及税负上升影响，盈利能力弱于预期，因此 我们将 2026 年每股收益预测下调 6.9% ，2027 年每股收益预测下调 4.65% 。我们仍不确定核心屈光业务手术量的复苏时点，但确实认为海外业务的 上行空间以及视光业务的贡献，将有助于公司应对当前疲软的消费环境。 我们维持 “中性”评级，但将截至 2027 年12月的目标价从 9.7元小幅下 调至 9.5元。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2 中国 证券研究 2026 年11月2日 赵悦伦 , 疗的需求韧性保障了行业的稳健增长。爱尔眼科凭借先 发优势建立的品牌声誉是其竞争力的基石，而其竞争优势还包括全国 900多家 医院和诊所的网络布局带来的规模经济效益，以及有效的骨干医生留任策略。 不过，我们认为该股估值合理；需等待有证据表明择期手术需求出现拐点后， 才会转为积极看法。评级为 “中性”。 估值 我们截至 2027 年12月的目标价为 9.5元，基于现金流折现估值法得出，其中 假设市场溢价为 6.2% ，无风险利率为 3.8% 。我们假设贝塔系数为 1.30（来自 彭博），加权平均资本成本为 11.0% 。我们估算了截至 2033 年的自由现金流， 并假设永续增长率为 3%。 WACC 假设 无风险利率 3.8% 市场风险溢价 6.2% 贝塔系数 1.30 权益资本成本 11.8% 债务资本成本 4.0% 资产负债率 10.0% WACC 11.0% WACC 11.0% 永续增长率 3.00% 终值的现值 61,549 现金流的现值 28,647 企业价值 90,196 截至 27年年底的净现金及现金等价物 5,717 长期 +短期债务 (2,502) 股权价值 88,696 截至 27年12月的目标价 每股目标价（元） 9.5 在外发行股份总数（百万） 9,327 注：数据单位为百万元，除非另有说明 资料来源： Bloomberg Finance L.P. （2026年10月30日）、摩根大通估算 影响评级与目标价的风险 我们的评级和目标价面临的主要下行风险包括： 1）商誉减值； 2）眼科服务定 价的监管审查严格； 3）潜在的医疗纠纷和客户投诉； 4）网络扩张的执行风险； 5）来自本土竞争对手的竞争加剧。 主要上行风险包括： 1）并购整合好于预期，新医院爬坡快于预期； 2）利润率 表现好于预期； 3）屈光手术的复苏速度快于预期，海外扩张取得突破。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 4 中国 证券研究 2026 年11月2日 赵悦伦 , CFA (86-21) 6106 6256 eric.zhao@jpmorgan.com 爱尔眼科 - A: 财务数据概览 损益表 FY24A FY25A FY26E FY27E FY28E 现金流量表 FY24A FY25A FY26E FY27E FY28E 收入 20,983 22,353 23,545 26,248 29,399 经营活动现金流 4,882 5,973 4,364 5,843 6,648 售出商品成本 (10,887) (11,822) (13,050) (14,476) (16,197) 其中：折旧和摊销 1,594 1,779 1,928 2,081 2,230 毛利润 10,096 10,531 10,495 11,772 13,201 其中：营运资本变动 (11) 202 45 (53) (54) 销售费用、一般性费用及管理费用 (5,141) (5,358) (5,078) (5,556) (6,105) 调整后的息税折旧摊销前利润 6,403 6,380 6,663 7,973 8,997 投资活动现金流 (2,848) (3,096) (3,201) (3,016) (3,179) 折旧和摊销 (1,594) (1,779) (1,928) (2,081) (2,230) 其中：资本支出 (1,757) (1,876) (1,932) (1,990) (2,050) 调整后的息税前利润 4,809 4,601 4,735 5,893 6,767 占销售收入比重 8.4% 8.4% 8.2% 7.6% 7.0% 净利息 (160) (198) (298) (322) (321) 调整后的税前利润 4,594 4,425 4,437 5,571 6,446 融资活动现金流 (2,734) (2,952) (2,131) (1,437) (1,733) 所得税 (858) (952) (1,689) (1,393) (1,612) 其中：支付的股息 (1,443) (1,564) (829) (921) (1,199) 少数股东损益 (180) (233) (192) (292) (338) 其中：发行股份数 /(回购数 ) 0 0 0 0 0 调整后的净利润 3,556 3,240 2,555 3,885 4,496 其中：发行的净债务 /(偿还额 ) 535 53 0 0 0 报告的每股收益 0.38 0.35 0.27 0.41 0.48 现金变化净额 (7 2%（2025年36.4%），技术端麒麟电池（CTP 3.0）、神行12C快充、M3P/钠电持续兑现。 比亚迪（BYD）20.2GWh（同比+4%），市占16.8%；LGES 13.2GWh（同比-5%），市占10.9%；松下5.3GWh（同比-22%）；三星SDI 1.5GWh（同比-58%，市占仅1.3%）。 高增二线：国轩（YTD +47%）、亿纬（+46%）、瑞浦（+92%）、正力（Zenergy +56%）——中系二线靠LFP规模+海外定点挤占日韩份额。 四、整车OEM：BYD销量承压但电池自供稳，零跑份额爬升 9月销量：BYD 30.9万辆（同比-22%）、特斯拉23.2万辆（+5%）、吉利11.3万辆（-4%）、零跑9.5万辆（+49%）。 品牌市占YTD：BYD 14.6%（2025年17.7%下滑）、特斯拉8.0%、吉利4.8%、零跑3.7%（从2025年2.5%跳升）。 车型端：Model Y 16.9万+Model 3 6.2万领跑BEV；吉利星愿5.5万、比亚迪元3.7万/海鸥3.1万跟进。 五、区域逻辑与评级映射 中国：补贴退坡+高基数+消费偏弱，2026国内零售预计-15%~-17%，但出口+50%~60%、EV批发+15%~17%；评级BYD、小米Outperform，小鹏/理想/蔚来Market-Perform，吉利Outperform。 美国：CVC税收抵免取消后需求断崖，9月-45%，同比底部临近但全年持平或负增；松下/SDI承压。 欧洲：BEV同比+60%（德国+94.7%），奔驰CLA、大众ID系列放量；轮胎/零部件端Continental、Michelin、Pirelli Outperform。 印度：10月e-2W注册22.4万辆（+52%），TVS/Bajaj/Hero领跑；e-PV 3.58万辆（+92%），Tata+M&M主导；供给约束大于需求约束。 日本/韩国：丰田、铃木Outperform；现代/摩比斯Outperform，起亚Market-Perform；SDI/LGES Market-Perform，EcoPro/Posco Underperform。 六、投资启示（投行视角） 储能电池是“弱销量里的强赛道”：需求价格弹性被单车带电量+LFP替代+海外本土化三因素对冲。 首选CATL（Outperform，A股目标480元）、天齐锂业（Outperform）；国轩/亿纬是增速alpha但需看海外合规与毛利率。 整车端谨慎：中国价格战未止，美国政策底未到，欧洲是阶段性顺风；零跑、吉利是份额赢家，BYD靠出海与电池外供托底。 风险：中国补贴进一步退坡、美国IRA执行收紧、LFP海外认证不及预期、PHEV需求结构性走弱、UMI式宏观信用压缩外溢到汽车金融。#文字观点", "publish_time": "2026-11-05 16:42", "tags": ["文字观点"]}, "post:2026-11-05T07-25:31c216d3569b": {"id": "post:2026-11-05T07-25:31c216d3569b", "kind": "post", "title": "2026-11-05 07:25", "source_label": "帖子正文", "excerpt": "11月5日：新能源、节约战略、机器人与物理AI、黄金等概念股梳理 一、昨夜发酵消息精选。1、新能源：盘后，市场关注的焦点是美国中期选举，MZ党大胜，拿下参众两院。", "content": "11月5日：新能源、节约战略、机器人与物理AI、黄金等概念股梳理 一、昨夜发酵消息精选。 1、新能源：盘后，市场关注的焦点是美国中期选举，MZ党大胜，拿下参众两院。媒体解读普遍认为，MZ党大胜直接利好新能能源（光伏、电池、电网）。晚间，美股光伏板块爆发力更强，多数龙头涨幅 8%–15%；固态电池、电池/储能、燃料电池、风电等同步跟涨。 概念股：阳光电源、锦浪科技、德业股份、固德威、隆基绿能、通威股份、晶科能源、派能科技、华宝新能、赣锋锂业、金龙羽、潍柴动力、三环集团、亿华通、金风科技、明阳智能、禾迈股份、昱能科技、科士达、南都电源等。 2、节约战略：国家发展改革委等5部门印发《实施全面节约战略行动方案》。其中提到，到2030年，全面节约制度更加健全，资源利用效率明显提高，我国单位国内生产总值能耗、用水量、建设用地使用面积比2025年分别降低10%左右、10%、15%，粮食全产业链各环节损失率持续降低，主要再生资源年循环利用量达到5.1亿吨，进一步形成崇尚节约的社会风尚。 概念股：格林美、西子洁能、华光环能、冰轮环境、节能国祯、金科环境、中原环保、创业环保、路德环境、伟明环保、天奇股份、怡球资 费 K型分化，必选渠道领跑，可选与电子零售边际改善 9月美国平均时薪同比仅增 3.0%，跑输 CPI的3.7%；截至 4月，高收入家庭实际支出较疫情前 高7%，低收入家庭仍低 2%。 六家核心零售商最新财季营收合计增长 7.2%、净利润增长 5.7%，总量温和扩张的背后是业态 分层。 必选品渠道韧性最强。 Walmart最新财季营收增长 5.9%，Costco营收增长 11.1%、净利润增长 14.9%；Walmart净利润下降 9.4%主要受非经营损益摆动影响。消费者向低价、高周转渠道迁 移。 可选与电子零售边际修复。 Target最新季度营收增长 5.3%，净利润增长 100.8%，剔除关税退 税后仍增长 20%，并上调全年收入指引； BestBuy营收增长 3.6%，美国消费电子和家电可比 销售均转正。 03 2）细分品类对美出口回升，结构性需求转化为订单 家具链率先修复，中国对美家具出口 8-9月增速再度回升，美国家具和家居用品店零售额 9月 同比增长 4.9%，为4月以来首次转正。 04  Î¢WUXL3408 其他品类方面，空气压缩机对美出口 9 月同比增长 70.3% ，吸尘器对美出口 8 月、 9 月分别增长 54.7%和 55.2% ，锂离子蓄电池转为正增长。 清洁电器对美出口保持较快增长，， 2026 年 4-9 月中国吸尘器（含扫地机器人）对美出口均保 持正增长， 8 月、 9 月分别同比增长 54.7% 和 55.2% 。 05 3）需求向质价比集中，两条主线承接再平衡 美国当下经济正在经历低速扩张、通胀高位反复的阶段，消费结构呈现 K 型分化。市场需求向 具备价格竞争力、产品差异化及渠道优势的企业集中。中国企业依托成熟产业链、供应链效 率、产品迭代能力及海外产能布局，有望承接结构性需求并提升市场份额。有两条主线： 主线一，美国消费者对性价比及产品功能的关注度提升，部分消费电子、智能家居及清洁电 器需求出现边际改善。具备产品创新、品牌建设和海外渠道运营能力的中国企业，有望在细 分市场中持续提升竞争力。对应： 石头科技 、科沃斯、极米科技 、华宝新能 ； 主线二是具备供应链优势、海外产能布局及盈利改善逻辑的出海代工企业。对应：创科实 业、欧圣电气 、英科再生 、匠心家居 、乐歌股份 。 3、秋假带来 2610 万人次增量，基金持股降到 1.8% ，边际改善 + 低仓位，出行链 配置窗口开了 国泰君安研报指出，旅游数据有韧性但 “ 量增价弱 ” ：前三季度出游 53 亿人次、 +6.2% ，花费只 +2.2%。 酒店靠关低效店、提效率扛住利润（扣非 +13% 、毛利率 +1.3pct ）；景区被固定成 本拖累，利润中位数 -19.8% 。 秋假覆盖 8700 万学生，估算带来 2610 万人次、 252 亿消费，淡 季不再淡。 酒店、景区估值都在历史低位，基金持股降到 1.8% ，边际改善 + 低仓位，配置窗 口打开。标的： 锦江酒店 、首旅酒店 、九华旅游 、三峡旅游 。   1）秋假扩围至 15省，8700万学生客群补充淡季 2026年前三季度全国国内出游 53.07亿人次、同比增长 6.2%，总花费 4.95万亿元、仅增长 2.2%，人均单次花费约 944元、同比下降约 5%，量增价弱。民航三季度恢复增长，旅客运输 量约2.18亿人次、同比增长 3.7%，扭转二季度约 4.4%的下滑。 06 春假已经给出正向验证。江苏监测样本春假时段客流同比增长 33.32%，随后清明三天只有 10.6%；成都春假客流增长 21.9%，清明三天只有 3.9%，原本客流较低的工作日成了增长承 接时段。同程平台假期亲子占比约 40%、同比提升近 20个百分点，亲子长线订单同比翻倍。 秋假的增量空间更大。截至 2026年11月，已有 15个省级地区全域推行春秋假，多与周末衔接 成连续假期。估算覆盖义务教育学生约 8700万人，按 15%出游参与率、每名学生随行 1名家长 的中性情景，对应约 2610万人次出游和 252.1亿元消费，相当于近三年平均四季度规模的 1.90%、1.86%。 07 2）酒店直营调整兑现利润，业绩超市场预期 三季度天气扰动压制客流，酒店经营数据波动，但利润端先走出来了。 锦江酒店 、首旅酒店 扣非归母净利润分别增长约 13%、11%，毛利率分别达到 43.0%、46.6%，同比提升 1.3、1.8 个百分点，而两家收入增速只有约 4%、-6%。业绩超预期的核心驱动力来自直营门店关店和 升级改造，叠加 OTA佣金相关的销售费用率优化。 08  Î¢WUXL3408 直营改善是结构性调整的结果。锦江同店直营店 RP 景气向上即来自直营关店，关店和整改后 锦江同店直营店 RevP ”逐步切换至“业绩修复+创新驱动+全球化发展”阶段。", "content": "🔥医疗器械：进攻与防守兼顾，行业进入基本面拐点与估值修复并行阶段，建议积极配置！【中邮医药】我们认为，医疗器械行业正由前期“政策扰动”逐步切换至“业绩修复+创新驱动+全球化发展”阶段。设备更新政策持续推进，医院招投标明显边际改善，相关企业订单稳步增长；IVD方向，前期降价扰动趋于结束，头部公司国产替代有望加速，行业预计进入新发展周期；耗材集采政策导向由“降价”转向“稳价格、提质量、促创新”，行业估值压制因素持续缓解。与此同时，手术机器人、脑机接口、AI医疗等创新方向持续发展，AI4S对高通量实验、自动化设备及耗材的需求也值得重点关注。我们认为当前板块配置机会增加，行情或呈现龙头先行、结构扩散的特征。器械板块经过数年调整，负面因素趋于出清，且PE处于历史较低水平，存在较大提升空间。建议重点关注几条主线： 👉一是设备更新与国产替代。受益于政策推动及医院采购稳步恢复，重点关注超声、血透、生命支持、内镜等设备龙头。建议关注：迈瑞医疗、山外山、开立医疗、澳华内镜等。 👉二是创新医疗器械。重点关注手术机器人、高端影像、脑机接口等具备临床收费标准超预期和海外放量逻辑的企业。建议关注：天智航、联影医疗、微创机器人、美好医疗、翔宇医疗、伟思医疗、爱朋医疗等。 👉三是具备产品放量潜力的IVD企业。当前体外诊断降价风险基本出清，各省陆续发布检验类医疗服务价格改革征求意见稿，行业收费进一步规范化。头部IVD公司有望凭借规模化成本、产品菜单及合规等优势提升市场份额。建议关注：新产业、安图生物、亚辉龙、华大基因、诺禾致源、迪安诊断等。 👉四是AI4S上游基础设施及切入AI产业链标的。部分上游设备及耗材公司有望受益于AI4S高景气，传导链为干实验数据生成-湿实验验证-工艺开发-商业化生产。建议关注：华大智造、海尔生物、洁特生物、纳微科技、东富龙、楚天科技、奕瑞科技、华康洁净、海泰新光等。联系人：中邮医药团队 盛丽华/岑峻宇#文字观点", "publish_time": "2026-11-05 08:32", "tags": ["文字观点"]}, "post:2026-11-05T11-01:6dc1523817a7": {"id": "post:2026-11-05T11-01:6dc1523817a7", "kind": "post", "title": "2026-11-05 11:01", "source_label": "帖子正文", "excerpt": "最近两周跑遍了深圳上海的公募/险资/私募 路演了200多场场物理AI 客观总结了市场主流机构的观点 汇总如下：#对产业趋势的理解AI信仰者乐观派认为随着模型能力的提升、资本开支的不断投入，大脑问题有望逐步解决，看好机器人商业化进程，是coding之后最大的应用场景，后续催化很多，坚定optimus2", "content": "最近两周跑遍了深圳上海的公募/险资/私募 路演了200多场场物理AI 客观总结了市场主流机构的观点 汇总如下：#对产业趋势的理解AI信仰者乐观派认为随着模型能力的提升、资本开支的不断投入，大脑问题有望逐步解决，看好机器人商业化进程，是coding之后最大的应用场景，后续催化很多，坚定optimus28年实现百万台目标；中性者认为边走边看，逢低配置，从V3视频、明年上半年量产进展逐步验证跟踪；悲观派认为大脑问题无法解决，只能用于重复性的特定场景，泛化能力难以解决，属于主题炒作，看不到AI应用下个大的产业机会，但属于少数，绝大部分买方投资者还是中性&乐观#对方向的理解数采需求是共识，世界模型的核心是高质量长时间的第一视角数据，市场空间很大，百亿小时对应就是数亿级别市场，北美一级公司maxinsightsARR暴增是需求的作证，是大模型厂商&具身公司必须的资本支出；数据采集的壁垒市场有所质疑，理论上购买设备+人工采集+数据处理都能够下场，核心壁垒是匹配客户对数据的需求，能够稳定产出高质量视频对抗通缩，但无法有效估值和定义能力的好坏，选股聚焦目前产生规模化订单或者绑定大厂的公司（海天&凡拓）；数采设备的需求持续性有所分歧，市场担心作为一次性支出未来订单持续性，重点聚焦价值量大且份额高的公司（奥比）；本体聚焦宇树和智元；垂类场景公司很多，涉及搬运、上下料等多场景，选股难度较大，需要从算力部署、硬件能力、模型能力等多方面综合考量壁垒#Oai链需要持续跟踪O同时推进两种方案，一种是仅配备两条手臂、摄像头，采用支架、无腿甚至无轮子的简易版本；另一种是人形，最终形态需待高层拍板；大脑模型自主研发核心优势，硬件环节同时自研并调研外部本体方案；数采方面，O验证流程为先完成5台以上样机的精度、可靠性验证，再下发20-50台以内订单用于数采准备，目前O供应链没有定型，以前期送样炒作为主，重点配置壁垒深且主业O占比较高的标的（兆威等）#机构配置的思路这一波物理AI短期涨速较快，目前我们三地路演完，了解到大部分公募机构处于仓位极低偏踏空的状态，参与者还是以私募、游资为主，后续机构会在分歧的时候陆续调整仓位增加对机器人板块整体的配置，优先配置的方向还是以T链核心标的为主，其次平铺一些数采核心标的；配置逻辑比较简单，27年重点配置的方向一定是科技前周期方向，最好是0-1阶段，28年之后还能看到5倍10倍增速的，目前符合这个特征的有机器人、玻璃基板等#我们对投资机会的理解①产业趋势和业绩兑现没有问题。每家T链核心标的的排产指引和ASP都很明确【斯菱：12月周1k+后续5k-1w台|福赛：10月2k27Q1 4-5k台】；②大脑商业化最大难题，保持信心。模型能力提升在coding的边际效益会逐步下降，北美1.5万亿capex有望在具身取得加速突破，明年有望在对数据参数要求较低的小场景逐步实现落地；③筹码层面，目前配置比例依然非常低，交流下来后续从科技硬件中流出的资金会择时增加对机器人+传媒的配置；④回撤方面，后续板块催化非常密集，包括T的进展、模型的进展等，即使短期被套也不用慌，重点是买对确定性高赔率标的#文字观点", "publish_time": "2026-11-05 11:01", "tags": ["对产业趋势的理解", "对方向的理解", "Oai链需要持续跟踪", "机构配置的思路", "我们对投资机会的理解", "文字观点"]}, "post:2026-11-05T08-56:131eb713937a": {"id": "post:2026-11-05T08-56:131eb713937a", "kind": "post", "title": "2026-11-05 08:56", "source_label": "帖子正文", "excerpt": "📑过去 12 小时的一些讨论点 💹盘面与资金 📌1/ 这次轮动，已经超出选举后的短暂反弹 💡过去 12 小时，讨论从 “得州会不会限制数据中心”，推进到 “谁的远期盈利需要下修、哪些公司能留下现金流”。💡云厂商、互联网、消费、医疗和住宅相关资产获得关注", "content": "📑过去 12 小时的一些讨论点 💹盘面与资金 📌1/ 这次轮动，已经超出选举后的短暂反弹 💡过去 12 小时，讨论从 “得州会不会限制数据中心”，推进到 “谁的远期盈利需要下修、哪些公司能留下现金流”。 💡云厂商、互联网、消费、医疗和住宅相关资产获得关注；半导体、数据中心工程和供电链持续承压。交易后段仍出现抛售，早盘反弹没有解除 AI 基建链的压力。 💡资金开始同时交易两件事：降低新增建设敞口 + 减少对高预期、拥挤持仓的依赖。 💡但多云厂商、空半导体此前已在部分策略中流行。方向对，不代表现在仍有同样的回报空间。 🤔分歧与判断 💡本期验证的是相对强弱，尚未证明弱势资产已完成出清。 💡交易方向得到盘面支持，但成立的原因，分歧反而更大。 💹订单与盈利 📌2/ 半导体的核心问题，正从审批转向 2028 年盈利 💡空头最强论据：模型公司收入增速放缓 → 新增算力需求预期下降 → 云厂商调整资本开支 → 半导体远期盈利下修。得州只是进一步降低悲观情景的概率。 💡这比项目暂时批不下来更严重。审批延期可以迁址、补建；如果最终需求不足，换地方也解决不了。 💡多头反驳：部分公司已大幅下跌，建设放缓早已被交易。需求若只是递延，周期可能延长，而非结束。 💡某些产品仍供不应求，即使总建设量下降，也未必立刻过剩。电力更稀缺，还可能提高高能效芯片的相对价值。 💡新的追问落在现金流：下行周期里，库存、应收和扩产支出会怎样变化？低市盈率如果用了偏高的盈利分母，就不足以证明便宜。 🤔分歧与判断 💡当前价格反映了温和减速，还是连一次明显的盈利下修也已消化？ 💡远期周期更长，未必能抵消近期订单后移；但盈利下修多少，也不能只凭悲观情绪推断。 💹建设与交付 📌3/ 数据中心延期，开始出现具体项目证据 💡一则被转述的 Business Insider 报道，把微软第三方基础设施交付延迟，与 IREN、Nebius 相关项目联系起来。 💡报道引用卫星分析，质疑 IREN 得州项目的设备安装进度；也提出 Nebius 在新泽西的部分容量可能推迟至 2027 年。 💡这些属于报道及研究机构判断，尚不能等同公司确认取消。 💡风险从政治口号落到具体环节：许可、发电设备、冷却、接电和验收，任何一项都能改变交付时间。 💡多头仍认为，就业、税收和地方经济利益会推动妥协，最终可能增加成本与附加条件，而非全面停建。 💡反方指出，部分地区的反对诉求本身就针对数据中心，不能假定所有问题都能靠多付钱解决。 🤔分歧与判断 💡项目最终会建，与原有收入确认时间还能不能成立，是两道题。 💡需要进一步区分交付延迟、采购缩减和项目取消。 💹存量算力与现金流 📌4/ 云厂商上涨：利润改善，还是资金寻找安全？ 💡乐观解释：建设放慢 → 少花资本开支；存量算力稀缺 → 定价更强；两者共同改善自由现金流。 💡这条链受到更直接的质疑：既有合同能否迅速重定价？少建产能会损失多少云收入？少投入的钱，为什么一定会用于回购？ 💡另一种解释更朴素：大型科技公司近期盈利较扎实、业务多元、融资能力强，资金愿意用它们替换更脆弱的远期增长敞口。 💡Neocloud 没有普遍受益，也说明算力稀缺不足以解释所有价格变化。融资、项目进度和合同结构，仍决定谁真正能赚到钱。 🤔分歧与判断 💡多云厂商、空半导体可以成立，不必同时相信所有乐观条件兑现。 💡算力大涨价、资本开支大降、回购马上恢复，需要各自证据。 💹收入门槛与核对 📌5/ Anthropic：预期没明显降低，传闻却跑得很远 💡本期讨论中的 10 月 ARR 门槛仍集中在约 740–750 亿美元，更乐观的期待接近 780 亿美元。这些是交易预期，非公司确认数据。 💡同时流传过 10 月约 800 亿美元及此前数月的 ARR 序列。但把这些数字与季度收入交叉核对后，序列的相容性受到质疑。 💡Ramp、OpenRouter 与云渠道信号也不完全一致，不能把某一渠道改善直接外推为全公司重新加速。 💡收入增长放缓，不等于模型公司马上负担不起算力。还要看付费推理、训练、毛利率，以及实际履行的采购承诺。 💡模型公司仍能正常经营，与半导体远期订单预期过高，可能同时成立。 🤔分歧与判断 💡下一次数据要比较真实买方门槛。 💡仅仅收入继续增长，未必足以扭转半导体交易；传闻、渠道推算和正式披露必须分开。 💹业绩与估值 📌6/ 互联网反弹，需要个股基本面来接力 💡一部分上涨是在撤回此前的 AI Agent 会迅速破坏现有业务的折价。AI 扩张慢一些，原有平台就多一些应对时间。这只能解释估值压力减轻，不能替代盈利增长。 💡DASH：交易执行与业务表现，是独立于宏观轮动的判断依据。 💡ABP：广告变现与盘后积极反应，说明市场仍会奖励拿出经营证据的成长公司。 💡SHOP：交易基础设施有长期价值，但仍需验证新增交易和利润贡献。 💡DDOG、NET：软件财报后的价格表现仍受到质疑。股价已跌很多，但买方业绩门槛究竟降了没有？ 💡MELI：暂不向第三方 AI 购物平台开放商品目录的表态，说明平台可能主动保护交易入口。Agent 渗透不完全由模型能力决定。 🤔分歧与判断 💡跌幅大和预期低，不是一回事。 💡AI 威胁减轻，也不等于业绩门槛容易跨过。 💹宏观与风险 📌7/ 伊朗、油价和黄金：轮动能否延续的重要条件 💡乐观路径：政治约束增加 → 冲突缓和概率提高 → 油价和通胀压力下降 → 消费、航空、住宅及部分互联网业务受益。 💡但民主党赢了、战争就很快结束的判断受到反驳。行政部门如何行动、伊朗是否接受条件，都不是选举结果能直接决定的。 💡住宅上涨有不同解释：利率预期、能源成本下降，以及数据中心建设放慢后释放劳动力，各条路径的兑现速度不同。 💡黄金多头押油价下降、利率环境改善及财政支出继续扩张；反方认为，这些条件仍需要逐项验证。 🤔分歧与判断 💡政策方向改变了概率分布，尚未把宏观风险变成确定利好。 📌接下来，盯住这些信号 ✅01 盈利预期是否真正下修 💡半导体若继续跌、盈利模型尚未调整，就不能仅凭借估值倍数判断出清完成。 ✅02 项目延期是否扩大到订单与回款 💡从晚交付升级为采购缩减，影响会更直接。 ✅03 云厂商现金流改善有没有数字支持 💡需要资本开支、增长、利用率和价格共同验证。 ✅04 Anthropic 数据能否超过门槛 💡买方期待仍然较高，传闻、渠道推算与正式披露要分别看。 ✅05 价格能否先止跌，再出现叙事变化 💡悲观报告密集发布，可能意味着情绪拥挤，但它本身不是底部信号。#文字观点", "publish_time": "2026-11-05 08:56", "tags": ["文字观点"]}, "attachment:files/中信建投-通信行业：北美CSP资本开支维持高强度，AI商业化驱动云业务加速增长-261102.pdf": {"id": "attachment:files/中信建投-通信行业：北美CSP资本开支维持高强度，AI商业化驱动云业务加速增长-261102.pdf", "kind": "attachment", "title": "中信建投-通信行业：北美CSP资本开支维持高强度，AI商业化驱动云业务加速增长-261102", "source_label": "中信建投", "excerpt": " 元略降， 主要反映交付节奏调整，整体投资规模仍处高位。我们持续看好 AI发展带来的算力需求，维持对北美算力产 业链和国产AI算力产业链的长期看好。 亚马逊2026年三季度购置物业及设备支出约 773亿美元，同比增长120.1%、环比增长42.5%；扣除物业 设备出售及激励回款后的现金资本开支约 759亿美元。AWS三季度收入达到460亿美元，同比增长39. 3%、环 比增长8.9%，增速进一步提升。公司维持 2026年现金资本开支约2200亿美元的预期，持续投入 AI及云基础 设施。管理层预计AWS收入在2027年及2028年均有望增长超过40%，体现其对中期云计算及 AI需求的积极 判断。 微软2026年三季度（FY2027Q1）含融资租赁资本开支达到 452亿美元，同比增长约 29.5%、环比增长 10.2%，其中约四分之三用于 CPU、GPU及相关内存、存储等短周期资产。当季融 资租赁金额约74亿美元， 现金购置物业及设备支出约 394亿美元。受部分第三方产能交付延迟影响，公司将 2026日历年资本开支预期由 1750亿美元调整至1700亿美元，并预计下一季度资本开支超过 500亿美元、FY2027下半年投入加速，部分延 迟产能亦将于届时交付。同期 Microsoft Cloud收入约639亿美元，同比增长30%，Azure收入增长48%，客户 需求仍超过可用供给。 谷歌2026年三季度资本开支达到 514亿美元，同比增长114.4%、环比增长14.3%，继续扩大AI技术基础 设施投入。Google Cloud收入达到307亿美元，同比增长102.6%、环比增长24.0%，主要受企业AI基础设施、 AI解决方案及核心GCP服务增长推动，TPU系统销售亦贡献增量。公司维持 2026年资本开支1950—2050亿 美元的指引，并预计 2027年资本开支仍将显著增长。面对算力供给约束，公司开始使用第三方算力作为内部 产能扩张期间的补充，相关投入及折旧增加也将对短期利润率形成一定压力。 Meta2026年三季度含融资租赁本金支付的资本开支达到 349亿美元，同比增长80.2%、环比增长12. 3%， 其中购置物业及设备支出约 339亿美元。公司将全年资本开支指引由 1300-1450亿美元收窄至1350-1450亿美 元，中值由1375亿美元提升至1400亿美元，继续支持核心业务及新兴 AI项目。同期公司总收入达到 646亿美 元，同比增长26.1%；管理层表示，AI投资已通过提升用户参与度、推荐效果及变现效率带来增量广告收入， 并预计2027年仍将积极投入，具体预算与产能计划尚在制定中。 下载日志已记录，仅供内部参考 2 通信 行业动态报告 请务必阅读正文之后的免责条款和声明。 图表1： 海外CSP厂商资本开支情况（百万美元） 资料来源：亚马逊，微软，谷歌，Meta，中信建投 二、推荐标的 上期投资组合“中际旭创、新易盛、光迅科技、工业富联、移远通信 ”，相同权重测算平均 下跌17.61%， 跑输通信(申万)指数2.84pcts，跑输沪深300指数14.70pcts。 图表2： 上期推荐投资组合涨跌幅（ %） 资料来源：Wind，中信建投 -60%-40%-20%0%20%40%60%80%100%120%140% 050000100000150000200000250000亚马逊微软谷歌Meta亚马逊YoY微软YoY谷歌YoYMetaYoY -9.73 -24.90 -20.24 -7.88 -25.32 -17.61 -30.00-25.00-20.00-15.00-10.00-5.000.00 中际旭创新易盛光迅科技工业富联移远通信平均 下载日志已记录，仅供内部参考 3 通信 行业动态报告 请务必阅读正文之后的免责条款和声明。 图表3： 历史推荐组合、沪深300及通信（申万）指数当周收益率对比（ %） 资料来源：Wind，中信建投 本期推荐：中际旭创、新易盛、光迅科技、工业富联 、移远通信。 三、持续关注 AI算力与云计算（中际旭创、新易盛、天孚通信、源杰科技 、联讯仪器、仕佳光子、 工业富联、鼎通科技、 华工科技、光迅科技、锐捷网络、 润泽科技等）；运营商（中国移动、中国电信、中国联通）； 光纤光缆（长 飞光纤、亨通光电、中天科技、烽火通信、杭电股份 等）；军工通信与卫星（ 七一二、海格通信、铖昌科技、 华测导航、上海瀚讯等）；液冷（英维克等）；智能控制器（拓邦股份、和而泰等 ）；物联网模组（广和通、 移远通信、美格智能）；工业互联网（宝信软件、三旺通信、映翰通等） ；云通信（亿联网络） 等。 四、行情回顾 本期通信板块有所回调。通信（申万）指数下跌14.77%，跑输沪深300指数11.85pcts。二级子行业（申 万 （C114通信网） 【华为发布VitaAAU：让容量与覆盖可以兼得，为 U6GHz商用注入关键动力】U6GHz正在从频谱规划走向商 用部署，华为无线产品线总裁方向在 2026年分析师看东方（Decoding China）活动上发布新一代 VitaAAU，面 向U6GHz频段给出百级通道（ 256TRx）、千级天线阵子和 TTI级高速波束扫描的系统方案。产品名中的 “Vita” 在拉丁语中意为“生命”，华为希望这款AAU为U6GHz的大带宽商用注入活力。 U6GHz覆盖6425-7125M Hz， 拥有700MHz连续频谱资源，是5G-A向6G演进的重要候选频段。移动 AI、沉浸式体验和更大规模并发连接 对无线容量提出更高要求，现有中频频谱面临扩容压力。 U6GHz的700MHz连续带宽可以带来容量跃升，但频 段升高也带来传播损耗和穿透能力下降。如何通过大规模天线阵列弥补覆盖差距，同时控制设备体积、重量和 能耗，成为U6GHz规模部署需要解决的工程问题。 VitaAAU搭载RetinaMIMO技术。RetinaMIMO得名于视网 膜捕捉精细视觉信息的能力，华为用它来强调波束控制的精度和密度。从 ELAA MIMO向RetinaMIMO演进， 天线阵列从百级阵子发展到千级阵子，收发通道达到百级规模 ，通过动态移相配置实现 TTI级波束扫描。相比 业界1024振子传统方案，新设备的覆盖范围能力提升 30%。阵列扩大还会增加馈线损耗。华为采用 3D立体阵 列架构，配合材料和工艺上的积累、突破，天线增益提升 2dB，为U6GHz与C-Band共站、同覆盖部署提供支 撑。华为公布的评估结果显示， VitaAAU在U6GHz 400MHz带宽下下行峰值18Gbps、上行2Gbps，覆盖能力 对齐C-Band。阿联酋运营商基于 VitaAAU，在350MHz频谱上实现下行超过 10Gbps的峰值。目前，VitaAAU 已在阿联酋、中国香港和澳门等市场启动商用部署。 （C114通信网） 卫星互联网 【中国航天科技集团成立卫星通信子公司 ，完善产业链条】近日，航科卫星通信科技（北京）有限公司成立， 法定代表人为刘晓旭，注册资本为 5000万元。公司经营范围包含：集成电路设计；电子专用设备销售；通信 设备制造；通信设备销售；卫星通信服务；光通信设备制造等。 股权穿透显示，该公司由中国航天科技集团有 限公司旗下中国航天科技集团商业卫星有限公司全资持股。中国航天科技集团是我国战略高技术领域的特大型 国有企业，是国家安全战略基石和航天强国建设的主力军。据悉， 2024年9月，中国航天科技集团成立了注册 资本12亿元的商业卫星公司，经营范围同样涵盖卫星通信服务及通信设备制造。此次新设卫星通信科技公司， 或进一步整合卫星通信产业链资源。从经营范围来看，新公司将重点聚焦于卫星通信设备制造、光通信设备、 集成电路设计等关键环节，显示出航天科技集团正致力于向上游核心元器件及通信硬件制造环节延伸，提升卫 星通信产业链的自主可控能力。 （C114通信网） 量子科技 【国家管网集团量子项目入选首批国家标志性重大应用场景项目 】国家发展改革委会同科技部、工业和信息化 部、人力资源社会保障部、应急管理部、国务院国资委等部门推出首批 136项标志性重大应用场景项目清单， 下载日志已记录，仅供内部参考 6 通信 行业动态报告 请务必阅读正文之后的免责条款和声明。 为新技术新产品规模化应用等提供广阔场景空间。首批标志性重大应用场景项目对国务院部署的新领域新赛道、 产业转型升级、行业领域应用、社会治理服务、民生领域等五大类型应用场景实现全覆盖，涉及新技术 1700 余项、新产品1200余项、新标准规范2200余项，呈现领域分布新、参与范围广、改革举措多等特点。相关项 目将强化场景资源开放，通过向民营企业和中小企业公开发布拟验证的新技术、新产品、 新业态清单等方式， 为各类经营主体提供场景验证机会。具体项目名单未见公布，从目前各地方、各机构已公开的项目来看，有两 个量子科技相关项目成功入选。其中，国家管网集团入选的战略基础设施应用场景，聚焦油气管网等关键基础 设施风险防控，由国家管网集团联合中国南水北调集团、中信银行、中国电子、国家级新型互联网交换中心， 向社会开放十万公里油气管道光纤、千公里级水网光纤，一批全国性金融网络中心、国家新型互联网交换中心、 重点能源储运基地等场景资源，融合量子科技、智能原生、工业操作系统、可信空间等前沿技术，以市场化模 式打造“面向未来的量子网络”和“人工智能原生的基础设施信息体系”两类系统性场景，全面提升国家战略 基础设施安全。国家管网集团即国家石油天然气管网集团有限公司，经党中央、国务院批准，于 2019年12月 9日正式挂牌成立，总部设在北京。 2 变， 3季度利润率更强劲与持续的价格和汇兑压力之 间形成对冲。我们认为领益的增长前景保持完好，原因是高利 润率的智能手机项目推动核心利润稳健增长，同时立敏达 /机器 人业务带来上行空间。控股股东曾女士拟增持 1-2亿元人民币的 领益 -H股份，这进一步表明了对公司增长的信心。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2 中国 证券研究 2026 年11月2日 刘叶 (86-21) 6106-6200 ye.liu@jpmorgan.com 股价表现 年内迄今 1个月 3个月 12个月 绝对 - -8.7% -29.0% - 相对 - -3.3% -19.1% - 公司数据 已发行股票数（百万） 8,167 52周股价区间（港元） 11.80-4.52 总市值（百万美元） 5,268 汇率 7.84 自由流通股比例 47.5% 三个月日均成交量（百万） 10.74 三个月日均成交额（百万美元） 8.3 波动性（ 90天） 68 指数 HSI 彭博 买入 |持有 |卖出 - 重要指标（财年 12月份结束） 单位：百万元，每股数据单位：元 FY25A FY26E FY27E FY28E 财务预测 收入 51,429 61,929 73,077 84,650 调整后的息税前利润 3,053 3,829 5,962 7,509 调整后的息税折旧摊销前利润 6,099 6,383 8,406 9,777 调整后的净利润 2,288 3,035 4,591 5,725 调整后的每股收益 0.32 0.37 0.56 0.70 彭博一致预期每股收益 - - - - 经营活动现金流 4,433 3,622 5,238 11,084 公司自由现金流 (400) (1,173) 667 7,308 利润率和增长率 收入增长率 16.2% 20.4% 18.0% 15.8% 息税前利润率 5.9% 6.2% 8.2% 8.9% 息税前利润增长率 20.6% 25.4% 55.7% 25.9% 息税折旧摊销前利润率 11.9% 10.3% 11.5% 11.5% 息税折旧摊销前利润增长率 21.7% 4.7% 31.7% 16.3% 净利润率 4.4% 4.9% 6.3% 6.8% 调整后的每股收益增长率 30.3% 14.6% 51.3% 24.7% 财务比率 调整后的有效税率 14.9% 13.3% 13.5% 13.5% 利息覆盖倍数 20.3 27.9 31.4 42.9 净债务 /净资产 0.3 0.2 0.2 0.0 净债务 /息税折旧摊销前利润 1.3 1.1 0.9 0.1 净资产收益率 10.4% 10.6% 13.2% 14.8% 估值 公司自由现金流收益率 (1.3%) (3.3%) 1.9% 20.8% 股息率 6.5% 5.5% 10.4% 15.8% 企业价值 /收入 0.8 0.7 0.6 0.4 企业价值倍数 6.9 6.6 5.0 3.7 调整后的市盈率 13.2 11.6 7.6 6.1 投资理据和估值概要 领益智造 -H是具备专业精密制造能力的一体化解决方案 提供商，持续布局多项由 AI驱动的结构性增长机遇。公 司与消费电子领域的全球科技龙头建立了稳定合作关系， 同时不断拓展服务器和机器人业务。我们预计 2025-28 年 盈利年复合增长率为 36%，支撑因素包括： 1）苹果产品 的韧性需求； 2）领益在常规机型和可折叠机型中的价值 量和钱包份额不断提升； 3）立敏达和机器人业务放量带 来增量利润。我们预计 2026 年下半年强劲的盈利将成为 股价催化剂。维持 “增持”评级。 我们截至 2027 年6月的目标价为 11.0港元，基于 15倍的 12个月滚动动态市盈率，与全球同业均值持平（基于摩根 大通和彭博一致预期）。 股价表现驱动因素 资料来源：股价表现驱动因素数据源自摩根大通全球市场策略团队；所有其他图表中的数据均源自公司数据、 Bloomberg Finance L.P. 和摩根大通估算。注：历史股价可能不完整或 不准确。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 MAwWnMqOzRzRaQcM7NoMqQoMrPkPoPoPlOqQnO9PqRyRMYpPnNMYrQmM 3 中国 证券研究 2026 年11月2日 刘叶 (86-21) 6106 关系，同时不断拓展服务器和机器人业务。我们预计 2025-28 年盈利年 复合增长率为 36%，支撑因素包括： 1）苹果产品的韧性需求； 2）领益在常规 机型和可折叠机型中的价值量和钱包份额不断提升； 3）立敏达和机器人业务 放量带来增量利润。我们预计 2026 年下半年强劲的盈利将成为股价催化剂。 维持“增持”评级。 估值 我们截至 2027 年6月的目标价为 11.0港元，基于 15倍的 12个月滚动动态市 盈率，与全球同业均值持平（基于摩根大通和彭博一致预期）。 影响评级与目标价的风险 我们的评级和目标价面临的主要风险包括： 1）下游需求疲软； 2）智造行业竞 争加剧； 3）并购整合存在不确定性； 4）汇率 /原材料成本上涨令利润率承压 ；及 5）客户集中度风险。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 5h8/byi09sWQYOMDdOXcJmBQLa8vhxI9NIdFoEvoSJTa22Gt32HkTjW3U9ob6CCZ 5 中国 证券研究 2026 年11月2日 刘叶 (86-21) 6106-6200 ye.liu@jpmorgan.com 领益智造 - H: 财务数据概览 损益表 FY24A FY25A FY26E FY27E FY28E 现金流量表 FY24A FY25A FY26E FY27E FY28E 收入 44,260 51,429 61,929 73,077 84,650 经营活动现金流 4,015 4,433 3,622 5,238 11,084 售出商品成本 (37,866) (43,611) (51,294) (60,493) (69,907) 其中：折旧和摊销 2,482 3,046 2,554 2,444 2,267 毛利润 6,393 7,818 10,635 12,584 14,743 其中：营运资本变动 (1,449) (2,089) (4,681) (1,797) 3,092 销售费用、一般性费用及管理费用 (2,020) (2,536) (3,267) (3,782) (4,296) 调整后的息税折旧摊销前利润 5,013 6,099 6,383 8,406 9,777 投资活动现金流 (3,716) (8,199) (10,259) (4,875) (4,055) 折旧和摊销 (2,482) (3,046) (2,554) (2,444) (2,267) 其中：资本支出 (3,623) (4,833) (4,795) (4,571) (3,776) 调整后的息税前利润 2,531 3,053 3,829 5,962 7,509 占销售收入比重 8.2% 9.4% 7.7% 6.3% 4.5% 净利息 (237) (301) (229) (268) (228) 调整后的税前利润 2,196 2,733 3,567 5,652 7,208 融资活动现金流 2,731 3,238 5,865 (613) (868) 所得税 (436) (407) (475) (763) (973) 其中：支付的股息 (212) (511) (484) (910) (1,377) 少数股东损益 (6) (39) (56) (298) (509) 其中：发行股份数 /(回购数 ) (58) (320) 0 0 0 调整后的净利润 1,755 2,288 3,035 4,591 5,725 其中：发行的净债务 /(偿还额 ) 2,120 0 0 0 0 报告的每股收益 0.25 0.32 0.37 0.56 0.70 现金变化净额 3,138 (591) 1,271 (250) 6,161 调整后的每股收益 0.25 0.32 0.37 0.56 0.70 调整后的公司自由现金流 399 (400) (1,173) 667 7,308 每股股息 0.26 0.28 0.24 0.45 0.68 同比增长 (86.7%) (200.3%) 193.1% (156.8%) 996.5% 股息支付率 104.7% 86.1% 64.1% 79.6% 96.6% 发行在外股份数 7,056 7,056 8,167 8,167 8,167 资产负债表 FY24A FY25A FY26E FY27E FY28E 财务比率分析 FY24A FY25A FY26E FY27E FY28E 现金及现金等价物 6,039 5,448 6,719 6,469 12,630 毛利润率 14.4% 15.2% 17.2% 17.2% 17.4% .9% 的股权（卡在红线以下）。 隆基绿能：在俄亥俄州 5GW 合资工厂中，将持股比例下调至 19.9%，放弃绝 对 控股地位。 润阳股份（阿拉巴马州）：暂无动作 弘元绿能（南卡罗来纳州）：2026 年开工，业内普遍归类为\"几乎肯定通不过 FEOC 测试\"，几乎作废了。 阿特斯：将美国制造资产从 A 股子公司划转至其纳斯达克美股母公司（Canadian Solar）名下，利用非中资身份规避限制，是目前唯一没有出让控制权的企业。 再看看对美光伏设备这块，不是别人不想买，而是先进的设备我们不给卖，去年是窗口指导，今年10月16日，商务部与科技部联合发布2026年第48号公告，就修订《中国禁止出口限制出口技术目录》公开征求意见，拟增列涉及多晶硅制造、硅片制造、电池制造等光伏环节的12项技术，同时管控范围延伸至承载上述核心技术的关键设备，同步实施出口前临时登记管理。 出口“管控靶心”是核心技术可复制性的迁移，普通电池片和组件出口不受影响，对维护国内技术领先优势、优化全球竞争格局具有积极意义。根据相关企业的调研交流，政 策落地初期，设备出海审批周期延长。可话说过来，人家想买设备自己造电池组件，你核心设备不卖给人家，连地面光伏设备中比如超薄硅片和HJT都不满足出口管制，更别说太空光伏需要的钙钛矿等最好的设备；话再说回来，我们不想卖设备给人家，但想卖成品电池组件给人家，可人家又怕你倾销所以设置了高关税而且政 策补贴只扶持本土企业，短期基本无解。 对美储能这边也惨，2026年，出口美国的中国储能电池及系统面临高额综合关税。具体结构为：3.4%基础关税+25%“301关税”+20%芬太尼关税+10%对等关税，合计约58.4%。部分时间根据美中具体协议或者暂缓政 策，关税区间曾在40.9%—82.4%浮动，远高于其他主要出口目的地，2026年初关税将持续趋严。而且美国《大而美法案》（OBBBA）规定，对“受关注外国实体（FEOC）”的关键原料、技术及投资设定红线。中国储能企业及供应链产品被明确剔除出美国储能项目的补贴体系，直接影响储能项目能否获得投资税收抵免（ITC）和生产补贴。 在美国的高额关税、投资与补贴限制、市场准入与合规障碍等多重限制下，2026年第一季度，中国主要储能锂电池企业对美国出口出现断崖式下滑，出货量环比下降88%、同比下降80%。北美市场占中国企业储能海外订单比重从16.6%降至6.7%。2025全年中国企业海外储能订单约180GWh，美国仅贡献5.34GWh，占本地新增需求的比例极小（美国1-7月新增装机21.0GWh），供需出现明显反差。 所以光伏和储能在这个长期超跌和筹码干净的位置上，借着民主党上台的叙事，套着美国新能源补贴或者是太空光伏的想象力，炒一下超跌反弹修复没有问题，但是本质仍然是低位干净筹码遇上增量资金热钱借桌打牌而已，炒归炒，但要知道在炒情绪还是基本面，不要忘了实际上光伏储能这块的对美贸易，由于是我们技术卡他们脖子，于是变成了美国版的自主可控，这绝不是炒美股映射那么简单，因为最终并无法落地转化为大量的订单业绩基本面，所以对中期和持续性的表现要记得存疑，主题催化炒作要记得多看图，目前还是低位放量的底部，后面高位要做到图坏人撤，参考交易手册的十日线法则。---xz#文字观点", "publish_time": "2026-11-05 13:54", "tags": ["文字观点"]}, "attachment:files/万联证券-中国人民银行上调外汇存款准备金率点评：政策传递稳汇率信号-261103.pdf": {"id": "attachment:files/万联证券-中国人民银行上调外汇存款准备金率点评：政策传递稳汇率信号-261103.pdf", "kind": "attachment", "title": "万联证券-中国人民银行上调外汇存款准备金率点评：政策传递稳汇率信号-261103", "source_label": "万联证券", "excerpt": "11中邮证券创新药产业链高景气延续，器械板 块拐点已现 ——医药2026年三季报总结", "content": "11中邮证券创新药产业链高景气延续，器械板 块拐点已现 ——医药2026年三季报总结 证券研究报告 行业投资评级： 强于大市 |维持 盛丽华 /岑峻宇 /陈灿/徐智敏 /辛家齐 中邮证券研究所 医药团队 发布时间：2026-11-04 仅供内部参考，请勿外传！ 2 投资要点 26年三季度以来，医药板块整体延续震荡格局，估值处于历史相对低位。截至 2026/10/30 ，申万医药 PE（TTM ）为26.21X ，达到 15% 分位（自 2010/2/5 始，下 同），而沪深 300 PE （TTM ）为12.16X ；医药板块估值溢价率为 115.65% ，达到历史 5%分位，处于 2010 年以来的相对低位，具备较高性价比。医药主题基金 26Q3 规模达到 2108 亿元，环比增加 214亿元、环比 +11.3% ，整体规模仍维持高位， CRO 和创新药系主要重仓。我们认为，创新药产业链延续高景气，创新药板块盈利再突 破、CXO 连续多季度强劲增长；医疗器械招投标 Q3同比转正，行业进入基本面拐点与估值修复并行阶段；医药商业营收逐季提速。我们看好医药板块核心资产的价值 回归。 建议重视： 1.创新药： 看好27-28年创新药板块性投资机会，板块核心叙事逻辑有望从此前的 BD预期逐步演化为业绩驱动。创新药板块海外 BD仍是星辰大海，国 内市场走向盈利阶段，估值性价比显现，建议积极布局。选股思路上，建议以临床数据过硬、 BD干扰因素相对少的公司为主，关注全球市场参与确定度高的相关标的。 建议关注：信达生物、康方生物、三生制药、科伦博泰、迪哲医药、泽璟制药、恒瑞医药、翰森制药、科伦药业、康诺亚、映恩生物、乐普生物等。 2.化学制剂： 收 入规模环比回暖，盈利修复加速。 看好研发思路明确、资金利用效率高的企业，以及在特定细分赛道单点突破的创新企业。建议关注： 恒瑞医药、科伦药业、海思科、 奥赛康、京新药业、苑东生物、汇宇制药等 。3.CXO：板块景气不改，连续多季度强劲增长。 龙头公司上调指引，订单高增。 建议关注：药明康德、康龙化成、凯莱 英、药明生物、昭衍新药、美迪西、益诺思、泰格医药、诺思格、普蕊斯等 。4.科研服务 &上游： 景气维持， Q3收入持续高增，利润增速有所波动。建议关注：金斯 瑞、百普赛斯、义翘神州、近岸蛋白、奥浦迈、百奥赛图、药康生物等。 5. 原料药： 价格低位波动， 行业继续出清中小产能，竞争格局进一步优化。 建议关注：普洛 药业、国邦医药、华海药业等。 6.生物制品： 主要 关注业绩改善、在研管线数据或 BD预期引发的估值重估机会 。建议关注： 天坛生物、康希诺、欧林生物、甘李药业、 我武生物 等。7.医疗器械： 行业进入基本面拐点与估值修复并行阶段 。看好设备更新与国产替代、创新器械、 IVD及AI4S 上游。 建议关注 ：迈瑞医疗、联影医疗、 华大 智造、 新产业、安图生物、 海尔生物、 山外山、开立医疗、澳华内镜 、美好医疗、迪安诊断 等。8.医药商业： 预计行业出清后龙头药房客流将进一步恢复，在龙头药 房较高的精细化管理能力下利润率稳中有升，建议关注：益丰药房、大参林、老百姓等。 9.中药： 院内院外均阶段性承压，看好高分红与政策受益方向 。建议关注： 东阿阿胶、云南白药、济川药业、华润江中、盘龙药业、方盛制药等 等。10.医疗服务： 看好持续扩张及优质资产注入下市占率提升，以及消费复苏下弹性较大的眼科、 口腔行业。受益标的：爱尔眼科、固生堂、通策医疗等 。 ➢风险提示： 行业竞争加剧风险、集采降价超预期风险、企业外延并购落地低于预期风险、国际地缘政治风险、关税扰动风险。 请参阅附注免责声明 仅供内部参考，请勿外传！ 3 目录 板块行情：整体表现震荡，医药主题基金规模维持 高位一 细分板块： CXO高景气延续，医疗器械板块拐点已 现二 风险提示三 仅供内部参考，请勿外传！ 4 4 一板块行情： 整体表现震荡，医药主题基金规模 维持高位 仅供内部参考，请勿外传！ 5 1.1 医药板块经历深度调整和修复，行业指数排名靠前 ◼2026 开年以来医药生物板块先小幅跑赢沪深 300，中期开始下探 出现深度调整，后期修复反弹，整体处于宽幅震荡格局 。年初 板块延续前期创新药板块的事件型驱动，获得阶段性超额收益，后续事件催化边际减弱。 5月-8月，随着领域催化事件（如 ASCO 大会） 落地，进入催化和业绩双重真空期，叠加政策扰动与资金流向其他板块，经历单边下行，而后随着 H1业绩披露，市场资金再平衡，板块 经历反弹修复， 9-10月整体处于震荡格局。 ◼年涨幅来看，截至 26/10/30 ，申万医药指数 下跌9.43% ，跑赢沪深 300指数4.49pct，在中信一级行业中排名第 7位。 图表1：2026 至今医药板块震荡 起伏 （截至 2026 /10/30 ） 资料来源： Wind 、中邮证券研究所图表2：2026 年以来医药指数在申万一级行业中排名第 7 资料来源： Wind 、中邮证券研究所 请参阅附注免责声明-20.0-15.0-10.0-5.00.05.010.015.0 26/1/5 26/2/5 26/3/5 26/4/5 26/5/5 26/6/5 26/7/5 26/8/5 26/9/5 26/10/5% 医药生物 沪深 300 -9.43% -13.92% -40%-30%-20%-10%0%10%20%30% 3.7亿美元（yoy+49.9%、Beat一致预期2.4%），其中Datacenter & Communicat", "content": "【国泰海通海外科技】Coherent（COHR.N）FY27Q1业绩会速递 #FY27Q1营收同比增长50%、FY27Q2指引超预期、全年收入增速预计加快。 1）FY27Q1表现：公司营收23.7亿美元（yoy+49.9%、Beat一致预期2.4%），其中Datacenter & Communications/Industrial收入分别为19.5/4.2亿美元（yoy+79%/基本持平）。受益于定价优化、投入成本下降及良率提升，Non-GAAP毛利率40.6%（yoy+184bps）。 2）后续指引：#FY27Q2预计营收25.5-27.5亿美元（vs预期25.4亿美元），Non-GAAP毛利率40%-42%。#FY27全年可比收入预计增长超60%（剔除剥离业务影响、vs预期49%），维持FY27年底前首次实现单季30亿美元收入、FY28首次实现单季40亿美元收入预期。 #PhotonLink新增五年总价值约200亿美元长协、预计CY27年底前单季收入超2.5亿美元。继英伟达后，公司与另一家大型AI客户签署长协，预计CY28年初开始贡献收入，产品以400mW CW激光器为核心。PhotonLink整体预计FY27Q2开始小规模出货、FY27Q3收入超1亿美元。初期面向Scale-out CPO，#Scale-up-CPO预计CY27H2开始出货、NPO预计CY27年底至CY28年初导入。除两家核心客户外、另有超过CPO、NPO（均分别超过10项）的合作。 #1.6T持续放量、DCI季度收入预计至CY27年底较本季翻倍。 1）光模块：#1.6T已向多家客户放量、预计未来几个季度继续快速增长； 800G收入预计持续增长至CY27年，公司已展示3.2T OSFP光模块。 2）DCI：FY27Q1 Scale-across/DCI收入超2亿美元（qoq+53%、约为去年同期4倍），Multi-rail预计FY27Q3开始放量。 3）OCS：320×320系统已出货，公司正扩建两处生产基地，客户应用由Scale-out扩展至Scale-across及Scale-up。 #InP产能提前一季度实现同比翻倍、CY27年底前将再扩至两倍以上，客户前期付款支持扩产。德州及瑞典6英寸产线良率继续高于3英寸，苏黎世预计CY27H1启动6英寸生产，扩产所需衬底及关键原材料已锁定。FY27Q1经营现金流净流出0.9亿美元，Capex达7.8亿美元（上季5.6亿美元），预计Q2继续环比增加。#CY27年订单基本排满、客户已预订CY28年需求、长协通常延续至本十年末并包含预付款或NRE等前期付款、共同承担扩产投入。 #Non-GAAP毛利率目标由42%以上上调至45%以上、预计CY28年底前实现。主要驱动为新产品放量及6英寸InP产能效益释放，定价优化与降本继续贡献。内部InP产能与光模块需求同步增长，过去一年自供与外采比例基本未变。未来提高InP自供比例将进一步降低成本、多数6英寸扩产毛利率收益尚未兑现。 秦和平/朱彦霖#文字观点", "publish_time": "2026-11-05 08:12", "tags": ["文字观点"]}, "post:2026-11-05T20-44:7fbb4c0c7c03": {"id": "post:2026-11-05T20-44:7fbb4c0c7c03", "kind": "post", "title": "2026-11-05 20:44", "source_label": "帖子正文", "excerpt": "20261105【开源海外｜Coherent】业绩指引双超预期，CPO长约与InP扩产强化成长 #收入利润双超预期，下一季指引继续超预期，中期增长与利润率目标积极。CY26Q3（FY27Q1）收入23.70亿美元，高于市场预期的23.10亿美元约2.6%", "content": "20261105【开源海外｜Coherent】业绩指引双超预期，CPO长约与InP扩产强化成长 #收入利润双超预期，下一季指引继续超预期，中期增长与利润率目标积极。 CY26Q3（FY27Q1）收入23.70亿美元，高于市场预期的23.10亿美元约2.6%；Non-GAAP EPS为2.09美元，高于市场预期的1.97美元约6.1%。Non-GAAP毛利率40.6%，同比提升184bps，营业利润率23.2%，同比提升368bps，收入增长持续转化为利润弹性。 CY26Q4收入指引中值26.5亿美元，高于市场预期25.4亿美元约4.3%；Non-GAAP EPS指引中值2.38美元，高于预期2.21美元约7.7%，收入及EPS指引下限均已超过市场预期。公司预计FY27全年可比口径收入增长超过60%，并将长期毛利率目标提高至2028年底前实现首个Non-GAAP毛利率超过45%的季度。 #800G与1.6T共同增长，InP扩产提前兑现 本季数据中心及通信收入19.52亿美元，同比+79%、环比+21%，占总收入约82%。电话会指出，1.6T正向多个客户放量，800G收入预计持续增长至2027年；跨数据中心互联DCI收入超过2亿美元、约为去年同期的4倍。内部InP产出能力提前一个季度实现同比翻倍，计划至2027年底再增长超过一倍。后续随着内部器件自供比例提升，6英寸InP平台的成本优势有望进一步释放。 #新增200亿美元PhotonLink长约，CW光源及CPO打开增量空间。 除此前英伟达协议外，公司与另一家头部AI客户签订五年约200亿美元PhotonLink长期协议，以400mW CW激光器为核心，收入预计从2028年初开始爬坡。PhotonLink整体业务已进入商业化阶段，公司预计CY27Q1收入超过1亿美元、2027年底前季度收入超过2.5亿美元。我们认为，本季财报进一步支持2027年光互联需求扩张的判断。800G/1.6T支撑近期增长，PhotonLink拓展CPO光源及配套组件市场，InP扩产与后续自供率提升则提供盈利弹性，公司的增长来源正进一步丰富。本季资本开支约7.76亿美元，按经营现金流减资本开支计算，自由现金流约为负8.68亿美元，仍需关注增长兑现与资金效率。 联系人：初敏/王泽宇#文字观点", "publish_time": "2026-11-05 20:44", "tags": ["文字观点"]}, "post:2026-11-05T09-16:178ed0087d44": {"id": "post:2026-11-05T09-16:178ed0087d44", "kind": "post", "title": "2026-11-05 09:16", "source_label": "帖子正文", "excerpt": "技术升级之—液冷（23）：液冷后续看新材料技术路线升级【东北计算机】 🔥#新材料的商业化正在加速。1）11月3日，全球金刚石巨头Element Six（元素六，E6）与半导体先进材料供应商Entegris宣布建立长期开发合作伙伴关系，目标是将金刚石热管理方案嵌入GPU与RF器件的先进封装体系", "content": "技术升级之—液冷（23）：液冷后续看新材料技术路线升级【东北计算机】 🔥#新材料的商业化正在加速。1）11月3日，全球金刚石巨头Element Six（元素六，E6）与半导体先进材料供应商Entegris宣布建立长期开发合作伙伴关系，目标是将金刚石热管理方案嵌入GPU与RF器件的先进封装体系；2）2026云栖大会上，阿里云首次系统展示面向2028年的旗舰超节点磐久AL144，与之配套的散热方案是\"垂直喷射微通道冷板+新型流变稳定型液态金属。 🔥怎么看几种新材料？ #金刚石：我们认为目前已经逐步脱离产品测试送样阶段，临近行业放量节点，27年或为放量大年。 1）#金刚石铜：海外对金刚石铜产品形态接受度更高，进展对比纯金刚石更快。我们认为主要原因是金刚石铜在原有冷板体系中改动较小以及供应链安全性。后续需要主要关注头部金刚石铜厂商在海外客户订单以及海外头部客户确认使用口径情况； 2）#单晶/多晶热沉片：目前能看到产业进展较为超预期。据了解已有国内头部算力芯片厂商在近芯片端完成单晶/多晶散热片规模招标。我们认为后续需要跟踪各大国产芯片厂商的规模化订单将逐步落地情况及产业各家扩产情况。 #tim材料升级：提升液冷模组导热的关键。未来从普通硅脂、垫片，往相变材料、液态金属、石墨烯/金刚石走。 芯片端： 1）#液态金属：目前在冷板层面主要解决泵出及腐蚀性问题。阿里已率先运用，后续关注海外大厂测试情况； 2）#石墨烯：TIM2材料有望由此前相变材料向Rubin阶段的高导热石墨烯垫片升级。 光通信端： 3）#氮化铝凝胶：为传统氧化铝的后续升级。我们认为氮化铝做为光模块散热&陶瓷基板关键填料，后续关注伴随800G光模块放量及陶瓷基板进展情况。 相关公司：（未覆盖不作为投资推荐） 液冷&金刚石：鸿富诚、国机精工、瑞晨环保（未覆盖）、中石科技、沃尔德、宏昌科技（未覆盖）、黄河旋风（未覆盖）、金洲管道（未覆盖）、美湖股份（未覆盖）、飞龙股份、瑞玛精密（未覆盖）、磁谷科技（未覆盖）。 风险提示： AI算力资本开支不及预期；液冷技术路线迭代风险；英伟达Rubin平台量产及液冷方案交付进度不及预期；液冷渗透率提升不及预期；行业竞争加剧导致盈利能力下降。 ☎️详情欢迎联系东北计算机团队#文字观点", "publish_time": "2026-11-05 09:16", "tags": ["新材料的商业化正在加速", "石墨烯", "文字观点"]}, "post:2026-11-05T10-16:b5d7d2321e32": {"id": "post:2026-11-05T10-16:b5d7d2321e32", "kind": "post", "title": "2026-11-05 10:16", "source_label": "帖子正文", "excerpt": "方正科技重大推荐 26Q3毛利率创历史新高，AIPCB收入占比提升+良率提升推动盈利能力加速上行：26Q3公司综合毛利率37.35%创历史新高，毛利率连续7个季度环比增长；AIPCB收入占比提升叠加技改主要驱动公司盈利能力逐季向上，并非单纯上游原材料涨价顺价。", "content": "方正科技重大推荐 26Q3毛利率创历史新高，AIPCB收入占比提升+良率提升推动盈利能力加速上行：26Q3公司综合毛利率37.35%创历史新高，毛利率连续7个季度环比增长；AIPCB收入占比提升叠加技改主要驱动公司盈利能力逐季向上，并非单纯上游原材料涨价顺价。未来随着公司产品结构持续优化以及精细化运营，27年单季度盈利能力有望对标行业一线水平。 国内AI占比含量最高PCB厂商，预计26/27年AI收入占比高达70%/80%，远期业绩弹性大：（1）量：27年公司营收增量主要在1.6T光模块、交换机以及国产AI服务器，产能增长来自F6、F8、F5以及泰国厂爬坡，测算远期有效产能提升50%+； （2）价：预计27年整体接单价格同比26年提升50%+，远期接单价仍有上涨空间。(3)预计27年公司AIPCB收入占比80%，相比之前预期提速一年！ 覆盖海内外优质客户，卡位1.6T交换机、1.6T光模块以及国产AI服务器放量: (1)交换机高多层:高端高多层板竞争格局稳定，目前稳定量产30层以上高多层板厂商为美国TTM/沪电/方正。除Cisco外，公司与国内外交换机厂商均有紧密合作。1.6T交换机高多层asp过万元，相比800G价值量翻倍。(2)光模块masp：公司聚焦海外头部客户，1.6T光模块订单均价高于行业平均水平。(3)国产算力AI服务器:与国内大客户合作多年，份额稳定前三。 ☎️公司股价当下位置对应27年不足10X，远期有效产能全部爬满仅5X。属于PCB中业绩高弹性且显著低估品种，建议各位领导重视！#文字观点", "publish_time": "2026-11-05 10:16", "tags": ["文字观点"]}, "post:2026-11-05T16-37:b31d29c3e0ae": {"id": "post:2026-11-05T16-37:b31d29c3e0ae", "kind": "post", "title": "2026-11-05 16:37", "source_label": "帖子正文", "excerpt": "核心观点：海外AI算力链进入震荡消化期，资金有望向低位国产硬科技扩散。", "content": "🔥🔥【电子策略｜为什么本轮科技反弹，优先选择国产科技半导体？】 核心观点：海外AI算力链进入震荡消化期，资金有望向低位国产硬科技扩散。#重点看好半导体设备、先进封装两大方向，形成“设备龙头稳趋势、封装龙头扛容量、弹性小票打情绪”的反弹格局！ 今天盘面释放了一个重要信号：易中天开盘继续承压，但科技小票从水下快速拉起，部分反弹超过5%，说明资金已经开始寻找新的突破口。这一幕，与8月份科技反弹非常相似。当时中际旭创、新易盛横盘消化海外政策利空，东山精密、剑桥科技以及部分中小PCB、CPO公司率先展开强势反弹。 我们认为，本轮有望再次演绎“大票稳指数、小票打弹性”的行情。海外AI算力链受政策扰动、估值压力及套牢盘影响，短期仍需时间消化。#国产硬科技经历较大调整后、反而具备产业逻辑、政策预期与估值修复三重催化。 其中，半导体设备和先进封装，具备较强的产业确定性与资金承接能力。更重要的是，易中天对创业板科技情绪影响较大。一旦龙头企稳，科技板块风险偏好回升，前期率先启动的弹性小票有望进一步加速。 重点关注六大标的： ① 通富微电（002156）：国产先进封装核心龙头，Chiplet及高端封测产业链重要企业，板块容量中军。 ② 华海清科（688120）：国产CMP设备龙头，覆盖先进制程、HBM及先进封装，布局减薄等核心装备，国产替代确定性较强。 ③ 拓荆科技（688072）：国产薄膜沉积设备龙头，布局PECVD、ALD及混合键合设备，受益于先进制程与3D先进封装升级。 ④ 易天股份（300812）：布局Chiplet先进封装设备，国产设备替代带来业绩与估值弹性预期。 ⑤ 蓝箭电子（301348）：具备SiP及功率半导体封测技术储备，关注先进封装业务拓展与产业整合预期。 ⑥ 气派科技（688216）：中小市值封测企业，布局FCQFN等封装工艺，具备情绪修复弹性。 ☎️ 策略建议：设备看华海清科、拓荆科技；容量看通富微电；情绪弹性看易天股份、蓝箭电子、气派科技。本轮科技反弹的核心看点，是资金从高拥挤度海外AI算力链向低位国产硬科技切换！#文字观点", "publish_time": "2026-11-05 16:37", "tags": ["文字观点"]}, "post:2026-11-05T15-45:52b43f997e3d": {"id": "post:2026-11-05T15-45:52b43f997e3d", "kind": "post", "title": "2026-11-05 15:45", "source_label": "帖子正文", "excerpt": "11月5日复盘笔记：光伏/人形机器人/AI短剧/端侧AI/消费电子/算力租赁/半导体/黄金/电网设备等一、重磅财经信息高盛：美国中期选举结果或推动科技企业资本开支提速至2027年二", "content": "11月5日复盘笔记：光伏/人形机器人/AI短剧/端侧AI/消费电子/算力租赁/半导体/黄金/电网设备等一、重磅财经信息高盛：美国中期选举结果或推动科技企业资本开支提速至2027年二、大盘表现沪指涨0.10%，深证成指涨1.19%，创业板指涨0.87%，科创50指数涨1.68%。沪深京三市成交额超过2.1万亿，较昨日放量近千亿。科创半导体ETF华夏（588170）成交138亿 刷新历史天量三、强势板块和个股分析备注：只列举部分涨停板光伏①机构：m胜，对美国新能源构成明确利好，有望打消市场对新能源税收抵免提前削减/终止的担忧，美国新能源装机预期有望迎来上修。 ②据国家能源局数据，2026年第三季度中国新增光伏装机约38.76GW，较2025年同期的28.06GW，增长约38%。涨停板：海源复材、钧达股份、金刚光伏、贝特利、时创能源、中利集团、弘元绿能、赛伍技术、协鑫集成、双良节能、欧晶科技、永臻股份其他强势股：迈为股份、奥特维、连城数控、中信博人形机器人小米人形机器人完成8小时不间断产线作业验证，可实现自主纠偏和产线系统协同，标志人形机器人从实验室走向工厂落地，产业化进度提速。涨停板：肇民科技、福莱新材、模塑科技、精研科技、征和工业、麦迪科技、中邮科技、祥和实业其他强势股：浙江荣泰、兆威机电、宁波华翔、上纬新材AI短剧QuestMobile数据显示，9月抖音集团内部前三大应用变为抖音、红果免费短剧、豆包，去重总用户量分别为10.29亿、4.3亿和4.19亿，红果已超过豆包；短剧视频用户规模从1000万到4亿仅用不到3年，年复合增长率达443.1%。涨停板：浙文影业、慈文传媒、引力传媒、吉视传媒、博纳影业、浙文互联、福石控股、德才股份其他强势股：芒果超媒、果麦文化、天地在线、易点天下、因赛集团端侧AI/消费电子苹果宣布国行版Apple Intelligence正式接入阿里通义千问，11月4日开启测试，12月正式推送。海外头部终端选择国产大模型落地，被视为端侧AI从概念走向商业化验证的标志性事件。涨停板：润欣科技、瑞芯微、博通集成、国光电器、精研科技其他强势股：移远通信、天键股份、乐鑫科技算力租赁11月2日晚，李佳琦直播间双十一售卖千问办公Token。开卖仅半小时，就售出10万份千问办公个人会员月卡，累计约2万亿Token。涨停板：润建股份、青云科技、中嘉博创、日海智能、达实智能其他强势股：品高股份、润泽科技、优刻得、首都在线半导体根据WSTS数据，预计2026年全球半导体市场将增长90%至1.51万亿美元；2025年我国半导体市场增长17.3%，销售额测算为约2188亿美元，占全球半导体市场比例约27.5%。涨停板：先导基电、有研新材、瑞芯微其他强势股：雅克科技、通富微电、华峰测控、北方华创、强一股份、拓荆科技黄金现货黄金站上4110美元/盎司。涨停板：盛达资源、深中华A、南矿集团其他强势股：赤峰黄金、兴业银锡、四川黄金、晓程科技、招金黄金、湖南黄金创新药海创药业与美国生物医药公司Evommune, Inc.共同宣布，双方已就海创药业利用靶向蛋白降解技术平台自主研发的口服VAV1分子胶降解剂HP570达成独家授权许可协议。海创药业另有权获得最高约10.7亿美元的潜在开发、监管注册及商业化里程碑付款。涨停板：康弘药业、贝瑞基因、福瑞医科其他强势股：海创药业、昂利康、石药创新、众生药业电网设备国家能源局介绍，新型电网建设工作启动部署以来，有力推进扩大有效投资，截至9月底，电网企业 美国中选后新能源装机预期有望上修，美股光伏龙头涨13%—16%，但需区分民主党支持的是美国光伏；9月全球xEV销量213万辆、同比-8%，弱于全年+10%基准，电池需求120GWh、同比+7%连续跑赢整车，宁德时代市占率38.2%继续扩张。\n\n## 二、今日最强主线\n- **AI算力/国产算力**\n  **今天强化的逻辑：** 国产算力核心定价逻辑不是北美资本开支，而是模型迭代、需求扩容与国产替代斜率；算力基建投资规划要求八成AI芯片来自国内供应商，算力网建设纳入PSL支持领域；民主党赢两院后对华科技限制制度化、长期化概率上升，依靠高层谈判换取阶段性科技松绑难度加大，自主可控优先级强化。\n  **今天出现的催化/验证：** FCC限制传闻叠加美股AI硬件波动引发超跌，但帖子仍看好27年AI基建拉动内需、供给与融资双改善，并重点关注中际旭创、源杰科技、新易盛、天孚通信、光库科技、仕佳光子、联讯仪器等。\n\n- **半导体/先进封装**\n  **今天强化的逻辑：** 先进制程+晶圆扩产双轮驱动靶材需求，晶圆扩产+HBM/Chiplet/CoWoS升级双逻辑拉动；溅射靶材是PVD薄膜沉积核心耗材，国内市场稳步扩容；靶材覆盖130nm-3nm，客户覆盖台积电、海力士、中芯等全球主流晶圆及存储厂；晶圆制造端服务中芯国际、长鑫存储、长江存储，封测环节批量供货长电科技、通富微电，实现先进封装检测设备进口替代。\n  **今天出现的催化/验证：** 电子策略提出短期看新能源政策博弈，中期坚定看好半导体设备、先进封装及国产替代，策略上优先挖掘弹性小票，逐步跟踪产业龙头。\n\n- **宏观/策略与港股互联网**\n  **今天强化的逻辑：** 民主党横扫两院，选举落地或推动政策不确定性下降，对市场构成风险出清契机；但随着时间推移，“为反对而反对”的干扰风险（财政、AI）逐渐显现，短期市场侧重以“纠偏”（军事、美联储、关税）为目的；美债利率下行预期升温，外溢流动性利好港股，看好本轮港股互联网超过7月修复行情。\n  **今天出现的催化/验证：** 港股继续领涨，互联网；亚洲市场板块轮动加快，投资者从AI、半导体硬件撤出，转向价值、周期以及内需属性市场。\n\n- **新能源/储能**\n  **今天强化的逻辑：** 美国中选后新能源装机预期有望上修；板块压力来自美国禁令与欧洲贸易摩擦担忧压制估值，新能源叙事变化、调整充分承接流动性，板块压力边际向好；9月全球乘用车xEV销量213万辆、同比-8%，显著弱于全年+10%基准，四季度必须强反弹才能守住2026年预测；但电池端需求120GWh、同比+7%，连续跑赢整车销量，验证单车带电量提升+BEV结构，宁德时代市占率38.2%继续扩张。\n  **今天出现的催化/验证：** 美股光伏阿特斯太阳能涨13%、旭日升科技涨16%、晶科控股涨14%、大全新能源涨13%、第一太阳能涨13%；但帖子提醒民主党支持的是美国光伏；同飞股份交流称2026年上半年已超过英维克成为国内储能温控市占率第一（28%），深度绑定阳光电源、海博思创、阿特斯，并已签订框架协议和长协。\n\n- **机器人/物理AI**\n  **今天强化的逻辑：** 京东计划未来五年采购300万台机器人、100万台无人车和10万架无人机，用于智能物流；物理AI路演汇总显示，乐观派认为随着模型能力提升、资本开支投入，大脑问题有望逐步解决，看好机器人商业化是coding之后最大的应用场景，后续催化很多。\n  **今天出现的催化/验证：** 宁波东力交流称主业稳定向上+谐波产能/订单远超市场预期+当前市值隐含的机器人业务极少；产品包括谐波减速器+行星减速器+电机+模组，谐波减速器及行星减速器均大规模量产中；美国民主党中选对全球物理AI核心结论利多大于利空，具身智能产业大趋势向好，利率端压力缓解利好一级市场融资，FCC政策进一步加强概率低。\n\n- **AI硬件技术升级：光通信/CPO、PCB/CCL、液冷**\n  **今天强化的逻辑：** Coherent 1.6T已向多家客户放量、预计未来几个季度继续快速增长，800G收入预计持续增长至CY27年，已展示3.2T OSFP光模块；PhotonLink拓展CPO光源及配套组件市场，并获200亿美元级别LTA，InP扩产与后续自供率提升提供盈利弹性；AI相关PCB年增速45%–70%，18层及以上高多层板15.7%，4至6层传统板仅2.3%，覆铜板以18–24个月周期由M7迭代至M8、M9、M10，M9售价可达M7四倍；英伟达发布Rubin新一代算力。\n  **今天出现的催化/验证：** Coherent FY27Q1营收23.7亿美元、同比+49.9%、Beat一致预期2.4%，FY27Q2指引超预期；方正科技26Q3毛利率37.35%创历史新高，连续7个季度环比增长，AIPCB收入占比提升叠加技改驱动盈利能力逐季向上；9-10月PCB板块指数回调幅度在40%左右，部分AI业务占比较高或AI增量逻辑较强的标的回撤约50%。\n\n## 三、今日重点关注\n### 3.1 今天已经发生的重点变化\n- 美国中期选举民主党以压倒性胜利横扫两院，胜利不意外、横扫力度超预期；特朗普表示绝对愿意接受选举结果，准备与民主党合作。市场重新定价AI上下游：费半跌3%、标普纳指上涨，大型科技股飙升而存储、光通信等AI概念下挫；华尔街认为AI热潮面临风险，投资者押注民主党控制的国会将放缓AI大规模支出，因为这些支出正在消耗自由现金流。\n- A/H市场轮动：港股继续领涨，互联网；光模块、PCB和存储下跌，中际旭创跌7.5%、成交307.8亿元仍是全市场第一，新易盛跌5.5%、东山精密跌5.5%、沪电股份跌5.8%、长鑫科技跌3.5%；中科飞测269.00元、+9.0%，半导体检测设备，成交67.3亿元。\n- 宏观与商品：央行11月5日开展3000亿元买断式逆回购操作；五部门印发《实施全面节约战略行动方案》，大力推进燃煤锅炉、燃煤工业窑炉清洁替代，全面淘汰10蒸吨/小时及以下燃煤锅炉，加快布局一批稀贵金属资源循环利用项目，推进有价组分回收和高值化利用；现货黄金涨3.28%、报4058.93美元/盎司，现货白银涨4.86%、报52.19美元/盎司，油价重挫超8%。\n- AI支出与成本侧：苹果削减内部AI使用预算，部分使用AI模型的工程师每日支出上限从300美元下调至200美元；高通对下一财季给出平淡利润指引，理由是零部件与制造成本普遍上涨；Arm人工智能驱动的销售预测未能给投资者留下深刻印象。\n- Coherent业绩：FY27Q1营收23.7亿美元、同比+49.9%、Beat一致预期2.4%，其中Datacenter & Communications收入19.5亿美元、Industrial收入4.2亿美元；FY27Q2指引超预期，全年收入增速预计加快；1.6T向多家客户放量，800G收入预计持续增长至CY27年，已展示3.2T OSFP光模块；PhotonLink获200亿美元级别LTA，InP产能Q1同比翻倍、比原计划提前一个季度。\n- 半导体材料：靶材深度提出先进制程+晶圆扩产双轮驱动，竞争格局极好，看好国内龙头公司放量；晶圆扩产+HBM/Chiplet/CoWoS升级双逻辑拉动靶材需求；靶材覆盖130nm-3nm，客户覆盖台积电、海力士、中芯等全球主流晶圆及存储厂；设备配套服务中芯国际、长鑫存储、长江存储，封测批量供货长电科技、通富微电，先进封装检测设备进口替代。\n- PCB/液冷/算电协同：AI相关PCB年增速45%–70%，18层及以上高多层板15.7%，4至6层传统板仅2.3%；2026年AI服务器及网络设备供应商营收同比增长超50%，行业多数企业不足10%；英伟达Rubin；黑河片区公示绿色算电融合与跨境算力建设项目，由耀世科技（黑龙江）有限公司作为建设单位，预估总投资额71.8亿元。\n- 机器人/其他行业：京东计划未来五年采购300万台机器人、100万台无人车和10万架无人机用于智能物流；宁波东力交流称谐波减速器及行星减速器均大规模量产中，主业工业齿轮箱和轮控系统，2025年新增精密减速器业务，前五大客户占比近25%；杰瑞股份全资子公司收到ADNOC Onshore三份项目授标函，合计26.967亿美元、约181.16亿元，四个中东项目合计超30亿美元；果链3D打印设备表壳已量产、铰链已导入，正走向放量拐点；家电出海“再平衡”，美国消费K型分化，必选渠道领跑，正把订单推向中国供应链。\n\n### 3.2 接下来要继续跟踪的验证点/催化点\n- 数据中心政策落地：跟踪民主党州和地方胜利是否引发数据中心建设暂时禁令，美国计划数据中心容量的45%是否受影响；德州2030年要上线美国算力的1/4，新州长带着严苛数据中心监管上台，后续监管细则与项目审批是关键。反向观点认为数据中心占GDP比重高，最终是把电网和基建成本转嫁给开发商，而非停建，需跟踪成本转嫁与停建风险的实际演化。\n- AI资本开支与变现：跟踪Coherent PhotonLink长约执行、InP扩产与自供率提升、1.6T放量、800G持续增长至CY27、3.2T OSFP进展；跟踪北美CSP资本开支强度与AI商业化对云业务增长的验证；另有观点认为美国中期选举结果或推动科技企业资本开支提速至2027年，需与数据中心禁令风险对照验证。\n- 国产算力政策与订单：跟踪算力基建投资规划要求八成AI芯片来自国内供应商、算力网建设纳入PSL支持领域的落地 容与国产替代斜率；算力基建投资规划要求八成AI芯片来自国内供应商，算力网建设纳入PSL支持领域；民主党赢两院后对华科技限制制度化、长期化概率上升，依靠高层谈判换取阶段性科技松绑难度加大，自主可控优先级强化。 \u003cstrong>今天出现的催化/验证：\u003c/strong> FCC限制传闻叠加美股AI硬件波动引发超跌，但帖子仍看好27年AI基建拉动内需、供给与融资双改善，并重点关注中际旭创、源杰科技、新易盛、天孚通信、光库科技、仕佳光子、联讯仪器等。\u003c/p>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>\u003c/li>\n\u003cp>\u003cstrong>今天强化的逻辑：\u003c/strong> 先进制程+晶圆扩产双轮驱动靶材需求，晶圆扩产+HBM/Chiplet/CoWoS升级双逻辑拉动；溅射靶材是PVD薄膜沉积核心耗材，国内市场稳步扩容；靶材覆盖130nm-3nm，客户覆盖台积电、海力士、中芯等全球主流晶圆及存储厂；晶圆制造端服务中芯国际、长鑫存储、长江存储，封测环节批量供货长电科技、通富微电，实现先进封装检测设备进口替代。 \u003cstrong>今天出现的催化/验证：\u003c/strong> 电子策略提出短期看新能源政策博弈，中期坚定看好半导体设备、先进封装及国产替代，策略上优先挖掘弹性小票，逐步跟踪产业龙头。\u003c/p>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观/策略与港股互联网\u003c/strong>\u003c/li>\n\u003cp>\u003cstrong>今天强化的逻辑：\u003c/strong> 民主党横扫两院，选举落地或推动政策不确定性下降，对市场构成风险出清契机；但随着时间推移，“为反对而反对”的干扰风险（财政、AI）逐渐显现，短期市场侧重以“纠偏”（军事、美联储、关税）为目的；美债利率下行预期升温，外溢流动性利好港股，看好本轮港股互联网超过7月修复行情。 \u003cstrong>今天出现的催化/验证：\u003c/strong> 港股继续领涨，互联网；亚洲市场板块轮动加快，投资者从AI、半导体硬件撤出，转向价值、周期以及内需属性市场。\u003c/p>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>新能源/储能\u003c/strong>\u003c/li>\n\u003cp>\u003cstrong>今天强化的逻辑：\u003c/strong> 美国中选后新能源装机预期有望上修；板块压力来自美国禁令与欧洲贸易摩擦担忧压制估值，新能源叙事变化、调整充分承接流动性，板块压力边际向好；9月全球乘用车xEV销量213万辆、同比-8%，显著弱于全年+10%基准，四季度必须强反弹才能守住2026年预测；但电池端需求120GWh、同比+7%，连续跑赢整车销量，验证单车带电量提升+BEV结构，宁德时代市占率38.2%继续扩张。 \u003cstrong>今天出现的催化/验证：\u003c/strong> 美股光伏阿特斯太阳能涨13%、旭日升科技涨16%、晶科控股涨14%、大全新能源涨13%、第一太阳能涨13%；但帖子提醒民主党支持的是美国光伏；同飞股份交流称2026年上半年已超过英维克成为国内储能温控市占率第一（28%），深度绑定阳光电源、海博思创、阿特斯，并已签订框架协议和长协。\u003c/p>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>机器人/物理AI\u003c/strong>\u003c/li>\n\u003cp>\u003cstrong>今天强化的逻辑：\u003c/strong> 京东计划未来五年采购300万台机器人、100万台无人车和10万架无人机，用于智能物流；物理AI路演汇总显示，乐观派认为随着模型能力提升、资本开支投入，大脑问题有望逐步解决，看好机器人商业化是coding之后最大的应用场景，后续催化很多。 \u003cstrong>今天出现的催化/验证：\u003c/strong> 宁波东力交流称主业稳定向上+谐波产能/订单远超市场预期+当前市值隐含的机器人业务极少；产品包括谐波减速器+行星减速器+电机+模组，谐波减速器及行星减速器均大规模量产中；美国民主党中选对全球物理AI核心结论利多大于利空，具身智能产业大趋势向好，利率端压力缓解利好一级市场融资，FCC政策进一步加强概率低。\u003c/p>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>AI硬件技术升级：光通信/CPO、PCB/CCL、液冷\u003c/strong>\u003c/li>\n\u003cp>\u003cstrong>今天强化的逻辑：\u003c/strong> Coherent 1.6T已向多家客户放量、预计未来几个季度继续快速增长，800G收入预计持续增长至CY27年，已展示3.2T OSFP光模块；PhotonLink拓展CPO光源及配套组件市场，并获200亿美元级别LTA，InP扩产与后续自供率提升提供盈利弹性；AI相关PCB年增速45%–70%，18层及以上高多层板15.7%，4至6层传统板仅2.3%，覆铜板以18–24个月周期由M7迭代至M8、M9、M10，M9售价可达M7四倍；英伟达发布Rubin新一代算力。 \u003cstrong>今天出现的催化/验证：\u003c/strong> Coherent FY27Q1营收23.7亿美元、同比+49.9%、Beat一致预期2.4%，FY27Q2指引超预期；方正科技26Q3毛利率37.35%创历史新高，连续7个季度环比增长，AIPCB收入占比提升叠加技改驱动盈利能力逐季向上；9-10月PCB板块指数回调幅度在40%左右，部分AI业务占比较高或AI增量逻辑较强的标的回撤约50%。\u003c/p>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>美国中期选举民主党以压倒性胜利横扫两院，胜利不意外、横扫力度超预期；特朗普表示绝对愿意接受选举结果，准备与民主党合作。市场重新定价AI上下游：费半跌3%、标普纳指上涨，大型科技股飙升而存储、光通信等AI概念下挫；华尔街认为AI热潮面临风险，投资者押注民主党控制的国会将放缓AI大规模支出，因为这些支出正在消耗自由现金流。\u003c/li>\n\u003cli>A/H市场轮动：港股继续领涨，互联网；光模块、PCB和存储下跌，中际旭创跌7.5%、成交307.8亿元仍是全市场第一，新易盛跌5.5%、东山精密跌5.5%、沪电股份跌5.8%、长鑫科技跌3.5%；中科飞测269.00元、+9.0%，半导体检测设备，成交67.3亿元。\u003c/li>\n\u003cli>宏观与商品：央行11月5日开展3000亿元买断式逆回购操作；五部门印发《实施全面节约战略行动方案》，大力推进燃煤锅炉、燃煤工业窑炉清洁替代，全面淘汰10蒸吨/小时及以下燃煤锅炉，加快布局一批稀贵金属资源循环利用项目，推进有价组分回收和高值化利用；现货黄金涨3.28%、报4058.93美元/盎司，现货白银涨4.86%、报52.19美元/盎司，油价重挫超8%。\u003c/li>\n\u003cli>AI支出与成本侧：苹果削减内部AI使用预算，部分使用AI模型的工程师每日支出上限从300美元下调至200美元；高通对下一财季给出平淡利润指引，理由是零部件与制造成本普遍上涨；Arm人工智能驱动的销售预测未能给投资者留下深刻印象。\u003c/li>\n\u003cli>Coherent业绩：FY27Q1营收23.7亿美元、同比+49.9%、Beat一致预期2.4%，其中Datacenter &amp; Communications收入19.5亿美元、Industrial收入4.2亿美元；FY27Q2指引超预期，全年收入增速预计加快；1.6T向多家客户放量，800G收入预计持续增长至CY27年，已展示3.2T OSFP光模块；PhotonLink获200亿美元级别LTA，InP产能Q1同比翻倍、比原计划提前一个季度。\u003c/li>\n\u003cli>半导体材料：靶材深度提出先进制程+晶圆扩产双轮驱动，竞争格局极好，看好国内龙头公司放量；晶圆扩产+HBM/Chiplet/CoWoS升级双逻辑拉动靶材需求；靶材覆盖130nm-3nm，客户覆盖台积电、海力士、中芯等全球主流晶圆及存储厂；设备配套服务中芯国际、长鑫存储、长江存储，封测批量供货长电科技、通富微电，先进封装检测设备进口替代。\u003c/li>\n\u003cli>PCB/液冷/算电协同：AI相关PCB年增速45%–70%，18层及以上高多层板15.7%，4至6层传统板仅2.3%；2026年AI服务器及网络设备供应商营收同比增长超50%，行业多数企业不足10%；英伟达Rubin；黑河片区公示绿色算电融合与跨境算力建设项目，由耀世科技（黑龙江）有限公司作为建设单位，预估总投资额71.8亿元。\u003c/li>\n\u003cli>机器人/其他行业：京东计划未来五年采购300万台机器人、100万台无人车和10万架无人机用于智能物流；宁波东力交流称谐波减速器及行星减速器均大规模量产中，主业工业齿轮箱和轮控系统，2025年新增精密减速器业务，前五大客户占比近25%；杰瑞股份全资子公司收到ADNOC Onshore三份项目授标函，合计26.967亿美元、约181.16亿元，四个中东项目合计超30亿美元；果链3D打印设备表壳已量产、铰链已导入，正走向放量拐点；家电出海“再平衡”，美国消费K型分化，必选渠道领跑，正把订单推向中国供应链。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>数据中心政策落地：跟踪民主党州和地方胜利是否引发数据中心建设暂时禁令，美国计划数据中心容量的45%是否受影响；德州2030年要上线美国算力的1/4，新州长带着严苛数据中心监管上台，后续监管细则与项目审批是关键。反向观点认为数据中心占GDP比重高，最终是把电网和基建成本转嫁给开发商，而非停建，需跟踪成本转嫁与停建风险的实际演化。\u003c/li>\n\u003cli>AI资本开支与变现：跟踪Coherent PhotonLink长约执行、InP扩产与自供率提升、1.6T放量、800G持续增长至CY27、3.2T OSFP进展；跟踪北美CSP资本开支强度与AI商业化对云业务增长的验证；另有观点认为美国中期选举结果或推动科技企业资本开支提速至2027年，需与数据中心禁令风险对照验证。\u003c/li>\n\u003cli>国产算力政策与订单：跟踪算力基建投资规划要求八成AI芯片来自国内供应商、算力网建设纳入PSL支持领域的落地节奏；跟踪对华科技限制制度化、长期化背景下，政策支持、研发投入和下游采购向国产方案倾斜的进展；关注超卖股风险回报比改善与“国家队”支持力度加大后的有选择建仓依据，关注寒武纪等10只超卖股。\u003c/li>\n\u003cli>半导体先进封装/靶材/设备：跟踪HBM/Chiplet/CoWoS升级对靶材需求的拉动，靶材客户覆盖台积电、海力士、中芯等的放量节奏；跟踪晶圆制造端真空检漏、洁净监测、化学品杂质检测等关键工序国产配套，封测环节长电科技、通富微电先进封装检测设备进口替代进展。\u003c/li>\n\u003cli>PCB/CCL技术路线：跟踪9-10月板块回调约40%、部分AI业务占比较高标的回撤约50%后的筹码位置；跟踪OCP大会上英伟达展出PTFE板卡样品后PTFE方案胜出概率、硅微粉受益逻辑；跟踪碳氢树脂在PTFE方案PP层配套使用、NVL576交换板CCL层测碳氢无布、M9以上用量确定，以及覆铜板M7→M8/M9/M10迭代的价格弹性。\u003c/li>\n\u003cli>液冷与新材料：跟踪英伟达全液冷；跟踪11月3日Element Six与Entegris建立长期开发合作伙伴关系，目标将金刚石热管理方案嵌入GPU与RF器件先进封装体系的商业化加速；跟踪数据中心自带电源（BTM）趋势提升下，SOFC因低碳社区友好获数据中心青睐的可能性。\u003c/li>\n\u003cli>新能源/储能数据与政策：跟踪四季度全球xEV销量是否强反弹以守住2026年预测，电池需求能否继续靠单车带电量提升+BEV结构跑赢整车；跟踪美国新能源装机预期上修与美股光伏股大涨的持续性，注意民主党支持的是美国光伏；国内储能方面，136和114号文叠加使2026成为近年政策端变动最剧烈一年，陕西拟将系统运行费纳入分时电价浮动，高峰/尖峰上浮70%/90%、低谷下浮70%，峰谷价差扩大直接增厚用户侧储能收益，需跟踪盈利模式改善与同飞股份储能温控、海外预制舱液冷利润兑现。\u003c/li>\n\u003cli>机器人/物理AI：跟踪京东五年300万台机器人、100万台无人车、10万架无人机采购计划的落地节奏；跟踪宁波东力谐波产能/订单兑现及精密减速器业务放量；跟踪美国中选后利率端压力缓解对一级市场融资、FCC政策进一步加强概率低的判断验证；手术机器人、脑机接口、AI医疗等创新方向，以及AI4S对高通量实验、自动化设备及耗材的需求值得继续关注。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>07:23｜20261104复盘 宏观： 1. 民主党以压倒性的胜利横扫两院，胜利不意外，横扫力度超预期。特朗普表示绝对愿意接受选举结果，准备与民主党合作。\u003c/li>\n\u003cli>07:24｜11月5日股市早报：芯片产业链/封测/新能源/AI短剧/6G/创新药/PCB/贵金属/人形机器人等一、重要财经信息①央行：11月5日开 function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
