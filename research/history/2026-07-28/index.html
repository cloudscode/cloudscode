】腾讯控股 （00700.HK ） 从混元到生态 ，WorkBuddy 卡位 AI智能体入口 [Table_Invest] 公司评级 买入 当前价格 434.60 港元 合理价值 669.24 港元 前次评级 买入 [Table_Summary] 混元不断追赶， 腾讯独有 产品生态 +AI 深度融合 飞轮效应 有望显现 。25年下半年腾讯提升自研模型 战略地位，从资本开支到人才 双向加码。姚顺雨引领模型研发以来， Hy3 Preview 和Hy3两个版本 加速追赶，有望在后续版本跻身第一梯队。腾讯 AI+生态优势在于通过 丰富产品、交互数据和生态 连接能力，为模型提供高质量上下文，发掘闭环任务场景。 \"模型 SOTA +场景链接 \"，使腾讯 未来 不仅在 B端实现收入规模化（云、模型订阅），也有望引领 C端应用创新， 例如， WorkBuddy 或 成为 AI时代办公入口、微信 AI智能体小微或逐步重塑社交体验 并增厚小程序交易生态。 WorkBuddy 精准 切入高频刚需 的效率办公 场景，用户规模和使用量正快速提升，是国内最有 望对标 OpenAI Codex 的效率办公智能体。 参考 Codex发展路径， 初期是针对开发者推出，近期知识工作 者采用速度比开发者快 3倍以上，从编程向工作场景渗透， 代表了新的工作范式。 Codex 26 年6月 周活达 500万，模型能力提升驱动用户渗透加速。 WorkBuddy 是腾讯继 CodeBuddy 后推出的办公 智能体，国内主要竞品为阿里 Qoder Work 和字节 Trae Work 。底层模型能力趋同的背景下， 产品核 心差异在于 体验。 WorkBuddy 在两个方面表现突出： （1）\"上下文与 Harness 设计\"，有效约束模型 稳定交付任务；对比来看 WorkBuddy 完成任务耗时最短。 （2）\"构建 8万+Skills\"，实现任务的标准 化和自动化 。短期来看，用户增长趋势 可参考 Codex；长期来看，国内办公软件皆为可渗透市场（参 考WPS超4.33亿月活设备数，空间较高）。商业化通过高价值场景切入，以订阅模式实现高复购 变现，并与腾讯云生态形成强协同，有望开启第二增长曲线。 盈利预测和投资建议。 我们维持前次业绩预测不变，预计 26-27年收入达到 8255亿元/9042亿元， 同比增长 9.8%/9.5% ；AI资本开支加大在下半年推动研发成本的提升，或拖累短期经营利润增速， 预计 26-27年经调整净利润为 2679亿元和 2817亿元，同比增长 3.2%和5.2%。以 26年收入和业 绩基于 SOTP测算合理价值为 669.24港元/股。维持 “买入”评级。 风险提示。 监管趋严的风险、游戏版号审核趋严的风险和 AI发展不及预期的风险。 [Table_BaseInfo] 基本数据 总股本 /流通股本 (百万股 ) 9092.52/9092.52 总市值 /流通市值 (百万港元 ) 395160 8/395160 8 一年内最高 /最低(港元) 677.50/411.80 30日日均成交量 /成交额 (百万) 36.31/16501.88 近3个月/6个月涨跌幅 (%) -8.14/ -26.66 [Table_PicQuote] 相对市场表现 [Table_Author] 旷实 SAC 执证号： S0260517030002 SFC CE No. BNV294 kuangshi@gf.com.cn 周喆 SAC 执证号： S0260523050003 SFC CE No. BJD408 zhouzhe@gf.com.cn [Table_DocReport] 相关研究 【广发传媒 &海外】腾讯控股 （00700.HK ）:26Q2前瞻：预计 收入表现稳健； Hy3+WorkBuddy 提振 AI信心 2026 -07-10 【广发传媒 &海外】腾讯控股 （00700.HK ）:经营趋势强韧； HY 模型提升赋能 AI+场景 2026 -05-14 【广发传媒 &海外】腾讯控股 （00700.HK ）:Q1前瞻：预计业 绩符合预期，关注 HY3.0 2026 -04-10 盈利预测 注： 归母净利润和 EPS 均为 NonGAAP 口径； 港币 兑人民币 汇率采用 0.8662:1 [Table_Finance] 2024A 2025A 2026E 2027E 2028E 营业收入（百万元） 6,603 7,518 8,255 9,042 9,826 增长率（ %） 8.4% 13.9% 9.8% 9.5% 8.7% EBITDA（百万元） 2,941 3,178 3,358 3,683 3,776 归母净利润（百万元） 2,227 2,5 n至关重要。真实场景中的用户需求为模型提供了解决问 题的方向，也有模型迭代需要的高质量数据。腾讯丰富的产品场景、交互数据和生态连接能力，能够为模型提 供高质量的上下文，发掘在生态中完成闭环的任务场景。 腾讯面向多元的 AI提效需求， 针对个人用户推出 Qclaw 和ima 等产品， 针对职场专业人群推出 Buddy 家族。 腾讯以用户不同的需求场景为主线，将智能体封装成不同层次的产品体系。（ 1）面向个人用户，主打开箱即 用。Qclaw直连微信，深度打通腾讯文档、 ima、腾讯会议、邮箱等核心办公应用，是最低门槛的效率智能体 工具。 ima是腾讯推出的智能知识库产品， 支持用户创建专属 agent。 元宝与浏览器， 支持一键接入龙虾。 （ 2） 面向职场专业人群推出了 Buddy系列产品。 WorkBuddy 定位为 AI智能体桌面工作台， CodeBuddy 为AI代 码助手， Miora和Ardot主要服务创意生成与交互设计的专业设计需求。 图 1：腾讯推出的效率智能体工具集 数据来源：腾讯云微信公众号、广发证券发展研究中心 模型服务Hy3 Hy Image 3.0 Hy World 2.0混元 模型第三 方模 型GLM Kimi DeepSeekHarness 引擎生态互联智能体用户连接 企业知识库 Agent 运行 全生命周期安全技能Skill 连接器 Connector 套件Plugin 产品Skill 行业Skill SkillHub 腾讯文档 腾讯 会议 QQ邮箱 微信支付 AI医疗 出行 零售7.5万+Skills 零代码原生构建高级开发工程师 私募股 权专家 内容创作专家腾讯文档 腾讯 会议 ima腾讯乐享 QQ邮箱 腾讯网盘 CodeBuddy WorkBuddy ima Qclaw 元宝 Ardot Miora 小微 [Table_PageText1] 公司深度研究 | 腾讯控股 请务必阅读末页的免责声明 06 / 31 二、HY模型投入增大，能力差距收窄 （一）团队和组织架构提效见成效 25年4月，腾讯进行了组织架构调整以提升 AI研发效率，更多是围绕组织提效进行的优化。 过去，混元团队 是以虚拟组织的形式，横跨在 TEG的大数据、机器学习平台部、 AI Lab等多个部门中。 2025年4月，腾讯 成立两个新的部门，分别是大语言模型部和多模态模型部，提升混元大模型的组织效率。同时，加大了大模型 数据能力和底座建设，成立 “数据平台部 ”和“机器学习部 ”，为 AI模型训练和推理提供底座。（ 1）数据平台部 负责腾讯混元大模型数据全流程建设与管理、评测体系建设，牵引大模型效果持续迭代；同时构建大模型各链 路运营、质量、研效体系；保障大模型服务安全、稳定、高效运行。 （ 2）机器学习平台部为 AI模型训练推理、 大数据业务提供全面高效的 PaaS平台底座，围绕数据和算力，构建超大规模的数据计算、 AI模型训练以及 推理部署的全栈式服务能力。 图 2：腾讯 AI架构调整（ 2025 年4月） 数据来源： 腾讯云官网、广发证券发展研究中心 25年12月，确立以姚顺雨为主导的 AI研发架构，成立 AI Infra 部，从组织架构到流程进行了重塑。 25年底 腾讯任命姚顺雨担任首席 AI科学家，向总办刘炽平汇报，担任 AI Infra部和大语言模型部负责人，对 TEG总 裁汇报。 HY模型在 2026年推倒重来，进行了架构重构，进行数据清洗，并完善训练环节，提升训练效率。 AI研究资源向大模型主线集中。为了进一步提升研发效率，原来数据平台改为 AI data部，撤销机器学习平 台部和 AI Lab，成立了 AI infra部、数据计算平台和 AI Data部。姚顺雨主导模型研发体系以来，在业内招揽 头部 AI科学家，为腾讯注入新的 AI人才体系。 技术应用 商业化 大语言模型部 多模态模型部 混元大模型 技术底座数据平台部 机器学习平台部 大数据 机器学习平台部 AI Lab 信息安全部 安全平台部元宝 微信+元宝 ima 广告 游戏 内容平台 医疗 云 [Table_PageText1] 公司深度研究 | 腾讯控股 请务必阅读末页的免责声明 07 / 31 图 3：腾讯 AI研发架构调整（ 2025 年12月） 数据来源： 腾讯 25Q4财报、腾讯云 官网、新华网、 广发证券发展研究中心 （二） HY模型加速追赶 混元模型 23年9月上线，构筑了多模态矩阵。 2023年9月，腾讯发布了全链路自研的通用大语言模型，混 元大模型。 2024年5月，混元文生图模型开源（ DiT架构）。 2024年11月，混元大语言模型、 3D模型开 源；12月，文生视频模型开源。 2025年1月混元 7B模型开源，混元 3D模型升级到 零部件自制率极高，推动整机毛利率迎来大幅提升，同时维保、耗材构成重要业绩增量。 存储材料增长迅速，以钼代钨预期差巨大：1）公司6N级四氯化铪、二氯二氧化钼、特气（含锗烷）等批量进入韩系存储、两存等全球龙头晶圆厂，2024-2026年实现大幅增长，妥妥的细分材料小巨人；2）以钼代钨是3D-NAND重要趋势，钼具备更好导电性、占据空间更小，目...", "publish_time": "2026-07-28 10:10", "tags": ["文字观点"]}, "attachment:files/中信建投-机械设备行业周观点：看好半导体设备产业趋势，高阶mSAP工艺类载板积极扩产利好PCB设备龙头-260727.pdf": {"id": "attachment:files/中信建投-机械设备行业周观点：看好半导体设备产业趋势，高阶mSAP工艺类载板积极扩产利好PCB设备龙头-260727.pdf", "kind": "attachment", "title": "中信建投-机械设备行业周观点：看好半导体设备产业趋势，高阶mSAP工艺类载板积极扩产利好PCB设备龙头-260727", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业动态 周观点：看好半导体设备产业趋势，高阶 mSAP工艺类载板积极扩产利好 PCB设备龙头 核心观点 （1）人形机器人：板块多重催化共振，特斯拉人形机器人迈向 量产，看好板块持续性。 （2）AIDC发电设备：GE V上修接单 与产能目标，杰瑞再获百亿订单，验证全球燃机高景气。 （3） 工程机械：6月挖机内外销继续超预期，低位坚定布局。 （4） 半导体设备：全球半导体设备进入大周期，关注涨价 +出海。 （5）锂电设备：新国标落地，固态电池行业发展提速 。 行业动态信息 人形机器人：板块多重催化共振，建议聚焦优质环节。 特斯拉 Optimus迈向量产时代，宇树 IPO顺利推进，优必选发布超仿生 新品，板块多重催化共振。物理 AI是人工智能的下一波浪潮， 机器人是AI最好的物理载体之一，产业发展趋势明确。头部厂 商积极推进人形机器人在工业、商业等场景下的应用；随着机 器人泛化水平提高，预计其落地场景将进一步扩大， 2026年有 望成为人形机器人垂类应用大年。龙头量产有序推进，且供应 链量产量纲指引逐步清晰，其放量节奏得以验证。后续 V3产品 发布、量产应用值得密切关注。此外国产机器人公司新品发 布、IPO推进、应用落地持续为板块行情带来催化，看好板块行 情表现，建议聚焦优质环节。 AIDC发电设备：GE V上修接单与产能目标，杰瑞再获百亿订 单，验证全球燃机高景气。 本周GE V发布财报，Q2燃机正式订 单与排产预留合计达到 116GW， 上修2026年接单目标至125GW， 并预计2027年燃机签约规模进一步提升； GE V计划进一步扩 产，已开始采取措施推动 2030年产能达到30GW。此外，杰瑞股 份发布公告， 其与云服务提供商签订 14.65亿美元合同 （1GW +）， 约合人民币99.5亿元，预计2027年11月之前分批交付。我们认 为：GE V财报上修订单指引并计划进一步扩产，杰瑞股份签订 百亿燃机大单都再一次验证了 燃机仍处于高景气周期， 2026年并 非订单见顶时点，行业仍然处于供不应求的状态，短交期燃机产 能仍然是稀缺资源，国产燃机产业链具备整机及配套设备出海能 力，正凭借交付能力以及高性价比优势加快拓展海外市场，坚定 看好国产燃机出海。 维持 强于大市 许光坦 xuguangtan@csc.com.cn SAC 编号:S1440523060002 SFC 编号:BWS812 陈宣霖 chenxuanlin@csc.com.cn SAC 编号:S1440524070007 籍星博 jixingbo@csc.com.cn SAC 编号:S1440524070001 吴雨瑄 wuyuxuan@csc.com.cn SAC 编号:S1440525070008 乔磊 qiaoleibj@csc.com.cn 010-56135085 SAC 编号:S1440525070006 发布日期： 2026年07月27日 市场表现 0%20%40%60% 202 5/7/ 21 202 5/8/ 21 202 5/9/ 21 202 5/10 /21 202 5/11 /21 202 5/12 /21 202 6/1/ 21 202 6/2/ 21 202 6/3/ 21 202 6/4/ 21 202 6/5/ 21 202 6/6/ 21 机械设备上证指数机械设备 下载日志已记录，仅供内部参考 机械设备 行业动态报告 请务必阅读正文之后的免责条款和声明。 工程机械:6月挖机内外销继续超预期 ， 低位坚定布局。 2026年6月销售各类挖掘机25445台， 同比增长35.3%。 其中：国内销量10898台（含电动挖掘机65台），同比增长33.9%；出口14547台（含电动挖掘机34台），同 比增长36.4%。国内、外增速提速，今年挖机内销呈现较为明显的旺季后移，因为今年春节相比去年较晚，国内 挖机自3月以来恢复较高的同比正增长，预计后续将继续维持增长。出口维持较强表现，并未受国际形势、关 税变化、降息等扰动，中国工程机械高增态势依 旧维持。国内格局改善，头部企业开始涨价。 5月1日起，三 一、徐工、柳工、山推等公司宣布对挖机进行约 5%的涨价，三一、徐工对起重机产品也进行涨价，反映年初以 来的行业价格战趋缓，转向良性发展。 半导体设备：全球景气周期持续确认，关注涨价 +出海。SE MI更新预测、预计半导体设备未来 3年持续增长。 SEMI预计2026年全球半导体制造设备销售额将创下 1659亿美元的历史新高，同比 +23.2%。增长势头预计将 持续至2028年，总设备销售额有望达到创纪录的 2295亿美元，实现连续五年增长。 台积电上修26年资本开 支。台积电预计2026年全年资本支出为600亿至640亿美元，此前预估为 520亿至560亿美元，上调80亿美 元，幅度约15%。AS ML整体业绩全面超市场及公司前期指引。 季度总净销售额93.26亿欧元，同比+21%、环 比+6.4%，大幅超越公司前期 84–90亿欧元指引及市场88.5亿欧元一致预期，年内第二次上调全年业绩目标， AI算力+存储复苏双驱动行业高景气，盈利结构持续优化。 全球半导体设备零部件正经历一轮历史罕见的全链 条涨价潮。半导体产业链的定价权正从芯片终端向设备与零部件环节结构性上移。零部件企业规模较小、固定 成本占比高，涨价直接转化为利润；同时产线扩产周期长达 12-18个月，供给弹性最差。重视阀门管路、陶瓷 件、射频电源、GAS BOX等海外供应商交期延长带来的国产替代诉求与涨价逻辑。 锂电设备：新国标落地，固态电池行业发展提速。一是政策标准端，7月1日全球首部车用固态电池国标 GB/T 43568-2026正式实施，以液态电解质含量占比量化界定液态、混合固液与全固态电池，明令禁用 “半固 态、准固态、类固态” 等模糊营销称谓，彻底厘清行业技术概念乱象，以标准化规范持续引领行业合规化、规 模化发展。二是量产建设端，多条 标杆产线迎来关键节点：道克特斯 GWh全固态产线7月1日投产，量产电 芯能量密度达 350Wh/kg，恩力动力滁州2GWh混合固液基地完成产能爬坡达产，赛科动力宜宾 0.1GWh全固 态中试线预计年底建成，从行业总量看， 2026年上半年固态电池全产业公开规划总投资超 300亿元、在建产 能突破100GWh，产业从研发投入加速转向产能释放周期。三是锂电设备景气端，头部订单、盈利同步修复： 先导智能一季度新签订单 96亿元，同比+60%，以国内外锂电设备订单为核心增量，储能设备同步配套增长。 锂电设备行业整体订单增速维持 20%-30%，整体毛利率进一步回升，行业高产能利用率推动设备端持续供不 应求。车企与电池企业产业化节奏明确，广汽 2026年启动混合固液电池装车验证，宁德时代、比亚迪分别规 划2027年实现全固态电池小批量生产、示范装车，产业化时间表持续清晰化。当前板块处于 “标准落地+量产 突破+设备兑现”三重共振窗口期，继续看好锂电设备与固态电池板块配置价值。 机械板块重点推荐： 中国动力、东威科技、杰瑞股份、中国船舶、恒立液压、奥比中光、三一重工、豪迈科 技、埃科光电、中微公司、先导智能、博众精工、徐工机械、中集集团、华测检测、迈为股 份。 风险分析：国内宏观经济波动的风险、海外市场波动的风险、下游扩产不及预期的风险。 下载日志已记录，仅供内部参考 机械设备 行业动态报告 请务必阅读正文之后的免责条款和声明。 目录 总体观点：看好半导体设备产业趋势，高阶 mSAP工艺类载板积极扩产利好 PCB设备龙头.................................... 1 专用设备重点子行业观点 ..................................... 美客户2027年800G/1.6T光模块需求已", "content": "【招商通信】大幅调整后如何看光模块-260728 ❕光通信板块今日调整幅度较大，市场对光模块年降幅、甚至对光模块龙头的业绩预期有所担忧，我们结合近期产业的调研实际情况，作出以下理解： ☀️[关于供需格局] 1️⃣综合行业龙头交流及DSP物料跟踪情况，仅北美客户2027年800G/1.6T光模块需求已达9000-10000万只（对比26年预计实际交付北美客户800G 5000-6000万，1.6T 2000-2400万），且客户多元化趋势明显。 2️⃣光模块出现新供应商，本质是客户应对需求大幅增加的保供举措。同时，当前及未来至少两年，光模块的交付瓶颈在物料（DSP、光芯片、mSAP等），且核心物料呈供不应求，#物料准备程度决定光模块厂商的交付上限。当前还可看到光模块龙头提前为NPO备料。 3️⃣核心物料的及时获取，需要长协/预付款以及强大的供应链能力，头部厂商优势明显。光模块厂商的物料情况，预计可在2026中报清晰对比体现。 ☀️[关于价格及利润率] 1️⃣年降是光通信的行业惯律、也是良性发展的体现。技术迭代则是光模块及光互联产品，实现价值量和利润率提升的核心因素。当前光通信的技...", "publish_time": "2026-07-28 21:32", "tags": ["文字观点"]}, "post:2026-07-28T22-29:67705e676e49": {"id": "post:2026-07-28T22-29:67705e676e49", "kind": "post", "title": "2026-07-28 22:29", "source_label": "帖子正文", "excerpt": "中际旭创2026.07.28投资者电话会议核心总结 本次会议核心目的：针对市场流传1.6T光模块低价传闻、美股AI产业链下跌引发的行业悲观情绪两大核心担忧做澄清，并同步订单、竞争、毛利率、技术路线、国内市场等经营信息。一、澄清市场两大核心利空传闻 1. 1.6T价格暴跌至600美金传言完全不实 1.", "content": "中际旭创2026.07.28投资者电话会议核心总结 本次会议核心目的：针对市场流传1.6T光模块低价传闻、美股AI产业链下跌引发的行业悲观情绪两大核心担忧做澄清，并同步订单、竞争、毛利率、技术路线、国内市场等经营信息。 一、澄清市场两大核心利空传闻 1. 1.6T价格暴跌至600美金传言完全不实 1. 公司明年1.6T实际报价远高于传闻价格，同行主流厂商也无该低价，不存在行业恶性价格战； 2. 不同传输距离（SR/FR/LR/ZR）、EML/硅光版本、多模/单模产品价差极大，不能笼统统一报价，网传低价仅极少数非主流型号，不代表行业加权ASP； 3. 行业每年存在常规合理年降，但不存在传闻中动辄几十%的极端降价，公司报价可稳定支撑毛利。 4. 供需基本面支撑价格：当前16T物料紧缺、交付产能稀缺，2026下半年至2027年仅少数厂商具备大规模交付能力。 2. 下游客户资本开支可持续，无需悲观 1. 订单能见度极高：绝大多数客户已锁定2027年定量交付订单，800G/1.6T需求增长确定性强，同时2.4T、NPO、XPO等新品需求明确； 2. 头部大客户已给出2028年...", "publish_time": "2026-07-28 22:29", "tags": ["文字观点"]}, "attachment:files/电子布：再谈供需格局.docx": {"id": "attachment:files/电子布：再谈供需格局.docx", "kind": "attachment", "title": "电子布：再谈供需格局", "source_label": "其他", "excerpt": "这次会议稍微有点特殊，在近期整个科技相关的材料板块有一个大幅调整。但今天大家也看到了，就是长期上市之后，整个科技板块的整体氛围还是不错的，我们认为前期像整个电子新材料，尤其电子布板块，基本面没有发生特别大的变化。", "content": "这次会议稍微有点特殊，在近期整个科技相关的材料板块有一个大幅调整。但今天大家也看到了，就是长期上市之后，整个科技板块的整体氛围还是不错的，我们认为前期像整个电子新材料，尤其电子布板块，基本面没有发生特别大的变化。调整其实更多的还是大家交易层面的一些因素。所以这个位置，我们认为电子布、整个电子板块还是值得大家重点关注的一个机会。 我们这边主要分两部分。第一我先讲一下整体观点。待会儿我们团队分析师来就这个电子布板块的需求状况、供给格局，包括最新的一些情况，再给大家做一个PPT的更新。首先，我们在7月19号也请了生益科技的专家做过交流。从下游需求的角度来说，英伟达服务器的进展完全是正常进行的，也不存在之前传的小作文的情况，说材料方案有推迟或者出货时间有推迟，这个情况完全不存在的。以Rubin为例，材料方案基本上完全定型，就是compute tray使用M8加low DK1，switch tray是M8加low DK2。 然后中板还有这个背板的网卡是用M8加low DK2，GPU是M9加二代布，还有M9加Q布的混压。从我们跟踪下来，主要的一些上市公司，像宏和、泰玻、国际复材，他们6到7月份都进入了一个量上开始放量的周期。从CCL的角度来说，也是确实这个情况。预计从七月份开始，每个月可能都有20%到30%的环比增量。这个是Rubin的情况。像之前也存在Rubin Ultra这个方案，也不存在所谓的延时交付，应该还是在按计划27年的下半年开始量产。27年预计出货量大概在2万到3万台机柜。只不过这个方案有可能在明年的Q2最终确定，是用PTFE加碳氢，还是用M9加碳氢。应该是M10，就是这个Q5加碳氢的方案。这些方案对他可能影响的只是Q5，其他的应该基本上都没有特别大的影响。因为只是这个正交板，然后可能是在明年Q2最终去定下来会不会用PTFE。如果用PTFE的话，我们这些材料也有相关的上市公司会显著受益，像东岳、昊华等。然后到电子布这边，大家看到的就是无论是普通的电子布还是特种电子布，2026年以来价格都有不同程度的上涨。普通布可能上涨多一些，在80%到90%。特种布大概在20%到30%的涨幅。我们和行业里边主要的公司以及供应链沟通下来，下半年可能还有一个20%到30%的涨幅。目前来看，无论是CTE还是二代布，都是供不应求的状态。最终大家可能还是担心供应会不会有一个比较显著的增加。 首先从我们目前了解的织机情况来看，大家都有不同程度的推迟。丰田织机应该最快在2027年12月份才会把月产能扩到300台。国内主要的这几家公司，原来订货都是分批交付的，基本上分到3到4批来交付。国产织机目前还没有被证实可以用于织电子布，可能还仅限于织工业布，大概是这样一个状态。总体来看，无论是从行业的供给和需求，前期大家担心的这些情况，可能也是市场下跌之后大家担心比较多，鬼故事也比较多。我还建议投资者还是从长期产业逻辑的角度去对待整个行业。 无论是普通布还是特种电子布，我们觉得供给相对都是有限的。普通布也是类似的情况，前期中国巨石这边也反馈，他们新增的2.5亿米对市场有一定冲击，但这个应该是28年才会放出来。在27年整个年度，行业没有特别大的新增供给。从需求的角度来说，还是有一个稳健的增长。普通电子布这边，整个26年点火的线应该基本上就是巨石的淮安这条线。建滔基本上是以自用为主，它在清远有三条线，但基本上是以自用为主。其他的像林州光远、泰山玻纤今年点火的全是特种电子布，并且明年泰玻这边也还有冷修，所以普通电子布这边，预计年底之前可能还会有一个2到3个点的涨幅。但上周我们在深圳做的新材料闭门会里边，请了卓创资讯。卓创资讯判断这轮可能会突破前期新高，可能到15块钱左右的价格。当然这是比较乐观的情形。整个电子布的市场增速预计有16%到17%。就是普通电子布市场整体不变，3万米，普通电子布增速可能是在个位数，但整体来说需求角度大家不用担心，供给格局没有特别大的变化。 然后其实6到7月份本来就是一个放量的时间段，只不过是近期六月份的一个比较大幅的上涨，再加上七月份的一个暴跌，导致大家对整个行业的逻辑可能有一些担心。所以今天我们在开这个会，主要还是希望再从供给和需求这几个角度，整个行业的情况，还有主要上市公司情况再做一个梳理。请分析师接一下PPT。具体的标的上，我们还是建议普通布这边中国巨石，特种电子布重点推进中材科技、宏和科技、国际复材。这几个在二线的品种里面可以看一下聚集微信，还有那个光远新材，我这边分享主要这些。 分析师 好的，各位投资者晚上好，我是分析师。接下来我把电子布目前大家比较关心的一些行业热点问题以及行业供需做一个整体的梳理。最后汇报一下我们最近推荐的一些核心标的。 首先我们从需求端快速过一下。因为之前大家也比较关注北美云厂商资本开支的扩张节奏等，就是说需求这一端会不会有一些变数？其实从目前来看，整体的从资本开支到需求这一端的逻辑还是非常顺畅的。从之前的数据，上boss机房数据给到的26年北美的云商资本开支预期是在持续提升的。九大CSP整体的26年资本支出预估在8300亿美金左右，增速也从61%上升到79%。 像最近发布的谷歌26年二季度财报，Alphabet单季资本开支449亿美元。26年全年资本开支指引也从1800到1900亿美金进一步上调到1950到2050亿美金，进一步加快扩充算力和数据中心的能力，以满足AI相关的需求。此外我们还了解到，微软在26财年的规划资本开支总预算也达到了2100到2200亿美金，35%以上用于支付硬件采购，90%的份额会优先采购英伟达的产品。所以说，目前北美云厂商的资本开支扩张节奏并没有放慢，反而增速在边际提升。 之前想必有同学可能也看到过这样子的表。从硬件架构这一块来看，英伟达Vera Rubin这一代的机架，PCB的价值量有大幅提升。新一代Vera Rubin NVL72机架，两个托架容纳四个Rubin GPU加2个Vera CPU，整个NVL72机架有72个GPU和36个CPU。整体的Vera Rubin机架总价值780万美金，较上一代GB300提升了95%。PCB这一块，材料的层数也在增加，整体价值量大幅跃升，增速是232%。 我们跟踪目前行业的出货节奏，预计今年5、6月份已经开始出货了。那么，6至7月份，每个月都在出货，大概有小几千台的体量。预计2026年整体的年出货量能够达到2万柜。27年我们预计整个出货量能够达到6到8万柜。同时，他会一定程度挤占GB300的需求，直到后续完全被Vera Rubin替换。Rubin Ultra的话，前面主持人也提到了，会完全按照原计划在2027年下半年进行量产。2027年预计整体的出货量大概在2到3万台机柜。 然后我们也是对整个AI主线下，电子布未来的需求增量做了一个重新的梳理，包括结合最新的用料材料方案等各方面，做了一个简单的梳理。首先从四个维度来看。第一个主线就是英伟达的架构。Blackwell这一块，我们维持之前的测算结果，大概单位特种布需求量是190平方米。2026年，Blackwell平台整体主要的耗布量还是在一代和二代这一块，整体的需求规模大概在1500万平米左右。 到了Rubin，因为它的方案也在不断更新和变化。最新我们测算下来，Rubin平台大概26年能够产生近900万米的特种布耗布量，二代布大概占到了370万米。27年随着它整体的出货量放大到7到8万柜，整体特种布的需求量要接近4000万米，二代大概在1650万米，一代布大概在1200万米。 ASIC这一块，整体也是进一步提升。我们基于单张CCL大概5米耗布量的假设，最后得出的结论是26年ASIC这边特种布的总需求量大概在6300万米左右，一代和二代大约各占50%。27年预计整个需求量要超过1亿米，结构会进一步向二代布倾斜。交换机这一端，400G的交换机主要还是一代布，800G的交换机主要需求量在二代布。升级到1.6T的交换机，我们预计还是会一定程度上引入Q布。 我们测算下来，26到27年，整个交换机这一端的电子布特种布需求量大概在1300万米和2100万米。封装载板包括智能终端这一块，因为低热膨胀布主要用在CoWoS等先进封装以及消费电子，我们测算的结果，低热膨胀布26年预计需求超过3700万米，27年需求量超过6000万米。 最后汇总之后，我们认为26到27年整个特种布的需求还是非常高速释放的，整体的需求量在3.5亿米和5.7亿米，包括大概3亿米左右的低阶电子布，以及大概5000多万米的低热膨胀布。到27年的话，大概是5亿米左右的低阶电子布，接近7000万米的低热膨胀布。 然后我们再进一步给大家看一下对电子布行业供给端的梳理情况。 首先从整体的玻纤维度来看，目前国内主要像巨石、国际复材、泰山三家龙头企业，三家的玻纤产能合计占到全球一半。其中巨石占27%，复材占10%，泰山占13%。 其他的还有像美国的欧文斯科宁、佳斯迈威，以及日本的企业。前六大核心企业占比要占到全球70%的玻纤产能。整体来看，头部企业的市占率还在进一步加大优势。具体到国内，大部分玻纤产能分布在华东。巨石的在产产能基本占到30%，泰山接近20%，复材占13%左右，山东玻纤占8%。整体来看，前三大企业产能格局非常稳固。新增的产能这两年确实有增加，但展望中长期，预计还是以头部集中的趋势为主。 然后我们可以看一下，现在市场也在讨论电子纱的供给情况。这个是今年上半年国内主要玻纤产能的变化情况。我们比较关注的电子细纱这一端，能够看到重庆复材8.5万吨投产，这块主要也是自用。再有就是江苏，巨石的2个5万吨投产。其次就是建滔的7万吨，也是自用为主。细纱这一块合计的新增产能主要就是这几块。 玻纤这一块，今年上半年国内产业在需求不断增长的推动下，产量有所增加，整体增幅大概是7.8%左右，接近8%。然后我们结合之前的测算，对26和27年特种电子布的需求情况，以及国内主要的特种布企业的供给情况，测算得出目前整体行业的缺口非常明显。 首先，2026年，我们测算下来，四种核心的特种布品种月需求量大概在2850万米左右。目前月供给体量大概在1700万米，整体缺口比例在40%左右。到27年，这个缺口还是维持在这个水平，因为27年的需求预计还在进一步提升。虽然产能有增加，但缺口还是在 长，还是有向上空间的。价格传导方面，我们跟下游CCL和PCB厂商的专家和产业内人士交流，看到大家都有涨价预期，整体价格上涨传导非常顺畅。综合来看，各种电子布的投资逻辑非常明确。 而且本质上就是供给约束下的涨价、涨业绩的趋势逻辑。护城河非常清晰。头部企业的优势，包括他们的业绩增长趋势确定性都非常明确。其实我们觉得现在这个位置已经跌出了一个非常好的价值，向上能够看到非常好的业绩和估值的弹性空间。 如果说推荐顺序，我们目前一个是巨石，因为它的涨价逻辑和盈利弹性非常明确。其次，因为我们也跟踪下游英伟达整个机架方案，二代布的需求量非常大，会比我们之前预期的要高一些，因为Q布没放出来，二代布的需求量反而放出来了，所以我们也比较推荐复材。其次是宏和，宏和因为它的T布目前在全球范围内没有什么可以替代的，所以它的结构、逻辑和盈利能力也非常清晰。然后中材因为它的性价比非常高，这个位置，所以这就是我们的推荐顺序。也欢迎感兴趣的投资者联系我们。 全文总结 本次会议围绕电子布板块的供需格局与投资机会展开，重点分析了AI算力扩张带动下特种电子布和普通电子布的需求爆发、供给端的刚性约束，以及相关标的的业绩弹性。 需求端：英伟达Vera Rubin平台在2026年开始出货，全年预计2万柜，27年增至6-8万柜，带动PCB价值量大幅提升（较GB300提升95%），电子布用量随之快速增长。加上ASIC、交换机、先进封装等需求，测算26-27年特种电子布总需求量分别达3.5亿米和5.7亿米，其中低阶电子布约3亿米和5亿米，低热膨胀布约5000万米和7000万米，增速极高。普通电子布也受益于AI溢出效应，需求稳健增长，市场增速约16%-17%，但普通布增速为个位数。 供给端：核心瓶颈在于电子纱和织布机。电子纱扩产受工艺稳定性和良率限制，外供增量有限；全球电子级织布机仅丰田和多尼尔能稳定供应，丰田扩产缓慢，织机紧张至少持续到2028年。国内织布机尚无法批量生产电子级布。当前行业缺口明显：2026年特种布月需求约2850万米，月供给仅1700万米，缺口约40%，且越高端品种缺口越大。2027年缺口维持，2028年小幅收缩但仍处高位。 价格趋势：普通布（如7628）年初约4-5元/米，目前已涨至8.5元，乐观预计年底可达15元，远超历史新高。特种布中，一代布约35元/米，二代布约100元（高端120-140元），T布约120-140元，毛利率分别可达25-30%、50%、70%以上。下半年预计还有20-30%的涨幅，且价格传导顺畅。 主要标的： 中国巨石：普通布龙头，生产规模优势显著，涨价弹性巨大。26年预计利润80-85亿，27年超百亿，目标市值2200-2500亿。 中材科技（泰山）：特种布全品类布局，绑定台光，自供纱。26年预计利润30亿，27年45亿，目标市值1500亿。 宏和科技：T布品质全球领先，盈利能力最强（T布毛利率超70%），26年目标利润14亿，27年38-39亿，目标市值2000-2300亿。 国际复材：二代布龙头，产能扩张节奏明确，下游需求旺盛，业绩确定性高。 核心逻辑：AI驱动需求持续高增，供给受限于电子纱和织布机，供需缺口至少延续至2028年，带动电子布价格持续上涨，头部企业业绩弹性极大。当前板块调整至低位，估值具有吸引力，建议重点关注。", "status": "extracted"}, "attachment:files/GS-诺基亚（NOKIA.HE）——光通信动能持续积聚，产能扩张稳步推进；估值中性维持评级.pdf": {"id": "attachment:files/GS-诺基亚（NOKIA.HE）——光通信动能持续积聚，产能扩张稳步推进；估值中性维持评级.pdf", "kind": "attachment", "title": "GS-诺基亚（NOKIA.HE）——光通信动能持续积聚，产能扩张稳步推进；估值中性维持评级", "source_label": "GS", "excerpt": "1IRHYEiArX8YaY8OdNbRpNqQtRsMkPpPqPjMnPpQ8OrQqQMYrNrPNZpPrN ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408", "content": "1IRHYEiArX8YaY8OdNbRpNqQtRsMkPpPqPjMnPpQ8OrQqQMYrNrPNZpPrN ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408", "status": "extracted"}, "post:2026-07-28T09-39:4e65bd5fd76b": {"id": "post:2026-07-28T09-39:4e65bd5fd76b", "kind":  请务必阅读正文之后的免责条款和声明。 核心观点 国内高阶智驾算法赛道的竞争格局，从 2024年的“多点试错、百家争鸣 ”，快速收敛为三类玩家分层并存、 头部极度集中的结构：第一类是独立第三方算法商，以Momenta、元戎启行为核心，不造车、不自研传感器硬 件（部分定义域控方案），对外输出完整量产 L2+/ 城市NOA算法方案，承担多数传统车企和合资品牌的城市 NOA落地任务；第二类是从芯片出发+工具链向上延伸方案商 ，以车载 AI 芯片为基本盘，配套自研算法、开 发工具链，打包向车企交付软硬方案 ，代表为地平线、黑芝麻智能；第三类是车企自研全栈一体化阵营 ，代表 为特斯拉、小鹏、理想、蔚来、比亚迪；长城、吉利 等。不同阵营技术路线、盈利目标、客户群体存在天然差 异，赛道难以形成单一企业赢家通吃格局，中长期将走向分层共存的稳态竞争格局。 市场最关注的核心问题是：当智驾平权， 需求从高端尝鲜迈向主流标配后，产业价值如何在车企自研、第 三方方案商与软硬件生态之间重新分配 。我们尝试回答以下问题： 1）车企自研到底有多难？谁能成功？ 综合来看，我们认为 车企全栈高阶智驾自研具备极高的落地门槛 ，资金、销量、技术人才三重壁垒构筑了 显著的行业护城河，绝大多数车企难以实现从零到一的完整自研闭环。 1）资金层面：搭建千人级智驾团队+ 云端算力集群+仿真平台，年投入至少 25~40亿元，完整从0到1跑通城市NOA需要3~5年持续投入；2）销 量层面：行业已形成明确共识，车企年销量 大于40万辆，才能够支撑数据闭环的正向循环 ，销量不足，车辆 基数少、长尾场景缺失，模型迭代 会持续落后头部供应商 ；3）技术层面：行业正快速迭代至端到端、世界模 型架构，技术路线容错率极低， 一旦路线误判（固守传统模块化算法）， 3年就形成代差；同时智驾研发需要 算法、底盘、电子电气多体系深度协同， 传统车企组织架构普遍存在短板 。 哪些车企自研能跑通，哪些最终会放弃？ 我们认为高门槛下车企自研呈现显著分层格局，行业将形成 “头 部全自研、中部半自研、尾部纯外购 ”的稳态结构。特斯拉、比亚迪、理想、小鹏、蔚来 、小米等头部新势力 及自主龙头，拥有充足的销量底盘、高新能源渗透率 ，同时管理层战略坚定，愿意长期承担亏损， 并把智驾作 为核心产品卖点。绝大多数二线自主品牌及合资车企 （丰田、大众、通用、奔驰、日产等） 将选择折中路线， 采取“半自研+外部联合开发”模式，聚焦顶层产品定义与用户交互体验，将底层 BEV模型、端到端算法、域控 方案等核心技术环节对外采购，以 Momenta为代表的中立第三方成为核心合作方 ，可能部分采取“白盒授 权、联合调优”模式，不会从零搭建完整千人算法团队。而年销量不足 20万辆、盈利承压且智能化战略摇摆 的尾部车企，难以通过自研实现体验突破，后续将逐步收缩自研团队，全面转向外购成熟智驾方案。 2）车企全面自研会不会替代第三方供应商？ 市场普遍存在“车企全面自研将替代第三方供应商 ”的认知误区，我们判断车企自研不会消灭第三方赛道， 仅重塑行业结构。真实产业趋势 是：自研是头部自主品牌的选择；合资、二线自主、海外市场是第三方 的基本 盘。当前头部车企自研仅集中于国内一线自主品牌阵营，无法覆盖全行业需求。对于合资车企、二线自主车企 及海外车企而言，华为封 闭生态存在供应链主权顾虑，且自主全栈自研周期过长、难以适配国内智驾快速迭代 节奏，中立、开放、无竞争冲突的第三方方案商成为最优选择。 行业总盘持续扩张，第三方平台市场份额分化但成长空间仍在。智能驾驶产业正处于由渗透率提升向规模 化普及演进阶段，行业整体市场空间持续扩大。从产业链价值分布来看，软件和智能化应用成为增长最快的环 仅供内部参考，请勿外传 2 海外行业深度报告 汽车零部件 请务必阅读正文之后的免责条款和声明。 节。2023—2035年，智慧出行生态和上层应用（包括智能驾驶、智能座舱等功能） 复合增速分别达到28%和 15%，显著高于计算平台硬件约 3%的增速；与此同时，中国智能驾驶解决方案市场规模预计将由 2021年的 433亿元增长至2026年的2671亿元，ADAS SoC市场规模也将由2022年的87亿元增长至2026年的390亿 元。智能驾驶产业正由硬件驱动逐步转向软件、算法及平台驱动，为不同类型平台企业提供了持续增长的市场 空间。 随着头部车企加快全栈自研，第三方平台在国内头部自主品牌中的市场份额预计将受到一定挤压，但市场 需求并不会同步萎缩。一方面，全栈自研需要持续的研发投入、数据积累和组织协同，仅比亚迪、华为、理 想、小鹏等少数头部企业具备长期投入能力；大量传统自主品牌、国际品牌及中小车企仍将依赖第三方平 台实 现智能驾驶快速量产。另一方面，海外 OEM更加倾向于采用 电气架构及数据闭环的全栈能力竞争。比亚迪、华 为、吉利、理想、小鹏等头部企业依托百亿级研发投入、规模化 销量及海量数据，加速构建软硬一体智能驾驶体系，形成技术、 数据和成本优势。全栈自研将持续提升头部车企竞争壁垒，但由 于研发投入高、组织协同复杂，仅少数头部企业具备长期投入能 力，第三方平台仍将是多数车企实现高阶智驾量产的重要选择。 芯片企业平台化：软件价值持续提升，软硬一体成为竞争核心 软件定义汽车推动产业价值加速向软件、算法和平台迁移，芯片 企业正由单一硬件供应商向智能驾驶平台方案商升级。地平线、 黑芝麻智能等企业持续完善“芯片+算法+工具链+开发平台”产品 体系，软件授权和平台服务成为新的增长动力。随着整车企业需 求由采购芯片转向采购整体解决方案，平台化能力、软硬协同能 力及生态建设将成为智能驾驶芯片企业提升盈利能力、参与全球 竞争和分享产业价值增量的核心竞争优势。 维持 强于大市 于伯韬 yubotao@csc.com.cn SAC 编号:S1440520110001 SFC 编号:BRR519 发布日期： 2026年07月27日 市场表现 相关研究报告 26.06.30 【中信建投海外研究】:智能驾驶行 业之一：Robotaxi规模化、 激光雷达 标配化与芯片架构重构 -14%-4%6%16%26% 202 5/7/ 23 202 5/8/ 23 202 5/9/23 202 5/10 /23 202 5/11 /23 202 5/12 /23 202 6/1/ 23 202 6/2/ 23 202 6/3/ 23 202 6/4/ 23 202 6/5/ 23 202 6/6/ 23汽车恒生指数海外研究 仅供内部参考，请勿外传 海外行业深度报告 汽车零部件 请务必阅读正文之后的免责条款和声明。 目录 核心观点 ................................ ................................ ................................ ................................ ................ 1 一、第三方算法供应商崛起，开放平台模式驱动量产智驾落地 ................................ ............................... 4 1.1 开放平台模式快速发展，第三方算法供应商成为量产智驾重要参与者 ................................ ........ 4 1.2 Momenta：开放平台龙头，量产能力行业领先 ................................ ................................ ............ 7 1.2.1 AI创业顺势而生，技术积累推动公司持续成长 ................................ ................................ . 7 1.2.2 产业资本深度布局，多元股东赋能长期发展 ................................ ................................ ..... 8 1.2.3 核心团队优势突出， AI基因决定技术路线 ................................ ................................ ....... 9 1.2.4 业务协同发展，商业化能力不断兑现 ................................ ................................ ............. 10 1.3元戎启行：轻量化路线切入中端市场 ................................ ................................ ........................ 17 1.4 文远知行：Robotaxi领先，量产业务相对滞后 ................................ ................................ ......... 18 二、全栈自研模式加速普及，产业价值向整车厂持续集中 ................................ ................................ .... 20 2.1全栈自研成为行业趋势，头部车企加速构建智能驾驶闭环 ................................ . 们认为高门槛下车企自研呈现显著分层格局，行业将形成 “头 部全自研、中部半自研、尾部纯外购 ”的稳态结构。特斯拉、比亚迪、理想、小鹏、蔚来 、小米等头部新势力 及自主龙头，拥有充足的销量底盘、高新能源渗透率 ，同时管理层战略坚定，愿意长期承担亏损， 并把智驾作 为核心产品卖点。绝大多数二线自主品牌及合资车企 （丰田、大众、通用、奔驰、日产等） 将选择折中路线， 采取“半自研+外部联合开发”模式，聚焦顶层产品定义与用户交互体验，将底层 BEV模型、端到端算法、域控 方案等核心技术环节对外采购，以 Momenta为代表的中立第三方成为核心合作方 ，可能部分采取“白盒授 权、联合调优”模式，不会从零搭建完整千人算法团队。而年销量不足 20万辆、盈利承压且智能化战略摇摆 的尾部车企，难以通过自研实现体验突破，后续将逐步收缩自研团队，全面转向外购成熟智驾方案。 2）车企全面自研会不会替代第三方供应商？ 市场普遍存在“车企全面自研将替代第三方供应商 ”的认知误区，我们判断车企自研不会消灭第三方赛道， 仅重塑行业结构。真实产业趋势 是：自研是头部自主品牌的选择；合资、二线自主、海外市场是第三方 的基本 盘。当前头部车企自研仅集中于国内一线自主品牌阵营，无法覆盖全行业需求。对于合资车企、二线自主车企 及海外车企而言，华为封 闭生态存在供应链主权顾虑，且自主全栈自研周期过长、难以适配国内智驾快速迭代 节奏，中立、开放、无竞争冲突的第三方方案商成为最优选择。 行业总盘持续扩张，第三方平台市场份额分化但成长空间仍在。智能驾驶产业正处于由渗透率提升向规模 化普及演进阶段，行业整体市场空间持续扩大。从产业链价值分布来看，软件和智能化应用成为增长最快的环 仅供内部参考，请勿外传 2 海外行业深度报告 汽车零部件 请务必阅读正文之后的免责条款和声明。 节。2023—2035年，智慧出行生态和上层应用（包括智能驾驶、智能座舱等功能） 复合增速分别达到28%和 15%，显著高于计算平台硬件约 3%的增速；与此同时，中国智能驾驶解决方案市场规模预计将由 2021年的 433亿元增长至2026年的2671亿元，ADAS SoC市场规模也将由2022年的87亿元增长至2026年的390亿 元。智能驾驶产业正由硬件驱动逐步转向软件、算法及平台驱动，为不同类型平台企业提供了持续增长的市场 空间。 随着头部车企加快全栈自研，第三方平台在国内头部自主品牌中的市场份额预计将受到一定挤压，但市场 需求并不会同步萎缩。一方面，全栈自研需要持续的研发投入、数据积累和组织协同，仅比亚迪、华为、理 想、小鹏等少数头部企业具备长期投入能力；大量传统自主品牌、国际品牌及中小车企仍将依赖第三方平 台实 现智能驾驶快速量产。另一方面，海外 OEM更加倾向于采用开放合作模式，在研发效率、开发周期及成本控 制等方面，对第三方平台仍具有较强需求。此外，高阶智能驾驶正由高端车型逐步向 20万元以下主流市场渗 透，中低价位车型更加关注方案成熟度、开发效率及成本控制，也为开放平台提供了广阔的发展空间。 从客户结构来看，不同类型平台企业形成了差异化市场定位。 Momenta依托开放平台模式覆盖国际品牌和 国内主流OEM，客户广度处于行业领先水平；元戎启行重点布局自主品牌及端到端方案量产；文远知行聚焦 Robotaxi及自动驾驶运营生态；地平线和黑芝麻智能则依托芯片平台优势，与众多整车厂及 Tier1建立合作关 系，推动软硬件平台规模化落地。随着智能驾驶进入平台化竞争阶段，客户数量和合作深度将成为衡量平台商 业化能力的重要指标。 表 1：第三方企业主要合作OEM 企业 主要合作OEM 合作内容 客户特点 Momenta 梅赛德斯-奔驰、通用汽车、上汽集团、丰田、 奇瑞、现代汽车、比亚迪、奥迪、大众、宝马 集团中国、东风日产、本田、福特 股权投资、量产定点、高阶智驾方 案、Robotaxi合作 国内外OEM覆盖最广，国 际化优势突出 元戎启行 长城汽车、吉利、smart、零跑汽车、赛力斯 VLA大模型、端到端智驾方案、城市 NOA、软件Tier1 自主品牌为主，加快端到 端方案量产 文远知行 广汽集团、日产汽车、博世、宇通集团、 Uber Robotaxi、自动驾驶巴士、自动驾驶 技术合作、海外商业化 Robotaxi商业化优势突出 地平线 大众汽车集团、比亚迪、长安汽车、奇瑞汽 车、广汽集团、上汽集团、理想汽车等 征程系列ADAS SoC、Horizon SuperDrive平台、智能驾驶解决方案 芯片平台客户广泛 黑芝麻智能 吉利、东风汽车（eπ007、eπ008）、一汽红 旗、江淮汽车、百度、亿咖通、博世、东风集 团、三一专汽 华山A1000/A2000系列芯片、武当平 台、ADAS解决方案、舱驾融合平台 投资，并快速 组建算法研发团队，为后续产品 研发及商业化奠定基础。随着深度学习技术快速发展，公司逐步形成覆盖感知、定位、规划控制等自动驾驶核 心能力，并开始探索 L2-L4级智能驾驶解决方案。 （2）累计获得31个车型定点、实现8款车型量产（2020-2023年）：随着智能驾驶进入量产阶段， Momenta率先确立\"量产智能驾驶+Robotaxi\"双轮驱动战略，通过量产车型持续获取真实道路数据，再反哺 Robotaxi及算法模型训练，逐步形成 \"One Flywheel\"数据飞轮。公司陆续推出面向乘用车市场的智能驾驶解决 方案，并与上汽、通用、丰田、本田、奔驰等国内外整车厂建立合作关系，量产项目快速增加。截至 2023年 底，公司累计获得31个车型定点、正式量产车型达到 8款，量产业务开始进入规模化落地阶段，验证了平台 化商业模式的可行性。 （3）One Model推动量产提速，License收入成为增长新引擎（ 2024年至今）：2024年以来，随着端到 端大模型快速发展，公司进一步提出 \" One Model\"统一模型战略，以单一基础模型覆盖量产辅助驾驶、 Robotaxi 及未来更多智能驾驶场景，实现算法、数据与产品体系全面统一。公司持续扩大整车厂客 户覆盖范围，全球合 作车企由2024年底的15家提升至2025年底的24家；同期累计车型定点由 106个提升至170个，正式量产车 型由26款增长至68款，量产规模快速放大。随着量产车型持续交付，公司收入结构也发生明显变化。 2023- 2025年，公司技术开发服务收入占营业收入比重由 96.8%下降至59.9%；许可服务收入则由 0.23亿元快速增长 至9.68亿元，占营业收入比重由 3.1%提升至40.1%，成为推动公司收入增长的核心动力。相比一次性技术开 发收入，软件License收入具有可持续、高毛利的特点，随着合作车 型陆续进入量产阶段，公司商业模式正由 项目制开发逐步向持续性软件授权转变，盈利能力有望持续改善。 2025年，公司正式启动港股 IPO，标志着公 司已完成从技术创业企业向全球智能驾驶平台企业的阶段性跨越。 仅供内部参考，请勿外传 8 海外行业深度报告 汽车零部件 请务必阅读正文之后的免责条款和声明。 图 4：Momenta发展历程 数据来源：Momenta招股说明书，中信建投证券 1.2.2 产业资本深度布局，多元股东赋能长期发展 产业资本持续加持，战略资源协同构筑发展优势。 Momenta 股权结构呈现创始团队控股、头部车企产业 资本与多元化财务机构并行布局的特征 。创始团队合计对应股权占比超 14%，为公司核心实际控制方，绑定长 期经营发展利益。产业投资方维度，上汽集团通过 ZJSmart Holdings Limited 持股8.65%，通用汽车通过 General Motors Holdings LLC 持股8.58%，梅赛德斯-奔驰集团直接持股6.13%，三大全球头部车企深度战略入 股，形成整车厂与自动驾驶技术企业深度绑定的合作格局，能够为 Momenta提供整车前装落地场景、整车工 程适配、全球渠道等核 心产业资源。由上层各股东直接持股主体 Momenta HongKong Limited （中国香港）， 该主体100%控股两大核心运营平台 ：初速度出行科技有限公司、魔门塔（苏州）科技有限公司 。多元股东体 系叠加整车产业资本深度赋能，既保障创始团队长期技术研发战略不偏移，又借助车企股东资源加速自动驾驶 方案量产装车，形成资本、技术、产业三方协同的长期成长基础。 图 5：Momenta股权结构 数据来源： Momenta招股说明书，中信建投证券 公司 仅供内部参考，请勿外传 9 海外行业深度报告 汽车零部件 请务必阅读正文之后的免责条款和声明。 1.2.3 核心团队优势突出， AI基因决定技术路线 创始团队汇聚AI顶尖人才与产业资源，核心成员拥有清华、商汤及微软等多元背景 。创始团队具有鲜明 的AI技术基因，董事会主席兼首席执行官曹旭东毕业于清华大学，曾任微软亚洲研究院研究员、商汤科技执 行研发总监，拥有深厚的人工智能研发及产业化经验；联合创始人夏炎毕业于中国科学技术大学自动化专业， 长期负责自动驾驶基础模型、算法及基础设施研发；联合创始人孙刚拥有中科院软件所计算机博士背景，深耕 计算机视觉与自动驾驶算法研发十余年，负责自动驾驶算法研发及量产落地 。同时，公司董事会持续引入 整车 制造、国际车企及资本市场等领域的资深人才 。非执行董事包括长期任职于上汽集团的张坚俊、通用汽车中国 投资副总裁王小鸥，以及拥有奔驰集团二十余年技术管理经验 Fabian Johannes Thomas ，为公司在整车研发、 产业协同及全球合作方面提供 剂细 分领域领军 企业， “金双 歧”“定君生”等核心产品连 续十余年稳居细分品类前 列，双主业 共同实现“材料 硬科技”与“生物 制药”双开 花。公司正处于战略 转型成长 期，高温合金业务产业化正 在加速建设阶段 ，在高温合金产业化 全面达产前，公司主 要 依靠较为稳定的微生态活菌产品业务 支撑公司盈利。 图1：万泽股份具体业务板块 数据来源： 公司官网、公司公告、 东吴证券研究所 1.2. 踩准时代节拍，谋求战略转型 1992年，公司前身“汕头电力发展股份有限公司”成立，开启早期发展； 2005年， 万泽集团通过股权收购成为公司控股股东，开启战略调整新篇章； 2014年，公司布局高 温合金新赛道，切入航空发动机等核心材料市场； 2019年，公司完成重大资产置换，彻 底剥离房地产业务，置入内蒙古双奇药业 100%股权，正式确立“生物医药 +高温合金” 双主业格局； 2024年，高温合金业务新增订单大幅增长，产品已应用于多型号航空发动 机，同时珠海生物医药基地产业化进程加速； 2025年，公司进一步强化“两机”产业链 布局，通过资本运作拓展发展空间，实现了从地方电力企业到专注高科技高温合金材料 与生物医药的民营企业的成功蜕变。 仅供内部参考，请勿外传！ 请务必阅读正文之后的免责声明部分 军工公司深度研究 东吴证券研究所 5/20 图2：万泽股份发展历程 数据来源：公司官网、东吴证券研究所 1.3. 股权结构稳定，子公司业务分工明确 根据万泽股份披露的股权及子公司架构信息，截至 2026年一季报，公司第一大股 东为万泽集团有限公司，持股比例为 20.33%；公司回购专用证券账户持股 5.34%，全国 社保基金 103组合持股 4.02%，25泽EB04担保及信托财产专户持股 3.52%，自然人股东 李敏仙持股 3.08%，其他股东合计持股 63.71%。 公司旗下拥有多家全资及控股子公司，分别承担不同职能及业务种类，业务分工明 确。公司通过“母公司统筹 +子公司专业化运营”模式，布局多家全资 /控股及参股子公 司，核心子公司聚焦“高温合金”与“医药健康”两大主业，业务分工明确， 起到了财 务层面的风险对冲与稳定作用。 2026年一季度子公司运营稳步推进，为母公司业绩增长 提供有力支撑。 图3：万泽股份股权结构及主要子公司（截至 2026Q1） 数据来源： 公司2026年一季报 、东吴证券研究所 1.4. 公司经营业绩持续增长，净利润水平稳健提升 仅供内部参考，请勿外传！ 请务必阅读正文之后的免责声明部分 军工公司深度研究 东吴证券研究所 6/20 万泽股份 2021—2025年营业收入由 6.56亿人民币增长至12.91亿人民币，年均复 合增速约 18.44%， 整体保持较快扩张。 2021—2025年公司营收同比增速分别为 18.77%、 20.97%、23.63%、9.93%、19.62%，其中2023年增速达到阶段高点， 2024年有所回落， 2025年再次恢复到接近 20%的增长水平 。2026年一季度公司实现营业收入 3.60亿人民 币， 同比增长 7.39%， 但短期增速较 2025年全年有所放缓。 归母净利润方面， 公司 2021— 2025年由0.95亿人民币增长至1.97亿元人民币， 年均复合增速约 20.00%；2021—2025 年归母净利润同比增速分别为 24.20%、6.74%、73.57%、9.17%、2.22%。2023年利润释 放较为明显， 2024—2025年利润继续增长但增速趋缓。 2026年一季度归母净利润为 0.77 亿人民币，同比增长 6.58%。 图4：2021-2026Q1万泽股份总营收及同比增长率 图5：2021-2026Q1万泽股份归母净利润及同比增长率 数据来源： Choice、公司公 告、东吴证券研究所 数据来源： Choice、公司公告、东吴证券研究所 医药制造业和合金制造业是万泽股份的两大主要收入来源，其中医药制造业仍是公 司利润贡献的核心板块。 2021—2025年，医药制造业收入由 5.50亿人民币 增长至9.26 亿人民币 ，毛利率长期维持在 89.29%—90.97%的高水平，盈利质量较强，是公司整体毛 利和净利润的重要支撑。 2021—2025年,合金制造业收入则由 0.94亿人民币 增长至3.39 亿人民币 ， 收入规模扩张较快。 合金制造业 板块正在跨过盈亏平衡点， 毛利率波动较大， 2021—2025年分别为 25.73%、38.79%、35.76%、29.21%、21.15%。 0%5%10%15%20%25% 02468101214 营业收入（亿人民币） 同比增长率（ yoy）0%10%20%30%40%50%60%70%80% 0.00.51.01. 取决于高温合金材料的性能水 平。国产大飞机 C919已进入量产周期，其配套的“长江 -1000A”发动机单台需消耗大 量高温合金，带动航空发动机领域高温合金需求年均持续增长。低空经济的快速崛起则 让军用无人机、通航飞行器成为新的需求增长点， 2025年低空装备市场规模突破千亿 人 民币，配套小型涡喷 /涡轴发动机的高温合金需求同步高增。 仅供内部参考，请勿外传！ 请务必阅读正文之后的免责声明部分 军工公司深度研究 东吴证券研究所 10/20 图11：高温合金在航空发动机中的应用 数据来源：钢研高纳招股书、东吴证券研究所 2.3. 核心增量市场爆发，引爆燃气轮机产量需求 数据中心建设带来的刚性供电需求，为燃气轮机创造了全新的规模化增量市场，从 根本上拉动了全球燃气轮机总需求与总产量的跃升。 图12：燃气轮机示意图 数据来源： 智研咨询、 东吴证券研究所 单项目装机需求指数级增长： AI数据中心已进入 GW级功率时代，据 Bloom Energy 调研数据，到 2035年全球近三分之一的数据中心站点规模将超过 1GW，其中>2GW的站 点占比将从 2025年11月年的2%升至12%，1-2GW站点占比从 8%至20%。单站点功率的 跨越式提升，直接带来单个项目燃气轮机装机需求的大幅增长，为产量提升提供了基础 需求支撑。 仅供内部参考，请勿外传！ 请务必阅读正文之后的免责声明部分 军工公司深度研究 东吴证券研究所 11/20 图13：数据中心规 模分布预测与趋势展 望 数据来源： Bloom Energy Data Center Survey、东吴证券研究所 2.4. 技术+资质+量产三重壁垒，领跑国内高端航空叶片赛道 航空发动机涡轮叶片（尤其是单晶涡轮叶片）是航空发动机、燃气轮机的核心热端 部件，被誉为“工业皇冠上的明珠” ，是我国高端装备制造领域最核心的“卡脖子”环节 之一。 涡轮叶片的性能上限，本质是材料 -工艺-检测-装备全链条的协同能力，单一环节 的短板就会导致产品失效，这也是该领域长期被海外巨头垄断的核心原因。 表1：高温合金叶片赛道国内国际竞争格局 公司名称 主要产品 市场地位 技术实力 万泽股份 航空发动机、燃气轮机用全谱 系高温合金涡轮叶片，全面覆 盖等轴晶、 定向晶、 单晶三大类 产品，同步配套自研的超高纯 度镍基高温母合金、高温合金 粉末、粉末涡轮盘等热端核心 部件 国内极少数具备从高温合金 材料研发到叶片精密制造全 链条闭环能力的民营企业， 是国产航空发动机、燃气轮 机自主可控进程中的核心配 套企业 已建立完整的自主知识产 权体系，掌握超高纯度高温 合金熔炼、涡轮叶片无余量 精密铸造等核心技术，可实 现叶片型面微米级精度控 制，单晶叶片良品率接近国 际龙头水平 应流股份 覆盖航空发动机、重型燃气轮 机用等轴晶、 定向晶、 单晶全系 列高温合金涡轮叶片，同步配 套航空发动机机匣、燃烧室等 核心热端部件，产品适配 F级、 H级高端重型燃机 国内两机，高温合金叶片民 营龙头，全球高端燃机叶片 核心第三方供应商，深度绑 定西门子能源、 GE、 安萨尔多 等全球前五燃机厂商，同时 进入其供应链体系 掌握高温合金定向凝固、 LMC单晶叶片研发制造等核 心工艺， 产品可耐受 1600℃ 极端高温，技术水平对标全 球龙头Howmet、Doncasters 航宇科技 燃气轮机用高温合金锻造叶片 为核心，业务覆盖从环锻件延 伸至锻造叶片、后端精密加工 及一体化转子组件装配，其核 心基础产品为航空发动机用高全球一流的高端装备精密锻 造解决方案供应商， 同时获得 GE航空、普惠、赛峰、罗罗 等全球六大商用航空发动机 公司全资质认证的环锻件企掌握高温合金等温锻造、精 密轧制等核心工艺，创新研 发的NISP技术大幅提升材 料利用率，荣获 GE航空全 球创新奖项，具备锻造叶片 仅供内部参考，请勿外传！ 请务必阅读正文之后的免责声明部分 军工公司深度研究 东吴证券研究所 12/20 温合金、 钛合金环形锻件， 是叶 片配套机匣、涡轮盘等核心部 件的关键基础件 业，同时是国内燃机锻造叶 片领域的新兴核心供应商 全流程精密加工能力 通 用 电 气 （GEVernova ） 覆盖全谱系军民用航空发动 机、 重型燃气轮机用定向晶、 单 晶高温合金涡轮叶片，同时是 全球率先实现陶瓷基复合材料 （CMC）叶片商业化量产的企 业，既是全球最大的高温合金 叶片自研自产企业，也是全球 高端叶片市场最大的采购方之 一 全球航空发动机、高温合金 叶片赛道的龙头与技术标准 制定者，旗下 GE航空航天以 40%的全球市场份额稳居商 用航空发动机行业第一，其 自研自产的高温合金叶片核 心供应自有航发、燃机机型， 同时主导全球高端叶片供应 链体系 掌握全球顶尖的单晶叶片  ，价值量高 。 与之配套的粉末冶金盘件，作为镍基粉末高温合金制成的关键承力部件，能够承载 航空发动机高转速、高负荷工况下的 大应力。此外，公司生产的 GH4033、GH4049等牌 号高温母合金及高温合金粉末，作为下游精密铸造的基础原料，既保障了公司自有核心 部件生产的成分纯度与性能一致性， 也通过对外销售补充了收入来源， 形成了“原料 -部 件”的全流程供应能力。 图9：万泽高温合金核心产品 样图 数据来源：公司官网、东吴证券研究所 仅供内部参考，请勿外传！ 请务必阅读正文之后的免责声明部分 军工公司深度研究 东吴证券研究所 9/20 2.2. 军民市场用途广泛， 高温合金发展迅速 高温合金是支撑“大国重器”在极端工况下可靠运行的核心基础材料，广泛应用于 飞机发动机、火箭发动机等航空航天装备的热端部件，保障其在超高温、高速旋转环境 下的性能稳定；同时在舰船发动机、地面燃气轮机、汽轮机及核电站等能源动力领域， 以及汽车增压涡轮器、石油化工冶金等工业场景中，凭借优异的耐高温、抗腐蚀与抗蠕 变性能， 成为关键部件的首选材料， 是现代高端装备实现高效、 长寿命运行的关键保障。 图10：高温合金用途 数据来源：钢研高纳招股书、东吴证券研究所 从市场前景来看，高温合金作为“大国重器”的基础材料，其需求增长受到政策支 持、高端装备放量与能源转型三重核心因素的共同驱动。政策层面， “两机专项” （航空 发动机和燃气轮机重大专项）的持续落地为行业发展提供了坚实保障，直接拉动高端高 温合金的刚性需求。高端装备放量方面，在先进的航空发动机中，高温合金用量占发动 机总重量的 40%－60%。发动机的性能水平在很大程度上取决于高温合金材料的性能水 平。国产大飞机 C919已进入量产周期，其配套的“长江 -1000A”发动机单台需消耗大 量高温合金，带动航空发动机领域高温合金需求年均持续增长。低空经济的快速崛起则 让军用无人机、通航飞行器成为新的需求增长点， 2025年低空装备市场规模突破千亿 人 民币，配套小型涡喷 /涡轴发动机的高温合金需求同步高增。 仅供内部参考，请勿外传！ 请务必阅读正文之后的免责声明部分 军工公司深度研究 东吴证券研究所 10/20 图11：高温合金在航空发动机中的应用 数据来源：钢研高纳招股书、东吴证券研究所 2.3. 核心增量市场爆发，引爆燃气轮机产量需求 数据中心建设带来的刚性供电需求，为燃气轮机创造了全新的规模化增量市场，从 根本上拉动了全球燃气轮机总需求与总产量的跃升。 图12：燃气轮机示意图 数据来源： 智研咨询、 东吴证券研究所 单项目装机需求指数级增长： AI数据中心已进入 GW级功率时代，据 Bloom Energy 调研数据，到 2035年全球近三分之一的数据中心站点规模将超过 1GW，其中>2GW的站 点占比将从 2025年11月年的2%升至12%，1-2GW站点占比从 8%至20%。单站点功率的 跨越式提升，直接带来单个项目燃气轮机装机需求的大幅增长，为产量提升提供了基础 需求支撑。 仅供内部参考，请勿外传！ 请务必阅读正文之后的免责声明部分 军工公司深度研究 东吴证券研究所 11/20 图13：数据中心规 模分布预测与趋势展 望 数据来源： Bloom Energy Data Center Survey、东吴证券研究所 2.4. 技术+资质+量产三重壁垒，领跑国内高端航空叶片赛道 航空发动机涡轮叶片（尤其是单晶涡轮叶片）是航空发动机、燃气轮机的核心热端 部件，被誉为“工业皇冠上的明珠” ，是我国高端装备制造领域最核心的“卡脖子”环节 之一。 涡轮叶片的性能上限，本质是材料 -工艺-检测-装备全链条的协同能力，单一环节 的短板就会导致产品失效，这也是该领域长期被海外巨头垄断的核心原因。 表1：高温合金叶片赛道国内国际竞争格局 公司名称 主要产品 市场地位 技术实力 万泽股份 航空发动机、燃气轮机用全谱 系高温合金涡轮叶片，全面覆 盖等轴晶、 定向晶、 单晶三大类 产品，同步配套自研的超高纯 度镍基高温母合金、高温合金 粉末、粉末涡轮盘等热端核心 部件 国内极少数具备从高温合金 材料研发到叶片精密制造全 链条闭环能力的民营企业， 是国产航空发动机、燃气轮 机自主可控进程中的核心配 套企业 已建立完整的自主知识产 权体系，掌握超高纯度高温 合金熔炼、涡轮叶片无余量 精密铸造等核心技术，可实 现叶片型面微米级精度控 制，单晶叶片良品率接近国 际龙头水平 应流股份 覆盖航空发动机、重型燃气轮 机用等轴晶、 定向晶、 单晶全系 列高温合金涡轮叶片，同步配 套航空发动机机匣、燃烧室等 核心热端部件，产品适配 F级、 H级高端重型燃机 国内两机，高温合金叶片民 营龙头，全球高端燃机叶片 核心第三方供应商，深度绑 定 <script>
const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=(v)=>Array.isArray(v)?'<ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
