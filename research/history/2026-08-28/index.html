, "post:2026-08-28T13-04:7f862fef4c82": {"id": "post:2026-08-28T13-04:7f862fef4c82", "kind": "post", "title": "2026-08-28 13:04", "source_label": "帖子正文", "excerpt": "【科翔股份】陶瓷混压PCB先行者，期待AI服务器领域北美客户获得重要突破【科翔股份】重要子公司——广州陶积电专注于AlN（氮化铝）等先进陶瓷基板。", "content": "", "publish_time": "2026-08-28 13:04", "tags": ["文字观点"]}, "post:2026-08-28T21-42:7d2d3d431f88": {"id": "post:2026-08-28T21-42:7d2d3d431f88", "kind": "post", "title": "2026-08-28 21:42", "source_label": "帖子正文", "excerpt": "宏景科技2026年半年报点评：资产跃升显著，利润显著高增，子公司并表预计加速#整体业绩：2026H1，公司实现营业收入18.43亿元，同比+156%", "content": "", "publish_time": "2026-08-28 21:42", "tags": ["整体业绩", "现金流", "资产侧", "负债侧", "文字观点"]}}, "source_details": {"post:2026-08-28T08-19:09fe67cace38": {"id": "post:2026-08-28T08-19:09fe67cace38", "kind": "post", "title": "2026-08-28 08:19", "source_label": "帖子正文", "excerpt": "📌Meta 将矛头对准 Anthropic，但它也是其最大客户之一💬Meta 首席执行官马克・扎克伯格最近将矛头对准了竞争对手 Anthropic。📝扎克伯格没有点名这家人工智能初创公司或其首席执行官达里奥・阿莫代，但他表示，领先的 AI 实验室试图巩固权力，同时将未来描绘成 “充满末日”。", "content": "📌Meta 将矛头对准 Anthropic，但它也是其最大客户之一💬Meta 首席执行官马克・扎克伯格最近将矛头对准了竞争对手 Anthropic。 📝扎克伯格没有点名这家人工智能初创公司或其首席执行官达里奥・阿莫代，但他表示，领先的 AI 实验室试图巩固权力，同时将未来描绘成 “充满末日”。 📄“如果由这些实验室主导，” 他在本月发表的一篇 6500 字的文章中写道，“那么力量平衡将偏向大型机构而非个人。” ⚠️但就在扎克伯格公开批评 Anthropic 的同时，他自己的公司却在私下里帮助这个竞争对手崛起。 🔍据五位了解这些公司内情的人士透露，在幕后，拥有 Facebook 和 Instagram 的 Meta 已经成为 Anthropic 人工智能产品的重度用户，以至于它已成为 Anthropic 最大的客户之一。 💰其中两位拒绝透露身份的知情人士表示，今年一度，Meta 内部预计其每年在 Anthropic 的 AI 模型上的花费可能高达 100 亿美元。这将构成 Anthropic 年收入的很大一部分，该初创公司在 7 月份估计其年收入将超过 650 亿美元。 🔄Meta 和 Anthropic 长期以来一直是竞争对手，但它们在财务上相互交织的程度此前并未被报道过。它们的情况为了解硅谷 AI 竞赛中弥漫的亦敌亦友关系提供了一个窗口：科技巨头可以在公开场合贬低竞争对手，同时在幕后给他们数十亿美元，甚至一边还声称他们可能对人类构成生存威胁。 🤝在 AI 初创公司的 “友敌” 中，谷歌和亚马逊承诺向 Anthropic 投资 730 亿美元，尽管它们也在开发自己的 AI 模型。微软是 OpenAI 最早的投资者之一，但两家公司现在都强调彼此的独立性。芯片制造商英伟达与 Meta 和谷歌建立了数十亿美元的合作伙伴关系，尽管这些公司也在研发自己的芯片。 🔗Meta 与 Anthropic 的关系显得尤为错综复杂。 🧪四位知情人士表示，Meta 非常依赖 Anthropic 的 AI 模型，以至于使用它们来驱动和测试一款即将推出、名为 Hatch 的 AI 产品。扎克伯格将 Hatch 描述为 Meta 的下一个突破，一个 “全天候代表你工作，帮助你实现目标并改善你的生活、健康、人际关系和财务状况” 的个人 “智能体（agent）”。 💸两位知情人士表示，Meta 今年夏天削减了在 Anthropic 上的一些支出，但每月仍在这家初创公司的工具上花费数亿美元。 📈两位知情人士称，Meta 的领导层意识到，随着这家初创公司正朝着可能使其估值达到 2 万亿美元的轰动性首次公开募股（IPO）迈进，他们的支出可能会影响 Anthropic。知情人士表示，Meta 的 AI 产品主管纳特・弗里德曼（Nat Friedman）曾告诉一些员工，如果 Meta 只使用自己的编码工具或 OpenAI 的工具，可能会在 Anthropic 上市前降低其收入。 🗣️风险投资公司 Theory Ventures 的投资者托马斯・通古兹（Tomasz Tunguz）说：“这就像看着决斗的将军在战场上竞争。每个人都在试图破坏那场 IPO 的稳定性。” 🚫Meta 和 Anthropic 拒绝置评。《纽约时报》已起诉 OpenAI 和微软，指控其 AI 系统侵犯了新闻内容的版权。这两家公司否认了诉讼中的指控。 👥去年夏天的大部分时间里，Meta 试图通过提供九位数的薪酬方案从竞争对手那里挖走 AI 研究人员。三位知情人士表示，虽然它从 OpenAI 和谷歌聘请了一些知名的 AI 研究人员，但在从 Anthropic 招募人才方面却基本失败了。 ⚡今年年初，当 Meta 的工程师开始大量使用 Anthropic 广受欢迎的 AI 编码工具 Claude Code 时，Meta 在 Anthropic 上的支出激增。到 4 月份，Meta 员工在内部排行榜上竞争，看谁能使用最多的 Anthropic“代币（tokens）”，代币是 AI 使用的单位，大致相当于一个单词片段。这种做法被称为 “tokenmaxxing（代币最大化）”。 🔮大约在这个时候，Meta 高管讨论了在 Anthropic 上花费 100 亿美元的预测。但随着代币成本飙升，Meta 取消了代币排行榜。今年 6 月，该公司告诉员工，今年在 AI 使用上的支出有望达到数十亿美元，并将创建一个更好的系统来管理这些支出。 🤝据《纽约时报》此前报道，同月，Anthropic 也与 Meta 接洽，提出在两年内从其数据中心购买高达 100 亿美元的计算能力。目前尚未宣布达成任何交易。 🛠️此后，Meta 发布了其 AI 编码工具 Muse Code 的更新，其员工越来越多地使用该工具来代替 Anthropic 的工具。一位知情人士表示，虽然 Meta 使用 Anthropic 的 AI 测试了 Hatch，但最终公开发布的产品将由 Meta 最新的 AI 模型驱动。 🚀扎克伯格的公司还在开发一种新的 AI 模型，旨在与 Anthropic 的尖端模型一样强大。目前尚不清楚这个内部代号为 Watermelon（西瓜）的模型是否能赶上 Anthropic。 ⌛四位知情人士称，今年 7 月，在开发 Watermelon 时，Meta 暂停并随后恢复了被称为 “预训练” 的 AI 开发阶段，这使其发布时间至少推迟到了 10 月份。Meta 尚未宣布何时推出 Hatch 或 Watermelon。#文字观点", "publish_time": "2026-08-28 08:19", "tags": ["文字观点"]}, "post:2026-08-28T17-35:69272ff42b94": {"id": "post:2026-08-28T17-35:69272ff42b94", "kind": "post", "title": "2026-08-28 17:35", "source_label": "帖子正文", "excerpt": "20260828今日段子汇总 1、鼎捷数智：公司是国内工业ERP、MES龙头，完成文生图纸、文档解析、语音TTS模型、大模型多级推理性能并发等底层AI算法优化 2、麒麟信安：公司以操作系统为根技术，形成了 “操作系统-云计算-信息安全” 产品体系 3、德科立：光传输全产业链企业；公司400G相干模块", "content": "20260828今日段子汇总 1、鼎捷数智：公司是国内工业ERP、MES龙头，完成文生图纸、文档解析、语音TTS模型、大模型多级推理性能并发等底层AI算法优化 2、麒麟信安：公司以操作系统为根技术，形成了 “操作系统-云计算-信息安全” 产品体系 3、德科立：光传输全产业链企业；公司400G相干模块已实现小批量试产，硅基OCS获海外样品订单 4、深圳华强：公司是华为海思全系列产品代理商，签约昇腾gpu总代理，后面昇腾直接对分销商销售（昇腾出笼)；公司是村田主要代理商，授权分销MLCC等元器件，并向光模块客户供应村田MLCC等产品 5、金牛化工：1、公司主营业务为控股子公司金牛旭阳的甲醇生产和销售，产能为20万吨/年，采用 习、上下文记忆短板，大幅拓宽企业端AI商业化落地场景；叠加开源大模型快速普及，2026年开源模型 权重占比将攀升至30%，全网算力消耗持续高速增长，持续拉动高端光通信需求扩容。 行业规模持续超预期：2026年全球CPO市场规模预计达38亿美元，同比增长45%。1.6T高端光模块需求 持续上修，从年初预估1000万只大幅上调至3000万只，2027年需求有望再度翻倍。头部厂商产能与良率持 续爬坡，中际旭创、新易盛等企业1.6T产品良率已提升至85%-90%，2026年合计产能超1800万只。同时台积 电CPO中试线提前2-3个月投产，进一步加速产业商业化进程。 以光带存结构红利凸显：新一代Rubin算力机柜呈现“光模块价值占比提升、传统存储占比下降”的结 构性特征，光通信产业链价值权重持续抬升。 表2AI硬件产业链重点公司 细分赛道标的公司 核心投资逻辑 超核心平台 供应商工业富联（601138） Rubin机柜全球核心集成商，2026年三季度正式量产，新一代产品全球份额 60%-70%，单机柜价值量与盈利弹性大幅提升，深度受益整机柜量价齐升趋势。 胜宏科技（300476） Rubin机柜44层中板标准品独家供应商，高端算力PCB核心标的，充分受益AI 算力PCB价值量暴涨、行业长期供不应求格局。 海外算力链 核心中际旭创、新易盛 全球光模块双龙头，1.6T高端产品良率、产能行业领跑，2026年三季度起持续 规模化放量，深度受益AI算力高速带宽升级浪潮。 沪电股份、深南电路 高端算力PCB核心供应商，具备高阶多层板成熟量产能力，工艺壁垒适配Rubin 平台迭代需求，充分承接新一代算力机柜PCB增量订单。 生益科技 高端CCL核心材料供应商，直接受益AI服务器PCB、CCL量价齐升行情，伴 随硬件迭代持续兑现业绩。 下载日志已记录，仅供内部参考", "status": "extracted"}, "attachment:files/中邮证券-医药行业AI4S(二)：制药临界点突破前夜，新范式逐渐成型，分子验证需求正崛起-260827.pdf": {"id": "attachment:files/中邮证券-医药行业AI4S(二)：制药临界点突破前夜，新范式逐渐成型，分子验证需求正崛起-260827.pdf", "kind": "attachment", "title": "中邮证券-医药行业AI4S(二)：制药临界点突破前夜，新范式逐渐成型，分子验证需求正崛起-260827", "source_label": "中邮证券", "excerpt": "11中邮证券AI4S（二）：制药临界点突破前夜：新范 式逐渐成型，分子验证需求正崛起", "content": "11中邮证券AI4S（二）：制药临界点突破前夜：新范 式逐渐成型，分子验证需求正崛起 证券研究报告 行业投资评级：强大于市|维持 盛丽华/徐智敏 中邮证券研究所 医药团队 发布时间：2026-08-27 仅供内部参考，请勿外传 2 投资要点 AI制药正逐步成为AI巨头公司的战略主航道。 2026年以来，谷歌/Anthropic等巨头将AI制药视作公司未来的重要增长引擎；英伟达、字节 等将AI制药作为平台级的业务，Meta/Amazon等亦将药物发现模型当做重要的生态布局，服务云业务等增长。对比Coding已进入自主工程 师团队的高渗透率阶段，当下的AI4S在药物研发中仍处于突破临界点的前期，有望成为下一代战略主航道。 试验反馈路径逐步清晰，叠加AI提效降本优势，行业正催生更强烈的分子验证需求。 药物研发的本质基于实验科学：即通过实验数据反馈， 提升理解迭代分子设计规则。因此对比于Coding等通过计算形成自我迭代的路径，药物研发迭代的限速步骤在于湿试验（通过投入实体化合 物产生真实的试验数据）。当下，我们认为行业存在的重要的边际变化在于：1）AI语言模型技术迁移到制药领域，并逐渐形成了迭代的 AIDD新范式；2）数据是迭代的关键要素，行业“孤岛”特征下稀缺性愈发凸显，数据基建工作不可或缺已是共识。同时，对比传统流程 AI 在临床前研发的提效降本优势突出，杰文斯悖论在AI制药行业或又一次复现，行业有望催生更强烈的分子验证需求。 市场空间： 受益于AI赋能的药物发现全部总潜在市场预计在180亿美金左右（包含算法等模型的投入和用于湿试验的开销），其中从Twist等 具备基因-蛋白合成到体外检测的业务来看预计在70亿美金市场，AI催生的需求业务预计在2030年提供10亿美金的增量空间，对应抗体发现 服务增量5亿美金，+25%；蛋白表达市场增量5亿美金，+45%。基线参考：DNA合成20亿美金，抗体发现服务20亿美金，蛋白飙到11亿 美金，合计51亿美金。 投资建议： 建议关注：1）AIDD平台：英矽智能、晶泰控股、剂泰科技；2）蛋白合成表达及检测：金斯瑞、Twist、义翘神州、百普赛斯、 近岸蛋白；3）动物模型验证：百奥赛图、药康生物、南模生物。4）试剂：阿拉丁、皓元医药、毕得医药、诺唯赞；5）蛋白表达及纯化： 奥浦迈、纳微科技、赛分科技、汉邦科技。 风险提示： AI制药模型研发进度不及预期风险；投入制药领域的资本开支不及预期风险；市场竞争加剧风险；地缘政治风险；政策变动风险。 请参阅附注免责声明 仅供内部参考，请勿外传 3 技术迭代与提效降本共振，催生庞大行业需求 二 风险提示 四目录一 AI制药正逐步成为AI巨头公司的战略主航道 市场空间与产业受益标的梳理 三 仅供内部参考，请勿外传 44 AI制药正逐步成为 AI巨头公司的战略主航道 仅供内部参考，请勿外传 5 AI制药正逐步成为AI巨头公司的战略主航道 投入构成说明 可验证投入规模 公司 2025 年 6 亿美元 B 轮、2026 年 21 亿美元新一轮融资；与礼来、诺华的合作 含里程碑付款；研发打包在 DeepMind 整体预算中 Isomorphic Labs 累计融资超 27 亿美元；药企合作潜在总额近 30 亿美元 谷歌 / Alphabet 含算力基础设施、联合研发、自动化实验室；BioNeMo 平台研发年投入数亿美 元级 与礼来 5 年合计最高 10 亿美元共建实验室 英伟达 并购 + 团队扩张 + 模型训练；生命科学团队超百人 4 亿美元收购 Coefficient Bio；年研发投入 3-5 亿美元级 Anthropic 含算力、团队、管线研发；规划 60 亿元建设 AI 原生医院 AI 整体年资本开支超 2000 亿元人民币，AI 制药为重点方向 字节跳动 含通用模型生物能力训练；以企业合作 API 收入为主 GPT-Rosalind 相关研发投入超 10 亿美元量级 OpenAI 以云服务收入为主，不承担药物研发风险 6000 万美元投入美国能源部 Genesis AI4S 项目；药企合作单家数千万至数亿美元 微软 以财务投资为主，自研投入规模较小 AI 制药领域累计投资超 50 亿元人民币 腾讯 IPO 拟募资数亿美元；合作含里程碑付款 累计投入数十亿元；与赛诺菲合作潜在超 10 亿美元 百度（百图生科）从战略布局来看，生命科学/药物发现是AI+巨头公司不可或缺的一部分。尽管不同科技公司对于其定位和投入仍有所侧重，但不可否认的是科技 公司的资本开支有望蔓延至生命科学，为行业带来可观的增量资金。 从定位上来看，谷歌和Anthropic 将生命科学视为 AGI 终极落地场景，从模型延伸至临床阶段。字节跳动旗下Anew Labs成立于2021年，一直承 担从基础模型研究到产业化的核心职能，拥有IL-17小分子项目等早期管线，此外公司内部仍存在独立的AI4S团队分支。英伟达做全栈基础设施或 全链路自研，作为突破现有业务天花板的核心新增长极。微软等巨头选择推出专用模型 / 云解决方案，服务 B 端企业客户。 客观来看，当前巨头的投入大多仍处于早期布局阶段，尚未形成规模化营收，更多是战略卡位与技术验证。 图表1：国内外科技巨头公司在制药领域布局 资料来源：36氪、微软、英伟达公司等官网新闻公告，中邮证券研究所 仅供内部参考，请勿外传 6 2026上半年全球AI制药融资TOP10 据动脉网整理数据，2026H1合计公开募资金额达31.83亿美元。Isomorphic Labs以21亿美元B轮融资断层登顶，TOP2企业合计拿走全榜90.7% 的资金。头部平台的资金壁垒快速筑高，早期纯技术型项目的融资窗口正在持续收窄。 更核心的变化发生在估值底层逻辑。明确拥有自研候选药物、具备干湿实验闭环能力的5家企业，拿下了榜单95.6%的融资额；纯算法工具、纯软 件服务型平台的融资量级普遍停留在千万美元级。资本已从“为模型能力定价”，全面转向 “为药物资产与落地进度定价”。 从投资方结构看，专业VC仍是行业底盘，科技巨头与大药企产业资本正精准加注头部项目。AI 制药正逐步走出纯概念验证期，头部阵营已率先进 入管线价值兑现的关键窗口。 图表2：2026H1全球AI药物发现融资TOP10情况 资料来源：动脉网，中邮证券研究所 仅供内部参考，请勿外传 7 AI4S在药物研发中仍处于突破临界点的前期 技术角度来看，AI编程能力已完成从“辅助工具”到“生产主力” 的范式跃迁。2025年尚停留在代码自动补全的基础辅助阶段；仅1 年左右时间，便快速跨越自主初级、高级工程师层级，当前已达到 自主工程师团队级别，可端到端完成需求拆解、代码开发、调试优 化的全流程。科研端来看，当前AI仅能承担研究助理级基础工作， 如自动化文献调研、多组学数据清洗、基础分子虚拟筛选等。伴随 着自动化试验、DBTL的闭环成熟，我们有望看到快速向高级研究 员、自主研发工程师级别跃迁。 AI4S正成为软件开发之后最具价值的AI应用场景。 全球约70%的 生物医药领先企业已将AI4S与药物发现列为公司级战略重点。受湿 实验成本高、高质量数据稀缺、容错与合规门槛严格等物理世界属 性约束，生命科学AI的迭代速度慢于纯数字领域的软件开发，但凭 借大幅压缩研发周期的核心价值，其长期产业空间与战略权重正持 续抬升。图表3：AI4S在药物研发中仍处于突破临界点的前期 资料来源：金斯瑞演示材料，中邮证券研究所 仅供内部参考，请勿外传 8 谷歌：DeepMind （AI工作台）和 Isomorphic （AIDD ）双线并行 Google（Alphabet）采取“基础科研工具+独立AI制药公司”双线布局。DeepMind一方面持续迭代AlphaFold系列蛋白预测模型向学术界开放， 同时推出GeminiforScience科研AI工作台；旗下独立子公司Isomorphic Labs依托IsoDDE药物设计引擎，聚焦肿瘤、免疫及难成药靶点，自研AI 设计药物并推进至人体临床试验，同时与诺华、礼来、强生开展产业合作。Isomorphic Labs在2026年5月B轮融资21亿美元，是AI制药史上最大 单笔私募融资。 图表4：谷歌：DeepMind（AI工作台）和Isomorphic（AIDD）双线并行 资料来源：Alphabet演示材料，中邮证券研究所 仅供内部参考，请勿外传 9 Anthropic：收购AI+Biotech，赋能生物学专项AI模型 2026年4月Anthropic以4亿美元全股票交易收购尚处于隐身运营阶段的AI生物科技初创企业Coefficient Bio。Coefficient Bio2025 年才成立，团 队规模很小，创始成员均具备产业资深背景：CTO 曾是Biogen首席科学家，CEO拥有Evozyne、Paragon Biosciences 从业经历，另一位联合创 始人来自 Roivant Sciences，公司方向是用 AI 提升药物发现与生物科研效率。2026年6月：Anthropic 正式推出Claude Science（贝塔版）： 面向科研人员、尤其面向药物研发领域的 AI 科研工作台，类比软件工程领域的 Claude Code。据公司首席执行官Dario Amodei介绍，这款产品 旨在优化大语言模型在科学实验室和制药研发流程中的应用，其目标将是利用人工智能全面揭示生物学的复杂内在。 Anthropic为布局生物医药研发而落地的三大核心举措： 生物学专项模型训练：Anthropic使用结构生物学、临床监管申报文件等各类生命科学数据来训练Claude大模型。公司的生命科学业务负责 人埃里克·考德雷尔-艾布拉姆斯(Eric Kauderer-Abrams)表示，他们在2026年2月发布的Claude Opus 4.6，是首款经过大规模生物数据专 项训练的Claude模型；5月底推出的Opus 4.8则在代码、科学推理等方面又有明显进步；后续迭代版本还会持续加码生物方向的训练。 湿实验室 ：Anthropic开设了实体的湿实验室，用以自主开展基础研究，生成真实的实验数据，用以反馈模型、优化训练效果。 收购：Anthropic收购了成立仅8个月的初创企业Coefficient Bio，从而引入在靶点筛选、药物模态选择、产品组合规划等方面的专业能力。 仅供内部参考，请勿外传 10 英伟达：BioNeMo实现实验室闭环 2026年初NVIDIA 对 NVIDIA BioNeMo 进行重大扩展，将通过一个开放式开发平台支持实现实验室闭环 (lab-in-the-loop) 工作流， 以推动 AI 驱动的生物学与药物研发领域取得突破性进展。生命科学行业产生海量的科学数据。BioNeMo 提供的开发平台，可用于生成 和处理数据以及训练、优化及部署模型——这将使整个行业将数据转化为推动发现的有力引擎，在最大限度提高成功概率的同时，将研 发成本降至最低 图表5：英伟达：BioNeMo实现实验室闭环 资料来源：英伟达官网，中邮证券研究所 仅供内部参考，请勿外传 1111 技术迭代与提效降本共振，催生庞大行业需求 2.1 AI模型迭代路径逐步清晰，湿试验反馈不可或缺 2.2 AI模型降本增效显著，将催生更强烈分子验证需求 仅供内部参考，请勿外传 12 2.1 AI模型迭代路径逐步清晰，湿试验反馈不可或缺 正如同AI在对话、推理等领域的发展一般，chatGPT/DeepSeek等大语言模型的出现本质并非“横空出世”，而是多年的深耕和快速的 自我迭代下的自然产物。AI制药模型必然需经历数版的迭代，我们认为当下的AI制药模型正在走出逐步清晰的迭代路径：有别于以往的 监督框架，通过引入语言模型对齐方法（DPO，Direct Preference Optimization），AI蛋白设计开始展现了“泛化式”的学习能力。 在这一模式下，湿试验数据的反馈地位提升，从以往的“核验”作用转变为提升模型对于“什么是好的”理解的重要反馈。 同时，行业亦开始涌现突破成果：Anthropic的Claude Science已展现蛋白质从头设计能力，水准超越传统平均水平同时极大压缩了研 发周期。 核心观点 ：我们认为药物研发基于实验科学的本质从未改变，AI设计分子仍旧需要依赖真实湿试验的数据验证与反哺迭代，干湿结合是 行业的有力共识，而AI制药模型快速迭代会催生庞大行业需求，为早研服务和上游行业提供强劲增量。 请参阅附注免责声明 仅供内部参考，请勿外传", "status": "extracted"}, "post:2026-08-28T08-19:5f3f3b6e1751": {"id": "post:2026-08-28T08-19:5f3f3b6e1751", "kind": "post", "title": "2026-08-28 08:19", "source_label": "帖子正文", "excerpt": "📌大摩 —— 中国存储 —— 重塑全球竞争格局📜历史视角：存储领导权的更迭📚存储行业的领导权历来随 “规模 + 竞争基础改变” 而转移：1970‑80 年代早期美国凭借技术创新领先；1980 年代日本以高质量、高良率制造超越美国", "content": "📌大摩 —— 中国存储 —— 重塑全球竞争格局📜历史视角：存储领导权的更迭📚存储行业的领导权历来随 “规模 + 竞争基础改变” 而转移：1970‑80 年代早期美国凭借技术创新领先；1980 年代日本以高质量、高良率制造超越美国；1990 年代至今韩国通过逆周期激进投资、成本领先与快速制程迁移确立统治地位。 🔄中国正走一条不同路径：CXMT 和 YMTC 先在国内大市场与政策支持下建立主流存储规模，而原有头部公司将资本日益导向 HBM、先进服务器 DRAM 和公司级存储。 💡中国无需在技术上全面赶超即可改变行业经济 —— 一旦中国产能足够大，国内生产可替代进口，将原有头部公司供应挤向其他市场，并影响主流存储的边际价格。 🏭长鑫存储（CXMT）：从技术追随者到规模供应商📊产能与份额：2025 年月产能约 18 万片晶圆，2026 年预计达 30 万片（占全球 DRAM 晶圆产能 13%，比特出货量占 11%）。 📈2028 年预计升至 50 万片 / 月，2031 年达 80 万片 / 月（占全球比特出货量约 15%）。 🔮到 2028 年，CXMT 可能超越美光成为全球第三大 DRAM 公司。 🔧技术进展：2026 年二季度完成向 100% 第四代 B（Gen 4B，约 16nm 级）制程过渡，良率超 90%。 📐其 16Gb DDR5 的裸片密度与领先公司部分旧产品相当，支持 5600MHz，路线图指向 6400MHz。 ⚠️但依赖浸没式 DUV 和多重曝光，掩模与工序更多、周期更长，单位比特成本结构处于劣势。 📉即便可见规格可比，原有头部公司在良率、每片晶圆比特数、优质品产出和认证广度上仍具优势。 💰定价影响力：在商品存储市场，只要增量产出足够大即可影响边际价格。 📌CXMT 接近全球产能 15% 时，无需在欧美广泛采用，仅凭国内产出替代进口即可迫使原有头部公司将生产转向其他市场。 🤖AI 悖论：HBM 为 CXMT 创造空间💸HBM 提高了传统 DRAM 的机会成本。 📊HBM 使用更大裸片，需堆叠、TSV、先进封装与大量测试，其比特产出惩罚（同等晶圆产出的比特数减少）从 2021‑23 年的约 2.5 倍升至 2028 年预计的约 3 倍。 📈HBM 占先进 DRAM 晶圆消耗的比重从 2023 年约 6% 升至 2028 年预计 34%。 ✨这吸引原有头部公司资本与先进产能投向高端 AI 存储，为 CXMT 在主流 DDR5 和 LPDDR5X 留出更大空间。 ⏳同时，AI 需求吸收新增供应，应将中国带来的广泛定价影响推迟到 2028 年。 🇨🇳中国本土 HBM 需求日益迫切。 ⚠️HBM3E 可能是 2027 年中国 AI GPU 的主要瓶颈。 📦CXMT 尽管良率低，但 2027 年可能生产约 300‑400 万颗 HBM3E 堆叠，足以支持约 80‑100 万颗国产 AI GPU。 🎯这使 CXMT 对中国 AI 供应链具战略意义，但距成为全球性替代者仍有距离。 📊计入 CXMT 的 HBM 爬坡后，摩根士丹利模型显示 2026 年全球 DRAM 供应缺口约 17%，2027 年缺口约 15%。 🔬长江存储（YMTC）：架构突破与产能变数🚀技术突破：混合键合（Xtacking）架构是核心，目前已量产 267 层 NAND，300 层以上产品在研。 ⚡其 PCIe 5.0 公司级 SSD 顺序读取带宽达 14.0‑14.2GB/s，QLC 产品 PE501 容量达 122.88TB，耐用性指标显示存储密度与系统集成取得实质进展。 ⚠️但产品可用不等于已获超大规模客户广泛认证。 🏗️产能情景：YMTC 正同时建设 Fab4 和 Fab5，每座规划产能 10 万片 / 月。 📊若全部用于 NAND，加上已宣布的五座晶圆厂，其全球 NAND 份额可能达 24%。 📈基准情景下，若 AI SSD 需求在 2028 年同比增长 30‑60%，YMTC 产能在 31 万至 47 万片 / 月之间，NAND 供应可能保持紧张；若 YMTC 加速扩产，则存在供过于求风险。 📉行业影响：碎片化、资本开支与回报👥行业玩家：DRAM 关键玩家从 1996 年 24 家降至 2020 年 3 家，2026 年因 CXMT 加入变回 4 家。 ⚖️存储领导权从三国杀变为四国博弈，但行业仍高度集中。 💵资本开支：2026‑28 年总存储资本开支将急剧上升，受 AI 相关需求与中国公司扩产驱动。 📊但资本密集度（占行业收入比）从 2022 年峰值下降，2028 年预计降至低双位数，主因价格通胀。 🔧HBM 尤其资本密集，其更大裸片、堆叠、封装测试要求降低每晶圆有效比特产出，需额外投资。 💎可持续回报：中国大举进入可能危及行业当前高利润率（DRAM 营业利润率超 80%）。 📉摩根士丹利预计 DRAM 周期内营业利润率长期将正常化至 50%；NAND 因 YMTC 进展，利润率下降更快，正常化至 15‑20%。 📈估值：强劲存储涨价、AI 需求与长期协议推动 DRAM 公司 12 个月远期市净率达约 4.0 倍峰值（历史峰值通常 1.8‑2.1 倍），后回落至约 2.4 倍。 💡中国进入不一定封杀峰值估值，但更相关的是长期正常化估值区间与下行底线。 🔍随着 CXMT 和 YMTC 成为重要的摇摆供应商，市场辩论焦点已从 “中国能否生产主流存储” 转向 “其扩张多快影响定价、多快压低原有头部公司可持续回报”。 🔧设备与材料本土化：第三重突破📋CXMT 的 Gen 4B 制程主要使用国产设备（DUV 除外），国产供应商在刻蚀、沉积、清洗、CMP、涂胶显影和检测领域持续认证。 ⚠️但未突破领域包括浸没式 DUV、先进量测、制造软件、备件与维修，以及 HBM 封装与认证。 📌这些是本土半导体设备链本土化最低的环节。 📊YMTC 新厂本土化渗透率接近 60%。 ⚠️关键风险与结论⏱️短期（2028 年前）：AI 需求、HBM 产能挤出、国内进口替代与产品认证时间线可吸收中国大部分新增产出，定价影响有限。 🔮长期（2028 年后）：若 CXMT 在需求走弱时继续扩产，其目标（国内替代、技术学习、供应链安全）可能与原有头部公司（利润驱动）不对称，行业行为或改变。 📉Big Three 可能需承担更大减产份额以恢复平衡。 💣风险不仅是 “廉价中国 DRAM”，而是从利润目标一致的三方市场变为战略目标不对称的四方市场。 🎯终局可能是 “先分化后替代”：中国日益主导主流存储边际定价，原有头部公司通过 HBM 和先进产品防御利润池；当中国后续向上进入价值链条，挑战才真正触及利润核心。#文字观点", "publish_time": "2026-08-28 08:19", "tags": ["文字观点"]}, "post:2026-08-28T21-58:1cca4d8cd406": {"id": "post:2026-08-28T21-58:1cca4d8cd406", "kind": "post", "title": "2026-08-28 21:58", "source_label": "帖子正文", "excerpt": "骄成超声2026H1业绩点评：业绩维持高增，半导体业务加速突破，头部先进封装/存储厂商加速导入 #2026年中报业绩亮眼，半导体业务加速突破：2026H1公司实现营收4.46亿元，同比+38.2%，实现归母净利润1.03亿元，同比+77.4%，实现毛利率64%/净利率22.5%。公司自主研发的超声波", "content": "骄成超声2026H1业绩点评：业绩维持高增，半导体业务加速突破，头部先进封装/存储厂商加速导入 #2026年中报业绩亮眼，半导体业务加速突破：2026H1公司实现营收4.46亿元，同比+38.2%，实现归母净利润1.03亿元，同比+77.4%，实现毛利率64%/净利率22.5%。 公司自主研发的超声波扫描显微镜（C-SAM/SAT）是国内少数实现全栈自研、2025年成功切入头部存储厂商量产线的产品，2026年继续获取头部存储客户复购订单，覆盖DRAM、NAND、HBM、CoWoS封装等高端芯片的堆叠缺陷检测场景。同时在晶圆键合领域，2025年公司超声波键合机已实现批量订单落地，2026H1继续在半导体头部客户放量。同时，新一代超声波固晶机验证亦取得顺利进展。公司先进封装相关业务正持续突破技术与市场边界，加速向规模化应用迈进。 #坚持平台化战略，大力开拓超声波技术在半导体领域的应用，打造新增长曲线。 公司过去3年重点投入半导体领域，24年取得约5000万收入，25年实现收入约1亿元，封测领域晶圆超扫、超声键合等产品已实现批量化出货，正式进入收获期。公司目前已组建了完整的先进封装研发团队，背景大多来自海外头部企业，未来将大力拓展先进封装领域。我们预计半导体领域超声波设备市场空间超百亿级，市场份额主要被海外K&S（库力索法）、ASMPT、PVA、Sonoscan等头部公司垄断，国产替代空间巨大。#核心推荐逻辑：公司是超声波技术平台型公司，受益于AI先进封装资本开支上行周期、锂电复苏周期、及固态电池产业化，设备+耗材的商业模式优异，基于超声波技术平台，公司重点拓展半导体功率和检测领域（IGBT、先进封装等），开辟第二成长曲线。我们预期公司26/27年归母净利润2.5亿、3.5亿元，建议重点关注#文字观点", "publish_time": "2026-08-28 21:58", "tags": ["核心推荐逻辑", "文字观点"]}, "post:2026-08-28T13-43:afb4f6ec5a24": {"id": "post:2026-08-28T13-43:afb4f6ec5a24", "kind": "post", "title": "2026-08-28 13:43", "source_label": "帖子正文", "excerpt": "伯恩斯坦——日本半导体：光罩基板——AI ASIC设计激增背后不为人知的英雄 BERNSTEIN 认为，随着AI ASIC设计浪潮推动先进逻辑芯片设计数量激增，EUV光罩基板（Mask Blank）市场正迎来加速增长。该报告预测2025-2028年EUV光罩基板市场规模的复合年增长率（CAGR）将达", "content": "伯恩斯坦——日本半导体：光罩基板——AI ASIC设计激增背后不为人知的英雄 BERNSTEIN 认为，随着AI ASIC设计浪潮推动先进逻辑芯片设计数量激增，EUV光罩基板（Mask Blank）市场正迎来加速增长。该报告预测2025-2028年EUV光罩基板市场规模的复合年增长率（CAGR）将达25%，其中出货量CAGR约19%，平均售价（ASP）CAGR为\"中双位数\"（MSD%）。市场由HOYA（豪雅）和AGC双头垄断，HOYA凭借在相移掩模（PSM）和高数值孔径EUV（High-NA EUV）领域的技术领先优势，份额超过70%且有望继续扩大。报告将HOYA目标价从34,800日元上调至35,500日元，维持\"跑赢大盘\"评级；同时覆盖Lasertec（激光科技），给予\"跑赢大盘\"评级及目标价54,000日元，受益于EUV光罩及光罩基板检测需求。 EUV光罩基板市场：高壁垒、高增长的必需材料 • 光罩基板是半导体光刻工艺的核心耗材。随着技术从DUV转向EUV，EUV光罩基板市场规模已超越DUV，约占整个光罩基板市场的三分之二。 • 2025年全球光罩基板总市场规模约13亿美元，预计2028年将增至22亿美元（CAGR 19%），其中EUV细分市场CAGR高达25%。 • 增长驱动力一：AI ASIC趋势导致芯片设计数量激增。当前每家云服务提供商（CSP）和AI公司都在自研GPU、CPU和AI加速器，先进逻辑节点（7nm及以下）的芯片设计数量在2025-2028年CAGR达21%。台积电（TSMC）公告其2nm节点在可比阶段的流片数（tape-outs）约为3nm同期的4倍（2025年12月时仅为2倍），印证了客户采用率更强、设计生态更广。 • 增长驱动力二：EUV层数量持续增加。先进制程节点的EUV层数量从当前20多层升至1nm（A10）的约30层，直接拉动每块芯片所需的光罩基板数量。 • 在上述双重驱动下，EUV光罩基板出货量预计从2025年的1.75万片增至2028年的3万片（CAGR 19%）。 ASP持续升级：从相移掩模到High-NA EUV • EUV光罩基板本身已是高价值产品，单价接近50万美元，是DUV光罩基板（约500美元）的100倍。其制造复杂度极高，需约50层涂层构成的反射式多层镜面结构，缺陷控制要求严苛。 • 技术升级路径一：相移掩模（PSM）。在2nm节点之前，EUV掩模主要为二元掩模（光要么反射要么吸收）。随着特征尺寸缩小，相邻反射光波干涉会降低图案对比度，行业开始引入相移层（使反射光相位偏移180度）来改善图像对比度。PSM制造难度极大（相移层高度需精确到纳米级），2nm工艺约需5层相移层，1.4nm节点可能升至约10层。相比传统二元EUV掩模，PSM的ASP预计高出20%-30%，且已从2nm量产阶段开始渗透。 • 技术升级路径二：High-NA EUV。High-NA（0.55NA vs 当前0.33NA）预计在2027-2029年用于DRAM和前沿逻辑节点，分辨率提升约70%。这需要新一代EUV掩模，采用新的吸收层材料和设计，规格更高、制造更复杂，ASP高于PSM。更远期，变形High-NA EUV掩模（尺寸从6x6英寸变为12x6英寸）可能带来价值的阶跃式增长，ASP可能达到当前水平的2倍以上。 • 受PSM升级和High-NA EUV采用推动，EUV光罩基板ASP在2025-2028年预计以中双位数CAGR增长。 HOYA：主导EUV光罩基板市场，上调目标价至35,500日元 • HOYA与AGC垄断EUV光罩基板市场，HOYA份额超70%，在台积电、三星、SK海力士占据主导；AGC历史上在英特尔占优。但技术路线图正日益向HOYA倾斜——其在PSM和High-NA EUV掩模上技术领先，制造壁垒显著提升，预计HOYA将不仅在整体市场扩大份额，还可能切入英特尔供应链。 • 光罩基板业务贡献HOYA IT部门收入的40%和营业利润的51%（FY26/3），占整体利润的33%。随着该业务增速更快且利润率更高，预计其对IT部门利润的贡献在FY29/3将升至55%。 • 财务预测更新：HOYA的EUV光罩基板收入增速预期从FY26/3-29/3的21% CAGR上调至28% CAGR。总营收预测在FY28/3E-FY29/3E上调4%-5%，营业利润上调4%-7%。目标价基于35倍Q5-Q8预期市盈率，对应预期EPS约1,013日元，目标价设为35,500日元（原34,800日元），重申\"跑赢大盘\"评级。 • 关键风险（下行）：技术迁移放缓影响EUV光罩基板需求；HDD需求周期性波动；汇率不利变动。 Lasertec：同样受益于EUV光罩检测 • Lasertec是ABICS（行业领先的光罩基板检测系统）的唯一供应商，已推出E120和E320平台以支持先进节点和未来High-NA EUV需求。在EUV图案化光罩检测领域，其ACTIS（ actinic检测工具）也是独家供应。 • 尽管EUV光罩检测的收入贡献目前有限，但主要上行空间仍来自ACTIS和MATRICS等图案化光罩检测平台。随着EUV掩模复杂度持续提升，检测要求日趋严格，长期需求稳固。报告认为其保守指引有望逐步上修。 • 目标价54,000日元基于40倍Q5-Q8预期EPS，维持\"跑赢大盘\"评级。 • 关键风险（下行）：台积电晶圆厂采用actinic检测的速度慢于预期；EUV光刻需求弱于预期；竞争对手进入市场延迟；汇率不利变动。 行业映射 AI ASIC的爆发不仅直接利好晶圆代工和芯片设计公司，其\"隐藏的赢家\"还包括上游半导体材料和检测设备——光罩基板作为每个先进芯片设计不可或缺的高壁垒耗材，正享受设计数量增加、每层复杂度提升、单价上涨的三重红利。HOYA作为绝对龙头，是这一趋势最直接、最确定的受益标的。#文字观点", "publish_time": "2026-08-28 13:43", "tags": ["文字观点"]}, "attachment:files/A股与港股复盘20260828.pdf": {"id": "attachment:files/A股与港股复盘20260828.pdf", "kind": "attachment", "title": "A股与港股复盘20260828", "source_label": "其他", "excerpt": "A股与港股复盘 2026年8月28日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 算力回吐，风格切向农业化工 2026年8月28日 · 沪深15:00 / 港股16:08 主线 8 月 28 日的主线是资金的高低切换。8 月 27 日被英伟达财报单向买进半导体的资金，今天反向撤出，涌入农业、化工、地产链与消费——氮肥、种子、煤化工领涨", "content": "A股与港股复盘 2026年8月28日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 算力回吐，风格切向农业化工 2026年8月28日 · 沪深15:00 / 港股16:08 主线 8 月 28 日的主线是资金的高低切换。8 月 27 日被英伟达财报单向买进半导体的资金，今天反向撤出，涌入农业、化工、地产链与消费——氮肥、种子、煤化工领涨，基础化工板块主力净流入约 267 亿元，运动服装、房产租赁经纪同步走强，涨停板也集中在饰品、家居、种植、化学制药这些低位品种。切换的另一面，是昨日刚由英伟达行情点燃的算力链两地同步回吐。但这应该不是二次杀跌：上证基本走平、两市上涨家数仍占优、涨停 82 家、长鑫科技利润翻了十倍，股价守住了昨日涨幅，整个盘面更像获利回吐加风格再平衡，而非算力逻辑破位。 昨天大涨的芯片、光模块、PCB 今天集体回吐，成交额前十席位仍被这些名字占着、但方向反了过来，中际旭创、亨通光电、新易盛、胜宏科技、兆易创新的成交都在 140 亿元上下；同一批资金转身买进氮肥（泸天化涨停）、煤化工（华鲁恒升涨 4.8%）、房产经纪（我爱我家涨停）和运动服装（探路者涨 7.0%），涨停家数从昨天的 82 家里，7 板的深中华A 是饰品、5 板的海鸥住工是家居。科创50 收跌 1.85%，约为其近一年日收益标准差 2.74% 的 0.68 倍，本身不算大；真正整齐的是切换——半导体、CRO、疫苗、风电一条线全跌，农业、化工、地产、消费一条线全涨。港股这一端恒指靠腾讯、小米两只权重收涨 0.07%，芯片股华虹、中芯、长飞则和 A 股一个方向下跌。 昨晚英伟达炸裂的业绩和前瞻性指引只拯救了全球半导体几个小时。从昨晚到今天亚洲盘，美国半导体、韩国半导体和中国半导体都是跌的，台积电继续受益于英伟达揭示的芯片需求而涨。毕竟，现在英伟达溢价公司的盈利已经超过了12家美国标志性公司的盈利。而这12家标志性美国公司的盈利总和，一半来自于苹果。然而，今天的农产品、金银和加密等板块却表现不俗。如果我们看看金银和加密vs美债收益率50天滚动相关性，这个相关性是在下降的，显示了黄金白银加密的定价逐渐与美债收益率脱钩。上一次这种情况的发生，是在俄乌战争爆发之后。如果美债长端收益率不再是一切估值 的锚，那么一种新的无风险价格正在生成，这是对于美元储备地位的调整。也就是大家现在都听说过的美元信用缺失（the Debasement Trade）的主题交易。 市场在等周末的Jackson Hole沃什的主题演讲。其实，沃什又能讲什么呢？看看Jackson Hole发言的主题，大都围绕着金融创新，演讲嘉宾对于货币政策的影响力也乏善可陈。近两年以来每一次十年美债收益率飙升到4.8左右的水平然后回落，其实每一次都是贝森特在主持大局、力挽狂澜。第一次是2024年特朗普赢得了大选之后，市场担心关税对于通胀的影响；第二次是“解放日”；第三次是伊朗战争以来。还有联手日本干预日元，等等。换言之，如果市场希望利率走低，那么应该看贝森特，而不是沃什。 A股与港股复盘 2026年8月28日 研究笔记 · 不构成投资建议 第 2 / 13 页 本日报要 主线段： 8 月 27 日英伟达财报把资金单向推进半导体，8 月 28 日这批资金反向撤出。今日两市成交 2.10 万亿元、较昨日微缩 242 亿元，但结构完全换向：成交额前十全部是昨日领涨的算力名字（中际旭创 280.5 亿、亨通光电 183.2 亿、新易盛 175.5 亿、胜宏科技 143.1 亿、兆易创新 142.1 亿、长鑫科技 132.9 亿），方向由涨转跌；半导体行业主力资金净流出约 128 亿元，半导体材料跌 2.74%、半导体设备跌 2.39%、数字芯片设计跌 1.97%。资金去向是低位顺周期与防御：氮肥板块涨 7.33%、种子涨 4.53%、煤化工涨 3.60%、纺织化学制品涨 3.94%、运动服装涨 5.12%、房产租赁经纪涨 5.44%，基础化工板块主力净流入约 267 亿元。涨停 82 家、跌停 1 家，连板结构里最高的深中华A（7 板）是饰品、海鸥住工（5 板）是家居用品、万向德农（4 板）是种植业，没有一个来自半导体。8 月 25 日复盘写的\"恐慌顶点或已过、待验证\"，今天被这波回吐推回不确定，但上证仅跌 0.11%、两市 2,824 只个股上涨仍多于 2,306 只下跌、长鑫科技（CXMT 上市主体）仅跌 0.88% 守住昨日涨幅，属于获利回吐加风格再平衡，不是算力逻辑破位。 A股： 上证收 3,952 点跌 0.11%，深证成指收 13,953 点跌 0.68%，沪深300 收 4,609 点跌 0.46%，创业板指收 3,424 点跌 1.41%，科创50 收 1,662 点跌 1.85%。沪市成交 9,703.7 亿元、深市 11,313.5 亿元，两市合计 21,017.2 亿元，较昨日 21,259.3 亿元微缩 242.1 亿元。涨跌家数（两市，交易所口径）2,824 及 ASIC 和OE共同载板。康宁 2026 年6 月提出 glass bridge 方案，组装时间可从十几分钟降至秒级。国内沃格光电、通格微已完成 1.6T 光模 块CPO 产品小批量送样。 6.设备端国产化突破明显，但部分环节仍以海外为主 ：TGV 设备方面，德龙激光最小孔径可做到 5微 米、深径比 1:100 ，大族激光已进入验证并量产阶段。 PVD 方面多维科技纵横比达 8:1以上。水平电镀 东威科技宽深比已达 1:7，正在研发 1:10 。检测环节中电科风华已推出可同步检测 TGV 和RDL 的多通 道设备。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 问答整理 （本次电话会议为单方报告解读，无问答环节） 原文 （输入为结构化报告解读内容，非口语逐字稿，省略原文一节） ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960", "status": "extracted"}, "post:2026-08-28T08-18:1d2250e71540": {"id": "post:2026-08-28T08-18:1d2250e71540", "kind": "post", "title": "2026-08-28 08:18", "source_label": "帖子正文", "excerpt": "📰特朗普政府设立新 AI 监管机构的行政令陷入停滞💡仿照 FINRA 设立独立 AI 监管机构的想法，遭到前白宫 AI 与加密货币事务负责人戴维・萨克斯的反对。💡据两位看过草案的人士透露，特朗普政府最近几周在内部传阅了一份行政命令草案，呼吁为生产最先进模型的人工智能公司建立一个自律组织。", "content": "📰特朗普政府设立新 AI 监管机构的行政令陷入停滞💡仿照 FINRA 设立独立 AI 监管机构的想法，遭到前白宫 AI 与加密货币事务负责人戴维・萨克斯的反对。 💡据两位看过草案的人士透露，特朗普政府最近几周在内部传阅了一份行政命令草案，呼吁为生产最先进模型的人工智能公司建立一个自律组织。 💡该行政令的起草标志着向设立此类监管机构迈出了重要一步，尽管仍面临重大障碍。据另外三位知情人士透露，该行政令若要最终定稿，仍需获得包括总统在内的一系列高级官员的支持，而近期这方面的进展已陷入停滞。 📌要点💡特朗普政府关于设立人工智能自律监管机构的行政令草案已陷入停滞。 💡拟议中的人工智能监管机构将效仿美国金融业监管局（FINRA），重点聚焦于模型发布前的测试。 💡颇具影响力的前白宫官员戴维・萨克斯反对对人工智能实施类似 FINRA 的监管。 💡这一想法源于上个月谷歌 DeepMind 时任首席执行官德米斯・哈萨比斯提出的建议，即成立一个新的公私合作组织来监管人工智能。哈萨比斯在 X 平台上发表了一篇文章，呼吁建立一个以金融业监管局为蓝本的标准制定机构，该机构是一个自律组织，多年来一直负责监管美国的经纪自营商和证券专业人士。 💡据其中两位知情人士透露，这项关于新人工智能组织的行政命令源自政府高级官员的提议。彭博社 7 月报道称，财政部长斯科特・贝森特曾提议设立这样一个监管机构。 💡目前尚不清楚该行政命令为何被搁置。但前白宫人工智能与加密货币事务负责人戴维・萨克斯强烈反对为人工智能设立类似金融业监管局（FINRA）的机构。上周，萨克斯在其《All‑In》播客节目中将其描述为 “一个糟糕的主意”，特别批评了在模型发布前进行测试的想法，以及该自律组织应向政府汇报的设想。相反，他表示支持电影协会的模式，该模式独立监管电影分级系统，且不向政府汇报。 💡关于该行政命令及自律组织结构的具体细节尚无法获知。其出台时间也难以预测。特朗普政府 6 月发布的一项与人工智能相关的行政命令，为前沿模型评估建立了自愿框架，该命令经过了数月的谈判。 💡白宫发言人表示：“任何政策公告都将直接来自总统。关于潜在行政命令的讨论纯属猜测。” 💡模型评估在特朗普政府期间一直是一个政治敏感话题。白宫将美国人工智能安全研究所更名并缩减规模，该机构最初由拜登政府创立。在萨克斯的推动下，特朗普政府推行了不干预的做法，取消了拜登时期的许多监管规定。 💡但随着 Anthropic 的 Mythos 等人工智能模型变得更加先进，特朗普政府官员开始推动对该技术加强保障措施。6 月发布的人工智能行政命令创建了自愿测试框架，其起因是对新模型网络安全能力的担忧。但科技行业内部对该框架将如何运作仍存在困惑。白宫尚未公开该框架，尽管它在 8 月初已经定稿。 💡与此同时，不同行业领袖也各自提出了监管体系的方案，哈萨比斯便是其中之一。在他的文章中他写道，一个仿照 FINRA 设立的人工智能标准机构将负责制定评估协议，并与 “相应的联邦机构” 合作。 💡该机构还将根据其设定的特定门槛，将模型归类为 “前沿级”，并鼓励这些模型的开发者采纳最佳实践，如发布模型卡片、维护网络安全以及审查人员背景。前沿实验室需在发布模型前最多 30 天，与该机构共享模型。 💡哈萨比斯提案中的许多表述与白宫早前的自愿框架相呼应，这引发了关于两套体系将如何互动的疑问。 💡尽管哈萨比斯的文章获得了广泛支持，但像萨克斯这样在特朗普政府中仍颇具影响力的人物的反对，可能会威胁到这一努力的推进。 💡上周，萨克斯在 X 平台上发帖批评了 “AI 领域的 FINRA” 这一构想，将其比作车辆管理局。萨克斯写道：“随着规则不断累积以防范理论上的危害，这一过程只会变得更加错综复杂。”#文字观点", "publish_time": "2026-08-28 08:18", "tags": ["文字观点"]}, "post:2026-08-28T08-19:4af3b03ac7fd": {"id": "post:2026-08-28T08-19:4af3b03ac7fd", "kind": "post", "title": "2026-08-28 08:19", "source_label": "帖子正文", "excerpt": "📌瑞银 ——SK 海力士（000660）：2026 年瑞银韩国峰会要点纪要 —— 股东回报释放积极信号📑一、股东回报政策：明确 \"50% 自由现金流返还\" 为底线，股票回购计划落地 📝上周公司宣布 4 万亿韩元股票回购计划，该计划属于整体 \"超 50% 自由现金流（FCF）返还\" 框架的一部分。🔔此", "content": "📌瑞银 ——SK 海力士（000660）：2026 年瑞银韩国峰会要点纪要 —— 股东回报释放积极信号📑一、股东回报政策：明确 \"50% 自由现金流返还\" 为底线，股票回购计划落地 📝上周公司宣布 4 万亿韩元股票回购计划，该计划属于整体 \"超 50% 自由现金流（FCF）返还\" 框架的一部分。 🔔此前 \"最高 50%\" 的表述调整为 \"超过 50%\"，意味着 2025‑2027 年期间 50% 是最低返还底线，而非上限。 💹SK 海力士可能在需要时通过额外回购来支撑股价，并会提前公告。 📢更多细节将在三季度业绩电话会上披露。 📄关于美国存托凭证（ADR）：公司正在推进监管审批，目标是在未来逐步提高美国上市部分的流动性。 📊二、长期协议（LTA）覆盖：年底预计超半数 bit 量被锁定 📌瑞银维持此前判断：到 2026 年底，超过 50% 的 bit 出货量将通过长期协议覆盖。 🤝谈判重点在于锁定出货量可见度，不设价格下限或上限。 🎯优先与超大规模云客户（hyperscalers）谈判，大型 OEM 厂商也将被纳入。 💻HBM 方面： 考虑到供应紧张，存在 \"降规\"（de‑specing）的可能性。 🔍瑞银认为英伟达已从 HBM4E 12‑Hi 转向 HBM4 8‑Hi（用于 VR/R300 系列），这不影响整体需求 —— 单个 SiP 内容减少，但 SiP 总数增加。 📈2027 年 HBM 需求预期极强，供应短缺可能持续至 2030 年甚至更久。 ⚠️整体 DRAM 需求满足率目前约 60‑70%，未满足需求将溢出至 2027 年，行业供应短缺将进一步恶化。 💵短期来看：SK 海力士二季度 DRAM 平均售价（ASP）为 1.47 美元 / Gb，低于三星的 1.55 美元 / Gb，但预计到 2026 年下半年这一差距将收窄。 🏭三、资本开支：未来数年维持高位 🏗️龙仁（Yongin）1 号工厂： 2027 年 2 月开始搬入设备，第二间洁净室预计同年晚些时候跟进，第一阶段产能仍聚焦 DRAM。 🔧制程路线： SK 海力士可能继续使用 6F2 至 0a 纳米节点（瑞银认为是否切换至 4F2 仍有待确认），之后在多个节点过渡到 4F2，最终走向 3D DRAM。 💾NAND 产能： 大连工厂可能基于浮栅工艺增加 NAND 产能，未来可能从 144/192 层升级至 240 层。 📅M17（NAND 工厂）预计 2029 年上半年开始量产。 💰2027 年整体资本开支预期： 瑞银预测为 61 万亿韩元，同比增长 30%，并将在可预见的未来持续维持高位。 📈四、估值与评级 🧮基于长期 ROE 预测 49.2% 和股权成本 11.4%，给予 4.32 倍未来 12 个月市净率（P/BV）估值。 🎯韩国普通股目标价 300 万韩元，ADR 目标价 210 美元（基于最新汇率）。 ✅维持买入（Buy）评级。 📊当前股价 167.8 万韩元（8 月 25 日），隐含预期股价回报约 78.8%，叠加股息收益率 2.9%，预期总回报约 81.7%，较市场假设超额回报 72.5%。 ⭐五、量化评估摘要（短期因素评分） 📊行业格局未来 6 个月：5 分（改善，满分） ⚖️监管 / 政策环境未来 6 个月：3 分（不变） 🔎过去 3‑6 个月基本面变化：5 分（大幅改善） 📈下次业绩相对市场一致预期：5 分（大概率超预期） ⚠️下次业绩相对瑞银自身预测的风险倾向：3 分（上下行风险均衡） ✨未来 3 个月催化剂：正面催化剂，预计日期约 2026 年 9 月 18 日，内容包括：月度智能手机实际销售数据、定价谈判最终敲定、GPU 需求近期供应链动态、股东回报进一步更新。#文字观点", "publish_time": "2026-08-28 08:19", "tags": ["文字观点"]}, "post:2026-08-28T10-46:6178d44488ec": {"id": "post:2026-08-28T10-46:6178d44488ec", "kind": "post", "title": "2026-08-28 10:46", "source_label": "帖子正文", "excerpt": "上美股份26H1点评：韩束舆情影响下增长承压，短期关注主品牌修复节奏、中期关注出海布局 📍公司公告：26H1实现收入37.6亿元/yoy-8.6%，实现净利润1.26亿元/yoy-77.4%，毛利率/净利率分别同比+1.2/-10.2pct，主要受到韩束因舆情影响增长承压所致。#分品牌看，主品牌舆情", "content": "上美股份26H1点评：韩束舆情影响下增长承压，短期关注主品牌修复节奏、中期关注出海布局 📍公司公告：26H1实现收入37.6亿元/yoy-8.6%，实现净利润1.26亿元/yoy-77.4%，毛利率/净利率分别同比+1.2/-10.2pct，主要受到韩束因舆情影响增长承压所致。 #分品牌看，主品牌舆情影响下增长承压，核心小品牌依然高增 🔴韩束：26H1收入26.6亿元/yoy-20.4%，受25年末舆情影响、以及Q2相对高基数，导致品牌增长承压；从抖音渠道看，Q3依然为相对高基数阶段，重点关注品牌后续运营策略优化和增长抓手。 🟡一页：26H1收入6.4亿元/yoy+59.9%，延续较好增长；公司8月协议收购一页母公司29%股权，收购完成后公司持股比例将从55%提升至84%，在一页高速成长+兑现稳定盈利的情况下，有助于进一步增厚归母端利润。 🟢安敏优：26H1收入1.4亿元/yoy+89.3%，基于青蒿修护概念快速增长，核心单品青蒿修红棒为主要增长来源，或有望在一页后承接小品牌增长曲线。 💬其他品牌：红色小象：26H1收入1.1亿元/yoy-29.1%，依然承压；新品牌维度，公司目前在筹备医生IP母婴护理品牌崔玉涛、IP母婴护理品牌光之守护奥特曼、洗护品类IP品牌HelloKitty等，持续关注新品牌培育情况#销售费率端显著承压影响净利率表现。公司26H1毛利率/净利率分别为76.7%/3.3%，同比分别+1.2/-10.2pct，净利率端承压主要源于费率端影响：销售费率66.1%/+9.2pct，我们预计一方面主品牌舆情之下公司或进行品宣费用投入，此外主品牌增长承压亦导致规模效应减弱（我们周二的段子中也分析了为何品牌普遍在收入有压力时费率提升更多）。管理费率4.8%/+1.1pct，源于公司持续搭建人才梯队导致薪酬支出增长。#人才、产能本地化为公司出海打下基础。公司出海布局持续推进，人才方面，海外已布局152全职员工，生产维度，8月上美印尼工厂启动建设，项目总投资约3亿元，一期设计日产能50万瓶，预计27年7月正式投产，在人才、产能逐步储备落地后，出海路径若能够探索清晰，可打开成长天花板。 💡投资建议：韩束作为公司收入利润核心贡献来源，其修复节奏将直接影响公司收入业绩回暖情况，短期关注能否通过策略调整驱动主品牌重回增长轨道，观察高频数据改善情况；中期关注品牌出海进展，公司已进行人才、产能本地化储备，若出海路径跑通则有望打开成长天花板，关注明日业绩会公司更新指引情况。#文字观点", "publish_time": "2026-08-28 10:46", "tags": ["销售费率端显著承压影响净利率表现", "人才、产能本地化为公司出海打下基础", "文字观点"]}, "attachment:files/中信建投-2026美国中期选举跟踪(1)-中选前瞻(1)，选情怎么看，议题有哪些-260827.pdf": {"id": "attachment:files/中信建投-2026美国中期选举跟踪(1)-中选前瞻(1)，选情怎么看，议题有哪些-260827.pdf", "kind 9.23%，营收占比34.90%，为公司第一大业务。公司深耕终端整机及模组装配、检测设备领域，服务全球头部终端品牌及产业链客户，产品覆盖摄像传感测试、模组自动化检测、IMU校准、AR/VR光学显示测试、气密性检测、点胶贴合及老化测试等全流程环节，具备行业完备检测解决方案。目前XR/VR核心参数检测设备已批量交付头部客户，消费电子业务随终端创新持续修复向好。 ☆新能源设备：业务稳健增长，锂电中后段工艺积淀深厚。2026H1新能源业务收入3.54亿元，同比+11.15%，营收占比24.12%。公司深耕锂电领域18年，聚焦电芯制造中后段设备，主营叠片、化成分容、包绝缘膜等核心设备。叠片设备搭载自研震动抑制、张力控制、尺寸闭环控制等专利技术，覆盖消费、动力、储能三大电芯领域；包膜设备兼具高良率、快达产优势，为行业标杆产品；化成分容设备适配多类电池，固态/半固态电池相关系统已落地多条中试及产线，热压化成设备实现批量交付，新能源业务在行业资本开支分化格局下保持稳健韧性。 ☆精密零部件：半导体、光模块业务高速放量，设备与零部件协同突破。2026H1精密零部件业务收入3.31亿元，同比+42.14%，营收占比22.54%，其中半导体及光模块零部件收入1.71亿元，营收占比11.62%。AI算力建设驱动光模块向800G、1.6T、3.2T迭代，带动高精度耦合、贴装、测试、光纤研磨设备需求扩容；HBM、DDR5、先进封装及功率半导体国产替代，打开设备长期成长空间。公司光模块产品覆盖光芯片各类检测、共晶贴片、多品类光器件耦合及无源器件自动化组装等环节，高精密三轴、六轴平台已批量交付，业务持续从单机设备向整线方案、从设备制造向超高精密零部件延伸。 ☆技术平台与全球化布局：筑牢技术底座，海外业务高增提质。公司坚守“高速、高精、高智、高效”技术路线，持续深耕机器视觉光学软件、精密运动控制、仿真平台、工业软件等核心领域。2026H1拥有研发人员1022人、知识产权574项，包含有效专利282项、发明专利116项、软件著作权172项。全球化布局完善，于香港、泰国、新加坡等多地设立分支机构，就近服务全球客户。2026H1海外收入4.08亿元，同比+58.04%，营收占比27.79%，海外毛利率46.21%，同比+3.50pcts，高增高毛利的海外业务持续赋能盈利提升。 ☆投资观点：公司为跨行业非标自动化与精密零部件平台型企业，消费电子基本盘修复、新能源业务稳健经营、半导体及光模块业务高速放量，整体业务结构持续优化。公司有望依托AI算力建设、先进封装迭代、产业链国产替代及全球化拓展，打开广阔空间。伴随半导体光模块业务规模扩容、精密零部件能力外溢、全球化布局持续深化，公司业绩与盈利弹性有望持续提升，我们看好公司发展前景。#文字观点", "publish_time": "2026-08-28 11:07", "tags": ["文字观点"]}, "post:2026-08-28T13-43:858756521ca6": {"id": "post:2026-08-28T13-43:858756521ca6", "kind": "post", "title": "2026-08-28 13:43", "source_label": "帖子正文", "excerpt": "高盛——亚洲电池行业：美国行政令后表后储能增长逻辑加速；买入LG化学和LG新能源 8月26日，美国签署第14420号行政令，禁止由“受涵盖外国实体”（如中国）供应的外国产大电力系统设备，明确包括电池储能系统和并网逆变器。", "content": "高盛——亚洲电池行业：美国行政令后表后储能增长逻辑加速；买入LG化学和LG新能源 8月26日，美国签署第14420号行政令，禁止由“受涵盖外国实体”（如中国）供应的外国产大电力系统设备，明确包括电池储能系统和并网逆变器。但表后（BTM）资产所连接的本地配电设施被明确排除在外。能源部实施细则将在120天内（12月下旬）出台。 我们的观点是什么？ 此前报告已强调，美国数据中心扩张是电池需求的关键结构性增长驱动力，而电网瓶颈（并网点排队、供应链限制、监管延迟）正加速增量表后储能需求。最新行政令可能对表前（FTM）项目建设施加进一步监管约束，这反过来强化了表后储能的增长前景。 在基本情景下，我们预计到2030年美国储能总可寻址市场（TAM）将达到约170吉瓦时/年（假设累计表后容量约30吉瓦）；在乐观情景下，基于渠道调研的行业反馈（累计表后容量超40吉瓦），TAM可能扩张至约210吉瓦时/年。 韩国覆盖企业中谁最受益？ 我们的长期情景分析持续显示，LG化学和LG新能源的风险收益比最具吸引力。在电芯制造商中，我们偏好LG新能源（买入）和LG化学（买入），支撑因素包括储能业务占比扩大以及我们在行业报告中指出的产能利用率复苏路径。在正极材料领域，基于其美国储能磷酸铁锂定位，我们维持L&F（中性）的偏好，相对Ecopro BM和Posco Future M（均为卖出），后两者的估值已很大程度上反映了我们对储能的乐观情景预期。#文字观点", "publish_time": "2026-08-28 13:43", "tags": ["文字观点"]}, "attachment:files/保隆科技2026年上半年业绩说明会纪要20260827.pdf": {"id": "attachment:files/保隆科技2026年上半年业绩说明会纪要20260827.pdf", "kind": "attachment", "title": "保隆科技2026年上半年业绩说明会纪要20260827", "source_label": "其他", "excerpt": "保隆科技 2026 年上半年业绩说明会纪要 20260827 要点总结 1.上半年业绩创历史新高 ：2026 年上半年实现营收 46.84 亿元，同比增长接近 19% ；归母净利 润 2.64 亿元，同比增长约 96% ，均为公司有史以来最高半年度表现。", "content": "保隆科技 2026 年上半年业绩说明会纪要 20260827 要点总结 1.上半年业绩创历史新高 ：2026 年上半年实现营收 46.84 亿元，同比增长接近 19% ；归母净利 润 2.64 亿元，同比增长约 96% ，均为公司有史以来最高半年度表现。 2.三大影响因素 ：原材料涨价（铜、铝、 PCB 板、芯片等）对毛利率形成负向影响；汇率波动导致汇 兑损失约 2400 万元（去年同期为收益约 4200 万元，同比影响约 6600 万元）；金杰电子港股上市确 认1.3亿元公允价值变动损益。 3.智能悬架业务高速成长 ：配套车型形成梯次，蔚来 ES8/ES9 、小鹏 G7X/G9L 、极氪 V9等热销车型 持续放量，下半年出货量预计好于上半年；空簧产品全年配套量确定性较强，预计超过年初预算数量 级。 4.全球化布局加速落地 ：匈牙利工厂空簧和 ECU 产线已安装调试完成并通过欧洲客户审核；美国第二 个工厂（ TKmax 、GPI 产能）基建将于十月份完成；泰国工厂已开始生产，福特已完成审核；墨西哥 排气管件业务预计明年年中开始供应。 5.海外客户拓展取得重大突破 ：与宝马签署优选供应商协议（ 6月在慕尼黑），奔驰多款车型正在报 价，沃尔沃获得新平台定点，日产全球轮速传感器业务已获取。 6.区工智能（机器人）业务初步布局 ：基于车载传感器技术底座切入编码器、摄像头、触觉传感器等 产品，编码器已有两个头部机器人公司配套项目（一个基本确定、一个在定点过程中）。 问答整理 Q1：请更新 2026 年目前业务在手订单或出货量指引。蔚来作为 10亿元以上核心客户、奇瑞 作为1.5亿元以上增量贡献者的目标是否还能实现？ 答： 从客户端预测量来看，年初至今总体一致性较好。空簧产品整车配套量目前仍超过百万套级别，已 到八月底，全年出货量确定性较大，即使有缺口也不会多，且预计会超过去年预算时的数量级。后续还 有改款车型和新车型陆续投放，包括岚图、理想 iX等。蔚来方面，各产品线（空悬、超声波雷达、摄 像头、胎压传感器等）都在配合， ES8/ES9 持续热销，全年收入体量达到 11亿元级别有很大机会实 现。奇瑞海外业务占比高，在欧洲布局新生产制造，我们所有产品品类都在配合，同样是非常核心的客 户。此外，吉利后续带来的业务增量也会比较大，包括摄像头、空悬、光雨量传感器、轮速传感器等。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 Q2：空簧向低价车渗透过程中，市场竞争格局有没有变化？ 答： 智能悬架渗透率持续提升，产品从全主动悬架到双腔空簧、单腔空簧等整体在向更低定价车型下 沉，有利于市场规模扩大。空簧市场集中度非常高，三家主力供应商集中度已经很高，市场格局相当稳 固。三家之间会有份额波动，主要取决于车型销售变化。其他供应商虽有努力，但不太会看到更多新进 入者。整车企业对供应商能力有门槛要求，国内主力供应商量产规模大、成本挖掘能力强、垂直整合程 度深，在开发能力、保交付、质量表现方面让整车企业放心。有些新进入者可能在个别项目上价格拉得 特别低，但可持续性不够好。部分原有计划参与者已取消空簧项目。 Q3：海外工厂投产及在建进度如何？未来贡献收入的时间线？ 答： 战略基于两个出发点：一是\"中国+1\"，二是针对美国市场需要本地化，构建海外供应链。匈牙利 布局丰富，除原有传感器业务外，空簧和 Òª QQ£º1490929960", "status": "extracted"}, "attachment:files/中泰证券-阳台光储行业：迎消费级户储普惠浪潮，从德国走向世界-260826.pdf": {"id": "attachment:files/中泰证券-阳台光储行业：迎消费级户储普惠浪潮，从德国走向世界-260826.pdf", "kind": "attachment", "title": "中泰证券-阳台光储行业：迎消费级户储普惠浪潮，从德国走向世界-260826", "source_label": "中泰证券", "excerpt": "中泰证券研究所 专业｜领先｜深度｜诚信 ｜", "content": "中泰证券研究所 专业｜领先｜深度｜诚信 ｜证券研究报告｜ 2026.8.26阳台光储：迎消费级户储普惠浪潮，从德国走向世界 吴嘉敏 证券分析师执业证书编号：S0740524060003 邮 箱：wujm@zts.com.cn 仅供内部参考，请勿外传！ 2核心观点 n阳台光储以更低安装门槛打开DIY自发自用市场，本质是消费级户储向公寓、租客等普惠人群拓展增量，而非对存量户储的替代。当前 德国已率先爆发、注册量突破百万户，英国、美国、希腊等市场正依次放开政策，构成后续核心增量。 n德国是阳台光伏“Balkonkraftwerk”的起源地与基本盘，其高增趋势有望延续。德国租房者群体庞大，零售电价偏贵，社会环保意识 浓厚，构成独特的需求土壤；2024年德国以Solar Package I简化注册、放宽功率上限并赋予租户安装权后，需求快速起量。相较传统 户储，阳台户储起步价低、可DIY安装且随搬迁带走，因此其定位为将户储市场向公寓与租客普惠延伸的增量形态，集中体现了户储家 电化趋势。经2022能源危机、组件降本、政策放开三重推动，阳台光伏在德国从小众市场跃升至百万级市场，增长趋势有望延续。因 EEG 2027草案拟对2027年起投产的小型光伏系统取消固定上网电价（FiT），储能的经济性持续凸显，配储率提升成为核心变量。 n德国以外的潜力市场：荷兰、意大利、英国、澳大利亚、日本等国因电价偏贵且补贴政策有利，市场潜力较大，测算阳台有望放开国 家总市场空间约为368亿人民币。以德国2026年数据为锚，假设阳台光伏年增40万户、阳台光伏400欧/户、加装电池组1200欧（5度电） /户测算，目前阳台储能已放开或有望放开的国家至2030年阳台光伏及储能市场合计规模约为46亿欧元即368亿元人民币。 nAC储或成新增长极：随欧美光伏上网补贴退坡，AC储（交流耦合储能）有望成为继便携储能、阳台储能之后的下一高增消费级品类， 测算市场空间为362亿人民币。其本质为交流侧后加装的改造储能，可沿用阳台储能即插即用打法，专门切入欧洲、澳洲大量有光伏而 无储能的存量家庭。测算德、英、荷、澳、意、日、美、法有光无储家庭合计2087万户，在存量家庭整体渗透率达22%、单价1000欧元 假设下，总市场空间约362亿元人民币。 n投资建议：阳台储能赛道景气度向上，随着各国政策逐渐放开扩大市场空间，26H2关注英国市场放量、美国（加州）市场立法突破、 荷兰市场净计量退坡后的AC储增量、澳洲补贴刺激下的AC储增量。看好消费级储能产品公司，建议关注安克创新、华宝新能、德兰明 海等。 n风险提示：海外政策与贸易壁垒风险；行业竞争加剧与价格战风险；上游原材料价格波动风险；需求不及预期风险（海外电价回落）； 技术迭代与合规认证风险；数据测算与更新滞后风险。 仅供内部参考，请勿外传！ 目 录 CONTENTS 起源：户储家电化产物，能源危机下迎来机遇 空间测算：德国未见顶，新市场启航 公司篇：中国消费级储能企业完成卡位1 2 3 仅供内部参考，请勿外传！ CONTENTS 目录 CCONTENTS 专业｜领先｜深度｜诚信中泰证券研究所1起源：户储家电化产物，能源危机下迎来机遇 仅供内部参考，请勿外传！ 5起源：阳台光储以更低门槛打开DIY自发自用市场，是传统户储的增量延伸 n阳台光伏“Balkonkraftwerk”起源于德国，源于其特殊的社会背景——德国超过半数居民为租房群体、不便安装屋顶光伏，绿党与环保人士 长期倡导能源转型、社会环保意识浓厚；居民用电价格昂贵。早年它是环保爱好者把小型光伏板挂上阳台、经微型逆变器插入插座发电的DIY 发明；2024年德国以Solar Package I简化注册、放宽功率并赋予租户安装权后，阳台光储需求快速起量。 n与传统户储相比，阳台光储以更低门槛换取普惠空间:传统屋顶户储单套安装价格昂贵，需要专业安装与并网许可，只能覆盖自有屋顶业主， 而阳台户储以安克solarbank为例，全套带光伏板的基础套餐售价在1000欧元上下，可DIY安装，无需与房东协商、不破坏房屋墙体，可随搬迁 带走。因此阳台户储并非替代传统户储，而是把户储市场向普惠人群延伸的增量形态，在小家庭和公寓租户居多的德国市场兴起并盛行。 图表：传统户储 VS 阳台光储 对比维度 传统户储(屋顶光储) 阳台户储(即插即用光储) 典型功率/容量 8-12kW系统 400-800W(可扩1-2kWh电池) 常见价格档位(一套) 约1.8万-3万美元 1000欧元左右 安装方式 需专业安装、上屋顶布线、接入配电箱 护栏挂装、插头插入普通插座、免钻孔不破坏墙体 安装难度/门檻 需电工+并网协议+许可、约数周 1-2人约90分钟、无工具无电工无许可、可随搬迁带走 适用人群 仅自有屋顶业主 有屋顶业主、租客与公寓居民 数据来源：:EnergySage、Anker官网、 intellisolaris.de、中泰证券研究所传统户储：价格贵、需专业团队安装 阳台光储：DIY即插即用 仅供内部参考，请勿外传！ 6阳台光储作为消费级产品，体现了户储家电化趋势 C方案：AC储 需求 有光无储，需要自发自用 省电 代表国家 荷兰 产品形态 AC储（直接接入家庭AC 主线） 安克产品 为例E系列AC储B方案：传统户储 需求 有独立屋顶，需要备电/省 电 代表国家 澳大利亚 产品形态 传统户储 安克产品 为例X系列户储n电价水平、住宅形态等因素差异催生了不同的光伏+储能组合需求，归纳几种典型场景：1）德国：电价昂贵，公寓及租客占比高，不便安装传 统户储，用户偏向于DIY迷你储能自发自用省钱。2）荷兰：光伏渗透率高但配储率低；净计量政策的取消倒逼配储率提升；3）美国：电网不 稳定，家庭有应急备电的刚需，光伏可选装；4）澳洲：光照足、住宅屋顶面积大，适宜安装传统户储。 n电商时代兴起的移动储能、阳台光储等产品体现了户储的家电化趋势（插拔式、简易安装）。传统户储领域也逐渐出现了简易安装的产品分支。 数据来源：Anker SOLIX官网、MaStR、中泰证券研究所 A方案：移动家储 需求 怕停电、备电 代表国家 美国 产品形态 移动电源+全屋备 电（大号充电宝） 安克产品 为例F系列移动家储 D方案：阳台户储 需求 没有屋顶，需要自 发自用省钱 代表国家 德国 产品形态 阳台储能（套装包 含光伏板+储能） 安克产品 为例E系列阳台光储 图表：户储需求分类及对应产品方案（以安克Solix为例） 需求 判断Q1 电费贵or便宜？贵 Q3 有独立屋顶？无 （公寓） 需求： 公寓(无光伏)/ 自发自用省钱便宜 Q2 电网稳定吗？ 稳定 无需家储 （如中国）不稳定 （经常断电） 需求：停 电应急 A方案：不装光伏 ——移动家储B方案：装光伏 ——传统户储有 （独栋） Q4 是否已装光伏？ 否 需求： 有光无储，自发 自用省钱是 需求： 独栋，无光伏， 自发自用省钱 C方案： ——AC储D方案： ——阳台储能 仅供内部参考，请勿外传！ 7发展历程：经能源危机、产品普及和政策开放，从小众跃升至百万级市场 n德国阳台光伏由民间自发的小众尝试起步，先后经能源危机、产品降本与政策放开三重推动，从小众产品走向大规模流行。 ①2013至2018年间，阳台光伏最早由德国环保爱好者自发安装，长期处于法律灰色地带，家用插座并网既缺乏产品标准、又要走繁琐的并网登 记与许可流程，因此普及缓慢。 ②俄鸟冲突后需求被点燃：2019年德国出台首个技术法规、允许标准插头并网，2022年俄鸟冲突推动居民电价上涨五成以上，叠加疫情居家催 生DIY热情，阳台光伏迅速从小众兴趣变成家庭省电的刚需选择。 ③中国产品与降本推动放量：2023年起电池价格持续下探、微型逆变器降价并取消增值税，安克、EcoFlow等中国品牌进入市场，即插即用产品 走向大众消费品。 ④注册放开与补贴打开天花板:2024年德国以Solar Packagel大幅简化注册、把逆变器上限提高到800瓦，正式向占人口过半的租房群体敞开大 门。 图表：2019-2025德国插拔式光伏累计与新增注册量(万套) 数据来源：:GFK、MaStR、中泰证券研究所（备注：柱状图为累计-右轴，折线图为新增量-左轴）2013-2018 起步期2019 首个法规允许并网2022 俄乌冲突、需求点燃2023 中国组件打开市场2024 安装登记改注册制2025 线下售卖、持续高增 0 0 1 7 35 78 121 0 0 1 6 27 43 43 0.050.0100.0150.0 0.020.040.060.0 2019 2020 2021 2022 2023 2024 2025累计(万套)当年新增(万套) 仅供内部参考，请勿外传！ 8阳台储能为何在德国爆发？——租客多、电价贵、政策支持，多重因素推动 n对比全球人口两千万以 ）达71亿元，同比增长228%，旨在扩充AI PCB产品产能，以把握英伟达（NVIDIA）平台升级（从Blackwell到Rubin）的下一波机遇。野村维持“买入”评级及目标价389元人民币（基于2027年预期每股收益14.41元给予27倍市盈率，与历史中位数一致）。当前股价263.05元，对应2027年预期市盈率18.3倍。 业绩详情与利润率变化 二季度收入55.19亿元，营业利润16.67亿元，营业利润率30.2%（同比提升1.1个百分点，环比提升3.0个百分点）。净利润率25.7%（同比微降0.2个百分点，环比提升2.3个百分点）。尽管毛利率下滑，但营业利润率和净利润率同比仍基本持平或略升，反映公司费用控制（二季度营业费用率降至1.9%，同比下降7.8个百分点）及非经常性收益（投资损益）对利润的支撑。 资本开支与AI PCB布局 上半年资本支出同比大增228%至71亿元，主要用于AI PCB产能扩张。野村认为，这些投入将帮助公司在英伟达平台迭代中占据有利位置，但短期内折旧压力会拖累毛利率。公司正积极提升高多层板、HDI等高端产品占比，以匹配AI服务器、交换机等需求。 估值与评级 目标价389元基于27倍2027年预期市盈率（与历史中位数持平），隐含约48%的上行空间。基准指数为沪深300。野村认为当前估值具备吸引力，维持“买入”评级。 主要风险（下行） 1. 关键客户供应链多元化及同行竞争加剧； 2. 技术变革（如COWOP）可能改变竞争格局并威胁公司市场份额； 3. AI PCB市场技术升级慢于预期； 4. 地缘政治紧张局势升级。 总结 胜宏科技2026年二季度业绩整体符合预期，但毛利率因原材料涨价和折旧增加而明显承压。公司大幅扩产AI PCB产能，为下一代AI平台做准备，长期增长逻辑清晰。野村维持“买入”评级，目标价389元，较当时股价263.05元存在约48%的上行空间。#文字观点", "publish_time": "2026-08-28 13:49", "tags": ["文字观点"]}, "attachment:files/调研交流反馈—医药精选个股专题会纪要20260826.pdf": {"id": "attachment:files/调研交流反馈—医药精选个股专题会纪要20260826.pdf", "kind": "attachment", "title": "调研交流反馈—医药精选个股专题会纪要20260826", "source_label": "其他", "excerpt": "调研交流反馈 —医药精选个股专题会纪要（ 20260826 ） 要点总结 1.科伦博泰： SKB264 国内高速放量 +海外商业化兑现起点 上半年收入 9.78亿元，产品销售 6.57亿元（同比 +112% ），净利润 3.88亿元扭亏。SKB264 为首个 医保年，新增肺癌和乳腺癌二线两个适应症参与医保谈判，有望放大明年销售增速。", "content": "调研交流反馈 —医药精选个股专题会纪要（ 20260826 ） 要点总结 1.科伦博泰： SKB264 国内高速放量 +海外商业化兑现起点 上半年收入 9.78亿元，产品销售 6.57亿元（同比 +112% ），净利润 3.88亿元扭亏。 SKB264 为首个 医保年，新增肺癌和乳腺癌二线两个适应症参与医保谈判，有望放大明年销售增速。海外方面，子宫内 膜癌全球 III期达主要终点，凭借默沙东优先审评券预计 2027年获批上市，后续多个适应症将陆续读 出数据。 2.康诺亚：三层逻辑驱动，商业化 +管线兑现 +早研平台 康悦达上半年收入 3.93亿元（同比 +132% ），公司再次上调销售预期，叠加医保放量双轮驱动。 CMG901 海外权益授权 AZ，CM512 （双抗）已公布半年数据，后续多个适应症在二期。早研平台多 个分子（如 WCSixADC、TL1A P19）进入 IND阶段， 1-3年内有望陆续实现 POC或上市。 3.大森林：行业出清近尾声，加盟驱动新一轮成长周期 Q2单季归母净利增长约 23%，收入增长接近 7%，显示行业经历 24-25 年出清后进入新周期。上半年 零售收入仅增 1.37% ，增长主要来自加盟和分销业务（ +11.53% ）。门店总数达 18700 家，加盟占比 超40%，全年加盟目标 2000家，预计明后年 2500-3000 家。老店同店 Q2约4个点增长，全年预 计 3-4个点，叠加降本增效内生可贡献约 10个点利润增长，全年利润增速预计 20%以上。 4.长春高新：主业触底企稳，创新药管线进入兑现期 金赛药业股权激励目标为 2026-2028 年收入分别不低于 98/128/161 亿元。创新药管线约八九十条， 多个品种获批或受理（如 104、136、155、148等）。 098成为首个海外授权管线，潜在总金额 10 亿美金，首付款约 1000万美金已到账。同时通过资产整合补充现金流，公司确定性进入新发展阶段。 5.新产业：国内集采受益份额提升，海外高增长持续 中报国内发光业务增速不错，受益集采带来的进口替代和份额提升。流水线装机上半年达 120多条， 高速机占比超 80%，三甲医院覆盖率达六成以上。海外印度、欧洲、俄罗斯等增速快，中东受战争影 响短期拖累。预计未来三年收入复合增速 15%，利润增速更高。 6.英科医疗： Q2经营利润超预期，四季度手套价格预计上涨 10-20% ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 上半年表观净利 8.37亿元，经营利润 16.3亿元（ Q1为3.8亿，Q2为12.5亿）， Q2好于市场预期 （11-12 亿）。丁腈手套单支净利 Q2接近7分钱，比同行高 3分钱以上。四季度价格预计上涨 10- 20%以上，主要因原材料回升、马来天然气调价（ +40% ）、下游补库需求及中小产能出清。产能持续 扩张，预计 2028-2029 年达1100亿只，全球市占率 30-40% 。 7.翰宇药业： CDMO 大订单催化临近，多肽制剂增量可期 原研CDMO 大订单已开始新一轮接洽，新一批发货完成后有望落地签单。上半年收入同比高增长，利 润端约 2亿元，核心是上半年签了两个 GLP-1 API订单，三季度将是收入利润释放更快的季度。格拉 替雷（ RTV）终端市场十几至二十亿美金，有望带来大增量。 8.和铂医药：即将港股通，三大估值体系 +多重催化 9月7日正式纳入港股通。核心估值来自 ACBMS 平台合作、分子授权（ TSP、CTFF等）以及洛纳生 物早研服务（ 28年常规收入指引约 10亿元）。下半年催化包括 TSLP更多数据读出（全球进度最快的 超长效制剂）、下一代 BD分子落地及平台合作机会。全年收入指引 2.2-2.4 亿美金，其中洛纳 4000- 5000万美金。 问答整理 Q：科伦博泰 SKB264 海外获批时间的具体判断依据是什么？ 答：默沙东拥有 SKB264 的优先审评券，随着美国上市申请递交，预计获批时间会非常快，一定会 在 2027年获批上市。 2027年开始海外将迎来多个 III期临床达主要终点及申报上市，包括胃癌后线、 EGFR-TKI 耐药后肺癌后线、 HR阳性乳腺癌二线等； 2028年起将有 PD-L1 表达非小细胞肺癌大三期 数据读出。 Q：大森林全年利润增速 20%以上的拆分逻辑是什么？ 答：内生方面，老店同店全年预计 3-4个点增长，叠加降本增效（房租降租、人员薪酬优化、 AI管理 赋能），内生可贡献接近 10个点利润增长。外延方面，全年加盟目标 2000家，叠加并购快速扩张， 合计可实现 20%以上利润增速。 Q：英科医疗四季度手套涨价的确定性如何？ 答：目前公司已基本完成三季度接单，准备接 10月左右订单。四季度价格预期普遍上涨，预计涨幅 在 10%-20% 以上。驱动因素包括：原材料丁二烯从 7月初8900元/吨回升至 1.2万元/吨；马来西亚天 然气10月调价约 40%，当地成本上涨 1-1.5 美金；下游客户低库存补库需求强烈；中小产能出清，供 需格局良好。涨价趋势可能延续到明年。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 Q：英科医疗明年的盈利底部如何判断？ 答：公司口径目前比同行高单支 3分钱以上的丁腈手套盈利能力，底部单支净利在 3分钱以上。明年主 营利润最低底部状态在 25亿以上，叠加四季度涨价延续到明年价格高位，可以往 30亿左右去看。 Q：翰宇药业 CDMO 大订单的确定性如何？ 答：从客户核心需求看，需要质量非常不错且成本有较高要求。翰宇作为国内老牌多肽制造商，有足够 产能和技术支持承接相关订单。目前订单已从对手方海外休假后开始新一轮接洽，预计新一批发货完成 后会有确定性较高的签单事件催化，整体确定性非常高。 Q：和铂医药 TSLP 数据相比已上市产品的优势在哪里？ 答：公司TSLP是全球进度最快的超长效制剂，预期下半年会有更多数据读出。从目前数据来看，相较 于已上市的 TSLP产品，公司数据可能会更好，非常有竞争力。 原文 （输入为电话会转写逐字稿，含口语特征与多发言人汇报，已在上文要点总结与问答整理中结构化呈 现，此处不再重复全文。） ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960", "status": "extracted"}, "post:2026-08-28T22-04:616c8d2a8e18": {"id": "post:2026-08-28T22-04:616c 2026年科技会议上的发言纪要20260828.pdf": {"id": "attachment:files/Lumentum在德意志银行2026年科技会议上的发言纪要20260828.pdf", "kind": "attachment", "title": "Lumentum在德意志银行2026年科技会议上的发言纪要20260828", "source_label": "其他", "excerpt": "富乐德（ 301297.SZ ）2026 年中期投资者交流会纪 要 20260827 要点总结 1.2026 年中期业绩概览与全年指引 ：2026年销售收入目标超过 37亿元，利润 4.5亿元~5亿元（含 富乐华）；五年计划（ 2026-2030 年）目标销售收入翻一番甚至翻两番，净利润做到 30%~40% 。", "content": "富乐德（ 301297.SZ ）2026 年中期投资者交流会纪 要 20260827 要点总结 1.2026 年中期业绩概览与全年指引 ：2026年销售收入目标超过 37亿元，利润 4.5亿元~5亿元（含 富乐华）；五年计划（ 2026-2030 年）目标销售收入翻一番甚至翻两番，净利润做到 30%~40% 。 2.富乐华盈利大幅回升 ：经历 2025年产品价格下降、原材料上涨的困难期后， 2026年市场端（ AMB 放量、 DCB维持全球第一）与内部端（自主载板降本、海外工厂、自动化）共振，盈利大幅回升。 3.AMB 基板历史性超越 DCB：2026年上半年 AMB实现约 4亿元销售，全年有望实现 10亿元以 上，将首次成为富乐华销售额第一大品类； AMB保持27%复合增长。 4.洗净业务结构转型 ：洗净占公司整体业务比例从 2018年95%降至2026年上半年 60%，绝对值仍 快速增长； 2025年洗净收入约 6.96亿元，预计今后 3年至少翻几番。 5.价格策略明确 ：公司不参与价格竞争、不靠降价获取利润，目前产品价格处于提升通道；预计 2026 年下半年市场认知将有根本性改变，价格将更趋合理化。 6.富乐华 2025 年业绩未达成的回应 ：贺贤汉明确表示富乐华本身没有问题，其在全世界功率器件领 域DCB、AMB、DPC及光模块用 DPC均为第一位。 7.DPC/TFC 业务高增长 ：2026年DPC业务增长超过 150% ，为富乐华今后主要增长点； TEC配套 DPC基板国内占有率超过 80%。 8.原材料自研与垂直整合 ：公司在四川工厂建立自主碳化硅基板产能，摆脱对日本少数供应商依赖； 2026年底形成 40万~45万片产能，达国内第一。 9.中长期催化剂明确 ：2026年Q4东台DPC工厂投产、 TFC基板小批量生产； 2027年DBA高速增 长、马来西亚工厂拖累消除、新工厂投产至 15家。 问答整理 Q1：公司的 DPC新工厂给光模块客户提供的陶瓷基板是用在了 EML、CW光源还是硅光芯 片的下方？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 答：公司的 DPC工厂产品在光模块中主要有三方面使用：一是作为 TEC散热基板的配套；二是用于光 源发射部分下方的薄膜电路散热基板；三是氮化铝陶瓷基座。公司主要围绕这三方面材料进行配套和开 发。 Q2：下游晶圆厂扩产推进节奏较快，稼动率处于较高水平，公司半导体洗净业务目前的产能 利用率情况如何？后续产能扩展规划是怎样的？ 答：公司半导体洗净业务目前产能利用率几乎达到满产状态。国内现有 8个工厂， 90%的工厂产能接近 饱和。今年已有 4个工厂扩建，到明年第四季度，公司将在上海、北京、深圳、武汉等半导体核心聚集 区新建规模更大的工厂，以补充产能，同时将制程能力提升至 7纳米、 5纳米、 3纳米。公司与国内头 部设备企业进行全面深度战略合作。产能方面，洗净业务生产企业数量将从目前的 9家增至 2027年底 的15家。业务结构上，洗净业务收入占比由 2018年的95%降至今年上半年的 60%，但绝对收入仍保 持快速增长。增值业务中，陶瓷熔射业务今年增长 100% ，预计明年在此基础上再增长 100% ；波纹 管、真空阀门等零部件业务也将迎来高速增长。高制程（ 7/5/3 纳米）对洗净技术要求更高、附加值更 高，且清洗周期更短，将带来更大业务量。特殊产品洗净业务去年销售收入约 2000万元，今年已突 破 8000万元，预计量产后该业务单独洗净收入可达 2亿元。 2025年洗净业务销售收入为 6.96亿元，预 计未来三年有望翻几番。 Q3：公司半年报披露 DCB基板营收有所下滑， AMB 基板营收基本持平，原因是什么？是否 存在低功率陶瓷基板转向高压陶瓷基板的趋势？高功率 AMB 陶瓷基板是否涉及 AI图形、电 源领域？ 答：DCB基板营收下滑主要受价格下降影响，尽管出货量未下降。下游传统消费电子、家电、工 控 IGBT领域需求疲软，行业去库存压力较大；同时铜、金等原材料价格上涨导致成本攀升。公司主动调 整产品结构，放弃部分低利润产品，聚焦 ZTA增韧氧化铝产品和用于氮化镓快充器件的 DCB产品。目 前公司仍为全球 DCB市场占有率第一，与全球前十大功率器件厂商保持合作，全球最大客户已签订明 年长期供应协议。市场存在由 DCB向AMB转移的趋势， AMB耐电压更高、导热性更好，公司已将重 点转向 AMB。预计今年 AMB销售额将历史性超过 10亿元，成为第一大收入来源。 AMB使用公司自 研碳化硅基板，垂直整合有利于成本控制和盈利提升。 DCB方面，马来西亚新工厂投产爬坡及铜价上 涨对毛利率造成压力，但公司正通过成本下降（马来西亚工厂成本已降 50%，预计年底与内地一 致）、产能整合（将高成本上海产能转移至四川、东台）以及与客户建立铜价挂钩机制等方式改善。 AMB基板占产品成本约 50%，四川基板工厂三季度可达 30万片产能，良率快速提升，成本将大幅下 降。上半年 AMB销售额为 4亿元，全年有望超过 10亿元。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 ¹«ÖÚºÅ£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 Q4：公司前期减持了部分无锡古海德股份，且持有古海德、厦门巨磁股份，公司目前氮化铝 陶瓷基板上游原材料是否有自研自备的计划？ 答：公司除氮化硅瓷片为自研外，其他原材料主要通过国内供应商配套解决。公司投资的厦门巨磁是粉 料供应商，属于间接供应商；无锡古海德等为国内友商。公司目前暂无向其他领域扩展的自研自备计 划，将继续通过国内友商配套实现国产化。国产化是公司坚定推进的方向，从地缘政治和长期供应安全 角度考虑，国产化是必由之路。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960", "status": "extracted"}, "post:2026-08-28T14-51:b0f0bcd7ef01": {"id": "post:2026-08-28T14-51:b0f0bcd7ef01", "kind": "post", "title": "2026-08-28 14:51", "source_label": "帖子正文", "excerpt": "🔥【汇成股份】封测低位优选 #先进封装HITS项目投资超75亿，28年规划CoWoS-L及Interposer产能1-1.2w片月产能。27Q1投产4-5k片月产能27H2出货。", "content": "🔥【汇成股份】封测低位优选 #先进封装HITS项目投资超75亿，28年规划CoWoS-L及Interposer产能1-1.2w片月产能。27Q1投产4-5k片月产能27H2出货。 #存储封测扩产超预期至年底6w片，27年有望并表贡献业绩，下一代FC&VFO垂直扇出封装合封LPDDR和SoC。 #显示材料利润率边际修复。公司26单Q2营收5.48亿元创新高，同环比显著改善。 #主业企稳叠加先进封装放量，27年翻倍空间。下周策略会交流，9月港股反路演强化市场认知，细节/节奏欢迎交流！zsdz#文字观点", "publish_time": "2026-08-28 14:51", "tags": ["文字观点"]}, "post:2026-08-28T17-31:602c6ba3b022": {"id": "post:2026-08-28T17-31:602c6ba3b022", "kind": "post", "title": "2026-08-28 17:31", "source_label": "帖子正文", "excerpt": "【开源电子】珠海冠宇：9月新品密集催化，26Q3业绩逐季改善，27年PE不足10倍！🍎A客户：① iPhone电池未来3-5年将持续升级（软包→常规钢壳→2D异型钢壳→3D异型钢壳）x（叠片电芯↑，掺硅负极↑），#单机价值量将从传统软包电芯的4-5美金持续提升到15-20美金，新CEO硬件工程出身", "content": "【开源电子】珠海冠宇：9月新品密集催化，26Q3业绩逐季改善，27年PE不足10倍！ 🍎A客户：① iPhone电池未来3-5年将持续升级（软包→常规钢壳→2D异型钢壳→3D异型钢壳）x（叠片电芯↑，掺硅负极↑），#单机价值量将从传统软包电芯的4-5美金持续提升到15-20美金，新CEO硬件工程出身，26Q3后将加速电池技术迭代，全系手机采用钢壳电池。② 冠宇21年切入A客户电芯，iPhone电池供应量从23年1000万颗快速增长到25年4000万颗，份额快 工厂大幅砍减亏损订单。 4.出口业务上半年高增但下半年预计回落 上半年出口量 4.62万吨，同比增长 96.9% ；出口金额 8.72亿元，同比增长 32.42% 。出口涵盖铝卷、 型材、线缆、电缆、铝棒、板带、绞线等多品类，但体量较小，在整体销售收入和利润中占比很小。下 半年因中东战争形势缓和、海外缺铝情况缓解，出口订单已明显下降，预计出口量显著低于上半年，但 对业绩影响有限。 5.AI服务器材料与高散热材料取得突破 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 公司已介入 AI服务器材料供应：铝棒端已进入国内最顶级 AI服务器供应商体系，型材端已开始供货 （主要供外观件），铝棒加型材 2026全年预计约大几千吨，加工费及利润水平大幅高于普通铝棒及汽 车型材。自主研发的高散热性铝合金材料在实验中散热性较现有铝合金或锌合金材料大幅提升，判断为 市场上散热性最好的铝合金材料水平，下半年重点推动在液冷等领域大面积铺开，但供应链铺开预计需 半年到一年。 6.机器人业务首次正式披露 2026年半年报首次较正式对外披露机器人业务。结构件产品涵盖机器人本体外壳、灵巧手指间结构 件、电机壳、电机轴、精密法兰、内骨骼等，服务人形机器人、协作机器人、无人机智能制造等多领域 客户，已支持客户从样件验证到小批量批量交付。此前与追觅合作较多，魔法原子（ 2026年上春晚） 也有供货，正加大拓展美加帕西尼、埃斯顿、镇区科技、中科科技等客户。 2027年预计会有较大量增 加。 7.海外项目建设稳步推进 越南项目：铝棒已批量生产，每月约 2000多吨， 2026年预计销售不到 3万吨；型材已获 VinFast 等 当地新能源汽车订单，正争取三星等消费电子龙头订单（已通过部分认证但未大批量供货），受 AI建 设影响越南型材量维持小几千吨量级。沙特红海铝产业链综合项目：截至 2026年6月现场已全面展开 施工作业，土建、厂房建设预计年内完成，关键制约为电力设备建设及通电，预计投产时间维持 2027 年二季度。 8.ODI新规对行业影响较大但公司沙特二期资金安排有回旋余地 国家已全面收紧各行业 ODI审批，原省级发改委审批权限约 3亿美金，现所有 ODI均需上报国家发改 委层面审批，尚未获批的海外项目未来获批难度极大。但新规对已在海外有投资项目、利用项目资金沉 淀进行海外再投资的企业反而有利（不分金额均需告知国家发改委，此前超 3亿美元需备案）。沙特二 期首选使用项目自有现金流滚动投资，预计 2027年项目约有 25万吨间接铝实际产量；二期投资将大 幅低于一期（基础设施已在一期完成）；也可通过港股上市公司（红筹架构）对外投资，比国内企 业 ODI出境更简单。 9.再生铝业务处行业领先水平但使用量低于预期 2026年上半年综合循环利用再生铝 59.3万吨，其中回收再生铝 31.18 万吨、自有产线回用铝 28.12 万吨。再生铝年产能约 170万吨， 2026年原计划使用 140万吨，上半年仅约 60万吨，低于预期主因 铝价较高导致再生铝回收难度大、价格高，叠加再生铝开票影响。单吨可带来约 500—800元毛利增 加，在加工费水平不佳时对基础铝棒产品利润维持起关键作用。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 10.股东回报持续加码 2025年度完成现金分红 3.28亿元，分红比例提升至 50.02% ；2025年回购约 1亿元股票并完成注 销，合计实际分红比例超过 50%。第二期回购计划（ 1—2亿元）截至 2026年7月底累计回 购 2530.15 万股，成交总金额 8996.89 万元。公司判断投资价值被大幅低估，除沙特项目外无大规模资 本开支需求，至少到 2027年未见大额资本开支计划，将尽可能持续和维持高股东回报。 11.沙特项目股权结构存在变数 2025年已签署沙特工业主权基金 PIF与控股股东创新集团的战略合作协议。公司非常希望 PIF参与沙 特红海项目， PIF入股将为项目在沙特当地的运营、能源保障、稳定经营及未来扩建提供极大政府保 障。若 PIF入股，预计入股比例不超过 25%，各方理论上同比例稀释，创新集团持有的沙特红海项目 股权可能有一部分对外转让，但具体比例尚未确定。 12.高端产品加工费溢价显著 最高端铝棒与最基础铝棒相比，加工费可达 10倍以上或更高，盈利能力同步大幅提升，但高端产品量 仍比较少。具体单吨加工费及单吨利润水平为公司核心商业机密，不予披露。 问答整理 Q1：上半年各业务板块利润变化情况如何，铝棒、铝型材、铝杆线缆加工费变动方向是怎样 的？海外项目方面，越南铝型材项目投产和产量指引以及参股的沙特红海铝业项目建设进度如 何？ 答：上半年公司所有产品类型加工费同比均上升，体现在一、二季度财务报表中。原因包括：中东战争 导致海外缺铝，铝棒有出口订单，出口加工费高于国内内销，带动铝棒消费；板带箔作为出口主力产 品，加工情况良好；型材通过结构性调整及下游应用领域调整，加工费显著提升；铝杆线缆受益于国家 电网及新能源电力设施投资加大，加工费同比增长。公司预计下半年趋势可以维持：铝棒出口订单减少 但AI等新应用领域加工费较高；型材下半年为 3C消费电子旺季，有信心；铝杆线缆与电网投资紧密 度高，有信心。越南项目方面，铝棒已批量生产，月产 2000多吨，全年预计销售不到 3万吨；型材在 积极拓展客户，已获得越南当地 VinFast 新能源汽车订单，并积极争取三星等消费电子龙头订单，已通 过认证但未大批量供货；因 AI建设影响芯片、存储涨价，苹果笔电 iPad订单下降，越南型材量维持小 几千吨。沙特项目已进入全面施工阶段，土建、厂房建设预计年内完成，电力工程影响进度，预计投产 时间为明年二季度。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 Q2：公司下半年出口量和利润预期如何，上半年出口的量和利润处于什么水平？ AI服务器相 关业务的体量和利润水平如何展望？ 答：上半年公司各类产品出口合计约 4.6万吨，去年同期约 2.3万吨，同比增长接近翻倍；出口金额 8 亿多元，占公司总销售收入比例较小，因此利润占比也相对较小。下半年由于中东战争形势缓和，海外 缺铝情况缓解，出口订单已明显下降，预计下半年出口量将显著低于上半年，但因出口对公司收入和利 润影响较小，对全年业绩影响不大。 AI服务器业务方面，公司半年报已新增机器人业务并介入 AI服务 器材料供应：铝棒领域供应国内顶级 AI服务器供应商体系，型材端开始供应，主要以外观件为主；全 年铝棒加型材预计大几千吨，加工费和利润水平较普通铝棒及汽车型材有较大提升。公司研发了高散热 性铝合金材料，散热性能较市场同类铝合金或锌合金材料大幅提升，下半年将重点在液冷等领域推广应 用，对公司未来在 AI各领域结构件、零部件应用有信心。 Q3：7月1日ODI新规对电解铝行业及铝企出海的影响如何？公司沙特二期项目是否会受 到 ODI影响？ 答：国家已全面收紧各行业 ODI审批，有色金属行业其他品种龙头企业海外收购金额大幅下降。原省 级发改委对 ODI审批权限约 3亿美金，现窗口指导所有 ODI需上报国家发改委审批，对尚未获得 ODI 审批的海外项目影响较大，未来获批可能性极低。但新管理办法对于已在海外投资的项目利用项目资金 沉淀进行海外再投资，以前超 3亿美元需备案，现在不分金额只需告知国家发改委，对已在海外实现现 金流滚动企业有利。对于创新新材沙特二期项目，公司将首选使用项目自有现金流，预计明年该项目 有 25万吨左右间接铝实际产量，且二期投资将大幅低于一期（一期已完成土地平整、厂房、电力设施 等），若仅建电解铝二期有较大解决余地；同时可尝试通过港股上市公司（红筹架构）投资，理论上比 国内企业 ODI出境更简单。公司不担心沙特二期资金安排。 Q4：公司在 AI智能机架和机器人领域的主要客户和进展如何？ 答：AI智能机架方面，公司不便透露客户名称，但为全球最顶级客户，未来将加大客户拓展力度。机 器人业务方面，公司结构件包括机器人本体外壳、灵巧手指间结构件、电机壳、电机轴、精密法兰、内 骨骼等，专注于高精密机械零部件加工，服务人形机器人、协作机器人、无人机智能制造等领域。目前 公司可支持客户从样件验证到小批量批量交付的连续需求。客户进展方面，此前与追觅合作较多，并供 应了登上春晚的魔法原子；因市场对追觅经营及账期存在担忧，公司加大拓展其他客户，包括美加帕西 尼、埃斯顿、镇区科技、中科科技等。机器人业务目前量较小，预计明年会有较大增加。 Q5：公司全年及未来几年产销预期如何？三季度以来下游需求景气度及高端铝棒铝材加工费 与单吨利润较传统领域差异如何？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 答：公司从去年开始不再给市场产销量预期，原因是公司产量已足够大，追求盈利能力增长而非单纯放 量，会进行结构调整，多做高盈利产品，砍掉亏损订单（如内蒙汽车轻量化工厂已大幅减亏）。三季度 进入3C消费电子型材旺季，景气度与往年一样不错；铝棒板带出口量较一二季度有所减少，但仍维持 全年约 20%增速预期。关于高端铝棒铝材的单吨加工费及盈利情况属于商业机密不便透露，但最高端 铝棒与基础铝棒加工费可能相差 10倍以上，盈利能力有大幅提升，不过高端产品量较少。 Q6：铝杆线缆订单的可持续性如何？型材毛利率提升至 20.12% 的主要原因是什么？再生铝的 新旧废铝比例及对毛利率的帮助？公司在股东回报方面有何后续规划？ 答：铝杆线缆销量增长源于去年扩产并延伸下游线缆产品，部分产品出口，公司对全年维持 20%销量 预期有信心。型材毛利率提升至 20.12% （原为 10%大几），主要由于：一是供应结构变化，笔记本 和 iPad订单同比减少约 30%，而手机主力机型 iPhone 17ProMax供货占比提高且该机型热销，手机毛 利率高于笔记本；二是汽车型材减亏，内蒙工厂砍掉亏损订单。再生铝方面，年产能 170万吨，上半 年实际使用约 60万吨，其中回收废铝占 55%，自有产线回用占 45%，因铝价高及再生铝回收难度 大、价格高，使用量低于预期；但再生铝单吨可带来 500-800 元毛利增加，在加工费不佳时对基础铝 棒利润维持起关键作用。股东回报方面，去年完成回购约 1亿元并注销，现金分红 3亿多元，合计分红 比例超过 50%；今年 5月通过 1-2亿元回购计划，目前已回购近 9000万元。公司认为投资价值被低 估，无大规模资本开支需求（沙特项目资本金已全部出境），实控人崔立新对回报市场投资人持积极开 放态度，兄弟公司创新实业去年分红比例亦超过 50%，公司将向其看齐，未来会尽可能维持高股东回 报，上半年经营性现金流大幅改善提供支持。 Q7：沙特项目的股权比例会有变化吗？ 答：去年沙特工业主权基金 PIF与控股股东创新集团签署战略合作，公司非常希望 PIF参与沙特红海项 目，以带来政府保障。若 PIF入股，预计入股比例不超过 25%，现有股东将同比例稀释，创新集团持 有的股权可能部分对外转让，但具体比例尚未确定。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960", "status": "extracted"}, "post:2026-08-28T13-49:2f3b452ecf0c": {"id": "post:2026-08-28T13-49:2f3b452ecf0c", "kind": "post", "title": "2026-08-28 13:49", "source_label": "帖子正文", "excerpt": "【松下因铜箔和玻璃纤维成本上涨上调覆铜板（CCL）价格。】#文字观点", "content": "【松下因铜箔和玻璃纤维成本上涨上调覆铜板（CCL）价格。】#文字观点", "publish_time": "2026-08-28 13:49", "tags": ["文字观点"]}, "post:2026-08-28T20-21:f77e9c493583": {"id": "post:2026-08-28T20-21:f77e9c493583", "kind": "post", "title": "2026-08-28 20:21", "source_label": "帖子正文", "excerpt": "【粤芯半导体已取得IPO注册批文 预计最早2029年实现整体盈利】财联社8月28日电，记者获悉，创业板注册制首家晶圆制造企业粤芯半导体IPO进程稳步推进，已于本周五取得IPO注册批文。粤芯半导体由广发证券保荐，从受理到获得获得注册批文共8个多月。", "content": "【粤芯半导体已取得IPO注册批文 预计最早2029年实现整体盈利】财联社8月28日电，记者获悉，创业板注册制首家晶圆制造企业粤芯半导体IPO进程稳步推进，已于本周五取得IPO注册批文。粤芯半导体由广发证券保荐，从受理到获得获得注册批文共8个多月。该企业是我国首家实现12英寸硅光晶圆大规模量产的企业，目前硅光工艺平台已累计投片超3500片，产品涵盖400G、800G、1.6T高速硅可插拔光模块应用，与国际领先水平相当。据粤芯半导体披露，截至2026年5月末，公司在手订单32.12万片，对应金额15.33亿元；2026年一季度晶圆代工出货18.05万片，同比增长62.20%。随着产能释放、良率优化与技术成果转化提速，公司预计最早2029年实现整体盈利。 （财联社记者 赵昕睿）(来自财联社APP) 粤芯半导体概念股汇总", "publish_time": "2026-08-28 20:21", "tags": []}, "post:2026-08-28T20-24:ead503dcf248": {"id": "post:2026-08-28T20-24:ead503dcf248", "kind": "post", "title": "2026-08-28 20:24", "source_label": "帖子正文", "excerpt": "【光模块行业】集成度逐步提升重构光模块价值链 光模块：封装集成度提升，增量利润将向性能瓶颈环节迁移。光模块整体演变核心趋势围绕带宽提升持续推进封装扩容、架构集成和接口高密度。", "content": "【光模块行业】集成度逐步提升重构光模块价值链 光模块：封装集成度提升，增量利润将向性能瓶颈环节迁移。光模块整体演变核心趋势围绕带宽提升持续推进封装扩容、架构集成和接口高密度。头部厂商已在关键场景导入LPO技术，CPO处于验证和规划阶段。利润集中于头部光模块厂商，关键在于技术优势和海外客户导入。技术演进将推动利润重分配，增量利润优先向上游光芯片等接近性能瓶颈的环节迁移。 光芯片：硅光和CPO推动高功率CW激光器需求和探测器集成化。激光器芯片： EML和CW为主，硅光渗透率提升推动CW需求。EML激光器芯片作为成熟方案，广泛应用于400G及以上光互连产品，硅光方案成为高速迭代主流方向，需配套大功率CW激光器芯片，在高速光互连产品中渗透率持续走高。探测器芯片中PIN主要用于中长距离传输，APD用于长距离传输。无源光芯片需求持续提升，供给集中于美日厂商。 电芯片：趋于集成，技术演进推动价值量分化。CPO架构推动电信号处理功能集成化，压缩独立电芯片需求，和系统级芯片厂商合作能力是电芯片厂商发展的关键。全球光模块电芯片市场由ADI和TI等海外企业主导，25G及以下DSP产品国产化率高，高端PAM4 DSP市场呈现博通、Marvell双寡头格局。光调制器驱动芯片市场可分为铌酸锂（LiNbO3）调制器驱动芯片、硅光调制器驱动芯片、InP调制器驱动芯片等，铌酸锂调制器驱动芯片占比高，硅光调制器驱动芯片占比快速提升。 光模块PCB加速从传统高多层板向mSAP工艺板过渡。mSAP工艺能够在极小尺寸内实现更高密度线路布局，是支撑下一代高速光模块信号完整性的关键技术路线，具备mSAP工艺量产能力与头部客户认证的厂商有望迎来订单放量与产品结构优化的双重驱动。 投资建议：1）关注超高速光模块需求驱动市场规模提升；2）关注技术升级与集成化趋势；3）关注高端PCB与核心器件。 风险提示：1）技术路径误判风险；2）下游需求不及预期风险；3）国际贸易摩擦风险。 —————— 完整报告详见2026年8月28日发布的《光模块行业深度报告：集成度逐步提升重构光模块价值链》光模块行业深度报告：集成度逐步提升重构光模块价值链#文字观点", "publish_time": "2026-08-28 20:24", "tags": ["文字观点"]}, "post:2026-08-28T21-46:a4e99d8f7c07": {"id": "post:2026-08-28T21-46:a4e99d8f7c07", "kind": "post", "title": "2026-08-28 21:46", "source_label": "帖子正文", "excerpt": "【华创电子】#三环集团：MLCCQ2量端率先兑现，Q3价格与结构有望接棒，新业务打开长期空间 2026H1公司实现营收64.23亿元，同比+54.82%，归母净利润19.32亿元，同比+56.18%，扣非归母净利润18.09亿元，同比+69.66%。Q2实现营收37.42亿元、同比+61.61%，环", "content": "【华创电子】#三环集团：MLCCQ2量端率先兑现，Q3价格与结构有望接棒，新业务打开长期空间 2026H1公司实现营收64.23亿元，同比+54.82%，归母净利润19.32亿元，同比+56.18%，扣非归母净利润18.09亿元，同比+69.66%。 Q2实现营收37.42亿元、同比+61.61%，环比+39.59%；归母净利润11.41亿元，同比+61.99%，环比+44.29%。 #Q2利润增长的核心是MLCC放量、涨价尚未充分进入报表。Q2公司MLCC销量及销售额同比大幅增长，部分规格价格修复至原有合理价值。结合产业跟踪，我们拆解Q2 MLCC收入约15亿元、环比增加约5亿元，增量主要来自高容产品放量及新增有效产能释放。Q2公司整体毛利率约44.91%，同比提升2.18pct、环比提升1.43pct，扣非利润环比增长超过50%，说明稼动率提升与产品结构改善已开始释放经营杠杆。 #Q3以后、MLCC驱动力有望由“量增”进一步转向“量价结构共振”。据产业跟踪，公司6—7月已针对部分经销及直销料号进行价格调整，由于渠道价格通常先于直销客户、实际ASP又滞后于报价变化，相关价格贡献在Q2体现相对有限，后续仍需观察向直销客户的传导效果。与此同时，行业紧缺主要集中于高容、高规格产品，并非所有MLCC全面短缺；高容产品层数更多、生产周期更长、单位产能消耗更高，因此产品结构升级不仅抬升ASP，也会提高单位有效产能对应的收入和利润。 #光通信与SOFC提供第二、第三增长曲线。全球数据中心建设加快带动插芯、套筒需求增长，MT插芯受益800G/1.6T光模块向多芯、高密度连接升级，据产业跟踪，其新规格单价已较25年单价接近翻倍，毛利率亦有望由约40%提升至60%左右；叠加出货放量，成为MLCC之外最明确的利润增量。SOFC方面，产业跟踪显示公司向BE供应的隔膜片出货持续增长，直接受益BE数据中心项目扩张；公司自有电堆及系统项目则提供更长期弹性。核心判断：Q2已经验证高容MLCC需求能够消化新增产能，且毛利率、扣非利润率与现金流同步改善；但本轮价格传导和高容化红利尚未在报表中充分兑现。#后续胜负手是三点：一是调价转化为实际ASP，二是高容产品占比及有效产能持续提升，三是MT插芯、SOFC等新业务从产品验证走向规模收入。公司有望由Q2的“量增”逐步迈向Q3以后的“量、价、结构共振”，继续重点推荐！#文字观点", "publish_time": "2026-08-28 21:46", "tags": ["三环集团", "MLCC", "文字观点"]}, "post:2026-08-28T21-47:24bfb61b77ae": {"id": "post:2026-08-28T21-47:24bfb61b77ae", "kind": "post", "title": "2026-08-28 21:47", "source_label": "帖子正文", "excerpt": "【长江通信】源杰科技26中报点评 26Q2营收5.70e，同比+372.7%、环比+60.4%；归母净利润4.28e，同比+1238.7%、环比+138.3%", "content": "【长江通信】源杰科技26中报点评 26Q2营收5.70e，同比+372.7%、环比+60.4%；归母净利润4.28e，同比+1238.7%、环比+138.3%；扣非归母净利润3.37e，同比+971.5%、环比+89.1%；非经损益约0.91e，主要来自投资收益。#Q2毛利率82.1%，环比+4.3pct；归母净利率75.0%，环比+24.5pct，#量利齐升持续兑现。 26H1数据中心类产品收入7.74e，同比+640.3%，毛利率约84%；70/100mW CW大批量交付，100mW 出货占比提升，新增供给短期仍较紧张；100G EML#26H2有望加速交付，200GEML推进客户验证；#120/130/300/400mWCW均已开展客户技术对接和验证，持续受益硅光及NPO/CPO升级。 Q2购建固定资产、无形资产及其他长期资产支付现金约3.63e。#公司已提前规划远期设备及产能需求，最新拟投资42.68亿元建设半导体科技产业园、聚焦高端芯片扩产，叠加一、二期及海外产能，#有望强化规模交付优势。 AI算力持续推动光互连向硅光及NPO/CPO升级，公司依托IDM能力、DFB技术积累及头部客户资源，CW高增长持续兑现、EML加速放量，继续看好AI光通信上游核心光芯片龙头成长弹性！#文字观点", "publish_time": "2026-08-28 21:47", "tags": ["26H2有望加速交付", "200G", "400mW", "文字观点"]}, "post:2026-08-28T20-22:c7be96c1e037": {"id": "post:2026-08-28T20-22:c7be96c1e037", "kind": "post", "title": "2026-08-28 20:22", "source_label": "帖子正文", "excerpt": "【中泰电子|长鑫科技】Q2业绩大超预期，国产DRAM龙头深度受益涨价大周期！", "content": "【中泰电子|长鑫科技】Q2业绩大超预期，国产DRAM龙头深度受益涨价大周期！Q2实现【营收】995.10亿元，yoy+977%，qoq+96%；【净利润】745.38亿元，同比扭亏758亿元，qoq+126%；【归母】528.43亿元，同比扭亏534亿元，qoq+113%；【毛利率】87.6%，yoy+75pcts，qoq+8pcts；【净利率】74.9%，yoy+89pcts，qoq+10pcts。 👉Q2净利润、归母均超出IPO披露的数值，分别为329.9~419.9亿元、252.4~322.4亿元。 👉26H1实现【营收】1503.1亿元，yoy+874%；【净利润】1075.5亿元，同比扭亏1116亿元；【归母】776.1亿元，同比扭亏799亿元。长鑫是国内最大、全球第四大DRAM原厂，AI驱动DRAM需求爆发，行业供需紧张，长鑫报价基本与海外大厂持平且企业级占比持续提升，价格有望持续上行，业绩增长高弹性！#文字观点", "publish_time": "2026-08-28 20:22", "tags": ["文字观点"]}, "post:2026-08-28T21-46:7b97c1546d98": {"id": "post:2026-08-28T21-46:7b97c1546d98", "kind": "post", "title": "2026-08-28 21:46", "source_label": "帖子正文", "excerpt": "【兴证电子】长鑫科技26H1业绩点评：Q2业绩超预期，持续受益存储超级周期Q2业绩超预期，利润大幅增长。", "content": "【兴证电子】长鑫科技26H1业绩点评：Q2业绩超预期，持续受益存储超级周期Q2业绩超预期，利润大幅增长。26Q2实现营收995.10亿元，yoy+977%，qoq+96%；净利润745.38亿元，同比扭亏，qoq+126%；归母净利润528.43亿元，同比扭亏，qoq+113%；毛利率87.6%，yoy+75pcts，qoq+8pcts，净利率74.9%，yoy+89pcts，qoq+10pcts。26H1营收1503.1亿元，yoy+874%；净利润1075.5亿元，同比扭亏；归母净利润776.1亿元，同比扭亏。长鑫是中国第一、全球第四的DRAM厂商。公司采取“跳代研发”的策略，完成了从第一代工艺技术平台到第四代工艺技术平台的量产，以及DDR4、LPDDR4X到DDR5、LPDDR5/5X等产品覆盖和迭代升级，目前公司核心产品及工艺技术已达到国际先进水平。根据Omdia按出货量统计，长鑫科技已成为中国第一、全球第四的DRAM厂商。DRAM供需紧张，价格持续上涨。供给侧来看，DRAM产能扩张面临多重制约，海外各大存储原厂加大Capex投入，但受制于技术升级及扩产周期，产能扩张幅度以及无尘室空间有限，预计供需紧张有望持续到2027H2之后。需求侧来看，随着AI训练和推理对算力需求的快速增长，数据中心对HBM、DDR5存储需求高速增长。价格端来看，经历了26H1价格大幅上涨，预计26H2价格仍将保持上涨趋势。长鑫作为国内DRAM存储龙头公司，深度受益此次存储涨价周期，通过产能加速扩张和产品持续迭代，有望实现份额进一步提升。#文字观点", "publish_time": "2026-08-28 21:46", "tags": ["文字观点"]}, "post:2026-08-28T20-20:de6c576e7c68": {"id": "post:2026-08-28T20-20:de6c576e7c68", "kind": "post", "title": "2026-08-28 20:20", "source_label": "帖子正文", "excerpt": "长鑫科技业绩太炸裂了，Q1净利润247.62亿，Q2净利润528.43亿，上半年净利高达776.05亿！", "content": "长鑫科技业绩太炸裂了，Q1净利润247.62亿，Q2净利润528.43亿，上半年净利高达776.05亿！远高于之前公司预测的500亿元至570亿，多出200多亿。 可见存储芯片多么暴利，怪不得老美看着韩国三星、SK海力士赚钱眼红！贩D都没这么赚钱。 按照长鑫这个业绩，今年能赚小2000亿，现在市值4万亿，20倍的PE。虽然比美光、SK海力士、三星的10倍、5倍要贵一些！但在A股是“王者”的存在，对比来看，中际旭创同期净利润136.5亿元、寒武纪23.11亿元，中芯国际44.67亿元！ 哪怕对比A股最赚钱的公司，上半年茅台赚445亿，中国移动789亿，宇宙行1736亿。长鑫存储也不落下风，包括马上上市的长江存储，今年干1500净利润是比较稳的！A股30年历史上，第一次有科技股这么赚钱的，而且是2家。 所以，长鑫科技4万亿贵吗？爱股君觉得估值还有拉升空间。但A股存储板块会不会涨，这个有点不好说！有了两大印钞机小甜甜，其它存储股可能就是牛夫人了。（爱股君）#文字观点", "publish_time": "2026-08-28 20:20", "tags": ["文字观点"]}, "post:2026-08-28T17-33:be7792ba0e61": {"id": "post:2026-08-28T17-33:be7792ba0e61", "kind": "post", "title": "2026-08-28 17:33", "source_label": "帖子正文", "excerpt": "【源杰科技：2026年上半年净利润6.07亿元，同比增长1,212.20%】源杰科技公告，2026年上半年营业收入9.25亿元，同比增长351.40%", "content": "【源杰科技：2026年上半年净利润6.07亿元，同比增长1,212.20%】源杰科技公告，2026年上半年营业收入9.25亿元，同比增长351.40%；归属于上市公司股东的 i>今天出现的催化/验证：长鑫科技26H1业绩发布，归母净利润776亿元、同增3428%；兴证电子点评称“Q2业绩超预期，持续受益存储超级周期”；另有点评称“利润翻了十倍，股价守住了昨日涨幅”。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>主线：AI算力硬件产业链进入Vera Rubin量产兑现周期\u003c/li>\n\u003cli>今天强化的逻辑：中证鹏元报告认为2026年三季度为AI算力硬件关键产业拐点，产业链以英伟达Vera Rubin；行业发展逻辑完成阶段性切换。\u003c/li>\n\u003cli>今天出现的催化/验证：NV业绩超预期后，Vera Rubin出货放量成为材料、PCB、光模块等环节的共同需求假设；AI材料观点明确提出“M8/M9新。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>主线：资金高低切换，算力回吐、风格切向农业化工\u003c/li>\n\u003cli>今天强化的逻辑：8月27日被英伟达财报单向买进半导体的资金今日反向撤出，成交额前十仍被算力名字占据但方向反转；上证基本走平、涨停82家，盘面更像获利回吐加风格再平衡，而非算力逻辑破位。\u003c/li>\n\u003cli>今天出现的催化/验证：氮肥、种子、煤化工领涨，泸天化（氮肥涨停）、华鲁恒升（煤化工龙头，成交13.6亿元）等承接切换资金；策略周谈指出市场处于再平衡阶段而非科技退潮，金融、资源、医药和小微盘共同拓宽市场宽度。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>主线：AI材料从“涨价”转向“升级+放量”，聚焦细分龙头\u003c/li>\n\u003cli>今天强化的逻辑：M7→M8/M9升级带来布里面LDK2需求放量，且LDK2为最难生产环节（良率难提升），缺口确定；载体铜箔受益mSAP快速扩产（方邦股份），光模块mSAP关注博敏电子（年底1kk产能、与华工等客户深度绑定）。\u003c/li>\n\u003cli>今天出现的催化/验证：中泰建材提出“这一波主线或许是升级”；zx新材料梳理光通信上游材料弹性环节（磷化铟——海川智能、薄膜铌酸锂——共达电声）；玻璃基板报告指出2027-2028年为小批量商用关键节点，传统CoWoS在成本与良率上瓶颈凸显。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>主线：AI基础设施向专用网络体系与异构计算演进，供电散热成核心瓶颈\u003c/li>\n\u003cli>今天强化的逻辑：HotChips大会揭示AI工厂告别单一通用架构，向五大专用网络体系全面转型；热管理与电力供应成为决定AI性能的关键瓶颈，液冷技术正成为标配（Google TPU8t托盘水冷光模块等）。\u003c/li>\n\u003cli>今天出现的催化/验证：麦格米特电话会议提及800V产品已完成开发、正在送样，起量速度偏慢，预计明年年中产品才会丰富；科翔股份子公司广州陶积电专注AlN先进陶瓷基板，卡位AI服务器高功率IGBT散热。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>主线：机器人产业政策定调“因地制宜、健康有序发展”，强调真实业绩兑现\u003c/li>\n\u003cli>今天强化的逻辑：发改委在8月份例行发布会上表示机器人产业必须因地制宜，防止盲目跟风、一哄而上；市场关注点转向公告级别的量价兑现。\u003c/li>\n\u003cli>今天出现的催化/验证：胜通能源/七腾相关公告显示26年出货量达1万台以上、27-28年出货量较26年增长300%，轮式租赁2万元/月、轮足租赁5万元/月，被解读为“敢把量价摆出来”；万联证券跟踪报告提及2026世界机器人大会在京开幕、小鹏机器人业务完成首轮超9亿美元融资。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>长鑫科技发布2026年中报并大超预期：营收1503亿元（同增874%）、净利润1076亿元（同增2731%）、归母净利润776亿元（同增3428%）；Q1归母净利润247.62亿元、Q2归母净利润528.43亿元。\u003c/li>\n\u003cli>市场风格快速切换：算力（芯片、光模块、PCB）集体回吐，成交额前十仍被昨日领涨算力名字占据但方向反转；资金涌入农业、化工、地产链与消费，氮肥、种子、煤化工领涨。\u003c/li>\n\u003cli>存储供给端多重信号：SK海力士CEO称HBM短缺或将延续至2030年底；SK海力士176层NAND等旧制程产能占比仍超一半，代际转换落后于三星电子；Kioxia/Sandisk计划截至2032年在日本累计投资约5万亿日元用于3D NAND扩产。\u003c/li>\n\u003cli>松下因原材料及物流能源成本上涨，自9月1日出货起上调多款PCB材料价格，部分品类最高提价30%；另有消息称松下因铜箔和玻璃纤维成本上涨上调覆铜板（CCL）价格。\u003c/li>\n\u003cli>特朗普政府设立新AI监管机构的行政令草案陷入停滞，戴维·萨克斯反对仿照FINRA设立独立AI监管机构。\u003c/li>\n\u003cli>粤芯半导体取得IPO注册批文，为创业板注册制首家晶圆制造企业，从受理到获得注册批文共8个多月；其硅光工艺。\u003c/li>\n\u003cli>发改委明确机器人产业发展要因地制宜、健康有序，防止盲目跟风、一哄而上。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>存储涨价周期持续性：长鑫科技产能扩张计划（2026年30万片/月，2031年80万片/月）与出口管制下ASML DUV光刻设备瓶颈是否制约供给；HBM占先进DRAM晶圆消耗比重从2023年约6%升至2028年预计34%的路径验证。\u003c/li>\n\u003cli>AI算力硬件拐点兑现节奏：Vera Rubin。\u003c/li>\n\u003cli>AI材料“升级”逻辑落地进度：LDK2放量与良率爬坡情况，方邦股份、博敏电子等载体铜箔与光模块mSAP环节的下游验证进度。\u003c/li>\n\u003cli>风格切换的持续性：资金从算力向农业、化工、地产链的切换是短期获利回吐还是中期再平衡；创业板下周是否再度考验年线支撑（沪指跌0.11%、深证成指跌0.68%、创业板指跌1.41%、科创50跌1.85%）。\u003c/li>\n\u003cli>政策面：特朗普政府AI监管行政令后续走向；美国中期选举前瞻（中信建投报告）；机器人产业因地制宜政策对主题情绪的影响。\u003c/li>\n\u003cli>海外映射：SK海力士股东回报框架调整（“最高50%”改为“超过50%”自由现金流返还）及4万亿韩元回购计划；Lumentum在德意志银行科技会议上的发言；伯恩斯坦对EUV光罩基板市场2025-2028年CAGR加速的预测。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>08:17｜📌长鑫存储产能与 HBM🏭CXMT 将于 2025 年将产能从 180k wpm 扩展至 2026 年的 300k wpm，随后每年增加约 100k wpm 的产能，到 2031 年达到 800k wpm。🔍供应链检查表明，在出口管制下，ASML 的 DUV 光刻设备可能是主要设备瓶颈。\u003c/li>\n\u003cli>08:17｜📌Marvell 的电话会议❓问：您在 CXL 和扩展光学方面看到了哪些进展？💬答：CXL 最初作为一种以服务器为中心的内存架构开始，但最终证明它非常适合内存扩展和推理。\u003c/li>\n\u003cli>08:17｜🤖GB200 对比 GB300 对比 VR200 零部件对比\u003c/li>\n\u003cli>08:18｜📰SK 海力士，旧型 NAND 闪存设备生产效率成难题……“降低 176 层占比是关键”💡SK 海力士的 NAND 闪存业务在旧产线代际转换速度上落后于三星电子等竞争对手，导致生产效率差距难以缩小。截至今年第二季度，SK 海力士的 176 层 NAND 等旧制程产能占比仍超过一半，而三星电子已完成向 236 层主力代际的转换。\u003c/li>\n\u003cli>08:18｜📰特朗普政府设立新 AI 监管机构的行政令陷入停滞💡仿照 FINRA 设立独立 AI 监管机构的想法，遭到前白宫 AI 与加密货币事务负责人戴维・萨克斯的反对。💡据两位看过草案的人士透露，特朗普政府最近几周在内部传阅了一份行政命令草案，呼吁为生产最先进模型的人工智能公司建立一个自律组织。\u003c/li>\n\u003cli>08:19｜📌瑞银 ——SK 海力士（000660）：2026 年瑞银韩国峰会要点纪要 —— 股东回报释放积极信号📑一、股东回报政策：明确 \"50% 自由现金流返还\" 为底线，股票回购计划落地 📝上周公司宣布 4 万亿韩元股票回购计划，该计划属于整体 \"超 50% 自由现金流（FCF）返还\" 框架的一部分。🔔此前 \"最高 50%\" 的表述调整为 \"超过 50%\"，意味着 2025‑2027 年期间 50% 是最低返还底线，而非上限。\u003c/li>\n\u003cli>08:19｜📌大摩 —— 中国存储 —— 重塑全球竞争格局📜历史视角：存储领导权的更迭📚存储行业的领导权历来随 “规模 + 竞争基础改变” 而转移：1970‑80 年代早期美国凭借技术创新领先；1980 年代日本以高质量、高良率制造超越美国\u003c/li>\n\u003cli>08:19｜📌Meta 将矛头对准 Anthropic，但它也是其最大客户之一💬Meta 首席执行官马克・扎克伯格最近将矛头对准了竞争对手 Anthropic。📝扎克伯格没有点名这家人工智能初创公司或其首席执行官达里奥・阿莫代，但他表示，领先的 AI 实验室试图巩固权力，同时将未来描绘成 “充满末日”。\u003c/li>\n\u003cli>08:20｜📌Marvell 对一份积极报告的 AH 反应令人失望，似乎他们的定制芯片收入不如预期强劲。我认为 Alchip 正在阻碍他们，正如 MS 关于 ASIC 的报告所强调的那样。\u003c/li>\n\u003cli>08:20｜📌SOFTWARE（软件板块）📈OKTA 大涨 29%，多头看好其在尚无显著 AI 营收的情况下再次实现季度加速（尽管代理式 AI 也在扩大传统迁移的漏斗）。其增长势头在大型公司、两大身份。\u003c/li>\n\u003cli>08:20｜📌OpenAI 的芯片是一个工程样品💬英伟达仍然相信 OpenAI 仍将从英伟达大量订购，因为 OpenAI 可能面临的生产量提升问题 —— 他说这是他听到的关于 OpenAI 的相同情况。❌不同意 Jalapeño 运行得比 Blackwell 更好的说法，因为很多测试省略了代理式 AI 基准测试，还好奇为什么他们没有将其与 Vera Rubin 进行测试。\u003c/li>\n\u003cli>08:21｜转：从煤老板到运动员再到科技新贵，只有景甜跟上时代，踩准每一个风口。而你，我的朋友，还停留在过去不可自拔。\u003c/li>\n\u003c/ul>\n\u003ch3>附件正文\u003c/h3>\n\u003cul>\n\u003cli>AIGC的历史观：从“内容为王”到“供给回归”电话会纪要20260827｜AIGC 的历史观：从 “内容为王 ”到“供给回归 ”电话会纪 要 20260827 要点总结 1.核心观点转变：从 “内容为王 ”到“分发与供给回归 ” 互联网 /移动互联网时代强调 “内容为王 ”，但进入 AIGC 时代后， “分发”变得至关重要。报告指 出，版权分发业态在 AI时代的商业模式优势比互联网时代更为明显，现实案例也在印证这一趋势。\u003c/li>\n\u003cli>A股与港股复盘20260828｜A股与港股复盘 2026年8月28日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 算力回吐，风格切向农业化工 2026年8月28日 · 沪深15:00 / 港股16:08 主线 8 月 28 日的主线是资金的高低切换。8 月 27 日被英伟达财报单向买进半导体的资金，今天反向撤出，涌入农业、化工、地产链与消费——氮肥、种子、煤化工领涨，基础化工板块主力净流入约 267 亿元，运动服装、房产租赁经纪同步走强，涨停板也\u003c/li>\n\u003cli>Lumentum在德意志银行2026年科技会议上的发言纪要20260828｜富乐德（ 301297.SZ ）2026 年中期投资者交流会纪 要 20260827 要点总结 1.2026 年中期业绩概览与全年指引 ：2026年销售收入目标超过 37亿元，利润 4.5亿元~5亿元（含 富乐华）；五年计划（ 2026-2030 年）目标销售收入翻一番甚至翻两番，净利润做到 30%~40% 。\u003c/li>\n\u003cli>Okta、CRM、CRWD 等企业软件个股业绩与市场动态｜QQ：1490929960\u003c/li>\n\u003cli>万联证券-人形机器人行业跟踪报告：2026世界机器人大会在京开幕，小鹏机器人业务完成首轮超9亿美元融资-260826｜中证鹏元资信评估股份有限公司 研究发展部 翁欣 wengx@cspengyuan.com 主要内容： 2026年三季度将成为AI算力硬件关键产业拐点，标志着全球AI算力产业链正式迈 入以英伟达VeraRubin。我们持续坚定看好下半年AI算 力硬件产业链高景气行情，行业发展逻辑已完成阶段性切换，从上半年的政策与技术 预期博弈，全面转 document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
