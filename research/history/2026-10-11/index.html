]}, "post:2026-10-11T14-07:fe793296627c": {"id": "post:2026-10-11T14-07:fe793296627c", "kind": "post", "title": "2026-10-11 14:07", "source_label": "帖子正文", "excerpt": "英伟达洽谈收购美国 “开放” 模型初创公司 Reflection AI 据直接知情人士透露，英伟达正在洽谈收购美国初创公司 Reflection AI，或加深对其投资。Reflection AI 是一家开放权重模型开发商，唐纳德・特朗普总统的政府希望这类模型能够与中国的廉价替代品竞争。", "content": "", "publish_time": "2026-10-11 14:07", "tags": ["文字观点"]}, "post:2026-10-11T17-33:f080f03f4672": {"id": "post:2026-10-11T17-33:f080f03f4672", "kind": "post", "title": "2026-10-11 17:33", "source_label": "帖子正文", "excerpt": "【计算机周报】大模型ARR讨论 海外ARR引发市场讨论 近期OpenAIARR差异引发市场讨论（Axios700亿美元、FT500亿美元） 差异来自是否包含云渠道分成。500亿为净营收口径，需扣除分给微软的20%收益、亚马逊Bedrock渠道分成。", "content": "", "publish_time": "2026-10-11 17:33", "tags": ["文字观点"]}, "attachment:files/Evercore ISI-中国销售调查：9月末走弱.pdf": {"id": "attachment:files/Evercore ISI-中国销售调查：9月末走弱.pdf", "kind": "attachment", "title": "Evercore ISI-中国销售调查：9月末走弱", "source_label": "Evercore ISI", "excerpt": "7T2se3r0Ot6kwoPa 7T2se3r0Ot6kwoPa Deutsche Bank Research Deutsche Bank AG/Hong Kong IMPORTANT RESEARCH DISCLOSURES AND ANALYST CERTIFICATIONS LOCATED IN APPENDIX 1. Deutsche Bank d", "content": "", "status": "extracted"}, "attachment:files/德意志银行-中国汽车与汽车科技：专家电话会-孙少军.pdf": {"id": "attachment:files/德意志银行-中国汽车与汽车科技：专家电话会-孙少军.pdf", "kind": "attachment", "title": "德意志银行-中国汽车与汽车科技：专家电话会-孙少军", "source_label": "德意志银行", "excerpt": "7T2se3r0Ot6kwoPa 7T2se3r0Ot6kwoPa Deutsche Bank Research Deutsche Bank AG/Hong Kong IMPORTANT RESEARCH DISCLOSURES AND ANALYST CERTIFICATIONS LOCATED IN APPENDIX 1. Deutsche Bank d", "content": "", "status": "extracted"}, "post:2026-10-11T09-04:0bf3048d38b9": {"id": "post:2026-10-11T09-04:0bf3048d38b9", "kind": "post", "title": "2026-10-11 09:04", "source_label": "帖子正文", "excerpt": "美银——全球存储科技：三星三季度业绩、全球预测更新与“降规”影响 核心观点：超级周期确认，NAND ASP上修，降规实为增长催化剂 三星电子业绩：盈利印证存储超级周期 三星电子（SEC）初步披露三季度营业利润（OP）达107万亿韩元，基本符合本行与市场预期，进一步确认存储超级周期。分析显示：DRAM", "content": "", "publish_time": "2026-10-11 09:04", "tags": ["文字观点"]}, "post:202 TIA。（Astera Labs） # HPE发布PCIe 6.0八卡GPU服务器，支持新一代AMD EPYC与MRDIMM ▪10月7日讯，HPE发布HPE ProLiant DL585a Gen13，支持最多八块双宽 PCIe GPU，PCIe Gen6连接。（HPE） 🔥模型/应用 # 谷歌Gemini4.0 Carbon上线测试 ▪10月10日讯，谷歌正测试Gemini 4.0新版本模型Carbon。其披露模型性能主要逼近 Opus 5.5，主要通过RSI的训练手段进行提升，即在完成任务的过程中自己发现错误并生成更优解决方案的思考方式。（新智元） # 腾讯WorkBuddy上线“独立文件浏览器” ▪10月8日讯，腾讯WorkBuddy上线“独立文件浏览器”，面向本地文件提供独立查看和编辑窗口，其只会读取用户主动打开或添加的文件，不会遍历或扫描电脑磁盘，更加具备AI安全性。（腾讯） # 豆包工作新增画布功能、支持图片模型Seedream 5.0 Flash ▪10月9日讯，豆包工作上线无限画布功能，相当于一块没有边界的虚拟工作面板。通过接入字节图片模型Seedream 5.0 Flash，便于做策划方案、思维导图、电商素材排版。（新快报） ☎详询：国海计算机刘熹/朱谞晟/唐锦珂/谢婧茹#文字观点", "publish_time": "2026-10-11 17:28", "tags": ["文字观点"]}, "post:2026-10-11T14-07:fe793296627c": {"id": "post:2026-10-11T14-07:fe793296627c", "kind": "post", "title": "2026-10-11 14:07", "source_label": "帖子正文", "excerpt": "英伟达洽谈收购美国 “开放” 模型初创公司 Reflection AI 据直接知情人士透露，英伟达正在洽谈收购美国初创公司 Reflection AI，或加深对其投资。Reflection AI 是一家开放权重模型开发商，唐纳德・特朗普总统的政府希望这类模型能够与中国的廉价替代品竞争。", "content": "英伟达洽谈收购美国 “开放” 模型初创公司 Reflection AI 据直接知情人士透露，英伟达正在洽谈收购美国初创公司 Reflection AI，或加深对其投资。Reflection AI 是一家开放权重模型开发商，唐纳德・特朗普总统的政府希望这类模型能够与中国的廉价替代品竞争。 知情人士补充说，谈判尚处于早期阶段，交易可能采取多种形式，包括所谓的 “人才收购”，即英伟达聘用员工并获得技术授权，从而避免全面收购所带来的旷日持久的监管审查。 英伟达已是 Reflection 最大的股东之一，也可能选择通过进一步股权投资，或达成向其提供更多芯片和算力的协议，来加深与这家初创公司的关系。 据多名知情人士透露，两家公司可能在未来几周内达成交易，但他们也警告称谈判仍可能破裂。交易条款尚无法确定，但 Reflection 在 3 月的一轮融资中估值高达 250 亿美元。 Reflection 和英伟达拒绝置评。 “收购式招聘” 在寻求规避 AI 交易反垄断审查的大型科技公司中越来越受欢迎。英伟达在去年 12 月以 200 亿美元与芯片设计公司 Groq 达成了类似形式的交易。该交易本周引发了被抛弃的 Groq 员工提起的诉讼。 作为全球市值最高的公司，英伟达过去两年一直在大举投资，以提振 AI 经济并巩固其在这一经济核心的地位。该公司已拥有一个名为 Nemotron 的开放权重 AI 模型系列，但缺乏自己的前沿规模模型。 近几个月来，它越来越专注于培育开放权重模型市场，用户可以定制这些模型并在自己的硬件上运行。对于公司来说，它们的运营成本可能远低于 OpenAI 的 ChatGPT 或 Anthropic 的 Claude 的最先进版本。 7 月，英伟达首席执行官黄仁勋率先在业内呼吁建立本土开放权重 “生态系统”，称这对 “为全国创造创新与繁荣机遇” 至关重要。9 月，这家市值 5.5 万亿美元的公司同意以 130 亿美元收购 Hugging Face—— 一个汇集数百万模型和数据集的存储库。 英伟达已向 OpenAI 等大型 AI 实验室、Nebius 等新型云服务公司以及一系列较小规模的集团投入了数百亿美元。这反过来又为其芯片创造了额外需求，而芯片仍是构建或运行 AI 模型的公司不可或缺的关键商品。 在美国与中国竞争对手（如 DeepSeek）的 AI 竞赛中，Reflection 被视为具有战略意义的资产。本周，该公司发布了首款公开的、可定制 AI 产品，该产品运行在英伟达芯片上。Reflection 声称该模型与中国领先竞争对手智谱 AI 的 GLM-5.2 不相上下。 该集团的创始人米沙・拉斯金和约安尼斯・安东诺格鲁此前曾参与谷歌 AI 模型 Gemini 的工作。 英伟达已向 Reflection 投资 8 亿美元，该公司还获得了红杉资本、Distruptive 和 1789 Capital 等风险投资公司的支持，特朗普之子小唐纳德・特朗普是 1789 Capital 的合伙人。 Reflection 已与五角大楼和美国能源部建立合作，并达成协议为韩国等美国盟友开发人工智能模型。#文字观点", "publish_time": "2026-10-11 14:07", "tags": ["文字观点"]}, "post:2026-10-11T17-33:f080f03f4672": {"id": "post:2026-10-11T17-33:f080f03f4672", "kind": "post", "title": "2026-10-11 17:33", "source_label": "帖子正文", "excerpt": "【计算机周报】大模型ARR讨论 海外ARR引发市场讨论 近期OpenAIARR差异引发市场讨论（Axios700亿美元、FT500亿美元） 差异来自是否包含云渠道分成。500亿为净营收口径，需扣除分给微软的20%收益、亚马逊Bedrock渠道分成。", "content": "【计算机周报】大模型ARR讨论 海外ARR引发市场讨论 近期OpenAIARR差异引发市场讨论（Axios700亿美元、FT500亿美元） 差异来自是否包含云渠道分成。500亿为净营收口径，需扣除分给微软的20%收益、亚马逊Bedrock渠道分成。700亿更偏向“毛收入”，Anthropic披露的收入也为“毛收入”。 我们认为1）Anthropic在25年的渠道收入构成已具备较高透明度； 2）净额口径或系统性低估终端用户为调用其模型所支付的完整账单规模。 3）本次OAI数据披露前，市场已对OAIARR低于Anthropic有预期； 4）相比于数据本身，市场更担心Coding以外行业AI渗透和变现的担忧。 国内ARR明显提速 智谱：3月17亿元→9月120亿元； Minimax：2月10亿元→8月54亿元； 月之暗面：3月7亿元→8月67亿元。 驱动：1）Coding、Agent和专业办公进入高频付费；2）模型与推理系统持续降本，以及开源、API和云渠道扩大分发。 重点公司2026Q3净利润预期 增速超过50%的公司有12家，占比30%；增速在30%-50%的公司有7家，占比18%； 增速在0%-30%的公司有15家，占比38%；增速在-30%-0%的公司有5家，占比13%；增速低于-30%的公司有1家，占比3%。 【近期周报】 1007：AMD收购WorldLabs，物理AI平台化竞争加速！小程序://研究/LBXBgPBuPgvDAlh 0927：阿里云栖：模型、芯片、云—机器智能时代的三大基石小程序://研究/kRD9d1EwsFmaEzr 0919：摩尔线程首次覆盖！小程序://研究/nR7W8CADXFOOdte 0912：全球算力高景气!短期波折不改长期趋势！小程序://研究/Omcp2thAchbHlpi#文字观点", "publish_time": "2026-10-11 17:33", "tags": ["文字观点"]}, "attachment:files/Evercore ISI-中国销售调查：9月末走弱.pdf": {"id": "attachment:files/Evercore ISI-中国销售调查：9月末走弱.pdf", "kind": "attachment", "title": "Evercore ISI-中国销售调查：9月末走弱", "source_label": "Evercore ISI", "excerpt": "7T2se3r0Ot6kwoPa 7T2se3r0Ot6kwoPa Deutsche Bank Research Deutsche Bank AG/Hong Kong IMPORTANT RESEARCH DISCLOSURES AND ANALYST CERTIFICATIONS LOCATED IN APPENDIX 1. Deutsche Bank d", "content": "7T2se3r0Ot6kwoPa 7T2se3r0Ot6kwoPa Deutsche Bank Research Deutsche Bank AG/Hong Kong IMPORTANT RESEARCH DISCLOSURES AND ANALYST CERTIFICATIONS LOCATED IN APPENDIX 1. Deutsche Bank does and seeks to do business with companies covered in its research reports. Thus, investors should be aware that the firm may have a confl ict of interest that could affect the objectivity of this report. Investors should consider this report as only a single factor in making their investment decision. Asia China Autos & Auto Technology Industry China Autos & Autos Technology Date 7 October 2026 Beyond BEVs: EU to Cap Booming Chinese Hybrid Imports with Safeguard Quotas EU Considers Safeguard Quotas on Chinese Hybrids Following Record Import Surge According to Bloomberg News, the European Union is considering implementing emergency safeguard measures, potentially in the form of tariff -rate quotas (TRQs), to restrict a rapid influx of Chinese hybrid vehicles and extend its trade protectionism beyond battery electric vehicles (BEVs). This regulatory consideration follows the October 30, 2024, introduction of definitive five -year countervailing duties on Chinese -made BEVs —ranging from 7.8% to 35.3% on top of the standard 10% base tariff —which has heavil y incentivized Chinese OEMs to shift their export mix toward plug -in hybrids (PHEVs), traditional hybrids (HEVs), and internal combustion engine (ICE) models that currently remain subject only to the standard 10% tariff. This strategic pivot allowed Chines e automakers to capture a record 12% of Europe's total new -car market in August 2026, accounting for one in four hybrid sales and one in three PHEV sales in the region. By threatening to close this regulatory loophole via safeguard quotas, the EU could dir ectly cap these high -margin hybrid vehicle shipments, disrupting the highly profitable vehicle export growth that Chinese automakers have recently enjoyed in the European market. Aggressive Pricing was a Key Driver of Market -Share Gains in Europe Competitive pricing remains a vital driver of Chinese OEM market -share gains in Europe, with our comparison of equivalent BYD and Volkswagen models in Germany revealing that BYD typically deploys aggressive manufacturer -funded retail discounts of 16% to 32 % off MSRP, compared with just 0% to 12% for Volkswagen's selected line -up. This aggressive promotional strategy yields an immense transaction -price advantage across key vehicle segments; for example, the BYD \"Dolphin Surf\" Active is priced at EUR 16,990 after discounts —a substantial 32% below the Volkswagen \"ID. Polo\" Trend a t EUR 24,995 —despite offering a slightly longer electric driving range. This pricing gap is even more pronounced in the highly contested PHEV segment, where the BYD \"Seal 6 DM -i Touring\" and \"Seal U DM -i\" transacted at 34% to 42% below equivalent Volkswagen \"Passat\" and \"Tiguan\" plug -in hybrids. Chinese auto makers’ combination of lower initial base MSRPs and highly aggressive tactical discounts secures a powerful market penetration advantage that stimulated market -share gains in Europe. Bin Wang Research Analyst +852 -220 -35496 Wei Huang Research Associate +852 -2203 -7057 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 7 October 2026 China Autos & Autos Technology Deutsche Bank AG/Hong Kong Page 2 European Localization become Strategic Necessity for Chinese OEMs Navigating Trade Barriers Looking ahead, European localization has become a strategic necessity for Chinese OEMs seeking to mitigate trade barriers, preserve access to public incentives, and build sustainable regional operations, though the transition from export -led models to loca l manufacturing demands substantial capital and extended implementation timelines. To bypass impending tariffs and tariff -rate quotas without incurring massive upfront capital expenditures, we expect most Chinese OEMs to initially favor asset -light, partne rship -led models such as complete -knock -down (CKD) assembly, joint ventures, and contract manufacturing utilizing existing brownfield facilities. Current notable examples of this collaborative approach include Leapmotor’s JV with Stellantis (51:49), Chery’s partnership with EV Motors in Spain (40:60), Geely’s manufacturing JV with Ford (34:66), and lower -volume contract assembly by Magna for XPeng and GAC —structures that deeply embed Chinese players into European industria l ecosystems while minimizing geopolitical and execution risks. Conversely, larger, highly capitalized OEMs like BYD and SAIC will continue to pursue dedicated greenfield factory projects to maintain absolute operational control and scale integrated produc tion, though these high -capex sites are likely to remain concentrated among a select few players due to their longer ramp -up horizons. Proposed Industrial Accelerator Act Raises Localization Bar Beyond CKD Assembly The proposed Industrial Accelerator Act (IAA) represents a structural pivot in EU industrial policy, moving away from a reliance on border tariffs and toward using public spending, subsidies, and strategic investment conditions to raise manufacturing's sha re of EU GDP from 14.3% in 2024 to 20% by 2035. Rather than restricting non -compliant imports, the IAA aims to stimulate demand for European -made products by linking lucrative consumer subsidies, public procurement, corporate -fleet support, and CO2 super -credits for new energy vehicles (NEVs) to strict \"Made in EU\" criteria. Crucially, this policy framework significantly raises the threshold for effective localization, meaning that basic complete -knock -down (CKD) assembly will no longer suffice to unlock th ese vital financial incentives. Instead, Chinese OEMs must transition away from importing fully assembled major components and establish deep localized supply chains for high -value systems —including battery packs, electric powertrains, and advanced vehicle electronics —directly within the European industrial ecosystem. Because establishing this localized component ecosystem is likely to be 26年约为0.9万亿美元）。DRAM假设维持不变，ASP涨势有望延续至四季度及2027年各季度。台湾地区科技企业中，南亚科与群联电子9月销售表现强劲；基于8月数据，本行存储指标仍远高于2017/22年峰值水平（179 vs 120-130，处于周期中段）。 “降规”影响：增长催化剂而非需求担忧 市场关注部分芯片厂商明年可能向Rubin GPU供应8层HBM4（8×3GB DRAM颗粒=24GB），替代当前主流的12层配置（36GB）。由于Rubin通常需8颗HBM，若切换至8层，单GPU内存容量将从288GB（8×36GB）降至192GB（8×24GB）。但本行不认为这属于内存“降规”或需求削减，理由有三：1）为应对HBM短缺，GPU总出货量有望快速提升；2）新增GPU需额外搭配内存——包括配合逻辑处理器CPU（如Vera CPU）使用的LPDDR5 SOCAMM及键值缓存eSSD；3）科技巨头应为8层这一“旧世代”内存支付相对于12层的溢价。因此，从12层向8层的切换将支撑更高的GPU产量，进而带动SOCAMM与eSSD的额外订单。本行视8层HBM4“降规”为存储行业的另一增长催化剂。但需注意，目前尚未观察到8层HBM4有任何实质性的晶圆投入，受6个月以上的制造周期影响，其放量在2027年上半年甚至三季度前都将极为有限。 市场动态与估值 三季度DRAM与NAND合约价格环比再涨20-30%，涨势较二季度放缓但仍强劲；现货价格方面，DDR5本周微涨至58美元新高，DDR4稳定在45美元附近，而NAND现货自9月起小幅回调。存储股在7-8月因见顶担忧回调后，9月至10月初稳步复苏。当前主要DRAM标的估值仅约5-7倍2026-27年盈利，远低于 broader AI半导体同业，基本面仍受HBM强劲需求、供应紧张及超大规模企业AI资本开支扩张的坚实支撑。 关键数据要点（文字版） • 全球存储市场：2026年预期营收9,401亿美元（DRAM 5,729亿，NAND 3,672亿），2027年达1.41万亿美元，2030年2.05万亿美元。 • 2026年DRAM ASP涨幅预期242%，NAND 276%；2027年DRAM ASP再涨34%，NAND涨14%。 • 2026年资本开支：DRAM 972亿美元（+70% YoY），NAND 347亿美元（+57% YoY），2027年增速显著放缓。 • 三星估值：基于9倍2027-28年预期市盈率，目标价50万韩元（普通股），优先股目标价34万韩元（较普通股折让32%）。 主要风险与催化剂 下行风险：美国科技巨头意外削减资本开支、2026-27年资本开支增加导致全球存储供应过剩、中国厂商竞争加剧、市场份额流失。上行风险：AI芯片需求超预期、从竞争对手处夺取份额、与OEM/超大规模企业签订至2030年的长期协议（LTA）、利用创纪录FCF大幅提升股东回报。#文字观点", "publish_time": "2026-10-11 09:04", "tags": ["文字观点"]}, "post:2026-10-11T14-00:081fc64ec4be": {"id": "post:2026-10-11T14-00:081fc64ec4be", "kind": "post", "title": "2026-10-11 14:00", "source_label": "帖子正文", "excerpt": "伯恩斯坦｜亚洲半导体与全球存储：2026 年第三季度业绩前瞻 ——AI 是否仍是看多主线？我们预计各家公司会在即将到来的财报季给出建设性的更新指引。", "content": "伯恩斯坦｜亚洲半导体与全球存储：2026 年第三季度业绩前瞻 ——AI 是否仍是看多主线？ 我们预计各家公司会在即将到来的财报季给出建设性的更新指引。 越来越多信号显示，AI 投资规模已经十分庞大，来到宏观层面的 “边界条件”，已经无法单纯依靠半导体及零部件的供需关系解释。借贷成本上行就是典型例子；安全环保担忧，以及由此带来潜在监管干预是另一项风险。 一旦触及这些边界，就有可能造成半导体需求增速放缓，从而让 AI 投资其他环节以及整个社会有时间跟上发展节奏。 但另一方面，上游半导体供应链的全部信号依旧显示 AI 需求热度不减，供给持续紧张。 我们认同部分成本通胀还在向下游传导，后续有可能进一步压制部分需求。非 AI 相关需求受冲击会更大，但进一步的破坏程度预计相对有限，下游客户已经做好应对成本通胀的准备。 更重要的是 AI 需求依旧强劲，下游客户已经充分认知成本上行，尤其是存储价格的大幅上涨。 综合正负两方面信号，整体上我们依旧选择对本次财报季保持积极态度，上述部分担忧已经在近期股价回调当中得到定价。 我们预计上游公司会向投资者传递：即便成本通胀，需求依旧具备韧性；下游公司会展示 AI 渗透率持续拓宽、使用规模快速提升。 受益旺盛需求、理性的产能扩张以及涨价动作，台积电会继续成为最可靠的复利增长标的，我们测算存在上行风险。 台积电需求整体持续大于供给；成熟制程需求改善，先进制程与先进封装的供给紧张程度尤其突出。 短期看，2026Q3 营收超预期，叠加 iPhone18 初期销售数据向好，即便存储价格高企，高端智能手机需求依旧具备韧性。 综合以上因素以及产能约束，我们测算台积电 2026 全年营收同比增长 41%，同时存在小幅上行风险。这意味着 2026 年第四季度营收环比大概会实现 10% 甚至更高的增长。 面向 2027 年，客户已经接受涨价幅度；先进节点涨价高个位数‑接近 15%，成熟节点中等个位数，市场普遍认为涨价幅度属于温和。涨价效应将从 2027 年上半年开始体现在财报当中，并贯穿 2027 全年。 智能体相关工作负载，让 CPU 成为台积电最新超预期的需求来源。AI 加速器（XPU）同样为台积电贡献封装业务营收，但 CPU 拿到更多增量晶圆产能。 所以从晶圆营收角度，我们预计 2027 年 CPU 和 XPU 的营收贡献规模基本持平，两者各占台积电总营收的 15%‑19% 区间。 我们参加台湾半导体展之后得出结论：对比通用商用芯片（ASSP），ASIC 专用芯片拿到更多产能分配。这点对于 XPU 适用，对于 CPU 同样成立，谷歌、亚马逊定制 CPU 拿到可观产能配额。 绝大多数 CPU 采用传统封装，所以台积电近期资本开支提升，资源会更多向前端晶圆制造倾斜，而不是 CoWoS 先进封装产能。 随着产能扩张规模远超原有规划，洁净室现在成为台积电最大瓶颈。CPU 更加消耗晶圆产能而非封装产能，同时外部封测厂可以提供等效 CoWoS 产能。 以上因素综合，台积电把有限洁净室资源优先分配给晶圆工厂。我们预测，英特尔依靠 EMIB‑T 技术，加上外部封测公司，会在全球增量先进封装产能当中扮演越来越重要角色。 我们预计台积电 2027 年资本开支会进一步走高，但临近年末，我们判断台积电下周不会修改 2026 年资本开支指引。#文字观点", "publish_time": "2026-10-11 14:00", "tags": ["文字观点"]}, "post:2026-10-11T13-58:52919c5aaea5": {"id": "post:2026-10-11T13-58:52919c5aaea5", "kind": "post", "title": "2026-10-11 13:58", "source_label": "帖子正文", "excerpt": "HBM 降规，或是增长催化剂而非风险点 我们注意到，部分芯片公司明年会为 Rubin GPU 供应 8 叠层 HBM4 产品，8 颗 3GB DRAM 裸片合计 24GB，对比当前主流 12 叠层配置的 36GB。Rubin GPU 通常需要搭载 8 颗 HBM，采用 8 叠层方案之后，单卡内存容量", "content": "HBM 降规，或是增长催化剂而非风险点 我们注意到，部分芯片公司明年会为 Rubin GPU 供应 8 叠层 HBM4 产品，8 颗 3GB DRAM 裸片合计 24GB，对比当前主流 12 叠层配置的 36GB。 Rubin GPU 通常需要搭载 8 颗 HBM，采用 8 叠层方案之后，单卡内存容量将从原先的 288GB（8×36GB）下降至 192GB（8×24GB）。 但我们并不将其视作存储规格降级或者需求削减，主要存在三点理由。 受 HBM 供给紧缺约束，GPU 整体出货量有望快速抬升。 新增出货的 GPU 需要配套额外存储，包含搭配对应逻辑处理器 CPU（例如 Vera CPU）使用的 SOCAMM（小尺寸压缩内存模组）以及键值缓存企业级固态硬盘。 大型科技公司会为这款 8 叠层的旧规格内存，支付相较 12 叠层产品的价格溢价。 整体来看，从 12 叠层转向 8 叠层，有望推高 GPU 出货规模，进而带动 SOCAMM 与企业级固态硬盘产生更多订单。 因此，我们认为基于 8 叠层的规格下调，对于存储行业而言属于又一项增长催化剂。 即便如此，我们尚未观察到 8 叠层 HBM4 有实质可观的晶圆投入量。 受 6 个月以上制造周期约束，8 叠层 HBM4 的出货量，在 2027 年上半年甚至第三季度大概率依旧维持在较低水平。#文字观点", "publish_time": "2026-10-11 13:58", "tags": ["文字观点"]}, "post:2026-10-11T14-02:f14ab4901832": {"id": "post:2026-10-11T14-02:f14ab4901832", "kind": "post", "title": "2026-10-11 14:02", "source_label": "帖子正文", "excerpt": "周报：分众收购新潮反垄断审查获批，网易首次曝光射击新游 近一周（10/5~10/9）：A股申万传媒指数涨2.70%/沪深300跌0.93%/上证指数跌0.74%/创业板指数跌2.93%；海外恒生指数涨1.00%/恒生科技指数涨0.96%/纳斯达克指数涨0.64%。", "content": "周报：分众收购新潮反垄断审查获批，网易首次曝光射击新游 近一周（10/5~10/9）：A股申万传媒指数涨2.70%/沪深300跌0.93%/上证指数跌0.74%/创业板指数跌2.93%；海外恒生指数涨1.00%/恒生科技指数涨0.96%/纳斯达克指数涨0.64%。 ☀️评论 节后传媒板块小幅上涨，关注AI多模态应用发展。节后，传媒板块小幅上涨，其中影视院线、图书出版细分板块涨幅居前。 展望后续，我们建议把握以下投资线索：1）游戏赛道低估值、高景气度，AI赋能下商业模式优势巩固，关注产品周期明确的头部厂商；2）持续关注AI商业化和技术迭代进展，关注已跑通AI内容商业模式的平台型公司及产业链标的；3）IP价值重估，AI技术降低IP影视化门槛后，IP储备丰富的公司迎来资产重估窗口。 1️⃣广告：分众传媒收购新潮传媒反垄断审查获附条件批准，关注整合提效释放潜能。10月10日，分众传媒收购新潮传媒股权案获国家市场监管总局附加限制性条件批准。根据总局公告，监管层通过价格冻结与放弃独家条款两项核心约束，为梯媒行业构建竞争合规框架。收购新潮传媒事项后续尚需深交所审核通过及中国证监会同意注册。我们预计交易有望于年内完成，收购完成后，新潮传媒并表将直接增厚分众传媒收入，实现整体点位密度与结构优化；交易亦将推动分众传媒对重叠点位梳理，削减成本。 2️⃣游戏：网易首次曝光射击新游，微信小游戏上线4Q专项激励。10月9日，网易首次曝光竞技射击游戏《极限战场》。游戏同时宣布将于10月15日-10月22日进行PC端限量删档首次测试。我们认为，从短期看，网易新品储备释放将有望推动收入、利润增长加速；从中长期看，开放世界、搜打撤、射击等重点品类成功将强化其多赛道研发能力，推动其以更立体的产品矩阵提升长线经营能力。10月8日，微信小游戏宣布4Q专项激励方案。 ☀️估值与建议 维持盈利预测/估值/目标价。A股推荐游戏板块(世纪华通/恺英网络等)，关注分众传媒；港美股推荐网易/阅文集团/快手/心动公司/欢聚，关注音乐(腾讯音乐/网易云音乐)/猫眼娱乐/大麦娱乐。 风险 宏观景气度低于预期，监管政策变化，盈利修复较慢。#文字观点", "publish_time": "2026-10-11 14:02", "tags": ["文字观点"]}, "post:2026-10-11T17-33:8857a44d2392": {"id": "post:2026-10-11T17-33:8857a44d2392", "kind": "post", "title": "2026-10-11 17:33", "source_label": "帖子正文", "excerpt": "【国盛钢铁】财政托底需求 节后两个交易日市场表现不佳，美债收益率的持续上升对资本市场和金属的金融属性形成压制。美国财政赤字长期高企，下半年财政赤字进一步扩大，仅7月单月政策赤字就高达近4300亿，国债下半年发行加快。", "content": "【国盛钢铁】财政托底需求 节后两个交易日市场表现不佳，美债收益率的持续上升对资本市场和金属的金融属性形成压制。美国财政赤字长期高企，下半年财政赤字进一步扩大，仅7月单月政策赤字就高达近4300亿，国债下半年发行加快。同时美伊冲突围绕霍尔木兹海峡的争夺至今悬而未决，至今双方均没有展露妥协退让的可选方案，全球能源库存在持续消耗下，高油价的持续性似乎也会超出市场预期。雪上加霜的是美国AI企业投资天量融资同期也有进一步扩大的诉求，分流债券承接资金的同时进一步推升美债收益率。因此无论后期美联储加息与否，未来美国中长期国债收益率预计都将保持易升难降的局面。 财政压力下我们认为未来美联储保持所谓独立性可能是一种奢望。在财政压力和控制通胀的权衡中，绝大部分国家央行最终会服从财政，财政主导大概率是最终的结局，财政赤字货币化是最终的结局。未来美联储在面对一系列压力事件所作出的反应，才是金属金融属性和A股更大的催化剂。而在此之前，美国加大吸收全球流动性的背景下，即使中国加强了跨境资本流动管制，同时推动人民币的远期稳定升值来对冲内外利差扩大的影响，增量资金不足也使得市场近期始终处于震荡状态。结束焦灼状态需要以拖待变等待外部约束条件出现变化，市场和金属金融属性才可以得到释放。 实物属性上国内经济三季度财政支出开始重新提速，10月9日财政部安排使用地方政府债务结存限额5500亿元，用于提高县区一般公共预算保障能力和支持地方扩大有效投资。财政部将指导督促各地更好衔接项目储备和债券发行，加快发行节奏，畅通拨付链条，尽快形成实物工作量，促进政策早落地、早见效，对托底四季度内需有积极作用。转型期经济年度上依然以稳为主，季度维度随财政托底发力的节奏呈现出衰退和复苏之间徘徊的收敛形态。经济不断收敛下去，通过足够的稳定去进行经济结构改革。本轮市场回调后板块估值吸引力提高，我们前期用重置价值测算行业头部企业，当下核心公司绝对估值位置处于低位。 投资策略：从中长期价值视角可以布局标的如宝钢股份、南钢股份、华菱钢铁、方大特钢、新钢股份这些优质钢企，受益于油气、核电景气周期的久立特材，受益于管网改造及普钢盈利弹性的新兴铸管，受益于煤电新建及油气景气周期的常宝股份，以及受益于需求复苏和镀镍钢壳业务的甬金股份。 风险提示：国内产量调控政策超预期、下游需求不及预期、原料价格超预期上涨、地缘政治风险。#文字观点", "publish_time": "2026-10-11 17:33", "tags": ["文字观点"]}, "post:2026-10-11T17-33:c8710f8afa8a": {"id": "post:2026-10-11T17-33:c8710f8afa8a", "kind": "post", "title": "2026-10-11 17:33", "source_label": "帖子正文", "excerpt": "【长江宏观宋筱筱团队】政府债与流动性周度跟踪（2026.10.11）：5500亿结存限额落地，长端利率回升 1、政府债发行提速，同比落后去年。前三季度，政府债累计发行11.1万亿（同比少0.9万亿），发行进度77%（同比慢6%），考虑结存限额后年内剩余3.3万亿未发（去年同期剩余2.3万亿）。", "content": "【长江宏观宋筱筱团队】政府债与流动性周度跟踪（2026.10.11）：5500亿结存限额落地，长端利率回升 1、政府债发行提速，同比落后去年。前三季度，政府债累计发行11.1万亿（同比少0.9万亿），发行进度77%（同比慢6%），考虑结存限额后年内剩余3.3万亿未发（去年同期剩余2.3万亿）。结构上，本周新增一般债、项目专项债、化债提速，普通国债、特别国债均有所放缓。 2、9月新增项目专项债提速。本周，受国庆假期影响，新增项目专项债发行33亿（去年同期170亿）；9月，新增项目专项债共发行4368亿元（去年同期1841亿元）；1-9月累计2.5万亿（去年2.5万亿，同比持平）。 3、特殊新增专项债超发。隐债置换专项债累计发行1.9万亿元（额度2万亿）；9月特殊新增专项债占比约30%，年内累计发行1.12万亿，已超过8000亿额度，去年全年发行1.4万亿。城投融资收紧，10月城投净融资或仍维持低位。 4、注资特别国债落地，超长期特别国债发行进度接近去年。3000亿元注资特别国债已发行1500亿元，剩余1500亿元将按四季度发行计划于11月发行；特别国债累计发行1.4万亿元，同比-0.37万亿元；其中，超长期特别国债同比少发200亿元，发行进度同比慢2个百分点。 5、10月9日，财政部安排使用5500亿元地方债结存限额，与2025年（5000亿）相比额度有所提高，其中，一般债3000亿，全部分配县区使用；专项债2500亿，分配给今年Q4有实际项目资金需求的地区，并向经济大省倾斜。若3000亿一般债限额全部以新增一般债形式发行，则狭义赤字率将升至4.2%。 6、本周央行增量续作买断式逆回购2000亿，公布9月国债买卖投放1000亿元，投放规模年内最高，DR007均值环比回落4BP至1.35%；5500亿政府债结存限额等多项稳增长政策落地，10Y国债利率周均值环比回升1.1BP至1.69%。#文字观点", "publish_time": "2026-10-11 17:33", "tags": ["文字观点"]}, "post:2026-10-11T13-49:1820636d80d7": {"id": "post:2026-10-11T13-49:1820636d80d7", "kind": "post", "title": "2026-10-11 13:49", "source_label": "帖子正文", "excerpt": "🚗🚗银河战舰700正式上市 重塑新能源硬派SUV价格体系【国联民生汽车 崔琰团队】 ————————————— 🚗事件：10月10日，吉利银河首款AI全地形硬核SUV银河战舰700正式上市，共推出6款车型，官方指导价18.98万-37.98万元，先享指导价17.98万-36.98万元，叠加限时换新政", "content": "🚗🚗银河战舰700正式上市 重塑新能源硬派SUV价格体系【国联民生汽车 崔琰团队】 ————————————— 🚗事件：10月10日，吉利银河首款AI全地形硬核SUV银河战舰700正式上市，共推出6款车型，官方指导价18.98万-37.98万元，先享指导价17.98万-36.98万元，叠加限时换新政策后价格为16.98万-35.98万元。其中，1.5T两驱版限时换新价16.98万-17.98万元，1.5T三电机四驱版19.98万-20.98万元，2.0T三电机四驱顶峰版23.98万元，陆地方舟版35.98万元。据官方数据，车型上市12分钟定单突破10,000辆。 🚗四驱版进入20万元以内 价格下探有望加速市场扩容 银河战舰700将1.5T三电机四驱车型的限时换新门槛进一步下探至19.98万元，2.0T三电机四驱顶峰版亦降至23.98万元，价格覆盖主流家用方盒子与传统硬派越野市场。新车车长5085mm、轴距2900mm，具备中大型SUV空间，同时通过两驱、三电机四驱及特别版形成较宽产品梯度。我们认为，正式售价较预售阶段进一步下探，有望强化其相较方程豹豹5、钛7、长城H10及坦克系列新能源车型的性价比优势，扩大新能源硬派SUV的潜在用户群体。 🚗大电池与三电机四驱兼顾通勤和越野 强化全场景产品标签 新车全系搭载47.14kWh宁德时代磷酸铁锂电池，CLTC纯电续航最高305km、综合续航最高1770km，并搭载6C快充电芯，官方公布10%-70%充电时间为8分25秒。性能方面，2.0T三电机四驱版本系统综合功率达830kW、约1129马力，零百加速3.95秒；同时配备后桥双电机、机械差速锁、智能全地形系统及双腔闭式空气悬架和CCD连续可变阻尼减振器。 🚗智能与舒适配置同步下放 银河产品力进一步提升 银河战舰700搭载千里浩瀚H5/H7辅助驾驶方案，高阶版本采用Thor-U芯片，算力达700TOPS，并配备192线激光雷达，支持高速及城区领航辅助、车位到车位领航和多场景辅助泊车。舒适性方面，新车提供双开启全景天窗、18.5L双开智能冷暖冰箱、全车座椅通风加热、前排14点按摩及23扬声器Flyme Sound音响。 🚗投资建议：银河战舰700切入新能源硬派越野市场，有望补齐吉利在高价值越野SUV领域的产品空缺。预计公司2026-2028年收入分别为4,883.4/5,722.8/6,254.9亿元，归母净利润为232.6/273.1/323.3亿元，EPS为 2.14/2.52/2.98元，对应10月9日15.13港元收盘价的PE分别为 6/5/4倍，维持“推荐”评级。 🚗风险提示：新车正式上市及交付节奏不及预期；订单表现不及预期；市场竞争加剧风险。 ————————————— 📞欢迎联系国联民生汽车：崔琰15800865715/杨睿18702151873#文字观点", "publish_time": "2026-10-11 13:49", "tags": ["文字观点"]}, "post:2026-10-11T13-56:773ec0ee7d5f": {"id": "post:2026-10-11T13-56:773ec0ee7d5f", "kind": "post", "title": "2026-10-11 13:56", "source_label": "帖子正文", "excerpt": "端侧AI，万众创新#小模型能力持续提升，VibeCoding促使端云协作降低新品开发门槛。轻量模型从文本处理向视觉、语音理解及工具调用拓展，支持更自然的多模态交互。", "content": "端侧AI，万众创新#小模型能力持续提升，VibeCoding促使端云协作降低新品开发门槛。轻量模型从文本处理向视觉、语音理解及工具调用拓展，支持更自然的多模态交互。细分场景下，终端可在本地完成高频任务，通过云端处理复杂任务，复用成熟模型能力，加快产品开发。 #应用从问答交互向个性化服务与专项任务执行拓展，AI眼镜增加识图问答与实时翻译，AI玩具拓展互动陪伴，AI穿戴结合持续健康记录与个性化指导，AI耳机融入翻译与健康功能，功能机器人围绕清洁、配送等任务落地...。 #终端落地带动连接与低功耗计算需求。云端调用、数据同步及设备互联增加蜂窝、Wi-Fi与蓝牙连接需求；多模态感知与实时响应推动SoC集成计算、连接与AI处理能力，兼顾算力、功耗和成本。 #持续交互进一步提高供电、续航与轻量化要求。信号采集、音频输出及电源管理带动模拟器件升级；紧凑的终端空间提高电池能量密度与适配要求，轻质高强材料和精密加工则支持终端减重，改善佩戴与使用体验。 建议关注：#SOC：乐鑫科技、瑞芯微、晶晨股份、恒玄科技；#通讯模组：移远通信、广和通；#模拟芯片：艾为电子、圣邦股份、思瑞浦、南芯科技；#电池：豪鹏科技、亿纬锂能；#轻量化材料：达瑞电子、金发科技、长盈精密、领益智造；#终端应用：OpenAI、Meta、Google、苹果、Alphabet、小鹏汽车、石头科技。 风险提示：模型与生态进展不及预期；终端需求及商业化不及预期；技术路线变化与竞争加剧；数据隐私与应用安全风险。#文字观点", "publish_time": "2026-10-11 13:56", "tags": ["小模型能力持续提升", "Vibe", "SOC", "通讯模组", "模拟芯片", "电池", "轻量化材料", "终端应用", "文字观点"]}, "post:2026-10-11T13-57:0f67a1f41de3": {"id": "post:2026-10-11T13-57:0f67a1f41de3", "kind": "post", "title": "2026-10-11 13:57", "source_label": "帖子正文", "excerpt": "全球汽车：欧盟拟针对中国混动车型设置更高贸易壁垒 —— 我们的观点 欧盟正在加大对中国混动车型的施压。过去一周，彭博社、金融时报等媒体报道称，欧盟正考虑对中国混动车辆实施临时进口配额以及额外关税，政策目标大概率指向插电式混合动力车型（PHEV）。", "content": "全球汽车：欧盟拟针对中国混动车型设置更高贸易壁垒 —— 我们的观点 欧盟正在加大对中国混动车型的施压。 过去一周，彭博社、金融时报等媒体报道称，欧盟正考虑对中国混动车辆实施临时进口配额以及额外关税，政策目标大概率指向插电式混合动力车型（PHEV）。 该提案尚处于讨论阶段，尚未形成最终决议，报道提及的相关措施比此前市场预期的、将现有中国产纯电动车关税框架延伸至插混车型的方案更加严苛。 叠加目前围绕 “欧洲制造” 政策的相关争论，以上一系列事件近期打压了投资者对于中国整车公司的投资情绪。 中国插混车型在西欧市场的市占率从 11% 飙升至 38%。 市场出现上述政策关注点，源于欧盟方面担忧针对中国纯电动车的现有措施，几乎没有延缓中国整车公司的市场份额提升节奏。 自 2024 年 10 月起，中国产纯电动车已经被征收额外关税，但插电混动车型一直免于该类关税。 受此影响，中国整车公司在西欧插混市场的份额，从 2024 年 9 月的 11%，快速攀升至 2026 年 6 月的 38%。 比亚迪与奇瑞是向欧洲出口插混车型的主要中国整车公司，2026 年上半年二者分别占据欧洲插混车型上牌量约 12% 与 8% 的份额。 上汽、吉利的出口体量相对更小，分别占比 3%、2%，不过两家公司的市场影响力正在提升。 但整体来看，相关业务的风险敞口尚处于可控水平，欧洲插混销量在集团整体销量当中占比较低。 我们测算，欧盟插混业务占比亚迪总销量约 5%，占吉利总销量约 3%，占上汽总销量约 2%。 关税配额制度，是短期对中国整车公司约束性更强的一种结果。 近期报道显示，关税配额框架，有可能成为中欧谈判之后最有可能落地的方案。 在该制度之下，进口车辆在指定配额以内可以按照现行关税水平进入市场；进口量一旦超过该门槛，则需要缴纳额外关税。 站在欧盟视角，关税配额可以放缓中国整车公司市占率提升的节奏，同时保留一定市场准入空间，还有望降低来自中国的贸易反制风险。 对比单纯的加征关税模式，我们认为关税配额短期对中国整车公司约束更强，因为它会直接对进口总量设置上限。 如果只实施加征关税，只要单车经济效益具备吸引力，中国整车公司依旧可以持续扩大出口规模。 但配额制度之下，无论盈利水平如何，出口增长都会受到硬性约束。 目前仍存在关键不确定性，包括配额规模如何设定，以及配额如何在各家生产公司之间分配。 该政策可能带来的影响包括：整车公司会更加聚焦于均价更高的车型，优先优化单车利润而非追求销量规模增长，同时中国整车公司会加速推进欧洲本地化生产布局。 另一项重大不确定因素来自中国方面可能出台的反制措施，反制影响可能不止波及欧洲汽车行业，还会扩散到更多行业，参考过往针对欧洲白兰地、猪肉、乳制品出台的相关措施。 “欧洲制造” 相关政策，会进一步强化公司推进本地化生产的动力。 除贸易类限制措施以外，欧盟还在讨论多项政策，通过本地含量要求、“欧洲制造” 条款、偏向本土生产车辆的采购与补贴机制，推动本土制造业发展。 举例来说，拟议出台的《工业加速器法案》，要求电动汽车（不含电池）的零部件至少有 70% 来自欧盟本土。 虽然这份法案目前还只是草案版本，但我们判断，这类本地化相关要求，有很大概率会在未来以某种形式落地实施。 短期会形成逆风，但会加速本就在推进当中的本地化布局。 如果谈判最终落地约束性更强的贸易制度，我们将其视作中国整车公司的短期利空因素。 但同时，这也会加速已经开启的进程：也就是在欧洲本地建厂生产，以此降低进口相关政策带来的风险敞口。 比亚迪已经确认计划在 2026 年底之前启动匈牙利工厂生产，工厂满产后年产能最高可达 30 万台。 我们预计，如果贸易壁垒持续抬升，其他中国整车公司也会采取相似的建厂策略。 因此站在中期维度看，对于中国整车公司的市占率扩张，该事件带来的冲击可控，和我们长期预期大体持平。#文字观点", "publish_time": "2026-10-11 13:57", "tags": ["文字观点"]}, "post:2026-10-11T13-49:5b656565e271": {"id": "post:2026-10-11T13-49:5b656565e271", "kind": "post", "title": "2026-10-11 13:49", "source_label": "帖子正文", "excerpt": "立讯精密337调查点评：直接影响有限，侧面印证公司电源能力，继续重点推荐【中信电子】 📌据公司公告，ITC于2026年10月9日启动337-1526调查，涉及Vicor相关专利，范围涵盖垂直供电系统（VPD）、相关组件及下游计算系统，立讯精密及立讯技术被列为被调查方。此次仍处于立案初期，无侵权实质认", "content": "立讯精密337调查点评：直接影响有限，侧面印证公司电源能力，继续重点推荐【中信电子】 📌据公司公告，ITC于2026年10月9日启动337-1526调查，涉及Vicor相关专利，范围涵盖垂直供电系统（VPD）、相关组件及下游计算系统，立讯精密及立讯技术被列为被调查方。此次仍处于立案初期，无侵权实质认定；公司涉案产品处于客户验证阶段、尚未量产，不会对生产经营产生重大影响。 📍Vicor过往主张并非均获支持，争议存在专利授权和解可能性，供应链也存在调整空间。 1️⃣337调查由企业申请发起。ITC是美国准司法联邦机构，有权在认定违反337条款后实施进口排除及停止销售等措施；若相关产品最终被认定侵权，可能增加进口、交付、改版认证及许可成本。 此外，Vicor明确开展面向OEM及云厂商的专利许可业务，争议存在通过授权维持多供应商采购的商业解决路径。 2️⃣Vicor曾于2023年发起1370案，在终裁中就两项专利获得部分胜诉及有限排除令，但专利对应的侵权主张未获支持。同时，美国海关于2026年2月裁定，台达等申请审查的特定单面改版电源产品不受该案排除令限制，说明禁令影响需要落实到具体产品，设计调整可以形成继续供货的路径。第二案337- 1484于2026年2月立案，涉及另一项专利，目前仍在审理。 📍立讯已有化解337经营风险的实际经验。 安费诺曾于2020年12月提出调查申请，相关案件在2022年9月终裁：立讯少数上一代产品涉及其中一项专利，但这些产品此前已完成版本替换；另外两项专利所涉指控被认定不侵权或有关权利要求无效，该案未对生产经营造成实质影响。 该案例充分体现公司将法律应诉、技术改版与客户验证协同推进的能力，为本次应对提供经验支撑。公司电源布局已延伸至机柜、服务器及芯片供电，系统协同构成长期竞争优势。 当前，公司服务器模块电源已实现覆盖一次至三次电源的规模化量产，并继续布局高压及特高压方案。其产品矩阵涵盖机柜级Power Shelf及整流器、服务器CRPS、板级IBC/DC-DC模块和芯片侧VRM/VPM，并配套Busbar及供电互连产品。技术优势体现在高效电能变换、大电流低阻连接和电热协同等多方面，我们看好公司依托精密制造，将电源、互连与液冷能力整合到客户系统设计中的竞争力。 📈截止日前，公司市值仅对应约18x 2026E PE，13x 2027 PE，估值分位处于过去3年的24%以内，我们继续看好公司基于完整 AIDC 业务布局，以内生+外延战略、垂直一体化构建长期稳健增长，继续重点推荐。#文字观点", "publish_time": "2026-10-11 13:49", "tags": ["文字观点"]}, "post:2026-10-11T13-49:8fd503524c28": {"id": "post:2026-10-11T13-49:8fd503524c28", "kind": "post", "title": "2026-10-11 13:49", "source_label": "帖子正文", "excerpt": "【美国337禁令】对AI服务器电源影响-261010 ---------- 问题一：337禁令是什么？今天美国337禁令事件受到市场关注，立讯精密还发布了公告。", "content": "【美国337禁令】对AI服务器电源影响-261010 ---------- 问题一：337禁令是什么？ 今天美国337禁令事件受到市场关注，立讯精密还发布了公告。337禁令是美国国际贸易委员会USITC依据《查找图书年关税法》第337节（Section337），认定进口产品存在不公平贸易（绝大多数是知识产权侵权）后，发布的排除令、停止令等救济措施，俗称337禁令，由美国海关执行。其目的是：不让侵权产品进入美国市场，同时禁止在美国境内继续销售库存侵权货。 337门槛较低，如果是单纯专利侵权案件，不需要证明损害美国本土产业。其完整流程通常12–18个月。有4类核心禁令，（1）有限排除令LEO，只禁止名单里特定被诉企业的侵权产品进口美国；不限制其他厂商同类产品，是最常见结果。（2）普遍排除令GEO，威慑最强，所有同类侵权产品一律禁止进口，海关自动拦货；（3）停止令；（4）没收令。 问题二：本次美国337VPD调查情况？ 案件编号337-TA-1526，美东时间2026-10-09立案，原告Vicor（美国电源厂商），涉案产品：特定VPD垂直电力传输系统、组件、搭载该系统的AI服务器/计算整机。原告诉求：有限排除令LEO+停止令CDO。被告名单合计20家，有立讯精密/立讯技术、富士康、台达电子、广达电脑、英飞凌、伟创力、天弘科技、MPS等。 问题三：对企业和投资影响？ 首先，这个337调查刚立案，按照一般的时间需要12~18个月，时间还早。并且复盘2016到2024年的美国337调查（每年有30~60件不等）案件，超过一半案件最终和解或原告撤诉，不需要走到终裁禁令。所以可以认为本次调查大概率走向专利许可，抬升BOM成本。这是Vicor在AI服务器供电赛道的专利商业维权，并且非常具体的是VPD垂直供电，属于三次电源。这些事情对【新雷能】等以自有技术作为核心的企业反而形成利好。 【新雷能】在三次电源领域按水平供电（PowerBlock）和垂直供电（VPD）两条技术路线布局。公司PowerBlock及VPD产品均已经与ADI开展合作，预计2027年开始批量。新雷能在数据中心领域已形成覆盖一次、二次及三次变换的全系列电源解决方案供给能力，品种稀缺。明确看好。#文字观点", "publish_time": "2026-10-11 13:49", "tags": ["文字观点"]}, "post:2026-10-11T14-01:13cc2156b2a8": {"id": "post:2026-10-11T14-01:13cc2156b2a8", "kind": "post", "title": "2026-10-11 14:01", "source_label": "帖子正文", "excerpt": "台股算力9月经营总结：AI服务器/液冷/存储/电源/CoWoS 🔥#服务器：需求能见度延伸至2028✔#鸿海9月营收月增25.70%，年增38.42%；1-9月累计营收年增39.53%。", "content": "台股算力9月经营总结：AI服务器/液冷/存储/电源/CoWoS 🔥#服务器：需求能见度延伸至2028✔#鸿海9月营收月增25.70%，年增38.42%；1-9月累计营收年增39.53%。目标2026年底AI服务器机柜产能超2000个/周，#持续朝市占率50%目标迈进。✔#纬创9月营收月减17.23%，年增87.19%；1-9月累计营收年增97.25%。#斩获企业级与CSP新客户、涵盖L10与L11产品；网通产品预期2026年成长超10倍，已打入北美最大网通公司，预期2027年出货量将进一步提升。 ✔#广达9月营收月减23.27%，年增76.69%；1-9月累计营收年增99.41%。预计Vera Rubin在2026Q4小批量出货，放量时间点将落在2027Q1。#AI服务器需求、客户产品规画与订单能见度已延伸至2028年；维持全年AI服务器营收倍增目标不变；2028年产能或较2026年再度翻倍增加。 🔥#液冷：液冷产品种类扩张、ASIC快速导入 ✔#奇鈜#9月营收月增7.89%，年增44.92%；1-9月累计营收年增71.17%。#产品线已从Cold Plate、Rack Manifold、Inner Manifold切入CDU、ASIC专案的液冷渗透率同步拉升，Cold Plate月产能约100万片，Rack Manifold月产能约7000套。 ✔#双鸿9月营收月减8.19%，年增23.23%；1-9月累计营收年增72.39%。自研QD自GB300平台开始导入，导入比重由2025年的约5%提高至2026年的约30%，并同步切入ASIC平台。 🔥#存储：DRAM与NANDFlash价格维持上行 ✔#威刚9月营收月减16.88%，年增199.95%；1-9月累计营收年增215.57%。服务器与数据中心相关需求持续占用上游存储产能，压缩传统PC与手机市场可取得的供应量，#DRAM与NANDFlash供应结构仍紧俏、价格维持上行、2026年第三季价格走扬与供应吃紧。 🔥#电源：AI电源逻辑确定性强✔#台达电8月营收月减3.71%，年增34.95%；1-8月累计营收年增41.06%。#8kW以上AC/DC电源、DC/DCConverter、液冷散热、Power Rack与BBU出货升温，相关HVDC产品预计第三季量产、第四季少量出货。#现阶段供应内容已从电源零组件延伸到整体电力系统、AI服务器相关产品营收比重超过25%、液冷占比高于12%、高功率资料中心应用比重同步拉升。 🔥#晶圆：台积电CoWos月产能2026年底或达13万片、有望计划在2028年底扩增至26万片 ✔#台积电9月营收月减0.57%，年增54.65%；1-9月累计营收年增41.11%。目标2nm制程晶圆月产能将从2026年底的9万片提升至2027年中的11万片，增幅约22%；3nm制程月产能将从今年底逾18万片提升至明年中21万片，增幅逾16%。#2026年底CoWos产能或将达每月13万片、并有望计划在2028年底前将CoWoS产能扩增至每月26万片。 资料来源：各公司官网，Chinatimes，经济日报，芯智讯、快科技，iFind，Wind，工商时报#文字观点", "publish_time": "2026-10-11 14:01", "tags": ["服务器", "需求能见度延伸至2028", "鸿海", "持续朝市占率50%目标迈进", "纬创", "广达", "奇鈜", "双鸿", "存储", "DRAM与NAND", "威刚", "电源", "AI电源逻辑确定性强", "台达电", "8kW以上AC", "DC电源、DC", "DC", "台积电", "文字观点"]}, "post:2026-10-11T17-34:3f5a8e6c72d1": {"id": "post:2026-10-11T17-34:3f5a8e6c72d1", "kind": "post", "title": "2026-10-11 17:34", "source_label": "帖子正文", "excerpt": "【传媒周观点261011】锐度交易关注AI多模态与互动内容 AI：本周Claude Haiku 5.5（输入不超过100K时，API较前代下降90%）发布，模型能力提升与价格下探同步推进，行业价格竞争持续加剧。应用端，继Muse后，OpenAI Dots、面向办公的Google Gemini age", "content": "【传媒周观点261011】锐度交易关注AI多模态与互动内容 AI：本周Claude Haiku 5.5（输入不超过100K时，API较前代下降90%）发布，模型能力提升与价格下探同步推进，行业价格竞争持续加剧。应用端，继Muse后，OpenAI Dots、面向办公的Google Gemini agent等产品近期陆续推出，海外厂商持续加码个人Agent，应用场景向生活服务与办公协作拓展。我们认为，成本下降为Agent规模化使用提供基础，云端电脑为当前较好解决方案。基建层+入口看好阿里、腾讯；#互动内容工具关注Miniamx。近期产业调研反馈，后续半年内#数据&训练算力将会持续成为基模重点投入方向；核心仍是服务于大参数模型训练。 广告营销：程序化广告景气度持续，#推荐关注汇量科技，26Q4新系统上线，有望见证收入弹性；此前unity已通过新算法验证弹性，关注汇量是否为行业第三家。公司持续进行多次回购。线下品牌广告赛道，分众收购新潮获反垄断附条件通过，标志着梯媒行业整合取得重要进展，若收购交易完成，并表将带来收入增厚，业务上，分众与新潮点位互补，形成更加全面的媒体覆盖，以及达成数字化协同，建议关注。 影视：建议关注AI+影视内容方向的催化，近期各细分领域皆有AI赋能的新产品边际变化，看好反复存在交易机会。11月或有实时互动类模型+匹配内容发布，字节AI互动游戏《不问凡尘》已上线。AI+互动剧/互动影游关注德才股份（旗下奇想无限与抖音平台合作推出AI互动剧《零号档案：降临》，自有Agent工具成熟度高），AI+长剧/综艺关注内容侧的华策影视、平台侧芒果超媒等。电影侧后续关注潜在大片《流浪地球3》与高质量AI内容的刺激，关注中国电影、博纳影业（《三星堆：未来往事》定档2026年10月23日）。 游戏：低估值+高景气度，用户消费赛道中的韧性板块；建议首要关注游戏出海的世纪华通、此外建议关注恺英、巨人、完美、吉比特以及三七等公司。港股建议关注心动（Q3TAP 平台广告收入改善）、腾讯、网易等公司。 近期参加硅谷AI产业座谈，下周会有更完整分享，部分要点： 1，部分一级关注度阶段性重回应用；海外创业团队热衷基于开源模型的后训练微调。前者关注personal agent和视频实时互动内容（包括更宽泛的interactive），后者关注行业数据与模型的适配和实际落地；目前大量微型创业团队基于Kimi、Qwen、GLM与minimax的海螺开展业务。 2，大模型的能力上限基于算力集群和数据的提升，海外数据公司正在基于大模型的训练需求构建高质量数据，A社在尝试高质量定制数据&行业benchmark+大集群+AI参与（RSI）的快速小版本训练（压缩到周度迭代）。 3，science、RSI、安全仍是热门话题；海外在讨论未来支持本土的开源模型发展。#文字观点", "publish_time": "2026-10-11 17:34", "tags": ["互动内容工具关注Miniamx", "文字观点"]}, "post:2026-10-11T23-31:29a901acd3c5": {"id": "post:2026-10-11T23-31:29a901acd3c5", "kind": "post", "title": "2026-10-11 23:31", "source_label": "帖子正文", "excerpt": "🔥【GLMS电子|#存储】长鑫4F²年底亮相：架构创新打开“去EUV”追赶路径 🚀事件：长鑫存储总裁曹堪宇在第四届集成芯片和芯粒大会上宣布，预计年底推出融合4F²架构与混合键合技术的新一代DDR5 RDIMM产品 🤔我们认为：4F²的意义不止于密度提升，更在于用架构创新替代单纯制程微缩，为国产DRA", "content": "🔥【GLMS电子|#存储】长鑫4F²年底亮相：架构创新打开“去EUV”追赶路径 🚀事件：长鑫存储总裁曹堪宇在第四届集成芯片和芯粒大会上宣布，预计年底推出融合4F²架构与混合键合技术的新一代DDR5 RDIMM产品 🤔我们认为：4F²的意义不止于密度提升，更在于用架构创新替代单纯制程微缩，为国产DRAM打开一条不依赖最先进光刻机的追赶路径 🎁投资建议：关注技术升级带来的投资机遇 1️⃣ 份额追赶：4F²单元面积较主流6F²理论缩小约30%，若良率与服务器认证顺利，长鑫在DDR5及服务器市场有望加速上量。#国产DRAM2️⃣ 去EUV路径：4F²与阵列/外围分工键合（CBA）搭配，通过结构设计与堆叠获取密度收益，降低对最先进光刻节点的依赖——对受出口管制的长鑫，这是战略级“换道”而非普通工艺升级。#自主可控3️⃣ 设备材料增量：高深宽比刻蚀、薄膜沉积、CMP、键合与量检测价值量全面提升，国产设备材料迎来技术迭代+产线改造双轮驱动。#设备材料🌹建议关注： ➠4F²及CBA：长鑫科技、晶合集成等 ➠设备：拓荆科技、华海清科、中科飞测、强一股份等 ➠材料：鼎龙股份、上海新阳等 ⚠️风险提示：长鑫4F²技术推进不及预期；国产设备材料导入不及预期#文字观点", "publish_time": "2026-10-11 23:31", "tags": ["存储", "国产DRAM", "自主可控", "设备材料", "文字观点"]}, "post:2026-10-11T22-06:be8ae1c870e5": {"id": "post:2026-10-11T22-06:be8ae1c870e5", "kind": "post", "title": "2026-10-11 22:06", "source_label": "帖子正文", "excerpt": "这个周末消息是偏暖的，监管出了一系列组合拳！这无疑有利于市场情绪修复。", "content": "这个周末消息是偏暖的，监管出了一系列组合拳！这无疑有利于市场情绪修复。 1、周末监管层召开座谈会。周六，吴清在北京主持召开了一场 “资本市场和金融形势专家座谈会”。 重点强调了：要建设资本市场，更好回报广大投资者，还提及研究储备更多增量政策工具等。 2、降低公募新基金的成立门槛。混合基金、FOF的成立门槛由2亿元、2亿份大幅降至5000万元、5000万份，利好中小型基金公司。 在市场低迷时，这个降门槛是好事，能带来更多的增量资金。 3、新质生产力顶层文件落地。中共中央、国务院印发《关于发展新质生产力的意见》。 再次明确了新质生产力的方向，人工智能等新兴科技和自主可控还是未来担当。对A股来说，这个文件肯定是催化，尤其对科技股。 4、财政部释放重磅利好 5500亿地方债结存限额启用。其中3000亿给县区保工资，2500亿给经济大省搞项目。同时喊话四季度加快花钱，这是宏观经济要发力了。 财政部还发布工作报告，谈了6个发力的方向，其中第一是更积极的财政措施，第二位就是支持全方位扩大内需。更加积+全方位的表述，说明了紧迫性！ 5、中欧会谈结果比预期要好。中欧发表共同声明，达成了四大领域的16项成果共识，这给双边经贸关系带来积极信号。#文字观点", "publish_time": "2026-10-11 22:06", "tags": ["文字观点"]}, "post:2026-10-11T14-02:afe894ffcef6": {"id": "post:2026-10-11T14-02:afe894ffcef6", "kind": "post", "title": "2026-10-11 14:02", "source_label": "帖子正文", "excerpt": "【9月国内销量跟踪】已公布车企/车型9月销量合计144.8万辆，同比+11%，环比+11%【中信建投电新·锂电】#比亚迪(乘用车):销量456713辆，同比+16.2%，环比+5.4%；#主要系海外销量大幅增长，纯电车型出口放量。", "content": "【9月国内销量跟踪】已公布车企/车型9月销量合计144.8万辆，同比+11%，环比+11%【中信建投电新·锂电】#比亚迪(乘用车):销量456713辆，同比+16.2%，环比+5.4%；#主要系海外销量大幅增长，纯电车型出口放量。#特斯拉:交付95366辆，同比+5%，环比+10.7%#蔚来:交付37408辆，同比+7.7%，环比+4.4%#理想:交付31817辆，同比-6.3%，环比-15.6%#小鹏:交付41256辆，同比-0.8%，环比+5.5%#零跑:交付105656辆，同比+58.5%，环比+2.5%#广汽埃安:销量43059辆，同比+47.9%，环比+9.8%#岚图:交付13025辆，同比-14.4%，环比+0.2%#赛力斯:销量25370辆，同比-43.2%，环比+22.8%#长安:销量102968辆，同比+6%，环比+80.4%#北汽蓝谷:销量25284辆，同比+23.1%，环比+17.8%#智己:销量8000辆，同比-27.8%，环比+29.8%#一汽红旗:销量10234辆，同比-40.2%，环比+170.3%#吉利:销量188800辆，同比+14.3%，环比+8.7%#上汽通用:销量17620辆，同比+72.7%，环比+39.2%#五菱:销量77676辆，同比-22.8%，环比+9.5%#小米:销量40000辆，同比-4.6%，环比+33.3%；#澎程系列首月交付超1万辆#奇瑞:销量127486辆，同比+49.3%，环比+10.3% 🚀预计9月国内电车销量180万辆（含商用），同比+12%，环比+10%#文字观点", "publish_time": "2026-10-11 14:02", "tags": ["比亚迪(乘用车)", "特斯拉", "蔚来", "理想", "小鹏", "零跑", "广汽埃安", "岚图", "赛力斯", "长安", "北汽蓝谷", "智己", "一汽红旗", "吉利", "上汽通用", "五菱", "小米", "澎程系列首月交付超1万辆", "奇瑞", "文字观点"]}, "post:2026-10-11T09-21:bc202f6e71dd": {"id": "post:2026-10-11T09-21:bc202f6e71dd", "kind": "post", "title": "2026-10-11 09:21", "source_label": "帖子正文", "excerpt": "我们认为本次337调查对立讯精密影响极为有限！第一次针对台达，后面两次持续扩大到整个谷歌电源供应链连上下游和系统厂一起，结合其持续扩大诉讼范围的策略判断，其关注重点可能已不仅限于单一供应商，最终意图或在于对下游终端客户及整个产业链形成压力。", "content": "我们认为本次337调查对立讯精密影响极为有限！ 第一次针对台达，后面两次持续扩大到整个谷歌电源供应链连上下游和系统厂一起，结合其持续扩大诉讼范围的策略判断，其关注重点可能已不仅限于单一供应商，最终意图或在于对下游终端客户及整个产业链形成压力。 目前，第二起 337 调查中 Vicor 的推进并不顺利。在第二案尚未结束的情况下，其即提起第三起调查，也反映出其希望通过新增案件进一步施压、扩大影响的策略。 Vicor过去几年同部分终端客户交恶，关键在Vicor自己没有量产能力，之后一直骚扰客户和行业友商。对方并非针对某几家中国公司，这是对方第三次启动337，前两次对方没有优势，故继续扩大声势。 立讯的VPD电源技术很领先，持续看好。#文字观点", "publish_time": "2026-10-11 09:21", "tags": ["文字观点"]}, "post:2026-10-11T19-23:4433f6d10ad4": {"id": "post:2026-10-11T19-23:4433f6d10ad4", "kind": "post", "title": "2026-10-11 19:23", "source_label": "帖子正文", "excerpt": "关于野村fcc的报告，围绕65%bom做的拆解，总结： 核心不是“光模块要被禁”，而是讨论一个潜在豁免情景： 如果中国光模块厂向美国 AIDC 客户交付 800G/1.6T/3.2T 光收发模块时，美国元器件占 BOM 成本 ≥65%，可能仍不被 FCC/美国新规挡在门外。下面把报告拆成几点。", "content": "关于野村fcc的报告，围绕65%bom做的拆解，总结： 核心不是“光模块要被禁”，而是讨论一个潜在豁免情景： 如果中国光模块厂向美国 AIDC 客户交付 800G/1.6T/3.2T 光收发模块时，美国元器件占 BOM 成本 ≥65%，可能仍不被 FCC/美国新规挡在门外。 下面把报告拆成几点。 一、为什么会有“65% US content”这个说法 ● 美国对无人机等行业已有类似规则：“Buy American”要求美国内容 >65%。 ● 光通信行业投资者把这套逻辑套到下一代光模块上：中国厂商（中际，xys等）若想继续供美国云厂/AIDC，可能需要把关键芯片换成美国供应链。 二、800G / 1.6T 光模块 BOM 里，美国强在哪 野村估算： ● 光芯片（EML/硅光激光源）：14–23% BOM ● DSP（Marvell / Broadcom / Credo 等）：大头 ● TIA+Driver（Marvell / Broadcom / MACOM / Semtech） ● PD 光探测芯片（MACOM） ● 合计：光学芯片 + DSP + TIA/Driver + PD ≈ 66–72% BOM 也就是说： 只要 DSP 和电芯片本来就用美国货，再把部分光芯片从国产切到 Lumentum / Coherent / Broadcom，冲到 65% 美国含量并不离谱。 三、对各环节的影响 1. 中国光模块厂：中性偏正 ● ：业务连续性不被打断 ● 代价：被迫买更贵/更紧的美国芯片 → 毛利承压、供应链更受美国卡 ● 但头部厂研发和供应链管理强，高端 800G/1.6T 地位仍能保住 2. 美国芯片厂：相对利好 ● Marvell、Broadcom、MACOM、Semtech、Lumentum、Coherent ● 高端 DSP / 光芯片 / TIA 话语权提升，可能拿份额和定价权 3. 国产芯片厂：承压 ● 源杰过去 1–2 年海外放量，若 65% 规则落地，替代逻辑被砸 ● 优讯、芯思杰、仕佳/源杰类 PD/电芯片：在 1.6T 里本来就没进主链，压力更大 4. 被动件 / PCB / 结构件：影响小 ● 深南、胜宏、TFC、CCTC 等 ● 占 BOM 低、全球分散，65% 规则主要卡“高价值半导体”，不卡这些。#文字观点", "publish_time": "2026-10-11 19:23", "tags": ["文字观点"]}, "post:2026-10-11T20-27:849ec591fbd4": {"id": "post:2026-10-11T20-27:849ec591fbd4", "kind": "post", "title": "2026-10-11 20:27", "source_label": "帖子正文", "excerpt": "【中信通信】不畏浮云遮望眼，持续看好光通信20261011 国庆以来，针对AI硬件“人为制造的利空”明显增加。尽管在FCC主席对外公布的2026年10月29日公开委员会会议暂定议程里看不到任何光通信的议题，但仍在一周时间内陆续发酵三件事——某外资通过所谓专家口径猜测未来光模块设置65%BOM源自北美", "content": "【中信通信】不畏浮云遮望眼，持续看好光通信20261011 国庆以来，针对AI硬件“人为制造的利空”明显增加。尽管在FCC主席对外公布的2026年10月29日公开委员会会议暂定议程里看不到任何光通信的议题，但仍在一周时间内陆续发酵三件事——某外资通过所谓专家口径猜测未来光模块设置65%BOM源自北美的要求、美国军工要求PCB自主的旧闻重提、Vi­c­or第三次发起337调查针对全球电源产业链。我们不去揣测人为制造利空的背后意图，但从目前已有公开消息来看，绝大多利空都是捕风捉影、毫无证据。从中长期看，我们认为假利空对股价的影响将逐步钝化，建议重点关注AI技术升级和中国AI硬件的不可替代性，持续看好光通信核心卡位的公司。 下周看点：OCP大会的光互联技术展示 2026年10月12日至15日，2026OCP Gl­o­b­al Su­m­m­it（开放计算项目全球峰会）将在美国加利福尼亚州圣何塞举行，旭创、立讯、华工、纳真、华为等中国公司参会。OCP将在NPO、CPO、OCS、XPO、相干光、光模块液冷、外置激光器、VC­S­EL、多芯光纤等领域展开详细讨论。OCP含金量较高，建议关注新技术迭代。 持续推荐： 1、无源光器件：NPO、CPO等带来无源器件价值量爆发，高通道FAU等产品壁垒和利润率高，无源公司进入业绩加速爆发期。关注：#蘅东光、仕佳、汇聚、太辰光、致尚、天孚等。 2、关注超跌光芯片：#源杰、长光、仕佳、东山等。目前没有任何光芯片公司听说海外会对国产芯片做出限制，各光芯片公司的高功率激光器进展顺利。 3、关注高性价比、基本面好的光互联公司：#中际旭创、立讯精密、光迅科技、汇绿生态、纳真科技等#文字观点", "publish_time": "2026-10-11 20:27", "tags": ["文字观点"]}, "post:2026-10-11T13-52:c399f3ea4ddb": {"id": "post:2026-10-11T13-52:c399f3ea4ddb", "kind": "post", "title": "2026-10-11 13:52", "source_label": "帖子正文", "excerpt": "紫光股份：AI 服务器与交换机推动增长，超节点业务扩张；中性评级我们看好中国 AI 服务器领域的投资机会，预计紫光股份将持续受益于基础设施上行周期。", "content": "紫光股份：AI 服务器与交换机推动增长，超节点业务扩张；中性评级我们看好中国 AI 服务器领域的投资机会，预计紫光股份将持续受益于基础设施上行周期。公司的超节点（SuperPod）是一套整合计算与网络的整体解决方案，其中计算部分搭载国产芯片平台驱动的 AI 服务器，通过纵向扩展与横向扩展模式提升计算性能。虽然我们看好公司 AI 服务器业务，该业务将乘着国内云厂商加大 AI 基础设施资本开支的东风实现发展，但鉴于估值处于相对合理水平，我们给予中性评级。 交换机升级与光互联业务：💡受智算领域投资持续增加带动，紫光股份预计 400G/800G 数据中心交换机的上量速度将会进一步加快。 公司同时正在推进光互联相关解决方案的研发，涵盖共封装光学（CPO）源头内容加微WUXL3408、近封装光学（NPO）、光电路交换机（OCS）相关产品开发。 管理层表示，公司正与云服务商客户联合开发单芯片带宽可达 51.2T 的共封装光学硅光交换机产品；公司在软件实现与调试层面具备自身优势，这同样也是光电路交换机（OCS）技术的关键。 我们看好紫光股份在光互联方向的产品研发进展，相关产品可以补强公司在网络与高速互联领域的整体解决方案能力。 全液冷整机柜与超节点（SuperPod）业务：🚀紫光股份推出了液冷整机柜产品，加快液冷技术验证落地以及对应需求的满足进程。 公司的超节点产品面向搭载超过 1000 张 GPU 的计算集群场景。 公司计划和云服务商客户开展联合开发，充分发挥自身硬件与网络层面的技术能力。 盈利预测调整：📉我们将 2026‑2028 年预期净利润分别下调 5%、8%、4%；调整背景是预期营收抬升，但营业利润率有所下行。 该调整反映出我们看好公司 AI 服务器放量、交换机规格升级的判断。 与此同时，我们上调费用率假设，用来体现公司新产品研发带来研发费用的增长，预测 2025‑2030 年公司研发费用复合年均增长率为 11%。 基于 2026 年预期 29.8 倍市盈率（此前为 30.4 倍），我们得出 12 个月目标价 28.6 元人民币，此前目标价为 30.8 元人民币。#文字观点", "publish_time": "2026-10-11 13:52", "tags": ["文字观点"]}, "post:2026-10-11T17-37:5cc165c47242": {"id": "post:2026-10-11T17-37:5cc165c47242", "kind": "post", "title": "2026-10-11 17:37", "source_label": "帖子正文", "excerpt": "开放计算项目大会前瞻：解读云数据中心设计发展趋势 开放计算项目大会（OCP）将进一步明晰超大规模互联网公司 AI 网络架构的发展方向，以及 NPO/CPO 技术的落地路径。过去数周行业已经出现多项积极进展，但本次大会对股价带来的催化影响预计相对有限。", "content": "开放计算项目大会前瞻：解读云数据中心设计发展趋势 开放计算项目大会（OCP）将进一步明晰超大规模互联网公司 AI 网络架构的发展方向，以及 NPO/CPO 技术的落地路径。 过去数周行业已经出现多项积极进展，但本次大会对股价带来的催化影响预计相对有限。 核心要点 超大规模互联网公司的主题演讲，将帮助市场更加清晰地了解其架构迭代方向，以及能够共建的行业通用生态方案。 继欧洲光通信大会（ECOC）之后，NPO/CPO 技术依旧是行业核心讨论焦点，商业化落地时间与实现方式将成为关注重点。 大会会持续带来网络技术创新与产品发布，但如果没有客户确定性的订单承诺，对短期股价的拉动作用有限。 供给扩张、客户落地采用、毛利率改善依旧是决定相关公司股价的核心驱动要素。 我们继续优先看好是德科技（KEYS）；LITE、COHR 股价对于 NPO/CPO 技术进展的敏感度更高。 虽然这类行业会议总会带来股价层面的消息面风险，尤其对 Arista（ANET）影响较为明显，但过去数周的股价变动大概率已经提前消化相关利好预期。 我们下周将出席在圣何塞举办的开放计算项目（OCP）大会。 超大规模互联网公司的研讨内容，将进一步揭开下一代 AI 网络架构的细节。 OCP 大会的核心议题是：超大规模厂商如何共同寻找解决方案，应对向高速数据中心网络演进过程中遇到的各类挑战，包括功耗、散热、成本、布线、生态体系等问题。 虽然各家超大规模公司的技术架构各不相同，但本次会议可以直接听到客户视角下的架构演进方向，而不是行业展会里供应商单方面输出的观点。 我们预计市场会重点关注纵向扩展网络架构，该领域正发生最多技术迭代，可参考我们此前发布的纵向扩展专题报告。 会上预计会针对互联交换架构、铜缆与光模块取舍、CPO/NPO 落地时间与架构方案展开激烈讨论。 NPO/CPO 商业化落地时间、架构方案是本次大会最大焦点。 继 ECOC 大会上供应商普遍对 2028 年前后 NPO 初步落地表达更强信心之后，我们期待 OCP 能够进一步明确超大规模厂商的设计偏好以及商业化部署路径。 Open CPX 多源协议联盟取得的进展，搭建了兼容性更强的行业生态，缓解了今年早些时候市场对于私有封闭架构的担忧。 围绕 OpenCPX、XPO、外部激光器架构的讨论，会进一步揭示 NPO 如何完成从可插拔光模块向完整 CPO 方案过渡，尤其当下功耗与信号完整性约束带来的挑战越来越严峻。 虽然市场空间扩张对于 LITE、COHR 属于利好，但客户依旧在权衡性能、成本、可维护性三者之间的取舍，预示多种架构方案可能会共存，并且经历多代产品迭代。 行业会持续出现网络技术创新，但对股价的短期影响有限。 除光封装技术之外，OCP 大会还会探讨基于以太网的纵向扩展网络、光电路交换（OCS）、更高密度交换，以及功耗散热对大型 AI 集群的支撑作用。 大会期间会出现多项产品、合作、标准发布，但很多内容会印证 OFC、ECOC 展会之后投资者已经充分理解的行业趋势。 正如我们 ECOC 会后报告所分析，光模块需求旺盛、长期业务增量具备支撑，但股价下一阶段的表现，将更多取决于供给增量、客户落地、毛利率改善，而不单单依靠技术发布会。 我们依旧看好是德科技 KEYS，该公司可以受益于多种架构路线；LITE 与 COHR 股价则对 NPO/CPO 的技术进展尤为敏感。#文字观点", "publish_time": "2026-10-11 17:37", "tags": ["文字观点"]}, "post:2026-10-11T19-23:3ad74b8e5f55": {"id": "post:2026-10-11T19-23:3ad74b8e5f55", "kind": "post", "title": "2026-10-11 19:23", "source_label": "帖子正文", "excerpt": "核心观点：#长期来看，基于目前全球航运船队老龄化及新能源化的底层逻辑，叠加全球地缘政治冲突激烈化、全球贸易格局碎片化趋势，集装箱船、油轮、散货船行情轮动交替演绎，我们判断本轮造船景", "content": "【中信机械】造船行业周度更新系列（30）：运价继续创历史新高，新船价格连续7月环比上涨，造船&海工长景气周期趋势向好，重点看好#松发股份、中国船舶、中集集团、中国动力#运价创历史新高，二手船与新船价格大幅倒挂： 本周Clarksons新船价格指数186.7点，自26年3月以来环比继续7月上涨。二手船价格指数达224.0点，环比上月上涨2.8%，继续突破前高。本周Clarksons综合运价平均达84951美元/天，继续创历史新高。目前新船价格与二手船价格出现大幅倒挂，根据Clarksons数据，目前一艘3年内VLCC现船价格达1.8亿美金，而一艘VLCC新造船价格仅1.3亿美金。 #2026Q1~Q3新船订单创2007年以来新高： 2026年9月全球新船订单约800万CGT/220亿美金，同比分别增长13%/12%。2026年Q1~Q3全球造船订单约7071万CGT/2050亿美金（油轮/集装箱船/散货船/气体运输船分别占比30%/28%/15%/14%），分别同比增长57%/55%，新船订单量超过2024年前高，创2007年以来新高。目前全球造船厂在手订单约2.26亿CGT/6.01亿DWT，在手订单保障年数4.56年，造船行业景气持续。#核心观点：#长期来看，基于目前全球航运船队老龄化及新能源化的底层逻辑，叠加全球地缘政治冲突激烈化、全球贸易格局碎片化趋势，集装箱船、油轮、散货船行情轮动交替演绎，我们判断本轮造船景气周期可持续至2030年以后。 #短期来看，我们看好2026年造船行业复苏行情，全球新造船订单自25年11月以来延续强劲复苏态势（美国关税/301调查谈判落地、叠加下游油运市场景气持续上行），新船价格指数自26年3月以来已经连续上涨，当下中船、恒力、扬子江等主要船厂业绩已呈现加速释放态势，随着行业贝塔复苏，无论从行业景气度、业绩的确定性和弹性还是估值性价比角度看（#松发股份、中国船舶2027年PE约10倍左右（Wind一致预期）），造船行业为2026值得重点关注和配置的板块，当前时点作重点推荐。#重点关注标的：恒力重工、中集集团、中国船舶、中国动力、扬子江、船舶ETF、苏美达、中船防务H、中国船舶租赁、纽威股份、亚星锚链。欢迎联系中信机械团队交流，获取相关公司和行业PPT、模型等资料以及造船行业数据库~#文字观点", "publish_time": "2026-10-11 19:23", "tags": ["核心观点", "重点关注标的", "文字观点"]}, "post:2026-10-11T21-02:07f10b548d19": {"id": "post:2026-10-11T21-02:07f10b548d19", "kind": "post", "title": "2026-10-11 21:02", "source_label": "帖子正文", "excerpt": "【国海通信】Lumentum产能缺口已覆盖至2029年初，国内光芯片厂商份额提升韧性仍在 2026年10月9日，Lumentum首席执行官MichaelHurlston表示，其全部", "content": "【国海通信】Lumentum产能缺口已覆盖至2029年初，国内光芯片厂商份额提升韧性仍在 2026年10月9日，Lumentum首席执行官MichaelHurlston表示，其全部光器件产能已被客户提前锁定，整体产能缺口已覆盖至2029年初，行业供需失衡的紧张态势进一步加剧。 Lumentum已积极推动产能扩张，但光芯片市场供需错配问题依旧突出 Lumentum已启动多维度扩产计划，过去两年将东京都市圈核心生产基地产能规模提升12倍，并规划投入至少3.5亿美元持续加码该基地及周边配套设施建设；同时英国卡斯韦尔工厂的产能也已完成扩容升级。但客户需求的增长速度远超产能扩张节奏，2026年4月Lumentum预计其光器件产能将全面售罄至2028年，到2026年10月整体产能缺口已覆盖至2029年初，公司多款核心产品在2027年仍有高达70%的订单无法交付，部分主力产品的供应缺口将延续至2028年，届时预计仍有30%的市场需求难以得到满足。 光器件新建产能需3-5年，国内光芯片厂商份额提升潜力可期 光器件行业新建产能周期漫长，从建厂到量产稳定交付通常需要3至5年时间。在云巨头分担资本开支的背景下，光器件产能建设有望提速，但磷化铟光器件的供应紧张格局预计仍将延续一段时间。随着AI算力需求持续提升，高速光模块出货量增加，光芯片需求将进一步释放。在此背景下，光芯片国产替代机会凸显。目前国内低速率光芯片已实现技术突破，高速率芯片正在加速追赶，国内相关企业业绩也逐步释放，份额提升潜力可期。 地缘政治博弈加速光芯片公司海外产能布局，率先在美国完成部署的厂商有望受益 随着国内光芯片公司的出货量占比持续提升，且越来越被北美P客户认可，出于供应链安全的考量，未来北美P客户可能会要求中国光芯片公司进行海外产能布局，以规避地缘政治博弈的影响。国内光芯片龙头源杰科技早在2024年底就已在美国进行产能的前瞻布局，以自有资金向全资子公司源杰新加坡增资不超过5,000万美元，并全部用于其全资子公司源杰美国建设美国生产基地，目前其美国工厂还在建设阶段。 相关标的：源杰科技、长 RAM与NAND贡献超100%总营业利润，完全抵消智能手机与晶圆代工大幅亏损；NAND ASP全球预测上调，“HBM降规”被视为增长催化剂。长鑫存储预计年底推出融合4F²架构与混合键合的新一代DDR5 RDIMM，4F²单元面积较主流6F²理论缩小约30%。\u003c/li>\n\u003cli>AI算力/大模型催化密集：政策提出全面实施“人工智能+”行动，强化算力、算法、数据等高效供给；谷歌正测试Gemini 4.0新版本模型Carbon；英伟达洽谈收购或加大投资Reflection AI、或提供计算能力；OpenAI ARR存在700亿/500亿美元口径差异，500亿为净营收口径；Claude Haiku 5.5在输入不超过100K时API价格较前代下降90%。\u003c/li>\n\u003cli>光通信/PCB制裁风险被解读为“人为制造的利空”与避险超跌：核心讨论是若美国元器件占BOM成本≥65%，中国光模块厂向美国AIDC客户交付800G/1.6T/3.2T光收发模块可能仍不被FCC/美国新规挡在门外；PCB方面，短期中国PCB行业预计不受到实质影响，PCBAA声明引发解读，板块回调被视为避险情绪下超跌。\u003c/li>\n\u003cli>新能源车与材料出现新增数据：吉利银河战舰700上市，6款车型，官方指导价18.98万-37.98万元，叠加限时换新后16.98万-35.98万元；全系47.14kWh宁德时代磷酸铁锂电池，CLTC纯电续航最高305km、综合最高1770km，6C快充10%-70%为8分25秒；电子布10月提价落地，1080规格均价环比涨13-16%至18.3元/米，中国巨石预计前9个月净利润51-54亿元、Q3同比增150-179%。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cp>\u003cstrong>1. AI算力/大模型\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：AI算力基础设施、大模型迭代与应用落地。\u003c/li>\n\u003cli>今天强化的逻辑：《关于发展新质生产力的意见》提出全面实施“人工智能+”行动，强化算力、算法、数据等高效供给；模型能力提升与价格下探同步推进，行业价格竞争持续加剧；端侧AI小模型能力持续提升，VibeCoding促使端云协作降低新品开发门槛。\u003c/li>\n\u003cli>今天出现的催化/验证：谷歌正测试Gemini 4.0 Carbon；英伟达洽谈收购或加大投资Reflection AI，或提供计算能力；OpenAI ARR的700亿/500亿美元口径差异引发市场讨论；Claude Haiku 5.5在输入不超过100K时API价格较前代下降90%。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>2. 半导体/存储/先进封装\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：存储超级周期、先进封装与国产DRAM架构创新。\u003c/li>\n\u003cli>今天强化的逻辑：存储超级周期确认，NAND ASP上修，“HBM降规”被视为增长催化剂而非风险点；DRAM与NAND贡献超100%总营业利润；成熟制程需求改善，先进制程与先进封装供给紧张程度尤其突出；ASIC专用芯片拿到更多产能分配。\u003c/li>\n\u003cli>今天出现的催化/验证：三星电子初步披露三季度营业利润107万亿韩元；长鑫存储预计年底推出融合4F²架构与混合键合技术的新一代DDR5 RDIMM；全球存储市场2026年预期营收9,401亿美元，2027年达1.41万亿美元，2030年达2.05万亿美元。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>3. 液冷/电源/337调查\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：AI服务器供电、液冷与电源产业链。\u003c/li>\n\u003cli>今天强化的逻辑：VPD垂直供电属于三次电源；立讯精密电源布局已延伸至机柜、服务器及芯片供电，系统协同构成长期竞争优势；新雷能在三次电源领域按水平供电PowerBlock和垂直供电VPD布局；台股算力9月经营显示AI服务器、液冷、存储、电源、CoWoS需求。\u003c/li>\n\u003cli>今天出现的催化/验证：USITC启动337-1526调查，立讯精密及立讯技术被列为被调查方；相关点评认为本次调查对立讯精密影响极为有限，侧面印证其电源地位与能力；鸿海9月营收月增25.70%、年增38.42%，1-9月累计营收年增39.53%。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>4. 光通信/CPO\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：光模块、CPO/OCP技术路径与FCC潜在限制。\u003c/li>\n\u003cli>今天强化的逻辑：核心不是“光模块要被禁”，而是讨论潜在豁免情景：如果中国光模块厂向美国AIDC客户交付800G/1.6T/3.2T光收发模块时，美国元器件占BOM成本≥65%，可能仍不被FCC/美国新规挡在门外；OCP将在NPO、CPO、OCS、XPO、相干光、光模块液冷、外置激光器、VCSEL、多芯光纤等领域展开详细讨论；Lumentum产能缺口已覆盖至2029年初，国内光芯片厂商份额提升韧性仍在。\u003c/li>\n\u003cli>今天出现的催化/验证：FCC主席对外公布的2026年10月29日公开委员会会议暂定议程里看不到任何光通信议题；国庆以来针对AI硬件“人为制造的利空”明显增加；开放计算项目大会前瞻对AI网络架构与NPO/CPO落地路径给出方向。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>5. PCB/CCL/铜箔/材料\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：AI材料进入业绩兑现窗口期。\u003c/li>\n\u003cli>今天强化的逻辑：科技方向短期情绪端扰动较多，但应回到业绩和产业趋势；电子布10月提价落地，绝对涨幅复制9月，景气度仍强；受印制电路板以及覆铜板厂商旺盛需求影响，同时电子纱产能扩张进度缓慢、丰田喷气织机交货周期拉长造成行业供给受限，今年截至目前电子布价格已暴涨200%，当前价格达到13.4元人民币；国产ABF膜企业预计Q4到年底开始逐步起量，整体弹性大。\u003c/li>\n\u003cli>今天出现的催化/验证：建滔积层板10月电子玻纤布均价涨幅超预期，1080规格均价环比上涨13-16%至18.3元/米，2116规格均价17.7元/米，目标价小幅上调至96港元；中国巨石预计2026年前9个月净利润同比翻倍以上至51-54亿元人民币，Q3净利润22-25亿元、同比增150-179%；PCB制裁风险短期预计不实质影响经营。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>6. 新能源车/汽车\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：新能源车新品、销量与欧盟贸易壁垒。\u003c/li>\n\u003cli>今天强化的逻辑：欧盟拟针对中国混动车型设置更高贸易壁垒，考虑临时进口配额以及额外关税，政策目标大概率指向插电式混合动力车型（PHEV）；9月国内已公布车企/车型销量合计144.8万辆，同比+11%，环比+11%；比亚迪乘用车销量456713辆，同比+16.2%，环比+5.4%，主要系海外销量大幅增长、纯电车型出口放量。\u003c/li>\n\u003cli>今天出现的催化/验证：吉利银河战舰700上市，共推出6款车型，官方指导价18.98万-37.98万元，先享指导价17.98万-36.98万元，叠加限时换新政策后16.98万-35.98万元；全系搭载47.14kWh宁德时代磷酸铁锂电池，CLTC纯电续航最高305km、综合续航最高1770km，6C快充10%-70%为8分25秒；欧盟计划采取措施将中国混合动力汽车进口量削减一半。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>美国USITC启动337-1526调查，涉及VPD、相关组件及下游计算系统，立讯精密及立讯技术被列为被调查方；相关点评认为仍处立案初期、无侵权实质认定，影响有限。\u003c/li>\n\u003cli>长鑫存储总裁曹堪宇在第四届集成芯片和芯粒大会上宣布，预计年底推出融合4F²架构与混合键合技术的新一代DDR5 RDIMM产品。\u003c/li>\n\u003cli>谷歌正测试Gemini 4.0新版本模型Carbon；英伟达正在洽谈收购美国初创公司Reflection AI或加大对其投资，或提供计算能力。\u003c/li>\n\u003cli>OpenAI ARR引发市场讨论，Axios为700亿美元、FT为500亿美元，差异来自是否包含云渠道分成；500亿美元为净营收口径，需扣除分给微软的20%收益、亚马逊Bedrock渠道分成。\u003c/li>\n\u003cli>三星电子初步披露三季度营业利润107万亿韩元，基本符合预期，DRAM与NAND贡献超100%总营业利润。\u003c/li>\n\u003cli>吉利银河战舰700于10月10日上市，官方指导价18.98万-37.98万元，叠加限时换新后16.98万-35.98万元，全系47.14kWh宁德时代磷酸铁锂电池，6C快充10%-70%为8分25秒。\u003c/li>\n\u003cli>电子布10月提价落地，1080规格均价环比上涨13-16%至18.3元/米，2116规格均价17.7元/米；中国巨石预计前9个月净利润51-54亿元，Q3同比增150-179%；建滔积层板目标价小幅上调至96港元。\u003c/li>\n\u003cli>PCB制裁风险方面，事件起因为9月中旬美国印刷电路板协会发布声明，敦促美国国防部严格执行于2027年1月1日起的军工PCB供应链调整和限制；10月起市场关注以FCC光通限制为代表的制裁风险，部分将PCBAA声明解读为PCB制裁，板块大面积回调，但短期中国PCB行业预计不受到实质影响。\u003c/li>\n\u003cli>欧盟正在加大对中国混动车型的施压，考虑对中国混动车辆实施临时进口配额以及额外关税，政策目标大概率指向PHEV。\u003c/li>\n\u003cli>9月国内销量：已公布车企/车型合计144.8万辆，同比+11%，环比+11%；比亚迪乘用车销量456713辆，同比+16.2%，环比+5.4%。\u003c/li>\n\u003cli>宏观方面：前三季度政府债累计发行11.1万亿，同比少0.9万亿，发行进度77%，同比慢6%，考虑结存限额后年内剩余3.3万亿未发；5500亿结存限额落地，长端利率回升；美国财政赤字长期高企，仅7月单月政策赤字近4300亿，国债下半年发行加快。\u003c/li>\n\u003cli>证监会召开重要座谈会，邀请部分上市公司负责人、证券基金机构专家深入交流，充分听取意见建议；分众传媒收购新潮传媒股权附条件获批。\u003c/li>\n\u003cli>机器人方面：比亚迪人形机器人外观公布；特斯拉得州Optimus工厂最新施工画面曝光，预计钢结构月内完工。\u003c/li>\n\u003cli>脑机接口方面：东星医疗拟与常州国星投资管理有限公司共同投资设立控股子公司常州灵脑智能科技有限公司，聚焦医疗类脑机接口、脑神经疾病、精神系统疾病相关器械研发；Precision Neuroscience宣布完成2.5亿美元D轮融资。\u003c/li>\n\u003cli>AI安全方面：白宫《超级智能协议》签署，模型安全须引入独立外部评估；微软CEO纳德拉表示，公司应该将强大的人工智能模型视为潜在内部威胁，假设它们可能受到损害，并创建一个“紧急制动”系统。\u003c/li>\n\u003cli>苹果供应链消息称，苹果已调整2026年秋季iPhone产品线订单，iPhone Duo订单增加30%，尽管总订单仍低于1000万台。\u003c/li>\n\u003cli>锂电设备方面：工信部等7部门联合印发《新型电池产业发展“十五五”规划》，提出到2030年全固态电池初步规模化应用、长寿。\u003c/li>\n\u003cli>热界面材料方面：AI GPU/ASIC、HBM与高速光模块功耗和封装密度同步提升，热量需要依次穿过TIM1、Lid、TIM2、冷板，TIM配置不再只依赖标称导热系数适配，材料、结构与工艺共同决定实际散热效果。\u003c/li>\n\u003cli>硬件与网络设备方面：AI与涨价推动预测上调，服务器、数据中心以太网交换机、数据中心互联及外部存储市场规模和AI基建投资相关产品市场增长前景强劲，2026-2030年复合增速分别为数据中心互联DCI +43%、数据中心以太网交换机 +36%。\u003c/li>\n\u003cli>化工方面：铪涨价有望延续，三祥新材已实现电子级氧氯化铪的产出；全球炼化格局重塑，民营大炼化稀缺性凸显，或迎来“估值回归”时刻。\u003c/li>\n\u003cli>传媒方面：近一周A股申万传媒指数涨2.70%、沪深300跌0.93%、上证指数跌0.74%、创业板指数跌2.93%；海外恒生指数涨1.00%、恒生科技指数涨0.96%、纳斯达克指数涨0.64%。微信官方短剧小程序绿泡泡正式上线，采用免费观看+广告变现IAA模式；国内首部AI超写实院线电影《三星堆：未来往事》定档10月23日登陆全国院线。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>337调查后续：仍处立案初期、无侵权实质认定，跟踪对立讯精密及AI服务器电源、液冷产业链的影响。\u003c/li>\n\u003cli>长鑫4F²架构进展：预计年底推出新一代DDR5 RDIMM产品，跟踪良率与服务器认证；若顺利，长鑫在DDR5及服务器市场有望加速上量。\u003c/li>\n\u003cli>存储链：各家公司即将到来的财报季建设性更新指引；NAND ASP、HBM4 8叠层降规对Rubin GPU供应的影响；全球存储2026-2030年营收预测兑现情况。\u003c/li>\n\u003cli>AI算力：OpenAI年底ARR冲刺700亿美元相关验证；Tokens、ARR作为2025/26年AI产业表征指标；谷歌Gemini 4.0 Carbon后续；英伟达与Reflection AI交易进展；AI安全产品落地与Agent越权风险。\u003c/li>\n\u003cli>光通信：FCC 2026年10月29日公开委员会会议暂定议程；OCP大会对NPO、CPO、OCS、XPO、相干光、光模块液冷、外置激光器、VCSEL、多芯光纤的落地路径；65% BOM豁免情景是否被进一步验证。\u003c/li>\n\u003cli>PCB/材料：10月电子布提价后的价格持续性；国产ABF膜企业Q4到年底逐步起量；AI材料进入业绩兑现窗口期；PCB制裁风险是否实质影响经营。\u003c/li>\n\u003cli>新能源车：欧盟对中国混动/PHEV临时进口配额及额外关税进展；比亚迪海外销量与纯电出口放量持续性；吉利银河战舰700订单与交付。\u003c/li>\n\u003cli>宏观/策略：美债利率急升与全球国债利率走高；中国财政加码、政府债发行提速、5500亿结存限额落地后长端利率变化；政策密集落地叠加加息预期缓和，市场震荡中酝酿结构性机会。\u003c/li>\n\u003cli>机器人/自动化：特斯拉得州Optimus工厂钢结构月内完工；比亚迪人形机器人后续进展。\u003c/li>\n\u003cli>脑机接口：东星医疗子公司设立、Precision Neuroscience新融资后的业务进展。\u003c/li>\n\u003cli>医药：10-11月关键催化事件；美国财政部针对《COINS法案》拟议规则通知（NPRM）的更新，厘清实施范围及对中国创新药对外授权交易的潜在影响。\u003c/li>\n\u003cli>锂电设备：工信部《新型电池产业发展“十五五”规划》提出到2030年全固态电池初步规模化应用。\u003c/li>\n\u003cli>热界面材料：高功率芯片驱动热管理从“填隙导热”转向“低热阻系统优化”，TIM材料价值重估。\u003c/li>\n\u003cli>硬件与网络设备：AI与涨价推动预测上调，2026-2030年数据中心互联DCI +43%、数据中心以太网交换机 +36%。\u003c/li>\n\u003cli>端侧AI：小模型能力提升、VibeCoding促使端云协作降低新品开发门槛，轻量模型向视觉、语音理解及工具调用拓展。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>09:04｜大摩——宁德时代（300750）：市场忽略了什么 维持宁德时代 A 股（300750.SZ）与 H 股（3750.HK）增持（Overweight）评级；行业观点为同步（In-Line）。\u003c/li>\n\u003cli>09:04｜美银——全球存储科技：三星三季度业绩、全球预测更新与“降规”影响 核心观点：超级周期确认，NAND ASP上修，降规实为增长催化剂 三星电子业绩：盈利印证存储超级周期 三星电子（SEC）初步披露三季度营业利润（OP）达107万亿韩元，基本符合本行与市场预期，进一步确认存储超级周期。分析显示：DRAM与NAND贡献超100%的总营业利润，完全抵消了智能手机与晶圆代工业务的大幅亏损\u003c/li>\n\u003cli>09:08｜分众传媒收购新潮传媒股权，附条件获批#文字观点\u003c/li>\n\u003cli>09:09｜尽管融资成本不断上涨，但科技公司今年仍在加大债券发行力度，以筹集资金用于人工智能投资。\u003c/li>\n\u003cli>09:09｜作为特朗普-普京协议的一部分，俄罗斯解除柴油出口禁令\u003c/li>\n\u003cli>09:10｜沙特阿拉伯称，周六利雅得机场遭到袭击，造成 12 人死亡，309 人受伤。这是沙特与也门胡塞武装冲突加剧 <script>
const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=(v)=>Array.isArray(v)?'<ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
