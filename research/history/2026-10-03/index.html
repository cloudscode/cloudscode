03 11:23", "source_label": "帖子正文", "excerpt": "特斯拉季度交付量强于预期 10月2日｜特斯拉周五公布的第三季度交付量超过华尔街预期，因去年欧洲市场销量低迷后，今年有所复苏。特斯拉第三季度共交付486,532辆汽车，高于分析师平均预期的456,896辆。", "content": "", "publish_time": "2026-10-03 11:23", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-03T11-21:c12be9ed4706": {"id": "post:2026-10-03T11-21:c12be9ed4706", "kind": "post", "title": "2026-10-03 11:21", "source_label": "帖子正文", "excerpt": "1. 350–400mW 高功率连续波激光器 2027 年出货目标由 1600 万台上调至 2500 万台。不受约束的市场需求约为 6000 万台，但产能构成硬性约束。", "content": "1. 350–400mW 高功率连续波激光器 2027 年出货目标由 1600 万台上调至 2500 万台。不受约束的市场需求约为 6000 万台，但产能构成硬性约束。 2. 两种不同的 NPO 架构并存：NVIDIA 的 350–400mW 外置 ELS 方案（类 CPO 可插拔设计），以及 AWS/Meta 的 120–150mW 集成式连续波方案。后者将于 2027 年下半年进入小规模试产，2028 年起大规模部署，2028 年需求将达到数千万台量级。 3. 2027 年高功率连续波生产主要依赖加州晶圆厂。2028 年 Greensboro 晶圆厂投产后，连续波总产能将至少达到 6000 万台。ELS 模块将于 2027 年下半年开始量产；前端芯片制造与泰国封装构成双重瓶颈，因此正在评估将后端外包给 Fabrinet。 4. NPO 没有统一的行业标准。“N”代表 Near（近距），描述的是一种介于 CPO 与传统可插拔光模块之间的形态，通过光学引擎与交换机基板之间的短物理距离来最小化射频信号损耗。 5. OCS 当前出货以 Google 和 Oracle 的 300 端口需求为主。Google 的 500 端口及 NVIDIA 紧凑型 OCS 将从 2028 年起成为新的增长驱动力；下一代 NVIDIA OCS 将集成至 GPU 托盘机架中，每机架使用 1–2 台，目标于 2028 年前后实现量产。 6. OCS 平均售价随产品放量而下降：早期样品价格为 1.4 万–1.5 万美元，目前量产价格已降至 1 万–1.1 万美元。公司对外保守指引 OCS 营收 4 亿美元，但内部对 2026 年 Q3+Q4 的出货预测合计至少 5,000 台。 7. OCS 产能路线图：自建泰国工厂 2027 年目标产能 16,000 台；叠加代工产能后，全年产量可提升至 20,000 台。内部 2028 年 OCS 目标为 40,000 台，进一步增长完全取决于代工厂的扩产情况。 8. 针对下一代 NVIDIA Feynman 架构，正在评估两种 CPO 光源方案：将激光功率提升至~800mW，或维持 350–400mW 功率并采用 16 波长 DWDM。最终选择取决于 SerDes 性能、系统带宽以及 NVIDIA 的架构冻结进度。 9. L 公司 800G/1.6T 光模块预测：2026 年合计出货量~250 万只（200 万只 800G，50 万只 1.6T）。2027 年目标为 400 万只，但元器件供应紧张将实际出货量限制在~150 万只。2028 年总出货量小幅增长至近 400 万只，其中~80%为 1.6T。 10. 高功率激光器的衬底供应商主要为 AXT 和住友，日本 JX 金属为备选供应商。高功率激光器目前使用 4 英寸晶圆；6 英寸晶圆的采用计划于 2028 年实施。#文字观点", "publish_time": "2026-10-03 11:21", "tags": ["文字观点"]}, "post:2026-10-03T20-09:f8d2bae05885": {"id": "post:2026-10-03T20-09:f8d2bae05885", "kind": "post", "title": "2026-10-03 20:09", "source_label": "帖子正文", "excerpt": "NPO、OCS 与高功率激光器行业要点 1. 350‑400mW 高功率连续波激光器 2027 年出货目标由 1600 万台上调至 2500 万台。不受约束的市场需求约为 6000 万台，但产能构成硬性约束。", "content": "NPO、OCS 与高功率激光器行业要点 1. 350‑400mW 高功率连续波激光器 2027 年出货目标由 1600 万台上调至 2500 万台。不受约束的市场需求约为 6000 万台，但产能构成硬性约束。 2. 两种不同的 NPO 架构并存：英伟达的 350‑400mW 外置 ELS 方案（类 CPO 可插拔设计），以及 AWS/Meta 的 120‑150mW 集成式连续波方案。后者将于 2027 年下半年进入小规模试产，2028 年起大规模部署，2028 年需求将达到数千万台量级。 3. 2027 年高功率连续波生产主要依赖加州晶圆厂。2028 年 Greensboro 晶圆厂投产后，连续波总产能将至少达到 6000 万台。ELS 模块将于 2027 年下半年开始量产；前端芯片制造与泰国封装构成双重瓶颈，因此正在评估将后端外包给 Fabrinet。 4. NPO 没有统一的行业标准。“N” 代表 Near（近距），描述的是一种介于 CPO 与传统可插拔光模块之间的形态，通过光学引擎与交换机基板之间的短物理距离来最小化射频信号损耗。 5. OCS 当前出货以谷歌和甲骨文的 300 端口需求为主。谷歌的 500 端口及英伟达紧凑型 OCS 将从 2028 年起成为新的增长驱动力；下一代英伟达 OCS 将集成至 GPU 托盘机架中，每机架使用 1‑2 台，目标于 2028 年前后实现量产。 6. OCS 平均售价随产品放量而下降：早期样品价格为 1.4 万‑1.5 万美元，目前量产价格已降至 1 万‑1.1 万美元。公司对外保守指引 OCS 营收 4 亿美元，但内部对 2026 年第三季度 + 第四季度的出货预测合计至少 5000 台。 7. OCS 产能路线图：自建泰国工厂 2027 年目标产能 16000 台；叠加代工产能后，全年产量可提升至 20000 台。内部 2028 年 OCS 目标为 40000 台，进一步增长完全取决于代工厂的扩产情况。 8. 针对下一代英伟达 Feynman 架构，正在评估两种 CPO 光源方案：将激光功率提升至约 800mW，或维持 350‑400mW 功率并采用 16 波长 DWDM。最终选择取决于 SerDes 性能、系统带宽以及英伟达的架构冻结进度。 9. L 公司 800G/1.6T 光模块预测：2026 年合计出货量约 250 万只（200 万只 800G，50 万只 1.6T）。2027 年目标为 400 万只，但元器件供应紧张将实际出货量限制在约 150 万只。2028 年总出货量小幅增长至近 400 万只，其中约 80% 为 1.6T。 10. 高功率激光器的衬底供应商主要为 AXT 和住友，日本 JX 金属为备选供应商。高功率激光器目前使用 4 英寸晶圆；6 英寸晶圆的采用计划于 2028 年实施。#文字观点", "publish_time": "2026-10-03 20:09", "tags": ["文字观点"]}, "post:2026-10-03T11-23:9bf2fe11c91c": {"id": "post:2026-10-03T11-23:9bf2fe11c91c", "kind": "post", "title": "2026-10-03 11:23", "source_label": "帖子正文", "excerpt": "摩根士丹利将英伟达列为其首选半导体 10月2日｜摩根士丹利重新将英伟达列为其首选半导体股，理由是英伟达拥有强劲的市场地位，且估值具有吸引力。目前，英伟达股价对应摩根士丹利对其2028财年盈利预期的市盈率约为15倍，与此同时，市场对其盈利的预期仍在不断上调。", "content": "摩根士丹利将英伟达列为其首选半导体 10月2日｜摩根士丹利重新将英伟达列为其首选半导体股，理由是英伟达拥有强劲的市场地位，且估值具有吸引力。目前，英伟达股价对应摩根士丹利对其2028财年盈利预期的市盈率约为15倍，与此同时，市场对其盈利的预期仍在不断上调。摩根士丹利表示，人工智能产业的瓶颈正从芯片供应转向数据中心建设和融资；与此同时，英伟达拥有广泛的全球客户基础，因此能够灵活地根据可获得的电力容量拓展业务。#文字观点", "publish_time": "2026-10-03 11:23", "tags": ["文字观点"]}, "attachment:files/中原证券-计算机行业月报：国产芯片发布计划大幅提前，算力投入呈现加速趋势-260930.pdf": {"id": "attachment:files/中原证券-计算机行业月报：国产芯片发布计划大幅提前，算力投入呈现加速趋势-260930.pdf", "kind": "attachment", "title": "中原证券-计算机行业月报：国产芯片发布计划大幅提前，算力投入呈现加速趋势-260930", "source_label": "中原证券", "excerpt": "第1页/共57页本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明计算机 分析师：唐月 登记编码：S0730512030001 tangyue@ccnew.com021-50586737国产芯片发布计划大幅提前，算力投入呈 现加速趋势 ——计算机行业月报", "content": "第1页/共57页本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明计算机 分析师：唐月 登记编码：S0730512030001 tangyue@ccnew.com021-50586737国产芯片发布计划大幅提前，算力投入呈 现加速趋势 ——计算机行业月报 证券研究报告-行业月报 强于大市(维持) 计算机相对沪深300指数表现 资料来源：中原证券研究所，聚源 相关报告 《计算机行业月报：国内资本开支加速明显， AI硬件短缺趋势延续》2026-08-31 《计算机行业月报：国产AI产业基本面持续 向好》2026-07-31 《计算机行业半年度策略：模型、应用齐发力， 国产算力迎价值重估》2026-06-30 联系人：李智 电话：0371-65585629 地址：郑州郑东新区商务外环路10号18楼 地址：上海浦东新区世纪大道1788号T1座22楼发布日期：2026年09月30日 投资要点： 国产化：阿里新一代自研芯片V900将在2027Q1上市，较原先计 划提前了2个季度，2027年即将上市的昇腾960同样计划提前。 由于逻辑折叠的加持，在相同性能下，麒麟2026在基准测试中， NPU功耗下降66%，GPU下降58%，性能核心CPU下降41%。 在9月第二批AI训练推理芯片的安全可靠评测结果发布后，华为、 百度、阿里、壁仞、海光、天数、沐曦、摩尔线程8家芯片通过了 测评，其中华为昇腾950成为首个II级安全可靠AI芯片。鸿蒙7 在9月底开启正式版升级，鸿蒙终端数量突破8500万，2026Q2 在国内手机操作系统市场份额24%，较Q1上升5PCT。 算力：排名前10的智算企业及机构智算总规模达到1266EFLOPS， 占全国总规模的57.9%，呈现高度集中化特征。根据SemiAnalysis 数据，到2026年底，国内头部厂商的算力约为字节5.3GW、阿里 3.9GW、腾讯2.4GW、百度约1.1GW、华为约1.0GW。阿里宣布 了5万亿至10万亿参数级别的下一代模型计划，并计划将全球数 据中心容量从2022年的2GW提升至2032年的20GW，同时明确 把“超级智能”作为探索方向。 AI：由于当前Anthropic和OpenAI刚进行了一轮更新，国内模型 由于发布节奏问题，与头部差距有短暂拉大。Anthropic的Opus 5.5、OpenAI的GPT-6Astra、Meta的MuseSpark1.3、小米的 MiMo-V2.6-Pro、阿里的Qwen3.8-Max都有了不错的表现。头部模 型降价趋势明显，9月发布的Opus5.5又在Opus5基础上再降价 20%，OpenAI对9月新推出的GPT-6Sol和Luna再次降价约50%。 最新的OpenRouter的模型调用周数据显示，中国模型厂商份额达 到45%，连续两周领先较美国模型厂商（份额41%）。 给予行业强于大市的投资评级。从当前国内AI产业发展来看，资 本开支加大的趋势明显。国内虽然算力短缺，但是模型在综合能力 和性价比的比拼当中成为了更多用户的选择，调用份额持续提升。 以WorkBuddy为代表的AI办公产品，正在加速AI在B端的普及 进程。因而在这一趋势下，包括字节、阿里在内的头部厂商的投资 步伐加快明显，新一代国产芯片上市时间节点也大幅前置。建议持 续重点关注AI产业链上游及中游环节，包括半导体设备、芯片、存 储、光通信、服务器、AIDC、云计算等环节。个股方面，推荐服务 器厂商中科曙光（603019）、紫光股份（000938）、浪潮信息 （000977），AIDC厂商润泽科技（300442）、东阳光（600673）。 同时建议积极关注正在积极开展IPO的超聚变、平头哥、智谱、 9483 仅供内部参考，请勿外传！ 第2页/共57页计算机 本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明DeepSeek、Kimi、长存控股。 风险提示：国内外科技领域巨头IPO带来的市场冲击；国 2026-10-03 20:08", "tags": ["美国劳工统计局", "10月加息概率降至约23%", "G7", "不会实施柴油出口禁令", "东芝", "Amazon", "Anthropic", "甲骨文", "文字观点"]}, "post:2026-10-03T20-08:3b1801fb66ee": {"id": "post:2026-10-03T20-08:3b1801fb66ee", "kind": "post", "title": "2026-10-03 20:08", "source_label": "帖子正文", "excerpt": "华为：昇腾AI芯片中国市场份额已达50% 10月3日｜在近期举行的华为全联接大会期间，华为轮值董事长徐直军表示，昇腾系列AI芯片在中国市场的份额已达到50%，超越英伟达的8%。与2022年英伟达占据中国95%份额、昇腾仅占3%的局面相比，市场格局在四年间大幅逆转。", "content": "华为：昇腾AI芯片中国市场份额已达50% 10月3日｜在近期举行的华为全联接大会期间，华为轮值董事长徐直军表示，昇腾系列AI芯片在中国市场的份额已达到50%，超越英伟达的8%。 与2022年英伟达占据中国95%份额、昇腾仅占3%的局面相比，市场格局在四年间大幅逆转。徐直军坦言，若单看单一芯片，华为的瓶颈在于可用先进制程节点受限，但通过将大量芯片互连组成大型计算机，华为已取得全球领先地位。 当被问及华为是否有计划将昇腾950超节点推向中国以外的其他市场，徐直军表示，由于甚至没有足够的产能满足中国国内的需求，华为没有计划全面拓展国际市场。但确实有几个国家有非常强劲的需求。华为正在进行一些测试，并向这些国家提供一些供应，但数量相当有限。 此前外媒援引知情人士消息称，DeepSeek计划在内蒙古建设的大型数据中心部署至少16万颗华为下一代昇腾950DT芯片，用于模型推理。#文字观点", "publish_time": "2026-10-03 20:08", "tags": ["文字观点"]}, "post:2026-10-03T21-24:bae14fa3ee84": {"id": "post:2026-10-03T21-24:bae14fa3ee84", "kind": "post", "title": "2026-10-03 21:24", "source_label": "帖子正文", "excerpt": "国海海外宏观和大宗商品组王之凡团队 # 非农点评和大类资产配置20261003: 【非农点评】非农如期回落并低于预期，新增就业2.9万，低于市场预期，失业率升至4.2%，高于市场预期，整体偏弱。私人部门接近盈亏平衡水平。", "content": "国海海外宏观和大宗商品组王之凡团队 # 非农点评和大类资产配置20261003: 【非农点评】非农如期回落并低于预期，新增就业2.9万，低于市场预期，失业率升至4.2%，高于市场预期，整体偏弱。私人部门接近盈亏平衡水平。信息和金融再度成为拖累。失业率仍然失业率上行伴随参与率回升，需要关注劳动力回归是否长期化。薪资明显降温，让美联储10月按兵不动的理由增加，但美联储重心仍然在通胀上。美联储官员近期态度有所软化，10月加息与否仍然需要关注CPI走势。cpi目前预测同比大概率小幅反弹，重点关注核心cpi环比走向。 【基本面】宏观大概率继续维持就业降温、通胀未退的组合延续，12月加息预期目前仍存。目前紧缩节奏不明确、期限溢价高企、欧洲财政风险、原油价格仍然偏高共同影响背景下，美债收益率仍然难以明确回落。美债收益率目前是核心矛盾。中期而言，关注中选进展，中选或成为周期分水岭，后续财政政策和科技产业相关政策变化可能带来明确影响。如果民主党横扫，则财政政策可能受限制，而外交政策不确定性可能放大，如果两院分立，则外交政策和财政政策可能均受到一定限制，如果共和党继续控制两院，则财政不排除继续偏宽，外交政策不确定性也会继续放大。对于利率水平的影响，民主党横扫和两院分立下，利率水平可能相对更温和，共和党控制下，利率水平中枢不排除再度上移。 【资产配置】 1️⃣美债：短端跟随政策预期，高位震荡，长端预计继续维持高位。短期只有油价确定性回落能带动美债收益率小幅回落，但仍然难以快速缓解。关注美国中期选举对于美债收益率影响。中期而言中选结果或直接影响后续美债收益率中枢，民主党控制两院或两院分立会相对有利于收益率回落。 2️⃣美元：美联储政策仍然偏鹰，但部分官员态度有所软化。美欧利差与法国风险支撑美元震荡偏强。 3️⃣黄金：短期受实际利率和美元压制，短期震荡为主。中期而言，中期选举结果对于后续政策的影响，或影响增长水平，对黄金中期走势带来影响。长期而言，科技革命生产力演化进展仍然是决定性因素，黄金在ai彻底突破进入拓展期之前仍然有确定性。大周期维持看好。 4️⃣美股：短期靠AI盈利对冲估值压力，AI产业链上游仍然最有确定性，但对10年期利率重回5.3%以上高度敏感。阶段性顶部出现的概率上升。 5️⃣工业金属：铜在制造业扩张支撑下相对抗跌。 6️⃣原油：仍由美伊局势定价，围绕100美元宽幅波动。最大变数是油价，同时决定通胀读数、央行路径和长端利率，是各类资产共同的上游变量。 【风险点】原油再度超预期上行，cpi数据超预期 ☎详细联系：国海海外宏观&大宗商品组 王之凡, 或对口销售。🏁打分派点请打： “王之凡”/钢铁组/钢铁组王之凡/海外宏观王之凡 （根据贵司不同分类）#文字观点", "publish_time": "2026-10-03 21:24", "tags": ["文字观点"]}, "post:2026-10-03T11-21:66fa338b166e": {"id": "post:2026-10-03T11-21:66fa338b166e", "kind": "post", "title": "2026-10-03 11:21", "source_label": "帖子正文", "excerpt": "高盛——中国生物科技考察之行要点总结 高盛组织中国生物科技实地考察，走访了包括康方生物（未覆盖）、Alebund（未覆盖）、Argo Biopharma（私有）、歌礼制药、Duality（未覆盖）、翰森制药、恒瑞医药、复宏汉霖、信达生物、科伦博泰、药明康德、晶泰科技（未覆盖）等企业，并与赛诺菲中国管", "content": "高盛——中国生物科技考察之行要点总结 高盛组织中国生物科技实地考察，走访了包括康方生物（未覆盖）、Alebund（未覆盖）、Argo Biopharma（私有）、歌礼制药、Duality（未覆盖）、翰森制药、恒瑞医药、复宏汉霖、信达生物、科伦博泰、药明康德、晶泰科技（未覆盖）等企业，并与赛诺菲中国管理层及顶尖肥胖/糖尿病KOL会面。本次考察强化了我们的核心判断：中国生物科技产业当前仍以\"me-too/me-better\"资产及已知靶点重构为核心，但近期政府出台的新政策明确支持探索新靶点、新机制和新模态以提升全球竞争力，这将推动真正创新贡献逐步上升，同时进一步推高中国资产交易估值。我们维持对中国生物科技板块的正面看法。 关键研判 一、产业趋势：me-better药物开发速度迫使全球药企缩短产品周期规划 基于考察企业披露的早期数据，中国公司在分子工程领域的专业能力使其能够针对已知靶点开发更高效药物。我们认为，全球生物制药企业需以\"重大竞争可能在专利到期前即涌入市场\"为前提进行规划，这将对内部研发构成额外压力，并倒逼外购创新。作为应对，部分西方药企已表示可能延迟披露某些作用机制，以试图延缓竞争入场。 二、AI在药物开发中角色上升，但聚焦分子工程而非靶点发现 多家公司提及利用AI辅助分子工程/开发，但重点仍集中在已知/已验证靶点，新靶点识别工作尚处早期。例如晶泰科技（XtalPi）利用AI为其TL1A×IL23双抗发现了新的结合表位，可阻止抗体分子聚集，降低抗药物抗体风险；歌礼制药则使用其AI赋能的基于结构的发现引擎，发现了一种具有独特骨架的小分子选择性胰淀素（amylin）候选药物。 三、\"全新-全新\"联合疗法重塑肿瘤治疗，但无\"一刀切\"方案 Duality认为其B7-H3 ADC（Elfe-D，与BioNTech合作）凭借差异化设计、良好安全性特征及与PD-L1×VEGF双抗联用的潜力，具备同类最佳潜力。尽管公司内部优先推进B7-H3 ADC而非TROP2 ADC，但承认默沙东/科伦的sac-TMT基于现有临床数据可能是一款差异化TROP2 ADC。科伦博泰指出sac-TMT已在多个瘤种中确立了高疗效和开发标杆，因此其管线ADC（包括内部B7-H3 ADC）策略是探索sac-TMT尚未覆盖的适应症和患者群体。讨论强化了全球肿瘤市场将随治疗领域及亚群日益碎片化的观点。 四、抢占全球肥胖市场仍是中国企业的核心战略方向 • 歌礼制药：拥有最广泛的代谢管线组合（小分子及多肽胰淀素、长效GLP-1R/GIPR双激动剂、每月/每季度注射的三重激动剂及多种固定剂量复方），目标定位潜在收购标的。其口服小分子GLP-1（ASC30）近期启动两项全球III期试验，预计2028年三季度出顶线数据、年底提交FDA NDA，有望成为继礼来orforglipron之后第二款在美国获批的口服小分子GLP-1药物。 • 恒瑞医药：本周与诺和诺德达成合作（继Kailera获得四款GLP-1资产大中华区外权益后），持续验证其代谢管线。公司对HRS9531（首款国产口服GLP-1/GIP双激动剂，耐受性更优、呕吐/恶心发生率更低）持高度建设性态度，预计2027年初在中国获批肥胖适应症。 • 信达生物：指出2026年中国GLP-1市场规模超预期增长（替尔泊肽纳入医保目录大幅改善可及性驱动），预计渗透率从当前约1%升至5%时市场将达100亿美元。关于2027年3月司美格鲁肽仿制药入华的潜在冲击，KOL认为仿制药最终可占50%销量份额，但信达持更乐观看法——中国肥胖GLP-1更似消费品，品牌价值与推广力度与价格同等重要；目前原研司美格鲁肽在中国主要GLP-1疗法中定价最低，但份额仍持续流失至玛仕度肽和替尔泊肽；且仿制药成本基础（自动注射器、分销、冷链物流等）未必如投资者预期般大幅下降，限制了价格下行空间。 五、Lp(a)领域：全行业静待诺华HORIZON完整数据以决定推进策略 恒瑞医药指出，其授权默沙东的口服小分子Lp(a)抑制剂（HRS-5346）的开发决策将参考诺华pelicarsen的HORIZON III期失败数据的详细披露（预计11月公布）。尽管恒瑞项目显示出比pelicarsen更强的Lp(a)降低幅度，但若诺华数据未显示明确剂量依赖性疗效，可能对恒瑞项目未来开发决策产生负面影响。诺华的失利对Lp(a)类药物构成重大挫折，对安进、礼来和默沙东的全球开发项目产生负面传导。 重点公司交流纪要摘要 • 康方生物（未覆盖）：对全球HARMONi-3一线NSCLC读出充满信心（援引中国HARMONi-6数据支持）；PD-1/CTLA-4双抗（卡度尼利）凭借四价结构实现更有利的组织分布和有限肠道暴露，结肠炎发生率低于Yervoy及volrustomig，有望降低停药率并提升疗效。 • 翰森制药：Ris-Rez的ILD发生率高于罗氏/MediLink的Tam-Peli主要归因于试验设计差异（ILD定义更广、既往胸部放疗患者比例更高、随访时间更长），预计GSK将在ESMO披露更详细ILD分析；口服IL-23和GLP-1/GIP双激动剂正成为 oncology 之外的第二增长支柱。 • 恒瑞医药：短期商业前景受新上市创新药驱动，三代产品因医院准入瓶颈延迟放量，2027年起将成重要增长引擎；与GSK、BMY的合作旨在借力伙伴的疾病生物学和全球商业化能力，弥补自身过去十年以fast-follow为主的研发策略短板。 • 复宏汉霖：PD-L1 ADC在Keytruda+化疗后NSCLC中潜力获看好，加速批准路径可期；PD-L1阳性患者评估单药，PD-L1低表达患者探索与PD-1/VEGF双抗联用。 • 信达生物：ESMO将公布IBI343（CLDN18.2 ADC）三线胃癌中国+日本III期数据及IBI363（PD-1/IL-2）更长随访肺癌/胃癌数据；IBI343的Fc沉默设计支持良好安全性，有望在一线PDAC中与化疗联用。 • 科伦博泰：ESMO焦点为sac-TMT的Lung06（一线PD-L1 TPS\u003c1% NSCLC头对头击败Keytruda+化疗）和Trofuse-005（二线+食管癌全球III期），数据可译性信心充足；sac-TMT已设高标杆，内部B7-H3 ADC将探索未覆盖适应症。 • 药明康德：客户上调药物开发预测驱动增长，大规模产能优势凸显；加速美国、欧盟、新加坡扩张以分散地缘风险；AI催生临床前验证需求，利好生物测试业务。 • 晶泰科技（未覆盖）：内部药物发现聚焦已验证靶点以降低疾病生物学风险；Physical AI平台仍处早期，与CRO客户的合作证据有限。 投资策略总结 中国生物科技产业正处于从fast-follow向真正创新转型的关键节点，政府新政策及全球BD交易活跃度上升将进一步推高资产估值。短期看，me-better药物开发速度对全球药企构成竞争压力；中长期看，AI赋能分子工程、肥胖及代谢疾病大市场、肿瘤新靶点联合疗法及Lp(a)等心血管新领域将孕育结构性机会。投资者应重点关注：①具备全球竞争力的ADC、双抗及小分子平台型公司；②肥胖/代谢管线中耐受性优势明显的差异化资产；③地缘风险下CDMO供应链多元化受益标的。风险方面需警惕政策落地不及预期、临床数据读出失败及全球宏观经济对biotech融资环境的冲击。#文字观点", "publish_time": "2026-10-03 11:21", "tags": ["文字观点"]}, "attachment:files/中信建投-铁路公路行业：铁路单日售票量再创历史新高-261001.pdf": {"id": "attachment:files/中信建投-铁路公路行业：铁路单日售票量再创历史新高-261001.pdf", "kind": "attachment", "title": "中信建投-铁路公路行业：铁路单日售票量再创历史新 将对公司的经营产生一定负面影响。 清算政策调整的风险 由于铁路行业“全程全网”的业务特点，需要不同铁路运输企业之间相互提供路网服务。为建立铁路运输 企业之间公平、公正、公开的清算秩序，原铁道部、原铁路总公司先后制定了《铁路运输进款清算办法》（铁 财〔2005〕16号）《中国铁路总公司关于明确有关财务清算事项的通知》（铁总财〔 2016〕230号）等相关规 定。2016-2018年，清算政策保持了基本稳定，确保了铁路运输进款清算的顺利进行，京沪高铁也实现了良好 的经济效益。未来随着生产要素价格水平提高、路网服务质量提升、行业特点及供求关系变化，国铁集团清算 项目、清算范围、清算价格可能出现调整，如果出现不利变化，将对公司的经营业绩产生一定影响。 仅供内部参考，请勿外传 8 铁路公路 行业动态报告 请务必阅读正文之后的免责条款和声明。 分析师介绍 梁骁 交运行业分析师，南开大学硕士，先后供职于中集集团物流板块、顺丰控股、京东物 流，曾参与撰写《国家多式联运标准修订建议报告》并为交通物流相关十四五规划建 言献策，2022年加入中信建投证券研究发展部，覆盖快递快运 /仓储运输/供应链物流/ 跨境物流/铁路货运/航空物流，具有丰富的交运物流行业研究经验以及资源，擅于把 握和挖掘公司长期价值，工作地北京。 韩军 全球交通运输及全球能源首席分析师，曾供职于上海国际航运研究中心， 3年政府规 划与市场咨询经验，曾负责或参与为交通运输部、上海市交通委、港航企业等提供决 策咨询服务二十余项。10 年交通运输行业证券研究经验，深入覆盖航运、港口、高 铁、快递、物流板块，擅长把握周期性和政策性投资机会。 2021第十九届新财富最 佳分析师交通运输行业第五名。 宗枫 中信建投证券全球能源与运输分析师，长期关注产业周期、资本开支与公司基本面变 化。北京外国语大学金融与英语双学位；复旦大学国际工商管理硕士，并参与麻省理 工学院（MIT）暑期项目。曾就职于德勤中国，担任高级审计员，参与多家大型 A+H 上市公司审计工作；后任职于一级市场风险投资机构，负责早期项目挖掘与投 资决策。具有两年证券行业研究经验， 2025年加入中信建投证券。 仅供内部参考，请勿外传 铁路公路 行业动态报告 评级说明 投资评级标准 评级 说明 报告中投资建议涉及的评级标准为报告发布日后 6 个月内的相对市场表现，也即报告发布日后的 6 个月内公司股价（或行业指数）相对同期相关证 券市场代表性指数的涨跌幅作为基准。 A股市场 以沪深300指数作为基准；新三板市场以三板成 指为基准；香港市场以恒生指数作为基准；美国 市场以标普 500 指数为基准。 股票评级 买入 相对涨幅15％以上 增持 相对涨幅5%—15％ 中性 相对涨幅-5%—5％之间 减持 相对跌幅5%—15％ 卖出 相对跌幅15％以上 行业评级 强于大市 相对涨幅10%以上 中性 相对涨幅-10-10%之间 弱于大市 相对跌幅10%以上 分析师声明 本报告署名分析师在此声明：（ i）以勤勉的职业态度、专业审慎的研究方法，使用合法合规的信息，独立、客观地出具本报告 , 结论 不受任何第三方的授意或影响。（ ii）本人不曾因，不因，也将不会因本报告中的具体推荐意见或观点而直接或间接收到任何形式的补 偿。 法律主体说明 本报告由中信建投证券股份有限公司及 /或其附属机构（以下合称“中信建投”）制作，由中信建投证券股份有限公司在中华人民共和 国（仅为本报告目的，不包括香港、澳门、台湾）提供。中信建投证券股份有限公司具有中国证监会许可的投资咨询业务资格，本报告署 名分析师所持中国证券业协会授予的证券投资咨询执业资格证书编号已披露在报告首页。 在遵守适用的法律法规情况下，本报告亦 可能由中信建投（国际）证券有限公司在香港提供。本报告作者所持香港证监会牌照的中央 编号已披露在报告首页。 一般性声明 本报告由中信建投制作。发送本报告不构成任何合同或承诺的基础，不因接收者收到本报告而视其为中信建投客户。 本报告的信息均来源于中信建投认为可靠的公开资料，但中信建投对这些信息的准确性及完整性不作任何保证。本报告所载观点、评 估和预测仅反映本报告出具日该分析师的判断，该等观点、评估和预测可能在不发出通知的情况下有所变更，亦有可能因使用不同假设和 标准或者采用不同分析方法而与中信建投其他部门、人员口头或书面表达的意见不同或相反。本报告所引证券或其他金融工具的过往业绩 不代表其未来表现。报告中所含任何具有预测性质的内容皆基于相应的假设条件，而任何假设条件都可能随时发生变化并影响实际投资收 益。中信建投不承诺、不保证本报告所含 具有预测性质的内容必然得以实现。 本报告内容的全部或部分均不构成投资建议。本报告所包含的观点、建议并未考虑报告接收人在财务状况、投 份额。另一家主要供应商是 TFC。 9. 工业部门收入预计为2025年22.1亿美元、2026年23.2亿美元、2027年24.8亿美元、2028年27亿美元。2025年毛利率为34.2%，净利率为13.1%。全公司盈利目标：2026年净利率预计为17.8%，2027年为~19%。长期目标是在2028年至2030年间将净利率维持在22%至25%之间。 10. Coherent 于 2026 年上半年完成了 6 英寸 InP 产能的首次翻倍；第二次产能翻倍计划于 2027 年进行，以支持 CW 激光器、EML 芯片、NPO 和 CPO 产品的需求。#文字观点", "publish_time": "2026-10-03 21:24", "tags": ["文字观点"]}, "post:2026-10-03T11-22:27bbfc89536c": {"id": "post:2026-10-03T11-22:27bbfc89536c", "kind": "post", "title": "2026-10-03 11:22", "source_label": "帖子正文", "excerpt": "英伟达宣布将推出DGX SPARK 64GB 可在本地运行最高1000亿参数AI模型 10月2日｜英伟达宣布，DGX SPARK 64GB配置将于本月起通过主要合作伙伴推出。该设备可在本地运行最高1000亿参数的AI模型。", "content": "英伟达宣布将推出DGX SPARK 64GB 可在本地运行最高1000亿参数AI模型 10月2日｜英伟达宣布，DGX SPARK 64GB配置将于本月起通过主要合作伙伴推出。该设备可在本地运行最高1000亿参数的AI模型。DGX SPARK 64GB将于10月23日起通过主要合作伙伴发售，起售价为4999美元。#文字观点", "publish_time": "2026-10-03 11:22", "tags": ["文字观点"]}, "post:2026-10-03T11-23:b27f9d3bdb06": {"id": "post:2026-10-03T11-23:b27f9d3bdb06", "kind": "post", "title": "2026-10-03 11:23", "source_label": "帖子正文", "excerpt": "中国政府要求将提供铜精矿供应承诺，作为批准英美资源与泰克资源合并的反垄断审批条件之一 📍监管要求：据路透社援引三名知情人士报道，中国国家市场监督管理总局要求英美资源就合并后持续向中国稳定供应铜精矿作出承诺，作为其与泰克资源约540亿美元合并交易获批的条件之一，相关承诺亦涵盖通过贸易商销售的铜精矿 📍", "content": "中国政府要求将提供铜精矿供应承诺，作为批准英美资源与泰克资源合并的反垄断审批条件之一 📍监管要求：据路透社援引三名知情人士报道，中国国家市场监督管理总局要求英美资源就合并后持续向中国稳定供应铜精矿作出承诺，作为其与泰克资源约540亿美元合并交易获批的条件之一，相关承诺亦涵盖通过贸易商销售的铜精矿 📍审批进展：英美资源表示正与中国国家市场监督管理总局进行建设性沟通，审批取得良好进展。除中国外，该交易已获得双方运营所在其他司法辖区批准，两家公司仍预计交易于2027年3月前完成 📍补救条件：目前中国监管方寻求的主要是铜精矿供应等行为性补救，暂未要求出售资产。合并后的英美泰克预计控制全球约5%的铜供应，低于通常需达到10%-15%后易于引发市场集中度担忧的水平 📍潜在贸易影响：英美资源来自秘鲁和智利的大部分铜产量以精矿形式销售给中国、日本及欧洲冶炼厂。行业人士认为，若更多铜精矿被要求定向供应中国，可能减少公开市场货源并进一步挤压西方冶炼厂，同时推动铜精矿定价由传统年度基准向指数及现货定价转变 📍行业趋势：此次审批显示，铜等关键矿产交易的反垄断审查正越来越多与资源供应安全结合。近期欧盟对五矿资源收购英美资源巴西镍业务提出的担忧，同样集中于镍铁是否可能从欧洲市场转移，五矿资源亦提出长期欧洲供应承诺作为补救方案#文字观点", "publish_time": "2026-10-03 11:23", "tags": ["文字观点"]}, "post:2026-10-03T20-09:39127410a1a5": {"id": "post:2026-10-03T20-09:39127410a1a5", "kind": "post", "title": "2026-10-03 20:09", "source_label": "帖子正文", "excerpt": "谷歌搭载AI芯片测试卫星发射升空 10月3日｜美国谷歌公司一颗搭载谷歌张量处理 >一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>350–400mW高功率连续波激光器2027年出货目标由1600万台上调至2500万台；不受约束市场需求约6000万台，产能构成硬性约束。前端芯片制造与泰国封装构成双重瓶颈，正在评估将后端外包给Fabrinet；高功率激光器目前使用4英寸晶圆。\u003c/li>\n\u003cli>华为昇腾AI芯片中国市场份额已达50%，超过英伟达的8%；2022年英伟达占中国95%、昇腾占3%。英伟达宣布DGX SPARK 64GB配置本月起通过主要合作伙伴推出，可在本地运行最高1000亿参数AI模型；摩根士丹利重新将英伟达列为首选半导体股，对应2028财年盈利预期PE约15倍。\u003c/li>\n\u003cli>9月非农仅增2.9万人，低于预期，前两月合计下修6万人，失业率升至4.2%、时薪同比降至3.0%；10月加息概率降至约23%，美联储10月维持利率不变概率77.9%，12月累计加息25个基点概率68%。\u003c/li>\n\u003cli>Coherent专家访谈涉及NPO、CPO、EML与OCS的产量、ASP及供应链展望：2025年出货约310万个800G单元ASP415美元、220万个1.6T单元ASP1320美元；NVIDIA和Google分别约占其光模块销售额48%和23%；L公司2026年800G/1.6T合计出货约250万只，2028年总出货近400万只、约80%为1.6T。\u003c/li>\n\u003cli>SpaceX在不到13小时内完成3次猎鹰火箭发射、4次一级火箭着陆，并将“龙”飞船与国际空间站对接，完成第21次载人航天任务；谷歌TPU原型卫星发射升空测试太空AI基础设施；蓝箭等三家商业航天IPO同日集体中止。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>：今天强化的逻辑是，高功率连续波激光器2027年出货目标上调至2500万台，但不受约束需求约6000万台，产能硬约束明显；前端芯片制造与泰国封装双重瓶颈，评估后端外包Fabrinet，高功率激光器使用4英寸晶圆。今天出现的催化/验证包括：华为昇腾中国份额达50%超过英伟达8%；英伟达DGX SPARK 64GB本月推出；摩根士丹利重新将英伟达列为首选半导体股；台积电或与马斯克Terafab晶圆厂合作，Terafab此前已与Intel合作；计算机行业月报显示国产芯片发布计划大幅提前、算力投入呈现加速趋势。\u003c/li>\n\u003cli>\u003cstrong>AI算力/大模型\u003c/strong>：今天强化的逻辑是，Anthropic、谷歌等算力紧缺AI实验室已签下每月数十亿美元长期算力采购承诺，后续预计还有更多订单；SpaceX旗下AI部门今年夏天曾与微软就算力租赁业务洽谈；东芝FY2027数据中心HDD产能拟较FY2025近乎翻倍，市场担忧新增供给削弱当前HDD紧缺和定价权，Seagate与Western Digital股价均收跌约10%；Anthropic提示政府态度可能造成重大收入损失及业务中断。今天出现的催化/验证包括英伟达DGX SPARK 64GB本地运行1000亿参数模型，以及华为昇腾份额变化。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>：今天强化的逻辑是，Coherent专家访谈给出NPO、CPO、EML与OCS产量、ASP及供应链展望；2025年出货约310万个800G单元ASP415美元、220万个1.6T单元ASP1320美元；NVIDIA和Google分别约占Coherent光模块销售额48%和23%；L公司2026年800G/1.6T合计出货约250万只，2028年总出货近400万只、约80%为1.6T。今天出现的催化/验证包括美国头部两家激光器厂商LITE/COHR份额提升并扩产6寸外延，NV每家投20亿美金；光智科技收到海外6寸InP衬底订单，InP衬底进入4寸和6寸时代。\u003c/li>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>：今天强化的逻辑是，9月非农仅增2.9万人，低于预期，前两月合计下修6万人，失业率升至4.2%、时薪同比降至3.0%，私人部门接近盈亏平衡水平；劳务供给超预期且持续修复，劳动参与率意外走高0.2%至61.8%。今天出现的催化/验证包括10月加息概率降至约23%，美联储10月维持利率不变概率77.9%，12月累计加息25个基点概率68%；高盛认为疲软就业报告使美联储10月加息可能性不大，12月再加息一次仍是基本预期；美股短期靠AI盈利对冲估值压力，AI产业链上游最有确定性，但对10年期利率重回5.3%以上高度敏感。\u003c/li>\n\u003cli>\u003cstrong>商业航天/卫星\u003c/strong>：今天强化的逻辑是，SpaceX发射与载人节奏加快，谷歌TPU卫星测试太空AI基础设施。今天出现的催化/验证包括：四名宇航员搭乘SpaceX飞船8小时快速抵达国际空间站，创美国航天速度纪录并于周四对接；SpaceX在不到13小时内完成3次猎鹰火箭发射、4次一级火箭着陆，并将“龙”飞船与国际空间站对接，完成第21次载人航天任务；谷歌TPU原型卫星搭载4枚TPU，由SpaceX“运输者-18”任务拼车发射，测试太空环境中运行性能；蓝箭等三家商业航天IPO同日集体中止。\u003c/li>\n\u003cli>\u003cstrong>新能源/汽车与机器人/自动化\u003c/strong>：今天强化的逻辑是，特斯拉第三季度交付486,532辆汽车，高于分析师平均预期的456,896辆，欧洲市场销量低迷后今年有所复苏，连续两年年度销量下滑后核心汽车业务可能正在趋于稳定。今天出现的催化/验证是中国证监会正在提高人形机器人初创企业上市门槛，表明曾经炙手可热的人工智能领域正在降温，投资者正在评估人工智能股票是否存在泡沫。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>光通信/半导体：高功率连续波激光器2027年出货目标由1600万台上调至2500万台，不受约束需求约6000万台，产能硬约束；前端芯片制造与泰国封装双重瓶颈，评估后端外包Fabrinet；高功率激光器使用4英寸晶圆。\u003c/li>\n\u003cli>AI芯片/算力：华为昇腾AI芯片中国市场份额达50%，超过英伟达8%；英伟达DGX SPARK 64GB本月起通过主要合作伙伴推出，可本地运行最高1000亿参数AI模型；摩根士丹利重新将英伟达列为首选半导体股，2028财年盈利预期PE约15倍。\u003c/li>\n\u003cli>宏观数据：9月非农仅增2.9万人，低于预期，前两月合计下修6万人，失业率升至4.2%、时薪同比降至3.0%；劳动参与率意外走高0.2%至61.8%；10月加息概率降至约23%，美联储10月维持利率不变概率77.9%，12月累计加息25个基点概率68%。\u003c/li>\n\u003cli>海外政策：高盛认为疲软9月就业报告使美联储10月加息可能性不大，12月再加息一次仍是基本预期，但市场持续施压及能源价格上涨可能迫使美联储行动；特朗普宣布向超过2000万长者发放近100美元支票以帮助支付医疗保险B部分保费，并提及白宫宴会厅和军事综合大楼建设、美联储大楼翻修调查、新任美联储主席凯文·沃什独立审计及司法部长托德·布兰奇调查不当行为证据。\u003c/li>\n\u003cli>光通信/CPO：Coherent专家访谈给出2025年出货约310万个800G单元ASP415美元、220万个1.6T单元ASP1320美元；NVIDIA和Google分别约占其光模块销售额48%和23%；L公司2026年800G/1.6T合计出货约250万只，2028年总出货近400万只、约80%为1.6T；美国头部两家激光器厂商LITE/COHR份额提升并扩产6寸外延，NV每家投20亿美金；光智科技收到海外6寸InP衬底订单，InP衬底进入4寸和6寸时代。\u003c/li>\n\u003cli>商业航天/卫星：SpaceX不到13小时内完成3次猎鹰火箭发射、4次一级火箭着陆，并将“龙”飞船与国际空间站对接，完成第21次载人航天任务；谷歌TPU原型卫星搭载4枚TPU发射升空，测试太空AI基础设施；蓝箭等三家商业航天IPO同日集体中止。\u003c/li>\n\u003cli>新能源/汽车：特斯拉第三季度交付486,532辆汽车，高于分析师平均预期456,896辆；数据表明连续两年年度销量下滑后核心汽车业务可能正在趋于稳定。\u003c/li>\n\u003cli>机器人/自动化：中国证监会正在提高人形机器人初创企业上市门槛，表明人工智能领域正在降温，投资者正在评估人工智能股票是否存在泡沫。\u003c/li>\n\u003cli>资源/反垄断：中国国家市场监督管理总局要求英美资源就合并后持续向中国稳定供应铜精矿作出承诺，作为其与泰克资源约540亿美元合并交易获批条件之一，相关承诺亦涵盖通过贸易商销售的铜精矿。\u003c/li>\n\u003cli>消费/交通：2026年10月2日全社会跨区域人员流动量30819万人次，比2025年同期增长2.1%；铁路预计2040万人次，同比+5.8%；铁路单日售票量再创历史新高；阿里巴巴减持中通快递约5亿美元；东航物流回购2架货机，圆通达成多项航空物流合作。\u003c/li>\n\u003cli>其他附件主题：9.29新政力度、影响与展望及楼市“金九”成色受到关注；苹果发现影响少数AT&amp;T网络iPhone 18 Pro Max用户的故障，可能导致失去蜂窝网服务，少量用户需要更换设备。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>高功率激光器：2027年2500万台出货目标与约6000万台不受约束需求之间的产能缺口；前端芯片制造、泰国封装双重瓶颈及Fabrinet后端外包评估进展；4英寸晶圆使用情况。\u003c/li>\n\u003cli>国产芯片与算力：国产芯片发布计划大幅提前、算力投入加速趋势；华为昇腾中国份额与英伟达中国份额后续变化；英伟达DGX SPARK 64GB实际推出与本地大模型运行情况。\u003c/li>\n\u003cli>美联储路径：9月非农后10月、12月加息概率变化；10月维持利率不变概率77.9%、12月累计加息25个基点概率68%的后续调整；高盛12月再加息一次基本预期与市场持续施压、能源价格上涨的影响。\u003c/li>\n\u003cli>光通信/CPO：Coherent的NPO、CPO、EML与OCS产量、ASP及供应链展望；2025—2026年800G/1.6T出货与ASP变化；NVIDIA和Google占Coherent光模块销售额比例；L公司2026年250万只、2028年近400万只出货预测兑现情况。\u003c/li>\n\u003cli>InP衬底：4寸和6寸时代切换；具备海外头部厂商6寸订单的公司；光智科技海外6寸InP衬底订单后续。\u003c/li>\n\u003cli>商业航天：SpaceX发射节奏、载人任务、谷歌TPU太空测试及太空数据中心方向；蓝箭等三家商业航天IPO同日中止后的后续变化。\u003c/li>\n\u003cli>特斯拉：第三季度交付486,532辆后，核心汽车业务能否在连续两年年度销量下滑后持续趋于稳定。\u003c/li>\n\u003cli>人形机器人：中国证监会提高人形机器人初创企业上市门槛后，人工智能领域降温与AI股票泡沫评估的后续影响。\u003c/li>\n\u003cli>资源反垄断：英美资源与泰克资源约540亿美元合并交易审批进展，以及向中国稳定供应铜精矿承诺的落实范围。\u003c/li>\n\u003cli>其他行业跟踪：东芝FY2027数据中心HDD产能较FY2025近乎翻倍对HDD紧缺和定价权的影响；台积电与马斯克Terafab晶圆厂合作事宜；铁路单日售票量、国庆假期人员流动、航空物流合作、阿里巴巴减持中通快递等事项；9.29新政力度、影响与展望及楼市“金九”成色；苹果iPhone 18 Pro Max故障后续处理。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>11:21｜1. 350–400mW 高功率连续波激光器 2027 年出货目标由 1600 万台上调至 2500 万台。不受约束的市场需求约为 6000 万台，但产能构成硬性约束。\u003c/li>\n\u003cli>11:21｜高盛——中国生物科技考察之行要点总结 高盛组织中国生物科技实地考察，走访了包括康方生物（未覆盖）、Alebund（未覆盖）、Argo Biopharma（私有）、歌礼制药、Duality（未覆盖）、翰森制药、恒瑞医药、复宏汉霖、信达生物、科伦博泰、药明康德、晶泰科技（未覆盖）等企业，并与赛诺菲中国管理层及顶尖肥胖/糖尿病KOL会面。本次考察强化了我们的核心判断：中国生物科技产业当前仍以\"me-too/me-better\"资产及已知靶点重\u003c/li>\n\u003cli>11:22｜英伟达宣布将推出DGX SPARK 64GB 可在本地运行最高1000亿参数AI模型 10月2日｜英伟达宣布，DGX SPARK 64GB配置将于本月起通过主要合作伙伴推出。该设备可在本地运行最高1000亿参数的AI模型。\u003c/li>\n\u003cli>11:22｜MS的这个解释很到位，未来美国头部两家激光器厂商（LITE/COHR） 份额都要提升，同时也在扩产6寸的外延（NV每家投20 亿美金）；再结合【光智科技】收到的海外6寸的InP衬底订单，逻辑上完全闭环，跟我们前述观点完全吻合，#InP衬底已进入4寸和6寸的时代，具备海外头部厂商6寸订单的公司值得重点关注❗#文字观点\u003c/li>\n\u003cli>11:23｜高盛：疲软的9月就业报告使得美联储10月加息的可能性不大 10月2日｜高盛资产管理公司多部门固定收益投资主管林赛·罗斯纳表示，疲软的9月就业报告使美联储在本月晚些时候加息的可能性不大。她说，今天疲软的数据反驳了劳动力市场正在重新收紧的观点，12月再加息一次仍是其基本预期，但市场持续施压及能源价格上涨可能迫使美联储行动。\u003c/li>\n\u003cli>11:23｜特斯拉季度交付量强于预期 10月2日｜特斯拉周五公布的第三季度交付量超过华尔街预期，因去年欧洲市场销量低迷后，今年有所复苏。特斯拉第三季度共交付486,532辆汽车，高于分析师平均预期的456,896辆。\u003c/li>\n\u003cli>11:23｜中国政府要求将提供铜精矿供应承诺，作为批准英美资源与泰克资源合并的反垄断审批条件之一 📍监管要求：据路透社援引三名知情人士报道，中国国家市场监督管理总局要求英美资源就合并后持续向中国稳定供应铜精矿作出承诺，作为其与泰克资源约540亿美元合并交易获批的条件之一，相关承诺亦涵盖通过贸易商销售的铜精矿 📍审批进展：英美资源表示正与中国国家市场监督管理总局进行建设性沟通，审批取得良好进展。除中国外，该交易已获得双方运营所在其他司法辖区批准，两家\u003c/li>\n\u003cli>11:23｜摩根士丹利将英伟达列为其首选半导体 10月2日｜摩根士丹利重新将英伟达列为其首选半导体股，理由是英伟达拥有强劲的市场地位，且估值具有吸引力。目前，英伟达股价对应摩根士丹利对其2028财年盈利预期的市盈率约为15倍，与此同时，市场对其盈利的预期仍在不断上调。\u003c/li>\n\u003cli>20:06｜据三位知情人士透露，中国证监会正在提高人形机器人初创企业上市的门槛。这表明，曾经炙手可热的人工智能领域正在降温，投资者正在评估人工智能股票是否存在泡沫。\u003c/li>\n\u003cli>20:06｜特朗普： 我很高兴地宣布，我的政府将立即开始向超过 2000 万位可爱的长者发放近 100 美元的支票，以帮助他们支付医疗保险 B 部分的保费。我们已经大幅降低了这些保费。\u003c/li>\n\u003cli>20:06｜特朗普： 白宫正在兴建一座宏伟的宴会厅和军事综合大楼。真是令人兴奋！\u003c/li>\n\u003cli>20:06｜特朗普： 关于美联储大楼灾难性翻修工程调查的虚假新闻报道纯属谎言。新任美联储主席凯文·沃什已宣布将进行深入的独立审计，司法部长托德·布兰奇也明确表示，司法部将调查所有不当行为的证据。\u003c/li>\n\u003c/ul>\n\u003ch3>附件正文\u003c/h3>\n\u003cul>\n\u003cli>9.29新政：力度、影响与展望20260930｜楼市“金九”成色如何？下载日志已记录，仅供内部参考 中指研究院 中国房地产指数系统 本报告数据来自中指数据 CREIS。\u003c/li>\n\u003cli>中原证券-计算机行业月报：国产芯片发布计划大幅提前，算力投入呈现加速趋势-260930｜第1页/共57页本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明计算机 分析师：唐月 登记编码：S0730512030001 tangyue@ccnew.com021-50586737国产芯片发布计划大幅提前，算力投入呈 现加速趋势 ——计算机行业月报\u003c/li>\n\u003c/ul>\n\u003ch2>五、stocks.json关注标的摘要\u003c/h2>\n\u003cp>当天没有形成有效的 stocks.json 命中证据。\u003c/p>"}</script>
