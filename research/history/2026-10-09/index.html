oppers, making it the busiest city in our survey. Beijing also improved sequentially by +4%, while Hong Kong was broadly stable. Shanghai traffic declined -16% from CNY'26, but remained +112% above Golden Week 2025. Soft luxury led sequential improvement. Soft luxury traffic increased +13% vs. CNY'26 and +70% YoY, with broad-based strength across Dior (+57% sequentially; +312% YoY), Hermès (+90%; +116%), Burberry (+31%; +250%), Moncler (+28%; +386%), Prada (+39%; +119%) and Saint Laurent (+225%; +70%). Gucci , however, has seen a more muted improvement at +41% YoY and +5% sequentially. Hard luxury traffic remained +5% YoY but declined -13% vs. CNY’26. The moderation was primarily due to the watches category, with Rolex and Swatch Group seeing lower traffic than during CNY'26, while jewellery brands remained comparatively resilient. Dior's recovery stands out during this Golden Week. Dior accounted for 55-75% total incremental traffic compared to CNY’26 and Golden Week 2025. Dior's acceleration helped LVMH retain its clear industry lead , with group traffic increasing +5% vs. CNY'26 and +51% YoY. The impact from the Molly T ea on LV seemed to have faded, as the brand remained the most visited brand overall with traffic up +21% YoY and down marginally at -4% sequentially. Consumer engagement with luxury brands remains resilient, but brand execution increasingly matters. T raffic trends suggest aspirational consumers continue to engage with global luxury brands despite a challenging macro backdrop. However, gains were concentrated among brands offering greater newness and creative momentum (Dior, Chanel), a more relevant product and pricing proposition (Burberry), or clear category leadership (Moncler, Cartier and Van Cleef & Arpels). The lesson is that Chinese consumers remain interested in global luxury brands, but increasingly reward relevance, newness and category leadership. For LV, the implication is encouraging: continued industry- leading traffic suggests meani 00VDC 的 AIDC 电源架构。\n\n## 三、今日重点关注\n### 3.1 今天已经发生的重点变化\n- A 股深 V，港股绝地反击：A 股盘中跌到年内新低，午盘靠宽基 ETF 放量托回平盘；港股小米集团涨 9.7%，金蝶国际涨 9.7%，新股云迹涨 26.2%，胜宏科技跌 6.7%，剑桥科技跌 5.3%，下跌集中在 PCB、光模块、覆铜板等硬件公司。\n- 节后首日 A 股明显回调，尾盘小幅修复：沪指盘中一度跌破 3800 点、最大跌幅超 1%，收盘跌约 0.8%；超 3500 只个股下跌，仅 1600 余只上涨，涨停个股不足 50 只。\n- 早盘资金从成长股轮动转向防御板块：金融、航运获持续买入；医药板块资金双向波动、多空分歧大；TMT 隔夜出现多条利好，多家国内 CPO 光模块厂商就美国 FCC 监管担忧作出回应。\n- 谷歌云在 Gemini at Work 2026 发布 Gemini agent，定位企业通用智能体，目前处于私有预览阶段，后续将向部分 Workspace Business 及 Enterprise 套餐客户开放。\n- OpenAI 年化收入从此前报道的约 700 亿美元下修至约 500 亿美元，主要源于统计口径差异；OpenAI 近期已向 100+ 家组织通知其 AI Agent 存在未经授权活动，并投入约 7000 张 GB200/G。\n- 拓荆科技首次覆盖给予买入评级，目标价人民币 913 元，基于 2027 年预测销售额的 20 倍 EV/Sales；长江存储和长鑫存储是前两大客户，其他重要客户包括中芯国际、华虹宏力、HLMC、新昇、积塔半导体等。\n- 存储价格与格局变化：第三方预测四季度 DRAM 及 NAND 价格环比各涨 15–20%，略超预期；三星电子在 HBM4 领域正脱颖而出成为领导者。\n- 宁德时代定于 10 月 20 日收盘后公布 2026 年三季度业绩，股价自高点下跌约 30%；EV 出口增值税退税预计从 13% 逐步降至 9%、最终 5%；钠离子产品 Naxtra 电池和 TENER Sodium ESS 于 4Q26 进入量产/交付，2026 年目标 GWh 级出货。\n- 工信部等 7 部门联合印发新型电池产业发展“十五五”规划，提出到 2030 年全固态电池初步实现规模化应用，长寿命锂电池循环寿命达到 15000 次。\n- 10 月电子布价格更新：主流标布从 2026 年 7 月起连续数月上涨，775、7628 等主流产品每月价格涨幅为 1.5–1.7 元/米；2026 年 10 月确定延续该涨幅，提涨 1.5 元/米，涨后 7628 电子布价格达到 13 元出头。\n- 美国 PCBAA 向美国政府及国防部施压，明确提出军工供应链全面剔除中国 PCB 产品，美国设定 2027 年 1 月 1 日为军工供应链全面剔除相关国家 PCB 产品的最后截止日期。\n- 苹果公司宣布将于 10 月 13 日在纽约发布智能家居产品；苹果据悉因需求疲软要求部分供应商削减 iPhone 18 Pro 及 Max 版零部件产量。\n- 天孚通信推出 2026 年限制性股票激励计划，股权激励设定利润高增目标，无源高景气度叠加 CPO 技术趋势利好公司发展。\n- 浪潮信息 90 亿元定增预案获股东会审议通过，拟用于新一代 AI 基础设施研发及产业化项目、液冷原生算力基础设施研发等。\n- SOFC 产业化加速：电力可得性成为 AIDC 建设首要瓶颈，SOFC 可在数百 MW 规模快速复制，绕开并网与输电瓶颈，并匹配未来 800VDC 的 AIDC 电源架构；传统燃气轮机主机交付与场站建设周期无法匹配 AI 投产时间窗口。\n- 航运油运运价假期反向走强：中国关外线运价已回到 9 月 20 日左右高点，约 85 万水平；大西洋航线 TCE 已超 70 万/天；美班线套利航线达近 50 万，持续创历史新高；散运旺季将近、集运韧性较强、特运独立支撑。\n- 超强厄尔尼诺：2026 年 6–8 月全国平均温度 22.1 摄氏度，同比偏高 0.9 度，为有记录以来第四热夏天；全球 8 月为有记录以来最热 8 月。\n- 消费与医药等局部变化：古茗被继续推荐，核心竞争力包括货架型产品策略、高频快反、自建冷链、数字化运营；珠宝龙头 9 月中国内地线下店总销售同比下滑约小个位数、同店增长约中个位数，国庆 10.1–10.7 总销售同比下滑 19%、同店下滑 15%；妙可蓝多 2026Q1–3 营收 48.66 亿元、同比 +22.97%，归母净利 2.12 亿元、同比 +20.37%；美国 2026 年全美麻疹病例已超 3800 例，为 80–90 年代后新高。\n\n### 3. >宏观/策略侧，新兴市场股票指数高度集中，中国台湾地区和韩国合计占 MSCI 新兴市场指数权重约一半，信息技术板块权重超 40%，前三大成份股为台积电、三星电子及 SK 海力士。央行 10 月 8 日发布关于人民币汇率及全球经济失衡的政策立场，实行以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度，仅在极端波动时介入干预。\u003c/li>\n\u003cli>新能源/汽车侧，宁德时代定于 10 月 20 日收盘后公布 2026 年三季度业绩，股价自高点下跌约 30%；EV 出口增值税退税预计从 13% 逐步降至 9%、最终 5%；利润率改善因素包括麒麟电池、神行电池占比提升、锂价下行、产能利用率 1H26 为 94.9%、2025 年为 96.9%，以及钠离子产品 4Q26 量产、2026 年 GWh 级出货。工信部等 7 部门规划提出到 2030 年全固态电池初步实现规模化应用，长寿命锂电池循环寿命达到 15000 次。\u003c/li>\n\u003cli>光通信/PCB/机器人/液冷侧，TIM 材料测算 2027 年全球 AI 芯片和光模块 TIM 材料市场空间有望达 30.9/58.0 亿元，同比 +133%/+238%；10 月电子布确定延续涨幅，提涨 1.5 元/米，7628 电子布价格达到 13 元出头；Lumentum 称 2029 年初产能已售罄。特斯拉 Optimus 弗里蒙特工厂每周已可生产数百台，较第二季度每周几十台提高约十倍，年底目标每周超 1000 台；有效数据积累 63 万小时，100–200 万小时可落地工厂作业。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>AI算力/大模型：从训练转向推理与轻量级模型\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：AI 产业主线正从训练转向推理，行业重心从 GPU 训练资本开支转向推理侧算力与企业渗透；通用服务器（x86）出现拐点并加速增长，量价齐升。\u003c/li>\n\u003cli>今天强化的逻辑：反蒸馏措施加强后，专业模型公司转向轻量级模型；Meta Llama 调整回以个人 Agent 为中心。\u003c/li>\n\u003cli>今天出现的催化/验证：谷歌云发布 Gemini agent，定位企业通用智能体，私有预览；OpenAI 向 100+ 家组织通知 AI Agent 未经授权活动，并投入约 7000 张 GB200/G。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>半导体/先进封装/存储：设备零部件与存储涨价共振\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：半导体设备零部件迎来景气度与国产替代双轮驱动，零部件品类高度专业化、碎片化，技术壁垒显著。\u003c/li>\n\u003cli>今天强化的逻辑：三季度业绩前瞻对 AI 长期主线持建设性看法；四季度 DRAM 及 NAND 价格环比各涨 15–20%，略超预期；三星电子在 HBM4 领域正脱颖而出成为领导者。\u003c/li>\n\u003cli>今天出现的催化/验证：拓荆科技首次覆盖给予买入，目标价 913 元；长江存储和长鑫存储是前两大客户；CPO 产业进展与供需测算被重新审视，涉及测试/封装供应链。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>宏观/策略：新兴市场集中度与汇率政策\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：新兴市场股票指数日益科技聚焦与高度集中化，引发对 AI 主导地位的担忧。\u003c/li>\n\u003cli>今天强化的逻辑：中国台湾地区和韩国合计占 MSCI 新兴市场指数权重约一半，信息技术板块权重超 40%，前三大成份股为台积电、三星电子及 SK 海力士。\u003c/li>\n\u003cli>今天出现的催化/验证：央行 10 月 8 日声明实行有管理浮动汇率制度，仅在极端波动时介入干预；A 股深 V，港股绝地反击，资金从成长股轮动转向防御板块，金融、航运获持续买入。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>新能源/汽车/锂电/风电：宁德时代业绩前瞻与政策规划\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：宁德时代三季度业绩前瞻聚焦基本面与预期差；新型电池“十五五”规划提出 2030 年全固态电池初步规模化应用。\u003c/li>\n\u003cli>今天强化的逻辑：EV 出口增值税退税下调可能压低出口经济性；利润率改善因素包括高价值产品占比提升、锂价下行、高产能利用率、钠离子产品商业化。\u003c/li>\n\u003cli>今天出现的催化/验证：宁德时代 10 月 20 日收盘后公布三季度业绩；工信部等 7 部门提出长寿命锂电池循环寿命达到 15000 次；风电估值修复逻辑延续，海风弹性最大。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>光通信/CPO/PCB/电子布：升级、监管与涨价并行\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：光通信侧 800G 向 1.6T/3.2T 升级、液冷 cage 渗透及 NPO/CPO 演进，带动 TIM 由光模块内部向模块—冷板外部界面及多热源散热场景拓展。\u003c/li>\n\u003cli>今天强化的逻辑：TIM 材料是 AI 散热产业链中升级方向明确、技术路线变化显著的细分环节；单相冷板优化边际效用递减，TIM 升级为影响系统散热效率的关键环节。\u003c/li>\n\u003cli>今天出现的催化/验证：10 月电子布提涨 1.5 元/米，7628 电子布价格达到 13 元出头；Lumentum 称 2029 年初产能已售罄；美国 PCBAA 施压将军工供应链全面剔除中国 PCB 产品，设定 2027 年 1 月 1 日截止日期。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>机器人/自动化/液冷电源：Optimus 加速与 SOFC 产业化\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>主线：机器人硬件已基本成熟，落地核心瓶颈在 AI 大脑，迭代关键是高密度有效具身数据。\u003c/li>\n\u003cli>今天强化的逻辑：当前特斯拉有效数据积累 63 万小时，100–200 万小时可落地工厂作业，工厂端预计 27 年可大批使用；资金端特斯拉获批 300 亿美元新增信贷，支撑 Optimus、Robotaxi 扩产与供应链建设。\u003c/li>\n\u003cli>今天出现的催化/验证：特斯拉弗里蒙特工厂每周已可生产数百台 Optimus，较第二季度每周几十台提高约十倍，年底目标每周超 1000 台；SOFC 凭借标准化模块化可在数百 MW 规模快速复制，匹配未来 800VDC 的 AIDC 电源架构。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>A 股深 V，港股绝地反击：A 股盘中跌到年内新低，午盘靠宽基 ETF 放量托回平盘；港股小米集团涨 9.7%，金蝶国际涨 9.7%，新股云迹涨 26.2%，胜宏科技跌 6.7%，剑桥科技跌 5.3%，下跌集中在 PCB、光模块、覆铜板等硬件公司。\u003c/li>\n\u003cli>节后首日 A 股明显回调，尾盘小幅修复：沪指盘中一度跌破 3800 点、最大跌幅超 1%，收盘跌约 0.8%；超 3500 只个股下跌，仅 1600 余只上涨，涨停个股不足 50 只。\u003c/li>\n\u003cli>早盘资金从成长股轮动转向防御板块：金融、航运获持续买入；医药板块资金双向波动、多空分歧大；TMT 隔夜出现多条利好，多家国内 CPO 光模块厂商就美国 FCC 监管担忧作出回应。\u003c/li>\n\u003cli>谷歌云在 Gemini at Work 2026 发布 Gemini agent，定位企业通用智能体，目前处于私有预览阶段，后续将向部分 Workspace Business 及 Enterprise 套餐客户开放。\u003c/li>\n\u003cli>OpenAI 年化收入从此前报道的约 700 亿美元下修至约 500 亿美元，主要源于统计口径差异；OpenAI 近期已向 100+ 家组织通知其 AI Agent 存在未经授权活动，并投入约 7000 张 GB200/G。\u003c/li>\n\u003cli>拓荆科技首次覆盖给予买入评级，目标价人民币 913 元，基于 2027 年预测销售额的 20 倍 EV/Sales；长江存储和长鑫存储是前两大客户，其他重要客户包括中芯国际、华虹宏力、HLMC、新昇、积塔半导体等。\u003c/li>\n\u003cli>存储价格与格局变化：第三方预测四季度 DRAM 及 NAND 价格环比各涨 15–20%，略超预期；三星电子在 HBM4 领域正脱颖而出成为领导者。\u003c/li>\n\u003cli>宁德时代定于 10 月 20 日收盘后公布 2026 年三季度业绩，股价自高点下跌约 30%；EV 出口增值税退税预计从 13% 逐步降至 9%、最终 5%；钠离子产品 Naxtra 电池和 TENER Sodium ESS 于 4Q26 进入量产/交付，2026 年目标 GWh 级出货。\u003c/li>\n\u003cli>工信部等 7 部门联合印发新型电池产业发展“十五五”规划，提出到 2030 年全固态电池初步实现规模化应用，长寿命锂电池循环寿命达到 15000 次。\u003c/li>\n\u003cli>10 月电子布价格更新：主流标布从 2026 年 7 月起连续数月上涨，775、7628 等主流产品每月价格涨幅为 1.5–1.7 元/米；2026 年 10 月确定延续该涨幅，提涨 1.5 元/米，涨后 7628 电子布价格达到 13 元出头。\u003c/li>\n\u003cli>美国 PCBAA 向美国政府及国防部施压，明确提出军工供应链全面剔除中国 PCB 产品，美国设定 2027 年 1 月 1 日为军工供应链全面剔除相关国家 PCB 产品的最后截止日期。\u003c/li>\n\u003cli>苹果公司宣布将于 10 月 13 日在纽约发布智能家居产品；苹果据悉因需求疲软要求部分供应商削减 iPhone 18 Pro 及 Max 版零部件产量。\u003c/li>\n\u003cli>天孚通信推出 2026 年限制性股票激励计划，股权激励设定利润高增目标，无源高景气度叠加 CPO 技术趋势利好公司发展。\u003c/li>\n\u003cli>浪潮信息 90 亿元定增预案获股东会审议通过，拟用于新一代 AI 基础设施研发及产业化项目、液冷原生算力基础设施研发等。\u003c/li>\n\u003cli>SOFC 产业化加速：电力可得性成为 AIDC 建设首要瓶颈，SOFC 可在数百 MW 规模快速复制，绕开并网与输电瓶颈，并匹配未来 800VDC 的 AIDC 电源架构；传统燃气轮机主机交付与场站建设周期无法匹配 AI 投产时间窗口。\u003c/li>\n\u003cli>航运油运运价假期反向走强：中国关外线运价已回到 9 月 20 日左右高点，约 85 万水平；大西洋航线 TCE 已超 70 万/天；美班线套利航线达近 50 万，持续创历史新高；散运旺季将近、集运韧性较强、特运独立支撑。\u003c/li>\n\u003cli>超强厄尔尼诺：2026 年 6–8 月全国平均温度 22.1 摄氏度，同比偏高 0.9 度，为有记录以来第四热夏天；全球 8 月为有记录以来最热 8 月。\u003c/li>\n\u003cli>消费与医药等局部变化：古茗被继续推荐，核心竞争力包括货架型产品策略、高频快反、自建冷链、数字化运营；珠宝龙头 9 月中国内地线下店总销售同比下滑约小个位数、同店增长约中个位数，国庆 10.1–10.7 总销售同比下滑 19%、同店下滑 15%；妙可蓝多 2026Q1–3 营收 48.66 亿元、同比 +22.97%，归母净利 2.12 亿元、同比 +20.37%；美国 2026 年全美麻疹病例已超 3800 例，为 80–90 年代后新高。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>宁德时代 10 月 20 日收盘后三季度业绩，及基本面与预期差、EV 出口增值税退税下调影响、麒麟/神行占比、锂价、产能利用率、钠离子产品量产交付。\u003c/li>\n\u003cli>谷歌 Gemini agent 从私有预览向部分 Workspace Business 及 Enterprise 套餐客户开放的进展，以及企业级通用智能体落地节奏。\u003c/li>\n\u003cli>OpenAI 年化收入统计口径变化、AI 产业预期修正，以及 AI Agent 未经授权活动和安全风险后续暴露情况。\u003c/li>\n\u003cli>半导体三季度业绩期，AI 是否仍是长期主线；四季度 DRAM 及 NAND 价格环比各涨 15–20% 的兑现情况；三星电
