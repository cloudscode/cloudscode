, "content": "大摩闭门会 ：科技与消费的再平衡 20260810_ 原文 2026 年08月10日 16:46 发言人 00:00 朋友大家上午好 ，欢迎来到 1周一度的大摩宏观策略谈 ，我是邢自强 Robin 。过去一个半月了 ，资本市场 特别是 AI的存储芯片硬件板块剧烈的调整 ，我们在过去两三期反复的强调了这个不是一场 AI技术变革的 中断。但是投资者对 AI进行投资的框架 ，现在开始进入半场休息 ，向下半场去眼镜上半场。 发言人 00:30 人人关注的都是这些 ，我们经常所谓的卖场的企业 ，就是AI硬件里面的 ，特别是存储也很好理解。因为 我们看到美国的这些大厂不断的上修对今明两年的 AI算力的资本开支。而在明年可能高达 1.3万亿美元 的资本开支里面 ，存储占了最大的蛋糕 ，占比超过一半。然后大家先算一下存储里面最优秀的两家都是 韩国的企业。韩国一个国家的 GDP大概是不到 2万亿美元。所以大家心算一下 ，AI投资的这个上半场光 屏，三星、海力士两家的销售会超过韩国全国 GDP的4分之1，这也是闻所未闻 ，举世罕见。这是否过于 极致了 ，预示了上半场的顶峰了。 发言人 01:25 在七月初我们亚洲科技团队 ，包括show team 和刘端他们发布了一个叫潮水已退的报告。也是预警了很 多大家比较关注的二阶岛对这个行业的基本面的加速度的一些判断。回过头来看 ，有很多先见之明。所 以今天我跟我们的首席策略是 loa，我们亚洲科技的分析师刘端。当然会继续给大家分析这些中美 AI竞 赛投资的下半场 ，以及存储到底是不是调整到位了。我们的经济学家蔡志鹏博士 ，房地产的首 席Steven 也会针对当前了中国面临的一个窘境 ，就是国内的财政政策希望发力。但是不少企业家也反 馈，好像在面临着很多税收监管方面要进一步强化的声音。 发言人 02:19 这里面与房地产的关联的内因在哪里 ？后面怎么化解 ？这是今天的一些主要内容。我想首先抛砖引 玉，从外围环境说起。特别是大家关注美联储的新任主席凯文沃什 ，他加不加息让市场极为关注。这里 面比较有意思的一个上周的小段子 ，就是我也看到 4处转载 ，上周二收到了几百封信息 ，因为市场上突 然流传出一个不知出处的路演纪要 ，说在路演里透露大魔王斯丹在葡萄牙跟卧室进行了深入交流。所 以Robin 总说今年不会降息 ，明年甚至会开启降息。但我想回过头来想 ，这个应该是一个典型的人传人 传差了的传话筒效应。 发言人 03:15 因为早在一个半月前 ，我们的全球和美国经济学家确实去葡萄牙参加了欧央行每年一度举办的在葡萄牙 的度假胜地的叫欧洲央行峰会。在现场正好是 Kevin watch 担任美联储主席之后的第一次的国际亮相。他 在台上重点谈了一些他理解的货币政策框架 ，以及AI将来的生产率的提升和对就业的影响。甚至 AI的生 产率提升对就业的影响是有助于控制通胀。所以我们一直是认为 Kevin watch 它表面上鹰派 ，但内里它的 分析框架 ，他的这些知识储备的倾向似乎并不应甚至可能是内里鸽派。所以判断了美联储今年大概率不 加息，明年有可能开启降息 ，这也不是新观点了 ，持续了好几个月了 ，但是结果传着传着可能也跟过去 两周。我自己也在上海路演。 发言人 04:15 这样的一些企业和客户 ，可能在市场极度焦虑和敏感的情绪下 ，把我们的宏观观点神奇的变成了一种所 谓类似经常说的现场独家消息。这是一个典型的人传人传差了的效果。不过也反映出现在市场由于前期 E6636BB1012F9B6DA981D91E6DDB82445BC8BE5C336DDD821AED463F44DFE58AEEBB9DEC485FE3D4A816F78B9E1F401E216E94C3ED9B283B515EDC7E5B02CEC27A30F35 的高度的资金的杠杆 ，资金的涌入 ，仓位的集中 ，哪怕是投资于 AI的投资群体 ，对于美联储政策路径神 经紧绷到了一个极致的地步。 发言人 04:46 当然后面我想刘端也可以分享他们对于存储行业的看法。那篇名为潮水已退的分析报告 ，其实也是一个 多月前就推出的 ，当时也是一种预警 ，可是当时市场主体好像不太愿意听得进去 ，后面突然又被投资者 镜像的传阅 ，被奉为吹哨人。这背后的逻辑顺藤摸瓜也是比较有意思的。 发言人 05:12 回到美联储的政策 ，我们并不担心它收紧 ，不仅是预计他今年不加息 ，甚至后面有可能降息。这块背景 是什么呢 ？我们在摩根斯 stani创建了一个指数叫 AI对于劳动市场的颠覆指数。也就是说 AI是否会冲击就 业。因为美国的指标比较全 ，这个指标在美国我们运用的比较成熟一点。 发言人 05:39 在微观上已经发现了 AI开始对于美国的失业率产生影响 ，特别是在那些我们统计的一些叫白领服务业、 专业服务业 ，他们算是对 AI的高铺路的行业。目前他们的失业率已经受 AI的影响提升了约 15个基 点，就0.15。特别是对年轻人的影响 ，22岁到27岁的年轻人的整体失业率首次中间的 AI冲击是最为尖 锐。哪怕他有大学学历 ，但是年轻人只要是试图从事这些高 AI铺路的行业 ，他们的失业率最近在快速的 攀升，失业的持续时间显著的延长。而且一旦失业之后 ，重新找到工作 ，转入就业的难度大幅的增加 了。这是从年龄群来看 ，22到27岁的群体在美国是面临 AI冲击的首要群体 ，数据上有充分的体现。 发言人 06:36 这种高投入行业的失业率显著走高 ，我们还做了一些更加具体的统计分析 ，踢掉了一些美国经济时起时 伏的一些周期性的因素。美国这些专业服务业 ，白领服务业占到他总就业的三成到 3分之1左右是非常高 的，是中国的比例的三倍。中国我们还有一个好处 ，可能是相对来讲 ，男女工人以及中低端的服务业占 比高一点。美国专业服务业的占比高。目前这些行业在美国失业率 ，你正常剃掉周期性因素之后 ，失业 率高出了 0.5个百分点。这就推升刚才我讲到的美国整体的失业率上升了约 0.15个百分点 ，也就是 15个基 点，这已经比较明显了。 发言人 07:22 微观上 AI对于美国总就业的影响开始体现。目前虽然还比较温和 ，但越往后随着 AI的普及 ，扩散的速度 越快，造成的冲击可能越大。因为过去我们反复强调过 ，虽然有很多科学家或者说 AI行业的领军人物不 断的安慰大家 ，安抚大家 ，AI也会创造就业 ，别担心 ，正如历史上每一次工业革命一样。但是这次 AI的 普及扩散的速度是历史上每一轮工业革命的好几倍快 ，甚至比 90年代末的互联网革命还要快 3到4倍。所 以他可能没有造就新岗位之前 ，已经代替了包括你我在内的很多人的专业服务业的岗位。 发言人 08:04 造成的就业的冲击。在美国微观指标上会进一步的强化。这正是我们认为美联储今年不加息 ，甚至到后 面有可能降息。因为实体经济中累积的这些 AI对于失业的影响 ，就业摩擦的成本 ，以及未来两三年 AI带 来的全社会生产率的提升的通缩效应 ，可能会倒逼美联储开启降息周期。他不会去无视底层就业结构 受AI的冲击 ，这是对美联储政策的判断。 发言人 08:36 E6636BB1012F9B6DA981D91E6DDB82445BC8BE5C336DDD821AED463F44DFE58AEEBB9DEC485FE3D4A816F78B9E1F401E216E94C3ED9B283B515EDC7E5B02CEC27A30F35 并不是大家说我们有了一个什么小道消息 ，或者是有一个通道。美联储的直线的电话并不是是基于我们 的分析框架。至于大家也担心开放过去的另外一个政纲叫缩表。我们觉得缩表并不是紧缩开放过市场推 动的。所谓的美联储资产负债表的改革他的改革的意图不是缩减 ，只是减少这些不同的工具品类繁多造 成的扰动。所以他的改革落地的路线会是从明年一季度才开始 ，很慢，而且要花两年左右才会渐进的实 施。 发言人 09:17 落地两年左右。把美联储的资产负债表削减 1.5万亿美元。但为什么这种削减不是紧缩了 ？因为美联储 会坚定地通过充足的准备金的框架 ，对准备金实施分层的利率 ，引导银行自然的降低对过剩准备金的需 求。这块大概能降低对过剩准备金的需求 1万亿美元 ，所以准备金的供给跟需求会是同步的下降的 ，而 且这里面产生的久期的风险是比较低的。 发言人 09:47 因为资产负债表的改革方案的缩减 ，主要是针对每年大概 1万亿美元的国库券 ，就美国国债被动到期来 实现的。它不是一个主动型的紧缩 ，是一个被动到期。这里面几乎不会向美国的二级市场上私人部门转 嫁任何的 97风险。所以缩表本质上只是使得美联储的体积变小 ，动用的各种品类繁多的金融工具减少一 点，不要琳琅满目 ，但它不是美国的宏观金融条件的收紧。所以本质上我们认为外因里割 ，实际上今年 不加息 ，明年还有可能降息 ，哪怕搭配的缩表也不是紧缩 ，这是对美联储外围政策的判断。 发言人 10:31 回到AI的竞赛 ，我想大家比较关注的就是最近不止是 AI投资的上半场暂时告一段落 ，关心现在存储硬件 是不是能调整到位 ，可以抄底 ，更关心的是下半场很多人会聚焦于中美之间的竞赛 ，特别是大模型自身 的技术路线。比如说中国是开源式的 ，美国签订大模型主要是闭源式的 ，这块这种辩论进入了深水区。 我想更大的可能性就是在未来世界中这两者会并行这两者并行也就是说未来的世界会是一个混合式的。 既有一些对于数据极端敏感的一些高端部门 ，他可能还会倾向于用一些所谓的前沿的一元的大模型。但 是也有很多企业更加追求的是性价比。考虑到 型处理高频任务。这将导致中美两国在全球 AI市场中形成竞争与合作并 存的局面。 发言人 问 ：有人认为中国在 AI领域的创新不挣钱 ，因为行业竞争激烈导致利润减少 ，这种观点是否准 确？ 发言人 答 ：这个印象未必准确。中国的开源式模型并未导致全球 AI变得廉价 ，反而中国的大模型行业正 在告别内卷的价格战 ，转向更注重智力投入和合理定价的竞争环境。例如 ，一些开源模型的价格上调 了API费用，显示了行业定价自律的信号 ，并且提升模型智力也是中国该领域发展的有效路径。 发言人 问 ：最近市场对于税收监管加强的讨论升温 ，这是否会影响企业利润和财政支持经济的能力 ？ 发言人 答 ：是的，市场对于税收监管加强的讨论升温 ，企业担心这会增加微观主体的税负 ，与财政支 持经济的努力背道而驰。根源在于财力紧张 ，如果税收征管力度加大并同步发生 ，可能进一步压缩企业 利润和居民消费 ，加剧通缩压力和名义 GDP增速放缓 ，从而恶化财政收入压力。 发言人 问 ：目前中国财政收入面临的压力主要来自哪些方面 ？ 发言人 答 ：中国面临的财政收入压力主要体现在税收占 GDP的比例下降以及广义政府收入 （包括税收和 非税收入 ）占GDP的比例显著下滑 ，其中非税收入中最大的一块 ——土地出让金收入明显下行。数据显 示，广义政府收入占 GDP的比例已从 2018-19 年的20%多降至如今的 15%，土地收入的下行解释了财政收 入吃紧的约三分之二左右。 发言人 问 ：在当前经济环境下 ，如何打破通缩循环并保持财政扩张 ？ 发言人 答 ：在面临通缩循环风险的情况下 ，打破通缩框架需要中央财政大幅加大逆周期支持力度 ，进 行强有力的财政扩张。具体策略建议将在后续由蔡志鹏博士详细阐述。同时 ，市场对于美联储政策收紧 的担忧也需关注 ，但中国的额外生态链优势和开源模型未来竞争格局等因素也值得关注。 发言人 问 ：近期A股和港股市场的配置建议如何 ？ 发言人 答 ：根据之前的预判 ，目前港股市场的表现良好 ，建议投资者抓住时机将 A股组合中的仓位转移 到港股。尽管 A股上半年与全球人工智能超级周期有强烈共振 ，但在全球股市可能产生波动时 ，A股也 会受到影响。 8月份后 ，大型IPO可能对短期流动性产生一定冲击 ，导致A股动能相对弱势。而港股方 面，其动能有望持续至 9月份，尽管海外市场趋于稳定 ，但A股和美股的盈利能力和兑现承诺的能力仍 备受关注 ，且有望获得更广泛的关注和拉动。 发言人 问 ：在二季度的美股表现中 ，标普500中位数公司的盈利预期有何变化 ？当前美股市场从极度集 中于高科技板块转向了什么方向 ？ 发言人 答 ：在二季度 ，美股已经呈现季度化趋势 ，中位数的标普 500公司实现了 17%的盈利预期向上调 的水平。目前美股市场正在向高质量、高盈利确定性公司转变 ，这类公司的群体在标普 500中占比超 过40%。 发言人 问 ：标普500中波动性高、盈利确定性低的上市公司占比是多少 ？ 发言人 答 ：这部分公司在标普 500中占比约为 20%。 发言人 问 ：对于年底之前标普 500的表现 ，你们有什么预测 ？ 发言人 答 ：我们认为标普 500有力冲击 8000 点的位置是完全可以实现的 ，对美股总体持积极乐观态度。 发言人 问 ：在全球范围内 ，美股如何映射到港股市场 ？ 发言人 答 ：美股中高质量、高盈利确定性的公司映射到港股市场 ，主要表现为 AI赋能且商业化变现空间 和可见度高的公司 ，尤其是云服务厂商。 发言人 问 ：目前港股市场的动能可能会在何时相对疲弱 ？ 发言人 答 ：我们正在考虑包括地缘政治在内的多个因素来判断港股动能可能疲弱的时间点。 发言人 问 ：近期地缘政治方面有哪些变化 ？ 发言人 答 ：最近美国对中国科技限制的局部噪音有所增加 ，但同时中美关系和地缘政治也出现了一些 良性的信号 ，例如美国行政命令 19396 的过期未延期 ，这可以视为一个积极信号。 发言人 问 ：对于下半年港股市场 ，有哪些主要考量因子 ？ 发言人 答 ：主要考量因子包括地缘政治进展、海外投资监管政策的影响、以及金融和互联网板块催化 剂的出现 ，特别是互联网公司新一代模型和人工智能 agent 机制的推出预期。 发言人 问 ：AI硬件支出和亚洲工业资本开支的周期性是如何影响今年出口增速的 ？ 发言人 答 ：基于AI硬件支出和亚洲工业资本开支这两个结构性因素 ，我们将今年的出口增速上调到 了20%。名义出口增速中的价格上涨最快的部分对整体出口增长贡献显著 ，但价格的上涨背后与 AI硬件 需求强劲、全球资本开支上行周期直接相关 ，这轮贸易高增对于工业利润和名义 GDP提升比前几年更为 强劲。 发言人 问 ：对于出口量和价的关系以及对出口需求维持韧性的看法是怎样的 ？ 发言人 答 ：在出口高增中 ，价格因素贡献较大 ，但并非全部。虽然实体 GDP贡献难以大幅上升 ，但本轮 贸易增长对工业利润和民意 GDP提升的影响较强。出口面临的主要风险在于需求显著降温 ，尽管价格可 能下降 ，但如果量上不去 ，考虑到产业革命和投资周期的影响 ，出口需求仍可能保持韧性。不过 ，地缘 政治和能源冲击是尾部风险 ，不可忽视。 发言人 问 ：关于7月份CPI和PPI低于预期的原因是什么 ？ 发言人 答 ：7月CPI和PPI均低于市场预期 ，其中CPI疲弱主要是由于前期油价冲击的逆转 ，尤其是上游行 业受油价影响较大 ，拖累了 PPI环比约 0.6个百分点。然而 ，内需整体疲弱也是导致整体价格疲软的重要 原因，包括下游企业的定价能力较弱 ，汽车相关板块表现不佳 ，多数行业价格未见明显改善 ，只有芯片 相关产品还在涨价 ，但范围有限。 发言人 问 ：对于未来通胀前景 ，特别是 PPI同比下行速度有何看法 ？ 发言人 答 ：市场对于未来通胀前景存在分歧 ，尤其是 PPI同比下行速度。虽然油价波动会影响短期 内PPI走势，但从大方向看 ，随着原油相关能源密集型行业的贡献逐渐走弱 ，以及芯片价格涨幅有 限，下游需求和定价能力未见明显改善 ，预计短期内 PPI可能呈现锯齿状走势 ，但从三季度至四季度维 度看，PPI将整体向下。我们预计今年全年 PPI将从1.5%上调至 2.0%，之后可能会维持明确的下行趋势。 发言人 问 ：出口强劲背景下 ，内需接棒问题以及当前政策调整的必要性和方向是什么 ？ 发言人 答 ：虽然出口对经济有托底作用 ，但内需尚未接棒 ，消费偏弱 ，传统基建和房地产投资下 行，导致出口乘数效应打折。因此 ，政策问题集中在如何让内需真正接棒。政治局会议强调加快现有财 政空间投放 ，但投放面临产能局限和执行堵点。若八月内需未见好转 ，实际GDP增速连续两个季度低于 增长目标的可能性会上升 ，政策调整的必要性和空间随之增大 ，建议打破路径依赖 ，提高财政资金对线 下服务业消费的支持 ，并调整财政资源分配 ，比如降低部分出口退税以减轻企业和个人社保缴费负 担，实现K型经济下半部分更平坦。 发言人 问 ：目前AI基础设施的投资是否进入收缩阶段 ？长期协议 （LTA）的情况如何 ？ 发言人 答 ：目前还看不到 AI基础设施投资进入收缩 ，算力供给仍然受限 ，memory 是AI infrastructure 扩 张中的关键瓶颈之一。长期协议方面 ，市场尚未充分给 LTA估值。三星电子预计 60%到70%产能将纳入合 同，且要求客户支付预付款并设置价格底线。海力士也与十家客户完成 LTA谈判，新协议期限通常为五 年，包含保证金、双向承诺及价格波动吸收机制 ，以提高需求可见度。 发言人 问 ：对于传统内存周期的判断如何 ？ 发言人 答 ：在传统内存周期的判断上持中立观点。预计 2026 年第四季度行业进入周期后半段 ，三季 度DRAM 合约价格可能环比上涨 15%左右，而NAND 上涨15%至20%。尽管供需紧张但涨价幅度放 缓，非AI消费电子需求转弱 ，库存回升 ，客户采购行为回归正常。 发言人 问 ：对于2027 年行业盈利水平有何看法 ？ 发言人 答 ：预计2027 年行业盈利水平仍能维持高位 ，但依赖大幅 EPS上修推动股价将比今年上半年更困 难。长兴长存及新晶圆厂产能释放可能带来潜在风险 ，但强劲 AI周期和传统存储周期边际放缓可以同步 发生。 发言人 问 ：AI需求对 memory 公司盈利的影响是什么 ？ 发言人 答 ：AI需求是结构性的 ，能延长 memory 公司盈利持续时间 ，但周期性因素决定盈利上升速度和 市场估值。目前市场对盈利可持续性持怀疑态度 ，若AI需求延长盈利周期并结合 LTA降低下一轮下行幅 度，传统的盈利给存储估值框架可能需要重新审视 ，下一阶段投资回报可能来自估值扩张、自由现金流 及资本回报。 发言人 问 ：在股票选择上应偏向哪些领域 ？ 发言人 答 ：在股票选择上偏好资金投入集中、供给瓶颈明显的环节 ，如dRAM 和lexi memory ，特别 是DDR4 和SLCN ，而非消费场景较多的原厂和模组厂。 发言人 问 ：对房地产市场的最新预测是怎样的 ？ 发言人 答 ：发布报告指出今年下半年房地产开发商买地开发建设的核心指标 （新开工面积、房地产开 发投资、新房销售面积增速 ）将同比分别下降 20%、17%和10%，相比2021 年高点 ，累计跌幅约 为76%、53%和56%。对于房地产市场出现实质性恢复保持谨慎态度。 发言人 问 ：商业地产的情况如何 ？ 发言人 答 ：商业地产方面 ，商场运营商股价跑输大盘 ，反映在零售偏弱环境下市场担忧过度。即使消 费放缓 ，优质运营商仍能通过抢占市场份额实现零售和租金增长。头部商场租户零售额增速高于全国线 下零售 ，领先运营商依靠稳健同店零售增长和资产组合扩张持续扩大市场份额。华润置地、万象生活和 太古地产有望成为长期受益者 ，而新城控股短期上行空间更大。", "status": "extracted"}, "post:2026-08-10T11-35:352431658b27": {"id": "post:2026-08-10T11-35:352431658b27", "kind": "post", "title": "2026-08-10 11:35", "source_label": "帖子正文", "excerpt": "浙商机械 邱世梁|王华君【具身智能】宇树IPO开启申购、云深处回复首轮IPO问询，人形机器人量产渐近，持续推荐！一、宇树 #宇树IPO开启申购。", "content": "浙商机械 邱世梁|王华君【具身智能】宇树IPO开启申购、云深处回复首轮IPO问询，人形机器人量产渐近，持续推荐！ 一、宇树 #宇树IPO开启申购。8月10日宇树在科创板正式开启申购，发行价格为150.8元/股，对应上市时市值约610亿元。#2025财年发行后PE约219倍，PS约36倍。 DeepSeek斥资1.41亿元参与战略配售，具身智能本体&模型厂商强强联合。本次IPO深度求索获配93万股，占比2.3%。 二、云深处 #云深处IPO状态变为已问询。8月7日，公司披露首轮审核问询函回复。此前公司IPO于5月18日获得受理，并于5月27日进入问询阶段。 #拟募资25亿元投向具身大模型、本体、产业化三大方向。其中11.7亿元投向具身大模型，5.5亿元投向本体研发，7.8亿元投向机器人产业化项目和基地建设。 三、海外： #特斯拉弗里蒙特工厂开建Optimus生产线。7月23日，特斯拉26Q2财报电话会上称，弗里蒙特工厂正在安装用于Optimus的第一代生产线，预计26年晚些时候投产。 国际巨头特斯拉产线建设加速推进，国内巨头上市在即、大单频现，人形机器人产业化进展加速。...", "publish_time": "2026-08-10 11:35", "tags": ["文字观点"]}, "post:2026-08-10T07-30:e3b8d44d3f67": {"id": "post:2026-08-10T07-30:e3b8d44d3f67", "kind": "post", "title": "2026-08-10 07:30", "source_label": "帖子正文", "excerpt": "【长江电新】宇树上市催化明确，海外链量产确定，看好T链零部件+国产本体！#宇树开始新股申购，预期8月底完成上市1）发行市值600e，预期8月底上市：股份发行价格150.18元/股，发行市盈率219.23倍，预计募集资金总额约60.99亿，净额约59.17亿。", "content": "【长江电新】宇树上市催化明确，海外链量产确定，看好T链零部件+国产本体！#宇树开始新股申购，预期8月底完成上市1）发行市值600e，预期8月底上市：股份发行价格150.18元/股，发行市盈率219.23倍，预计募集资金总额约60.99亿，净额约59.17亿。 2）公司2025年实现四足机器人销量23037台、人形机器人5215台，为国内人形机器人龙头企业。宇树上市将有力催化国产人形机器人发展，并推动国产人形机器人产业链再定价。 #T链8-9月周产基本确定，9月周产1k+，机器人Q3大概率发布： 1）核心供应商确定8-9月产量，9月周产1k+：T弗里蒙特工厂产线基本敲定，核心供应商已经明确8-9月产量订单下限，9月推算周产1k+，T量产爬坡进入加速阶段。 2）Q3本体大概率展示，展示效果有望超预期：近期T链反馈Gen-3大概率于Q3展示，此前从马斯克以及T机器人团队高管反馈看效果有望超预期。 3）EDI系统上线，生产开始正式化：8月T链采购将通过EDI系统下达，订单采购开始流程化和正规化。 #继续坚定推荐机器人核心标的，看好此轮机器人行业拐点 1）T链聚焦确定性，除【三花、拓普】外，...", "publish_time": "2026-08-10 07:30", "tags": ["宇树开始新股申购", "预期8月底完成上市", "文字观点"]}, "post:2026-08-10T08-09:f5e8a7ac33a9": {"id": "post:2026-08-10T08-09:f5e8a7ac33a9", "kind": "post", "title": "2026-08-10 08:09", "source_label": "帖子正文", "excerpt": "20260809周观点：宇树IPO定价超出预期利好机器人板块，半导体设备关注去日化与出海 🌻核心观点： （1）人形机器人：宇树IPO定价超出预期，有望带动本体厂商估值重塑；预计板块后续催化不断，建议聚焦优质环节。", "content": "20260809周观点：宇树IPO定价超出预期利好机器人板块，半导体设备关注去日化与出海 🌻核心观点： （1）人形机器人：宇树IPO定价超出预期，有望带动本体厂商估值重塑；预计板块后续催化不断，建议聚焦优质环节。 （2）AIDC发电设备：三巨头财报落地，再次印证燃机行业高景气。 （3）工程机械：7月挖机内外销继续共振向上，板块将迎来逐季度改善。 （4）半导体设备：全球半导体设备进入大周期，关注去日化+出海。 （5）锂电设备：锂电排产连续创新高，固态电池迈入装车新阶段。 💎机械板块重点推荐：中国动力、东威科技、杰瑞股份、中国船舶、恒立液压、奥比中光、三一重工、豪迈科技、埃科光电、中微公司、先导智能、博众精工、徐工机械、中集集团、华测检测、迈为股份。 🧧中信建投机械团队 许光坦/陈宣霖/籍星博/吴雨瑄/乔磊/孙贺 请支持中信建投机械团队！#文字观点", "publish_time": "2026-08-10 08:09", "tags": ["文字观点"]}, "attachment:files/东吴证券-机械设备行业跟踪周报：推荐高景气和国产化率加速的半导体设备；建议关注人形机器人龙头企业模型端进展-260809.pdf": {"id": "attachment:files/东吴证券-机械设备行业跟踪周报：推荐高景气和国产化率加速的半导体设备；建议关注人形机器人龙头企业模型端进展-260809.pdf", "kind": "attachment", "title": "东吴证券-机械设备行业跟踪周报：推荐高景气和国产化率加速的半导体设备；建议关注人形机器人龙头企业模型端进展-260809", "source_label": "东吴证券", "excerpt": "ab 7 August 2026Global Research Powered by UBS Evidence LabYES China Sustainability China Green Export Monthly: June edition Key Highlights China's New Three (EV, solar, batteries", "content": "ab 7 August 2026Global Research Powered by UBS Evidence LabYES China Sustainability China Green Export Monthly: June edition Key Highlights China's New Three (EV, solar, batteries) exports reached a new all-time high of US$20.8bn in June (+11% MoM/+54% YoY), surpassing the previous record set in March. 1H26 New Three exports reached US$111bn (+49% YoY). Growth was broad-based across all three sectors , led by EV exports at US $9.1bn (+14% MoM/+116% YoY), while battery exports increased to US$9.2bn (+8% MoM/+30% YoY) and solar exports rebounded to US$2.5bn (+12% MoM/ +13% YoY). Europe remained the largest overseas market, accounting for 41% of China's New Three exports in June, followed by Asia (17%) and ASEAN (13%), reaffirming Europe's central role in global electrification investment. Oceania emerged as the key growth engine for EV exports, primarily Australia , growing over 300% YoY in both May and June. Oceania accounted for 11% of China's EV exports in June, up materially from 4% in Dec25. China's green exports remain resilient amid global energy transition trends, supported by accelerating transport electrification, grid investment, energy security concerns, and structurally high demand for low-carbon technologies. June: New Three exports hit record high as global electrification accelerates We introduce the June edition of our China Green Export Tracker, a monthly series leveraging the UBS Evidence Lab China export database to monitor high-frequency developments in China's green exports. June data points to another strong month for China's green manufacturing sectors, with New Three exports reaching an all-time high of US$20.8bn (+11% MoM/+54% YoY), exceeding the previous peak recorded in March. Cumulative 1H26 exports reached US$111bn, up 49% YoY. The results continue to support our view that global decarbonization, energy security concerns and electrification investment remain key drivers of demand for Chinese green technologies. New Three: Solar weakness offsets resilient battery and EV exports Across the \"New Three\", electric vehicles (EVs), solar and batteries , June growth was broad-based, with all segments registering sequential expansion. EV exports were the primary driver (+14% MoM/+116% YoY), supported by continued overseas market penetration by Chinese OEMs. Battery exports also remained robust (+8% MoM/+30% YoY), reflecting sustained demand from both EV and energy storage applications. Meanwhile, solar exports returned to positive growth (+12% MoM/+13% YoY). Europe remains dominant while Oceania becomes a new growth engine Europe remained the largest destination for China's New Three exports, accounting for 41% of total exports in June, followed by Asia (17%) and ASEAN (13%). While Europe continues to anchor global demand for Chinese green technologies, export growth is increasingly diversified across regions. Most notably, Oceania, led by Australia, has emerged as a key growth market for Chinese EVs, with exports growing more than 300% YoY in both May and June. Beyond the New Three: Electrical equipment remain structural beneficiaries Beyond the New 3, China's broader electrification supply chain continues to benefit from rising global investment in power infrastructure and energy security. Electrical equipment exports reached a fresh record high of US$14bn in June, up from US$13bn in May (+7% MoM/+33% YoY). ASEAN remained a key destination, accounting for 22% of exports, followed by Europe (18%) and North America (13%). This report has been prepared by UBS Securities Asia Limited. ANALYST CERTIFICATION AND REQUIRED DISCLOSURES, including information on the Quantitative Research Review published by UBS, begin on page 6. Equities Asia Pacific Global Sustainability Jarvis Lam Analyst jarvis.lam@ubs.com +852-2971 7701 Victoria Kalb Analyst vicki.kalb@ubs.com +65-6495 4584 Charles Fruitiere Analyst charles.fruitiere@ubs.com +44-20-7567 4123 Alisa Dudchak Analyst alisa.dudchak@ubs.com +44-20-7567 0844 Leigha Miyata Analyst leigha.miyata@ubs.com +81-3-5208 7101 Lydia Brunton Analyst lydia.brunton@ubs.com +61-2-9324 2172 ESG Environmental Social Governance M China Sustainability 7 August 2026 ab 2China Sustainability UBS Research Figure 1: China New 3 global export monthly 2022-26 (USD'm) - 5,000 10,000 15,000 20,000 25,000 Total Battery Solar EV Source: UBS Evidence Lab, includes content supplied by S&P Global Limited; Copyright © S&P Global Limited, 2026. All rights reserved.Figure 2: China New 3 global export growth moderated but stayed elevated -40%-20%0%20%40%60%80%100%120% Jan-22 Jun-22 Nov-22 Apr-23 Sep-23 Feb-24 Jul-24 Dec-24 May-25 Oct-25 Mar-26 Source: UBS Evidence Lab, includes content supplied by S&P Global Limited; Copyright © S&P Global Limited, 2026. All rights reserved. Figure 3: China battery export by regions (USD'm) 02,0004,0006,0008,00010,00012,000 Global Europe Asia ASEAN North America Source: UBS Evidence L led by EV exports at US $9.1bn (+14% MoM/+116% YoY), while battery exports increased to US$9.2bn (+8% MoM/+30% YoY) and solar exports rebounded to US$2.5bn (+12% MoM/ +13% YoY). Europe remained the largest overseas market, accounting for 41% of China's New Three exports in June, followed by Asia (17%) and ASEAN (13%), reaffirming Europe's central role in global electrification investment. Oceania emerged as the key growth engine for EV exports, primarily Australia , growing over 300% YoY in both May and June. Oceania accounted for 11% of China's EV exports in June, up materially from 4% in Dec25. China's green exports remain resilient amid global energy transition trends, supported by accelerating transport electrification, grid investment, energy security concerns, and structurally high demand for low-carbon technologies. June: New Three exports hit record high as global electrification accelerates We introduce the June edition of our China Green Export Tracker, a monthly series leveraging the UBS Evidence Lab China export database to monitor high-frequency developments in China's green exports. June data points to another strong month for China's green manufacturing sectors, with New Three exports reaching an all-time high of US$20.8bn (+11% MoM/+54% YoY), exceeding the previous peak recorded in March. Cumulative 1H26 exports reached US$111bn, up 49% YoY. The results continue to support our view that global decarbonization, energy security concerns and electrification investment remain key drivers of demand for Chinese green technologies. New Three: Solar weakness offsets resilient battery and EV exports Across the \"New Three\", electric vehicles (EVs), solar and batteries , June growth was broad-based, with all segments registering sequential expansion. EV exports were the primary driver (+14% MoM/+116% YoY), supported by continued overseas market penetration by Chinese OEMs. Battery exports also remained robust (+8% MoM/+30% YoY), reflecting sustained demand from both EV and energy storage applications. Meanwhile, solar exports returned to positive growth (+12% MoM/+13% YoY). Europe remains dominant while Oceania becomes a new growth engine Europe remained the largest destination for China's New Three exports, accounting for 41% of total exports in June, followed by Asia (17%) and ASEAN (13%). While Europe continues to anchor global demand for Chinese green technologies, export growth is increasingly diversified across regions. Most notably, Oceania, led by Australia, has emerged as a key growth market for Chinese EVs, with exports growing more than 300% YoY in both May and June. Beyond the New Three: Electrical equipment remain structural beneficiaries Beyond the New 3, China's broader electrification supply chain continues to benefit from rising global investment in power infrastructure and energy security. Electrical equipment exports reached a fresh record high of US$14bn in June, up from US$13bn in May (+7% MoM/+33% YoY). ASEAN remained a key destination, accounting for 22% of exports, followed by Europe (18%) and North America (13%). This report has been prepared by UBS Securities Asia Limited. ANALYST CERTIFICATION AND REQUIRED DISCLOSURES, including information on the Quantitative Research Review published by UBS, begin on page 6. Equities Asia Pacific Global Sustainability Jarvis Lam Analyst jarvis.lam@ubs.com +852-2971 7701 Victoria Kalb Analyst vicki.kalb@ubs.com +65-6495 4584 Charles Fruitiere Analyst charles.fruitiere@ubs.com +44-20-7567 4123 Alisa Dudchak Analyst alisa.dudchak@ubs.com +44-20-7567 0844 Leigha Miyata Analyst leigha.miyata@ubs.com +81-3-5208 7101 Lydia Brunton Analyst lydia.brunton@ubs.com +61-2-9324 2172 ESG Environmental Social Governance M China Sustainability 7 August 2026 ab 2China Sustainability UBS Research Figure 1: China New 3 global export monthly 2022-26 (USD'm) - 5,000 10,000 15,000 20,000 25,000 Total Battery Solar EV Source: UBS Evidence Lab, includes content supplied by S&P Gl 国）有限公司 重要变更（财年12月份结束） 旧 新 Δ 调整后的每股收益 - 26E (元) 4.01 3.46 -13.8% 调整后的每股收益 - 27E (元) 4.49 3.78 -15.8% 风格敞口 资料来源：风格敞口数据源自摩根大通全球市场策略团队；其他所有图表中的数据均为公司数据或摩根大通估算 分析师声明及重要披露，包括非美国分析师披露，见第5页。 我们预计申洲国际2026 年上半年销售额同比下降低至中个位数百 分比，主要受彪马和耐克的拖累，部分被阿迪达斯以及安踏、李 宁等本土品牌的强劲势头抵消。我们预测毛利率将同比下降 2-3 个百分点，这是多重阻力所致，包括：1）关税分摊；2）2 季度原 材料价格上涨——进行转嫁需要时间；3）汇率波动。随着非经营 性收益减少，我们预计 2026 年上半年盈利将同比下降约 30%。展 望下半年，我们预测订单将环比改善，原因是我们认为公司在核 心客户中的钱包份额将进一步扩大（尽管趋势各异），客户情绪 有望改善，且基数下降。我们预计下半年销售额/盈利将增长 10%/13%，较上半年低至中个位数/30%左右的同比降幅改善，这 应将推动该股估值上调。维持“增持”评级。 •竞争优势保持完好：我们看好申洲国际：（1）海外产能持续扩 张；（2）有机会获得核心客户的市场份额，并稳步与新客户建 立关系 ；（3）持续关注 ESG 和自动化，推动可持续增长；（4 ）海外产能本地化。我们将 2027-2028 财年盈利预测下调 14- 16%，以反映宏观不确定性。我们截至 2026 年 12 月的目标价降 至 70 港元，对应 17 倍 12 个月动态市盈率。 •核心客户实现韧性增长，尽管终端市场趋势好坏不一。阿迪达 斯（由刘李聪覆盖）及优衣库（由村田大郎覆盖）在2025年合 计占申洲国际销售额的50%，仍是主要增长驱动力：阿迪达斯 于7月30日公布2季度服装业务增长35%，并将全年销售额指 引（不含外汇影响）上调至9-10%（此前为高个位数）；优衣库 于7月9日公布2026财年3季度（3-5月）增长22%，并将全年 销售额指引上调至17%（此前为15%）。相比之下，耐克（由 Matthew Boss覆盖）需求持续疲软，于7月1日将2026年收入 展望下调至低至中个位数下滑（此前指引预测低个位数下滑） 。彪马（由刘李聪覆盖）2季度销售额低于预期，同比下降9% ，但仍维持2026财年低至中个位数下滑的销售额指引。总体而 言，我们预计申洲国际2026年订单将受到阿迪达斯低至中双位 数增长、优衣库中高个位数增长、以及安踏、李宁和露露乐蒙 稳健增长的推动，同时部分被耐克和彪马的下滑所抵消。 股价表现 年内迄今 1个月 3个月 12个月 绝对 -29.8% 2.8% -6.2% -22.9% 相对 -26.0% -8.5% -4.4% -18.7% 公司数据 已发行股票数（百万） 1,503 52周股价区间（港元） 73.00-38.66 总市值（百万美元） 8,238 汇率 7.84 自由流通股比例 52.5% 三个月日均成交量（百万） 7.54 三个月日均成交额（百万美元） 42.5 波动性（90天） 33 指数 HSCEI 彭博 买入|持有|卖出 35|4|0 重要指标（财年12月份结束） 单位：百万元，每股数据单位：元 FY25A FY26E FY27E FY28E 财务预测 收入 30,994 31,914 33,845 35,551 调整后的息税折旧摊销前利润 8,486 7,744 8,304 8,846 调整后的息税前利润 6,997 6,305 6,856 7,379 调整后的净利润 5,825 5,200 5,681 6,139 调整后的每股收益 3.88 3.46 3.78 4.08 彭博一致预期每股收益 4.27 4.00 4.40 4.74 经营活动现金流 5,549 6,808 6,627 9,399 公司自由现金流 2,839 5,622 5,350 8,042 利润率和增长率 收入增长率 8.1% 3.0% 6.1% 5.0% 毛利率 26.3% 25.6% 26.1% 26.6% 息税折旧摊销前利润率 27.4% 24.3% 24.5% 24.9% 息税前利润率 22.6% 19.8% 20.3% 20.8% 调整后的每股收益增长率 (6.7%) (10.7%) 9.3% 8.0% 财务比率 调整后的有效税率 12.6% 12.6% 12.6% 12.6% 利息覆盖倍数 25.3 21.5 23.1 24.6 净债务/净资产 NM NM NM NM 净债务/息税折旧摊销前利润 NM NM NM NM 已动用资本回报率 12.1% 10.3% 10.8% 11.2% 净资产收益率 rt electrification, grid investment, energy security concerns, and structurally high demand for low-carbon technologies. June: New Three exports hit record high as global electrification accelerates We introduce the June edition of our China Green Export Tracker, a monthly series leveraging the UBS Evidence Lab China export database to monitor high-frequency developments in China's green exports. June data points to another strong month for China's green manufacturing sectors, with New Three exports reaching an all-time high of US$20.8bn (+11% MoM/+54% YoY), exceeding the previous peak recorded in March. Cumulative 1H26 exports reached US$111bn, up 49% YoY. The results continue to support our view that global decarbonization, energy security concerns and electrification investment remain key drivers of demand for Chinese green technologies. New Three: Solar weakness offsets resilient battery and EV exports Across the \"New Three\", electric vehicles (EVs), solar and batteries , June growth was broad-based, with all segments registering sequential expansion. EV exports were the primary driver (+14% MoM/+116% YoY), supported by continued overseas market penetration by Chinese OEMs. Battery exports also remained robust (+8% MoM/+30% YoY), reflecting sustained demand from both EV and energy storage applications. Meanwhile, solar exports returned to positive growth (+12% MoM/+13% YoY). Europe remains dominant while Oceania becomes a new growth engine Europe remained the largest destination for China's New Three exports, accounting for 41% of total exports in June, followed by Asia (17%) and ASEAN (13%). While Europe continues to anchor global demand for Chinese green technologies, export growth is increasingly diversified across regions. Most notably, Oceania, led by Australia, has emerged as a key growth market for Chinese EVs, with exports growing more than 300% YoY in both May and June. Beyond the New Three: Electrical equipment remain structural beneficiaries Beyond the New 3, China's broader electrification supply chain continues to benefit from rising global investment in power infrastructure and energy security. Electrical equipment exports reached a fresh record high of US$14bn in June, up from US$13bn in May (+7% MoM/+33% YoY). ASEAN remained a key destination, accounting for 22% of exports, followed by Europe (18%) and North America (13%). This report has been prepared by UBS Securities Asia Limited. ANALYST CERTIFICATION AND REQUIRED DISCLOSURES, including information on the Quantitative Research Review published by UBS, begin on page 6. Equities Asia Pacific Global Sustainability Jarvis Lam Analyst jarvis.lam@ubs.com +852-2971 7701 Victoria Kalb Analyst vicki.kalb@ubs.com +65-6495 4584 Charles Fruitiere Analyst charles.fruitiere@ubs.com +44-20-7567 4123 Alisa Dudchak Analyst alisa.dudchak@ubs.com +44-20-7567 0844 Leigha Miyata Analyst leigha.miyata@ubs.com +81-3-5208 7101 Lydia Brunton Analyst lydia.brunton@ubs.com +61-2-9324 2172 ESG Environmental Social Governance M China Sustainability 7 August 2026 ab 2China Sustainability UBS Research Figure 1: China New 3 global export monthly 2022-26 (USD'm) - 5,000 10,000 15,000 20,000 25,000 Total Battery Solar EV Source: UBS Evidence Lab, includes content supplied by S&P Global Limited; Copyright © S&P Global Limited, 2026. All rights reserved.Figure 2: China New 3 global export growth moderated but stayed elevated -40%-20%0%20%40%60%80%100%120% Jan-22 Jun-22 Nov-22 Apr-23 Sep-23 Feb-24 Jul-24 Dec-24 May-25 Oct-25 Mar-26 Source: UBS Evidence Lab, includes content supplied by S&P Global Limited; Copyright © S&P Global Limited, 2026. All rights reserved. Figure 3: China battery export by regions (USD'm) 02,0004,0006,0008,00010,00012,000 Global Europe Asia ASEAN North America Source: UBS Evidence Lab, includes content supplied by S&P Global Limited; Copyright © S&P Global Limited, 2026. All rights reservedFigure 4: China EV export by region (USD$m) 01,0002,0003,0004,0005,0006,000 化，看好PCB全产业链！我们认为，AI 算力产业链的预期修复已先行完成，市场关注点正回归至新产品周期的基本面验证，Rubin 平台商业化落地是本轮板块景气上行的核心驱动力。", "content": "【东吴电子陈海进】Rubin落地催化叠加IC载板国产化，看好PCB全产业链！ 我们认为，AI 算力产业链的预期修复已先行完成，市场关注点正回归至新产品周期的基本面验证，Rubin 平台商业化落地是本轮板块景气上行的核心驱动力。伴随产业景气持续推进，上游核心配套环节步入集中备货阶段，订单能见度稳步抬升，硬件迭代驱动的细分赛道业绩兑现确定性持续提升。 AI 服务器主机板PCB与特种电子布充分受益于本轮 AI服务器架构升级带来的材料、规格迭代优化，叠加高端产能供给偏紧的行业现状，赛道利润弹性有望持续修复；同时，算力网络向1.6T迭代，严苛的布线密度与精度指标，促使光模块基板全面向mSAP精细线路工艺切换。这一变化除直接创造PCB增量市场外，高附加值产品占比提升，也将放大板块盈利弹性。 相较于PCB的业绩兑现逻辑，IC载板赛道运行逻辑相对独立，核心投资价值聚焦AI产业高景气下的ABF载板国产替代进程，具备扎实的中长期成长期权。 产业链相关公司： PCB设备：芯碁微装 PCB/IC载板：沪电股份、鹏鼎控股、胜宏科技、景旺电子、深南电路、兴森科技等； PCB上游：德福科技、铜冠铜箔、...", "publish_time": "2026-08-10 10:51", "tags": ["文字观点"]}, "post:2026-08-10T20-14:1e19662172dd": {"id": "post:2026-08-10T20-14:1e19662172dd", "kind": "post", "title": "2026-08-10 20:14", "source_label": "帖子正文", "excerpt": "PCB微钻专家交流反馈：Rubin逐步开始放量，有望看到量价齐升加速 📍Rubin的10倍通胀逐步进入兑现期，有望看到钻针量价齐升，助力业绩增长加速 ➡寿命大幅下降用量提升：从M6 1000孔到M8 400孔到M9 150孔，采用Q布、PTFE等寿命将进一步下降，用量还有上修空间 ➡价格大幅提升：G", "content": "PCB微钻专家交流反馈：Rubin逐步开始放量，有望看到量价齐升加速 📍Rubin的10倍通胀逐步进入兑现期，有望看到钻针量价齐升，助力业绩增长加速 ➡寿命大幅下降用量提升：从M6 1000孔到M8 400孔到M9 150孔，采用Q布、PTFE等寿命将进一步下降，用量还有上修空间 ➡价格大幅提升：GB200均价1.5、GB300均价2.8、Rubin均价5.2将显著带动均价提升 ➡AI钻针出货占比预计快速提升：Rubin+GB300目前占比20%，年底有望提升至~30%，带动3Q、4Q业绩增长加速，明年占比将进一步大幅提升 ➡钻针进一步涨价：受棒材涨价影响，目前GB300主针价格进一步上涨 📍鼎泰+中钨双龙头格局清晰，格局难以恶化，有望维持高盈利能力 ➡目前均已进入下游核心客户Rubin生产通过验证，将跟随大客户逐步开始量产，格局非常清晰！ ➡棒材+设备的瓶颈对新进入者形成了限制，目前长针均采用日本住友棒材生产，设备除鼎泰自制外采用欧日进口，均限制了格局的恶化，头部企业有望维持高盈利能力 📍还有很多内容，详细纪要欢迎滴滴~#文字观点", "publish_time": "2026-08-10 20:14", "tags": ["文字观点"]}, "post:2026-08-10T07-39:f59a799e7c44": {"id": "post:2026-08-10T07-39:f59a799e7c44", "kind": "post", "title": "2026-08-10 07:39", "source_label": "帖子正文", "excerpt": "❗【天风汽车】AI重回训练，从谷歌讲起-0809 ——————————— 本周AI圈最大的新闻无疑是Jeff携一批元老从谷歌离职自己创业，目标也是RSI。为什么离职？", "content": "❗【天风汽车】AI重回训练，从谷歌讲起-0809 ——————————— 本周AI圈最大的新闻无疑是Jeff携一批元老从谷歌离职自己创业，目标也是RSI。 为什么离职？我们认为根源还是算力。目前各家前沿AI Lab都在探索RSI，以实现AI模型的自动化迭代，对应消耗大量算力。但谷歌很明显将更多算力预算给到了GCP，甚至将接下来20%的TPU出货卖给A社。直接结果就是Gemini掉队。 但其他AI Lab在加速，O社正在推进的新一轮大型预训练模型Doug，参数规模再创新高；国内本周DeepSeek涨价，我们认为也是因为V4 Flash的爆火占用了太多算力。需要靠涨价压制推理需求，将更多算力给到训练端。 按梁文锋说法，不考虑任何研究试错，训练激活参数800B（总参数预计约20T）的模型需要5w张GB300。考虑未来模型的参数膨胀，训练集群可能达到数十万张。如此规模的多卡互联，需要最优的硬件配置以保证训练效率。 ﻿ 继续看好AI硬件升级链，特别是性能最强的NV Rubin链： ✔PCB升级：二代布、四代铜：国际复材、铜冠铜箔。铜粉、药水：江南新材、天承科技。 ﻿ ✔电源大陆企业大幅提...", "publish_time": "2026-08-10 07:39", "tags": ["文字观点"]}, "post:2026-08-10T08-47:0b6798693971": {"id": "post:2026-08-10T08-47:0b6798693971", "kind": "post", "title": "2026-08-10 08:47", "source_label": "帖子正文", "excerpt": "【长江科技】最新观点汇总20260809 🔥电子 1、PCB板块：四重逻辑驱动，景气度持续上行 全行业涨价潮超预期：6月以来上游材料供给趋紧，PCB行业从局部涨价扩散至全品类，且成本传导能力增强，有望推动Q3业绩环比显著改善。AI需求多点开花：英伟达Rubin平台进入全面生产阶段，PCB供应商于5月", "content": "【长江科技】最新观点汇总20260809 🔥电子 1、PCB板块：四重逻辑驱动，景气度持续上行 全行业涨价潮超预期：6月以来上游材料供给趋紧，PCB行业从局部涨价扩散至全品类，且成本传导能力增强，有望推动Q3业绩环比显著改善。AI需求多点开花：英伟达Rubin平台进入全面生产阶段，PCB供应商于5月底6月初开始拉货；正交背板虽存延期风险，但8-9月将再次送样，市场预期有望回暖；MSAP（光模块PCB）供需缺口至明年年底仍超20%，持续紧缺。RCC材料替代风险有限：针对RCC材料替代MSAP的担忧，会议指出目前仅有小厂商参与验证，产能规模极小（仅3-6亿），无法撼动MSAP在高端光模块中的地位。 景旺电子（首推）：具备60亿MSAP产值弹性，明年利润预期50亿，目标市值1200亿（25倍PE）。 鹏鼎控股与沪电股份：确定性龙头，明年利润预期均为120亿，目标市值3000亿（25倍PE）。 生益科技（CCL）：AI CCL龙头，估值已回落至与PCB同水位，明年利润预期200亿，目标市值5000亿（25倍PE）。 胜宏科技：英伟达核心供应商，受益于Rubin出货及正交背板预期，若背板落地，...", "publish_time": "2026-08-10 08:47", "tags": ["金斯瑞】", "腾讯、华通、恺英、完美、三七等", "文字观点"]}, "attachment:files/PCB设备-耗材-聚焦Rubin和mSAP两大主线20260809.pdf": {"id": "attachment:files/PCB设备-耗材-聚焦Rubin和mSAP两大主线20260809.pdf", "kind": "attachment", "title": "PCB设备-耗材-聚焦Rubin和mSAP两大主线20260809", "source_label": "PCB设备", "excerpt": "¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL340", "content": "¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408 ¸ü¶àÊµÊ±×ÊÁÏ¼ÓV£ºWUXL3408", "status": "extracted"}, "attachment:files/国金证券-电子行业研究周报：AI覆铜板／PCB下半年业绩环比增长有望加速-260809.pdf": {"id": "attachment:files/国金证券-电子行业研究周报：AI覆铜板／PCB下半年业绩环比增长有望加速-260809.pdf", "kind": "attachment", "title": "国金证券-电子行业研究周报：AI覆铜板／PCB下半年业绩环比增长有望加速-260809", "source_label": "国金证券", "excerpt": "ab 7 August 2026Global Research Powered by UBS Evidence LabYES China Sustainability China Green Export Monthly: June edition Key Highlights China's New Three (EV, solar, batteries", "content": "ab 7 August 2026Global Research Powered by UBS Evidence LabYES China Sustainability China Green Export Monthly: June edition Key Highlights China's New Three (EV, solar, batteries) exports reached a new all-time high of US$20.8bn in June (+11% MoM/+54% YoY), surpassing the previous record set in March. 1H26 New Three exports reached US$111bn (+49% YoY). Growth was broad-based across all three sectors , led by EV exports at US $9.1bn (+14% MoM/+116% YoY), while battery exports increased to US$9.2bn (+8% MoM/+30% YoY) and solar exports rebounded to US$2.5bn (+12% MoM/ +13% YoY). Europe remained the largest overseas market, accounting for 41% of China's New Three exports in June, followed by Asia (17%) and ASEAN (13%), reaffirming Europe's central role in global electrification investment. Oceania emerged as the key growth engine for EV exports, primarily Australia , growing over 300% YoY in both May and June. Oceania accounted for 11% of China's EV exports in June, up materially from 4% in Dec25. China's green exports remain resilient amid global energy transition trends, supported by accelerating transport electrification, grid investment, energy security concerns, and structurally high demand for low-carbon technologies. June: New Three exports hit record high as global electrification accelerates We introduce the June edition of our China Green Export Tracker, a monthly series leveraging the UBS Evidence Lab China export database to monitor high-frequency developments in China's green exports. June data points to another strong month for China's green manufacturing sectors, with New Three exports reaching an all-time high of US$20.8bn (+11% MoM/+54% YoY), exceeding the previous peak recorded in March. Cumulative 1H26 exports reached US$111bn, up 49% YoY. The results continue to support our view that global decarbonization, energy security concerns and electrification investment remain key drivers of demand for Chinese green technologies. New Three: Solar weakness offsets resilient battery and EV exports Across the \"New Three\", electric vehicles (EVs), solar and batteries , June growth was broad-based, with all segments registering sequential expansion. EV exports were the primary driver (+14% MoM/+116% YoY), supported by continued overseas market penetration by Chinese OEMs. Battery exports also remained robust (+8% MoM/+30% YoY), reflecting sustained demand from both EV and energy storage applications. Meanwhile, solar exports returned to positive growth (+12% MoM/+13% YoY). Europe remains dominant while Oceania becomes a new growth engine Europe remained the largest destination for China's New Three exports, accounting for 41% of total exports in June, followed by Asia (17%) and ASEAN (13%). While Europe continues to anchor global demand for Chinese green technologies, export growth is increasingly diversified across regions. Most notably, Oceania, led by Australia, has emerged as a key growth market for Chinese EVs, with exports growing more than 300% YoY in both May and June. Beyond the New Three: Electrical equipment remain structural beneficiaries Beyond the New 3, China's broader electrification supply chain continues to benefit from rising global investment in power infrastructure and energy security. Electrical equipment exports reached a fresh record high of US$14bn in June, up from US$13bn in May (+7% MoM/+33% YoY). ASEAN remained a key destination, accounting for 22% of exports, followed by Europe (18%) and North America (13%). This report has been prepared by UBS Securities Asia Limited. ANALYST CERTIFICATION AND REQUIRED DISCLOSURES, including informati # 雅克科技（002409.SZ）· 当天提及 1 次\n\n**文字观点原文线索：**\n1. `2026-08-10 08:19` 关注江丰电子、新金路、中船特气，战略性看多先进封装对应国产替代材料标的存储材料：#中船特气（WF6供需缺口持续扩大，价格有望持续上涨）、雅克科技国产先进封装材料和设备：#江丰电子、\n\n\n### 鼎通科技（688668.SH）· 当天提及 1 次\n\n**文字观点原文线索：**\n1. `2026-08-10 07:38` 关注电源液冷核心标的，其中：# 1)电源（PSU功率升级&下一代标准方案落地催化）首推麦格米特(确定性最强），关注欧陆通、奥海科技等\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力景气预期继续上修\u003c/strong>：DeepSeek于8月6日公告拟近期整体上调API服务定价且预计涨幅较大；阿里8月3日发布总参数量2.4万亿、激活参数约950亿的旗舰模型Qwen3.8-Max；TrendForce将2026年全球AI服务器出货量同比增速上修至接近31%（此前约28%）。（来源：建投通信及人工智能周观点 08:46、计算机周观点 08:47）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>寒武纪中报验证国产算力“产能锁定”逻辑\u003c/strong>：2026H1营业收入59.96亿元、同比+108.13%，净利润23.11亿元；Q2收入31亿元低于市场预期35-40亿，但毛利率、净利率超预期；6月末存货82.48亿元、占总资产45.32%、同比+66.83%，其中原材料占64.0%。（来源：申万计算机寒武纪点评 07:36、华创计算机 09:39/10:13）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观预期转向“非农爆冷+流动性改善”\u003c/strong>：美国7月非农意外走弱，利率期货定价12月仅加息28bp（低于非农公布前的32bp）；国内7月CPI和PPI双双回落，北京放松购房条件；本周三美国通胀数据披露被视为更重要变量。（来源：20260809复盘 07:19、本周策略观点0810 08:56）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宇树IPO开启申购，人形机器人量产渐近\u003c/strong>：发行价150.18元/股、发行市盈率219.23倍、预计募资总额约60.99亿元，预期8月底完成上市；云深处回复首轮IPO问询。（来源：长江电新 07:30、浙商机械 11:35）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>AI硬件端预期差集中修复\u003c/strong>：路演核心预期差集中在1.6T光模块需求上修、PCB三季度利润预期翻倍、ABF载板缺口50%且MLC设计变更将使玻纤布用量翻2-3倍，指向产业链景气度超7月回调后的悲观预期。（来源：GS TMT周报2026-08-09、Mikko全球市场日志2026-08-09）\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cp>\u003cstrong>主线1：AI算力/大模型——提价与模型迭代推升国产算力链条\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：DeepSeek拟整体上调API定价（涨幅较大），阿里Qwen3.8-Max进入2.4万亿参数区间；RL向长程Agent和真实工作流延伸，RSI推动AI参与下一代模型研发。\u003c/li>\n\u003cli>今天出现的催化/验证：TrendForce上修2026年全球AI服务器出货量增速至接近31%；Vera Rubin预计Q3起出货、谷歌TPU V8预计9-10月交付；阿里云模块化AIDC实现百天交付、计划今年全球产能提升两倍以上。\u003c/li>\n\u003cli>来源：建投通信及人工智能（08:46）、华福计算机（07:38）、东北计算机（20:01）\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>主线2：半导体/先进封装——从寒武纪存货看国产算力景气度\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：存货从“订单驱动”转向“产能锁定”，原材料52.78亿元占存货64.0%；先进制程、HBM3E、CoWoS/2.5D封装为全球稀缺资源，设计龙头需提前6-12个月锁定产能。\u003c/li>\n\u003cli>今天出现的催化/验证：寒武纪Q2收入低于预期但资产负债表加速、净利率超预期；SK海力士将在韩国投资384亿美元建设晶圆厂；长存上市预期及其DRAM扩产被列为半导体设备重点催化。\u003c/li>\n\u003cli>来源：华创计算机（09:39/10:13）、华鑫电子（09:33）、TFJX AIFH（12:17）、九点特供\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>主线3：光通信/PCB/新材料——涨价叠加技术升级共振\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：800G/1.6T/3.2T渗透率提升使磷化铟衬底消耗量成倍增长，3英寸衬底价格翻倍对光模块总价值量影响仍为低个位数百分比；Rubin平台商业化落地是PCB景气上行核心驱动力。\u003c/li>\n\u003cli>今天出现的催化/验证：1.6T光模块需求上修、PCB三季度利润预期翻倍、ABF载板缺口50%；PCB微钻专家反馈Rubin放量、钻针用量还有上修空间（M6 1000孔→M9 150孔）；味之素通知缩减大陆ABF膜供给30%；8月美股光通信大涨（AXTI +47%、COHR +44%、AAOI +44%）。\u003c/li>\n\u003cli>来源：zx新材料（08:44）、东吴电子陈海进（10:51）、GS TMT周报、tf电新（07:31）、8月美股大涨观点（09:05）\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>主线4：机器人与具身智能——宇树IPO定价超预期，产业链再定价\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：宇树发行市值600亿元，IPO定价超出预期，有望带动本体厂商估值重塑；宇树2025年实现四足机器人销量23037台、人形机器人5215台。\u003c/li>\n\u003cli>今天出现的催化/验证：宇树今日开始新股申购、预期8月底完成上市；云深处回复首轮IPO问询；国际巨头特斯拉产线建设加速推进，国内巨头上市在即。\u003c/li>\n\u003cli>来源：长江电新（07:30）、浙商机械（11:35）、东方证券机器人产业跟踪（附件）\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>主线5：宏观/策略——流动性预期改善，关注“科技与消费的再平衡”\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：美国7月非农爆冷，美联储年内加息预期降低；地缘和流动性预期在改善，产业情绪从负反馈中走出来，美股强势反弹提振全球风险偏好。\u003c/li>\n\u003cli>今天出现的催化/验证：中国央行连续第21个月增持黄金（7月末7608万盎司）；本周三美国通胀数据待披露；大摩闭门会主题为“科技与消费的再平衡”，关键词含AI、存储芯片、资本开支、美联储降息。\u003c/li>\n\u003cli>来源：本周策略观点0810（08:56）、股市早报（07:17）、大摩闭门会20260810\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>主线6：AIDC电力与液冷——从“GPU够不够”转向“电能否高效送进GPU”\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：伯恩斯坦数据显示，从GB200到VR200系列，电源+液冷环节BOM价值量提升幅度为240%、210%，高于整机柜提升幅度112%；800VDC、SST及SiC/GaN是落地方向。\u003c/li>\n\u003cli>今天出现的催化/验证：英伟达拟最高30亿美元入股Lancium、锁定数吉瓦电力；BNEF援引知情人士称xAI孟菲斯Colossus计算中心燃气轮机发现裂缝，数据中心需配置电池平滑波动；液冷专家反馈Rubin平台全面转液冷。\u003c/li>\n\u003cli>来源：功率半导体观点（08:48）、电源赛道观点（09:34）、中信汽车（07:29）、华安电新（12:09）、XNDX液冷专家（08:44）\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重
