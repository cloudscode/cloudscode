ent": "9月3日：液冷、微通道散热、词元经济、量子科技、月之暗面IPO等概念股梳理 一、昨夜发酵消息精选。 1、液冷、微通道散热：央视财经称，山东、广东等地液冷产线满产运行，核心设备CDU订单已排至2026年底，部分交付周期展望至2027年。9月2日盘前讯，台积电先进封装研发处长陈燕铭表示，微通道（Microchannel）散热技术通过在晶片或封装结构内设置微型流体通道，让冷却液更接近热源，有助提高热传效率，台积电已开始导入相关技术，并计划与封装架构共同开发。 概念股：集泰股份、杭电股份、飞龙股份、金帝股份、雪人集团、远东股份、英维克、三花智控、海亮股份、立讯精密、澄天伟业、锦富技术、裕同科技、康盛股份、中航光电、宁波精达、同星科技、祥鑫科技、中石科技、博杰股份、盾安环境等 2、词元经济：智谱在天猫开店卖token，个人版每月118元起，团队版598元。媒体称预示着大模型服务很快就要快消品一样，通过大众电商平台直接面向个人消费者。盘后国社官微打call：“Token贷”是什么？怎么贷？一项备受业界关注的AI Token(词元)支出指标，本周触及了历史新低，这是在竞争日益激烈的市场环境中Token价格持续走低的最新迹象。数据显示，由情报公司Silicon Data编制的LLM Token支出指数——该指数衡量全市场每百万LLM Token的平均支付价格，在周一跌至了97美分。这是该指数自去年年底推出以来的最低读数，较今年夏季早些时候创下的高点已下跌超过一半。 概念股：润建股份、东方国信、亿田智能、并行科技、软通动力、铜牛信息、协创数据、奥飞数据、拓尔思、用友网络、彩讯股份、优刻得、华数传媒、弘信电子等 3、量子科技：据科技日报，记者2日从安徽省量子计算芯片重点实验室获悉，本源量子联合中国科学技术大学、合肥综合性国家科学中心人工智能研究院等科研团队，在“本源悟空”自主超导量子计算机上成功研发出面向桶式量子随机存储器（QRAM）的“相干量子路由系统”，相当于为数据中心架设了“快速路”，有效解决了QRAM扩展的行业难题。相关论文日前发表于国际物理期刊《物理评论X》。 概念股：国盾量子、国仪公司、科大国创、中科曙光、神州信息、亨通光电、光迅科技、福晶科技、西部超导、中国长城、腾景科技、富信科技、国芯科技、格尔软件等。 4、月之暗面IPO：月之暗面向港交所秘密交表，正式启动IPO 以500亿美元投前估值同步推进Pre-IPO轮融资。 概念股：九安医疗、深信服、三七互娱、米奥会展、汤臣倍健、阿特斯、宇信科技等。 5、电力电网：国家能源局召开新型电网建设工作部署会，将加快输电通道等重大电网工程核准建设。“十五五”期间，我国电力需求仍将保持年均5%左右的增长，新能源占比进一步提高，对新型电网建设提出更高要求。9月1日，国家能源局召开新型电网建设工作部署会，全面部署新型电网建设重大任务，对于当前促投资和长远调结构具有重要的支撑作用。 概念股：京能热电、神马电力、杭电股份、远东股份、宏远股份、中电鑫龙、宝光股份、昊创瑞通、经纬股份、灿能电力、大烨智能、汉缆股份、国电南瑞、特变电工、中国西电、许继电气、平高电气、思源电气、中天科技、亨通光电、东方电子、四方股份、保变电气、金盘科技等。 6、北交所：北交所迎来宣布设立五周年。记者了解到，截至目前，合格投资者超1100万户，是开市时的近三倍，超3000只公募基金参与市场，今年以来日均成交约200亿元。 概念股：维琪科技、晟楠科技、智新电子、路桥信息、科隆新材等 7、人形机器人：在美国北卡罗来纳州教堂山举行的二十国集团创新部长级会议上，马斯克称，预估未来10年内人形机器人数量将超过10亿台，每台机器人的产出将至少是人类工作者的5倍，生产力将高于全球人类生产力总和。 概念股：拓普集团、三花智控、绿的谐波、鸣志电器、双环传动、兆威机电、长盈精密、奥比中光、汉威科技、旭升集团、江苏雷利、中大力德、埃斯顿、步科股份等。 8、消费：潘功胜：中方从不刻意追求贸易顺差，坚持扩大内需、坚持高水平对外开放。学习时报发文，加力扩大内需的基本逻辑和着力点。 概念股：国芳集团、茂业商业、九牧王、云南旅游等 9、农业：农业农村部召开全国粮油作物大面积单产提升现场会，强调更高水平推进大面积单产提升。央视财经，全球农产品掀涨价潮，大米、棉花、玉米等等主要的农产品期货价格目前基本都处在最近三年以来的最高水平上。新版农业法将“林业”修改为“林草业”。 概念股：天禾股份、源头信息加微信 WUXL3408新赛股份、润农节水、花溪科技、弘宇股份、浙江大农、丰林集团、万向德农、宏辉果蔬、康惠股份、广康生化等 10、多模态世界模型：李飞飞团队发布全球首个多模态世界模型Atlas，可基于少量图像生成3D场景与视频，支持像素级相机控制、空间重建及“子弹时间”效果，应用于机器人预训练、视觉特效等领域，仍存物理模拟与几何漂移局限。 概念股：奥比中光、凌云光、丝路视觉、凡拓数创、华如科技、当虹科技、虹软科技、天娱数科、捷成股份、索辰科技、格灵深瞳等。 11、戴尔概念：戴尔科技涨超15%，上财季业绩超预期：AI服务器业务爆单供应链中存储芯片最紧缺。（华勤技术、广合科技） 12、美股三大指数集体收涨，道指涨0.56%，纳指涨0.45%，标普500指数涨0.46%。AI应用软件股下挫，MongoDB跌超13%，Datadog跌超6%；公用事业板块下跌，爱迪生国际跌超6%，太平洋煤电跌超5%。因财报超预期，戴尔科技涨超15%，GitLab涨近10%。 二、个股新增概念精选。 1、液冷服务器（鸣志电器、天博智能） 2、并购重组（华昌化工、中广天择） 3、机器人概念（上声电子、天博智能） 4、新能源汽车（贝特利） 5、AI视频（新炬网络） 6、共封装光学（华胜天成） 7、算力租赁（阳光股份） 8、AI眼镜（大富科技）", "publish_time": "2026-09-03 07:24", "tags": []}, "post:2026-09-03T19-47:94040579872e": {"id": "post:2026-09-03T19-47:94040579872e", "kind": "post", "title": "2026-09-03 19:47", "source_label": "帖子正文", "excerpt": "20260903今日段子汇总 1、思泉新材：公司主营热管理产品包括石墨散热片、液冷模组等，应用于机器人、AI服务器、消费电子、新能源汽车及数据中心等领域 2、金现代：公司“轻骑兵”低代码PaaS平台融合AI大模型、CV、OCR等技术，已落地电力、航天、制造等场景，客户含国家电网、航天科工、广汽集团等", "content": "20260903今日段子汇总 1、思泉新材：公司主营热管理产品包括石墨散热片、液冷模组等，应用于机器人、AI服务器、消费电子、新能源汽车及数据中心等领域 2、金现代：公司“轻骑兵”低代码PaaS平台融合AI大模型、CV、OCR等技术，已落地电力、航天、制造等场景，客户含国家电网、航天科工、广汽集团等，主要产品已与包括鸿蒙操作系统等在内的国产化软硬件基础设施完成了国产化兼容适配 3、黄河旋风：公司自主研发的“金刚石—碳化硅复合材料”项目取得重大阶段性成果，核心性能指标达到国际先进水平，成功破解了长期困扰半导体产业的热膨胀失配难题，为我国高端半导体散热技术自主可控提供了关键支撑 4、麦格米特：目前了解到的从某模拟芯片厂采购量，就至少拿到3成rubin份额 5、光洋股份：1、公司拟10亿建设新能源汽车及机器人用精密零部件项目；2、公司已获得小鹏飞行汽车X3项目定点，完成A样交样 6、云南旅游：云南省为数不多的综合性旅游上市公司 7、金帝股份：1、公司拟投资建设液冷关键换热部件及高效散热模组总成、液冷关键部件及集成式散热模组总成项目，投资额分别为2.10亿元、2.16亿元；2、公司在减速器领域主要有谐波减速机保持架、谐波减速机带齿保持架两类产品，谐波减速机保持架是针对机器人手指关节设计的一款保持架产品 8、太阳电缆：福建升级扩容“福淡”“厦金”海底光缆，推进“福州—深圳短路径光缆”项目建设；公司产品有海底电力电缆、海底光电复合电缆、柔性直流海底电缆 9、博云新材：1、公司主要从事航空机轮刹车系统及刹车材料、航天用碳/ 碳复合材料等产品；2、公司高性能硬质合金产品营收占总营收比重为64.34%，为核心主营业务；子公司博云东方生产的超细/纳米硬质合金棒材可提供给客户用于制作切削刀具等 10、信达地产：公司主要从事房地产开发，配有商业运营、物业服务、房地产专业服务，是中国信达的房地产开发业务运作平台 11、嘉美包装：控股股东拟变更为逐越鸿智，追觅科技创始人俞浩将成公司新实控人 12、海通发展：公司地处福建福州，主要从事国内沿海以及国际远洋的干散货运输业务，公司运营的航线遍布30余个国家和地区的200余个港口，为客户提供矿石、煤炭、化肥等多种货物的海上运输 13、珠免集团：公司已在粤港澳大湾区、横琴粤澳深度合作区等国家战略区域布局，已形成覆盖口岸免税、跨境商务、商业综合体及线上渠道的全产业链布局；2月8日，珠海免税拱北口岸进境免税店苹果Apple专区正式启幕 14、冠盛股份：公司联合上海人工智能研究院等发布洁净环境机器人产品，已获授权发明专利6项，智能仿生关节臂仍处于研发迭代阶段 15、美诺华：诺和诺德司美格鲁肽在中国的核心化合物专利到期；公司储备了减肥多肽类中间体，正在进行GLP-1的研发和技术的储备 16、亚盛集团：我国当前最大规模的农艺种植基地；公司主营啤酒花、苜蓿牧草、马铃薯、制种玉米、大麦、食葵、果蔬等作物规模化种植 17、明新旭腾：公司正积极接触柔性传感器公司，实现皮肤与传感器业务结合 18、东百集团：公司主营以百货零售为主业，同时经营商业地产开发和房产租赁 19、大众交通：1、上海和长三角区域重要的综合交通服务供应商；公司25 年获首批智能网联汽车示范运营牌照，与百度智行深度合作开展主驾无人 Robotaxi 商业化运营，覆盖浦东等核心区域；2、公司通过基金间接持有长江存储约0.051%股份 20、中毅达：公司主要产品包括工业用季戊四醇、工业用双季戊四醇 21、大元泵业：公司表示已完成在储能及数据机房液冷领域的产品储备，已开始小批量接受客户订单，公司与华为、中兴在IDC温控领域推进屏蔽齿轮泵项目 22、恒盛能源：公司采用MPCVD技术生产20×20毫米金刚石，导热性能优于陶瓷，目标切入高功率芯片、GPU散热市场 23、华盛昌：公司收购伽蓝特100%股权，后者专注光通信模块和光芯片测试 24、白银有色：公司是我国多品种有色金属综合生产基地，具有年产白银500吨的生产能力，有年产金15吨的生产能力 25、艾华集团：1、国内铝电解电容器行业龙头，上半年净利润同比增长17.21%；2、公司的产品是AI算力硬件供电与电能管理链条中的关键基础元件，可应用在AI基础设施的各个关键部位，如服务器电源及供电保障与能源系统等 26、海量数据：国内主要的关系型数据库产品提供商；公司数据库产品能够为OpenClaw等智能体提供数据支撑，其技术路线与AI国产化趋势契合 27、宏盛股份：公司开发的冷却分配单元CDU及列间空调已批量应用于数据中心液冷系统 28、金富科技：1、公司拟收购卓晖金属和联益热能各51%股权，标的公司均聚焦液冷散热产品；2、公司是国内最大的塑料防盗瓶盖供应商之一，长期稳定供应华润怡宝、可口可乐、达能等头部饮料品牌 29、郴电国际：公司为唐山中邦控股股东，消息称后者氩气报价大涨 30、德尔未来：控股子公司烯成石墨烯有用于柔性屏的石墨烯透明导电薄膜产品布局，上半年业绩同比减亏 31、万朗磁塑：1、公司研发的PPO/POK合金材料具有高韧性、高强度、轻量化等特点，目前处于实验室研发阶段；2、公司钐铁氮稀土永磁材料目前正在中试阶段，尚未形成收入，量产尚需一定时间 32、千金药业：妇科中药龙头；公司的西药抗病毒类药品主要有拉米夫定片和利巴韦林颗粒等 33、科新发展：公司主营建筑工程业务，控股子公司已增资开展算力租赁业务 34、新炬网络：公司是一家以提供IT数据中心运维服务及运维产品为主的多云全栈智能运维服务商，下属子公司新炬技术AIOPS智慧运维平台软件V4.0与华为云GaussDB、华为云公有云平台（鲲鹏）完成相互兼容性测试认证 35、三安光电：首批稳定量产Mini/Micro LED芯片制造商之一；公司可提供用于光模块的激光器、探测器产品，目前高速产品已实现批量出货 36、鸣志电器：1、全球运动控制领域先进制造商，混合式步进电机的市占率稳居全球前三；公司及子公司安浦鸣志、美国AMP、美国LIN、瑞士T Motion、鸣志派博思均深度布局于移动机器人行业，目前已拥有步进系统、伺服系统、通用驱动系统和控制技术系统四大类产品线；2、公司的控制电机产品主要应用于通信基站、天线设施和其他相关基站设备中，华为是公司重要客户 37、美能能源：公司主营城镇燃气输配与运营 38、华源控股：公司2025年12月完成对暖芯科技51%股权收购，切入半导体温控设备及配套零配件赛道，并合资设立苏州致源真空科技布局分子泵，形成“核心温控设备+配套零配件”一体化体系，产品已导入华润微电子、拓荆科技、广州芯粤能等头部客户 39、德展健康：参股公司东方略在研重点产品VGX-3100的首个适应症（用于HPV-16和/或HPV-18相关的宫颈高级别癌前病变的治疗）Ⅲ期临床试验已完成全部患者入组 40、凯迪股份：公司是线性驱动系统龙头，网传资料显示，公司招聘电机研发工程师，工作让内容包括负责机器人用伺服电机电磁方案分析及结构方案设计 41、新朋股份：公司液冷服务器机柜已完成样品生产并展示给客户，表示未来可提供智算中心基础架构的整体解决方案，将机柜、PDU、CDU、供回液歧管和监控系统等集成在一起，向客户提供AI数据中心液冷散热所需的多种产品组合 42、爱仕达：公司与智元机器人签署战略合作协议 43、百大集团：公司主要从事百货零售、酒店服务、物业管理业务#市场段子#文字观点", "publish_time": "2026-09-03 19:47", "tags": ["市场段子", "文字观点"]}, "post:2026-09-03T23-03:aae0902d4cbf": {"id": "post:2026-09-03T23-03:aae0902d4cbf", "kind": "post", "title": "2026-09-03 23:03", "source_label": "帖子正文", "excerpt": "转 ‼️【AI产业风格切换点评：硬件“高增长”边际钝化，软件应用开始进入收入与利润双兑现阶段】 🔥事件：博通最新财季营收295.91亿美元，同比增长86%，调整后EPS同比增长96%，其中半导体解决方案收入同比增长127%。从绝对增速看，这仍是一份非常强的AI硬件成绩单，但财报后股价#反而明显承压下", "content": "转 ‼️【AI产业风格切换点评：硬件“高增长”边际钝化，软件应用开始进入收入与利润双兑现阶段】 🔥事件：博通最新财季营收295.91亿美元，同比增长86%，调整后EPS同比增长96%，其中半导体解决方案收入同比增长127%。从绝对增速看，这仍是一份非常强的AI硬件成绩单，但财报后股价#反而明显承压下跌，并带动光通信、半导体等硬件方向同步走弱。与此同时，Snowflake营收同比增长35%至15.5亿美元，产品收入增长37%，并将全年产品收入指引由58.4亿美元上调至60.7亿美元，经营利润率预期同步上调，股价大涨超20%，#Palantir、ServiceNow、Salesforce等AI软件股集体走强。 ☀️我们认为，这背后反映的不是AI景气度下降，而是市场定价逻辑正在发生明显变化。 过去两年，AI行情核心由GPU、光模块、PCB、存储、服务器等硬件驱动，资金交易的是“算力供不应求+业绩连续上修”。但随着硬件龙头过去数个季度持续兑现高增长，#市场对2027年甚至更远期增长已经给予较充分预期。当前即使继续交出高增长财报，如果缺少新的订单上修、供给缺口或增速二次抬升，单纯“业绩很好”已经越来越难推动估值继续扩张。 反观AI软件，当前正从此前的模型、Agent概念交易，#逐渐进入收入增长、客户扩张、利润率改善、全年指引上修的商业闭环阶段。Snowflake本次真正超预期的核心，并非单季度35%的收入增长，而是企业AI需求开始转化为可持续产品收入，同时经营杠杆开始兑现。这意味着AI应用有望从“讲故事”进入“算利润”的新阶段。 🔥硬件内部仍需寻找增速拐点，我们#当前更关注液冷。相比光模块、服务器等已经连续兑现多个季度的环节，液冷仍处于高功耗AI机柜加速渗透初期。随着Rubin时代单柜功率继续提升，冷板、CDU、液冷泵、Manifold及快接头等核心零部件有望在三季度至四季度迎来订单向收入加速确认。 ☎️ 结论：AI行情并未结束，而是从“硬件普涨”进入“软件看商业闭环、硬件看增速拐点”的新阶段。#文字观点", "publish_time": "2026-09-03 23:03", "tags": ["文字观点"]}, "attachment:files/万通发展（九月金股）深度解读电话会纪要20260831.pdf": {"id": "attachment:files/万通发展（九月金股）深度解读电话会纪要20260831.pdf", "kind": "attachment", "title": "万通发展（九月金股）深度解读电话会纪要20260831", "source_label": "其他", "excerpt": "万通发展（九月金股）深度解读电话会纪要 20260831 要点总结 1.推荐逻辑与选股标准 ：团队今年重点推荐江东电子、万通发展、翰博高新三只标的，均满足三大选 股标准 —— 市场空间足够大、环节具备必要性、标的是该环节最稀缺且最领先的厂商。2.万通发展核心看点 ——PCE（PCIE）Switch 芯片 ：公司通过收购数字科技切入 PCIE Switch 赛", "content": "万通发展（九月金股）深度解读电话会纪要 20260831 要点总结 1.推荐逻辑与选股标准 ：团队今年重点推荐江东电子、万通发展、翰博高新三只标的，均满足三大选 股标准 —— 市场空间足够大、环节具备必要性、标的是该环节最稀缺且最领先的厂商。 2.万通发展核心看点 ——PCE（PCIE）Switch 芯片 ：公司通过收购数字科技切入 PCIE Switch 赛道， 是国内唯一在 PCIE 5.0代际拥有 144 通道产品的厂商，芯片已从 \"PPT 阶段 \"进入真实产业可落地、可 验证阶段。 3.PCIE市场空间测算（回应质疑） ：通过三种方式验证 PCIE 今年市场规模超 200 亿元 ——① 以 retimer 十倍 ASP 推算； ②国内服务器龙头厂商采购规模推算； ③以节点内部用量测算。市场空间跟 随 AIcompute 持续扩张。 4.PCIE逻辑发生两大变化 ：一是跟随 CPU 游，业绩稳定性强。 三、半导体设备配套，绑定头部晶圆与封测厂 公司为半导体真空、洁净、杂质检测环节核心国产配套商，贯穿芯片制造全流程： 1. 晶圆制造端：服务中芯国际、长鑫存储、长江存储，覆盖真空检漏、洁净监测、化学品杂质检测等关键工序； 2. 封测环节：批量供货长电科技、通富微电，实现先进封装检测设备进口替代； 3. 设备厂商端：进入北方华创、中微公司供应链体系，配套刻蚀、薄膜沉积等核心设备。 四、绑定核聚变项目 2025年6月，公司与国家科学中心能源研究院共建核聚变真空测量设备实验室，专项研发核聚变场景检漏、抗辐射真空设备，为核心配套单位。产品应用于东方超环、中国环流器二号M等国家级“人造太阳”工程。 五、投资建议： 市场未充分定价公司液冷上游铲子核心逻辑，叠加半导体、核聚变长期价值，公司合理市值超120亿元，对应目标价88元。 ——————————— 欢迎交流：孙潇雅/薛舟#文字观点", "publish_time": "2026-09-03 20:36", "tags": ["文字观点"]}, "post:2026-09-03T12-26:2970dff4efec": {"id": "post:2026-09-03T12-26:2970dff4efec", "kind": "post", "title": "2026-09-03 12:26", "source_label": "帖子正文", "excerpt": "无锡半导体设备展逛完后有什么感受？调研反馈：趋势乐观，信心强化 8月31日-9月2日，中信电子组5人全程参会，组织7家上市公司小范围交流，并走访数十家设备与零部件公司。", "content": "台系散热龙头7月营收均创新高，订单能见度延伸至2029年：奇鋐（AVC）和双鸿7月营收分别为186/38亿新台币（+57%/+117%），均创单月历史新高；AVC披露VR系列液冷产品Q3起贡献营收、Q4进入大规模出货，ASIC水冷订单Q3起出货、Q4有望放量；双鸿亦表示ASIC平台液冷将进入量产阶段；AVC订单能见度已明确覆盖2027-2028年、部分高端项目甚至延伸至2029年；看好液冷板块26下半年从强预期逐步迈入订单落地+业绩兑现的强现实拐点阶段，圈内持续跟踪的奕东电子液冷板代工业务深度绑定液冷龙头台湾奇鋐AVC。---xz#文字观点", "publish_time": "2026-09-03 12:26", "tags": ["文字观点"]}, "post:2026-09-03T07-23:cf1f6933b257": {"id": "post:2026-09-03T07-23:cf1f6933b257", "kind": "post", "title": "2026-09-03 07:23", "source_label": "帖子正文", "excerpt": "20260902复盘 宏观： 1. “小非农”人数低于预期。8月ADP就业人数3.8万人，预期4.8万人，前值4.4万人。", "content": "20260902复盘 宏观： 1. “小非农”人数低于预期。8月ADP就业人数3.8万人，预期4.8万人，前值4.4万人。 2. 美联储“三把手”威廉姆斯表示，近期收益率上升主要受到强劲经济表现、旺盛投资需求推动，与中东冲突也存在一定关联。他评价近期通胀数据表现积极，整体趋势指向通胀水平回落。 3. 贝森特：“总体来看，物价正在回落，核心通胀得到很好控制”。 4. 日本央行审议委员表示下一次加息幅度未必限定为0.25个百分点。市场数据显示，日本央行9月加息概率一度升至97%。 5. 卖方：油价$90-100是央行反应函数关键阈值。若持续区间，加息预期自我强化；若回落$80以下，可能打开沃什缓和空间。 6. 彭博：德国计划未来数周推出更强硬对华贸易方案。 7. 盘前传了会晤延期到明年一季度的假消息。 人工智能： 1. Anthropic发布Claude Fable 5.1和Claude Mythos 5.1两款模型。 2. 马斯克：Grok 4.7模型计划于10天后发布。参数量增40%，性能表现将超越所有AI竞品。 3. 戴尔：FY27营收指引由1670亿美元上调至1920亿美元。 4. SemiAnalysis：Rubin Ultra的预览版规格，HBM配置从此前市场预期的HBM4E 12-Hi、384GB调整为HBM4 8-Hi、192GB，容量大幅缩减。 5. Token支出指数创下历史新低，较今年夏季早些时候创下的高点已下跌超过一半。 6. 月之暗面（Kimi）已于本周以保密形式向港交所递交A1文件，正式启动港股IPO流程。 7. 三星电机与全球大型企业签订约1.07万亿韩元规模的AI服 ：电网并网接入→现场发电→设施侧电力→机柜供电→散热→芯片，维谛自身直接将这套体系称之为从电源到芯片（source to chip），这相比单纯售卖 UPS 或者液冷产品，战略层级提升显著。 核心在于供电落地周期（Time to Power）。首席执行官 Gio Albertazzi 提到一句话：AI 数据中心的竞争优势，越来越取决于从选址到产出首个算力令牌（first token）的耗时。 未来行业会更加看重兆瓦级供电落地时间、首个算力令牌产出时间（Time‑to‑MW / Time‑to‑first‑token）。 UIG 的价值，就是让数据中心可以采用并网模式、并网过渡模式，甚至孤岛式现场发电模式运行。 这也是微电网、燃气发电、储能、开关柜、控制系统近期全部成为 AI 基础设施组成部分的原因。 维谛无意转型成为 GE Vernova 或者卡特彼勒，并不会自研生产全部发电设备。 UIG 的架构具备发电设备无关的特性。 也就是可以依据站点可获取的天然气、燃料电池、电池储能、公用电网、可再生能源、未来发电资源，去设计整套电力架构。 维谛想要掌握的核心，是 “各类电源如何完成协调、切换、控制，再输送至 AI 算力工厂”。 过去维谛大多是在数据中心方案设计完成之后才介入项目。 客户确定 “我要建设一座 500 兆瓦的数据中心” 之后，维谛再提供 UPS、热管理、配电相关产品。 但 UIG 能够让维谛更早介入项目，甚至在设备选型尚未开展阶段，就参与表后电力架构设计。维谛官方表示，UIG 会在项目早期选址规划阶段就参与进来，同时拥有并网、并网过渡、孤岛模式等经过验证的参考设计方案。越早介入架构决策，就越容易影响后续整套物料清单（BOM）。 业务传导逻辑如下： UIG 协助客户设计上游电力架构 维谛 UPS / 开关柜设备 维谛母线槽产品 维谛散热设备 维谛机柜产品 这就是真正意义上的平台业务带动效应（platform pull‑through）。#文字观点", "publish_time": "2026-09-03 15:22", "tags": ["文字观点"]}, "post:2026-09-03T12-57:bac029595229": {"id": "post:2026-09-03T12-57:bac029595229", "kind": "post", "title": "2026-09-03 12:57", "source_label": "帖子正文", "excerpt": "从柜外到柜内：AI电源升级的两场战役——AIDC系列深度(六) 随着GPU/ASIC单芯片功耗及整柜功率持续提升，若供电电压保持不变，传输电流将同步上升，而线路损耗与电流平方成正比，铜耗、发热、线缆及空间约束随之加剧。另一方面，GPU/ASIC核心电压长期维持在约1V附近，芯片侧无法再通过提高电压降", "content": "从柜外到柜内：AI电源升级的两场战役——AIDC系列深度(六) 随着GPU/ASIC单芯片功耗及整柜功率持续提升，若供电电压保持不变，传输电流将同步上升，而线路损耗与电流平方成正比，铜耗、发热、线缆及空间约束随之加剧。另一方面，GPU/ASIC核心电压长期维持在约1V附近，芯片侧无法再通过提高电压降低电流。因此，AI电源升级沿两条路径展开：前端通过升压降低远距离传输电流，后端通过缩短低压大电流传输路径降低PDN电阻。 第一场战役：升压降电流，800VDC推动供电架构由设施侧向服务器内部持续高压化。柜外侧，Sidecar通过兼容现有480Vac基础设施实现800VDC快速导入，巴拿马通过中压侧一体化压缩传统供电链路，SST则以中压直转800VDC为长期演进方向。随着800V进一步进入IT Rack，柜内又形成Shelf级800V→50V与Tray级800V→12V/6V两类路径，前者更强调对现有服务器供电体系的兼容，后者则将高压进一步推近Compute Tray甚至GPU，通过减少中间转换级和低压大电流传输距离提升功率密度。 第二场战役：近距降电阻，800V向板级下沉, 三次电源由分立走向模块/VPD。800V板级直降需要在显著小于传统机架电源的板级空间内完成高变比转换，为压缩磁性器件体积，开关频率由数百kHz向接近1MHz提升，高频工况进一步放大GaN低开关损耗和高功率密度优势。更重要的是，50V、12V、6V中间母线目前尚未收敛，但无论最终采用哪种方案，800V输入侧均需要新增高频高变比DC/DC。 低压大电流推动三次电源由分立式向模块化、垂直供电及更高集成度演进。当供电电压最终降至GPU/ASIC核心所需的约1V附近后，进一步升压难度较高，降低PDN阻抗成为控制损耗的主要手段。传统横向供电需要大电流在PCB上进行较长距离传输，而模块化电源通过提升器件集成度压缩供电面积，VPD进一步将电源移动至芯片背面、直接缩短VRM至芯片的供电路径，长期IVR/SIVR则有望将电压调节继续向封装和芯片内部迁移。 投资建议：AI电源升级沿“前端升压降电流、后端近距降电阻”两条主线展开，建议关注受益于技术迭代的电源及零部件公司，包括一次电源侧的麦格米特、欧陆通、阳光电源、中恒电气、盛弘股份、京泉华、可立克；三次电源侧的中富电路、新雷能、立讯精密、铂科新材、深南电路、龙磁科技、杰华特、三环集团、英诺赛科等。#文字观点", "publish_time": "2026-09-03 12:57", "tags": ["文字观点"]}, "post:2026-09-03T14-15:5bf81c1854d1": {"id": "post:2026-09-03T14-15:5bf81c1854d1", "kind": "post", "title": "2026-09-03 14:15", "source_label": "帖子正文", "excerpt": "AIDC：从液冷到电源，重视电源行情！#建议关注#【中恒电气】：产业地位升级，宁德时代战略入股，算电全链条版图成型。", "content": "AIDC：从液冷到电源，重视电源行情！#建议关注#【中恒电气】：产业地位升级，宁德时代战略入股，算电全链条版图成型。宁德时代41亿元入股控股股东（49%股权，含时代天源PCS资产），间接持有上市公司17.42%权益；同期拟64亿元收购世纪互联38.1%股权。至此，宁德\"电池+储能+IDC+配电\"全链条布局完成，中恒定位从单一设备供应商向算电协同平台跃迁。#【麦格米特】：公司产品矩阵完善，有望充分受益NV电源迭代趋势，AI电源26Q1开始陆续实现批量持续交付。#【盛弘股份】：电能质量受益海外数据中心&高端制造等需求持续向好，北美中压UPS有望贡献新增量。#【电源元器件】：800VDC后电源元器件价值量升级，关注SSCB、接触器、熔断器、薄膜电容等元器件应用。#布局思路1、服务器电源【麦格米特】【欧陆通】【威迈斯】； 2、柜外电源【中恒】【盛弘】【科士达】； 3、电源元器件【宏发】【中熔】【良信】【法拉】。#文字观点", "publish_time": "2026-09-03 14:15", "tags": ["建议关注", "【中恒电气】", "【麦格米特】", "【盛弘股份】", "【电源元器件】", "布局思路", "文字观点"]}, "attachment:files/周期周周谈：中报总结及展望20260902电话会纪要.pdf": {"id": "attachment:files/周期周周谈：中报总结及展望20260902电话会纪要.pdf", "kind": "attachment", "title": "周期周周谈：中报总结及展望20260902电话会纪要", "source_label": "其他", "excerpt": "周期周周谈：中报总结及展望（ 20260902 ）电话会纪要 要点总结 1.电新板块：锂电强现实弱预期，储能高景气但受多重压制 —— 锂电中报多数超预期，但市场因明年 大储弱于预期而表现偏弱；电池环节出现产成品累库现象，需至 10月底或 11月后悲观预期才可能扭 转。", "content": "周期周周谈：中报总结及展望（ 20260902 ）电话会纪要 要点总结 1.电新板块：锂电强现实弱预期，储能高景气但受多重压制 —— 锂电中报多数超预期，但市场因明年 大储弱于预期而表现偏弱；电池环节出现产成品累库现象，需至 10月底或 11月后悲观预期才可能扭 转。光伏仍处周期底部，储能延续高景气但受竞争加剧、汇率及出口退税影响，户储与工商储需求显著 增长。 2.机械板块：农机迎上行周期，高机与工程机械海外共振 —— 农机产销量自 4月起增速超 20% ，受益 粮价提振与更新周期；高空作业平台受益欧美市场复苏，鼎力海外占比高；工程机械龙头三一收入增速 超20% ，三季度汇兑影响减弱后表观增速有望恢复。 3.煤炭板块：动力煤与焦煤三季度利润集中释放 —— 动力煤价格已突破 900 元/吨，焦煤涨幅更大；首 推标的为眼眶（动力煤）与淮北矿业（焦煤），后者三季度产量恢复叠加价格催化，弹性更大；焦煤进 一步涨价空间有限但中长期价格中枢上移。 4.化工板块：二季报创近年新高，油价影响被高估 —— 二季度油价上涨推动化工品价格与库存收益， 业绩同比环比均创新高；当前行业去库已完成、正值旺季，油价波动对基本面影响有限，更应关注行业 自身格局与淡旺季位置。 5.有色板块：铜业绩兑现度最佳，锡中长期看好 —— 有色板块二季度利润首破千亿，铜板块业绩兑现 度最好 日股必须上涨。 4. 前一晚和当天必须全世界和平，俄乌、中东、半岛等等关键地方不能发生意外。非洲和澳洲的矿也不能有事。 5. 特朗普不能乱说话。 6. 美联储不能乱说话。 7. 美国经济数据必须好看。 8. 中国经济数据必须好看。 9. 彭博、路透、大摩、小摩、高盛等不能发针对的观点。 10. 欧盟不能有调查。 11. 日元不能崩、美元不能崩、欧元不能崩，当然人民币更不能。 12. 原油不能大涨。 13. 场内外不许有小作文。 14. 某某券商不能开策略会。 15. 龙头权重股不能有不好的消息。 16. 不能是交割日 不能是月底。 17. 不能是季末，不能是半年末，不能是年末。 18. 不能突然降准，也不能突然不降准，政策力度必须刚刚好。 19. 不能突然降息，市场预期必须提前管理好。 20. 央行不能突然发布超预期的消息。 21. 国务院不能突然开会，开会也不能有市场没想到的内容。 22. 财政政策必须积极，货币政策必须宽松，市场还得相信政策能落地。 23. PMI必须站在荣枯线以上。 24. 社融必须超预期。 25. M2必须增长，M1也必须改善。 26. CPI不能太低，PPI也不能太难看。 27. 房地产数据不能继续恶化。 28. 消费数据必须好看，居民消费信心必须有所恢复。 29. 出口数据必须好看，进口也不能太难看。 30. 人民币汇率必须稳定，不能突然大幅贬值。 31. 北向资金不能突然跑路，外资最好持续流入。 32. 公募基金不能集体赎回。 33. 量化不能突然砸盘。 34. 游资不能突然集体休息。 35. 融资余额必须增加，但又不能增加得太快。 36. 成交额必须放大，最好每天都能维持万亿以上。 37. 成交量放大以后不能被解读成“市场过热”。 38. 印花税不能调整。 39. IPO不能突然加速。 40. 大股东不能减持。 41. 上市公司不能突然业绩暴雷。 42. 龙头公司不能突然被监管问询。 43. 某个行业不能突然爆出重大利空。 44. 某个权重股不能突然宣布巨额再融资。 45. 茅台不能跌，宁德时代不能跌，券商不能跌，银行不能跌。 46. 高股息不能突然跳水，成长股也不能突然集体杀估值。 47. 美债收益率不能突然暴涨，黄金也不能突然暴涨。 48. 比特币不能突然暴跌，全球风险资产情绪必须稳定。 49. 全球市场必须保持风险偏好，VIX不能突然飙升。 50. 必须有人愿意在高位接盘，并且所有人都坚信明天还会继续看多。#文字观点", "publish_time": "2026-09-03 14:04", "tags": ["文字观点"]}, "post:2026-09-03T07-21:025bc6fc4e31": {"id": "post:2026-09-03T07-21:025bc6fc4e31", "kind": "post", "title": "2026-09-03 07:21", "source_label": "帖子正文", "excerpt": "【周四你需要知道的隔夜全球要闻：特朗普称随时准备再对伊朗进行打击；白宫称委内瑞拉产原油或将在11月注入美国战略石油储备】 1、美股三大指数集体收涨，道指涨0.56%，纳指涨0.45%，标普500指数涨0.46%。", "content": "【周四你需要知道的隔夜全球要闻：特朗普称随时准备再对伊朗进行打击；白宫称委内瑞拉产原油或将在11月注入美国战略石油储备】 1、美股三大指数集体收涨，道指涨0.56%，纳指涨0.45%，标普500指数涨0.46%。AI应用软件股、公用事业板块下跌。戴尔科技涨超15%，英伟达、甲骨文涨超3%。 2、美国总统特朗普称对伊朗的新一轮打击不会“持续太久”；美方随时准备再对伊朗进行一次打击。 3、美国白宫表示，委内瑞拉协议所产原油或将在11月注入美国战略石油储备。 4、美国财政部长贝森特表示，由于700亿美元的关税退款，今年的预算缺口有所扩大。 5、美国财政部长贝森特表示，回购国债的目标是消除“不良结果”；将回购流动性差、期限长的债券。 6、国际油价上涨，WTI原油期货收于每桶91.01美元，涨幅0.88%；布伦特原油期货收于每桶95.63美元，涨幅1.04%。 7、国际贵金属上涨，现货黄金涨1.39%，报4389.36美元/盎司。现货白银涨1.97%，报65.3440美元/盎司。 8、欧洲主要股指收盘集体下跌，英国富时100指数跌0.30%，法国CAC40指数跌0.29%，德国DAX30指数跌0.49%。 9、美国铸币局正式推出印有特朗普头像的1美元硬币。 10、美国总统特朗普提议将霍尔木兹海峡更名为“特朗普海峡”。 11、美国中央司令部通报称，美军在对伊朗的海上封锁行动中已要求86艘商船改变航向。 12、荷兰将8 务相对于国内主要同业的增长溢价已收窄至5个百分点左右，因 此我们不再以此为据；目前的差异化因素来自GPU云。 •底层业务好于较预期低39%的调整后净利润所反映的水平。调整后营业利润 同比下降15%，而我们的预测为降18%；百度一般性业务的调整后营业利润 率为15%，环比持平；在线营销业务同比下降19%，而我们的预测为降23%。与市场一致预期的差距源于营业利润线以下的项目，主要来自汇兑损益、31%的税率以及利息收入减少，而非云业务利润率下降或AI投资意外增多。 这些项目对盈利很重要，但并未改变我们对运营执行的看法。 •我们下调目标价的原因是将AI原生营销业务市盈率从20倍下调至8倍，同时 提高了净现金扣除幅度（20%）。2季度资本支出为114亿元人民币，超过34 亿元人民币的经营性现金流；2026年上半年总借款增加约140亿元人民币，2026年2季度回购规模降至8,700万美元左右。百度仍持有可观的净现金，但目前应将更多净现金视为承诺运营资本，而非盈余资本。我们对AI业务的估 值从5月的每ADS 168美元降至约114美元，而且目前集中在基础设施上。 如果2026年3季度AI云基础设施不超过70亿元人民币或GPU云增速低于 100%，我们就可能重新审视我们的投资逻辑，原因是任何一种情况都可能弱 化我们的调整后逻辑。 表1: 百度预测调整 年底止于12月31日 2026E 2027E 百万元摩根大通 预测- 调整前摩根大通 预测- 调整后 % 变动 市场一致 预期% 差幅摩根大通 预测- 调整前摩根大通 预测- 调整后 % 变动 市场一致 预期% 差幅 净收入 131,982 126,853 -4% 128,954 -2% 155,296 147,068 -5% 137,682 7% 百度核心 107,232 102,705 -4% 130,082 122,812 -6% 爱奇艺 25,358 24,735 -2% 25,214 24,256 -4% 业务板块间抵扣 (608) (587) 0% - - 0% 毛利润 52,425 50,010 -5% 56,722 -12% 69,953 66,365 -5% 62,008 7% 营业利润(GAAP) 10,656 9,212 -14% N/A 19,736 18,116 -8% N/A 营业利润(非GAAP) 15,513 13,307 -14% N/A 26,275 24,363 -7% N/A 百度核心 15,370 13,416 -13% N/A 26,073 24,242 -7% N/A 爱奇艺 138 (112) -182% N/A 203 121 -40% N/A 税前利润(GAAP) 15,724 13,090 -17% 14,938 -12% 27,647 24,650 -11% 18,992 30% 净利润(GAAP) 12,828 10,481 -18% 12,688 -17% 22,132 19,702 -11% 15,707 25% 净利润(非GAAP) 17,957 14,343 -20% 15,639 -8% 28,672 25,949 -9% 18,602 39% 每ADS盈利(GAAP) 稀释后(元) 37.13 30.41 -18% 38.18 -20% 64.06 57.21 -11% 50.81 13% 每ADS盈利(非GAAP) 稀释后(元) 51.97 41.61 -20% 45.05 -8% 82.98 75.35 -9% 56.25 34% 利润率分析(%) 毛利率 39.7% 39.4% -0.3% 44% 45.0% 45.1% 0.1% 45% 营业利润率(GAAP) 8.1% 7.3% -0.8% N/A 12.7% 12.3% -0.4% N/A 营业利润率(非GAAP) 11.8% 10.5% -1.3% N/A 16.9% 16.6% -0.4% N/A 净利润率(GAAP) 9.7% 8.3% -1.5% 10% 14.3% 13.4% -0.9% 11% 净利润率(非GAAP) 13.6% 11.3% -2.3% 12% 18.5% 17.6% -0.8% 14% 资料来源：摩根大通估算、Bloomberg Finance L.P.（截至2026年8月19日） 表2: 百度SOTP估值表 百万美元 估值基础 估值指标 倍数持股 比例%控股公司 折让 各业务板块在 集团估值中 占比 % 估值 AI云基础设施（剔除昆仑芯收入） 企业价值/收入 2026年预期AI云基础设施收入 6.0x 100% 35% 21,437 昆仑芯 企业价值/收入 2026年预期昆仑芯收入 35.0x 67% 50% 24% 14,311 A jpmorgan.com 登记编号: S1730524090001 摩根大通证券（中国）有限公司 分析师声明及重要披露，包括非美国分析师披露，见第9页。 我们在2026年2季度业绩发布后更新了模型，并维持“增持”评级。总体 而言，我们认为网易的运营状态健康：1）虽然无重磅新品上线，但在多款 老游戏的支撑下，网易2026年2季度在线游戏收入同比增长10%（较一季 度的7%有所上升），例如《逆水寒》手游用户总数在6月创下新高；《蛋仔派对》月活保持在1亿以上，依托UGC内容生态，暑期期间移动端日活创下新高；《梦幻西游》系列收入创新高；《燕云十六声》多次跻身Steam收入榜前三。我们认为，AI有望助力网易延长存量游戏生命周期，以合理成本为现有玩家提供更好的游戏体验。2）受益于端游/自研游戏占比提升以及渠道成本优化，“游戏及增值服务” 毛利率创下新高（76.1%，环比/同比分别提升1.3个/5.9个百分点），推动2季度营业利润同比增长29%。我 们预计3季度/4季度营业利润将分别增长35%/28%。我们将2026/27年游戏 收入增速预测从10%/12%下调至9%/10%，以反映《遗忘之海》国内上线初期表现偏弱（管理层在业绩会上表示正在优化游戏体验）。我们认为该游戏的海外发行将是下一个关键观察点。虽然网易有多款新游戏储备，但上线时间尚不明确（《梦幻西游》免费手游版今日（8月21日）上线）。在重磅新游戏上线时间正式公布前，我们预计短期内股价将保持区间波动。不过，受益于相对较低的基数及存量游戏的良好势头，我们依旧看好下半年游戏收入稳健增长，预计3季度/4季度分别增长9%/10%。公司当前估值对应13倍/11倍的2026/27年预期市盈率（基于摩根大通预测），具备吸引力。 •股价跑赢大市需等待下一款重磅游戏。虽然我们仍看好网易的长期前景， 但我们认为股价跑赢大市需下一款重磅新游戏支撑。网易的主要新游戏储 备包括：1）《遗忘之海》海外上线（我们估计将于2026年下半年上线， 预计该游戏在海外硬核玩家中的表现更佳）；2）《诡影藏锋》，一款中式志怪风格生存动作游戏；我们注意到游戏预告片的玩家反馈良好；3）《雾海之下》，一款卡通风格的搜打撤动作游戏；4）《无限大》，一款开放世界都市冒险RPG游戏。 8月25日科隆游戏展上将发布游戏新信息。 •下调目标价，维持“增持”评级。我们将网易美股/港股（9999 HK）目标 价分别从185美元/290港元下调至180美元/280港元，原因是2026年预期 每股收益下调4%（预期游戏收入下降、投资亏损增加，被毛利率上升所 抵消）。我们的目标价基于19倍的2026年预期市盈率（此前为20倍，倍数下调原因是游戏收入假设下调以及同业游戏公司估值下调），与网易过去5年的12个月滚动市盈率均值一致。 日）21月8年 2026 （截至 Bloomberg Finance L.P. 资料来源：摩根大通估算、35.2% 36.9% 36.1% 34.0% 34.2% 35.2% GAAP)非( 净利润率33.1% 34.3% 34.0% 31.7% 31.8% 33.2% (GAAP) 净利润率42.3% 41.4% 41.4% 40.3% GAAP)非( 营业利润率37.1% 39.7% 39.3% 36.7% 39.0% 38.2% (GAAP) 营业利润率68.3% 71.0% 70.0% 67.8% 70.0% 68.9% 毛利率 (%) 利润率分析 4% 71.62 -1% 74.42 75.30 1% 63.61 -4% 64.03 66.73 稀释后（元）GAAP)非(收益 ADS每1% 68.30 -3% 69.18 71.09 0% 59.22 -5% 59.45 62.90 稀释后（元）(GAAP)收益 ADS每4% 45,977 -1% 47,951 48,604 1% 41,055 -4% 41,276 43,069 GAAP)非( 净利润3% 43,248 -3% 44,574 45,889 0% 38,346 -6% 38,324 40,602 (GAAP) 净利润5% 53,438 -3% 55,948 57,413 3% 47,518 -4% 48,971 50,897 (GAAP) 税前利润-1% 55,032 55,745 1% 49,936 49,308 GAAP)非( 营业利润7% 48,465 -3% 51,655 53,030 6% 44,345 0% 46,984 46,841 (GAAP) 营业利润-2% (5,195) (5,303) -1% (4,422) (4,471) 管理 -1% (16,948) (17,157) 0% (15,756) (15,692) 销售 -2% 业利润率可持续。#FY27-28AI收入指引上修：FY27约1150亿，FY28约2300亿，两年3500亿供给已锁定 上调FY27 AI收入至约1150亿（原1000亿），FY28约2300亿，均为供给锁定后的保守数，需求更高；FY28 EPS超30美元。30GW不会全部在两个财年内投产，收入按可投产量折算；单GW博通内容200–300亿美元。#客户进展：Anthropic2027年成最大客户，OpenAI芯片性能超GB Ultra -谷歌：签署多年长约，未来数年年均数百亿美元TPU；Ironwood（v7）大规模出货，v8i已开始量产出货且早于第二供应商联发科。 -Anthropic：2026年1GW Ironwood、2027年+5GW v8i、2028年+10GW，#2027年起成为最大XPU客户。-OpenAI：2027年1.3GW首代XPU，2028年超5GW成为第二大客户，二代已流片、三代在研；首代芯片推理性能超GB Ultra，接近Vera Rubin，成本约为GPU一半。 -Meta：到2027年交付三代MTIA，2028年3GW。#网络：TomahawkUltra以太网scale-up开始渗透GPU集群 Tomahawk 6（100T）已部署于几乎全部自研XPU客户，非XPU客户也在采用；Tomahawk 7（200T）已流片；Tomahawk Ultra本季起部署、FY27放量，XPU及部分GPU集群均在采用。AI网络增速预计与XPU相当。#瓶颈为土地电力机房（决定投产时点）、先进制程、基板、HBM及系统内存；新加坡基板厂FY27投产，EML/CW激光器产能扩三倍以上，为Capex上行原因。 #XPV和资本配置：目标2028年底前20GW，公司不直接出资 联合Apollo、Blackstone，首期350亿6月关闭（Anthropic 1GW），第三方承销，必要时提供少量残值担保。 #盘后下跌原因：FY26Q4指引略低于市场预期，AI半导体收入指引低于买方最乐观预期+循环融资担忧 1） Q4营收指引348亿略低于一致预期350亿，AI 217亿隐含非AI和软件环比基本持平，对一只priced for perfection的标的而言beat幅度不够； 2） FY27指引1150亿低于买方乐观预期（1300-1500亿），我们认为1150亿是供给锁定的下限而不是天花板； 3） 增量一半以上来自Anthropic/OpenAI且依赖XPV融资，循环融资质疑仍然存在。 #FY27-28指引落地后跌幅收窄，后续跟踪A+O融资落地及XPV进展，TPU v8i和OpenAI首代XPU放量节奏。 国泰海通海外科技 秦和平/曾天#文字观点", "publish_time": "2026-09-03 08:25", "tags": ["FY27-28", "客户进展", "Anthropic", "2027年起成为最大XPU客户", "网络", "Tomahawk", "文字观点"]}, "attachment:files/JPM-中微公司-688012-存储上行周期及薄膜沉积设备起量料将驱动盈利增长；维持“增持”评级-20260823.pdf": {"id": "attachment:files/JPM-中微公司-688012-存储上行周期及薄膜沉积设备起量料将驱动盈利增长；维持“增持”评级-20260823.pdf", "kind": "attachment", "title": "JPM-中微公司-688012-存储上行周期及薄膜沉积设备起量料将驱动盈利增长；维持“增持”评级-20260823", "source_label": "JPM", "excerpt": "BGRHWGo4sYcUdX9P8Q9PsQnNpNpRiNnNvNeRsQnRaQmNmQMYnMoRMYnMxP", "content": "BGRHWGo4sYcUdX9P8Q9PsQnNpNpRiNnNvNeRsQnRaQmNmQMYnMoRMYnMxP", "status": "extracted"}, "post:2026-09-03T21-57:87ec451812f9": {"id": "post:2026-09-03T21-57:87ec451812f9", "kind": "post", "title": "2026-09-03 21:57", "source_label": "帖子正文", "excerpt": "【东吴计算机】行业深度报告——液冷：下一代AIDC基础设施，Rubin带来行业确定性 Rubin 全面量产，液冷升级为 AIDC 刚性基础设施 机架级 AI 计算使散热与供电、互联深度绑定，液冷凭热流密度、电力与交付三重刚性成为必要。Vera Rubin NVL72 单柜集成 72 颗 GPU，20", "content": "【东吴计算机】行业深度报告——液冷：下一代AIDC基础设施，Rubin带来行业确定性 Rubin 全面量产，液冷升级为 AIDC 刚性基础设施 机架级 AI 计算使散热与供电、互联深度绑定，液冷凭热流密度、电力与交付三重刚性成为必要。Vera Rubin NVL72 单柜集成 72 颗 GPU，2026 年 5 月底全面量产，下半年液冷订单与出货先行放量，2027 年形成完整年度贡献。 单相冷板主导 Rubin 周期，国产替代进入批量交付阶段 利润池向高性能冷板与高可靠连接件集中，Manifold、管路及部分 CDU 率先国产放量。英维克、申菱环境等已进入 MGX 生态及主流芯片厂规模采购，2026-2028 年国产份额提升有望快于行业增长。 建议关注：英维克、申菱环境、高澜股份、思泉新材、同飞股份、领益智造、奕东电子、金富科技。#文字观点", "publish_time": "2026-09-03 21:57", "tags": ["文字观点"]}, "post:2026-09-03T10-57:1571c7d1da73": {"id": "post:2026-09-03T10-57:1571c7d1da73", "kind": "post", "title": "2026-09-03 10:57", "source_label": "帖子正文", "excerpt": "敦促诸看空银行者投降书！看空银行、嘲讽红利的诸位投资者： 你们现在已经到了山穷水尽的地步。", "content": "敦促诸看空银行者投降书！ 看空银行、嘲讽红利的诸位投资者： 你们现在已经到了山穷水尽的地步。银行的上涨路线图已经实现，90%的银行股在今年都实现了涨幅的飞跃，不仅是工农中建这类国有大行涨，苏州银行、成都银行这类城商行也同样涨得好。 你们还幻想银行崩盘是没有希望了。你们想突围吗?如果大A有做空工具你们倒是可以尽管一试，可是这里偏偏没有，怎么突围得出去呢?你们这几天写了很多研报，可是冷嘲热讽又有什么结果呢? 你们唱空、你们减仓、你们想要用科技股对冲也都没有用。银行上涨的办法比你们的套路还要多，这就是高股息避险和存款搬家。大家管这些叫土办法，难道不是比你们吹捧科技股、空仓观望的洋武器要厉害十倍吗? 你们的半导体兵团已经完了，剩下你们新能源兵团,也已经时日不多。你们虽然把刚刚进来的许多散户和新发ETF资金强迫编入你们的队伍,但这些人怎么能打仗呢? 年轻人说他们不买银行股，他们现在不买银行能保证将来不买吗?他们亏钱的时候不买能坚持回本了也不买吗?他们平时不买能保证大盘跌破3000点的时候还不买吗? 以不买银行为荣的年轻人们,你们要时刻记住:你们不买银行的行为,恰好说明市场风险偏好还集中在少数赌徒的手上。 这些天来，在我们的层层包围和重重打击之下，你们的阵地大大地缩小了。你们只有那么一点收益，横直不过十几个点就要回调一波，这样多基金挤在一起，大A一次风格切换，就能打死你们一堆人。 每年A股都有一个避风港,抓住一次就能保住本金,比如今年的银行,去年的银行，前年的银行，还有明年的银行。 而你们的基民和亏损者，跟着你们叫苦连天。你们的粉丝和很多拥趸，大家很不想买科技新能源了，你们当基金经理的，当首席分析师的，当投顾大V的，应该体恤你们的金主和粉丝的心情，爱惜他们的本金，早一点替他们找一条生路,早一点调仓银行,别再叫他们做无谓的牺牲了。 现在你们中的半导体已经回调21%了，新能源也已是-18%了，我们这次作战才两百来天，你们方面已经损失了地产师、券商师、保险师、军工师、短剧师、AI师、光伏师、锂电师...你们总共丧失了三四十个整师。 其中除AI师还在蹭英伟达财报,光伏师还在炒作产能出清之外,你们的部队基本已经被歼灭,我们还可以集中几倍于你们的险资兵力来打你们。 空头的下场你们都已经亲眼看到了,两年前一位你们的消费首席大放厥词,说\"银行是旧经济坟墓\",可你们看,现在一个工商银行就等于整个半导体板块的股息了! 你们应当学习调仓者的榜样，立即下令全军放下成见，停止踏空，买入银行，本军可以保证你们职业生涯和净值曲线的安全。 眼下又到了中报分红季,我们的银行已经开始陆续提高分红率和回购计划了，明年的息差改善只是分分钟的事，资产质量优化是可持续的。只有买银行，才是你们的唯一生路。 你们想一想吧!如果你们觉得这样好,就这样办。如果你们还想扛一下，那就再扛一下，总归你们是要来接盘的。银行多军司令部 2026年9月3日#文字观点", "publish_time": "2026-09-03 10:57", "tags": ["文字观点"]}, "attachment:f 当局更可能聚焦于加快现有预算的执行效率，而非出台大规模、超预期的“火箭炮”式刺激。这意味着政策将以微调为主，保持定力。 三、房地产：开发商融资收紧，按揭规则边际放松 • 开发商端：引入“牵头行制度”，每个项目由一家主要银行负责闭环资金管理；土地购置贷款维持禁止；项目贷款期限明确设限（预售项目通常≤3年，最长5年；现房项目通常≤5年，最长7年）；按揭放款节点大幅后置——预售项目须在项目完成备案后方可发放按揭，现房项目须在销售备案后放款。整体融资环境进一步规范化、收紧。 • 居民端：借款人负担能力测试调整，月供收入比上限设为50%，债务收入比上限放宽至60%；按揭期限上限从30年延长至40年。这在一定程度上降低了购房门槛，但收入预期和房价预期仍是制约销售的关键。 四、经济跟踪：双速运行，出口强、消费与建筑弱 • 出口保持强劲：8月前20天韩国出口增速依然稳健，主要发达经济体8月制造业PMI读数强劲，显示外需对中国出口的拉动仍在持续。 • 消费复苏乏力：线上家电销售虽因低基数同比反弹，但环比动能疲弱，内需修复基础不牢。 • 建筑活动低迷：水泥出货量和螺纹钢需求均未见起色，基建与地产施工端尚未出现实质性回暖。 • 房地产销售疲软：50城周度一手住宅销售在低位徘徊；10城二手住宅销售呈下行趋势，市场信心亟待修复。 • 工业利润承压：工业利润增长自2026年第二季度以来持续放缓，主因能源冲击和内需疲弱拖累非科技下游行业利润率，上游与科技板块相对抗压。 五、美联储政策：Jackson Hole反应与摩根士丹利的观点 • Warsh的鹰派信号：Kevin Warsh（预计将出任美联储主席）在Jackson Hole的讲话明显偏向鹰派，主张加息。其核心观点包括：实体经济表现尚可；通胀水平高企且应优先考虑；货币政策并不具备限制性；美联储不能依赖均值回归来实现物价稳定。 • 大摩的保留意见：摩根士丹利并不认同立即加息，维持“美联储按兵不动”的基准判断。理由在于：Warsh发表鹰派言论符合其自身利益，但他也展现出保留灵活性与观望更多数据的意愿；通胀正朝着合意方向取得进展，8月CPI数据可能进一步提供反通胀证据。因此，政策路径仍存在变数，需密切关注后续数据。 六、投资启示 • 宏观层面：在政策微调、外需有韧性但内需偏弱的背景下，整体经济增长动能仍面临考验，传统周期板块反弹空间受限。 • 结构层面：科技与高端制造（如AI供应链、半导体、新能源等）作为“焦点”领域，可能持续获得资金青睐与政策支持，与宏观忧虑形成鲜明对比。 • 风险提示：需警惕房地产链条风险进一步释放、能源价格冲击对利润的挤压，以及美联储政策超预期转鹰引发的全球流动性波动。 总结：中国经济正呈现“出口强、内需弱”的双速格局，政策以现有框架内的微调为主，难有强刺激；房地产融资收紧与按揭边际放松并行，市场底仍需等待；在宏观忧虑弥漫之际，科技板块的结构性机会成为资金避风港，同时需关注美联储政策转向的潜在冲击。#文字观点", "publish_time": "2026-09-03 08:27", "tags": ["文字观点"]}, "attachment:files/众安在线2026年中期业绩交流电话会纪要20260902.pdf": {"id": "attachment:files/众安在线2026年中期业绩交流电话会纪要20260902.pdf", "kind": "attachment", "title": "众安在线2026年中期业绩交流电话会纪要20260902", "source_label": "其他", "excerpt": "众安在线 2026 年中期业绩交流电话会纪要 20260902 要点总结 1.战略重心转向高价值险种 ：公司未来将重点发展健康险、宠物险、车险等久期更长、客单价更高、 对用户价值更大的产品，航旅等碎片化互联网保险更多承担早期能力建设角色。2.车险业务短期承压但方向不变 ：上半年车险保费增速放缓受行业新车销量波动影响，公司正积极为 更多地区自主经营（含交强险、", "content": "众安在线 2026 年中期业绩交流电话会纪要 20260902 要点总结 1.战略重心转向高价值险种 ：公司未来将重点发展健康险、宠物险、车险等久期更长、客单价更高、 对用户价值更大的产品，航旅等碎片化互联网保险更多承担早期能力建设角色。 2.车险业务短期承压但方向不变 ：上半年车险保费增速放缓受行业新车销量波动影响，公司正积极为 更多地区自主经营（含交强险、商业车险）打基础，方向未变，利润率保持稳定。 3.消费金融板块坚定收缩 ：公司基于外部信用环境较早进行规模收缩，下半年降幅预计与上半年相 当，明年可能进入更低水平，但有序清退过程中利润率和资产质量保持稳定可控。 4.费用率持续优化受益于 AI赋能：AI在营销、客服触达等环节不仅降低成本，还带来新增量；随着保 费规模增长，规模效应将更加显著。 5.权益配置比例已达阶段性高位 ：权益占比从去年底 9%提升至今年 6月末约 13%，管理层认为已处 于较高区间，未来仍以 \"固收+\"策略为主，权益端择机调整板块。 6.ZABank 进入利润拐点 ：在去年首次盈利基础上，净利润水平有序提升，定位从银行向财富管理平 台转型，非息收入占比持续提升。 7.科技板块实现扭亏为盈 ：孵化企业已从收入发展阶段进入利润贡献阶段，未来科技板块利润将不断 提升。 问答整理 Q1：汽车生态上半年保费增速放缓，下半年业务增长如何展望？部分地区试点自主保险的业 务版图展望？ 答：车险是接下来大力发展的领域。上半年增速放缓一方面因行业大环境，另一方面公司在积极为更多 地区自主经营（交强险、商业车险）打基础，方向没有变。整体利润率上半年保持稳定。后续能否拿到 更多地区交强险资质，取决于监管审批，届时会进一步分享。 Q2：消费金融板块未来的定位是什么？会继续控制业务质量作为增长构成，还是完全退出？ 答：接下来会坚定对业务进行较大幅度收缩，预计下半年降幅与上半年相当，预期到明年基本进入更低 水平。有序清退过程中，整体利润率和资产质量保持稳定可控。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 Q3：费用率持续压降的主要因素是什么？能否系统性介绍费用率压降举措？ 答：整体看到 AI对很多业务环节效能的提升，这并非仅上半年，过往几年趋势已较明显。 AI在营销、 客服触达用户环节不仅带来效率成本下降，更带来新增量。随着保费不断增长，规模效应将更加显著。 Q4：今年上半年大类资产配置策略有何调整？全年及中长期维度展望？ 答：今年抓住市场权益机会，权益比重从去年底 9%提升至 6月末接近 13%。13%对管理层来说已是较 高区间，未来没有预期进一步大幅提升。上半年成长类板块带来较强投资收益回报。未来仍以 \"固收+\" 整体配置策略为主，权益板块根据市场行情择机调整，力求稳健投资收益。 Q5：如何看待偿付能力新规对投资收益率的约束？保险公司是否会提升红利资产配置？ 答：会根据市场行情变化分配一些红利资产，但整体仍保持稳健，按照监管要求执行。 Q6：香港监管政策变化（境外资产、保险配置等）对 ZABank 业务有何影响？ 答：没有看到明显影响。上半年 ZABank整体利润增长及非利息收入增长非常稳健，在去年首次盈利 基础上净利润水平有序提升，已进入利润拐点。未来银行不仅是银行，更是财富管理平台，通过股票基 金、港股打新等新服务完善面向消费者的财富管理，提升非息收入占比。 Q7：ZABank 财富管理平台目前服务构成如何？未来有哪些新功能上线？ 答：未来有很多功能值得期待。包括利用银行资金端低成本优势推出配套产品，交易环节也有很多产 品。针对用户跨境转账、汇款、外汇需求，今年已上线港币直接购买美元基金（无需换汇）等服务。未 来会持续开发新产品满足消费者需求。 Q8：科技板块扭亏为盈，业务增长及盈利展望如何？ 答：科技板块更多通过孵化的几家企业进行国内科技输出。过往几年它们已从收入发展阶段进入利润贡 献阶段，未来科技板块利润会不断提升。 Q9：基于上半年经营表现，对全年盈利展望是否有调整？能否给到更稳定明确的盈利预期？ 答：承保端已实现今年可能第六年或未来持续承保盈利，银行和科技已进入拐点，基本面盈利水平非常 稳健。投资端追求在稳健基础上获得更多市场超额收益。整体基本面越来越稳定，但没有给出具体全年 盈利数字展望。 原文 （注：输入为电话会口语逐字稿，按原始对话整理，已过滤广告及引流内容。） ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408", "status": "extracted"}, "post:2026-09-03T11-24:398c9da1f19f": {"id": "post:2026-09-03T11-24:398c9da1f19f", "kind": "post", "title": "2026-09-03 11:24", "source_label": "帖子正文", "excerpt": "天风通信 | 金刚石板块大涨：重申散热材料升级暗线渐明 🔥核心逻辑：#算力全链功耗提升、散热材料从幕后走向台前。1）华为韬定律采用逻辑堆叠，论文中明确“热管理是关键挑战”。", "content": "天风通信 | 金刚石板块大涨：重申散热材料升级暗线渐明 🔥核心逻辑：#算力全链功耗提升、散热材料从幕后走向台前。 1）华为韬定律采用逻辑堆叠，论文中明确“热管理是关键挑战”。# 后续有望在芯片和光互连层级采用金刚石等新散热材料。 2） 心是明年的产业模式，比如PTFE与msap，技术壁垒高、行业份额高的企业都会有溢价。2027年之前，PTFE混压方案落地概率为90%，主要应用于switch交换板和正交背板场景。", "content": "#出处未知#科技三季度会交易上游，重心是明年的产业模式，比如PTFE与msap，技术壁垒高、行业份额高的企业都会有溢价。 2027年之前，PTFE混压方案落地概率为90%，主要应用于switch交换板和正交背板场景。继续押注PTFE，关注生益科技、联瑞新材 多家板厂加速mSAP布局：景旺已建成3条、年内计划增至5条mSAP产线，26Q2的800G光模块PCB收入环比增长1500%；鹏鼎26H1光模块业务收入6.26亿元（同比+1100%）；博敏800G mSAP已量产交付、产能持续扩充；方正科技800G、1.6T光模块PCB已批量。msap药水关注天承科技。#文字观点", "publish_time": "2026-09-03 09:44", "tags": ["出处未知", "文字观点"]}, "post:2026-09-03T23-03:446a9988a3f7": {"id": "post:2026-09-03T23-03:446a9988a3f7", "kind": "post", "title": "2026-09-03 23:03", "source_label": "帖子正文", "excerpt": "关注液冷低位标的】#飞亚达-液冷产能规划大幅上修、国内外客户同步推进。", "content": "【关注液冷低位标的】#飞亚达-液冷产能规划大幅上修、国内外客户同步推进。 ⭕#深南老将挂帅飞亚达切入国内头部算力链的客户资源优势值得重视。公司董事长周进群此前在深南电路工作二十余年，从生产工艺一线一路做到董事、总经理，并曾负责无锡、南通两大生产基地，兼具技术、制造和大客户经营经验。 深南电路长期处于国内高端电子制造核心供应链，我们认为周总履新后，有望将其在通信、服务器及高端制造领域积累的客户资源和供应链经验向飞亚达导入，尤其有利于公司液冷业务对接华为、海光等国内头部算力客户。 ⭕#产能规划由10万套上修至20万套、满产对应20亿元+产值空间。公司此前规划约10万套液冷模组产能，目前实际规划已提升至约20万套，预计10-11月开始逐步生产。单套液冷模组价值量约1万多，产品覆盖液冷板+Manifold+快接头+管路等二次侧核心部件，20万套满产对应20亿元+产值。公司液冷业务已经由单一精密加工切入进一步向二次侧液冷模组集成延伸，单客户价值量和业务天花板明显提升。 ⭕#国内客户进入集中认证窗口、H客户、海光、寒武纪等头部客户均在推进。 公司当前同时对接芯片厂、服务器厂商及CSP客户，包括H客户、海光、寒武纪、曙光等，预计今年10-11月产线和产品体系逐步完善后进入审核认证阶段，明年初开始陆续推进客户认证及订单导入。 ⭕#海外链条样品已送台湾并在英伟达相关平台完成测试。 后续有望承接部分台系液冷订单外溢。我们认为，公司海外路径与金富科技、五洋自控等代工链存在一定相似性，即依托国内精密制造和成本优势承接台系液冷厂商外溢产能；若后续进入批量订单阶段，将进一步打开海外客户空间。 ⭕#公司液冷逻辑正向订单兑现。目前公司已形成Cold Plate、Manifold、QDC、管路及模组集成的完整产品框架，20万套产能对应20亿元+产值，国内头部算力客户及海外台系链条均在推进。待华为等国产算力客户认证及台系外溢订单进一步落地，液冷有望成为公司重要新增量。叠加钟表基本盘和长空齿轮机器人业务，现阶段建议重点关注飞亚达后续产线、认证及订单兑现节奏#文字观点", "publish_time": "2026-09-03 23:03", "tags": ["公司液冷逻辑正向订单兑现", "文字观点"]}, "post:2026-09-03T20-49:83f899c5a36e": {"id": "post:2026-09-03T20-49:83f899c5a36e", "kind": "post", "title": "2026-09-03 20:49", "source_label": "帖子正文", "excerpt": "hcdx 科翔股份：Rubin散热刚需核心增量，主业HDI盈利改善 ＃独家陶瓷混压pcb技术，公司与客户联合研发了独家配方＆烧结工艺，解决了大尺寸陶瓷版脆性和翘曲问题，是唯一能提供", "content": "hcdx 科翔股份：Rubin散热刚需核心增量，主业HDI盈利改善 ＃独家陶瓷混压pcb技术，公司与客户联合研发了独家配方＆烧结工艺，解决了大尺寸陶瓷版脆性和翘曲问题，是唯一能提供该方案的pcb厂商。 ＃Rubin 二、今日最强主线\n\n- **主线：液冷从可选变为AI数据中心刚性基础设施**\n  - 今天强化的逻辑：英伟达Rubin；东吴计算机提出液冷凭热流密度、电力与交付三重刚性成为AIDC必要基础设施。\n  - 今天出现的催化/验证：央视财经报道液冷产线满产、CDU订单排至2026年底并展望2027年；皖仪科技作为液冷检漏环节被重点推荐；金帝股份拟投资建设液冷关键换热部件及高效散热模组项目（投资额2.10亿元、2.16亿元），冷锻+冲压级进模替代CNC机加工，成本降幅达40%。\n\n- **主线：AI硬件财报高增后的市场预期分歧**\n  - 今天强化的逻辑：博通财报绝对增速很强，但Q4营收指引348亿美元略低于一致预期351亿美元，营业利润率指引66%构成负面意外；AI硬件“高增长”边际钝化讨论升温。\n  - 今天出现的催化/验证：博通指引Q4 AI半导体收入217亿美元（同比+236%）；AI收入FY27/FY28指引1150亿/2300亿美元，Anthropic、OpenAI合计贡献两年增量过半；博通称对EML激光器与CW激光器需求远超行业供应，前四大供应链限制为土地/电力/厂房、领先硅技术、基板、HBM。\n\n- **主线：AI数据中心供电从设备向“从电源到芯片”升级**\n  - 今天强化的逻辑：维谛（Vertiv）收购UIG，布局电网接入、现场发电、微电网架构，意在解决AI数据中心供电落地周期（Time to Power）难题，战略定位从设施侧电力+散热设备商向上游延伸。\n  - 今天出现的催化/验证：维谛业务版图变为“电网并网接入→现场发电→设施侧电力→机柜供电→散热→芯片”（source to chip）；AI电源升级的两场战役被认为是800V向板级下沉、三次电源由分立走向模块/VPD；中恒电气因产业地位升级、宁德时代战略入股被建议关注。\n\n- **主线：PCB/CCL涨价叠加AI代际升级，上游材料溢价**\n  - 今天强化的逻辑：铜箔和玻纤成本上涨推动覆铜板涨价，PTFE与mSAP被视为明年产业模式重点；代际升级带动PCB价值量持续提升。\n  - 今天出现的催化/验证：松下CCL最高涨30%、建滔FR-4统一涨10%、联茂法说会表示下半年逐季涨价且每季双位数涨幅；多家板厂加速mSAP布局，景旺已建成3条、年内计划增至5条，26Q2的800G光模块PCB收入环比增长1500%；NV Rubin Ultra 576 Oberon架构中compute tray层数增加显著、switch tray增加至18个。\n\n- **主线：散热材料升级从幕后走向台前**\n  - 今天强化的逻辑：算力全链功耗提升，热管理在华为“韬定律”逻辑堆叠论文中被明确为关键挑战；1.6T光模块功耗将超40W，普通散热凝胶难以导热。\n  - 今天出现的催化/验证：金刚石散热板块大涨，相关标的包括国机精工、沃尔德、四方达、惠丰钻石等；科创新源石墨烯+陶瓷基板，冷板业务Q3放量，7月单月交付量已超H1总量（字节等），9-10月CM订单有望批量落地；陶瓷产品已在北美头部Phononic实现突破，泰国工厂实现大规模量产供货。\n\n- **主线：AI应用/软件进入业绩兑现验证期**\n  - 今天强化的逻辑：AI产业风格切换观点指出软件应用进入收入与利润双兑现阶段；AI Infra层仍处高景气。\n  - 今天出现的催化/验证：Snowflake二季度营收15.5亿美元（分析师预期14.9亿美元），AI产品用户快速增长，盘后大涨超20%，全年产品营收指引60.7亿美元高于预期；Anthropic发布Fable 5.1，推升AA智能指数至66分，缓存读取降价75%；月之暗面（Kimi）已在本周以保密形式向港交所递交A1文件，正式启动港股IPO流程。\n\n## 三、今日重点关注\n\n### 3.1 今天已经发生的重点变化\n\n- 液冷产能与订单信号强化：央视财经报道山东、广东等地液冷产线满产运行，CDU订单排至2026年底，部分交付展望到2027年。\n- 英伟达Rubin全液冷范式确立：100%整机全液冷架构，全液冷纳入英伟达全球统一设计规范，高精度气密检测成为量产前置必备环节。\n- 维谛收购事件带动供电逻辑重估：维谛定位从“数据中心内部电力与散热设备商”延伸至“电网接入+现场发电+微电网架构”。\n- 博通业绩会披露大量增量信息：Q4 AI半导体收入指引217亿美元（同比+236%），AI收入FY27/28指引上调至1150亿/2300亿美元，但营业利润率指引66%略低于买方预期。\n- 戴尔业绩超预期：涨超15%，AI服务器业务爆单，存储芯片最紧缺；传统服务器收入增速高于AI服务器，需求结构从CSP扩展至新云与企业客户 应链限制为土地/电力/厂房、领先硅技术、基板、HBM。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：AI数据中心供电从设备向“从电源到芯片”升级\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：维谛（Vertiv）收购UIG，布局电网接入、现场发电、微电网架构，意在解决AI数据中心供电落地周期（Time to Power）难题，战略定位从设施侧电力+散热设备商向上游延伸。\u003c/li>\n\u003cli>今天出现的催化/验证：维谛业务版图变为“电网并网接入→现场发电→设施侧电力→机柜供电→散热→芯片”（source to chip）；AI电源升级的两场战役被认为是800V向板级下沉、三次电源由分立走向模块/VPD；中恒电气因产业地位升级、宁德时代战略入股被建议关注。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：PCB/CCL涨价叠加AI代际升级，上游材料溢价\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：铜箔和玻纤成本上涨推动覆铜板涨价，PTFE与mSAP被视为明年产业模式重点；代际升级带动PCB价值量持续提升。\u003c/li>\n\u003cli>今天出现的催化/验证：松下CCL最高涨30%、建滔FR-4统一涨10%、联茂法说会表示下半年逐季涨价且每季双位数涨幅；多家板厂加速mSAP布局，景旺已建成3条、年内计划增至5条，26Q2的800G光模块PCB收入环比增长1500%；NV Rubin Ultra 576 Oberon架构中compute tray层数增加显著、switch tray增加至18个。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：散热材料升级从幕后走向台前\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：算力全链功耗提升，热管理在华为“韬定律”逻辑堆叠论文中被明确为关键挑战；1.6T光模块功耗将超40W，普通散热凝胶难以导热。\u003c/li>\n\u003cli>今天出现的催化/验证：金刚石散热板块大涨，相关标的包括国机精工、沃尔德、四方达、惠丰钻石等；科创新源石墨烯+陶瓷基板，冷板业务Q3放量，7月单月交付量已超H1总量（字节等），9-10月CM订单有望批量落地；陶瓷产品已在北美头部Phononic实现突破，泰国工厂实现大规模量产供货。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：AI应用/软件进入业绩兑现验证期\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI产业风格切换观点指出软件应用进入收入与利润双兑现阶段；AI Infra层仍处高景气。\u003c/li>\n\u003cli>今天出现的催化/验证：Snowflake二季度营收15.5亿美元（分析师预期14.9亿美元），AI产品用户快速增长，盘后大涨超20%，全年产品营收指引60.7亿美元高于预期；Anthropic发布Fable 5.1，推升AA智能指数至66分，缓存读取降价75%；月之暗面（Kimi）已在本周以保密形式向港交所递交A1文件，正式启动港股IPO流程。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>液冷产能与订单信号强化：央视财经报道山东、广东等地液冷产线满产运行，CDU订单排至2026年底，部分交付展望到2027年。\u003c/li>\n\u003cli>英伟达Rubin全液冷范式确立：100%整机全液冷架构，全液冷纳入英伟达全球统一设计规范，高精度气密检测成为量产前置必备环节。\u003c/li>\n\u003cli>维谛收购事件带动供电逻辑重估：维谛定位从“数据中心内部电力与散热设备商”延伸至“电网接入+现场发电+微电网架构”。\u003c/li>\n\u003cli>博通业绩会披露大量增量信息：Q4 AI半导体收入指引217亿美元（同比+236%），AI收入FY27/28指引上调至1150亿/2300亿美元，但营业利润率指引66%略低于买方预期。\u003c/li>\n\u003cli>戴尔业绩超预期：涨超15%，AI服务器业务爆单，存储芯片最紧缺；传统服务器收入增速高于AI服务器，需求结构从CSP扩展至新云与企业客户。\u003c/li>\n\u003cli>覆铜板涨价密集落地：松下自9月1日起上调CCL价格，部分产品涨幅最高达30%；联茂明确下半年逐季涨价、每季双位数涨幅。\u003c/li>\n\u003cli>8月国内新能源车销量跟踪发布：已公布车企合计130.0万辆，同比+16%，环比+3%；比亚迪销量433384辆，同比+16.7%，环比+5.4%，主要系海外销量大幅增长、纯电车型出口放量。\u003c/li>\n\u003cli>8月ADP低于预期：3.8万人（预期4.8万人，前值4.4万人），宏观面偏弱但油价飙升势头因特朗普淡化伊朗冲突而缓和。\u003c/li>\n\u003cli>月之暗面IPO进程确认：已以保密形式向港交所递交A1文件。\u003c/li>\n\u003cli>马斯克对机器人给出激进预测：未来10年内全球人形机器人数量将超过10亿台，每台机器人产出至少为人类工。\u003c/li>\n\u003cli>关注池个股异动：联讯仪器大涨，反馈为业绩好、Q3好、明年更好，FT测试机进展顺利，CPO直接对接北美大客户；科翔股份被提示为Rubin散热刚需核心增量，拥有独家陶瓷混压PCB技术。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>液冷产业链订单兑现节奏：CDU排产至2026年底、部分交付到2027年的产能约束下，液冷服务器、检漏设备、快接头等环节的订单可见度是否继续上修；关注飞亚达等液冷低位标的产能规划动向。\u003c/li>\n\u003cli>Rubin量产对散热/检测设备需求的传导：全液冷由可选转为硬性标配后，关注气密检漏设备、冷却液、CDU、manifold等环节实际招标与放量数据；1.6T光模块生命周期预计为2026-2030年、2028年达到峰值，3.2T预计2027Q3批量供应。\u003c/li>\n\u003cli>CCL涨价持续性与AI材料预期差：跟踪松下、建滔、联茂涨价后的下游接受度与Q4报价；E-glass和AI电子布方面，市场普遍预期明年728均价15元/米，但当前涨价趋势下年底728价格将超15元，高点有望触及18-20元/米。\u003c/li>\n\u003cli>博通指引的后续验证：AI收入FY27/28指引1150亿/2300亿美元能否逐季兑现；Anthropic、OpenAI对两年增量的贡献节奏；SK海力士HBM4定价对Nvidia约每Gb 3.0-3.3美元、对其他Tier-1客户每Gb 3.7美元以上的价格传导。\u003c/li>\n\u003cli>存储紧缺逻辑延伸：戴尔业绩会中“存储芯片最紧缺”的表述，与HBM4、DRAM/NAND涨价预期之间的共振。\u003c/li>\n\u003cli>锂电与新能源销量验证：电池环节出现产成品累库现象，需至10月底或11月后悲观预期才可能扭转；9月行业电池排产预计300.6GWh（同比+83%，环比+7%），10月预计316.0GWh；比亚迪海狮08上市后月销能否达到1万辆。\u003c/li>\n\u003cli>光通信/CPO技术路线催化：PTFE混压方案在2027年前落地概率为90%，主要应用于switch交换板和正交背板；CPO光源测试持续推进，旭创参股中石科技表明光通信散热需求进入快速增长通道。\u003c/li>\n\u003cli>政策与宏观数据：财政部拟于9月9日第二次续发行2026年超长期特别国债（三期），50年期固定利率附息债，竞争性招标面值总额350亿元。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>07:20｜【美国铸币局正式推出印有特朗普头像的1美元硬币】财联社9月3日电，当地时间9月2日，美国铸币局正式推出印有特朗普头像的1美元硬币。（央视财经）(来自财联社APP)\u003c/li>\n\u003cli>07:21｜业绩发完后涨的，才是强势板块 Q1/Q2银行发业绩前都是涨的。不同的是，4月下旬发Q1业绩后银行指数就拐头向下\u003c/li>\n\u003cli>07:21｜【周四你需要知道的隔夜全球要闻：特朗普称随时准备再对伊朗进行打击；白宫称委内瑞拉产原油或将在11月注入美国战略石油储备】 1、美股三大指数集体收涨，道指涨0.56%，纳指涨0.45%，标普500指数涨0.46%。\u003c/li>\n\u003cli>07:22｜盘前热点事件一、昨日热点AI剧：欢瑞世纪 消费：国芳集团 军工：内蒙
