筹码被卖给了押注沃什乐观的人，下周回踩后又是一致捞的预期，那就形成震荡。 2. 板块方面，石油石化、农林牧渔和化工领涨，震荡市的平衡，前一天科技，后一天就另一边，这三个领涨也是这波反弹趋势就很好的非科技，农业是短线资金都关注，化工更机构些。周末有催化的地产应该很难认真对待吧。非银板块则有924记忆+防守配置需求。 3. 题材方面，周五早盘大光都动了，有点太乐观，被砸一下也正常，缩量震荡环境，还是围绕小市值新技术好些，ptfe暂时抗住分歧，还要经受下周考验，周五盘前催化的ocs啥的也冲高回落，液冷也正常回踩，费半鹰派发言后回调，周一白天看夜盘短线是否止跌，前低震荡对这些新技术就是回踩的机会。端侧主要是机器鸭催化。科技总结就是，海外围绕新增量，国产继续看总量加速和半导体扩产，此外美也不会眼睁睁看着我们追赶加速。（前面那条日期错了）#文字观点", "publish_time": "2026-08-31 07:30", "tags": ["文字观点"]}, "post:2026-08-31T09-24:ffef73b21540": {"id": "post:2026-08-31T09-24:ffef73b21540", "kind": "post", "title": "2026-08-31 09:24", "source_label": "帖子正文", "excerpt": "紫光股份：AI算力驱动Q2业绩持续高增，超节点有望成新增长极-2026半年报整理 事件： 公司发布半年报，2026H1，公司实现收入635.16亿元，同比增长33.93%；归母净利润21.67亿元，同比增长108.18%", "content": "紫光股份：AI算力驱动Q2业绩持续高增，超节点有望成新增长极-2026半年报整理 事件： 公司发布半年报，2026H1，公司实现收入635.16亿元，同比增长33.93%；归母净利润21.67亿元，同比增长108.18%；扣非净利润18.74亿元，同比增长67.59%。 整理： #Q2业绩维持在快车道上运行。从Q2单季来看，公司实现营收355.31亿元，同比增长33.4%，环比增长26.96%，Q2营收同比增速与Q1的34.61%基本持平；归母净利润13.79亿元，同比增长99.18%；扣非净利润12.53亿元，同比增长76.81%。其中：归母利润增速高于扣非，主要源于公司将新华三剩余19%股权的期权远期安排作为金融负债，Q2带来非经常性收益1.11亿元，而25Q2为-0.70亿元；扣非利润显著高于收入增速，部分源于人民币汇率升值带来财务费用同比减少3.8亿元。 #AI算力高景气带来ICT高增长。2026H1，公司核心子公司新华三实现营收499.75亿元，同比增长37.28%，营收占比为78.68%；归母净利润23.88亿元，同比增长29.03%，按照87.98%股权比例计算，利润占比为96.96%。分业务板块来看，公司ICT基础设施业务、IT分销业务同比增速分别为41.3%、4.17%。其中ICT基础设施业务实现营收509.27亿元，毛利率同比下降2.77%至15.28%，主要是因为AI基建驱动公司服务器收入占比快速提升，而服务器的毛利率相对较低所致。 #超节点有望成为新的增长极。公司在超节点领域具有独特卡位优势，包括兼具网络交换机、服务器、存储的产品和技术领先优势，以及上游供应链和CSP大厂的客群优势。今年上半年，公司发布UniPoD S80000系列超节点产品，覆盖32卡至1024卡全品类，最大可扩展至16384卡，兼容多厂商CPU、GPU、NPU、DPU等异构算力，支持万亿参数大模型训练与推理需求。目前超节点订单快速放量，有望带来公司新的增长极。#文字观点", "publish_time": "2026-08-31 09:24", "tags": ["文字观点"]}, "post:2026-08-31T12-28:5d6fcf578d01": {"id": "post:2026-08-31T12-28:5d6fcf578d01", "kind": "post", "title": "2026-08-31 12:28", "source_label": "帖子正文", "excerpt": "【国金计算机&科技】德才股份：火山引擎信控额度升至5000万元/月，深度入驻万有计划 #火山引擎信控额度自2000万元提升至5000万元、Agent/AI漫剧业务资源保障增强 ——7月28日，公司、奇想无限与火山引擎签署补充协议，将奇想无限在火山引擎的信控额度由2,000万元提升至5,000万元，账", "content": "【国金计算机&科技】德才股份：火山引擎信控额度升至5000万元/月，深度入驻万有计划 #火山引擎信控额度自2000万元提升至5000万元、Agent/AI漫剧业务资源保障增强 ——7月28日，公司、奇想无限与火山引擎签署补充协议，将奇想无限在火山引擎的信控额度由2,000万元提升至5,000万元，账期仍为30。若额度按月持续滚动使用，#对应年化模型服务采购规模理论上可接近6亿元，为Agent业务快速放量提供更充足的模型及算力资源保障。 #深度加入火山引擎“万有计划”、产品及商业化优势进一步强化 ——奇想无限正式深度加入火山引擎“万有计划”，成为首批原生接入Seedance 2.0满血版模型的服务商，获得#专属算力调度、技术迭代优先内测及全域流量倾斜等资源支持。公司自研AI漫剧Agent深度融合火山引擎Seedance 2.0多模态视频模型、豆包企业大模型，已实现从剧本拆解、智能分镜、人物生成到动态渲染、自动配音的全流程自动化，具备#专属定制Token资源包、专属GPU算力池免排队调用、专属内容素材库等模型专属权限。 #Agent、AI漫剧、AI硬件三条业务线均在加快兑现 ——Agent方面，奇想无限近期将上线火山专属版Agent；同时，公司作为Seedance 2.5首批合作方，模型正式发布后将第一时间完成联调上线，应用场景进一步拓展至互动影游、广告、电商、文旅及教育等领域。 ——AI漫剧方面，奇想无限在仿真剧上、精品剧上已经有数部上线，例如《重生 1970，从狩猎赶山开始》《镇守百万年，我的绝品徒弟是大帝》等，其中《重生 1970，从狩猎赶山开始》在红果漫剧APP的6月AI剧新剧榜排名第二；此外，预计在3D剧上也有更多的爆款推出，并联合红果、tiktok 等海外平台，加速内容出海。 ——AI硬件方面，26H1公司新业务新签合同约9.74亿元，26Q2环比增长约85%，随着订单交付及产能爬坡，新业务收入有望逐步释放。 #我们认为市场严重低估德才的AI景气度_公司产品力、大厂关系、业务景气度被低估 ——从两次深度亮相火山引擎大会，到火山引擎信控额度由2,000万元快速提升至5,000万元，到加入“万有计划”并获得模型、算力及流量支持，再到Seedance 2.5首批适配及新业务订单持续增长，奇想无限与火山引擎的合作已经由单一模型调用升级为产品、算力、内容及商业化的全链路协同。 ——公司Agent、AI漫剧与AI硬件业务均已进入订单及商业化兑现阶段，我们认为当前市场对公司AI业务规模及成长斜率仍存在明显低估。 风险提示：AI业务拓展不及预期、对外担保风险、成本上涨风险。 ☎联系人：陈芷婧/鲍淑娴/刘高畅#文字观点", "publish_time": "2026-08-31 12:28", "tags": ["文字观点"]}, "attachment:files/通信周度沙龙纪要20260830.pdf": {"id": "attachment:files/通信周度沙龙纪要20260830.pdf", "kind": "attachment", "title": "通信周度沙龙纪要20260830", "source_label": "其他", "excerpt": "通信周度沙龙纪要（ 2026-08-30 ） 要点总结 1.光模块技术迭代方向明确 ：1.6TDR8已量产， 6.4TNPO和12.8T CPO可插拔光模块已具备。未来 竞争壁垒将转向 2.4T、3.2T/6.4T NPO及12.8T 以上CPO，1.6T不再是核心跟踪指标。", "content": "通信周度沙龙纪要（ 2026-08-30 ） 要点总结 1.光模块技术迭代方向明确 ：1.6TDR8已量产， 6.4TNPO和12.8T CPO可插拔光模块已具备。未来 竞争壁垒将转向 2.4T、3.2T/6.4T NPO及12.8T 以上CPO，1.6T不再是核心跟踪指标。 2.新易盛发布基于硅光技术的 OCS交换机 ：从可插拔到 LPO、CPO、NPO、CPO、OCS产品矩阵已 搭建完成，在薄膜铌酸锂等新技术上均有成套解决方案，龙头地位稳固。 3.光模块板块被严重低估，看好三四季度反攻 ：当前市场噪音主要来自竞争格局和板块担忧，类似去 年一季度状况。选股建议关注能做 NPO、CPO和OCS的龙头。 4.长鑫存储中报业绩炸裂 ：上半年营收 1031亿元，同比增长 873.64% ；归母净利润 776.05 亿元，上 年同期亏损 23.32 亿元。按 181个自然日计算，每天净赚 4.29亿元，扣非高于归母，利润几乎全部来 自主营业务，远超此前预告上限。 5.长鑫DDR6 内存正式量产 ：8月29日官宣全球 DDR6 产品首次落地商用，打破三星、海力士等海 外厂商长期垄断。小米玄界 03芯片将首发搭载，雷军已官宣支持。 6.英伟达对下游大客户涨价 15%：本周 、键合工艺认证、客户设计评审以及实际量产订单落地。 💰只有走完上述流程，Memory‑on‑Logic 才会从技术备选方案转化为真正影响经营业绩的变量。 🔄下一轮内存行业竞争的核心，正在从 DRAM 比特产量，转向处理器与内存之间的深度整合。 🛡️在通用内存市场，需要依靠成本、良率抵御来自中国的产能冲击。 💎在高附加值赛道，则要从单台加速器设备攫取更高利润，管控良率风险，提高客户更换供应商的门槛。 🏆最终，生产比特数量最多的公司，将会输给可以深度嵌入整套计算架构的公司。#文字观点", "publish_time": "2026-08-31 08:10", "tags": ["文字观点"]}, "post:2026-08-31T18-13:9bf7bf06fe63": {"id": "post:2026-08-31T18-13:9bf7bf06fe63", "kind": "post", "title": "2026-08-31 18:13", "source_label": "帖子正文", "excerpt": "现货价格是长期协议的 5 倍……“三星电子第三季度营业利润首次突破 100 万亿韩元” 搭载于人工智能（AI）加速器的高带宽内存（HBM）和 DRAM 价格持续飙升，这一现象表明，即便是占据全球内存半导体市场约 70% 份额的三星电子和 SK 海力士，也难以应对激增的市场需求。31 日，据韩国贸易协", "content": "现货价格是长期协议的 5 倍……“三星电子第三季度营业利润首次突破 100 万亿韩元” 搭载于人工智能（AI）加速器的高带宽内存（HBM）和 DRAM 价格持续飙升，这一现象表明，即便是占据全球内存半导体市场约 70% 份额的三星电子和 SK 海力士，也难以应对激增的市场需求。 31 日，据韩国贸易协会数据显示，用于制造 HBM 和低功耗双倍数据速率（LPDDR）等 AI 芯片的 DRAM 出口量从 5 月的约 6.817 亿个降至 7 月的 5.9174 亿个，减少了 13.2%。 然而，同期 DRAM 出口总额却从 114.2837 亿美元增至 135.5155 亿美元，增长了 18.5%，出口单价也从 16.76 美元飙升至 22.9 美元，涨幅达 36.6%。 随着向英伟达等大型科技客户扩大供应 HBM4，DRAM 需求被大量吸纳，进而推动价格上涨。 此外，处于量产初期的 HBM4 良率低于前代产品 HBM3E，导致生产过程中消耗的 DRAM 增加，使得整体 DRAM 供应短缺局面进一步加剧。 韩国半导体产业协会专务安基贤表示：“HBM 越是升级至最新版本，其良率越容易下降。” 他解释道，“HBM4 的价格约为前代产品的两倍，内存公司在扩大生产过程中投入的 DRAM 数量也随之增加，最终导致整体出口量减少。” 尤其是三星电子（005930）和 SK 海力士（006660）将销售结构转向以长期供应合同（LTA）为主，也加剧了现货市场的供应紧张。 据业界消息，三星电子存储事业部已将截至 2031 年的产能中约 70% 分配给 LTA 订单，主要签约对象包括英伟达、微软（MS）和谷歌等全球大型科技公司。 然而，即便是这些大型科技公司，也因 HBM 争夺战异常激烈而无法获得全部合约供应量，导致现货价格进一步飙升。 据内存市场研究机构 MegaGridSupply 数据显示，HBM3E 36GB（吉字节）产品的价格为 2100 美元（约合 287 万韩元）。 这一现货价格比长期供应协议（LTA）价格（约为 50 万至 70 万韩元）高出 4 至 5 倍。 目前正处于量产协调阶段的 HBM4 16 层产品，若通过现货而非长期协议采购，其价格已定为 3500 美元（约合 480 万韩元）。 三星电子和 SK 海力士认为内存供应短缺难以在短期内缓解，因此正多管齐下推进产能扩张。 三星电子半导体（DS）部门管理层正在考虑，最早从明年起将平泽园区内唯一的晶圆代工（半导体委托生产）生产线 S5 转为内存生产设备。 特别是 SK 海力士，据悉在扩大仁和和湖南地区生产基地之后，甚至正在探讨与日本公司合资建厂的可能性。 业界关注到，作为日本 NAND 闪存龙头公司铠侠（Kioxia）的实际最大股东，SK 海力士有可能通过深化与其合作，进一步扩大在全球内存供应链中的影响力。 受内存短缺加剧推动的价格上涨趋势，预计将带动三星电子和 SK 海力士的业绩持续攀升。 金融投资界普遍认为，两家公司将在第三季度再次刷新历史最高业绩纪录。 以最近一个月为基准，三星电子第三季度业绩共识预计为，销售额 206.6376 万亿韩元、营业利润 116.3790 万亿韩元，将大幅超越第二季度（销售额 171.4995 万亿韩元、营业利润 89.4924 万亿韩元）。 尤其是营业利润突破 100 万亿韩元，不仅是韩国公司史上的首次里程碑，在全球大型科技公司中也属首例。 SK 海力士同样预计，第三季度营收将环比增长 28.2%，达到 101.7573 万亿韩元，营业利润将跃升 30.7%，至 79.1565 万亿韩元。 安基贤表示：“要解决半导体供应短缺问题，必须建设更多生产工厂。” 并指出，即便规划中的新工厂投产，也仅能缓解而非彻底消除供不应求的局面。#文字观点", "publish_time": "2026-08-31 18:13", "tags": ["文字观点"]}, "post:2026-08-31T17-38:8097a063cb55": {"id": "post:2026-08-31T17-38:8097a063cb55", "kind": "post", "title": "2026-08-31 17:38", "source_label": "帖子正文", "excerpt": "【tfjx】联讯仪器中报解读：Q2业绩爆发式增长，光通信新产品及存储检测设备循序渐进公司公布中报，实现营收15.31亿元，同比增长208.71%；归母净利润5.67亿元，同比增长903.00%。", "content": "【tfjx】联讯仪器中报解读：Q2业绩爆发式增长，光通信新产品及存储检测设备循序渐进公司公布中报，实现营收15.31亿元，同比增长208.71%；归母净利润5.67亿元，同比增长903.00%。 上半年毛利率/净利率分别为70.79%/37.02%，同比+8.98/+25.62pct。销售/管理/研发/财务费用率分别为2.97%/6.81%/16.32%/1.19%，同比-4.80/-6.56/-11.16/+1.47pct。单季度看，Q2实现收入10.43亿元，同比+253.84%，环比+113.94%；实现归母净利润4.48亿元，同比+1104.43%，环比+276.97%。实现毛利率/净利率分别为72.68%/42.95%，同比+13.27/+30.31pct，环比+5.92/+18.60pct。Q2存货11.51e，环比+53%；Q2合同负债6.49e，环比+209%。主要产品方面，以示波器为主的光通信测试设备逐步放量。通信测试仪器方面，面向1.6T高速光模块测试需求的采样示波器、时钟恢复单元、误码分析仪、1.6Tbps光模块测试仪等核心产品向多家国内外知名用户量产供货，公司市场份额持续扩大；面向高速DAC铜缆测试需求的高速线缆测试仪批量交付。光电子器件测试设备方面，CoC光芯片老化测试系统、硅光晶圆测试系统等产品向国际头部用户的出货规模持续增长。面向CPO/NPO OE芯片裸Die级分选测试需求的OE芯片KGD分选测试系统产品已通过行业一流用户的验证并实现收入。新产品持续拓展。采样示波器方面，2.4T/3.2T采样示波器自研采样保持芯片已成功流片，预计2026年下半年向行业头部用户送样验证。CPO检测方面覆盖CPO全环节测试需求。CPO/NPO的KGD分选测试系统产品，进一步开展与国内外知名CPO厂商的对接合作。同时，公司拟启动高速光电混合测试ATE项目，已初步完成技术预研，将电学测试与光学测试集成到统一的自动化测试平台中，满足CPO全环节光电混合量产测试需求。外延存储芯片检测验证取得突破。加速推进存储芯片测试设备的战略布局。高速存储芯片测试系统方面，公司自研ASIC芯片、PE芯片流片成功，已通过国内头部DRAM厂商的ETS工程验证，正在进行整机验证；HBM芯片KGD分选测试系统在客户处的送样验证工作有序推进中；中速存储芯片测试系统的研发项目已启动。#文字观点", "publish_time": "2026-08-31 17:38", "tags": ["文字观点"]}, "attachment:files/新能源每周金选20260830电话会纪要.pdf": {"id": "attachment:files/新能源每周金选20260830电话会纪要.pdf", "kind": "attachment", "title": "新能源每周金选20260830电话会纪要", "source_label": "其他", "excerpt": "新能源每周金选（ 2026-08-30 ）电话会纪要 要点总结 1.液冷板块：半年报积极信号叠加三季度业绩预期，板块行情启动 核心液冷标的（英维克、飞龙股份）在半年报中首次详细披露液冷业务进展，收入高增、客户结构清 晰。市场预期三季度业绩将明显体现，带动上周板块异动。", "content": "新能源每周金选（ 2026-08-30 ）电话会纪要 要点总结 1.液冷板块：半年报积极信号叠加三季度业绩预期， 果就是尝试重塑美联储信誉，明确但克制的鹰派，好于模糊的鸽派。 ——聚焦—— 【棕榈油：突破万元大关后，还能走多远？】 中长期DCE棕榈油价格或站稳10500元/吨，且上方或仍有空间，远月合约或持续升水。 ——行业—— 【现房销售政策落地，将会产生哪些影响？】 《通知》是对我国住房销售制度的一次深刻改革。我们认为本次住房制度改革或有助于加速住房供需格局改善。 【房地产融资进入新时代——房地产信贷管理新规点评】 房地产融资进入新时代。我们认为，本次房地产贷款新规的核心并非简单放松房地产信贷，而是逐步转向以项目为核心、资金封闭运行、贷款期限与建设周期更加匹配的新模式。#文字观点", "publish_time": "2026-08-31 09:00", "tags": ["文字观点"]}, "attachment:files/沃什定调，大宗如何演绎——五线四板块精品会议纪要20260830.pdf": {"id": "attachment:files/沃什定调，大宗如何演绎——五线四板块精品会议纪要20260830.pdf", "kind": "attachment", "title": "沃什定调，大宗如何演绎——五线四板块精品会议纪要20260830", "source_label": "其他", "excerpt": "沃什定调，大宗如何演绎 ——五线四板块精品会议纪 要 20260830 要点总结 1.宏观主线：美联储鹰派预期升温，国内地产新政落地 。7月PCE 印证通胀黏性，叠加沃什 （Warsh ）在杰克逊霍尔全球央行年会上偏鹰讲话， 9月加息预期回升至接近六成， 12月前加息概率 超90% ", "content": "沃什定调，大宗如何演绎 ——五线四板块精品会议纪 要 20260830 要点总结 1.宏观主线：美联储鹰派预期升温，国内地产新政落地 。7月PCE 印证通胀黏性，叠加沃什 （Warsh ）在杰克逊霍尔全球央行年会上偏鹰讲话， 9月加息预期回升至接近六成， 12月前加息概率 超90% ；国内五部门同步落地地产核心制度文件，终结高杠杆快周转旧模式，正式构建房地产发展新 模式。 2.美联储内部分歧加剧， 9月FOMC 成为关键验证窗口 。7月议息会议上三位新上任地区联储主席投 下反对票主张加息 25bp ，核心理事会以偏中性态度为主； 8月非农和 CPI 数据将直接决定中性派投票 方向，下周四沃勒讲话作为静默期前最后一次委员表态尤为关键。 3.地产新政短期施压投资，中长期利好行业出清与格局改善 。新政全面收紧预售条件（主体结构封 顶）、强化预售资金监管、延长住房贷款期限至 40年并延后放款时点至竣工后，短期房企现金流压力 加大、压制新开工弹性，但中长期有助于库存去化、供需格局改善及房价预期企稳。 4.大类资产配置：股指逢低做多，贵金属短期承压、中长期偏强 。维持中证 500 一般关注并新增沪 深 300 一般关注；黄金短期下调至观察，中长期主权信用风险上升、去美元化深化构成结构性支撑；商品 方面维持铜核心关注，新增橡胶一般关注。 5.能源板块：原油高位区间震荡，碳酸锂区间操作，多晶硅择机沽空 。中东局势持续对峙，高盛上修 波斯湾石油出口恢复至战前 2/3（1500-1600 万桶 /日）， SC明显强于外盘；碳酸锂强现实弱预期， 8- 9月延续大幅去库，预计 14-17 万区间震荡；多晶硅供需偏宽松， 11-12 反套和 12-04 正套继续关 注。 6.化工板块：液体化工品库存矛盾激烈，关注套利策略 。中东货源影响下液体化工品进口将大幅减 少，乙二醇 1001 正套、多瓶片空 PTA 、多塑料 PP空PVC 、橡胶 RU2701 及15正套均可参与；天然 橡胶长期看好，产能缺口打开、基本面健康。 7.有色板块：铜锡逢低做多，锌短期观望 。铜基本面强劲，伦敦逼仓叠加国内低库存，宏观冲击带来 回调上车机会；锡受印尼出口恢复短期偏弱，但云锡 9月检修预期及低库存支撑偏多格局；锌处于外盘 逼仓行情，国内弱基本面下追涨性价比不高。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 8.黑色板块：焦煤紧缺为核心矛盾，焦炭多头 +铁矿左侧空头 。焦煤供应缺口向下游焦炭扩散，焦化厂 扩大限产，第三轮提涨预计下周落地；铁矿在产业链中被空配角色明确，高库存 +供应过剩格局未变， 可左侧布局空单。 9.农产品板块：继续看好油脂和粕类，逢低做多 。美豆突破 1250 看向 1300 ，中国持续采购 +俄乌战 争扩散风险支撑；印尼机构预估 2027 年棕榈油产量同比减少 400-500 万吨，点燃做多热情；菜油相 对偏弱，缺少题材驱动。 问答整理 Q1：关于原油，高盛上修波斯湾出口数据后，后续油价的核心驱动 确偏成长、不偏顺周期。 上证低开后一路上行、收在当日最高 3,986 点（涨 0.9%），九大宽基全部收在当日高点附近、科创50 涨 1.3% 领涨，两市成交 2.13 万亿元、较上日增约 293 亿元；资金从有色、白银（跌停）、黄金板块（跌 3.2%）、农业、光伏撤出，涌入传媒（中文在线、芒果超媒 20% 涨停）、增材制造（华曙高科涨 14.7%、铂力特涨 14.2%）和半导体，港股壁仞科技涨 18.8%、MINIMAX 涨 16.2%、云知声涨 17.7%、智谱涨 9.6%。这背后是上周五沃什鹰派讲话触发美元贬值交易的平仓，官方 8 月制造业 PMI 超预期回到 49.8 为宏观背书。另有两条同日的线：金价较上周五跌约 3.5%、美元走强；油价因美军袭击伊朗在霍尔木兹海峡准备布雷的火箭发射装置而跳涨逾 3%，布伦特上破 90 美元。 今天的主题混乱。周末的峰会增加了加息的概率，而黄金白银每一次的暴跌都有沃什的影子。但两地股市午后V型反转，大约受到了韩国股市半导体反转的引领，和PMI新订单的重新扩张，以及今晚的AIGC长剧上线。这种日间盘的波动，在统计意义上并不罕见，而每日的波动都带有情绪的成分，不必过分解读。我们在上周五峰会之前就提示了黄金（矿股）的风险，而这些股票和今天A股跌停的矿业公司都是高度相关的。我们认为黄金白银大宗商品的长期逻辑并没有发生任何改变，而最近大宗轮动的周期开始进入了农产品领域。年初以来，各个农产品的涨幅远高于标普。而最近看了一些研究员的研究报告，发现我去年以来一直在推演的周期轮动的顺序——从黄金白银到有色工业，再到能源，最后到农产品——开始被其他研究员传颂。这是市场开始普遍接受我的非共识观点的迹象。 但这个周期轮动的顺序，您是在我这里首先听到的。而过去的一年多里，我也与您反复强调。 A股与港股复盘 2026年8月31日 研究笔记 · 不构成投资建议 第 2 / 14 页 本日报要 主线段： 上周五（8 月 28 日）Jackson Hole，美联储主席沃什用一次比 7 月议息会后清晰得多的表态警告：通胀若不尽快回落，联储会加息。CME 工具显示 9 月加息 25 个基点的概率当日从约 35% 升到约 58%，美元指数走强，所以 8 月靠\"美元贬值、实物避险\"逻辑月涨约 14%（本世纪最强月）的黄金上周五单日大跌逾 3%，A 股 8 月同样靠避险和高股息领跑的品种，周一集中了结。盘面对得上：白银有色跌停、黄金板块跌 3.2%、贵金属跌 3.7%、粮食种植跌 3.0%、逆变器跌 3.7%，8 月 28 日刚被资金抢进的农业、地产交易链同步回吐。撤出来的钱去了成长：传媒板块涨 4.5%、主力净流入约 59 亿元（数字媒体分项净流入约 26 亿元），增材制造、红外、电源管理芯片领涨，港股的壁仞科技（AI 芯片）、云知声、MINIMAX、智谱（大模型新股）涨 9.6%—18.8%。当日 09:30 发布的 8 月官方制造业 PMI 回升 0.6 个百分点至 49.8、略超 49.7 的预期，新订单 50.6（升 2.1 个百分点）、原材料购进价格 56.6（升 3.4 个百分点），生产端和价格端同时走强，这是 A 股上午先跌、午后一路走高的宏观理由。但收盘结构说明买盘是奔着成长去的：跌超 1% 的创业板指午盘还领跌、逾 3,000 只个股翻绿，收盘却是 3,021 只上涨、科创50 涨 1.3% 领跑，权重蓝筹只小幅跟涨。 A股： 上证收 3,986 点涨 0.9%，深证成指收 14,015 点涨 0.4%，沪深300 收 4,625 点涨 0.3%，创业板指收 3,439 点涨 0.4%，科创50 收 1,684 点涨 1.3%。沪市成交 10,142.9 亿元、深市 11,167.4 亿元，两市合计 21,310.3 亿元，较上日 21,017.2 亿元增 293.1 亿元。涨跌家数（两市，交易所口径）3,021:2,116:147，计入北交所为 3,202:2,263:158；涨停家数 88 家、跌停 11 家，盘中炸板 43 家，最高连板为海鸥住工（6 板，家居用品）。 港股： 恒生指数收 25,567 点跌 0.1%，国企指数收 8,513 点涨 0.3%，恒生科技收 4,620 点涨 0.3%。恒指成分成交约 3,148.2 亿港元（腾讯行情口径），较上日约 2,312.1 亿港元放大约 36%；国企成交约 971.0 亿港元、恒生科技约 810.2 亿港元，同步显著放量。 货币与汇率： 央行开展 50 亿元 7 天期逆回购（固定利率、数量招标，中标利率 1.40%），另开展 4,470 亿元隔夜逆回购；上周五投放的 3,330 亿元隔夜逆回购今日到期，隔夜工具连续第三个交易日以数千亿规模对冲跨月，考虑到期后当日公开市场大致平衡、略偏投放。无 MLF、降准或政策利率调整。人民币中间价报 6.7828，较上一日调贬 17 个基点；在岸约 6.719、离岸约 6.720，中间价比市场价弱约 640 个基点；美元指数约 99.5。 互联互通： 南向今日净买 21.4 亿元（成交 1,066.9 亿元，买入 544.2 亿元、卖出 522.8 亿元），上周五净买 11.8 亿元、成交 882.9 亿元，方向不变、力度略增（见第 2 节）；北向成交 3,259.6 亿元，上周五 2,781.2 亿元，放大约 17%，净额未公布。 A股与港股复盘 2026年8月31日 研究笔记 · 不构成投资建议 第 3 / 14 页 大波动： 内地——中文在线（300364）涨 20.0%、芒果超媒（300413）涨 20.0%、力芯微（688601）涨 18.2%、华策影视（300133）涨 15.8%、华曙高科（688433）涨 14.7%、睿创微纳（688002）涨 14.4%、铂力特（688333）涨 14.2%；键凯科技（688356）跌 16.4%、万邦医药（301520）跌 13.8%、誉衡药业（002437）跌 10.1%、白银有色（601212）跌 10.0%、联创光电（600363）跌 10.0%。港股——壁仞科技（06082）涨 18.8%、云知声（09678）涨 17.7%、MINIMAX-W（00100）涨 16.2%、智谱（02513）涨 9.6%；绿城中国（03900）跌 17.6%、建发国际集团（01908）跌 16.4%。 技术： 上证收在 20 日（3,925）与 50 日（3,938）均线上方、布林上轨（4,007）之下，但仍压在粘合于 4,012—4,014 的 100 日与 200 日均线下方，这是这轮反弹要过的第一道压力，今天的高点 3,986 已经顶到线下；恒指收于 20 日均线与布林中轨（均约 25,600）附近，站在 50 日（24,847）与 100 日（25,237）均线上方，仍差 200 日均线（25,684）一步。日线图见第 1、2 节。 驱动： 上周五 Jackson Hole 沃什讲话触发避险、贬值交易平仓（见第 4 节）；8 月官方制造业 PMI 09:30 超预期回升（见第 4 节）；首部 AIGC 长剧《后西游记》定于今晚 20:00 湖南卫视黄金档首播，这直接催化了传媒板块（见第 1、3 节）；美军袭击伊朗在霍尔木兹海峡准备布雷的火箭发射装置，油价跳涨（见第 4 节）。沪深 15:00 收市，PMI 是盘前发布，A 股全天有时间消化；港股下午盘走完。 外盘 / 商品 / 国债： 标普500 期货约 7,712 点、纳斯达克100 期货约 29,480 点、道指期货约 53,520 点（约 18:50 HKT / 05:50 ET，时点很早、盘前极薄，基本贴上周五收盘）。上周五美股现货收跌、费城半导体指数领跌，沃什讲话后成长与半导体承压（详见第 4 节）。WTI 原油约 86.1 美元、布伦特约 91.0 美元，较上周五各涨约 3.3%—3.7%；COMEX 黄金约 4,492 美元、COMEX 白银约 67.8 美元，较上周五明显回落；COMEX 铜约 6.67 美元、基本走平。美债 2 年 4.33%、10 年 4.71%、30 年 5.21%，仍带着上周五 Jackson Hole 之后计入九月加息的溢价（2 年约 10 个基点）；中国 10 年 1.69%，美中 10 年利差约 302 个基点。 A股与港股复盘 2026年8月31日 研究笔记 · 不构成投资建议 第 4 / 14 页 1. A股 指数 收盘 开 高 低 当日 成交额 上证指数 3,986 3,927 3,986 3,927 +0.9% 10,142.9亿 深证成指 14,015 13,764 14,015 13,741 +0.4% 11,167.4亿 沪深300 4,625 4,562 4,625 4,557 +0.3% 5,834.3亿 创业板指 3,439 3,367 3,439 3,359 +0.4% 5,282.4亿 科创50 1,684 1,623 1,684 1,620 +1.3% 907.6亿 中证500 7,952 7,797 7,954 7,765 +0.7% 3,913.5亿 中证1000 7,770 7,607 7,772 7,605 +0.9% 4,609.4亿 上证50 2,937 2,897 2,937 2,896 +0.5% 1,654.6亿 北证50 1,065 1,058 1,066 1,052 +0.1% 147.9亿 A股与港股复盘 2026年8月31日 研究笔记 6-08-31 07:59", "source_label": "帖子正文", "excerpt": "【东吴电新】比亚迪26年中报点评：Q2业绩符合预期，出口高增支撑盈利改善 # Q2业绩符合市场预期、盈利环比明显修复。公司26H1营收3448亿元，同比-7%，归母净利123.3亿元，同比-21%，扣非净利123.7亿元，同比-9%，毛利率18.8%，同比+0.8pct", "content": "【东吴电新】比亚迪26年中报点评：Q2业绩符合预期，出口高增支撑盈利改善 # Q2业绩符合市场预期、盈利环比明显修复。公司26H1营收3448亿元，同比-7%，归母净利123.3亿元，同比-21%，扣非净利123.7亿元，同比-9%，毛利率18.8%，同比+0.8pct；其中26Q2营收1946亿元，同环比-3%/+30%，归母净利82.4亿元，同环比+30%/+102%，扣非净利82.3亿元，同环比+52%/+98%，毛利率18.9%，同环比+2.6/+0.1pct。 # Q2出口高增、销量环比修复、单车盈利改善。26H1新能源汽车销售181万辆，同比-16%，其中出口79.2万辆，同比+68%、占比44%；Q2销售110.8万辆，同环比-3%/+58%，其中出口约47万辆，同环比+86%/+48%，本土约64万辆，同环比-29%/+67%。盈利端，我们测算Q2单车价格15.4万元，同环比-1%/-15%，汽车业务毛利率23.0%，同环比+4.3/-0.4pct，单车毛利3.1万元，同环比+22%/-16%，主要受益于出口占比提升；单车利润预计0.72万元，同环比+47%/+24%，销量回升带动费用摊薄。碳酸锂成本压力高点主要集中在Q2，后续有望缓解，叠加海外及高端占比提升，单车盈利有望继续改善。技术端，公司持续推进二代刀片+闪充及智能化布局，6月底已建成7018座闪充站，首款4nm自研智驾芯片璇玑A3已实现量产。 我们预计26年销量500万辆+，其中海外180-190万辆、本土约315万辆，二代刀片切换有望推动下半年本土销量回升。 # 动力外供环比高增、储能维持较高出货。我们预计26H1公司电池生产160GWh左右，同比基本持平，其中储能近40GWh，同比增40%+。动力端，公司1H外收售17GWh，同比基本持平，其中小米占比约30%，外供客户持续拓展。储能新一代BYD Haohan已启动批量交付。我们预计26年公司电池装机350-380GWh，其储能80GWh+，同比增60%。 # 比亚迪电子Q2盈利环比有所改善。 Q2比亚迪电子收入441亿元，同环比+1%/+15%，毛利率4.6%，同环比-2.7/-0.6pct，净利润4.0亿元，同比-64%、环比明显改善；智能手机需求偏弱及部分零部件规格变化影响盈利，AI服务器已实现批量出货、液冷冷板进入量产爬坡。 # Q2费用率下降、大额汇兑及减值影响利润。Q2期间费用269亿元，同比+6%，费用率13.8%，同比+1.0pct、环比-2.4pct，其中财务费用30亿元；Q2汇兑损失约28亿元，资产及信用减值合计约16亿元，对利润有所影响。H1经营性现金流373亿元，同比+17%，其中Q2约345亿元；资本开支447亿元，期末存货1900亿元、较年初+37%，合同负债798亿元、较年初+55%。 # 盈利预测与投资评级：预计公司26-28年归母净利404/506/637亿元，同比+24%/+25%/+26%，对应PE 21/17/13x，维持“买入”评级。 #风险提示：需求不及预期，行业竞争加剧。#文字观点", "publish_time": "2026-08-31 07:59", "tags": ["文字观点"]}, "post:2026-08-31T18-13:55b6f81b9c16": {"id": "post:2026-08-31T18-13:55b6f81b9c16", "kind": "post", "title": "2026-08-31 18:13", "source_label": "帖子正文", "excerpt": "【东吴电新】锂电延续高景气，利润向中上游倾斜—电动车26H1财报总结 #26H1锂电高景气、利润向中上游倾斜。26H1全球动储电池产量1342GWh，同比+47%，其中动力849GWh，同比+25%，储能493GWh，同比+113%。", "content": "【东吴电新】锂电延续高景气，利润向中上游倾斜—电动车26H1财报总结 #26H1锂电高景气、利润向中上游倾斜。26H1全球动储电池产量1342GWh，同比+47%，其中动力849GWh，同比+25%，储能493GWh，同比+113%。新能源汽车板块营收20945亿元，同比+20%，归母净利润1228亿元，同比+45%；26Q2营收11471亿元，同环比+22%/+21%，归母净利润638亿元，同环比+44%/+8%。26H1上游资源、中游材料、电池、整车利润占比分别19%、23%、39%、12%，整车同比-23pct。 #26Q2上中游盈利弹性延续、环节分化显著。26Q2归母净利润环比增速排序为添加剂262%＞三元正极68%＞铝箔49%＞碳酸锂29%＞隔膜25%＞负极22%=汽车核心零部件22%＞电池17%＞锂电设备14%＞锂电池中游7%＞正极4%＞铜箔-8%＞铁锂正极-9%＞结构件-20%＞整车-23%＞六氟磷酸锂及电解液-26%＞三元前驱体-37%。整体看，盈利弹性向资源品及部分材料环节集中，产业链利润修复显著分化。 #26H1盈利修复、中游资本开支高增。26H1归母净利率6%，同比+1pct；26Q2为6%，同环比+1/-1pct。26H1资本开支1682亿元，同比-12%，剔除比亚迪后+12.6%，中游材料重启扩产；26Q2资本开支872亿元，同环比-9%/+8%。H1末存货8507亿元，较年初+30%，铁锂正极/三元正极/电池/整车分别+118%/+71%/+40%/+26%。 #26H2旺季、产业链涨价可期。预计26年全球动储需求2844GWh，同比+37%，27预计25%左右增长。碳酸锂26-27年供给紧平衡，价格预计价格12-15万/吨；电池龙头盈利预计稳定；隔膜Q3涨价有望落地，头部单平利润有望升至0.2元/平+；铝箔Q2大客户涨价1k落地，龙头盈利有望升至0.3万/吨；铜箔Q3涨价有望落地，27年龙头盈利有望恢复至0.6-0.8万/吨；负极头部已顺价1k/吨，其余厂商有望跟进。 #投资建议：龙头公司对应27年估值10-15x，低估明显，继续强推格局和盈利稳定龙头电池（推荐宁德时代、亿纬锂能、蔚蓝锂芯、鹏辉能源、比亚迪、中创新航、欣旺达）、以及具备涨价弹性和优质锂电材料龙头，推荐隔膜、铝箔、铜箔、六氟、结构件等环节（推荐璞泰来、恩捷股份、鼎胜新材、佛塑科技、尚太科技、科达利、诺德股份、湖南裕能、天赐材料、富临精工、星源材质、华友钴业、嘉元科技等，关注华盛锂电、海科新源、德福科技、多氟多、万润新能、龙蟠科技、石大胜华等）；看好碳酸锂龙头（推荐赣锋锂业、国城矿业、大中矿业、盛新锂能、中矿资源、永兴材料、天齐锂业、雅化集团、藏格矿业等）。#风险提示：价格竞争超市场预期。#文字观点", "publish_time": "2026-08-31 18:13", "tags": ["风险提示", "价格竞争超市场预期", "文字观点"]}, "post:2026-08-31T20-18:03248514f792": {"id": "post:2026-08-31T20-18:03248514f792", "kind": "post", "title": "2026-08-31 20:18", "source_label": "帖子正文", "excerpt": "20260831今日段子汇总 1、芒果超媒：公司已在芒果TV推出AIGC内容专属频道，并上线漫剧、仿真人剧、动画等内容 2、中文在线：1、公司推出自研AI语言大模型“中文逍遥 1.0”，依托十多年在文学领域的深厚积累，利用超550万种数字内容资源训练而成；2、公司以优质 IP 为核心，开发各类衍生品", "content": "20260831今日段子汇总 1、芒果超媒：公司已在芒果TV推出AIGC内容专属频道，并上线漫剧、仿真人剧、动画等内容 2、中文在线：1、公司推出自研AI语言大模型“中文逍遥 1.0”，依托十多年在文学领域的深厚积累，利用超550万种数字内容资源训练而成；2、公司以优质 IP 为核心，开发各类衍生品，形成国谷、日谷、美谷品类矩阵，影视业务专注于微短剧（真人短剧和 AI 动漫短剧）制作与发行 3、华曙高科：公司专注与工业级增材制造设备的生产销售，致力于为全球客户提供金属（SLM）增材制造设备和高分子（SLS）增材制造设备，并提供3D打印材料、工艺及服务。公司已开发40余款设备，并配套40余款专用材料及工艺 4、瑞芯微：公司RK182X协处理器顺利量产，已有数百个客户、几十个行业在深化研发中，应用场景覆盖各类机器人、车载AI BOX等领域，首批客户已进入量产阶段，将在下半年放量 5、星网锐捷：国内领先的ICT应用方案提供商；控股子公司锐捷网络是国内少数几家具备高端数据中心交换机研发能力的企业，推出了应用CPO技术的数据中心交换机 6、沃特股份：1、公司已有PCB用聚四氟乙烯（PTFE）材料、散热用液晶高分子（LCP）和聚醚醚酮（PEEK）材料、数据连接用LCP和高温尼龙（PPA）材料等方案；2、公司的聚芳醚酮产线正在建设中，其中包含PEEK产线 7、海鸥股份：公司冷却塔已应用于数据算力中心 8、新赛股份：公司农业主要产品为棉籽、葵花籽、菜籽及其他油料作物，立足于新疆棉花产业，聚焦棉业全产业链 9、金牛化工：1、公司主营业务为控股子公司金牛旭阳的甲醇生产和销售，产能为20万吨/年，采用焦炉气制甲醇工艺；2、公司签4.36亿元风力发电机组设备采购合同 10、福建金森：公司经营区林地总面积近80万亩 11、国芳集团：公司为甘肃省内最大的连锁零售企业 12、我爱我家：1、国内最早开展全国性房地产经纪连锁业务的企业之一；2、公司开发的小爱聊天助手基于自然语言理解、语义识别、实时推荐等多种技术，利用客户与经纪人聊天的实时数据、客户历史画像、公司积累的海量数据和相关知识库，构建了一套辅助经纪人与客户聊天交互的智能服务系统 13、竞业达：公司“星空教育大模型”通过国家网信办备案，累计完成文生文、文生图、文生视频等7项深度合成算法备案，形成教育垂类大模型+深度合成算法+应用落地的完整AI服务体系 14、时代出版：公司AI智能审校工具已实现所属出版单位全覆盖，并在AI制图、音视频制作、软件开发及文字处理领域深度应用 15、深物业A：深圳国资委控股的深圳投资控股公司旗下；主营房地产开发、房屋租赁、物业管理，餐饮业务和仓储业务 16、赤天化：贵州最大的甲醇生产企业；公司化工业务涵盖尿素、甲醇及复合肥的生产和销售，具备年产52万吨尿素、10万吨复合肥、5万吨车用尿素的生产能力 17、潞化科技：公司拥有甲醇设计产能40万吨，上半年净利润同比扭亏为盈 18、中通国脉：公司共同持股成立吉林省华君算力科技有限公司，经营范围包含云计算设备销售等 19、绿色动力：公司下属垃圾焚烧发电项目生产的电力通过公共电网系统上网 20、宇环数控：公司智能装备包括工业机器人及智能化成套装备等，为客户提供数字化、网络化的智能制造技术综合解决方案 21、名雕股份：深圳地区装修龙头；近日广东云犀互动传媒成立，该公司由名雕股份全资持股，含多项AI业务，经营范围涵盖人工智能基础软件开发、应用软件开发及公共服务平台技术咨询服务 22、常润股份：中国最大的千斤顶制造企业；公司的产品主要分为4大系列，即商用千斤顶及工具、随车配套零部件、专业汽保维修设备以及外购辅助产品 23、华达科技：公司此前与埃夫特在工业/人形机器人制造研发生产、轻量化材料产品开发及汽车零部件行业应用等领域达成全面战略合作 24、艾华集团：国内铝电解电容器行业龙头；公司的产品是AI算力硬件供电与电能管理链条中的关键基础元件，可应用在AI基础设施的各个关键部位，如服务器电源及供电保障与能源系统等 25、西子洁能：1、公司熔盐储能可应用于数据中心，通过移峰填谷及储热温控实现“电—热—算”协同，并推进算力中心储能模式创新2、公司及子公司以承接太阳能光伏总承包项目为主，部分分布式光伏项目自持；公司在熔盐储能、电化学储能等领域有深厚技术积累和众多专利，参与建设多个储能项目，为火电厂灵活性调峰、电网侧储能调峰、用户侧储能等提供设备及解决方案 26、广宇集团：深耕杭州的房地产开发商 27、康惠股份：1、公司完成规模化算力集群部署，为AI模型训练、推理及科学计算提供算力服务；2、陕西省知名中药企业；公司拥有100多个国药准字号批文，消银颗粒、复方双花片等核心产品列入国家医保或基药目录 28、诺德股份：公司主营电解铜箔，新一代HVLP铜箔通过认证 29、美盈森：国际领先的包装一体化综合服务商；公司主营运输包装、精品包装、标签及电子功能材料模切产品，并持续为消费电子、白酒、家电等行业龙头提供一体化包装服务 30、悍高集团：公司主要从事家居五金及户外家具等产品的研产销 31、亚厦股份：1、国内建筑装饰行业龙头之一，此前是国内唯一一家同时拥有被住建部认定 “国家住宅产业基地”和“国家装配式建筑产业基地”的装饰企业；2、旗下子公司盈创科技以技术众包模式参与美国超级高铁建设；3、公司表示将积极探索建筑光伏一体化市场，开拓新的盈利增长点 32、博通集成：公司已有多款融合AI技术的AIoT芯片产品实现量产销售，应用领域涵盖AI眼镜、AI玩具等 33、亿田智能：子公司签署10亿元算力中心建设合同 34、深圳新星：1、公司全资子公司松岩新能源建设有5800吨/年的六氟磷酸锂生产产能；公司投资设立全资子公司赣州市松辉氟新材料有限公司，主要从事氟化锂、PVDF等新能源材料研发、生产和销售；2、公司自身是全球头部铝晶粒细化剂制造商 35、永吉股份：1、子公司上海埃延生产的半导体材料衬底外延设备，目前设备处于客户验证阶段；2、贵州省内大规模的专业烟标印刷企业，主营业务为烟标和其他包装印刷品；控股子公司澳大利亚公司TB与曲靖云麻公司，分别开展医用大麻及工业大麻领域的业务 36、梦百合：记忆绵 量政策 放宽利好分布式、 7月31日产业链成本标准化规定落地；海外方面，印度 ALMM 政策延期带动需求、 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 美国 232 政策前抢装。电池涨幅高于硅片，但当前疯狂涨幅不可持续，预计价格将在适度区间稳定， 利润获得一定修复。 问答整理 Q1：智慧星搭载测试的现在情况和后续计划，包括面积和数量？ 答： CPI 模组和 CIC 电池已在巡天卫星上搭载，传回数据表现较好，但时间不长，具体数据保密。地面 测试方面， CPI 与UTG 对比优势显著，与美国 C开头公司做九项数据对照，全部大幅超越，包括透光 率、玻璃化温度、雾化黄变、原子氧侵蚀等指标。 Q2：卫星业务收入体现情况、在手订单结构比例、星座运营收入何时体现？ 答： 2月才收购该公司，收入确认以交付为准，标准严格。上半年受火箭发射不正常影响，截至目前已 发射 5颗卫星，集中在 7-8 月。若火箭排期正常，全年预计发射 15-20 颗，有望进入商业航天公司前 几名。星座组网和行业解决方案预计明年逐步形成。 Q3：Polyfinger 技术在产业化导入方面的进展、量产线导入情况和效率提升？ 答： 创新技术有光刻和激光两条路线。公司产线一部分为激光 Polyfinger ，近期对非 Polyfinger 产线 升级，大部分用光刻路线。目前 Polyfinger 产能占总产能 50% 以上， 9-10 月将全部升级完毕。从现阶 段数据看，提效显著，投入较小，工艺可控度高。 Q4：土耳其产能对三季度或下半年盈利贡献和量的情况？ 答： 土耳其基地已满产，单线产出接近国内最快的 145000 片/天，入库效率与国内相当，良率 98% 以 上，是土耳其标杆产能。 232 政策有两个重要规定：非美生产电池 /组件进口加征 15% 关税；进口电池 限价 22美分、组件限价 38美分。美国本土电池产能极少且未正常生产，土耳其产能将成为美国电池 供应链不可或缺的环节，结合限价和土耳其成本，将有相当高的利润贡献。 Q5：明年卫星发射规划展望和收入贡献预期？ 答： 去年中国发射 300 颗卫星，今年预计 500-600 颗。火箭发射场和海上发射正在大量建设，可回收 火箭技术有望今年形成技术确认，明年发射有望常态化。公司今年根据火箭排期可能发射 15-20 颗， 完全取决于火箭排期。公司 2026 年卫星板块收入预计是 2025 年的十倍左右， 2027 年仍将保持较高 倍数级增长。中国规划 2030 年要有几万颗星在天上，未来需保持每年 5000 颗以上的发射频率。 Q6：土耳其产能打满后的成本水平及输美产品单位盈利预期？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 答： 土耳其成本比国内略高，主要在运费和人员费用方面，但幅度不会太大，高 20% 以内。出口美国 时电池限价 22美分，利润空间可观。土耳其本土方面，对土耳其以外生产电池片征收 170 美金 /公斤 的关税，增加电池成本约 4-5 美分，因此出土耳其本土也很有竞争力。具体产能分配将根据战略需求和 利润需求决定。 Q7：CPI膜产品在海外客户（特别是北美）的送样验证进展及钙钛矿产品推进节奏？ 答： 美国客户在做地面测试，公司产品与 C公司产品对比有优势，部分指标优势较大。目前在做正常的 地面可靠性测试。钙钛矿叠层电池在开发过程中，地面开发进度较快，但太空中的叠层电池与地面有区 别，搭载 CPI 模组膜层的封装工艺还需要时间，预计今年年底和明年年初会有较大进展。 Q8：明年 1月1日能效标准出台后，对电池专业龙头厂商的影响、行业出清影响及出清产能 规模？ 答： 公司实际量产效率已达 26.1% 以上，对应 66版型组件 650 瓦以上功率，满足一级能效问题不大。 后续还将在硅片尺寸、多分片电动化、 Polyfinger 等方面升级改造，力争标准组件功率到 670 瓦以 上。三级能效标准对行业冲击主要体现在两方面：一是升级投入大，很多企业无法承担；二是技术瓶颈 难克服，包括 TOPCon 延续和 BC技术升级。两方面综合影响下，会有很多产能被淘汰。 Q9：下半年及明年电池片价格判断、盈利能力展望、电池片涨价幅度与硅料硅片是否匹配、 下游组件接受程度？ 答： 7月中旬以来电池片涨价受国内外因素推动。国内： 6月18日变压器容量政策放宽利好分布式； 7 月31日产业链成本标准化规定落地。海外：印度 ALMM 政策延期带动需求；美国 232 政策前抢装。 电池从 0.26-0.27 元涨至最高 0.36-0.38 元，硅片从 1毛涨至 3毛，单瓦增长 3分钱。电池涨幅高于硅 片。但当前疯狂涨幅不可持续，随着 12月4日232 政策时间点临近，市场会冷静下来，但不会跌 回 0.26-0.27 元，价格将在适度区间稳定，利润会有一定修复。 Q10：本轮反内卷与此前措施相比有哪些升级？ 答： 第一，行业心态不同。经过近三年洗礼，行业已认知到内卷持续下去大家都会死掉，对反内卷支持 力度更大。第二，政策细节不同。以前政策方向性居多，细节规定欠缺。本次 731 之前相关部门将产 业链成本的会计法则定义得非常清晰，执行时更明确，推进力度会更大。 Q11：上半年电池片出货情况、分国内外情况、全年出货指引是否调整、产能利用率？去年下 半年上饶基地资产减值今年是否还有压力？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 答： 上半年出货总体在 10GW 左右， Q1和Q2各约 5GW 。目前开工率在 77% 左右。减值方面，去年 主要是新型设备减值，今年设备基本已提完，减值会比较少，可能只涉及部分外围配套建设。 Q12：公司后续资本开支计划，特别是商业航天领域的投入？ 答： 商业航天是中美两国过去十年唯一被美国甩开大差距的产业，也是中国 \"十五五 \"期间奋起直追的产 业。今年上半年港股融资约 4亿元，大部分投入商业航天方向。未来两条腿走路：一是通过钧达资本市 场融资支持卫星板块发展；二是卫星板块本身也在融资，巡天天和正在推动股权融资，引进产业合作方 和上下游合作伙伴。具体量化数据还在规划中，后续会在适当时间点披露。 Q13：印度 ALMM 政策明年延续可能性？若不延长如何维持印度市场出货？ 答： 印度电池产能错配严重，现有电池产能效率不到 25% ，良率不到 90% 。有印度客户提出只要良率 到92% 即可合作，可见其制造水平差距。印度电池很难在年底前爬起来， ALMM 政策大概率会继续推 迟。即使最坏情况发生，公司也可在土耳其扩展电池产能，凭现有经验 6-8 个月可建成规模电池厂。 Q14：除印度、美国、土耳其外，其他海外市场电池片需求供给情况及出口占比提升空间？ 答： 各国政府希望制造业回流，但截至目前没有哪个国家电池能像中国一样做好。东南亚和土耳其做得 好是因为中国人运营。欧洲和日本可能有组件产能起来，国内可暂时供给电池。若未来效仿美印设置贸 易壁垒，可从土耳其桥头堡出货。这也是当初选择土耳其项目的重要考量。 Q15：金属化技术进展及三季度经营层面较二季度的改善情况？ 答： 银包铜、铜浆、铝电极三种技术储备都在做，已相对成熟。倾向性上更倾向铜或铝，因为能摆脱对 银的依赖。是否推进需综合看设备投资、耗量、实现方式与银传统金属化的综合性价比。三季度方面， 电池片涨价幅度优于硅片，且公司在银点方面做了储备，在银价上涨背景下占小优势，三季度会比二季 度有正向影响。 Q16：太空光伏电池技术路线选择、国内外不同应用场景的技术路线及钙钛矿商业化节点？ 答： 公司以晶硅电池叠加钙钛矿叠层为技术目标，同时跟进砷化镓三结电池研究。 CPI 封装条件下，异 质结和砷化镓都在做对比测试。海外市场（特别是美国）因发射成本较低， HJT 路线更有性价比，将 推 CPI 封装的 HJT 路线为主打。国内市场也会做介绍和拓展。钙钛矿叠层电池目前仍存在封装条件、太空 环境差异、测试周期长等问题，具体时间点还需再过一段时间才有准确消息。 原文 钧达股份 20260828_ 原文 2026 年08月31日00:38 发言人 00:00 首先我代表公司的管理层向大家汇 报一下劲达股份上半年的经营情况，同时也分享我们对行业的判断和公司的战略的布局。宾达股份是全 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 球领先的专业化电池厂商，也是中国国内光伏行业内的这种第一家 AGH 的双平台上市公司。今年上半 年我们以光伏主业为核心，持续巩固我们的技术的投入和市场哪个角试一下和海外市场的发展。同时我 们利用 A。 发言人 00:47 怎么不好？没信号。喂喂，可以听到吗？可以听到，郑总，你可以继续说。同时我们也 在积极的培养第二增长曲线，来积极的推动我们对商业航天板块的投资和布局。 发言人 01:11 首先光伏主业，我们认为行业的初期已经进入了后半程，公司的经营改善的趋势呈现了 明显的这么一个状况。光伏行业经历了这三年的比较深度的调整，当前行业的产能初心已经进入了后半 程，特别是今年 7月份以来，国家的反内卷的治理也进入了攻坚的阶段。国家提出对能效能耗的强制性 的国家标准也相继的落地。产业的价格也在修复的过程中，特别是电池环节，最近成为涨价环节中弹性 最大的一个一个环节。同时国家 15规划也提出， 2030 年新能源的风电和光伏总装机要达到 2800 千瓦 以上。从中长期的角度，这个行业仍然光伏行业仍然是处于需求推动的一个增长型的行业。 发言人 02:20 巨大股份上半年的 径，控股子公司杭州余禾文化传播有限公司专注AI漫剧制作业务 83、万通发展：公司拟投资8.54亿元取得数渡科技62.98%股权，标的PCIe5.0交换芯片有望于2025年底逐步开始批量供货#市场段子#文字观点", "publish_time": "2026-08-31 20:18", "tags": ["市场段子", "文字观点"]}, "post:2026-08-31T07-32:f00c5c5af7d3": {"id": "post:2026-08-31T07-32:f00c5c5af7d3", "kind": "post", "title": "2026-08-31 07:32", "source_label": "帖子正文", "excerpt": "8月31日股市早报：国产芯片/房地产/PTFE/PCB/算力租赁/OCS概念/CPO/超节点/旅游/丙烷等一、重要财经信息①两部门：《意见》将个人住房贷款期限由最长30年延长至最长40年 给予借贷双方更大灵活度 ②多部门印发通知完善商品住房销售制度：各地要有力有序推行商品住房现房销售，实现“所见即所", "content": "8月31日股市早报：国产芯片/房地产/PTFE/PCB/算力租赁/OCS概念/CPO/超节点/旅游/丙烷等一、重要财经信息①两部门：《意见》将个人住房贷款期限由最长30年延长至最长40年 给予借贷双方更大灵活度 ②多部门印发通知完善商品住房销售制度：各地要有力有序推行商品住房现房销售，实现“所见即所得” ③国际原油周一高开 美伊局势再升级，伊朗向美军基地发射导弹二、今日热点聚焦招商银行：审议通过AI算力投入中期规划的董事会议案麦格米特：VeraRubin相关产品下半年和明年将逐步放量（调研）逸飞激光：近日与海外某客户签订锂电设备组装线采购合同，总金额约2.22亿元，占公司2025年度经审计营业收入的27.60%国产芯片①长鑫科技正式宣布自主研发的最新一代低功耗内存LPDDR6实现量产，并将首批搭载于小米18Fold折叠旗舰手机。这是全球LPDDR6产品首次落地商用，标志着中国存储企业首次在高端内存标准上，一举打破海外厂商长期垄断产品先发的局面，实现全球首发量产的历史性跨越。 ②第十四届半导体设备材料及核心部件展(CSEAC2026)8月31日至9月2日在无锡举行，是半导体设备材料及核心部件领域的展览会，展览规划超7万平方米，集结1300余家国内外企业，覆盖晶圆制造设备、封测设备、核心部件及材料等领域，海外展商占比达16%。（精智达、拓荆科技、长川科技、雅克科技、鼎龙股份、江丰电子）房地产个人住房贷款期限由最长30年延长至最长40年 给予借贷双方更大灵活度；多部门印发通知完善商品住房销售制度。（我爱我家、深物业A、世联行、沙河股份）PTFE机构研报指出，随着NVLink/SerDes速率继续提升，传统M9/Q-glass方案面临越来越严苛的信号损耗约束，PTFE凭借极低介电损耗，有望进入Rubin Ultra Kyber正交背板。（合锻智能、昊华科技、沃特股份、中欣氟材、肯特股份、江化微）PCB覆铜板龙头建滔积层板年内第七次涨价，对所有厚度FR-4覆铜板统一涨价10%；PP半固化片分规格调价，7628（含）以上厚布PP涨价10%，7628以下薄布PP涨价20%。（沪电股份、金安国纪、鹏鼎控股、山东玻纤）算力租赁工信部正式公布17个国家算力互联互通区域节点建设名单，这是国家层面推进全国一体化算力网络的核心实质性举措。17个节点覆盖华北、东北、华东、华中、华南、西南、西北七大区域。（鸿博股份、协创数据、锦鸡股份、艾可蓝）OCS概念机构：除Google TPU部署OCS交换机外，英伟达有望将OCS用在scale-across层，有望带来市源头信息加微信 WUXL3408场新增量。（德科立、赛微电子、腾景科技、光库科技）CPO上海市科学技术委员会发布2026年度关键技术研发计划“智算光网”新一代光通信技术项目申报指南，经评审立项的项目设置里程碑指标，启动时拨付40%财政经费，完成里程碑指标后拨付40%财政经费，完成所有考核指标后拨付20%财政经费。（众合科技、铭普光磁、光库科技）超节点中国移动呼和浩特智算中心2026年扩容工程设备采购及2026至2027年AI超节点设备补充采购评标结果公示。本轮集采规模为3840卡（480套计算节点），据测算投标金额不含税约12.9亿元，拟由武汉长江计算、宝德计算机、河南昆仑与华鲲振宇四家分食。（星网锐捷、锐捷网络、华勤技术、紫光股份）旅游同程旅行数据显示，截至8月24日，平台上“中秋”“国庆”关键词搜索热度月环比增长116%，中秋国庆产品提前30天以上预订热度同比增长超20%。（陕西旅游、众信旅游、西域旅游、峨眉山A）丙烷沙特阿美已通知部分亚洲长期客户，受检修影响，2027 年上半年将停止供应丙烷。沙特阿美的这一举措，将使得进口商既要单独采购沙特丁烷，又要从别处采购丙烷来维持原有配比，采购难度与成本或将双双抬升。（东华能源、九丰能源）机器人发改委：机器人产业涉及人工智能、先进制造、新材料等诸多前沿技术，必须因地制宜，健康有序发展，立足本地的资源禀赋和产业优势，找准定位，发挥优势，防止盲目跟风、一哄而上，切实推动相关行业行稳致远。（中欣氟材、翔楼新材、斯菱智驱、中鼎股份）化工机构研报指出，从供给端来看，中东地缘局势带来的短期市场冲击逐步弱化，但全球化工产能、供应链的实际修复周期较长，短期市场供给偏紧的格局难以彻底扭转。从需求端来看，此前下游行业整体持谨慎经营态度，库存维持低位，后续补库需求有望集中释放。（金牛化工、福莱蒽特、赤天化、泸天化、红宝丽、金煤科技）农业芝加哥小麦期货价格延续涨势，升至三年来最高水平。汇丰指出，农业供应链正面临多重冲击，包括中源头信息加微信 WUXL3408东冲突的影响、近期区域战争的升级，以及极端天气事件——如北半球热浪和日益加剧的厄尔尼诺现象。（万向德农、敦煌种业、新赛股份、新农股份、金健米业、秋乐种业）三、昨日强势板块和个股化工、农业、医药、AI应用、网络安全、PTFE、电力、消费等#文字观点", "publish_time": "2026-08-31 07:32", "tags": ["文字观点"]}, "post:2026-08-31T07-47:c83f4dae186e": {"id": "post:2026-08-31T07-47:c83f4dae186e", "kind": "post", "title": "2026-08-31 07:47", "source_label": "帖子正文", "excerpt": "周观点：中报板块业绩分化，下周策略会建议关注20260830本周美容护理板块重点公司公告中报业绩，板块表现整体符合市场预期，其中品牌端若羽臣、上海家化等公司略超市场预期，彰显业绩韧性。其他部分公司持续深化战略变革，业绩暂入低谷，降本增效蓄势待发。", "content": "周观点：中报板块业绩分化，下周策略会建议关注20260830本周美容护理板块重点公司公告中报业绩，板块表现整体符合市场预期，其中品牌端若羽臣、上海家化等公司略超市场预期，彰显业绩韧性。其他部分公司持续深化战略变革，业绩暂入低谷，降本增效蓄势待发。下周将邀请美护板块上市公司参与上市公司交流会，共商26H1业绩与行业未来发展，建议关注。本周业绩回顾： 1️⃣珀莱雅（603605）点评：多品牌矩阵加速兑现，并购落地拓宽长期成长边界。26H1营收53.75亿元，同增0.24%，归母净利11.68亿元，同增46.26%；扣非归母净利润6.64亿元，同降13.80%。 2️⃣贝泰妮（300957）点评：主品牌稳步修复，多品牌矩阵持续放量。 26H1营收25.92亿元，同增9.27%，收入端稳健修复；归母净利2.92亿元，同增18.30%，利润增速快于收入；扣非归母净利润2.46亿元，同增34.85%，扣非利润弹性释放。 3️⃣若羽臣（003010）点评：业绩超预期，自有品牌矩阵驱动转型成长。 26H1营收22.86亿元，同增73.29%；归母净利润1.67亿元，同增131.72%；扣非归母净利润1.59亿元，同增128.65%。 4️⃣青木科技（301110）点评：全域代运营结构切换，品牌孵化稳步前行。 26H1营收7.29亿元，同增9.10%；归母净利0.87亿元，同增67.90%；扣非归母净利润0.73亿元，同增50.89%。投资推荐 1⃣核心推荐：珀莱雅、毛戈平、上美股份、林清轩、上海家化 2⃣期待业绩增速边际改善的：润本股份、巨子生物、贝泰妮、丸美生物、华熙生物、四环医药、美丽田园医疗健康 3⃣电商代运营+个护自有品牌推荐：若羽臣、水羊股份、青木科技、壹网壹创#文字观点", "publish_time": "2026-08-31 07:47", "tags": ["文字观点"]}, "attachment:files/新闻解读20260830：美联储鹰派表态与房地产政策组合拳的市场影响.pdf": {"id": "attachment:files/新闻解读20260830：美联储鹰派表态与房地产政策组合拳的市场影响.pdf", "kind": "attachment", "title": "新闻解读20260830：美联储鹰派表态与房地产政策组合拳的市场影响", "source_label": "其他", "excerpt": "新闻解读 20260830 ：美联储鹰派表态与房地产政策组合拳的 市场影响 要点总结 1.美联储主席沃什首次系统阐述货币政策理念，表态偏鹰派 ：上周五全球央行年会上，沃什上任三个 月来首次明确对外发声，大篇幅强调通胀问题，将物价稳定放在绝对优先位置，但回避了市场最关注的 美国债务问题、财政支出和偿债利率上升等议题。讲话后美债市场大幅下跌，美股小幅下挫，科技板", "content": "新闻解读 20260830 ：美联储鹰派表态与房地产政策组合拳的 市场影响 要点总结 1.美联储主席沃什首次系统阐述货币政策理念，表态偏鹰派 ：上周五全球央行年会上，沃什上任三个 月来首次明确对外发声，大篇幅强调通胀问题，将物价稳定放在绝对优先位置，但回避了市场最关注的 美国债务问题、财政支出和偿债利率上升等议题。讲话后美债市场大幅下跌，美股小幅下挫，科技板块 明显回撤。 2.美联储短期施压市场，但 \"怎么说 \"与\"怎么做 \"需分开看待 ：讲话的鹰派表态预计将影响最近几天到 一周的市场情绪，亚洲市场周一开盘或延续惯性，科技板块表现机会不大。但讲话未涉及债务问题并不 意味着美联储完全置身事外，九月份的具体配合性动作可能更大程度影响市场。 3.房地产政策组合拳出台，核心是销售模式变革而非简单利好 ：8月28日多部委联合发布《关于完善 商品住房销售制度的通知》，核心变化包括提高现房销售比例、个人按揭贷款最长期限从 30年延长 至 40年。政策本质是规范行业、防止烂尾风险，同时通过正规融资渠道（发债、资产证券化等）缓解房 企资金压力，并非大水漫灌式救市。 4.房地产政策对不同企业影响分化 ：对大型上市公司而言，正规融资渠道增多，属于阶段性利好；对 中小房企而言，期房销售资金被堵住，融资窗口也受限，处境更加不利。 A股房地产板块短期或有资金 试探性回流，但持续性不高，不宜过度乐观。 5.资金短期转向传统赛道寻找机会 ：在科技板块短期承压背景下，资金可能流向农业股（厄尔尼诺现 象引发粮食减产预期，期货市场已有反应）、电网设备建设（固定资产投资抓手）、大金融板块（尤其 利润亮眼的券商）等方向。 6.黄金处于微妙关口，需警惕牛市终结风险 ：黄金已从高位回调至约 4500美元/盎司，未来走势取决 于新任美联储主席任期内政策是否整体偏鹰派，若大幅迈进压制性政策方向，黄金牛市可能面临终结。 问答整理 （原文为单人播报形式，无问答环节） 原文 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 （原文为口语化播报，已在上文要点总结中完整呈现核心内容，此处不再重复。） ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960", "status": "extracted"}, "post:2026-08-31T07-48:3a13a1685998": {"id": "post:2026-08-31T07-48:3a13a1685998", "kind": "post", "title": "2026-08-31 07:48", "source_label": "帖子正文", "excerpt": "🍁🍁🍁hcdx固态电池：中报利空出尽，期待后续产业催化 🍁受锂电扩产季节性影响，26Q2设备相关公司业绩环比不太理想，但今年排产早于往年从6月就开始起量，我们预计26Q3会有大量优质订单确收，固态设备公司业绩拐点。🍁8.21日我国发布全球首个固态电池国际标准，8.26日上海市发布战略性新兴产业发展“", "content": "🍁🍁🍁hcdx固态电池：中报利空出尽，期待后续产业催化 🍁受锂电扩产季节性影响，26Q2设备相关公司业绩环比不太理想，但今年排产早于往年从6月就开始起量，我们预计26Q3会有大量优质订单确收，固态设备公司业绩拐点。 🍁8.21日我国发布全球首个固态电池国际标准，8.26日上海市发布战略性新兴产业发展“十五五”规划中明确提出“推进建设固态电池等多元技术路线对比测试示范基地”，并部署全固态电池储能技术攻关及车端半固态/固态电池产业化。政策上近期有多个积极变化落地。9.4日#世界动力电池大会“全球先进电池前瞻技术会议”召开（欧阳明高院士、宁德时代吴凯、比亚迪孙华军等都有主题发言），后续也有诸多行业会议有望催化 🍁此前头部厂商中试线招标基本完成，产业化目前仍在推进，硫化锂厂家目前也在持续技改，致力于无污染生产，目前各公司市值与低预期匹配，建议重点关注。 🍁标的梳理 ◆固态设备：【宏工科技】、【纳科诺尔】、【先导智能】、【海目星】、【华自科技】、【荣旗科技】、【先惠技术】 ◆固态材料：【厦钨新能】、【上海洗霸】、【中一科技】、【海亮股份】、【紫竹高科（st威尔）】 ◆电池：【宁德时代】、【国轩高科】、【金龙羽】、【德尔股份】#文字观点", "publish_time": "2026-08-31 07:48", "tags": ["世界动力电池大会", "文字观点"]}, "post:2026-08-31T09-32:d9244deae04e": {"id": "post:2026-08-31T09-32:d9244deae04e", "kind": "post", "title": "2026-08-31 09:32", "source_label": "帖子正文", "excerpt": "📑📺电子 / IT 硬件 PCB/CCL，再度扩散的涨价节奏梳理 🔔【伴随铜价上涨，覆铜板 CCL 涨价再度向全行业扩散】 🌐全球覆铜板厂商的涨价节奏正在再度向外扩散。📋近期中国建滔、中国台湾南亚塑胶、日本松下工业陆续对外宣布上调 CCL 以及半固化片（Prepreg）产品价格。", "content": "📑📺电子 / IT 硬件 PCB/CCL，再度扩散的涨价节奏梳理 🔔【伴随铜价上涨，覆铜板 CCL 涨价再度向全行业扩散】 🌐全球覆铜板厂商的涨价节奏正在再度向外扩散。 📋近期中国建滔、中国台湾南亚塑胶、日本松下工业陆续对外宣布上调 CCL 以及半固化片（Prepreg）产品价格。 📈建滔受铜箔、铜等核心原材料供给紧张影响，FR‑4 涨价 10%，PP 涨价 10‑20%。 📈南亚塑胶面对铜箔供给紧缺，宣布 CCL‑半固化片涨价 20‑25%。 📈松下工业面向普通 CCL 以及半导体封装用材料涨价 30%，迅达科技等面向汽车、FCCL 产品涨价 15%。 ⚠️本轮涨价同时波及中国、中国台湾、日本头部厂商，涨价具备同步扩散的特征。 🔥铜价走高，叠加 AI 服务器用 CCL 需求爆发，原材料的供给压力同步放大。 📌受以上因素影响，全球 CCL 厂商涨价周期再度开启，现阶段价格调整还没有结束，后续还有继续上调的可能性。 🔍【对本土产业链带来的影响分析】 📌和海外情况相类似，本轮 CCL 涨价，国内本土厂商同样存在进一步上调产品价格的可能性。 📈此前受铜箔、铜等原材料涨价推动，国内厂商已经完成 FC‑BGA、半导体封装基板、MLB 等产品的涨价。 📉即便完成一轮涨价之后，核心原材料价格依旧处在上行通道。 🧮仅依靠阶段性上调产品 ASP，很难完全消化原材料带来的成本压力。 ✨全球 CCL 厂商集体涨价的背景之下，国内本土厂商也存在把原材料成本上涨向下游传导的有利环境。 📈💡斗山电子 (000150)，进一步上调 CCL 产品价格的可能性正在抬升 📊近期 E‑Glass 纱持续紧张，封装用 CCL 的原材料成本压力不断扩大。 🤝建滔、南亚塑胶、松下工业等头部 CCL 厂商接连涨价，斗山电子同样具备跟随涨价的条件。 🏆斗山电子在高端市场维持较强竞争力，在 LPDDR6、GDDR7、SoC‑CAMM 等高端终端产品阵营，也已经拿到不错的客户验证结果。 📅后续产品涨价、4 季度经营杠杆提升、高端产品结构优化，会共同成为拉动公司业绩的核心驱动要素。#文字观点", "publish_time": "2026-08-31 09:32", "tags": ["文字观点"]}, "post:2026-08-31T07-33:36b3e54e271c": {"id": "post:2026-08-31T07-33:36b3e54e271c", "kind": "post", "title": "2026-08-31 07:33", "source_label": "帖子正文", "excerpt": "液冷busbar：电‑热链路一体化枢纽、高密度数据中心抬升产品壁垒 #AI服务器正从单机部署走向机架级、超节点级系统_机柜功耗进入快速提升阶段。以英伟达平台为例，GB200 NVL72 IT侧功率约136kW，Vera Rubin NVL72预计提升至约209kW，NVLink交换能力和整柜功率密度", "content": "液冷busbar：电‑热链路一体化枢纽、高密度数据中心抬升产品壁垒 #AI服务器正从单机部署走向机架级、超节点级系统_机柜功耗进入快速提升阶段。以英伟达平台为例，GB200 NVL72 IT侧功率约136kW，Vera Rubin NVL72预计提升至约209kW，NVLink交换能力和整柜功率密度继续上行。随着后续GPU功耗提升、交换芯片数量增加以及超节点架构推进，机柜供电能力将成为AI基础设施的重要瓶颈之一。 #机架母线是AI机柜内部配电系统的核心部件，主要承担大电流传输、电源分配和托盘连接功能，是机柜内部的“供电主干”。GB200 NVL72在50V集中供电下母线电流约2900A，而Vera Rubin NVL72母线电流预计提升至5000A以上，已经显著超出传统机柜配电部件的能力边界。 #液冷Busbar有望成为高功率AI机架的重要产品趋势、800V高压供电将进一步提高母线性能要求。 #铜材料是机架母线的核心材料。铜具备更低电阻率、更高导电率和更高导热率，在大电流、高功率密度场景中更有利于降低线路损耗、控制温升并压缩结构尺寸。液冷Busbar和高压母线对铜材也提出了更高要求，机架母线升级本质上会带来材料、结构、工艺和验证体系的全面升级，具备高性能铜材、精密加工、客户协同开发和批量质量控制能力的供应商，有望在AI机柜功率升级过程中率先受益。投资建议：机架母线液冷渗透率提升，以及800V HVDC高压直流架构在新建数据中心导入，将对母线核心部件铜排带来材料和结构升级机会，相关标的：铜排及高性能铜材主要供应商 金田股份、博威合金、电工合金 等。#文字观点", "publish_time": "2026-08-31 07:33", "tags": ["文字观点"]}, "post:2026-08-31T07-49:25b6b75dea55": {"id": "post:2026-08-31T07-49:25b6b75dea55", "kind": "post", "title": "2026-08-31 07:49", "source_label": "帖子正文", "excerpt": "周观点更新：技术升级中的那些方向🧭，0830晚 🐟1️⃣市场风格中，中小市值仍然更占优势；🐟2️⃣PCB坚定产业趋势，重申第二阶段涨价链还能继续的隐含逻辑在：技术升级&自下而上的产品迭代能力", "content": "周观点更新：技术升级中的那些方向🧭，0830晚 🐟1️⃣市场风格中，中小市值仍然更占优势； 🐟2️⃣PCB坚定产业趋势，重申第二阶段涨价链还能继续的隐含逻辑在：技术升级&自下而上的产品迭代能力；（# 继续关注mSAP&PTFE等（详细看今日更新ZJ要点） ） 🐟3️⃣继续关注前沿技术方向，3年或有10倍板块：CPO、NPO、金刚石、玻璃基板、SST、VPD等（# 选股标准，空间大，市值底部且不太大）； 相关标的： 1）PTFE：# 本质依然围绕生益产业链（架构参考周末更新） 深南电路、生益科技、德福科技、东材科技、圣泉集团（ptfe ≠不用ppo）、凌玮科技、联瑞新材）； 2）Msap：红板科技、兴森科技、景旺电子、深南电路、鹏鼎控股、三孚新科； 3）液冷&金刚石：远东股份、飞龙股份、美湖股份、五洋自控、黄河旋风、国机精工； 4）玻璃基板：京东方、力诺、凯盛、奥来德； 5）电源：江海股份、晶丰明源、四方股份、京泉华； 6）算力租赁：香江控股、宏景科技、行云科技、利通电子等。#文字观点", "publish_time": "2026-08-31 07:49", "tags": ["文字观点"]}, "post:2026-08-31T09-43:51888f520926": {"id": "post:2026-08-31T09-43:51888f520926", "kind": "post", "title": "2026-08-31 09:43", "source_label": "帖子正文", "excerpt": "🎯# 液冷：Rubin全面量产，一次侧重估+二次侧放量-【建投机械-温控设备】 3Q26 Vera Rubin全面投产并交付，NV对28财年给出超预期指引，叠加谷歌TPU v8量产在即，算力需求旺盛。新一代平台，液冷从可选变必选，NVL72 100%全液冷无风扇、45℃温水散热，单柜功耗190-23", "content": "🎯# 液冷：Rubin全面量产，一次侧重估+二次侧放量-【建投机械-温控设备】 3Q26 Vera Rubin全面投产并交付，NV对28财年给出超预期指引，叠加谷歌TPU v8量产在即，算力需求旺盛。新一代平台，液冷从可选变必选，NVL72 100%全液冷无风扇、45℃温水散热，单柜功耗190-230kW，液冷覆盖由GPU扩展至网卡/配电/光模块，Q3起液冷有望进入订单兑现期，后续Rubin Ultra架构升级将进一步放大单柜液冷价值量。 # 一次侧：冷源设备价值重估，国产替代加速 1️⃣# 逻辑：高密AIDC有望将冷水机组/冷却塔从\"机电配套\"重估为\"核心基础设施\"，一次侧占液冷系统价值量25-30%；磁悬浮压缩机PUE 1.15、节能20-30%成为技术迭代方向，国产厂商加速验证中； 2️⃣#标的：冰轮环境（顿汉布什全链路：高效冷机+冷却塔+干冷器+输配，H1液冷确收8e+43%）、海鸥股份（冷却塔龙头，数据中心类在手订单+461%）、鑫磊股份（磁悬浮离心压缩机，绑定维谛/特灵）、汉钟精机/磁谷科技（磁悬浮压缩机国产替代，丹佛斯占全球70%）。 #二次侧：价值量占比70-75%，Rubin升级弹性大 1️⃣# 逻辑：CDU/冷板/QDC/Manifold/泵五环节，CDU约占一半；Rubin CDU功率升级+2N配置、冷板微通道化，单位价值量较GB300高20%+；UQD/高端冷板毛利率40-50%，壁垒高、国产突破弹性大； 2️⃣# 主链：英维克（全链条+MGX生态，Q2净利环比+1934%）、申菱环境/同飞股份（CDU+工程交付）、飞龙股份（液冷泵在手订单超6w台）、大元泵业（电磁屏蔽泵国产化）； 3️⃣# 代工链：金富科技、五洋自控（跟随台系/ODM体系切入，订单弹性大）。 # 思路：①Rubin量产落地即放量起点，渗透率26年53%，液冷市场26年超千亿、28年3000亿；②一次侧重估+二次侧升级双击，Q3起订单向业绩兑现加速。 欢迎交流#文字观点", "publish_time": "2026-08-31 09:43", "tags": ["文字观点"]}, "post:2026-08-31T08-50:e5fcad0db250": {"id": "post:2026-08-31T08-50:e5fcad0db250", "kind": "post", "title": "2026-08-31 08:50", "source_label": "帖子正文", "excerpt": "核心观点：美国9月加息概率低，#美股纳斯达克9月创新高概率非常高，但是目前盘面仍旧还有风险，但是预计是新高前的最后一波调整。", "content": "【华鑫电子】周观点：美股科技黎明前的最后黑暗，聚焦长存链、华为韬芯片 # 核心观点：美国9月加息概率低，#美股纳斯达克9月创新高概率非常高，但是目前盘面仍旧还有风险，但是预计是新高前的最后一波调整。同时9月3日华为预期在柏林发布全新Mate90系列，搭载性能媲美“3nm”的韬芯片，A股指数风险已经逐渐消散，因此聚焦指数科技权重股，以及预期近期更新招股说明书的长存产业链。 1️⃣# 推荐方向一：长存链 长存更新招股说明书在即，长鑫上半年财报珠玉在前，长存上半年业绩预期会不错，长存链设备标的也包括指数权重，因此短期重点关注。 # 核心推荐：微导纳米、华润微、拓荆科技 2️⃣#推荐方向二：华为韬芯片华为预期9月3日在柏林发布新款mate90系列，搭载全新工艺性能力媲美“3nm”的韬芯片，对于国产算力板块特别是fab厂来说，里程碑式的利好，相关核心标的也是指数权重股。 # 核心推荐：中芯国际、华虹宏力、长鑫科技 3️⃣# 推荐方向三：国产AI芯片 国产AI芯片包括超节点三季度放量加速，昇腾950PR大规模放量，950DT预期按时发布，寒武纪690正式小批量出货，从相关供应链的情况来看，出货量环比Q2都有明显的提升，CSP厂的AI相关capex在持续提升，存储价格涨价斜率下降的情况下，更多capex可以倾斜至AI芯片和超节点，HBM虽然影响AI芯片整体的出货天花板，但是整体板块相比Q2来说出货量显著提升，HBM也有多个渠道在逐步缓解。 # 核心推荐：寒武纪、盛科通信#文字观点", "publish_time": "2026-08-31 08:50", "tags": ["推荐方向二", "华为韬芯片", "文字观点"]}, "post:2026-08-31T14-38:1ac9ce3aa6da": {"id": "post:2026-08-31T14-38:1ac9ce3aa6da", "kind": "post", "title": "2026-08-31 14:38", "source_label": "帖子正文", "excerpt": "【部分高端算力企业订单排至3年后】 8月，国产AI芯片龙头半年报密集发布。", "content": "【部分高端算力企业订单排至3年后】 8月，国产AI芯片龙头半年报密集发布。上周五，壁仞科技发布财报，营收实现近20倍增长。此外，寒武纪、摩尔线程等头部企业均实现营收大幅增长。业绩大增的背后，是高端算力的供不应求。目前，高端算力供应端呈现全链紧缺的局面，部分企业订单已排至3年后。这是当前高端算力市场火热的一个缩影。不仅下游的智算中心资源供不应求，中游系统集成环节，订单同样密集释放。多家算力服务商表示，公司订单已经连续两年保持高速增长。有企业表示，过去一年多，客户大概增长了10倍。在上游芯片环节，需求激增同样拉动量价齐升。据行业调研数据，2026年国产AI芯片需求规模约400万颗，实际交付约300万颗，存在百万级产能缺口。业内普遍认为，国产芯片在高端AI芯片上正处于强势上行周期。近期，多家国产芯片企业披露财报，数据呈现集体爆发的特征。 （央视财经）#文字观点", "publish_time": "2026-08-31 14:38", "tags": ["文字观点"]}, "post:2026-08-31T15-58:e8e4e5980dfe": {"id": "post:2026-08-31T15-58:e8e4e5980dfe", "kind": "post", "title": "2026-08-31 15:58", "source_label": "帖子正文", "excerpt": "【国联民生计算机】🚀9月金股【寒武纪】：吹尽狂沙始到金中报业绩翻倍式增长，单季度盈利持续大幅提升 2026H1实现营业收入59.96亿元，同比增长108%", "content": "【国联民生计算机】🚀9月金股【寒武纪】：吹尽狂沙始到金中报业绩翻倍式增长，单季度盈利持续大幅提升 2026H1实现营业收入59.96亿元，同比增长108%；归母净利润23.11亿元，同比增长123%；扣非归母净利润21.66亿元，同比增长137%。2026Q2单季归母净利润约12.98亿元，同比增长超90%。 前瞻性指标同样反映业务发展态势：中报预付款项29.14亿元，较一季报18.97亿元增加约10亿元，较2025年底7.45亿元大幅增长并创历史新高。国产AI芯片龙头有望充分受益国内AI资本开支提升 腾讯2026年Q2资本开支527.8亿元，同比增长176%；阿里巴巴2027财年第一季度资本开支676.78亿元，同比增长75%。''模算协同''机遇下，''国模+国芯''有望给龙头带来重大机遇 公司与智谱GLM-5.3-Flash完成Day 0适配，NeuWare软件栈原生支持PyTorch、vLLM等主流AI框架，MLA、MHC、MoE、MTP等适配基础设施开箱即用，线性注意力性能获得量级提升。 软件平台已经完成GLM、DeepSeek、Qwen、Kimi、MiniMax等国产主流开源模型适配。 风险提示：算力行业需求释放节奏具有不确定性；行业竞争加剧。 联系人：国联民生计算机吕伟/郭新宇#文字观点", "publish_time": "2026-08-31 15:58", "tags": ["文字观点"]}, "post:2026-08-31T06-21:3ba8268bc97a": {"id": "post:2026-08-31T06-21:3ba8268bc97a", "kind": "post", "title": "2026-08-31 06:21", "source_label": "帖子正文", "excerpt": "8月31日：地月激光通信、房地产、覆铜板、铜箔、中吉合作等概念股梳理 一、昨夜发酵消息精选。", "content": "8月31日：地月激光通信、房地产、覆铜板、铜箔、中吉合作等概念股梳理 一、昨夜发酵消息精选。 1、地月激光通信：8月29日央视新闻，记者从中国科学院空间应用工程与技术中心获悉，日前，我国在地月激光通信试验任务中取得重要突破，成功在超过40万公里的地月距离上建立起双向激光链路，首次实现地月双向高速激光通信。这标志着我国空间激光通信正式从近地轨道迈入地月空间。相关技术突破使我国空间激光通信正式从近地轨道迈入地月空间，将为我国载人登月、月球科研站建设和深空探测提供重要技术支撑。 概念股：航天电子、烽火通信、中国卫星、新光光电、锐科激光、光迅科技、长光华芯、久之洋、中航光电、海格通信、中国卫通、创意信息、源杰科技、仕佳光子、光库科技、福晶科技、蓝特光学、永新光学、炬光科技、腾景科技、中光学、赛微电子、云南锗业等。 2、房地产：周五盘后多部委地产新政刷屏。推行现房销售，实现“所见即所得”！三部门联合发文完善商品住房销售制度。两部门：将个人住房贷款最长期限由30年延长至40年。证监会：支持上市房地产开发企业并购重组 一视同仁满足不同所有制房地产开发企业合理融资需求。两部委印发《城市更新项目贷款管理办法（试行）》设立专门“城市更新项目贷款”品种。 概念股：城建发展、京投发展、世联行、城投控股、信达地产、我爱我家、香江控股、深物业A、福星股份、特发服务、中华企业、志邦家居、保利发展、万科A、招商蛇口、华发股份、建发股份、天健集团、大悦城、金地集团、沙河股份、北新建材、东方雨虹、金螳螂、滨江集团、新城控股等。 3、覆铜板、铜箔：8月28日电，覆铜板龙头建滔积层板下发最新涨价通知。涨价函显示，近期由于上游物料玻璃布、铜箔等核心主材供应紧缺、价格大幅上涨，自即日起，公司对所有厚度FR-4覆铜板统一涨价10%；PP半固化片分规格调价，7628（含）以上厚布PP涨价10%，7628以下薄布PP涨价20%。服务器的高速运算，需要更强的供电、更快的数据传输和更高效的散热，在这些环节中，铜至关重要。据市场测算，2026年AI服务器 半年，26为ASIC订单元年、27年ASIC占比有望超过GPU” （4）#产业链订单与中报验证：英维克H1海外业务收入同比+71.3%，Q2业绩拐点已现；飞龙股份首次披露液冷泵业务细节，明确在手订单超5亿，包含近万台大功率L平台泵，并已成功进入北美科技巨头N、G供应链 2️⃣我们的观点： 随着英伟达Rubin平台近期启动全球交付，液冷订单的兑现已从台系厂商指引下沉至国内Tier 2供应商的实际出货 我们#看好26H2液冷板块处于订单增长、产能扩张与业绩释放的“三线共振”，产业关键拐点已现； #液冷投资逻辑从渗透率预期驱动全面转向订单、业绩加速兑现，产业链不同环节有望在26H2至27年依次进入兑现窗口。 3️⃣怎么配：三条投资主线与节奏主线一：#零部件与代工（T2）——前置指标，订单先行#核心高价值部件（弹性大）：Rubin/Google导入下，冷板、Manifold、UQD、管路等核心部件点位数/规格同步提升，订单确认与出货优先于T1体现建议关注：华翔股份（新增）、川环科技、磁谷科技、金富科技、鸿富瀚主线二：#CDU/系统集成（T1）——合同负债与确收节奏#全栈系统解决方案商（确定性高）：Rubin/Google导入推动柜内与柜外系统同步升级，Q3开始交付验证，Q4-明年Q1业绩加速体现；海外项目/合同负债上行是验证重点建议关注：东阳光、申菱环境、英维克主线三：#光模块液冷——n倍做多光模块1.6T/3.2T光模块出货量↑→液冷渗透率快速提升↑ →基数↑*液冷渗透率↑→行业空间↑建议关注：鼎通科技、奕东电子、硕贝德、胜蓝股份#文字观点", "publish_time": "2026-08-31 12:37", "tags": ["产业链订单与中报验证", "核心高价值部件（弹性大）", "全栈系统解决方案商（确定性高）", "光模块液冷——n倍做多光模块", "文字观点"]}, "post:2026-08-31T08-53:b5c99df71a0a": {"id": "post:2026-08-31T08-53:b5c99df71a0a", "kind": "post", "title": "2026-08-31 08:53", "source_label": "帖子正文", "excerpt": "关注受益于明年1.6t光模块放量的液冷Cage机会，行业短中期难看到其他家竞争对手。", "content": "奕东电子中报业绩点评：营收高增扭亏为盈，连接器及热管理业务高速增长 业绩：26上半年营收14.13亿元，同比+40.11%；归母净利润915.90万元，同比扭亏为盈（去年同期亏损411.65万元）；扣非归母净利润105.06万元，同比扭亏为盈（去年同期亏损934.6万元）；营收与利润未同步的原因为股权激励费用（0.3亿元+）和研发费用增加所致。基本每股收益0.04元。单季度来看，26Q2营收8.04亿元，同比+41.5%；归母净利润亏损33万元，扣非归母净利润亏损462万元；毛利率18.13%，同比+1.39pct，环比-3.93pct，符合市场预期。 AI业务高歌猛进。分业务来看，连接器及零组件营收6.54亿元，同比增长51.85%，毛利率提升3.03pct；热管理产品实现1.74亿元，同比增长712.26%，毛利率提升1.26pct；其他业务稳健增长。连接器方面，与光模块配套使用的光模块Cage尤其是 OSFP 112G、OSFP-XD 224G、OverPass 224G 等系列产品的订单大幅增长，光模块Cage连接器组件销售规模大幅增加。公司承接的国内、国际头部客户 Overpass 系列 224G、双层系列 OSFP 224G 等新一代光模块 CAGE 新产品已持续大批量交付；热管理产品板块，公司迅速并购冠鼎，散热产品开始批量应用于高性能ai数据中心集群。 当下光模块液冷Cage行业处于等待行业大批量订单落地的阶段，公司产品已经在下游大厂开始验证。预计伴随着未来几个月行业大规模订单落地，行业两家公司股价有望迎来跃进。当下鼎通科技和奕东电子两家公司股价处于低位，逢低继续关注受益于明年1.6t光模块放量的液冷Cage机会，行业短中期难看到其他家竞争对手。---xz#文字观点", "publish_time": "2026-08-31 08:53", "tags": ["文字观点"]}, "post:2026-08-31T08-54:ee89226b306c": {"id": "post:2026-08-31T08-54:ee89226b306c", "kind": "post", "title": "2026-08-31 08:54", "source_label": "帖子正文", "excerpt": "鼎通 市场问题系处于一个有宽度但没容量的状态。具体的表现：PTFE、ABF膜可以，但一到PCB大票钱就不够用。 我们的观点： ✔️从半年报横向对比，AI某种程度超预期。# PCB板块性业绩好在半年报前就是一致共识，但【柜内-电源】麦米、铂科、三环、顺络，【柜外-缺电】潍柴大票业绩都beat预期，尽管还没板块效应，但还是之前判断，类似MLCC，26Q3第一个季度板块性出拐点。 ✔️NV财报部分解决问题，他验证了升级带来单token成本下降超预期（我们预期60-70%，他给出的答案90%+）。CSP的FCF27年最低点，后面会加速上行。 但市场最关注的天花板能不能被打开、模型能力能否跃升，则需要模型厂和CSP更多变化来回答。 投资建议： ✔️可以新技术打野，但更想选27年能兑现、能拿的久一点的资产。———目前最优解Rubin，周末马斯克的推特再次表明态度，spx投算力的决心且都都都是Rubin。 Rubin标的选择： 一、PCB升级：二代布+四代铜，【国际复材+铜冠铜箔，其他：江南新材、天承科技】。底部基本面走出来+估值足够便宜的【建滔基层板、建滔集团】。 二、电源及周边升级：【电源麦米、蔚蓝锂芯，电容三环、江海、顺络，电感铂科】。 三、液冷：优先一次侧【冰轮环境】。 ✔️新技术——聚焦PCB产业链，一、pcb本b环节不少这轮估值低点明年20X PE不到，而净利率20%左右（不存在PB过高、ROE过高等困境）；二、这个板块承载各种各样的新技术，msap、ptfe、载板等，很容易# 形成基本面趋势&新技术热钱的资金共振。 还是最看好载板国产化（超级周期+国产化订单刚开启）。重点标的：【深南、兴森、华正、莲花、方邦】。其他：PTFE等各类新技术，重点标的【深南、生益科技、华正、国瓷、联瑞】。 其此，看好陶瓷基板赛道，以光模块为例，氮化铝粉-裸板-制品价值量20-100-300元，按1.6T 1亿颗算空间广阔，300亿可期。 核心逻辑市场空间超想象+粉体涨价+下游附加值高，最牛逼的是一体化公司。重点标的：【中瓷、国瓷、旭光】。 ✔️bottleneck—— 缺电，选离网主电源 & 供应链 从政策角度，选供应链不选终端（举个例子，sst整机不行，伊顿、台达、施耐德供应链可以）。 从基本面角度，还是最看好模块化&预制化产业趋势，气发+SOFC汇流处【潍柴动力】。其他：继续看好SOFC产业链，短期增速最快+中期部分替代燃机，【潍柴、三环、春晖、振华等】。 ——————————— 欢迎交流：孙潇雅#文字观点", "publish_time": "2026-08-31 09:42", "tags": ["文字观点"]}, "post:2026-08-31T17-37:74be359ee3f4": {"id": "post:2026-08-31T17-37:74be359ee3f4", "kind": "post", "title": "2026-08-31 17:37", "source_label": "帖子正文", "excerpt": "【国投机械】康平科技08：光模块驱控业务景气度持续验证 公司发布26H1报告，26Q2营收6.27亿元，同环比增加107%/31%,归母净利润0.2亿元，环比提升43%，毛利率20", "content": "【国投机械】康平科技08：光模块驱控业务景气度持续验证 公司发布26H1报告，26Q2营收6.27亿元，同环比增加107%/31%,归母净利润0.2亿元，环比提升43%，毛利率20%，环比提升1.6pct。 #子公司凌臣科技营收大幅提升。子公司二季度营收约为3.7-3.8亿左右，环比提升25%+，26H1净利率提升至14%左右，盈利能力持续提升，三季度光模块业务订单有望确收，盈利能力将大幅提升，全年收入目标15亿，子公司净利润有望达到2亿左右。 #光模块业务持续推进。公司在手光模块订单3亿+，推动联讯仪器、华工等新客户订单落定，同时有望切入中际旭创驱控份额，光模块业务明年收入有望翻倍+增长。 #主业三季度有望回暖。公司在1-2季度进行调价，由于调价2季度完成，部分业务延后至三季度发货，公司主业2季度营收2.4亿元，同比有所下降，受汇兑损失千万级别+股权激励费用，主业亏损百万级别，调价完成后三季度主业有望回暖。 #翻倍+市值空间。1）主业：从电机拓展到整机代工，明年有望完成从12亿-20亿收入规模跃升，明年利润有望超过1亿；2）子公司：假设明年完成25亿收入，光模块+半导体超过10亿+收入占比，高毛利的光/半导体改善公司盈利能力，假设贡献4亿+利润，完全并表公司利润约5亿+，明年10XPE不到，市值看150亿。 欢迎交流 国投机械 朱宇航/孙然#文字观点", "publish_time": "2026-08- 天出现的催化/验证\u003c/strong>：长鑫存储开始小规模生产HBM3E并计划2027年扩大生产；SK海力士因基材芯片重新设计导致NVIDIA Rubin；三星电子第三季度营业利润首次突破100万亿韩元，现货价格为长期协议5倍。\u003c/li>\n\u003c/ul>\n\u003ch3>主线三：宏观/策略\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：沃什放鹰，9月加息预期升温，A股先守后攻。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：沃什首秀强调美国经济和就业韧性、2%PCE目标不可动摇；9月加息概率从35%升至60%。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：7月PCE印证通胀黏性，9月加息预期回升至接近六成、12月前加息概率超90%；8月31日A股与港股“防御交易掉头”；国内地产新政密集落地。\u003c/li>\n\u003c/ul>\n\u003ch3>主线四：PCB/CCL/铜箔\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：CCL涨价向全行业扩散，PTFE开启下一代材料路线。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：伴随铜价上涨，覆铜板CCL涨价再度向全行业扩散；PTFE是Rubin Ultra及其后代材料升级的确定性增量，Switch Tray先跑通（2026下半年-2027），正交背板紧随（2028 Feynman）。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：建滔积层板年内第七次涨价、FR-4统一涨价10%；生益科技2026年中报利润30多亿、为PCB板块最高；M6~M8产品已批量应用于国内头部算力客户。\u003c/li>\n\u003c/ul>\n\u003ch3>主线五：液冷/电源\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：高功率AI机架驱动液冷与供电环节量价齐升。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：AI服务器从单机部署走向机架级、超节点级，GB200 NVL72 IT侧功率约136kW，Vera Rubin NVL72预计提升至约209kW；液冷Busbar有望成为高功率AI机架重要产品趋势。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：NVL72 100%全液冷无风扇、45℃温水散热；英伟达独家验证鼎通科技液冷IO产品；液冷核心标的英维克、飞龙股份在半年报中首次详细披露液冷业务进展。\u003c/li>\n\u003c/ul>\n\u003ch3>主线六：光通信/CPO\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：光模块技术迭代进入新一轮壁垒切换窗口。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：未来竞争壁垒将转向2.4T、3.2T/6.4T NPO及12.8T以上CPO，1.6T不再是核心跟踪指标。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：联讯仪器中报营收15.31亿元（同比+208.71%）、归母净利润5.67亿元（同比+903.00%）；罗博特科二季度营收同比增长193%、环比增长172%；华懋科技收购有望近期恢复，富创优越明年业绩爆发可期。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>宏观与市场：沃什讲话后9月加息概率由35%升至60%；8月31日A股与港股走“防御交易掉头”，半导体板块仅小涨2.4%、主力资金净流出约15亿元，澜起科技下跌3.8%。\u003c/li>\n\u003cli>PCB/CCL：建滔积层板发布年内第七次涨价函，对所有厚度FR-4覆铜板统一涨价10%；建滔、南亚塑胶、松下工业陆续宣布上调CCL及半固化片价格。\
