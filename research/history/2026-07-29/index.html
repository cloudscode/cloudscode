代新目标 。《可再生能源发展“十五五”规划》发布，设定2030年可再生能源发 电总装机35亿千瓦、风电光伏28亿千瓦以上、年发电量 6万亿千瓦时等目标，首次提出可靠替代目标：风光 平均置信出力达8%，迎峰度夏度冬晚高峰风光电量占比超 20%，“十五五”新增可靠顶峰发电能力 3亿千瓦以 上。部署“三北”基地新增装机3.7亿千瓦、海上风电开工 1亿千瓦、分布式新能源新增 3亿千瓦，并明确新建 集中式风光电站置信出力原则上不低于 10%。规划以“扩量提质、可靠替代 ”为主线，推动可再生能源从电量补 充向兼具容量支撑的主力电源转变，同时部署绿色氢氨醇、技术创新与市场化机制建设，标志着可再生能源发 展进入系统友好、质量并重的新阶段。 【核心观点】 锂电、光伏、风电等新能源行业在经历 5年的迅猛发展后，供给需求均迎来快速放大。 2025年国内新能源 车销量达到1644.5万辆，同比增长27.9%，已经占国内汽车销量的 47.8%，与此同时，锂电池供应端也已经完 成快速扩张。展望后续来看， 1）新能源车虽然渗透率已经提升至较高水平，但是安全、续航、充电时长等问题 仍较为突出，因此我们认为锂电池板块后续需要多关注新技术落地，比如固态电池及配套新材料体系落地。 2） 储能作为锂电池另一大需求增长点，海外地区的缺电也快速拉动国内储能电池的出口。根据 CNESA的统计，截 至2025年底，我国电力储能累计装机规模 213.3 GWh，同比增加54%，目前渗透率仍较低，后续有望成为锂电 池的重要需求贡献。可再生能源方面， 2025年是我国”十四五”最后一年，国内光伏 /风电装机预计分别为 317/120GW。展望后续来看，近日国家能源局敲定”十五五”新能源发展目标，计划到 2030年新能源发电量占 比达到30%左右，并衔接2035年全国风电和太阳能发电总装机力争达到 36亿千瓦的自主贡献目标。在”十五 五”的发展目标下，光伏及风电产业需求将继续快速增长。 【行业新闻及公司公告】 锂电与机器人双向奔赴新局 。瑞德丰与李群自动化达成亿元级双向合作，既批量采购工业机器人及智能制 造方案，改造精密结构件产线，又反向供应机器人关键结构件，实现从设备采购到供应链反哺的跨越。此前瑞 德丰已携手越疆机器人，宁德时代引入银河通用重载机器人承担搬运拣选，亿纬锂能自研人形机器人及高比能 电池系统，比亚迪则联合港科大攻关具身智能。锂电工厂为机器人提供柔性换型、重载搬运等复杂验证场景， 而锂电积累的精密制造、电池与规模交付能力正反向赋能机器人量产体系，两大产业加速深度融合，双向赋能 格局日渐清晰。（来源：高工锂电） 电池消费税恢复征收引发链上博 弈。历经十一年免税，锂离子电池等产品自 2026年9月起分两步恢复征 收消费税，先按2%、一年后提至4%，对应单车成本增加约 500至1000元。数百元增量在价格竞争激烈、电 池盈利刚修复的当下，谁承担 ——电池厂、车企还是消费者 ——已成产业链谈判焦点。另一争议围绕车企自产 电池能否避税，业内普遍认为自产不等于免税，电池用于生产汽车仍需申报缴纳，实际影响取决于计税口径和 抵扣细则。政策释放锂电池已成熟、税收引导结构优化的信号，产业链重新定价刚刚开始，未来数月价格谈判 下载日志已记录，仅供内部参考", "status": "extracted"}, "post:2026-07-29T07-24:23a82fdb77c7": {"id": "post:2026-07-29T07-24:23a82fdb77c7", "kind": "post", "title": "2026-07-29 07:24", "source_label": "帖子正文", "excerpt": "7月29日股市早报：AI应用/IPv6/光刻机/电网设备/电影/MLCC/脑机接口/分散染料/白酒等一、重要财经信息①明晟公司（MSCI）公告，长鑫科技因IPO新股上市，将被纳入MSCI中国全股票指数，8月10日正式生效。②美股三大指数收盘涨跌不一，道指涨1.03%，标普500指数涨0.21%，纳指", "content": "7月29日股市早报：AI应用/IPv6/光刻机/电网设备/电影/MLCC/脑机接口/分散染料/白酒等一、重要财经信息①明晟公司（MSCI）公告，长鑫科技因IPO新股上市，将被纳入MSCI中国全股票指数，8月10日正式生效。 ②美股三大指数收盘涨跌不一，道指涨1.03%，标普500指数涨0.21%，纳指跌0.22%。费城半导体指数跌4.49%，Roundhill存储ETF（DRAM）收跌8.89%，光通信、存储板块大跌，铠侠ADR、闪迪跌逾14%，康宁跌超12%，Coherent跌超10%，SK海力士、Lumentum、希捷科技、美光科技、AMD  与 NAND 在上一季度基础上再度录得明显涨价，服务器 DRAM、企业级 SSD 等 AI 相关产品是本轮增长的主要驱动力。", "content": "一、2026 年第二季度经营业绩（总裁 Hong Hyun-joong） 二季度，AI 基础设施投资扩张带来的强劲需求与偏紧的供给环境延续，价格维持上行趋势。DRAM 与 NAND 在上一季度基础上再度录得明显涨价，服务器 DRAM、企业级 SSD 等 AI 相关产品是本轮增长的主要驱动力。二季度营收 79.3 万亿韩元，环比增长 51%，同比增长 257%，继上季度之后再创历史新高。 DRAM 在供给能力受限的条件下，公司以 HBM 及 AI 服务器 DRAM 产品为中心扩大销售，出货量环比实现高个位数增长，符合此前指引。其中服务器用 LPDDR 产品（含 SOCAMM）销售显著增长；在传统 DRAM 价格持续走强的带动下，DRAM ASP 环比上涨约 30%。 NAND 在一季度出货收缩形成的低基数之上，叠加企业级 SSD 销售扩大，NAND 出货量环比录得中双位数增长，符合指引。企业级 SSD 营收较上季度增长一倍，30TB 及以上大容量企业级 SSD 营收较上季度增长逾两倍。受各产品价格全面走强、DRAM 与 NAND 两端同步涨价以及成本结构改善推动，NAND ASP 环比上涨 50% 中段水平。 损益 二季度营业利润 60.5 万亿韩元，环比增长 61%，同比增长 557%；营业利润率环比提升 5 个百分点至 76%，营业利润与营业利润率均创历史新高。二季度折旧与摊销 4 万亿韩元，EBITDA 为 64.6 万亿韩元，EBITDA 利润率 81%。营业外净收益 62.2 万亿韩元，其中包含汇率上行带来的汇兑净收益 1.1 万亿韩元，以及投资资产处置与估值收益 63.3 万亿韩元。据此，税前利润 122.7 万亿韩元，净利润 93.9 万亿韩元，净利率 118%。 财务状况 截至二季度末，现金及现金等价物（含短期投资）为 88 万亿韩元，较上季度末增加 33.6 万亿韩元；有息负债减少 0.7 万亿韩元至 18.6 万亿韩元。净现金规模扩大至 69.4 万亿韩元，负债权益比率较上季度末改善 5 个百分点至 7%。 三、市场展望 AI 技术正演进为可长时间代替用户执行复杂任务的 Agentic 形态。随着 AI 渗透进搜索、编程、生产力工具等各类服务，需求覆盖范围持续扩大。从存储角度看，除提升 AI 服务器性能、扩展系统规模所必需的 HBM 等高性能存储外，支撑 Agent 类服务的服务器 DRAM 需求同样在增加；为更高效地处理 AI 持续产生的输出，高性能企业级 SSD 的作用也在扩大。由此形成的是 AI 存储与传统存储同步增长的结构性需求变化。 与此同时，随着 AI 模型改进与软件优化推进，单个任务的算力消耗与成本持续下降。公司判断，效率提升不会抑制整体基础设施需求，反而会降低 AI 服务的价格门槛与使用门槛，从而扩大用户基数与应用范围。 主要大型科技客户因 AI 服务使用量增加与算力短缺而扩大基础设施投资；在 AI 服务带来的收入与利润增长支撑下，其存储采购看起来仍在持续扩大。事实上，主要客户目前仍在要求增加存储供应。在 PC 与移动应用领域，由于难以获取存储，出现了阶段性的销售调整；但随着供给紧张缓解、AI 服务加速普及，这两个板块有望逐步恢复增长动能。 在供给受限的条件下，预计 DRAM 需求增长 20% 中段、NAND 需求增长 10% 高段。若后续供给约束缓解、被压抑的潜在需求得到满足，市场的增长轨迹还可能进一步上移。 供给端方面，短期内供需平衡难以出现实质改善。原因在于 HBM 与 AI 服务器存储所采用的先进制程复杂度不断上升，以及新建产能所需的建设周期。预计供需紧张状态将持续相当长的时间。 围绕中长期供应稳定性，公司正与客户推进多年期合同（LTA）讨论。截至目前，已与包括核心客户在内的约 10 家客户完成 LTA 谈判，并在与其他主要行业参与者继续商谈。这些 LTA 并非简单的数量安排，而是战略性伙伴关系：既用于确保中长期供应稳定，也用于配合客户的技术路线图开发下一代存储产品。具体定价结构因客户与产品特性而异，设计上用于应对价格波动；同时引入保证金等财务机制，以保障合同履行、提升客户中长期需求计划的可见度与可靠性。在此基础上，公司将提升投资与生产运营效率，夯实中长期经营稳定与可持续增长的基础。 四、第三季度经营计划与技术进展 三季度 DRAM 出货量预计较二季度增长约 10%，公司将以服务器产品为中心积极响应需求；NAND 比特出货量预计环比低个位数增长。 随着 AI 模型日趋复杂，对存储的性能要求进一步提高，竞争范围已从单一存储产品的设计扩展至系统架构与封装技术。公司将依托涵盖 HBM 在内的 DRAM 与 NAND 产品组合，以及与客户的共同开发能力，从系统层面引领存储创新。 HBM4：通过持续的产品优化，在达到客户所需数据处理速度的同时，实现了业界领先的能效与成本竞争力，展现出差异化技术能力。公司已于二季度开始量产出货，并计划在下半年全面爬坡。 HBM4E：上半年已向一家主要客户送样。该产品采用成熟且量产稳定性经过验证的优化工艺，后续开发进度预计将顺利推进。公司将凭借以高良率与优良品质为支撑的稳定供应能力和成本竞争力，以及业界领先的性能，继续维持 HBM 领先地位。 传统 DRAM：二季度已全面开始供应基于 1c nm 工艺的 SOCAMM2 产品。后续公司将按客户开发进度优化产品线，并准备送样以扩大客户基础。 NAND：加快向先进制程的转换，并以大容量、高性能产品为重点强化产品组合，以匹配市场需求。上一季度 321 层产品已在 NAND 产量中占比最高，公司计划按原定节奏于年底前将其在国内产能中的占比提升至 50% 左右。 在供需失衡持续的市场环境中，稳定供应能力——即按客户要求的时点交付所需数量的能力——正与技术实力并列，成为核心的经营竞争力。为响应强劲的客户需求与中长期增长机会，公司短期内将继续推进扩产投资以提升供给响应能力：提前 M15X 的量产时间表并加大投资以快速扩充产能，龙仁 Fab 1 将于 2027 年初完成洁净室开线。由于进度提前与投资规模扩大，2026 年资本开支预计将达到 40 万亿韩元区间的高段水平。 中长期方面，公司将基于与客户的讨论及市场需求预测，前瞻性地为未来产能储备基础设施。近期已公布用于强化先进封装能力的新投资计划，以及新的 NAND 生产基地 M17；同时公布了在韩国国内新建半导体集群的中长期规划，以应对龙仁之后的长期需求。后续的实际建设、设备安装与产能扩张将综合考虑客户需求可见度、投资效率等因素分阶段推进。公司将在保持资本开支纪律的前提下，不延误中长期增长机会，同时强化供给响应能力与财务稳健性。 五、关于 ADR 发行 7 月 10 日，公司 ADR 在美国纳斯达克市场成功上市，为外国公司在美国 IPO 中规模最大的一次发行。此次上市的意义不仅在于融资，更在于确认了全球市场对公司技术竞争力与成长潜力的信任，同时拓宽了公司与下一代计算生态的连接点。以此为基础，公司将强化与主要客户及合作伙伴的战略合作，发掘新的业务机会；并通过持续的技术创新，为半导体产业发展与 AI 系统成长作出贡献。 六、财务稳健性与股东回报 在利润与现金创造能力扩张至历史高位的推动下，公司财务能力进一步增强。与此同时，AI 时代的结构性增长机会不断扩大，实现这些机会所需的投资规模较以往显著上升。在此环境下，公司优先投向能够产生高盈利性与战略价值的成长机会，同时力求构建即使在市场波动中也能保障稳定经营的财务结构，并将由此产生的成果持续与股东分享。 尽管未来投资需求预计上升，公司认为显著增强的现金创造能力，足以在实现未来成长投资目标、维持财务稳健性目标的同时，有意义地扩大股东回报。目前公司正从多个角度检讨股东回报的各类追加执行方案。 七、问答环节 问题一：J.P. Morgan，Jay Kwon 问：近期部分大型科技公司在考虑租赁数据中心，同时效率更高的 AI 模型不断出现，市场因此担心 AI 基础设施投资可能放缓甚至下滑。基于公司与客户的沟通，如何看待主要 CSP 的 AI 基础设施投资走向？据此对 HBM、DRAM 与 NAND 的需求又意味着什么？ 答：公司了解上述担忧的由来。但公司并不将这些动向视为 AI 投资放缓的信号，而是视为对已大规模建成的 AI 基础设施提高利用率、并加快变现的转变过程。 对主要 CSP 而言，AI 竞争力与其搜索、广告、云服务、软件等核心竞争力紧密绑定，因此面向强化 AI 能力的投资大概率将保持稳健。 同样，公司也不认为效率更高的 AI 模型会减少基础设施需求。模型与系统效率提升后，同一套基础设施可以支撑更多用户与服务，反而会扩大 AI 的可及性与采用范围。近期高效率 AI 模型出现后需求呈爆发式增长，即是佐证：效率提高带来的是更广泛的 AI 采用与使用，而非基础设施需求下降。 这一判断同样得到与主要客户所讨论的中长期需求展望的支持。个别项目的时间点可能因电力供应、数据中心建设等物理条件而有所不同，但在 CSP 之间的 AI 竞争与 AI 服务持续扩张的支撑下，公司认为 AI 基础设施投资在明年之后仍将保持稳健。 因此，存储需求整体将继续扩大：不仅是用于 AI 算力的 HBM，还包括支撑 Agentic AI 的服务器 DRAM，以及承接 AI 服务扩张与数据增长的高性能、大容量 NAND。 问题二：Hana Securities，Kim Rok-ho 问：公司近期提出了中长期大幅扩产的计划。支撑这一战略的长期存储需求判断依据是什么？其中是否包含通过长期协议锁定的需求？此外，产能增加也令市场担心可能出现供给过剩，公司如何看待？ 答：公司的中长期产能战略，建立在 AI 扩张所驱动的存储需求结构性增长，以及与核心客户就更长周期需求的持续讨论之上。 近期公司与客户的合作正从交易型关系演变为更具战略性的长期伙伴关系。客户方面推动签订长期协议、构建伙伴关系的意愿增强，本身就是 AI 生态需求可持续的证据。 SK hynix 当前规划的产能扩张，正是基于在客户伙伴关系中获得的市场需求可见度。实际的资本投入与产能爬坡将综合考虑需求可见度、投资效率等因素分阶段实施，扩产将与已确认的客户需求灵活对齐。公司认为中长期投资计划不会立即导致供给过剩。 问题三：Meritz Securities，Kim Sunwoo 问：问题关于长期协议（LTA）。同业近期已完成并公布了 LTA。虽然公司在业绩说明中已简要提及，能否进一步说明 SK hynix 的 LTA 框架，例如合同期限与定价结构？ 答：公司正在与客户讨论的 LTA 采取多种形式，按客户与产品特性做差异化设计。合同期限通常在五年左右，具体条件因客户与产品而异。 定价结构同样不会统一。公司正与客户探讨多种能够更好应对价格波动的定价机制，目标是降低短期市场波动带来的不确定性，同时提升客户与公司双方的长期经营稳定性。 与此同时，考虑到需求波动对存储周期的影响，取得有效的采购承诺同样重要。因此在长期数量承诺之外，协议还包含保证金等可强化合同履行与需求可见度的机制，具体条款因各客户的要求与合同结构而异。该结构一方面使客户能够制定更可靠的长期采购计划，另一方面使公司能够基于改善后的需求可见度优化投资与生产规划。 关于 LTA 将覆盖多大比例的销售，公司目前无法给出具体数字，但会根据市场状况与客户需求维持在适当水平：既提升业绩的下行韧性，又在市场转好时保留捕捉增量需求与成长机会的灵活性。 公司已依托与英伟达等主要 AI 客户的长期合作，在 HBM 上建立了扎实的盈利基础。展望未来，公司将继续强化 HBM 领先地位，并借助 LTA 所获得的需求可见度与运营灵活性，在稳定性与盈利性之间取得平衡。 问题四：Daiwa Capital Markets，SK Kim 问：问题关于 DRAM。二季度 DRAM ASP 涨幅似乎低于市场预期，原因是什么？下半年的展望如何？ 答：公司依据客户需求与中长期产品战略，管理 HBM 与传统 DRAM 之间的销售组合。二季度部分高附加值产品的出货被推迟至下半年，产品结构变化对混合 ASP 产生了影响；这些因素在下半年将逐步缓解。 随着 HBM4 出货全面爬坡、以及 1c nm 传统 DRAM 出货增加，预计下半年比特增长将高于上半年水平。 此外，考虑到客户需求与产品结构的变化，HBM4 销售增长与高附加值产品贡献上升，也将对混合 ASP 产生正面影响。出货量提升叠加产品结构持续改善，将推动下半年 ASP 与业绩上行。 在销售策略上，公司不以短期价格波动或短期盈利为中心，而是综合考虑需求可见度、长期客户关系以及各产品细分的供需状况。这一原则将保持不变，公司将在把握市场增长机会的同时，实现稳定且可持续的业绩增长。 问题五：SK Securities，Han Dong-hee 问：问题关于 HBM。市场有观点认为竞争对手近期在 HBM 上取得了快速进展。公司 HBM4 的竞争力体现在哪里？维持 HBM 市场领先地位的关键差异化因素是什么？ 答：HBM4 的竞争力不仅取决于能否交付所需性能，还取决于能否以稳定良率与一致品质实现规模化供应。 自 HBM2 世代以来，SK hynix 已持续验证了这些能力。公司在上市时点、产品性能、量产良率、品质以及客户信任方面积累的竞争力，无法在短期内被复制。 在此基础上，公司已于二季度面向核心客户开始 HBM4 量产。目前 HBM4 的良率与品质已接近处于成熟阶段的 HBM3 水平，当前工作重点是稳步扩充产能。 如前所述，公司也已完成 HBM4E 的客户送样。该产品采用技术成熟度与量产稳定性均经验证的优化制造工艺，开发按路线图顺利推进，目标于 2027 年开始批量生产。 公司的准备不止于此，也在前瞻性布局下一代技术。除混合键合外，公司正在开发用于 HBM5 等未来产品散热的技术：该技术将散热元件集成到封装内部，预计可将热阻降低 30% 以上，从而在高性能、高密度的 AI 环境中提升系统稳定性与运行效率。（该技术缩写在转录中读作 “IBM”，此处按其功能描述表述。） 随着 AI 市场持续扩张、AI 加速器在性能与封装上日趋复杂，公司认为客户将更加看重具备经验证的制造能力、品质与可靠供应的合作伙伴。HBM 属高附加值产品，一旦出现品质问题，会给客户带来巨大成本，并对整个系统产生广泛影响。 依托与客户的早期共同开发经验及长期战略伙伴关系，公司将持续在正确的时点可靠交付正确的产品，并引领向下一代技术的迁移，以此维持 HBM 市场的领先地位。 问题六：UBS，Nicolas Gaudois 问：2027 年 HBM 价格谈判目前进展如何？能否说明包括 HBM4E 与 HBM4 在内的合同讨论情况以及实际价格展望？ 答：公司正与核心客户就 2027 年的 HBM 供应量与价格进行讨论，在稳固的客户需求支撑下，谈判推进顺利。个别客户的合同条款与价格细节无法披露。 近几个月传统 DRAM 价格大幅上涨，该市场环境可能对 HBM 的价格讨论产生一定影响；但 HBM 价格并非仅由传统 DRAM 价格决定。 与传统 DRAM 相比，HBM 需要投入多得多的资源，包括更多晶圆投片、先进制造工艺、TSV 与封装产能。随着每一代产品演进，客户对性能与品质的要求持续提高，产品开发与认证也日益复杂。 因此，公司的价格讨论会综合考虑一系列因素：传统 DRAM 价格与市场供需、HBM 生产相关的资源与机会成本、技术复杂度，以及产品为客户创造的价值。目标是在引领 AI 生态健康、可持续增长的同时，取得与所提供差异化价值相匹配的合理盈利水平。 依托积累的技术领先优势、成本竞争力、稳定的制造能力，以及与客户之间的信任与协作，公司将通过成功的产品世代迁移与持续的客户价值创造，维持 HBM 业务的稳固盈利能力，并巩固作为 AI 时代与客户共同成长的战略伙伴地位，专注于长期的可持续增长与盈利。 问题七：CLSA Securities Korea，Sanjeev Rana 问：问题关于产能扩张。除近期公布的在韩国的大规模投资外，市场也在讨论向美国、日本等海外扩产。能否详细说明公司在韩国国内与海外的投资战略及方向？ 答：在 AI 时代，仅有技术领先并不足够，能否在正确的时点供应所需数量同样已成为竞争力的关键组成部分。尤其在当前供给极度紧张的时点，为生态系统提供所需的存储产品是供应商的责任。 公司的中长期投资方向是：配合 AI 存储需求适时投资，同时基于业务可行性与投资效率执行资本开支。中长期将通过最大化利用现有生产基地、并在必要处新建基础设施的最优组合，确保追加的制造产能。 在韩国国内，公司将继续把利川与龙仁作为下一代 DRAM 与 AI 存储的核心生产枢纽，同时强化清州在 NAND 与先进封装两方面的制造能力。（转录中此处基地名称缺失或误识，按公司现有生产基地表述。）已公布的大规模投资，也是这一战略的组成部分，用于前瞻性地确保支撑未来需求所需的制造基础与基础设施。 关于未来的生产基地，公司不以国内或海外作区分，基本方向是综合电力供应、水资源与人力、供应链与半导体生态、客户可达性等一系列因素作出最优决策。 需要说明的是，截至目前，除已公布的投资之外并无其他决定。后续公司将继续在恰当时点确保生产基地以响应客户需求，并通过利用现有资产、同时评估新增投资来提升投资效率。 问题八：Daishin Securities，Ryu Hyung-kyun 问：问题关于 NAND。随着推理需求扩张以及 KV 缓存卸载需求快速增加，企业级 SSD 的角色如何变化？能否说明公司在各产品细分上的战略，包括用于替代 HDD 的 QLC SSD，以及基于 SLC 模式的高性能 SSD？这些细分市场的竞争似乎也在加剧。 答：正如提问所观察到的，AI 市场正从以训练为中心转向以推理为中心的环境，NAND 正快速成为 AI 存储层级中的核心部件。因此，以 SSD 为中心的 NAND 需求正快速上升，公司认为这一趋势有望延续。 与此同时，公司认为 AI 存储市场无法用单一技术覆盖：延迟、吞吐、功耗、容量与 TCO 的要求因客户而异。客户所要求的不一定是特定技术或特定介质，关键在于能否可靠地交付每类工作负载所需的性能与响应能力。 因此，公司面向 AI 时代的战略不是在 SLC、TLC、QLC 之间做取舍，而是提供针对每一位客户工作负载定制的最优存储组合。 例如，在 AI 数据湖、HDD 替代等重视存储效率与成本竞争力的应用中，大容量 QLC SSD 可能是最具竞争力的方案，公司正持续强化该细分的产品线。与此同时，公司也在集中开发面向 KV 缓存卸载、近 GPU 存储等新兴应用的 AI 存储解决方案。 SK hynix 并不押注于单一技术，而是通过结合固件、发挥 NAND 自身优势来开发解决方案，为每类客户工作负载交付最高效的性能。由此，公司的产品组合正在多种用途上扩展，包括高性能 TLC SSD、大容量 QLC SSD，以及采用 SLC 模式的高性能 SSD。 最终，在 AI 时代不会由单一 SSD 承担所有工作负载，AI 系统将采用针对各类工作负载优化的存储层级。凭借覆盖上述全部细分的存储产品组合，公司将前瞻性响应 AI 存储不断演进的需求，并为 NAND 业务拓展新的长期增长机会。 问题九：NH Investment & Securities，Ryu Young-ho 问：问题关于市场高度关注的 ADR。目前 ADR 的双向可转换性（fungibility）如何管理？公司未来是否有提高 ADR 存量占比的计划？ 答：自 7 月 30 日起（即公司股票在韩国交易所相关上市程序完成的次日），ADR 可自由转换为普通股；但普通股转换为 ADR 可能因转换流程与转换上限而受到限制。 参考韩国企业 ADR 项目的既有案例，普通股转换为 ADR 可能需要发行人完成一定的监管申报程序，耗时数周。 此外，ADR 存量总数不得超过转换上限；目前该上限设定为 1,779 万股，与本次 ADR 发行的股份数量相同。是否提高 ADR 占比，将在评估相关监管环境及其他因素后再作判断，目前尚无任何决定。 问题十：DS Investment & Securities，Sharon Lee 问：随着近期出售所持铠侠（Kioxia）股份以及 ADR 发行，公司现金头寸显著增加。能否说明公司的资本配置战略？特别是年内是否有追加股东回报的计划？ 答：公司的资本配置战略目前聚焦于三个目标之间的平衡：适时投资以把握 AI 时代的结构性增长机会、维持稳健的财务状况、以及通过股东回报提升股东价值。 关于股东回报，公司清楚市场对此高度关注，目前正在评估追加股东回报的各类方案。但受 ADR 发行相关的监管要求与程序限制，公司无法披露发行文件中未包含的新的重大信息。 因此，关于追加股东回报的形式、规模与时点，目前无法提供具体内容；方案最终确定后，公司计划在年内向市场沟通。 后续，公司将继续适时执行支持增长的投资、维持稳健的财务结构，并推进能够通过可持续现金创造提升股东价值的资本配置战略。 会议至此结束。以上即 SK hynix 2026 年第二季度业绩发布电话会议的全部内容。", "status": "extracted"}, "post:2026-07-29T07-33:35ba406f7be1": {"id": "post:2026-07-29T07-33:35ba406f7be1", "kind": "post", "title": "2026-07-29 07:33", "source_label": "帖子正文", "excerpt": "🔔 观点更新：7月FOMC例会，沃什会“意外加息”吗？我们认为，仍是小概率事件。", "content": "🔔 观点更新：7月FOMC例会，沃什会“意外加息”吗？我们认为，仍是小概率事件。 1. 目前CME FedWatch定价7月FOMC例会加息概率约40%（10bp），完全定价9月之前加息25bp，合计定价年内加息38bp（不足2次）。 2. 原油是近期加息预期回升的主要扰动，但是：1）5年、10年盈亏平衡通胀已回落到2月底水平，5年-5年远期通胀预期（2.25%）虽位于近月高位，但与近年均值水平持平；2）通胀归因更重要（通胀框架小组的主要任务）。打个比方：需求侧通胀是数字“1”，供给侧通胀是数字“0”。由于当前美国通胀压力主要是供给侧（油价+关税）。所以，“按兵不动”仍是最优策略。 3. 意外加息有助于沃什建立“通胀鹰派”的权威、稳定通胀预期，代价是“人为制造的波动”，在当下市场较为脆弱的时候风险不可控。制造市场波动就是制造政策陷阱——是否需要用降息来对冲一次错误的加息？所以，“意外”也需要有基本面条件，而不是为了意外而意外（发布会上，沃什如何合理的解释这次“意外”呢？）。 4. “意外加息”与沟通框架改革的愿景背道而驰——让数据“说话”，减少人为制造的波动。沃什并不反对沟通，...", "publish_time": "2026-07-29 07:33", "tags": ["文字观点"]}, "post:2026-07-29T09-02:7b1b593d06a9": {"id": "post:2026-07-29T09-02:7b1b593d06a9", "kind": "post", "title": "2026-07-29 09:02", "source_label": "帖子正文", "excerpt": "【华泰宏观| 海外每日评论】 数据：美国7月谘商会消费者信心指数由92.2降至90.8，且低于预期的92.3。政策：地缘政治方面，特朗普在白宫会晤内塔尼亚胡，缓和对伊朗动武威胁，为进一步开展外交谈判铺路，不过，伊朗周三亚洲清晨再次对驻中东美军发动导弹袭击，并被美军拦截。", "conten 会回落到 20%以内； （2）美联储降息的速度与空间；（ 3）红利资产本身的基本面变化，如高速公路、高铁等价格体系的修正。我 们仍然看好优质红利资产如皖通高速、京沪高铁等核心资产。 风险分析 高铁建设速度不及预期 近年来高铁建设快速发展的过程中，部分地区存在盲目建设高铁、地铁现象，出现“重高速轻普速、重投 入轻产出”等情况，导致铁路企业面临较大的经营问题，债务压力倍增。若部分建成高铁经营问题较大，或将 导致高铁建设速度放缓，全国高铁组网进程放慢，从而导致全国高铁网络不平衡性持续性超出预期，带来高铁 企业业绩提升放缓。 能源价格大幅提升风险 受国际原油价格波动影响，能源价格存在大幅度上涨的风险。其次，俄乌冲突带来国际能源市场不稳定性 增加，导致国内能源安全保障面临一定压力，能源价格存在大幅提升风险，带来铁路企业成本大幅上涨。 其他运输方式的竞争风险 高速铁路具有准点率高、载客量大、经济舒适、受自然气候影响小等优点。 2016-2019年京沪高铁持续优 化列车开行方案，客座率稳步提高、列车开行质量不断提升，与公路客运、航空客运形成了差异化竞争的局面。 下载日志已记录，仅供内部参考 7 铁路公路 行业动态报告 请务必阅读正文之后的免责条款和声明。 但是，如果未来公路网持续扩张完善、航空客运准点率和服务水平不断提高，仍可能影响旅客出行选择，如果 出现大幅影响旅客周转量的情况，将对公司的经营产生一定负面影响。 清算政策调整的风险 由于铁路行业“全程全网”的业务特点，需要不同铁路运输企业之间相互提供路网服务。为建立铁路运输 企业之间公平、公正、公开的清算秩序，原铁道部、原铁路总公司先后制定了《铁路运输进款清算办法》（铁 财〔2005〕16号）《中国铁路总公司关于明确有关财务清算事项的通知》（铁总财〔 2016〕230号）等相关规 定。2016-2018年，清算政策保持了基本稳定，确保了铁路运输进款清算的顺利进行，京沪高铁也实现了良好 的经济效益。未来随着生产要素价格水平提高、路网服务质量提升、行业特点及供求关系变化，国铁集团清算 项目、清算范围、清算价格可能出现调整，如果出现不利变化，将对公司的经营业绩产生一定影响。 下载日志已记录，仅供内部参考 8 铁路公路 行业动态报告 请务必阅读正文之后的免责条款和声明。 分析师介绍 梁骁 交运行业分析师，南开大学硕士，先后供职于中集集团物流板块、顺丰控股、京东物 流，曾参与撰写《国家多式联运标准修订建议报告》并为交通物流相关十四五规划建 言献策，2022年加入中信建投证券研究发展部，覆盖快递快运 /仓储运输/供应链物流/ 跨境物流/铁路货运/航空物流，具有丰富的交运物流行业研究经验以及资源，擅于把 握和挖掘公司长期价值，工作地北京。 韩军 全球交通运输及全球能源首席分析师，曾供职于上海国际航运研究中心， 3年政府规 划与市场咨询经验，曾负责或参与为交通运输部、上海市交通委、港航企业等提供决 策咨询服务二十余项。10 年交通运输行业证券研究经验，深入覆盖航运、港口、高 铁、快递、物流板块，擅长把握周期性和政策性投资机会。 2021第十九届新财富最 佳分析师交通运输行业第五名。 宗枫 中信建投证券全球能源与运输分析师，长期关注产业周期、资本开支与公司基本面变 化。北京外国语大学金融与英语双学位；复旦大学国际工商管理硕士，并参与麻省理 工学院（MIT）暑期项目。曾就职于德勤中国，担任高级审计员，参与多家大型 A+H 上市公司审计工作；后任职于一级市场风险投资机构，负责早期项目挖掘与投 资决策。此后加入西部证券，从事交通运输行业研究。 下载日志已记录，仅供内部参考 铁路公路 行业动态报告 评级说明 投资评级标准 评级 说明 报告中投资建议涉及的评级标准为报告发布日后 6 个月内的相对市场表现，也即报告发布日后的 6 个月内公司股价（或行业指数）相对同期相关证 券市场代表性指数的涨跌幅作为基准。 A股市场 以沪深300指数作为基准；新三板市场以三板成 指为基准；香港市场以恒生指数作为基准；美国 市场以标普 500 指数为基准。 股票评级 买入 相对涨幅15％以上 增持 相对涨幅5%—15％ 中性 相对涨幅-5%—5％之间 减持 相对跌幅5%—15％ 卖出 相对跌幅15％以上 行业评级 强于大市 相对涨幅10%以上 中性 相对涨幅-10-10%之间 弱于大市 相对跌幅10%以上 分析师声明 本报告署名分析师在此声明：（ i）以勤勉的职业态度、专业审慎的研究方法，使用合法合规的信息，独立、客观地出具本报告 , 结论 不受任何第三方的授意或影响。（ ii）本人不曾因，不因，也将不会因本报告中的具体推荐意见或观点而直接或间接收到任何形式的补 偿。 法律主体说明 本报告由中信建投证券股份有限公司及 /或其附属机构（以 ，⼴东国资 背景提供安全垫。⻛险在于成交80亿天量配合主⼒⼤幅流出9亿，次⽇分化压⼒极⼤，且3天2板位置已 不低。\u0001 巨⼈⽹络（半年报预增+《超⾃然⾏动组》+⼿机游戏，+9.99%，⾸板）成交27.53亿，换⼿5 .56%， 量⽐1.04，开盘24.64元收于26.98元，总市值513亿。10:55封板，⾸板。资⾦⾯主⼒净流⼊3.21亿呈 ⼤额净流⼊态势，DDE散⼾-119.02显⽰散⼾出逃。催化⽅⾯，2026年半年报预增，新游戏《超⾃然⾏ 动组》表现超预期带动业绩增⻓预期，叠加游戏板块整体回暖。⻛险在于⾸板量⽐仅1 .04未显著放 量，游戏流⽔持续性需跟踪验证。\u0001 圣阳股份（液冷储能+算⼒+固态电池，+9.99%，3天2板）成交20.22亿，开盘16.37元收于18.61元， 总市值84亿。13:22封板，3天2板。资⾦⾯主⼒净流⼊0.33亿。催化⽅⾯，液冷储能系统与算⼒基础设 施双概念驱动，固态电池技术路线获政策持续⽀持，叠加⼭东国资背景。⻛险在于3天2板已处⾼位， 液冷储能概念前期涨幅已不⼩，板块轮动较快需注意节奏。\u0001 孚⽇股份（VC涨价+收购硅碳负极+中报预增，+10.00%，5天3板）成交13.63亿，开盘10.79元收于 11.88元。10:26封板，5天3板。催化⽅⾯，VC（维⽣素C）进⼊涨价周期供需格局改善，收购硅碳负 极资产切⼊新能源材料赛道，叠加中报预增及⼭东国资背景，多重利好共振。⻛险在于 5天3板⾼位连 板获利盘积累较多，VC涨价持续性存在不确定性，追⾼需谨慎。\u0001 北汽蓝⾕（L3⾃动驾驶+享界新品+华为合作，+9.96%，⾸板）成交7.29亿，换⼿2.37%，量⽐1.68， 开盘5.22元收于5.74元，总市值365亿。10:13封板，⾸板。资⾦⾯主⼒净流⼊0.76亿，DDE散⼾-43.52 显⽰散⼾出逃。催化⽅⾯，享界品牌新⻋发布在即，L3⾃动驾驶政策加速推进，与华为深度合作⻋型 受到市场关注，叠加北京国资背景。⻛险在于⾸板但前期跌幅较⼤需确认反转，新能源汽⻋⾏业竞争 激烈。\u0001 东百集团（零售+⾸店经济+仓储物流，+9.99%，2天2板）成交10.85亿，换⼿13.75%，量⽐4.14，开 盘8.95元收于9.47元，总市值82亿。9:57较早封板，2天2板。资⾦⾯主⼒净流⼊0.04亿，DDE散⼾ 139.62显⽰散⼾买⼊信号。催化⽅⾯，零售消费板块修复预期升温，⾸店经济政策持续出台，轻资产 扩张模式叠加仓储物流业务提供第⼆增⻓曲线。⻛险在于2天2板短炒⻛格明显，量⽐4 .14异常放量， 且散⼾买⼊较多需警惕情绪退潮。\u0001 华之杰（新能源汽⻋+机器⼈+智能家居，+10.01%，2天2板）成交3.86亿，换⼿23.58%，量⽐1.48， 开盘43.08元收于47.14元，总市值61亿。14:31尾盘封板，2天2板。资⾦⾯主⼒净流⼊0.07亿，DDE散 ⼾-9.19接近平衡。催化⽅⾯，机器⼈概念持续活跃，新能源汽⻋零部件业务稳步增⻓，智能家居产品 线拓展提供成⻓想象。⻛险在于尾盘封板封单偏弱，换⼿23.58%极⾼，筹码交换充分后⽅向选择需关 注。\u0001 恺英⽹络（半年报预增+游戏+AI应⽤，+10.02%，⾸板）成交17.09亿，总市值约200亿。13:04封板， ⾸板。催化⽅⾯，半年报预增超预期，游戏板块情绪整体回暖，公司布局AI+游戏应⽤实现降本增效明 显。⻛险在于游戏板块持续性有待验证，⾸板后获利盘较⼤需注意回调压⼒。\u0001 四、市场挖掘及传⾔补充\u0001 今⽇市场挖掘的：题材信息\u0001 ⼤消费\u0001―\u0001消费⾦融发贷5.24万亿，⼗五五规划锚定服务消费\u0001 中国银⾏业协会7⽉29⽇发布报告，2025年31家消费⾦融公司累计发放贷款5.24万亿元，服务客⼾达 5.81亿⼈次，总资产规模1.48万亿，消费⾦融已成为拉动内需的重要引擎。与此同时，消费\"⼗五五\"规 划提出到2030年社零总额冲刺60万亿，明确收⼊分配改⾰、社保完善和消费环境优化三⼤⽀柱，为中 ⻓期消费升级奠定制度基础。6⽉社零同⽐回正验证修复趋势，⽽公募⼤消费板块重仓⽐例已连续9个 季度降⾄历史低位，意味着机构仓位回补空间充裕。结构上看，服务消费被置于⾸位， AI+消费作为新 业态受政策与资本双重关注，免税渠道、线下零售⻰头有望率先受益于消费提振政策与客流修复共 振。(中国中免，王府井)\u0001 电解液添加剂\u0001―\u0001锂电需求驱动，VC添加剂供需趋紧\u0001 VC（碳酸亚⼄烯酯）作为锂电电解液核⼼添加剂，能够显著提升电池循环寿命和⾼温性能，是⾼性能 锂电池不可或缺的关键材料。随着下半年锂电排产旺季临近，电解液及添加剂需求有望迎来环⽐显著 改善，供需格局趋于紧张。7⽉29⽇盘⾯上，电解液⻰头新宙邦⼤涨5.00%，主⼒资⾦净流⼊⾼达1.38 亿元，永太科技同步上涨1.84%，资⾦抢筹信号明确。永太科技已实现VC与六氟磷酸锂⼀体化布局， 成本优势与供应链稳定性突出；新宙邦作为电解液⾏业⻰头，产能规模与客⼾覆盖占据领先地位，添 加剂景⽓上⾏周期中弹性最为充分。在新能源⻋销量持续增⻓与储能需求爆发的双轮驱动下，V C添加 剂环节的供需⽭盾有望进⼀步放⼤。(永太科技，新宙邦)\u0001 染料/H酸\u0001―\u0001中间体供给缺⼝持续，染料⻰头全⾯受益涨价周期 \u0001 H酸价格从年初4万元/吨飙升⾄7⽉28⽇的10万元/吨，年内涨幅⾼达150%，有效产能缺⼝已超 10%， 供给端持续收紧。还原物⽅⾯，国内仅浙江⻰盛、闰⼟股份、中盛新三家具备产能，供给刚性锁死， 新增产能短期难以投放。分散染料⾏业CR3超过80%，寡头格局赋予⻰头企业极强定价权，涨价值得顺 畅传导。7⽉⾏业已完成两轮集中调价，分散⿊300%累计上调5000元/吨，涨价节奏明显加快。7⽉29 ⽇盘⾯印证了涨价逻辑：闰⼟股份强势涨停（+10%），吉华集团H1净利润预增1259.68%，业绩爆发 ⼒惊⼈。在中间体供给缺⼝短期⽆法缓解、染料寡头协同提价意愿强烈的背景下，染料⻰头有望持续 受益于本轮涨价周期的业绩释放。(闰⼟股份，浙江⻰盛，吉华集团)\u0001 今⽇市场挖掘的：个股消息\u0001 华海药业：【⾸款创新药IL-36单抗获批上市】国内知名药企华海药业7⽉29⽇公告，控股⼦公司华奥 泰⾃主研发的瑞西奇拜单抗注射液(华亦净)获NMPA批准上市，⽤于泛发性脓疱型银屑病(GPP)，系国 内⾸个⾃主研发的IL-36R⼈源化单抗，全球仅勃林格殷格翰同类药上市。研发投⼊约2.59亿元，注册分 类为治疗⽤⽣物制品1类，标志着华海从仿制药向创新药转型升级的重要⾥程碑。\u0001 中红医疗：【H1业绩暴增23倍，⼿套涨价反转】全球丁腈⼿套⻰头中红医疗7⽉28⽇公告H1净利润 1.4-2.1亿，同⽐增⻓2338%-3557%，扣⾮后扭亏为盈增超8-12倍。公司主营⼀次性丁腈⼿套，⽬前满 产满销，受益于⼿套售价上涨带动⽑利率⼤幅提升，原料涨价压⼒完全向下游传导。⾏业景⽓反转信 号明确，7⽉29⽇股价20cm涨停，盈利弹性有望进⼀步释放。\u0001 兆易创新：【实控⼈拟增持+公司回购各不低于10亿元】半导体存储⻰头兆易创新7⽉29⽇公告，实控 ⼈朱⼀明拟增持不低于10亿元，同时提议公司回购A股不低于10亿元并注销。公司Q1营收41.88亿、归 ⺟14.61亿，经营基本⾯稳健。此前5-6⽉减持1111万股(1.58%)总额44亿元引发市场关注，此番增持 +回购注销的组合拳彰显其对公司⻓期价值的坚定信⼼，也体现了对中⼩股东利益的重视。\u0001 中国中免：【H1归⺟增19.5%，海南盈利弹性持续验证】免税⻰头中国中免H1营收275.9亿(-2.0%)， 归⺟31.1亿(+19.5%)，利润逆势增⻓。Q2海南离岛免税销售同增4%，中免Q2海南预计同增 10%左 右，优于⾏业整体表现。海南淡季仍保持韧性增⻓，叠加旺季临近，盈利弹性持续验证。公司作为国 内免税绝对⻰头，受益于消费回流的⻓期趋势，当前估值处于底部区域，被多家机构视为底部配置机 会。\u0001 王府井：【市内免税被低估的第⼆增⻓极】王府井为全国第8个拥有免税牌照的企业，免税经营资质⽆ 类型限制(离岛/⼝岸/市内)，牌照优势突出。万宁王府井国际免税港已开业运营，哈尔滨太平机场免税 店也在筹备中，免税版图持续扩张。公司主营百货零售，近年积极转型布局免税业务。国泰海通商社 研报认为市内免税是被市场低估的第⼆增⻓极，政策潜在放开下公司有望率先受益。\u0001 拉芳家化：【战投企业重组胶原植⼊剂获批，跨界医美】⽇化⻰头拉芳家化正加速跨界医美赛道。其 战投企业肽源⽣物(持股18.78%为第⼆⼤股东)旗下重组III型胶原蛋⽩及透明质酸植⼊剂7⽉29⽇获 NMPA注册证，兼具即时填充及⻓效再⽣效果，⽤于⾯颊细纹等修复，市场前景⼴阔。此前公司还以 1 亿元认购医美国际2141万股，医美赛道布局持续深化，正从传统⽇化向\"⽇化+医美\"双主业转型。\u0001 尚太科技：【旺季将⾄，负极涨价呼之欲出】尚太科技主营⼈造⽯墨负极材料，具备全⼯序/全产线⾃ 主设计能⼒，成本优势显著。7⽉29⽇股价涨5.45%。锂电负极材料⾏业传统旺季将⾄，供需格局持续 改善下涨价预期升温。公司⾃研新型艾奇逊⽯墨化炉，电耗成本⾏业领先，有望在⾏业量价⻬升中充 分受益。储能需求⾼速增⻓也为负极材料带来新增量，下半年景⽓度有望持续⾛⾼。\u0001 亚钾国际：【上半年业 险在于尾盘封板封单偏弱，换⼿23.58%极⾼，筹码交换充分后⽅向选择需关 注。\u0001 恺英⽹络（半年报预增+游戏+AI应⽤，+10.02%，⾸板）成交17.09亿，总市值约200亿。13:04封板， ⾸板。催化⽅⾯，半年报预增超预期，游戏板块情绪整体回暖，公司布局AI+游戏应⽤实现降本增效明 显。⻛险在于游戏板块持续性有待验证，⾸板后获利盘较⼤需注意回调压⼒。\u0001 四、市场挖掘及传⾔补充\u0001 今⽇市场挖掘的：题材信息\u0001 ⼤消费\u0001―\u0001消费⾦融发贷5.24万亿，⼗五五规划锚定服务消费\u0001 中国银⾏业协会7⽉29⽇发布报告，2025年31家消费⾦融公司累计发放贷款5.24万亿元，服务客⼾达 5.81亿⼈次，总资产规模1.48万亿，消费⾦融已成为拉动内需的重要引擎。与此同时，消费\"⼗五五\"规 划提出到2030年社零总额冲刺60万亿，明确收⼊分配改⾰、社保完善和消费环境优化三⼤⽀柱，为中 ⻓期消费升级奠定制度基础。6⽉社零同⽐回正验证修复趋势，⽽公募⼤消费板块重仓⽐例已连续9个 季度降⾄历史低位，意味着机构仓位回补空间充裕。结构上看，服务消费被置于⾸位， AI+消费作为新 业态受政策与资本双重关注，免税渠道、线下零售⻰头有望率先受益于消费提振政策与客流修复共 振。(中国中免，王府井)\u0001 电解液添加剂\u0001―\u0001锂电需求驱动，VC添加剂供需趋紧\u0001 VC（碳酸亚⼄烯酯）作为锂电电解液核⼼添加剂，能够显著提升电池循环寿命和⾼温性能，是⾼性能 锂电池不可或缺的关键材料。随着下半年锂电排产旺季临近，电解液及添加剂需求有望迎来环⽐显著 改善，供需格局趋于紧张。7⽉29⽇盘⾯上，电解液⻰头新宙邦⼤涨5.00%，主⼒资⾦净流⼊⾼达1.38 亿元，永太科技同步上涨1.84%，资⾦抢筹信号明确。永太科技已实现VC与六氟磷酸锂⼀体化布局， 成本优势与供应链稳定性突出；新宙邦作为电解液⾏业⻰头，产能规模与客⼾覆盖占据领先地位，添 加剂景⽓上⾏周期中弹性最为充分。在新能源⻋销量持续增⻓与储能需求爆发的双轮驱动下，V C添加 剂环节的供需⽭盾有望进⼀步放⼤。(永太科技，新宙邦)\u0001 染料/H酸\u0001―\u0001中间体供给缺⼝持续，染料⻰头全⾯受益涨价周期 \u0001 H酸价格从年初4万元/吨飙升⾄7⽉28⽇的10万元/吨，年内涨幅⾼达150%，有效产能缺⼝已超 10%， 供给端持续收紧。还原物⽅⾯，国内仅浙江⻰盛、闰⼟股份、中盛新三家具备产能，供给刚性锁死， 新增产能短期难以投放。分散染料⾏业CR3超过80%，寡头格局赋予⻰头企业极强定价权，涨价值得顺 畅传导。7⽉⾏业已完成两轮集中调价，分散⿊300%累计上调5000元/吨，涨价节奏明显加快。7⽉29 ⽇盘⾯印证了涨价逻辑：闰⼟股份强势涨停（+10%），吉华集团H1净利润预增1259.68%，业绩爆发 ⼒惊⼈。在中间体供给缺⼝短期⽆法缓解、染料寡头协同提价意愿强烈的背景下，染料⻰头有望持续 受益于本轮涨价周期的业绩释放。(闰⼟股份，浙江⻰盛，吉华集团)\u0001 今⽇市场挖掘的：个股消息\u0001 华海药业：【⾸款创新药IL-36单抗获批上市】国内知名药企华海药业7⽉29⽇公告，控股⼦公司华奥 泰⾃主研发的瑞西奇拜单抗注射液(华亦净)获NMPA批准上市，⽤于泛发性脓疱型银屑病(GPP)，系国 内⾸个⾃主研发的IL-36R⼈源化单抗，全球仅勃林格殷格翰同类药上市。研发投⼊约2.59亿元，注册分 类为治疗⽤⽣物制品1类，标志着华海从仿制药向创新药转型升级的重要⾥程碑。\u0001 中红医疗：【H1业绩暴增23倍，⼿套涨价反转】全球丁腈⼿套⻰头中红医疗7⽉28⽇公告H1净利润 1.4-2.1亿，同⽐增⻓2338%-3557%，扣⾮后扭亏为盈增超8-12倍。公司主营⼀次性丁腈⼿套，⽬前满 产满销，受益于⼿套售价上涨带动⽑利率⼤幅提升，原料涨价压⼒完全向下游传导。⾏业景⽓反转信 号明确，7⽉29⽇股价20cm涨停，盈利弹性有望进⼀步释放。\u0001 兆易创新：【实控⼈拟增持+公司回购各不低于10亿元】半导体存储⻰头兆易创新7⽉29⽇公告，实控 ⼈朱⼀明拟增持不低于10亿元，同时提议公司回购A股不低于10亿元并注销。公司Q1营收41.88亿、归 ⺟14.61亿，经营基本⾯稳健。此前5-6⽉减持1111万股(1.58%)总额44亿元引发市场关注，此番增持 +回购注销的组合拳彰显其对公司⻓期价值的坚定信⼼，也体现了对中⼩股东利益的重视。\u0001 中国中免：【H1归⺟增19.5%，海南盈利弹性持续验证】免税⻰头中国中免H1营收275.9亿(-2.0%)， 归⺟31.1亿(+19.5%)，利润逆势增⻓。Q2海南离岛免税销售同增4%，中免Q2海南预计同增 10%左 右，优于⾏业整体表现。海南淡季仍保持韧性增⻓，叠加旺季临近，盈利弹性持续验证。公司作为国 内免税绝对⻰头，受益于消费回流的⻓期趋势，当前估值处于底部区域，被多家机构视为底部配置机 会。\u0001 王府井：【市内免税被低估的第⼆增⻓极】王府井为全国第8个拥有免税牌照的企业，免税经营资质⽆ 类型限制(离岛/⼝岸/市内)，牌照优势突出。万宁王府井国际免税港已开业运营，哈尔滨太平机场免税 店也在筹备中，免税版图持续扩张。公司主营百货零售，近年积极转型布局免税业务。国泰海通商社 研报认为市内免税是被市场低估的第⼆增⻓极，政策潜在放开下公司有望率先受益。\u0001 拉芳家化：【战投企业重组胶原植⼊剂获批，跨界医美】⽇化⻰头拉芳家化正加速跨界医美赛道。其 战投企业肽源⽣物(持股18.78%为第⼆⼤股东)旗下重组III型胶原蛋⽩及透明质酸植⼊剂7⽉29⽇获 NMPA注册证，兼具即时填充及⻓效再⽣效果，⽤于⾯颊细纹等修复，市场前景⼴阔。此前公司还以 1 亿元认购医美国际2141万股，医美赛道布局持续深化，正从传统⽇化向\"⽇化+医美\"双主业转型。\u0001 尚太科技：【旺季将⾄，负极涨价呼之欲出】尚太科技主营⼈造⽯墨负极材料，具备全⼯序/全产线⾃ 主设计能⼒，成本优势显著。7⽉29⽇股价涨5.45%。锂电负极材料⾏业传统旺季将⾄，供需格局持续 改善下涨价预期升温。公司⾃研新型艾奇逊⽯墨化炉，电耗成本⾏业领先，有望在⾏业量价⻬升中充 分受益。储能需求⾼速增⻓也为负极材料带来新增量，下半年景⽓度有望持续⾛⾼。\u0001 亚钾国际：【上半年业绩⾼速增⻓，钾肥放量可期】亚钾国际为亚洲最⼤钾肥⽣产商之⼀，主营钾肥 开采与⽣产，⽼挝钾肥产能持续放量。上半年业绩预告⾼速增⻓，钾肥作为粮⻝安全关键物资需求刚 性。在全球化肥价格企稳背景下，公司有望受益于钾肥价格回暖。期待下半年产能进⼀步释放及矿产 布局取得新突破，新增产能投放有望驱动业绩持续⾼增，成⻓空间⼴阔。公司近年来持续扩⼤⽼挝钾 肥产能，⻓期成⻓逻辑清晰。\u0001 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408", "status": "extracted"}, "post:2026-07-29T20-15:f9295a05b4e1": {"id": "post:2026-07-29T20-15:f9295a05b4e1", "kind": "post", "title": "2026-07-29 20:15", "source_label": "帖子正文", "excerpt": "大模型Token消耗趋势与AI厂商竞争格局追踪【中泰传媒互联网】 截至2026/7/29，OpenRouter数据显示：Token周调用量较年初增长821%。Top8模型皆为开源模型，其中国产模型占7席。", "content": "大模型Token消耗趋势与AI厂商竞争格局追踪【中泰传媒互联网】 截至2026/7/29，OpenRouter数据显示：Token周调用量较年初增长821%。Top8模型皆为开源模型，其中国产模型占7席。 月之暗面于7月27日正式开源Kimi K3模型权重及技术报告，开源后半小时内登顶Hugging Face趋势榜。 Kimi K3采用自定义许可协议，允许免费商业使用与分发，但对年营收超2000万美元的MaaS服务商要求另行签署商业授权协议（企业内部自用或通过官方渠道使用不受此限）。 硅谷多家机构联名支持开放权重，Anthropic持保留意见并强化安全游说。 ① 英伟达CEO黄仁勋近日发起《开放权重与美国AI领导力》联名信，首批签署方包括英伟达、微软、Meta、IBM、Palantir、Hugging Face及Linux基金会等25家公司和机构，OpenAI、谷歌随后补签，两日内联名企业增至50家； ② Anthropic未签署该公开信，CEO达里奥·阿莫代7月27日发布长文提出防止高性能芯片外流、打击工业规模模型蒸馏、强制模型安全测试三条替代方案。Anthropic正同步加...", "publish_time": "2026-07-29 20:15", "tags": ["文字观点"]}, "post:2026-07-29T08-51:b64b57b1bf3d": {"id": "post:2026-07-29T08-51:b64b57b1bf3d", "kind": "post", "title": "2026-07-29 08:51", "source_label": "帖子正文", "excerpt": "高盛组织三星存储专家闭门交流，最终给出2027年整体存储ASP同比中枢27%-3 驾驶+享界新品+华为合作，+9.96%，⾸板）成交7.29亿，换⼿2.37%，量⽐1.68， 开盘5.22元收于5.74元，总市值365亿。10:13封板，⾸板。资⾦⾯主⼒净流⼊0.76亿，DDE散⼾-43.52 显⽰散⼾出逃。催化⽅⾯，享界品牌新⻋发布在即，L3⾃动驾驶政策加速推进，与华为深度合作⻋型 受到市场关注，叠加北京国资背景。⻛险在于⾸板但前期跌幅较⼤需确认反转，新能源汽⻋⾏业竞争 激烈。\u0001 东百集团（零售+⾸店经济+仓储物流，+9.99%，2天2板）成交10.85亿，换⼿13.75%，量⽐4.14，开 盘8.95元收于9.47元，总市值82亿。9:57较早封板，2天2板。资⾦⾯主⼒净流⼊0.04亿，DDE散⼾ 139.62显⽰散⼾买⼊信号。催化⽅⾯，零售消费板块修复预期升温，⾸店经济政策持续出台，轻资产 扩张模式叠加仓储物流业务提供第⼆增⻓曲线。⻛险在于2天2板短炒⻛格明显，量⽐4 .14异常放量， 且散⼾买⼊较多需警惕情绪退潮。\u0001 华之杰（新能源汽⻋+机器⼈+智能家居，+10.01%，2天2板）成交3.86亿，换⼿23.58%，量⽐1.48， 开盘43.08元收于47.14元，总市值61亿。14:31尾盘封板，2天2板。资⾦⾯主⼒净流⼊0.07亿，DDE散 ⼾-9.19接近平衡。催化⽅⾯，机器⼈概念持续活跃，新能源汽⻋零部件业务稳步增⻓，智能家居产品 线拓展提供成⻓想象。⻛险在于尾盘封板封单偏弱，换⼿23.58%极⾼，筹码交换充分后⽅向选择需关 注。\u0001 恺英⽹络（半年报预增+游戏+AI应⽤，+10.02%，⾸板）成交17.09亿，总市值约200亿。13:04封板， ⾸板。催化⽅⾯，半年报预增超预期，游戏板块情绪整体回暖，公司布局AI+游戏应⽤实现降本增效明 显。⻛险在于游戏板块持续性有待验证，⾸板后获利盘较⼤需注意回调压⼒。\u0001 四、市场挖掘及传⾔补充\u0001 今⽇市场挖掘的：题材信息\u0001 ⼤消费\u0001―\u0001消费⾦融发贷5.24万亿，⼗五五规划锚定服务消费\u0001 中国银⾏业协会7⽉29⽇发布报告，2025年31家消费⾦融公司累计发放贷款5.24万亿元，服务客⼾达 5.81亿⼈次，总资产规模1.48万亿，消费⾦融已成为拉动内需的重要引擎。与此同时，消费\"⼗五五\"规 划提出到2030年社零总额冲刺60万亿，明确收⼊分配改⾰、社保完善和消费环境优化三⼤⽀柱，为中 ⻓期消费升级奠定制度基础。6⽉社零同⽐回正验证修复趋势，⽽公募⼤消费板块重仓⽐例已连续9个 季度降⾄历史低位，意味着机构仓位回补空间充裕。结构上看，服务消费被置于⾸位， AI+消费作为新 业态受政策与资本双重关注，免税渠道、线下零售⻰头有望率先受益于消费提振政策与客流修复共 振。(中国中免，王府井)\u0001 电解液添加剂\u0001―\u0001锂电需求驱动，VC添加剂供需趋紧\u0001 VC（碳酸亚⼄烯酯）作为锂电电解液核⼼添加剂，能够显著提升电池循环寿命和⾼温性能，是⾼性能 锂电池不可或缺的关键材料。随着下半年锂电排产旺季临近，电解液及添加剂需求有望迎来环⽐显著 改善，供需格局趋于紧张。7⽉29⽇盘⾯上，电解液⻰头新宙邦⼤涨5.00%，主⼒资⾦净流⼊⾼达1.38 亿元，永太科技同步上涨1.84%，资⾦抢筹信号明确。永太科技已实现VC与六氟磷酸锂⼀体化布局， 成本优势与供应链稳定性突出；新宙邦作为电解液⾏业⻰头，产能规模与客⼾覆盖占据领先地位，添 加剂景⽓上⾏周期中弹性最为充分。在新能源⻋销量持续增⻓与储能需求爆发的双轮驱动下，V C添加 剂环节的供需⽭盾有望进⼀步放⼤。(永太科技，新宙邦)\u0001 染料/H酸\u0001―\u0001中间体供给缺⼝持续，染料⻰头全⾯受益涨价周期 \u0001 H酸价格从年初4万元/吨飙升⾄7⽉28⽇的10万元/吨，年内涨幅⾼达150%，有效产能缺⼝已超 10%， 供给端持续收紧。还原物⽅⾯，国内仅浙江⻰盛、闰⼟股份、中盛新三家具备产能，供给刚性锁死， 新增产能短期难以投放。分散染料⾏业CR3超过80%，寡头格局赋予⻰头企业极强定价权，涨价值得顺 畅传导。7⽉⾏业已完成两轮集中调价，分散⿊300%累计上调5000元/吨，涨价节奏明显加快。7⽉29 ⽇盘⾯印证了涨价逻辑：闰⼟股份强势涨停（+10%），吉华集团H1净利润预增1259.68%，业绩爆发 ⼒惊⼈。在中间体供给缺⼝短期⽆法缓解、染料寡头协同提价意愿强烈的背景下，染料⻰头有望持续 受益于本轮涨价周期的业绩释放。(闰⼟股份，浙江⻰盛，吉华集团)\u0001 今⽇市场挖掘的：个股消息\u0001 华海药业：【⾸款创新药IL-36单抗获批上市】国内知名药企华海药业7⽉29⽇公告，控股⼦公司华奥 泰⾃主研发的瑞西奇拜单抗注射液(华亦净)获NMPA批准上市，⽤于泛发性脓疱型银屑病(GPP)，系国 内⾸个⾃主研发的IL-36R⼈源化单抗，全球仅勃林格殷格翰同类药上市。研发投⼊约2.59亿元，注册分 类为治疗⽤⽣物制品1类，标志着华海从仿制药向创新药转型升级的重要⾥程碑。\u0001 中红医疗：【H1业绩暴增23倍，⼿套涨价反转】全球丁腈⼿套⻰头中红医疗7⽉28⽇公告H1净利润 1.4-2.1亿，同⽐增⻓2338%-3557%，扣⾮后扭亏为盈增超8-12倍。公司主营⼀次性丁腈⼿套，⽬前满 产满销，受益于⼿套售价上涨带动⽑利率⼤幅提升，原料涨价压⼒完全向下游传导。⾏业景⽓反转信 号明确，7⽉29⽇股价20cm涨停，盈利弹性有望进⼀步释放。\u0001 兆易创新：【实控⼈拟增持+公司回购各不低于10亿元】半导体存储⻰头兆易创新7⽉29⽇公告，实控 ⼈朱⼀明拟增持不低于10亿元，同时提议公司回购A股不低于10亿元并注销。公司Q1营收41.88亿、归 ⺟14.61亿，经营基本⾯稳健。此前5-6⽉减持1111万股(1.58%)总额44亿元引发市场关注，此番增持 +回购注销的组合拳彰显其对公司⻓期价值的坚定信⼼，也体现了对中⼩股东利益的重视。\u0001 中国中免：【H1归⺟增19.5%，海南盈利弹性持续验证】免税⻰头中国中免H1营收275.9亿(-2.0%)， 归⺟31.1亿(+19.5%)，利润逆势增⻓。Q2海南离岛免税销售同增4%，中免Q2海南预计同增 10%左 右，优于⾏业整体表现。海南淡季仍保持韧性增⻓，叠加旺季临近，盈利弹性持续验证。公司作为国 内免税绝对⻰头，受益于消费回流的⻓期趋势，当前估值处于底部区域，被多家机构视为底部配置机 会。\u0001 王府井：【市内免税被低估的第⼆增⻓极】王府井为全国第8个拥有免税牌照的企业，免税经营资质⽆ 类型限制(离岛/⼝岸/市内)，牌照优势突出。万宁王府井国际免税港已开业运营，哈尔滨太平机场免税 店也在筹备中，免税版图持续扩张。公司主营百货零售，近年积极转型布局免税业务。国泰海通商社 研报认为市内免税是被市场低估的第⼆增⻓极，政策潜在放开下公司有望率先受益。\u0001 拉芳家化：【战投企业重组胶原植⼊剂获批，跨界医美】⽇化⻰头拉芳家化正加速跨界医美赛道。其 战投企业肽源⽣物(持股18.78%为第⼆⼤股东)旗下重组III型胶原蛋⽩及透明质酸植⼊剂7⽉29⽇获 NMPA注册证，兼具即时填充及⻓效再⽣效果，⽤于⾯颊细纹等修复，市场前景⼴阔。此前公司还以 1 亿元认购医美国际2141万股，医美赛道布局持续深化，正从传统⽇化向\"⽇化+医美\"双主业转型。\u0001 尚太科技：【旺季将⾄，负极涨价呼之欲出】尚太科技主营⼈造⽯墨负极材料，具备全⼯序/全产线⾃ 主设计能⼒，成本优势显著。7⽉29⽇股价涨5.45%。锂电负极材料⾏业传统旺季将⾄，供需格局持续 改善下涨价预期升温。公司⾃研新型艾奇逊⽯墨化炉，电耗成本⾏业领先，有望在⾏业量价⻬升中充 分受益。储能需求⾼速增⻓也为负极材料带来新增量，下半年景⽓度有望持续⾛⾼。\u0001 亚钾国际：【上半年业绩⾼速增⻓，钾肥放量可期】亚钾国际为亚洲最⼤钾肥⽣产商之⼀，主营钾肥 开采与⽣产，⽼挝钾肥产能持续放量。上半年业绩预告⾼速增⻓，钾肥作为粮⻝安全关键物资需求刚 性。在全球化肥价格企稳背景下，公司有望受益于钾肥价格回暖。期待下半年产能进⼀步释放及矿产 布局取得新突破，新增产能投放有望驱动业绩持续⾼增，成⻓空间⼴阔。公司近年来持续扩⼤⽼挝钾 肥产能，⻓期成⻓逻辑清晰。\u0001 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408", "status": "extracted"}, "post:2026-07-29T12-39:f5db38ee7f7e": {"id": "post:2026-07-29T12-39:f5db38ee7f7e", "kind": "post", "title": "2026-07-29 12:39", "source_label": "帖子正文", "excerpt": "🚀🚀【中泰机械|东方电热】：主业业绩反转，机器人液冷散热步入放量阶段#主业业绩：24-25年受光伏设备景气下行拖累，业绩下滑，25年光伏业务影响出清，当年为业绩低点。26年开始新能源车热管理客户（零跑、吉利等）放量，叠加特斯拉大圆柱电池预镀镍材料（国内独供）放量，业绩反转即将到来！", "content": "🚀🚀【中泰机械|东方电热】：主业业绩反转，机器人液冷散热步入放量阶段#主业业绩：24-25年受光伏设备景气下行拖累，业绩下滑，25年光伏业务影响出清，当年为业绩低点。26年开始新能源车热管理客户（零跑、吉利等）放量，叠 3cstrong>德才股份火山引擎信控额度升至5000万元，AI漫剧Agent年化模型采购规模可接近6亿元，AI算力需求持续强化。\u003c/strong>（来源：太阳【国金计算机&amp;科技】德才股份帖子，7月28日补充协议）\u003c/li>\n\u003cli>\u003cstrong>中际旭创提议40-80亿元回购，明确否认2027年1.6T光模块价格降至600美元的传闻，光通信板块调整后获多家券商坚定看好。\u003c/strong>（来源：天风通信帖子、长江通信帖子）\u003c/li>\n\u003cli>\u003cstrong>SK海力士2026Q2业绩低于市场预期，但AI基础设施投资扩张带来价格上行趋势延续，DRAM与NAND再度涨价。\u003c/strong>（来源：SKhynix-2026Q2业绩说明会电话会议纪要附件、花旗评论帖子）\u003c/li>\n\u003cli>\u003cstrong>锂电8月排产环比增10%步入旺季，乘用车内需触底向上+出口高景气，新能源产业链涨价预期升温。\u003c/strong>（来源：锂电8月预排产帖子、广发汽车帖子）\u003c/li>\n\u003cli>\u003cstrong>7月FOMC例会“意外加息”仍为小概率事件，美国7月谘商会消费者信心指数下滑至90.8。\u003c/strong>（来源：观点更新帖子、华泰宏观海外每日评论帖子）\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>主线一：AI算力/大模型——信控额度提升与大规模资本开支印证算力旺盛需求\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：德才股份与火山引擎签署补充协议，将奇想无限火山引擎信控额度自2,000万元提升至5,000万元，账期30日，若按月持续滚动使用，对应年化模型服务采购规模理论上可接近6亿元。公司自研AI漫剧Agent已实现全流程自动化，具备专属Token资源包、GPU算力池等专属权限，为Agent业务快速放量提供保障。（来源：太阳【国金计算机&amp;科技】德才股份帖子）\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：Ilya创立的AI实验室SSI获英伟达50亿美元战略投资；英伟达签署最高500亿美元德州大型数据中心长期租赁协议锁定电力资源。（来源：AI算力链日报帖子、X平台消息）\u003c/li>\n\u003cli>\u003cstrong>对应证据来源\u003c/strong>：08:51 德才股份帖子；09:09 AI算力链日报帖子；22:44 hcjsj. AI日报；20:15 中泰传媒Token消耗追踪帖子。\u003c/li>\n\u003c/ul>\n\u003ch3>主线二：光通信/CPO——降价谣言被击破，龙头回购彰显信心\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：近期光通信板块受外围市场扰动及1.6T光模块价格大幅下降传闻影响明显回调，头部券商从多角度坚定看好长期前景与空间，强调AI网络迭代加速、CSP自研ASIC芯片带动光通信需求扩大。（来源：调整之下坚定看好光通信帖子）\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：中际旭创董事长提议回购40亿-80亿元股份，价格上限为前30个交易日均价的150%；公司明确否认“2027年1.6T光模块价格降至600美元甚至更低”的传闻，行业未出现恶性价格竞争。（来源：天风通信帖子、长江通信帖子、光模块行业更新帖子）\u003c/li>\n\u003cli>\u003cstrong>对应证据来源\u003c/strong>：07:33 调整之下坚定看好光通信帖子；17:19 天风通信帖子；07:53 长江通信帖子；08:55 光模块行业更新帖子。\u003c/li>\n\u003c/ul>\n\u003ch3>主线三：半导体/先进封装——存储龙头业绩分化，长鑫纳入MSCI催化国产替代\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：SK海力士2026Q2业绩显示AI基础设施投资扩张带来强劲需求与偏紧供给，DRAM与NAND价格继续上行，但实际业绩落在市场预期下沿，引发对AI热潮放缓的担忧。（来源：SKhynix业绩说明会电话会议纪要附件；花旗评论帖子）\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：MSCI公告长鑫科技因IPO新股上市将被纳入MSCI中国全股票指数，8月10日生效；费城半导体指数跌4.49%，存储ETF跌8.89%。（来源：7月29日股市早报帖子）\u003c/li>\n\u003cli>\u003cstrong>对应证据来源\u003c/strong>：08:18 花旗帖子；07:24 股市早报帖子；14:17 托伦斯帖子；08:51 高盛三星存储帖子。\u003c/li>\n\u003c/ul>\n\u003ch3>主线四：新能源/汽车——锂电旺季排产启动，整车内需出口双受益\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：8月电池及材料整体排产环比1%-10%、同比47%-72%，下游储能需求持续旺盛、动力出口及带电量增长。（来源：锂电8月预排产帖子）\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：广发汽车看好26H2整车贝塔机会，内需触底（中长期换购支撑2100万辆中枢）+出口高景气（26H1新能源出口同比+128%），补贴额度H2预计使用900亿。（来源：广发汽车帖子）\u003c/li>\n\u003cli>\u003cstrong>对应证据来源\u003c/strong>：07:25 锂电8月预排产帖子；12:01 广发汽车帖子；07:33 风格再平衡推荐锂电全赛道帖子。\u003c/li>\n\u003c/ul>\n\u003ch3>主线五：宏观/策略——FOMC加息风险概率偏低，资金高低切换关注消费与医药\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：观点更新认为7月FOMC会议“意外加息”仍是小概率事件，制造市场波动可能制造政策陷阱。（来源：🔔 观点更新帖子）\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：美国7月谘商会消费者信心指数由92.2降至90.8，低于预期；美股涨跌不一，标普涨0.2%、道指涨1.0%、纳指跌0.2%。医药板块受GSK、IQVIA业绩超预期带动表现强势。（来源：华泰宏观海外每日评论帖子、浙商医药帖子）\u003c/li>\n\u003cli>\u003cstrong>对应证据来源\u003c/strong>：07:33 观点更新帖子；09:02 华泰宏观帖子；09:46 浙商医药帖子。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>MLCC涨价潮启动\u003c/strong>：三星电机宣布自8月1日起MLCC全线产品统一涨价30%，太阳诱电确认9月跟进涨价，全球MLCC行业进入全面涨价周期。（来源：20260730 市场逻辑精选附件、AI制造调整-上游原料接棒20260729附件）\u003c/li>\n\u003cli>\u003cstrong>中际旭创40-80亿回购提议\u003c/strong>：公司董事长提议回购股份，价格上限为董事会审议前30个交易日均价的150%，直接回应市场谣言。（来源：长江通信帖子、天风通信帖子）\u003c/li>\n\u003cli>\u003cstrong>长鑫科技纳入MSCI中国全股票指数\u003c/strong>：因IPO新股上市，8月10日正式生效，对应募资580亿扩产DRAM/HBM。（来源：7月29日股市早报帖子）\u003c/li>\n\u003cli>\u003cstrong>SK海力士2026Q2业绩不及预期\u003c/strong>：营业利润落在市场预期区间下限，但AI相关产品涨价趋势延续。（来源：SKhynix业绩纪要附件、花旗评论帖子）\u003c/li>\n\u003cli>\u003cstrong>特朗普政府禁止进口中国新型人形机器人\u003c/strong>：保护美国人工智能发展。（来源：盘前热点事件帖子）\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>7月FOMC决议\u003c/strong>：7月30日凌晨
