ck ideas accor dingly (Tencent, NetEase, Alibaba, VNET, New Oriental (new), Beike (new), JD and MiniMax). Key investor themes/focuses have surrounded: 1) the mixed set up for 3Q results, where we expect soft consumption to weigh on eCom/Ads/Local services growth and see Games/Cloud/Internet verticals as sub-sectors with relatively more defensive/resilient growth drivers; 2) AI cloud growth, where we see potentials for further beat-and-raise on tight compute demand and positive read-across from US hyperscalers (we lift Alibaba Cloud growth to 53% for Sep qtr, prior 50%); yet with investor concerns on sources of capex funding/sustainability of elevated ROICs, 3) intensifying competition between AI models with narrower performance gaps/evolving rhetoric on pacing of the frontier, where cost e fficiencies, financial strength and harness products are becoming more important di fferentiating drivers, 4) the increased focus on AI agent applications around workplace (To-B & To-C) & personal AI assistants (To-C, read-across from recent US players’ new consumer agent launches), with investments into user acquisitions that could drive sustainable data flywheel yet draws questions on ROI/long-term retention, and 5) evolving AI policies/regulations/taxes. Under the backdrop of share price weaknesses year-to-date and post-2Q results, we assess where mega-cap valuations stand vs. past valuation troughs, EPS revision outlook, FCF situation/USD funding needs, and refresh our sub-sector preferences lifting Games & Entertainment to #1, Cloud & Data Centers down to #2, Verticals/Education to #3, eCommerce from #3 to #4, and AI models from #4 to #5. We update our Tencent and Alibaba TP/estimates factoring in AI application investments, and Alibaba’s latest fund raisings as announced by the company. Ronald Keung, CFA +852-2978-0856 | ronald.keung@gs.com Goldman Sachs (Asia) L.L.C. Lincoln Kong, CFA +852-2978-6603 | lincoln.kong@gs.com Goldman Sachs (Asia) L.L.C. Timothy Zhao +852-2978-26 eclines post 2Q results, Exhibit 5 ), key themes/focuses from investors have focused on five key topics: 1. Soft macro and implications for 3Q top line set-up: we note mixed comments on quarter-to-date trends, from weaker travel demand, to continued soft consumer spending and a later Apple product shipment this year to weigh on eCom/ads/local services’ 3Q top line, alongside continued elevated 3Q absolute capex spend quarter-on-quarter from hyperscaler mega-caps. These being said, we expect AI cloud growth and AI cloud margins to be bright spots on strong token demand, elevated AI server rental prices (boosting payback period for GPU-as-a-Service to 2-3 years) and margin boost from CPU/overall cloud price hikes since Apr 2026. We see Games/Cloud/Internet verticals as key sub-sectors with relatively more defensive growth into the 3Q, 4Q set up. 2. AI cloud growth with potential for further beat-and-raise on tight compute demand and read-across from US hyperscalers , yet with concerns on sources of capex funding/when is capex peaking for hyperscalers/sustainability of elevated ROICs. Investor focuses have been on the negative FCF at Alibaba and Tencent in the past quarter, sources of capex funding (given Alibaba and Z.AI’s recent equity fundings) and sustainability of ROIC (the maths in reaching 3-year payback time for Alibaba’s current capex, and sustainability of even shorter payback times for AI-compute focused hyperscalers and neoclouds overseas, referencing recent Communacopia + Technology conference takeaways, summary from James Schneider, summary from Eric Sheridan). 3. Intensifying competition between AI models with nar rower performance gaps/ Shifting discussions about how fast AI technology is advancing where cost efficiencies, financial strength and harness products are becoming more important differentiating drivers. We see a larger step up in R&D needed on post-training given tighter access to Chain-of-Thought data sets, and controlling of the harness/orchestration layer will drive a more sustainable data feedback loop for model improvement and eventual recursive self-improvement. We believe Chinese AI models have reached critical level of intelligence (our earlier China LLM primer) with rising context window and cost e fficiencies that can su fficiently deliver cost-competitive virtual worker/white-collar job tasks, and thus see co-work/virtual employee agents as the key next focuses with rising AI employee penetration by industries (from coding, to increasing focus in finance, legal, accounting and more, Exhibit 42 ). 4. The increased focus on AI agent applications around workplace (To-B & To-C, Exhibit 40 ) & personal AI assistants (To-C, with read-across from recent US players’ new consumer agent launches including Muse from Meta, report link ), with investments into user acquisitions thatcould drive sustainable data flywheel, yet draws questions on ROI/long-term retention . On the enterprise side, we see an ongoing competition between mega-caps for data feedback loop between Tencent’s WorkBuddy, Alibaba’s QwenWork and ByteDance’s Doubao Work. We believe workplace agent products like WorkBuddy and QwenWork are showing resemblance to an eCommerce platforms’ analogy, i.e. building stickiness through a combination of 1P (own model) and 3P o fferings (selection of other models). On the consumer AI agent side, we believe Tencent Weixin’s Xiaowei (that is in pilot testing phase) continues to be the most well positioned given trust, scale, Mini-Program ecosystem, and payment methods are most well embedded within the Weixin ecosystem vs. Doubao/Qwen standalone apps 17 September 2026 3Goldman Sachs Navigating China Internet & AI models c45a43530f604d12bcb9a82b5aa6b9f6 with various relatively segregated ‘walled garden’ ecosystems. 5. Evolving AI policies/regulations/taxes that could determine access to compute/market access in each overseas market and the long-term post-tax pro fit assumptions of internet platforms/AI model companies. We highlight key investors focuses around policy risks on AI model distillation, transactions with US suppliers, access to overseas AI leased compute and high-tech industry preferential tax rates. As highlighted in our earlier report, we note High and New Tech Enterprise (HNTE) status is re-considered/re-applied every three years, whereby most China internet mega-caps will need to seek renewal of HNTE status by 4Q 2026, with some others up for renewal in 2027/2028. There has also been recent concerns around individual income tax on certain assets held in o ffshore trusts and related income/dividend gains (detailed tax types see Exhibit 46 ) that have weighed on recent HK-listed shares, as per press reports . What to do from here? Under the backdrop of share price weaknesses year-to-date and post-2Q results (Exhibit 5 ), we assess where mega-cap valuations stand vs. past valuation troughs (Exhibit 3 ), EPS revision outlook ( Exhibit 1 ), FCF situation/USD funding needs ( Exhibit 4 ), and refresh our sub-sector preferences lifting Games & Entertainment to #1 (Tencent and NetEase), Cloud & Data Centers down to #2 (Alibaba and VNET), lifting Verticals/Education to #3 (from #5, New Oriental (new) and Beike (new)), eCommerce from #3 to #4 (JD), and AI models from #4 to #5 (MiniMax). Tencent with marked improved visibility on its AI stack/positioning across n models/applications over the past 6 months (at 13X 26E P/E, -11% downside to trough valuations), where we see forward EPS revisions should bottom over 2H26, with our trimmed -2%/-5%/0% EPS growth for 3Q26E/4Q26E/FY27E (prior: 4%/0%/5%); with strong core pro fits and unique o ffshore-dominated US$130bn investment portfolio to more than fund near-term elevated capex/prepayments; and with management public comments on no equity raising plans): Despite Tencent’s near-term pro fit growth pressure from the AI investment ramp-up, we believe its year-to-date underperformance already re flects EPS compression/valuation contraction due to concerns about near-term estimate cuts and long-duration AI investments that will take time to prove out. We believe the next Hy model launches, WorkBuddy user retention/paying ratio metrics and Weixin Xiaowei adoption, alongside any renewed commitment to Tencent Cloud as China’s Top 3 hyperscaler will be key share price drivers over the next 6-12 months. We also fine-tune our 2026E-28E net pro fit by -3%~-8%, on the back of continued AI-related investments (e.g. Hunyuan, WorkBuddy, Xiaowei), with our SOTP-based 12-month target price at HK$650 (prior: HK$670). We now estimate 0%/-5% EPS growth for 3Q/4Q26E. Alibaba (at 14X 26E P/E, -16% downside to trough valuations, EPS revision n already bottomed sinc e last quarter, with cloud growth acceler ating; ongoing capex needs exceed OpCF but with management comments of no further equity funding plans within FY27): We believe Alibaba’s results have delivered positive developments including cloud growth as a bright spot, higher certainty on ROIC despite capex uplift, in flection in EPS growth (from Sep-quarter). This was supported by improving quick commerce UE (with halving of losses for FY27E/28E 17 September 2026 4Goldman Sachs Navigating China Internet & AI models c45a43530f604d12bcb9a82b5aa6b9f6 and profit turnaround by FY29E being on track) and increased disclosures that we expect to drive greater appreciation of Alibaba’s SOTP framework around Cloud + T-Head and AI models/applications. We continue to expect Alibaba to deliver a solid EPS recovery of +64%/+33% yoy for FY27E/FY28E (with strong in flection from Sep quarter),driven by continued leadership in its AI + Cloud business in China with further acceleration in cloud growth, and a recovery in overall eCommerce pro fits with narrowing quick commerce losses. We update our estimate for Alibaba, factoring in a faster Sep-quarter cloud growth to 53% (prior: 50%) on strong GPU-as-a-Service & MaaS demand and the recent completed HK$80bn equity raising. We fine-tune our estimates and update our 12-m TP of BABA to US$177/HK$172 (prior: US$186/HK$180) mainly to re flect dilution e ffects from equity raising. We also include our detailed views by company, our sub-sector recap post results and latest monthly top apps tracker in the later sections. We note Weixin time spent growth (+3% yoy) and continued strong Douyin app engagement performance (main app +29% yoy/Lite +28% yoy) with ByteDance’s continued share gain by time spent (see Exhibit 75 ) via short-form video apps (Douyin/Red Fruit) and AIGC applications (Doubao). Exhibit 1: Consensus EPS revision ahead of 3Q results Source: Visible Alpha Consensus Data, Data compiled by Goldman Sachs Global Investment Research 17 September 2026 5Goldman Sachs Navigating China Internet & AI models c45a43530f604d12bcb9a82b5aa6b9f6 Exhibit 2: China Internet key stock ideas by preferred sub-sector: we lay out our refreshed key stock ideas amongst mega-caps, and large/SMID caps Pricing as of Sep 11, 2026 Source: Goldman Sachs Global Investment Research Exhibit 3: We see favorable risk-reward for China internet mega-caps - for upside to our base case 12-month target prices vs. downside implied to Jun-2026 trough & our bear case scenario Upside/downside vs. last close. Our bear case is based on Jun 2026 trough P/E multiples, applied to 2026E EPS (2027E for Meitua n). Trough multiples are 13x for Alibaba, 12x for Tencent, 8x for JD, 15x for Meituan and 7x for PDD. Source: Goldman Sachs Global Investment Research, Bloomberg 17 September 2026 6Goldman Sachs Navigating China Internet & AI models c45a43530f604d12bcb9a82b5aa6b9f6 Exhibit 4: Forward free cash flow estimate revisions (BBG consensus) at Chinese hyperscalers Tencent & Alibaba vs. US peers US$bn Source: Bloomberg 17 September 2026 7Goldman Sachs Navigating China Internet & AI models c45a43530f604d12bcb9a82b5aa6b9f6QQ£º1490929960 Exhibit 5: China Internet: Share price performance and valuation Pricing as of Sep 11 Source: Company data, Goldman Sachs Global Investment Research Exhibit 6: China Internet vs. U.S. Internet: 12-month forward PE valuation: China internet is currently trading at 13X median forward 12-m non-GAAP P/E vs. US at 21X GAAP median) Exhibit 7: GAAP P/E comparison indicates a larger valuation gap between China and US mega-cap internet companies Source: Bloomberg Source: Bloomberg 17 September 2026 8Goldman Sachs Navigating China Internet & AI models c45a43530f604d12bcb9a82b5aa6b9f6 Exhibit 8: China Internet comps table Pricing as of Sep 15, 2026 Target prices on a 12m timeframe. NetEase / NetEase HK - Buy and on APAC conviction list Source: Datastream, Goldman Sachs Global Investment Research 17 September 2026 9Goldman Sachs Navigating China Internet & AI models c45a43530f604d12bcb9a82b5aa6b9f6 1. Soft macro and implications for 3Q top line set-up We note mixed comments on quarter-to-date trends, from weaker travel demand over Jul-Aug (as per Meituan ), to continued soft consumer spending and a later Apple product shipment this year (as per JD), that we expect to weigh on eCom/ads/local services’ 3Q top line, alongside continued elevated 3Q absolute capex spend quarter-on-quarter from hyperscaler mega-caps. These being said, we expect AI cloud growth and AI cloud margins to be bright spots on strong token demand, elevated AI server rental prices (boosting payback period for GPU-as-a-Service to 2-3 years) and margin boost from CPU/overall cloud price hikes since Apr 2026. We see Games/Cloud/Internet verticals as key sub-sectors with relatively more defensive growth into the 3Q and 4Q set up. On earnings, we expect ongoing quick commerce loss reduction (by half year-on-year for Alibaba and JD) to drive faster pro fit growth recovery yoy for transaction platforms over 2H26. 2. Concerns on AI capex funding and timing of peak for hyperscalers We see potential for further beat-and-raise for AI cloud businesses on tight compute demand and read-across from US hyperscalers’ cloud growth acceleration over the past few quarters. Yet we note investor concerns on sources of capex funding and questions on when capex would peak for hyperscalers, in order for the market to see hyperscalers’ improving FCF. There have also been questions on sustainability of elevated ROICs following the signi ficant jump in GPU rental prices ( Exhibit 11 ), which has shortened payback time to 1-3 years for asset owners, but concerns persist in the medium term should supply-demand gradually return to a closer balance. Investors have been focused on the negative FCF at Alibaba and Tencent in the past quarter, sources of capex funding (given Alibaba and Z.AI’s recent equity fundings), and sustainability of ROIC (the math for reaching the 3-year payback time for Alibaba’s current capex, and sustainability of even shorter payback times for AI-compute focused hyperscalers and neoclouds overseas, referencing recent Communacopia + Technology conference takeaways from our US Technology team (links here and here ). Evolving dynamics of chip supply Exhibit 9: Internet sector revenue and net pro fit growth trend Exhibit 10: eCommerce & Local services industry (Alibaba, JD, PDD, Meituan) net pro fit growth trend Source: Company data, Goldman Sachs Global Investment Research Source: Company data, Goldman Sachs Global Investment Research 17 September 2026 10Goldman Sachs Navigating China Internet & AI models c45a43530f604d12bcb9a82b5aa6b9f6 AI capex/infrastructure: Our latest China hyperscaler capex forecasts and capex-to-cloud revenue framework Exhibit 11: B200 spot rental pricing remains relatively stable for the past month US$ per GP", "status": "extracted"}, "post:2026-09-17T08-34:423c8aac15f0": {"id": "post:2026-09-17T08-34:423c8aac15f0", "kind": "post", "title": "2026-09-17 08:34", "source_label": "帖子正文", "excerpt": "0917 DCI更新：高景气背景下招标节奏、客户结构、光纤链路供给多重出现修正 ■6月原本预期Meta会在2026年年中开启规模20‑30亿美元DCI公开招标，整体增量主要由北美四大超大规模云厂商驱动；交付矛盾更多聚焦InP磷化铟、DSP光芯片等相干器件", "content": "0917 DCI更新：高景气背景下招标节奏、客户结构、光纤链路供给多重出现修正 ■6月原本预期Meta会在2026年年中开启规模20‑30亿美元DCI公开招标，整体增量主要由北美四大超大规模云厂商驱动；交付矛盾更多聚焦InP磷化铟、DSP光芯片等相干器件；光纤更多作为配套基础设施，矛盾尚未充分显现，重点跟踪诺基亚Fab2产线建设进度，行业判断2026下半年就会看到头部厂商大规模订单落地与集中交付。 ■9月最新现实：Meta、微软、亚马逊均尚未启动新一轮正式公开招标，相关资本开支预算真实存在，但订单释放形式转变为存量框架协议的订单外放，缺少一次性大额招标事件。 ■目前客户结构发生结构性质变，DCI市场不再只是头部云厂商的专属赛道，NeoCloud中小客户（政府、电力、高校、中小型云厂商）目前占诺基亚DCI订单比重已经接近50%，成为不可忽视的第二增长来源。光纤链路层面分化为暗光纤IRU买断、托管光纤MOFN（亮光纤）两类模式：托管光纤MOFN业务同比增速达到32%，增量绝大部分由NeoCloud客户贡献；暗光纤仍是谷歌这类超大规模云厂首选，客户一次性买断光纤使用权，光模块迭代自主可控。区域需求分布上北美占35%、欧中东占20%，亚太等其余地区需求快速抬头。 #光纤硬约束成为DCI落地的重要卡点：AI分布式算力流量向外溢出，需求从数据中心内部延伸至国家级长途骨干，Verizon与康宁签署2027‑2032年数十亿美元长单，采购8000万英里高密度光纤专门支撑AI算力长途走廊建设。光纤预制棒扩产周期长达18‑24个月，全球出现显著供需缺口，大规模新增产能释放要等到2027下半年；市场虽有存量闲置光纤资源，但AI算力集群需要大量定制化路由，造成路由层面供需错配，高端数据中心用G.657系列特种光纤现货紧缺、交货周期拉长。之前谷歌的DCI订单\"从订单入账、履约到确认收入，中间大概有12个月\"，这主要是因为DCI系统涉及大量施工问题，目前全行业DCI交付周期维持12‑24个月，交付拉长是光芯片器件+光纤链路双重产能不足叠加，并非短期需求脉冲式爆发。诺基亚AI&云客户收入高速增长，但受上游器件、光纤链路双重牵制，订单转化为实际部署的速度显著慢于订单增速。 #InP磷化铟产能格局进一步分化，各家产能弹性拉开差距，光纤‑光器件双重约束共同决定2027年订单兑现能力 ■6月基线：核心焦点仅跟踪诺基亚英飞朗圣何塞Fab2一条6英寸InP产线，市场重点期待该产线2026下半年爬坡，带来诺基亚光网络板块产能释放；对于Ciena、思科更多关注系统整机出货；对上游InP晶圆、PIC芯片分配约束、光纤链路瓶颈认知相对有限。 ■9月最新现实：全行业产能图景更加清晰，设备厂商产能弹性高度取决于是否掌握InP晶圆制造能力，同时还要匹配光纤链路资源；泵浦激光器、InP光芯片紧缺持续恶化，磷化铟光芯片当前需求已经达到现有供给能力的2倍。 #Ciena作为长距DCI龙头，长距市场份额63%，但是没有自建InP晶圆产线，属于Fabless模式，相干PIC、泵浦激光器高度依赖Coherent、Lumentum外采，依靠大客户身份拿到优先器件配额；整机组装产线已经接近饱和，积压订单体量巨大，2027年产能已经被现有长约锁定，即便组装环节可以加班挖潜，但是受上游芯片配额天花板限制，2026‑2027几乎没有新增大规模产能弹性，同时加微WUXL3408还要面临光纤路由资源争夺。 #思科完全Fabless，自身不生产相干DCI系统硬件，业务重心放在城域场景路由器直插ZR/ZR+可插拔方案；城域场景具备一定出货弹性，但长距DCI系统交付能力薄弱，上游器件紧张的时候，配额优先级低于Ciena与诺基亚。城域场景更多搭配托管光纤MOFN模式落地，受益NeoCloud客户扩张。 #诺基亚（英飞朗）是北美DCI设备商当中稀缺具备可扩产6英寸InP自有产线的企业，圣何塞Fab2依托原有厂房存量改造，2026年末才开启小批量产出，2027年进入大规模爬坡阶段；9月新增变量：公司完成收购NXP亚利桑那半导体工厂，改造为第二条InP晶圆产线，短期盘活部分厂房设备先行试产，完整大规模产能预计2028年落地，用来匹配远期DCI需求。但需要注意，诺基亚自有产线只解决InP‑PIC芯片，泵浦激光器仍然需要对外采购，泵浦依旧是公司无法自主的短板；设备出货之后还需要匹配暗/托管光纤资源，光纤路由会成为订单落地的第二道门槛。 ■向上游延伸，核心器件供应商扩产节奏同样偏慢：Coherent德州6英寸InP产线2026Q4实现产能翻倍，2027年底在此基础上再度翻倍；Lumentum北卡全新6英寸工厂要到2028年才开始爬坡；两大头部器件厂订单均已经排到2028年。整条DCI产业链利润分配持续向上游InP/PIC光芯片母材端倾斜，光纤预制棒、特种光纤环节同样量价齐升；2026年内，无论设备厂还是上游芯片、光纤厂，都难以看到量级巨大的产能跃升，真正的供给缓解窗口落在2027‑2028年。 #技术迭代节奏出现递延，1.6T放量延后，3.2T相干、空芯光纤场景定位进一步明确，Fab2爬坡良率为第一跟踪锚点 ■6月基线预期：800G ZR/ZR+作为主力，1.6T相干有望在2026年实现规模出货；CPO共封装光学预期2027年就开始小规模商用；3.2T、空芯光纤更多属于远期技术路线。 ■9月最新现实：800G ZR/ZR+依旧是2026年DCI市场绝对主力产品。OIF在9月正式发布1600ZR行业标准，标志1.6T相干完成标准化，但受DSP、InP光芯片供给约束，实际出货量仅为前期预期的70‑80%，大规模放量明确递延至2027年。 ■3.2T相干（Coherent‑Lite轻相干）的应用定位进一步清晰，随着AI算力集群分散化，跨园区链路拉长至5‑10km，谷歌暗光纤全球互联网络确定导入3.2T相干方案，成为数据中心跨园区互联的关键技术路径。空芯光纤场景边界得到验证：仅5‑20km长途DCI链路可以降低时延、提升GPU训练利用率；500米以内机房机架内部普通硅光性价比占优加微WUXL3408，空芯光纤没有显著收益，空芯光纤更多搭配暗光纤IRU模式部署在超大规模云厂长途干线。 ■投资跟踪核心锚点：诺基亚Fab2产线的爬坡进度与良率水平。Fab2的产出释放节奏，直接决定诺基亚能否兑现谷歌高份额订单、承接NeoCloud客户增量；除光芯片之外，还需要持续跟踪北美暗光纤/托管光纤MOFN的路由供给、特种光纤交付周期，以及泵浦激光器、Coherent/Lumentum的器件配额变化。#文字观点", "publish_time": "2026-09-17 08:34", "tags": ["文字观点"]}, "post:2026-09-17T09-31:5468fbe6a2a9": {"id": "post:2026-09-17T09-31:5468fbe6a2a9", "kind": "post", "title": "2026-09-17 09:31", "source_label": "帖子正文", "excerpt": "TOP11【机会｜均+5.91%】主力资金向半导体与算力硬件集中，产业链分工加速细化 通信、半导体、元件板块主力资金大额净流入，芯片、CPO、AIDC概念领涨。催化来自十五五集成电路政策、海外先进封装产能紧缺、银行万亿级产业融资支持。", "content": "TOP11【机会｜均+5.91%】主力资金向半导体与算力硬件集中，产业链分工加速细化 通信、半导体、元件板块主力资金大额净流入，芯片、CPO、AIDC概念领涨。催化来自十五五集成电路政策、海外先进封装产能紧缺、银行万亿级产业融资支持。行情不再只炒个别龙头，资金沿设备‑材料‑制造‑封测‑模块全产业链扩散，进入产业链纵深定价阶段。 > 核心标的：中芯国际、寒武纪、海光信息、北方华创、中微公司、拓荆科技、华海清科、中科飞测、长鑫科技、有研硅 ### TOP12【机会｜均+2.43%】贵金属与战略小金属同步获资金增配，避险与战略属性叠加 油价和美债收益率上行，避险资金配置黄金；钨等战略金属海外出口管控、海外储备需求抬升，供需持续紧平衡。同时AI服务器PCB钻针、半导体钨耗材带来新增工业需求，战略小金属价值重估。 > 核心标的：四川黄金、赤峰黄金、山东黄金、中金黄金、盛达资源、云南锗业、中钨高新、厦门钨业、章源钨业、翔鹭钨业 ### TOP13【机会｜均+2.33%】朱雀二号与引力一号接连发射成功，千帆星座进入批量组网阶段 48小时内两次重大发射任务，朱雀二号、引力一号完成千帆星座组网发射，是民营火箭承接国家级低轨星座的标志性事件。千帆星座年底计划完成324颗卫星部署；2026被视作可回收火箭拐点，发射成本下行，带动火箭、卫星、地面设备全产业链重估。 > 核心标的：航天电子、航天电器、中国卫星、上海瀚讯、铖昌科技、航天环宇、天银机电、超捷股份、天奥电子、九丰能源 ### TOP14【机会｜均‑1.53%】中东局势推升VLCC运价创历史新高，原油轮运力全面紧缺 红海、霍尔木兹海峡航运风险加剧，VLCC油运即期运价创下历史新高，各航线运价全面暴涨。船舶供给紧张，租家拆分货盘，各类型油轮收益同步抬升，船东盈利弹性处于历史高位。 > 核心标的：中远海能、招商轮船、招商南油、兴通股份、盛航股份、中远海特、宁波海运、中国船舶、亚星锚链、中船防务 ### TOP15【机会｜均‑1.68%】欧洲上半年海上风电新增并网同比增三倍，中国风电装备加速出海 欧洲海上风电装机爆发，整机议价能力修复。国内海上风电规划体量宏大，国 : {"id": "attachment:files/东北证券-鸿富诚(301716)石墨烯导热垫片占领先机，随AI高功率芯片应用放量-260915.pdf", "kind": "attachment", "title": "东北证券-鸿富诚(301716)石墨烯导热垫片占领先机，随AI高功率芯片应用放量-260915", "source_label": "东北证券", "excerpt": "敬请参阅最后一页特别声明 -1-", "content": "敬请参阅最后一页特别声明 -1- 证券研究报告 2026年9月16日 公司研究 先进封装核心卡位，封测龙头稳健成长 ——长电科技（ 600584.SH ）投资价值分析报告 增持（首次） 深耕封测领域， 内生外延 双轮驱动。 长电科技为国内封测领域龙头 ，于 2003年 成功上市。 2015年，公司收购新加坡上市公司星科金朋，助力公司 跃居全球封 测行业第三 ，并增强了先进封装方向的发展。 2024年，公司收购晟碟半导体， 切入存储封测 领域。目前，公司在中国、韩国和新加坡拥有八大生产基地。公司 收入以芯片封测为主， 2025年传统通讯及消费电子领域收入占比为 60%，新兴 领域运算电子、汽车电子等领域提升较快，业务结构持续优化。 2025年公司营 业收入为 388.71亿元，同比增长 8.09%；归母净利润为 15.65亿元，同比下降 2.75%。盈利受传统消费类需 求拖累， 但人工智能、高性能计算等需求保持较强 韧性，有望引领公司未来进入新的发展阶段。 26H1公司实现营业收入 195.27 亿元，同比 增长 4.96 %；归母净利润 8.45亿元，同比 增长 79.41 %。 封测行业受益 于AI产业的快速发展，先进封装已成为重要的产业趋势 。封测为 集成电路产业链上重要的一个环节 ，市场受益于 AI相关需求的增长。 2025年全 球委外封测营收合计 3332亿元，创下史上委外封测最高纪录。 封测行业集中度 较高，本土厂商发展迅猛，中国内地前 五家全球市占率合计为32.6%。先进封 装已成为封测行业未来发展的核心 趋势，其中，芯粒多芯片集成封装为先进封装 的重要技术发展方向， 市场规模由 2019年的 24.9亿美元增长至 2024年的 81.8 亿美元， 年复合增长率为 26.9%。2026年上半年，封测业内 12家头部企业 陆 续宣布投建先进封装产能， 卡位新的产业浪潮 。 新兴领域助力发展，积极布局先进封装领域。 公司在存储封装领域积累深厚， 依 托晟碟以及长电科技多工厂布局的存储类产品业务， 未来有望进一步提升企业级 SSD的市场份额。 汽车电子为公司产品发展的重要方向之一， 上海临港新工厂 投运，聚焦车规级及机器人芯片领域 。XDFOI为公司的高端先进 封装技术平台， 是一种面向 Chiplet的极高密度、多扇出型封装异构集成解决方案 ，应用于高性 能计算、 人工智能、 5G 通信及汽车电子等领域 ，目前已进入稳定量产阶段。 2026 年6月公司公告拟投资 78亿元建设高端先进封测厂，目标完善公司产业布局， 加快高端先进封装的产能布局 。 盈利预测、估值与评级： 长电科技 深耕封测领域， 目前发展 聚焦关键应用领域 ， 业务结构持续优化 。我们预测公司 2026 -2028年营收分别为 421.25、468.56和 524.55亿元，归母净利润分别为 22.45、30.36、38.73亿元，对应 EPS分别为 1.25、1.70、2.16元。我们认为公司竞争力在业内突出，卡位先进封装产业浪潮， 未来发展空间广阔 ，首次覆盖给予“增持”评级。 风险提示： 行业波动风险； 新技术产业化延期风险；竞争加剧风险；汇率风险 。 公司盈利预测与估值简表 指标 2024 2025 2026E 2027E 2028E 营业收入（百万元） 35,962 38,871 42,125 46,856 52,455 营业收入增长率 21.24% 8.09% 8.37% 11.23% 11.95% 归母净利润（百万元） 1,610 1,56 5 2,245 3,036 3,873 归母净利润增长率 9.44% -2.75% 43.43% 35.23% 27.59% EPS（元） 0.90 0.87 1.25 1.70 2.16 ROE（归属母公司 )（摊薄） 5.83% 5.46% 7.32% 9.09% 10.53% P/E 75 77 54 40 31 P/B 4.4 4.2 4.0 3.6 3.3 资料来源： Wind，光大证券研究所预测，股价 时间为 2026 -09-11 当前价： 67.74元 作者 分析师：高宇洋 执业证书编号： S0930526060002 电话： 021- 护集 成电路免受外部环境的损伤；测试包括进入封装前的晶圆测试（ CP）和封装完 成后的成品 测试（ FT），晶圆测试主要检验每个晶粒的电性能，成品测试主要 检验产品的电性能 和功能，目的是将有结构缺陷以及功能、性能不符合要求 的芯 片筛选出来。 半导体封测市场同样受益于 AI相关需求的增长。 根据芯思想研究院的调研， 2025 年全球委外封测营收合计 3332亿元，创下史上委外封测最高纪录。 全球半导体 封测市场在云计算和数据中心需求保持强劲、 消费电子与汽车电子 需求温和复苏 的共同推动下，呈现结构性增长，市场规模进一步提升。 下载日志已记录，仅供内部参考 敬请参阅最后一页特别声明 -10- 证券研究报告 长电科技（ 600584.SH ） 封测行业集中度较高，本土厂商发展迅猛。 封测行业集中度维持高位， 2025年 前三大 OSAT厂商（日月光、安靠科技、长电科技 ）合计市占率超过 52%。其 中长电科技继续位 列全球第三位、中国大陆第一，在先进封装及高端应用领域的 技术积累 与规模优势进一步巩固。 根据总部所在地划分， 前十大委外封测公司中， 中国内地有五家（长电科技、通富微电、华天科技、智路封测、盛合晶微）， 合 计市占率为 32.6%。 图11：2025年全球委外封测前三大厂商份额 资料来源： 芯思想研究院，公司公告 图12：2025年全球委外封测 TOP10(单位：亿元） 资料来源： 芯思想研究院，光大证券研究所 2.3、 先进封装为封测行业未来发展的核心趋势 异构集成芯片为微电 子行业新的技术浪潮，晶圆制造与封测技术深度融合。 近十 年来，前段晶圆制造工艺技术持续进步的难度显著增加，且又受到单芯片集成下 加工尺寸、功耗墙、内存墙等的限制，异构集成芯片能够突破上述限制，被认为 是微电子行业正在经历的第四波重大技术浪潮。在此过程中，晶圆制造技术与封 装技术经历了从相对独立，到出现结合，再到深度融合的过程，芯片进步的因素 也由延续摩尔定律（ More Moore ，即缩小晶体管尺寸）向超越摩尔定律 （More than Moore ，即使用集成芯片设计理念或发展新器件、新材料）转变。 先进封装，即采用先进的 设计思路和先进的集成工艺对芯片进行封装级重构，并 能够有效提高功能密度的封装方式。 在业内，先进封装和传统封装主要以是否采 用引线焊接来区分，传统封装通常采用引线键合的方式实现电气连接， 先进封装 通常采用凸块（ Bump）等键合方式实现电气连接 。传统封装 只关注物理连接层下载日志已记录，仅供内部参考 敬请参阅最后一页特别声明 -11- 证券研究报告 长电科技（ 600584.SH ） 面的优化 ，先进封装更加关注电路系统层面的优化，除常规的保护、嵌套、连接 外，还可起到缩短互联长度、提高互联性能、提升功能密度、实现系统重构等作 用。 完整的先进封装产业链包括中段硅片加工环节和后段先进封装环节。 中段硅片加 工主要包括凸块制造（ Bumping ）、重布线（ RDL）、硅通孔（ TSV）、混合键 合（ Hybrid bonding ）、晶圆测试（ CP）等基础工艺。 后段先进封装主要包括 倒装封装（ FC），晶圆级封装（ WLP）和芯粒多芯片集成 封装等技术类型。 芯粒多芯片集成封装，为先进封装的重要技术发展方向。 不同于应用在单芯片封 装方案中的 FC和WLP， 芯粒多芯片集成封装可以实现多颗 芯片的异构集成或异 质集成。台积电、英特尔、三星电子等全球最领先半导体制造企业正在该技术领 域积极抢攻。芯粒多芯片集成封装主要包括多芯片组装（ MCM）等基板级技术 方案，以及三维芯片集成（ 2.5D/3DIC）、三维封装（ 3D Package ）等晶圆级技 术方案。 图13：芯粒多芯片集成封装的部分代表性技术平台和芯片产品 资料来源： 盛合晶微招股说明书， 灼识咨询 ，光大证券研究所 台积电引领先进封装市场发展。 近年来，台积电每年资本开支中约 10%投入先 进封装、测试、光罩等，目前已形成 2.5D封装 CoWoS、扇出型封装 InFO和 3D封装 SoIC等技术阵列。 CoWoS是一种 2.5D的整合生产技术，由 CoW和 WoS组合而来： CoW就是将芯片堆叠在晶圆上 (Chip -on-Wafer)，而 WoS就是 基板上的晶圆 (Wafer -on-Substrate) ，整合成 CoWoS。CoWoS的核心是将不同 的芯片堆叠在同一片硅中介层实现多颗芯片互联。 SoIC则是一种基于台积电的 CoWoS与多晶圆堆叠 (WoW)封装技术开发的新一代多芯片堆叠技术。 SoIC的推 出也标志着台积电已具备直接为客户生产 3D IC的能力。相较于2.5D封装方案， SoIC的凸块密度更高，传输速度更快，功耗更低。 限。 📝整体来看，本次结果相比我们经济学家的基准预期偏鹰，但和市场大多数人的预期相差不大。考虑到今年支持加息 2 次的参会者占比很高，同时有 8 份预测认为 2027 年利率区间在 4.25%-4.5%，整体预期略微偏鹰。当然，本次释放的鹰派程度不及上周欧洲央行会议，后者带来的鹰派预期更强。本次结果大概率会让波动率有所回落，正如 Friedrich 在昨日波动率观察报告中所写。但本次会议依旧释放了保持警惕、紧盯通胀的信号，维持了近期美债收益率曲线平坦化的走势。 📈衍生品：⏰万众期待的 FOMC 利率决议公布前，早盘波动率保持相对稳定。市场参与者普遍预期本次加息落地，因此资金交易节奏偏慢。早盘 VIX 期权平稳到期，1 个月方差波动率回落至 16.79，美联储决议落地前波动率曲面几乎没有变动。 💹到下午决议公布时段，市场出现买入 IWM 罗素 2000 月末看涨期权的资金，同时也有资金采用看涨期权价差结构买入 GLD 黄金期权，行权周期覆盖 9 月至次年 1 月。这笔交易可以拆成两层逻辑：9 月到期看涨期权押注黄金在 FOMC 决议后上涨；而 12 月、次年 1 月的远期看涨期权，则押注金价持续突破上行。 ⚠️临近收盘，市场没有出现恐慌情绪，看跌跨式策略没有兑现下行收益，固定行权价波动率整体回落，波动率偏度出现买盘。交易商大量的多头伽马敞口集中在上方，除非出现利好地缘消息，否则很难看到指数大幅反弹。本周剩余时间标普 500 跨式期权隐含波动率为 1.07%。（TY Shayna Peart）#文字观点", "publish_time": "2026-09-17 07:59", "tags": ["交易台", "文字观点"]}, "post:2026-09-17T08-39:9fac9651e12f": {"id": "post:2026-09-17T08-39:9fac9651e12f", "kind": "post", "title": "2026-09-17 08:39", "source_label": "帖子正文", "excerpt": "【国海资产配置】专家会议纪要：周期中段的加息与长端利率走向 🔹美国宏观：就业边际复苏，通胀的分歧在于已公布数据与前瞻风险的视角差异 1️⃣就业边际改善的趋势基本成立：过去三个月平均新增就业约7万人，略高于维持失业率稳定所需的0-5万人；工业部门、临时帮助服务等周期敏感行业出现改善，就业改善的覆盖广度", "content": "【国海资产配置】专家会议纪要：周期中段的加息与长端利率走向 🔹美国宏观：就业边际复苏，通胀的分歧在于已公布数据与前瞻风险的视角差异 1️⃣就业边际改善的趋势基本成立：过去三个月平均新增就业约7万人，略高于维持失业率稳定所需的0-5万人；工业部门、临时帮助服务等周期敏感行业出现改善，就业改善的覆盖广度也较半年、一年前回暖。 2️⃣通胀分歧源于视角差异：基于已公布数据，核心通胀环比温和、油价传导效应有限，超预期项为高波动分项，不构成硬性加息条件；前瞻视角下，高油价持续抬升居民通胀预期风险，通胀分布右移、尾部风险上行，政策需提前应对。 🔹FOMC：倾向尽早完成预防性加息，点阵图是核心观察点 1️⃣专家预测的基准情景为9月、10月、12月连续加息，尽早完成75bp以上的预防性紧缩，2027年暂时按兵不动。相较市场今年两次、明年两次的预期，更倾向于前置完成加息。当前就业尚可、AI资本开支对利率敏感度较低，及早行动的经济成本相对可控，若拖延至通胀风险兑现，后续可能需要更大幅度紧缩。 2️⃣资产交易需结合点阵图与记者会：点阵图主要决定利率路径，记者会更多影响政策不确定性。 ⭐大类资产表现推演：鸽派点阵图（年内1-2次，明年不动或者降息）＋鹰派记者，风险资产、长久期债券、贵金属、商品可以同步受益；鹰派点阵图（年内3次以上、明年继续加息）＋鸽派记者会容易引发股债双杀，贵金属方面，加息预期抬升和不确定性抬升两股力量互相博弈，行情方向难以确定；双鹰可能利好超长债、压制股票与贵金属；双鸽更利好贵金属，长端利率反而可能因通胀担忧而上行。 🔹对历史周期中段加息的复盘：分为确认型和追赶型，本轮偏向确认型 1️⃣周期定义与样本：加息前为预防性降息、未发生实际衰退，经济扩张中段重启加息；1930 年代以来共8个案例，2000年后无同类周期。 2️⃣两类加息路径：追赶型加息（60-70 年代）通胀高位启动，加息幅度200-1500bp，股市多数负收益；确认型加息（80-90年代）通胀可控，收回预防性宽松，加息幅度 25-330bp、周期中位数9个月，股市多数正收益。 3️⃣本轮定性：更偏向确认型加息，及时收紧可控制总幅度与市场冲击，拖延则通胀风险与加息成本同步放大。 4️⃣资产历史规律：美债多数呈熊平形态；美股表现分化，确认型显著强于追赶型；美元黄金无稳定规律，若加息能够跑赢通胀、美国实际利率保持高位，且非美经济体承受更大冲击，则更利好美元、压制黄金，若美国承担更多经济代价、政策执行摇摆，则黄金更占优。 🔹大类资产总结：短期风险资产仍有支撑，中期风险窗口或在明年下半年 1️⃣美股：未来6-9个月衰退风险偏低，指数或震荡走高，创新高概率仍大；若中期明年下半年PMI见顶回落叠加政策与财政紧缩共振，将迎来考验。 2️⃣美债：参照历史熊平概率高，但可能会因为油价与加息预期分化出现曲线陡峭化扭曲。 3️⃣黄金：未来短期需防范阶段性压力，若9月点阵图偏鹰，美元可能阶段性趋势走强，贵金属则可能承压，直至市场完成对本轮加息周期的充分定价。 详细纪要请私戳～#文字观点", "publish_time": "2026-09-17 08:39", "tags": ["文字观点"]}, "post:2026-09-17T10-27:8ebba2684943": {"id": "post:2026-09-17T10-27:8ebba2684943", "kind": "post", "title": "2026-09-17 10:27", "source_label": "帖子正文", "excerpt": "🧨🧨【9.17更新】国金金融产品研究最新成果/活动/调研，欢迎交流 ———————————————— ‼️🆕让主观插上量化翅膀 因子回测Skills大公开：是否在为验证策略有效性而挠头？为找寻适应环境而苦苦遍历？", "content": "🧨🧨【9.17更新】国金金融产品研究最新成果/活动/调研，欢迎交流 ———————————————— ‼️🆕让主观插上量化翅膀 因子回测Skills大公开：是否在为验证策略有效性而挠头？为找寻适应环境而苦苦遍历？主观策略样本外有效性如何？最新skills让回测唾手可得，一页因子结论卡清晰易懂。我们上门安装agent及skills，满足随时随地回测策略需求，输出因子评估报告、定义因子有效市场情景（高鹤文/李腾飞） ‼️🆕基金经理如是说：30+受调权益基金经理投资展望及西部利得葛山&张昌平/海富通刘海啸&王振遨/中欧柳世庆/富国赵年珅/华富邓翔/嘉合陶棣溦/信诚孙惠成画像（王聃聃） ‼️🆕基金经理如是说：20+重点受调纯债&固收+基金经理画像及方法论，涵盖头部资方重仓产品及小而美产品，包括中欧/富国/南方/天弘/华夏/海富通/鑫元/嘉合/创金/浦银安盛等10余家公司旗下产品（田露露） ‼️🆕可转债量化专题3：完善宏观择时&中观轮动&微观择券三位一体量化框架，并由振幅变化/低波变化/溢价率变化/Vega和Gamma组成绝对收益中观行业轮动新模型（高鹤文） ‼️🆕透视固收+系列专题六-固收+扩张启示录，产品线如何突围：全面复盘固收+扩容周期，拆解K型分化下吸金逻辑，解析机构/个人资金差异，五大产品线全景盘点并附头部机构案例拆解（田露露/刘梦婷） ‼️🆕全类型公募权益持仓高频透视及skill部署：基于卡尔曼滤波及参数结构优化低误差高频测算权益及固收+基金AH股仓位及行业主题配置动向，并实现skills本地部署（冯思诗） ‼️🆕数说公募纯债及固收+&主动权益&QDII基金半年报（刘梦婷&杨舒） ‼️‼️量化私募深度专题-当模型遭遇科技：科技行情下量化私募业绩分化几何；量化私募本轮行情如何应对；结构行情下如何筛选量化私募（洪洋） ‼️‼️公募指增量化基金经理精选系列12：聚焦差异化和策略框架，重点解析南华黄志钢/泓德李子昂/汇添富王星星/建信赵云煜画像，更有全市场量化基金经理可交流（张慧） ‼️‼️打新基金专题：中签率为核、询价率/入围率/测算收益率为辅评估打新能力，叠加底仓门槛&约束/净值收益&回撤/产品类型&规模等，筛选优秀公募打新基金（冯思诗/田露露） ‼️‼️公募港股含QDII及H+A基金策略:掘金科技&资源&红利（杨舒）#文字观点", "publish_time": "2026-09-17 10:27", "tags": ["文字观点"]}, "post:2026-09-17T08-51:abf88ab435ed": {"id": "post:2026-09-17T08-51:abf88ab435ed", "kind": "post", "title": "2026-09-17 08:51", "source_label": "帖子正文", "excerpt": "永臻股份：拟投资5.97亿元建设6万吨成品电池铝箔项目，推进高端铝加工布局9月16日公司公告，拟投资5.97亿元建设“年产6万吨成品电池铝箔项目”，项目拟利用现有厂房进行适应性改造，建设周期预计24个月。电池铝箔是锂离子电池、钠离子电池电极集流体的关键材料之一，锂离子电池出货量稳定增长，钠离子电池拉", "content": "永臻股份：拟投资5.97亿元建设6万吨成品电池铝箔项目，推进高端铝加工布局9月16日公司公告，拟投资5.97亿元建设“年产6万吨成品电池铝箔项目”，项目拟利用现有厂房进行适应性改造，建设周期预计24个月。 电池铝箔是锂离子电池、钠离子电池电极集流体的关键材料之一，锂离子电池出货量稳定增长，钠离子电池拉动电池铝箔单位耗用量攀升，为电池铝箔市场带来增量需求。#公司重点布局10μm及以下高端电池铝箔，面向新能源汽车动力电池、储能电池、钠离子电池及消费电子电池。此外，项目依托芜湖及安徽周边动力电池产业集群（宁德时代、比亚迪、蜂巢能源等），具备稳定的市场消纳基础和销售渠道。 公司持续拓展业务领域，收购捷诺威布局扁挤压铝型材拓展储能电池水冷板、新能源车底护板、5.5G/6G通信天线反射板等市场，#本次投资围绕公司主营铝深加工领域、由传统铝挤压型材向高端铝板带箔产品延伸，有利于优化产品结构、培育新的利润增长点、提升抗周期波动能力和综合竞争实力。公司越南边框基地满产稳定贡献利润，扁挤压产能逐步放量贡献业绩，投资电池铝箔项目进一步提升竞争力，后续若北美客户供货落地带来较大业绩弹性，建议关注。#文字观点", "publish_time": "2026-09-17 08:51", "tags": ["文字观点"]}, "post:2026-09-17T17-57:e7bfa0da66a5": {"id": "post:2026-09-17T17-57:e7bfa0da66a5", "kind": "post", "title": "2026-09-17 17:57", "source_label": "帖子正文", "excerpt": "20260917今日段子汇总 1、华宝股份：公司为国内香精龙头，旗下拥有“喜登”等品牌；下游客户包括调味品、烟草中烟等 2、沈鼓集团：主营重大技术装备研发制造销售及全生命周期服务，产品含大型离心/往复压缩机、核主泵、核二三级泵、常规岛泵，业务划分为能源化工装备、工业服务、战略新兴产业三大板块 3、沃", "content": "20260917今日段子汇总 1、华宝股份：公司为国内香精龙头，旗下拥有“喜登”等品牌；下游客户包括调味品、烟草中烟等 2、沈鼓集团：主营重大技术装备研发制造销售及全生命周期服务，产品含大型离心/往复压缩机、核主泵、核二三级泵、常规岛泵，业务划分为能源化工装备、工业服务、战略新兴产业三大板块 3、沃格光电：公司光模块/CPO玻璃基封装载板已批量送样，与北极雄芯战略合作开发AI芯片玻璃基先进封装 4、中材科技：1、公司自主研发的第一代低介电产品，已成功应用于高端 PCB 领域；2、全资子公司泰山玻纤专业从事玻璃纤维及其制品的研发、制造及销售，拥有超140万吨的玻璃纤维年产能，在玻璃纤维配方、大型玻纤池窑设计、窑炉纯氧燃烧技术等方面拥有核心自主知识产权，居世界领先水平 5、锡华科技：公司主要从事大型高端装备专用部件的研发、制造与销售，产品结构以风电齿轮箱专用部件为主、注塑机厚大专用部件为辅，是全球行业领先、质量可靠、技术卓越的大型高端装备专用部件制造商 6、华瓷股份：公司氧化锆粉体纯度最高可达99.995%，可适配新能源研磨、齿科陶瓷、MLCC等领域，向潮州三环供应的MLCC相关粉体仍处于小量验证阶段 7、中晶科技：半导体硅材料制造商，主要产品为半导体硅片及半导体硅棒，8英寸抛光片项目正按照整体规划在加速推进中 8、内蒙新华：公司是内蒙古规模最大的出版物发行企业，明确以教育服务、文化消费、现代物流为核心，向综合文化服务商转型，提供阅读空间设计、阅读活动策划及阅读课程开发等服务 9、共达电声：1、公司上半年设立全资子公司共达智算，聚焦“AI算力基础设施”，通过联合AIDC共建、算力租赁服务等构建AI算力生态闭环，布局训练服务器、推理服务器等产品，成为公司第二增长曲线；2、公司主营的微型麦克风、扬声器等声学器件可应用于AI手机，为AI手机的语音交互、音频播放等功能提供声学硬件支持 10、中岩大地：公司拟跨界并购PCB刀具企业深圳市鑫寰宇精工科技 11、万向德农：公司是国内采用单倍体育种技术领先供应商 12、世联行：公司专注房地产服务，旗下拥有“红璞公寓”、 “世联空间”、“小样社区”等多个品牌 13、新宏泽：公司主营业务为烟标的设计、生产及销售 14、敦煌种业：国家育繁推一体化企业；上半年净利润同比预增157.1%左右，因“公司持续优化产品营销策略，依托精准市场定位与多渠道推广举措，自有核心优势品种销量稳步攀升” 15、先导基电：公司大股东先导科技集团自有镓、 锗、 铟等稀散金属（产量全球领先） ， 能够提供q -17 08:22", "tags": ["文字观点"]}, "attachment:files/天风证券-安泰科技(000969)三大板块协同增长，高端粉末冶金贡献主要增量-260916.pdf": {"id": "attachment:files/天风证券-安泰科技(000969)三大板块协同增长，高端粉末冶金贡献主要增量-260916.pdf", "kind": "attachment", "title": "天风证券-安泰科技(000969)三大板块协同增长，高端粉末冶金贡献主要增量-260916", "source_label": "天风证券", "excerpt": "公司报告 | 半年报点评 请务必阅读正文之后的信息披露和免责申明 1 安泰科技 （000969）", "content": "公司报告 | 半年报点评 请务必阅读正文之后的信息披露和免责申明 1 安泰科技 （000969） 证券研究报告 2026年09月16日 投资评级 行业 有色金属 /金属与材料 6个月评级 买入（维持评级） 当前价格 17.16元 目标价格 元 基本数据 A股总股本 (百万股 ) 1,050.52 流通 A股股本 (百万股 ) 1,040.79 A股总市值 (百万元 ) 18,026.91 流通 A股市值 (百万元 ) 17,860.00 每股净资产 (元) 5.56 资产负债率 (%) 45.87 一年内最高 /最低(元) 31.12/12.55 作者 胡十尹 分析师 SAC执业证书编号： S1110525010002 hushiyin@tfzq.com 吴亚宁 分析师 SAC执业证书编号： S1110526080003 wuyaning@tfzq.com 资料来源：聚源数据 相关报告 1 《安泰科技 -半年报点评 :核心产业维 持韧性，高端粉体业务强劲增长》 2025-09-09 2 《安泰科技 -年报点评报告 :核心产业 稳中有进，精尖材料平台高质发展》 2025-04-07 3 《安泰科技 -季报点评 :三季报点评： 多领域发展齐头并进》 2024-11-11 股价走势 三大板块协同增长，高端粉末冶金贡献主要增量 业绩：公司发布 2026年中报， 26H1实现营收 51.76亿元，同比 +39.3%；归母净利润 2.44亿 元，同比 +30.1%；扣非净利润 2.34亿元，同比 +39.1%。其中 Q2实现营收 27.73亿元，同比 +43.5%，环比 +15.4%；实现归母净利润 1.44亿元，同比 +37.9%，环比 +45.6%。 三大板块协同增长，高端粉末冶金贡献主要增量 营收端， 26H1公司实现营收 51.76亿元，同比 +39.3%，主要受营业规模增长及产品量价提升 带动。分板块看，高端粉末冶金材料及制品 /先进功能材料及器件 /高品质特钢及焊接材料分 别实现收入 20.64/19.00/ 12.12 亿元，同比 +51.2%/ +32.8%/ +32.0% ， 三大板块均实现较快增长。 其中高端粉末冶金收入占比由 25H1的36.8%提升至 39.9%，成为公司第一大收入来源。 盈利端， 26H1公司实现毛利 8.64亿元，同比 +35.1%；综合毛利率 16.7%，同比 -0.5pct。分板 块看，高端粉末冶金 /先进功能材料及器件 /高品质特钢及焊接材料毛利率分别为 19.2%/ 15.0%/15.1% ，同比 -0.5/-2.6/+2.2pct ，特钢及焊接材料盈利能力改善较为明显。 费用端， 公司期间费用率 10.98%，同比下降 0.48pct，销售及管理费用率有所下降，研发投入维持高 位、财务费用受汇兑收益扰动，研发及财务费用率小幅上升。 现金流方面， 26H1经营活动现金流净额 -2.17亿元，主要系购买商品支出增加；其中 Q2单季 度经营现金流 净额约 2.19亿元，同比 +310.5%，较 Q1由净流出转为净流入，现金流边际明显 改善。 高端粉末冶金多点突破，安泰天龙经营显著改善 高端粉末冶金板块已成为公司最主要的增长来源， 子公司安泰天龙经营明显改善，并持续向 航空航天、核电、高端医疗器械、半导体及泛半导体 等新兴产业赛道 延伸。平面显示用钼及 钼合金靶材、热沉材料等业务持续拓展， 高端 CT靶盘实现小批量供货。随着业务由材料供应 向高端制品及关键部件延伸，公司难熔钨钼领域的技术优势有望进一步转化为产品附加值和 成长空间。 新兴业务方面，公司持续向 PCB/岩板耗材、 核聚变、 一体成型电感、高速数据传输等新场景 拓展，培育多元化增长点。 超硬工具材料推进 PCB/岩板耗材领域国产化替代；特种雾化制粉 业务深耕一体成型电感赛道，开发成功新一代 FeSiCr软磁合金粉及非晶粉，一体成型电感粉 末及磁粉芯销量同比增长 36.47%；MIM 业务持续深耕高端转轴、高速数据传输、汽车三大 核心业务赛道，新增订单同比增长 190%。 盈利预测： 26H1公司三大业务板块均实现较快增长，看好核心优势业务增长与新兴应用逐步 兑现带来的发展空间。 考虑公司订单高速增长，我们上调公司业绩预测， 预计 26-28年公司 归母净利润分别为 4.1/4.6/5.3亿元（26/ 27年前值为3.8/4.0亿元）， 对应 PE分别为 44/39/34x， 维持“买入”评级。 风险提示：市场环境需求不及预期风险；原材料价格波动风险；安全生产风险 ；近期多次盘 中振幅预警， 敬请注意 股价波动风险 。 财务数据和估值 2024 2025 2026E 2027E 2028E 营业收入 (百万元 ) 7,573.29 7,931.53 9,140.05 10,543.63 12,175.54 增长率 (%) (7.50) 4.73 15.24 15.36 15.48 EBITDA (百万元 ) 1,182.02 1,177.34 754.31 804.44 907.67 归属母公司净利润 (百万元 ) 372.40 364.88 413.53 462.28 529.12 增长率 (%) 49.26 (2.02) 13.34 11.79 14.46 EPS(元/股) 0.35 0.35 0.39 0.44 0.50 市盈率 (P/E) 48.42 49.41 43.59 39.00 34.07 市净率 (P/B) 3.26 3.12 3.05 2.95 2.84 市销率 (P/S) 2.38 2.27 1.97 1.71 1.48 EV/EBITDA 8.73 17.48 21.71 20.04 17.41 资料来源： wind，天风证券研究所 -4%14%32%50%68%86%104% 2025-09 2026-01 2026-05 2026-09安泰科技 沪深300下载日志已记录，仅供内部参考 公司报告 | 半年报点评 请务必阅读正文之后的信息披露和免责申明 2 1. 事件：公司发布 2026年中报 业绩：公司发布 2026年中报，26H1实现营收 51.76亿元，同比 +39.3%；归母净利润 2.44 亿元，同比 +30.1%；扣非净利润 2.34亿元，同比 +39.1%。其中 Q2实现营收 27.73亿元， 同比+43.5%，环比 +15.4%；实现归母净利润 1.44亿元，同比 +37.9%，环比 +45.6%。 图1：公司营业收入及同比增速 图2：公司归母净利润 及同比增速 资料来源： Wind，天风证券研究所 资料来源： Wind，天风证券研究所 从收入结构 来看，26H1高端粉末冶金材料及制品 /先进功能材料及器件 /高品质特钢及焊接 材料分别实现营业收入 20.64/19.00/12.12 亿元，同比 +51.2%/+32.8%/+32.0% ，占公司收入 比重分别为 39.9%/36.7%/23.4% 。三大板块均实现较快增长，其中高端粉末冶金增速明显领 先，由第二大业务板块跃升为第一大收入来源 ，增长贡献进一步突出 。 从毛利结构 来看，26H1公司实现毛利约 8.64亿元，同比 +35.1%。其中高端粉末冶金 /先进 功能材料及器件 /高品质特钢及焊接材料分别实现毛利约 3.95/2.85/1.83 亿元，占比分别约 45.8%/33.0%/21.2% 。高端粉末冶金贡献接近公司一半毛利，收入与毛利贡献同步提升，是 本期盈利增长的核心来源；高品质特钢及焊接材料受益于盈利能力改善，毛利增速明显快 于收入。 图3：公司收入结构 图4：公司毛利结构 资料来源： Wind，天风证券研究所 资料来源： Wind，天风证券研究所 利润率方面， 26H1公司综合毛利率 16.69%，同比 -0.52pct；净利率 5.33%，同比 -0.15pct。 费用率方面， 公司期间费用率 10.98%，同比下降 0.48pct，其中销售 /管理 /财务/研发费用 率分别为 1.2%/3.5%/0.3%/5.9%，同比 -0.3pct/ -0.9pct/+0.5pct/+0.2pct ，销售及管理费用率有 所下降，而研发投入维持高位、财务费用 受汇兑收益 扰动，研发及财务费用率小幅上升。 图5：公司毛利率及净利率 图6：公司期间费用 率 49.862.774.181.9 75.779.3 51.8 -10%0%10%20%30%40%50% 0.010.020.030.040.050.060.070.080.090.0 2020 2021 2022 2023 2024 2025 26H1 营业收入（亿元） 同比（右）1.01.72.12.5 65.74%；经营活动产生的现金流量净 额1.26亿元，同比 -59.5%；基本每股收益 0.13元,同比-64.86%；加权 平均净资 产收益率0.26%，同比-5.96pct。 其中：Q2公司实现营业收入 11.34亿元，环比+5.69%，同比+7.73%； 实现归母净利润0.18亿元，环比-69.09%，同比-79.64%；实现扣非 归 母净利润0.19亿元，环比-67.4%，同比-80.68%。 投资要点： ⚫ 新能源汽车及液冷领域收入持续增长 。 2026年上半年公司实现营业收入 22.06亿元，同比 +2.03%，营业收入 同 比略有上升。分产品来看 ，汽车发动机热管理部件 、节能减排部件的 收入 下降，而 汽车新能源热管理部件、 液冷领域热管理部件收入增长 ，公司处 于新旧动能转换 的阶段。传统汽车业务 中，发动机热管理重部件 、发动机 热管理节能减排部件 的营收分别同比下滑 3.35%、8.74%，而新能源汽车 及非车端领域部件 业务高速增长， 营收达 3.80亿元， 同比大幅增长 67.72% ，成为核心增长引擎。 ⚫ 汇兑等因素导致 业绩短期 承压。 2026年上半年公司实现 归母净利润 0.76亿元，同比 -64.02%，其中 Q2单 季归母净利润 0.18亿元，环比下滑 69%，盈利能力进一步承压。利润下 滑主因人民币汇率波动导致财务费用大幅增加 226.26% ，以及原材料价格 高位和行业竞争加剧 。其中， 汇兑损失侵蚀利润 较为明显， 受人民币汇率 波动影响，公司财务费用高达 3169万元，而上年同期为 -2510万元，同比 大幅增长 226.26% ，其中汇兑损失达 2845万元，是利润下滑的最主要原 因。 ⚫ 原材料价格高位以及国内竞争加剧导致 毛利率下滑 。 2026年上半年公司毛利率 为20.49 %，同比 -5.03pct，主要由于上游原材 料价格维持高位，以及国内汽车行业竞争加剧导致产品降价压力增大 ；此 外，尚处放量初期的新能源及非车端业务毛利率相对较低 仅14.18%，其 收入占比提升也对整体毛利率造成一定 影响。2026年上半年公司 净利率为 3.32%，同比 -6.16 pct ；期间费用方面， 2026 年上半年公司期间费用率 16.27 %，同比 +2.6pct，其中销售、管理、研发、财务费用率分别为 1.98%、 6.51%、6.34%、1.44%，分别同比 -0.64、+0.51、+0.13、+2.6pct，财务-21%3%26%49%73%96%119%143% 2025.09 2026.01 2026.05 2026.09飞龙股份 沪深300 9465 仅供内部参考，请勿外传 汽车零部件Ⅱ 第2页 / 共7页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 费用率大幅上升 主要受汇率大幅波动，汇兑损失增加所致 。经营活动产生 的现金流量净额为 1.26亿元，同比下降 59.50%，主要系为应对下半年订 单增长而增加存货储备所致 。 ⚫ 汽车业务：基本盘稳中有调，新能源车端成亮点 。 公司传统汽车业务正经历结构性调整。上半年， 汽车发动机热管理重要部 件（占营收比重达 36.73%）和汽车发动机热管理节能减排部件 （占营收 比重达 43.55%）业务的 营收分别同比下滑 3.35%和8.74%，反映出燃油 车市场萎缩带来的压力。然而，公司在汽车领域的新能源转型成效显著， 并成为稳定基本盘的关键 ，车端新能源业务（电子水泵、电子水阀等）持 续高增，客户已覆盖 奇瑞、理想、 零跑、蔚来、赛力斯、吉利 等主流新能 源车企。同时，公司全球化布局稳步推进， 泰国工厂 已开始生产，主要面 向北美出口 机械水泵、 涡壳等产品，有效对冲关税风险并巩固海外市场 。 ⚫ 液冷业务： 订单饱满，客户突破成果显著 。 公司凭借在汽车热管理领域积累的技术，前瞻性布局 AI服务器、数据中心 等液冷市场，已进入收获期。 公司液冷泵产品覆盖 6W至80kW功率范围 的全系列解决方案，分为 μ平台（ 200W以下） 、 S平台（ 200W -2kW）、 M平台（ 2kW-10kW）和 L平台（ 10kW以上） ，包括节点冷却（ LAAC）、 模块化侧挂式（ Side Car ） 、机架内（ In Rack）及行级（ In Row）CDU液 冷泵应用 。长达 1-2年的客户验证周期和极高的可靠性要求构筑了高行业 壁垒，为公司赢得了宝贵的国产替代窗口期 。 公司目前 在手订单饱满，客户版图全面打开 ，已深度绑定 英维克、台达、 Cooler Master 、施耐德、宝德 等全球主流 CDU厂商，并已进入 HP项目， 以及北美科技巨头的供应链体系 。其中， μ、S、M平台液冷泵终端客户订 单超 50,000台，主要配套 HP项目、亚浩电子、申菱环境、 AVC、宝德、 曙光数创、日本客户等合作伙伴； L平台液冷泵终端客户订单近万台，依 托Cooler Master、台达、施耐德、宝德、英维克、同飞股份、申菱环境、 字节跳动、阿里、腾讯、中国移动、立讯精密、东阳光及日本客户等核心 客户推进项目落地 。 上半年， 非车领域热管理部件产品营收占同期新能源热管理部件产品营收 比例超 10%，占同期总体营收比例超 1%。公司预计， 2026年全年该比例 将超过 5%，占新能源热管理部件营收比例将 超过 30%。下半年液冷业务 将有望进入大规模交付和收入确认阶段，为全年业绩提供强劲增长动力。 ⚫ 多元化场景拓展，打开长期想象空间 。 公司依托热管理底层技术，积极向其他新兴领域拓展，构建 \"汽车+泛工业 \" 双轮驱动格局 。1）PC及消费电子 领域，公司开发 面向 PC场景的小型液 冷泵处于客户对接、方案测试阶段，各类合作项目稳步开展，推动产品产 业化落地 ，有望受益于端侧 AI带来的散热需求增长。 2）AIDC备用电源 领域，利用成熟的机械泵技术，开发出适配柴油发电机组的 90升左右超 大功率机械泵 ，并同步开展 100 升以上规格机械泵的研发工作 ，已获得重 庆康明斯、韩国斗山 等客户的小批量订单。 3 ）机器人与医疗器械 领域，相 关产品处于客户对接和方案验证阶段，为公司储备了远期增长点 。 仅供内部参考，请勿外传 汽车零部件Ⅱ 第3页 / 共7页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 ⚫ 下调公司投资评级 至“增持”。 预计2026年、2027年、2028年公司可实现归母净利润分别为 3.68亿元、 4.86亿元、6.30亿元，对应 EPS分别为0.64元、0.85元、1.10元，对应 PE分别为83.27倍、63.05倍、48.69倍。公司是国内 汽车热管理 领域的 领军企业， 传统汽车业务的稳健经营和全球化布局为公司转型提供了坚实 的安全垫 ，同时拓展应用场景，液冷等新兴领域已实现批量供货， 公司核 心成长逻辑 稳步兑现， 随着下半年液冷产品规模交付，公司业绩有望迎来 拐点。考虑到公司估值水平暂处近年来高位， 下调 公司投资评级 至“增持”。 风险提示： 市场需求不及预期的风险；行业竞争加剧的风险； 国际贸 易环境变化的风险； 汇率波动的风险；原材料价格大幅波动的风险。 2024A 2025A 2026E 2027E 2028E 营业收入（百万元） 4,723 4,545 5,240 6,204 7,449 增长比率（ %） 15.34 -3.77 15.29 18.39 20.08 净利润（百万元） 330 317 368 486 630 增长比率（ %） 25.92 -3.85 16.21 32.08 29.50 每股收益 (元) 0.57 0.55 0.64 0.85 1.10 市盈率 (倍) 93.05 96.78 83.27 63.05 48.69 资料来源：中原证券 研究所，聚源 仅供内部参考，请勿外传 汽车零部件Ⅱ 第4页 / 共7页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 图1：公司营业收入及增速 图2：公司归母净利润及增速 资料来源： Wind，中原证券研究所 资料来源： Wind，中原证券研究所 图3：公司盈利能力（ %） 图4：营业收入季度变化趋势（亿元） 资料来源： Wind，中原证券 研究所 资料来源： Wind，中原证券 研究所 仅供内部参考，请勿外传 汽车零部件Ⅱ 第5页 / 共7页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 图5：公司 PE-Band 资料来源： Wind，中原证券研究所 （2026年9月15日收盘数据） 仅供内部参考，请勿外传 汽车零部件Ⅱ 第6页 / 共7页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 财务报表预测和估值数据汇总 [Table_Finance2] 资产负债表（百万元） 利润表（百万元） 会计年度 2024A 2025A 2026E 2027E 2028E 会计年度 2024A 2025A 2026E 2027E 2028E 流动资产 3,079 3,532 3,648 4,381 5,129 营业收入 4,723 4,545 5,240 6,204 7,449 现金 508 910 666 826 862 营业成本 3,706 3,456 4,102 4,840 5,786 应收票据及应收账款 1,208 1,176 1,295 1,532 2:22", "source_label": "帖子正文", "excerpt": "NPO联盟制定光学生态系统国际标准 光学通信标准峰会就行业升级和近封装光学（NPO）的大规模商业应用达成国际NPO标准共识。光通信和近封装光学的大规模商业应用达成共识，为行业升级奠定基础 随着公司、政府和通信运营商应对投资先进网络技术以应对人工智能（AI）驱动的工作负载不断增加带来的挑战，近期举行的", "content": "NPO联盟制定光学生态系统国际标准 光学通信标准峰会就行业升级和近封装光学（NPO）的大规模商业应用达成国际NPO标准共识。 光通信和近封装光学的大规模商业应用达成共识，为行业升级奠定基础 随着公司、政府和通信运营商应对投资先进网络技术以应对人工智能（AI）驱动的工作负载不断增加带来的挑战，近期举行的近封装光学（NPO）标准产业峰会闭幕时提出，NPO这一基础性技术是未来基础设施中风险更低、投资回报率更高的务实选择。 本次活动由国际光子与电子委员会（iPec）和光互联论坛（OIF）联合主办，重点围绕NPO演进和国际标准制定，议题涵盖生态系统升级和产业链协作。中国信息通信研究院、腾讯、阿里云、百度、华为、Broadcom、Senko、Amphenol和Yamaichi等引领NPO发展的公司和机构参加了演讲。 峰会就NPO国际标准达成共识，为NPO产业升级和大规模商业化应用奠定了该联盟所称的“坚实基础”。 峰会的核心议题是如何应对AI工作负载。随着网络扩展至集群，为光互连创造了机遇；相比之下，电互连由于传输距离较短，正面临达到瓶颈的问题。 华为在会议上表示，在其所称的算力时代，公司竞争的不再只是单个处理单元的计算能力，而是更加关注集群的容量。在这一方面，随着计算集群不断扩展，光通信发挥着重要作用；与此同时，电互连无法完全满足集群快速扩容的需求。 其中强调的关键观点之一是，网络技术行业正从多芯粒解决方案转向集群，以推动“指数级”AI网络的发展。据报道，NPO在多项关键标准方面都是理想的候选技术，具体包括：技术成熟度；扩展速度；可维护性；功耗；延迟。NPO被认为技术成熟、扩展迅速、易于维护、功耗低，并能够提供低延迟通信。 “随着超级交付点（SuperPod）的规模持续扩大，传统光模块正在消耗巨量能源，而共封装光学（CPO）则面临产业链封闭、运维复杂等限制。”中国信息通信研究院（CAICT）技术与标准研究所、iPec副主席赵文宇解释道。 “相比之下，NPO凭借出色的能效、在端口密度方面的良好折中，以及与现有可插拔生态系统高度兼容，预计将在近期成为SuperPod互连的首选方案，并在长期与CPO及其他解决方案共存和共同演进。” 腾讯光网络架构师蒋智斌补充道：“随着SuperPod规模不断扩大，以及GPU和交换芯片的SerDes数据速率不断提升，光互连解决方案将更快地迈向6.4T NPO。” iPec和OIF认为，此次峰会标志着全球NPO行业发展迈入一个里程碑阶段，就国际NPO标准以及标准组织与产业链之间的合作路径达成了共识。他们还认为，联合展出增强了公司生态产品的信心，助力构建开放、繁荣NPO生态系统。 作为一项行动倡议，大会呼吁来自产业界、学界、科研机构和用户群体的NPO利益相关者“携手合作”，制定NPO标准，推动NPO生态系统从“可用”发展到“具备规模化易用性”。他们还表示，展望未来，亟需利用光电协同设计，克服先进封装工艺带来的挑战。 就华为而言，作为其所称的探索最佳NPO互连解决方案或SuperPods的一部分，华为推出了其声称为业界首款高带宽7.2T NPO产品。 据称，该NPO产品在活动上进行了展示，能够提供高带宽、高可靠性和低成本，同时实现低延迟、低功耗。华为称，该NPO是其多年来积累的各种技术的“体现”，包括激光光源、硅光子、电芯片和垂直腔面发射激光器。#文字观点", "publish_time": "2026-09-17 12:22", "tags": ["文字观点"]}, "post:2026-09-17T13-31:39ee4f9a50b9": {"id": "post:2026-09-17T13-31:39ee4f9a50b9", "kind": "post", "title": "2026-09-17 13:31", "source_label": "帖子正文", "excerpt": "【广发通信】源杰科技：CPO光源开启市值新征程我们认为，#公司300mw以上、配套北美GPU大客户的CPO产品的CW激光器即将通过认证，预计27年开始出货，28年有望迎来爆发式增长，开启公司市值新征程 ??", "content": "【广发通信】源杰科技：CPO光源开启市值新征程我们认为，#公司300mw以上、配套北美GPU大客户的CPO产品的CW激光器即将通过认证，预计27年开始出货，28年有望迎来爆发式增长，开启公司市值新征程 ??公司是国内第一的激光器公司，产品升级路径清晰。目前国内激光器公司cw产品出货以70mw为主，配套800G光模块。源杰科技的优势在于#27-28年绑定中际旭创/新易盛两家大客户，而这两家大客户27-28年的800G产品占比大幅减少，取而代之是1.6T和NPO产品占比大幅提升，#推动源杰科技的产品向更高价值量、更高毛利率的100mw-200mw区间升级。同时公司的100G EML也将持续放量，继续推高公司整体asp ??#CPO光源有望打破欧美一家独大局面，成为产业重要供应商。公司300mw以上、用于CPO的CW激光器目前已经在北美GPU龙头客户测试，预计下半年通过认证。300mw以上光源难度高、价值量大，#预计28年有能力大规模出货供应商不超过3家、公司有望成为其中之一的核心供应商，由此带来的收入利润贡献有望超市场预期公司核心增长逻辑是【扩产*产品价值量提升】，且后者更为重要，保证了公司快速脱离低价值量、低壁垒市场，全力保证供不应求的中高端市场供应。#我们认为公司两年内市值应向lumentum市值看齐，目前空间巨大，继续推荐 风险提示：产业发展不及预期恳请继续支持广发通信团队#文字观点", "publish_time": "2026-09-17 13:31", "tags": ["文字观点"]}, "attachment:files/测试设备大厂调研：Bar、Chip 光芯片测试设备订单及扩产，1.6T 采样示波器认证及放量节奏，客户拓展及订单结构.pdf": {"id": "attachment:files/测试设备大厂调研：Bar、Chip 光芯片测试设备订单及扩产，1.6T 采样示波器认证及放量节奏，客户拓展及订单结构.pdf", "kind": "attachment", "title": "测试设备大厂调研：Bar、Chip 光芯片测试设备订单及扩产，1.6T 采样示波器认证及放量节奏，客户拓展及订单结构", "source_label": "其他", "excerpt": "测试设备大厂调研：Bar、Chip光芯片测试设备订单 及扩产，1.6T采样示波器认证及放量节奏，客户拓展 及订单结构 调研覆盖：长光华芯/博通/Coherent/联讯/盛浩/旭创/猎奇等 要点 1、Bar/Chip光芯片测试设备订单及扩产 2、1.6T采样示波器认证及放量节奏 3、客户拓展及订单结构 专家问答正文 请介绍一下公司主要的业务板块以及与华为合作的", "content": "测试设备大厂调研：Bar、Chip光芯片测试设备订单 及扩产，1.6T采样示波器认证及放量节奏，客户拓展 及订单结构 调研覆盖：长光华芯/博通/Coherent/联讯/盛浩/旭创/猎奇等 要点 1、Bar/Chip光芯片测试设备订单及扩产 2、1.6T采样示波器认证及放量节奏 3、客户拓展及订单结构 专家问答正文 请介绍一下公司主要的业务板块以及与华为合作的重点产品品 类？ 公司业务主要分为三大板块：自动化测试设备、可靠性测试设备以及仪器仪表。 •自动化测试设备包括晶圆测试机、芯片测试机和自动化的模组测试机。 •可靠性测试设备主要用于产品研发和出货前的老化测试。 •仪器仪表则涵盖光模块高速信号测试所需的误码仪、眼图仪，以及光衰减器、光功 率计和源表等常规配套仪表。 在与华为的合作中，重点主要集中在自动化测试设备和仪器仪表两大品类。可靠性测试 设备方面的合作相对较少，因为华为在该领域已有较为固定的供应商。 针对华为的业务，自动化测试设备和仪器仪表具体包含哪些产 品？ 提供给华为的自动化测试设备主要用于光芯片领域，具体是在晶圆完成工艺后，对其进 行参数确认、分级和筛选。 仪器仪表方面，主要产品包括误码仪、眼图仪、光功率计、光衰减器和源表。此外，公 司也提供示波器产品，但由于研发进度原因，目前与华为在该产品上的合作并不多。 各业务板块的订单主要对应哪些具体产品和应用？ 1.自动化测试业务：订单主要以光芯片测试设备为主。 2.仪器仪表业务：订单主要来自误码仪、光功率计和光衰减器等产品；市场关注度较 高的示波器产品目前仍处于送样阶段，尚未形成批量销售。 3.可靠性测试业务：主要用于芯片封装后的老化测试，具体包括COC老化、COB老 化以及光模块老化。其中，光模块老化测试设备占比较多，因为它通常作为出货前的全 检环节，例如进行168小时的老化测试。 在光芯片的测试流程中，COC阶段的老化测试是否为全检？ COC阶段的老化测试通常不会进行全检。企业会根据其工艺良品率等因素制定不同的 检验规则。芯片在更前端的晶圆测试和裂片等阶段会进行全检全筛。 由于常规的共晶工艺良品率较高，在COC阶段一般会采取批量抽检的方式。不过，具 体策略因公司和产品而异，但在光模块领域，COC阶段进行全检的情况目前尚未出现。 公司在光芯片测试领域主要提供哪种类型的设备，具体是针对哪 个测试环节？ 公司的光芯片测试设备主要集中在Bar条和Chip两个环节。 晶圆测试机通常适用于垂直发射的激光器，而目前市场主流方案，无论是EML还是 CW激光器，大多采用边发射结构，这种结构无法在晶圆阶段进行测试。因此，设备出 货以Bar条和Chip测试机为主。 Bar条测试和Chip测试分别处于芯片生产的哪个阶段，客户 通常如何选择，其选择主要基于哪些考量？ 在生产流程中，晶圆首先被切割成长条形的Bar，一个Bar条上可能包含几十到上百 个芯片；完成镀膜等工艺后，Bar条再被切割成单个的Chip。 客户通常会在这两个阶段中选择一个进行全检，并辅以部分抽检。选择在哪个工序进行 测试主要取决于客户自身的工艺水平和需求： •如果客户的镀膜和裂解等后续工序良率较高，他们倾向于在Bar条阶段进行全测， 因为Bar条测试机的效率更高，相应的设备投资成本也更低。 •反之，如果工艺良率不稳定，或对芯片品质有疑虑，则会选择在Chip阶段进行全 测。 此外，Bar条测试结果与最终Chip的测试结果存在一定差异，主要因为在Bar条形 态下，芯片的散热会受到周围其他芯片的热影响。但经验丰富的客户能够掌握这种差异 的对应关系，从而选择效率更高的Bar条测试。 主要的大客户有哪些？ 主要客户包括：长光华芯、博通、华为等。此外，激光显示领域的客户也贡献了测试机 收入。其余部分则由众多几百万金额级别的零散客户构成。 长光华芯采购的设备具体是什么类型，是否采购了COC测试 设备？ 博通采购的设备主要用于测试何种芯片，公司是如何获得该海外 客户订单的长光华芯采购的设备主要是自动化测试设备。该公司之前采购过一些可靠性测试设备， 但主要是用于自身研发验证，因为其业务核心是芯片，并不对外提供芯片的可靠性测试 服务。 qq1490929960 长光华芯不采购 COC测试设备 ，其产品出货形态依据下游客户的需求而定，可以是 COC形式，也可以是 Chip形式。如果下游客户自身具备 COC产线，长光华芯则无 需提供经过 COC测试的产品。 ？ 博通采购的设备主要用于测试CW连续光激光器芯片。 公司与博通的接触始于2025年初，当时是通过其国内的代工厂进行采购和验证。2025 年9月‑10月期间，博通验收了最初购买的两台设备。在2026年4‑5月左右， 博通为扩大产能而追加了新的订单。 Coherent是否直接采购了公司的芯片测试设备？ Coherent没有直接采购，而是通过其在国内的代工厂进行采购。公司向他们的代工厂 宁波环球(AOI)出货，该代工厂同时从事芯片和模块的代工业务。 请问公司与Coherent的业务关系是怎样的？ 公司与Coherent的部分业务关系是通过AOI展开的，AOI为Coherent提供芯片代 工服务，其性质类似于白牌生产，因为AOI自身不持有相关IP。这部分代工业务的订 单金额大约在几百万元左右。 除了通过AOI的芯片代工业务，公司与Coherent直接的业务 合作主要包括哪些产品？ 公司向Coherent直接供应的主要产品是用于测试配套的常规仪表，具体包括源表、光 功率计、光衰减器和光开关等。 公司销售给长光华芯、博通等客户的芯片测试设备，其单价以及 测试效率分别是多少？ 这类芯片测试设备的单价大约在100万‑150万元之间。无论是CW还是EML芯 片，在测试阶段主要进行常规的直流测试，不涉及带宽等射频测试，因此价格相近。设 备的平均测试效率业内普遍在每颗芯片8‑12秒。 目前市场上Bar条和Chip这类设备的主要供应商有哪些，彼 此之间是否存在显著的技术差距？ 目前国内主要有几家供应商，包括联讯、公司、河北盛浩以及深圳镭神。从技术角度看， 各家厂商之间并无显著差别。当前限制各家接单能力的主要因素并非技术，而是产能。 只要产能跟得上，就可以承接订单。 影响Bar条和Chip设备产能的核心瓶颈是什么，具体涉及哪 些零部件或环节？ 产能瓶颈主要体现在三个方面： 1.最关键瓶颈：仪表供应，特别是泰克旗下的吉时利品牌的源表以及光谱仪，这两类 仪表在整个行业都处于严重短缺状态。 2.装配环节，包括人员和场地也构成了限制因素。 目前公司已有几十台设备完成组装，但因缺少仪表而无法出货，只能使用有限的几台仪 表在不同设备间轮流进行调试。 公司1.6T示波器的客户送样进展如何？主要面向哪些客户，以 及在国内外客户认证策略上有何不同？ 1.6T示波器已于2026年7月开始向华为送样。目前送样集中在华为，因为在国产供 应链中，华为的认证结果具有标杆效应。一旦通过华为认证，其他国内客户的导入流程 会相对快捷，只需进行测试和价格谈判即可。 相比之下，海外供应链的认证主要看英伟达。由于公司的1.6T产品刚推出样机，目前 尚未有足够信心送样给海外客户。 海外客户的认证特点：认证流程通常只有一次机会，通过则上线，不通过则会被直接 拒绝。加Î¢WUXL3408 华为认证特点： 对国产设备扶持力度较大， 即使首轮测试不通过， 也会提供专业反馈， 指出问题和调试方向，帮助产品持续迭代优化，直至成熟。 因此，公司策略是先通过华为的认证，待产品完善后再向海外客户送样。 既然800G示波器已通过认证，目前是否已经实现规模化出 货？1.6T产品相较于800G产品，在核心芯片上有何区别？ 800G示波器目前没有起量。行业趋势是客户不再新建800G产线，而是直接部署 1.6T产线，因为1.6T设备可以向下兼容800G。 这两款产品最大的区别在于核心芯片。示波器内部最核心的三个部分是：前端的采样保 持芯片(THA或SHA)、根据特定需求设计的贝塞尔滤波器以及用于跨阻的光电转换芯 片。 用于800G和1.6T采样示波器的核心芯片带宽分别是多少？ •800G采样示波器的芯片带宽：32G •1.6T采样示波器的芯片带宽：50G‑55G之间，标称值50G 1.6T采样示波器所使用的核心芯片采购自何处，是否存在供应 链风险？ 该芯片采购自一家美国公司。目前该芯片供应充足，没有供应链问题，因为其在TDR等 用于线缆测试的常规视频行业中也得到广泛应用，因此不存在短缺情况。 800G和1.6T采样示波器的定价策略及市场变化是怎样的？ 800G采样示波器在2025年的定价约为35万元，但到2026年，市场实际成交价 已降至25万元左右，仅售出约十几至二十台。这主要是因为在2025年11月完成验 证后，部分客户下了少量订单，但到2026年1月，市场需求迅速转向1.6T产品。 对于1.6T采样示波器，目前尚未最终定价。 从成本和毛利率角度看，1.6T采样示波器相较于800G产品有 何变化？ 1.6T产品的成本相较于800G有所上升，但增幅不大。作为对比，竞争对手联讯2026 年同类产品的售价在120万‑150万元之间，其毛利率可能更高。 当前采样示波器市场高利润的原因是什么，以及供应端存在哪些 瓶颈？ 市场高利润主要源于供需失衡。在AI光模块需求爆发前，采样示波器是一个非常小众 的产品，例如泰克曾在2020年左右因销量不佳而停产了该产品线。当前，该仪表的主 要应用集中在光模块测试领域。 供应端的瓶颈： 1.研发需要经验丰富的超高速射频工程师，这类人才培养周期长。 2.产品开发不仅需要射频技术，还需要对光通信测试有深入的理解和丰富的经验。 3.下游需求增长迅猛，加剧了供应紧张。 针对1.6T采样示波器的开发进展如何，市场推广的信心怎样 的？ 1.6T产品的开发借鉴了800G产品的成熟经验，因此研发周期显著缩短，从立项到出 样机仅用时约8个月，而800G产品则耗时两年多。 目前已与华为进行了初步的功能测试和技术指标对标，结果显示问题不大，正在进行全 面的功能验证。因此，对该设备的信心较强。 在光模块生产中，示波器的配置比例和使用情况是怎样的？基于 此，如何测算整个行业的市场空间？ 既然测算出的市场规模并不算非常大，为什么公司以及其他竞争 者会选择进入这个领域示波器在生产线上通常按工位配置， 即一个工位一台。 根据测算， 光模块从生产到出货， 平均占用的设备测试时间约为 6‑8分钟。公众号：小 Å£研±¨¼Í要 若以整个行业年产能达到 1.5亿只光模块为基准进行满产效率测算，市场对示波器的 需求量约为 2500台。但考虑到企业通常会预留产能冗余，并且并非所有产能都能满负 荷运转，结合过往经验， 实际设备需求量预计在 2500‑4000台之间。 ？ 这个市场的规模确实不大，这也是泰克等公司此前退出该领域的原因之一。目前市场上 主要参与者较少，包括联讯和公司等几家公司。 尽管市场总额有限，但其核心吸引力在于毛利率极高，远超过实时示波器等其他产品。 面对1.6T产品的订单预期，公司在产能方面有何准备？ 公司的产能规划与具体的产品品类有关： 1.自动化设备：目前没有大规模扩张人员的计划，而是正与华兴源创接洽，探讨吸收 其自动化团队或人员以支持自动化设备的交付。 2.仪表业务：由于涉及较多核心机密，公司选择自主发展并正在扩充人员。不过，作 为核心产品的眼图仪对人员技术要求很高，招聘难度较大，因此人员增长有限。 针对1.6T产品的订单，公司规划的总量是100‑200台，若按每月交付30台的进度， 订单交付周期大约为6‑7个月，因此也不需要招聘大量人员。 公司与旭创之间是否存在核心业务合作？旭创的自动化设备主 要由哪家公司提供？ 公司与旭创有业务往来，但未涉及核心业务，主要合作集中在边缘化的仪表产品。 旭创的自动化设备主要由其关联公司猎奇智能提供。猎奇智能的创始团队源于旭创原设 备科的人员，专注于自动化设备制造。 公司是否有开发下一代示波器的计划？ 开发更高速率的下一代示波器目前没有实际意义。当前1.6T光模块测试所需的示波 器，主要用于测量单通道200G信号，而此前的800G光模块对应的是单通道100G 信号。 根据行业展望，到2030年前，单通道200G的速率不会有大的变动。未来规划的 3.2T、6.4T乃至12.8T光模块，都将基于单通道200G速率进行通道数扩展，而非 提升单通道速率。", "status": "extracted"}, "post:2026-09-17T09-16:faee46c50f7f": {"id": "post:2026-09-17T09-16:faee46c50f7f", "kind": "post", "title": "2026-09-17 09:16", "source_label": "帖子正文", "excerpt": "【中信证券前瞻】NBIS再涨价：算力紧缺仍在延续 NBIS近期通知客户，拟从10月1日起再次上调按需GPU价格：H100 $3.85→$4.50/小时（+17%），H200 $4.50→$5.40（+20%），B200 $7.15→$8.50（+19%），B300 $7.85→$9.50（+21%）", "content": "【中信证券前瞻】NBIS再涨价：算力紧缺仍在延续 NBIS近期通知客户，拟从10月1日起再次上调按需GPU价格：H100 $3.85→$4.50/小时（+17%），H200 $4.50→$5.40（+20%），B200 $7.15→$8.50（+19%），B300 $7.85→$9.50（+21%）。 涨价之后需求依然没有明显下降。公司此前表示，手动连续提价仍无法平衡供需，于是直接拿部分Blackwell容量做拍卖，最终成交价比历史最高价还高15%、比当时pipeline报价高20%。 后续数据中心交付、Rubin等新卡、模型训练需求、融资安排等仍是主要关注变量。#文字观点", "publish_time": "2026-09-17 09:16", "tags": ["文字观点"]}, "post:2026-09-17T18-32:83121acda02c": {"id": "post:2026-09-17T18-32:83121acda02c", "kind": "post", "title": "2026-09-17 18:32", "source_label": "帖子正文", "excerpt": "【长江电子杨洋团队】策略会设备材料公司亮点总结精智达：35e订单目标已经完成，全年订单预期上调，新增15.76亿订单中预计包含18Gpbs FT产品，以及部分HBM产线需求，看好明年订单保持高速增长，此外长存、SOC会有新增订单贡献。超纯应材：新阶段产能12e，全部产能落地30e+，刻蚀产品保持高速", "content": "【长江电子杨洋团队】策略会设备材料公司亮点总结精智达：35e订单目标已经完成，全年订单预期上调，新增15.76亿订单中预计包含18Gpbs FT产品，以及部分HBM产线需求，看好明年订单保持高速增长，此外长存、SOC会有新增订单贡献。超纯应材：新阶段产能12e，全部产能落地30e+，刻蚀产品保持高速增长，薄膜沉积与光学业务开始起量，同时小金属限制出口为公司打开了海外拓展窗口。金海通：海外销售占比显著增长，占比提升至30%以上（去年同期12%左右），26Q3预计收入4e+，存储分选机Q4出量产机台，2027年存储需求有望大幅增长。精测电子：1-8月份新增订单同比增长2倍以上，先进制程新签占比超过7成，年报（4月28日）以来（加上确收部分），估算半导体新签14亿元（同比+180%）。北方华创：上半年新签订单约350e（同比+45%），90%来自于IC，Q3毛利率预计改善，27年订单预计加速增长。长光辰芯：2026年下半年半导体开启放量阶段，与国内头部量检测公司深度绑定，深度受益国产化率提升趋势。西安奕材：供需缺口显著，现阶段总产能约100万片/月，26年底提升至120万片，27年提升至150万片（含武汉厂），新价格有望于2027年开始逐步落地。 欢迎联系长江电子团队！#文字观点", "publish_time": "2026-09-17 18:32", "tags": ["文字观点"]}, "attachment:files/芯片设计大厂调研：3D 高容芯片验证及量产规划，AI 服务器硅电容、电源芯片协同，硅电容供需缺口及涨价趋势.pdf": {"id": "attachment:files/芯片设计大厂调研：3D 高容芯片验证及量产规划，AI 服务器硅电容、电源芯片协同，硅电容供需缺口及涨价趋势.pdf", "kind": "attachment", "title": "芯片设计大厂调研：3D 高容芯片验证及量产规划，AI 服务器硅电容、电源芯片协同，硅电容供需缺口及涨价趋势", "source_label": "其他", "excerpt": "芯片设计大厂调研：3D高容芯片验证及量产规划，AI服务 器硅电容、电源芯片协同，硅电容供需缺口及涨价趋势 日期：2026‑09‑1610:50 核心要点 1.3D高容芯片验证及量产规划 2.AI服务器硅电容/电源芯片协同 1.硅电容供需缺口及涨价趋势 专家Q&A正文 1、硅电容下游主要应用场景 硅电容的应用场景主要集中在对性能要求较高的领域，例如AI服务器、", "content": "芯片设计大厂调研：3D高容芯片验证及量产规划，AI服务 器硅电容、电源芯片协同，硅电容供需缺口及涨价趋势 日期：2026‑09‑1610:50 核心要点 1.3D高容芯片验证及量产规划 2.AI服务器硅电容/电源芯片协同 1.硅电容供需缺口及涨价趋势 专家Q&A正文 1、硅电容下游主要应用场景 硅电容的应用场景主要集中在对性能要求较高的领域，例如AI服务器、光模块、CPU、 GPU以及一些高端的工业和医疗设备。 2、硅电容对比MLCC、钽电容的成本差异 硅电容与MLCC和钽电容的价格不具有直接可比性。主要原因是它们在性能和容量规 格上存在显著差异，导致应用场景不同，因此无法在同等条件下进行比较。 3、硅电容商业模式与核心技术难点 硅电容的生产模式确实是自行设计，然后交由代工厂进行生产（Fabless模式）。其技 术难点主要体现在设计层面，而非制造工艺。具体而言，难点在于如何通过设计来提升 产品的性能，例如提高电容密度、降低ESR和ESL等关键指标。 4、硅电容供给缺口的成因 市场供给缺口较大的主要原因在于海外厂商的产能扩张非常谨慎。他们通常会基于明确 的订单和市场需求来规划扩产，而不会进行大规模的超前投资。这种策略导致了现有产 能难以满足快速增长的市场需求。 5、2026硅电容涨价情况 问：鉴于当前的市场供需状况，硅电容产品在2026年是否已经开始涨价？ 答：是的，2026年硅电容产品已经出现了涨价情况。 6、硅电容价格趋势与涨价驱动因素 硅电容的价格在上涨，这主要是由成本上升和供给紧张两个因素共同推动的。 7、哪类企业更适合切入硅电容赛道 从技术和工艺角度分析，具备半导体工艺的芯片类公司进入该领域可能相对更容易，相 比传统电容厂商具备优势。 8、车规级芯片进展 目前正在进行车规认证，样品已经制作完成。 9、切入车规级芯片市场的驱动力 主要驱动力是客户有这方面的需求。 10、车规级芯片研发时间 该产品的研发启动于2025年第一季度，历时约一年半时间完成了样品制作。 11、3D高容芯片样品测试情况 样品测试反馈显示存在较多问题，尚未达到量产标准，还需要进行调整和改进。 12、样品到小批量出货时间预估 预计还需要大约6个月时间来解决工艺和技术难点，之后客户验证还需要约12个月。 因此，从现在算起，至少需要一年半的时间才可能实现首批量出货。考虑到当前时间点， 预计最快在2028年下半年才能实现首批量供货。首批量是小批量生产前的一个环节。 13、3D高容芯片竞争优势 公司的主要优势在于拥有自主的know‑how，这构成了核心的技术壁垒。 14、GPU垂直供电（ VPD）与固态电容关系 问：未来 GPU供电方式从平面供电转向垂直供电，是否必须使用固态电容？ 答：是的，转向 VPD模式确实需要使用固态电容。 ¼ÓÎ¢WUXL3408 15、车规级产品价格居高不下的原因 汽车电子领域普遍在做成本控制，但车规产品价格依然较高： 车规级产品价格高昂，主要源于其认证流程。汽车电子元器件需要通过车规级认证，这 一过程不仅周期长，而且成本高昂。相较于消费级产品，车规级产品在设计、验证和测 试等环节的要求更为严苛，从而导致了其价格居高不下。 16、产线建设：是否需要新建工厂 不需要新建工厂。生产可以在现有工厂内通过增加新的产线来实现。 17、后道处理产线自建而非外包的原因 这条产线所涉及的特定工艺，例如分割等环节，是传统晶圆代工厂无法完成的，因此必 须由公司自行进行投资建设和运营。 18、后道产线建设周期 整个建设周期大约需要一年到一年半时间。具体来说，从土建开始到设备进场调试，再 到最终产品测试完成，整个流程走完需要12‑18个月。 19、Demo调试到量产周期；产线建设时点 从demo调试完成到最终量产，整个周期大约需要一年半。demo调试本身需要半年 时间，随后的产品验证周期为一年。 公司通常不会等到产品完全验证通过后才开始建设产线，而是在demo测试基本没有 问题后，就会启动产线的建设工作。 20、AI客户拓展（光模块以外、海外市场） 在AI客户方面，除了光模块领域的客户，其他AI相关领域的客户拓展目前还没有明 确的进展。至于海外市场，例如英伟达、谷歌等客户，目前也尚未能有效切入。 21、2027‑2028新产品规划 暂时没有新的产品规划，未来的业务重点将主要围绕当前的核心产品展开。 22、传统电源芯片 2027‑2028前景 预计2027年移动电源新国标的实施将对公司的芯片业务产生正面影响 。新国标要求移 动电源的 SOC芯片功能升级，这将导致芯片价格翻倍。 23、国内 AI产业链产品布局 公司在 AI领域主要通过为 AI服务器提供配套的 电源管理芯片 来切入产业链。这些芯 片与公司的固态电容产品（特别是硅电容）协同，形成整体解决方案。 24、配套电源芯片价值量与营收影响 这部分配套芯片业务的价值量相对有限，预计从营收角度看，不会对公司整体业绩产生 重大变化。其主要定位是 作为战略性配套产品，与公司的硅电容等核心产品共同构成解 决方案，以增强整体竞争力 。公ÖÚ号：小Å£研±¨¼Í要 25、硅电容配套电源芯片送样进展 是的，与硅电容配套的电源管理芯片已经处于 送样阶段 。 26、自研电源芯片能否兼容海外硅电容 公司的电源管理芯片可以识别并兼容海外厂商的硅电容产品。 由于硅电容产品遵循一定 的规格和标准，因此公司的芯片能够与不同供应商的产品进行匹配。 27、配套方案与价值量对比 公司的策略是将自研的新款电源管理芯片与硅电容打包， 形成一个整体解决方案进行推 广。在价值量方面， 硅电容的价值量要大于配套的电源管理芯片 。 28、电源管理芯片主要品类及下游 公司的电源管理芯片主要集中在 移动电源相关领域，这是业务的大头 。具体产品包括移 动电源的数模混合 SoC芯片以及快充充电器芯片。 29、消费电子：移动电源收入占比 在消费电子业务板块中， 移动电源及充电宝类产品是收入的主要构成部分， 占据了大头。 30、公司未来核心增长点 公司未来的增长潜力主要在于为 AI领域配套的 硅电容以及与硅电容协同的电源管理 芯片。将这两者结合成解决方案进行推广，被视为一个具有显著增长潜力的方向。 31、硅电容量产前主营业务增速；业务爆发依赖度 在硅电容产品尚未贡献显著营收之前，公司主营业务预计将保持平稳增长。 未来的主要 增长点和业务爆发点将依赖于硅电容项目的成功落地 。qq1490929960 32、毛利率水平判断；电源管理 /信号链毛利率驱动 公司整体毛利率没有下降风险。具体到电源管理和信号链产品，其毛利率实际上有所提 升。这主要得益于 规模效应的显现 ，即在产品销售价格保持稳定的前提下，出货量的增 长摊薄了成本，从而带动了毛利率的上升。 33、硅电容供需缺口持续时间 硅电容的供应紧缺状况预计将持续， 因为 市场需求的增长速度超过了现有厂商的扩产速 度。 34、硅电容验证周期；能否缩短 验证周期通常需要 一年时间，并且这个周期无法缩短 。无论是应用于 AI光模块还是车 规级产品，都需要遵循严谨的流程以确保产品质量和可靠性，避免后期出现批量瑕疵。 车规级产品的验证周期尤其长，因为直接关系到安全问题。 35、未来两年整体发展战略 未来两年的发展将主要围绕硅电容项目展开，除此之外，没有其他明确的重大增长点。", "status": "extracted"}, "post:2026-09-17T10-54:b309d4c34d0f": {"id": "post:2026-09-17T10-54:b309d4c34d0f", "kind": "post", "title": "2026-09-17 10:54", "source_label": "帖子正文", "excerpt": "🌟🌟【国金金属#7号】9月FOMC点评：加息落地，有色回归基本面定价20260917 美联储重启加息，未来两年利率中枢明显上移 ✔美联储9月FOMC以12票赞成、0票反对，一致决定加息25bp，将联邦基金目标利率区间由3.50%-3.75%上调至3.75%-4.00%，为2023年7月以来首次加息。", "content": "🌟🌟【国金金属#7号】9月FOMC点评：加息落地，有色回归基本面定价20260917 美联储重启加息，未来两年利率中枢明显上移 ✔美联储9月FOMC以12票赞成、0票反对，一致决定加息25bp，将联邦基金目标利率区间由3.50%-3.75%上调至3.75%-4.00%，为2023年7月以来首次加息。 ✔点阵图进一步强化“higher for longer”预期。2026年底政策利率中位数由6月的3.8%上调至4.1%，18名官员中16人认为年底前至少还需要再加息一次；2027年底利率中位数由3.6%上调至4.1%。 ✔经济预测仍然偏强。Fed上调2026、2027年GDP预测，下调失业率预测，同时继续上调PCE和核心PCE通胀预测。 增长担忧下降，通胀重新成为政策核心 ✔Fed对经济下行风险的担忧明显下降。相比6月，认为GDP存在下行风险、失业率存在上行风险的官员数量明显减少，而绝大多数官员仍认为通胀风险偏向上行。当前政策重心进一步向控制通胀倾斜。 ✔委员会态度明显转鹰。7月FOMC仍只有少数官员支持加息，本次则12票一致通过，近期经济和通胀数据已经让更多官员接受进一步收紧政策。 ✔对通胀来源的关注开始从一次性冲击转向二次传导。Warsh则重点强调，需要警惕能源、关税等价格上涨进一步向工资、服务价格和通胀预期扩散。后续即使油价回落，只要核心通胀仍有黏性，Fed也未必会很快转鸽。 ✔Warsh对长端利率上行的解释值得关注。他更多将10年期美债收益率上升归因于美国经济较强、资本开支增加，以及科技和AI投资带来的融资需求，并未主要归因于财政信用恶化或通胀预期失控。 ✔从市场定价看，本次会议大部分内容在会前已经被充分交易。9月加息25bp的概率在会前已经超过九成，市场对年内继续加息也已有较充分预期，甚至一度交易未来一年累计约4次25bp加息，本次FOMC整体更接近“小幅鹰派超预期”。 有色影响：流动性红利减弱，有色回归自身基本面定价 ✔从未来一年的宏观环境看，有色很难将“持续降息和流动性宽松”作为主要上涨驱动。但2027年利率不变，宏观环境恶化预期减弱，2027年有色回归基本面定价。 ✔基本面品种排序：铜 钼 铝 钨 钽等品种 联系人：吴晋恺#文字观点", "publish_time": "2026-09-17 10:54", "tags": ["文字观点"]}, "post:2026-09-17T22-16:d772662d37c9": {"id": "post:2026-09-17T22-16:d772662d37c9", "kind": "post", "title": "2026-09-17 22:16", "source_label": "帖子正文", "excerpt": "【东吴汽车】【小鹏G9L上市发布会要点 20260917】#上市价格及限时权益定位\"新科技旗舰\"，纯电+超级增程双动力，共6款配置。限时权益价（含1万元现金减免）： 超级增程：1602 四驱 Ultra SE 24.98万元（指导价25.98万）、1602 四驱 Ultra 旗舰版 29.98万元（", "content": "【东吴汽车】【小鹏G9L上市发布会要点 20260917】#上市价格及限时权益定位\"新科技旗舰\"，纯电+超级增程双动力，共6款配置。限时权益价（含1万元现金减免）： 超级增程：1602 四驱 Ultra SE 24.98万元（指导价25.98万）、1602 四驱 Ultra 旗舰版 29.98万元（指导价30.98万）。 纯电：702 Max 23.18万元（指导价24.18万）、660 四驱 Ultra SE 24.98万元（指导价25.98万）、660 四驱 Ultra 27.98万元（指导价28.98万）、755 四驱 Ultra 旗舰版 30.98万元（指导价31.98万）。#尺寸与底盘车长5120mm、轴距3100mm，轴长比0.605。全系标配前双叉臂后H臂全铝悬架、智能可变阻尼减振器、双腔空气悬架，以及线控后轮转向，最小转弯半径5.4m。麋鹿测试超80km/h，0-100km/h加速4.45s，100-0km/h制动距离34.2m，配AI智能底盘融合运动控制系统X-VMC。#空间与座舱\"六座空间、五座布局\"，后排膝部空间252mm、腿部1365mm、肩部1505mm、头部1101mm、坐垫宽1370mm。后备箱1152L，另有230L下沉空间。 全体型AI主动贴合座椅：主驾85个传感器/29个气袋/12L气泵，副驾91个传感器/27个气袋，0.4s自适应调节；副驾AI主动贴合零重力座椅，24向电动调节、16点按摩，集成双预紧限力式安全带与防下潜安全气囊；不拆头枕五座一键大床房。#智能驾驶首发搭载小鹏第二代VLA全新版本：端侧模型参数量提高3.5倍、支持最长30秒有效时序、端到端响应提速300%、预测式世界模型推演未来6秒场景，多维综合安全能力提升20倍。VLA+VLM舱驾一体，支持语音控制靠边停车。G9L Max版首发搭载第二代VLA Lite（蒸馏版），全系搭载图灵AI芯片。#三电与续航超级增程全系标配鲲鹏超级四驱增程技术：CLTC纯电续航435km、综合续航1602km，百公里电耗16.7kWh、亏电油耗6.16L，双电机四驱最 文", "excerpt": "浙商机械/电子 【科翔股份】：股权激励草案发布，陶瓷混压PCB放量在即，持续推荐！", "content": "浙商机械/电子 【科翔股份】：股权激励草案发布，陶瓷混压PCB放量在即，持续推荐！ #公司公告2026股权激励计划草案。授予数量789万股，占总股本的1.8%，激励对象206人，授予价格每股55.6元。 #业绩考核目标：2026年净利润不低于2.5 亿；2026-2027 年累计净利润不低于8亿元；2026-2028 年累计净利润不低于15亿元。 26H1公司亏损0.66亿元，则按照股权激励目标，#2026下半年公司净利润有望超3.16亿元，超过去年年初至今亏损总额。核心逻辑：陶瓷混压PCB放量在即，公司技术优势明显，卡位北美客户格局优 1️⃣行业：陶瓷混压PCB有望成为AI芯片散热破局关键 ①陶瓷板（氮化铝）导热能力优异，可缓解PCB板翘曲的发生，有望成为下一代AI PCB的标配。 ②市场空间：2030年全球陶瓷混压PCB市场空间有望达630亿人民币，2026-2030年CAGR为129%。 2️⃣公司：陶瓷混压PCB技术优势明显，与北美大厂合作研发用于AI服务器的陶瓷板 #2026年低介电常数氮化硅材料陶瓷产品有望导入AI服务器。 ①广州陶积电专注氮化铝等先进陶瓷板，有望解决AI服务器和高功率IGBT模块散热问题。 ②公司在低介电常数氮化硅的陶瓷材料上取得关键突破。#目前该材料已完成小批量试制、计划在2026年导入AI服务器。 #客户关系：正与北美大厂合作研发用于AI服务器的陶瓷板，重点攻克散热问题。 风险提示：订单落地不及预期；退市风险；高管减持风险；短期股价上涨过快风险#文字观点", "publish_time": "2026-09-17 08:56", "tags": ["文字观点"]}, "post:2026-09-17T08-33:66a886167405": {"id": "post:2026-09-17T08-33:66a886167405", "kind": "post", "title": "2026-09-17 08:33", "source_label": "帖子正文", "excerpt": "梅花庄：国产算力近期变化： 1）涨价，华为，寒武纪分别涨价20-50%不等，主要是内存涨价较多。", "content": "梅花庄：国产算力近期变化： 1）涨价，华为，寒武纪分别涨价20-50%不等，主要是内存涨价较多。 2）摩尔签约京东10万卡，继续验证国产10万卡大集群市场化需求。天数、壁仞，预计不也不会太远。 3）本周华为全联接大会，下周阿里云栖大会，大概率继续验证国产算力需求。---ms#文字观点", "publish_time": "2026-09-17 08:33", "tags": ["文字观点"]}, "post:2026-09-17T20-09:ecafd75f7cba": {"id": "post:2026-09-17T20-09:ecafd75f7cba", "kind": "post", "title": "2026-09-17 20:09", "source_label": "帖子正文", "excerpt": "【东方通信-半导体】昇腾芯片迭代超预期，国产超节点加速升级 1、昇腾960系列芯片预计27Q1推出，保持1年1代的高速迭代。", "content": "【东方通信-半导体】昇腾芯片迭代超预期，国产超节点加速升级 1、昇腾960系列芯片预计27Q1推出，保持1年1代的高速迭代。根据华为2026全链接大会，昇腾960DT计算性能达2000T FP8，最大支持288GB 显存，显存带宽可达9.6TB/s，计算性能介于H200与B200间。其预计2027Q1推出，较原计划目标提前三季度。960PR将实现8000T FP4计算性能，并于2027Q3推出，较原计划目标提前一季度。970/980预计分别于2028/2029年陆续推出，其FP4计算性能分别为14000/28000，分别对标B300/Rubin芯片。并且会议发布基于灵衢UnifiedBus的超节点集群11颗关键芯片，主要包括鲲鹏CPU、昇腾NPU、灵衢互联芯片、智能存储芯片等，实现算、存、运领域全覆盖。 2、灵衢+二层CLOS组网架构，目标打造10万卡以上超大规模集群。华为正式发布昇腾960超节点，其可实现4096卡集群规模，最大可提供8 EFLOPS FP8算力，预计风冷与液冷版本将分别于2027Q2和Q3上市。华为超节点集群支持多种组网模式：一种是采用两层CLOS单平面组网，可实现3.2万张昇腾960高速互联；第二种是采用两层CLOS多平面组网，可实现51.2万张昇腾960互联。基于10万卡以上的超节点集群，国产卡或将加速10万亿级别大模型训练，驱动国产AI大模型性能升级。 3、国产算力需求高企，国产半导体产业链闭环加速业绩释放。目前国产算力芯片需求旺盛，伴随国产FAB与HBM厂商持续扩产，国内半导体产业链预计加速闭环，驱动国产算力芯片业绩释放。 4、投资建议：（1）国产算力芯片，寒武纪、海光信息、燧原科技、天数智芯、摩尔线程、沐曦股份、壁仞科技、芯原股份；（2）超节点，华丰科技、盛科通信、锐捷网络等。 欢迎联系：舒迪/段笑南#文字观点", "publish_time": "2026-09-17 20:09", "tags": ["文字观点"]}, "post:2026-09-17T08-22:f58df112c50c": {"id": "post:2026-09-17T08-22:f58df112c50c", "kind": "post", "title": "2026-09-17 08:22", "source_label": "帖子正文", "excerpt": "看好当前到明后年6寸Inp衬底大规模应用的趋势，需求快速增长而供给壁垒极高，公司于今年Q4即有望迎来高成长阶段。", "content": "【国盛军工】光智科技：6英寸衬底获得海外订单，卡位优势全球突出 事件：9月16日公司发布投资者关系活动记录表，其中提到： 1、铟：先锐科技完成2英寸→4英寸→6英寸三代晶体迭代，产品良率已处于国内领先水平，并进入国际先进行列，为国内首批推出6英寸磷化铟衬底的厂家之一，已获得某全球头部客户6英寸磷化铟衬底的订单。产业层面，海外如Coherent和Lumentum正向6英寸大尺寸衬底升级，公司判断断6英寸磷化铟衬底市场有望迎来爆发式增长。 2、锗：先导科技集团已在锡林郭勒盟投建全球最大红外光学材料锗生产基地，今年8月通过设立全资子公司内蒙古光智矿业科技有限公司，拟向集团采购褐煤粉开展锗提纯业务，年锗晶棒生产量80吨，有望形成较为可观的成本与售价之间的利润空间。 我们认为公司作为铟、锗两大AI算力金属领域的重要龙头，其布局全面化、规模化，已处在业绩释放的重要的拐点，卡位优势突出： 1、锗 1）产量，全球第一：集团获得乌兰图嘎锗煤矿（全球最大锗伴生矿，占全球储量38%）20年产品销售权，光智科技向集团采购褐煤粉承担锗提纯业务，预计新增80-100吨/年的锗产量（占全球产量1/3）。 2）技术，13N锗单晶提纯/量产国内领先：打破海外垄断，是国内首家自主研制超高纯锗单晶材料并掌握其规模化制备技术的企业。 3）市场，锗金属有望迎来量价齐升：光AI（如光纤用四氯化锗等、锗烷）、商业航天（锗衬底材料）、军工红外等高景气赛道拉动锗需求。 4）红外业务：军工/民用工业级等拉动红外高景气增长，公司红外主业已连续两年实现业绩高增长；光智科技是国内最大的红外材料供应商，红外探测器产能有望快速释放，预计2027年继续实现高增长。 2、铟 1）产量，全球第一：集团铟年产量800吨（全球市占率超过60%，是国内最早生产出8N高纯铟的企业。 2）集团铟全产业链布局：铟/红磷（国内少数高纯红磷自供）-Inp衬底-外延片-光芯片全产业链布局，打造AI光的IDM模式。 3）lnp衬底卡位优势全球突出：2-6英寸lnp衬底全部资产已置入上市公司，目前，已向源杰科技、三安光电、Coherent等客户大批量出货。 资源优势，集团拥有全球70%以上的铟储量，拥有国内稀缺的高纯红磷（6.5N以上）保供优势； 技术优势，公司InP核心设备自研，掌握全球稀缺的6英寸Inp衬底技术并实现量产，良率处于国际先进行列，是国内首批推出6英寸InP衬底的厂家之一，并已获得海外大厂批产订单。我们非常看好当前到明后年6寸Inp衬底大规模应用的趋势，需求快速增长而供给壁垒极高，公司于今年Q4即有望迎来高成长阶段。 3、投资建议：光智科技公司布局锗+铟，是两大AI算力金属领域的重要龙头，掌握全球稀缺的6英寸Inp衬底技术，我们预计公司2026-2028年归母净利润分别为1.96/17.29/24.97亿元，对应PE估值分别为149X/17X/12X。 风险提示：红外光学主业订单不及预期，锗相关业务进展不及预期，磷化铟衬底订单不及预期，产能释放不及预期。 国盛军工团队#文字观点", "publish_time": "2026-09-17 08:22", "tags": ["文字观点"]}, "post:2026-09-17T15-42:8ac9e9101241": {"id": "post:2026-09-17T15-42:8ac9e9101241", "kind": "post", "title": "2026-09-17 15:42", "source_lab n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型\u003c/strong>：今天强化的逻辑是算力紧缺与需求扩张仍在延续，NBIS再次上调按需GPU价格，Anthropic锁定2.16吉瓦澳洲数据中心项目，英伟达IR会议显示约70%的FY28增长指引由自下而上需求支撑且需求约为供给2倍；今天出现的催化/验证包括NBIS 10月1日调价、Anthropic澳洲项目、英伟达IR会议份额指引，以及OpenAI ChatGPT Ads推出Sponsored Agents并集成HubSpot与Shopify。\u003c/li>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>：今天强化的逻辑是供给约束与国产/先进封装验证并行，DCI更新显示交付矛盾聚焦InP、DSP光芯片；芯片设计大厂调研涉及3D高容芯片验证及量产规划、AI服务器硅电容/电源芯片协同、硅电容供需缺口及涨价趋势；测试设备大厂调研涉及Bar/Chip光芯片测试设备订单及扩产、1.6T采样示波器认证及放量节奏。今天出现的催化/验证包括主力资金向半导体与算力硬件集中，通信、半导体、元件板块大额净流入，芯片、CPO、AIDC概念领涨；昇腾960系列预计27Q1推出并保持1年1代高速迭代；华为、寒武纪分别涨价20—50%不等。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>：今天强化的逻辑是1.6T标准化推进但放量递延，OIF发布1600ZR标准后，受DSP、InP光芯片供给约束，实际出货仅为前期预期70%—80%，大规模放量递延至2027年；NPO联盟就行业升级和近封装光学大规模商业应用达成国际标准共识。今天出现的催化/验证包括DCI更新、源杰科技300mw以上配套北美GPU大客户的CPO产品CW激光器即将通过认证，预计27年开始出货、28年爆发式增长，以及6寸InP衬底大规模应用趋势。\u003c/li>\n\u003cli>\u003cstrong>液冷/电源\u003c/strong>：今天强化的逻辑是数据中心备用电源与液冷方舱供应链景气，Generac与亚马逊签署24亿美元备用发电机组供货&amp;权证协议，首批交付预计2027年和2028年，推测对应2MW柴发3000台以上；潍柴动力是Generac柴发机头供应商；高澜股份为维谛液冷方舱核心供应商，二次管网价值量15%左右，预计明年整体二次管网需求50亿元左右。今天出现的催化/验证包括Generac向亚马逊发行认股权证，后者可按每股200.93美元收购最多169万股、合计3.4亿美元；高澜股份8月已开始批量交付，当前小千万元/月出货，年底扩产至1亿/月，明年2—3亿/月；锐明技术HVDC已开启小批量发货并绑定维谛。\u003c/li>\n\u003cli>\u003cstrong>机器人/自动化\u003c/strong>：今天强化的逻辑是特斯拉Optimus量产前审厂，特斯拉机器人团队9月16日抵达中国，9月17日正式开始量产前“程序性审厂”，为10月5日Optimus G3大规模量产前最后一次审厂，将走访宁波、新昌、上海、厦门等地供应链核心合作伙伴。今天出现的催化/验证包括审厂第一站为宁波均胜电子，特斯拉今日派20多人团队且设计、工程、采购、供应商管理4大部门全部参与；预计10月周产1000台、年底周产2000台；核心供应链涉及恒勃、北特、福达、双环。\u003c/li>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>：今天强化的逻辑是电子布/CCL/ABF载板高景气与涨价传导，电子布强势景气下头部新增电子纱爬坡后仍无法缓解全行业缺纱缺布格局，涨价传导打通至二线PCB，行业预期全链涨价周期延续至2027年；ABF载板欣兴电子订单交期延长至2031年，客户加价锁定供货。今天出现的催化/验证包括戈碧迦Low-CTE玻璃球为坩埚法高端T布最上游配方母材；中材科技AI布全品类供应商，一代布出货200+万米/月、二代布约30万米/月、Low-CTE近10万米/月，26Q3公司3500万米/年AI布项目投放；万源通MSAP、AI服务器电源PCB扩产加速；市场传CCL“鬼故事”，CPO信号使主板CCL等级降至M4即可满足需求，影响CCL升级趋势。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>美联储9月FOMC加息25bp至3.75%—4.00%，为2023年7月以来首次加息，
