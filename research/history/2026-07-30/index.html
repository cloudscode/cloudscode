"❗️重发: 美股软件再大涨 领导，软件的逻辑正变化！1、软件，#叙事回归？", "content": "❗️重发: 美股软件再大涨 领导，软件的逻辑正变化！ 1、软件，#叙事回归？大模型场景从Coding深入到企业Agent，FDE（AI部署）必不可少。OAI和Anthropic过去半年的布局，一直在证明了这一点。 2、软件，#买什么？1) 白马智谱+我服+金蝶。2）基本面角度推荐，30+成长性拐点型=顶点+新国都&新大陆，3）主题叙事推荐，AI安全双龙=深信服+绿盟。 3、基本面软件，#估值？顶点/新国都/新大陆均仅约20X上下，其中顶点、新国都分红率达70~90%，股息率达4%。剔除自由现金，顶点18X PE 新国12X PE。 祝好！#文字观点", "publish_time": "2026-07-30 09:19", "tags": ["叙事回归", "买什么", "估值", "文字观点"]}, "attachment:files/GS-日本科技：硬件-工业电子——康宁二季度业绩：数据中心需求强劲，与日本同业估值差料将收窄.pdf": {"id": "attachment:files/GS-日本科技：硬件-工业电子——康宁二季度业绩：数据中心需求强劲，与日本同业估值差料将收窄.pdf", "kind": "attachment", "title": "GS-日本科技：硬件-工业电子——康宁二季度业绩：数据中心需求强劲，与日本同业估值差料将收窄", "source_label": "GS", "excerpt": "EQUITY: JAPAN ELECTRONIC PARTSSemiconductor packaging industry updateGlobal Markets Research 28 July 2026 We revise assumptions for accelerator roadmaps We assume ongoing 2-die GPU", "content": "EQUITY: JAPAN ELECTRONIC PARTSSemiconductor packaging industry updateGlobal Markets Research 28 July 2026 We revise assumptions for accelerator roadmaps We assume ongoing 2-die GPU configuration, look to earlier EMIB-T shipments for 4-die custom ASIC configurations Apr–Jun industry developments: Start of shipments for Rubin processors We think shipments of packages for Nvidia's Rubin GPUs got under way in 27/3 Q1. We expect full-scale mass production in Q2. Using macroeconomic statistics, we estimate monthly shipment value of ¥24.7bn in Jan–Mar and ¥25.8bn in Apr–May (¥28.1bn in May). The price per m² increased from ¥1.18mn in Jan–Mar to ¥12.9bn in Apr–May (¥13.6bn in May; Figure 1). We revise accelerator roadmap assumptions: 2-die configuration for GPUs, earlier shipments of EMIB-T There is a growing view in the packaging industry that the structure of the Rubin Ultra will be changed from four dies, which was announced at GTC in March, to two (see our 30 June 2026 Quick Note SemiAnalysis report on Rubin Ultra ), and some observers are starting to take the view that the Feynman will have a two-module structure with two dies in a 3D stacking configuration. It may have become technically difficult to combine interposers larger than the 5.5x reticle size with HBM4, which has a lot of wiring. We have revised our forecasts for Ibiden [4062] (Buy), with a downward revision for our 28/3 forecast for GPU package prices on the assumption that Rubin Ultra will use a 2-die configuration, contrasted with our new view that shipments of packages for EMIB-T will begin in 28/3, one year earlier than we previously thought. We only fine-tuned our profit forecasts as these positives and negatives more or less cancel each other out. EMIB-T is designed to embed silicon bridges without using interposers, making it easier to produce larger packaging substrates. We think this has resulted in strong demand for large package substrates that integrate more AI accelerator dies, HBM, and I/O, and we surmise that a growing number of custom ASIC manufacturers are considering using EMIB-T. The use of large packages can increase compute density within racks, increase memory and storage capacity, and increase signaling bandwidth, thereby enabling large- scale batch processing, reducing energy consumption per token, and reducing latency for agent models. At present, we think EMIB-T shipment volumes are being crimped by a lack of production capacity, but increasing capacity in a timely fashion could well offer earnings upside for 29/3 onwards. Advances in packaging technologies in view of update of agent models In agent-based coding models, performance (tokens per Watt per hour) is restricted by memory capacity and bandwidth between memory and GPU. The current design approach for accelerators is to increase the number of GPUs and amount of HBM per module by increasing package size, and we think this kind of design approach will become even more advantageous with growth in agent-based workloads. For example, using large packages to increase the amount of HBM per GPU will increase the proportion of weights and key-value cache that be stored in HBM, thereby reducing data transfer with host memory or SSDs. Moreover, including more GPUs in one module can increase bandwidth between the GPUs, both reducing the energy needed for signaling and increasing GPU utilization.Research Analysts Japan electronic parts Manabu Akizuki - NSC manabu.akizuki@nomura.com +81 3 6703 1185 See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts.Production Complete: 2026-07-28 15:12 UTC Reference figures Fig. 1: Price per m² for rigid module boards Note: Module boards have components mounted on the board surface. Source: Nomura, based on Ministry of Economy, Trade & Industry’s Current Survey of Production Fig. 2: Rigid PCB production value Source: Nomura, based on Ministry of Economy, Trade & Industry’s Current Survey of Production Nomura | Semiconductor packaging industry update 28 July 2026 2 9WuZmXzWsUrOoRtM7NdN9PoMrRtRtNfQnNrOkPoMxOaQpOpOuOmNmQuOnPoP Fig. 3: PLP interposer-based 3.5D packaging Source: Nomura Fig. 4: EMIB-based 3.5D packaging Source: NomuraNomura | Semiconductor packaging industry update 28 July 2026 3 Appendix A-1 This report has been produced by Nomura Securities Co., Ltd. (NSC), Japan. See Disclaimers for Nomura Group entity details. Analyst Certification I, Manabu Akizuki, hereby certify (1) that the views expressed in this Research report accurately reflect my personal views about any or all of the subject securities or issuers referred to in this Research report, (2) no part of my compensation was, is or will be directly or indirectly related to the specific recommendations or views expressed in this Research report and (3) no part of my compensation is tied to any specific investment banking transactions performed by Nomura Securities International, Inc., Nomura International plc or any other Nomura Group company. Important Disclosures The lists of issuers that are affiliates or subsidiaries of Nomura Holdings Inc., the parent co Figure 1). We revise accelerator roadmap assumptions: 2-die configuration for GPUs, earlier shipments of EMIB-T There is a growing view in the packaging industry that the structure of the Rubin Ultra will be changed from four dies, which was announced at GTC in March, to two (see our 30 June 2026 Quick Note SemiAnalysis report on Rubin Ultra ), and some observers are starting to take the view that the Feynman will have a two-module structure with two dies in a 3D stacking configuration. It may have become technically difficult to combine interposers larger than the 5.5x reticle size with HBM4, which has a lot of wiring. We have revised our forecasts for Ibiden [4062] (Buy), with a downward revision for our 28/3 forecast for GPU package prices on the assumption that Rubin Ultra will use a 2-die configuration, contrasted with our new view that shipments of packages for EMIB-T will begin in 28/3, one year earlier than we previously thought. We only fine-tuned our profit forecasts as these positives and negatives more or less cancel each other out. EMIB-T is designed to embed silicon bridges without using interposers, making it easier to produce larger packaging substrates. We think this has resulted in strong demand for large package substrates that integrate more AI accelerator dies, HBM, and I/O, and we surmise that a growing number of custom ASIC manufacturers are considering using EMIB-T. The use of large packages can increase compute density within racks, increase memory and storage capacity, and increase signaling bandwidth, thereby enabling large- scale batch processing, reducing energy consumption per token, and reducing latency for agent models. At present, we think EMIB-T shipment volumes are being crimped by a lack of production capacity, but increasing capacity in a timely fashion could well offer earnings upside for 29/3 onwards. Advances in packaging technologies in view of update of agent models In agent-based coding models, performance (tokens per Watt per hour) is restricted by memory capacity and bandwidth between memory and GPU. The current design approach for accelerators is to increase the number of GPUs and amount of HBM per module by increasing package size, and we think this kind of design approach will become even more advantageous with growth in agent-based workloads. For example, using large packages to increase the amount of HBM per GPU will increase the proportion of weights and key-value cache that be stored in HBM, thereby reducing data transfer with host memory or SSDs. Moreover, including more GPUs in one module can increase bandwidth between the GPUs, both reducing the energy needed for signaling and increasing GPU utilization.Research Analysts Japan electronic parts Manabu Akizuki - NSC manabu.akizuki@nomura.com +81 3 6703 1185 See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts.Production Complete: 2026-07-28 15:12 UTC Reference figures Fig. 1: Price per m² for rigid module boards Note: Module boards have components mounted on the board surface. Source: Nomura, based on Ministry of Economy, Trade & Industry’s Current Survey of Production Fig. 2: Rigid PCB production value Source: Nomura, based on Ministry of Economy, Trade & Industry’s Current Survey of Production Nomura | Semiconductor packaging industry update 28 July 2026 2 9WuZmXzWsUrOoRtM7NdN9PoMrRtRtNfQnNrOkPoMxOaQpOpOuOmNmQuOnPoP Fig. 3: PLP interposer-based 3.5D packaging Source: Nomura Fig. 4: EMIB-based 3.5D packaging Source: NomuraNomura | Semiconductor packaging industry update 28 July 2026 3 Appendix A-1 This report has been produced by Nomura Securities Co., Ltd. (NSC), Japan. See Disclaimers for Nomura Group entity details. Analyst Certification I, Manabu Akizuki, hereby certify (1) that the views expressed in this Research report accurately reflect my personal views about any or all of the subject securities or issuers referred to in this Research report, (2) no part of my compensa files/0729脱水研报.pdf", "kind": "attachment", "title": "0729脱水研报", "source_label": "其他", "excerpt": "8款高端光刻胶获得主流晶圆厂批量订单，还有多款 预计年内拿到订单；湿法基膜价格修复明显还有望… xuangut ong.com.cn 2026/07/29 16:33 【临时键合胶规模化出货，封装PI获客户订单】 半导体封装PI材料已布局7款产品，其中2款获得多家客户订单", "content": "8款高端光刻胶获得主流晶圆厂批量订单，还有多款 预计年内拿到订单；湿法基膜价格修复明显还有望… xuangut ong.com.cn 2026/07/29 16:33 【临时键合胶规模化出货，封装PI获客户订单】 半导体封装PI材料已布局7款产品，其中2款获得多家客户订单；临时键合胶在 现有客户实现稳定规模化出货基础上，持续深化市场拓展与多场景应用推广。 【TSV工艺抛光液获批量订单，仙桃产业园建设中】 多款适配铜阻挡层、大硅片、碳化硅衬底、TSV工艺的专用抛光液持续取得进 展，多个产品型号通过头部晶圆厂全流程验证并斩获批量订单；仙桃抛光液产业园 产线稳步建设，同时实现研磨粒子自主配套，持续完善CMP材料一体化供应能力。 【TFE墨水导入G8.6产线，YPI产线完成升级】 PSPI、TFE封装墨水等产品实现G8.6高世代产线批量供货；YPI产线完成升级试 运行，持续夯实柔性显示上游材料国产化竞争优势，配合面板厂商开展新项目工艺 认证。 【超10款光刻胶进入加仑样测试，订单持续增长】 截至上半年度，公司已有8款高端晶圆光刻胶（ArF、KrF各4款）获得国内多家 主流晶圆厂批量订单，较今年一季度末新增5款；近30款产品已向下游客户送样， 其中超10款进入加仑样测试阶段；另有多款产品预计于本年度内实现订单转化。 【大缸径收购整合完成】 收购中原吉凯恩59%股权已完成并纳入合并报表，公司与中原吉凯恩实现大缸 径气缸套领域技术、产能、高端客户资源的全域协同整合，双方统一对接卡特彼 勒、康明斯、颜巴赫等全球大马力发动机龙头客户，加快高端大缸径产品落地交 付，助力持续提升海外高端市场占有率。 【制动鼓年产能扩至210万只】朗读 全屏 手机 浏览 保存 设置 帮助 退出 公司复合制动鼓契合商用车底盘轻量化升级趋势，叠加新能源重卡市场渗透率 持续提升，产销量保持高速增长。目前复合制动鼓现有年产能210万只，可有效填 补当前市场需求缺口，充分支撑业务持续放量。 【泰国基地批量供货头部主机厂】 泰国基地气缸套生产线已于2025年末竣工投产，现阶段根据海外客户订单需求 稳步爬坡释放产能，已实现批量供货通用、康明斯、戴姆勒、约翰迪尔等全球头部 主机厂商。 【NPO获2027年下半年批量采购时间表】 公司预计2027年下半年开始，行业内两个有影响力的重点客户将开始批量采购 NPO产品，更大上量预计在2028年。目前多家CSP厂商、大模型企业及Neocloud 客户均对NPO产品感兴趣，2027年期间有望陆续完成产品导入。NPO有望成为sca le-up场景的主流产品之一，分阶段放量，先从头部企业采用，随后扩展至更多客 户。 【2.4T进入2027年需求矩阵】 公司表示2027年行业情况明晰，除800G和1.6T外，2.4T产品需求也具有较强 的确定性，增速非常快。部分重点客户已给出2028年新产品指引，涵盖2.4T、NP O、XPO等，指引金额可观。2.4T等下一代高速产品需应用coherent lite、硅光、 薄膜铌酸锂等前沿技术，仅少数厂商具备相应的全方位技术布局。 【湿法基膜价格明显修复】 2026年上半年，主流湿法基膜价格较去年底实现明显修复。公司结合下游供需 变化，已向核心客户启动分批次调价。结合下游电芯企业补库节奏及供需缺口现 状，市场存在新一轮调价的基础。海外市场定价显著高于国内市场。 【马来西亚基地一期年内投产】 马来西亚基地一期项目将于今年内逐步投产，瑞典、美国基地进度积极推进 中。公司同时推出了全球首款采用创新\"绿色环保隔膜技术（EVO）\"的锂电池隔 膜，依托离子液体绿色溶剂与新型闭环回收系统，彻底摒弃传统含氯有害溶剂，新 型萃取溶剂沸点超210℃、挥发性有机化合物近乎为零，实现隔膜全生命周期绿色 制造。 【固锐系列全球率先实现量产】 公司\"固锐\"系列刚性骨架膜采用三大新型核心技术，同步实现轻薄、高孔隙 率、微孔孔径可调的特性，适配聚合物、硫化物及有机-无机复合型电解质的填充复 合，有效改善全固态电池的能量密度并解决卷对卷装配工艺难题。该系列可同时适 配半固态、准固态及全固态电池路线，于2025年在全球率先实现量产。 【COG芯片6月量产出货】 公司COG（Chip on Glass）业务已于今年6月实现量产出货，为行业内首批大 批量交付。目前量产产品为Mini COG芯片，未来将向Micro COG方向延伸。工艺 方面，公司率先在Mini COG领域导入多Cell芯片设计方案，有效降低功耗。当前量 产客户专注于COG产品，不涉及PCB方 案。 【银镜倒装技改年底建成】 “年产600万片银镜倒装芯片技改项目”是公司在现有产能框架内，推进低阶 产品向高阶银镜产品迭代的结构升级项目。项目预计于今年年底完成建设，600万 片年产能将全部落地释放。银镜产品售价约为普通产品的1.5倍，技改过程中现有场 地、无尘车间、人工等核心配套资源无需新增投入，仅小幅增加设备折旧成本，成 本增幅可控。 【MIP技术已启动布局】 公司已开展RGB相关MIP技术布局，MIP可理解为Mini COB向更小尺寸演进过 程中的过渡技术路线。当前相关产品出货规模尚有限，对外交付以COW圆片形式为 主。 【整机柜液冷冷板排产交付】 前期中标的整机柜液冷冷板项目按客户计划有序排产交付，公司持续深化与国 内头部服务器厂商合作。国内外服务器客户样品测试、认证工作稳步推进中，部分 已完成打样认证的客户正积极推进订单洽谈。 【国内液冷产线逐步爬坡】 国内液冷产线当前处于逐步爬坡阶段，产能投放跟随客户订单交付计划动态调 整。下半年随着订单规模提升、产能利用率持续上行、生产良率优化及供应链成本 改善，规模效应有望逐步显现。 【泰国基地建设与战略定位】 泰国基地推进厂房内部装修、产线设备规划及客户前置验厂准备，暂未正式投 产，投产时间将结合海外客户认证进度及订单落地情况综合确定。基地战略定位以 承接北美客户交付需求为核心，同时兼顾东南亚区域服务器、网通行业潜在客户。 【下半年订单环比增长】 公司表示，下半年订单较上半年呈增长趋势。目前多数产品供应正常，部分产 品因需求增长迅速交期较长，公司正在持续争取更多产能。 【光模块芯片收入快速增长】 公司在光模块领域耕耘近十年，产品全面覆盖光模块中各类模拟芯片需求，并 广泛服务于众多光模块客户，收入贡献快速增长。 ────────────────────────────────────── 内容来源： 1、鼎龙股份：300054鼎龙股份投资者关系管理信息20260728。 2、中原内配：2026年7月27日-2026年7月28日投资者关系活动记录表。 3、中际旭创：投资者关系活动记录表20260728。 4、星源材质：2026年7月28日投资者关系活动记录表。 5、聚灿光电：2026年7月27日投资者关系活动记录表。 6、鸿富瀚：2026年7月28日投资者关系活动记录表。 7、圣邦股份：2026年7月28日投资者关系活动记录表。 *免责声明：文章内容仅供参考，不构成投资建议 *风险提示：股市有风险，入市需谨慎", "status": "extracted"}, "attachment:files/0729评级日报.pdf": {"id": "attachment:files/0729评级日报.pdf", "kind": "attachment", "title": "0729评级日报", "source_label": "其他", "excerpt": "8款高端光刻胶获得主流晶圆厂批量订单，还有多款 预计年内拿到订单；湿法基膜价格修复明显还有望… xuangut ong.com.cn 2026/07/29 16:33 【临时键合胶规模化出货，封装PI获客户订单】 半导体封装PI材料已布局7款产品，其中2款获得多家客户订单", "content": "8款高端光刻胶获得主流晶圆厂批量订单，还有多款 预计年内拿到订单；湿法基膜价格修复明显还有望… xuangut ong.com.cn 2026/07/29 16:33 【临时键合胶规模化出货，封装PI获客户订单】 半导体封装PI材料已布局7款产品，其中2款获得多家客户订单；临时键合胶在 现有客户实现稳定规模化出货基础上，持续深化市场拓展与多场景应用推广。 【TSV工艺抛光液获批量订单，仙桃产业园建设中】 多款适配铜阻挡层、大硅片、碳化硅衬底、TSV工艺的专用抛光液持续取得进 展，多个产品型号通过头部晶圆厂全流程验证并斩获批量订单；仙桃抛光液产业园 产线稳步建设，同时实现研磨粒子自主配套，持续完善CMP材料一体化供应能力。 【TFE墨水导入G8.6产线，YPI产线完成升级】 PSPI、TFE封装墨水等产品实现G8.6高世代产线批量供货；YPI产线完成升级试 运行，持续夯实柔性显示上游材料国产化竞争优势，配合面板厂商开展新项目工艺 认证。 【超10款光刻胶进入加仑样测试，订单持续增长】 截至上半年度，公司已有8款高端晶圆光刻胶（ :25", "tags": ["文字观点"]}, "post:2026-07-30T20-46:a19d86db817f": {"id": "post:2026-07-30T20-46:a19d86db817f", "kind": "post", "title": "2026-07-30 20:46", "source_label": "帖子正文", "excerpt": "是什么驱动市场行情？#交易台亚洲股市收盘涨跌分化，早盘市场风险偏好升温，随后情绪回落", "content": "是什么驱动市场行情？#交易台亚洲股市收盘涨跌分化，早盘市场风险偏好升温，随后情绪回落；韩国市场出现剧烈反转，韩国综合指数受三星电子强劲的半导体业绩提振大幅冲高，但最终收跌，连续第三个交易日走低。 市场持续博弈具备韧性的人工智能相关业绩，同时面临宏观环境带来的挑战：美联储释放鹰派信号、美伊局势紧张，叠加 7 月抛售行情遗留的技术层面压力。 日本股市表现相对占优，爱德万受益于上调人工智能相关业绩指引股价大涨，日立凭借亮眼业绩上行；不过银行板块拖累东证指数表现。 澳大利亚股市走低，原材料板块与消费标的走弱；港股小幅走高，新东方、百威亚太的上涨抵消科技与半导体个股持续承压带来的负面影响。 ******** 台湾股市小幅回落，但表现优于韩国市场。 印度股市小幅上行，信息技术板块延续上涨态势，连续五个交易日收涨，空头回补行为持续发酵。 东盟市场中，泰国结束假期复市后表现最弱；越南市场流动性预期改善，录得 4 月以来最大单日涨幅。 亚太股市过去 24 小时评级调整信息 Mineral Resources（MIN.AX）：评级上调至中性，调整日期 7 月 29 日 力拓（RIO.AX...", "publish_time": "2026-07-30 20:46", "tags": ["交易台", "文字观点"]}, "attachment:files/Nomura-韩国策略：韩国股市下一轮重估——从流动性与杠杆行情转向基本面校准.pdf": {"id": "attachment:files/Nomura-韩国策略：韩国股市下一轮重估——从流动性与杠杆行情转向基本面校准.pdf", "kind": "attachment", "title": "Nomura-韩国策略：韩国股市下一轮重估——从流动性与杠杆行情转向基本面校准", "source_label": "Nomura", "excerpt": "EQUITY: EQUITY STRATEGYKorea StrategyGlobal Markets Research 28 July 2026 Korea’s next re-rating From liquidity and leverage rally to fundamental recalibration Corporate buybacks t", "content": "EQUITY: EQUITY STRATEGYKorea StrategyGlobal Markets Research 28 July 2026 Korea’s next re-rating From liquidity and leverage rally to fundamental recalibration Corporate buybacks to become next structural driver We believe the Korean equity market’s correction to 6,691 (24 July 2026) from a peak of 9,115 (22 June 2026) was driven by the following flow factors: (1) heavy selling by foreign investors (KRW158tn; USD108bn) as Korea's benchmark weight exceeded portfolio limits, (2) slowing institutional support as National Pension Service’s domestic asset allocation approached practical limits, and (3) rapid growth in leveraged ETFs and newly launched single stock leveraged products creating volatility ( Fig. 9 ). We believe these factors led to amplified volatility despite resilient corporate fundamentals. As market “deleveraging” progresses and foreign selling pressure eases, the next leg of Korea's re- rating is likely to be supported by corporate share buybacks and treasury-share cancellations, particularly from large-cap companies, in our view. We estimate Korea’s share buybacks to be KRW116tn/274tn/328tn for 2026F/27F/28F, ~90% of which will likely stem from the two large semiconductor companies (including buybacks for employee bonus and shareholder return). This should become a new structural source of demand and help the KOSPI re-rate toward our 10,000-11,000 target. How Korea’s ETFs intensified market volatility Since the launch of the first leveraged ETF in the KOSPI in 2010, the number expanded to ~30/56 in 2020/26. Korea’s total ETF market has ~KRW450tn in AUM (source: Bloomberg), of which leveraged ETFs account for KRW27tn (as of 23 July 2026), comprising ~6% of the total ETF market. Due to large leveraged ETF holdings by retail investors (~85% as per our estimates) and their negative return of 53% since the KOSPI peaked on 22 June (vs the KOSPI’s overall decline of 22% during the same period), the South Korean government announced a first round of measures to restrict and tighten investment qualifications in these single leveraged ETF products. In addition, a sharp increase in retail investors’ forced liquidations ( Fig. 11 ) relative to outstanding margin receivables triggered an alert signal to the government, in our view. Maintain KOSPI target of 10,000-11,000 We maintain our 2026 KOSPI target of 10,000-11,000 based on a 2026F P/E of 10.5- 11.5x, P/BV of 2.5-2.8x, and ROE of 27% (currently trading at 2026/27F P/E of 7.0x/5.2x and P/BV of 1.7x/1.3x). We see the following as key catalysts for the KOSPI: 1) AI-driven earnings (including memory/ HBM, power equipment, ESS, and nuclear) to generate sustainable ROE for the next five years; 2) listed companies’ shift toward better capital efficiency, shareholder return, and optimal leverage to support higher P/E and PBV; 3) active stewardship or activist campaigns; and 4) government enforcement for better target ROE disclosure and regulatory measures to facilitate non-core asset holdings, stricter listing requirement and governance structure. Downside risks to our view include: 1) corporate stock buyback falling short of our expectations of KRW116tn (2026F); 2) foreign investors’ mechanical selling exacerbating once the KOSPI reaches above 7,500-9,000 (without KOSPI earnings or ROE upgrade); and 3) retail investors’ rebuilding of steep leverage. Korea’s equity market and tax reform measures in 2H26F We believe key policy developments in 2H26F could include tighter regulations of single- stock leveraged ETFs (than what was announced on 16 July), publication of a low-PBR company list, incentives for higher dividends, stricter duplicate-listing rules and KOSDAQ reform. We believe the low-PBR list, expected around November, could become the most direct company-specific catalyst by encouraging treasury-share cancellation, higher dividends and disposal of non-core assets. Meanwhile, we also believe stricter duplicate-Research Analysts Korea Strategy Cindy Park - NFIK cindy.park@nomura.com +822 3783 2324 Dongmin Lee - NFIK dongmin.lee@nomura.com +822 3783 2338 Asia Pacific Technology CW Chung - NIHK cwchung@nomura.com +852 2252 6075 YJ Kim, CFA - NFIK yj.kim1@nomura.com +82237832332 Korea Autos & Auto Parts Angela Hong - NFIK angela.hong@nomura.com +822 3783 2360 Korea Tech/Industrials Eon Hwang - NFIK eon.hwang@nomura.com +822 3783 2318 See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts.Production Complete: 2026-07-28 10:48 UTC listing rules and KOSDAQ reforms should improve shareholder protection, reduce parent- company discounts and strengthen overall market quality. Korea’s late-July 2026 tax reform proposal, in our view, is likely to include: 1) higher tax incentives for long-term domestic equity investment through ISAs, pension accounts; 2) reforms to the inheritance and gift tax framework aimed at reducing controlling shareholders’ incentive to suppress share prices; and 3) enhanced tax credits for AI, semiconductors, and other strategic industries, and regional investment incentives. Fig. 1: Our Korea stock picks Mkt cap Avg. TO Target Price Upside Company Code Rating (USDmn) (USDmn) price 24-Jul (%) Samsung Electronics 005930 KS Buy 994,435 2,515 670,000 249,500 168.5% SEMCO 009150 KS Buy 67,524 135 2,500,000 1,326,000 88.5% Kia Corp 000270 KS Buy 34,734 136 250,000 130,500 91.6% Celltrion 068270 KS Buy 28,157 102 270,000 177,600 52.0% Samsung SDI 006400 KS Buy 23,514 193 900,000 428,000 110.3% Hyundai Rotem 064350 KS Buy 11,786 117 310,000 158,400 95.7% NC 036570 KS Buy 3,349 23 310,000 228,000 36.0% Note: Pricing as of 24 July close Source: Bloomberg Finance L.P., Nomura estimatesNomura | Korea Strategy 28 July 2026 2 eZqVgZzWvXtMqPqP9P9RaQtRqQpNoQkPpPoRfQmOuNbRqRnMwMqRsPwMoNxO Korea’s next re-rating: from liquidity and leverage rally to fundamental recalibration From a flow perspective, the Korean equity market’s correction to 6,691 (24 July 2026) from a peak of 9,115 (22 June 2026 close) was largely due to: 1) a large amount of foreign selling of KRW158tn year-to-date, (2) a rapid increase in leveraged ETF investments and the introduction of single-stock leveraged products (16/3 newly launched in Korea/Hong Kong at end-May 2026/May 2025) steepening market volatility; and (3) institutional flow becoming less supportive due to asset allocation rebalancing by pension funds (Korea’s National Pension Service has steadily increased its domestic equity allocation from 14.9% to 20.8%, but has also reached limits in overall fund allocation). The KOSPI’s volatility index hit all-time high of 96.9 on 29 June 2026. As most foreign institutional investors operate under portfolio risk-management rules, they are forced to reduce exposure when an individual stock weighting exceeds a position limit (e.g., 10% of a fund) or Korea's weighting in global benchmarks such as MSCI rises beyond target allocations. In retrospect, this mechanical selling intensified when the KOSPI reached 7,500/9,000 in mid-May/end-June ( Fig. 6 ) and to a less extent in Feb- March when the KOSPI reached ~6,000. Corporate share buybacks to re-rate the KOSPI We believe as market “deleveraging” progresses (discussed further in The ongoing deleveraging may be a “re-setting” process ) and foreign selling pressure eases, the next leg of Korea's re-rating is likely to be supported by corporate share buybacks and treasury-share cancellations, particularly from large-cap companies. We estimate Korea’s buybacks to be KRW116tn/274tn/328tn for 2026F/27F/28F, ~90% of which will likely stem from the two large semiconductor companies (including buyback for employee bonus and shareholder return). This should become a new structural source of demand and help the KOSPI re-rate toward our 10,000–11,000 target (Korea Strategy - New KOSPI target of 10,000-11,000, 20 May 2026 ), in our view. Fig. 2: KOSPI equity market investor flow by investor type and forecast Source: KRX, Nomura research Fig. 3: KOSPI: quarterly share buyback forecasts (KRWtn) 1Q26 2Q26 3Q26F 4Q26F 2026F 1Q27F 2Q27F 3Q27F 4Q27F 2027F 1Q28F 2Q28F 3Q28F 4Q28F 2028F KOSPI buyback (total) 12 8 42 54 116 56 45 74 100 274 101 75 66 87 328 Memory \"big 2\" 8 5 39 51 103 50 39 68 94 251 97 71 62 83 314 Shareholder return 0 0 23 35 58 35 23 52 78 189 78 52 43 65 239 Employee bonus 8 5 16 16 45 15 15 15 15 61 19 19 19 19 75 Other companies 4 3 3 3 13 6 6 6 6 23 4 4 4 4 15 Note: SEC announced that its 2024-26 shareholder return budget will be 50% of three years' combined FCF. Out of the budget, we assume that remaining amount after paying out cash dividends will be spent for share buyback. Source: Company data, Nomura estimatesNomura | Korea Strategy 28 July 2026 3 Fig. 4: KOSPI: ann 筑底阶段、行业盈利整体承压的背景下，重点看好需求价格敏感", "content": "【华安电新&汽车】整车中期策略：结构调整明显，整车板块迎来修复窗口 ➡近期整车板块表现强势，市场对汽车行业基本面边际改善及结构性机会的关注度明显提升。我们近期发布整车行业2026年中期策略《结构调整明显，看好超豪华及出海》，认为在国内需求仍处于筑底阶段、行业盈利整体承压的背景下，重点看好需求价格敏感度较低且国产替代空间较大的超豪华赛道，以及能够依靠海外高利润市场对冲国内需求与成本压力的出海主线。 ➡26年H1汽车销量内销承压，出口跃升 国内汽车批发销量992.1万辆，同比下降21.1%；同期汽车出口509.6万辆，同比增长65.3%，出口成为支撑行业总量及车企盈利的核心力量，其中新能源汽车出口235.5万辆，同比增长超过1.2倍。 ➡预计26年全口径预计汽车出口1000万辆 2026年全口径预计汽车出口1000万辆，同比增长约40%。欧洲是第一大市场，预计出口中性情景约230万辆，同比增长约58%。中南美洲增速最快，预计对墨西哥和巴西合计出口中性情景约142万辆，同比增长约71%。分车企看吉利、比亚迪、奇瑞，出口增长最快。 ➡上半年新能源车渗透率持续提升到达60% 26年...", "publish_time": "2026-07-30 15:49", "tags": ["文字观点"]}, "post:2026-07-30T07-34:53f5c6d776cf": {"id": "post:2026-07-30T07-34:53f5c6d776cf", "kind": "post", "title": "2026-07-30 07:34", "source_label": "帖子正文", "excerpt": "【九州一轨】子公司拟购不超6亿元设备扩充晶圆隐切产能。项目核心聚焦先进激光隐形切割加工服务，预计于2027年第一季度完成生产线建设并逐步投产。", "content": "【九州一轨】子公司拟购不超6亿元设备扩充晶圆隐切产能。 项目核心聚焦先进激光隐形切割加工服务，预计于2027年第一季度完成生产线建设并逐步投产。 项目全面建成后，主要切割加工规格8/12英寸硅光芯片、硅陪条，主要下游客户为光模块厂商和芯片制造商，可为客户提供半导体晶圆高精度隐形切割（分割）、开槽、分选等业务。 九州一轨称，当前AI算力与高速光通信产业正处于快速发展期，硅光晶圆精密加工作为上游关键环节面临稳步扩大的市场需求。面对下游需求的突然放量，晶禧半导体现有产能已不足以支撑订单交付。#文字观点", "publish_time": "2026-07-30 07:34", "tags": ["文字观点"]}, "post:2026-07-30T09-15:b5281643520f": {"id": "post:2026-07-30T09-15:b5281643520f", "kind": "post", "title": "2026-07-30 09:15", "source_label": "帖子正文", "excerpt": "❗【天风电新】红板科技更新&推荐0729 —————————— 1、 公司目前产值50亿，消费电子板占比50%+，高端显示占比17%，其他系汽车、通讯（光模块刚刚起量）。2、 新增产能： 1）募投项目：7月逐步投产，8月开始量产，主供光模块，满产产能约6百万只/月，目前1百万只/月。", "content": "❗【天风电新】红板科技更新&推荐0729 —————————— 1、 公司目前产值50亿，消费电子板占比50%+，高端显示占比17%，其他系汽车、通讯（光模块刚刚起量）。 2、 新增产能： 1）募投项目：7月逐步投产，8月开始量产，主供光模块，满产产能约6百万只/月，目前1百万只/月。 2）赣州项目：为高端显示Mini/Micro LED板扩产项目，预计26年底投产。 3）吉安HDI扩建项目：投资额7亿，产值10亿，预计26年底完成基建，27年中投产。 4）mSAP项目：投资额50亿，产值看产出，传统HDI一般1:1，光模块目前价格可达1:5，预计4年建设完成，首批产能28年开始贡献，预计在10亿元。 3、 分产品盈利能力：消费电子、高端显示板毛利率在20%+，汽车板在10%+，光模块板在40-50%。 4、 原材料涨价与传导：CCL成本占比在40%，CCL及其他材料一直在涨价，公司26H1涨价了十几个点，后续会继续传导（上游涨即对下游涨），下游基本可接受，从接受度看，高端显示>消费电子>汽车。 5、 BT载板：目前产能4-5亿元，25年收入1亿元，亏损中，预计今年到2-...", "publish_time": "2026-07- ECTRONIC PARTSSemiconductor packaging industry updateGlobal Markets Research 28 July 2026 We revise assumptions for accelerator roadmaps We assume ongoing 2-die GPU", "content": "EQUITY: JAPAN ELECTRONIC PARTSSemiconductor packaging industry updateGlobal Markets Research 28 July 2026 We revise assumptions for accelerator roadmaps We assume ongoing 2-die GPU configuration, look to earlier EMIB-T shipments for 4-die custom ASIC configurations Apr–Jun industry developments: Start of shipments for Rubin processors We think shipments of packages for Nvidia's Rubin GPUs got under way in 27/3 Q1. We expect full-scale mass production in Q2. Using macroeconomic statistics, we estimate monthly shipment value of ¥24.7bn in Jan–Mar and ¥25.8bn in Apr–May (¥28.1bn in May). The price per m² increased from ¥1.18mn in Jan–Mar to ¥12.9bn in Apr–May (¥13.6bn in May; Figure 1). We revise accelerator roadmap assumptions: 2-die configuration for GPUs, earlier shipments of EMIB-T There is a growing view in the packaging industry that the structure of the Rubin Ultra will be changed from four dies, which was announced at GTC in March, to two (see our 30 June 2026 Quick Note SemiAnalysis report on Rubin Ultra ), and some observers are starting to take the view that the Feynman will have a two-module structure with two dies in a 3D stacking configuration. It may have become technically difficult to combine interposers larger than the 5.5x reticle size with HBM4, which has a lot of wiring. We have revised our forecasts for Ibiden [4062] (Buy), with a downward revision for our 28/3 forecast for GPU package prices on the assumption that Rubin Ultra will use a 2-die configuration, contrasted with our new view that shipments of packages for EMIB-T will begin in 28/3, one year earlier than we previously thought. We only fine-tuned our profit forecasts as these positives and negatives more or less cancel each other out. EMIB-T is designed to embed silicon bridges without using interposers, making it easier to produce larger packaging substrates. We think this has resulted in strong demand for large package substrates that integrate more AI accelerator dies, HBM, and I/O, and we surmise that a growing number of custom ASIC manufacturers are considering using EMIB-T. The use of large packages can increase compute density within racks, increase memory and storage capacity, and increase signaling bandwidth, thereby enabling large- scale batch processing, reducing energy consumption per token, and reducing latency for agent models. At present, we think EMIB-T shipment volumes are being crimped by a lack of production capacity, but increasing capacity in a timely fashion could well offer earnings upside for 29/3 onwards. Advances in packaging technologies in view of update of agent models In agent-based coding models, performance (tokens per Watt per hour) is restricted by memory capacity and bandwidth between memory and GPU. The current design approach for accelerators is to increase the number of GPUs and amount of HBM per module by increasing package size, and we think this kind of design approach will become even more advantageous with growth in agent-based workloads. For example, using large packages to increase the amount of HBM per GPU will increase the proportion of weights and key-value cache that be stored in HBM, thereby reducing data transfer with host memory or SSDs. Moreover, including more GPUs in one module can increase bandwidth between the GPUs, both reducing the energy needed for signaling and increasing GPU utilization.Research Analysts Japan electronic parts Manabu Akizuki - NSC manabu.akizuki@nomura.com +81 3 6703 1185 See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts.Production Complete: 2026-07-28 15:12 UTC Reference figures Fig. 1: Price per m² for rigid module boards Note: Module boards have components mounted on the board surface. Source: Nomura, based on Ministry of Economy, Trade & Indu ld's most crowded trades has undergone a violentreset. Valuations have compressed, leverage has beenunwound and momentum has collapsed. The question is nolonger how far the unwind can go, but whether enough excesshas now been ﬂushed from the system.韩国⼈⼯智能热潮达到顶峰仅六周后，全球最拥挤的交易之⼀便经历了剧烈重置。估值压缩、杠杆解除、动能崩溃。问题已不再是抛售能持续多久，⽽是系统中是否已清除⾜够多的过剩泡沫。Mission accomplished 任务完成On June 16 (here), we argued that Korea's AI rally hadbecome increasingly driven by market structure rather thanfundamentals. The subsequent correction largely validatedthat view.6 ⽉ 16 ⽇（此处），我们曾指出韩国⼈⼯智能涨势已⽇益由市场结构⽽⾮基本⾯驱动。随后的回调在很⼤程度上验证了这⼀观点。Today, the KOSPI is testing its 200-day moving average andlong-term trend line, levels that seemed out of reach justweeks ago. Our downside thesis has largely played out.今天，韩国综合股价指数（KOSPI）正在测试其 200 ⽇移动均线和⻓期趋势线，⽽这些⽔平在⼏周前似乎还遥不可及。我们的下跌预期基本已得到验证。The charts below revisit the warning signs we highlightedthen, and assess where the unwind stands today.以下图表回顾了我们当时强调的警示信号，并评估当前市场调整的进展。 Source: LSEG Workspace 来源：LSEG Workspace Very oversoldWith the KOSPI RSI down to 31, the index is at its mostoversold level in a very long time. A contrarian bounce wouldhardly be surprising, but the AI hangover is unlikely todisappear overnight. The excesses built up over recentmonths will take time to work through the system.随着韩国综合股价指数（KOSPI）相对强弱指标（RSI）降⾄ 31，该指数已处于⻓期以来的最超卖⽔平。出现逆势反弹并不令⼈意外，但⼈⼯智能（AI）热潮的后续影响不太可能⼀夜消散。近⼏个⽉积累的过度膨胀需要时间才能被市场消化。 Source: LSEG Workspace That was quickThe weekly chart highlights just how extraordinary thecorrection has been. The KOSPI's weekly RSI has fallen to itslowest level on record, marking the sharpest collapse inweekly momentum we've ever seen.周线图凸显了此次回调的异常剧烈程度。KOSPI 的周线RSI 已跌⾄历史最低⽔平，标志着我们所⻅过的周线动能最急剧的崩溃。 Source: LSEG Workspace 来源：LSEG Workspace Nothing is forever 没有什么是永恒的SK Hynix, the poster child of Asia's AI mania, has completeda full round trip. The post-earnings sell-oﬀ brieﬂy pushed thestock into its long-term trend line and 200-day movingaverage. Momentum is now deeply oversold, but historysuggests that unwinding crowded trades is a process, not anevent.作为亚洲⼈⼯智能热潮的典型代表，SK 海⼒⼠已⾛完⼀个完整的轮回。财报发布后的抛售潮⼀度将该股推⾄⻓期趋势线及 200 ⽇移动均线附近。当前动能已深度超卖，但历史经验表明，拥挤交易的平仓是⼀个过程，⽽⾮⼀次性事件。 Source: LSEG Workspace 来源：LSEG Workspace There were signs 已有迹象Earlier this summer, Goldman highlighted one of the clearestsigns of AI euphoria: the 2x leveraged SK Hynix ETF hadbecome the world's largest single-stock leveraged ETF by awide margin. When one of the market's most crowded tradesis also one of its most leveraged, volatility tends to becomeself-reinforcing.今年夏初，⾼盛指出了⼈⼯智能热潮最明显的迹象之⼀：2倍杠杆的 SK 海⼒⼠ ETF 已⼤幅领先，成为全球最⼤的单⼀股票杠杆 ETF。当市场上最拥挤的交易同时也是杠杆率最⾼的交易之⼀时，波动性往往会⾃我强化。That is precisely what has unfolded. Many investors have nowexperienced the brutal mathematics of leverage in reverse.这正是已经发⽣的情况。如今，许多投资者都亲身体验了杠杆反向运作的残酷数学原理。 Source: GS The hangover isn't over 这场宿醉尚未结束BofA estimates Korean equities attracted roughly US$16billion of inﬂows over the past four weeks. With so muchcapital having chased the rally into the peak, positioning isunlikely to reset overnight despite increasingly oversoldtechnicals.美银估计，过去四周韩国股市吸引了约 160 亿美元的资⾦流⼊。由于⼤量资⾦在⾏情⻅顶时追涨，尽管技术⾯已⽇益超卖，但仓位调整不太可能在⼀夜之间完成。 Source: BofA3160TRENDING ON ZEROHEDGE 零对冲热⻔趋势Why, Oh Why Do They Do This?为什么，哦，为什么他们要这样做？Fragile Iran 'Pause' Shattered As US Base In JordanComes Under Attack, Oil Soars脆弱的伊朗“暂停”被打破，美军驻约旦基地遭袭，油价飙升How Does A Political Party Leader Survive This?政党领袖如何挺过这⼀切？SHOW COMMENTS 2026/7/29 18:52⻚码/gid1431/1 . xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq . xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq . xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq . xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq. xxpq . xxpq. xxpq. xxpq. xxpq. xxpq. ⻓⽚向短剧、直播、互动剧等多元 场景拓展，公司数字⼈技术与内容分发平台的协同效应将进⼀步释放，构筑差异化竞争壁垒。\u0001 巨⼈⽹络：国内⽼牌游戏⻰头，旗下拥有《征途》系列、《球球⼤作战》等⻓⽣命周期IP矩阵。《征 途》IP深耕近⼆⼗年，⽤⼾基数庞⼤且付费意愿稳定；《球球⼤作战》作为休闲竞技类头部产品持续 贡献稳健流⽔，强⼤的IP储备为公司提供了稳固的基本盘和持续的内容迭代空间。7⽉游戏版号发放 197款创近五年单⽉新⾼，版号审批已进⼊常态化、批量化阶段，公司在研的多个储备项⽬有望加速获 批并推向市场，新品上线节奏的确定性⼤幅提升。以往因版号不确定性导致的估值折价有望获得修 复，市场对公司Pipeline的价值重估正在展开。公司积极将AI技术融⼊游戏研发与运营全流程，在美术 资源⽣成、NPC智能对话、剧情动态⽣成等环节引⼊AIGC⼯具，有效降低研发成本并缩短开发周期， 同时AI赋能运营端，通过智能⽤⼾画像和个性化推荐提升付费转化率，驱动单⽤⼾价值持续攀升。\u0001 ◇相关公司：\u0001 完美世界（游戏+影视）、三七互娱（游戏发⾏）、吉⽐特（精品游戏研发）、恺英⽹络（游戏运 营）、蓝⾊光标（AI营销）\u0001ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408 机会⼀、⼤消费\"筹码出清+政策暖⻛\"双共振，⽩酒板块引领⾼低切换⾏情\u0001 ◆事件：7⽉30⽇，国务院正式批复《扩⼤消费\"⼗五五\"规划》，出台28条具体举措，明确提出到 2030年社会消费品零售总额达到60万亿元的战略⽬标，涵盖⼤宗消费升级、服务消费扩容、新型消费 培育三⼤主线。同⽇，⻜天茅台直营店零售价上调⾄1719元/瓶，标志着⾼端⽩酒价格天花板再次打 开。⼆级市场上，酒ETF今⽇盘中⼀度涨超4%，近15个交易⽇累计涨幅达17%；消费ETF同步跟涨 2%。⻝品饮料板块Q2基⾦持仓⽐例降⾄1.5%的历史冰点，⽩酒配置系数分位数归零，筹码结构极度 ⼲净。与此同时，前期⾼位科技板块资⾦加速溢出，北向资⾦连续三⽇净流⼊消费赛道，资⾦\"⾼低切 换\"信号明确。\u0001 ○产业逻辑：⼤消费板块当前正处于\"政策底+筹码底+估值底\"三底共振的⻩⾦窗⼝期。政策端，《扩 ⼤消费\"⼗五五\"规划》是近年来层级最⾼、覆盖⾯最⼴的消费刺激顶层设计，28条举措覆盖汽⻋、家 电、餐饮、⽂旅、免税等核⼼消费场景，政策执⾏周期横跨2026―2030年，具有极强的持续性和确定 性。筹码端，⻝品饮料板块基⾦超配⽐例已从2021年⾼峰的8%以上降⾄Q2的1.5%，⽩酒配置系数分 位数归零意味着主动基⾦⼏乎\"清零\"了⽩酒仓位，极少的增量资⾦就能撬动显著的估值修复弹性。估 值端，⽩酒板块当前PE已回落⾄近⼗年20%分位以下，五粮液、泸州⽼窖等⼀线标的PEG已跌破1倍。 ⻜天茅台直营店提价⾄1719元，不仅直接增厚茅台⾃⾝利润，更重要的是为整个⽩酒⾏业打开了价格 天花板。本轮消费⾏情并⾮短期博弈，⽽是\"政策驱动+筹码反转+估值修复\"三重逻辑下的中期趋势性 机会。\u0001 ◇核⼼公司：\u0001 五粮液：浓⾹型⽩酒绝对⻰头，品牌⼒仅次于茅台，在千元价格带具备垄断性竞争优势。⻜天茅台直 营店提价⾄1719元，直接拉⾼了⾼端⽩酒整体价格中枢，五粮液作为千元价格带王者，渠道价差与茅 台之间的⽐价关系决定了其存在明确的跟随提价空间，当前批价950元左右处于历史低位，若顺利提价 ⾄1000元以上，将直接增厚公司净利润10%―15%。基⾦持仓⽅⾯，五粮液机构配置⽐例已降⾄近五 年最低⽔平，Q2主动基⾦持仓占⽐不⾜1%，筹码出清极为彻底，任何边际资⾦的重新流⼊都将带来显 著的股价弹性。估值层⾯，五粮液当前PE仅18倍，处于近⼗年10%分位，PEG已跌破0.8倍，未来三年 净利润复合增速预计仍维持12%―15%，增⻓确定性与估值性价⽐在消费板块中极为突出。\u0001 中国中免：国内免税⾏业绝对⻰头，市场份额超过85%，在海南离岛免税和机场免税两⼤核⼼渠道上 均具有不可替代的牌照壁垒和规模优势。《扩⼤消费\"⼗五五\"规划》明确将免税经济列为服务消费扩 容的重点⽅向，市内免税店政策有望在2026年下半年加速落地，中国中免作为唯⼀拥有全国性市内免 税牌照的运营商，将在北京、上海、⼴州、成都等核⼼城市率先开设市内免税店，预计中期可为公司 贡献200―300亿增量营收，成为继海南离岛免税之后的第⼆增⻓极。短期来看，海南旅游旺季叠加离 岛免税购物额度提升预期，公司Q3营收有望实现环⽐30%以上增⻓；当前股价已从⾼点回撤超70%， PE回落⾄25倍历史中枢以下，筹码经过两年充分出清，中线修复空间可观。\u0001 ◇相关公司：\u0001 贵州茅台（⽩酒⻰头）、 5.24万亿元，服务5.81亿⼈次，总资产达1.48万亿元，侧⾯印证居⺠消费韧性与结构升级趋势。与此同 时，\"消费⼗五五\"规划明确提出2030年社会消费品零售总额达到60万亿元⽬标，以收⼊分配改⾰、社 保体系完善、消费环境优化为三⼤政策⽀柱，从供给侧推动消费市场扩容。6⽉社零数据环⽐回正释放 积极信号，⽽公募基⾦⼤消费板块重仓已连续9个季度下滑⾄历史最低位，筹码出清充分，板块估值具 备较强修复弹性。结构上看，服务消费延续领跑态势，AI+消费融合场景成为新的关注焦点，具备渠道 和数字化能⼒的⻰头企业有望率先受益。(中国中免，王府井)\u0001 AI应⽤\u0001―\u0001政策密集加码，三条赛道兑现窗⼝打开\u0001 AI应⽤领域近期迎来政策与产业双轮驱动。7⽉30⽇MCP/AI智能体概念持续催化，恒锋信息⼤涨 13.51%，税友股份与泛微⽹络双双封板，板块赚钱效应扩散。政策层⾯，7⽉27⽇⼯信部与国资委密 集出台重磅⽂件：第⼆批央企AI应⽤场景清单正式发布，叠加智能软件⼯⼚筑基⾏动，为国产AI应⽤提 供明确的落地场景和资⾦⽀持。产业端，腾讯WorkBuddy正式登陆鸿蒙系统，3个⽉内PC端⽉访问量 突破2097万，验证了AI办公产品在B端的快速渗透能⼒。当前国内⼿机端AI原⽣App触达约7.65亿⽤ ⼾，C端普及率已具规模。综合来看，AI办公智能体、AI+垂直⾏业应⽤、AI情感陪伴三条赛道进⼊加 速兑现窗⼝，具备产品化和商业闭环能⼒的公司将迎来订单与业绩的双击。(恒锋信息，泛微⽹络，税 友股份)\u0001 今⽇市场挖掘的：个股消息\u0001 永⿍股份：【⼦公司获11.33亿元光芯⽚⼤单】7⽉29⽇晚公告，控股⼦公司苏州⿍芯近⼀⽉收到A/B客 ⼾⼤功率激光器芯⽚订单合计约11.33亿元（含税）。A客⼾5.42亿元（交付⾄2027年底），B客⼾0.87 亿美元约5.91亿元（交付⾄2028年初），实现规模化出⼝。公司是光通信及光芯⽚核⼼⼚商，受益AI 算⼒⾼速增⻓。70mW\u0001CW-DFB及100G\u0001EML产品已批量供货，⾼端光芯⽚布局深化。\u0001 ⾚峰⻩⾦：【⽼挝塞班⾦铜矿增储143%，⻩⾦当量增⾄260吨】7⽉30⽇公告，控股⼦公司万象矿业 完成SND⾦铜矿第⼆阶段钻探，⻩⾦当量⾦属量由107吨增⾄260吨（+143%），增储效果显著。控制 资源量⾦96吨+铜45万吨，推断资源量⾦76吨+铜36万吨，⾦回收率88%，铜回收率88.5%。公司是⽼ 挝最⼤⻩⾦矿业运营商，塞班矿资源量跨越式增⻓为未来产量提升奠定基础，叠加⾦价⾼位运⾏，业 绩弹性可期。\u0001 百胜中国：【Q2业绩略超预期，收⼊同⽐增13%】26Q2收⼊31.38亿美元同⽐+13%（剔除汇率 +6%），经营利润3.48亿美元同⽐+14%，经营利润率11.1%，归⺟净利润2.44亿美元同⽐+14%（剔 除汇率+6%）。肯德基与必胜客同店销售持续改善，数字化及外卖业务稳步推进。公司是中国最⼤餐 饮连锁企业，运营超1.6万家餐厅，凭借强供应链与品牌⼒持续提升市占率，消费弱复苏下展现良好经 营韧性。\u0001 兔宝宝：【上半年AB板双位数增⻓，乡镇渠道⾼增30-40%】调研显⽰H1\u0001AB板合计折算双位数增⻓， 家具⼚合作超4万家（⾏业共7万+），渠道渗透率⾏业领先。乡村渠道近3年累计建成3800多家乡镇 店，25年乡镇营收同⽐+44%（规模约⼗⼏亿），26H1同⽐+30-40%，增⻓势头强劲。头部装企合作 业务同步增⻓。全屋定制受⾏业影响略有下滑但优于同⾏。公司是中国装饰板材⻰头，渠道下沉战略 成效显著。\u0001 中国巨⽯：【电⼦布7⽉涨价，8⽉涨幅预计更⼤，库存极低】调研显⽰7⽉7628布涨价1.2元/⽶，8⽉ 预计涨幅⾼于7⽉（⾏业预计1.5元/⽶），涨价后普通电⼦布价格将超10元/⽶。现阶段到明年Q2⽆织 布机新增产能，⾏业供需差持续⽀撑价格。当前产品库存⽔平极低，供给端偏紧格局明确。公司是全 球玻纤⾏业绝对⻰头，电⼦布市占率全球领先，本轮涨价周期中业绩弹性突出，盈利能⼒有望持续改 善。\u0001 华海药业：【⾸款创新药IL-36单抗成功上市，创新转型⾥程碑】7⽉29⽇控股⼦公司华奥泰的瑞西奇 拜单抗注射液（华亦净）获NMPA批准上市，⽤于泛发性脓疱型银屑病（GPP），系国内⾸个⾃研IL- 36R⼈源化单抗，全球仅勃林格殷格翰有同类药。研发投⼊约2.59亿元，注册分类为治疗⽤⽣物制品1 类。公司是国内仿制药出⼝⻰头，此次创新药上市标志着从仿制药向创新药转型升级的重要⼀步，管 线价值重塑空间打开。\u0001 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408", "status": "extracted"}, "post:2026-07-30T08-37:76a872a934e8": {"id": "post:2026-07-30T08-37:76a872a934e8", "kind": "post", "title": "2026-07-30 08:37", "source_label": "帖子正文", "excerpt": "美股光通信龙头Lumentum已同意向磷化铟基板供应商AXT支付4,350万美元的初始定金。#文字观点", "content": "美股光通信龙头Lumentum已同意向磷化铟基板供应商AXT支付4,350万美元的初始定金。#文字观点", "publish_time": "2026-07-30 08:37", "tags": ["文字观点"]}, "attachment:files/GS-联亚光电（3081.TWO）：800G1.6T硅光模块放量驱动三季度环比增长，扩产把握强劲需求.pdf": {"id": "attachment:files/GS-联亚光电（3081.TWO）：800G1.6T硅光模块放量驱动三季度环比增长，扩产把握强劲需求.pdf", "kind": "attachment", "title": "GS-联亚光电（3081.TWO）：800G1.6T硅光模块放量驱动三季度环比增长，扩产把握强劲需求", "source_label": "GS", "excerpt": "EQUITY: JAPAN ELECTRONIC PARTSSemiconductor packaging industry updateGlobal Markets Research 28 July 2026 We revise assumptions for accelerator roadmaps We assume ongoing 2-die GPU", "content": "EQUITY: JAPAN ELECTRONIC PARTSSemiconductor packaging industry updateGlobal Markets Research 28 July 2026 We revise assumptions for accelerator roadmaps We assume ongoing 2-die GPU configuration, look to earlier EMIB-T shipments for 4-die custom ASIC configurations Apr–Jun industry developments: Start of shipments for Rubin processors We think shipments of packages for Nvidia's Rubin GPUs got under way in 27/3 Q1. We expect full-scale mass production in Q2. Using macroeconomic statistics, we estimate monthly shipment value of ¥24.7bn in Jan–Mar and ¥25.8bn in Apr–May (¥28.1bn in May). The price per m² increased from ¥1.18mn in Jan–Mar to ¥12.9bn in Apr–May (¥13.6bn in May; Figure 1). We revise accelerator roadmap assumptions: 2-die configuration for GPUs, earlier shipments of EMIB-T There is a growing view in the packaging industry that the structure of the Rubin Ultra will be changed from four dies, which was announced at GTC in March, to two (see our 30 June 2026 Quick Note SemiAnalysis report on Rubin Ultra ), and some observers are starting to take the view that the Feynman will have a two-module structure with two dies in a 3D stacking configuration. It may have become technically difficult to combine interposers larger than the 5.5x reticle size with HBM4, which has a lot of wiring. We have revised our forecasts for Ibiden [4062] (Buy), with a downward revision for our 28/3 forecast for GPU package prices on the assumption that Rubin Ultra will use a 2-die configuration, contrasted with our new view that shipments of packages for EMIB-T will begin in 28/3, one year earlier than we previously thought. We only fine-tuned our profit forecasts as these positives and negatives more or less cancel each other out. EMIB-T is designed to embed silicon bridges without using interposers, making it easier to produce larger packaging substrates. We think this has resulted in strong demand for large package substrates that integrate more AI accelerator dies, HBM, and I/O, and we surmise that a growing number of custom ASIC manufacturers are considering using EMIB-T. The use of large packages can increase compute density within racks, increase memory and storage capacity, and increase signaling bandwidth, thereby enabling large- scale batch processing, reducing energy consumption per token, and reducing latency for agent models. At present, we think EMIB-T shipment volumes are being crimped by a lack of production capacity, but increasing capacity in a timely fashion could well offer earnings upside for 29/3 onwards. Advances in packaging technologies in view of update of agent models In agent-based coding models, performance (tokens per Watt per hour) is restricted by memory capacity and bandwidth between memory and GPU. The current design approach for accelerators is to increase the number of GPUs and amount of HBM per module by increasing package size, and we think this kind of design approach will become even more advantageous with growth in agent-based workloads. For example, using large packages to increase the amount of HBM per GPU will increase the proportion of weights and key-value cache that be stored in HBM, thereby reducing data transfer with host memory or SSDs. Moreover, including more GPUs in one module can increase bandwidth between the GPUs, both reducing the energy needed for signaling and increasing GPU utilization.Research Analysts Japan electronic parts Manabu Akizuki - NSC manabu.akizuki@nomura.com +81 3 6703 1185 See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts.Production Complete: 2026-07-28 15:12 UTC Reference figures Fig. 1: Price per m² for rigid module boards Note: Module boards have components mounted on the board surface. Source: Nomura, based on Ministry of Economy, Trade & Industry’s Current Survey of Production Fig. 2: Rigid PCB production value Source: Nomura, based on Ministry of Economy, Trade & Industry’s Current Survey of Production Nomura | Semiconductor packaging industry update 28 July 2026 2 9WuZmXzWsUrOoRtM7NdN9PoMrRtRtNfQnNrOkPoMxOaQpOpOuOmNmQuOnPoP Fig. 3: PLP interposer-based 3.5D packaging Source: Nomura Fig. 4: EMIB-based 3.5D packaging Source: NomuraNomura | Semiconductor packaging industry update 28 July 2026 3 Appendix A-1 This report has been produced by Nomura Securities Co., Ltd. (NSC), Japan. See Disclaimers for Nomura Group entity details. Analyst Certification I, Manabu Akizuki, hereby certify (1) that the views expressed in this Research report accurately reflect my personal views about any or all of the subject securities or issuers referred to in this Research report, (2) no part of my compensation was, is or will be directly or indirectly related to the specific recommendations or views expressed in this Research report and (3) no part of my compensation is tied to any specific investment banking transactions performed by Nomura Securities International, Inc., Nomura International plc or any other Nomura Group company. Important Disclosures The lists of issuers that are affiliates or subsidiaries of Nomura Holdings Inc., the parent company of Nomura Securities Co., Ltd., issue document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
