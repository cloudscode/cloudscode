备调试试生产阶段。 第三个工厂是与 Stellantis 合资建设，双方各持股 50%，总规划产能 50GWh，于 2025 年 11 月动工建设，计划 2027 年初实现电池初步生产。 亿纬锂能在匈牙利布局约 30GWh 产能，于 2025 年 9 月完成机电设备进场安装，工厂有望在 2027 年投产，主要生产 46 系列大圆柱电池，配套宝马新时代车型。 国轩高科在欧洲有两个工厂：德国哥廷根工厂和斯洛伐克工厂。 德国哥廷根工厂布局较早，2021 年开始布局，通过收购博世旧厂房改造，首期 5GWh 产能已投产，总规划 20GWh，分四期建设。 斯洛伐克工厂规划 20GWh，2023 年项目筹划，2025 年 10 月开工建设，计划 2026 年试生产，主要生产磷酸铁锂动力电池。 材料公司方面，当升科技在芬兰合资建设工厂，持股比例为公司 70%，芬兰矿业集团 28%，LG 2%。合计规划约 50 万吨产能，包括 20 万吨多元材料、30 万吨磷酸锰铁锂和磷酸铁锂。 2025 年已进入厂房封顶阶段，目标 2027 年开始商业化生产。 另一家正极公司湖南裕能在西班牙规划约 5 万吨磷酸铁锂正极产能，远期有望扩展至 30 万吨，以强化本土交付能力。 目前 5 万吨产能已取得所有必要建设许可证，2026 年 5 月进入施工阶段，有望 2027 年投产。 容百科技在波兰基地规划 2.5 万吨三元正极材料，有望 2026 年下半年完成建设。 电解液环节，新宙邦在波兰建设两期工厂。一期 4 万吨，于 2022 年完成设备调试，2023 年 4 月正式投产。 二期计划新增 5 万吨电解液产能，于 2025 年 12 月公告，在一期工厂改造扩建，建设周期不超过两年。建成后，公司欧洲布局约 9 万吨电解液。 天赐材料在北非摩洛哥筹建 15 万吨电解液一体化项目，目前项目已启动建设，有望 2028 年投产。 隔膜环节，恩捷在匈牙利布局两期工厂。一期 4 亿平方米隔膜产能，于 2024 年进行产能爬坡。 二期规划 8 亿平方米隔膜及涂覆产能，公司正积极推进相关项目建设。 负极材料方面，杉杉股份在芬兰布局约 10 万吨负极一体化产能，分两期建设，一期 5 万吨已取得环评，正在启动土建工程，公司不断强化负极布局。 结构件环节，科达利在匈牙利、德国和瑞典均有布局，以强化本土结构件配套能力。 匈牙利工厂一期于 2020 年 11 月立项，2021 年土建开工，目前已建成投产，公司正积极规划二期和三期产能。 德国工厂已完成产线建设并投产。 瑞典工厂是公司布局最早的欧洲工厂，2021 年开始建设，目前已投产。 总体来看，锂电产业链公司，包括电池和材料公司，均在欧洲布局，相关产能将在 2026 年底或 2027 年逐步释放，以满足本土交付要求。 因此，欧盟委员会近期提出的法案对这些公司的影响相对较小，可通过本土制造化规避。 接下来回顾近期产业链高频数据。欧洲新能源车销量方面，今年保持持续强势增长。 9 月份，欧洲九国新能源车销量达到 42 万辆，同比增长 45%，渗透率达 37%，同比增长近 9 个百分点。 1 至 7 月，欧洲九国新能源车累计销量达 215 万辆，同比增长 37%，需求保持强劲。 全球动力电池方面，根据 SNE 数据，7 月份全球动力电池装车量为 117GWh，同比增长 35%。 1 至 7 月累计装车量达 725GWh，同比增长 20%，保持增长态势。 储能电池方面，根据动力电池产业创新联盟数据，7 月份国内电池储能电池销量达 56GWh，同比增长 55%。 1 至 7 月累计销量 374GWh，同比增长 79%，保持高速增长。 出口方面，7 月单月出口量 11GWh，同比增长 33%；1 至 7 月累计出口量 70GWh，同比增长 29%。 国内外储能需求均保持增长，支撑产能消化。 接下来介绍锂电池产业链整体情况。需求方面，国内储能需求有所担忧，但 8 月以来出现积极迹象。 招标方面，根据寻熵研究院数据，9 月份国内招标已超过 87GWh，创下 2026 年单月新高。 1 至 7 月国内储能装机同比下跌已逐渐收复，年内装机基本持平。 动力方面，在欧洲动力高增和国内单车带电量提升的带动下，全球动力电池装机保持 20% 增长。 近期产业链数据显示，9 月电池排产环比增长 6%，正极、电解液、负极等环节环比增长 5% 左右，隔膜环节受产能限制，环比小幅增长。 整体下游需求旺盛。 在能源价格波动和高企的背景下，海外储能需求有望维持高增趋势。 国内储能项目经济性较好，招标数据预示后续需求旺盛。 公司业绩方面，头部电池公司如宁德时代、亿纬锂能、鹏辉能源、中创新航等，2027 年估值在 8 至 13 倍左右；隔膜环节如佛塑科技、恩捷股份、星源材质，估值约 12 倍，整体处于低位。 在动力储能需求稳定增长的背景下，这些公司具有安全边际。 建议在低估值区间积极配置动力储能电池领先公司及隔膜领先公司，并关注铝箔领先公司鼎胜新材和结构件公司科达利，其估值相对偏低。#文字观点", "publish_time": "2026-09-11 08:06", "tags": ["文字观点"]}, "post:2026-09-11T08-46:49b013e07afd": {"id": "post:2026-09-11T08-46:49b013e07afd", "kind": "post", "title": "2026-09-11 08:46", "source_label": "帖子正文", "excerpt": "🌊豪鹏科技线下交流更新：消费电子业务全面AI化，AIDC储能及机器人打开空间（9.10）#战略All in AI端侧和AIDC，设置三条增长主线，消费电子全面AI化、储能业务全面向AIDC方向突破、机器人打开更大的成长空间。#AI端侧AI眼镜赛道预计2030年全球市场出货量将突破2亿台，客户包括me", "content": "🌊豪鹏科技线下交流更新：消费电子业务全面AI化，AIDC储能及机器人打开空间（9.10）#战略All in AI端侧和AIDC，设置三条增长主线，消费电子全面AI化、储能业务全面向AIDC方向突破、机器人打开更大的成长空间。#AI端侧AI眼镜赛道预计2030年全球市场出货量将突破2亿台，客户包括meta、理想、雷鸟、Rokid，公司占meta份额约40%，公司是雷鸟钢壳叠片电池的独供，未来方形钢壳叠片将成为高端AI端侧产品的主流标配。#AIDC定增3GWh电芯产能预计全部给AIDC，最近在与台达、施耐德、伊顿沟通，预计今年送样通过。公司即将面向客户送样的第一代产品包括面向AIDC UPS赛道的85安时高倍率锂电芯和55安时高倍率钠电芯，同时还将推出面向AIDC长时储能配置的588安时电芯，可支持2到8小时的储能配置。#机器人公司机器人业务2026年相关配套收入接近1亿元，明年2亿以上，未来至少每年翻倍增长，绑定的核心客户包括智元、智身（豪鹏投资5000w）、优必选。#业绩展望公司2028年营收目标为100亿元左右，净利率7.5%，营收中30%由AI端侧业务贡献，其中AIPC、AI眼镜、AI玩具为核心构成。 【GHDX】邱迪13120302425、王刚、谭甘露13658107736、吴亦辰、王泽麟、张潇#文字观点", "publish_time": "2026-09-11 08:46", "tags": ["战略", "AI端侧", "AIDC", "机器人", "业绩展望", "文字观点"]}, "post:2026-09-11T14-12:2447b017fca5": {"id": "post:2026-09-11T14-12:2447b017fca5", "kind": "post", "title": "2026-09-11 14:12", "source_label": "帖子正文", "excerpt": "📑摩根大通 —— 锂行业：中国市场持续偏紧，需求韧性延续但未来几年缺口将收窄；维持对 PLS、LTR 的 “增持” 评级📌一、核心观点与评级 📄摩根大通亚太股票研究团队发布锂行业更新报告，指出在经历 2026 年二季度的阶段性过剩后，中国市场供需平衡自 6 月起逐月趋紧，8 月已成为年内供需最紧的月", "content": "📑摩根大通 —— 锂行业：中国市场持续偏紧，需求韧性延续但未来几年缺口将收窄；维持对 PLS、LTR 的 “增持” 评级📌一、核心观点与评级 📄摩根大通亚太股票研究团队发布锂行业更新报告，指出在经历 2026 年二季度的阶段性过剩后，中国市场供需平衡自 6 月起逐月趋紧，8 月已成为年内供需最紧的月份。 📊尽管需求端储能（ESS）表现强劲，但中国电动车（EV）销售疲软，叠加供应端扰动，整体供需缺口较此前预测有所收窄。 ✅摩根大通维持对 Pilbara Minerals（PLS）和 Liontown Resources（LTR）的 “增持” 评级，对 IGO 维持 “中性” 评级。 💰目标价方面，PLS 目标价从 7.00 澳元下调至 6.70 澳元（期限 2027 年 6 月），LTR 从 1.50 澳元下调至 1.40 澳元，IGO 从 7.60 澳元下调至 7.20 澳元。 📉估值调整主因锂价预测下修，但 PLS 当前 0.75 倍的 P/NPV 仍具吸引力，LTR 在预期平淡的三季度后有望重拾增长动能。 📌二、中国市场供需：8 月为年内最紧月份 📈上海有色网（SMM）数据显示，2026 年 6-8 月中国锂盐供需平衡连续录得更深的赤字。 🔍这一变化由多重因素驱动：津巴布韦锂矿出口下降（7 月为年内最低）、源头内容加微WUXL3408碳酸锂社会库存去化，以及储能需求持续强劲。 ⚠️值得注意的是，SMM 新纳入了金属加工副产品（如铝浮渣、钨矿冶炼渣）提锂的供应来源，年化产量约 5 万吨 LCE（2025 年仅约 1 万吨），这一此前未被覆盖的供应增量需进一步评估其增长前景、经济性及海外复制可能性。 📋此外，SMM 新增的碳酸锂库存系列约增加 10 万吨库存，但摩根大通认为这并非新增库存，仅是统计口径调整带来的可见度提升。 📊综合来看，2026 年仍是供需最紧年份，2026-2028 年维持短缺，但缺口逐年收窄，2029 年转为小幅过剩。 📌三、需求端：储能超预期，电动车疲软 ⚡储能电池出货成为需求核心亮点。 📊2026 年前 7 个月全球储能电池出货约 614GWh，同比增长 96%，有望达到或超过摩根大通全年 1.1TWh（+78% YoY）的预测。 📅2027 年储能需求预计增长 32%。 🌍分区域看，中国国内储能招标与并网在 7-8 月回暖，海外需求保持强劲，大型储能项目维持健康增长，海外户储在二季度渠道补库后 7-8 月有所放缓，但 9 月预计恢复正常。 🚗电动车方面，中国 2026 年 EV 销量预计下降 9%，但年初至今实际表现更弱（同比下降 12%），从锂单位消费角度看，电池包大型化（平均容量同比增长 21%）部分抵消了销量下滑的影响。 📈全球电动车锂需求 2026-2028 年增速预计为 21%/15%/12%，2027 年需求预测暂未调整，但存在上行（储能）与下行（电动车）风险。 🔋另需关注的是，宁德时代（CATL）提出长期将钠离子电池占比提升至 30-40%，并预计 2026 年底前实现与锂电池的成本平价，但当前预测尚未反映该因素。 📌四、供应端：中国减产，澳洲增产，非常规供应涌现 ⛏️供应侧最大变量来自 CATL 的枧下窝云母矿，该矿自停产以来尚未公布复产日期，摩根大通据此下调了中国云母供应预测。 📈同时，澳洲 Greenbushes 产量近期有所上修（此前过于保守），P2000/Kathleen Valley 扩产提前，而 Mt Holland 推迟。 🌎加拿大 Elevra 和巴西 Sigma Lithium 的扩产节奏也进行了重新评估。 🧪非常规供应（金属加工副产品提锂）被纳入模型，2026 年作为价格激励下的高产出年份，贡献约 4 万吨 LCE，之后逐步回落至长期 1.5 万吨水平。 📊整体来看，2026 年全球锂供应预计增长 27%，2027 年增长 22%，而需求增速为 21%，供应过剩压力边际缓解。 📌五、价格预测：短期偏紧，2027 年见顶，之后回落 💹受供需缺口及库存低于趋势水平（2027 年可能迎来补库）支撑，摩根大通认为锂价短期前景依然积极，2027 年为本轮价格峰值年。 📝具体调整如下： ・📉锂辉石精矿（SC6）：2027 年预测下调约 13% 至 2,400 美元 / 吨，2028 年下调 16% 至 2,000 美元 / 吨，长期均价维持 1,500 美元 / 吨。 ・📉碳酸锂：2027/2028 年预测分别下调 12%/13% 至 24,300 美元 / 吨（约 24.3k / 吨）和 21,000 美元 / 吨。 ・📉氢氧化锂：调整幅度与碳酸锂类似，2027/2028 年分别降至 24,300 美元 / 吨和 21,000 美元 / 吨。 📌价格下修主因供需缺口收窄，但 2026-2028 年仍处于短缺状态，为价格提供底部支撑。 📌六、股票策略：首选 PLS，LTR 为次选，IGO 中性 ・✅Pilbara Minerals（PLS）：维持 “增持”，目标价 6.70 澳元。公司运营稳健、资产负债表强劲、增长前景明确，当前 P/NPV 仅 0.75 倍，估值具吸引力。2027/2028 财年 EBITDA 预测分别下调 10%/25% 至 23.35 亿 / 19.66 亿澳元，主因锂价假设下修。 ・✅Liontown Resources（LTR）：维持 “增持”，目标价 1.40 澳元。股价在发布低于市场预期的 2027 年指引后表现落后，但预计 9 月季（Sep-Q）平淡后，随着公司朝着 2027 财年末 280 万吨原矿年化处理能力目标推进，业务将重拾正增长动能。 ・⚖️IGO：维持 “中性”，目标价 7.20 澳元。股价围绕公允价值波动，市场对 Greenbushes 矿寿命（LoM）审查结果存在疲劳，且合资伙伴是否愿意扩大资产规模尚不明朗。#文字观点", "publish_time": "2026-09-11 14:12", "tags": ["文字观点"]}, "post:2026-09-11T11-18:4ed655b7714d": {"id": "post:2026-09-11T11-18:4ed655b7714d", "kind": "post", "title": "2026-09-11 11:18", "source_label": "帖子正文", "excerpt": "看好天孚通信、太辰光等 【银行：港银中报业绩向好，资产质量改善】1）香港银行业贷款增长率持续改善、HIBOR利率亦处于年内高位、财富管理市场增速明显，我们判断香港银行业净利息收入与", "content": "🌟HUATAI Morning Call Sep - 11🌟 🔹 日韩早盘大幅低开，WTI原油自5月底以来首次突破100美元关口，8月PPI环比+0.4%、同比+5.4%超预期，美国10年期国债收益率触及4.90%，市场对9月加息的预期概率已达70%。今晚即将公布美CPI数据。 🔹 昨日FCC在《联邦公报》刊登的组件规则，不是所谓的新政落地，已在 2026-07-22 通过、07-23 发布。新规则进一步规定：即便整机厂不在清单上，只要设备里用了 Covered List 企业生产的承担逻辑/控制/通信功能的关键硬件组件，整机也可能拿不到新的 FCC 设备授权；“光模块禁令”目前依然是此前路透社报道层面。 🔹 财新报道国内动力电池、储能电池新建项目暂时叫停；不再审批新项目，待 26 年底完成行业产能利用率考核之后，再确定后续项目建设资格。 📰9/11重点报告 【通信：光博会观察】1）光模块需求能见度仍然很高，瓶颈仍在供给，DSP芯片尤其是1.6T的是最紧缺的环节；2）新技术：CPO与NPO讨论度高且并行推进；3）光纤光缆：DCI与保偏光纤关注度高，光纤光缆进入北美数中心的准入门槛仍被市场低估；4）市场讨论的FCC规则为7月版本的刊登与生效准备、并非光模块禁令落地，中际旭创、新易盛对地缘摩擦反应已较充分，2027年估值性价比高，无需继续悲观；新技术对上游无源器件拉动显著，看好天孚通信、太辰光等 【银行：港银中报业绩向好，资产质量改善】1）香港银行业贷款增长率持续改善、HIBOR利率亦处于年内高位、财富管理市场增速明显，我们判断香港银行业净利息收入与非息收入均有望持续改善；2）银行高股息及避险优势有望吸引资金持续加强配置，香港银行在股东综合回报率方面具备明显优势，关注汇丰控股、渣打集团、中银香港#文字观点", "publish_time": "2026-09-11 11:18", "tags": ["文字观点"]}, "post:2026-09-11T09-18:594040c0a641": {"id": "post:2026-09-11T09-18:594040c0a641", "kind": "post", "title": "2026-09-11 09:18", "source_label": "帖子正文", "excerpt": "【AI数据中心被“卡脖子”，美国没把中国光模块纳入制裁】 9月11日｜美国联邦通信委员会(FCC)相关最终规则正式落地。", "content": "【AI数据中心被“卡脖子”，美国没把中国光模块纳入制裁】 9月11日｜美国联邦通信委员会(FCC)相关最终规则正式落地。此前市场最担心的一幕没有出现：中际旭创、新易盛、东山精密、天孚通信等中国光通信产业链企业，没有被直接纳入FCC的限制名单。最终规则把新增限制主要锁定在一个相对狭窄的范围：如果设备中使用了由FCC“Covered List”已列名企业生产的“带逻辑硬件组件”，相关设备可能无法获得FCC授权。FCC同时明确，没有采纳更激进的方案——例如把禁令扩大到所有由“外国对手”拥有或控制的企业生产的组件。#文字观点", "publish_time": "2026-09-11 09:18", "tags": ["文字观点"]}, "post:2026-09-11T07-27:960b79083870": {"id": "post:2026-09-11T07-27:960b79083870", "kind": "post", "title": "2026-09-11 07:27", "source_label": "帖子正文", "excerpt": "【造船行业更新】1-8月全球船舶新接订单量同比#翻倍以上增长，已超过25年全年接单量，充分印证行业高景气。", "content": "【造船行业更新】1-8月全球船舶新接订单量同比#翻倍以上增长，已超过25年全年接单量，充分印证行业高景气。全球新签订单数据逐月回溯更新，7月份订单大幅上修，预计8月份实际接单量也应更为乐观。 【相关标的】： -造船厂：#中国船舶、松发股份、#天顺风能、大金 三星电子与高通因价格分歧推迟2nm制程合同；半导体大会第二天核心要点强调AI adoption趋势与EDA软件。\n\n### 3. 宏观/原油/通胀\n- 主线：滞胀式资产定价与地缘油价上行，通胀与加息预期压制风险资产。\n- 今天强化的逻辑：隔夜资产中受益于通胀上行的原油+7%、天然气、能源上游股上涨，受益于增长与折现率的科技股、铜、白银、长久期国债下跌，抗通胀但怕加息的黄金-1.9%被夹在中间下跌；美债10Y逼近5%、30Y创2007年新高；财政与货币政策不确定性开始互相污染。\n- 今天出现的催化/验证：美国8月CPI略超预期；PPI数据公布后美联储9月加息概率升至70%；欧洲央行将三大关键利率上调25个基点；胡塞武装推进曼德海峡控制权，布伦特原油价格破百；WTI原油期货收于每桶102.48美元、涨幅6.69%，布伦特原油期货收于每桶107.63美元、涨幅6.34%；美国财政部9月10日进行价值51.87亿美元的10至20年期美国国债流动性回购操作。\n\n### 4. 光通信/CPO\n- 主线：FCC扰动阶段性出清，CPO与1.6T升级打开光通信测试及材料增量。\n- 今天强化的逻辑：FCC新规核心是堵“零部件漏洞”，限制的是Covered List实体生产的带逻辑、带数字处理能力的硬件组件；本次正式版本没有涉及光模块这个品类，并明确排除纯机械和无源器件等；制造、无源、被动组装等不改变信号的环节免审，而主动改变或管理信号的组件需认证。\n- 今天出现的催化/验证：CPO第27届光博会于9月9日-9月11日在深圳召开，聚焦算力集群规模扩张驱动的光互联架构升级，NPO、CPO与OCS等颠覆性架构工程化进展成为核心看点；联讯仪器在中国光通信测试仪器市场份额9.9%，位列第三、本土第一，海外厂商占约84%，国产化率空间大；800G整套核心仪器约40~50万元，1.6T整套价值量约为其4~5倍；CPO交换机可能测试PTFE配套方案。\n\n### 5. PCB/CCL/铜箔\n- 主线：上游材料涨价与高端升级，二线PCB提价与利润释放。\n- 今天强化的逻辑：CCL厂商调研纪要显示，PTFE无玻布+M9Q布混压路线2024年启动测试、2025年确定；成本拆分加工费50%、铜箔20%、硅粉20%、树脂10%；PTFE覆铜板本身成本低于传统布基高速CCL，但PCB加工抬升总成本；电子布、铜箔、CCL提价持续推进，高端产能挤占普通品供给，叠加AI需求推动材料升级。\n- 今天出现的催化/验证：HTE、RTF产品已启动加工费提价，HVLP高端产品持续导入；近期板块观点强调上游材料涨价与高端升级、二线PCB提价与利润释放，上游关注德福科技、宏和科技、生益科技；联瑞新材称CPO交换机可能测试PTFE配套方案，相当于从柜内switch tray和正交背板扩展至柜外CPO NPO交换机，属于纯增量。\n\n### 6. 液冷/电源/AIDC\n- 主线：高密度算力散热与供电升级，液冷原生项目及AIDC电源受关注。\n- 今天强化的逻辑：DMC两个月+70%验证小品种弹性；液冷原生项目研发超高密度液冷原生整机柜服务器，满足高功率密度算力集群对散热、供电、结构集成和智能运维的要求，配套推进预制化液冷数据中心快速交付系统；高密度装备制造升级南、北高密度算力产品及优化液冷整机柜生产。\n- 今天出现的催化/验证：浪潮信息9月11日发布定增预案，拟募资不超90亿元，智能体AI基础设施项目26亿元、液冷原生项目14亿元、高密度装备制造9亿元；液冷板块调研反馈显示产业趋势加速确认，三四季度英维克、冰轮环境、飞龙股份、金富科技、五洋自控等龙头有望陆续开；村田将于2027年量产用于AI的电容电感iPaS；金刚石GPU散热会议更新显示国内封装厂已为至少4-5家芯片厂商完成样品打样。\n\n## 三、今日重点关注\n\n### 3.1 今天已经发生的重点变化\n- OpenAI发布面向金融服务领域的ChatGPT，专为投资银行家和股票研究人员量身定制。\n- OpenAI ChatGPT Work上线Data agent，可连接公司数据、分析变化并生成可分享的交互式仪表盘。\n- 甲骨文FY2027Q1营收193.5亿美元（+30% YoY），Non-GAAP归母净利润58亿美元（+28% YoY），续约合同价格上涨20%。\n- 长鑫科技正为新的上海工厂准备设备投资。\n- 台积电获维持买入评级，12个月目标价新台币3,100元，对应2027年预期每股收益22倍市盈率。\n- 三星电子与高通因价格分歧推迟2nm制程合同。\n- FCC最终规则落地，未涉及光模块品类，明确排除纯机械和无源器件；制造、无源、被动组装等不改变信号的环节免审，主动改变或管理信号的组件需 \n\u003cli>今天强化的逻辑：DRAM产能扩张速度较慢，新建晶圆厂从洁净室建设到设备安装、产线测试至少需要两到三年，且必须保证高良率以避免亏损，使DRAM增产难度高于NAND，为其价格上涨提供可期待空间；企业强调AI驱动的结构性需求提升，客户能见度延长推动产能扩张；智能体AI正从系统到组件层面为服务和设备带来显著需求顺风。\u003c/li>\n\u003cli>今天出现的催化/验证：长鑫科技正为新的上海工厂准备设备投资；台积电获维持买入评级，12个月目标价新台币3,100元；三星电子与高通因价格分歧推迟2nm制程合同；半导体大会第二天核心要点强调AI adoption趋势与EDA软件。\u003c/li>\n\u003c/ul>\n\u003ch3>3. 宏观/原油/通胀\u003c/h3>\n\u003cul>\n\u003cli>主线：滞胀式资产定价与地缘油价上行，通胀与加息预期压制风险资产。\u003c/li>\n\u003cli>今天强化的逻辑：隔夜资产中受益于通胀上行的原油+7%、天然气、能源上游股上涨，受益于增长与折现率的科技股、铜、白银、长久期国债下跌，抗通胀但怕加息的黄金-1.9%被夹在中间下跌；美债10Y逼近5%、30Y创2007年新高；财政与货币政策不确定性开始互相污染。\u003c/li>\n\u003cli>今天出现的催化/验证：美国8月CPI略超预期；PPI数据公布后美联储9月加息概率升至70%；欧洲央行将三大关键利率上调25个基点；胡塞武装推进曼德海峡控制权，布伦特原油价格破百；WTI原油期货收于每桶102.48美元、涨幅6.69%，布伦特原油期货收于每桶107.63美元、涨幅6.34%；美国财政部9月10日进行价值51.87亿美元的10至20年期美国国债流动性回购操作。\u003c/li>\n\u003c/ul>\n\u003ch3>4. 光通信/CPO\u003c/h3>\n\u003cul>\n\u003cli>主线：FCC扰动阶段性出清，CPO与1.6T升级打开光通信测试及材料增量。\u003c/li>\n\u003cli>今天强化的逻辑：FCC新规核心是堵“零部件漏洞”，限制的是Covered List实体生产的带逻辑、带数字处理能力的硬件组件；本次正式版本没有涉及光模块这个品类，并明确排除纯机械和无源器件等；制造、无源、被动组装等不改变信号的环节免审，而主动改变或管理信号的组件需认证。\u003c/li>\n\u003cli>今天出现的催化/验证：CPO第27届光博会于9月9日-9月11日在深圳召开，聚焦算力集群规模扩张驱动的光互联架构升级，NPO、CPO与OCS等颠覆性架构工程化进展成为核心看点；联讯仪器在中国光通信测试仪器市场份额9.9%，位列第三、本土第一，海外厂商占约84%，国产化率空间大；800G整套核心仪器约40~50万元，1.6T整套价值量约为其4~5倍；CPO交换机可能测试PTFE配套方案。\u003c/li>\n\u003c/ul>\n\u003ch3>5. PCB/CCL/铜箔\u003c/h3>\n\u003cul>\n\u003cli>主线：上游材料涨价与高端升级，二线PCB提价与利润释放。\u003c/li>\n\u003cli>今天强化的逻辑：CCL厂商调研纪要显示，PTFE无玻布+M9Q布混压路线2024年启动测试、2025年确定；成本拆分加工费50%、铜箔20%、硅粉20%、树脂10%；PTFE覆铜板本身成本低于传统布基高速CCL，但PCB加工抬升总成本；电子布、铜箔、CCL提价持续推进，高端产能挤占普通品供给，叠加AI需求推动材料升级。\u003c/li>\n\u003cli>今天出现的催化/验证：HTE、RTF产品已启动加工费提价，HVLP高端产品持续导入；近期板块观点强调上游材料涨价与高端升级、二线PCB提价与利润释放，上游关注德福科技、宏和科技、生益科技；联瑞新材称CPO交换机可能测试PTFE配套方案，相当于从柜内switch tray和正交背板扩展至柜外CPO NPO交换机，属于纯增量。\u003c/li>\n\u003c/ul>\n\u003ch3>6. 液冷/电源/AIDC\u003c/h3>\n\u003cul>\n\u003cli>主线：高密度算力散热与供电升级，液冷原生项目及AIDC电源受关注。\u003c/li>\n\u003cli>今天强化的逻辑：DMC两个月+70%验证小品种弹性；液冷原生项目研发超高密度液冷原生整机柜服务器，满足高功率密度算力集群对散热、供电、结构集成和智能运维的要求，配套推进预制化液冷数据中心快速交付系统；高密度装备制造升级南、北高密度算力产品及优化液冷整机柜生产。\u003c/li>\n\u003cli>今天出现的催化/验证：浪潮信息9月11日发布定增预案，拟募资不超90亿元，智能体AI基础设施项目26亿元、液冷原生项目14亿元、高密度装备制造9亿元；液冷板块调研反馈显示产业趋势加速确认，三四季度英维克、冰轮环境、飞龙股份、金富科技、五洋自控等龙头有望陆续开；村田将于2027年量产用于AI的电容电感iPaS；金刚石GPU散热会议更新显示国内封装厂已为至少4-5家芯片厂商完成样品打样。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>OpenAI发布面向金融服务领域的ChatGPT，专为投资银行家和股票研究人员量身定制。\u003c/li>\n\u003cli>OpenAI ChatGPT Work上线Data agent，可连接公司数据、分析变化并生成可分享的交互式仪表盘。\u003c/li>\n\u003cli>甲骨文FY2027Q1营收193.5亿美元（+30% YoY），Non-GAAP归母净利润58亿美元（+28% YoY），续约合同价格上涨20%。\u003c/li>\n\u003cli>长鑫科技正为新的上海工厂准备设备投资。\u003c/li>\n\u003cli>台积电获维持买入评级，12个月目标价新台币3,100元，对应2027年预期每股收益22倍市盈率。\u003c/li>\n\u003cli>三星电子与高通因价格分歧推迟2nm制程合同。\u003c/li>\n\u003cli>FCC最终规则落地，未涉及光模块品类，明确排除纯机械和无源器件；制造、无源、被动组装等不改变信号的环节免审，主动改变或管理信号的组件需认证。\u003c/li>\n\u003cli>浪潮信息发布定增预案，拟募资不超90亿元，投向智能体AI基础设施26亿元、液冷原生项目14亿元、高密度装备制造9亿元等。\u003c/li>\n\u003cli>美国8月CPI略超预期；PPI数据公布后美联储9月加息概率升至70%；欧洲央行将三大关键利率上调25个基点。\u003c/li>\n\u003cli>隔夜美股三大指数集体收跌，道指跌0.6%，纳指跌0.65%，标普500指数跌0.58%；国际原油大涨，WTI收于102.48美元/桶、涨幅6.69%，布伦特收于107.63美元/桶、涨幅6.34%；国际金银大跌，美债收益率上升。\u003c/li>\n\u003cli>A股与港股复盘显示放量普跌、AI硬件逆势；沪指跌1.18%，深证成指跌1.08%，创业板指跌0.49%，科创50跌1.01%。\u003c/li>\n\u003cli>美国财政部9月10日进行价值51.87亿美元的10至20年期美国国债流动性回购操作。\u003c/li>\n\u003cli>胡塞武装推进曼德海峡控制权，布伦特原油价格破百。\u003c/li>\n\u003cli>1-8月全球船舶新接订单量同比翻倍以上增长，已超过25年全年接单量；7月份订单大幅上修，预计8月份实际接单量也应更为乐观。\u003c/li>\n\u003cli>欧盟提出公共采购法法案提案，源于2026年3月欧盟委员会提出的工业加速法法案草案（IAA），针对锂电池在欧盟的投资设置限定条件，并对电动汽车锂电池引入欧盟原产地要求。\u003c/li>\n\u003cli>7月国内电池储能电池销量达56GWh，同比增长55%。\u003c/li>\n\u003cli>京东获增持评级，目标价148港元/38美元；唯品会获增持评级，目标价17美元；拼多多获中性评级，目标价95美元；阿里巴巴云与电商业务盈利同步改善，重申增持评级。\u003c/li>\n\u003cli>摩根大通锂行业更新指出，中国市场供需平衡自6月起逐月趋紧，8月已成为年内供需最紧的月份，维持对PLS、LTR的增持评级。\u003c/li>\n\u003cli>SpaceX在科技大会上重申2027年每GW算力收入预期为300亿至500亿美元；星链移动正专注于2028年上半年推出5G质量移动服务所需构建模块；英国政府对SpaceX相关卫星通信服务采购金额已接近4000万美元。\u003c/li>\n\u003cli>第七批国家组织医用耗材集采在天津开标产生拟中选结果，纳入23种消化介入类医用耗材，156家企业558个产品投标，148家企业517个产品中选。\u003c/li>\n\u003cli>江南布衣业绩会要点：FY27保持稳健正增长，分红率保持75%有信心。\u003c/li>\n\u003cli>泉峰控股任命Joseph Galli Jr.出任CEO，其2024年退休前为创 function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
