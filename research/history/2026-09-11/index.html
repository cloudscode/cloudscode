"Anthropic", "Google", "xAI", "Cursor", "DeepSeek", "腾讯", "文字观点"]}, "post:2026-09-11T09-04:8fb5e57a9167": {"id": "post:2026-09-11T09-04:8fb5e57a9167", "kind": "post", "title": "2026-09-11 09:04", "source_label": "帖子正文", "excerpt": "高盛——台积电（2330.TW）：Communacopia + Technology 2026 会议——核心要点 高盛维持台积电（2330.TW / TSM）买入（Buy）评级，12个月目标价新台币3,100元（对应2027年预期每股收益22倍市盈率，较五年均值溢价1个标准差），以及ADR目标价62", "content": "高盛——台积电（2330.TW）：Communacopia + Technology 2026 会议——核心要点 高盛维持台积电（2330.TW / TSM）买入（Buy）评级，12个月目标价新台币3,100元（对应2027年预期每股收益22倍市盈率，较五年均值溢价1个标准差），以及ADR目标价620美元（基于美元/新台币汇率30.0及20% ADR溢价）。当前台股股价为新台币2,465元（截至2026年9月9日收盘），潜在上行空间25.8%；ADR股价为435.36美元，潜在上行空间42.4%。 核心要点 一、AI仍为早期多年级超级趋势，算力成本下降将加速硅含量提升 管理层重申AI是持续多年的超级趋势，目前仍处于非常早期的阶段。生成式AI向代理式AI（agentic AI）的演进，将把算力需求从加速器扩展至CPU。近期美国云服务厂商（CSP）的拜访进一步增强了管理层信心，认为云厂商在电力及基础设施部署方面准备充分。管理层强调，开源模型与计算效率的持续提升将降低token成本，进而刺激AI消费与更广泛的应用，最终驱动对先进制程硅片的增量需求。台积电已将这一动态纳入产能规划，并正积极扩张产能以支持其视为结构性的多年需求增长。 二、亚利桑那厂执行顺利，海外产能布局明确 亚利桑那第一阶段（采用N4制程）已量产，良率与台湾厂区相当，质量与可靠性达标，且已实现盈利。这证明台积电的制造模式可以成功复制到海外。第二阶段（N3制程）设备即将搬入，第三阶段已动工，第四阶段及美国首座先进封装厂的前期准备工作正在进行。台积电近期额外购置了一块土地，可容纳五至六座新厂，以支撑新增的1,000亿美元投资。管理层预计，五年后台积电N2及以下先进制程产能中，约30%将位于台湾以外，主要集中在美国亚利桑那州。但最先进技术仍将优先在台湾量产，因为早期技术转移需要研发与制造工程师的紧密协作；海外量产通常会在技术于台湾趋于成熟之后跟进。 三、客户日益重视并愿意为地缘灵活性支付溢价 客户最初仅要求少量海外产能以实现供应多元化，但随着亚利桑那厂的成功，其需求已显著提升。台积电认为这种地缘灵活性代表了增量价值，并打算在定价中反映这一价值，而客户也日益认可并愿意支付相关溢价。 四、长期毛利率56%以上的目标具备支撑 尽管N2制程爬坡及海外扩张将带来稀释（N2预计在2026年拉低毛利率约2–3个百分点；海外扩产在五年计划初期稀释毛利率2–3个百分点，后期随更多厂投产稀释扩大至3个百分点），管理层仍对实现56%及以上的长期毛利率目标充满信心。支撑因素包括：纪律性的产能规划、高产能利用率、生产力提升、成本降低，以及基于价值反映的定价策略。管理层强调，定价是战略性的而非机会主义的——不会因短期产能利用率高而随意涨价，也不会因利用率暂时疲软而降价。 五、先进制程与先进封装产能持续紧张 N3需求异常强劲，与以往技术周期不同，N3在推出两三年后需求非但未衰减，台积电仍在追加产能且预计供应依然不足。先进封装（尤其是CoWoS）产能同样吃紧，台积电已开始将部分封装工序外包给OSAT伙伴以支持增长。管理层指出，先进封装的战略意义主要在于确保并拉动晶圆需求，而非作为独立的利润池。台积电当前先进封装能力已支持约5.5倍光罩尺寸，路线图规划在未来几年内达到约14倍光罩尺寸。 六、护城河：技术、制造卓越、产能与信任 客户选择代工伙伴时考量四大要素：获取最佳技术、快速爬坡至高产量的能力、充足产能，以及确信代工厂不会与客户竞争。台积电凭借技术路线图持续领先、新制程快速爬坡纪录、大规模晶圆与先进封装投资，以及对客户承诺的一贯兑现，构筑了无法仅靠资本支出或工程师招聘复制的信任壁垒。跨节点产能优化能力（例如在N5与N3之间灵活调配设备）是台积电制造卓越性的独特优势，能更快响应需求变化并降低产能闲置风险。 七、AI收入定义存在低估，晶体管微缩无可见障碍 台积电目前披露的AI收入定义较窄，主要涵盖GPU、定制AI加速器及内存基底芯片，未包括CPU与网络产品（因无法可靠判定每颗芯片的最终用途）。随着代理式AI驱动x86、Arm、RISC-V CPU及网络等支持性硅片的增量需求，台积电实际的AI相关敞口远大于报表披露的AI加速器收入。技术层面，N2正处爬坡，A14预计约两年后推出，后续节点已在开发中，管理层目前未看到阻碍晶体管持续微缩的技术障碍。 主要下行风险 1. 终端需求复苏进一步恶化，影响产能利用率； 2. 客户制程迁移速度慢于预期； 3. AI投资放缓导致长期半导体含量增长低于预期； 4. 良率或执行不佳，致使盈利不及预期； 5. 竞争加剧引发ASP或利润率侵蚀； 6. 不利汇率趋势或成本增幅超预期，压制毛利率前景。 结论 台积电在AI算力价值链中占据不可替代的核心地位，其技术领先性、制造卓越性及日益强化的定价权，为长期盈利增长与估值重估提供了坚实支撑。亚利桑那厂的顺利量产验证了海外扩张模式的可复制性，而客户对地缘灵活性溢价的认可将进一步巩固其盈利护城河。在先进制程与先进封装产能持续紧张的背景下，公司纪律性的产能扩张与价值导向定价，有望推动毛利率稳步迈向56%以上的长期目标，维持买入评级。#文字观点", "publish_time": "2026-09-11 09:04", "tags": ["文字观点"]}, "post:2026-09-11T14-30:4764bb7ef29f": {"id": "post:2026-09-11T14-30:4764bb7ef29f", "kind": "post", "title": "2026-09-11 14:30", "source_label": "帖子正文", "excerpt": "📌高盛 —— 台积电（shturl.）：Communacopia + Technology 2026 会议 —— 核心要点📄高盛维持台积电（shturl. / TSM）买入（Buy）评级，12 个月目标价新台币 3,100 元（对应 2027 年预期每股收益 22 倍市盈率，较五年均值溢价 1 个标", "content": "📌高盛 —— 台积电（shturl.）：Communacopia + Technology 2026 会议 —— 核心要点📄高盛维持台积电（shturl. / TSM）买入（Buy）评级，12 个月目标价新台币 3,100 元（对应 2027 年预期每股收益 22 倍市盈率，较五年均值溢价 1 个标准差），以及 ADR 目标价 620 美元（基于美元 / 新台币汇率 30.0 及 20% ADR 溢价）。 📄当前台股股价为新台币 2,465 元（截至 2026 年 9 月 9 日收盘），潜在上行空间 25.8%；ADR 股价为 435.36 美元，潜在上行空间 42.4%。 📋核心要点📈一、AI 仍为早期多年级超级趋势，算力成本下降将加速硅含量提升📄管理层重申 AI 是持续多年的超级趋势，目前仍处于非常早期的阶段。 📄生成式 AI 向代理式 AI（agentic AI）的演进，将把算力需求从加速器扩展至 CPU。 📄近期美国云服务厂商（CSP）的拜访进一步增强了管理层信心，认为云厂商在电力及基础设施部署方面准备充分。 📄管理层强调，开源模型与计算效率的持续提升将降低 token 成本，进而刺激 AI 消费源头内容加微WUXL3408与更广泛的应用，最终驱动对先进制程硅片的增量需求。 📄台积电已将这一动态纳入产能规划，并正积极扩张产能以支持其视为结构性的多年需求增长。 🏭二、亚利桑那厂执行顺利，海外产能布局明确📄亚利桑那第一阶段（采用 N4 制程）已量产，良率与台湾厂区相当，质量与可靠性达标，且已实现盈利。 📄这证明台积电的制造模式可以成功复制到海外。 📄第二阶段（N3 制程）设备即将搬入，第三阶段已动工，第四阶段及美国首座先进封装厂的前期准备工作正在进行。 📄台积电近期额外购置了一块土地，可容纳五至六座新厂，以支撑新增的 1,000 亿美元投资。 📄管理层预计，五年后台积电 N2 及以下先进制程产能中，约 30% 将位于台湾以外，主要集中在美国亚利桑那州。 📄但最先进技术仍将优先在台湾量产，因为早期技术转移需要研发与制造工程师的紧密协作；海外量产通常会在技术于台湾趋于成熟之后跟进。 💵三、客户日益重视并愿意为地缘灵活性支付溢价📄客户最初仅要求少量海外产能以实现供应多元化，但随着亚利桑那厂的成功，其需求已显著提升。 📄台积电认为这种地缘灵活性代表了增量价值，并打算在定价中反映这一价值，而客户也日益认可并愿意支付相关溢价。 📊四、长期毛利率 56% 以上的目标具备支撑📄尽管 N2 制程爬坡及海外扩张将带来稀释（N2 预计在 2026 年拉低毛利率约 2–3 个百分点；海外扩产在五年计划初期稀释毛利率 2–3 个百分点，后期随更多厂投产稀释扩大至 3 个百分点），管理层仍对实现 56% 及以上的长期毛利率目标充满信心。 📄支撑因素包括：纪律性的产能规划、高产能利用率、生产力提升、成本降低，以及基于价值反映的定价策略。 📄管理层强调，定价是战略性的而非机会主义的 —— 不会因短期产能利用率高而随意涨价，也不会因利用率暂时疲软而降价。 🔧五、先进制程与先进封装产能持续紧张📄N3 需求异常强劲，与以往技术周期不同，N3 在推出两三年后需求非但未衰减，台积电仍在追加产能且预计供应依然不足。 📄先进封装（尤其是 CoWoS）产能同样吃紧，台积电已开始将部分封装工序外包给 OSAT 伙伴以支持增长。 📄管理层指出，先进封装的战略意义主要在于确保并拉动晶圆需求，而非作为独立的利润池。 📄台积电当前先进封装能力已支持约 5.5 倍光罩尺寸，路线图规划在未来几年内达到约 14 倍光罩尺寸。 🛡️六、护城河：技术、制造卓越、产能与信任📄客户选择代工伙伴时考量四大要素：获取最佳技术、快速爬坡至高产量的能力、充足产能，以及确信代工厂不会与客户竞争。 📄台积电凭借技术路线图持续领先、新制程快速爬坡纪录、大规模晶圆与先进封装投资，以及对客户承诺的一贯兑现，构筑了无法仅靠资本支出或工程师招聘复制的信任壁垒。 📄跨节点产能优化能力（例如在 N5 与 N3 之间灵活调配设备）是台积电制造卓越性的独特优势，能更快响应需求变化并降低产能闲置风险。 🔬七、AI 收入定义存在低估，晶体管微缩无可见障碍📄台积电目前披露的 AI 收入定义较窄，主要涵盖 GPU、定制 AI 加速器及内存基底芯片，未包括 CPU 与网络产品（因无法可靠判定每颗芯片的最终用途）。 📄随着代理式 AI 驱动 x86、Arm、RISC-V CPU 及网络等支持性硅片的增量需求，台积电实际的 AI 相关敞口远大于报表披露的 AI 加速器收入。 📄技术层面，N2 正处爬坡，A14 预计约两年后推出，后续节点已在开发中，管理层目前未看到阻碍晶体管持续微缩的技术障碍。 ⚠️主要下行风险📄1. 终端需求复苏进一步恶化，影响产能利用率； 📄2. 客户制程迁移速度慢于预期； 📄3. AI 投资放缓导致长期半导体含量增长低于预期； 📄4. 良率或执行不佳，致使盈利不及预期； 📄5. 竞争加剧引发 ASP 或利润率侵蚀； 📄6. 不利汇率趋势或成本增幅超预期，压制毛利率前景。 ✅结论📄台积电在 AI 算力价值链中占据不可替代的核心地位，其技术领先性、制造卓越性及日益强化的定价权，为长期盈利增长与估值重估提供了坚实支撑。 📄亚利桑那厂的顺利量产验证了海外扩张模式的可复制性，而客户对地缘灵活性溢价的认可将进一步巩固其盈利护城河。 📄在先进制程与先进封装产能持续紧张的背景下，公司纪律性的产能扩张与价值导向定价，有望推动毛利率稳步迈向 56% 以上的长期目标，维持买入评级。#文字观点", "publish_time": "2026-09-11 14:30", "tags": ["文字观点"]}, "attachment:files/0910脱水研报.pdf": {"id": "attachment:files/0910脱水研报.pdf", "kind": "attachment", "title": "0910脱水研报", "source_label": "其他", "excerpt": "市场逻辑精选 · 2026-09-10 · 第 1 页【红宝书】2026年9月10日市场逻辑精选 特别提示：下文涉及的题材或公司，内容罗列和篇幅长短，与后续涨跌无关，亦均非进行推荐，仅作研究辅助。投资者应自主决 策，注意 风险。", "content": "市场逻辑精选 · 2026-09-10 · 第 1 页【红宝书】2026年9月10日市场逻辑精选 特别提示：下文涉及的题材或公司，内容罗列和篇幅长短，与后续涨跌无关，亦均非进行推荐，仅作研究辅助。投资者应自主决 策，注意 风险。 一、市场热点 热点、覆铜板第七轮提价，PCB上游量价齐升； ◇驱动： 覆铜板龙头 建滔积层板 发出年内第七张涨价函，FR-4产品上调 10%，花旗预计10月初还有第八轮调价； 松 下9月上调报价最高 30%、南亚上调 20%至25%；上游电子布同步提价，龙头企业9月厚布上调 15%、薄布上调 20 %，为年内第五次提价。驱动来自AI服务器高多层与高阶HDI用板需求爆发，材料环节供不应求，利润持续向上游 材料端转移。盘面：9月10日印制电路板指数上涨 1.95% 、成交 919亿元 ，板块内多股涨停， 金安国纪 、超声电子 涨停， 逸豪新材 上涨15.29% 商业务盈利同步改善；重申 “增持”评级 中国证券研究主管及亚洲 TMT 研究联 席主管 证券分析师 : 姚橙 AC (86 21) 6106 6505 alex.yao@jpmorgan.com 登记编号 : S1730523020001 证券分析师 : 刘雨禾 ", "content": "中国 证券研究 2026 年9月10日 阿里巴巴 (BABA US & 9988 HK) 云与电商业务盈利同步改善；重申 “增持”评级 中国证券研究主管及亚洲 TMT 研究联 席主管 证券分析师 : 姚橙 AC (86 21) 6106 6505 alex.yao@jpmorgan.com 登记编号 : S1730523020001 证券分析师 : 刘雨禾 (86 21) 6106 6343 nancy.liu@jpmorgan.com 登记编号 : S1730524090001 摩根大通证券（中国）有限公司 9988.HK, 9988 HK 增持 股价: 109.80 港元 2026 年9月9日 目标价 : 205.00 港元 目标价截至日期 : 2026 年12月31日 BABA, BABA US 增持 股价: 112.66 美元 2026 年9月8日 目标价 : 210.00 美元 目标价截至日期 : 2026 年12月31日 分析师声明及重要披露，包括非美国分析师披露，见第 5页。 我们重申对阿里巴巴的 “增持”评级，该股投资逻辑更趋均衡。云与 AI变 现正在加快，同时监管限制降低了即时零售再掀大规模补贴周期的风险，电 商业务利润率修复路径更加清晰。基于多重利好，投资者应当持有该股：云 与AI业务已具规模且利润率持续改善，而电商业务竞争性投入有望下降， 为前者提供资金支持。后续验证点在于，即时零售带来的流量能否以正常抽 佣率转化为客户管理收入（ CMR ）。 •云业务是验证投资逻辑推进的最有力证据。 2026 年2季度，云业务外部收 入同比增长 45%至484亿元，分部息税摊销前利润率提升 2.9个百分点至 12%，模型与应用服务年化经常性收入（ ARR）超 160亿元。管理层预计 模型与应用服务 ARR 年底突破 300亿元，同时云业务利润率进一步提升 ，向 15%左右靠拢。持续的增长及利润率改善将表明， AI需求正转化为 盈利性收入，而不仅仅是更多的资金投入。 •电商是第二大支柱。 即时零售为淘宝带来了流量增长，而 0.6% 的软件服 务费、 “全站推 ”广告工具及 88 VIP 会员体系为全年变现提供了多条路径 。我们认为这些杠杆能够对冲购物节期间广告投放减弱的影响，但验证点 在于 CMR 。11月底的业绩发布将提供检验窗口：若同口径 CMR 增长、 销售和市场费用下降、即时零售用户留存，将支撑我们的判断；若转化率 疲弱，则将对我们的观点构成挑战。 •主要风险可量化。 6月季度 AI实验室与应用分部亏损 139亿元，阿里巴巴 未给出明确的减亏时间表；若亏损收窄较慢，云业务利润或将被侵蚀。尽 管补贴规则收紧，即时零售或 AI获客方面的投入仍可能改换名目，导致 电商利润率复苏延迟。资本回报持续温和偏低，同时 CMR 报告数据将在 约四个季度内受到收入冲减项目的拖累（预计影响约 7个百分点），削弱 近期能见度。若竞争性投入再度提速、或云业务利润率增长停滞，则 “增 持”逻辑将被削弱。 •最新要点。 o云业务增长保持强劲，息税摊销前利润率达 12%，为 AI盈 利性变现提供了更清晰的验证。 oAI模型与应用服务 ARR 超160亿元，管理层预计年底突破 300亿元。 o平台定价及外卖补贴相关监管限制降低了（但并未消除）即 时零售大规模投入周期重演的风险。 o11月底公布的业绩将清晰地验证，即时零售流量能否转化 为同口径 CMR 、以及云业务利润率是否向 15%左右推进。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 2 投资理据 支柱 1：云与 AI正从规模数据的披露转向利润率验证 2026 年2季度，云业务外部收入同比增长 45%至484亿元。该分部连续两个季度实现经营杠杆，息税摊销前利润 率提升 2.9个百分点至 12%，管理层预计未来一到两个季度进一步改善，中期向 15%左右迈进。管理层同时透露 ，服务器产能已充分利用，表明短期增长更多取决于资本支出部署，而非需求端。 AI收入规模已足够大，可单独评估。模型即服务（ MaaS ）与应用服务 ARR 超160亿元， 3个月内增长约一倍； 管理层预计年底突破 300亿元。 AI相关产品收入达 124亿元，连续 12个季度实现三位数增长。以上为公司披露信 息；我们的理解是，下一阶段讨论焦点应转向分部利润的转化兑现。 需验证的要点较为明确。我们预计外部云收入保持强劲增长，息税摊销前利润率从 12%向15%左右迈进， ARR 增 长轨迹不变。若增速及利润率双双不及预期，则 “主要制约因素是产能而非需求 ”的观点将受到挑战。 支柱 2：电商流量拥有多条全年变现路径 阿里巴巴过去依赖商家在大型购物节期间的集中需求获取高利润率的广告收入。这一模式正变得愈发不可靠：今 年的 “618” 年中大促持续了 46天， 6月增速仅约 1%。我们认为全年变现可以部分弥补购物节广告投放强度减弱产 生的缺口。 有三个机制很关键：征收 0.6% 的软件服务费、自动化广告及流量分发产品 “全站推 ”（渗透率约 30%，管理层预 计向 45–50% 迈进）、以及拥有超 6,000 万会员的 88VIP 付费会员体系。此外，即时零售也扩大了流量池：据报道， 淘宝日活从 2025 年4月的约 3.75亿增长至 9月的 4.37亿；最近一次披露的月活跃消费者人数同比增长 25%。 流量本身并不创造价值，必须在补贴退坡后转化为 CMR 、软件服务费及会员经济贡献。因此，我们将同口径 CMR 增长及用户留存（而非订单量本身）视为关键验证指标。 支柱 3：监管措施降低了新一轮补贴大战爆发的概率 中国互联网平台《价格行为规则》于 4月10日正式生效，限制了强制降价或自动开通跟价系统等一系列行为。此 外，市场监管总局还发布了外卖平台补贴行为规范（草案），拟禁止长期大规模补贴，并要求活动前提前公示。 这些措施共同降低了阿里巴巴重演超 800亿元即时零售投入周期的可能性。 这一利好可能颇为显著。中国电商集团调整后息税摊销前利润从 2025 财年的 1,932 亿元下降至 2026 财年的 1,075 亿 元，集团销售和市场费用上升至 2,450 亿元，占收入比重达 23.9% （上一年占比为 14.5% ）。管理层预计 27财年即时 零售投入缩减至 26财年水平的一半左右。我们认为监管措施使这一投入减半预期更为可信，但并非绝对保障。 核心投资争议 争议的焦点在于，阿里巴巴能否在不陷入一轮又一轮补贴周期的前提下，实现流量及 AI投入变现。乐观观点认为 ：监管限制了恶性竞争，即时零售为淘宝带来更广泛的用户基础，同时云业务增长产生利润杠杆。在这一观点下 ，电商利润将复苏，云与 AI成为第二盈利引擎。 谨慎观点则认为，支出可能转移到补贴行为规范未覆盖的领域。阿里巴巴曾通过 Qwen 助手在一天内送出约 30亿 元的免单奶茶，体现了这一风险：该行为被包装为 AI智能体采用，而非传统意义上的外卖补贴。同时， AI实验 室与应用业务在 6月季度录得 139亿元的息税摊销前亏损，该季度回购金额仅 1.62亿美元。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 wUPBrQpRvNvN7NdNaQoMrRmOoQkPqQvMkPqRpP8OoMqRwMqMoOwMnNrP 3 中国 证券研究 2026 年9月10日 我们的看法则不同：我们认为剩余的不确定性现已可以验证。集团销售和市场费用应在 9月及 12月季度同比下降 。同时，同口径 CMR 应表明获取的流量正在变现，云业务息税摊销前利润率向 15%左右推进。若投入持续高企 而CMR 或云业务利润率未见进展，则投资逻辑将被削弱。 经营及盈利情况更新 6月季度业绩中，云业务的业绩验证最为明确：外部云收入同比增长 45%，息税摊销前利润率达 12%，AI相关产 品收入 124亿元，模型与应用服务 ARR 超160亿元。不过， AI实验室与应用业务亏损 139亿元，管理层预计 9月 季度亏损仍将高于 100亿元，未给出具体的减亏路线图。 电商业务带来了更为庞大的用户基础，但盈利转化路径仍不完整。管理层目标是在新财年内实现日均（不含餐饮 ）零售订单约 2,000 万单，且单均经济效益为正。 2025 年3月季度 CMR 增长 12%，主要由抽佣率提升驱动； 2026 财年同口径 CMR 增长 8%。收入冲减项目预计将在约四个季度内对 CMR 报告增速产生约 7个百分点的拖累，因 此同口径披露数据比表面的报告数字更具参考意义。 表 1: 阿里巴巴电商变现情景 驱动因素 悲观情景 基准情景 乐观情景 全站推渗透率（ 2027财年底） 40% 45% 50% 即时零售用户群留存率（ 12个月） 25% 45% 60% 购物节期间广告投放强度变化 -20% -10% 0% 软件服务费持续贡献 全年 全年 全年 隐含同口径 CMR增长 低个位数 高个位数 低双位数 资料来源：摩根大通估算 行业及监管形势 行业正逐渐告别依赖份额争夺、大促活动及大规模补贴的增长模式。《价格行为规则》及拟议中的外卖平台补贴 行为规范应将使服务质量、供应链效率和可持续变现能力变得更为重要。阿里巴巴受此变化 委员会 (Securities Commission) 颁发的资本市场服务许可证 (Capital Markets Services License ）。 墨西哥： J.P. Morgan Casa de Bolsa, S.A. de C.V., J.P. Morgan Grupo Finan", "status": "extracted"}, "post:2026-09-11T22-07:e473704d55c0": {"id": "post:2026-09-11T22-07:e473704d55c0", "kind": "post", "title": "2026-09-11 22:07", "source_label": "帖子正文", "excerpt": "Nand 调研纪要 如何评估当前NAND Flash市场的供需状况，特别是与三个月前相比，需求端是边际走强还是走弱？当前市场需从三个板块进行分析：消费类、企业级以及面向模组厂和封装厂的业务。", "content": "Nand 调研纪要 如何评估当前NAND Flash市场的供需状况，特别是与三个月前相比，需求端是边际走强还是走弱？ 当前市场需从三个板块进行分析：消费类、企业级以及面向模组厂和封装厂的业务。首先，在消费类市场，需求非常疲软，客户普遍拿货意愿不强。这主要源于三方面因素：第一，大型品牌客户，如大疆、安克及电视制造商，前期已储备大量库存，目前仍在消化阶段，因此采购积极性不高。第二，部分非存储行业的投机者此前囤积了大量现货，在市场价格下行时急于抛售，形成了类似股票市场的抛压，导致价格竞争激烈，例如有人以13美元抛售后，其他人可能以12美元跟进，加剧了价格下跌。第三，市场上存在价格混乱的现象，例如从旧手机或PD设备上拆解的二手料件，其价格仅为新物料的40%左右，这进一步扰乱了市场定价体系。目前消费类产品的价格已经基本稳定，继续上涨的空间有限，但由于上述市场现象的存在，短期内也不会出现快速下跌。在这种环境下，一些非品牌的小公司倾向于在现货市场采购，以规避高价从原厂拿货的成本压力；而大型公司则利用自身库存，仅向原厂采购其预测订单中的一小部分，以维持合作关系，避免高价补货。其次，在企业级市场，情况则完全不同。企业级存储产品的价格呈现明确的上涨趋势，预计这一趋势在第三季度和第四季度将持续。所有大容量企业级产品，包括服务器和数据中心使用的存储，价格都将上涨。最后，手机市场在消费类中属于一个特例。由于手机是刚性需求，其备货模式相对固定，受库存周期影响较小。因此，应用于手机的高速率存储（如UFS）价格也会上涨。 关于企业级存储和手机存储的价格上涨趋势？ 考虑到当前企业级存储的紧缺程度，预计第四季度价格将继续上涨。 存储行业在2026年第二季度和第三季度的价格变动情况如何，尤其是在企业级和消费级市场？ 2026年第二季度（CQ2），企业级存储产品的价格约为0.24美元/GB。进入第三季度（CQ3），价格已上涨至0.28-0.30美元/GB，其中部分客户的成交价达到了0.32美元/GB。相较于第二季度，第三季度企业级产品的价格平均涨幅在30%左右。消费级产品在第三季度也出现了小幅上涨，但涨幅不大，基本可以忽略。具体而言，针对大客户的价格基本没有变动，而小客户的价格则有微调。 展望2026年第四季度，企业级存储产品的价格预计将如何变动？ 预计2026年第四季度（CQ4），企业级存储产品的价格将继续上涨，涨幅可能在20%左右。价格预计将达到0.35至0.40美元/GB的区间。具体价格会因客户体量而异，大型客户的采购价可能会略低。 当前企业级存储市场的供需格局是怎样的？ 目前企业级存储市场处于供应紧缺状态，需求争夺非常激烈。服务器厂商等整机厂对企业级SSD的需求量较大，采购能力较强。在中国市场，本土NAND厂商的企业级产品供应能力仍不稳定，尚未形成稳定的大规模供应；大普微、德明利等企业级SSD厂商虽有供货，但也更倾向于需求旺盛的海外市场，进一步加剧国内紧缺。相比之下，消费级市场已不再那么紧缺，目前供应能力已恢复至约60%-70%。 公司计划如何调整其产能分配以应对市场变化，特别是企业级和消费级产品的占比规划是怎样的？ 根据规划，到2027年，铠侠的产能将主要向企业级市场倾斜。具体分配比例为：约65%的产能用于企业级产品，约25%用于消费级产品，剩余的10%则分配给车规和工规产品。这一调整反映了公司将重心转向利润率更高的企业级市场的战略。 既然公司已停产部分消费级产品，为何在2027年的产能规划中仍有25%分配给消费级市场？ 铠侠停产的是64GB以下的低容量产品，例如32GB规格。与此同时，消费级市场的主流容量持续提升，例如智能手机UFS已普遍向512GB等大容量迁移，一颗高容量UFS占用的NAND容量远高于多颗低容量eMMC。因此，尽管部分低容量产品已经停产，高容量UFS仍会占用相当一部分消费级产能。对于已进入EOL（End-of-Life，产品生命周期终止）阶段的旧型号，铠侠会继续向长期合作的老客户供货至2028年，保障客户完成物料切换，但不会再向新客户推广。 考虑到对老客户的EOL供应将持续到2028年，届时产能是否会更大幅度地向企业级市场倾斜，例如占比超过80%？ 到了2028年，产能分配不一定会简单地将消费级份额完全转移至企业级。虽然低容量消费级产品的供应会逐步结束，但智能手机等消费电子设备对大容量存储的需求依然存在且容量持续增长，这部分需求仍需满足。因此，届时仍会有一部分产能用于供应手机等消费级市场。 在消费电子领域，除了手机厂商，小容量存储市场的未来趋势如何？特别是考虑到主要供应商如闪迪、铠侠和三星的产能调整，市场将如何应对由此产生的供应缺口？ 中国的消费电子市场，除手机外，主要集中在64GB以下的小容量存储产品。例如，海康威视的监控摄像头普遍搭载4GB至8GB的eMMC，而高速公路等高端应用场景的摄像头则可能使用16GB或32GB的容量。同样，大疆等品牌的产品也主要使用4GB或8GB的存储，因为其功能仅需存储操作系统。历史上，64GB以下的小容量市场主要由闪迪、铠侠和三星三家供应。其中，三星已于2024年停产，铠侠于今年（2026年）宣布停产，而闪迪预计也将在明年（2027年）开始停产。这一系列调整将导致市场出现巨大的供应缺口。尽管YMTC存在，但其最小单Die容量为64GB，不覆盖64GB以下的市场。因此，当主要供应商均转向生产大容量产品时，小容量市场将面临无人接手的局面。对于消费电子产品制造商而言，他们难以承受因存储容量升级带来的成本急剧上升。例如，一台售价仅几百元的低端摄像头，其整机成本甚至可能低于一颗64GB芯片的价格，这使得他们无法转向更高容量的存储方案，只能被动顺应存储厂商的供应趋势。 关于企业级SSD业务，目前长协订单的覆盖比例是多少？这些长协订单通常采用何种定价结构，以及不同区域的客户在合同条款上是否存在差异？ 目前企业级SSD业务的长协订单覆盖率约为60%。这些协议通常采用“锁量不锁价”的模式。只有极少数规模非常大的特殊客户能够锁定价格。在具体执行上，对美国客户的政策可能相对宽松，可能会出现锁量且锁价的情况。然而，在中国区，所有的长协订单均严格执行“锁量不锁价”的条款，不可能为客户锁定价格。 既然公司管理层在长协中选择“锁量不锁价”的策略，这是否反映了对未来价格走势的乐观预期？为什么不通过签订三至五年的锁价长约来规避未来价格下跌的风险？ 企业级存储价格仍有继续上涨的空间。即使价格不再明显上行，当前行业毛利率水平仍较高，因此基本盘较为稳固。不同存储厂商的长期协议策略存在差异：海力士更强调通过HBM等产品与北美大客户深度绑定，以强化生态和降低周期波动；铠侠相对更强调在当前景气阶段兑现利润。从更长期看，存储价格在2030年前仍有较强支撑，主要变量在于届时中国厂商的产能进一步释放。因此，现阶段中国区企业级SSD长协更倾向于“锁量不锁价”，而不是通过长期锁价获取价格保护。 影响2027年价格上涨幅度的主要因素有哪些？ 价格上涨幅度受限于多方面因素。首先，DRAM的产能扩张速度较慢，新建一座晶圆厂从洁净室建设到设备安装、产线测试，至少需要两到三年时间，且必须保证高良率以避免亏损，这使得DRAM的增产难度高于NAND，为其价格上涨提供了可期待的空间。其次，市场存在不愿意涨价的竞争对手，例如海力士希望通过稳定价格来抢占市场份额，摆脱存储行业的周期性，从而限制了整体价格的上涨空间。三星则是价格波动最快的厂商。最后，AI的快速发展带来了不确定性，但消费类产品的价格已接近顶峰。 铠侠与英伟达合作的XL Flash和Super High IOPS SSD等新产品，其规划、预计导入节奏及市场应用前景如何？ 这类新产品的核心思路，是将部分原先需要在DRAM上运行的任务转移至SSD，从而降低客户对大容量DRAM的需求并优化成本。但这类方案只能替代DRAM的部分功能，无法完全取代DRAM。新技术仍需要较长的认证和软件适配周期，也需要明确哪些任务适合放在SSD上运行，避免影响程序效率。规划上，2027年底可能先在部分重要客户中进行验证，2028年再逐步向大客户导入，以验证实际的成本节省效果。 预计到2028年，XL Flash和Super High IOPS SSD等新技术在企业级产品中的应用比例可能达到什么水平？对整体存储市场会产生怎样的影响？ 在验证顺利且客户认可的乐观情形下，约一半企业级产品可能采用这类新技术，不同客户的切换比例可能从约30%到50%不等。其主要作用是帮助客户降低部分DRAM采购成本和优化整体存储成本，但难以改变NAND市场的大方向。更重要的潜在变量仍是长江存储：若企业级SSD产品进一步成熟，同时中国AI需求持续增长，其价格竞争力可能对全球市场格局形成较大影响。 上述新技术的定价策略与传统SSD相比将有何不同？客户接受度以及存储原厂的产线切换会面临哪些挑战？ 新技术的定价不宜显著高于传统SSD。如果价格过高，客户尤其是北美大客户可能继续沿用传统SSD方案，通过增加容量满足需求，新技术的成本优势也会被削弱。因此，初期商业化更可能以进入市场和扩大应用为优先，价格需要控制在客户整体TCO能够接受的范围。客户是否愿意切换，核心取决于采用新技术后节省的DRAM或存储容量成本能否覆盖额外的系统适配成本。产线切换同样需要时间。部分通用设备，例如清洗和研磨设备可以共用，但光刻、刻蚀和镀膜等关键设备需要重新配置或更换；如果完全切换产线，则还涉及新设备导入、测试和流片等流程，因此难以在短时间内完成。实际更可能采用逐步切换的方式。乐观情形下，新技术在企业级产品中的应用比例可能达到约50%，但最终渗透速度仍取决于定价、客户实际节省的成本，以及固件和软件适配的复杂度。 当前Wafer市场的供需和价格趋势是怎样的？原厂的销售策略对模组厂造成了哪些影响？ 当前Wafer市场存在明显的价格倒挂，即按相同容量折算，原厂出售Wafer的价格可能高于其成品颗粒。以江波龙采购为例，64GB对应的Wafer价格约为24美元，而同容量成品颗粒的价格可能仅约20美元。这种倒挂对模组厂的成本和定价形成较大压力。Wafer供应主要集中于大客户。Wafer价格涨幅较大，2026年Q3环比上涨约40%。由于销售Wafer无需搭配主控等器件，在价格倒挂的情况下，原厂Wafer业务的盈利空间较高，同时也给模组厂带来较大压力：模组厂采购Wafer的成本甚至可能高于原厂自产成品颗粒。即便如此，江波龙、佰维等模组厂仍需要维持Wafer采购，否则后续可能面临供货不足。能够持续拿到Wafer的模组厂，通常依赖长期积累的商务合作关系。 预计2026年Q4 Wafer价格的走势如何？这对模组厂的利润和生存状况会产生什么影响？ 预计2026年Q4 Wafer价格仍可能上涨约10%，但进一步大幅上涨的空间有限，否则模组厂的经营压力会进一步加大。目前模组厂已较难获得低价货源，库存成本普遍较高。如果原厂后续减少涨价，而成品颗粒价格仍低于模组厂的高成本库存，模组厂的利润空间将继续受到挤压。 Wafer产品是否存在质量等级划分？不同等级的Wafer主要流向哪些市场和应用领域？ Wafer及颗粒存在明显的质量等级梯度。较高等级产品主要用于车规、工规等对可靠性要求较高的场景，其次是企业级及部分消费类应用，再往下是普通消费类。更低等级的颗粒Ink Die可能存在较多坏块，例如标称3,000次P/E（Program/Erase，编程/擦除）的产品实际可用擦写次数可能仅约1,500次；更低等级产品则主要流向移动固态硬盘、U盘等To C市场。通常品质较高的Wafer不会大量流向To C市场。闪迪流向To C市场的Wafer和颗粒较多，而铠侠的品控和稳定性、宽温表现相对较好，其Wafer更多供给台湾模组厂，例如金士顿、群联等。部分模组厂也会采购铠侠消费级颗粒，用于对可靠性要求更高的工规、车规模组产品。#文字观点", "publish_time": "2026-09-11 22:07", "tags": ["文字观点"]}, "post:2026-09-11T09-04:04e9a1a39705": {"id": "post:2026-09-11T09-04:04e9a1a39705", "kind": "post", "title": "2026-09-11 09:04", "source_label": "帖子正文", "excerpt": "高盛——美国科技：半导体——Communacopia + Technology 2026 大会第二天核心要点 一、关键主题一：AI adoption趋势与EDA软件 企业普遍指出，智能体AI（agentic AI）正从系统到组件层面为服务和设备带来显著的需求顺风。多家公司列举了内部业务流程中落地AI", "content": "高盛——美国科技：半导体——Communacopia + Technology 2026 大会第二天核心要点 一、关键主题一：AI adoption趋势与EDA软件 企业普遍指出，智能体AI（agentic AI）正从系统到组件层面为服务和设备带来显著的需求顺风。多家公司列举了内部业务流程中落地AI的具体方式，包括通过新产品开发和更快的服务创新周期驱动增量收入增长，并利用内部AI工具提升成本效率。 • Cadence：传统与非传统芯片及系统设计商的芯片设计动能持续强劲。芯片复杂度预计未来五年提升48倍，是其智能体AI解决方案的关键驱动力，有望加速经常性收入增长。公司对物理AI持乐观态度，视其为中期重大市场机遇。 • IBM：强调其高性价比、开源AI工具（小型LLM、RHEL AI、WatsonX代码生成及Orchestrate）在扩展智能体AI方面的优势。管理层同时强调客户数据在AI背景下的重要性，并将生成式AI视为咨询业务的关键新价值来源。 • 应用材料：指出AI驱动的更短上市时间、良率及产出创新是行业ROI的核心来源。AI正越来越多地应用于新产品开发，转化为公司长期的增量收入增长和市场份额提升。利用AI改善服务价值主张亦被视为行业ROI的额外驱动力。 二、关键主题二：半导体资本设备、晶圆代工与存储 企业强调AI驱动的结构性需求提升，客户能见度延长推动产能扩张。供应链供需持续紧张，台积电（先进封装与晶圆产能）、安靠（先进封装）和泰瑞达（测试）的评论均印证此点。存储方面，闪迪指出NAND供需紧平衡预计持续至2027年甚至2028年。 • 台积电：认为AI仍是处于极早期阶段的多年级超级趋势，计算成本下降将加速AI采用并推升高阶硅含量需求。亚利桑那厂进展顺利，一期良率与台湾相当且已盈利；预计五年后约30%的N2及以下产能位于台湾以外（主要在美国）。尽管N2爬坡与海外扩张带来稀释，管理层仍有信心实现56%及以上的长期毛利率目标。 • 安靠：受先进封装强劲需求驱动，亚利桑那二期扩建计划新增6万平方米洁净室。预计2027年计算业务收入同比增速维持30%。重申2030年110亿美元营收目标，2028年资本开支将处于高位。 • 闪迪：长期协议（NBM）支撑财务目标，NAND供需紧平衡。公司强调低资本密度优势，并视股票回购为资本返还的核心。 • 泰瑞达：在超大规模客户中看到跨芯片、系统和数据中心测试的协同需求。预计AI驱动增长将持续加速至2027年，测试设备市场增速至少与整体半导体资本开支同步。 • 应用材料：2026年WFE中约80%将来自领先逻辑、先进封装和存储。重申2026年营收增速约40%，并预计2027至2028年持续增长。过程控制业务预计2026年增长超50%。 三、关键主题三：模拟芯片 企业对工业与汽车等终端市场的广泛复苏持乐观态度，库存水平健康、含量增长及需求稳步改善是主要支撑。数据中心、航空航天/国防等特定领域需求增长尤为突出，且这一趋势预计在可预见未来持续。 • 恩智浦：终端市场需求趋势改善，汽车业务中约50%来自软件定义汽车、雷达与连接等增长引擎（增速约20%）。公司战略转向物理AI，采用混合制造模式，并逐步实施选择性涨价以支持收入与利润率。 • SiTime：数据中心仍是关键增长驱动力，受AI服务器单元、份额提升及含量增加推动。预计Renesas IC时钟业务营收将在2027年出现拐点，未来几个季度整体营收增速有望超越长期目标。 四、关键主题四：IT服务 • IBM：预计2026年下半年咨询业务营收加速增长，这主要得益于其在生成式AI服务领域较同行的更大敞口。公司预计2026年营收（固定汇率）增长4%–5%，自由现金流同比增加约10亿美元。软件板块预计增长6%–8%，量子计算有望在2030年前贡献近10亿美元收入。 五、重点公司交流要点 台积电（TSMC） 评级：买入（Buy）。台股12个月目标价3,100新台币，基于22倍2027年预期市盈率（较五年交易均值高1个标准差）。ADR目标价620美元，基于美元/新台币汇率30.0及20%的ADR溢价。当前台股收盘价2,465新台币，ADR收盘价435.36美元。 管理层核心表述：第一，AI从生成式向智能体演进，将计算需求从加速器扩展至CPU。第二，亚利桑那一期良率与台湾一致，二期将采用N3技术，三期和四期及美国首座先进封装厂已在规划中。第三，定价基于价值而非利用律波动，长期毛利率目标56%及以上。第四，先进封装产能紧张，但战略上主要服务于晶圆需求增长。第五，晶体管微缩无可见技术障碍，N2正爬坡，A14预计约两年后推出。 安靠（Amkor） 评级：中性（Neutral）。12个月目标价65美元，基于25倍正常化每股收益2.60美元。当前股价51.35美元。 管理层核心表述：第一，亚利桑那二期将新增6万平方米洁净室，预计产生与一期相似的营收规模（约10亿美元）和30%毛利率。第二，战略聚焦高密度扇出、2.5D及共封装光学。第三，预计2027年计算营收同比增长30%。第四，重申2030年110亿美元营收目标，2028年资本开支将因一期设备采购和二期建设而高企。 恩智浦（NXP） 评级：买入（Buy）。12个月目标价325美元，基于18倍正常化每股收益18.00美元。当前股价223.32美元。 管理层核心表述：第一，工业与物联网为今年最佳表现市场，汽车业务中SDV、雷达等增长引擎占比约50%。第二，数据中心成为关键增长驱动力，预计2026年增速超100%。第三，战略转向物理AI，剥离非核心业务。第四，价格逐步上调将累积推高收入。 铿腾电子（Cadence） 评级：买入（Buy）。12个月目标价470美元，基于45.5倍正常化每股收益10.50美元。当前股价未披露。 管理层核心表述：第一，芯片设计活动保持强劲，传统与非传统客户参与度高。第二，智能体AI解决方案采用消费+订阅新模式，芯片复杂度提升48倍驱动需求。第三，硬件业务动能强劲，物理AI并购（Hexagon）拓展新市场。 闪迪（SanDisk） 评级：买入（Buy）。12个月目标价2,200美元，基于20倍正常化每股收益110美元。当前股价1,764.17美元。 管理层核心表述：第一，商业模式向长期协议（NBM）转型，下行情景下大部分业务毛利率有约80%底线支撑。第二，NAND供需紧平衡持续，中国新增产能主要被本地吸收。第三，HBF与KV Cache具长期期权价值。第四，低资本密度（约5%）优势持续。 IBM 评级：买入（Buy）。12个月目标价270美元，基于1年期预期市盈率20倍。当前股价239.94美元。 管理层核心表述：第一，软件板块预计2026年增长6%–8%，Red Hat为主要驱动力。第二，咨询业务下半年加速，生成式AI带来差异化价值。第三，量子计算取得进展，预计2030年前商业机会达数十亿美元。 泰瑞达（Teradyne） 评级：买入（Buy）。12个月目标价465美元，基于37倍正常化每股收益12.50美元。当前股价383.69美元。 管理层核心表述：第一，AI基础设施全栈覆盖（半导体测试、机器人、产品测试）协同性强。第二，ATE市场增速与半导体资本开支同步，测试强度上升。第三，共封装光学（CPO）测试长期机会显著，2028年TAM可达3–7亿美元。第四，机器人业务在数据中心制造辅助领域增长最强。 应用材料（Applied Materials） 评级：买入（Buy，且为Conviction List）。12个月目标价670美元，基于32倍正常化每股收益21.00美元。当前股价468.85美元。 管理层核心表述：第一，AI与数据中心是半导体支出主要驱动力，2026年约80% WFE来自领先逻辑、先进封装和存储。第二，重申2026年营收增长约40%，2027–2028年持续强劲。第三，过程控制业务预计2026年增长超50%。第四，EPIC设施推动与客户的高速度协同创新。 SiTime 评级：买入（Buy）。12个月目标价900美元，基于60倍正常化每股收益15.00美元。当前股价589.87美元。 管理层核心表述：第一，数据中心需求强劲，每机架价值量有望升至400–600美元甚至1,000美元。第二，Renesas IC时钟业务预计2027年中迎来营收拐点。第三，未来几个季度营收增速可能超越长期目标。#文字观点", "publish_time": "2026-09-11 09:04", "tags": ["文字观点"]}, "attachment:files/摩根士丹利 - 中国调研纪要——第二天 - 2026-09-08_Rachel L Zhang,Hannah Yang(原文).pdf": {"id": "attachment:files/摩根士丹利 - 中国调研纪要——第二天 - 2026-09-08_Rachel L Zhang,Hannah Yang(原文).pdf", "kind": "attachment", "title": "摩根士丹利 - 中国调研纪要——第二天 - 2026-09-08_Rachel L Zhang,Hannah Yang(原文)", "source_label": "摩根士丹利", "excerpt": "M Idea China Materials | Asia Pacific China Trip Takeaways – Day 2 Morgan Stanley Asia Limited+ Rachel L Zhang Equity Analyst Rachel.Zhang@morganstanley.com +852 2239-1520 Hannah Y", "content": "M Idea China Materials | Asia Pacific China Trip Takeaways – Day 2 Morgan Stanley Asia Limited+ Rachel L Zhang Equity Analyst Rachel.Zhang@morganstanley.com +852 2239-1520 Hannah Yang, CFA Equity Analyst Hannah.Yang1@morganstanley.com +852 2239-7079 Chris Jiang Equity Analyst Chris.Jiang@morganstanley.com +852 3963-1593 Cynthia Tang Research Associate Cynthia.Tang@morganstanley.com +852 3963-4360 Greater China Materials Asia Pacific Industry View AttractiveOn day 2 of our China trip, we met with companies with business in cobalt, high-end copper products, glass fabrics, and rare earth magnets. AI/data centers still the strongest structural demand theme for copper: Jintian Copper (601609.SS, Not Covered) expects rapid AI-related capacity expansion into 2027, particularly in liquid cooling plates and rack busbars. A next-generation AI server rack could consume ~1.5t of copper across cooling plates (~1t) and busbars (~0.5t)., but after processing and yield adjustment, only ~30% of volume actually goes into the rack. The industry has significant barriers from process know-how, yield, and customer qualification, rather than high working capital alone. High copper prices are accelerating substitution in traditional applications, but AI/EV demand is comparatively price-insensitive: Jintian sees 2027 potentially becoming the first meaningful year of aluminum-for-copper substitution in Chinese air conditioners. At the current absolute copper/aluminum price gap of ~Rmb80k/t, substitution economics are increasingly compelling; 50% substitution could theoretically reduce copper demand by ~1mnt while adding ~500kt of aluminum demand. Conversely, AI data centers continue to increase copper intensity as cooling structures become larger and more complex, while EVs require ~120kg copper versus only 10kg+ for ICE vehicles. China's scrap copper market could become an increasingly important source of secondary supply: However, tax/invoice distortions remain a major constraint for compliant supply. Jintian estimates that 300–500kt of incremental domestic scrap copper could emerge annually over the next 10–15 years as China's installed copper stock reaches end of life. Over time, rising domestic scrap availability should structurally improve China's secondary copper supply, China Jushi sees a highly disciplined electronic-glass supply environment into 2027 . Management expects essentially no meaningful new yarn supply in 2027, apart from Jushi's own ~50kt project starting toward year-end. Low-Dk, T-glass, and Q-glass products are largely through qualification, with commercial production expected around end-2026. Pricing is also stronger in finer products, with 2116/1080 ASP at ~Rmb14–15/m and larger increases than 7628 (YTD up 170%). Zimbabwe and lithium – 2H export quota sufficient: Huayou targets 70–80kt of lithium production in 2026 – both self-supplied ores and recycled. Its lithium sulfate plant has ~50kt annual capacity and made its first commercial shipment in April 2026, making Huayou the first producer to achieve localized lithium sulfate production in Zimbabwe. The second batch of spodumene export quotas was given out to Huayou and other lithium miners. They are sufficient; the main bottleneck is now logistics via Durban, where expanding DRC copper exports are also competing for capacity. The policy direction still favora downstream processing, making lithium sulfate structurally more attractive than concentrate exports.Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. September 8, 2026 09:00 PM GMT Downloaded by zouguanzhong@cramc.hk Not for redistribution without written consent of Morgan Stanley M Idea 2Huayou Cobalt We met with the board secretary from Huayou Cobalt in Tongxiang on September 8. Key takeaways from our meeting follow. Huayou is building gypsum-based acid production lines to reduce production costs at Huayue and Huafei: Commissioning is scheduled from year-end through 2Q next year. Once fully operational, the projects are expected to raise the company’s sulfur self- sufficiency ratio to ~30%. Huafei, which is currently operating at half capacity, would require production to at least avoid cash losses before resuming output. Huayou's HPAL nickel production is ~100kt in 1H26 vs. ~240kt in 2025. The drought in Indonesia has not affected the company’s nickel production. Nickel ore prices for HPAL production in Indonesia have declined to around US$30/ wmt from a previous high of US$33–34/wmt. Huayou's RKEF projects (45ktpa Huake and 20ktpa Qingtian) are now generating a small profit: Production cost is ~US$13k/t (ferronickel) and ~US$16k/t (nickel-equivalent). RKEF nickel production volume was ~40kt in 1H26. Full-year lithium chemicals output is expected at 70–80kt, including 70kt+ from self- supplied ore and 10kt+ from recycling. Lithium output from Arcadia project in Zimbabwe is expected to reach ~100kt next year. The lithium project in Ghana to be acquireed is undergoing government approval: It is a greenfield development targeting 50kt of lithium carbonate output in 2028, based on spodumene grades at 1.3–1.4%, with estimated capex of US$200–300mn. M Idea Morgan Stanley Research 3JL Mag Rare-Earth We met with IR from JL Mag Rare-Earth in Ningbo on September 8. Key takeaways from our meeting follow. Full-year 2026 utilization is expected to stay above 90% (capacity: 40kt blanks), indicating apparent HoH volume growth in 2H – normally the peak season 26年8月美国CPI", "source_label": "其他", "excerpt": "Transmission of material in this release is embargoed until USDL -26-1496 8:30 a.m. (E T) Friday , September 11 , 2026 T echnical information: (202) 691-7000 • cpi_info @bls.gov • ", "content": "Transmission of material in this release is embargoed until USDL -26-1496 8:30 a.m. (E T) Friday , September 11 , 2026 T echnical information: (202) 691-7000 • cpi_info @bls.gov • www.bls.gov/cpi Media c ontact: (202) 691-5902 • PressOffice@bls.gov CONSUMER PRICE INDEX – A UGUST 2026 The Consumer Price Index for All Urban Consumers (CPI- U) in creased 0.4 percent on a seasonally adjusted basis in August after rising 0.1 percent in Ju ly, the U.S. Bureau of Labor Statistics reported today. Over the last 12 months, the all items index increased 3.4 per cent before seasonal adjustment . T he index for gasoline rose 3.9 percent in August, accounting for over one third of the monthly all items increase. The index for energy increased 2.1 percent over the month. The shelter index rose 0.3 percent in August after rising 0.1 percent in July. The index for food increased 0. 1 percent over the month, as the index for food away from home increas ed 0.3 percent. T he index for all items less food and energy rose 0.3 percent after increasing 0.2 percent in July. Indexes that increased over the month include communication , lodging away from home, airline fares, education, and used cars and trucks. Conversely, t he index for medical care and the index for motor vehicle insurance w ere among the major indexes that de creased in August. T he all items index rose 3.4 percent for the 12 months ending August as it did for the 12 months ending July. The all item s less food and energy index rose 2.4 percent over the year, following a 2. 5-percent increase over the 12 months ending Ju ly. The energy index increased 16.3 pe rcent for the 12 months ending August. The food index increased 2.7 perc ent over the last year . NO TE: The Oct and Nov 2025 data values are not available due to the 2025 lapse in appropriations. -2 - NO TE: The Oct 2025 data values are not available due to the 2025 lapse in appropriations. Table A. Percent changes in CPI for All Urban Consumers (CPI-U): U.S. city average 1 Not seasonally adjusted. -3 - Food T he food index rose 0.1 percent in August, as it did in July . The index for food at home was unchanged over the month. Four of the six major grocery store food group indexes increased in August. The meat s, poultry, fish, and eggs index in creased 0.1 percent over the month, as the eggs index rose 2.9 percent. The index for other food at home also increased 0.1 percent in August. The nonalcoholic beverages index in creased 0. 2 percent over the month, and the dairy and related products index rose 0.3 percent. The index for cereals and bakery products was unchanged in August. I n contrast, t he fruits and vegetables index declined 0.4 percent in August after falling in the preceding 2 months. The index for lettuce continued to fall, declining 6.2 percent in August after decreasing 16.4 percent in July. Th e food away from hom e index rose 0.3 percent in August. The index for full service meals rose 0.4 percent , and the index for limited service meals was unchanged over the month. Th e food at home index rose 2.2 percent over the 12 months ending in August. The index for other food at home increased 2.4 percent, and the index for fruits and vegetables rose 3.2 percent over the year . The nonalcoholic beverages index increased 3.7 percent over the 12 months ending in August, and the cereals and bakery products index rose 2.6 percent over the same period. The index for meats, poultry, fish, and eggs increased 1.1 percent over the last 12 months. In contrast, t he dairy and related products index fell 0.3 percent over the year . Th e food away from home index rose 3.4 percent over the last year. The index for full service meals rose 3.5 percent , and the index for limited service meals rose 3.2 percent over the 12 months ending in August. E nergy Th e index for energy increased 2.1 percent in August after falling 1.5 percent in July . The gasoline index increased 3.9 percent over the month. (Before seasonal adjustment, gasoline prices in creased 2.5 percent in August.) Conversely, the index for natural gas de creased 1.1 percent in August, and the index for electricity fell 0.2 percent . Th e index for energy increased 16.3 percent over the past 12 months due in large part to the index for gasoline rising 27.4 percent over the same period. The natural gas index increased 4.4 percent over the 12 months ending in August, and the electricity index rose 3.8 percent. A ll items less food and energy T he index for all items less food and energy rose 0.3 percent in August after rising 0.2 percent in July. The shelter index increased 0.3 percent over the month after rising 0.1 percent in July . The index for owners’ equivalent rent rose 0.2 percent in August as did the index for rent. The lodging away from home index rose 2.4 percent in August after falling 2.8 percent the previous month. T he index for communication increased 2.3 percent over the month after rising 0.6 percent in July. The airline fares index rose 2.7 percent in August, and the education index increased 0. 8 percent. The index for used cars and trucks increased 0. 4 percent in August, and the index for new vehicles rose 0.3 percent. -4 - The personal care index and the household furnishings and operations index also increased over the month. T he medical care index decreased 0. 2 percent in August after rising 0.4 percent in Ju ly. The index for dental services fell 0.6 percent over the month. The hospital services index, physicians’ services index, and prescription drugs index were all unchanged in August. T he motor vehicle insurance index declined 0.8 percent in August after falling 0.3 percent in Ju ly. The index for apparel was unchanged in August as was the index for recreation . T he index for all it ems less food and energy rose 2.4 percent over the past 12 months. The shelter index increased 3.0 percent over the last year . Other indexes with notable increases over the last year include airline fares (+23.4 percent), recreation (+2.7 percent), medical care (+ 1.6 percent), and personal care (+3.8 percent ). N ot seasonally adjusted CPI measures T he Consumer Price Index for All Urban Consumers (CPI- U) increased 3.4 percent over the last 12 months to an index level of 334.980 (1982-84=100). For the month, the index rose 0.3 percent prior to seasonal adjustment. T he Consumer Price Index for Urban Wage Earners and Clerical Workers (CPI -W) increased 3.5 percent over the last 12 months to an index level of 328.481 (1982-84=100). For the month, the index increased 0.4 percent prior to seasonal adjustment. T he Chained Consumer Price Index for All Urban Consumers (C- CPI-U) increased 3.3 percent over the last 12 months. For the month, the index increased 0.3 percent on a not seasonally adjusted basis. Please note that the indexes for the past 10 to 12 months are subject to revision. _______________ The Consumer Price Index news release for September 202 6 is scheduled to be published on Wednesday , October 14, 2026, at 8:30 a.m. (ET). -5 - Technical Note B rief Explanation of the CPI The Consumer Price Index (CPI) measures the change in prices paid by consumers for goods and services. The CPI reflects spending patterns for each of two population groups: all urban consumers and urban wage earners and clerical workers. The all urban cons umer group represents over 90 percent of the total U.S. population. It is based on the expenditures of almost all residents of urban or metropolitan areas, including professionals, the self -employed, the poor, the unemployed, and retired people, as well as urban wage earners and cleri cal workers. Not included in the CPI are the spending patterns of people living in rural nonmetropolitan areas, farming families, people in the Armed Forces, and those in institutions, such as prisons and mental hospitals. Consumer inflation for all urban consumers is measured by two indexes, namely, the Consumer Price Index for All Urban Consumers (CPI-U) and the Chained Consumer Price Index for All Urban Consumers (C- CPI-U). The Consumer Price Index for Urban Wage Earners and Clerical Workers (CPI -W) is based on the expenditures of households included in the CPI- U definition that meet two requirements: more than one - half of the household's income must come from clerical or wag e occupations, and at least one of the household's earners must have been employed for at least 37 weeks during the previous 12 months. The CPI-W population represents approximately 30 percent of the total U.S. population and is a subset of the CPI-U population. The CPIs are based on prices of food, clothing, shelter, fuels, transportation, doctors’ and dentists’ services, drugs, and other goods and services that people buy for day- to-day living. Prices are collected each month in 75 urban areas across the country from about 6,000 housing units and approximately 22,000 retail establishments (department stores, supermarkets, hospitals, and other types of stores and service establishments). All taxes directly associated with the purchase and use of items are included in the index. Prices of fuels and a few other items are obtained every month in all 75 locations. Prices of most other commodities and services are collected every month in the three largest geographic areas and every other month in other areas. Prices of most goods and services are obtained by personal visit, telephone call, web , or app collection by the Bureau’s trained representatives. I n calculating the index, price changes for the various items in each location are aggregated using weights, which represent their importance in the spending of the appropriate population group. Local data are then combined to obtain a U.S. city average. F or the CPI -U and CPI -W, separate indexes are also published by size of city, by region of the country, for cross- classifications of regions and population- size classes, and for 23 selected local areas. Area indexes do not measure differences in the level of prices among cities; they only measure the average change in prices for each area since the base period. For the C- CPI-U, data are issued only at the national level. The CPI- U and CPI -W are considered final when released, but the C- CPI-U is issued in preliminary form and subject to three subsequent quarterly revisions. The index measures price change from a designed reference date. For most of the CPI -U and the CPI-W, the reference base is 1982 -84 equals 100. The reference base for the C- CPI-U is December 1999 equals 100. An increase of 7 percent from the reference base, for example, is shown as 107.000. Alternatively, that relationship can also be expressed as the price of a base period market basket of goods and services rising from $100 to $107. -6 - Sampling Error in the CPI The CPI is a statistical estimate that is subject to sampling error because it is based upon a sample of retail prices and not the complete universe of all prices. BLS calculates and publishes estimates of the 1 - month, 2-month, 6-month, and 12-month percent change standard errors annually for the CPI- U. These standard error estimates can be used to construct confidence intervals for hypothesis testing. For example, the estimated standard error of the 1-month percent change is 0.04 percent for the U.S. all items CPI. This means that if we repeatedly sample from the universe of all retail prices using the same methodology, and estimate a percentage change for each sample, then 95 percent of these estimates will be within 0.08 percent of the 1 -month percentage change based on all retail prices. For example, for a 1- month change of 0.2 percent in the all items CPI- U, we are 95 percent confident that the actual percent change based on all retail prices would fall between 0.12 and 0.28 percent. For the latest data, including information on how to use the estimates of standard error, see www.bls.gov/cpi/tables/variance-estimates/home.htm. Calculating Index Changes Movements of the indexes from 1 month to another are usually expressed as percent changes rather than changes in index points, because index point changes are affected by the level of the index in relation to its base period, while percent changes are not. The following table shows an example of using index values to calculate percent changes: Item A Item B Item C Year I 112.500 225.000 110.000 Year II 121.500 243.000 128.000 Change in index points 9.000 18.000 18.000 Percent change 9.0/112.500 x 100 = 8.0 18.0/225.000 x 100 = 8.0 18.0/110.000 x 100 = 16.4 U se of Seasonally Adjusted and Unadjusted Data The Consumer Price Index (CPI) program produces both unadjusted and seasonally adjusted data. Seasonally adjusted data are computed using seasonal factors derived by the X- 13ARIMA- SEATS seasonal adjustment method. These factors are updated each February, and the new factors are used to revise the previous 5 years of seasonally adjusted data. The factors are available at www.bls.gov/web/cpi/cpi- seasonal -factors.xlsx . For more information on data revision scheduling, please see the Seasonal Adjustment questions and answers page at www.bls.gov/cpi/seasonal- adjustment/questions- and-answers.htm and the Timeline of Seasonal Adjustment Methodological Changes at www.bls.gov/cpi/seasonal- adjustment/timeline -seasonal -adjustment -methodology- changes.htm. How to Use Seasonally Adjusted and Unadjusted Data For analyzing short- term price trends in the economy, seasonally adjusted changes are usually preferred since they eliminate the effect of changes that normally occur at the same time and in about the same magnitude every year— such as price movements resul ting from weather events, production cycles, model changeovers, holidays, and sales. This allows data users to focus on changes that are not typical for the time of year. -7 - The unadjusted data are of primary interest to consumers concerned about the prices they actually pay. Unadjusted data are also used extensively for escalation purposes. Many collective bargaining contract agreements and pension plans, for example, tie com pensation changes to the Consumer Price Index before adjustment for seasonal variation. BLS advises against the use of seasonally adjusted data in escalation agreements because seasonally adjusted series are revised annually for five years. Intervention Analysis The Bureau of Labor Statistics uses intervention analysis seasonal adjustment (IASA) for some CPI series. Sometimes extreme values or sharp movements can distort the underlying seasonal pattern of price change. Intervention analysis seasonal adjustment is a process by which the distortions caused by such unusual events are estimated and removed from the data prior to calculation of seasonal factors. The resulting seasonal factors, which more accurately represent the seasonal pattern, are then applied to the unadjusted data. For example, this procedure was used for the motor fuel series to offset the effects of the 2009 return to normal pricing after the worldwide economic downturn in 2008. Retaining this outlier data during seasonal factor calculation would distort the comput ation of the seasonal portion of the time series data for motor fuel, so it was estimated and removed from the data prior to seasonal adjustment. Following that, seasonal factors were calculated based on this “prior adjusted” data. These seasonal factors represent a clearer picture of the seasonal pattern in the data. The last step is for motor fuel seasonal factors to be applied to the unadjusted data. For the seasonal factors introduced for January 2026, BLS adjusted 57 series using intervention analysis seasonal adjustment, including selected food and beverage items, motor fuels and vehicles. Revision of Seasonally Adjusted Indexes Seasonally adjusted data, including the U.S. city average all items index levels, are subject to revision for up to 5 years after their original release. Every year, economists in the CPI calculate new seasonal factors for seasonally adjusted series and ap ply them to the last 5 years of data. Seasonally adjusted indexes beyond the last 5 years of data are considered to be final and not subject to revision. For January 2026, revised seasonal factors and seasonally adjusted indexes for 202 1 to 2025 were calculated and published. For series which are directly adjusted using the Census X- 13ARIMA- SEATS seasonal adjustment software, the seasonal factors for 202 5 will be applied to data for 202 6 to produce the seasonally adjusted 2026 indexes. Series which are indirectly seasonally adjusted by summing seasonally adjusted component series have seasonal factors which are derived and are therefore not available in advance. Determining Seasonal Status Each year the seasonal status of every series is reevaluated based upon certain statistical criteria. Using these criteria, BLS economists determine whether a series should change its status from \"not seasonally adjusted\" to \"seasonally adjusted\", or vice versa. If any of the 81 components of the U.S. city average all items index change their seasonal adjustment status from seasonally adjusted to not seasonally adjusted, not seasonally adjusted data will be used in the aggregation of the dependent series fo r the last 5 years, but the seasonally adjusted indexes before that period will not be changed. For 2026, 36 of the 81 components of the U.S. city average all items index are not seasonally adjusted. -8 - Contact Information For additional information about the CPI visit www.bls.gov/cpi or contact the CPI Information and Analysis Section at 202-691-7000 or cpi_info@bls.gov. For additional information on seasonal adjustment in the CPI visit www.bls.gov/cpi/seasonal- adjustment/home.htm If you are deaf, hard of hearing, or have a speech disability, please dial 7-1- 1 to access telecommunications relay services. Table 1. Consumer Price Index for All Urban Consumers (CPI-U): U.S. city average, by expenditure category, ", "status": "extracted"}, "post:2026-09-11T08-34:b9434ae2d60b": {"id": "post:2026-09-11T08-34:b9434ae2d60b", "kind": "post", "title": "2026-09-11 08:34", "source_label": "帖子正文", "excerpt": "隔夜美股与大类资产反映的宏观特征：七重画像 特征一：经典的\"滞胀式\"资产定价——涨的是\"胀\"，跌的是\"滞\" 隔夜全部资产的价格行为可以归入一个坐标系：凡是受益于通胀上行的（原油+7%、天然气、能源上游股）上涨，凡是受益于增长与折现率的（科技股、铜、白银、长久期国债）下跌，凡是抗通胀但怕加息的（黄金-", "content": "隔夜美股与大类资产反映的宏观特征：七重画像 特征一：经典的\"滞胀式\"资产定价——涨的是\"胀\"，跌的是\"滞\" 隔夜全部资产的价格行为可以归入一个坐标系：凡是受益于通胀上行的（原油+7%、天然气、能源上游股）上涨，凡是受益于增长与折现率的（科技股、铜、白银、长久期国债）下跌，凡是抗通胀但怕加息的（黄金-1.9%）被夹在中间下跌。这不是衰退交易（衰退交易里美债应大涨、美元走弱），而是教科书式的滞胀定价： 股：四连跌，但必需消费、电信、医保逆势上涨——资金在权益内部也在买\"胀\"抗\"滞\"； 债：股债双杀，2Y +13bp、10Y逼近5%、30Y创2007年新高——债券不提供任何避险功能； 商品：油独强、铜金齐跌——只有供给端有真实缺口的品种才配得上\"通胀受益\"，宏观贝塔的\"再通胀交易\"被实际利率证伪； 关键细节：PPI同比5.4%（\"胀\"）与初请失业金20.6万平稳、消费公司业绩不差（\"滞\"但未衰退）并存——市场担心的不是增长坍缩，而是\"增长尚可但通胀失控\"的最难受组合，因为它剥夺了央行救市和财政刺激的正当性。 特征二：利率 regime 的质变——从\"利率水平问题\"变为\"利率定价权问题\" 隔夜债市数据里有三个超越单日波动的结构信号： 政策工具失灵。财政部把长债回购扩容三倍至60亿，实际只成交51.9亿，收益率不降反升。回购治标不治本——它解决旧券流动性，解决不了\"财政赤字+AI发债+市政债供给\"的结构性供给潮（30年期市政债收益率已创2011年新高，压力向地方政府融资蔓延）。 全球利率定价权转移。日本10Y突破3%（30年来首次），过去一年上行1.4个百分点、超过美国涨幅两倍；ECB加息且市场定价最快10月再加。美债不再是全球利率的锚，日元套息这一全球流动性的底层结构在松动——这是所有资产定价中最大的慢变量。 需求侧的分裂。30Y标售间接投标人（外国央行、保险）接走79.5%、做市商仅2.2%，一级火爆vs二级冷清——长钱在主动配置绝对收益率，短钱在止损。收益率的\"顶\"由配置盘决定、\"波动\"由交易盘决定，5%附近是长钱的入场线而非逃离线（1400万美元期权押注破5%的对手盘，正是这批配置盘）。 特征三：政策信誉成为独立定价变量 本轮宏观的新特征是：央行的言行本身（而非经济数据）在直接驱动市场。PPI超预期只是触发器，真正的放大器是—— 沃什8月Jackson Hole已定调鹰派（\"重点应该是物价\"），其导师Druckenmiller同步放话\"降息荒谬、AI或有盈利泡沫\"，形成\"主席-导师\"的舆论闭环； 市场9月加息概率从64%→75%，定价从\"加不加\"转向\"25还是50bp\"——央行被逼进\"华山一条路\"：按兵不动已不可选，只剩幅度之争； ECB拉加德\"市场做市场该做的事，我们做我们该做的事\"——央行与市场的沟通默契破裂，各说各话； 工具的适配性矛盾公开化：Waller派指出油价/财政/AI抢资金都不是货币政策能解决的，Hammack派坚持\"通胀不会自己回到2%\"——用错误的工具治供给冲击的政策风险，与失去信誉的制度风险，孰轻孰重，已成公开市场辩论。 宏观含义：在信誉博弈期间，数据（今晚CPI）的边际杀伤力被放大，因为每个数据点都会被解读为\"逼央行表态\"的筹码。 特征四：地缘冲突升格为\"宏观元变量\"——时间维度被永久性拉长 隔夜最重要的单条信息不是价格，而是万斯/鲁比奥私下警告美伊冲突可能持续至2029年（与特朗普\"选后立即结束\"的公开表态形成官方层面的矛盾）。配合三个物理证据——沙特产量降至1990年来最低、伊朗恢复地下导弹生产、胡塞控制曼德海峡沿岸——市场被迫重估的不是战争风险溢价的高低，而是溢价的期限结构：从\"事件脉冲\"重估为\"多年期供给折价\"。 这一重估的宏观外溢是系统性的： 通胀维度：油价中枢、柴油裂解价差历史新高、TTF创2022年12月新高→通胀粘性成为基准情景而非风险情景； 货币政策维度：ECB已先行加息、美联储被逼表态→全球政策利率 floor 系统性抬升； 贸易维度：曼德海峡（全球一成贸易）+霍尔木兹（两成石油）双咽喉受威胁→航运保险、运价、交付周期全面重估（FRO油轮上涨是预演）； 产业维度：福特\"竭力保住电车\"（高油价重估电动化）、IEA煤炭达峰推迟（能源安全压倒转型）、国防无人化采购（AVAV/CACI上涨）——地缘冲突正在改写能源转型、产业政策、军事采购三条长期曲线。 特征五：流动性结构的\"彩票化\"与避险的\"因子化\"并存 微观结构透露出宏观流动性的两种极端状态同时存在： 尾部彩票化：TNON +117%（市值350万美元）、DBGI +81%——流动性退潮期，nano-cap成为残余游资的赌场，此类异动历史上多出现在风险偏好周期的顶部区域，是情绪过热的反向温度计； 避险因子化：高盛交易台明确记录\"电信/有线、必需品、REITs走强，半导体、AI基建承压\"——防御不再是选个股，而是自上而下的行业/因子再配置；对冲基金和长线投资者同日各净卖出10亿美元，但卖出集中于科技和通信服务——资金不是离场，而是在权益内部换仓（MOC收盘市价单16.5亿美元卖出指令集中释放）。 宏观含义：市场不是没钱，是在给钱重新排队——按\"现金流确定性\"重新定价一切。 特征六：财政与货币的政策不确定性开始互相污染 两个政治事件进入宏观定价： 特朗普\"5000美元红利\"：1.2-1.3万亿美元刺激（vs 关税年收入1900亿），共和党党内已现\"利率死亡螺旋\"警告——即便落地概率不足15%，它揭示的方向（财政纪律让位于选举）本身就是长端利率的风险溢价来源； 美债上限/信用评级暗线：标普已因\"大客户依赖+AI盈利不确定\"下调甲骨文评级，AI信用利差一年走阔50bp+——财政可持续性与企业债务质量的评估体系正在把AI资本开支计入\"风险\"而非\"增长\"，这是市场心理的深层转变。 宏观含义：财政扩张→供给增加→长端利率上行→挤压私人资本开支（尤其AI）→盈利预期受损→财政空间进一步收窄——一个自我强化的负反馈环已经出现在定价视野中（德银：\"制造了一个必须不断喂养的怪物\"）。 特征七：盈利与估值的历史性背离，暗示定价逻辑的切换临界点 Seaport的数据是最冷静的提醒：标普二季度EPS同比+55%（剔除未实现收益+35%）、分析师预期罕见持续上修，但指数四连跌、风险溢价压缩至2002年以来最低——基本面在改善，估值在被压缩，两者对冲后股价横盘。这种\"强盈利+弱股价\"的组合历史上只出现在两种过渡期：利率 regime 切换期，或牛市末期。区别信号在于：如果盈利上修持续而利率见顶（CPI证伪），当前就是\"以时间换空间\"的蓄势；如果利率继续上行（10Y破5.5%），盈利将无法对冲估值杀伤（法兴警戒线）。 总结这七重特征的一句话：隔夜盘面宣告宏观进入了一个\"央行信誉受审、财政约束显性化、地缘供给折价长期化、定价权从美债向日债迁移\"的新组合——在这个组合里，资产的价格不再由增长预期主导，而由\"谁的现金流能在高利率+高油价+高不确定性下存活\"主导；这也是为什么涨的是油、是电信、是医保、是订单兑现的甲骨文，而跌的是一切依赖远期折现和廉价融资的东西。对A股的全部推导，都应从这一宏观底色出发。#文字观点", "publish_time": "2026-09-11 08:34", "tags": ["文字观点"]}, "post:2026-09-11T07-23:47cb8c087227": {"id": "post:2026-09-11T07-23:47cb8c087227", "kind": "post", "title": "2026-09-11 07:23", "source_label": "帖子正文", "excerpt": "【周五你需要知道的隔夜全球要闻：也门胡塞武装称红海航行“不受威胁”；国际原油大涨，国际金银大跌，美债收益率上升】 1、美股三大指数集体收跌，道指跌0.6%，纳指跌0.65%，标普500指数跌0.58%。", "content": "【周五你需要知道的隔夜全球要闻：也门胡塞武装称红海航行“不受威胁”；国际原油大涨，国际金银大跌，美债收益率上升】 1、美股三大指数集体收跌，道指跌0.6%，纳指跌0.65%，标普500指数跌0.58%。存储板块、铜概念股下挫；费城半导体指数跌超2%；明星科技股涨跌不一，英特尔跌超5%，苹果涨超3%，英伟达跌超2%。 2、也门胡塞武装10日称，国际船只通过红海海域和曼德海峡“不受威胁”，仍然是安全的。 3、国际原油期货结算价大涨，WTI原油期货收于每桶102.48美元，涨幅6.69%；布伦特原油期货收于每桶107.63美元，涨幅6.34%。 4、国际贵金属大跌，现货黄金跌1.91%，报4314.82美元/盎司；现货白银跌5.43%，报63.60美元/盎司。 5、欧洲主要股指收盘集体下跌，英国富时100指数跌0.57%，法国CAC40指数跌0.42%，德国DAX30指数跌0.69%。 6、美国财政部表示，在9月10日进行了价值51.87亿美元的10至20年期美国国债流动性回购操作。 7、美债收益率上升，此前回购未达目标；美国10年期国债收益率盘中触及2023年10月以来最高水平；2年期国债收益率盘中创2024年以来最高。 8、美国30年期国债拍卖收益率达到自2001年8月以来的最高水平。 9、伊朗伊斯兰革命卫队海军宣布，在霍尔木兹海峡入口处拦截一艘“正在执行任务”的美国无人水面艇。 10、美财政部宣布对伊朗相关个人和实体实施制裁。 11、美军中央司令部当地时间9月10日表示，截至当天，美军在对伊朗的海上封锁行动中已要求96艘商船改变航向。 12、阿尔及利亚决定自9月11日起关闭领空，禁止所有在阿联酋注册的民用和军用飞机进入。 13、房地美称美国抵押贷款利率上升至6.76%，为2025年6月以来最高水平。 14、美国二手房销量降至一年多以来最低，高利率使购房者保持观望。 15、美国全国平均柴油价格首次突破每加仑6美元。 16、微软计划将数据中心容量扩充至原来的三倍，达到38吉瓦。 17、Spacex表示，星舰下次飞行将产生营收；目标是明年发射首批轨道计算卫星。 18、OpenAI推出针对金融服务的ChatGPT，采用GPT-6 Astra推理技术。 19、谷歌表示，Gemini应用现已在Windows平台上线。谷歌推出谷歌云开发者插件，用于人工智能编码助手。 20、英伟达表示，Grace Blackwell的出货量环比增长27%。 21、保时捷完成出售Bugatti Rimac和Rimac集团股权，预计将从本次交易中获得约10亿欧元收入。 22、因凡蒂诺据悉能够获得足够票数继续担任国际足联主席，其反对者正考虑调整策略以限制其权力。(来自财联社APP)#文字观点", "publish_time": "2026-09-11 07:23", "tags": ["文字观点"]}, "post:2026-09-11T09-06:9c02a95165aa": {"id": "post:2026-09-11T09-06:9c02a95165aa", "kind": "post", "title": "2026-09-11 09:06", "source_label": "帖子正文", "excerpt": "20260910复盘 宏观： 1. PPI数据公布后，美联储9月加息概率升至70%。2. 欧洲央行将三大关键利率上调25个基点。", "content": "20260910复盘 宏观： 1. PPI数据公布后，美联储9月加息概率升至70%。 2. 欧洲央行将三大关键利率上调25个基点。 3. 国际原子能机构总干事:发现伊朗镐山活动的证据。 4. 伊朗被曝暂停对外国能源运输船舶征收10%的运费附加费。 5. 沙特向OPEC表示，其原油产量再次骤降至1990年以来的最低水平。 人工智能： 1. FCC发布最终规则，将通信设备整机管控延伸至清单实体生产的逻辑硬件组件，封堵组件、线上销售、设备变更三大漏洞，禁止含黑名单实体逻辑硬件组件的设备获取授权，并强化线上市场销售监管。旭创、新易盛、天孚、东山等目前均未作为命名实体出现在 Covered List 中。 2. 卖方：二线PCB环增预计将十分惊艳，EPS高增为主推动力，Q3集体迎来业绩爆发。ABF载板是26H2乃至27年PCB最缺的细分环节，供需缺口会持续放大到2030年。 3. 外媒报道HW Ascend 950DT建议价近三月涨约60%至25万元；寒武纪澄清未发涨价消息。 4. DeepSeek V4.1显著减小了KV cache的规模，HBM需求再次削减3.9倍，SSD需求相比V4-Flash减少8倍。 5. 2026中国算力大会明日启幕 将集中发布一批首创首发算力软硬件新品。 6. 全球MLCC龙头村田制作所启动产品线优化，停产GRM、GRJ等9个系列消费级常规与车用MLCC，客户须于2027年底前确认转产。 7. Anthropic研究员认为，未来十年人工智能“灭绝全人类”概率超过10%。 8. 卖方：NPO去“DSP”加速落地，TIA/Driver迎价值重估。 9. 卖方：hsc基础类检测设备订单饱满，2027年有望迎来爆发; 硅光晶圆检测、采样示波器2027年有望实现从0到1甚至1到10的突破。 造船： 卖方：20年一遇的超级船周期，新船造价冲上历史高位97% · 订单排到2030年。 农业： 美国气象预报机构CPC表示，厄尔尼诺现象正在增强，2026-27年北半球秋冬期间出现极强厄尔尼诺事件的可能性超过90%。 跨境支付： 印度把跨境支付与金融合作列入重点议程，准备推进降低跨境支付成本、提升清算效率，以及各成员国快速支付系统与央行数字货币（CBDC）的互联。 有色： 白宫暂缓决定对精炼铜加征关税，因为顾虑此举会推高铜价和国内生产成本。 策略观察： 1. 今日成交16625亿，缩量2107亿。临近CPI的周四，彻底没活人了，都歇了，特朗普选举前也taco不了了，A股最擅长提前避险，晚上这个情绪面还是有点糟，明天起码双创前低的位置得守住吧。 2. 板块方面，银行、建材（电子布这波压制着没咋反弹）和公用事业领涨。没什么看头，熬到cpi落地吧。 3. 题材方面，题材毫无生气，前一天涨的，后一天都不敢连拉，又没有全部大跌推倒重来，谈不上绝对冰点，只是个无聊点。非AI的PCB今天算少数集体表现的细分，趋势走了一段时间了，这块有业绩预期且筹码结构较好，筹码相对好是因为毕竟是非AI PCB，之前没抱团，对业绩预期也还没一致。AI的PCB相对也抗跌，剑桥还一度拉升，明天能不能抗住真不知道了，光模块设备短期锐度最高的那个仍然维持强势震荡，科技非常缩圈了。#文字观点", "publish_time": "2026-09-11 09:06", "tags": ["文字观点"]}, "attachment:files/A股与港股复盘20260911.pdf": {"id": "attachment:files/A股与港股复盘20260911.pdf", "kind": "attachment", "title": "A股与港股复盘20260911", "source_label": "其他", "excerpt": "A股与港股复盘 2026年9月11日 研究笔记 · 不构成投资建议 第 1 / 14 页 股票市场复盘 放量普跌，AI硬件逆势；美国通胀略超预期 2026年9月11日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。", "content": "A股与港股复盘 2026年9月11日 研究笔记 · 不构成投资建议 第 1 / 14 页 股票市场复盘 放量普跌，AI硬件逆势；美国通胀略超预期 2026年9月11日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 今天两市放量下挫，成交从 1.65 万亿放量至 1.97 万亿，打破此前连续 4 个交易日的缩量，证伪了昨天\"资金主动降仓位、缩量观望\"的判断——今天是真实的放量抛售。有色金属全线暴跌，成为跌幅最深的板块，原因是前期涨幅大，叠加中东地缘风险推升避险情绪，铜、白银、铅锌、锡、锑普遍跌 4% 到 5.5%，龙头北方铜业跌停；印制电路板、被动元件、通信线缆、地面兵装则在工信部「人工智能+软件」行动方案和军工持仓回升报告等具体催化下逆势大涨。普跌里的主动买盘，从昨天含糊的「银行 + 覆铜板」两条线，收窄成更清晰的「硬科技制造 + 军工」对「商品、金融资产」的轮动。同一天港股结构也在反转：跌幅小于 A 股，是连续第 5 日下跌以来第一次，科技权重由跌转涨，昨天撑住恒指的银行、内险反而获利回吐。 真正决定下一个交易日基调的是隔夜美国 8 月 CPI：核心环比意外偏热，把 9 月加息概率推到约 79%、10 年美债逼近 5%但通胀数据之后略有下降，但美股期货和 VIX 双双回暖，是\"利空出尽\"式的反应——这一段两地收盘时都还没来得及定价。我们在日前的美日展望报告中讨论了美股很可能已经反应了美联储加息预期，与共识相反——只要加息路径不恶化（远端利率不大幅上涨）。 上证收 3,888 点跌 1.2%、跌破 50 日均线，深成指跌 1.1%，中证500、中证1000 分别跌 1.8%、2.1%，北证50 跌 2.7%；恒指收 24,806 点跌 0.6%、连续第 5 日下跌但跌幅小于 A 股，恒生科技仅跌 0.2%。两市成交放量到约 1.97 万亿、比上日多约 3,247.5 亿，全市场 639 家上涨、4,864 家下跌，跌停 21 家、较昨天翻倍。有色金属崩盘（北方铜业跌停），覆铜板、被动元件、军工地面兵装逆势涨停潮；港股腾讯、阿里、小米翻红，银行、内险获利回吐。美国 8 月 CPI 核心环比意外偏热，9 月加息概率跳到约 79%，10 年美债逼近 5%。 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 A股与港股复盘 2026年9月11日 研究笔记 · 不构成投资建议 第 2 / 14 页 本日报要 主线段： 昨天两市已经缩量到 1.65 万亿，今天没有延续下去——成交放量到约 1.97 万亿，多出 3,247.5 亿，跌停家数从 13—14 家跳到 21 家，说明昨天写的\"资金主动降仓位、等靴子落地\"只对了一半，今天靴子没等到，资金先卖了。真正带头跌的是有色金属：前两天涨价逻辑还很顺的铜、白银、铅锌、锡、锑，今天集体跌 4% 到 5.5%，板块龙头北方铜业直接跌停，一半是前期涨幅兑现，一半是中东地缘风险把工业金属当风险资产卖。同一天，印制电路板、被动元件、通信线缆、军工地面兵装逆势大涨，多股涨停或近涨停，催化很具体——工信部当天发布「人工智能+软件」行动方案，中信建投前一天的报告显示公募军工持仓回升。港股这一半今天反常：跌幅（0.6%）小于 A 股（1.2%），是连续第 5 日下跌以来第一次，腾讯、阿里、小米、京东由跌转涨，昨天靠 3,000 亿注资撑住恒指的银行、内险反而获利回吐。收盘之后，美国 8 月 CPI 公布：同比、环比都与预期一致，只有核心环比 0.3% 略超预期的 0.2%，市场隐含的 9 月加息概率跳到约 79%，10 年美债逼近 5% 整数关口；但美股期货和 VIX 反而回暖，和两天前 PPI 公布当天的股债双杀不同，两地对这段还没来得及定价。 A股： 上证指数收 3,888 点跌 1.2%，深证成指收 13,471 点跌 1.1%，沪深300 收 4,510 点跌 0.8%，创业板指收 3,322 点跌 0.5%，科创50 收 1,553 点跌 1.0%，中证500 跌 1.8%，中证1000 跌 2.1%，上证50 跌 1.2%，北证50 收 1,023 点跌 2.7%。两市成交 19,719.0 亿元（沪 9,581.9 + 深 10,137.1）约 1.97 万亿，较上日（1.65 万亿）放量约 3,247.5 亿元，打破此前连续 4 个交易日的缩量。涨跌家数：全市场（含北交所）639 家上涨、4,864 家下跌、48 家平盘（Wind 统计，收评口径）。涨停 40 只、跌停 21 只，昨天为涨停 40、跌停 13—14，跌停家数翻倍以上。两市主力资金净流出约 410.5 亿元。 港股： 恒生指数收 24,806 点跌 0.6%，连续第 5 个交易日下跌，但今天的跌幅小于 A 股，是这五天里第一次。国企指数收 8,246 点跌 0.3%，恒生科技收 4,321 点跌 0.2%。恒指成分成交约 2,284.3 亿港元，较上日约 1,988.7 亿回升；国企成分约 621.5 亿、恒生科技成分约 474.9 亿。恒指波幅指数 19.17，涨 4.9%，现货跌而波幅指数续升，用期权对冲波动的成本继续上升。 货币与汇率： 央行 9 月 11 日开展 7 天期逆回购 40 亿元，中标利率 1.40%；9 月 4 日操作量为零，所以当日无逆回购到期，公开市场净投放 40 亿元，仍是象征性投放。无 MLF、无降准，政策利率未动。人民币中间价报 6.7743，较上一交易日 6.7766 上调 23 个基点，连续第 2 个交易日调强且幅度扩大；在岸、离岸均约 6.708，基本持平；美元指数约 99.16，小幅走强。 互联互通： 南向资金 9 月 11 日净买入 44.3 亿港元（成交 954.9 亿港元，买入 499.6 亿、卖出 455.3 亿），沪市港股通净买 31.9 亿、深市港股通净买 12.4 亿，这是南向连续第 5 个交易日净买入。北向（外资）当日成交 2,913.2 亿元，较上日 2,236.9 亿元大幅回升，结束连续 4 个交易日的缩量，净额按现行规则不披露。以上为交易所收盘后公布的全日终值。 A股与港股复盘 2026年9月11日 研究笔记 · 不构成投资建议 第 3 / 14 页 大波动： 内地——神宇股份（300563）涨 20.0%（通信线缆及配套，主力净流入约 26.7 亿元居首）；风华高科（000636）涨停（被动元件 / MLCC）；内蒙一机（600967）涨 10.0%（地面兵装，军工持仓回升报告催化）；金安国纪（002636）涨 7.9%、逸豪新材（301176）涨 7.3% ，一半是中东地缘风险把工业金属当风险资产卖出，和黄金这类避险资产的逻辑正好相反。中证500、中证1000 跌 1.8%、2.1%，比沪深300 跌得多，北证50 再跌 2.7%，说明卖压集中在中小盘和资源股。与此同时，逆势的两条线比昨天更清晰：印制电路板、被动元件、通信线缆继续涨停潮，神宇股份涨 20%、风华高科涨停，催化是工信部当天发布的「人工智能+软件」行动方案，叠加建滔、中国巨石涨价函的延续；军工地面兵装板块大涨，内蒙一机涨 10% 逼近涨停，催化是中信建投前一天发布的报告——公募基金军工持仓已经从 2025 年四季度的 3.25% 回升到 2026 年二季度的 3.77%，叠加「十五五」新质战斗力建设与军贸扩大的预期。全市场跌停 21 家、比昨天翻倍以上，涨停仍有 40 家，说明打板资金没有离场，只是彻底换了方向——从昨天还带一点煤炭、有色残余的组合，切到了纯粹的硬科技制造和军工。北交所和创业板前两天靠新股炒作起来的名字也在退潮：C电科思仪、C洛轴股份进入无涨跌幅限制的交易日，跌 16% 到 18%，把前两天的涨幅回吐了一大截；同一天新股燧原科技（N燧原-U）首日上市涨 179%，说明打新和炒新的热度还在，只是筹码换手极快。 上证开在 3,911、最高 3,912、收 3,888，跌破了 50 日均线（约 3,912）和 20 日均线兼布林中轨（约 3,935），是这轮从月初高点回落以来第一次收在 50 日均线下方，全天低点 3,852 已经贴近布林下轨（约 3,868）。100 日、200 日均线与布林上轨仍粘合在 4,000—4,010 一线，是 7 月以来没有突破的压力带，随着上证走低，这条压力带离现价越来越远。科创50、创业板都收在各自 20 日均线下方，科创50 全天低点 1,516 更贴近布林下轨。 A股与港股复盘 2026年9月11日 研究笔记 · 不构成投资建议 第 6 / 14 页 显著性： 今天上证 −1.2%、中证1000 −2.1%，比昨天的普跌深，但仍在近 600 个交易日标准差的一倍多一点，算不上极端。值得记的是三件事。一是成交量的方向变了——两市成交从 1.65 万亿放量到 1.97 万亿，跌停家数从 13—14 家翻倍到 21 家，这是\"放量下跌\"而不是\"缩量观望\"，说明昨天判断资金在主动降仓位等待，今天已经等不下去、直接卖了。二是有色金属的跌法很有信息量：前两天还在涨的板块一天之内跌 4% 到 5.5%，且是全产业链跌（铜、铅锌、锡、锑、白银一起跌），这种同步下跌通常是资金整体撤出这个板块，而不是某个品种出了单独的坏消息。三是硬科技制造与军工的催化都是具体、可核查的政策与报告，不是纯情绪炒作，和这两天农业、传媒那种缺乏基本面支撑的题材股不是一回事——这条线如果周一还能延续，会比之前几天的题材炒作更有持续性。 代码 名称 收盘 当日 驱动 300563 神宇股份 27.92 +20.0% 通信线缆及配套，主力净流入约 26.7 亿元居首，与覆铜板同属电子硬件供应链 000636 风华高科 55.99 +10.0% 被动元件 / MLCC 涨停，工信部「人工智能+软件」行动方案催化 600967 内蒙一机 14.98 +10.0% 地面兵装，中信建投军工持仓回升报告催化，逼近涨停 002636 金安国纪 82.46 +7.9% 覆铜板龙头，建滔、中国巨石涨价函延续发酵 301176 逸豪新材 60.60 +7.3% 覆铜板 / 电解铜箔，昨日涨停后继续走强 601899 紫金矿业 32.26 −5.4% 有色金属龙头，工业金属全线回吐，避险情绪压制铜价 600192 长城电工 8.16 −6.0% 电网设备，回吐昨日 10% 涨停后的涨幅 — C电科思仪 44.10 −18.3% 无涨跌幅限制交易日，前两日新股炒作大幅回吐 — C洛轴股份 26.04 −16.1% 无涨跌幅限制交易日，前两日新股炒作大幅回吐 A股与港股复盘 2026年9月11日 研究笔记 · 不构成投资建议 第 7 / 14 页 判断表守合同，四行： 读法 内容 放量下跌，证伪昨天的缩量观望 两市成交从 1.65 万亿放量到 1.97 万亿，跌停家数从 13—14 家翻倍到 21 家。原因是有色金属全产业链集中兑现叠加避险情绪，不是等待靴子落地。后果是短期波动率会比\"缩量阴跌\"阶段更高。 有色金属同步崩盘 铜、白银、铅锌、锡、锑普遍跌 4% 到 5.5%，龙头北方铜业跌停。原因一半是前期涨幅兑现，一半是中东地缘风险下工业金属被当风险资产卖，与黄金的避险逻辑相反。这批股票能不能企稳，要看周一有色板块资金是净流入还是继续流出。 硬科技与军工的催化是可核查的政策事件 覆铜板、被动元件涨停对应工信部「人工智能+软件」行 不是缺买盘 恒指成分成交回升到约 2,284 亿，比昨天的缩量明显放大，南向也在同步净买。今天的下跌是真实的资金重新配置，而不是像昨天那样跟随外盘被动缩量下杀。 3. 街谈与热议 一句话 谁在说 \"有色这波跌得比涨得还快，北方铜业直接躺跌停\" 雪球 / 富途散户，有人说 \"工信部这个AI+软件文件一出，覆铜板、被动元件全跟着涨停\" 电子群，有人说 \"内蒙一机差一点封板，军工持仓回升的报告真管用\" 游资群，有人说 \"昨天还在夸银行避险，今天建行、国寿全跌，钱又跑了\" 东财股吧，有人说 \"腾讯阿里今天翻红了，是不是港股跌不动了\" 港股销售，有人问 \"CPI核心环比超预期，加息概率跳到八成，美股居然还涨\" 短线客，有人说 A股与港股复盘 2026年9月11日 研究笔记 · 不构成投资建议 第 10 / 14 页 • 有色崩盘找原因：盘中议论最多的是铜、白银、铅锌这批前两天还风光的板块，今天集体跌 4% 到 5.5%，板块龙头北方铜业直接跌停。有人说是前期涨幅太大要兑现，也有人把账算到中东地缘风险上——避险情绪一起，工业金属反而被当成风险资产卖。（对应第 1 节。） • AI硬件的政策发令枪：工信部当天发布「人工智能+软件」行动方案，电子群里第一时间把覆铜板、被动元件、通信线缆的涨停潮和这份文件挂钩。有人认为是继建滔、巨石涨价函之后的第二层催化——一层是提价，一层是政策。（对应第 1 节。） • 军工报告落地就涨：中信建投前一天发的军工持仓回升报告，今天地面兵装板块直接封住内蒙一机。游资群里在说\"报告发得准、买得也快\"，也有人提醒持仓回升只是\"边际改善\"，别当成趋势反转。（对应第 1 节。） • 港股画风变了：过去两天港股跌幅一直比 A 股大或差不多，今天反过来，腾讯、阿里、小米集体翻红，反倒是昨天避险买的银行、内险掉头向下。港股销售那头在猜是不是超跌反弹，也有人说只是获利了结换手，还得看下周一。（对应第 2 节。） • CPI落地，反而松了口气：美国核心 CPI 环比意外偏热，加息概率一下跳到近八成，但美股期货和 VIX 盘中都是回暖的。短线群里说这是\"靴子落地\"，比数据本身更关键的是股市怎么反应。（对应第 4 节。） （行情数字见第 1、2 节，本节不重述。） A股与港股复盘 2026年9月11日 研究笔记 · 不构成投资建议 第 11 / 14 页 4. 宏观、美股盘前、商品与国债 美股盘前 美国 8 月 CPI 于 08:30 ET 公布：同比涨 3.4%、环比涨 0.4%，均与市场预期一致，环比涨幅为 2026 年 5 月以来最大；核心 CPI 同比涨 2.4%，也与预期一致，但核心环比涨 0.3%，高于预期的 0.2%，是这份报告唯一的意外。数据公布后，市场隐含的 9 月加息概率跳升至约 79%，年初市场原本押注的是年内第三次降息；10 年期美债收益率在全球债券持续抛售中逼近 5% 整数关口，2 年期收益率也随之跳升。上一完整美股交易日 9 月 10 日现货收跌，标普500 收 7,591.70 点（−0.58%），纳斯达克综指收 26,081.72 点（−0.65%），道指收 52,064.10 点（−0.60%）。CPI 公布后美股期货转涨，标普500 期货约 7,648 点（+0.6%）、纳斯达克100 期货约 29,367 点（+0.8%），VIX 回落至约 16.3—16.6，较 9 月 10 日的 17.57 继续降温——和两天前 8 月 PPI 公布当天的股债双杀不同，这次更像是\"利空出尽\"，市场此前已经部分计入了偏热的可能。 中概ADR 收盘 当日 盘前当日 中概ETF 收盘 当日 盘前当日 BOSS直聘 16.41 +2.1% — 中国大型股 34.35 −0.6% +0.6% 汽车之家 21.67 +1.3% — 中概互联网 24.44 −1.4% +1.1% 雾芯科技 1.78 +1.1% — 金龙中国 22.38 −0.7% — 信也科技 3.40 +0.9% — MSCI中国 52.80 −1.0% — 中通快递 20.85 +0.6% — 中国科技 46.03 −1.7% — 万国数据 31.06 −4.1% — 沪深300 33.62 −1.2% — 晶科科技 11.68 −4.1% — 中国3倍做多 26.50 −1.9% +1.1% 蔚来 3.58 −3.2% +2.0% 中国3倍做空 31.41 +1.9% −1.1% 阿特斯 13.03 −3.2% +0.5% 中概互联2倍 18.41 −3.0% — 金山云 9.90 −3.0% — 恒生科技 11.96 −1.1% — 收盘 / 当日为 9 月 10 日美股现货，当天中概与 ETF 普遍收跌， 币。外卖亏损同比减少了一半 以上，而来自该业务的佣金和广告营收环比几乎翻了一番。管理层表示，如果 竞争保持稳定，那么 2026 年的外卖总投入应会低于 2025 年。 我们的 2026 年调整后净利润预测为 370亿元人民币，其中假设新业务亏损仅 同比减少 90亿元人民币。 2026 年2季度年化值显示仍有潜在上行空间，但前 提是竞争保持有序。 2) 服务和物流的重要性应会放大 京东采用 1P模式，自持库存并控制大部分的履约。当竞争对手通过补贴和自 动跟价使价格成为主导购买决策的标准时，这种结构便丧失了优势。新的价格 行为规则限制强制降价、跨渠道平价和自动跟价，这有可能使配送、安装、产 品真实性、售后服务和以旧换新回收重新影响用户选择。 京东运营 1,500 多个仓库，并对高价值品类采用直采模式。公司还打造了覆盖 350个城市的闪购骑手网络， 2025 年9月外卖日订单峰值超过 2,500 万单（ 链 接）。不过，我们没有将公司的外卖市场份额视为主要价值来源；关系更大的 重心在于，针对家电、电子产品和超市这些迁移至即时配送的品类提供最后一 公里物流服务。 日用百货为该电商平台带来多元化。 2026 年2季度超市和日用百货营收同比增 长5.6% ，而平台及广告服务营收增长 8.3% 。持续走强应将降低京东对补贴敏 感型电子品类的依赖。 3) 营收下滑似乎是由比较基数驱动，但趋势应会逆转 2025 年以旧换新国补提振了特定家电和电子产品的需求，这是京东的两个重要 品类。国补规模从 2025 年的 3,000 亿元人民币降至 2026 年的 2,500 亿元人民 币，且覆盖的品类减少。即使京东的竞争地位稳定，这也会造成不利的同比比 较基数。 截至目前的证据支持但不能证明这种解读。 2026 年2季度集团营收好于市场一 致预期，季度与年度活跃用户均同比增长 20%以上。我们预计 2026 年3季度 京东零售营收将恢复正增长，估算 2026 年下半年集团营收同比增长 7%，而 2026 年上半年同比增长 1%。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 论点。实现正增长，则会强化比较基数论；若在基数缓和后延续疲态，则会挑战这一季度京东零售3年 2026 比较基数驱动的观点。若在没有新一轮折扣的情况下，京东报告的品类增长情况，我们可以监测数据是否支持我们认为营收下滑是由通过跟踪国家统计局公布的每月家电及通讯设备零售额，以及补贴资金发放和润率改善，支持这一观点。价格监管也可能恢复京东服务能力的价值。前的下滑在很大程度上是算术性的。活跃用户增长、强韧的日用百货表现和利年补贴使异常强劲的需求集中在京东的核心品类中，使得目 2025 乐观情景是，挺，而京东营收下滑，则意味着公司损失市场份额。随着消费需求正常化，电子产品增速可能持续走弱。如果全国品类销售保持坚暴露了结构性份额损失。谨慎情景是，京东报告了集团层面营收的首次下滑，投资者中存在的争议是，补贴相关的比较基数是掩盖了健康的基础业务，还是投资者的主要争议焦点资料来源：摩根大通估算。率复苏理据如果没有下降，将会挑战全面的利润 各大平台的销售和营销开支总额 月份所在季度12 行业支出谨慎投资假设相当，将打破我们的 Temu 若支出与 用户获取强度 每一次业绩发布 欧洲 JoyBuy执行不力可能会开启新一轮支出周期 最终规则、处罚和竞争对手活动 年下半年 2026 外卖平台补贴行为规范的执行轮支出挑战相应投资理据亏损持续收窄，支撑盈利上行；新一 减亏和外卖投入 每一次业绩发布 新业务亏损示份额损失品类需求健康而京东营收低迷，则指 零售增速品类全国销售额、补贴发放和京东 布季度业绩发3年 2026 月度和 营收比较基数检验影响 关注点 时间 项目 ：风险、催化剂和重点关注项总结1表 4 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 中国 证券研究 2026 年9月10日姚橙 (86 21) 6106 6505 alex.yao@jpmorgan.com yD3B1AmZUZyAlQFF1jnCFVR+ei3YnV6qfoGzuQuuFgt92py/hOH3+I9QQp3h7QAn 5 盈利预测 表2：京东 2026年2季度业绩回顾 年底止于 12月31日 2Q26 同比 环比 （百万元，每股数据除外） 实际 市场一致预期 %差幅 % % 净收入 346,401 342,096 1% -3% 10% 毛利 59,307 55,474 7% 5% 12% 营业利润 (GAAP) 4,547 4,173 9% -629% NA 营业利润 (非GAAP) 5,483 na 512% NA 税前利润 (GAAP) 9,390 8,002 17% 4 11T09-09:2f5e8a382a79": {"id": "post:2026-09-11T09-09:2f5e8a382a79", "kind": "post", "title": "2026-09-11 09:09", "source_label": "帖子正文", "excerpt": "重点推荐#联讯仪器：高速光通信测试国产龙头，1.6T量价齐升，存储与CPO打开第二成长曲线 💡光通信测试仪器本土份额第一，境外收入占比过半 2024年公司在中国光通信测试仪器市场份额9.9%，位列第三、本土第一，海外厂商占约84%、国产化率空间大。客户端已覆盖中际旭创、新易盛等国内龙头，并进入Lum", "content": "重点推荐#联讯仪器：高速光通信测试国产龙头，1.6T量价齐升，存储与CPO打开第二成长曲线 💡光通信测试仪器本土份额第一，境外收入占比过半 2024年公司在中国光通信测试仪器市场份额9.9%，位列第三、本土第一，海外厂商占约84%、国产化率空间大。客户端已覆盖中际旭创、新易盛等国内龙头，并进入Lumentum、Coherent、Broadcom等国际客户供应链，2026H1境外收入占比53.86%，受益全球光模块扩产与国产替代双重驱动。我们预计2026～2027 年公司有望实现收入高增、经营杠杆释放下的利润率改善双击，首次覆盖给予\"买入\"评级。 📈光模块代际升级，测试时长与设备价值同步提升 800G向1.6T升级，单只模块测试时长由约20分钟增至约30分钟，增加产线仪器需求。据产业调研口径，800G整套核心仪器约40~50万元，1.6T整套价值量约为其4~5倍。公司1.6T三件套均已量产供货，新一代产品可满足2.4T/3.2T眼图测试需求，持续承接速率升级增量。 🚀主业兑现亮眼，CPO与存储形成第二成长曲线 2026H1收入15.31亿元、同比+208.71%，扣非归母净利润5.62亿元、同比+944.35%。 1）存储测试是设备成长弹性最大的方向之一，该细分2024年国产化率约5%、其中HBM高端设备为0%，#公司核心自研芯片已通过客户工程验证、整机验证推进中，我们预计2027年放量。 2）CPO方面，公司已覆盖光芯片（裸Die/CoC）测试、硅光PIC晶圆测试与OE芯片测试三个环节，其中#OE芯片KGD分选测试系统报告期内已实现收入，我们预计2027年CPO进入产业化后带动整体放量。#文字观点", "publish_time": "2026-09-11 09:09", "tags": ["文字观点"]}, "post:2026-09-11T07-22:8e14f5c3ef81": {"id": "post:2026-09-11T07-22:8e14f5c3ef81", "kind": "post", "title": "2026-09-11 07:22", "source_label": "帖子正文", "excerpt": "9月11日股市早报：MLCC/湖北光通信/PCB/玻纤/绿电/消费电子/碳酸二甲酯/煤炭/农业等一、重要财经信息①《金融强国建设“十五五”规划》正式出台②进一步拓宽中长期资金来源、渠道和入市方式全力维护资本市场平稳运行 ③要更大力度释放并购重组改革活力支持上市公司转型升级、做优做强 ④推动中长期资金", "content": "9月11日股市早报：MLCC/湖北光通信/PCB/玻纤/绿电/消费电子/碳酸二甲酯/煤炭/农业等一、重要财经信息①《金融强国建设“十五五”规划》正式出台②进一步拓宽中长期资金来源、渠道和入市方式全力维护资本市场平稳运行 ③要更大力度释放并购重组改革活力支持上市公司转型升级、做优做强 ④推动中长期资金稳步提升入市规模和比例大力发展权益类公募基金 ⑤央行将完善存款准备金制度 更加灵活精准开展公开市场操作⑥央行：将在9月14日至9月17日开展隔夜逆回购操作 每日操作量不超过6000亿元 ⑦加息预期升温，美股三大指数集体收跌，道指跌0.6%，纳指跌0.65%，标普500指数跌0.58%。存储板块、铜概念股下挫；费城半导体指数跌超2%。 ⑧国际原油期货结算价大涨，WTI原油期货收于每桶102.48美元，涨幅6.69%；布伦特原油期货收于每桶107.63美元，涨幅6.34%。 ⑨国际贵金属大跌，现货黄金跌1.91%，报4314.82美元/盎司；现货白银跌5.43%，报63.60美元/盎司。二、今日热点聚焦远望谷：拟收购光泰通信100%股权 标的公司主营光通信器件与模块的自动化耦合设备等久量股份：筹划收购海帝新能源不低于51%股权 交易价格不高于2.75亿元，预计构成重大资产重组。标的公司主营锂电池动力电池系统及储能系统，业绩承诺期三年累计净利润不低于1.7亿元优彩资源：实控人变更为江阴市人民政府国有资产监督管理办公室 股票复牌MLCCMLCC龙头村田制作所日前正式发布官方通知，宣布在2026会计年度启动产品线优化，将停产部分MLCC产品并源头信息加微信 WUXL3408扩充其他产能，告知客户于2027年底前完成书面回复，并在2028年3月底前完成最后下单。（风华高科、三环集团、洁美科技、火炬电子）湖北光通信湖北印发《数字湖北建设\"十五五\"规划》。规划指出，加快建设新一代通信网。优化全省“西北环”“西南环”和\"东环\"三大骨干光缆网络，规模部署400G/800GOTN干线。（光迅科技、武汉凡谷）PCB8月底，建滔积层板发出今年第七张涨价函：FR-4覆铜板统一涨10%，半固化片按规格调，薄布最高涨20%。随后松下宣布9月1日起上调覆铜板价格，部分产品最高涨30%；南亚塑胶跟进，涨20%到25%。（金安国纪、超声电子、逸豪新材、博敏电子、四会富仕、威尔高）玻纤机构研报显示，8月电子布经销商7628价格已卖到15元/米，9月又上涨10-20%；当前电子布厂家7628电子布价格为11-12元/米，涨价已连续三个月加速。（九鼎新材、山东玻纤、国际复材、长海股份）绿电10月26日，CPE 2026国际算电展同期会议——“CPE 2026国际算电协同产业大会（上海）”将在上海世博展览馆盛大启幕。（乐山电力、闽东电力、华银电力、九洲集团、明星电力、豫能控股、华电辽能）消费电子TrendForce集邦咨询估计，2026年苹果首款折叠手机iPhone Duo出货量约500万支，将可助力苹果在折叠手机市场取得约24.8%市占率。该机构预估，2026年全球折叠手机出货量约2020万支，较2025年微幅成长0.5%。（领益智造、珠海冠宇、蓝思科技、鸿富瀚）碳酸二甲酯碳酸二甲酯价格持续上涨。截至9月10日，现货价已到‌6500元/吨‌，单日涨4.7%，近2周涨30%，最近2个月累计涨了70%。‌‌（石大胜华、奥克股份）煤炭9月10日，生意社动力煤基准价为988.75元/吨，与本月初(875.50元/吨)相比，上涨了12.94%。（云煤能源、大有能源、辽宁能源）农业美国气象预报机构CPC表示，厄尔尼诺现象正在增强，2026-27年北半球秋冬期间出现极强厄尔尼源头信息加微信 WUXL3408诺事件的可能性超过90%。（新农开发、敦煌种业、登海种业、隆平高科）CPO第27届光博会将于9月9日-9月11日在深圳召开，本届展会聚焦算力集群规模扩张驱动的光互联架构升级，NPO、CPO与OCS等颠覆性架构的工程化进展成为核心看点。（环旭电子、剑桥科技、天孚通信、光库科技）海工装备克拉克森在最新报告中表示，2026年很有可能成为新造船签约历史上比较强劲的一年。1至8月，实船订单达到2128艘、5970万修正总吨，与2007年的创纪录节奏基本持平，是十年平均水平的两倍。（大连重工、中国船舶、亚星锚链、中船防务）油气欧洲天然气价格自2023年以来首次突破80欧元/兆瓦时。（水发燃气、美能能源、凯添燃气、首华燃气）三、昨日强势板块和个股绿电、PCB、存储、海工装备、消费、玻纤、天然气、金融等#文字观点", "publish_time": "2026-09-11 07:22", "tags": ["文字观点"]}, "post:2026-09-11T09-31:aae92850153e": {"id": "post:2026-09-11T09-31:aae92850153e", "kind": "post", "title": "2026-09-11 09:31", "source_label": "帖子正文", "excerpt": "【东财通信】FCC扰动阶段性出清，产业基本面支撑估值修复FCC规则落地，将通信设备整机管控延伸至清单实体生产的逻辑硬件组件，封堵组件采购、线上销售、设备变更三项漏洞。新规厘清了审核边界，制造、无源、被动组装等不改变信号的环节免审，而主动改变或管理信号的组件（含光电信号）需认证。", "content": "【东财通信】FCC扰动阶段性出清，产业基本面支撑估值修复FCC规则落地，将通信设备整机管控延伸至清单实体生产的逻辑硬件组件，封堵组件采购、线上销售、设备变更三项漏洞。新规厘清了审核边界，制造、无源、被动组装等不改变信号的环节免审，而主动改变或管理信号的组件（含光电信号）需认证。组件界定虽有模糊地带，但更似博弈后的边际让步，且Covered List认定偏被动响应，FCC无权单方面列入，须先经美法定国安机构正式认定。因此后续风险观察点已转移至国安机构是否针对该企业或光互连产品类别启动认定这一关键节点。#中际旭创、新易盛、天孚通信、东山精密等均未作为命名实体列入，短期对旭创、新易盛现有业务不构成直接实质影响，此前市场对“大光”被直接纳入管控的担忧在预期层面有所缓释。但规则在供应链穿透认定、组件层级界定上仍留解释空间，后续是否通过其它路径延伸，仍存在一定确定性，需持续跟踪，但整体看政策压制有所缓和。我们依旧坚定看好光通信产业，产业基本面两大长期趋势远未到顶。 其一，AI算力需求仍在加速攀升，高盛近期上修2026—2027年全球光模块出货量预期，认为800G及1.6T需求将持续超预期，下游云厂商资本开支指引未见放缓，推理侧大规模部署正接棒训练成为新的增长引擎。其二，“以光代铜”的带宽通胀趋势未改，且技术迭代正从Scale-out向Scale-up域渗透，NPO已进入工程验证阶段，CPO在头部交换机厂商的roadmap中亦明显提速，产业界对铜缆在超高带宽场景下的物理极限共识日益增强，光连接渗透率提升具备长期结构性支撑。综合来看，光通信产业叙事持续向好。既有龙头厂商的明确路线图背书，又有下游确定性的增量需求，叠加市场情绪在经历前期调整后逐步回暖，A股光通信板块当前估值具备修复空间。#建议重点关注光器件龙头天孚通信、中际旭创、新易盛、九州一轨、联特科技、汇绿生态。欢迎联系：csy,wyj#文字观点", "publish_time": "2026-09-11 09:31", "tags": ["文字观点"]}, "post:2026-09-11T20-10:b7332808086b": {"id": "post:2026-09-11T20-10:b7332808086b", "kind": "post", "title": "2026-09-11 20:10", "source_label": "帖子正文", "excerpt": "CCL 厂商调研纪要总结 一、PTFE 核心技术方案：PTFE 无玻布 + M9Q 布混压技术演进：2024 年启动测试；2025 年确定PTFE 无玻布 + 碳氢 PP (M9Q 布)混压路线。", "content": "CCL 厂商调研纪要总结 一、PTFE 核心技术方案：PTFE 无玻布 + M9Q 布混压技术演进：2024 年启动测试；2025 年确定PTFE 无玻布 + 碳氢 PP (M9Q 布)混压路线。PCB 加工采用16×2 叠层工艺：分别做两块 16 层 PTFE‑M9Q 混压板，利用铜浆灌孔烧结合并成 32 层板，良率已经达标，终端希望以此量产；更高层数可拓展为 26×2、28×2、26×3 等结构。 各家分工CCL 端：生益科技是唯一完成 CCL 电性能验证厂商；台光、台耀、联茂开始交付 PTFE 材料；台光无自有 PTFE 设备，与台虹科技合作，台虹设备预计 2027 年初到位。具备 PTFE 设备能力：台虹、AEM、TFM 等台系厂；海外罗杰斯、AGC。 PCB 加工端：沪电股份、深南电路跑通 PCB 加工验证；胜宏、景旺正在招聘 PTFE 工艺专家跟进复制该工艺。 材料成分：PTFE 无布方案不含玻纤布，硅微粉占比 60%；100 万张 PTFE 板材（单张 200g）理论消耗硅微粉 40 万公斤，考虑 70‑80% 良率实际消耗更高。 关键辅材碳氢 PP：生益、台光、联茂、台耀、松下、斗山具备 M9Q 碳氢 PP 生产能力；碳氢树脂主要采购自东材科技，单价约 500 万元 / 吨，单张 PTFE 板材消耗 100‑200g 碳氢树脂。 二、应用场景与量产节奏已验证场景：交换板（Switch 板）跑通量产工艺；OAM 板、LPU 板正在测试；Midplane 中板理论可用。高难度正交背板：可采用 26×3 /28×6 叠层结构，工艺复杂、良率偏低，技术路径可行，但落地时间靠后。 不适用场景：HDI 计算板应用路径尚不清晰，量产节奏会明显滞后。时间与需求预测（对应 Rubin Ultra）2027 年：Rubin Ultra 导入 PTFE，年需求约100 万张； 2028 年大规模放量，若多类板卡全部采用，需求可达1000‑2000 万张级别。 订单现状：已有提前锁定的意向年度订单，但尚未进入大规模正式量产，没有十几亿级别的正式采购订单。 三、成本结构：CCL 便宜，但 PCB 加工抬升总成本PTFE 覆铜板本身成本低于传统布基高速 CCL；但 PTFE 质地软，PCB 加工工艺特殊，PCB 加工费用大幅上涨。 最终成品 PCB 综合成本：和传统 M9 布基方案接近，部分场景更贵；性能优于 M9，具备溢价空间；未来竞争加剧后成本有望下行。 PTFE 板材售价：2000‑3000 元 /㎡；成本拆分：加工费 50%、铜箔 20%、硅粉 20%、树脂 10%；铜箔来自三并，PTFE 树脂采购东岳、昊华。 四、最大瓶颈：高温层压机（PTFE 必须使用专用产线，不能和普通板材共线）设备产能：单台大型高温层压机月产约 2 万张；若要实现年 1200 万张 PTFE，需要约 50 台该设备。 六、供需现状：2026 年高端层压机整体市场约 2000 台，缺口 20%；海外北川、博可、拉法设备满产；拉法和国内合锻智能成立合资，合锻是国内唯一可做高端高温层压机厂商，但自身上游零部件受限扩产不易。交付周期大幅拉长：由原来 9‑10 个月延长至 20‑24 个月，极端可达 30 个月以上。现在下单设备无法满足 2027 年的需求。行业应对手段：将已下达的通用层压机订单转成高温层压机；向外拥有设备的厂商外发加工，弥补自有产能不足。 七、生益现有 PTFE 产线年产值 10‑20 亿，2027 早期可部分满足，但 2028 大放量后产能会紧张。 五、厂商格局变化PCB 厂商态度发生根本性转变：从过去观望、小量预研，转变为战略必须布局 PTFE，不做下一代 AI 板卡会直接掉队，人力物力投入显著加大。生益科技先发优势最强：同时掌握 PTFE 芯板 + M9Q 碳氢 PP 半固化片；竞争对手很多只能做 PTFE 芯板，配套 M9Q‑PP 需要外购，供应链受制于人。台系 CCL 追赶：台光、台耀、联茂切入；台虹设备 2027 年初到位。 PCB 梯队：沪电、深南进度领先；胜宏、景旺积极跟进送样。 六、各类高速 CCL 产能与原材料情况 1、板材产能（月总产能约 1100 万张）PTFE 专用产线：月产 8‑9 万张（独立专线，不能混用） M9：1‑2 万张；M8+M8.5 合计 30 万张；M7：10 万张；M4‑M6 合计 50 万张；M4 单独 40 万张；其余为 FR‑4 普通板材。 M6 及以上高速板材占总产能约 30%。 M10 等级：处于开发送样阶段，尚未量产。 2、树脂、电子布上游碳氢树脂：主供应商东材科技；圣泉、迪赛新材为潜在备选。当前月采购约 10 吨（200 万 / 吨）；预计 2027 年月需求可达 200‑300 吨。#文字观点", "publish_time": "2026-09-11 20:10", "tags": ["文字观点"]}, "post:2026-09-11T15-52:31033c2177fd": {"id": "post:2026-09-11T15-52:31033c2177fd", "kind": "post", "title": "2026-09-11 15:52", "source_label": "帖子正文", "excerpt": "【浙商电子田发祥】近期想向您重点汇报PCB两条主线：# 上游材料涨价与高端升级，# 二线PCB提价与利润释放。上游关注德福科技、宏和科技、生益科技", "content": "【浙商电子田发祥】近期想向您重点汇报PCB两条主线：# 上游材料涨价与高端升级，# 二线PCB提价与利润释放。上游关注德福科技、宏和科技、生益科技；二线板厂关注景旺电子、方正科技、奥士康、金禄电子、崇达技术等。 1、# 上游材料：涨价兑现，高端升级打开空间。电子布、铜箔、CCL提价持续推进，高端产能挤占普通品供给，叠加AI需求推动材料升级，重点看涨价落地与高端产品放量带来的盈利改善。 2、# 铜箔重点看德福：加工费改善叠加新品突破。HTE、RTF产品已启动加工费提价，HVLP高端产品持续导入，载体铜箔已在1.6T光模块项目实现量产，关注产品结构升级与国产替代共振。 3、# 二线PCB，关注Q3利润弹性。台系二线板厂月度营收高增提供景气线索，国内板厂重点看重新报价、稼动率回升和订单结构改善；具备成本转嫁能力及低价库存的公司，有望率先释放盈利弹性。 4、# 当下看什么：上游材料从涨价预期走向业绩兑现，二线板厂看提价能否覆盖材料成本上涨，重点挖掘Q3盈利超预期及后续预测上修机会。#文字观点", "publish_time": "2026-09-11 15:52", "tags": ["文字观点"]}, "post:2026-09-11T20-14:57f57e9b72b8": {"id": "post:2026-09-11T20-14:57f57e9b72b8", "kind": "post", "title": "2026-09-11 20:14", "source_label": "帖子正文", "excerpt": "近期板块观点，中国巨石、科顺股份、兔宝宝、沃尔德、洪田股份、上峰材料、华润建材科技交流要点，供参考。如需详情请联系我们 建材新材料板块观点：推荐优质玻纤洁净室、出海建材建筑、高股息等标的。", "content": "近期板块观点，中国巨石、科顺股份、兔宝宝、沃尔德、洪田股份、上峰材料、华润建材科技交流要点，供参考。如需详情请联系我们 建材新材料板块观点：推荐优质玻纤洁净室、出海建材建筑、高股息等标的。 自上而下标的推荐排序：【亚翔集成/中国巨石/圣晖集成】（国内外洁净室、电子布需求高增长，电子布涨价）、【华新建材/科达制造/精工钢构】（海外建材建筑需求高景气）、【东方雨虹/三棵树/兔宝宝/安徽建工】（左侧布局地产链，兔宝宝、安徽建工高股息）。 自下而上标的推荐排序：【鸿路钢构】（主业业绩拐点，机器人应用标的）、【利柏特】（核电模块化进展顺利）、【国机精工/沃尔德/四方达】（金刚石散热、钻针新材料）。 2608中国巨石：电子布涨价趋势明确 1、粗纱预计全年全球需求增长6%。27年粗纱新增产能有限，叠加公司埃及冷修，行业实际供给收缩，价格存在上涨可能性。 2、当前普通电子布价格已创历史新高，下半年仍有涨价空间。 3、公司除二代产品外，一代、低膨胀和Q布已实现小批量生产，目前单品种月产能可达15-30万米。一代、低膨胀产品采用窑炉生产，Q布采用石英棒拉丝工艺，技术成熟，二代产品9月推出样品，当前窑炉、坩埚两种工艺路线同步推进。 4、丰田织布机扩产计划无明显变化，明年二季度提升至200台/月，明年底提升至300台/月。目前行业内友商仅小范围测试国产织布机，尚未大规模应用。 2608科顺股份：防水业务成本压力传导顺畅 1、上半年毛利率提升原因：公司推进产品提价、优化客户结构，高毛利海外、零售业务占比提升。毛利率提升预计在下半年及明后两年持续。 2、预计第三季度将有具体并购落地，方向与芯片、新能源、算力等领域相关。目前已进行少量小规模参股投资，并购类项目暂未落地。 3、下半年将争取实现收入正增长，全年目标为收入持平或小幅正增长。 2608兔宝宝：板材龙头，高股息稳健增长 1、上半年家具厂渠道收入38亿，占板材业务54%，同比增长40%。家具厂赛道整体市场规模约2000亿元，公司当前市占率较低，发掘潜力充足。4月公司推出全国联动家具厂促销活动，锁定未来3-4个月销量。 2、上半年传统零售渠道收入24亿，占板材业务34%，同比增长14%。其中乡镇渠道收入增速超30%，但仅占整体业务的9%。 3、预计全年板材业务收入增速约20%，较上半年28%的收入增速略有回落。兔宝宝本部经营性利润力争全年同比增长10%，实际预计为大个位数增长。 4、目前头部品牌在家具厂渠道的价格已较低，与二线、白牌产品接近，进一步下降空间极小。 2608沃尔德：金刚石散热、微钻先行者 1、金刚石微钻在PCB领域与多家客户持续验证，客户审批完成后预计有小批量订单持续落地。 2、金刚石散热技术中，芯片客户多采用chip to wafer方式，要求交付精密加工好的中小尺寸片；光通信和激光器领域客户多用中等面积大片加工后切开。公司四季度将实现一些小批量订单，2027年一季度后可能出现大批量订单。 3、年底MPCVD及其他热丝设备预计增加1000台，明年保守估计接近2000台。 2608洪田股份：国产铜箔设备龙头 1、本部截止8月今年新签订单接近去年全年新签3倍。6月开始下游电子铜箔扩产需求10万吨以上。表面处理机已实现HVLP四代小批量生产，国产替代诉求强烈。表面处理机意向订单有二十几亿。 2、速远去年接单4-5亿，今年到8月接单近10亿，预计年底接单15亿左右。msap工艺速远已有十几台在市面上，订单可观。 3、国兴智能截止8月底在手订单近2亿，去年全年收入1.09亿，净利2800万。在谈意向订单13-15亿。 4、希望未来3-5年上市公司净利润做到5-10亿，争取提前完成，年净利润10亿。 2608上峰材料：投资板块亮眼 1、当前水泥行业已处于周期底部，未来1-2年低效、过剩产能将逐步退出，周期拐点终将到来。 2、年度投资额度保持每年5亿元的稳定规模，方向以半导体领域为核心。项目上市梯队清晰，后续投资收益具备可持续性。 3、美琪电路下半年目标月度出货突破1000万，两期全部达产后江门基地预计年营收5-6亿元。 2608华润建材科技：华南水泥区域龙头 1、地方政府对超产的管制和处罚目前较少，今年全面落地可能性较低。 2、短期碳约束难以成为去产能的有效工具，对行业成本、供给格局影响有限。 3、水泥需求端对比上半年有望改善，错峰生产有望加强，下半年市场谨慎乐观。 4、下半年骨料价格进一步下降空间有限，产能释放受到约束，且当前骨料盈利预期较弱。#文字观点", "publish_time": "2026-09-11 20:14", "tags": ["文字观点"]}, "attachment:files/摩根大通-唯品会-VIPS.US-股东回报护航，利基市场稳固；继续覆盖，给予“增持”评级.pdf": {"id": "attachment:files/摩根大通-唯品会-VIPS.US-股东回报护航，利基市场稳固；继续覆盖，给予“增持”评级 26 年8月20日，董事 会授权了一项新的 10亿美元股票回购计划，为期 24个月，将待现有 10亿美 元计划（截至 6月末尚有 2.17亿美元额度未使用）全部执行完毕后启动。 回顾唯品会的历史执行情况， 2024 年向股东返还资金超 8.5亿美元， 2025 年回 购约 7亿美元，缩减总股本超 5%。2026 年上半年向股东返还约 4亿美元，其 中包括 2季度 9,910 万美元的回购。截至 6月末，公司资产负债表包含现金、 现金等价物和受限现金合计 299亿元，短期投资 36亿元； 2季度自由现金流净 流出 7亿元，而过去 12个月的自由现金流为 72亿元。 我们预计，即使绝对利润保持稳定，该回报机制也能支撑每股 ADS 收益。股 价下行，意味着同等回购资金可注销更多股份。新授权的 24个月股票回购计 划，将回购可见度延伸至现有计划（ 2027 年2月到期）之后 ——虽然与盈利挂 钩的回报承诺依旧按年度设定，投资者需每年重新评估。 2）核心业务保持稳定，但增长有限 2026 年第二季度收入同比下降 4%至247亿元，符合彭博一致预期，且处于业 绩指引区间。毛利率为 23.3% ，而去年同期为 23.5% 。得益于唯品会商业房地 产投资信托基金 6月上市带来的 58亿元一次性投资收益， GAAP 净利润增至 43亿元，而非 GAAP 净利润为 3.92亿元（较市场一致预期低 79%），反映了 针对历史股息分配计提的 16亿元一次性预提所得税拨备。 唯品会拥有 4,230 万活跃用户，且 SVIP 付费忠诚用户群体不断增长。公司与 供应商的合作，有助于品牌方通过专业的折扣渠道清理服饰库存，我们认为这 支撑了公司的利基市场定位，但却不是其大幅提高市场份额的基础。 2026 年3季度收入指引为 203-214 亿元，对应收入下降 5%至持平，指引区间 与2季度相似。管理层的说法是消费需求低迷，短期能见度依然有限。 3）营收企稳是上行期权 在我们的基准情景下，我们预计 2026 年收入为 1,040 亿元，同比下降 2%，意 味着下半年收入同比下降 2%。即便利润基础基本持平，持续的毛利率韧性和 股本缩减，仍有望带动调整后每股 ADS 收益实现低个位数增长，但短期内将 被有效税率部分抵消。 我们认为， 2026 年2季度 GMV 与营收差距的收窄，是营收企稳的早期信号。 2季度 GMV 同比下降 1.6% ，营收下降 4%，二者差距远小于 1季度（ 1季度 GMV 增长 8.6% ，远超营收 1%的增速）。我们认为，差距持续存在的原因是 业务结构向平台模式、其他抽佣率较低业态的倾斜，因此变现率成为关键变量： ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 4 中国 证券研究 2026 年9月10日 姚橙 (86 21) 6106 6505 alex.yao@jpmorgan.com 如果随着平台业务规模扩大，抽佣率企稳且未稀释毛利率，营收可能早于我们 的预测企稳。如果隐含抽佣率持续下降，营收将贴合我们假设同比下滑 2%的 基准情景。 表1：风险、催化剂及重点观察指标摘要 项目 时间节点 观察重点 影响 平台业务变现率 每期财报 GMV增速、营收增速，隐含抽佣率 差距持续存在，且抽佣率下降，表明 结构性侵蚀 服饰竞争 半年度 抖音在中高价位服饰、货架式购物场 景的渗透率对手持续抢占份额，将挤压唯品会的 利基市场空间 长期界面风险 2027年及以后 AI驱动的商品发现 若用户脱离闪购发现模式，或将削弱 平台的需求聚合能力 资料来源：摩根大通估算 表2：唯品会 2026年股东回报 构成 金额 估算收益率 现金股息 约3亿美元 约5% 2026年承诺回购规模 超6.5亿美元 约10% 承诺总回报 超9.5亿美元 约15% 资料来源：唯品会 2026年第二季度业绩电话会、摩根大通估算 投资者核心分歧 看多观点认为，唯品会能够在营收没有显著增长的情况下实现可观的股东回报 。高额现金回报承诺、稳健的自由现金流和管控得当的利润率，可以对冲低增 长的业务现状。相比于京东、阿里等大型平台，公司的同比基数更加干净，受 国补退坡、即时零售投入波动的影响较小。 看空观点认为，现金回报无法无限期地弥补服饰主业基本面的弱化。拼多多的 天天低价策略和抖音的内容驱动种草模式，都在争夺同一批注重性价比的消费 者。平台业务占比提升的情况下，唯品会从单位商品销售中获得的收入减少， GMV 增长的含金量下降。 我们倾向于看多观点，前提是业务保持稳定且回报承诺得到执行。 2026 年下半 年营收企稳、抽佣率稳定以及正式长期回报政策的出台，将强化我们的立场。 若营收和调整后利润率同步下行，或是回购节奏不及预期，则将挑战这一观点 。 ÖªÊ¶ÐÇÇò£ ，打破此前连续4个交易日的缩量，证伪了昨天“资金主动降仓位、缩量观望”的判断——今天是真实的放量抛售。有色金属全线暴跌，成为跌幅最深的板块，原因是前期涨幅大，叠加中东地缘风险推升避险情绪，铜、白银、铅锌、锡、锑普遍跌4%到5.5%，龙头北方铜业跌停；印制电路板、被动元件、通信线缆、地面兵装则在工信部「人工智能+软件」行动方案和军工持仓回升报告等具体催化下逆势大涨。普跌里的主动买盘，从昨天含糊的「银行+覆铜板」两条线，收窄成更清晰的「硬科技制造+军工」对「商品、金融资产」的轮动。同一天港股结构也在反转：跌幅小于A股，是连续第5日下跌以来第一次，科技权重由跌转涨，昨天撑住恒指的银行、内险反而获利回吐。 真正决定下一个交易日基调的是隔夜美国8月CPI：核心环比意外偏热，把9月加息概率推到约79%、10年美债逼近5%但通胀数据之后略有下降，但美股期货和VIX双双回暖，是“利空出尽”式的反应——这一段两地收盘时都还没来得及定价。我们在日前的美日展望报告中讨论了美股很可能已经反应了美联储加息预期，与共识相反——只要加息路径不恶化（远端利率不大幅上涨）。 上证收3,888点跌1.2%、跌破50日均线，深成指跌1.1%，中证500、中证1000分别跌1.8%、2.1%，北证50跌2.7%；恒指收24,806点跌0.6%、连续第5日下跌但跌幅小于A股，恒生科技仅跌0.2%。两市成交放量到约1.97万亿、比上日多约3,247.5亿，全市场639家上涨、4,864家下跌，跌停21家、较昨天翻倍。有色金属崩盘（北方铜业跌停），覆铜板、被动元件、军工地面兵装逆势涨停潮；港股腾讯、阿里、小米翻红，银行、内险获利回吐。美国8月CPI核心环比意外偏热，9月加息概率跳到约79%，10年美债逼近5%。#文字观点", "publish_time": "2026-09-11 22:14", "tags": ["文字观点"]}, "post:2026-09-11T16-48:5b0c7d8433dd": {"id": "post:2026-09-11T16-48:5b0c7d8433dd", "kind": "post", "title": "2026-09-11 16:48", "source_label": "帖子正文", "excerpt": "9月11日复盘笔记：PCB/电力/AI 应用/光通信/MLCC/光纤/军工/玻璃基板/玻纤/旅游等一、重磅财经信息智能网联新能源汽车产业发展“十五五”规划发布：到2030年具备自动驾驶功能的汽车实现规模应用二、大盘表现沪指跌1.18%，深证成指跌1.08%，创业板指跌0.49%，科创50跌1.01%", "content": "9月11日复盘笔记：PCB/电力/AI 应用/光通信/MLCC/光纤/军工/玻璃基板/玻纤/旅游等一、重磅财经信息智能网联新能源汽车产业发展“十五五”规划发布：到2030年具备自动驾驶功能的汽车实现规模应用二、大盘表现沪指跌1.18%，深证成指跌1.08%，创业板指跌0.49%，科创50跌1.01%。沪深京三市成交额接近2万亿，较昨日大幅放量逾3000亿。三、强势板块和个股分析备注：只列举部分涨停板PCB机构：随着电子布、铜箔及CCL价格持续上行，PCB厂商已陆续启动重新报价。相较上游材料，板厂涨价存在一定时滞，Q3有望成为产品价格、产能利用率与订单结构共同改善的起涨点。涨停板：超声电子、崇达技术、博敏电子、澳弘电子、协和电子、骏亚科技、高斯贝尔、嘉立创其他强势股：迅捷兴电力机构：算力用电的长期天花板可能高于当前市场预期，电力保障能力正成为算力时代的核心竞争变量，算电源头信息加微信WUXL3408协同有望驱动电力资产价值重估。涨停板：闽东电力、江苏新能、杭州热电、拓日新能其他强势股：湖南发展、浙江新能AI 应用DeepSeek V4.1 Flash 模型正式发布。该模型具备原生多模态视觉理解能力，能力上限更高、推理速度更快、吞吐更大、可扩展到更大参数模型。涨停板：中视传媒、风语筑、中新赛克、华胜天成、正和生态其他强势股：工大高科、掌阅科技、粤传媒、中信出版光通信第27届光博会将于9月9日-9月11日在深圳召开，本届展会聚焦算力集群规模扩张驱动的光互联架构升级，NPO、CPO与OCS等颠覆性架构的工程化进展成为核心看点。涨停：远望谷、铭普光磁、神宇股份、铜峰电子其他强势股：中际旭创、新易盛、麦捷科技MLCCMLCC龙头村田制作所日前正式发布官方通知，宣布在2026会计年度启动产品线优化，将停产部分MLCC产品并扩充其他产能，本次停产范围涵盖消费级常规系列及车用规格系列中的特定料号，包含部分GRM、GRJ、GRT、GXM、GXT、GCM、GCJ、GCG与ZRA系列。涨停板：风华高科、双星新材其他强势股 区间抵消了公司的运营效率和全球增长潜力。如果国内在 线营销服务（ OMS ）增速连续两个季度回升至 5%以上、以及在监管收紧的 情况下 Temu 展现出可持续的经济效益，我们将持更具建设性的观点。 •国内变现令人担忧。 拼多多的主要国内利润引擎在线营销服务的收入在 2026 年2季度仅同比增长 3%，证实了对国内变现放缓的担忧，尽管与 2026 年1季度的 2%相比略有改善。总收入同比增长 8%，而交易服务收入 同比增长 13%，调整后营业利润同比增长 5%，调整后营业利润率为 26% ，表明核心平台仍然保持高效。 •Temu 前景呈现出明显的上行和下行空间。 Temu 的用户组合已转向欧盟（ 约占月活跃用户的三分之一）和拉美（约占四分之一， 2025 年上半年以三 位数的速度增长），今年本土化加速推进（ 链接）。该业务正在适应美国 低值免税门槛的变化，而欧盟根据《外国补贴条例》进行的审查增加了关 键增长地区的不确定性。虽然拼多多的供应链投资计划 “新拼姆 ”可能会 随着时间的推移加强这一业务模式，但我们预计该计划将会因投资增加而 限制近期利润率的扩张。 •主要风险。上行风险方面，在线营销服务若连续两个季度增长超过 5%， 且调整后营业利润率稳定，将表明国内市场再次加速增长，并对更具建设 性的观点构成支撑。相反，如果欧盟或拉美采取措施、且其在经济效益方 面的影响类似于美国的低值免税门槛变化，则 Temu 的增长和盈利能力将 会受到伤害。新拼姆的支出快于预期、对非经营性亏损仍不作解释、或持 续有限的披露也将对我们的预测构成风险。然而，关于监管稳定性和跨境 单位经济效益改善的证据将会降低不确定性。 •最新发展： o2026 年2季度在线营销服务增长 3%，仍低于 5%；我们继续覆盖，给 予“中性”评级。 o2026 年2季度调整后营业利润增长 5%，调整后营业利润率回升至 26%。 o随着美国低值免税门槛的变化， Temu 的地域风险敞口已转向欧盟和 拉美。 o对新拼姆的投资和业务板块信息披露不足对我们的 2026 和2027 年盈 利预测构成风险。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 2 中国 证券研究 2026 年9月10日 姚橙 (86 21) 6106 6505 alex.yao@jpmorgan.com 股价表现 年内迄今 1个月 3个月 12个月 绝对 -29.7% -13.1% -3.5% -36.2% 相对 -43.4% -12.1% -5.4% -57.4% 公司数据 已发行股票数（百万） 1,423 52周股价区间（美元） 139.41-71.94 总市值（百万美元） 113,516 汇率 1.00 自由流通股比例 - 三个月日均成交量（百万） 7.08 三个月日均成交额（百万美元） 593.4 波动性（ 90天） 40 指数 NASDAQ COMPOSITE 彭博 买入 |持有 |卖出 32|14|2 重要指标（财年 12月份结束） 单位：百万元，每股数据单位：元 FY25A FY26E FY27E FY28E 财务预测 收入 431,846 467,772 521,127 617,657 调整后的息税前利润 102,561 116,267 135,625 167,151 调整后的息税折旧摊销前利润 103,163 116,969 136,407 168,078 调整后的净利润 107,301 105,590 133,645 162,074 调整后的每股收益 72.17 71.66 90.70 109.99 彭博一致预期每股收益 75.45 68.51 82.32 93.59 经营活动现金流 106,939 102,312 131,273 164,666 公司自由现金流 127,064 119,817 140,754 173,885 利润率和增长率 收入增长率 9.7% 8.3% 11.4% 18.5% 息税前利润率 23.7% 24.9% 26.0% 27.1% 息税前利润增长率 (13.3%) 13.4% 16.6% 23.2% 息税折旧摊销前利润率 23.9% 25.0% 26.2% 27.2% 息税折旧摊销前利润增长率 (13.3%) 13.4% 16.6% 23.2% 净利润率 24.8% 22.6% 25.6% 26.2% 调整后的每股收益增长率 (12.6%) (0.7%) 26.6% 21.3% 财务比率 调整后的有效税率 16.9% 18.0% 9.5% 9.5% 利息覆盖倍数 - - - - 净债务 /净资产 NM NM NM NM 净债务 /息税折旧摊销前利润 NM NM NM NM 净资产收益率 29.5% 22.8% 23.2% 22.5% 估
