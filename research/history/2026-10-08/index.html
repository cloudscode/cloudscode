0-08 11:09", "tags": ["文字观点"]}, "post:2026-10-08T13-19:222f4885e3fe": {"id": "post:2026-10-08T13-19:222f4885e3fe", "kind": "post", "title": "2026-10-08 13:19", "source_label": "帖子正文", "excerpt": "📈高盛中国午评（GS CHINA MIDDAY）#交易台📊 指数表现：SCHOMP 指数下跌 0.27%，科创 50 指数下跌 3.66% 📊 上证 50 指数下跌 0.04%，创", "content": "", "publish_time": "2026-10-08 13:19", "tags": ["交易台", "文字观点"]}, "post:2026-10-08T21-16:332a6ff92968": {"id": "post:2026-10-08T21-16:332a6ff92968", "kind": "post", "title": "2026-10-08 21:16", "source_label": "帖子正文", "excerpt": "1. 市场连续调整，10 月第一天行情偏弱。", "content": "", "publish_time": "2026-10-08 21:16", "tags": []}, "post:2026-10-08T10-01:9ea45d0cabe3": {"id": "post:2026-10-08T10-01:9ea45d0cabe3", "kind": "post", "title": "2026-10-08 10:01", "source_label": "帖子正文", "excerpt": "浙商机械/电子 【科翔股份】：下半年业绩有望拐点向上，陶瓷PCB有望应用于AI服务器，持续推荐！", "content": "", "publish_time": "2026-10-08 10:01", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-08T07-37:5b6bf73e599b": {"id": "post:2026-10-08T07-37:5b6bf73e599b", "kind": "post", "title": "2026-10-08 07:37", "source_label": "帖子正文", "excerpt": "美股科技股复盘及假期全球AI产业动态（9/28–10/7）@华泰计算机（1007） #美股行情：利率压制与AI基本面叙事拉锯，AI硬件独立走强。9月28日–10月2日，美股呈\"先抑后扬、结构分化\"格局。", "content": "美股科技股复盘及假期全球AI产业动态（9/28–10/7）@华泰计算机（1007） #美股行情：利率压制与AI基本面叙事拉锯，AI硬件独立走强。 9月28日–10月2日，美股呈\"先抑后扬、结构分化\"格局。第一周长端美债收益率飙升（10Y升至5.28%，30Y盘中触及5.70%创2002年以来新高）压制指数，但核心PCE同比降至3.0%（2月以来新低）、9月非农仅增2.9万人（预期约9万）令10月加息概率从约70%骤降至22.7%，纳指周线三连涨，费半周涨3.7%创三个月新高。光通信领涨全场；MongoDB因CEO跳槽Meta单日暴跌18.5%，东芝HDD产能翻倍计划重创西部数据/希捷（单日各-10.2%），AppLovin受集体诉讼与降级双杀。 10月5–6日三大指数强势齐涨，纳指连续两日创收盘新高，标普500首次收于7800点上方，结构主线从\"芯片\"切换至\"互连+电力\"。AI互联（CIEN两日+13.4%、AAOI +12.6%），存储（希捷/西部数据）、半导体设备与AI4S动量股（TWST）遭明显抛售。#全球AI产业核心动态#AI硬件催化众多：①英伟达追加1500亿美元回购（美股史上最大）并发布开源Agent安全平台，将安全从模型层下沉至运行时与硬件； ②Marvell投资者日将2030年TAM上调至4000亿美元（定制硅2350亿+互连650亿），首给FY2031营收指引700–900亿美元，明确\"互连是AI算力新瓶颈\"； ③谷歌与Constellation签署3.59GW、20年期核电协议，印证电力已成AI扩张刚性约束，AI竞争从\"抢芯片\"延伸至\"抢电力\"； ④NeoCloud扩张及涨价仍在继续。Nebius获微软5年最高194亿美元大单并年内第二轮上调GPU租金17%–21%；Lambda完成10亿美元投资级GPU抵押债采购3万片英伟达GPU；CoreWeave全球首发Vera Rubin NVL72集群。 #模型层：海外模型催化密集，国产模型加速出海。 ①OpenAI DevDay发布常驻智能体Dots与GPT-6.1 Sol，ChatGPT周活达12亿，年化收入近700亿美元（较7月增长超70%，企业端3个月翻倍），并推进约1.4万亿美元估值的新融资； ②但AI安全风波同步发酵：因沙箱越权事件暂停GPT-6.1 Astra训练并首次因安全不达标取消旗舰模型发布，行业安全约束进入\"前置否决\"阶段； ③谷歌发布Gemini 4 Argon，以100万输出token、15%低幻觉率、便宜80%的定价主攻长周期工作流。 ④Anthropic IPO里程碑推进：预计10月14日举办投资者日，拟11月中旬纳斯达克挂牌，目标估值超2万亿美元、募资最高约1000亿美元；美银/花旗/大摩已启动600亿美元债务融资（博通420亿担保）；此外，博通还为其提供最高 420 亿美元可转债贷款。 ⑤国产模型加速出海，Kimi K3、智谱GLM-5.3先后于9/18、10/6正式上线AWS Bedrock，打开海外CSP增长渠道。#投资建议：宏观层面：短期密切跟踪10/7 FOMC会议纪要、长端国债拍卖承接情况及10/14美国9月CPI，利率端扰动仍是美股高估值AI资产的主要压制变量。 后续聚焦Q3财报：在长端利率高位背景下，EPS成为股价上涨核心动力。配置重心沿瓶颈扩散路径从核心芯片向更卡脖子环节迁移，重点布局AI互连/光模块/电力与能源基础设施等；AI应用重点关注网络安全/数据/AI4S等。#文字观点", "publish_time": "2026-10-08 07:37", "tags": ["全球AI产业核心动态", "AI硬件催化众多", "投资建议", "文字观点"]}, "post:2026-10-08T09-56:229a5bbd417a": {"id": "post:2026-10-08T09-56:229a5bbd417a", "kind": "post", "title": "2026-10-08 09:56", "source_label": "帖子正文", "excerpt": "10月AI月报：模型迭代与投入不减，Agent商业化持续兑现#模型迭代与投入不减，#Jev类模型丰富Agent分工、降低任务成本 海外安全讨论尚未改变模型高频发布节奏，GPT-6.1 Sol、Opus 5.5等接连更新，RSI探索推动模型参与研发。国内阿里、智谱分别完成约800亿港元、50亿美元融资", "content": "10月AI月报：模型迭代与投入不减，Agent商业化持续兑现#模型迭代与投入不减，#Jev类模型丰富Agent分工、降低任务成本 海外安全讨论尚未改变模型高频发布节奏，GPT-6.1 Sol、Opus 5.5等接连更新，RSI探索推动模型参与研发。国内阿里、智谱分别完成约800亿港元、50亿美元融资，腾讯加大海外算力采购，支撑模型能力追赶。Jev、OpenAI Decisions API将分类、路由和动作选择交由低成本模型，高能力模型负责复杂规划与异常处理。其中Jev发布时输入价格仅为每百万Token 0.042美元、输出免费。模型分层与执行框架协同，有望降低Agent完成有效任务的成本，扩大应用覆盖。#Agent提高单用户任务密度，#商业化由企业部署向消费端延伸 海外Anthropic与Salesforce、贝恩、巴克莱等深化合作，模型加快进入企业数据与业务流程；ChatGPT广告年化收入运行率达10亿美元，消费端变现路径拓宽。国内MiniMax披露7月Token消耗量达到1月的20倍，智谱将年末ARR目标由24亿美元上调至30亿美元。下一轮收入增量有望更多来自Agent使用深度提升，办公Agent格局尚未定型，稳定交付、留存和付费转化是竞争关键。#AI4S拓展应用边界，#科研Agent与实验反馈协同推进 Claude科研实验、微软Quine及罗氏自主实验室建设，推动模型连接文献分析、候选设计与实验验证。晶泰上半年AI4S智慧解决方案收入同比增长136.4%，英矽智能授权合作与临床推进提供产业验证。随着候选生成能力提升，高质量数据、高通量验证及自动化实验设施的重要性上升，具备专业模型、科研Agent和实验交付能力的平台有望持续受益。#投资方向：重点关注算力服务、国产芯片与超节点，以及具备场景、数据和企业交付能力的B端AI应用厂商，重视AI4S研发平台机会。#文字观点", "publish_time": "2026-10-08 09:56", "tags": ["投资方向", "文字观点"]}, "post:2026-10-08T09-56:39b681e27509": {"id": "post:2026-10-08T09-56:39b681e27509", "kind": "post", "title": "2026-10-08 09:56", "source_label": "帖子正文", "excerpt": "【浙商计算机 刘雯蜀】大模型商业化周报（第28期）：智谱接入 AWS 拓展企业渠道 🌹本周重点事件： 🔥重点一：#前沿模型围绕任务质量与成本竞争，Opus 5.5 关注度延续。1⃣ 发布约一周后，Opus 5.5 在 OpenRouter 的 Anthropic 模型支出和 Token 份额中均居首", "content": "【浙商计算机 刘雯蜀】大模型商业化周报（第28期）：智谱接入 AWS 拓展企业渠道 🌹本周重点事件： 🔥重点一：#前沿模型围绕任务质量与成本竞争，Opus 5.5 关注度延续。 1⃣ 发布约一周后，Opus 5.5 在 OpenRouter 的 Anthropic 模型支出和 Token 份额中均居首；Agent Arena 净改进率排名第2，单任务成本中位数1.31美元、较 Opus 5 High 下降40%； 2⃣ Sonnet 5.5、GPT-6.1 Sol、Gemini 4 Argon 同期更新，标准或首发价均为输入/输出2、10美元/百万Token；AA 编程智能体评测分别为68分/14.19美元、63分/1.04美元、64分/5.84美元。 🔥重点二：#个人Agent承接生活事务，应用连接推动任务执行。 1⃣ OpenAI 发布 Dots：每个 Dot 具有独立云端电脑、持续记忆和应用连接能力，可通过 ChatGPT、Slack 和 Teams 持续处理事务； 2⃣ TickerTrends 在342份使用报告中识别出433项 Agent 任务，购物、旅行和账单处理成为典型场景； 3⃣ 豆包新增机票、火车票、打车及导航，千问打通夸克网盘，TikTok 推出 Shopping Assistant 及 Buy Direct，产品由回答问题走向完成操作。 🔥重点三：#智谱接入AWS拓展企业渠道，套餐分层与广告丰富变现方式。 1⃣ 10月6日 GLM 5.3 上线 Amazon Bedrock，Kimi K3 经 Baseten 接入 Codex 企业采购通道，国产模型借海外云平台触达企业客户； 2⃣ 8月美国持有至少一种 AI 个人付费订阅的合格消费者占比4.5%，高于一年前的2.1%；头部1%用户月均支出903美元、18个月增长80%； 3⃣ OpenAI 推出每月500美元 Pro 500，额度为 Plus 的25倍；ChatGPT Ads 接入 Hightouch、Tealium 等转化数据服务。#文字观点", "publish_time": "2026-10-08 09:56", "tags": ["文字观点"]}, "attachment:files/节后市场策略 261007.pdf": {"id": "attachment:files/节后市场策略 261007.pdf", "kind": "attachment", "title": "节后市场策略 261007", "source_label": "其他", "excerpt": "节后市场策略 2026.10.7 1.市场观点 3.其他2.医药资金的避风港？市场观点 n假期海外市场表现： Ø截止10月6日数据，纳指历史新高，但上涨集中少数AI权重股。", "content": "节后市场策略 2026.10.7 1.市场观点 3.其他2.医药资金的避风港？ 市场观点 n假期海外市场表现： Ø截止10月6日数据，纳指历史新高，但上涨集中少数AI权重股。假期全球普涨，但涨幅高度集中在 AI/半导体链，而恒生科技和还是指数下跌。 Ø10月1日-6日，个股方面：特斯拉+7.29%、博通+7.01%、AMD+6.16%、台积电ADR+5.72%、英伟达+4.76%（10月6日市值5.77万亿美元）、微软+3.20%、苹 果+0.18%。10月6日当天，希捷跌超9%、西部数据跌超6%（东芝600亿扩产影响）。罗素2000持续走弱。 Ø商品端（9月30日—10月6日）：布伦特原油103.53→100.58美元/桶（-2.85%，10月6日盘中一度跌破100）；伦敦金4176.3→4156.4美元/盎司（-0.48%），伦敦 银60.73→61.00（+0.44%）；LME铜14410→14415美元/吨（+0.03%），LME铝3170→3143.5（-0.84%）。 Ø债汇端：10年期美债5.29%→5.27%（10月5日盘中曾触5.34%、2002年以来最高），30 amillo@morganstanley.com +1 212 761-4438 Morgan Stanley Asia (Singapore) Pte.+ Daniel K Blake Equity Strategist Daniel.Blake@morganstanley.com +65 6834-6597 Morgan Stanley Asia Limited+ Andy Meng, CFA Equity Analyst Andy.Meng@morganstanley.com +852 2239-7689 Morgan Stanley MUFG Securities Co., Ltd.+ Yu Shirakawa Equity Analyst Yu.Shirakawa@morganstanleymufg.com +81 3 6836-5432 Telecom & Networking Equipment North America Industry View In-Line What Happened: Morgan Stanley strategists recently met with a senior Washington telecom, FCC and export-control legal team with direct engagement across the White House and FCC. Discussion focused on the Administration’s efforts to reduce reliance on Chinese technology, with the FCC Covered List emerging as the more likely near-term mechanism for optical transceivers (a note we made in our AI Safety DC trip wrap-up last week ). Policy discussions suggest 3.2T transceivers would likely be where restrictions would be phased in, potentially as soon as October, with industry recently asked to demonstrate credible U.S. or friend-shoring plans before 3.2T becomes broadly deployed. Our conversations noted that discussions are also indicating Chinese-built transceivers could still be importable, even at 3.2T, as long as 65% of the BOM comes from US-based companies (DSP / laser would get you pretty close). Initial 3.2T volumes are not expected to ramp in volume until 2029, limiting the near-term revenue impact of a restriction even if action comes sooner. We would see these rules as having the potential to avoid creating a constraint on hyperscalers' ability to build today, but keeping the laser market tighter given laser would largely need to be from a US-based vendor to meet a 65% value threshold, a positive for LITE/COHR. How this echoes conversation with LITE earlier in the quarter: We hosted LITE at Nasdaq Asia in late August , where we asked the company about potential FCC rules. At the time they noted that the FCC had been in contact with them about potential Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. Key Takeaways Recent DC trip by our strategist team gave a greater idea of what potential FCC rules on optical transceivers could look like. Potential restrictions, likely to come in at 3.2T, limit Chinese-based transceivers, with a potential workaround if US-based content above 65% of the BOM. Solution seemingly a win-win for LITE/COHR, with laser market likely to stay tight, but not having to take on lower module assembly business. Also, does not create bottlenecks for hyperscalers. Assuring InP substrate delivery will be key to look at going forward. October 1, 2026 04:09 AM GMT Not for redistribution without written consent of Morgan Stanley wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 M Update 2rules, with the company noting their feedback was that the rules would need to be phased in over time to prevent material supply/demand dislocation in the market with 60-65% of transceivers coming from China-based transceiver vendors. They also noted that pure transceiver volumes alone, at current pricing structures, would not be the most attractive business for them to bring on. These rules, which are both phased in and don't limit Chinese assemblers, as long as enough content is US-based, would seemingly address both of these concerns. Our Thoughts: 1. 3.2T looks like the likely policy pressure point, but the near-term impact should be limited - Administration efforts appear focused on reshaping the supply chain before 3.2T reaches volume rather than disrupting the existing 800G and 1.6T base. With the 3.2T ramp not expected to begin until 2028 and broader adoption closer to 2029, an October Covered List action would provide roughly two years before meaningful volumes enter the market. Hyperscalers are already working on plans intended to demonstrate greater U.S. or friend-shored manufacturing, suggesting the policy objective is increasingly about determining where the next generation is built rather than immediately displacing current Chinese supply. 2. Laser pricing looks like the stronger read-through versus transceiver share - A Covered List framework does not necessarily require Chinese module vendors to lose significant share if they can increase the U.S. content of the underlying BOM. Combining a U.S. DSP from Marvell with laser content from LITE/COHR could potentially move a Chinese-built transceiver to the 65% U.S.-value threshold discussed in our strategists team policy meeting. Such an outcome would leave Innolight and Eoptolink (both covered by Andy Meng) with less flexibility to substitute toward China-based lasers while allowing them to remain relevant at the module level, reducing the risk from China-based laser makers. We therefore see a stronger read-through for high-speed laser pricing and LITE/COHR component share than for a wholesale redistribution of transceiver share. 3. Replacement capacity not ready; nor is it the most attractive opportunity - As noted above, LITE noted that assembly of transceivers (mid-30's to low- 40s gross margin product), is not the most attractive opportunity for US- based optical companies (vs. EMLs and lasers well north of 50% steady state and approaching 75% today). While 3.2T is not yet in production, we use AAOI's current 800G and 1.6T capacity ramp as an illustration of the scale of US supply available to absorb a potential future demand shift. AAOI (not covered), the only material US-based production of transceivers, is currently ramping capacity. AAOI exited Q2 with manufacturing capacity approaching 200,000 800G and 1.6T units per month and expects to reach ~650,000 units per month by year-end 2026, while management continues to expect demand to outpace production through mid-2027. AAOI’s YE26 capacity annualizes to ~12M 800G/1.6T units, versus ~101M units combined for Innolight and Eoptolink based on annualized 1H capacity (44.3M and 56.7M, respectively), or >8x AAOI. Based on AAOI’s year-end capacity plans and our Internet team’s hyperscaler capex work, we estimate AAOI could support less than 4 GW of hyperscaler capacity even before wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 M Update Morgan Stanley Research 3factoring in manufacturing utilization. Replacing a meaningful portion of Innolight and Eoptolink’s supply would therefore require a substantial multi- year capacity build, with limited ability for existing U.S. suppliers to absorb those volumes in the near term. 4. InP supply and sourcing outside of China will still be areas to watch - Potential FCC rules could create a win-win for LITE/COHR by reducing the risk of China-based laser makers flooding the market, without forcing them to build significant transceiver module capacity to absorb lower-margin assembly business. Were China to view the rules as too one-sided, it could respond with tighter restrictions on InP substrate exports, a key bottleneck to laser capacity ramping. At the same time, sourcing outside of China could broaden the beneficiary set beyond U.S. suppliers, supporting InP substrate demand at JX Advanced Metals (5016 JP), while providing a tailwind for Sumitomo Electric’s (5802 JP) CWLD products and Furukawa Electric’s (5801 JP) DFB lasers. Exhibit 1:As it relates to optical transceivers (all speeds), Innolight and Eoptolink collectively have ~8x more capacity than US player AAOI 12.044.356.7 0.010.020.030.040.050.060.0 AAOI Innolight EoptolinkM units / yearAnnualized Transceiver Capacity (M units) Source: Company data, Morgan Stanley Research Note: AAOI (not covered) figures based on annualizing 4Q26 transceiver capacity; Innolight and Eoptolink figures based on annualizing 1H26 figures (both covered by Andy Meng) Exhibit 2:While the industry has not yet seen 3.2T, based on AAOI's 800G and 1.6T capacity ramp plans in 4Q26E, we estimate the company can support a maximum of ~3.7 GW without accounting for manufacturing utilization rates AAOI Capacity → GW Supported Q4-26E Assumptions / Notes 800G OSFP capacity (K units / month) 420 AAOI Q4-26 planned monthly capacity (capacity ramp slide) (+) 1.6T OSFP capacity (K units / month) 230 AAOI Q4-26 planned monthly capacity (capacity ramp slide) (=) 800G + 1.6T (K units / month) 650 Both speeds count one-for-one as modules (×) Months per year 12Annualizes the Q4-26 monthly run-rate (×) Units per K 1,000 Converts thousands to units (=) Annualized transceivers (units) 7,800,000 Max units per year at the Q4-26 run-rate (/) Transceivers per 128K-GPU cluster 655,000 Lambda: ~655K pluggable modules for a 128K-GPU cluster (=) 128K-GPU clusters supported 11.9x Number of 128K-GPU clusters the capacity could equip (×) GPUs per cluster 128,000 Cluster size used in the Lambda example (=) GPUs supported 1,524,275 GPUs that AAOI's annual capacity could network (/) GPUs per 1 GW (GB300 NVL72) 410,256 GB300 NVL72 GPUs per 1 GW (MS assumption) (=) GW supported 3.7 GW Upper bound: assumes all units go to AI back-end fabric Source: Company data, Morgan Stanley Research wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 M U 率与四年新高服务价格未能压制AI主线 10月5日(周一)美股三大指数集体收高：道指上行0.18%报51267.90点，标普500上行0.66%报 7773.95点，纳指上行1.05%报27477.31点、创收盘历史新高(盘中最高27544.07点)。标普十一大板块 十涨一跌，材料与通信服务居前(分别上行1.22%与1.14%)，房地产是唯一下跌板块(-0.44%)。宏观 端出现明显背离：10年期美债收益率收报5.303%，盘中一度升至5.349%，为2002年以来最高；30年期 收益率5.661%，同样创24年新高。当日公布的9月ISM非制造业PMI为54.9(前值55.4、市场预期 55.2)，但支付价格指数从72.6跳升至74.0，为2022年7月以来最高，受访企业普遍把燃料与关税列为成 本推手，供应链交付指数也从51.3升至53.2(连续22个月放缓)。利率预期出现｢短缓长紧｣的结构： CME FedWatch显示10月加息25个基点的概率已从一周前的70.9%降至23.8%，而12月加息概率仍高达 88.1%。研究视角看，指数新高的定价基础更偏向AI盈利兑现(FactSet口径分析师预计标普500三季度盈 利同比增长接近30%)而非利率下行，本周三的3年期与周四的30年期国债招标、以及美联储9月会议纪 要，是长端能否稳住的关键节点。 [第2] 施耐德电气226亿美元全现金收购PTC，工业软件三巨头格局重排 施耐德电气10月5日宣布与PTC签署最终协议，以每股205美元全现金收购PTC 100%股权，对应股权估值 约226亿美元(企业价值约237亿美元)，较PTC公告前最后收盘价(144.03美元)溢价42.3%、较前30个 交易日成交量加权均价溢价46.1%，是施耐德历史上最大一笔收购(2023年收购AVEVA约110亿美元)。 PTC当日上行33.49%，为标普500成分股单日表现最佳；施耐德股价下挫约10%——市场担忧为交易发行 的最多170亿欧元债务与最多60亿欧元新股带来摊薄与杠杆压力，交易预计2027年第三季度完成，需PTC 多数流通股股东批准及监管放行。产业链层面，PTC与达索系统、西门子并称全球工业软件三巨头，覆盖 CAD、PLM、ALM与服务生命周期管理，PTC在截至2025年9月30日的财年营收27.4亿美元、约一半收入 来自美洲、员工逾7000人、服务客户超3万家。并购带动同业重估：达索系统、Nemetschek、TeamViewer均出现上涨。研究视角看，这是｢能源管理+工业自动化｣巨头把工业AI的数据底座 一次性买断的标志性事件——施耐德预计交易将把其工业软件可寻址市场扩大约3倍，第三年实现约8亿欧 元收入协同与2.5亿欧元年成本协同；对买方而言，短期盈利摊薄与高杠杆是股价的直接代价，对工业软件 资产而言，稀缺性溢价被重新定价。 [第3] 英伟达两连创历史新高，台积电ADR市值首破2.5万亿美元 10月5日英伟达上行2.12%，连续第二个交易日创历史新高，总市值升至5.76万亿美元，继续位居全球市值 第一；台积电ADR上行2.75%报485.80美元，总市值一度站上2.5万亿美元并创历史新高。但半导体板块 内部出现明显分化：费城半导体指数盘中一度下探约1%、全天仅上行0.27%，博通、安森美半导体上涨，而AMD、阿斯麦、ARM、高通、英特尔、美光下跌。研究视角看，资金在AI算力链内部从｢广度｣收缩到｢确定性｣——先进制程 代工与定制ASIC拿到溢价，被市场认为成本承压或份额受挤压的环节则被让出估值。这一分化与存储链的 定价担忧同源：在AI对先进产能的挤占下，零部件与代工报价的议价权正在重新分配，英特尔CEO此前称内 存价格已上行5至7倍，是整条链成本传导的起点。此前一日(10月2日)英伟达已创过一次历史新高，两连 新高说明市场对AI资本开支的定价并未因长端利率上行而动摇。 [第4] 马斯克Terafab转向台积电，英特尔14A独家角色生变 科技记者Tim Culpan于10月3日披露，台积电正评估参与马斯克Terafab得州芯片制造项目；马斯克10月4 日在X平台回应称｢正在讨论，也许会有成果｣，但随后补充台积电的角色可能是补充主要供应商英特尔的 产能。知情人士给出的较可能方案是：由台积电拥有并运营新厂，SpaceX与Terafab以股权投资或保底采 购量参与(结构类似台积电日本JASM与德国ESMC)；另一方案是SpaceX/Terafab持多数股权、台积电提 供制程技术与运营经验。Terafab由特斯拉与SpaceX于2026年3月启动，落地得克萨斯州Grimes County， 初期投资约168亿美元，多期总盘子被分析师估至200亿至550亿美元，规划整合逻辑芯片、存储与先进封 装，长期目标月投片100万片、年产1000亿至2000亿颗定制AI与存储芯片。英特尔4月已加入该项目并计划 采用其14A(1.4纳米级)制程。消息发酵后英特尔10月5日下跌2.6%(盘中一度下挫逾4%，年内累计涨 幅仍有约217%)，市场担忧其被边缘化；台积电台股上行约3%。Oppenheimer分析师指出，台积电制程 可能取代英特尔原本的角色。研究视角提示一个被忽视的法律变量：Terafab本身不持有英特尔与台积电之 间的交叉专利授权，若采用英特尔开发的制程生产芯片，可能触及台积电专利，这是方案能否落地的隐藏约 束。 [第5] 东芝扩产冲击后的定价修复，存储链单日反弹收复部分失地 上周五因日经新闻报道东芝拟投入约600亿日元把菲律宾HDD产能翻倍、目标把按容量计的市场份额从约 10%提升至30%，希捷收跌9.96%至851.39美元、西部数据收跌10.07%至415.97美元(当日纳指上行约 1.2%)。10月5日两家公司止跌反弹：西部数据上行超6%、希捷上行约4.5%。分歧点在于扩产的可行性： 花旗分析师指出东芝的关键部件(盘片、磁头)依赖外部供应商，市场可能高估了冲击；同时希捷面向数据 中心的高容量硬盘产能已按长期合约基本锁定至2027年。但｢缺货—定价权｣的叙事确实被打开了缺口： 西部数据CEO此前在电话会中直言供给紧张｢给了我们提升定价的空间｣，而HDD零售价格已连续六个季 度上行、西部数据产能排期售罄至2028年。研究视角的判定是：存储链的定价逻辑正从｢供给纪律｣转向 ｢供给响应速度｣——上游部件与设备的可扩产能力，比整机厂的产能规划更能决定价格的持续性；同类 逻辑也适用于HBM与服务器DRAM(合约价仍在环比上行)，扩产消息对估值的影响会先于价格，但反过 来也意味着设备与材料环节的订单能见度更长。 [第6] 疫苗与血液肿瘤临床数据集中读出，生物医药单日重估 10月5日医药生物成为美股最强分支之一。Vaxcyte上行30.07%，公司肺炎球菌结合疫苗达到后期临床试 验主要目标；诺瓦瓦克斯医药上行超20%、Moderna上行近7%；丹麦Genmab因与艾伯维联合开发的血 液肿瘤药物在晚期研究中降低了疾病进展或死亡风险，股价一度上行7.6%。相对地，辉瑞下跌超1%，显示 资金在板块内部按管线进展而非整体配置做取舍。研究视角看，临床读出正进入密集窗口：疫苗平台技术 (结合疫苗与mRNA)与血液肿瘤的双抗、ADC管线成为当期价值重估的核心变量；而美国医保定价谈判 与FDA审批节奏构成后续不确定性。对二级市场的含义是——生物医药的alpha已高度集中于｢数据时点｣，同一板块内的个股相关性下降，事件驱动的定价效率提升，这也是为什么同一天辉瑞与国家疫苗股走 势完全背离。 [第7] 华为与高通签署多年期专利交叉授权，覆盖5G、AI与计算 华为10月5日宣布与高通签署多年期、范围广泛的专利组合交叉授权协议，双向许可覆盖5G、计算、人工 智能与网络等技术领域；高通同时收购华为在计算、AI、网络等领域的部分美国专利，交易待监管批准后 完成，协议明确遵循公平、合理、无歧视(FRAND)原则。研究视角的两层含义：一是标准必要专利的交 叉授权框架在AI算力与智能终端时代被沿用并扩容，头部厂商的专利组合价值随AI终端渗透率上行，许可 收入的可预期性提升；二是专利资产的部分转让意味着两家在计算与网络方向的竞合关系再平衡，美国专利 的转移会改变后续授权谈判的筹码分布。对整机与射频环节，专利成本的可预测性改善有助于毛利稳定；对 纯专利运营方，头部之间达成交叉授权通常意味着新增许可窗口收窄。 重点标的：高通、ARM、诺基亚、InterDigital、爱立信、Skyworks、Qorvo、博通、Marvell、索尼。 [第8] 鸿海9月营收同比增38.4%，AI服务器组装验证三季度超预期 鸿海(富士康)9月单月营收1.16万亿元新台币，同比增长38.4%；第三季度营收约3.027万亿元新台币 (约955亿美元)，同比增长47%，高于分析师平均预期的2.83万亿元；前九月累计营收7.67万亿元新台 币、年增39.5%。作为英伟达服务器组装的核心合作伙伴，鸿海的季度读数是AI资本开支落地节奏最直接的 实物验证。研究视角看，AI叙事正从｢芯片订单｣推进到｢整机交付｣阶段：机架级组装、液冷、电源与测 试环节的产能与良率成为新的瓶颈项，交付节奏受制于机柜级热管理与电力配套，而非GPU本身。这也解 释了为什么近一个月资金持续在光模块、覆铜板、液冷与电源环节加仓——这些环节的订单能见度与整机 出货量直接绑定。风险点在于客户集中度：单一客户订单的排产调整会以季度为单位放大到整机厂与配套厂 的收入波动。 重点标的：英伟达、戴尔、超微、慧与、维谛、Celestica、捷普、Fabrinet、Arista Networks、博通。 [第9] CME算力期货成交放量，B200合约溢价走高，算力租赁价差反映芯片供需紧张 芝加哥商品交易所GPU算力期货上市之后流动性快速抬升，B200合约相对H100合约溢价持续走高，映 射高端AI芯片供给紧张格局。市场交易结构显示，机构参与者占比提升，云厂商、托管数据中心、转型AI 的矿企积极参与套保，锁定未来算力采购与出租收益。BCG预测2030全球AI算力市场规模接近2.3万亿美 元。算力期货的价格信号，正在成为观察全球AI芯片供需景气的全新高频指标。 重点标的：英伟达、Core Scientific、TeraWulf、Hut 8、Equinix、Vertiv。 [第10] 三星HBM4报价维持高位，2027‑2028高带宽存储产能被大客户提前锁定 韩国产业链消息，三星维持HBM4的高价策略，2027年度HBM4报价显著高于HBM3E。美光披露，公司2027、2028年HBM绝大多数产能已经被头部云厂商与AI企业提前预定。TrendForce机构预测，2027年HBM均价同比大幅上涨，服务器DRAM、企业级SSD合约价格维持上行。高盛测算当前HBM供需缺口处于历史高位。AI大模型迭代、单卡HBM容量提升持续拉动高带宽存储需求。 重点标的：美光、三星电子、SK海力士、应用材料、泛林半导体、科磊、ASML、爱德万测试、泰瑞达、南亚科技。#文字观点", "publish_time": "2026-10-08 00:12", "tags": ["文字观点"]}, "post:2026-10-08T23-17:6219923562dc": {"id": "post:2026-10-08T23-17:6219923562dc", "kind": "post", "title": "2026-10-08 23:17", "source_label": "帖子正文", "excerpt": "[热度第1] [中性] A股节后首日放量调整,沪指收报3811.90点、双创指数同步回落 2026年10月8日,A股国庆假期后首个交易日三大指数集体收跌:上证指数收报3811.90点、回落30.29点 或0.79%,盘中最低3795.37点;深证成指收报12620.90点、回落262.92点或2.0", "content": "[热度第1] [中性] A股节后首日放量调整,沪指收报3811.90点、双创指数同步回落 2026年10月8日,A股国庆假期后首个交易日三大指数集体收跌:上证指数收报3811.90点、回落30.29点 或0.79%,盘中最低3795.37点;深证成指收报12620.90点、回落262.92点或2.07%;创业板指收报 3036.66点、回落98.62点或3.15%;科创50指数全天跌幅接近5%。量能方面,两市成交额16821.27亿 元、较上一交易日放量约2441亿元,为近五个交易日均值的106.66%。广度方面,全市场上涨1698只、下 跌3748只、平盘126只,其中涨停39只、跌停1只,涨跌比0.45,创5日新低个股2450只。行业层面,银 行、煤炭、航运港口、港口、石油石化、燃气、焦炭、电力与生物质能方向收红,半导体、通信设备、元 件、光学光电子、共封装光模块与光芯片方向跌幅居前;概念端油运、钠离子电池、磷酸铁锂、覆铜板、电 子树脂与波罗的海干散货指数方向逆势上行。当日亚太与港股收盘:日经225指数收报69042.11点、回落 993.60点或1.42%,东证指数收报4091.46点、回落1.51%;韩国综合指数收报6625.93点、回落 2.62%;中国香港恒生指数收报23785.79点、回落1.43%,恒生科技指数回落2.89%、创2024年9月以来新 低,大市成交额2072.55亿港元。 [热度第2] [中性] 隔夜美股三大指数收跌,10年期美债收益率盘中一度上破5.36%创2002年以来高位 美东时间10月7日,美国三大股指集体收跌:道琼斯工业平均指数回落0.66%报51179.87点,纳斯达克综 合指数回落0.22%报27538.69点,纳斯达克100指数回落0.21%报31160.08点,标普500指数同步走低。债 市是当日最大的定价变量:10年期美债收益率盘中一度上破5.36%、创2002年以来最高水平,30年期收益 率同步处于二十余年高位区间,隔夜收益率抬升直接压制长久期成长资产估值。大型科技股多数走弱,英伟 达收跌0.74%,超威半导体收跌0.55%,苹果与谷歌的区间波动在1%以内。存储环节逆势走强,美光科技 收涨4.06%、成交额325.99亿美元居全市场首位,闪迪收涨1.92%。政策预期方面,美国9月非农就业仅新 增2.9万人、远低于市场预期的约9万 rs. Eaton targets 2Q27 for first deployment of its 2.5MW MV SST with a broader industry-wide adoption in late 2027 and Vertiv expects its sidecars to introduced next year, it expects LV recti fi Goldman Sachs does and seeks to do business with companies covered in its research reports. As a result, investors should be aware that the firm may have a con flict of interest that could a ffect the objectivity of this report. Investors should consider this report as only a single factor in making their investment decision. For Reg AC certifi . Analysts employed by non-US a ffiliates are not registered/quali fi analysts with FINRA in the U.S. ed as researchcation and other important disclosures, see the Disclosure Appendix, or go toers to only be deployed in 2028/2029be launched in 1H27. While Schneider anticipates its sidecar to also be800VDC product launches are generally being targeted for 1H27 with amanufacturing (Vertiv, Schneider, INNIO, Envicool).Demand for datacenter equipment remains strong and capacity is tight butwithin.crucial for this transition. 1 October 2026 | 6:27AM BST Multi-Industry: Takeaways from Data Center World +44(20)7774-8354 | daniela.costa@gs.com +44(20)7051-8710 | ines.lefranc@gs.com +1(212)357-8914 | joseph.ritchie@gs.com +1(212)357-0535 | mark.delaney@gs.com +852-2978-1783 | jacqueline.du@gs.com Goldman Sachs (Asia) L.L.C.Jacqueline DuGoldman Sachs & Co. LLCMark Delaney, CFAGoldman Sachs & Co. LLCJoe RitchieGoldman Sachs InternationalInes LefrancGoldman Sachs InternationalDaniela Costa https://www.valuelist.cn wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Multi-Industry Goldman Sachs and SSTs by the end of the decade. During its recent CMD, Legrand similarly said that its sidecar would be ready in 2027 while its AI load stabilizer (required for full 800VDC) would only be ready by 2028 (see our takeaways here ). Debates remain around where to locate storage (historically at rack 但尚未形成趋势性补库，行为整体偏谨慎。 9月价格指数大幅上涨，购进与出厂价格“剪刀差”扩大。上游受益涨价，中下游因需求偏弱难以提价，利润空间面临挤压。 综合来看，9月制造业PMI边际回升，生产端受旺季带动明显，内需在基建和备货拉动下局部回暖，外需保持韧性。然而，短期修复带有明显的季节性脉冲特征，价格“剪刀差”扩大与中小企业持续收缩，体现微观体感偏冷与内需不足的问题。经济呈“非均衡弱修复”格局，后续需观察节日效应消退后内需的持续性。 华泰证券 1、生产分项季末冲量的季节性因素提振下9月制造业PMI环比回升0.3个百分点至50.1%、继今年6月后再度回升至扩张区间，但仍低于2016年以来（除2020年）的季节性水平50.3%。 2、新订单/新出口订单PMI分项分别较8月回落0.1/0.1个百分点至50.5%/50%，而生产分项亦较8月回升1.3个百分点至51.7%。 原材料库存指数较8月的48.1%回升至48.2%，产成品库存由8月的48.4%回落至47.6%，或反映制造业企业仍以“以销定产、去库存”为主，主动补库意愿仍不强。 9月购进材料/出厂价格分项分别较8月的56.6%/50.4%进一步上行4.2/3.6个百分点至60.8%/54%，两者价差由8月的6.2个百分点继续走阔至6.8个百分点。 往前看，财政发力幅度，以及“9·29”增量政策组合拳出台后PSL能否进一步扩容以支持“两重”、“六张网”等项目建设，进而加快相关项目投资和实物工作量形成或是制造业景气度能否持续回升的关键。 中金公司 1、9月PMI新订单环比下降0.1个百分点至50.5%，其 中新出口订单环比下降0.1个百分点至50.0%；而PMI生产环比上升1.3个百分点至51.7%。。2、分大类行业来看，9月消费品制造业、高耗能行业分 别环比上升1.7、0.1个百分点至50.7%、48.0%，皆为连续第二个月环比边际上升；而9月高技术制造业、装备制造业皆环比下降0.4个百分点至52.5%、51.0%。 原油、有色金属等大宗商品价格上升，推动9月原材料购进价格、出厂价格分别环比上升4.2、3.6个百分点至60.8%、54.0%，但受制于需求，上游价格上升挤压下游利润率的态势进一步凸显。 财政政策加速落地，或推动建筑业边际修复。部分受节假日效应推动，服务业重回扩张区间。 平安证券 1、9月生产指数较上月上升1.3个百分点至51.7%，新订单指数为50.5%，较上月小幅回落，生产恢复明显快于新增需求扩张。 2、。高技术制造业和装备制造业PMI虽较上月略有回落，但仍高于制造业总体。据中物联，中秋国庆双节备货、换季以及国外订单收官带动消费品制造业需求明显回升。 采购量指数升至51.0%、产成品库存指数降至 47.6%，结合在手订单指数回落，表明前期订单加快执行、产成品出库较为顺畅，尚未出现生产加快伴随库存积压的信号。 主要原材料购进价格指数和出厂价格指数分别升至60.8%和54.0%，连续两个月上行，对PPI环比修复形成支撑。 展望四季度，9月28日国常会部署增量政策后，PSL降息扩围、再贷款扩容和购房贷款贴息政策相继推出，有望协同支持基建、设备更新和刚性住房需求，增强内需修复动力。 申万宏源 1、9月制造业PMI延续回升、单月上行0.3个百分点至50.1%，剔除受天气因素影响较大的供应商配货指数后，本月实际PMI也上行0.3个百分点，整体符合季节性。 2、从主要分项看，生产改善是本月PMI回升的关键，生产指数单月上行1.3个百分点至51.7%，采购量指数回升0.5个百分点至51%，或也反映中秋、国庆双节前备货的影响。 产成品库存、从业人员指数小幅回落，分别较前月下 行0.8、0.3百分点至47.6%、48.4%；供应商配货指数持平前月（50.1%）。 价格指数表现分化，投入品价格指数上行2.8个百分点至54.0%、销售价格指数下行1.3个百分点至48.5%。 9月制造业、非制造业生产经营预期均保持在较高水平。往后看，超强厄尔尼诺或将形成，虽然其带来的阶段性寒潮可能对内需形成短期扰动，但暖冬天气利好居民出行、室外施工，或带动服务消费、投资需求释放。同时存量政策加速落地，全球AI景气仍有上升空间，叠加前期盈利改善的滞后传导，预计后续经济延续温和回升格局。 兴业证券 1、9月制造业采购经理指数为50.1%，比上月上升0.3个百分点，实现连续两个月回升；在调查的21个行业中有12个行业PMI高于临界点，比上月增加4个，制造业行业景气面有所扩大。 2、景气回升的原因主要有三：一是秋旺季来临，生产活动扩张加快；二是政策密集落地形成支撑，三是国际大宗商品价格上涨带动购进价格指数继续上行，价格分项对制造业名义景气形成支撑。 原材料库存指数为48.2%，比上月上升0.1个百分点，仍处低位。 受国际大宗商品涨价、部分行业需求增加影响，9月购进和出厂价格指数分别为60.8%和54.0%，分别比上月上升4.2个和3.6个百分点。 展望未来，随着政策发力和秋旺季共振，四季度经济增长动能有望持续积聚，景气回升态势进一步巩固。 光大证券 1、9月制造业PMI较上月回升0.3个百分点至50.1%，高于市场预期49.9%，也高于季节性水平49.9%（选取2021-2025年同期均值）。 2、9月大型企业PMI指数持平于上月的50.6%；中型企业PMI指数较上月回升0.3个百分点至49.7%；小型企业PMI指数较上月回升1.0个百分点至48.9%。 9月，原材料库存指数较上月回升0.1个百分点至48.2%，产成品库存指数较上月下降0.8个百分点至47.6%。尽管9月企业生产指数升幅大于新订单指数，但产成品库存指数大幅回落，表明下游销售情况较为顺畅。 9月原材料购进价格指数较上月大幅上行4.2个百分点至60.8%，出厂价格指数较上月大幅上行3.6个百分点至54.0%。价格指数大幅上行，主要受输入性因素影响。 8月下旬以来，国家发改委加快部署109项重大工程和“六张网”项目建设；9月初，8000亿元新型政策性金融工具较往年提前投放；9月28日国常会提出，要加大宏观政策逆周期调节力度，加快各类债券发行使用进度，推动“十五五”规划、“六张网”实施方案等明确的重大工程项目尽早开工建设。增量政策方面，预计近期将盘活使用地方政府债务结存限额，用于补充地方财力。 长江证券 1、9月制造业PMI升至50.1%，环比回升0.3pp，强于2013-2019年同期季节性环比表现（季节性变化口径下同），但绝对水平仍低于2013-2019年同期均值约0.7pp，属于偏弱复苏。 2、从构成分项对PMI的拉动来看，生产指数回升1.3pp，拉动当月PMI约0.3pp，为最主要贡献项，也说明生产是本月PMI重返荣枯线的核心动力，而需求端分项整体偏弱。 原材料库存指数微升0.1pp至48.2%，企业在采购补库的同时保持产成品去化，库存结构整体相对健康。 9月主要原材料购进价格指数回升4.2pp至60.8%、出厂价格指数回升3.6pp至54.0%，均大幅强于季节性，或源于原油、有色金属价格上行带动。 在生产补库旺季之后，后续景气的改善趋势能否维持，需求端、尤其是内需的表现能否接力仍是重要的参考因素。而近期包括按揭贷款贴息、PSL降息扩围、科技创新和技术改造再贷款提额等多项稳增长政策出台，政策加快财政货币两端支持基建投资，以及通过地产稳定居民部门预期的氛围较浓，后续基建投资、以及相关实物量有望延续改善，且或是四季度经济增长的主要抓手。 招商证券 1、9月全国制造业PMI回升至50.1%，主要由生产项贡献。其中，供给相对需求更强，内外需求保持平稳，需求端库存压力相对原料端更弱，产品端价格回升幅度仍不及原料端。 2、随着极端天气影响消退，建筑业与部分消费相关行业迎来传统旺季，叠加多项促增长政策加速转化实物工作量，9月企业生产活动明显加快，带动制造业PMI突破荣枯线。 产成品库存指数较上月下降0.8个百分点至47.6%，企业销售活动保持顺畅。 9月原材料购进价格指数为60.8%，较上月上升4.2个百分点；出厂价格指数为54%，较上月上升3.6个百分点，两指数环比升幅均较大，不过出厂价格指数上涨幅度仍相对低。 9月建筑业商务活动指数大幅上升3.4个百分点，结束了连续8个月50%以下运行走势，创下年内新高，且实现年内首次超过去年同期水平，摆脱历年同期低位。同时，建筑业业务活动预期指数也创出年内新高，反映建筑企业对后续行业运行普遍乐观。", "status": "extracted"}, "post:2026-10-08T13-17:ea9c7378cb74": {"id": "post:2026-10-08T13-17:ea9c7378cb74", "kind": "post", "title": "2026-10-08 13:17", "source_label": "帖子正文", "excerpt": "🍁🍁🍁hcdx固态＆锂电更新 🍁固态电池仍是中外在能源领域竞争的关键，9月松下宣布将于26Q4交付固态电池样品，三星SDI宣布面向人形机器人开发的固态电池目标27年下半年量产；工信部也在十五五规划中目标2030年全固态电池初步实现规模化应用。", "content": "🍁🍁🍁hcdx固态＆锂电更新 🍁固态电池仍是中外在能源领域竞争的关键，9月松下宣布将于26Q4交付固态电池样品，三星SDI宣布面向人形机器人开发的固态电池目标27年下半年量产；工信部也在十五五规划中目标2030年全固态电池初步实现规模化应用。往27年看比亚迪也计划推出一款搭载固态电池，BBA也在推进全固态电池装车 验验证再回灌AI模型迭代的模式已初步确立，率先利好上游蛋白合成、临床前CRO等环节。内容来自小牛研报纪要涨停板：华北制药、联环药业其他强势股：五洲医疗、昭衍新药、蓝帆医疗、昂利康房地产国庆假期期间，深圳的二手房市场活跃度明显提升。随着深圳非核心区域放开限购，越来越多的非深户开始将置业目光投向深圳。涨停板：陆家嘴其他强势股：世联行、大名城其他涨停板贝特利：次新股，光伏导电材料金溢科技：智能驾驶顺灏股份：烟草九阳股份：家电+AI机器人广西能源：电力#文字观点", "publish_time": "2026-10-08 15:52", "tags": ["文字观点"]}, "post:2026-10-08T15-53:9e5e72580413": {"id": "post:2026-10-08T15-53:9e5e72580413", "kind": "post", "title": "2026-10-08 15:53", "source_label": "帖子正文", "excerpt": "电池与储能：美国需求超预期，技术路线多点突破 伯恩斯坦周报的产业信号密集： 美国储能：Wood Mackenzie预计年装机未来五年增长50%+，2031年累计207GW/715GWh；2Q26创纪录装机5.4GW/18.9GWh，平均时长2.8→3.5小时", "content": "电池与储能：美国需求超预期，技术路线多点突破 伯恩斯坦周报的产业信号密集： 美国储能：Wood Mackenzie预计年装机未来五年增长50%+，2031年累计207GW/715GWh；2Q26创纪录装机5.4GW/18.9GWh，平均时长2.8→3.5小时；AI数据中心负荷是核心驱动。 中国政策：2026-2030电池产业规划目标2030年全固态电池规模化应用、钠离子电池并行、15000次循环长寿命电池、ppb级缺陷率。 技术突破：国轩金石固态电池目标400Wh/kg、长期成本150美元/kWh，2GWh产线设计完成并通过针刺/高温测试；Ultium Cells田纳西工厂2028年量产LMR电池（较LFP能量密度+33%、成本相当）；比亚迪陕西16GWh刀片电池二期满产（支持10%-70%五分钟闪充）；宁德时代张北14年老旧储能电站50+块LFP电芯测试仍保持85%容量——LFP长寿命实证强化储能经济性。 欧洲：大众/国轩三国合资（西班牙29.1GWh、斯洛伐克8.4GWh、摩洛哥10万吨LFP正极）；Stellantis因ACC长续航电池短缺暂停法国工厂——欧洲电池瓶颈在验证需求真实强度。 估值参考（伯恩斯坦）：宁德时代H股770港元（Outperform）、天齐锂业80元（Outperform，1Q26最佳主意）、阳光电源151元。A股映射：储能系统（阳光电源、宁德时代、亿纬锂能）、固态电池主题（国轩高科、赣锋锂业、上海洗霸类材料）、储能温控与消防（英维克、青鸟消防）。#文字观点", "publish_time": "2026-10-08 15:53", "tags": ["文字观点"]}, "post:2026-10-08T17-30:562363db53ee": {"id": "post:2026-10-08T17-30:562363db53ee", "kind": "post", "title": "2026-10-08 17:30", "source_label": "帖子正文", "excerpt": "东山精密回应 FCC 监管电话会 一场围绕股价波动召开的交流会，把东山精密的两条经营主线重新摆到了台前：光模块的交付，以及PCB的增长。市场担心的是，美国会不会对光模块提出新的物料来源要求，进而影响中国供应商的订单。", "content": "东山精密回应 FCC 监管电话会 一场围绕股价波动召开的交流会，把东山精密的两条经营主线重新摆到了台前：光模块的交付，以及PCB的增长。 市场担心的是，美国会不会对光模块提出新的物料来源要求，进而影响中国供应商的订单。东山精密管理层反复强调的，则是一线客户仍在催交付，公司还在拓展客户、协调物料，PCB需求也比此前预期更强。 两边关注的时间并不相同。市场在给未来的政策变化定价，公司在解释眼前的经营状态。读懂这场交流，首先要把这两件事分开。 这份纪要最值得关注的，是东山精密的增长能否从光模块延伸到PCB，并把客户需求变成可以持续交付的收入。政策推演需要核实，业务兑现也需要逐季检查。 1 /65%的争议，先看它究竟是什么 会议的直接背景，是市场对一份研究报告的讨论：未来部分光模块是否可能被要求达到65%的美国物料占比。 按主持分析师的转述，这个数字来自相关人士对潜在政策的推演。纪要没有提供将该比例明确适用于东山精密光模块的正式法规。因此，不能把研究情景直接写成已经生效的行业门槛，也不能由此推出中国光芯片已经被全面禁止使用。 但这也不意味着FCC监管变化可以忽略。美国《联邦公报》9月11日公布的FCC规则，针对特定Covered List实体生产的含逻辑功能硬件组件，并附有整机授权条件；该规则定于2026年10月13日生效。这与会议讨论的“65%美国物料占比”，属于需要分别核对的事项。 公司给出的一线反馈是：截至此次交流，管理层接触的客户尚未专门就相关FCC议题提出新的要求。袁总提到，自己9月曾三次赴美，近期与客户沟通的重点仍是产能和交付。 客户暂未提出要求，说明当时尚未观察到相应的订单执行变化；它不能替代对未来政策适用范围和生效安排的判断。 这场会没有提供足够依据，支持直接按最坏情景削减全部业务，也没有给出足以排除政策风险的证明。接下来真正有用的信息，是正式条文、客户采购标准，以及认证和交付安排有没有发生变化。 2 /自制光芯片的优势，到底体现在哪里 管理层回应物料占比问题时，给出一个重要数字：按公司内部成本核算，光芯片占相关模块成本的比例约为1%—2%，成本大头更多在DSP等电子器件。 DSP可以简单理解为处理高速信号的关键电芯片。它与提供光信号的光芯片分工不同，供货情况也要分别观察。 公司认为，自制光芯片的成本较低，如果未来确实出现物料比例要求，其余器件仍有采购和调整空间。这是管理层对潜在情景的应对思路。但内部成本、外部采购价格和监管采用的计价方式，未必是同一个口径。 如果规则没有明确“美国物料”的认定方式、比例分母及关联交易估值方法，就不能拿内部成本表直接算出合规结论。美国供应商、美国制造和产品原产地，也不能简单画等号。 回到经营本身，自制芯片更容易理解的价值，是公司能在芯片与模块之间协调产品、成本和交付。尤其缺货时，能够控制部分上游供给，有机会提高交付的稳定性。 不过，成本优势有多大，仍要看产品方案。被问及800G毛利率时，管理层没有给出具体指引，而是以硅光方案举例：假设单颗相关光芯片4美元，一个模块使用两颗，合计8美元，节约空间未必像市场想象得那么大。 1%—2%是管理层披露的内部成本口径，4美元和两颗芯片是解释成本的举例。它们都不能直接推导出公司全部产品的毛利率，更不能据此认定利润率必然大幅领先同行。 最终还要把良率、封装测试、客户报价和规模效应一起放进账里看。 3 /需求很强，为什么公司还在反复谈追料 管理层对下一年度光模块景气度的判断较为积极，但交流中出现最多的经营约束，是物料能否及时到位。 据其描述，DSP仍可能是紧缺环节，部分客户获得供给并不容易。公司还把上游晶圆制造和相关芯片排产，视为观察供给释放的重要线索。这是公司对产业瓶颈的判断，不能简化为只看一家晶圆厂扩产，就能精确计算东山的出货量。 客户需求需要经过芯片供应、模块生产、测试和验收，才能形成收入。任何一环跟不上，订单都可能推迟兑现。 值得注意的是，管理层提到，部分海外云厂商正在直接帮助主要供应商协调物料，下一年度需要锁定的部分资源已作安排。这意味着客户参与的不只是采购谈判，也包括保障供应商能够按期生产。 行业缺货，对企业的意义取决于它能不能拿到料。需求旺盛而物料不足，可能推迟收入；供应保障较好，才有条件把行业景气转化为实际份额。 会议没有披露锁料覆盖比例、付款条件和完整交付时间表，因此不能把“已经安排”写成“全年供应完全无忧”。后续应看实际到货、产能利用率和交付节奏，同时留意备货是否占用了更多现金。 4 /客户变多，是机会，也是一段尚未走完的流程 这场会另一个重要变化，是客户接触面的扩大。 管理层表示，公司过去主要面对一两家客户，现在正与更多CSP接触，部分项目进入验证，后续还涉及验厂。CSP就是云服务提供商，也是AI基础设施的重要采购方。 更广的客户覆盖，有助于扩大可争取的订单，也可能降低对少数客户的依赖。不过，接触、验证、验厂和批量采购，是不同阶段。 客户愿意验证，说明产品进入了其评估范围；只有通过后续环节并持续采购，才会稳定贡献收入。不同客户的规格、采购周期和导入速度也可能不同，不能把参与交流的客户数量直接当成新增大客户数量。 纪要中有些表述强调已经导入主流客户，也有表述提到仍在验证或等待验厂。更稳妥的理解是，各项目所处阶段不同，而不是全部客户都已规模放量。 客户拓展最有分量的证据，是新客户从小批量验证走向持续复购，并在收入中形成可见贡献。 会上还提及与海外头部光芯片企业开展合作交流。由于没有披露完整合同和确定供货规模，这更适合看作供应链合作的进展，暂不宜延伸为排他性合作或无限供货保障。 5 /800G仍是主力，1.6T决定下一步产品结构 对产品迭代，管理层的判断相对清楚：当前及下一年度仍以800G为主，1.6T逐步放量；展望2028年前后，1.6T有望成为更主要的产品。这里反映的是公司在会上给出的预期。 这条路径的意义，在于公司可以一边承接现有800G需求，一边推进更高速率产品的导入。增长不只取决于多卖多少只，也取决于卖出去的产品结构怎样变化。 但带宽翻倍，不等于售价、毛利和利润同步翻倍。1.6T需要相应的芯片、封装测试和生产能力，初期良率、成本与客户议价，都会影响升级最终留下多少利润。 因此，观察1.6T时，产品验证进展和实际收入占比要一起看。规格进入下一代，只是商业兑现的开始。 对于更远期的3.2T、6.4T，以及NPO、CPO等形态，管理层强调仍存在路线和节奏上的不确定性。NPO、CPO可以粗略理解为把光互联部件放到更靠近核心芯片的位置，其制造、维护和供应链分工会随方案改变。 近期要验证的是800G交付和1.6T爬坡；远期要观察的是架构变化后，公司还能提供哪些关键产品。两者对应不同时间，不能混在同一笔当期利润里。 管理层认为1.6T可能维持较长生命周期，这有助于理解公司的扩产思路，但不应进一步写成3.2T或CPO不会影响现有业务。 6 /光芯片外售看CW，PCB也在争取更大增量 在光芯片外售方面，管理层提到，下一年度预计会有部分EML销售，但其占相关总体销售收入的比重不会特别大，未来外售更倾向于CW方向，并将这一判断与NPO、CPO的发展联系起来。 CW是连续波激光器，承担提供连续光源的功能；EML则把激光与调制功能结合在一起。两者服务的方案不同，不能仅凭某类芯片报价更高，就判断哪一类业务更赚钱。 公司内部芯片成本接近，也不意味着外售价格、毛利率或市场空间相同。对外销售还要经过客户认证和订单兑现，芯片用于内部模块的成本节约，与卖给外部客户形成的利润，应分开理解，避免重复计算。 会议中，主持分析师曾提到其模型对下一年度光芯片利润采用“20多亿元”的估计。这个数字属于分析师测算，缺少完整假设，也不是公司给出的利润承诺，不能当成已锁定的业绩。 更容易被这场政策讨论掩盖的，是PCB。 管理层表示，PCB景气度超过此前预期，客户正在持续询问和统计产能，公司此前安排的资本开支也将陆续形成产能。若这些需求顺利转化，东山的AI业务增长便有机会同时来自光模块和PCB。 PCB值得单独跟踪：光模块要解决信号互联，PCB承担电路连接和器件承载，两类产品分别参与AI设备建设。拥有两条业务线，有助于争取更多订单，但各自都需要完成产品验证和产能兑现。 如果两条业务都面向同一批云客户，增长会同时受益于其资本开支，也可能在客户放缓建设时一起承压。双业务布局扩大了参与范围，却未必降低同一轮AI投资周期的波动。 这场交流没有给出AI PCB收入规模、客户份额及新增产能盈利水平。客户询问产能是积极信号，真正决定利润贡献的，仍是订单、良率、产能利用率和折旧负担。 管理层对PCB政策风险较为乐观，也不能据此推导出该业务长期免受任何限制。产业供给格局可以影响调整难度，却不能替代具体政策判断。 7 /海外制造提供调整空间，效果要算成本 对于潜在的生产地要求，管理层提出，可以研究把部分PCB装配、PCBA等工序放在美国，利用现有海外布局调整生产安排；同时认为在中国台湾生产的相关芯片，可能有一定应对空间。 这些表态说明，公司考虑过供应链调整方向。但它们仍是预案和判断，不能直接写成已获得豁免。 尤其需要区分的是，工序搬迁、原产地认定和FCC准入要求并非同一件事。美国海关的相关裁定强调，简单装配通常不足以构成改变原产地的实质性转变，具体仍需结合加工过程判断。因而，不能仅凭把一道工序搬到美国，就断言所有监管问题已经解决。 从经营角度看，海外布局的价值在于多了一种调整选择，实际效果还要看新增成本。设备转移、人员配置、重新认证和物流变化，都可能影响投产时间与利润率。 能调整生产，不等于调整没有代价。需要继续跟踪的，是客户是否接受新方案、验证需要多久，以及增加的成本最终由谁承担。 8 /下一步，回到报表里找答案 这场交流能确认的，是管理层对需求和业务拓展保持积极态度，并认为客户当前更关心交付。要判断这份乐观能兑现多少，需要继续看几项具体变化。 光模块看新增客户是否转成批量订单，DSP等物料是否按期到位；产品升级看1.6T的收入贡献和良率；光芯片看外售客户、产品结构与实际利润；PCB看新产能投产后有没有稳定订单支撑。 最后还要落到现金流。快速扩产和锁料可能增加资本开支、存货及预付款。如果收入在增长，经营现金流却持续跟不上，就需要检查备货、回款与产能消化的节奏。 对政策同样如此。既要跟踪正式文件，也要观察客户是否改变采购条款。研究情景可以用于压力测试，但不能未经核实就变成确定的收入损失；管理层的应对信心，也需要执行结果支撑。 东山精密接下来最有说服力的回答，会是光模块按期交付、1.6T顺利放量，以及PCB新增产能逐步贡献利润。市场可以很快改变预期，企业的经营改善，最终仍要一季一季地兑现。#文字观点", "publish_time": "2026-10-08 17:30", "tags": ["文字观点"]}, "post:2026-10-08T22-08:717bb0af7d4a": {"id": "post:2026-10-08T22-08:717bb0af7d4a", "kind": "post", "title": "2026-10-08 22:08", "source_label": "帖子正文", "excerpt": "每日总结 2026年10月8日 🔥 核心一：AI算力硬件——FCC扰动不改产业趋势，光互联/PCB/铜箔全线高景气 核心逻辑： 国庆假期美股AI硬件龙头集体新高（英伟达、Lumentum、戴尔等），验证全球AI资本开支趋势不改。节后A股科技板块受大摩FCC报告（3.2T光模块BOM 65%美系限制传", "content": "每日总结 2026年10月8日 🔥 核心一：AI算力硬件——FCC扰动不改产业趋势，光互联/PCB/铜箔全线高景气 核心逻辑： 国庆假期美股AI硬件龙头集体新高（英伟达、Lumentum、戴尔等），验证全球AI资本开支趋势不改。节后A股科技板块受大摩FCC报告（3.2T光模块BOM 65%美系限制传闻）扰动出现分化，光芯片板块大跌，但多家券商及上市公司紧急澄清该报告无官方依据、对当期业务零影响。产业端PCB国庆几乎不停工、订单排到明年1月，电子布10月如期涨价，铜箔迎来涨价+升级共振，算力硬件景气度仍在加速通道中。FCC传闻本质是3.2T世代的远期博弈，800G/1.6T产品完全不受影响，NPO/CPO方向中长期确定性反而增强。 重点关注标的： 光互联/光模块： - 东山精密（FCC影响被错杀，光模块+PCB双赛道景气度高，董事长在美催货，产能储备充足） - 致尚科技（MPO跳线新签PH客户2027年5亿美元订单，越南+国内同步扩产） - 聚辰股份（AI存储方向，中信电子10月金股） - 优迅股份（AI算力芯片，中信Q4金股） PCB/电子布/铜箔： - 生益科技（AI算力CCL龙头，中信Q4金股） - 中国巨石/中材科技/国际复材（电子布10月如期涨价，G75纱环比+3000元/吨，E225纱环比+20%以上，供不应求格局延续至年底） - 德福科技（9月HVLP出货持续增长，四代产品爬坡加快，电子铜箔盈利加速改善） - 宏昌电子（CCL+GBF+树脂三轮驱动，无布CCL终极方案） 半导体/芯片： - 三环集团（MLCC涨价，三星电机再签27年2.1亿美元大单，日韩厂假期继续上涨） - 圣邦股份（TI 8英寸稼动率95%，10月开启新一轮全面涨价，模拟芯片国产替代不可逆） - 本川智能（前三季度归母净利同比+190%~335%，AI电源PCB+CIPB双轮驱动） 散热/TIM材料： - 九州一轨（激光隐切垄断国内硅光切割代工，金刚石散热设备拓展一体化空间） 🔥 核心二：火电/电力/煤炭——供需拐点确认，三维改善驱动困境反转 核心逻辑： 节后首日火电指数涨1.83%，广西能源涨停。火电迎来长协电价补偿煤价上涨、供需宽松期结束、自由现金流转正提升分红的\"三维改善\"。10月广东、江苏月度电价已接近基准电价（较今年长协上涨约8分、5分），十五五期间可靠容量供需紧平衡。煤炭板块年初至今涨幅22.81%领跑全行业，Q3业绩同环比继续向好，全球能源共振+迎峰度冬在即，煤价企稳上行窗口打开。电力短缺取代算力短缺成为AI基建第一瓶颈——全球数据中心在运IT负载约80GW、在建+已承诺管线约150GW，345kV以上高压变压器交期仍约4年。 重点关注标的： 火电： - 国电电力、宝新能源、广西能源、华能蒙电（国金10月金股，率先受益火电三维改善） - 华润电力（港股火电弹性标的） - 新奥股份（Q3核心利润同比大幅增长，全年54亿有信心，期待27年敞口弹性） 煤炭： - 新集能源（煤炭上行+电力放量，煤电一体分红强化） 电力设备/出海： - 华通线缆（十月金股，非洲电解铝布局远超预期，三季报有望大幅增长） 🔥 核心三：消费与零售——双节动销分化，零食量贩估值回落至底部配置窗口 核心逻辑： 双节消费整体\"量稳价弱\"，白酒动销同比下滑高单位数符合预期，茅五韧性最强。零食量贩双寡头门店扩张动能不减，鸣鸣很忙单月净开1600+家、签约破3万家，板块估值回调至26年12倍左右，强势基本面与估值形成错配。乳制品双节动销量稳价略改善，速冻火锅料略超预期。古茗短期交易层面利空（创始股东缴税）预计节后出清，国庆同店增长趋势稳健。红利资产方面，美10年期国债收益率升至5.36%，国内利率低位，红利防御属性凸显，山东高速、皖通高速、招商港口等接连创新高。 重点关注标的： 零食/餐饮： - 鸣鸣很忙、万辰集团（零食量贩双寡头，9月单月净开1600+/1200+家，估值回落至配置窗口） - 古茗（短期利空出清在即，Q3同店增速环比改善，10月中旬27年开店指引可期） - 比音勒芬（抖音9月继续高增并进一步提速，男装品牌中唯一亮点） 白酒/食饮： - 茅台（飞天维持1730元，量价/开瓶/渠道利润均良性，α最突出） - 今世缘（Q2-3业绩率先回正，区域酒α标的） 红利/防御： - 山东高速、皖通高速、粤高速A、宁沪高速H、招商港口、青岛港（红利资产接连创新高，长期底仓配置） 🔥 核心四：宏观与策略——FOMC年内或再加息一次，美债利率上行不改AI主线 核心逻辑： FOMC九月纪要显示全体与会者支持加息25bp至3.75%-4%，多数认为年内再次加息\"可能合适\"但将依赖数据、持开放态度。高盛预计12月实施第二次加息，但也认为FOMC最终判定无需进一步收紧的概率很大。9月PMI重返扩张区间（50.1%），全球制造业PMI进一步回升，韩国9月出口大超预期至83.5%、AI链贡献9成增量。美债方面，30年期收益率升至5.7%为2002年以来最高，但纳指仍创新高，5.3%美债收益率未能压制AI主线。策略上，\"最硬的矛-AI+最厚的盾-红利\"配置组合延续。 重点关注标的： 策略方向： - AI硬件龙头（美股GPU/光模块/服务器全线新高，A股科技节后补涨逻辑成立） - 低估值+强增长+现金回报（华创\"真金组合\"筛选集中于有色化工及科技制造） - 高股息红利（A股底部4%股息、港股6%左右，加息环境下防御价值凸显） 🔥 核心五：周期资源——猪周期反转临近，染料主升浪启动，集运淡季不淡 核心逻辑： 猪周期方面，消费旺季猪价不涨反跌，养殖行业现金流亏损已持续7个月，三季度以来产能去化明显加速，预计本轮去化延续到明年上半年，能繁母猪累计去化幅度或超10%，养殖大周期反转可期。染料行业进入主升浪，分散染料中间体还原物价格上调至18万，头部企业Q3业绩环比50%以上增长，后续逐季度业绩持续提升（复刻制冷剂路径）。集运方面，Q4淡季运价期货大涨48%-82%，Q3运价同比涨幅从Q2的33%扩大至95%，欧美库存周期上行叠加高油价，需求高增长预计延续到2027年底。SAF（可持续航空燃料）受益油价上涨，越来越多国家强制添加。 重点关注标的： 猪周期： - 牧原股份、温氏股份（养殖大龙头，产能去化加速背景下反转逻辑强化） 染料化工： - 浙江龙盛、闰土股份（分散染料龙头，中间体格局优化驱动价格破历史新高6万预期） 集运/油运： - 中远海控（集运Q4淡季不淡，运价期货大涨验证周期复苏） - 招商轮船、中远海能（油运VLCC即期运价全面爆发，大小船运价螺旋上涨） SAF/绿色能源： - 朗坤科技（UCO-SAF高景气，受益油价上涨+欧盟强制添加2%政策） ⏰ 近期催化日历 - 10月中旬：古茗27年开店指引交流、三季报密集披露窗口期开启 - 10月底-11月初：日韩MLCC厂Q3业绩发布（预计bb ratio创新高） - 10月29日：美国FCC投票表决禁止中国实验室测试电子设备（2028年12月生效） - 11月3日：美国中期选举 - 11月18-19日：APEC深圳峰会（可能时隔9年再次举行中美俄最高层会议） - 12月（预期）：美联储年内第二次加息窗口 - Q4：风电海风国内外边际催化密集，德国风能展后续订单落地可期 - 27年H1：猪周期产能去化延续，养殖大周期反转临近 策略提示一： 混沌期做简单题——逻辑一听就懂的品种优先，逐步削弱三季报因子（高关注标的预期已price in），增强中期产业趋势品种。成交额没起来之前，边际变化是内部资金腾挪最重要抓手。 策略提示二： 最硬的矛（AI硬件）+最厚的盾（红利）配置组合不变。A股科技自信需要重建——美股光互联龙头假期涨超15%创新高，A股对应标的因FCC传闻大跌，正是\"拨乱反正\"的布局窗口。 策略提示三： 关注PMI回升+全球制造业共振信号。9月中国PMI重返扩张区间，韩国出口超预期，欧美PMI共振向上，库存周期上行预计延续至2027年底，周期+出口链弹性可期。#文字观点", "publish_time": "2026-10-08 22:08", "tags": ["文字观点"]}, "post:2026-10-08T15-12:4d658c570697": {"id": "post:2026-10-08T15-12:4d658c570697", "kind": "post", "title": "2026-10-08 15:12", "source_label": "帖子正文", "excerpt": "【天风通信】光芯片板块下跌点评：光芯片景气度延续，将中国光芯片公司排除在外并不现实事件：受大摩FCC报告的影响，今天光芯片板块整体出现下跌。展望后续，光模块未来需求仍然保持快速增长，光芯片EML、CW的供应仍然面临一定程度的紧张，中长期看NPO、CPO、OIO等技术也离不开光芯片，未来将中国光芯片公", "content": "【天风通信】光芯片板块下跌点评：光芯片景气度延续，将中国光芯片公司排除在外并不现实事件：受大摩FCC报告的影响，今天光芯片板块整体出现下跌。展望后续，光模块未来需求仍然保持快速增长，光芯片EML、CW的供应仍然面临一定程度的紧张，中长期看NPO、CPO、OIO等技术也离不开光芯片，未来将中国光芯片公司排除在北美供应链外并不现实，因此我们坚定看好光芯片的投资机会。首先，FCC目前并未发布正式文件，报告相关内容仅为大摩通过专家交流所形成的政策预期，正式文件内容未必会和报告保持一致。其次，政策预期从下一代3.2T产品开始，并未涉及目前的800G和1.6T产品，并不影响国内光芯片公司目前的产品供应和高速增长。未来将中国光芯片公司排除在北美供应链外并不现实，海外光芯片公司的产能供应并不能满足客户需求，国内亦可通过磷化铟衬底出口进行反制。光芯片需求目前整体仍然较为紧张，且扩产周期较长，海外公司扩产较为保守，主要集中在EML和CPO/NPO用UHP上，且NPO、CPO所用更高功率CW光源的良率更低、单晶圆产能更少（芯片尺寸变大），缺口或扩大。此外，Scale-up打开增量空间，未来光芯片需求会更大。因此，未来如果将中国光芯片公司完全排除在北美供应链之外并不现实。地缘政治博弈或加速中国光芯片公司产能的全球化布局。国内光芯片公司的出货量占比持续提升，且越来越被北美CSP客户认可，目前扩产基本集中在国内，出于供应链安全的考量，未来北美CSP客户可能会要求中国光芯片公司进行海外产能布局，以规避地缘政治博弈的影响，国内光芯片龙头源杰科技此前已在美国进行产能的前瞻布局。 ☎天风通信 🥇王奕红/康志毅*/张建宇*/唐海清#文字观点", "publish_time": "2026-10-08 15:12", "tags": ["文字观点"]}, "attachment:files/摩根大通-华盛顿笔记：中美生物科技竞争动态.pdf": {"id": "attachment:files/摩根大通-华盛顿笔记：中美生物科技竞争动态.pdf", "kind": "attachment", "title": "摩根大通-华盛顿笔记：中美生物科技竞争动态", "source_label": "摩根大通", "excerpt": "Dynamics in the US / China Biotech RaceNotes from DC Earlier this week, we attended a policy workshop in Washington, DC, hosted by a bipartisan think tank on US / China dynamics in", "content": "Dynamics in the US / China Biotech RaceNotes from DC Earlier this week, we attended a policy workshop in Washington, DC, hosted by a bipartisan think tank on US / China dynamics in biotech. We actively engaged with the key stakeholders in the sector during the workshop. Here are our key takeaways NSCEB - 3 Years to Act: The analysis from April 2025 ( link) and subsequent 2026 follow-up ( link), published by the National Security Commission on Emerging Biotechnology (NSCEB) for Congress, outlined the action plan needed for the biotech sector in the US to remain competitive amid the rise of China’s biotech industry. In the report, the NSCEB warned that policymakers Speed, Quality, and Cost : The advantages of China’s biotech innovation are speed, quality, and cost, which are particularly important for SMid biotech companies that are trying to stay ahead with limited capital. The focus on China’s 5 Year Plan : China’s recently released five-year plan through 2030 signals a strong commitment to biotech (see note from Yang Huang). What was also striking about the plan were its quantitative goals, such as capturing 25% of global FICs and developing five or more domestic products into global blockbusters. China’s commitment to biotech hubs and parks in regions such as Suzhou and the Greater Bay Area, as well as scale-up, has also been relatively impressive in recent years. It is estimated that China currently accounts for roughly 45% of pharma APIs, compared with India at ~43%. In contrast, in the 1980s, the EU and the US led the race, controlling Considering Reshoring / Friendshoring : Under the hood of the BIOSECURE Act, there remains clear consideration of reshoring or friendshoring manufacturing regardless of modality. For certain modalities, such as cell therapy, onshore capacity remains the way to go given the personalized nature of the treatment and its proximity to patients. T he BEDROCK Act ( link) was recently introduced to the House in late August that aims to map out the supply chain and vulnerabilities as an attempt to address Inspection Hurdles in US vs. ROW : The risk of potential US approvals getting caught up in regulatory inspections is far greater, given the agency’s requirement to conduct pre-approval inspections. As a matter of fact, approximately 70% of CRLs are estimated to be related to PAI issues. In other countries, PAI is not part of the approval process as long as the site is operating under GMP. The FDA has recently rolled out the PreCheck Pilot Program (link See page 2 for analyst certification and important disclosures.), but it is limited to new facilities.•this. •close to 90% of global APIs.•China’s CDMO s 8日获得资金关注。产业含义可分为两条线:其一是研发与临床端,光遗传技术 用于神经环路的精准调控,其临床转化方向包括视网膜疾病致盲治疗等,国内已有创新基金孵化的相关管线 推进海外授权;其二是科研工具端,药物研发前的实验室环节需求已经存在,包括光遗传腺相关病毒现货载 体、用于光遗传研究的工具鼠与基因修饰动物模型等,相关企业的订单依赖科研项目开展,不分享药品知识 产权。此外,具备非人灵长类动物模型平台的合同研究组织可承接光遗传技术定位神经环路之后的中枢神经 新药毒理试验与环路验证评价业务,其上半年在手订单约37亿元、同比增长60.9%,新签订单约20.2亿元、 同比增长98.0%,订单能见度持续提升。需要区分的是基金投资与研发服务属两条线,具体管线是否委托仍 需订单证据。 03 资金与龙虎榜 3 个主题 [热度第12] [中性] [均-0.19%] 10月8日龙虎榜:光通信与算力硬件遭机构集中卖出,电池与航运获资金承接 10月8日全市场龙虎榜共66只个股,资金在光通信与顺周期方向之间呈现明显的多空分歧。卖出侧集中在算 力硬件:东山精密当日获机构席位买入合计约14.04亿元、卖出约10.34亿元,为当日成交额最大的上榜个 股;源杰科技买入约15.18亿元、卖出约18.59亿元,净卖出约3.41亿元;长光华芯净卖出约3.09亿元;仕 佳光子买入约10.87亿元、卖出约9.52亿元。买入侧则集中在电池与航运等顺周期方向:圣阳股份净买入约 1.89亿元,龙蟠科技净买入约1.14亿元,国轩高科净买入约0.48亿元,丰元股份净买入约0.48亿元,山东 墨龙净买入约0.78亿元,领湃科技净买入约0.77亿元。这一结构说明资金正在从高估值算力硬件向具备政 策催化与涨价逻辑的顺周期方向再平衡,龙虎榜机构席位的方向性比绝对金额更具参考价值。需要说明的 是,龙虎榜数据本身滞后且样本集中于交易活跃个股,仅可作为结构性线索。 [热度第13] [中性] [均-0.83%] 央行开展1.2万亿元买断式逆回购,财政部发行1500亿元金融机构注资特别国债 流动性层面的两项操作在10月8日同步落地。公开市场方面,央行以固定数量、利率招标、多重价位中标方 式开展12000亿元3个月期(89天)买断式逆回购操作,到期日2027年1月5日;当日另有8335亿元隔夜逆 回购、2810亿元7天逆回购、1000亿元14天逆回购与10000亿元买断式逆回购到期,并开展6060亿元隔 夜逆回购操作,当日实现净回笼4085亿元,其中3个月期买断式工具实现净投放2000亿元,体现跨季后的 中期流动性呵护意图。财政端,财政部于10月8日发行2026年中央金融机构注资特别国债(一期),为5年 期固定利率附息债、竞争性招标面值总额1500亿元,专项用于补充金融机构资本金、夯实风险抵御能力, 直接缓解了市场对银行资本充足率与信贷投放能力的担忧。两项操作的共同指向是信用扩张与实体经济支持 的延续:中期流动性投放压降资金利率波动,特别国债注资提升银行扩表能力,对券商与银行的负债端成本 构成正面支撑。 [热度第14] [中性] [均-1.42%] 9月股票型ETF净回流451亿元,节后20只新基金集中开启认购 节后增量资金的来源在长假末尾获得数据佐证。存量端,9月股票型交易型开放式基金逆势回流451亿元, 资金并非离场而是在方向之间切换,反映机构资金在调整中承接的特征。增量端,公募发行在节后迎来小高 峰:10月8日当日有20只产品集中开启认购,本月拟发行新基金合计96只、权益类产品占据主流,其中偏 股混合型与被动指数型数量最多;国庆节后另有ETF新品陆续上市与建仓,两类资金合计入市规模约300亿 元。主题分布上科技成长方向最为集中,覆盖科创板芯片设计、人工智能、软件开发与自动化设备等领域, 红利与价值风格同步升温。需要提示的是,第三季度新基金发行整体呈现数量增加、份额下降的结构特征, 增量资金的绝对体量仍需第四季度持续验证。对市场结构而言,ETF资金的逆势申购与主动权益的建仓节 奏,是判断调整性质的重要观察窗口。 04 回调与风险 6 个主题 [热度第15] [风险] [均-20.00%] 海外投行3.2T光模块研报引发情绪波动,光芯片环节估值承压 国庆假期后首个交易日,国产光芯片环节遭遇集中抛售,直接诱因是摩根士丹利于10月1日发布的研报:该 行提出美国联邦通信委员会未来可能对光模块采取限制措施,一种潜在方案是若光模块物料清单中至少65% 的价值来自美国企业,便可能获得进口限制豁免,且限制可能主要从下一代3.2T高速光模块开始实施、而非 直接针对当前的800G与1.6T产品。需要在逻辑上做三点厘清:一是研报中的不少内容属于分析师基于其他 行业规则的情景推演,并非正式文件,长光华芯方面指出报告并非正式 ,以及人工智能服务器整机排产是否维持在指引水平;若整机排产 不及预期,价格传导链条可能出现阶段性停滞。 [热度第20] [风险] [均-3.50%] 中国香港市场大模型与半导体方向调整加深,恒生科技指数创阶段新低 10月8日中国香港市场的调整结构比指数跌幅更为剧烈。恒生指数收报23785.79点、回落1.43%,恒生科 技指数回落2.89%、创2024年9月以来新低,大市成交额2072.55亿港元。板块层面,大模型方向领跌, 两家大模型公司分别回落超过13%与7%;半导体方向普跌,中芯国际与澜起科技回落超过6%,晶圆代工与 存储模组方向回落7%至9%;光通信与PCB概念同步走弱,光芯片与光电封装环节回落超过13%、覆铜板与 光纤光缆环节回落超过6%。驱动因素有三:一是长假期间恒生指数累计回落约1.96%、恒生科技指数累计 回落约1.40%,调整在节后首日集中释放;二是海外长端收益率处于二十年高位,对高久期科技资产形成持 续压制;三是大模型公司的资本化与出海叙事进入业绩验证期,短期定价更多由流动性与情绪主导。对A股 的映射需区分环节:半导体与光通信的情绪联动性最强,而AI硬件更多受海外资本开支与订单验证影响。 05 结构机会 6 个主题#文字观点", "publish_time": "2026-10-08 23:17", "tags": ["文字观点"]}, "post:2026-10-08T19-36:fe1bd327be61": {"id": "post:2026-10-08T19-36:fe1bd327be61", "kind": "post", "title": "2026-10-08 19:36", "source_label": "帖子正文", "excerpt": "【261008-市场波动点评】 高景气重仓方向遭遇预期冲击，成为今日市场调整的直接诱因。北美AI供应链是当前少有的兼具高景气与机构重仓特征的领域，节日期间海外市场围绕FCC规则的猜测，引发相关公司今日开盘后集中下挫、多股跌停。", "content": "【261008-市场波动点评】 高景气重仓方向遭遇预期冲击，成为今日市场调整的直接诱因。北美AI供应链是当前少有的兼具高景气与机构重仓特征的领域，节日期间海外市场围绕FCC规则的猜测，引发相关公司今日开盘后集中下挫、多股跌停。与此同时，部分创新药代表性公司的海外合作方股价在假期大跌，也带动国内板块调整。科技与创新药两条重要主线同时承压，严重挫伤市场情绪。但需要区分，政策猜测不等于限制已经落地，海外合作方的股价波动也不等于国内公司基本面发生同等变化。 主动定价资金的腾挪空间受限，使局部波动更易扩散。当前具备主动定价能力的机构资金，较大部分仍重配科技。核心持仓因预期变化急跌甚至跌停，会在一定程度上“锁住”这批资金：既难以顺畅调仓，也会因净值回撤而收缩风险预算、降低买入力度，必要时还需卖出其他资产补充流动性。因此，科技下跌并不意味着资金会立即流向其他板块，同时其他板块也面临一定的承接约束。今日午后的跌势扩散，我们认为已体现出一定的交易性流动性压力，不宜简单归因于各行业基本面的同步恶化。 中期资金面的担忧，正在压过短期三季报的业绩支撑。海外高利率、油价带来的通胀与潜在加息压力，以及未来半年多的限售股解禁压力，共同强化了投资者对后续资金供求的顾虑。市场关注的已不只是三季度盈利能否兑现，更是这些盈利应给予什么估值、后续有多少资金愿意承接。解禁并不等于实际减持，但对潜在供给的担忧已经影响当下的风险偏好。在这一阶段，部分行业的高增长仍不足以立即抵消资金面预期转弱带来的估值压力。 一轮市场出清后，我们认为四季度仍存在进攻窗口，配置上以“能化+AI”为主，同时关注创新药、银行和煤炭。短期的剧烈调整实际上反而减轻了三季报兑现前后的博弈，不必将流动性冲击直接外推为四季度机会的结束。能化侧重供需格局与盈利兑现，AI侧重新技术、新催化等机构持仓较轻的方向，创新药关注海外扰动消化后、核心管线与商业化逻辑未变的优质公司，银行和煤炭则关注基于现金回报的配置价值。 欢迎联系A股策略团队：裘翔/高玉森/张铭楷/陈泽平/陈峰/朱立伟/陆天一/许元睿/李世豪#文字观点", "publish_time": "2026-10-08 19:36", "tags": ["文字观点"]}, "post:2026-10-08T12-15:8302bb68a1df": {"id": "post:2026-10-08T12-15:8302bb68a1df", "kind": "post", "title": "2026-10-08 12:15", "source_label": "帖子正文", "excerpt": "【上午板块梳理】 一，盘面最强主线：锂电 映射下，PCB/CCL领涨，带动景气持续上行。", "content": "【长江电新】铜箔板块推荐更新1007：涨价&升级共振，景气延续上行 1、#HVLP铜箔迎来「涨价+升级+利空落地」三因子共振、利润弹性有望放大。假期海外市场AI硬件表现强劲，在缺料潮的集中映射下，PCB/CCL领涨，带动景气持续上行。一方面，FCC制裁利空落地，结果比悲观预期温和许多；另一方面，10月AI材料开启新报价，铜箔升级路线清晰，涨价&升级共振，有望进一步放大利润弹性。此外，CPO新技术替代风险最早预计29-30年，担忧已充分定价。 2、#锂电铜箔涨价从''预期''走向''兑现''：后续持续可期、盈利弹性可观。头部客户锂电铜箔涨价已然落地，幅度1–2k，本月开始执行，后续或将持续落地涨价。一方面，锂电铜箔具备高营运资本占用、重资产双重属性，前期扩产停滞致使行业供需趋紧；另一方面，近期涨价落地下，价格弹性正在兑现，而增量资金更倾向于投向高附加值的高端电子箔，进一步放大供需矛盾。 3、#配置主线：HVLP&载体＞锂电铜箔＞设备及其他#AI期权驱动：假期市场偏好提升，高景气有望估值修复，关注德福（量利弹性）、铜冠（确定性）、方邦（载体铜箔）。#锂电：头部涨价落地，Q4单吨盈利提升至4-5k，考虑进一步涨价，个股基本在27年10-12X左右，关注嘉元、诺德、 中一、海亮的业务延伸和结构变化。#设备：泰金新能（装备集采+订单增长）。#文字观点", "publish_time": "2026-10-08 08:39", "tags": ["AI期权驱动", "锂电", "设备", "文字观点"]}, "attachment:files/摩根大通-人形机器人实地考察后核心要点.pdf": {"id": "attachment:files/摩根大通-人形机器人实地考察后核心要点.pdf", "kind": "attachment", "title": "摩根大通-人形机器人实地考察后核心要点", "source_label": "摩根大通", "excerpt": "Key takeaways post site visitHumanoid We recently had the opportunity to meet the management team of Humanoid, tour the facilities and discuss the tech milestones the firm is looki", "content": "Key takeaways post site visitHumanoid We recently had the opportunity to meet the management team of Humanoid, tour the facilities and discuss the tech milestones the firm is looking to deliver in the medium term. Overall, we came out positively surprised with the progress the firm has made so far and during the day, we had the chance to tour different activities the wheeled humanoids were carrying out across picking and sorting activities which could be deployed in industrial, automotive environments as well as Humanoid, founded in 2024 and headquartered in London, is a UK-based startup focused on developing advanced humanoid robots for automation in industrial, logistics, and retail environments. The company’s flagship product, the HMND 01 Alpha, is a 220 cm tall robot with 29 degrees of freedom, featuring a modular design that allows for both wheeled and bipedal configurations. Capable of speeds of up to 7.2 km/h and handling payloads of up to 15 kilograms, HMND 01 Alpha is targeted for commercial deployment by late 2026. Humanoid’s mission is to address labor shortages by automating repetitive and hazardous tasks with intelligent, safe robotic solutions. The company’s technology stack is built around AI-driven, end-to-end reasoning and proprietary simulation-based training, enabling rapid adaptation to complex environments. Humanoid operates under a Robots-as-a-Service (RaaS) business model, providing flexible automation solutions to clients without the need for upfront capital investment. Notably, the prototype in just seven months, positioning itself as an agile and innovative player 1. Bosch Partnership: A key step towards scaled manufacturing –Following our site visit to Humanoid, we view the Bosch partnership as a cornerstone for Humanoid’s manufacturing and n roadmap. As disclosed by the companies, in March 2026 Humanoid and Bosch ran a proof-of-concept within See page 4 for analyst certification and important disclosures, including non-US analyst disclosures.Bosch’s logistics operation in Bühl, Germany, where HMND 01 robots moved in the emerging humanoid robotics market.company claims an accelerated development cycle, moving from concept to logistics and services. Jose M Asumendi AC (44-20) 7742-5315 jose.m.asumendi@jpmorgan.com J.P. Morgan Securities plc Piyush Singla (91-22) 6157-3324 piyush.singla@jpmorgan.com Sam Edmunds - Specialist Sales - European Industrials (44-20) 7742-8733 sam.edmunds@jpmorgan.comSpecialist Sales contact details:J.P. Morgan India Private LimitedEuropean Autos & Auto PartsJ P M O R G A N28 September 2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Jose M AsumendiAC (44-20) 7742-5315Europe Equity Research boxes from conveyors to trolleys while handling varying box sizes, weights, and positions. After the trial, Bosch became Humanoid’s contract manufacturing partner for HMND 01 robots serving the European market, and Bosch is also contributing Design for Excellence (DfX) support, spanning hardware design, y, reliability, supply chain and cost optimisation. The companies have also indicated they are exploring the incorporation of In our view, the strategic significance goes beyond a typical customer/vendor relationship. We believe Bosch can help address one of the most difficult execution risks for early-stage robotics companies – transitioning from prototype deployments to repeatable, scalable production – by pairing manufacturing capabilities with structured DfX and supply-chain 2. Schaeffler: Components and major robot deployment player – We view the Schaeffler relationship as unusually broad given that it spans supply, co-development and end-customer deployment. As outlined by the companies, Schaeffler is developing/supplying actuators for Humanoid robots, is set to become the preferred actuator supplier for Humanoid’s wheeled systems, and is planning to deploy hundreds, potentially rising to a four‑digit number of Humanoid robots across its global manufacturing footprint. Schaeffler is also working with Humanoid on robot-specific data collection and AI skill development, with initial beta deployments planned for 2026-27 and later rollouts potentially incorporating In our view, this two-way structure could create a meaningful operating feedback loop, with components going into the platform, robots into factories, and real-world data back into product iteration, which we believe may accelerate robustness and scalability if executed 3. Siemens: Industrial logistics testing –We view Siemens as an important industrial validation venue, particularly in logistics and factory automation workflows. Humanoid and Siemens have completed a proof of concept using an HMND 01 wheeled robot in a Siemens facility, where the robot executed a repetitive logistics sequence (storage stack → pick tote → transport → conveyor → repeat). Humanoid has 3cstrong>AI算力/大模型\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：美股AI硬件独立走强，AI资本开支趋势未改；模型迭代与投入不减，Agent商业化持续兑现；国内大模型融资与模型升级支撑能力追赶。\u003c/li>\n\u003cli>今天出现的催化/验证：英伟达追加1500亿美元回购并发布开源Agent安全；谷歌发布Gemini 4 Argon；阿里、智谱分别完成约800亿港元、50亿美元融资，腾讯加大海外算力采购；MiniMax 7月Token消耗量达1月20倍；纳指创收盘历史新高。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：存储持续走强，扩产消息对估值影响先于价格，但设备与材料环节订单能见度更长；HBM与服务器DRAM合约价仍在环比上行。\u003c/li>\n\u003cli>今天出现的催化/验证：全球半导体2026年8月WSTS追踪数据环比增长23.3、好于历史同期9.7，同比增158；三星电子Q3营业利润107.40万亿韩元，同比+783%、环比+20%，首次突破单季100万亿韩元；Terafab由特斯拉与SpaceX于2026年3月启动，落地得州Grimes County，初期投资约168亿美元，多期总盘子估至200亿至550亿美元，规划月投片100万片、年产1000亿至2000亿颗定制AI与存储芯片，管理层披露存储是订单增长最大来源、清洗设备贡献最大绝对订单额、电镀设备增速最快。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：AI大集群带宽爆发下“铜墙”效应逼近物理极限，光互连从机架间向芯片封装级渗透，NPO/CPO将与铜互连长期并行；CPO测试代表全新重要市场机遇，行业生态保持分散。\u003c/li>\n\u003cli>今天出现的催化/验证：假期美股光互连板块率先演绎景气，Lumentum、Coherent区间累计涨幅均超15%，AAOI +31.1%、Ciena +26.1%、Coherent +17.6%、Lumentum +16.7%；东山精密回应FCC监管电话会，称光模块交付与PCB增长两条主线，1.6T可能维持较长生命周期，光芯片外售下一年度有部分EML销售但占比不会特别大，未来更倾向CW，并与NPO、CPO发展联系；光芯片板块下跌点评认为光芯片景气度延续，将中国光芯片公司排除在外并不现实。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：AI PCB上游材料全链条提价，电子树脂与覆铜板量价齐升；PCB国庆几乎不停工、订单排到明年1月，电子布10月如期涨价，铜箔迎来涨价+升级共振，算力硬件景气度仍在加速通道。\u003c/li>\n\u003cli>今天出现的催化/验证：建滔积层板本年度已发布多轮CCL涨价通知，南亚塑胶自9月起上调产品价格，涨价效应向下游全面传导；德福科技9月HVLP出货持续增长、HVLP4占比提升、年底目标进一步上调、四代产品爬坡明显加快、RTF保持稳定出货；英伟达NVL576材料测试微调，测试以碳氢树脂为主的无布CCL搭配HC无布PP，取代此前测试的PTFE无布CCL，评估能否满足预计2H27量产的Rubin Ultra NVL576 switch tray PCB需求。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>固态电池/新能源\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：固态电池仍是中外能源领域竞争关键，工信部等七部门《新型电池产业发展“十五五”规划》提出到2030年全固态电池初步实现规模化应用、长寿命锂电池循环寿命达1.5万次等目标；美国储能需求超预期，技术路线多点突破。\u003c/li>\n\u003cli>今天出现的催化/验证：9月松下宣布将于26Q4交付固态电池样品，三星SDI宣布面向人形机器人开发的固态电池目标27年下半年量产；美国储能方面，预计年装机未来五年增长50%+，2031年累计207GW/715GWh，2Q26创纪录装机5.4GW/18.9GWh，平均时长2.8→3.5小时；风电2026年前三季度累计核准728个、总装机114.9GW，Q3核准37.8GW，10月1日蒙能1.15GW风机开标22.8亿元，三一、电气风电、明阳三家中标。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>机器人/Physical AI\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：Physical AI产业加速进入；AI制药需要全天候机器人实验系统，通过大规模自动化实验持续生成生物学数据。\u003c/li>\n\u003cli>今天出现的催化/验证：AMD宣布约82亿美元收购李飞飞创立的World Labs；AI制药公司Isomorphic Labs正在筹集新一轮融资，估值至少达400亿美元，可能高达500亿美元；礼来CEO估计人类目前可能只理解了10%-15%的生物学知识，可能需要提高到50%以上，AI才有望可靠处理更复杂生物系统预测任务；各方在资金、数据、算力与技术上的投入合计高达18亿美元。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>A股节后首日放量调整：上证指数收报3811.90点、回落30.29点或0.79%，盘中最低3795.37点；深证成指收报12620.90点、回落262.92点；双创指数同步回落。\u003c/li>\n\u003cli>北美AI供应链受FCC规则猜测冲击：高景气重仓方向遭遇预期冲击，相关公司今日开盘后集中下挫、多股跌停。\u003c/li>\n\u003cli>FCC政策预期细节：专家交流形成的预期称FCC可能约束中国产3.2T光模块，最早或2026年10月启动，采用分阶段落地模式；只要BOM里美国含量≥65%，中国组装的模块仍可进口。\u003c/li>\n\u003cli>东山精密回应FCC监管电话会：光模块交付与PCB增长两条经营主线；市场担心美国对光模块提出新物料来源要求；管理层认为1.6T可能维持较长生命周期；光芯片外售下一年度预计有部分EML销售，但占相关总体销售收入比重不会特别大，未来外售更倾向于CW，并与NPO、CPO发展联系起来；PCB也在争取更大增量。\u003c/li>\n\u003cli>海外AI硬件催化：英伟达追加1500亿美元回购并发布开源Agent安全；谷歌发布Gemini 4 Argon，以100万输出token、15%低幻觉率、便宜80%定价主攻长周期工作流；美股光互连龙头领涨，纳指创收盘历史新高。\u003c/li>\n\u003cli>国内AI融资与升级：阿里、智谱分别完成约800亿港元、50亿美元融资，腾讯加大海外算力采购；MiniMax披露7月Token消耗量达到1月的20倍；智谱接入海外云。\u003c/li>\n\u003cli>宏观与流动性：2026年9月制造业PMI、非制造业商务活动指数和综合PMI产出指数分别为50.1%、50.2%和50.7%，较上月上升0.3、1.2和1.2个百分点；央行10月8日开展12000亿元3个月期买断式逆回购操作、当日净回笼4085亿元；财政部发行2026年中央金融机构注资特别国债（一期）1500亿元，5年期固定利率附息债。\u003c/li>\n\u003cli>产业数据：PCB国庆几乎不停工、订单排到明年1月，电子布10月如期涨价，铜箔涨价+升级共振；固态电池政策目标2030年全固态电池初步规模化应用；美国储能2031年累计207GW/715GWh；油运VLCC中东湾外线运价再达80w+，西非/拉美线破70w，期租租金全面爆发。\u003c/li>\n\u003cli>消费与医药：国庆假期10月1日至7日累计全社会跨区域人员流动量21.44亿人次，日均3.06亿人次，同比+0.7%，累计铁路客运量预计同比+13.1%；白酒国庆延续中秋微降，高端礼赠与100元大众价格带相对稳健，次高端商务宴席仍弱；食品饮料9月双节备货边际改善，健康食品、速冻品类亮眼；假期恒生医药下跌2.1%，港股CXO下跌0.7%；艾力斯FURVENT研究未达到主要终点，240mg剂量组vs化疗组mPFS为11.0 vs 9.5个月，HR=0.75，p=0.0654，cORR为60% vs 33%；2026年诺贝尔生理学或医学奖授予光遗传学领域，A股医药链相关布局在10月8日获得资金关注。\u003c/li>\n\u003cli>油运与地缘：伊朗伊斯兰革命卫队司令顾问纳格迪10月7日表示霍尔木兹海峡已经关闭，伊朗将封锁该海峡的“非法航道”，这一状态将持续到其合法诉求得到满足为止；受美伊冲突反复影响，油运费用持续上涨。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>FCC规则是否落地及范围：3.2T光模块BOM美系含量65%限制传闻最早或2026年10月启动、分阶段落地；跟踪对800G/1.6T与3.2T影响差异，以及中国光模块、光芯片公司订单与交付。\u003c/li>\n\u003cli>AI硬件订单与材料涨价：PCB订单排到明年1月、电子布10月涨价、铜箔涨价+升级共振能否延续；英伟达NVL576 2H27量产测试中碳氢树脂无布CCL进展；光芯片EML、CW供应紧张与NPO/CPO/OIO技术推进。\u003c/li>\n\u003cli>模型商业化与融资：Opus 5.5发布约一周后在Anthropic模型支出和Token份额中均居首；智谱接入海外云；豆包商业化、个人Agent Muse影响、国产大模型新一轮升级潮。\u003c/li>\n\u003cli>半导体资本开支与存储：Terafab多期投资与月投片100万片目标；HBM与服务器DRAM合约价环比上行；设备与材料环节订单能见度。\u003c/li>\n\u003cli>国内宏观流动性与政策：央行买断式逆回购、特别国债发行、PMI后续；节前一周ETF净流入约330亿是否延续，节前缩量节后放量能否成为行情助推力。\u003c/li>\n\u003cli>新能源：新型电池产业发展“十五五”规划落地、固态电池样品交付与量产目标、美国储能装机、风电招标价格拐点。\u003c/li>\n\u003cli>油运/地缘：霍尔木兹海峡关闭状态与美伊冲突，VLCC运价与期租租金。\u003c/li>\n\u003cli>医药：三季度业绩关注；光遗传学产业关注；第二届亚洲医疗CDMO大会要点显示需求持续性驱动资本支出重启加速。\u003c/li>\n\u003cli>机器人：AMD收购World Labs后Physical AI；人形机器人实地考察要点；AI制药融资与机器人实验系统。\u003c/li>\n\u003cli>液冷/电源：新加坡Data Center World展会纪要确认电力是唯一主题；BBU、CBU、800V直流、正负400V直流、固态变压器逐步落地应用；全球在运IT负载约80GW，在建+已承诺管线约150GW。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>00:12｜【国庆假期出行数据】交通 预计国庆假期（10月1日至7日），累计全社会跨区域人员流动量21.44亿人次，日均3.06亿人次，同比（2025年中秋国庆假期8天日均，下同）增长0.7%。其中：累计铁路客运量预计同比增长13.1%\u003c/li>\n\u003cli>00:12｜[第1] 纳指创收盘历史新高，5.3%美债收益率与四年新高服务价格未能压制AI主线 10月5日(周一)美股三大指数集体收高：道指上行0.18%报51267.90点，标普500上行0.66%报 7773.95点，纳指上行1.05%报27477.31点、创收盘历史新高(盘中最高27544.07点)。标普十一大板块 十涨一跌，材料与通信服务居前(分别上行1.22%与1.14%)，房地产是唯一下跌板块(-0.44%)。\u003c/li>\n\u003cli>00:13｜艾力斯FURVENT研究进展简评 10月6日，艾力斯海外合作伙伴ArriVent公布伏美替尼一线治疗EGFR20外显子插入突变NSCLC的全球III期FURVENT结果：240mg剂量组vs化疗组，盲态独立中心BICR评估mPFS为11.0vs9.5个月，HR=0.75，p=0.0654，研究未达到主要终点；cORR为60%vs33%。\u003c/li>\n\u003cli>00:13｜【东吴电子陈海进】海外龙头国庆领涨，CPO+NPO+O产业逻辑持续夯实 事件：国庆A股休市窗口期，美股光互连板块率先演绎景气行情，核心龙头Lumentum、Coherent区间累计涨幅均超15%，跑出显著超额。Marvell投资者日明确指出，AI大集群带宽爆发下\"铜墙\"效应已逼近物理极限，光互连正从机架间向芯片
