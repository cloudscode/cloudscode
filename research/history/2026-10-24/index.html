27年基本面实质上已被\"锁死\"。 违约退出将触发相当于年需求价值50%–100%的罚金。从2028年起，供应增加与电力限制可能松动市场，但新LTA结构（固定量+有限价格上下限）有望保障底部利润率，至少高于市场悲观预期。 • 市场影响：短期冲击供应链情绪，但若存储行业能证明需求放缓时可自我调节供应，中期反而构成重大利好——尤其考虑到当前存储股估值已被极度压制。 情景四：融资失败（概率~5%，最具破坏性） • 触发条件：主要科技巨头债券或股权发行失败，潜在硬着陆或金融压力。 • 市场影响：系统性风险，但目前概率仍低。 ------ 二、AI公司CEO的取舍：算力优先于短期收入 尽管算力短缺，CEO们仍将稀缺计算资源优先分配给内部模型训练与研究，而非直接产生收入的云推理服务。当前研究算力不产生盈利，但他们在\"未来竞争力\"与\"近期回报\"之间选择了前者，代价直接体现在现金流上。 • Google（Sundar Pichai）：前沿模型算力优先于云收入；研究算力不可谈判，驱动\"递归自我改进\"；若无产能约束，云收入本应更高（1Q26）；Gemini 4训练消耗大量算力（2Q26）。 • Microsoft（Satya Nadella/Amy Hood）：若所有新GPU都投入Azure，增速本可超40%（2026年1月）；产能优先供给Copilot等内部产品。 • Meta（Mark Zuckerberg）：\"每位研究员的计算量\"是核心优势；产能预先建设，若超级智能延迟推出则转投广告推荐；已明确2027年激进投资。 • OpenAI（Sam Altman）：\"算力翻倍，收入翻倍\"的线性逻辑。 ------ 三、供需格局：买卖双方一致确认短缺延续至2027年之后 买方（超大规模云厂商）与卖方（台积电等制造商）从对立利益出发却得出相同结论：供应严重不足。明年投产的数据中心投资决策在2–3年前已定，而此后Agentic AI创造了新增需求，短缺持续加剧。10月完成的LTA谈判中，明年供应量与价格已反弹并锁定，剧烈短缺已成定局。 关键引述： • 台积电（魏哲家，10月15日）：AI需求仍超当前供应能力，正努力缩小缺口。 • Amazon（Andy Jassy，7月30日）：即便2026年capex上调至2200亿美元，仍无法满足2026–27年全部需求；2028年需求已被预订，规模惊人。 • Microsoft（Amy Hood，7月29日）：Azure需求持续超出可用产能，仍受产能约束。 • Alphabet（Anat Ashkenazi，7月23日）：在供应受限环境中运营，三季度正增加第三方产能。 ------ 四、现金流拐点已至：股东耐心成为关键变量 融资结构已从\"经营现金流覆盖\"切换至\"股权+债券融资\"模式。2025年经营现金流尚可覆盖capex；2026年起，新股与债券填补缺口，且回购暂停，股东直接承担成本——这对Alphabet和Meta而言是史上首次，叠加高利率环境，引发市场担忧。 • Alphabet：2Q26首次出现单季FCF为负（-59亿美元），2026E capex指引1950–2050亿美元。 • Meta：3Q26 FCF转负（-21亿美元），2026E capex指引1350–1450亿美元；2Q26发行249亿美元债券，年内零回购（去年同期回购262亿美元）。 • Amazon：TTM FCF为-76亿美元，2026E capex约2200亿美元。 • Microsoft：4Q26 FCF仍为正（196亿美元），但预计也将转负；FY27E capex约1750亿美元。 Meta董事会的回答具有标志性意义：在独立董事特别委员会一致推荐下，公司批准发行无投票权C类股（2027年1月生效），明确用于资助AI投资并保持创始人领导权。这是首个在股东压力下选择继续参赛并专门构建融资工具的案例，有力支撑情景一。 股东的\"囚徒困境\"：若所有人同步放缓，行业FCF将改善；若仅一家放缓，竞争对手将取而代之。在缺乏互信的情况下，均衡解是\"所有人继续\"。 为何协调放缓不可能：①无协调机制——这是一场全有或全无的博弈，涉及未来机遇与当前主业；②市场外竞争者（如中国公司）不受此类股东压力；③核心业务利润仍在增长（Meta广告、AWS、Azure等），现金流生成能力差异巨大，资产负债表最强者将胜出（类比历史铁路热潮）；④创始人控制——Meta和Alphabet的创始人拥有强投票权，外部股东难以改变航向。 ------ 五、电力瓶颈：下一个变量 在芯片之前若电力先告急，已产出的芯片将堆积为库存，需求被迫调整。延期已是现实：Sightline Climate调查显示2026年计划产能中30%–50%面临延期风险（2025年延期率为26%），高达11GW项目无任何施工迹象。但多数项目极可能在2027年上线，已超出市场预期；2028年及更远期的确定性则相对较弱。 • Nadella（Microsoft）：问题不在芯片，而在可插入芯片的建筑（暖壳），芯片最终可能变成库存。 • Pichai（Google）：电力、HBM、台积电及2000+组件相互交织，瓶颈随时可能出现。 • Jassy（Amazon）：计划到2027年底将电力容量较2025年翻倍。 野村观点：电力短缺将推迟并重塑芯片需求，而非消灭需求。 海外扩张地图： • 亚太（不含中国）：产能从2025年16GW增至2030年49GW，向柔佛、曼谷、吉隆坡等新兴枢纽转移；新加坡等成熟枢纽受电力与土地限制。 • 欧洲：从16GW增至38GW，北欧、西班牙、法国为增长市场；但成熟枢纽电力短缺、电网接入排队漫长、审批耗时。 • 印度：1H26新增258MW（+59% y-y），累计1.8GW，2030年预计超7GW；挑战在于可靠电力与土地获取。 • 中东（UAE/沙特）：至2030年合计新增至多3GW，首个200MW园区目标2026年；但存在物理攻击风险（2026年伊朗战争期间海外数据中心曾遭物理打击）及美国芯片出口审批风险。 ------ 六、投资启示 核心结论：存储超级周期的根基是AI竞赛的\"不可停止性\"。股东压力更可能放缓capex增速而非终止竞赛；真正能叫停竞赛的不是股东意愿，而是融资市场关闭——这是半导体需求最大的潜在下行风险，但尚非系统性风险，且闲置产能可被竞争对手或客户承接。 策略建议： • 做多存储超级周期：2027年供需已被LTA锁定，价格与量的下行保护强于市场预期。 • 关注电力瓶颈受益者：电力受限时，最新芯片与高容量HBM价值凸显，旧GPU替换需求可能涌现。 • 短期波动提供加仓窗口：市场对融资担忧的定价已从边际玩家开始，但需求侧基本面未变。#文字观点", "publish_time": "2026-10-24 20:39", "tags": ["文字观点"]}, "post:2026-10-24T21-07:03916da0c33c": {"id": "post:2026-10-24T21-07:03916da0c33c", "kind": "post", "title": "2026-10-24 21:07", "source_label": "帖子正文", "excerpt": "🌟【申万计算机】AI EDA从单点走向全流程！DeepSeek开源推理框架！", "content": "🌟【申万计算机】AI EDA从单点走向全流程！DeepSeek开源推理框架！20261024 ✨# AIEDA从单点辅助走向全流程智能体 10月2日，Synopsys与OpenAI宣布联合开发GPT-Synopsys，以“算力+模型+License”交付。 模型将直接操作EDA工具、解读时序与物理验证结果，围绕PPA目标自主迭代，人类工程师负责目标设定与审核。#核心看点Agent具备以PPA优化为导向的自主迭代能力，打通前端提效与后端PPA； 除License、Token外，按效果付费，或为AI应用在半导体行业的创新。 ✨# 华大九天加速补齐核心工具 近日，华大九天与芯行纪、奇捷科技、中科鉴芯、上海曼光签署战略合作协议。 分别对应数字EDA的布局布线、ECO逻辑优化、DFT，以及光电EDA的光器件与光链路仿真等关键环节。 合作重点是工具数据互通与流程串链，加速数字与光电EDA全流程布局。 ✨# DeepSeek开源DeepInfer 10月20日，DeepSeek开源推理框架及Token编解码组件，单集群吞吐155万亿Tokens/天，每卡每小时收入38美元（谷价）。 通过PD分离、专家并行、四套负载均衡与KV Cache长周期复用，在同等硬件下提升吞吐、优化成本。 推理降本与长上下文复用降低Agent开发门槛；官方适配昇腾950，减少国产算力迁移不确定性。 # 我们认为，工程优势扩散加快，纯API转售价差窗口或收窄，模型评价应回到加权售价、付费留存与单位任务贡献。 📥【近期周报】 1017：海外大模型ARR再讨论！液冷芯片级散热趋势！#小程序://申万宏源研究/v3I4rxEFcziFSFr 1009：海内外大模型厂商ARR讨论！2026Q3计算机业绩前瞻！#小程序://申万宏源研究/s4GuOn5vJAt0dSq 0930：AMD收购World Labs，物理AI平台化竞争加速！#小程序://申万宏源研究/LBXBgPBuPgvDAlh 0927：阿里云栖：模型、芯片、云-机器智能时代的三大基石#小程序://申万宏源研究/kRD9d1EwsFmaEzr#文字观点", "publish_time": "2026-10-24 21:07", "tags": ["核心看点", "文字观点"]}, "post:2026-10-24T20-39:132d4fb52b48": {"id": "post:2026-10-24T20-39:132d4fb52b48", "kind": "post", "title": "2026-10-24 20:39", "source_label": "帖子正文", "excerpt": "野村——全球机器人行业：具身智能的“ChatGPT时刻”渐行渐近 核心判断：机器人“大脑”正复刻大模型演化路径，但当前仍处于GPT-2前夜；2026年末至2027年初的头部模型发布窗口，是行业第一个实质性催化剂，而非商业化拐点本身。", "content": "野村——全球机器人行业：具身智能的“ChatGPT时刻”渐行渐近 核心判断：机器人“大脑”正复刻大模型演化路径，但当前仍处于GPT-2前夜；2026年末至2027年初的头部模型发布窗口，是行业第一个实质性催化剂，而非商业化拐点本身。 野村认为，机器人智能的演进与LLM高度同构：第一阶段海量预训练、第二阶段指令微调、第三阶段强化学习试错。当前实验室已出现“涌现”早期信号，但可靠性远未达生产级。NVIDIA内部视角与产业调研均指向：物理AI的突破更可能由头部大模型实验室（OpenAI、Google、字节跳动、DeepSeek）与Tesla这类“自有 fleet + 闭环数据”的集成方主导，而非单纯机器人脑初创公司。 ------ 一、模型层：VLA、世界模型、RL三轨并行 • VLA（视觉-语言-动作）：解决“看见—理解—输出动作路径”，但早期架构把过多容量耗在语言语义，对物理因果（重力、接触、形变）建模偏弱。 • 世界模型（WAM）：用视频生成替代传统物理引擎，预测“下一帧画面+下一动作”，是更接近Scaling Law的范式。云端运行大体量世界模型，边缘端跑轻量VLA/RL控制器，是2027年前主流架构。 • RL仿真：宇树科技在行走、后空翻等技能已验证“仅仿真训练可迁移实机”。 • 关键阈值：下一轮模型（12月–1月OpenAI物理AI模型、Google Gemini Robotics迭代、GPT-7预期）有望把机器人脑推至GPT-2水平，但离“可靠生产部署”仍差3–5年。 ------ 二、数据层：比算力更硬的瓶颈 • 机器人没有“互联网语料”，可用一致格式数据仅约10万小时级；行业“涌现门槛”约100万小时，长期需1亿小时以上。 • 采集路径四象限： ◦ 真机遥操：贵（约700元/小时），且绑定单一机身，跨平台复用性差； ◦ UMI手持采集：100–300元/小时，干扰真人作业，规模受限； ◦ Ego第一人称视频：300–350元/小时，跨代际可复用，正成为主训练源（典型配比60% Ego + 30% UMI + 10%真机）； ◦ 仿真：约120元/小时，但真实感知任务占比不超20%。 • Scaling Law向视频延伸：谁有算力+数据管线，谁吃红利。SuperMimic（CoRL 2026）用单卡3小时超越128卡7天基线，计算效率提升超1000倍，但预训练只是上半场，后半场必须靠“在岗机器人”回传数据形成正反馈飞轮。 ------ 三、ChatGPT时刻的五个硬指标（当前全不达标） 1. 无人介入连续运行时长：当前最佳几小时，工厂要求≥1周； 2. 精细手部作业：Gemini Robotics 2系垃圾袋打结成功率44%、扫入簸箕32%； 3. 跨机身适配速度：Google约7–8小时，国内较快者约2周； 4. 新任务示范次数：实验室已降至1–2次； 5. 工厂端准确率：当前约60%，工业付费门槛98%+。 野村强调：第1与第5项决定客户是用“运营预算”还是“试点预算”买单。 ------ 四、硬件与产业链影响：灵巧手先爆发，机身走向“iPhone时刻” • 大脑突破首先解锁五指灵巧手：从二指夹爪向高自由度手迁移，2026年灵巧手出货同比+80%–120%，工厂夹爪替代率30%–50%。 • 机身收敛：20+关节一致性决定控制策略可迁移性。先有软件范式收敛，才有硬件标准形态（类Android或Tesla垂直整合）。 • 量产成本锚：1.7m人形合理BOM 15–20万元，1.3m机型3–4万元；执行器占零件成本50%–75%。 • 赢家画像：快速迭代+严控成本+规模交付。宇树（688836 CH，野村买入，TP 370元，25x 2027E P/S）凭借全栈自研（外采仅10%–20%BOM）、毛利率60%、G1累计下线1–2万台，是硬件侧核心标的；但风险在于人形收入仍依赖科研客户，工业复购未闭环，且受海外准入（FCC清单）约束。 ------ 五、场景与数据飞轮节奏 • Tesla路径：自持万级机器人+道路视频+仿真，目标2026末攒够100万可用小时，单位数据成本环比降约18%。 • 中国路径：快递/服务商2026年采购\u003c500台、2027年~1000台，飞轮启动慢于美国。 • OpenAI是最大数据买方（测算2025.9–2026.8采购约1000万小时，占美供约70%），独立数据供应商窗口期约至2027末，之后头部自采闭环。 ------ 六、投资映射与风险 • 看多链：前端算力/世界模型（美股AI lab）、灵巧手与高一致性执行器、Ego视频数据基建、具备量产一致性的整机（宇树及核心供应商）。 • 谨慎点：纯“脑”初创商业模式未验证；依赖遥操数据且机身一致性差的OEM，需求会随范氏收敛而坍缩。 • 核心观察窗：2026年12月–2027年1月模型发布 → 2027年GPT-7 demo → 工厂准确率与无人时长是否跨过阈值。#文字观点", "publish_time": "2026-10-24 20:39", "tags": ["文字观点"]}, "attachment:files/北美AI大模型调研_Gemini_4_Argon模型升级与推理成本变化.pdf": {"id": "attachment:files/北美AI大模型调研_Gemini_4_Argon模型升级与推理成本变化.pdf", "kind": "attachment", "title": "北美AI大模型调研_Gemini_4_Argon模型升级与推理成本变化", "source_label": "其他", "excerpt": "1北美AI大模型调研：Gemini4Argon模型 升级与推理成本变化、与Anthropic深化 模型及产品集成、27年Anthropic或占 55%TPU资源、27年算力需求及电力/存 储瓶颈展望 以下是专家观点 问：评价一下Gemini4Argon刚刚发布，从您的视角讲讲这次模型 的发布有什么提升？谷歌发布这次模型时认为其核心竞争力或目标 是什么？", "content": "1北美AI大模型调研：Gemini4Argon模型 升级与推理成本变化、与Anthropic深化 模型及产品集成、27年Anthropic或占 55%TPU资源、27年算力需求及电力/存 储瓶颈展望 以下是专家观点 问：评价一下Gemini4Argon刚刚发布，从您的视角讲讲这次模型 的发布有什么提升？谷歌发布这次模型时认为其核心竞争力或目标 是什么？ 专家：这个模型发布时，主要对标的是 GPT-4o 。因为现在可以在公开平台上进行一些对比，所以基本上达到了这个目 标。目前算力比较紧张，无法推送给所有用户。这个模型实际上是一系列采用 新预训练方法训练的模型。这个checkpoint大约在一个半月前就已经定型，之 后只做了一小部分后训练，这一个半月主要是在做各种测试，确保测试结果没 有太多意外。这个模型主要是在补足整体任务和编码任务上的一些劣势。目标 是追赶SOTA，但SOTA模型更新很快，所以这次无论是从价格还是能力上， 目标模型是 Claude3.5Sonnet ，重点关注的垂直领域是法律和金融。由于Google模型的数据限制较多， 一直在寻找不用用户数据进行训练的方法，尝试用其他数据补足编码和Agent 相关的训练数据。编码部分还可以，主要是Agent这块。编码通常指像面试题 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2或编程考试那样，能否写出解法；Agent则更像是一些相对较长且不确定的任 务。 问：刚才提到新模型是为了补足coding上的一些劣势，但是现在新 模型好像仅在Geminiapp上供给Pro会员使用，在谷歌类似codex 的Antigravity上似乎还没有开放新模型的使用权限？ 专家：对，主要是因为目前算力非常紧张，今天起全球员工都不能用 Gemini4Argon，因为外部需求很大，所以公司内部已停用Gemini4Argon，只 能用测试模型或Flash。为了调配算力，比如免费用户不能用Flash就要用 Light，同时还要停用AIMode的Overview等C端全球服务，把算力省下来。 但整体来看还是不够。造成这种情况的原因有几个。首先，原本能用的 TPUv8i 硬件实际上有延迟，大约延后一个季度，到年底才会有大规模交付。目前 虽然有一些，但规模很小，所以硬件供应比预期慢。其次，Gemini4Argon是 Google首次发布这么大的模型，目前发布的还是原版，没有做任何降质处理， 因此模型本身非常耗算力。此外，GCP那边因为Anthropic租用了大量额外算 力，租赁收入比运行Gemini4Argon还高。所以Gemini4Argon在C端不断调 配算力，B端则优先保障算力供应。综合来看，短期内很难解决算力问题。 问：关于算力紧张，提到有好几个原因，一个是基础设施上TPU有 delay，包括电力资源比较紧张，第二点是在GCP方面Anthropic 增加很多算力租赁。那是否可以理解为，在算力紧缺的前提背景 下，谷歌的策略是会优先保障外部客户的算力供给？ 专家：对，现在看起来是这样，其实最主要的外部的算力就是来自 Anthropic。 问：谷歌是如何去考虑这种平衡的？在内部算力需求还没有满足的 情况下，去优先保障Anthropic的供应，考虑到两者之间还是存在 一定的竞争关系，无论是在大模型的层面还是在AI生态的层面？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 3专家：现在B端GCP计划与Anthropic做更深入的集成。比如Anthropic模 型，以前在GeminiEnterprise里是通过modelselector选择的，现在GCP打算做 更多的一体化集成，把Anthropic当作自家产品，在关键菜单里直接显示 Anthropic的Logo。这是B端非常激进的做法，把Anthropic模型的地位与 Gemini等同，其他模型则需要手动选择。未来在Google主要产品的第一级菜 单里就能直接看到Anthropic。这是B端的深度绑定。C端方面，Anthropic基本 上把C端增长交给Gemini负责，这是双方的合作模式。未来可能会有更有意思 的套餐，比如购买Gemini套餐时自带Anthropic的中低档模型。通过这种方 式，把两个模型绑定在一起，占领市场。因为现在各家模型的差距并不大，如 果一个套餐能同时覆盖两家模型，可能会更有吸引力。 问：未来是否Gemini会更多聚焦C端应用，B端则与Anthropic模 型有更多合作或绑定？ 专家：Gemini现在B端的很多能力其实已经超过Anthropic的一些模型。与 Anthropic的合作主要是将其深度绑定到 GoogleWorkspace 生态中，实现高度原生集成，比如在GoogleDoc中直接有Anthropic的按 钮，体现出一体化的体验。同时，Anthropic希望把C端的增长暂时交给 Gemini负责。未来两家公司的关系会非常紧密。C端正在测试几种套餐，比如 AIPlus 套餐自带Anthropic和Google的中档模型， AIPremium 则可能包含Anthropic和Gemini的最高模型。用户只需支付一份费用，就 能同时使用两家模型，tokencredit一致，可以自由选择。主要通过B端和C端 的深度绑定，与 OpenAI 进行竞争，目前OpenAI仍是最大的竞争对手。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 4问：如果未来与Anthropic进一步绑定，DeepMind会不会放缓对 SOTA模型的追求或训练？ 专家：不会，DeepMind的算力基本都用于训练SOTA模型，目前有很多 Flash模型还没有急于发布。现在仍在训练各种SOTA模型。同时，GCP正在积 极推进Anthropic的一体化集成，未来无论C端还是B端，都会形成两个模型 如同一家产品的形象，用户购买套餐后，无论ToB还是ToC，token都可以等 效兑换。Anthropic已经实现了套餐内两个模型的等效兑换。ToB端也是同样的 策略。未来用户可能需要在OpenAI和Anthropic+Gemini之间选择，选择范围 会变窄。 问：Gemini4Argon对算力的需求变大，推理或训练成本更高。结 合当前定价，盈利层面如何考虑？ 专家：C端目前都是亏损的，所有公司在C端都是亏损。如果按B端按 token销售，现在是半价，恢复原价后，一个月的毛利率更高。C端肯定亏损很 多。Google现在每天在打击薅羊毛行为，不做蒸馏，主要是封禁薅羊毛账户。 每天大约能封1万到2万个账户，这些账户通常会在reset前用光所有quota， 行为类似共享账户。 问：与Anthropic深度集成是什么时候开始的？是近期公司内部的 决定吗？ 专家：近期的决策虽然是最近一个月内做出的，但Leadership层面可能很 早就已经确定了方向。现在有很多项目都是Anthropic OneP 集成的项目。OneP代表FirstParty，即公司自有产品。从Google的角度来 看，OpenAI、微软等被视为ThirdParty，即第三方。目前，Anthropic所有集成 项目都称为OnePAnthropic。 问：Anthropic之前有传言说会购买谷歌的TPU用于模型训练或推 理，后来又有消息称他们可能会用自研芯片，比如与博通合作开发 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 5ASIC，或者用亚马逊的Trainium。现在如果谷歌和Anthropic深 度集成，Anthropic对TPU的使用或依赖会进一步加深吗？ 专家：至少Fable系列基本都是用 TPUV7 训练的，目前大约有一半的产品线是在TPU体系上。 Opus 不是基于TPU体系做的，而是基于Fable作为TeacherModel训练出来的模 型。但目前至少一半的产品都在TPU体系上。 问：预计现在Anthropic的算力占到整体算力的多少？ 专家：现在Anthropic获得的算力非常高，甚至比自家产品还多，这也是合 理的。目前TPU总量大约是700多万，预计年底能达到800万，Anthropic大概 占了350万。 问：具体来说，Anthropic和谷歌的合作与其他入口会有怎样的区 分？比如MicrosoftOffice也能调用Anthropic模型，那Anthropic 和其他云厂商或入口的合作，与谷歌之间未来会有明显区分吗？ 专家：对其他公司的情况不是特别了解，理论上其他公司也可以做类似的 集成。例如Anthropic可以成为默认模型，或者在某些产品中，比如PSCS或 VID，可以在第一层菜单直接选择Anthropic或Gemini，其他模型则需要下拉菜 单选择，或者根本无法进入Selector。这就是OneP的含义，指的是Anthropic 模型和Gemini在B端有同等的使用和入口权限。虽然这是技术集成，理论上微 软也可以做，但微软目前还没有SOTA级别的模型，所以不确定他们会怎么 做。 问：合作后，Anthropic会帮助Workspace做更好的harness吗？ 专家：目前模型集成的harness还是GeminiAgent或GeminiEnterprise的 harness，入口都是Google自己的，只是模型用的是Anthropic的。Google的套 餐比较复杂，B端有七八个档次。未来无论月费是20还是七八十，客户购买套 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 6餐后，模型就自带了。现在leadership认为，这样能够提升竞争力。客户购买套 餐后，至少可以选择当前SOTA的两家模型，不用纠结选择哪一家。如果CTO 招标，把头部模型公司都请来评估，分数可能只差一分，很难分出高下。但买 了这个套餐，两家模型都包含在内，即使一家不行，另一家也可以用。这让B 端市场推广更容易，是一个优势。目前了解到，其他公司还没有实现token等 价兑换。具体来说，按照固定月费seat用户，Anthropic和Gemini的token会换 算成内部credit，用户可以自由选择。例如，Anthropic用一个milliontoken相 当于两个金币，Argon用一个million相当于一个金币，这十个金币就是给用户 的quota。这两个模型的额度可以互换，目前其他公司还没有这种方式。理论上 微软也可以做类似套餐，把OpenAI和Gemini都集成进来，用户用金币互换， 但这需要所有模型公司同意，并确定分成机制。 问：现在Gemini和Anthropic之间的分成模式是怎样的？ 专家：不清楚现在的分成模式。 问：社区反馈对Gemini或Antigravity的harness有抱怨，认为 Gemini和harness或UI影响了应用体验。后续会有大改版吗？ Gemini和Antigravity会合并，做成类似Codex或GrokBot的产品 吗？ 专家： Anti-gravity 确实存在问题，目前有很多bug。由于用户隐私的考虑，遇到bug时Anti- gravity团队无法查看用户源代码，所以harness做得不如 OpenCode 。Argon加上OpenCode，使用OpenCode的harness，无论Eloscore还是跑 分，都比Anti-gravity高。Anti-gravity还没有找到既能保证用户隐私又能全面修 复bug的方法，feature开发速度比其他公司慢几个月。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 7问：现在Google集成了Gemini、Anthropic两个SOTA模型，并 且是平权的。未来大模型或AI生态的竞争格局会怎样？是不是未 来谁的基础设施更强，谁就能占据上风？这也是Anthropic和 Gemini合作的原因吗？ 专家：是的。至少在未来一年到一年半内，算力仍然非常紧张，因为大家 都在推出更大的模型，算力消耗也更大。在这种情况下，谁能获得更多算力， 谁就能服务更多大客户。现在模型差距不大，关键在于谁能锁定算力。购买这 么多模型，一方面是资金雄厚，另一方面是为了锁定市场上的算力，这样其他 公司，尤其是开源模型，可能就无法获得这些算力。 问：在当前算力需求紧缺、B端需求旺盛的情况下，如何看待 Anthropic的CAPEX和ROI问题？近期Anthropic的收入似乎未 达二级投资市场预期，这种情况应如何理解？是因为二级市场预期 过高，还是有其他原因？从产业调研来看，供给侧一直紧缺，需求 侧也很旺盛，但实际收入却不及预期，这个问题该如何思考？ 专家：现在Coding领域的人均渗透率已经很高，几乎所有程序员都在使用 CodingAgent，很多非程序员也开始使用各种Agent工具。非程序员的渗透率目 前还不高，这也是未来的增长空间。现在很多非程序员倾向于选择价格较低的 套餐，这类用户虽然能带来收入增长，但公司整体仍处于亏损状态。对于 Coding领域来说，只要模型不断升级，token的消耗量就会持续增加。大部分B 端企业仍然按照token或RPC框架进行结算，只要每次新模型发布后有10%到 20%的用户升级，整体token消耗量就会增加。目前基本上每两个月就会有新模 型发布，这种频率能够持续带动token消耗量的增长。即使部分token有折扣， 整体消耗量依然很大。每一代新模型的token消耗量通常会翻倍，这不仅带动 了收入的增长，也增加了算力需求，尤其是在Coding领域。非Coding领域的 发展相对较慢，原因包括大模型公司难以解释如何保障企业安全，以及未来 token用量的计算方式等问题。此外，大模型公司也难以清晰说明自家模型与其 他模型的区别，导致有些模型被捆绑销售。企业端的落地速度较慢，但一旦企 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 8业开始使用，通常不会轻易更换，因为更换产品的成本较高，许多企业仍在使 用非常老旧的软件版本。未来主要的增长点在于非Coding用户的渗透、Coding 用户持续升级模型，以及企业端更多应用在Agentflow中的落地。 问：关于AIInfra，目前算力紧缺。如果从紧缺程度排序，包括算 力、Memory、Power等，认为现在最缺的是什么？ 专家：做数据中心的人最缺的是 电力设备 ，尤其是发电设备。做模型的人则最缺 推理算力 ，主要是推理环节。训练模型目前不缺算力，因为有些项目暂停了，所以 软件和硬件领域最紧缺的分别是电力和推理算力。 问：未来推理算力会持续紧缺吗？ 专家：目前主要是Coding任务耗算力，Coding任务现在最缺的是 Memory ，因为CacheHitRate不高，需要重复计算，导致卡不够用。训练算力目前 不缺，因为暂停了其他项目，至少支持GeminiFlash和Pro系列是没有问题 的。 问：现在CPU紧缺吗？ 专家：CPU目前并不紧缺。Google没有做Muse那样的产品，所以没有这 方面压力。C端用户中有专门的产业链，专门研究如何薅羊毛，产业链很大且 利润很高。C端用户喜欢做这些事，而B端用户则更规范，使用场景更可预 测，不会在公司内部恶意薅API羊毛。 问：现在Anthropic用的算力中，训练和推理各占多少？ 专家：大约40%用于训练，所占比例比Gemini这边要高。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "attachment:files/AI应用调研(6)_模型与Harness适配决定Agent复杂任务成功率.pdf": {"id": "attachment:files/AI应用调研(6)_模型与Harness适配决定Agent复杂任务成功率.pdf", "kind": "attachment", "title": "AI应用调研(6)_模型与Harness适配决定Agent复杂任务成功率", "source_label": "其他", "excerpt": "1AI应用调研(6)：模型与Harness适配决定 Agent复杂任务成功率、GeminiSpark付 费用户渗透及应用场景、MetaMuse开放 式Agent产品策略与竞争优势 以下是专家观点 问：有第三方测评指出，Argon模型在3D和金融等专业领域表现 较强，但在Agent能力方面较弱。如何看待这些测评结果？", "content": "1AI应用调研(6)：模型与Harness适配决定 Agent复杂任务成功率、GeminiSpark付 费用户渗透及应用场景、MetaMuse开放 式Agent产品策略与竞争优势 以下是专家观点 问：有第三方测评指出，Argon模型在3D和金融等专业领域表现 较强，但在Agent能力方面较弱。如何看待这些测评结果？影响 Agent能力的因素是什么？是模型基础能力的差距，还是Agent系 统执行层面的差异？ 专家：目前在LargeModelArena的Agent菜单Leaderboard上，有6个模型 并列第一，其中包括 Argon 。这6个模型的Elo分数并非完全一致，而是在置信区间内互相重叠，因此 统计上属于并列第一。如果只看pointestimation，即准确的Elo分数，Argon目 前排在第四，低于 Opus5.5 、 GPTSOL6.1 和 Fiber5.1Max 。如果看综合榜单，比如Text榜，涵盖Authenticcoding、聊天、搜索等多 个维度，Argon和Muse的Wondermodel并列第一。因此，评价结果取决于是 看置信区间还是具体分数。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2问：影响Agent能力的核心因素是模型基础能力的差距，还是 Agent系统执行层面的差异？ 专家：目前并列第一的6个模型，对 Fable5.1Max 、 Opus5.5Max 、 Argon 以及其他新模型都做过详细评估。这些模型的主要差异不在于 Hallucination，而在于谁的响应速度更快、可读性更好。如果只比较模型A和B 的体感测试，Hallucination已经不是最关键的因素，这主要影响最终用户的体 验。对于模型训练团队来说，评价指标通常是通过固定测试来衡量模型表现， 但这些测试无法完全反映用户的实际感受。有时模型会输出一些奇怪的话，但 只要最终结果达标，模型能理解并继续执行任务即可。 Agent能力目前主要由四个方面决定。首先是预训练的方式，其次是后训练的 方式，再者是与某种 Harnessframework 的集成方式，即是Harness本身更复杂，还是模型端承担更多Harness功 能。最后一个重要因素是是否有额外的 validator ，尤其是独有的validator，可以在Harness中额外使用，这相当于一种\"秘 密武器\"。例如，拥有许多3D相关的validator，如 Blender 等，这类validator在3D任务中会显得非常独特。总体来看，这是一个综合 性的因素。举个例子，测试过Opus5.5和 OpenCode 的组合，即Opus5.5加OpenCode，仅更换Harness，其他条件不变时， Opus5.5的分数会非常低。这说明Opus5.5和ClaudeCode之间是深度绑定的。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 3Antigravity 则比较有意思，无论搭配什么模型，最终得分都不高也不低，属于中性表 现。目前，Argon结合效果最好的Harness是OpenCode。因此，Agent的表现 好坏，很大程度上取决于与所选Harness的匹配程度。 问：怎么看C端PersonalAIAgent的整体前景？目前重点似乎不在 C端，是因为判断B端更有盈利前景和收入空间，还是说谷歌认为 PersonalAIAgent的市场空间有限？现在是因为算力紧缺无法分配 资源，还是评估后认为B端投入更大？ 专家： Spark 在Gemini内部是P0级别的项目，但Spark本身不是公司级别的重要项目， 因此无法获得足够算力。还有一个有趣的现象，无论是否发布Pro模型，包括 Argon模型，对C端DAU影响都不大，今年上半年DAU变化不明显。但发布 Flash模型 （如3.7、3.8Flash）后，DAU有明显增长。现在不让大家用Flash，只能 用Lite，DAU反而下降。因此，Argon模型对C端DAU影响有限，C端DAU 与是否开放Flash模型高度相关。 整体来看，模型是否SOTA与C端DAU关系不大。PersonalAgent目前无法获 得足够算力。现在能与Muse竞争的主要是 GoogleSearch ，因为这两款产品设计都比较开放。比如Muse在界面验证人机身份时会自 动处理，而Gemini不会帮你解答，需要用户自己操作。 OpenAI 的DALL-E也能自动处理类似任务。产品设计上，Muse非常开放，其实产 品设计上，Muse的开放性和激进性是其他公司难以比拟的。 Anthropic wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 4和Google目前都没有类似的基因去做这种极度开放的产品，OpenAI相对也 更保守。比如Muse允许免费用户直接打电话，并以用户身份自称，而OpenAI 则会明确表明自己是AI。这种设计导致Muse的接受度更高，产品设计上也更 大胆，其他公司普遍不敢这样做。 问：如何看待Agent发挥价值的方式？在数据利用、用户隐私和权 限管理方面会有哪些布局或规划？如何平衡这些问题？ 专家：目前还没有特别有效的办法。以 GeminiSpark 为例，它的DAU渗透率还可以，是仅次于DeepResearch的第二大付费用 户功能。付费用户主要使用的Top几项功能，基本都与Google生态相关，如自 动化GoogleDrive、Gmail、Spreadsheet等SaaS程序。对于Google生态内的用 户，他们愿意为更好地利用生态内数据而付费。但像Muse这种纯开放生态的 产品，Anthropic和Google目前都没有类似的基因去做。OpenAI也相对保守。 Muse在产品设计上非常激进，比如允许免费用户打电话时直接以用户身份自 称，而OpenAI则会表明自己是AI。这样Muse的接受度更高，产品设计也更 大胆，其他公司普遍不敢这样做。 问：最近调研MetaMuse产品时发现，其复杂任务的准确率也不理 想。对于多步骤复杂任务，准确率往往较低。请问，如何提升多步 骤任务的最终准确率和任务完成的可靠性？ 专家：认为需要从多个方面入手。Muse的准确率确实不高，有时访问一些 网站时，数据查找也不准确。作为免费用户，感觉Muse没有为免费用户提供 复杂的Harness，因为这非常耗流量，每一步都需要截图和验证，Muse可能没 有做这些。但在更正式的场合，比如 ClaudeCode 、 Cursor wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 5、Antigravity、OpenCode等，提高准确率的关键在于Harness的设计，或者 让模型自身具备Harness能力，即模型本身更强，Harness可以更轻。 训练模型具备自我Harness和纠错能力 非常重要。因此，通过各种预训练和后训练，把这类能力训练进模型，是 提升准确率的关键。 问：如何评价Meta模型的性能或其Harness能力？ 专家：个人也在用Muse，感觉它没有做特别复杂的Harness。有些明显的 任务没有成功，比如访问自己生态内没问题，但我一直想让它访问小红书，帮 我搜集热点或新闻调研，但始终无法成功，可能小红书也做了很多防御措施。 不清楚收费用户是否体验更好，但Muse的Harness并不算很强，不像OpenAI 的Operator那样做得很厚。这可能与成本有关。 GrokBot 是用过的收费产品，Harness做得相当不错，主要面向B端UseCase。用户 群体也有差异，MetaMuse用户多做一些跑腿类任务，甚至涉及灰色地带，比 如叠加使用优惠券、打电话联系客服等，这些商家一般不会提供API。GPT和 Dost更多用于小B端场景，如整理新闻、竞争对手信息等。GrokBot作为收费 产品，Harness做得很不错，但用户群体不同，不能完全类比。 问：刚提到SOTA模型的发布对C端DAU影响不大。那么在B 端，SOTA模型对API使用量或收入有多大推动作用？ 专家：如果从抢市场的角度看，SOTA模型能抢占Anthropic或Fable的市 场，Fable本身又慢又贵。在大多数场合，Fable和Gemini4Argon的区别不 大，Argon更快更便宜。Anthropic和Argon相比，Argon在SaaSB端场景有特 殊训练和数据，因此能抢占原本属于其他SOTA模型的市场。但这块市场并不 容易抢，因为很多企业在招标后选定OpenAI模型，产品就定型了。除非企业 做新产品，否则迁移成本甚至高于初次开发成本。因此，ToB市场的抢占不会 很快，这也是为什么大模型公司都在雇人做FDE，推动自家模型尽快进入企业 系统，这样未来企业更换模型的代价会很高。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-24T10-07:85b84c917c6c": {"id": "post:2026-10-24T10-07:85b84c917c6c", "kind": "post", "title": "2026-10-24 10:07", "source_label": "帖子正文", "excerpt": "【超纯应材】26Q3营收同比+30%，特殊涂层零部件稀缺性资产！#26Q3营收同增30%【营收】1.84亿元，yoy+30%，qoq+15.4%", "content": "【超纯应材】26Q3营收同比+30%，特殊涂层零部件稀缺性资产！#26Q3营收同增30%【营收】1.84亿元，yoy+30%，qoq+15.4%； 【归母】0.72亿元，yoy+16.6%，qoq+39.3%； 【扣非】0.71亿元，qoq+39.6%； 【毛利率】56.3%，qoq-1.8pct。#国产半导体特殊涂层零部件龙头！特殊涂层零部件贯穿IC制造全产业链，是制程良率控制的关键要素；随先进制程不断迭代、3D NAND层数提升，晶圆刻蚀步骤成倍增加，且对特殊涂层的性能要求不断提高，带动刻蚀设备单机台/腔体特殊涂层价值量显著提升，预计2025年国内市场规模51.3亿元，2029年可达105.4亿元，CAGR达19.7%。 公司是国内少数具备5nm及以下制程刻蚀设备关键零部件供应能力的企业，2024年国内市占率达5.7%，在本土企业中排名第一，且已拓展至多家海内外龙头设备厂商、晶圆厂供应链！ #零部件供应紧张，公司充分受益下游扩产&国产替代加速 随着需求旺盛，零部件供应持续紧张，当前处于涨价周期，且未来扩产上修预期强，定价逻辑从需求侧改为产能供给侧。公司作为国产龙头，在5nm及以下特殊涂层已形成卡位，有望充分受益下游扩产及国产化率提升。 风险提示：下游景气度不及预期；行业竞争加剧等#文字观点", "publish_time": "2026-10-24 10:07", "tags": ["26Q3营收同增30%", "国产半导体特殊涂层零部件龙头", "文字观点"]}, "post:2026-10-24T20-39:ffd6f127a47b": {"id": "post:2026-10-24T20-39:ffd6f127a47b", "kind": "post", "title": "2026-10-24 20:39", "source_label": "帖子正文", "excerpt": "高盛——美国科技：硬件板块——专家网络系列：数据中心与网络设备2026年10月展望（与650 Group对话） 核心判断：650 Group认为AI adoption将持续驱动网络与计算行业长期结构性增长。数据中心网络市场（含scale-out、scale-across、scale-up、非AI及第", "content": "高盛——美国科技：硬件板块——专家网络系列：数据中心与网络设备2026年10月展望（与650 Group对话） 核心判断：650 Group认为AI adoption将持续驱动网络与计算行业长期结构性增长。数据中心网络市场（含scale-out、scale-across、scale-up、非AI及第三方光模块，不含CPO）预计在2030-35年实现29%的五年CAGR。Scale-up是2030年后DC网络市场最强单一增长贡献源。网络层面，尽管开放网络标准引发投资者辩论，但领先品牌厂商凭借复杂部署经验、硬件能力与差异化芯片将持续为超大规模及neocloud客户创造价值；计算层面，x86服务器中期出货量增长由AI agent与应用层通信需求驱动，同时高内存成本与更高密度推升ASP。企业/园区网络短期受AI安全威胁、WiFi 7升级及IoT扩张提振，但2027年后面临人口结构恶化（K12需求走弱）及竞争加剧（华为在欧洲、Ubiquiti上探中端市场）的逆风。 ------ 一、数据中心网络：Scale-up为长期增长引擎，品牌厂商护城河稳固 • 市场规模与增速：650 Group预测DC网络市场（涵盖scale-out、scale-across、scale-up、非AI及第三方光模块，不含CPO）在2030-35年五年CAGR达29%。其中，scale-up是2030年后市场维持强劲增长的最大单一贡献因子。 • Scale-up竞争格局：HPE与CLS凭借在AMD Helios机架以太网scale-up交换机领域的先发优势将率先受益——其计算经验构成关键差异化壁垒。但随着技术成熟与scale-up方案趋向解耦，650 Group预期市场参与者将增多、竞争加剧。 • 品牌厂商价值论：尽管OCP（开放计算项目）持续发布开放网络基础设施公告（如Meta IcePack），650 Group认为领先品牌网络厂商（CSCO、HPE）仍将在复杂部署、硬件工程与差异化硅片领域的专业积累上持续为超大规模客户赋能，开放标准并未削弱其核心价值。 • 前端与scale-out需求：除scale-up外，前端网络及scale-out以太网交换需求亦将维持强劲双位数增长。 ------ 二、DCI（数据中心互联）市场：AI跨园区连接催生百倍增量 • 定义与边界：650 Group将DCI市场定义为两部分——（1）传统数据中心互联（即\"上云\"的on-ramp链路）；（2）AI scale-across场景，即GPU集群分布在物理独立的数据中心之间。随着AI工厂因电力、土地及园区设计约束而向多栋建筑扩展，scale-across需求的相关性急剧上升。两类场景中，DCI设备供应商格局高度重叠。 • 规模预测：AI DCI机遇预计从2025年的约5亿美元激增至2030年的370亿美元（CAGR +144%）；非AI DCI从90亿美元增至210亿美元（CAGR +19%）。市场按收入大致三等分于：光模块/收发器（Marvell、Acacia、Ciena、Nokia）、系统设备（Arista、Cisco、Juniper、Nokia）、以及转发器/线路系统（Ciena、Nokia）。 ------ 三、传统服务器市场：预测大幅上修，AI agent驱动\"净新增\"计算需求 • 预测上修幅度：650 Group将2026-2030年传统服务器预测年均上修约52%，驱动力来自（1）ASP提升（高内存成本+更高密度服务器，核心数从20-30颗/台跃升至200+/台）；（2）agentic工作负载带来的全新需求。 • ASP逻辑：当前市场增长主要体现为成本传导，但企业客户将基于新一代服务器密度提升与性能改善来合理化更高采购价格。 • 增量需求来源：AI agent需与应用层通信，驱动x86服务器中期出货量增长（核心数增长更为强劲）。650 Group将此定义为\"净新增\"需求，是对现有CPU计算市场的增量补充而非替代。 • 下游垂直分布：企业仍为CPU市场最大垂直领域（约50%），其次为超大规模云厂商（约25%）、neocloud（约20%）及电信（约5%）。Neocloud中，面向推理服务的运营商对CPU需求最为相关，而纯训练/GPUaaS导向的neocloud CPU需求较低。 • 白牌与品牌格局：中期内neocloud服务器市场中白牌与品牌方案份额将保持稳定（即DELL与SMCI不会将份额让渡给台湾ODM），但650 Group正在跟踪技术更成熟的neocloud子集随时间推移向白牌迁移的潜在趋势。 ------ 四、企业/园区网络：短期顺风强劲，2027年后逆风渐起 • 四大近期顺风： （1）应对AI相关安全威胁而新增的IT与安全预算； （2）WiFi 7升级周期——新无线标准需多千兆、高功率交换机配套； （3）IoT/OT扩展端口需求——机器人、楼宇自动化、工业设备及数据中心建设带来更多IoT网关，部分抵消PC与手持设备连接增速放缓； （4）企业升级需求——2020年前安装的存量设备退出支持服务驱动替换周期。 • 三大远期逆风（2027+）： （1）不利人口结构趋势压制K-12教育垂直需求； （2）竞争加剧与ASP压力——华为切入欧洲市场以低价夺取份额，对CSCO与HPE的欧洲业务构成冲击； （3）Ubiquiti上探中端市场，其产品组合广度与扩张速度超越多数中端竞争对手。 ------ 总结 AI adoption正重塑数据中心网络与计算产业链的长期增长曲线——scale-up交换、跨园区DCI（370亿美元TAM）及agent驱动的服务器增量构成三大核心结构性机遇；品牌网络厂商凭借差异化硅片与部署能力抵御开放标准冲击，但企业网络2027年后需警惕华为欧洲扩张与人口结构逆风。选股逻辑应聚焦scale-up先发者（HPE、CLS）、DCI光模块/系统双赛道龙头，以及受益于服务器密度跃升与agent需求的CPU生态链。#文字观点", "publish_time": "2026-10-24 20:39", "tags": ["文字观点"]}, "attachment:files/DCI厂商调研_北美DCI需求进展及CSP采购模式转型.pdf": {"id": "attachment:files/DCI厂商调研_北美DCI需求进展及CSP采购模式转型.pdf", "kind": "attachment", "title": "DCI厂商调研_北美DCI需求进展及CSP采购模式转型", "source_label": "其他", "excerpt": "1DCI厂商调研：北美DCI需求进展及CSP 采购模式转型、代工订单及相干光模块供 应链扩张、OCS供需 聚焦 Google/Microsoft/Meta/AWS/NVIDIA/Nokia/Ciena/Cisco/Coherent/AOI/Lumentum /Polatis/iPronics等 以下为专家观点 问：请介绍一下当前北美主要CSP（如谷歌、微软、", "content": "1DCI厂商调研：北美DCI需求进展及CSP 采购模式转型、代工订单及相干光模块供 应链扩张、OCS供需 聚焦 Google/Microsoft/Meta/AWS/NVIDIA/Nokia/Ciena/Cisco/Coherent/AOI/Lumentum /Polatis/iPronics等 以下为专家观点 问：请介绍一下当前北美主要CSP（如谷歌、微软、Meta、 AWS）在2026年和2027年的DCI需求以及招投标的最新进展？ 答：北美主要CSP的DCI招投标与下单时间点整体上比预期要晚。谷歌最 初预计在2026年5月底至6月初开始招投标，后来时间点多次提前至3月，但 实际首张订单在4月29日下达。微软的进度与谷歌相近，于4月30日开始下 单。Meta和亚马逊原计划7月启动，后提前至5月，但实际下单时间为7月 底。甲骨文原定于7、8月下单，但至今尚未开始。 与以往不同，今年的采购模式发生了显著变化。此前，CSP通常采用总包模 式，由北美运营商（如Lumen）作为总包方，再将DCI等项目分拆给各供应 商。2026年，CSP跳过了总包方，基建部分仍交由运营商，但DCI系统和部分 相干模块则直接下单给诺基亚、Ciena。此外，相干模块的直采份额大幅增加， 大部分直接给到Coherent、思科和AOI等公司，而在之前基本没有直采。由于 取消了总包方，订单现在是分批下达，而非一次性完成。 问：针对谷歌已下达的约24亿美元订单，其交付节奏如何？微软、 Meta和亚马逊的订单下达比例情况是怎样的？ 答：谷歌已下达的订单计划在2026年内完成交付。考虑到当前产能有限， 且需要满足多家客户的需求，预计今年内能够交付的订单量大致就是这个规 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2模。微软的下单节奏与谷歌基本一致，订单下达比例也约为40%。Meta和亚马 逊由于从7月底才开始下单，其订单下达比例会稍低一些。 问：在谷歌的DCI采购中，诺基亚、Ciena、思科等主要供应商各 自的份额是怎样的？ 答：在谷歌的DCI系统采购中，诺基亚约占50%的份额，Ciena约占 30%。一个显著变化是，约有10%以上的DCI板卡份额被分配给了思科和 Coherent，这部分板卡技术要求相对较低，此前主要由Ciena供应。在相干模块 方面，Coherent占据了主导地位，份额约为40%；其次是思科，约占20%； AOI的份额不到10%，该公司正因此扩充产能。剩余约30%的份额由诺基亚和 Ciena等瓜分。 问：相干光模块的占比为何大幅提升？ 答：相干光模块的预算占比较高，主要是因为当前数据交换需求激增，新 建的DCI系统基本都要求相干模块满配，并需要额外备货。 问：当前DCI需求中是否包含2.4T轻相干（CoherentLite）产 品？其应用场景和未来需求节奏是怎样的？ 答：当前的需求中不包含轻相干产品，其应用预计要到2027年至2029年 才会出现。不过，鉴于海外客户普遍在提前DCI系统的部署进度和需求量，轻 相干产品的订单有可能提前至2027年下半年。轻相干技术并非用于传统的DCI 长距离传输，而是一种应用于数据中心园区内部楼宇间互联的新场景。随着数 据中心规模扩大（如万卡甚至十万卡集群），单栋楼已无法容纳，楼宇间的连 接距离（通常为1至10公里）超出了传统数百米数通光模块的范围，而使用几 十公里传输距离的传统相干模块成本又过高。轻相干技术（也称为\"相干下沉 \"）应运而生，它不仅解决了中等距离的连接问题，还能大幅提升数据中心内部 的传输带宽。因此，轻相干与传统DCI的应用场景存在差异。 问：公司在北美数据中心DCI建设中以何种形式参与？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 3答：公司主要通过为北美DCI供应链中的厂商提供代工服务来参与。目前 正在进行的项目包括为Ciena的部分相干模块和EDFA板卡或模块代工。与诺 基亚的合作方面，公司为其代工从相干模块到完整DCI系统的全系列产品，该 DCI方案最初是公司在2022至2023年为诺基亚开发的，主要面向国内及东南 亚运营商市场。对于北美CSP的订单，诺基亚目前主要通过英飞朗生产，尚未 转移至我方。预计在2026年底或2027年第一季度，可能会有北美市场的订单 转移过来。与思科的合作方面，双方近期签订了一项协议，由公司为其代工 DCI系统中使用的电层板卡。这类板卡主要负责网络监控、管理以及数据汇聚 分流等电层功能，技术含量相对较低，毛利率也偏低。 问：DCI系统具体包含哪些组成部分？其价值量区间是多少？ 答：DCI系统是一个包含硬件系统和软件的综合解决方案。其基础硬件部 分包括一个机框，内置背板、散热板、主控板、网络通信板和网络管理板。在 此基础上，系统可以根据需求集成多种功能板卡，例如用于数据汇聚分流板、 EDFA光放大器、OTDR、OLP光保护单元，以及WSS和AWG等。DCI系统 的价值量差异很大，价格范围可以从10万元人民币到300-400万元人民币不 等。影响价格的主要因素包括传输速率、传输距离、数据处理量以及所包含的 附加功能数量。以EDFA为例，一个系统中可能只配置一块，也可能配置多达 16块，后者将导致系统总价急剧上升。 问：以诺基亚在东南亚市场的DCI系统合作为例，其业务模式和产 品的平均价格是怎样的？ 答：在与诺基亚的合作中，其在东南亚市场的DCI系统完全由我方进行代 工。这意味着我方提供了系统的全部价值构成，诺基亚在此基础上增加其利润 后销售给最终客户。由于DCI系统型号众多，配置各异，单套系统的价格并不 固定，但其均价大约在30万至50万元人民币之间。 问：在相干光模块业务中，主要的合作模式是什么？当前市场的主 流产品规格以及未来的发展趋势是怎样的？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 4答：在相干光模块业务中，主要的合作模式是代工。目前，除了北美市场 外，诺基亚的相干光模块业务由我方全面负责，产品以400G规格为主。当前 市场的主流需求，包括北美在内，集中在400G和800G。尽管800G的市场需 求非常旺盛，但由于技术路线确定较晚以及部分物料供应问题，实际交付能力 有限，因此市场仍以400G为主。1.6T的方案虽已确定，但目前除北美有小批 量需求外，其他地区基本没有需求。因此，当前市场格局是400G为主，800G 为辅。 问：相干光模块供应链中，哪些关键元器件存在短缺？不同速率模 块所使用的DSP技术规格有何差异？ 答：当前相干光模块供应链中，DSP、CW光源和EML光源是关键元器 件。其中，CW光源供应情况相对较好，而EML和DSP则比较紧张。法拉第 旋光片的供应紧张情况预计在2026年下半年开始有所缓解。目前最主要的短缺 来自DSP。400GDSP的主要供应商是博通和Marvell，尽管诺基亚、Ciena、三 菱和海思等公司也有自产的400G相干光模块DSP，但性能上与前两者仍有差 距，产量也较少。对于800G相干光模块DSP，博通和Marvell的产品是市场首 选，其他供应商的产品在性能上尚有不足。在技术规格方面，400G光模块通常 使用56Gperlane的DSP，800G使用112Gperlane，而1.6T则需要224Gper lane的DSP。 问：相干光模块使用的DSP在制程工艺和技术壁垒上与数通光模块 有何不同？ 答：相干光模块对DSP的要求比数通光模块更高。800G和1.6T相干光模 块所用的DSP基本都采用3纳米制程工艺，这也是导致DSP供应紧张的原因之 一，因为台积电的3纳米产能有限。除了制程上的差异，相干DSP在技术壁垒 上也更高，主要体现在对精度、响应度以及功耗控制的要求更为严苛。由于相 干传输距离更远，需要更高的发光功率，但同时必须有效控制功耗的增长，这 对DSP的整体设计和性能提出了更高的挑战。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 5问：相干光模块与数通光模块在EML和CW光源的使用上有何区 别？ 答：在EML芯片方面，相干光模块对其发光功率的要求更高。数通光模块 的发光功率通常在0dBm左右，要求不高的场景下-6dBm也可接受。而相干光 模块一般要求达到3dBm或6dBm，功率比数通高出2到8倍。尽管功率要求不 同，但在速率规格上，两者使用的EML芯片是相同的，例如800G模块使用 100Gperlane的EML，1.6T模块使用200Gperlane的EML。在光源选择上， 随着速率提升，EML的实现难度越来越大，因此相干光模块目前主要以CW光 源加MZM调制器的方案来实现长距离传输，这与数通光模块的趋势相似，都 倾向于硅光技术。 问：在相干光模块中，硅光技术的渗透率如何？不同速率模块对 CW光源的功率有何具体要求？ 答：相干光模块中硅光技术的渗透率要高于数通光模块。目前，800G相干 光模块中采用CW光源的比例已达到七成甚至八成，EML方案的使用则越来越 少。到了1.6T速率，基本上都采用硅基方案。在功率要求方面，400G和800G 模块使用100mW的CW光源即可满足需求。对于1.6T模块，则需要150mW 以上，甚至达到200mW的CW光源，特别是在传输距离要求超过100公里的 场景下。 问：相干光模块中的关键物料，例如DSP、400GEML芯片、CW 激光器以及旋光片（光隔离器）的主要供应商分别是哪些？在实际 应用中，国内厂商的产品使用情况如何？ 答：在相干光模块的物料构成中，DSP芯片主要由博通和Marvell供应。对 于400GEML芯片，供应商包括Lumentum、Coherent、三菱、住友等海外厂 商，以及仕佳、光迅、海信等国内企业，但国内厂商的EML芯片目前基本上仅 通过了验证阶段，实际应用较少。CW激光器的供应商则基本只采用Lumentum 和Coherent这两家。至于旋光片，目前主要使用国内厦门森一的产品，其小尺 寸产品方面问题不大；而国外厂商的旋光片基本不对外销售，主要供内部自 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 6用。在为Coherent代工的相干光模块中，会使用其自有的旋光片，而其他产品 则倾向于采用国产替代方案，主要因为国产产品价格更具优势。 问：国内DCI市场的需求趋势如何？北美市场的DCI需求是否存 在因资金、电力审批或液冷建设等因素而放缓的迹象？ 答：国内DCI市场在2024年经历了建设高峰，需求量最大。然而，进入 2025年及2026年至今，市场基本没有出现太多增长。相比之下，北美市场的 DCI需求目前并未出现放缓迹象，反而仍在加速，表现为持续催促进度交付。 一个例证是，Coherent推出了简化版的DCI系统（POLS系统），并已直接升 级至800G，反映了需求的提速趋势。 问：O-BandDCI技术的应用场景是什么？与预计在2028年左右推 出的2.4TCoherentLite技术相比，它是一种过渡方案还是存在替 代关系？ 答：O-BandDCI技术主要应用于数据中心园区内部，其应用场景与轻相干 技术有所重叠。该技术采用1,310nm波段，最早由英伟达在2025年6月提出。 从技术发展的角度看，O-BandDCI更像是一个过渡性方案。主要原因是，在实 现相同带宽的情况下，O-BandDCI的成本高于轻相干技术，且其带宽能力也不 及相干技术。因此，尽管该概念自2025年提出以来，市场上并未观察到大规模 的需求。 问：2026年北美OCS市场的需求情况如何，特别是谷歌的采购量 和交付进度？ 答：2026年，谷歌向Coherent下达了3,000台300端口的液晶OCS订单， 同时向Lumentum表达了对其MEMS300端口方案的需求是\"能生产多少就要多 少\"。然而，由于LCOS方案的良率问题和MEMS方案的物料及产能良率限 制，今年的实际交付量远未达到预期。除谷歌外，其他客户目前采购OCS主要 用于验证目的，尚未进入大规模使用阶段，部分原因也是高端OCS产能基本被 谷歌包揽，其他厂商难以获得批量供货。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 7问：市场有传闻称谷歌向Polatis下达了数千台采用压电陶瓷方案的 OCS订单，这一消息的可能性如何？ 答：尽管压电陶瓷方案在性能上具有明显优势，但其长期可靠性尚未得到 充分验证。该技术通过电压改变材料形变来实现光路偏转，材料在持续形变过 程中会产生疲劳度。长期使用后，这种疲劳可能导致偏转角度不准或无法复 位，从而影响设备的可靠性。鉴于此，包括谷歌和英伟达在内的主要客户，目 前并未积极验证压电陶瓷方案，因为从原理上就对其长期可靠性存有疑虑。 问：公司目前在OCS业务中主要采用何种技术方案？与英伟达、谷 歌等客户的合作模式是怎样的？ 答：公司目前主要以光波导方案为主，同时也具备MEMS方案能力，但当 前市场需求主要集中在波导方案。在客户合作方面，公司已获得英伟达的OCS 订单。而谷歌和Meta的订单则主要下给了另一家公司iPronics，该公司同时也 在与亚马逊和微软进行对接。公司目前未直接参与谷歌的OCS项目。 问：公司的光波导OCS方案如何解决插损较高的问题？目前的产能 规划和扩产节奏是怎样的？ 答：光波导方案通过采用SOA来解决插损问题，应用效果良好。在产能方 面，目前一条产线的年产能为500台。公司计划分阶段扩产：第一步计划将年 产能提升至3,000台，预计在2027年第一季度末完成；第二步计划进一步扩充 至10,000台，预计在2027年年底左右达成。此次扩产将全部在国内进行，因 为东南亚的扩产进度和效率无法满足要求。 问：公司DCI业务的产能现状如何？未来的扩产计划和时间节点是 怎样的？ 答：公司DCI业务的常规产能规划为年产值21亿人民币。目前正在进行调 整，计划将常规产能提升至27-28亿人民币。如果加上两班倒等措施，总产能 预计可达到30-35亿人民币之间。具体的扩产节奏为：到2027年第一季度末， 21亿的产能规划将确定完成；到2027年第二季度末，常规产能预计能达到27- wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 828亿的水平。此次扩产也基本在国内进行，主要因为泰国工厂的扩产进度过于 缓慢，已对业务造成过影响。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-24T10-17:dd0f4582a245": {"id": "post:2026-10-24T10-17:dd0f4582a245", "kind": "post", "title": "2026-10-24 10:17", "source_label": "帖子正文", "excerpt": "转发：核心观点 1. 市场仓位处于低位 机构投资者仓位已压缩至多年低位。市场正在等待三个关键事件： 企业业绩（Earnings） 美国中期选举（Midterm Election） 潜在大型股权融资（ECM Supply） 2. 美国中期选举影响 预测市场认为民主党全面获胜（Democratic sw", "content": "转发：核心观点 1. 市场仓位处于低位 机构投资者仓位已压缩至多年低位。 市场正在等待三个关键事件： 企业业绩（Earnings） 美国中期选举（Midterm Election） 潜在大型股权融资（ECM Supply） 2. 美国中期选举影响 预测市场认为民主党全面获胜（Democratic sweep）的概率较高。 Goldman Sachs 的策略团队认为，即使出现这一结果，对伊朗战争政策及 AI 监管方向的实质影响可能有限。 选举后政治不确定性下降，或有利于股市表现，但通胀、企业盈利及地缘政治仍将是更重要的市场驱动因素。 3. AI 和大型科技股盈利是下周焦点 下周大型云计算公司（Hyperscalers）财报非常关键。 投资者关注： AI 云业务积压订单（cloud backlog）能否转化为收入； AI 基础设施部署速度； AI 投资的资金需求。 Goldman 分析师预计： 云业务收入增速将由上一季度的 48% 加速至 Q3 的 55%。 市场希望从财报中看到更具体的 AI 生产力提升证据。#文字观点", "publish_time": "2026-10-24 10:17", "tags": ["文字观点"]}, "post:2026-10-24T21-53:2a7178f415a1": {"id": "post:2026-10-24T21-53:2a7178f415a1", "kind": "post", "title": "2026-10-24 21:53", "source_label": "帖子正文", "excerpt": "【美股周度行情速览】☕本周收官时段行情波动趋于平静。长线资金和对冲基金本周整体为适度净卖出，抛售压力集中在科技板块。", "content": "【美股周度行情速览】☕本周收官时段行情波动趋于平静。长线资金和对冲基金本周整体为适度净卖出，抛售压力集中在科技板块。 📊我们盘面统计显示，过去两周所有客户类型及交易渠道合计 TMT 板块净卖出规模约 200 亿美元，包含信息技术板块以及通信服务板块。 📌作为参考，该卖出规模已经接近 7 月上一轮 AI 板块抛售潮的水平，当时两周净卖出金额为 230 亿美元。 😔市场情绪依旧低迷，业绩承压的问题持续存在。 🤖本周盘面中没有看到资金主动进攻 AI 主线的迹象。 🔄在上一轮行情中，资金从 AI 板块轮动流出，转向市场里的防御板块；而本周虽然消费、公用事业以及部分金融板块走高，但这类轮动现象十分少见。 🗓️下周看点：标普 500 指数至下周五（10 月 30 日）的隐含波动幅度为 1.80%。 📅下周宏观、微观事件密集，有多场央行决议落地，美联储议息会议、加拿大央行决议在周三，欧洲央行决议在周四，日本央行决议在周五，同时也是三季度财报披露最集中的一周，标普 500 成分股 44% 市值的公司将发布财报。 🏢微软、谷歌、ServiceNow、科磊将在周三披露财报，亚马逊、英特尔将在周四披露财报。 🇧🇷市场关注周日晚间出炉的巴西大选结果，Polymarket 平台目前测算博索纳罗获胜概率 76%，而当地民调显示其领先优势仅 0 至 2.5 个百分点。 📉美股已经连续第三周遭遇净卖出，近五周里面有四周都是净卖出状态，主要驱动来自个股层面的多空交易，本轮减仓规模是 7 月末以来最大的一次。 🏭工业板块是净卖出最多的板块之一，对冲基金对该板块的卖出速度创下六个月以上新高。 🛒与之形成对比，房地产板块以及必需消费板块是本周资金净买入最多的板块，这也持续印证资金偏向防御的布局思路。（高盛卖方） ⚖️风险敞口情况：美股多空策略总杠杆提升 2.2 个百分点至 216.1%，该数值处于近一年 64 分位；美股多空策略净杠杆下降 0.3 个百分点至 43.4%，处于近五年 0 分位。#文字观点", "publish_time": "2026-10-24 21:53", "tags": ["文字观点"]}, "attachment:files/Muse调研：下一代模型能力、Muse个人智能体路线图与算力需求.pdf": {"id": "attachment:files/Muse调研：下一代模型能力、Muse个人智能体路线图与算力需求.pdf", "kind": "attachment", "title": "Muse调研：下一代模型能力、Muse个人智能体路线图与算力需求", "source_label": "其他", "excerpt": "1Muse调研：下一代模型能力、Muse个人 智能体路线图与算力需求 以下为专家观点 问：在Wonder和WonderFull的现有能力之外，Meta希望通过下 一代模型实现哪些主要突破？答：最重要的突破目标，是从执行单条指令的模型，转向能够自主处理用 户长期目标的模型。", "content": "1Muse调研：下一代模型能力、Muse个人 智能体路线图与算力需求 以下为专家观点 问：在Wonder和WonderFull的现有能力之外，Meta希望通过下 一代模型实现哪些主要突破？ 答：最重要的突破目标，是从执行单条指令的模型，转向能够自主处理用 户长期目标的模型。这包括自主决策、独立从失败中恢复，以及主动交付结果 的能力，实际上就是从AI助手演变为一个持续运行的个人智能体。 下一代模型将重点关注五项能力： 自主规划 、 持久记忆 、 主动推理 、 可靠的计算机操作 ，以及 从用户交互中持续学习 。 问：下一代WonderFull模型具体希望实现哪些突破？衡量成功的 关键指标是什么？ 答：主要有五项突破目标。 第一是 长程自主执行 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2。模型能够将一个大目标拆解为子目标，跨多个应用执行，验证中间结 果，并在无需用户介入的情况下从错误中恢复。目标是将50步工作流的完成率 从目前的45%提高至85%。 第二是 主动智能 。模型能够像Muse一样，记住用户偏好并据此提出建议。目标是让这些主 动建议中有70%是有用的，同时将用户不希望受到的打扰控制在5%以下。 第三是 持久的个人化推理 。这意味着不再只是保存一个历史对话数据库，而是持续维护一套不断更 新的、对用户目标、偏好和未完成工作的表征。 第四是 对陌生任务的泛化能力 。模型需要能够将推理能力的提升迁移到后训练重点任务之外，因为不可 能针对每一个网站和每一种工作流，分别训练个人智能体。 第五，也是最后一项突破，是 降低自主智能的成本 。目标是将每项成功完成任务的成本降低60%。这将通过模型路由、并行 子智能体、缓存，以及减少重试次数等方式实现。 问：在增强多步骤执行、主动记忆和泛化等模型能力方面，目前处 于什么研发阶段？主要挑战是什么？ 答：研发重点已经从提高模型的智能水平，转向提高这种智能在持续运行 过程中的可靠性。 一个关键挑战是，推理基准测试上的表现更强，并不会自动转化为更好的自主 智能体。模型可能在复杂推理任务上表现出色，但在实际应用中仍然遇到困 难，例如记住不断变化的用户偏好，或执行一项包含50个步骤的工作流。 目前正在五个技术领域跟踪进展。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 3主动记忆 ：主要挑战是确保记忆的相关性、解决矛盾，以及处理过时的偏好。一个 具体问题是，判断哪些记忆仍然有效、与当前决策相关，并且应该影响智能体 的行为。 主动聚焦与推理 ：主要难点是在长时间任务中持续保持对目标的关注。 泛化能力 ：挑战在于将技能应用于陌生的工作流和工具。 长程执行 ：主要障碍是错误累积，以及出错后的恢复。 主动智能 ：关键挑战是判断AI何时应该行动，何时应该保持安静。 问：未来AI模型的规模和架构预计会如何演变？模型会变得更 大，还是更小、更高效？ 答：最显著的变化将是转向一种 分层架构 ，让较小的专用模型与一个大得多的推理模型协同工作，而不是由单个超 大模型处理所有任务。 预计到2028年，这种架构将包含四类主要模型，每类模型在智能体模型调用中 占据不同份额： 微型专用模型 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 4，参数规模为5,000万至5亿：负责意图分类、记忆评分和安全过滤等任 务，预计占智能体模型调用的30%。 小型智能体模型 ，参数规模为10亿至80亿：处理工具路由、数据提取和简单的浏览器操 作，预计占调用的40%。 中型推理模型 ，参数规模为100亿至700亿：用于多步骤规划、编程和文档分析，占调 用的20%。 大型前沿模型 ，参数规模从1,000亿到超过1万亿：用于高难度推理、陌生任务和策略性 决策，占剩余的10%。 前沿模型将继续变大。不过，模型总容量的增长速度预计将快于每个token所 使用计算量的增长速度，这在很大程度上是因为 混合专家架构 的重要性。 例如，一个拥有10万亿参数的模型，在处理某个token时，可能只激活300亿 至600亿参数。这样就可以容纳更多知识、实现更强的专业化，而不必承担全 部参数参与计算的成本。 一次用户请求可能触发多个模型，首先从一个较小的专用模型开始。 问：哪些主要挑战导致MetaAI的模型研发花了一年时间才达到第 一梯队的表现水平？ 答：进展慢于预期，是由几个相互叠加的挑战造成的。 组织重组 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 5，包括领导层、职责归属和研究优先级的变化，打断了研发的连续性，约 占延误原因的25%。 一个重要因素，是基础AI研究实验室与产品导向团队之间的摩擦。前者专注于 基础研究，后者专注于为Meta的商业产品交付模型。这些团队有不同的目标、 实验安排和评估标准，因此在优先级上产生冲突。 例如，研究团队可能优先考虑一种能够将泛化能力提高5%的新训练方法，而产 品团队优先考虑的是，将面向用户应用的推理延迟降低30%。 其他挑战包括： 认识到强大的预训练已不再能保证前沿水平的推理或智能体表现，重要性占比 为30%。 GPT和Gemini等竞争对手不断抬高竞争门槛，重要性占比为20%。 基础设施和训练稳定性问题需要进行大量调试，重要性占比为15%。 产品集成、安全、延迟和部署经济性相关问题带来的延误，重要性占比为 10%。 问：随着Muse从一个特定应用转向更通用的智能体，运行框架层 （harness）的作用将如何演变？模型团队与产品团队之间如何协 调？ 答：运行框架层在任务专用逻辑方面会变薄，但整体上不会变得更小，也 不会变得不那么重要。 随着Wonder和WonderFull等模型的推理和泛化能力提高，更多决策将转移到 模型自身。预计由模型直接处理的任务规划决策比例，将从2026年的50%— 60%提高至2028年的80%—90%，从而减少对硬编码工作流逻辑的依赖。 不过，对于持久记忆、权限、安全执行、调度、监控和验证等功能，运行框架 仍然至关重要，而且会变得更加复杂。 运行框架将从一个告诉模型如何执行任务的系统，演变为一个管理以下问题的 系统：模型获准做什么、它需要什么上下文，以及结果是否正确。这意味着从 以工作流为中心的编排，转向以模型为中心的推理和以基础设施为中心的治 理。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 6模型团队与产品团队的协调，围绕共同的评估与反馈闭环展开。 协调通过三种机制实现： 共享能力基准 ，使两个团队朝着共同目标努力。 并行开发周期 。产品团队按周开展迭代，模型研究则采用更长的8—12周周期，每个阶 段性模型版本都会在生产环境的运行框架中接受测试。 共同负责端到端成功指标 ，例如任务完成率。 问：个人智能体预计何时会被主流用户采用？推动这一转变的关键 因素和指标是什么？ 答：在成为主流的日常使用产品类别之前，个人智能体预计还要经历三到 四代重大产品迭代。这将是一个逐步演进的过程。MetaMuse预计会经历四个 不同阶段： 任务型助手，2026年 ：用户明确发起研究、编程和购物等任务。 工作流智能体，2027年 ：智能体负责多步骤执行、持久记忆和主动建议，用户将重复性工作流委 托给它。 个人智能体，2028年 ：核心能力包括管理长期目标和感知上下文，用户每天多次依赖智能体。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 7自主个人助理，2029—2030年 ：智能体持续管理目标并跨平台执行，用户将整类职责委托给它。 关键转变期是在2027年至2028年之间。届时，用户将从要求智能体完成一项 项独立任务，转向信任它并将持续性的职责交给它。 虽然预计两到三年内会实现主流采用，但要形成习惯性依赖，让相当一部分用 户将其作为日常数字助理，可能需要四到五年。 推动大规模采用的因素，更多是用户习惯、信任和任务可靠性，而不只是模型 成本。 任务成功率从75%提高至95% ，对用户留存的影响，要大于成本显著下降但可靠性停滞不前的情形。 要进入自主使用阶段，需要满足三个条件：常规工作流的可靠性达到95%或以 上；形成用户习惯，每位用户有三到五项重复性工作流；每项成功完成任务的 成本比目前降低70%—80%。 问：Muse的用户任务中，有多少在Meta生态内部处理，有多少需 要外部API或平台？ 答：目前，60%—65%的用户任务在Meta自有模型和基础设施生态内处 理，35%—40%需要外部API、第三方平台或基于浏览器的访问。 随着Muse从回答问题转向执行行动，并成为真正的个人智能体，其对外部服 务的依赖预计将增加。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-24T19-10:ba9e1731965e": {"id": "post:2026-10-24T19-10:ba9e1731965e", "kind": "post", "title": "2026-10-24 19:10", "source_label": "帖子正文", "excerpt": "【XN智能制造团队】物理AI驱动具身智能：技术重塑产业，商业化进程持续推进#物理AI赋能具身智能、开启实体交互新范式 1）物理 AI 以世界模型为核心底座，依托 VLA 链路实现大小脑分工：基座大模型充当 “大脑” 承担语义理解、高层任务规划， “小脑” 处理空间关系、力学规则、物体碰撞等物理约束", "content": "【XN智能制造团队】物理AI驱动具身智能：技术重塑产业，商业化进程持续推进#物理AI赋能具身智能、开启实体交互新范式 1）物理 AI 以世界模型为核心底座，依托 VLA 链路实现大小脑分工：基座大模型充当 “大脑” 承担语义理解、高层任务规划， “小脑” 处理空间关系、力学规则、物体碰撞等物理约束；具身智能将这套能力承载于实体硬件，打通感知‑推理‑执行的完整闭环，和仅做图文解析的纯数字大模型形成本质差异。 2）物理 AI 核心价值是大幅降低真实场景的数据生成门槛，依靠仿真生成海量物理交互样本，减少高成本实景采集工作。产业链价值迎来重构，世界模型、3D 仿真引擎、具身数据集成为关键增量；行业逐步形成大模型公司输出 VLA 与世界模型能力、机器人本体厂商提供硬件载体与真机测试环境的联合迭代模式，双方协同完成从仿真预训练向真机迁移的全流程打磨。#场景分化落地、商业化拐点渐近1）物理 AI 拓展人形机器人能力边界，落地顺序优先封闭工业场景，再商业服务、远期家庭。现阶段端侧算力、结构材料仍处在持续迭代优化阶段，行业预计约三年迎来产业起量；机器人使用成本逼近人工薪资是商业化拐点，租赁模式更适配现阶段推广。 2）以化工油气巡检为代表的工业机器人是物理 AI 优先验证阵地，诉求与人形机器人有所区分，重点聚焦安全可控、告警可追溯、数据本地部署。当前重点推进防爆适配与硬件工程化落地，云边分层架构助力算力降本。商业化稳步推进，待 2‑3 年产业逐步走向规模化成熟后毛利有望提升 10 个点，中长期软件订阅模式有望进一步抬升毛利水平，中东、东南亚替代需求可观。#海内外巨头布局、行业迭代加速1）海外动态：英伟达迭代 Cosmos 世界模型、Isaac 仿真与 GR00T 工具链，联合 Figure 推进真机 VLA 验证；特斯拉 Optimus 样机进入早期量产，基于自研世界模型优化大脑‑小脑架构。AMD 收购李飞飞创办 World Labs，加码空间智能与物理世界模型研究。 2）国内动态：宇树在世界物理 AI 大会推进仿真‑真机自进化闭环，同步发布 H2‑X 人形新机；智元迭代 BFM‑2 运动基座与 VLA 具身模型，持续打磨机器人灵巧操作能力。 以上标的不构成投资建议。欢迎交流~WHB#文字观点", "publish_time": "2026-10-24 19:10", "tags": ["场景分化落地、商业化拐点渐近", "海内外巨头布局、行业迭代加速", "文字观点"]}, "post:2026-10-24T10-10:e4dc063c4d71": {"id": "post:2026-10-24T10-10:e4dc063c4d71", "kind": "post", "title": "2026-10-24 10:10", "source_label": "帖子正文", "excerpt": "科达利：结构件盈利环比修复，机器人大客户突破放量在即 #业绩亮眼、符合市场预期。公司26Q1-3营收149.8亿元，同41%，归母净利15.3亿元，同29%，扣非净利15亿元，同33%，毛利率20.9%，同-2pct", "content": "科达利：结构件盈利环比修复，机器人大客户突破放量在即 #业绩亮眼、符合市场预期。公司26Q1-3营收149.8亿元，同41%，归母净利15.3亿元，同29%，扣非净利15亿元，同33%，毛利率20.9%，同-2pct；其中26Q3营收57.7亿元，同环比46％/14％，归母净利5.8亿元，同环比41%/21％，扣非净利5.8亿元，同环比42%/24％，毛利率21.1%，同环比-3/1pct，归母净利率10.1，环比+0.6pct，业绩符合市场预期。 #结构件排产满产逐月提升、盈利水平环比改善。公司26Q1-3营收150亿，其中26Q3公司收入环比20%+增长，同增46%，同环比增速恢复，我们预计Q4收入进一步环比增长，我们预计全年收入210亿，同比38%增长，27年预计仍可实现30%+增长，海外产能将进一步贡献增量。盈利端，26Q3铝价高位小幅回落，毛利率环比已显著修复，扣非净利率恢复至10%，叠加后续规模化进一步提升+海外工厂放量，27年净利率预期维持10-11%。 #谐波大客户PPA落地，泰国工厂扩产体现公司信心。公司目前已形成以减速器为主的旋转关节、以丝杠为主的直线关节和灵巧手三大产品方向协同布局的业务体系，当前与海外大客户对接深入，预计大部分型号可拿大份额。公司在泰国规模扩产，产值7亿元，预计对应百万套谐波产能，充分体现公司拿到订单及份额的确定性，远期公司规划庞大。此外公司配合开发新产品，丝杠、结构件等已有送样反馈良好，单台价值量有望进一步提升。 #现金流亮眼、资本开支显著增加。公司26Q1-3期间费用13亿元，同34%，费用率9%，同0pct，其中Q3期间费用5亿元，同环比38%/14%，费用率9%，同环比0/0pct；26Q1-3经营性净现金流17亿元，同-12%，其中Q3经营性现金流8.6亿元，同环比73%/39%；26Q1-3资本开支15.1亿元，同169.4%，其中Q3资本开支5.5亿元，同环比195%/32%；26Q3末存货13.2亿元，较年初34%。 #盈利预测：考虑铝价影响，预计26-28年归母净利润21.3/29.2/38.1亿，同比增25%/32%/30%，对应PE为21x/15x/12x，考虑公司后续机器人弹性，给与27年25x，对应目标价255元，维持\"买入\"评级。 风险提示：市场竞争加剧风险。#文字观点", "publish_time": "2026-10-24 10:10", "tags": ["文字观点"]}, "post:2026-10-24T17-02:4ba79c6b79e7": {"id": "post:2026-10-24T17-02:4ba79c6b79e7", "kind": "post", "title": "2026-10-24 17:02", "source_label": "帖子正文", "excerpt": "新能源汽车出口退税退坡专题报告 #新能源汽车出口退税退坡正式落地。2027年4月1日起新能源汽车出口增值税退税率将从13%下调至9%，消费税退税保持不变，政策设置6个月缓冲窗口期。", "content": "新能源汽车出口退税退坡专题报告 #新能源汽车出口退税退坡正式落地。2027年4月1日起新能源汽车出口增值税退税率将从13%下调至9%，消费税退税保持不变，政策设置6个月缓冲窗口期。当前我国汽车出口体量快速攀升，2026年1‑7月出口占总销量比重已达34.9%，出口涉税规模达千亿级别。退税率每下调1个百分点，对应名义税额约101.8亿元，单车利润会直接受到冲击。短期行业承压，预计2027年汽车出口增速会有所回落，行业盈利分化进一步加剧，政策导向也从普惠出口扶持转向高质量国际化竞争。 #光伏、动力电池已经完整演绎分阶段退坡路径，可作为汽车行业重要参照。2024年12月光伏、电池退税率同步由13%降至9%；光伏进一步在2026年4月直接取消退税，从首次下调到清零间隔16个月；电池2026年4月由9%降到6%，2027年1月彻底取消退税，完整周期25个月。参照该渐进模式，新能源汽车未来仍存在继续调整可能性。国内车企已布局泰国、巴西海外工厂，零部件同步出海配套，采用国内出口+海外CKD生产对冲压力。短期或将出现窗口期抢交付，长期海外产能利用率、本地配套能力决定企业抗风险实力。 #退税退坡倒逼行业竞争逻辑转变，比拼全球化体系综合能力。投资层面，整车重点关注具备定价能力、海外产能兑现的比亚迪、长城汽车、上汽集团；零部件关注能够实现海外本地配套、订单稳定兑现的宁德时代、银轮股份等产业链标的。出海大趋势并未改变，行业正式迈入高质量出海新阶段。#文字观点", "publish_time": "2026-10-24 17:02", "tags": ["文字观点"]}, "post:2026-10-24T10-48:e2657b0d0d98": {"id": "post:2026-10-24T10-48:e2657b0d0d98", "kind": "post", "title": "2026-10-24 10:48", "source_label": "帖子正文", "excerpt": "锂电池材料价格周报https://share.note.youdao.com/ynoteshare/mobile.ht...光伏价格周报https://share.note.youdao.com/ynoteshare/mobile.ht...#笔记链接", "content": "锂电池材料价格周报https://share.note.youdao.com/ynoteshare/mobile.ht...光伏价格周报https://share.note.youdao.com/ynoteshare/mobile.ht...#笔记链接", "publish_time": "2026-10-24 10:48", "tags": ["笔记链接"]}, "post:2026-10-24T17-05:7241db0cfafb": {"id": "post:2026-10-24T17-05:7241db0cfafb", "kind": "post", "title": "2026-10-24 17:05", "source_label": "帖子正文", "excerpt": "【中泰电新】亿纬锂能（300014）2026年三季度业绩点评：盈利改善超预期税传导顺利，动力出货指引上调20261024事件：公司发布26Q3业绩，公司实现收入276.98亿元，同比+65%，环比+11%，实现归母净利润19.39亿元，同比+60%，环比+5%；扣非后归母净利润16.44亿元，同比+", "content": "【中泰电新】亿纬锂能（300014）2026年三季度业绩点评：盈利改善超预期税传导顺利，动力出货指引上调20261024事件：公司发布26Q3业绩，公司实现收入276.98亿元，同比+65%，环比+11%，实现归母净利润19.39亿元，同比+60%，环比+5%；扣非后归母净利润16.44亿元，同比+111%，环比+23%，归母和扣非高于1015预告中枢。#出货：动力出货指引上调拆分来看，公司26Q3实现动力出货30.2G，同比+131%，环比+41%；公司26Q3实现储能出货22.5G，同比+14%，环比-6%，主要受产能不足影响；展望27年，预期指引上调，动力100%增长（之前指引+60%，主要系宝马上调大圆柱占比指引、国内客户跟随布局大圆柱、商用车高增、国内新客户等），储能50%增长以上。#盈利：消费税背景下盈利能力改善超预期公司26Q3实现毛利率14.69%，环比提升0.15个百分点，主要系出口客户占比提升3%+成本管控，拆分来看，储能环比增长改善最多，动力环比略增，消费电池毛利率环比下滑主要系圆柱工厂爬坡（后续会修复）；根据测算公司26Q3动储单位盈利约0.025元/wh，环比较为稳定消费税负面影响有限，目前消费税和出口退税大部分客户完成商议接受传导，极少部分动力客户还在积极沟通。展望后续，海外占比提升+稼动率提升+规模效应强化，公司毛利率目标18%-20%，单位盈利有望进一步提升。#运营管理能力优秀原材料价格波动影响小公司26Q3实现公允价值变动损益-8896万元，其中汇兑损益6000万元，碳酸锂套期保值影响较小；公司26Q3资产减值-1637万元，在碳酸锂降价背景下减值较小主要系公司库存大多数是在产品和产成品，价格26Q2锁定，受原材料价格影响变化不大。 风险提示：需求不及预期；消费税、出口退税传导不及预期联系人：【中泰电新团队】曾彪/杨子伟13166154039#文字观点", "publish_time": "2026-10-24 17:05", "tags": ["出货", "动力出货指引上调", "盈利", "消费税背景下盈利能力改善超预期", "运营管理能力优秀原材料价格波动影响小", "文字观点"]}, "post:2026-10-24T20-38:0f736082172d": {"id": "post:2026-10-24T20-38:0f736082172d", "kind": "post", "title": "2026-10-24 20:38", "source_label": "帖子正文", "excerpt": "【长城机械 汪湛帆】九州一轨调研要点20261023 苏州晶禧 1、主营业务是硅光芯片切割代工，公司切割会比光模块和光芯片企业切割的效率要高30%-40%，所以头部客户都会找公司切割代工 2、公司现在产能10万片，预计明年年中扩产到50万片，目前产能已被头部大客户锁定，预计明年产量30-40万片，单", "content": "【长城机械 汪湛帆】九州一轨调研要点20261023 苏州晶禧 1、主营业务是硅光芯片切割代工，公司切割会比光模块和光芯片企业切割的效率要高30%-40%，所以头部客户都会找公司切割代工 2、公司现在产能10万片，预计明年年中扩产到50万片，目前产能已被头部大客户锁定，预计明年产量30-40万片，单片切割价格3000元，预计营收9-12亿元，50%的净利率，对应4.5-6e业绩 通创九州（金刚石业务） 1、公司目前先做金刚石光通信的产品，金刚石散热片主要放在光芯片的下面进行散热，单个光模块需要8颗金刚石散热片，ASP 1-2美金 2、光通信金刚石散热片产能：北京产能6000-7000万颗（11月份设备搬入厂房），2年内计划做到10亿颗（内蒙基地），预计1年内会有亿级别的光通信订单#文字观点", "publish_time": "2026-10-24 20:38", "tags": ["文字观点"]}, "post:2026-10-24T10-07:3bc766d2529f": {"id": "post:2026-10-24T10-07:3bc766d2529f", "kind": "post", "title": "2026-10-24 10:07", "source_label": "帖子正文", "excerpt": "🔥【百亚股份】26Q3 单季度承压，核心五省渠道变革带来经营阵痛，外围市场仍保持快速增长 前三季度：收入 26.89 亿元、同比+2.54%；归母 1.37 亿元、同比 -43.92%", "content": "🔥【百亚股份】26Q3 单季度承压，核心五省渠道变革带来经营阵痛，外围市场仍保持快速增长 前三季度：收入 26.89 亿元、同比+2.54%；归母 1.37 亿元、同比 -43.92%；扣非 1.37 亿元、同比-42.20%。 · Q3 单季：收入 8.19 亿元、同比 -4.64%（Q1/Q2 为+6.0%/+6.1%，Q3 转负）；归母 -0.42 亿元、同比-174.0%；扣非-0.33 亿元、同比-159.1%。业绩低于预期。 #收入端：线下核心区域渠道变革与去库存是主因，外围高增延续。前三季度线下 16.46 亿元、+1.3%，其中核心区域以外省份+29.3%；线上 9.92 亿元、+6.3% · Q3 线下 4.66 亿元、-5.1%，要受线下核心区域市场渠道结构变革及库存调整影响；核心区域以外省份 Q3 同比 +33.7%（H1 为+27.2%，进一步提速） · 据此测算 Q3 线上约 3.3 亿元、同比小幅下滑，降幅明显小于线下，电商策略纠偏后趋于企稳。 #盈利端：毛利率下滑叠加费用刚性导致单季转亏 · 前三季度毛利率 55.84%、同比+1.84pct，产品结构升级方向持续；但 Q3 单季毛利率 51.95%、同比 -3.60pct、较 H1 的 57.54% 环比降 5.6pct，线下收入下滑带来的规模效应减弱，原材料影响预计2pct左右 · Q3 销售费用率 48.81%、同比 +6.38pct；期间费用率 55.27%、同比+8.18pct，其中管理费用率+0.57pct、研发费用率+1.19pct，费用刚性明显 · Q3 归母净利率 -5.11%、同比-11.69pct；前三季度归母净利率 5.10%、同比-4.22pct。#现金流健康。前三季度经营现金流净额2.02 亿元、同比 +30.4%，利润下滑的同时现金流改善，反映渠道去库存与回款质量提升。全国化仍在推进：核心区域以外省份 Q3 +33.7%。展望 Q4 为传统旺季，预计电商端盈利有望好于去年同期。#文字观点", "publish_time": "2026-10-24 10:07", "tags": ["现金流健康", "前三季度经营现金流净额", "文字观点"]}, "post:2026-10-24T21-08:8ae94f2dc7c7": {"id": "post:2026-10-24T21-08:8ae94f2dc7c7", "kind": "post", "title": "2026-10-24 21:08", "source_label": "帖子正文", "excerpt": "🤖【国金具身】五洲新春跟踪：减速器再落一子，品类最全的物理ai硬件平台 #布局减速器打造品类最全的物理ai硬件平台。近日公司与重庆精钢传动成立合资公司，布局减速器赛道，补齐机器人零部件最后一块拼图。", "content": "🤖【国金具身】五洲新春跟踪：减速器再落一子，品类最全的物理ai硬件平台 #布局减速器打造品类最全的物理ai硬件平台。近日公司与重庆精钢传动成立合资公司，布局减速器赛道，补齐机器人零部件最后一块拼图。五洲产品矩阵包括：机器人及智驾丝杠、轴承、减速器，已经成为品类最丰富的物理ai硬件平台，机器人单机asp可展望到1w+。 #重庆精钢航天级减速器技术降维打击。重庆精钢主要客户为航天航空研究所、航天集团等科研院所及部分知名民营商业航天客户，25年营收1500万，净利率超20%。创始人李俊阳来自重庆大学机械传动国家重点实验室（国内传动领域唯一的国家级重点实验室），与银河航天合作开发的新型谐波减速器成本仅为传统航天减速器的一半左右，曾为国内多家减速器厂商提供技术支持。 #物理ai叙事下更要重视高精度硬件的必要性。当算力-数据-模型的飞轮开始运转，具身的瓶颈更多被认为是软件的问题。实际上能采集到什么数据，数据能保留什么信息，模型又能从数据策略中学到什么，依靠的是高精度、高可靠性的硬件，尤其是丝杠、减速器等传动部件。 投资建议： 公司在大客户丝杠环节份额稳固，机器人轴承及减速器等产品实现扩张，asp提升逻辑有望持续演绎。持续推荐！#文字观点", "publish_time": "2026-10-24 21:08", "tags": ["文字观点"]}, "post:2026-10-24T17-07:822eaac77aac": {"id": "post:2026-10-24T17-07:822eaac77aac", "kind": "post", "title": "2026-10-24 17:07", "source_label": "帖子正文", "excerpt": "1730 台拉晶炉揭开马斯克 20GW 计划📌1730 台从中国运往美国的拉晶炉，或许透露了马斯克 20GW 电力计划的重要线索！📌马斯克此前表示，SpaceX 拥有一套 “高度专有” 的方案，计划在 2027 年底前新增 20GW 电力供应，而且不只是依靠燃气轮机。", "content": "1730 台拉晶炉揭开马斯克 20GW 计划📌1730 台从中国运往美国的拉晶炉，或许透露了马斯克 20GW 电力计划的重要线索！ 📌马斯克此前表示，SpaceX 拥有一套 “高度专有” 的方案，计划在 2027 年底前新增 20GW 电力供应，而且不只是依靠燃气轮机。太阳能显然也是其中一环，而且相关部署已经开始加速。 📌2026 年 7 月至 9 月，中国向美国出口了 1730 台拉晶炉，而此前 18 个月的出口量仅为 15 台！拉晶炉用于生长单晶硅棒，随后将其切割成硅片，最终用于制造太阳能电池板。如此大规模的设备出口，究竟意味着多大的光伏产能？ 📌根据东吴证券（2023）、Linton 招股书及 ESIA（2024）的行业基准数据，单台拉晶炉每年可支撑约 11–15MW 的光伏产能。据此估算，1730 台拉晶炉对应的年产能约为 20–25GWp。考虑到这些基准数据已有约三年历史，而此次设备价格高出约 50%，实际产能达到 30GWp 也完全有可能。#文字观点", "publish_time": "2026-10-24 17:07", "tags": ["文字观点"]}, "post:2026-10-24T17-01:399e08d52b90": {"id": "post:2026-10-24T17-01:399e08d52b90", "kind": "post", "title": "2026-10-24 17:01", "source_label": "帖子正文", "excerpt": "【腾景科技】光通信持续放量，Q3毛利率创历史新高业绩位于预告中枢。前三季度营收7.44亿元，同比增长74.93%", "content": "【腾景科技】光通信持续放量，Q3毛利率创历史新高业绩位于预告中枢。前三季度营收7.44亿元，同比增长74.93%；归母净利润9610.42万元，同比增长50.63%；扣非归母净利润9532.34万元，同比增长55.58%。Q3营收3.14亿元，同比增长93.70%、环比增长21.71%；归母净利润4602.22万元，同比增长69.11%、环比增长29.10%；扣非归母净利润4564.94万元，同比增长71.31%、环比增长27.99%，业绩兑现此前预告，收入与利润延续逐季增长。光通信多类产品放量，产品结构优化推动毛利率提升。受益于全球AI算力基础设施扩容，高速光模块无源光学元组件、OCS钒酸钇晶体及可调谐激光器等光测试仪器订单交付持续增长，Q3毛利率45.30%，连续4个季度环比大幅提升，创下单季新高，高速产品占比提升的结构优化效用非常明显。展望Q4，上述增长动力有望延续之外，预计OCS准直器等新产品将逐步量产，业绩有望提速。扩产与研发同步推进。前三季度资本性支出4.99亿元，同比增长159.13%，公司通过银行信贷及科创债等工具支持产能扩张。前三季度研发投入8048.61万元，同比增长74.29%，持续布局AI算力光互联多元技术路径等领域。我们认为，高速光模块元组件、OCS材料与光测试仪器共同驱动公司增长，订单放量已体现为收入与毛利率同步提升。展望后续，新增产能释放有望进一步支撑规模化交付，OCS准直器等产品的订单拓展及CPO相关研发布局有望打开后续成长空间。#文字观点", "publish_time": "2026-10-24 17:01", "tags": ["文字观点"]}, "post:2026-10-24T10-09:7e2219fe6858": {"id": "post:2026-10-24T10-09:7e2219fe6858", "kind": "post", "title": "2026-10-24 10:09", "so 长。\n- **今天出现的催化/验证**：全球存储市场情景推演发布；数据中心与网络设备2026年10月展望发布；北美AI大模型调研涉及27年算力需求及电力/存储瓶颈展望。\n\n### 2. AI模型/Agent/EDA\n- **主线**：模型能力升级、推理成本下降与Agent落地。\n- **今天强化的逻辑**：Kimi K3.1 Pro后训练驱动能力全面提升、定价下调约三成；OpenAI在完全断网封闭系统训练前沿模型；AI EDA从单点辅助走向全流程智能体；模型与Harness适配决定Agent复杂任务成功率。\n- **今天出现的催化/验证**：Kimi K3.1 Pro及高速版发布、完整权重11月4日前开源；DeepSeek开源推理框架；Gemini 4 Argon模型升级与推理成本变化调研。\n\n### 3. 半导体先进封装/关键零部件\n- **主线**：先进制程与3D NAND升级带动刻蚀设备特殊涂层价值量提升。\n- **今天强化的逻辑**：晶圆刻蚀步骤成倍增加，对特殊涂层性能要求提高，带动单机台/腔体特殊涂层价值量显著提升；公司具备5nm及以下制程刻蚀设备关键零部件供应能力，2024年国内市占率5.7%、在本土企业中排名第一。\n- **今天出现的催化/验证**：超纯应材26Q3营收同比+30%、环比+15.4%；国内特殊涂层市场规模预计从2025年51.3亿元增至2029年105.4亿元，CAGR 19.7%。\n\n### 4. 机器人/具身智能\n- **主线**：物理AI驱动具身智能，大小脑分工与商业化推进。\n- **今天强化的逻辑**：物理AI以世界模型为核心底座，依托VLA链路实现大小脑分工；特斯拉Optimus样机进入早期量产，基于自研世界模型优化大脑—小脑架构；落地顺序优先封闭工业场景，再商业服务、远期家庭。\n- **今天出现的催化/验证**：2026年末至2027年初头部模型发布窗口被判断为行业第一个实质性催化剂；五洲新春与重庆精钢传动成立合资公司布局减速器；科达利机器人大客户突破放量在即。\n\n### 5. 光通信/PCB上游材料\n- **主线**：AI算力基础设施扩容带动光通信与高端电子布量价齐升。\n- **今天强化的逻辑**：高速光模块无源光学元组件、OCS钒酸钇晶体及光测试仪器订单交付持续增长；AI板材向M8/M9升级带动低介电布用量成倍增长，ABF膜嵌入T布、低CTE布进入封装基板供应链等新场景打开需求天花板；下游CCL顺价能力已充分验证。\n- **今天出现的催化/验证**：腾景科技Q3毛利率45.30%、连续4个季度环比大幅提升并创单季新高，OCS准直器等新产品预计逐步量产；宏和科技Q3布价环比再涨四成；东威科技合同负债高增彰显订单充足。\n\n### 6. 宏观/策略与风险\n- **主线**：低仓位等待关键事件，科技板块面临资金与信用风险扰动。\n- **今天强化的逻辑**：机构投资者仓位已压缩至多年低位；美股多空策略净杠杆下降0.3个百分点至43.4%，处于近五年0分位；长线资金和对冲基金本周整体适度净卖出，抛售压力集中在科技板块。\n- **今天出现的催化/验证**：市场等待企业业绩、美国中期选举、潜在大型股权融资；评级机构表示数据中心面临信用评级下调风险；纽约证券交易所期权交易因“技术问题”暂停。\n\n## 三、今日重点关注\n### 3.1 今天已经发生的重点变化\n- **业绩高增/兑现**：超纯应材26Q3营收1.84亿元、同比+30%、环比+15.4%；腾景科技前三季度营收7.44亿元、同比+74.93%，Q3毛利率45.30%；宏和科技前三季度收入19.75亿元、同比+132%，归母7.43亿元、同比+436%；东威科技前三季度营收11.03亿元、同比+45.76%，归母1.63亿元、同比+90.88%。\n- **其他业绩变化**：科达利26Q1-3营收149.8亿元、同比+41%，归母15.3亿元、同比+29%；亿纬锂能26Q3收入276.98亿元、同比+65%，归母19.39亿元、同比+60%；中材科技前三季度营收256.7亿元、同比+18.3%，归母19.1亿元、同比+29.1%，扣非17.3亿元、同比+44.2%；税友股份Q3扣非归母利润+53.48%；南方传媒26Q3收入25.05亿元、同比+8.4%，归母6.04亿元、同比+51.0%。\n- **模型与AI应用事件**：Kimi K3.1 Pro发布，定价下调约三成，高速版输出速度约2—3倍、价格为2倍，完整权重11月4日前开源；OpenAI确认在完全断网封闭系统中训练前沿模型；AI EDA从单点辅助走向全流程智能体，DeepSeek开源推理框架。\n- **机器人产业变化** 质性催化剂，而非商业化拐点本身。\u003c/li>\n\u003cli>光通信与PCB上游材料业绩密集兑现：腾景科技前三季度营收7.44亿元、同比+74.93%，Q3毛利率45.30%创单季新高；宏和科技前三季度归母7.43亿元、同比+436%；东威科技前三季度营收11.03亿元、同比+45.76%，归母1.63亿元、同比+90.88%。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>1. AI算力/存储与网络设备\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：AI算力竞赛与存储超级周期韧性。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：AI算力竞赛是“无人敢退出的胆小鬼博弈”，存储超级周期具备高度韧性，2027年供需格局已基本锁定；AI adoption将持续驱动网络与计算行业长期结构性增长。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：全球存储市场情景推演发布；数据中心与网络设备2026年10月展望发布；北美AI大模型调研涉及27年算力需求及电力/存储瓶颈展望。\u003c/li>\n\u003c/ul>\n\u003ch3>2. AI模型/Agent/EDA\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：模型能力升级、推理成本下降与Agent落地。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：Kimi K3.1 Pro后训练驱动能力全面提升、定价下调约三成；OpenAI在完全断网封闭系统训练前沿模型；AI EDA从单点辅助走向全流程智能体；模型与Harness适配决定Agent复杂任务成功率。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：Kimi K3.1 Pro及高速版发布、完整权重11月4日前开源；DeepSeek开源推理框架；Gemini 4 Argon模型升级与推理成本变化调研。\u003c/li>\n\u003c/ul>\n\u003ch3>3. 半导体先进封装/关键零部件\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：先进制程与3D NAND升级带动刻蚀设备特殊涂层价值量提升。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：晶圆刻蚀步骤成倍增加，对特殊涂层性能要求提高，带动单机台/腔体特殊涂层价值量显著提升；公司具备5nm及以下制程刻蚀设备关键零部件供应能力，2024年国内市占率5.7%、在本土企业中排名第一。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：超纯应材26Q3营收同比+30%、环比+15.4%；国内特殊涂层市场规模预计从2025年51.3亿元增至2029年105.4亿元，CAGR 19.7%。\u003c/li>\n\u003c/ul>\n\u003ch3>4. 机器人/具身智能\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：物理AI驱动具身智能，大小脑分工与商业化推进。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：物理AI以世界模型为核心底座，依托VLA链路实现大小脑分工；特斯拉Optimus样机进入早期量产，基于自研世界模型优化大脑—小脑架构；落地顺序优先封闭工业场景，再商业服务、远期家庭。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：2026年末至2027年初头部模型发布窗口被判断为行业第一个实质性催化剂；五洲新春与重庆精钢传动成立合资公司布局减速器；科达利机器人大客户突破放量在即。\u003c/li>\n\u003c/ul>\n\u003ch3>5. 光通信/PCB上游材料\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：AI算力基础设施扩容带动光通信与高端电子布量价齐升。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：高速光模块无源光学元组件、OCS钒酸钇晶体及光测试仪器订单交付持续增长；AI板材向M8/M9升级带动低介电布用量成倍增长，ABF膜嵌入T布、低CTE布进入封装基板供应链等新场景打开需求天花板；下游CCL顺价能力已充分验证。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：腾景科技Q3毛利率45.30%、连续4个季度环比大幅提升并创单季新高，OCS准直器等新产品预计逐步量产；宏和科技Q3布价环比再涨四成；东威科技合同负债高增彰显订单充足。\u003c/li>\n\u003c/ul>\n\u003ch3>6. 宏观/策略与风险\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：低仓位等待关键事件，科技板块面临资金与信用风险扰动。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：机构投资者仓位已压缩至多年低位；美股多空策略净杠杆下降0.3个百分点至43.4%，处于近五年0分位；长线资金和对冲基金本周整体适度净卖出，抛售压力集中在科技板块。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：市场等待企业业绩、美国中期选举、潜在大型股权融资；评级机构表示数据中心面临信用评级下调风险；纽约证券交易所期权交易因“技术问题”暂停。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>业绩高增/兑现\u003c/strong>：超纯应材26Q3营收1.84亿元、同比+30%、环比+15.4%；腾景科技前三季度营收7.44亿元、同比+74.93%，Q3毛利率45.30%；宏和科技前三季度收入19.75亿元、同比+132%，归母7.43亿元、同比+436%；东威科技前三季度营收11.03亿元、同比+45.76%，归母1.63亿元、同比+90.88%。\u003c/li>\n\u003cli>\u003cstrong>其他业绩变化\u003c/strong>：科达利26Q1-3营收149.8亿元、同比+41%，归母15.3亿元、同比+29%；亿纬锂能26Q3收入276.98亿元、同比+65%，归母19.39亿元、同比+60%；中材科技前三季度营收256.7亿元、同比+18.3%，归母19.1亿元、同比+29.1%，扣非17.3亿元、同比+44.2%；税友股份Q3扣非归母利润+53.48%；南方传媒26Q3收入25.05亿元、同比+8.4%，归母6.04亿元、同比+51.0%。\u003c/li>\n\u003cli>\u003cstrong>模型与AI应用事件\u003c/strong>：Kimi K3.1 Pro发布，定价下调约三成，高速版输出速度约2—3倍、价格为2倍，完整权重11月4日前开源；OpenAI确认在完全断网封闭系统中训练前沿模型；AI EDA从单点辅助走向全流程智能体，DeepSeek开源推理框架。\u003c/li>\n\u003cli>\u003cstrong>机器人产业变化\u003c/strong>：五洲新春与重庆精钢传动成立合资公司布局减速器；科达利机器人大客户突破放量在即；特斯拉Optimus样机进入早期量产。\u003c/li>\n\u003cli>\u003cstrong>风险与市场事件\u003c/strong>：评级机构表示数据中心面临信用评级下调风险；纽约证券交易所期权交易因“技术问题”暂停；中东局势紧张推动布伦特原油价格创7个月来新高；美股长线资金和对冲基金本周整体适度净卖出，科技板块抛压集中。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>存储与算力\u003c/strong>：2027年供需格局锁定后的价格与融资担忧变化；27年算力需求及电力/存储瓶颈展望。\u003c/li>\n\u003cli>\u003cstrong>模型与Agent\u003c/strong>：Kimi K3.1 Pro完整权重11月4日前开源；Gemini 4 Argon模型升级与推理成本变化、与Anthropic深化模型及产品集成、27年Anthrop
