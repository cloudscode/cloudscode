（来源：财联社） 3. 上海发布单波400G硅光芯片及可编程AI推理芯片，集聚硅光企业近20家，未来产业基金规模约150亿元，\"硅光芯源\"孵化空间基本满租。（来源：财联社） 4. 字节分拆的AI制药企业新生探途完成2.9亿美元天使轮融资，投后估值15亿美元，字节持股56%维持控股。（来源：科创板日报） 🌍 国际 1. 黄仁勋表示，英伟达预计2027年芯片销量将达当前水平约两倍。太平洋通信团队指出，GPU/ASIC出货增加及光模块配比提高，光互联由Scale Out向跨机架拓展，英伟达、博通、台积电等加速布局CPO，产业链迎关键突破窗口。（来源：财联社） 2. Anthropic公布三项新指标力推行业透明。其中Claude已主导26%内部AI研发（AL4级），超90%工作达AI协作及以上水平。 3. SK海力士与英特尔就美国存储芯片生产展开初步谈判，方案包括租用英特尔俄亥俄州工厂部分产能或成立合资企业。消息公布后SK海力士股价上涨4%。（来源：财联社） 4. 苹果随iOS 27发布全新Siri AI测试版，具备个人上下文理解、跨系统操作及屏幕感知能力。采用\"端侧自研小模型+云端谷歌Gemini+英伟达/英特尔芯片\"混合架构，或推动iPhone 15 Pro以上用户换机。（来源：财联社） ☎️欢迎联系东北计算机团队#文字观点", "publish_time": "2026-09-21 08:18", "tags": ["文字观点"]}, "post:2026-09-21T22-17:dba2a307c151": {"id": "post:2026-09-21T22-17:dba2a307c151", "kind": "post", "title": "2026-09-21 22:17", "source_label": "帖子正文", "excerpt": "Muse 的单位不是一次推理。官方写法是每人一台 Secure VM：自己的浏览器、文件、凭证，旁边再放一个 Sentinel 挡出门。", "content": "Muse 的单位不是一次推理。官方写法是每人一台 Secure VM：自己的浏览器、文件、凭证，旁边再放一个 Sentinel 挡出门。 这台机器要能跑长任务、养 sub-agent、半夜排程。Token 仍走 GPU；编排、工具、sandbox、浏览器 session 是 CPU 的活。分析师把服务器 CPU 2030 年 TAM 往 1200-1700 亿推，CPU:GPU 从当 host 的 1:8 往 1:1 靠近。 那是表，不是出货单。 云端因此多一条账：模型答完之后，箱子还在填表、等回信、打电话。Meta 用免费额度抢人，小公司要对打的是 “看起来像专属的一台电脑”。 反方向是箱子留在自己家的边缘机。商家那头若还是网页等人点，对面会是不等人的软件。 “Meta 为 Muse 租了大量 VM” 到现在不是一张对得上的合同。7 月 Meta Compute 传闻走反方向，是把多余算力租出去。 Muse 若真一人一箱往上堆，内部先吃掉；堆不起来，才比较可能再拿去卖。#文字观点", "publish_time": "2026-09-21 22:17", "tags": ["文字观点"]}, "post:2026-09-21T07-27:c3494df1f1a4": {"id": "post:2026-09-21T07-27:c3494df1f1a4", "kind": "post", "title": "2026-09-21 07:27", "source_label": "帖子正文", "excerpt": "🔥🔥🔥【智谱ZCode代码上传争议：AI Agent加速进入企业，数据安全与可信数据空间价值重估】 事件：9月18日，智谱ZCode因代码库索引、Repo Wiki等功能可能涉及代码仓库数据上传引发市场关注，随后公司回应相关问题已完成修复，并表示将推动代码开源及引入第三方安全评估。我们认为，这一事件", "content": "🔥🔥🔥【智谱ZCode代码上传争议：AI Agent加速进入企业，数据安全与可信数据空间价值重估】 事件：9月18日，智谱ZCode因代码库索引、Repo Wiki等功能可能涉及代码仓库数据上传引发市场关注，随后公司回应相关问题已完成修复，并表示将推动代码开源及引入第三方安全评估。我们认为，这一事件真正值得关注的并非单一产品争议，而是AI Agent大规模进入企业之后，#“数据到底能不能出去、谁有权调用、调用过程能否追溯”正在成为新的刚性需求。 过去AI产业更多交易算力、模型和应用，下一阶段随着Agent开始接入企业代码库、数据库、知识库乃至核心业务系统，数据安全的重要性将快速提升。企业未来需要的不只是更强的模型，而是数据不出域、授权可控、全程可审计、合规可流通的一整套数据基础设施。AI时代真正稀缺的，#也将从普通数据进一步升级为“合法、合规、安全、可追溯的高质量数据”。 👉🏻👉🏻👉🏻产业链建议重点关注三个方向。 #海天瑞声：公司已经从传统数据采集标注向大模型数据服务升级，业务覆盖SFT、RLHF、DPO、模型评估以及代码、STEM等专业数据，同时2026年进一步切入可信数据空间，为国家级数据标注试点城市提供全栈式解决方案。其最大预期差在于同时具备AI数据语料+高质量数据集+数据治理+可信数据空间多重标签。 #铜牛信息：依托IDC、云计算及数据基础设施能力，逻辑更偏向数据不出域、可信流通和数据基础设施底座，若企业级AI进一步强调本地化部署与可信数据交换，产业映射有望加强。 #安妮股份：核心看点在数据确权、版权保护及数据资产流通体系。AI生成内容和企业数据使用规模持续扩大后，“谁的数据、谁能用、如何授权、如何追溯”将成为数据要素市场的基础规则。 ‼️ ZCode事件可能成为AI数据安全主题的一次催化。短期市场或先交易网络安全，若题材继续向数据不出域、可信数据空间、高质量数据集和数据确权扩散，海天瑞声、铜牛信息、安妮股份的辨识度值得重点跟踪。", "publish_time": "2026-09-21 07:27", "tags": ["海天瑞声", "铜牛信息", "安妮股份"]}, "attachment:files/0920早知道.pdf": {"id": "attachment:files/0920早知道.pdf", "kind": "attachment", "title": "0920早知道", "source_label": "其他", "excerpt": "左脚确认的是未来投入，右脚要回答的是这些投入最终能做成什么 。8 月底写《基本面的左脚已经伸 出来了》，讲的是 I 。", "content": "左脚确认的是未来投入，右脚要回答的是这些投入最终能做成什么 。 8 月底写《基本面的左脚已经伸 出来了》，讲的是 I 。最近把模型侧的进展连起来看，未来 R 的路径也变得更具体了。目前看到了前 瞻的指标，最终的确认就是落实到 ARR 数字上。 最近的变化串起来看看： RSI 提高后续智能进步的可能速度 → 金融、法律、 3D 扩大可交付的工作 → Jev 改善部分任务的经济性 → Muse 尝试把持续委托推向 C 端。放在一起看，模型能力、任务渗 透和商业转化，正在沿着不同环节往前走。 先说 RSI ，它影响的是未来模型进步的斜率。 AI 参与研发 AI ，意味着这条链可能形成反馈：模型更 强 → 能承担更多研究与工程任务 → 有效实验更多、迭代更快 → 帮助下一代模型进步。对投资来 说，如果这个反馈持续成立，就需要重新评估未来能力出现的时间，以及能力兑现到 R 的速度。 anthropic 周五的文章，里面有一些重要的数字： AI 正在从协作走向主导。 Anthropic 的研发自动 化指数显示， AI 主导、人在旁监督的工作占比， 3 月至 8 月依次是 1% 、 3% 、 12% 、 14% 、 22% 、 26% ， 很显然是从 5 月开始加速的 第二张图看工程产出： Agent 的价值开始体现为人均产出提高 。 Anthropic 的人均日代码合并 量，在 2025 年以前较平稳， 2025 年以后抬升， 2026 年 Q1 、 Q2 观测值达到此前均值的 5.8 倍、 8.0 倍。Q2 是原文发布时的部分季度数据。代码数量不等于有效研究成果，但这张图提示，人的工作 正在更多转向提出目标、检查结果和组织并行任务。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 第三张图更接近能力变化：复杂任务的成功率在追上简单任务 。 Anthropic 9 月18 日更新的图中， 开放式任务成功率从 2025 年8 月约26% ，升至 2026 年9 月初约 91% 。按端点约数计算，未成功比 例从74% 降到9% ，下降约 88% 。这有助于理解，为什么用户敢把更完整的任务交出去 Î¢ÐÅ£º WUXL3408 第 四 张 图 看 研 发 使 用 强 度 ， 这 个 加 速 是 从 7 月 开 始 的 。OpenAI 网 页 内 嵌 数 据 中 ， 每 位 研 发 员 工 每 日 的 估 计 Agent 输 出 ， 从 2 月1 日 约4.08 万 token ， 升 至 8 月15 日 约72.28 万 ， 约 17.7 倍 。7 月 初 至 月 底 增 加 约 31.47 万 ，6 月 增 加 约 4.98 万 ， 后 段 绝 对 增 量 确 实 明 显 放 大 。 同 期 ， 人 均 实 验 数 量 的 提 升 温 和 得 多 ： 1 月 初 约 为 2025 年 基 准 的 0.72 倍 ，8 月 中 旬 约 1.60 倍 。 这 两 条 线 放 一 起 ， 才 能 看 到 “ 使 用 更 多 ” 到“ 产 出 更 多 ” 之 间 仍 有 转 化 环 节 。 智谱提供的是另一种回报 ：模型帮助提高已有硬件的使用效率。 按唐杰与 GLM 团队披露， GLM-5.3 驱动的 Infra Agent 参与 GLM-5.3-Flash 在十万卡以上国产芯片集群上的适配和推理系 统优化，不到两周达到生产可用，吞吐达到初始基线的约 3 倍。这是包含人和工程方案在内的特 定系统结果。它的经济意义是，同一批硬件有机会承载更多有效任务，让国产算力的软件适配和 使用效率更快改善。 从应用场景看，金融、法律、 3D ，模型能力正在寻找 coding 以外的兑现路径 。 这些方向需要拆 开：金融和法律更接近已有专业预算里的任务渗透； 3D 目前更多体现交付物扩展与新生产流程的探 索。它们都增加未来 R 的可能性，但商业成熟度和兑现时间不同。 金融产品集中发布，说明竞争正在深入专业工作流。 9 月10 日，OpenAI 发布金融服务版，先面 向投行与股票研究； 9 月14 日，Anthropic 推出财富顾问产品，把托管、组合、 CRM 和会议工作连 接起来； 9 月17 日，Kimi 发布金融行业解决方案。三家的切口不同，但共同点是把数据、工具和 交付放进日常工作，金融场景也在从研究扩展到客户服务。 金融和法律首先有一笔相对容易计算的账：专业劳动贵，重复准备工作多，交付物也比较明 确。 数据整理、底稿、合同初审、会议准备这些任务，既耗时间，又有资料和规则可以辅助检 查。AI 不必一次完成整个职业，先稳定承担其中一段，就有机会产生付费价值。错误成本高也意 味着复核不能省略，因此应衡量包含返工和人工检查在内的总成本。 最近更具体的变化，是专业数据与工作环境开始补齐。 OpenAI 金融服务版将数据、引用和金融 交付物结合；法律版将专业检索、写作要求和行业工具结合。在其 200 道美国法律研究问题的内 部评测中，同样使用 Astra ，专业配置正确率 54.0% ，通用搜索方案 38.7% 。提升 15.3 个百分点， 说明能力兑现还可以来自配套环境改善； 54% 也提示当前适用范围和复核要求。 3D 的重点，是编码能力和视觉反馈开始服务新的交付物。 OpenAI 展示了通过 Astra 配合 Blender 、Unreal Engine 创建并修改建筑场景； Google 的 Gemini 3.8 Flash 展示了 3D 游戏和交 互式三维内容。模型可以借助代码操纵场景，再根据渲染结果继续修改，已有的编程与工具能力 因此有了新的应用出口。ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 各家重视 3D ，我认为同时有能力展示和产业扩张两层原因 。 三维场景能直观展示规划、编程、 视觉理解和工具协同，也对应游戏、美术、建筑可视化等付费生产活动。更长远看，它是空间内 容与交互的一条入口。但操作 3D 软件、原生 3D 生成、理解物理规律的世界模型，是不同层次； 一个好看的演示，仍需要经过可编辑性、稳定性和生产精度的检验。 再结合 Jev ，新的任务边界还需要更合适的成本结构 。 金融、法律、 3D 的工作流里，并非每个步骤 都需要最强模型。复杂推理之外，还有大量分类、字段提取、路由、评分和检查；这些步骤能否便 宜、快速地完成，会影响整条工作流能否算得过账。 Jev 提 供 了 一 条 值 得 观 察 的 分 工 路 线 。 TypeSafe 的 Jev 面 向 结 构 明 确 的 决 策 任 务 ， 输 出 预 设 类 型 的 结 果 与 置 信 信 息 。 公 司 公 布 输 入 价 格 为 每 百 万 token 0.042 美 元 、 输 出 免 费 。 类 型 正 确 不 等 于 判 断 正 确 ， 价 格 长 期 可 持 续 性 也 需 验 证 。 它 的 启 发 是 ， 强 模 型 承 担 复 杂 问 题 ， 专 门 模 型 承 担 大 量 重 复 判 断 ， 再 把 不 确 定 的 问 题 升 级 处 理 。 [12] 模 型 变 强 决 定 能 做 什 么 ， 任 务 成 本 下 降 决 定 多 少 工 作 值 得 交 给 它 。 包 含 调 用 、 工 具 、 失 败 重 试 、 数 据 授¿Û¿ÛºÅ1490929960 权 和 人 工 复 核 的 交 付 成 本 ， 才 是 客 户 的 账 。 成 本 降 低 ， 可 能 让 更 多 低 频 客 户 、 小 机 构 和 长 尾 任 务 开 始 采 用 AI ； ，也快于半导体全品类设备的整体增速。 细分市场规模： SOC测试机为最大细分领域，2025年市场规模为60-70亿美元，2026年增长至90亿美元左右，增长动力来自AI、复杂SOC产品需求。 存储测试机2024年市场规模为19亿美元，2025年增长至20亿美元左右，2026年进一步增长至27亿美元左右，增长动力来自HBM等高端存储产品需求。 3. 行业竞争格局与壁垒 全球竞争格局：测试机市场高度集中，爱德万、泰瑞达合计市场份额超过90%。 核心进入壁垒： 硬件技术壁垒：高端测试机需要同时处理高速数字信号、精密模拟测量、大电流供电，实现皮秒级时序，且需在数千个通道上保持参数一致性。 软件与平台壁垒：客户需要在设备平台上开发测试程序、调适量产参数、积累测试数据库，成熟平台可复用的测试IP、工程经验更多，新产品导入速度更快。 客户验证壁垒：测试设备误判会导致良品报废或坏品流出，头部客户极为重视设备稳定性、量产历史记录；更换供应商不仅需要重新采购设备，还需要迁移测试程序、接口件、工程流程，客户粘性极高、切换成本大。 4. AI时代测试设备需求增量来源 需求测算框架：测试设备容量需求由四个变量决定，分别为芯片出货数量、单颗芯片测试次数（测试插入点数量）、单次测试时长、单次并行测试芯片数量；传统周期仅芯片出货数量为核心变量，AI时代后三个变量均出现显著变化。 需求增量主线1：芯片出货量增长 WSTS预计2026年全球半导体市场规模将达到1.51万亿美元，存储芯片、AI相关逻辑芯片为核心增长动力，测试设备需求弹性高于芯片市场整体增速，因为增量集中在HBM、高性能逻辑芯片、先进封装产品，该类产品单颗测试时间、设备配置要求、测试插入次数均高于传统产品。 AI算力增长从“单芯片性能提升”“集群规模扩大”两个方向双重拉动测试需求：集群扩容直接增加高端逻辑芯片测试基数，单芯片升级提升测试难度与单颗测试价值；当前AI基础设施处于性能、数量同步增长阶段，测试设备需求弹性更大。 下游服务器出货支撑：2026年全球服务器出货量预计增长12.8%，其中AI服务器增速超过28%；同时AI应用从训练向推理渗透，将带动通用服务器、推理服务器、边缘AI端侧设备的芯片需求。 ASIC芯片渗透贡献增量：2026年ASIC芯片出货占比预计提升至27.8%，云厂商自研芯片持续渗透；GPU、ASIC均属于高复杂度逻辑芯片，且设计差异带来测试程序、板卡配置、接口方案的不同需求，既扩大高端逻辑芯片总量，也增加测试平台多样性、提升单台测试机占用时间。 需求增量主线2：芯片复杂度提升 Chiplet架构带来新测试需求：先进封装下测试对象从单颗Die扩展为封装内系统，需覆盖Chiplet自身参数、封装内互联、系统级协同三个层级；多Die封装后内部节点可观测性下降，需要更复杂的同步时序、高速数字资源，也提升了测试程序开发难度。 HBM产品拉动存储测试需求：HBM为DRAM三维堆叠系统，测试覆盖DRAM裸片、Base Die、TSV互联、堆叠后整体功能多个环节；以HBM4为例，接口宽度提升至2048位、通道宽度增加至32个，对并行测试资源、信号完整性、供电/热管理的要求大幅提升。 测试覆盖率价值凸显：以16颗3nm Die组成的系统为例，成熟制程下故障覆盖率从50%提升至90%-95%时，系统成本从约1150美元下降至550美元；未成熟制程下总成本从接近2900美元下降至600-650美元，高端测试设备价值被重估。 需求增量主线3：测试环节增加 测试流程从过去“CP（晶圆测试）+FT（成品测试）”两段式，转变为包含CP、Die级测试、FT、老化测试、SLT的多阶段链路，同一芯片还会根据不同温度、电压、频率条件进行多轮测试、分档、复测。 测试次数显著提升：根据爱德万口径，当前先进芯片的测试次数较2020年初增加了15-25次，从过去个位数提升至10-20次；以HBM为例，除DRAM晶圆、Base Die测试外，堆叠后还需增加3-4次以上的堆叠级测试，覆盖不同温度参数、高速接口、可靠性。 并行测试效率下降：HBM的高Pin数、高功耗、信号完整性要求限制了单次同步测试的器件数量，进一步提升了测试机台的需求。 5. 国内测试设备需求支撑 封测厂商资本开支回升：2025年国内封测龙头厂商资本开支同比2024年实现双位数增长，2026年上半年资本开支维持高位，体现下游产能利用率改善、扩产意愿提升。 具体扩产项目：长电科技2026年Q1公告在上海临港区建设先进封测工厂，总投资78亿元，2026年全年固定资产投资额约100亿元；甬矽、华天、通富、盛合晶微等国内先进封测厂商也在积极扩充测试产能，拉动测试设备需求。 国产替代机遇：海外龙头爱德万扩产节奏偏保守，交期较长，在当前测试设备需求紧迫的背景下，为国内半导体测试设备厂商带来发展机会，利好国产替代进程。 6. 后道测试设备龙头更新 长川科技：昇腾&韬定律设备第一股，后道测试里的平台型龙头。昇腾960进展超预期，公司GPU测试机放量。昇腾960芯片研发进度超出预期，960DT比原计划提前三个季度，2027Q1就绪；960PR比原计划提前一个季度，2027Q3就绪。考虑在芯片研发设计阶段测试机就要深度参与，且公司作为昇腾全系列相关测试设备本土供应商，调研了解昇腾960测试设备同样已经突破。26年公司昇腾测试机快速放量，预计整体GPU测试机收入有望达到10亿级别。不止麒麟手机芯片，韬定律将应用于昇腾。2028和2029年，华为将陆续推出昇腾970、980芯片，性能大幅提升，其中最重要的技术创新将依托τ定律，测试设备作为韬定律需求最大的设备品类，量价膨胀逻辑将再次提升，公司将充分受益，是韬定律设备第一股。年底前预计北美CPU龙头大单催化有望落地。 精智达：业务转型已进入收入兑现期：公司已完成从显示检测设备向半导体存储测试设备的业务重心切换，2026年上半年实现营收8.04亿元，同比增长81%；归母净利润同比增长约60%，其中半导体测试设备收入同比增长147%，收入占比超过九成，成为业绩弹性主要来源。增长确定性强，超额提前完成年内50亿订单目标，部分设备已交付并确认收入，批量交付能力得到验证，订单延续性较强。产品布局持续推进，短期增量，HBM CP测试和高速FT测试设备已在现有订单中，处于交付阶段，年内将争取确认收入，产品结构将进一步优化；中期成长，18G高速FT项目关键芯片测试效果良好，ATE前端硬件样机、客户工程验证机正在推进；SOC测试设备已对接五家核心客户，若验证顺利，业务将从存储测试延伸至更广泛的高端芯片测试领域，打开成长上限。研发投入充足，2026年上半年研发投入超1.5亿元，同比增长154%，占收入比例接近两成，短期压制利润释放，但为后续增长提供动能，当前正处于业绩释放与产品升级共振的加速期。 金海通：华为加持下，业绩增速领跑半导体测试设备。26Q3业绩预计加速释放，环比有望大幅增长50%，26全年预计订单17亿，封测需求持续高景气；27上半年，海外新增订单放量+华为AI算力芯片等订单+存储分选机放量；27年业绩弹性显著，业绩/订单增速领先。客户覆盖全球头部封测企业和IDM厂商，包括安靠/长电/通富等封测厂商；拟在上海青浦区华投资建设上海澜博半导体设备制造中心建设项目，进一步扩大产能规模。 ---xz#文字观点", "publish_time": "2026-09-21 08:23", "tags": ["文字观点"]}, "post:2026-09-21T07-47:79fe4f0e4358": {"id": "post:2026-09-21T07-47:79fe4f0e4358", "kind": "post", "title": "2026-09-21 07:47", "source_label": "帖子正文", "excerpt": "📌AMD 高级软件系统设计师谈 SK 海力士 HBM 行业领先地位及其长期挑战专家视角：客户方（AMD 高级软件系统设计师） 分析师视角：买方机构投资者 📖概述 🔹一位拥有 7 年半导体从业经验的 AMD 高级软件系统设计师（工作方向涵盖服务器 CPU/GPU、内存子系统以及 HBM/DDR 可靠性", "content": "📌AMD 高级软件系统设计师谈 SK 海力士 HBM 行业领先地位及其长期挑战专家视角：客户方（AMD 高级软件系统设计师） 分析师视角：买方机构投资者 📖概述 🔹一位拥有 7 年半导体从业经验的 AMD 高级软件系统设计师（工作方向涵盖服务器 CPU/GPU、内存子系统以及 HBM/DDR 可靠性验证，不负责采购业务），围绕 DRAM 与 HBM 赛道的竞争格局展开讨论。本次对话重点探讨 SK 海力士对比三星和美光的行业地位、国内公司长鑫存储等参与者的可信度、HBM 良率面临的技术壁垒，以及 SK 海力士在 AI 驱动的 HBM 需求下业务集中度持续走高所带来的各类风险。 ✅核心要点 🔹SK 海力士能够在 HBM 领域保持领先，根源在于率先实现 HBM3/HBM3E 商业化落地，并与英伟达开展深度联合验证工作，并非依靠从根本上更优越、更持久的技术。 🔹三星在传统服务器 DRAM 以及存量 DRAM 领域依旧是实力更强的参与者；LPDDR 赛道被认为是 SK 海力士、三星、美光三家公司实力相当、具备真实竞争关系的市场。 🔹至少到 2028 年，HBM 市场仍将处于供给受限状态，SK 海力士、三星、美光三家寡头格局不会改变；长鑫存储与 YMTC（长江存储）预计要到 2028 至 2029 年前后，才会成为具备全球影响力的竞争对手。 🔹长鑫存储的 HBM 良率预估远低于三大头部厂商 60%-65% 的水平（可能不足 30%），受限原因主要是尚未成熟的硅通孔互连技术以及芯片键合技术。 🔹如果 SK 海力士只是对现有产线进行重新调配，而非投入资金购置全新设备，那么将产能转向 HBM 的做法，会带来传统 DRAM 与 LPDDR 供给收紧的风险。 🔹SK 海力士最大的短板在于业务集中风险：约 50% 的收入份额依托 AI 超级周期，同时产能扩建还受到设备交付周期较长、封装人才稀缺等因素制约。 🔹与英伟达这类客户开展深度协同设计，使得 HBM 产品的同质化属性减弱，巩固了 SK 海力士的竞争护城河，但同时也加深了该公司对少数超大规模算力与加速器合作方的依赖。 🧩SK 海力士的 HBM 行业地位 🔹这位专家认为，SK 海力士的领先优势来自验证速度，以及和英伟达紧密的反馈闭环。这一优势在后续几代 HBM 产品中进一步转化为更优良率，以及更强的客户锁定效应。 🔹“SK 海力士以往的优势来自极早完成验证并实现量产成熟…… 并不是基础技术耐久性层面的优势。” 🔹他明确表示，没有任何一家公司拥有与生俱来的技术耐久优势，技术差距具有代际属性，取决于哪家供应商能够最快完成对应标准（例如 HBM4、DDR6）的大规模量产验证。客户依旧可以根据供给情况、技术路线规划、定价，或是在给定周期内更优的能效与热性能，转而选择三星或者美光。 📀传统 DRAM 与 LPDDR 🔹抛开 HBM 业务，依靠产能规模优势，三星在消费级服务器 DRAM 和存量 DRAM 领域明显领先，专家预计 SK 海力士在五年内无法追上这一差距。与之相对，随着服务器平台（包含英伟达 Vera Rubin 系统）越来越多地采用低功耗内存，LPDDR 赛道呈现出三家公司势均力敌、真实竞争的格局。 🇨🇳国内竞争者（长鑫存储、长江存储） 🔹长鑫存储在通用 DRAM 和 LPDDR 领域，可算作报价激进、具备竞争力的第四家供应商，但受硅通孔互连技术以及规模化芯片键合技术的研发难度限制，该公司暂时还无法成为 HBM 赛道有力的竞争者。 🔹“我的猜测是良率会低于 30%。”—— 这是专家对长鑫存储 HBM 芯片良率的判断，而三大头部厂商的良率预估在 60%-65% 区间。 🔹专家提出，国内供应商对全球 HBM 市场形成实质性威胁最早也要到 2028 至 2029 年，同时指出，即便追赶方努力缩小差距，三大头部厂商也在持续迭代技术。 ⚙️产能、约束条件与风险 🔹HBM 扩产会和传统 DRAM、LPDDR 生产争抢相同的前端设备。因此，除非配套新增资本设备，而不是复用现有产线，否则激进的 HBM 产能扩张会造成其他品类供给收紧。光刻设备交付周期漫长，以及中国台湾地区以外封装工程人才短缺的问题，进一步加剧了这项挑战。 🔹“如果 SK 海力士退出 LPDDR 赛道…… 三星将会形成垄断。” 🔹专家提出的核心风险逻辑：SK 海力士目前大约一半 HBM 相关收入来自 AI 驱动的需求周期，而这类周期历史上容易出现增速放缓；和英伟达这类客户越来越紧密的协同设计利弊共存，既加固了 SK 海力士的竞争壁垒，也加深了公司对该合作关系的依赖。#文字观点", "publish_time": "2026-09-21 07:47", "tags": ["文字观点"]}, "post:2026-09-21T07-56:2715720eca1d": {"id": "post:2026-09-21T07-56:2715720eca1d", "kind": "post", "title": "2026-09-21 07:56", "source_label": "帖子正文", "excerpt": "台积电推进 CoPoS 布局 台供应链卡位📋台湾 CoPoS 潜在供应链业者制程模组：玻璃核心基板，主要设备 / 技术为玻璃面板，台湾供应商：群创、友达 制程模组：RDL 金属化，主要设备 / 技术为湿式制程 / 平台，台湾供应商：弘塑、辛耘 制程模组：检测与量测，主要设备 / 技术为玻璃自动 X ", "content": "台积电推进 CoPoS 布局 台供应链卡位📋台湾 CoPoS 潜在供应链业者制程模组：玻璃核心基板，主要设备 / 技术为玻璃面板，台湾供应商：群创、友达 制程模组：RDL 金属化，主要设备 / 技术为湿式制程 / 平台，台湾供应商：弘塑、辛耘 制程模组：检测与量测，主要设备 / 技术为玻璃自动 X 光检测 / 自动光学检测、键合 / 斜角检测、重叠量测 / 量测，台湾供应商：德律、大量、晶彩科 制程模组：键合贴合，主要设备 / 技术为混合键合，台湾供应商：均豪 制程模组：热处理，主要设备 / 技术为烘烤，台湾供应商：志圣、印能科技 制程模组：模封 / 填胶，主要设备 / 技术为模塑 / 点胶，台湾供应商：万润 台湾 CoPoS 潜在供应链业者 🔹台积电传近期多次造访友达中科厂，除洽谈厂房交易外，背后更牵动下一代 CoPoS 先进封装布局。随 AI 芯片尺寸持续放大，台积电推进封装载板「由圆转方」，并布局玻璃核心基板技术，供应链认为，友达累积的大尺寸面板制程、玻璃加工及厂务基础，与面板级封装所需技术具有部分共通性。 🔹CoPoS 与现行 CoWoS 最大差异之一，在于封装载板由圆形晶圆走向方形面板。半导体业界分析，台积电日本 3DIC 研发中心已投入玻璃基板相关技术开发，实验结构涵盖 TGV、RDL，以及 GPU、HBM 等元件整合。据了解，玻璃核心基板在共平面性、热膨胀系数与刚性等物理特性具有改善空间，也使玻璃材料被视为 CoPoS 后续扩大封装尺寸的重要选项。 🔹制程方面，TGV 将是供应链竞争焦点。目前市场较看好超快雷射搭配湿式蚀刻技术，先以皮秒或飞秒雷射进行玻璃改质，再透过化学蚀刻形成孔洞，可降低传统雷射加工造成的热应力与微裂痕；TGV 完成后，仍须经清洗、镀铜、CMP、RDL 等多道制程。随 RDL 层数持续增加，设备、化学品与材料需求同步升高。 🔹检测将成 CoPoS 量产最重要关卡之一。业者分析，玻璃在雷射钻孔、镀铜及热制程后若产生微裂痕，可能一路延伸至相邻 TGV，影响电性与后段封装良率。供应链因此导入 AOI、3D NIR、X-Ray 等不同检测技术，其中镀铜后内部微裂痕因一般光学难以穿透，X-Ray 被视为重要解决方案。 🔹台供应链亦提前卡位。市场目前锁定群创、东捷、钛昇等玻璃加工与雷射相关业者；湿式制程、清洗及金属化设备则包括辛耘、弘塑；后段热制程与自动化设备可关注万润、志圣、印能科技、群翊；随玻璃微裂痕检测难度升高，牧德、晶彩科、致茂、大量、卓特等量测、检测与失效分析业者亦具切入机会。#文字观点", "publish_time": "2026-09-21 07:56", "tags": ["文字观点"]}, "post:2026-09-21T08-26:abae5985122f": {"id": "post:2026-09-21T08-26:abae5985122f", "kind": "post", "title": "2026-09-21 08:26", "source_label": "帖子正文", "excerpt": "【广发电新】周观点更新：锂电规划引导与出口共振，绿氢氨醇商业化实现里程碑突破260920#锂电：规划引导与出口增长共振、锂电出货增长可期。近日，九部门印发《智能网联新能源汽车产业发展“十五五”规划》，提出2030年新能源乘用车、商用车新车销量占比目标分别达70%、40%。", "content": "【广发电新】周观点更新：锂电规划引导与出口共振，绿氢氨醇商业化实现里程碑突破260920#锂电：规划引导与出口增长共振、锂电出货增长可期。近日，九部门印发《智能网联新能源汽车产业发展“十五五”规划》，提出2030年新能源乘用车、商用车新车销量占比目标分别达70%、40%。规划聚焦动力电池安全、充电倍率、低温性能，同时强化产能预警调控。8月国内新能源汽车产销分别完成165.3万辆、164.3万辆，同比增长18.9%、17.8%，新车渗透率60.6%，电动化主导地位持续巩固。出口表现亮眼，当月出口52.6万辆，同比大幅增长134.6%，为锂电产业链带来显著增量。 电池端推荐【宁德时代】，关注【比亚迪、维科技术】等；材料端：VC价格上涨，关注【华盛锂电、孚日股份、富祥药业】等；关注【新宙邦、多氟多】等；AI拉动HVLP铜箔需求，推荐【德福科技】，关注【铜冠铜箔、宝鼎科技、泰金新能】等；铝箔受益于钠电渗透，关注【鼎胜新材、万顺新材】等；负极估值具有安全边际，关注【尚太科技、中科电气】等；铁锂盈利改善，推荐【富临精工】，关注【湖南裕能、万润新能】等。#风电：十五五风电规划增量明确、海风中长期增量中枢确定性上移。规划明确2030年风光累计装机突破28亿千瓦，十五五年均新增风光装机2亿千瓦，较十四五翻倍增长，增量力度显著提升。海上风电十五五新增开工规模1亿千瓦、2030年累计装机破1亿千瓦，年均装机强度同比提升23%。海外市场资本投入回暖、电价机制优化等边际改善持续落地，行业底部修复态势明确，修复性成长机会凸显。 整机关注【金风、明阳、三一、运达】；桩基及塔筒关注【大金、海力、天顺、泰胜】；零部件关注【新强联、德力佳、金雷、通裕、时代新材】等。#绿氢氨醇：国内氢氨醇产业实现商业化出海里程碑突破、作为新能源非电利用核心赛道、成长与出海逻辑持续兑现。根据风芒能源消息，2026年9月金风科技百万吨级绿色甲醇项目完成首批产品跨境发运，标志风电制氢耦合生物质制甲醇技术路线完成产业化闭环，国内氢氨醇产业正式从示范阶段迈入规模化商业出口阶段。行业出海合规优势突出，认证体系全面对标欧盟、韩国绿色能源规则，全球化出海通道基本打通。目前行业依托海外绿色燃料高溢价及头部企业长期海外长单锁定，项目已具备阶段性盈利空间，长期随着绿电降本、产能规模化释放、出海配套完善，行业盈利水平有望持续提升。 关注【嘉泽新能、金风科技、佛燃能源、电投绿能】等。#文字观点", "publish_time": "2026-09-21 08:26", "tags": ["文字观点"]}, "post:2026-09-21T07-24:2a729816833f": {"id": "post:2026-09-21T07-24:2a729816833f", "kind": "post", "title": "2026-09-21 07:24", "source_label": "帖子正文", "excerpt": "9月21日：人工智能部队、MLCC、存储芯片、固态变压器等概念股梳理 一、昨夜发酵消息精选。1、人工智能部队：9月20日讯，特朗普声称，他将组建一支“人工智能部队”。", "content": "9月21日：人工智能部队、MLCC、存储芯片、固态变压器等概念股梳理 一、昨夜发酵消息精选。 1、人工智能部队：9月20日讯，特朗普声称，他将组建一支“人工智能部队”。特朗普说，为组建“人工智能部队”，他将在不久后任命一名人工智能事务“总管”。他称，人工智能代表着下一场工业革命或互联网浪潮，其规模和影响力将更大，甚至可能占到美国国内生产总值的25%。特朗普还在帖文中抨击激进的民主党人“企图摧毁人工智能”，称“我们绝不会以任何方式阻碍或扼杀这个令人瞩目的产业发展。相反，我们要珍视它、扶持它，并守护它的成长”。他同时表示，美国将借现有的刑事与民事司法体系，严惩人工智能相关不法行为。 概念股：启明星辰、奇安信、深信服、天融信、永信至诚、中孚信息、安恒信息、绿盟科技、格尔软件、中新赛克、云从科技、拓尔思、华如科技、观想科技等。 2、MLCC概念：“电子工业大米”MLCC一小时一价，最高涨十倍。据央视财经报道，近期元器件市场走出极端分化行情：AI拉动高容量型号缺货疯涨，部分现货暴涨数倍；普通消费级产品冲高回落，一冷一热的背后，是AI算力浪潮的搅动。 概念股：风华高科、三环集团、鸿远电子、火炬电子、国瓷材料、博迁新材、昀冢科技、商络电子、洁美科技、宏明电子等。 3、存储芯片：美股存储芯片周五持续走强，闪迪涨逾10%。9月20日，在2026世界制造业大会上，长鑫科技宣布第五代技术平台正式量产。据介绍，长鑫科技将内存阵列有源区半间距做到11.95纳米，存储器电容深宽比45:1，核心动能区高度降至6762纳米，同时，第五代工艺平台的存储密度有了大幅提升，同等条件下，每张晶圆的产出，与上一代平台相比提升了50%以上。基于该平台打造的24GB LPDDR5X产品已经进入正式量产，全面进入国产主流旗舰手机。 概念股：长鑫科技、深科技、德明利、江波龙、佰维存储、兆易创新、澜起科技、北京君正、普冉股份、东芯股份、国科微、香农芯创、朗科科技、同有科技等。 4、固态变压器：在双碳战略持续落地、新能源产业高速扩容与AI算力基建全面爆发的多重驱动下，国内电力设备行业正迎来一轮颠覆性迭代。传统工频变压器沿用数十年的电磁转换模式，已难以适配智能电网、新能源并网、超充基建与算力中心的新型用电需求。在此背景下，被誉为“能源互联网核心组件”的固态变压器（SST）快速崛起，凭借高效电能转换、灵活智能调控、小型轻量化等核心优势，成为电力设备领域最具潜力的全新赛道。权威行业机构预测，随着技术持续成熟、量产成本稳步下探，固态变压器市场将快速扩容，未来数年有望成长为千亿级蓝海市场，彻底改写传统电力设备产业格局。 概念股：阳光电源、中国西电、智光电气、金盘科技、新特电气、华润微、科士达、道通科技、可立克、四方股份等。 5、创新药：据外媒披露，2026年9月18日，路透社援引3名听取简报的匿名消息人士称，美国财政部正在草拟针对中国投资的新规。规则尚未定案、内容仍可能调整，若特朗普亲自介入，政策方向也可能变化。但已经透出的信号足够反常：只要不涉及生物武器或敏感病原体，美国制药公司将明确获准继续投资、引进中国企业研发的新药，比如癌症药、糖尿病药。9月19日讯，Anthropic被曝着手建设湿实验室（Wet Lab），用于开展生物学研究。 概念股：药明康德、昭衍新药、凯莱英、康龙化成、华大基因、泓博医药、成都先导、美迪西、皓元医药、药石科技、百普赛斯、义翘神州、博济医药、泰格医药等 6、外贸出口：当地时间9月20日上午，中美两国经贸团队在美国纽约开始举行中美经贸磋商。市场预期后续外贸出口数据向好，纺织服装、跨境电商、户外家居、家电出口链迎来资金布局。 概念股：华纺股份、龙头股份、真爱美家、华瓷股份、浙江正特、德豪润达、阳光照明等。 7、机器人：9月20日电，无人机视频显示，特斯拉Optimus在美国得州的专用生产线建设主结构可能接近完工，钢结构、混凝土浇筑等施工正同步推进。该生产线计划2027年计划投产，年产内容源头加微信 WUXL3408能目标在1000万台。 概念股：三花智控、拓普集团、科达利、昊志机电、卧龙电驱等 8、伊朗重建：据央视新闻报道，当地时间9月19日，僵持的美伊谈判似现重启可能。伊朗方面称已向美政府传达7项谈判条件，此外，消息人士称美方已准备好与伊朗进行谈判且“态度认真”。 概念股：北方国际、中工国际、中国化学、中油工程、石化油服、中国电建、双良节能、厦工股份、中成股份、中钢国际等。 9、银发经济：国常会，深入实施积极应对人口老龄化国家战略，培育银发消费新场景，更好满足老年人消费需求。 概念股：鱼跃医疗、翔宇医疗、伟思医疗、悦心健康、南京新百、双箭股份、可靠股份、奥佳华、康力电梯、汤臣倍健、创业慧康、九安医疗、可孚医疗等。 10、房车消费：国办转发文化和旅游部等十部门《关于促进房车消费的若干措施》的通知，引导有条件的地区整合文化和旅游资源，打造一批特色房车旅游线路。（宇通客车、上汽集团、江铃汽车） 11、文化传媒：周一复牌！新华传媒拟购买界面财联社100%股权。周五晚间消息，《文化产业发展“十五五”规划》印发：推动人工智能与内容创作、传播分发、消费体验等产业链重点环节深度融合。（新华传媒、中文在线） 12、农机：两部委印发《全国农业机械化发展“十五五”规划》到2030年，农业机械化高质量发展取得显著成效，农作物耕种收综合机械化率超过80%。（一拖股份、星光农机。） 13、钙钛矿电池：钙钛矿光伏领域首个国家标准发布，《光伏器件第12部分：钙钛矿光伏电池及组件的电流-电压（I-V）特性测量方法》（GB/T 6495.12—2026），将于2027年正式实施。（钧达股份、捷佳伟创） 14、商业航天：一周六箭！政策利好密集释放商业航天迈向高密度发射新阶段。（中国卫星、航天电子） 15、高校改革：中办、国办印发《关于分类推进高校改革的意见》。（科大讯飞、新道科技） 16、玻璃基板：康宁宣布受汇率及通胀因素影响，公司将在全球范围内对以日元计价的显示玻璃基板产品实施15%及以上的价格调整，并将于2026年第四季度开始生效。（沃格光电、帝尔激光） 17、全球市场：美股三大指数涨跌不一，“科技七巨头”涨跌分化，英伟达涨1.34%，亚马逊涨1.00%，谷歌涨0.64%；Meta跌2.43%，微软跌0.80%，特斯拉跌0.53%，苹果跌0.26%。半导体板块走强，存储芯片股领涨，费城半导体指数尾盘快速拉升，收涨2.78%。个股方面，闪迪大涨约11%，Coherent涨超7%，希捷科技涨超6%，西部数据涨超4%，美光科技涨超3%，AMD、SK海力士涨逾2%。加密货币概念大涨，Strategy涨超16%，MARA Holdings涨超13%，Coinbase涨超11%，Robinhood涨超9%，Bitmine、Cipher涨超8%，Circle涨超7%。 二、个股新增概念精选。 1、玻璃基板（麦格米特、艾森股份、天承科技） 2、风电（滨海能源） 3、AI智能体（金盘科技） 4、短剧游戏（北京文化） 5、光纤概念（华菱线缆） 6、眼科医疗（迈威生物） 7、PCB概念（菲林格尔） 8、物业管理（城建发展）", "publish_time": "2026-09-21 07:24", "tags": []}, "post:2026-09-21T07-26:cd0252943fbb": {"id": "post:2026-09-21T07-26:cd0252943fbb", "kind": "post", "title": "2026-09-21 07:26", "source_label": "帖子正文", "excerpt": "【光大电新-周观点0920】AIDC电源随双创反弹，平衡配置红利资产与内需板块双创指数如期反弹，AIDC电源板块跟随上涨，需重视该窗口期行情演绎；但我们预计本次反弹非反转，红利资产或内需板块虽短期承压，仍需坚持平衡配置策略，重点关注电力设备、海风板块，锂电尚未到配置窗口期。", "content": "【光大电新-周观点0920】AIDC电源随双创反弹，平衡配置红利资产与内需板块双创指数如期反弹，AIDC电源板块跟随上涨，需重视该窗口期行情演绎；但我们预计本次反弹非反转，红利资产或内需板块虽短期承压，仍需坚持平衡配置策略，重点关注电力设备、海风板块，锂电尚未到配置窗口期。 （1）电力设备：科技如期反弹，AIDC电源板块将跟随β有所表现，建议关注：麦格米特、四方股份、特锐德、横店东磁。反弹窗口期尾声，内需板块与红利资产或是配置重点，“六张网”投资是拉动内需的重要手段，Q3后建议关注：平高电气、长高电气、思源电气。 （2）锂电：板块短期尚未到配置窗口期。短期来看AIDC电源BBU相关跟随科技反弹，当前建议关注蔚蓝锂芯；一二线电池厂商短期虽可能超跌反弹，但当前并不是较好的配置窗口期，需耐心等待。 （3）海风：26-27年板块业绩压力较大，但政策或推动27年海风招标上行。考虑板块股价位置较低，深远海政策、欧洲海风进展等都将成为重要催化剂，建议关注：东方电缆、海力风电、天顺风能、大金重工。 （4）储能：海外需求持续增长，大储层面欧美贸易政策目前成为关键，目前市场预期中性偏悲观，若出现积极变化有利于板块反弹；户储层面当前数据较好，但市场无法对27年需求做出准确判断；此外，全球厄尔尼诺暖冬概率较大，全球地缘政治局势变化将影响大宗能源品价格，需重点关注26年11月份窗口期。 （5）氢氨醇：我国“十五五”规划将其作为重点布局的六大未来产业之一，长期持续看好，短期内国际海事组织投票和国内氢能规划政策有望形成催化。建议关注石化机械、华电科工、电投绿能。 ⚡风险提示：新能源国内外政策风险；需求、技术发展不及预期风险。 ☎光大电新公用环保团队：殷中枢、郝骞、宋黎超、陈无忌、邓怡亮#文字观点", "publish_time": "2026-09-21 07:26", "tags": ["文字观点"]}, "post:2026-09-21T08-22:c1c3a230b2a6": {"id": "post:2026-09-21T08-22:c1c3a230b2a6", "kind": "post", "title": "2026-09-21 08:22", "source_label": "帖子正文", "excerpt": "机构观点市场策略交流·先知研报独家要点整理： 1、整体行情判断：未来1-2个季度（2027年3月前）上证指数为横盘震荡走势，既无大涨创新高的预期，也无大跌创新低的预期，核心震荡区间为3800-4200点，底部区域为3700-3800点。节奏上，2026年四季度为偏弱震荡，区间3800-4000点", "content": "机构观点市场策略交流·先知研报独家要点整理： 1、整体行情判断：未来1-2个季度（2027年3月前）上证指数为横盘震荡走势，既无大涨创新高的预期，也无大跌创新低的预期，核心震荡区间为3800-4200点，底部区域为3700-3800点。节奏上，2026年四季度为偏弱震荡，区间3800-4000点；2026年12月至2027年一季度为偏强震荡，指数有向上空间。当前A股外部宏观压制逐步解除，正处于情绪阶段性修复反弹的节点，9月整体行情预期为震荡上涨，战略上保持乐观，战术上短期或存在回踩需谨慎做多；若后续出现连续快速大幅上涨，则需注意波动风险，即是逐步减仓时机；两国领 导人会面在9月24-25日，之后按惯例潜规则是国庆维稳，维稳结束后10月份可能会走一波兑现行情；到年底预计会出现一次月度维度的上涨行情，资金布局开门红与春季躁动。 2、指数表现判断：宽基指数中成长类指数（科创创业、科技龙头、中小盘成长）涨幅将领先于上证指数、沪深300，未来行情中双创（科创板、创业板）指数将持续跑赢上证指数，核心支撑逻辑包括： ①重要IPO主要集中在双创板块，资金有较强的行情护盘动力； ②2025年9-10月的开 户潮用户，2026年9月起可逐步开通双创交易权限，将带来增量资金； ③双创衍生品预计2026年四季度上市，将提升对双创底层资产的配置需求。 3、指数级行情观察信号：指数级行情需要三个条件支撑，目前已具备两个，第三个为核心观察项： 已具备：增量资金入场，市场成交额从1.6万亿元回升至2万亿元，增幅超30%，但融资余额仅增加23.25亿元（增幅0.1%），说明本次上涨并非杠杆资金主导，增量资金以中长期资金为主，资金持有周期更长、稳定性更强，不会像杠杆资金一样在下跌过程中放大抛压，与历史上杠杆催生的快速反弹有本质区别。 已具备：政 策层面支持，明确推动直接融资和间接融资协调发展，股票融资规模首次超过新增人民币贷款，权益市场在资源配置中的定位系统性提升，人民币汇率达6.70，为2023年1月以来新高。 待验证：权重板块能否配合修复，目前沪深300、上证50仍处于下跌状态，银行、保险、白酒等传统权重板块未出现上涨，仅房地产在9月18日出现单日上涨，权重修复为指数级行情的决定性条件。 4、中美元首会晤展望：2026年9月24日（中国时间）的中美元首会晤为9月核心地缘事件，需要注意过去几年A股逢重大事件必兑现的特征。本轮中美经贸主要围绕续签吉隆坡共识的降税以及第二轮扩大降税，范围主要包含低价值商品（出口受益），如小件商品、家用电器、低价值消费电子、纺织类、食品。AI涉及两国核心国力竞争，自主可控是双方必修课，谁也不愿也不会放缓，也需要进一步拖慢对方追赶速度，扩大优势领域差距，所以达成共识的空间有限。 北京时间2026年9月21日上午：关注中美经贸团队纽约会谈结果，可跟踪美方谈判代表贝森特、格里尔的采访及官方通告。 北京时间2026年9月25日（中秋节）上午：关注中美国宴相关信息，重点跟踪两国领 导人发言、到访美国的中国企业家名单。 北京时间2026年9月26日：关注美方发布会、官方通告及特朗普相关说明，完整把握本次外交活动的进展。 5、联储加息解读：美国通胀核心决定因素是地缘政治，其次才是美联储政 策，只有战争缓和、油价回落，通胀问题才能根本解决，当前美联储鹰派加息是避免通胀预期脱锚的相对优选项。点阵图暗示大概率2026年12月仍有1次25BP的加息，这一预期目前尚未被市场充分定价，本次加息并非完全利空出尽，后续两次会议前市场或重新交易加息逻辑。地缘政治仍是资产定价的决定性变量，战争结束才是长端利率确定性下行、金融资产从利空彻底转向利好的节点。当前处于利空逐步出尽的过程，还不算海外风险靴子完全落地。 6、后续宏观风险：中东局势明显升温，胡塞、沙特已参与本轮地缘博弈，土耳其、伊拉克也可能主动或被动卷入，停火协议较难达成。伊朗明确计划在中期选举前推高油价、通胀以获取谈判筹码，特朗普无法有效解决霍尔木兹海峡、曼德海峡的冲突问题，已无能力在选举前压低油价，特朗普本人也公开表示油价要等到中期选举后才会回落。美国中期选举前油价或维持当前水平，中期选举后油价存在上行甚至突破历史新高的风险，若该风险兑现将对全球流动性造成更大冲击，是Q4需要重点警惕的风险点。 7、美国中期选举影响：11月开始的美国中期选举会影响全球市场产生避险交易，当前市场预期民主党横扫两院的概率已超过60%，且仍在进一步提升，共和党守住一个议院已属较好结果。民主党若胜选的政 策方向，将继续弹劾特朗普，对AI实施严监 管，财政紧缩，对大型科技企业加税，收紧美国数据中心相关政 策。数据中心用电体量过大影响居民电价，民主党借此攻击共和党，政 策若落地则影响体现为项目审批时间变长、建设成本上升。所以若民主党两院横扫的预期持续升温，AI资本开支、海外风险偏好、海外经济预期都面临下修风险。 8、市场风格变化：并非回避机构股，而是机构重仓的大市值股在四季度流动性减量环境下难有大反弹，仅存在小反弹机会，并非产业逻辑存在问题，而是交易结构不佳（如部分标的股东户数暴增，持有者结构分散，拉升需要消化分歧与大量资金），大反弹窗口期或在2026年12月至2027年一季度的开门红与春季躁动的流动性增量环境中。反弹行情中和国产链相关的标的反弹弹性会更突出，活跃资金倾向于交易结构更优，反弹抛压小、催化容易刺激、容易形成共识的二三线或中小市值个股，但选股难度较上半年将明显提升（参考先知小秘圈内聚焦跟踪提示）。 9、科技板块整体配置价值：当前为科技仓位逐步回补的节点，科技板块拥挤度显著低于市场预期，市场此前高估二季度电子+通信持仓比例12个百分点，实际中报该比例仅为48%；当前TMT成交额占比回落至40%左右，处于过去两年的中枢水平（过去两年上限为50%），属于相对安全区间，科技主线地位正在逐步回归，且正出现从海外链向国产链的切换。2027年是自主可控国产链爆发大年，产业加速度相当于2026年的海外链，若美国科技资本开支很难再大幅上行，海外链将进入阶段性逆风期，国产链替代方向科技板块潜力更大。反弹高度上，机构偏向年内不要期待科技股再创新高，因为需要为明年留空间，所以反弹波段在前高附近需要注意观察套牢盘与机构减持压力。 10、国内AI顶层规划：2026年8月经济数据普遍不及预期，政 策刺激预期升温，刺激方向大概率指向科技领域。算力从单一产业议题提升至工业体系支柱性任务，未来五年投入将有明确考核标准。2026年9月工信部、发改委联合印发电子信息制造业”十五五”规划，将夯实人工智能硬件底座列为四大新兴方向之一。国产链加速向上的产业趋势在政 策与基本面的催化下更有估值弹性，虽然短期估值尚未充分消化，但预期未来两年利润将大幅释放、估值将快速下行，所以获取超额收益的概率和成功率更高，同时要注意解禁与减持压力。 11、科技股景气阈值：增速维持30%以上时，市场更看重景气而非估值；高增长标的的增速若较前一年回落超过50%，表现往往明显转弱。历史上，强产业景气能够部分抵消地缘冲突、油价上行和利率抬升的估值压力，关键仍是盈利趋势是否保持。统计显示，对于前一年增速高于50%的标的，当年仍能保持30%以上增长，收益表现通常较好；若增速跌破30%，表现会明显走弱。若增速相对前一年回落超过50%，高增长也可能转为“高增速陷阱”。因此高景气资产不宜只看绝 对增速，也要同时观察增速的边际变化。拥挤度本身不等于行情结束，若产业景气仍在上行，集中交易可以持续，真正需要警惕的是盈利增速趋势走弱后，高拥挤带来的波动放大。 12、科技股仍是市场主线：当前全球市场处于中美科技博弈长期相持、斗而不破的核心阶段，两大经济体呈现明显的周期错位与优势互补格局，也直接决定了A股无全面牛市、仅有结构性行情的中长期走势。从经济周期来看，美国面临通胀压力延续的市场环境，而国内处于通缩修复的调整周期，双方均立足自身经济体特征，针对性补齐发展短板、强化核心优势，全力守住经济大盘基本盘。其中，中国的核心竞争力在于完整的工业体系、成熟强大的智能制造产能，是全球制造业供应链的核心支撑；美国则依托高端科技、全球金融霸权、军事硬实力构筑自身竞争壁垒。这种差异化的竞争格局，意味着中美经济不存在单向碾压式走势，而是长期博弈、动态平衡。对应资本市场，A股难以出现普涨普跌的全面牛市，结构性景气、龙头溢价将成为市场核心主线，资金将持续聚焦具备全球竞争力的优质赛道与头部企业。展望未来半年到一年，科技依然是主线，但需要去伪存真，再往后看，主线必然会有限度的扩散，AI从半导体和算力硬件，逐渐到赋能下游应用，比如创新药与中游工业制造等领域。---xz#文字观点", "publish_time": "2026-09-21 08:22", "tags": ["文字观点"]}, "post:2026-09-21T07-24:ae6beff65072": {"id": "post:2026-09-21T07-24:ae6beff65072", "kind": "post", "title": "2026-09-21 07:24", "source_label": "帖子正文", "excerpt": "20260920复盘 宏观： 1. 特朗普：可能对与伊朗总统会面持开放态度。一些大事可能在不远的将来发生。", "content": "20260920复盘 宏观： 1. 特朗普：可能对与伊朗总统会面持开放态度。一些大事可能在不远的将来发生。 2. 调解方转告伊朗：美方准备谈判、态度认真；伊朗前提：美方重返伊斯兰堡谅解备忘录、履约，伊朗需要可信安全保障。伊朗最高国家安全委员会秘书表示，已通过卡塔尔向美方提出7项谈判条件，包括结束对伊战事、解冻资产、结束海上封锁，正等待美方回应。 3. 何立峰于9月19日至23日率团赴美国举行经贸磋商，就双方关心的经贸问题开展磋商。 人工智能： 1. 福邦Q4PCB报告：涨价仍是主旋律，且可能持续到2027年下半年。 2. 卖方：电信集采A2光缆，头部四大家均220元顶格报价。招标价格已经和散纤市场价相同。 3. Trendforce上修了NAND闪存价格预期，其中2026年第三季度上涨18‑23%（此前预测为上涨10‑15%）、2026年第四季度上涨15‑20%（此前预测为上涨0‑5%）。 4. 美AI服务内容源头加微信 WUXL3408订阅者诉讼OpenAI、Anthropic、Google、xAI达成协议，协同放缓 AI 模型能力升级速度。 5. 卖方：minimax多模态超预期，预计M3.1模型即将发布，整体对标opus4.8，针对后训练能力进行补强，例如医疗、法律、软件开发等垂直领域私域数据。 6. 卖方：960DT 27Q1就绪（提前三个季度）；960PR 27Q3就绪（提前一个季度）。 7. Anthropic据悉将原定的IPO推迟至11月。 8. 宏碁董事长陈俊圣看空的是消费级内存持续涨价。 9. Jev 是 TypeSafe AI 推出、仅做判断不生成文本的低成本高速模型，适合 AI 智能体的分支决策，可嵌入各类小场景，但只能在预先给定选项内做封闭式判断，国内已有开源版本。 医药： 1. 美正在讨论的方案可能允许美国药企继续从中国企业引进大多数普通治疗性药物，重点限制病原体以及可能被武器化的生物技术。 2. 阿里AI登顶《科学》：全球首个专家级通用医疗影像模型 一个模型识别146种病症。 3. 18 日，十部门联合印发医药工业 “十五五” 规划，并设定 2030 年路线图，设定创新药与研发费用硬性定量指标。 半导体： 1. CX计划在北京建立NAND闪存研发生产线；长鑫第五代内存技术正式量产，G5平台依托创新的四重曝光技术把内存阵列的有源区半间距微缩至11.95纳米。 2. 三星预计明年将把第6代高带宽存储器HBM4 和第7代HBMHBM4E等HBM4系列产品的产量至少提高到今年的2倍以上。 3. 半导体外延硅片骨干浙江晶睿电子下发调价函，因刚性成本压力，定于10月1日起出货产品价格统一上调10%。 地产： 丁祖昱：2027年3月起新房会出现12-18个月供给缺口，利好现在手里有土地储备的房企。 策略观察： 1. 周五成交20931亿，增量2565亿。指数不多聊了，反正仍然没问题，温和放量也配合上了，等中东消息面出问题再说，一般也对应油价波动。 2. 板块方面，地产（没想到催化能这么反馈）、电子和通信领涨，科技完全是按照周四晚预期走的，不多说了，明天就算冲高回落也没事，实在不知道买啥就etf，一揽子配成etf也行。 3. 题材方面，对大部分科技来说，才启动不久，所以周五仍然是普反，涨得比较多的pcb被兑现了些，但趋势仍然没坏，科创位置低涨起来没什么抛压，设备尤其是封测设备很热，其他科技各种新技术也好，老涨价也好，都是趋势向上的态势，不一一点了，到底选反弹多的细分还是反弹少的细分，没有非要哪边不可的想法，轮涨大背景，选自己最擅长做的方式，拿得住就可以。不搞科技的资金也有饭吃，科技都起来了，黄酒还没散场呢，地产一个催化能涨停，农业和医药也都活跃，不过医药是AI4S做先锋，cxo跟上吧。纯题材“华字辈”也集体涨，中美贸易题材也有蹦跶，神鼓反正估计监管到熄火为止，还是别瞎搞老一套了。总之场子刚开始活跃，谁都看着能吃上一口，再反弹两天再掉队一些。#文字观点", "publish_time": "2026-09-21 07:24", "tags": ["文字观点"]}, "post:2026-09-21T20-23:4fbbeb325580": {"id": "post:2026-09-21T20-23:4fbbeb325580", "kind": "post", "title": "2026-09-21 20:23", "source_label": "帖子正文", "excerpt": "【国泰海通战术性大类资产配置周度观点 20260920】美联储如期加息彰显政策独立性与控制通胀的决心，市场对宏观流动性的不确定性有所下降，受益于风险偏好修复，风险资产相较于避险资产具备更高的战术性配置价值。建议超配A股、美股、国债、黄金与工业金属。", "content": "【国泰海通战术性大类资产配置周度观点 20260920】美联储如期加息彰显政策独立性与控制通胀的决心，市场对宏观流动性的不确定性有所下降，受益于风险偏好修复，风险资产相较于避险资产具备更高的战术性配置价值。建议超配A股、美股、国债、黄金与工业金属。 外部风险已逐步计价，叠加美债利率压力缓和与稳市场政策托底，A股系统性下行风险有限，市场有望震荡企稳。建议超配A股。 受益于强劲的企业盈利以及AI产业趋势，美股对宏观流动性预期的波动相对钝化。美股的微观交易结构在调整后得以稳固，估值相对合理，进一步下行的空间或有限，波动将提供“buy the dip”配置机会。建议超配美股。 融资需求与信贷供给仍不平衡，资本市场高波动提升债券配置性价比。建议超配国债。 美国经济韧性尚存，通胀粘性较强，投资者或反复修正宏观流动性预期。建议低配美债。 市场反复修正全球宏观流动性预期或阶段性冲击黄金价格，但在美元信用走弱的背景下，微观交易结构改善或为黄金阶段性提供上涨动能。建议超配黄金。 地缘政治局势扰动或提振全球油价中枢，但不确定性仍较高。建议标配原油。 以铜为代表的工业金属在供给方面除了受到产业供给的限制，还受到关税与地缘政治不确定性的扰动。建议超配工业金属。#文字观点", "publish_time": "2026-09-21 20:23", "tags": ["文字观点"]}, "post:2026-09-21T20-24:cab117857007": {"id": "post:2026-09-21T20-24:cab117857007", "kind": "post", "title": "2026-09-21 20:24", "source_label": "帖子正文", "excerpt": "HVDC 电源维谛专家交流信息探讨 9.21 以维谛专家的口径： 1、市场认为 HVDC28 年才有订单，但实际上是 26 年第四季度就有，台达维谛麦米都会有小批量订单。这里如果麦米系统内可以印证 Q4 小批量订单，基本也能证明 HVDC 量产的进度应该比市场认可的要快，26 年底小批量，27 年大", "content": "HVDC 电源维谛专家交流信息探讨 9.21 以维谛专家的口径： 1、市场认为 HVDC28 年才有订单，但实际上是 26 年第四季度就有，台达维谛麦米都会有小批量订单。这里如果麦米系统内可以印证 Q4 小批量订单，基本也能证明 HVDC 量产的进度应该比市场认可的要快，26 年底小批量，27 年大批量生产预期。 2、市场认为麦米是 RUBIN 二供，但实际上一供是台达二供是维谛，一般来说一供 60-70% 份额，二供 20-30% 份额，三供 5-10%。台达同时布局电源和系统，在 PSU 市场成本优势更突出；维谛优势在于系统领域，未来系统端份额预计更高。 3、市场认为 RUBIN 大部分是采用 415V 电源，但实际上 RUBIN 电源 90% 的份额采用 HVDC。英伟达 Rubin 机型单机柜功率达 240 千瓦，单模组可达 4.2 兆瓦，对应电流达 6300 安培，已触及交流低压元件的电流承载极限，800V HVDC 成为必然技术路线。这不是选项是刚需。 4、Rubin 阶段处于交直流切换期，早期批次约 10%-20% 使用交流供电，80%-90% 切换为直流供电；到 Rubin Ultra 阶段将实现全直流 800V 供电。当前 800V CE 认证已完成，北美 UL 认证在立项和标准制定阶段，将边推进边完善规范。（这里补充个个人验证，HVDC 检测设备 UL 认证已通过，目前在订单落地中。） 5、第一批次直流模块总体订单金额预计约 30 亿美金，维谛公司预计三年可获得设备订单金额约 20-25 亿美金，目前确定性订单以头部厂商为主，订单落地节奏完全取决于北美客户的建设规模和下单速度。 6、北美市场高压直流产品毛利率保底 40% 起步，显著高于国内 HVDC 产品 10% 左右的毛利率，也高于国内 UPS 产品 20%-30% 的毛利率，与海外 UPS 产品 45% 左右的毛利率接近。 7、行业延展关注方向 ・锂电需求爆发：供电系统向兆瓦级升级，传统铅酸电池并机数量多、密度低，无法满足需求，锂电池在海外市场呈现 5-10 倍的增长，且锂电池价值量通常高于电源本身。 ・小母线需求提升：AI 机柜功率密度提升，传统列车位配电无法满足需求，高密度小母线（Busway）应用将快速增长，价值量不低于 HVDC。 ・电网仿真与微网领域：供电系统从单个电源向园区级电源系统演进，微网、电网仿真相关业务需求提升，行业内已出现相关收购动作#文字观点", "publish_time": "2026-09-21 20:24", "tags": ["文字观点"]}, "post:2026-09-21T07-40:725c86eb1f01": {"id": "post:2026-09-21T07-40:725c86eb1f01", "kind": "post", "title": "2026-09-21 07:40", "source_label": "帖子正文", "excerpt": "❗【天风电新】AIDC缺电：如何看BE定价及SOFC机会-0920 ——————————— 上周五BE股价调整，我们认为与公司将在21号纳入标普500指数、市场提前博弈有关。⭐️BE如何定价 核心假设：单价3美元/W，27年规模化、净利率提升至20%。", "content": "❗【天风电新】AIDC缺电：如何看BE定价及SOFC机会-0920 ——————————— 上周五BE股价调整，我们认为与公司将在21号纳入标普500指数、市场提前博弈有关。 ⭐️BE如何定价 核心假设：单价3美元/W，27年规模化、净利率提升至20%。 考虑27年开始美国电力缺口放大、SOFC产能有望超预期，27年公司出货上修至4.5-5GW，当前26X PE。 ⭐️我们对BE及SOFC的后续观点 #维持短期量有望超预期&中长期替代燃机判断，燃机叶片扩产瓶颈、生产安装周期2年+，预计27-30年大部分电力缺口由SOFC、气发补充，而SOFC在环保、节水上有明确优势。 经济性层面，近期BE发布白皮书，BE 800V输电架构不需要加装变压器等、且更省电，1GW AIDC CAPEX+5年OPEX 对比并网方案可节省55亿美元。AIDC园区建设形式，我们认为800V、不通过变压器升降压进行测算偏乐观，但整体看当前SOFC LCOE已与燃机打平。 我们继续看好27-30年BE及其他SOFC（典型是CERES-潍柴）量再次超预期上修可能性。相关标的： 【BE】：以30X定价，每上修1GW，市值可上修180亿美元。 国内产业链首推【潍柴动力】，当前市值基本仅含主业+柴发，气发、SOFC未定价且超预期可能性大。 继续推荐相关供应链：三环集团、中原内配、春晖智控、振华股份、壹连科技、先导集团、京泉华等。#文字观点", "publish_time": "2026-09-21 07:40", "tags": ["文字观点"]}, "post:2026-09-21T08-22:2e455a86f1ab": {"id": "post:2026-09-21T08-22:2e455a86f1ab", "kind": "post", "title": "2026-09-21 08:22", "source_label": "帖子正文", "excerpt": "盛合晶微交流要点（预期偏空，估值高估）： 1、公司核心业务与历史业绩情况 业务布局：公司最早以12英寸凸块加工（Bumping）业务起家，逐步延伸构建了覆盖凸块加工、晶圆级封装（WLCSP）、2.5D硅中介层加工、多芯片系统集成封装（2.5D/3DIC）的平台化能力。历史业绩变化： 2022年：2.", "content": "盛合晶微交流要点（预期偏空，估值高估）： 1、公司核心业务与历史业绩情况 业务布局：公司最早以12英寸凸块加工（Bumping）业务起家，逐步延伸构建了覆盖凸块加工、晶圆级封装（WLCSP）、2.5D硅中介层加工、多芯片系统集成封装（2.5D/3DIC）的平台化能力。 历史业绩变化： 2022年：2.5D芯粒多芯片集成封装业务收入仅0.86亿元，占主营收入比重5.32%；第一大客户占比约40%；全年亏损3.29亿元。 2025年：2.5D芯粒多芯片集成封装业务收入达33.28亿元，占主营收入比重超50%；全年实现营收65.21亿元，归母净利润9.23亿元；三年营收CAGR接近70%，2025年当年营收增速仍接近39%。 2026H1：营收和净利润增速分别降至7.2%和3.3%；公司称增速回落主要是2025年2.5D产线规模化量产带来的高基数、以及订单节奏波动所致。 行业地位：是国内极少数具备2.5D量产能力、且在转接板加工和微凸块工艺上形成完整链条的企业；2024年国内2.5D集成市场份额约85%，全球占比约8%，排在台积电、英特尔、三星之后。 2、2. 5D集成业务发展现状与限制因素 当前技术与业务表现： 现阶段芯粒多芯片集成封装业务绝大部分收入来自2.5D集成，SmartPoser-Si技术平台已大规模量产，微凸块间距可做到20微米，大尺寸硅转接板可做到约3倍光罩，技术水平处于国内前列。 2025H1该业务收入17.82亿元，毛利率30.63%，销售封装片3.4万片，产能利用率63.42%；2026H1该业务收入18.28亿元，毛利率30.86%，收入基本处于静止增长状态，推测产能利用率仍在60%左右水平。 业务增长核心限制： 核心瓶颈为上游物料供应不足，不缺设备和产能，但HBM和高端TSV转接板供应紧缺，导致产能利用率闲置，订单承接已满但无法落地生产。 目前HBM基本来自海外内存厂，高端TSV转接板主要来自台积电、三星、英特尔外供体系，2.5D产线受制于海外供应链紧缺状态。 市场普遍预期HBM供给紧张将至少持续到2028年，高端TSV转接板供给宽松也在2028年以后，在此之前2.5D集成业务产能利用率难以有效提升，营收、毛利率将受到较强限制。 国产供应链替代进展： HBM领域：长鑫科技已开始小量生产HBM3E，计划2027年扩产，目前寒武纪、平头哥等国内厂商正在做搭配测试，乐观情况下最快2027年进入产品线；悲观情况下堆叠层数和良率爬坡面临挑战，有效供给时点可能推迟。 TSV转接板领域：华进半导体是国内能做12英寸TSV转接板的企业之一，但目前仍处于中试和客户验证阶段，尚未形成可替代海外高端货源的稳定产能。 客供料变化：TSV转接板单价在万元级别，公司该物料客供占比从2023年的3%升至2025H1的约25%，反映上游供应紧张，客户需自行控料。 未来判断：至少2028年之前，HBM和高端TSV转接板仍将是限制2.5D集成业务表现的关键因素，供应紧缺难以实质性改善，产能利用率不会有质的提升，业务大概率维持“静态”。 3、3D集成业务布局与竞争格局 行业技术路径背景： 华为提出“韬定律”，以时间缩微替代几何缩微，逻辑折叠采用晶圆对晶圆混合键合工艺：2026年麒麟量产键合间距约1.5微米，主频3.1GHz；2027年及以后目标间距缩至1微米以下，2029年前后实现主频4GHz。 昇腾路径相对滞后，2030年之前仍采用成熟的2.5D集成方案；2030年之后昇腾990首次引入逻辑折叠，后续将HBM、光互联、供电等从芯片边缘移至芯片表面。 麒麟芯片2026年秋季将首批完整落地逻辑折叠技术，算力端逻辑折叠预计2030年才会有实质性产业落地。 公司3D业务布局： 目前SmartPoser-PoP的3D Package业务已规模量产，其他3D集成技术处于完成验证和小量试产阶段。 临港百亿项目2026年6月底开工，为进入华为逻辑折叠供应链的前置投入，预计至少到2030年才能产生规模化收入，在此之前项目固定资产增加将带来折旧成本压力。 公司成本结构中物料、人力、生产成本占比大致为3:2:5，临港项目的折旧将提升生产成本占比，对毛利率构成下行压力。 竞争格局判断： 3D集成领域不会出现一家独大的格局：长电科技是华为麒麟9050系列封测供应商，具备华为供应链先发优势；通富微电是长江存储混合键合、堆叠最早的供应商，是华为算力封装的理想合作对象；公司目前是华为昇腾2.5D集成的核心供应商，但3D集成仍在认证和小批量量产阶段。 长期来看，公司在3D集成领域的竞争格局将弱于当前2.5D集成市场，未来市场份额和业务毛利率可能受到一定影响；仅能获取部分与华为逻辑折叠、昇腾后半程匹配的订单，无法独占赛道。 4、客户结构与相关风险 客户集中度情况：第一大客户（客户A，指向国内芯片设计龙头华为昇腾）销售占比从2022年的40.56%持续攀升至2025H1的74.40%，公司3/4的收入来自该客户。 现阶段客户结构的合理性： 国产替代爬坡期，深度绑定国产芯片设计龙头是生存策略，长协合同锁定产能、联合研发搭建技术护城河，客户A的出货放量直接转化为公司收入弹性，是公司渡过产能爬坡期、摊薄固定成本的最佳伙伴。 现阶段风险点并非客户流失，而是客户A出货量不足，尚未达到客户集中度风险的阶段。 长期潜在风险：未来国产AI芯片放量到一定程度，客户A大概率会主动分散供应链，若届时公司仍有超70%收入来自该单一客户，议价能力将非常被动。 未来规划：客户A是现阶段的最优解，但并非长期增长护城河，待客户A带动国内先进封装成熟落地后，公司将开启客户多元化进程。 5、公司估值与投资相关判断 当前市场给公司的定价约2400亿元，动态PE超260倍，定价逻辑为国内先进封装稀缺性的发展叙事，而非当前利润。 短期业绩压力：至少2028年之前，公司主营业务产能利用率不足，同时固定资产增加带来更多折旧成本，收入增长和毛利率水平均处于压力区间，处于两段产能周期的“空档”内。 估值核心影响因素：客户A的推进进程和市场预期是估值锚点的重要组成部分，其出货量、芯片迭代节奏、参数优化程度将间接影响公司估值预期： 若客户A放量，公司闲置的2.5D产能有机会拉满，业务静态增长状态将被打破； 若客户A仅迭代、不放量，公司仍将处于“有单无料”的状态； 若客户A将3D折叠订单分给长电、通富，公司3D业务的价值将贬值。 投资判断：未来两年公司更适合作为产业情绪观察样本，而非业绩增长投资样本，估值很大程度上锚定客户A（华为昇腾）的推进节奏。---xz#文字观点", "publish_time": "2026-09-21 08:22", "tags": ["文字观点"]}, "post:2026-09-21T20-25:247f47eb9d1a": {"id": "post:2026-09-21T20-25:247f47eb9d1a", "kind": "post", "title": "2026-09-21 20:25", "source_label": "帖子正文", "excerpt": "GS HK MARKET WRAP 高盛香港市场综述#交易台恒生指数上涨 1.2%｜国企指数上涨 1.4%｜恒生科技指数上涨 0.4%｜成交额 2027 亿港元 领涨板块：医疗保健 + 4.9%，数据中心 + 3.3%，电子元件 + 2.9%，综合零售 + 2.8% 领跌板块：黄金 - 3.9%，家", "content": "GS HK MARKET WRAP 高盛香港市场综述#交易台恒生指数上涨 1.2%｜国企指数上涨 1.4%｜恒生科技指数上涨 0.4%｜成交额 2027 亿港元 领涨板块：医疗保健 + 4.9%，数据中心 + 3.3%，电子元件 + 2.9%，综合零售 + 2.8% 领跌板块：黄金 - 3.9%，家用耐用消费品 - 3.5%，铝 - 1.8%，电动汽车 - 1.5%，人工智能供应链 - 1.4% 恒生指数上涨 1.2%，收于高位区间，重新站上 25000 点关键关口。恒生科技指数上涨 0.4%，表现落后于周五 2.2% 的反弹势头。 官方媒体正式确认相关外事访问安排。贝森特表示，与何立峰的会谈 “非常成功”。高盛认为美元兑人民币汇率低于 6.7 预示着更为积极的背景。人工智能、贸易、稀土以及可能的伊朗问题均为关键议题。调查解读显示，约三分之二受访者预期此次为象征性访问，三分之一预期取得渐进式进展，且成果更可能出现在贸易政策领域，而非两岸关系或跨境投资方面。 医疗保健板块上涨 4.9%，成为表现最突出的行业主线，主要受两大因素驱动：1）北京发布的医药产业 “十五五” 规划；2）有报道称美国财政部规则可能允许大多数中美药品授权交易继续开展，同时限制敏感的生物技术相关交易。 互联网板块上涨 2.5% 提供助力。阿里巴巴上涨 3.0% 领涨，因明日（9 月 22 日至 24 日）将在杭州举行阿里云栖大会，主题为 “AI 赋能实际应用”。 人工智能供应链板块下跌 1.4%，其中联想下跌 4.9%，此前一周曾大涨 20%；据报 AMD 计划从第四季度起将部分产品价格上调 10%，这可能构成成本压力。 MiniMax 下跌 1.7%，Iluvatar CoreX 下跌 3.8%，在富时指数再平衡前录得超过 10% 的涨幅后稍作休整。 壁仞科技再次上涨 12%，继上周五大涨 12% 之后延续升势。公司宣布向普通员工（不包括董事、首席执行官、主要股东及其联系人）授予 8239.8 万股股份，作为员工激励计划的一部分，分四年归属，旨在使员工利益与公司保持一致，并留住 GPU 研发人才。 中国房地产板块上涨 2.3%。近期市场情绪受益于政策支撑预期的回升，而高盛专家电话会议仍指出，由于销售模式改革以及第四季度需求动能强劲，自 2027 年 3 月起新房供应将出现为期 12 至 18 个月的短缺，但更广泛的稳定局面可能要到 2030 年才会到来。 黄金矿业股下跌 3.9%，受美元走强及美联储鹰派立场影响。高盛仍维持 2027 年底金价每盎司 5400 美元的预测；美联储加息放缓了短期上行路径，但预计 2026 至 2027 年央行每月购金量达 60 吨，将支撑 2026 年底每盎司 4650 美元的公允价值。 电动汽车股下跌 1.5%；据报道，丰田、通用汽车和福特已加入一个联盟，敦促特朗普维持禁止中国汽车进入美国的禁令。 宁德时代下跌 1.3%，尽管当地当局已重启其江西锂矿的环境影响评估流程，同时交易员也在关注锂电池消费税的实施及相关订单波动的评论。 小米上涨 4.5%。1）高内存成本时期似乎已结束，宏碁表示内存短缺已消失，而长鑫存储称已达到先进 DRAM 的大规模生产。2）雷军表示，小米 18 Pro 系列将于周三晚上 7 点发布，周二的直播将更新 SUV “鹏程” 的进展。#文字观点", "publish_time": "2026-09-21 20:25", "tags": ["交易台", "文字观点"]}, "post:2026-09-21T20-24:931f47ba66e6": {"id": "post:2026-09-21T20-24:931f47ba66e6", "kind": "post", "title": "2026-09-21 20:24", "source_label": "帖子正文", "excerpt": "【国盛区块链】SEC发布股票上链“创新豁免”征求意见稿，加密资产板块迎利好 事件：9月17日，美国证监会（SEC）发布了一些针对股票上链的豁免规定，有效期五年，并公开征求意见，旨在通过加速股票上链交易，推动美国资本市场进入数字时代。该规定主要内容是：1）免于将“使用许可式AMM与流动性池提供代币化股", "content": "【国盛区块链】SEC发布股票上链“创新豁免”征求意见稿，加密资产板块迎利好 事件：9月17日，美国证监会（SEC）发布了一些针对股票上链的豁免规定，有效期五年，并公开征求意见，旨在通过加速股票上链交易，推动美国资本市场进入数字时代。该规定主要内容是：1）免于将“使用许可式AMM与流动性池提供代币化股票交易的平台”认定为需要遵守1934年《证券交易法》的“交易所”，而将其定义为“代币化股票服务商（TSV，Tokenized Securities Venues）”；2）免于将“使用自有资金”认定为需要遵守1934年《证券交易法》的“经销商”。 规定对TSV做了若干限制：1）相关代币化股票与传统股票附着的权利相同；2）上架代币化股票前必须取得该股票发行人的同意；3）代币化股票在公链交易；4）相关代币化股票只能在传统股票的可交易时段交易。 点评：我们注意到，SEC新规发布时间紧挨着9月15日《Clarity法案（数字资产清晰法案）》被参议院投票拒绝正式审议，体现出作为联邦金融监管机构的自主性和对加密市场的支持。我们预计，在特朗普支持加密资产的总体背景下，中期选举前，SEC和CFTC（美国商品期货交易所）将推动更多加密友好新规出台。 投资建议：建议关注：1）拥有公链的合规交易所与加密资产基础设施：Coinbase（拥有Base）、Robinhood（拥有Robinhood Chain）、Circle（拥有Arc）等；2）公链以太坊的DAT：Bitmine（BMNR）、Sharplink（SBET）等；3）公链Solana的DAT：Defi Development（DFDV）等；4）RWA服务商：Securitize等。 风险提示：股票上链市场规模不及预期，美联储加息。#文字观点", "publish_time": "2026-09-21 20:24", "tags": ["文字观点"]}, "post:2026-09-21T22-19:c79b60e81dd8": {"id": "post:2026- 已主导26%内部AI研发（AL4级），超90%工作达AI协作及以上水平；Token仍走GPU；分析师把服务器CPU 2030年TAM往1200-1700亿推。\u003c/li>\n\u003cli>半导体/先进封装/HBM信息密集：半导体后道测试设备增长逻辑从传统芯片出货量、行业资本开支驱动，转向芯片数量增长、单颗芯片复杂度提升、测试环节增加共同驱动；WSTS预计2026年全球半导体市场规模达1.51万亿美元；精智达2026年上半年实现营收8.04亿元，同比增长81%；长鑫存储HBM良率预估远低于三大头部厂商60%-65%的水平；SK海力士正与英特尔洽谈在美国生产内存芯片；VR200 NVL72机架MLCC需求量比GB300 NVL72增加约80%，每台Rubin NVL72 MLCC数量从约320000个升至约570000个。\u003c/li>\n\u003cli>液冷/电源/AIDC缺电出现进度提前信号：以维谛专家口径，市场认为HVDC 28年才有订单，但实际26年第四季度就有，台达、维谛、麦米都会有小批量订单；26年底小批量，27年大批量生产预期。到Rubin Ultra阶段将实现全直流800V供电；BE 800V输电架构不需要加装变压器等、且更省电，1GW AIDC CAPEX+5年OPEX对比并网方案可节省55亿美元；BE以30X定价，每上修1GW，市值可上修180亿美元。\u003c/li>\n\u003cli>宏观/策略与中美经贸出现多项关键表述：有机构观点判断未来1-2个季度（2027年3月前）上证指数为横盘震荡，核心震荡区间3800-4200点，底部区域3700-3800点；2026年四季度偏弱震荡，区间3800-4000点；周五成交20931亿，增量2565亿。美国中期选举前油价或维持当前水平，中期选举后油价存在上行甚至突破历史新高的风险；11月开始的美国中期选举会影响全球市场产生避险交易，当前市场预期民主党横扫两院概率已超过60%且仍在进一步提升。贝森特表示美中在贸易和人工智能领域接触“非常成功”，双方同意再次会晤就人工智能问题展开进一步对话，美国提议建立通知机制。\u003c/li>\n\u003cli>PCB/CCL/铜箔与光通信链条继续强化：CCL上游更新显示，电子布预期26Q4~27年E布/二代/T布全面紧缺，散单10月再涨一次价即达到市场预期的27年价格水平，27年价格预期再次上修；铜箔HVLP4单月需求预期放大至3000吨/月，叠加1.6T光模块mSAP强制用极薄载体铜箔，三井90%市占，国产替代打开。ASMPT 2026年二季度收入6.3亿美金，同比增长52.1%，超出此前指引上沿；经调整净利润6.3亿港币，同比增长253.9%；预计2026-2027年为800G到1.6T光模块大幅放量阶段，2028-2029年CPO将接棒光模块需求。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型\u003c/strong>：今天强化的逻辑是“交付智能”阶段到来，推理占比反超训练，AI Agent加速进入企业，Token仍走GPU，服务器CPU长期TAM上修。今天出现的催化/验证包括：计算机行业周报行情复盘，博汇科技、浩瀚深度、云天励飞-U周涨幅居前；智谱ZCode代码上传争议后回应已完成修复，将推动代码开源及引入第三方安全评估，随后又称ZCode即将正式开源并开展安全审计；Meta推出首款个人AI智能体Muse，在自己的安全虚拟机上运行，可代表用户发送电子邮件、预订旅行、管理日程和购物；华为昇腾960超节点首次采用NPO，整机采用5500个自研Hi-ONE光引擎替代原本所需的4.8万只800G。高频提及标的：AMD、台积电、英伟达、Intel、长鑫存储、长鑫科技、美光、SK海力士。\u003c/li>\n\u003cli>\u003cstrong>半导体/先进封装/HBM\u003c/strong>：今天强化的逻辑是测试设备由晶圆产能扩张驱动，转为测试设备配置数量、单颗测试时间共同增长；增量集中在HBM、高性能逻辑芯片、先进封装，测试设备需求弹性高于芯片市场整体增速。今天出现的催化/验证包括：WSTS预计2026年全球半导体市场规模达1.51万亿美元，存储芯片、AI相关逻辑芯片为核心增长动力；精智达业务转型进入收入兑现期，2026年上半年营收8.04亿元，同比增长81%；长鑫存储HBM良率预估远低于三大头部厂商60%-65%区间；台积电推进CoPoS布局，涉及玻璃核心基板、RDL金属化、检测与量测等制程模组；盛合晶微交流要点为预期偏空、估值高估；SK海力士正与英特尔洽谈在美国生产内存芯片；全球存储器市场规模预计2030年达到2.0万亿美元；VR200 NVL72机架MLCC需求量增约80%。\u003c/li>\n\u003cli>\u003cstrong>液冷/电源/AIDC缺电\u003c/strong>：今天强化的逻辑是HVDC量产进度可能比市场认可更快，26Q4小批量、27年大批量；Rubin Ultra阶段将实现全直流800V供电；BE 800V架构经济性突出。今天出现的催化/验证包括：维谛专家交流称26Q4即有HVDC小批量订单，台达、维谛、麦米都会有小批量订单；维谛优势在系统领域，未来系统端份额预计更高；BE白皮书显示1GW AIDC CAPEX+5年OPEX对比并网方案可节省55亿美元；BE以30X定价，每上修1GW，市值可上修180亿美元；AIDC电源随双创反弹，但预计本次反弹非反转，锂电尚未到配置窗口期；金洲管道液冷客户为台资T1厂商，截至9月15日已签署销售合同约3000万元，Q3开始形成收入；上海电气为国内唯一重型燃机出海主机厂。\u003c/li>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>：今天强化的逻辑是通胀线看好电子布/铜箔，PCB上游景气度延续，涨价+技术升级开启全新景气度。今天出现的催化/验证包括：电子布预期26Q4~27年E布/二代/T布全面紧缺，散单10月再涨一次价即达到市场预期的27年价格水平，27年价格预期再次上修；铜箔HVLP4单月需求预期放大至3000吨/月，叠加1.6T光模块mSAP强制用极薄载体铜箔，三井90%市占，国产替代打开；电子布到CCL涨价链传导顺畅，电子布延续供不应求格局，中高端产品D、E系列细纱及布紧张；关注树脂+添加剂技术变迁，关注铜箔业绩确定性。高频提及标的：英伟达、SK海力士、台积电、新材料、金风科技、方正科技、上峰材料、中材科技。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>：今天强化的逻辑是GPU/ASIC出货增加及光模块配比提高，光互联由Scale Out向跨机架拓展，英伟达、博通、台积电等加速布局CPO，产业链迎关键突破窗口。今天出现的催化/验证包括：ASMPT 2026年二季度收入6.3亿美金，同比增长52.1%，超出此前指引上沿，经调整净利润6.3亿港币，同比增长253.9%；预计2026-2027年为800G到1.6T光模块大幅放量阶段，2028-2029年CPO将接棒光模块需求；华为昇腾960超节点Atlas 960E首次采用NPO，整机采用5500个自研Hi-ONE光引擎，替代原本所需的4.8万只800G；上海发布单波400G硅光芯片及可编程AI推理芯片；电信室内光缆招标结果出炉，行业供需紧张维持，价格贴近限价上限；俊知集团完成收购青海中利100%股权，青海中利一期、二期光棒产能400吨，三期600吨；华源控股2026年上半年营业收入11.9亿元，同比增长2.4%，归属上市公司股东净利润7508万元，同比大增54.81%。\u003c/li>\n\u003cli>\u003cstrong>新能源/汽车与机器人/自动化\u003c/strong>：今天强化的逻辑是锂电规划引导与出口增长共振，绿氢氨醇商业化实现里程碑突破；智能化升级推广焊接自动化、智能切割、涂装、除砂等机器人应用。今天出现的催化/验证包括：九部门印发《智能网联新能源汽车产业发展“十五五”规划》，提出2030年新能源乘用车、商用车新车销量占比目标分别达70%、40%；8月国内新能源汽车产销分别完成165.3万辆、164.3万辆，同比增长18.9%、17.8%，新车渗透率60.6%；钙钛矿光伏领域首个国家标准发布，将于2027年正式实施；特斯拉开启新一轮针对旗下机器人业务的量产审厂工作；中国船舶1H26毛利率17.37%，较1H25提升4.79pcts，主要系26H1交付的是23-24年的相对高价订单；国常会提出深入实施积极应对人口老龄化国家战略，培育银发消费新场景；国办转发《关于促进房车消费的若干措施》。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>中美经贸与AI：贝森特表示美中在贸易和人工智能领域接触“非常成功”；中美同意再次会晤，就人工智能问题展开进一步对话；美国提议在两国之间建立通知机制；美国贸易代表格里尔称美中贸易委员会已投入运营；中国可能包括消费品和低技术产品，美国可能包括能源产品、农产品以及医疗器械。\u003c/li>\n\u003cli>
