t": "应用材料公司与英特尔在 EPIC 中心合作开展 AI 芯片研发 应用材料公司（纳斯达克股票代码：AMAT）与英特尔公司（纳斯达克股票代码：INTC）宣布合作开发下一代芯片制造技术，双方计划在应用材料公司位于硅谷的 EPIC 中心和英特尔位于俄勒冈州希尔斯伯勒的研究园区开展联合工作。两家公司表示，他们", "content": "", "publish_time": "2026-10-06 21:40", "tags": ["文字观点"]}, "post:2026-10-06T22-47:d9807b58c365": {"id": "post:2026-10-06T22-47:d9807b58c365", "kind": "post", "title": "2026-10-06 22:47", "source_label": "帖子正文", "excerpt": "美国数据中心电力短缺超三成，芯片挤压传导至二线云与零部件 美国数据中心正在撞上电力供应的硬墙。摩根士丹利（Morgan Stanley）测算，2026 至 2028 年美国数据中心总电力需求达 97 吉瓦，扣除在建项目和电网接入后缺口达 57 吉瓦", "content": "", "publish_time": "2026-10-06 22:47", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-06T10-20:3e15415c78d0": {"id": "post:2026-10-06T10-20:3e15415c78d0", "kind": "post", "title": "2026-10-06 10:20", "source_label": "帖子正文", "excerpt": "中国科技半导体 / 硬件板块最优先标的：中国本土先进人工智能半导体供应链 内存：长鑫存储 —— 中国国产 DRAM 龙头，有潜力挑战全球存储巨头。晶圆代工：中芯国际 —— 充分受益于中国先进逻辑芯片潜在市场规模增长与国产化替代浪潮。", "content": "中国科技半导体 / 硬件板块最优先标的：中国本土先进人工智能半导体供应链 内存：长鑫存储 —— 中国国产 DRAM 龙头，有潜力挑战全球存储巨头。 晶圆代工：中芯国际 —— 充分受益于中国先进逻辑芯片潜在市场规模增长与国产化替代浪潮。 封测：长电科技 —— 代表全球半导体上行周期，拥有全球化业务布局、先进封装能力，同时受益中国半导体国产化，盈利增长前景向好。 中国国产化主线标的 晶圆制造设备：北方华创、中微公司、盛美上海 —— 中国先进逻辑芯片与存储芯片多年扩产周期确定性高，叠加国产化进程持续提速。 全球人工智能与半导体周期受益标的 互联解决方案：澜起科技 —— 面向全球人工智能资本开支需求，布局新兴技术赛道。 功率半导体：华润微 —— 功率分立器件平均销售价格修复、产品结构优化、盈利能力改善，公司净利润具备扩张空间。 印制电路板 / 覆铜板：深南电路 —— 人工智能与光模块印制电路板、存储上行周期带动的 BT 基板、国内算力需求带动的 ABF 材料，多条增长引擎同时发力。 边缘人工智能受益标的 CMOS 图像传感器：豪威科技 —— 新兴应用有望驱动业绩逐季修复，L2 + 级别自动驾驶渗透率快速提升、中国汽车半导体国产化是长期发展趋势。#文字观点", "publish_time": "2026-10-06 10:20", "tags": ["文字观点"]}, "post:2026-10-06T19-20:a668fcc235b0": {"id": "post:2026-10-06T19-20:a668fcc235b0", "kind": "post", "title": "2026-10-06 19:20", "source_label": "帖子正文", "excerpt": "高盛——美国科技：半导体——三季度业绩前瞻：板块普跌后，预计个股将随业绩上修而走强 一、核心总览：板块回调后风险回报改善，多数子领域预计业绩超预期 过去两个月半导体板块经历显著去风险（费城半导体指数SOX跌11%，同期标普500涨4%），当前估值回调为三季度业绩期创造了更具建设性的交易环境——这与二", "content": "高盛——美国科技：半导体——三季度业绩前瞻：板块普跌后，预计个股将随业绩上修而走强 一、核心总览：板块回调后风险回报改善，多数子领域预计业绩超预期 过去两个月半导体板块经历显著去风险（费城半导体指数SOX跌11%，同期标普500涨4%），当前估值回调为三季度业绩期创造了更具建设性的交易环境——这与二季度前我们发出的谨慎战术观点形成鲜明对比。我们预计，半导体生态系统中多数子板块（半导体设备、计算/存储、模拟芯片）的业绩与指引均存在上修空间： • 半导体设备：WFE（晶圆厂设备）支出前置叠加2028年长期能见度，预计盈利预期将大幅上修； • 计算芯片：超大规模资本开支上行倾向利好服务器CPU（AI智能体应用渗透率提升）及关键ASIC项目； • 模拟芯片：工业、航空航天/国防及数据中心敞口最高的标的具备基本面优势； • 存储/存储设备：基本面存在上修空间，但更偏好HDD与NAND（近期无新增供应）。 二、战术性选股：看多AMAT、STX、MCHP；看空QCOM、KLAC、WDC • 应用材料（AMAT，买入）：预计10月SEMICON West大会上管理层将上调利润率目标并给出强劲增长展望（WFE市场长期看3000亿美元），财报端受DRAM与先进逻辑拉动，预计表现强劲。 • 铿腾电子（CDNS，买入）：预计2026年指引上调，AI智能体工具货币化带动经常性收入增长动能，与Synopsys投资者日释放的乐观信号一致。 • 微芯科技（MCHP，买入）：工业需求广泛复苏，航空航天/国防与数据中心提供增量，市场仍低估模拟芯片复苏力度，为我们的首选标的之一。 • 高通（QCOM，中性）：预计季度业绩小幅超预期，但短期因AI智能体预期过热、股价已提前反映，战术层面存在回调风险。 • 科磊（KLAC，中性）：尽管季度业绩/指引存在上修空间，但WFE支出向DRAM倾斜（KLAC在过程控制领域虽预计至2027年营收增速达20%中段，仍难以跑赢同业）。 • 西部数据（WDC，中性）：预计季度小幅超预期，但HAMR（热辅助磁记录）爬坡将令对手希捷（STX）在近期EB容量增长与毛利率扩张上表现更优。 三、各子板块核心标的深度解析 1. 数字半导体与EDA软件 • AMD（买入，目标价700美元）：预计三季度强劲，焦点在Helios平台四季度贡献及服务器CPU需求上行。我们2027年EPS预期17.10美元，较市场共识高7%。上调EPS预期主因服务器CPU收入与利润率双升。 • Arm（卖出，目标价160美元）：投资者聚焦AGI CPU增量供应及2027财年专利费收入指引。智能手机疲软部分抵消服务器CPU与数据中心强势，估值偏高，维持卖出。 • 英特尔（中性，目标价150美元）：服务器CPU需求与代工进展是核心看点。上调EPS预期反映服务器CPU需求强于预期，但短期上行空间已部分定价。 • 高通（中性，目标价180美元）：数据中心收入爬坡与智能手机需求趋势是焦点。下调EPS预期3%以反映组件成本通胀对利润的挤压。 2. 模拟半导体 • 微芯科技（MCHP，买入，目标价115美元）：周期性复苏持续，数据中心与航空航天/国防领涨。预计季度营收超预期约1%，关注数据中心业务能否达成2026年10亿美元收入目标。 • 恩智浦（NXPI，买入，目标价325美元）：预计符合预期，汽车（尤其中国）需求趋势与数据中心敞口是焦点。价格上调对毛利率的传导效应将逐步显现。 • 安森美（ON，中性，目标价95美元）：数据中心电源（含800V）与汽车趋势是核心关注，Synaptics收购案对2030年财务目标的影响需跟踪。 • SiTime（SITM，买入，目标价900美元）：数据中心驱动显著超预期，Renesas收购提升单机架内容价值。石英向MEMS时钟的代际切换是长期增长引擎。 • 德州仪器（TXN，卖出，目标价225美元）：广泛复苏驱动强劲季度，但库存与折旧高企令毛利率复苏滞后于同业。300mm晶圆厂利用率与每股自由现金流目标是关键催化剂。 3. 半导体设备与代工 • 应用材料（AMAT，买入，目标价670美元）：SEMICON West大会（10月13日）前存在双重催化剂，WFE 2027年加速增长能见度提升。DRAM/HBM与先进封装需求强劲，AGS（全球服务）业务 momentum 持续。 • 艾马克（AMKR，中性，目标价65美元）：先进封装（2.5D/HDFO）动能与亚利桑那工厂爬坡是焦点。智能手机疲软部分抵消AI/HPC需求利好。 • 康特科技（CAMT，中性，目标价160美元）：先进封装份额提升与2027年订单能见度是核心。Eagle G5与Hawk产品组合优化支撑毛利率扩张。 • 英特格（ENTG，卖出，目标价120美元）：晶圆开工改善与行业资本开支上行背景下，投资者聚焦先进节点内容量提升与2027年绿色field晶圆厂贡献。 • 格芯（GFS，中性）：硅光子/CPO增长、汽车上行与毛利率可持续性构成核心辩论点。Synopsys IP与Photeon收购的货币化进程受关注。 4. 存储与存储设备 • 闪迪（SNDK，买入）：预计另一强劲季度，增量客户协议是焦点。 • 希捷（STX，买入）：HAMR爬坡驱动强劲季度，资本回报是关注重点。 • 西部数据（WDC，中性）：容量增长、HDD定价与利润率在技术转型期面临考验。 四、关键财务预测与估值框架（文字版） • AMD：2026-28年EPS预期8.05/17.10/25.20美元，目标价700美元（32倍归一化EPS 22美元）。 • 应用材料：2026-27年EPS预期14.70/21.50美元，目标价670美元（32倍归一化EPS 21美元）。 • 微芯科技：2027-28财年EPS预期3.75/4.80美元，目标价115美元（26倍归一化EPS 4.50美元）。 • 恩智浦：2026-27年EPS预期15.30/20.00美元，目标价325美元（18倍归一化EPS 18美元）。 • 德州仪器：2026-27年EPS预期8.60/10.20美元，目标价225美元（25倍归一化EPS 9美元）。 五、总结 半导体板块经历两个月的去风险后，风险回报比已显著改善。三季度业绩期预计将成为多数子板块盈利上修的催化剂，其中半导体设备（WFE前置支出）、计算芯片（AI智能体驱动CPU升级周期）及模拟芯片（工业/航空航天复苏）的上修空间最大。战术层面，我们看好应用材料、希捷、微芯科技的短期表现，对高通、科磊、西部数据持谨慎态度。投资者应聚焦各公司电话会中关于2027年资本开支能见度、AI相关需求持续性及毛利率扩张路径的指引。#文字观点", "publish_time": "2026-10-06 19:20", "tags": ["文字观点"]}, "post:2026-10-06T19-19:70ebf433ed47": {"id": "post:2026-10-06T19-19:70ebf433ed47", "kind": "post", "title": "2026-10-06 19:19", "source_label": "帖子正文", "excerpt": "大摩——半导体：AI生态系统如何绕开内存瓶颈？核心判断：内存短缺将在整个AI周期持续构成约束，但AI产业不会坐等DRAM晶圆厂建成。", "content": "瑞银——美国生物技术行业——生物科技现状：三季度节奏放缓，但基本面依然完好 尽管三季度面临货币政策收紧（9月加息25个基点）及并购活动阶段性放缓的逆风，生物科技板块仍展现出显著韧性。过去12-18个月的反弹由强劲基本面支撑，包括监管不确定性消除、并购活动处于历史高位、融资环境大幅改善。这些动态推动了生物科技生态系统的资本循环，并重新吸引投资者参与。瑞银认为，本轮复苏的核心驱动力依然稳固，大型药企仍面临巨额资金部署需求及未来专利悬崖（LOE）缺口，因此对板块维持建设性看法，看好2026年末至2027年的进一步上行空间。 三大核心观察 1. 利率敏感性钝化，加息预期大部分已计价 历史规律显示生物科技（以XBI指数为代表）对利率高度敏感，但三季度以来即便面临进一步加息预期（市场隐含2026年底前再加息概率达80-90%），XBI仅从170美元附近回落至155美元左右，季度基本收平。瑞银认为，后续加息的绝大部分负面影响已提前反映于估值中。本轮牛市虽部分受益于宽松利率环境，但更关键的是基本面改善——并购与IPO市场活跃且质量提升。当前基本面驱动因素并未发生改变。瑞银将并购与IPO活动视为衡量板块健康度的关键风向标。 2. IPO市场运行高效，项目质量显著优于2020-21年 2026年迄今已有22家生物科技公司完成IPO，全年IPO募资总额有望达到约100亿美元，逼近2020/21年140-150亿美元的峰值。关键区别在于：约80%的2026年IPO公司携带II/III期资产上市，而2020-21年牛市中多数IPO仅为I期甚至临床前阶段。这种后期资产占比的提升意味着2026年IPO队列风险更低，为投资者创造价值及维持良性融资周期的概率更高。截至目前，该队列平均回报约40%，约70%的公司交易价格高于发行价，成为过去五到六年来表现最佳的IPO年份之一。 3. 三季度并购节奏放缓但无结构性恶化 三季度生物科技并购总交易额约240亿美元，低于一、二季度的540亿和420亿美元，但仍位列过去五到六年最强季度之列。瑞银强调，这并不代表并购需求的结构性下降。分析显示，大型药企仍需持续进行补强交易——未来十年行业面临约4000亿美元的专利悬崖缺口。AMGN、BMY、SNY、NVS、NVO等公司被点名具有更大交易空间（例如BMY自收购KRTX和RYZB后未有大动作，AMGN自HZNP交易后亦沉寂）。ABBV、JNJ等虽无近期重大LOE压力，但为布局2030年后增长仍具备充足财务灵活性。 中国对外授权：创纪录但不构成系统性威胁 2026年中国生物科技对外授权交易活跃度创历史新高，年内已有约10笔交易首付款超过3亿美元。然而，此类交易的经济体量相对有限，无法直接媲美全球大型并购。瑞银认为，这可能对拥有低差异化早期资产的美国公司形成一定竞争压力（因全球药企可能以更低成本从中国获取类似或更优质资产），但不会影响大型美国并购交易。收购方通常愿意为后期II/III期或已获批资产支付显著溢价，这类资产与中国授权标的存在本质差异。 风险提示 • 更高更久的利率环境：若利率持续上行或长期维持高位，资金可能从高风险生物科技流向收益型资产，压制估值。 • IPO市场过热：若大量早期/临床前公司涌入公开市场，可能预示风险偏好过度扩张，需警惕市场热情脱离基本面。当前高质量IPO队列是重要缓冲。 • 政治与地缘政治不确定性：中美关系紧张及政策变动可能干扰中国授权交易，若资本持续外流至海外而非投入美国生物科技生态，将削弱本土M&A活跃度与资本循环。 估值与策略结论 尽管存在短期逆风，瑞银未发现生物科技板块出现结构性放缓的证据。基本面保持强劲，随着更多并购落地、临床催化剂和数据读出持续兑现，板块有望从当前水平进一步上行。中小型生物科技（SMID-cap）估值仍具吸引力——尽管经历反弹，其EV/现金流等关键指标仍低于历史均值。建议投资者聚焦具备后期管线、财务稳健的行业龙头，同时密切关注利率路径、并购脉搏及中国授权交易的边际影响。#文字观点", "publish_time": "2026-10-06 19:19", "tags": ["文字观点"]}, "attachment:files/AI硅光代工隐形冠军，全球扩产把握光互联机遇.docx": {"id": "attachment:files/AI硅光代工隐形冠军，全球扩产把握光互联机遇.docx", "kind": "attachment", "title": "AI硅光代工隐形冠军，全球扩产把握光互联机遇", "source_label": "其他", "excerpt": "AI硅光代工隐形冠军，全球扩产把握光互联机遇 感谢各位参加今晚的会议。今天我们围绕光通信行业以及 Tower 半导体做一次系统性的交流。", "content": "AI硅光代工隐形冠军，全球扩产把握光互联机遇 感谢各位参加今晚的会议。今天我们围绕光通信行业以及 Tower 半导体做一次系统性的交流。我们会先讲行业正在发生什么变化，再讲这些变化为什么能够传导到 Tower，最后梳理公司自今年二季度以来的一些重要进展。 先把观点放在前面：在 AI 光互联产业链中，我们重点看好 Tower 半导体。核心原因是光互联正在同时经历应用范围的扩大和制造内容的升级。过去大家主要关注数据中心机柜之间的网络连接，往后光有机会进一步跨机柜进入 scale up 网络，并逐步探索机柜内部（即柜内的 scale up）。与此同时，随着光引擎靠近交换芯片和计算芯片，硅光平台要承担更复杂的器件集成和制造任务。这两条线分别对应我们今天要讲的两个核心逻辑——量升和价升。这里的\"量\"，最终要落到 Tower 能够交付多少经过客户认证的晶圆；这里的\"价\"，要落到每片晶圆承担了什么样的工艺、什么功能，以及 Tower 实际提供了多少制造服务。分析一家公司，不能只停留在\"光通信市场很大\"这一层面，更关键的是回答：行业需求如何变成公司的订单，以及公司能否及时把这些订单交付出去。 今天大家可以带着三个问题来听。第一，1.6T 和 CPO 会怎样改变光通信的产业分工；第二，为什么除了光模块和激光器，我们还需要重视硅光晶圆代工；第三，今年二季度以来 Tower 有哪些变化，让这个逻辑更加具体。接下来我们逐一展开。 先讲行业。今年光通信行业最值得关注的变化，是速率升级和应用范围的扩大开始叠加。速率这条线很直观：从 800G 到 1.6T，再储备 3.2T。应用范围这条线则影响更长期的空间：光互联从现有的 scale out 网络，逐步向需要更高带宽、更低延迟的 scale up 网络延伸。两者叠加，意味着我们不能只用\"每年多卖了多少只相同规格的光模块\"来理解这个行业。 先讲近况。八月，Lumentum 发布财年四季度业绩公告，管理层提到 1.6T 采用正在推进，高功率 CPO 激光器需求正在增加，已取得外置激光器模块的初始订单，并开展了多项 NPO 合作。这些信息分别对应当前产品升级、光源准备和新架构导入，说明整个产业链的投入已经落到了具体的产品和客户项目上。 再看九月的 ECOC。Marvell 展示了 2 纳米、400G 每通道的光 PAM4 技术，以及采用 200G 每通道硅光的 102.4T CPO 平台。前者指向 3.2T 连接的技术储备，后者体现光引擎与高带宽计算交换系统更紧密集成的趋势。这些进展共同说明：行业一边在推进 1.6T，一边在为下一代速率和封装形式做准备。 接下来解释硅光。硅光可以简单理解成把波导、调制器、探测器等光学功能全部集中到硅基芯片上。传统分离器件是把多个器件组装并对准，硅光则尝试利用晶圆制造把这些功能全部集成起来。随着速率越高、通道越多，系统对集成能力的要求也就越高。 这里先澄清一个看光通信时容易混淆的概念：硅光是一种器件和制造平台，而可插拔、NPO、CPO 主要描述光学器件放在哪里、怎样与系统连接。可插拔光模块里同样可以使用硅光，因此硅光的增长并不需要等所有设备都切换到 CPO——可插拔方案同样会带动硅光增长。另一方面，硅光也没有让激光器失去作用：光信号仍然需要光源，可以由外置的连续波 CW 激光器提供，也可以采用异质集成的方式，把相应功能引入光子芯片。 再把几种架构说得直观一些。传统可插拔光模块位于设备前面板，优点是成熟、便于维护。LPO 与可插拔类似；NPO 进一步把光引擎放到更靠近主芯片的位置；CPO 则把光引擎与主芯片纳入更紧密的封装体系。它们共同的方向比较一致——缩短最难处理的高速电信号路径。 为什么这个方向越来越重要？因为带宽增长之后，系统不能只关心能否把信号传出去，更关心传输消耗多少电、占用多少空间、能否可靠运行。对大型 AI 集群来说，网络侧的节省可以把功耗和空间资源让给计算。新架构同时也会带来测试、散热、光纤连接和维修方面的问题，所以不同客户会根据自身系统条件做不同选择。 从已发生的进展来看，CPO 也不再是遥远的概念。今年 6 月 Computex 官方更新宣布 Spectrum-X Ethernet for AI 进入生产阶段，应用范围包括 scale out 和 scale across，说明交换机侧的 CPO 已经有了比较明确的产业进展。但交换机使用 CPO，并不能直接推导出同一系统内 GPU 柜内互联也变成光，所以要注意节奏，也不能把整个 CPO 供应链都归属于 Tower。 这个区分很重要。研究时至少有两条维度：一是连接发生在哪里——是 scale out、跨机柜 scale up，还是柜内 scale up；二是用什么实现——可插拔、NPO 还是 CPO。两者可以有很多组合：跨机柜的 scale up 不一定只用 CPO，CPO 也不一定只用于 scale up。把这些维度分清楚，测算时才不会重复计算。关于行业空间，我想引用一个很有启发性的假设：LightCounting 今年 5 月的公开材料表示，其远期预测仍主要假设 scale out 光互联发生在多机柜之间，机柜内部继续依赖铜连接。 也就是说，即使采用相对审慎的架构假设，行业仍有扩展空间。如果未来光进一步进入柜内，将打开新的应用范围，这是更远期的想象空间。因此我们对行业的判断是：当前跟踪 1.6T 产品的批量交付，中期跟踪跨机柜的 LPO、NPO、CPO 项目落地，长期观察柜内光互联；可插拔与新的封装形态会在不同场景并存。对投资和研究而言，最值得寻找的是能够参与多个阶段、并持续跟进技术升级的制造平台——这就引出了 Tower。 Tower 大家应该都有基本了解，是一家特色工艺晶圆厂。放到 AI 光通信链条里，最值得关注的两类能力分别是硅光和硅锗。硅光平台服务于 PIC（硅光芯片），承担光信号的调制、传输、接收功能；硅锗平台服务于高速模拟电路，包括驱动器和跨阻放大器。驱动器把电信号送给光调制器，跨阻放大器把接收到的微弱信号放大，变成后续电路可以处理的信号。所以一个光电高速电路里，既有光芯片也有电芯片。 即使某些新架构减少了独立的 DSP，电光转换周围的模拟功能需求仍然存在，只是可能被重新集成：单颗芯片的数量和边界会改变，但带宽、噪声、线性度和功耗的要求仍需解决。 Tower 可以参与到其中部分 PIC 和模拟 EIC 的制造，具体承接多少要看分工。为什么我们重视这个位置？因为客户要做硅光产品，并不是拿到晶圆产能就能立刻出货，而是要在特定工艺平台上完成设计、流片、测试、封装、适配和可靠性认证。波导尺寸有偏差，就可能影响损耗；调制器、探测器与驱动电路配合不好，就可能影响速率和功耗。制造平台与客户设计之间存在持续的协同工作。 这也解释了为什么硅光代工的竞争力不能简单用几纳米来排序。对先进逻辑芯片，晶体管密度当然重要；对光子芯片，器件损耗、调制效率、耦合能力、良率以及批量交付的一致性同样关键。能够帮助客户稳定做出产品、并连续支持下一代产品平台，往往比一张名义上的产能表更有研究价值。 Tower 已经具备一些可验证的商业基础。比如五月份公司公告提及超过 50 家活跃硅光客户；六月与 Marvell 宣布相干 PIC 累计出货超过 500 万颗。前者体现客户覆盖，后者体现复杂光子芯片的批量制造经历。我们不会据此断言所有客户都会成功，也不会把累计出货当成当年出货，但这些事实让我们看到 Tower 的技术能力有实际的出货支撑。因此，我们看 Tower 主要看他能否在更多客户、更多光互联场景中持续提供经过认证的硅光和硅锗制造能力。 下面分别讲价格和数量。先看价格。我们认为 Tower 中长期的价值逻辑主要来自可插拔向 CPO 等高集成度方案演进时，晶圆工艺复杂度和制造内容的提升。这与普通成熟产品因短期缺货而涨价不同：短期供需会影响溢价，但更值得关注的是产品换代后，客户实际购买的制造服务发生了变化。举个例子，假设原来的光芯片只需完成相对标准的收发功能，而新一代产品要求在有限面积内集成更多通道、更复杂的光路监测和调节功能，并适配更紧密的电光互联。那么晶圆厂要实现的就不只是把原有产品多生产几片，而是新的工艺组合、新的器件结构以及更严格的一致性控制。 在 CPO 体系里，光引擎与交换芯片或计算芯片距离更近，可以减少长距离高速电连接，但也会增加光电热协同的难度。工艺要兼顾低损耗光路、高速调制探测性能以及封装接口，有些方案还需额外的材料集成和键合步骤。这些变化能否转化成 Tower 的收费，取决于具体工艺流程以及哪些步骤由 Tower 承担。 我们把潜在的价值提升拆成三个层面。第一层，晶圆前道本身的器件种类、工艺步骤和制造精度要求变化，可能对应更高的单片加工价值。第二层，产品结构：客户从相对成熟的 PIC 迁移到更高性能、更定制化的平台，可能带动平均售价中枢变化。第三层，服务边界：平台若能承接必要的异质集成、键合及相关制造环节，就可能在单个产品上承担更多工作。这三个层面都与复杂度提升有关，但需要分别判断：产品尺寸变大会改变每片晶圆能切割多少颗芯片，增加工艺步骤会改变每颗晶圆的加工成本和收费，更多客户转向高端工艺会改变公司整体产品组合。有时三者同时发生，所以需要具体区分每一种大概对应多少涨价或价格变动。 当然，工艺复杂度提升并不自动等于溢价能力或盈利能力的提升。如果客户可以轻易切换供应商，或新工艺良率长期无法改善，竞争成本就不一定得到有效补偿。因此我们看好这个逻辑的前提，是 Tower 能把高性能、量产良率、客户认证和交付能力结合起来——技术指标必须转化为客户愿意持续采购的产品。 二季度电话会议提供了一个很关键的边界。对于分析师提出的\"NPO 是否提高每个收发器的内容价值\"，管理层没有直接认可；但当问题进一步指向下一代 PIC 与 EIC 集成时，管理层才认可相应机会，并谈到 die to wafer 和 wafer to wafer 键合。这意味着我们不能直接认为 NPO 是涨价的原因，而要看下一代产品多了什么工艺、Tower 多了什么。沿着这个思路，先进封装也要讲得准确：Tower 的重点是利用相关能力支撑核心硅光业务，提高对产品质量和交付周期的控制。这种能力首先体现为更复杂的硅光产品能量产，而不是在晶圆代工收入之外额外加上一整套独立封装业务。制造内容的增加需要结合实际供货边界来验证。 六月与 Marvell 的公告是一个可观察的例子。双方合作不仅涉及相干 PIC，还涉及硅、非硅材料引入、电子器件三维集成以及 V 型槽等光学封装适配能力，说明高速光子平台的升级既包括器件性能，也包括制造和集成能力。九月份与 Nexus 的合作，把方向进一步落实到了激光器异质集成。原来分散在系统不同位置的功能，如果能通过可量产工艺集成到统一平台，晶圆厂就有机会参与更多关键制造步骤。 所以我们对架构的判断，最终会落到这句话：随着可插拔向 CPO 及更紧密的光电集成演进，Tower 有机会从较标准化的光子晶圆加工，走向更复杂、更定制化、包含更多制造环节的平台服务。接下来的更大问题是：这些平台能服务多少新增连接？这就引入下一个话题——量升的逻辑。 量升逻辑的核心，是以往依赖铜互联的网络环节有望逐步过渡到光互联。为了方便交流，今天我们把它分成三个阶段：已有的 scale out、逐步扩展的跨机柜（between rack）scale up，以及更长期的柜内（within rack）scale up。这是一条便于理解的需求扩展路径，不代表所有客户都严格按同一顺序、同一时间表迁移。scale out 主要帮助不同计算节点或计算域通过网络协同，很多连接已采用光。这里的增量主要来自计算节点数量增加、网络带宽提高，以及光学方案中硅光采用率的变化。即便系统架构没有大的改变，只要集群继续扩大、连接继续升级，成熟方案也会持续产生需求。因此，看似已经全光的 scale out，也会受益于集群扩大和连接数提升。 更大的增量来自 scale up。scale up 的目标是让更多加速器在一个更紧密的高带宽互联域内协同，大家熟悉的单柜大规模 GPU 就是这样实现的。当一个互联域需要延伸到多个机柜时，连接距离、线缆数量、布线密度和功耗约束会更突出，光互联就有了更强的引入理由。 scale up 分两种形式：跨柜 scale up 和柜内 scale up。先看跨柜 scale up，它连接跨越两个机柜的连接，但并不自动意味着这就是 scale out——如果两个机柜仍属于同一个紧密协同的 scale up 域，就仍是跨机柜的 scale up（between rack scale up）。我们关心的正是这一层的变化：它让光学器件进入新的高带宽网络，而不仅仅是替换现有 scale out 网络中某种速率的模块。 为什么跨机柜可能先形成机会？直观来看，距离拉长后，铜连接面对的信号完整性、均衡和布线挑战通常会增加；光适合较长距离高速传输，更容易在这些连接中体现系统收益。我们预估这一层会早于柜内 scale up 落地，但最终用可插拔、NPO 还是 CPO，取决于各 CSP 对系统功耗目标、时延要求和维护方案的考量，需要 case by case 判断。 第二是柜内 scale up，这个市场值得重视。柜内有大量高带宽连接，如果未来其中一部分从铜转为光，光互联的使用范围会明显扩大。对硅光平台而言，新增需求不仅来自机柜数量增加，还来自每个机柜内部更多连接开始使用光芯片。但柜内这一步也最需要耐心：距离很短时，铜在成本、时延和工程成熟度上有优势；光要进入柜内，必须解决小型化光源、热环境、光纤管理、连接可靠性，特别是维修问题。所以我们会把柜内光化作为长期增长空间。Lumentum 今年 8 月关于 NPO 合作和外置激光源订单的表述，以及 Tower 与 NewPhotonics 今年 9 月公布的可维护光引擎方案，都为这一延伸提供了产业线索。但从零部件准备到系统客户批量采用，再到覆盖大量机柜，中间还有产品验证和部署过程，我们需要重点观察这些环节是否持续向前推进。 从量的角度看，连接数量如何变成晶圆需求，可以先用一个简单框架理解：计算集群规模 × 每个计算节点的连接需求 × 光的采用比例 × 光学方案中硅光的比例，最后落到每个光学端点需要多少 PIC、每片晶圆能得多少合格芯片。比如两个端点之间一条双向链路，两端都需要对应的光电功能，但不能在计算双向带宽时无意重复翻倍；又如从 200G 每通道升级到 400G 每通道，同样总带宽下所需通道数量可能减少。因此系统带宽翻倍，并不意味着 PIC 颗数或晶圆片数一定同步翻倍。晶圆需求还取决于芯片面积、集成方式和良率。这也正是我们强调新增应用层级的原因：单纯速率提升可能伴随单位带宽芯片用量的下降，但如果光开始进入原来没有采用光的 scale up 连接，整个可服务范围就扩大了。两种力量共同作用，最终决定硅光晶圆的总需求。 研究上更应着重跟踪光渗透到了哪里。除了向机柜内部延伸，还有一个补充方向是 scale across——跨数据中心或跨园区的连接，主要涉及相干光技术，器件、结构和传输要求与短距不同。Tower 与 Marvell 的累计出货，为公司参与这部分市场提供了证据。这条线可以与 scale up 并行发展，但统计时应单独计算，不应在同一网络规模数字上重复叠加。因此我们看好的数量逻辑，并不依赖\"所有铜缆马上换成光\"的极端假设：现有 scale out 提供业务基础，跨机柜 scale up 带来新应用，柜内 scale up 打开更长期空间，相干光则是更远距离上的补充需求。至于 Tower 最终能获得多大份额，需要跟踪客户方案认证进度和供货表现。 再回到公司最新的二季度情况。今年二季度以来，Tower 的变化大致可以概括为：硅光业务实际贡献扩大、扩产路径更加具体、新一代集成方案增加了量产证据。我们按业务需求、产能和技术几个方面讲。 8 月 4 日公布的二季度业绩显示，当季收入 4.6 亿美元，同比增长 24%、环比增长 11%。公司给出的三季度收入指引中值约 5.2 亿美元，上下浮动 5%，对应中值同比增长 31%、环比增长 13%。这些是已披露的结果和指引。比总量更值得关注的是业务结构：业绩材料显示，RF infrastructure 收入占比从上年同期 25% 提升到 49%，占比创了新高。硅光方面，公司公告二季度年化收入运行水平约 6.8 亿美元，并计划四季度跨过 10 亿美元的年化运营水平。年化运营水平就是把某一阶段经营规模折算成全年的节奏。这几组数据合在一起，说明 Tower 的硅光业务已对整体结构形成实质影响。 接下来更重要的是增长质量：客户是否持续下单、新产品是否按计划切入、新增产能能否顺利转化为合格产品。再看签单情况：五月份公司宣布与最大的几家硅光客户签署了对应 2027 年约 13 亿美元收入的合同，并收到 2.9 亿美元产能预付款；公司还提到 2028 年有更高金额的合同承诺。这些信息的意义在于，客户愿意为未来供应能力做出资金和合同安排。对正在扩产的晶圆厂来说，这种安排有助于匹配设备投入与客户需求，客户也能争取所需产能和技术支持。后续我们会把需求讨论、客户承诺、已签合同和实际出货分别跟踪。需要观察的不只是客户愿不愿意预定，还包括预付款对应的设备和工艺是否准备好、客户产品是否认证完成、投产后能否按期验收。 对 Tower 而言，需求侧积极信号已经比较明确，下一阶段研究重心会更偏向执行。看产能：二季度电话会议确认既有的 9.2 亿美元硅光及硅锗设备扩产计划仍在推进，管理层预计相关投资形成的制造能力在 2026 年四季度充分爬坡，达到二季度硅光出货对应水平的三倍以上，完整经营效果预计到 2027 年二季度体现。这段表述有三个时间概念：设备到场不代表马上完成认证，能够投片不代表当即能交付；晶圆加工完成后还需测试和交付流程。因此后续分析扩产，还要跟踪工艺资格认证、客户认证、制造周期和合格产品出货时间。 再看未来比较重要的双轨扩产。7 月 14 日正式宣布日本双轨扩产：Track 1 是把 Arai（原 Fab 6）设施用于 300 毫米硅光及先进封装能力，并最大化利用鱼津 Fab 7 的产出，预计 2027 年四季度具备全面生产准备条件；Track 2 是在 Fab 7 附近建设额外 300 毫米制造设施，面向更长期的硅光及硅锗需求。我们理解 Track 1 与现有产能释放衔接，Track 2 为 2028 年之后的增长提供后续空间。公司七月公告预计 Track 2 从 2029 年开始带来显著贡献，这些都应以计划和预计来表述。 投资规模方面，公司口径是 Tower 扣除补贴后的投入约 30 亿美元，日本政府支持约 10 亿美元。这个数字体现项目规模，但不能简单换算成公司某一年的资本开支，它会跨期执行，政府支持也有相应条件。真正决定项目价值的是建设、设备导入、认证和客户产品爬坡能否衔接。还有一个容易犯错的地方：电话会议提及日本 300 毫米制造能力扩大到约四倍时，管理层澄清其中已包含 Arai 相关增量，所以不能先算 Track 1 再机械地乘以 4。对今天的判断而言，双轨扩产的重要性在于制造能力和技术能力一起布局，具体能交付多少产品还需进一步跟踪。 日本业务结构也要放在这个背景下理解。三月份公布的 TPSCo 重组计划，拟让 Tower 全资拥有 Fab 7 相关运营，NTCJ 全资拥有 Fab 5，目标交割日期为 2027 年 4 月 1 日，但仍取决于交割条件和监管批准，因此这个时间点是重大关注点，直接关乎 TPSCo 股权能否顺利百分之百纳入公司体内。我们关注的是重组完成后，Tower 能否在 300 毫米制造能力、技术路线和客户资源配置上形成更清晰的安排。对于处于产品升级期的平台，制造资源能否及时支持关键客户，非常值得持续观察。 6 月 15 日，Tower 与 IQE 宣布多年的磷化铟外延晶圆供货协议，包含采购和供货承诺，用于下一代硅光平台。这里解决的不是普通硅晶圆供应，而是把磷化铟相关高性能功能引入硅光平台所需的材料基础。对异质集成路线而言，前道工艺关键材料和后续集成步骤需要共同准备。这次合作的意义是材料供应与技术路线开始更紧密配套，有助于降低某些原材料瓶颈，但并不意味着整个行业磷化铟供应问题已经消失，也不意味着 Tower 会替代所有独立激光器厂商——外置光源与集成光源可以服务不同产品。我们更关注 Tower 能否支持客户选择相应方案。qq1490929960 6 月 18 日，公司与 Marvell 宣布相干 PIC 累计出货超过 500 万颗，这类芯片服务于数据中心间互联，验证了 Tower 处理更复杂光学功能的经验。对我们而言，意义更多在于公司同时具备了短距高速互联与更复杂相干光产品客户的合作。技术储备方面，Tower 与 Coherent 在三月份已展示了基于量产就绪硅光工艺的 400G 单通道硅调制器传输，这属于二季度之前的背景，但与 9 月行业对 3.2T 的讨论相衔接，表明现有硅光平台仍在提升能力。Tower 也在探索薄膜铌酸锂、磷化铟、有机材料及相关集成方案，新材料进展未必只有替代既有平台一种结果，也可能成为平台升级的一部分。二季度电话会上，管理层已表达对 2027 年 NPO 出货贡献的积极预期，尤其着重下半年。 最值得补充到这次更新里的，是 9 月 17 日 Tower 与 NewPhotonics 的联合公告：双方宣布采用 PH18DA 平台集成激光器的可维护光引擎 PIC 进入批量出货，当前产品覆盖 800G 和 1.6T；同时提到面向 6.4T NPO 和 NPC505 芯片组，计划 2027 年上半年开始批量出货。这个进展对我们有三层意义：一是异质集成能力开始由技术路线转化为有明确产品名称的量产项目；二是可维护设计回应了新架构落地时很实际的运维问题；三是产品由可插拔延伸到 NPO 的规划，为观察制造平台如何服务不同应用提供了具体抓手。 把这些事情连起来看，今年二季度以来公司的变化已不只是需求强劲：我们看到了具体业务结构变化、客户合同支持、日本扩产安排、材料供应合作，以及新的量产产品。下一步要验证的是这些环节能否持续跟进，最终稳定交付。这一连串合作伙伴的名字，也解释了为什么我们持续跟踪 Tower。 最后把投资判断收回来：在 AI 光互联产业中，我们重点看好 Tower 半导体。从行业方向看，光互联有机会由现有 scale out 应用向跨机柜、再向柜内 scale up 拓展，给硅光平台带来新需求来源；从产品价值看，可插拔向 CPO 及更紧密光电集成演进，有望增加晶圆工艺复杂度和平台承担的主要内容，形成中长期价升动力；从公司能力看，Tower 同时具备硅光和硅锗平台、已有批量产品客户认证和多地区制造基础；从今年二季度以来的更新看，需求承诺、扩产安排和新产品量产又在持续增加证据。因此我们看好的是一个能够持续跟随光互联应用拓展、不断升级制造能力的平台。 这里也需要回应竞争：台积电、格罗方德及其他厂商都在发展相关能力。行业成长并不意味着 Tower 自动获得所有新增订单，尤其是高度依赖某一家先进封装体系的项目，供应链可能与 Tower 当前客户体系不同。我们对 Tower 的积极判断，仍建立在客户设计导入、工艺竞争力和交付表现之上。后续我们最关注三个方面：一是现有产能能否按计划从投片转化为合格产品交付；二是 NPO 异质集成项目能否从客户验证转为持续批量订单，并逐步体现更高制造价值；三是日本扩产、关键材料准备和客户需求能否保持匹配。如果这些环节持续兑现，今天讨论的量升和价升逻辑就会更扎实。风险也主要围绕这些环节：AI 基础设施需求变化、客户部署时间调整、新工艺认证和良率爬坡不及预期、扩产和材料供应延误，以及同业竞争和地缘因素。工艺升级带来更高收益需要真实产品验证，柜内光化的长期空间也需要系统客户逐步采用。我们会持续用这些条件检验投资逻辑。 最后再强调一次核心观点：光互联的投资研究，既要看带宽升级，也要看光进入了哪些新的连接场景，以及制造价值由谁承担。Tower 处在硅光与硅锗制造的关键位置，并正在通过扩产和工艺升级扩大参与能力。基于这些变化，我们继续重点看好 Tower 半导体，建议大家重点跟踪其产能兑现。 全文总结 这是一次围绕\"AI 光互联产业链\"的系统性投研交流，核心标的是 Tower 半导体（Tower Semiconductor），并提出了\"量升＋价升\"的双重逻辑，结论是重点看好 Tower。 一、行业背景：速率升级与应用范围扩大叠加 速率升级线：光通信从 800G 向 1.6T 升级，并储备 3.2T。9 月 ECOC 上 Marvell 展示了 2 纳米 400G 每通道光 PAM4 技术（指向 3.2T）和 200G 每通道硅光的 102.4T CPO 平台。 应用范围线：光互联从现有 scale out（机柜间横向扩展）网络，向更高带宽、更低延迟的 scale up（纵向扩展）网络延伸——先是跨机柜 scale up，再是柜内 scale up，另有 scale across（跨数据中心/园区，相干光）。 近期产业证据：8 月 Lumentum 财报提及 1.6T 采用推进、高功率 CPO 激光器需求增加、取得外置激光器模块初始订单并开展多项 NPO 合作；6 月 Computex 官方宣布 Spectrum-X Ethernet for AI 进入生产阶段（交换机侧 CPO 有明确产业进展）；LightCounting 今年 5 月远期预测仍主要假设光互联发生在多机柜之间、柜内继续用铜，说明即使按审慎假设行业仍有扩展空间。 二、几个关键概念辨析 硅光是器件和制造平台；可插拔、LPO、NPO、CPO 描述的是光器件放哪里、如何连接系统。可插拔光模块同样可用硅光，硅光增长不必等 CPO 全面切换；硅光也不会取代激光器，光源可外置（CW 激光器）也可异质集成。 架构演进方向一致：缩短最难处理的高速电信号路径。但交换机用 CPO 不等于 GPU 柜内互联也光化，测算时要区分\"连接发生在哪里\"（scale out／跨柜 scale up／柜内 scale up）和\"用什么实现\"（可插拔／NPO／CPO），避免重复计算。 三、为什么看好 Tower：制造平台的价值 Tower 是特色工艺晶圆厂，在光通信链条中有两类关键能力：硅光平台（服务 PIC，负责调制、传输、接收）和硅锗平台（服务高速模拟电路，如驱动器和跨阻放大器）。 即使新架构减少独立 DSP，电光转换周围的模拟功能需求仍在，只是重新集成。 硅光代工竞争力不能简单用制程节点排序，关键在器件损耗、调制效率、耦合能力、良率、批量一致性，以及与客户设计的持续协同。已有可验证基础：5 月公告超 50 家活跃硅光客户；6 月与 Marvell 宣布相干 PIC 累计出货超 500 万颗。 四、价升逻辑（制造内容的升级） 核心：可插拔向 CPO 等高集成度方案演进时，晶圆工艺复杂度和制造内容提升，客户购买的是\"新的制造服务\"而非简单多产几片晶圆。 价值提升分三个层面：①前道器件种类、工艺步骤、精度要求提升带来单片加工价值上升；②客户迁移到更高性能平台带动平均售价中枢上移；③承接异质集成、键合等环节扩大服务边界。 边界提示：复杂度提升不等于必然涨价。二季度电话会上管理层未直接认可\"NPO 提高单收发器内容价值\"，只在下一代 PIC 与 EIC 集成（die to wafer、wafer to wafer 键合）问题上认可机会；先进封装的作用是支撑核心硅光业务、提高质量和交付控制，而非单列独立封装业务。 佐证：6 月与 Marvell 合作涉及相干 PIC、非硅材料引入、三维集成、V 型槽等光学封装适配；9 月与 Nexus 合作把方向落实为激光器异质集成。 五、量升逻辑（光渗透到新连接场景） 三个阶段：①已有 scale out（增量来自集群扩大、带宽提升、硅光采用率变化）；②跨机柜 scale up（铜连接在长距离下信号完整性问题突出，光更有收益，预计早于柜内落地，方案选择 case by case）；③柜内 scale up（长期空间，需解决小型化光源、热环境、光纤管理、维修等难题，最需要耐心）。 晶圆需求测算框架：集群规模 × 每节点连接需求 × 光渗透率 × 硅光渗透率 → 每光学端点 PIC 数 ÷ 每片晶圆合格芯片数。注意：系统带宽翻倍不等于 PIC 或晶圆数翻倍（通道速率升级会减少通道数），需避免重复计算。 结论：数量逻辑不依赖\"铜全换光\"的极端假设——scale out 提供基础、跨柜 scale up 带来新应用、柜内 scale up 打开长期空间、相干光补充更远距离需求。 六、公司二季度以来的实际进展（2026 年内） 业绩：8 月 4 日披露二季度收入 4.6 亿美元（同比 +24%、环比 +11%）；三季度指引中值约 5.2 亿美元（±5%，同比 +31%、环比 +13%）。RF infrastructure 收入占比从 25% 升至 49% 创新高；硅光年化收入运行水平约 6.8 亿美元，计划四季度跨过 10 亿美元。 签单：5 月与最大几家硅光客户签署对应 2027 年约 13 亿美元收入的合同，收到 2.9 亿美元产能预付款，并提及 2028 年更高金额承诺。 扩产：既有 9.2 亿美元硅光及硅锗设备扩产计划推进中，预计 2026 年四季度充分爬坡、达到二季度硅光出货对应水平三倍以上，完整经营效果 2027 年二季度体现；7 月 14 日宣布日本双轨扩产——Track 1（Arai/原 Fab 6 的 300 毫米硅光与先进封装，2027 年四季度具备全面生产准备）与 Track 2（Fab 7 附近新增 300 毫米设施，面向更长期需求，预计 2029 年起显著贡献）；公司口径 Tower 扣除补贴后投入约 30 亿美元、日本政府支持约 10 亿美元（跨期执行、附条件）。注意：日本 300 毫米能力扩大到四倍已包含 Arai 增量，不可再机械乘 4。 重组：3 月公布 TPSCo 重组计划，拟由 Tower 全资拥有 Fab 7、NTCJ 全资拥有 Fab 5，目标交割日 2027 年 4 月 1 日，取决于交割条件与监管批准。 材料与伙伴：6 月 15 日与 IQE 签署多年磷化铟外延晶圆供货协议（下一代硅光平台的异质集成材料基础）；6 月 18 日与 Marvell 宣布相干 PIC 累计出货超 500 万颗；与 Coherent 3 月展示 400G 单通道硅调制器传输（400G 每通道能力）；探索薄膜铌酸锂、磷化铟、有机材料等新材料方案。 最关键更新：9 月 17 日与 NewPhotonics 联合公告，采用 PH18DA 平台集成激光器的可维护光引擎 PIC 进入批量出货（覆盖 800G/1.6T），并规划 2027 年上半年起面向 6.4T NPO 和 NPC505 芯片组批量出货。三层意义：异质集成从技术路线变成具名量产项目、可维护设计回应运维痛点、产品从可插拔延伸到 NPO。 七、竞争与风险 台积电、格罗方德等也在发展相关能力；行业成长不等于 Tower 自动获得所有新增订单，尤其依赖特定先进封装体系的项目，供应链可能与 Tower 客户体系不同。 主要风险：AI 基础设施需求变化、客户部署时间调整、新工艺认证与良率爬坡不及预期、扩产和材料供应延误、同业竞争与地缘因素；柜内光化需系统客户逐步采用，属长期逻辑。 八、结论与跟踪重点 结论：看好 Tower 的理由是——行业方向（光互联向跨机柜、柜内 scale up 拓展）、产品价值（向 CPO 演进带来价升）、公司能力（硅光＋硅锗双平台、批量客户认证、多地区制造基础）三者叠加，且二季度以来需求承诺、扩产安排、新品量产持续提供证据。 后续三大跟踪重点：①现有产能能否按计划从投片转化为合格产品交付；②NPO 异质集成项目能否从客户验证转为持续批量订单并体现更高制造价值；③日本扩产、关键材料准备与客户需求能否匹配。核心落点是产能兑现。", "status": "extracted"}, "post:2026-10-06T19-20:6a82fd5ff5e3": {"id": "post:2026-10-06T19-20:6a82fd5ff5e3", "kind": "post", "title": "2026-10-06 19:20", "source_label": "帖子正文", "excerpt": "伯恩斯坦——美国网络与通信设备——AI价值链：1GW的AI ASIC数据中心容量实际成本究竟几何？• 基于与行业专家的一系列对话、供应链核查及第三方数据，伯恩斯坦将此前针对英伟达Blackwell与Vera Rubin AI数据中心单机柜（Pod）级经济性的分析扩展至AMD与ASIC架构，形成本篇深", "content": "伯恩斯坦——美国网络与通信设备——AI价值链：1GW的AI ASIC数据中心容量实际成本究竟几何？ • 基于与行业专家的一系列对话、供应链核查及第三方数据，伯恩斯坦将此前针对英伟达Blackwell与Vera Rubin AI数据中心单机柜（Pod）级经济性的分析扩展至AMD与ASIC架构，形成本篇深度测算。Excel底稿可应要求提供。 • 核心产出：各架构单机柜成本（美元/机架）与每GW总资本开支测算，以及单GPU小时成本的拆解。 Vera Rubin（VR NVL72）：下调至750万美元/机架，与供应链预期对齐 • 修正后估值为750万美元/机架，较此前910万美元显著下调。主要驱动因素：①下调单机柜NAND内容量假设（因重新评估机柜外NAND的会计处理）；②对HBM4定价采取更保守预期；③基于亚洲渠道核查修正网络内容量；④修正散热与供电交付估算；⑤纳入最新DRAM与NAND价格。 • 当前估值与供应链传闻的700–800万美元/机架高度吻合。 • 具体拆分：GPU（Rubin）按单颗5.5万美元、单机柜72颗计算，仅GPU即达396万美元，占机架成本近半；Vera CPU按单颗5,000美元、36颗合计18万美元。HBM4内容量维持20.7TB，单价从48美元/GB下调至30.6美元/GB，假设英伟达加价10%，对应HBM内容量约69.7万美元。内存与存储合计约180万美元。网络内容量约120万美元（Scale-up约60万、Scale-out约50万、前端约8万）。散热与供电合计约40万美元。 AMD MI455X Helios：730万美元/机架，与Vera Rubin相近但结构迥异 • 单机架估值730万美元，与VR NVL72处于同一量级。 • 核心差异：AMD在GPU上利润率较低，计算内容量较少，但CPU价值量高于英伟达Vera；网络内容量显著更高，因AMD设计包含\"最多3个\"NIC/GPU。 • 具体拆分：MI455X GPU按单颗3.5万美元、72颗合计250万美元（不含HBM）；CPU按8,000–15,000美元上沿、18颗合计26.8万美元。HBM按31.1TB、30.6美元/GB、无加价，约95万美元。DRAM约120万美元，直连NAND约53万美元。网络因NIC数量多，Scale-out交换与SuperNIC合计显著高于英伟达。 OpenAI Jalapeno：490万美元/Pod，架构与英伟达参考设计截然不同 • 此前预期Jalapeno为英伟达架构白牌版（仅替换GPU为廉价ASIC），但深入审视发现设计根本性不同：OpenAI意图扩展Scale-up域、将数据保留在HBM（及DRAM）本地、降低对Scale-out与NAND的依赖。 • 该系统为双机架设计：主机架含16个Katsu托盘（各配2颗Turin级CPU）；ASIC机架含16个Vindaloo ASIC托盘（各8颗ASIC）和8个Chana交换托盘。 • 成本拆分：ASIC含HBM约2.25万美元/颗，128颗ASIC合计约288万美元（其中HBM内容量约850万美元，倒推ASIC裸片约160万美元）；CPU按1万美元/颗、16颗合计32万美元。存储与DRAM合计约145万美元。网络设计最大差异在于以OCS层替代传统Scale-out，Scale-up内容量显著抬升。 Google TPU v7 Ironwood：270万美元/机架（置信度较低） • 伯恩斯坦最佳猜测为270万美元/机架，但因公开披露有限，对细颗粒度估算信心不足。 • 假设ASIC硅成本与GB200可比，但Broadcom利润率约55%（vs. 英伟达70%），对应ASIC单价约2.2万美元。Axion CPU按约2,000美元、16颗合计3.2万美元。HBM3E按192GB/ASIC、22.4美元/GB，约27.5万美元。DRAM约12.6万美元，NAND约9.2万美元。网络含OCS（MEMS方案，约600美元/端口）约15.4万美元。 每GW总资本开支：350–395亿美元/GW • 基于各XPU Pod的公开功耗与供应链反馈，假设机架占数据中心总功率的78%（基于1.15 PUE及服务器机架占IT设备功率90%），并纳入最新机柜外冷却、供电与土建成本（接近此前120–150亿美元区间下沿）。 • 测算结果：OpenAI Jalapeno约346亿美元/GW，VR NVL72约395亿美元/GW，AMD MI455X约357亿美元/GW，TPU v7约390亿美元/GW，GB200 NVL72约365亿美元/GW。 • 单GPU小时成本：在40%利用率、0.15美元/kWh电价假设下，VR NVL72年化单GPU总成本约3.19美元/小时，其中折旧占绝对主导（约2.58美元），电费仅约0.52美元，人员等其他运营成本可忽略。 出货量隐含的GW规模与区域偏移 • 将单机柜功耗与各加速器出货量结合，2026年隐含出货约36GW，2027年约43GW——显著高于伯恩斯坦美国数据中心模型中2026E 18GW、2027E 26GW的容量新增预测。 • 差异主因：美国数据中心因运营、供电可用性与政策延迟日益普遍，AI实验室正转向非美合作伙伴（如OpenAI与Firmus在澳大利亚、新加坡、印尼和马来西亚的合作），国际建设的重要性持续上升，导致美国本土部署占比可能低于历史常态。 投资评级速览（部分重点标的） • Outperform（跑赢）：Celestica（目标价520美元）、Cisco（110美元）、Arista（250美元）、Lumentum（1,220美元）、Coherent（350美元）、英伟达（400美元）、AMD（650美元）、博通（575美元）、台达电（2,620新台币）、宏致（990新台币）、Chroma ATE（2,750新台币）、Digital Realty（226美元）、Equinix（1,270美元）、Vertiv（368美元）、nVent（229美元）、Johnson Controls（190美元）、Trane（575美元）、Amphenol（99美元）、TE Connectivity（243美元）等。 • Market-Perform（同步大市）：Carrier（78美元）等。 • Underperform（跑输）：Quanta（250新台币）、CoreWeave（74美元）等。 整体叙事 • 可用算力持续加速释放，2026年终端用户采用明显提速，驱动AI实验室需求激增。Rubin周期叠加AI ASIC的更广泛应用将进一步推升可用算力，构成解锁更广泛AI采用的关键催化剂。产业链利润在服务器/存储/网络与机柜外基础设施之间的分配，以及美国本土与国际部署的节奏差异，是未来 capex 流向的核心变量。#文字观点", "publish_time": "2026-10-06 19:20", "tags": ["文字观点"]}, "post:2026-10-06T19-18:86c781543768": {"id": "post:2026-10-06T19-18:86c781543768", "kind": "post", "title": "2026-10-06 19:18", "source_label": "帖子正文", "excerpt": "高盛——台积电（2330.TW / TSM）业绩前瞻：增长动能延续至2027年；资本开支上修以支撑长期需求", "content": "高盛——台积电（2330.TW / TSM）业绩前瞻：增长动能延续至2027年；资本开支上修以支撑长期需求；重申买入；目标价上调至3,300新台币 台积电将于10月15日召开3Q26分析师会议。高盛预计公司2026年将以强劲表现收官，且增长前景将延续至2027年，驱动力来自AI GPU/ASIC、网络及服务器CPU需求的全面扩散。尤其值得关注的是，过去一年间由代理式AI（agentic AI）驱动的CPU需求显著增强，成为关键边际变化。高盛预测2026E/2027E营收（美元计）同比分别增长42.0%/36.9%，毛利率分别为67.2%/67.5%。同时，因预期台积电将进一步加大产能投资以满足客户长期需求，高盛将2027E/2028E资本开支预测由780亿/820亿美元上调至850亿/980亿美元。 3Q26业绩预览与4Q26展望 • 3Q26E：预计营收环比增长15.3%（美元计），受AI/HPC需求持续强劲拉动；毛利率预计由2Q26的67.7%微降至67.5%，主因N2制程爬坡带来的短期稀释效应。 • 4Q26E：预计营收环比再增11.0%（美元计），毛利率进一步微降至67.3%，N2稀释影响持续但可控。 • 季度节奏：3Q26E与4Q26E的营收与利润环比均呈双位数增长，印证下半年旺季效应及AI需求的结构性支撑。 2027年增长动能：AI需求广谱化 高盛预计2027E营收（美元计）同比增长36.9%（此前预期为32.0%），上调主因AI加速器与网络需求持续旺盛，叠加服务器CPU贡献显著增强。在近期高盛Communacopia+科技会议上，管理层强调token成本下降将刺激更多AI消费，而与客户及美国云服务提供商（CSP）的沟通亦强化了需求与基础设施就绪度的信心。这些趋势共同支撑先进制程（尤其是N2与N3）需求的持续性，管理层预计尽管产能持续扩张，供应仍将不足。 毛利率展望：温和扩张 高盛预测2027E毛利率将温和改善至67.5%（2026E为67.2%），驱动力包括：定价环境向好、产品组合优化、产能利用率维持高位以及生产效率提升。供应端方面，N5向N3的制程转换、产能追加及生产率提升将支撑晶圆出货量增长，同时CoWoS先进封装产能的持续扩张亦助力相关晶圆出货。 资本开支上修：支撑长期扩张 • 2026E：维持640亿美元预测不变。 • 2027E/2028E：分别上调至850亿/980亿美元（此前为780亿/820亿美元），以反映：1）设备供应商成本通胀；2）与潜在德州新厂相关的初期支出（但预计该厂最早2032年后才进入量产）。 • 产能规划：维持2027E/2028E末N3/N2产能预期不变，分别为20万/14万片/月（wpm）与22万/20万片/月。 分析师会议焦点前瞻 1. 长期AI增长展望：需求从加速器向CPU及网络扩散，进一步拓宽台积电长期机遇。关注管理层对2030年前AI假设的更新评论，以及可能显著改变前景的变量。 2. 长期资本开支与美国扩张：关注管理层对长期CapEx轨迹及支撑投资决策的需求可见度的指引，以及美国亚利桑那州以外是否会因客户需求进一步扩产的时间表与规模。 3. 代工竞争格局与技术领导力：关注管理层对英特尔、三星及Terafab等竞争态势演变的看法，以及技术领先优势在未来制程节点是扩大还是收窄。 盈利预测调整 高盛将2026E/2027E/2028E盈利分别上调1%/7%/8%，主因：1）N2爬坡对毛利率的稀释效应较预期温和；2）受AI/HPC需求拉动，N2/N3产能利用率（UTR）预期上修。具体而言，2027E每股收益（EPS）由140.91新台币上调至150.00新台币，2028E由180.83新台币上调至195.67新台币。 估值与目标价 基于盈利上修，高盛将12个月目标价由3,100新台币上调至3,300新台币（2330.TW），方法为对2027E EPS应用22倍目标市盈率（不变，参考5年远期市盈率均值上方1个标准差）。对应ADR（TSM）目标价由620美元上调至660美元（基于美元/新台币汇率30.0及20% ADR溢价）。22倍目标市盈率亦对标台积电上一轮营收上升周期（2019-2021年三年营收CAGR为28%）的平均交易市盈率22倍，而高盛预测的2025-2028E三年营收CAGR高达38%。新目标价隐含28%上行空间（ADR隐含40%），重申买入评级。 投资论点 台积电是全球领先的逻辑晶圆代工企业，在先进制程领域占据逾60%市场份额。高盛看好其坚实的技术领导力与执行力，认为其能最优捕捉AI/5G/HPC/EV等领域的长期结构性增长机遇。当前估值处于10年交易区间中端（市盈率10-29倍），具备吸引力。作为高盛中国台湾半导体覆盖范围内关键的AI赋能者，台积电凭借先进制程与CoWoS技术，有望实现未来数年25%的营收CAGR，长期毛利率维持在56%以上。 关键下行风险 （1）终端需求复苏进一步恶化影响产能利用率；（2）客户制程迁移慢于预期；（3）AI投资放缓导致长期半导体含量增长低于预期；（4）良率/执行不佳致盈利弱于预期；（5）竞争加剧引发ASP/盈利侵蚀；（6）不利汇率趋势或成本上升超预期拖累利润率。#文字观点", "publish_time": "2026-10-06 19:18", "tags": ["文字观点"]}, "post:2026-10-06T21-35:605ccdb7f1f0": {"id": "post:2026-10-06T21-35:605ccdb7f1f0", "kind": "post", "title": "2026-10-06 21:35", "source_label": "帖子正文", "excerpt": "瑞银——美国半导体与半导体设备行业SemiBytes——AVGO、SEMICON展会前瞻、STX/WDC、CRWV活动、AMD 一、核心投资论点：算力供电缺口持续扩大，但存在三条弥合路径 瑞银基于半导体出货量与\"供电外壳\"（powered shell，即可供电数据中心容量）的匹配分析，认为这是半导体", "content": "瑞银——美国半导体与半导体设备行业SemiBytes——AVGO、SEMICON展会前瞻、STX/WDC、CRWV活动、AMD 一、核心投资论点：算力供电缺口持续扩大，但存在三条弥合路径 瑞银基于半导体出货量与\"供电外壳\"（powered shell，即可供电数据中心容量）的匹配分析，认为这是半导体行业当前最核心的争论点且正在加剧。2027年预计算力出货量约50GW（含PUE因素需约57GW供电容量），但当前可见的供电外壳仅约38GW（不含早期电厂项目）；2028年缺口进一步扩大，算力出货68GW（需约76GW供电）对应当前可见供电50GW。瑞银指出三条潜在弥合路径：①约50GW的早期电网项目管线（C27/C28各需40-50%转化并网，但瑞银认为实现难度较大）；②表后（behind-the-meter）解决方案的上行潜力，设备产能充足且跨终端市场可替代性强；③鉴于中国电网供应状况，美国芯片企业被允许返销中国的程度。整体而言，理论上到2030年供电外壳产能可见，但这要求表后方案和早期并网电厂的绝大多数项目均须完工并网。 二、AVGO：TPU路线图重大调整，v10设计极为亮眼 继近期管理层会议后，瑞银通过供应链核查调整了博通（AVGO）的TPU单元模型。管理层确认正深度参与v8i之后两代产品研发，但市场因未见2nm晶圆分配而担忧N2项目取消。核查显示：谷歌正以多个3nm计算芯片（尺寸大于当前3nm v8i/Sunfish）通过多芯片模块组合的方式替代v9（Pumafish），该设计预计2027年末起量，2028年贡献主要出货量。此后AVGO将转向2nm的v10，设计极为出色，2028年末开始出货并成为2029年TPU出货主力。v10将采用全新3.5D封装技术，单封装可集成多达16颗芯片，首次搭载AVGO的448G SerDes（与半导体解决方案集团总裁Charlie Kawwas近期行业会议暗示一致）。前沿模型公司正将更多功能（含SRAM和ARM CPU核心）集成于封装内，设备趋向更大、更模块化。AVGO与TOPPAN的合资企业（AST）近期在新加坡启用首座FC-BGA工厂，显著扩充封装能力；瑞银预计AVGO将逐步提升内部封装比例，但直到v10世代台积电CoWoS仍将占其需求的约75%。整体微调单元预期以反映新v10设计，营收预测不变。 三、2026 SEMICON West展会前瞻：制造产能扩张为核心主题 SEMICON West展会于10月12日当周重返旧金山（最后一届）。尽管多数公司处于静默期，瑞银仍安排多场投资者会议（含10月12日大型投资者活动）。晶圆厂设备（WFE）市场预期C2028年已达约2800-3000亿美元区间，瑞银将重点寻找主要OEM及其供应链制造产能扩张的证据。预计部分公司将描绘极为乐观的 decade末增长图景，有公司告知供应链为C2030年5000亿美元WFE做准备。Terafab仍是重大不确定因素——其资本开支水平可能接近台积电，且可能彻底重塑过去50余年基本未变的晶圆厂工艺流程，部分变革可显著提升制造效率，短期对WFE需求构成重大顺风，但长期影响难以评估。 • AMAT投资者早餐会（10月13日）：CEO Gary Dickerson与CFO Brice Hill将出席。瑞银预计活动超越常规技术更新但非正式分析师日，不会给出全新财务模型，但可能提供WFE的25-30%以上多年复合增速指引；最重要的是AMAT可能铺平毛利率升至55%左右（类似LRCX）的路径，主因提价。技术方面将强调PDC（工艺诊断控制设备）、ALD（近期MasterClass发布多款相关平台含Moly ALD）及先进封装（面板级封装）的份额提升机会。 四、东芝HDD产能扩张对STX/WDC的定价冲击分析 据媒体报道，东芝计划到FY27将其数据中心HDD产能较FY25水平翻倍，同时投资约3.8亿美元扩建菲律宾工厂，生产下一代容量提升约40%的硬盘，目标中期EB（Exabyte）市占率达30%。瑞银指出东芝过往份额目标多未兑现，技术路线图亦落后于WDC尤其是STX，在高端大容量市场难以竞争；但超大规模云厂商表示将尽可能将订单倾斜至东芝以支持其努力。这至少标志着\"无新增产能、价格将持续上涨\"叙事的重大转变。瑞银测算：若C2028年每TB价格持平（而非STX预期+9%），STX EPS将从约114美元降至约101美元；WDC EPS从约57美元降至约51美元。 五、CoreWeave活动反馈及对半导体覆盖的启示 本周CoreWeave \"Fully Connected\"活动中两点引人注目：①英伟达Vera Rubin NVL72已为Cognition运行生产级智能体工作负载，SWE-2基准测试中推理总token吞吐量较GB200 NVL72高4.8倍，强化学习输出token吞吐量高3.8倍；系统具备1,400TB/s HBM4带宽和216TB/s NVLink带宽（后者使机架级内存带宽提升2.75倍）；BlueField-5较上一代有改善，但VR生态系统仍处早期。Cognition强调生产部署的便捷性远超预期的\"无缝\"，以及VR计算的可替代性（预期机架将跨多种工作负载使用而非仅推理专用）。②主题演讲及分组讨论中多次提及\"世界模型\"，这与AMD最新收购形成呼应——世界模型受关注本质上是LLM在多模态输入（图像/视频）能力增强的结果，叠加更好的推理能力使模型能运行于非确定性环境。合成数据是世界模型的关键构件，这为正在建设的所有推理容量创造了又一应用场景，进一步印证推理需求将远不止于向传统LLM应用提供token，而是更加多元化。 六、AMD收购World Labs：押注空间智能与世界模型训练 AMD以约82亿美元全股票交易收购李飞飞博士的空间智能/世界模型公司World Labs（预计2026年末前完成），李飞飞将出任执行副总裁兼首席科学家。瑞银认为更大启示在于AMD支付82亿美元所谋求的敞口——训练能理解并模拟物理世界的模型，随着机器人/物理AI规模化，这将成为AI算力需求的又一庞大来源。专家调研显示过去六个月世界模型生成已从单纯图形生成转向\"图形-代码-图形\"范式，中间代码可在渲染前校验，这对机器人意义重大——模型可并行生成多轨迹/场景并通过代码验证，据专家估算可将特定训练数据集创建时间缩短约10倍。换言之，世界模型本身成为制造大量合成、具物理基础训练数据的途径，但训练仍在数据中心完成，高度量化推理最终可移至机器人/边缘端。当前英伟达凭借Cosmos世界基础模型、Isaac Sim及更广泛的机器人/仿真栈拥有更成熟生态，World Labs的Marble为AMD在空间智能和环境生成领域提供了可信起点。AMD明确表示收购旨在围绕新兴模型和应用开发AI硬件、软件及系统，强化开放AI生态。瑞银视World Labs为重要第一步而非完整答案——若世界模型训练对物理AI的重要性如预期，AMD需构建覆盖模型、仿真、物理及最终部署的竞争生态，鉴于World Labs仅覆盖部分技术栈，不排除AMD继续收购以补全其余环节。 七、估值方法与风险提示 本报告采用市盈率（P/E）、企业价值/自由现金流（EV/FCF）等多种估值技术。风险包括宏观经济下行、新技术发明导致的技术颠覆、商业模式创新引发行业结构性变化从而改变未来收入轨迹等。 八、总结 本期SemiBytes聚焦五大主线：①供电外壳缺口是半导体需求持续性的关键变量，表后方案与中国返销构成潜在对冲；②AVGO TPU路线图向v10（2nm+3.5D+448G SerDes）演进，封装能力跃升支撑长期份额；③SEMICON West及AMAT活动将释放WFE乐观指引与毛利率扩张信号；④东芝HDD扩产打破供给瓶颈叙事，STX/WDC定价与盈利敏感性需重估；⑤CoreWeave实测数据与AMD收购World Labs共同指向世界模型/物理AI这一新兴算力需求极，推理多元化趋势进一步巩固半导体中长期增长逻辑。投资者应围绕AI基础设施瓶颈环节（供电、先进封装、WFE）及新工作负载（世界模型、机器人）布局。#文字观点", "publish_time": "2026-10-06 21:35", "tags": ["文字观点"]}, "post:2026-10-06T19-16:10099ca546ed": {"id": "post:2026-10-06T19-16:10099ca546ed", "kind": "post", "title": "2026-10-06 19:16", "source_label": "帖子正文", "excerpt": "[热度第11] [中性] [均+0.48%] 9月龙虎榜格局：头部营业部成交额破千亿，资金集中流向算力与医药 026年8月，中国智能手机月活跃用户数（MAS）同比增长0.9%至12.8亿，近期保持稳定。全行业月度总使用时长（MTS）同比增长8.1%，增速较7月的8.8%有所放缓。 字节跳动：时长份额突破40%，抖音首超微信登顶 在中国月度使用时长排名前50的应用中，字节跳动（未上市）旗下产品组合的总时长份额同比大幅攀升7.6个百分点至41.8%，环比亦提升0.9个百分点，主要由抖音与红果两大超级应用驱动。抖音应用使用时长在8月同比飙升25%，时长份额达19.3%（占中国移动互联网总时长），较去年同期的16.7%显著扩张；2026年7月，抖音首次超越微信，成为中国第一大使用时长应用。红果免费短剧应用表现更为亮眼，使用时长同比激增182%，时长份额由去年同期的2%跃升至6%。字节的时长增长对几乎所有其他内容平台形成挤压，尤以长视频平台为甚——爱奇艺（IQ US，中性）与腾讯视频（隶属腾讯，700 HK，买入）8月使用时长分别同比暴跌40%和35%，跌幅较前期进一步扩大。快手（1024 HK，中性）作为抖音的直接竞品，使用时长亦同比下滑16%。 阵营对比：字节与腾讯差距持续拉大 前50大应用合计占据中国移动互联网总时长的约93%。字节跳动时长份额由2025年8月的34.2%升至2026年8月的41.8%，而腾讯阵营由30.9%降至28.6%。两者差距从3.3个百分点急剧扩大至13.2个百分点。环比维度，字节份额提升0.9个百分点，腾讯则下降0.5个百分点。 MAU与时长份额头部格局 月活用户（MAU）维度，微信以90.6%的渗透率稳居首位，抖音80.4%位列第二，淘宝76.0%第三。使用时长份额维度，抖音19.3%居首，微信18.3%次之，抖音极速版6.3%第三，红果免费短剧5.9%第四。值得注意的是，豆包（字节AI对话应用）MAU渗透率达32.4%，同比暴增20.0个百分点，反映AI工具用户渗透加速。 长短视频分化：长视频持续失血，短剧与短视频格局稳固 长视频应用8月延续疲弱。优酷（隶属阿里巴巴，BABA US，买入）凭借《老九门》及《早春》等头部内容表现相对抗跌，使用时长同比仅降9%，较7月47%的跌幅显著收窄。爱奇艺与腾讯视频分别下滑35%和40%，芒果TV（300413 CH，未评级）降27%。相比之下，红果免费短剧在DAU同比激增118%及单日使用时长（DTSD）增长29%的拉动下，总时长维持182%的惊人增速。短视频赛道，抖音MTS同比增25%（DAU+18%，DTSD+6%），快手则因DTSD同比下滑14%导致总时长缩水16%。哔哩哔哩（BILI US，中性）总时长微增4%，由DAU+4%驱动。 在线阅读：免费模式主导，番茄小说遥遥领先 番茄免费小说（字节旗下，未上市）8月MTS同比增长8%，DAU达1.44亿，约为竞品七猫免费小说（隶属百度，BIDU US，买入）DAU的10倍；七猫总时长同比骤降46%。阅文集团（772 HK，中性）旗下付费应用起点读书与QQ阅读用户参与度亦显疲软，DAU分别下滑9%和2%。 音乐流媒体：字节新秀高歌猛进，腾讯音乐遭分流 除字节旗下的汽水音乐（DAU同比+61%）与番茄音乐（+33%）外，多数音乐应用DAU延续同比下滑。网易云音乐（9899 HK，未评级）DAU同比微降1%，表现相对稳健；而腾讯音乐娱乐（TME US，中性）旗下QQ音乐、酷狗音乐、酷我音乐DAU分别同比下滑5%、15%、15%。腾讯卡拉OK应用总时长同比降21%，受DAU骤降29%拖累。 社交：小红书稳健，微博承压 小红书（未上市）8月MTS同比微增3%，DTSD达96分钟，逼近微信的97分钟。微博（WB US，中性）MTS同比下滑9%，受DTSD降7%及DAU降3%双重拖累。腾讯生态内，QQ总时长同比降1%，微信总时长则逆势增长3%。 搜索：百度应用持续失血 百度应用作为国内主导搜索引擎，8月MTS同比重挫25%，主要受DAU同比下滑23%拖累。 AI工具：豆包一骑绝尘，通义千问爆发式渗透 AI应用赛道，豆包（字节）8月DAU以1.74亿稳居榜首，同比暴增3.5倍，环比增3%。夸克浏览器DAU 3,300万（+1%同比），DeepSeek 3,100万（+14%同比），通义千问（阿里）2,800万（+81倍同比）。单用户日均使用时长维度，夸克以33分钟居首（同比-7%），DeepSeek 18分钟（+71%同比），Kimi 14分钟（+80%同比）。 本地生活：抖音同城（DSS）用户高增但参与度待提升 抖音于2026年2月推出的独立本地生活服务应用\"抖音同城\"（DSS）延续强劲用户增长，8月MAU环比大增18%至9,900万，已逼近大众点评（DP）2.06亿MAU的半数。但用户参与度差距显著——DSS单日使用时长（DTSD）环比降3%至4.7分钟，而大众点评环比升1%至8.2分钟。这表明DSS虽受益于抖音主站的流量灌溉实现快速起量，但在用户粘性深化方面仍需持续投入。美团（3690 HK，买入）主站MAU达1.83亿，仍遥遥领先。 在线旅游：暑期旺季难掩需求疲弱 尽管暑期出行旺季带动用户参与度环比季节性改善，但旅游应用同比趋势依然低迷。携程（TCOM US，中性）国内双平台表现疲软——携程DAU同比降10%（7月降9%），去哪儿DAU降6%，与管理层对宏观环境、航油价格及监管压力的谨慎指引相印证。飞猪（阿里旗下，未上市）MTS基本持平，DAU+4%抵消了DTSD-3%。 电商：拼多多DAU增长领先，淘宝核心用户流失 用户规模维度，淘宝与拼多多（PDD US，中性）分居电商前两位。拼多多8月DAU同比+7%，由轻度用户（日使用时长\u003c1分钟）暴增19%及重度用户+5%共同驱动；京东（JD US，买入）DAU+5%（轻度用户+24%）。淘宝DAU同比下滑8%，受重度用户骤降14%拖累，部分被轻度用户+12%对冲。单用户日均时长维度，拼多多+6%，淘宝-5%，京东-3%。 办公应用：飞书重组，AI办公代理崭露头角 字节跳动于7月末实施大范围重组，将飞书产品团队与豆包合并，销售团队与火山引擎整合，并于8月下旬正式推出AI办公代理\"豆包工作\"。8月飞书DAU同比飙升53%，企业微信（腾讯）+9%，钉钉（阿里）-3%。钉钉仍以约7,400万DAU居首，分别为企业微信的1.1倍和飞书的7.3倍。单用户日均时长：飞书14.4分钟（-2%同比），企业微信12.3分钟（+2%），钉钉10.0分钟（-7%）。 在线招聘：BOSS直聘加速领跑 BOSS直聘（隶属看准网，BZ US，未评级）8月MTS同比加速增长至17%（7月为12%），DAU同比+21%部分抵消DTSD-4%。猎聘（6100 HK，未评级）MTS+14%（DAU+11%）。51job（未上市）DAU+8%但MTS-7%（DTSD-14%）。智联招聘MTS-9%（DAU-4%），为同业最弱。 货运平台：满帮双端稳健增长 发货端，运满满发货端（满帮，YMM US，买入）MTS+11%（DAU+5%），货拉拉+16%（DAU+8%）；货车帮发货端MTS-1%。司机端，运满满司机端MTS+12%（DTSD+7%），货拉拉司机端+27%（DAU+14%，DTSD+11%），货车帮司机端-6%。 投资启示 8月数据进一步印证了字节跳动在中国移动互联网时长争夺战中的绝对主导地位——其通过抖音+极速版+红果+豆包的多产品矩阵，持续蚕食腾讯、百度及传统长视频平台的用户注意力。短剧与AI工具是两大增量引擎，而本地生活与办公场景的AI化布局则代表下一阶段的变现探索。对投资者而言，超配字节生态受益标的（如腾讯因微信基本盘仍具防御性），低配受时长挤压明显的长视频及传统搜索标的，是当前较优的板块配置思路。#文字观点", "publish_time": "2026-10-06 10:20", "tags": ["文字观点"]}, "post:2026-10-06T19-18:c6983cc53c3a": {"id": "post:2026-10-06T19-18:c6983cc53c3a", "kind": "post", "title": "2026-10-06 19:18", "source_label": "帖子正文", "excerpt": "大摩——全球主题与美国半导体：电力短缺对半导体意味着什么？摩根士丹利聚焦美国数据中心电力短缺对半导体产业链的传导效应。", "content": "大摩——全球主题与美国半导体：电力短缺对半导体意味着什么？ 摩根士丹利聚焦美国数据中心电力短缺对半导体产业链的传导效应。核心判断为：2026至2028年美国数据中心开发商将面临逾30%的电力缺口（净缺口32吉瓦，占需求总量34%），英伟达（NVDA）与博通（AVGO）凭借卓越的芯片部署可见性及更高的每瓦令牌产出效率，2027年业绩指引不受电力瓶颈威胁；但ASIC、内存、光学元件及电源管理等下游组件在熊市情境下可能受到显著冲击。资本开支正加速向 hyperscaler 与 neocloud 集中，预计2026至2028年其占全球数据中心新增容量的60%至95%，信用资质较弱或国际玩家面临被\"挤出\"风险。报告同步评估了国际扩张与电表后端（BTM）发电等上行驱动因素对缺口的收窄潜力。 电力短缺量化与核心假设 基于《Powering AI: Racking Up the Power Shortfall》测算，2026至2028年美国数据中心累计电力需求97吉瓦，扣除在建数据中心（21吉瓦）与可用电网容量（19吉瓦）后，电力短缺达57吉瓦。净短缺32吉瓦（占需求34%）为计入\"time to power\"解决方案后的概率加权值，包括BTM涡轮机/发动机（基准情景19吉瓦，区间11至49吉瓦）、Bloom Energy燃料电池（基准6吉瓦）及核电站选址部署等。短缺主因在于机架级GPU架构（如NVL72/144）耗电量急剧攀升，远超传统8U系统。 对半导体产业链的分层影响 核心结论：NVDA/AVGO确定性最高，尾部组件风险最大。 英伟达与博通合计占据XPU市场约90%份额，已给出未来12个月合计约8,000亿美元的AI收入前瞻。管理层对芯片部署具备清晰视野——黄仁勋明确表示正追踪全球每一吉瓦的\"土地-电力-外壳\"（LPS）资源，与发电商及LPS企业深度协同；博通Tan亦强调电力站点确定性远低于芯片供应。摩根士丹利认为，电力瓶颈在2027年不会冲击两大龙头的出货节奏，但ASIC因每瓦令牌产出较低，在缺电环境下相对GPU将丢失份额（博通FY27 AI收入指引从3月超1,000亿美元上调至9月1,150亿美元，上调幅度不及预期即为佐证）。若芯片无法部署，客户可能推迟交付或取消订单，冲击将沿供应链\"牛鞭效应\"传导至尾部——内存、光学元件、电源管理及模拟器件等易被过量订购的小额组件面临最高回调风险。 电力获取能力分化：信用与规模为王 数据中心通电权限正向大型、高信用等级玩家集中。 hyperscaler 与头部 neocloud（AMZN、GOOGL、MSFT、META、SPCX、CRWV、NBIS）预计吸纳2026至2028年全球新增容量的60%至95%（2026年高达94%）。亚马逊电力获取地位稳固；谷歌2027至2028年增量容量最大，面临的通电挑战亦最突出。信用不足的小型neocloud、非美国玩家及低能效ASIC芯片商被边缘化风险最高。英伟达因客户结构分散（半数业务在传统 hyperscaler 之外，覆盖55家非美国云合作伙伴），且GPU每瓦令牌产出领先，成为电力约束环境下最具防御性的标的。 上行驱动因素评估 国际扩张：不足以完全吸收美国缺口。韩国、新加坡、印度、澳大利亚、中国及欧洲存在局部增长亮点（如澳大利亚被定位为\"能源过剩\"区域，英伟达已部署2吉瓦），但欧洲规划许可缓慢、中东地缘政治不稳（如AWS数据中心遭伊朗打击）、亚洲需依赖煤电等制约因素，使海外溢出无法根本解决美国32吉瓦净缺口。摩根士丹利将美国占全球算力份额预期从60%下调至55%，但缺口绝对值不变。 BTM发电：最具弹性的收窄路径。基准情景下2026至2028年新增19吉瓦 BTM 涡轮机，乐观情景可达30吉瓦（将净缺口压缩至21吉瓦）。Bloom Energy燃料电池（当前预测6吉瓦）存在上行空间。但劳动力瓶颈（CSIS预计2030年前美国需新增14万+熟练技术工人）与政治阻力（公众对数据中心的反对、暂停令）构成反向制约，限制BTM扩张速度。 投资策略与标的偏好 超配英伟达（NVDA）：目标价300美元（基于2028日历年20倍市盈率），逻辑为每瓦能效优势、地理与客户多元化、全栈生态壁垒。 超配博通（AVGO）：目标价505美元（基于2027日历年28倍市盈率），逻辑为ASIC定制芯片长期需求及VMware协同。 规避方向：ASIC份额流失风险、内存与光学组件短期超订回调风险、电力获取能力弱的中小云厂商供应链暴露。 核心风险 上行风险：BTM发电部署快于预期（涡轮/燃料电池）、国际扩张加速吸收溢出需求、美国电网监管松绑。 下行风险：电力短缺恶化导致2027年后全芯片生态系统部署受阻；ASIC市场份额加速流失；内存/光学等组件订单大幅取消；劳动力与政治因素使BTM增量不及预期。 策略结论 电力短缺是AI基础设施扩张的\"新瓶颈\"，但英伟达与博通凭借部署可见性与能效优势已建立护城河。投资者应聚焦信用资质高、通电能力确定的头部 hyperscaler 供应链，规避每瓦效率低且依赖单一环节的尾部组件。短期催化剂为三季度财报季中管理层对LPS资源的进一步披露，中长期需跟踪BTM发电装机进度与国际电力市场联动。#文字观点", "publish_time": "2026-10-06 19:18", "tags": ["文字观点"]}, "attachment:files/大摩闭门会：股市楼市，割裂多久- 261005_导读.pdf": {"id": "attachment:files/大摩闭门会：股市楼市，割裂多久- 261005_导读.pdf", "kind": "attachment", "title": "大摩闭门会：股市楼市，割裂多久- 261005_导读", "source_label": "大摩闭门会：股市楼市，割裂多久", "excerpt": "MS周一大摩宏观 1005_ 导读 2026 年10月05日 23:17 关键词 楼市 股市 割裂 托底政策 美联储加息 香港市场 房地产价格 按揭贴息 消费 K型分化 高端制造业 出口 贸 易摩擦 基建投资 流动性 港股 A股 美股 标普 500 加息 全文摘要 全球经济形势对香港楼市和股市产生了复杂影响。美联储加息与托底政策导致香港股市在长假期间表现 疲", "content": "MS周一大摩宏观 1005_ 导读 2026 年10月05日 23:17 关键词 楼市 股市 割裂 托底政策 美联储加息 香港市场 房地产价格 按揭贴息 消费 K型分化 高端制造业 出口 贸 易摩擦 基建投资 流动性 港股 A股 美股 标普 500 加息 全文摘要 全球经济形势对香港楼市和股市产生了复杂影响。美联储加息与托底政策导致香港股市在长假期间表现 疲软，但楼市在过去一年有所回暖。同时 ，中国房地产市场在托底政策支持下保持稳定 ，新监管政策对 香港楼市产生影响。中国出口制造业展现出强劲竞争力 ，特别是在高端制造领域 ，对日本、德国等传统 工业国构成挑战。尽管美联储加息可能对香港经济造成影响 ，但预计香港经济基本面和银行流动性较 强，冲击有限。中国在全球市场中的份额 ，尤其是资本密集型产品领域 ，有望进一步增加。政策调整对 于促进消费和内需 ，以及在全球经济下行风险中寻找机遇和挑战至关重要。整体上 ，讨论集中在如何应 对全球经济动态带来的影响 ，并在复杂环境中寻找机遇。 章节速览 ● 00:00 楼市股市割裂与托底政策分析 对话围绕楼市与股市的割裂现象展开 ，讨论了托底政策的效果及持续性 ，特别是针对香港市场。分析了 美联储加息、国内消费调整及跨境资金监管政策对香港楼市的影响。同时 ，探讨了出口制造业的高歌猛 进及其全球竞争力 ，以及未来 3到5年的潜在成果。指出近期出台的按揭贴息等政策力度温和 ，但仍具积 极意义 ，体现了渐进式思维转型的努力。 ● 04:21 中国托底政策解析 ：按揭贴息与基建支持的有限效应 对话详细分析了国庆前中国出台的托底政策 ，包括首次全国性的居民购房按揭贴息及对六张网建设的定 向金融支持。政策旨在减缓居民去杠杆步伐 ，鼓励政府部门和国企加杠杆以稳定需求 ，但因限制条件 多、覆盖范围有限 ，对房地产市场和经济的撬动效果预期有限。同时 ，政策调整与两年前的 924政策相 比，更多是现有政策的优化而非大幅转向。四季度 GDP增长有望达到 4.5%左右，但若通缩和去杠杆螺旋 恶化，可能进一步调整政策 ，包括地方化债政策的持续加码。 ● 12:07 中美市场走势分析与港股影响评估 近期中美市场呈现冰火两重天态势 ，中国股市在政策托底后反而下跌 ，港股跌破年内新低 ；而美国市场 因非农数据不佳 ，加息预期减弱 ，三大股指齐涨。市场分析指出 ，全球加息预期、流动性紧缩及缺乏催 化剂等因素影响港股走势。此外 ，对比2022 年的加息周期 ，当前环境对港股的影响需谨慎评估。十一黄 金周后 ，A股与港股均进入调整期 ，市场情绪受地缘政治及经济政策影响较大。 ● 17:31 美股市场优势与亚洲市场反弹分析 对话探讨了美股市场在通胀和资金成本稳定预期下的强劲表现 ，指出美股因盈利能力和成长性成为全球 投资首选。同时 ，分析了亚洲市场中日本、台湾和韩国的反弹情况 ，以及港股在短期市场环境下的可能 压制，强调了宏观担忧未充分解决对市场资金吸引力的影响。 ● 21:52 市场平稳过渡与新生产力板块的投资建议 对话中讨论了市场平稳过渡的预期 ，特别是房地产政策调整对经济的影响 ，以及对新生产力相关板块和 红利资产的长期投资建议 ，强调基本面和市场环境的支持。 ● 25:22 香港股市与大陆股市在加息环境下的表现差异分析 讨论了香港股市在加息环境下的影响 ，指出香港股市的表现需区分于大陆股市。港股中受全球因素驱动 的股票如 HKT、MTR等表现较为坚挺 ，而恒生指数和明晟中国指数则因受大陆宏观环境影响较大 ，面临 流动性紧缩的风险 ，建议操作时需谨慎。 ● 28:53 美联储加息周期下香港房地产市场的抗压分析 对话讨论了在美联储加息周期与中国经济放缓背景下 ，香港房地产市场的表现。尽管面临类似 2022 年加 息周期的压力 ，但此次加息幅度较小 ，香港银行流动性充足 ，经济基本面和产业链竞争力增强 ，预计不 会重演 2022 年的市场衰退。香港的按揭利率预计温和上升 ，对房地产市场影响有限。 ● 35:34 香港经济复苏与未来展望 对话分析了香港经济的基本面改善 ，包括人口回流、人才计划吸引高收入者、转口需求的结构性改善以 及中国科技竞争力提升对香港金融市场支持的作用 ，认为这些因素将缓冲利率上行的冲击 ，并减少全面 撤离香港市场的可能性。 ● 38:30 香港经济与楼市对加息周期的短期冲击及未来预期 对话讨论了美联储加息周期对香港经济和楼市的短期影响 ，预计市场对加息幅度和节奏的不确定性将导 致居民购房和企业投资步伐放缓。若明年三月美联储释放明确加息结束信号 ，暂缓的需求将重新释放。 预计GDP增速明年一季度因基数效应回落 ，下半年将反弹至 4.5%左右，高于趋势增长水平。同时指 出，若美联储持续大幅紧缩 ，油价高位 ，中国加大顺周期紧缩政策 ，将给香港带来下行风险。 ● 40:02 美联储加息对香港楼市影响分析 对话深入探讨了美联储加息对香港房地产市场的潜在影响 ，认为此次加息周期不会打断香港楼市复 苏，预计住宅市场房价将持续上涨 ，尽管短期内成交可能减少。分析指出 ，香港按揭利率不会大幅上 升，人才流入和新增供应减少等因素将支撑房价。同时 ，报告对比了纽约与香港在加息周期下的房地产 市场异同 ，强调了香港市场独特的利率环境和供需状况。 ● 44:14 香港写字楼市场与住宅房地产复苏分析 讨论了香港写字楼市场因租赁需求增加而展现出的强劲基本面 ，尤其是中环区域的低空置率和租金上涨 趋势。同时 ，对冲基金的免税方案可能吸引更多亚洲基金落户香港 ，推动写字楼租赁需求。然而 ，对于 住宅房地产市场 ，尽管预计明年有 5%的上行空间 ，但开发企业股价可能受制于房价增速放缓和融资成本 上升的影响。整体来看 ，香港房地产市场的复苏仍在继续 ，但选股策略需更加谨慎 ，以应对加息和监管 政策的不确定性。 ● 48:56 中国在全球供应链中的持续竞争力分析 对话深入探讨了中国在全球供应链中的依赖度变化 ，通过分析产品增加值数据 ，指出尽管直接进口比重 下降，但中国增加值在美国进口中的比例保持稳定 ，且间接渠道占比提升。报告还揭示了中国在新兴高 增长行业及传统行业增加值中的持续提升 ，强调了全球与中国脱钩的困难性 ，预测中国全球出口市场份 额将稳步增长。 ● 56:36 中国在全球供应链中的角色与政策建议 对话指出 ，中国在全球供应链中的份额通过间接方式加深 ，中美并未完全脱钩 ，而是进行了产业链布局 调整。中国出口以资本密集型产品为主 ，对内需和就业的传导较弱 ，需政策在消费方面做出更多努 力，如社保转移和降低储蓄率 ，以应对通缩和去杠杆的下行螺旋。未来将分享更多关于亚洲经济的见 解。", "status": "extracted"}, "post:2026-10-06T21-37:8acd4d27514c": {"id": "post:2026-10-06T21-37:8acd4d27514c", "kind": "post", "title": "2026-10-06 21:37", "source_label": "帖子正文", "excerpt": "光模块-陶瓷基板重大事件点评事件：摩根士丹利预测，FCC 可能从 3.2T 代起，对中国产光模块设“美国成分 65%”的进口门槛。TEC使用量或相较此前预期量更多。", "content": "光模块-陶瓷基板重大事件点评事件：摩根士丹利预测，FCC 可能从 3.2T 代起，对中国产光模块设“美国成分 65%”的进口门槛。TEC使用量或相较此前预期量更多。 EML 方案里激光器芯片占 25% 到 30%，几乎只由美日供货；硅光方案里 EML 被自研 PIC 替代，激光器退化成占 8% 到 10% 的外置 CW 光源。单个CW光源或对eml造成“一拖二”或“一拖四”的替代量。硅光在高端器件比例的下降将一定程度上提高高端TEC的使用数量。 当前行业内TEC龙头依然是以大和热磁为首的日资企业，在光模块TEC供应占比达到60-70%，且逐步向高端化进发，对于高端器件的需求量提升将增强其龙头地位。甚至对于硅光方案，公司提出了基板内埋式TEC以处理基板功率上升导致的热耦合问题。利好同为Ferrotec集团企业富乐德。 随着光模块的放量，大和热磁持续扩产其TEC数量，估计年底相较年初翻倍，而大和热磁与富乐德同为Ferrotec集团体系兄弟公司，当前富乐德DPC基板均供货大和热磁，具备下游稳定性，且在近期投产180万片每年产能，未来持续扩产弹性仍在，我们持续看好富乐德在光模块TEC领域的业绩提升。#文字观点", "publish_time": "2026-10-06 21:37", "tags": ["文字观点"]}, "post:2026-10-06T21-35:1d3ccce2c432": {"id": "post:2026-10-06T21-35:1d3ccce2c432", "kind": "post", "title": "2026-10-06 21:35", "source_label": "帖子正文", "excerpt": "【东北计算机】100 本面迎来周期性改善，但瑞银认为近期板块部分上涨来自库存回补，并非终端需求显著加速。 更广维度来看，工业复苏能否持续仍然存疑，宏观环境与汽车行业前景的不确定性，会继续约束估值倍数。 瑞银首选标的依旧为意法半导体（买入评级）。 其他调研观察 投资者对光通信产业链的兴趣正在提升，涉及诺基亚、意法半导体、Soitec、爱思强。 与之相反，受存储行业规格下调趋势影响，BESI 的持仓偏好出现明显恶化。 投资者开始关注 2027‑2028 年硅片潜在供给紧张问题，对 Siltronic 的关注度有所抬升。 爱立信仍是认可度最低的标的之一，原因在于 AI 业务敞口有限，同时通胀带来的利润率压力持续受到担忧。#文字观点", "publish_time": "2026-10-06 10:21", "tags": ["文字观点"]}, "post:2026-10-06T19-15:fada9a11562a": {"id": "post:2026-10-06T19-15:fada9a11562a", "kind": "post", "title": "2026-10-06 19:15", "source_label": "帖子正文", "excerpt": "TrendForce： Rubin 平台上仍存在系统级测试和验证问题，预计产量将从 2026 年第四季度或 2027 年第一季度开始逐步增加。DRAM 供应商针对 2026 年第四季度合同价格的早期讨论显示价格将有显著上涨，这表明需求势头正在增强，尤其是来自美国 CSP 的需求。", "content": "TrendForce： Rubin 平台上仍存在系统级测试和验证问题，预计产量将从 2026 年第四季度或 2027 年第一季度开始逐步增加。 DRAM 供应商针对 2026 年第四季度合同价格的早期讨论显示价格将有显著上涨，这表明需求势头正在增强，尤其是来自美国 CSP 的需求。 NAND（企业级 SSD） DRAM 短缺正在限制部分 NAND 供应商支持企业级 SSD 解决方案的能力。因此，企业级 SSD 预计将持续供不应求直至 2026 年。 HDD 尽管东芝宣布了新的生产线扩建计划，但该生产线至少需要 12 至 24 个月才能投产。因此，交货周期最早也要到 2027 年末才能改善。 ABF 基板 ABF 基板产能的投产速度不足以跟上需求的急剧上升。供需缺口短期内不太可能收窄，因此市场将保持紧张状态。ABF 基板价格预计从 2026 年第三季度起环比上涨 10–15%，并持续至 2027 年第四季度。 MLCC 低端消费级 MLCC 的需求正在放缓，而用于 AI 应用的高端 0805 标准部件则供应短缺，这进一步加剧了市场需求的两极分化。#文字观点", "publish_time": "2026-10-06 19:15", "tags": ["文字观点"]}, "post:2026-10-06T21-40:ffb53e8e1069": {"id": "post:2026-10-06T21-40:ffb53e8e1069", "kind": "post", "title": "2026-10-06 21:40", "source_label": "帖子正文", "excerpt": "应用材料公司与英特尔在 EPIC 中心合作开展 AI 芯片研发 应用材料公司（纳斯达克股票代码：AMAT）与英特尔公司（纳斯达克股票代码：INTC）宣布合作开发下一代芯片制造技术，双方计划在应用材料公司位于硅谷的 EPIC 中心和英特尔位于俄勒冈州希尔斯伯勒的研究园区开展联合工作。两家公司表示，他们", "content": "应用材料公司与英特尔在 EPIC 中心合作开展 AI 芯片研发 应用材料公司（纳斯达克股票代码：AMAT）与英特尔公司（纳斯达克股票代码：INTC）宣布合作开发下一代芯片制造技术，双方计划在应用材料公司位于硅谷的 EPIC 中心和英特尔位于俄勒冈州希尔斯伯勒的研究园区开展联合工作。 两家公司表示，他们将专注于针对人工智能计算应用的晶体管、互连和先进封装技术的进步。此次合作涵盖了半导体的前端和后端开发，包括互连缩放以及英特尔基于 Foveros 的 3D 堆叠封装技术。 应用材料公司的 EPIC（设备与工艺创新及商业化）中心位于硅谷，预计将于 2026 年投入运营。该设施旨在缩短技术从早期研究到大规模制造所需的时间。 “应用材料公司与英特尔拥有数十年的深度合作历史，致力于突破材料工程的界限，以推动半导体路线图的发展，” 应用材料公司总裁兼首席执行官 Gary Dickerson 表示。 英特尔首席执行官 Lip-Bu Tan 表示，两家公司计划扩大在 EPIC 中心的合作，以 “加速 与补能网络的正循环\n\n**文字观点原文线索：**\n1. `2026-10-06 19:16` 结论：出行与体验型消费是本轮假期的高弹性方向，而充电量六成的高增进一步验证了新能源车保有量与补能网络的正循环\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>半导体板块经历显著去风险后，三季度业绩期风险回报改善；多数子领域预计业绩超预期，半导体设备、计算/存储、模拟芯片业绩与指引存在上修空间，WFE支出前置叠加2028年长期能见度。\u003c/li>\n\u003cli>AI算力成本与瓶颈讨论深化：1GW AI ASIC数据中心容量成本测算扩展至AMD与ASIC架构；OpenAI Jalapeno为490万美元/Pod，架构与英伟达参考设计截然不同；内存短缺将在整个AI周期持续构成约束，但AI产业不会坐等DRAM晶圆厂建成。\u003c/li>\n\u003cli>中国本土先进AI半导体供应链为最优先标的：内存长鑫存储、晶圆代工中芯国际、设备北方华创/中微公司/盛美上海；PCB/覆铜板深南电路在AI与光模块PCB、存储上行周期BT基板、国内算力ABF材料上多引擎发力。\u003c/li>\n\u003cli>美国数据中心电力短缺成为半导体产业链核心约束：2026至2028年美国数据中心总电力需求97GW，扣除在建项目和电网接入后缺口57GW；算力供电缺口持续扩大，存在三条弥合路径，芯片挤压传导至二线云与零部件。\u003c/li>\n\u003cli>光模块与商业航天出现事件催化：预测FCC可能从3.2T代起对中国产光模块设“美国成分65%”进口门槛，TEC使用量或相较此前预期更多；SpaceX受FAA新规提案催化，10月2日、10月6日单日分别大涨7.4%/7.6%。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>1. 半导体/先进封装\u003c/h3>\n\u003cul>\n\u003cli>主线：半导体/先进封装。\u003c/li>\n\u003cli>今天强化的逻辑：板块回调后风险回报改善，多数子领域预计业绩超预期；半导体设备、计算/存储、模拟芯片业绩与指引存在上修空间；WFE支出前置叠加2028年长期能见度；中国本土先进AI半导体供应链优先，包括长鑫存储、中芯国际、北方华创、中微公司、盛美上海；深南电路多增长引擎发力。\u003c/li>\n\u003cli>今天出现的催化/验证：费城半导体指数SOX过去两个月跌11%，同期标普500涨4%；三季度业绩期预计成为多数子板块盈利上修催化剂；TrendForce称Rubin；DRAM供应商针对2026Q4合同价格早期讨论显示价格显著上涨，尤其来自美国CSP需求。\u003c/li>\n\u003c/ul>\n\u003ch3>2. AI算力/大模型\u003c/h3>\n\u003cul>\n\u003cli>主线：AI算力/大模型。\u003c/li>\n\u003cli>今天强化的逻辑：AI数据中心成本测算从英伟达Blackwell与Vera Rubin扩展至AMD与ASIC架构；OpenAI Jalapeno为490万美元/Pod，架构与英伟达参考设计截然不同，意图扩展Scale-up域、将数据保留在HBM及DRAM本地；预计2026年强劲收官，增长前景延续至2027，驱动力来自AI GPU/ASIC、网络及服务器CPU需求全面扩散；内存短缺持续约束AI周期。\u003c/li>\n\u003cli>今天出现的催化/验证：美国数据中心电力短缺测算显示2026至2028年总需求97GW、缺口57GW；算力供电缺口持续扩大且存在三条弥合路径；美国消费者对AI整体情绪喜忧参半，基于约8,000名消费者调查；OpenAI正与阿联酋基金和贝莱德洽谈300亿美元融资；Reflection AI推出Beam新型开放式重量模型。\u003c/li>\n\u003c/ul>\n\u003ch3>3. 光通信/CPO\u003c/h3>\n\u003cul>\n\u003cli>主线：光通信/CPO。\u003c/li>\n\u003cli>今天强化的逻辑：硅光方案里EML被自研PIC替代，激光器退化成占8%到10%的外置CW光源；EML方案里激光器芯片占25%到30%，几乎只由美日供货；硅光子/CPO增长、汽车上行与毛利率可持续性构成核心辩论点；组件成本通胀对利润形成挤压，下调EPS预期3%。\u003c/li>\n\u003cli>今天出现的催化/验证：预测FCC可能从3.2T代起对中国产光模块设“美国成分65%”进口门槛，TEC使用量或更多；光通信行业及Tower半导体进行系统性交流；鸿海新AI服务器、CPO交换机及折叠手机将驱动4Q26；光模块散热更新。\u003c/li>\n\u003c/ul>\n\u003ch3>4. PCB/CCL/铜箔\u003c/h3>\n\u003cul>\n\u003cli>主线：PCB/CCL/铜箔。\u003c/li>\n\u003cli>今天强化的逻辑：深南电路在AI与光模块PCB、存储上行周期带动的BT基板、国内算力需求带动的ABF材料上多条增长引擎同时发力；电子布10月价格继续明显上涨，但行业担忧PCB环节向下传导价格力度不足，若传导不畅，电子布价格突破高位有难度，但目前供需格局良好，短期较难降价。\u003c/li>\n\u003cli>今天出现的催化/验证：内蒙古天皓宣布新建20万吨电子纱产能+1.6亿米电子布产能；建材周观点显示沪深300跌1.84%，申万建材跌3.87%，玻纤和其他科技相关品种跌幅较大，传统地产链龙头在政策催化和预期改善下涨幅可观。\u003c/li>\n\u003c/ul>\n\u003ch3>5. 液冷/电源\u003c/h3>\n\u003cul>\n\u003cli>主线：液冷/电源。\u003c/li>\n\u003cli>今天强化的逻辑：AI数据中心单机柜成本测算中散热与供电合计约40万美元，并修正散热与供电交付估算；合作旨在缩短针对AI工作负载的先进逻辑节点开发周期，支持更高互连密度、改进供电和高性能计算；美国数据中心电力短缺超三成，芯片挤压传导至二线云与零部件。\u003c/li>\n\u003cli>今天出现的催化/验证：2026至2028年美国数据中心总电力需求97GW，扣除在建项目和电网接入后缺口57GW；应用材料与英特尔在EPIC中心合作开展AI芯片研发；中科粉研金刚石散热片扩产项目完成用地规划公示，计划年产4万片金刚石散热片（4英寸单晶），可用于GPU散热。\u003c/li>\n\u003c/ul>\n\u003ch3>6. 商业航天/卫星\u003c/h3>\n\u003cul>\n\u003cli>主线：商业航天/卫星。\u003c/li>\n\u003cli>今天强化的逻辑：FAA发布商业航天新规提案，拟进一步简化发射及再入许可流程；SpaceX股价连续突破155美元/170美元关口，短期日内多头极为强势，市值仍在2.2-2.3万亿美元合理水位；估值要素可拆分为Starship、AI、马斯克/特斯拉；10月后大涨系多维事件催化共振。\u003c/li>\n\u003cli>今天出现的催化/验证：10月5日FAA发布商业航天新规提案，同日SPCX大涨7.63%；10月2日、10月6日SpaceX单日分别大涨7.4%/7.6%，较26年8月低点反弹近60%；马斯克宣布与台积电洽谈Terafab合作；11月关注Q3财报解禁压力测试。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>半导体板块经历显著去风险：费城半导体指数SOX跌11%，同期标普500涨4%，当前估值回调为三季度业绩期创造更具建设性的交易环境。\u003c/li>\n\u003cli>半导体生态系统中多数子板块（半导体设备、计算/存储、模拟芯片）的业绩与指引存在上修空间；WFE支出前置叠加2028年长期能见度。\u003c/li>\n\u003cli>DRAM供应商针对2026Q4合同价格的早期讨论显示价格将显著上涨，需求势头增强，尤其是来自美国CSP的需求。\u003c/li>\n\u003cli>美国数据中心电力短缺：2026至2028年美国数据中心总电力需求97GW，扣除在建项目和电网接入后缺口57GW；电力短缺向半导体产业链传导，芯片挤压传导至二线云与零部件。\u003c/li>\n\u003cli>预测FCC可能从3.2T代起对中国产光模块设“美国成分65%”进口门槛，TEC使用量或相较此前预期更多。\u003c/li>\n\u003cli>SpaceX：10月2日、10月6日单日分别大涨7.4%/7.6%，突破155美元/170美元关口，较26年8月低点反弹近60%；FAA发布商业航天新规提案，拟简化发射及再入许可流程。\u003c/li>\n\u003cli>30年期美债收益率触及5.65%，创2002年以来新高，长期国债收益率升至2002年以来新高。\u003c/li>\n\u003cli>9月共7家营业部龙虎榜成交额突破千亿元，资金在算力硬件与医药两条主线之间轮动，营业部席位进一步向头部集中。\u003c/li>\n\u003cli>2026年8月中国智能手机MAS同比增长0.9%至12.8亿；全行业MTS同比增长8.1%，较7月的8.8%放缓；字节跳动时长份额大幅跃升；携程DAU同比降10%，去哪儿DAU降6%，七猫总时长同比降46%。\u003c/li>\n\u003cli>白酒双节：中秋实际表现略弱，国庆长假边际变化不大；渠道反馈商务宴请、大额采购仍弱；行业并未恶化，改善仍是局部、结构性的。\u003c/li>\n\u003cli>中国医药：2026年上半年业绩表现分化，覆盖公司年内股价平均回调约19%，同期沪深300、恒生指数分别下跌约2%；国内业务承压，全球研发管线进展成为下一关注焦点。\u003c/li>\n\u003cli>AI4S核心标的上月均上涨40%以上，昨日TWST+8%、SDGR+8%、TEM+9%、DNA+20%。\u003c/li>\n\u003cli>中科粉研金刚石散热片扩产项目完成用地规划公示，计划年产4万片金刚石散热片（4英寸单晶），可用于GPU散热。\u003c/li>\n\u003cli>应用材料与英特尔宣布合作开发下一代芯片制造技术，在EPIC中心和俄勒冈州希尔斯伯勒研究园区开展联合工作，旨在缩短AI工作负载先进逻辑节点开发周期，支持更高互连密度、改进供电和高性能计算。\u003c/li>\n\u003cli>东芝计划向菲律宾工厂投资600亿日元，目标2027财年将面向AI数据中心的HDD产能扩大一倍，市场份额从略高于10%提升至30%；STX和WDC周五暴跌10–11%；HDD渠道调研认为东芝产能扩张计划被市场误读，实际仅对应约30%年度产能增长，与行业供给节奏一致，显著落后于需求增速，东芝面临激进时间表、技术落后同业及供应链协调三大挑战。\u003c/li>\n\u003cli>美韩“Project Power”框架协议：计划在美国部署6台AP1000机组与2台APR1400机组，总投资1,200亿美元，新增核电装机容量约9.4GW，较美国现有核电产能提升10%。\u003c/li>\n\u003cli>台积电业绩前瞻：增长动能延续至2027年，资本开支上修以支撑长期需求。\u003c/li>\n\u003cli>鸿海9月营收超预期，同比大增38%；新AI服务器、CPO交换机及折叠手机将驱动4Q26。\u003c/li>\n\u003cli>中国新能源汽车2026年第39周周度订单环比同比分别下降7%、58%，新能源汽车零售批发渗透率为68%、74%。\u003c/li>\n\u003cli>9月30日电池板块上涨1.09%，资金流入居前；宁德时代+1.5%，亿纬锂能+2.51%；储能需求外溢与海外产能落地驱动盈利结构从单一动力向动力加储能切换。\u003c/li>\n\u003cli>诺奖：弗朗西斯·哈尔岑获2026年诺贝尔物理学奖；光遗传学领域三位先驱获2026年诺贝尔生理学或医学奖，罗博特科/ficonTEC布局BioMedical生物医疗光子，参与欧洲医疗光子项目PhotonMed。\u003c/li>\n\u003cli>地缘与宏观：特朗普政府已与中国初步讨论核设施互访；美国封锁伊朗原油供应，中国炼油商涌向伊拉克原油市场；中东地区石油产量约为冲突前80%；也门称已收复摩卡，曼德海峡之战迫在眉睫；特朗普称恐怖威胁迫使B-1轰炸机撤离英国基地。\u003c/li>\n\u003cli>亚洲8.2万亿美元AI建设中，银行追逐高风险芯片贷款；GPU融资渗透到ABS领域，Stonebriar和Wingspire的交易便是例证；OpenAI正与阿联酋基金和贝莱德洽谈300亿美元融资；Reflection AI推出Beam新型开放式重量模型。\u003c/li>\n\u003cli>投资者情绪：存储与半导体设备板块感受尤为突出，投资者情绪明显弱于三至六个月前；美国消费者对AI整体情绪喜忧参半，基于约8,000名消费者调查。\u003c/li>\n\u003cli>闭门会附件关键词包括楼市、股市、割裂、托底政策、美联储加息、香港市场、房地产价格、按揭贴息、消费K型分化、高端制造业、出口、贸易摩擦、基建投资、流动性、港股、A股、美股、标普500、加息。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>三季度业绩期半导体设备、计算/存储、模拟芯片业绩与指引上修情况；WFE支出前置与2028年长期能见度。\u003c/li>\n\u003cli>2026Q4 DRAM合同价格显著上涨的落地情况；内存短缺对AI周期的约束。\u003c/li>\n\u003cli>Rubin。\u003c/li>\n\u003cli>FCC对中国产光模块“美国成分65%”进口门槛的后续进展；TEC使用量变化。\u003c/li>\n\u003cli>美国数据中心电力缺口弥合路径；算力供电缺口三条路径；电力短缺对二线云与零部件的传导。\u003c/li>\n\u003cli>SpaceX 11月Q3财报解禁压力测试；FAA商业航天新规提案后续。\u003c/li>\n\u003cli>中国医药公司全球研发管线进展。\u003c/li>\n\u003cli>东芝HDD产能扩张实际节奏与行业供需匹配。\u003c/li>\n\u003cli>应用材料与英特尔EPIC合作进展。\u003c/li>\n\u003cli>中国新能源汽车周度订单与零售批发渗透率变化。\u003c/li>\n\u003cli>30年期美债收益率5.65%后港股估值影响；9月龙虎榜资金流向算力与医药的持续性。\u003c/li>\n\u003cli>白酒双节后渠道反馈、商务宴请和大额采购恢复情况。\u003c/li>\n\u003cli>携程、去哪儿、七猫等应用DAU和时长趋势。\u003c/li>\n\u003cli>核电“Project Power”部署进展。\u003c/li>\n\u003cli>鸿海4Q26新AI服务器、CPO交换机及折叠手机驱动。\u003c/li>\n\u003cli>台积电资本开支上修与2027增长动能。\u003c/li>\n\u003cli>AI4S、光遗传学、金刚石散热等主题后续催化。\u003c/li>\n\u003cli>美国消费者对AI的认知、使用及情绪指标变化。\u003c/li>\n\u003cli>存储与半导体设备板块投资者情绪变化。\u003c/li>\n\u003cli>亚洲AI建设融资与GPU ABS交易进展。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>10:17｜亚洲8.2万亿美元人工智能建设中，银行追逐高风险芯片贷款\u003c/li>\n\u003cli>10:17｜特朗普签署行政命令，放宽柴油种类限制以降低成本\u003c/li>\n\u003cli>10:18｜周一，美国国债再次承压，长期国债收益率升至2002年以来的新高\u003c/li>\n\u003cli>10:18｜Reflection AI 推出了一款名为 Beam 的新型开放式重量模型，该公司称该模型可与美国和中国的领先产品相媲美。\u003c/li>\n\u003cli>10:18｜特朗普称恐怖威胁迫使 B-1 轰炸机撤离英国基地\u003c/li>\n\u003cli>10:18｜也门称已收复摩卡，曼德海峡之战迫在眉睫\u003c/li>\n\u003cli>10:18｜随着 SpaceX 扭转 IPO 后股价低迷的颓势，马斯克再次成为万亿美元富翁\u003c/li>\n\u003cli>10:18｜GPU 融资渗透到 ABS 领域，Stonebriar 和 Wingspire 的交易便是例证。\u003c/li>\n\u003cli>10:18｜市场综述：科技股上涨，油价下跌，亚洲股市有望走高\u003c/li>\n\u003cli>10:19｜【国泰海通|海外科技】SpaceX更新：多维事件催化共振，短线强势、11月关注Q3财报解禁压力测试 🔺事件：10月2日、10月6日SpaceX单日分别大涨7.4%/7.6%（突破155美元/170美元关口），较26年8月低点已反弹近60%。#SpaceX估值要素可拆分为Starship、AI、马斯克/特斯拉、10月后大涨系多维事件催化共振。\u003c/li>\n\u003cli>10:19｜$AVGO获得瑞银TPU检测的强劲利好信号： 瑞银表示，$AVGO在v8i之后仍将保持深度研发，预计新的3nm多芯片设计将推动2028年的大部分产量，随后推出的2nmv10可能会在2029年占据G00gleTPU产量的大部分份额。v10 已使用完毕 所以...根据瑞银的说法，博通并没有失去TPUv9市场，并且将在v10市场 占据绝大部分份额？\u003c/li>\n\u003cli>10:19｜OpenAI 正与阿联酋基金和贝莱德洽谈 300 亿美元融资事宜。\u003c/li>\n\u003c/ul>\n\u003ch3>附件正文\u003c/h3>\n\u003cul>\n\u003cli>AI硅光代工隐形冠军，全球扩产把握光互联机遇｜AI硅光代工隐形冠军，全球扩产把握光互联机遇 感谢各位参加今晚的会议。今天我们围绕光通信行业以及 Tower 半导体做一次系统性的交流。\u003c/li>\n\u003cli>大摩闭门会：股市楼市，割裂多久- 261005_导读｜MS周一大摩宏观 1005_ 导读 2026 年10月05日 23:17 关键词 楼市 股市 割裂 托底政策 美联储加息 香港市场 房地产价格 按揭贴息 消费 K型分化 高端制造业 出口 贸 易摩擦 基建投资 流动性 港股 A股 美股 标普 500 加息 全文摘要 全球经济形势对香港楼市和股市产生了复杂影响。美联储加息与托底政策导致香港股市在长假期间表现 疲软，但楼市在过去一年有所回暖。\u003c/li>\n\u003c/ul>\n\u003ch2>五、stocks.json关注标的摘要\u003c/h2>\n\u003ch3>长鑫科技（688825.SH）· 当天提及 2 次\u003c/h3>\n\u003cp>\u003cstrong>今日逻辑摘要：\u003c/strong> 出行与体验型消费是本轮假期的高弹性方向，而充电量六成的高增进一步验证了新能源车保有量与补能网络的正循环 \u003cstrong>重点关注内容提示：\u003c/strong> 出行与体验型消费是本轮假期的高弹性方向，而充电量六成的高增进一步验证了新能源车保有量与补能网络的正循环\u003c/p>\n\u003cp>\u003cstrong>文字观点原文线索：\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003ccode>2026-10-06 19:16\u003c/code> 结论：出行与体验型消费是本轮假期的高弹性方向，而充电量六成的高增进一步验证了新能源车保有量与补能网络的正循环\u003c/li>\n\u003c/ol>"}</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};
