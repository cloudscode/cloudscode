的：#CSP：微软（openAIcodex带动算力利用率提速+RPO高增云收入加速，估值处于过去5年均值水平）>亚马逊（anthropic带动云收入增速，自研芯片确保利润率空间，资本开支上调短期现金流或承压）>Meta（估值便宜、后续若对外输出算力有望缩短资本开支回收周期）>谷歌（估值处于过去5年高位，关注gemeni在coding场景进展及TPU性能） #Neocloud：短期看好CoreWeave（拐点临...", "publish_time": "2026-08-05 10:19", "tags": ["CSP", "微软（openAI", "文字观点"]}, "post:2026-08-05T09-26:84cbea335afc": {"id": "post:2026-08-05T09-26:84cbea335afc", "kind": "post", "title": "2026-08-05 09:26", "source_label": "帖子正文", "excerpt": "再谈海外的云服务与国内的算力租赁映射关系： 之前压在云上面的一座大山是，云厂商是AI时代出钱修路的人，最后却可能只变成闭源模型的基础设施供应商：云厂商投入巨额资本购买GPU、建设数据中心，但如果绝大部分任务都必须调用少数几家闭源模型，那么模型厂商掌握需求入口和定价权，云厂商承担重资产投入，增量利润却", "content": "再谈海外的云服务与国内的算力租赁映射关系： 之前压在云上面的一座大山是，云厂商是AI时代出钱修路的人，最后却可能只变成闭源模型的基础设施供应商：云厂商投入巨额资本购买GPU、建设数据中心，但如果绝大部分任务都必须调用少数几家闭源模型，那么模型厂商掌握需求入口和定价权，云厂商承担重资产投入，增量利润却可能被模型层拿走。 现在这个格局开始变化。开源模型越来越强、越来越便宜，虽然最强闭源模型在复杂推理和高价值任务上仍有溢价，但它已经没有必要成为所有任务的默认选择。未来的Al调用会从\"一个模型解决所有问题”，转向分层路由:最难的任务调用最强模型，普通任务调用便宜的小模型或开放模型，稳定的大规模工作负载由云厂商自行部署，并通过自研ASIC芯片进一步降低推理成本。 这对云厂商的意义很大。模型之间越可替代，云厂商越能掌握路由权、客户入口和定价权。过去闭源模型是云上游的收费站;未来模型更像云平台可以自由调度的一种计算资源。云厂商既可以出租GPU，也可以在自有基础设施上托管开放模型、销售Token，从而减少向外部模型厂商让渡的利润。 云的逻辑变好，对上游硬件是道难题。一方面开源模型竞争会刺激更多玩家增加...", "publish_time": "2026-08-05 09:26", "tags": ["文字观点"]}, "attachment:files/申万宏源-计算机行业美股云计算和互联网巨头26Q2总结：AI Capex ROI验证季-260805.pdf": {"id": "attachment:files/申万宏源-计算机行业美股云计算和互联网巨头26Q2总结：AI Capex ROI验证季-260805.pdf", "kind": "attachment", "title": "申万宏源-计算机行业美股云计算和互联网巨头26Q2总结：AI Capex ROI验证季-260805", "source_label": "申万宏源", "excerpt": "", "content": "证券研究报告 AI Capex ROI 验证季 证券分析师： 林起贤 A0230519060002 黄俊儒 A0230525070008 刘菁菁 A0230522080003 郝知雨 A0230525060002 联系人：黄俊儒 2026.08.05 1—— 美股云计算和互联网巨头 26Q2 总结 仅供内部参考，请勿外传 www.swsresearch.com 证券研究报告 2核心观点： ◼ 整体业绩：本季度谷歌 、微软、亚马逊云营收增长均迎来进一步加速 ，但对各自意义不同 。1）谷歌云： 营收248 亿美元 ， YoY+ 81.8%环比+18.4pct，预计TPU 1P销售开始贡献少量业绩 ，将在Q4贡献明显加大 。但市场此前对谷歌强模型 +高增云的要 求落空 ，Gemini 阶段性落后导致业绩发布后股价波动； 2）亚马逊 AWS ：营收$422亿，YoY+ 36.8%环比+8.4pct，持续验证 Anthropic 需求的拉动作用； 3）微软Azure ：含金量较高的超预期提速 ，Azure 营收增速 43%，环比+4pct，并指引 Q3提速至 45%，微软与 OpenAI 在26年4月调整合作协议后 ，经营上愈发分离 ，本次业绩验证云客户禀赋 +渠道对于 AI云的拉动作用 。 ◼ Capex ：26年谷歌 、微软 、亚马逊 、META 的Capex 总和预计为 7325 亿美元 。谷歌上修 26年Capex 指引 ，从$1800 -1900 亿至 $1950 -2050 亿；亚马逊从 $2000 亿上修至 $2200 亿；META 从$1250 -1450 亿上修至 $1300 -1450 亿；预计上修主要为上游存储 等产品涨价带来 。微软将 26年Capex 由$1900 亿下调至 $1750 亿，但主要为会计口径调整 ，预计对实际支出影响有限 。 ◼ Capex ROI：本季度交易核心 ，CSP 实际以销定产 、充分衡量回报后再投建算力 ，市场重新审视 Capex 质量 。若以滞后 2个季度 的Capex/ 环比增量营收来衡量 Capex ROI，谷歌/微软/亚马逊分别为 5.9/8.5/8.1，谷歌在 TPU 加持下 ROI表现更为优异；微软本 季度扭转此前 3个季度的颓势 ，边际明显改善 ，并表态 27年自由现金流保持为正 （尽管有财务口径改变影响 ）；亚马逊同样表现 出色的 Capex ROI，法说会正面回应上游涨价 ，并强调 AI服务器及设备回收期在 2-3年内 。 ◼ 边际变化： 1）减弱了对云厂投资非理性的担忧： 云厂有较强的能力转嫁上游通胀的成本 ，其产能投建是确定性的订单 +协议价格 下的理性投资选择而非 FOMO 投资； 2）开源模型正帮助 CSP提升话语权 、云客户资源禀赋 +渠道侧能力变现 ，模型能力差距缩小 将明确带动价值量向云计算倾斜； 3）CSP和NeoCloud 两种叙事差异进一步放大： CSP 的云平台出售 Tokens API进一步提供配 套优化 、适配工具 ，增加服务粘性 +技术附加价值 ，本质上是传统云粘性 +云服务支持与销售体系在 AI时代的延伸；相比 NeoCloud ，CSP 正在进一步扩大云服务的增量服务价值 ，盈利能力正全面优化 。 ◼ 标的：重点关注谷歌 、亚马逊 ，以及微软 ，关注META ； ◼ 风险提示：反垄断调查风险； AI时代变革竞争风险； AI技术发展不及预期；宏观环境不确定性带来的风险 。 仅供内部参考，请勿外传 主要内容 1.云厂26Q2 ：全面增长提速， CSP Capex ROI表现出色 2.重点公司：谷歌囿于 Gemini 阶段性落后， 亚马逊加速、微软重新提速， META AI ROI担忧加剧 3.重点公司估值表 3 仅供内部参考，请勿外传 www.swsresearch.com 证券研究报告0%20%40%60%80%100%120%140%160%180%200% 0%100%200%300%400%500%600% 2023-01-03 2023-05-03 2023-09-03 2024-01-03 2024-05-03 2024-09-03 2025-01-03 2025-05-03 2025-09-03 2026-01-03 2026-05-03META 累积涨幅（左轴） IGV软件扩展指数累积涨幅（右轴） 41.1 复盘： Q2硬件、云计算各自内部分化明显 -50%0%50%100%150%200%250%300%350%400% 2023-01-03 2023-05-03 2023-09-03 2024-01-03 2024-05-03 2024-09-03 2025-01-03 2025-05-03 2025-09-03 2026-01-03 2026-05-03微软股价累积涨幅 谷歌股价累积涨幅 亚马逊股价累积涨幅 甲骨文股价累积涨跌幅-100%400%900%1400%1900%2400% 2023-01-03 2023-05-03 2023-09-03 2024-01-03 2024-05-03 2024-09-03 2025-01-03 2025-05-03 2025-09-03 2026-01-03 2026-05-03英伟达股价累积涨幅 博通股价累积涨幅 美光股价累积涨幅 Intel 股价累积涨幅硬件阶段高点 云计算阶段高点 AI应用阶段高点关税摩擦后，市 场重心重回 AI Scaling law 下的模型训练主导 AI算力需求预期Sora 等多模态提振算 力需求 云计算分化 - OpenAI 放缓， 影响微软、 Oracle云计算分化 - Anthropic 加速， 拉动谷歌、亚马逊硬件分化：存储涨 价，CPU、光互联 价值量提升等，挤 压GPU价值占比硬件分化：存储、 CPU等进一步涨价 Anthropic 能力提升 加剧AI吞噬软件担忧 资料来源：各公司财报， Bloomberg ，申万宏源研究 仅供内部参考，请勿外传 www.swsresearch.com 证券研究报告 51.1 复盘： Q2云计算分化，形成大型 CSP和NeoCloud 两套 叙事 ◼大型云服务提供商 CSP：谷歌 GCP、微软Azure 、亚马逊 AWS 本季度均体现业绩增长加速 +股价 表现出色 ，谷歌 、亚马逊均在 Q2走到历史新高 ，微软业绩发布后 3天上涨 24.9%；新云 NeoCloud ：Coreweave 、Oracle 在4-5月的反弹后股价明显走弱 ，形成相反的两种走势 。 ◼云计算 需求： Q2延续 Q1的 高景气 ，需求 溢出向 NeoCloud 。26年1月 以 来 编 程 爆 发 下 Anthropic ARR 持续高增 ，同时拉动 AI算卡租赁价格上涨 ，亚马逊 AWS 、谷歌GCP 在Q1已实现 营收增速上修； 26年4月，Anthropic 与Coreweave 达成算力租赁合作 ，算力需求从谷歌云和 AWS 溢出至 NeoCloud ，拉动4-5月各家云厂股价上涨 ，但此后由于 Capex ROI、美联储潜在加 息预期等因素 ，导致走势明显分化 ，CSP 明显更具韧性 。 ◼Capex ROI：本季度交易核心 ，三大CSP 表现明确向好 。若以滞后 2个季度的 Capex/ 环比增量营 收来衡量 Capex ROI，微软本季度扭转此前 3个季度的颓势 ，本季度边际明显改善 ，并表态 27年 自由现金流保持为正；亚马逊 Capex ROI同样表现出色 ，法说会正面回应上游涨价 ，构建云产能 时必然充分衡量下游价格和成本之间的盈利空间 。谷歌云在 TPU 加持下 ROI表现更为优异 ，但是 担忧在于 Gemini 能力 ，以及对外销售 TPU 的业务对表报的具体贡献仍不明朗 。 ◼CSP和NeoCloud 两种叙事差异进一步放大： CSP 的云平台出售 Tokens API进一步提供配套优化 、 适配工具 ，增加服务粘性 +技术附加价值 ，本质上是传统云粘性 +云服务支持与销售体系在 AI时 代的延伸；逐渐开始形成 IaaS （自研芯片 ）-TaaS （从算力租赁转向出售 Tokens API）-AIPaaS （为云客户配套优化适配等工具形成生态 ），打开盈利空间 。 资料来源：各公司财报，申万宏源研究 仅供内部参考，请勿外传 www.swsresearch.com 证券研究报告 61.2 云厂业绩： 26Q2谷歌云、 AWS再加速， Azure重回 增长加速通道 资料来源： Bloomberg ，各公司财报，申万宏源研究 注：CY2026 对应微软 FY26Q3 -FY27Q2 ； 注：Oracle FY26 为25年5月至26年5月，表中 CY2026 对应FY26Q3 -FY27Q2图：北美主要云厂业绩梳理 单位：亿美元 CY23Q2 CY23Q3 CY23Q4 CY24Q1 CY24Q2 CY24Q3 CY24Q4 CY25Q1 CY25Q2 CY25Q3 CY25Q4 CY26Q1 CY26Q2 谷歌云营收 80.3 84.1 91.9 95.7 103.5 113.5 119.6 122.6 136.2 151.6 176.6 200.3 247.7 YoY 28.0% 22.5% 25.7% 28.4% 28.8% 35.0% 30.1% 28.1% 31.7% 33.5% 47.8% 63.4% 81.8% 营业利润 4.0 2.7 8.6 9.0 11.7 19.5 20.9 21.8 28.3 35.9 53.1 66.0 88.1 营业利润率 4.9% 3.2% 9.4% 9.4% 11.3% 17.1% 17.5% 17.8% 20.7% 23.7% 30.1% 32.9% 35.6% 亚马逊 AWS 营收 221.4 230.6 242.0 250.4 262.8 274.5 287.9 292.7 308.7 330.1 355.8 375.9 422.3 YoY 12.2% 12.3% 13.2% 17.2% 18.7% 19.1% 18.9% 16.9% 17.5% 20.2% 23.6% 28.4% 36.8% 营业利润 53.7 69.8 71.7 94.2 93.3 104.5 106.3 115.5 101.6 114.3 124.7 141.6 166.2 营业利润率 24.2% 30.3% 29.6% 37.6% 35.5% 38.1% 36.9% 39.5% 32.9% 34.6% 35.0% 37.7% 39.4% Azure 营收YoY 30% 31% 35% 35% 34% 31% 35% 39% 39% 38% 39% 43% 微软智能云营收 198.9 200.1 215.3 221.4 237.9 240. 结和展望。首先有请第一位发言人（TMT组长）为大家分享相关主题。 第一位发言人（TMT组长）：好的，谢谢主持人，大家好。欢迎大家参加今晚电话会议。正如主持人所说，今年我们大的节奏抓得比较准。大家可以看会议海报，今年第一次建议抄底是3月31号到4月7号的两次电话会议，让大家重点抄底。抄完之后，基本4、5、6三个月大行情。这一次我们前面三个礼拜开了三周抄底电话会议，连续让大家逐步分批大规模抄底。今天果然迎来了大涨。当然抄底建议基于趋势和节奏、几个月维度，不一定完全以一天为单位精准。但我想说，连续三周建议抄底，到今天标题变为AI动态展望，告诉大家抄底基本完成，底部已出。接下来就是根据产业动态、行业发展去享受上涨，把握节奏、轮动和个股变化。今天重点说这个，后面各位同事围绕AI动态总结与展望。为什么这标题？抄底完成，我们看过去AI动态告诉接下来搞什么板块，找什么机会；另外根据未来动态看演绎变化。首先看过去一段时间AI动态：从调整开始，meta叙事让人担忧，大家觉得coding天花板到了，AI应用产品没那么多。到最近最重要动态：从谷歌到亚马逊到微软CSP公司财报表态、capex、云收入高速增长，告诉之前担心AI叙事不能继续是问题。之前觉得coding 2000亿美金占50%甚至70%渗透率，觉得完了下一个产品没有，是不是核心因素下跌？我们说扯淡，因为AI叙事一直在继续，每次产品爆发不能完全预判。这次微软谷歌亚马逊财报B端云收入、新应用场景出来，叙事贯通，前面筹码消化（6月30号公募科技配置58%，最近降到28%。28%不低，历史消费新能源最高35%，但28%因这是大时代产业革命，经济K型分化，只有AI爆发真增长，比较优势明显，拥挤度不会特别低，25-28%差不多，后回67十）。同时增量资金多。过去AI动态最重要几个财报把叙事完善，长期空间打开。我们发现回归到（电子分析师插话：我们今年七千多亿美金）。明年1万多亿美金，后年可能1万四五千亿美金，可持续。企业业绩高速增长确定，估值降下来，迎来重磅机会。最近一月我强调年内科技大行情最后一次抄底机会，没让一次性抄完，陆陆续续抄，最后一次大抄底。抄完往未来看，CSP持续capex，大模型发布包括GG6、马斯克。结论：未来三年没有任何巨头放弃AI投入，生存存亡事情。明年1万亿美金云收入，capex1万亿，不会放弃。未来几个月轰轰烈烈大行情，也许不蹴而就，中期把握擅长。光模块逻辑最好，无涨价跌价担忧，无地缘影响，比例越来越高，配置认可度集中，估值增速最高极便宜：旭创今年估350-400亿200%增长，明年往1000亿150%增长，后年1500-2000亿50-100%增长，明年十倍估值。新易盛天孚通信显著，上游源杰仕佳。先好机会先来。好，其他像光模块，明年还是高增长，后年上半年高增长。跟历史不同AI需求占比去年7-8%，今年15%，明年30%，后年50%。两年后大规模扩产也许过剩不确定。叙事中估值反映悲观后，产业证明没悲观就起来。包括设备材料、国内海外算力各大方向好。最重要区别：千万别找烂标的，分化聚焦业绩龙头核心壁垒重大突破公司。总结：年内最后一次抄底搞完，进入右侧上涨，过去动态完善叙事，产业加强，未来两年供不应求，一年投资没问题，欣欣向荣中期坚定看好。今天关于天孚通信段子全假，已报警，注意规避。具体交其他首席分享，谢谢。 主持人：好的，非常感谢第一位发言人精彩分享。接下来有请传媒及海外首席分享近期AI大势总结与展望相关观点。 传媒及海外首席：各位领导晚上好，我是传媒及海外首席。汇报一下，现在明确观点，旗帜鲜明看好AI产业链里面的云和应用，可能是三季度重要方向。云原因：三季度几个趋势。第一看好通用agent（worker）场景带来token快速增长，渗透率斜率陡峭提升，比coding更大市场，最大不同国内外同时渗透，三季度斜率最高。海外Anthropic和OpenAI，国内腾讯阿里字节。第二开源模型尤其国产向闭源收敛甚至达SOTA，从K3讲，到DeepSeek v4 flash，大家意识到。接下来九月份国产模型诸神之战，至少三四个3T以上模型出，影响格局。之前讨论模型战价格下降价格战，成重要叙事。利好两个方向：第一云，不是说不看好硬件，云跑通正循环继续看好硬件。云逻辑：一直让大家觉现金流重资产误解，一多月前讲两季度财报发现云赚钱，现在真赚钱，1年半收回现金流，两年半收回利润。海外财报认识这点。第二叙事上开源强，之前闭源合作话语权重，现在开源云从管道变不同任务选模型，分成利润率提高，逻辑顺。国内云重估，看好阿里腾讯，尤其阿里云好估值便宜（SOTP），腾讯除云更看好通用agent，分发能力重要，agent时代利用微信入口仍最重要入口，从防守变进攻，AI loser变好入口，逻辑反转云好位置低，阿里腾讯最重点推荐。除之外九月模型战主流收敛，SOTA最强但差距10-20%，任务由SOTA和其他执行，模型公司格局排名变，能力收敛中被判死刑公司受益如MiniMax跌透重新关注。模型外A股传媒AI应用三个方向：1多模态2 token运营3数字艺人网红。最新：前两天爆火虚拟艺人方桃子AI人演短剧成顶流，几秒广告变现十几万，经纪公司如遥望科技，类似天娱数科日本AI艺人接广告，运营AI艺人不分成了利好。数字人公司捷成天地在线。第二token运营，之前消耗现在token化，企业需运营，易点天下5月提7月做流量大月收入可观预计千万利润，类似蓝标可讲但易点最确定。第三多模态短剧平台优于工具优于内容，中文在线昆仑万维掌阅。传媒主题思路人心思涨新逻辑易一致排序虚拟艺人>token运营>多模态，大贝塔都涨。整体旗帜鲜明看好云和AI应用，标的阿里腾讯入通看MiniMax，A股传媒前述。谢谢。 主持人：非常感谢传媒及海外首席分享。接下来有请通信首席分享。 通信首席：各位投资者晚上好。近期通信大事多行情波动调整。首先今晚最关心美国光收发器FCC新规，仅是路边社新闻，评估：第一FCC测试是环节之一（公司自测、客户验证关键、市场门槛），新闻说未来新产品可能需新实验室认证；第二事情早期仅草案可能投票，官网无正式提案文本，美政策从征求意见到执行需两年+；第三新认证不代表禁用中国产品，仅需在指定实验室过认证；第四中美AI制造业难脱钩PCB光模块材料你中有我，四年贸易战两年前需求小都依赖中国现放大几倍更不可能，Coherent受消息盘前大涨似曾相识，过去四年经验丰富。回到行业：七月A股流动性筹码拥挤叠加对28年AI capex担忧，但仅担忧未破坏逻辑。近期财报季国内旭创新易盛东山源杰沪电超预期，美股CSP财报：三年资本开支进回报期云AI收入加速，亚马逊meta谷歌上修capex，微软云收入超预期自由现金流转正循环模式跑通。今年明年capex确定回报错配分歧后端叙事多变无法断言到头。市场中日韩美暴跌反映远期担忧，低位消费地产医药涨，认为是筹码均衡，投资回归景气业绩估值。简单看美股调整两月CSP稳升硬件跌，接下来硬件公司Marvell博通AMD英伟达Coherent Lumentum英特尔财报期，若定价反映可持续受益负面脱敏不跌即临界点。今早发观点优选光互联因三优势：一光随算力增长且scale up柜内光互联增量数倍NPO/CPO/OCS应用；二光少数年降价方向上游芯片PCB涨价但旭创等毛利率环比向上因高端占比和NPO附加值高抗通缩上游松动友好；三龙头业绩亮眼估值便宜Q3确定加速明年估值便宜逻辑未破，担忧筹码拥挤但拉长看若海外修复A股更优黄金坑重视。通信汇报完毕谢谢。 主持人：非常感谢通信首席分享。接下来有请计算机首席分享。 计算机首席：各位晚上好，汇报关于AI应用大模型和国产算力新观点。关于前段时间市场暴跌，反馈无非担心28年远期愿景。CSP财报给好表征：担心coding外无更好场景支撑28年capex，27年海外capex增速可能70%+，担心28年因其他场景无信心。应看好大模型生命力每年都担心下一年capex，因27年订单可见度高但每年担心28年。调研认为AI应用有希望，coding天花板难算，别盯Anthropic ARR，OpenAI ARR快速提升抢份额，二调用量倾斜开源关注云厂商AI收入增速。CSP财报显示非大模型公司或SaaS订单增速提升，体感泛办公安全等快速渗透，海外调研API ARR占员工成本不到5%早期粗放。对coding及非coding泛白领天花板乐观，非coding白领渗透速度研究天花板更大，如某产品付费用户3000万提速，企业端非码农岗位渗透自用助手提升大。看好大模型趋势最坏时间已过，CSP积极投资因硬件ROI高，谷歌阿里云EBITDA利润率恢复证明赚钱才发债投资，错配因ROI高回收短财报后市场恢复AI正循环信心。国内同理七月筹码变动后全球AI底部积极把握。应用上coding特殊码农关键生产力渗透超预期但场景可能被大模型公司吃，泛白领领域有非大模型公司机会：其他白领岗需FTE实施工程师做数据治理等，细碎工种有第三方玩家机会。首推OA/ERP公司如Workday及AI安全板块，大模型降攻击成本升频率网安需求提升推荐。第三国产算力受全球叙事影响但国内乐观，豆包某模型ARR快速提升赚钱，智谱DeepSeek毛利率超预期ARR提升国内与海外同。明年国内capex增速不低于海外甚至更高，字节等可能翻倍增长，国产算力需求乐观。供给端芯片卡点先进逻辑封装HBM及功率MLCC等，总体好转先进逻辑拓展HBM长鑫拓展快满足战略需求缓解短缺，寒武纪二季度及HBM可获得性实际乐观看好国产算力。全球AI逆转国产算力同受益科创板补跌后寒武纪海光位置低寒武纪明年20倍PE财报亮眼，除之外港股天数智芯等进展。国产模型DeepSeek GLM-4 Flash不输V4 Pro preview V4 Pro正式版快发惊艳利好云。总结看好云泛办公网安AI应用及国产算力供给扩张超预期坚定看好。以上汇报。 主持人：非常感谢计算机首席分享。接下来有请海外分析师汇报。 海外分析师：简单汇报要点。当下推云、AI Cloud、光模块，本周云变化最多讲明白云。此前叙事云变闭源infra赚不到钱闭源有强议价权，云margin30-40%部分分给闭源钱被赚走。现开源模型达GPT4.8水平商品化，云厂可路由难任务用好模型普通用开源+自研ASIC降本。测算CSP部署开源自购GPU出租：60%推理算力下每GW收入260亿刀运营成本70亿税后经营利润150亿ROIC40%远超其他，margin/ROIC高云叙事彻底反转。多云下硬件难题但倾向看多：开源竞争烈3-10名追训练投入大云赚钱回投算力循环非通缩则算力正面看多云多算力。云财报已分析最好云其次光训练回投利好Nvidia通信光逻辑回归看好云和光。 主持人：好的，非常感谢海外分析师分享。接下来有请电子分析师分享。 电子分析师：电子这边讲下。CSP财报后硬件态势中性偏正面。财报降低对投资持续性担忧明年capex确定性提升。但未解释新增长点确保二次斜率需时间探索中长期乐观AGI前放缓低。硬件推两类：一超跌逻辑未破海外算力存储原厂MLCC载板GPU优质PCB龙头，估值历史低业绩确定性提升，（通信首席插话：的这种）优质超跌EPS驱动反弹龙头如沪电深南胜宏三环长鑫等。二长期通胀结构化增长方向杀跌30-60%估值低景气确信推荐细分：1国产算力下半年供需改善内循环推荐AI芯片先进制造中芯芯联封测通富长电伟测等；2模拟景气全球加速消费电子压制弱头部泛工业敞口70-80%受益AI增速国产替代加速Fab封测订单超预期收入逐季上移估值分位低双升机会；3互联超节点未来三年确定增量海外PCB深南电路国内ODM华勤交换芯片盛科等；4半导体设备零部件材料首推供需紧张卖铲人设备龙头明年PE\u003c40订单PS~5倍性价比高推荐中科飞测中微北方华创拓荆华海江丰富创等。以上电子汇报。 主持人：感谢电子分析师分享。接下来有请海外AI首席分享。 海外AI首席：各位晚上好汇报本周观点。上周提示云尤其亚马逊其季报展望AI ROI未来1万亿收入及250亿芯片继续看好云。弹性看算力capex软件边际突破看边缘数据中心Cloudflare Akamai Fastly即将财报。财报看好企业软件Palantir Datadog谨慎Salesforce Workday Palo Alto等。核心结论看好AI大贝塔token增速相关的infra软件及工具驱动算力受益。 主持人：非常感谢各位发言，本次会议结束。 全文详细总结 本次会议由TMT团队组织，多位细分领域首席分析师对“近期AI大势总结与展望”进行了深入讨论。整体基调为：2026年年初以来团队准确提示了算力应用、抄底节点及6月局部底部，近三周连续建议分批抄底，当前底部已确认，抄底完成，市场进入右侧上涨阶段，未来几个月有望迎来轰轰烈烈的中期行情，建议聚焦业绩龙头、规避烂标的。 1. 宏观与整体叙事修复 此前市场因meta叙事及coding渗透率疑虑，担忧2028年AI资本开支不可持续，引发全球科技股暴跌。但近期谷歌、微软、亚马逊等CSP大厂财报显示：云收入高速增、资本开支上修、自由现金流转正，证明三年投入已进入回报期，B端新场景（非coding）爆发，彻底完善AI叙事。中美在AI制造业（光模块、PCB等）难以脱钩，政策限制（如FCC新规）仅处草案阶段，无实质脱钩可能。公募基金科技配置从58%降至28%已近历史低位，因AI行业比较优势突出，配置比不会更低，增量资金将推动估值回升。未来三年巨头不会放弃AI投入，明年全球云收入与capex均有望达万亿美金，后年继续增长。 2. 云与开源模型（核心反转方向） 多位分析师指出云逻辑彻底反转：过去担心闭源模型攫取利润，现时开源模型能力逼近前沿（GPT4.8水平），云厂可作任务路由，自购GPU部署开源模型出租测算ROIC达40%，利润率大幅提升。国内阿里、腾讯最受益（腾讯借微信入口在agent时代由防守转进攻，估值低位）。九月份国产模型“诸神之战”（多个3T+模型发布）将引发模型收敛与价格战，利好云及此前超跌模型公司（如MiniMax）。 3. 光模块/光互联（通信首席强调） 光方向三大优势：①随算力总盘子增长，且scale-up柜内光互联带来数倍增量（NPO/CPO/OCS）；②唯一年降价细分，但龙头（旭创、新易盛等）因高端占比与新技术附加值毛利率持续向上，抗通缩；③龙头Q3业绩加速确定，明年估值仅十倍PE，逻辑未破，黄金坑值得重视。 4. AI应用与传媒 A股传媒三条线：数字虚拟艺人（方桃子短剧变现，利好遥望、天娱、捷成等）、Token运营（易点天下已落地千万利润，蓝标等跟进）、多模态短剧（中文在线、昆仑万维等平台优先）。排序为虚拟艺人 > Token运营 > 多模态，整体大贝塔上涨。 5. 计算机与国产算力 coding天花板未至，泛办公（OA/ERP如Workday）与AI安全因攻击成本下降而需求提升。国产算力需求侧：字节等capex可能翻倍，国内增速不亚于海外；供给侧：先进逻辑、HBM（长鑫存储扩产）好转，寒武纪、海光等科创板补跌后位置极低（寒武纪明年约20倍PE），国产模型DeepSeek、智谱盈利超预期，坚定看好。 6. 电子硬件 两类推荐：一是超跌反弹（存储、MLCC、载板、GPU、PCB龙头如沪电、深南、胜宏等，估值历史底）；二是结构化通胀增长方向——国产算力链（芯片、中芯、封测）、模拟芯片（景气上行、工业敞口提升）、超节点互联（华勤、盛科）、半导体设备零部件（北方华创、中微等首推，订单PS约5倍性价比高）。 7. 海外软件与边缘 海外AI首席提示继续看好云（亚马逊）、算力capex弹性，边缘数据中心（Cloudflare等）及企业软件Palantir、Datadog，对传统SaaS（Salesforce等）谨慎。 结论：AI大贝塔向上，云、光、国产算力、应用多点开花，建议远离概念烂标的，紧密跟踪产业动态与中报亮眼业绩，积极把握年内最后一次抄底后的上涨行情。会议中也澄清了关于天孚通信的谣言并已报警，提醒投资者注意信息鉴别。", "status": "extracted"}, "post:2026-08-05T13-54:5f29b403684a": {"id": "post:2026-08-05T13-54:5f29b403684a", "kind": "post", "title": "2026-08-05 13:54", "source_label": "帖子正文", "excerpt": "【hcdx】半导体国产化进程加速 外部限制倒逼全产业链攻坚，自主可控迎来确定性红利。地缘政治常态化与外部限制升级下，#半导体自主可控正从成熟制程替代迈向先进制程突破。", "content": "【hcdx】半导体国产化进程加速 外部限制倒逼全产业链攻坚，自主可控迎来确定性红利。地缘政治常态化与外部限制升级下，#半导体自主可控正从成熟制程替代迈向先进制程突破。晶圆厂资本开支持续倾斜、国产替代节点加速推进，产业链各细分领域具备高壁垒与客户验证先发优势的龙头企业将集中受益。 微导纳米：国内ALD设备龙头，先进制程与存储扩产核心受益。公司以自限制性原子层沉积（ALD）技术为核心，ALD只在先进制程用，渗透率不断提升，且#国产化率极低。公司产品已深入覆盖先进逻辑、3D NAND/DRAM存储等领域。随着ALD渗透率提升、国产化率提升、公司产品种类增多，预计公司未来几年继续保持超高增速。 菲沃泰：突破国产浸润式DUV耗材。公司具备纳米镀膜设备+材料工艺一体化解决方案能力，在消费电子防护领域建立极高市占率与高毛利壁垒。公司卡位DUV浸润式gkj核心耗材，成为目前国内浸润式DUV 相关镀膜的#唯一供应商，高壁垒也带来超高利润率，预计该业务空间在几十亿以上，弹性巨大。 杰华特：高端模拟IC领军者，Drmos需求跟着gpu量，服务器里核心被动元器件，国产化领先。 其他关注三祥新材（氧化...", "publish_time": "2026-08-05 13:54", "tags": ["文字观点"]}, "post:2026-08-05T19-35:9a0ce084f3cf": {"id": "post:2026-08-05T19-35:9a0ce084f3cf", "kind": "post", "title": "2026-08-05 19:35", "source_label": "帖子正文", "excerpt": "【西部计算机】怎么看国产AI叙事国产大模型在能力+速度+价格的综合评估下，取得非常好的结果，DeepSeek V4 Flash就是以后模型的标杆。国产算力+国产大模型的飞轮效应已经显现。", "content": "【西部计算机】怎么看国产AI叙事国产大模型在能力+速度+价格的综合评估下，取得非常好的结果，DeepSeek V4 Flash就是以后模型的标杆。国产算力+国产大模型的飞轮效应已经显现。国产卡通过超节点的形式，已经可以很好的去驱动国产大模型的推理。看好下半年超节点的放量。国产AI应用的叙事逻辑出现变化。AI落地闭环加速，云与应用逐步向上。近期海内外云厂陆续发布业绩逐步验证ROIC，基模降价再促AI普惠，压制应用估值的核心因素有望逐步化解。 建议关注：1）AI芯片：盛科通信，寒武纪，海光信息；2）存储及fab：中芯国际、华虹宏力、长鑫科技；3）应用：中控技术、卓易信息、星环科技、海致科技集团；4）半导体设备：北方华创、中微公司；5）算租：协创数据、宏景科技、利通电子、盛视科技、赛意信息、行云科技 郑宏达 谢忱 李想 王朗#文字观点", "publish_time": "2026-08-05 19:35", "tags": ["文字观点"]}, "post:2026-08-05T07-44:9914eace0a3a": {"id": "post:2026-08-05T07-44:9914eace0a3a", "kind": "post", "title": "2026-08-05 07:44", "source_label": "帖子正文", "excerpt": "【东吴电子陈海进】RDL、TSV与Bump：先进封装如何把多颗芯片“连成一颗” 📌 国内先进封装扩产正由封测产线向核心互联工艺延伸。随着2.5D/3D、Chiplet及HBM封装需求增长，国内设备和材料厂商持续完善RDL、Bumping、TSV等工艺布局。", "content": "【东吴电子陈海进】RDL、TSV与Bump：先进封装如何把多颗芯片“连成一颗” 📌 国内先进封装扩产正由封测产线向核心互联工艺延伸。 随着2.5D/3D、Chiplet及HBM封装需求增长，国内设备和材料厂商持续完善RDL、Bumping、TSV等工艺布局。 ❓ RDL、TSV与Bump分别有什么作用？ RDL即重布线层，负责将芯片焊盘在平面重新排列和延伸；TSV是在硅片内部制作导电通孔；Bump则是芯片、中介层与基板之间的连接点。简单来说，RDL负责“横向布线”，TSV负责“上下打通”，Bump负责“界面连接”。 💡 为什么先进封装的工艺价值量更高？ 传统封装的线路较粗、互联数量有限，而Chiplet和3D堆叠需要更多层RDL、更小间距凸点及更深、更密的TSV。每增加一层互联，通常都会增加光刻、刻蚀、电镀、清洗和检测等工序，对设备精度、材料纯度及套刻能力提出更高要求。 🔛 先进封装正在呈现“后道工艺前道化”。 先进封装的线宽、对准和缺陷控制要求不断向晶圆制造靠拢，封装厂的竞争也从简单组装转向完整互联工艺和量产良率。随着多芯片集成数量增加，增量价值有望由OSAT向光刻、刻蚀、电镀、清...", "publish_time": "2026-08-05 07:44", "tags": ["文字观点"]}, "attachment:files/东北证券-电子行业周报：长鑫科技上市首周登顶A股，中际旭创完成“A+H”资本布局-260803.pdf": {"id": "attachment:files/东北证券-电子行业周报：长鑫科技上市首周登顶A股，中际旭创完成“A+H”资本布局-260803.pdf", "kind": "attachment", "title": "东北证券-电子行业周报：长鑫科技上市首周登顶A股，中际旭创完成“A+H”资本布局-260803", "source_label": "东北证券", "excerpt": "[Table_RightTitle]", "content": "[Table_RightTitle] 证券研究报告 |电子 [Table_Title] MLCC龙头厂商 宣布涨价，消费级订单外溢 效应或显现 [Table_IndustryRank] 强于大市 (维持) [Table_ReportType] ——电子行业跟踪报告 [Table_ReportDate] 2026年08月03日 [Table_Summary] 行业核心观点： 上周申万电子指数下跌 8.77%，跑输沪深300指数和创业板指数。 村田、 三星电机、太阳诱电三大日韩厂 MLCC出货同步创下近五年单月新高， 在AI旺盛需求下，其消费级订单持续外溢。三星电机近日已向销售合 作伙伴发出通知，自 8月1日起，MLCC产品出货价格将在现行基础上 统一上调 30%， 日本太阳诱电同样也已经发出涨价通知。 存储市场方面， 三星电子及 SK海力士业绩表现较好，需求及订单指引仍较为积极。 我 们认为国产算力建设方兴未艾， 算力产业链中高景气细分赛道如 PCB、 存储、MLCC等需求旺盛，均处于景气扩张周期，亦有望提振上游设备、 先进封装等需求，建议关注 PCB、存储、 MLCC、半导体设备及材料、先 进封装等产业链投资机遇。 投资要点： ⚫ 产业动态 ：（1）MLCC，根据财联社援引韩国朝鲜日报报道，三星电机 近日已向销售合作伙伴发出通知，自 8月1日起，MLCC产品出货价格 将在现行基础上统一上调 30%。 涨价根源在于 AI带来的高端 MLCC需求 飙升。另一家 MLCC龙头日本太阳诱电同样也已经发出涨价通知。 （2） MLCC，根据TrendForce 集邦咨询最新 MLCC产业调查，得益于 AI需求 畅旺，三大日韩厂出货同步创下近五年单月新高； 其消费级订单 或持续 外溢。（3）存储，三星存储业务二季度营收超 2025全年，三星电子于 电话会议中透露，预计 HBM4今年三季度销量环比增长逾两倍，下半年 销量有望占公司总 HBM销量的60%以上。对于明年的 HBM业务，三星电 子表示已敲定 2027年HBM供货协议。为应对 AI存储持续供不应求的 局面，三星已启动新的合约体系，计划将 60%-70%的总产能以 LTA形式 运营。（4）存储，SK海力士单季利润超 2025年全年，本季度净利润 的“破纪录”表现，主要得益于主营业务的爆发与一次性投资收益的叠 加，主营业务方面， 面向 AI服务器的高性能产品推动价格进一步上涨， 传统存储芯片全线涨价。非营业利润方面， 6月份部分出售铠侠 （Kioxia）股份，录得约 62.17万亿韩元的非营业利润。全年需求预测 方面，SK海力士预计2026年全球DRAM bit 需求增速将从 2025年的 17%-19%提升至约 25%。 ⚫ 行业估值 ：从估值情况来看， 截至2026年8月2日，SW电子板块 PE(TTM) 为87.09倍，2019年至2026年8月2日SW电子板块 PE(TTM)均值为 56.45倍，行业估值高于近年中枢水平。 ⚫ 风险因素： 中美科技摩擦加剧； AI应用发展不及预期；国产技术突破 不及预期；下游终端需求不及预期；市场竞争加剧。 [Table_Chart] 行业相对沪深 300指数表现 数据来源： 聚源，万联证券研究所 [Table_ReportList] 相关研究 英特尔CPU供不应求， MLCC产业链景气度上 行 华为昇腾950超节点亮相， “国模国芯国用” 生态有望完善 美光资本开支提速， MLCC龙头厂商订单出货 比创新高 [Table_Authors] 分析师: 夏清莹 执业证书编号： S0270520050001 电话： (0755) 8322 3620 邮箱： xiaqy1@wlzq.com.cn 分析师: 陈达 执业证书编号： S0270524080001 电话： 13122771895 邮箱： chenda@wlzq.com.cn 0%20%40%60%80%100%120%140%160%电子 沪深 300 证 券 研 究 报 告 行 业 跟 踪 报 告 行 业 研 究 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 2 页 共 8 页 $$start$$ 正文目录 1 行业周观点 ................................ ................................ ................................ ....................... 3 2 市场行情回顾 ................................ ................................ ................................ ................... 4 3 产业动态 ................................ ................................ ................................ ........................... 5 3.1 MLCC ：产能吃紧叠加原材料涨价，日韩 MLCC龙头厂商宣布涨价 ............. 5 3.2 MLCC ：日韩 MLCC厂单月出货新高，消费级订单外溢效应显现 ................. 5 3.3 存储：三星存储业务二季度营收超 2025全年，七成产能被 LTA锁定 ......... 6 3.4 存储： SK海力士单季利润超 2025年全年，存储需求有望持续增长 ............ 6 4 风险提示 ................................ ................................ ................................ ........................... 7 图表 1： 申万一级周涨跌幅（ %） ................................ ................................ .... 长趋势加速。尽管三星正在 努力扩大生产，但需求增长速度更快，预计明年供需缺口将进一步扩大。 2026年第二季度， 三星电子 DRAM bit 出货量环比增长超预期， 上涨 10%-13%，NAND bit 出货量环比增长 1%-3%，符合预期； DRAM平均售价环比增长 44%-46%，NAND平均售价环 比上涨67%-69%。受益于 AI算力需求，三星 DRAM和NAND bit 出货量均创历史新高，服 务器产品占比达最高水平。 HBM产品方面， 三星电子表示， HBM4的客户评估工作已顺 利完成，随着客户下半年扩大产品生产规模，市场需求正在快速增长。目前，公司正 按计划逐步提升产能，以扩大 HBM4的供应。三星电子于电话会议中透露，预计 HBM4今 年三季度销量环比增长逾两倍，下半年销量有望占公司总 HBM销量的60%以上。对于明 年的HBM业务，三星电子表示已敲定 2027年HBM供货协议。 为应对AI存储持续供不应求的局面，三星已启动新的合约体系，计划将 60%-70%的总 产能以LTA形式运营。据介绍，三星正根据“ 5年滚动”方式签署长期供应协议，基本 合同期为五年，并通过年度谈判将合同延长一年。 目前已与全球五大数据中心客户完 成签约， 另有五家大型 AI相关客户处于谈判最后阶段， 预计寻求长期合约的客户数将 持续增加。 为增强合同履行的约束力， 新合同包含预付款条款 （相当于多年期保证金） ， 约占总预付款四分之一的金额已到账， 后续规模随新签约进一步扩大。定价方面则改 变以往模式， 根据不同客户与产品类别差异化定价，并在通用存储合同中设置价格上 限，以降低市场价格剧烈波动带来的投资风险。此外，为及时响应不断增长的客户需 求， 三星电子正准备于今年年底前开始泰勒二期工厂的建设，目标是在 2030年实现量 产。现有的泰勒生产设施正按计划推进今年的投产准备工作，随后逐步增加其 2纳米 制程的产能。三星电子此前宣布已获得各大 CSP以及AI、HPC客户的2纳米制程订单， 预计今年的 2纳米制程订单数量将较去年增长一倍以上。 （来源： CFM闪存市场 ） 3.4 存储：SK海力士单季利润超 2025年全年，存储需求 有望持续 增长 在AI基础设施投资持续扩大及市场需求强劲的背景下， SK海力士2026财年第二季度 表现较好。 营业收入： 79.32万亿韩元（约合 545.3亿美元） ，环比大增 51%，同比增长 257%。净利润： 93.92万亿韩元（约合 645.7亿美元） ，环比增长 133%，同比增长 12.42 倍，净利润率达 118%。本季度净利润的“破纪录”表现，主要得益于主营业务的爆发 与一次性投资收益的叠加：主营业务 方面，面向AI服务器的高性能产品推动价格进一 步上涨，传统存储芯片全线涨价。非营业利润 方面，6月份部分出售铠侠（ Kioxia） 股份，录得约 62.17万亿韩元的非营业利润。这批股份系 2018年通过贝恩资本财团以 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 7 页 共 8 页 约4万亿韩元收购，此次出售大幅增厚了当期利润，使得税前利润达到 122.71万亿韩 元。 业务亮点 系HBM4量产，高端产品全面开花 。DRAM业务（营收占比 73%，约57.9万亿韩 元） ：bit出货量环比增长约 7%-9%，ASP（平均售价）环比上涨约 30%。HBM4已于第二 季度量产出货，并将于下半年全面扩大产能；下一代 HBM4E样品也已交付。此外，基 于1c nm工艺的SOCAMM2产品全面开始供应。 NAND业务（营收占比 27%，约21.4万亿韩 元） ：bit出货量环比增长约 15%，ASP环比上涨约 55%。321层产品已成为 NAND产量占比 最高的产品， SK海力士计划年底前将其在韩国本土的产能占比提升至约 50%。 战略布局 方面，SK海力士锁定长期订单，坚持设备投资原则 。随着AI向“代理式人工 智能（Agentic AI ） ”演进，存储器需求正呈现 AI存储与通用存储同步增长的结构性 变化。随着头部科技公司不断扩大 AI基础设施投资，存储器追加需求也持续涌现。此 类投资是基于 AI服务所创造的收益，因此存储器需求增长趋势有望持续。 为保障中长 期供应稳定， SK海力士采取了以下战略：推进长期协议（ LTA） ：已与约 10家核心客户 完成长期供应协议谈判， 并继续与业内主要客户洽谈。 通过差异化定价和定金等财务 机制，平抑价格波动，增强需求可见性。产能扩张与资本开支：提前推进清州 M15X量 产，并为 2027年初龙仁集群首座工厂扩产做准备。同时，先进封装工厂 P&T7、NAND基 地M17等项目将分阶段实施。预计 2026年全年资本支出将达到 40万亿韩元 （约合 275亿 美元）的高位区间，坚持设备投资原则，实现产能扩张与财务稳健的协同发展。 市场展望方面， 三季度出货指引 ，DRAM bit 出货量预计环比增长约 10%（以服务器 AI 存储产品为核心） ； NAND bit 出货量（含 Solidigm ）预计环比低个位数增长（ 1%-3%）， 主推321层产品与企业级 SSD。全年需求预测：在供应受限的背景下需求依然强劲。预 计2026年全球DRAM bit 需求增速将从 2025年的17%-19%提升至约 25%；全球NAND bit 需求增速将从 15%提升至17%-19%。 随着供应限制的缓解， 潜在需求将进一步释放。 （来 源：CFM闪存市场） 4 风险提示 中美科技摩擦加剧； AI应用发展不及预期；国产技术突破不及预期；下游终端需求不 及预期；市场竞争加剧。 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 8 页 共 8 页 $$end$$ [Table_InudstryRankInfo] 行业投资评级 强于大市：未来 6个月内行业指数相对大盘涨幅 10％以上； 同步大市：未来 6个月内行业指数相对大盘涨幅 10％至-10％之间； 弱于大市：未来 6个月内行业指数相对大盘跌幅 10％以上。 [Table_StockRankInfo] 公司投资评级 买入：未来 6个月内公司相对大盘涨幅 15％以上； 增持：未来 6个月内公司相对大盘涨幅 5％至15％； 观望：未来 6个月内公司相对大盘涨幅 -5％至5％； 卖出：未来 6个月内公司相对大盘跌幅 5％以上。 基准指数 ：沪深 300指数 [Table_RiskInfo] 风险提示 我们在此提醒您，不同证券研究机构采用不同的评级术语及评级标准。我们采用的是相对评级体系，表示投资 的相对比重建议；投资者买入或者卖出证券的决定取决于个人的实际情况，比如当前的持仓结构以及其他需要 考虑的因素。投资者应阅读整篇报告，以获取比较完整的观点与信息，不应仅仅依靠投资评级来推断结论。 [Table_PromiseInfo] 证券分析师承诺 本人具有中国证券业协会授予的证券投资咨询执业资格并登记为证券分析师，以勤勉的执业态度，独立、客观 地出具本报告。本报告清晰准确地反映了本人的研究观点。本人不曾因，不因，也将不会因本报告中的具体推 荐意见或观点而直接或间接收到任何形式的补偿。 [Tale_ReliefInfo] 免责条款 万联证券股份有限公司（以下简称“本公司”）是一家覆盖证券经纪、投资银行、投资管理和证券咨询等多项 业务的全国性综合类证券公司。本公司具有中国证监会许可的证券投资咨询业务资格。 本报告仅供本公司的客户使用。本公司不会因接收人收到本报告而视其为客户。在任何情况下，本报告中的信 息或所表述的意见并不构成对任何人的投资建议。本报告中的信息或所表述的意见并未考虑到个别投资者的具 体投资目的、财务状况以及特定需求。客户应自主作出投资决策并自行承担投资风险。本公司不对任何人因使 用本报告中的内容所导致的损失负任何责任。在法律许可情况下，本公司或其关联机构可能会持有报告中提到 的公司所发行的证券头寸并进行交易，还可能为这些公司提供或争取提供投资银行、财务顾问或类似的金融服 务。 市场有风险，投资需谨慎。本报告是基于本公司认为可靠且已公开的信息撰写，本公司力求但不保证这些信息 的准确性及完整性，也不保证文中的观点或陈述不会发生任何变更。在不同时期，本公司可发出与本报告所载 资料、意见及推测不一致的报告。分析师任何形式的分享证券投资收益或者分担证券投资损失的书面或口头承 诺均为无效。 本报告的版权仅为本公司所有，未经书面许可任何机构和个人不得以任何形式翻版、复制、刊登、发表和引 用。未经我方许可而引用、刊发或转载的引起法律后果和造成我公司经济损失的概由对方承担，我公司保留追 究的权利。 [Table_AdressInfo] 万联证券股份有限公司 研究所 上海浦东新区世纪大道 1528号陆家嘴基金大厦 北京西城区平安里西大街 28号中海国际中心 深圳福田区深南大道 2007号金地中心 广州天河区珠江东路 11号高德置地广场 仅供内部参考，请勿外传！", "status": "extracted"}, "attachment:files/华鑫证券-半导体行业周报：全球CSP资本开支上修，长鑫存储LPDDR6量产在即-260804.pdf": {"id": "attachment:files/华鑫证券-半导体行业周报：全球CSP资本开支上修，长鑫存储LPDDR6量产在即-260804.pdf", "kind": "att 龙头厂商，在行业景气回升时有望具备较强盈利修复弹性。 4）先进封装， 华为发布“韬定律” ，通过逻辑折叠等技术创新推动芯片性能提升，先 进封装是实践的重要技术环节之一，市场规模稳步增长，且全球芯片大厂积极布局该 领域。 建议关注在先进封装各前沿技术领域前瞻布局的优质厂商， 如在混合键合技术、 玻璃基板材料、光互连封装、 Chiplet技术等领域取得突破的龙头厂商。 5）AI芯片，国产AI芯片市场份额快速提升，由国产芯片、国产框架、国产大模型构 成的完整 AI生态闭环正加速形成。建议关注 AI芯片领域技术创新突破并取得下游客 户认可的国产优质厂商，在国产算力加速建设背景下产品出货需求旺盛有望带来投 资机遇。 6）半导体设备及材料， 半导体各行业优质公司积极筹备上市，存储芯片龙头公司业 绩亮眼，国内晶圆厂加速推动产能扩充建设，有望提振上游半导体设备、零部件及材 料需求，同时部分环节仍有较大国产替代空间。建议关注半导体设备、零部件及材料 领域的优质龙头厂商， 受益于下游扩产及国产替代双重增长动力，产品出货需求旺盛 有望带来投资机遇。 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 4 页 共 8 页 2 市场行情回顾 上周，申万电子行业 跑输沪深300指数和创业板指数 。上周申万电子指数 下跌8.77%， 在31个申万一级行业中排第 30，沪深300指数下跌1.31%，创业板指数 下跌3.93%，申 万电子跑输沪深300指数7.46个百分点 ，跑输创业板指数 4.84个百分点 。 图表 1：申万一级周涨跌幅（ %） 资料来源： iFinD，万联证券研究所 2026年初以来， 申万电子行业跑赢沪深 300指数和创业板指数 。2026年初至2026年8月 2日，沪深300指数下跌0.90%，创业板指数 上涨4.40%，申万电子行业 上涨21.61%，在 31个申万一级行业中排名第 1位，跑赢沪深 300指数22.52个百分点 ，跑赢创业板指数 17.22个百分点 。 图表 2：申万一级年涨跌幅（ %） 资料来源： iFinD，万联证券研究所 申万电子行业估值略高于近年 中枢。从估值情况来看， 截至2026年8月2日，SW电子板 块PE(TTM)为87.09倍，2019年至2026年8月2日SW电子板块 PE(TTM)均值为56.45倍， 行 业估值高于 近年中枢水平。 基于 AI算力加速建设、 半导体产业链景气 上行等趋势利好， 我们认为板块估值仍有上 行空间。 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 5 页 共 8 页 图表 3：申万电子板块估值情况（ 2019年至今） 资料来源： iFinD，万联证券研究所 3 产业动态 3.1 MLCC：产能吃紧叠加原材料涨价， 日韩 MLCC龙头厂商宣布涨价 根据财联社援引 韩国朝鲜日报 报道，三星电机近日已向销售合作伙伴发出通知，自 8 月1日起，MLCC产品出货价格将在现行基础上统一上调 30%。 涨价根源在于 AI带来的高 端MLCC需求飙升。三星电机在通知中表示， “过去几个月以来，全球电子产业出现结 构性需求增长。虽然公司持续提升生产效率并扩大产线规模，但供应链压力已超出可 承受水平。 ” 在这之前， 三星电机已接连获得多个 MLCC供应合同： 7月23日公司宣布， 与一家全球大型企业签署了一份价值 2亿美元的 AI服务器MLCC供应合同，合同期限为 2027年全年； 6月其已与一家全球大型科技公司签署了一份价值约 3亿美元的 AI服务 器MLCC供应合同 ——业内认为，由于 AI服务器用大容量 MLCC供应趋紧，客户正开始提 前锁定长期供货。 另一家MLCC龙头日本太阳诱电同样也已经发出涨价通知。太阳诱电宣布自 9月1日起 出货的MLCC将涨价。涨价理由为原材料及辅料价格急剧上涨，公司“一直在为降低成 本竭尽全力，但仅靠自身努力已难以完全消化成本上升的部分。 ” （来源： 财联社、 韩 国朝鲜日报 ） 3.2 MLCC：日韩 MLCC厂单月出货新高，消费级订单外溢效应显现 根据TrendForce 集邦咨询最新 MLCC产业调查，得益于 AI需求畅旺， 2026年六月Murata （村田） 、 Samsung Electro -Mechanics （SEMCO，三星电机） 、 Taiyo Yuden （太阳诱 电）等三大日韩厂出货同步创下近五年单月新高；其消费级订单 或持续外溢，利好其 他制造商 ，渠道报价皆有上涨。 终端消费电子方面， Apple（苹果）先前上调 MacBook、iPad售价，再次显示品牌提前 反映对后市的成本压力， 第三季传统旺季的效应恐难完全显现， 消费级 MLCC需求维持 温和表现。 反观AI应用，由于 Google（谷歌） TPU、AWS（亚马逊云科技） Trainium 等云端服务供 应商自研 ASIC平台拉货动能不减，高容值、低电压、小尺寸 MLCC需求不减，成为市场 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 6 页 共 8 页 成长亮点，带动日、韩大厂六月出货表现。据 TrendForce 集邦咨询调查， Murata单月 出货冲上 1,400亿颗、SEMCO达980亿颗，Taiyo Yuden 则是达400亿颗，增长态势延续 至七月。 因日韩厂加速将消费级 X5R产能转向 AI用X6S/X7R高端规格，消费级中高容 MLCC（1uF- 22uF）产能受挤压，主流料号的库存水位普遍已低于 30天。在此排挤效应下，渠道、 代理商与 Tier 2/3 客户急单涌现，订单外溢效应持续扩大，其他制造商的接单能见度 明显改善，报价同步走扬。此外，已提前备货的代理商把握机会调高产品价格，平均 涨幅达20-25%， 现货市场更提高价格至原本的二到三倍， 整体消费级 MLCC市场呈现 “终 端需求偏弱、渠道价格偏强”的结构性格局。 （来源： TrendForce 集邦咨询 ） 3.3 存储：三星存储业务 二季度营收超 2025全年，七成产能被 LTA锁定 三星电子在二季度财报电话会议中表示，虽然当前手机与 PC领域受存储涨价影响需 求走弱，但服务器 DRAM、SSD、HBM的新增需求增速远超于此。超大规模数据中心为巩 固AI领先地位加码基建投入，持续提出额外的供货需求，下半年存储需求仍然强劲。 随着智能体 AI普及，通用服务器与 AI服务器的相关需求增长趋势加速。尽管三星正在 努力扩大生产，但需求增长速度更快，预计明年供需缺口将进一步扩大。 2026年第二季度， 三星电子 DRAM bit 出货量环比增长超预期， 上涨 10%-13%，NAND bit 出货量环比增长 1%-3%，符合预期； DRAM平均售价环比增长 44%-46%，NAND平均售价环 比上涨67%-69%。受益于 AI算力需求，三星 DRAM和NAND bit 出货量均创历史新高，服 务器产品占比达最高水平。 HBM产品方面， 三星电子表示， HBM4的客户评估工作已顺 利完成，随着客户下半年扩大产品生产规模，市场需求正在快速增长。目前，公司正 按计划逐步提升产能，以扩大 HBM4的供应。三星电子于电话会议中透露，预计 HBM4今 年三季度销量环比增长逾两倍，下半年销量有望占公司总 HBM销量的60%以上。对于明 年的HBM业务，三星电子表示已敲定 2027年HBM供货协议。 为应对AI存储持续供不应求的局面，三星已启动新的合约体系，计划将 60%-70%的总 产能以LTA形式运营。据介绍，三星正根据“ 5年滚动”方式签署长期供应协议，基本 合同期为五年，并通过年度谈判将合同延长一年。 目前已与全球五大数据中心客户完 成签约， 另有五家大型 AI相关客户处于谈判最后阶段， 预计寻求长期合约的客户数将 持续增加。 为增强合同履行的约束力， 新合同包含预付款条款 （相当于多年期保证金） ， 约占总预付款四分之一的金额已到账， 后续规模随新签约进一步扩大。定价方面则改 变以往模式， 根据不同客户与产品类别差异化定价，并在通用存储合同中设置价格上 限，以降低市场价格剧烈波动带来的投资风险。此外，为及时响应不断增长的客户需 求， 三星电子正准备于今年年底前开始泰勒二期工厂的建设，目标是在 2030年实现量 产。现有的泰勒生产设施正按计划推进今年的投产准备工作，随后逐步增加其 2纳米 制程的产能。三星电子此前宣布已获得各大 CSP以及AI、HPC客户的2纳米制程订单， 预计今年的 2纳米制程订单数量将较去年增长一倍以上。 （来源： CFM闪存市场 ） 3.4 存储：SK海力士单季利润超 2025年全年，存储需求 有望持续 增长 在AI基础设施投资持续扩大及市场需求强劲的背景下， SK海力士2026财年第二季度 表现较好。 营业收入： 79.32万亿韩元（约合 545.3亿美元） ，环比大增 51%，同比增长 257%。净利润： 93.92万亿韩元（约合 645.7亿美元） ，环比增长 133%，同比增长 12.42 倍，净利润率达 118%。本季度净利润的“破纪录”表现，主要得益于主营业务的爆发 与一次性投资收益的叠加：主营业务 方面，面向AI服务器的高性能产品推动价格进一 步上涨，传统存储芯片全线涨价。非营业利润 方面，6月份部分出售铠侠（ Kioxia） 股份，录得约 62.17万亿韩元的非营业利润。这批股份 声音，停止抹黑中国企业并以制裁相威胁。对于任何严重损害中方利益的行动，中国都将采取一切必要措施予以回应。 中游：磷化铟是高速光通信中EML激光器、探测器和部分光子芯片的关键衬底材料，日本住友、AXT北京通美、JX金属三家占据全球磷化铟衬底90%以上产能。 上游：中国在全球精炼铟供给中的占比约为70%‌。 美股光通信板块集体上涨，Coherent上涨12.35%，康宁上涨9.04%，Lumentum上涨8.92%。 磷化铟：云南锗业、兴业科技 铟：锡业股份、华锡有色、株冶集团三、自动驾驶强制性国家标准正式发布《智能网联汽车 自动驾驶系统安全要求...", "publish_time": "2026-08-05 07:26", "tags": ["文字观点"]}, "post:2026-08-05T08-53:0f8d4df39742": {"id": "post:2026-08-05T08-53:0f8d4df39742", "kind": "post", "title": "2026-08-05 08:53", "source_label": "帖子正文", "excerpt": "茂莱光学的CPO检测设备是和康宁合作开发的，光器件也是直供几个北美客户，激光通信设备客户是谷歌，所以不受此次国产光模块的潜在利空影响，反而将来设备正式量产后，更受益海外下一代光互联技术的发展。公司近期接受机构调研交流时，表示光互联业务布局三类产品：第一类是无线空间激光通讯设备，目前为谷歌供应算力机房", "content": "茂莱光学的CPO检测设备是和康宁合作开发的，光器件也是直供几个北美客户，激光通信设备客户是谷歌，所以不受此次国产光模块的潜在利空影响，反而将来设备正式量产后，更受益海外下一代光互联技术的发展。公司近期接受机构调研交流时，表示光互联业务布局三类产品：第一类是无线空间激光通讯设备，目前为谷歌供应算力机房互联用的整机产品，未来可应用于空地空间传输场景；第二类是微透镜、棱镜、光学耦合阵列等传统光互联器件，公司认为该类产品技术壁垒较低，仅为短期需求驱动的品类； 第三类是基于光波导检测技术的CPO光芯片及封装过程检测设备，公司目前已具备光波导光学性能检测能力和个位数纳米级的封装对准精度技术，未来将结合半导体和AR/VR领域的技术积累开发该类设备，支撑下一代基于光波导的CPO封装量产，目前已和康宁开展合作，第一代产品基于微V型槽检测界面开发，第二代基于光波导技术开发。---xz#文字观点", "publish_time": "2026-08-05 08:53", "tags": ["文字观点"]}, "attachment:files/依然是光与PCB.docx": {"id": "attachment:files/依然是光与PCB.docx", "kind": "attachment", "title": "依然是光与PCB", "source_label": "其他", "excerpt": "今天也是我们看光、PCB和光设备的三位同事，一起给大家解读一下相关的市场热点，再加上我们后面确实看到了产业链上面的一些变化。但是今天晚上因为大家关注度都非常高的新闻，就是北美FCC的禁令。", "content": "今天也是我们看光、PCB和光设备的三位同事，一起给大家解读一下相关的市场热点，再加上我们后面确实看到了产业链上面的一些变化。 但是今天晚上因为大家关注度都非常高的新闻，就是北美FCC的禁令。我先给大家大概更新一下。FCC是美国联邦通信委员会，类似于中国的工信部，主要负责一些监管，包括实验室和公司的认证。这部分认证包括通讯设备、消费电子、智能家居、汽车电子等等，都在FCC的认证之内。 只要你想出口到北美，那么现在大家觉得北美有这样一个FCC禁令的预期，是不是会对一些新的一些光、PCB以及通讯设备产生影响？但是我们觉得大概是这样理清。第一个，我们仍然认为，对于北美的数据中心以及下游终端客户来说，脱离中国制造的光模块、PCB，只能让他的数据中心成为一堆废品。所以之前，比如今年5月份，包括去年中美贸易战的时候，也出过类似的消息，但实际上最后都没有落地。原因就是，我们能看到，以Lumentum、Coherent等为主要代表的美国硅光企业，没有办法在短时间内，甚至在中长期内，大规模扩张产能，去填补北美AI数据中心的缺口。所以前段时间大家能看到Lumentum CEO公开表示，他2028年的产能全部被订满。这也就意味着，以Lumentum为主要代表的北美光公司，没有办法支撑这么大的产能。另外，从产品升级迭代的角度，从800G到1.6T再到3.2T再到后面的NPO、CPO，我们认为国内的厂商，尤其是中国大陆的厂商，以旭创、新易盛等公司为主要代表，还是远远走在全球技术领先的前列。所以这是一方面，北美脱离不了中国供应链。第二个，我们能看到，对应光这类公司，包括光、PCB公司，早已经在泰国、越南有了比较多的布局和产能规划，这些产能规划再加上产能释放，包括去年中美贸易战和今年FCC，都有一些比较强的后手。所以我们认为，可以通过这些海外基地，出产部分产能，供到相关终端地区。所以我们认为也有一种所谓出产地的保护。另外，我们觉得FCC的规则现在还没有那么确定会落地，尤其是在整个高端的光里面，北美也比较清楚，因为这不是北美所需要的核心竞争力，比如半导体、半导体设备、半导体制造尖端的能高、IC设计能力、EDA等，这些才是北美对于半导体或制造业的核心诉求。但是对于通信板块，尤其是光、PCB等，这些更多还是辅助主动芯片，辅助核心半导体运作的品类。所以我们认为没有这个动因，也没有必要最终通过这个FCC禁令。所以我们本身的解读是这三个方面。 综上，我们认为整个FCC对于产业的影响几乎不会受到什么影响。但是实际上，因为最近大家能看到整个市场的空间是下来的，所以可能情绪上会受到一些影响。但是我们认为，只要大家清楚地考虑到整个FCC对于光、PCB的影响，有一个相对客观的探讨，大家最终还是会回归到产业本身，回归到合理的EPS和估值水平。对于股价的影响，我们认为并不用特别担心，这是FCC的考量。 另外，我们在最近的路演，尤其是这两三天的路演和密集跟市场投资人交流中，发现大家对于整体AI叙事逻辑发生了一些微妙的变化。这也是我们今晚开电话会的主要原因。当然，我们前段时间在市场行情不好的时候，也一直陪伴大家，跟大家一起度过艰难时刻。现在我觉得一定有必要给大家再传达一下市场的情绪，或者说整个逻辑的微妙变化。之前我们能看到市场最担心的是什么？最担心的是三个市场。我一直在强调，北美市场大家最担心的是没有新的AI趋势，老的趋势再降速，没有新的AI叙事，再加上CSP端有比较大的矛盾，就是自由现金流和资本开支的对立矛盾，短期没有办法解决，这是北美侧的核心担忧。日韩，尤其是韩国的核心，是暴力去杠杆的过程；A股短期的核心，是龙头上市所导致的虹吸。我们认为这三个市场短期的担忧，要不然已经落地，影响没那么大；要不然已经推进到股价里面，已经定价了。现在调整这么多，幅度这么大，我们认为确实没有必要再担忧了，最坏的时候已经过去了。 另外，如果我们重新回到整个AI产业的基本面，首先在资本开支端，大家没有非常明确或激进地上调或下调。因为北美云厂商也非常清楚，继续上调资本开支，得到的一定是市场的负反馈，因为大家觉得资本开支无法持续，自由现金流加速转负。但如果下调资本开支，大家又觉得对AI投入信心不足，确实到了一个进退维谷的境地。所以这些云厂商选择了温和地上调资本开支，或者先不公布明年资本开支的预期。我认为这对于整个市场来说确实是一个呵护。 另外，产业端有非常积极的信号。大家看到了，云业务的高速增长非常超预期，比如谷歌云同比82%的同比增长，我们原来预期可能75%左右，确实非常超预期；微软Azure 43%的同比增长；AWS亚马逊云37%的同比增长。这些云业务的高速增长说明了一个事实：云厂商拥有非常高质量的ROI，比大家想象的质量都高。 另外，整体的AI业务在不断地上升预期。尤其是亚马逊，以及微软等，都公布了自己，尤其是亚马逊的积压订单，大家能看到超过了5000亿美金的积压订单，意味着确实做不过来。所以大家最近也发酵了一些new cloud，比如Nebius等，我们都能看到美股股价表现非常强。所以，我们能比较清晰地意识到，目前整个CSP的盈利能力，包括它本身业务的高质量ROI，跟Capex并不是你死我活的关系。 现在来看，尤其是云厂商和这些new cloud最近的股价表现，让大家意识到，整个对于算力的采购，最终服务于下游比较高质量的需求，尤其是目前包括它自身云业务的高速增长超预期，再加上积压订单的超预期，表明AI的企业正在向更广阔的客户、更多的场景、更高质量的场景渗透。 所以我们觉得这本身是一个相对正向的循环，我认为至少是有一个修复的过程。伴随着AI采购的进一步投入，我们能看到这些巨头的财报，在未来的相当长一段时间内，尤其是云业务端和本身的单独订单，都会非常亮眼。所以也打消了之前大家对于明年二阶段可能会转负或见顶的担忧。 那大家现在的心态出现了比较微妙的变化。我认为最主要一方面，是我刚刚讲的，大家确实看到了联想的财报披露之后，有一些情绪性修复，或者说大家看到产业进展相对比较好，所带来的修复。另外，我们也看到有一个核心原因，是股价位置相对比较低了，大家很难在目前的股价位置再去杀跌。 已经pricing的逻辑，就像我刚刚说的，三个市场里面最主要的悲观预期，全部已经推进到股价里面。所以我们觉得最近交流下来，确实原来到6月份的时候大家情绪过于乐观，但到7月底8月初的时候，大家情绪又过于悲观。所以会有一个市场认知，随着整个市场云厂商的基本面，包括整个产业发展的趋势，会有一个逐步修正的逻辑。所以我们还是很看好后市，至少有一个比较明确的反弹趋势。那么反转，我们认为还是需要要不就是老趋势持续加速，要不就是新趋势慢慢展开。目前我们从产业链调研下来，也发现了这样一个不能叫AI的全新叙事，我们只能说从产业端来看，我们认为其实很像去年的年初。 大家能看到去年的年初，整个叙事逻辑也没有很顺，大家还是担心资本开支的持续性。但是往后面看，最主要的驱动力是去年年初开始B200开始大规模放量所导致。去年一季度光模块、PCB先放利润，然后以工业互联为主要代表ODM在二季度放出超预期的利润。那么往后面去看，从现在这个点位，再往下半年去看，我觉得最主要的驱动力，当然我们每次也都在跟各位强调，就是最主要的驱动力其实还是跟二季度不太一样的。二季度的驱动力主要还是来源于全球投资人对于AI从0到1叙事逻辑的理解完成所带来的估值扩张。今年的三季度，我们认为最主要还是因为英伟达的B200，谷歌的TPU v8这些新品上量，快速拉货备货和到今年Q4集中交付所带来的景气度加速上行。所以我们能看到，基本上进入到三季度，光和一些PCB，包括一些核心的上游元器件，都在一个加速的利润释放的过程当中，再叠加上现在股价已经跌了那么多，至少是有一个预期的修复。当然我们不排除后续可能会有老的叙事，coding的加速，或者说新叙事继续创造一个几万亿美金的市场所带来的新一轮估值扩张，我们不排除会有这样的贝塔。 但是如果退一步讲，如果没有这样的预期，我们认为整体的估值修复，再叠加上产业端新产品生命周期开始所带来的EPS加速，我们认为也进入到了一个阶段性的双击过程。我们觉得这个双击过程最主要的增量，更多还是以海外光和海外PCB，就是面向海外算力的光模块，包括光模块上游以及PCB和PCB上游为主要核心的公司。而且这些公司，我们目前能看到光模块相关的大票已经跌到了明年大概十倍左右，PCB相关的大票也跌到了15倍左右。所以我们认为目前这个底部的估值保护，或者说保护垫，其实是非常厚的。那么再往进一步，主要还是依靠新品上量所导致的EPS加速和估值修复，也就是这样一个双击过程所带来的股价表现。 对于具体的方面，我们认为光的话，最主要的还是去看含英伟达新品量和含谷歌新品量占比相对较高的公司，比如旭创、新易盛，包括上游的一些核心品类，比如光芯片的东山精密、源杰科技，以及有源无源光器件的天孚通信、聚光科技、水晶光电等等。我们认为整体逻辑都还是比较顺的。 另外，我们能看到整体NPO确实是大家最近主要关注的一个比较强的趋势。在GB200到B200的拓展过程当中，NPO本身的价值增量是2到3倍的单位GPU价值量的提升。大家从昨天的SemiAnalysis的报告也可以看到，里面最主要第二三条线就是NPO。我们NPO也做了很多研究，待会儿分析师二给大家再细节地汇报一下NPO的相关量价和未来的出货上量预期。我们认为对于NPO而言，确实打开了整个光的空间，所以相关NPO的模子公司，以及上游的高功率CW光源的公司，以及M-Sub相关PCB的公司，我们觉得这一条链都还是可以去重点关注的。如果说后面有比较明确的反弹，我们认为NPO这条线应该是最主力的方向。 另外就是PCB，我们其实也认为目前已经到了一个比较高的性价比的配置区间。最主要能看到以AI的PCB为主要代表的品类，包括胜宏科技等公司，在未来三季度能放出比较大的产能弹性。另外，上游的一些高端品，有比较强的阿尔法，能够再进一步在英伟达、谷歌和其他SK上面不断扩展国产份额，比如生益科技、华正新材等，也是我们可以重点去看的标的。 另外就是光设备，我们其实在今年的最开始，就是连续之前没上市的时候，我们就底部推了一波。目前来说，光设备不论是联讯，还是日联科技等，我们认为其实还是两倍多光模块的贝塔。那么往后面看，随着光的持续渗透，包括新品的持续体量，我们认为一方面是扩展所带来的二阶导，就是光设备的二阶导提升；另一方面就是本身的检测难度、检测对准耦合的难度会提升，所以相关单位模块或单位端口所对应的设备消耗量，也是一个非常大的看点。 所以就是这三块，我们接下来分别有请我们看光的分析师二，看PCB的分析师三，专门看光设备的分析师四，来给大家分别汇报一下相关产业链的进展和细节。总归我们能看到，现在确实是一个悲观预期都相对出清，后续我们选择的反弹中军，还是光和PCB这块，这两块大家还是能够更多地加深研究和配置。下面请分析师二来给我们大概细节梳理一下NPO相关的情况。 【分析师二】 好的，感谢分析师一，感谢各位领导。各位领导大家晚上好，我是主要覆盖光通信领域的分析师，也像分析师一刚刚所提到的，今天晚上FCC这个事情还是引发了比较多的关注，很多人觉得这个事情是真的。核心的参考标准是说，light和coherent在这个新闻发出来的一瞬间是暴涨了的。但是我觉得今天晚上的整个美股都很难说具有很强的一个参考性。因为本身这个coherent和light，包括闪迪、存储这些，最近走得也都是相对来说比较强势的，所以这个时间它暴涨，其实也并不代表什么。而且云这边，像AWS、meta这些，本质上这段时间也是有比较强的超额，也都有二三十点的超额。所以它今天盘前相对来说走弱，也并不能说明什么，而且像康宁这些，也都是有一个比较明显的拉升。所以我觉得大家根据美股去判断这个消息的真假，本质上没有什么非常强的可相关性。 然后这个消息，本质上其实也像刚才分析师一所说的，确实就是我们在这一块产业链的地位相对来说还是比较强的。我们也有一些像磷化铟之类的反制因素在。当然九月份马上特朗普就要访华了，确实可能会存在一些访华前的博弈，这都是很正常的。所以我觉得就当前这个阶段，整个像光模块，不管是光模块还是光芯片以及光的一些标的，都跌到当前这个位置，都有比较高的配置性价比。所以我觉得，虽然当前还是以这种事件催化，有震荡的可能，但是都是一个震荡筑底的过程，是一个逢低加仓和配置的过程。所以我个人总体还是比较看好光相关的一些公司。 然后先说刚才分析师一提到的NPO的一些东西。之前大家确实一直因为旭创现在按照明年的一致预期来看，我们假设按照比较中性的预期，明年1000亿来看，其实现在也就是十倍左右的水平，也就是说明很多人把它当做是一个周期股去做配置。但实际上，它的成长性主要体现在它的产品更新换代要更快。它从去年的800G、今年1.6T、明年的NPO来看，其实明年NPO就有可能会成为它的一个主力利润贡献点。而且NPO这边我们跟产业聊下来的话，总量还是相对来说比较超预期的。 总体的量，从明年下半年开始，总的需求量大概有5000万只，其中英伟达大概有2500万只左右，谷歌可能会有1500万只，但谷歌这边还在看一些像LPO之类的方案，然后AWS这边大概有1000万只不到到1000万只，总体加起来是5000万只左右。然后旭创那边也有一些消息称，他没有拿到谷歌那边的订单之类的。当然这个时长可能不只是明年下半年，从明年下半年到后年，大概有这样的时间维度。但是NPO肯定是未来放量的方向，也是能够证明这些光模块厂商从周期转向成长的关键放量点。这个就是NPO这边的情况。然后今天晚上tower应该也是发了业绩，相对来说还算是比较超预期。 再一个，除了光模块之外，对于光芯片，大家也一直是在推荐，像源杰、东山、永鼎这些公司。我还是觉得光芯片这边逻辑确实相对来说是最好的，核心还是因为它还是一个供给处于紧缺的状态，再加上他们总体的出货水平还是比较超预期的。我觉得如果这个地方是有一个相对不错的反弹，或者震荡向上的过程的话，这些公司还是比较有配置性价比的。 再一个，光器件这边，除了有源器件，无源器件那边也有一个比较大的提升，主要还是因为通道数的增长，导致它总体有一个比较大的提升。像是今天走的相对比较强的光库，然后MPO的那些公司，我觉得都是比较看好的标的。然后CPO这边，这两天也有一些新的信息消息，包括CPO量产之类的。从产业端我们也可以很明确地验证到，它还是明年有放量的过程。所以CPO这边，我自己比较建议大家关注的就是天孚通信和炬光这两家公司。虽然他们现在短期来看，业绩释放的可能性不大，但是明年还是有比较大的预期差的。 整个光这边大概就是这样的观点。我觉得站在当下这个节点，光这边还是有比较高的配置性价比，不管是从估值还是从未来的叙事，还是从整个海外的叙事角度，都是这个样子。以上就是我大概的光这边的观点。接下来就请我们看PCB的同事分析师三来给大家介绍一下他那边的观点。 【分析师三】 好的，谢谢。我是主要覆盖PCB领域的分析师，我这边大概汇报一下有关PCB的关键情况。首先整个AI的大贝塔来讲，像前面那个分析师二和分析师一说了，CSP的上涨其实是一个非常好的、非常积极的信号。整体上最起码我们可以认为AI的情绪已经比较明确了。 市场过去像谷歌发出财报之后，表现其实是不太好的。实际上市场是对于资本开支投入，其实谷歌的云业务是表现很好的，没有问题，但是因为现金流的问题，市场在惩罚资本开支投入过多、现金流比较差的云厂商。但是从微软，尤其是亚马逊财报发出来之后，整个还是有一个转变的。亚马逊的业绩会表述非常积极，不管是积压订单的披露，还是对比当年云业务的情况，他们认为现在这个回报的速度比当年云业务投入的时候回报速度更快。我觉得这些积极的表述，让大家对整个资本开支投入的逻辑或ROI的情况有了新的认知，然后对AI的可持续性重新增强了信心。 所以说，整体来讲，这个CSP的大涨，尤其是像前面跌得比较多的谷歌以及meta，现在已经全部修复失地了。所以从这个角度，我觉得AI的情绪底肯定已经到了，大家不再悲观。那么下面我们就要看这个反弹的力度、高度以及反弹时间长短的问题。然后PCB这边，本身它是跟光一样，是我们大陆这边的优势产业链，所以肯定是配置上面最核心的环节。如果从估值的角度，PCB的相关产业公司已经从20到25倍，当时接近25倍的区间，跌到了15到20倍区间，空间感是比较足的。15到20倍这个区间，已经相对比较低了，比如我们去看果链的上市公司，一般也就是给到15到20倍，之前非AI的时候。所以整体来讲，已经跌到一个比较有性价比的位置。如果往高度去看，去年8月份行情顶部的时候，已经交易到25到30倍，或者说接近30倍的区间。所以如果新一轮蓄势重新铺开，再继续往上走，PCB的空间感也是非常足的。 从产业变化的角度，三季度两款重要的芯片，在PCB这个环节，因为PCB会前置于机柜出货，这个Rubin和谷歌TPU V8都会出货了。它相比于上一代产品的单价增长了大几十个点，谷歌的话，对应单芯片的价值量大概要翻倍到3000块钱。所以这两个除了量在增长之外，更多的是有一个价涨通胀的逻辑。所以在三季度，PCB实际上边际变化的表现还是非常好的。如果从整个市场空间的角度去看，去年大概是在500亿左右的市场空间，然后整体的PCB今年已经成长到1000亿。那明年在谷歌价格翻倍，以及产品多了midplane、LPU等新的增量板，以及mSAP成为全新增量之后，整个PCB的空间有望再翻倍，到2000亿这种规模级别。所以整体来看，估值消化的速度也非常快，业绩增长非常快。 mSAP这边今年大概也就是不到100亿的盘子，那明年会增长到大概300亿的市场空间。就像前面那个分析师二的NPO的一些积极进展，我觉得对mSAP也是一个非常有利的催化。如果这个实际上能落地的话，那么现在mSAP去扩产的公司也很多，其中龙头厂商会保持非常强的技术竞争优势，其他一些二线厂商也有机会凭借设备的前置购买以及技术的一些进步，在这个市场上取得一定的市场份额和地位。整个PCB环节呈现的都是短期空间感足够强的基础之上，有新技术不断迭代，新产品不断推出，新的板子类型在不断迭代，所以整体的增长趋势还是非常强劲的。这几个PCB票也都是一些容量大票。 我觉得现在这个阶段，整个行业还是有配置价值的。那么三季度来看，还有一个点就是非AI的PCB也会有一个相应的修复，所以整个链条就都打通了。不管是AI和非AI的PCB，一个是受益于AI的通胀，一个是受益于PCB自身涨价带来的毛利率修复，整体来讲三季度会形成一个两方面共振，整个PCB板块的业绩我觉得会上一个新的台阶。好，那么我们还是秉持一直以来一个观点，就是按季度来看，PCB是非常变化比较大的一个季度，然后明年来看空间感足够强。现在跌到这个位置，估值也是比较偏低的。相比于去年大行情以来，整个估值也是一个比较低的位置。所以现在的配置价值还是比较高的。以上就是我对PCB这边的汇报内容，下面有请我同事分析师四再给各位领导梳理一下对设备一些相关的情况。 【分析师四】 谢谢分析师三。各位同学大家好，我是主要覆盖光设备领域的分析师，今天汇报一下我们关于光设备的观点。首先核心观点，我们觉得当下位置光设备逻辑是非常硬的。在各位同事谈到后续光路线非常清晰的情况下，我们对于上游设备迭代的必然性，还是觉得非常重要的。然后也建议重视一些通胀的环节，包括测试、耦合等环节。公司层面建议关注这些平台型的公司。 汇报一下这两个月看到的一些变化。首先从行业层面，我们看到硅光的渗透率在不断提升，我们觉得下半年硅光的份额渗透率可能会提升得更快，可能会从目前可能一半的份额，提升到年底可能大几十。那么相对应的，对于硅光上游自动化的，包括一些半导体设备的采购，我们觉得目前还在订单持续上升的过程中。 以一年的维度来看，往后续2到3年维度来看，从硅光到CPO，其实我们觉得还有一个非常大的预期差，就是大家对于CPO的资本开支，我们觉得还是非常低估的。现在都觉得是同比增长20%到30%的水平，但其实我们看下来，CPO阶段，包括目前的一些路线，虽然还没定型，它的测试难度、时长都是非常高的。相对应的台积电目前所采用的单独的机台的价格，相比目前都是翻倍以上的。所以往后面去看，虽然大厂在逐步调试设备，逐步缩短上游制造端的时间，但是往后面看，我们觉得CPO相较硅光，它的资本开支会有非常明显的提升。这样看来的话，光设备不光是今年或二季度，最快一年，可能28年或者往后去看，都有比较高的边际变化。 哪怕不去看CPO阶段，就拿NPO举例，NPO设备相较于目前的规模而言，也要替换30%到40%的设备，不光是一些高带宽的测试机，还有一些高精度的贴片、耦合机台，都是需要更换的。所以往后去看，我们觉得设备替代的必然性，包括资本开支持续性，都是非常强的。 然后我们从上游也可以看到，目前不管是光芯片、光模块，还是上游环节，供应瓶颈都在逐步解决。然后从光设备公司层面，我们看到最近大家都在扩产建厂房，包括有一些陆续订单在落地，比如说日联在广东又新投建了一些产能，包括罗伯特科的一些大订单，陆续最近已经开始确收，包括华兴源创的主动式都开始并表，包括上个月底的联讯的Q2业绩，其实能看到整体的景气度是非常高的。我们觉得从包括月底的旭创、新易盛，他们表观的资本开支，都会看到非常大的环比增长。这个趋势也确认了整体下游订单，我们觉得完全没有问题。那么从光设备公司层面来看，下半年的季度业绩环比大幅度增长，这个趋势是绝对没有质疑的。那么从订单来看，普遍整个行业相较于年初的订单基本上上去2到3倍以上。如果说是一些高壁垒的测试环节，比如日联、联讯等，其实都是上修3到4倍甚至更高的水平，订单是非常充足的，包括一些耦合环节，都是这样不断上升订单的状态。 那么从交期来看，海外公司交期目前也依然在拉长，从年初的两个季度拉到目前3到4个季度，包括是德科技的测试机，基本上都是三四季度才可以交货。从国内的公司来看，他们的交期从年初可能都不到一两个月，目前也有一些比较景气的机台，一些测试环节已经交期上升到半年甚至半年以上。 所以整体上我们对于光设备环节的持续性是非常看好，尤其现在这个位置，我们建议重点关注两个维度。第一个维度是最核心的环节，也是叠加一些通胀的环节，就是测试。包括最核心的随着速率升级必须要去迭代的机台，比如示波器、误码仪、时钟恢复单元等，以及后续有一些变化的，比如老化测试机台等，这些都是值得关注的相关标的，就是联讯、日联、华兴源创等公司。 第二个维度我们建议关注有边际变化的、能参与到后续新品类的、新场景的、新业态范式的环节。比如能参与到整线机台的博众精工，或者说切入到一些新的设备方式的科瑞技术等，这些公司也都值得关注。整体看下来，站在当下节点，很多的龙头光设备公司对应明年的估值，都是在20倍到30倍之间，而且明年还有业绩上升的可能性，所以我们整体也是建议大家关注光设备的一些龙头公司。以上就是我们关于光设备的观点，分析师一。 【分析师一】 好的，也感谢大家的倾听，然后祝大家收益长虹。然后明天有一个比较好的表现。 总结： 本文是电子行业团队关于光通信、PCB及光设备产业链的电话会议纪要，主要围绕北美FCC禁令对行业的影响、AI叙事逻辑的变化、以及NPO、光芯片、PCB、光设备等环节的投资机会展开分析。 首先，针对北美FCC禁令，分析师认为该禁令对产业实质影响有限，理由有三：1）北美数据中心无法脱离中国制造的光模块和PCB，否则将无法运转；2）国内光模块和PCB厂商已在泰国、越南等地布局产能，可通过海外基地出口；3）FCC规则主要针对半导体等核心领域，光通信和PCB并非北美的核心诉求，因此落地可能性低。尽管短期情绪可能受冲击，但中长期仍应回归产业基本面。 其次，关于AI叙事逻辑，分析师指出市场最担心的三个市场（北美、日韩、A股）的悲观预期已基本定价，最坏时刻已过。北美云厂商资本开支温和上调，云业务高速增长（谷歌云82%、Azure 43%、AWS 37%），积压订单超5000亿美元，表明AI投资回报质量高，并非与资本开支对立。新的云厂商（如Nebius）股价走强，进一步确认算力需求的高质量。分析师认为当前市场情绪从过度悲观开始修复，三季度有望迎来反弹，主要驱动力来自英伟达B200、谷歌TPU v8等新品上量带来的景气度加速，以及估值修复和EPS加速的双击。光模块和PCB相关标的估值已跌至历史低位（光模块10倍、PCB15倍），具备较高性价比。 在具体板块方面： 光模块（NPO）：NPO是未来放量方向，GB200到B200将带来2-3倍单位GPU价值量提升。预计明年下半年至后年，NPO总需求量约5000万只，其中英伟达2500万只、谷歌1500万只、AWS1000万只。旭创等龙头厂商将从周期股转向成长股。关注含英伟达和谷歌新品量占比高的公司，如旭创、新易盛，以及上游光芯片（东山精密、源杰科技）、光器件（天孚通信、聚光科技、水晶光电）等。 光芯片：供给紧缺，出货水平超预期，推荐源杰、东山、永鼎等。 光器件：无源器件受益于通道数增长，关注光库科技、MPO相关公司；CPO明年放量，关注天孚通信、炬光科技。 PCB：AI PCB市场空间从今年的1000亿有望翻倍至明年的2000亿，三季度Rubin和TPU V8出货带动单价提升（谷歌单芯片价值量翻倍至3000元）。mSAP是新增量，今年不到100亿，明年有望达300亿。推荐胜宏科技、生益科技、华正新材等。PCB板块估值已回调至15-20倍，具备配置价值。 光设备：硅光渗透率提升，下半年有望从一半提升至大几十，带动上游设备采购。从硅光到CPO，资本开支预期差大，CPO设备投资远超当前。NPO也需要替换30-40%设备。国内光设备公司 弹性。 4）先进封装， 华为发布“韬定律” ，通过逻辑折叠等技术创新推动芯片性能提升，先 进封装是实践的重要技术环节之一，市场规模稳步增长，且全球芯片大厂积极布局该 领域。 建议关注在先进封装各前沿技术领域前瞻布局的优质厂商， 如在混合键合技术、 玻璃基板材料、光互连封装、 Chiplet技术等领域取得突破的龙头厂商。 5）AI芯片，国产AI芯片市场份额快速提升，由国产芯片、国产框架、国产大模型构 成的完整 AI生态闭环正加速形成。建议关注 AI芯片领域技术创新突破并取得下游客 户认可的国产优质厂商，在国产算力加速建设背景下产品出货需求旺盛有望带来投 资机遇。 6）半导体设备及材料， 半导体各行业优质公司积极筹备上市，存储芯片龙头公司业 绩亮眼，国内晶圆厂加速推动产能扩充建设，有望提振上游半导体设备、零部件及材 料需求，同时部分环节仍有较大国产替代空间。建议关注半导体设备、零部件及材料 领域的优质龙头厂商， 受益于下游扩产及国产替代双重增长动力，产品出货需求旺盛 有望带来投资机遇。 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 4 页 共 8 页 2 市场行情回顾 上周，申万电子行业 跑输沪深300指数和创业板指数 。上周申万电子指数 下跌8.77%， 在31个申万一级行业中排第 30，沪深300指数下跌1.31%，创业板指数 下跌3.93%，申 万电子跑输沪深300指数7.46个百分点 ，跑输创业板指数 4.84个百分点 。 图表 1：申万一级周涨跌幅（ %） 资料来源： iFinD，万联证券研究所 2026年初以来， 申万电子行业跑赢沪深 300指数和创业板指数 。2026年初至2026年8月 2日，沪深300指数下跌0.90%，创业板指数 上涨4.40%，申万电子行业 上涨21.61%，在 31个申万一级行业中排名第 1位，跑赢沪深 300指数22.52个百分点 ，跑赢创业板指数 17.22个百分点 。 图表 2：申万一级年涨跌幅（ %） 资料来源： iFinD，万联证券研究所 申万电子行业估值略高于近年 中枢。从估值情况来看， 截至2026年8月2日，SW电子板 块PE(TTM)为87.09倍，2019年至2026年8月2日SW电子板块 PE(TTM)均值为56.45倍， 行 业估值高于 近年中枢水平。 基于 AI算力加速建设、 半导体产业链景气 上行等趋势利好， 我们认为板块估值仍有上 行空间。 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 5 页 共 8 页 图表 3：申万电子板块估值情况（ 2019年至今） 资料来源： iFinD，万联证券研究所 3 产业动态 3.1 MLCC：产能吃紧叠加原材料涨价， 日韩 MLCC龙头厂商宣布涨价 根据财联社援引 韩国朝鲜日报 报道，三星电机近日已向销售合作伙伴发出通知，自 8 月1日起，MLCC产品出货价格将在现行基础上统一上调 30%。 涨价根源在于 AI带来的高 端MLCC需求飙升。三星电机在通知中表示， “过去几个月以来，全球电子产业出现结 构性需求增长。虽然公司持续提升生产效率并扩大产线规模，但供应链压力已超出可 承受水平。 ” 在这之前， 三星电机已接连获得多个 MLCC供应合同： 7月23日公司宣布， 与一家全球大型企业签署了一份价值 2亿美元的 AI服务器MLCC供应合同，合同期限为 2027年全年； 6月其已与一家全球大型科技公司签署了一份价值约 3亿美元的 AI服务 器MLCC供应合同 ——业内认为，由于 AI服务器用大容量 MLCC供应趋紧，客户正开始提 前锁定长期供货。 另一家MLCC龙头日本太阳诱电同样也已经发出涨价通知。太阳诱电宣布自 9月1日起 出货的MLCC将涨价。涨价理由为原材料及辅料价格急剧上涨，公司“一直在为降低成 本竭尽全力，但仅靠自身努力已难以完全消化成本上升的部分。 ” （来源： 财联社、 韩 国朝鲜日报 ） 3.2 MLCC：日韩 MLCC厂单月出货新高，消费级订单外溢效应显现 根据TrendForce 集邦咨询最新 MLCC产业调查，得益于 AI需求畅旺， 2026年六月Murata （村田） 、 Samsung Electro -Mechanics （SEMCO，三星电机） 、 Taiyo Yuden （太阳诱 电）等三大日韩厂出货同步创下近五年单月新高；其消费级订单 或持续外溢，利好其 他制造商 ，渠道报价皆有上涨。 终端消费电子方面， Apple（苹果）先前上调 MacBook、iPad售价，再次显示品牌提前 反映对后市的成本压力， 第三季传统旺季的效应恐难完全显现， 消费级 MLCC需求维持 温和表现。 反观AI应用，由于 Google（谷歌） TPU、AWS（亚马逊云科技） Trainium 等云端服务供 应商自研 ASIC平台拉货动能不减，高容值、低电压、小尺寸 MLCC需求不减，成为市场 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 6 页 共 8 页 成长亮点，带动日、韩大厂六月出货表现。据 TrendForce 集邦咨询调查， Murata单月 出货冲上 1,400亿颗、SEMCO达980亿颗，Taiyo Yuden 则是达400亿颗，增长态势延续 至七月。 因日韩厂加速将消费级 X5R产能转向 AI用X6S/X7R高端规格，消费级中高容 MLCC（1uF- 22uF）产能受挤压，主流料号的库存水位普遍已低于 30天。在此排挤效应下，渠道、 代理商与 Tier 2/3 客户急单涌现，订单外溢效应持续扩大，其他制造商的接单能见度 明显改善，报价同步走扬。此外，已提前备货的代理商把握机会调高产品价格，平均 涨幅达20-25%， 现货市场更提高价格至原本的二到三倍， 整体消费级 MLCC市场呈现 “终 端需求偏弱、渠道价格偏强”的结构性格局。 （来源： TrendForce 集邦咨询 ） 3.3 存储：三星存储业务 二季度营收超 2025全年，七成产能被 LTA锁定 三星电子在二季度财报电话会议中表示，虽然当前手机与 PC领域受存储涨价影响需 求走弱，但服务器 DRAM、SSD、HBM的新增需求增速远超于此。超大规模数据中心为巩 固AI领先地位加码基建投入，持续提出额外的供货需求，下半年存储需求仍然强劲。 随着智能体 AI普及，通用服务器与 AI服务器的相关需求增长趋势加速。尽管三星正在 努力扩大生产，但需求增长速度更快，预计明年供需缺口将进一步扩大。 2026年第二季度， 三星电子 DRAM bit 出货量环比增长超预期， 上涨 10%-13%，NAND bit 出货量环比增长 1%-3%，符合预期； DRAM平均售价环比增长 44%-46%，NAND平均售价环 比上涨67%-69%。受益于 AI算力需求，三星 DRAM和NAND bit 出货量均创历史新高，服 务器产品占比达最高水平。 HBM产品方面， 三星电子表示， HBM4的客户评估工作已顺 利完成，随着客户下半年扩大产品生产规模，市场需求正在快速增长。目前，公司正 按计划逐步提升产能，以扩大 HBM4的供应。三星电子于电话会议中透露，预计 HBM4今 年三季度销量环比增长逾两倍，下半年销量有望占公司总 HBM销量的60%以上。对于明 年的HBM业务，三星电子表示已敲定 2027年HBM供货协议。 为应对AI存储持续供不应求的局面，三星已启动新的合约体系，计划将 60%-70%的总 产能以LTA形式运营。据介绍，三星正根据“ 5年滚动”方式签署长期供应协议，基本 合同期为五年，并通过年度谈判将合同延长一年。 目前已与全球五大数据中心客户完 成签约， 另有五家大型 AI相关客户处于谈判最后阶段， 预计寻求长期合约的客户数将 持续增加。 为增强合同履行的约束力， 新合同包含预付款条款 （相当于多年期保证金） ， 约占总预付款四分之一的金额已到账， 后续规模随新签约进一步扩大。定价方面则改 变以往模式， 根据不同客户与产品类别差异化定价，并在通用存储合同中设置价格上 限，以降低市场价格剧烈波动带来的投资风险。此外，为及时响应不断增长的客户需 求， 三星电子正准备于今年年底前开始泰勒二期工厂的建设，目标是在 2030年实现量 产。现有的泰勒生产设施正按计划推进今年的投产准备工作，随后逐步增加其 2纳米 制程的产能。三星电子此前宣布已获得各大 CSP以及AI、HPC客户的2纳米制程订单， 预计今年的 2纳米制程订单数量将较去年增长一倍以上。 （来源： CFM闪存市场 ） 3.4 存储：SK海力士单季利润超 2025年全年，存储需求 有望持续 增长 在AI基础设施投资持续扩大及市场需求强劲的背景下， SK海力士2026财年第二季度 表现较好。 营业收入： 79.32万亿韩元（约合 545.3亿美元） ，环比大增 51%，同比增长 257%。净利润： 93.92万亿韩元（约合 645.7亿美元） ，环比增长 133%，同比增长 12.42 倍，净利润率达 118%。本季度净利润的“破纪录”表现，主要得益于主营业务的爆发 与一次性投资收益的叠加：主营业务 方面，面向AI服务器的高性能产品推动价格进一 步上涨，传统存储芯片全线涨价。非营业利润 方面，6月份部分出售铠侠（ Kioxia） 股份，录得约 62.17万亿韩元的非营业利润。这批股份系 2018年通过贝恩资本财团以 仅供内部参考 I服务器的高性能产品推动价格进一步上涨， 传统存储芯片全线涨价。非营业利润方面， 6月份部分出售铠侠 （Kioxia）股份，录得约 62.17万亿韩元的非营业利润。全年需求预测 方面，SK海力士预计2026年全球DRAM bit 需求增速将从 2025年的 17%-19%提升至约 25%。 ⚫ 行业估值 ：从估值情况来看， 截至2026年8月2日，SW电子板块 PE(TTM) 为87.09倍，2019年至2026年8月2日SW电子板块 PE(TTM)均值为 56.45倍，行业估值高于近年中枢水平。 ⚫ 风险因素： 中美科技摩擦加剧； AI应用发展不及预期；国产技术突破 不及预期；下游终端需求不及预期；市场竞争加剧。 [Table_Chart] 行业相对沪深 300指数表现 数据来源： 聚源，万联证券研究所 [Table_ReportList] 相关研究 英特尔CPU供不应求， MLCC产业链景气度上 行 华为昇腾950超节点亮相， “国模国芯国用” 生态有望完善 美光资本开支提速， MLCC龙头厂商订单出货 比创新高 [Table_Authors] 分析师: 夏清莹 执业证书编号： S0270520050001 电话： (0755) 8322 3620 邮箱： xiaqy1@wlzq.com.cn 分析师: 陈达 执业证书编号： S0270524080001 电话： 13122771895 邮箱： chenda@wlzq.com.cn 0%20%40%60%80%100%120%140%160%电子 沪深 300 证 券 研 究 报 告 行 业 跟 踪 报 告 行 业 研 究 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 2 页 共 8 页 $$start$$ 正文目录 1 行业周观点 ................................ ................................ ................................ ....................... 3 2 市场行情回顾 ................................ ................................ ................................ ................... 4 3 产业动态 ................................ ................................ ................................ ........................... 5 3.1 MLCC ：产能吃紧叠加原材料涨价，日韩 MLCC龙头厂商宣布涨价 ............. 5 3.2 MLCC ：日韩 MLCC厂单月出货新高，消费级订单外溢效应显现 ................. 5 3.3 存储：三星存储业务二季度营收超 2025全年，七成产能被 LTA锁定 ......... 6 3.4 存储： SK海力士单季利润超 2025年全年，存储需求有望持续增长 ............ 6 4 风险提示 ................................ ................................ ................................ ........................... 7 图表 1： 申万一级周涨跌幅（ %） ................................ ................................ ................... 4 图表 2： 申万一级年涨跌幅（ %） ................................ ................................ ................... 4 图表 3： 申万电子板块估值情况（ 2019年至今） ................................ ......................... 5 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 3 页 共 8 页 1 行业周观点 村田、三星电机 、太阳诱电三大日韩厂 MLCC出货同步创下近五年单月新高 ，在AI旺盛 需求下， 其消费级订单持续外溢 。三星电机近日已向销售合作伙伴发出通知，自 8月 1日起，MLCC产品出货价格将在现行基础上统一上调 30%，日本太阳诱电同样也已经发 出涨价通知。 存储市场方面，三星电子及 SK海力士业绩表现较好，需求及订单指引仍 较为积极。 我们认为 国产算力建设方兴未艾， 算力产业链中高景气细分赛道如 PCB、 存储、MLCC等需求旺盛，均处于景气扩张周期，亦有望 提振上游设备 、先进封装等 需 求，建议关注 PCB、存储、MLCC、半导体设备及材料、 先进封装 等产业链投资机遇。 中长期视角 ，我们建议把握 AI高景气产业周期和国产突破与扩产带来的投资机遇。 AI 浪潮持续推进，算力建设方兴未艾，算力关键硬件环节需求旺盛，存储、 PCB、MLCC 等正处于景气扩张周期；此外，国产厂商先进技术创新突破，为 AI芯片、先进封装优 质厂商带来发展机遇， 同时成熟领域产能扩充， 有望提振上游半导体设备及材料等环 节需求，带来投资机遇。 1）PCB，AI PCB行业受益于全球算力建设需求，高多层板及 HDI市场需求增速相对较 快，高端 PCB扩产有望提振上游设备及材料需求，材料方面覆铜板供不应求推动产品 涨价，设备方面曝光设备及钻孔设备等细分领域增速更高。建议关注在 HDI、多层板 等高端PCB领域前瞻布局的 PCB龙头厂商，同时主流 PCB厂商加速扩产，有望拉动上游 设备及材料需求，建议关注覆铜板材料、钻孔及曝光设备等领域的龙头厂商。 2）存储， 受益于AI算力建设，存储供应持续偏紧，产品合约价格持续走高，行业整 体盈利能力有望增强， 同时我国存储龙头厂商积极把握行业发展机遇，市场份额跻身 前列。建议关注 DRAM及NAND Flash 领域国产龙头厂商，在存储需求高企、供给偏紧或 导致产品价格维持较高位的背景下，厂商盈利能力持续提升有望带来投资机遇。 3）MLCC，AI算力、 新能源车等需求驱动高端 MLCC需求快速增长， 市场规模稳步提升， 全球龙头厂商已调涨 AI及车规产品价格，行业整体有望步入景气周期。建议关注前瞻 布局高端 MLCC产品的国产龙头厂商，在行业景气回升时有望具备较强盈利修复弹性。 4）先进封装， 华为发布“韬定律” ，通过逻辑折叠等技术创新推动芯片性能提升，先 进封装是实践的重要技术环节之一，市场规模稳步增长，且全球芯片大厂积极布局该 领域。 建议关注在先进封装各前沿技术领域前瞻布局的优质厂商， 如在混合键合技术、 玻璃基板材料、光互连封装、 Chiplet技术等领域取得突破的龙头厂商。 5）AI芯片，国产AI芯片市场份额快速提升，由国产芯片、国产框架、国产大模型构 成的完整 AI生态闭环正加速形成。建议关注 AI芯片领域技术创新突破并取得下游客 户认可的国产优质厂商，在国产算力加速建设背景下产品出货需求旺盛有望带来投 资机遇。 6）半导体设备及材料， 半导体各行业优质公司积极筹备上市，存储芯片龙头公司业 绩亮眼，国内晶圆厂加速推动产能扩充建设，有望提振上游半导体设备、零部件及材 料需求，同时部分环节仍有较大国产替代空间。建议关注半导体设备、零部件及材料 领域的优质龙头厂商， 受益于下游扩产及国产替代双重增长动力，产品出货需求旺盛 有望带来投资机遇。 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 4 页 共 8 页 2 市场行情回顾 上周，申万电子行业 跑输沪深300指数和创业板指数 。上周申万电子指数 下跌8.77%， 在31个申万一级行业中排第 30，沪深300指数下跌1.31%，创业板指数 下跌3.93%，申 万电子跑输沪深300指数7.46个百分点 ，跑输创业板指数 4.84个百分点 。 图表 1：申万一级周涨跌幅（ %） 资料来源： iFinD，万联证券研究所 2026年初以来， 申万电子行业跑赢沪深 300指数和创业板指数 。2026年初至2026年8月 2日，沪深300指数下跌0.90%，创业板指数 上涨4.40%，申万电子行业 上涨21.61%，在 31个申万一级行业中排名第 1位，跑赢沪深 300指数22.52个百分点 ，跑赢创业板指数 17.22个百分点 。 图表 2：申万一级年涨跌幅（ %） 资料来源： iFinD，万联证券研究所 申万电子行业估值略高于近年 中枢。从估值情况来看， 截至2026年8月2日，SW电子板 块PE(TTM)为87.09倍，2019年至2026年8月2日SW电子板块 PE(TTM)均值为56.45倍， 行 业估值高于 近年中枢水平。 基于 AI算力加速建设、 半导体产业链景气 上行等趋势利好， 我们认为板块估值仍有上 行空间。 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 5 页 共 M业务，三星电子表示已敲定 2027年HBM供货协议。 为应对AI存储持续供不应求的局面，三星已启动新的合约体系，计划将 60%-70%的总 产能以LTA形式运营。据介绍，三星正根据“ 5年滚动”方式签署长期供应协议，基本 合同期为五年，并通过年度谈判将合同延长一年。 目前已与全球五大数据中心客户完 成签约， 另有五家大型 AI相关客户处于谈判最后阶段， 预计寻求长期合约的客户数将 持续增加。 为增强合同履行的约束力， 新合同包含预付款条款 （相当于多年期保证金） ， 约占总预付款四分之一的金额已到账， 后续规模随新签约进一步扩大。定价方面则改 变以往模式， 根据不同客户与产品类别差异化定价，并在通用存储合同中设置价格上 限，以降低市场价格剧烈波动带来的投资风险。此外，为及时响应不断增长的客户需 求， 三星电子正准备于今年年底前开始泰勒二期工厂的建设，目标是在 2030年实现量 产。现有的泰勒生产设施正按计划推进今年的投产准备工作，随后逐步增加其 2纳米 制程的产能。三星电子此前宣布已获得各大 CSP以及AI、HPC客户的2纳米制程订单， 预计今年的 2纳米制程订单数量将较去年增长一倍以上。 （来源： CFM闪存市场 ） 3.4 存储：SK海力士单季利润超 2025年全年，存储需求 有望持续 增长 在AI基础设施投资持续扩大及市场需求强劲的背景下， SK海力士2026财年第二季度 表现较好。 营业收入： 79.32万亿韩元（约合 545.3亿美元） ，环比大增 51%，同比增长 257%。净利润： 93.92万亿韩元（约合 645.7亿美元） ，环比增长 133%，同比增长 12.42 倍，净利润率达 118%。本季度净利润的“破纪录”表现，主要得益于主营业务的爆发 与一次性投资收益的叠加：主营业务 方面，面向AI服务器的高性能产品推动价格进一 步上涨，传统存储芯片全线涨价。非营业利润 方面，6月份部分出售铠侠（ Kioxia） 股份，录得约 62.17万亿韩元的非营业利润。这批股份系 2018年通过贝恩资本财团以 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 7 页 共 8 页 约4万亿韩元收购，此次出售大幅增厚了当期利润，使得税前利润达到 122.71万亿韩 元。 业务亮点 系HBM4量产，高端产品全面开花 。DRAM业务（营收占比 73%，约57.9万亿韩 元） ：bit出货量环比增长约 7%-9%，ASP（平均售价）环比上涨约 30%。HBM4已于第二 季度量产出货，并将于下半年全面扩大产能；下一代 HBM4E样品也已交付。此外，基 于1c nm工艺的SOCAMM2产品全面开始供应。 NAND业务（营收占比 27%，约21.4万亿韩 元） ：bit出货量环比增长约 15%，ASP环比上涨约 55%。321层产品已成为 NAND产量占比 最高的产品， SK海力士计划年底前将其在韩国本土的产能占比提升至约 50%。 战略布局 方面，SK海力士锁定长期订单，坚持设备投资原则 。随着AI向“代理式人工 智能（Agentic AI ） ”演进，存储器需求正呈现 AI存储与通用存储同步增长的结构性 变化。随着头部科技公司不断扩大 AI基础设施投资，存储器追加需求也持续涌现。此 类投资是基于 AI服务所创造的收益，因此存储器需求增长趋势有望持续。 为保障中长 期供应稳定， SK海力士采取了以下战略：推进长期协议（ LTA） ：已与约 10家核心客户 完成长期供应协议谈判， 并继续与业内主要客户洽谈。 通过差异化定价和定金等财务 机制，平抑价格波动，增强需求可见性。产能扩张与资本开支：提前推进清州 M15X量 产，并为 2027年初龙仁集群首座工厂扩产做准备。同时，先进封装工厂 P&T7、NAND基 地M17等项目将分阶段实施。预计 2026年全年资本支出将达到 40万亿韩元 （约合 275亿 美元）的高位区间，坚持设备投资原则，实现产能扩张与财务稳健的协同发展。 市场展望方面， 三季度出货指引 ，DRAM bit 出货量预计环比增长约 10%（以服务器 AI 存储产品为核心） ； NAND bit 出货量（含 Solidigm ）预计环比低个位数增长（ 1%-3%）， 主推321层产品与企业级 SSD。全年需求预测：在供应受限的背景下需求依然强劲。预 计2026年全球DRAM bit 需求增速将从 2025年的17%-19%提升至约 25%；全球NAND bit 需求增速将从 15%提升至17%-19%。 随着供应限制的缓解， 潜在需求将进一步释放。 （来 源：CFM闪存市场） 4 风险提示 中美科技摩擦加剧； AI应用发展不及预期；国产技术突破不及预期；下游终 饮料和公用事业。", "content": "观点来源 核心观点 建议关注 申万宏源 AI产业链大波段上涨重启仍需要时间，未来一段时间继续重视非科技方向轮动的投资机会。 （1）市场总体调整空间已有限(行稳致远政策再发力是应有之义)，科技休整仍需时间，这个组合下高股息资产(中证800权重–26Q2公募基金持仓权重)可能成为率先回归中期强势状态的非科技资产，重点关注银行、非银、食品饮料和公用事业。基于基本面亮点选择非科技方向，关注医药生物、工业金属和基础化工的投资机会。（2）大波段行情延续，大概率还是科技领涨，但行情会自然更百花齐放：科技内部会更百花齐放，国内AI链机会同样丰富。 中信建投 定价逻辑正重新转向基本面，有望开启修复行情。 AI算力、半导体设备、有色、新能源、机械等。 华泰证券 配置上沿再平衡线索展开。 当前强结构行情波动率放大，红利仍是配置底仓，可关注银行、公用事业等现金流与股息确定性较强的方向。其次，科技是反弹的主要弹性来源，但不宜重新回到无差别扩散，应从高拥挤、高估值品种收敛至中报订单和现金流可验证的半导体设备材料等。此外，非主线中，可沿中报改善关注调整较久且存在成交修复的券商、具备产品兑现的创新药。 方正证券 保持耐心，市场有望迎来普涨修复行情，继续关注三方面配置机会，一是布局科技股超跌反弹，二是关注HALO资产逢低布局的机会，三是继续看好调整时间较久，负面压制基本解除，并且有一定催化的非银金融。 （1）调整后重点关注海外算力核心标的以及国产算力中景气确定性较强的半导体设备，相对低位的AI应用以及恒生科技也具有一定的配置价值；（2）除了核心资源相关的有色金属+化工之外，超跌的新旧能源，包括电网与电力设备、煤炭石化等，调整幅度较大且股息率优势明显的中证红利具有较好配置价值；（3）非银金融。 国信证券 牛市格局不变，当前是布局再平衡窗口期。 结构上，除了红利外，一是重视具有基本面优势的医药、券商，以及处在低位的地产、白酒等内需板块；二是科技行情或尚未结束、目前AI景气预期尚未扭转，历史上高景气行业往往呈现\"M顶\"、下跌后次高点通常仍可达绝对高点的八九成附近，同时科技内部有望向低位方向扩散，可关注AI应用环节、港股科技等。 财信证券 预计A股市场仍需一定时间来横盘震荡整理，以完成筹码结构的充分换手，并确立市场新主线方向。静待市场走出右侧后，再加大布局。方向来看，随着AI硬件资金盘松动，预计下一轮做多窗口期，市场风格将更为均衡，AI硬件、泛科技、消费医药等领域或都有一定机会。 （1）“泛科技”方向，例如AI应用、国防军工、人形机器人等；（2）消费医药方向，例如服务消费、部分农产品、创新药领域；（3）防守的高股息方向，例如银行、煤炭、交通运输、公用事业；（4）AI硬件的龙头标的，例如光模块、PCB、存储的核心标的，受益于扩产逻辑的半导体设备及材料。 国金证券 青黄不接，积极防御。 第一，能源价格低位逐步确定，受益于中国制造业流量的（煤炭+电力）是较好的绝对收益组合，石油石化板块在能源价格底部确定下盈利估值修复。第二，南方国家与中国制造仍在高实际利率压制的徘徊期，底部或已出现，关注工业金属、工程机械、电网设备、炼化等方向。第三，红利风格受益于绝对收益者的切换，在AI链去杠杆未结束、市场波动加剧的背景下，高股息+低波动+稳定现金流的红利资产将成为绝对收益资金的配置回流方向。 天风证券 赛点2.0第三阶段攻坚不易，波折难免，重视AI产业趋势。 1）AI产业革命带来的算力、存力、电力及应用的科技主线机会，2）内外共振，经济逐步修复，牛市主线风格“强者恒强”，但周期后半段易有所表现，3）赔率思维，即考虑风格轮动、底部反转的可能性。连续三年跑输但第四年跑赢概率较大的行业有食品饮料、农林牧渔、社会服务、医药生物。 平安证券 建议仍以相对均衡的配置来应对潜在波动。 一是AI产业链仍是当前最具景气确定性的方向，也是中长期政策支持的新质生产力重要领域，待短期资金面回稳、产业远期景气得到确认后，AI仍是中期配置主线（国产算力、光模块、存储、PCB、半导体设备材料等）；二是关注业绩韧性且当前估值相对吸引的非科技板块轮动修复机会，如消费、资源品（有色、化工等）、锂电、非银、医药等；三是低波、高股息的红利资产仍具备较好底仓价值（银行、煤炭、电力等）。 日期：2026年8月2日", "status": "extracted"}, "attachment:files/MS-美股策略｜北美 每周前瞻：从周期早期迈向周期中期 US Equity Strategy  North America Weekly Warm-up From Early Cycle to Mid Cycle.pdf": {"id": "attachment:files/MS-美股策略｜北美 每周前瞻：从周期早期迈向周期中期 US Equity Strategy  North America Weekly Warm-up From Early Cycle to Mid Cycle.pdf", "kind": "attachment", "title": "MS-美股策略｜北美 每周前瞻：从周期早期迈向周期中期 US Equity Strategy  North America Weekly Warm-up From Early Cycle to Mid Cycle", "source_label": "MS", "excerpt": "", "content": "", "status": "failed"}, "post:2026-08-05T23-09:c320d3691155": {"id": "post:2026-08-05T23-09:c320d3691155", "kind": "post", "title": "2026-08-05 23:09", "source_label": "帖子正文", "excerpt": "再谈海外的云服务与国内的算力租赁映射关系 之前压在云上面的一座大山是，云厂商是 AI 时代出钱修路的人，最后却可能只变成闭源模型的基础设施供应商。云厂商投入巨额资本购买 GPU、建设数据中心，但如果绝大部分任务都必须调用少数几家闭源模型，那么模型厂商掌握需求入口和定价权，云厂商承担重资产投入，增量利", "content": "再谈海外的云服务与国内的算力租赁映射关系 之前压在云上面的一座大山是，云厂商是 AI 时代出钱修路的人，最后却可能只变成闭源模型的基础设施供应商。 云厂商投入巨额资本购买 GPU、建设数据中心，但如果绝大部分任务都必须调用少数几家闭源模型，那么模型厂商掌握需求入口和定价权，云厂商承担重资产投入，增量利润却可能被模型层拿走。 现在这个格局开始变化。 开源模型越来越强、越来越便宜，虽然最强闭源模型在复杂推理和高价值任务上仍有溢价，但它已经没有必要成为所有任务的默认选择。 未来的 AI 调用会从 “ 一个模型解决所有问题”，转向分层路由：最难的任务调用最强模型，普通任务调用便宜的小模型或开放模型，稳定的大规模工作负载由云厂商自行部署，并通过自研 ASIC 芯片进一步降低推理成本。 这对云厂商的意义很大。 模型之间越可替代，云厂商越能掌握路由权、客户入口和定价权。 过去闭源模型是云上游的收费站；未来模型更像云平台可以自由调度的一种计算资源。 云厂商既可以出租 GPU，也可以在自有基础设施上托管开放模型、销售 Token，从而减少向外部模型厂商让渡的利润。 云的逻辑变好，对上...", "publish_time": "2026-08-05 23:09", "tags": ["文字观点"]}, "attachment:files/从开源模型崛起讨论模型与云厂商.docx": {"id": "attachment:files/从开源模型崛起讨论模型与云厂商.docx", "kind": "attachment", "title": "从开源模型崛起讨论模型与云厂商", "source_label": "其他", "excerpt": "重新回流到云厂，具体来看，云厂当前的AI收入主要来自IaaS和MaaS。具体而言，一方面，如果闭源模型厂商陷入价格战，确实可能将利润端的压力传导到云厂。", "content": "重新回流到云厂，具体来看，云厂当前的AI收入主要来自IaaS和MaaS。具体而言，一方面，如果闭源模型厂商陷入价格战，确实可能将利润端的压力传导到云厂。但另一方面，在MaaS层，开源模型可能给云厂带来更高的利润率水平，因此云厂未来可能更倾向于部署开源模型，推动自己的MaaS业务，实现较高的利润率。未来也可能更多通过MaaS加开源模型的模式来改善自己的利润结构。 另一方面，经过测算，整个折旧的传导是很慢的。以谷歌为例，其资本开支可能在当年有90%先转为在建工程，到第二年才正式开始产生折旧。因此，以26年Q2为例，谷歌的云收入增速超过80%，但整个公司的折旧增速只有40%左右。这说明折旧的传导周期相对靠后。另外，MaaS业务本身也有非常好的利润率水平，例如亚马逊的MaaS业务，其operating margin可能达到50%以上。这两个因素使得市场可能低估了这些云厂未来的现金流表现，而高估了资金缺口。因此，从这个角度看，无论是从开源模型还是从利润率趋势来看，云厂都是当前相对较好的选择。 当然，这里也需要提示，如果从更远期的角度看，最关键的问题在于需要新的场景和模型能力的持续突破，才能有继续向上的趋势。背后的核心原因在于，即使前面提到的两个点都很重要，但模型能力的继续突破和新的场景的涌现才是关键。例如，在目前没有新场景的情况下，能力继续突破可能演变成当前局面，大家认为开源模型已经足够；而如果模型能力不突破，市场可能就到此为止了。因此，这才是更核心的因素，也是最终需要关注的点。这是本报告的核心结论。 接下来，详细拆解一下资本开支情况。大家知道，今年以四家巨头为例，他们可能今年有8000亿的资本开支，明年可能达到1.2万亿的规模。国内也在今年有明显加速。这确实意味着，大家在今年都迎来了现金流上的一个考核。测算下来，大家的现金流与资本开支的比例可能都在100%甚至超100%的临界点。之前也计算过净债务比EBITDA这个比例，它是反映现金流覆盖和信用承受程度的核心指标。如果该数值超过1.24，可能意味着整体债务评级有下降风险。这是一个参考指标。可以看到，像海外的一些公司如Oracle这种比较激进的，已经达到非常高的位置。 国内举个例子，阿里在24年以前净债务比EBITDA还是负值，意味着现金好于债务水平。但到24年以后，这个数字转正并一直在往上走。这些因素也是当前的核心关键点，包括已经看到这些公司开始进行一些融资。 像谷歌，25年到今年年中已经累计融资超过1600亿，规模较大。那么，为什么国产模型现在到了这样一个拐点？一方面，能力上达到了一个临界点；另一方面，ARR也是国产模型从Q2开始真正加速的一个阶段。 背后的核心原因在于，海外ARR整体拐点发生在二月份Opus 4.6的发布，之后整个SaaS的ARR进入爆发期。从性能角度看，国产模型大概在四月份左右达到了Opus 4.6的水平。因此，在此之后，国产模型真正进入了ARR加速期。从现阶段来看，四月份之后，包括GLM5.2、Kimi K3、千问3.8等模型，都达到了在现有许多工作场景中能以低成本实现与海外模型同样任务的效果。 另外，可以看到，在OpenRouter这个价格敏感平台上，国产模型的token占用量很高，但成本支出占比可能不到20%，形成了明显差异。在定价上，国产模型基本上是海外模型的10%左右，尤其是与Opus 5比较，差异很明显。另一个维度，国内的AI Labs等公司在今年5到7月完成了新一轮融资，融资体量较大，这些资金将支持他们进一步推动模型训练和推理。 大致做了一个测算，这个测算可能比较粗糙，但可以提供一些参考。思路是，从25年到今年年终大概一年半时间，这五家公司累计融资了1500亿人民币。假设这笔钱足够支撑他们用到明年年中，即从现在开始往后一年时间，那1500亿的资金大概支撑他们使用了两年半，从25年到27年中，共30个月。假设使用是线性增加的过程，那么27年6月是单月支出的高峰。在那个时间点，按照线性增加的趋势测算，27年6月支出大概是50亿到100亿左右。假设其中一半做训练、一半做推理，那么有50亿支撑推理。假设这些公司平均毛利率40%，通过50亿推理支出反算，27年6月收入端接近90亿。这个收入对应ARR大概一千多亿。这是一个相对粗糙的假设，但可以大致测算出，这些公司到27年6月可能拥有超过1000亿人民币的ARR。因此，最近这一轮融资对他们非常关键，无论是训练大参数模型还是支撑后续推理需求都很重要。可以看到，各家到25年融资都在300亿左右，但最主要的是最近这一轮，包括阶跃、智谱等，智谱最近配售约70亿，后面还要在A股上市进一步融资。因此，这些国产模型公司的算力采购规模接下来还会加速释放。 从这个角度可以看出，无论是从性能还是资金储备上，国产模型都到了爆发的拐点。接下来进一步围绕这个事情进行测算，看一下国产开源模型崛起后会带来哪些影响。首先，这个测算相对复杂。 解释一下测算逻辑：将云厂和模型厂商放在一个模型里。以GB200和Opus 5为例，一G瓦的GB200数据中心目前资本开支约400亿美元，一年的收入体量约200多亿美元。具体而言，一G瓦数据中心对应四十多万张GB200，按租赁价格计算，一年租赁收入约200亿美元。这是云厂的商业模式，其operating margin可能在45%左右。进一步传导到模型厂，刚才说的200亿云厂收入就是模型厂的成本，即一G瓦数据中心在模型厂角度，算力支出是200亿。进一步假设推理和训练的分配：海外推理进展较快，训推比已接近6:4，边际上假设为5:5，未来训练和推理可能1:1分配。这样，200亿算力成本中有100亿用于推理，这是成本端。要算毛利率，还需要收入端。收入端通过TPS计算，即每个GPU每秒产生的token。可以算出一年能产生多少token，再乘以token均价，得到一G瓦数据中心一年带来的收入。这是测算逻辑。知道收入和成本后，可以算出毛利率和operating margin。这里最核心的变量是TPS，它影响后续的毛利率和经营利润率，所以对这个环节做了一些拆解。公式可能比较复杂，感兴趣可以后面详细看。 详细说一下测算逻辑。首先假设一个最基本的推理单元，其中有N张卡。这些卡的内存主要用于三个用途：模型权重、KV Cache、冗余。假设比例约为6:3:1，即60%内存用于模型，30%用于上下文栈的KV Cache，10%作冗余。按照这个比例，可以算出最小推理单元需要多少张卡。举例：如果模型占用内存空间为6G，那么最小推理单元对应的内存大小需要10G。知道模型参数及其占用的内存空间后，可以算出最小推理单元需要的卡数。在这个基础上，进行下一步假设：最小推理单元同时能处理多少个请求（即batch）。通过KV Cache上限计算，例如一条请求上下文占KV Cache10G，剩余100G空间则只能同时处理10条请求。这样可以通过KV Cache容纳的请求数算出并发。然后形成一个基础案例：在一个推理单元上，同时有多个并发请求进行推理，从而算出模型在推理过程中每秒产生的token数。因为知道模型参数、请求数、卡数，可以算出模型在一张卡上每小时处理的token数量。这个思路比较复杂，涉及较多公式，感兴趣可以详细看报告内容。这里只说明思路，然后给出计算结果。 以Opus 5在GB200上推理为例，其TPS约为2000，即每秒处理2000个token。Opus 5的混合价格约为3.9美元。由此可以算出，1G瓦数据中心用Opus 5进行推理，一年约产生500亿美元收入。毛利率接近80%，考虑训练成本和其他运营成本后，operating margin约为37%。这样就形成了一个基础的数据中心加模型厂的商业化闭环。 接下来进入后续模型问题的讨论。第一个问题：价格战如何影响他们？主要讨论IaaS部分。价格战发生后，闭源模型厂商首先降价，进一步传导到毛利率。表中第二列和第三列展示了降价20%和降价50%的情况。正常情况下，模型厂毛利率为79%。降价20%时，毛利率下降6个百分点；降价50%时，毛利率下降约20多个百分点。考虑到成本刚性，Oper margin从37%降至27%，再降至亏损。因此，降价50%对模型厂影响较大。进一步考虑，模型厂不会全部承担价格战风险，可能将部分成本压力让渡给云厂。假设模型厂要维持65%毛利或10%的Oper margin，那么云厂的毛利率会下降约4个百分点，Oper margin下降约12个百分点，影响也较大。所以从IaaS角度看，如果发生价格战，云厂的margin端会受损。 但是，可以看另一个点，即MaaS业务的角度。最近很多人做过拆解，例子比较清晰。以开源模型GRM5.2为例进行测算。首先，如果单纯跑闭源模型，海外模型的margin还不错，因为Claude本身定价有溢价。但有一个重要因素：云厂在部署闭源模型时需要支付一笔分成费用。测算下来，如果分成比例在40%，云厂MaaS的Oper margin可能被压到43%；如果分成比例在20%，Oper margin约为63%。而开源模型部署后的Oper margin约为67%。因此，即使在20%到40%的分成区间，开源模型都会带来更好的margin。所以，开源模型的崛起对云厂是比较利好的，能够改善其MaaS业务的ROI。这是这里得到的一个重要结论。 另外，还做了一些其他测算。例如芯片升级带来的影响。同样的模型，用H100、GB200和Rubin计算，可以看到毛利率明显提升。国产方面，用950和910C比较，毛利率也是提升的。这个结论逻辑简单，用数据可以证明。 这里还想说一个模型层面的结论，计算后发现一个有意思的点。第一个结论：模型参数量越大，单卡TPS越小。因为参数量大，计算和内存读取都会变慢。芯片性能越强，单卡TPS越大。这两个结论很好理解。第二个结论：影响模型成本和定价的重要原因是模型自身的参数量和注意力机制的选择。以GLM-5.2和Opus 5为例，Opus 5参数量约5T，GLM-5.2约7000亿，参数量的差异与价格差异接近。但它们的毛利率存在差异：海外Anthropic有70%毛利，而国内GLM-5.2只有40%。原因来自模型层面，包括参数量和注意力机制选择。参数量已提及。注意力机制方面，DeepSeek价格便宜是因为其上下文占用的KV Cache非常小，与注意力机制的设计有关。如何让相同上下文占更小的KV Cache，意味着同样一组卡并发可以很高，利用率高，单位请求成本低，因此定价可以很低。这是模型层面的原因。 前面从参数量比较，GLM-5.2和Opus 5的参数差异与价格差异接近，但最终毛利率差异的重要原因来自infra能力的区别。有两个点：一是国产卡和国内硬件整体基础设施利用率比海外低；二是推理中模型和硬件支持的精度不够低。例如，用FP8和FP16做推理，精度差一倍，同样token占字节数差一倍，区别很大。GLM-5.2支持FP16和FP8，但多数可能还是FP16；很多国产卡声称支持FP8或FP4，但实际使用时不支持。这些导致推理无法做到低精度，计算量差距与别人差一倍，影响很大。另外，利用率也不够高。在假设下，GLM-5.2在910C上推理利用率可能只有30%，而Opus 5在GB200上推理利用率可能达60%。最终导致前者毛利率只有百分之四五十，后者有百分之七八十。这是从模型推理毛利率角度看到的模型层面和硬件层面的关键原因。 这是关于云厂和模型厂商业模式的拆解。接下来分享最近对谷歌和亚马逊收入结构拆解的核心结论。这两家公司在AI收入上有一些区别。以谷歌为例，27年比26年收入增长约1000亿，其中可能只有150亿来自传统云，850亿来自AI云。AI云部分中，有500多亿来自IaaS层，尤其是TPU，TPU可能贡献近500亿。拆解结构，TPU租赁明年能贡献近300亿，TPU外售贡献约250亿。因此，谷歌的结构中，TPU是收入增长的重要原因，也是今年以来收入加速到80%多的核心原因。看margin变化，公司关于二、三季度有指引，短期来看，三季度margin可能受算力租赁因素影响，因为谷歌租用了SX数据中心且溢价较高。但如果不考虑这些因素，剩余部分对利润率有明显支撑。测算中，假设算力租赁对GPU租赁影响10个点的毛利率并维持，那么今年和明年的margin可能维持在35%左右，不会有明显波动。 第二点，关于折旧影响为何不大或滞后。测算发现，当前现象是收入增速80%，折旧增速仅40%。从结构看，谷歌每年资本开支中90%转为在建工程，第二年才开始折旧，这首先导致滞后。其次，AI相关资本开支分为服务器（六成，折旧周期6年）和机房（四成，折旧周期20年），平均约9年折旧周期，比通常粗算的要久。因此，折旧真正峰值可能在明年，届时折旧增速可能达70%以上，但测算显示明年收入增速仍在90%以上，所以折旧对margin的影响在明年可能还不明显。真正可能看到影响是在28年，如果AI需求没有新场景，收入增速可能下降，那时可能面临margin压力，可能发生在28-29年。因此，折旧影响比大家想的更滞后，折旧比较平滑，只要有明显的需求增长，收入端能很快兑现，收入和capex是同步关系。 关于亚马逊，也做了拆分。亚马逊27年对26年收入增长约七八百亿，其中传统云贡献约300亿，AI云贡献500亿。AI云的结构与谷歌不同，500亿中可能300亿来自MaaS。从今年一二季度已经有所体现，Claude正在快速带动亚马逊云收入增长，并改善其margin。这里的假设相对保守，给了40%的Oper margin，而SemiAnalysis的分析中Bedrock的Oper margin超过50%，核心原因是收入确认采用净额法（扣除分成后作为收入）。即使如此，收入增长幅度仍很夸张。这里关于MaaS的增长做了保守测算，按照今年底ARR 300亿，明年底翻倍。但实际上，如果只考虑Claude的贡献，市场对明年ARR的预期可能是三倍增长。因此，亚马逊明年的收入可能比测算的更高。这是对两家公司分析的核心结论。总结：折旧传导比大家想的慢，MaaS本身的好利润率可能推动云厂利润率向上。因此，市场可能低估了这些云厂未来的现金流表现，高估了现金流缺口。现阶段而言，云厂是相对较好的选择。但回到开头，从更远期看，需要新的场景和模型能力的持续突破，才能看到叙事向更长期发展。以上是报告的主要内容，关于测算部分可能讲得不够清晰。 总结： 本文从开源模型崛起切入，系统分析了云厂与模型厂商的商业化格局，重点讨论了资本开支、折旧传导、MaaS利润率、模型推理成本及收入结构等关键问题，主要结论如下： 云厂收入结构：当前云厂AI收入主要来自IaaS和MaaS。闭源模型价格战会通过IaaS将利润压力传导至云厂，但开源模型在MaaS层能提供更高利润率（如GRM5.2部署后Oper margin约67%，优于闭源模型在分成后的43%-63%），因此云厂未来更倾向部署开源模型以改善利润结构。 折旧传导滞后：折旧对云厂利润的影响比市场预期更慢。以谷歌为例，其资本开支90%先转为在建工程，且折旧周期较长（服务器6年、机房20年，平均约9年），导致折旧增速远低于收入增速。即使明年折旧增速可能达70%，但若收入增速仍维持在90%以上，折旧对margin的冲击仍不明显，真正的压力可能要等到28-29年需求放缓时才会显现。 MaaS业务盈利能力：MaaS本身利润率较高，如亚马逊Bedrock的Oper margin在净额法下可达50%以上。开源模型无分成费用，进一步提升了云厂MaaS业务的ROI，有助于改善整体利润率。 模型推理成本关键因素：模型参数量、注意力机制选择及硬件infra能力共同决定推理成本。参数量越大，单卡TPS越小；注意力机制影响KV Cache占用，进而影响并发与成本；国产模型在硬件利用率（如GLM-5.2在910C上利用率仅30%）和推理精度（多停留在FP16，而海外已用FP8）方面存在差距，导致毛利率显著低于海外（约40% vs 70%）。芯片升级（如从H100到GB200）能有效提升毛利率。 国产模型爆发拐点：国产模型性能在四月份已达到Opus 4.6水平，叠加近期大规模融资（五家公司累计约1500亿），预计到2027年6月ARR将超过1000亿人民币，进入加速增长期。算力采购规模也将进一步释放。 谷歌与亚马逊对比：谷歌AI收入增长主要依赖TPU（IaaS层），亚马逊则依靠Claude带动的MaaS业务。两家公司均受益于折旧滞后和MaaS高利润率，市场可能低估其未来现金流，而高估资金缺口，当前云厂是较优选择。 远期风险：长期来看，行业持续增长取决于模型能力能否继续突破以及新的应用场景能否涌现。若缺乏新场景，开源模型可能被视为足够，增长将受限；若模型能力停滞，市场可能触顶。因此，技术和场景创新是核心变量。", "status": "extracted"}, "post:2026-08-05T08-35:637729d29cf8": {"id": "post:2026-08-05T08-35:637729d29cf8", "kind": "post", "title": "2026-08-05 08:35", "source_label": "帖子正文", "excerpt": "蓝晓科技 #超纯水主要用于晶圆生产过程，日常消耗量较大。根据国际半导体协会数据，300mm晶圆制造设备每天使用约4000万升超纯水，主要用于湿化学处理，包括晶圆清洗、湿法刻蚀、CMP等过程。", "content": "蓝晓科技 #超纯水主要用于晶圆生产过程，日常消耗量较大。根据国际半导体协会数据，300mm晶圆制造设备每天使用约4000万升超纯水，主要用于湿化学处理，包括晶圆清洗、湿法刻蚀、CMP等过程。 #超纯水树脂供应以国外企业为主，国内高端产能有限。受制于行业技术水平及技术积累，我国在核电、半导体、面板等领域使用的树脂扔以海外供应商为主，包括陶氏、三菱、漂莱特等。国内仅蓝晓科技、争光股份等少数公司拥有相关产能和技术。 #公司拥有先进技术及产能、完成国内主流客户的认证、有望受益于半导体行业扩产。公司是国内少数能够稳定供应均粒超纯水树脂的企业，目前产品已经通过国内领先的存储芯片制造商供应企业验证。长鑫科技等国内领先存储厂商进行产能扩建，高额的资本开支有望带动超纯水树脂需求总量的增长，或将带动公司该业务板块成长。 风险提示：下游扩产不及预期风险，行业竞争加剧风险，产能建设不及预期风险#文字观点", "publish_time": "2026-08-05 08:35", "tags": ["文字观点"]}, "post:2026-08-05T23-03:f4dabd127d14": {"id": "post:2026-08-05T23-03:f4dabd127d14", "kind": "post", "title": "2026-08-05 23:03", "source_label": "帖子正文", "excerpt": "【国金通信 | 光通信】光通信板块调整后再迎抢筹，当前位置重点Call旭创 源杰 新易盛 - 260805 1️⃣#历史天量成交，资金抢筹信号明显。旭创今日出现上市以来最大成交量，承接力度较强。", "content": "【国金通信 | 光通信】光通信板块调整后再迎抢筹，当前位置重点Call旭创 源杰 新易盛 - 260805 1️⃣#历史天量成交，资金抢筹信号明显。旭创今日出现上市以来最大成交量，承接力度较强。开盘迅速拉升意味着经历关税战学习曲线后，市场迅速将此次利空进行终局反映，也意味着市场解读此次影响有限。在基本面没有明显变化的情况下，当前位置更应关注资金回流带来的修复机会。 2️⃣#若回落至万亿市值以下，安全边际将重新凸显。经过近期调整，市场对短期扩产、产品切换等担忧已得到较充分反映。考虑800G、1.6T需求持续增长及公司在核心客户中的份额优势，当前位置向下空间有限，赔率明显改善。 3️⃣ #NPO仍是英伟达架构的重要过渡形态，未来两年难以被替代。未来两年NPO仍将占据重要位置，旭创凭借客户、技术和量产能力有望持续受益。 4️⃣#北美扩产不达预期，反而强化头部厂商稀缺性。市场此前担忧北美本土扩产导致竞争加剧，但从实际推进情况看，海外产能建设、供应链配套及良率爬坡均低于预期。高端光模块产能短期仍集中于少数头部厂商，旭创的交付能力、客户认证和规模优势难以复制，份额及盈利能力仍具支撑。 #...", "publish_time": "2026-08-05 23:03", "tags": ["文字观点"]}, "attachment:files/大摩：美国光模块新政策解读.pdf": {"id": "attachment:files/大摩：美国光模块新政策解读.pdf", "kind": "attachment", "title": "大摩：美国光模块新政策解读", "source_label": "其他", "excerpt": "M Update Telecom & Networking Equipment | North America Optical: Impact of Potential China Ban Reports Morgan Stanley & Co. LLC Meta A Marshall Equity Analyst Meta.Marshall@morgans", "content": "M Update Telecom & Networking Equipment | North America Optical: Impact of Potential China Ban Reports Morgan Stanley & Co. LLC Meta A Marshall Equity Analyst Meta.Marshall@morganstanley.com +1 212 761-0430 Antonio Jaramillo Research Associate Antonio.Jaramillo@morganstanley.com +1 212 761-4438 Telecom & Networking Equipment North America Industry View In-Line Industry model available upon request What Happened? Reuters reported this morning (via Reuters and Yahoo ) that the Trump administration and FCC are preparing restrictions on new Chinese data center components, with optical transceivers specifically being mentioned. No formal rule has been published, but it was noted that a rule could go into effect this year. Any action appears more likely to restrict future product approvals than installed equipment, with scope across Chinese components and non-Chinese modules still unclear. The White House and FCC did not formally comment. The Chinese embassy in the US voiced objections to the reported proposal. Thoughts. Read-through is positive for non-Chinese optical suppliers, but capacity and qualification timelines limit an immediate share shift. Innolight and Eoptolink represent ~50% of the transceiver market, leaving COHR as the clearest scaled beneficiary given its vertical integration, with AAOI and FN (both NC) also positioned to absorb incremental demand. LITE has less direct transceiver exposure but should benefit from tighter EML supply lasting longer, partly offset by potential Chinese restrictions on InP substrates. CIEN and GLW have limited upside given CIEN does not really compete in the data center (as has been trying to qualify a more diverse set of suppliers) and there is not a lot of Chinese fiber in US data centers already (in the case of GLW). Is it even feasible? We do not think there is currently enough supply from non Chinese firms to meet AI capex needs. However, we would also note that the CEO's of both LITE and COHR have publicly advocated for such approaches, noting multiple times in interviews that it isn't fair that US generally don't supply to the Chinese cloud builders, but the Chinese vendors supply into the US. We would note that there has been a thought by most clouds that this could happen over the last couple of years, so they have at least qualified in many cases additional suppliers, even if those suppliers couldn't meet demand today. The biggest concern we would have would be that InP supply comes from firms like AXTI out of China (e.g. LITE announced a new supply agreement last week, COHR CEO had traveled on the Trump China trip a couple of months back). In order to meet elevated demand, Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report.Key Takeaways View news reports as a positive for US optical component supply chain, particularly COHR. While LITE supplies lasers to a variety of optical module makers across the world, benefits from reduced chance of Chinese suppliers loosening supply tightness. Challenging to execute given how tight supply is and need of InP substrate from China, but will unwind concern people had around margin ceilings in near term. August 4, 2026 02:52 PM GMT M Update 2Exhibit 1 :Approximate Transceiver Shares From Our Insight in March Source: Morgan Stanley Research. Forecast of Transceiver Exhibit 2 : Space ability to have access to InP substrate will be important. We would also note that a potential resolution could also involve some agreement by Chinese clouds to buy US componentry Source: Morgan Stanley Research. Ô´Í·ÐÅÏ¢¼ÓÎ¢ÐÅ WUXL3408 M Update Morgan Stanley Research 3 M Update 4Disclosure Section The information and opinions in Morgan Stanley Research were prepared by Morgan Stanley & Co. LLC, and/or Morgan Stanley C.T.V.M. S.A., and/or Morgan Stanley Mexico, Casa de Bolsa, S.A. de C.V., and/or Morgan Stanley Canada Limited. As used in this disclosure section, \"Morgan Stanley\" includes Morgan Stanley & Co. LLC, Morgan Stanley C.T.V.M. S.A., Morgan Stanley Mexico, Casa de Bolsa, S.A. de C.V., Morgan Stanley Canada Limited and their affiliates as necessary. For important disclosures, stock price charts and equity rating histories regarding companies that are the subject of this report, please see the Morgan Stanley Research Disclosure Website atwww.morganstanley.com/eqr/disclosures/webapp/generalresearch , or contact your investment representative or Morgan Stanley Research at 1585 Broadway, (Attention: Research Management), New York, NY, 10036 USA. For valuation methodology and risks associated with any recommendation, rating or price target referenced in this research report, please contact the Client Support Team as follows: US/Canada +1 800 303-2495; Hong Kong +852 2848-5999; Latin America +1 718 754-5444 (U.S.); London +44 (0)20-7425-8169; Singapore +65 6834-6860; Sydney +61 (0)2-9770-1505; Tokyo +81 (0)3-6836-9000. Alternatively you may contact your investment representative or Morgan Stanley Research at 1585 Broadway, (Attention: Research Management), New York, NY 10036 USA. Analyst Certification The following analysts hereby certify that their views about the companies and their securities discussed in this re 产业链中高景气细分赛道如 PCB、 存储、MLCC等需求旺盛，均处于景气扩张周期，亦有望提振上游设备、 先进封装等需求，建议关注 PCB、存储、 MLCC、半导体设备及材料、先 进封装等产业链投资机遇。 投资要点： ⚫ 产业动态 ：（1）MLCC，根据财联社援引韩国朝鲜日报报道，三星电机 近日已向销售合作伙伴发出通知，自 8月1日起，MLCC产品出货价格 将在现行基础上统一上调 30%。 涨价根源在于 AI带来的高端 MLCC需求 飙升。另一家 MLCC龙头日本太阳诱电同样也已经发出涨价通知。 （2） MLCC，根据TrendForce 集邦咨询最新 MLCC产业调查，得益于 AI需求 畅旺，三大日韩厂出货同步创下近五年单月新高； 其消费级订单 或持续 外溢。（3）存储，三星存储业务二季度营收超 2025全年，三星电子于 电话会议中透露，预计 HBM4今年三季度销量环比增长逾两倍，下半年 销量有望占公司总 HBM销量的60%以上。对于明年的 HBM业务，三星电 子表示已敲定 2027年HBM供货协议。为应对 AI存储持续供不应求的 局面，三星已启动新的合约体系，计划将 60%-70%的总产能以 LTA形式 运营。（4）存储，SK海力士单季利润超 2025年全年，本季度净利润 的“破纪录”表现，主要得益于主营业务的爆发与一次性投资收益的叠 加，主营业务方面， 面向 AI服务器的高性能产品推动价格进一步上涨， 传统存储芯片全线涨价。非营业利润方面， 6月份部分出售铠侠 （Kioxia）股份，录得约 62.17万亿韩元的非营业利润。全年需求预测 方面，SK海力士预计2026年全球DRAM bit 需求增速将从 2025年的 17%-19%提升至约 25%。 ⚫ 行业估值 ：从估值情况来看， 截至2026年8月2日，SW电子板块 PE(TTM) 为87.09倍，2019年至2026年8月2日SW电子板块 PE(TTM)均值为 56.45倍，行业估值高于近年中枢水平。 ⚫ 风险因素： 中美科技摩擦加剧； AI应用发展不及预期；国产技术突破 不及预期；下游终端需求不及预期；市场竞争加剧。 [Table_Chart] 行业相对沪深 300指数表现 数据来源： 聚源，万联证券研究所 [Table_ReportList] 相关研究 英特尔CPU供不应求， MLCC产业链景气度上 行 华为昇腾950超节点亮相， “国模国芯国用” 生态有望完善 美光资本开支提速， MLCC龙头厂商订单出货 比创新高 [Table_Authors] 分析师: 夏清莹 执业证书编号： S0270520050001 电话： (0755) 8322 3620 邮箱： xiaqy1@wlzq.com.cn 分析师: 陈达 执业证书编号： S0270524080001 电话： 13122771895 邮箱： chenda@wlzq.com.cn 0%20%40%60%80%100%120%140%160%电子 沪深 300 证 券 研 究 报 告 行 业 跟 踪 报 告 行 业 研 究 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 2 页 共 8 页 $$start$$ 正文目录 1 行业周观点 ................................ ................................ ................................ ....................... 3 2 市场行情回顾 ................................ ................................ ................................ ................... 4 3 产业动态 ................................ ................................ ................................ ........................... 5 3.1 MLCC ：产能吃紧叠加原材料涨价，日韩 MLCC龙头厂商宣布涨价 ............. 5 3.2 MLCC ：日韩 MLCC厂单月出货新高，消费级订单外溢效应显现 ................. 5 3.3 存储：三星存储业务二季度营收超 2025全年，七成产能被 LTA锁定 ......... 6 3.4 存储： SK海力士单季利润超 2025年全年，存储需求有望持续增长 ............ 6 4 风险提示 ...  （来源： TrendForce 集邦咨询 ） 3.3 存储：三星存储业务 二季度营收超 2025全年，七成产能被 LTA锁定 三星电子在二季度财报电话会议中表示，虽然当前手机与 PC领域受存储涨价影响需 求走弱，但服务器 DRAM、SSD、HBM的新增需求增速远超于此。超大规模数据中心为巩 固AI领先地位加码基建投入，持续提出额外的供货需求，下半年存储需求仍然强劲。 随着智能体 AI普及，通用服务器与 AI服务器的相关需求增长趋势加速。尽管三星正在 努力扩大生产，但需求增长速度更快，预计明年供需缺口将进一步扩大。 2026年第二季度， 三星电子 DRAM bit 出货量环比增长超预期， 上涨 10%-13%，NAND bit 出货量环比增长 1%-3%，符合预期； DRAM平均售价环比增长 44%-46%，NAND平均售价环 比上涨67%-69%。受益于 AI算力需求，三星 DRAM和NAND bit 出货量均创历史新高，服 务器产品占比达最高水平。 HBM产品方面， 三星电子表示， HBM4的客户评估工作已顺 利完成，随着客户下半年扩大产品生产规模，市场需求正在快速增长。目前，公司正 按计划逐步提升产能，以扩大 HBM4的供应。三星电子于电话会议中透露，预计 HBM4今 年三季度销量环比增长逾两倍，下半年销量有望占公司总 HBM销量的60%以上。对于明 年的HBM业务，三星电子表示已敲定 2027年HBM供货协议。 为应对AI存储持续供不应求的局面，三星已启动新的合约体系，计划将 60%-70%的总 产能以LTA形式运营。据介绍，三星正根据“ 5年滚动”方式签署长期供应协议，基本 合同期为五年，并通过年度谈判将合同延长一年。 目前已与全球五大数据中心客户完 成签约， 另有五家大型 AI相关客户处于谈判最后阶段， 预计寻求长期合约的客户数将 持续增加。 为增强合同履行的约束力， 新合同包含预付款条款 （相当于多年期保证金） ， 约占总预付款四分之一的金额已到账， 后续规模随新签约进一步扩大。定价方面则改 变以往模式， 根据不同客户与产品类别差异化定价，并在通用存储合同中设置价格上 限，以降低市场价格剧烈波动带来的投资风险。此外，为及时响应不断增长的客户需 求， 三星电子正准备于今年年底前开始泰勒二期工厂的建设，目标是在 2030年实现量 产。现有的泰勒生产设施正按计划推进今年的投产准备工作，随后逐步增加其 2纳米 制程的产能。三星电子此前宣布已获得各大 CSP以及AI、HPC客户的2纳米制程订单， 预计今年的 2纳米制程订单数量将较去年增长一倍以上。 （来源： CFM闪存市场 ） 3.4 存储：SK海力士单季利润超 2025年全年，存储需求 有望持续 增长 在AI基础设施投资持续扩大及市场需求强劲的背景下， SK海力士2026财年第二季度 表现较好。 营业收入： 79.32万亿韩元（约合 545.3亿美元） ，环比大增 51%，同比增长 257%。净利润： 93.92万亿韩元（约合 645.7亿美元） ，环比增长 133%，同比增长 12.42 倍，净利润率达 118%。本季度净利润的“破纪录”表现，主要得益于主营业务的爆发 与一次性投资收益的叠加：主营业务 方面，面向AI服务器的高性能产品推动价格进一 步上涨，传统存储芯片全线涨价。非营业利润 方面，6月份部分出售铠侠（ Kioxia） 股份，录得约 62.17万亿韩元的非营业利润。这批股份系 2018年通过贝恩资本财团以 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 7 页 共 8 页 约4万亿韩元收购，此次出售大幅增厚了当期利润，使得税前利润达到 122.71万亿韩 元。 业务亮点 系HBM4量产，高端产品全面开花 。DRAM业务（营收占比 73%，约57.9万亿韩 元） ：bit出货量环比增长约 7%-9%，ASP（平均售价）环比上涨约 30%。HBM4已于第二 季度量产出货，并将于下半年全面扩大产能；下一代 HBM4E样品也已交付。此外，基 于1c nm工艺的SOCAMM2产品全面开始供应。 NAND业务（营收占比 27%，约21.4万亿韩 元） ：bit出货量环比增长约 15%，ASP环比上涨约 55%。321层产品已成为 NAND产量占比 最高的产品， SK海力士计划年底前将其在韩国本土的产能占比提升至约 50%。 战略布局 方面，SK海力士锁定长期订单，坚持设备投资原则 。随着AI向“代理式人工 智能（Agentic AI ） ”演进，存储器需求正呈现 AI存储与通用存储同步增长的结构性 变化。随着头部科技公司不断扩大 AI基础设施投资，存储器追加需求也持续涌现。此 类投资是基于 AI服务所创造的收益，因此存储器需求增长趋势有望持续。 为保障中长 期供应稳定， SK海力士采取了以下战略：推进长期协议（ LTA） ：已与约 10家核心客户 完成长期供应协议谈判， 并继续与业内主要客户洽谈。 通过差异化定价和定金等财务 机制，平抑价格波动，增强需求可见性。产能扩张与资本开支：提前推进清州 M15X量 产，并为 2027年初龙仁集群首座工厂扩产做准备。同时，先进封装工厂 P&T7、NAND基 地M17等项目将分阶段实施。预计 2026年全年资本支出将达到 40万亿韩元 （约合 275亿 美元）的高位区间，坚持设备投资原则，实现产能扩张与财务稳健的协同发展。 市场展望方面， 三季度出货指引 ，DRAM bit 出货量预计环比增长约 10%（以服务器 AI 存储产品为核心） ； NAND bit 出货量（含 Solidigm ）预计环比低个位数增长（ 1%-3%）， 主推321层产品与企业级 SSD。全年需求预测：在供应受限的背景下需求依然强劲。预 计2026年全球DRAM bit 需求增速将从 2025年的17%-19%提升至约 25%；全球NAND bit 需求增速将从 15%提升至17%-19%。 随着供应限制的缓解， 潜在需求将进一步释放。 （来 源：CFM闪存市场） 4 风险提示 中美科技摩擦加剧； AI应用发展不及预期；国产技术突破不及预期；下游终端需求不 及预期；市场竞争加剧。 仅供内部参考，请勿外传！ [Table_Pagehead] 证券研究报告 万联证券研究所 www.wlzq.cn 第 8 页 共 8 页 $$end$$ [Table_InudstryRankInfo] 行业投资评级 强于大市：未来 6个月内行业指数相对大盘涨幅 10％以上； 同步大市：未来 6个月内行业指数相对大盘涨幅 10％至-10％之间； 弱于大市：未来 6个月内行业指数相对大盘跌幅 10％以上。 [Table_StockRankInfo] 公司投资评级 买入：未来 6个月内公司相对大盘涨幅 15％以上； 增持：未来 6个月内公司相对大盘涨幅 5％至15％； 观望：未来 6个月内公司相对大盘涨幅 -5％至5％； 卖出：未来 6个月内公司相对大盘跌幅 5％以上。 基准指数 ：沪深 300指数 [Table_RiskInfo] 风险提示 我们在此提醒您，不同证券研究机构采用不同的评级术语及评级标准。我们采用的是相对评级体系，表示投资 的相对比重建议；投资者买入或者卖出证券的决定取决于个人的实际情况，比如当前的持仓结构以及其他需要 考虑的因素。投资者应阅读整篇报告，以获取比较完整的观点与信息，不应仅仅依靠投资评级来推断结论。 [Table_PromiseInfo] 证券分析师承诺 本人具有中国证券业协会授予的证券投资咨询执业资格并登记为证券分析师，以勤勉的执业态度，独立、客观 地出具本报告。本报告清晰准确地反映了本人的研究观点。本人不曾因，不因，也将不会因本报告中的具体推 荐意见或观点而直接或间接收到任何形式的补偿。 [Tale_ReliefInfo] 免责条款 万联证券股份有限公司（以下简称“本公司”）是一家覆盖证券经纪、投资银行、投资管理和证券咨询等多项 业务的全国性综合类证券公司。本公司具有中国证监会许可的证券投资咨询业务资格。 本报告仅供本公司的客户使用。本公司不会因接收人收到本报告而视其为客户。在任何情况下，本报告中的信 息或所表述的意见并不构成对任何人的投资建议。本报告中的信息或所表述的意见并未考虑到个别投资者的具 体投资目的、财务状况以及特定需求。客户应自主作出投资决策并自行承担投资风险。本公司不对任何人因使 用本报告中的内容所导致的损失负任何责任。在法律许可情况下，本公司或其关联机构可能会持有报告中提到 的公司所发行的证券头寸并进行交易，还可能为这些公司提供或争取提供投资银行、财务顾问或类似的金融服 务。 市场有风险，投资需谨慎。本报告是基于本公司认为可靠且已公开的信息撰写，本公司力求但不保证这些信息 的准确性及完整性，也不保证文中的观点或陈述不会发生任何变更。在不同时期，本公司可发出与本报告所载 资料、意见及推测不一致的报告。分析师任何形式的分享证券投资收益或者分担证券投资损失的书面或口头承 诺均为无效。 本报告的版权仅为本公司所有，未经书面许可任何机构和个人不得以任何形式翻版、复制、刊登、发表和引 用。未经我方许可而引用、刊发或转载的引起法律后果和造成我公司经济损失的概由对方承担，我公司保留追 究的权利。 [Table_AdressInfo] 万联证券股份有限公司 研究所 上海浦东新区世纪大道 1528号陆家嘴基金大厦 北京西城区平安里西大街 28号中海国际中心 深圳福田区深南大道 2007号金地中心 广州天河区 将推动人工智能高质量 发展，加快自主创新，加强基础研究和技术创新，加快数据开放共享 和人工智能语料建设。突出应用牵引，加快推动国家人工智能应用中 试基地布局建设。深化生态协同，推进“模芯云用”全链条协同创 新、高效适配。同时，完善关键制度框架，加快人工智能法立法进 程。强化风险监测防控，建立健全技术监测、风险预警、应急响应体 系。深化全球合作共治，加快推动世界人工智能合作组织建设。 国产大模型持续突破。（1）DeepSeek：根据财联社微信公众号，7 月31日，DeepSeek-V4-Flash正式版上线。根据官方消息， DeepSeek-V4-Flash正式版的模型架构、大小和与预览版相同，即 MoE（混合专家）架构、2840亿总参数、130亿激活参数、1M上下 文，在此基础上，正式版仅重新进行了后训练，Agent能力便大幅增 强，基准测试得分远超V4-Pro-Preview。（2）MiniMax：根据 MiniMax稀宇科技微信公众号，8月3日，MiniMax正式开源了新一代 通用视频模型MiniMaxH3。MiniMaxH3是一个通用型全模态生成系 统，能够统一理解由文本、图像、视频和音频构成的多模态上下文， 并可生成最高2K分辨率、最长15秒、带有原生立体声音频的视频。 得益于以任务泛化为导向的系统设计，H3在预训练阶段便已具备广泛 的多模态上下文理解与生成能力，因此能够出色地遵循复杂的多模态 指令。（3）字节跳动：根据科技日报微信公众号，字节跳动正式发布 新一代视频生成模型Seedance2.5，在生成时长、多模态理解、编辑 精度等维度实现全面升级。相较于Seedance2.0，Seedance2.5单 次生成视频时长提升至30秒，并提供高保真时序延长能力；支持最多 50个多模态参考素材；新增视频局部编辑能力；原生支持10余种语 言。Seedance2.5此次能力提升，将视频生成价值推向产业纵深。从[Table_Industry] 行业:计算机 日期: shzqdatemark [Table_Author] 分析师:杨佳伟 E-mail:yangjiawei@shzq.com SAC编号:S0870526050001 [Table_QuotePic] 最近一年行业指数与沪深300比较 [Table_ReportInfo]相关报告： 《大模型加速迭代，AI算力持续加码》 ——2026年07月28日 《WAIC亮点纷呈，模型、算力、应用持续 突破》 ——2026年07月22日 《大模型迭代提速，国产算力持续突破》 ——2026年07月15日2026年08月05日 下载日志已记录，仅供内部参考 行业周报 内容产业延伸至具身智能、智能驾驶、制造、教育、电商出海等领 域，生成式AI成为业务流程中的标准化生产工具。据悉，徐工集团、 小鹏汽车、微分智飞等多家企业将率先引入Seedance2.5模型能力。 投资建议 建议关注：（1）国产AI芯片：寒武纪、海光信息、芯原股份等； （2）超节点整机：中科曙光、浪潮信息、中兴通讯、紫光股份、华勤 技术等；（3）算租/AIDC：协创数据、宏景科技、润建股份、利通电 子、盈峰环境、行云科技、盛视科技等；（4）核心配套：华丰科技、 杰华特、盛科通信、澜起科技、申菱环境、鸿日达、高澜股份、川环 科技、飞龙股份、欧陆通、中恒电气等。 风险提示 下游景气度不及预期；政策推进不及预期；技术创新不及预期、行业 竞争加剧。 下载日志已记录，仅供内部参考 行业周报 分析师声明 作者具有中国证券业协会授予的证券投资咨询资格或相当的专业胜任能力，以勤勉尽责的职业态度，独立、客观地 出具本报告，并保证报告采用的信息均来自合规渠道，力求清晰、准确地反映作者的研究观点，结论不受任何第三 方的授意或影响。此外，作者薪酬的任何部分不与本报告中的具体推荐意见或观点直接或间接相关。 公司业务资格说明 本公司具备证券投资咨询业务资格。 投资评级体系与评级定义 股票投资评级：分析师给出下列评级中的其中一项代表其根据公司基本面及（或）估值预期以报告日起6个月 内公司股价相对于同期市场基准指数表现的看法。 买入 股价表现将强于基准指数20%以上 增持 股价表现将强于基准指数5-20% 中性 股价表现将介于基准指数±5%之间 减持 股价表现将弱于基准指数5%以上 无评级由于我们无法获取必要的资料，或者公司面临无法预见结果的重大不确定性事 件，或者其他原因，致使我们无法给出明确的投资评级 行业投资评级：分析师给出下列评级中的其中一项代表其根据行业历史基本面及（或）估值对所研究行业以报 告日起12个月内的基本面和行业指数相对于同期市场基准指数表现的看法。 增持 行业基本面看好，相对表现优于同期基准指数 中性 行业基本面稳定，相对表现与同  9月正式上市，与 SU7/YU7 驾驶系列形成双系列布 局。 澎程的产品解法可概括为 \"大电池增程 +空间重构 \"，直指传统大空间 SUV 的存量痛点。 动力上，两车搭载小米与东安动力联合开发的 1.5T 增程器，兼容 92—98号汽油，匹配 76kWh 电池， CLTC 纯电续航最高 505 公里，亏电 WLTC 油耗低至 5.7L/100km ，满油满 电综合续航超 1500 公里， N90 Max 最高达 1705 公里；空间上，昆仑平台以前后贯穿 2.9 米的纯平地板打破传统大型 SUV\" 两级台阶 \"格局， N90 Max 车长 5285mm 、轴距 3080mm ，露营版还配备电动液压升顶帐篷；智能化上全系标配小米 HAD 辅助驾驶与超 级小爱， N90 Max 搭载 700TOPS 英伟达 Thor 芯片并新增后向固态激光雷达。 我们认为，小米入局将使 25—30万元大空间增程 SUV 的竞争从增量扩张转向存量 份额再分配，并抬升该价位段智能化配置标准。 N70 Max 与理想 L6处于同一赛道， N90 Max 直面理想 L9、问界 M9，而增程大盘上半年已同比下滑 13.1%，赛道接近饱和背景 下，小米携 70万辆交付验证的品牌与渠道能力进入，头部增程车企的份额与定价将受到 直接挤压；同时 Thor 芯片、固态激光雷达、全系标配辅助驾驶等配置下探至 25—30万 元区间，同级车型的智能化 \"标配门槛 \"被进一步抬高。 从技术路线看，在纯电销量占比升至 67% 、充电设施同比增长 43.2% 的环境下，小 米仍选择补上增程拼图，指向 \"大电池、长纯电续航 \"的增程 2.0正在成为家庭大 SUV 的 主流解法。 505 公里级纯电续航使增程车日常通勤接近纯电体验、长途彻底摆脱补能约束， 增程路线的生命周期可能长于此前市场 对其\"过渡技术 \"的定位；产业链上，增程器（东安 动力为联合开发方）与大容量电池等环节需求获得新增支撑，行业技术竞争的重心正由单 一动力形式之争，转向 \"架构 —空间 —补能效率 \"的综合能力比拼。 图1：小米发布会 资料来源：小米汽车官网，申万宏源研究 23.72 14.37 0102030405060708090 综合 电子 计算机 通信 国防军 … 机械设 … 农林牧 … 社会服 … 建筑材 … 传媒 商贸零 … 医药生 … 电力设 … 美容护 … 轻工制 … 钢铁 基础化 … 汽车 环保 纺织服 … 公用事 … 煤炭 食品饮 … 房地产 有色金 … 石油石 … 交通运 … 家用电 … 沪深300 建筑装 … 非银金 … 银行 仅供内部参考，请勿外传！ 行业点评 请务必仔细阅读正文之后的各项信息披露与声明 第4页 共23页 简单金融 成就梦想 2. 本周行情回顾 2.1本周板块涨跌幅情况 本周汽车行业指数收 6469.68 点，全周上升 4.98% 。同期沪深 300 指数收报 4588.20 点，全周下降 1.31% 。汽车行业指数涨幅高于 沪深 300 指数。汽车行业周涨幅在申万宏源 一级行业中位列第 9位，较上周上升 9位。 图2：申万汽车指数本周 上升 4.98% 图3：汽车行业周涨幅在申万一级行业中位列第 9位 资料来源： Wind ，申万宏源研究 资料来源： Wind ，申万宏源研究 从估值来看，汽车市盈率为 24.98 ，在所有申万一级行业中位列第 18。本周沪深 300 市盈 率为 14.38 ，低于大部分申万一级行业，而汽车行业估值处于中等偏低水平。 图4：周汽车行业 PE排名第 18位 资料来源： Wind ，申万宏源研究 2.2本周个股涨跌幅情况 本周行业个股上涨 237 个，下跌 34个。 其中涨幅最大的个股是明新旭腾、江淮汽车、 北汽蓝谷，分别上涨 54.3% 、33.8% 、27.3% ，跌幅最大的个股是飞龙股份、祥鑫科技、 兴瑞科技，分别跌幅 -28.2% 、-28.0% 、-21.1% 。 图5：申万汽车板块涨幅前五名公司（ %） 图6：申万汽车板块跌幅前五名公司（ %） -5%0%5%10%15%20% 本周涨跌幅 (%) 4.98% -1.31% -15%-10%-5%0%5%10%15% 传媒 社会服务 商贸零售 美容护理 纺织服饰 食品饮料 计算机 房地产 汽车 家用电器 轻工制造 钢铁 农林牧渔 交通运输 建筑装饰 综合 有色金属 建筑材料 银行 医药生物 环保 石油石化 基础化工 国防军工 电力设备 公用事业 煤炭 非银金融 机械设备 沪深300 电子 通信 24.98 14.38 0102030405060708090 综合 电子 计算机 国防军工 通信 机械设备 农林牧渔 社会服务 传媒 商贸零售 建筑材料 医药生物 应用试点、生产准入和上路通行试点。 世界智能网联汽车大会（ WICV ）是我国首个经国务院批准的国家级智能网联汽车专业 会议，自 2018 年已连续成功举办八届。 3、 2026 年上半年汽车行业利润率降至 3.8% ，利润同比下降两成 国家统计局数据显示， 2026 年1-6月我国汽车产量 1510 万辆，同比下滑 4%；行 业营业收入 51893 亿元，同比增长 1.8% ，营业成本 46100 亿元，增幅 2.8% ；利润总 额1954 亿元，同比下降 20% ，销售利润率 3.8% ，显著低于下游工业企业 6.5% 的平均 水平。 2024 年行业利润率为 4.3% ，2025 年降至 4.1% ，2026 年上半年延续下行。 利润下滑与上游成本挤压相关：上半年碳酸锂价格维持高位，锂电池出口吨单价 10.48 万元，同比下降 12% ；上游采矿业利润增速达 34% ，有色和石油行业利润率分 别达 40.6% 和32.4% ；车企应付账款周期长达 200 天，应收账款周期仅 60天。上半年 计算机通信电子设备利润同比增长超 90% ，有色金属冶炼利润增幅 96% ，汽车制造业 利润降 20% ；新能源车产量增 6%至740 万辆，渗透率 49% ，燃油车产量同比降 12% 。 4、 北京 2026 上半年乘用车 L2级辅助驾驶渗透率达 77.5% ，高于全国 70.5% 的平均水平 仅供内部参考，请勿外传！ 行业点评 请务必仔细阅读正文之后的各项信息披露与声明 第8页 共23页 简单金融 成就梦想 7月27日举行的 2026 世界智能网联汽车大会媒体圆桌会上，北京市经信局副局 长苏国斌 表示 ，2026 年上半年北京市乘用车新车 L2级组合辅助驾驶渗透率达 77.5% ； 工信部装备工业一司司长郭守刚介绍，今年以来全国 L2级组合驾驶辅助功能乘用车渗 透率为 70.5% ，NOA 功能乘用车渗透率达 34.2% ，首批 L3级车型开始在特定区域上 路。2025 年北京全市汽车产量 147 万辆，同比增长 28% ，其中新能源汽车近 70万辆； 北京已累计发放自动驾驶测试牌照超 1500 张，安全测试里程突破 6500 万公里，北汽 极狐阿尔法 S获全国首批 L3级量产车型准入。大会拟于 10月21日至 23日在北京亦 庄举办 。 5、 比亚迪日本发布海獭 RACCO 微型电动车：续航 320km ，214.5 万日元起 7月28日，比亚迪日本公司宣布推出海獭（ RACCO ）微型电动车，税前价格 214.5 万日元（约合 8.87 万元人民币）起，可享 15万日元政府补贴。车身长 3395 毫 米、宽 1475 毫米、高 1800 毫米，符合日本轻型汽车（ Kei Car ）标准，为日本首款配 备电动侧滑门的轻型纯电动车。入门版搭载 22.4kWh 电池、 WLTC 续航 210 公里 ；高 配版35.84kWh 电池、续航 320 公里，成为日本首款续航突破 300 公里的轻型纯电车； 最大直流快充功率 50kW 。配置包括脚部感应电动侧滑门、 NFC 手机钥匙、 L2级驾驶 辅助、 V2L 对外供电、六安全气囊等，提供六种外观颜色 。 6、 极氪 9X 五座版正式上市，权益后限时售 45.19 万-56.59 万元 7月28日，极氪 9X五座版正式上市，提供五座 Ultra 、Hyper 、曜黑三种配置， 零售价分别为 47.19 万、54.59 万、58.59 万元，权益后限时售价 45.19 万、52.59 万、 56.59 万元。新车采用专 属空间布局与定制内饰，配备双零重力座椅、双伊姆斯躺椅、 Naim 音响系统和飞翼式滑移屏。动力上首发全栈 900V 混动高压架构， 9分钟可将电 量从 20% 充至 80% ，CLTC 综合续航最长 1250km ，搭载 2.0T 超级电混专用发动机和 三电机系统，零百加速最快 3.1秒。 7、 奔驰推出新款 Marco Polo 露营车：车顶可升起，内置冰箱、厨房 据Carscoops 7 月28日报道，奔驰新款 Marco Polo 露营车正式发布，采用双层 铝制外壳的全新可升起车顶，后部净高增加 100 毫米至 370 毫米，可选 LED 氛围灯、 滑动式车 顶及全景开口；遮阳篷改为可拆卸结构。车内新增磁吸窗帘、 8扬声器加低音 炮的专属音响系统， 40升冰箱能效较现款提高 25% ，配备 12.3 英寸显示屏和含燃气 灶、水槽的小型厨房。动力提供三款四缸柴油发动机，功率 120kW 至174kW ，匹配 9 速自动变速箱，可选后驱或四驱，顶配 300 d 零百加速最快 8.8秒。新车 8月5日在欧 洲开放订购，现款德国起售价 80664 欧元（约 62.2 万元人民
