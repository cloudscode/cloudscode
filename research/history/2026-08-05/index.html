"extracted"}, "attachment:files/20260804 市场逻辑精选.pdf": {"id": "attachment:files/20260804 市场逻辑精选.pdf", "kind": "attachment", "title": "20260804 市场逻辑精选", "source_label": "其他", "excerpt": "算力百亿订单加价扩量，客户主动翻倍锁量；镁合金 压铸落地量产——0804调研日报 xuangut ong.com.cn 2026/08/04 16:29 【算力订单加价扩量】 截至2026年7月末，公司在手算力、存储类3-5年期长期框架订单规模超154.0 4亿元。", "content": "算力百亿订单加价扩量，客户主动翻倍锁量；镁合金 压铸落地量产——0804调研日报 xuangut ong.com.cn 2026/08/04 16:29 【算力订单加价扩量】 截至2026年7月末，公司在手算力、存储类3-5年期长期框架订单规模超154.0 4亿元。2026年7月三笔核心订单先后获加价、扩量，其中头部大模型客户订单金额 涨幅超201%、算力规模翻倍，央企客户租金整体上调79%，其余核心订单综合涨 价13.5%，所有加价均发生在首批设备交付验收后，是客户对公司交付实力的实质 性认可。 【双边弹性商业模式】 公司已构建下游刚性收入+上游弹性成本双边闭环商业模式。下游端，依托客 户加价锁量、固定服务费、高额违约条款（部分订单设置100%剩余租金违约金、 固定不波动服务费），锁定收入下限；上游端，与国资供应商创新落地利润分成模 式，续约期70%利润归属公司，同时独享算力补贴冲抵成本，将刚性采购成本转化 为弹性可变成本。 【算力交付节奏与业绩释放】 公司所有核心长单均采用按月交付、按月回款、逐月确认收入的常态化模式。 2026年下半年，多笔扩容新增算力单元集中落地验收并逐步确认收入，算力板块营 收与利润预计将实现显著环比提升；2027年所有长单进入全面稳定结算周期，高毛 利算力业务营收占比持续提升。 【集装箱需求回暖排产至10月】 进入第二季度以来，运价与需求的双重回暖正直接传导至集装箱制造端，行业 需求有所回升，目前已排产至10月末。 【冷箱Q1销量同比增长30%】朗读 全屏 手机 浏览 保存 设置 帮助 退出 今年第一季度冷箱需求保持增长，冷藏箱销量达4.74万TEU，同比增长约30.2 2%。增长受益于南美鲜果丰收和北半球收获季对冷箱需求的高位支撑，以及集运周 转、冷箱调配不易叠加正常更新需求的多重驱动。 【镁合金压铸取得量产订单】 公司近年加紧推进镁合金压铸业务的产能布局及市场开拓，截至目前已取得部 分客户的量产订单。镁合金原材料价格下降，国内镁资源丰富，压铸镁合金件主要 应用在汽车轻量化领域，如仪表盘、中控、方向盘等。 【内外饰泰国建厂落地】 公司内外饰业务已经在泰国建厂，压铸业务海外产能建设也会加快推动。海外 目标客户除通用外，内资品牌的比亚迪、吉利等也是拓展方向，目前海外产品销售 价格仍有较好竞争力。 【下半年出货量预期增加】 公司与客户建立了原材料价格联动调价机制，下半年会相应调价。客户会在下 半年拉量，出货量较上半年多，预计对业绩有正向影响。 【甪直基地一期竣工投产】 苏州天脉导热散热产品智能制造甪直基地建设项目（一期）的厂房已顺利竣工 并投入使用。 【汽车电子散热产品导入供应链】 公司已开发出适用于汽车电子的导热界面材料、均温板及中高端散热器件，部 分产品已成功导入知名汽车零部件及新能源整车供应链。 ────────────────────────────────────── 内容来源： 1、行云科技：2026年7月31日投资者关系活动记录表。 2、中集集团：2026年7月投资者关系活动记录表（2026-07-31 00:00:00）。 3、广东鸿图：2026年7月29日投资者关系活动记录表。 4、苏州天脉：2026年7月31日投资者关系活动记录表。 *免责声明：文章内容仅供参考，不构成投资建议 *风险提示：股市有风险，入市需谨慎", "status": "extracted"}, "post:2026-08-05T10-07:c0638a7086e5": {"id": "post:2026-08-05T10-07:c0638a7086e5", "kind": "post", "title": "2026-08-05 10:07", "source_label": "帖子正文", "excerpt": "【中际旭创回应“美国光模块禁令”影响】8月5日，光模块概念股中际旭创、新易盛、天孚通信盘中分别跌7.93%、4.96%、3.4%。", "content": "【中际旭创回应“美国光模块禁令”影响】8月5日，光模块概念股中际旭创、新易盛、天孚通信盘中分别跌7.93%、4.96%、3.4%。有市场消息称，美国联邦通信委员会（FCC）正在起草一项禁令，旨在禁止美国进口中国数据中心组件新机型，包括光模块。今日记者以投资人身份拨打中际旭创证券事务代表电话，相关负责人称，公司已注意到相关市场信息，经核实，FCC尚未出台相关领域限制性文件。就禁令出台后的影响，相关负责人称，因并未出台，暂时不予评述。(第一财经)#文字观点", "publish_time": "2026-08-05 10:07", "tags": ["文字观点"]}, "attachment:files/天风证券-通信行业研究周报：北美四大CSP云业务全线高增，算力订单与资本投入商业闭环或逐步建立-260804.pdf": {"id": "attachment:files/天风证券-通信行业研究周报：北美四大CSP云业务全线高增，算力订单与资本投入商业闭环或逐步建立-260804.pdf", "kind": "attachment", "title": "天风证券-通信行业研究周报：北美四大CSP云业务全线高增，算力订单与资本投入商业闭环或逐步建立-260804", "source_label": "天风证券", "excerpt": "一、人工智能与数字经济： 1、光模块 &光器件， 推荐：中际旭创、新易盛、天孚通信 、源杰科技（电子联合 覆盖） ；0%26%52%78%104%130%156% 2025-08 2025-12 2026-04 2026-08通信 沪深300 下载日志已记录，仅供内部参考 行业报告 | 行业研究周报", "content": "行业报告 | 行业研究周报 请务必阅读正文之后的信息披露和免责申明 1 通信 证券研究报告 2026年08月04日 投资评级 行业评级 强于大市 (维持评级) 上次评级 强于大市 作者 王奕红 分析师 SAC执业证书编号： S1110517090004 wangyihong@tfzq.com 唐海清 分析师 SAC执业证书编号： S1110517030002 tanghaiqing@tfzq.com 康志毅 分析师 SAC执业证书编号： S1110522120002 kangzhiyi@tfzq.com 余芳沁 分析师 SAC执业证书编号： S1110521080006 yufangqin@tfzq.com 袁昊 分析师 SAC执业证书编号： S1110524050002 yuanhao@tfzq.com 陈汇丰 分析师 SAC执业证书编号： S1110522070001 chenhuifeng@tfzq.com 张建宇 分析师 SAC执业证书编号： S1110525040002 zhangjianyu@tfzq.com 曾庆亮 分析师 SAC执业证书编号： S1110526020004 zengqingliang@tfzq.com 资料来源：聚源数据 相关报告 1 《通信 -行业研究周报 :超节点产品争 相发布，全新 AI算力时代已来》 2026-07-29 2 《通信 -行业研究周报 :硅光晶圆代工 量产与扩产密集落地，光模块 /NPO/CPO 等拉高需求》 2026-07-22 3 《通信 -行业研究周报 :烽火通信加码 扩产，商业航天“网系回收”开启低 成本组网新周期》 2026-07-15 行业走势图 北美四大 CSP云业务全线高增， 算力订单与资本 投入商业 闭环或逐步建立 本周，北美四大云厂均已完成上半年业绩披露，云业务 成为四大巨头 增长的核心驱 动。我们认为， 各家云业务积压大量订单， AI需求与资本开支闭环 或逐步建立， 未来现金流 有望快速转正 。 谷歌 Q2云业务实现历史最快增长，达 82%；26年资本开支指引上修到 1950 - 2050亿美元， 2027年将显著增加 ；谷歌云的合同积压已经突破 5000亿美元。 微软第四财季 云业务增速创四年来最高，增长 达27%；26年capex维持，受会 计口径调整至 1750亿美金； 第四财季末 微软云业务未交付订单达 6780亿美元。 Meta全年资本开支指引区间下限上调至 1300亿美元，投资力度保持高位。 亚马逊 Q2云业务增速实现 18季度以来最高增速， AWS AI 业务和芯片业务年度 营收规模均超过 250亿美元；Q2资本开支达 到531亿美元，维持高位。 本周投资观点： 我们认为，在整体宏观环境变化复杂背景下，把握核心高景气行业与资产是重要选 择。我们仍坚定看好算力产业链核心标的的投资机会， AI带动算力供应链核心标 的有望实现较好的业务增长，重视产业链核心厂商 。其中，海外算力产业链高景气 度依旧， 相关公司财报持续体现 AI相关需求的高景气 ，相关产业链的基本面共振 更强，我们持续看好海外算力产业链投资机会。国内方面，后续伴随着 国产算力持 续发展，大厂如阿里、字节等对于 AI的持续投资 ，仍然看好 AI行业以及围绕 AIDC产业链的持续高景气。整体上我们积极看好 26年国内 AI基础设施 需求延续 高景气，同时应用有望持续 开花结果。中美 AI均进展不断，同时推理端持续推 进。建议持续关注 AI产业动态及 AI应用的投资机会 。 中长期我们建议持续重视“ AI+出海 +卫星”核心标的的投资机会： 海外线 AI核心 方向如光模块 &光器件、液冷等领域值得重视，持续核心推荐；此外国产算力线如 国产服务器，交换机， AIDC、液冷等方向核心标的建议积极关注。 海风行业国内 加速复苏，海外出海具备良好机遇，积极把握产业变化，核心推荐海缆龙头厂商。 近期看到 商业航天 产业国内动态进展呈现，看好后续产业受催化拉动。 一、人工智能与数字经济： 1、光模块 &光器件， 推荐：中际旭创、新易盛、天孚通信 、源杰科技（电子联合 覆盖） ；相关标的 ：东山精密 、剑桥科技 、长芯博创、仕佳光子、鼎通科技、光库 科技、华懋科技 （电新汽车团队联合覆盖） 、致尚科技、罗博特科 、中瓷电子 、太 辰光、德科立 等。 2、光纤光缆，推荐：亨通光电、中天科技、长飞光纤 、永鼎股份 ；相关标的：杭 电股份、特发信息、通鼎互联等。 3、交换机服务器 PCB：推荐： 沪电股份 （电子组联合覆盖） 、菲菱科思 ；相关标 的：盛科通信、锐捷网络、 胜宏科技、 三旺通信、映翰通等 。 4、低估值、高分红 ，云和算力 idc资源重估 ：中国移动、中国电信、中国联通 。 5、AIDC&散热：推荐：英维克（机械联合覆盖） 、润泽科技 （机械联合覆盖） 、润 建股份、 光环新网、 科华数据 （电新联合覆盖） 、奥飞数据（计算机联合覆盖） 、数 据港（计算机联合覆盖） 。相关标的 ：大位科技、 申菱环境 （家电覆盖） 、 宏景科 技、高澜股份、科创新源等 。 6、AIGC应用/端侧算力 ，推荐：移远通信、广和通、美格智能 ，相关标的 ：彩讯 股份、梦网科技 、翱捷科技 （电子组覆盖） 。 二、物联网 &智能驾驶： 1、出海复苏 &头部集中，推荐：威胜信息（机械联合覆盖） 、拓邦股份 （电子联合 覆盖）、亿联网络、广和通 、美格智能 等，相关标的 ：华测导航 、和而泰（电子家 电团队联合覆盖） 、移远通信 、移为通信 。 2、智能驾驶： 相关标的 ：模组 &终端（广和通、美格智能、移远通信、移为通信 等） ；传感器（汉威科技 &四方光电 -机械联合覆盖） ；连接器（意华股份、鼎通科 技等） ；结构件 &空气悬挂（瑞玛精密）等。 三、商业航天 ： 低轨卫星加速发展，低空经济积极推进， 相关标的 ：铖昌科技 、华测导航 、盛路通 信、信科移动、佳缘科技、盟升电子、中国卫通、 震有科技、通宇通讯 等。 其他细分领域标的： 中兴通讯、紫光股份（计算机联合覆盖） 、亨通光电、中天科 技、光迅科技、烽火通信、海格通信、上海瀚讯、 海能达、电科网安 。 风险提示：AI进展低于预期，下游应用推广不及预期，贸易 摩擦等风险，报告中 “相关标的”仅为对相关公司的罗列，不构成任何投资建议 。 0%26%52%78%104%130%156% 2025-08 2025-12 2026-04 2026-08通信 沪深300 下载日志已记录，仅供内部参考 行业报告 | 行业研究周报 请务必阅读正文之后的信息披露和免责申明 2 重点标的推荐 股票 股票 收盘价（元） 投资 EPS(元) P/E 代码 名称 2026 -08-04 评级 2025A 2026E 2027E 2028E 2025A 2026E 2027E 2028E 300308.SZ 中际旭创 1021.99 买入 9.72 24.47 52.75 74.91 105.14 41.77 19.37 13.64 300394.SZ 天孚通信 212.00 增持 2.59 3.92 5.15 7.08 81.85 54.08 41.17 29.94 300502.SZ 新易盛 448.00 买入 9.59 18.58 25.03 31.32 46.72 24.11 17.90 14.30 002463.SZ 沪电股份 111.77 增持 1.99 2.70 3.52 56.17 41.40 31.75 600522.SH 中天科技 29.94 买入 0.94 1.20 1.47 31.85 24.95 20.37 600487.SH 亨通光电 50.27 买入 1.09 3.49 4.34 5.03 46.12 14. 件下连续稳定运行 192小时 8分45秒，断 链次数为 0，通信可用度超过 99.99%，创造了全球商业航天领域星间激光通信单次稳链时 长新纪录。该链路采用氦星光联提供的星载激光通信终端，全程无人工干预。 2025年5 月14日，“三体计算星座 ”首发 12颗卫星由长征二号丁火箭发射入轨，氦星光联提供 了24套激光通信终端（ 100M/10G/100G 三类） ，是国内首家同时完成 11条星间链路在 轨建链、通信与互联计算的激光终端制造商。此次测试证明低成本激光通信载荷已从 “能连”跨越至“稳连”阶段，具备支撑大规模星座常态化组网 的能力，为 2027年百星 规模、 2032年千星规模的 “三体计算星座 ”建设奠定了坚实技术基础。 3. 本周行业投资观点 本周投资观点 ： 在整体宏观环境变化复杂背景下，把握核心高景气行业与资产是重要选择。我们仍坚定 看好算力产业链核心标的的投资机会， AI带动算力供应链核心标的有望实现较好的业务 增长，重视产业链核心厂商。其中，海外算力产业链高景气度依旧，相关公司财报持续 体现 AI相关需求的高景气，相关产业链的基本面共振更强，我们持续看好海外算力产业 链投资机会。国内方面，后续伴随着国产算力持续发展，大厂如阿里、字节等对于 AI的 持续投资，仍然看好 AI行业以及围绕 AIDC产业链的持续高景气。整体上我们积极看好 26年国内 AI基础设施需求延续高景气，同时应用有望持续开花结果。中美 AI均进展不 断，同时推理端持续推进。建议持续关注 AI产业动态及 AI应用的投资机会 。 我们建议持续重视 “AI+出海 +卫星”核心标的的投资机会： 海外线 AI核心方向如光模块 &光器件、液冷等领域值得重视，持续核心推荐；此外国产算力线如国产服务器，交换机， AIDC、液冷等方向核心标的建议积极关注。海风行业国内加速复苏，海外出海具备良好 下载日志已记录，仅供内部参考 行业报告 | 行业研究周报 请务必阅读正文之后的信息披露和免责申明 9 机遇，积极把握产业变化，核心推荐海 缆龙头厂商。近期看到 商业航天 产业国内动态进 展呈现，看好后续产业受催化拉动。 中长期我们持续推荐 AI算力方向核心受益的优质标的以及高景气格局好的细分赛道方向： 1）AI和数字经济仍为强主线，未来需要紧抓核心受益标的： ICT设备、光模块 /光芯片、 PCB、IDC/液冷散热、 GPT应用、电信运营商（数字经济 +工业互联网）等相关公司都有 望迎来新机遇。 2）商业航天 &“天地一体化 ”为6G重点方向，建议关注通导遥各细分 赛道。 3）海风未来几年持续高景气，海缆壁垒高 &格局好 &估值低，投资机会凸显。 人工智能 &数字经济是未来产业长 期大趋势： 算力+网络+存储+散热为主要受益方向， AI 新科技浪潮将持续拉动 ICT设备商、光通信、 PCB、散热温控等需求，长期重视其相关投 资机会； 以满足流量增长为目标的有线网络扩容： 随着 5G用户渗透，网络流量快速提升，光传输、 光模块等扩容升级迫在眉睫； 以满足应用和内容增长需求的云计算基础设施和物联网硬件终端投资： ISP厂商基于新应 用和新内容增长，加大云计算基础设施投入，包括 IDC、网络路由交换、服务器、配套温 控电源、光模块及光器件的新一轮景气提升。 双碳长期目标下，重点关注通信 +新能源，另外应用端，云视频、 数据、物联网 /智能汽 车、工业互联网、 商业航天 等行业应用进入加速发展阶段，中长期成长逻辑清晰，进入 重点关注阶段。 具体细分行业来看： 一、人工智能与数字经济： 1、光模块 &光器件， 推荐：中际旭创、新易盛、天孚通信、源杰科技（电子联合覆盖） ； 相关标的 ：东山精密 、剑桥科技、长芯博创、仕佳光子、鼎通科技 、光库科技、 华懋科 技（电新汽车团队联合覆盖 ）、致尚科技、罗博特科、中瓷电子、太辰光、德科立等。 2、光纤光缆， 推荐：亨通光电、中天科技、长飞光纤、永鼎股份 ；相关标的：杭电股份、 特发信息、通鼎互联等。 3、交换机服务器 PCB：推荐： 沪电股份（电子组联合覆盖） 、菲菱科思； 相关标的 ：盛 科通信、锐捷网络 、胜宏科技 、三旺通信、映翰通等。 4、低估值、高分红，云和算力 idc资源重估： 中国移动、中国电信、中国联通 。 5、AIDC&散热：推荐： 英维克（机械联合覆盖） 、润泽科技（机械联合覆盖） 、润建股 份、光环新网、科华数据（电新联合覆盖） 、奥飞数据（计算机联合覆盖） 、数据港（计 算机联合覆盖） 。 相关标的 ：大位科技 、申菱环境（家电覆盖） 、宏景科技、高澜股份、 科创新源等。 6、AIGC应用/端侧算力，推荐： 移远通信、广和通、美格智能 ，相关标的 ：彩讯股份、 梦网科技 、翱捷科技 （电子团队覆盖） 。 二、物 ropic 旗舰模型保持持平 。国产大模型今年以来定价趋势分化 ，智谱、腾讯、阿里、Kimi 等厂商对旗下模型 API和订阅套餐进行涨价 ，以DeepSeek 、小米为代表的厂商选择了降价策略 。 编程智能体已验证商业价值 ，办公智能体市场快速扩大 。AI编程已通过海外头部产品的规模化营收验证商业价值 。2026年，Claude Code带 动了 Anthropic ARR（年化经常性收入 ）的攀升，并超越 OpenAI。根据官方口径 ，2025年底 Anthropic ARR仅90亿美元，2026年5月初突破 470亿美元。模型推理成本进入精细化定价阶段 ，IDE向通用办公场景延伸 ，企业版办公智能体产品成为头部厂商新增长点 。腾讯产品 WorkBuddy 月访问量领先 ，2026年6月，桌面端 AI原生办公智能体平台呈现高集中度 ，WorkBuddy 以2097万次的月访问量领先 。App端，根 据AI产品榜全球增速榜统计 ，7月WorkBuddy MAU环比增速达到 397%，居全球第一 。 投资建议 ：当前我国国产大模型持续迭代 ，能力持续提升 ，Token调用量居全球前列 ，我们坚定看好我国 AI产业的发展前景 ，建议持续关 注AI主题的投资 机会。标的方面 ，1）AI算力：建议关注海光信息 、工业富联 、紫光股份 、中科曙光 、神州数码 、深信服、浪潮信息 、寒 武纪、华勤技术 、智微智能 、中际旭创 、新易盛、天孚通信 、源杰科技 。2）AI算法和应用：建议关注恒生电子 、中科创达 、盛视科技 、 道通科技 、金山办公 、科大讯飞 、同花顺、福昕软件 、万兴科技 、彩讯股份 、德赛西威 、泛微网络 、合合信息 、卓易信息 、索辰科技 、普 联软件、锐明技术 。 风险提示： 1）国产 AI算力芯片发展不及预期 。2）大模型产品的应用落地低于预期 。3）国内大模型算法发展不及预期 。 仅供内部参考，请勿外传！ 全球大模型高频迭代， Kimi K3位列开源模型智能前沿 闭源 权重开源 权重开源（禁止商用） 2025年底至今，全球大模型快速迭代。 据不完全统计， 2025年12月1日-2026年6月1日，美国市 场（ OpenAI、Anthropic 、谷歌 Gemini）和中国（包括阿里千问、字节跳动豆包、腾讯混元、 小米 MiMo、DeepSeek 、月之暗面、智谱、 MiniMax）的 11家主流大模型厂商，至少发布或迭 代了 55款重磅模型，几乎每 3.3天就会有一款模型发布或迭代。 从大模型综合性能来看，根据 Artificial Analysis 截至 7月29日的评估，目前全球排名前五的模型 主要来自 Anthropic 、OpenAI、月之暗面三家大模型团队，以闭源模型为主。 值得注意的是， 7月17日，月之暗面 Kimi K3正式推出，作为全球首个开源的 2.8 万亿级别模型，面向长程编程、 知识工作和推理等前沿智能场景。在月之暗面的整套评测中， Kimi K3 的整体表现虽仍落后 于最强的闭源模型 Claude Fable 5 和GPT -5.6 Sol，但稳定超过了其他所有模型。 资料来源： Artificial Analysis （截至 2026年7月29日），月之暗面 Kimi公众号，平安证券研究所 注：纵轴为 Artificial Analysis Intelligence Index ，包括 10项大模型常见性能评估维度（ GDPval -AA, 𝜏²-Bench Telecom, Terminal -Bench Hard, SciCode , AA -LCR, AA -Omniscience, IFBench , Humanity's Last Exam, GPQA Diamond, CritPt）Artificial Analysis 全球大模型综合性能排名Kimi K3 是首个达到 2.8 万亿参数规模的开源模型 Kimi K3 在Coding 基准测试上的得分位于全球前列 仅供内部参考，请勿外传！ 国产大模型性价比突出， Token调用量居全球前列 国产大模型凭借较高性价比在全球 Token 调用量上占据梯队优势。 根据Artificial Analysis 模型性能 vs平均每项任务成本 象限图， 除了GPT-5.6系列的部分模型，落在最具性价比象限的 以国产大模型如小米 MiMo-V2.5、DeepSeek V4 Pro/Flash 、腾讯Hy3、MiniMax-M3为代表。 全球竞争格局： 1）Token调用量方面， OpenRouter Token 调用量月榜（截至 7月29日）全球前 十名中，国产大模型合计占据七席，小米 MiMo-V2.5、DeepSeek V4 Flas 摩尔）格局 涨价逻辑：2026 年 3-4 月英伟达货源收紧 + 国内政策扶持，国产对标芯片集体涨价", "content": "国产 AI 芯片（昇腾、寒武纪、昆仑、摩尔）格局 涨价逻辑：2026 年 3-4 月英伟达货源收紧 + 国内政策扶持，国产对标芯片集体涨价；华为昇腾商业化落地进度领先。 性能分层 单卡：部分场景性能可追平英伟达前代产品； 整机 / 小规模集群：性能为英伟达 50%-60%； 超大跨集群（数百卡部署万亿参数模型）：效率仅英伟达 30%-40%；昇腾依靠超节点双层网络架构缓解跨机通信短板，是国内唯一成熟大规模集群方案。 模型厂商适配分化 DeepSeek：全栈适配昇腾，重写 CUDA 转 CANN 底层代码、自研 TileLang 编译器，成果成熟，算力成本较英伟达低 3-4 折，战略绑定国产生态；适配方案具备复用性，其他厂商 2-3 个月即可完成基础适配（早年需半年至 10 个月）。 Kimi：海外开源需求旺盛、算力消耗更大，双路线并行（英伟达 + 国产），无全栈 all in 国产计划。 智谱 AI：落地 1GW 全国产算力中心，客户以政企、金融、医疗等国有属性行业为主，私有化部署需求匹配国产芯片；To C 业务难以全面切换国产。 字节等互联网厂商：昇腾适配性能折损明显，观望为主；字节...", "publish_time": "2026-08-05 19:49", "tags": ["文字观点"]}, "post:2026-08-05T20-48:81e1e99e3c21": {"id": "post:2026-08-05T20-48:81e1e99e3c21", "kind": "post", "title": "2026-08-05 20:48", "source_label": "帖子正文", "excerpt": "各大厂超节点使用芯片情况: ZJ、寒武纪590+少量690+昇腾910 AL、PPU1.5+PPU1.7大概六四开 BD、昆仑芯M100 TX、燧原大量+昆仑芯(大概率是P800)", "content": "各大厂超节点使用芯片情况: ZJ、寒武纪590+少量690+昇腾910 AL、PPU1.5+PPU1.7大概六四开 BD、昆仑芯M100 TX、燧原大量+昆仑芯(大概率是P800)+昇腾910 博通TH5芯片涨价约30%，后续价格会继续上涨。#文字观点", "publish_time": "2026-08-05 20:48", "tags": ["文字观点"]}, "attachment:files/国产超节点与AI算力近况更新.docx": {"id": "attachment:files/国产超节点与AI算力近况更新.docx", "kind": "attachment", "title": "国产超节点与AI算力近况更新", "source_label": "其他", "excerpt": "专家：那么字节的话，当然前面采购了大量的寒武纪，这个就不说了，还有 950 的。专家：那么寒武纪的话，因为现在 690 还没有完全规模交付，现在还是属于小批量量产的阶段，主要还是交付给自己，其他的客户没有看到太大的交付量。", "content": "一、国产超节点能否在 BF16 的内存与带宽优势上对标 NVL72 专家：好，各位晚上好。我先说一下提纲里面的那些内容，碰到有些地方我理解得不是很完整，回头大家也可以再讨论。 专家：第一个问题我看到的是：国产机体能否在 BF16 内存和带宽优势上面对标 NVL72？我是这样看这个问题的。首先 NVL72 的优势，硬件上主要还是我认为在 NVLink C2C 上面。在这个特点上面，它能够让自己的 Grace CPU 和 GPU 通过更大的带宽，在硬件层面保持缓存一致性，所以它在推理端的时候，高容量的 KV Cache 可以 offload 到内存上面，因此能够极大地拓展它超长上下文的能力。 专家：这是一个硬件上统一设计的能力，它和问题当中本身单纯卖内存或者带宽的这个优势，并不是完全一致的一个回答。那么国产超节点在 scale up 上面的效率，其实除了华为，它具备 CPU、GPU 跟总线带宽全部的资源能力，而且全部自己在做；其他的超节点——当然这里的阿里可能更加接近于华为——除此之外的第三方，基本上 CPU、GPU 以及互联带宽只能达到部分，或者说全都是采用解耦的架构，所以在硬件上面就已经会有比较大的差距了。 专家：当然也因为硬件上面的这个差距，会导致它在互联带宽的协议改造上面，理解不像具备一体化设计能力的厂商来得那么有效率，那么最终导致的效果差距可能就会比较大。这是在硬件上的。 专家：软件上面，我不知道这个问题里面为什么会单独提 BF16。因为从我的理解来说，目前现在大量的模型在预训练的时候，都至少是 FP8 到 FP16 的混合精度，或者现在更多的用 FP4。那么 BF16 无论如何，它在精度上面还是会消耗更大的资源。 专家：你说它会导致的结果，大家应该也比较好理解：很容易会导致比如说内存溢出，相较于 FP16 可能会更好一些，但它依然会存在效率比原来更低的这种情况。那么还有一个问题，就是因为量化的问题，会导致我大量的一些工程能力会投入到精度改变完以后的准确度的投资或者说研发当中去。所以这是我认为的第一个问题，它不是一个直接现在就能去对标 NVL72 的状态。 专家：那么目前国产的超节点，更多的是用数量堆叠的方式去做，因为效率相对来说会比较低，不是一个完全紧咬合的状态。通过这种堆叠方式，在大的系统上面能够尽量提供更高的一些性能。包括昇腾的 384，以及它现在 1024 的 950P；像阿里的 PPU 1.5 的磐久 128；甚至其他一些二线的国产超节点，我知道的都是逐步在做新的一些研究，后面可以简单再提一下。 二、超节点 scale up 的规模、延时与利用率取舍 专家：第二个问题是超节点 scale up 的规模、延时和利用率方面的取舍，这个确实在我们国产的超节点里面是一个很大的问题。 专家：因为本身延时和规模受到的核心制约因素还是芯片的 C Die，下面比如说你的 Serdes 的数量，和你对接的互联芯片的带宽，这是硬件上面最大的限制因素。那么如果说解决这个问题以外，剩下的就是协议开发。这个协议开发，我知道的比如说各个公司在自研芯片能力比较强的，它的效率通常都会比较高。那当然国际厂商像博通，它现在推出的这一代交换芯片，其实也把原来的 TH（Tomahawk）芯片做了改造，那么为的就是要抢占这一类超节点的市场。 专家：那么从现在国产的超节点来说，这个规模，如果作为现在比如说我们去取舍的话，我认为在国产的这个超节点里面，利用率是第一位的，因为我们在推理端最终追求的还是 token 的成本。那么延时其次，因为延时这个问题一方面在硬件，这个硬件是一个物理限制，当然也可以通过一些软件上的开发或者优化来提升部分性能。那么最后是规模，因为有前面这两个限制，你的规模不可能做得太大，规模是我最终可能以另外的方式、比如说 scale up 的方式去做一些弥补。 三、CSP 招标倾向于专有总线还是开放以太网 专家：那么第三个问题是：CSP 招标会倾向于专有总线还是开放的以太网？ 专家：这个我觉得从我跟这些 CSP 交流的情况来看，他们最在意的其实是供应链安全和持续供应能力。因为比如说通常稍微大一点的一线 CSP，它引入国产 CPU 的最小量级通常都在万片以上，因为它要对这些芯片进行系统性的优化，要适配自己的软件栈。因为通常 CSP 是不会为了采购某些硬件，就让硬件厂商来提供他的一些自研的软件的，那么他会被绑定，所以通常是需要芯片厂商为了 CSP 去做一些定制化的软件开发。 专家：所以我认为可能不仅不是开放总线或者专用总线的这个问题，更多的是供应。第二个是软件上的开放程度和原厂算子层的开发能力和投入。对于 CSP 来说，软件栈的开放程度往往取决于它能不能够大规模地应用在它的整个平台里面。那么算子或者说底层软件这样的开放、开发能力和投入，涉及到它后期软件研发的投入以及上线的周期，这些都和 CSP 厂商最终的成本是直接相关的。所以这两个是目前我跟他们交流当中，我认为他们首要去选择的一个基准。 专家：那么至于在超节点内部是专有总线还是开放以太网，目前我并没有听到他们对这个特别关注，或者说有什么特殊的要求。针对这一块，从现在交流情况来说，他们更加倾向于比如说我自己来研发超节点内部的芯片或者协议，不太会用完全采用这个开放的这种方式。当然在 24 年、25 年之前，有遇到过 CSP 厂商要求我们提供一些纯以太网的、独立的国产芯片互联方式的方案，但是这些方案最终都被 pass 了。所以我也反过来认为，CSP 对这些内容并不是最在意的。 四、盛科的国产 switch 芯片在 scale up 交换上的替代进度 专家：那么第四个问题是：盛科的国产 switch 芯片在 scale up 交换上面的替代进度如何？说实话，我了解到的目前比如说我知道的这些在研发、或者说已经出来的超节点，包括摩尔线程新的超节点 S6000、壁仞的 BR200，以及 ECU 的，还有阿里的 PPU 1.5 代——这些可能大家都比较熟悉的、或者说主流的超节点，目前我知道的只有在摩尔线程的，一期里面它会采用，在二期里面会采用国产的思位芯片。在其他的超节点里面，要么是用自研的，要么采用的是第三方、可能更小的一些厂商开发的芯片。所以盛科在 scale up 上面，我们目前没有看到太多的应用替换进度。 五、高密机柜、液冷、高速互联，哪个是量产堵点 专家：那么第五个问题是：高密机柜的液冷、高速互联等等这些环节中，哪个是量产的堵点？当然这个显而易见，我认为最大的问题还是在芯片、在 C Die 主芯片上面，这是国产里面现在最大的量产堵点。 专家：那除此之外，现在比如说从我们 ODM 商这个程度来看，还有几个相对来说现在虽然不是那么强的堵点、但是交期比较长，比如说 PCB、高端的 PCB 板。那么接下来如果说要做超过一百千瓦的机柜，那么高压直流电源的研发进度以及相关的一些高压安规，这些可能是接下来的一些堵点。当然前面讲到的我就不重复了，比如说互联芯片的供应，甚至可能我们在 C Die 上面 Serdes 的供应，这个可能也都是一些堵点，但是这里没有提到，所以我就没列进去。那么剩下的可能在散热件、结构件，这个我认为暂时从我们递交的订单来看，这些都还好，还是主要是工程研发上面的正常进度。 六、客户采购结构与份额切分；自研超节点与第三方是替代还是互补 专家：那么第六个问题是客户采购结构：互联网 CSP、运营商、政企在各个国产芯片的份额切分，以及自研超节点与第三方是替代还是互补？ 专家：首先份额的话，暂时我没有非常完整的数据，但是我可以把我了解到的一部分数据提供给大家。比如说阿里的 PPU 1.5 代，当前是它目标自用上面的首选，它总共的数量目前 1.5 代大概在五十万片，那么其中超节点会占到接近百分之八十；剩下的一部分是在风冷的机器里面，大概可能会在六千到一万台左右，剩下的全是超节点。那么基本上超节点都在公有云上面用，风冷的基本上都在混合云上面用。所以其实全国能够在行业里面分到的数量并不是很多。 专家：阿里其实还有一些是昇腾的 950PR。昇腾 950PR，阿里是作为第二个规模采购引入的芯片，那么它除了自研和 950 之外，其实会以四进三或者五进三的方式，也就是说它还有一到两款国产芯片是作为备用的。那么目前除了原来的海光 DCU 早就已经在好几年前引入测试以外，剩下的还有一款，这一款其实和前面说的供应链的规模有关系，目前其实在接触的各个厂商都有，但是都还没有非常明显的倾向。 专家：那么字节的话，当然前面采购了大量的寒武纪，这个就不说了，还有 950 的。950PR 好像是今年的——我想想看——今年的五月份才开始正式交付，但是具体的数量、节奏现在还不是很明确，总共大概在十几万张。 专家：那么其他的一些互联网厂商，我现在手上的数据并没有那么整齐，因为这个数据从我们公司的出口大概可能得要到八月底、九月份才会比较完整。那么运营商在份额上面，其实还是昇腾的比例最大。 专家：那么前面提到的其中有一个国产的芯片公司摩尔线程，它的超节点用的是移动的 OSA，那么大概率它会下很大一批 S6000 的超节点，进入到它的数据中心。至于现在的数量和 S6000 的进度、以及它最终交货的总量关系，从目前我们的资料里面来看，摩尔线程下一代芯片的 die 的数量，给出的数据是五十万以上。那么最终的交付数量其实和它最终前端的销售量有关系。 专家：那么其他的一些政企客户，基本上现在没有非常明确的份额切分，基本上是以价格为首要目标。当然现在阿里在政企市场上的销售情况也非常不错，但是它最终 PPU 1.5 代的交付数量上限是有限的，所以这个现在还不知道；但是它的 1.7 代已经在快速推进下一步的研发计划了。所以其实我认为我们更加应该关注它下一代的 PPU 1.7，那个数量可能会更大。 专家：那么，自研超节点与第三方超节点是替补还是互补？这个问题，我认为是屁股决定脑袋，当然这是我自己来看。因为对于互联网厂商来说，能够用自己做的芯片和自己做的超节点，因为它的整套系统如果是自研的话，对它来说 token 的效率会最高、会最好，成本会最高，所以它当然会首选自研的。那么第三方的话，要么它的供应规模非常大，不然它不会是一个互补的状态，最多是个替补。 专家：那么政企客户的话，因为他要的可能是更加省心的、开箱即用的交付方式，所以他对首次采购的成本要求比较高。那么我认为从超节点里面去看，就是看首次规模采购的成本哪一个最低。 七、软件迁移成本与原厂开发投入 专家：那么第七个问题，刚才我跟我们机构的同事说过，这部分可能不是我了解的重点，但是大概现在的覆盖率可能超过九成九了。那么迁移的成本，从我跟 CSP 的沟通来看，迁移成本其实是比较低的，但是迁移成本在 CSP 的投资里面占比非常小，他并不在意你的迁移成本，更多的是要符合 CSP 自己的整套软件。所以这个开发成本到目前来说，九一六 C 还是非常高的，通常至少会有百人的团队会部署到 CSP 去做可能超过六个月以上的开发，至少这种级别才能够让我们生产的设备相对比较好地 work 起来。 〔转录存疑〕①第七个问题的原始题干未出现在转录稿中，仅有专家的回答；②\"九幺六 C\"音写不明（疑为某芯片型号），本稿按原音保留为\"九一六 C\"，请以录音复核。 八、国产超节点推理的 token 成本与效率实测 专家：那么第八个是国产超节点推理的 token 成本和计算效率的问题。我先把我们当前的测试情况给大家简单复述一下。 专家：从目前我们对于国产超节点的测试情况来看，PPU 1.5 是目前投入产出比最好的，这是我们当前能够测到的。基本上，相较于比如说八卡的这种机器每个月的租金来看，基本上可以打平。我先说风冷：从目前风冷的机器、八卡 PPU 1.5 代来看，按照每个月每台五万元的 token 生成效率来看，基本上是可以打平的。也就是说，目前 PPU 的风冷机器最高可以做到接近差不多五万每台每月。 专家：那么它的超节点的效率的话，大概会比我们的风冷机器高两三倍的样子，因为现在还没有优化过，所以其实这个价格就相对来说比较有优势了。相对应比如说 128 的集群，那你还要再乘一个相应芯片的数量。 专家：那么沐曦的话，因为它的 C600 超节点还没有出来，那么按照它风冷的 TCU 来看，基本上两点五万每台每月是它的 deadline。那么摩尔线程的 S5000 相对会好一点，deadline 可能在三万到三万五，但是S5000 最大的问题是它的显存太差，这个是比较大的问题，所以通常比如说 S5000 在实际商用的情况下，它会和英伟达的集群做 TTN 零这种，相应的效果会比较好。 专家：那么海光的 BW1100，从现在的测试情况来说，因为还没优化完，从现在来看它还是低于三万每台每月的 deadline。那么主要的原因并不是因为 BW1100 的芯片不好，而是它的软件优化、算子优化不好，以及它在算子开发或者说软件优化上的投入太少，所以这个优化的成本相对来说就比较高。 九、国产芯片的产能与交付节奏（原稿仍编为\"第八个问题\"） 专家：那么第八个问题是——今年国产超节点的节奏，与二线 AI 公司超节点与一线厂商，是这个吗？唉，不好意思，这个有点对不上。是产能，国产芯片的产能与节奏的增长情况。 专家：产能与节奏，我这样子吧，我先说一说我实际上了解到的一些情况。从我们的内部数据来看，我分芯片公司来说好了。昆仑芯的话，P800 的超节点目前从真实的出货情况看，华三的出货大概小于一百柜，中兴的出货大概在三百到五百柜之间，这个是昆仑芯。 专家：那么壁仞的话，可能它的重点是在 27 年。壁仞的 BR200 目前最大的问题还是性能处于仿真状态，还没有拿到非常完整的样片。但是它的规划的话，在 27 年的上半年总共会交付——我看一下——大概四百柜不到一点，那么主要的机器是 BR200。它的第一版用的是博通 TF One 的交换机的超节点，那么目前最大的设计是大概八十四个节点、八十四卡的超节点。整个的交付主要是在 27 年的上半年，那么根据实际上交付的状态，会有两个比较大的客户要求向万卡去扩容。那么，这是壁仞。 专家：那么海光的话，从之前的交付情况来看，主要是训练场和郑州的数据中心，那么主要还是以他自己交付为主。 专家：那么寒武纪的话，因为现在 690 还没有完全规模交付，现在还是属于小批量量产的阶段，主要还是交付给自己，其他的客户没有看到太大的交付量。当然 690 也进入到阿里的采购目录序列里面，但是它的交付量或者说现在的测试情况并不明朗。 专家：那么另外一个就是昇腾。昇腾现在目前交付的主要是 910C，而且有可能是因为产能的原因，部分 ODM 商还在往回交 910B4。这个原因现在还不确定，但是我有了解到，有几个厂商在加大 910B4 的交付。那么关于其他的 950PR，这个交付的节奏在加快，但是大概到今年底的话，总共估计可能有小几十万张、大概三五十万张的规模。从目前 CSP 提供的一些信息来看，大概就是这样。 专家：那么，我根据之前提供的一些问题，前面的一些我的回复就这样，然后接下来看看怎么安排。 〔转录存疑〕①原稿此处仍编号为\"第八个问题\"，与上一节重号，且问题题干本身在转录中即已错乱、由专家当场纠正，本稿保留原状；②昇腾 950 系列型号在原稿中作\"950PR\"\"950TR\"两种写法，未作统一。 十、问答：今明两年国产超节点的出货规模与整机厂分配 主持人：好的，谢谢专家。有一个之前略掉的问题，是国产超节点今年以及明年整体的出货规模，想请专家给我们解读一下。另外，从整机厂来看的话，各家怎么分今年和明年这些出货的量？ 专家：是这样，因为我暂时还无法代表所有的厂商，我只能比如说从华三的角度来看：今年的主要重点还是 PPU，那么 PPU 的整个规模，大概只下半年是六千台到一万台封顶。那么超节点，磐久 128 的超节点主要还是在另外两个 ODM 商那里，大概总体的规模在四十万片，大家可以除一下就知道了。那么其他的，昇腾的话，我现在还没有太多它的详细数据，因为这个销售数据的评估确实不是我擅长的。 〔转录存疑〕\"六千台到一万台的封忍\"据上下文作\"封顶\"。 十一、问答：国产 AI 芯片实测性能排序与海外对标 主持人：好，明白。另外从咱们的角度来看，咱们测试的这些国产 AI 芯片，它们的实测性能，我们测试下来把它们进行一个排序，能不能帮我们分析一下？比如说第一梯队大概是目前的哪些芯片，大体的性能如果说找一个海外的卡去对标，大概处在一个什么样的位置？ 专家：因为这个性能很难一句话说得清楚，所以我前面举的例子就是从 token 生成的这个维度去做了一个横向的对比。 专家：那么现在当前回本周期、或者说 TCU 最好的还是阿里 PPU 的 1.5 代。原因是它这一代的芯片本身用的是成熟制程，所以它本身生产的成本就相对会比较优秀。那么第二个，阿里在软件栈的优化上面确实要比其他厂商投入的力量要比较多，而且它有自己的大的软件平台，所以它出来的兼容性、或者说它输出的效果相应来说就会比较好。这个是 PPU 1.5 代，目前我们测到 TCU 最好的。 专家：那么当然另外一个就是昇腾的 950。昇腾 950 因为它的芯片其实是 FP……所以它在模型的支持上面的效率也会比较高。那么它当前的一些，只要不是太复杂的模型、或者说 CSP 的要求，其实它的效率也非常好。 专家：那么剩下的话，因为其他的芯片厂商，下一代芯片事实上其实都还没有量产，比如说地润的、摩尔线程的 S6000、沐曦的 C600、BN 的 BR200，因为这些都还没有量产，我只能从上一代的情况来看。上一代情况来看，其实从软件上面，比如说兼容性、或者说支持的情况来看，最好的是沐曦。从目前 C550 的测试情况来看，在不依赖于原厂支持的条件下，它的兼容性是我们测到最好的。那么它在软件上的投入相应就会比较少，但是它实际的硬件性能相对会弱一点。大概它的 TCU，如果以 token 生成的角度去计算的话，基本上它如果低于两点五万一个月每台，它是可以回本的。 专家：那么剩下的就是 DCU。那么DCU 其实最大的问题是它的软件、或者说算子优化做得有点拉胯，当然它的芯片本身其实非常好，但是发挥不出实际的效率。我大概的、我们能够实测到目前的一个情况就是这些。 十二、问答：哪些国产芯片能做基础模型预训练 主持人：好的，谢谢专家。然后我再补充一个，也是跟 AI 芯片实测性能有关的：国内这几家里面，谁的芯片做基础模型的训练效果会比较好一点，以及有没有一些典型的例子？ 专家：做什么？ 主持人：做那种基础模型训练。 专家：基础模型训练是吧？ 主持人：我再完整地说一遍：国内这种头部的 AI 芯片，哪些能够去做这种基础模型的训练、然后效果比较好的，目前有没有实测的一些例子？ 专家：你是说做预训练是吧？ 主持人：对。 专家：目前我们知道的预训练，就是比如说华为，它有做过一些非常小规模的模型预训练，效果其实现在我们拿不到太多的数据，但是这种体量的模型训练太小了，我觉得意义不是很大，通常都在小的十 B 的规模。另外一个我知道有在做训练的是阿里 PPU 的 1.0 那一代。 专家：那一代的话，应该市场上是没有销售的，它主要是针对一些特殊的项目才有销售。那款芯片是在美国对中国有正式限制之前流片的。那一代的训练效果相对还是不错，但是因为大部分都是涉密项目，我手上确实没有太完整的数据。 专家：所以笼统地说，现在国内的芯片拿来做预训练的，确实我没有看到特别好的。 十三、问答：单机柜功耗破百千瓦下的液冷部署进度 主持人：专家，我这里再补充两个问题。一个是现在以海外的比如 GB300 为代表，单机柜的功耗突破了一百千瓦，这种液冷部署现在的进度如何？然后国内在液冷方面的一些部署进展如何？ 专家：哦，液冷现在是这样子：浸没——不，冷板式的液冷其实交付的进度都还不错，主要是大的 CSP 或者某一些运营商，它本身机房的环境是不是能够支持这种大规模的交付。对于我们 ODM 厂商来说，已经基本上都可以 ready、批量交付了，这是冷板的。 专家：那么还有一个就是浸没的。浸没式其实在做的厂商并不多，但是我接手的几个项目里面，开始尝试性地在做先导项目的投入，针对的是现在单芯片小于一千瓦的环境，去做高密的浸没式测试。那么这个大概成熟的周期可能要在明年的 H1、上半年，估计可能会有比较明确的量产交付节奏。 专家：我补充一下：除了阿里磐久 128 的超节点，它基本上已经开始，大概在今年的九月、十月份可能开始量产交付了，这是一个比较快的；那昇腾当然是另外一个。海光的 DCU 用的是两相浸没式液冷，那这个它也已经具备了量产交付的能力。 专家：剩下的二线的这些超节点，它通常会有两种交付状态：一种超节点用的是液冷。那么风冷的话它会分，比如说可能没有太大变化的是昆仑芯——昆仑芯原来就有液冷的超节点，那它的规模相对比较小，以三十二卡为主；那么后面的 P900 也主要是液冷版本的超节点。那么像摩尔线程的 S6000，它风冷和液冷用的芯片是有一点不一样的，它风冷用的是单 die 的，液冷用的是双 die 的，那么最大可以到 128，双 die 的话可以到 256。那这个它的节奏基本上是在今年的年初开始定型、在设计，那应该在明年上半年交付。 专家：那么 BR200 的超节点，现在从设计的版图来看，它是八卡，那么它用的也是液冷的超节点。它的交付，首批应该在明年的三月份会有小的交付，大概加起来可能有小几十套、小几十柜。那么到了明年的年中，会根据这个规模可能出第二个版本，全国产的，连互联芯片可能都会选用国产的。那么根据实际测试效果，大概在明年的年底或者 Q4，可能会有万卡交付，也是超节点的形态。 十四、问答：国内超节点技术进展与下半年放量 主持人：好的，感谢专家的回答。下面是来自网络端的文字提问：想请教您，请问一下国内超节点技术进展如何？下半年放量是不是还是比较困难？谢谢。 专家：国内的超节点技术，我把它分成这么两类。一类就是具备全栈自研能力的，比如说昇腾，它从 CPU、GPU 或者加速卡，以及到互联芯片，全都是硬件自研；再加上它具备这个自研能力以后，它同时可以做像灵衢那样全栈的、内置语义的交互研发，那么这是一类。那么像阿里的磐久 128，它的核心的技术能力是在互联芯片的研发能力上很强，所以它的集成度、紧耦合程度相对来说仅次于昇腾。那么这两者之间最大的差距是在软件栈的兼容性方面。 专家：剩下的其他的国产芯片，我就把它们全部归类于另一类。那么这些厂商在超节点研发里面最大的短板是它的芯片的 C Die，比如说上面的 I/O Die，就是 Serdes 的数量也好，或者说如何去设计它的外引脚也好，以及和第三方的互联芯片怎么去达到最好的设计。因为这个互联芯片通常是第三方开发的，比如说我们国产的互联芯片，大家比较了解的盛科，还有像中兴微的，还有上海有一家叫可通智联的。那么这类的芯片其实国产的也有不少，但是真正要和 C Die 进行无缝连接、或者说让它的 scale up 做到最好是有难度的，因为并不是一家来设计。 专家：这个是我认为的国内超节点的情况。那么下半年，从现在的情况来看，除了昇腾 950 和阿里的磐久，其他都还没到量产的阶段。当然，昆仑芯的 P900 确实也可以量产，但是它类似——我把它归类为它的芯片是上一代的，它虽然具备了量产的能力，但是在某一些领域它不一定能适用，它的软件栈也做得不是特别好。那么我这样子回答，不知道是不是能够响应你的问题？ 十五、问答：PCIe 在超节点中的位置，需求会被削弱吗 主持人：好，谢谢分享。那么还有一个网络问题。请问一下超节点中 PCIe 是怎么样的存在？以及超节点趋势可能削弱 PCIe 芯片的需求吗？谢谢。 专家：你刚刚前面半句话是 PCI，意思是什么？不好意思，我这个可能是语音的问题。 主持人：他的提问是超节点中 PCIe 是怎么样的存在，以及超节点的趋势可能削弱 PCIe 芯片需求吗？谢谢。 专家：哦，超节点上面 PCIe 是什么样的存在，是吧？ 专家：从超节点的产品设计来说，从技术层面来讲，就是比如说你的 GPU 加速卡这一代出来以后，是 Serdes 直接连到你的 scale up 芯片；那么如果说我要去做 scale up，那可能就会由这一代出来的 PHY 独立拉出 RDMA 的网卡来提供对外部互联，或者直接拉出像超节点那样，直接拉出 Serdes、直接出光连接到它的交换柜。那么其实在这个里面 PCIe 的作用会被弱化，或者说它的规模到一定程度的时候，它才会用得到，而且要通过这个拓扑。就是我们在训练或推理里面，尽量少用 PCIe 这类的方式。 专家：那么如果说你第二个问题说这个 PCIe 的芯片或者卡后面会不会被替代——我在想你想问的是不是这类芯片会不会越来越少，或者说它的趋势是怎么样的？从目前来看，我觉得这类卡逐步地会往侧端或者边缘端去演进。我认为比如说当我们的模型到达一定程度以后，不管是量化也好，还是说我去做优化也好，它可以把这类模型压缩、塞到一张卡上面，作为侧端推理或者边缘端推理，这个时候 PCIe 的这种卡才会有用武之地。 专家：那么当前这个状态，我认为可能还有一段时间，这种八卡的机器会存在很长一段时间。因为超节点的话，首次的采购成本除了 CSP 和运营商能够支撑得了，像普通的行业客户其实是比较难支撑的。那么它更加倾向于我先用起来，所以八卡的 OAM 模组的形式会存在很长一段时间，因为这一类它比较适合于现在这个参数量越来越大的模型的部署方式。那么像 PCIe 卡的话，这类当前可能会下降一段时间吧，或者说可能不太会有上涨的空间。等到模型逐步收敛、或者说它的能力逐步提升上来以后，我认为这类卡会慢慢地上来，或者说在某些特殊领域，比如说在视频领域、传统的视频领域，或者在巡检，搭配比如说具身智能之类的，有可能它会有一定的规模量在里面。 十六、问答：ASIC 会对 GPGPU 形成实质性分流吗 主持人：专家，我这里再补充两个问题。一个是现在推理算力的需求在爆发，那么这种专用的 ASIC 芯片，是不是会对那种 GPGPU 形成实质性的分流？ 专家：ASIC 专用芯片……我觉得暂时还没到这个阶段，原因是现在模型并没有到达一个顶点。你用专用的 ASIC 芯片，虽然它的效率会比 GPU、CPU 芯片更好，但是它的人力资源投入成本太高了。当你的模型一旦迭代以后，你所有之前的这个投资全部都会归零。 专家：那么从目前比如说 CSP 来看，它也不太会去选择这类的卡，除非是它自己研发的。它自己做的这类卡，针对某一些非常特定的领域，它会部分采用这种芯片；通常它现在在做大规模推理 token 生成的时候，比较少采用这类的芯片。所以 ASIC 的芯片我觉得暂时可能还稍微早一点。 十七、问答：超节点的内存池化会导致内存需求下降吗 主持人：好的，感谢。下面是新增文字提问：想请教一下，请问超节点的内存池化会导致内存需求下降吗？谢谢。 专家：超节点里面的内存池化跟内存需求量，我觉得这是两个维度的问题。超节点里面的内存池化，主要是为了降低 token 的成本，以及比如说提升超长上下文的设计。那么如果说我能够做内存池化，比如说在一个超节点里面，我能够让我的 GPU 的 KV Cache 直接通过 CPU 管理下的内存去 offload，那么它的 token 体验、或者它的 token 效率，或者说我们在做问答的体验会非常好。它并不会导致我的内存需求量下降，可能反而会为了追求超长上下文，加大内存的使用量。 专家：那么另外一个角度，比如说在某一些领域，我要用 CXL 这种共享的内存池，可能相对来说会降低一些内存的消耗量，但这个目前来看还没有到那么清晰的时候。像 CXL 的这种共享内存池，以及还有其他的，像我看英伟达也提供了一套共享内存、专门为 KV Cache offload 的一个产品，虽然目标是为了降低内存的使用量，但是目前我觉得至少也得到 28 年才能看得清楚。现在我觉得还是可能得先追求我们在用模型的体验。 十八、问答：内存墙要靠软件还是硬件提升性能 主持人：好的，感谢。下面有一个新增文字提问：请教您，请问一下内存墙、算力墙是需要通过软件还是硬件提升性能？谢谢。 专家：内存条跟什么？不好意思，我有点没听清楚。 主持人：他说的是内存墙的那个问题，然后要通过软件还是硬件去提升性能。 专家：哦，内存墙是吧？是内存墙还是显存墙？如果是 GPU 里面的显存墙，肯定得先有硬件，软件上面只是一个加强而已。那么如果是单纯从 CPU 管理下面的内存，我觉得这依然要完成 CPU 和 GPU 的协议通信我才能够做得到。但是如果说针对于我们现在模型的一些体验，那么比如说刚刚前面讲到的 KV Cache 的一些 offload，以及可能还有一些其他的软件栈上面的优化，这个方面是可以通过一些软件来提升的。但是目前来看这个效率，除了从算子优化上面能有大幅提升，其他在内存上面好像提升也不是特别大。我们有测试过，比如说去把一些 GPU cache offload 到 CPU 上面去，但是如果 CPU 的性能不是特别好，它依然会效果不好。对于你刚刚说的内存，我还没理解到底具体是指哪一块。 主持人：他的意思就是 HBM 的那个大小的限制带来的这样一个问题。 专家：哦哦哦，那明白了，不好意思。那其实就是在工艺上面的问题，是 HBM 或者说 3D DRAM 的应用上面，对吧？是这个意思吗？ 主持人：对。 专家：哦，HBM 的内存墙这个问题，主要还是在工艺上，因为还有一个就是我们长鑫的产能上、性能上面。其实如果说从全球、从英伟达或者说三星、海力士那边来看，主要还是在散热上面的问题，但这个是在工艺上面，不是我擅长的领域。那么从我知道的情况来看，多层的堆叠肯定会出现散热问题。那现在不管是全球也好，还是国产也好，这个散热问题最终可能会出现在材料的选型上面：就是比如说多层之间我的热量怎么来传输出来，以及外部的热量怎么散得出去，那你才能够解决最终这个 HBM 堆栈怎么和你的 C Die 封到一起。 专家：那么国内现在 3D DRAM 的，就是东方创新的 DF1000 那颗芯片的第一次尝试，效果好不好，暂时可能我们还没有非常完整的数据。但是从目前来看，它的良率并不是特别好，所以它的成本和现在 HBM 的成本不会差距太大，我这个是我得到的一些信息。所以后面这个内存墙怎么来突破？我觉得一方面是工艺，另外一方面是材料。", "status": "extracted"}, "post:2026-08-05T13-45:73fe9f5701cd": {"id": "post:2026-08-05T13-45:73fe9f5701cd", "kind": "post", "title": "2026-08-05 13:45", "source_label": "帖子正文", "excerpt": "胜宏科技更新： 1）涛哥刚回国，M国待了10多天，大客户都跑了一圈，订单爆炸，kyber也在快速推进。", "content": "胜宏科技更新： 1）涛哥刚回国，M国待了10多天，大客户都跑了一圈，订单爆炸，kyber也在快速推进。 2）台湾专家又说阻抗搞定了。（我之前就觉得一个小工程问题多大点事）。Q3Q4产能为王，黄金时间#文字观点", "publish_time": "2026-08-05 13:45", "tags": ["文字观点"]}, "post:2026-08-05T15-03:6c1f32d27565": {"id": "post:2026-08-05T15-03:6c1f32d27565", "kind": "post", "title": "2026-08-05 15:03", "source_label": "帖子正文", "excerpt": "【国金计算机&电子】#胜宏科技：Q3_VR量产超核心受益_下半年产能为王 #Vera_Rubin进入Q3量产阶段_下半年高端PCB板产能为王_公司超核心受益 ——客户侧开始落地交付", "content": "【国金计算机&电子】#胜宏科技：Q3_VR量产超核心受益_下半年产能为王 #Vera_Rubin进入Q3量产阶段_下半年高端PCB板产能为王_公司超核心受益 ——客户侧开始落地交付。英伟达7月21日宣布，Vera Rubin NVL72已在CoreWeave、谷歌云、微软Azure和甲骨文云等平台启动部署，覆盖全球30个国家、350多个工厂节点。计算效率10倍提升。CoreWeave基于真实硬件运行DeepSeek-R1测试，结果显示Vera Rubin较Grace Blackwell NVL72每兆瓦Token吞吐提升约10倍。 ——我们认为今年下半年随着VR的量产出货及爬坡加速，高端PCB板将迎来产能为王时代，需求集中爆发、制造难度上升（单板压合&电镀需求倍增），必须提前锁定上游核心设备提前投产布局，才能将产能爬坡速度赶上客户需求增速，公司作为NV核心供应商，有望超核心受益。 #谷歌TPU_v8加速推进_公司下游客户有望更均衡 ——ASIC芯片加速释放。谷歌Ironwood仍是2026年TPU放量的基本盘，全年出货量预计超过330万颗；TPU v8则首次拆分为训练芯片TPU 8...", "publish_time": "2026-08-05 15:03", "tags": ["文字观点"]}, "post:2026-08-05T19-37:5793e155d91b": {"id": "post:2026-08-05T19-37:5793e155d91b", "kind": "post", "title": "2026-08-05 19:37", "source_label": "帖子正文", "excerpt": "【国联民生电子】胜宏科技更新-0805 ➠Rubin出货恢复正常，我们产业链验证没问题，当前compute及switch均正常出货，爬产中 ➠前期我们做过辟谣，“检测造假”等小作文", "content": "【国联民生电子】胜宏科技更新-0805 ➠Rubin出货恢复正常，我们产业链验证没问题，当前compute及switch均正常出货，爬产中 ➠前期我们做过辟谣，“检测造假”等小作文都是无稽之谈，NV设计较为前瞻激进，经常需要产业链配合解决问题，中间看到部分料号生产出现波折属于正常现象 ➠上游备货也可以验证，computeQ2备货较多，目前全产业均未达到Q2峰值，7-8月拉货情况胜宏仍是显著大份额，＃且近期显著加单；switch方面，当前催sy等供应商交货也非常紧张，预计保持大份额供应商。 风险提示：AI需求波动，产品迭代速度不及预期，行业竞争加剧等#文字观点", "publish_time": "2026-08-05 19:37", "tags": ["文字观点"]}, "post:2026-08-05T16-59:49ed944092aa": {"id": "post:2026-08-05T16-59:49ed944092aa", "kind": "post", "title": "2026-08-05 16:59", "source_label": "帖子正文", "excerpt": "周三舆情热度： ①算力硬件-机构称，预计2026年全球九大云厂商合计资本支出规模将突破8867亿美元，同比增幅接近90%。", "content": "周三舆情热度： ①算力硬件-机构称，预计2026年全球九大云厂商合计资本支出规模将突破8867亿美元，同比增幅接近90%。（利通电子、优刻得、中威电子、新开普、宏景科技等） ②AI应用-全球多模型聚合平台OpenRouter发布最新一周AI大模型调用量榜单，排名前五的产品全部由中国企业研发。（传智教育、凯撒文化、博彦科技、新开善、天下秀等） ③智能驾驶-《智能网联汽车自动驾驶系統安全要求》强制性国家标准正式发布，拟于2027年7月1日起正式实施。（山子高科、万集科技、优刻得、永兴光学、兴民智通、联创电子、浙江世宝等） ④芯片-韩国三星电子和SK海力士正在评估中国中微半导体的芯片制造设备，考虑将其用于旗下中国工厂。（山子高科、金海通、百合花、兴福电子、康强电子、中巨芯、光智科技等） ⑤低价股-市场高低切效应显著，低价股作为长时间被压制抽血的板块，价值有望得到重估（山子高科、凯撒文化、中公教育、金一文化、大众交通等等）#文字观点", "publish_time": "2026-08-05 16:59", "tags": ["文字观点"]}, "post:2026-08-05T07-41:2d2787d4e013": {"id": "post:2026-08-05T07-41:2d2787d4e013", "kind": "post", "title": "2026-08-05 07:41", "source_label": "帖子正文", "excerpt": "【广发计算机刘雪峰团队 | 重申算力租赁推荐逻辑】我们此前在6月30日的算力租赁深度报告中就深度解析了算力租赁这一商业模式中的三大特点。", "content": "【广发计算机刘雪峰团队 | 重申算力租赁推荐逻辑】我们此前在6月30日的算力租赁深度报告中就深度解析了算力租赁这一商业模式中的三大特点。 1️⃣长周期签约模式锁定稳定现金流，依托头部客户刚性资本开支，盈利可预测性强。 2️⃣高端GPU芯片具备可观的长期使用价值与硬件残值，可以有效平滑重资产投入风险。 3️⃣算力Token分成可开辟新盈利点。在上周末8月2日的AI模型系列专题报告中，我们又再次强调当前位置下算租的投资意义。我们判断，在当前国内算力供需失衡格局下，高端GPU采购价格不断上行，会进一步提高算租的重要性。 🌹重点公司：宏景科技、智微智能、盛视科技、杰创智能、赛意信息、行云科技以及首都在线等公司。#文字观点", "publish_time": "2026-08-05 07:41", "tags": ["文字观点"]}, "attachment:files/开源证券-通信行业点评报告：AI云，Token新时代-260804.pdf": {"id": "attachment:files/开源证券-通信行业点评报告：AI云，Token新时代-260804.pdf", "kind": "attachment", "title": "开源证券-通信行业点评报告：AI云，Token新时代-260804", "source_label": "开源证券", "excerpt": "（2） 【算力租赁】受益标的：宏景科技、协创数据、智微智能、行云科技、润 建股份、云赛智联、利通电子、超讯通信、中贝通信、航锦科技等；", "content": "通信 请务必参阅正文后面的信息披露和法律声明 1 / 3 通信 2026年08月04日 投资评级： 看好（维持） 行业走势图 数据来源：聚源 《左手海外算力，右手超节点 —行业 周报》 -2026.8.2 《谷歌和英特尔上调资本开支，利好 AI算力链—行业周报》 -2026.7.26 《 “北京 Token工厂”受益标的梳理 — 行业点评报告》 -2026.7.22 AI云：Token新时代 ——行业点评报告 蒋颖（分析师） 杜致远（分析师） jiangying@kysec.cn 证书编号： S0790523120003 duzhiyuan@kysec.cn 证书编号： S0790526070004  Token消耗两年暴涨 1400倍，算力需求指数级攀升 根据国家数据局统计， 全国日均 Token调用量从 2024年初的 1000亿跃升至 2026 年3月的 140万亿，增长超 1000倍；人工智能应用的增长拉动上半年互联网数 据服务用电量 494亿千瓦时，已接近 2024年全年水平。目前，人工智能正从训 练为主转向训练与推理并重 阶段，Token调用量仍处于指数级攀升通道，相关用 电量也将持续高速增长。 Token消耗的核心驱动力已从对话式 AI转向智能体， 单次 Agent任务 Token消耗可达传统问答的 数倍， 拉动算力需求呈现乘数式增长。  Token分成模式兴起，传统算力租赁与 Token交付双线并举 2026年以来，多家上市公司宣布探索 “Token工厂”业务，行业商业模式从按 GPU时长租赁升级为按 Token交付计费的 TaaS（Token -as-a-Service）模式。全 球算力巨头也在加速布局类似模式： 英伟达 2026年7月全新的 AI基础设施合作 模式，将通过收入分成和信用支持机制，与 AI云服务商共同建设大规模、多租 户AI工厂，帮助初创企业、模型开发者、企业及科研机构更快获得 AI算力， 同时为英伟达创造与算力使用量挂钩的持续性收入 。国内方面，三大运营商在 WAIC 2026 上集体转向 Token经营。中国信通院在 2026可信云大会上正式发布 Token云服务分级分类评估体系，标志 Token服务进入标准化时代。  Token工厂全面落地，看好国产 AI全产业链投资机 会 Token工厂的概念最早由英伟达 CEO黄仁勋提出，将传统数据中心转型为生产 Token的现代化工厂。 2026年Token工厂正从概念走向规模化落地：商汤大装置 宣布日均 Token服务量已达 2.42万亿，预计到 2026年底将攀升至日均 10万亿， 全年实现 25倍增长；华为云基于灵衢网络支持 10万卡级集群规模，千卡每秒吞 吐达 500万Token。我们认为， Token正从 AI底层技术单元上升为数字经济的核 心价值载体， Token工厂的规模化建设将沿产业链层层传导，驱动全产业链景气 上行，看好国产 AI链从网络端、计算端、 AIDC等全产业链投资机会 。 国产算力全产业链： （1） 【交换网络】推荐标的：盛科通信、锐捷网络、紫光股份、中兴通讯； （2） 【算力租赁】受益标的：宏景科技、协创数据、智微智能、行云科技、润 建股份、云赛智联、利通电子、超讯通信、中贝通信、航锦科技等； （3） 【计算端】推荐标的：紫光股份、欧陆通；受益标的：寒武纪、海光信息、 浪潮信息、华勤技术、烽火通信等。 （4） 【光通信】推荐标的：中际旭创、新易盛、杰普 特、华工科技、源杰科技、 仕佳光子等； （5）【AIDC】推荐标的：光环新网、大位科技、奥飞数据、新意网集团、润泽 科技等； （6） 【液冷】推荐标的：英维克；受益标的：申菱环境、银轮股份、领益智造、 飞龙股份、大元泵业等。  风险提示： AI发展不及预期、行业竞争加剧、中美贸易摩擦等 。 0%38%77%115%154%192% 2025-08 2025-12 2026-04通信 沪深 300 相关研究报告 行 业 研 究 行 业 点 评 报 告 开 源 证 券 证 券 研 究 报 告 仅供内部参考，请勿外传！ 行业点评报告 请务必参阅正文后面的信息披露和法律声明 2 / 3 特别声明 《证券期货投资者适当性管理办法》 、 《证券经营机构投资者适当性管理实施指引（试行） 》已正式实施。根据上述 规定，开源证券评定此研报的风险等级为 R4（中高风险） ，因此通过公共平台推送的研报其适用的投资者类别仅限 定为专业投资者及风险承受能力为 C4、C5的境内专业 投资者。若您并非专业投资者及风险承受能力为 C4、C5的境 内专业投资者，请取消阅读，请勿收藏、接收或使用本研报中的任何信息。 因此受限于访问权限的设置，若给您造成不便，烦请见谅！感谢您给予的理解与配合。 分析师声明 本研究报告的署名人员具有中国证券业协会授予的证券投资咨询执业资格或相当的专业胜任能力， 以勤勉的职业态 度，独立、客观地出具本报告，并对内容和观点负责。本报告清晰准确地反映了署名人员的研究观点， 所包含的分 析基于各种假设，不同假设可能导致分析结果出现重大不同。本报告采用的各种估值方法及模型均有其局限性，估 值结果不保证所涉及证券能够在该价格交易。本报告署名人员保证他们报酬的任何一部分不曾与，不与，也将不会 与本报告中具体的推荐意见或观点有直接或间接的联系。 股票投资评级说明 评级 说明 证券评级 买入（ Buy） 预计相对强于市场表现 20%以上； 增持（ outperform ） 预计相对强于市场表现 5%～20%； 中性（ Neutral） 预计相对市场表现在－ 5%～＋ 5%之间波动； 减持（ underperform ） 预计相对弱于市场表现 5%以下。 行业评级 看好（ overweight ） 预计行业超越整体市场表现； 中性（ Neutral） 预计行业与整体市场表现基本持平； 看淡（ underperform ） 预计行业弱于整体市场表现。 备注：评级标准为以报告日后的 6~12个月内，证券相对于市场基准指数的涨跌幅表现，其中 A股基准指数为沪 深300
