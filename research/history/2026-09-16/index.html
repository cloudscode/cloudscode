 "source_details": {"post:2026-09-16T09-11:04246b7b769c": {"id": "post:2026-09-16T09-11:04246b7b769c", "kind": "post", "title": "2026-09-16 09:11", "source_label": "帖子正文", "excerpt": "高盛——专家电话会纪要：英伟达800VDC架构对电气设备行业的影响 高盛总结了与数据中心行业资深专家Herve Tardy的后续投资者电话会要点。Tardy先生拥有30年行业经验（曾任职于伊顿、施耐德电气），本次电话会聚焦于英伟达提出的800VDC（800伏直流）电源架构下数据中心电气设备需求前景及", "content": "高盛——专家电话会纪要：英伟达800VDC架构对电气设备行业的影响 高盛总结了与数据中心行业资深专家Herve Tardy的后续投资者电话会要点。Tardy先生拥有30年行业经验（曾任职于伊顿、施耐德电气），本次电话会聚焦于英伟达提出的800VDC（800伏直流）电源架构下数据中心电气设备需求前景及竞争格局的更新研判。核心结论：800VDC技术采用进度慢于年初预期，主要由于AI推理需求增长超预期且对功率密度要求较低，传统架构仍具生命力；全系800VDC部署至少需五年，短期更可能仅服务器采用800VDC，而网络、存储、照明等仍沿用传统架构。英伟达Kyber NVL144机架系统（搭载Rubin Ultra GPU）已推迟至2028年，较原定2027年目标延后逾12个月。 800VDC渗透率下调，传统架构需求依然强劲 Tardy预计，到2030年，800VDC架构在美国新建数据中心中的占比将从年初预测的25%下调至21%，欧洲从20%下调至17%。下调主因是AI推理市场增速远超预期——AI推理单机柜功率上限仅约150千瓦，传统数据中心架构仍可满足，因此800VDC在AI推理场景的应用概率极低，推理负载的架构升级大概率仅限于从风冷转向液冷。至2032年，非AI数据中心仍将占据主导地位：以微软为例，其计划到2032年部署38GW装机容量（未来六年复合年增长率约20%），其中非AI数据中心将占三分之二（对应17%的复合年增长率），AI数据中心占三分之一（对应35%的复合年增长率）。这意味着传统电源架构仍存在巨大市场空间，且利润率预计高于800VDC架构，利好尚未布局固态变压器（SST）的厂商如罗格朗（Legrand）。 电气设备制造商产品路线出现分化 各厂商对800VDC过渡期的产品策略各异：台达电子（Delta Electronics）正在亚洲开展5MW SST试点，该功率被视为数据中心SST的最佳平衡点；伊顿（Eaton）计划于2026年底向客户送样2MV SST，技术源于其2025年收购的Resilient Power。相比之下，施耐德电气、维谛技术（Vertiv）和ABB当前聚焦于800VDC的中间态产品——施耐德主推变压器整流单元（TRU）和直流整流器；Vertiv与ABB则推出中压不间断电源（MV UPS），虽迈出向800VDC过渡的一步，但仍基于传统技术。通用电气韦尔诺瓦（GE Vernova）同样宣布了MV UPS（功率达175MW，而ABB为1-2MW），并仍积极研发SST，预计2027年推出。初创企业Heron Power（被视为最活跃的新进入者）正在开发5MW SST，新生产基地预计2027年底就绪。 太阳能企业试图切入SST领域，但壁垒高企 Enphase与SolarEdge等太阳能公司正尝试进入SST市场，尽管可借力其深厚的直流配电技术积累，但在满足数据中心关键任务运营的严苛要求（尤其是冗余等级）以及现场服务能力方面存在显著短板。技术路线上，SolarEdge采用碳化硅开发典型SST，Enphase则尝试并联氮化镓以实现驱动直流所需的兆瓦级功率。 超大规模客户积极发标，但SST量产窗口推迟至2029年 超大规模云厂商正就SST发出海量提案邀请书（RFP），此举大概率意在测试价格与批量敏感度。受制造规模不足影响，当前SST价格高企（约每兆瓦40万-50万美元），因此云厂商正重点与不同供应商开展试点以充分验证技术。一旦优选产品类型确定，评估与采购周期预计还需12至18个月，从而将SST最早大规模部署窗口推至2029年。 技术焦点转向固态断路器，单兆瓦成本飙升 市场关注点正转向800VDC过渡中另一关键产品——固态断路器（Solid State Breakers）。传统架构断路器动作时间为毫秒级，而800VDC要求微秒级响应，这不仅开发难度极大，成本也极为昂贵（约每兆瓦60万美元，是当前断路器价格的5倍，且显著高于SST的40万-50万美元）。受此高技术成本推动，未来每兆瓦电源链价值量将持续攀升：到2030年，AI训练全电源链预计需400万美元/兆瓦（2025年为170万-180万美元/兆瓦），AI推理需260万美元/兆瓦（2025年为140万美元/兆瓦）。 AI推理经济性认知转变，Token最大化策略遇冷 围绕Token输出优化的争论对AI训练至关重要，但在AI推理语境下其相关性正在减弱。企业客户（而非超大规模云厂商）承担着绝大多数推理工作负载，他们逐渐意识到，从成本效率角度看，“Token最大化”理念往往适得其反。除药物研发等特定算力密集型领域外，典型企业应用并不需要大规模、高密度的AI计算集群。 近期催化剂与行业会议 未来数月关键催化剂包括10月12日至15日的开放计算项目（OCP）峰会，以及10月20日至22日的英伟达GTC大会。当前OCP与英伟达引领行业技术思潮，而原始设备制造商（OEM）整体更关注新技术上市速度。产品差异化讨论尚不多见，预计将在4至5年后第二代SST开发阶段才会浮现。 结论 800VDC架构的渗透节奏放缓印证了传统电气设备在电力密度要求较低的AI推理场景仍具成本优势，非AI数据中心的长周期增长为传统电源厂商提供了稳固的基本盘。短期SST与固态断路器的高成本将推高单兆瓦价值量，但量产与大规模部署仍需时日。投资者应密切关注OCP与GTC大会的技术风向，同时警惕技术路线分化及厂商执行风险。优选标的需聚焦在过渡期产品（如MV UPS、整流器）上具备先发优势、且能平衡传统业务现金流与新兴技术投入的电气设备龙头。#文字观点", "publish_time": "2026-09-16 09:11", "tags": ["文字观点"]}, "post:2026-09-16T15-29:5454a9855ad5": {"id": "post:2026-09-16T15-29:5454a9855ad5", "kind": "post", "title": "2026-09-16 15:29", "source_label": "帖子正文", "excerpt": "大模型跟踪：智谱商业化进入加速期，CSP+CoWork打开新增量【中泰传媒互联网】 🔥智谱最新年底ARR指引由24亿美元上调至#30亿美元，核心来自Coding、CSP合作及CoWork三条业务线共同驱动。⚡️Coding继续保持高增，ZCode用户数已由上线首月100万进一步翻倍至约200万，进入", "content": "大模型跟踪：智谱商业化进入加速期，CSP+CoWork打开新增量【中泰传媒互联网】 🔥智谱最新年底ARR指引由24亿美元上调至#30亿美元，核心来自Coding、CSP合作及CoWork三条业务线共同驱动。 ⚡️Coding继续保持高增，ZCode用户数已由上线首月100万进一步翻倍至约200万，进入国内Coding Agent前三，商业模式逐步形成企业级API+Coding Plan双轮驱动。 ⚡️CSP模式取得突破。公司已与国内外T1级云服务商推进托管及收入分成合作，无需自行承担全部全球推理基础设施投入，同时借助云厂商客户和开发者生态实现快速分发，进一步验证“开放模型扩大生态+CSP托管实现商业化”的闭环，相关收入预计10月后开始逐步体现。 ⚡️CoWork则成为下一阶段重要增量。网络安全已率先跑通商业路径，已有100多家安全企业接入GLM，相关订单规模超过10亿元。公司认为核心并非单一订单，而是验证了“生产级模型能力→可验证结果→增量ROI”的商业逻辑，未来有望向金融、法律、工业、制造等场景复制。 📌此外，公司当前算力乘数约0.46，GLM-5.3/5.3 Flash在60% GPU负载率、70%价格实现率假设下理论推理毛利率约76%，算力投入效率及商业闭环进一步改善。 📝我们认为，随着Coding持续放量、CSP全球分发路径逐步跑通以及CoWork向更多垂直场景复制，模型商业化有望进一步提速，开放模型的收入天花板也有望持续打开。 👉建议关注：#模型侧：智谱、MiniMax；#云厂商CSP：阿里巴巴、腾讯控股；#企业Agent支持：迈富时等；#Token运营及垂类数据：易点天下、荣信文化、中国科传等。 风险提示：政策风险、技术风险等 🌹更多大模型行业观点欢迎交流&派点请支持中泰传媒互联网团队： 康雅雯 陈志祥#文字观点", "publish_time": "2026-09-16 15:29", "tags": ["模型侧", "云厂商CSP", "企业Agent支持", "Token运营及垂类数据", "文字观点"]}, "post:2026-09-16T07-26:b462a96004d9": {"id": "post:2026-09-16T07-26: 矿从 100美元涨到 250美元，全球 15%产能停 产至今，缺口还会进一步扩大。 4、发改委整治低价无序竞争，电力行业迎来制度性拐点，煤价供需齐涨，年度电价合同酝酿期 到了，火电盈利要翻身。 【本文来自持牌证券机构，不代表平台观点，请独立判断和决策】 摘要： 1、PCB涨价：招商证券指出， PCB行业近期变化大。特别是非 AI领域PCB环节的涨价大超预 期，Q3多数中小 PCB厂商净利率已修复至历史高点 10+%。定价模式从 “跟随材料同频 ”升级为 “提前锁定未来 2-3个月涨价预期 ”。AI-PCB领域，正处于新品拉货、良率爬升阶段，新品价格 及利润率都非常可观， H2业绩释放令人期待。关注超声电子、奥士康、鹏鼎控股、景旺电 子、深南电路等。 2、导热材料： AI芯片局部热点热流密度突破 600W/cm² ，TIM从边缘辅材升级为散热第一道物 理瓶颈，英伟达 Rubin平台全面转向石墨烯热界面材料，全球 TIM市场预计 2031年翻倍扩容。 无盖裸片与 3D堆叠催生从 0到1的纯增量，高端供给因长达数年的认证周期持续偏紧。中石科 技、德邦科技、苏州天脉、阿莱德、飞荣达等卡位厂商有望率先受益。 3、钽金属： 2026年初，刚果（金） Rubaya矿区塌方停产，中断了全球 15%以上的钽供给， 至今未复产。需求端， AI算力带动钽电容约一年内连续四轮提价、国内钽粉出口同比增长 46%，先进制程拉动钽靶材涨价，燃气轮机与军工需求同步放量。供给端，全球 84%的产量 集中在非洲手工矿区，未来 3-5年新增项目极少。据测算，钽需求年复合增速约 7.3%，远超供 给的2%-4%，2030年缺口将走阔至 912吨，钽精矿价格已从约 100美元/磅涨破 250美元/磅， 价格中枢上移趋势明确。关注：东方钽业、中矿资源、新金路。 4、火电： 长江证券研报指出，电力行业迎来三重利好共振：国家发改委和市场监管总局出手 整治低价无序竞争，电价有了制度性修复预期；煤价涨到 1000元/吨、用电负荷连创新高，供 需边际趋紧；火电公司中报也验证了电价改善。当前正处年度电力交易合同酝酿窗口期，煤 价与供需共振叠加政策深化，电价上涨预期强化，煤电一体化标的和高股息火电值得关注。 标的：国电电力、陕西能源。 正文： 1、PCB产业链走访调研：非 AI领域PCB涨价大超预期、 “保供”为第一要务， AIPCB新品拉货利润率非常可观   招商证券指出， PCB 行业近期变化大。特别是非 AI 领域 PCB 环节的涨价大超预期， Q3 多数中 小PCB厂商净利率已修复至历史高点 10+% 。定价模式从 “ 跟随材料同频 ” 升级为 “ 提前锁定未来 2-3个月涨价预期 ” 。 AI-PCB 领域，正处于新品拉货、良率爬升阶段，新品价格及利润率都非 常可观， H2 业绩释放令人期待。关注超声电子、奥士康、鹏鼎控股、景旺电子、深南电路 等。 1）非 AI领域 PCB 环节的涨价大超预期 招商证券近期 对PCB产业链完成 10+ 场调研，覆盖多家上市公司，包括上游覆铜板龙头、高阶 算力板厂商、中小厂商及特色下游 PCB 板厂等，边际变化较大的是 非AI领域 PCB 环节的涨价 大超预期，二三线厂商盈利大幅修复。 本轮CCL 涨价已运行 4-5 个季度， PCB 顺价已全面打通。结合产业链调研， CCL 每月涨价节奏 保守预期持续至 2027 年 6 月、后高位横盘，乐观预期将持续至 2027 年底，本轮与历史周期的 本质区别在于供给端存在硬约束（玻纤布供给紧张， AI 需求占用玻纤布大量产能；铜箔 HVLP 升级推动加工费用持续上涨），涨价核心驱动为供给端而非需求端。 PCB环节顺价机制全面打通， 定价模式发生根本性变化。 中小厂商从 5 月份开始，逐月提价，目前已完成 4-5 轮涨价， 定价模式从 “ 跟随材料同频 ” 升级 为“提前锁定未来 2-3 个月涨价预期 ”，按照出货时点的市场即期现货 CCL 价格进行定价， Q3多 数中小 PCB 厂商净利率已修复至历史高点 10+%，结合订单排产情况，预计净利率在 Q4 还有 进一步上升空间。 2）能拿到 CCL 货源的 PCB 厂商才具备稳定的保供能力 普通CCL 供给货源稀缺，能 拿到CCL 货源的 PCB 厂商才具备稳定的保供能力，才拥有接单涨 价的底气。 上市和未上市的厂商在获取供应链资源的能力相差巨大，未上市公司难以获取稳定的 CCL 货 源，普遍是溢价拿货，溢价的情况下再进一步向下游传导更是困难，导致未上市的中小厂商 出现停工、倒闭等现象，而上市公司依靠规模优势、充足的现金流，长尾市场需求在不断涌 入，订单能见度超 3 个月。 供需关系持续优化，尽管中观层面下游需求未有明显改善，但 下游终端客户将 “ 保供 ” 列为第 一要务，保住自己的市场份额，对于价格的接受度高于市场预期。 3）AI-PCB 领域，关注新产能与新技术 25H2-26H1PCB 厂商均加大了对 HDI 、高多层、 mSAP 产能的投入，但关键瓶颈工序的设备供 给瓶颈突出， 提前锁定了相应设备的厂商才有机会开出相应的高端产能。 此外，随着 AIPCB 的持续升级，加工难度日益加大，良率的提升依靠的是稳健的技术管理团 队，人才供给亦是瓶颈之一。 在新一代算力产品投入量产后，发现供给格局依然会有较大的变化，后排二线厂商依然有较 大的机会在大客户供应链体系中实现份额跃升 ，如景旺电子、鹏鼎控股等。目前 AIPCB 环节 正处于新品拉货、良率爬升阶段，新品价格及利润率都非常可观， H2 业绩释放令人期待。 4）五条技术迭代主线的价值量跃迁明确 其一，速率升级牵引材料升级 ，AI高速传输需求带动板材向 M9/M10 、 PTFE 等升级， 448G 速 率下现有 PCB/CCL 材料体系仍可适配，新材料体系的物理瓶颈预计 2029 年之后出现。 其二， mSAP 从光模块向服务器、交换机全场景扩展， 1.6T光模块 PCB 全面转向 mSAP 工艺， 且1.6T对产能的消耗显著高于 800G ，算力领域更多的料号加工工艺也在向 mSAP 升级。 其三，内埋电容与垂直供电架构演进带来价值量三级跳 ：谷歌 TPU 电源板从 V8 升至 V9 以及 V10埋电容方案，单颗价值量逐代翻番增长至千元以上，电源架构变革趋势预计持续至 2035 年。   其四， 2028 年 CoW oP 与正交背板方向逐步清晰，背板层数已达 78-168 层，技术代际切换是既 有竞争格局的潜在变量。 其五，陶瓷基板技术：考虑到单 GPU 功耗的大幅提升， PCB 板的散热需求亦在增加，相应的 在计算板中加入陶瓷基板的技术方案的必要性和可行性被产业和市场关注，产业链的开发进 度已较为顺利，有望成为明年的可选方案版本。 关注CCL ：生益科技、华正新材、南亚新材、金安国纪等；中小 PCB 厂商：超声电子、奥士 康、崇达技术、满坤科技、澳弘电子、博敏电子等；海外算力板以及光模块 mSAP 有较大边际 变化的景旺电子、鹏鼎控股以及同时具备 “AI 算力板 +mSAP+ 载板 ” 三重向上逻辑的深南电路。 上游的玻纤、陶瓷基板、铜箔、球形粉、电镀液、激光钻孔机、 LDI 曝光机等诸多产业链环 节。 01 2、散热器的缝隙里藏着一门有望翻倍的导热材料生意，高端供给被数年认证周 期锁死， TIM 从辅材变成第一道瓶颈 浙商证券指出， AI 功耗跃迁让 TIM 从边缘辅材升级为散热链路第一道物理瓶颈，英伟达 Rubin 平台已全面转向石墨烯热界面材料，无盖裸片与光模块催生从 0 到 1 的纯增量，高端供给因漫 长认证周期持续偏紧。 中石科技 、德邦科技 、苏州天脉 、阿莱德、飞荣达等卡位厂商值得关 注。 1）功耗跃迁， TIM 从辅材变第一道瓶颈 TIM是填充在芯片与散热器之间的 “ 导热垫 ” ，解决的是两个固体表面因微观不平产生的接触热 阻：接触面通常存在 5 至 50 微米的空隙，空气导热系数仅 0.026W/m·K ，相当于缝隙里垫了一 层热的绝缘体。 TIM 靠自身的流动性或柔韧性填满这些肉眼看不见的微米级缝隙，在发热源与 散热器之间建立连续的热传导通路。 AI芯片功耗持续突破，局部热流密度不断攀升，新一代 GPU 局部热点热流密度已突破 600W/cm² ，传统风冷走到物理极限，冷板式、浸没式液冷大规模落地。 热量能否顺利从芯片 传出，第一道关卡就是 TIM 的热阻，它直接决定结温是否越过安全阈值、芯片能否维持满负载 运行。 TIM 由此从边缘辅材，升级为散热链路中绕不开的技术瓶颈。 材料路线随之全面迭代：传统硅脂易泵出、干涸、挥发分层，铟基液态金属导热虽强但工艺 复杂、成本高企，碳基石墨烯路线则兼顾高导热与无硅油挥发，垂直取向石墨烯垫片的导热 系数可达 130W/mK 以上，同时催生 TIM1.5 、 TIM3 等全新层级，高端市场呈梯度紧缺。 02   2）英伟达换路线，高端 TIM 价值量水涨船高 最直接的信号来自英伟达：新一代旗舰平台 Vera Rubin 取消了此前备受瞩目的液态金属方 案，转向全面采用新型石墨烯热界面材料。 液态金属导热系数虽高，但工艺复杂、维护成本 高；此前 Blackwell 平台使用的高性能相变材料与导热硅脂，又在化学侵蚀、高导电性上存在 隐患。石墨烯路线兼顾高导热、抗泵出、长寿命与绝缘可靠性，成为更优解。 全液冷与微通道冷板方案下， TIM2 成为制约整体热抽取效率的关键热传导界面，在散热 BOM 中的价值权重有望上升。市场空间同步打开： 2024 年全球 TIM 销售额为 20.12 亿美元，预计 2031年增至 41.48 亿美元，年复合增速 10.74% ；中国市场同期从 10.27 亿美元增至 21.64 亿美 元，复合增速 11.09% ，快于全球，并占据过半份额。 03 3）无盖裸片与光模块，催生全新纯增量 纯增量来自封装架构变革。无盖裸片设计取消了散热顶盖， TIM1.5 直接成为裸片与冷板、散 热器之间的界面层，这一层在传统带盖封装中并不存在，且对耐热冲击与贴合致密性的要求 比TIM1更苛刻； 3D 堆叠架构又带来传统服务器时代没有的层间散热需求。两者都是全新开辟 的增量层级，而非对既有 TIM 的简单替代， TIM1.5 有望成为下一阶段潜在最紧缺的方向。 光模块是另一条增长曲线。随着传输速率向 1.6T 及更高速率演进，内部 DSP 、驱动器等器件 在有限空间内形成更集中的热源， TIM 作为芯片封装表面与金属壳体间隙的填充物，需求潜力 较大，散热方案也由界面材料向 VC 均热板与液冷冷板延伸。 04 4）认证锁死供给，结构性紧缺开始兑现   高端TIM并非材料全面短缺，短缺的是通过头部客户认证的有效供给。它属于芯片级关键物 料，直接影响 GPU 结温与算力输出，下游客户需完成高低温循环、湿热、长期压缩、系统级 等多维可靠性测试，认证周期长达 1 至 3 年。新进入者短期内无法形成有效供给，已通过认证 的龙头则获得极强的客户粘性，这条供应链不是 ‘ 想进就能进 ’ 。 实证已经出现：未上市的石墨烯龙头 鸿富诚凭借先发优势进入全球头部 AI 芯片企业供应链， 2025年碳基导热垫片收入达 2.52 亿元，较 2023 年翻了 6 倍。价格、交期、二供导入与高端产 品收入的同步改善，将构成结构性紧缺向业绩传导的直接证据。 05 相关公司 中石科技 ：高端 TIM2 龙头，材料覆盖最全，含液态金属与石墨烯，材料加器件一体化，向 VC、冷板及液冷模组延伸，并通过头部客户验证。 德邦科技 ：TIM1/1.5/2 平台化布局，收购泰吉诺补齐金属基垫片， TIM1 已通过头部客户全套 可靠性测试，即将转量产。 苏州天脉 ：热界面材料与散热器件协同完整，产品矩阵覆盖五大类 19 个细分品类， TIM 最高导 热系数约 15W/mK 。 阿莱德：差异化新材料路线，取向碳纤维垫片在 40W/mK 基础上取得新突破，氮化硼系列进入 配方与工艺定型阶段。 飞荣达：散热模组与 TIM 协同切入 AI 服务器，石墨片与导热石墨膜优势显著，关键看 AI 服务器 订单落地与毛利表现。 3、AI算力的隐藏账单正落在这种战略金属上，钽精矿从 100 美元涨到 250 美 元，全球 15% 产能停产至今，缺口还会进一步扩大 2026年初，刚果（金） Rubaya 钶钽矿区两度塌方停产，这片贡献全球 15% 以上钽供给的区域 至今未复产。另一边， AI 服务器把钽电容在约一年内买涨四轮，钽精矿价格从 2025 年底约 100 美元/磅涨破 250 美元 / 磅。供给端非洲手工矿区主导、新增项目寥寥，需求端 AI 、先进制程、 高端装备多点开花，钽的供需缺口正趋势性走阔。关注： 东方钽业 、中矿资源 、新金路。 1）AI算力带涨钽电容，靶材、燃机、军工需求同时上量 钽电容是钽的第一大用途 ，占全球钽消费约三分之一 。它能在很小的体积里做到高容值，而 且容量不随偏置电压变化，在低温和高温下都保持稳定，这是 MLCC 做不到的。 AI芯片功率越来越大，对电源稳定性和散热的要求同步抬高，高容值、耐高温的钽电容正好 完美适配这部分需求。 06   AI巨量需求已经体现到价格上， 自2025年 6 月以来，钽电容龙头国巨及旗下基美已连续四轮提 价，2026 年 7 月全系列平均调涨约 50% 。作为行业风向标，国巨钽电容营收已连续十个季度环 比增长。 07 电容涨价向上游传导，我国电容级钽粉出口随之放量。 2026 年 1-7 月，国内钽粉出口同比增长 46%， 7月单月出口环比继续增长。 08   半导体是第二个引擎。 铜已成为高端芯片的主流布线材料，钽作为铜互连的阻挡层 ，能防止铜向硅基底扩散，先进 制程对钽靶材的用量和纯度要求都更高。供需两端挤压下， 2026年一季度钽靶材价格涨幅已 扩大至 60%-70% ，海内外核心靶材厂商正密集扩产，高纯钽采购需求即将放量。 第三个引擎来自高温合金。 全球发电用燃气轮机需求从 2019 财年的 36.8GW 增至 2025 财年的 96.1GW ，数据中心用电是主 要拉动，三巨头订单排满而产能扩张有限。 钽凭借耐超高温特性用于航空发动机和燃机热端 部件，高温合金的缺口会逐步传导为钽的增量消费。 09 10   军工是压舱石。钽涂层用于火炮身管抗烧蚀，高密度特性让钽成为爆炸成形弹药型罩的主力 材料。 2）供给端：全球 84% 的产量攥在非洲手工矿手里， 3-5 年内新增供给极少 全球钽产量的 84% 集中在刚果（金）、卢旺达和尼日利亚三国，且以手工采矿为主 ，缺乏系 统的资源勘查和合规审计。曾长期主导全球供给的澳大利亚， 2025 年产量只剩 50 吨，较顶峰 缩水约 95% ，莫桑比克产量更是近乎归零。单一国家产量的剧烈波动，暴露出这条供应链的 脆弱。 11 新增供给同样非常有限。 据不完全统计，全球共有 64 个钽矿项目，其中在产矿山只有 13 座，其余大多停在勘查或可研 阶段。钽矿从可研到投产通常需要数年， 未来3-5年内能形成有效新增供给的项目极为有限， 在产矿山又多依赖锂、锡副产，钽缺乏独立增产弹性。 此外，合规管制在进一步收紧，美国、欧盟先后把钽列入关键矿产并设置冲突矿产尽调门 槛，M23 武装控制刚果（金） Rubaya 矿区后，相关产出拿不到认证标签，被正规下游屏蔽， 本就不足的合规钽矿供给雪上加霜。 3）供给增速不足需求一半，缺口到 2030 年将走阔至 912 吨 以2025年全球钽产量约 2500 吨为基数，考虑合规溯源趋严、 Rubaya 停产未复与优质项目稀 缺，2026-2030 年供给年复合增速预计仅 2%-4% 。 需求端的斜率明显更陡， 2026-2030 年钽需求年复合增速约 7.3% ，是供给增速的两倍以上 ， 其中钽靶材是最快的分项。 供需增速错配下，缺口逐年扩大，到 2030 年将走阔至 912 吨。 12 4）对于我国来说，钽资源依赖进口，深加工壁垒极高是国内企业的优势领域 我国钽资源矿床类型多样、品位较低、多为共伴生矿产 , 总体禀赋不佳。 2026 年上半年我国铌 钽精矿进口同比增长 38.9% ，九成以上来自非洲。13   中国铌钽产业中游加工优势显著，湿法产品占全球市场的 70% 以上，国内技术成熟的厂家包 括东方钽业 、稀美资源、九江有色、衡阳金新莱孚等；火法产品占全球市场的 50% 以上，国 内厂商主要包括 东方钽业 、稀美资源、中钨稀有金属等。 下游的钽电容、钽靶、医疗器械等高附加值产品主要由美国、德国、日本等发达国家垄断。 14 5）相关公司 东方钽业 ：国内钽铌全产业链龙头，掌握钽粉与高纯钽锭核心技术，高性能钽粉国内市占率 66%以上。 中矿资源 ：手握 Tanco 与 Bikita 钽矿资源， Bikita 自有钽精矿选矿线达产后预计年产钽精矿 500- 600吨。 新金路：关注标的。碱主业跨界钽铌，旗下栗木矿一期达产后年产氟钽酸钾 500 吨、氧化钽 50 吨。 4、发改委整治低价无序竞争，电力行业迎来制度性拐点，煤价供需齐涨，年度 电价合同酝酿期到了，火电盈利要翻身 长江证券研报指出， 电力行业迎来三重利好共振：国家发改委和市场监管总局出手整治低价 无序竞争，电价有了制度性修复预期；煤价涨到 1000 元 / 吨、用电负荷连创新高，供需边际趋   紧；火电公司中报也验证了电价改善。当前正处年度电力交易合同酝酿窗口期，煤价与供需 共振叠加政策深化，电价上涨预期强化，煤电一体化标的和高股息火电值得关注。 1）反内卷新政讲了什么，从原则性规范到可执行的成本认定 国家发展改革委、市场监管总局近日联合印发《关于重要工业品低价无序竞争成本核算有关 事项的通知》，进一步明确成本核算要求，为后续提醒告诫、行业自律和监管执法提供更具 操作性的制度依据。与 2025 年《关于治理价格无序竞争维护良好市场价格秩序的公告》相 比，那份文件提出的是治理框架、成本调查和监管要求，这次则进一步细化了成本核算规则 ——政策重心由原则性规范向可执行的成本认定和监管抓手延伸。 对电力行业而言， 2025 年底煤价下行、电力供需相对宽松，行业内部分主体出现低价竞争， 部分地区年度电力交易价格明显下行， 2026 年上半年部分区域火电公司盈利承压甚至亏损。 长江证券认为，合理的价格信号既是行业盈利和长期投资的基础，也是引导电源建设、调节 资源配置及保障系统安全稳定运行的重要机制，反内卷政策的持续深化有望改善电价合理形 成的政策环境，强化市场对电价修复的预期。 2）供需两端都在变，电价下行压力最大的阶段正在过去 供给端， 2025 年火电及新能源装机均迎来投产高峰期，进入 2026 年， 1-7 月行业新增装机呈现 阶段性降速。 需求端，前期部分地区极端高温带动制冷需求集中释放，多地用电负荷连创新高；数据中心 等新兴产业用电高速增长，共同带动全社会用电量保持较快增长。电力供需格局边际趋紧。 15 3）煤价再推一把，火电中报已经验证电价环比改善 煤价方面， 3 月以来受国内安监趋严、国际地缘形势扰动等影响 的反对，因为这些技术被视为敏感技术。 📄 SK 海力士在给路透社的一份声明中表示，该公司正在审视各种措施，包括建立额外的生产基地，以增强其存储业务的竞争力，但现阶段尚未确定任何事项。 💬 英特尔拒绝就其所称的猜测置评，但补充说，该公司正在继续对俄亥俄州进行投资，为该厂做好准备。 🇰🇷 当被问及 SK 海力士可能在美国生产芯片的计划时，韩国贸易部表示，任何决定都将由该公司自行决定，但如果涉及国家核心技术，则将受到《工业技术保护法》的审查。 🇺🇸 美国商务部没有回应置评请求。 ✅在美国建厂的理由充分💰 两位消息人士称，在美国制造半导体的成本远高于韩国。其中一位表示，在美国建厂意味着劳动力和建筑成本显著更高，而且半导体行业的供应链大部分位于亚洲，这也推高了美国的成本。 🏭 尽管如此，SK 海力士仍有充分理由寻求在美国制造芯片。该公司于 7 月刚完成在纳斯达克的二次上市，目前仅在美国印第安纳州有一个芯片封装厂在建。 🎤 SK 海力士所属的 SK 集团会长崔泰源在 7 月表示，公司面临来自客户和国家要求供应更多芯片的巨大压力和游说。 “我认为我们需要在美国建一座工厂。如果可能的话，我认为我们应该建。” 他对记者表示。 🤝 与 SK 海力士达成协议也将缓解英特尔的部分财务压力，该公司部分股权由美国政府持有。 📈 英特尔于 2022 年宣布，将投资至多 1000 亿美元，在俄亥俄州建设可能是全球最大的芯片制造基地，计划 2025 年投产。但该基地两座工厂的完工时间此后被推迟至 2030 年和 2031 年。 ⚖️ 然而，要同时取悦华盛顿和首尔可能并非易事，尤其是首尔方面已敦促 SK 海力士及其竞争对手三星电子（005930.KS）加快在韩国西南部建设新的芯片制造设施集群的计划。 📢 美国商务部长霍华德・卢特尼克曾威胁称，除非韩国和台湾企业承诺在美国本土增加生产，否则将对其征收最高 100% 的关税。 🤝 两国承诺在韩国多年来换取美国较低的关税而做出的巨额投资承诺尚未全部兑现。去年，在拟议的 3500 亿美元中，约 1500 亿美元已指定用于造船业，但剩余的 2000 亿美元尚未确定用途。 🧩 两名消息人士称，这使 SK 海力士陷入两难境地。韩国政府试图将 SK 海力士在美投资作为谈判筹码，而华盛顿则不断施压该公司尽快承诺在美扩张。#文字观点", "publish_time": "2026-09-16 14:04", "tags": ["文字观点"]}, "post:2026-09-16T20-05:e9695f5120e6": {"id": "post:2026-09-16T20-05:e9695f5120e6", "kind": "post", "title": "2026-09-16 20:05", "source_label": "帖子正文", "excerpt": "20260916今日段子汇总 1、致尚科技：1、控股子公司福可喜玛主营MPO/MT插芯、连接器，主要应用于4G/5G通讯及光模块产品中，应用场景包括数据中心、FTTH及FTTA等；2、公司拟收购恒扬数据，标的为AI智算中心、云计算数据中心及边缘计算核心基础设施供应商 2、有研硅：国内半导体材料龙头企", "content": "20260916今日段子汇总 1、致尚科技：1、控股子公司福可喜玛主营MPO/MT插芯、连接器，主要应用于4G/5G通讯及光模块产品中，应用场景包括数据中心、FTTH及FTTA等；2、公司拟收购恒扬数据，标的为AI智算中心、云计算数据中心及边缘计算核心基础设施供应商 2、有研硅：国内半导体材料龙头企业；公司通过公开摘牌方式收购安徽晶隆半导体60%股权，标的公司已完成8英寸硅外延片试生产并获客户验证，收购后可形成衬底到外延的一站式解决方案 3、通鼎互联：通信线缆全产业链企业；公司聚焦光通信产业的发展，建成了涵盖光纤预制棒、光纤、光缆、通信电缆、通信设备等多个业务类别较为完整的产业链，可为客户提供一揽子的产品和解决方案 4、内蒙新华：公司是内蒙古规模最大的出版物发行企业 5、平潭发展：A股唯一一家注册在平潭岛的上市公司，公司拥有90万亩林地，受益林业碳汇交易发展 6、会稽山：国内龙头黄酒供应商；公司在生产黄酒的同时，也利用黄酒生产过程产生的醪糟作为原料，通过蒸馏生产糟烧白酒，并一直有销售糟烧白酒等副产品的传统 7、中晶科技：半导体硅材料制造商，主要产品为半导体硅片及半导体硅棒，8英寸抛光片项目正按照整体规划在加速推进中 8、锡华科技：公司主要从事大型高端装备专用部件的研发、制造与销售，产品结构以风电齿轮箱专用部件为主、注塑机厚大专用部件为辅，是全球行业领先、质量可靠、技术卓越的大型高端装备专用部件制造商 9、西陇科学：公司拥有光刻胶配套试剂产品，和英 弹性释放，持续推荐 1）短期业绩动能强劲：AI PCB领域，H2以来Rubin/Trainium 3已开始大规模拉货，TPU v8拉货则有望于Q4启动，同时PCB端良率和产能稳步推进，业绩增长斜率有望提升；传统PCB领域，具备拿料能力的厂商6-8", "content": "【中信电子】AI PCB量价双增逻辑持续，传统涨价利润弹性释放，持续推荐 1）短期业绩动能强劲：AI PCB领域，H2以来Rubin/Trainium 3已开始大规模拉货，TPU v8拉货则有望于Q4启动，同时PCB端良率和产能稳步推进，业绩增长斜率有望提升；传统PCB领域，具备拿料能力的厂商6-8月集中提价20%+，涨价节奏提升，26Q3起盈利能力有望大幅改善。#我们看好26Q3/4头部PCB公司的业绩增长动能。 2）中长期供需紧张延续，PCB业绩高增能见度提升：需求端持续上修，英伟达Rubin ultra PCB方案逐步清晰，ASP显著增长，M9/超高多层渗透提升，PTFE+热固材料混压方案进展顺利，有望率先在SwitchTray落地，正交背板应用存在超预期机会；谷歌TPU、AWS等出货量亦在持续上修，v9/T4 PCB升级持续，同时国产算力也在迎来加速放量期；供给侧仍偏紧，当前核心钻机、曝光机、电镀等设备交期持续拉长，新接订单已排至2年后，短期产能增长斜率受限。#我们认为中期维度供给产能强约束将延续，PCB高增能见度持续提升。 3）传统CCL涨价趋势延续，AI CCL加速放量。传统CCL领域， 8月最新提价已于9月开始落地执行，当前PCB顺价通畅，CCL厂商涨价诉求较强，我们判断供需持续紧张下后续传统CCL涨价趋势有望延续，26Q3起相关厂商利润有望加速释放。AI CCL领域，当前海外算力景气仍高企，CCL层面核心物料缺货，同时海外头部CCL厂商产能供应紧张，国产CCL迎来加速放量机遇，同时2026年起国产算力PCB/CCL需求有望强劲增长，国产AI CCL头部厂商有望深度受益。当前国产AI CCL出货节奏持续超预期，我们看好未来国产厂商AI CCL加速释放利润。 4）载板化趋势加速，载板、mSAP景气周期进一步拉长。载板领域，国产BT载板有望随产能释放加速释放利润，而ABF载板良率和产能蓄势待发，26H1已完成众多核心客户及产品导入，26H2有望迎来全面起量。类载板领域，高端光模块/mSAP PCB紧缺延续，量价双增驱动下2027年mSAP PCB需求有望激增，#我们判断2027年mSAP行业仍将维持供需紧张状态，相关公司业绩有望高斜率释放。 投资结论：我们看好行业景气周期的持续性，短期受益于AI的迭代放量及传统领域的涨价，26H2业绩有望表现强势；中长期则有望受益于PCB工艺/材料迭代升级，ASIC、载板、mSAP、PTFE等细分方向均有望实现超额增长。其中建议关注以下投资主线： 1）AI PCB/CCL龙头公司：短期业绩表现强劲+中期业绩高增能见度提升，重点推荐：【沪电股份、深南电路、生益科技、景旺电子、兴森科技】，建议关注【广合科技】； 2）此前传统业务占比较高、业绩承压的公司，随年中涨价传导，26H2有望迎来业绩明确反转，同时AI预期有望进一步强化，建议关注：【世运电路、奥士康、崇达技术、迅捷兴、四会富仕】等； 3）受益于CCL持续涨价落地，业绩释放有望超预期，建议关注：【南亚新材、金安国纪、华正新材】。 # 其他公司变化情况欢迎联系交流 欢迎联系 中信电子#文字观点", "publish_time": "2026-09-16 20:04", "tags": ["文字观点"]}, "attachment:files/0915评级日报.pdf": {"id": "attachment:files/0915评级日报.pdf", "kind": "attachment", "title": "0915评级日报", "source_label": "其他", "excerpt": "AI PCB板材升级与层数提升拉动金刚石涂层钻针等高 附加值产品需求，这家公司跨界切入AI PCB钻针… xuangut ong.com.cn 2026/09/15 16:11 【本文来自持牌证券机构，不代表平台观点，请独立判断和决策】 公司收购戴尔蒙德切入PCB钻 针赛道，AI PCB板 材升级与层数提升拉动金刚石 涂层钻针等高附加值产品需求，打开成长空间", "content": "AI PCB板材升级与层数提升拉动金刚石涂层钻针等高 附加值产品需求，这家公司跨界切入AI PCB钻针… xuangut ong.com.cn 2026/09/15 16:11 【本文来自持牌证券机构，不代表平台观点，请独立判断和决策】 公司收购戴尔蒙德切入PCB钻 针赛道，AI PCB板 材升级与层数提升拉动金刚石 涂层钻针等高附加值产品需求，打开成长空间。 1、市场认为公司主业空间有限、业绩承压，公司总计投入3.6亿元收购戴尔蒙 德52%股权，切入超硬材料与PCB涂层钻针领域，完成业务战略升级，戴尔蒙德承 诺2026-2028年合计净利润目标为1.5亿元，新业务有望打开中长期成长空间。 2、AI PCB板 材升级、层数提升，新一代涂层钻针渗透率有望抬升。PCB板 材 向M8、M9升级，层数从12-16层提升至24-40层，钻针寿命由1000孔（M8）降 至100-200孔（M9），急需升级适配高端加工；金刚石涂层钻针寿命较普通钻针可 提升10倍以上，2029年全球PCB钻 针市场规模有望达91亿元，赛道高景气已吸引 多家公司切入。 3、戴尔蒙德技术与产业化优势凸显。公司聚焦CVD纳 米金刚石涂层、PVD复 合涂层和超硬刀具方向，拥有惠州CVD纳 米金刚石涂层产业化基地、微型钻针和精 密铣刀生产基地、PVD复 合镀膜中心，PVD Ta-C赛道聚焦高毛利产品，面向极小径 微钻等高端应用场景；针对AI算力PCB厚 板、高层数加工需求深度绑定头部客户并 联合开发，已服务国内多家头部PCB企 业，客户粘性较高。 4、限制性股票激励计划草案出台，锚定未来三年业绩。拟向4名核心管理人员 及骨干授予限制性股票125万股，占公司总股本的0.98%，授予价格为43.19元/ 股，业绩考核目标为戴尔蒙德2026-2028年净利润分别不低于4850万元、6800万 元、8450万元，核心团队利益绑定，成长目标明确。 5、主业亏损收窄叠加并表增厚，业绩有望逐步改善。2026H1公司单Q2归母 净利润为-0.06亿元，环比减亏20%，亏损收窄出现拐点迹象；戴尔蒙德并表后净利 率达25%，盈利能力较好，与主业形成共振。朗读 全屏 手机 浏览 保存 设置 帮助 退出 研报来源： 1、浙商证券，王华君，S1230520080005，杰美特：新一代PCB钻 针新秀， 技术迭代阿尔法强。2026年9月14日 2、招商证券，蒋国峰，S1090524100005，爱科赛博：测试电源业务有望在A IDC领 域迎来大发展。2026年9月14日 图片加载中… 3、长江证券，邬博华，S0490514040001，信德新材：引领沥青基碳纤维国 产化之路。2026年9月14日 *免责声明：文章内容仅供参考，不构成投资建议 *风险提示：股市有风险，入市需谨慎", "status": "extracted"}, "post:2026-09-16T20-06:5c6bcb1c0b07": {"id": "post:2026-09-16T20-06:5c6bcb1c0b07", "kind": "post", "title": "2026-09-16 20:06", "source_label": "帖子正文", "excerpt": "信德新材·持续推荐：主副产品量利齐升，碳纤维新品蓄势待发 # Q2业绩位于预告中值、盈利能力大幅提升。公司公告2026H1营收8.33亿元（同比+63.27%），归母净利润0.70亿元（同比+617.62%），扣非归母净利润0.54亿元（同比扭亏）。", "content": "信德新材·持续推荐：主副产品量利齐升，碳纤维新品蓄势待发 # Q2业绩位于预告中值、盈利能力大幅提升。公司公告2026H1营收8.33亿元（同比+63.27%），归母净利润0.70亿元（同比+617.62%），扣非归母净利润0.54亿元（同比扭亏）。其中，2026Q2营收4.72亿元（同比+76.50%，环比+30.76%），归母净利润0.39亿元（同比+1441.30%，环比+24.92%），扣非归母净利润0.32亿元（同比扭亏，环比+47.55%），公司上半年业绩位于业绩预告中值。 # 行业变化：快充时代已来、行业景气度进入上升通道负极包覆材料是负极材料性能的助推剂，在负极中的添加量在5%~30%。随着电池行业整体景气度提升，下游负极行业产能利用率、价格等景气度指标均进入上升通道。此外，头部电池企业推出新一代快充电池，将拉动负极包覆材料单位添加量提升。 # 公司优势：技术领先+强客户粘性铸就护城河、内生外延式扩张夯实行业地位公司通过产能扩张，优化原料供应，从产品、客户、一体化等多个维度，进一步巩固龙头地位。1）内生外延扩张产能，市占率进一步提升：公司通过内生外延的方式，持续提升市占率，目前公司拥有产能9万吨，其中成都+福建合计5万吨产能为近3年收并购获得，展现了公司对产业周期的理解力和高效的决策力；2）深度绑定大客户：公司对头部负极企业全覆盖，主要客户包含贝特瑞、杉杉股份、璞泰来、中科电气、尚太科技等，早已实现深度绑定。 #第二曲线：沥青基碳纤维领域打造第二曲线、国产替代进行中公司通过产业链延伸，积极拓展沥青基碳纤维产品：沥青基碳纤维兼具耐高温与保温性能，能完美匹配热场需求。目前市场主要以日本企业为主，但整体扩产意愿不强。目前公司产品已陆续通过半导体、光纤、光伏等领域的产品验证并小批量供货，预计将受益新兴行业高增，公司作为新型碳材料企业，我们预计碳纤维产品将为公司打开第二成长曲线。 # 投资建议公司是负极包覆材料的龙头企业，行业端持续受益新能源汽车快充需求的提升和锂电行业景气度回暖，公司端通过不断内生外延，持续实现市占率提升和降本增效。公司碳纤维业务进展顺利，有望为公司打造第二增长曲线。我们预测公司2026~2028年净利润分别为2.01/3.04/4.06亿元，给予“买入”评级。 #盈利预测、估值与评级。我们维持公司2026~2028年净利润预测分别为2.01/3.04/4.06亿元,给予公司2027年35倍PE估值，对应目标市值106亿元，对应目标价75元，维持“买入”评级。#文字观点", "publish_time": "2026-09-16 20:06", "tags": ["文字观点"]}, "post:2026-09-16T11-18:08520ab544aa": {"id": "post:2026-09-16T11-18:08520ab544aa", "kind": "post", "title": "2026-09-16 11:18", "source_label": "帖子正文", "excerpt": "小米、理想加速导入欣旺达动力电池，头部车企供应链多元化推进，市场预期宁德时代配套份额将持续被分流，欣旺达动力电池出货有望迎来快速增长，重点关注丰元股份 🌟事件：理想汽车大额增资欣旺达动力成为第二大股东，理想 L8、i6 等主力车型采用欣旺达电芯；小米澎程系列龙甲电池选定欣旺达作为核心电芯供应商，多家", "content": "小米、理想加速导入欣旺达动力电池，头部车企供应链多元化推进，市场预期宁德时代配套份额将持续被分流，欣旺达动力电池出货有望迎来快速增长，重点关注丰元股份 🌟事件：理想汽车大额增资欣旺达动力成为第二大股东，理想 L8、i6 等主力车型采用欣旺达电芯；小米澎程系列龙甲电池选定欣旺达作为核心电芯供应商，多家头部车企推进供应链分散，降低单一电池厂商依赖，行业 “去宁德化” 趋势持续发酵。欣旺达产能扩张、下游订单放量，将向上游磷酸铁锂正极材料释放采购需求。 🌟丰元股份：磷酸铁锂正极核心厂商，枣庄基地紧邻欣旺达枣庄生产基地，近期创始人层面完成对接，达成未来合作意向。公司具备规模化磷酸铁锂产能，原有客户以比亚迪为主，若顺利切入欣旺达供应链，将新增大客户，充分受益欣旺达配套小米、理想带来的电池出货增长，打开业绩弹性。#文字观点", "publish_time": "2026-09-16 11:18", "tags": ["文字观点"]}, "attachment:files/中金公司-汽车及零部件行业动态：广汽筹划重大资产重组；央国企优化整合新范式-260915.pdf": {"id": "attachment:files/中金公司-汽车及零部件行业动态：广汽筹划重大资产重组；央国企优化整合新范式-260915.pdf", "kind": "attachment", "title": "中金公司-汽车及零部件行业动态：广汽筹划重大资产重组；央国企优化整合新范式-260915", "source_label": "中金公司", "excerpt": "汽车及零部件行业动态：广汽筹划重大资产重组；央国企优化整合新范式 汽车及零部件行业动态：广汽筹划重大资产重组", "content": "汽车及零部件行业动态：广汽筹划重大资产重组；央国企优化整合新范式 汽车及零部件行业动态：广汽筹划重大资产重组；央国企优化整合新范式 2026-09-15 行业近况 广汽拟发行股份收购一汽旗下合资公司股权，一汽将成为广汽第二大且具有战略影响力的股东。 9 月 14 日，广汽与一汽 股份签署《意向协议》，拟通过发行股份购买一汽持有的某整车合资公司部分股权，并募集配套资金。本次交易预计构成重大资 产重组及关联交易，不改变广汽实际控制人，亦不构成重组上市。目前标的名称、交易比例及估值等核心条款尚未披露，最终方 案仍待正式协议及监管审批。 评论 一汽经营基础相对稳健、广汽处于新能源转型与盈利筑底阶段。 2026 年 1 至 9 月，广汽销量逐步企稳，但自主新能源及合资投资收益承压仍使盈利处于筑底阶段。一汽经营规模及盈利 基础相对稳健，红旗具备自主豪华品牌基础，合资品牌（一汽大众、一汽奥迪及一汽丰田）贡献稳健销量和利润来源，但在自主 新能源规模、智能化迭代及南方市场布局方面仍有补强空间。 双方差异化资源禀赋形成较强互补。对于广汽，如果注入优质合资资产，一定程度上能够带来公司潜在的利润表改善；对 于一汽，部分合资资产实现证券化，以资本拓生态。我们认为中长期可以期待双方进一步拓展到智电研发平台、联合采购降本、 南北渠道整合、出海和合资资源协调等方面。 国内需求仍承压，但盈利下修充分、估值底部，整合信号形成利好。 8 月乘用车批发 / 零售量分别为 235.3/154.1 万辆，同 比分别 -4.3%/-22.8% ，终端需求仍弱、价格竞争及传统合资盈利压力延续，但中报后，市场对车企全年盈利预测下修较为充 分。估值方面，年初至今乘用车整车板块累计下跌 25% ，其中 8 月以来又深度回调，部分头部车企当年 P/E 跌至 10x 以下、 P/S 跌 至 0.5x ，逼近净现金水平，市场预期非常悲观。 估值与建议 若重组落地，有望成为央地车企跨区域整合的重要先例，释放积极反内卷信号，有望带动情绪转暖。重组推进细节、效果 和对行业格局改善的影响仍待观察。 风险 需求不及预期、重组进度存在不确定性、竞争趋于激烈。 仅供内部参考，请勿外传", "status": "extracted"}, "post:2026-09-16T12-20:310deb3ad580": {"id": "post:2026-09-16T12-20:310deb3ad580", "kind": "post", "title": "2026-09-16 12:20", "source_label": "帖子正文", "excerpt": "【国泰海通通信】#光博会详细总结【整体】1.6T即将超大规模上量，部分物料需求可见度开始到28年及以后；NPO新方案百花齐放，CSP玩家众多，预计2027年生态成熟几成定局", "content": "【国泰海通通信】#光博会详细总结【整体】1.6T即将超大规模上量，部分物料需求可见度开始到28年及以后；NPO新方案百花齐放，CSP玩家众多，预计2027年生态成熟几成定局；三季报预期普遍反馈亮眼。各个细分领域都有重要变化或者期待的变化，具体见闻和感受如下： ①【光模块】1.6T大规模倾向硅光形态，DSP/光源/隔离器/mSAP等物料锁定成为各家胜负手，头部玩家构建了极强平台化壁垒。同时，开始有3.2T、12.8T XPO等新产品展示，Scale out侧产品的迭代仍在进行，这个对光通信至关重要。 ②【NPO】第一次最大密度的展示，意味着1年内供应链成熟度会很高，为客户大规模上量提供坚实基础。有3.2T/6.4T/7.2T等多款NPO产品，也有内置和外置版本，说明CSP（AWS、Meta、字节等）/设备商（NVDA、AMD）玩家很多，定制化明显。预计半年内各家最终方案和供应商浮出水面，28-30年的景气度可以预见。 ③【光芯片】CW激光器相比前两年展示比重大幅增加，显示硅光趋势的确定性。主流企业除了都展示70/100mw激光器外，部分厂家展示200/400mw大功率产品Demo，预示着这会是两三年后市场争夺的焦点。企业集中反馈产能紧张交付压力较大，2027年基本产能都被锁定，2028年极强需求指引也开始有了线索。 ④【OCS】产业趋势明确，聚焦规模量产细节，今年产品展示从整机向上游产业链扩展。OCS的四种主要技术路径均在持续演进迭代，相比上届主要体现于端口数增加这一显性的变化，此次大会更关注落地细节，包括规模化部署的可靠性、经济性等。其中，讨论更多集中于DBS、硅光波导方案的成熟，预计将进一步扩大OCS的应用场景。同时，产业成熟度提升，今年上游环节有更多展出，包括M*N FAU、M*N透镜、各类方案芯片、耦合、测试等，且反馈需求旺盛交付紧张。当前，OCS需求不仅有谷歌6D Torus架构这类技术驱动，也有NV、其他CSP新增部署这类市场拓展驱动，还有光层配线、光通信测试等新增场景驱动，产业趋势明确，预计后续在客户组网方案、 不同技术优化、供应链导入/扩产方面产业将会有密集变化。 ⑤【光纤光缆】未来高端光纤需求占比会越来越集中，比如保偏，空芯，多模，多芯，卷普通652光纤是无效低效产能。随着NPO/CPO放量，必需品保偏光纤的需求会大量提升，同时明后年北美DCI需求逐渐扩大，多芯数光缆是明确趋势，康宁藤仓有效产能不多，国内头部厂商与北美csp落地直接合作会越加频繁。产品结构的变化驱动核心公司Q3业绩值得期待。 ⑥【MPO】2026年MPO需求同比快速增长，全行业翻倍扩产仍无法覆盖需求，呈现供不应求状态；2027年MPO行业整体仍将保持较高景气度；往后1.6T、3.2T、CPO、NPO等技术迭代，MPO作为无源器件，随通道数增加量价齐升，需求生命周期仍将不断持续。MMC等小型化高速连接器已成为北美AIDC的事实接口标准，目前部署量已超过MPO。MMC核心优势在于空间占用更小（传统MPO配线架2U空间vs MMC配线架1U空间）、安装效率更高（单个插装 vs 6-8接口集束式插装）。随多平面架构普及（单GPU接入4/8/12个平面）、芯片出光趋势落地，将直接带动fiber shuffle需求增长。#文字观点", "publish_time": "2026-09-16 12:20", "tags": ["光博会详细总结", "文字观点"]}, "post:2026-09-16T12-21:db51a4797c84": {"id": "post:2026-09-16T12-21:db51a4797c84", "kind": "post", "title": "2026-09-16 12:21", "source_label": "帖子正文", "excerpt": "光通信观点更新 1、可插拔光模块 ☕整体逻辑没有太大变化，但#估值压制因素（FCC、CPO）#有所缓解，FCC上周cover list更新和光博会交流后偏乐观。☕需求侧，部分专家口径出现27年1.6T指引上修", "content": "光通信观点更新 1、可插拔光模块 ☕整体逻辑没有太大变化，但#估值压制因素（FCC、CPO）#有所缓解，FCC上周cover list更新和光博会交流后偏乐观。 ☕需求侧，部分专家口径出现27年1.6T指引上修；供给侧，27年物料#重点关注1.6TDSP#、200GEML；同时光通信公司出现产品和技术路径布局上的差异化，关注二线光#光迅、剑桥、联特。2、新技术&材料 ☕重点关注NPO，产业认可度高于预期，未来2-3年光通信最重要的产品之一。商业节奏上27Q3出货，提前6个月左右备料；28年有望放量。#关注NPO重点结构件和重难点工艺环节的投资机会。 ☕OCS：NV下小批量订单带来的关注度，27年需求仍以谷歌系为主。#关注谷歌6DTorus进度、潜在客户加单、方案及单端口成本变化。 ☕材料：薄膜铌酸锂产业内对商业化节奏存在一定分歧；磷化铟获台湾和北美公司布局。 3、推荐排序：无源器件、大光、光芯片，同时关注二线光及OCS弹性标的。#文字观点", "publish_time": "2026-09-16 12:21", "tags": ["重点关注1", "6T", "、200G", "光迅、剑桥、联特", "关注谷歌6D", "文字观点"]}, "post:2026-09-16T14-02:73948e89978f": {"id": "post:2026-09-16T14-02:73948e89978f", "kind": "post", "title": "2026-09-16 14:02", "source_label": "帖子正文", "excerpt": "🥇天风通信 | 光大涨：#产业追光火爆、坚定向光而行1、光模块： 海外市场，27年800G翻倍以上增长，1.6T数倍增长，#28年2.4T有望爆发释放2000万只需求。#国内800g明年预计快速放量到4-5千万只。", "content": "🥇天风通信 | 光大涨：#产业追光火爆、坚定向光而行1、光模块： 海外市场，27年800G翻倍以上增长，1.6T数倍增长，#28年2.4T有望爆发释放2000万只需求。#国内800g明年预计快速放量到4-5千万只。NPO产品和产业链加速显著，等待良率和稳定性成熟后放量。 大光： 订单确定，随着1.6T放量和补齐物料短板，H2业绩加速释放明确。#坚定推荐：旭创、新易盛、东山、天孚小光：Oracle、AMD、设备商和Neocloud阵营的光互联需求开始放量释放，重点关注增量客户订单突破：#剑桥、华懋、联特、世嘉国内领军：光迅、华工、纳真、海光芯正。 2、#OCS：明后年有望保持CAGR增速200%，旭创/新易盛/光迅/光库/德科立/英唐智控等推出OCS整机，#设备和光学部件（准直器、环形器、光学材料等）受益：天孚、罗博特科、联讯、矩光、腾景、德科立、福晶。 3、电芯片： Dsp紧缺，供货周期50周，高速tia和driver供货周期也延长到7个月，#重点关注未来国产替代加速：优迅股份、金字火腿、卓胜微 4、光芯片：70和100cw依旧受限产能释放紧缺，200-400mw和高速eml产品加速推出。重点：源杰、东山、永鼎、长光、仕佳、纳真 5、无源： MPO、MMC、Fau和透镜、光纤在高密度、高通道、高集成等光互联新产品/新场景量价提升趋势显著。#重点：光纤（长飞亨通中天烽火永鼎通鼎长盈通)、天孚、蘅东光、博创、光库、仕佳、太辰光。 6、薄膜铌酸锂： 带宽升级需求加速推动产业化进展，#关注：天通、安孚、共达电声等。7、散热：中石科技、国机精工、四方达、沃尔德 :34", "source_label": "帖子正文", "excerpt": "【长江电新】20260916-宁德时代推荐更新：梳理底部预期，多一分耐心和信心 宁德时代近期跌幅较大，分歧在于短期排产变化、消费税/出口退税传导，中期的高端车格局、电池供需、需求增长中枢等。我们认为在市场恐慌性下跌后，还是需要梳理清楚底部的合理预期： 1、#关于需求，1）#对于排产波动，因产业链中报", "content": "【长江电新】20260916-宁德时代推荐更新：梳理底部预期，多一分耐心和信心 宁德时代近期跌幅较大，分歧在于短期排产变化、消费税/出口退税传导，中期的高端车格局、电池供需、需求增长中枢等。我们认为在市场恐慌性下跌后，还是需要梳理清楚底部的合理预期： 1、#关于需求，1）#对于排产波动，因产业链中报有成品库存，短期排产不完全反应终端需求趋势，更多是“涨价-库存”博弈的结果；近期油气价格上行，锂电需求应是改善趋势。2）#对于中期需求，本轮锂电增速多元化，商用车、欧洲动力有政策托底20%增速；新兴市场动力、非美储能得益于经济性和竞争力，当前渗透率仅10%-15%；国内动力渗透率、带电量仍有提升空间。我们维持行业3年复合增速20%+的判断。 2、#关于盈利，1）#对于消费税/出口退税退坡，是全行业共同面临的问题，都在稳步推进中，我们认为储能是项目制，传导难度不大；海外动力的出口退税过去已退坡两次，机制也应相对成熟，仅国内消费税可能需要共担。谨慎测算，27年预计公司国内动力出货500GWh左右，按0.4-0.45元/Wh均价、承担50%计算，潜在影响约30亿元；再谨慎一些，假设海外动力出口退税承担20%，再影响约40亿元。2）#对于产能利用率，随产能释放，27年锂电产能利用率预计从80%降至70%，但仍显著高于23-24年的60%左右，且电池需求分层，国内储能或面临压力，其他场景影响有限，公司27年国内终端储能出货预计80GWh左右，悲观假设降价2-3分，影响盈利15-20亿元。3）#出货结构优化、成本改善、度电折旧下降，历史上公司维持盈利相对稳定，得益于结构改善和内生降本，27年公司海外占比提升，碳酸锂降价、资源自供率上升，早期设备折旧结束、度电折旧有望改善。 3、#关于格局，1）#对于车企切换供应商，车企销量有待观察，也是检验宁德时代近两年深耕的品牌价值；国内新能源车逐步进入存量阶段，供应格局并非趋势性变化，存在因成本、保供切换的，也有基于产品差异化、打造爆款而换回宁德的。2）#宁德时代在布局更高壁垒的业务，公司并非被动应对下游压力，而是主动出击，布局换电、超充网络，储能切入系统业务，提升自身壁垒。3）#政策预期巩固中期格局，后续扩产审批难度加大，电池持续内卷概率不大，格局稳固。 4、综上，预计宁德时代2026、2027年归母净利润950、1200亿元；充分考虑悲观预期的盈利假设为930、1100亿元，PE也仅15、13X。同时我们建议多一分耐心和信心，看到全球能源转型趋势强化、电池中期政策托底、公司深耕内功和新业务的布局，继续推荐。#文字观点", "publish_time": "2026-09-16 14:34", "tags": ["文字观点"]}, "post:2026-09-16T08-28:b6486ec99271": {"id": "post:2026-09-16T08-28:b6486ec99271", "kind": "post", "title": "2026-09-16 08:28", "source_label": "帖子正文", "excerpt": "美银——全球基金经理调查：奔向边界 核心结论： 9月BofA全球基金经理调查显示，投资者对宏观繁荣与AI资本开支加速的信念依然稳固，但“债市无序上涨”及“民主党中期选举横扫”的风险正在上升；FMS现金水平从3.5%跳升至3.9%，此前抑制夏季风险资产上行的过度看涨情绪正在消退。", "content": "美银——全球基金经理调查：奔向边界 核心结论： 9月BofA全球基金经理调查显示，投资者对宏观繁荣与AI资本开支加速的信念依然稳固，但“债市无序上涨”及“民主党中期选举横扫”的风险正在上升；FMS现金水平从3.5%跳升至3.9%，此前抑制夏季风险资产上行的过度看涨情绪正在消退。当现金回升至4-5%的中性区间后，将是安全增加风险敞口的时机。 宏观与盈利： • 净8%的受访者预测当前强劲的全球经济增长将进一步加速。 • 经济预期分布：55%预计“不着陆”，38%预计“软着陆”，仅2%预计“硬着陆”。 • 投资者对EPS最为乐观，预期未来12个月盈利双位数增长的比例创2021年8月以来新高；唯一担忧在于企业过度投资（净33%持此观点，创纪录）。 政策与政治： • 美联储被视为落后于曲线；自2022年9月以来首次有投资者预期收益率曲线趋平。 • 仅16%的投资者认为美国财长Bessent的债券回购计划能压低美债收益率。 • 中期选举最可能结果：民主党控制众议院、共和党控制参议院（44%），但民主党“横扫”的概率升至31%。若民主党横扫，45%的投资者预计市场反应为“收益率上升、股市下跌”。 拥挤交易、风险与事件： • 最拥挤交易：“做多全球半导体”（53%）。 • 最大尾部风险：“债券收益率无序上升”（33%，8月为27%）。 • 系统性信用事件最可能源头：“AI超大规模算力资本开支”（42%，8月为38%）。 资产配置（AA）： • 投资者削减股票与大宗商品超配，维持债券大幅低配。 • 9月资金轮动：增持医疗保健、工业及银行（银行配置为2025年11月以来最高超配）；减持REITs与必需消费品（必需消费品为2004年1月以来最低配）。 逆向交易策略（FMS Contrarian Trades）： • 做多英国股票 / 做空美国股票 • 做多必需消费品 / 做空银行 • 做多小盘股 / 做空大盘股 关键指标与信号： • FMS现金规则目前处于3.9%的“卖出”信号区域（≤4.0%为卖出，≥5.0%为买入）。 • 牛熊指标读数为9.5，同样发出“卖出”信号。 • 股票配置净49%超配（上月56%），债券配置净48%低配（为2022年5月以来最低配）。 • 投资者承担的风险水平自2026年4月以来首次降至正常水平以下（净2%低于常态）。 区域与板块绝对仓位： • 最超配：全球股票、新兴市场股票、医疗保健。 • 最低配：债券、英国股票、必需消费品。 • 相对历史分位（Z分数）：最高超配银行、美股、医疗保健；最低配必需消费品、英国股票、REITs。 关键补充： • 79%的投资者不认为AI超大规模企业会在2026年宣布削减资本开支。 • 转向政府债券的最可能催化剂：美债收益率升至具吸引力水平（如30年期收益率达6%），27%的投资者选择此项。 • 美联储在11月中期选举前加息的预期大幅上升：41%认为会加息（8月仅22%），52%认为不会（8月为72%）。#文字观点", "publish_time": "2026-09-16 08:28", "tags": ["文字观点"]}, "post:2026-09-16T07-22:5aa10c214781": {"id": "post:2026-09-16T07-22:5aa10c214781", "kind": "post", "title": "2026-09-16 07:22", "source_label": "帖子正文", "excerpt": "【周三你需要知道的隔夜全球要闻：美联储利率决议前夕消息冷淡，标普500指数创8月份以来收盘新低，美国柴油期货结算价创新高】 1、美国参议院未能推进具有里程碑意义的加密货币法案。2、美国财长贝森特表示，将联邦财政赤字控制在GDP的3%以内，对于美国国债收益率曲线的稳定至关重要。", "content": "【周三你需要知道的隔夜全球要闻：美联储利率决议前夕消息冷淡，标普500指数创8月份以来收盘新低，美国柴油期货结算价创新高】 1、美国参议院未能推进具有里程碑意义的加密货币法案。 2、美国财长贝森特表示，将联邦财政赤字控制在GDP的3%以内，对于美国国债收益率曲线的稳定至关重要。 3、美国能源部长赖特认为沙特东西管道将很快恢复运行，预计管道重新开放将在数天内完成。 4、据美国国会预算办公室，伊朗战争头五个月耗费美国380亿美元。 5、据报道，英国首相伯纳姆下周将在纽约与特朗普首次会面。 6、万斯称伊朗战争将进入“截然不同的阶段”，万斯同意战争将在中期选举后结束。 7、美股三大指数集体收跌，纳指跌0.78%，道指跌0.63%；标普500指数跌0.45%，创8月份以来收盘新低。加密货币概念股普跌，Circle跌超11%，Coinbase跌超10%。欧洲主要股指收盘多数下跌，德国DAX30指数跌0.07%。 8、国际原油期货结算价大幅收涨。WTI原油期货10月合约涨4.38%，布伦特原油期货11月合约涨2.9%。美国柴油期货结算价升至每加仑5.26美元之上，创纪录新高。 9、COMEX黄金期货跌0.43%，报4333.4美元/盎司；COMEX白银期货涨0.07%，报64.19美元/盎司。 10、据报道，OpenAI考虑在IPO之前一轮融资获得1.2万亿美元估值。 11、美光演示全球首款512GB DDR5 RDIMM内存模块，预计2027年下半年实现量产。 12、Meta据悉将于2027年上半年部署新一代自研Arke芯片，于2027年底推出下一代Astrid芯片。 13、Anthropic宣布，已为Claude推出Salesforce插件，目前处于测试阶段。 14、OpenAI称正与Anthropic、谷歌合作推进AI安全工作。 15、吉利德科学表示，HIV药物市场的增长预计将在未来几个季度内回归至2%至3%的正常水平。(来自财联社APP)#文字观点", "publish_time": "2026-09-16 07:22", "tags": ["文字观点"]}, "post:2026-09-16T15-30:bdf2cbfe20e4": {"id": "post:2026-09-16T15-30:bdf2cbfe20e4", "kind": "post", "title": "2026-09-16 15:30", "source_label": "帖子正文", "excerpt": "【长江宏观宋筱筱团队】大类资产、海外研报周度观点0915 本周核心要点： 1、资产配置：增长与盈利支撑美股和铜，低波动利好新兴市场套息 1）股：Citi继续看多美股；MS谨慎持有A股 2）利率债：Citi低配由日债转向欧债。", "content": "【长江宏观宋筱筱团队】大类资产、海外研报周度观点0915 本周核心要点： 1、资产配置：增长与盈利支撑美股和铜，低波动利好新兴市场套息 1）股：Citi继续看多美股；MS谨慎持有A股 2）利率债：Citi低配由日债转向欧债。 3）外汇：看多日元； 4）商品：看多铜，对能源偏谨慎； 5）新兴市场：避开亚洲融资货币，做多新兴市场套息 2、8月CPI回升，9月加息已成共识 花旗认为，8月核心CPI略超预期叠加能源涨价，预计9月加息25个基点，随后暂停，2027年6、9、12月各降息25个基点 MS认为，8月核心CPI超预期，年内按兵不动的概率下降 GS认为，美联储会顾及政策信誉及不加息的市场反应，年内9月加息25个基点后暂停 JPM认为，美联储考量能源涨价与政策信誉，年内9月、12月各加息25个基点 DB认为，8月CPI及PPI分项显示通胀回落仍不充分，叠加增长稳健、就业趋紧和能源风险，2026年9月、12月及2027年3月各加息25个基点 3、通航难以恢复，油价预测上调 HSBC指出，通航恢复缓慢支撑基准油价，后续谈判成败决定库存与油价分化，炼油约束使成品油紧张持续更久。 美银认为，美伊持久和平协议难以迅速达成、霍尔木兹海峡通航扰动可能延续，且库存消耗削弱了应对冲突再次升级的缓冲，通航恢复不足的上行风险仍存。 GS预计中东航运扰动将持续至2027年，高盛将2026年底及2027年的布伦特油价预测均上调5美元/桶，分别至85美元和80美元，但仍预计油价从当前冲突推动的高位逐步回落。 三家机构都认为当前霍尔木兹海峡恢复通航较为困难，上调油价预测。 4、民意反对能否限制数据中心建设？ 伯恩斯坦认为，民意反对加深、AI数据中心建设限制扩散，项目受阻增加 ，并且 州长选举可能进一步扩大暂停风险。 美银预测，数据中心扩建与IT设备持续更新共同形成约5万亿美元投资需求，部分企业需要外部资金填补现金缺口，且以债务融资为主，多元化的融资渠道将承接融资需求。 ☎联系人：韩轶超/宋筱筱/黄帅/敬成宇/张梁/龙歌#文字观点", "publish_time": "2026-09-16 15:30", "tags": ["文字观点"]}, "post:2026-09-16T09-11:f19c9af695f6": {"id": "post:2026-09-16T09-11:f19c9af695f6", "kind": "post", "title": "2026-09-16 09:11", "source_label": "帖子正文", "excerpt": "美银——亚洲基金经理调查：静待AI变现与日本央行政策正常化 核心结论： 9月BofA亚洲基金经理调查显示，投资者对AI变现的实质性证据保持高度审慎，超八成受访者要求在增加AI相关敞口前看到清晰的盈利转化证明。防御性板块轮动成为对冲AI下行风险的首选，而价值与周期板块的偏好急剧降温。", "content": "美银——亚洲基金经理调查：静待AI变现与日本央行政策正常化 核心结论： 9月BofA亚洲基金经理调查显示，投资者对AI变现的实质性证据保持高度审慎，超八成受访者要求在增加AI相关敞口前看到清晰的盈利转化证明。防御性板块轮动成为对冲AI下行风险的首选，而价值与周期板块的偏好急剧降温。与此同时，日本央行政策正常化已取代企业盈利，成为主导日本股市的核心主题。 宏观与盈利： • 受美联储重启加息的担忧重现影响，9月增长预期略有软化，但投资者对企业利润的预期改善：净55%预计亚太（除日本）企业利润将提升（8月为45%）。 • 通胀预期整体稳定，净25%的投资者预计亚太（除日本）未来12个月通胀将走高。 • 对中国经济前景的乐观情绪急剧弱化，而对日本经济的预期保持平稳。 政策与政治： • 近80%的投资者预计日本央行将在本月（9月）实施下一次加息。 • 美元/日元的干预触发预期点位从8月的165下移至160。 • 投资者认为美联储落后于曲线，自2022年9月以来首次预期收益率曲线趋平。 预期回报与估值： • 投资者对亚太（除日本）和日本股市的看涨情绪升温，预计未来12个月回报率分别为6.3%和6.4%，乐观水平分别处于历史第89和第94百分位。 • 亚太（除日本）股票被越来越多地视为估值偏低。 • 关于AI对股市的积极影响，55%的投资者认为已“较充分或完全”反映在价格中（8月为37%）。 主题与配置： • 中国： AI/半导体和国企是最受青睐的两大主题。 • 日本： 日本央行政策正常化已超越盈利，成为日本股市近期至中期的首要主题。 • 半导体周期： 对更强半导体周期的预期回升至35%，但仍远低于7月的60%。 • AI受益市场： 美国及中国台湾地区共同成为下一阶段AI周期的最大预期受益者。 • AI价值链风险收益： 软件与平台提供最佳风险收益比，超越能源与电力板块。 • AI对冲策略： 防御性板块轮动成为领先的下行对冲手段，而转向价值和周期股的对冲比例骤降。 • 印度市场： 对印度缺乏AI敞口的担忧显著缓解，从32%降至10%。 仓位与区域配置： • 日本及中国台湾仍是亚太区最受青睐的市场，尽管月度环比略有下降。 • 在亚太（除日本）板块中，科技维持超配榜首，电信升至第三。9月资金显著轮动至保险、电信和软件，同时大幅削减医疗保健、银行、零售和材料。 • 日本仓位高度集中于银行和半导体，其中银行配置创历史新高。#文字观点", "publish_time": "2026-09-16 09:11", "tags": ["文字观点"]}, "attachment:files/兴业证券-信诺维(688837)具备“1+3+N”的创新药管线布局，BD授权初步实现创新反哺研发-260915.pdf": {"id": "attachment:files/兴业证券-信诺维(688837)具备“1+3+N”的创新药管线布局，BD授权初步实现创新反哺研发-260915.pdf", "kind": "attachment", "title": "兴业证券-信诺维(688837)具备“1+3+N”的创新药管线布局，BD授权初步实现创新反哺研发-260915", "source_label": "兴业证券", "excerpt": "新股研究报告 | 医药生物", "content": "新股研究报告 | 医药生物 证券研究报告 请阅读最后评级说明和重要声明 1/17 公司评级 无评级（首次） 报告日期 2026年09月15日 基础数据 收盘价（元） 总市值（亿元） 总股本（亿股） 4.35 来源：聚源，兴业证券经济与金融研究院整理 相关研究 分析师：孙媛媛 S0190515090001 sunyuanyuan@xyzq.com.cn 分析师：黄翰漾 S0190519020002 huanghanyang@xyzq.com.cn 分析师：杨希成 S0190522090002 yangxicheng@xyzq.com.cn 分析师：董晓洁 S0190522080005 dongxiaojie@xyzq.com.cn 研究助理：高尹伟业 gaoyinweiye@xyzq.com.cn 信诺维 (688837.SH) 具备“1+3+N” 的创新药管线布局， BD授权初 步实现创新反哺研发 投资要点： ⚫ 公司具备“1+3+N” 的创新药管线布局， BD授权初步实现创新反哺研发 。公司聚焦于全球范 围内重大未满足临床需求，以疾病为导向，致力于将创新转化为临床价值，为患者提供疾病 领域内最佳治疗药物的创新药公司。截至招股说明书签署日，公司已形成“ 1（（NDA）+3（（III 期）+N”的创新药管线梯队，并通过全球 BD授权或转让初步实现了创新反哺研发。其中 XNW5004 （（EZH2 抑制剂） 、 XNW27011 （（Claudin 18.2 靶向 ADC）以及 XNW28012 （（TF 靶向 ADC）均处于 III 期或关键性临床研究阶段 ，抗感染领域的注射用亚胺西福用于治疗革 兰阴性菌引起的医院获得性细菌性肺炎（ HABP）和呼吸机相关性细菌性肺炎（ VABP）的药 品上市许可申请（ NDA）已获得受理，预计 2026 年可实现获批上市 。 ⚫ 公司营业收入主要来源于 BD交易。公司首个创新药注射用亚胺西福目前处于 CDE新药上 市审评审批阶段， 公司营业收入主要来源于 BD交易。 其中 2025年， 公司从 Astellas Pharma Inc.获得收入 9.27亿元，占当期总收入 99.17%，借助大额 BD付款确认，公司 2025年成功 实现盈利，实现归母净利润 2.03亿元。 ⚫ 公司在研管线相较同适应症疗法具备较强竞争力。 （1）XNW5004 （EZH2小分子抑制剂） ： r/r PTCL 适应症中， XNW5004 mPFS 达到 15.74 个月， 长于其他竞品， 提示 XNW5004 在 PTCL 领域具备较强竞争力；在既往接受二线及以后治疗的 r/r FL 患者中，EZH2突变与野 生型 mPFS分别为 10.6m与10.8m，显示了不区分 EZH2突变的疗效； XNW5004 联合恩 扎卢胺在既往阿比特龙治疗失败的 mCRPC 患者在 1200mg BID 剂量组中 DCR 为97.7%， mrPFS 为18.6 个月， 相较恩扎卢胺 单药 mrPFS延长约 12个月； （ 2）XNW27012 （（CLDN18.2 ADC） ：已实现对安斯泰来的授权， 在 3.0mg/kg Q3W 剂量组 CLDN 18.2 表达的既往经二 线及以后治疗失败的胃 /胃食管结合部腺癌 23 例受试者 中，经确认的 ORR为 65.2%，显 示出良好的抗肿瘤活性 ；（3）XNW27012 （（TF ADC）：RP2D剂量下，晚期胰腺癌（ 2.4mg/kg Q3W 剂量组）和宫颈癌（ 2.0mg/kg Q3W 剂量组）患者的 ORR分别为 33.3%及 45.9%， 已推进至 XNW28012 在转移性胰腺癌患者中的 III期临床；（4）注射用亚胺西福：有效覆盖 三大碳青霉烯耐药革兰阴性菌，将助力解决国内革兰阴性菌抗生素耐药困境 ；除上述进入 NDA 和临床后期的管线外，公司尚有多个具有差异化机制和较高临床价值的早期管线处于 稳步有序推进中。 ⚫ 风险提示： 行业政策变动超预期 、市场竞争加剧风险 、研发进展不及预期风险 主要财务指标 会计年度 2022 2023 2024 2025 营业总收入（百万元） 20 0 0 935 同比增长 — — — — 归母净利润（百万元） -463 -427 -386 203 同比增长 — — — — 毛利率 100% — — 100% ROE -101% -74% -107% 29% 每股收益（元） -1.42 -1.25 -1.05 0.47 数据来源： iFind，兴业证券经济与金融研究院整理 注：每股收益均按照最新股本摊薄计算 下载日志已记录，仅供内部参考 新股研究报告 | 信诺维 请阅读最后评级说明和重要声明 2/17 目录 一、 信诺维：具备 “1+3+N”的创新药管线布局， BD授权初步实现创新反哺研 发 ................................ ................................ ................................ ..................... 3 二、 公司基本财务状况 ................................ ................................ .................. 5 三、 公司在研管线情况 ................................ ................................ .................. 6 （一） XNW5004 （EZH2小分子抑制剂） ：预计 2026H2向CDE提交既往二 线治疗后 r/r PTCL 适应症 NDA ................................ ................................ ...... 6 （二） XNW27011 （CLDN18.2 ADC ） ：对外授权至安斯泰来，有效性与安全 性在同类疗法中具备竞争力 ................................ ................................ ........... 10 （三） XNW27012 （（TF ADC） ：研发进度全球领先的新一代 TF ADC，有望为 全人群晚期胰腺癌患者提供新选择 ................................ ................................ . 11 （四） 注射用亚胺西福：有效覆盖三大碳青霉烯耐药革兰阴性菌，将助力解决 国内革兰阴性菌抗生素耐药困境 ................................ ................................ ，致力于将创新转化 为临床价值，为患者提供疾病领域内最佳治疗药物的创新药公司。 截至招股说明 书签署日 ，公司已形成“ 1（（NDA）+3（（III 期）+N”的创新药管线梯队，并通过全 球BD授权或转让初步实现了创新反哺研发。 公司针对抗肿瘤、抗感染等多个市场空间广阔的重大疾病领域，开发了 10 款主 要在研药品管线 ，其中： （1）抗肿瘤领域的 XNW5004 （EZH2 抑制剂） 、 XNW27011 （Claudin 18.2 靶 向ADC） 以及 XNW28012 （（TF 靶向 ADC） 均处于 III 期或关键性临床研究阶段， 上述药物均展现出优异的临床疗效，可以为胰腺癌、胃癌、前列腺癌、外周 T 细 胞淋巴瘤等重大疾病领域提供 “从无到有 ”或“从有到优 ”的治疗手段， 上述在研管线 均已获得中国国家药品监督管理局药品审评中心 （ CDE） 的突破性治疗药物认定， 且XNW27011 以及 XNW28012 已获得美国食品药品监督管理局 （ FDA） 的快速 通道认定（ Fast Track Designation ，FTD），XNW5004 、XNW28012 已获得美国 FDA 的孤儿药认定（ Orphan Drug Designation ，ODD）； （2）抗感染领域的注射用亚胺西福（由公司自主研发的新型 β-内酰胺酶抑制剂 福诺巴坦（ XNW4107 ）与亚胺培南、西司他丁钠组成的复方制剂）用于治疗革兰 阴性菌引起的医院获得性细菌性肺炎 （ HABP） 和呼吸机相关性细菌性肺炎 （ VABP） 的药品上市许可申请（ NDA）已获得受理，预计 2026 年可实现获批上市，将助 力解决国内革兰阴性菌抗生素耐药困境，注射用亚胺西福已获得美国 FDA 的合 格感染疾病产品认证（ Qualified Infectious Drug Product ，QIDP）以及快速通道 认定（ FTD）。 除上述进入 NDA 和临床后期的管线外，公司尚有多个具有差异化机制和较高临 床价值的早期管线处于稳步有序推进中。 下载日志已记录，仅供内部参考 新股研究报告 | 信诺维 请阅读最后评级说明和重要声明 4/17 图1、公司主要的在研药品管线情况 数据来源：公司招股说明书，兴业证券经济与金融研究院整理 注：数据截至 2026年9月9日 表1、公司主要的在研药品管线开发进度对比情况 品种 XNW5004 XNW27011 XNW28012 适应症领域 r/r PTCL 初治 PTCL r/r FL mCRPC G/GEJA 胰腺癌 宫颈癌 全球及国内 研发进展排名 前3 名 前2 名 前2 名 前2 名 前5 名 第1 名 前2 名 数据来源： 公司招股说明书 ，兴业证券经济与金融研究院整理 注：数据截至 2026年9月9日 在全球化视野和布局的加持下，公司通过全球 BD 已初步实现创新反哺研发的模 式，公司首个药品预计于 2026 年上市，公司将进入研发驱动， BD 和销售的一 体化增长阶段 。 （1） 截至招股说明书签署日， 公司已有多条在履行中的管线对外授权合作或转让， 合作方包括安斯泰来 （ Astellas）15等知名跨国药企以及云顶新耀（ 01952.HK ）、 中国抗体（ 03681.HK ）等知名国内上市药企，协议潜在收款金额（包括首付款、 里程碑付款等） 累计已超过 20 亿美元， 其中 2025 年已收到 1.30 亿美元 （税前） 的不可撤销首付款，并确认收入，当年已实现公司层面的盈利，已初步实现创新 反哺研发； 下载日志已记录，仅供内部参考 i/AzCWhyibhuBLaTXJd4+n2qgL8FK9WEDiDn/9nOpEFlGSbyktXwWWeR6rzXxS4U 新股研究报告 | 信诺维 请阅读最后评级说明和重要声明 5/17 （2）公司首个创新药注射用亚胺西福预计将于 2026 年实现国内获批上市， XNW5004 、XNW27011 及XNW28012 等3 款药品已获 CDE 突破性治疗药物 认定，预计将于 2027 年至 2028 年间陆续实现国内上市，能够持续带动公司药 品销售收入的快速增长。 表2、公司尚在履行的 BD交易协议 签约 时间 管线 名称 靶点 药物 形式 被授权方 /受让 方 授权/转 让 适应症 范围 权益范围 付款安排（万美元） 首付款 里程碑 总额 销售分 成约定 2025年5 月 XNW 27011 Claudin 18.2 ADC ASTELLAS PHARMA INC.（安斯泰 来） 全部适 应症 在除中国大陆及中 国港澳台外地区的 研发、生产、销售 权利 13,000 140,600 153,600 低两位数 2021年9 月 XNW 1011 BTK 小分子  倍，显著高于传统软件公司估值。我们认为，这个估值是对社区基础设施网络效应而非现金流的定价，其 战略逻辑有三： 1 ）对冲最大客户群体的 “ 去英伟达化 ” ； 2 ）补齐云与模型分发能力； 3 ）强化开源安全与生态治理布局。 从 GitHub 到 Hugging Face ，开发者社区的战略价值持续提升。 微软收购 GitHub 后，其收入与 AI Coding 商业化持续增长，验证了开发者社区的商业价值；同时，社区与入口类资产的估 值中枢持续抬升。我们提出一个理解框架：芯片决定计算发生在哪里，而社区的价值在于决定算力需求流向哪里。随着算力供给 逐步增加、头部模型互相追赶，模型和算力分发入口的重要性提升。 中国已成为全球开源模型的重要供给方，自主开源 AI 社区建设的重要性进一步加强。 2025 年 2 月至 2026 年 2 月，中国开 源模型在 Hugging Face 下载量占比达到 41% ，首次超过美国，但国内模型分发与开发者社区底座仍相对薄弱。我们认为，随着国 产模型与国产算力持续发展，自主开源社区具有高稀缺性，有望成为连接 “ 模型 — 算力 — 开发者 ” 的关键基础设施。 估值与建议 我们维持相关标的盈利预测不变。国内兼具开发者社区、研发工具与 AI Infra 能力的独立平台相对稀缺，建议关注开源中 国上市，以及开源 AI 社区建设对研发工具、国产 IT 相关产业链的带动。 风险 交易尚需多国监管审批，存在不确定性；开源社区商业化进度或不及预期； AI 行业竞争加剧 仅供内部参考，请勿外传！", "status": "extracted"}, "post:2026-09-16T11-19:bb99796f944d": {"id": "post:2026-09-16T11-19:bb99796f944d", "kind": "post", "title": "2026-09-16 11:19", "source_label": "帖子正文", "excerpt": "🧧业绩为王，预期差成为股价弹性标杆 【#还请顶格支持电子13号小岳，不仅提供投资价值，还提供情绪价值】 大道至简，科技投资的核心就三件事:业绩！", "content": "🧧业绩为王，预期差成为股价弹性标杆 【#还请顶格支持电子13号小岳，不仅提供投资价值，还提供情绪价值】 大道至简，科技投资的核心就三件事:业绩！业绩！还是业绩！ 进入9月三季度强业绩&强预期差的个股表现非常亮眼，不少公司创了新高。 三季度强基本面赛道： ⭐光海外供应:华盛昌，华懋科技，光迅科技* ⭐存储国产替代:长鑫科技 ⭐PCB:景旺电子，天承科技，博敏电子 ⭐MLCC:三环集团，博迁新材，洁美科技 ⭐光台湾缓冲带:工业富联，鸿腾精密#文字观点", "publish_time": "2026-09-16 11:19", "tags": ["文字观点"]}, "post:2026-09-16T15-58:dd79a9c2a6f5": {"id": "post:2026-09-16T15-58:dd79a9c2a6f5", "kind": "post", "title": "2026-09-16 15:58", "source_label": "帖子正文", "excerpt": "9月16日复盘笔记：光通信/PCB/光纤/半导体材料/芯片产业/液冷/锂电池/福建本地/电力等一、重磅财经信息预告：9月18日上午10时 国新办就“十五五”时期推进住房城乡建设事业", "content": "9月16日复盘笔记：光通信/PCB/光纤/半导体材料/芯片产业/液冷/锂电池/福建本地/电力等一、重磅财经信息预告：9月18日上午10时 国新办就“十五五”时期推进住房城乡建设事业高质量发展有关情况举行新闻发布会二、大盘表现沪指涨0.71%，深证成指涨1.26%，创业板指涨1.96%，科创50指数涨4.14%。 沪深京三市成交额超过1.8万亿，较昨日放量逾2000亿。三、强势板块和个股分析备注：只列举部分涨停板光通信机构：“锁订单”、“锁物料”成为第27届光博会调研关键词，2027年需求确定性进一步提高。结合展会调研，部分高速光芯片企业订单排期已延伸至2028年及以后，光模块订单能见度覆盖2027年及以后。涨停板：光迅科技、可川科技、远望谷、中瓷电子、星网锐捷、青山纸业、瑞玛精密、华源控股其他强势股：东田微、杰普特、仕佳光子、长光华芯PCB机构：随着PCB上游材料价格持续上涨，涨价开始向部分PCB品类传导，涨价效果自2026年第三内容源头加微信 WUXL3408季度起将逐步体现。涨停板：东材科技、依顿电子、澳弘电子、瑞丰高材、卓郎智能、威尔高、奥士康、西陇科学其他强势股：金禄电子、一博科技、 ind": "post", "title": "2026-09-16 15:32", "source_label": "帖子正文", "excerpt": "看好向上弹性 # 稀缺的有源无源双IDM芯片平台公司，上游光器件正迎来通胀时刻，两大业务均迎来放量周期。", "content": "【国金电子】仕佳光子观点更新：光器件通胀，坚定看好向上弹性 # 稀缺的有源无源双IDM芯片平台公司，上游光器件正迎来通胀时刻，两大业务均迎来放量周期。# 光博会展出200mW/500mW CW激光器产品，公司Q2业绩超市场预期，Q3有望延续环比高增趋势。 公司产品进展加速，# 下游结构涵盖国内外头部客户。100mw CW批量出货，400mw CW小批量出货，100G EML客户送样验证中，CPO高通道FAU小批量出货等。看好公司几大业务线齐头并进，光芯片业务进展加速，产能爬坡加速，# 核心大客户积极锁定公司产能来缓解物料紧缺问题，公司27年产能超亿颗。# CPO用DFAU通过客户验证开始批量出货，客户给出很大指引，公司爬产顺利，明年有望增厚大量利润。# MPO和AWG产能持续扩产，配合客户指引持续上量。#文字观点", "publish_time": "2026-09-16 15:32", "tags": ["文字观点"]}, "post:2026-09-16T17-08:1320555e4265": {"id": "post:2026-09-16T17-08:1320555e4265", "kind": "post", "title": "2026-09-16 17:08", "source_label": "帖子正文", "excerpt": "【中信通信】持续推荐光的上游——光芯片+无源光器件 为什么我们一直优先推荐光的上游： 1、不受政策影响", "content": "【中信通信】持续推荐光的上游——光芯片+无源光器件 为什么我们一直优先推荐光的上游： 1、不受政策影响；2、各种技术路径都要用；3、产品随技术升级而大幅通胀。光芯片：国产高端化进程加速 上周光博会后的总结我们重点提到，国产光芯片高端化大幅提速，大量国内光芯片展出400mW CW激光器，100G/200G EML加速量产。目前国内多个光芯片公司加速400mW产品向北美送样，该产品单价相比传统70mW产品增长10倍以上，放量后利润率极高。光芯片的扩产壁垒很高，低端不降价，高端很挣钱。光无源器件：NPO/CPO时代价值量大通胀 无源产品向高密度、专业定制化方向演进，FAU从传统8芯/12芯向CPO时代的36芯以上演进。36 通道以上的 FAU等产品价值量显著提升。二季度所有无源光器件公司业绩爆发，当前对Q3和明年指引很高。最新变化 ①仕佳光子：光芯片方面，成都大客户订单加速交付，Coherent导入加速。400mW向北美导入，产品目前最高可以做到900mW。Mocvd预计27年6台以上；无源方面，MPO、MT-FA、FAU等多个产品开始爆发起量，康宁指引乐观。后续给康宁做高通道的36芯以上的D-FAU，价值量很高。 ②长光华芯：400mW CW与200G EML有望加速推动量产，扩产大幅加速，预计27年产能超1亿只。27年推出500-800mW CW激光器和400G EML。后续推出全新PCSEL，主打用于CPO的光互联。光芯片推荐：#源杰、长光、仕佳、永鼎、光迅等内容来自金斧头无源推荐：#仕佳、蘅东光、天孚、光库、东田微等#文字观点", "publish_time": "2026-09-16 17:08", "tags": ["仕佳、蘅东光、天孚、光库、东田微等", "文字观点"]}, "post:2026-09-16T21-57:0b9a3eb4c97a": {"id": "post:2026-09-16T21-57:0b9a3eb4c97a", "kind": "post", "title": "2026-09-16 21:57", "source_label": "帖子正文", "excerpt": "A股港股放量齐涨，半导体芯片领跑，美联储决议箭在弦上 2026年9月16日 · 沪深15:00 / 港股16:00 主线 美联储决议悬念下，A股与港股罕见同步放量普涨，成长股与芯片", "content": "A股港股放量齐涨，半导体芯片领跑，美联储决议箭在弦上 2026年9月16日 · 沪深15:00 / 港股16:00 主线 美联储决议悬念下，A股与港股罕见同步放量普涨，成长股与芯片股领涨压过收益率处十九年高位的担忧，银行股同步收复失地。 决议结果出来之前，两地市场先走出一波风险偏好回升，成长股盖过收益率高位的压力，银行股同步收复失地；这波回升能否延续，要看市场如何看待今晚美联储决议。 本日报要 主线段：美联储今晚（美东时间）公布利率决议。期货市场给加息25个基点开出的隐含概率升到91%左右，而非降息，这在本轮加息交易中属于少见的极端定价。10年期美债收益率仍停在十九年高位，今天略有回落（详见第4节）。就在悬念最大的这一天，A股与港股同步放量普涨，这一组合并不常见：两市上涨家数从昨天的约1,100家扩到约4,100家，科创50单日涨4.1%，半导体龙头中芯国际、寒武纪两地同涨；港股内银股收复昨天2%到3%的跌幅（详见第1、2节）。这究竟只是决议前的风险偏好回升，还是把明天的涨幅提前透支，要等决议结果揭晓才能定论。#文字观点", "publish_time": "2026-09-16 21:57", "tags": ["文字观点"]}, "post:2026-09-16T12-20:020f553e239a": {"id": "post:2026-09-16T12-20:020f553e239a", "kind": "post", "title": "2026-09-16 12:20", "source_label": "帖子正文", "excerpt": "关注寒武纪、海光、摩尔、沐曦、天数、壁仞等 ✨#摩尔线程最新深度：国产全功能GPU蓄锐将驰 全功能GPU：统一架构、覆盖AI计算、3D图形渲染、科学计算与物理仿真和高清视频编解码。", "content": "【申万计算机】摩尔线程首次覆盖+推荐整体国产算力！ 🔥算力近期：供应链扰动、摩尔签约10万卡、华为全联接/阿里云栖等#重点关注寒武纪、海光、摩尔、沐曦、天数、壁仞等 ✨#摩尔线程最新深度：国产全功能GPU蓄锐将驰 全功能GPU：统一架构、覆盖AI计算、3D图形渲染、科学计算与物理仿真和高清视频编解码。 公司核心团队来自NV、Microsoft、Intel、AMD、ARM等，覆盖GPU架构、软件及算力系统等。 ✨#国内AI芯片供不应求加剧国内AI芯片市场预计29年突破万亿。 按出货量计，25年国产AI芯片份额达41%，供应链扰动下+国产推理好用，国产GPU导入加速！ 26H1四小龙营收均达到/超过25年全年，大集群需求增加#摩尔已与京东云合作建设10万卡✨#产品覆盖芯片→集群芯片：当前为第4代平湖架构S5000，下代产品为花港架构S6000 服务器/超节点：MTT C256超节点实现256卡单层网络全互联； 集群：KUAE2支持万卡部署。 ✨#首次覆盖、给予“买入”评级预计27-28年营收67/111亿元，归母净利润9/26亿元。 相关材料请联系申万计算机团队#文字观点", "publish_time": "2026-09-16 12:20", "tags": ["重点关注", "国内AI芯片供不应求加剧", "摩尔已与京东云合作建设10万卡", "产品覆盖芯片→集群", "首次覆盖、给予“买入”评级", "文字观点"]}, "post:2026-09-16T12-20:ac30b786e5c0": {"id": "post:2026-09-16T12-20:ac30b786e5c0", "kind": "post", "title": "2026-09-16 12:20", "source_label": "帖子正文", "excerpt": "【广发机械】松发股份下跌点评：基本面无虞，调整即是机会-20260916 今日松发股份盘中股价调整，我们判断主要系传统资产板块带跌影响，公司本身基本面无任何利空，错杀带来良好的加仓", "content": "【广发机械】松发股份下跌点评：基本面无虞，调整即是机会-20260916 今日松发股份盘中股价调整，我们判断主要系传统资产板块带跌影响，公司本身基本面无任何利空，错杀带来良好的加仓和抄底机会。 #四期产能投放带来潜在业绩大幅超预期空间。公司四期扩产两个超大船坞（1298m长×146m宽），单个船坞面积接近一到三期船坞的2倍。超大船坞具备极强的稀缺性，目前全球长度超过500m的船坞寥寥无几，这赋予了公司在生产超大船型同时保持高效率和高利用率的能力，在高端船型具备更强话语权和更高定价权。目前公司四期扩产节奏较快，明年业绩有望继续上修。 #造船周期长景气持续、松发具备极低的远期估值+极大的业绩成长空间。许多投资者关心本轮造船周期的供需和持续性，我们判断到本轮周期长度仍将维持5-10年，船价将继续维持高位，详细的供需拆分我们都有相应的测算。松发远期业绩有5倍以上增长空间，当前对应远期估值仅4xPE，若未来行业需求继续超预期、公司是少数仍具备大规模扩产能力的厂商，未来份额将继续上行。 从松发500亿一路推荐到2000亿，继续坚定推荐，#恳请鼎力支持广发机械团队【6号】孙柏阳/汪家豪/黄晓萍 Ultra GPU）已推迟至2028年，较原定2027年目标延后逾12个月。传统电源架构仍存在巨大市场空间，且利润率预计高于800VDC架构。\u003c/li>\n\u003cli>大模型商业化继续加速：智谱最新年底ARR指引由24亿美元上调至30亿美元，核心来自Coding、CSP合作及CoWork三条业务线；ZCode用户数由上线首月100万进一步翻倍至约200万；公司当前算力乘数约0.46，GLM-5.3/5.3 Flash在60% GPU负载率、70%价格实现率假设下理论推理毛利率约76%。\u003c/li>\n\u003cli>PCB/CCL涨价链与AI PCB量价双增形成共振：电子布、铜箔及CCL价格持续上行，PCB厂商已陆续启动重新报价；二线CCL涨价兑现到报表，HZXC单张净利Q3已上修至接近60元，PCB二线预计Q3业绩也能大幅改善；AI PCB领域H2以来Rubin/Trainium 3已开始大规模拉货，TPU v8拉货有望于Q4启动。\u003c/li>\n\u003cli>光通信高景气延续且估值压制因素有所缓解：1.6T即将超大规模上量，部分物料需求可见度开始到28年及以后；NPO新方案百花齐放，CSP玩家众多，预计2027年生态成熟几成定局；可插拔光模块估值压制因素（FCC、CPO）有所缓解，需求侧部分专家口径出现27年1.6T指引上修。\u003c/li>\n\u003cli>宏观与风险偏好出现边际变化：9月全球基金经理调查显示，投资者对宏观繁荣与AI资本开支加速的信念依然稳固，但“债市无序上涨”及“民主党中期选举横扫”风险正在上升；FMS现金水平从3.5%跳升至3.9%。亚洲基金经理调查中，超八成受访者要求在增加AI相关敞口前看到清晰的盈利转化证明。美国10年期国债收益率升至5.033%，创2007年年中以来新高；标普500指数创8月份以来收盘新低。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线：AI算力/大模型与800VDC电源架构\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：800VDC采用进度比预期缓慢，到2030年占美国新建数据中心21%（较之前25%有所下降），完整800VDC架构至少还需要5年才会出现；传统电源架构仍存在巨大市场空间，且利润率预计高于800VDC架构，利好尚未布局固态变压器（SST）的厂商。Kyber NVL144机架系统（搭载Rubin Ultra GPU）推迟至2028年，较原定2027年目标延后逾12个月。\u003c/li>\n\u003cli>今天出现的催化/验证：专家电话会纪要聚焦英伟达800VDC架构对电气设备行业的影响；AI服务器功率攀升催化800V HVDC/SST落地，相关公司切入AIDC全链路电源测试，MW级测试。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：半导体/先进封装\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：半导体设备和国产算力快前低后集体拉回，国产芯片里燧原领涨，HW链意华领涨，周四大会+本身一些预期；卖方称cx新的扩产框架逐步和设备厂商谈了，有望年底下框架订单。SK海力士正与英特尔洽谈协议，拟首次在美国本土生产存储芯片。\u003c/li>\n\u003cli>今天出现的催化/验证：SK海力士与其工会就绩效奖金达成协议，奖金50%以现金支付、50%以公司股份支付；Omdia发布报告，2026年第二季度全球半导体营收突破4250亿美元，再创历史新高，环比增幅达到创纪录的31.4%；MLCC定价迎来转折点，7月MLCC美元平均售价同比下滑25.6%，但村田相关言论揭示定价正出现关键转折。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：PCB/CCL/铜箔\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：电子布涨价→CCL涨价→PCB厂涨价的传导顺序延续，二线CCL涨价兑现到报表，HZXC单张净利Q3已上修至接近60元，PCB二线预计Q3业绩也能大幅改善；AI PCB量价双增逻辑持续，传统涨价利润弹性释放。\u003c/li>\n\u003cli>今天出现的催化/验证：机构研报指出，随着电子布、铜箔及CCL价格持续上行，PCB厂商已陆续启动重新报价；AI PCB领域H2以来Rubin/Trainium 3已开始大规模拉货，TPU v8拉货有望于Q4启动；PCB产业链走访调研显示非AI领域PCB涨价大超预期，AI PCB新品拉货利润率非常可观。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：光通信/CPO\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：1.6T大规模倾向硅光形态，DSP/光源/隔离器/mSAP等物料锁定成为各家胜负手，头部玩家构建了极强；NPO新方案百花齐放，CSP玩家众多，预计2027年生态成熟几成定局；可插拔光模块整体逻辑没有太大变化，但估值压制因素（FCC、CPO）有所缓解。\u003c/li>\n\u003cli>今天出现的催化/验证：光博会详细总结显示1.6T即将超大规模上量，部分物料需求可见度开始到28年及以后；需求侧部分专家口径出现27年1.6T指引上修；27年800G翻倍以上增长，1.6T数倍增长，28年2.4T有望爆发释放2000万只需求，国内800G明年预计快速放量到4-5千万只；光迅科技联合思科推出1.6T硅光模块，发布OCS全光交换机。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：液冷/电源\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：液冷散热首次列入国家规划，政策驱动产业地位跃升；Rubin液冷产业链拉货正式启动，服务器拉货已开始向二次侧液冷零部件传导，Inner Manifold、波纹管、微通道液冷等环节订单进入明显提速阶段。\u003c/li>\n\u003cli>今天出现的催化/验证：工信部、发改委联合印发《电子信息制造业发展“十五五”规划》，明确2030年发展目标，在先进计算领域明确提出突破液冷散热关键技术；Rubin液冷产业链更新称Manifold有望成为下一轮高弹性环节；金洲管道拟以自有资金6.8亿元对全资子公司金洲智慧液冷技术（上海）增资。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：宏观/策略\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：全球基金经理调查显示，投资者对宏观繁荣与AI资本开支加速的信念依然稳固，但“债市无序上涨”及“民主党中期选举横扫”风险正在上升；FMS现金水平从3.5%跳升至3.9%，此前抑制夏季风险资产上行的过度看涨情绪正在消退。亚洲调查显示，超八成受访者要求在增加AI相关敞口前看到清晰的盈利转化证明，防御性板块轮动成为对冲AI下行风险的首选。\u003c/li>\n\u003cli>今天出现的催化/验证：美国10年期国债收益率升至5.033%，创2007年年中以来新高；交易员削减欧洲央行加息押注，当前认为10月加息概率为50%；美国财长贝森特表示，将联邦财政赤字控制在GDP的3%以内，对于美国国债收益率曲线的稳定至关重要；美股三大指数集体收跌，纳指跌0.78%，道指跌0.63%，标普500指数创8月份以来收盘新低。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>专家电话会纪要显示，800VDC采用进度比预期缓慢，预计到2030年占美国新建数据中心21%，较之前的25%有所下降；完整800VDC架构至少还需要5年才会出现；Kyber NVL144机架系统（搭载Rubin Ultra GPU）已推迟至2028年。\u003c/li>\n\u003cli>大模型跟踪显示，智谱年底ARR指引由24亿美元上调至30亿美元，核心来自Coding、CSP合作及CoWork三条业务线；ZCode用户数由上线首月100万进一步翻倍至约200万；算力乘数约0.46，GLM-5.3/5.3 Flash在60% GPU负载率、70%价格实现率假设下理论推理毛利率约76%。\u003c/li>\n\u003cli>PCB/CCL：机构研报指出，随着电子布、铜箔及CCL价格持续上行，PCB厂商已陆续启动重新报价；二线CCL涨价兑现到报表，HZXC单张净利Q3已上修至接近60元；AI PCB领域H2以来Rubin/Trainium 3已开始大规模拉货，TPU v8拉货有望于Q4启动。\u003c/li>\n\u003cli>光通信：光博会详细总结显示，1.6T即将超大规模上量，部分物料需求可见度开始到28年及以后；NPO新方案百花齐放，CSP玩家众多，预计2027年生态成熟几成定局；可插拔光模块估值压制因素（FCC、CPO）有所缓解，部分专家口径出现27年1.6T指引上修。\u003c/li>\n\u003cli>半导体：SK海力士正与英特尔洽谈协议，拟首次在美国本土生产存储芯片；SK海力士与其工会就绩效奖金达成协议，奖金50%以现金支付、50%以公司股份支付；卖方称cx新的扩产框架逐步和设备厂商谈了，有望年底下框架订单；半导体设备和国产算力快前低后集体拉回，国产芯片中燧原领涨，HW链意华领涨。\u003c/li>\n\u003cli>液冷：工信部、发改委联合印发《电子信息制造业发展“十五五”规划》，液冷散热首次列入国家规划，明确提出突破液冷散热关键技术；Rubin液冷产业链拉货正式启动，订单向二次侧液冷零部件传导，Inner Manifold、波纹管、微通道液冷等环节订单进入明显提速阶段。\u003c/li>\n\u003cli>宏观：美国10年期国债收益率升至5.033%，创2007年年中以来新高；交易员削减欧洲央行加息押注，当前认为10月加息概率为50%；美国财长贝森特表示，将联邦财政赤字控制在GDP的3%以内对于美国国债收益率曲线的稳定至关重要；美股三大指数集体收跌，纳指跌0.78%，道指跌0.63%，标普500指数创8月份以来收盘新低，美国柴油期货结算价创新高。\u003c/li>\n\u003cli>基金经理调查：9月全球基金经理调查显示“债市无序上涨”及“民主党中期选举横扫”风险上升，FMS现金水平从3.5%跳升至3.9%；亚洲基金经理调查显示超八成受访者要求在增加AI敞口前看到清晰盈利转化证明，防御性板块轮动成为对冲AI下行风险首选。\u003c/li>\n\u003cli>其他行业变化：炭黑市场刷新历年新高，山东主流N330炭黑报价11500-12000元/吨，相比9月初大涨3650元/吨，涨幅达45%；山东系统运行费执行分时电价政策，午间下浮70-90%，新政策将于10月1日起正式执行；SpaceX计划9月22日进行“星舰”重型运载火箭第14次试飞，首次尝试使“星舰”进入地球轨道飞行，并计划将26颗新一代“星链”V3卫星送入轨道；广汽筹划重大资产重组；商务部等8部门联合印发《促进智能家居消费行动方案》。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>美联储利率决议及债市对“债市无序上涨”风险的定价；美国10年期国债收益率与美股走势；欧洲央行10月加息概率变化。\u003c/li>\n\u003cli>800VDC架构落地节奏：完整架构至少还需5年；到2030年占美国新建数据中心21%；传统电源架构与SST厂商竞争格局；Kyber NVL144/Rubin Ultra延迟至2028年对AI算力、电源、液冷产业链节奏的影响。\u003c/li>\n\u003cli>智谱ARR指引兑现及Coding、CSP合作、CoWork三条业务线进展；算力乘数0.46与理论推理毛利率76%的持续性。\u003c/li>\n\u003cli>PCB/CCL重新报价落地及Q3业绩改善；AI PCB中Rubin/Trainium 3拉货、TPU v8 Q4启动；非AI PCB涨价与AI PCB新品利润率。\u003c/li>\n\u003cli>光通信：27年1.6T指引是否继续上修；1.6T硅光形态、DSP/光源/隔离器/mSAP物料锁定；28年2.4T需求释放及国内800G放量。\u003c/li>\n\u003cli>液冷：政策落地后液冷散热技术突破、Rubin液冷二次侧零部件订单提速、Manifold等环节弹性。\u003c/li>\n\u003cli>半导体：cx扩产框架年底下框架订单；SK海力士与英特尔美国本土存储芯片协议进展；HBM测试中KGD环节被市场低估的变化；MLCC定价转折的后续验证。\u003c/li>\n\u003cli>新能源/汽车：山东分时电价10月1日执行对储能影响；理想增资欣旺达、小米选定欣旺达作为核心电芯供应商后供应链份额变化；宁德时代消费税/出口退税影响及27年退坡；宁德时代近期跌幅较大后的底部预期梳理。\u003c/li>\n\u003cli>商业航天：SpaceX 9月22日星舰第14次试飞首次地球轨道及26颗星链V3卫星送入轨道。\u003c/li>\n\u003cli>海风：欧洲+国内订单共振，2027年行业有望迎来招标高峰，2028-30年进入装机高峰；深远海《3年行动方案》预计近期下发执行，计划3年内推进60GW深远海项目，储备80GW项目，并搭配深远海管理办法同步落地。\u003c/li>\n\u003cli>光伏：H1国内新增装机约70GW，按照全年180GW保守预期，H2新增装
