经过去。", "content": "周策略：一场硬仗 【摘要】： 每周周策略，不读不要做交易! 7月底以来的反弹还没有走完，前面那段轻松上涨期已经过去。本周上证指数下跌0.33% ，创 业板指上涨1.77%，科创50下跌1.51%，中证1000上涨1.18%。 指数看着平稳，资金偏好发生了变化。 前一阶段主要由机构偏爱的大市值科技股带动，这一周更多资金转去追逐小盘题材，量化资金 和游资也更活跃。 两市日均成交额从上周约2.41万亿元降至2.34万亿元，融资 融券余额继续上升，股票ETF规模 有所下降。 简单说，大家还愿意承担风险，可市场暂时没有找到一个能容纳大量资金、又能持续上涨的新 主线，所以交易难度大，这是必然的。 我觉得未来大致会这样走：先震荡，让获利盘卖出、观望资金接手，也就是做换手，9月底之 前仍有机会再涨一段。 能否越过6月底和7月初的高点，那就要看资金会不会重新回到科技抱团上。 以当前的资金结构和成交量看，支撑一轮修复问题不大，支撑全市场持续突破还欠火候。 还是老规矩，先讲宏观。 美国7月通胀整体温和。CPI环比上涨0.1% 、同比上涨3.4%； 剔除食品和能源后的核心CPI环 比上涨0.2%、同比上涨2.5%。市场更关注核心CPI，因为食品和能源价格波动太大。2026-08-16 19:05:06 能源价格环比下降1.5% ，住房成本只上涨0.1% ，通胀没有继续恶化。随后公布的7月零售销售 环比下降0.6%，是九个月来第一次下降。 其中用于计算GDP消费部分的“控制组零售”也下降0.4%。 就业变弱、通胀温和、消费降温同时出现，9月继续加息的必要性明显降低。 简单讲，加息预期已经开始被打掉了。 但是距离真正宽松还有一段路。7月PPI总指数环比持平，剔除食品、能源和贸易服务后的核心 口径环比上涨0.4% 、同比上涨4.7% ，企业端仍有一部分成本压力。霍尔木兹海峡的紧张局势 也可能随时推高能源价格。 7月美联储会议上有三名官员主张加息25个基点。这说明美联储仍然很在意自己的抗通胀信 誉。 眼下的市场规律很偏向鹰派。 通胀只要一次高于预期，加息概率就会迅速上升；经济偏冷的数据却要连续出现几个月，投资 者才会真正相信。 圈内人常讲的所谓“美联储交易的不对称性”，说的就是坏消息影响更快、更大，好消息需要 反复确认。 接下来我估计PCE还是会下来的，只是要把加息预期打掉，它有一个比较长的过程。总体看， 市场正在一点点排除加息风险，距离形成明确的降息预期仍有差距。 所以我觉得黄金这个位置上下跌的风险不大，但是上涨可能也是一个比较缓慢的过程。 继续耐心持有紫金矿业就好了。 美股这边标普500仍在历史高位附近，全周上涨约0.4%； 纳斯达克只上涨约0.1% ，周五两个 指数都冲高回落。多数公司已经公布完业绩，市场暂时缺少新的盈利上调动力。 8月26日的英伟达财报会成为下一场大考，投资者会同时看收入、毛利率、Rubin 出货进度， 以及云厂商投入巨额资金后能赚回多少钱。Rubin 是英伟达下一代AI计算平台，我是觉得海外 AI产业趋势仍能支撑A股算力产业链，暂时不需要太担心，我反倒觉得在这个节点上，存储已 经利空出尽、提前企稳的情况下，对于北美算力反而可以高看一眼。 中东这边双方还在谈，霍尔木兹海峡通行量仍低，8月14日又有船只遇袭；乌克兰也在持续打 击俄罗斯炼油厂，奥尔斯克炼厂受损后可能停产数月。 原油运输受阻会推高油价，炼厂停产又会减少对原油的采购，所以供需两端都在减少，这也是 布伦特原油没有大涨的原因。 油运这边我提醒两句，不要等到海峡恢复通行，一旦海峡恢复通行，股价预期往往会早于公司 业绩见顶。 再谈谈国内宏观。 央妈二季度货币政策执行报告释放了偏积极的信号，说要让现有政策充分发挥作用，并准备推 出实用的新增政策，同时保持市场资金充足、融资条件相对宽松。 8月14日，央行开展1万亿元六个月期买断式逆回购，到期多少就续作多少；此前三个月期品 种还多投放了2000 亿元。买断式逆回购就是央行向银行体系投放一段时间的资金。这样的操 作有助于稳定资金面、压住系统性风险，但目前仍看不到明确的降准、降息或大规模信贷扩张 信号。 主要是美联储还没动的情况下，我们这边虽然很想降准降息，但确实也更担心内外利差过大、 资金外逃的风险。 7月金融数据把真正的问题暴露得很清楚。人民币贷款减少3400 亿元，创下单月最大降幅；其 中住户贷款减少4603亿元，企业贷款减少1300亿元。 社会融资规模新增约1.41万亿元，主要靠政府发债、企业发债和股票融资支撑。社会融资规模 统计的是实体经济从银行贷款、债券、股票等渠道拿到的资金总量。 M2同比增长7.7% ，M1同比增长4.0% ，社融存量同比增长7.4% 。M2大致代表社会上的广义 货币，M1更接近企业和居民随时可以使用的活期资金；M1 明显低于M2，通常说明资金更愿 意躺在账户里。银行有钱，居民不愿增加负债，企业也缺少扩大投资的意愿，资金自然很难变 成真正的需求。在居民和企业愿意借钱、愿意花钱之前，消费、地产和传统制造的盈利很难持 续上调。政策消息可以带来一阵快速反弹，却很难立刻让市场风格全面转向内需。可以围绕 “数据越弱，政策可能越近”做短期观察， 现阶段就押注内需进入长期主升行情还太早。 四个字，内需很弱。价格数据也支持这个判断。7月CPI同比上涨0.5% ，剔除食品和能源后的 核心CPI同比上涨0.9%；PPI同比上涨3.5%，环比却下降0.7%。 从茅台的财报应该也能看出来这一点，上周我说了，白酒要做兑现，不要再做了。这周看完了 茅台的财报，我相信同学们应该能理解老师的意思了。 茅台尚且这么惨，其他白酒品牌你就不用琢磨了。 在书院，有时候避坑甚至比赚钱更重要。 相反，中芯国际二季度收入30.06 亿美元，环比增长20%，毛利率从一季度的20.1% 升至 25.3%；晶圆卖得更多，平均售价提高，高毛利产品占比也在上升。 这些业绩会推动资金重新评估各个行业。科技公司的新增利润更清楚；消费股看起来估值不 高，但是可能越跌越贵。 下周一将公布7月工业、消费、投资和地产数据，我估摸着也别太期待了。内需里面能玩的看 看除了红利，也只剩地产了。地产就趁着华润置地这种跌多了的捞一下，然后有点什么政策刺 激之类的涨两天就跑，只能干这种交易。 再讲讲大盘。 本周上证指数收于3927 点，全周下跌0.33%； 上证50和沪深300分别下跌1.50% 和0.61% ，创 业板指上涨1.77%，中证1000和国证2000分别上涨1.18%和1.45%，北证50下跌4.12%。 港股更弱，恒生指数和恒生科技指数分别下跌2.15% 和3.10% ，主要是腾讯跌下来闹的，腾讯 和腾讯音乐这个财报市场都不认可。 成交结构比指数涨跌更值得看。两市日均成交额约2.34万亿元，低于上周的2.41万亿元。融资 融券余额从2.65万亿元升至2.68万亿元，说明借钱买股票的杠杆资金仍在增加。股票ETF规模 从2.80万亿元降至2.74万亿元，目前可以确认的情况是，杠杆资金在加仓，偏机构的新增资金 却没有同步放大。 这就解释了本周盘面为何看着热闹、实际很脆弱。 能吸纳大资金的方向没有形成合力，微盘题材、创新药、地产、白酒和传媒轮流活跃。很多资 金只是看到科技股高开回落后，临时转去其他板块，并没有找到新的利润增长主线。 中证2000 已经连续反弹，连板股中开始出现明显淘汰，微盘股投机的成功率正在下降。后面 即使科技股再度走弱，这些用来躲避科技波动的方向也未必安全，部分股票已经涨得不便宜。 我觉得下周市场还是会回归科技主线，我不建议在这个地方四处出击。 卖方有个反弹四步走框架。 第一步，超跌股票先反弹。 第二步，很多持仓回到成本附近后，解套卖盘开始增加。 第三步，三季报公布后，利润增长用来消化偏高估值。 第四步，新的产业消息把资金重新聚到一个方向。 我觉得现在大致处在第一步结束、第二步刚开始的位置。 从一个地方就能看出来了，这波反弹，科技大票都没怎么涨，涨的多的都是一些边缘题材和小 盘股，这就充分说明问题了。 市场需要通过回调或横盘，让愿意卖和愿意接的资金充分交换，9月才更有条件再涨一段。 不少投资者都在期待9月行情，预期过于一致本身会增加波动。假如元首会晤、外部限制缓 和、国产算力部署和英伟达财报等消息超出预期，科技股有机会直接挑战前期高点；假如这些 消息只够缓解7月的担忧，9月更可能形成一个修复高点，随后进入以季度计算的震荡。 股价想超过6月底的水平，大家对公司未来利润的预期也要强于6月底。仅仅消除担忧，通常只 能让股价回到前期压力位。 下周比较好的情景，是成交额重新超过2.6万亿元；光模块、PCB、半导体设备等大市值龙头 重新走强，反弹进入第二段，科创板和创业板创业板表现更强；科技龙头重新掌握市场定价 权。 一般的情景那就是继续震荡，继续轮动，跌到60分钟55线再去找方向。 有一点是确定的，3750破了的概率不高。 最后讲讲板块。 这周最大的消息，无疑是英伟达已经确认Spectrum-X Ether net Phot onics 进入生产，意味着 CPO从规划图走到产业化初期。 CPO全称“共封装光学”，做法是把负责光电转换的光引擎放到交换芯片旁边，缩短高速电信 号需要传输的距离，从而降低耗电和信号损耗。 英伟达公布的系统级效果包括：功耗效率提高到五倍、连续运行时间提高到五倍、可靠性提高 到十倍。随着这类交换机量产，Switch tray、PCB、光引擎、外置激光源、FAU和高密度光纤 连接都会受益。 这些名词我还是解释一下，Switch tray可以理解为装有交换芯片和电路板的交换机核心托盘； PCB是印刷电路板；F AU是把多根光纤精准排成一列、再与光芯片对接的光纤阵列单元。 CPO量产会扩大整个光通信市场，也会重新分配产业链利润。 问题来了，这次的合作伙伴里都是台系厂商，大陆只有一个天孚通信。在地球人都知道只有天 孚通信的时候，这里A股的内卷就会充分体现出来，实操中，你去追涨天孚通信，往往是赚不 到钱的。 不如换个角度，800G 和1.6T可插拔光模块仍在快速放量。因此中际旭创、新易盛的盈利不会 被一台CPO交换机马上取代，尤其是NPO路线，在我眼里的增量更大。 NPO 路线里新易盛更好，中际旭创次之，所以如果周一因为天孚通信大涨，新易盛、中际旭创 不涨甚至被吸血下跌，我反而觉得是个中期比较好的买点。因为大光之前基本没怎么涨，行情 要向前走，没有大光是不可能的。 我觉得当前可能就是一个买北美的一个不错的机会。 材料这边我更看好ABF载板，就是兴森科技、深南电路。兴森也是华为系的核心供应商，深南 电路是华为第二大供应商，也是面向海外的平台载板龙头。 如果仓位京东方比较多的，我认为可以先转过来做兴森、深南，等这俩涨完了，再回头去做京 东方会好一些。 然后立讯就是等量产、出货的消息，其他没什么，坐等就好。 软件就只看 深信服 就够了、等财报吧。 国产这边其他的没什么好说的，中芯国际二季度收入、平均售价和毛利率一起改善，是本周最 有分量的国产产业链证据。这说明成熟制程芯片的供需仍然不错，国产AI芯片需求也很强，中 芯国际涨完了之后，接下来也该轮到芯片了， 寒武纪、海光 之类的国产芯片应该有所反应。 超节点反正耐心等中兴通讯盛科通信看看这个月给不给行情，然后圣邦这种模拟芯片也财报不 错，也有些人看好。 IDC方向东阳光还能涨，国产AI卡部署加快、HBM 供应紧张都可能提高已有设备的使用率，再 耐心拿一拿。阿里巴巴周五差一点点要减仓，如果周一还不行就做做波段，110附近再买回 来。 材料捞了一个 中瓷电子 ，光刻机捞了一个 茂来，感觉都还可以，继续做吧。 防守这边就还是紫金矿业最好，因为虽然金价可能接下来短期需要消化消化，但是铜矿可能会 涨一波，海外需求非常好，所以紫金仍然有向上的空间。 短线就不讲新的了，继续把捞的光刻机的茂莱做好吧。 就说这么多，祝大家下周投资顺利！ 申文冠 执业编号：A0670623050002 云南约牛软件技术有限公司 风险提示：投资有风险，入市需谨慎 内容未经同意严禁转载，违者追究法律责任", "status": "extracted"}, "attachment:files/电子新旗手20260816_原文.pdf": {"id": "attachment:files/电子新旗手20260816_原文.pdf", "kind": "attachment", "title": "电子新旗手20260816_原文", "source_label": "其他", "excerpt": "电子新旗手 20260816_ 原文 2026 年08月17日 07:36 发言人 00:00 从腾讯资本开支来看一下 CST的下半年的资本开支的展望。第二点需求侧就是在模型端 ，我们看到 像8月14号开源了千问的 3.8，然后通过也是 27B的一个原生多模态的一个稠密模型。", "content": "电子新旗手 20260816_ 原文 2026 年08月17日 07:36 发言人 00:00 从腾讯资本开支来看一下 CST的下半年的资本开支的展望。第二点需求侧就是在模型端 ，我们看到 像8月14号开源了千问的 3.8，然后通过也是 27B的一个原生多模态的一个稠密模型。然后也是在发布当 天实现了生成的带零的全面适配。然后包括通过这个 flag OS 屏幕完成了平头哥、摩尔、昆仑芯、海光等 多类芯片的兼容。 发言人 00:32 第二个就是 deep take ，在13号就8月13号上线了这个 V4的pro一个正式版本。然后也是完成了这个升腾 寒武帝帝刃、海光这样的适配。然后 MOE 的架构也支持这样一个分布式部署 ，然后也是适配到了国产多 卡的一个计算的这样一个集群。包括我们也看到这个 G那个质谱的 GM5.3 ，启动这个灰度测试 ，然后在 算力适配上优先面向让客户完成这个升腾寒武纪的适配。 发言人 01:02 所以这一波一个国产模型的迭代 ，我们认为有这样几个几个一个几个共性。第一点就是模型尺寸的这样 一个选择 ，就20到30D的一个车模型成为了可以说国产算力比较优的这样一个载体。因为超大的 MOE 训 练其实仍高度依赖这个高端战力。但是 27B的这样一个级别的一个重力模型 ，它的性能是比较均衡 的，然后显得这样的也比较稳定 ，所以是啊比较适合像升腾寒武纪 ，避认这样 cerpt": "【方正电新&电子】帝奥微：光通信订单进入兑现期，CPO+OCS+NPO+AFE打开成长空间 高性能模拟芯片领先企业、仙童团队基因深厚。公司成立于10年，核心管理团队主要来自 “硅谷的摇篮” 仙童半导体，董事长鞠建宏在仙童做到了华人能够获得的最高职位，公司已形成信号链与电源管理双产品线。", "content": "【方正电新&电子】帝奥微：光通信订单进入兑现期，CPO+OCS+NPO+AFE打开成长空间 高性能模拟芯片领先企业、仙童团队基因深厚。公司成立于10年，核心管理团队主要来自 “硅谷的摇篮” 仙童半导体，董事长鞠建宏在仙童做到了华人能够获得的最高职位，公司已形成信号链与电源管理双产品线。公司已于26年4月启动调价，7月起逐步执行新价格，后续会进入持续涨价周期；叠加客户导入、产能锁定及新品放量，26H2收入和利润有望加速改善。 光通信订单由验证阶段进入规模兑现。公司产品已向光迅、华工、剑桥等客户批量出货，Coherent已有8款物料测试通过并取得订单，Credo部分料号已开始供货，中际旭创亦有多款产品完成验证并进入小批量阶段。 800G向1.6T、3.2T升级，单模块价值量持续提升。公司已布局AFE、TEC Controller、负载开关等光模块等芯片，800G单模块现有料号价值量约10美元，1.6T有望提升至20美元以上，3.2T则可能达到50-60美元以上。100pin AFE是1.6、3.2T光模块刚需，而且公司是全球唯四，唯一能够进入海电源方面升级到1.6T/3.2T所需的20A以上模块电源后单颗价值十几到二十几元。 CPO与OCS打开第二成长曲线。公司CPO相关产品正配合海外客户持续推进，随着光引擎数量和器件复杂度提升，AFE、TEC及电源管理芯片用量有望进一步增加。公司同时布局OCS数模及控制芯片，用于精确调整棱镜或微镜角度，单机价值量据产业链测算可超过4,000美元；按照10万-30万台潜在部署规模，对应市场空间约30亿-90亿元，若实现规模化落地，将成为公司中期弹性最大的业务之一。 AI PC、机器人及汽车电子同步拓展。公司与Intel合作研发的eUSB Repeater已通过参考设计平台验证，并在终端PC厂商出货，全球主要竞争对手仅NXP；同时布局PCIe Driver等GPU、CPU配套芯片。机器人领域，公司已进入宇树等客户供应链，潜在单机价值量约1,000元；汽车电子方面，公司已形成上百款车规产品，部分产品自26年起进入放量阶段。 估值弹性来自核心客户份额提升及产品结构升级。产业链乐观情景下，某头部光模块客户27年模拟芯片采购规模约80亿元，若帝奥微获得20%份额，理论上可贡献约16亿元收入和4亿元利润；若Coherent、Credo、中际旭创、光迅、华工及剑桥等客户同步放量，公司利润存在进一步上行空间。上述数据属于情景测算，实际结果仍取决于订单规模、份额、产品结构及毛利率。 风险提示：客户导入及订单不及预期、AFE/CPO/OCS研发进度不及预期。#文字观点", "publish_time": "2026-08-17 15:08", "tags": ["文字观点"]}, "post:2026-08-17T22-36:644eb1c70aea": {"id": "post:2026-08-17T22-36:644eb1c70aea", "kind": "post", "title": "2026-08-17 22:36", "source_label": "帖子正文", "excerpt": "市场还在用“传统LED”给【乾照光电】估值，公司却已完成光通信最稀缺的InP产业布局#未知来源，注意吹票风险上游参股康鹏，卡位磷化铟衬底；中游参股芯胜，布局磷化铟外延", "content": "市场还在用“传统LED”给【乾照光电】估值，公司却已完成光通信最稀缺的InP产业布局#未知来源，注意吹票风险上游参股康鹏，卡位磷化铟衬底；中游参股芯胜，布局磷化铟外延；下游依托自身Ⅲ-Ⅴ族化合物半导体积累，向高速光通信芯片延伸。衬底—外延—光芯片，三大关键环节，乾照均已落子。 1️⃣浙江康鹏：占据最上游衬底，与芯胜构成上下游卡位 乾照光电持有康鹏科技约17.7%股权，并预计2026年与康鹏发生不超过4500万元的原材料采购。康鹏聚焦磷化铟衬底，自主掌握磷化铟多晶合成、VGF 单晶生长核心技术，手握多项磷化铟合成发明专利，现已实现 2 英寸、4 英寸 InP 衬底量产，同步推进 6 英寸大尺寸衬底研发。 2️⃣浙江芯胜：卡位磷化铟外延，切入高速光通信核心材料 乾照光电持有浙江芯胜约19.7%股权。芯胜在浙江兰溪建设化合物半导体外延片生产基地，围绕磷化铟材料布局MOCVD外延工艺。下游直接对应AI数据中心高速光通信，同时还能覆盖5G射频、激光传感等领域。公司的产品技术指标达到国际先进水平，拥有先进的研发设备和器件仿真软件系统，具备完整的测试设备，并建成了具有自主知识产权的砷化镓和磷化铟大规模生产基地，未来计划实现年产超过100万片的目标。 3️⃣乾照自身：从LED芯片能力向高速光通信芯片延伸 乾照在Ⅲ-Ⅴ族化合物半导体领域积累多年，已经形成材料外延、芯片设计和工艺制造能力。公司披露，10G/25G VCSEL产品已经完成送样，50G/100G产品进入流片阶段；同时还在推进大功率InP激光器、Micro LED光互连及CPO短距光互连相关技术。 乾照光电在光通信全产业链的布局关系非常清晰： → 康鹏：InP单晶及衬底 → 芯胜：MOCVD外延片 → 光通信芯片 → 800G/1.6T高速光模块及CPO/NPO 市场目前看到的可能仍是一家LED公司，但乾照真正值得重估的，应是其背后逐渐成形的“磷化铟衬底—外延—光芯片”产业版图，#乾照光电究竟应该按传统LED估值，#还是应该叠加AI光通信和磷化铟产业链的成长溢价？#文字观点", "publish_time": "2026-08-17 22:36", "tags": ["未知来源", "注意吹票风险", "文字观点"]}, "post:2026-08-17T12-02:86cc53f6119e": {"id": "post:2026-08-17T12-02:86cc53f6119e", "kind": "post", "title": "2026-08-17 12:02", "source_label": "帖子正文", "excerpt": "天风通信 | 光互联：8月持续打气强call，#重申跌出的分歧和黄金坑，未来依旧有望迎来中美科技共振行情！1、观点：AI长期叙事和FCC制裁的担忧已消化相对充分，市场筹码做了再均衡，而光互联头部厂商位置/估值处于低位。", "content": "天风通信 | 光互联：8月持续打气强call，#重申跌出的分歧和黄金坑，未来依旧有望迎来中美科技共振行情！ 1、观点：AI长期叙事和FCC制裁的担忧已消化相对充分，市场筹码做了再均衡，而光互联头部厂商位置/估值处于低位。 北美AI硬件已经开始进入财报陆续披露窗口，观察股价也是正反馈阶段，我们判断随着8月底旭创/英伟达/Marell/博通等硬件龙头公司披露财报和指引，#月底有望迎来中美AI硬件的共振行情。2、光互联：#Scale-across、scale-out、scale-up再到未来scale-in，光互联不断有增量应用场景，同时内生盈利能力持续提升显著抗通缩属性。#格局：从关键物料锁定和新技术迭代看，格局会呈现强者恒强，#未来轻相干、硅光调制、薄膜铌酸锂、先进封装等核心技术，会持续构筑行业高门槛。 #短期，Rubin上修拉动1.6T光模块显著上修，同时NPO明年开始明确放量；#中长期：2.4T、3.2T、XPO、Scale-in等新技术含量更高的产品打开更大市场空间。 #NPO：从今年3月OFC只有旭创新易盛在强势站台NPO，到近期财报窗口期，#Cohr和Lite电话会议都...", "publish_time": "2026-08-17 12:02", "tags": ["月底有望迎来中美AI硬件的共振行情", "格局", "文字观点"]}, "attachment:files/国海证券-猎奇智能(A25089)招股说明书梳理报告：十年光模块封测之路，从设备替代到产业链延伸-260815.pdf": {"id": "attachment:files/国海证券-猎奇智能(A25089)招股说明书梳理报告：十年光模块封测之路，从设备替代到产业链延伸-260815.pdf", "kind": "attachment", "title": "国海证券-猎奇智能(A25089)招股说明书梳理报告：十年光模块封测之路，从设备替代到产业链延伸-260815", "source_label": "国海证券", "excerpt": "国海证券研究所 请务必阅读正文后免责条款部分 2026年08月15日 行业研究 研究所： 证券分析师： 张钰莹S0350524100004 zhangyy03@ghzq.com.cn[Table_Title]十年光模块封测之路：从设备替代到产业链延伸 ——猎奇智能（A25089）招股说明书梳理报告 最近一年走势 行业相对表现 2026/08/14 表现 1M", "content": "国海证券研究所 请务必阅读正文后免责条款部分 2026年08月15日 行业研究 研究所： 证券分析师： 张钰莹S0350524100004 zhangyy03@ghzq.com.cn[Table_Title]十年光模块封测之路：从设备替代到产业链延伸 ——猎奇智能（A25089）招股说明书梳理报告 最近一年走势 行业相对表现 2026/08/14 表现 1M 3M 12M 通用设备 -5.0% -8.1% 31.2% 沪深300 -2.7% -5.1% 11.8%投资要点: 本篇报告解决了以下核心问题：1、公司的核心竞争优势是什么？2、光模 块封测设备行业空间如何？3、高速光模块及先进封装趋势下，公司成长 空间如何打开？ 光模块封测设备领先企业，持续拓展全球化业务版图。据公司招股说 明书，公司深耕光模块封测设备领域，2016年首台耦合设备交付中 际旭创，2018年推出首台共晶贴片设备EB1000，2023年第三代耦 合设备应用于800G/1.6T高速光模块，精度达到±0.05微米级。近 年来，公司持续布局微组装、TCB、LAB等先进封装工艺，并向半导 体微波射频、IC封装及SiC等领域延伸。同时，公司通过飞泰智能、 皓软软件、瑞森联等子公司完善制造及配套体系，并设立新加坡芯 杰、泰国飞泰推进海外布局。 营收持续高增，2026H1进入加速放量阶段。受益于高速光模块需求 增长，公司收入保持快速增长。2022-2025年，公司营业收入分别为 1.45亿元、2.89亿元、5.43亿元和6.98亿元，2026H1实现营业收 入5.81亿元，同比增长136.03%；归母净利润分别为0.35亿元、 0.82亿元、1.81亿元和1.82亿元。分产品来看，贴片设备和耦合设 备为主要收入来源，2025年分别实现收入2.44亿元和1.63亿元， 占主营业务收入34.93%和23.29%。 从设备矩阵到先进封装布局，持续拓展技术边界。公司围绕光模块制 造核心环节形成贴片、耦合、老化测试及自动化整线设备矩阵。其中， 贴片设备精度达到±1μm，耦合设备X/Y/Z轴重复精度达到±0.05 μm，满足800G/1.6T高速光模块生产需求。公司持续加强核心技 术积累，布局高精度运动控制、视觉定位、主动耦合及微组装等技术， 并进一步向TCB、LAB、硅光集成及CPO等先进封装方向拓展，推 动业务由单设备供应向综合解决方案升级。 高速光模块扩产驱动行业成长，国产替代打开长期空间。AI算力基 础设施建设推动800G、1.6T高速光模块需求快速增长，带动封装测 试设备需求提升。随着光模块制造向高精度、高集成方向发展，贴片、 耦合、老化测试等设备价值量持续提升。公司凭借多环节设备布局、 1828204 下载日志已记录，仅供内部参考 证券研究报告 请务必阅读正文后免责条款部分 2核心技术积累及头部客户合作优势，有望受益于高速光模块扩产、封 测设备国产替代以及先进封装产业趋势。 风险提示：技术创新、产品升级的风险；原材料价格波动及供应链稳 定的风险；存货跌价风险；客户集中度较高的风险；可比公司及数据 参考风险。 下载日志已记录，仅供内部参考 证券研究报告 请务必阅读正文后免责条款部分 3内容目录 1、光模块封测设备领先企业，持续拓展全球化业务版图...........................................................................................6 1.1、深耕光模块封测设备，构筑国产替代领先优势...............................................................................................6 1.1.1、光模块封测设备“国产替代先锋”.......................................................................................................6 1.1.2、十年深耕光模块封测设备，从国产替代到技术升级..............................................................................6 1.1.3、深度绑定中际旭创：从首台交付到全球龙头的共同成长......................................................................7 1.2、股权结构清晰，构建“制造+配套+海外”业务体系........................................................................................8 1.2.1、股权架构：创始人控股+产业资本入局............................. 术的积累，EB3300共晶贴片机精度达±1μ m，可对标MRSI等国际龙头；LQ-VADB30采用高精度视觉对准算法，兼顾效 率与可靠性。 2024—2025年：推出新一代高性能设备，并向半导体先进封装和多元化领域延 伸。2024年公司研发微组装工艺，推出微组装平台，针对TCB、LABreflow等 先进封装工艺进行研发。2025年固晶贴片设备进一步迭代，推出LQ-VADB30P 和HS-DB3000，性能大幅提升，比肩BESI、ASMPT等国际龙头。 公司布局硅光集成与光电共封装，并向半导体其他领域延伸。基于硅光集成和 CPO需求，依托H3及实时对准平台，推进激光共晶、LAB及TCB工艺：激光 共晶/LAB实现局部加热精准焊接；TCB通过脉冲加热（100℃/s）在氮气下实现 芯片级键合，减少互联距离。同时，依托底层技术向半导体延伸：固晶/共晶设备 已用于微波射频并批量供货；IC领域研发高速固晶机、TCB设备（样机验证）， SiC预烧结设备已通过士兰微验证。 图3：公司主要产品、主要客户演进情况 资料来源：公司招股说明书 1.1.3、深度绑定中际旭创：从首台交付到全球龙头的共同成长 中际旭创是猎奇智能发展史上最重要的战略客户。2016年，公司首台自主研发 的光模块耦合设备即交付中际旭创，由此开启了双方长达十一年的深度合作。彼 时中际旭创尚处于高速成长期，猎奇智能也刚切入光通信设备赛道，双方的合作 从一开始就带有“共同成长”的性质——猎奇智能根据中际旭创的产线需求不断 迭代产品，中际旭创则通过批量采购为猎奇智能提供了持续的收入来源和技术验 证场景。 根据招股说明书，公司对中际旭创的销售收入占比分别为62.19%（2023年）、 58.85%（2024年）和53.42%（2025年），呈逐年下降趋势但仍超过50%， 公司对中际旭创存在重大依赖。这种依赖具有行业结构性背景——下游光模块厂 商市场集中度较高，据LightCounting及弗若斯特沙利文统计，2025年中际旭 创光模块全球市场份额排名第一（ 8 0 0 G 及以上份额超 4 0 % ），中国前十光模块 供应商全球市占率超过55%。公司客户集中度较高与下游行业竞争格局较为集 下载日志已记录，仅供内部参考 证券研究报告 请务必阅读正文后免责条款部分 8中的发展现状相一致。目前，公司正通过拓展全球前十光模块厂商中的另外八家 以及半导体、汽车自动化领域新客户，逐步降低单一客户集中度。 1.2、股权结构清晰，构建“制造+配套+海外”业务体系 1.2.1、股权架构：创始人控股+产业资本入局 公司股权结构呈现“创始人高度控股+多元化战略投资者参股”的特征。截至本 次发行前，控股股东昆山奔博（持股36.77%）和实际控制人罗超（直接持股 20.63%）合计控制57.40%的表决权。罗超为公司创始人和董事长，本次发行后， 罗超及昆山奔博持股比例将降至约43%，仍保持相对控制地位。 图4：公司股权结构图（截至招股说明书签署日） 资料来源：公司招股说明书 表1：公司前十大股东（截至招股说明书签署日） 股东名称/姓名 持股数量（万股） 持股比例（%） 昆山奔博 1,516.58 36.77 罗超 851.14 20.63 毕延文 340.46 8.25 南京俱成 141.86 3.44 广发乾和 128.96 3.13 昆高新创投 103.17 2.5 昆山美满 92.85 2.25 金浦慕和 81.14 1.97 毅达众创 77.38 1.88 金海通 73.66 1.79 葛宏涛 73.66 1.79 资料来源：公司招股说明书，国海证券研究所 下载日志已记录，仅供内部参考 证券研究报告 请务必阅读正文后免责条款部分 91.2.2、完善产业链布局，构建全球化业务体系 公司形成“核心制造+产业链协同+全球布局”的业务体系。公司子公司体系围绕 光模块封装测试设备业务展开，其中飞泰智能为唯一重要子公司，是公司核心生 产制造基地。2025年度飞泰智能实现营业收入1.76亿元，占公司合并营收25.2%， 贡献净利润3,708.40万元，在公司业务体系中承担重要生产职能。 多环节布局完善设备制造能力。公司通过凯欧光电、峻博软件、瑞森联及云琦精 密等子公司，分别覆盖机加工、软件开发、激光设备及陶瓷劈刀等环节，进一步 完善设备研发、零部件配套及生产制造体系，提升整体交付能力。 海外双基地布局开启全球化拓展。公司于2023年设立新加坡芯泰和泰国飞泰， 分别承担海外研发销售及生产服务职能，初步构建海外业务支点。随着光模块产 业链全球化推进，公司海外布局有望支撑国际客户拓展。 表2：公司子公司/分公司基本情况 序号 公司名称 股权结构 认缴出资额 进入时间 主营业务/业务定位 1武汉飞泰智能设备有 限公司猎奇智能 周期数据管控为基准情景，稀土磁体为升级抓手。数据稀缺是人形机器人训练的核心瓶颈，中国厂商正加速扩大训练数据集与高价值数据积累——例如国内龙头Galbot计划两年内将高质量数据量提升10倍。叠加中国当前人形机器人市场规模数倍于全球其他地区，数据优势显著。借鉴汽车行业经验，中国已建立覆盖研发、模型开发、生产制造、运营维护全链条的数据出口管控体系，我们预计机器人领域将复制类似框架，以全生命周期数据管控作为基准政策响应。此外，稀土磁体是中国最强的政策杠杆：其是现代人形机器人的核心材料，中国掌控从开采到加工的全产业链主导权，且政策工具持续完善。尽管目前保持克制，但若美方进一步升级，收紧稀土磁体出口管制可能成为关键反制手段。 产业链影响与投资机会：中美脱钩将催生差异化受益标的：（1）美国市场受政策壁垒保护，本土人形机器人整机制造商（如特斯拉、Figure、Agility）将直接受益；（2）依托强有力的反制能力，中国头部整机厂有望在非美市场持续扩张，海康威视的海外拓展路径可提供参考；（3）具备海外产能的中国核心零部件供应商（如双环传动、拓普集团、禾赛科技、奥比中光）将同时受益于中美机器人产业增长；（4）非中国零部件供应商（如舍弗勒、哈默纳科）将获得美国客户供应链多元化带来的增量机会；（5）美国技术限制升级将加速中国AI芯片与仿真平台的国产替代，地平线机器人、黑芝麻智能依托智能驾驶芯片技术积累布局机器人芯片，若芯片端脱钩落地，两家公司将显著受益。 评级与估值：我们维持双环传动、禾赛科技、拓普集团、汇川技术、哈默纳科、海康威视、比亚迪、小米“跑赢大盘”评级；维持三花智控、小鹏汽车、埃斯顿“与大盘持平”评级；给予绿的谐波“跑输大盘”评级。其中地平线机器人目标价10港元（跑赢大盘），黑芝麻智能目标价16港元（跑输大盘）。#文字观点", "publish_time": "2026-08-17 18:39", "tags": ["文字观点"]}, "attachment:files/电新每周汇20260816_原文.pdf": {"id": "attachment:files/电新每周汇20260816_原文.pdf", "kind": "attachment", "title": "电新每周汇20260816_原文", "source_label": "其他", "excerpt": "电新每周汇 20260816_ 原文 2026 年08月17日 07:36 发言人 00:00 应该说整个电影板块 ，不管是科技 ，发生的事情还是挺多的。本周也是会对大家关注的一些问题 ，我们 来由我和我们三位团队的三位分析师一起来给大家做一个汇报。", "content": "电新每周汇 20260816_ 原文 2026 年08月17日 07:36 发言人 00:00 应该说整个电影板块 ，不管是科技 ，发生的事情还是挺多的。本周也是会对大家关注的一些问题 ，我们 来由我和我们三位团队的三位分析师一起来给大家做一个汇报。我会先给大家整体还是汇报一下 ，目前 对整个电信板块的一个配置的一个思路的建议 ，以及解读一下最近大家关比较关注的这个光伏 ，中游有 一些环节价格大涨的这样一个情况。随后会有我们三位分析师分别给大家汇报这个 AI电源，SIC以及资 源电器半年报的解读 ，这三个核心内容。 发言人 00:27 本周的话他说整个科技这块 ，最重要的还是英伟达发布了 856的一个架构和技术的 2.0版本。这次的这 个2.0的版本 ，应该说是完整的定义了下一代 AI工厂它标准化的一个直流供电体系 ，也标志这个 800伏的 直流已经完成了概念验证 ，正式进入一个工程实施的阶段。那么从对投资的影响角度来说 ，就这一次的 这个2.0的版本 ，我们说除了再一次明确这个机架功率的跃升 ，会驱动 856的架构这样一个升级之外。以 及重新梳理了各类电源架构的产品形态和预计的部署时间窗口。更重要的还是对英伟达在这个 2.0地图 里面释放出来一个信号 ，说要积极的扩大生态链。后续的话 ，我们估计也会有更多的中国大陆企业 ，进 入他800伏的供电体系。我们也再次重申一下 ，当前的景点整个对于电源板块的 AI电源板块的一个重点 推荐的核心标的的话 ，还是麦德美特、中资电路和欧陆通三家公司。同时的话 ，电源的架构的升级 ，也 会对于叶冷这块儿的一个技术细节会产生一些因为这个影响。 发言人 01:22 叶轮这块的话 ，最近整体的这个关注度还是不错。大家也更多的是在关注一些细分环节和个股的一些边 际变化。这块的话也是建议大家去做一个重点关注的 ，就是关于电源和电缆这块。另外就是上周的应该 是在上周末的时候 ，英伟达是宣布了 30亿美元去入股电力基础设施开发商。这个事情 ，应该说也是很大 程度上进一步验 ，带动高端 PCB需 求快速扩张 。去年以来 头部PCB厂商资本开支持续上行， 2026Q1扩产进度进 一步加快， 投向以 mSAP/高速高密高多层 PCB等先进制程为主， 随着 单板层数、 材料等级和线路密度持续提升 ，制程难度由传统线宽线距控制进一步延伸至多 层对位、图形转移、形变补偿及良率管控，高端设备配置需求同步 增长。公司 深度卡位高端 PCB制造环节 ， 为国内极少数 可满足服务器及数据中心标准的高 端LDI设备供应商，已实现该类设备国产化替代， MAS/NEX/RTR等系列覆盖 线路层、阻焊层及柔性板连续制造等核心曝光场景 ，同时布局 MUD及MCD系 列激光钻孔设备，产品矩阵完善 ，核心受益 高端PCB资本开支扩张 。 先进封装向大尺寸 RDL演进， WLP/PLP 打开第二增长曲线。 CoWoS -L、 2.5D/3D 及面板级封装加速发展， RDL中介层呈现大尺寸化、细线路化趋势， 传统掩膜曝光 存在多次拼接、基板翘曲及晶粒偏移带来的对位和良率约束。 公 司WLP及PLP系列设备可在单个工艺步骤完成大尺寸基板曝光 ，针对 RDL环 节的晶粒贴装偏移 逐颗测量晶粒实际位置并动态调整数字图形 ，显著改善互连 良率，目前已进入 华天科技、绍兴长电等头部客户供应链 。当前国内封测厂商 正加快2.5D/3D、晶圆级及面板级封装产能建设 ，随着新扩产线（类 Cowos -L 技术路线）设备陆续下单， 公司先进封装 业务有望进入规模放量阶段。 全球产能持续扩张，高端制程占比提升推动 ASP上行。公司合肥一期基地产 能利用率已接近满负荷，二期投产后 LDI产能有望实现显著提升 （ （极产产能可 提至 1500台以上） ；海外布局方面， 2024年公司完成泰国子公司设立，推动 东南亚收入占比提升至近 20%，同时积极拓展 日本、韩国、澳洲等 区域市场， 6月港股上市募集资金将用于 进一步扩大产能及拓展全球销售服务网络 。随着 PCB高端制程及先进封装设备占比 上行，ASP有望稳步 增长，叠加海外业务规 模扩张，毛利率有望持续 提升，量价齐升打开成长空间。 投资建议： AI PCB扩产提速带动上游 LDI需求增长，叠加先进封装业务放量在 即，我们上调盈利预测， 预计公司 2026-2028年归母净利润分别为 5.16/8.74/11.47 亿元， 同增 78%/69%/31% ， 对应 EPS分别为 3.52/5.96/7.83 元/股，当前股价对应 PE分别为 119/70/54 倍，维持“买入”评级。 风险提示： PCB及半导体资本开支不及预期、先进封装设备放量不及预期、市 场竞争加剧及海外拓展不及预期等 。 买入（维持） 股票信息 行业 专用设备 前次评级 买入 08月14日收盘价（元） 419.00 总市值（百万元） 61,385.64 总股本（百万股） 146.51 其中自由流通股（ %） 95.62 30日日均成交量（百万股） 6.52 股价走势 作者 分析师 何亚轩 执业证书编号： S0680518030004 邮箱： heyaxuan@gszq.com 分析师 李枫婷 执业证书编号： S0680524060001 邮箱： lifengting3@gszq.com 相关研究 1、 《芯碁微装（ 688630.SH ）：25Q1扣非归母净利润 增速亮眼， 预计 4月发货量再破历史新高》 2025-04-24 2、 《芯碁微装（ 688630.SH ） ：扣非归母净利润高速增 长，期待 PCB海外市场交付顺利》 2024-10-28 3、 《芯碁微装（ 688630.SH ）：Q2盈利能力保持优秀， PCB持续向好，泛半导体迎来破晓》 2024-08-21 财务指标 2024A 2025A 2026E 2027E 2028E 营业收入（百万元） 954 1,408 2,157 3,579 4,543 增长率 yoy（%） 15.1 47.6 53.2 65.9 26.9 归母净利润（百万元） 161 290 516 874 1,147 增长率 yoy（%） -10.4 80.4 77.9 69.4 31.3 EPS最新摊薄（元 /股） 1.10 1.98 3.52 5.96 7.83 净资产收益率（ %） 7.8 12.6 19.4 26.9 28.4 P/E（倍） 382.0 211.7 119.0 70.2 53.5 P/B（倍） 29.8 26.6 23.1 18.9 15.2 资料来源： Wind，国盛证券研究所 注：股价为 2026年08月14日收盘价 -30%38%106%174%242%310% 2025-08 2025-12 2026-04 2026-08芯碁微装 沪深3002026 08 17年 月 "title": "2026-08-17 08:43", "source_label": "帖子正文", "excerpt": "【天孚通信更新】CPO需求节点并未后移：Coherent预计CPO将在27Q2开始贡献收入，符合其此前的生产爬坡规划", "content": "【天孚通信更新】CPO需求节点并未后移：Coherent预计CPO将在27Q2开始贡献收入，符合其此前的生产爬坡规划；Lumentum表示领先的 CPO 客户进展顺利且需求增强；在CPO配套光引擎、高通道36芯FAU和ELS方面，公司已做了较为充分的场地、设备、人员准备，整体进展顺利；泰国工厂无源产品线正处于稳步扩产阶段；公司发布股权激励草案，高业绩考核目标彰显成长信心，相比25年，27-29年净利润增长比例不低于150/400/700%，对应50/101/161亿。#文字观点", "publish_time": "2026-08-17 08:43", "tags": ["文字观点"]}, "post:2026-08-17T08-56:90ad9366ad2a": {"id": "post:2026-08-17T08-56:90ad9366ad2a", "kind": "post", "title": "2026-08-17 08:56", "source_label": "帖子正文", "excerpt": "强烈推荐MPO板块@0816 ‼️8月初以来强推MPO板块", "content": "强烈推荐MPO板块@0816 ‼️8月初以来强推MPO板块；27年整体估值已经降至20X以内。 太阳太辰光中报：Q2收入6.6亿（环比+93%，超预期）；净利润1.1亿（环比+69%）。Q3收入/毛利率/净利润有望环比大幅增长。行业拐点进一步显现！ 1️⃣拳头【长芯博创】：‼️大幅增加与长飞的关联交易。 2️⃣拳头【仕佳光子】：‼️Q2业绩超预期核心在于MPO（H1收入7.6亿+155%）快速增长，毛利率大幅提升。 太阳太阳#核心推荐：1️⃣【长芯博创】-Q3业绩加速 2️⃣【蘅东光】-Q2-3业绩加速 3️⃣【仕佳光子】-Q2超预期 2️⃣【杰普特】-7月收入/净利超预期 3️⃣【太辰光】-Q3收入/净利润有望超预期#文字观点", "publish_time": "2026-08-17 08:56", "tags": ["核心推荐", "文字观点"]}, "post:2026-08-17T12-05:a827113bd180": {"id": "post:2026-08-17T12-05:a827113bd180", "kind": "post", "title": "2026-08-17 12:05", "source_label": "帖子正文", "excerpt": "再度更新光模块测试设备情况，都有积极的边际变化 华兴源创：7月新增多家国内外客户，光芯片设备国内在取得积极进展。", "content": "再度更新光模块测试设备情况，都有积极的边际变化 华兴源创：7月新增多家国内外客户，光芯片设备国内在取得积极进展。近期800G产品在头部客户验证接近尾声，积极展望后续订单落地。1.6T的THA芯片在9月面世，1.6T示波器已在头部客户验证，今年年底前有望完成全栈产品开发+验证。明年订单高增明确，且直接切入下游核心客户供应链，800G+1.6T有望双向发力。 联讯仪器：新接订单和在手订单都非常积极、充裕，H1业绩预告已发，超预期，全年在手订单稳步推进验收，业绩确定性强。除了光模块，产品版图涉足光芯片、存储测试设备、半导体测试，订单上限高，测试平台未来会多点开花。 日联科技：上海菲莱今明年订单持续上修（15亿），主业稳健，明后年业绩目标积极。此外，有PCB的CT测试及QES等半导体测试平台搭建，长期护城河高。 此外耦合关节重点推荐博众精工，全年业绩稳健，中南鸿思导入积极，今年有明确光模块业务收入。 具体细节欢迎交流！#文字观点", "publish_time": "2026-08-17 12:05", "tags": ["文字观点"]}, "attachment:files/中泰证券-联讯仪器(688808)深度报告：光通信&半导体双轮驱动，高端测试设备平台化启航-260815.pdf": {"id": "attachment:files/中泰证券-联讯仪器(688808)深度报告：光通信&半导体双轮驱动，高端测试设备平台化启航-260815.pdf", "kind": "attachment", "title": "中泰证券-联讯仪器(688808)深度报告：光通信&半导体双轮驱动，高端测试设备平台化启航-260815", "source_label": "中泰证券", "excerpt": "有关分析师的申明，见本报告最后部分。", "content": "有关分析师的申明，见本报告最后部分。其他重要信息披露见分析师申明之后部分，或请与您的投资代表联系。并请阅读本证券研究报告最后一页的免责申明。 方正证券 601901.SH 公司研究 | 首次报告 ⚫ 中国平安入主推动治理 趋稳，盈利能力进入修复通道。 2022年末，新方正集团完成 方正证券 28.71%股份受让，中国平安通过平安人寿及新方正集团间接控制公司，此 前长期存在的股权不确定性得到化解。 1Q26末，公司总资产 / 归母净资产分别达到 3,060.0/ 524.2 亿元，同比分别增长 21.4%/ 7.6% ；1Q26营业收入 / 归母净利润 分别 实现 34.0/ 14.9 亿元，同比分别增长 14.7%/ 24.3% 。收入增长、利润率提升及杠杆 率上行共同推动年化 ROE升至 11.3%。 ⚫ 零售客户基础构筑核心优势，经纪业务贡献过半营业收入。 2025年公司经纪业务净 收入达到 55.8亿元，同比增长 38.2%，占营业收入的 53.1%，为公司最主要的收入 来源。年末客户总数接近 1,700万户，客户资产突破 1万亿元，同比增长 32.6%； 代销金融产品规模达到 2,896.8亿元，同比增长 10.5%。较大的零售客户基础与持续 增长的客户资产，能够将市场成交活跃度较 快转化为收入。 ⚫ 投资业务增强盈利弹性，方正富邦基金拓展轻资本收入来源。 1Q26末，公司金融资 产规模达到 1,226.1亿元，同比增长 9.7%，其中 FVTPL资产占比升至 72.8%；融出 资金达到 578.6亿元，同比增长 34.5%，信用业务收入保持增长。投资、经纪及信 用业务合计贡献 1Q26营业收入的 90.0%。截至 2Q26，方正富邦基金公募基金总规 模达到 1,083.7亿元，较 2025年末增长 24.3%；权益类公募基金规模达到 206.7亿 元，为资产管理业务提供增量基础。 我们预计公司 2026至2028年分别实现归母净利润 49.5/ 51.5/ 53.0 亿元，同比分别增长 24.7%/ 4.1%/ 2.8% ，对应 EPS分别为 0.60/ 0.63/ 0.64 元。公司较大的零售客户基础支 撑经纪业务收入增长，金融资产扩张与投资收益率改善推动投资业务收入提升，融资融 券规模增长支撑信用业务收入。估值方面， 2017年至今公司 PB均值为 1.50倍，据此给 予公司 1.50倍2026E PB ，对应目标价 10.01元。首次覆盖，给予 “买入”评级。 风险提示 资本市场大幅波动；投资业务收益不及预期；资本市场融资活动恢复不及预期；行业监 管政策及合规风险。 2024A 2025A 2026E 2027E 2028E 营业收入（百万元） 7,718 10,504 12,542 13,187 13,705 同比 36.1% 19.4% 5.1% 3.9% 营业利润（百万元） 2,245 4,779 6,111 6,359 6,540 同比 112.8% 27.9% 4.1% 2.8% 归母净利润（百万元） 2,207 3,970 4,952 5,153 5,300 同比 79.9% 24.7% 4.1% 2.8% 每股收益（元） 0.27 0.48 0.60 0.63 0.64 总资产收益率 0.9% 1.5% 1.7% 1.6% 1.6% 净资产收益率 4.6% 8.0% 9.4% 9.0% 8.7% 市盈率（倍） 25.56 14.38 11.47 11.02 10.72 市净率（倍） 1.18 1.12 1.03 0.96 0.90 净利率 28.6% 37.8% 39.5% 39.1% 38.7% 数据来源：公司数据，东方证券研究预测；注： 2024A使用重述的可比口径 盈利预测与投资建议 核心观点 公司主要 财务信息 股价（ 2026年08月14日） 6.9元 目标价格 10.01元 52周最高价 /最低价 8.9/6.37 元 总股本 /流通 A股（万股） 823,210/823,210 A股市值（百万元） 56,801 国家/地区 中国 行业 非银行金融 报告发布日期 2026年08月17日 1周 1月 3月 12月 绝对表现 % -1.99 -3.36 -2.95 -16.45 相对表现 % -1.38 -0.64 2.11 -28.25 沪深 300% -0.61 -2.72 -5.06 11.8 张凯烽 执业证书编号： S0860526020002 香港证监会牌照： BYB679 zhangkaifeng@orientsec.com.cn 021-63326320 何佳航 执业 2011年在上交所上市。 2014至2015年，公司发行股份收购中国民族证券 100%股权，业务版图延伸至投资银行及机构 服务； 2019年，中国民族证券更名为方正证券承销保荐，投行业务 转由专业子公司经营。 2022 年末，原方正集团及方正产业控股所持公司 28.71%股份划转至新方正集团，中国平安由此间接控 制公司，公司进入治理稳定和业务恢复阶段。 表1：并购整合与股权重整推动方正证券成长为综合性证券公司 时间 主要发展节点 1988年 经中国人民银行批准，浙江省证券公司成立，注册地位于浙江省杭州市 2002至2003年 北大方正集团受让浙江证券有限责任公司 51%股权，公司更名为方正证券有限责任公司 2008年 吸收合并泰阳证券有限责任公司，并将注册地迁至湖南省长沙市，进一步扩大分支机构与客户覆盖范围 2010至2011年 整体变更为方正证券股份有限公司；首次公开发行 15.00亿股并在上交所上市，募集资金净额 56.48亿元 2014至2015年 向政泉控股等股东发行 21.32亿股，收购中国民族证券 100%股权，公司总股本增至 82.32亿股 2019年 中国民族证券业务范围调整为证券承销与保荐，并更名为方正证券承销保荐有限责任公司 2020至2021年 方正集团进入破产重整，新方正集团设立；平安人寿全资持股平台持有新方正集团 66.507% 股权 2022年 方正集团及方正产业控股持有的 23.63亿股全部划转至新方正集团，新方正集团成为控股股东，中国平安间接控制公司 2025年 客户资产突破 1万亿元，零售财富管理客户基础进一步扩大；公司完成治理架构调整 数据来源： 方正证券公司公告，中国证监会， 东方证券研究；注：仅列示公司主要发展节点 中国平安间接控制公司，股权与治理结构趋于稳定。 截至 2026年1季度末，新方正集团持有公 司28.71%的股份，为公司控股股东；全国社会保障基金理事会、中国信达分别持股 13.24%/ 7.20%，位列第二、第三大股东。平安人寿通过新方正（北京）持有新方正集团 66.51%的股份， 中国平安由此间接控制方正证券；因中国平安自身不存在控股股东和实际控制人，方正证券亦无 实际控制人。股权重整完成后，公司经营重心重新聚焦证券主业，董事会及经营管理体系逐步稳 定。平安集团在客户、产品、科技及风险管理方面的资源积累，为公司财富管理和综合金融服务 提供协同基础。 仅供内部参考，请勿外传 方正证券首次报告 —— 零售客户基础夯实经营韧性，治理趋稳推动业绩修复 有关分析师的申明，见本报告最后部分。其他重要信息披露见分析师申明之后部分，或请与您的投资代表联系。并请阅读本证券研究报告最后一页的免责申明。 5 表2：新方正集团为 方正证券的 控股股东，中国平安间接控制公司 排名 股东名称 持股数量（亿股） 持股比例 股东性质 1 新方正控股发展有限责任公司 23.63 28.71% 境内非国有法人 2 全国社会保障基金理事会 10.90 13.24% 国有法人 3 中国信达资产管理股份有限公司 5.93 7.20% 国有法人 4 哈尔滨哈投投资股份有限公司 1.98 2.40% 国有法人 5 香港中央结算有限公司 1.49 1.82% 境外法人 6 中央汇金资产管理有限责任公司 1.36 1.65% 国有法人 7 国泰中证全指证券公司交易型开放式指数证券投资基金 1.21 1.47% 基金、理财产品等 8 全国社保基金一一八组合 0.91 1.11% 基金、理财产品等 9 乐山国有资产投资运营（集团）有限公司 0.84 1.02% 国有法人 10 华宝中证全指证券公司交易型开放式指数证券投资基金 0.82 0.99% 基金、理财产品等 数据来源： iFinD，东方证券研究；注：数据截至 2026年3月31日 收入利润增长提速， ROE与杠杆率同步回升 经营规模稳步扩大， 2024年以来收入与利润保持增长。 2018至2025年，公司营业收入由 57.2 亿元增至 105.0亿元，年均复合增速为 9.1%；归母净利润由 6.6亿元增至 39.7亿元，年均复合增 速达到 29.2%。2025年，公司营业收入 / 归母净利润分别同比增长 36.1%/ 79.9% ，经纪、投资及 信用业务共同贡献收入增量。 1Q26，公司营业收入 / 归母净利润分别达到 34.0/ 14.9 亿元，同比 增长 14.7%/ 24.3% ，利润增速继续高于收入增速。 图1：2024年以来方正证券营业收入保持增长 图2：2024年以来方正证券归母净利润保持增长 数据来源： iFinD，东方证券研究 数据来源： iFinD，东方证券研究 15.2% 14.4% 14.3% -9.8%-8.5%8.4%36.1% 14.7% 的逻辑：北美电力需求大增、电网老化，数据中心转向自建电源，燃气轮机、燃气内燃机供不应求（来源：11:16中泰汽车何俊艺团队帖子）。\u003c/li>\n\u003cli>今天出现的催化/验证：卡特彼勒Power Generation零售销售+72%（Q1为+48%），气发订单排至28-29年；Innio Q2订单同比+316%，数据中心占比64%（来源：15:10帖子；液冷/电源主线“核心逻辑”）。\u003c/li>\n\u003cli>对应证据来源：液冷/电源主线“帖子证据”“核心逻辑”，附件《往复式内燃机-有望成为AIDC主供电源主力20260816》《AIDC燃气轮机-燃气内燃机行业更新20260816》。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线4：PCB/CCL技术路线迭代，RCC被视为国产“黑科技”爆发前夜\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：RCC（涂树脂铜箔）类似MSAP工艺从高端消费电子迁移而来，正值爆发前夜；去掉电子布使成本降低至少30%（来源：14:18RCC帖子）。\u003c/li>\n\u003cli>今天出现的催化/验证：海外博可PCB/CCL压机交期1.5-2年、售后跟不上，国产厂商持续拿单（来源：14:18帖子；12:03国金机械合锻智能点评帖子）。\u003c/li>\n\u003cli>对应证据来源：PCB/CCL/铜箔主线“当前主线概括”“核心逻辑”。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线5：国产机器人订单加速+上市催化共振\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：T链订单如期加速，EDI系统下订单确定性提升；宇树上市给国内本体厂明确估值锚（来源：09:22帖子；机器人主线“核心逻辑”）。\u003c/li>\n\u003cli>今天出现的催化/验证：宇树科技8月19日科创板上市，已发布“超人”机器人，运动能力提升显著（来源：【电报解读】附件文件名；21:00浙商机械帖子）。\u003c/li>\n\u003cli>对应证据来源：机器人/自动化主线“帖子证据”，附见东吴证券周报文件名。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>英伟达修改对俄亥俄州OpenAI数据中心支持计划：最初担保金额预计低于1200亿美元，低于此前讨论的2500亿美元（来源：08:31路透社引述《华尔街日报》帖子）。\u003c/li>\n\u003cli>Anthropic第二季度营收超115亿美元，同比增长1361%，调整后营业利润由负转正（来源：08:39“20260816复盘”帖子）。\u003c/li>\n\u003cli>盛科通信公告：与深圳中电港签订以太网交换芯片销售合同，合同金额超最近一个会计年度经审计营收的50%且超1亿元（来源：08:49帖子；附件《业绩为矛，估值为盾》/《五线四板块“金品汇”》提到“今天下午盛科通信公告接单”）。\u003c/li>\n\u003cli>澜起科技宣布率先在业界试产CXL 3.2 MXC，最高支持64GT/s及DDR5-8000，已导入三星、SK海力士下一代产品（来源：14:27浙商计算机帖子）。\u003c/li>\n\u003cli>上周股票ETF合计净流出525.44亿元，8月以来净流出1285.67亿元；半导体设备ETF国泰、易方达上周分别净流入16.85亿元、13.59亿元（来源：15:46“8月17日复盘笔记”帖子）。\u003c/li>\n\u003cli>沪指涨1.41%，上探年线、逼近4000点（来源：15:46复盘帖子；半导体主线“大盘表现”）。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>英伟达对OpenAI数据中心担保方案的后续细节、循环融资与项目执行风险，以及OpenAI履约能力（来源：AI算力主线“核心逻辑”，MS观点）。\u003c/li>\n\u003cli>磷化铟Q4涨价落地幅度与产业链传导，关注全新、联亚、IET等台厂及国内InP布局企业（来源：08:31帖子）。\u003c/li>\n\u003cli>国产核心电源厂商800V平台新进展，以及SiC、GaN在800V及柜内平台的导入节奏（
