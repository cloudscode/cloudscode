": {"id": "post:2026-10-30T10-46:495cecd4fbb3", "kind": "post", "title": "2026-10-30 10:46", "source_label": "帖子正文", "excerpt": "【盛科通信】高速产品稳定交付，毛利率回升公司2026年前三季度实现营收11.38亿元（+36.79%）", "content": "", "publish_time": "2026-10-30 10:46", "tags": ["文字观点"]}, "post:2026-10-30T15-47:c15c2a785c07": {"id": "post:2026-10-30T15-47:c15c2a785c07", "kind": "post", "title": "2026-10-30 15:47", "source_label": "帖子正文", "excerpt": "华工科技：Q3营收同比+42%，XPO领衔AI光互联全栈新品 Q3营收同比+42%，归母净利润同比+17% ✔2026年前三季度，公司营收126.54亿元，同比+14.64%", "content": "", "publish_time": "2026-10-30 15:47", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-30T09-17:287bf84887c7": {"id": "post:2026-10-30T09-17:287bf84887c7", "kind": "post", "title": "2026-10-30 09:17", "source_label": "帖子正文", "excerpt": "🔥Amazon 2026Q3业绩梳理：AWS增长持续加速，订单储备强劲【东吴传媒互联网&海外 张良卫团队】 💡整体业绩：集团经营盈利能力持续改善。2026Q3实现收入2019.44亿美元，YoY+12%，基本符合Bloomberg一致预期", "content": "🔥Amazon 2026Q3业绩梳理：AWS增长持续加速，订单储备强劲【东吴传媒互联网&海外 张良卫团队】 💡整体业绩：集团经营盈利能力持续改善。2026Q3实现收入2019.44亿美元，YoY+12%，基本符合Bloomberg一致预期；GAAP营业利润280.76亿美元，YoY+61%，高于Bloomberg一致预期，营业利润率13.9%，YoY+4.2pct，创历史新高；GAAP净利润206.85亿美元，YoY-2.4%，主要受上年同期Anthropic投资确认约95亿美元税前收益的高基数影响。 💡AWS：收入增长持续加速，订单储备强劲，盈利能力同比提升。Q3 AWS收入459.84亿美元，YoY+39.3%，较Q2的36.7%进一步加速；营业利润177.73亿美元，YoY+55%，高于Bloomberg一致预期，营业利润率38.7%，YoY+4.0pct。AWS Backlog达5780亿美元，QoQ+16.5%，同比实现三位数增长。传统计算及存储业务增速达到数年来较高水平，反映AI及非AI云需求同步扩张。管理层预计2027、2028年AWS收入增速均超过40%。 💡AI算力：需求持续超过供给，新增产能快速消化。管理层表示，AWS目前平均约每14秒部署一颗AI加速器，新增算力快速被客户消化，需求仍超过可用供给。算力收入释放仍受数据中心、电力及服务器交付进度约束。管理层同时指出，AI业务利润率改善速度快于传统云基础设施业务相同发展阶段，随着新增产能交付及利用率提升，经营杠杆有望进一步释放。 💡AI平台及自研芯片：多模型与Agent需求扩散，Trainium与Graviton商业化加速。Q3 Bedrock Token处理量同比增至近17倍，Fortune 500企业在Bedrock上的支出同比大幅增长；AgentCore客户在Q3部署的Agent数量约为此前三个季度合计的两倍。自研芯片方面，Trainium与Graviton相关收入承诺合计同比增长超20倍，Q3客户使用Amazon自研芯片节省成本超20亿美元。Trainium受益于AI训练及推理需求增长，管理层计划于2027年末推动其在AWS以外的环境中使用；Graviton CPU需求增长部分受Agent工作负载推动。 💡CapEx与FCF：算力投入维持高位，短期现金流承压。Q3 CapEx达772.59亿美元，YoY+120%、QoQ+43%，单季度FCF约-334.56亿美元，过去12个月FCF为-423.57亿美元。公司维持2026年CapEx约2200亿美元预期。 💡指引：Q4收入及营业利润预计继续增长。 公司预计2026Q4收入2400-2470亿美元，YoY+12%-16%；GAAP营业利润285-335亿美元。广告收入预计恢复至高十位数同比增长，Q3增速阶段性放缓主要受Prime Day时间调整及其他时间性因素影响。 ⚠️风险提示：AI需求及算力交付不及预期、资本开支回报不及预期、云业务竞争加剧、算力利用率及盈利能力改善不及预期。#文字观点", "publish_time": "2026-10-30 09:17", "tags": ["文字观点"]}, "post:2026-10-30T08-14:e6b14c8ddd70": {"id": "post:2026-10-30T08-14:e6b14c8ddd70", "kind": "post", "title": "2026-10-30 08:14", "source_label": "帖子正文", "excerpt": "【通向AGI】 大模型及落地场景信息速递20261029 OpenAI × Uber：ChatGPT Work 向全球3万名员工全面铺开（10/22），此前仅1000人试点。• OpenAI 连续深化企业侧：10/27 把 Oracle 业务应用与Agent接进ChatGPT", "content": "【通向AGI】 大模型及落地场景信息速递20261029 OpenAI × Uber：ChatGPT Work 向全球3万名员工全面铺开（10/22），此前仅1000人试点。 • OpenAI 连续深化企业侧：10/27 把 Oracle 业务应用与Agent接进ChatGPT；10/28 与 ServiceNow 深化企业工作流合作。 • 腾讯全球数字生态大会（10/29）：发布一体化套件 Buddy One（WorkBuddy为工作台，整合腾讯文档/ima/腾讯设计，统一账号+积分池+数据池）；混元 Hy4 及 Hy4 Flash 即将推出，Hy4首次引入原生视觉理解。WorkBuddy已覆盖50%中国企业500强，累计完成90亿次任务请求。汤道生的判断值得记：“Agent落地最大问题不是模型不够强，而是断点太多”。 • IBM：近6000个Agent覆盖150+咨询工作流（10/19） #政策：广电总局规划把“AI剧”首次作为独立品类写入国家级规划，2030年累计推500部优秀微短剧字节豆包工作开放三方模型（Kimi 3.1 Pro、GLM 5.3、DeepSeek V4.1 Flash 腾讯数字生态大会：Hy4 即将发布（首次引入视觉理解），Buddy One 与腾讯网盘发布 • 世界模型：Google DeepMind 发布 Genie 4——文本生成可实时交互的世界，原生生成音频、角色可对话；先研究预览，后续向AI Ultra用户和Gemini API开放。这可能是游戏/互动影视的下一代底座#文字观点", "publish_time": "2026-10-30 08:14", "tags": ["文字观点"]}, "post:2026-10-30T13-51:cf0a7e45baa7": {"id": "post:2026-10-30T13-51:cf0a7e45baa7", "kind": "post", "title": "2026-10-30 13:51", "source_label": "帖子正文", "excerpt": "领益智造：Q3业绩超预期，AI终端/端侧AI稳健向好，具身智能/服务器液冷&电源放量 【开源电子】 📈业绩概览：①26年前三季度：公司营收406.71亿元，yoy+8.20%；归母净利润19.17亿元，yoy-1.27%", "content": "领益智造：Q3业绩超预期，AI终端/端侧AI稳健向好，具身智能/服务器液冷&电源放量 【开源电子】 📈业绩概览：①26年前三季度：公司营收406.71亿元，yoy+8.20%；归母净利润19.17亿元，yoy-1.27%；扣非14.47亿元，yoy-3.77%。②单Q3：公司营收155.22亿元，yoy+11.15%；归母11.53亿元，yoy+14.00%；扣非10.58亿元，yoy+17.88%。③得益于A客户业务结构性增长、单机ASP提升，#公司Q3单季度收入、利润创历史新高，归母净利润略超市场预期。公司前三季度利润受到汇率 (包含汇兑损失3.5亿、收入端美元贬值导致利润同比减少17.6亿)、股权激励费用显著影响 (2.8亿)，#还原前述因素后前三季度经营性利润可达39.54亿元 (yoy+95.37%)。 AI终端/端侧AI：①A客户：18系列高端机型备货量同比明显增长，折叠机型iPhone Duo实际备货较此前预期增加约30%至约1400万台。公司为i 卡位为\"电力+算力\"双侧覆盖，走的是场景付费驱动的正向循环路线：2012年即研发第一 代变电站巡检机器人进入国网真实场景，积累十八年产品准入资质、设备机理认知与故障处置实操经 验。与\"融资—造本体—找场景—自费采数据\"的资本驱动路线不同，公司由客户付费部署、同步积累数 据与经验、模型迭代反哺，形成闭环。 4.技术底座分感知、决策、执行、反馈四层：感知层融合可见光、红外热成像、声纹、3D点云等五类 模态，通过交叉验证解决单模态误报率高的问题，并将老师傅经验编码为可追溯的数字量；决策层依托 电力垂类大模型与运维知识图谱，通用大模型\"能描述现象但判断不了后果\"；执行层覆盖人形、四足、 轮式、挂轨、无人机、水下Rov等全形态本体，从巡检延伸至复测、开关操作、带电作业、应急抢 修；反馈层通过现场数据回灌实现模型在线迭代。 5.\"一体两翼\"战略：以巨深智能机器人为核心载体，左翼电力智能运维、右翼算力中心智能运维：电 力端为算力中心提供稳定供电保障，算力端反向为电力能源智能化升级提供AI算力支撑，双向赋能。 当前多数玩家或仅聚焦电力运维、或仅聚焦算力赛道，能同时打通电网侧到数据中心全链路的能力稀 缺。 6.算力中心是物理AI落地首站，逻辑在于结构化封闭空间、任务高度标准化、刚需明确：机房边界清 晰、动线固定、无风沙等干扰，导航定位与工程实现难度大幅降低；表计读数、指示灯状态、温湿度采 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 集等高频重复作业样本获取成本低、模型迭代周期短；7×24小时不间断运行需求下人工巡检易疲劳漏 检，电池室、高压室等高危环境替代需求刚性。 7.算力中心智能运维经济性测算清晰，投资回收具备吸引力：五年总投入约230余万元，其中4台核 心机器人系统单台约30余万元共约140万，门禁改造覆盖20余间机房共48万，五年运维维保按单 台每年2.5万计共50万；对比传统人工模式需约16名运维人员、按行业年均20万元人力成本测算五 年累计高达800万元，节约显著。 8.订单兑现路径清晰，算力订单向机器人订单转化有三条协同路径：5月与中航信签订不少于1亿元框 架协议，6月获十亿级算力中心设备/服务订单，7月、10月持续推进。转化路径包括渠道协同（运维 服务条款打包机器人能力）、数据协同（机房巡检数据回灌训练垂类模型）、收入结构协同（按月计量 的经常性现金流改善毛利与收入质量）。 9.三季报为多年经营明确拐点，单季度扭亏为盈：三季度单季收入1.98亿元、同比增长180%；前三 季度累计收入3.32亿元，已超越去年全年3.12亿元；前三季度经营性现金流8581万元、同比增长 200%以上。改善来自三方面：加大市场开拓、研发费用持续投入同时降本增效、加强回款催收。 （ ） 10.在手订单超18亿元，结构以机器人为主：截至10月15日在手订单超18亿元，其中机器人7亿 多元（由电力与算力中心两大主业构成）、智能监测检测约7亿元（含非电力相关）、算力服务6.7亿 元；此外不含按定额法计算的8.4亿元运维订单（按八年逐年确认收入，每年贡献4200万至8400万 元）。 11.海外与客户拓展处于中试阶段，验证效果良好：已获两大互联网/投资企业数千万机器人订单；三 大运营商侧已交付电信某公司算力中心项目，另有某运营商3.36亿元算力服务订单及互联网公司3.3 亿元五年期订单；正往北美投资/运营厂商送样测试，并与APP等搭建海外销售渠道，未来若涉及原产 国限制考虑在东南亚设厂。（ ） 问答整理 Q1：数据壁垒难以量化，电力侧约18年巡检数据迁移到算力场景，大概多少比例可直接复 用、多少需重新搭建？最核心的难点在哪里？ 答：需纠正一个误区——数据壁垒不只是\"采集图片样本有多少张\"，要拆成四个维度看。第一层机器人 本体与定位导航，变电站与机房同为室内结构化场景，7×24小时自主巡航避障回充的SLAM、运动控 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008vx:WUXL3408 vx:WUXL3408 制、多传感器融合是现成的，可复用约七到八成。第二层感知与训练框架，采集标注、训练部署、数据 闭环回灌的范式相通（红外测温、仪表识别），可复用约四成，但服务器网卡、硬盘故障等需重新训 练。第三层缺陷样本，电力缺陷（位移识别、表计识别）与机房服务器告警大概率不重叠，仅能迁移约 一成；机房故障多为慢变量、特征细微，仿真难以构造，只能在真实机房长期采集。第四层客户系统对 接几乎从零做，动环平台、DMS等因客户而异，属项目制定制。加权测算整体约四到五成可复用， 50%以上需重新开发。最耗时的不是模型训练，而是驻场数据采集与客户系统接入，原因有三：一是 BCIM类系统无统一标准、私有协议多、权限收紧，需安全测评与接口打通，周期长；二是数据采集存 在\"先有鸡还是先有蛋\"的死循环——要好的故障样本需长期驻场，客户愿让你驻场需先证明稳定不出 事，因此需签长期运维总包、用服务换数据采集权；三是客户决策周期长，金融类客户平均十多个月才 下单，从送样到回款周期较长。 Q2：机器人本体是核心卡点，新进入者切入算力中心赛道最核心的卡点是什么？公司领先行 业多少时间维度？ 答：先泼冷水——底盘、激光雷达、开源模型等已相对成熟并商品化，不是壁垒，若还拼\"机器人能不 能走\"方向就错了。真正卡住新玩家的是四道坎：第一道客户准入与性能认证，机房是客户核心资产、 停机损失巨大，需通过资质认证、信创适配，还要客户敢把核心冷通道交给你，这靠时间和零事故记录 堆出来，光有技术参数拿不到。第二道动环系统检测集成，机器人不只是拍照设备，而是整个运维体系 的终端，需对接BMS告警分级、压降误报率、打通工单闭环，需要既懂机器人又懂机房运维的复合型 团队，此类人才稀缺。第三道缺陷数据闭环，即前述死循环，没有驻场权限就没有样本、没有样本模型 就不稳定，需长期驻场积累，砸钱短期买不到。第四道全国7×24小时服务网络，算力中心多建在内蒙 古、宁夏、贵州等偏远地区，机器人半夜卡在冷通道或抛锚需短时间到场响应，初创公司难以搭建。总 结即\"进得去、待得住、接得上、修得了\"。领先时间上，凭借电力行业积累与赛道快速切入，估计具备 约两年领先优势。（ ） Q3：日本部分证券公司及腾讯等算力中心自研产品的最新进度如何？与公司产品最大差异体 现在哪里？ 答：公司研发投入很大，已深入对接多家大客户（具体不便透露），这些算力中心/数据机房持有方体 量非常大，对机器人巡检业务逻辑要求很高——不是像电力场景跑一遍、识别曲线、上传故障数据就完 了。他们需要人机协同：服务器维修时机器人需跟随人员作为监控设备，监督是否违规、是否符合标准 流程，还要帮忙携带工具；机房金属柜体环境下激光雷达点云漂移和噪点很多，金属标签反射强导致数 据不稳定，对算法能力要求极高，公司经过大量磨合已具备较好突破。另一关键要求是长时间可靠性： 客户要求机器人五年生命周期，而机械式激光雷达普遍寿命仅1至2年，对MTBF（无故障持续运行时 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008vx:WUXL3408 间）指标要求非常高。公司具备完整标准质量体系管控，在产品质量与长时间稳定性上投入很大，这是 小企业不具备的优势。 Q4：模型层开源速度加快，公司产品迭代演进方向是什么？研发资源如何分配？ 答：通用大模型开源便于研发人员下载学习，但解决不了垂直工业场景落地问题——它不懂机房运维规 范、告警等级等产品相关知识。公司策略明确：不自研通用底座，不与英伟达等拼通用能力，而是把开 源基座当工具，将资源集中到开源给不了的地方。具体四点：一是不做基础预训练，把省下的算力加码 到垂直场景小模型训练与数据积累，如机房指示灯组合状态识别（红灯绿灯结构对应什么状态）、漏液 预警、动环系统故障等差异化投入，这也是客户真正愿意付费的部分；二是把数据采集与标注作为核心 资产投资，开源模型谁都能下载，但某型号服务器高负载下黄针变化特征等数据是买不到的资产；三是 死磕系统集成与可靠性，机房场景价值高，一次碰撞或起火事故损失巨大，需大幅提升系统可靠性实现 告警闭环；四是边缘化部署优化，做最脏最累但最能绑定客户的事情，这些开源模型覆盖不到。 原文 申昊科技261029_原文2026年10月30日01:18发言人00:00好的，各位投资人大家下午好，我是 华西证券分析师晶晶。 发言人00:06今天很高兴我们是请到了深浩科技研究院的周院长和董秘花总来和大家一起分享一下物 理AI智能顺电协同的智能运维。 发言人00:18从近期的整个物理AI的市场的热度来讲，包括讨论度来讲，其实都是非常高的。 发言人00:24板块的股价也有个非常的表现。 发言人00:27但实际上从我们自己研究的角度，更加关注的是它从一概念走向订单的这条线路。 发言人00:34如果按照英维达的这个定义来讲，物理AI实际上是端到端的感知推理和真实世界的这种 交互。 发言人00:42下半年的话我们可以看到，其实技术站是开放的 分子材料多一个支链或少一个支链即变化 无穷，人工试错实验量无限；AI可通过虚拟筛选先算出值得做的候选（如从百万分子中筛出100个再 跑实验），将科研从\"靠天吃饭的打猎模式\"转为\"播种即收获\"的确定性发明模式。乐观数据为至少减少 30%重复实验、研发周期缩短2-3年（原周期约5-7年）。 6.客户以正负极、电解质企业最成熟，大厂倾向自建实验室：宁德时代、比亚迪等研发预算充裕的头 部企业率先尝试，且普遍自建大型实验室以保障数据保密性；部分客户也会将部分工作外包。付费体量 上，轻量级云端部署约小几十万元，私有化部署约几百万元，实验室总包大项目可达千万级。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 7.竞争格局呈交叉渗透态势，玩家路线分化：晶泰科技从医药起家渗透材料，采用重资产的大型自动 化工作站路线；深势科技与设备厂商合作、通过Agent代码控制设备，走轻资产路线；深度原理聚焦 材料化学方向亦尝试医药；此外还有去矿城、奔月、西芒、每甲等年轻创业公司布局，除晶泰外基本均 未上市。垂类模型与软件服务是各家共同在做的基础布局。 8.大语言模型短期难以替代专业模型，数据与训练是核心壁垒：OpenAI等头部玩家虽布局AIfor Science且成本优势明显，但大语言模型与专业模型原理不同，实际模拟计算仍需依赖专用模型；公司 也会在部分产品上与大语言模型合作。壁垒主要来自材料领域特殊数据、训练方法与模型参数，材料领 域模型参数量级与生物制药相近（数千亿级即可，无需上万亿）。 问答整理 Q1：您所在公司是否自研大模型？随着基座模型能力增强（如GPT、国产模型），客户会不 会直接使用基座模型公司的产品，而不再用专业模型公司的产品？ 答：OpenAI等头部玩家也在布局AIforScience并研发自己的专业模型，其研发投入与成本优势确实 令人担心。但大语言模型直接替代专业模型的概率目前仍较低，两者原理不同；公司也会在部分产品上 与大语言模型合作，但真正做模拟计算仍需依赖自有的专用模型。 Q2：专用模型的壁垒是数据吗？ 答：数据肯定是很大的壁垒，此外训练方法和模型参数也都有影响。 Q3：材料领域模型参数的数量级大概怎样？ 答：与生物制药领域差不多，数千亿参数级别即可，用不到上万亿。 Q4：展望半年到一年，AI做实验会不会更成熟？ 答：这是必然趋势，公司内部已有许多实验交给AI在做，也会使用OpenAI等大模型辅助实验。操作 方式取决于设备是否有接口授权，同时部分环节（如引擎盖类操作）需要机械臂或人手完成，两种方式 都会存在。 Q5：AIforScience在生物医药带动了\"卖铲子\"环节（如小白鼠）需求，材料领域实验次数 增加会带动什么环节？ 答：作为乙方公司对甲方采购细节不太清楚，但据判断，后台（算力/数据）一定增多，设备也肯定会 增多。（ ） wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008vx:WUXL3408 Q6：交付给客户时是只交付垂类模型和Agent，还是也包括算力服务？ 答：视客户需求而定。客户自有算力则无需交付，如需购买可一并交付。运行AIforScience模型对算 力要求其实不高，一般自有机房的客户都能满足。 Q7：目前哪些类型的企业会用到AIforMaterials？ 答：最成熟的是正负极和电解质企业。胶水、涂层等其他材料理论上也是潜在客户，但行业仍处早期， 复杂场景尚无法攻破，目前多在小项目上尝试，还没有很好的整包服务。 Q8：未来半年到一年行业会迅猛发展还是维持现状？ 答：卡点仍在自动化实验室。友商中晶泰的自动化做得最成熟，但在复杂材料或复杂场景下大家进度都 较慢。未来半年到一年的进展，取决于自动化实验室能有多少突破。AI计算很快，但实验时间相对固 定且长，难以跟上AI速度；无法完全自动化还会影响数据收集，拖慢数据飞轮。 Q9：自动化实验室拆细看，卡点是实验室数量还是AI操作仪器的能力？ 答：核心还是实验设计问题。例如溶液做好后需暴露在氮气中，实验怎么送进去、AI怎么操作，对设 计实验的人本身就有难度；复杂场景用AI替代人工更难。这有点像具身智能——AI不太能与真实世界 交互、不理解真实仪器是什么，需要采集大量数据来理解世界，交互多了数据飞轮才能转起来。 Q10：基因合成、蛋白表达等服务的价格有增加或减少吗？ 答：市面上服务商价格整体在降低，合成领域有很多高通量及AI实验室。以深势科技而言，不做基因 合成，主要做多肽、环肽方面服务，所接服务价格有所降低，蛋白方向价格预计也会降低。 Q11：公司现在的商业模式具体是怎样的？ 答：各家AIforMaterials公司模式不同。以深势科技为例，拥有模型层、软件层、智能体层：客户可 购买软件平台自己做研究，也可购买智能体（属软件服务）；也可委托搭建自动化实验室，设备可由厂 家自供或由公司总包采购；还会出售配套算力。交付方式分私有化部署、混合云部署、云端部署，价格 不同。（ ） Q12：只算模型和Agent的价值量大概多大？ 答：根据客户使用量预估、部署模式及定制化要求沟通确定。轻量级云端部署约小几十万元，私有化部 署约几百万元区间。 Q13：客户花几百万元做私有化部署，能撬动多少成本节省？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008vx:WUXL3408 答：目前业内普遍不愿做效率提升的硬性保障。实验室能拿出较好的宣传数据，但实际交付效果取决于 客户是否有相应人才使用、使用效果如何，据了解所有公司都回避给出明确答复；宣传层面可能提 50%-60%的效果，实际交付不做此类保证。 Q14：AIforScience在生物医药帮助寻找靶点，在材料领域真正带来的改变是什么？ 答：比较类似。高分子材料少一个支链、多一个支链变化无穷，即便有高通量实验室，人工试错的实验 量也是无限的；AI可通过虚拟筛选算出哪些值得做，大幅提升效率——例如告诉客户这十个值得做， 再通过实验验证哪个可行。 Q15：这是否意味着人类发现新材料的速度或种类会大幅提升？ 答：是的，业界宣传AI改变的是科研发现范式。以前像古人打猎靠天吃饭，做实验碰巧遇到好分子； 以后进入\"发明\"阶段——百万个分子先跑计算筛出100个，再跑实验筛出好的，具有确定性，像播下 种子就一定会长出来。 Q16：以前出现一个新材料的周期和成本，AI能缩短多少？ 答：生物药领域常提\"三个十\"（十年、10亿美元）。材料领域没有统一标准，较乐观的数据是可至少 减少30%的重复实验，研发周期缩短2-3年；此前材料研发周期约5-7年。 Q17：客户会自建实验室，还是由服务公司建好实验室、客户只关注成果？ 答：材料领域客户非常注重数据保密性，仍以自建实验室为主；也有客户像医药外包一样把部分工作交 给公司用自有实验室跑。随着行业发展，研发服务外包模式有望像医药行业一样被更多认可。 （ ） Q18：宁德时代、比亚迪这类客户开始用AIforMaterials，是因为有钱，还是电池领域本身 最易受益？ 答：两点都有。有远见、有眼光的领导能意识到AI是未来趋势，而最先有能力尝试的必然是最有钱、 研发预算最充裕的客户；初期尝试效果可能没那么好，但目前已能看到较明显的进展。 Q19：大企业未来会不会自建模型、不再依靠第三方服务商？ 答：有可能，取决于客户自身的商业化布局。 Q20：一个大客户一年大概付费几百万元？ 答：看项目具体类型。实验室总包类项目，大客户可能不止几百万元，可达千万级。整体市场空间很 大，但商业化仍处刚起步阶段。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008vx:WUXL3408 Q21：创业公司的竞争对手多吗？是否存在垂直划分（如做医药的、做材料的）？ 答：会有划分但存在交叉渗透。晶泰科技从医药起家，目前也渗透到材料方向，因为底层原理和算法共 通；深度原理聚焦材料化学方向，也会做医药方向尝试。路线方面，晶泰的自动化实验室是大型自动化 工作站，偏重资产；深势科技与设备厂商合作、对接接口，通过自有Agent代码控制设备，偏轻资 产，客户可根据预算和实际需求选择不同玩家。 Q22：AIforMaterials在材料领域还有其他竞争对手吗？ 答：比较多。除晶泰、深势等头部外，还有去矿城、奔月、西芒、每甲等公司均有方向布局，多为近两 年成立的年轻创业公司，除晶泰外基本尚未上市。 Q23：现在大家普遍都自己做垂类模型吗？ 答：垂类模型和软件服务是大家都在做的，其他方向各家有不同布局选择；通常每家提供垂类模型，同 时提供Agent，并根据客户需求参与实验室建设。 原文 解密AI4S系列20261028_原文2026年10月30日01:14发言人00:02大家好，欢迎参加西部计算 机解密AICS系列9。目前所有参会者均处于静音状态，下面开始播报声明，本次电话会议服务于西部 证券研 blish_time": "2026-10-30 18:46", "tags": ["市场段子", "文字观点"]}, "post:2026-10-30T21-13:84d70cb7aa43": {"id": "post:2026-10-30T21-13:84d70cb7aa43", "kind": "post", "title": "2026-10-30 21:13", "source_label": "帖子正文", "excerpt": "【华海清科】Q3归母同比+53.5%，平台型布局持续拓展！事件：公司发布26年三季报，Q3业绩： 【营收】15.39 亿元，yoy+23.7%，qoq+6.8%", "content": "【华海清科】Q3归母同比+53.5%，平台型布局持续拓展！ 事件：公司发布26年三季报，Q3业绩： 【营收】15.39 亿元，yoy+23.7%，qoq+6.8%； 【归母】4.39 亿元，yoy+53.5%，qoq+38.9%； 【扣非】3.69 亿元，yoy+40.5%，qoq+26.8%； 【毛利率】40.6%，yoy-0.3pct，qoq-2.9pct ➡️Q3公司持续加码研发投入、推进产能体系建设，CMP装备市占率及规模持续提升，各类新产品拓展推进顺畅，产业化成效突出，实现营收及利润的同比增长。 本土CMP装备龙头，平台型布局持续拓展 公司是国产CMP龙头企业，12英寸CMP全面覆盖先进制程与成熟制程，可适配逻辑、存储、大硅片制造及3DIC、HBM、CoWoS等先进封装场景，CMP装备已在上述领域实现批量落地应用，市占率及规模稳步提升，有力支撑公司经营业绩实现平稳增长。 公司同样持续拓展减薄装备、离子注入装备、清洗装备、晶圆再生、关键耗材及维保服务等新产品业务研发迭代，全系列产品应用场景持续拓宽，市场渗透率稳步提升，新签业务订单规模大幅增长。 两存+先进逻辑大扩产趋势向上 国内两存、逻辑晶圆厂做大做强。两存将有望复制面板成长逻辑成为全球领先企业，晶圆厂体量持续壮大；先进制程必将大扩产，解决国产AI最卡脖子环节及众多高端应用芯片制造瓶颈。 据SEMI，2025年大陆晶圆制造设备市场空间约463亿美元，未来随着大扩产向上， 市场规模有望进一步增长，同时，国产化份额较低，仍有充分提升空间。 风险提示：下游大型晶圆厂扩产不及预期；行业竞争加剧。#文字观点", "publish_time": "2026-10-30 21:13", "tags": ["文字观点"]}, "post:2026-10-30T15-24:63b32c27c3ca": {"id": "post:2026-10-30T15-24:63b32c27c3ca", "kind": "post", "title": "2026-10-30 15:24", "source_label": "帖子正文", "excerpt": "英特尔Q3财报点评：q3盈利超预期，服务器增长强劲，q4指引不及预期 ☀️ 一、财报及电话会要点 1、当季盈利超预期，Q4指引不及预期： Q3营收165.1亿美元，同比+21%，基本符合预期；Non-GAAP EPS为0.52美元，较预期高30%，毛利率44.1%。", "content": "英特尔Q3财报点评：q3盈利超预期，服务器增长强劲，q4指引不及预期 ☀️ 一、财报及电话会要点 1、当季盈利超预期，Q4指引不及预期： Q3营收165.1亿美元，同比+21%，基本符合预期；Non-GAAP EPS为0.52美元，较预期高30%，毛利率44.1%。但Q4营收指引中值155亿美元，低于预期约9%；Non-GAAP EPS指引0.25美元，环比下降52%。财报公布后，股价盘后一度下跌超20%。 2、服务器及定制芯片增长强劲，供给仍是瓶颈： DCAI收入73.2亿美元，同比+78%、环比+17%，营业利润率41.5%；定制芯片收入同比翻倍以上。管理层预计2026、2027年行业服务器CPU出货量均增长超过30%，但晶圆产能及封装基板短缺仍限制交付。 3、PC需求转弱，去库存延续至明年初： CCPG收入81.0亿美元，同比−5%、环比−9%。内存涨价推高整机成本，压制终端采购。公司预计Q4客户端收入环比下降超过20%，去库存压力集中在Q4及2027Q1，并按2027年行业PC出货量下降约10%进行规划。 4、先进制程降本兑现，外部代工仍处早期： Foundry收入67.0亿美元，营业亏损18.5亿美元，环比减亏2.36亿美元。18A晶圆成本较Q1下降约40%，Intel 3下降约15%。但外部代工收入仅4.11亿美元，占分部收入约6%，本季增长主要来自非经常性客户项目。 5、资本开支继续增加，2027年现金流承压： Q3经营现金流50.8亿美元、总资本开支42.2亿美元，公司调整后自由现金流16.4亿美元。2026年总资本开支预期维持200亿美元，2027年预计显著增加，管理层判断明年很可能无法实现正自由现金流。 ☀️ 二、我们的观点 1、AI需求正在向CPU扩散，英特尔受益程度取决于供给与竞争。 Agent任务编排、工具调用及数据处理有望增加CPU需求，服务器业务已成为主要增长支撑。但DCAI增长也包含定制芯片贡献，不能全部归因于CPU。后续重点看晶圆及基板供应释放，能否帮助英特尔在AMD、Arm竞争中守住份额并扩大盈利。 2、制造改善先体现为产品降本，代工重估仍需外部订单。 Intel 3及18A成本下降、Granite Rapids提升整体毛利率，说明制造执行正在改善。但Foundry约94%的收入仍来自内部业务。我们认为，当前应优先关注降本带来的利润改善；外部客户从评估走向流片、量产和持续采购，才是代工业务重估的核心依据。 3、Q4压力不只是工厂事故，PC下行与扩产投入更值得关注。 Fab 28事故预计影响Q4收入约3亿美元、毛利率约2个百分点，无法解释全部6.1个百分点的毛利率环比降幅。PC去库存、制造利用率不足及收入结构变化仍将压制利润率，而扩产又推迟现金回报，意味着收入增长与自由现金流改善未必同步。 我们认为，英特尔的产品业务修复正在兑现，但全面反转仍需时间。 本次盘后大跌反映市场更关注Q4盈利回落及2027年资金投入。服务器需求与18A降本提供了中期支撑，能否持续上修盈利、减少对外部融资的依赖，后续需继续跟踪。#文字观点", "publish_time": "2026-10-30 15:24", "tags": ["文字观点"]}, "attachment:files/中际旭创 2026年三季报解读.docx": {"id": "attachment:files/中际旭创 2026年三季报解读.docx", "kind": "attachment", "title": "中际旭创 2026年三季报解读", "source_label": "其他", "excerpt": "中际旭创 2026年三季报解读电话会议 好的，各位同学晚上好。现在抽时间来参加中际旭创的三季度数据报告说明会。", "content": "中际旭创 2026年三季报解读电话会议 好的，各位同学晚上好。现在抽时间来参加中际旭创的三季度数据报告说明会。我是中际旭创的副总裁王晓丽。首先给大家汇报一下三季度的整体业绩情况。总体来讲，我们还是觉得三季度的整体财务表现对公司而言是比较令人满意的，也是在我们预期中的。相较各个维度来分解看的话，其实可以看到三季度当季跟二季度相比，收入侧有大约25%的季度环比增长，单季取得了277亿人民币的收入。 从毛利预测来看，也看到一个挺好的环比，还在保持持续走高的趋势。尽管我们认为毛利率现在已经是一个挺好的水平，但随着我们前期讲到的，随着我们产品里面高端产品的占比提升、硅光的渗透率增加，以及内部的一些持续的降本，本季度录得的毛利率是46.6%，毛利率比上个季度增加了0.2个百分点。费用方面的话，因为规模效益的体现，所以现在费用的占比其实是在持续保持低位。行，所以综合以上，净利润的话，本季度单季实现净利润是93.6亿，净利润率大约是34%。 跟上季度环比相比，相信各位如果有机会读过季报的话，有看到我们也特别做了解释说明，在这个利润的（构成）上，本季度有几个特殊事项。第一是我们持有的、二季度投的战略投资的上游核心管理的供应商的二级市场投资股票，因为股价的波动，在二季度有一个比较大的公允价值变动收益，在三季度因为股价回调有一个比较大的公允价值变动损失。根据在税前来讲，损失是6.2个亿，影响税后净利润也差不多五个亿，四个亿多一点不到，4.5亿，就是这个项目。 然后另外的话，我们三季度初在七月底我们完成了港股的发行，加上超募的资金，一共收到的净募集资金是大约609亿港币。港币资产跟美元强挂钩，在整个三季度而言还是处于人民币走强、美元港币走弱的态势。尽管我们公司已经对于这部分港币的募集资金，较快的就做了一部分的结汇，但因为整个趋势而言是外币、美元、港币走弱，所以会形成汇兑损失。这部分募集资金带来的汇兑损失在三季度税前大约是3.9个亿的费用的影响，如果税后大约是三个亿的影响。所以以上两个事项都是对本期净利润里面造成的特殊事项。所以如果把这两个事项作为非经常性的特殊事项扣除的话，其实扣非的、就是规模的净利润的口径比上期是有环比增长，有22%。 如果还原到规模里面，我刚刚讲到了，包括（这些）非经常性的因素都会从非经常性损益里列支。所以再把这些事项还原的话，这个季度之间的（增长）跟收入的环比基本是保持一致的。所以总体而言，这个就是净利润的表现，就是利润的盈利能力的表现，我们觉得还是在一个合理的范围内。另外一个的话，从现金流的角度也可以看到，当季我们的自由现金流也呈现了一个相对还不错的数据。因为二季度的时候是有比较多的资本开支款，然后材料的预付款有集中支付，所以（当时）出现（现金流）的波动，当时一些投资人有（所）关心，那可以看到三季度其实就正归于正常。所以总体而言，三季度的财务表现还是相对比较稳健，或者说是比较健康的。我就今天介绍到这里，后面有问题我们再详细确认，谢谢。 感谢领导的分享，下面进入互动交流环节，欢迎各位投资者举手语音互动或发送文字提问。这里我正好（有问题）。好的。 王军 中际旭创副总裁、董秘 这边还有一个环节，等我这边介绍完了再进入这个互动交流环节。好，各位观众好，各位朋友大家晚上好。我们这边把公司的三季度（经营）新情况给大家做一个整体的客户介绍。三季度的经营情况，我们总体来看还是受益于整个行业的高景气度和大客户资本开支的强劲的支持。所以说公司在800G还有（1.6T）这些产品的订单方面，相比二季度就保持一个不错的环比增长。那么公司在三季度的经营期间，充分的发挥了在研发、客户导入、产能和供应链等各个方面的这些优势，保持了一个季度间收入利润环比增长的一个良好的态势。 具体来看的话，我们深度（测算）公司营收的增长主要来自800G以及（1.6T）这些高端产品出货规模的一个持续的扩大。其中1.6T的这个产品收入还在进一步的加速，这也是我们深度（业绩）保持一个增长的重要驱动因素。公司在客户这里最近保持了稳固的份额，另外客户的这个订单也是持续（的），价格和毛利都保持了稳定。另外就是从需求快速增长的同时，一些核心的物料也有不同程度的一些紧张。公司通过前期的积极备料，有效的应对了物料紧张的情况，并通过签订长协、预付款，包括导入一些新的供应商，这些多样化的方式提前的安排我们的关键物料，因此在三季度我们依然实现了收入较快的产品增长。同时我们也看到随着供应商产能逐步的释放，预计这些核心物料供给也在逐步的改善，公司的交付能力也有望进一步的提升。我们在收入快速增长的同时，我们的毛利也保持环比提升，这里面主要得益于产品结构，还有我们的硅光比例的提升，同时也证明了公司在供应链方面的（各项）举措。 最后我也对27年和28年的这个行业（需求）预计（情况）做一个展望。目前整个CSP客户的需求依然非常强劲，主要客户的订单已基本覆盖了2027年全年，目前没有看到客户有任何砍单或者是下修（需求）指引的信息。我们预计2027年这800G和1.6T的订单需求仍将保持快速的增长。同时我们也会看到2.4T、NPO、CPO等下一代光互联产品的需求将在明年的市场里面逐步的释放，可以有效的应用于scale up这些多应用场景。公司目前也正在积极的准备物料和产能，为2027年更好的上量做好准备。 同时我们也看到投资者所关心的2028年的一个需求情况。目前已经有部分的重点客户给到了2028年需求的一些明确指引，当然这只是个别的一些客户，他们（在）2027年依然有不错的增长，而且某些产品的（增长）速度还是非常快的，我们会看到包括前面提到的这些新的光互联产品，在2028年（增长）是非常显著的。所以说我们有理由相信，2028年仍然是一个行业高景气度的一年。我们预计今年年底，就是11、12月份到明年的一季度，预计还会有更多的客户陆续的给出2028年（的指引），我们会在这个阶段及时的给我们的投资人进行（沟通），我就把这个整个三季的经营情况做一个总结回顾。好，下面可以进入这个互动交流的环节。 王晓丽 中际旭创副总裁、财务总监 小丽总、金总晚上好。我是中金公司的分析师李思文。前面两位领导介绍的其实都已经回应了非常多市场关切的一些要点。我这边就补充跟进两个问题。首先第一个问题是想请教一下军总，就是关于您讲到咱们在三季度做了比较充分的物料准备，可能想额外请教一下关于DSP这个物料整体的一个供应情况。这个可能也是当前二级市场投资（者）大家最为关切的一个点，特别是往明年去展望。大家可能也关心像800G，还有1.6T的这个DSP整体的供应是否能够覆盖市场的一个需求情况，以及他们的价格是否在近期的会产生一些变化，然后这种变化是否能够在从（光模块）产生咱们自身的角度去能够比较好的向下游去传导，这是我的第一个问题，主要就是关于DSP的。 王军 中际旭创副总裁、董秘 好的，这个确实是光模块（行业）的一个非常关键的物料。随着这个行业需求的不断的提升，我们看到这些关键的物料，其实也包括DSP，它供给是偏紧张的，但总体来说我觉得由于它的重要性，所以说大客户也参与了对这个物料的一些管控和分配。所以说作为我们客户的重要的供应商，我想我们是能够从中获得所需要的一些物料。我觉得总体来说这个供给程度还是保持非常不错的。这个价格的话，因为DSP它的这个供给比较紧张， 保持 70% 以上。 五、问答环节要点 1. DSP 物料供应与价格 DSP 是关键物料，供给偏紧，大客户参与其管控与分配，公司作为重要供应商能够获得所需物料，供给程度总体保持不错。 因 DSP 供给紧张且上游先进制程产能紧张，价格较为坚挺，但公司有信心保持毛利稳定。 2. 1.6T 与 800G 出货及占比 明年将有更多大客户加入 1.6T，1.6T 增速预计超过 800G；800G 因基数较大，增速不如过去但规模仍大，两者仍是明年出货主要收入来源。 公司不便量化 1.6T 收入占比区间，仅表示 800G 和 1.6T 高端产品出货提升有助于毛利保持不错水平，甚至有望进一步提升。 3. 供应链垂直整合担忧（CPO 等） 公司预期相关变化不会带来供应链断裂，与核心供应商的合作稳定稳固；DSP 需求大且在客户端地位重要，客户会参与分配保障供给，该领域格局不会发生剧烈变动。 4. 洪水对泰国工厂发货及存货的影响 泰国工厂因最后一周受洪水影响物流，成品发货有延后，已在十月发货完毕，属时间性差异。 存货中半成品/成品有部分因在途或周转减缓导致增加，但影响比例不高；公司库存约 30 亿美金，大部分为原材料及备料，是为后续订单准备，整体库存周转速度健康。 5. 价格趋势 三季度价格相比上半年总体稳定；光模块行业价格一年内不会剧烈波动，跨年后重新报价。 行业整体报价相对理性，未出现恶性竞争，2027 年价格走势预计较为良性，有利于保持盈利能力。 6. 优于同行的决定性因素 公司认为硅光技术路线与供应链优势、大客户青睐、公司主动管理能力（开发新供应商、技术革新）等要素都很关键，属综合优势、综合能力；任何短板都可能导致整体交付下降。 7. 毛利率空间与硅光占比 公司预期未来几个季度毛利保持相对稳定，通过技术、供应链管理、生产效率、良率提升等手段维持，出货结构改善（1.6T、规模产品比例提升）也有利稳定毛利。 毛利若要进一步上升甚至加速，可能还需 NPO 或更高速率光模块大规模出货带动。未披露硅光具体收入占比。 8. 2.4T 与 NPO 新产品节奏 NPO 为新产品，存在产能爬坡过程，相关新物料供应商也有放量过程，客户下单会充分考虑这些因素。 预计自 2027 年下半年开始逐步上量，2028 年上升更快，已有大客户部署加快，另有新增意", "status": "extracted"}, "post:2026-10-30T11-11:c35e93f1e99e": {"id": "post:2026-10-30T11-11:c35e93f1e99e", "kind": "post", "title": "2026-10-30 11:11", "source_label": "帖子正文", "excerpt": "光伏26Q3业绩简评_1029TCL中环：前三季度实现营收235.14亿元，同比+9.0%；归母净利润-45.56亿元，同比改善21.1%。", "content": "光伏26Q3业绩简评_1029TCL中环：前三季度实现营收235.14亿元，同比+9.0%；归母净利润-45.56亿元，同比改善21.1%。其中Q3实现营收91.99亿元，同比+12.6%、环比+18.5%；归母净利润-13.52亿元，同比改善11.9%、环比改善13.2%。 前三季度公司光伏硅片出货83.4GW，市占率行业第一，其中海外出货占比13.8%、出货量同增355%；电池组件实现销量14.5GW、同增43%，其中海外出货占比20.6%、出货量同增202%，新能源光伏业务收入中电池组件占比50.1%，较上半年提升3.2PCT，Q3电池组件销量6.6GW，环比增长32%。公司收购一道新能源的控股权于7月初完成交割，已启动20GW电池和25GW组件的BC技改项目，预计至明年一季度陆续完成，届时公司电池和组件产能分别达到20GW（BC）和50GW（BC、TOPCon各25GW）。 前三季度半导体材料子公司中环领先（持股32.72%）实现营收49亿元、同增15%，整体盈亏平衡，其中Q3实现营收18.6亿元、同增23%，净利润0.8亿元，单季度实现经营性盈利。阿特斯：前三季度实现营收186.47亿元，同比-40.37%；归母净利润-0.95亿元，同比-109.63%。其中Q3实现营收58.63亿元，同比-42.63%、环比+3.68%；归母净利润-3.95亿元，同比-253.09%、环比-79.63%。 前三季度公司组件出货6.2GW，其中Q3出货约2.2GW，出货规模较低导致亏损较深；储能系统出货3GWh，测算单位盈利0.06~0.07元/Wh，环比基本持平。永臻股份：前三季度实现营收65.93亿元，同比-27.14%；归母净利润0.53亿元，同比+2313.16%。其中Q 2e": {"id": "post:2026-10-30T08-15:351b7160822e", "kind": "post", "title": "2026-10-30 08:15", "source_label": "帖子正文", "excerpt": "光伏主产业链重点公司及行业动态日报1029行业动态： 1. 本周光伏产业链价格呈现上中游挺价、组件端让利的分化格局。硅料成交清淡，主流厂商减产挺价，但下游高库存仍待消化", "content": "光伏主产业链重点公司及行业动态日报1029行业动态： 1. 本周光伏产业链价格呈现上中游挺价、组件端让利的分化格局。硅料成交清淡，主流厂商减产挺价，但下游高库存仍待消化；硅片整体持稳，受年底集中式项目拉动，210N试探性涨价，其余尺寸持平；电池片跟随分化，210N随组件厂加快出货上涨，其余报价持平；组件端逆势让利，月末厂商冲刺出货目标，TOPCon国内均价小幅下调，海外维稳，美国232关税落地在即。 2. 10月28日，北京市政府印发“十五五”时期新型能源体系规划。提出挖掘本地可再生能源潜力，力争新增风光装机200万千瓦，全市新能源利用率达到95%以上，将规模化推广第五立面光伏应用，同时优化风电布局，助力首都能源绿色低碳转型。公司动态： 【欧晶科技】1-3Q26营收3.50亿元，同比基本持平，归母净利润-0.52亿元，同比减亏；其中3Q26营收1.13亿元，环比-8.9%，归母净利润-0.07亿元，环比大幅减亏。3Q26毛利率约10.6%，环比基本持平，单季亏损边际收窄。 【TCL中环】1-3Q26营收235.14亿元，同比+9.0%，归母净利润-45.6亿元，同比改善21.1%；其中3Q26营收92.0亿元，环比+18.5%，归母净利润-13.5亿元，环比改善13.2%。3Q26毛利率约为负，环比略有修复，单季亏损边际收窄。 【帝科股份】1-3Q26营收171.90亿元，同比+35.10%，归母净利润0.43亿元，同比-46.90%；其中3Q26营收55.25亿元，环比+8.4%，归母净利润0.06亿元，环比-72.1%。3Q26毛利率约4.4%，环比明显下滑，单季盈利能力承压。 【同享科技】1-3Q26营收30.20亿元，同比+25.38%，归母净利润0.79亿元，同比大幅增长；其中3Q26营收11.49亿元，环比+30.7%，归母净利润0.31亿元，环比大幅增长。3Q26毛利率约5.5%，环比有所下降，单季盈利能力仍处低位。 【阿特斯】1-3Q26营收186.47亿元，同比-40.37%，归母净利润-0.95亿元，同比由盈转亏；其中3Q26营收58.63亿元，环比+3.7%，归母净利润-3.95亿元，环比亏损大幅扩大。3Q26毛利率约8.0%，环比明显下降，单季盈利能力承压。今日行情：上证综指：-0.82%；沪深300：-1.03%；光伏行业指数：-0.58%#文字观点", "publish_time": "2026-10-30 08:15", "tags": ["文字观点"]}, "attachment:files/光伏新技术呈现盈利差异，海风进入政策拐点——东吴电新新能源十月月报.pdf": {"id": "attachment:files/光伏新技术呈现盈利差异，海风进入政策拐点——东吴电新新能源十月月报.pdf", "kind": "attachment", "title": "光伏新技术呈现盈利差异，海风进入政策拐点——东吴电新新能源十月月报", "source_label": "其他", "excerpt": "光伏新技术呈现盈利差异，海风进入政策拐点——东吴电新新 能源十月月报 要点总结 1.光伏筹码结构良好，三季度行业整体减亏，盈利分化显现：企业不再追求出货量而转向减亏与盈 利，高效组件（BC、TOPCon3.0）在海外享有溢价，部分公司三季度扭亏为盈。推荐关注技术变化领 先、龙头地位明确的隆基、金科、爱旭、福斯特、福莱特等。", "content": "光伏新技术呈现盈利差异，海风进入政策拐点——东吴电新新 能源十月月报 要点总结 1.光伏筹码结构良好，三季度行业整体减亏，盈利分化显现：企业不再追求出货量而转向减亏与盈 利，高效组件（BC、TOPCon3.0）在海外享有溢价，部分公司三季度扭亏为盈。推荐关注技术变化领 先、龙头地位明确的隆基、金科、爱旭、福斯特、福莱特等。 2.储能是当前需求景气度最高的方向：明后两年需求增速预计均在30%以上，上游原材料跌价利好下 游集成端与一体机企业，阳光、德业、海博、锦浪等公司明年盈利有望改善并享受海外放量。 3.风电进入新阶段，深远海政策是关键催化：深远海行动方案已获国务院批准，有望近两周下发地 方，年底或明年初可见各地竞配；海外亚非拉陆风招标迅速、欧洲海风高溢价，金风、三一、运达、大 金等受益。 4.国内光伏需求明显下滑，全年装机预计160–180GW：9月新增装机13.6GW，1–9月累计 110GW、同比下降约34%；受136号文电价改革与\"十五五\"首年央国企开发节奏放缓影响，全年同比 或降约50%，为未来五年最低年份。 5.反内卷政策持续加码，硅料价格回升至约4.3万元/吨：工信部从能效（TOPCon最低23.2%、BC 最低23.5%）与能耗（多晶硅收紧至64,000度/吨左右）双标准约束；市监局要求以硅料为首的企业 报价不低于完全成本价，执行较去年更严苛、更易管控。 6.光伏设备出口受限，高精尖设备需报备：多晶硅、硅片、电池、组件相关设备中，BC、TOPCon3.0 等不可出口，TOPCon1.0可备案出口，海外扩产或向SpaceX等销售设备需向国家报备。 7.招标机制电价回升，改善电站收益率与组件价格接受度：新疆2027年上半年项目电价回升至约 0.26元，甘肃0.25元、云南0.33元、辽宁0.30元，接近标杆燃煤电价，有助于打通\"反内卷\"链条。 8.组件效率差异直接拉开盈利差距：640–660W高效组件海外溢价可达1–2美分（约0.07–0.15元 /W），考虑溢价与成本后可实现盈利；爱旭三季度扭亏为盈，金科盈利好转明显。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 9.各环节景气分化：硅料10月排产降至约11万吨、11月或降至9.7万吨以下；硅片议价权弱、继续 亏损；电池片价格支撑不足；胶膜三季度盈利回归常态；2.0mm玻璃价格回升至10.6元/平米，头部 信义、福莱特已可盈利。 10.国内储能装机与招标高增，配储时长提升：前三季度并网102GWh、同比增6%，全年预计240– 250GWh、增约30%；配储时长由去年平均2.6小时升至2.9小时；2026年累计招标377GWh、中 标286GWh，同比翻倍。 11.海外储能多点开花：美国1–8月累计装机约10GW/30GWh，抢装延续至2026–2027年；英国在 运14GWh、在建19GWh、获批160GWh；印度上半年累计8GWh、在建超100GWh；意大利、德 国需求旺盛。（ ） 12.户储出口上台阶，欧洲气价是潜在爆发点：1–9月逆变器出口88亿美元、同比增30%；欧洲天然 气价格创2023年以来新高，若电价压力传导至居民或复刻2022年需求爆发；波兰9月出口创历史新 高、累计同比增120%；澳洲全年预计15GWh、明年12–15GWh；东南亚11月起重回旺季。 13.风电装机与招标承压，海风招标同比降50%：1–10月陆风招标89GW、同比增2%；1–9月海风 招标4.7GW、同比降50%，主因项目审批（军事、航海）签字滞后；全年装机预计100–110GW，其 中陆风90–100GW、海风6–8GW。（ ） 14.深远海打开中长期空间：深远海总空间300GW以上、可用约200GW，三年行动方案要求实施 58GW、储备140GW；海外方面英国AR7中标8.4GW、AR8预计8–10GW，丹麦推出50亿欧元 CfD支持，德国CfD政策推进值得跟踪。（ ） 15.风机出海毛利率优势明显：1–9月风机出口11.6亿美元、同比增50%（在2025年已增50%基础 上）；海外毛利率20%以上、部分订单达30%，金风海外出口毛利率20%以上、综合毛利率10%以 上；三一低价订单执行完毕叠加明年出口放量，毛利率有望进一步修复。 问答整理 本次电话会议为单向汇报，未设置问答环节。 原文 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008vx:WUXL3408 vx:WUXL3408 vx:WUXL3408 光伏新技术呈现盈利差异_原文2026年10月30日01:14发言人00:00大家好，欢迎参加东吴电新新 能源十月月报。光伏新技术呈现盈利差异，海丰进入政策拐点。会议目前所有参会者均处于静音状态， 下面开始播报声明。 发言人00:17东吴证券研究所提醒您，本次电话会议仅面向机构投资者或受邀客户、第三方专家发言 内容仅代表其个人观点，所有信息或所表述的意见均不构成对具体证券在具体价位、具体时点、具体市 场表现的判断或投资建议。未经合法授权严禁录音转发及相关解读，涉嫌违反上述情形的，我们将保留 追究法律责任的权利。感谢您给 速，2026世界杯、推广AI产品导致的货币化效率阶段性下行为主要因素；2）英特尔业绩，PC业务疲软、以色列工厂停产为主要因素；3）CAPEX指引，除了微软表示需要保持FCF为正，资本开支不超过同期经营现金流之外，其他公司均未给出太多量化表述，并将悬念推迟到Q4财报，叠加同期企业FCF的转负，以及META等股票增发计划的披露等，使得市场担忧进一步加剧，考虑到谷歌、亚马逊、微软对AI算力需求的乐观表述和展望，我们判断CAPEX指引的延后给出，更多反映了当下审慎的经营考量，以及和上游供应链的复杂预期博弈等； 市场担忧：Neocloud债券CDS、科技巨头融资压力成为当下市场主要担忧来源，但考虑到Neocloud自身无担保债券的体量、后续融资更多转向DDTL等抵押贷款等方式，科技巨头更多通过股票+债券的综合融资方式，以及近期META、博通在融资层面的积极进展等，市场当下的担忧明显缺乏坚实的数据支撑，更多是基于局部数据的线性外推和凭空猜想，反应短期脆弱市场情绪的放大、宣泄； 短期关注：对于市场而言，主要担忧的实现需要依赖于更多产业层面裂痕的出现，相较于Neocloud这种情绪性指标，短期建议重点关注更有意义的指标：1）科技巨头债券CDS，200bps为重要点位；2）算力租赁价格，市场的重要防线；3）硅谷一级市场融资，这是AI算力的边际价格制定者； 短期判断：目前主要头部公司三季报基本披露完毕，下周我们将迎来美国中期选举，后续事件性冲击将显著减少。考虑到当下市场震荡、抛售更多来自于宏观流动性压力、中期选举前风险规避、中期AI ROI担忧（短期基本面并未看到明显瑕疵），以及市场做空仓位&流动性压力极端位置，中期选举之后不确定消除、股票回购重启等，我们预计市场将在经历短期震荡之后快速迎来反弹。#文字观点", "publish_time": "2026-10-30 13:48", "tags": ["文字观点"]}, "post:2026-10-30T10-25:060fd6bf1c0d": {"id": "post:2026-10-30T10-25:060fd6bf1c0d", "kind": "post", "title": "2026-10-30 10:25", "source_label": "帖子正文", "excerpt": "路演takeaway1：当前股市的核心矛盾是筹码出清。5-6月份，300标的股表现较弱，机构只能躲到科技股“避险”", "content": "路演takeaway1：当前股市的核心矛盾是筹码出清。5-6月份，300标的股表现较弱，机构只能躲到科技股“避险”；而动量策略当时唯一胜出的策略；委托人给了提升科技含量的巨大压力。 但持仓结构和风险承受力不匹配，很多绝对回报账户，配置了过高的仓位和科技板块。市场波动加大之后，绝对回报属性回归，只能被动减仓并引发螺旋下行。 更尴尬的是，三季度不少龙头公司业绩暴雷，导致市场从杀估值进入阶段性的杀业绩。市场偏弱导致业绩好也难有股价反应，也导致部分公司干脆不愿意释放业绩，进一步挫伤人气。 路演感受看，情绪底感觉已经到了，预期在十一之后就基本一致了。 但筹码出清如何？公募的TMT集中度仍偏高；保险其实很难有仓位上的大动作，各种新媒体的说法都不足为信，后续无疑会加大OCI账户的配置；年金养老金做了适度调仓，但是否到位难说；私募筹码出清相对较快；量化私募后面会有赎回压力……；个人投资者感受不佳，反弹会有减持压力，主动ETF销售压力不小。期待外力。 后续还要关注下美股联动。在全球流动性收缩的环境下，各类资产都很难有太好的表现。 市场如钟摆，静待转机。#文字观点", "publish_time": "2026-10-30 10:25", "tags": ["文字观点"]}, "attachment:files/万联证券-农林牧渔行业厄尔尼诺系列专题报告(一)：超强厄尔尼诺已至，供给冲击沿链传导-261029.pdf": {"id": "attachment:files/万联证券-农林牧渔行业厄尔尼诺系列专题报告(一)：超强厄尔尼诺已至，供给冲击沿链传导-261029.pdf", "kind": "attachment", "title": "万联证券-农林牧渔行业厄尔尼诺系列专题报告(一)：超强厄尔尼诺已至，供给冲击沿链传导-261029", "source_label": "万联证券", "excerpt": "请阅读最后评级说明和重要声明 丨", "content": "请阅读最后评级说明和重要声明 丨证券研究报告丨 [Table_scodeMsg1] 公司研究丨点评报告丨仕佳光子（ 688313.SH ） [Table_Title] Q3业绩增长提速，盈利能力环比提升 报告要点 [Table_Summary]公司2026Q3收入、归母净利润同比分别增长 116%、226%，环比增长34%、36%，业绩增长 显著提速；单Q3毛利率升至40.1%，同比、环比分别提升 10.4pct、2.7pct。AI算力需求驱动 数通订单增长，公司持续推进降本增效与良率提升。 MPO/MMC、AWG等产品放量，CW DFB 批量出货、EML推进客户验证，扩产项目有序实施， “无源 +有源”平台成长动能有望持续释放。 分析师及联系人 [Table_Author] 杨洋 黄天佑 操俊茹 SAC：S0490517070012 SAC：S0490522050005 SFC：BUW100 %% %% %% %%research.95579.com 1 请阅读最后评级说明和重要声明 更多研报请访问 长江研究小程序 丨证券研究报告丨 [Table_scodeMsg2] 仕佳光子（688313.SH） cjzqdt11111 [Table_Title 2] Q3业绩增长提速，盈利能力环比提升 公司研究丨点评报告 [Table_Rank] 投资评级 买入丨维持 [Table_Summary2] 事件描述 公司发布2026年第三季度报告：2026年前三季度实现营业收入 27.22亿元，同比+74.5%； 归母净利润5.86亿元，同比+95.4%；扣非归母净利润5.79亿元，同比+95.3%。单26Q3实 现营业收入12.27亿元，同比+116.1%，环比+33.5%；归母净利润2.71亿元，同比+226.2%， 环比+36.4%；扣非归母净利润2.70亿元，同比+226.6%，环比+34.2%。 事件评论 ⚫ 收入业绩加速增长，毛利率同环比显著提升。受AI算力需求驱动，数通市场快速增长， 公司产品竞争优势及客户认可度提升，订单同比增加，单 Q3收入、归母净利润同比增速 分别由Q2的65.1%、60.9%提升至116.1%、226.2%。公司持续推进运营管控、降本增 效及产品良率提升，26Q3综合毛利率为40.1%，同比+10.4pct、环比+2.7pct；归母净利 率为22.1%，同比+7.5pct、环比+0.5pct；扣非归母净利率为22.0%，收入规模扩大与盈 利能力改善形成共振。 ⚫ 研发投入环比增加，销售/管理费用率规模效应体现。26Q3公司研发投入0.66亿元，同 比+81.2%、环比+111.4%，研发投入占收入比例为 5.37%，同比下降1.03pct。公司于 2026年7月起实施股权激励，单 Q3确认股权激励费用0.49亿元；根据公司披露，扣除 相关影响后，单Q3研发投入同比增长12.74%。费用率方面，26Q3销售、管理、财务 费用率分别为1.64%、4.10%、0.79%，同比分别-0.41pct、-0.38pct、+0.23pct。 ⚫ “无源+有源”产品持续迭代，扩产强化订单交付保障。无源方面，公司MPO、MMC高 速连接跳线已进入全球供应链体系并大批量持续出货； 800G/1.6T AWG-Lens、1.6T AWG 芯片及组件实现小批量出货， CPO用DWDM AWG实现样品出货。有源方面，硅光配套 非控温100mW CW DFB已批量出货，商温400mW CW DFB实现小批量出货，100G EML正推进客户送样验证。产能方面，公司 12.65亿元高速光芯片与器件项目有序推进， 并纳入拟募资28亿元的定增募投项目体系，为中长期订单交付提供产能支撑。 ⚫ 投资建议：AI算力基础设施建设持续拉动高速光互连需求，公司以 MPO/MMC、AWG等 无源产品形成业绩支撑，高功率 CW DFB及EML打开有源芯片增量空间。 “无源 +有源” IDM平台协同、产品良率提升及扩产项目落地有望推动收入与盈利能力持续成长。预计 公司2026-2028年归母净利润为9.10亿元、16.45亿元、27.83亿元，对应同比增速 144%、81%、69%，对应PE为57倍、31倍、19倍，维持“买入”评级。 风险提示 1、宏观经济与下游需求波动风险； 2、技术升级迭代及客户验证风险； 3、扩产项目建设、良率爬坡及产能消化风险； 4、海外经营及国际贸易政策变动风险。 公司基础数据 [Table_BaseData]当前股价(元) 114.00 总股本(万股) 45,199 流通A股/B股(万股) 45,199/0 近12月最高/最低价(元) 206.67/63.48 注：股价为2026年10月23日收盘价 市场表现对比图(近12个月) 资料来源：Wind 相关研究 [Table_Report]•《MPO放量驱动高增，AWG与光芯片蓄力》 2026-08-09 •《MPO/AWG发力增长，高速光芯片大幅扩产》 2026-04-22 •《多品类发 作推进会。会议轮番 召开一方面印证山西减量形势严峻，另一方面体现政府正以\"一矿一策\"等手 段推动复产，整体处于逐步恢复进程中。 四季度产量展望：截至10月底，公司前期因隐患等因素导致生产受影响的 环节已逐步消除，目前基本处于正常状态，Q4按正常节奏展望；但在安全收 紧约束下只能逐步恢复，满产或达产状态不会有大幅增长。 全年目标与回补空间：年初计划执行中受到安全监管的大环境扰动，多个月 份产量受影响、存在欠量；剩余2—3个月只能按正常节奏生产，超产在严 守安全底线前提下不可能发生，大幅回补的可能性估计不大，争取方向是按 正常产能计划尽量满产。 产销量数据：前三季度累计原煤产量3147万吨、商品煤销量1683万吨；其 中Q3单季原煤产量900多万吨（主因8月几个主力矿受影响），Q3单季销 量476万吨，环比大幅下滑。 3.价格与成本边际：长协价格节奏、吨毛利测算口径 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 焦煤长协价格路径：9月长协涨幅较大；10月长协涨幅区间30—80元/吨、 平均上涨50元/吨，属小幅提涨；11月长协预计维持10月水平不变，暂无 进一步上调预期，后续将进入年底订货会窗口。年内Q3中7月、9月各有一 次提涨，是单季业绩改善的核心驱动。 年度价格高点参考：交流中提及事故后焦煤价格一度上涨至2800元/吨左右 水平。 成本结构：公司历年成本总体平稳，原煤开采成本200多元、在300元以内， 洗煤加工费100多元；Q3因产量收缩导致固定成本分摊有所增加，随量恢复 单位成本有望下拉、趋于均衡，Q4在价格稳定叠加量的恢复下成本有一定下 行空间，整体仍在大区间内保持平稳。 吨毛利测算与公司口径修正：研究员按Q3综合售价约860元/吨、原煤开采 成本约300元+洗选加工约100元测算，Q3单吨毛利约400—500元，Q4或 可看到500—600元区间；但公司口径更为审慎——对外报价为多个焦煤产 品的组合价或最高价，实际综合售价没有那么高，且需考虑洗出率因素，成 本高于\"300+400\"的简单加总，整体属于一个大区间。 动力煤定价机制：公司动力煤主要为焦煤洗选副产品、量不大，保供任务全 部按发改委指导价执行，依据5500大卡基准价按自身卡数折算定价，属跟 随定价、无引领作用；11月将洽谈动力煤年度长协，公司无额外议价话语权。 4.财务细项拆解：投资收益、利息资本化与少数股东权益 新矿井田巷道利息资本化：新县井田探转采推进中，相关巷道利息支出转为 资本化。2025年6月20日起开始资本化，2025年资本化半年，2026年全年 资本化，截至目前规模约4亿元，对当期业绩形成正向影响。 投资收益——中润铝业（原中铝华润）：公司参股20%，该参股公司2026 年为公司确认的投资收益约4亿元，是投资收益的主要贡献；前三季度其各 季度净利润基本持平，座谈反馈Q4目前看无太大变化，可按单季度约1亿 元利润平推。 投资收益——集团财务公司：参股20%，2026上半年贡献投资收益约8000 万元，前三季度累计约1亿元。 少数股东权益：Q3单季约-0.2亿元，同比减量2亿元以上、环比减量接近3 亿元。两大拖累：①Q3煤价上涨背景下电厂出现亏损；②子公司腾辉煤业自 6月起基本无收入、其少数股东占比高达49%，冲击较大；公司Q3收益主要 来自母公司及多数全资子公司，故不摊薄少数股东。 腾辉煤业具体情况：问答中公司补充更正口径——腾辉为济宁公司下属矿井， 产能120万吨（此前误述为300万吨），煤种为瘦焦煤；亏损主因是工作面 遇到断层、过断层期间采出多为矸石而无煤炭产出，属开采工艺与地质条件 造成的短期亏损，非持续性经营恶化，过完断层后预计陆续恢复正常。 电力板块：管理层表示2026年电力行业因煤炭价格上涨、售电价格下降已 出现亏损；交流中提及当前动力煤价约1000元/吨背景下电厂盈利承压，但 公司未披露装机容量及度电利润的具体量化数据。 5.产能、核增与中长期供给增量展望 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 核增政策刚启动：政府近期开始部署煤矿产能核增工作，鼓励符合条件的矿 井上报，目前仅处于初期布置阶段，实际成效仍需持续跟踪验证。 公司层面核增空间有限：公司现有17座矿井、在产16座，总产能4760万 吨，多数为多年正常运转的成熟矿井，明显符合核增条件或具备大幅核增产 能空间的矿井较少；潜在核增主要在临汾公司下属整合矿，但该类矿井资源 偏少、存在接续问题，报批空间与能力均不大；上市公司层面尚未听说洗选 厂合作事项。 兴县新矿是唯一明确增量项目：公司近期成立新兴公司，专门推进2024年 竞拍获得的兴县井田前期开发工作。目前前期勘探工作基本完成，下一步转 为采矿权、完成开工报告等审批后开工建设。管理层明确2026年至2031— 2032年间无新增产能释放；兴县项目建成需5年之后（3—5年不现实）， 建设周期5—8年，资本开支按当前行情预计约100亿元。 山西省新增产能审批：与公司同步竞拍资源的主体均在紧张推进中，另有部 分在建或陆续建成项目，但具体总量公司层面并不掌握。 6.分红政策与股东回报 历史分红水平：公司上市以来每年均保持分红，近几年分红比例保持在60% 以上，跟随效益变化维持较好水平。 2026年分红口径：管理层保持积极分红态度明确不变，但具体比例需结合全 年实现效益及后续资金需求综合确定。 7.2027年焦煤价格展望与行业判断 分煤种结构性分化：焦煤稀缺性逻辑贯穿整个阶段。非主流配煤煤种市场相 对宽松，受进口煤及替代品影响较大、可替代性强；个别优质主焦煤非常稀 缺、性价比好，价格保持溢价且较为坚挺。 外部变量：进口受进口政策及国际局势扰动而不稳定，加大价格波动风险。 结论性判断：展望2027年及今后一段时期，稀缺性大环境不会改变，主流 高性价比焦煤价格保持坚挺状态；炼焦配煤等非主流煤种或偏宽松、受到一 定影响，价格端呈结构性分化格局。 供暖季山西省产量判断：安全检查后复工矿井开工率基本能恢复正常，但量 上不会出现大幅增长；会议频次密集本身就说明实际产量低于预期，各类复 产增产推动均以严守安全底线为大前提，产量只能是逐步恢复的路径，大幅 增加的可能性不大。 问答整理 1.关于公司生产恢复情况，中报提及3季度9月份能够完全恢复生产，目前生 产的恢复情况如何？4季度产量是否还有边际变化？公司对山西省整体产量状 态有何看法和判断？ 答：公司在8月份陆续发布公告，本部主力矿井西铭、镇城底、西曲、马兰因事 故或证照办理原因持续停产，8月份一个月基本全部受影响。5月22号事故后， 全省煤矿由于安全检查和安全收紧等因素产量都在下降。9月份公司基本恢复正 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 常生产，但复产以后安全形势依然紧张严峻，整体虽恢复正常但产量较以往仍受 到一些影响，存在“复产不复量”的问题。从山西省来看，10月26号山西省统 计局发布全省地区生产总值数据，同比增长0.5%，其中第二产业增加值下降4.9%； 6月至9月山西省每月产量大致在7000万吨上下，较往常正常产量减少30%以上， 9月份仍减少31%。9月份能源局召开电煤保供工作推进会，9月26号省长主持 召开全省煤炭稳供稳产工作推进会，10月16号国家发改委、国家能源局会同有 关部门在太原召开加快煤矿复产增产保供工作推进会，轮番的会议一方面体现山 西省减量比较严峻，另一方面也体现政府正在加大各种手段推进煤矿复产，目前 正在一矿一策推进具体举措，复产正在逐步恢复中。 2.对于4季度或者10月份的整体生产体验，比事故发生前的恢复程度大概有 一个什么样的预估？想追问量上的情况。 答：现在10月份基本上已经结束，按照目前节奏，省里也在配合做各种举措推 动工作。公司此前因隐患等原因导致生产受影响的因素正在逐步消除，目前基本 是一个正常的状态。4季度展望正常情况，但整体上还是受安全收紧的情绪或形 势影响，生产逐步恢复，满产或者达产不会有很大幅度的增长。10月份价格平 均水平上涨50块钱。 3.3季度特别是7月份和9月份各有一次提涨，10月份价格方面，主焦煤和配 焦煤的提涨幅度大概在多少？11月份的价格预期如何？ 答：10月份涨价幅度在30到80元、平均50块钱的小幅上涨。根据目前了解， 按照涨价节奏，11月份预计保持平稳，维持10月份平均上调50块钱左右的价 格水平。 4.3季度整体成本比2季度有没有比较量化的结论？4季度量上面有修复，成 本变化幅度上会不会有比较下行的判断？ 答：公司历年成本总体上相对比较平稳，原煤开采成本在200多、300以内，洗 煤加工费100多。今年3季度因为量上面的影响、量比较小，部分固定成本分摊 有所增加。到生产量恢复上来的时候，成本基本会往下拉一拉、更均衡一些，公 司成本这几年相对稳定，就在这个区间里头。4季度价格稳定，成本上面通过量 的恢复可能有一定的下拉，总体上还是在这个大的区间里保持平稳状态。 5.原煤开采成本大概在300元、洗煤加工成本100元，对应3季度披露的整体 价格大概在860元左右，3季度单吨毛利是否大概在400~500块钱？4季度是否 可以看到大概500或600块钱的吨毛利区间？ 答：公司产品报价是几种焦煤产品组合或者是价格最高的那种报价，实际公司各 种产品最后的综合售价没有那么高。建议参考过往年报指标，一个是考虑综合售 价，再一个是综合成本。除原煤开采成本和洗煤加工费之外还要考虑洗出率的问 题，不是简单的成本加总，根据洗出率折算后成本比那个要高一些，总体上是一 个大的区间。 6.公司新县井田探转采在推进中，前期利息支出变为偏资本化的支出，这一块 对3季度业绩大概有哪些影响？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：新矿井田巷道资本化从去年6月20号开始，去年资本化了半年，今年是全 年资本化，目前到现在大概有4个亿左右。 7.公司投资收益在3季度有所增加，主要的贡献来自于哪些？ 答：投资收益主要来自参股公司中铝华润（现在改名叫中润铝业），公司参股 20%，今年计算的投资收益大概有4个亿左右。此外还有集团内部的财务公司， 公司参股20%，投资收益半年在8000万左右，到3季度应该有1个亿。主要构 成就是这些。 8.4季度如果铝价维持在高位、整体经营没有太大波动的话，是否可以按照1 个亿左右的利润来平推4季度？ 答：是的。铝业公司今年业绩比较平稳，从前3季度来看每个季度的净利润差不 多，3季度座谈时对方也表示4季度目前来看没有太大的变化。 9.3季度少数股东权益大概是-0.2亿左右水平，同比有2个亿以上的减量，环 比有接近3个亿的减量，这一块主要来自于哪些变动？ 答：3季度因为煤价上涨以后，电厂出现了3季度亏损，影响少数股东减少。同 时下面子公司腾辉煤业从6月份开始就没有收入了，其少数股东占比较高、占 49%，影响比较大，所以单季同比下降、环比下降。3季度收益主要是母公司和 大部分全资子公司，所以不影响少数股东，主要是电厂下降和腾辉煤业两个因素 的影响。 10.腾辉煤业这家公司的整体规模、煤种以及亏损原因是什么？主要是成本提 升比较多还是量减少比较多？ 答：腾辉是公司收购华晋的时候华晋下面的一个子公司，煤种是瘦焦煤。公司随 后补充更正，该矿井产能为120万吨。其亏损原因是工作面遇到断层出不了煤， 属于开采工艺上的情况，不是其他原因，就是遇到地质条件。过断层期间采出来 的都是石头，没有煤炭，所以没有什么收入，造成短期亏损，过了断层以后应该 会陆续好转。 11.3季度煤价较高，电厂这边出现亏损，目前公司电力这一块的装机容量大概 是什么水平？在当前动力煤价1000块钱左右的位置下，度电利润大概在多少？ 如果按现货来看，电力度电盈利大概在多少？ 答：今年电力行业由于煤炭价格的上涨以及售电价格的下降，其实已经出现亏损。 12.最近行业比较关注核增情况，从与政府交流下来的情况看，山西省对核增 的态度如何？目前山西省已有哪些核增量？公司集团是否已经提请了核增量？ 答：最近政府部门陆续有一些举措推动产能增加。核增问题现在才是刚开始，工 作刚布置下来，鼓励符合条件的上报，刚刚开展，有没有成效还需要持续跟踪观 察，目前正在推进这个工作，刚刚部署下去。 13.在政府大力推动核增的背景下，从山西焦煤层面来看，包括之前已经建好 但还没有投产的、新建的、以及计划报上去的核增矿井，如果推进核增工作， 未来大概可以出来多少增量？时间节点和节奏大概是什么样的？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：公司现在共17座矿井，在产的16座。从公司角度看，核增潜力并不大，大 部分矿井都是正常生产的成熟矿井。临汾公司下面的一些整合矿因为资源较少了、 存在接续问题，可能做一些核增方面的工作，但这个空间以及可能的报批能力并 不大，也不会很多。 14.公司未来一段时间，比如从2026年到2031、2032年，有一些新的产能可 以出来，这个节奏可以介绍一下吗？ 答：目前并没有。公司现在大力推进的是兴县新兴公司，为2024年竞拍到的兴 县井田做前期的一些工作开发，要建成估计得3到5年，肯定是5年之后，最近 几年公司新增产能的空间也不是很大。 15.公司新增煤矿要到3到5年之后了，从山西省新增煤矿或新增煤矿审批的 角度，目前了解到山西省大概有多少新增煤矿在审批过程中？节奏或量上有没 有大概的了解？ 答：山西省的新增产能有和公司同步的、最近竞拍下来资源正在紧张推动中的， 也有其他情况的，比如以前正在建设的或者是陆续建成的新增产能，整体情况不 太掌握。 16.焦煤长协价格后边两个月大概是什么趋势？10月份焦煤期货从高点回落比 较多，后边两个月销售价格这块会有什么变化吗？ 答：长协价格9月份涨幅比较大，10月份是30到80、平均50块钱的小幅上涨。 现在到10月29号，按照以前的规律开始考虑11月份价格，11月份可能最近会 出台，了解到的情况是维持10月份的长协价格不变。11月份接下来就要考虑年 底订货会的情况。 17.11月份要谈动力煤年度长协，对年度长协体系，比如基准价和浮动的指数 这块有什么展望吗？ 答：公司动力煤主要是焦煤洗选以后的副产品，量不是很大。虽然有保供任务， 但洗混煤或者动力煤价格是跟随发改委的指导价，根据公司煤炭卡数，按5500 大卡的价格把卡数折算以后执行，公司属于跟随性质，没有什么引领作用。 18.最近保供政策提及较多，山西省单月产量同比下滑也比较多，展望全省面 临供暖季，量上会有一个大幅的上涨吗？开工率层面上怎么看？ 答：通过安全检查之后，复工的基本上能正常恢复，但量上面肯定不会有大的增 长。现在看到频繁开会推动工作，说明实际情况肯定比预期的要差。各种会议虽 然说是要推动加快复产增产，但都是在严守安全底线这个大的前提之下，谁也不 可能突破。在严格安全管控的情况下，大幅度增加产量只能是逐步恢复，大幅度 增加可能性不是很大。 19.新建的兴县煤矿未来总体资本开支大概是多少？从时间节奏来讲大概什么 时间能够投产？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：时间节点上，现在只是刚把前期勘探工作基本做完了，下一步转成采矿权， 然后开工报告等各种审批陆续进行完以后开工建设，建设周期大概在5到8年左 右。整个资本开支按现在的行情预计在100亿左右。 20.公司今年年初制定了全年生产目标，3季度因减量产生了一定的欠量，这个 欠量在4季度能够弥补回来吗？ 答：年初的计划在执行过程中，因为山西省煤炭市场或生产环境发生了大的变化， 受安全监管影响，产量有好几个月受到影响。接下来只有两三个月时间，只能按 照正常的节奏生产，大幅度回补估计没有可能，首先是不可能超产，因为现在严 守安全底线，超产不可能，所以只能按照正常的产能计划，尽量保持满产，这是 争取的方向。 21.分红这一块，公司对于分红的比例以及态度如何？今年分红比例是跟去年 持平，还是会有一些提升？ 答：公司多年以来分红态度是明确的、积极的，自上市以来每年都保持着分红。 近几年政策和管理层鼓励现金分红多分，公司积极响应，最近几年随着公司效益 的变化，分红比例保持得还是不错的，都在60%以上。今年只能回答保持积极的 分红态度，至于具体分红比例可能还是要根据实现的效益情况和后续资金需求情 况综合来考虑，至少分红积极的态度不会改变。 22.上市公司有报核增的煤矿吗？洗选厂有没有可能合作？ 答：目前了解到的好像没有听说洗选厂合作的情况。上市公司即使报核增，空间 也不是很大。 23.上市公司如果报核增的话，大概有多少产能？ 答：公司现在的产能是4760万吨，每年产量基本上就在这个范围内。公司的矿 井都是成熟、多年运转的正常矿井，按照核增政策的各项条件来看，明显符合条 件或者有大幅度核增产能空间的这种情况比较少。 24.公司第3季度的产量和销量数据有吗？第3季度单独的产量和销量数据能 否介绍一下？ 答：公司前3季度累计原煤产量3147万吨，商品煤销量前3季度累计1683万吨。 第3季度单季原煤产量900多万吨，主要是8月份几个主力矿受到影响；第3 季度单季销量476万吨，比上一个季度也大幅度下滑。 25.怎么看明年焦煤的价格？今年事故发生之后焦煤价格一度涨到2800块钱左 右水平，明年价格的中枢以及可能的趋势大概是什么？ 答：价格受多种因素影响，以下是个人看法。焦煤的稀缺性因素一直贯穿整个阶 段，分煤种分品种来看，一些非主流的煤种、配煤相对市场比较宽松，受进口煤 和替代性的影响比较大。但个别优质的主焦煤非常稀缺，性价比好，价格保持比 较有溢价而且比较坚挺。展望明年或今后一段时间，大的环境下稀缺性不可能改 变，进口受进口政策以及国际局势的影响也不是很稳定，总体上性价比比较好的 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 主流焦煤品种价格保持比较坚挺的状态，非主流的炼焦配煤可能受市场和替代影 响相对宽松一些、受一些影响。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-30T10-49:6e67a0dc64d0": {"id": "post:2026-10-30T10-49:6e67a0dc64d0", "kind": "post", "title": "2026-10-30 10:49", "source_label": "帖子正文", "excerpt": "🤖【力鼎光电】#光学镜头黑马，#成熟O链，#新晋T链，#北美人形全覆盖1、海外深耕二十载：公司长期聚焦海外市场，海外收入占比高达90%；深度耕耘动捕与数采领域20年、机器人光学10余年，全面覆盖北美T、O、1X、Figure及波士顿动力等头部人形机器人矩阵。", "content": "🤖【力鼎光电】#光学镜头黑马，#成熟O链，#新晋T链，#北美人形全覆盖1、海外深耕二十载：公司长期聚焦海外市场，海外收入占比高达90%；深度耕耘动捕与数采领域20年、机器人光学10余年，全面覆盖北美T、O、1X、Figure及波士顿动力等头部人形机器人矩阵。2、特斯拉T链新晋突破：受益于Grok模型能力牵引，特斯拉机器人首次启动光学镜头专项研发；公司近期已完成送样，并正与Optimus研发团队协同开发视觉系统。3、OpenAI成熟O链协同：作为OpenAI投资的1X Technologies协作机器人成熟供应商，全年镜头供应突破万套；依托人形机器人供应链成功平移，已实现向OpenAI人形机器人项目独家送样。4、高盈利与丰厚价值量：作为光学龙头，具备超高盈利能力，机器人视觉净利率突破40%+；单机镜头价值量达400–500元，模组产品更接近1000元。5、绑定数采独角兽：参股深圳具身数据采集独角兽真觉万象，独家供应数采设备镜头，实现底层数据资产的深度绑定。#文字观点", "publish_time": "2026-10-30 10:49", "tags": ["文字观点"]}, "post:2026-10-30T08-31:3d56fdd44641": {"id": "post:2026-10-30T08-31:3d56fdd44641", "kind": "post", "title": "2026-10-30 08:31", "source_label": "帖子正文", "excerpt": "【朗信电气】Figure机器人电机核心独供，携手银轮全面开拓北美市场 公司是国内少数实现人形机器人关节电机实质性批量供货的厂商，已连续三代向Figure批量供应无框力矩电机，产品覆盖机器人躯干、手臂、脚部及手指关节。26H1机器人业务收入约1200万元，预计全年达到3kw-4kw，2027年有望进一", "content": "【朗信电气】Figure机器人电机核心独供，携手银轮全面开拓北美市场 公司是国内少数实现人形机器人关节电机实质性批量供货的厂商，已连续三代向Figure批量供应无框力矩电机，产品覆盖机器人躯干、手臂、脚部及手指关节。 26H1机器人业务收入约1200万元，预计全年达到3kw-4kw，2027年有望进一步增长至1—2亿元；空心杯电机及微型风扇也已进入送样阶段。 作为银轮的子公司，随着Figure量产节奏加快，朗信有望凭借北美机器人核心供应链卡位，全面开拓至其他头部厂商。#文字观点", "publish_time": "2026-10-30 08:31", "tags": ["文字观点"]}, "post:2026-10-30T11-09:e26c6407be2c": {"id": "post:2026-10-30T11-09:e26c6407be2c", "kind": "post", "title": "2026-10-30 11:09", "source_label": "帖子正文", "excerpt": "【美的集团】2026三季报要点 （一）整体业绩：2026Q3营收1,073.2亿元（-4.1%），归母净利润149.5亿元（+25.9%），扣非归母净利润91.9亿元（-15.7%）。1）收入略承压主要系ToC家空和与工业技术下滑，ToC外销和ToB业务增长稳健 2）扣非净利润增速较低主因扣非口径剔", "content": "【美的集团】2026三季报要点 （一）整体业绩：2026Q3营收1,073.2亿元（-4.1%），归母净利润149.5亿元（+25.9%），扣非归母净利润91.9亿元（-15.7%）。 1）收入略承压主要系ToC家空和与工业技术下滑，ToC外销和ToB业务增长稳健 2）扣非净利润增速较低主因扣非口径剔除长期股权投资收益（长鑫股权贡献几十亿级别投资收益）、汇兑对冲资产收益 3）实际经营利润中单位数下滑，与收入降幅基本匹配 （二）分业务拆分： 1）ToB业务： •单Q3：整体收入高单位数增长，外销增长15%以上。 ①楼宇科技高单位数增长，聚集AI算力温控核心赛道，发布新一代双转子异速磁悬浮压缩机，自研磁悬浮CDU落地阿里云CUBE5.0架构，入选英伟达MGXAIFactory生态 ②工业技术下降10%以上，数据中心和储能热管理零部件已突破国内头部客户，积极拓展海外市场；投建顺德机器人零部件研发制造基地扩充减速机、伺服电机及人形关节模组产能 ③库卡内销增长15%以上，④其他业务受瑞科并购带动收入翻倍。 2）ToC智能家居业务： •单Q3：整体收入高单位数下滑；内销下降15%以上，外销中单位数增长。 ①内销：公司取消冷年开盘，部分发货将顺延至Q4和明年，有错期影响。其中家用空调收入下滑15%以内（内销下滑20%以上），冰洗整体中低单位数下降（内销降约20%、外销增15%以上）厨电及小家电低单位数下降。 ②外销：欧洲为第一大外销市场（占比超27%），其次是亚太（近25%）、北美（超23%）、南美（超13%），非洲占比超6%已超过中东。单三季度外销增长加速：南美增30%以上、非洲增近50%、亚太增20%以上、欧洲增10%以上，中东恢复中单位数增长。 •前三季度：整体微幅增长；内销低单位数下降，外销中单位数增长。海外收入中OBM占比超50%，OBM业务前三季度增速超17%、单三季度增长20%以上 （三）费用与盈利 ①2026Q3公司毛利率26.0%（-0.5pct），主要受原材料价格上涨影响，Q3已通过美云销渠道启动空调提价，同时大幅收缩华凌低端产品出货，向内销产品结构优化调整；期间费用率16.3%（+1.1pct）；其中销售/管理/研发/财务费用率分别为8.1%/3.6%/3.8%/0.8%，同比-0.6/+0.2/持平/+1.5pct，财务费率提升较多，主要为汇兑损失。 ②综合影响下，公司Q1-Q3/Q3归母净利率为11.3%（+0.8pct）/13.9%（+3.3pct），扣非净利率为7.8%（-2.4pct）/8.6%（-1.2pct）。 （四）四季度展望：外销增长确定性强，内销仍承压，需持续观察。整体收入预计可实现增长；利润端受并购项目等影响，存在一定不确定性。 （五）DTC深化变革（取消冷年开盘） 1.影响周期：对收入、利润、现金流的阶段性影响主要集中在2026年Q3-2027年Q1，2027年Q2后影响逐步消除，经营现金流将恢复至净利润的1-1.2倍正常区间。 2.库存进展：7月启动清库存，空调提货比例仅25%-30%；9月回升至70%，四季度将进一步提升，库存健康后逐步恢复补库。 3.变革目标：建立领先行业2-3年的效率优势，通过降库存、提周转实现长期利润增益。 4.核心动作：推进一盘货共享库存；排产逻辑从经销商订单转向终端零售预测，同步精简SKU；高线市场1.4-1.5万家门店已实现直供直营，取消运营商模式。 （六）股东回报 ①2026年公司已完成回购133亿元，其中118亿元属于65-130亿元的注销式回购方案，后续预计按上限完成并全部注销 ②2026年每股分红绝对额、分红+回购总回报强度保持稳定，当下公司综合股息率超过7%#文字观点", "publish_time": "2026-10-30 11:09", "tags": ["文字观点"]}, "attachment:files/机器人行业突然走强！行情背后机会怎么看？20261029.pdf": {"id": "attachment:files/机器人行业突然走强！行情背后机会怎么看？20261029.pdf", "kind": "attachment", "title": "机器人行业突然走强！行情背后机会怎么看？20261029", "source_label": "其他", "excerpt": "机器人行业突然走强！行情背后机会怎么看？", "content": "机器人行业突然走强！行情背后机会怎么看？20261029 要点总结 1.机器人产业经历三个发展阶段，当前处于具身智能产业化冲刺期：第一阶段为工业机器人规模化应 用（上世纪五六十年代起，以瑞士ABB、德国库卡等为代表，中国企业以跟随学习为主）；第二阶段 为服务机器人探索期（2010年前后起，扫地机器人、无人机等涌现，国内优秀企业占据全球重要地 位）；第三阶段为具身智能与人形机器人产业化阶段，自2021年特斯拉Optimus发布以来，从概念 展示走向工程验证和小批量试产，2025年具身智能首次写入政府工作报告。 2.具身智能是\"给AI大脑装上手脚\"的技术：通过感知真实物理世界、理解物理规律并做出决策和执行 动作，最终载体包括四足机器人、轮式机器人、机械臂等，其中最受关注的是人形机器人。据中国信通 院报告，国内人形机器人整机制造企业已超140家，发布产品超300款，头部五家中国企业合计占全 球整机出货量超70%。 3.2026年产业加速从量产走向常态化部署：工信部与国资委2026年6月联合印发人形机器人与具身 智能实景实训专项行动通知，目标2026年底在代表性场景形成100多个高价值应用场景，带动万台级 别规模化落地能力。中国人形机器人出口和智造占全球比例达97%，整机量产、全产业链配套及产品 验证具备系统性优势。 4.产业面临四方面结构性挑战：一是高质量真实场景训练数据缺口，数据孤岛问题持续；二是高端零 部件短板，RV减速器、触觉电子皮肤、高灵敏度力觉传感器、具身专用算力芯片等仍有待突破；三是 从演示到常态化使用的跨越，工厂作业对稳定性、耐久性、连续运行要求远高于展会演示；四是成本与 收益平衡，大规模替代人工的经济性临界点尚未到来。 5.产业规模数据可观：2025年全球人形机器人市场规模约160多亿元，国内占约50%份额，为全球 最大单一市场；2024年工业机器人产量累计超55万台，同比增长10%以上。政策层面，北京提出 2027年突破不少于1000项关键技术、培育千亿级产业集群，上海提出产业规模突破500亿元目标， 全国超20个城市出台专项发展计划。 6.产业链分上中下游三层：上游为核心零部件与关键技术（减速器、伺服电机、控制器、传感器、丝 杠等），技术壁垒最高，减速器约占整机成本30%；中游为整机与系统集成（工业机器人、人形机器 人、服务机器人等）；下游为应用场景与终端用户（汽车制造、3C电子、金属加工、物流、医疗康 复、家庭服务等）。投资上关注核心零部件国产替代进程及中游整机企业技术突破与落地。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 7.国证机器人产业指数（980022）高度聚焦人形机器人产业链：基日2014年底，基点1000点， 2025年4月编制方案修订后成分股由100只调整为50只，聚焦度显著提升。行业分布上工业机械制 造占比超56%，可选消费约23%（主要为消费级机器人），计算机电子信息约19%。前十大权重集中 于减速器、伺服系统、传感器与整机集成四个领域，是A股人形机器人纯度最高的主题指数之一。 8.指数历史表现亮眼但波动显著：自2014年底至2025年收盘（1911.72点）累计涨幅近92%，同 期沪深300全收益涨幅约69%，超额收益二十多个点，年化约10%；2025年全年涨幅约37%，大幅 跑赢沪深300（约15%）和创业板指。但历史最大回撤超70%，年化波动率远高于主流宽基。2026 年7月单月急跌超20%，当前指数已从年内高点2946点左右回落约30%，估值压力得到一定释放， 但整体仍处历史相对高位区间。 9.指数投资价值体现在四方面：政策红利明确（国家战略背书、多部委产业支持）；编制聚焦度高、 龙头含量高（50只成分股集中于核心赛道，前十大权重多为细分龙头）；产业处于成长早期、空间大 （2030年具身智能市场规模有望达千亿级，较当前百亿起点有约十倍成长空间）；与沪深300、创业 板指等宽基相关性适中偏低，可作为组合卫星配置优化风险收益特征。 10.需重点关注四类风险：估值风险（当前处历史中位偏高水位，产业进展低于预期时杀估值可能剧 烈）；技术进度不确定性（技术路线尚未完全收敛，规模化落地时间可能长于市场预期）；高波动性 （历史多次出现30%以上大幅回撤，风险承受能力有限或持有期短的投资者需充分预期）；市场情绪 与资金轮动风险（主题投资易受情绪影响，风险偏好下降时高弹性指数调整幅度往往大于宽基）。 （ ） 11.与同类指数对比，国证机器人产业指数弹性更大但集中度风险更高：A股主要机器人指数包括国证 机器人产业（980022，50只成分股，人形机器人含量约90%）、中证机器人（H30590，64只，含 量约70%）、机器人50（50只，含量约80%）。国证机器人产业指数成分股精简、人形机器人纯度 高、弹性更大，更能捕捉主题阶段性行情，但集中度和波动风险相对更高；中证机器人覆盖产业链更 宽，可一定程度平滑波动但人形机器人纯度较低。投资者应根据自身风险偏好和投资目标选择适合产 品，并以更长视角看待高成长主题。 前期准备阶段，产业趋势比较明确。 Q6：机器人产业链的上中下游分别包含哪些环节？ 答：上游主要是核心零部件和关键技术，是整个产业的底座，也是技术壁垒最高的部分，包括减速器 （谐波减速器、RV减速器）、伺服电机、控制器、传感器（力控、视觉等）、丝杠等精密零部件。其 中减速器和伺服电机占整机成本较大比重，减速器约占30%，也是过去几年资本市场最关注的细分领 域。中游是机器人整机与系统集成，负责将上游零部件进行整机集成，形成工业机器人、人形机器人、 服务机器人等不同类型产品，并进行系统层面校准和适配。下游是应用场景和终端用户，涵盖汽车制 造、3C电子、金属加工、物流、医疗康复、家庭服务等各行各业，随着人形机器人技术发展，未来还 将渗透到商业服务、公共服务、科研探索等领域。投资角度上，核心零部件环节的国产替代进程值得关 注，中游整机企业的技术突破和应用落地同样重要。 Q7：有哪些机器人相关指数？重点介绍国证机器人产业指数的情况。 答：今天主要聚焦国证机器人产业指数，由深交所编制，代码980022，简称机器人产业指数。基日为 2014年底，基点1000点，选取业务涉及机器人产业相关技术、零部件及整机的代表性上市公司作为 样本股。2025年4月编制方案修订，成分股数量从100只上限调整为50只，修订后聚焦度更明显， 成分股主要集中在谐波减速器企业、RV减速器企业、工业机器人龙头、伺服系统龙头及传感器企业 等，以国内机器人产业链代表性企业为主。行业分布上，工业机械制造占比超56%，可选消费约23% （主要聚焦消费级机器人代表公司），计算机电子信息约19%。整体高度聚焦人形机器人产业链核心 零部件和整机环节。 Q8：国证机器人产业指数历史表现如何？不同时间段涨跌幅情况怎样？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008vx:WUXL3408 答：自2014年底基日至2025年收盘点位1911.72点，指数累计涨幅近92%，同期沪深300全收益 指数涨幅约69%，超额收益二十多个点，折合年化约10%。但需注意该收益是在较大波动下取得的， 历史最大回撤超70%，波动率远大于大盘指数。2025年全年涨幅约37%，大幅跑赢同期沪深300约 15%的涨幅，也跑赢创业板指，是2025年表现最亮眼的主题行业指数之一，主要受益于人形机器人产 业政策红利集中释放及市场风险偏好抬升。2026年以来经历显著估值消化过程，7月单月急跌超 20%，主要受市场情绪波动、资金行业轮动及前期涨幅过大后的获利了结压力共同驱动。当前指数已从 年内高点2946点左右回落约30%，估值压力得到一定程度释放，近期也有明显反弹，但纵向看整体仍 处历史相对高位区间，后续走势需关注人形机器人产业化落地实际进展、政策持续发力及市场整体风险 偏好变化。 Q9：指数编制方案调整后，成分股构成如何？ 答：2025年4月编制调整后，指数每半年调整一次成分股。截至2026年6月，前十大权重基本集中 在人形机器人核心零部件和工业机器人整机领域，包括减速器、伺服系统、传感器与整机集成四个领 域，恰恰是人形机器人产业链中壁垒最高、最受资本市场认可的方向。可以说国证机器人产业指数是当 前A股市场中人形机器人纯度最高的主题指数之一。（ ） Q10：如何看待该指数的投资价值？ 答：从积极因素看有四方面。第一，政策红利明确，产业发展有国家战略背书，具身智能首次写入政府 工作报告，多部委联合出台产业支持政策，不是短期主题炒作，而是有长期制度保障的产业方向，有助 于加速核心技术攻关和商业化落地。第二，指数编制聚焦度更高、龙头含量更高，修订后50只成分股 高度集中于人形机器人核心赛道，前十大权重股大部分为细分领域龙头，长期看龙头企业技术积累和竞 争力更强，在产业成长中更大概率受益。第三，产业处于成长早期，未来空间大，2030年具身智能市 场规模有望达千亿级别，较当前百亿起点有约十倍成长空间，复合增长率较高，指数化投资可帮助投资 者相对高效参与产业整体增长红利，同时分散单一企业个体风险。第四，与沪深300、创业板指等主流 宽基相关性适中偏低，可作为组合卫星配置，有望在一定程度上优化组合风险收益特征。 Q11：该指数投资可能面临哪些风险？ 答：主要有四方面风险需重点关注。第一，估值风险，经历2025年大幅上涨后，截至近期十月份指数 以调整为主，当前估值处于历史中位偏高水位，成长型科技资产估值对股价影响很大，若产业进展低于 预期，杀估值过程可能较剧烈。第二，技术进度不确定性，人形机器人仍处产业化早期，技术路线尚未 完全收敛、多元发展百花齐放，商业化场景 fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 发言人21:49总结一下今天的汇报。首先第一点就是目前物理AI的瓶颈在数据，同时数据也是确定 性，就是各家确定性最强的一个投入方向。在资本开支还有研发费用里面，未来几年都会是一个重点倾 斜的方向。第二点就是易购目前是作为预训练阶段的数据采集的主流路线。我们是重点推荐关注易购采 集设备卖卖铲子的这个环节。然后第三点就是标的，我们重点是推荐像创维数字、奥比中光这些公司， 尤其是会重点推荐有自己的产能。比如说像创维有自己的产能，然后已经形成了规模交付的订单，预计 也是今年会形成规模化的收入。这种公司对，重点推进。以上就是关于物理AI行业的一个汇报，谢谢 大家。 发言人23:06感谢大家参加今天的会议，祝大家生活愉快，再见。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-30T08-39:b796a82db636": {"id": "post:2026-10-30T08-39:b796a82db636", "kind": "post", "title": "2026-10-30 08:39", "source_label": "帖子正文", "excerpt": "微软FY27Q1：Azure增长48%，云与AI商业化持续提速 🔥#整体收入与利润保持较快增长。FY27Q1（即26年7—9），公司营收922.79亿美元，同比增长19%", "content": "微软FY27Q1：Azure增长48%，云与AI商业化持续提速 🔥#整体收入与利润保持较快增长。FY27Q1（即26年7—9），公司营收922.79亿美元，同比增长19%；营业利润459.15亿美元，同比增长21%。剔除OpenAI投资影响后，净利润364.22亿美元，同比增长18%，摊薄EPS为4.89美元。公司预计FY27Q2营收960亿—971亿美元，同比增长18%—19%，营业利润率同比小幅下降。 🔥#Azure加速增长叠加模型服务放量。Microsoft Cloud收入639亿美元，同比增长30%；其中Azure收入331.65亿美元，同比增长48%，下一季度固定汇率增速指引为49%—50%。Foundry客户超过12万，收入增至去年同期三倍以上，其中开源模型收入增至10倍。GPU效率改善、每Token收入提升及CPU闲置容量变现共同贡献增长，需求仍超过可用供给。 🔥#企业AI从座席订阅延伸至按量消费。M365商业云收入同比增长17%，Copilot及E5、E7等高等级订阅推动单用户收入提升。使用按量计费的Copilot客户数季度增长超过75%。公司预计下一季度M365商业云固定汇率收入增长约19%，全年增速继续加快。商业剩余履约义务6770亿美元，同比增长73%，约30%将在未来12个月确认为收入。Microsoft Cloud毛利率为66%，下一季度预计约65%，收入结构向Azure倾斜仍带来压力。 🔥#Capex因产能交付延期而后移。单季Capex452亿美元，含融资租赁，同比增长30%；约75%投向CPU、GPU等短寿命资产，现金购置物业设备393.67亿美元。因第三方产能交付延迟，2026自然年Capex预期由约1750亿美元下调至约1700亿美元。FY27Q2仍预计超过500亿美元，下半财年随CPU、GPU及延期产能交付加速投入。本季自由现金流186.33亿美元，公司预计FY27继续保持正值。 欢迎交流#文字观点", "publish_time": "2026-10-30 08:39", "tags": ["文字观点"]}, "post:2026-10-30T21-13:6b5362057cca": {"id": "post:2026-10-30T21-13:6b5362057cca", "kind": "post", "title": "2026-10-30 21:13", "source_label": "帖子正文", "excerpt": "【正帆科技】Q3归母同环比扭亏，大订单+盈利修复！事件：公司发布26年三季报，Q3业绩： 【营收】16.10 亿元，yoy+26.3%，qoq+27.8%", "content": "【正帆科技】Q3归母同环比扭亏，大订单+盈利修复！ 事件：公司发布26年三季报，Q3业绩： 【营收】16.10 亿元，yoy+26.3%，qoq+27.8%； 【归母】3.22 亿元，同环比扭亏为盈； 【扣非】0.63 亿元，同环比扭亏为盈； 【毛利率】19.5%，yoy+1.5pct，qoq+1.1pct ➡️Q3半导体设备零组件市场需求持续释放，公司收入规模和运营效率持续提升。前三季度公司新签订单57.4亿，同比+74%，较26H1进一步提速，其半导体订单占比76%，OPEX业务新签订单占比62%；随下游CAPEX景气度回升，公司新签订单的数量和质量均有明显改善。 高纯流体系统绝对龙头：大订单+盈利修复！ 高纯流体系统是将高纯气体、湿化学品等供应至工艺机台的厂务系统；公司作为国内绝对龙头，长期服务中芯国际、华虹、长存、长鑫、京东方等头部行业客户； 当前国内Fab建设密集，高纯流体系统需求爆满，随前期签订的低毛利订单陆续完成验收，公司新订单逐渐确收，盈利能力有望突破前高！ 零部件供应紧张、扩产+涨价并行 随着需求旺盛，零部件供应持续紧张，当前处于涨价周期，且未来扩产上修预期强。定价逻辑从需求侧改为产能供给侧。同时，公司产能加速建设，业绩放量在即！ 公司当前布局： 1）Gas Box（鸿舸）：主要玩家UCT、Fujikin、富创精密、正帆科技等；公司Gas Box产品国内领先，已实现对国内头部设备厂商的广泛覆盖及规模化供货。 2）石英件（汉京）：主要玩家贺利氏、信越石英、正帆科技等；公司质地优异，是国内头部石英件供应商，相关产品已进入TEL、KE等设备厂商及头部晶圆厂供应链。 风险提示：下游景气度不及预期；行业竞争加剧#文字观点", "publish_time": "2026-10-30 21:13", "tags": ["文字观点"]}, "attachment:files/欧伦电气2026年三季度业绩交流20261029.pdf": {"id": "attachment:files/欧伦电气2026年三季度业绩交流20261029.pdf", "kind": "attachment", "title": "欧伦电气2026年三季度业绩交流20261029", "source_label": "其他", "excerpt": "欧伦电气2026年三季度业绩交流20261029 要点总结 1.三季度业绩综述与财务要点 会议背景：国联民生证券家电团队（首席分析师管泉森、分析师周振）主持， 公司董事、董秘郑成福与财务总监黄名超参会，对2026年三季报进行解读。收入端：2026年三季度收入整体延续增长态势，但增速较二季度有所放缓。", "content": "欧伦电气2026年三季度业绩交流20261029 要点总结 1.三季度业绩综述与财务要点 会议背景：国联民生证券家电团队（首席分析师管泉森、分析师周振）主持， 公司董事、董秘郑成福与财务总监黄名超参会，对2026年三季报进行解读。 收入端：2026年三季度收入整体延续增长态势，但增速较二季度有所放缓。 三季度本身为传统业务板块的生产淡季，且移动空调、除湿机属传统\"冷冻 年\"收官品类，数据上与二季度的爆发式增长存在季节性偏差。 利润端：单季利润指标表现相对较弱，汇率冲击为最主要拖累。公司在披露 三季报的同时同步出台了汇率管理措施，力求平滑汇率对经营的冲击；管理 层判断汇率属宏观趋势，企业层面以主动平滑为主、难以扭转。 现金流与应收账款：三季报经营性现金流表现亮眼；2026年半年报披露后， 北交所曾就应收账款问题发出问询函，公司回复显示业务回款、现金流情况 良好，管理层将其视为精细化运营的体现。 全年展望：尽管三季度利润端相对承压，管理层维持全年总体表现\"还算不 错\"的判断，并认为四季度及2027年公司的确定性优于一般同行。 2.分业务板块拆解与指引 移动空调与车载冰箱（2026年超预期板块） o移动空调：2026年增长幅度超出公司预期；2026年上半年出口均价已出 现一定幅度抬升（投资者测算口径）。 o车载冰箱：2026年表现同样超预期，新增1条产线已基本到位。 o新品贡献：免排热移动空调为2026年首年销售，定价与毛利均享有相对 老品的溢价；同步推出静音降噪移动空调并于广交会做全球发布，当地 政府平台参与推广。 o扩产准备：移动空调与除湿机合计新增2条产线，年底前已基本完成， 主要为了应对已经可见的2027年订单。 除湿机 o2026年5-6月同比下浮约8个点，通过三季度抢收，已同比转正并走出 增长趋势；具体数字公司将在年报统一披露。 空气源热泵（四大品类中2026年相对偏弱） o2025年基数：热泵单品类营收约1.8几个亿（不到2亿），其中哈尔滨 大项目单项目贡献1个多亿，项目制占比高、渠道及直销占比偏低。 o2026年结构切换：受国内政府端投资收缩影响，项目制业务走弱；渠道 类业务同比实现两位数的大幅增长；全年热泵营收预计高于2025年，但 业务结构已明显转换。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 o四季度催化：根据各事业部反馈，四季度将有数个招标项目落地，公司 正积极参与相关招标，部分招标信息已在公开渠道披露。 新业务板块：除移动空调、除湿机、车载冰箱、空气源热泵四大传统品类外， IDC温控与工业热泵为两个重点培育的新业务方向，三季度各板块均有推进。 3.四季度订单、海外补库与近期催化 订单能见度：四季度全部生产准备工作已就绪，已接到的大型海外订单基本 落实50%以上，超出公司自身预期；已有小部分客户提出提前发货需求，厂 区外贸集装箱提货节奏明显加快，必要时将增加生产班次/加班满足交期。 海外渠道库存：2026年三季度客户走访显示，海外客户年内库存已基本全部 售罄，而往年旺季结束后仓库多多少少有残余存货，今年基本为零库存；公 司据此判断海外处于低库存水位，补库需求确定，当前生产已开足马力。 客户活动催化：公司于2026年10月13日（10月15日广交会开幕前两天） 举办全球客户答谢晚宴，海外客户到厂参观产线、了解产品，并在广交会接 触新品发布，反馈整体非常正向；当前外贸端主要压力在于产能匹配交期。 中期判断：移动空调与车载冰箱四季度及2027年预计仍将有增量贡献。 4.移动空调ODM竞争力与海外市场空间 核心壁垒：研发+成本双轮 o研发设计端：ODM模式下全部研发设计留在欧伦端，2026年推出免排热、 静音降噪两大新品，并持续在降噪、能效、外观层面迭代；公司口径其 制造成本控制在国内同行为遥遥领先水平，叠加品质管理与性价比，构 成海外客户高认可度的基础。 o供应链自制端：公司口径自制率为同行最高，自投两器加工、钣金加工、 注塑塑料件加工车间，核心零部件定制化加工带来品控与交付掌控力； 铜管、铝箔加工及板材剪切喷塑均为自制，报废率、废料率控制亦构成 成本优势来源。 o压缩机外采：除美芝外，亦在钱江压缩机等国内供应商分散采购，按客 户需求与产品性能指标做布局；因自制件占比高，下游供应链与大厂重 合度有限（除压缩机等大件）。 市场空间逻辑 o需求侧：厄尔尼诺现象下欧洲、北美高温天数延长；国外家庭空调拥有 率仍低；分体式空调受安装成本与环境限制；移动空调具备\"消费降级\" 属性——分体空调约几万元vs移动空调约几千元，海外经济偏弱背景 下接受度提升。 o量化判断：公司2026年8-9月完成全球市场实地走访，认为难以给出精 确空间数字，但基于空调低渗透率与消费降级趋势，判断后续需求态势 良好。 o中长期判断：公司内部判断移动空调未来3~5年仍为增量市场，日本已 出现路边烧烤摊等新应用场景，产品端还将持续优化以解决客户痛点。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 海外区域结构 o欧洲为第一大区域；日韩+东南亚位列第二，市占率长期稳定；北美直接 出口占比排第三（部分经国内贸易商间接出口），整体规模并不明显弱 于欧洲。 o核心客户：日本爱丽丝等大客户、韩国SK、乐天等，日韩市场需求量历 年均较稳定。 o外贸团队配置：除湿机+移动空调为同一外贸团队（约80-90人），车载 冰箱独立团队（约10余人），热泵外贸团队为2026年新组建（约10余 人）；除湿机移动空调团队内部分组但不锁定固定国别，以客户服务为 核心，业务员在货船离港后仍配合客户完成清关及售后技术对接，获海 外客户高度评价。 毛利率结构：客户属性>地区差异 o新品首发年份享有明确溢价与更高毛利，老品则普遍面临年降压力。 o分国家看毛利差异不大，与客户类型高度相关：拥有自有知名品牌、线 上+线下兼备的客户（如公司欧洲前十大客户中某英/德品牌客户）毛利 偏高；纯线上、品牌定位偏终端的客户议价空间弱、毛利偏低；单客户 采购量大小亦影响议价能力。 o受原材料价格波动影响，公司在2026年及2027年与客户的洽谈中包含 适当的提价安排。 5.客户拓展与竞争格局 新客户拓展 o2026年新开发客户包括法国欧尚（管理层口径为\"应该是今年开发\"）、 安达屋（“可能也是今年开发”）；同时在接洽一家全球最高端的家电 品牌客户，公司对达成合作较有信心。 o国内层面：与美的的业务合作已在招股书中披露；另有一家国内高知名 度品牌已洽谈多轮，因对方自身股权投资问题暂存障碍，但该客户 维持正向 预期。 问答整理 1.公司三季度各业务板块的增长情况如何？对于移动空调、除湿机、车载冰箱、 空气源热泵四大品类，全年维度分别有怎样的展望？ 答：除湿机板块在半年报时有约8个百分点的同比下浮，三季度已经转正并实现 增长，具体数字将在年报时统一披露。四大类产品中，空气源热泵全年表现相对 较弱。去年热泵品类大概实现了1.8亿多元的营收，其中哈尔滨一个大项目就占 了1个多亿。今年受国内政府端投资的影响，项目制业务有所影响，但渠道类热 泵业务同比有两位数的较大增长，且四季度预计会有几个项目落地。移动空调和 车载冰箱今年增长幅度超出预期，表现较好。 2.公司四季度移动空调和车载冰箱的订单情况如何？是否存在客户提前下订 单或提前发货的现象？车载冰箱是否有新的突破？ 答：移动空调和除湿机今年年底增加了2条产线，目前已基本完成；车载冰箱增 加了1条产线，也基本到位。四季度所有的生产准备工作基本就绪，已接到的大 订单基本能落实到50%以上，超出公司自身的预期。目前有小部分客户有提前发 货的需求，公司工厂厂区已经明显忙碌起来，外贸集装箱提货的也明显增多。今 年10月13日公司在广交会前举办了全球客户答谢晚宴，来了很多国外客户，参 观了工厂并了解了新品发布情况，反馈非常正向。这两类产品不止四季度，预计 明年还会有一定的增量。 3.公司在海外移动空调ODM模式下的核心优势是什么？整个市场空间有多大？ 公司主要布局哪些海外市场？ 答：移动空调ODM的核心优势在于两个方面：第一是产品研发端，移动空调所有 的研发设计都在欧伦端完成，公司每年在新品上的投入比较大，今年研发推出了 免排热移动空调和降噪静音移动空调，并在广交会上做了全球发布；第二是制造 端成本控制，欧伦自认为在国内同行中属于遥遥领先，在性价比和品质管理方面 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 得到了国外客户的高度认可。关于市场空间，得益于全球环境温度波动较大、高 温天增多，且欧洲、北美家庭空调拥有率较低，分体空调安装存在成本和环境限 制，移动空调具备消费降级属性，几千块钱即可购买，因此采购比例还会上升。 今年三季度走访客户时发现，国外客户的仓库库存基本都已经销售完毕，往年旺 季过后或多点存货，今年基本没有存货了，这是比较好的状态。关于海外市场布 局，按区域划分第一大区域是欧洲，但北美销售并不弱于欧洲；排在第二的是日 韩和东南亚市场，市场占有率一直比较稳定，与日本几个大牌、韩国SK、韩国 乐天、日本爱丽丝等大客户每年都有不错的表现。日本还出现了移动空调在路边 烧烤摊等新应用场景。公司认为未来3至5年内移动空调仍然是一个增量市场。 4.公司每年推出的新品在海外市场是否有溢价能力？出口到不同国家和地区， 毛利率是否存在差异？产品均价是否有抬升？ 答：新品在定价方面相对于老品肯定是有溢价的，因为新品在技术上做了迭代或 提升，比如免排热空调是今年第一年在销售，在价格和毛利方面都会有溢价。关 于销售到不同国家的毛利差异，其实跟地区和国家的关系并不大，主要跟客户类 型关系更大。例如有些客户是纯做线上的，有些是做卖场的，有些是自己有连锁 渠道的，有些是在国外有较高知名度的品牌，这些客户对产品生产和品管的要求 更高一些，相应的毛利率也会表现得更高。提价与客户类型有关，例如欧洲地区 某个非常知名的大品牌客户，线上线下都有，是公司前十大客户之一，其毛利率 就偏高一些；而纯做线上或者当地品牌定位偏终端的客户，议价过程中毛利率会 偏低一些。此外，客户采购量的大小也会对毛利率有所影响。 5.公司在中长期比较看好哪些市场？近一年是否有比较明确的新增大客户落 地节奏，以及新切入客户的预期？ 答：每个事业部在做年度规划目标和3到5年规划目标时，都会针对客户群体做 分析。今年开发了法国的欧尚、安达屋等客户。公司目前正在接触一个全球非常 知名的、应该说是最高端的家电品牌客户，公司在接洽过程中还是非常有信心能 够谈成合作。国内方面，公司此前招股书披露过与美的的业务合作，除美的以外， 也在跟另一个知名度非常高的品牌谈合作，已经谈了很多轮，该客户认可欧伦产 品的性价比、质量稳定性和交付一致性，但其自身因股权投资问题还存在一些障 碍。客户的开拓需要一些时机，公司对最优客户有清晰的目标，每年都在跟踪推 进。 6.公司年报中是否能对客户结构做更结构化的披露，例如新增优质大客户、一 线或几线品牌客户与线上客户等，以便投资者更清晰地进行估值？ 答：公司在招股书的一轮反馈中曾披露过新进客户和淘汰客户的信息。虽然季报 和半年报制作的时间有限，详细统计有一定难度，但公司会把投资者的建议带到 今年的年报里面，在年报中做一个详细披露，包括今年新开拓了哪些大客户、存 量客户的优质程度等信息。 7.针对海外库存处于较低水位的情况，公司是否已针对海外补库存预期做提前 准备？新增产能的投产节奏及明年和2028年的产能规划是怎样的？ 答：公司现在已经开足马力在生产，已经为海外补库提前做了准备。产能方面， 除湿机和移动空调增加了两条产线，主要是为2027年的订单做准备；车载冰箱 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 新增了一条产线。针对2028年的规划，公司会结合2027年的销售情况、客户反 馈和订单情况再做布局。公司前两天刚公告拿了一块159亩的工业用地项目，今 年会尽快开工，建设欧伦电气四期工厂，规模为27万方，因为现有的生产场地 已经比较局限，产线增加已经没有空间。同时，今年为了2027年的准备，公司 还租赁了一部分外部厂房来维持运转，等新工厂建完后，整个产线和产品都会得 到优化，交付能力将得到很大提升。此外，除湿机和移动空调可以在同一条产线 上生产，生产除湿机的产能会高于移动空调，且目前生产交付存在加班加点的情 况，所以难以按照标准产线测算具体产出数量。 8.公司拿到了美的的订单，但在海外及国内与美的也存在竞争关系。为什么美 的在移动空调和除湿机领域不采用自产而选择给欧伦下订单？未来在海外空调 与除湿机竞争中，公司是否会直面美的、海尔等大厂的竞争影响？ 答：公司不认可欧伦与美的、海尔是竞争对手的观点，实际上与美的、海尔等行 业内企业之间的合作关系都很好。首先，除湿机和移动除湿机的国家标准 GB19411就是由欧伦牵头起草的，各行业单位都参与其中，公司有小家电加工优 势，而美的、海尔有品牌溢价优势。除湿机和移动空调属于多品类产品，单个订 单量不会特别大，对于美的、海尔、海信等企业来说，组织生产的灵活度和产线 柔性可能不具备优势，而欧伦深耕除湿机和移动空调行业多年，打造了自己的核 心竞争力。去年美的芜湖工厂的总经理、技术老总等5位管理层来欧伦工厂参观 研讨，双方的目标是一起生产出最优的产品来满足客户需求。美的来下单，最终 贴的是美的品牌而非欧伦的品牌。海尔也有在欧伦做OEM，海尔自己不去做这个 产品，说明这个单品类的生产复杂度相对较高，大厂不一定愿意大量投产扩产。 此外，美的也在投入IDC业务并成立了IDC事业部，欧伦也组建了IDC队伍，但 这些不至于形成直面的竞争，客户会综合对比专业生产厂家的品质交付一致性和 性价比做出选择。公司还认为，国产品牌开拓海外市场非常困难，这也是欧伦坚 持以ODM为主的主要原因。公司坚持做自己最擅长的研发设计和生产加工，让自 己的制造端做得比大厂更好，大厂愿意来欧伦做OEM和ODM就可以了。 9.公司与美的及其他友商在供应链方面，以及与传统分体式空调的供应链重合 度如何？与大厂相比，欧伦在生产端是否仍然具备优势？ 答：欧伦在除湿机和移动空调方面，自制率应该是国内最高的，这是公司能做到 性价比最优的一个很大优势。公司自己投了两器加工车间、钣金加工车间和注塑 塑料件加工车间等，核心零部件都自主定制和加工，因此在产品品控和交付方面 有很好的掌控能力。与外部采购相比，这些自制投入非常有竞争力，对盈利贡献 不错。在压缩机等大件方面，公司的采购渠道会更广，并不集中依赖某一家供应 商，比如除了美芝之外，还会采购杭州就近的钱江压缩机等，根据客户需求和产 品性能指标做布局。由于很多件是自制的，供应链上的重叠度不会很大，除了压 缩机等几个大件以外。公司在铜管、铝箔、板材剪切喷塑等环节也都自己完成， 因此自制率相比同行会更高一些，生产端优势明显。 10.公司在欧洲、日韩、东南亚、北美等海外地区的外贸团队配备情况如何？ 各个团队人数和核心人员配置是怎样的？ 答：公司的海外出口团队分为三块：除湿机和移动空调是整体一个团队，该团队 人数约80到90人；车载冰箱有单独的海外出口团队，约10来个人；热泵今年 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 又组建了一个外贸团队，也大概10来个人。除湿机和移动空调的外贸团队内部 按组别划分，但各组针对的国家或客户并不固定，可能同时服务欧洲、日韩或美 国客户，以服务好各自客户为主。外贸团队从客户的选样、送样检测、下单发货、 发货前验货、报关，到协助客户在目的国清关等全流程提供服务，有多个客户向 公司管理团队反馈认可业务员的服务，即使按OBM形式船离港后理论上与公司无 关，业务员仍会协助客户在国外海关处理清关及其他售后技术对接工作。车载外 贸团队和热泵外贸团队也都在学习原有优秀团队的经验，努力把客户服务好。 11.移动空调和除湿机的外贸出口业务是否存在价格竞争的风险？公司如何应 对行业价格内卷？ 答：行业肯定是卷的，老品方面必然会被卷，但公司通过出新品来应对，每年投 入新品研发，老品也会通过技改寻找降本空间。今年因为原材料价格波动，以及 明年跟客户洽谈时，都做了一些适当的提价。同行之间的价格内卷确实不可避免， 关键在于技术上要有一些领先。 12.公司IPC温控业务目前有哪些进展？CPU液冷产品的最新认证进展和订单情 况如何？与行业现有玩家相比，公司在这一领域的竞争优势是什么？ 答：CPU液冷产品本月已送到通用所进行认证证书的检测，预计11月份拿到认 证证书。温控业务目前有单体设备的客户采购，但采购量不大，重大突破仍在洽 谈中，有保持联系。竞争优势方面：第一是团队优势，研发团队负责人自称是全 球首台CDU液冷设备落地的整个研发设计者；第二是公司在精密空调领域8月底 已拿到认证证书，三方检测数据表现非常优异；公司坚决投入该领域，将其作为 未来的增长点来培育。公司策略是先将产品打磨好，目前PUE指标方面，技术负 责人表示大概能做到1.1几甚至1.1以内，远优于当前国家收紧的对1.2以上项 目进行窗口指导的标准要求，能够帮助数据中心解决能耗问题，客户自然而然会 有需求。 13.公司目前进入北证50是否有相应的预期？ 答：每个企业都希望自己更优秀，公司也希望进入北证50。公司认为二级市场 的估值不是企业能够左右的，企业能做的就是认认真真把业务和产品做好、把客 户服务好、把公司运营好。公司的目标首先是希望能够进入北证50，也希望能 够把市值做得越来越大，助力公司未来的发展。董办始终坚守的目标是：第一， 合规性摆在第一条；第二，配合公司用好上市公司平台，助力企业发展。公司今 年热泵渠道增长不错，IPO上市对公司在国内推自主品牌是一个很大的加分项。 美的也是公司非常值得学习的对象，公司一直在向格力和美的等企业学习。证监 会10月份也阐明了鼓励北交所的政策，公司希望能够让自己变得更加优秀。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-30T08-41:e8cba7753cd9": {"id": "post:2026-10-30T08-41:e8cba7753cd9", "kind": "post", "title": "2026-10-30 08:41", "source_label": "帖子正文", "excerpt": "安克创新26Q3业绩点评：Q3扣非利润同增61%，新品持续迭代业绩： #按整体看，2026Q1~3公司实现营收261.40亿元/同比+24.36%，归母净利润22.61亿元/+16.97%，扣非归母净利润22.79亿元/+53.72%。#按单季度看，单Q3营收95.35亿元/+16.96%，归母净利", "content": "安克创新26Q3业绩点评：Q3扣非利润同增61%，新品持续迭代业绩： #按整体看，2026Q1~3公司实现营收261.40亿元/同比+24.36%，归母净利润22.61亿元/+16.97%，扣非归母净利润22.79亿元/+53.72%。 #按单季度看，单Q3营收95.35亿元/+16.96%，归母净利润5.59亿元/-27.04%，扣非归母净利润8.40亿元/+61.23%。单季非经常性损益为-2.82亿元，主要受到参股（南芯科技）投资公允价值变动损失影响；扣非利润增长体现主营盈利改善。业务：三大板块迭代新品，储能及家庭智能拓宽应用场景。 1）充电储能：9月推出安心充Smart+屏显充电器及MagGo 2 Pro磁吸充电宝，持续升级设备识别、功率管理和控温能力；IFA发布Solarbank Max阳台光储系统，支持最高10kWp光伏输入，电池容量由7kWh扩展至42kWh，并引入基于天气、电价及家庭用电信息的充放电调度，该产品于10月在欧洲开售。 2）智能创新：9月3日IFA发布家庭本地AI中枢MindBase，连接安防、清洁、储能等设备；扫地机Omni E35于9月在欧美开售，创意打印与母婴产品矩阵继续完善。 3）智能影音：自研Thus AI音频芯片应用拓展至耳夹式及头戴式耳机，8月推出Nebula X1S投影仪。渠道与品牌：线下增长较快，统一品牌增强跨品类展示。2026Q3境外/境内收入分别约90.62/4.74亿元，同比+14.6%/+92.2%；线上/线下收入分别约60.29/35.07亿元，同比+5.4%/+44.2%，线下增速较上半年明显加快。其中，官网收入约11.71亿元，同比约+49.6%，延续较快增长。9月公司宣布“One Anker”品牌归一战略，并在柏林开设德国首家直营门店，以统一品牌和场景化陈列展示充电、安防、影音及储能等产品。财务：毛费均有优化，公允价值变动扰动归母利润。 1）毛利端，单Q3毛利率46.02%/同比+1.42pct； 2）费用端，26Q3销售、管理、研发、财务费用率分别为20.60%/3.30%/10.30%/0.38%，同比-2.36/+0.02/+1.08/-0.28pct，合计期间费用率34.57%/-1.54pct。研发费用增加系研发项目及投入增加，以及研发人员薪酬增加。 3）其他：26Q3公允价值变动收益-3.47亿元，主要系持股南芯科技股价波动所致（根据半年报，安克持有南芯1463万股，按此折算Q3共计亏损-3.58亿元）；26Q3资产减值损失-0.42亿元/上年同期-0.53亿元。 4）26Q3归母净利率5.86%/-3.53pct，扣非归母净利率8.81%/+2.42pct。 5）现金流方面，单Q3经营活动现金流净额为-3.45亿元，上年同期为+2.67亿元；主要系旺季前备货及采购规模增加。#文字观点", "publish_time": "2026-10-30 08:41", "tags": ["文字观点"]}, "post:2026-10-30T09-33:40b53ce1758b": {"id": "post:2026-10-30T09-33:40b53ce1758b", "kind": "post", "title": "2026-10-30 09:33", "source_label": "帖子正文", "excerpt": "🇺🇸【申万策略】日观美股 20261030 美股结构分化，科技硬件与AI链条重挫，防御周期与顺周期消费逆势走强指数方面：今日美股结构分化加剧，价值显著优于成长，小盘跑赢大盘。标普500指数下跌0.30%，纳斯达克综合指数下跌1.38%，道琼斯工业指数微跌0.25%，罗素2000指数逆势上涨1.01%", "content": "🇺🇸【申万策略】日观美股 20261030 美股结构分化，科技硬件与AI链条重挫，防御周期与顺周期消费逆势走强指数方面：今日美股结构分化加剧，价值显著优于成长，小盘跑赢大盘。标普500指数下跌0.30%，纳斯达克综合指数下跌1.38%，道琼斯工业指数微跌0.25%，罗素2000指数逆势上涨1.01%。宏观层面，美国三季度实际GDP年化季环比增长3.4%创一年新高、商业投资大增12.7%，9月核心PCE同比升至3.1%，基本面韧性与通胀黏性推升紧缩预期；微观层面，Alphabet因搜索不及预期及自由现金流骤降重挫13%（市值蒸发4790亿美元），叠加盘后亚马逊EPS下滑、英特尔因指引远逊预期暴跌超20%，市场对AI巨额Capex的ROI回报分歧加剧，通信服务（-6.6%）与半导体成长板块大幅回调。 🕐结构方面：AI产业链软硬件端全面承压，资本开支与算力硬件跌幅靠前。AI资本开支方下跌3.92%，AI硬件下跌3.85%，AI软件高壁垒组合下跌2.82%，仅AI相关制造业小幅收涨0.24%。低估值与避险风格明显占优，信用压力组合大涨3.65%，利率敏感组合上涨2.10%，而高贝塔风险偏好组合微跌0.62%。消费相关组合全面爆发，顺周期与高端消费弹性充分释放，可选消费大涨2.91%，服务消费上涨2.25%，商品消费上涨2.23%，必需消费上涨1.70%；层级维度上，高收入消费领涨3.19%，中产消费上涨2.98%，低收入消费上涨2.21%。传统制造业大涨2.65%，表现大幅领先于AI相关制造。整体来看，信用压力、高收入消费与传统制造相对强势，AI资本开支方与AI硬件表现低迷。 ⚡️波动率方面：大盘恐慌情绪边际抬头，指数与个股走势呈反向收敛。指数隐含波动率（VIX）上升0.29个波动率点至17.20，显示大盘Beta端系统性避险诉求有所提升；个股隐含波动率（VIXEQ）大幅下行1.67个波动率点至40.15，二者差值收窄1.96至22.95，市场逐步从个异性博弈转向系统性风格切换。尾部风险方面，SKEW指数上涨2.29个指数点至151.03，下行极端尾部风险定价边际抬升。截至10月28日，全市场总PCR录得0.90，较10月27日下降0.03。 联系人：申万策略全球资产配置团队#文字观点", "publish_time": "2026-10-30 09:33", "tags": ["文字观点"]}, "attachment:files/慕思股份2026Q3业绩交流及经营跟踪20261029.pdf": {"id": "attachment:files/慕思股份2026Q3业绩交流及经营跟踪20261029.pdf", "kind": "attachment", "title": "慕思股份2026Q3业绩交流及经营跟踪20261029", "source_label": "其他", "excerpt": "慕思股份2026Q3业绩交流及经营跟踪20261029 要点总结 1.2026Q3核心财务数据：单季收入利润承压，毛利率受原材料涨价拖累，费用 管控成效初现 单季收入与利润：2026Q3实现营业收入12.2亿元，同比下降4.83%；归母 净利润5578.9万元，同比下降46.97%", "content": "慕思股份2026Q3业绩交流及经营跟踪20261029 要点总结 1.2026Q3核心财务数据：单季收入利润承压，毛利率受原材料涨价拖累，费用 管控成效初现 单季收入与利润：2026Q3实现营业收入12.2亿元，同比下降4.83%；归母 净利润5578.9万元，同比下降46.97%；扣非净利润5001万元，同比下降 38.25%。 利润下滑归因（两项叠加）： o毛利额减少6200万元：系收入下降与毛利率下行共同所致。 o资产处置损失同比增加1100万元。 费用端边际改善：Q3销售费用同比下降3.8%，销售费用率同比上升0.35个 百分点但增幅环比收窄；其中7、8、9月销售费用率已实现环比下降。管理 费用同比下降3.77%，研发费用同比增长9.56%。 资产负债率：截至报告期末为42.49%，同比下降0.13个百分点。 2026Q3分产品收入与增速： o床垫：6.55亿元，同比下降0.7%。 o床架：3.37亿元，同比下降12.65%。 o沙发：0.61亿元，同比下降29.40%。 o床品：0.75亿元，同比增长23.90%。 收入下滑的结构性原因：①主动管控投流费用导致电商业务下滑；②酒店工 程业务收缩带动直供业务下滑；产品端主要由床架和沙发承压所致。 2026Q3分渠道收入与增速： o经销：9.51亿元，同比增长2.41%（核心基本盘保持正增长）。 o电商：2.10亿元，同比下降18.83%。 o直供：0.20亿元，同比下降36.96%。 o直营：0.29亿元，同比增长4.65%。 2026Q3分区域表现：境内收入11.53亿元，同比下降5.07%；境外收入0.68 亿元，同比下降0.54%。 综合毛利率：Q3为50.80%，同比下降2.38个百分点，主要受原材料成本涨 价影响。 分产品毛利率：床垫59.74%、床架48.52%、沙发25.16%、床品44.45%。 期间费用绝对值（2026Q3）：销售费用3.98亿元（同比下降3.79%）、管理 费用0.84亿元（同比下降3.77%）、研发费用0.67亿元（同比增长9.56%）。 2.AI战略业务：核心增长引擎，Q3维持近翻倍增长，全年5亿目标确认不变 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2026年1-9月AI产品收入3.46亿元，同比增长92.45%；其中Q1-Q3累计 收入3.5亿，同比实现近100%增长；公司测算截至Q3已达成全年目标中的 3.5亿，内部进度达预期。 全年AI收入目标维持5亿元不变：管理层、经营层及终端导购层对目标完 成均有信心；海外AI收入贡献亦为增量支撑。 中长期目标：希望AI产品占公司整体营业收入比例达到20%至30%，对实现 该销售占比目标有信心。 AI产品结构拆分（3.46亿口径）： oT系列占比约65%，鸿蒙系列占比约35%。T7等中高价位产品仍为贡献大 头，验证消费者愿意为技术壁垒更强的产品买单，并非仅偏好低价带产 品。 产品价格带定位： oT系列：约3万元左右，定位更高端市场。 o鸿蒙系列：9000元至2万元区间，主打相对亲民价格带。 AI产品毛利率分层： oT系列毛利率约60%左右。 o华为鸿蒙合作款毛利率约45%左右。 o轻智能产品毛利率介于鸿蒙系列与T系列之间；轻智能暂不计入核心AI 产品口径。 AI产品构筑壁垒的核心能力： o全栈自研：覆盖算法、数据、模型、传感，为行业唯一具备全部要素自 研的龙头公司。 o落地“数字人体与智慧睡眠创新联合体”，与三甲医院及高校合作，强 化传感、算法、模型、数据全栈体验能力壁垒。 o联合体未来3年技术路线围绕AI产品的技术功能、慢病诊断、大健 司了解，其门店建设相对较慢，目前知道在深圳有门店，尚未在全国广 泛铺设，从线下门店和同行交流来看，没有看到非常快速的销量爬升。公司也会 参考ASleep做得好的经验，例如床垫与空调、床垫与整个卧室空间环境的联动， 未来在产品平台上结合国人需求因地制宜地设计新的产品形态。公司董秘补充， ASleep主要采用水循环温控技术，慕思在温度助眠方面一直较为重视，中医讲 究头凉脚热，公司已有存量解决方案，如凝胶枕比皮肤温度低0-1.2度、小腿位 置石墨烯加热，通过枕头加石墨烯加热的组合方案解决温度对助眠的效果；IoT wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 互联可与空调实现联动，通过床垫感知体表温度并联动空调打造最佳睡眠温度环 境；同时公司正在研发温感床笠，一直在布局该路线。 5.海外业务中自主品牌、跨境电商、OEM各渠道目前的盈利水平如何？后续如 何展望？ 答：公司表示，目前海外收入以三部分为主：自有品牌、跨境电商和OEM。从全 年来看，自有品牌收入同比提升，跨境电商收入下降，OEM收入增速逐月向好。 自有品牌是公司出海的核心方式，1-9月海外收入约2亿元，其中约1亿元由自 有品牌构成、收入增长40%；跨境电商约7000万元，收入增速下滑约5个百分 点，因其天然毛利率相对较低，未来该业务可能逐步收缩；OEM1-9月贡献收入 约2000万元，因定价原因且主要向北美出海，整体毛利率和净利率相对较低。 未来公司仍将以自有品牌出海为主导。 6.上半年以来原材料价格出现变化，结合整体原材料价格走势，公司对未来毛 利率趋势如何展望？ 答：公司表示，三季度毛利率下滑2个多百分点，核心原因是材料涨价，主要是 海绵、乳胶、无纺布、胶水等大宗材料涨价较多，且10月份胶水涨价幅度更大， 四季度仍存在涨价压力。公司没有将成本压力及时传导至消费端，采购部门进行 了策略对冲：在保供保交付的前提下，进行行情预测以及锁价备货，稳定平滑整 体原材料采购成本。议价周期方面，海绵、无纺布等价格变动频繁的品种一月一 议价，天然乳胶、面料、3D棉等三月一议价，单月一议价的产品若涨价较多， 仍会对原材料成本产生一定影响。目前在可控范围内，公司暂未考虑直接涨价政 策，若未来价格攀升较高或较为迅速，会考虑采取涨价动作。 7.包括跨境在内，海外业务整体情况如何？此前公司提到今年想重点发力海外 智能沙发等新产品，目前进展如何？海外业务毛利率和净利率整体情况如何？ 答：公司表示，自有品牌中，2亿元海外收入的一半由新加坡公司贡献，新加坡 同时运营Maxcoil和慕思两个品牌，Maxcoil贡献90%的收入、慕思贡献10%， 慕思销售逐季度在提升，公司希望四季度两个品牌共同发力，市占率向第一梯队 和金可儿齐头并进。布局上，公司已在新加坡开立公司并将管理人员派驻当地与 本地人员融合，同时将金管家服务模式向海外拓展，包括专业运输车辆、除螨车 辆等专业化服务。AI产品出海方面，东南亚AI产品已顺利出海，海外定价高于 国内，以T11为例，国内定价2-3万元，海外可卖到5-6万元，公司认为AI产 品在海外是弯道超车的机会。跨境电商方面，2亿元海外收入中约4600万元为 跨境电商，核心平台为亚马逊和沃尔玛，两者收入贡献约4:1，三季度公司顺利 成为亚马逊自营平台供货商；跨境电商主要布局北美（占比约七成）、欧洲（占 比约两成）、日本（占比约一成）。OEM业务占海外收入约10%，毛利率和净利 率水平相对较低，未来希望挖掘更优质的当地合作商，OEM业务涉及沙发品类， 未来希望其逐步贡献收入增长。整体来看，自有品牌是海外出海的核心抓手，跨 境电商和OEM目前相对较弱，跨境电商未来可能进一步弱化。轻智能产品目前未 计入核心AI产品统计。 8.公司在下沉市场推鸿蒙系列相对低价产品、自有T系列持续更新迭代的综合 性打法下，前三季度AI床垫整体价格走势和综合毛利率表现如何？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：公司表示，AI产品核心由T系列和华为鸿蒙系列贡献，前三季度3.46亿元 收入中，T7系列占比65%、鸿蒙系列占比35%，说明具备核心技术优势的T系列 仍更受消费者认可，消费者愿意在睡眠质量上进行投入。毛利率方面，T系列毛 利率在60%左右，华为鸿蒙合作款毛利率在45%左右；轻智能产品为公司自主研 发、不属于AI产品，其毛利率介于鸿蒙系列和T系列之间。 9.公司年初制定AI床垫5亿元目标，前三季度完成3亿多，叠加竞品加大中 国市场投入，公司对全年5亿元目标的信心程度如何？对明年如何展望？ 答：公司表示，全年5亿元目标维持不变，前三季度3.5亿元收入已完成公司内 部目标、达到预期，从公司组织架构、经营层到终端导购层，对完成AI考核业 绩都比较有信心。公司围绕AI开展大量营销推广布局，包括品宣投流布局、终 端AI产品发布会、客户服务部AI活动和AI疗愈空间、AI产品老带新活动等， 整体市场反馈达到预期。此外，海外也会贡献AI产品收入增速，支撑AI产品业 绩达成。明年展望方面，公司希望AI产品能够占到公司整体营业收入的20%到 30%，认为随着研发能力不断强化，很多产品会慢慢上新智能，AI做到20%-30% 的销售占比很有信心。 10.下半年以来控费导致产品和渠道结构发生变化，目前调整是处于初期仍需 延续，还是已经初见成型、可视为稳态发展？ 答：公司表示，控费用是接下来相当长一段时间的核心关键指标，利润是当前比 较关注的重点。销售费用端，电商投流在收缩，可能导致电商业务下行、对分渠 道结构贡献略有影响，但投流收缩带来电商下行不一定是坏事，因为当前电商流 量投入越来越贵，公司严格管控投流额度、追求更好的ROI。国内电商收入主要 由天猫、京东、抖音贡献，比例约3:3:2，三季度投流控费主要影响抖音，而抖 音天然毛利率、净利润率相对其他平台更低，对利润端影响反而有限。公司认为 费用控制是一个常态化过程，将优化费用投放结构和方向，机场、高铁投放费用 今年在收缩，管理费用中差旅费下降、人员精简、人事费用逐步下降，费用改善 是缓慢、循序量变产生质变的过程。围绕核心AI战略投放，费用结构会调整， 期待销售费用率慢慢下降，去年和今年是销售费用率较高的阶段，四季度之后费 用率应逐步得到更好把控。公司董秘补充，业务端控投入也是现阶段跨越行业寒 冬需要坚持去做的一步，核心目的是提高综合盈利能力，对盈利能力较弱的业务 如定制、沙发投入、OEM、跨境电商等均坚持收缩费用投入，这些都是主动行为。 11.公司此前投资华威科、正阳科技，均为AI产业链上游零部件如传感器环节， 相关投资合作是未来共同研发制造上游零部件，还是会有更多往AI产品切入的 想法？ 答：公司表示，与华威科、正阳科技以及MIT方面的合作，核心是布局传感器领 域，包括柔性传感器、织物传感器，未来希望实现布料级传感器，使传感监测精 度更高。当技术成熟之后逐步应用，公司与华威科共研已推进至第三代，据研发 同事反馈，第三代成本已下降约60%-70%，当成本结构达到研发目标后，会逐步 应用到公司产品上。 12.是否可理解为目前智能床垫和智能床架的零部件仍需对外采购，未来华威 科、正阳科技大批量生产后可以做到完全自产自供？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：公司表示，现阶段柔性传感器处于研发阶段，未来达到可应用程度后，目前 的规划是由华威科和正阳科技两家公司来供货，后续不排除公司在这方面做一些 布局。参照控制盒的发展路线，最初也是外采，后来由公司自己孵化的公司进行 自供，相关控降成本的效果更好。 13.通过产业链自供等方式，公司预计床垫未来的成本或售价大概能有多大幅 度的下降？ 答：公司表示，曾针对这一块在毛利率维度请研发同事做过探讨，理解是AI产 品当产能爬坡达到比较稳定状态、成本摊薄之后，期望可以达到70%左右的毛利 率水平。具体的量目前还没有明确的数据或范围，但整体毛利率提升、最终实现 利润贡献的规划，预计未来2-3年可以有初步成果。 14.公司在AI产品方面，目前是否有正在研发中、属于新品类且未来认为可能 比较重要的方向？ 答：公司表示，核心仍围绕AI产品，在功能上如慢病诊断、大健康管理等方面 做研发，公司主导的创新联合体未来3年技术路线均围绕AI产品在技术功能、 慢病和健康管理服务等方面进行三年规划。跳开AI产品之外的其他品类目前暂 时没有，传统业务主要是在营销模式上做创新，AI业务则主要是功能上和技术 上的创新。 15.公司过去两年承诺了固定分红，后续在股东回报方面大体上会沿用这种方 式，还是会有其他政策调整？ 答：公司表示，今年披露的3年分红规划是此前与老板沟通确定的，目前仍按照 承诺继续执行。3年期满后，将视届时情况确定：公司主业包括AI产品发展方 向有3年的目标畅想，包括营收增长和盈利能力提升，同时也在看第二曲线，3 年以后的具体情况届时再确定股东回报方案，现阶段暂时还不好讲。 16.未来1-2年内可能的大额资本开支，是否包括公司参与的喜临门项目？主 业如AI床垫方面是否还会涉及较大资本开支？ 答：公司表示，AI床垫方面主要是研发投入，有持续的规划。AI床垫之外，传 统业务暂时没有更大的资本开支，后续在探索D2C模式下的中央仓模式，若该模 式研讨足够成熟并推进，这一块可能会有资本开支，其他暂时相对不大。此外， 公司也在看一些对外延式投并购，但目前都不确定，若未来有合适的标的，可能 会有一些资本开支。 17.若在家居主业进行投并购，是否围绕床垫或软体家居方向？这是公司目前 比较关注的方向吗？ 答：公司表示，主业方面的产业链投资，一个方向是AI上游技术环节的投资。 大众市场方面一直在持续扫描，与原来对接的全国区域知名软体品牌都建立了长 期联系，会根据情况和成本投入看机会是否合适，这一块会一直去看。此外，还 有非现有产业方向的投资，包括科技方面和财务方面的投资。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 18.二季度和三季度公司经营现金流增长较为明显，可能受税收返还、税率减 少影响，这些影响的持续性如何？对四季度现金流表现有何预期？从经销商回 款节奏、道具结算占比来看，三季度有无新的边际变化？ 答：公司表示，三季度经营性现金流显著增长主要是支出端下降：受营收下降以 及对外经营性投入影响，经营性现金流支出天然减少约4000万元；同时因企业 利润下降，所得税支付减少约1亿元，两项合计减少约1亿元的流出。税返方面， 三季度有一笔宁波税返600万元。未来现金流情况仍与整体公司经营收入和利润 走势相关。经销商货款结算方面，公司对经销商一直保持正常结算水平，没有给 予长周期的借款政策，三季度合同负债同比下滑16.55%，主要是经销商下单减 少导致货款减少；公司也在逐步探索更良性的竞争环境，给予经销商更宽松的政 策，没有提前过多收款。存货端公司也在改善经营动作，希望降低经销商端存货 水平，三季度库存同比和环比均较去年有所下降，希望经营处于良性状况，未来 实现更优质、健康的营收增长。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-30T15-44:50b12e8d9653": {"id": "post:2026-10-30T15-44:50b12e8d9653", "kind": "post", "title": "2026-10-30 15:44", "source_label": "帖子正文", "excerpt": "10月30日复盘笔记：医药/食品饮料/电商/白酒/乳业/脑机接口/人形机器人/PCB/固态电池/航运等一、重磅财经信息①多只宽基ETF持续放量 沪深300ETF华泰柏瑞（510300）15分钟成交超40亿。②“十五五”全国算力用电量预计年均新增1000亿千瓦时以上。", "content": "10月30日复盘笔记：医药/食品饮料/电商/白酒/乳业/脑机接口/人形机器人/PCB/固态电池/航运等一、重磅财经信息①多只宽基ETF持续放量 沪深300ETF华泰柏瑞（510300）15分钟成交超40亿。 ②“十五五”全国算力用电量预计年均新增1000亿千瓦时以上。二、大盘表现沪指跌1.44%，收报3599.02点；深证成指跌2.73%，收报10833.78点；创业板指跌4.13%，收报2413.63点，科创50跌5.48%。 沪深京三市成交额1.69万亿，较昨日放量逾千亿。三、强势板块和个股分析备注：只列举部分涨停板医药①美股生物制药巨头礼来公布，2026年第三季度净利润为64.51亿美元，同比增长16%，业绩高于市场预期。减肥及糖尿病药物替尔泊肽相关产品Mounjaro和Zepbound营收分别增长65%和49%。公司将全年营收指引上调至910亿至920亿美元。 ②羚锐制药、桂林三金、九安医疗、永安药业三季报业绩超预期。涨停板：百花医药、万邦医药、羚锐制药、桂林三金、永安药业、九安医疗、大参林、阳普医疗、澳洋健康其他强势股：近岸蛋白、毕得医药、康龙化成、皓元医药、千红制药、睿智医药食品饮料/电商等消费机构：当前正值双11电商走货高峰，行业流通品价盘波动加大，但波动中渠道情绪已较此前持续改观、接货情绪不错，目前飞天茅台原箱批价仍在1700元以上。涨停板：青岛食品、巴比食品、好想你、黑芝麻、泉阳泉、地素时尚、合百集团其他强势股：良品铺子白酒机 p有望打开新增量空间。公司已成功推出基于硅光和薄膜铌酸锂技术的400G、800G和1.6T全系列光模块产品，并先后推出6.4T NPO模块、12.8T XPO光模块等前沿产品，在OCS、CPO等前沿技术领域也有充足的技术储备和产品布局。公司已成功构建了覆盖XPO、OCS、NPO、CPO 等多种互联形态的技术体系，正争取以第一梯队身份进入该市场。我们认为，公司能力边界正由传统可插拔光模块，进一步延伸至近封装光学、超高密度互联及光交换领域，有望充分受益于AI集群scale-up带来的新一轮光互联需求。#文字观点", "publish_time": "2026-10-30 13:48", "tags": ["文字观点"]}, "post:2026-10-30T09-52:cf0495b50369": {"id": "post:2026-10-30T09-52:cf0495b50369", "kind": "post", "title": "2026-10-30 09:52", "source_label": "帖子正文", "excerpt": "新易盛三季报解读及四季度展望交流会议纪要 会议为国盛证券组织的机构交流会，参会对象为专业机构及受邀客户；嘉宾为新易盛公司管理层，会议发言仅代表嘉宾个人当日观点，未经许可禁止录音、转发。", "content": "新易盛三季报解读及四季度展望交流会议纪要 会议为国盛证券组织的机构交流会，参会对象为专业机构及受邀客户；嘉宾为新易盛公司管理层，会议发言仅代表嘉宾个人当日观点，未经许可禁止录音、转发。 风险提示：以下内容整理自会议录音转写，不构成投资建议。 一、三季度收入下滑核心原因：发货跨期，并非需求走弱 1、存货变动情况 三季度末存货较二季度增长50多亿，存货增长部分中约一半为库存商品，该部分可以确认销售收入。三季度部分货物已经生产完毕发货，但受外部客观因素影响，收入确认发生跨期。如果把该部分计入，三季度收入并非报表体现的下滑态势。公司原材料、半成品备货充分，对四季度收入、物料准备具备信心。 2、泰国洪水带来物流延误（核心跨期因素） 泰国9月发生洪水，没有造成厂区停产、货物损毁减值，生产和产品本身不受影响，主要冲击物流、机场与清关环节。公司9月下旬本有大批量发货计划，受洪水物流阻滞，大量货物的报关、出口延后至10月初，使得本应在9月确认的收入顺延到10月。 部分客户采用VMI寄售仓模式，客户自身提货节奏阶段性放缓，与物流延误两个因素叠加，放大了三季度报表收入的压力。截至会议时点，9月底积压的库存商品大部分已经在10月完成发货与收入确认。 二、供应链与原材料：核心物料紧张，已经前置备货 行业整体原材料供应趋于紧张，不限于单一物料，伴随光模块订单规模快速扩张，核心物料备货周期拉长，部分物料备货周期达到半年至一年。以DSP为代表的核心元器件供应存在压力。 1、公司已经针对Q4以及明年订单提前完成大量前置备货；虽不能保证完全没有临时突发状况，但对Q4、明年订单交付有信心。 2、坦诚过往供应链环节仍有提升空间，已基于过往经验持续优化供应链管理。 3、成都、泰国两地工厂同步大规模扩产，四季度产能、产量预计实现大幅度环比增长，出于信息合规要求，不披露具体增速区间。 三、新品进展：NPO、1.6T、前沿技术产品 1、NPO产品 目前已经和多家客户开展联合开发： • 2027年实现小批量出货，量级乐观； • 2028年大规模投产，将成为公司重要收入贡献产品； • 公司已经提前规划对应产能、设备、生产工艺，NPO技术生态确定性较强。 2、1.6T光模块 • Q3‑Q4开始起量，四季度增速会更加明显，明年放量进一步加快，产品占比快速提升； • 管理层判断1.6T生命周期较长，今年、明年才是大规模上量的阶段，虽然3.2T等下一代技术在演进，但短期不会快速替代1.6T； • 目前没有看到800G、1.6T产品出现明显的价格压力。 3、其他前沿新产品 对于OCS、相干、硅光升级等前沿产品，公司保持前沿布局，跟客户跟进商业化时间节点，力争第一时间导入，为未来业绩做储备。 四、热点问题回应 1、FCC政策风险 相关内容目前仅为提案、媒体报道，尚未落地正式法规。公司密切跟踪政策走向，已经针对多种潜在情景制定预案，推进全球化供应链布局；和客户共同探讨供应链供应商调整方案，应对美国零部件占比相关潜在要求。 2、股权激励目标 公司管理层对完成股权激励目标抱有信心，全公司调配资源向目标努力，但无法给出确定性“一定完成”的结论。 3、所得税税率抬升 税率变动来自销售收入、利润波动，叠加税务政策、泰国工厂产出扩大带来的税收优惠变化综合影响。 4、股份回购 三季报披露前属于敏感期，不能开展回购；三季报披露完成后，按照已披露的回购公告正常推进实施。 5、海外云厂商资本开支传闻 管理层不点评个别大厂传闻，基于和核心客户的沟通，对明年、后年整个光模块行业景气度维持乐观，判断明年订单、产量相比今年会有非常大幅度增长。 针对Marvell拟收购Lumentum的行业并购新闻，管理层表示尚处于新闻早期，暂未看到对国内光模块企业的直接冲击，后续持续跟踪事态发展。 五、其他要点 1、泰国、成都工厂产线存在工艺分工，光模块生产工序复杂，两地均在同步扩产新建厂房，提升整体交付能力，不披露两地精确产能占比。 2、存货全部按照实际成本计价。 3、Q3生产环比提升，但受前期原材料备货、订单分布影响，生产端增长力度没有完全释放；四季度供应链问题预计会得到较大改善。 4、客户提货节奏整体向上，VMI模式下月度提货存在正常波动。 5、1.6T、硅光产品占比持续提升，公司未披露三季度1.6T精确收入占比。内容来自金斧头 重要声明：纪要仅为会议内容整理，不构成任何投资建议。#文字观点", "publish_time": "2026-10-30 09:52", "tags": ["文字观点"]}, "post:2026-10-30T08-54:f32152feabe7": {"id": "post:2026-10-30T08-54:f32152feabe7", "kind": "post", "title": "2026-10-30 08:54", "source_label": "帖子正文", "excerpt": "【西部通信】新易盛2026年Q3业绩点评：交付节奏与物料约束影响Q3收入兑现，Q4及明年指引积极，公司仍是光互联升级大趋势的头部参与方和受益者20261029 1、整体业绩低于预期，收入与利润环比回落： 前三季度营收318.50亿元、归母净利润113.72亿元，同比分别增长92.97%、79.74%", "content": "【西部通信】新易盛2026年Q3业绩点评：交付节奏与物料约束影响Q3收入兑现，Q4及明年指引积极，公司仍是光互联升级大趋势的头部参与方和受益者20261029 1、整体业绩低于预期，收入与利润环比回落： 前三季度营收318.50亿元、归母净利润113.72亿元，同比分别增长92.97%、79.74%。单Q3营收109.40亿元、归母净利润38.43亿元，同比分别增长80.30%、61.15%，环比分别下降12.98%、19.07%；扣非净利润36.30亿元，环比下降23.47%。同比仍保持较快增长，但未兑现此前对Q3继续放量的预期。 2、收入环比下滑主要受三方面影响，存货及采购付现明显增加： 按公司口径，一是部分采用库存仓模式的客户提货放缓，影响当季收入确认；二是部分客户订单受9月下旬泰国洪水影响，物流及清关延误，延迟至10月初发货、确认收入，公司表示生产和货物未受损；三是核心物料供应仍偏紧，制约生产与交付增长。同时，Q3毛利率46.27%，环比下降1.69个百分点，所得税费用环比增加3.38亿元，进一步影响利润表现。 存货和采购付现明显增加，验证公司电话会的出货和锁料口径：Q3末存货174.13亿元，较Q2末116.55亿元增加57.57亿元、环比增长49.40%；单Q3购买商品、接受劳务支付的现金112.44亿元，较Q2的97.17亿元增加15.27亿元、环比增长15.72%。 3、Q4及明年增长指引积极，兑现关键仍在物料保供： 公司预计Q4收入环比及2027年收入较今年有望大幅增长，对2027—2028年需求保持乐观，1.6T产品放量与成都、泰国产能扩张提供增长支撑。但物料紧张仍未完全解决，需求指引能否转化为业绩，取决于核心器件到货、生产爬坡及客户提货节奏。若达到全年500亿元收入考核目标，Q4需实现收入181.50亿元、环比增长约65.9%，后续重点验证延迟订单确认、新增交付。 4、NPO及光互联升级打开成长空间，技术积累与客户协同构筑先发优势： 公司已推出基于硅光技术的6.4T NPO产品，并形成覆盖可插拔、NPO/CPO及OCS的技术布局，光芯片研发、高速封装与规模制造能力有望向下一代产品延伸。我们认为，随着光互联向更高带宽密度、更低功耗演进，竞争将进一步考验芯片设计、封装耦合、可靠性及量产良率，前期客户认证和联合开发经验有利于公司承接升级需求。管理层预计NPO于2027年开始小批量交付、2028年进一步放量，有望成为中期增长来源。 西部通信 陈彤/程莹/邱海涛#文字观点", "publish_time": "2026-10-30 08:54", "tags": ["文字观点"]}, "post:2026-10-30T15-24:ed96cc9329fa": {"id": "post:2026-10-30T15-24:ed96cc9329fa", "kind": "post", "title": "2026-10-30 15:24", "source_label": "帖子正文", "excerpt": "新易盛：2026Q3业绩环比承压，Q4业绩有望稳步向好公司发布2026年三季报，2026Q1-Q3公司实现营收318.50亿元，同比增长92.97%；实现归母净利润113.72亿元，同比增长79.74%", "content": "新易盛：2026Q3业绩环比承压，Q4业绩有望稳步向好公司发布2026年三季报，2026Q1-Q3公司实现营收318.50亿元，同比增长92.97%；实现归母净利润113.72亿元，同比增长79.74%；实现扣非归母净利润111.40亿元，同比增长76.79%。前三季度经营活动现金流净额14.64亿元，同比下降68.42%，主要系支付材料款以及各项税费增加。2026Q3公司营收及净利润环比承压，市场需求强劲预期Q4稳步向好 2026Q3公司实现营收109.40亿元，同比增长80.30%，环比下滑12.98%；实现归母净利润38.43元，同比增长61.15%，环比下滑19.07%；实现扣非归母净利润36.30亿元，同比增长53.32%，环比下滑23.47%。当前整体市场需求预期保持强劲，800G已成为今年交付主力产品，1.6T后续放量节奏有望持续加快，叠加硅光产品份额稳步提升，Q4业绩有望稳步向好。从报表来看，Q3新增预付账款4.52亿元、新增存货57.58亿元，较Q2明显增加（Q2新增预付账款1.88亿元、新增存货26.29亿元），有望成为Q4业绩增长的有力支撑。公司多技术路线并行布局，在手订单充足、产能持续扩张 公司在 LPO/LRO、XPO、NPO、CPO 及 OCS 多路线并行布局，NPO 产品持续推进研发及客户合作，预计 2027 年迎来批量订单需求；依托成都、泰国两大生产基地持续扩产，提前备货保障交付，当前在手订单充足，行业景气度预计维持高位。公司推出股份回购方案绑定核心人才，彰显长期发展信心 10月23日公司披露回购股份报告书，拟使用自有及/或自筹资金以集中竞价方式回购A 股股份，回购资金总额不低于8亿元、不超过10亿元，回购价格不超过500元/股，回购股份拟用于股权激励或员工持股计划。 风险提示：海外客户需求不及预期风险、行业竞争加剧、产品价格下行风险、汇率波动风险、技术迭代不及预期风险。 资料来源：公司公告 【重要提示】以上信息为公开资料整理，不涉及投资建议及研究观点，仅供参考，本公司不保证其准确性、完整性与时效性；市场有风险，投资需谨慎！#文字观点", "publish_time": "2026-10-30 15:24", "tags": ["文字观点"]}, "post:2026-10-30T17-27:03e340bf6356": {"id": "post:2026-10-30T17-27:03e340bf6356", "kind": "post", "title": "2026-10-30 17:27", "source_label": "帖子正文", "excerpt": "✅ 【#东山精密：Q3净利润同比增长401%环比增长26%】 财联社10月30日电，东山精密(002384.SZ)公告称，前三季度实现营业收入453.79亿元，同比增长67.63%", "content": "✅ 【#东山精密：Q3净利润同比增长401%环比增长26%】 财联社10月30日电，东山精密(002384.SZ)公告称，前三季度实现营业收入453.79亿元，同比增长67.63%；归属于上市公司股东的净利润52.89亿元，同比增长332.34%。第三季度实现营业收入175.82亿元，同比增长73.81%；归属于上市公司股东的净利润23.32亿元，同比增长401.18%。业绩变动主要系并购索尔思光电纳入合并范围后新增光模块业务，收入实现较大增长，协同传统板块业务稳步提升所致。小财注：公司Q3净利润23.32亿，Q2净利润18.47亿，据此计算，Q3净利润环比增长26%。 ✅ 扣非和归母同步爆炸，不是靠一次性收益，是主业利润提升，含金量高；Q3环比继续增长，不是单脉冲 ✅ 光模块实现光芯片+模块一体化，不是单纯外购芯片组装，在AI光模块赛道有差异化竞争力，覆盖800G/1.6T，布局3.2T#文字观点", "publish_time": "2026-10-30 17:27", "tags": ["东山精密", "Q3净利润同比增长401%", "文字观点"]}, "post:2026-10-30T09-34:4c7337698ab7": {"id": "post:2026-10-30T09-34:4c7337698ab7", "kind": "post", "title": "2026-10-30 09:34", "source_label": "帖子正文", "excerpt": "【国金计算机&电子】#胜宏科技：2026Q3扣非利润稳健增长_股权激励锚定Q4爆发高增 #Q3营收延续高增_表观净利润下滑主因非经常性损益扰动 ——2026Q1-Q3公司实现营收1", "content": "【国金计算机&电子】#胜宏科技：2026Q3扣非利润稳健增长_股权激励锚定Q4爆发高增 #Q3营收延续高增_表观净利润下滑主因非经常性损益扰动 ——2026Q1-Q3公司实现营收184.61亿元，同比+30.77%；归母净利润33.84亿元，同比+4.28%；扣非归母净利润36.94亿元，同比+13.74%。单Q3实现营收68.31亿元，同比+34.30%；扣非归母净利润12.76亿元，同比+16.16%，环比Q2有所回落。 ——单Q3归母净利润5.27亿元，同比-52.17%，主要受非经常性损益扰动：Q3非经常性损益合计-7.49亿元，其中金融资产及金融负债公允价值变动损失6.90亿元为核心拖累项，另有其他营业外收支净损失1.99亿元；此外前三季度利润表中捐赠学校等营业外支出达2.64亿元（同比+1441.43%），亦对表观利润形成明显压制。 ——费用端，前三季度财务费用4.76亿元，同比+482.92%，主系汇兑损失增加；管理费用同比+47.76%，主系薪酬及H股上市相关费用增加，整体费用率可控。 #股权激励锚定全年高增_Q4进入考核冲刺期 ——以2025年归母净利润43.12亿元为基数，2026年激励考核基准/目标为增长率不低于40%/50%（净利润口径剔除股份支付），对应全年归母60.37/64.68亿元。 ——以前三季度表观归母33.84亿元测算，Q4需达26.53/30.84亿元，同比+149%/+189%；若走营收路径（2025年192.92亿元为基数），Q4营收需达85.48/104.77亿元，同比+65%/+102%。 ——考虑Q3利润受公允价值损失压制、Rubin放量后产能利用率与产品结构优化，Q4兑现考核目标具备可行性。 #订单能见度极高_资产负债表全面扩张支撑后续放量 ——备货与预收印证需求：截至Q3末存货92.49亿元，较年初+192.49%，合同负债较年初+674%，均指向AI算力订单饱满、2027年需求能见度高企；应收账款82.42亿元，同比+40.38%，与收入高增匹配，前三季度经营性现金流净额35.21亿元，同比+47.71%，回款质量良好。 ——产能扩张提速：前三季度购建长期资产支出117.24亿元，同比+221%；期末固定资产128.13亿元（较年初+39.81%）、在建工程63.07亿元（较年初+74.73%），惠州、越南、泰国新产能持续落地，进一步巩固AI高端PCB产能优势。 ——资金面充裕：H股上市募资到位，9月末货币资金102.76亿元、交易性金融资产85.34亿元，资本公积较年初+370%至253.25亿元，为后续产能扩张与研发投入提供坚实保障，短期借款45.87亿元、长期借款70.53亿元的杠杆提升可控。 风险提示：宏观风险、供应链风险、汇率波动风险、AI算力需求不及预期风险等 联系人：郑元昊/孙恺祈/刘高畅3#文字观点", "publish_time": "2026-10-30 09:34", "tags": ["文字观点"]}, "post:2026-10-30T21-15:f44cef4ca539": {"id": "post:2026-10-30T21-15:f44cef4ca539", "kind": "post", "title": "2026-10-30 21:15", "source_label": "帖子正文", "excerpt": "高盛中国市场收盘 📊 上证综指 -1.44%，科创 50 -5.48% 上证 50 -0.75%，创业板指 -4.13% 沪深 300 -1.39%，中证 500 -2.91% 💰", "content": "高盛中国市场收盘 📊 上证综指 -1.44%，科创 50 -5.48% 上证 50 -0.75%，创业板指 -4.13% 沪深 300 -1.39%，中证 500 -2.91% 💰 成交总额（万亿元人民币）1.69，环比 + 7.45% 📉 A 股收盘接近日内低点，早盘短暂反弹带来的 “虚假希望” 在午后消退，午后的上攻动能没能延续。 🌏 隔夜美国市场业绩不及预期、股价走弱，亚洲科技板块开盘承压。 💻 A 股科技权重股（新易盛、天孚通信、胜宏科技）披露的三季度业绩全部低于市场预期，进一步加大下行压力。高盛中国光网络指数下跌 7.46%，高盛中国存储指数下跌 5.58% enAI把Oracle业务应用与Agent接进ChatGPT。\u003c/li>\n\u003cli>今天出现的催化/验证：Amazon资本开支超预期、核心电商业务增速为三年来最慢；Intel Q3利润超预期但Q4指引不及预期，盘后股价重挫超20%；领益智造Q3业绩超预期，AI终端/端侧AI稳健向好，具身智能/服务器液冷&amp;电源放量。\u003c/li>\n\u003c/ul>\n\u003ch3>2. 半导体/先进封装与国产算力\u003c/h3>\n\u003cul>\n\u003cli>主线：国产设备、互连芯片与交换机芯片业绩兑现，先进封装适配能力强化。\u003c/li>\n\u003cli>今天强化的逻辑：华海清科Q3归母同比+53.5%，12英寸CMP覆盖先进制程与成熟制程，适配逻辑、存储、大硅片制造及3DIC、HBM、CoWoS等先进封装场景并实现批量落地；正帆科技Q3归母同环比扭亏；澜起科技Q3扣非同比+167%，预计Q4交付互连芯片订单25亿元+；紫光股份前三季度归母同比+98%，新华三营收同比+36%；盛科通信Q3营收同比+44%、研发投入同比+61%。\u003c/li>\n\u003cli>今天出现的催化/验证：Intel服务器增长强劲但Q4指引不及预期；先进制程扩产被视为解决国产AI卡脖子环节及高端芯片制造瓶颈的方向；华海清科。\u003c/li>\n\u003c/ul>\n\u003ch3>3. 光通信/CPO\u003c/h3>\n\u003cul>\n\u003cli>主线：Q3交付与物料约束扰动收入兑现，前沿互联产品布局继续推进。\u003c/li>\n\u003cli>今天强化的逻辑：新易盛前三季度营收318.5亿元、同比+93.0%，归母113.7亿元、同比+79.7%；单Q3收入109.4亿元、同比+80.3%、环比-13%，归母38.4亿元、同比+61.15%、环比-19.1%，Q4及明年指引积极；公司已推出基于硅光和薄膜铌酸锂技术的400G、800G和1.6T全系列光模块，并推出6.4T NPO、12.8T XPO，构建覆盖XPO、OCS、NPO、CPO等多种互联形态的技术体系，争取以第一梯队身份进入该市场；目前没有看到800G、1.6T产品出现明显价格压力。华工科技Q3营收同比+42%、归母净利润同比+17%，XPO领衔AI光互联全栈新品。\u003c/li>\n\u003cli>今天出现的催化/验证：新易盛三季报解读及四季度展望交流会议召开；中际旭创2026年三季报解读电话会议召开；交付节奏与物料约束对Q3收入兑现的影响成为验证点。\u003c/li>\n\u003c/ul>\n\u003ch3>4. 新能源/光伏\u003c/h3>\n\u003cul>\n\u003cli>主线：Q3减亏与盈利分化，高效组件海外溢价与BC技改推进。\u003c/li>\n\u003cli>今天强化的逻辑：TCL中环前三季度营收235.14亿元、同比+9.0%，归母-45.56亿元、同比改善21.1%；电池组件销量14.5GW、同增43%，海外出货占比20.6%、出货量同增202%，Q3电池组件销量6.6GW、环比+32%；收购一道新能源控股权于7月初完成交割，已启动20GW电池和25GW组件BC技改，预计至明年一季度陆续完成，届时电池和组件产能分别达到20GW（BC）和50GW（BC、TOPCon各25GW）。光伏Q3整体减亏、盈利分化显现，企业不再追求出货量而转向减亏与盈利，高效组件BC、TOPCon3.0在海外享有溢价，部分公司三季度扭亏为盈。\u003c/li>\n\u003cli>今天出现的催化/验证：11月电池及材料排产整体环比-6%～3%、同比22%-48%，月内需求整体持平略降，主要系锂价下跌引起去库；硅料成交清淡，主流厂商减产挺价，但下游高库存仍待消化；海风进入政策拐点。\u003c/li>\n\u003c/ul>\n\u003ch3>5. 机器人/物理AI\u003c/h3>\n\u003cul>\n\u003cli>主线：物理AI从概念走向订单，数据投入与北美头部机器人供应链卡位强化。\u003c/li>\n\u003cli>今天强化的逻辑：物理AI评价标准由“仿真效果”转向“真机实战”，行业核心标准从机器人演示动作流畅度、仿真渲染效果转向真实场景交付能力与持续稳定运行表现；物理AI瓶颈已从硬件转向数据，数据成为确定性最强的投入方向，世界模型/物理AI一级公司融资估值两年涨10-20倍，融资重点投向数据；力鼎光电海外收入占比高达90%，深度耕耘动捕与数采领域20年、机器人光学10余年，覆盖北美T、O、1X、Figure及波士顿动力等头部人形机器人矩阵，并已向OpenAI人形机器人项目独家送样；朗信电气连续三代向Figure批量供应无框力矩电机，产品覆盖机器人躯干、手臂、脚部及手指关节，26H1机器人业务收入约1200万元，预计全年达到3kw-4kw。\u003c/li>\n\u003cli>今天出现的催化/验证：申昊科技机构调研强调物理AI落地首站为电算协同智能运维；Figure量产节奏加快，朗信有望凭借北美机器人核心供应链卡位全面开拓至其他头部厂商；真机实战与持续稳定运行成为订单评价标准。\u003c/li>\n\u003c/ul>\n\u003ch3>6. 商业航天/卫星\u003c/h3>\n\u003cul>\n\u003cli>主线：可回收复用闭环与千帆/GW招标预期驱动运力突破，叠加筹码出清回补。\u003c/li>\n\u003cli>今天强化的逻辑：本轮商业航天以“可回收复用闭环+千帆/GW招标预期”为核心展现运力突破，以及筹码出清回补的上涨行情；航天装备指数连续两日显著反弹（10/28 +4.40%，10/29 +6.84%），29日中国卫星盘中涨停，卫星ETF永赢盘中一度涨超4%，显示流动性与情绪修复的共振迹象；国星宇航通过港交所上市聆讯，按2025年的收入计在从事卫星相关业务的中国民营商业航天企业中排名第七，市场份额为2.1%，战略重点在于卫星及相关服务以及星基解决。\u003c/li>\n\u003cli>今天出现的催化/验证：卫星制造端业绩验证+年底密集发射催化；SpaceX申请部署多达100万颗卫星的轨道数据中心，谷歌81颗TPU卫星，贝佐斯规划5000颗；中重科技参投国内首家塔架回收运载火箭公司大航跃迁，后者布局塔架回收火箭，首飞箭已全面进入生产试验阶段，计划2026年下半年启动总装总测、2027年完成首飞。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>Amazon 2026Q3收入2019.44亿美元、同比+12%，经营利润281亿美元、同比+61%；资本开支超预期，核心电商业务增速为三年来最慢。\u003c/li>\n\u003cli>微软FY27Q1营收922.79亿美元、同比+19%，Azure增长48%；Intel Q3营收165.1亿美元、同比+21%，Non-GAAP EPS为0.52美元、较预期高30%，毛利率44.1%，Q4指引不及预期，盘后股价重挫超20%。\u003c/li>\n\u003cli>华海清科Q3营收15.39亿元、同比+23.7%、环比+6.8%，归母同比+53.5%；正帆科技Q3营收16.10亿元、同比+26.3%、环比+27.8%，归母同环比扭亏；澜起科技Q3扣非同比+167%，预计Q4交付互连芯片订单25亿元+；紫光股份前三季度归母同比+98%，新华三营收同比+36%；盛科通信Q3营收同比+44%、研发投入同比+61%。\u003c/li>\n\u003cli>新易盛前三季度营收318.5亿元、同比+93.0%，归母113.7亿元、同比+79.7%；单Q3收入109.4亿元、同比+80.3%、环比-13%，归母38.4亿元、同比+61.15%、环比-19.1%。\u003c/li>\n\u003cli>TCL中环前三季度营收235.14亿元、同比+9.0%，归母-45.56亿元、同比改善21.1%；Q3电池组件销量6.6GW、环比+32%；收购一道新能源后启动20GW电池和25GW组件BC技改。\u003c/li>\n\u003cli>国星宇航通过港交所上市聆讯；航天装备指数10/28 +4.40%、10/29 +6.84%，29日中国卫星盘中涨停，卫星ETF永赢盘中一度涨超4%。\u003c/li>\n\u003cli>TPCA台湾电路板协会表示，原本只有Low CTE布、Low Dk2、HVLP4等高阶材料吃紧，现已蔓延到CCL、高阶PCB、ABF载板、制程设备与耗材；碳氢树脂在M9/M10级覆铜板配方中占比将反超聚苯醚，BCB树脂中试送样反馈积极，适配M9/M10高端方案。\u003c/li>\n\u003cli>美股纳指-1.38%、标普500 -0.30%、罗素2000 +1.01%；A股上证综指-1.44%、科创50 -5.48%、创业板指-4.13%；美第三季度GDP初值3.4%，前值2.2%，市场预期3.2%。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>Amazon AWS订单储备、资本开支与核心电商增速；I <script>
const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=(v)=>Array.isArray(v)?'<ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
