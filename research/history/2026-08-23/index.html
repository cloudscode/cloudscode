阿里AI云与算力服务收入达到484.37亿元，同比增长45%；AI相关产品已连续12个季度实现三位数增长。 🔥重点三：#国产模型进入真实调用验证阶段。1️⃣DeepSeek在Vercel Gateway的Token份额由4月不足1%升至7月约25%，V4 Flash占平台调用量近20%； 2️⃣开放权重模型支出占比翻倍至8.6%，超90%的增量来自Kimi和智谱；同期单位Token价格环比下降13.6%； 3️⃣Qwen家族近半年全球下载量突破30亿次，衍生模型超过15万个； 4️⃣中国实验室取得视频生成领域约70%的支出份额，Seedance同时领跑生成量与支出。 🔥重点四：#算力竞争转向长期容量和资本组织。1️⃣OpenAI俄亥俄州项目规划最高8GW，英伟达提供最高1050亿美元担保，首批800MW预计于2028年投产； 2️⃣阿里单季CapEx达到676.78亿元、同比+75%，第二代自研AI芯片预计下半年进入流片及产出阶段，真武M890超节点实例已规模化销售； 3️⃣Anthropic与Fractile达成约2.5亿美元初步供应合同，AI ASIC计划自2027年开始交付。 风险提示：技术迭代不及预期；资本开支压力超预期；头部厂商竞争加剧。#文字观点", "publish_time": "2026-08-23 14:01", "tags": ["国产模型进入真实调用验证阶段", "算力竞争转向长期容量和资本组织", "文字观点"]}, "post:2026-08-23T20-51:fff8b8fd36a4": {"id": "post:2026-08-23T20-51:fff8b8fd36a4", "kind": "post", "title": "2026-08-23 20:51", "source_label": "帖子正文", "excerpt": "摩根大通——亚洲硬件科技：AI与通用服务器需求前景同步走强，供应约束成关键摇摆因素 AI服务器：需求强劲，Rubin世代如期推进 AI芯片出货量预计在2025至2028年间实现45%的年复合增长率。受美国头部云厂商（CSP）资本开支韧性及Neocloud/企业端积压需求释放驱动，GPU服务器需求持续", "content": "摩根大通——亚洲硬件科技：AI与通用服务器需求前景同步走强，供应约束成关键摇摆因素 AI服务器：需求强劲，Rubin世代如期推进 AI芯片出货量预计在2025至2028年间实现45%的年复合增长率。受美国头部云厂商（CSP）资本开支韧性及Neocloud/企业端积压需求释放驱动，GPU服务器需求持续旺盛，需求能见度已延伸至明年。AI ASIC芯片同期出货量年复合增长率预计高达60%，主要由AWS Trainium及谷歌TPU拉动。英伟达Vera Rubin系统将于2026年三季末至四季度如期爬坡，预计全年VR200机架出货量约1万柜；2027年NVL72机架总出货量预计达8.5万至9.5万柜，以VR200为主力。NVL72单机柜ODM价格随代际显著攀升，GB300/VR200分别约为410万/650万美元，较GB200高出20%/90%，主要源于GPU、内存涨价及网络、电源散热系统升级。尽管ODM毛利率从GB200的4.2%压缩至GB300/VR200的3.6%/2.7%，但单柜毛利绝对值（MVA）从14.5万美元增至14.8万/17.5万美元。 通用服务器：Agentic AI催生多年上行周期 随着AI应用从训练向推理迁移，尤其是Agentic AI（具备长思维链能力的自主智能体）的兴起，CPU在任务编排、工具调用及存储安全中的作用愈发关键，成为服务器CPU需求的全新增长极。预计2025至2028年服务器CPU总出货量年复合增长率达38%，其中AI头节点CPU、通用CPU、Agentic AI CPU的年复合增长率分别为74%、5%、155%。2026年全球CSP服务器出货预计同比增长40-50%，整体服务器市场增速有望达25%，订单能见度已延伸至2027年，核心变数在于供应链产能瓶颈。 数据中心电源：TAM快速扩容，2028年达500亿美元 受AI加速器出货增长（45% CAGR）、单芯片功耗（TDP）提升（30-50% CAGR）及供电架构向高功率机架演进三重驱动，数据中心电源总可寻址市场（TAM）预计在2025至2028年间实现80%的年复合增长率。台达电（Delta）作为高端电源及液冷龙头（市占率40%+），其AC/DC服务器电源收入同期有望实现75-80%的CAGR。NVL72机架功率持续攀升，VR200及VR Ultra机架设计功率分别达444kW和1500kW，推动单柜电源价值量从GB200的3.7万美元激增至VR Ultra的67.3万美元，800V HVDC高压直流供电架构及固态变压器（SST）将是长期技术演进方向。 数据中心网络：白盒交换机进入高增长周期 AI驱动前端（通用网络）与后端（GPU互联）网络同步升级，预计2025至2028年GPU后端以太网ToR交换机TAM年复合增长率达164%。网络带宽升级周期从100G/200G时代的7年缩短至800G到1.6T的不到2年，推动端口ASP持续提升。交换机ODM直采支出增速在2024/25年仅18%/103%，远低于同期服务器ODM直采207%/127%的增速，意味着网络侧补库空间巨大。智邦科技（Accton）凭借在400G+高端市场的领先份额，其数据中心交换机收入同期增速（92% CAGR）将显著跑赢行业（75% CAGR）。 PC与主板：量减但利润优于预期，组件需求疲软 2026年上半年PC出货优于预期主要源于Win10换机潮及记忆体涨价前的拉货，下半年因需求提前透支及组件成本上涨导致的负价格弹性，预计环比下滑3%，全年预计下滑8%。尽管出货承压，但一线品牌通过产品组合调整及涨价（上半年ASP同比涨20-30%，完全传导了记忆体30%的BOM成本涨幅），利润率表现优于预期，而ODM环节利润则受到挤压。显卡与主板市场因缺乏新品刺激及记忆体短缺，下半年仅环比微增5%，全年出货量预计双位数下滑。 重点个股推荐 台达电（2308 TT，增持）：深度受益于AI电源与液冷趋势，三四季度营收预计环比增长16%/14%，HVDC及110kW电源架新品将在四季度放量。 信骅（5274 TT，增持）：BMC芯片供应瓶颈在下半年缓解，三四季度营收预计环比增长19%/33%，AST2700新品将在2027年加速渗透，带动ASP提升。 联想集团（992 HK，增持）：基础设施方案（ISG）业务迎来利润率拐点，AI服务器在手订单翻倍至540亿美元，预计FY27/28年ISG营收同比增110%/50%，OPM从0.4%跃升至9.3%。 智邦科技（2345 TT，增持）：领跑AI网络升级，Meta 800G项目份额回升及AWS T3项目下半年放量将驱动其数据中心交换机收入实现92%的CAGR。 纬颖（6669 TT，增持）：同时卡位GPU、AI ASIC及通用服务器赛道，参与谷歌TPU v8/v9投标，预计2026/27年AI服务器营收增长73%/110%。#文字观点", "publish_time": "2026-08-23 20:51", "tags": ["文字观点"]}, "post:2026-08-23T19-40:f3d9c9956662": {"id": "post:2026-08-23T19-40:f3d9c9956662", "kind": "post", "title": "2026-08-23 19:40", "source_label": "帖子正文", "excerpt": "【英伟达AI服务器涨价超15%，高功耗算力时代加速，光模块、液冷及设备产业链迎景气共振】 英伟达AI服务器价格持续上行，机构认为，随着Blackwell、Rubin等新一代AI平台功耗持续提升，AI服务器单机价值量及液冷渗透率同步提升，全球算力资本开支高景气仍将延续。AI服务器正从“GPU堆叠”向“", "content": "【英伟达AI服务器涨价超15%，高功耗算力时代加速，光模块、液冷及设备产业链迎景气共振】 英伟达AI服务器价格持续上行，机构认为，随着Blackwell、Rubin等新一代AI平台功耗持续提升，AI服务器单机价值量及液冷渗透率同步提升，全球算力资本开支高景气仍将延续。AI服务器正从“GPU堆叠”向“超节点+高速互联+高密度液冷”演进，光模块、液冷、测试及自动化设备等环节均有望迎来增量需求。 高速互联端，#中际旭创、新易盛是核心受益标的。随着GPU集群规模扩大，800G、1.6T乃至更高速率光模块需求持续提升，英伟达新一代AI平台迭代有望进一步推动高速光模块放量，头部厂商凭借技术、产能及客户优势，有望持续受益。 液冷端，#英维克、高澜股份、飞龙股份值得关注。AI GPU功耗不断提升，传统风冷散热逐步接近极限，液冷成为高功率AI服务器重要散热方案。英维克覆盖冷板、CDU及数据中心温控系统；高澜股份布局冷板式、浸没式液冷及CDU等产品；飞龙股份持续布局数据中心液冷相关产品，AI算力中心建设有望带动液冷散热需求持续增长。 测试及自动化设备端，#博杰股份、凯格精机、强瑞技术有望受益。博杰股份已布局AI服务器测试设备，并推进液冷测试方案；凯格精机以锡膏印刷设备为基本盘，向点胶、精密装配及光模块自动化设备延伸，受益于光模块扩产；强瑞技术则布局服务器测试、组装及精密制造设备。 整体来看，AI服务器涨价背后对应的是算力资本开支、高速互联升级、GPU功耗提升及液冷渗透率提升，产业链景气有望继续向上。#文字观点", "publish_time": "2026-08-23 19:40", "tags": ["文字观点"]}, "attachment:files/中际旭创26H1交流.docx": {"id": "attachment:files/中际旭创26H1交流.docx", "kind": "attachment", "title": "中际旭创26H1交流", "source_label": "其他", "excerpt": "会议要点 1. 2026年上半年核心业绩情况 • 2026年上半年收入同比大幅增长，同时保持季度业绩环比增长的态势；2026年Q2收入较Q1增长约15%，但增幅低于利润增幅，主要受Q2各环节产能爬坡阶段交付问题影响，实际订单需求强劲。", "content": "会议要点 1. 2026年上半年核心业绩情况 • 2026年上半年收入同比大幅增长，同时保持季度业绩环比增长的态势；2026年Q2收入较Q1增长约15%，但增幅低于利润增幅，主要受Q2各环节产能爬坡阶段交付问题影响，实际订单需求强劲。 • 盈利能力方面： • Q2毛利率环比Q1持续提升，主要由1.6T产品出货占比环比增长的出货结构优化贡献。 • Q2净利润率较Q1提升约3个百分点，扣除非经常性损益后仍保持较好的利润率增长；非经常性损益主要来自对上游供应链关键环节上市公司投资的公允价值变动收益。 • 费用端：Q2三项经营费用与Q1基本持平，个别费用低于Q1，主要因为Q1包含子公司一次性事项、2025年底追溯的额外超支服务费结算等一次性费用；Q2财务费用高于Q1，主要是美元汇率走弱带来的报表层面未实际实现的记账汇兑损失。 • 运营指标说明： • Q2应收账款余额较Q1增长明显，主要因为6月当月出货量较高，月末余额集中，所有客户账期、收款节奏均未发生变化，北美客户仍保持30-45天的正常回款周期。 • Q2经营性现金流下降，主要是为应对旺盛需求大规模备货采购原材料，其中包含大量提前备料；预付账款、其他非流动资产均与备料高度相关，其他非流动资产中的预付款为锁定2027年物料交付的1年以上预付款。 • 汇兑损失情况：Q1汇兑损失约3亿元人民币，Q2汇兑损失约4亿元人民币，其中包含因境内外子公司关联往来会计准则处理差异导致的账面浮亏，并非实际发生的损失；已结汇部分的汇兑损失控制在合理水平。 2. 行业需求与供应情况 • 需求端：全球AI及大模型训练、推理对算力的需求持续快速增长，拉动高端光模块需求，800G、1.6T产品持续放量；全球云厂商对AI基础设施建设投入坚定，2026年二季度末多家客户发布财报时纷纷上调2026年及2027年的资本开支指引，算力芯片配置规格持续升级，AI集群网络中光模块与芯片的配套比例进一步上升。 • 供应端：2026年上半年光芯片、电芯片、PCB等核心物料整体供应偏紧张，上游核心物料扩产速度慢于需求增长速度，部分物料存在涨价压力；1.6T对应的3nm制程DSP、800G对应的5nm制程DSP供应偏紧，2026年核心物料供应紧张状态仍将持续，每个季度会有边际改善，预计2026年下半年到2027年上半年随上游供应商扩产逐步缓解。 • 公司保供措施：通过提前预判，采用长协、预付款、导入新供应商的方式锁定供应，供应能力处于行业较高水平；大客户对核心DSP等物料拥有主导权，公司凭借在客户端的高份额和良好交付能力，可获得足够的核心物料供应。 3. 产品布局与未来规划 • 现有主力产品：目前已获得主要客户2027年的指引和订单，1.6T、800G订单需求相较2026年保持快速增长；1.6T在传统CSP客户中份额稳定牢固，竞争格局无明显变化，新进入友商主要面向新云客户。 • 新产品布局： • 2.4T、CPO、LPO、NPO等新产品根据大客户定制要求积极开发、送样，预计2027年下半年开始量产出货，2028年实现更大规模出货。 • NPO方案易维护、成本和可靠性有优势，适配GPU互联场景，目前已有2家行业大客户给出明确需求、指引甚至订单，更多客户预计2028年开始采用；公司在NPO研发、客户沟通、意向导入阶段均处于领先位置，已与几乎所有CSP客户、部分芯片厂商客户沟通并开展定制化开发、送样，是2027年最早交付的供应商之一。 • CPO包含内置光源、外置光源两种方案，公司均有布局，2027年将率先应用于scale-out场景，后续逐步扩展到scale-up场景，未来光互联技术将呈现可插拔、NPO、CPO等多元化方案并存的格局，公司将参与多形态方案开发。 • 产能建设：2026年资本开支规模较大，主要投向设备和多地厂房扩建，小部分产能2026年下半年落地，绝大部分产能2027年投入使用；全年扩产力度较大，下半年支出将高于上半年，2026年7月完成港股发行融资约70亿港元，为后续扩产、备料提供资金支撑。 • 产能区域分布：当前已发货产品产能境内境外各占约一半，CPO、NPO等新产品产能将更多布局在海外，后续新产品海外产能占比会逐步提升。 4. 毛利率趋势与竞争壁垒 • 短期毛利率展望：当前毛利率处于较高水平，公司目标是维持毛利率稳定，争取小幅增长，1.6T出货占比提升、硅光技术渗透率提升是正向支撑，上游物料涨价是负向压力，公司将通过内部效率优化、与客户协商传导部分涨价压力抵消负面影响，不会追求季度大幅增长。 • 长期毛利率支撑：2027年起2.4T、CPO、LPO等更高带宽、高度定制化的新产品逐步上量，毛利率优于现有产品，将带来更大的毛利提升空间。 • 技术壁垒：公司在硅光、先进封装、薄膜铌酸锂、InP、光电混合集成等领域有多年技术沉淀，部分技术研发时间长达10年以上，能够适配2.4T、3.2T、CPO、LPO等下一代产品的开发需求，新产品技术门槛高，客户可选供应商范围有限，公司竞争优势突出。 5. 其他经营相关信息 • 订单与长协：过往客户订单周期为3个月，目前客户已普遍给出2027年全年订单，部分客户正在商谈更长期的长协。 • 费用率展望：Q2研发、管理费用率较低主要是Q1一次性费用抬高基数、收入规模快速增长摊薄费率导致；后续研发费用绝对额、研发费用率均会有所增长，营运费用将通过规模效应保持在健康低位。 • 汇兑应对措施：通过缩短境内外子公司关联轧账周期减少会计准则带来的账面汇兑损失，针对确定的结汇需求采用锁汇、套保方案，存在经济适用的远期结售汇产品时也将及时采用，多手段控制汇兑损失。 • 贸易政策相关：2026年8月已有大量重要客户将2027年的指引转化为实际订单下达给公司。 Q&A Q：公司后续毛利率趋势如何？上游物料供应逐步缓解后，毛利率是否会有进一步改善？ A：目前公司毛利率处于不错的水平，短期目标是维持毛利率稳定，争取实现小幅增长，不具备每个季度大幅提升的条件。支撑毛利率的正向因素包括：1.6T产品市占率较高，后续出货占比将持续提升；硅光产品渗透率不断提高，这两项也是过去几个季度毛利率提升的主要驱动因素。负向因素为上游物料存在涨价压力，公司会通过正向因素抵消部分影响，同时与客户协商将部分涨价压力向下传导。2027年随着2.4T、CPO、LPO等新产品逐步上量，这类产品因带宽更高、客户定制化程度高，毛利将优于现有产品，有望带来更大的毛利提升空间，产品结构升级是长期提升整体毛利的核心动力。 Q：二季度应收账款较一季度增长明显、账期有所增加的原因是什么？公司如何看待该情况？ A：二季度应收账款余额增长主要和出货节奏相关，6月当月出货量较高，月末应收账款余额因此抬升，并非是客户账期或收款节奏发生变化。目前所有客户的账期均未调整，平均周转天数保持稳定，其中北美客户回款周期基本维持在30-45天，回款情况正常，相关风险可控。 Q：公司NPO业务的客户合作、研发进展如何？2027年相关需求情况是怎样的？ A：NPO是目前广受CSP客户欢迎的光互联解决方案，主要应用于GPU场景，在易维护性、成本、可靠性和稳定性方面具备优势，可充分利用现有光模块PIC、EIC贴片工艺。目前行业内已有两家头部客户给出明确的NPO需求、指引甚至订单，预计2027年开始出货，更多客户预计2028年启动NPO部署，公司正与这些客户积极沟通，推进送样及定制化开发工作。 Q：上游原材料涨价是否会对公司成本造成压力？公司如何应对相关影响？ A：上游核心物料扩产速度慢于下游需求增速，确实存在供给紧张和涨价情况，但公司需求量大、价值量高的核心物料涨价幅度并不大，且公司已签订长期供货合约、锁定大额订单，采购价格具备相对优势。同时公司产品价格降幅有限，不存在市场传言的大幅降价情况，后续将通过规模效应提升、良率优化、2027年新产品量产等方式降低成本，维持毛利水平。 Q：明年1.6T的DSP光芯片、MZ PIC的紧缺程度目前缓解情况如何？预计何时不再供应紧张？近期1.6T DSP供应紧张程度有所加剧是否会导致明年光模块交付格局进一步向头部厂商集中？ A：1.6T DSP光芯片、MZ PIC目前供给确实偏紧张，2026年仍会维持偏紧态势，不会有明显改善，但每个季度会有环比边际提升，整体供给持续向好。上游供应商正在积极扩产，相关产能会在2026年下半年到2027年上半年逐步释放。 1.6T对应的3nm先进制程、800G对应的5nm先进制程的DSP产能供给相对偏紧，但总体仍能保持足够供应。由于大客户对这类核心物料拥有主导权，只要在客户端拥有足够份额且保持良好交付能力，就能拿到足够的DSP核心物料。 Q：2026年二季度公司管理费用率、研发费用率下降的核心原因是什么？全年费用率展望如何？ A：二季度费用率下降的核心原因，一是2026年一季度存在子公司一次性费用、年末追加费用调整等非经常性支出，拉高了一季度的费用基数；二是公司收入规模基数大幅上涨，拉低了费用率。 后续研发费用的绝对额肯定会增长，公司也在推进多个新研发项目，研发费用率会逐步上升；营运费用受益于规模效应，会保持在较低的健康水平。 Q：2026年二季度公司经营性现金流下降的原因是什么？同期资本支出大幅增长主要投向哪些环节？ A：二季度经营性现金流下降，主要是因为当前需求旺盛，公司在保障交付的同时积极备产备料，当期上半年经营活动现金流支出绝大部分用于购买原材料，其中包含大量提前备料的支出。相关支出可以从预付账款、其他非流动资产两个科目得到佐证，二季度较一季度这两个和备料相关的科目有明显增长，其中其他非流动资产中的备料预付款是锁定2027年交付的长期备货。 资本支出增长主要投向两个方向：一是设备，二是多地厂房扩建。目前在建的产能中，小部分会在2026年下半年交付投产，绝大部分会在2027年交付投入使用，其中厂房基建类投资占比更高，设备类付款周期相对更短。 Q：美国信息技术产业理事会反对将光模块纳入Covered List，是否意味着光模块相关的潜在出口风险大幅减少？ A：目前该事件没有进一步的消息，不方便评价。可以说明的两点是：第一，光模块是当前AI数据中心的关键部件，公司在光互联产品领域行业地位重要，在客户端的份额也很高；第二，2026年8月，公司的重要客户已经将2027年的需求指引转化为实际订单下发。 Q：1.6T光模块领域新进入者是否会对公司造成竞争压力？NPO产品方面公司的竞争优势和行业地位如何？ A：1.6T目前已经成为数据中心Scale-out的重要方案，下游客户结构呈现多元化，除传统CSP、AI ASIC厂商外，还包括新云厂商、大模型公司，行业需求增长迅猛，预计2027年全球1.6T光模块整体需求量非常大，因此会有友商进入行业并拿到一定份额，但公司在现有CSP客户中的份额非常稳定稳固，该领域不会有太多新进入者，新进入的友商更多是布局新云厂商客户，CSP客户的1.6T交付仍主要交给原有固定供应商，整体竞争格局不会有太大变化。NPO产品方面，公司目前在研发、客户沟通、意向导入等环节均处于行业领先位置，已经与几乎所有CSP客户、部分芯片厂商客户保持积极沟通，部分产品和技术已经按照客户要求开展定制化开发甚至送样，有把握率先通过客户认证，有望在2027年实现首批交付；由于NPO产品存在高度定制化要求，客户不会开放太多合作机会，率先进入定制开发环节的厂商将具备明显竞争优势，公司有望在该产品领域保持领先的竞争地位。 Q：公司2026年一二季度的汇兑损失分别是多少？套期保值的实际效应如何？后续控制汇兑损失有哪些策略？ A：汇兑数据方面，2026年一季度单看汇兑损失约3亿元人民币，二季度单看汇兑损失约4亿元人民币，该数值受会计准则影响比真实情况偏高，主要原因是境内子公司与海外子公司的关联方往来中，境内侧美元计价的关联方往来汇兑损失计入利润表，而海外子公司的相关汇兑损失在报表合并时计入其他综合收益，两者无法抵消，导致报表出现账面浮亏，这部分属于会计准则带来的非真实损失。套期保值方面，当前美元利率较高，远期外汇合约成本较高，没有特别有效的工具可覆盖非现金类资产敞口，公司仅针对确定的结汇需求开展锁汇、套保操作，已实现的汇兑损益一直控制在合理水平，目前暂未统计套期保值下的汇兑损益及敞口的具体数据，后续可安排团队梳理后提供。后续汇兑损失管控策略包括：一是缩短境内外子公司关联轧账周期，减少会计准则带来的账面汇兑损益影响；二是持续跟踪远期结售汇产品的性价比，一旦出现经济有效的产品，会及时开展相关操作，通过组合方案控制汇兑损失。 Q：CPO的发展趋势如何，如何看待CW Laser集成在模块中的相关技术方向？ A：CPO目前有内置光源和外置光源两种方案，两种方案公司都在开发，会根据不同客户的需求提供适配方案。 Q：北美客户是否有和公司探讨过签订物料长协的相关想法？ A：过往光模块行业常规订单周期为3个月，目前很多客户已经给到2027年全年订单，订单周期相比过往惯例有很大提升，同时有部分客户确实在和公司洽谈签订长协，相关事项还在协商过程中。 Q：二季度预付款环比下降，是否意味着下半年订单的物料供应保障没有问题？目前公司储备物料、支付预付款更多是针对2027年甚至2028年的物料需求吗？ A：公司的预付款仅针对关键品类的关键供应商，不会对所有物料都支付预付款，放在长期资产项下的预付款更是针对长期物料储备的安排。目前行业整体物料供应仍然紧张，公司预计2026年Q3的物料供应情况会较Q2环比继续向好改善。公司通过锁料、预付、签订MOU等多种方式保障物料供应，同时公司客户端份额相对确定且规模较大，在供应商的份额分配中具备相对优势，物料供应有相应保障。 Q：在CPO、LPO、2.4T等新产品涉及的硅光、先进封装、第三代材料等新技术领域，公司具备哪些优势和技术壁垒？ A：这些新产品涉及的相关技术，公司很多已经有多年技术沉淀，部分技术开发时间长达十年以上，能够根据客户的定制化要求开发适配产品，技术壁垒较高。尤其是硅光、Super Light等技术可应用于未来新产品，让技术曲线变得非常陡峭，目前能掌握相关技术、进入客户供应体系的厂商数量偏少，公司在该领域具备明显竞争优势。 Q：公司后续几个季度的整体扩产力度如何，今年的投入强度会有怎样的变化？ A：2026年整体扩产力度较大，下半年支出也会处于较高水平，投入强度相比上半年还会有所增加。公司2026年7月完成港股发行，融资约70亿人民币，为后续扩产、备料、捕捉市场增量机会提供了有效支撑，同时港股平台打开后后续融资更加便捷，能够为业务增长提供依托。当前扩产的核心支撑是订单能见度很高，下游需求非常旺盛，客户资本开支强劲。 Q：公司的硅光技术优势，能对份额提升起到怎样的支撑作用？ A：硅光技术在后续先进封装中会发挥非常关键的作用，在2.4T、下一代3.2T、CPO、LPO等各类新产品中都将得到重要应用。光模块技术发展需要综合使用硅光、薄膜铌酸锂、InP等多种技术方案，还要实现光电芯片混合集成，整体结构越来越复杂，公司在相关技术研发上具备优势，能够支撑公司在新产品领域保持较好的市场份额。 Q：公司如何看待CPO市场的需求和落地节奏，在scale-out和scale-up两类CPO上的参与进展如何，相关产品方案有什么差异化特点？ A：目前CPO已率先在scale-out场景应用，2027年CPO将开始在scale-up领域广泛应用，会成为众多CSP客户普遍接受的技术方案，在柜间互联等场景中都将有相关应用。同时可插拔模块仍会在scale-up和scale-out两类场景中得到应用，包括4T、未来的3.2T产品以及高密度可插拔的STO都将覆盖两类场景，未来光互联技术形态不会是单一方案，而是多元化共存，涵盖可插拔、NPO、CPO等多种形态，公司会发挥技术优势，积极参与多种形态的光互联解决方案研发。 Q：公司二季度以及全年资本开支在国内、国外的产能分配比例大概是多少，海外产能建设是否可以满足2.4T、NPO等新产品的海外出货需求？ A：CPO、NPO等新产品的产能会更多布局在海外，目前已发货的新产品初期是境内境外同步出货，境内外产能占比大概为一半一半，后续随着新产品渗透率提升，海外产能的占比会进一步提高。", "status": "extracted"}, "attachment:files/百亿基金经理内参 20260823.pdf": {"id": "attachment:files/百亿基金经理内参 20260823.pdf", "kind": "attachment", "title": "百亿基金经理内参 20260823", "source_label": "其他", "excerpt": "-1- （2026年8月23日星期日第274期） “每周机构会谈” ——————————————本期重点————————————— ★美元让位、美债优先：黄金的“长牛底牌”更清晰 ★AI二阶导博弈升温：9月仍是做多窗口，科技回调就是加仓点 ★中际旭创中报“过关”，FCC利空兑现或成情绪反转点 ★半导体设备贝塔未变，但先进封装等方向的阿尔法更值得关注 ★黄金短", "content": "-1- （2026年8月23日星期日第274期） “每周机构会谈” ——————————————本期重点————————————— ★美元让位、美债优先：黄金的“长牛底牌”更清晰 ★AI二阶导博弈升温：9月仍是做多窗口，科技回调就是加仓点 ★中际旭创中报“过关”，FCC利空兑现或成情绪反转点 ★半导体设备贝塔未变，但先进封装等方向的阿尔法更值得关注 ★黄金短期追涨难度加大，铜的性价比正在凸显 ★医药短期已经偏热，追涨不如等回调 ★内需没有贝塔，但教育、黄金珠宝仍有独立阿尔法 ★保险资负新规落地，红利资产再迎8000亿长线买盘 ★杠铃结构正向成长倾斜，景气方向仍是市场最强主线 ★AI三大风险点逐一暴露，周中暴跌后风险有所出清 ★AI回调错杀电网设备？国产话语权提升，回调后有望新高 ★AI制药有望从“刮彩票”变成“算力试错”，或重写商业模式 ★长存业绩看齐长鑫，资本开支预期或上修，半导体设备再迎催化 ★宏观越弱，市场越极致：科技有色出海+稳健红利仍是优选 -2-———————————————正文—————————————— 本期会谈，《百亿基金经理洞察》邀请数位买方机构的基金经理，对大盘、 政策、以及后市投资机会等进行深度交流。 ★美元让位、美债优先：黄金的“长牛底牌”更清晰 这周海外市场的变化比较多，美债不断上行，科技股一度大幅下跌，包括黄 金的上涨，我们把逻辑重新捋一下。 美债方面，10年期美债在一个高位横盘的状态，30年美债创了07年以来的 新高，主要就是不同的久期对应的融资需求有一定的变化。 10年期美债一般对应之前的房地产经济需求，30年美债可能对应像AI的融 资需求，都是超长久期。所以现在AI的基建所需资金的提高，循环融资、 担保增信这种措施不断被提出，带来30年美债不断的上行。 美联储随即进行了回购，压低了长端的收益率，但是随后收益率又重新反弹。 美元指数没有跟着美债收益率去反弹，市场把这种行为解读成，大家对于美 国的财政纪律进一步趋势的担忧，也可以理解为贝森特在不可能三角里选择 了牺牲汇率保住美债收益率。 所以黄金出现了比较明显的上涨，美元指数也开始走弱。 往后看，短期黄金股的这种快速上涨，可能需要一定的震荡消化，而且沃什 -3-大概率会系统阐述他的政策框架，降低市场对政策的不确定性，市场对于美 元或者美债的流动性危机的担忧可能会有一定的减弱。 黄金短期大幅上涨可能需要一定的消化， 中长期的黄金大逻辑肯定是在加强 的，一方面是央行购金的行为还在持续，另外就是美国的K 型经济分化在不 断加剧，美国的一些本土消费股的业绩指引不太好。 现在来看，K 型的分化，加上 AI 高融资的需求，对于黄金中长期的行情还 是比较有利的。 ★AI 二阶导博弈升温：9 月仍是做多窗口，科技回调就是加仓点 AI 本周最核心的一个事件就是Anthropic的 ARR数据低于预期。 我们具体来看这件事情，Anthropic的 ARR低于预期以前也有过，之前它低 于预期的时候也没有对 AI上涨趋势造成太大的影响。 但是现在这个位置上，很多投资者愿意去博弈二阶导的变化，但如果今年年 底 ARR 能到 1000 亿这个体量的话，从现在的 650亿到 1000 亿，其实并不需 要特别大幅的快速上涨。 如果大家拿 1000 亿去来做预期的标杆，到年底实现的概率，包括所需要的 增速不是特别高，实现概率还是比较大的。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408 -4-对应到我们的A股市场，我们跟上周的观点是一致的，9月份还是一个比较 好的做多窗口，或者说下周市场能有一定回调，如果有回调，可以再进一步 提高一些科技的仓位。 除了这个逻辑，美元下行现在把黄金股带上来了，但黄金股现在涨得比较快， 其实对于科技股也相对来说是比较利好，在这个维度上对科技流动性也有一 定的缓解。 ★中际旭创中报“过关”，FCC利空兑现或成情绪反转点 科技里面还是可以找一些新技术的方向，上周也提到过，比如说上游的光器 件，现在来看是弹性最好而且分歧比较小的方向。 比如NPO、CPO这些光引擎无源器件，占比可能从10%-15%提升到30%，FAU 的价值量大幅提升，对一些不受FCC影响的光模块公司，包括像FAU二线的 光芯片公司来讲，可能弹性还是比较大的，整体上来看，NPO、CPO这些方 向还是放到首选。 大光来看，像中际旭创最新的中报业绩还是不错的，符合预期，但是符合预 期其实也就是一个略超预期的状态，之前对业绩层面的担忧有一定的缓解， 大家就是担忧FCC这件事情，如果能逐步的消化甚至有一定落地的话，对于 情绪面的影响可能会更为正面。 ★半导体设备贝塔未变，但先进封装等方向的阿尔法更值得关注 -5-国产这一块目前来看，半导体设备我们虽然还看好贝塔，但是这里面阿尔法 其实相对来说会更重要一些，像老化测试机可能是一个需求暴增的方向，也 是国内能更快落地抢占的机会。 同时像先进封装，国内第一条CoWoS预计很快通线，先进封装也进入了实质 性的扩产潮，检测需求这些细分方向，比如说AI射线检测设备这些，可能 都有比较好的阿尔法。 ★黄金短期追涨难度加大，铜的性价比正在凸显 刚才也提到黄金，周一肯定黄金股是要高开的，在这个位置上，短期可能再 追涨黄金股挣钱的难度可能会提升。 更关注铜，尤其像龙头的铜公司也有黄金业务，而且估值现在非常便宜。 ★医药短期已经偏热，追涨不如等回调 医药板块我们从中期维度上也是看好的，但是炒到像周四mRNA出来利好之 后那样一个状态，短期有一点稍微过热。 如果有一定回调，还是可以参与，但是也不建议追涨。 ★内需没有贝塔，但教育、黄金珠宝仍有独立阿尔法 -6-内需方向，最近出来的一些公司业绩确实都是比较差的，整体内需的贝塔肯 定还是没有，从这个维度上看的话，市场资金也只能去买AI、有色、创新 药这些方向。 但内需里面有一些方向肯定还是有阿尔法机会的，比如上周我们提到的地产， 这周可以再看一下。 教育板块，像k12教培、职业教育这些赛道，现在需求端的景气度都还是不 错的，上半年的主营业务业绩也都不错，内部决策效率的提高也提升了利润 率，比较看好教育板块。 还有黄金珠宝，随着金价的上涨，黄金珠宝可能行情又有所启动，很多公司 现在估值其实都处在一个非常便宜的状态。 A股的这些公司可能也就10倍出头的水平，港股有些公司只有个位数5倍 左右的估值，股息率有的接近10%的状态，即使拿它当成一个红利股都是一 个很不错的标的，黄金珠宝我们也是比较看好的。 ★保险资负新规落地，红利资产再迎8000亿长线买盘 周五出来的保险行业资产负债管理新规，对保险资产和负债的要求提出了非 常明确的量化和时间的要求。 -7-具体细则我就不说了，核心的结论是，在这个约束之下，险资要加大对高股 息红利的配置力度了，测算下来比较乐观的认为，3年内会增加接近8000 亿买高股息股票，对市场来说是一个很大的增量资金，影响是比较大的，后 面要重点去跟踪这个事情。 我后面会把相关的测算信息发在群里。 ★杠铃结构正向成长倾斜，景气方向仍是市场最强主线 市场结构的变化在我们判断的轨道中，因为近期是中报季，从已披露的中报 来看，内需红利仍然低于预期比较多。 像啤酒，像纺织服装当中的李宁，运营商当中的中国联通，快递当中的中通， 电商全系列，还有家电里的海信家电，这些中报都是比较差的。 科技的中报基本是符合预期或略超预期的状态，所以市场从结构来看，杠铃 的两侧会更偏向成长一些，景气度高的方向肯定还是市场追逐的方向。 最典型的是过去两周表现特别强的有色，聊过很多次了，但是我们聊的这个 时间点确实比较左侧，很多股票从我们第一次聊到现在可能已经涨了50%以 上了，好多公司都已经翻倍了。 为什么会有这么猛烈的行情？因为金价确实在快速上涨，有色整体的中报业 绩增长是非常快的，都是50%-150%的利润增长区间，一点都不比科技股弱。 -8-所以宏观的因素压制结束，再加上宏观的压制变成利好之后，市场就会有一 个比较剧烈的反弹的行情，也是合理的。这个位置接下来怎么看？ 我们还是看好的，金价还跟之前的观点一样，年内维持在4500～5000区间 的概率比较高，如果维持的话，黄金股还是能有修复的。 今年向上比较困难，远期的话可以看到5500~6000，我们也聊了一下市场上 比较乐观的观点，最乐观的认为远期黄金会回到5000美金以上，甚至是看 到1万美金，产业链的趋势现在是一个完全走右侧的逻辑了，还可以继续拿 着。 现在因为很多公司涨了很多，优先买估值低同时产量增长比较快的公司，因 为当风险偏好高的时候要买量增的公司，像港股当中的灵宝、万国、中国黄 金国际、赤峰这些，是相对比较好的。 黄金领涨，可能会扩散到有色其他板块，包括像铜价也在高位，但很多铜公 司股价很低，还有锂矿经过对碳酸锂价格的消化之后，也在一个很低的位置， 都有可能被扩散到。 ★AI三大风险点逐一暴露，周中暴跌后风险有所出清 AI板块周中暴跌，主要是叙事的反转。 -9-之前提示过三大风险，云厂的资本开支、杠杆资金和叙事，这次爆的就是叙 事。 所谓的叙事就是行业发展有重大的转折点，这次就是Anthropic的ARR不及 预期，在交易结构非常拥挤的背景之下，这三大风险点都逐一暴露了。 因此我们认为风险就不大了，因为担忧的所有灰犀牛都变成了所谓的黑天鹅 事件。 可以看到有一个板块最近涨得非常强，不管是美股还是A股，就是医药，因 为它跟AI也沾上了一些概念，同时它也不是纯概念，确实有比较强的基本 面。 AI肯定是大家还会去重点布局的方向，大的贝塔风险释放之后，现在去寻 找做多的机会，除了大家比较看好的像光模块、PCB这些传统的之外，我们 找了一些新的方向，确实还不错。 ★AI回调错杀电网设备？国产话语权提升，回调后有望新高 一个是电网设备，因为电网设备在下一代的RubinUltra的架构之下，供电 电压有比较明显的变化，从传统的400伏提升到800伏，会带来里边很多产 品结构的升级和迭代，价值量也会提升，产品形态也会变得更复杂。 以前的这些产品主要是被外资台资垄断，现在随着交期拉长供不应求，另外 -10-有新的产品升级，确实给了国内企业一些机会。 这个板块国内企业的技术实力没有那么弱，跟海外企业的差距不是很大，北 美的客户比较喜欢用供应稳定、有历史业绩证明的供应商，现在由于缺货， 未来有像固态变压器、超级电容等一些新产品的情况下，国内企业导入的概 率在提升。 以变压器为例，海外公司的交付确实遇到了困难，国内像金盘科技、思源电 气确实是拿到了不错的订单，而且出口的窗口期也就是近两年，所以周五金 盘科技涨了十几个点，就是类似这样的一个逻辑。 我们认为未来这个逻辑还是会持续，因为它也是一个通胀的环节，同时国内 企业的话语权在提升，所以电网设 ———— 行情复盘：计算机(中信)指数本周下跌5.22%，创业板指数本周下跌2.23%，上证指数本周下跌0.56%。板块周涨幅前三为麒麟信安（+17.21%）、朗威股份（+15.41%）、诚迈科技（+14.66%）", "content": "【东北计算机】20260823行业周报：持续关注技术升级线 —————————————— 行情复盘：计算机(中信)指数本周下跌5.22%，创业板指数本周下跌2.23%，上证指数本周下跌0.56%。板块周涨幅前三为麒麟信安（+17.21%）、朗威股份（+15.41%）、诚迈科技（+14.66%）；周跌幅前三为合合信息（-22.97%）、朗新科技（-18.41%）、普联软件（-16.65%） 行业观点： 1. HBM供需缺口成为今明年存储主要关注点，继续关注海外海力士和国产HBM进展；2.关注涨价链中的技术升级方向，新一轮估值30x需要靠AI高端产品含量&订单；3.继续关注技术变革带来的新技术渗透：液冷材料升级&金刚石散热&玻璃基板&电源架构升级。 行业重要新闻： 国内 1. 国家统计局8月17日表态，7月国内工业经济总体平稳但仍面临有效需求不足等压力，下一阶段将深入实施“人工智能 +”行动，着力打造新兴支柱产业，推进传统产业改造升级。（来源：财联社） 2. 百度发布 2026Q2 财报，总营收 313 亿元，AI 业务收入占比连续两季过半；AI 云基础设施收入 73 亿元同比 + 50%，GPU 云同比大增 283%，连续四个季度三位数增长。（来源：财联社） 3. 长存控股向湖北证监局提交辅导工作完成报告，IPO辅导状态变更为辅导验收。（来源：科创板日报） 4. 紫光国微称受晶圆等上游原材料成本上涨，未来不排除存储产品涨价；公司特种存储市占率约 80%，长期看好特种存储芯片市场需求。（来源：财联社） 国际 1. Anthropic内部预测2028年营收可达1900‑2000 亿美元，公司预计将于10月IPO，估值有望达到2万亿美元，将成为史上规模最大IPO之一。（来源：财联社） 2. 集邦咨询数据，2026Q2 受 AI 服务器企业 SSD 需求旺盛驱动，全球前五大 NAND Flash 厂商合计营收环比增长 77%，达 688.7 亿美元，市场供不应求带动产品 ASP 上调。（来源：科创板日报） 3.SK 海力士顶刊发文阐述 CPO 发展进程与挑战，提出 “以光为中心” 架构，计划将光互连扩展至内存接口，认为 CPO 是系统级 HBM 创新规模化的关键，用以解决 AI 集群带宽墙问题。（来源：科创板日报） 4.受三星、SK 海力士扩产拉动，韩国主要半导体设备商上半年末订单积压量较去年底实现翻番，两大存储厂商还提前晶圆厂建设竣工时间。（来源：科创板日报） ☎️欢迎联系东北计算机团队#文字观点", "publish_time": "2026-08-23 19:18", "tags": ["文字观点"]}, "post:2026-08-23T15-40:7d23f49a033a": {"id": "post:2026-08-23T15-40:7d23f49a033a", "kind": "post", "title": "2026-08-23 15:40", "source_label": "帖子正文", "excerpt": "一些关于 “英伟达告知其最大客户，搭载其 AI 芯片的服务器价格将上涨超过 15%。” 的一些多空讨论和解读。", "content": "一些关于 “英伟达告知其最大客户，搭载其 AI 芯片的服务器价格将上涨超过 15%。” 的一些多空讨论和解读。 彭博社消息：英伟达已告知其最大客户，由于内存成本飙升，搭载其 AI 芯片的服务器价格将上涨超过 15%。 此次涨价将适用于明年年初发货的系统。 消息补充：英伟达部分头部大客户被告知，在多数场景下，搭载其人工智能芯片的服务器价格涨幅将超过 15%，背后原因为内存芯片成本大幅走高。 本次涨价将对明年初交付的设备生效，影响范围包含搭载旗舰 Vera Rubin 以及 Grace Blackwell 芯片的服务器，以上信息来自知情人士，相关沟通内容尚未对外公开。 涨价幅度会根据英伟达芯片代际、内存配置的不同而产生差异。 Steven Martin 观点：显然，英伟达并不担心需求问题。 他们本已拥有非常健康的利润率，如果因为供应商成本抬升而进一步上调产品价格，恰恰印证需求端依旧强劲。 如果只是涨价这么简单就好了。 P Equity Research 观点：摩根士丹利报告指出，即便内存成本处于高位，服务器需求本质上依旧缺乏弹性，所以英伟达完全没有压力上调产品价格。 Joe Gibby 观点：你们不至于真的这么迟钝吧。 我打算一整年都 *7.5 万亿美元**，年度赤字 2 万亿美元，赤字占 GDP 约 6%；利息支出接近 1 万亿美元；有约**10 万亿美元存量国债即将到期，需要再融资**。 2. 危机时间预判：**如果维持当前政策轨道不变，债务危机大约三年左右到来，上下误差两年（也就是 1‑5 年区间）**。 > > 注意：这是模型推演的情景预判，不是确定性预言；战争、政策改革、经济强弱，都可以提前或者延后危机。 3. 底层逻辑（大债务周期理论）： 随着债务利息越来越高，如果市场买债需求不足，政府只有两条出路： ①接受更高的国债利率，进一步加重付息负担； ②央行印钞购买债务； 两条路径最终都会带来**货币贬值、通胀上行**。 4. 解决路径建议：必须把赤字从 6% 压缩到 3%；手段三管齐下：削减政府开支、增加税收、压低利率。同时提示英国、日本同样面临相似财政压力。 ## 二、资产配置建议 1. **低配债券**：主权债务风险抬升环境下，债券偿付风险上升。 2. **黄金：组合配置 10%‑15%**：作为非政府发行的硬资产，对冲主权债务、货币贬值风险。 3. **少量配置比特币**：同样属于不受政府无限印钞约束的资产，但强调是 “少量”，他始终认为比特币波动率远高于黄金，避险属性弱于黄金，更多作为期权式对冲，不能取代黄金新浪财经。 4. 整体原则：**跨资产、跨国多元化布局，优先选择财政状况健康的国家资产**，不要押注单一方向。 > > 补充达利欧一贯立场：黄金是成熟储备资产；比特币波动极大、监管不确定性高，适合小仓位对冲，不建议重仓押注。 ## 三、和本周市场行情的共振（结合前面美股收盘新闻） 1. 时间巧合：文章发布的周五，**黄金大涨 2.17% 站上 4670 美元，比特币周度暴涨 23%**。一部分资金会把达利欧观点作为做多黄金、加密的逻辑支撑，但行情同时还有多重驱动： - 贝森特国债回购带来流动性预期； - 中东地缘冲突避险； - 比特币空头轧空、监管法案预期。 2. 美债层面：本周市场已经在定价美国财政不可持续，贝森特扩大回购被市场认为只是**债务期限腾挪，治标不治本，不能解决 2 万亿赤字根源**，和达利欧的判断互相印证。 3. 现实矛盾：财政部可以做回购操作，但很难真正做到大幅压缩财政赤字，也就是达利欧所说的真正的解决方案执行阻力很大。 ## 四、客观看待这份警告的两面（理性视角） ✅ 合理部分： 1. 美国 40 万亿总债务，利息支出快速膨胀，赤字率长期处在 6% 高位，是客观现实；当债务利率大于经济增速，会进入债务自我放大的螺旋风险。 2. 历史大周期案例证明：高债务国家，最终要么财政紧缩、要么债务重组、要么货币化印钞稀释购买力。 ⚠️ 需要警惕的地方： 1. 三年（±2 年）是情景推演，**并非必然发生**。美国拥有美元全球储备货币地位，和普通新兴市场主权债务危机不能简单类比。如果未来出现大规模财政改革，危机情景可以被延后甚至避免。 2. 资产建议是宏观对冲基金的配置思路，**不直接适合普通个人投资者**；黄金、比特币本身波动巨大，也存在价格回调风险，不是稳赚的避险保险箱。 ## 五、串联全部跨市场主线 1. 达利欧核心担忧：**财政赤字失控 → 再融资压力抬升 → 利率上行 / 货币贬值，利好非政府信用硬资产**。 2. 对应现实市场线索： - 美债：贝森特工具仅一日效果，长端利率高位震荡； - 大宗商品：黄金持续创新高； - 加密货币：流动性预期 + 监管博弈驱动比特币逼空； - A 股映射：国内贵金属板块持续走强； 3. 后续关键观察点：杰克逊霍尔会议、美国财政整顿是否落地、8 月 24 日贝森特发布会、美国财政赤字数据。 > > 风险提示：以上全部为机构宏观观点，**不能作为投资操作依据**。#文字观点", "publish_time": "2026-08-23 11:48", "tags": ["文字观点"]}, "post:2026-08-23T17-14:cecd09a1130a": {"id": "post:2026-08-23T17-14:cecd09a1130a", "kind": "post", "title": "2026-08-23 17:14", "source_label": "帖子正文", "excerpt": "BABA配售观点更新_20260823 事件：8月23日，阿里巴巴启动纯新股闪电配售，规模 HK$800 亿，100% 净额投向全栈 AI 建设： 1、配售条款：规模 HK$800 亿，港美股折让 8.3%/3.6%，摊薄 3.8% 公司整体配售 7.10 亿股，配售价 HK$112.70/股（对应", "content": "BABA配售观点更新_20260823 事件：8月23日，阿里巴巴启动纯新股闪电配售，规模 HK$800 亿，100% 净额投向全栈 AI 建设： 1、配售条款：规模 HK$800 亿，港美股折让 8.3%/3.6%，摊薄 3.8% 公司整体配售 7.10 亿股，配售价 HK$112.70/股（对应 US$115/ADS），规模约 HK$800 亿（US$102 亿）。较港股最新收盘价 HK$123.00 折让 8.3%，较美股 ADS 收盘价 US$119.34 折让 3.6%；以 26Q2 基本加权股本 186.71 亿股计，摊薄约 3.8%。预计 8/24 为 T 日、8/26 交割。本次配售投资者不设锁定期，90 天禁售为公司（发行人）层面承诺，即公司自身 90 天内不再增发。募资用途明确为 100% 投入全栈 AI 能力，包括扩建与升级 AI 基础设施。 2、为何选择股权配售 资金属性： 本轮核心诉求是境外资金。境内现金充裕、非股权融资渠道亦相对通畅。境内外融资相对平衡。 成本： 当前境外美元债发行成本处于近年高位，而本次对 ADS 折让仅 3.6%。 速度： 评级、尽调、路演等环节，周期更长；本次采用 Reg S（Category 2）架构，美国本土主体不参与，可省去面向美国投资者所需的部分中介核查环节，定价即锁定、T+2 交割，资金到位速度最快。需注意 Reg S 并不排斥美资机构，其非美主体仍可参与。 时点： 在下游需求可见度较高的窗口先行锁定资金、加快算力部署，优先保障 AI 领先性与客户承接能力。 3、账面现金：现金及等价物+短期投资 RMB 2,976 亿 截至 2026/6/30：现金及等价物 + 短期投资 RMB 2,976 亿；其他资金管理类投资 RMB 1,769 亿；两项加总即现金及类现金资产合计 RMB 4,745 亿（US$699 亿）。剔除五年以上到期债务后，公司披露净现金 US$465 亿。我们测算在手股权资产约 US$710 亿（蚂蚁约 US$330 亿）。 4、负债：有息负债合计 RMB 2,665 亿 结构为短期银行借款 306 亿、长期银行借款 560 亿、无抵押优先票据 1,157 亿、可转换优先票据 549 亿、可交换债 93 亿。全口径净现金 RMB 2,080 亿（US$307 亿）；债务中约 RMB 1,072 亿的五年以上到期债券，久期长、无近端偿付压力。 5、投入缺口：两季平均年化流出约 1,200 亿，配售覆盖过半 26Q2 经营现金流入 229 亿、CapEx RMB 677 亿（同比 +75%）、FCF 流出 RMB 447 亿；26Q1 对应为 94 亿 / 269 亿 / 流出 173 亿。公司明确提示单季 CapEx 不可简单年化，故取近两季平均：年化缺口约 RMB 1,240 亿（US$183 亿）；若按 26Q2 单季年化则为约 1,790 亿，构成上限。FY2027 全年 FCF 缺口区间取 RMB 1,200-1,800 亿，配售净额可覆盖 40%–56%。作为对照，FY2026 全年 FCF 流出仅 466 亿、CapEx 1,261 亿。叠加现有净现金，FY2027 内无流动性硬缺口，配售主要为加速投入预留流动性。 欢迎交流~#文字观点", "publish_time": "2026-08-23 17:14", "tags": ["文字观点"]}, "attachment:files/策略周日论策20260823_原文.pdf": {"id": "attachment:files/策略周日论策20260823_原文.pdf", "kind": "attachment", "title": "策略周日论策20260823_原文", "source_label": "其他", "excerpt": "策略周日论策 20260823_ 原文 2026 年08月23日 23:04 发言人 00:00 团队的周度观点。今天是由我来汇报第一部分 ，我这部分主要讲的是反弹回落之后可以布局哪些方向。", "content": "策略周日论策 20260823_ 原文 2026 年08月23日 23:04 发言人 00:00 团队的周度观点。今天是由我来汇报第一部分 ，我这部分主要讲的是反弹回落之后可以布局哪些方向。 随后是我的同事涂晶晶老师汇报一个过去一个周时间市场一直在讨论的专题 ，就是美债利率上行对于市 场的影响。 发言人 00:18 首先是我这一部分的汇报 ，第一部分是本周周度市场的一个画像。其实本周是真正意义上本轮反弹以来 第一次的全面的下跌 ，尤其是科技股整体杀估值有少部分的防御方向在本周是有超过格的 ，因为在上周 的这个周度观点中 ，其实我讲过核心变量是日本加息 ，还有港股转弱 ，但是到了本周 ，核心变量反 点。壬二酸全球市场规模约 1.5万吨，下游主要应用于增塑 剂、润滑油、聚酰胺、涂料、医药及化妆品等领域。目前壬二酸技术和产业化已取得突破，已进入客户 送样验证阶段，部分客户已进入试样和 /或小批量订单阶段，生物法产品有望凭借突出的性价比优势和 低碳属性替代化学法同类产品市场。投资者引述壬二酸单价根据不同纯度在 4万—9万元/吨区间，并 追问公司产品能否实现 99%纯度；管理层未直接回应纯度参数，仅提示关注后续公告。管理层未给出 壬二酸量产及收入贡献的具体时间表和 12个月收入量级预期。 生物基哌啶已进入规模化销售阶段。 2025年实现规模化量产并已成为国内主要供应商， 2026年上半 年客户导入顺利，持续拓展下游应用方向。公司未披露 2026年上半年哌啶的具体销售收入和国内市占 率数据，仅提示参考定期报告。 其他在研及商业化新品方面，长链聚酰胺改性产品已实现规模化销售，主要应用场景包括汽车管路等； 生物基连续纤维热塑性复合材料（ Bio-PPA CFRT）已完成多场景商业化验证；聚酯多元醇为除哌啶、 壬二酸外在列的新品类之一；生物基聚酰胺树脂及改性产品的开发推广正在加速展开。 二元酸谱系拓展与医药应用方面，公司目前可提供 9碳至18碳生物法长链二元酸全谱系产品，暂未明 确披露 C20方向拓展安排。部分超长链二元酸品种可用于多肽类药物的侧链修饰，起到长效缓释作 用，公司正积极关注相关商业机会；对于减肥药上游原料方向的规划，管理层未作正面展望。 三、凯酰时代（与宁德时代合作）与合肥基地进展 凯酰时代复合材料基地为核心预期差所在。 2026年上半年凯酰时代部分产线已进入设备调试阶段，目 前正在推进产品试制、客户测试认证、供应商准入以及验厂等工作，尚未进入大批量销售阶段。投资者 追问宁德时代 250万套生物基电池壳项目中已锁定多少框架订单、产能爬坡节奏、 2027年达产后订单 能见度等具体量化指标，管理层均未披露具体订单数据，仅表示将积极推进批量生产和商务推广。对于 \"完成供应商准入后是否可直接启动大批量销售，还是需继续按客户要求做各种测试 \"的问题，管理层未 给出明确路径判断。动力电池上盖产品正在进行产品试制和客户测试认证，属于电池壳相关复材应用的 核心验证环节。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 合肥基地各产线状态方面，安徽禾纤的生物基聚酰胺改性生产线部分建成，合肥复材及凯酰时代的部分 生产线进入设备调试阶段。投资者追问 Q4能否贡献收入、 4.1万吨复材项目 2026年底投产目标能否 如期实现及投产后产能利用率预期，管理层未就合肥基地各条产线的具体投产时点和 Q4收入确定性作 出正面回应。 复材产品具体应用场景边际进展：已实现小批量交付 ——无人车地板、蒙皮等产品在客户层面实现小批 量交付；进入试制 /验证阶段 ——动力电池上盖产品在进行产品试制和客户测试认证；开发及示范阶 段——光伏边框、建筑模板、门窗、纤维筋等产品在进行工艺、产品开发，并联合下游合作方推进示 范、试点项目，投资者追问的光伏边框技术经济性验证结果和示范项目建成时间，管理层未给出量化答 复。复合材料定位为对钢材、铝材和传统热固材料的替代，具备高性能、轻量化、可回收等综合特点。 四、山西太原基地与秸秆非粮路线 山西基地已投产部分：年产 4万吨生物法癸二酸项目已投产，目前产销两旺、市场导入成功；年 产 5000吨生物基高温聚酰胺中试产线已建成。 大项目延期的核心变量：年产 50万吨戊二胺及 90万吨生物基聚酰胺项目因园区配套基础设施规划变 动有所延期，公司已于 2025年9月30日披露《关于部分募投项目延期的公告》。投资者追问 2026 年底前可建成产能规模、设备安装及公用工程配套完成程度、 2027年12月投产目标是否坚定及最可 能的卡点环节，管理层未给出分阶段投产时间表，仅表示将结合园区配套进展及下游需求情况有序推 进。投资者指出现有产能利用率尚且不高，若山西项目届时达产如何解决产能利用率不足的问题，管理 层未正面回应。 秸秆非粮原料路线：非粮原料路线是公司长期发展战略的重要组成部分，公司在秸秆的预处理、糖化等 方面均具备相关技术储备，已在山西太原落地万吨级产业示范项目。目前处于商业可行性评价阶段，同 时寻找可产业化落地的基地，管理层未给出明确量产时间点。 五、微尺度并购与分子之心投资 微尺度收购交易结构：支付现金对价约 7810万元，同时形成商誉 2.38亿元，估值溢价较高，投资者 明确关注商誉减值风险。微尺度重点经营产品为脂肪族长链聚酯多元醇，终端应用涉及建筑材料、涂 料、新能源等行业，属于长链二元酸的下游衍生物，与公司主营业务协同效应明显。公司已完成对微尺 度的收购并纳入合并报表范围，在技术和产品开发、工程建设以及客户渠道等方面推进整合赋能。 业绩对赌与财务数据披露情况：投资者追问微尺度 2026年上半年贡献的营业收入与净利润以及是否设 有业绩对赌条款，管理层未直接披露微尺度具体财务数据和对赌安排，仅提示参考半年报信息披露。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 分子之心股权关系：公司为分子之心的参股股东，根据最新工商信息持有 17.43% 股权，是其最大的外 部股东，目前分子之心业务发展、融资进展情况良好。分子之心为 AI蛋白质大模型企业，业务聚焦利 用AI算法改造和设计蛋白结构；公司自主搭建的高通量平台覆盖从菌种开发到材料应用的全流程，与 分子之心属于协同关系，不存在重复建设。 六、战略合作推进与下游商业化路径 招商局集团合作：公司以定向增发方式引入招商局集团的方案已于 2025年4月完成，双方基于生物基 新材料的合作已全面展开。目前正在公路桥梁、建筑、集装箱、纺织等领域推进项目，试样和产品验证 工作正在有序推进；公司与招商创科及合肥产投、合肥高新投合资的复材项目已进入设备调试阶段。关 于投资者提出的采购目标节奏延后及未来 2—3年内部可实现的采购规模预期，管理层表示双方正按协 议约定尽最大商业努力积极落实相关采购，后续采购量将根据业务规划、下游应用场景落地进度及实际 需求统筹安排，未给出量化采购规模目标。管理层强调将通过聚焦新能源 /物流/汽车/建筑等关键场景 打造商业成功案例来加速商业化落地。 下游客户导入与破圈瓶颈：针对国际化车企、高端消费电子等增量巨头的放量制约因素，管理层未在 \" 认知周期、标准互认、绝对价格成本 \"三个选项中作明确归因排序，而是强调不少生物基聚酰胺结构组 合比化学法聚酰胺具有性价比优势，在一些大的应用场景有望解决行业痛点。新材料导入需经历工艺和 产品开发、客户测试认证、小批量生产销售、产业链配套建设、大批量销售等系列过程，不同场景导入 周期有所不同，管理层未给出头部大客户供应链准入的可量化进展数据。汽车领域：生物基聚酰胺材料 已在汽车管路、内外饰等领域与主机厂达成合作，生物基聚酰胺复合材料在动力电池壳等领域已进行产 品试制。富士康合作：管理层未正面回应是否正常推进，仅表示以官方披露信息为准。宝马 ix3：管理 层未确认新款 ix3是否沿用凯赛材料，仅表示相关主机厂合作以官方披露信息为准。 七、竞争格局与长期成长逻辑 生物基材料对石油基替代的总盘：投资者引用管理层此前观点，长链尼龙和高温尼龙合计约 200多亿 元市场规模，追问公司是否有实力像二元酸一样完成对石油基的替代和升级；管理层回应将持续依托合 成生物制造技术和成本优势，推动生物基材料对石油基产品的替代进程，未给出市占率或替代率的量化 目标。 平台型企业的第二增长曲线逻辑：针对 \"复材进度缓慢是否意味着管理层调整经营策略 \"的提问，管理层 强调公司是合成生物制造平台型企业，核心单体和生物基聚酰胺家族材料能对化学法聚酰胺实现功能覆 盖，并表现出化学法不具备的性能优势，将继续深耕生物基聚酰胺及复合材料产业链，并积极开发单体 新产品、拓展核心单体的下游衍生物以打造第二增长曲线。生物基聚酰胺板块虽然整体仍亏损，但已在 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª", "status": "extracted"}, "post:2026-08-23T09-09:5720689d399e": {"id": "post:2026-08-23T09-09:5720689d399e", "kind": "post", "title": "2026-08-23 09:09", "source_label": "帖子正文", "excerpt": "【申万计算机周报】关注AI数据中心高速互联！电芯片国产化加速！", "content": "【申万计算机周报】关注AI数据中心高速互联！电芯片国产化加速！ 20260822 #本周周报重点：1）光通信电芯片；2）裕太微；3）优迅股份。 #AI算力升级驱动光通信电芯片加速迭代！速率提升是迭代主轴光通信电芯片承担电信号处理、驱动、整形与管控功能，在光模块中价值占比约20%，是AI数据中心高速光互连的核心器件。当前400G/800G光模块已成为AI集群主力，下一代产品进一步向1.6T/3.2T演进，推动电芯片由25G/50G持续向100G/200G升级。 #裕太微：国产以太网PHY先锋，从铜互连向光互连延伸！裕太微深耕以太网PHY、交换芯片及网卡等有线通信芯片，PHY与SerDes能力构成高速互连的重要技术底座。公司2026年7月发布定增募集说明书（申报稿），拟募资10.6亿元，重点布局数据中心高速互联及车载通信，其中将围绕112G SerDes研发高速互联芯片，为光模块DSP、交换芯片、智能网卡等产品提供底层能力。公司铜线介质产品已实现2.5G及以下全覆盖，10G是铜互连向光互连延伸的重要节点。依托DSP技术积累，公司部分以太网物理层芯片已能够同时支持铜线及光纤传输，有望逐步打开高速光互连市场。 #优迅股份：低速电芯片领先，高速产品进入放量期！优迅股份专注光通信前端收发电芯片，10G及以下产品市场份额全球第二，同时积极向25G及以上高速率产品切换。公司测算，25Gbps及以上产品2025H2预计销售986.9万元，2026年预计销售6972万元，同比增长超过5倍，高速产品有望成为新的成长动能。LPO/CPO趋势进一步放大TIA、LDD等前端电芯片价值。随着800G/1.6T及更高速率升级，系统对TIA的增益和噪声、Driver的带宽和线性度提出更高要求，部分原由DSP承担的功能和价值向TIA、LDD迁移，具备高速模拟电芯片能力的厂商有望持续受益。 【近期周报】 0815：关注华为超节点进展！国产大模型多更新！#小程序://申万宏源研究/Vcrh4TdQ6tmUqSo 0807：从美股软件行情看FDE！#小程序://申万宏源研究/8WdaODUfwgqTOtl 0731：DeepSeek-V4-Flash继续展现国产模型超高性价比！#小程序://申万宏源研究/Tbyp8O8rXe2K2CI 0724：26Q2计算机行业持仓分析：持仓占比探底，算力高景气！#小程序://申万宏源研究/l6qzgD1Aateep9J#文字观点", "publish_time": "2026-08-23 09:09", "tags": ["文字观点"]}, "post:2026-08-23T09-09:8b7c304cd5ba": {"id": "post:2026-08-23T09-09:8b7c304cd5ba", "kind": "post", "title": "2026-08-23 09:09", "source_label": "帖子正文", "excerpt": "美银——电子材料行业月度跟踪——PCB材料、微细铜箔、光器件、硅片全线景气 • PCB材料：玻纤布与铜箔价格共振上行 7月中国电子玻纤布、玻纤纱价格持续上涨，日本日东纺（Nittobo）子公司Baotek销售保持坚挺，旭化成低介电玻纤布、日东纺低介电玻纤纱及布价格亦有小幅上调。铜箔价格同步走强：三井", "content": "美银——电子材料行业月度跟踪——PCB材料、微细铜箔、光器件、硅片全线景气 • PCB材料：玻纤布与铜箔价格共振上行 7月中国电子玻纤布、玻纤纱价格持续上涨，日本日东纺（Nittobo）子公司Baotek销售保持坚挺，旭化成低介电玻纤布、日东纺低介电玻纤纱及布价格亦有小幅上调。铜箔价格同步走强：三井金属在1Q业绩会上确认VSP箔提价，古河电工受益于铜箔涨价及HVLP4箔占比提升带来的产品结构优化。台系三大覆铜板（CCL）厂商7月合计营收同比大增122%，维持高景气，整体数据对PCB材料供应商构成明确利好。 • 微细铜箔：光模块需求爆发驱动增量 1Q业绩验证三井金属微细铜箔需求因800GbE光模块应用显著增长。据PCB龙头厂商华通（Compeq）披露，800GbE光模块PCB共12-14层，其中4-8层采用mSAP工艺；1.6TbE光模块PCB共14-16层，6-10层采用mSAP工艺，单模块微细铜箔用量大幅提升。叠加存储封装需求增长，微细铜箔需求高增确定性进一步强化。 • 光纤光器件：需求超预期，价格传导顺畅 7月光纤市场景气度持续上行：藤仓（Fujikura）披露某核心客户项目光缆价格上调25%，推动1Q业绩指引上修；古河电工同样受益于光缆提价。光器件环节，Lumentum与Coherent在业绩会上均表示CPO渗透无延迟，客户询单持续走强，NPO带来额外增量市场，部分产品供给紧张、价格上调。古河电工1Q光器件展望上修，高毛利的半导体光放大器（SOA）销量增长是重要支撑。整体光纤与光器件市场表现强于预期，对线缆厂商构成积极催化。 • 半导体材料：硅片7月数据亮眼，价格传导初现 7月韩国与中国台湾地区硅片进口量同比增长24.9%，其中韩国同比大增44%，中国台湾地区300mm硅片进口均价环比上行。信越化学在业绩会上披露7月300mm硅片出货量创历史单月新高；台胜科（Formosa SUMCO）7月营收同比增长28.8%。SUMCO表示，需求旺盛的应用领域硅片现货市场已出现价格传导，需求尚未复苏的领域尚未启动提价，行业复苏呈现结构性分化。 • 重点标的评级与目标价 ◦ 日东纺（3110.JP）：维持买入，目标价5480日元（较8月19日收盘价2996日元有约83%上行空间），估值基于38倍FY3/28预期PE。 ◦ 旭化成（3407.JP）：维持买入，目标价1960日元，采用SOTP估值，对应FY3/28预期EV/EBITDA 7.1倍。 ◦ SUMCO（3436.JP）：维持买入，目标价6500日元，基于22倍FY12/28预期PE，低于历史估值区间中点，反映盈利稳步增长预期。 ◦ 三井金属（5706.JP）：维持买入，目标价对应估值反映微细铜箔需求高增红利。 ◦ 信越化学（4063.JP）：维持买入，目标价7900日元，基于23倍FY3/28预期PE，接近10年估值区间上限，反映盈利增长潜力。 ◦ 古河电工（5801.JP）：维持买入，目标价7300日元，基于40倍FY3/28预期PE，溢价反映AI服务器材料带来的结构性盈利提升。 ◦ 藤仓（5803.JP）：维持买入，目标价8000日元，基于40倍FY3/28预期PE，高于历史中位数，受益AI数据中心结构性增长。 • 核心风险点 ◦ 下行风险：电子行业需求放缓、日元大幅升值、原油价格飙升挤压利润、半导体市场突发下滑、AI相关材料需求不及预期、CPO渗透速度快于预期挤压传统光模块需求。 ◦ 上行风险：AI算力投资超预期、电子产品需求强于预期、日元大幅贬值、原材料成本下降、光纤光缆需求持续高增。#文字观点", "publish_time": "2026-08-23 09:09", "tags": ["文字观点"]}, "post:2026-08-23T14-01:b8b7834dbc1b": {"id": "post:2026-08-23T14-01:b8b7834dbc1b", "kind": "post", "title": "2026-08-23 14:01", "source_label": "帖子正文", "excerpt": "周观点更新（20260823） ✨本周重要事件包括：1）旭创中报业绩亮眼，Q2归母净利79e，800G高景气+1.6T放量高增；2）CPO量产+论文带动无源高关注", "content": "周观点更新（20260823） ✨本周重要事件包括：1）旭创中报业绩亮眼，Q2归母净利79e，800G高景气+1.6T放量高增；2）CPO量产+论文带动无源高关注；3）阿里Q2 Capex超预期。 ✨重申我们持续推荐的三个看好方向：1）高斜率高确定性的国产算力超节点；2）有业绩安全边际高的海外算力；3）高ROE/低PE的亿联、端侧AI等品种 🔔📄近期材料欢迎联系：#无源弹性测算+瑞可达推荐更新；海外CSP Capex拆解、超节点材料、光纤等数据库 # 光无源：三重因素推动下，通胀逻辑高关注 事件+财报验证+资金避险再配置共同推动无源行情。英伟达CPO量产+SK海力士联合高校发布CPO技术论文，反映：1）CPO从威胁可插拔翻转为放大光互联总量；2）CPO/NPO产业方推进乐观。 此外，长芯博创、太辰光等中报验证景气度，持续供不应求。 #无源当前位置首选瑞可达；此外杰普特/致尚/光库+光引擎天孚+光源源杰仕佳等+特种/高密光纤等标的。 ＃ 持续看好中长期超节点网络侧价值量与估值双升 #行业整体而言，我们认为市场已关注网络受益超节点、但仍低估26H2-27年的放量斜率及网络侧业绩弹性。超节点方案明确抬升Scale-up交换机／交换芯片需求，网络价值量预计持续提升。 ＃ 交换机：锐捷、紫光、华勤；连接：华丰；交换芯：盛科；光互联：曦智 # 高分红稳增长低估值，看好8月金股【亿联网络】等。底部反转，此前受国际贸易环境波动&海外产能转移短期内对订单出货&存储涨价等影响，目前#毛利率已回升，26H1为65%（25年63%），关税与产能之担忧实际可控。Q2同环比高增（预告较高区间），归母净利#QoQ+32%，YoY+28%。当前股息收益率4.2%，而PE分位数仅18%（18年初起）。 # 重视端侧AI底部机会。此前存储涨价与车载部分客户变化等影响盈利，目前存储压力逐步缓解，下游需求旺盛，端侧AI+机器人+车载等增量明确，同时如广和通收购航盛电子等利好催化。端侧公司已调整较久，龙头移远业绩H1已高增，行业H2有望模型政策产品等多重催化。#文字观点", "publish_time": "2026-08-23 14:01", "tags": ["文字观点"]}, "post:2026-08-23T20-54:04f4b546c030": {"id": "post:2026-08-23T20-54:04f4b546c030", "kind": "post", "title": "2026-08-23 20:54", "source_label": "帖子正文", "excerpt": "中金#周末AI观点更新上周市场海外模型主要关注点是Anthropic与OpenAI的ARR，国内模型则是关注匿名模型Ox Alpha，以及潜在的几个待发布模型 1️⃣ Anthropic官方口径7月末ARR为650亿美元，让市场认为有点“低于预期”，但我们认为更多还是由于先前的部分第三方渠道过于高估", "content": "中金#周末AI观点更新上周市场海外模型主要关注点是Anthropic与OpenAI的ARR，国内模型则是关注匿名模型Ox Alpha，以及潜在的几个待发布模型 1️⃣ Anthropic官方口径7月末ARR为650亿美元，让市场认为有点“低于预期”，但我们认为更多还是由于先前的部分第三方渠道过于高估，在本次的口径修正后，后续市场也会以更加统一的口径进行追踪；OpenAI 2Q26收入表现不佳也在预期之中，7月之后Codex发力预计有明显加速，总体来看海外模型下一个主要看点还是Astra的发布 2️⃣ Ox Alpha匿名发布后在海外开发者社群继续引发讨论，目前来看是一块相对中小规模参数（200-300b）、高效率、多模态且具有优秀Coding&Agent能力的模型（很多是将其作为多模态且能力提升版的ds-v4 flash使用）；至于该模型我们认为其大概率还是智谱系的模型，有可能是glm-5v的后训练版本，或者glm-5.3的轻量&多模态版，整体来看虽然不是一个追求上限的模型，但会在中端市场很有优势 3️⃣ 除了Ox Alpha之外，最近也有多个海内外模型的更新信息，包括Google Gemini可能会有一些动作，国内小米Mimo-V3、Minimax新模型的预期发布等，也有很多“泄露”的跑分信息，整体看国内外模型无论是在开发还是在宣传端的竞争都非常激烈，后面几周和期待更多官方信息的发布#文字观点", "publish_time": "2026-08-23 20:54", "tags": ["周末AI观点更新", "文字观点"]}, "attachment:files/中际旭创中期业绩会纪要20260823.pdf": {"id": "attachment:files/中际旭创中期业绩会纪要20260823.pdf", "kind": "attachment", "title": "中际旭创中期业绩会纪要20260823", "source_label": "其他", "excerpt": "abc 2026 年 08 月 19 日Global Research 快评 华测检测 业绩会纪要：海外扩张加速，医药与半导体迎 来兑现阶段 国际化加速推进，内生增长保持稳健 在业绩交流会上，公司表示： 1）H1收入同比增 16%，其中内生增约 10%， 并购贡献约 6%（主要来自工业、食品板块），符合长期 “2/3内生增长 +1/3 并购增长 ”的目标；2", "content": "abc 2026 年 08 月 19 日Global Research 快评 华测检测 业绩会纪要：海外扩张加速，医药与半导体迎 来兑现阶段 国际化加速推进，内生增长保持稳健 在业绩交流会上，公司表示： 1）H1收入同比增 16%，其中内生增约 10%， 并购贡献约 6%（主要来自工业、食品板块），符合长期 “2/3内生增长 +1/3 并购增长 ”的目标； 2）国际化战略持续落地，上半年海外收入同比增 长63%，占比首次超过 10%，未来将继续围绕食品、船舶及认证机构推进 东南亚、欧洲和南美并购； 3）消费品检测受益于出口链景气、新能源汽车 及自动驾驶检测需求增长，全部增量来自内生增长，边际利润率较高； 4） 管理层认为传统检测行业正加速出清，而高端制造、创新药及车规芯片等景 气领域需求旺盛； 5）海外认证及碳核查业务进展顺利，希腊 Emicert有望持 续受益于欧盟 CBAM及碳核查需求； 6）公司坚持战略协同优先的并购原 则，不追求大型收购，更倾向补充资质和区域布局的优质中小标的。 医药与半导体进入收获期，盈利拐点逐步显现 我们认为本次电话会最积极的信息来自过去几年重点投入赛道开始进入兑现 阶段。医药及医学服务板块 H126收入同比增长 57%，创新药 CRO订单持续 回暖，大分子生物药实验室接近饱和。管理层披露 CRO及医疗器械实验室产 能利用率已接近饱和，昆山二期项目已获批。与此同时，半导体业务持续优 化收入结构，降低低毛利硬件业务占比，重点布局 AI算力芯片、车规芯片及 国产替代。我们认为，随着医药、医疗器械及半导体业务放量，其盈利贡献 有望加速释放，并逐步成为新的利润增长来源。 高端检测与海外平台有望打开新增长曲线，并受益于 AI需求 管理层表示，公司已将固定资产投资预算恢 复至收入的 1 0 %（此前 为7%），重点投向半导体、医疗器械、新能源汽车、低 空经济及机器人等 战略赛道。同时，公司持续推进 AI应用落地，目前已部署120多个应用场 景，并开始受益于 AI硬件、 PCB、液冷及光模块等相关检测需求增长。海外 方面，公司未来并购将 聚焦食品、船舶及认证机构，持续 强化欧盟及东南亚 等核心市场布局。我们认为，海外 平台扩张、高端检测业务放量及 AI产业链 检测需求增长，有望 共同驱动公司下一阶段成长。 估值: 维持买入，目标价从 18.40元上调至 20.50元 我们小幅上调盈利预测，以反映医药医学业务进展 好于预期，并将估值基准 年滚动至2027年。我们基于DCF估值法的目标价（WACC维持7.1%）对 应27x 2027E PE，低于自 2015年以来的均值40+倍，以反映低于历史的复合 盈利增速（ 2015-25 CAGR 19% vs 2026-28E CAGR 13% ）。 重要数据 (Rmb百万) 12/23 12/24 12/25 12/26E 12/27E 12/28E 12/29E 12/30E 营业收入 5,571 6,046 6,582 7,625 8,709 9,954 11,385 13,033 息税前利润 (UBS) 883 1,032 1,092 1,277 1,466 1,664 1,890 2,147 净利润 (UBS) 787 863 951 1,120 1,277 1,442 1,630 1,844 每股收益 (UBS 稀释后 ) (Rmb) 0.47 0.51 0.57 0.67 0.76 0.86 0.97 1.10 每股股息净值 (Rmb) 0.10 0.10 0.20 0.14 0.16 0.18 0.20 0.23 净（债务） /现金 1,436 871 1,214 1,353 1,620 1,926 2,276 2,671 盈利能力和估值 12/23 12/24 12/25 12/26E 12/27E 12/28E 12/29E 12/30E 息税前利润率 % 15.8 17.1 16.6 16.7 16.8 16.7 16.6 16.5 ROIC (EBIT) % 21.7 20.4 18.6 20.6 22.4 23.7 24.9 25.9 企业价值 /息税折旧摊销前利润 (UBS核心) x 21.9 12.6 12.1 13.6 11.7 10.2 8.9 7.7 市盈率 (UBS, 稀释后 ) x 40.7 24.2 22.4 22.9 20.1 17.8 15.7 13.9 权益自由现金流 (UBS) 收益率 % 2.7 1.0 1.9 3.5 3.6 3.9 4.2 4.5 净股息收益率 % 0.5 0.8 1.6 0.9 1.0 1.2 1.3 1.5 来源：公司报告、LSEG Eikon、UBS估算。 UBS给出的估值是扣除商誉、例外项目以及其他特殊项目之前的数值。 估值：根据该年度的平均股价得出，(E)：根据2026年8月18日的股价(Rmb 15.22)得出. 本证券研究报告由瑞银 证券有限责任公司编制. 分析师声明及要求披露的项目，包括 UBS(瑞银 )发布的有关 Quantitative Research Review 的信息，从第 4 页开始。 股票 中国 工业服务 12个月评级 买入 12个月目标价 Rmb20.50 之前 : Rmb18.40 股价 (2026年8月18日) Rmb15.22 RIC: 300012.SZ BBG: 300012 CS 交易数据和主要指标 52周股价波动范围 Rmb17.33-12.66 市值 Rmb25.6b/US$3.80b 已发行股本 1,683m (ORDA) 流通股比例 82% 日均成交量 (千股) 31,731 日均成交额 (百万) Rmb449.7 普通股股东权益 (12/26E) Rmb8.52b 市净率 (12/26E) 3.0x 净债务 /息税折旧摊销前利润 (12/26E) NM 从到 %市场预测每股收益（ UBS 稀释后） (Rmb) 12/26E 0.65 0.67 3 0.71 12/27E 0.73 0.76 3 0.82 12/28E 0.82 0.86 4 0.92 王 斐丽 分析师 S1460517100001 phyllis.wang@ubs.com +86-21-3866 8964 王 钰 分析师 S1460525030001 grace-zb.wang@ubs.com +86-21-3866 8857 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 快评: 华测检测 2026 年 08 月 19 日 abc2预测回报率 预测股价涨幅 34.7% 预测股息收益率 0.9% 预测股票回报率 35.6% 市场回报率假设 6.8% 预测超额回报率 28.9% 公司背景 华测检测认证集团股份有限公司成立于2003年，总部位于深圳，是第三方检测、检验与 认证(TIC)服务的开拓 边缘控制。（2）薄膜设备：ALD用量提升，广泛用于通孔填充、栅极形成等关键环节，支持高密堆叠与先进结构制造；（3）材料体系：钼凭借其更优的电阻性能在逐步替代钨成为先进制程金属材料主流，具备更优电阻率与刻蚀适配性。 4、投资建议：重点推荐长存产业链设备商，（1）前道制程：刻蚀+薄膜沉积设备北方华创、中微公司、迈为股份；量测设备中科飞测，精测电子；薄膜沉积设备拓荆科技、微导纳米等。（2）后道封测：长川科技。（3）先进封装：拓荆科技（键合机）、华海清科（减薄机）、盛美上海（电镀机）、芯源微（涂胶显影+键合机）、迈为股份（切磨抛+键合机）、晶盛机电（减薄机）。 【东吴机械】周尔双/李文意/谈沂鑫/柴悅茹#文字观点", "publish_time": "2026-08-23 13:59", "tags": ["文字观点"]}, "post:2026-08-23T23-52:1242fbc53659": {"id": "post:2026-08-23T23-52:1242fbc53659", "kind": "post", "title": "2026-08-23 23:52", "source_label": "帖子正文", "excerpt": "【华源传媒互联网】本周观点：当财报披露来到最后一周 1️⃣ 目前已披露港股平台公司财报是让人纠结的，腾讯基本业务稳健，但季度现金流首次转负，两年维度资本开支应该还会走高（从现金流预付款影响推算），短期表观利润预期难一致；快手Q3更新指引大幅低于市场预期，宏观层面对电商&广告业务影响或加大，二梯队厂商", "content": "【华源传媒互联网】本周观点：当财报披露来到最后一周 1️⃣ 目前已披露港股平台公司财报是让人纠结的，腾讯基本业务稳健，但季度现金流首次转负，两年维度资本开支应该还会走高（从现金流预付款影响推算），短期表观利润预期难一致；快手Q3更新指引大幅低于市场预期，宏观层面对电商&广告业务影响或加大，二梯队厂商若无明显的ROI优势则受影响更大，可灵指引留下新模型的上修弹性。阿里AI相关收入连续第十二个季度实现三位数增长，EBITA Margin提升至12%，且给于更高增长指引，展望Q3营收增速或提升至50%，利润率也有望继续提升。但投入对现金流侵蚀和表观利润影响加大显现。周五阿里美股大幅下跌，目前看是公司配售计划的提前反应（拟配售总额800亿港币，配售 7.1 亿股，配售价 112.7 港元，对现有股权稀释约3.8%。海外投资者的关注点仍主要集中于当期利润受损、自由现金流出扩大等问题，多空博弈激烈。 2️⃣ 但我们观察的产业趋势仍是在逐渐强化的，阿里展望Q3，闪购收亏、千问app投入收缩等都有利于缓解此前核心担忧；腾讯 WorkBuddy 等产品与内外部产品打通在进一步加速（包括企业微信等），当前WorkBuddy商业化拓展在B端也持续推进（例如广州湾擎项目，国产化配适+私有化部署模式），有望成为腾讯最大AI 产品期权；AI视频多模态模型商业化循环是coding之外走的最顺且国内领先的重要方向，技术迭代速度很快，市场空间从低端AI漫剧走向短剧-精品剧集-大电影-游戏CG/建模，后续产业催化密集（Seedance3.0年底更新，模型能力跃迁、模型公司+AI 剧集公司资本化）。因此 AI 应用仍是最核心交易方向。 3️⃣ 此外，我们一直强调 AI竞争进入Harness时代，#OpenAI全面开源Codex底层核心架构Harness。OpenAI 提出，Codex的价值在于模型与业务应用之间的开放式Agent Harness （智能体执行框架）。Harness负责理解任务、维护上下文、调用工具等，并在多轮交互中持续推进任务。而#DeepSeek推出DeepSeekHarness开发者预览版，并同步开放源代码，其更强调操作系统级的模块化和可替换性，采用“一切皆插件”的架构。目前已经很明确，Agent的实际表现不仅取决于底层模型，也取决于Harness如何管理上下文、记忆、工具调用和执行循环。（详细产品演示和研究请联系👉魏桢）财报披露进入最后一周，最新财报日历更新欢迎联系我们，中报期我们保持重点公司跟踪和产业趋势更新，感谢继续大力支持！☎️ 华源传媒互联网 陈良栋15238345752/周政宇 15800992678/陈逸凡 15967155816/许孟婕 17262633779/魏桢13975150267#文字观点", "publish_time": "2026-08-23 23:52", "tags": ["DeepSeek推出DeepSeek", "文字观点"]}, "post:2026-08-23T21-44:282bd2cda9b9": {"id": "post:2026-08- 场景包括汽车管路等； 生物基连续纤维热塑性复合材料（ Bio-PPA CFRT）已完成多场景商业化验证；聚酯多元醇为除哌啶、 壬二酸外在列的新品类之一；生物基聚酰胺树脂及改性产品的开发推广正在加速展开。 二元酸谱系拓展与医药应用方面，公司目前可提供 9碳至18碳生物法长链二元酸全谱系产品，暂未明 确披露 C20方向拓展安排。部分超长链二元酸品种可用于多肽类药物的侧链修饰，起到长效缓释作 用，公司正积极关注相关商业机会；对于减肥药上游原料方向的规划，管理层未作正面展望。 三、凯酰时代（与宁德时代合作）与合肥基地进展 凯酰时代复合材料基地为核心预期差所在。 2026年上半年凯酰时代部分产线已进入设备调试阶段，目 前正在推进产品试制、客户测试认证、供应商准入以及验厂等工作，尚未进入大批量销售阶段。投资者 追问宁德时代 250万套生物基电池壳项目中已锁定多少框架订单、产能爬坡节奏、 2027年达产后订单 能见度等具体量化指标，管理层均未披露具体订单数据，仅表示将积极推进批量生产和商务推广。对于 \"完成供应商准入后是否可直接启动大批量销售，还是需继续按客户要求做各种测试 \"的问题，管理层未 给出明确路径判断。动力电池上盖产品正在进行产品试制和客户测试认证，属于电池壳相关复材应用的 核心验证环节。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 合肥基地各产线状态方面，安徽禾纤的生物基聚酰胺改性生产线部分建成，合肥复材及凯酰时代的部分 生产线进入设备调试阶段。投资者追问 Q4能否贡献收入、 4.1万吨复材项目 2026年底投产目标能否 如期实现及投产后产能利用率预期，管理层未就合肥基地各条产线的具体投产时点和 Q4收入确定性作 出正面回应。 复材产品具体应用场景边际进展：已实现小批量交付 ——无人车地板、蒙皮等产品在客户层面实现小批 量交付；进入试制 /验证阶段 ——动力电池上盖产品在进行产品试制和客户测试认证；开发及示范阶 段——光伏边框、建筑模板、门窗、纤维筋等产品在进行工艺、产品开发，并联合下游合作方推进示 范、试点项目，投资者追问的光伏边框技术经济性验证结果和示范项目建成时间，管理层未给出量化答 复。复合材料定位为对钢材、铝材和传统热固材料的替代，具备高性能、轻量化、可回收等综合特点。 四、山西太原基地与秸秆非粮路线 山西基地已投产部分：年产 4万吨生物法癸二酸项目已投产，目前产销两旺、市场导入成功；年 产 5000吨生物基高温聚酰胺中试产线已建成。 大项目延期的核心变量：年产 50万吨戊二胺及 90万吨生物基聚酰胺项目因园区配套基础设施规划变 动有所延期，公司已于 2025年9月30日披露《关于部分募投项目延期的公告》。投资者追问 2026 年底前可建成产能规模、设备安装及公用工程配套完成程度、 2027年12月投产目标是否坚定及最可 能的卡点环节，管理层未给出分阶段投产时间表，仅表示将结合园区配套进展及下游需求情况有序推 进。投资者指出现有产能利用率尚且不高，若山西项目届时达产如何解决产能利用率不足的问题，管理 层未正面回应。 秸秆非粮原料路线：非粮原料路线是公司长期发展战略的重要组成部分，公司在秸秆的预处理、糖化等 方面均具备相关技术储备，已在山西太原落地万吨级产业示范项目。目前处于商业可行性评价阶段，同 时寻找可产业化落地的基地，管理层未给出明确量产时间点。 五、微尺度并购与分子之心投资 微尺度收购交易结构：支付现金对价约 7810万元，同时形成商誉 2.38亿元，估值溢价较高，投资者 明确关注商誉减值风险。微尺度重点经营产品为脂肪族长链聚酯多元醇，终端应用涉及建筑材料、涂 料、新能源等行业，属于长链二元酸的下游衍生物，与公司主营业务协同效应明显。公司已完成对微尺 度的收购并纳入合并报表范围，在技术和产品开发、工程建设以及客户渠道等方面推进整合赋能。 业绩对赌与财务数据披露情况：投资者追问微尺度 2026年上半年贡献的营业收入与净利润以及是否设 有业绩对赌条款，管理层未直接披露微尺度具体财务数据和对赌安排，仅提示参考半年报信息披露。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 分子之心股权关系：公司为分子之心的参股股东，根据最新工商信息持有 17.43% 股权，是其最大的外 部股东，目前分子之心业务发展、融资进展情况良好。分子之心为 AI蛋白质大模型企业，业务聚焦利 用AI算法改造和设计蛋白结构；公司自主搭建的高通量平台覆盖从菌种开发到材料应用的全流程，与 分子之心属于协同关系，不存在重复建设。 六、战略合作推进与下游商业化路径 招商局集团合作：公司以定向增发方式引入招商局集团的方案已于 2025年4月完成，双方基于生物基 新材料的合作已全面展开。目前正在公路桥梁、建筑、集装箱、纺织等领域推进项目，试样和产品验证 工作 "tags": ["文字观点"]}, "attachment:files/新闻解读20260823_原文.pdf": {"id": "attachment:files/新闻解读20260823_原文.pdf", "kind": "attachment", "title": "新闻解读20260823_原文", "source_label": "其他", "excerpt": "新闻解读 20260823_ 原文 2026 年08月23日 23:14 发言人 00:02 每天十分钟拆解新闻背后的逻辑。大家好 ，今天是 2026 年的8月23号星期天 ，我是董小姐。", "content": "新闻解读 20260823_ 原文 2026 年08月23日 23:14 发言人 00:02 每天十分钟拆解新闻背后的逻辑。大家好 ，今天是 2026 年的8月23号星期天 ，我是董小姐。这个周末全 市场的注意力仍然集中在美债要不要爆雷这个问题上。现在恐慌已经是在过去一周席卷全球最明显的变 化就是两个独立资产 ，也就是黄金和比特币快速的拉升。这个是受益于美元信用的贬值 ，美元信用贬值 又是美国国债危之后最直接的一个后果。跟它形成鲜明对比的就是全球的股票市场在过去的一周是连续 下挫，这个也是跟美债恶化是有直接关系的。现在就来到了一个关窍点 ，大家非常想了解到的就是股票 市场会不会因为美债这个问题持续恶化 ，那继续下挫根本就稳不住。另外一个就是黄金和比特币会不会 因为这个问题而一飞冲天。 发言人 00:58 我们一起来梳理一下过去这几天重要的消息 ，来给大家一些思路。首先我们说一下结论 ，经过了过去的 一两周各类资产的快速剧烈波动之后 ，我们认为可能会短暂的进入到一个僵局期。也就是说不能够快速 的拉，但也不至于快速的回踩 ，这个也是适用于美国的股票市场以及全球的股票市场 ，尤其是科技板 块。 发言人 01:21 这个背后的大逻辑就是各方的力量互相牵制。一方面是美国的债券市场所透露出来的这些问题。另外一 个就是美国政府现在在连环救市 ，他的工具箱当中的很多牌还没有打出去。我们稍微回顾一下就看到美 国的财政部实际上是冲在第一线的 ，包括他的部长被那前两天 ，是直接宣布加大对长期国债的回购 ，这 个是大象的第一枪。直到现在为止 ，我们看到财政部和美联储手里依然握有其他的牌。马上到了九月份 之后，美联储就会面临下一次议息会。在这个会议之前 ，要不要传递出来一些微妙的信号 ，认为不加息 或者还有一定的概率去降息 ，通过这样的预期来影响市场 ，起到托底的作用。 发言人 02:08 除此之外 ，最近大家看到还有一条消息广为传播 ，就是美国总统特朗普在公开开场合表态 ，我们现在有 很多方法来干预美债 ，那最硬的方法就是军队如果必须得使用 ，我们就会去用。那很多的朋友评论说特 朗普是不是疯了 ，怎么突然放这么大的一个炮弹直接炸到华尔街 ？美债的这个问题直接跟军队联系在一 起，直接跟军事行动联系在一起。我们说这个实际上只是说了一个常识 ，就是特朗普说的非常的直 白，一个国家的国债就是这个国家的信用。这个信用背后到底是什么 ？最后的一张硬牌肯定就是军事力 量，当然还在军事力量之前相对比较软性的一些支撑力 ，包括它的经济、产业、科技、金融手段等 等，以及国及影响力。所以我们说所有的这些牌都是等着去打出去 ，彼此之间有一个先后顺序 ，军事肯 定是最后的一招 ，还远远不到去让他发挥作用的那个时刻。 发言人 03:08 特朗普只是向大家证明还有很多牌来稳定债市 ，这个也是我们之前所认为的。在今年的 11月份之前 ，也 就是美国的中期选举之前 ，美国可能会动用各方的力量来稳定债券市场。虽然债市会表现的波动 ，甚至 看上去踉踉跄跄 ，但是不至于去摔到失控。这个就是我们说到的僵局的状态 ，这种状态可能也会延伸到 其他的资产 ，包括像比特币和黄金。 发言人 03:36 E6636BB1012F9B6DA981D91E6DDB85E4435BBE8C036DD212FA6B463F47DFE56ABE9B9DEC4651EFD4A819A7CB9D1F40FC5260D4C3139B28935A5CFC7E5E02CE93C537635 虽然近期的反弹非常的凌厉 ，但是我们说它总体来说是受益于美债危机。那么美债危机如果暂时这个盖 子被盖上的话 ，那么就意味着那两类资产短期的快速的反弹期 ，可能也基本上触顶了。除此之外 ，大家 最关心的就是股票市场 ，股票市场当中的科技板块是过去这段时间的领头羊 ，他可能也会陷入到一种僵 状态，因为前期涨幅过大。 发言人 04:02 现在很多美国的科技龙头公司在市场上 ，大家对他的期望是能够继续有巨额的资本开支 ，来支撑整个产 业链上下游的订单和营收。但是我们考虑到这一轮美债危机是为何而恶化的。实际上有相当一部分是被 这些美国的科技龙头公司在市场上抢资金所导致。所引发的就是他们的长期的债券发行量过大 ，市场的 承接力不足。那之前买美国国债的一些资金 ，转头去买了这些科技龙头公司发行的债券。无意当中去抬 高了利率 ，让美国的政府承担了更高的成本 ，反过来也让这些美国的科技龙头公司承担了更高的成本。 利率高到一定水平的时候 ，这些龙头公司对外的财务成本也会陡升。这个就是外部融资条件的恶化 ，可 能会反过来抑制它未来资本开支的增。 发言人 04:56 市场上也很清楚的看到这一点 ，这个有可能会向下游去传导到整个产业链当中的营收和订单。所以我们 说短期发育过度的科技赛道 ，到现在为止他的压力是没有被缓解到的。甚至他在僵局这个状态之下 ，可 能还会承受更多的来自于产业上的这种压力 ，这个是需要稍微谨慎的。 发言人 05:18 这种在科技赛道上面的压力也会从海外传导到国内市场。尤其是中国 A股市场当中 ，对海外市场依赖度 比较大的一些细分领域。这个最典型的像光模块等等这些公司 ，连带着科技赛道整体向上去表现的这个 机会也不大。 发言人 05:36 虽然我们看到上周五市场是略有转暖 ，全线翻红 ，但是要考虑到资金层面仍然有压力。沪深两市的成交 量只有 1.9万亿左右 ，是最近这段时间的新低 ，这个也反映出来市场的资金现在是比较谨慎的 ，尤其是 冒险性的资金现在并不活跃。这个就不具备可这个赛道整体向上的条件。在这种状况之下 ，可能很多的 资金相对比较保守的话 ，它会外溢到其他的一些行业赛道当中去寻找机会。那么八月份的表现最为突出 的就是医药这个板块 ，创新药这个赛道 ，整体基本上都是反弹的第一梯队。在中午的这一天 ，它是稍微 遭遇了一点小的波折 ，但是我们说这个是属于正常现象 ，因为它前一天的时候刚刚大涨 ，那么是属于正 常的回调。我们认为它之后还有顺势而为的机会。 发言人 06:25 除了这个赛道之外 ，像自动驾是这个方向 ，也值得看一下。特斯拉在刚刚宣布了九月初的时候要举 行cyber cab 自动驾驶出租车的发布会 ，相信会有一些阶段性的结果对外公布 ，这个是会激起一部分刺的 兴趣。整个 cyber cap 是属于智能驾驶这个赛道 ，特斯拉在中国有很多相关的配套公司 ，所以关注一下这 个产业链可能的受益机会 ，这个本质上还是属于人工智能在物理世界当中的应用 ，是潜力赛道之一。另 外一个人工智能在物理世界当中的应用是机器人 ，最近这一周也有一些事件 ，一方面是世界机器人运动 会的召开 ，让舆论和资金是关注度提升。但是另外一方面我们看到机器人第一股这个大头牌 ，在过去这 一周资本市场当中表现并不好。整体向下的这个回调达到了 40%，也导致整个的产业链向下陪同式的这 种回撤 ，这个细分领域在最近这段时间上下波动比较较大 ，一方面是受到科技赛道整体的拖累 ，另外一 E6636BB1012F9B6DA981D91E6DDB85E4435BBE8C036DD212FA6B463F47DFE56ABE9B9DEC4651EFD4A819A7CB9D1F40FC5260D4C3139B28935A5CFC7E5E02CE93C537635 方面实际上是因为这个赛道它并没有特别扎实的盈利。现在还是属于一个产业的启动期 ，没有盈利去打 底的时候 ，股价它往往波动就比较大 ，因为它是事件驱动型的。 发言人 07:45 我们之前跟大家聊到在今年的八月份到 9月份，美国这边特斯拉旗下的擎天柱机器人很有可能会去公布 它的量产消息 ，像这种事件性的利好信息在路上 ，就有可能会给他提供一些机会 ，这个大家也可以持续 的关注。这种赛道的特性就是你既然选择它 ，你就要接受它的高波动性。除了以上的这些细分领域之 外，今年下半年我们无可忽视的一个国家政策上的变化 ，就是财政政策策对于固定资产投资的重视有可 能会加速。这个在 8月21号周五的时候 ，国务院召开财政相关的新闻发布会 ，里面，就明确的点到 了，在未来几个月 ，要合理加快财政支出进度。预计在八月份九月份的时候 ，大家看地方财政支出上面 就能够看到相关的加速度。我们之前跟大家聊到这个政策所对应的一个抓手就是六张网的建设。六张网 当中，我们相对比较看好的是电网建设 ，对应的就是电网设备这个细分的领域 ，这个还是要密切的关 注。因为今年的下半年 ，财政力量是这个市场当中为数不多的一个亮点。资本在提前的去做一点布 局，顺势的去推动一下这个有潜力的赛道 ，也是一个大概率的事件。 发言人 09:01 以上，就是我们今天聊到的所有的内容 ，我们两句话小结一下。首先就是科技赛道 ，尤其是上半年抱团 比较严重的一些细分赛道。现在压力未减 ，我个人觉的不至于过早的去乐观。美国债券市场所遇到的这 个麻烦 ，到现在为止来看 ，虽然舆论上炒作的比较猛 ，但是我们说虽然恶化 ，但不至于天雷滚滚无可收 拾。现在美国政府正用强力手段去稳定它 ，这个可能最终会出现一个阶段性的僵局 ，就是美债的利率维 持在这个高的位置上 ，那么它继续的向上突破 ，这个难度也会加大。另外一方面 ，就是他所带动的一些 其他类的资产 ，包括黄金和比特币的快速的反弹 ，可能最快的那个阶段已经基本上的结束 ，而这种僵局 可能一直会维持到 10月底到 11月初。而在这个时间点结束之后 ，可能市场的波动会加大。 发言人 09:57 好了，以上就是我们今天聊。聊到的所有的内容 ，更多的咱们明天再继续 ，拜拜。以上所有内容和资料 仅供参考 ，不构成任何投资建议。股市有风险投资需谨慎。 E6636BB1012F9B6DA981D91E6DDB85E4435BBE8C036DD212FA6B463F47DFE56ABE9B9DEC4651EFD4A819A7CB9D1F40FC5260D4C3139B28935A5CFC7E5E02CE93C537635", "status": "extracted"}, "post:2026-08-23T21-44:6b12c2561218": {"id": "post:2026-08-23T21-44:6b12c2561218", "kind": "post", "title": "2026-08-23 21:44", "source_label": "帖子正文", "excerpt": "景旺电子26Q2：光模块和NVDA业务快速放量，Roadmap有序延伸；26H2有望超预期 20260821#26Q2业绩：营业收入47.2亿元，YoY+26%/QoQ+21%", "content": "景旺电子26Q2：光模块和NVDA业务快速放量，Roadmap有序延伸；26H2有望超预期 20260821#26Q2业绩：营业收入47.2亿元，YoY+26%/QoQ+21%；归母净利润3.69亿元，YoY+14%/QoQ+59%；扣非归母净利润2.76亿元，YoY-10%/QoQ+46%。受人民币升值影响，26H1汇兑损失1.23亿元、对公司净利润影响超1.5亿元；Q2非经常损益0.9亿，主要来自证券资产的公允价值变动。考虑汇兑、非经后符合预期。 2026年以来，公司在AI算力基础设施领域的客户订单导入顺利，需求快速放量，#释放节奏与规模均超出此前的预期，现有已建及在建产能预计未来数月内将无法充分覆盖快速增长的交付需求。#AI服务器及交换机：- 量产能力已至 800G@112Gbps 交换机、NVLink5/6@224G Scale-up Switch、GPU高阶HDI板；积极推进100层以上、11阶26层HDI、M9+/PTFE等下一代AI服务器、交换机、NPO、CPO、CPC产品相关技术的预研。 - 金湾高阶HDI工厂建设顺利，按计划进度投产，全部达产后预计形成80万㎡高阶HDI年产能。泰国生产基地建成后将具备40层以上超高多层板、高多层板及HDI等产品的量产能力。#光模块mSAP：26Q2 800G/1.6T光模块收入QoQ+1500%。 - 已经与立讯达成光模块mSAP板材供应战略合作，深度参与多家全球领先客户的高速光模块PCB供应。 - mSAP已成为800G及1.6T光模块PCB的主流技术路线，且正向3.2T、NPO、XPO延伸。 - 截至0630公司已在金湾建成3条mSAP产线，8月建成第4条，年内将建成5条。#文字观点", "publish_time": "2026-08-23 21:44", "tags": ["26Q2业绩", "AI服务器及交换机", "光模块mSAP", "文字观点"]}, "post:2026-08-23T14-02:9d61aab2ceb4": {"id": "post:2026-08-23T14-02:9d61aab2ceb4", "kind": "post", "title": "2026-08-23 14:02", "source_label": "帖子正文", "excerpt": "AI填料：产业升级中确定性品种，量价利三重通胀#产业升级中确定性的品种：在CCL材料中，填料是为数不多从辅材变主材，且不受下游方案变动影响，还持续受益产业升级的品种。不论下游选择M8、M9、M10还是PTFE方案，化学法球硅均会使用，且用量持续增加。", "content": "AI填料：产业升级中确定性品种，量价利三重通胀#产业升级中确定性的品种：在CCL材料中，填料是为数不多从辅材变主材，且不受下游方案变动影响，还持续受益产业升级的品种。不论下游选择M8、M9、M10还是PTFE方案，化学法球 在于 FAU。 📅第二代 CPO 预计于 2027 年六、七月份量产，核心变化在于 FAU 从合体式变为 DFAU，光路耦合工序被集成到 DFAU 中，天孚不再需要做独立的光路耦合。 🔥未来 ELS 模组环节竞争激烈。 🏆当前天孚通信在 ELS 模组上占据主导地位，主要得益于第一代 CPO 供应链尚未开放，天孚获得了先发优势。 ⚠️一旦供应链开放，旭创等光模块厂商将进入供应链，竞争加剧，价格预计下降 20%~30%。#文字观点", "publish_time": "2026-08-23 20:15", "tags": ["文字观点"]}, "post:2026-08-23T20-52:bb7a212a9d3c": {"id": "post:2026-08-23T20-52:bb7a212a9d3c", "kind": "post", "title": "2026-08-23 20:52", "source_label": "帖子正文", "excerpt": "【东山精密：追加5亿美元投资光芯片及光模块扩建项目】财联社8月21日电，东山精密(002384.SZ)公告称，公司拟对子公司索尔思光电及其子公司、维信泰国、盐城东山在常州、泰国、盐", "content": "【东山精密：追加5亿美元投资光芯片及光模块扩建项目】财联社8月21日电，东山精密(002384.SZ)公告称，公司拟对子公司索尔思光电及其子公司、维信泰国、盐城东山在常州、泰国、盐城等地实施的光芯片及光模块扩建项目新增投资额5亿美元，项目总投资额由12亿美元调增至17亿美元。本次对外投资额度的调整是根据公司战略规划及项目实施需要，为了更好的满足下游客户及行业发展需求，适应AI算力产业需要所做出的相应调整。#文字观点", "publish_time": "2026-08-23 20:52", "tags": ["文字观点"]}, "post:2026-08-23T21-27:41a4aa962bc7": {"id": "post:2026-08-23T21-27:41a4aa962bc7", "kind": "post", "title": "2026-08-23 21:27", "source_label": "帖子正文", "excerpt": "关注具体的订单落地外（更多是对于中短期利润释放节奏的跟踪），也可以通过PB即账面产能资产来拉长对于载板企业的盈利周期久期展望。", "content": "20260823 周观点（二）：重视全球ABF载板大周期背景下国产载板厂的利润弹性，#寻找紧缺的高端产能，#兴森科技 🔥 #国产算力带来的载板结构转移：国产载板企业在过去的三年中投了大量capex，但由于彼时ABF载板的 oversupply情况，产线的固定费用损伤了报表端，但#一旦国产算力开始带动相关产线的稼动率，经营杠杆弹性会非常大，同时国产算力的高速爬坡对于载板的需求斜率极大。 其二：海外载板企业的稼动率已接近满产，且有更高端的先进制程产品去迭代，同时大量的台湾载板企业和国产算力企业的长协在25Q3-26Q2到期，彼时对于一些新系列的国产算力产品，#国产载板公司对于这部分需求的承接将成为企业盈利的重大转折点。 🔥 #大CYCLE中可以利用PB端估值来拉长对于载板企业的盈利周期久期展望：IC 载板是强资本开支+供需周期，本轮周期中除关注具体的订单落地外（更多是对于中短期利润释放节奏的跟踪），也可以通过PB即账面产能资产来拉长对于载板企业的盈利周期久期展望。以台股及日股为例，南电 26年PB13.9x 27年PB 10.8x；Ibiden 26年PB 13.5x 27年PB 11.5x。如果以PB端估值来看兴森的载板业务，13x左右的PB估值有望贡献比较明显的市值弹性。 🔥#高速光信号对于PCB布线密度极限的突破，核心关注具备载板&MSAP双重布局的企业：在光模块尺寸标准化的背景下，1.6T光模块通道数从 8×100G 升级到 8×200G，信号线路数量翻倍；在此背景下，信号完整性及趋肤效应的权衡、散热问题等使得Msap成为光模块内部PCB的近乎必选项。此外到3.2T时代，线宽线距有望进一步降低至15/15μm 线宽线距的高阶 MSAP 工艺，PCB层数也会进一步提升。这里提示一个逻辑点，即IC 载板厂商在 MSAP 技术上的优势，载板公司通常比传统 PCB 厂商在MSAP领域更有优势，因为他们#已经在更严苛的载板制造中积累了深厚的精细线路制作经验。#文字观点", "publish_time": "2026-08-23 21:27", "tags": ["文字观点"]}, "post:2026-08-23T22-09:567e23f138f7": {"id": " BA配售观点更新）。\u003c/li>\n\u003cli>长江存储发布招股说明书，2026年Q1营收470.4亿元、归母净利润333.8亿元（较2025全年141.7亿元翻倍），国产设备预计充分受益（来源：13:59东吴机械帖）。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型：Harness成为Agent竞争新战场，算力景气与涨价共振\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：OpenAI通过开源Codex Harness把Agent开发基础设施标准化；Anthropic与Fractile达成约2.5亿美元初步供应合同（AI ASIC自2027年起交付）；阿里AI云与算力服务收入达484.37亿元、同比+45%（来源：14:01大模型商业化周报第22期）。\u003c/li>\n\u003cli>今天出现的催化/验证：英伟达AI服务器涨价超15%引发多空讨论；摩根大通预计AI芯片出货量2025-2028年CAGR达45%（来源：11:45涨价帖、20:51摩根大通亚洲硬件科技）。\u003c/li>\n\u003cli>对应证据来源：大模型商业化周报第22期、摩根大通亚洲硬件科技、15:40多空讨论帖。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>光通信/CPO：中报验证+CPO量产，板块景气持续\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：旭创中报亮眼验证800G高景气与1.6T放量；CPO量产叠加论文带动无源器件高关注；电芯片在光模块中价值占比约20%，是AI数据中心高速光互连核心器件（来源：14:01周观点更新、09:09申万计算机周报）。\u003c/li>\n\u003cli>今天出现的催化/验证：天孚通信在第一代CPO产品中占据核心供应商地位；东山精密追加5亿美元投资光芯片及光模块扩建项目（来源：20:15 CPO供应链调研帖、20:52东山精密公告帖）。\u003c/li>\n\u003cli>对应证据来源：周观点更新20260823、申万计算机周报、stocks.json关注池天孚通信/东山精密证据。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体/先进封装：扩产驱动产业增量，长存招股书强化逻辑\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：中芯国际、华虹宏力等Fab厂扩大资本开支，OSAT配套国产AI芯片新建先进封装产线；AI需求驱动存储芯片价格大幅上涨，长鑫科技、长江存储积极扩产（来源：19:45西部计算机帖）。\u003c/li>\n\u003cli>今天出现的催化/验证：长存招股书显示2026Q1营收470.4亿元、归母净利润333.8亿元；三星、SK海力士扩产拉动韩国主要半导体设备商上半年末订单积压量较去年底翻番（来源：13:59东吴机械帖、19:45西部计算机帖）。\u003c/li>\n\u003cli>对应证据来源：西部计算机帖、东吴机械长存招股书帖。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观/策略：美债高利率主导避险模式，“美元让位、美债优先”\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：市场对通胀粘性、政府财政可持续性、FED信誉担忧，叠加财政与AI CAPEX对债券市场有限资金的争夺，长端美债收益率大概率维持高位（来源：19:18中信前瞻美股科技周观点）。\u003c/li>\n\u003cli>今天出现的催化/验证：达利欧发布《国家如何破产：大周期》专栏，恰逢美债收益率冲高、黄金比特币大涨；百亿基金经理内参提出“美元让位、美债优先：黄金的长牛底牌更清晰”“9月仍是做多窗口”（来源：11:48达利欧解读帖、百亿基金经理内参20260823附件）。\u003c/li>\n\u003cli>对应证据来源：中信前瞻美股科技周观点、达利欧最新文章解读、百亿基金经理内参20260823。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>液冷/电源：机架功率跃升驱动单柜电源价值量激增，液冷进入订单兑现期\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：NVL72机架功率持续攀升，VR200及VR Ultra设计功率分别达444kW和1500kW，单柜电源价值量从GB200的3.7万美元激增至VR Ultra的67.3万美元，800V HVDC及固态变压器（SST）为长期演进方向（来源：20:51摩根大通亚洲硬件科技）。\u003c/li>\n\u003cli>今天出现的催化/验证：英伟达AI服务器涨价超15%，高功耗算力时代加速；液冷从“可选方案”走向高密度算力中心基础设施（来源：19:40 AI服务器涨价点评帖、20:44液冷板块观点帖）。\u003c/li>\n\u003cli>对应证据来源：摩根大通亚洲硬件科技、液冷板块观点20260823帖。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>英伟达部分大客户收到通知，明年初交付的服务器（含Vera Rubin和Grace Blackwell机型）多数情况下涨价超15%，三星、SK海力士、美光DRAM成本为主要推动压力（来源：11:45/11:48帖子）。\u003c/li>\n\u003cli>阿里巴巴拟向美国境外非美国人士配售800亿港元新股，为2019年港股上市以来首次，100%净额投向全栈AI建设（来源：13:58科创板日报、17:14 BABA配售观点更新）。\u003c/li>\n\u003cli>中际旭创中报亮眼，Q2归母净利79e，800G高景气+1.6T放量高增；Q2收入环比约+15%，受产能爬坡交付影响但订单需求强劲（来源：14:01周观点更新、中际旭创26H1交流附件）。\u003c/li>\n\u003cli>长江存储发布招股说明书，2026Q1营收470.4亿元、归母净利润333.8亿元，较2025全年翻倍（来源：13:59东吴机械帖）。\u003c/li>\n\u003cli>宝马新世代iX3开启预订，预售价26.99/29.99/33.99万元，定价较市场预期激进，大圆柱放量有望加速（来源：09:10亿纬锂能帖）。\u003c/li>\n\u003cli>宇树科技8月19日登陆科创板，2025年人形机器人收入8.68亿元、占主营业务收入51.78%（来源：19:41国金计算机&amp;科技帖、22:55浙商新兴产业周观点帖）。\u003c/li>\n\u003cli>世界人形机器人运动会开幕，机器人百米成绩9秒39破人类世界纪录（来源：11:51周末舆情热度帖）。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>9月及26Q4电新板块能否实现估值切换——锂电产业链中报业绩整体较好，电力设备部分公司出口订单较好，需持续关注事件催化（来源：21:32光大电新周观点0823）。\u003c/li>\n\u003cli>长端美债收益率是否持续维持高位，以及Hyperscaler借助金融市场补充AI CAPEX资金对债券市场的影响（来源：19:18中信前瞻美股科技周观点）。\u003c/li>\n\u003cli>中际旭创1.6T放量节奏与CPO量产后的供应链订单兑现，天孚通信在第一代CPO产品中的核心供应商地位后续验证（来源：14:01周观点更新、20:15天孚调研帖）。\u003c/li>\n\u003cli>“9月仍是做多窗口，科技回调就是加仓点”“中际旭创中报过关，FCC利空兑现或成情绪拐点”等机构判断的后续演绎（来源：百亿基金经理内参20260823）。\u003c/li>\n\u003cli>长存上市推进后对国产设备订单的实质兑现，存储扩产带来的设备/材料增量（来源：13:59东吴机械帖、19:45西部计算机帖）。\u003c/li>\n\u003cli>光模块mSAP与电芯片国产化主线：1.6TbE光模块PCB共14-16层、6-10层采用mSAP工艺，单模块微细铜箔用量大幅提升，电芯片由25G/50G向100G/200G升级（来源：09:09申万计算机周报、09:09美银电子材料月度跟踪）。\u003c/li>\n\u003cli>机器人量产进展：Optimus聚焦三、四季度产能爬坡，宇树科技上市后国产链与海外链共振情况（来源：22:55浙商新兴产业周观点帖、19:41国金计算机&amp;科技帖）。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>09:09｜⭐新集能源&amp;中煤能源&amp <script>
const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=(v)=>Array.isArray(v)?'<ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
