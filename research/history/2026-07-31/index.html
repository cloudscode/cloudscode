"2026-07-31 10:38", "tags": ["文字观点"]}, "attachment:files/Meta和微软26Q2财报重点速览20260730_原文.pdf": {"id": "attachment:files/Meta和微软26Q2财报重点速览20260730_原文.pdf", "kind": "attachment", "title": "Meta和微软26Q2财报重点速览20260730_原文", "source_label": "其他", "excerpt": "Meta 和微软 26Q2 财报重点速览 20260730_ 原文 2026 年07月31日 10:12 发言人 00:00 时间就今天凌晨的 meta 跟微软的财报的一些重点信息 ，跟大家做一个速览和分享。首先我们从整体的 趋势来讲 ，可以看到现在 meta 跟微软呈现出了完全分化的两个业绩的叙事。", "content": "Meta 和微软 26Q2 财报重点速览 20260730_ 原文 2026 年07月31日 10:12 发言人 00:00 时间就今天凌晨的 meta 跟微软的财报的一些重点信息 ，跟大家做一个速览和分享。首先我们从整体的 趋势来讲 ，可以看到现在 meta 跟微软呈现出了完全分化的两个业绩的叙事。包括盘后的股价表现来 看，也反映了资本市场不同的一个认知逻辑。 发言人 00:19 首先从 meta 来说，盘后我们看到是有一个明显的一个下跌核心。我们先总结一下 ，原因在于说本 身Q2的财报收入可能算是依赖 ，但是利润是显著低预期的那同时我们看到公司的自由现金流再度收 紧，同降90%以上的一个幅度。整个自由现金流的维度来讲 ，其实是非常岌岌可危的。同时公司全年他 再次指引也小幅上调 ，也加剧了市场对于在目前不断增大的 AI开发的情况下 ，如何去回收 ，有一个好的 商业回报或者闭环这样的逻辑的一个担忧。所以我们看到盘后是呈现了一个明显回落的 ，或者说下跌的 一个态势。 发言人 00:55 但微软的话我们看到完全不同 ，微软这次的财报可以说给目前显得 hyper scale 立了一个非常好的标杆。 我们看到从整体结论来说 ，微软这个 FY26Q4 ，也就是 26自然年 Q2的这个财报来讲 ，营收跟利润是双超 预期。其中 asia的收入增速提高到了 43%，之前一直是在 40%左右，这样的一个增速。而且公司指引下季 度的H的增速会进一步提高到 45%的一个增速。所以非常强势的反映出他的 AI回报目前是非常有成效的那 整个AI投入兑现的商业闭环也是在持续兑现。同时我们看到它的 M365 的这个产品的付费席位数也超过 了3000 万，竞争的席位环比增长是超一倍 ，这样的一个持续提升的一个状态 ，进一步验证它 AI投入兑现 的良好的商业闭环。 发言人 01:41 同时我们看到公司对于 AIPP全年的指引有适度的小幅下调。有的人投资人在担心 ，就是因为什么原因下 调。我们目前具体来看 ，还是受这次融资租赁资产的跨境口径重分类的一个影响。一会儿我会具体的分 析，主要受这个影响 ，26自然年的基本开支从之前的 1900 亿美金左右下调到了 1750 亿美金左右 ，一个 小幅的下调。但实际量层面我们看到没有太大的影响 ，所以这是对于微软来讲 ，但是因为它有形成了一 个良好 AI投入与回报的趋势 ，所以从股价上来讲 ，我们看到盘后呈现一个大涨的一个态势。所以目前其 实截止到现在 ，包括我们上周也分析了谷歌的这个财报的 ，情况。当时大家也解读过一个就是 AI投入回 报看不清 ，然后现金流转自由现金流转负这样一个偏悲观趋势的影响。 发言人 02:26 到目前为止 ，可能还就是亚马逊 ，然后这个四大这个 hyper scale 里面，我们看到确实呈现了一个明显分 化的一个态势 ，就是市场会奖励你 AI，整体这个投入下 ，它的回报比较良好趋势 ，能够看得新远期的这 个回报。这样的公司以及对现金流的趋势相对来说比较弱 ，对自由现金流不用太担心的这样的公司。另 外一方面 ，如果说这个回报衡量不是特别好的话 ，那目前的资本市场叙事或者解读来讲是偏悲观的。就 是我们先给这两个公司的业绩定一个性质 ，我们再做一个具体体的一个财报的一个解读。 发言人 03:01 先从meta 开始，我们看到具体来看的话 ，meta q2 的营收是有 608亿美金 ，是基本上符合预期的 ，同比 增速是 28%点。之前我们看到上个 quoter 同比增速 33%，但是二季度的这个营收也是属于 inline 的那整个 E6636BB1012F9B6DA981D91E6DDB8A045E8EBE5C036DD2A55A6E463F44DFE5AACEAB9DEC4252E6D4A  CFA Equity Analyst Daniel.Yen@morganstanley.com +886 2 2730-2863 Charlie Chan Equity Analyst Charlie.Chan@morganstanley.com +886 2 2730-1725 Morgan Stanley Asia Limited+ Daisy Dai, CFA Equity Analyst Daisy.Dai@morganstanley.com +852 2848-7310 Morgan Stanley Taiwan Limited+ Tiffany Yeh Equity Analyst Tiffany.Yeh@morganstanley.com +886 2 7712-3032 Morgan Stanley Asia Limited+ Ethan Jia Research Associate Ethan.Jia@morganstanley.com +852 3963-2287 Greater China Technology Semiconductors Asia Pacific Industry View AttractiveRecent memory cycle debate + CSP FCF concern + China memory position offload have caused a derating of old memory stocks, but we see stronger DDR4 pricing hikes and unprecedented legacy flash pricing power into 3Q. We think 1.0x 2028E BVPS offers good downside support. Changing tide on mainstream memory: According to Trendforce ( Exhibit 1), 3Q26 conventional DRAM mixed pricing is expected to increase by 13-18% Q/Q. Specifically, PC DDR5 pricing is seen rising by 15-20% Q/Q, server DDR5 pricing by 13-18% Q/Q, mobile LPDDR5(X) by 8-13% Q/Q, and NAND pricing by 10-15% Q/Q. Further, for 4Q26, Trendforce estimates price hikes of 3-8% Q/Q for conventional DRAM and 0-5% Q/Q for NAND. These estimated growth rates seem lower than some investors previously expected. Yet, recently, we've seen stronger legacy memory pricing: Similar to our prior note ( link), we believe DDR4 could enjoy continued monthly pricing hikes in 3Q. Compared to our pricing expectations one month ago, we believe CSPs are willing to offer higher pricing on DDR4 and may even try to sign a 1-2 year L TA (volume only) with suppliers. As a result, we believe monthly pricing could rise by 20%+ in 3Q, suggesting the Q/Q pricing hike could be 30% at least. We also continue to expect a 50-60% Q/Q price hike for SLC/MLC NAND in 3Q, and a 30-40% Q/Q price hike for NOR flash in 3Q. Position offload in A share likely to see some stabilization: GigaDevice issued an announcement ( link) that the company’s niche memory products may see substantial price declines in the future. We see this warning as a potential longer term trend, rather than a near-term possibility, as we continue to see a structural supply gap across DDR4, SLC/MLC NAND, and NOR flash, supporting continued strong price hikes. What is the downside support? GigaDevice (603986.SS): as a design house, it is hard to gauge the P/E floor, but the stock has already corrected 45.6% from its peak of Rmb840 as of Jun 29, providing some valuation support. Macronix/Nanya/ Winbond trade at 1.5x/1.2x/1.2x 2028E BVPS, respectively; 1.0x historically has been a strong downside support level for greater China IDM companies.Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. July 27, 2026 09:00 PM GMT Downloaded by zouguanzhong@cramc.hk Not for redistribution without written consent of Morgan Stanley M Idea 2Key Charts and Exhibits Exhibit 1:Latest pricing forecast for DRAM and NAND 1Q26 2Q26 3Q26E - Old 3Q26E - New 4Q26E - Old 4Q26E - New PC DRAMDDR4: up 120-125% DDR5: up 110-115% Blended ASP: up 110-115%DDR4: up 35-40% DDR5: up 45-50% Blended ASP: up 45-50%up 3-8%DDR4: up 15-20% DDR5: up 15-20% Blended ASP: up 15-20%up 0-5% up 3-8% Server DRAMDDR4: up 95-100% DDR5: up 93-98% Blended ASP: up 93-98%DDR4: up 50-55% 易台标普 500 指数上涨 167 个基点，收盘报 7437 点，尾盘出现 36 亿美元卖单。纳斯达克综合指数上涨 336 个基点，报 28106 点，罗素 2000 指数上涨 136 个基点，报 2945 点，道琼斯指数上涨 119 个基点，报 52209 点。 全美各美股交易所合计成交 177.45 亿股，对比年内日均成交 193.22 亿股。波动率指数下跌 1747 个基点，报 17.09，西德克萨斯轻质原油下跌 94 个基点，报 83.67 美元，美国 10 年期国债收益率下行 0.008 个基点，报 4.6692%，黄金上涨 117 个基点，报 4115 美元，美元指数下跌 93 个基点，报 99.95，比特币上涨 223 个基点，报 64858 美元。 经历持续低迷阶段后，市场迎来大幅反弹。 对冲基金本月处境艰难，周二更是自新冠疫情以来，首次出现三类主流策略单日跌幅均超 1% 的情况。 今日市场终于迎来喘息机会，我们跟踪的对冲基金多头核心组合相对空头核心组合的涨幅，创下新冠疫情以来第二大单日表现，涨幅达 4%。 开盘阶段交易活跃度瞬间走高...", "publish_time": "2026-07-31 08:29", "tags": ["交易台", "文字观点"]}, "attachment:files/联合解读政治局会议20260730.docx": {"id": "attachment:files/联合解读政治局会议20260730.docx", "kind": "attachment", "title": "联合解读政治局会议20260730", "source_label": "其他", "excerpt": "联合解读政治局会议20260730 要点总结 1. 宏观政策定调：存量为主，增量谋划 会议背景：二季度GDP增速回落至4.3%，低于全年5.0%目标，存在短期因素（中东冲突推高油价）、长期因素（房地产调整后消费能力弱、存量债务负担重）及基数效应（去年以旧换新政策推高基数）。经济判断：突出结构性特征，强调“高度重视经济运行中的困难和挑战”。", "content": "联合解读政治局会议20260730 要点总结 1. 宏观政策定调：存量为主，增量谋划 会议背景：二季度GDP增速回落至4.3%，低于全年5.0%目标，存在短期因素（中东冲突推高油价）、长期因素（房地产调整后消费能力弱、存量债务负担重）及基数效应（去年以旧换新政策推高基数）。 经济判断：突出结构性特征，强调“高度重视经济运行中的困难和挑战”。 政策基调：加大存量政策实施力度以稳增长；增量工具更强调“彼时的谋划”，未明确大规模新增。 财政政策：强调提高效率，加快财政支持和债券资金使用进度。上半年财政支出进度偏慢，存量资金仍有空间（如“两重”“两新”“六张网”等政策抓手）。但项目储备不足，上半年全国固定资产投资新开工项目计划总额同比下降，且五年规划开局年项目投建需时间，叠加双碳考核约束，预计下半年基建投资为温和反弹而非大幅回升。 货币政策：维持宽松态势，但降准降息时机尚不清晰。会议强调“综合运用及适时调整”“优化实施财政金融协同，促进内需”。今年以来已下调政策利率0.25个百分点，设立1万亿元民营企业再贷款，提高科技创新和技术改造再贷款额度。后续重点在于政策传导实施。 2. 资本市场：释放稳市场信号，A股迎来二次买点 会议表述：明确“深化资本市场投融资综合改革，提升资本市场韧性和信心”，较4月会议“稳定和增强资本市场信心”更为积极，释放稳市场、稳预期信号。 近期A股调整原因：内外负面因素偏短期，已逐步消化。全球AI市场担忧业绩匹配预期，但美国科技龙头业绩披露期已部分印证；韩国杠杆问题正由政府介入化解；美一冲突带来不确定性而非持续通胀抬升；美联储7月议息会议未提及加息，9月加息可能性存变数。 内部环境：市场情绪过热已消退，近期出现恐慌苗头；流动性和杠杆问题目前为个股现象，正处解决应对阶段，政策介入及时准确。 判断：A股当前条件不错，今年可能是过去五年业绩最好的一年，年初至今指数已转负，局部高估风险经调整后明显释缓。认为A股已迎来较好二次买点（参考7月20日报告）。 配置建议：短期红利高股息领域相对跑赢；科技板块后续可能分化，业绩能有效消化估值的领域有相对机会；其他品种如创新药、非银、贵金属有较好配置机会。 3. 固收：货币政策放松有望加快，推荐30年国债 货币政策展望：从去年中央经济工作会议到4月、7月政治局会议，政策基调始终积极宽松。但上半年放松节奏偏慢（一季度经济数据好，二季度油价推升通胀尤其是PPI）。下半年基本面边际走弱，通胀逐步下行，货币放松有望加快，降准降息值得期待。 债券市场：流动性进一步宽松对债券有利，收益率可能继续下行。近期股票市场偏弱，资金可能重新关注长端利率债市场，对10年期国债友好。 超长端推荐：30年与10年国债利差已从高点回落。历史上成长股与周期股相对价值变化对超长端利差有强指引。股市结构性变化可能使保险等传统配置资金更多关注30年国债，推动利差进一步压缩。继续推荐30年国债，下半年可能带来较好回报。 4. 房地产：表述简洁，市场平稳运行，关注核心城市房价变化 会议表述：仅“稳定房产市场”七个字，较4月会议“努力或着力稳定房地产市场”更为简洁，反映当前市场基本面相对平稳。 量价表现：7月高频口径新房及二手房交易量同比均有近一成增长；二手房自二季度4月以来连续4个月销售同比正增长；新房4-5月接近同比持平，6-7月同比增长。房价方面，年初至今监测60城房价月环比跌幅稳定在0.7%左右，较去年下半年收窄约一半，跌幅持续趋缓。主要受二手房供需结构持续优化的头部城市带动。 政策判断：纯粹房地产政策已基本应出尽出，短期内出现大幅变动（正向或负向）概率有限，维持现状概率更高。行业基本面自然演绎和宏观层面扩内需政策进展比纯粹地产政策更重要。 基本面展望：本轮修复根本来自头部城市供需结构优化，而非需求外生改善，因此修复节奏更慢但底部更扎实。下半年基数低，预期环境相对稳定，交易量同比表现或不差。但市场期待的催化剂是核心城市房价开始上行。最近一个半月深圳挂牌量已进入下行区间（类似去年下半年上海、北京状态），建议持续关注头部城市挂牌量及价格端变化。 板块：核心标的估值充分回调，业绩利空因素得到释放，传统行业流动性有改善，市场处于观望等催化剂阶段。 5. 科技硬件：国产AI算力链迎来布局机会 会议表述：聚焦“六张网”规划建设及“深入实施人工智能+行动”，口径与之前一致，强调国内算力基础设施大发展。 市场背景：近期海外科技股大幅调整（美股、韩国市场），A股及港股国产算力链标的回调幅度大（最高点回调40%以上，部分超50%），投资者信心受影响。海外算力链因美股大厂财报符合预期但未超预期而进一步下跌，带动国产链情绪走弱。 核心观点：市场悲观时应对国产AI算力硬件产业链基本面抱有信心。海外算力投资进入市场预期饱和阶段，交易拥挤导致回调必然；但国内情况不同：投资节奏与海外有明显时间差（过去受供应链问题制约，买不到卡），且中国大陆AI算力基建投资体量与北美差距仍大。国产化率提升逻辑强，供应链端（先进封装产能、存储、互联等）在技术水平、产能规模、量产预期等方面均有积极变化。预计今年下半年逻辑、存储等核心板块将迎来积极变化。 判断：国产算力链在15期间迎来前所未有发展窗口。近期急跌存在不理性因素，调整到位后（尤其9月以后）仍是市场热点。建议积极关注布局机会。 6. 科技软件：国产模型进步显著，关注治理与商业化 会议表述：继续强调“深入实施人工智能+行动”，并提出“完善人工智能治理体系”。 模型进展：过去两年国产模型进步明显（如DeepSeek、智谱、Kimi等），与海外最一流闭源模型差距缩小至3-6个月。下半年以DCC制图P0为代表的国产模型有望对标海外GPT-4.5/4.8/GPT-5.5水平，年底可达GPT-5.6或最新Florence模型水平。国产模型采用开放、普惠、服务全球的路线，开源模型使用占比迅速提升。 行业影响：国产模型兴起引发对海外闭源模型高投入商业模式的质疑，但降价不是商业化的敌人——模型作为基础设施应普惠，类似摩尔定律。国产模型开放态度对行业是正面促进。短期可能带来扰动（通胀逻辑受损，进入以量换价阶段），但中长期有利于下游生态繁荣，类似世纪初互联网发展。 治理方向：我国近期有诸多动作（WASC上联合多国成立AI投资组织，中美就AI大模型规范发展展开讨论）。未来需引导产业以合规有序方式进行技术迁移，避免无序竞争。有能力组织AI治理体系的只有中美两国，需更高强度、更广泛的国际合作。 市场影响：近期模型层变化带来相关标的明显调整，短期商业化前景受质疑。调整后更多国产模型公司有望证明自己，并走出国门服务全球开发者。 7. 可选消费：聚焦服务消费与供给侧优化 会议表述：“有效扩大国内需求，适应不同群体消费需求，扩大优质供给，挖掘服务消费潜力”。 变化一：延续消费供给端优化思路，进一步明确“适配不同群体”扩大优质供给。结合7月13日发布的扩大消费15规划，政策细化对养老、托育、家政、智能设备、文旅、健康、体育、教培、绿色出行、汽车、家居等细分行业的精准布局。消费者对优质产品需求未变，但需求交付效率、消费体验、附加情绪价值等有待提升。 变化二：更聚焦服务消费。4月会议同时提商品和服务消费，本次核心提服务消费。上半年商品零售额累计同比增速仅1.1%（受高基数及石油消费减弱影响），而服务零售额累计同比增速达5.3%，反映服务消费需求更旺盛。中长期看，我国消费进入从普及到升级、从日常满足到优质体验的转型阶段。国际经验显示人均GDP超1万美元时服务消费需求大增（我国2019年首次突破，2025年达1.4万美元）。扩大消费15规划将服务消费优先级提升至商品消费之前，明确“扩大服务消费，升级商品消费”目标。 投资思路：政策延续供给侧优化方向，关注各行业具有结构性机会的龙头阿尔法，结构趋势上更注重服务消费。 8. 基础材料与建筑：基建以稳为主，关注出海与城市更新 会议表述：涉及“两重两新”项目加快飞行建设，重提“六张网”。 资金层面：全年专项债额度4.4万亿元，上半年已发行约2.2万亿元，同比略降。下半年可发行额度约2.5万亿元。但去年10月曾新增2000亿元地方债专项债额度，全年实际发行4.6万亿元。因此下半年可用于基建投资的资金增量相对有限，以稳为主。 订单与项目：上半年基建投资项目招投标量同比下滑，已发建筑央企订单同比有个位数下降。7月以来高频招投标数量同比基本持平。综合判断下半年项目增量及资金增量均有限。 新增表述：会议提到“常态化解决企业账款拖欠问题”，结合地方政府化债背景，旨在跟踪资金拨付到位情况，避免事前拖欠。 展望：重点关注出海方向，以及电力工程、能源工程等景气度高的细分领域。城市更新（十五五规划）在15期间有较多增长空间。上半年基建实物工作量及重大房建工程实物工作量形成有限，更聚焦C端消费建材需求。建筑公司方面，出海是核心方向，报表出清和应收账款改善是未来主线。 问答整理 Q1：本次政治局会议对经济的判断与之前相比有何变化？ 答：会议对经济的判断比较突出结构性特征，但强调了要高度重视经济运行中的困难和挑战。背景是二季度GDP增速回落至4.3%，低于全年5.0%目标。原因包括短期因素（中东冲突推高油价）、长期因素（房地产调整后消费能力弱、存量债务负担重）以及基数效应（去年以旧换新政策推高基数）。 Q2：政策层面如何应对当前经济下行？ 答：政策更强调存量政策的实施。财政方面要提高效率，加快财政支持和债券资金使用进度，存量资金仍有空间（如“两重”“两新”“六张网”等），但项目储备不足，预计下半年基建投资是温和反弹而非大幅回升。货币政策维持宽松态势，但降准降息时机尚不清晰，重点在于政策传导实施。增量工具更强调“彼时的谋划”，没有明确大规模新增。 Q3：对A股市场当前走势和后续配置有何看法？ 答：认为A股已迎来较好的二次买点。此前调整的内外部负面因素偏短期且已逐步消化（全球AI担忧、韩国杠杆问题、美一冲突、美联储加息预期等）。内部市场情绪过热已消退，近期出现恐慌苗头，但政策介入及时准确。A股今年可能是过去五年业绩最好的一年，年初至今指数已转负，局部高估风险经调整后明显释缓。配置上短期红利高股息领域相对跑赢；科技板块后续可能分化，业绩能有效消化估值的领域有相对机会；创新药、非银、贵金属也有较好配置机会。 Q4：对下半年货币政策及债券市场有何展望？ 答：下半年货币政策放松有望加快。基本面边际走弱，通胀逐步下行，降准降息值得期待。流动性进一步宽松对债券有利，收益率可能继续下行。股票市场偏弱有利于资金重新关注长端利率债市场。继续推荐30年国债，其与10年国债利差有望进一步压缩，下半年可能带来较好回报。 Q5：如何看待当前房地产市场及后续催化剂？ 答：当前市场量价表现平稳，7月新房及二手房交易量同比均有近一成增长，房价跌幅持续趋缓。纯粹房地产政策已基本应出尽出，短期内出现大幅变动概率有限。市场期待的催化剂是核心城市房价开始上行。最近一个半月深圳挂牌量已进入下行区间，建议持续关注头部城市挂牌量及价格端变化。板块估值充分回调，市场处于观望等催化剂阶段。 Q6：对国产AI算力硬件产业链当前调整和后续机会怎么看？ 答：近期海外科技股调整带动国产算力链标的回调幅度大（最高点回调40%以上），存在不理性因素。但国内情况与海外不同：投资节奏有时间差（过去受供应链制约），体量差距仍大，国产化率提升逻辑强。供应链端（先进封装、存储、互联等）今年下半年将迎来积极变化。国产算力链在15期间迎来前所未有发展窗口，调整到位后（尤其9月以后）仍是市场热点，建议积极关注布局。 Q7：如何看待国产大模型的发展及其对行业的影响？ 答：国产模型进步明显，与海外最一流闭源模型差距缩小至3-6个月，下半年有望对标GPT-4.5/4.8水平。国产模型走开放、普惠路线，开源模型使用占比迅速提升。降价不是商业化的敌人，模型作为基础设施应普惠，有利于下游生态繁荣。短期可能带来扰动（通胀逻辑受损），但中长期正面。治理方面，未来需引导产业以合规有序方式发展，中美两国将扮演关键角色。 Q8：消费政策有哪些新变化？看好哪些方向？ 答：两个主要变化：一是进一步明确“适配不同群体”扩大优质供给，政策细化对养老、托育、家政、文旅、健康、体育等多个细分行业的精准布局；二 备难以满足加工要求，超", "content": "【天风电子】英诺激光：日系设备供货缺口显现打开超快替代空间，激光头自产助力公司放量生产 #行业核心逻辑：海外主力设备长期缺货-大幅加快超快激光国产替代 PCB行业二氧化碳激光设备主要由三菱等海外厂商供应，当前设备交期漫长、供货紧张，海外供给持续收缩。高端PCB工艺升级下，传统设备难以满足加工要求，超快激光替代窗口打开。公司处于国内超快激光设备产品化第一梯队，竞争优势显著，充分受益海外设备短缺带来的替换需求。 #公司核心稀缺价值：上游激光头自主量产-摆脱海外零部件紧缺约束 行业紧缺覆盖整机与上游零部件，激光头、光学棱镜均交付延期。国内大部分厂商依赖外购激光头，供应链稳定性不足，扩不出产能。公司少数实现激光头自产，具备整机全流程国产化能力，不受海外零部件供给制约，稀缺壁垒突出。 #产业格局推演：核心HDI场景技术路线不可逆 超快激光替代传统二氧化碳激光是长期确定趋势。高阶HDI渗透率持续提升，传统激光受物理限制无法完成精密微孔加工，下游高端场景必须切换超快激光方案。 #行业空间展望：超快钻孔赛道成长空间广阔-高密度互联带动ABF、HDI、mSAP设备需求提升 PCB行业向高...", "publish_time": "2026-07-31 16:20", "tags": ["文字观点"]}, "post:2026-07-31T08-10:bc7037c1b7b4": {"id": "post:2026-07-31T08-10:bc7037c1b7b4", "kind": "post", "title": "2026-07-31 08:10", "source_label": "帖子正文", "excerpt": "【长江电新】诺德股份2026年半年报点评：主业量价齐升，AI弹性可期，继续推荐！事件：公司发布2026年半年报，2026H1实现收入64.33亿元，同比+113.33%，实现归母净利润1.03亿元，同比+242.07%（上年同期亏损7243万元，扭亏为盈），扣非净利润0.51亿元，同比+159.59", "content": "【长江电新】诺德股份2026年半年报点评：主业量价齐升，AI弹性可期，继续推荐！ 事件：公司发布2026年半年报，2026H1实现收入64.33亿元，同比+113.33%，实现归母净利润1.03亿元，同比+242.07%（上年同期亏损7243万元，扭亏为盈），扣非净利润0.51亿元，同比+159.59%。拆分到26Q2，公司实现收入38.90亿元，同比+142.20%，实现归母净利润0.63亿元，同比+280.71%（上年同期亏损3476万元，扭亏为盈），扣非净利润0.29亿元，同比+170.62%。 1、单26Q2来看，预计出货量在2.8万吨左右，同比翻倍；结构上来看， 1）锂电箔方面，4.5/5μm极薄锂电箔占比在70%左右，中抗产品等高性能产品占比同样提升明显； 2）电子箔方面，RTF-3已有订单放量，HVLP-1,2系列出货稳增，占比预计在10%上下，HVLP-3,4配合客户积极验证。公司在基金测试和改造HVLP-4设备。 3）载体铜箔方面，产品验证顺利，等待客户反馈。 盈利端，估算公司单位盈利在2k+，主要得益于稼动率修复和结构性调整；非经端预计主要得益于政府补助和铜期权...", "publish_time": "2026-07-31 08:10", "tags": ["文字观点"]}, "attachment:files/铜箔等新材料板块投资机会20260730.docx": {"id": "attachment:files/铜箔等新材料板块投资机会20260730.docx", "kind": "attachment", "title": "铜箔等新材料板块投资机会20260730", "source_label": "其他", "excerpt": "铜箔等新材料板块投资机会20260730 要点总结 1. PCB铜箔核心驱动：AI服务器架构升级 AI服务器单机铜箔用量较传统服务器提升3倍以上，主要受益于英伟达等厂商的架构迭代（如从GB200到GB300，再到Ruby架构）。高端HVLP（超低轮廓铜箔）3-4代产品将随M9（英伟达下一代AI芯片）量产而放量，预计2026年下半年进入量产期，四季度及2027", "content": "铜箔等新材料板块投资机会20260730 要点总结 1. PCB铜箔核心驱动：AI服务器架构升级 AI服务器单机铜箔用量较传统服务器提升3倍以上，主要受益于英伟达等厂商的架构迭代（如从GB200到GB300，再到Ruby架构）。 高端HVLP（超低轮廓铜箔）3-4代产品将随M9（英伟达下一代AI芯片）量产而放量，预计2026年下半年进入量产期，四季度及2027年放量。 英伟达在AI GPU领域2025年市场份额约80%；其Ruby架构新增中板，是PCB铜箔本轮最大增量来源，单台价值量较上一代提升233%。 据测算，单台GB300高端铜箔用量约30千克；Ruby架构单台用量约44千克（若采用LPU应用，用量可能进一步提升）。 英伟达AI服务器出货量预测：2025年约3万台（以GB200为主），2026年提升至7万台，2027年9万台；到2027年，英伟达服务器高端铜箔需求接近4万吨，考虑65%成交占比，全球需求约6万吨；展望2030年，若英伟达出货18万台，全球高端铜箔需求接近12万吨。 全球PCB产值复合增长率约15%。 2. 高端PCB铜箔供给端瓶颈：产能释放缓慢 当前高端HVLP产品（三代以上）全球名义产能合计约3万吨，考虑良率折损后实际有效供给仅约2万吨。 海外日系、韩系企业主导：三井、古河、金驹等头部厂商有效产能不到2万吨；三井、卢森堡、台湾地区三家占全球高端产能约60%，实际供给超80%。 日企扩产意愿低：三井单月出货量从2025年11月的620吨增至2028年9月的1200吨，年复合增长率仅20%，远低于需求增速。 核心设备限制：表面处理机（日本厂商占全球70%以上份额）年产能仅8-12台，对应HVLP产能约1万多吨；全球表面处理机不到20台，对应PCB铜箔产能最多2万吨。设备交付周期24-30个月以上，订单已排至2028年。 阴极辊（RA需小于0.2微米）仅日本厂商能生产，交付周期约2年。 新增产能验证周期长：从标准箔到高端HVLP 3-4代需1-3年系统级升级认证；进入AI服务器供应链还需CCL、PCB、终端客户多环节验证，需1.5-3年。即使2026年投资产能，最早2028-2029年才能贡献实质性收入。 3. 高端铜箔技术难度与良率瓶颈 高端HVLP 3-4代产品生产分为溶铜造液、生箔制造、表面处理、分切包装四个环节，要求杂质小于1PPM、阴极辊RA小于0.2微米、表面粗糙度小于1.5微米（三代）或1微米（四代）。 不同代际产品良率差异大：RTF（粗糙度2-5微米）良率接近100%；HVLP 1-2代（粗糙度1.5微米以下）良率降至90%以下；三代良率约70%；四代良率仅50%-60%（日本企业），国内仅30%-40%。行业普遍认为四代以上良率存在上限，约70%以上。 实际供给远低于名义产能。 4. 产品价格与加工费趋势 不同产品加工费差异显著：标准箔约2万元/吨；RTF箔约5万元/吨；HVLP三代10-15万元/吨；四代20万元/吨以上（主要用于M8/M9）。 2024年至2026年，PCB铜箔已进行多轮涨价。2026年上半年涨价主要集中在中低端HT和RTF产品，原因是海外厂商放弃中低端产线转向高端，导致中低端供给缺口。 高端产品（HVLP 3-4代）2026年上半年未涨价，预期涨价集中在2026年四季度及2027年。 海外厂商定价权较强，价格较国内厂商高25%-30%。例如三井HVLP四代加工费25-28万元/吨，国内厂商15-20万元/吨。随着国产替代和良率提升，国内价格有望向日本厂商趋同。 5. 国内厂商受益逻辑 中低端产品：海外头部厂商集中转向高端，中低端（RTF、HVLP 1-2代）订单外溢至国内。国内大部分厂商已实现RTF及HVLP 1-2代量产，可承接这部分订单。 高端产品：国内德福和铜冠在HVLP 3-4代产品上已通过验证并开始出货，有望承接高端订单。 6. 锂电铜箔周期反转 前几年集中扩产导致产能过剩，2025年上半年行业亏损。后续亏损出清、头部集中度提升，价格逐步回暖。 当前锂电铜箔单吨净利润已回升至2000-3000元，但下游扩产意愿不强（回本周期8-10年，合理单吨净利约1万元）。 预计2026年下半年锂电铜箔仍有涨价趋势，单吨净利可能升至6000元；2027年合理回到1万元/吨。 极薄化趋势：4.5微米、5微米产品渗透率快速提升，单吨价格较6微米高5000-6000元。具备极薄产品能力的厂商（如嘉元科技、诺德股份）盈利能力有望进一步提升。 7. 核心标的 高端PCB铜箔：铜冠（1-4代产品均有批量出货，卡位好）；德福（1-4代产品验证通过，开始出货）。 锂电铜箔周期反转：嘉元科技、诺德股份。 问答整理 Q1：高端HVLP铜箔的供需缺口具体有多大？ 答：根据3M预测，2026年二季度高端HVLP产品缺口已达600多吨/月。我们测算，全球三代以上名义产能约2.5-3万吨，考虑部分产能未进入主流供应链及良率受限，实际出货不到2万吨。到2027-2028年，全球高端铜箔需求可能达5万吨左右，缺口非常大。即使假设所有供给释放，到2028-2029年全球新增有效产能也不到4万吨，缺口可能达3万吨以上。因此我们判断价格将进行多轮上涨。 Q2：国内厂商在高端HVLP 3-4代产品上的良率水平如何？与海外差距有多大？ 答：目前日本企业HVLP四代产品良率约50%-60%，国内仅30%-40%。行业普遍认为四代以上良率存在上限，约70%以上。国内厂商随着工艺积累和设备改善，良率有望逐步提升，但短期差距仍较明显。 Q3：锂电铜箔的涨价预期是基于什么判断？ 答：当前单吨净利2000-3000元，下游企业新建产能回本周期需8-10年，因此扩产意愿不强。但需求端（动力电池+储能）持续增长，供给端今明年不会有太大扩张。我们预计2026年下半年单吨净利升至6000元，2027年合理回到1万元/吨。此外，4.5微米、5微米极薄产品渗透率提升，单吨价格比6微米高5000-6000元，具备极薄能力的厂商盈利弹性更大。 Q4：表面处理机设备对高端铜箔产能的限制有多大？ 答：表面处理机是后续HVLP扩产的核心限制。日本厂商占全球70%以上份额，年产能仅8-12台，对应HVLP产能约1万多吨。全球表面处理机不到20台，对应PCB铜箔产能最多2万吨。设备交付周期24-30个月以上，订单已排至2028年，短期设备端是刚性瓶颈。 原文 铜箔等新材料板块投资机会20260730_原文 2026年07月31日 发言人 对，然后今天的话我这边主要是给大家重新介绍一下，通过这个板块投资机会。桐柏的话大家主要也是了解它是在这个PCP桐柏这一块。我们看到后续的话，PCB重搏的话，它主要会受益于AI服务器架构升级。我们可以看到后续的这个单机重铂用量的话，也会相较于传统的服务器会提升三倍以上。我们后续也会认为随着M9相关的这个产品量产的话，那高端的HVLP的3到4代的产品也会进一步的放量。 发言人 从供给端角度上来看的话，现在整体的高端HVLP产品主要还是以海外的日系、韩系主导。像是这个山顶、谷歌金驹等等这种高端的PCP厂商，如果加总起来的话，其实有效产能是不到2万吨的。然后其次就是从破产角度上来看的话，日企它的扩产意愿就比较低。那么呃像三井它的后续的年复合增长率其实也就在20%，是远低于我们这个LLD需求的一个增速。 发言人 另外一个方面的话，就是像这种表面处理机，包括应急管，它的这个高这个设备商其实也都在日本，然后他们的这个扩产周期其实也是非常慢。所以像现在普遍的这个交期的话，可能都得到2到3年时间。所以我们会认为这个产能释放节奏是相对说比较慢的。像现在这个帆船，它的年化的表面处理机也就在10台左右，那对应的这个产能可能也就一万多吨，全球的话可能也就十几台，不到20台。所以我们会认为后续产能释放的节奏是会比较慢的。 发言人 另外一个方面的话就是对于新增产能来讲的话，它的验证周期比较长，可能需要1.5到3年左右。所以我们会认为当前这个节点就算有新的产能投入的话，那可能得到28年的时候才会真正的产生这种实质性的收入。所以我们会认为接下来的几年时间的话，高端PCE铜箔的缺口是会持续扩大的。 发言人 然后第二个点的话就是锂电铜箔目前也是处在一个周期发展过程。所以我们合理的认为后续锂电箔的话也会给相应的企业带来一定的盈利预期。然后我们详细的介绍一下，现在铜箔板块的话主要就是分成锂电和电子博，然后从产能和产量角度上来讲的话，大概就是60分。 发言人 PCB同步的话也是现在可能大家最主要关注的一个板块。因为像现在我们这个TCB它主要是AI服务器的这个物理架构和信息高速公路。其中的话它会包含各种各样不同功能的PCB板。如果按照驾驶量的话，主要可以分为三层。一个就是高速度连层，然后大概是占了整个价值量的70%。 发言人 盆数的话大概是在24到32层，然后这一部分的这一部分的PC版的话也现在开始主要去使用HRP的3到4代产品。另外一个的话就是还包括这个通用计算层和这个配电辅助层。那么CCL的话它就是TCB的主要第一台，然后占它成本的50%到60%。其中铜箔的话就是这个CCL的核心导电层，占CCL成本的30%。现在随着信号传输的要求要越来越高，损耗越来越低的话，我们就要求铜箔的表面粗糙度要做到越来越小。铜箔它主要是分成两个面，一个光面的话就是用于这种精心线路的一个时刻，另外一个毛面的话就是用于与树脂结合增强附着力。 发言人 随着后续的高层要素的要求的话，我们会认为彭博它的表面粗糙度会往的极小的一个方向去发展。我们可以看到现在英伟达它的这个不同不同代的这种服务器架构。其实也从最开始的A100的这种像56的1个速度，然后一直要到增长到rooting的448的一个速度。基本上每每一代的话其实都有翻一倍的这么一个诉求。所以说我们会认为到最新一代的像ruby架构的话，可能就开始要切入到产品。 发言人 从PCB的这种分类角度来看的话，最开始的话就是这种APP1波，然后它的表面粗糙度可能就是 e spent was down notably in early Jul y vs. June , possibly due to summer holiday (less time spent from students) ; 2) Taobao & JD.com DAU saw slight decline YoY in June, in line with the weak consumption trend; PDD outperformed and sustained a notable lead in total time spent; 3 ) Byte Dance ’s Soda Music DAU kept rising (now higher than all TME ’s major apps) though time spent down MoM ; 4) Travel category extends YoY decline trend of time spent in June ; 5) Xiaohongshu time spent looks plateaued since late 2025; Bilibili time spent grew healthily ; 6) Tencent’ s key evergreen games engagement remains stable, despite Delta Force time spent slightly down MoM; 7) Bytedance ’s short drama app Red Fruit time spent surpassed Kua ishou main app since May; 8) Baidu search time spent continued notable decline trend YoY in June; 9) Bytedance local service Doushengsheng had c.20m DAU in June (2/3 of Meituan ’s Dianping app) . AI: engagement divergence with leader widening lead Bytedance ’s Doubao weekly DAU /total time spent grew to 165.7mn/11.7bn in the week of July 6, followed by DeepSeek ’s 30.7mn/3.5bn, Yuanbao ’s 8.7mn/669mn and Qwen ’s 27.9mn/772mn . On per user level, most AI apps saw slight declines in daily user time spent and daily sessions. Doubao ’s daily time spent/number of sessions per user edged down to 10 mins/ 5 time s in the week of July 6. DeepSeek ’s daily time spent/number of sessions per user declined slightly to 16 mins/ 8 times in the week of July 6. Our take : Doubao widening the gap with peers (e.g. Deep Seek, Yuanbao (Tencent) and Qwen (Alibaba) . Qwen per user time spent appears to be the lowest among peers. Transaction platforms: engagement remains resilient eCommerce: Taobao DAU/total time spent -2%/flat YoY to 410mn/253bn mins in June . PDD ’s DAU/total time spent was + 2%/+6% YoY to 392mn/ 316bn mins in June. JD’s DAU/total time spent -2%/-7% YoY to 1 77mn/101bn mins in June . Local Service: Meituan ’s DAU/total time spent +2%/-8% YoY to 17
