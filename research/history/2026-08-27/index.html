st:2026-08-27T21-21:a0f80df77b73", "kind": "post", "title": "2026-08-27 21:21", "source_label": "帖子正文", "excerpt": "20260827盘后消息汇总 AI 1.NV:十余家大行密集上调英伟达目标价 2.光纤：9月光纤光缆招标，9.9-9.11日深圳光博会 3.液冷：Google链条即将从验证进入订单", "content": "", "publish_time": "2026-08-27 21:21", "tags": ["文字观点"]}}, "source_details": {"post:2026-08-27T08-51:1c88dbd423fe": {"id": "post:2026-08-27T08-51:1c88dbd423fe", "kind": "post", "title": "2026-08-27 08:51", "source_label": "帖子正文", "excerpt": "📑英伟达业绩电话会议市场初步反馈解读💬初始的投资者反馈大多是积极的，我想应该没有人真的料到英伟达（NVDA）会这么早就对 2028 财年（FY28E）给出业绩指引，并且在他们的预测卡上抛出一个高达 70% 的增长数字。📈多头们在讨论 “为什么股价没有涨得更多？", "content": "📑英伟达业绩电话会议市场初步反馈解读💬初始的投资者反馈大多是积极的，我想应该没有人真的料到英伟达（NVDA）会这么早就对 2028 财年（FY28E）给出业绩指引，并且在他们的预测卡上抛出一个高达 70% 的增长数字。 📈多头们在讨论 “为什么股价没有涨得更多？”，并将此视作可能推动 AI 半导体板块再次 “无理暴涨” 的另一个潜在分水岭时刻。 📊买方和卖方的每股收益（EPS）预测数字可能都会上调，回顾财报公布之前，杰夫・法武扎的预测指标显示买方对 2027 年（CY27E）EPS 的预期为 16.5 美元，而华尔街的共识预期仅为 12.65 美元。 ⚠️然而，空头们强调，英伟达因毛利率下滑而看空的逻辑目前也在显现，源头内容加微WUXL3408因此现在的关键问题变成了：为换取实质上新增的 1000 亿美元营收，牺牲 1 到 2 个百分点的毛利率，是否是一个可以接受的折中方案？ ❓此外，关于 2028 财年新增的营收增长当中有多少是由涨价驱动的，市场也存在一些疑问。 📝虽然有很多内容需要消化，但以下是一些初步的解读，如果其中部分属于开放性问题，敬请谅解： 🔹内存 / 光模块 / ODM（原始设计制造商）：毛利率受到的冲击以及关于明年内存价格将进一步走高的评论，对于内存行业来说应该是一个积极的信号，意味着平均售价（ASP）趋势将更具韧性，美光（MU）和闪迪（SNDK）在盘后交易当中均上涨 4% 以上。 🔍但如果近期关于 HBM（高带宽内存）规格降级的市场传闻属实，英伟达现在基本上是在牺牲部分性能优先保障出货量，那么整体的 DRAM 容量是否会发生变化？虽然 HBM 的容量变低，但这有可能被更高的出货量抵消。 🤔不过受 3 比 1 折算率影响，更多潜在 HBM 产能回流传统 DRAM 会带来杠杆效应，传统 DRAM 的价格将会如何演变？ ✅与此同时，机架预测数量上行，这对于光模块 / 网络以及 ODM 厂商而言属于积极信号。 🔹新型云服务商（Neoclouds）/ 超大规模云厂商（Hyperscalers）：英伟达本次明确表示，ACIE（主权 / 消费互联网 / 公司）正在接过增长接力棒，已经占到数据中心营收约 50%，将成为未来增长的主要驱动力。 📈CoreWeave（CRWV）和 Nebius（NBIS）这类新型云服务商盘后分别上涨 5%、6%，管理层提到新型云的容量预计在今年年底达到 8GW，2025 年底为 3GW。 📉新型云服务商竞争力持续增强，对于超大规模云厂商（亚马逊 AMZN / 微软 MSFT / 谷歌 GOOGL 盘后表现平平），这算是一个隐性利空信号。 💬市场对此存在争论，该变化对 AI 基础设施建设究竟是利好还是利空，会不会最终抬升产能过剩风险。 🤝英伟达具备很强动力去扶持新型云服务商，这类厂商 100% 采用英伟达芯片，依托新的收入分成模式，英伟达提供资金支持的同时，能够在硬件销售、租金收入层面实现双重获利。 ⚠️但这也带来系统性风险，行业增长不再主要依靠资金充裕、现金储备充足的超大规模云厂商驱动，转而由负债更高、财务稳定性更弱的新型云服务商来拉动，如果 GPU 租赁商业模式失效，将会产生非常严重的后果。 🔹OpenAI（OAI）/Anthropic：尽管黄仁勋发言大多偏向外交辞令，对于开源、闭源模型的态度也存在矛盾，但依旧给予 OpenAI 以及 Anthropic 强有力的支持。 💡他表示两家公司销售额正在 “飙升”，利润率 “极佳”，正在产出盈利的 Token。 ✨他十分看好这两家公司，判断二者会成为 “历史上最大的科技公司”。 🔧即便两家公司源头内容加微WUXL3408都在自研定制 ASIC（专用集成电路），但他认为在很长一段时间之内，二者依旧会是英伟达的客户。 😌对于前沿实验室来说，该表态能够安抚市场，缓解市场对于年经常性收入（ARR）增速放缓、开源模型带来竞争冲击的担忧，尤其当下临近 Anthropic IPO。 🔹电力（Power）：黄仁勋提到，英伟达已经不只是单纯销售算力，业务向下游延伸，和发电公司、土地厂房、冷却设施的合作伙伴开展合作，进一步印证电力是 AI 部署当中关键的物理瓶颈之一。#文字观点", "publish_time": "2026-08-27 08:51", "tags": ["文字观点"]}, "post:2026-08-27T09-32:5a72246de936": {"id": "post:2026-08-27T09-32:5a72246de936", "kind": "post", "title": "2026-08-27 09:32", "source_label": "帖子正文", "excerpt": "【国投硬科技】 英伟达业绩与指引双双超预期，Rubin接棒驱动再提速 业绩与需求端继续#超预期。英伟达2Q营收$96.2bn（+106% YoY/+18% QoQ，Cons. $92.38bn），Adj. EPS $2.22（+120% YoY）", "content": "【国投硬科技】 英伟达业绩与指引双双超预期，Rubin接棒驱动再提速 业绩与需求端继续#超预期。英伟达2Q营收$96.2bn（+106% YoY/+18% QoQ，Cons. $92.38bn），Adj. EPS $2.22（+120% YoY）；超大规模客户收入$48.71bn（YoY超一倍，Cons. $43.55bn）。数据中心收入$89.0bn（Cons. $85.86bn）；3Q营收指引$108bn ±2%（Cons. $105.15bn），对应中值约+12% QoQ。‼️更超预期的是，公司罕见给出FY28展望，#预计营收同比+70%，显著高于此前45%的预期。我们判断，增长将由OpenAI、Anthropic、SpaceXAI等Frontier Labs，以及AWS、Azure、GCP、OCI等Hyperscaler与Neocloud共同驱动，其中AWS已计划新增部署200万颗GPU，当前核心矛盾仍在供给而非需求。 毛利率短期承压更多来自成本与定价节奏错配，而非需求恶化。2Q毛利率75.0%，3Q指引74.0% ±50bps，预计Q4阶段性触底；公司未来采购承诺单季由1190亿美元增至2790亿美元，主要用于提前锁定内存等关键零部件及产能。#但FY28伴随提价落地有望回升并稳定在72%-73%，业绩能见度在提升。 产品与互联架构同步升级。Vera Rubin#已启动全面量产，预计FY27Q3开始客户导入并放量，当前已获得主要Hyperscaler、AI云厂商及OEM订单；Vera Rubin NVL72在智能体工作负载下较GB300 NVL72每MW吞吐量最高提升30倍、每百万Token成本最高下降至约1/35，对应单GW收入亦由Hopper约180亿美元、Blackwell约250亿美元提升至#Rubin约400亿美元。与此同时，Spectrum-6已开始导入Gigascale AI Factory，并#同时覆盖可插拔光模块与CPO方案；伴随Rubin进一步提升NVLink Scale-up与Spectrum-X Scale-out带宽需求，交换机、1.6T光模块、CPO等高速互联环节有望持续受益。 ☎️欢迎联系csy#文字观点", "publish_time": "2026-08-27 09:32", "tags": ["已启动全面量产", "预计FY27", "同时覆盖可插拔光模块与CPO方案", "文字观点"]}, "post:2026-08-27T09-51:2467e4f7205a": {"id": "post:2026-08-27T09-51:2467e4f7205a", "kind": "post", "title": "2026-08-27 09:51", "source_label": "帖子正文", "excerpt": "📬NVIDIA业绩及指引全面超预期，Rubin量产开启新一轮上行周期，持续看好AI PCB产业链30秒结论与最核心预期差 业绩及指引全面超预期，FY28增长展望显著强化中长期算力景气判断！FY27Q2收入962.2亿美元，同比增长106%，较FactSet一致预期高4.3%", "content": "📬NVIDIA业绩及指引全面超预期，Rubin量产开启新一轮上行周期，持续看好AI PCB产业链30秒结论与最核心预期差 业绩及指引全面超预期，FY28增长展望显著强化中长期算力景气判断！FY27Q2收入962.2亿美元，同比增长106%，较FactSet一致预期高4.3%；non-GAAP EPS为2.22美元，超预期6.2%；数据中心收入890亿美元，同比增长117%，较Visible Alpha预期高3.9%。FY27Q3收入指引中值1080亿美元，较一致预期高约3%，且未计入中国数据中心计算收入。 #最重要的增量：管理层首次明确预计FY28收入同比增长约70%，并强调该展望受到供给能力限制、实际需求高于这一水平。叠加Vera Rubin进入全面量产、AWS新增部署200万颗GPU，我们认为NVIDIA正在从Blackwell周期顺利切换至Rubin周期，AI算力产业链景气度和订单能见度进一步提升。下季度展望： FY27Q3收入指引为1080亿美元±2%，同比增长约89%、环比增长12%，较FactSet一致预期高约31亿美元。公司明确表示，指引中未计入任何中国数据中心计算收入，意味着即使不考虑中国市场恢复，全球AI需求仍足以支持超预期增长。业绩说明会要点 1️⃣、管理层对需求的表述明显强化。公司预计FY28收入同比增长约70%，且这是基于现有供应能力给出的预测，#实际需求明显高于公司能够供应的水平。因此，算力需求并未进入放缓阶段，供给仍是未来几个季度的主要约束。 2️⃣、Vera Rubin已经进入全面量产，CoreWeave、Google Cloud、微软Azure、Oracle Cloud及Nebius等客户已有机柜运行。 3️⃣、公司与AWS进一步扩大合作，计划于2027—2028年额外部署200万颗NVIDIA GPU。需求来源也由少数头部模型公司扩展至多家前沿AI实验室、开源模型、企业Agent和Physical AI，客户及应用结构更加多元。 4️⃣、Spectrum-6交换系统已开始进入全球大型AI工厂，同时支持可插拔光模块和CPO。Rubin由单芯片升级为包含GPU、CPU、NVLink、Ethernet/InfiniBand及光互连的整套系统，网络侧价值量有望继续提升。 5️⃣、存储成本是主要压力，但其背后同样反映AI需求强劲。公司判断存储供给紧张可能持续至FY28末，并已大幅增加长期采购承诺。短期影响NVIDIA毛利率，但对HBM、DRAM及存储设备材料产业链构成进一步景气验证。持续看好AI PCB产业链：PCB：深南电路、景旺电子、沪电股份、鹏鼎控股、生益电子、胜宏科技、方正科技、广合科技等CCL：生益科技（PTFE CCL）、南亚新材铜箔：德福科技、方邦股份设备：大族数控、鼎泰高科#文字观点", "publish_time": "2026-08-27 09:51", "tags": ["文字观点"]}, "attachment:files/铂科新材（300811）2026年半年度业绩交流会20260826.pdf": {"id": "attachment:files/铂科新材（300811）2026年半年度业绩交流会20260826.pdf", "kind": "attachment", "title": "铂科新材（300811）2026年半年度业绩交流会20260826", "source_label": "其他", "excerpt": "铂科新材（ 300811 ）2026 年半年度业绩交流会 （20260826 ） 要点总结 1.2026 年上半年业绩概览 ：上半年营业收入 11.8亿元，同比增长 37.4% ；归母净利润 2.25亿元，同 比增长 17.95% 。", "content": "铂科新材（ 300811 ）2026 年半年度业绩交流会 （20260826 ） 要点总结 1.2026 年上半年业绩概览 ：上半年营业收入 11.8亿元，同比增长 37.4% ；归母净利润 2.25亿元，同 比增长 17.95% 。Q2单季营收约 6.9亿元，同比增长 45%、环比增长约 41%~42% ；Q2单季净利 润 1.37亿元，同比增长 16.6% 、环比增长约 55%。 2.盈利质量：毛利率净利率环比改善，但新增股权激励费用扰动 ：Q2毛利率和净利率环比均有改善， 与Q1年报说明会 “Q1成本端影响因素在 Q2削减”的预判一致。 2026年4月实施一期 5年期股权激 励，全年股权支付费用约一个多亿， Q2单季摊入约 2700万元（ Q1仅约150万元），对 Q2毛利、 净利形成一定拖累；汇兑损失等与 Q1类似的负面项仍在。 3.芯片电感高增，模组式占比跃升 ：Q2芯片电感营收 2.55亿元（ Q1约1.6亿元，环比增长 约 60%），上半年合计约 4.1亿元，略少于 2025年全年约 4.3亿元，全年超过去年无悬念。 Q2模组式 占芯片电感营收比例提升至 75%~80% （Q1约50%），提升快于预期，主要对应 ASIC行业及部 分 GPU客户的垂直供电需求，预计 Q3、Q4占比不会明显低于当前水平。 4.TLVR 电感进入规模化放量阶段 ：上半年 TLVR 占芯片电感营收约 35%~40% （约一个多亿），占模 组电感营收约 40%，当前出货以模组式 TLVR 为主。时间线： 2024年半年报首次披露（测试验证阶 段）→2025年小规模突破 →2026年上半年规模化放量。按在手订单看，全年 TLVR 占比预计维 持 30%~40% 区间，可能接近 40%。 5.产品价值量与 ASP趋势向上 ：芯片电感高度定制化、单独设计报价，模组式 ASP约为分立式 的 2~3倍。单卡价值量指引：传统模组式约 200~300 元，部分采用 TLVR 提升至 300~400 元，全部采 用TLVR 及以上配置可达 400~500 元，市场交流区间可放宽至 300~600 元。底层驱动为 GPU功率继 续提升、 ASIC功率逐步向 GPU接近，芯片出货量与单位功率提升共同推动用量和价值量增长。 6.VPD方案： AI服务器三次电源的主流方向判断 ：VPD为2026年市场新关注点，公司已完成定性判 断与定量统计；从物理规律看 VPD具备更高密度、更低损耗，大概率成为 AI服务器三次电源的主要方 向。部分 GPU厂商未来可能采用，具体迭代节奏仍存不确定性。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 7.TLVR 价格与毛利率策略 ：价格区间两相约 6元、四相约 8元、四相高端案子约 14元，当前批量交 货主流在 6~8元，更贵的新案子预计明年量产； TLVR 整体价格比模组电感略高，两类价格带有部分重 叠。定价采用成本加成法（加成 40%~60% ），主体毛利率维持 50%左右、复杂案子略高但控制 在 60%以内，公司保持长期稳定定价预期，不做供给紧张下的大幅提价。 8.订单与产能：供不应求，惠东一期爬坡顺利 ：芯片电感在手订单约 9个多亿，基本供不应求，按上 半年4个多亿交付节奏估算，订单能见度可覆盖至明年上半年（订单为滚动口径）。惠东一期（第二块 芯片电感基地）于 2026年6、7月启动产能爬坡，目前爬坡约一个多月、整体顺利， 2026年下半年为 全力爬坡状态，预计 2027年上半年满产，为下半年主要产出贡献和营收支撑。业务批量化接近 3年， 工艺已从铜铁共烧多轮升级迭代，实现多工艺并行。 9.供需格局与价格展望 ：2025年Q4至2026年Q2，ASIC起量速度快于 GPU侧，公司优先交 付 ASIC主流的模组式电感及部分 GPU的VPD新方向； ASIC端增长驱动来自 Google 、亚马逊等大 型 CSP厂商，预计 2027年有更多量的提升和产品迭代。报价综合考量成本、性能难度、生产难度及供需 状况，随模组式占比提升、 TLVR 渗透及供给偏紧，整体价格存在向上趋势。 10.磁芯业务：光伏超预期、服务器电源高增，全年指引上修 ：Q2磁芯营收约 4.2亿元，占 Q2总营 收约60%（芯片电感约 36%~37% ，磁粉约 2~3个百分点）。光伏占总营收 35%~36% 、与Q1基本 持平，但绝对值环比增长接近 40%，超预期主要来自储能旺盛需求及光伏回暖（叠加 Q1季节性低基 数）；服务器电源占比接近 7个百分点、绝对值环比增长约 40%，为增速最快的磁芯下游； UPS稳 健、快于正常增速。全年磁芯营收增速目标从最初约 10%上修至争取 15%左右（以实际经营为准）。 11.竞争格局与核心壁垒：合金粉末垂直一体化构筑稀缺性 ：传统 TLVR 方案以其他软磁材料 +粘结式 工艺为主，大功率大电流下 I²R损耗过大，村田、 TDK等传统巨头在 AI算力电源浪潮中缺席，核心卡 点在材料端。铂科是全球为数不多实现 “合金软磁粉末 →整形→一体成型电感 ”垂直一体化的厂商：细 粉粒径需 10微米以下，球形度和氧含量控制要求极高，得粉率低则剩余 70%~80% 粗粉无消化渠道， 铂科依托庞大粉芯基础规模消化粗粉、形成内部微循环闭环。日本厂商因错过合金软磁粉末降价竞争窗 口退出，韩国、美国厂商逐步退出中国市场，目前铂科为全球量最大、技术指标最优的合金粉与粉芯供 应商。 12.设备与工艺壁垒 ：公司 2009年率先将气雾化生产工艺引入合金软磁行业，设备已升级至少六代以 上，核心部件完全自控、从不外购整套系统；材料工艺类似模拟芯片，参数变量繁多，十几年连续生产 数据积累构成经验壁垒，难被外部复制。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 13.与乾坤科技的路径差异 ：乾坤走非晶纳米晶路线，粉材从日本采购（好几百元 /公斤）、热压工 艺、致密度略低；铂科走铁硅、铁硅铝合金粉末路线，高压成型 +铜铁共烧工艺，功率密度略高、大部 分性能指标更优。日本粉产能若不扩产且被锁定，国内同行面临价格与供给双重制约。下一代技术储 备：已研发出铁硅 5代粉末压制的新一代电感，可支撑 5兆~10兆开关频率，当前受制于半导体功率 器件水平（ 3兆时管子即烧爆），属预研储备。 14.主要客户与产业链卡位 ：MPS方面，局限在 AI算力（ GPU+CPU ）领域铂科占其采购八成以上份 额、部分案子为主控； MPS在Google 侧有进展但尚未见批量订单，预计 2026年底或 2027年初，对 应新方案、新一代芯片设计。 TLVR 方案最早由 Google 尝试（从 2025年两相演进到当前四相）， MLCC 涨价缺货进一步推动终端采用 TLVR；除Google 外，AWS、未来 NV均可能成为趋势性客户， 当前批量交货以 ASIC芯片为主的两家下游终端为主，交互最活跃的以 AWS相关识别项目为主。台达 电源方案主力用乾坤普通型电感，铂科供应特殊要求产品及二次电源（ 48V转12V）磁芯（乾坤不做 磁芯）， 2026年已有新机种起量、增长较快； 2025年Q3开始向另一家客户服务器机种方案供货，未 来新增机种预计逐步从铁氧体切换为合金磁芯二次电源。伟创力 Flex份额情况较好，国内供货大部分 由铂科提供。 15.光模块场景 ：800G 光模块不使用铂科合金粉芯芯片电感， 1.6T起才导入（功率加大、物理空间不 变驱动供电优化），目前为批量交付状态，交付给下游电源客户再集成至光模块。 1.6T使用分离式芯 片电感，单颗光模块用量 1颗、单价约 2元人民币； 2.4T、3.2T价值量确定上升，但尚未开始供 应 2.4T样品。直接客户以 MPS为主，另有国内一家客户，终端指向一致。 16.Blackwell/Rubin 迭代与 DDR5 跟踪：Rubin 系列是否混搭暂不确定，但方向朝 TLVR 或模块化 演进，再往后一代比较确定走模块化路线；若采用模块化 TLVR（模块化 VR电感），属铂科优势区 间，有望成为超越乾坤的机会窗口（分离式电感工艺相对简单、占用产能、非铂科强项）。 DDR5 市场 供不应求导致 DDR6 升级节奏放缓，五大厂商未急于推动六代方案；项目方案延迟对正处于扩产爬坡 期、产能不足的铂科反而是利好。 17.港股上市进展与资本开支 ：2026年7月上旬向港交所递交材料，已收到联交所和香港证监会反 馈、正在回复，后续等待证监会国际部备案（预计约半年），预计 2027年一季度完成上市流程。公司 在产能储备上会比此前步子迈得更大（ AI时代升级节奏显著快于新能源板块），整体保持稳中有进、 稳定健康发展的基调。 问答整理 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 Q：目前整体产能利用率水平、生产线调试良率是什么状态？芯片电感在手订单的可见周期大 概是几个月？ 答：新厂房是第二块基地， 6、7月份开始爬坡，目前情况比较顺利。由于生产的案子料号较多，良率 和利用率不好一概而论，有的案子已经开始爬坡，有的刚开始准备爬，整体综合情况比较顺利，这块会 是今年下半年主要的产出贡献以及营收端支撑。芯片电感订单大致 9个多亿，这个数据是滚动的，以目 前上半年营收 4个多亿来看，这个订单水平应该能接近到明年的水平，但下半年实际交付和确认营收要 考虑产能端情况。订单和产能互相影响，随着产能提升客户订单需求也会滚动变化，后续需密切关注数 据变化。 Q：从模块化到 TLVR 再到VPD，三个方向的趋势发展如何？铂科在这三个方向的技术储备及 与器件厂商合作中的优势在哪里？ 答：模组式电感对我们而言不算特别新， 24年Q1开始批量交付时就有交付模组式电感，从去年下半 年开始占比明显提升。模组式与分立式是供电结构不同，模组式一般比分立式价值量高出 2倍到3倍， 其单位价值或 ASP与算力和功率相关， GPU未来可能向更大功率提升， ASIC的功率水平也可能逐步 接近，芯片出货量提升和功率提升会带来单位用量的提升。 VPD是今年市场新关注的事情， TLVR 电感 相比传统电感难度和价值量提升，但目前刚开始，提升幅度要看具体案子设计，主流 TLVR 以2相为 主，未来可能 4相或8相，价值量需结合实际案子统计，但综合价值应呈上升趋势。 Q：难度和价值量提升的同时，单台终端（单台服务器或单台芯片）的用量和整体 ASP是什么 趋势？ 答：模组式电感比分立式价值量高出 2到3倍，单位价值或 ASP与算力和功率相关，随着 GPU和 ASIC功率提升以及芯片出货量增长，单位用量和价值量都有提升。 TLVR 电感也会进一步提升价值量， 综合ASP呈上升趋势。 Q：新产能供不应求背景下，未来资本开支的资金来源会不会有压力？港股上市目前是什么计 划？ 答：港股上市的进展：七月上旬递交材料，现在已得到联交所和香港证监会的反馈，正在回复反馈，后 续等待证监会国际部备案，备案大概需要半年左右时间，预计在明年一季度完成。 Q：TLVR 电感的单价和利润率水平如何？主要用在哪些终端案子上？ 答：TLVR 电感是一种跨电感电压调节器，能稳定输出电压，兼具部分电容功能，可降低 30%的MLCC 高容电容使用。每家电感客户方案不同，单价有差异，有两相 6块、四相 8块、4相14块的，价格区 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 间较大，目前批量交货的大概在 6到8块，更贵的新案子明年才量产。主要终端用途是大功率大电流脉 冲工作环境，如 AI算力芯片，以 ASIC芯片为主的两个下游终端，交互最多的是以 AWS相关识别项目 为主。目前批量交货以模组式 TLVR 为主，毛利率保持长期稳定，大概 50%左右，复杂案子可能略 高，在 60%以内。 Q：上半年 TLVR 占芯片电感约 30%出头，往下半年或明年看，这个比例有可能再大幅提升 吗？ 答：上半年 TLVR 电感占整体芯片电感的 30%出头，占模组电感的 40%。从下半年目前在手订单看， 今年估计仍在 30%-40% ，可能会接近 40。未来技术趋势没问题，但具体客户切换时间不确定，主动 权在芯片公司和电源公司，从送样阶段看都在做升级优化。 Q：采用 TLVR 方案后，对应单颗 GPU的颗数或价值量能到什么水平？之前认为 ASIC 单卡 对应200左右，现在大量使用 TLVR 后对应价值量会到什么水平？ 答：准确单卡用多少颗电感掌握不到，但总体从分离式到模组再到 TLVR 模组，价值量肯定上升。以前 模组大概是 200到300，现在部分采用 TLVR 可能到 300到400，400到500主要看全部采用还是部 分采用，比例有变化，所以目前没有一个准确的单卡总价值量，大概就是上述区间，可能到 300到 600之间。 Q：公司在 M客户（ MPS）这边的份额大致有多少？ M客户在 Google 那边的份额有可能明 显提升吗？ 答：只能谈与 MPS之间的交流，下游交流不了解也不能乱说，基于商业机密也不能公开。如果局限 于 AI算力相关 GPU加CPU这块，我们占 MPS有8成，某些案子肯定主控。 MPS以前也配合其他非算 力电源，统计口径不同会有差异，在 AI算力芯片这块我们占较大份额。 MPS在下游 Google 等有进 展，但从我们这边还没有批量订单，估计要看年底或明年初，那是为新一代芯片设计的方案。 Q：怎么看现在行业的供需格局？电感有多种生产工艺，在产能受限背景下，不同工艺对快速 交付有没有差异？ 答：目前交付压力比较大，整体市场包括内部对今年新基地产能爬坡非常重视，客户下单会考虑自身周 期和爬坡情况。工艺方面，最开始是铜铁共烧工艺，但批量近 3年工艺已发生很多升级迭代，现在有多 种工艺，生产难度有细微区别，过去一年各工艺良率正常。新产能释放会根据客户需求设计产品性能和 选取合适工艺，上半年交付肯定不止一种工艺。供需格局方面，今年 ASIC起量更快，从去年 Q4到今 年Q2，我们把更多精力放在模组式电感交付上，因为主流 ASIC采用； GPU某些厂商未来可能采 用 VPD方案， VPD大概率成为 AI服务器三次电源的主要方向。上半年已交付及在手订单主要排产为模组 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 式电感。 ASIC今年相比去年有较大增长，主要 CSP如Google 、亚马逊明年可能有更多量提升和迭 代。因此产能投放很重要，我们下半年全力上设备、爬坡、交付，希望明年较早时候新基地满产，扎实 做好自身生产经营和扩产，积极配合客户和市场变化。 Q：包括一些同行都在尽力爬产，如果供给紧张，会不会体现在后续新订单的价格上？ 答：芯片电感产品是偏定制化，每一批案子或料号需要重新报价，报价过程综合考虑案子的成本、性能 难度、生产难度，也会考量供需情况进行报价。从判断来看，无论是模组式电感占比变化还是 TLVR 变 化，以后报价会综合考虑，随着时间过程，价格会有一些上升趋势，因为整体难度在上升。 Q：磁芯业务 Q2表现不错，看 Q3和下半年，这块的稼动率和需求景气度怎么展望？ 答：磁芯业务在 Q2比年初预期稍好。一方面储能领域拉动， Q1光伏领域增长幅度相对有限， Q2环 比同比都有增长，储能是主要增速贡献。服务器电源和 UPS与AI关联度较高，服务器电源增速最快， UPS稳健但比正常增速快。今年年度磁芯营收可能争取 15%左右或根据实际情况评估，相比最开始预 期10%左右有所改善。 Q：比较看好 TLVR 环节，请梳理行业未来竞争格局（乾坤、铂科、龙磁、顺络在做，麦捷、 横店东磁也要来做），包括技术壁垒、客户认证环节，展望未来 2-3年的行业格局和市场份额 划分？ 答：TLVR 电感不是新鲜事物，但在算力功率加大、大电流情况下体现稳压功能并要求更高功率密度。 传统TLVR 电感用其他软磁材料做成粘结式，能耗不达标，大功率下 I²R更大，所以如村田、 TDK等巨 头没接到这波机会，反而后进者获得机会，主要原因是合金粉末材料。全球为数不多从合金软磁粉末开 始垂直一体做整形再做一体成型电感，铂科自己做粉且性能指标好并能批量供货。 TLVR 电感制程因原 材料粉末不同，加工工艺不一样。铂科路径是自己研发的合金软磁粉末，做电感需要粒径非常细、球形 度好、控制氧含量，粒径在 10微米下得粉率不高，为生产芯片电感如果用细粉，剩余 70%-80% 成本 要处理，形成门槛和壁垒。日本错过了合金软磁粉末在新能源高速发展赛道，因价格低无竞争力，韩国 和美国慢慢退出中国市场。铂科有足够大的粉芯基础规模需求，才有更多细粉提供给芯片电感产能，内 部形成微循环闭环。技术上，铂科专注核心，研发人数财力最高，从 09年第一个把气雾化工艺引入合 金软磁行业，设备升级六代以上，核心部件自己掌握，没买过整套系统，都是分块加工自己安装调试， 参数经验是十多年累积的数据，不像数字芯片可以模拟，每一次生产都是实验数据来源，持续优化升 级。最早铂科只做粉末和粉芯，前面几年跟外面客户共享结果没做成功，后来国内客户要求开发合金软 磁芯片电感，花三四年时间做出来，如果别人能做出来就没有铂科机会。芯片电感竞争格局中，普通产 品国内外很多，但高端部分能供到主要下游 AI芯片终端玩家的公司不多。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 Q：能做粒径 10微米细粉的，国内能有几个玩家？ 答：其实都可以做，但是你要把它过筛出来，剩下的就是看你的能力能够做到占比多少。你做的占比越 高，那你在这个市场地位就越高。 Q：乾坤是非晶纳米晶路线，我们算铁硅、铁硅铝的，是吧？ 答：对，乾坤不做粉，是从日本买粉的。工艺路径不同，铂科用自己的粉，所以以前同行的市场没做过 高压一体成型铜铁共烧工艺，因为铂科研发的合金粉末要用高压成型，然后铜铁共烧工艺去应力，工艺 是连串式的，不是间断的。粉料不一样，工艺不一样。乾坤是热压，压力没那么大，致密度不一样，铂 科功率密度略高，性能指标大部分情况要好一点点。乾坤买日本粉贵，好几百块钱一公斤，铂科更有优 势，如果国内都买日本粉，跟乾坤没法竞争，而且日本产能不扩，都被锁定，不光是价格问题，还可能 买不到。铂科还研究出下一代铁硅 5代粉末压制出的新电感，可以用到 5兆到10兆开关频率，等待半 导体功率升级到 3兆、5兆、10兆频率，这是技术趋势。 Q：我们在伟创力 Flex和台达这边的份额大概有多少？ 答：伟创力 Flex还可以，他在终端占多少份额不清楚，国内从去年开始大部分也是我们供的，不知道 另外一家供多少。台达主要用普通正常型产品，电源方案用乾坤的，我们也有向台达供特殊要求产品， 比如与同行 PK效率温升指标时供，目前量不大，但已有供。我们给台达供的多的是二次电源（ 48转 12伏），因为乾坤不做这个磁芯，今年增长比较快，有新的机种开始商量并已体现。去年三季度主要 跟另外一家客户供服务器机种方案开始收入，今年开始渗透到更多新机种，逐年往后可能所有新机种都 切换成合金磁芯的二次电源，以前是铁氧体的。 Q：两相 TLVR 大概单价在什么区间，毛利率能做到什么水平？ 答：毛利率我们长期保持稳定，不会主动大幅降价或提价，定价根据批量前成本加成，毛利大 概 40%、50%、60%区间，不会因为市场供应紧张就搞到 70%以上，经营理念是跟客户长期合作，给持 续稳定的价格预期。两相 TLVR 电感大概六块钱左右。 Q：光模块对电感的需求后面会有哪些变化？调研发现从 800G 到1.6T到2.4T，MLCC 用量 及高容占比大幅提升，电感领域在光模块市场会有什么变化或值得重视的方向？ 答：从功率提升一定会价值量上升。 MLCC 单颗容量小所以数量上升，我们不一定数量上升，但单颗功 率密度上升，价值量上升。以前 800G 不用铂科这种合金粉芯芯片电感，用普通便宜的，直到 1.6T因 为功率加大物理空间没变化，才优化供电电源模块，所以我们 1.6T才供进去，现在 (长鑫)，先进制程(中芯/华虹)，Drmos(杰华特/芯朋微)，MLCC(三环)。 ———————————— 孙华圳#文字观点", "publish_time": "2026-08-27 09:32", "tags": ["国算超节点", "国产半导体三大核心论题", "文字观点"]}, "post:2026-08-27T09-56:ddedd6c9dd08": {"id": "post:2026-08-27T09-56:ddedd6c9dd08", "kind": "post", "title": "2026-08-27 09:56", "source_label": "帖子正文", "excerpt": "正帆科技中报点评：Q2业绩略逊预期，新接订单翻倍以上，静待盈利拐点出现 结论：2026上半年公司收入及订单端改善趋势得到进一步验证，但前期低毛利订单、折旧摊销、财务费用以及减值损失仍影响盈利表现，利润修复节奏弱于机构此前判断，后续来看，订单结构改善有望逐步向收入和盈利质量传导，但利润拐点仍需等待毛利", "content": "正帆科技中报点评：Q2业绩略逊预期，新接订单翻倍以上，静待盈利拐点出现 结论：2026上半年公司收入及订单端改善趋势得到进一步验证，但前期低毛利订单、折旧摊销、财务费用以及减值损失仍影响盈利表现，利润修复节奏弱于机构此前判断，后续来看，订单结构改善有望逐步向收入和盈利质量传导，但利润拐点仍需等待毛利率连续修复以及经营现金流改善的验证，仍维持500亿市值目标。正帆科技正处于“订单强劲+结构优化”与“利润承压”并存的关键过渡期，上半年新签订单高增、OPEX占比显著抬升，验证业务结构从CAPEX（资本性支出）向OPEX（运营性支出）的再平衡；但去年前期低毛利订单交付叠加财务费用与减值压力，使得盈利修复节奏仍偏慢。中期看，Gasbox与高端石英等零部件将成为利润弹性主引擎，厂务系统随国内Fab扩产进入订单密集兑现阶段；利润拐点取决于毛利率连续修复与经营性现金流改善的验证。 1. 业绩与订单：营收修复放缓，订单强势验证景气回升 - 营收与利润概览（26上半年、26Q2）：26上半年营业收入22.30亿元，同比+10.56%；归母净利润-0.50亿元，扣非-1.10亿元。26Q2实现营收12.60亿元，同比-6.00%，环比+29.9%；归母净利润-0.24亿元；扣非-0.71亿元。 - 毛利率与费用：26上半年综合毛利率18.31%（同比-5.40pct）；Q2毛利率18.36%（同比-3.98pct，环比+0.13pct），环比基本稳定但尚未出现明确修复。期间费用率20.25%（同比-0.15pct），其中财务费用率3.42%，同比+1.79pct，财务费用同比+132.09%；信用及资产减值0.78亿元（上年同期0.31亿元）。盈利端仍承压的核心在于：前期低毛利订单确收+财务费用上行+减值增加。 - 订单与结构：26上半年新签订单32.3亿元，同比+62%；半导体订单占比77%。OPEX业务新签占比由46%升至63%；收入端OPEX占比由37%升至60%，其中半导体设备零组件、气体与先进材料、专业运维管理服务收入占比分别为32%/18%/10%。订单数量与质量同步提升，为后续收入与盈利质量改善奠定基础。 - Q2表现：Q2营收12.6亿元（yoy-6%，qoq+29.9%）；归母-0.24亿元（同比转亏，环比亏损收窄）；扣非-0.71亿元（同比转亏，环比亏损扩大）；毛利率18.36%（yoy-3.98pct，qoq+0.13pct）。公司上半年归母净利仍亏，主因24年低毛利订单仍在交付阶段。 2. 业务结构与关键赛道：OPEX抬升，零部件成弹性中枢 - OPEX占比显著提升，验证“CAPEX→OPEX”再平衡：26上半年新签与收入两端OPEX占比明显上行，且半导体订单占比达到77%，OPEX属性更强的零部件、气体材料、运维服务成为增长主线，有望平滑Fab扩产周期波动，增强抗周期属性。 - 高纯流体系统（厂务）地位与需求：公司是高纯气体/湿化学品供应系统领域的国内绝 对龙头，长期服务中芯国际、华虹、长存、长鑫、京东方等头部客户。当前国内Fab建设密集，厂务系统需求旺盛。随着前期低毛利订单陆续验收，新单价、结构改善逐步传导，盈利能力具备修复基础。 - 零部件供应紧张+涨价与扩产并行，价格逻辑切换至供给侧：产业链反馈Gasbox缺货，供需错配下招标价格已上调约10%，同时行业进入扩产爬坡期，企业竞争力回归“产能与交付”。该轮景气的核心在于“量价齐升+产能兑现”。 - Gasbox国产替代与市场空间：国内Gasbox市场26年约150亿元，28年约300亿元；当前国产渗透率约15%，若渗透率提升至40%，将驱动国产厂商订单高速增长。公司Gasbox已实现对北方华创、中微、拓荆、新凯来、微导纳米、屹唐股份等头部设备厂商的广泛覆盖与规模供货。 - 石英零部件（汉京）卡位高壁垒赛道：海外石英器件产能满负荷，供需偏紧；汉京已进入东京电子（TEL）、KE等设备商以及台积电、华虹等晶圆厂供应链，受益于热石英高壁垒与全球紧缺，弹性显著。但26上半年阶段性的盈利承压或与新增产线折旧、产能未完全释放、过渡期低附加值订单等因素相关，后续随着认证与产能爬坡，盈利能力有望回升。 3. 利润拐点判断：结构改善在前，利润修复仍需“毛利率+现金流”双验证 - 盈利承压的三因素：1）低毛利订单确收压制毛利率；2）财务费用同比+132.09%（可转债、贷款等致息费上行）；3）信用与资产减值0.78亿元（较上年同期0.31亿元）。毛利率虽Q2环比回升+0.13pct，但尚不呈现连续性修复。 - 订单改善→收入与利润的传导滞后：26上半年订单强势、OPEX占比抬升、零部件与气体材料增长良好，但利润修复仍需等待：一是前期低毛利订单消化；二是确认新签高质量订单需时间；三是经营现金流改善需伴随毛利率连续修复同步验证。 - 与市场观点的差异：部分机构强调Q2半导体订单环比显著提升、Gasbox快速放量、主业毛利率在新接订单上“已恢复/改善”，据此预判“盈利拐点临近”；而另有机构强调短期利润仍受低毛利存量订单、折旧摊销、财务费用、减值损失影响，认为“利润拐点仍需等待毛利率连续修复与现金流改善”。两者差异的实质在于对“新老订单切换节奏”的把握与对“费用/折旧/财务成本”消化曲线的判断。 4. 细分赛道拆解：厂务系统、Gasbox、石英件三主线 - 厂务系统（制程关键系统） - 核心逻辑：受益Fab扩产大周期，需求端充沛；公司为国内一供龙头，新签订单质量改善后，盈利能力有望在新订单确收期逐步抬升。 - 风险在于：行业竞争仍存+项目交付节奏与验收进度；毛利率修复的持续性需要观察连续两个以上季度的验证。 - Gasbox（鸿舸） - 供需格局：处于缺货+涨价周期，产业链反馈招标价上调约10%，企业进入“满产/挑单”，定价逻辑切换至供给侧。 - 国产替代：26年国内市场约150亿元，28年约300亿元，国产渗透率提升空间大；公司覆盖国内主流设备客户群，市占率提升可期。 - 石英件/SiC零部件（汉京） - 供应链地位：已进入TEL、KE、台积电、华虹等高端供应链；受益全球石英紧缺、国内高端热石英壁垒高、订单饱和度高。 - 盈利节奏：当前阶段性毛利承压因素包括碳化硅未完全量产、固定资产新增折旧、过渡期低附加值订单等；随着认证通过与产能爬坡，盈利能力预计回升。需关注商誉与业绩兑现的一致性风险。 5. 投资要点与风险： - 投资要点 - 订单高增、OPEX占比抬升验证公司战略落地，26上半年新签订单32.3亿元（+62%）、半导体订单占比77%，结构改善明确。 - 零部件赛道景气：Gasbox处于量价齐升周期、国产替代加速，价格上调约10%与“满产/挑单”体现供给约束下的定价权修复。 - 厂务系统作为国内一供，受益Fab扩产订单密集确收，盈利有望随“新单价/结构改善+规模效应”逐季修复。 - 关键风险 - 下游扩产不及预期与行业竞争加剧，影响订单兑现与盈利修复节奏。 - 财务费用上行与资产减值压力，短期仍压制利润表表现（26上半年财务费用增幅显著、信用+资产减值0.78亿元）。 - 并购商誉风险（汉京）与安全生产等运营风险需持续跟踪。 - 机构对于盈利拐点时点的分歧：有观点基于Q2半导体订单环比高增、零部件快速放量，偏积极判断拐点临近；另有观点强调费用与减值压力未出清、需更多证据支撑毛利率连续修复，持审慎态度。建议以“毛利率连续两个以上季度环比改善+经营性现金流转正/改善”为重要观测指标。---xz#文字观点", "publish_time": "2026-08-27 09:56", "tags": ["文字观点"]}, "attachment:files/艾森股份2026年中报电话会议纪要20260826.pdf": {"id": "attachment:files/艾森股份2026年中报电话会议纪要20260826.pdf", "kind": "attachment", "title": "艾森股份2026年中报电话会议纪要20260826", "source_label": "其他", "excerpt": "艾森股份 2026 年中报电话会议纪要（ 20260826 ） 要点总结 1.2026H1 业绩高增长，盈利能力显著提升 ：上半年营业收入 3.46 亿元，同比增长 23.64% ，受益于 半导体材料行业高景气及材料国产替代加速；扣非净利润同比增长 41.66% ，剔除股份支付影响后同比 增幅超过 90% 。", "content": "艾森股份 2026 年中报电话会议纪要（ 20260826 ） 要点总结 1.2026H1 业绩高增长，盈利能力显著提升 ：上半年营业收入 3.46 亿元，同比增长 23.64% ，受益于 半导体材料行业高景气及材料国产替代加速；扣非净利润同比增长 41.66% ，剔除股份支付影响后同比 增幅超过 90% 。产品聚焦半导体电镀和光刻两大核心工艺环节，产品结构优化带来盈利能力显著提 升。 2.Q2收入结构拆分 ：Q2整体营收增速约 25% 。电镀液及配套试剂占总营收约 45% ，综合毛利 约 40% ，增量主要来自大马士革系列先进制程电镀液放量，已在部分重点客户形成稳定月度出货；光刻胶 及配套试剂占总营收 25% 以上（约 28%-29% ），单胶毛利 50% 以上，上半年增长 35% 以上， Q2放 量明显好于 Q1。整体增速未更高的主因是电镀液板块中毛利率较低产品短期做收入调整；电镀配套材 料板块持续控制出货量、调整毛利率结构，上半年毛利率有所提升。 3.研发投入维持高位 ：上半年研发费用占营收 13.15% ，研发费用同比增长 49.55% （接近 50% ）；研 发人员占比将近 43%-44% ，同比增长 30% 以上。 4.全年光刻胶收入目标维持不变 ：2026 年全年光刻胶纯胶收入目标 7000 万到 8000 万元左右，公司 判断有很大概率实现。 5.下游应用结构 ：封装市场仍是主要贡献来源，主要客户包括长电、通富、华天、盛合晶微等；晶圆 制造领域收入向 10% 占比迈进，高毛利大马士革产品市场开拓取得阶段性成效；高端载板、 TGV 、TSV 等布局产品处于重要客户小批量量产及行业客户上线验证阶段，尚未显著改善营收结构。 6.大马士革电镀液技术覆盖与市场机遇 ：大马士革电镀铜添加剂可覆盖 7~55 纳米全制程节点， 7~2 8 纳米具备优异填充能力和低缺陷； 5~14 纳米更先进节点适用大马士革钴制程电镀液，具备更优异的电 迁移性和界面稳定性。 14纳米及以下先进逻辑制程及 55纳米及以下存储先进工艺制程存在巨大市场增 量和国产替代机遇。 7.逻辑客户份额与目标 ：目标实现对客户产线 50% 左右份额；华虹先进制程产线基本已实现约 50% 份 额； SMIC 为2026 年重点合作战略客户，配套试剂销售量有明显提升；中短期目标未来两年内 在 SMIC 、华虹、华力微及两存等晶圆制造龙头客户实现单体营收破亿。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 8.先进制程电镀液需求量判断 ：增量主要集中在大马士革铜互连（镶嵌工艺）和 TSV 通孔镀铜两大工 艺路线；当前单个产品每年市场需求在小几亿到几亿到 10亿的空间内迈进，未来应有翻倍、 10倍以上 增长。大马士革镀钴单品已实现较好卡位，大马士革镀铜添加剂处于国内第一梯队， TSV 是重点研发和 战略经营方向。 9.客户端国产导入为商业主动行为 ：未观察到政策性强制切换，客户更多基于供应链安全和成本管控 主动转向；最明显变化在晶圆制造先进制程电镀液，海外大厂配合不够灵活密切。电镀液属直采、一致 性和品控要求高，起量需完成完整产品测试周期。公司自 2024-2025 年起已布局钴、钌、钼、钨等下 一代电镀金属材料。 10.先进封装光刻胶市场逻辑与产品矩阵 ：AI芯片、 HBM 、CPU 等驱动异构集成、 Chiplet 、CoWo S 等先进封装成为延续芯片性能提升的重要路径；先进封装光刻胶更注重厚膜均匀涂布、低应力、高低温 循环可靠性。产品矩阵包括永久绝缘 PSPI 感光材料、厚膜负性光刻胶（已形成规模化收入）、 RDL 工 艺光刻胶等； 2016 年起布局，已有 10年技术积累。 11.长鑫存储（ HBM 主线）进展 ：已确定 4款光刻胶料号作为长鑫国产替代第一顺位，且是国内唯一 进入长鑫验证的光刻胶公司；份额预期至少 60% 以上，积极预期下部分产线可全部替代。 1万片 HBM 芯片对应封装用光刻胶采购规模约 1亿到 1.5亿元；预计 2027 年长鑫到万片级别，未来有望在全球拿 下10% 、20% 、30% 份额。光刻胶树脂全部自产，官方价下毛利率 50% 以上，有信心长期保持。此外 还在对接长鑫的湿电子化学品（ D-flash 相关产品）、光刻胶配套试剂及 DDR6 打线向凸块工艺转变所 需感光材料。 12.长江存储与两存战略意义 ：3DNAND 特殊结构对电镀系列产品要求更高，公司正配合长存做电镀 液测试、数据收集及瑕疵分析， TSV 配套产品及 PSPI 感光材料也在与长存 TD部门对接。两存是从晶 圆逻辑厂向存储厂突破的重要战略覆盖，中短期目标实现单体客户收入破 1亿的战略 KPI，并在产能爬 坡中争取 50% 以上份额。 13.光刻胶板块长期规划 ：2030 年左右光刻胶业务占公司总体营收 1/4，毛利率维持 50% 以上；先在 封装领域实现 25%~30% 市占率，再根据晶圆制造和高端载板客户需求做差异化布局。 KrF光刻胶处于 配方定型和测试阶段，客户验证周期约 12-18 个月，目标 2027 年实现有价 PO，起量在 2027 年底 到 2028 年。 14.PSPI进展 ：半导体 PSPI 国产化率比 ArF 更低，市场仍以日本企业为主；低温 PSPI 已实现小批量 量产并同步推广，超低温 PSPI 处于上线测试阶段； 2027-2028 年PSPI 仍是 1000 万级成长目标，规 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 模化收入可能在 2027 、2028 年之后实现。先进封装所有对标日本型号均已进入客户测试，华天、长 电、通富、盛合均给予测试机会。 15.先进封装配套试剂与终端切换 ：蚀刻液在标杆客户盛合晶微份额占比较高，目标将市占率从百分之 十几提升到将近 20% 。MPS 已到公司交流，认可艾森光刻胶的生产和持续稳定供应能力；长电、通 富、华天、盛合晶微等直接客户在帮忙争取终端客户认可，长电近期主动做了很多终端客户沟通工作。 16.IC载板及 HDI ：目标在行业头部客户实现 40% 以上市场份额；当前有可观收入的主要是臻鼎集团 旗下鹏鼎控股，苏州群策、深南电路、兴森科技、宏板等仍处于产品导入和上线测试阶段；主要竞争对 手为国外材料企业，是未来 2-3 年材料国产替代的重要市场。 HDI 镀铜领域已形成可观收入， IC载板 和TGV 镀铜更多处于配合测试和卡位布局阶段。电镀锡银添加剂处于小批量生产阶段，配套铜基液已 量产。 17.日本断供判断与价格竞争 ：管理层判断中美、中日博弈不会真断供，国产替代是逐步过程；日本厂 商开始在民间降价处理，但不构成重大威胁 —— 公司光刻胶全流程国产化、树脂自主合成，成本空间 大，客户端默契是 “只要价格不比日本贵就行 ”；日本厂商成本高、此前毛利过高，降价空间有限。公 司毛利率波动影响因素在产品结构和上游原材料涨价，而非产品价格。 18.产能建设 ：华东制造基地规划产能 23000 吨，第一期投资约 6.73 亿，预计投入产出比 1:2~1:3 ， 2028 年启动二期；一期专注光刻胶及配套树脂，二期布局先进制程电镀和湿电子化学品；可转债已 于 2026 年7-8 月获交易所受理。马来西亚槟城 InnoPhy Chemicals 行政审批已推进约 60%~70% ，预 计2027 年Q1至上半年投产；上半年营收占公司总营收将近 10个点，期望未来 2-3 年营收破亿，并 打开英特尔、英飞凌等国际 IDM 大客户材料通道。 19.管理层换届与中期战略 ：2026 年8月12日完成管理层换届，多朗总接任董秘，负责先进封装事 业部的徐总接任销售 VP，管理层团队年轻。未来 3~5 年聚焦晶圆制造和先进封装两大战场：晶圆市场 聚焦大马士革电镀铜 /钴量产放量及 PSPI 突破，任期内全力将中芯、华力、长鑫、长存打造成主力客 户；先进封装市场加快替代日本占领的市场、加速负胶放量； HBM 、TSV 、TGV 等新兴领域技术储备 处于国内第一梯队。 问答整理 Q：最近市场关注 300层NAND 以钼代替钨的趋势，这会对公司相关的电镀液或光刻胶产品 带来什么变化？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 答： 公司早在 2024-2025 年就关注到电镀金属材料的更新迭代，主要来自境外制造企业领先的代际工 艺。目前晶圆制造中，钴是境内发现的较好电迁移金属材料，公司大马士革铜产品已在先进制程（ N+2 到14纳米）率先放量。对于钌、钼、钨等新材料，公司已跟随下一代产品技术演进布局新的工艺路线 材料。随着下游客户工艺技术先行先试和研发成果转化，公司将配合客户做先导研发，形成客户粘性， 并在客户工艺成熟后导入公司的材料产品。 Q：市场此前关注半导体材料替代日本的主题，但近期日本并未断供，这对公司后续业务增长 空间有什么影响？ 答： 嘉宾认为中美、中日博弈不会真的断供，否则产业链会受损；但博弈过程给予国内企业更多放量和 国产替代机会，不会因为断供就立即上量，仍有验证周期。日本光刻胶系列产品对标型号已在测试中， 华天、长电、通富、盛合等客户为日本断供做准备给艾森机会；即使产业链能解决 95% ，仍有 1%可能 因小部件断掉，二级市场应理性看待。国际博弈天平逐渐向国内材料企业倾斜，是逐步过程而非一瞬 间。公司不希望真断供，因为也接不住大量订单，但可断可不断的过程带来了机会。与盛合、长电、通 富等沟通机会增多，客户愿意试，但未断供前仍是逐步国产替代过程。 Q：关于新产品键合胶，之前提到过布局，目前这块产品进度是怎样的？ 答： 公司键合胶产品已有一定储备，先进封装事业部会对接客户及客户意向。目前尚未正式对外交流更 多产品型号，客户端情况无特别更新；该产品是公司规划清单中的未来布局一部分，可能在年报时根据 业务进展有进一步披露。 Q：请问二季度或半年度公司电镀与光刻两大产品板块的结构有什么变化？另外全年收入增速 展望是否有变化？ 答： 二季度公司营收增速约 25% ；电镀液及配套试剂占总营收约 45% ，综合毛利率约 40% ，其中大马 士革系列先进制程电镀液在部分重点客户形成稳定月出货；光刻胶及配套试剂占比提升至约 28%- 29% ，光刻胶单胶毛利率超过 50% ，光刻胶及配套试剂收入同比增长 35% 以上；整体营收增长约 25% 主要因电镀液部分低毛利产品短期收入调整。电镀配套材料板块控制出货量并提升毛利率。下游应用结 构变化不大，主要收入来自封装市场（长电科技、通富微电、华天科技、盛合晶微等），晶圆制造领域 以大马士革为代表的高毛利产品开拓取得阶段性成效，但营收体量仍需等待国内先进制程放量和更多重 要客户导入。高端载板、 TGV 、TSV 等新产品大部分处于重要客户小批量量产和推广验证阶段，尚未对 营收结构形成明显改善。公司整体处于产品进展可见、等待下游产能爬坡的阶段，全年收入增速展望未 明确改变。 Q：请问公司今年下半年在存储领域的产品进展如何？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 答： 在长鑫存储，适用于 HBM 封装工艺的光刻系列产品持续推进，光刻胶作为 baseline 持续配合产 线磨合，湿电子化学品也在逐步打开市场份额；在长江存储，因 3DNAND 特殊结构对电镀产品要求 较高，公司正配合客户进行电镀液系列产品测试、数据收集及瑕疵分析， TSV 配套产品和 PSPI 感光材 料也在与 TD对接。两存是公司从逻辑厂突破至存储厂的重要战略覆盖，相关产品也是两存未来工艺发 展的重点方向。公司希望配合客户工艺升级，在未来产能爬坡中保证 50% 以上份额，中短期实现单体 客户收入破 1亿的战略 KPI。 Q：请问公司大马士革电镀产品在华虹和中芯国际目前的份额水平？后续能提升到什么水平？ 答： 公司目标始终是争取在客户产线上实现约 50% 的份额。国内具备大马士革系列产品量产经验的友 商很少，公司率先实现国产突破并拥有深厚量产经验。目前在华虹基本能达到 50% 份额；中芯国际是 今年重点合作的战略客户，公司希望复制在其他逻辑厂的成功；今年配套试剂销售量已有明显提升。 Q：请问先进封装光刻胶配套试剂（刻蚀液、显影液、清洗液等）今年的增长有什么变化？ 答： 光刻胶配套试剂在封装领域有更多客户切换，标杆客户如盛合晶微在 2.5D 封装领域具有旗帜性导 向，其蚀刻液产品公司份额占比较高。公司希望将蚀刻液市场份额从约百分之十几提升至近 20% ，并 在标杆客户先进工艺上争取更多卡位，从而带动其他产品配套导入，优化产品结构并积极推动业务发 展。 Q：从竞争格局看，今年国内海外同行及国内竞争对手在价格竞争方面是否有加剧的情况？ 答： 国内半导体先进封装和晶圆领域真正能形成竞争的友商不多，公司毛利率受产品结构和上游原材料 涨价影响，而非产品价格。日本光刻胶等关键材料虽未断供，但民间已开始降价处理，这是国内材料企 业面临的挑战。公司光刻胶等产品实现全流程国产化，树脂自制，成本空间较大，与客户形成默契，只 要价格不高于日本产品即可。长电科技、华天科技、盛合晶微等客户也持类似观点。日本厂商因海外进 口、制造成本高及贸易壁垒等因素，降价空间有限，整体对公司影响不大。 Q：公司的电镀锡银添加剂是否已进入小批量生产并在头部客户验证？配套的基液目前主要由 谁供应？后续公司会做配套导入吗？ 答： 实际生产中通常使用铜基液与锡银添加剂配套：铜基液负责底层铜填充，锡银添加剂负责表层锡银 凸块和焊点形成。配套铜基液公司已量产；锡银添加剂目前配合客户进行配方调整和工艺升级，在小批 量生产中同步优化，以便后续更方便导入。 Q：客户端对电镀液的采购是否在加速国产导入？海外关键电镀液是否有限制，急需公司替 代？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 答： 电镀液领域未见全行业或明确的政策性限制或切换，客户更多基于供应链安全和成本管控主动转向 国产。最明显在晶圆制造先进制程，国内工艺优化升级且海外大厂配合不够灵活，公司大马士革系列电 镀液在客户端导入广受欢迎，客户积极提供上线测试机会。封装和载板电镀需要精细化服务（驻厂工程 师、快速分析检验），公司相比国外大厂更有优势。但电镀液为直采，一致性和品控要求高，导入和测 试时间较长，起量需完成完整测试周期后才会突破性增长。 Q：公司在 IC载板和 HDI应用领域的客户情况、份额、后续增长展望以及竞争格局变化？ 答： 公司目标为高端载板（ HDI 、类载板、 IC载板）客户提供电镀工艺产品、 PI材料及配套湿电子化 学品，力争在行业头部客户实现 40% 以上市场份额。目前报表端可观收入主要来自臻鼎集团旗下鹏鼎 控股；苏州群策（台湾欣兴电子）、深南电路、兴森科技、宏板等客户尚处于产品导入和上线测试阶 段。该领域主要竞争对手为国外材料企业，是未来 2-3 年材料国产替代的重要市场。 Q：公司在长鑫存储的光刻胶产品有几款 baseline ？如何理解 baseline ？后续客户量产公司 大概能拿到多少份额？ 答： 在配套长鑫存储的项目中，公司已确定 4款光刻胶料号，是长鑫国产替代的第 1顺位。按照长鑫国 产化材料替代需求，国内材料商份额较高，从供应链安全和管控角度，公司作为第 1顺位后预计份额至 少60% 以上，积极预期下部分产线可全部替代。此外，公司正与长鑫积极沟通湿电子化学品及 DDR 6 工艺转变（打线向凸块工艺）中可能用到的光刻胶和 PSPI 等感光材料。 Q：针对长鑫存储的光刻胶，除艾森外还有哪些国内厂商进入等待量产阶段？未来需求量及稳 态毛利率水平如何？ 答： 针对长鑫存储 HBM 相关光刻胶，长鑫在国内只接受艾森的产品验证，目前尚无其他光刻胶公司在 其实验线或产线上做同类产品验证，艾森的 baseline 为国内唯一。需求量方面，按公司测算， 1万片 HBM 芯片对应的封装光刻胶采购规模约 1-1.5 亿元人民币；长鑫目前仍处于测试阶段尚未上量，预计 明年达到万片级别；未来长鑫在全球 HBM 市场有望占据 10% 、20% 乃至 30% 份额，需求量非常可 观。当需求规模足够大时，公司接受其他国内供应商一同竞争，但目前长鑫暂无精力测试其他光刻胶厂 商同类型产品。毛利率方面，因树脂等核心原料自产，目前官方价毛利率超过 50% ；随着采购量上升 单价可能下降，但规模效应、人力成本摊薄、产线折旧和工艺优化会降低原材料成本，公司有信心长期 维持 50% 以上毛利率。 Q：公司在长鑫存储还有哪些湿电子化学品进展？主要是哪些产品？ 答： 包括 D-flash 相关湿电子化学品以及光刻胶配套试剂，目前正与长鑫积极沟通中。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 Q：公司高深宽比光刻胶目前在客户验证处于哪个阶段？后续需求会较大吗？ 答： 公司 KrF光刻胶（ K胶）主要做差异化产品，其中高深宽比产品在年报中已披露。 K胶针对逻辑和 存储客户不同工艺需求进行定制化，包括高深宽比和高分辨率方向。目前公司 KrF光刻胶处于配方定型 和测试阶段，从客户上线测试到最终使用通常需要 12-18 个月验证周期。公司目标是在 2027 年实现有 价PO，销售量起量时间预计在 2027 年底至 2028 年； K胶主要根据客户特殊工艺需求提供差异化定 制服务。 Q：长期来看，公司对光刻胶板块的收入目标和下游应用构成有何规划？ 答： 公司目标是在 2030 年左右光刻胶业务占公司总营收的 1/4，毛利率维持在 50% 以上。产品布局将 发挥先进封装技术和产业积累，率先在封装领域实现 25%-30% 市占率，再根据晶圆制造和高端载板客 户的定制化需求，差异化布局感光材料。 PSPI 作为核心感光材料，低温 PSPI 已小批量量产并推广，超 低温 PSPI 正在进行上线测试； PSPI 被视为中国感光材料中成长最快、国产替代窗口最大的材料。公司 希望 PSPI 从当前客户导入和小批量量产阶段，推进到更多客户验证并实现规模化收入。 Q：国内 PSPI厂商较多，公司 PSPI的差异化优势体现在哪里？今年这块大概有多少收入？ 答： 公司 PSPI 材料主要应用于半导体领域，细分赛道包括先进封装、功率器件和存储客户。国内较多 厂商主要对标显示领域 PSPI 或其他泛半导体领域，而半导体 PSPI 仍以日韩企业（尤其是日本企业）为 主，中国厂商多处于单点突破、产品测试及部分重要客户小批量量产阶段，整体国产化率低于 ArF 或 ArF immersion 。公司 PSPI 战略是实现更多客户测试并取得订单，在部分重点客户实现规模化收入； 预计 2027-2028 年PSPI 收入仍处于 1000 万级成长目标。若贸易摩擦风险进一步加大或客户更激进地 推进工艺国产化，将显著提振国内 PSPI 材料导入，但公司当前战略仍是做好定点突破。 Q：请拆分今年上半年电镀液及配套试剂收入在传统先进封装、晶圆制造、 HDI、IC载板、玻 璃基板等下游应用的占比，并展望下半年趋势。 大研发专项，到固态电池列入免征消费税范围，并推动在动力储能领域示范落地，标志上层对下一代电池技术的重视度未变。后续看，固态电池预计从电芯测试、中试线建设，开始向示范性应用推进，27年将看到固态电池开启装车示范性运行，在储能系统对比测试示范应用，有望出现MWh甚至GWh级别的出货和应用。 #海外有望开启共振、产业化仍锚定27年。海外电池厂更新固态进展，三星SDI计划27年H2正式量产全固态电池，明确首个商业化落地场景将聚焦人形机器人，预计在26年H2向下游客户送样。LG新能源计划于年内搭建干法电极工艺试验线，并进行全固态电池的试生产，计划29年推出石墨级全固态电池用于动力领域，30年推出无负极固态电池用于人形机器人领域。国内方面，工信部专项预计年底测试，部分厂商预计下半年实车测试。整体看，全球产业化时间仍锚定27年。投资建议：固态板块股价处于底部，优先推荐电解质+设备环节。①电解质：本轮核心龙头为#上海洗霸，为上海市固态领军企业，百吨级硫化锂产线已完成调试，硫化锂价格仍在200万/吨，后续具备较高的弹性空间。此外，#厦钨新能、金龙羽，三祥新材等均有积极进展。②设备：海外干法产线开始落地，国内量产线后续有望落地，相关标的#宏工科技、纳科诺尔，灵鸽科技、先惠技术等。#文字观点", "publish_time": "2026-08-27 14:47", "tags": ["文字观点"]}, "attachment:files/【公告全知道】铜箔_PCB_固态电池_公司上半年净利润同比增长超5倍.pdf": {"id": "attachment:files/【公告全知道】铜箔_PCB_固态电池_公司上半年净利润同比增长超5倍.pdf", "kind": "attachment", "title": "【公告全知道】铜箔_PCB_固态电池_公司上半年净利润同比增长超5倍", "source_label": "其他", "excerpt": "【公告全知道】铜箔_PCB_固态电池_公司上半年净利润同比增长超5倍 2026-08-27 铜冠铜箔：上半年净利润同比增长515% 铜冠铜箔(301217.SZ)发布2026年半年度报告，实现营业收入40.21亿元，同比增长 $34.16\\%$ ；归属于上市公司股东的 净利润2.15亿元，同比增长 $514.75\\%$ 。", "content": "【公告全知道】铜箔_PCB_固态电池_公司上半年净利润同比增长超5倍 2026-08-27 铜冠铜箔：上半年净利润同比增长515% 铜冠铜箔(301217.SZ)发布2026年半年度报告，实现营业收入40.21亿元，同比增长 $34.16\\%$ ；归属于上市公司股东的 净利润2.15亿元，同比增长 $514.75\\%$ 。公司拟向全体股东每10股派发现金红利0.6元(含税)。 点评：资料显示，铜冠铜箔是国内高性能电子铜箔领军企业。公司主要从事各类高精度电子铜箔的研发、制造和销售等 ，主要产品按应用领域分类个包括PCB铜箔和锂电池铜箔。目前，公司拥有电子铜箔产品总产能为8万吨/年。 公司已掌握多项铜箔核心技术，特别是公司高频高速用PCB铜落在内资企业中具有显著优势，其中RTF铜箔产销能力于内 资企业中排名首位，HVLP1-4代铜箔已向客户批量供货。公司HVLP1至4代全系列铜箔均已完成客户供货布局，当前出货 主力以HVLP2代产品为主。公司HVLP5代铜箔正在研发中，目前已突破关键性能指标。 公司锂电池铜箔主要分为动力电池用、数码电子产品用及储能用锂电池铜箔，最终应用于新能源汽车、电动自行车、3C 数码产品、储能系统等下游场景。 锂电池铜箔的主要作用是作为锂电池负极的集流体，固态电池仍然使用铜箔作为负极集流体。公司已经开发出了中、高 抗拉强度等的各种不同规格强度锂离子电池用铜箔、网状三维结构铜箔等高端锂电铜箔产品适用固态电池和半固态电池 的铜箔产品。 华工科技：上半年净利润同比增长30% 华工科技(000988.SZ)发布2026年半年度报告，上半年实现营业收入78.22亿元，同比增长 $2.53\\%$ ；归属于上市公司 股东的净利润11.86亿元，同比增长 $30.17\\%$ 。公司800G、1.6T系列光模块已实现全球化批量交付，稳步推进3.2T、 6.4T、12.8T下一代超高速联接产品迭代升级。技术研发层面，公司跻身行业第一梯队，率先推出3.2TNPO产品，在美国 OFC展会成功实现动态展示；推出6.4TNPO解决方案；完成200G/Lane架构12.8TXPO设计，样品实现行业首发。 点评：资料显示，华工科技是国内领先的光器件一站式解决方案提供商。公司已形成以信息通信技术为重要支撑的光互 联业务，以敏感电子技术为重要支撑的智能感知业务，以激光加工技术、软件算法为重要支撑的智能制造业务三大业务 格局。 公司自研硅光芯片已实现规模化应用，配套400G、800G、1.6T光模块批量交付；同时完成面向3.2T/6.4TCPO/NPO方 案的高集成硅光芯片开发。公司拥有完备的光、电信号处理技术，可支撑单波400G的光、电信号稳定高效传输，实现单 波400G光引擎产品落地。 公司具备先进的2D/2.5D/3D封装的技术能力和工艺能力，为下一代超高集成度光引擎、光电共封产品打下坚实基础。公 司TGV玻璃通孔激光加工智能装备已完成整机定型，核心部件（激光器、振镜、控制系统）实现100%国产化，并已成功 完成初步中试验证。 公司前瞻布局低轨卫星通信及6G基站光模块技术攻关与产品研发，并于2026年4月发布100G星载光模块。公司 5G/5G-A光模块持续保持行业领先市场份额，迭代开发6G、F6G、低轨卫星通信光模块。 立昂微：拟投资约30亿元建设12英寸半导体硅片项目 立昂微(605358.SH)公告称，拟投资建设“月产20万片12英寸轻掺衬底片、12万片12英寸硅外延片项目”，意向总投资 约30亿元，固定资产投资约29亿元。项目完全达产后预计年产值超13亿元，建设周期为5年，由控股子公司金瑞泓昂芯 微电子(嘉兴)有限公司实施。 第 1 页 / 共 3 页 点评：资料显示，立昂微拥有半导体产业链从材料到芯片的全链条技术，重掺硅片出货量国内领先，全球首家量产二维 可寻址激光雷达VCSEL芯片制造商，射频芯片已批量用于低轨卫星终端。 公司12英寸特色砷烷外延产品凭独创性获客户全方位认可，稳居国内市场占有率第一；12英寸MCZ超低氧抛光片精准切 入国内外高压IGBT市场并成功上量；全尺寸高品质埋层外延片实现稳定量产。目前公司28nm逻辑芯片硅片已批量供货， 适配逻辑电路、BCD与电源管理场景的轻掺硼薄层外延片、轻掺硼抛光片均在客户端快速放量。 在车载雷达领域，立昂东芯VCSEL芯片产品已用于智能驾驶中的激光雷达产品并已实现大规模出货，其中二维可寻址大 功率VCSEL工艺技术，成为全球首家量产车规级激光雷达VCSEL芯片的制造商，产品已应用于智能驾驶、人形机器人、 割草机器人等领域。 公司半导体硅片业务重点发展8英寸、12英寸重掺硅片与轻掺硅片，其中12英寸硅片已覆盖14nm以上技术节点逻辑电路 和存储电路，以及客户所需技术节点的图像传感器件和功率器件。 一图看重要公告 2026年8月26日上市公司公告 类型 标的 主要内容 股价异动 康盛股份 上半年液冷业务收入占比极低 整体尚未实 现盈利 楚天龙 目前数字人民币相关业务收入占公司营业 收入的比重较小未达5% 华天酒店 公司不存在正在筹划中的资产重组等重大 事项 联合精密 不涉及半导体设备业务 投资签约 大普微 签订约34.91亿元企业级PCIe SSD销售订单 豪尔赛 拟收购新能动力不低于51%股权 湖南黄金 拟购买黄金天岳及中南冶炼100%股权 股票 复牌 立昂微 拟投资约30亿元建设12英寸半导体硅片项 目 凯立新材 全资子公司拟投资2.3亿元建设高端功能催 化材料产业化项目 高凌信息 拟8.05亿元收购凯睿星通89.49%股份 融资 家联科技 拟定增募资不超3亿元 用于3D打印材料等 项目 宁波东力 拟募资不超10亿元用于精密减速器智能制 造项目等 乖宝宠物 拟募资不超11亿元用于年产30万吨高端宠 物主粮食品项目等 绿的谐波 筹划发行H股并在香港联交所上市 获批中标 亨通光电 中标海洋能源项目总金额18.31亿元 增减持与回购 湖南裕能 近期宁德时代减持公司总股本的0.92% 伊利股份 拟以10亿元至20亿元回购股份用于注销 经营业绩 格力电器 上半年净利润132.78亿元 同比下降7.87% 第 2 页 / 共 3 页 嘉立创 上半年度净利润同比增长73.54% 拟每10股 派5元 巨人网络 上半年净利润同比增长176% 《超自然行动 组》持续贡献较高水平收入 频准激光 上半年净利润同比增长24.58% 量子科技与 半导体领域营收均实现快速增长 北方铜业 上半年净利润13.96亿元 同比增长187% 华虹宏力 上半年净利润同比增长437% 主要由于本期 毛利上升 亨通光电 上半年净利润同比增长93.38% 光通信业务 营收同比增长超130% 华工科技 上半年净利润12亿元 同比增长30% 深南电路 2026年半年度净利润同比增长65.55% 联讯仪器 2026年半年度净利润同比增长903% 铜冠铜箔 2026年半年度净利润同比增长515% TCL中环 2026年半年度净亏损32.04亿元 通威股份 2026年半年度净亏损51.19亿元 百济神州 上半年净利润同比增长627% 百悦泽®以及 安进公司授权产品和百泽安®销售 注盈利景气配合的铜、铝等工业金属及创新药； ④红利仍作为组合底仓，优先配置银行、交运，并可结合景气改善适度增配煤炭。 第 2 页 / 共 5 页 产业跟踪 PTFE | AI交换背板材料方案加速迭代，低损耗需求推动价值量重塑 近日，Semi Analysis发布《PTFE Pushing Copper Further》成为本轮PTFE产业链讨论升温的直接催化。报告指出，英 伟达正评估在Rubin Ultra的Portia（NVSwitch 7）交换板中导入PTFE，以更低介电损耗延长铜互连在Scale-up网络中的 应用周期。 国联民生证券指出，虽然目前设计尚未最终定案，但产业验证已出现积极进展，下一代定案概率80%：生益科技已协同 开发超过一年，沪电股份近期成功完成PTFE PCB样品。 英伟达推动PTFE的核心原因，在于高速传输对介电性能提出更高要求。PTFE分子结构对称、极性低，在10GHz下介电常 数Dk约2.1、介电损耗Df约0.0003，性能优于PPO/PPE及传统碳氢树脂，尤其适合Backplane、Switch Board等以高速 信号传输为主的板件。 PTFE的难点则集中于加工环节，其热塑性、质地较软且机械强度不足，多次压合、钻孔去胶渣、孔壁质量及尺寸稳定性 均面临挑战，因此当前主流方向并非全PTFE板，而是以PTFE作为Core、搭配M9级玻纤布半固化片的混压方案，在保留 PTFE信号性能优势的同时，由玻纤层提供机械支撑并降低制造难度。 若Rubin Ultra最终定案，增量有望由PCB、覆铜板向铜箔、填料及压合设备扩散。PTFE对铜箔表面粗糙度、硬度、热稳 定性和厚度均匀性要求更高，HVLP5+适配价值上升；二氧化硅等改性填料可改善材料性能，高温高压及多次压合亦将提 升设备门槛。 A股相关公司：生益科技、隆扬电子、联瑞新材、凌玮科技、昊华科技等。 风口研报·数据雷达 2026年08月26日研报雷达 类型 标的 研报标题 上调评级 荣盛石化 公司点评报告:炼化龙头盈利增幅显著 TCL智家 ODM行稳,OBM致远:全球化产能布局打开 成长空间 中煤能源 半年报点评:主营业务弹性凸显,下半年业绩 值得期待 德福科技 2026年二季度业绩点评:量利齐升,高端电子 铜箔进展顺利 下调评级 长白山 长白山26年中报点评:客流高速增长,Q2淡 季盈利偏弱 川宁生物 川宁生物2026年半年度点评报告:业绩符合 预期,Q2同比降幅相较Q1收窄,期待合成生 物潜力品种孵化 迈信林 2026年中报点评:上半年利润阶段性承压,航 天与算力布局推进 关键词“拐点” 福瑞达 福瑞达2026半年报点评:化妆品收入持续改 善,静待利润拐点 福莱特 Q2玻璃降价盈利承压,行业冷修加速拐点可 期 中宠股份 中宠股份点评报告:自主品牌高增,静待拐点 显现 第 3 页 / 共 5 页 国轩高科 规模效应强化,盈利拐点将至 珀莱雅 珀莱雅2026年半年报点评:收入转正迎拐点, 并表花知晓增厚利润 食品饮料 乳制品行业深度报告:原奶周期,拐点、传导 与弹性 “新财富分析师”最新深度研报跟踪 联讯仪器 光通信测试仪器&设备龙头,拓展碳化硅功 率器件&半导体测试 金融 中国人身险银保渠道系列报告三:国内银保 渠道路在何方? 金融 券商差异化发展专题(二):专注细分赛道,中 小券商践行精品化道路 公用事业 AI金属回收再生深度:克级用量,吨级弹性,AI 爆发下战略小金属回收机遇 首次覆盖 乔锋智能 2026半年报点评:多维共振驱动业绩向好, 26Q2利润同环比高增 华锡有色 锡价驱动增长,资源整合有望打开空间 威尔高 新产能逐步投产,有望受益于AI电源需求发 展 景旺电子 二季度盈利能力环比改善,AI产品全面提速 中国太保 首次覆盖报告:长航行动深化价值转型,资负 双轮驱动开启新周期 联讯仪器 光通信测试仪器&设备龙头,拓展碳化硅功 率器件&半导体测试 青岛银行 区位、客群、牌照优势护航,盈利增长量质 并行 鼎阳科技 2026年中报点评:Q2业绩创新高,H1高端收 入占比达40% 格林美 镍钴资源进入收获期,电池回收与高端材料 打开成长空间 鹏鼎控股 全球PCB龙头企业,AI服务器助增长 翰博高新 锚定新赛道,共启新征程 广立微 电光双驱,良率领军 北化股份 2026年半年报点评:公司海外收入+79%,硝 化棉量价齐升与扩产驱动业绩提升 科博达 从大众到全球,出海进行时 光智科技 公司深度报告:打通红外全产业链平台,塑造 磷化铟新增长曲线 近一周公司机构关注度(按研报篇数排序) 金徽酒(28)>中国平安(27)>宁波银行(26)> 盐津铺子(24)>中国中免(22) 近一周行业机构关注度(按研报篇数排序) 基础化工(392)>食品饮料(372)>医药生物 (360)>电子设备(317)>金融(313) 今日热门研报TOP 5 第 4 页 / 共 5 页 1 长江证券邓越:WorkBuddy金融投研应用 ——AI投研(三)(昨日第一) 2 粤开证券罗志:为何一线城市消费冷热不均? (新上榜) 3 国金证券宋雪涛:本轮长债利率暴涨之谜 4 中泰证券刘洋:当美债的底牌被全世界看透( 新上榜) 5 国泰海通郑雅斌:如何构建红利低波策略(新 上榜) 编辑整理:财联社 第 5 页 / 共 5 页", "status": "extracted"}, "post:2026-08-27T10-42:df808aef42a7": {"id": "post:2026-08-27T10-42:df808aef42a7", "kind": "post", "title": "2026-08-27 10:42", "source_label": "帖子正文", "excerpt": "Databricks 专家的观察，向开源倾斜明显 OpenAI和Anthropic在Databricks上的token消耗比重和趋势？Databricks方面，OpenAI和Anthropic的foundation model API在2026年8月累计收入已经超过数亿美元，这是从他们上线到现在的总", "content": "Databricks 专家的观察，向开源倾斜明显 OpenAI和Anthropic在Databricks上的token消耗比重和趋势？ Databricks方面，OpenAI和Anthropic的foundation model API在2026年8月累计收入已经超过数亿美元，这是从他们上线到现在的总收入，增长速度非常快。两家起步时间是2025年5月，起步阶段的三个月总收入为千万美元量级。之后，2025年8月至10月，三个月收入增长到数千万美元，一直到2026年2月至4月达到顶峰，季度收入为两亿多美元。2026年5月至7月，增长速度放缓，环比下降约一成，收入回落到两亿美元出头。整体来看，从2025年5月上线到2026年4月一直保持高速增长，4月达到顶峰后有所回落，这也与2026年5月新模型上线（如GLM、K3等）有关。整体趋势是高速增长后进入平稳期。 如果分别看Anthropic和OpenAI，Anthropic的入场时间是2025年4月。它的增长幅度很大，从最早一个月数百万美元增长到今年一季度末的千万美元，增长了十多倍。客户基数也从上线第一个季度的一千多个客户增长到现在的五千多个客户。客户基数从上线第一个季度的一千多个客户增长到现在的一千六百多个客户，增长速度不如Anthropic，但OpenAI的单客户花费高于Anthropic。整体来看，Anthropic的请求量是OpenAI的两倍多，Anthropic的token总请求量显著领先，OpenAI相对较少，Anthropic在请求量上占据主导地位。 Anthropic在5-7月收入贡献增长放缓，OpenAI在Q2客户增量也减少，未来两个季度会持续这个趋势？ 后续不一定会反弹。根据销售预测，后面几个季度收入会比较平稳，大约每季度两亿多美元。2026年2月至4月有一个峰值，环比增长超过两倍，之后收入回落。后续虽然还会有新模型上线（如新的OSS等），但预计不会再维持之前的高速增长，可能进入平稳期。除非云或Anthropic有新的模型推出，但从销售预测来看，后续收入基本保持平稳。 从GLM或KIMI等模型产生的客户token需求是否体现在Foundation Model API里面？ 不体现，因为这些是OSS模型，不属于Foundation Model API的范畴。 Databricks的下游客户所在的行业比重？ 目前最大的客户行业是FSI。Anthropic请求量最大的两个模型是Haiku 4.5占五成和Sonnet 4.6占四成。剩下约一成是Opus和Fable等其他模型。Databricks支持的客户主要用Claude做coding任务较多。行业的话比较分散，Databricks整体来说比较横向分布。OpenAI方面，六成的收入来自GPT5.4 NANO，剩下四成由GPT5.6 SOL、Terra、Codex等模型平分，每个模型大约有数千万请求数。OpenAI在coding方面有专用的Codex模型，但请求量较少，更多客户选择Anthropic进行coding任务。 OpenAI 和 Anthropic 在 Databricks 上购买服务的支出趋势和订阅服务内容是否增加？ 从二季度初来看，Anysphere最高，之后是OpenAI和Anthropic。他们的月度支出增长率水平接近。目前没有看到他们在其他服务上的用量显著增加。这两家客户主要还是使用现有的数据产品，对新推出的AI服务兴趣不大。 Anthropic收入在Q2放缓了主要是被哪家抢走了份额？ Q2增长最多的是Gemini，Gemini在2026年Q2大幅增长。Gemini有一次降价，并对batch inference进行了重要优化，带来了大量新用量。Gemini 3 Flash模型在Q2增长了约两倍多成，超过了Claude Sonnet 4.6和GPT 5.3。 现在头部模型中，Gemini的需求是增长趋势最强劲的？ 是的，目前Gemini的需求增长最强劲，主要是因为今年Q2上线后进行了约三成多的降价，带来了大量新用量。如果Anthropic也降价，预计其用量也会快速增长。Databricks本月正在和Anthropic谈新的价格框架。 Gemini的batch inference优化具体成果？是成本大幅下降还是推理性能提升？ 主要是成本大幅下降。Gemini对token计数方法进行了优化，很多cache的context不再计入input token，提高了cache命中率。 和国内模型厂的合作情况如何？未来会成为重要收入驱动力吗？ 目前国内模型厂的收入非常少，因为他们刚上线，且多为开源（OSS），计费模式完全不同。例如Kimi和GLM 5.2，客户在Databricks平台上使用时，Databricks基本无法统计其用量。比如阿里的千问，因为它上线比较早，使用量增长很快。Kimi和GLM 5.2才上线两个月，具体怎么合作还没定。到时候Databricks应该也会和Kimi谈一个合作框架，比如超过多少就付费，或者一揽子总价。现在还在谈，我问了不少人，他们都说应该按照Kimi公开的开源收费标准和商业协议来，不一定会有Databricks专属的条款。 Databricks后面会主要更多地用开源模型，会挤占很大一部分旗舰模型的用量？ Databricks的态度是拥抱开源，不过同时也会优先Anthropic，把Anthropic的模型作为first party、first tier model提供给客户。其他商业模型，比如阿里，还在思考中。 国产这些模型厂是否采用Databricks或者Snow的SQL、Lakeflow等产品？ 包括智谱和月之暗面，他们用的是阿里的data warehouse，还有阿里上的RDS。Databricks刚刚开始和他们谈，现在他们都没有用Databricks。 国产模型厂会是未来两个季度的重要获客？ 国内未来两季度，Databricks的策略是把Databricks内部很多依赖模型都切到这些OSS上。对外部客户倒不是未来两个季度的重点。Databricks内部用了很多模型，比如Databricks自己做内部产品的一些insight、内部审计，包括公司运营的agent，未来两个季度要切到这些开源的国内模型上。 Databricks后续可能更倾向用哪家国产开原模型？考虑？ 应该最多的是GLM 5.2，Databricks也对它做了最深入的优化。 Databricks和Snowflake的Postgres进展？会成为之后获客和客户spending考虑上的重要因素？ Lakebase的增长特别快，Lakebase ARR已经突破两亿美元，过去六个月翻倍，从上线到现在用量增长很快。Lakebase最大的使用来源是agents，即Agent Bricks和Databricks Apps，这两个产品自己创建的Lakebase实例对整体收入贡献三成多。Postgres在Snow是独立的OLTP数据库，而Lakebase在Databricks上和Delta Lakehouse结合得很紧，创建一个branch就能产生一个Lakebase实例，不需要复制数据。Think Table是客户以前用于分析的warehouse，直接点一下就能得到一个OLTP数据库，底层其实也是一份数据的copy。专门用于Think的这一块一年收入两千万出头，也挺高的。 跟Postgres的对比，他们是一个单独、独立出来的产品。而Lakebase在Databricks的Value Proposition中，产品定位是一个湖仓一体的运营数据库。Snowflake的Postgres应该是2024年发布的，Databricks的Lakebase GA更早一些，是2023年。差异化在于，Databricks的Lakebase与Delta Lake和Unity Catalog是原生集成的，而Postgres在Snow中是与Snow的Lakehouse完全并行独立的一个产品。对agent的支持方面，Lakebase原生支持agent，比如在agent中需要存储context或建立cache时，会自动创建一个Lakebase实例。而在Snow上，cortex agent需要先创建一个Postgres连接，cortex agent才会用Snow的Postgres作为交易数据库或context cache，没有那么原生集成。 两家的Postgres能力似乎并不是也不是客户考虑的重要因素之一？ 我觉得这更多是背后的support。有的客户问Databricks，其实他们并不需要了解后端具体连接的是什么，如果只是做agent，后端连的是什么并不重要。但Databricks需要确保客户不要连接自己的Aurora、MySQL或Postgres等数据库，这是Databricks内部关心的事情。如果客户没有用Lakebase，Databricks会有各种方法让他用Lakebase。但客户一般不会要求Databricks比较Lakebase和Postgres的差异，也不会把这个作为主要的决定因素。 OLTP任务上客户为什么一定要选择Databricks和Snowflake，而不是Oracle Database、Amazon RDS或开源方案？ 如果用Databricks Agent，想连接外部数据库会比较麻烦，需要自己建立connector。而用Lakebase是原生支持的，客户可以直接使用。Databricks很少遇到客户用Oracle或RDS来构建agent，可能这类客户根本没有选择Databricks。如果客户用Databricks构建agent，再用外部的商业事务型数据库，这种情况非常少见。我理解没有必要把这部分工作分到两个平台去管理。 Databricks对Agent的优势并不完全在于Lakebase本身。Databricks有一个完整的Story Telling去说服客户用Databricks构建Agent。首先是Data Intelligence，Agent除了具备通用智能，还要与数据结合。其次是统一治理，包括对context、数据和AI资产的整体治理。第三是Choice，没有厂商锁定，Databricks是开源的，用户可以自由迁移，比如Agent用的是MLflow 3.0，计算引擎是Spark，数据格式是Delta，这些都是开源的。Databricks未来能让Agent可以跨云实现灾备和负载均衡。Databricks可以部署在三大云上，客户可以在Azure和AWS各部署一份，通过唯一的endpoint实现云间切换和负载均衡。这样可以提升可靠性，实现DR（Disaster Recovery），比如Azure故障时切换到AWS。客户也可以根据不同云厂商的折扣或SLA灵活选择。这是Databricks补充的第三点优势，也是Databricks向客户介绍用Databricks构建Agent的价值主张。#文字观点", "publish_time": "2026-08-27 10:42", "tags": ["文字观点"]}, "attachment:files/资深专家谈“六网”新抓手之算力网20260826.pdf": {"id": "attachment:files/资深专家谈“六网”新抓手之算力网20260826.pdf", "kind": "attachment", "title": "资深专家谈“六网”新抓手之算力网20260826", "source_label": "其他", "excerpt": "更多#—#u2026余逸霖银河证券策略分析师: 各位投资者大家下午好，欢迎参加今天的这个六网主题之算力网专场交流会。我是银河证券 策略分析师袁世麟。", "content": "更多#—#u2026余逸霖银河证券策略分析师: 各位投资者大家下午好，欢迎参加今天的这个六网主题之算力网专场交流会。我是银河证券 策略分析师袁世麟。今年以来，我们看到这个国家层面对于六网做出了持续部署。那六张网， 它既是稳投资的一个重要抓手，也承担着这个培育新质生产力，然后提高资源配置效率以及 增强安全韧性这些长期的功能。那我们今天重点讨论其中的这个算力网。算力网是数字经济 和AI发展的一个关键的基础设施，那也是六张网中成长属性比较突出的一个方向。今天， 我们非常荣幸邀请到了算力网领域的资深专家来进行分享。 专家曾经参与过算力、电力、通信三张网相关政策的研究和制定，对于全国一体化算力网的 这个顶层规划、算网融合以及算电协同都有非常深入的理解。那今天，我们也希望从这个政 策制定和规划实施的这个视角，围绕市场高度关注的一些问题展开交流。那我们接下来有请 专家。好的，谢谢专家。那我们要不就直接开始这个提问交流。 算力网领域资深专家: 好的。 余逸霖银河证券策略分析师: 好的，那我们首先想请教专家第一个问题，就是关于这个政策定位方面的。我们就是想请教 “十五五”期间的这个算力网的政策定位，以及整体的投资 率为0.7%，环比有所影响。 2、储能方面，2026H1公司实现储能系统产品交付3.1GWh，确收在1.5GWh左右，其中#2026Q2在1GWh左右规模，环比接近翻倍。2026H1，公司储能毛利率在15%左右。 3、财务数据方面，公司加强现金流控制，#2026H1经营净现金流达6.82亿元，同比转正，其中2026Q2经营净现金流达15.13亿元，同环比转正；公司2026Q2末资产负债率为76.17%，环比上季度末-0.32pct，环比年初下降1.03pct，财务状况稳步向好；2026H1，公司计提资产减值7.1亿元，主要为存货跌价，其中Q2规模约4.1亿元。 4、2026Q3，公司组件出货预期为15-17GW，随着飞虎3组件占比提升、海外高溢价市场出货规模的提升，业绩有望大幅减亏。展望后续，1）光伏方面，公司产品效率行业领先，年底有望具备超40GW的TOPCon3.0产能（满足一级能效标准），高功率产品的年化产能规模行业领先，2026Q2末完成近30GW产能的贱金属工艺改造进一步降本增效。2）储能方面，2026年系统出货有望超10GWh，核心零部件自研量产能力增强，#“晴天365”AIDC光储系统解决方案正在跟中、欧客户对接。#文字观点", "publish_time": "2026-08-27 07:57", "tags": ["文字观点"]}, "attachment:files/瑞银证券-新洁能-605111-2Q26收入增长提速；管理层积极看待景气上行延续.pdf": {"id": "attachment:files/瑞银证券-新洁能-605111-2Q26收入增长提速；管理层积极看待景气上行延续.pdf", "kind": "attachment", "title": "瑞银证券-新洁能-605111-2Q26收入增长提速；管理层积极看待景气上行延续", "source_label": "瑞银证券", "excerpt": "abc 2026 年 08 月 25 日Global Research 快评 新洁能 2Q26收入增长提速；管理层积极看待景气上行 延续 2Q26收入强劲增长带动利润环比改善 新洁能 2Q26收入同比增长 35.3%至6.50亿元（环比增长 26%，2023-25年2 季度营收平均环比增长 15%）。", "content": "abc 2026 年 08 月 25 日Global Research 快评 新洁能 2Q26收入增长提速；管理层积极看待景气上行 延续 2Q26收入强劲增长带动利润环比改善 新洁能 2Q26收入同比增长 35.3%至6.50亿元（环比增长 26%，2023-25年2 季度营收平均环比增长 15%）。受强劲收入增长带动，新洁能 2Q26归母净 利润环比增长 47%至1.39亿元，符合瑞银证券预测的 1.34亿元；公司 2Q26 净利率 21%，环比改善 3.1个百分点，主要因毛利率改善所致（ 2Q26毛利率 环比增长 2.3个百分点）。 核心下游景气度持续提升，储能、汽车、数据中心共同驱动增长 1H26公司核心下游（储能、汽车、数据中心）景气度提升，合计实现收 入5.14亿元，同比大幅增长 62%，占收入比重由 1H25的34%提升至 44%。 储能领域：公司1H26储能收入同比增长 112%，得益于公司在国内外新能源 政策利好频出背景下，深化和头部客户的战略合作； 汽车电子领域：公司紧 抓海外器件国产化替代窗口期，实现份额稳中有升，汽车电子收入同比增 长42%；AI算力及通信领域： 公司1H26数据中心相关收入恢复增长，实现 环比增 53%。据公司介绍，公司相关产品 1H26顺利导入包括 E-Fuse等细分 应用，并逐步实现销售，未来有望成为公司新的成长支撑点。 行业供给仍偏紧，料涨价推动利润率持续改善 公司2Q26毛利率已环比改善 2.3个百分点至 31.1%。公司管理层介绍，目前 功率行业 8寸扩产仍谨慎，行业供需仍偏紧且下游客户库存水位仍处于较低 水平。基于公司涨价逐步落地及核心下游市场景气度延续，公司毛利率改善 趋势或将延续。 估值: 微调目标价从 81.30元至82.20元；维持买入评级 反映新洁能 1H26业绩后，我们略上调新洁能 2026-28年盈利预测 0-2%，主 要因略高的毛利润预测。基于 40x 2027-28年平均 EPS（与此前一致），我们 得到目标价 82.20元（此前为 81.30元），维持买入评级。 重要数据 (Rmb百万) 12/23 12/24 12/25 12/26E 12/27E 12/28E 12/29E 12/30E 营业收入 1,477 1,828 1,877 2,463 3,169 3,999 4,935 5,993 三财季营收将为1058.4亿美元至1101.6亿美元，市场预估为1051.5亿美元 ⑧【苹果】苹果公司周三宣布，将于当地时间9月9日（北京时间9月10日凌晨）举行秋季新品发布会。除了新CEO外，9月新品发布会最大看点无疑是苹果首款折叠屏iPhone。#国内重要资讯①【新兴产业】上海市人民政府办公厅印发《上海市战略性新兴产业发展“十五五”规划》。其中提到，重点发展：高端芯片和人工智能（AI）赋能设计、先进封装、新型器件和新架构芯片。 ②【电力】 8月26日，记者从国家电网有限公司获悉，该公司已制定出台助力国家“十五五”碳达峰目标实现的若干举措，围绕能源电力结构转型、清洁能源优化配置、重点领域节能降碳等7个方面，提出20项具体措施。 ③【MiniMax】 8月26日晚，MiniMax创始人、CEO闫俊杰提到，公司8月年度经常性收入（ARR）已超过8亿美元（约合人民币53.8亿元）。与此同时，今年7月，MiniMax的token消耗量已经达到1月的20倍。 ④【工信部】 8月26日，国新办举行“开局起步‘十五五’”系列主题新闻发布会，工信部表示，未来五年加快打造航空航天、智能机器人等新兴支柱产业，加快新一代通信网、算力网规划建设，加强6G技术研发。 ⑤【锂矿】 8月26日，宜春市生态环境局发布说明，宜春时代新能源矿业有限公司江西省宜丰县圳口里—奉新县枧下窝锂矿采矿项目环境影响报告书在拟受理公示期间，群众对建设单位前期公示的网站存在质疑。现将该拟受理公示撤销，待后续核准符合要求后，再另行公示。 ⑥【银行贷款】近期，工商银行、农业银行、中国银行、建设银行、交通银行、邮储银行就中小微企业贷款贴息及服务业经营主体贷款贴息政策的最新优化情况发布公告。其中，单户中小微企业在单家机构可享受中小微企业贷款贴息的贷款规模上限由每年5000万元提高至7500万元。 ⑦【人形机器人】据央视新闻报道，8月26日晚间，第二届世界人形机器人运动会大型组100米决赛，天骄队跑出8.64秒，继开幕式上跑出9.39秒、复赛跑出8.85秒后，再次刷新百米竞赛纪录。 ⑧【中际旭创】8月26日，上海证券交易所宣布将中际旭创（H股）调入沪港通下港股通标的，自下一港股通交易日起生效。#文字观点", "publish_time": "2026-08-27 09:49", "tags": ["国际重要资讯", "国内重要资讯", "文字观点"]}, "post:2026-08-27T10-49:414e1354a0d7": {"id": "post:2026-08-27T10-49:414e1354a0d7", "kind": "post", "title": "2026-08-27 10:49", "source_label": "帖子正文", "excerpt": "【长江电新】铜冠铜箔2026年中报点评：业绩落于预告中枢，HVLP铜箔量价期权打开估值空间，继续推荐！1、铜冠铜箔发布2026年半年度报告，2026H1实现归母净利润2.15亿元（同比+514.75%）、扣非净利润2.07亿元（同比+754.21%）。", "content": "【长江电新】铜冠铜箔2026年中报点评：业绩落于预告中枢，HVLP铜箔量价期权打开估值空间，继续推荐！ 1、铜冠铜箔发布2026年半年度报告，2026H1实现归母净利润2.15亿元（同比+514.75%）、扣非净利润2.07亿元（同比+754.21%）。折算2026Q2归母净利润1.09亿元（同比+259.35%、环比+2%，整体基本持平），扣非净利润1.05亿元（同比+262.4%，环比基本持平）。此外，公司同步推出中期分红，拟每10股派发现金红利0.60元（含税）。 2、经营端来看，公司H1完成铜箔产量3.62万吨、Q2约1.8万吨，环比基本持平，整体处于满产状态；预计锂电结构变化不大，考虑上半年涨价落地，预计单位盈利有所提升。结构端，高频高速铜箔（RTF+HVLP）占比显著提升，其中高端铜箔占比突破50%，其中Q2HVLP-4出货或在百吨级以上，估算RTF+HVLP铜箔的经营性单吨盈利预计在1w+，其中HVLP铜箔预计占比持续提升，但良率挤压同样明显。盈利质量方面，PCB铜箔毛利率同比提升6.04pct至11.60%、锂电铜箔毛利率同比提升3.53pct至3.77%，结构升级与加工费回升逻辑持续兑现。 3、展望来看，公司作为HVLP铜箔的核心放量主力，RTF/HVLP铜箔出货有望延续攀升态势，且短期以良率改善驱动高质量起量、而非依赖大规模扩产；进入26H2，AI算力对PCB高端铜箔（HVLP/RTF）的需求将步入加速放量阶段，公司有望充分受益，高端铜箔的出货弹性显著。盈利端，结构升级、加工费回升与账期缩短三重因素共振，共同支撑中期盈利空间。此外，仍应重视中试公司的期权价值：其一为HVLP-5突破放量带来的非线性增长，其二为载体铜箔产业化推进顺利所打开的远期巨大空间。继续推荐。#文字观点", "publish_time": "2026-08-27 10:49", "tags": ["文字观点"]}, "attachment:files/爱博医疗（688050）2026年中期业绩交流会纪要20260826.pdf": {"id": "attachment:files/爱博医疗（688050）2026年中期业绩交流会纪要20260826.pdf", "kind": "attachment", "title": "爱博医疗（688050）2026年中期业绩交流会纪要20260826", "source_label": "其他", "excerpt": "爱博医疗（ 688050 ）2026 年中期业绩交流会纪要 （20260826 ） 要点总结 1.2026H1 核心财务数据 ：上半年实现营业收入 9.33亿元，同比 +18.57% ；利润总额 2.1亿元、净 利润1.83亿元、扣非净利润 1.77亿元，同比降幅介于 12.9% —14.39% ", "content": "爱博医疗（ 688050 ）2026 年中期业绩交流会纪要 （20260826 ） 要点总结 1.2026H1 核心财务数据 ：上半年实现营业收入 9.33亿元，同比 +18.57% ；利润总额 2.1亿元、净 利润1.83亿元、扣非净利润 1.77亿元，同比降幅介于 12.9% —14.39% ；经营现金流 1.2亿元，同比 -22%，主因部分客户账期延长、回款增速低于收入支出增速，二季度已启动多部门联动的账款催收机 制。 2.分产品收入结构 ：人工晶状体 3.06亿元（同比 -11%，受医疗机构业务收缩、医保支付结构调整等 阶段性影响）；角膜塑形镜 1.204 亿元（约 +4%，竞争加剧增速放缓）；隐形眼镜 2.81亿元（同比 +18.68% ）；德美医疗（运动医学） 2026 年3月并表贡献 9433 万元，带线铆钉等核心植入产品占比 75%。 3.分地区收入 ：境内 8.37亿元，同比约 +1%，与上年基本持平；境外 9579 万元，同比 +123.21% ，占比从 2025 年同期约 5%提升至 10%，境外以手术类治疗产品为主（大景深预装多 焦、预装非球面等晶体），先后在香港、欧洲设立子公司。 4.利润下滑四点归因 ：①晶体仍是利润主要来源，其收入下降影响较大； ②隐形眼镜高增长＋德美并 表带来产品结构变化，各业务毛利率不同致营业成本增速高于收入； ③上半年加大营销渠道、品牌、海 外拓展投入，销售费用增长较高； ④并购利息支出影响利润。 5.人工晶状体：政策与库存双重出清、底部已现 ：除医保因素外，下滑系 2025 年二季度高基数、经 销商对新一轮集采观望、消化库存三重因素叠加；管理层判断白内障手术业务已达低谷，下阶段预计逐 渐回暖或至少稳定。下一轮集采预计 2026 年9月底或 10月，若下半年落地则对下半年销售持乐观态 度。 6.晶体价格企稳与高端化趋势 ：医保局提倡避免内卷式竞争，单焦点晶体价格已较低、继续降价空间 不大；集采续约中部分产品增补挂网已获近 10%提价。高端晶体增速超过晶体平均水平，销售额占比 超过1/3、达35%以上；竞争最终取决于技术细节与真实临床效果，公司凭光学设计积累有信心保持 领先。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 7.晶体新产品进展 ：全景（单焦点扩景深晶体） 2026 年刚获证，已在欧洲销售至少 3年并为主力产 品；三焦点晶体预计 2026 年年底左右获证并贡献收入；模压人工晶体已完成取证，公司由车削转向模 压路线以降低大规模制造成本（年生产任务近 200万片）。人工晶体市场份额已接近 1/3，继续向上 需突破性创新产品支撑。 8.隐形眼镜：满产满销、盈利弹性临近 ：收入 2.81亿元（ +18.68% ），自有品牌和渠道业务接近 +46% 增长，代工业务增长不明显；所有产线产能饱和，两工厂通过工艺改进等非新增产线方式增加 10%—20%产能且已全部消耗；两家工厂良率约 85%（去年同期 60%—70%），已达行业平均水平 略高。管理层未给全年盈利指引，但明确业务向好、利润贡献的曙光已不远。 9.隐形眼镜盈利提升路径与差异化优势 ：规模效应（固定成本不变，产能利用率提升可立刻拉动毛利 率）＋高附加值功能性产品（毛利率远超普通产品）；彩片自产模具、自主设计光学与形状并持续改进 油墨技术；硅水凝胶已做出全球基本最高透氧率产品，待临床获证；功能性产品基于 EDoF 等光学设 计，能力对比国际巨头不弱。 10 品牌建设前期投入较大，包括品牌宣传和渠道开拓，上半年投入较多，但未单独拆分 隐形眼镜销售费用占比。隐形眼镜业务总体向好，将逐步加大利润贡献。天眼工厂毛利率、人均产值不 断提升，合格率改善，已为客户认可并贡献利润。隐形眼镜业务已具备良好基础，未来将为公司整体财 务指标做出较大贡献。 Q：公司高端人工晶状体产品的占比和增速情况如何？面对新厂家获批，如何看待竞争格局变 化，以及如何维护先发竞争优势？ 答：高端晶体增速超过晶体平均水平，销售额占比超过三分之一，达 35%以上。未来随着白内障手术 水平提高和患者需求增加，高端晶体是趋势。竞品厂家陆续推出高端晶体，但公司基于光学设计优势， 推出如全景单焦点扩景深产品，获医生认可，在欧洲已销售 2至3年并成为主力。竞争最终取决于技 术细节和临床效果，公司有信心保持领先优势。 Q：上半年运动医学行业及德美医疗的经营和整合情况如何？预算目标是否完成，全年业绩承 诺有无压力？ 答：公司3月完成德美医疗收购工商变更，整合迅速顺畅，业务销售保持团队独立性和延续性，中后 台部门进行整合以节约开支，后续将在研发方面发挥协同。二季度并表后，德美经营在预期范围内，实 现良好增长，比去年同期增长，预计完成全年业绩目标没有问题。 Q：境外收入占比提升，对业绩增长有促进作用。境外增长主要来自新客户还是老客户？成功 经验是否可以复制？ 答：境外增长以新客户为主，公司在多个国家获得市场准入许可，开辟新战场，传统欧洲客户也保持增 速，但新客户增加明显。公司自去年起加大境外布局和团队建设，初步成果显现。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 Q：除人工晶体外，隐形眼镜也进行了海外注册，未来其他产品的出海计划以及渠道和团队建 设规划如何？ 答：除人工晶体外，德美医疗在海外也有优势，模式与人工晶体类似，两个团队紧密配合，可互相介绍 客户资源。隐形眼镜作为 toC产品，销售模式不同，但中国制造具有成本优势，将利用该优势加快国 际化销售，已在东南亚、日本、韩国等国家与当地伙伴进行实质性谈判，部分国家已开始拿证。 Q：镜片业务中彩片、硅水凝胶和功能性镜片的产能如何分配？面对国内终端销售情况，未来 的战略重心在哪里？ 答：彩片、硅水凝胶、功能性产品均全面发展。彩片方面公司有工艺特点，自产模具、设计光学和形 状，保证舒适度，不断改进油墨技术提高合格率和工艺水平以降低成本。特色在于硅水凝胶高透氧产 品，具备材料研发优势，透氧率达全球最高水平，下一步将通过临床试验获证。功能性产品基于光学设 计技术如 EDoF，针对老花和眼疲劳患者，基于长期眼科光学和材料积累，国内厂家不具备，与国际巨 头相比能力不弱。长期看，隐形眼镜将通过技术占领制高点发挥优势。 Q：美瞳业务目前的良率爬坡情况如何？ 答：良率已达到行业平均水平略高，远超去年同期。去年同期良率约 60%至70%，目前两家工厂基本 在85%左右，处于行业平均水平以上。 Q：与台湾美瞳大厂相比，他们的良率水平如何？在良率提升后，如何展望美瞳业务后续的盈 利释放？ 答：各厂良率因检测标准、生产产品类型（透明片或彩片）、最小起订量等因素差异较大，单纯比较绝 对数字无意义。未来利润提升空间不仅仅在于良率，更在于规模效应：隐形眼镜是规模制造业，产能利 用率提升、生产规模扩大能提升毛利率；同时通过生产高附加值的功能性产品，其毛利率远高于普通产 品。目前工厂毛利率还有很大提升余地，但需要销售端配合，如果订单持续饱和或增加，毛利率可进一 步提升。 Q：如何看待此次核心研发人员调整的原因，以及后续研发管线的规划？ 答：核心研发人员是动态变化的，随着公司发展重点调整和人才涌现，调整是必要的。此次调整基于公 司需要，新任命的魏永吉和黄兆辉分别担任研发总监和高级研发经理，独立负责多个研发部门，作用更 关键。原有两位研发人员仍继续在公司从事研发工作。 Q：6月份获批的玻璃酸钠滴眼液是否会对海露形成替代？后续推广计划如何？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 答：该产品为无防腐剂多剂量玻璃酸钠滴眼液，与海露浓度和使用方式相同，但包装瓶型不同。海露品 牌力强大，渠道完善，短期替代不现实。公司将通过原有渠道和拓展 OTC渠道逐步起量。选择该产品 主要目的是积累药品研发、生产和质量体系经验，为未来药品布局打基础，已获得第一张药品注册证， 未来可能在药品方面进行其他产品布局。 Q：爱博医疗对优你康良率提升有哪些具体赋能？ 答：优你康基础比天眼更成熟，采用台式路线，但旧有模式成为瓶颈。公司自今年派驻管理人员和技术 人员，主要改进包括：将模具从台湾进口转为国产化和自产化以降低成本；加快新产品开发速度，如流 行的高光定位美瞳产品，加强与总部配合。目前优你康能做到盈亏平衡，下一步通过上述措施利润将由 负转正，逐渐贡献利润。 Q：爱博医疗在美瞳 O2O业务方面有哪些优势？为何库博等大厂选择与爱博合作？ 答：最大优势是做得最早，孵化了美悦瞳，是首批做 O2O仓店业务的，积累了丰富经验和平台先发优 势。O2O运营团队强大，电商运营有自身逻辑和门道。从结果看，所有大厂包括库博、爱尔康、博士 伦都与公司合作，非常看重该渠道。 O2O被看好为未来主战场，各平台投入较大，公司在美瞳 O2O 具有先发优势。 Q：下半年单焦产品的价格和量是否已经企稳？集采续约中的部分产品增补挂网获得近 10%的 提价，这一趋势是否可以继续？ 答：新一轮集采中，医保局提倡避免内卷式竞争，集采规则下继续降价空间不大，尤其单焦点晶体价格 已较低，预计价格能够企稳。 Q：三焦点晶体的注册进展如何？何时能贡献收入？ 答：三焦点晶体预计今年年底前能拿证，很快能贡献收入。 Q：销售费用的拐点何时到来？ 答：手术产品方面销售费用控制较好，但 PR产品上市后新招团队和医生培训增加了一些费用；新增销 售费用主要来自隐形眼镜品牌宣传和渠道建设投入。总体来看，销售费用在未来半年或未来将逐渐呈下 降趋势，因为前期投入已基本完成。 Q：近两年的收入增速总体不快，公司认为是自身经营上的问题更大，还是行业需求政策方面 的影响更大？ 答：主要受行业政策影响，人工晶体集采导致价格下降和部分手术量下降，整个医疗器械板块面临困难 环境，失去高增速趋势。公司自身方面，人工晶体市场份额已达三分之一，基数较大，进一步增长需要 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960 突破性新产品，公司也在横向布局隐形眼镜等新领域，对收入和利润贡献逐步显现，利润贡献的曙光不 远。 Q：公司最近获证的模压人工晶体后续生产计划如何？相对于现有车削方式，模压晶体的单位 成本和效率有何影响？ 答：模压晶体大规模生产成本更低，前提是合格率达到一定水平。公司起初因产量小采用车削路线，现 在每年近 200万片人工晶体生产任务，转向模压晶体是为了降低大规模制造成本。 Q：德美医疗的植入产品毛利率比天星稍低的原因是什么？第二季度德美收入 1.17亿元中， 运动医学约九千多万元，剩余部分是什么？ 答：德美医疗毛利率比天星低的原因是两者规模有差距，德美销售规模较小导致产能利用率不占优势， 毛利率偏低；另外德美在生产管理方面有改进空间，如多地生产（北京、重庆），物料采购等方面也有 改进空间，公司有信心将毛利率提升至行业水平，说明利润率有改善空间。关于收入差异，主要是收购 时德美旗下研究院尚未并表，部分物料收入列在运动医学产品之外，该部分收入和成本基本持平，对利 润影响不大，研究院即将并表，差异以后将消除。 Q：随着近视防控方式多样化，如何看待对 OK镜的长期替代趋势？离焦框架镜和软性亲水接 触镜等产品的布局进展如何？ 答：近视防控手段多样化，针对不同患者需求， OK镜有自身优势，客户人群稳定，不会被淘汰，地位 长期存在。公司也布局离焦镜和离焦软镜，有一定销量，但目前不是主力，因为公司不是专业做大镜片 的，与蔡司、依视路等相比市场份额较小。 Q：请展望一下人工晶体国产（集采）目前的进展。 答：新一轮集采预计在 9月底或 10月份完成，但具体取决于医保局整体进度，因为前面还有其他集采 任务。 Q：从产业角度看，眼科器械领域主要有哪些创新研发方向？公司产品线后续是否会拓展至眼 科药品或设备？在完成德美医疗并购后，后续是否考虑其他投资并购机会？ 答：眼科创新需要突破性产品，但突破性创新来之不易，短期看国际上有突破性创新的产品不多，如爱 尔康放弃可调节人工晶体研发。公司保持关注并不断探索。在药品方面，公司内部研发团队尝试剂型改 进，利用隐形眼镜护理液等制剂基础；眼科设备方面，公司考虑在适当时机成立设备团队，外部有合作 并通过基金投资眼科设备企业。短期不会再做大的布局，因为德美刚完成并购，长远会持续关注医疗器 械赛道机会。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª QQ£º1490929960", "status": "extracted"}, "post:2026-08-27T09-34:1ec205962944": {"id": "post:2026-08-27T09-34:1ec205962944", "kind": "post", "title": "2026-08-27 09:34", "source_label": "帖子正文", "excerpt": "罗博特科调研纪要：(0827） 与会特色： 美银bofa组织，#无国内机构，包括2家#主权财富基金，10家#全球资管巨头，16家#对冲基金等，典型如新加坡政府投资公司，淡马锡控股，高盛，施罗德，千禧年，德劭，美国银行等。内容：上半年公司经营数据。", "content": "罗博特科调研纪要：(0827） 与会特色： 美银bofa组织，#无国内机构，包括2家#主权财富基金，10家#全球资管巨头，16家#对冲基金等，典型如新加坡政府投资公司，淡马锡控股，高盛，施罗德，千禧年，德劭，美国银行等。 内容：上半年公司经营数据。主要在于扭亏为盈，NPO/CPO/OCS/光模块等在手订单24.5亿，毛利率42.9%，现金流大幅转正。 QA各种设备纯制造周期3-4个月，测试类6-9个月。硅光晶圆测试设备相对短。光电子半导体业务占主营81%。今年以#光模块OCS订单为主，预计27年#以CPO/NPO为主。毛利和净利会继续提升。CPO：在ins2/3这两个核心测试占主供地位，客户订单和交货时间 压力持续加强，ins2供应台积电，ins3供应矽品spil。ins4目前联合台积电英伟达开发中。明年ins2和3至少可以看到数百台（Lee话：按照价值量测算，保守#50亿元）NPO：现在大部分是可插拔光模块设备订单，NPO硅光晶圆检测已经出货Tower （#中际流片商），耦合设备处于导入期。设备优势：全自动化，精度和效率#绝对优势。随着1.6T向3.2甚至6.4T演进，公司优势会越来越明显。产能：苏州明年月产能#300-400台，德国爱沙尼亚等也有布局，台湾OEM/ODM厂汉测进展顺利（Lee话：根据台湾新闻，汉测由于罗博特科出货需要，#扩招168名工程师，对应42+条产线）#文字观点", "publish_time": "2026-08-27 09:34", "tags": ["50亿元）", "中际流片商）", "耦合设备处于导入期", "文字观点"]}, "post:2026-08-27T10-48:ace8c86c7425": {"id": "post:2026-08-27T10-48:ace8c86c7425", "kind": "post", "title": "2026-08-27 10:48", "source_label": "帖子正文", "excerpt": "🇨🇳【广发军工】#中航光电积极增配 🚀26Q2归母净利 7.21 亿，盈利质量呈现逐季度改善趋势，#1000亿市值可期，中期可展望1500亿+市值。亮点一：毛利率自25Q4的27.74%，先后提升至26Q1的28%、26Q2的29.36%！", "content": "🇨🇳【广发军工】#中航光电积极增配 🚀26Q2归母净利 7.21 亿，盈利质量呈现逐季度改善趋势，#1000亿市值可期，中期可展望1500亿+市值。 亮点一：毛利率自25Q4的27.74%，先后提升至26Q1的28%、26Q2的29.36%！需注意，这个毛利率是在防务类需求阶段性下降+新能源汽车、数据中心、工业装备等领域的强劲增长拉动下背景下产生，#公司盈利构成由防务类产品转向民品驱动为主，是重要变化！ 亮点二：数据中心领域，#电源产品实现国内互联网终端及设备商的全覆盖；#液冷散热类产品深度参与行业头部客户智算平台项目并成为主力供应商、锁定未来2-3年客户需求，#报告期内产品订单翻番增长；公司112G高速已批量应用于数据中心超算等算力设备，#224G高速相关产品样品已进入客户验证阶段。 亮点三：#子公司翔通光科技业绩实现同比翻番增长。翔通光科技拥有25余年光模块用器件的研发制造能力，产品涵盖准直器、光纤组件、隔离器、多芯连接器（MT/MPO-FA）、光纤适配器及各类集成器件（Mux＆DeMux等）、高精密陶瓷基板类产品等，主要以800G及1.6T高速光模块、OCS交换机、NPO、CPO配套为主，收入占比超过90%，与光模块领域国内外头部企业均有稳定合作。#目前综合产能利用率处于高位，订单饱满，部分已排至2027年。 ------------ 🇨🇳广发军工&化工#文字观点", "publish_time": "2026-08-27 10:48", "tags": ["中航光电", "1000亿市值可期", "中期可展望150", "公司盈利构成由防务类产品转向民品驱动", "电源产品", "液冷散热类产品", "报告期内产品订单翻番增长", "224G高速相关产品", "子公司翔通光科技业绩实现同比翻番增长", "目前综合产能利用率处于高位", "订单饱满", "文字观点"]}, "post:2026-08-27T09-40:2c6f3ffd8002": {"id": "post:2026-08-27T09-40:2c6f3ffd8002", "kind": "post", "title": "2026-08-27 09:40", "source_label": "帖子正文", "excerpt": "华工科技：2026H1公司海外营收高增，海外产能建设持续加大公司发布2026半年报，2026上半年公司实现营业收入78.22亿元，同比增长2.53%；实现归母净利润11.86亿元，同比增长30.17%", "content": "华工科技：2026H1公司海外营收高增，海外产能建设持续加大公司发布2026半年报，2026上半年公司实现营业收入78.22亿元，同比增长2.53%；实现归母净利润11.86亿元，同比增长30.17%；实现扣非归母净利润7.47亿元，同比增长2.42%。2026Q2，公司实现营业收入35.56亿元，同比下降16.79%，环比下降16.64%；实现归母净利润5.48亿元，同比增长9.24%，环比下降14.24%；实现扣非归母净利润3.74亿元，同比下降10.90%，环比增长0.40%。2026H1公司海外营收呈现高速增长态势，海外产能持续爬坡 2026H1公司国内和海外营收分别为59.63、16.48亿元，较去年同期分别变动-9.64%、115.67%，主要受益于公司持续加大海外产能建设。根据产能规划，海外一期月产能目标是25-30万只。公司已在海外新购买了土地约100 亩，预计在今年底或明年年初建成4-8万平方米的新厂房，将为明年公司在北美市场1.6T光模块订单做好提前准备。公司800G、1.6T光模块全球批量交付，并稳步推进下一代超高速联接产品迭代升级 目前，公司800G、1.6T系列光模块已实现全球化批量交付，并稳步推进3.2T、6.4T、12.8T下一代超高速联接产品迭代升级：公司率先推出3.2TNPO产品并在美国OFC展会成功实现动态展示，同时推出6.4TNPO解决方案；完成200G/Lane架构12.8T XPO设计，样品实现行业首发。公司积极推进高端光芯片自主规模量产，保障现有及未来订单需求 公司是国内唯一覆盖InP/GaAs/SiP三大光电子平台的企业，并布局薄膜铌酸锂和量子点激光器等下一代技术，高端光芯片今年自主规模量产，实现400G、800G、1.6T全系列覆盖。基于公司一年前已布局的硅光PIC、VCSEL及CW激光器产能，目前光芯片供应可满足现有订单及未来增长需求。 风险提示：扩产进展不及预期的风险、其他核心物料供应紧张的风险、市场竞争加剧的风险、宏观政策影响公司业务发展的风险、汇率波动风险。 📢资料来源：华工科技2026半年报，同花顺。 【重要提示】以上信息为公开资料整理，不涉及投资建议及研究观点，仅供参考，本公司不保证其准确性、完整性与时效性；市场有风险，投资需谨慎！#文字观点", "publish_time": "2026-08-27 09:40", "tags": ["文字观点"]}, "post:2026-08-27T09-55:71b27f31fbb9": {"id": "post:2026-08-27T09-55:71b27f31fbb9", "kind": "post", "title": "2026-08-27 09:55", "source_label": "帖子正文", "excerpt": "光模块散热框架培训会议要点： 1. 光模块散热行业整体背景 近期旭创入股专注光模块内部散热的中石科技，体现光模块厂商对散热环节的重视程度持续提升。光模块散热分为内部散热、外部散热两大板块，二者为配套关系缺一不可，不存在仅靠单一环节即可完成散热的情况。", "content": "光模块散热框架培训会议要点： 1. 光模块散热行业整体背景 近期旭创入股专注光模块内部散热的中石科技，体现光模块厂商对散热环节的重视程度持续提升。 光模块散热分为内部散热、外部散热两大板块，二者为配套关系缺一不可，不存在仅靠单一环节即可完成散热的情况。 2. 散热路径与核心部件 内部散热核心功能为均热、导热，路径为：DSP、光芯片产生的热量→TIM导热材料→VC均热板→光模块外壳，再传导至外部散热器完成最终散热。 3. VC均热板细分情况 不同代际光模块VC均热板用量与价值量变化： 800G及以下光模块功耗较低，仅在高功耗DSP芯片上配备小型VC均热板，用量较少； 1.6T时代光模块功耗提升，对VC均热板要求提高，目前1.6T所用VC均热板单价约100元，较上一代产品价格提升20%-30%。 供给端格局： 行业参与者包括中石科技、飞荣达，海外的奇鋐、双鸿等，但光模块用VC均热板需要与下游光模块厂商深度绑定、定制化研发，客户粘性高，入局壁垒高； 目前国内公开信息中仅中石科技成功进入光模块VC均热板供应链，现有客户以海外coherent、国内索尔思为主，未来有望进入旭创供应链，进入后份额预计保持稳定。 4. TIM导热材料细分情况 TIM材料分为两类：TIM 1.0为与芯片裸die直接接触的导热材料，用于填平芯片与盖板缝隙；TIM 2.0为盖板与外部散热器之间的导热材料，用于填补二者缝隙提升导热效率。 行业进展与趋势： 目前TIM 1.0基本由海外供应商主导，TIM 2.0已有中石科技相关产品实现布局； 1.6T光模块对导热材料要求升级，TIM 2.0预计从12瓦导热等级升级至18瓦，产品价值量将有所提升； 国内厂商正在逐步导入供应链，核心关注标的为中石科技、德邦科技、科创新源。 5. 散热方案演进趋势 外部散热部署在交换机、服务器侧，核心为光模块插槽配套的散热器，分为风冷、液冷两类，方案选择与光模块功耗直接相关： 400G光模块功耗约十几瓦，无需额外散热器；800G光模块功耗约20-30瓦，风冷方案即可满足需求； 1.6T光模块功耗达30-40瓦，接近风冷约35瓦的散热极限，为风冷向液冷过渡阶段； 3.2T光模块功耗达40-60瓦，风冷无法满足散热需求，液冷将成为3.2T时代外部散热的标配方案。 6. 外部散热产品结构与价值量 外部散热模块由三部分组成：①Cage（壳体）：用于固定光模块、屏蔽信号；②IO连接器：与光模块对插实现信号传输；③散热器：实现热量导出。1.6T时代液冷方案仅散热器部分变化较大，Cage、连接器基本无变化。 两类方案价值量与盈利对比： 风冷方案摊至单个模块接口价值量约30元，行业平均毛利率约30%-35%； 液冷方案单个接口价值量达120-150元，行业平均毛利率可达40%及以上，收入与盈利弹性均显著高于风冷。 液冷方案推广逻辑：单交换机液冷接口价值量仅数万元，仅略高于风冷的近1万元，但可大幅降低光模块工作温度，延长光模块寿命，同时降低误码率、延迟等核心指标，性价比突出，未来将实现应上尽上，渗透率将维持较高水平。 7. 市场规模与需求节奏 800G光模块放量前，风冷Cage整体市场规模仅约10亿元，乐观情况下约20亿元； 2026年液冷产品已开始出货，2027年1.6T光模块出货量将数倍增长，叠加液冷渗透率大幅提升，预计2027年液冷Cage整体市场规模可达100-200亿元，较原有风冷市场实现10倍以上扩张。 8. 供给端格局 外部散热产品直接供应商为安费诺、莫仕、泰科等海外连接器大厂，绑定下游交换机、服务器厂商，制造环节多外包给国内厂商，核心国内供应商为鼎通科技、奕东电子。 核心厂商进展： 鼎通科技2026年1月起已开始批量供货，2026年一季度出货约3万套，二季度出货约10万套，三季度预计出货约15万套，四季度出货量环比将继续提升；目前已获得英伟达审查验证，2027年业绩弹性较大。 奕东电子已拥有成熟的光模块液冷产品，目前处于下游客户导入阶段，等待验证结果。 9. CPO/NPO架构对散热需求的影响 主流CPO/NPO交换机采用外置光源方案，光源对温度敏感度高，仍需要插槽安装外置光源，该插槽采用与光模块类似的OSFP封装协议，仍需配套IO Cage，且使用液冷方案的概率极高。 外置光源配套的Cage需要同时满足电连接、与后端光纤光耦合的要求，精密程度要求高于传统光模块Cage，产品价值量也更高。---xz#文字观点", "publish_time": "2026-08-27 09:55", "tags": ["文字观点"]}, "attachment:files/胜宏科技国金证券交流20260827 .docx": {"id": "attachment:files/胜宏科技国金证券交流20260827 .docx", "kind": "attachment", "title": "胜宏科技国金证券交流20260827", "source_label": "其他", "excerpt": "20260827 国金证券胜宏科技交流 一、 调研背景与开场说明 国金证券主持（提问者）：欢迎各位投资者参加本次交流会。鉴于公司将于今晚发布年报，请大家在交流中避免提问直接关联年报披露的具体敏感财务细节，以保护公司合规。", "content": "20260827 国金证券胜宏科技交流 一、 调研背景与开场说明 国金证券主持（提问者）：欢迎各位投资者参加本次交流会。鉴于公司将于今晚发布年报，请大家在交流中避免提问直接关联年报披露的具体敏感财务细节，以保护公司合规。明天上午公司还将有一场针对年报的专题交流，届时大家可进行更深入讨论。接下来我们把时间交给各位，进入问答与交流环节。 二、 AI行业趋势与全球市场空间 提问者：如何看待当前全球AI算力市场景气度，以及其对高端PCB行业带来的实际拉动？ 公司管理层：全球AI龙头巨头近期发布的财报以及对未来的明确展望，为整个市场重新注入了一剂强心针，打破了前几个月市场对AI景气度不足、发展可能放缓的疑虑。从个人和产业角度来看，人工智能（AI）赛道是未来十年最确定的黄金赛道，几乎没有其他赛道能与之媲美。 PCB层数与需求量呈指数级爆发：过去传统服务器和交换机的PCB平均层数仅为十多层，且整体需求量仅为当下的十分之一。而当前的AI服务器PCB平均层数已直接升级到30层以上（去年约为20层，随着新一代GPU架构落地，今年已全面升级至30层以上），这带来了极大的产能消耗和产值飞跃。 高位资本开支提供强力支撑：美国头部云厂商（CSP）未来数年将有数万亿美元的资本开支，从目前的实际出货和订单数据来看，其开支和建设进度完全符合甚至超越了前期的预测。除了美国，日本、韩国、中国等国家和地区也在同步加大AI投资和规模式建设，行业需求远超市场预期。 三、 核心工厂（越南M-S厂区）进展与整体产能规划 提问者：公司目前在海外的产能布局及大客户认证进展如何？ 公司管理层： 越南M-S厂区运营情况：公司在去年10月28日完成了对M-S（越南厂区）的并购，至今已运营约6个月。目前越南厂区处于高景气的“订单驱动”状态，公司直接把核心客户的认证转移至越南进行，规避了重新建厂和冗长认证的繁琐流程，这构成了公司非常好的时间与成本优势。 越南M-S厂区产值：目前M-S厂区投产爬坡约4个月，月产值已达到7000万至8000万人民币，未来将向单月超2亿人民币的产值目标迈进。 惠州老厂区与新厂房产值：公司的国内惠州老厂区具备约100亿人民币的年产值规模；而新规划建设的两栋厂房（新楼）总产值预计可超60亿人民币，其厂房建设与装修速度极快，设备规模化建设和安装预计将在今年12月基本完成。 海外与国内产能划分：在生产和出货策略上，公司根据客户的硬性要求进行合理调配。如果客户没有强制要求必须在海外生产，公司会优先安排在国内生产以降低成本；对于有硬性海外出货要求的订单，则通过海外工厂（泰国/越南）进行交付。目前一至三阶服务器产品的客户认证已基本全部结束，处于满产状态。 四、 高端PCB（1.6T/800G及AI算力板）技术壁垒与工艺升级 提问者：AI 时代的高阶PCB和光模块PCB在技术和制造工艺上有哪些核心难点？ 公司管理层：高阶PCB的制造难度与技术门槛正在呈指数级上升，行业未来三年的高端PCB产能（尤其是1.6T至3.2T光模块板、以及高阶AI算力板）将处于极其稀缺的状态。 光模块PCB的极端紧缺：高阶光模块（如1.6T、800G、400G）的PCB属于技术壁垒最高、难度最大的品类。公司目前的光模块PCB产能为2.5万平方米/月（占用其中一层楼），投产后产能已被两大核心客户（海外M客户以及国内光模块龙头新易盛）完全包下，其他客户想要拿货只能排队预定后续的新建产能。为此，公司计划在明年6月和年底各新增开辟一处产线来大幅扩充产能。 交换机板 VS 服务器板：真正代表最难技术的是交换机板（N+M+N或N+N多层HDI板），其制造难度远高于常规AI服务器板。 传统的服务器板通常只需一次压合、两次电镀，在32层、20:1深径比的情况下也是通孔设计。 而新一代的交换机/算力板需要N+M+N的多层HDI设计、3次压合、7次电镀。此外，两个子板压合在一起形成母板后，还要进行极为复杂的**背钻（Backdrill）**工艺，高阶母板的背钻加工甚至要连续钻上7天时间，整体生产周期长达7至8周（将近2个月），其复杂度已经非常接近半导体芯片制造。 直接贴装（CPO/光电共封装）与材料升级：未来的芯片架构（如英伟达GB200或更高阶芯片）更趋向于将芯片直接贴装在PCB上，或采用光电共封装（CPO）技术（将光模块/光引擎直接倒装在主板上）。这对PCB的平整度提出了极致的要求，必须确保在压合和陶瓷等复合工艺后不发生微小变形，以使信号干扰降到最低。 五、 供应链保障与关键设备锁单 提问者：原材料涨价以及高阶设备紧缺是否会制约公司的产能扩张与盈利能力？ 公司管理层： 高阶设备提前锁单：高阶PCB制造极度依赖进口设备（如日本和韩国的高端LDI激光成像和激光钻孔机/镭射机，且日韩设备厂扩产极慢）。公司凭借强大的前瞻性，已经全额拿到了2024至2027年三年的关键设备，并且在去年就提前锁定了2027和2028年更高级的高精度LDI（激光直接成像）设备。为了确保按期交付，公司管理层近期还亲自前往日本与核心镭射机供应商开会，确保设备供应不缺货。 核心原材料PTFE材料的技术突破：由于超高频高速度的需求，行业对极低损耗板材（如M7、M8等极低损耗高频材料）以及PTFE（聚四氟乙烯）等材料高度关注。PTFE的介电系数控制极难，多层板加工是一大挑战。公司拥有由美国名校毕业、行业绝对顶尖的博士专家团队，专注于PTFE核心板材的研发与工艺攻关，在此领域表现极佳，已取得关键性成功。 原材料供应与成本转嫁：作为PCB龙头企业，公司的采购体量巨大，核心材料供应商（前五大厂商）均会优先保障公司的AI高阶板材供应。由于AI产品线整体利润率高，即使材料出现一定幅度的涨价，供应链也具备充足的空间进行消化或将成本向下游转嫁。 六、 国内自主 AI 市场及客户格局 提问者：如何看待国内自主AI芯片的发展，以及公司的国内客户覆盖情况？ 公司管理层： 国内自主算力市场广阔：中国自主AI算力市场预计将占据全球30%至40%的份额，国内头部互联网及芯片厂商（如字节、阿里、海光、海思等）的芯片研发与流片需求在下半年出现了数倍的超预期增长，明年会更加稀缺。 国内芯片对PCB规格的代偿性提升：由于地缘和制造工艺限制，国内自研AI芯片相比海外顶尖芯片在单芯片性能上存在一定差距。为了弥补芯片层面的性能落后，国内芯片在系统设计时必须将PCB做得尺寸更大、层数更多、高阶HDI阶数更高，这进一步增加了高阶PCB的价值量与消耗量，对我们而言是明确的技术与订单利好。 七、 经营痛点与未来展望 提问者：目前最让您担心的环节是什么？对于AI泡沫担忧您怎么看？ 公司管理层： 最核心的瓶颈是人才，而非订单或泡沫：在手订单充足、厂房建设、设备锁单以及所谓的AI泡沫都不是问题。公司新投产的厂区需要约6000名员工，且全部定位做最顶尖的高端产品，高阶研发人才与熟练技术工程师的短缺才是最大的痛点。公司目前已招募了充足的博士和硕士生，且新招募的工程师和核心技术人员多为拥有多年行业一线大厂经验的骨干，以确保投产后良率能迅速达到并维持在95%以上的高水平（目前在M-S等高端车间，公司大规模采用了百级无尘室以及AI视觉检测设备来保障高良率）。 合理毛利率展望：在高速扩张和产能建设的过程中，公司凭借深厚的高端制造技术和精细化管理，能够始终将整体毛利率保持在非常健康和合理的水平，这与传统的走低端消费快板或IC载板的企业有本质的商业模式差异。 文字版： 国金证券主持：非常感谢大家的参会。非常荣幸今天有机会邀请到我们胜宏科技的董事长来参加我们的会议。需要特别提醒大家注意一下，因为公司在今天晚上收市后才会发布年报，所以在这个时间点交流非常难得。希望大家今天不要提问任何跟年报相关的敏感问题，要保护一下公司。明天上午公司还会有一场交流，到时候大家可以再去深入讨论关于年报及关联报告相关的问题。我们也不耽误大家的时间了，接下来就把时间交给各位做提问跟交流，大家有序举手提问发言就可以。我们现在就开始。 董事长（发言人）：各位投资者好，看到有好多熟悉的面孔，今天很高兴在北京参加国金证券主持的会议。我看今天参会的人还蛮多的，大家肯定对AI依然非常热爱和关注。对于我们这种全球龙头的PCB企业来讲，昨天晚上大家也可以看到全球AI龙头的财报出来以后，尤其是对2028年的明确展望，其实是给整个市场重新注入了一剂强心针。在此之前，前几个月大家可能看到有一些数据出来，觉得景气度是不是又回落了，信心可能有点不足。现在来看，对我个人和产业来讲，人工智能（AI）赛道是未来十年最确定、最黄金的赛道，几乎没有其他赛道可以媲美。一手投研资料加QQ：1490929960 很多去我们企业做过调研的投资者知道，我们的越南M-S厂区已经完成了并购并开始运营。从去年10月28日至今，我们真正运营了六个月。目前越南厂区处于高景气的“订单驱动”状态，公司直接把核心客户的认证转移至越南进行，规避了重新建厂和冗长认证的繁琐流程，这构成了公司非常好的时间与成本优势。在新厂区厂房设备的配置上，我们配备了真空压机、40:1的深径比电镀线等高规格设备。这些关键设备决定了高端产品的产能上限。我们说N+M+N的多层高阶HDI板，其产能有多大，完全是由设备能力和厂房工艺决定的。 我们新厂房的建设和装修速度比较快，设备安装也进行得非常顺利。关于产值，我们可以看下，我们原本的国内惠州老厂区大概具备100亿人民币左右的产值规模，而新规划建设的两栋厂房（新楼）总产值预计可超60亿人民币，其厂房和设备规模化建设预计到今年12月可以基本完成。 目前，不仅美国AI在高速发展，我们中国的AI也开始爆发。在去年我们负责国内AI业务时，我们原本做了一个比较保守的预测，但随着芯片流片之后，下半年客户给出的订单和需求量直接超出了我们数倍的增长。我们预计明年及未来，这部分高端PCB的需求会更加稀缺。国内也有几个芯片大厂，比如字节、阿里、海光、海思等。他们每年做多少芯片，相信大家都有数据。因为地缘和制造工艺等限制，国内自研AI芯片在单芯片性能上相比海外顶尖芯片存在一定差距。为了弥补芯片层面的不足，在系统设计时，国内芯片必须把对应的PCB尺寸做得更大、层数做得更多、高阶HDI的阶数也做得更高，来代偿芯片落后的问题。这对我们而言，带来了很大的PCB价值量和高阶设计订单的提升。 在整个算力服务器和交换机链条上，真正缺的是高端PCB。产能和技术是我们的核心优势，大客户资源也是优势，所以在未来三到五年，高端PCB非常看好。因为PCB的层数越多，技术制造难度呈指数级上升。我们可以算一下，以前服务器和交换机PCB平均层数只有十来层，需求量也只有现在的十分之一。而现在的AI服务器平均层数已经直接升级到30层以上。去年平均是20层，到了今年新一代架构落地后，已经全面升级到30层以上，这带来了极大的产能消耗和产值飞跃。而市场需求远远超出了大家之前的保守预测。 提问者（投资者）：关于越南M-S厂区，目前与核心大客户的供货协议、长协是怎样制定的？是否有预付定金或违约保障机制？ 董事长（发言人）：针对长协的具体细节和条款，因为涉及商务机密我不便细说，但实际上在行业内，谁跟谁预定了多少产能、锁定了多少订单，基本已经不是秘密，大家慢慢都会了解到。大客户在我们这里的订单比例始终是最高的。在高端产品交付上，如果我们没有这个技术或产能，也接不了这些订单。现在其实很多同行业有这个技术，但没有我们这么大的产能。我们的排产大概开到了70%到80%。 在高端PCB产品线中，高阶光模块（如1.6T、800G、400G）的PCB是技术壁垒最高、难度最大的。公司目前的光模块PCB产能为2.5万平方米/月，仅占了其中一层楼。但我们这部分产能投产后，就直接被两家核心客户完全包下了。这两家客户一个是海外M客户（微软），另一个是国内光模块龙头新易盛。现在其他客户想要货，完全没有多余的产能，只能排队预定我们后续的新建产能。公司目前在积极扩产，争取明年6月先开辟一处产线，明年年底再开辟一处产线来大幅扩产。 相比服务器板，真正代表最难技术的是交换机板（N+M+N或N+N的多层高阶HDI板）。传统的服务器板通常只需一次压合、两次电镀，在32层、20:1深径比的情况下也是通孔设计。而新一代交换机板需要N+M+N的多层HDI设计、3次压合、7次电镀。此外，两个子板压合在一起形成母板后，还要进行背钻（Backdrill）工艺，高阶母板的背钻加工甚至要连续钻上7天时间，整体生产周期长达7至8周（将近2个月），它的工艺复杂度已经非常接近半导体芯片制造了。 至于大家担心的AI泡沫，我是一点都不担心的，不担心订单，不担心建厂房，我最担心的实际上是人才。我们新厂区投产需要约6000名员工，且全部定位做最顶尖的高端产品。如果没有足够的高端人才、熟练技术工程师，根本无法维持生产。我们目前已经招募了充足的博士和硕士生。此外，我们新招的骨干技术人员和工程师大多是拥有行业知名大厂多年一线工作经验的熟练工，以确保投产后良率能够迅速爬坡，并维持在95%以上的高水平。在高端车间，我们大规模采用了百级无尘室以及AI视觉检测设备来保障高良率。 未来的芯片架构，比如新一代的GB200或者GB300芯片，更趋向于直接卖芯片、直接贴装到主板上，或者采用倒装光电共封装（CPO）技术（将光模块/光引擎直接倒装在主板上）。这对PCB主板的平整度提出了极致的要求。如果平整度做不好，芯片根本贴不上去。我们采用陶瓷等复合材料压合，压完以后不易发生微小变形，能够让信号干扰降到最低。我们在CPO和高平整度主板的研发上，目前是走在行业最前列的。 提问者（投资者）：关于设备和原材料，现在日韩高端设备比较紧张，且材料面临涨价，对公司的产能扩张和毛利率是否有影响？ 董事长（发言人）：设备方面我们非常安全。我们2024年拿到了2027年三年期的关键设备，基本上全部到手。并且在去年，我们就提前锁定了2027和2028年更高级的高精度LDI（激光直接成像）设备和激光钻孔机（镭射机）。因为高端设备基本来自日本和韩国，日韩设备厂扩产非常慢。我前天还在日本跟核心镭射机供应商开会，确保他们按时交付。所以未来两三年，我们在高端设备上完全没有瓶颈。一手投研资料加QQ：1490929960 材料方面，因为超高频高速度的需求，行业非常关注超低损耗板材（如M7、M8等极低损耗高频材料）以及PTFE（聚四氟乙烯）等材料。PTFE的介电系数控制极难，多层板加工极其困难。我们公司拥有由美国顶尖大学毕业的博士专家团队，他们是这个领域的绝对行业专家。公司在PTFE核心板材的工艺和研发攻关上表现优异，已经取得了关键的工艺成功。 同时，作为PCB的龙头企业，我们的采购体量极其庞大，前五大材料供应商都会优先保障公司AI高阶材料的供应。AI产品整体的获利和毛利润空间很大，即使材料涨价，我们也有充足的自主权和空间去消化，或者把成本向下游大客户转嫁。 另外关于产能调配：泰国厂区的成本确实相对较高。我们在生产和出货策略上是根据客户的硬性要求进行合理调配的。如果客户没有强制要求必须在海外生产，我们就会优先安排在国内生产以降低成本；对于有硬性海外出货要求的订单，则通过海外工厂（泰国/越南）进行交付。目前一至三阶服务器产品的客户认证已基本全部结束，处于满产状态。 谢谢大家！百闻不如一见，欢迎大家后续到我们胜宏科技厂区实地参观！", "status": "extracted"}, "post:2026-08-27T10-18:eec515d47064": {"id": "post:2026-08-27T10-18:eec515d47064", "kind": "post", "title": "2026-08-27 10:18", "source_label": "帖子正文", "excerpt": "【寒武纪】深度调整后的高赔率+高胜率 先说寒武纪两大市场认知差： ❌＃HBM备货不足导致Q2业绩低于预期？", "content": "【寒武纪】深度调整后的高赔率+高胜率 先说寒武纪两大市场认知差： ❌＃HBM备货不足导致Q2业绩低于预期？ 26Q2实现营收31.1亿，且净利率提升至41.7%，创历史新高。公司上半年交付确收的是590、580等产品，＃搭配HBM2e而非紧缺的HBM3。收入环比增速放缓的核心原因是690在Q3才开始出货，预测Q4有较高增速，而非上半年。 ❌＃国产AI芯片竞争格局恶化？ 寒武纪690产品处于国内绝对第一梯队，收入瓶颈主要是产能而非订单。对标寒武纪690的海光DCU4、沐曦C700等系列产品节奏基本预期在年底回片，明年下半年放量，＃因此寒武纪690产品至少领先友商“一年一代”的差距。 再看寒武纪供给侧两大预期差： ✔产能端：尽管明年国内N+2产能将持续紧缺，但是中芯华虹等厂商扩产速度不断超预期。作为中芯N+2产线前二大客户（目前单片wafer切12颗690），我们预计明年690月产能有望达？？颗（详情私聊）。且盛合晶微、通富微电等封测厂cowos-l/cowos-s产能能同步匹配。 ✔存货端：截至26Q2，公司预付款29.1亿元，较3月底增加了10.2亿元，存货82.5亿元，较3月底增加了37.5亿元。根据公告，＃寒武纪已向银行申请120亿授信额度（预计主要用于HBM3等产品的预付款），我们测算对应？？颗690的供给（详情私聊）。存货+预付款透露着公司晶圆、HBM等原料备货充足，为后续季度业绩高增打下基础。 此外，智谱发布GLM‑5.3‑Flash（Ox-Alpha，320B‑A18B），为GLM‑5系列首个原生多模态大模型。 内测阶段大规模流量全部跑在国产芯片集群，＃国产硬件上推理效率逼近英伟达GPU。 【下行空间】公司明年股权激励指引270亿收入，对应120亿利润（x50pe，6000亿），当前空间-10%。 【上行空间】代工、封测、HBM等条件符合假设情况下，明年有望700亿出货（非确收），对应300亿利润（x40pe，12000亿），当前空间+100%。 💌kydz#文字观点", "publish_time": "2026-08-27 10:18", "tags": ["文字观点"]}, "post:2026-08-27T09-44:551516441137": {"id": "post:2026-08-27T09-44:551516441137", "kind": "post", "title": "2026-08-27 09:44", "source_label": "帖子正文", "excerpt": "【东吴计算机】智谱上线 GLM-5.3-Flash：国产芯片承接前沿模型大规模推理流量 8 月 26 日晚，智谱上线并开源 GLM-5.3-Flash（原生多模态模型），即前期在 ", "content": "【东吴计算机】智谱上线 GLM-5.3-Flash：国产芯片承接前沿模型大规模推理流量 8 月 26 日晚，智谱上线并开源 GLM-5.3-Flash（原生多模态模型），即前期在 OpenRouter 匿名测试、调用量登顶的 Ox Alpha。模型为 320B 总参数、18B 激活的 MoE 架构，是 GLM-5 系列首个原生多模态版本，支持 1M 上下文，以 MIT 协议开源权重。我们认为其定位清晰，即以更低成本承接前沿能力：Artificial Analysis 综合智能指数 57 分，与 Claude Opus 4.8 持平，而定价仅为 GLM-5.3 的十分之一，限时折扣期内低至二十分之一。降本主要来自稀疏与线性注意力的混合架构，长上下文推理成本降至 GLM-5.3 的三分之一。 我们认为本次发布#对国产算力非常利好。智谱披露#匿名测试期间的全部推理流量由国产芯片集群承载，团队基于 SGLang 自建专用推理引擎，针对国产芯片显存与带宽短板，通过量化、分层部署、以计算换通信等方式优化，在同一硬件上实现端到端性能提升约 3 倍，单 token 成本已接近主流英伟达 GPU。这意味着国产算力的角色正在切换：从今年 2 月 GLM-5 时代的完成七大平台适配，推进至承接前沿模型的大规模真实生产流量，推理侧的经济性得到初步验证。#寒武纪、沐曦等多家厂商已宣布Day0适配 GLM-5.3-Flash #相关标的：寒武纪、海光信息、昇腾链（恒铭达、飞荣达等）、沐曦股份、天数智芯、中科曙光、紫光股份等#文字观点", "publish_time": "2026-08-27 09:44", "tags": ["文字观点"]}, "post:2026-08-27T10-17:c8c10b929f14": {"id": "post:2026-08-27T10-17:c8c10b929f14", "kind": "post", "title": "2026-08-27 10:17", "source_label": "帖子正文", "excerpt": "【浙商计算机】澜起率先试产CXL 3.2 MXC，已导入三星、SK海力士下一代产品 CXL 3.2：率先试产，最高支持64GT/s及DDR5-8000 澜起科技宣布率先在业界试产C", "content": "【浙商计算机】澜起率先试产CXL 3.2 MXC，已导入三星、SK海力士下一代产品 CXL 3.2：率先试产，最高支持64GT/s及DDR5-8000 澜起科技宣布率先在业界试产CXL 3.2内存扩展控制器（MXC）。新品基于PCIe 6.x及CXL 3.2协议设计，最高支持64GT/s，集成双DDR5内存控制器并支持DDR5-8000，面向AI、云计算及数据中心的内存扩展、内存池化和分层内存应用。 客户验证：已导入三星、SK海力士下一代CXL产品 公司披露，CXL 3.2 MXC已成功导入三星、SK海力士等主要内存模组厂商的下一代CXL产品，并完成初步验证，同时支持Intel Xeon、AMD EPYC等主流服务器平台。公司同步提供SDK及分析测试工具，支持客户进行兼容性验证及量产导入。 产品迭代：CXL持续升级，产业化进度推进 三星、SK海力士和美光均已缩减或取消自研CXL扩展控制器商业化计划，相关需求转向Montage（澜起科技）、Astera Labs等专业Fabless厂商。澜起于2022年全球首发CXL 2.0 MXC，2025年推出CXL 3.1 MXC，本次进一步迭代至CXL 3.2，并已进入三星、SK海力士下一代产品验证。 ?风险提示：下游需求不及预期；CXL产业化进度不及预期；客户验证及量产导入不及预期；行业竞争加剧；估值波动风险。#文字观点", "publish_time": "2026-08-27 10:17", "tags": ["文字观点"]}, "post:2026-08-27T09-59:f753bfdaf0e6": {"id": "post:2026-08-27T09-59:f753bfdaf0e6", "kind": "post", "title": "2026-08-27 09:59", "source_label": "帖子正文", "excerpt": "澜起科技，台积那边的片量出来了，很炸裂，qoq+150%， yoy+500%。", "content": "澜起科技，台积那边的片量出来了，很炸裂，qoq+150%， yoy+500%。8月份环比7月又增长了70-80%。#文字观点", "publish_time": "2026-08-27 09:59", "tags": ["文字观点"]}, "post:2026-08-27T14-35:35bd2df7d1f2": {"id": "post:2026-08-27T14-35:35bd2df7d1f2", "kind": "post", "title": "2026-08-27 14:35", "source_label": "帖子正文", "excerpt": "【存储芯片概念持续走高 德明利涨停】财联社8月27日电，临近尾盘，存储芯片概念持续走高，德明利涨停，此前大普微20cm涨停，恒烁股份、澜起科技、联芸科技、香农芯创、普冉股份、佰维存", "content": "【存储芯片概念持续走高 德明利涨停】财联社8月27日电，临近尾盘，存储芯片概念持续走高，德明利涨停，此前大普微20cm涨停，恒烁股份、澜起科技、联芸科技、香农芯创、普冉股份、佰维存储等多股涨超6%。消息面上，三星电子与SK海力士计划在今年下半年增加对英伟达的8层HBM4内存供应量。据了解，8层内存极有可能成为下一代HBM4E的旗舰产品。(来自财联社APP)#文字观点", "publish_time": "2026-08-27 14:35", "tags": ["文字观点"]}, "post:2026-08-27T23-38:e58885ef4a2e": {"id": "post:2026-08-27T23-38:e58885ef4a2e", "kind": "post", "title": "2026-08-27 23:38", "source_label": "帖子正文", "excerpt": "今晚主持胜宏科技业绩说明会后，有几个明确的感受跟大家分享： 1. Rubin 和 TPU 作为强驱动力，正在深刻影响 PCB 的产业性，无论是从规模还是技术", "content": "今晚主持胜宏科技业绩说明会后，有几个明确的感受跟大家分享： 1. Rubin 和 TPU 作为强驱动力，正在深刻影响 PCB 的产业性，无论是从规模还是技术； 2. 国产算力需求加速驱动 PCB 量价齐升的逻辑，并没有定价在主流 PCB 公司里； 3. 后续 PCB 产能为王的逻辑更加凸显，弹性要着眼于扩产力度和进度。 欢迎联系国联民生电子团队交流#文字观点", "publish_time": "2026-08-27 23:38", "tags": ["文字观点"]}, "post:2026-08-27T09-39:ccee560b9618": {"id": "post:2026-08-27T09-39:ccee560b9618", "kind": "post", "title": "2026-08-27 09:39", "source_label": "帖子正文", "excerpt": "【盛科通信】Q2收入加速，高端芯片突破进入量产交付2026H1公司实现营业收入6.71亿元，同比+32.04%", "content": "【盛科通信】Q2收入加速，高端芯片突破进入量产交付2026H1公司实现营业收入6.71亿元，同比+32.04%；归母净利润-0.18亿元，亏损同比收窄25.85%；扣非归母净利润-0.36亿元，亏损同比收窄42.33%；毛利率43.97%，同比-2.73pct。26Q2实现营业收入4.22亿元，同比+48.19%、环比+69.98%；#基本实现盈亏平衡，归母净利润亏损54万元，同比收窄93.68%、环比收窄96.85%；毛利率40.75%，同比-8.02pct、环比-8.70pct，我们判断#主要因为高速交换芯片开始出货，新客户新场景新产品下，价格策略、尚未规模效应等都对毛利率有一定影响，毛利率结构性稀释，但随着规模增长毛利率有望持续增长。H1交换芯片收入5.60亿元，同比约+52.34%；毛利率39.68%，同比+1.35pct，我们判断#公司高速芯片已进入批量交付，为Q2/H1收入增长的核心贡献，尤其25.6T上量迅速，结合此前公司公告#上调关联交易（同一股东下的渠道商）的额度从6亿元增加至22亿元，我们判断#高速交换芯片已完成重要导入、全面开启突破式增长阶段。H1交换芯片模组收入3705万元，同比约-38.92%，毛利率65.34%，同比+1.91pct；交换机收入6099万元，同比约+14.53%，毛利率59.99%，同比-0.73pct；定制化解决方案及其他收入740万元，同比约-54.18%，毛利率96.49%，同比+1.18pct，公司业务重心为交换芯片，加之上述业务规模尚小，容易受单笔业务影响产生波动。H1末存货5.52亿元，较年初增长47.39%，其中库存商品2.5亿元，委托加工物资2.4亿元；预付款2.99亿元，较年初增长37.39%，积极锁定产能保障交付。 ⭐️当前，国内超节点发展为交换市场打开新空间，而公司也实现在高速交换芯片领域的率先突破，叠加51.2T等新代际产品加速推进中，#有望开启在数据中心大时代新增长阶段。#文字观点", "publish_time": "2026-08-27 09:39", "tags": ["有望开启在数据中心大时代新增长阶段", "文字观点"]}, "post:2026-08-27T09-18:60c18854825d": {"id": "post:2026-08-27T09-18:60c18854825d", "kind": "post", "title": "2026-08-27 09:18", "source_label": "帖子正文", "excerpt": "视源股份2026年中报点评：Q2收入提速，部件新方向业务与教育AI持续增长#Q2收入增速提升，#主营盈利能力显著改善 公司26H1实现营收143.89亿元，同比+36.20%", "content": "视源股份2026年中报点评：Q2收入提速，部件新方向业务与教育AI持续增长#Q2收入增速提升，#主营盈利能力显著改善 公司26H1实现营收143.89亿元，同比+36.20%；归母净利润15.21亿元，同比+282.44%，其中公允价值变动收益为5.13亿元，主要受公司通过芯未来基金参投的联讯仪器上市影响；扣非归母净利润9.82亿元，同比+246.34%。Q2实现营收81.86亿元，同比+47.22%；归母及扣非归母净利润分别为12.74/7.92亿元，同比+440.45%/+341.60%。公司上半年综合毛利率同比提升3.19pct至23.71%，销售/管理/研发费用率分别同比下降0.95/0.30/1.26pct。#控制部件新方向快速规模化，#MAXHUB品牌出海SPESTECH工业控制保持高增 【1】智能控制部件：收入88.80亿元，同比+61.54%，毛利率同比提升7.56pct至21.57%。液晶显示主控板卡收入45.99亿元，同比+49.15%，主要受益于市场拓展及存储芯片等原材料价格变化；家用电器控制器收入16.77亿元，同比+29.07%；汽车电子收入9.09亿元，同比+371.48%；电力电子业务亦实现快速增长。 【2】智能终端及应用：收入52.50亿元，同比+8.47%，毛利率25.89%，同比下降0.65pct。 企业服务品牌收入17.14亿元，同比+38.43%，其中MAXHUB出海收入4.38亿元，同比+50.42%，主要由微软Teams Rooms认证产品推广、海外营销网络深化及本地化运营能力提升驱动 SPES TECH品牌作为英特尔钛金级合作伙伴，工控整机及板卡产品，已切入新能源、工业机器人、半导体等高景气行业保持快速增长；#教育AI加快规模化应用，#机器人商业化持续推进 截至2026年6月底，希沃课堂智能反馈系统已建成19个重点应用示范区，覆盖超7000所学校、3万间教室（#25H1仅覆盖3000所学校和7000间教室，#覆盖学校数和单校教室渗透率都在提升），希沃AI备课激活用户超过150万（2025H1超60万，2025年底超100万），教育AI应用范围进一步扩大。机器人方面，商用清洁机器人持续开拓欧洲、日韩市场，智能柔性机械臂加快商用及教育场景落地，并推出MAXHUB D3七轴仿人形双臂和具身操作算法平台，相关机器人产品商业化节奏加快、收入实现良好增长。#文字观点", "publish_time": "2026-08-27 09:18", "tags": ["文字观点"]}, "post:2026-08-27T23-38:3ad6696357f6": {"id": "post:2026-08-27T23-38:3ad6696357f6", "kind": "post", "title": "2026-08-27 23:38", "source_label": "帖子正文", "excerpt": "看好#智立方成为光通信和半导体领域的爆发增长大牛股，综合市值看600e。", "content": "领导好，#【智立方】公司半年报交流很超预期，下半年预计订单收入进一步加速，现更新估值：1.光芯片业务：独家卡位，50毛利。中国独供，已经突破aaoi。有望拿到lite订单。东山老板袁永刚前面打算28年规划年化10e颗，29年20e颗。此前讲的节奏是到26年底产能每个月0.22e颗。eml：cw=3:7的比例。按照28年规划，27年下订单，1e颗芯片需要智立方6000万设备。10e颗就要对应6e的收入，50%毛利率算30%净利率对应1.8e利润。这是东山一家的，可能也是扩产最多的。 索尔斯、源杰、长光华芯、光迅、三安光电、仕佳、海信、敏芯、中科光芯、光安伦、镭芯光电等等都在做。所以假设全行业扩产相当于3个东山，对应27年5.5e利润。28年翻倍11e利润。按照27年规划的利润，光芯片业务5.5e利润，给50xpe，250e市值。2.光模块自动化设备，竞争激烈一些，毛利率30-40%，净利率按照15%拍，现在有几千万的订单，今年3e（已经进入旭创，和coherent，剑桥，马上和新易盛签单，交期6个月），明年6e订单，这块27年1e利润，50e市值。3.与瑞士施耐博格合作研发了纳米/亚微米级精密运动系统，属于检量测设备、混合键和等设备中最核心的子系统。瑞士施耐博格是全球精密运动控制平台龙头，客户包括#KLA、AMAT、ASML、Onto等全球量检测龙头。智立方合资子公司深圳施耐博格，专门供应中国头部半导体公司，解决卡脖子问题，目前已进入#中科飞测、#埃芯半导体 等国内头部客户。该运动控制系统分不同型号，价值量中科飞测设备价值量#三分之一！低阶200万，高阶近千万。毛利率70%以上，净利率可达40-50%。中科飞测现在市值1300亿，这块给智立方150e市值。4.半导体高端分选机和倒装键合国产替代，研发完成，送样合肥。价格分别200、300万。固晶机已经批量出货（客户华润微、士兰微等），25年收入5000万，26年收入2e。50e市值。5.消费电子aoi检测设备，除苹果外，新进谷歌液冷散热1e，谷 03ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>英伟达业绩与展望全面超预期：FY27Q2营收962亿美元（同比+106%、环比+18%），Non-GAAP毛利率75%，首次给出FY28营收增长约70%的指引（无供应链限制约100%），且指引时间点早于市场预期；盘后十余家大行密集上调目标价，AI算力中长期景气判断被显著强化。\u003c/li>\n\u003cli>国产算力与存储链共振：智谱8月26日晚上线并开源GLM-5.3-Flash（320B-A18B原生多模态模型），加速AI普惠、驱动国产算力需求爆发；澜起科技率先试产CXL 3.2 MXC，大普微签订5.15亿美元企业级PCIe SSD订单，存储芯片概念尾盘持续走高，德明利涨停、大普微20cm涨停。\u003c/li>\n\u003cli>PCB/CCL/铜箔产业链多重边际变化：英伟达正评估在Rubin Ultra导入PTFE材料，产业验证已现积极进展，增量有望由PCB/覆铜板向铜箔、填料及压合设备扩散；ABF载板国产化（华为和alab的订单）带动ABF膜、BT载体铜箔国产化；铜冠铜箔H1归母净利同比+514.75%，HVLP铜箔量价逻辑打开估值空间。\u003c/li>\n\u003cli>中报业绩进入密集验证期且分化明显：雷赛智能Q2归母+92.5%、营收连续6个季度加速；成都先导H1归母+61.21%；华工科技H1归母+30.17%；奥特维Q2为2025年以来首个正增长季度；晶科能源H1归母净利-30.76亿元，显示各板块业绩分化。\u003c/li>\n\u003cli>宏观数据符合预期但通胀有粘性：美国7月核心PCE环比0.2%符合预期但高于前值0.1%，同比3.3%与前值持平；周三日间各类资产价格表现分化，有观点认为英伟达财报落地后中国AI供应链有望反弹。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>主线1：AI算力/大模型——英伟达指引重塑算力链长期预期\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：英伟达给出2028财年营收增长约70%指引，电话会核心转向整机架、网络、CPU、软件与\"AI工厂\"叙事；Vera Rubin；黄仁勋给予OpenAI、Anthropic强有力支持，安抚市场对ARR增速放缓与开源模型竞争的担忧；增长由OpenAI、Anthropic、SpaceXAI等Frontier Labs与AWS、Azure、GCP、OCI等Hyperscaler/Neocloud共同驱动，AWS已计划新增部署200万颗GPU。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：英伟达盘后股价涨超4%，纳指期货高开近1%，希捷科技、闪迪、美光科技盘后涨超3%，光通信板块同步走强；十余家大行密集上调英伟达目标价；电话会后27位买方投资者调研显示已在模型中录入FY28营收增长+64.3%。\u003c/li>\n\u003c/ul>\n\u003ch3>主线2：半导体/先进封装——国产算力与存储链共振\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：GLM-5.3-Flash（320B-A18B）以极高性价比加速AI普惠，国产芯片承接前沿模型大规模推理流量逻辑升温；寒武纪两大市场认知差被讨论，其一为\"HBM备货不足导致Q2业绩低于预期？\"；供应链物料紧+国产替代方向明确——HBM（长鑫）、先进制程（中芯/华虹）、Drmos（杰华特/芯朋微）、MLCC（三环）。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：智谱上线并开源GLM-5.3-Flash；澜起科技率先试产CXL 3.2 MXC（最高支持64GT/s及DDR5-8000），已导入三星、SK海力士下一代产品；大普微获5.15亿美元企业级PCIe SSD订单；正帆科技新接订单翻倍以上、静待盈利拐点出现；存储芯片概念尾盘走高，德明利涨停。\u003c/li>\n\u003c/ul>\n\u003ch3>主线3：半导体/先进封装——国产算力与存储链共振（备选补充）\u003c/h3>\n\u003cul>\n\u003cli>注：本主线的PCB/CCL细分展开见主线4，光通信细分展开见主线5；若需合并，当前最强子方向为存储链（CXL试产+大普微订单+存储板块涨停潮）。\u003c/li>\n\u003c/ul>\n\u003ch3>主线4：PCB/CCL/铜箔——AI材料增量向纵深扩散\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：英伟达FY28指引强化AI PCB产业链景气判断；英伟达正评估在Rubin Ultra导入PTFE材料，增量有望由PCB/覆铜板向铜箔、填料及压合设备扩散；PCB全产业链处于差异化竞争阶段，光载板（BT、ABF）、MSAP、大HDI、PTFE多路线并进；ABF载板国产化（华为和alab的订单）带动ABF膜、BT载体铜箔国产化；M8~M9级碳氢树脂、化学法硅微粉价值量显著增长，扩产集中于核心龙头。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：铜冠铜箔H1归母净利2.15亿元（同比+514.75%）、扣非净利2.07亿元（同比+754.21%）；台湾覆铜板公司台光电子、台耀、联茂7月营收同比分别增长约129%、122%和14%；建滔集团获老板首次增持，方向意义被关注；电子布设备国产化比市场想象的难，E布里7628也需改造。\u003c/li>\n\u003c/ul>\n\u003ch3>主线5：光通信/CPO——订单结构向CPO/NPO切换预期升温\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：罗博特科调研显示今年以光模块OCS订单为主，预计2027年以CPO/NPO为主；NPO/CPO/OCS/光模块等在手订单24.5亿元、毛利率42.9%、现金流大幅转正，子公司翔通光科技业绩同比翻番；近期旭创入股专注光模块内部散热的中石科技，体现光模块厂商对散热环节重视度持续提升，内部散热与外部散热为配套关系。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：华工科技2026H1海外营收高增、海外产能建设持续加大；中航光电26Q2归母净利7.21亿元，毛利率逐季改善至26Q2的29.36%；罗博特科调研由美银组织，参与方包括2家主权财富基金、10家全球资管巨头、16家对冲基金。\u003c/li>\n\u003c/ul>\n\u003ch3>主线6：新能源/汽车——固态电池政策加码，中报业绩验证分化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：上海\"十五五\"规划提出推进建设固态电池等多元技术路线对比测试示范基地，布局万千瓦级独立储能示范电站，重点发展全固态电池、液流电池、高性能钠离子电池、大规模先进压缩空气储能。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：晶科能源Q2储能确收接近翻倍、但H1归母净利-30.76亿元；奥特维Q2为2025年以来首个正增长季度；新洁能2Q26收入同比+35.3%至6.50亿元，管理层积极看待景气上行延续；爱玛科技H1业绩承压但二季度起边际改善。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>英伟达业绩落地：FY27Q2营收962亿美元（同比+106%、环比+18%）、Non-GAAP毛利率75%，首次给出FY28营收增长约70%指引（无供应链限制约100%）；Vera Rubin；同时有消息称英伟达正在洽谈以超130亿美元收购Hugging Face。\u003c/li>\n\u003cli>智谱上线并开源GLM-5.3-Flash（320B-A18B原生多模态模型）。\u003c/li>\n\u003cli>存储链走强：澜起科技率先试产CXL 3.2 MXC；大普微5.15亿美元订单披露；尾盘德明利涨停、大普微20cm涨停。\u003c/li>\n\u003cli>特朗普签署行政令，禁止部分外国设备进入美国电网，被交易台视为隔夜利空消息。\u003c/li>\n\u003cli>上海\"十五五\"规划提出推进固态电池等多元技术路线对比测试示范基地、布局万千瓦级独立储能示范电站。\u003c/li>\n\u003cli>中报密集披露：铜冠铜箔、雷赛智能、华工科技、晶科能源、盾安环境、新洁能、安踏体育、中国重汽A、成都先导、翰森、华东医药等；艾森股份、奥特维、爱玛科技、铂科新材、胜宏科技、安恒信息、爱博医疗等召开中报电话会/业绩交流会。\u003c/li>\n\u003cli>罗博特科调研纪要发布：在手订单24.5亿元、毛利率42.9%，今年以OCS订单为主、2027年预计以CPO/NPO为主。\u003c/li>\n\u003cli>长源东谷首次披露燃机订单，已签署海外销售合同1.65亿美元，约定2026年12月开始交货；液冷散热类产品订单翻番增长。\u003c/li>\n\u003cli>盘后消息：十余家大行密集上调英伟达目标价；9月光纤光缆招标、9月9-11日深圳光博会；Google液冷链条即将从验证进入订单。\u003c/li>\n\u003cli>当日复盘热点方向集中在存储、PCB/PTFE、光纤/光通信、液冷等；1-7月全国规模以上工业企业利润增长17.6%。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>英伟达供应链限制缓解进度与FY28（约2027日历年）增长的兑现度，无供应链限制下+100%的潜在弹性。\u003c/li>\n\u003cli>英伟达Rubin Ultra导入PTFE材料的产业验证进展，以及增量向铜箔、填料及压合设备扩散的订单信号。\u003c/li>\n\u003cli>CXL 3.2 MXC在三星、SK海力士下一代产品中的导入节奏；大普微5.15亿美元订单交付进度及企业级SSD景气延续性。\u003c/li>\n\u003cli>ABF载板国产化订单落地（华为和alab的订单），ABF膜与BT载体铜箔国产化进度。\u003c/li>\n\u003cli>光模块散热产业链变化（旭创入股中石科技后续）；OCS订单向CPO/NPO切换节奏（预计2027年）。\u003c/li>\n\u003cli>Google液冷链条从验证进入订单的进度；9月光纤光缆招标及9月9-11日深圳光博会的产业信号。\u003c/li>\n\u003cli>中报电话会后续指引：正帆科技利润拐点何时出现、奥特维正增长延续性、医药公司创新药放量数据（成都先导、翰森、康弘药业研发投入同比+30.7%等）。\u003c/li>\n\u003cli>美国核心PCE数据后美联储路径及美债、美元表现；英伟达财报落地后中国AI供应链反弹预期能否兑现。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>07:56｜【石四药集团-2026H1简评】：输液H1/Q2同比环比双改善，非输液环比转正，利润增速跑赢收入业绩：公司2026H1营业收入23.61亿港元（同比+9.9%），归母净利润3.20亿港元（同比+13.0%），毛利率41.2%（同比-0.3pcts），净利率13.6%（同比+0.4pcts）。输液板块：2026H1销售量8.68亿瓶（袋）（同比+21.4%），销售额14.87亿港元（同比+24.0%），毛利率46.2%（同比+1.4pct\u003c/li>\n\u003cli>07:56｜【天风医药】京新药业：2026H1地达西尼放量符合预期，利润端短期有所扰动 2026H1公司实现营业收入19.87亿元，同比下降1.46%；归母净利润3.52亿元，同比下降9.35%\u003c/li>\n\u003cli>07:56｜【翰森】中报业绩总结： 【业绩表现】1H26公司实现收入83.04亿元，同比增长11.7%；创新药及合作产品收入70.92亿元，同比增长15.4%，收入占比提升至85.4%，其中创新药产品销售收入增长21.6%。\u003c/li>\n\u003cli>07:56｜【兴证医药】圣湘生物2026年中报整理 🔥中报电话会议 📅参会时间：8月27日（周四）14:30 ☎️电话参会：+86-4001888938 🔑参会密码：886391如需外呼，请联系对口销售或研究员2026年上半年，公司实现营业收入8.34亿元，同比-3.95%；归母净利润0.98亿元，同比-39.76%\u003c/li>\n\u003cli>07:57｜【长江电新】晶科能源：Q2储能确收接近翻倍，高效TOPCon产能规模行业领先 事件：晶科能源发布2026年半年报，2026H1公司实现收入247.27亿元，同比下降22%；归母净利-30.76亿元\u003c/li>\n\u003cli>07:57｜华东医药2026年半年报信息梳理2026H1公司实现营业收入220.67亿元（同比+1.81%）；实现归母净利润18.61亿元（同比+2.53%）\u003c/li>\n\u003cli>07:57｜【天风医药杨松
