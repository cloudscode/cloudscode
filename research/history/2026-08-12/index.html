files/Token指数级增长-国产算力进入爆发期20260811.pdf": {"id": "attachment:files/Token指数级增长-国产算力进入爆发期20260811.pdf", "kind": "attachment", "title": "Token指数级增长-国产算力进入爆发期20260811", "source_label": "Token指数级增长", "excerpt": "电子行业研究框架 20260810 要点总结 1.行业主线与核心逻辑 2026 年电子行业全年主线围绕两大方向： AI 技术创新 与国产自主可控 ，两条主线存在交叉，自主 可控亦由 AI 产业发展所带动。AI 产业趋势已从训练为主转向推理侧权重更大，硬件投资机会发生结构性变化", "content": "电子行业研究框架 20260810 要点总结 1.行业主线与核心逻辑 2026 年电子行业全年主线围绕两大方向： AI 技术创新 与国产自主可控 ，两条主线存在交叉，自主 可控亦由 AI 产业发展所带动。 AI 产业趋势已从训练为主转向推理侧权重更大，硬件投资机会发生结构性变化；当前正进一步向 Agent（智能体）时代 迭代，将大语言模型从对话工具升级为任务执行引擎，推理转化为分布式多 步骤流程，带来硬件架构升级。 2.“纯算电联”四大维度投资框架 存（存储） ：推理时代对“纯算电联”四大维度提出均衡且更苛刻的要求，存储带宽与容量成为首 要瓶颈。HBM 成为决定推理性能的关键组件，其在 AI 芯片组件总支出中的占比已 超过 50% 。海外 以海力士、三星、美光为主，国内厂商围绕 HBM 迭代升级，国产化率快速上行。 算（算力芯片） ：推理时代算力架构正从 GPU 转向 GPU+ASIC 混合计算 架构。ASIC 针对特定模 型架构优化，在能效比和单位推理成本上具备显著优势。海外代表包括谷歌 TPU、亚马逊 Trainium 系列及 Meta 自研芯片等，ASIC 芯片市场规模高速增长。 电（电力与散热） ：AI 推理基础设施电力需求呈指数级增长，英伟达从 A 系列到 S 系列、Rubin 再 到 Feynman 系列，电力需求快速提升。配套功率、模拟、第三代半导体器件趋势向上；散热技术 从风冷向液冷升级，液冷正从可选项变为必选项。英飞凌分享服务器主板向 HVDC 数据中心架构过 渡，路径可为 800V 转 12V 或 800V 转 50V/6V，其中使用大量三代半芯片。 连（网络互联） ：AI 集群规模从数千卡扩展至数万甚至数十万卡，网络互联成为制约整体性能的关 键。传统可插拔光模块在带宽密度、功耗、延迟方面难以满足下一代 AI 基础设施需求， CPO（共 封装光学） 技术应运而生，显著缩短电信号传输距离，降低功耗 30%–50%并提升带宽密度。PCB 方面，2025 年全球市场规模约 800 亿美金 ，2026 年预计达 900 多亿美金 ，服务器/数据存储 PCB 需求将大幅增长，HDI 在服务器数据中心占比将从 3%左右提升至 2030 年的接近 30% 。 3.Agent 时代与 CPU 产业链 Agent 时代需要上下文处理和多步骤任务执行，CPU 算力正从配角转变为核心角色，成为维持系统 吞吐量和整体成本的关键因素。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª AMD 预计服务器 CPU 市场总规模以每年 超过 35% 的速度增长，整体市场规模有望达到 1500 亿 美金甚至更多 （当前仅数百亿美金量级）。 CPU 产业链相关方向值得重点关注。 4.AI 产业趋势下的 A 股重点公司梳理 存：相关存储/HBM 产业链公司。 算：国内 ASIC 芯片龙头，包括昇腾、寒武纪、昆仑芯、海博等。 电：功率领域关注斯达半导（原文“清洁能”疑为口误，结合上下文应为斯达半导或类似功率龙 头）；模拟关注圣邦股份；三代半关注天岳先进等。 连：光模块之外，PCB 关注沪电股份（原文“互变酸奶”疑为口误）、上游生益科技（原文“蜂蜜 新生”疑为口误）等。 CPU：关注澜起科技（原文“蓝旗”疑为口误）、海光信息，以及 CPU 封测环节的通富微电等。 5.半导体自主可控与国产替代 全球存储与先进制程产能紧缺，扩产共振；国内存储扩产逻辑未来几年持续加速向上。预计未来 2– 3 年全球资本开支增速 20%–30% ，国内增速 40%–50% 。 国内存储产线（如长江存储、长鑫存储）国产化比例持续提升，先进制程（中芯国际、华虹）国产 化比例有序提升。设备厂订单既受益行业贝塔增长，又受益国产化率提升的阿尔法，部分设备公司 订单增速可达 60%–70%甚至更高 。代表性公司：中微公司、北方华创（原文“飞车”疑为口 误）、拓荆科技、芯源微、盛美上海（原文“巴萨金科”疑为口误）等。 零部件 ：全球零部件厂商处于供不应求状态，国内零部件厂商扩产更积极灵活，三重受益（设备厂 订单增长、海外零部件交付不足带来的国产替代、海外设备厂主动寻求国内零部件供应），订单增 速可观。代表性公司：富创精密、江丰电子（原文“江峰”疑为口误）、正帆科技（原文“郑帆” 疑为口误）、神工股份等。 材料：随着晶圆产能落地，材料需求持续向上，未来几年需求确定性强。代表性公司包括安集科 技、鼎龙股份、兴发集团（原文“新娘”疑为口误）、江丰电子、雅克科技（原文“广告”疑为口 误）等。 6.晶圆制造与先进封测 国产算力大爆发背景下，上游晶圆制造产能与先进封测产能成为关键瓶颈。 今明两年决定国内算力 芯片的不是需求，更多是供给 。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 国内晶圆代工龙头（中芯国际、华虹）今年将实现良率改善、产能提升和工艺优化，产能有望大幅 改善。 先进封测（2.5D CoWoS、3D HBM 堆叠封装）已成为 AI 算力芯片成本端重要组成部分，今明两 年严重供不应求，国内厂商积极扩产将持续受益。相关公司：长电科技、通富微电、甬矽电子（原 文“永西”疑为口误），配套设备公司如长川科技、华峰测控（原文“华丰”疑为口误）、金海 通，第三方测试伟测科技等。 算力芯片公司 ：国产算力芯片处于严重供不应求状态，能够在上游资源/产能端获得确定性保障的公 司成长确定性更强。关注华为昇腾产业链、寒武纪及二线算力芯片公司。 7.消费电子与端侧 AI AI 持续向端侧延伸，苹果作为 AI 端侧代表性企业，进入“硬件优先+工程主导设计”的新时代。硬 件创新带动单机零部件 ASP 提升，供应链固定资产投入与设备采购周期加速，产线改造、模具更新 和新工艺导入频率提升，利好上游设备厂商。 除苹果外，AIPC、AI 手机、AI 眼镜等端侧方向亦值得持续关注，配套消费电子龙头和端侧单机价 值量提升机会值得重视。 问答整理 Q1：当前市场对存储方向存在分歧，如何看待？ 答：近期市场对存储的分歧更多体现在价格层面，即认为价格已处于较高水平、担心反噬需求，而非需 求端出现问题或供需格局逆转。推理侧在产业中的权重快速提升，对“纯算电联”提出均衡且苛刻的要 求，存储带宽和容量是托底推理性能的首要瓶颈，HBM 在 AI 芯片组件总支出中占比已超过 50%，存 储需求的基本面依然扎实。 Q2：国内半导体设备、零部件、材料公司的成长逻辑是什么？ 答：全球存储和先进制程扩产共振，国内扩产增速更快（国内资本开支增速 40%–50%，全球 20%– 30%）。国内存储产线和先进制程的国产化比例持续提升，设备厂订单既受益行业贝塔又受益国产化阿 尔法，部分公司订单增速可达 60%–70%甚至更高。零部件方面，全球零部件供不应求，国内厂商扩产 更积极灵活，三重受益（设备厂订单增长、海外交付不足带来的替代机会、海外设备厂主动寻求国内供 应）。材料方面，随着晶圆产能落地，需求持续向上，未来几年确定性很强。 Q3：国内先进封测在 AI 算力芯片中的重要性如何？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 答：过去市场认为先进封测在产业链中占比不高，但在 AI 算力芯片领域，2.5D CoWoS 和 3D HBM 堆叠封装已成为成本端非常重要的组成部分。今明两年这两个领域严重供不应求，国内厂商积极扩产将 持续受益，相关封测公司及配套设备、测试公司均值得重点关注。 Q4：国内算力芯片公司的投资逻辑是什么？ 答：国产算力芯片处于严重供不应求状态，今明两年决定国内算力芯片的不是需求而是供给。能够在上 游晶圆制造和先进封测产能方面获得确定性保障的公司，成长确定性更强。关注华为昇腾产业链、寒武 纪以及二线算力芯片公司。 Q5：如何看待苹果产业链在 AI 端侧的投资机会？ 答：苹果作为 AI 端侧最具代表性的企业，已进入“硬件优先+工程主导设计”的新时代。硬件创新带 动单机零部件 ASP 提升，供应链固定资产投入与设备采购周期加速，产线改造、模具更新和新工艺导 入频率提升，对上游设备厂商需求增加。果链作为 AI 端侧重要主体，未来值得重点关注。此外， AIPC、AI 手机、AI 眼镜等端侧方向也在持续发展，配套消费电子龙头和单机价值量提升机会同样值得 关注。 原文 电子 研究框架 20260810_原文 2026 年 08 月 12 日 发言人 应该这么说，全年的话我们认为电子行业的一个主线还是围绕两个方向。一个是 AI 技术创新，另外一 个就是国产自主可控，两个方向去这个是主线。当然的话这两个主线其实也是有交叉的。因为你自主可 控也是围绕 AI 相关的这个产业的一个发展，去带动的国产自主可控方向的这样的一个机会哈 chment", "title": "半导体设备与核心零部件闭门研讨会全文总结20260810", "source_label": "其他", "excerpt": "【摘要】： 零部件投资逻辑核心预期差：设备订单落到零部件端时，会同时形成生产物料、库存修复和装机后服务备件三类需求；再叠加国产替代与海外寻源，零部件订单增速可能高于设备整机。", "content": "【摘要】： 零部件投资逻辑核心预期差：设备订单落到零部件端时，会同时形成生产物料、库存修复和装机后服务备件三类需求；再叠加国产替代与海外寻源，零部件订单增速可能高于设备整机。零部件约占整机成本四成，也意味着这种放大对应的价值量并不小。重资产属性又让产能利用率上升时利润弹性更大，因此机构交流会议中有人用“设备的三倍弹性”作形象比喻。 一张桌子旁坐着前道设备、后道封装、晶圆制造、陶瓷、机械手、传感器、精密加工、材料、检测、投资研究与产业服务等不同环节的从业者。讨论从一个万亿美元级的问题开始：AI 资本开支持续上行，最后会变成谁的订单？ 四个多小时后，答案逐渐从“哪种设备增长最快”，收束到一个更朴素、也更残酷的判断： 半导体设备已经不缺增长故事，真正稀缺的是交付能力。AI 的下一道瓶颈可能不再只是 GPU 数量和存储容量，而会落到一名需要五年培养的火工、一只必须稳定运行十年的晶圆机械手、一台迟迟到不了货的精密机床，甚至一滴无法通过逆向工程复制的材料添加剂上。 这就是近日半导体设备与核心部件闭门研讨留给行业最值得记住的结论。 本文根据现场记录整理，并依守则作匿名转述，不将任何信息与具体发言者及其所在机构关联；纪要涉及估算和前瞻判断的数据均为研究性口径，不构成投资建议。 一张桌子，为什么能看见整条产业链 半导体设备不是一个只看公司经营数字就能理解的行业。晶圆厂公布资本开支，设备公司披露订单，真正影响交付的却可能是更上游一只阀门、一块陶瓷、一套射频电源、一个 MFC，或一个没有出现在任何上市公司公告里的材料配方。只有把下游需求、制造工艺、设备整机和核心部件放在同一张桌子上，才能看见订单如何传导，又在哪里被截断。 这场闭门会的参会者覆盖前道设备、后道封装、激光加工、晶圆制造、先进封装、陶瓷、机械手、传感器、真空器件、气体控制、精密结构件、复合材料、表面处理、第三方检测、芯片设计服务与产业研究等环节。有人正为订单暴增而招聘工程师，有人正在向日本客户报价，有人负责国产设备导入，有人长期拆解海外设备的可靠性，也有人从资本市场追踪全球存储厂和设备龙头。 正式讨论之前，每个人回答三个问题：你是谁、你能提供什么、你希望得到什么。这个环节看似普通，却建立了一张真实的供需地图。后来每一个宏观判断，都能迅速找到产业端验证： · 说设备订单高增长，设备企业拿出招聘和框架协议的变化； · 说零部件会短缺，供应商拿出交期从三个月变六个月的例子； · 说国产替代加速，企业讲到海外客户从拒绝接待转为主动询价； · 说先进封装是终局，工程人士立即追问翘曲、散热与可靠性； · 说国产设备空间大，老设备人则用二手机残值和服务人数提醒大家，空间不等于能力。 四小时的讨论由此形成三个层次：先看总量，再拆结构，最后追到最上游零部件。最有价值的地方，不是所有人观点一致，而是乐观判断每向前走一步，都会被工程问题重新校准。 核心结论速览 1. 设备景气已从预测进入交付验证。订单、招聘、长期框架、交期和补库同时变化，比单一市场预测更能说明周期位置。 2. 未来三年是多数人能看清的窗口。2026—2028 年设备与零部件需求可见度较高，但先进设备和核心部件的能力建设仍要用五年、十年尺度衡量。 3. 存储是最大的总量驱动。HBM、DRAM 与 3D NAND 同时受益于 AI；层数和结构升级又提高沉积、刻蚀、量测、减薄与键合的设备强度。 4. 先进逻辑提供高价值量。2nm、GAA、背面供电和新材料继续推高单位产能投资，先进制程不会被封装替代。 5. 先进封装是第二条性能路线。当单颗芯片碰到成本和面积边界，Chiplet 与 3D 堆叠接棒；对中国而言，这条路线还承担在极致微缩受限时继续提升系统性能的战略任务。 6. 混合键合方向确定，节奏由工程决定。良率、热、翘曲、材料应力、检测和长期可靠性，会决定从样机到量产需要多久。 7. 量检测是复杂工艺的放大器。工序越多、失败成本越高，过程控制越重要；把检测反馈从周/月压缩到小时，可以显著缩短研发周期。 8. 成熟制程正在区域分化。国内凭成本、本地化和订单回流先进入高稼动，海外可能随后改善；但没有客户绑定的重复建设仍有风险。 9. 零部件叠加四重逻辑。设备订单、补库存、国产替代和海外寻源同时发生，需求弹性可能高于整机，产能却更难扩。现场同时提出，海外职业经理人主导的设备企业更倾向分批扩产，这给创始团队主导、决策链更短的国内厂商留下了抢占产能窗口的机会。 10. 最硬的瓶颈是人、材料和时间。火工、精密机加工、热处理、润滑与添加剂等，不会因为资本开支上升就立刻增加。 11. 国产替代正在从备份转向主供。客户主动验证、设备厂参股孵化、海外客户来华寻源，说明本土供应链角色正在改变。 12. 出海不是拿到询价，而是建立全球服务。一致性、备件、现场工程、合规和知识产权，是国际化的真正门槛。 13. 行业红利不会平均分。平台、客户、数据、可靠性和服务形成强者恒强；新公司要靠新工艺或严重短缺环节才能打开窗口。 14. 乐观应当带着验证清单。订单是否取消、交期是否回落、库存是否上升、量产是否延迟、云厂是否下调资本开支，都是比情绪更重要的反转信号。 01 需求正在上升，谁交得出来 半导体设备市场已经经历了一轮密集的预期上修。云厂商继续提高 AI 基础设施资本开支，GPU、定制芯片与存储需求向晶圆厂传导，全球晶圆制造设备的预测中枢持续上移。这条增长链可以概括为： AI 资本开支增长，带动算力芯片与存储芯片销售；晶圆厂利润与利用率改善，推动资本开支；资本开支转化为设备采购；设备订单再向陶瓷、真空、射频电源、机械手、气体控制、精密结构件和材料等上游传递。 现场没有停留在宏观模型上。多家产业链企业给出的信号是：从 2025 年四季度开始，订单出现明显加速。此前设备厂还在去库存、控制招聘，如今需要同时补人、补零部件、补安全库存。有客户开始签量很大的长期框架，设备公司拿到订单后的第一反应却是“现有能力交不出来”，只能把交付拆到更长时间。 这意味着行业的主要矛盾正在变化。 过去两年，企业担心的是“有没有需求”；现在担心的是“有没有人来装机、有没有核心件可以组装、供应商能不能按期扩产”。当需求从缓慢复苏切换到集中放量，设备整机的产能弹性相对更快，零部件与材料反而更容易成为硬约束。 现场一组粗略测算认为，全球半导体设备市场可能在三年内从约 1 万亿元人民币量级走向约 2 万亿元。若零部件占设备价值量约四成，新增市场对应的上游增量非常可观。数字可以争论，趋势却已在微观订单里发生：海外零部件交期拉长，设备厂开始放弃年降要求，过去减少中国供应商的海外客户也重新主动找上门。 扩产的两个现实挑战：人，以及被放大的零部件需求 第一个挑战是人。设备订单落地以后，需要同步增加研发、生产、安装、调试和售后人员。现场嘉宾估算，若要充分支撑现有订单，部分设备公司的人员规模未来几年可能需要每年增长 50% 以上。这是现场压力测试口径，并非所有公司的正式招聘指引；它想说明的是，订单可以按季度跳升，成熟工程师却需要招聘、培训、认证和现场磨合，无法同比例快速复制。 中国的人才供给相对更充分，企业的招聘和调动速度也更快；海外设备公司还面临工程师老龄化、年轻人补充不足和跨地区服务成本较高等问题，人力短缺可能更加严重。设备厂即使能够扩建厂房、增加装配工位，也未必能在同一时间获得足够多可以独立进场的工程师。 第二个挑战是零部件库存。过去几年行业不够火热、订单较少，设备公司持续去库存，尤其压缩零部件库存。新订单到来后，它们不仅要采购生产新设备所需的零部件，还要恢复安全库存，并为设备交付后的更换、维修和现场服务准备备件。 因此，设备订单并不是按照一比一的比例传给零部件企业，而是要经过“生产需求＋库存修复＋装机后服务备件”的放大。现场以零部件约占整机成本 40% 作为粗略锚点，认为零部件企业的收入增速可能高于设备整机。不过，实际放大幅度仍取决于设备类型、库存水位、装机基数和备件策略，不能把 40% 简单理解成固定利润或固定增速。 从预测到交付，行业经历了四次切换 第一，从库存周期切换到资本开支周期。2024—2025 年，设备厂仍在控制库存、招聘和费用；进入 2025 年四季度后，客户下单明显加快，行业不再只是消化旧库存，而是在准备新产能。 第二，从单笔订单切换到长期框架。当存储客户把未来数年的需求一次性框定，设备厂获得了更长能见度，也暴露出自身产能与人员不足。框架协议不是立即确认的收入，却是供应链开始提前占产能的信号。 第三，从采购压价切换到交付优先。过去客户强调年降，现在部分客户开始接受不降价，只要按时供货。价格仍然重要，但在供给紧张期，交期和稳定性暂时排到了前面。 第四，从去中国供应链切换到全球主动寻源。一些海外设备商原本希望减少中国供应商，如今因为本地人力、机加工和零部件产能不足，重新来中国寻找可以供往海外的产能。这个变化或许比任何情绪指标都更能说明供需。 海外设备厂为什么会主动把扩产速度放慢 现场有嘉宾提出一个容易被忽略的解释：海外设备厂扩产偏慢，不一定是没有看见需求，也不只是组织反应迟缓，而可能与职业经理人主导的治理结构有关。设备产能具有重资产、长周期和不可逆的特点，一旦行业需求回落，新增产线没有订单，扩产决策就会直接变成管理层需要承担的失误。 另一方面，职业经理人通常按年度业绩和相对有限的任期接受考核。如果在景气第一年一次性释放全部产能，未来几年就很难持续呈现稳定增长；更符合个人激励的做法，往往是分阶段投资、控制扩产斜率，把订单与利润逐年兑现。换句话说，海外厂商并非看不到机会，而是在主动保留安全垫和未来的业绩空间。 这恰好给国内设备厂留下了窗口。许多国内设备企业仍由创始团队主导，创始人的持股、声誉和企业长期生存高度绑定，决策周期可以跨越单个财年。面对确定性较高的客户需求，它们往往更愿意提前招人、锁定零部件、扩充装配与服务能力，承受短期利用率波动，以更快交付换取市场份额。当然，这种优势成立的前提不是盲目扩产，而是订单能见度、质量体系和长期可靠性能够同步跟上。 为什么订单会呈现“前低后高” 设备订单确认到收入需要经过采购、装配、测试、发运、进厂、安装和验收。客户洁净室没有 ready，设备就不能进场；核心件没有到，整机也不能装完。即使全年订单很高，收入也可能集中在下半年或下一年。 这会制造两种误判。资本市场可能因为上半年收入没有同步增长，怀疑订单真实性；企业也可能因为短期交付拥堵，误以为可以无限涨价。真正合理的观察方式，是把订单、合同负债、库存、发出商品、招聘、零部件交期和验收节奏放在一起看，而不是只盯单季收入。 02 为什么这一次不只是“周期反弹” 半导体设备过去长期随消费电子和库存周期波动。这一次更复杂，因为它同时由需求扩张和技术换代驱动。 一方面，AI 对算力、存储和互联的需求仍在快速增长。现场有观点把这称作“长鞭效应”：最下游云厂商的资本开支，经过芯片、晶圆制造和封装层层放大，最后落到设备与零部件。只要 AI 基础设施的投入回报仍然成立，上游就会持续获得订单。 另一方面，单位晶圆需要的设备步骤正在增加。先进制程进入 2nm/GAA，晶体管结构、材料、背面供电与互联复杂度提升；DRAM、HBM 和 3D NAND 不断增加层数；大芯片碰到光罩、功耗与成本边界后，性能接力棒开始交给 Chiplet、2.5D/3D 封装和系统级协同。 传统摩尔定律是把晶体管做得更小，系统级创新则是在芯片、存储、封装、互联、电源与散热之间重新分配任务。对设备行业来说，每一次系统创新往往都以新增工序为代价：更多沉积、更多刻蚀、更多清洗、更多检测、更多键合、更多减薄和更多高精度搬运。 所以，这一轮景气不能只用“晶圆厂扩了多少片产能”来解释，还要看每片晶圆需要多少道工艺、多少次检测、多少种新材料。需求数量和工艺强度同时上升，是它与传统库存反弹最大的区别。 AI 长鞭效应：一美元如何走到设备和零部件 第一站是云厂。云厂把现金投入数据中心、服务器、网络和电力系统，其中一部分变成加速器和存储采购。只要管理层仍认为算力供给不足，资本开支就会维持高位。 第二站是芯片与存储。GPU、ASIC、CPU、HBM、DRAM 和企业级 SSD 的订单增加，芯片公司把更多晶圆和封装需求交给代工厂。AI 对性能和交付的敏感度高于对单价的敏感度，供应商因而更有能力扩产。 第三站是晶圆厂与封装厂。利用率、产品价格和长期订单改善后，制造企业把利润重新投进新厂、节点升级和封装产线。国内又叠加本地供应安全与产业份额提升的目标。 第四站是设备。晶圆厂资本开支中的大部分最终转化为光刻、刻蚀、沉积、清洗、量测、热处理、离子注入、涂胶显影、键合、减薄、切割与自动化设备。 第五站是零部件。每一台设备都要采购陶瓷、石英、碳化硅、腔体、阀门、密封件、射频电源、MFC、机械手、传感器和大量精密结构件。当整机订单增长、库存从低位回补时，零部件需求被二次放大。 这条链并非没有损耗。电力和洁净室会让项目延期，先进封装良率会拖慢量产，设备交期会把资本开支推到下一年度，某些成熟节点也可能因终端需求不足而继续低迷。因此，所谓超级周期不是一条直线，而是一段被多个瓶颈拉长的上行过程。 四层经营信号，把“长鞭效应”变成现实 截至 2026 年 7 月 23 日，云厂、晶圆厂、设备厂和先进封装四个层面的经营信号正在同时转强：需求端不只在花钱，也开始产生收入和利润；制造端不只在谈扩产，也已经把预算投向先进制程、先进封装与测试；设备端不只在接单，也开始为 2027—2028 年提前扩充自身交付能力。 在云端，Alphabet 2026 年二季度收入约 1,198 亿美元，同比增长 24%；Google Cloud 收入约 248 亿美元，同比增长 82%，积压订单达到 5,140 亿美元。公司把 2026 年资本开支提高到 1,950 亿—2,050 亿美元，并预计 2027 年仍会显著增长。云业务的高速增长、盈利提升和长期订单同时出现，说明 AI 基础设施投入并不只是“先投入、以后再看”的故事。Google 还开始向客户数据中心交付 TPU 系统，定制 AI 芯片正在从自用算力延伸为对外基础设施。 在制造端，台积电二季度收入达到 402 亿美元，高性能计算占收入 66%，7nm 及以下先进节点占晶圆收入 77%；全年资本开支提高到 600 亿—640 亿美元，2026 年美元收入增长预期提高到略高于 40%。AI 相关需求极其强劲，先进封装产能仍然紧张，后段测试设备也存在短缺。AI 的瓶颈已经从先进制程一路延伸到封装与测试，设备预算会优先流向真正卡住产出的环节。 在设备端，ASML 二季度销售额 93 亿欧元，全年销售额目标提高到 430 亿—450 亿欧元，并准备在 2027 年把低数值孔径 EUV 和浸没式 DUV 的产能分别提高约 30%。应用材料季度收入创下 79.1 亿美元纪录，其半导体设备业务在 2026 日历年预计增长超过 30%。Lam 最近一个季度收入 58.4 亿美元，下一季度目标中值达到 66 亿美元；KLA 最近一个季度收入 34.15 亿美元，过程控制业务继续维持高价值和高毛利。 在先进封装端，Besi 二季度收入约 2.50 亿欧元，同比增长 68.7%，订单同比增长 128.8%；公司还获得了两家重复客户和一家新超大规模云客户的混合键合订单。混合键合正从单点验证逐步进入多客户采用，但当前先进封装主体仍然是 CoWoS，其他路线走向大规模量产还需要时间。方向可以确定，收入确认仍要逐级观察样机、验证、小批量、重复订单与规模验收。 这些数字共同指向一个更有用的结论：真正值得关注的不是“所有半导体设备都会涨”，而是先进逻辑、存储、先进封装和过程控制同时提高工艺强度，设备商又面临自身产能约束。 曝光、沉积、刻蚀、量检测、键合、减薄、测试以及安装服务会获得不同程度的增量，关键零部件则承接设备扩产、库存回补和第二来源导入的叠加需求。 同样不能忽视反面。大宗成熟节点仍保持选择性，并不意味着所有成熟制程都进入上行周期；云厂高资本开支会带来折旧和自由现金流压力，如果 AI 收入兑现放慢，市场估值可能先于设备订单波动；Lam 和 KLA 的下一季度数据尚未公布，也不能用同行增长替代公司自身尚未兑现的结果。趋势正在兑现，但不能无条件外推到所有公司。 技术换代为什么提高“每片晶圆设备含量” 平面晶体管走向 FinFET，再走向 GAA，设备需要处理更复杂的三维结构和新材料；3D NAND 每增加层数，就需要更多沉积、刻蚀和量测；HBM 从 8 层走向 12 层、16 层，对减薄、键合、检测和热管理的要求上升；大芯片通过 Chiplet 组合，增加 TSV、电镀和封装步骤。 产能扩张解决“做多少片”，工艺升级解决“每片要用多少设备”。当两者同向时，设备市场增速就可能高于半导体出货量增速。这也是现场把当前周期称为历史级，而不是普通复苏的技术基础。 03 存储是最大的贝塔，先进封装是最有想象力的阿尔法 现场对结构的判断相对一致：未来几年，存储仍是设备需求最大的增量来源之一，先进逻辑与先进封装提供更高的工艺价值量，成熟制程则出现区域与节点分化。 3.1 存储：不只是 HBM AI 训练和推理同时消耗算力与内存。HBM 的带宽价值已经被市场充分认识，但现场讨论把视线进一步延伸到 DRAM 与 NAND。推理需要更大的 KV Cache 和企业级 SSD，存储厂在利润和现金流改善后具备更强扩产能力；3D NAND 层数增加、DRAM 结构迭代、HBM 堆叠升级，都需要更多沉积、刻蚀、量测和封装步骤。 对于国内设备链，存储的意义尤其直接。一方面，国内头部存储厂是国产设备与零部件最重要的客户之一；另一方面，存储工艺与国产设备现有的沉积、刻蚀、清洗、量测能力较为匹配。因此，短期更容易看到订单兑现的，仍是与存储扩产高度相关的设备和核心部件。 3.2 先进封装：从配角走到舞台中央 当单颗芯片继续微缩的成本收益下降，芯片之间的连接方式变得越来越重要。2.5D 封装通过中介层连接逻辑芯片和 HBM，3D 封装则进一步追求芯片与芯片的直接互联。混合键合因此被多位与会者视作长期终局方向之一。 方向确定，不等于量产轻松。现场工程人士反复提醒，大颗芯片封装面临翘曲、散热、异质材料热膨胀、颗粒、对准、堆叠良率和长期可靠性问题。单颗裸片、每次键合和每层存储的良率会连续相乘；堆得越高，任何微小缺陷造成的损失越大。产品在出厂测试时合格，也不代表长期运行后不会失效。 正因为问题尚未完全解决，设备机会才会变多。先进封装不是一台“键合机”的故事，而是一整套新工艺： · 键合：TCB、晶圆对晶圆、芯片对晶圆的混合键合； · 减薄：把晶圆减到十几微米甚至更薄，并安全搬运； · TSV：高深宽比刻蚀、清洗、阻挡层、种子层与电镀； · 检测：已知良品筛选、键合前后检测、失效定位与可靠性评估； · 切割与加工：激光切割、磨划、玻璃基板 TGV、复合材料加工； · 传送与自动化：更薄、更大、更脆的晶圆与封装体，需要更高精度的机械手和传感器。 对中国而言，先进封装还多一层战略意义。在极致微缩受限时，通过多颗芯片堆叠和系统级封装换取算力密度，可能成为继续提升高性能芯片能力的重要路径。它不是对先进制程的替代，而是与先进制程并行的第二条性能路线。 3.3 混合键合为什么既确定、又容易被高估 混合键合把金属互联与介质表面在更小间距上连接，能缩短信号路径、提高带宽密度。3D NAND 已经提供了某些量产经验，逻辑—逻辑、逻辑—存储和更高层 HBM 则打开了更大的市场想象。 然而，一项技术从“可以做”走到“规模赚钱”至少要跨过四道门： 1. 单点工艺。表面平坦度、颗粒、清洗、对准和键合强度达到要求； 2. 整段良率。裸片、减薄、搬运、键合和后续封装的良率连续相乘后仍然经济； 3. 长期可靠性。热循环、材料应力和运行时间不能造成延迟失效； 4. 量产复制。不同设备、不同批次、不同厂区都能获得相似结果。 资本市场最容易在第一道门刚打开时，就把第四道门的收入全部算进去。现场的产业人士更愿意看重复订单、量产台数、验收周期和服务需求。长期方向可以乐观，短期财务预测必须保守。 3.4 减薄、搬运与检测为何同时受益 晶圆越薄，堆叠越容易，热和信号路径也越短；但薄晶圆更容易翘曲、破裂和被污染。减薄设备之后，往往还需要临时键合、解键合、清洗、测厚、应力控制和高精度搬运。一个新封装步骤，会带出一串设备与零部件。 检测同样前移。传统产品可以在最后做一次测试，复杂封装则要求“已知良品”：每颗高价值裸片在进入封装前就要确认质量，键合后还要检测空洞、偏移和界面缺陷。越晚发现问题，报废价值越高。先进封装因此不是后道把前道简单复制一遍，而是把前道级工艺控制带进封装。 04 成熟制程没有退潮，只是增长换了位置 一个反直觉的现场信息是：全球部分成熟节点利用率仍低于先进节点，但国内多家成熟制程代工厂已接近高稼动。 为什么？ 第一，过去两年国内代工价格调整更充分，形成成本优势。第二，本地客户出于供应安全与响应速度，更愿意把订单留在本土。第三，台积电、三星等头部厂把工程师、洁净室和资本开支优先投向 AI 相关的先进制程与先进封装，原有成熟节点订单向其他代工厂外溢。 这种外溢可能先让国内受益，再传到海外成熟代工厂。现场判断，部分海外厂商会从选择性涨价、利用率提升，逐步走向更紧的供需状态。硅光、22nm、40nm、55nm、特色工艺、模拟与功率等节点，并不一定因为不“先进”就失去设备机会。 但成熟制程也最容易出现地方性重复建设。区分真实机会与无效扩产，需要看三个指标：终端订单是否存在、产能利用率是否持续、设备采购是否与明确客户绑定。只看规划产能，容易高估需求。 成熟节点的三种不同命运 第一种是被先进产能挤出的通用成熟节点。头部厂把厂房、人员和预算转向 AI，原有订单外流到成本更低、响应更快的代工厂，形成阶段性紧张。 第二种是有特色工艺壁垒的节点。射频、模拟、功率、硅光、MEMS、图像传感器等并不单纯追求最小线宽，而是依赖器件结构、材料和平台积累。此类节点的设备机会来自新产品和新客户，不完全随传统周期。 第三种是缺乏客户绑定的重复产能。规划看起来很大，却没有稳定产品与设计客户，可能在低价竞争中长期低利用率。设备企业如果只看项目立项、不看客户和工艺，会把“规划”误当成“需求”。 因此，成熟制程研究的单位不应只是“多少纳米”，而应是“节点+工艺平台+客户产品+利用率”。相同的 40nm，在不同厂、不同产品上的经济性可能完全不同。 05 八类设备机会，应该怎样排优先级 现场没有给出简单排名，但可以根据讨论整理出八类设备方向。 5.1 沉积与刻蚀：存储和三维结构的基础设施 3D NAND 层数增加、DRAM 电容结构演进、GAA 新材料和先进封装 TSV，都需要更多薄膜与高深宽比刻蚀。沉积和刻蚀是存储扩产最直接的受益环节，也最容易获得持续订单。它们的难点在于工艺配方、腔体稳定性、颗粒和大规模装机后的服务能力。 5.2 量测与检测：复杂度增长最快的伴生需求 结构越三维、材料越多、线宽越小，过程控制越重要。量检测不只服务先进逻辑，也服务存储层数、封装界面、薄晶圆与光芯片。国产化率较低意味着空间大，但客户更看重数据准确性、重复性和与工艺团队的协同，不会因为“国产”就降低标准。 5.3 键合：方向明确，节奏由良率决定 TCB、混合键合、临时键合与解键合共同构成新封装的关键设备群。键合设备的长期空间大，短期收入却可能随客户路线、良率和封装平台反复。判断时应区分样机、研发线、小批量和真正量产。 5.4 减薄、切割与激光加工：材料变化带来的新窗口 HBM、Chiplet、玻璃基板、碳化硅和复合材料都需要更精密的减薄、切割、开槽与打孔。国际龙头在传统硅晶圆上积累深厚，新材料和新封装却为国产设备提供了重新定义工艺的机会。企业若只复制十五年前的设备，很难形成长期优势。 5.5 清洗与表面处理：每一次新增工艺都绕不开 键合前需要极洁净表面，沉积和刻蚀之间需要去除污染，设备腔体与零部件也要反复清洗和涂层。清洗看似成熟，却随材料与结构变化不断产生新配方、新温度和新表面要求。它既是设备机会，也是材料和服务机会。 5.6 晶圆搬运与自动化：越薄、越大、越贵，越不能出错 晶圆从设备前端模块进入真空腔体，需要在大气和真空环境中高速、准确、低颗粒搬运。先进封装使用更薄、更脆、翘曲更大的晶圆，对机械手、传感器、末端执行器与控制算法提出更高要求。搬运不是辅助功能，而是良率系统的一部分。 5.7 硅光与光电测试：互联升级带出的新设备 AI 集群的瓶颈从计算走向互联，硅光与高速光模块扩产会拉动晶圆级光电测试、耦合、探针、封装和自动化设备。该市场的挑战是光、电、机械和软件必须协同，单一参数领先不等于系统可量产。 5.8 后道传统设备：景气会传导，但结构会分化 AI 直接拉动先进封装，随后通过存储、光通信和配套芯片传到线焊、切割与传统封装。后道总量可能增长，产品结构却会变化：高可靠、高附加值设备更受益，低端标准设备仍可能面对价格竞争。 这八类机会可以用一个二维坐标判断：横轴是需求兑现速度，纵轴是国产替代难度。存储相关沉积、刻蚀和部分清洗更靠近“快兑现”；混合键合、玻璃基板与硅光测试更靠近“高期权”；量检测、核心搬运和高端零部件则处于“空间大、验证长”的位置。不同位置，适合不同的研发和资本节奏。 06 设备行业真正缺的，可能是“成年人能力” 现场一位长期从事后道设备研发的产业人士，把半导体称作“成年人的行业”。 消费电子组装可以通过快速试错、拼时间和拼成本完成，半导体制造却不能轻易出错。晶圆、材料和在制品价值高，设备一旦失效，损失远超设备或零部件自身价格。客户可以给新供应商时间，却不能让新供应商把产品做坏。 这句话解释了为什么行业红利不会平均分。 成熟的国际设备平台，一款主体架构可能研发五年以上，生命周期却能达到二十年；一台运行多年的二手机仍然有价值，因为客户知道它的精度、软件、备件和服务体系。国内部分设备看似功能齐全，几年后却可能因结构应力、精度漂移或维护成本失去使用价值。 衡量一台设备，不能只看首次验收，还要看： · 三年、五年后的精度是否稳定； · 同一机型不同批次是否一致； · 一名服务工程师能维护多少台设备； · 故障平均间隔和平均修复时间； · 零部件是否有第二来源； · 软件、配方与工艺数据库能否持续升级； · 二手机残值和客户复购率。 有企业举了一个很直观的服务成本例子：如果一款设备需要大量现场工程师长期驻点，它的运营成本会被不断抬高；真正稳定的平台，服务人力可以显著更少。可靠性不仅是技术指标，也是利润率和全球竞争力。 从“做出样机”到“做成平台”的七道考题 第一道是功能：设备能完成目标工艺。第二道是性能：精度、速度、颗粒和均匀性达到客户要求。第三道是一致性：同一型号不同台设备表现接近。第四道是稳定性：连续运行数千小时后不漂移。第五道是可维护性：故障能够快速定位，备件容易更换。第六道是工艺生态：设备、配方、软件和材料能够随客户产品升级。第七道是全球服务：在不同国家和厂区都能提供相同支持。 许多新进入者停在第一、第二道，客户真正采购的是后三道。平台型公司的价值，正是把一次项目经验沉淀成可以复制的机型、模块和服务系统。 保值率为什么是一个被忽略的技术指标 二手机残值看似是财务问题，实际反映市场对设备寿命、软件、备件和工艺延续性的信任。一台使用十多年的国际设备仍能保持较高价值，说明客户相信它可以继续生产；一台国产设备三年后几乎无人接手，往往意味着精度、软件或服务无法延续。 提高保值率不是为了发展二手生意，而是倒逼设备企业思考模块化、兼容性、升级路径与长期备件。只有当客户相信设备十年后仍有人维护，才更愿意在今天把它放进主产线。 07 零部件：四个乘数叠加，为什么反而最容易短缺 设备公司有点像高度复杂的系统设计与组装平台，零部件则更接近重资产制造。当前零部件同时叠加四个乘数： 1. 设备订单增长； 2. 设备厂从去库存转为补库存； 3. 海外供给不足推动国产替代； 4. 海外设备商主动来中国寻源。 设备订单落到零部件端时，会同时形成生产物料、库存修复和装机后服务备件三类需求；再叠加国产替代与海外寻源，零部件订单增速可能高于设备整机。零部件约占整机成本四成，也意味着这种放大对应的**价值量并不小。重资产属性又让产能利用率上升时利润弹性更大，因此现场有人用“设备的三倍弹性”作形象比喻。需要强调的是，这不是可直接套用的财务公式——零部件在下行周期同样会承受更大的固定成本压力。 6.1 一只机械手的十年考题 晶圆搬运机械手说明了“功能”与“可靠”的差别。实验室可以验证速度、精度、振动和重复定位，但晶圆厂真正关心的是能否稳定运行十年。国外成熟机械手往往多年后才进入维修；如果国产产品三年就需要停机维护，即使采购价更低，十年总拥有成本也可能更高。 轴承、皮带、丝杆、减速机、密封件之所以最终集中到少数供应商，不是行业缺少选择，而是长期运行淘汰了不稳定的组合。供应短缺会让客户愿意增加验证，但验证通过后仍要接受时间考验。 6.2 钱买不到五年的手上功夫 石英和碳化硅零件的生产依赖烧制工艺，成熟火工可能需要五年培养；高精度机加工也缺熟练技师。设备可以买，厂房可以建，人的经验无法按季度复制。海外同样面临年轻人不愿进入传统工艺岗位、工程师老龄化和扩产决策偏慢的问题。 这类人才约束有三个后果：产能扩充比财务模型慢；快速招人可能带来质量波动；能建立培训、标准化和数据化工艺体系的企业，会比只依赖老师傅个人经验的企业更有规模优势。 6.3 最深的一层是材料 零部件国产化继续往上追，最终会碰到材料和配方。轴承寿命差在钢材与热处理，减速机差在润滑材料与油脂，清洗、研磨和表面处理差在含量极低的添加剂。某些材料年市场规模很小，难以独立支撑长期研发和全球认证；即使化学成分可以检测，也很难反推出完整工艺。 因此，小材料与小零部件需要新的产业组织方式。设备厂、晶圆厂和产业资本可以通过联合验证、长期订单、参股和并购，把分散的小产品放进共享研发、质量和客户体系。真正值得关注的并购，不是简单拼收入，而是能否补齐关键工艺、材料和认证。 核心零部件可以分成四层 第一层是通用精密件，如高质量机加工结构件。竞争关键是精度、一致性、交期和成本。第二层是半导体专用部件，如陶瓷、石英、腔体、加热器、静电吸盘、真空阀与机械手，既要精密制造，也要理解设备工艺。第三层是功能子系统，如射频电源、MFC、真空系统、传感与控制，它们直接影响工艺结果。第四层是材料与耗材，如特气、研磨、清洗、涂层和密封材料，单项价值不一定高，却可能决定寿命与良率。 越往上层，产品越容易被看到；越往底层，验证和配方越隐蔽。国产化最初往往从结构件开始，随后进入专用部件与子系统，最终碰到材料。真正的“二次国产化”，是设备整机国产以后，继续把内部关键部件和材料做成安全、可靠的本土供应。 供应短缺会不会自然带来涨价 不一定。设备厂和晶圆厂客户集中，长期关系比一次涨价重要；国产供应商又在争取验证，价格是进入市场的工具。当前更明确的信号不是全面提价，而是客户不再强求年降、愿意为交期和服务付费。 长期定价权来自三个变量：寿命更长，减少停机；性能更好，提高设备产出与良率；服务更快，降低故障损失。若国产零部件仍只用低价换市场，行业即使增长，也可能陷入低利润。 08 国产替代正在发生一次角色反转 过去，国产零部件企业常常要反复拜访客户，争取一次验证机会。只要海外产品还能买到，客户就倾向继续使用熟悉的供应商。现在，海外零部件自身被全球扩产占满，交期从三个月向六个月甚至更长延伸，国内设备厂开始主动寻找备份。 更值得注意的是海外客户的态度变化。一些国际设备商此前试图降低中国供应商比例，如今因本土供应链扩产不足，重新主动联系中国企业，希望获得面向日本、马来西亚等地的供货能力。部分国产传感器、传送模块和精密部件也开始进入海外晶圆厂与设备厂验证。 这说明国产替代正在从“供应安全驱动”走向“供给效率驱动”。中国的优势不只是成本，还包括工程师密度、扩产速度、客户响应和制造协同。零部件的全球化可能早于整机，因为它更容易嵌入国际平台，又能解决海外产能不足。 但角色反转不代表标准降低。出海以后，企业要面对更严格的一致性、知识产权、合规、备件和服务要求。产品卖出去只是第一步，建立日本、东南亚、欧美的现场支持网络，才是全球供应商的起点。 从“被迫替代”到“自发替代”，标准也要升级 被迫替代解决的是“买不到怎么办”。自发替代解决的是“为什么长期用你”。前者可以依靠**、供应安全和备份需求，后者必须回答性能、成本、寿命、服务与持续升级。 行业窗口越好，越要防止劣币驱逐良币。如果采购只看最低价格，供应商只能在材料和工艺上压成本；如果客户把维护、停机、良率和备件算进总拥有成本，优质企业才有动力长期投入。国产化的下一阶段，不应只是提高采购比例，而应建立一套面向全生命周期的评价体系。 零部件为什么可能比整机更早全球化 整机设备进入海外晶圆厂，需要完整工艺验证、软件适配和长期服务，难度极高；零部件可以先嵌入海外成熟设备平台，解决其产能、成本和交期问题。中国在机加工、工程师协同和扩产速度上的优势，更容易从部件开始被全球客户接受。 不过，零部件出海同样需要“隐形基础设施”：英文与日文技术文件、海外备件库、现场服务、产品责任保险、知识产权边界、出口合规和客户审计。缺少这些能力，订单只会停留在样品和询价。 一套更快、但不降低标准的验证机制 现场多次提到，传统验证流程安全但缓慢。为了把当前窗口变成长期能力，产业链可以做六件事： 1. 晶圆厂把非敏感的寿命、颗粒、漂移和失效标准明确化； 2. 设备厂建立共享测试平台，降低小企业重复投入； 3. 第三方机构承担材料分析、可靠性和失效定位； 4. 头部客户用框架订单或最低采购量降低供应商扩产风险； 5. 产业资本为小材料和重资产部件提供更长期资金； 6. 通过双来源制度保留竞争，同时避免低价淘汰优质供应商。 验证可以更快，但不能更松。真正的效率来自数据共享、测试前移和责任清晰，而不是减少可靠性步骤。 09 量检测为什么会成为这轮周期的“时间机器” 先进制程与先进封装把工艺步骤推向数百道、上千道。每道工序的良率差一点，经过连乘后都会变成巨大损失；多颗高价值裸片一旦封装在一起，失败成本进一步放大。 量检测的价值因此从“最后挑坏品”，前移到研发、工艺控制和设备验证。第三方检测平台看到的需求集中在三条线：算力芯片、存储与高速通信。客户不仅需要知道产品有没有缺陷，还要知道缺陷发生在哪一道工序、哪一种材料和哪一个设备参数。 如果一次测试要等数周，千道工序的迭代会被大量等待时间拖慢；如果能把关键反馈压缩到一天甚至半天，设备和工艺开发可能提前数月。AI 也可以用于图像识别、故障归因和参数搜索，把检测数据变成研发闭环。 对国产设备来说，这一点格外重要。进入量产线之前，通常要先在研发线或 mini-line 运行数月，证明稳定性和一致性。谁能让验证更快、更透明，谁就能缩短国产替代最昂贵的时间。 良率是一道连乘题 假设一条复杂流程有上千个关键步骤，每一步都“看起来接近完美”，最终结果仍可能很差。单步良率从 99.9% 提升到 99.99%，差的只是一个小数点，经过大量步骤连乘后，却可能决定整条产线是否经济。 先进封装把这道题变得更昂贵。多颗已完成前道制造的高价值裸片一旦组合，任何后段缺陷都可能让整包报废。因此，检测必须从终点走向全流程：来料、键合前、键合后、减薄后、可靠性测试和现场运行数据都要进入闭环。 量测公司的护城河不只是一台仪器 真正的壁垒还包括算法、标准样品、缺陷数据库、工艺理解和客户协同。仪器给出一张图，工程师需要知道缺陷来自材料、设备还是工艺参数；只有能帮助客户缩短定位时间，量测才从“验收工具”变成“研发基础设施”。 10 产业判断与现场答案：一张对照表 11 谁更可能成为赢家：六种企业画像 第一类是平台型设备企业。它们拥有多产品线、头部客户、采购规模和全国服务网络，可以把一次客户进入转成多品类销售。周期上行时最先获得订单，也最有能力解决零部件保供。需要警惕的是组织复杂、研发投入过大和产品线之间的资源争夺。 第二类是卡在存储主线的专用设备企业。只要进入头部存储厂量产线，就能直接分享扩产；沉积、刻蚀、清洗、量测、减薄和键合都属于这一类。风险是客户集中和工艺路线变化。 第三类是新工艺期权企业。混合键合、玻璃基板、TGV、硅光测试和大尺寸封装今天收入可能很小，一旦路线收敛，增速会很高。判断它们不能只看发布会，要看重复订单和量产数据。 第四类是可靠性优先的核心零部件企业。它们未必最便宜，却能通过更长寿命、更低维护和批次一致性进入主流设备平台。此类企业在供给紧张时获得验证，在周期正常化后靠可靠性保住份额。 第五类是材料与工艺平台。单一材料市场小，多产品平台可以共享研发、客户认证和全球服务。行业并购会增加，但只有真正补工艺、补客户和补产能的整合才有价值。 第六类是研发基础设施企业。第三方检测、失效分析、量测和工艺软件不会直接增加晶圆片数，却能缩短设备和工艺迭代。它们的长期价值来自数据与客户研发流程的深度绑定。 这六类画像共同指向一个结论：行业增长很快，竞争却不会因此变得简单。越是高景气，客户越会优先把订单交给能**交付的成熟供应商；新进入者只有在新工艺、严重短缺或更高效率上形成明显优势，才有机会改变名单。 12 保持乐观，也保留三分清醒 这场会对未来三年的方向相当乐观，对每一家企业却并不盲目乐观。至少有五类风险需要持续跟踪。 第一，资本开支预测可能过于激进。云厂指引、晶圆厂规划和设备订单之间存在时间差，电力、洁净室和融资条件都可能让项目后移。 第二，先进封装的方向确定性高于收入确定性。混合键合、玻璃基板、超大封装等新技术需要跨过良率、材料与可靠性门槛，不能用样机进展直接外推量产收入。 第三，零部件企业可能在扩产中丢失质量。新人、二级供应商和新厂同时导入，最容易造成批次波动；高景气时期的失误，可能换来长期失去客户。 第四，行业竞争会加剧。平台型龙头正在扩产品线，二三线企业也在进入同一赛道。如果增长放缓，今天的良性竞争可能转为价格竞争。 第五，2028 年仍是需要保留的观察点。现场对 2027 年相对有信心，对 2028 年明显更谨慎。届时存储新增供给、云厂折旧和 AI 变现将接受一次共同压力测试。 判断周期是否改变，不必盯着每一天的股价，可以跟踪十个更朴素的指标：晶圆厂真实招标、设备合同负债、零部件交期、库存方向、招聘与服务人员、量产重复订单、海外合格供应商认证、关键材料扩产、设备一次验收通过率，以及云厂资本开支是否下调。 一组值得持续核对的现场锚点 · 全球设备市场被多位参会者放在未来三年显著扩张的情景中，但终点口径差异很大； · 零部件约占设备价值量四成，是现场反复使用的粗略锚； · 部分设备订单已出现长期框架化，交付需要跨年度； · 部分海外关键件交期从约三个月延长到约六个月，陶瓷与精密制造扩产按一至两年计算； · 一名成熟火工的培养约需五年； · 有后道设备企业称 2026 年排产已满、交期约三十周，对 2027 年乐观、对 2028 年谨慎； · 第三方检测正尝试把部分反馈周期从周/月压缩到一天以内； · 海外设备客户开始主动寻找中国零部件产能，但询价、验证与规模订单之间仍有距离。 这些锚点不应被当成定论，而应成为下一次会议的“对答案清单”。产业研究的价值，不是把一次口述写成永恒预测，而是持续验证哪些信号在增强、哪些已经反转。 三种确定性，不要混在一起 讨论设备行业时，经常把三种不同的“确定性”混为一谈。 第一种是产业趋势确定性：AI 需要更多算力、存储与互联，先进制程和先进封装继续演进。这一层目前最强。 第二种是订单确定性：客户已经完成厂房、预算和招标，设备企业拿到可执行订单。这一层需要看合同、交期和项目进度，不能直接由产业趋势推导。 第三种是利润确定性：订单可以按期交付、通过验收，毛利率不被零部件涨价和服务成本侵蚀，现金能够收回。这一层最容易被忽略。 一家企业可能方向正确，却迟迟没有订单；也可能订单很多，却因为核心件、人员和验收问题无法形成利润。把三种确定性分开，才能解释为什么同一个设备赛道中的公司表现会高度分化，也能避免把“行业很好”误写成“所有企业都好”。 13 从共识走向行动：产业链下一步可以做什么 第一，建立一张动态的设备与零部件瓶颈地图。按工艺环节列出关键部件、全球主要供应商、国内成熟度、验证周期、交期和第二来源，每个季度更新。这样才能提前发现“设备订单很满、却被一个小部件拖住”的风险。 第二，建立面向量产的共同评价语言。国产供应商常说“参数已经达到进口水平”，客户却说“还不能上主产线”，两边缺少的是寿命、漂移、颗粒、维护和失效模式的共同标准。把评价从功能参数扩展到全生命周期，才能减少低效沟通。 第三，把检测和失效分析前置。设备开发、零部件验证和材料筛选不应各自排队，可以由第三方平台形成共享闭环，帮助中小企业更快找到问题。速度提升不来自减少测试，而来自更早测试、更快定位。 第四，为小材料和重资产部件提供“耐心资本”。这些环节市场小、验证长、扩产慢，却可能决定整条产线安全。只按两三年上市退出设计投资，很难支持真正的材料研发和十年可靠性积累。 第五，提前建设海外服务节点。零部件企业在拿到第一批日本、东南亚客户之前，就应规划备件、维修、语言、合规与客户审计。等订单来了再补服务，往往已经太晚。 第六，用季度复盘替代一次性预测。把本次会议中的订单、交期、招聘、量产与资本开支口径列成清单，三个月后逐条核对。判断正确的保留，判断错误的追溯原因。产业研究只有进入这样的循环，才不只是事后总结。 14 结语：设备是主角，零部件是决定主角能不能上场的人 AI 的故事看起来发生在模型、GPU 和数据中心，最终却要落到制造现场：晶圆被准确搬运，腔体维持稳定真空，气体按精确流量进入，薄膜在原子尺度沉积，缺陷在堆叠前被发现，十几层芯片在微米尺度对准。 任何一个动作不稳定，最先进的设计都无法成为可交付的产品。 这场闭门会没有给出一张简单的“受益公司名单”，却给出了一套更有用的判断方法：看订单，更要看交付；看国产化率，更要看十年可靠性；看新技术，更要看量产良率；看出海，更要看全球服务；看市场空间，更要看一家公司有没有把窗口期变成长期能力。 设备超级周期或许刚刚开始。但决定周期高度的，不只是资本开支，而是产业链能不能把每一只机械手、每一个阀门、每一片陶瓷和每一滴材料都做到稳定、可复制、可交付。 下一轮半导体竞争，可能就藏在这些“不起眼”的地方。 也正因为如此，真正值得长期追踪的，不只是下一张设备订单，而是每一家企业能否把一次短缺带来的机会，沉淀成下一轮周期仍然有效的工程能力。", "status": "extracted"}, "attachment:files/0811脱水研报.pdf": {"id": "attachment:files/0811脱水研报.pdf", "kind": "attachment", "title": "0811脱水研报", "source_label": "其他", "excerpt": "电子行业研究框架 20260810 要点总结 1.行业主线与核心逻辑 2026 年电子行业全年主线围绕两大方向： AI 技术创新 与国产自主可控 ，两条主线存在交叉，自主 可控亦由 AI 产业发展所带动。AI 产业趋势已从训练为主转向推理侧权重更大，硬件投资机会发生结构性变化", "content": "电子行业研究框架 20260810 要点总结 1.行业主线与核心逻辑 2026 年电子行业全年主线围绕两大方向： AI 技术创新 与国产自主可控 ，两条主线存在交叉，自主 可控亦由 AI 产业发展所带动。 AI 产业趋势已从训练为主转向推理侧权重更大，硬件投资机会发生结构性变化；当前正进一步向 Agent（智能体）时代 迭代，将大语言模型从对话工具升级为任务执行引擎，推理转化为分布式多 步骤流程，带来硬件架构升级。 2.“纯算电联”四大维度投资框架 存（存储） ：推理时代对“纯算电联”四大维度提出均衡且更苛刻的要求，存储带宽与容量成为首 要瓶颈。HBM 成为决定推理性能的关键组件，其在 AI 芯片组件总支出中的占比已 超过 50% 。海外 以海力士、三星、美光为主，国内厂商围绕 HBM 迭代升级，国产化率快速上行。 算（算力芯片） ：推理时代算力架构正从 GPU 转向 GPU+ASIC 混合计算 架构。ASIC 针对特定模 型架构优化，在能效比和单位推理成本上具备显著优势。海外代表包括谷歌 TPU、亚马逊 Trainium 系列及 Meta 自研芯片等，ASIC 芯片市场规模高速增长。 电（电力与散热） ：AI 推理基础设施电力需求呈指数级增长，英伟达从 A 系列到 S 系列、Rubin 再 到 Feynman 系列，电力需求快速提升。配套功率、模拟、第三代半导体器件趋势向上；散热技术 从风冷向液冷升级，液冷正从可选项变为必选项。英飞凌分享服务器主板向 HVDC 数据中心架构过 渡，路径可为 800V 转 12V 或 800V 转 50V/6V，其中使用大量三代半芯片。 连（网络互联） ：AI 集群规模从数千卡扩展至数万甚至数十万卡，网络互联成为制约整体性能的关 键。传统可插拔光模块在带宽密度、功耗、延迟方面难以满足下一代 AI 基础设施需求， CPO（共 封装光学） 技术应运而生，显著缩短电信号传输距离，降低功耗 30%–50%并提升带宽密度。PCB 方面，2025 年全球市场规模约 800 亿美金 ，2026 年预计达 900 多亿美金 ，服务器/数据存储 PCB 需求将大幅增长，HDI 在服务器数据中心占比将从 3%左右提升至 2030 年的接近 30% 。 3.Agent 时代与 CPU 产业链 Agent 时代需要上下文处理和多步骤任务执行，CPU 算力正从配角转变为核心角色，成为维持系统 吞吐量和整体成本的关键因素。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª AMD 预计服务器 CPU 市场总规模以每年 超过 35% 的速度增长，整体市场规模有望达到 1500 亿 美金甚至更多 （当前仅数百亿美金量级）。 CPU 产业链相关方向值得重点关注。 4.AI 产业趋势下的 A 股重点公司梳理 存：相关存储/HBM 产业链公司。 算：国内 ASIC 芯片龙头，包括昇腾、寒武纪、昆仑芯、海博等。 电：功率领域关注斯达半导（原文“清洁能”疑为口误，结合上下文应为斯达半导或类似功率龙 头）；模拟关注圣邦股份；三代半关注天岳先进等。 连：光模块之外，PCB 关注沪电股份（原文“互变酸奶”疑为口误）、上游生益科技（原文“蜂蜜 新生”疑为口误）等。 CPU：关注澜起科技（原文“蓝旗”疑为口误）、海光信息，以及 CPU 封测环节的通富微电等。 5.半导体自主可控与国产替代 全球存储与先进制程产能紧缺，扩产共振；国内存储扩产逻辑未来几年持续加速向上。预计未来 2– 3 年全球资本开支增速 20%–30% ，国内增速 40%–50% 。 国内存储产线（如长江存储、长鑫存储）国产化比例持续提升，先进制程（中芯国际、华虹）国产 化比例有序提升。设备厂订单既受益行业贝塔增长，又受益国产化率提升的阿尔法，部分设备公司 订单增速可达 60%–70%甚至更高 。代表性公司：中微公司、北方华创（原文“飞车”疑为口 误）、拓荆科技、芯源微、盛美上海（原文“巴萨金科”疑为口误）等。 零部件 ：全球零部件厂商处于供不应求状态，国内零部件厂商扩产更积极灵活，三重受益（设备厂 订单增长、海外零部件交付不足带来的国产替代、海外设备厂主动寻求国内零部件供应），订单增 速可观。代表性公司：富创精密、江丰电子（原文“江峰”疑为口误）、正帆科技（原文“郑帆” 疑为口误）、神工股份等。 材料：随着晶圆产能落地，材料需求持续向上，未来几年需求确定性强。代表性公司包括安集科 技、鼎龙股份、兴发集团（原文“新娘”疑为口误）、江丰电子、雅克科技（原文“广告”疑为口 误）等。 6.晶圆制造与先进封测 国产算力大爆发背景下，上游晶圆制造产能与先进封测产能成为关键瓶颈。 今明两年决定国内算力 芯片的不是需求，更多是供给 。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 国内晶圆代工龙头（中芯国际、华虹）今年将实现良率改善、产能提升和工艺优化，产能有望大幅 改善。 先进封测（2.5D CoWoS、3D HBM 堆叠封装）已成为 AI 算力芯片成本端重要组成部分，今明两 年严重供不应求，国内厂商积极扩产将持续受益。相关公司：长电科技、通富微电、甬矽电子（原 文“永西”疑为口误），配套设备公司如长川科技、华峰测控（原文“华丰”疑为口误）、金海 通，第三方测试伟测科技等。 算力芯片公司 ：国产算力芯片处于严重供不应求状态，能够在上游资源/产能端获得确定性保障的公 司成长确定性更强。关注华为昇腾产业链、寒武纪及二线算力芯片公司。 7.消费电子与端侧 AI AI 持续向端侧延伸，苹果作为 AI 端侧代表性企业，进入“硬件优先+工程主导设计”的新时代。硬 件创新带动单机零部件 ASP 提升，供应链固定资产投入与设备采购周期加速，产线改造、模具更新 和新工艺导入频率提升，利好上游设备厂商。 除苹果外，AIPC、AI 手机、AI 眼镜等端侧方向亦值得持续关注，配套消费电子龙头和端侧单机价 值量提升机会值得重视。 问答整理 Q1：当前市场对存储方向存在分歧，如何看待？ 答：近期市场对存储的分歧更多体现在价格层面，即认为价格已处于较高水平、担心反噬需求，而非需 求端出现问题或供需格局逆转。推理侧在产业中的权重快速提升，对“纯算电联”提出均衡且苛刻的要 求，存储带宽和容量是托底推理性能的首要瓶颈，HBM 在 AI 芯片组件总支出中占比已超过 50%，存 储需求的基本面依然扎实。 Q2：国内半导体设备、零部件、材料公司的成长逻辑是什么？ 答：全球存储和先进制程扩产共振，国内扩产增速更快（国内资本开支增速 40%–50%，全球 20%– 30%）。国内存储产线和先进制程的国产化比例持续提升，设备厂订单既受益行业贝塔又受益国产化阿 尔法，部分公司订单增速可达 60%–70%甚至更高。零部件方面，全球零部件供不应求，国内厂商扩产 更积极灵活，三重受益（设备厂订单增长、海外交付不足带来的替代机会、海外设备厂主动寻求国内供 应）。材料方面，随着晶圆产能落地，需求持续向上，未来几年确定性很强。 Q3：国内先进封测在 AI 算力芯片中的重要性如何？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 答：过去市场认为先进封测在产业链中占比不高，但在 AI 算力芯片领域，2.5D CoWoS 和 3D HBM 堆叠封装已成为成本端非常重要的组成部分。今明两年这两个领域严重供不应求，国内厂商积极扩产将 持续受益，相关封测公司及配套设备、测试公司均值得重点关注。 Q4：国内算力芯片公司的投资逻辑是什么？ 答：国产算力芯片处于严重供不应求状态，今明两年决定国内算力芯片的不是需求而是供给。能够在上 游晶圆制造和先进封测产能方面获得确定性保障的公司，成长确定性更强。关注华为昇腾产业链、寒武 纪以及二线算力芯片公司。 Q5：如何看待苹果产业链在 AI 端侧的投资机会？ 答：苹果作为 AI 端侧最具代表性的企业，已进入“硬件优先+工程主导设计”的新时代。硬件创新带 动单机零部件 ASP 提升，供应链固定资产投入与设备采购周期加速，产线改造、模具更新和新工艺导 入频率提升，对上游设备厂商需求增加。果链作为 AI 端侧重要主体，未来值得重点关注。此外， AIPC、AI 手机、AI 眼镜等端侧方向也在持续发展，配套消费电子龙头和单机价值量提升机会同样值得 关注。 原文 电子 研究框架 20260810_原文 2026 年 08 月 12 日 发言人 应该这么说，全年的话我们认为电子行业的一个主线还是围绕两个方向。一个是 AI 技术创新，另外一 个就是国产自主可控，两个方向去这个是主线。当然的话这两个主线其实也是有交叉的。因为你自主可 控也是围绕 AI 相关的这个产业的一个发展，去带动的国产自主可控方向的这样的一个机会哈那确实在 过去一段时间的话，我们知道 AI 产业的一个发展趋势还是有了非常显著明显的一个迭代提升。从最开 始的这个 AI 训练以训练为主，到逐渐转向推理侧的一个占比权重更大哈那对于整体的一个硬件的一个 投资机会的话，还是发生了比较大的 骤流程，带来硬件架构升级。 2.“纯算电联”四大维度投资框架 存（存储） ：推理时代对“纯算电联”四大维度提出均衡且更苛刻的要求，存储带宽与容量成为首 要瓶颈。HBM 成为决定推理性能的关键组件，其在 AI 芯片组件总支出中的占比已 超过 50% 。海外 以海力士、三星、美光为主，国内厂商围绕 HBM 迭代升级，国产化率快速上行。 算（算力芯片） ：推理时代算力架构正从 GPU 转向 GPU+ASIC 混合计算 架构。ASIC 针对特定模 型架构优化，在能效比和单位推理成本上具备显著优势。海外代表包括谷歌 TPU、亚马逊 Trainium 系列及 Meta 自研芯片等，ASIC 芯片市场规模高速增长。 电（电力与散热） ：AI 推理基础设施电力需求呈指数级增长，英伟达从 A 系列到 S 系列、Rubin 再 到 Feynman 系列，电力需求快速提升。配套功率、模拟、第三代半导体器件趋势向上；散热技术 从风冷向液冷升级，液冷正从可选项变为必选项。英飞凌分享服务器主板向 HVDC 数据中心架构过 渡，路径可为 800V 转 12V 或 800V 转 50V/6V，其中使用大量三代半芯片。 连（网络互联） ：AI 集群规模从数千卡扩展至数万甚至数十万卡，网络互联成为制约整体性能的关 键。传统可插拔光模块在带宽密度、功耗、延迟方面难以满足下一代 AI 基础设施需求， CPO（共 封装光学） 技术应运而生，显著缩短电信号传输距离，降低功耗 30%–50%并提升带宽密度。PCB 方面，2025 年全球市场规模约 800 亿美金 ，2026 年预计达 900 多亿美金 ，服务器/数据存储 PCB 需求将大幅增长，HDI 在服务器数据中心占比将从 3%左右提升至 2030 年的接近 30% 。 3.Agent 时代与 CPU 产业链 Agent 时代需要上下文处理和多步骤任务执行，CPU 算力正从配角转变为核心角色，成为维持系统 吞吐量和整体成本的关键因素。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª AMD 预计服务器 CPU 市场总规模以每年 超过 35% 的速度增长，整体市场规模有望达到 1500 亿 美金甚至更多 （当前仅数百亿美金量级）。 CPU 产业链相关方向值得重点关注。 4.AI 产业趋势下的 A 股重点公司梳理 存：相关存储/HBM 产业链公司。 算：国内 ASIC 芯片龙头，包括昇腾、寒武纪、昆仑芯、海博等。 电：功率领域关注斯达半导（原文“清洁能”疑为口误，结合上下文应为斯达半导或类似功率龙 头）；模拟关注圣邦股份；三代半关注天岳先进等。 连：光模块之外，PCB 关注沪电股份（原文“互变酸奶”疑为口误）、上游生益科技（原文“蜂蜜 新生”疑为口误）等。 CPU：关注澜起科技（原文“蓝旗”疑为口误）、海光信息，以及 CPU 封测环节的通富微电等。 5.半导体自主可控与国产替代 全球存储与先进制程产能紧缺，扩产共振；国内存储扩产逻辑未来几年持续加速向上。预计未来 2– 3 年全球资本开支增速 20%–30% ，国内增速 40%–50% 。 国内存储产线（如长江存储、长鑫存储）国产化比例持续提升，先进制程（中芯国际、华虹）国产 化比例有序提升。设备厂订单既受益行业贝塔增长，又受益国产化率提升的阿尔法，部分设备公司 订单增速可达 60%–70%甚至更高 。代表性公司：中微公司、北方华创（原文“飞车”疑为口 误）、拓荆科技、芯源微、盛美上海（原文“巴萨金科”疑为口误）等。 零部件 ：全球零部件厂商处于供不应求状态，国内零部件厂商扩产更积极灵活，三重受益（设备厂 订单增长、海外零部件交付不足带来的国产替代、海外设备厂主动寻求国内零部件供应），订单增 速可观。代表性公司：富创精密、江丰电子（原文“江峰”疑为口误）、正帆科技（原文“郑帆” 疑为口误）、神工股份等。 材料：随着晶圆产能落地，材料需求持续向上，未来几年需求确定性强。代表性公司包括安集科 技、鼎龙股份、兴发集团（原文“新娘”疑为口误）、江丰电子、雅克科技（原文“广告”疑为口 误）等。 6.晶圆制造与先进封测 国产算力大爆发背景下，上游晶圆制造产能与先进封测产能成为关键瓶颈。 今明两年决定国内算力 芯片的不是需求，更多是供给 。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 国内晶圆代工龙头（中芯国际、华虹）今年将实现良率改善、产能提升和工艺优化，产能有望大幅 改善。 先进封测（2.5D CoWoS、3D HBM 堆叠封装）已成为 AI 算力芯片成本端重要组成部分，今明两 年严重供不应求，国内厂商积极扩产将持续受益。相关公司：长电科技、通富微电、甬矽电子（原 文“永西”疑为口误），配套设备公司如长川科技、华峰测控（原文“华丰”疑为口误）、 科技：目前最核心的供应商，供应份额超过60%。公司对其进行了6.8%的股权投资，获得专属产线支持及低于同行的采购价格，有效解决了CW光源的国产替代问题。 长光华芯：计划引入，主要供应EML芯片，辅以CW芯片。 永鼎股份：计划引入，主要供应CW芯片，少量EML芯片面向国内市场。 2. EML芯片市场地位与前景（聚焦长光华芯） 市场格局：海外供应商（Coherent、Lumentum）占据约90%市场份额，下游客户（谷歌、英伟达）实行强制认证。 国内通过认证的仅两家：索尔思（自供为主）和长光华芯。 长光华芯进展：100G EML芯片已通过谷歌认证，200G EML芯片认证正在对接。这有助于缓解海外厂商主导、出货受限的局面。 份额预测：目前份额仅1%-2%。通过认证后需6-9个月小批量测试，预计2026年下半年出货量开始增长，2027年下半年放量。预计2027年份额提升至5%-10%，2028年可达15%-20%。未来增长取决于产品稳定性、良率及扩产情况。 3. CW光芯片需求与份额规划 源杰：核心主供，当前份额超60%。 永鼎：作为第二供应商，份额将逐步提升，以保障供应链稳定和多元化，适应硅光方案对CW光源的大规模需求。 未来需求量预测： 2027年：800G光模块需约4500万颗CW光芯片，1.6T光模块需约1.3亿颗。 2028年：800G光模块需约7000万颗，1.6T光模块需约1.8亿颗。 4. 索尔思CW光芯片 公司基本不会采用，因其产品主要用于自供（如200G/100G EML芯片）。 5. 供应商份额分配（光模块业务） 源杰：60%-70%（核心主供） 永鼎：10%-15%（第二供应商） 仕佳：小部分份额 国外供应商：少量 6. NPO产品需求与供应商差异 需求量预测：2027年达1600万，2028年增至3200万。 在NPO产品中，源杰的供应份额会更高。 7. CPO技术进展 产业化预计要到2029-2030年，目前发展进度较慢，暂不纳入核心考量。 8. 联合光电合作进展 处于对接、测试和送样阶段，预计最早2027年下半年转化为订单。第一年份额预计约5%，第二年可能提升至5%-10%。 二、光学组件领域：国产化为王，价值量明确 1. 透镜与FAU（光纤阵列单元）供应商格局 透镜：主要供应商为炬光科技，其次是晶方，水晶光电约占10%份额。 FAU：主要供应商包括光库科技、天孚通信、仕佳光子、三安光电等。 现状：透镜和FAU均已实现以国内供应商为主。 2. 价值量占比 FAU：约占光模块BOM成本的10%。 透镜：约占15%。 3. 800G与1.6T光模块中透镜和FAU的使用数量及单价 透镜： 800G：8个，单价约2美金（实际略低）。 1.6T：32个。 FAU：均为集成化应用，每个模块使用一个，整体价格约22-25美金。 4. NPO架构（3.2T）下的变化 透镜：需64个，单价增幅约10%。 FAU：价值量翻倍，达40美金以上。 三、薄膜铌酸锂方案：放量预期明确，产业链清晰 1. 应用情况 已应用于800G、1.6T光模块，未来将持续用于3.2T光模块，通常与硅光技术集成。主要用于制造调制器。 2. 产业链合作模式 光模块厂商与调制器供应商（如光库科技）合作，调制器供应商向上游材料厂商（如天通股份）采购薄膜铌酸锂晶圆。 3. 市场需求放量预测 放量时间：2027-2028年。 需求量预测： 2027年：约500万颗。 2028年：约1500万颗。 2029年：预计稳定在2000万个左右，增速趋于平稳。 四、电芯片（TIA/Driver）领域：国产替代起步，长期目标明确 1. 关键产品 TIA（跨阻放大器）和Driver（驱动器）芯片是计划推进国产替代的关键产品，目前主要由国外供应商主导。 2. 国内重点扶持公司 优迅和卓胜微。 3. 市场份额目标 目前国内供应商份额均低于5%。 长期目标：将上述两家公司合计市场份额提升至10%-15%。 4. 供货限制 卓胜微的PIC电芯片（即TIA/Driver）在光模块领域向国外客户供货不存在限制，与射频芯片序列不同。 五、氮化铝陶瓷基板：供应链格局重大变化，国产替代成功 1. 背景 作为散热片和壳体，是供应链国产化的重要一环。 2024年，日本丸和与京瓷合计占据90%供应份额。2024年下半年，因稀土（氮化铝陶瓷基板烧结重要材料）出口限制，日本供应商停止供应，触发国产替代。 2. 国产替代进展 公司于2024年底启动扶持计划，与中瓷共研共创。 到2025年，中瓷产品性能已达日本京瓷水平，供应份额大幅提升，京瓷份额下降。 目前：中瓷供应份额已增长至60%。 六、未来市场展望（2029年及3.2T产品） 1. 2029年市场动态平衡 1.6T产品增速约50%。 800G产品基本持平。 3.2T产品从2028年开始起量，当年芯片需求量约1500万颗；2029年预计增至约4000万颗。 2. 3.2T产品芯片价格 目前未产业化，实验室阶段价格较高。 预计量产后，价格约为当前产品的三倍。", "status": "extracted"}, "post:2026-08-12T08-50:5c10be114b36": {"id": "post:2026-08-12T08-50:5c10be114b36", "kind": "post", "title": "2026-08-12 08:50", "source_label": "帖子正文", "excerpt": "【兴证策略】近期美股哪些个股新高？近期，美股三大指数均创下或接近新高，成为7月调整后中美日韩股市中率先新高的市场。", "content": "【兴证策略】近期美股哪些个股新高？ 近期，美股三大指数均创下或接近新高，成为7月调整后中美日韩股市中率先新高的市场。二季报的强劲盈利是重要驱动。 从行业分布来看，美股创新高的个股分布相对分散，但主要线索仍在于景气。8月以来美股创新高的个股在各个行业均有涉及，主要集中在高利率环境支撑业绩的【金融（银行、非银）】，以及【医疗医药、科技软硬件、机械、石油石化】等。 从近期创新高的代表性个股来看，对于AI，近期市场主要定价“云业务”&“数据中心基建”两个增量逻辑： 对于软件，市场主要定价云业务需求的高增：云厂（亚马逊）、云服务商（CrowdStrike、Palo Alto Networks、Fortinet、Cloudflare、DataDog）； 对于硬件，市场对数据中心基建的关注度提升：AI服务器（戴尔科技）、AI网络（Arista网络）。", "publish_time": "2026-08-12 08:50", "tags": []}, "post:2026-08-12T09-14:2c344dec0919": {"id": "post:2026-08-12T09-14:2c344dec0919", "kind": "post", "title": "2026-08-12 09:14", "source_label": "帖子正文", "excerpt": "🇺🇸【申万策略】日观美股 20260812 美股震荡走弱，科技成长下跌 💲指数层面：今日，美股涨跌互现，成长优于价值，小盘优于大盘。标普500指数下跌0.32%，纳斯达克100指数下跌0.33%，道琼斯指数下跌0.34%，罗素2000上涨0.36%。", "content": "🇺🇸【申万策略】日观美股 20260812 美股震荡走弱，科技成长下跌 💲指数层面：今日，美股涨跌互现，成长优于价值，小盘优于大盘。标普500指数下跌0.32%，纳斯达克100指数下跌0.33%，道琼斯指数下跌0.34%，罗素2000上涨0.36%。下跌源于CPI公布前的谨慎观望、霍尔木兹海峡重开前景反复，以及AI融资泡沫担忧对科技巨头的打压，但板块分化明显，芯片股多数上涨、费城半导体指数涨0.87%，另类资产管理机构与BDC板块全线走强。美国7月成屋销售降至三个月低点，推动10年期美债收益率下行至4.69%，美元基本持平；黄金自两个月高位回落0.50%，布伦特原油盘中突破90美元后因调解方释放积极信号回落，收涨1.36%。 💰行业层面：表现前五的行业有电力设备(3.1%)，建筑装饰(1.5%)，轻工制造(1.3%)，建筑材料(1.2%)，公用事业(1.0%)；表现后五的行业有有色金属(-0.9%)，钢铁(-1.3%)，商贸零售(-1.4%)，纺织服饰(-2.2%)，传媒(-2.4%)。个股层面：M7指数下跌1.2%，谷歌下跌3.8%，领跌指数。围绕AI融资结构的争议在当日出现转折...", "publish_time": "2026-08-12 09:14", "tags": ["文字观点"]}, "post:2026-08-12T17-00:3ff8b6ba7479": {"id": "post:2026-08-12T17-00:3ff8b6ba7479", "kind": "post", "title": "2026-08-12 17:00", "source_label": "帖子正文", "excerpt": "韩国将要求单只杠杆交易所交易基金的新投资者进行模拟交易练习，进一步收紧对加剧市场波动的高风险产品的监管规定。", "content": "韩国将要求单只杠杆交易所交易基金的新投资者进行模拟交易练习，进一步收紧对加剧市场波动的高风险产品的监管规定。", "publish_time": "2026-08-12 17:00", "tags": []}, "attachment:files/创新药产业链2026年中期策略：前沿技术迭代，加速融入全球价值链20260811.pdf": {"id": "attachment:files/创新药产业链2026年中期策略：前沿技术迭代，加速融入全球价值链20260811.pdf", "kind": "attachment", "title": "创新药产业链2026年中期策略：前沿技术迭代，加速融入全球价值链20260811", "source_label": "其他", "excerpt": "Mikko的全球市场⽇志（2026年8⽉11⽇）\u0001 要闻\u0001 中国\u0001 • 总经理被追责，监管部⻔严惩“⻛格漂移”和“⼤V带货”\u0001 • 台积电积压10亿美元苹果处理器订单？郭明錤辟谣：库存上升属正常爬坡，⾮被动积压 \u0001 • AI服务器需求持续释放，⼯业富联上半年净利润同⽐增⻓96%\u0001 • 九号公司上半年营收增⻓22%，两轮⻋业务进⼊规模扩张阶段 • ⼩⽜电动⼆季", "content": "Mikko的全球市场⽇志（2026年8⽉11⽇）\u0001 要闻\u0001 中国\u0001 • 总经理被追责，监管部⻔严惩“⻛格漂移”和“⼤V带货”\u0001 • 台积电积压10亿美元苹果处理器订单？郭明錤辟谣：库存上升属正常爬坡，⾮被动积压 \u0001 • AI服务器需求持续释放，⼯业富联上半年净利润同⽐增⻓96%\u0001 • 九号公司上半年营收增⻓22%，两轮⻋业务进⼊规模扩张阶段 • ⼩⽜电动⼆季度销量增⻓24%，规模回升后仍需⾯对盈利压⼒ • 阅⽂加速IP掘⾦：短剧及AI漫剧半年收⼊占⽐超12%\u0001 • 康师傅上半年收⼊微增1.1%，产品结构调整推⾼利润\u0001 • ⻜猪推出“⻜猪帮帮”\u0001AI推向交易环节\u0001 • Manus：将恢复以独⽴公司的形式运营，部分⽤⼾数据将被删除\u0001 海外\u0001 • 美联储今年票委Hammack：⼀次加息⼒度不⾜，可能需要多次加息\u0001 • 新美联储通讯社：沃什“嘴硬”也敌不过数据，两份通胀报告或决定9⽉加息命运\u0001 • 美国7⽉成屋销售降⾄三个⽉低点，房价创同期新⾼，贷款利率升⾄⼀年⾼位\u0001 • 英国FCA筹备⻩⾦代币化监管框架，伦敦⼒守全球⾦市⻰头地位\u0001 • ⽇元逼近160关⼝，⼲预⻛险再度升温\u0001 • 韩国央⾏副⾏⻓：通胀持续⾼于⽬标，预计将继续加息\u0001 • 韩媒：SK海⼒⼠拟将中国⼯⼚NAND产能提⾼50%\u0001 • 霍尔⽊兹短期难重开，铝价连涨七⽇创七周新⾼\u0001 • OpenAI斥资70亿美元回购员⼯股份，估值8520亿美元静待上市窗⼝\u0001 • 3个⽉狂砸600亿美元！Anthropic再签91亿算⼒⼤单，与⽐特币矿企Riot达成⻓约\u0001 • Anthropic宣布Claude⽣成内容将嵌⼊隐形⽔印，复制粘贴后仍可追踪\u0001 • Meta开源最强AI模型，扎克伯格向OpenAI和Anthropic发起挑战\u0001 今⽇⽬录\u0001 • 全球失衡加剧谁在买单（1）\u0001 •欧洲股市被低估了吗（1）\u0001 • 农作物价格为何跟着油价⾛（1）\u0001 • 中国AI⼯业化出海新机遇（1）\u0001 ✏GS：IMF外部部⻔报告，全球失衡持续加剧\u0001 1.全球经常账⼾失衡在2025年进⼀步扩⼤，主要由亚洲盈余增加和⾚字国⾚字扩⼤驱动。 全球外部失衡（定义为经常账⼾盈余和⾚字的绝对值之和）占全球GDP的⽐重从2 024年的 3.6%上升⾄2025年的3.7%。这⼀趋势逆转了全球⾦融危机后⾄疫情期间失衡下降的局 ⾯。主要驱动因素是中国经常账⼾盈余⼤幅增加3000亿美元（相当于全球GDP的0.25%， 为过去25年来绝对值最⼤的\u0001widening），以及⼟⽿其、加拿⼤和英国⾚字的扩⼤。尽管 美国⾚字略有收窄（从GDP的-4.0%降⾄-3.6%），但全球失衡仍在加剧。\u0001 2.净国际投资头⼨（NIIP）存量略有收窄，估值效应抵消了部分流量失衡影响。尽管经常账 ⼾（流量）失衡扩⼤，但净国际投资头⼨（存量）在2025年略有收窄。这表明积极的估值 效应抵消了部分经常账⼾失衡的影响。美国作为最⼤的净债务国，其NIIP占GDP⽐重 从-90.6%收窄⾄-89.5%，得益于名义GDP增⻓强劲和美元⾛弱带来的有利汇率估值效 应。同时，⽯油出⼝国净债权头⼨的⼤幅下降也导致了整体存量的收窄。\u0001 3.IMF评估显⽰近半数经济体的外部平衡偏离基本⾯，呼吁协调政策⾏动。根据IMF的外部 平衡评估（EBA），近⼀半被评估经济体的经常账⼾余额和实际有效汇率进⼀步偏离了由 经济“基本⾯”隐含的⽔平。全球超额经常账⼾余额出现⼗年来最⼤增幅，主要由中国和 美国驱动。IMF指出，持续的巨额外部⾚字使经济体易受资本流动突然停⽌的影响，⽽过 度盈余则可能压低实际利率并积累系统性⾦融⻛险。因此，IMF呼吁盈余和⾚字经济体采 取协调的政策⾏动以⽀持外部再平衡。\u0001 4.⾼盛分析认为中国、韩国等盈余国头⼨“过正”，美英等⾚字国头⼨“过负”。⾼盛的分 析与IMF的评估⼤体⼀致。在⾼盛看来，中国⼤陆、韩国、中国台湾以及⼤多数发达市场 债权国（新加坡、瑞典、荷兰、德国和⽇本）的经常账⼾余额在两种框架下均显⽰为“过 于正⾯”（too\u0001positive）。相反，美国、英国、⼟⽿其和巴西的余额则显⽰为“过于负 ⾯”（too\u0001negative）\u0001 外部失衡（负值和正值）仍集中在发达市场⽽⾮新兴市场\u0001 ✏GS：欧洲，被忽视的跑赢者\u0001 1.欧洲盈利增⻓强劲，远超市场认知。上半年每股收益（EPS）同⽐增⻓14%，为三年来最 快增速。尽管⾯临能源供应冲击，但盈利复苏⼴泛且健康。⾼盛将2026年斯托克欧洲6 00 指数（STOXX\u0001Europe\u0001600）的EPS增⻓预测从10%上调⾄15%。剔除⼤宗商品板块后， EPS增⻓仍达7%，表明并⾮仅由商品周期驱动。\u0001 2.欧洲股本回报率（ROE）显著改善，估值具备吸引⼒。虽然欧洲ROE仍低于美国，但随着 利润率提升、回购增加以及银⾏业盈利能⼒恢复，ROE已明显改善。相⽐中国受产能过剩 和股东回报关注不⾜影响导致的低ROE，欧洲股市在国防⽀出、基础设施、电⽓化和数据 中⼼等主题转变中受益良多。此外，美国公司在所有增⻓区间的估值均⾼于欧洲，欧洲在 各⾏业的股息率也更⾼。\u0001 3.欧洲股市表现并⾮始终落后，近期显著跑赢。⾃2022年以来，欧洲银⾏股（SX7P）⼤幅 跑赢“美股七巨头”（Magnificent\u00017）。⾃2025年初以来，尽管⾯临关税冲击和能源危 机，斯托克欧洲600指数仍跑赢标普500指数。这得益于美国市场⾼起点估值、⾼利率对 ⻓久期科技股的打击以及对重资产、低过时⻛险（HALO）公司的偏好转移。\u0001 4.中国竞争威胁被⾼估，欧洲股市结构具有防御性。尽管中国汽⻋和化⼯⾏业受到中国出⼝ 增⻓的冲击，建议低配这些领域，但欧洲股市整体受中国低成本进⼝影响有限。⾦融、制 药、科技、能源、公⽤事业、电信和航空航天等主要板块并不特别脆弱。汽⻋股仅占欧洲 市值的1%，⽽科技硬件规模是其三倍。欧洲消费者反⽽可能从较低价格和通胀中受益， 提升实际收⼊和服务消费能⼒。\u0001 5.⾼能源价格对欧洲企业盈利呈正向⽀撑。与宏观经济不同，欧洲股市中能源和基础资源权 重较⾼，且公⽤事业、化⼯和⾦融⾏业能通过转嫁成本和受益于⾼利率/通胀⽽获利。只 有⾮必需消费品板块明显受损。只要需求不被严重抑制，⾼能源价格对多数欧洲上市公司 EPS具有⽀持作⽤。\u0001 6.资⾦流⼊强劲，并购活动活跃。欧洲股票正经历⼗年来（除2021年外）最佳资⾦流⼊，主 要由外国投资者驱动，旨在分散对美国和⾼估值资产的集中暴露。同时，企业通过回购 （尤其是银⾏和能源板块）和并购活动成为重要买家，⽀持了⼩盘股和并购⽬标篮⼦表 现。\u0001 7.欧洲在AI浪潮中虽落后但具备现⾦流优势。欧洲在数据中⼼建设和前沿模型投资上落后于 美国，但这可能使其避免过度资本⽀出带来的融资压⼒和回报质疑。欧洲公司产⽣⼤量⾃ 由现⾦流，收益率⾼于债券及美国市场，且在AI投资回报受质疑时，这种“现⾦⽣成者” ⻆⾊成为优势，提供对冲价值。\u0001 欧洲股市表现优于中国股市\u0001 ✏GS：为何农作物价格⽇益跟随燃料价格波动\u0001 1.⽣物燃料需求受政策和油价驱动，正成为农作物价格的关键决定因素。⽣物燃料⾏业规模 约为350万桶/⽇，主要⽤于交通运输，且⾼度集中在美国、巴西和欧盟，这三者占全球产 量的80%左右。2026年上半年较⾼的油价提振了⽣物燃料需求，同时出于能源多样化和 农场收⼊⽀持的考虑，各国政府可能进⼀步提⾼混合⽐例强制要求（如巴西提升⾄E32， 印度尼西亚提升⾄B50）。随着⽣物燃料需求增⻓，更多农作物从⻝品和饲料领域转向燃 料⽣产，导致⽣物燃料需求与农作物价格之间的联系⽇益紧密。\u0001 2.不同⽣物燃料使⽤不同的原料，地域资源禀赋决定⽣产类型。⼄醇由⽟⽶和⽢蔗制成，混 ⼊汽油中；⽣物柴油由⼤⾖、油菜籽和棕榈油等植物油制成，混⼊柴油中；可再⽣柴油主 要由废弃脂肪和废弃⻝⽤油制成，可直接替代传统柴油。当地原料的可获得性往往决定了 ⽣物燃料的类型：美国专注于⽟⽶⼄醇，巴西专注于⽢蔗和⽟⽶⼄醇，印度尼西亚专注于 棕榈⽣物柴油，欧洲专注于油菜籽⽣物柴油。\u0001 3.“混合墙”限制⽣物燃料需求增⻓，但政策强制⼒⽀撑需求底线。在美国和欧洲，燃料混 合强制要求主要决定了⽣物燃料需求，因为政府⽀持农场收⼊和能源多元化。在巴西，较 ⾼的燃料价格和政府对⽣物燃料的补贴使其相对于⽯油燃料更具竞争⼒，⿎励司机切换燃 料。然⽽，“混合墙”（现有燃料基础设施、发动机和⻋队所能吸收的⽣物燃料最⼤份 额）最终限制了美国和欧盟⽣物燃料需求的增⻓。尽管存在短期供应灵活性（如巴西糖⼚ 可在糖和⼄醇⽣产之间切换⽢蔗⽤途），但原料供应在作物年度内最终是固定的，新建加 ⼯产能需要时间。因此，强劲的⽣物燃料需求往往会通过加剧粮⻝、饲料和燃料对农作物 的竞争来⽀撑原料价格。\u0001 ⽤于⽣产⽣物柴油的作物⽐例上升可能减少⻝品和饲料的可⽤性\u0001 ✏GS：中国AI⼯业化时代\u0001 1.中国进⼊“出海3.0”时代，AI驱动的⼯业能⼒出⼝成为新增⻓极。中国出⼝正从1.0时代 的低成本制造和2.0时代的“新三样”（电动⻋、锂电、光伏）转向3.0时代，即以AI赋 能、技术领先的⼯业能⼒出⼝为主，涵盖AI数据中⼼电⼒基础设施到物理AI（机器⼈与⾃ 动化）。报告将11种产品出⼝机会分为四类原型：“瓶颈解决者”、“技术升级者”、 “成熟全球玩家”和“独特机会”，并预测不同类别的海外轨迹将显著分化。\u0001 2.“瓶颈解决者”中期收益最⼤，⻓期成功需观察；“技术升级者”凭借快速迭代脱颖⽽ 出。预计2026-2030年，“瓶颈解决者”（如变压器、开关柜、UPS、燃⽓轮机部件）将 因全球供需缺⼝获得最⼤的市场份额增益和利润率提升，⾼盛对思源电⽓、科华数据和应 流股份给予“买⼊”评级。紧随其后的是“技术升级者”（如液冷、电源模块、继电 器），其关键在于快速⼯程和技术迭代，⾼盛对英维克给予“买⼊”评级。然⽽，2030年 后的可持续性取决于供需缺⼝的持续时间以及满⾜全球公⽤事业和⼯业客⼾严格运营标准 的能⼒。\u0001 3.“成熟全球玩家”⾯临中期阵痛，监管与市场准⼊是主要障碍。储能系统（ESS）和⼈形 机器⼈等“成熟全球”领域在中期内⾯临强烈的市场准⼊逆⻛，需应对复杂的国际监管、 安全和环境合规框架。⾼盛对阳光电源维持“中性”评级。尽管中国⼯业机器⼈和⾃动化 领导者（如汇川技术、埃斯顿）在中期的海外起步较慢，但其强⼤的产品/技术竞争⼒、 研发迭代速度和成本优势使其成为潜在的⻓期赢家。\u0001 中国领先企业与全球同⾏的海外市场价格⽐较\u0001 看推\u0001 看跌期权需求骤降，市场恐慌情绪缓解\u0001 债市看增⻓，股市看通胀\u0001 莫迪\"印度制造\"⼗年：制造业占GDP⽐重不升反降\u0001 欧洲股市盈利增速创2022年以来新⾼，带动股指历史新⾼\u0001 2026年6⽉半导体销售预测：内存芯⽚引领爆发式增⻓\u0001 AI军备竞赛：四⼤科技公司投资额堪⽐国防开⽀\u0001 中国⻩⾦储备与国际⾦价⾛势图\u0001", "status": "extracted"}, "attachment:files/市场再平衡后的食品饮料配置策略20260810.pdf": {"id": "attachment:files/市场再平衡后的食品饮料配置策略20260810.pdf", "kind": "attachment", "title": "市场再平衡后的食品饮料配置策略20260810", "source_label": "其他", "excerpt": "Mikko的全球市场⽇志（2026年8⽉11⽇）\u0001 要闻\u0001 中国\u0001 • 总经理被追责，监管部⻔严惩“⻛格漂移”和“⼤V带货”\u0001 • 台积电积压10亿美元苹果处理器订单？郭明錤辟谣：库存上升属正常爬坡，⾮被动积压 \u0001 • AI服务器需求持续释放，⼯业富联上半年净利润同⽐增⻓96%\u0001 • 九号公司上半年营收增⻓22%，两轮⻋业务进⼊规模扩张阶段 • ⼩⽜电动⼆季", "content": "Mikko的全球市场⽇志（2026年8⽉11⽇）\u0001 要闻\u0001 中国\u0001 • 总经理被追责，监管部⻔严惩“⻛格漂移”和“⼤V带货”\u0001 • 台积电积压10亿美元苹果处理器订单？郭明錤辟谣：库存上升属正常爬坡，⾮被动积压 \u0001 • AI服务器需求持续释放，⼯业富联上半年净利润同⽐增⻓96%\u0001 • 九号公司上半年营收增⻓22%，两轮⻋业务进⼊规模扩张阶段 • ⼩⽜电动⼆季度销量增⻓24%，规模回升后仍需⾯对盈利压⼒ • 阅⽂加速IP掘⾦：短剧及AI漫剧半年收⼊占⽐超 设施、电⽓化和数据 中⼼等主题转变中受益良多。此外，美国公司在所有增⻓区间的估值均⾼于欧洲，欧洲在 各⾏业的股息率也更⾼。\u0001 3.欧洲股市表现并⾮始终落后，近期显著跑赢。⾃2022年以来，欧洲银⾏股（SX7P）⼤幅 跑赢“美股七巨头”（Magnificent\u00017）。⾃2025年初以来，尽管⾯临关税冲击和能源危 机，斯托克欧洲600指数仍跑赢标普500指数。这得益于美国市场⾼起点估值、⾼利率对 ⻓久期科技股的打击以及对重资产、低过时⻛险（HALO）公司的偏好转移。\u0001 4.中国竞争威胁被⾼估，欧洲股市结构具有防御性。尽管中国汽⻋和化⼯⾏业受到中国出⼝ 增⻓的冲击，建议低配这些领域，但欧洲股市整体受中国低成本进⼝影响有限。⾦融、制 药、科技、能源、公⽤事业、电信和航空航天等主要板块并不特别脆弱。汽⻋股仅占欧洲 市值的1%，⽽科技硬件规模是其三倍。欧洲消费者反⽽可能从较低价格和通胀中受益， 提升实际收⼊和服务消费能⼒。\u0001 5.⾼能源价格对欧洲企业盈利呈正向⽀撑。与宏观经济不同，欧洲股市中能源和基础资源权 重较⾼，且公⽤事业、化⼯和⾦融⾏业能通过转嫁成本和受益于⾼利率/通胀⽽获利。只 有⾮必需消费品板块明显受损。只要需求不被严重抑制，⾼能源价格对多数欧洲上市公司 EPS具有⽀持作⽤。\u0001 6.资⾦流⼊强劲，并购活动活跃。欧洲股票正经历⼗年来（除2021年外）最佳资⾦流⼊，主 要由外国投资者驱动，旨在分散对美国和⾼估值资产的集中暴露。同时，企业通过回购 （尤其是银⾏和能源板块）和并购活动成为重要买家，⽀持了⼩盘股和并购⽬标篮⼦表 现。\u0001 7.欧洲在AI浪潮中虽落后但具备现⾦流优势。欧洲在数据中⼼建设和前沿模型投资上落后于 美国，但这可能使其避免过度资本⽀出带来的融资压⼒和回报质疑。欧洲公司产⽣⼤量⾃ 由现⾦流，收益率⾼于债券及美国市场，且在AI投资回报受质疑时，这种“现⾦⽣成者” ⻆⾊成为优势，提供对冲价值。\u0001 欧洲股市表现优于中国股市\u0001 ✏GS：为何农作物价格⽇益跟随燃料价格波动\u0001 1.⽣物燃料需求受政策和油价驱动，正成为农作物价格的关键决定因素。⽣物燃料⾏业规模 约为350万桶/⽇，主要⽤于交通运输，且⾼度集中在美国、巴西和欧盟，这三者占全球产 量的80%左右。2026年上半年较⾼的油价提振了⽣物燃料需求，同时出于能源多样化和 农场收⼊⽀持的考虑，各国政府可能进⼀步提⾼混合⽐例强制要求（如巴西提升⾄E32， 印度尼西亚提升⾄B50）。随着⽣物燃料需求增⻓，更多农作物从⻝品和饲料领域转向燃 料⽣产，导致⽣物燃料需求与农作物价格之间的联系⽇益紧密。\u0001 2.不同⽣物燃料使⽤不同的原料，地域资源禀赋决定⽣产类型。⼄醇由⽟⽶和⽢蔗制成，混 ⼊汽油中；⽣物柴油由⼤⾖、油菜籽和棕榈油等植物油制成，混⼊柴油中；可再⽣柴油主 要由废弃脂肪和废弃⻝⽤油制成，可直接替代传统柴油。当地原料的可获得性往往决定了 ⽣物燃料的类型：美国专注于⽟⽶⼄醇，巴西专注于⽢蔗和⽟⽶⼄醇，印度尼西亚专注于 棕榈⽣物柴油，欧洲专注于油菜籽⽣物柴油。\u0001 3.“混合墙”限制⽣物燃料需求增⻓，但政策强制⼒⽀撑需求底线。在美国和欧洲，燃料混 合强制要求主要决定了⽣物燃料需求，因为政府⽀持农场收⼊和能源多元化。在巴西，较 ⾼的燃料价格和政府对⽣物燃料的补贴使其相对于⽯油燃料更具竞争⼒，⿎励司机切换燃 料。然⽽，“混合墙”（现有燃料基础设施、发动机和⻋队所能吸收的⽣物燃料最⼤份 额）最终限制了美国和欧盟⽣物燃料需求的增⻓。尽管存在短期供应灵活性（如巴西糖⼚ 可在糖和⼄醇⽣产之间切换⽢蔗⽤途），但原料供应在作物年度内最终是固定的，新建加 ⼯产能需要时间。因此，强劲的⽣物燃料需求往往会通过加剧粮⻝、饲料和燃料对农作物 的竞争来⽀撑原料价格。\u0001 ⽤于⽣产⽣物柴油的作物⽐例上升可能减少⻝品和饲料的可⽤性\u0001 ✏GS：中国AI⼯业化时代\u0001 1.中国进⼊“出海3.0”时代，AI驱动的⼯业能⼒出⼝成为新增⻓极。中国出⼝正从1.0时代 的低成本制造和2.0时代的“新三样”（电动⻋、锂电、光伏）转向3.0时代，即以AI赋 能、技术领先的⼯业能⼒出⼝为主，涵盖AI数据中⼼电⼒基础设施到物理AI（机器⼈与⾃ 动化）。报告将11种产品出⼝机会分为四类原型：“瓶颈解决者”、“技术升级者”、 “成熟全球玩家”和“独特机会”，并预测不同类别的海外轨迹将显著分化。\u0001 2.“瓶颈解决者”中期收益最⼤，⻓期成功需观察；“技术升级者”凭借快速迭代脱颖⽽ 出。预计2026-2030年，“瓶颈解决者”（如变压器、开关柜、UPS、燃⽓轮机部件）将 因全球供需缺⼝获得最⼤的市场份额增益和利润率提升，⾼盛对思源电⽓、科华数据和应 流股份给予“买⼊”评级。紧随其后的是“技术升级者”（如液冷、电源模块、继电 器），其关键在于快速⼯程和技术迭代，⾼盛对英维克给予“买⼊”评级。然⽽，2030年 后的可持续性取决于供需缺⼝的持续时间以及满⾜全球公⽤事业和⼯业客⼾严格运营标准 的能⼒。\u0001 3.“成熟全球玩家”⾯临中期阵痛，监管与市场准⼊是主要障碍。储能系统（ESS）和⼈形 机器⼈等“成熟全球”领域在中期内⾯临强烈的市场准⼊逆⻛，需应对复杂的国际监管、 安全和环境合规框架。⾼盛对阳光电源维持“中性”评级。尽管中国⼯业机器⼈和⾃动化 领导者（如汇川技术、埃斯顿）在中期的海外起步较慢，但其强⼤的产品/技术竞争⼒、 研发迭代速度和成本优势使其成为潜在的⻓期赢家。\u0001 中国领先企业与全球同⾏的海外市场价格⽐较\u0001 看推\u0001 看跌期权需求骤降，市场恐慌情绪缓解\u0001 债市看增⻓，股市看通胀\u0001 莫迪\"印度制造\"⼗年：制造业占GDP⽐重不升反降\u0001 欧洲股市盈利增速创2022年以来新⾼，带动股指历史新⾼\u0001 2026年6⽉半导体销售预测：内存芯⽚引领爆发式增⻓\u0001 AI军备竞赛：四⼤科技公司投资额堪⽐国防开⽀\u0001 中国⻩⾦储备与国际⾦价⾛势图\u0001", "status": "extracted"}, "post:2026-08-12T11-11:858ddab9a617": {"id": "post:2026-08-12T11-11:858ddab9a617", "kind": "post", "title": "2026-08-12 11:11", "source_label": "帖子正文", "excerpt": "【国联民生电子】工业富联2026半年报点评：AI算力需求持续增长，业绩进入快速增长模式业绩速览： ➠公司发布2026半年度业绩，报告期内实现营收5,578.61亿元，同比+54.63% ➠归母净利润237.40亿元，同比+95.99% ➠扣非后归母净利润229.84亿元，同比+96.99%。➠毛利率", "content": "【国联民生电子】工业富联2026半年报点评：AI算力需求持续增长，业绩进入快速增长模式业绩速览： ➠公司发布2026半年度业绩，报告期内实现营收5,578.61亿元，同比+54.63% ➠归母净利润237.40亿元，同比+95.99% ➠扣非后归母净利润229.84亿元，同比+96.99%。 ➠毛利率7.15%，同比+55bp；净利率4.26%，同比+90bp业绩看点： 1️⃣H1云计算业务营收同比+75.7%，#其中AI服务器收入同比增加2.3倍，GPU AI机柜出货量同比+3.2倍，ASIC AI机柜同比+3倍。 ➠公司深度绑定全球头部云服务商，Vera Rubin平台前瞻卡位，液冷、整机柜设计等垂直整合能力构成公司坚实护城河。 ➠通信网络方面，800G以上高速交换机出货同比+1.4倍，#CPO全光交换机已实现样机交付，产品组合全面覆盖Ethernet、InfiniBand及NVLink Switch，有望打开第三成长曲线。 2️⃣盈利质量大幅跃升，公司AI相关业务占比持续扩大，产品结构向高价值环节升级，#规模效应叠加技术溢价推动利润增速远超收入增速。 3️⃣回购计划发布，管理...", "publish_time": "2026-08-12 11:11", "tags": ["充分彰显管理层对长期价值的坚定信心", "文字观点"]}, "post:2026-08-12T14-01:0d07bbaf3c5b": {"id": "post:2026-08-12T14-01:0d07bbaf3c5b", "kind": "post", "title": "2026-08-12 14:01", "source_label": "帖子正文", "excerpt": "【广发机械】长川科技更新：大客户进展超预期，两千亿只是新起点 #H大客户进展超预期。公司GPU测试机深度绑定头部国产算力厂商，#有望拿下H公司最新一代GPU系列相关测试设备所有份额，未来将全面受益于TAO定律。", "content": "【广发机械】长川科技更新：大客户进展超预期，两千亿只是新起点 #H大客户进展超预期。公司GPU测试机深度绑定头部国产算力厂商，#有望拿下H公司最新一代GPU系列相关测试设备所有份额，未来将全面受益于TAO定律。同时下游先进制程与存储扩产共振，公司存储26年全面放量。 #板级封装（玻璃基板）核心标的。收购新加坡公司布局板级封装与TCB设备，在未来的COPOS板级封装大潮中，公司有望成为国内外核心标的，TCB设备已经在大 互联） ：AI 集群规模从数千卡扩展至数万甚至数十万卡，网络互联成为制约整体性能的关 键。传统可插拔光模块在带宽密度、功耗、延迟方面难以满足下一代 AI 基础设施需求， CPO（共 封装光学） 技术应运而生，显著缩短电信号传输距离，降低功耗 30%–50%并提升带宽密度。PCB 方面，2025 年全球市场规模约 800 亿美金 ，2026 年预计达 900 多亿美金 ，服务器/数据存储 PCB 需求将大幅增长，HDI 在服务器数据中心占比将从 3%左右提升至 2030 年的接近 30% 。 3.Agent 时代与 CPU 产业链 Agent 时代需要上下文处理和多步骤任务执行，CPU 算力正从配角转变为核心角色，成为维持系统 吞吐量和整体成本的关键因素。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª AMD 预计服务器 CPU 市场总规模以每年 超过 35% 的速度增长，整体市场规模有望达到 1500 亿 美金甚至更多 （当前仅数百亿美金量级）。 CPU 产业链相关方向值得重点关注。 4.AI 产业趋势下的 A 股重点公司梳理 存：相关存储/HBM 产业链公司。 算：国内 ASIC 芯片龙头，包括昇腾、寒武纪、昆仑芯、海博等。 电：功率领域关注斯达半导（原文“清洁能”疑为口误，结合上下文应为斯达半导或类似功率龙 头）；模拟关注圣邦股份；三代半关注天岳先进等。 连：光模块之外，PCB 关注沪电股份（原文“互变酸奶”疑为口误）、上游生益科技（原文“蜂蜜 新生”疑为口误）等。 CPU：关注澜起科技（原文“蓝旗”疑为口误）、海光信息，以及 CPU 封测环节的通富微电等。 5.半导体自主可控与国产替代 全球存储与先进制程产能紧缺，扩产共振；国内存储扩产逻辑未来几年持续加速向上。预计未来 2– 3 年全球资本开支增速 20%–30% ，国内增速 40%–50% 。 国内存储产线（如长江存储、长鑫存储）国产化比例持续提升，先进制程（中芯国际、华虹）国产 化比例有序提升。设备厂订单既受益行业贝塔增长，又受益国产化率提升的阿尔法，部分设备公司 订单增速可达 60%–70%甚至更高 。代表性公司：中微公司、北方华创（原文“飞车”疑为口 误）、拓荆科技、芯源微、盛美上海（原文“巴萨金科”疑为口误）等。 零部件 ：全球零部件厂商处于供不应求状态，国内零部件厂商扩产更积极灵活，三重受益（设备厂 订单增长、海外零部件交付不足带来的国产替代、海外设备厂主动寻求国内零部件供应），订单增 速可观。代表性公司：富创精密、江丰电子（原文“江峰”疑为口误）、正帆科技（原文“郑帆” 疑为口误）、神工股份等。 材料：随着晶圆产能落地，材料需求持续向上，未来几年需求确定性强。代表性公司包括安集科 技、鼎龙股份、兴发集团（原文“新娘”疑为口误）、江丰电子、雅克科技（原文“广告”疑为口 误）等。 6.晶圆制造与先进封测 国产算力大爆发背景下，上游晶圆制造产能与先进封测产能成为关键瓶颈。 今明两年决定国内算力 芯片的不是需求，更多是供给 。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 国内晶圆代工龙头（中芯国际、华虹）今年将实现良率改善、产能提升和工艺优化，产能有望大幅 改善。 先进封测（2.5D CoWoS、3D HBM 堆叠封装）已成为 AI 算力芯片成本端重要组成部分，今明两 年严重供不应求，国内厂商积极扩产将持续受益。相关公司：长电科技、通富微电、甬矽电子（原 文“永西”疑为口误），配套设备公司如长川科技、华峰测控（原文“华丰”疑为口误）、金海 通，第三方测试伟测科技等。 算力芯片公司 ：国产算力芯片处于严重供不应求状态，能够在上游资源/产能端获得确定性保障的公 司成长确定性更强。关注华为昇腾产业链、寒武纪及二线算力芯片公司。 7.消费电子与端侧 AI AI 持续向端侧延伸，苹果作为 AI 端侧代表性企业，进入“硬件优先+工程主导设计”的新时代。硬 件创新带动单机零部件 ASP 提升，供应链固定资产投入与设备采购周期加速，产线改造、模具更新 和新工艺导入频率提升，利好上游设备厂商。 除苹果外，AIPC、AI 手机、AI 眼镜等端侧方向亦值得持续关注，配套消费电子龙头和端侧单机价 值量提升机会值得重视。 问答整理 Q1：当前市场对存储方向存在分歧，如何看待？ 答：近期市场对存储的分歧更多体现在价格层面，即认为价格已处于较高水平、担心反噬需求，而非需 求端出现问题或供需格局逆转。推理侧在产业中的权重快速提升，对“纯算电联”提出均衡且苛刻的要 求，存储带宽和容量是托底推理性能的首要瓶颈，HBM 在 AI 芯片组件总支出中占比已超过 50%，存 储需求的基本面依然扎实。 Q2：国内半导体设备、零部件、材料公司的成长逻辑是什么？ 答：全球存储 有优化空间，公司...", "publish_time": "2026-08-12 21:38", "tags": ["文字观点"]}, "attachment:files/海外储能近况更新.docx": {"id": "attachment:files/海外储能近况更新.docx", "kind": "attachment", "title": "海外储能近况更新", "source_label": "其他", "excerpt": "前几周，我们讨论了国内一些相对热点的省份的储能情况。今天，我们非常荣幸地邀请到了一位国内头部企业在海外大储市场深耕多年的资深专家，来更新海外大储及整体储能的情况。", "content": "前几周，我们讨论了国内一些相对热点的省份的储能情况。今天，我们非常荣幸地邀请到了一位国内头部企业在海外大储市场深耕多年的资深专家，来更新海外大储及整体储能的情况。专家，您能听到吗？ 专家：可以，好。 分析师：首先，能否请您更新一下对2027年海外储能需求的整体展望？先看大储，我们提到2025年大储大约300吉瓦时，那么您对2027年的装机预期是什么？然后，能否细分到大储、户储、工商储等不同类别？ 专家：可以。我先说一下大储。今年海外几个市场应该都挺不错的。像欧洲这边，今年我们看到有一个爆发。原先预计欧洲今年可能只装30吉瓦时左右，因为去年欧洲是17到18吉瓦时。但今年，我们实际看到欧洲能够落地的订单超过40吉瓦时，即能够形成装机的。主要推动动因是，除了正常西欧等国家的储能项目有序发展外，中欧和东欧的独立储能需求量在激增。 欧洲近期刚举办了Intersolar，在六月份于德国举行。在这个展会上，各个企业都公布了自己的一些新项目pipeline。例如，海博思创是欧洲的新进入者，它做欧洲市场并不算特别大或早，但海博思创宣布今年上半年就在欧洲签了10吉瓦时的订单。特斯拉上海工厂则收到了特斯拉欧洲超过25吉瓦时的两年锁单，相当于它一大半的产能预留给了欧洲。所以，仅这两家企业加起来半年就有35吉瓦时的订单。 从整个市场来看，未来两年（今年和明年），欧洲可能确实能做到累计100多吉瓦时。今年大约40吉瓦时，明年相对稳定，可能达到60吉瓦时。北美这边，发展正常。IRA法案实行的第一年，今年有不少项目在安全港内，我们预计今年北美能做到大约60吉瓦时，明年可能冲击75到80吉瓦时。我们也在密切关注北美大容量并网法案能否落地，如果落地，将进一步加速储能增长。 大容量并网法案旨在便利用户用电大户，尤其是数据中心并网，如果配置储能，可以进一步加速并网。所以这块我们看也比较大，相当于整个欧美今年有100吉瓦时的当量。 剩下的市场，比如澳洲，今年应该能达到大约12吉瓦时，明年差不多15吉瓦时，这是我们的判断。澳洲整体体量比不过欧美，但仍在增长。澳洲大储一直是相对长周期的项目，开发难度也高，但开发成功后利润率较高，所以设备价格相对还可以。 中东也是近年来储能的一个大市场。今年上半年受到美伊战争影响，所以考虑到一些项目延期和执行拖期，今年能形成装机的可能和去年差不多，大约十几个吉瓦时，不到20吉瓦时。明年应该会有较大增长，因为今年执行的阿布扎比数据中心项目，阳光和比亚迪加起来就有20吉瓦时左右，这些应该都在明年形成装机。还有沙特有8吉瓦时的项目，以及其他北非等区域的项目，加起来明年中东装机可能达到30吉瓦时。 中东肯定是一个很好的发展亮点。例如，数据中心配储，因为中东新能源资源是全球数一数二的。此外，由于新能源渗透率较高，导致电网对储能的需求。所以，中东是我们长期看好的市场。 今年比较惊喜的还有东南亚。在菲律宾等地区，我们单体看到的项目已经有吉瓦时级。今年整个东南亚可能形成装机，大约七八个吉瓦时，明年肯定翻倍。 东南亚的增长有几个原因。首先，它本身有很多能源依托天然气，但国际气价受美伊战争影响波动很大，所以他们在进行能源转型。其次，美伊战争对中东数据中心发展有影响，美国海外数据中心可能不敢放在中东，转而放到东南亚，所以有一部分数据中心向东南亚转移。例如，马来西亚，现在美国有好几个数据中心都说要放在马来西亚，这大大加速了当地储能的发展。 印度这个国家，虽然储能一直不是好市场，价格低、商务条款差，但光伏装机不少，未来可能是一个每年10到20吉瓦时的单独市场。印度今年加上东南亚可能达到10吉瓦时，拉美大约5吉瓦时，未来也在增长。所以全球各个地区都在增长。中国今年看250吉瓦时，海外加起来大约200吉瓦时，所以今年大储总装机大约450吉瓦时。 至于工商业和户用，这个数据我确实不掌握。但从面上来看，我们公司做电芯，工商业和户用都是我们的客户。从今年需求来看，还是有很多客户在买我们的电芯。户用这边，澳洲现在没有补贴了，或者补贴有变化，所以澳洲对我们户用电芯的量没有明显增长。大概就是这样。 分析师：也就是说，您刚才算的基本上是2026年，可能奔着450吉瓦时去。2027年肯定有增长，但增速可能落在40%到50%的量级，还是更高？总体来看，我们先不看国内。 专家：差不多。国外增长速度其实不慢，因为很多地区体量小，所以增速可能比国内大一些。国外起点低，40%的增速是存在的。 分析师：明白。然后细分市场再请教一下。美国是市场比较关心的，您提到今年60吉瓦时，明年75吉瓦时。如果我没记错，在大储里，像电网做的风光配套和AIDC配储，各自比例是多少？有拆分吗？ 专家：差不多。AI今年占10%左右，明年可能到30%到40%，剩下的就是独立储能和风光配储在美国。 分析师：明白。也就是说，明年额外增量有相当部分来自AIDC配储。 专家：对。因为AI作为电源，比例越来越高，所以储能增长也越来越大。 分析师：明白。您刚刚提到的三种类型（独储、风光配储、AIDC配储），受到本地化条款冲击的程度不同吗？还是整体大差不差，都会受影响？ 专家：是这样。从业主角度来说，首先，对美国政府来说，这些都是储能项目，理论上冲击是一样的。例如，直流侧要用合规电池，如果没有进安全港，交流侧有SCC出来，对新产品肯定有影响。但实际上，数据中心客户主要以急为主，他们急着要产品，对成本不那么敏感。比如，是否拿补贴，对数据中心来说不像普通商业储能那么敏感。 但SCC出来后，对中国SST的具体落地，包括新款PCS在美国确实受影响。老款产品目前看可以继续用，市场接纳度高，提前做过认证的，不受这次SCC要求影响。但新产品，尤其是与SST挂钩的PCS一起落地，后面可能会受影响，且影响较大。这块对所有影响都一样，尤其数据中心可能更关注，因为他们要讲究合规。 分析师：明白。所以在2026年或老产品的情况下，客户可能不太关心。但对于后续新产品要进入，客户关注点会更高。 专家：现在大概了解。因为老产品已经通过认证，他管不了，认证通过就可以用。FCC是对新产品，认证可能有问题。 分析师：数据中心也有用燃气轮机加储能的表后微网方案。刚才您提到2027年，再往远期展望，您觉得这块增长的持续性会很强吗？ 专家：会。因为数据中心频率波动很大，经常一会儿30%负荷，一会儿120%负荷。在做数据归集和演算时，功率变化很大，且经常瞬间变化，对电网频率冲击大。虽然燃机在能量方面能提供很好支撑，电能质量比新能源加储能好，但燃机调节速度比储能慢得多。数据中心对电网的冲击是瞬时的，所以需要燃机和电化学储能配合。例如，先用储能顶住前8秒，再用燃机服务。所以，燃机和储能的配合一定会继续下去。 我们的判断是，一方面燃机和储能配合，另一方面燃机比较紧缺。全球燃机需求和供给的缺口在2035年似乎都解决不了。所以，后面会有越来越多项目往光伏走。如果往光伏走，储能配比会更大，因为光伏需要更多能量搬移。储能和燃机主要还是注重在调频服务上。 分析师：这种调频逻辑下，在主流的架构里，配比、时长、放电速度有什么要求？一般在什么区间？ 专家：这个确实因项目而异，没有标准方案。但我们接触的项目中，较多的是按燃机20%配4小时，或如果小时数低，比例更大。例如，功率按30%到40%配，能量与燃机功率的比例接近0.8到1。 分析师：倍率性能上有什么要求吗？ 专家：或者说时长。放电速度与时长相干，放电时长越长，速度越慢。目前更多往长时储能走。倍率方面，除非做到2C、3C，数据中心确实有需求，但锂电完成不了，只能通过钠电。现在锂电只能在时长上放得更长，让数据中心更多冗余。例如，用四倍容量服务调频，肯定绰绰有余。 但挑战倍率方面，数据中心有闪充闪放需求，这通过锂电池技术无法满足，需要等到钠电更成熟。所以，现在数据中心业务，尤其美国，有一个方向是往钠电转，未来钠电储能可能成为基调。 分析师：2027年可能30%到40%，这还是基于锂电的需求。 专家：钠电到2028年可能真的有很大商业化落地。 分析师：明白。那在您提到的10%到30%里，有多少来自燃气轮机配储，多少来自纯离网光伏？有拆分吗？ 专家：现在拆不了那么细。但纯离网光储还需要时间，因为在美国做纯离网光储不经济。但它是一种发展方向，未来量可能会起来。美国现在主要在海外项目试点，像中东项目就是纯离网储能，配比很大，接近20倍，不是1:1，而是1:20。 分析师：另一个问题，在美国如果现在这么做，经济账他们不关心吗？ 专家：或者说算不过来。肯定关心，因为美国网电是天然气定价，落地电价大约七八美分。有人测算过，用光伏得干到13到14美分，成本还是差将近两倍。 分析师：所以，您提到未来体量的前提是，建设紧迫度需求已经高于阶段性经济性诉求，然后才会有相对规模较多的光伏项目体量。我能这么理解吗？ 专家：我觉得是这样的。未来储能响应速度更高，系统更合理，超配会变少，成本会降下来。但光储一体方案一定要在中东或东南亚这种光照好、成本低的地方，才有好的发展空间。在美国，目前看来还是概念方案，经济账算出来肯定更贵。 分析师：明白，很清楚。第二块是欧洲。您刚才提到整体欧洲大储很好。能否更细致拆分一下，比如东欧和西欧，今年和明年的驱动因素是否不同？各自市场分化的特征是什么？ 专家：其实没有太多不同。欧洲电力市场相对市场化，新能源渗透率很高。以前欧洲靠燃机抵消新能源渗透率的影响。渗透率一上来，对可调节能源的需求就很大。欧洲现在都在转绿色，所以燃煤肯定不干了。以前靠燃气，但俄乌战争和美伊战争导致天然气价格不稳定，供给不稳定，容易被卡脖子，所以燃气也不发展。 欧洲原先，尤其是欧盟地区，靠核电。但现在核电有的退役了，新的核电得7到10年才能落地。所以综合来看，只有通过增加储能来满足发展。此外，欧洲也在搞数据中心业务，需要配储。欧洲没办法，只能做光伏，光伏是最便宜且可行的能源形式。所以，欧洲整体底层逻辑还是一样的。 分析师：明白。简单来说，只要欧洲未来有电力需求，光伏的天花板短期内可能看不到，会持续增长。 专家：增加它的天花板。可能等七八年后核电上来，才会有天花板。现在短期内核电上不来，基本没有天花板。 分析师：OK明白。第二个欧洲相关问题，制裁、贸易壁垒等，您实际感受下来有影响吗？对于订单，上半年都很好，未来对欧洲呢？ 专家：有一些小影响。就PCS这块，目前有一些东欧项目可能拿欧开行、EBRD的融资，这会对数据中心有一定影响。不是，sorry，会对中国的PCS有一些影响。但这跟美国一样，美国现在搞中资企业与欧美企业合作PCS。现在欧洲也是，PE、SMA这些本土品牌本身也与中国企业合作。所以对中资企业直流侧和集成的影响不大，可能对PCS销售有一些小影响。但欧洲对直流侧没有太大限制，且欧洲没有本土化直流侧能力，所以直流侧80%多还是从中国来。 分析师：明白。所以欧洲阶段性不需要担心太多。了解。然后中东市场，今年下半年，我们会看到沙特、阿联酋、阿曼等有更多大型储能招标释放吗？您大概有听说吗？ 专家：对，好说。这个很好统计。中东新项目，不算上礼拜刚开始的DEWA 7，8吉瓦时储能项目。那个项目我刚刚在另一场咨询中讲过，是上礼拜刚开标。 这个项目是光伏光储一体给电网，综合报一个电价，提供稳定的负荷。三家公司投标大约2.1美分。这给出了一个概念，在中东做光伏，发电成本大约2美分出头。但这不是24小时不间断电源，有负荷，但成本也很便宜，换算成人民币大约0.16到0.17元，在中国也是很便宜的电价。 这个项目明年交付，应该是比亚迪中标。比亚迪和业主是同一个，因为数据中心业主是Masdar，这个项目的中标业主也是Masdar。两个项目肯定有协调，因为数据中心项目给比亚迪的价格还可以。 新项目，比如马上要招标的，沙特有一个12吉瓦时的单体项目，7月份发了全球邀标。阿联酋数据中心要干二期，听说二期是40吉瓦时量级。所以仅这两个项目就52吉瓦时。还有中东其他很多，每个中东国家基本都有约1吉瓦时的pipeline。所以，整个中东新项目越来越多。 分析师：明白。主要催化是数据中心迁过去后，整体需求很大。 专家：对于光伏，中东与欧洲有点类似。中东集中化更强。过去5到6年，中东干了很多光伏，光沙特一个国家一年就20吉瓦光伏。中东本来没有煤电，核电也很少，只有一个阿联酋核电，还没并网。以前靠天然气做调频，但现在燃机很难买。 第二，中东战略，尤其是沙特，要把天然气省下来用于出口，用储能平抑新能源电力。所以中东长期看好，因为底层能源结构就是新能源，没有其他形式。燃油电站也基本三四十年退役了。 此外，数据中心，因为中东新能源电价低，这是另一个底层逻辑。中东光照好，主要搞光伏，风电不多。所以持续看好。数据中心确实也是一点，但我觉得它反而受战争影响。 分析师：明白。然后澳洲，您提到12吉瓦时到15吉瓦时。如果澳洲煤电加速退役，会不会带来额外增量需求？还是您刚才提到的12、15已经考虑了这个因素？ 专家：这个我可能没有研究太细，因为澳洲我们做得相对较少。能源保方面，是否因煤电退役导致新能源需求变大，可能需求变大？没有太多影响。 分析师：OK明白。 专家：好。 分析师：户储和工商储这边，能否简单更新一下？现在看东南亚或拉美南美，户储和工商储整体需求，今年或明年是否持续有明显增长？ 专家：爆发的趋势。东南亚挺多的，从我们卖电池的角度，拉美目前没有太多看到，因为我们拉美做得少。东南亚确实看到很多客户有需求。有一个客户专门做美国货运市场，想买我们美国的电池，增长量报得还可以。 欧洲工商业不错，因为盈利模式比较成熟。欧洲是自由的电力市场，工厂配工商业可以做到电力交易和省电。所以欧洲工商业发展还可以。大概就是这样理解。 分析师：明白。针对需求，还有一个问题请教。海外是否有明确出台4小时以上长时储能强制配置的要求或激励政策？在主流市场。 专家：是一朝246。是的，目前我看到最明确的是国内。比如冀北，要求4小时及以上，否则不批电网接入，这是最明确的。 海外没有。海外是市场驱动的。例如，英国项目做市场交易，储能稀缺，所以在同样土地放下更多储能，收益更好，因为能做更多次交易。所以会拉高容量。例如，电网接入批100兆瓦，放4小时就是400兆瓦时，收入好，时长越长，交易时段越多，收益更好，所以往长时走。英国有一个项目，一期1小时，二期2小时，三期变4小时。业主逻辑是收益好，所以做长时，但一般做到4小时，再长可能不经济。 分析师：明白。中东、澳洲、德国这边暂时没有往更长的系统。OK明白。第二块，整体价格情况。现场有投资者想请问，欧洲现在价格趋势怎么样？是否国内企业竞争加剧，造成单位盈利下滑？ 专家：能再说一下吗？我刚刚有个电话。 分析师：现在欧洲的价格趋势怎么样？是否国内企业竞争加剧，造成单位盈利下滑？ 专家：没有。欧洲现在价格很好。厂家订单基本签到明年二季度，所以今年不愁卖。直流侧价格大约90美金每千瓦时FOB。欧洲性价比最高的是阳光，阳光大多数往欧洲送，报高价，不会把价格放得很低。所以欧洲价格还可以。 分析师：交流侧大概价格区间是多少？直流您刚说是90美金。 专家：交流侧看买谁的。如果买当地PCS，便宜点也得65美金每千瓦，按4小时算，大约13美金每千瓦时，加上直流，整个系统大约100出头。如果用中国PCS，便宜一些，45到50美金，45的话4小时加10美金。其实交直流侧差得不多。 分析师：这是欧洲。如果看美国、欧洲、中东、南美等不同市场，价格区间大概是什么样？ 专家：美国贵10美金。如果中国出口FOB价格，拉美可能比欧洲低一点，因为拉美比较卷，直流侧大约70到80美金每千瓦时。美国大约100美金每千瓦时。中东更低，整个系统大约七八十美金，大项目DDP到现场，4小时系统80美金。 分析师：OK明白。现在这个情况下，如果看未来，因为已经是2026年8月，看明年，您估计价格会稳定在这个区间，还是会变化？ 专家：我觉得明年至少到上半年，价格肯定稳定在这个区间。因为很多产能已经满了，到那个时候，短期内不太可能再降价。 分析师：看到有些人在担心。如果锂矿价格在今年下半年有明显波动，会影响明年的报价吗？ 专家：已经不影响锂矿。目前我们的消息是锂矿要涨，你们的消息是锂矿要跌，各种传闻。现在有很多客户愿意付定金锁价格，因为他们担心后面锂矿价格上涨，想提前锁定，不让我们涨价。所以，我们看多，价格可能会上涨。 分析师：明白。如果今年下半年涨了，对明年的看法，明年下半年现在可能暂时看不清。 专家：对。整体指引是后面几个因素。第一，产能扩张会越来越理性，国家也在控制各家的产能，不允许无序扩展。 第二，各厂家从无序竞争到现在，龙头企业会有默契，价格不会压得太低。从国际业主来说，过低价格抢市场也不现实，会变得像逆变器一样。中资企业就那么几家，大家有序合理定价。从单价看，后面可能下降，但不是毛利影响，而是因为电池系统做得更大，占地、辅材等导致项目价格下降，而不是牺牲毛利。后面储能可能慢慢变得像以前逆变器在国际市场的竞争模式，通过技术迭代降价，而不是压缩毛利。 唯一潜在风险是，很快再过两年可能遇到钠电和锂电替代的交替过程，锂电可能降价。钠电在发展，很多人评估钠电在未来三年能形成较好价格竞争力。 除非它能量密度稍低，其他都比锂电好，成本也低。到时锂电价格要再看，是否需要与钠电维持类似价格水平，否则没有竞争力。 分析师：明白。但事情发生，您说了两三年后，到2028年之后再去担心。阶段性来看，应该会有影响。 专家：嗯，您再说一下钠电的事情。对，我说可能两年后，钠电开始替代锂电时，锂电就要主动降价，否则被替代更快，就像石油和油页岩。要延缓替代过程，只能主动降价。那时锂电会有较大降价，但更多是从原材料降价，因为如果碳酸锂价格一直高，厂家会更快转到钠电，钠离子不缺。 分析师：所以在您看来，钠电对锂电的替代趋势是不可逆的，我能这么理解吗？或者对锂矿企业来说，有什么方法能延缓替代周期？除了降价。 专家：以外没什么太好的方法。钠电有几个优势。第一，安全性好。第二，除了能量密度是弱点，其他都是好的。物理安全、化学安全更好。原材料方面，只要有海的地方就有，没有供应链卡脖子风险，供应链安全更好。 化学特性上，高倍率，可以闪充闪放。循环次数理论上2万到25000次，实际可以40年换电池。钠电对锂电的替代过程是必然的。 分析师：不好意思，现在能听到吗？ 专家：现在可以。对，明白。 分析师：在现在情况下，海外一线集成商和二三线集成商，对外报价策略有差异吗？差异体现在哪里？以海外大型项目为例。 专家：怎么说呢？一类集成商策略是不想最低价中标。例如，阳光电源，如果有竞争对手，会对客户说贵5%到10%，有溢价。像阳光或特斯拉，会深入财务模型，告诉客户因为能量一致性、容量一致性更好，所以衰减更好，换电池节点更晚，运维成本更低。所以从财务模型看，虽然贵5%到10%，但综合成本更便宜或差不多。 二类厂家比较简单粗暴，技术上能答应的都答应，价格便宜5%到10%，看客户是否愿意用。风格是先靠低价做进去，因为市场主流是一类厂家。成功后慢慢提价，从二类变成一类。价格低买的人多，就可能变成一类，那时再追求毛利。一类厂家一出来就要毛利。这是比较明显的差异。其他方面每个项目策略不同。 现在也不排除很多一类厂家打品牌战和国际化。例如，远景说西班牙有工厂，溢价不是品牌，而是本地化，碳足迹最少。欧洲未来评标可能引入碳排评分，商务、技术、碳排三块综合积分最高选中。头部厂家在做这个工作。有些还没进顶级的厂家，通过本地化弯道超车来竞争，但这类类头部厂家才有的实力，因为资金要求高。 分析师：明白。还有一个问题，您提到现在FOB在欧洲大约90，和年初相比涨了多少？涨价的原因？ 专家：原因包括碳酸锂涨价、国内电池消费税、退税减少等。 分析师：减少。 专家：因为现在这个价格是明年的价格，明年交付的。今年交付已经不报价了。 分析师：明白。ICC出来后，美国价格有变化吗？还是没什么影响？ 专家：没有太大影响。因为FCC美国，主流逆变器厂家是SMA、特斯拉、Ingeteam、PE，PE市占率最大。主要影响阳光，因为其他中国企业在美国的PCS很多是与当地厂家合作的。 分析师：明白。最后一块问题是汇兑层面。20年以来人民币汇率波动，对头部集成厂或电芯厂利润率影响幅度有多大？ 专家：这个分项目看，与汇率策略完全相关。例如，我们公司财务在折算外汇时会加buffer。正常汇率6.7，我们按6.5算美金，把美金数算得更高。报价时考虑5%到10%的buffer，可以稀释波动。第二，有外汇时，通过财务做掉期和期权，锁定汇率风险。 少数情况下，强势企业会在订单中写汇率作为参考。例如，reference汇率6.78，波动超过10%调价，10%以内不调。这三种方式是厂家常见应对汇兑影响的方法。 分析师：但调价难度较大，只有头部强势企业才能这样。 专家：基本上客户会不同意，觉得太霸道。另一种方法是国际化，收美金付美金，比如海外工厂，美金用在海外，不承担汇率风险。 分析师：OK明白。好，麻烦会议助理播报一下，看线上投资者。 我看线上投资者也没有问题。最后再确认两个内容。一是您对海外整体需求的判断，今年应该奔着450吉瓦时去，2027年可能维持40%以上增长，我说的是大数。 第二，价格层面。明年价格，至少上半年，和今年相比不会发生太大波动。甚至有企业想锁单，担心锂矿价格上涨。对，没错。好，大概50分钟，将近1小时。我觉得整体今天。 全文总结： 本次对话主要围绕海外储能市场，特别是大储领域的现状和未来展望，涵盖需求预测、价格趋势、市场细分、竞争格局及技术替代等关键方面。 需求方面： 2026年全球大储装机预计约450吉瓦时，其中海外市场约200吉瓦时，中国市场约250吉瓦时。2027年海外需求有望维持40%以上增长，主要驱动力来自欧洲、北美、中东和东南亚等地区。 欧洲：2026年装机约40吉瓦时，2027年预计60吉瓦时，增长源于中欧东欧独立储能需求激增、新能源渗透率提升及数据中心业务发展。长期看，核电产能不足使储能需求持续。 北美：2026年约60吉瓦时，2027年预计75-80吉瓦时，增长受IRA法案安全港项目及大容量并网法案预期推动。AIDC配储占比从2026年的10%升至2027年的30-40%。 中东：2026年装机不到20吉瓦时，2027年预计30吉瓦时，受数据中心项目（如阿布扎比）和大型招标（如沙特12吉瓦时）驱动。长期看好，因新能源资源丰富和天然气出口战略。 东南亚：2026年约7-8吉瓦时，2027年翻倍，增长源于能源转型和数据中心转移。 澳洲：2026年约12吉瓦时，2027年预计15吉瓦时，增长稳定。 工商业和户储：欧洲工商业发展良好，东南亚户储需求增长，但澳洲户储因补贴变化而停滞。 价格与竞争： 欧洲价格坚挺，直流侧FOB约90美金/千瓦时，交流侧系统约100-110美金/千瓦时，订单已排至2027年二季度。国内企业竞争未导致盈利下滑，龙头企业（如阳光电源）保持溢价。 不同市场价差：美国约100美金/千瓦时，拉美和中东价格较低（中东系统约80美金/千瓦时，拉美直流侧70-80美金/千瓦时）。 2027年上半年价格预计稳定，因产能紧张和理性扩张。锂矿价格可能上涨，促使客户提前锁单。 汇率波动影响通过缓冲、掉期和国际化策略管理，头部企业更有议价权。 技术趋势与替代： 数据中心推动光储及燃机配储方案，燃机调节慢但需与储能配合，未来光伏配储比例将增大。 钠电是长期替代锂电的关键，预计2028年商业化。钠电在安全性、倍率性能、循环寿命和原材料供应上优势明显，但能量密度较低。锂电需通过降价延缓替代，但趋势不可逆。 竞争格局： 一线集成商（如阳光电源、特斯拉）注重品牌溢价和长期财务模型，报价贵5-10%但强调综合成本优势；二线厂家以低价策略切入市场，逐步提升份额。 本地化（如欧洲工厂、碳足迹认证）成为头部企业差异化竞争手段。 特殊政策影响： 美国SCC和FCC主要影响新产品认证，老产品影响较小，AIDC客户对成本不敏感。 欧洲贸易壁垒对直流侧影响有限，但PCS销售受一定限制；中东和东南亚市场开放。 总体来看，海外储能市场增长强劲，需求持续扩大，价格保持稳定，技术迭代和竞争格局优化为行业带来长期机遇。", "status": "extracted"}, "attachment:files/反弹继续——旬讲系列20260810.pdf": {"id": "attachment:files/反弹继续——旬讲系列20260810.pdf", "kind": "attachment", "title": "反弹继续——旬讲系列20260810", "source_label": "其他", "excerpt": "反弹继续——旬讲系列 20260810 要点总结 1.市场观点与宏观环境 本周观点认为反弹将持续。上周五美国公布收入数据为 40017.20 亿美元，市场对北美降息预期升 温，当前外部货币周期环境相对有利。", "content": "反弹继续——旬讲系列 20260810 要点总结 1.市场观点与宏观环境 本周观点认为反弹将持续。上周五美国公布收入数据为 40017.20 亿美元，市场对北美降息预期升 温，当前外部货币周期环境相对有利。 国内方面，上周整体反弹较为强势，科技股和成长性股票（包括部分价值科技股）基本呈现四连 阳，A 股呈现普涨格局。市场在反弹过程中并非完全聚焦于科技板块，整体反弹力度相对更强。 从 IDC 和电源业务角度，认为该板块仍将有较好的反弹表现。 2.AI 硬件与 IDC 核心变化 GB200 全面加速量产 ：GB200 已处于全面加速量产过程，目前已有产品在北美云厂商处部署。英 伟达明确提到该平台覆盖前 30 个国家、超过 320 个工厂。 英伟达投资基础设施开发商 ：8 月 8 日英伟达对一家基础设施开发商进行了一笔较大投资（路透社 报道，尚未最终确认），聚焦德州地区——德州也是数据中心最主要的建设站点之一。该投资对市 场有重要帮助，表明英伟达正将定位延伸至 AI 基础设施资本方，使 AI 产业和资本市场认识到其开 始投资下游瓶颈环节，有助于 AI 基础设施持续扩张，并增强 GPU 收入增长，形成闭环。 AI 资本配置逻辑闭环已打通 ：从大模型效率大幅提升→完成单一任务 token 数量下降→单位 token 价格下降→下游各领域应用爆发、token 数量爆发→云业务收入上修→开发与硬件采购上 修，这一闭环已充分打通。 3.AI 硬件价格与经济性分析 市场最大担忧在于硬件价格仍需下降。当前存储及其他硬件价格若无法下降，整体经济性难以提 升。参考光伏行业过去十年成本下降 90%以上的经验。 对于硬件价格下降可能带来毛利率压力的担忧，认为：第一，成本端随规模效应提升也会快速下 降，毛利率可能保持相对稳定，但毛利率绝对值会有一定压力；第二，相关技术持续迭代升级可平 抑价格下跌影响。 技术迭代方向包括：液冷从单向液冷到双向液冷，再到未来新模式液冷；光模块从可插拔式到 NPO 到 CPO——英伟达最近表示 CPO 已开始落地。持续技术迭代可类比实现类似效果。 总体倾向于认为 AI 硬件不会出现大的价值逻辑损伤。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 4.电力电源与液冷赛道 英伟达下场布局电力电源赛道，本质与电源业务有很大关系——电源和业务共同决定 PUE，是节能 核心方向。 除工艺度和可靠性外，电源转化效率是电源产业一直追求的核心目标。从 UPS 到 2.4 倍 HDC 到 80 倍 SIT，转化效率从 95.6%提升到 98.9%。 液冷散热技术持续提升：3000 瓦计算功率可通过更高效散热方式解决，可采用更小的测试体积提 升体积利用率，45 度温水带来更低电力消耗，均有助于 PUE 优化。更低的 PUE 意味着计算中心基 础设施用电量相对较低，在北美电力相对紧缺的市场可发挥重要作用。 5.Rubin 加速架构对液冷和电源的影响 Rubin 加速架构有两个架构方案：部分采用 HHybrid 卡的模式，对应 PSU 改为 840W 至 1810W 的 PSU，该模式占一定比例；绝大部分保留原有架构，PSU 变为 12.3 千瓦的单向 PSU。 液冷有两个核心变化：第一，因采用 800V 架构，必须使用电子水泵（无刷电机，更适合大功率场 景）；第二，需要采用零泄露产品，电子水泵也是零泄露产品。从机械水泵到电子水泵的核心变 化，对电子水泵构成较大利好。 飞龙和大元等企业在国内正品用的产品研发方面具备优势。 6.液冷与电源行业景气度 液冷领域：7-8 月份可见英维克作为液冷龙头公司，当季收入创历史新高，代表 Rubin 上市相关业 务订单在加速落地。 电源领域：电源是核心硬通胀主线，通过不断技术迭代提升产品价值量，对冲老产品价值量下降。 产品单价越贵逻辑不仅适用于电源本身，也适用于上游各类材料——功率半导体、各类型电容、瓷 器、软件、道路系统、断系统、电器元器件等，其价值量都会伴随交流转直流过程、单机功率提升 而出现大幅提升。 从 GB200 到 GB300 到 VR2000 到 VR300，伯恩斯坦最新报告显示，不论 A 还是 A 元，价值量提 升均超过 200%。 在 PCD 斜率震荡快的背景下，电源液冷也是效率增长快的赛道。液冷逻辑上更为突出——原来并 非标配，在 Rubin 专业框架下成为标配，叠加各方面因素，液冷是斜率非常高的赛道，值得重视。 7.锂电池行业与排产情况 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 8-9 月份整体排产在上行过程中，但材料排产没有像电池排产那么强，原因有二：第一，材料企业 的统计方式（统计口径）存在不完整，仅统计若干龙头公司可能有偏差；第二，材料环节环比未向 上的原因在于材料无法做太大规模的库存——不管是书籍还是类似 VC，都有一定化学吸水性，过 多库存准备可能产生产品质量变化风险。 当前节点整个碳酸锂库存已降至非常低的水位。碳酸锂库存低意味着未来价格反转可能超出预期。 8.碳酸锂价格走势 上周碳酸锂价格从月初 13 万，到周中增速 18 万，到周末 14 万以上，已开始逐步触底甚至有所反 弹。 随着库存持续下跌，短期价格回弹是大概率事件，与此前长线预期基本吻合。 明年预期何时回升目前难以判断，但即便看不到强的预期反转，从强线值来看也足以支撑碳酸锂价 格在当前位置企稳——不说大幅反弹，至少企稳。碳酸锂向下趋势基本得到扭转。 9.VC 环节分析 VC 价格上周基本未涨（前面一两天涨，后面回落），但厂商库存持续回落。根据百川数据，VC 工 厂库存从 1100 吨已降至 500 吨——500 吨库存意味着整个行业仅剩几天的生产量。 上周价格未上涨反映的是买方对卖方当前价格不太接受，双方无法有效成交，因此价格未涨。但行 业厂商库存处于持续低点，下游观望情绪会逐步减弱——看到上游库存快速回落后，下游最终会在 自己库存销完后进行采购。 市场观望的另一重要原因是希望苏州华谊等大厂复工能缓解供给压力。但此次停产并非简单的正常 检修，而是因环保等原因被动停产，快速复产可能性不大——此类问题停产一般少则一个月、多则 几个月。 当前节点指望新产能释放（包括已停产的自动化医疗大涨）短期可能看不到。VC 在 23 号走势下突 破 25 万的概率较大；能否进一步往 30 万以上走，还需看其他因素。总体判断 VC 本周有可能重新 进入价格上涨区间。 10.锂电下游需求——储能与新能车 储能需求 ：近期对行业做了一系列调研，整体感觉储能下游需求尤其是海外需求非常旺盛，不少厂 商明确反馈海外储能需求非常给力。 国内需求方面，1-6 月份装机需求低于预期，需要持续跟踪。但 1-6 月份招标情况不错，同比增长 50%；7 月份最新装机数据预计也会非常不错。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 新能车需求 ：7 月份行业需求非常强势，订单端连续四周环比大幅提升。进入 8 月第一周，因天气 因素（台风）影响，以及七月底 B 单修正影响，数据可能有所波动，但仍可持续观察。 从当前时间点看，最差情况是今年年初，现在处于持续改善过程中，不应过于悲观。 问答整理 Q1：VC 价格后续走势如何判断？突破 25 万的可能性有多大？ 答：VC 厂商库存从 1100 吨已降至 500 吨，仅相当于几天生产量。上周价格未涨是因为买卖双方价格 分歧无法成交，但上游库存持续快速回落，下游观望情绪会逐步减弱，最终仍会采购。苏州华谊等大厂 因环保等原因被动停产，短期难以快速复产（一般少则一个月、多则几个月），新产能释放短期也看不 到。VC 在 23 号走势下突破 25 万概率较大，能否进一步往 30 万以上走还需观察其他因素。 Q2：材料排产为什么没有像电池排产那么强？ 答：第一，材料企业的统计方式存在不完整，仅统计若干龙头公司可能有偏差；第二，材料环节环比未 向上的核心原因在于材料无法做太大规模的库存——不管是 量略有收窄，估值效应抵消了部分流量失衡影响。尽管经常账 ⼾（流量）失衡扩⼤，但净国际投资头⼨（存量）在2025年略有收窄。这表明积极的估值 效应抵消了部分经常账⼾失衡的影响。美国作为最⼤的净债务国，其NIIP占GDP⽐重 从-90.6%收窄⾄-89.5%，得益于名义GDP增⻓强劲和美元⾛弱带来的有利汇率估值效 应。同时，⽯油出⼝国净债权头⼨的⼤幅下降也导致了整体存量的收窄。\u0001 3.IMF评估显⽰近半数经济体的外部平衡偏离基本⾯，呼吁协调政策⾏动。根据IMF的外部 平衡评估（EBA），近⼀半被评估经济体的经常账⼾余额和实际有效汇率进⼀步偏离了由 经济“基本⾯”隐含的⽔平。全球超额经常账⼾余额出现⼗年来最⼤增幅，主要由中国和 美国驱动。IMF指出，持续的巨额外部⾚字使经济体易受资本流动突然停⽌的影响，⽽过 度盈余则可能压低实际利率并积累系统性⾦融⻛险。因此，IMF呼吁盈余和⾚字经济体采 取协调的政策⾏动以⽀持外部再平衡。\u0001 4.⾼盛分析认为中国、韩国等盈余国头⼨“过正”，美英等⾚字国头⼨“过负”。⾼盛的分 析与IMF的评估⼤体⼀致。在⾼盛看来，中国⼤陆、韩国、中国台湾以及⼤多数发达市场 债权国（新加坡、瑞典、荷兰、德国和⽇本）的经常账⼾余额在两种框架下均显⽰为“过 于正⾯”（too\u0001positive）。相反，美国、英国、⼟⽿其和巴西的余额则显⽰为“过于负 ⾯”（too\u0001negative）\u0001 外部失衡（负值和正值）仍集中在发达市场⽽⾮新兴市场\u0001 ✏GS：欧洲，被忽视的跑赢者\u0001 1.欧洲盈利增⻓强劲，远超市场认知。上半年每股收益（EPS）同⽐增⻓14%，为三年来最 快增速。尽管⾯临能源供应冲击，但盈利复苏⼴泛且健康。⾼盛将2026年斯托克欧洲6 00 指数（STOXX\u0001Europe\u0001600）的EPS增⻓预测从10%上调⾄15%。剔除⼤宗商品板块后， EPS增⻓仍达7%，表明并⾮仅由商品周期驱动。\u0001 2.欧洲股本回报率（ROE）显著改善，估值具备吸引⼒。虽然欧洲ROE仍低于美国，但随着 利润率提升、回购增加以及银⾏业盈利能⼒恢复，ROE已明显改善。相⽐中国受产能过剩 和股东回报关注不⾜影响导致的低ROE，欧洲股市在国防⽀出、基础设施、电⽓化和数据 中⼼等主题转变中受益良多。此外，美国公司在所有增⻓区间的估值均⾼于欧洲，欧洲在 各⾏业的股息率也更⾼。\u0001 3.欧洲股市表现并⾮始终落后，近期显著跑赢。⾃2022年以来，欧洲银⾏股（SX7P）⼤幅 跑赢“美股七巨头”（Magnificent\u00017）。⾃2025年初以来，尽管⾯临关税冲击和能源危 机，斯托克欧洲600指数仍跑赢标普500指数。这得益于美国市场⾼起点估值、⾼利率对 ⻓久期科技股的打击以及对重资产、低过时⻛险（HALO）公司的偏好转移。\u0001 4.中国竞争威胁被⾼估，欧洲股市结构具有防御性。尽管中国汽⻋和化⼯⾏业受到中国出⼝ 增⻓的冲击，建议低配这些领域，但欧洲股市整体受中国低成本进⼝影响有限。⾦融、制 药、科技、能源、公⽤事业、电信和航空航天等主要板块并不特别脆弱。汽⻋股仅占欧洲 市值的1%，⽽科技硬件规模是其三倍。欧洲消费者反⽽可能从较低价格和通胀中受益， 提升实际收⼊和服务消费能⼒。\u0001 5.⾼能源价格对欧洲企业盈利呈正向⽀撑。与宏观经济不同，欧洲股市中能源和基础资源权 重较⾼，且公⽤事业、化⼯和⾦融⾏业能通过转嫁成本和受益于⾼利率/通胀⽽获利。只 有⾮必需消费品板块明显受损。只要需求不被严重抑制，⾼能源价格对多数欧洲上市公司 EPS具有⽀持作⽤。\u0001 6.资⾦流⼊强劲，并购活动活跃。欧洲股票正经历⼗年来（除2021年外）最佳资⾦流⼊，主 要由外国投资者驱动，旨在分散对美国和⾼估值资产的集中暴露。同时，企业通过回购 （尤其是银⾏和能源板块）和并购活动成为重要买家，⽀持了⼩盘股和并购⽬标篮⼦表 现。\u0001 7.欧洲在AI浪潮中虽落后但具备现⾦流优势。欧洲在数据中⼼建设和前沿模型投资上落后于 美国，但这可能使其避免过度资本⽀出带来的融资压⼒和回报质疑。欧洲公司产⽣⼤量⾃ 由现⾦流，收益率⾼于债券及美国市场，且在AI投资回报受质疑时，这种“现⾦⽣成者” ⻆⾊成为优势，提供对冲价值。\u0001 欧洲股市表现优于中国股市\u0001 ✏GS：为何农作物价格⽇益跟随燃料价格波动\u0001 1.⽣物燃料需求受政策和油价驱动，正成为农作物价格的关键决定因素。⽣物燃料⾏业规模 约为350万桶/⽇，主要⽤于交通运输，且⾼度集中在美国、巴西和欧盟，这三者占全球产 量的80%左右。2026年上半年较⾼的油价提振了⽣物燃料需求，同时出于能源多样化和 农场收⼊⽀持的考虑，各国政府可能进⼀步提⾼混合⽐例强制要求（如巴西提升⾄E32， 印度尼西亚提升⾄B50）。随着⽣物燃料需求增⻓，更多农作物从⻝品和饲料领域转向燃 料⽣产，导致⽣物燃料需求与农作物价格之间的联系⽇益紧密。\u0001 2.不同⽣物燃料使⽤不同的原料，地域资源禀赋决定⽣产类型。⼄醇由⽟⽶和⽢蔗制成，混 ⼊汽油中；⽣物柴油由⼤⾖、油菜籽和棕榈油等植物油制成，混⼊柴油中；可再⽣柴油主 要由废弃脂肪和废弃⻝⽤油制成，可直接替代传统柴油。当地原料的可获得性往往决定了 ⽣物燃料的类型：美国专注于⽟⽶⼄醇，巴西专注于⽢蔗和⽟⽶⼄醇，印度尼西亚专注于 棕榈⽣物柴油，欧洲专注于油菜籽⽣物柴油。\u0001 3.“混合墙”限制⽣物燃料需求增⻓，但政策强制⼒⽀撑需求底线。在美国和欧洲，燃料混 合强制要求主要决定了⽣物燃料需求，因为政府⽀持农场收⼊和能源多元化。在巴西，较 ⾼的燃料价格和政府对⽣物燃料的补贴使其相对于⽯油燃料更具竞争⼒，⿎励司机切换燃 料。然⽽，“混合墙”（现有燃料基础设施、发动机和⻋队所能吸收的⽣物燃料最⼤份 额）最终限制了美国和欧盟⽣物燃料需求的增⻓。尽管存在短期供应灵活性（如巴西糖⼚ 可在糖和⼄醇⽣产之间切换⽢蔗⽤途），但原料供应在作物年度内最终是固定的，新建加 ⼯产能需要时间。因此，强劲的⽣物燃料需求往往会通过加剧粮⻝、饲料和燃料对农作物 的竞争来⽀撑原料价格。\u0001 ⽤于⽣产⽣物柴油的作物⽐例上升可能减少⻝品和饲料的可⽤性\u0001 ✏GS：中国AI⼯业化时代\u0001 1.中国进⼊“出海3.0”时代，AI驱动的⼯业能⼒出⼝成为新增⻓极。中国出⼝正从1.0时代 的低成本制造和2.0时代的“新三样”（电动⻋、锂电、光伏）转向3.0时代，即以AI赋 能、技术领先的⼯业能⼒出⼝为主，涵盖AI数据中⼼电⼒基础设施到物理AI（机器⼈与⾃ 动化）。报告将11种产品出⼝机会分为四类原型：“瓶颈解决者”、“技术升级者”、 “成熟全球玩家”和“独特机会”，并预测不同类别的海外轨迹将显著分化。\u0001 2.“瓶颈解决者”中期收益最⼤，⻓期成功需观察；“技术升级者”凭借快速迭代脱颖⽽ 出。预计2026-2030年，“瓶颈解决者”（如变压器、开关柜、UPS、燃⽓轮机部件）将 因全球供需缺⼝获得最⼤的市场份额增益和利润率提升，⾼盛对思源电⽓、科华数据和应 流股份给予“买⼊”评级。紧随其后的是“技术升级者”（如液冷、电源模块、继电 器），其关键在于快速⼯程和技术迭代，⾼盛对英维克给予“买⼊”评级。然⽽，2030年 后的可持续性取决于供需缺⼝的持续时间以及满⾜全球公⽤事业和⼯业客⼾严格运营标准 的能⼒。\u0001 3.“成熟全球玩家”⾯临中期阵痛，监管与市场准⼊是主要障碍。储能系统（ESS）和⼈形 机器⼈等“成熟全球”领域在中期内⾯临强烈的市场准⼊逆⻛，需应对复杂的国际监管、 安全和环境合规框架。⾼盛对阳光电源维持“中性”评级。尽管中国⼯业机器⼈和⾃动化 领导者（如汇川技术、埃斯顿）在中期的海外起步较慢，但其强⼤的产品/技术竞争⼒、 研发迭代速度和成本优势使其成为潜在的⻓期赢家。\u0001 中国领先企业与全球同⾏的海外市场价格⽐较\u0001 看推\u0001 看跌期权需求骤降，市场恐慌情绪缓解\u0001 债市看增⻓，股市看通胀\u0001 莫迪\"印度制造\"⼗年：制造业占GDP⽐重不升反降\u0001 欧洲股市盈利增速创2022年以来新⾼，带动股指历史新⾼\u0001 2026年6⽉半导体销售预测：内存芯⽚引领爆发式增⻓\u0001 AI军备竞赛：四⼤科技公司投资额堪⽐国防开⽀\u0001 中国⻩⾦储备与国际⾦价⾛势图\u0001", "status": "extracted"}, "post:2026-08-12T14-00:38294ebbf289": {"id": "post:2026-08-12T14-00:38294ebbf289", "kind": "post", "title": "2026-08-12 14:00", "source_label": "帖子正文", "excerpt": "【广发机械】联讯仪器跟踪：光通信景气度再强化，继续推荐测试设备龙头 0812 #Lite业绩超预期，#证实光通信板块的景气度持续性。", "content": "【广发机械】联讯仪器跟踪：光通信景气度再强化，继续推荐测试设备龙头 0812 #Lite业绩超预期，#证实光通信板块的景气度持续性。Lite CEO在业绩会表示超大功率激光器的需求正远超产能，CPO正在按客户计划推进并未推迟，而NPO作为增量需求出货需求可能会提前到27年末开始放量。 #源杰科技拟投建新基地。公司拟投入42.68亿元建设高端激光器新产能，此轮建设预 效解决了 CW 光源的国产替代问题。 📎长光华芯：计划引入，主要供应 EML 芯片，辅以 CW 芯片。 📎永鼎股份：计划引入，主要供应 CW 芯片，少量 EML 芯片面向国内市场。 📌2. EML 芯片市场地位与前景（聚焦长光华芯） 🌐市场格局：海外供应商（Coherent、Lumentum）占据约 90% 市场份额，下游客户（谷歌、英伟达）实行强制认证。 🔖国内通过认证的仅两家：索尔思（自供为主）和长光华芯。 🚀长光华芯进展：100G EML 芯片已通过谷歌认证，200G EML 芯片认证正在对接。这有助于缓解海外厂商主导、出货受限的局面。 📈份额预测：目前份额仅 1%-2%。通过认...", "publish_time": "2026-08-12 08:11", "tags": ["文字观点"]}, "post:2026-08-12T09-36:9284d885faf9": {"id": "post:2026-08-12T09-36:9284d885faf9", "kind": "post", "title": "2026-08-12 09:36", "source_label": "帖子正文", "excerpt": "【浙商AI战队冯翠婷】行云科技重点提示❗️算力租赁龙头行云科技昨天晚上辟谣很及时，CoreWeave26Q2业绩超预期盘后暴涨16%❗ 1、清关与供应链情况自行云科技开展算力业务以", "content": "【浙商AI战队冯翠婷】行云科技重点提示❗️算力租赁龙头行云科技昨天晚上辟谣很及时，CoreWeave26Q2业绩超预期盘后暴涨16%❗ 1、清关与供应链情况自行云科技开展算力业务以来，所有算力设备、零部件等相关商品的海外采购、进口清关均严格遵守法规、手续完备，至今未发生任何算力设备及相关商品被海关扣留、滞留等无法通关的情形。目前行云科技海外采购的相关产品均按计划正常清关到货，整体供应链稳定有序。 2、订单履约情况截至本公告披露日，行云科技在手算力长期3-5年订单规模约150.82亿元。8月1日我发的《行云科技三签补充协议看算租下游兜底》深度提到公司的客户涵盖国内核心的央企、云厂、模型厂商等，在验证算力租赁服务商“拿卡+交付”能力后，愿意主动为算力溢价买单。 3、我们保守估计公司市值500亿打底（27E净利20+亿），由于谣言调整提示龙头买入机会拳头算力租赁公司最近由于Neocloud、token分成、下半年兑现等逻辑有机会向上拉升估值锚。 4、CoreWeave26Q2业绩超预期，盘后大涨17%，重点提示算力租赁板块，行云科技、宏景科技、利通电子、协创数据、杰创智能、蜂助手、...", "publish_time": "2026-08-12 09:36", "tags": ["文字观点"]}, "post:2026-08-12T10-44:392b96f558b7": {"id": "post:2026-08-12T10-44:392b96f558b7", "kind": "post", "title": "2026-08-12 10:44", "source_label": "帖子正文", "excerpt": "看好国内算力租赁产业链 CoreWeave业绩超预期，盘后大涨近16%。", "content": "【国投科技】CoreWeave超预期，持续看好国内算力租赁产业链 CoreWeave业绩超预期，盘后大涨近16%。公司昨晚披露收入利润营收 25.8亿美元 (同比+112%) ，Q2新签合同的贡献利润率，预计将高出 5-10个百分点。订单增至 1040亿美元，2026全年收入指引上调至124-132亿美元，资本开支上调至350-390亿美元。 A股的算力租赁本质上是全球算力卡需求旺盛，叠加英伟达先进卡（B300）难以获得具备稀缺度的两重因素，我们认为弹性更大。虽然国内做算租的公司越来越多，但是卡本身的需求量也越来越大，有持续拿货和token消纳能力的公司确定性更高 相关标的：蜂助手、东阳光、协创数据、宏景科技、利通电子、行云科技等#文字观点", "publish_time": "2026-08-12 10:44", "tags": ["文字观点"]}, "post:2026-08-12T17-04:242da1f69e1c": {"id": "post:2026-08-12T17-04:242da1f69e1c", "kind": "post", "title": "2026-08-12 17:04", "source_label": "帖子正文", "excerpt": "CoreWeaveQ2业绩亮眼，算力市场前景广阔 产业链相关标的： （1）白马：宏景科技、协创数据 （2）进展顺利：东阳光、杰创智能、行云科技、盛视科技、赛意信息、润建股份、智微智", "content": "CoreWeaveQ2业绩亮眼，算力市场前景广阔 产业链相关标的： （1）白马：宏景科技、协创数据 （2）进展顺利：东阳光、杰创智能、行云科技、盛视科技、赛意信息、润建股份、智微智能、利通电子、盈峰环境、蜂助手、华策影视、平治信息、先河环保 （3）预期差：粤港湾智算、香江控股、软通动力、高乐股份、罗曼股份 CoreWeave（CRWV）作为全球GPU云基础设施龙头公司，营收大幅增长： Q2业绩增长超预期：营业收入＋112%，达25.75亿美元；调整后EBITDA增长+101%，达15.1亿美元；GPU集群扩张速度惊人：总资产+56%，达770.70亿美元；固定资产+53%，达467亿美元；融资渠道通畅：NVIDIA背书（6%股权+优先GPU供应）行业最强信用增级；市场信用已逐步建立，无追索权债务＋1232%，达86.2亿美元 未来收入保障：与OpenAI签定5年长期合同，收入积压1040亿美元。纯GPU架构，与通用云厂商相比在AI训练场景上更快、更便宜，递延收入增长到97亿美元（+15亿美元）。 Q3营收指引上调，高于市场预期。新签署的合同利润率高出5至10个百分点。应对当前需求增长...", "publish_time": "2026-08-12 17:04", "tags": ["文字观点"]}, "attachment:files/芯原股份20260811.pdf": {"id": "attachment:files/芯原股份20260811.pdf", "kind": "attachment", "title": "芯原股份20260811", "source_label": "其他", "excerpt": "电子行业研究框架 20260810 要点总结 1.行业主线与核心逻辑 2026 年电子行业全年主线围绕两大方向： AI 技术创新 与国产自主可控 ，两条主线存在交叉，自主 可控亦由 AI 产业发展所带动。", "content": "电子行业研究框架 20260810 要点总结 1.行业主线与核心逻辑 2026 年电子行业全年主线围绕两大方向： AI 技术创新 与国产自主可控 ，两条主线存在交叉，自主 可控亦由 AI 产业发展所带动。 AI 产业趋势已从训练为主转向推理侧权重更大，硬件投资机会发生结构性变化；当前正进一步向 Agent（智能体）时代 迭代，将大语言模型从对话工具升级为任务执行引擎，推理转化为分布式多 步骤流程，带来硬件架构升级。 2.“纯算电联”四大维度投资框架 存（存储） ：推理时代对“纯算电联”四大维度提出均衡且更苛刻的要求，存储带宽与容量成为首 要瓶颈。HBM 成为决定推理性能的关键组件，其在 AI 芯片组件总支出中的占比已 超过 50% 。海外 以海力士、三星、美光为主，国内厂商围绕 HBM 迭代升级，国产化率快速上行。 算（算力芯片） ：推理时代算力架构正从 GPU 转向 GPU+ASIC 混合计算 架构。ASIC 针对特定模 型架构优化，在能效比和单位推理成本上具备显著优势。海外代表包括谷歌 TPU、亚马逊 Trainium 系列及 Meta 自研芯片等，ASIC 芯片市场规模高速增长。 电（电力与散热） ：AI 推理基础设施电力需求呈指数级增长，英伟达从 A 系列到 S 系列、Rubin 再 到 Feynman 系列，电力需求快速提升。配套功率、模拟、第三代半导体器件趋势向上；散热技术 从风冷向液冷升级，液冷正从可选项变为必选项。英飞凌分享服务器主板向 HVDC 数据中心架构过 渡，路径可为 800V 转 12V 或 800V 转 50V/6V，其中使用大量三代半芯片。 连（网络互联） ：AI 集群规模从数千卡扩展至数万甚至数十万卡，网络互联成为制约整体性能的关 键。传统可插拔光模块在带宽密度、功耗、延迟方面难以满足下一代 AI 基础设施需求， CPO（共 封装光学） 技术应运而生，显著缩短电信号传输距离，降低功耗 30%–50%并提升带宽密度。PCB 方面，2025 年全球市场规模约 800 亿美金 ，2026 年预计达 900 多亿美金 ，服务器/数据存储 PCB 需求将大幅增长，HDI 在服务器数据中心占比将从 3%左右提升至 2030 年的接近 30% 。 3.Agent 时代与 CPU 产业链 Agent 时代需要上下文处理和多步骤任务执行，CPU 算力正从配角转变为核心角色，成为维持系统 吞吐量和整体成本的关键因素。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª AMD 预计服务器 CPU 市场总规模以每年 超过 35% 的速度增长，整体市场规模有望达到 1500 亿 美金甚至更多 （当前仅数百亿美金量级）。 CPU 产业链相关方向值得重点关注。 4.AI 产业趋势下的 A 股重点公司梳理 存：相关存储/HBM 产业链公司。 算：国内 ASIC 芯片龙头，包括昇腾、寒武纪、昆仑芯、海博等。 电：功率领域关注斯达半导（原文“清洁能”疑为口误，结合上下文应为斯达半导或类似功率龙 头）；模拟关注圣邦股份；三代半关注天岳先进等。 连：光模块之外，PCB 关注沪电股份（原文“互变酸奶”疑为口误）、上游生益科技（原文“蜂蜜 新生”疑为口误）等。 CPU：关注澜起科技（原文“蓝旗”疑为口误）、海光信息，以及 CPU 封测环节的通富微电等。 5.半导体自主可控与国产替代 全球存储与先进制程产能紧缺，扩产共振；国内存储扩产逻辑未来几年持续加速向上。预计未来 2– 3 年全球资本开支增速 20%–30% ，国内增速 40%–50% 。 国内存储产线（如长江存储、长鑫存储）国产化比例持续提升，先进制程（中芯国际、华虹）国产 化比例有序提升。设备厂订单既受益行业贝塔增长，又受益国产化率提升的阿尔法，部分设备公司 订单增速可达 60%–70%甚至更高 。代表性公司：中微公司、北方华创（原文“飞车”疑为口 误）、拓荆科技、芯源微、盛美上海（原文“巴萨金科”疑为口误）等。 零部件 ：全球零部件厂商处于供不应求状态，国内零部件厂商扩产更积极灵活，三重受益（设备厂 订单增长、海外零部件交付不足带来的国产替代、海外设备厂主动寻求国内零部件供应），订单增 速可观。代表性公司：富创精密、江丰电子（原文“江峰”疑为口误）、正帆科技（原文“郑帆” 疑为口误）、神工股份等。 材料：随着晶圆产能落地，材料需求持续向上，未来几年需求确定性强。代表性公司包括安集科 技、鼎龙股份、兴发集团（原文“新娘”疑为口误）、江丰电子、雅克科技（原文“广告”疑为口 误）等。 6.晶圆制造与先进封测 国产算力大爆发背景下，上游晶圆制造产能与先进封测产能成为关键瓶颈。 今明两年决定国内算力 芯片的不是需求，更多是供给 。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 国内晶圆代工龙头（中芯国际、华虹）今年将实现良率改善、产能提升和工艺优化，产能有望大幅 改善。 先进封测（2.5D CoWoS、3D HBM 堆叠封装）已成为 AI 算力芯片成本端重要组成部分，今明两 年严重供不应求，国内厂商积极扩产将持续受益。相关公司：长电科技、通富微电、甬矽电子（原 文“永西”疑为口误），配套设备公司如长川科技、华峰测控（原文“华丰”疑为口误）、金海 通，第三方测试伟测科技等。 算力芯片公司 ：国产算力芯片处于严重供不应求状态，能够在上游资源/产能端获得确定性保障的公 司成长确定性更强。关注华为昇腾产业链、寒武纪及二线算力芯片公司。 7.消费电子与端侧 AI AI 持续向端侧延伸，苹果作为 AI 端侧代表性企业，进入“硬件优先+工程主导设计”的新时代。硬 件创新带动单机零部件 ASP 提升，供应链固定资产投入与设备采购周期加速，产线改造、模具更新 和新工艺导入频率提升，利好上游设备厂商。 除苹果外，AIPC、AI 手机、AI 眼镜等端侧方向亦值得持续关注，配套消费电子龙头和端侧单机价 值量提升机会值得重视。 问答整理 Q1：当前市场对存储方向存在分歧，如何看待？ 答：近期市场对存储的分歧更多体现在价格层面，即认为价格已处于较高水平、担心反噬需求，而非需 求端出现问题或供需格局逆转。推理侧在产业中的权重快速提升，对“纯算电联”提出均衡且苛刻的要 求，存储带宽和容量是托底推理性能的首要瓶颈，HBM 在 AI 芯片组件总支出中占比已超过 50%，存 储需求的基本面依然扎实。 Q2：国内半导体设备、零部件、材料公司的成长逻辑是什么？ 答：全球存储和先进制程扩产共振，国内扩产增速更快（国内资本开支增速 40%–50%，全球 20%– 30%）。国内存储产线和先进制程的国产化比例持续提升，设备厂订单既受益行业贝塔又受益国产化阿 尔法，部分公司订单增速可达 60%–70%甚至更高。零部件方面，全球零部件供不应求，国内厂商扩产 更积极灵活，三重受益（设备厂订单增长、海外交付不足带来的替代机会、海外设备厂主动寻求国内供 应）。材料方面，随着晶圆产能落地，需求持续向上，未来几年确定性很强。 Q3：国内先进封测在 AI 算力芯片中的重要性如何？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 答：过去市场认为先进封测在产业链中占比不高，但在 AI 算力芯片领域，2.5D CoWoS 和 3D HBM 堆叠封装已成为成本端非常重要的组成部分。今明两年这两个领域严重供不应求，国内厂商积极扩产将 持续受益，相关封测公司及配套设备、测试公司均值得重点关注。 Q4： : "attachment:files/芯原股份2026年限制性股票激励计划交流会20260811.pdf", "kind": "attachment", "title": "芯原股份2026年限制性股票激励计划交流会20260811", "source_label": "其他", "excerpt": "芯原股份 2026 年限制性股票激励计划交流会 20260811 要点总结 1.股权激励计划方案与考核目标 本次为公司上市后第四次第二类限制性股票激励计划，延续全员持股理念，重点激励近年来招聘的 优秀工程师。原文 芯原股份 20260811_原文 2026 年 08 月 12 日 发言人 肯激励计", "content": "芯原股份 2026 年限制性股票激励计划交流会 20260811 要点总结 1.股权激励计划方案与考核目标 本次为公司上市后第四次第二类限制性股票激励计划，延续全员持股理念，重点激励近年来招聘的 优秀工程师。 授予结构：80%首次授予，20%预留授予；授予价格为 112.56 元/股。 考核目标：以 2025 年度营业收入为基准，2026/2027/2028 年营业收入增长率均为 30%；因 20%预留部分预计于 2026 年三季度后授予，故另设 2027-2029 年对应考核目标（29 年同样为 30%增长率）。 公司强调人是最宝贵的资产，股权激励是保留和激励员工的核心手段，公司主动离职率远低于行业 平均水平。 2.人才招聘与员工结构 2023-2025 年三年累计招聘应届生 800 余人，坚持每年持续校招。 2024 年校招流程：全球统一在线笔试 1 万人，筛选 1800 人进入面试；面试共六轮，含三轮技术 面、两轮 HR 面（其中一轮为全英文面试）及 CEO 终面。 2024 年最终录取 200 余人，100%硕士及以上学历，985/211 硕士占比 97%；2026 届（今年 7 月入职）100 余人中本硕 985/211 占比已达 94%。 近年入职应届生已申请专利 100 余项；公司整体研发人员中硕士以上学历占比接近 88%。 中国大陆研发人员中工龄十年以上占比接近 30%，员工平均年龄不到 32 岁。 离职率：行业平均 16.5%时公司仅 2.8%，近年持续保持在 3%以下。 公司连续五年获评芯片行业最佳雇主；企业文化为“公正、关爱、分享、快乐”，公司前台和司机 均持有股票。 3.在手订单与新签订单情况 2025 年末在手订单 50.75 亿元。 2026 年 1 月 1 日至 4 月 29 日（一季报披露日），新签订单约 80 亿元；4 月 30 日至 7 月 16 日， 新增新签订单 64.13 亿元；即 1 月 1 日至 7 月 16 日累计新签订单近 150 亿元。 4 月 30 日至 7 月 16 日新签订单中，AI 相关订单及数据处理领域订单占比合计超过 90%。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 绝大部分新签订单为一站式定制服务，分为芯片设计业务和量产业务：芯片设计业务转化周期约 9- 12 个月逐步实现收入；量产业务生产周期 6-18 个月。 一季度末在手订单 51.33 亿元；半年报（下周披露）将更新截至半年的在手订单数据。 4.行业趋势与公司战略（戴总分享） 公司自两年多前即提出“云和端”布局，早期聚焦训练云，目前端侧（AI 眼镜、AI 玩具等）重要性 持续提升。 大模型趋势：从关注参数规模转向关注数据与垂直能力，小模型（通过大模型蒸馏/微调而来）在端 侧推理中作用关键。 定制芯片（ASIC）市场格局：海外多家 GPU/ASIC 公司已上市或准备上市，国内对应云服务商也在 推进，公司定位类似“中国的博通”，在 IP 和定制芯片领域具备优势。 AI 眼镜案例：公司展示小模型在 AI 眼镜上的实时翻译（中英文）能力，模型参数约 2.7B（270 亿 参数），可在端侧实现流畅翻译；同时强调音频传输仅需文字传输量的 1%，大幅降低带宽需求。 AI 玩具案例：公司演示了小模型为儿童实时生成故事的能力，强调端侧小模型需具备生动性、互动 性，且需从大模型出发进行蒸馏/微调，而非直接训练小模型。 公司认为当前 AI 投资应“该投资就投资”，节流有限、开源更重要；2023 年行业低谷期公司逆势 招聘，这批人才现已成为主力。 戴总强调：牛市长、熊市短，公司股价自 2024 年 9 月 23 日以来涨幅可观（尽管近期有所回 调），今年年初至今仍上涨 68%，跑赢上证综指和科创 50。 5.经营理念与风险提示 公司不仅关注增长（growth），也关注盈利收窄趋势；但需区分正常经营亏损与非现金项目（如股 权激励、并购相关）的影响。 公司认为 30%的收入增长目标在长周期行业中属于健康且可持续的水平，避免大起大落；历史上部 分公司因目标过高导致员工激励失效（如 1000 人目标仅 1/3 达成）。 行业存在不可控因素（如 HBM 缺货等供应链问题），考核目标需兼顾激励效果与可实现性。 公司强调人才投入的长期价值：当前招聘的人才经过 2-3 年培养后进入性价比最优阶段，叠加股权 激励，未来五年内公司将迈上新台阶。 问答整理 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Q1：关于股权激励目标，在手订单数据很好，但激励目标对应的收入增速看起来不是特别 高。请问订单和收入的兑现周期和节奏大概是怎样的？短期收入增速指引不高的原因是什么？ 答：A 股市场中能持续保持 30%增长的公司已经非常健康。我们所在行业周期很长，存在很多不可控 因素（如 HBM 缺货等供应链问题），不能完全把考核指标作为业绩承诺。历史上我们曾有过 1000 人 的激励目标，最终只有 1/3 达成，原因并非员工不努力，而是合同、客户等不可控因素导致。股权激励 应具有激励效果，目标需要合理可实现。保持 30%的持续增长比一次性爆发更健康——有些公司一下 子冲上去又跌下来，而连续多年保持 30%增长的公司（如每年 12%净利率）反而是很好的投资标的。 Q2：公司那么多 XPU IP，现在在端侧有放量趋势吗？ 答：四年前我们就开始布局端侧。目前手机端 AI 芯片存在“功能好但功耗不够”或“功耗好但功能不 够”的矛盾，通常采用大小核方案。定制芯片需要一定出货量才划算——现在很多 AI 产品（如 AI 眼 镜）每款出货量仅 20 万甚至不到 50 万，但未来两年内预计会有单款出货 50 万到 100 万的产品出 现。AI 玩具、手表、戒指、AI Pad、Android 设备等端侧产品正在逐步起量，但需要时间。我们在 AR 眼镜和 AI 玩具领域比较领先。当前云端（训练）需求依然旺盛，但端侧推理的重要性正在提升，这波 端侧机会到来时我们已做好充分准备。我们在 2023 年行业低谷期逆向招聘的人才，现在都已成为主 力。 原文 芯原股份 20260811_原文 2026 年 08 月 12 日 发言人 肯激励计划说明会，目前所有参会者均处于静音状态，下面开始播报声明，本次会议仅服务于参会的广 大投资者，会议音频及文字记录的内容仅供参会者内部使用，不得公开发布。鑫源股份未授权任何媒体 转发本次会议相关内容，未经允许和授权的转载、转发均属侵权。鑫源股份将保留追究其法律责任的权 利，信源股份不承担因转载、转发而产生的任何损失和责任。市场有风险投资需谨慎，提醒广大投资者 谨慎做出投资决策。会议开始前，我们提示各位投资者，在主讲嘉宾发言结束后将留有提问时间。下面 有请领导发言，谢谢。 发言人 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 好的，谢谢智能主持人，各位投资人，大家下午好。我是新来的艾菲。今天我们学习电话会的公司领 导，有互创始人董事长兼总裁戴总，以及公司总经理执行中高级副总裁李丽。我们是此前在 8 月 10 号 的时候，披露了我们 2026 年的现行股票激励计划。包括这个其实也是我们上市后的第四次的第二类现 金股票。今天的这个交流会，我们公司的管理层也会就我们这次股权激励事项去给各位做一些介绍和分 析，去讲一下我们这个计划的方案情况。介绍后也会是有这个 QA 环节，也欢迎大家踊跃提问。 发言人 首先进来先让我们有请丽丽给我们去讲一下储存激励的这个计划。好的，大家好。大家好，我是丽丽。 因为我们前两天刚刚发的这个信息股票激励计划，所以整个计划以及一些人才部分的话，我想先给大家 做再做一些介绍。是这样其实新人是长期秉持全员持股的理念的。对我们来说人就是最宝贵的资产。 发言人 其实我们在上市之前，我们就设立了这个期权 stock option，以及员工的持股的平台。我们一直是这 个股权其实是我们激励员工，包括保留员工的一个方式。那上去之后，进一步，我们也是进行了多次的 第二类限制性股票的一个激励计划。所以其实我们能够保留这么这么高的人才的稳定性，以及说远低于 行业的一个主动的离职率。其实这个也是跟我们长期的激励的计划分不开的那我们在周日的时候发布的 公告里面，这次的 2026 年发布了以后，其实我们也是全员持股，并且也是对着重像我们前几年我们在 面试招聘的时候，招到的这些优秀的工程师进行了一些，股权的激励。 发言人 那其实在公告里面我们也写了，我们是分 80%的首次授予，加上我们 20%的，后面的就预留的授予， 这个均价，这个价格是 112.56 块。这个我们在这个公告里面写了，欧洲我就不多讲了。那我们在公告 里面也有明确的是说，我们 2026 年的限制性股票的激励计划的考核目标是以 base 2025 年度的 document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
