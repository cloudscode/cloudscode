>\n\u003cli>半导体设备/先进封装景气延伸：SEMICON West 2026大会纪要显示行业能见度持续延伸，WFE上行周期明确至2027-28年并维持板块超配；2027年预计8-10座新晶圆厂投产，WFE同比增约45%至约2180亿美元，由DRAM、先进逻辑代工及NAND共同拉动；先进封装晶圆增速预计约为行业整体两倍，但风险包括DRAM/HBM需求走弱、洁净室及晶圆厂扩产延迟、先进封装及3D架构含量增益不及预期。\u003c/li>\n\u003cli>PCB/CCL/铜箔涨价链业绩兑现：兴森科技Q1-3归母4.0-4.3亿元、同比+204%-227%，中值4.2亿元、同比+216%，光模块mSAP已突破一线客户；大族数控前三季度营收78.4亿元、同比+100.9%；崇达技术预计前三季度归母5.95-6.85亿元、同比+89.73%-118.43%；产业调研显示上游一致上行、覆铜板结构分化，铜箔缺而不涨是最大预期差，PCB制裁实质影响有限（军用PCB仅占全球约5%）。\u003c/li>\n\u003cli>光通信/CPO与液冷电源在OCP 2026集中催化：第二天会议将Scale-up光学、CPO/NPO、CXL内存列为核心主线，NPO进入落地部署阶段；MRVL推出1.6T重定时光模块，甲骨文介绍800G NPO和1.6T LRO型NPO方案；大元泵业DC 800V直驱37kw液冷泵亮相OCP英伟达供应链展区，机柜功率向约600kW提升使800V直流侧挂电源架构更可能在2027年下半年落地。\u003c/li>\n\u003cli>宏观与贸易政策扰动延续：隔夜美国CPI高于预期，A股料再度低开；中国9月信贷投放超预期，增长主要来自政府债券发行，企业信贷反弹但整体贷款增长偏弱；中欧10月8-9日协议是一揽子稳定方案、非战略重置，未解决贸易失衡；中国自2027年4月1日起将新能源汽车出口增值税退税从13%降至9%。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>1. AI算力/大模型与AI数据中心融资风险\u003c/h3>\n\u003cul>\n\u003cli>主线：AI算力/大模型。\u003c/li>\n\u003cli>今天强化的逻辑：Anthropic 2026Q3收入168亿美元、环比增长约46%，略低预期，但连续两个季度实现调整后盈利；ARR略低预期，7月底以来Meta和微软削减用量、OpenAI市场份额扩大、更严格反蒸馏措施等潜在不利因素带来压力；芯片和数据中心是最大开支，对AI实验室训练和运行模型至关重要。\u003c/li>\n\u003cli>今天出现的催化/验证：Anthropic周三在旧金山向投资者推介，为预期公开上市做准备；CoreWeave股价周三一度暴跌17%、2032无担保债跌破80美分、收益率&gt;15%；CPI超预期加剧AI数据中心杠杆扩张债务脆弱性问题，美股AI板块情绪断崖式下挫，亚洲三星电子、SK海力士跌超6%，KOSPI一度跌6.5%。\u003c/li>\n\u003c/ul>\n\u003ch3>2. 半导体/先进封装\u003c/h3>\n\u003cul>\n\u003cli>主线：半导体/先进封装。\u003c/li>\n\u003cli>今天强化的逻辑：SEMICON West 2026行业能见度持续延伸，WFE上行周期明确至2027-28年，维持板块超配；2027年预计8-10座新晶圆厂投产，WFE同比增约45%至约2180亿美元，由DRAM、先进逻辑代工及NAND共同拉动；先进封装晶圆增速预计约为行业整体两倍；测试设备调研显示HBM堆叠驱动测试需求倍增，同等晶圆量下测试设备需求量达传统DRAM的5-6倍。\u003c/li>\n\u003cli>今天出现的催化/验证：SEMICON West 2026大会于10月13-14日举行，与应用材料、泛林半导体、泰瑞达、康泰克、昂拓创新、MKS仪器等交流；FormFactor投资者交流会；存储半导体跟踪观点认为，当前存储板块自9月高点回调约19%、几乎回吐至7月低点，主要反映市场对短期供需的过度担忧。\u003c/li>\n\u003c/ul>\n\u003ch3>3. PCB/CCL/铜箔\u003c/h3>\n\u003cul>\n\u003cli>主线：PCB/CCL/铜箔。\u003c/li>\n\u003cli>今天强化的逻辑：Q3盈利加速释放，产品调价、产能利用率提升与订单结构优化共同释放盈利弹性；上游电子布、覆铜板仍有进一步涨价空间，为板厂顺价提供支撑；产业调研显示上游一致上行、覆铜板结构分化，铜箔缺而不涨是最大预期差。\u003c/li>\n\u003cli>今天出现的催化/验证：兴森科技Q1-3归母4.0-4.3亿元、同比+204%-227%，中值4.2亿元、同比+216%，光模块mSAP已突破一线客户；大族数控前三季度营收78.4亿元、同比+100.9%；崇达技术预计前三季度归母5.95-6.85亿元、同比+89.73%-118.43%；PCB潜在制裁风险解读显示NDA法案制裁是既定事实但实质影响有限，军用PCB仅占全球约5%，头部厂商已提前切割相关销售；AT&amp;S管理层电话会显示营收高增，产能扩张获客户全额资金背书。\u003c/li>\n\u003c/ul>\n\u003ch3>4. 光通信/CPO/NPO\u003c/h3>\n\u003cul>\n\u003cli>主线：光通信/CPO/NPO。\u003c/li>\n\u003cli>今天强化的逻辑：OCP 2026第二天将Scale-up光学、CPO/NPO、CXL内存列为核心主线；NPO进入落地部署阶段；MRVL推出1.6T重定时光模块，支持单通道400G PAM4，连接方案覆盖有源铜缆到光互联；甲骨文介绍基于LPO的800G NPO方案及1.6T LRO型NPO方案；FormFactor第一工位光子芯片晶圆级光学测试对CPO、NPO架构无倾向性，同一套光学探针技术均可适配。\u003c/li>\n\u003cli>今天出现的催化/验证：OCP 2026大会第二日主题演讲与技术分会场，参会企业包含CRDO、ALAB、MSFT、ORCL、META、三星等；OCP第二日活动与ALAB、MPWR、Ferric半导体会谈，机柜功率向约600千瓦提升。\u003c/li>\n\u003c/ul>\n\u003ch3>5. 液冷/电源\u003c/h3>\n\u003cul>\n\u003cli>主线：液冷/电源。\u003c/li>\n\u003cli>今天强化的逻辑：机柜功率需求向约600千瓦提升，800伏直流侧挂电源架构更有可能在2027年下半年开始落地应用；高压DC屏蔽泵可直连800VDC母线，无需二次转换，降低高能耗故障与布线难度；半导体测试与系统电源中，AI芯片测试、老化测试场景对电源解决方案采用度持续提升。\u003c/li>\n\u003cli>今天出现的催化/验证：大元泵业DC 800V直驱37kw液冷泵亮相美国圣何塞OCP英伟达供应链展区，55kw屏蔽泵配套双鸿核心设备展出；先进能源投资者交流会；英伟达主旨演讲指出借助OCP完善面向下一代Rubin GPU及Vera CPU全套解决方案，估算工业富联、广达电脑、纬创等主要ODM厂商今年下半年开启相关产品出货。\u003c/li>\n\u003c/ul>\n\u003ch3>6. 宏观/策略与中欧贸易\u003c/h3>\n\u003cul>\n\u003cli>主线：宏观/策略与中欧贸易。\u003c/li>\n\u003cli>今天强化的逻辑：隔夜美国CPI高于市场预期，A股料再度低开；美股隔夜走势惨淡，AI板块情绪断崖式下挫；中国9月信贷投放超预期，增长主要来自政府债券发行规模提升，企业信贷有所反弹但整体贷款增长依旧偏弱；中欧10月8-9日协议是一揽子稳定方案，非战略重置，降低短期扰动风险但未解决贸易失衡根本矛盾；欧盟对华商品贸易逆差日均约10亿欧元，结构从低成本消费品转向汽车、电池、机械及电气设备。\u003c/li>\n\u003cli>今天出现的催化/验证：中国自2027年4月1日起将新能源汽车出口增值税退税从13%降至9%；德国计划推动欧盟对中国商品增设进口限额，目标品类包含化工品、机械设备；市场流动性被视为最大关注点；银行板块北向持仓增幅最大，环比提升47%。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>AI与科技融资：Anthropic Q3收入168亿美元，环比约46%，略低预期，连续两季调整后盈利，旧金山投资者推介准备预期公开上市；CoreWeave股价周三一度暴跌17%，2032无担保债跌破80美分、收益率&gt;15%；美股标普500跌111bp收7719，纳指跌202bp收29950；亚洲三星电子、SK海力士跌超6%，KOSPI一度跌6.5%。\u003c/li>\n\u003cli>半导体：SEMICON West 2026 WFE 2027同比+45%至2180亿美元，8-10座新晶圆厂，DRAM/先进逻辑/NAND拉动；先进封装晶圆增速约行业2倍；HBM测试设备需求为传统DRAM的5-6倍；长鑫科技披露4F2架构
