urce_label": "帖子正文", "excerpt": "【天孚通信：拟以人民币1亿元-1.5亿元回购公司股份】天孚通信公告，控股股东苏州天孚仁和投资管理有限公司提议公司以自有或自筹资金通过集中竞价交易方式回购股份，回购资金总额不低于人民", "content": "", "publish_time": "2026-10-15 20:10", "tags": ["文字观点"]}, "post:2026-10-15T20-08:aa0b1e527ead": {"id": "post:2026-10-15T20-08:aa0b1e527ead", "kind": "post", "title": "2026-10-15 20:08", "source_label": "帖子正文", "excerpt": "【光迅科技：预计2026年前三季度净利润同比增长65.37%～82.26%】光迅科技公告，预计2026年前三季度归母净利润为11.89亿元～13.1亿元，同比增长65.37%～82", "content": "", "publish_time": "2026-10-15 20:08", "tags": ["文字观点"]}, "post:2026-10-15T09-35:9856985b518c": {"id": "post:2026-10-15T09-35:9856985b518c", "kind": "post", "title": "2026-10-15 09:35", "source_label": "帖子正文", "excerpt": "市场波动大，聚焦超强阿尔法——业绩和订单持续超预期的： 1、【松发股份】船舶中阿尔法最强的之一。", "content": "", "publish_time": "2026-10-15 09:35", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-15T08-19:bd1502a5d5af": {"id": "post:2026-10-15T08-19:bd1502a5d5af", "kind": "post", "title": "2026-10-15 08:19", "source_label": "帖子正文", "excerpt": "🔥Anthropic 第三季度营收跃升至 168 亿美元 🤖这家 AI 初创公司周三在旧金山向投资者进行了推介，为其预期的公开上市做准备。👤Anthropic 首席执行官达里奥・阿莫代伊。", "content": "🔥Anthropic 第三季度营收跃升至 168 亿美元 🤖这家 AI 初创公司周三在旧金山向投资者进行了推介，为其预期的公开上市做准备。 👤Anthropic 首席执行官达里奥・阿莫代伊。该公司曾警告投资者，其技术可能对人类构成 “生存风险”。©2026 Getty Images 📰Anthropic 向其投资者表示，第三季度营收跃升至 168 亿美元，且公司在该季度实现盈利。这家 AI 集团正寻求为其重磅公开上市争取支持，尽管市场对 AI 交易存在担忧。 📅这家初创公司周三在其旧金山办公室召集投资者，进行了为期一整天的展示，高管们阐述了以安全为核心的经营理念、快速增长和效率提升将如何为 Anthropic 在 11 月成功进行首次公开发行奠定基础。 📊投资者一直焦急等待该集团财务表现的更新。Anthropic 的年化营收，以及竞争对手 OpenAI 的年化营收，是衡量其增长和持续投入基础设施能力的关键指标，而基础设施正是 AI 相关金融热潮的核心。 💰这家初创公司告诉投资者，按调整后口径计算其已实现盈利，且季度营收较今年第二季度录得的 115 亿美元增长了近 50%。 💻芯片和数据中心是该公司最大的开支，它们对 AI 实验室训练和运行模型至关重要。Anthropic 还表示，该季度实现了正现金流。 📈这家 Claude 开发商上市被广泛预期为史上估值最高的 IPO。但近几个月来 AI 模型出现的一系列黑客攻击和其他不当行为事件，以及对该技术风险不断升级的警告，使投资者难以对该公司进行估值。 📄在上月向一小群投资者传阅的 S-1 文件早期版本中，近三分之一的篇幅用于阐述 “风险因素”，包括 AI 模型表现出不可预测和恶意行为的可能性。 ⚠️Anthropic 警告投资者，其技术可能对人类构成 “生存风险”。 🤔华尔街还必须回答一些更常规的问题：在来自 OpenAI、Meta 等对手日益激烈的竞争下，Anthropic 能否维持其飞速的增长步伐。 📉利率上升和更具挑战性的宏观经济环境，也可能抑制该公司未来十年在基础设施和算力上投入逾 5000 亿美元的计划。 💹受通胀上升以及对为 AI 热潮大举借贷的担忧影响，美国芯片股周三大幅下跌。🔥Anthropic 第三季度营收跃升至 168 亿美元 🤖这家 AI 初创公司周三在旧金山向投资者进行了推介，为其预期的公开上市做准备。 👤Anthropic 首席执行官达里奥・阿莫代伊。该公司曾警告投资者，其技术可能对人类构成 “生存风险”。©2026 Getty Images 📰Anthropic 向其投资者表示，第三季度营收跃升至 168 亿美元，且公司在该季度实现盈利。这家 AI 集团正寻求为其重磅公开上市争取支持，尽管市场对 AI 交易存在担忧。 📅这家初创公司周三在其旧金山办公室召集投资者，进行了为期一整天的展示，高管们阐述了以安全为核心的经营理念、快速增长和效率提升将如何为 Anthropic 在 11 月成功进行首次公开发行奠定基础。 📊投资者一直焦急等待该集团财务表现的更新。Anthropic 的年化营收，以及竞争对手 OpenAI 的年化营收，是衡量其增长和持续投入基础设施能力的关键指标，而基础设施正是 AI 相关金融热潮的核心。 💰这家初创公司告诉投资者，按调整后口径计算其已实现盈利，且季度营收较今年第二季度录得的 115 亿美元增长了近 50%。 💻芯片和数据中心是该公司最大的开支，它们对 AI 实验室训练和运行模型至关重要。Anthropic 还表示，该季度实现了正现金流。 📈这家 Claude 开发商上市被广泛预期为史上估值最高的 IPO。但近几个月来 AI 模型出现的一系列黑客攻击和其他不当行为事件，以及对该技术风险不断升级的警告，使投资者难以对该公司进行估值。 📄在上月向一小群投资者传阅的 S-1 文件早期版本中，近三分之一的篇幅用于阐述 “风险因素”，包括 AI 模型表现出不可预测和恶意行为的可能性。 ⚠️Anthropic 警告投资者，其技术可能对人类构成 “生存风险”。 🤔华尔街还必须回答一些更常规的问题：在来自 OpenAI、Meta 等对手日益激烈的竞争下，Anthropic 能否维持其飞速的增长步伐。 📉利率上升和更具挑战性的宏观经济环境，也可能抑制该公司未来十年在基础设施和算力上投入逾 5000 亿美元的计划。 💹受通胀上升以及对为 AI 热潮大举借贷的担忧影响，美国芯片股周三大幅下跌。#文字观点", "publish_time": "2026-10-15 08:19", "tags": ["文字观点"]}, "post:2026-10-15T22-39:fc5bfda5a4b1": {"id": "post:2026-10-15T22-39:fc5bfda5a4b1", "kind": "post", "title": "2026-10-15 22:39", "source_label": "帖子正文", "excerpt": "📑SEMICON West 2026：行业前景更加明朗，维持看好 📅我们于 10 月 13‑14 日参加了在加利福尼亚旧金山举办的 SEMICON West 展会，与应用材料、泛林半导体、泰瑞达、康泰克、昂拓创新、MKS 仪器以及行业内多家其他公司开展交流。📈综合本次参会收获，我们对 2027、20", "content": "📑SEMICON West 2026：行业前景更加明朗，维持看好 📅我们于 10 月 13‑14 日参加了在加利福尼亚旧金山举办的 SEMICON West 展会，与应用材料、泛林半导体、泰瑞达、康泰克、昂拓创新、MKS 仪器以及行业内多家其他公司开展交流。 📈综合本次参会收获，我们对 2027、2028 年晶圆设备（WFE）增长的看法边际转好，该判断与我们近期晶圆设备展望保持一致。 📝下面梳理行业核心观点，以及各家公司调研要点。 ⚙️晶圆设备（WFE）趋势：尽管各家公司并未给出晶圆设备预期的量化更新，但行业达成共识，受全球 8‑10 座涵盖多类产品的全新晶圆厂投产带动，2027 年会是晶圆设备行业表现十分强劲的一年。 💰我们当前测算，2027 年晶圆设备市场规模同比增长 45% 左右，约 2180 亿美元，增长动力来自 DRAM、先进制程逻辑 / 代工厂以及 NAND 闪存。 🧠先进制程逻辑芯片：随着人工智能数据中心建设持续扩张，先进制程逻辑芯片相关需求持续向上。 🔍测试赛道：芯片复杂程度不断提升，市场需要创新解决方案帮助客户缩短产品上市周期。 ⏱最新一代 GPU 与加速芯片的测试时长仍在不断增加，我们认为这将成为未来几年自动测试设备（ATE）增长的核心驱动因素，光网络等新兴市场同样会带来增量空间。 🔬后端检测与量测：受 CoWoS、HBM，以及中长期需求驱动因素进入早期放量阶段等多重因素推动，行业参与者对 2027 年的需求前景保持非常积极的态度。 📋公司会面核心要点 🛠️应用材料调研要点 👥参会人员：战略与营销副总裁 Kevin Moraes；先进封装副总裁 Sree Kesapragada；投资者关系负责人 Mike Sullivan。 ❓投资者提问主要围绕该公司投资者交流会内容以及财务目标进行确认。 💴针对营收以及资本密集度，管理层表示半导体行业产品定价属于自身无法掌控的关键变量，但对 “单节点晶圆设备投入强度上行” 这套分析框架具备高度信心，客户目前已经程序化锁定该部分增量投入。 📊针对公司 200 个基点的市占率提升目标，管理层说明该目标计算涉及复杂的产品结构效应，同时中国出口管制豁免条款会带来显著影响。 📈对于公司新提出的 2030 年 54% 毛利率目标，应用材料认为该目标存在向上突破的可能性，但同时指出公司绝大部分成本都属于变动成本。 🔭在光学设备业务方面，应用材料认为可以依托电子束技术领域的专业积累与市场地位，切入这个规模 90 亿美元的相邻市场。 ✨针对 AGS 业务，管理层对该业务长期 15% 左右营收增速的前景抱有高度信心，同时表示新设备的服务配套率要高于存量装机设备。 ⚙️泛林半导体调研要点 👥参会人员：投资者关系副总裁 Ram Ganesh。 🔁与此前表态保持一致，泛林半导体预计 2027 年会有 8‑10 座全新晶圆工厂项目投产；公司判断产品增长将依次由 DRAM、先进代工厂 / 逻辑芯片、NAND 闪存来驱动。 🎯公司尚未给出实现全新长期 55% 毛利率目标的时间节点。 ⌛我们预计该目标需要数年时间达成，目标实现更多取决于产品结构（尤其是 Akara 这类新产品）以及海外生产运营效率，而非单纯依靠同产品提价。 ✅管理层对公司在逻辑芯片、DRAM 以及先进封装领域的竞争地位维持乐观；随着硬掩模、表面预处理、硅通孔以及其他材料工艺步骤等各类全新器件结构出现，刻蚀与薄膜沉积的投入强度还会持续提升。 🧪泰瑞达调研要点 👥参会人员：计算测试事业部副总裁兼总经理 Roy Chorev；投资者关系副总裁 Amy McAndrews。 🤝泰瑞达在 SEMICON West 展会上宣布与 FormFactor 达成战略合作并完成对其投资。 🔌泰瑞达依旧坚持探针卡供应商开放生态，但 FormFactor 在硅光领域具备强劲实力，因此双方需要建立更紧密的合作，让泰瑞达可以投入更多工程平台资源。 🚀针对 XPU 业务，泰瑞达长期依旧看好在第三方 GPU 市场获取更多份额；管理层提到，受晶体管数量近乎翻倍影响，Rubin 芯片测试时长几乎达到 Blackwell 芯片的两倍。 💼泰瑞达也在争取英特尔的测试设备订单，英特尔正计划提高对外采购供应商占比（目前使用内部自研方案），该变化会先从其代工厂业务落地，泰瑞达判断这会带来中期业务机遇。 💾在存储业务板块，泰瑞达认为客户降低 HBM 规格带来的影响有限，因为业务需求主要由出货颗数驱动，而非堆叠层数。 🔗针对共封装光学，泰瑞达判断该产品拥有极强的放量机遇，但当前行业尚处在早期发展阶段，制造流程不同环节的测试强度大概率会出现较大变动。 🔎康泰克调研要点 👥参会人员：执行董事长 Lior Aviram；首席执行官 Rafi Amit；总裁兼首席运营官 Ramy Langer；首席财务官 Moshe Eisenberg；营销总监 Eyal Segev。 📢我们参与了康泰克在 SEMICON West 期间举办的投资者交流会，核心要点如下。 💰长期财务目标：配合本次投资者交流会，康泰克提前披露 2026 年第三季度营收为 1.60‑1.61 亿美元，高于此前指引；给出 2026 年第四季度营收指引约 1.80 亿美元；基于当前已获取订单，初步给出 2027 年 8 亿美元的营收展望。 🎯管理层设定三年左右实现 12 亿美元营收的长期目标，毛利率目标 55%‑56%，营业利润率目标 34%‑36%。 📈先进封装仍是核心增长驱动，康泰克表示先进封装业务占近期订单的八成左右；公司预计先进封装晶圆增速约为行业整体增速的两倍。 ✨公司绝大部分业务来自高端市场，受人工智能、硅光、更高密度互连、检测与量测要求日趋复杂等因素驱动，预计高端市场到 2031 年复合增速约 24%。 🗺️技术与产品路线图围绕检测以及专用量测业务展开：康泰克路线图核心为可以增厚利润的 Hawk、Eagle 检测产品，两类产品占 2026 年业务结构的 85%，同时包含量测平台。 🤖另外管理层提到，公司正将人工智能融入缺陷识别与分类环节，计划 2027 年推出搭载 AI 能力的软件产品，该能力来自对 Visual Layer 的收购。 🤝并购战略聚焦能力获取与战略扩张：康泰克表示既会开展小型收购，为核心业务补充技术与人才，也会推进大型战略交易拓宽产品供给；同时强调 12 亿美元营收目标以及财务模型并未假设大规模并购贡献业绩。 🔬昂拓创新调研要点 👥参会人员：首席财务官 Brian Roberts；投资者关系副总裁 Sidney Ho。 📈昂拓创新对 2026 年下半年延续至 2027 年的多重需求驱动前景保持高度乐观，伴随增量市场机会释放，预计明年行业增长还会加速。 💿在 HBM 业务上，昂拓创新判断 XPU 厂商下调 HBM 规格对自身业务冲击很小，公司设备需求更多取决于出货颗数，而非堆叠层数。 🧩公司持续将 CoWoS 视为核心需求驱动来源，目前该业务的需求越来越多来自封测服务商，而不再只是台积电；昂拓创新认为 EMIB‑T 会带来重大机遇，预计 2028 年该业务贡献会具备实质性规模。 🏆竞争层面，昂拓创新对自身包括台积电在内的市场份额地位信心充足，认为竞争对手的潜在新品发布不会带来迫在眉睫的冲击。 📊利润率方面，管理层对自身毛利率扩张 350 个基点的目标保持信心，认为仅依靠产品结构优化以及制造运营效率提升就可以完成目标。 💹公司认为营收还有很大向上增长空间，不存在产能约束问题。 ⚙️MKS 仪器调研要点 👥参会人员：总裁兼首席执行官 John Lee；投资者关系副总裁 Paretosh Misra。 📈MKS 仪器认为，受人工智能与数据中心需求拉动，行业正处在一轮大周期上行的早‑中期阶段。 💵公司正在为 2028 年晶圆设备总支出最高 3000 亿美元的潜在规模做准备，后续该数值还有继续走高可能。 🚀短期来看，受供应链库存因素影响，公司营收增速有望跑赢下游客户，2026 年第二季度已经实现半导体业务同比增速首次超过下游客户。 🏭MKS 仪器槟城工厂可以支撑约 2500 亿美元规模的晶圆设备市场，还具备额外 20% 的弹性产能；如果前述预测兑现，公司可能需要进一步扩充产能。 ✅重要的是，公司认为自身当前并没有制约下游客户的扩产计划。 📉公司尚未进行大规模涨价，认为现有产品组合布局合理；若估值合适，公司会考虑剥离部分特种工业产品线。#文字观点", "publish_time": "2026-10-15 22:39", "tags": ["文字观点"]}, "post:2026-10-15T08-31:c03fecfe7b17": {"id": "post:2026-10-15T08-31:c03fecfe7b17", "kind": "post", "title": "2026-10-15 08:31", "source_label": "帖子正文", "excerpt": "Anthropic Q3收入略低预期，连续两个季度实现调整后盈利（1015）@华泰计算机 ARR略低预期。据FT报道，Anthropic 2026Q3收入168亿美元，环比增长约46%。", "content": "Anthropic Q3收入略低预期，连续两个季度实现调整后盈利（1015）@华泰计算机 ARR略低预期。 据FT报道，Anthropic 2026Q3收入168亿美元，环比增长约46%。结合7月底超过650亿美元的ARR，按照最近一个月收入×12、假设月度平滑增长，测算9月底ARR约694亿美元 ；若按照每日收入年化 、假设每日平滑增长，则约715亿美元 。无论怎么算吧，整体低于此前TickerTrends追踪的768亿美元。 收入增长边际放缓。 Q1—Q3收入分别约47亿、115亿、168亿美元，Q3环比增速从Q2的约145%下降至46%。 反蒸馏或影响表观收入。 Anthropic近日发布反蒸馏报告，披露已封禁数万个蒸馏相关账户 ，主动放弃相当规模的收入及数万亿Token付费流量 。考虑部分中国模型相关蒸馏付费需求被阻断，若还原这部分潜在收入，实际需求可能更接近此前预期。 盈利能力持续改善。 Q3连续第二个季度实现调整后盈利，调整后经营利润率约11%，现金流转正；每投入1美元算力成本，可产生约1.7美元收入。 O/A收入并非AI产业收入的全部。 最近有些领导给了很大的启发：NVIDIA、云厂商正积极支持开源模型，企业也在推进自建模型、私有化部署及应用落地，O/A收入不是AI的全部，但是由于这个指标比较好跟踪，而且又是最头部的公司，所以影响是比较大的，但是也不能简单推断整个AI产业需求同步放缓。 From 华泰计算机 郭雅丽/范昳蕊/袁泽世/岳铂雄/王浩天/徐诚伟。#文字观点", "publish_time": "2026-10-15 08:31", "tags": ["文字观点"]}, "attachment:files/1015脱水研报.pdf": {"id": "attachment:files/1015脱水研报.pdf", "kind": "attachment", "title": "1015脱水研报", "source_label": "其他", "excerpt": "32.00 219.56机械设备 Q3业绩前瞻：半导体设备、 PCB钻针、 激光设备等高景气确定性强；AI改造广告引擎， GEO市场4年从56亿涨到 240亿，AI答案正在成为 广告业的黄金铺位 ——1015 脱水研报 2026/10/15 19:58 今日内容： 1、AI改造广告引擎， GEO市场4年从56亿涨到 240亿，AI答案正在成为广告业的黄金铺位", "content": "32.00 219.56机械设备 Q3业绩前瞻：半导体设备、 PCB钻针、 激光设备等高景气确定性强； AI改造广告引擎， GEO市场4年从56亿涨到 240亿，AI答案正在成为 广告业的黄金铺位 ——1015 脱水研报 2026/10/15 19:58 今日内容： 1、AI改造广告引擎， GEO市场4年从56亿涨到 240亿，AI答案正在成为广告业的黄金铺位。 2、机械设备 Q3业绩前瞻：半导体设备、 PCB钻针、激光设备等高景气确定性强。 3、食品饮料三季报业绩前瞻：低位信号已经较为明确， 2027年有望重回上行周期。 4、AI机房要高密度直流电，固态变压器熬了 50年终于等到拐点，全球 2700亿市场， 27-29年推 广，29年后放量。 【本文来自持牌证券机构，不代表平台观点，请独立判断和决策】 摘要： 1、AI广告： AI正在重写广告行业的入口和规则。 AI回答取代搜索结果页成为第一触点， OpenAI周活超 10亿，豆包月活达 3.82亿。WPP预测生成式搜索广告收入将从 2026年的51亿 美元涨至 2030年的1000多亿美元； ChatGPT Ads上线不到 200天，年化收入突破 10亿美元。 品牌营销同步转向 GEO，2026年全球 GEO市场规模有望达 240亿美金。 AI同时改造广告引 擎，头部媒体和三方平台的效率红利已体现在财报里。关注：易点天下、蓝色光标、浙文互 联、因赛集团、壹网壹创。 2、机械前瞻： 申万宏源发布机械行业 2026年三季报业绩前瞻，对 34家重点公司逐家给出预 测：科技产业链增速领跑，预计鼎泰高科 Q3净利润或增 390%，联动科技或增 966%；传统板 块供需两旺，工程机械、轨交景气延续，人民币升值带来的汇兑一次性冲击自 Q3起有望减 弱。关注鼎泰高科、中钨高新、长川科技、三一重工等。 3、食饮前瞻： 申万宏源对 35家食品饮料重点公司的 2026年三季度业绩做出预测： 4家公司净 利润增速超过 20%，洽洽食品以 100%的增速居首，万辰集团、妙可蓝多、中炬高新紧随其 后，洋河股份、酒鬼酒实现扭亏，泸州老窖下滑 50%。板块内部明显分化，大众食品的结构 性改善正在展开，企业竞争从价格转向质量，食品 CPI有望逐季改善。从行业自身周期位置 看，低位信号已经较为明确， 2027年有望重回上行周期，幅度和速度取决于宏观环境。关 注：贵州茅台、泸州老窖、山西汾酒、伊利股份、新乳业、妙可蓝多、盐津铺子。 4、固态变压器： 东吴证券研报指出， AI推动固态变压器（ SST）迎来商业化拐点：英伟达白 皮书明确 SST为AIDC供电的最终方案， AIDC供电正向 800V直流演进， SST是转换效率最 高、环节最少的供电架构，全链路效率可提升 3%以上。测算到 2030年全球 SST市场有望超 2700亿元，其中中国超 470亿元、海外超 2200亿元；行业当前处示范探索期， 2027-2029 年有 望迎来工程推广期。高频隔离变占 BOM约25%、是技术卡脖子环节。相关公司：阳光电源、 四方股份、金盘科技、中国西电、伊戈尔等。 正文： 1、AI改造广告引擎， GEO市场4年从56亿涨到 240亿，AI答案正在成为广告业 的黄金铺位   2026年全球广告支出预计达 1.3 万亿美元，但入口已经换人： AI回答正取代搜索结果页成为第 一触点。 生成式搜索广告收入将从 2026 年的 51 亿美元升至 2030 年的 1000 多亿美元； ChatGPT Ads上线不到 200 天，年化收入运行率突破 10 亿美元。品牌营销随之转向 GEO ，争夺 AI 答案里 的推荐位。关注： 易点天下 、蓝色光标 、浙文互联 、因赛集团 、壹网壹创 。 1）AI回答成为第一触点，流量入口正在向 AI 应用迁移 广告的基本盘还在扩张。 WPP 预测 2026 年全球广告支出有望增至 1.3 万亿美元；中国市场广告 支出预计达 1.64 万亿元，计划增加预算的广告主比例回升至 30% 。 01 变化发生在用户获取信息的方式上。搜索过程正演变为 “ 对话式 ” 互动，用户直接提问， AI 整合 信息生成结构化答案；传统模式下用户的决策链路是搜索、点击、阅读、比较、决策， AI 则 代替搜索结果页完成信息筛选、总结及推荐，用户无需跳转即可获得完整方案。 搜索广告和 展示广告的界面层级因此下降， AI 回答成为新的 “ 第一触点 ”，未来 AI Agent 还有望进一步参与 消费决策与交易执行。 WPP预测生成式搜索将成为有史以来增速最快的广告渠道，收入从 2026 年的 51 亿美元升至 2030年的 1000 多亿美元，复合增速超过 100% 。传统搜索广告做到千亿规模用了 22 年，而生 成式搜索可能 6 年就能走完 。分地区看， 2026 年美国是第一大市场，中国位居第二。 02 谷歌布局最早，基础设施也最完整。 AI Mode 全球 MAU 已超过 10 亿， AI Overviews MAU 超过 25亿；先后上线 AI Overview Ads 、 AI Max 等产品，随后又推出基于 Gemini 模型的对话式发现 广告、高亮推荐回答、 AI 购物广告等一系列新格式，广告可以直接回答用户的特定问题。 Open AI的速度更快。年初宣布拓展广告业务并开启测试， 8 月底宣布 ChatGPT Ads 推出不到 200天、年化收入运行率达到 10 亿美元，随后又测试 Sponsored Agents 并接入 HubSpot 和 Shopify。头部 AI 平台的广告商业化潜能才刚开始释放，全球和中国都仍处在探索早期。 2）用户不点链接了，品牌营销转向争夺 AI 答案里的推荐位 营销范式随之重构。过去做 SEO 是把网页排到搜索结果前面，靠关键词匹配和链接权重抢点 击；GEO 做的是另一件事：通过优化内容结构、信源权威性和语义表达，让 AI 在回答用户问 题时优先识别、引用并采信品牌内容，衡量指标从点击率变成 AI 采信度、提及率和引用率。 GEO不追求用户点击，追求被 AI 引用和推荐 ，品牌营销的争夺从流量入口和广告曝光，延伸 到了AI生成答案里的品牌认知与推荐位置。 03   据测算， 2026 年全球 GEO 市场规模有望达 240 亿美金，中国市场 56 亿人民币， 2030 年增至 240亿人民币。落地速度也在加快， 2026 年上半年中国 GEO 服务市场单季收入环比走高，企 业投入正从试点项目转向常态化预算。 04 3）AI改造广告引擎，头部媒体和三方平台率先吃到效率红利 生成式 AI 推动广告系统从规则匹配、特征工程与机器学习预测，转向以大模型为基础的智能 决策系统，改造覆盖广告召回、创意生产、排序竞价、自动投放和效果归因。效率红利已经 体现在财报上： Meta 最新季度广告收入同比增长 27% ，展示量和平均价格同步增长；腾讯二 季度收入 436 亿元，同比增长 22% ， AI 驱动的广告推荐模型优化是主要推手之一。 05 三方平台的逻辑是飞轮。 AI 与算法提升平台的价值预测能力，计费方式从按点击、下载计费 逐步过渡到按最终投放回报（ ROAS ）计费，数据积累与算法迭代形成正向循环。 AppLovin 推出AXON2.0 广告引擎后，经调整 EBITDA 率持续走高；汇量科技近三年陆续上线 IAA-   ROAS、 Target-CPE 等产品，新一代 AI 基础设施持续推进。 数据积累与 AI 算法形成飞轮效 应，优势平台持续释放经营杠杆 。 相关公司： 易点天下 、蓝色光标 、浙文互联 、因赛集团 、壹网壹创 。 2、机械设备 Q3 业绩前瞻：半导体设备、 PCB 钻针、激光设备等高景气确定性 强 申万宏源发布机械行业 2026 年三季报业绩前瞻，对 34 家重点公司逐家给出预测：科技产业链 增速领跑，预计鼎泰高科 Q3 净利润或增 390% ，联动科技或增 966% ；传统板块供需两旺，工 程机械、轨交景气延续，人民币升值带来的汇兑一次性冲击自 Q3 起有望减弱。关注鼎泰高 科、中钨高新、长川科技、三一重工等。 机械各个细分来看，申万宏源预测 科技产业链公司增速全面领先，钻针、半导体测试设备、 数控机床等多个环节都有公司单季归母净利润预增翻倍以上 ；工程机械与轨交公司增速相对 平稳。 1）半导体设备景气延续， 2026 年全球销售额将创历史新高 半导体设备是这轮科技景气中确定性较强的环节。 SEMI 在年中预测报告中指出， 2026年全球 半导体制造设备总销售额将创下 1659 亿美元的历史新高 ，同比增长 23.2% ，增长势头预计持 续至2028 年，届时总设备销售额有望达到 2295 亿美元，增长动力主要来自晶圆厂设备。 落到国内公司，测试设备环节的业绩弹性已开始兑现，长川科技 Q3 净利润预增 48% ，广立微 预增88% 。报告从前道设备、后道测试设备、零部件三个环节梳理了受益公司。 2）PCB钻针量价齐升，新材料让损耗速度提升数倍 全球PCB 产业正加速向高性能化、高密度化演进， AI 和高性能计算是核心驱动。材料升级、 层数增加对钻针的断针率、长径比、耐磨性提出更高要求， 下一代机柜方案可能使用 M9+Q 布 或PTFE材料，钻针寿命骤降，损耗速度提升数倍 ；Rubin Ultra 系列或将采用正交背板，层数 更多、板材更厚，带来分段钻需求，单孔用针量进一步提升。 高性能钻针具备涂层、高长径比等特性，价格更高，钻针厂商受益于量价齐升、高端化及国 产化加速。业绩预测已经体现这一逻辑，券商预计中钨高新 Q3 净利润或增 228% ，欧科亿或增 138%，钻针龙头鼎泰高科的增速更为陡峭。 3）技术迭代与产业化推进，光模块、激光、机器人需求多点开花 光模块正向集成化、高速化演进， 800G 光模块已实现规模化量产， 1.6T 正处于头部云厂商测 试验证关键期， 3.2T 技术迭代速度持续加快。 CPO/NPO 通过将光引擎与交换芯片近距离耦 合，成为突破更高速率带宽瓶颈的关键技术路径。受益环节集中在三块：测量仪器与老化测 试、耦合贴片等生产环节设备、光纤连接器。 激光设备分两条线，通用激光受益于高功率、管 / 坡等工艺迭代和海外出口增量，需求快速增 长；专用激光则由 AI PCB 超快钻孔、光伏 BC 电池、固态电池、 3D 打印、 TGV 等新技术迭代 带来增量需求。 人形机器人产业化在 2026 年进入新阶段，报告提示关注三条主线：特斯拉产品迭代与国产供 应链变化，全球巨头陆续发布机器人产品，各类机器人在具体场景落地放量。目前人形机器 人实际销售规模较低，在相关公司收入利润中占比较小，商业化推进后有望看到业绩贡献。 4）工程机械与轨交供需两旺，汇率一次性冲击自 Q3 起减弱 工程机械国内外需求保持高景气。据工程机械协会统计， 2026 年 1-8 月共销售挖掘机 191557 台，同比增长 24.2% ，其中出口同比增长 31.8% 。上半年人民币升值令主机厂产生较多汇兑损 失，去年同期则为汇兑收益，利润端承受了一次性冲击， 26Q3开始汇率冲击有望减弱 。 轨交需求同样强劲， 2026 年 1-8 月全国铁路固定资产投资完成 5118 亿元，同比增长 1.5% ，中 秋国庆假期全国铁路累计发送旅客 3.02 亿人次，同比增长 24.6% 。 06   3、食品饮料三季报业绩前瞻：低位信号已经较为明确， 2027 年有望重回上行周 期 申万宏源的食品饮料 2026 年三季报前瞻，对 35 家重点公司 Q3 业绩逐一给出预测。 预计4家净利润增速超过 20%，洽洽食品 预增100% 排在第一， 万辰集团 、妙可蓝多 、中炬高 新紧随其后， 洋河股份 、酒鬼酒预计扭亏。 从行业自身所处的周期位置来看，低位信号已经较为明确， 2027 年行业有望重回上行周期 ， 但是上行的幅度和速度仍然取决于宏观经济环境。 白酒看好： 贵州茅台 、泸州老窖 、山西汾酒 、今世缘、迎驾贡酒 、金徽酒。 大众食品子行业已呈现结构性改善，企业竞争从价格转向质量，行业供需逐步平衡，原料成 本传导至下游，食品 CPI 有望逐季改善。具备顺周期属性，估值低位，且具备中长期成长空 间的公司将迎来修复。看好顺周期的餐供及调味品，乳制品的结构性机会。对应： 伊利股 份、安井食品 、海天味业 、新乳业、优然牧业、现代牧业、 盐津铺子 ，妙可蓝多 、鸣鸣很 忙、东鹏饮料 。 各家公司的 Q3 业绩预测明细见下表。 07   4、AI机房要高密度直流电，固态变压器熬了 50 年终于等到拐点，全球 2700 亿 市场， 27-29 年推广， 29 年后放量 东吴证券研报指出， AI 推动固态变压器（ SST ）迎来商业化拐点：英伟达白皮书明确 SST 为 AIDC供电的最终方案， AIDC 供电正向 800V 直流演进， SST 是转换效率最高、环节最少的供 电架构，全链路效率可提升 3% 以上。测算到 2030 年全球 SST 市场有望超 2700 亿元，其中中国 超470亿元、海外超 2200 亿元；行业当前处示范探索期， 2027-2029 年有望迎来工程推广期。 高频隔离变占 BOM 约 25% 、是技术卡脖子环节。相关公司： 阳光电源 、四方股份 、金盘科 技、中国西电 、伊戈尔等。 1）英伟达定调 SST为AIDC供电最终方案， 50年老技术站上商业化前夜 固态变压器（ SST ）自 1970 年由 GE 提出，历经数十年技术积淀，叠加 AI 对高功率密度直流配 电需求的拉动，产业有望迎来商业化拐点期。 08   SST用功率半导体和高频磁性元器件替代传统工频变压器，功能从单纯电压变换升级为 \" 电压 变换+PFC+ 双向功率流 + 智能控制 \" 。 AIDC 供电正向 800V 直流演进，传统 UPS 交流配电已不再 适配，而 SST 是转换效率最高、环节最少的供电架构： 英伟达在 25 年发布的白皮书中明确 SST为 AIDC 供电的最终方案，其白皮书 2.0 中阶段 C 将采用 SST 作为 800V DC 架构的终极方 案；谷歌正推动支持 1MW 机架的 ±400V 直流配电架构，微软则明确将 SST 作为数据中心供电 体系的下一步升级方向。 09 经济账也说得通。配合 SiC 等宽禁带器件， SST 峰值效率可达 98.5% 以上，全链路效率较传统 方案提升 3% 以上，占地面积不到传统 UPS 供电链路的 50% ；按 2.5MW 系统、负载率 90% 测 算，每年可节电约 59 万度（ 2500kW×90%×3%×24h×365=591300kWh ，研报测算）。 2）零部件价值量拆解，高频隔离变占 25%成卡脖子环节 东吴证券拆解 SST 硬件 BOM ：高频隔离变占比约 25% 、高频功率器件约 15% 、电容约 12% 。 10 核心硬件中， SiC MOS 最适配 SST 需求，正朝 3.3kV 甚至 10kV 高耐压发展（一路电至少需串 联8个模块以承受 10kV 电压，三相整流需 24 个模块），该环节海外公司优势仍较大。 11   高频隔离 变决定 SST 的可靠性和运行寿命，是目前硬件部分技术卡脖子的环节，在磁芯工 艺、绝缘、散热等方面仍有改进空间，国内产业链项目经验丰富叠加人才红利，有望成为具 有国际竞争力的产品。 12 电容方面 ，铝电解电容是当前主力，薄膜电容随单模块功率及频率提升，渗透率有望上行并 成为前级 DC-link 主流方案。系统集成设计和控制系统则是主机厂的核心竞争力，是龙头竞争 的胜负手。 13 3）空间与节奏， 2030年全球超 2700亿元、 27-29年迎来工程推广期 考虑到 SST 在 AIDC 、超充、储能及配电网（仅考虑中国市场）渗透率的快速提升，东吴证券 测算：到 2030 年，全球 SST 市场有望超 2700 亿元，其中中国市场有望超 470 亿元、海外市场 有望超 2200 亿元，潜在发展空间较大。节奏上，研报判断当前正处于示范探索期， 2027- 2029年有望迎来工程推广期， 2029 年后正式进入规模放量阶段。 14   15 4）格局借鉴逆变器，从分散走向集中、国内百花齐放 复盘逆变器产业，东吴证券认为 SST 将复演 \" 从分散到高度集中 \" 的路径： 2010 年阳光电源 国内 光伏逆变器市占率已达 42.8% ，其后华为与 阳光电源 合计份额由约 41% 提升至 52% ； 2024 年 全球光伏逆变器出货量进一步提升至 536GW ，华为与 阳光电源 仍合计占据超过 50% 的份额。 而SST对研发、客户渠道、品控要求极高，行业竞争恶化的风险相对较低，龙头马太效应会 更强。 国内产业化步伐较为领先。 阳光电源 已开发 35kV 、 6MW 级 SST 光伏逆变器并取得订单； 四方 股份为国内首个签订海外固态变压器订单的中国企业， 2026 年 6 月项目共签约 4 台 13.8kV AC/800VDC 固态变压器； 中国西电 自主研发 10 千伏 /2 兆伏安 /750 伏固态变压器；为光 能源的中石油江苏昆山 SST 超快混合充电站配置 10kV/800kW SST 为液冷超充供电。 16 5）相关公司   本资讯中的内容来自持牌证券机构，意见仅供参考，并不构成对所述证券买卖做出保证。投资者不应将本资讯作 为投资决策的唯一参考因素。亦不应以本资讯取代自己的判断。 本文内容和观点不代表选股通 APP平台观点，请独立判断和决策。在任何情况下，选股通 APP不对任何人因使用 本平台中的内容所引致的任何损失负任何责任。整机：阳光电源 、四方股份 、金盘科技 、中国西电 、伊戈尔、特锐德、新风光。 高频隔离变： 可立克、京泉华、新特电气 。 电容：法拉电子 、江海股份 。 研报来源： 1、国元证券，李典， S0020516080001 ，AI重塑广告行业，多维度驱动行业变革。 2026年10 月14日 2、申万宏源，王珂， A0230521 120002，科技产业链业绩高增，工程机械 &轨交供需两旺 ——机械行业 2026年三季报业绩前瞻。 2026年10月14日 3、申万宏源，吕昌， A0230516010001 ，板块趋弱分化明显 头部企业保持韧性 食品饮料 2026三季度业绩前瞻。 2026年10月14日 4、东吴证券，曾朵红， S0600516080001 ，SST专题：乘 AI需求之东风，展先进供电技术之 翼。2026年10月15日 *免  "帖子正文", "excerpt": "高盛——美国科技——半导体行业：2026年SEMICON West大会纪要——行业能见度持续延伸，维持板块看多观点 一、整体研判：WFE上行周期明确延伸至2027-28年，维持板块超配 高盛团队参加在旧金山举办的SEMICON West 2026大会，与会期间与应用材料（AMAT）、泛林集团（LRC", "content": "高盛——美国科技——半导体行业：2026年SEMICON West大会纪要——行业能见度持续延伸，维持板块看多观点 一、整体研判：WFE上行周期明确延伸至2027-28年，维持板块超配 高盛团队参加在旧金山举办的SEMICON West 2026大会，与会期间与应用材料（AMAT）、泛林集团（LRCX）、泰瑞达（TER）、Camtek（CAMT）、Onto Innovation（ONTO）、MKS Instruments（MKSI）等多家产业链龙头进行了深度交流。核心结论：行业对2027年晶圆厂设备（WFE）支出前景高度乐观，与高盛此前WFE展望完全一致——2027年预计全球将有8-10座新晶圆厂投产，覆盖多种产品类型，驱动WFE规模同比攀升约45%至约2,180亿美元，由DRAM、先进逻辑代工及NAND三大主线共同拉动。 二、细分赛道核心趋势 • 先进逻辑：AI数据中心建设持续放量，先进逻辑需求明年仍将保持强劲增长。台积电2026年资本开支预计达850亿美元，构成核心支撑；英特尔及Terafab等客户亦有望贡献增量。 • DRAM：HBM竞争加剧叠加晶圆产能扩张的资本密集度提升，DRAM支出动能预计延续。应用材料与泛林集团因存储器敞口较高，将直接受益于行业供给持续偏紧。调研显示，存储厂商继续优先扩充DRAM产能而非NAND。 • NAND：供应商产能利用率维持峰值水平，2027年NAND WFE有望加速，但支出几乎全部来自设备升级而非新建产能（绿地扩产最早需至2027年末才会启动）。 • 测试设备（ATE）：芯片复杂度攀升要求创新测试方案缩短客户产品上市周期，但新一代GPU及加速器的测试时间持续拉长，叠加光网络等新兴市场，构成未来数年ATE增长的核心驱动力。 • 后道检测与量测：受CoWoS、HBM及长线需求早期爬坡等多因素驱动，行业参与者对2027年需求前景极为乐观。 三、重点公司会议核心纪要 1. 应用材料（AMAT，买入，位于确信名单） 投资者提问主要围绕其近期投资者日的财务目标。管理层强调，半导体定价虽非公司可控变量，但对“每节点WFE强度提升”的框架极具信心，且相关增量已被客户以项目制锁定。200个基点的市场份额提升目标涉及复杂的产品组合效应，但中国出口管制豁免的排除将产生实质性影响。2030年54%毛利率目标存在上行空间，但公司绝大多数成本为可变成本。光学检测工具组合方面，应用材料计划依托电子束技术专长切入相邻90亿美元市场。AGS（服务）业务长期收入增速目标为mid-teens（约13%-17%），且新一代工具的服务附加率显著高于存量机群。 2. 泛林集团（LRCX，买入） 重申2027年8-10座新厂投产预期，产品增长排序为DRAM > 先进代工/逻辑 > NAND。新长期毛利率目标~55%无具体时间表，但预计需数年达成，驱动力主要来自产品结构优化（如Akara新品）及海外制造运营效率提升，而非同规格产品提价。管理层对逻辑、DRAM及先进封装领域的竞争地位保持乐观，尤其看好刻蚀与沉积强度随硬掩模、表面处理、TSV等新材料工程步骤增加而持续提升。 3. 泰瑞达（TER，买入） SEMICON West期间宣布与FormFactor建立战略合作伙伴关系及投资。泰瑞达坚持探针卡供应商开放生态，但认为FormFactor在硅光子领域的强势地位值得深化协作，以投入额外工程平台资源。XPU业务方面，长期仍预期在独立GPU市场获取份额，且因晶体管数量近乎翻倍，Rubin架构测试时间约为Blackwell的2倍。公司正切入英特尔测试机会（先从代工业务入手，中期可见度较高）。内存业务中，客户对HBM“降规”（de-spec）影响有限，因其需求主要与单元产量挂钩而非堆叠层数。共封装光学（CPO）领域产品爬坡机会强劲，但制造流程中不同测试节点的强度可能发生显著转移。 4. Camtek（CAMT，中性） 投资者会议上预宣布2026年三季度营收1.60-1.61亿美元（超预期），指引四季度约1.80亿美元，基于现有订单给出2027年营收初步展望8.00亿美元。三年期长期营收目标12亿美元，毛利率目标55%-56%，营业利润率目标34%-36%。先进封装仍是核心增长引擎（占近期订单约80%），预计2026-2031年先进封装晶圆增速为行业整体的两倍（13% vs 7% CAGR），其中高端市场（占其业务绝大部分）CAGR约24%，由AI、硅光子、高密度互连及日益复杂的检测/量测需求驱动。产品路线围绕高毛利Hawk及Eagle检测设备（占2026年产品组合约85%）及量测平台展开，并计划于2027年推出基于AI的检测分类软件（源自Visual Layer收购）。并购策略聚焦能力补强与战略扩张，但12亿美元营收目标未假设重大并购贡献。 5. Onto Innovation（ONTO，买入） 对2026年下半年至2027年需求前景极为乐观，增量市场机遇将推动明年增长加速。HBM业务中，XPU厂商的任何“降规”活动对其工具需求影响极小，因需求由单元产量而非堆叠高度主导。CoWoS需求驱动力正日益从台积电转向OSAT伙伴；EMIB-T将成为2028年重要机遇。竞争层面，对台积电等处的份额地位高度自信，不认为竞争对手潜在新品发布会产生即时冲击。毛利率扩张350个基点的目标完全可通过产品组合及制造效率达成，营收增长空间充足且无产能瓶颈。 6. MKS Instruments（MKSI，卖出） 认为行业正处于由AI与数据中心驱动的实质性周期性上升的早至中段。公司正为2028年WFE支出上限达3,000亿美元（甚至更高）做准备。短期因供应链库存效应，半导体收入同比增速有望跑赢客户（2026年二季度首次实现超越）。现有槟城工厂可支撑约2,500亿美元WFE（另有20% surge产能），若预测兑现则需进一步扩产，但目前并不制约客户增长计划。定价方面未采取重大行动，但可能选择性提价以捕获交付价值。产品组合定位良好，但不排除在具吸引力估值下剥离特种工业产品线。 四、估值与评级框架（高盛口径） • 应用材料（AMAT）：12个月目标价670美元，基于32倍归一化EPS 21.00美元。主要下行风险为出口限制加码及中国本土供应商份额提升。 • 泛林集团（LRCX）：目标价380美元，基于35倍归一化EPS 10.75美元。主要下行风险为DRAM/HBM需求走弱、洁净室及晶圆厂扩产延迟、先进封装及3D架构含量增益不及预期。 • 泰瑞达（TER）：目标价465美元，基于37倍归一化EPS 12.50美元。主要下行风险为独立GPU客户营收爬坡延迟、大型AI基建项目导致的季度波动、移动业务复苏慢于预期。 • Onto Innovation（ONTO）：目标价400美元，基于32倍归一化EPS 12.50美元。主要风险为新增量采购协议及Dragonfly G5客户采用加速、OSAT或中国本土厂商份额转移、竞争对手推出对标工具。 • Camtek（CAMT）：目标价160美元，基于38倍归一化EPS 4.20美元。主要风险为小芯片架构明显推迟、提价传导失败、HPC驱动营收中期增长超预期。 • MKS Instruments（MKSI）：目标价270美元，基于20倍归一化EPS 13.50美元。主要上行风险为NAND设备订单反弹、Atotech收购协同效应兑现、WFE趋势带动半导体业务动量提升。#文字观点", "publish_time": "2026-10-15 22:55", "tags": ["文字观点"]}, "post:2026-10-15T13-21:c7e17ef49a13": {"id": "post:2026-10-15T13-21:c7e17ef49a13", "kind": "post", "title": "2026-10-15 13:21", "source_label": "帖子正文", "excerpt": "🔎FormFactor 👥投资者交流会参会人员：首席执行官 Mike Slessor；首席财务官 Aric McKinnis", "content": "🔎FormFactor 👥投资者交流会参会人员：首席执行官 Mike Slessor；首席财务官 Aric McKinnis；投资者关系副总裁 Stan Finkelstein。 🤝泰瑞达投资与合作：FormFactor 表示泰瑞达 3 亿美元投资，主要属于战略承诺与深度协作，并没有改变双方原有的商业合作关系。 📜该协议把长期已经开展的合作正式落地，投入更多资源推进关键技术路线，重点是高速 HBM 测试、硅光 / 共封装光学领域，泰瑞达看重 FormFactor 的光学探针能力。 📌合作并非排他，依旧维持开放生态。 ✨管理层认为这笔投资，也是针对泰瑞达此前投资竞品的战略平衡，向客户明确传递泰瑞达长期与 FormFactor 合作的信号。 🔗共封装光学 CPO：FormFactor 在第一测试工位完成光子芯片晶圆测试，该方案可以减少设备占用空间。 ⚙️第三工位的光学探针机会，取决于光学耦合器件贴装之前完成测试。 💰此前测算 CY30 财年该赛道潜在市场规模约 4 亿美元，第一、第二工位之间的业务分配，高度取决于最终落地的测试架构。 🎮英伟达、AMD 市占率提升：FormFactor 已经完成英伟达 GPU 测试认证源头内容加微wuxl3408，CY26 财年第三季度已经出货多套探针卡，目前正在台积电进行试产。 🎯公司计划参与 Rubin Ultra 项目竞标；Feynman 芯片探针从铝探针转向铜探针，FormFactor 可以从认证周期最早期参与，带来更大市场机遇。 ✅FormFactor 也完成 AMD GPU、CPU 的认证，拿到初步导入订单；想要实现可观市占率提升，有赖于 CY27 财年年中前后 Farmers Branch 工厂新增产能落地。 🧩定制专用芯片 ASIC：定制 ASIC 从传统探针卡向先进微机电探针卡过渡已经启动。 📝谷歌 TPU v9 目前处于工程样片阶段，预计 CY27 财年年中前后实现大规模量产，时间点和 Farmers Branch 工厂产能投放匹配。 📉HBM 规格下调影响：CY26 财年上半年，受益 HBM4 和美光新增需求，HBM 探针卡营收同比增长约 70%。 📈下一代产品会在 CY26 年末‑CY27 年初迎来新一轮季节性放量。 ⚠️规格下调带来的影响，取决于堆叠层数降低是否带来总存储比特减少，还是依靠增加 HBM 芯片颗数对冲。 📉单 GPU 搭载 HBM 容量下降会压制需求，但网络芯片用量提升、芯片颗数增加可以部分对冲。 💡底层对于更大容量、更高速度内存的需求没有改变；即便规格下调，FormFactor 在并行、高速测试领域依旧具备优势。 💾HBM 与 DDR5 业务结构：虽然业务结构从 HBM 向 DDR 发生明显切换，存储厂商把更多晶圆投产分配给传统 DRAM，但 FormFactor 预计 CY26 财年第三季度 DRAM 探针卡营收依旧维持接近历史高位。 📊HBM 业务毛利率高于 DDR5，不过随着制造工艺进步，二者毛利率差距已经收窄。 🧱HBM 基础裸芯片：HBM 基础裸芯片内部逻辑内容增加，焊盘密度提升，有利于微机电垂直探针卡替代悬臂式探针卡。 🤝FormFactor 同时具备逻辑芯片、DRAM 芯片相关技术能力，尤其在测试速度、并行度、供电方面优势明显，可以把握相关机会。 💡未来有可能把逻辑、内存拆分为两个独立测试工位；超大规模云厂商不愿意把自研逻辑测试协议交给存储厂商，反之亦然。 💲定价：当前产能紧张环境下公司存在一定定价弹性，但依旧优先采用价值定价、维护长期客户关系，不会大范围涨价。 📌管理层明确表示，过去一年约 1500 个基点的毛利率提升，完全不是依靠涨价实现，定价并不是改善毛利率的主要抓手。 🖥️CPU 业务与客户多元化：来自英特尔、AMD、英伟达的 CPU 相关业务需求提升，包含部分老款英特尔 CPU 重新恢复需求。 📋英伟达体系下，GPU 探针卡由台积电下达订单，网络芯片探针卡由英伟达下达订单，Vera CPU 订单两家均会下达。 ⚠️无论哪家主体下达采购订单，Fabless 设计公司和代工厂均会参与供应商筛选。 🔌NPO/CPO/ 可插拔光模块：FormFactor 第一工位光子芯片晶圆级光学测试，对 CPO、NPO 架构没有倾向性，同一套光学探针技术两者均可适配。 📦出货探针卡的时候，通常无法确定客户最终会落地哪一种架构。 📌可插拔光模块业务占 FormFactor 业务比重仍然较小，光子业务增长主要来自原有晶圆厂客户把光学工艺纳入产线。#文字观点", "publish_time": "2026-10-15 13:21", "tags": ["文字观点"]}, "attachment:files/测试设备调研HBM堆叠驱动测试需求倍增，国产设备聚焦低速环节替代.pdf": {"id": "attachment:files/测试设备调研HBM堆叠驱动测试需求倍增，国产设备聚焦低速环节替代.pdf", "kind": "attachment", "title": "测试设备调研HBM堆叠驱动测试需求倍增，国产设备聚焦低速环节替代", "source_label": "其他", "excerpt": "测试设备调研 HBM堆叠驱动测试需求倍增，国产设备聚焦低速环节替代 核心观点 ·HBM测试复杂度呈指数级增长，其\"边堆叠边测试\"模式及KGD筛选流程， 使同等晶圆量下的测试设备需求量达到传统DRAM的5-6倍。·DDR代际升级驱动设备换代，而HBM堆叠层数增加（8H→12H/16H）直接 拉长测试时间，成为测试设备需求增长的核心驱动力。", "content": "测试设备调研 HBM堆叠驱动测试需求倍增，国产设备聚焦低速环节替代 核心观点 ·HBM测试复杂度呈指数级增长，其\"边堆叠边测试\"模式及KGD筛选流程， 使同等晶圆量下的测试设备需求量达到传统DRAM的5-6倍。 ·DDR代际升级驱动设备换代，而HBM堆叠层数增加（8H→12H/16H）直接 拉长测试时间，成为测试设备需求增长的核心驱动力。 ·存储测试设备价格保持平稳，主因客户集中度极高（三星、海力士等） 导致设备商议价能力弱，且面临韩国本土供应链的价格制衡。 ·国产设备目前集中于低速测试环节，高速测试仍由海外垄断。 ·探针卡作为晶圆厂成本最高的耗材，需求与DRAM产出呈绝对线性关系， 但国内市场竞争激烈且核心技术多源自韩国，投资门槛较高。 一、测试需求驱动因素 Q1：在AI驱动的半导体测试需求增长背景下，测试需求的提升主要 受晶体管密度增加和芯片堆叠层数增加中哪一个因素的影响更大？ 晶体管密度和芯片堆叠层数的增加都是推动测试需求提升的重要因素，但两 者影响的层面不同。晶体管密度的提升属于一种常规的技术进步，它主要是在原 有测试基础上增加测试时间。相比之下，芯片堆叠，特别是CoWoS或类似的先进 封装技术，对测试复杂度的提升影响更为显著，其复杂程度呈指数级上升。堆叠 技术将不同的功能单元整合在一起，使得测试需要兼容更多内容，测试方向也随 之改变。因此，从影响程度上看，堆叠是首要驱动因素，而晶体管密度的影响次 之。 Q2：以HBM为例，芯片堆叠技术具体是如何提升测试的复杂度和时间 的？ HBM的堆叠对测试要求有巨大的提升。与传统存储芯片（如手机中使用的 LPDDR芯片）的堆叠主要为了增加容量不同，HBM的堆叠过程涉及在每个堆叠步 骤中进行反复测试。这个流程中会加入\"已知良好裸片\"（KGD,KnownGoodDie） 的测试环节。具体而言，晶圆首先要像传统DRAM一样进行一次完整的CP测试。 之后，通过Die-to-Wafer或热压键合等方式，每堆叠一层就要进行一次测试， 并且需要尽可能地筛选出KGD。这种\"边堆叠边测试\"的模式使得整个测试流程变 得极其复杂，从而大幅增加了测试时间。 Q3：如何量化HBM与传统DRAM在测试设备需求上的差异？测试设备 是否需要更换？ 根据韩国客户的反馈数据，处理同等数量的晶圆，HBM所需的测试设备数量 大约是传统DRAM的5到6倍。这种增长并非源于单次测试时间的延长，而是由 于测试流程的倍增。例如，处理1万片晶圆，传统DRAM只需进行一次CP测试即 可，而HBM则是在完成首次CP测试后，在后续的每一次堆叠过程中都需要重复 测试。虽然各家厂商（如三星和海力士）的具体工艺流程存在细微差别，但总体 上测试量的大幅提升是行业共识。目前，用于HBM生产的晶圆大约占总产能的 20%至25%，这意味着这部分产能的测试设备需求需要乘以5到6倍。在设备方 面，测试单片晶圆和测试堆叠后芯片所用的测试机型号是相同的，但探针卡可能 需要根据不同的测试阶段进行相应调整。 Q4：从DDR4到DDR5的技术迭代，以及未来从HBM3到HBM4的演进， 将如何影响测试需求？ 总结来说，DDR代际升级主要驱动设备换代，而HBM堆叠层数的增加则直接 拉长测试时间。 二、存储测试设备价格与竞争格局 Q5：存储测试设备的价格变动趋势如何，例如从600万涨到1,000 万或1,200万美金的说法是否属实？ 目前没有观察到存储测试设备有明显的价格上涨。以HBM为例，其单价基本 没有大的变化，大约维持在不到100万美金的水平。设备厂商很少主动提价，尤 其是针对存储器领域的客户。 Q6：既然HBM等高端存储芯片市场需求旺盛，为何相关的测试设备不 涨价？ 存储测试设备不涨价主要有几个原因。首先，全球范围内的存储器客户数量 非常有限，主要客户用两只手就能数过来，例如三星、海力士以及长鑫存储等。 客户集中度高导致设备商的议价能力相对较弱，尤其面对三星这样的客户，其议 价能力非常强。若设备商今年涨价，未来可能会对客户关系造成负面影响。其次， 设备行业多年来形成了一种惯例，即设备价格通常不随市场供需关系大幅波动， 大规模主动涨价的情况非常罕见。最后，尽管市场格局看似稳定，但并非没有竞 争。例如，泰瑞达的竞争对手一直在推广其解决方案，其产品并非不可替代，这 限制了主动提价的空间。 Q7：在存储测试领域，为何Advantest的表现一直优于Teradyne？ Advantest在存储测试领域的领先地位并非近两年才确立，而是从几十年前 便已开始。其优势主要源于几个方面：第一，在产品层面，存储器测试对设备的 稳定性要求极高，而Advantest设备的稳定性要比Teradyne强很多。这得益于 日本公司在产品用料、质量体系流程等方面的长期积累。第二，从公司基因来看， Advantest的存储器测试设备一直是其自研的核心产品，伴随着日本存储器市场 的爆发而成长。相比之下，Teradyne的相关产品线来自于对一家小公司的收购， 因此在传统和稳定性上有所欠缺。第三，在业务模式上，Advantest更擅长服务 于三星这类拥有明确技术路线和目标的IDM客户，能够紧密跟进其发展需求，而 美国公司Teradyne的风格可能相对更为灵活。 三、国产存储测试设备发展现状 Q8：目前国内存储测试设备厂商的发展现状如何，例如长川科技等公 司在长鑫存储等客户中的渗透情况是怎样的？ 国内厂商在存储测试领域取得了一定的进展，但主要集中在低速测试环节。 长川科技的存储器测试产品表现相对一般，尚未进入长鑫存储这类主流客户。目 前，在长鑫存储取得一些突破的国内供应商主要是合肥的悦芯（尚未上市），但 其产品也主要应用于CP（晶圆测试）和低速FT（成品测试）环节，并未涉足高 速测试领域。 Q9：存储芯片制造商为何会将测试流程拆分为高速和低速两部分，这 对设备厂商有何影响？ 将测试工序拆分为高速和低速是存储芯片制造商基于成本核算采取的一种 策略。高速测试机的单价非常昂贵，大约需要三四百万美金一台。为了降低整体 测试成本，制造商（如三星、海力士及南亚科等）的成本核算部门发现，将一道 完整的测试工序拆分为两道，分别使用不同的设备测试低速和高速功能，可以有 效降低设备采购的总成本。这种策略从DDR2时代开始被采用。对于设备厂商而 言，这意味着产生了对低速测试设备的需求，国内厂商目前能够部分替代的也正 是FT环节中低速部分的需求，而高速测试领域基本没有涉及。 Q10：使用低速测试机进行芯片测试，具体能节约多少成本？这是否 会影响最终的产能或成为生产瓶颈？ 芯片测试过程中，大约70%至80%的测试时间消耗在低速测试环节。低速测 试机的成本仅为高速测试机的三分之一到四分之一，因此采用低速测试机可以显 著节约成本。这并不会影响产能，因为测试环节所需的大部分功能验证并不需要 高速环境。业界对于特定晶圆产量（例如1万片晶圆）所需的CP测试机、低速 FT测试机和高速FT测试机的数量已有成熟的测算模型，因此不会形成生产瓶颈。 Q11：HBM的引入如何影响测试设备的需求量？例如，对于1万片晶 圆的产能，是否意味着测试机数量需要大幅增加？ HBM的引入确实使测试设备的需求评估变得复杂。虽然HBM的部分测试时间 可能是传统DRAM的数倍，但这并不意味着测试机需求会等比例增加。具体需求 是一个变量，因为它取决于一家Fab内生产HBM和普通DRAM的具体产品组合比 例，而这个比例本身是动态变化的。因此，对测试机的需求是一个相对且动态的 量，无法简单地通过固定倍数进行推算。 四、探针卡与国产设备前景 Q12：HBM与传统DRAM所使用的基底晶圆是否相同？ 两者的晶圆原理一致，但在具体设计上存在差异。传统DRAM晶圆上的打点 数量可能更多。而HBM晶圆为了集成TSV（硅通孔）结构，需要在设计上为穿孔 预留空间，这会导致其有效打点数量相应减少。 Q13：国产存储器测试设备厂商未来的发展前景如何，是否有机会拓 展海外市场？ 国产存储器测试设备厂商拓展海外市场的可能性较小。从主要市场来看，韩 国的三星和海力士早已在本土扶持了自有的设备供应链体系； 美国的美光公司则 主要采用自研设备，基本不采购第三方产品。在剩余的如台湾等市场，国产设备 在竞争力上与爱德万或泰瑞达等国际领先企业相比存在显著差距。因此，国产存 储器测试设备出海将面临巨大挑战。 qq1490929960 Q14：像三星、海力士和美光这样的行业巨头，是否会为了供应链安 全而扶持自己的测试设备供应商， 从而减少对泰瑞达等公司的依赖？ 目前在中国发生的供应链本土化扶持，韩国早已实践。三星在韩国扶持了包 括YIKC、UJINTECHNOLOGY、Semics在内的大量半导体设备公司。然而，三星的 策略并非完全替代爱德万或泰瑞达等领先企业。其扶持的本土厂商在技术上仍存 在一定缺陷，有时也涉及模仿。保留行业领头羊，可以作为后续技术发展的参照 对象。因此，三星的策略是在本土扶持与外部采购之间维持一种平衡，形成一个 相对稳定的市场格局。 Q15：韩国厂商扶持本土设备供应商的主要目的是为了节省成本，还 是出于产业链安全的考量？ 主要目的是为了节省成本。韩国与日本之间不存在重大的地缘政治矛盾，因 此产业链安全并非首要因素。通过扶持本土供应商，韩国企业可以有效地对国际 设备厂商进行价格制衡。这一策略也解释了为何测试设备市场难以提价。例如， 泰瑞达在最近一个季度的财报中，虽然其在存储器测试市场的份额有所上升，但 整体利润率却出现下滑，表明存储器业务对其利润率造成了拖累。 Q16：从业务专注度来看，国内外测试设备厂商的战略布局有何不同？ 国外厂商通常表现出更高的业务专注度。例如，爱德万的业务涉足面相对较 广，而泰瑞达则更为聚焦。相比之下，国内厂商的业务布局则倾向于更加多元化， 涉足的领域更宽泛。这反映了两种不同的市场选择和发展路径。 Q17：10万片晶圆（不含HBM）大约需要配置多少数量的CP和FT测 试机？其对应的设备投资规模大致是多少？ 10万片晶圆大约需要100台左右的CP测试机。在FT（FinalTest）方面， 低速FT测试机和高速FT测试机分别需要大约20至30台。若以单台测试机100 万美元计算，这部分设备投资约为1.5亿美元。此估算未包含Prober（探针台）， 单台Prober的价格大约在20万至30万美元之间。 Q18：探针卡在半导体测试环节中是如何归类的？其在晶圆厂耗材中 的成本地位如何？ 探针卡在所有工厂中均被归类为耗材。在晶圆厂的所有耗材中，包括全套设 备在内，探针卡的成本是最高的，位列第一。 Q19：中国大陆探针卡行业的市场竞争格局和技术来源是怎样的？是 否存在显著的投资机会？ 中国大陆从事探针卡业务的公司数量众多，大约有50到100家，市场竞争 非常激烈。从技术角度看，该领域的技术门槛相对不高，国内厂商的技术主要源 自韩国。由于市场高度竞争且核心技术多掌握在韩国公司手中，投资价值相对有 限。 Q20：探针卡的核心技术具体体现在哪些方面？为什么平整度至关重 要？ 探针卡的核心技术因类型而异。对于高端的MEMS探针卡，其制造工艺与晶 圆厂类似。对于传统的垂直针或悬臂针探针卡，技术含量相对较低，核心在于探 针的制作，工艺偏向劳动密集型。探针卡的平整度是一项关键且复杂的技术指标。 例如，在典型的DRAM测试中，为了实现\"onetouchdown\"（即一次完成整张晶 圆的测试），一张探针卡可能需要集成七万到八万根探针。在如此高的探针密度 下，要确保所有探针的平整度，技术难度非常大。 Q21：全球领先的探针卡公司FormFactor的核心竞争力是什么？为什 么像Teradyne这样的测试设备巨头没有收购它？ FormFactor的核心竞争力在于其多年的技术积累，尤其是在MEMS探针卡领 域，已经将其工艺发展为类似晶圆厂的制造流程，包含了大量的专有技术 （know-how）。对于测试设备公司而言，探针卡业务虽然与其设备配套使用，但 两者在业务上并无直接关联，制造探针卡也无需与测试机厂商进行深入的技术沟 通。此外，全球探针卡市场的规模相对较小，前几年的年市场规模大约在十几亿 美元，对于大型设备商而言，收购的战略协同效应和市场吸引力不足。 Q22：探针卡市场的需求增长与DRAM晶圆的产出量之间是何种关系？ 探针卡的寿命是否会影响这种关系？ 探针卡的需求增长与DRAM晶圆的产出量之间是绝对的线性关系，其需求量 与晶圆厂制造的晶圆数量密切相关。如果DRAM产量增加十倍，探针卡的需求也 会相应增加十倍。探针的使用寿命是基本确定的，达到一定的测试次数后即需更 换，因此不会出现因探针做得更好而消耗量减少，从而削弱这种线性关系的情况。 Q23：全球探针卡市场的主要参与者有哪些？各自的优势领域是什 么？ 在全球市场中，FormFactor是领先者。另一家意大利公司Technoprobe在 SOC探针卡领域与FormFactor实力相当，但在Memory领域业务较少。其他主要 参与者包括日本的JEM和MJC，中国台湾的MPI和CHPT，以及韩国的TSE和 Soulbrain等。 Q24：随着长鑫存储等国内存储厂商的扩张，国内探针卡供应链将如 何发展？ 国内存储厂商的崛起带动了本土探针卡产业的发展，这也是目前国内有众多 探针卡公司的原因之一。长鑫存储自身基本不会直接投资这类供应链公司。与长 鑫存储有业务关联或潜在合作关系的公司包括CHPT和道格特等。 Q25：从投资角度看，应该选择与晶圆厂关系紧密的公司还是技术领 先的公司？ 若进行投资，选择与晶圆厂有紧密关系的公司可能更为有利。例如，前述提 及的南京公司，其创始人同时也是睿励科学仪器的创始人，并获得了国家集成电 路产业投资基金（大基金）的投资，这类具备产业资源和资本背景的公司值得关 注。 Q26：之前提到10万张晶圆的CP和FT测试设备投资约为1.5亿美元， 但似乎未包含老化测试。能否补充一下10万张晶圆所需的老化测试 设备投资额？ 之前计算的1.5亿美元仅包含了CP和FT（包括低速和高速）测试环节。对 于老化测试，10万片晶圆大约需要10台左右的老化测试机，这类设备相对便宜， 单价约50万美元，总计投资额约为500万美元。 Q27：海外设备具备稳定性优势，而国内设备稳定性相对较差。这种\" 好\"与\"坏\"在实际应用中如何量化？是国内设备完全无法制造，还是 可以通过增加人力等方式弥补？ 行业内量化稳定性的核心指标是MTBF（MeanTimeBetweenFailure，平均 无故障时间），即两次故障之间的平均间隔时间，该数值越长越好。以爱德万的 设备为例，其MTBF值很少低于2000小时，大部分设备能达到3,500小时左右， 个别表现优异的设备甚至能超过10,000小时。一年总时长约8,000多小时，若 MTBF达到4,000小时，意味着设备平均一年只出两次故障，这属于正常水平。 相比之下，虽然没有精确的统计数据，但预估国内设备的MTBF很难达到2000 小时。 Q28：面对国产设备在稳定性方面的差距，像长鑫存储这样的头部企 业在采购策略上是如何平衡国产化需求与生产稳定性的？ 像长鑫存储这类企业的态度非常明确。首先，使用国产设备是既定方向。在 现阶段的采购策略中，他们会采用比例分配的方式。例如，在一次设备采购中， 可能将主要订单给予海外公司，以保证生产的稳定性，同时将剩余小部分订单分 配给华峰测控等国内厂商。此举旨在支持国产设备商，并观察其产品能否通过快 速迭代来提升稳定性。如果国产设备的稳定性逐步提高，未来采购的比例会相应 增加。这基本上是行业内大部分厂商采用的策略。 Q29：如何评价长鑫存储近年来的产品进步？这些进步主要归因于哪 些方面？ 长鑫存储的产品在近两年取得了非常迅速的进步和迭代。根据观察，其早期 的产品存在一些问题，例如发热量大、功耗高，导致其测试成本甚至高于三星同 类芯片的整体成本。当时，由于产品性能限制，其无法进入主流手机厂商供应链， 最大的客户是传音。传音手机主要销往非洲市场，当地用户对手机发热和功耗的 敏感度较低。一直以来，其产品的漏电和功耗都显著高于竞争对手。不过，通过 持续的技术迭代，近两年产品的发热情况已大为改善，但尚未达到最先进水平， 因为功耗与制造工艺密切相关。 Q30：长鑫存储产品性能的提升，主要得益于设计、制造工艺还是设 备本身？ 公司的发展势头非常迅猛。工程师等各类人员数量翻了数倍。公司成立至今 约十年，员工总数可能已达到5万人左右。在人员、研发投入以及工作强度等方 面，投入都非常大，这些都是其硬实力提升的体现，并非停留在宣传层面。 Q32：从投资角度看，在半导体测试领域的众多公司中，例如泰瑞达、 爱德万、FormFactor以及国内的长川科技和华峰测控，应如何看待 市场以寻求较为平稳的增长这些进步主要归因于两个方面：一是其自身设计能力的提升，二是在线工艺 工程师能力的增强。这反映了公司内在研发和制造能力的实质性提高，与测试设 备本身的关系不大。 qq1490929960 Q31：除了产品性能的提升，还有哪些迹象可以印证长鑫存储的快速 发展和投入？ ？ 投资策略取决于资金规模。对于资金量较大的投资者，投资测试机厂商可能 是更好的选择。如果资金量不大，可以考虑进入测试接口板（LoadBoard）或探 针卡（ProbeCard）领域，这些领域的进入门槛相对较低。但需要注意的是，在 探针卡领域，获取实质性的核心技术难度非常大。 Q33：探针卡领域有技术的韩国公司是否已经上市？其发展模式是怎 样的？ 许多拥有技术的韩国公司并未上市。它们的成长路径通常是早期获得三星等 大厂的扶持，但后续可能因各种原因被放弃。韩国国内市场竞争激烈，内部\"内 卷\"现象严重，许多在竞争中失败的技术人员为了生存会选择自主创业，这是该 领域技术和公司来源的一个特点。 Q34：像悦芯科技这类本土厂商的快速研发，是否对爱德万等国际巨 头构成了显著压力？ 目前并未构成太大压力。首先，这类本土公司短期内难以进入海外市场。其 次，爱德万等公司对于国产替代的趋势早有预期，他们清楚只要中国本土能够制 造出同类产品，国内客户自然会优先选择国产品牌。此外，近两年爱德万的海外 业务表现非常出色，这也在一定程度上分散了其对中国市场竞争格局变化的关 注。 Q35：为什么本土公司倾向于引进韩国技术团队而非在测试设备领域 经验更丰富的日本团队？ 引进日本技术团队存在几个难点。第一，仅引进少数几位日本技术人员难以 发挥作用。第二，日本工程师的工作风格相对保守、决策流程较长，且在开拓精 神和胆识上不如韩国工程师。因此，从效率和效果来看，引进一两个日本工程师 的实际作用非常有限。 Q36：爱德万的上游供应链是怎样的，是否存在被其收购的关键供应 商？其核心技术壁垒体现在哪里？ 爱德万的上游供应商众多，但其使用的元器件大多是市场上可以采购到的通 用部件，例如其芯片很多采购自ADI等公司。它更像一个系统集成商，类似于汽 车行业中的大众，其核心部件如变速箱也来自外部供应商。爱德万的核心竞争力 在于其系统设计能力，尽管原材料是外购的，但其产品设计是自主的，这是其关 键技术壁垒，也是其他公司难以通过简单复制图纸来模仿的。 Q37：泰瑞达是否也从ADI等公司采购芯片？其供应链与爱德万的重 合度如何？ 是的，在芯片等元器件的供应商层面，爱德万和泰瑞达的供应链存在很多重 合，经常会从同一家供应商采购。", "status": "extracted"}, "attachment:files/东北证券-华海诚科(688535)QFN抢滩先行，先进封装蓄势接棒-261013.pdf": {"id": "attachment:files/东北证券-华海诚科(688535)QFN抢滩先行，先进封装蓄势接棒-261013.pdf", "kind": "attachment", "title": "东北证券-华海诚科(688535)QFN抢滩先行，先进封装蓄势接棒-261013", "source_label": "东北证券", "excerpt": "请务必阅读正文后的声明及说明 [Table_Info1] 华海诚科 (688535) 电子 [Table_Date] 发布时间： 2026 -10-13 [Table_Invest] 增持 上次评级： 增持 [Table_Market] 股票数据 2026/10/12 6个月目标价（元） 106.63 收盘价（元） 86.19 12个月股价区间（元） 81.", "content": "请务必阅读正文后的声明及说明 [Table_Info1] 华海诚科 (688535) 电子 [Table_Date] 发布时间： 2026 -10-13 [Table_Invest] 增持 上次评级： 增持 [Table_Market] 股票数据 2026/10/12 6个月目标价（元） 106.63 收盘价（元） 86.19 12个月股价区间（元） 81.66~187.00 总市值（百万元） 12,348.79 总股本（百万股） 143 A股（百万股） 143 B股/H股（百万股） 0/0 日均成交量（百万股） 3 [Table_PicQuote] 历史收益率曲线 [Table_Trend] 涨跌幅（ %） 1M 3M 12M 绝对收益 -14% -49% 1% 相对收益 -9% -39% 8% [Table_Report] 相关报告 《华海诚科 （ 688535） ： 业绩高增彰显整合成效， 高端塑封迈入成长快车道》 --20260904 《真武 V900芯片发布， ECOC收官光互联景 气延续》 --20260928 《昇腾 960超节点发布， 华为正式开启 NPO元 年》 --20260922 [Table_Author] 证券分析师：李玖 执业证书编号： S0550522030001 lijiu1@nesc.cn 证券分析师：张禹 执业证书编号： S0550524120002 zhangyu2@nesc.cn [Table_Title] 证券研究报告 / 公司深度报告 QFN抢滩先行，先进封装蓄势接棒 报告摘要： [Table_Summary] 华海诚科是全球领先的半导体环氧塑封料供应商 。公司主要从事环氧塑封料等 半导体封装材料的研发、生产与销售。 2025年完成对衡所华威的收购后，公司 半导体 EMC按出货量计位居国内第一、全球第二，行业地位进一步巩固。 需求端来看，封装工艺迭代驱动量价双升，先进封装贡献主要市场增量。 一是先进封装不断升级，带动材料价值量提升。 封装向高密度、薄型化发展，对 材料的流动性、翘曲控制及可靠性提出更高要求； HBM方面，随着堆叠层数增 加，MUF工艺优势凸显。 EMC由此从外部包封延伸至芯片层间填充，带动材料 向高性能、高附加值方向升级。 二是应用拓展与逻辑堆叠拉动用量增长。 先进封装由 AI/HPC向消费电子渗透， 应用边界不断外延； 在摩尔定律推进放缓的背景下， 华为以 “韬定律 ”探索逻辑折 叠，有望使单颗 SoC的EMC用量增至原来的两至三倍 。同时配套封装工艺的 变化，也为国产材料参与联合开发与工艺适配打开新的替代窗口。 根据我们的测算，国内 EMC市场规模有望从 2026年的 70亿元增长到 2030年 的119亿元，其中 QFN及先进封装合计规模将达到 64亿元，贡献整体市场增 量的近八成。 供给端来看，海外提价叠加扩产时滞打开国产替代窗口，华海诚科有望率先承 接外溢需求。 2026年5月，住友电木宣布 EMC提价 10%—20%，进一步凸显国 产产品的价格优势，而其新增产能预计于 2028年底投产，为国产材料导入留出 窗口。华海诚科凭借国内领先地位及客户验证、批量供货基础，有望率先承接替 代份额，并在客户合作深化后逐步争取调价空间，实现 “先量后价 ”。 公司的成长短期看 QFN国产替代，中长期看先进封装放量。短期来看， 公司 QFN相关产品已实现与外资同类产品的技术平权， 前期布局正向批量供货转化， 有望成为未来两至三年的增量贡献主力； 中长期来看， GMC、MUF、LMC等先 进封装产品梯队持续完善，随着客户验证与量产推进，有望打开更大的成长空 间。QFN及先进封装产品 均具备高 利润率，放量后有望提升公司整体盈利能力， 增厚利润。 如果按 2030年细分市场规模、国产化率及公司份额测算，合理情境 下，公司 2030年收入有望实现 36.83亿元，净利润对应 9.21亿元；悲观情境下， 2030年收入有望实现 36.23亿元，净利润对应 7.97亿元。 投资建议与盈利预测： 预计公司 2026—2028年营业收入分别为 11.06/16.98/24.03 亿元，归母净利润分别为 1.05/2.10/3.66亿元，给予“增持”评级。 风险提示：下游需求、高端产品放量及并购整合不及预期，原材料价格波动及 市场竞争加剧。 [Table_Finance] 财务摘要（百万元） 2024A 2025A 2026E 2027E 2028E 营业收入 332 458 1,106 1,698 2,403 (+/-)% 17.23% 38.12% 141.46% 53.54% 41.49% 归属母公司 净利润 40 24 105 210 366 (+/-)% 26.63% -39.47% 333.93% 99.31% 74.63% 每股收益（元） 0.50 0.30 0.73 1.46 2.56 市盈率 148.70 373.60 117.34 58.88 33.71 市净率 5.77 4.95 5.54 5.24 4.79 净资产收益率 (%) 3.89% 2.22% 4.72% 8.90% 14.21% 股息收益率 (%) 0.40% 0.09% 0.34% 0.67% 1.17% 总股本 (百万股 ) 81 96 143 143 143 -50%0%50%100%150%华海诚科 沪深 300下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 请务必阅读正文后的声明及说明 2 / 33 [Table_PageTop] 华海诚科 /公司深度 目 录 1. 国内环氧塑封料龙头，并购衡所华威夯实全球竞争地位 .............................. 4 1.1. 深耕半导体封装材料十六载，迈入规模扩张与高端突破新阶段 ................................ ....... 4 1.2. 2026H1业绩拐点确立，并购规模效应推动利润加速释放 ................................ ................. 5 1.3. 毛利率回升叠加费用摊薄，盈利能力有望持续改善 ................................ ........................... 6 2. 需求端：封装工艺迭代拓宽 EMC应用，先进封装贡献主要市场增量 ...... 8 2.1. 环氧塑封料：半导体封装核心耗材，全球市场规模超 30亿美元 ................................ ..... 8 2.2. 先进封装加速升级，环氧塑封料迎来发展新机遇 ................................ ............................. 10 2.2.1. 价升： MUF 工艺革新叠加 HBM 堆叠升级， EMC 材料价值量持续提升 ................................ ......... 11 2.2.2. 量增：应用场景拓展叠加逻辑堆叠升级，打开 EMC需求增量空间 ................................ ................... 13 2.3. 国内 EMC需求测算 ................................ ................................ ................................ ............... 15 2.3.1. 先进封装用 EMC需求 ................................ ................................ ................................ ............................... 15 2.3.2. QFN用EMC需求 ................................ ...............................  可通过撒粉等方式较均匀地铺设于模腔， 并在预热后熔融完成压 缩成型， 具备较好的操作便利性和工艺适配性， 已应用于 SiP、Fan-Out等先进封装； 液态环氧塑封料（ Liquid Molding Compound ，LMC）则在室温下呈液态，可通过配 方设计满足复杂封装结构的流动及窄间隙填充需求。随着 C-Molding及先进封装持 续发展， GMC、LMC等新型 EMC有望进一步拓展塑封材料的应用边界。 图 7：环氧塑封料图示 图 8：环氧塑封料按形态划分 数据来源： 深圳先进电子材料国际创新研究院，东北 证券 数据来源： 未来半导体，东北证券 EMC配套 Molding 设备使用，配方与认证构筑 强壁垒。EMC产业链上游主要包括 环氧树脂、酚醛树脂、硅微粉及偶联剂、固化促进剂等原材料，其中环氧树脂与高 性能填料合计占原材料成本约 64%，为主要成本来源；中游为 EMC材料厂商，核 心在于根据不同封装形式和客户需求进行配方开发， 并实现产品稳定、 规模化生产； 下游主要为封测及 IDM厂商，封装环节需配套 Molding设备，最终覆盖消费电子、 数据中心、汽车电子、光伏、工业及物联网等应用领域。由于不同封装形式对材料 流动性、翘曲、应力、导热及可靠性等指标要求存在差异， EMC并非简单的原材料 混合，配方开发能力、规模化生产稳定性以及下游客户长期认证共同构成行业核心 壁垒。 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 请务必阅读正文后的声明及说明 9 / 33 [Table_PageTop] 华海诚科 /公司深度 图 9：环氧塑封料产业链 数据来源： 智研产业研究院，各公司官网，公司公告，东北证券 EMC用于半导体封装 的塑封环节 ，承担芯片保护与绝缘功能。 以典型引线框架类 封装为例，芯片完成晶圆减薄、切割后形成裸芯片（ Die） ，随后经过芯片贴装、引 线键合等工序实现芯片固定与电气连接， 并进一步进入塑封成型环节。 塑封过程中， 环氧塑封料 （ EMC） 在高温高压条件下流动并填充芯片、 焊线及引线框架周围空间， 固化后形成稳定的封装结构，为芯片提供机械", "status": "extracted"}, "post:2026-10-15T08-41:ec618b6c1c9e": {"id": "post:2026-10-15T08-41:ec618b6c1c9e", "kind": "post", "title": "2026-10-15 08:41", "source_label": "帖子正文", "excerpt": "📑高盛中国开盘 📌市场情绪 📊隔夜美国 CPI 数据高于市场预期，A 股料再度低开。美股隔夜走势惨淡，AI 板块的市场情绪出现明显断崖式下挫。", "content": "📑高盛中国开盘 📌市场情绪 📊隔夜美国 CPI 数据高于市场预期，A 股料再度低开。美股隔夜走势惨淡，AI 板块的市场情绪出现明显断崖式下挫。国内宏观层面，继进出口数据表现亮眼之后，9 月信贷数据同样超出预期，不过信贷回暖主要依靠政府债券发行支撑。地缘方面消息反复变化，有报道称德国正推动欧盟在年底前针对中国商品增设进口限额，或将再度对出口敏感标的形成压力。相对利好的消息是，PCB 生产商沪电股份预告第三季度业绩向好，利润环比增幅 50%-65%，增长主要来自产能扩张，有望为板块带来一定支撑。但流动性依旧是核心观察指标，昨日成交额回落至年内低点 1.43 万亿元人民币。增量资金不足，是当下市场持续走弱最核心的担忧与底层驱动因素。 📌市场要闻 🌐宏观 1 / 中国：9 月信贷投放超预期，增长主要来自政府债券发行规模提升 🏦金融板块 - 中国银行业：9 月社会融资总量，企业信贷有所反弹，但整体贷款增长依旧偏弱 🇨🇳🇪🇺中欧相关 1 / 德国计划推动欧盟对中国商品增设进口限额，目标品类包含化工品、机械设备，还可能涵盖医药产品，相关提案计划在年底前推出。 2 / 欧盟拟解除对中国公司的制裁，以保住阿斯麦的一家供应商。 3 / 比亚迪、奇瑞、吉利对中欧谈判取得进展表示欢迎，认为贸易紧张局势有所缓和，中国混动汽车对欧出口的前景确定性提升。 💻TMT 板块 1 / 阿斯麦表示，美国拟出台限制 DUV 设备对华销售的政策将会适得其反，会加速国内相关替代方案的发展。 2/PCB 板块：沪电股份 (002463.SZ) 预告 2026 年前三季度净利润同比增长 101%-110%，净利润区间 54.5 亿 - 57 亿元，预示第三季度净利润环比增长 50%-65%。 3 / 苹果公司计划在 12 月，随 iOS 27.3 版本更新，在中国大陆上线 Apple Intelligence 功能。 4 / 安徽省委书记到访长鑫存储，承诺加大对这家存储芯片公司扩产以及整个半导体供应链发展的支持力度。 💊医疗板块 - 中国 CRO&CDMO 行业 2026 年第三季度前瞻：订单景气度将决定 2027 年行业能见度 - 我们预计，尽管基数抬升，2026 年第三季度新增订单增速大概率维持在 20%-40% 区间。2026 年上半年行业订单增速曾高达 30%-55%，表现格外强劲。 🪨稀土板块 - 十余家美国公司正在马来西亚考察稀土采矿与加工项目投资，意在实现关键矿产供应多元化，降低对中国的依赖。 📈北向资金持仓 - 北向资金持仓市值第三季度环比下滑 17.6%，降至 2.58 万亿元人民币；电子、电力设备、电信板块持仓降幅显著。 - 银行板块北向持仓增幅最大，环比提升 47%。 - 宁德时代依旧是北向资金第一大重仓股。#文字观点", "publish_time": "2026-10-15 08:41", "tags": ["文字观点"]}, "post:2026-10-15T08-55:63c91661f08c": {"id": "post:2026-10-15T08-55:63c91661f08c", "kind": "post", "title": "2026-10-15 08:55", "source_label": "帖子正文", "excerpt": "## 市场情绪（Sentiment） 隔夜美国 CPI 大幅超预期，A 股预计今日偏弱开盘。1. 外盘冲击：美股昨夜大跌，AI 板块情绪明显下台阶，对国内算力、半导体成长股形成压力。", "content": "## 市场情绪（Sentiment） 隔夜美国 CPI 大幅超预期，A 股预计今日偏弱开盘。 1. 外盘冲击：美股昨夜大跌，AI 板块情绪明显下台阶，对国内算力、半导体成长股形成压力。 2. 国内宏观：9 月信贷数据强于预期，但信贷增量主要依靠政府债券发行拉动；企业信贷有所修复，整体居民贷款增长偏弱。 3. 地缘扰动：德国推动欧盟年底前新增对华商品进口限制，覆盖化学品、机械、医药，出口链标的承压。 4. 板块利好：PCB 龙头沪电股份预告 Q3 业绩高增，净利润环比增长 50%-65%，产能扩张驱动，短期对 PCB 板块形成支撑。 5. 核心矛盾：市场流动性是最大关注点。昨日两市成交额回落至年内低点 1.43 万亿，**缺乏增量买盘，是市场持续走弱最核心因素**。#文字观点", "publish_time": "2026-10-15 08:55", "tags": ["文字观点"]}, "post:2026-10-15T09-03:dc8344716067": {"id": "post:2026-10-15T09-03:dc8344716067", "kind": "post", "title": "2026-10-15 09:03", "source_label": "帖子正文", "excerpt": "【中金传媒】哔哩哔哩｜3Q26 Preview：关注游戏新品周期，广告预期待充分消化 我们预计公司11月中下旬发布3Q26业绩。我们预计3Q26收入82.45亿元，同比增长7.3%", "content": "【中金传媒】哔哩哔哩｜3Q26 Preview：关注游戏新品周期，广告预期待充分消化 我们预计公司11月中下旬发布3Q26业绩。我们预计3Q26收入82.45亿元，同比增长7.3%；Non-GAAP营业利润8.11亿元，同比增长17.9%；Non-GAAP净利润8.29亿元，同比增长5.3%。 ☀️关注要点 1️⃣游戏：《闪耀吧！噜咪》上线，关注其表现及后续新品。已上线新游方面，《闪耀吧！噜咪》9/17上线，据七麦数据，9/17至10/14 iOS游戏畅销榜排名在第19至73名，其首月表现符合我们预期；《三国：百将牌》9/16已推出S2。储备游戏方面，《三国志：王道天下》iOS预约时间为12/24；其他储备包括《三国：火凤燎原》《仙境传说3》《激战：大牌英雄》等。我们认为，公司3Q26游戏收入或环比持平，4Q26游戏收入有望同比正增长，建议关注重点产品《闪耀吧！噜咪》四季度的新卡池运营节奏、流水表现与2027年游戏新品周期。 2️⃣广告：宏观环境承压，4Q26同比增速或有放缓。考虑到当前宏观环境下消费及电商行业广告主预算收紧，我们预计公司3Q26广告收入同比增速20%，4Q26增速或放缓至15%；2026年全年广告收入同比增速22%。公司2Q26前三大广告主为游戏/数码家电/网服，我们认为，公司社区生态价值突出，在部分行业仍具有差异化投放优势，同时持续关注宏观环境变化。 3️⃣社区：用户流量与市场健康增长。根据QuestMobile，哔哩哔哩7月和8月移动端MAU分别同比增长6.3%/4.2%，单用户使用时长同比亦有增长，公司社区生态健康发展。 ☀️盈利预测与估值 因广告业务增速放缓，下调26年Non-GAAP净利润预测2.2%至30亿元；综合考虑广告业务调整和控费，维持27年Non-GAAP净利润预测34亿元。现价对应26/27年Non-GAAP P/E港股15/13倍，美股15/13倍。维持跑赢行业评级。因广告增速放缓，下调目标价18%至159.2港元和20.5美元，对应港/美股21/18倍26/27年Non-GAAP P/E，港/美股较现价有39.5%/36.9%的上行空间。 风险 广告与游戏业务增速低于预期，竞争加剧，成本费用超预期。#文字观点", "publish_time": "2026-10-15 09:03", "tags": ["文字观点"]}, "attachment:files/中金公司-银行月度观点：看好板块中期表现-261013.pdf": {"id": "attachment:files/中金公司-银行月度观点：看好板块中期表现-261013.pdf", "kind": "attachment", "title": "中金公司-银行月度观点：看好板块中期表现-261013", "source_label": "中金公司", "excerpt": "银行月度观点：看好板块中期表现 银行月度观点：看好板块中期表现 2026-10-13 行业近况 即使存在部分分歧，过去几年我们提出的主要观点逐步得到市场认同： 1 ）行业供给侧出清、 C 端风险暴露等维度体现了 银行部门承担了实体经济产业调整的压力，风险确认和承担体现结构性特征；2 ）主要银行受益于自上而下的债务重组和经营能 力，过去五年业绩保持稳定，兼顾较", "content": "银行月度观点：看好板块中期表现 银行月度观点：看好板块中期表现 2026-10-13 行业近况 即使存在部分分歧，过去几年我们提出的主要观点逐步得到市场认同： 1 ）行业供给侧出清、 C 端风险暴露等维度体现了 银行部门承担了实体经济产业调整的压力，风险确认和承担体现结构性特征； 2 ）主要银行受益于自上而下的债务重组和经营能 力，过去五年业绩保持稳定，兼顾较高股息率； 3 ）行业净息差进入中周期的稳定阶段，主要受益于监管政策和货币政策； 4 ） H 股好于 A 股，两地价差继续收窄。向前看，趋势依然在延续，也有新的话题，比如降速提质新常态的分化问题。最近几个季度来 看，银行股票经历一波调整， 7 月开始上涨且趋势延续至今。向前看，我们维持 6 月以来观点，看好中期维度的银行股票表现。 前提是存在分歧的业绩稳定性，背景是经济转型阶段的长期性，逻辑则是配置资金主导的价值重估。 评论 9 月银行表现依然较强， A 股银行单月涨幅 2.7% 、在 35 个二级行业中排名第三。 9 月 A 、 H 银行股分别上涨 2.7% 、 2.2% ， 分别跑赢大盘 8.5ppt 、 6.0ppt 。年初至 9 月底， A 、 H 银行分别上涨 3.9% 、 24.8% ，相对收益分别为 +9.8% 、 +28.8% 。个股上， 涨幅居前的个股主要包括三大类：分红率提升且股息率相对更高的国有行（交行、邮储等），业绩亮眼的头部区域行（杭州 等），以及 8 月业绩期超跌反弹的股份行（浦发、兴业等）。 回顾 9 月，银行整体呈现前涨、中跌、后平的节奏，三大影响因素： 1 ）海外利率环境不确定性对市场风偏的影响， 9 月 16 日美联储加息落地后市场风偏有所回升，是中旬银行转跌的主要原因。 2 ）险资增配红利股的中长期需求， 8 月 20 日出台的保险资负新规可能为红利资产带来长期配置需求，银行股价回调至低 位时，股息率性价比提升，有望触发险资等长期资金建仓入场，从而为银行股估值筑牢下限支撑。 3 ） “929” 按揭贴息及 PSL 降息扩围政策，撬动信贷需求的同时对银行息差负面影响较小，带来银行基本面提振预期， A 股 银行于次日大涨 1.5% 。 展望来看，我们预计年内银行股行情有望延续，支撑因素包括业绩平稳、国内利率预期稳定、市场风格预计保持相对均 衡、年底中期分红落地、险资开门红带动配置需求等。 三季度及全年业绩预计与中报保持平稳。我们预计三季度银行净利息收入增速较中报或有下降，主要由于规模扩张降速、 以及负债成本改善幅度较上半年收窄；但其他非息预计有较好的表现，一方面来自权益投资的入账，另一方面则是去年同期老债 浮盈兑现带来的高基数影响消退。综合来看我们预计三季度银行营收增速与中报保持基本持平，信用成本高位平稳，故利润增速 依然慢于营收增速、但与中报相比基本平稳。 国内利率预期相对稳定，银行股息率相比国债依然维持较高的利差，高股息逻辑稳固。不同于海外的加息和紧缩预期、美 债利率走高的环境，国内货币政策依然较为宽松，信贷需求偏弱、财政加杠杆以及宏观政策逆周期调节背景下，我们预计利率不 具备大幅上行的空间。截至 10 月 2 日，四大行 A 股股息率依然高于 10 年期国债收益率 2.2 个百分点，对以人民币计价资产为主 要投资池的机构依然具有较大吸引力。较为稳定的利率预期下，银行股息率逻辑较为稳固。 年底中期分红落地、险资开门红等是资金面的主要利好。 8 月 20 日出台的保险资负新规可能为红利资产带来长期配置需 求，是支撑银行股价的重要增量资金，根据中金保险组测算，预计 2027-2029 年保险行业合计配置高股息需求在 1.5-2.0 万亿元 区间。而银行股相比其他行业具有独特的优势，主要体现在： 1 ）股息率仍高，截至 10 月 2 日， A 股银行 TTM 股息率依然有 4.1% ，是少数维持在 4% 以上的行业，基本满足险资对股息 率的底线要求，对绝对收益的资金形成较好的收益基本盘。 2 ）综合投资收益波动低。综合投资收益率波动率在各个行业中处于 较低水平。险资 OCI 账户浮盈虽然不计入当期利润，但会通过权益影响偿付能力等指标，因此综合收益波动较低更适配险资等 类固收资金的偏好。我们测算 2018 年以来银行股的 TTM 总投资收益率波动率为 14.2% ，在 35 个行业中排名第三低。 3 ）银行板 块具有较大的市值容量，截至 10 月 2 日板块总市值 10.7 万亿元，能承接较大的资金流动。以南向资金为观测样本，三季度南向 资金净流入约 1,340 亿港元、较二季度的 801 亿港元有所回升，根据中金策略组估算，保险是南向长期增持主力、红利大概率是 主要配置方向。 银行板块内， 9 月南向资金主要增持农行、中行、中信、交行等高股息标的，尤其是中旬调整后， 9 月最后一周多数国有 下载日志已记录，仅供内部参考 行都获得南向资金增持，增持金额占持股市值的比例在 0.2%-0.7% 不等。 市场风格方面我们预计年内将维持成长与价值相对均衡的态势。当前科技板块的交易集中度仍高， 9 月硬件设备成交额占 全市场比重较 8 月基本持平（ 24% ），半导体继续回落至 12% ，但两者合计仍达 36% ，高于 2020 年以来约八成的月份，集中度 较年内高点（ 6 月 -7 月的 42% ）回落，但绝对水平仍高，股价具有一定脆弱性，基本面无明显催化的情况下，预计对其他板块的 虹吸效应将减弱。此外，出于降低组合波动性和脆弱性、夯实年内收益的角度，部分交易型资金可能也会阶段性换仓至波动更低 的红利板块。 选股上关注股息率高、综合收益波动低的标的。考虑当前高股息依然是银行板块上涨的核心逻辑，增量资金需求一方面来 自险资的中长期配置需求，另一方面来自年底降低组合波动性的交易性资金需求，故银行个股层面，我们建议关注几条主线： 1 ）业绩与股息兼具的头部区域行，包括江苏、南京、渝农等； 2 ）综合收益波动率较低、分红预期强的国有大行； 3 ）股 息逻辑可能外溢的优质头部股份行，例如招行等。 估值与建议维持盈利预测与估值不变。建议关注股息与业绩兼具的头部区域行，包括江苏、南京、渝农等，基本面稳健且 分红率提升的国有大行，以及招行等业绩平稳、股息率较高的头部股份行。 风险 信贷增速下降速率超预期，资产质量压力超预期。 下载日志已记录，仅供内部参考", "status": "extracted"}, "attachment:files/东北证券-安克创新(300866)全球化消费电子平台公司，创新驱动业绩持续增长-261014.pdf": {"id": "attachment:files/东北证券-安克创新(300866)全球化消费电子平台公司，创新驱动业绩持续增长-261014.pdf", "kind": "attachment", "title": "东北证券-安克创新(300866)全球化消费电子平台公司，创新驱动业绩持续增长-261014", "source_label": "东北证券", "excerpt": "请务必阅读正文后的声明及说明 [Table_Info1] 安克创新 (300866) 电子 [Table_Date] 发布时间： 2026 -10-14 [Table_Invest] 买入 上次评级： 买入 [Table_Market] 股票数据 2026/10/13 6个月目标价（元） / 收盘价（元） 112.87 12个月股价区间（元） 92.93~1", "content": "请务必阅读正文 存在周期，当月出货均价体现的是前期不同批次订单的组合。根据近期调研，8—10月连续调价后，新接订单价格仍高于当期出货均价，高价订单逐步交付将继续推动Q4均价上行。同时，上游电子布、覆铜板仍有进一步涨价空间，为板厂后续顺价提供支撑。#新增订单提价与存量订单兑现接续，即使调价频率阶段性放缓，出货均价和利润仍有望继续向上。 #供给约束正在转化为优质板厂的议价权，行业利润有望向稳定交付的企业集中。高端产能向AI倾斜，部分传统产品供给受到挤压；材料供应偏紧又进一步放大上市板厂在采购、资金和交付方面的优势。拿得到材料、交得出产品的企业，更有条件筛选客户、优化订单，将有限产能配置给高价值业务。本轮盈利改善既来自产品顺价，也来自客户结构升级、产能利用率和制造效率提升；后续若材料涨幅趋缓、板厂售价保持韧性，利润空间有望进一步打开。 #汽车与电源PCB是重点方向，尤其重视AI电源板的涨价弹性。汽车客户重视品质和供应链稳定性，具备客户基础与稳定供货能力的板厂更有机会实现顺价。电源PCB则同时受益于AI电源需求增长和传统FR-4产能约束：相关板材及部分制造产能与普通FR-4产品共用，下游AI客户更重视可靠性与交付，对PCB环节价格的敏感度相对较低。在订单增长、供给偏紧与顺价能力共同作用下，我们看好电源PCB较强的涨价弹性与兑现确定性。#继续推荐中小PCB方向：核心看好汽车占比高【奥士康】，电源链+涨价【威尔高、四会富仕】，AI+涨价【景旺电子、方正科技】，涨价持续超预期的【崇达技术、超声电子、金禄电子、博敏电子、中京电子、满坤科技、伊顿电子、澳弘电子】等。 风险提示：产品调价、订单交付不及预期，原材料成本上涨超预期。 欢迎联系 浙商电子田发祥17317150564#文字观点", "publish_time": "2026-10-15 09:34", "tags": ["继续推荐中小PCB方向", "文字观点"]}, "post:2026-10-15T12-51:41a7d108296a": {"id": "post:2026-10-15T12-51:41a7d108296a", "kind": "post", "title": "2026-10-15 12:51", "source_label": "帖子正文", "excerpt": "野村——全球PCB/基板行业——AT&S管理层电话会核心纪要 一、整体指引：营收高增，产能扩张获客户全额资金背书 AT&S（奥地利科技与系统技术，ATS AV，未评级）为少数西方先进PCB及IC基板制造商，主要产能位于奥地利、中国及马来西亚。管理层预计FY26/27E（财年截至次年3月）营收同比增长", "content": "野村——全球PCB/基板行业——AT&S管理层电话会核心纪要 一、整体指引：营收高增，产能扩张获客户全额资金背书 AT&S（奥地利科技与系统技术，ATS AV，未评级）为少数西方先进PCB及IC基板制造商，主要产能位于奥地利、中国及马来西亚。管理层预计FY26/27E（财年截至次年3月）营收同比增长45%–55%（固定汇率计），FY25/26基数18亿欧元，EBITDA利润率指引32%–37%。期内净资本开支预计10–12亿欧元，净负债/EBITDA控制在3倍以下。ABF基板产能扩张已获长期客户承诺全额覆盖，所有相关支出均由客户出资。 二、业务板块利润率与营收结构演变 • PCB业务：当前EBITDA利润率约15%，部分受客户集中度及季节性拖累。管理层指出，光模块对改良型半加成法（mSAP）的需求启动，有望为未来EBITDA利润率提供上行支撑。 • ABF基板业务：当前EBITDA利润率约40%，但因受长期协议（LTA）约束，上行空间相对受限。 • 客户出资模式：资本开支资金通过两条路径注入：1）预付款，计入AT&S负债端；2）现有产能预留费及增量产能里程碑付款，直接确认为收入且无对应成本。 • 营收结构：FY25/26年ABF基板与PCB各占50%；FY26/27E预计ABF基板占比升至60%、PCB降至40%；FY27/28E ABF基板占比或进一步倾斜至约70%。 三、产能扩张规划：重庆与马来西亚Kulim双线并进 • 重庆工厂：扩产主要为美国某头部CPU客户的嵌入式硅基板（embedded silicon substrates）进行瓶颈突破，中期亦为应对中国客户的本土化制造需求做准备。新产能将于FY26/27及FY27/28期间逐步爬坡。 • Kulim基地： ◦ Kulim 1：专供美国CPU/GPU客户，目前运行两条产线，第三条线正处爬坡，第四条线已于6月宣布，计划FY27/28投产。 ◦ Kulim 2：规划FY28/29投产，最多可容纳五条产线。其中三条拟用于美国头部CPU客户的嵌入式硅-硅通孔（TSV）基板，一条用于Marvell（MRVL US，未评级），第五条线仍在寻求客户承诺。 ◦ Core工厂：配套建设核心材料自产工厂，专供嵌入式技术所需芯板。 • 远期空间：Kulim 2旁预留土地可用于未来ABF基板或mSAP扩产，并已锁定三座额外工厂用地。 四、基板技术壁垒：大尺寸与高精度挑战 • AT&S凭借特殊嵌入式工艺专长及快速爬坡能力，在美国CPU/GPU客户的高端产品供应中占据领先地位。该客户基板生产难点在于大尺寸基板及严苛规格下的全流程生产协调。 • 相比之下，美国另一头部CPU厂商的嵌入式硅-TSV基板制造难度呈数量级提升，难点集中于最后数层增层（build-up layers）及嵌入式精度控制。 • 管理层认为，嵌入式硅-TSV基板量产良率需达60%–70%方具备经济可行性。尽管尚未进入大批量制造，但AT&S在CoWoS基板及PCB嵌入式技术上的积累可形成一定先发优势。 • 嵌入式硅-TSV基板虽为现有嵌入式硅基板的延伸（仅增加数道新工序），但因供电网络差异（TSV基板为双面供电）及额外高端设备投入，产能不具备经济意义上的可互换性。 五、投资启示：重申ABF基板上行周期，看好欣兴电子 野村重申对欣兴电子（Unimicron，3037 TT）的买入（Buy）评级。公司正受益于供应瓶颈下的定价改善及技术进步（EMIB-T技术风险可控、大光罩尺寸2.5D），后者在AI驱动的上行周期中至关重要——更高的基板技术含量将进一步拉开一线厂商与追随者的差距，与AT&S管理层观点形成印证。基于25倍2028年预期EPS（56.00元新台币），目标价设定为1,400元新台币。#文字观点", "publish_time": "2026-10-15 12:51", "tags": ["文字观点"]}, "attachment:files/CCL及上游材料近期产业调研总结.pdf": {"id": "attachment:files/CCL及上游材料近期产业调研总结.pdf", "kind": "attachment", "title": "CCL及上游材料近期产业调研总结", "source_label": "其他", "excerpt": "CCL及上游材料近期产业调研总结 ·上游一致上行、覆铜板结构分化。·铜箔缺而不涨是最大预期差。", "content": "CCL及上游材料近期产业调研总结 ·上游一致上行、覆铜板结构分化。 ·铜箔缺而不涨是最大预期差。 ·需求增量全部来自三个平台迭代。 ·瓶颈已从材料迁移到设备+良率。 一、核心结论 第一，本主题的叙事重心已经换过一次。7月市场讨论的是\"上游材料涨 价、覆铜板跟涨\"；到10月，讨论已经转向\"高端材料代际切换，设备与良率的 约束成为终局\"。高端的最终瓶颈既不是价格，也不是某一种材料的产能，而是 此前没有量产过的材料，能不能被稳定地加工出来。 第二，上游方向一致向上，覆铜板内部却明显两极分化。电子纱、电子 布、铜箔、树脂的方向都是上行；覆铜板两端则走了相反的路——一线龙头面 向AI服务器的M8/M9持续提价，二线公司面向消费电子的普通FR4承压。 但低端价格的方向并不像表面那样确定：8月的局部回调更接近均值回归，此 后中低端价格整体仍偏强。 第三，铜箔最大的预期差不是\"缺口有多大\"，而是\"缺口存在、价格却涨不 动\"。高端铜箔的供需缺口是产业链里最确定的，但日系龙头以稳价策略把价 格天花板锁住，国内厂商难以超越其报价，缺货带来的涨价一时无法兑现。 第四，PTFE路线提前了，而它的关键优势是\"更便宜\"。驱动时点从原先 预期的2028年放量，提前到2027年的RubinUltra平台；而支撑其渗透的逻 辑，是PTFE树脂的价格远低于M9级别所用树脂、且可以省去昂贵的石英 布。 第五，瓶颈已经从\"材料\"迁移到\"设备+加工良率\"。材料本身的良率已能 做到较高水平，真正卡住量产的是印刷电路板环节的加工良率，以及专用层压 机、织布机这类设备的产能与交期。 第六，认证窗口是隐性的产能约束。在硅微粉、树脂这些上游填料环节， 真正的门槛是验证成本与时间窗口，而不是技术或产能。错过一个平台的认证 窗口，往往要等下一个平台，先发锁定效应很强。 二、价格：上游普遍上行，但也有机构分化 2.1电子布/电子纱：供给约束最硬、涨价最早的边际变化 进入7月后，电子纱与电子布价格出现一次跳涨，实际涨幅明显超出市场 此前预期——原先市场只预期小幅上调，结果是一次性上了一个台阶。7628厚 布价格在窗口内连上四级台阶：7月8.4–8.8元/米、8月约10.1元/米、9月约 11.7–11.8元/米、10月初13.0–13.3元/米。驱动逻辑不是下游需求被动接受，而 是高端布种大量挤占普通布产能，造成全线脱销；同时织布机等设备交期拉 长，又反过来限制了产能释放。关键在于高端细纱直供AI高端布与低介电布， 规格越细、良率制约越强、转产损耗越大，供给弹性反而最小。最重要的变化 是电子纱由\"配套跟随\"转为阶段性\"独立领涨\"，涨价向高端细纱集中的趋势进 一步确立。 缺口刚性的物理来源是设备而非资金。高端电子布基本只能由日本丰田 JAT910织机生产，丰田占全球高端织机份额>80%，年产能约2,400台且暂无 扩产计划，排期已至2030年、交货周期18–24个月；国产织机在张力控制等核 心工艺上仍有代差，中国巨石国产织机试样尚未达到可织7628布乃至薄布的水 平。最重要的变化是设备交付周期已实质性锁定未来两年的有效供给天花板， \"缺口刚性由设备而非资金决定\"是本环节的核心锚。 窗口内扩产集中于头部：建滔积层板织机由约3,300台规划增至2028年约 5,800台，未来两年从丰田获约2,500台；宏和科技80亿元扩建新增1,535台织 机、最快2027年底释放；中国巨石淮安5万吨电子纱二期于2026年点火；内 蒙天皓拟投资50亿元规划20万吨电子级玻纤。电子纱净新增实际产能2026– 2028年为11.6/3.6/7.8万吨，其中2027年无新产能点火。最重要的变化是2027 年电子纱供给增量接近空窗，约束由织机环节进一步延伸至纱端。 行业对后续价格\"看高一线\"，进一步上行的预期较强。景气持续性方面， 主流判断偏乐观，认为本轮热度延续到2027年，甚至到2027年三季度。 2.2铜箔：高端受产能挤占，核心是\"缺而不涨\" 低阶HTE铜箔的加工费在7月同样明显上行，但驱动来自产能由低阶向高 阶转移，而不是消费电子需求回暖。这决定了它的持续性有限：一旦低阶新增 表面处理线投产，供给缺口很容易被补平，价格存在回落可能铜箔要分两条线看。 qq1490929960 高端铜箔（用于 AI服务器的 HVLP/RTF 系列）的加工费上行，是方向最明 确、也最被多方印证的一条。核心机制是： 高阶产品对产能的占用极大 ，生产 一吨高阶铜箔要挤占数倍的常规产能， 行业因此整体转向 \"供不应求、加工费 逐月上行 \"。国产产品相对日系仍有明显折价，上行空间也依然存在。 。 铜箔这一环节最重要的判断，其实不是涨幅，而是\"缺而不涨\"。缺口是确 定的：三、四代高端铜箔的月度需求明显高于现有供给，仅一家头部终端客户 2027年的需求，就足以让缺口维持在高位。但价格的天花板被锁死了——日系 龙头在稀缺时并不激进提价，其报价成为全市场的锚，国内厂商无法超越。于 是出现\"缺口长期存在、价格却不动\"的僵局，市场按\"缺口→涨价\"的线性逻辑 做多，反而不容易兑现。 摩根士丹利测算，全球HVLP4五家供应商有效产能合计约1,000吨/月，三 井金属2026年占41.00%；需求2026年12.3千吨→2027年39.2千吨 （+218.00%）→2028年52.0千吨，对应缺口2027年31.00%、2028年 20.00%；国内HVLP总产能约1,500吨。硬约束在表面处理设备：日本三船年 产能仅约10台、对应1万多吨铜箔产能，新产线还需6-12个月爬坡，2026年 扩产难解当期缺口，高弹性后移至2027年（德福判断27Q2起HVLP4成产业 链最核心瓶颈）。窗口内最重要的变化是2027年31.00%缺口的量化测算，把 铜箔从\"跟随CCL\"升级为\"独立瓶颈\"环节。 规格层面，HVLP5相对HVLP4粗糙度指标提升较多，德福已完成样品认 证、正稳步推进客户导入，预计2027年投入使用、2028年成为主力 （Ultra）。三井金属社长10月小范围交流表态：HVLP需求之强使2030年 1,400吨/月产能仍不够用，考虑将扩产计划加速至5,000吨/月，且对涨价态度 更积极。窗口内最重要的变化是三井由\"扩产\"转向\"加速至5,000吨/月\"，暗示 其对2028年后需求曲线的判断已大幅上修。 2.3硅微粉等填料：从辅材到主材的用量与价格双抬升 本环节是窗口内\"用途地位\"变化最剧烈的上游材料，填充比例随CCL等级 陡升，硅微粉由配角辅材转为决定介电性能的核心功能材料。填充比例沿FR-4 约15%→M7约30%→M850%→M950%-60%逐级抬升，PTFE/无布方案进一 步升至60%以上。驱动并非需求总量，而是高阶规格与无布方案对填料的刚性 依赖：M9/M10时代球硅完成\"由普通填料到核心功能材料\"的蜕变，化学法亚微 米级需求大幅增长；无布方案推行使硅微粉用量被动提升。这一地位的抬升是 本环节最根本的变化，也是后续量、价、格局三条逻辑的共同源头。 单价随等级与工艺双重分层，每突破一个等级单价量级即跳升。角硅约0.3 万元/吨→M7亚微米球硅10-20万元/吨→M8化学法20-30万元/吨→M930-40 万元/吨→M10/PTFE约40万元/吨。日本进口高端球硅约100万元/吨，国产价 格有望自50万元/吨向100万元/吨靠拢——国产替代伴随的是价格中枢上移而 非替代降价，提价天花板仍由日本进口价锚定。工艺路线决定分层：液相法 （化学法）介电损耗0.0003-0.0006、纯度>99.9%，对应M8及以上高价区间。 量价双升落在供给极紧的底座上。2027年M8+M9对应球硅需求约2.33万 吨，而当前全球有效供给不足1万吨。海外增量有限——日本雅都玛新产能要 到2028年初才投产，26-27年供给跟不上，供需自26H2趋紧并有望持续通 胀。国产进度上，联瑞新材化学法球硅一期1,200吨已投产并基本满产，二期 26Q4、三期27Q1投产，总产能向5,000吨靠拢，M9已实现吨级出货（含打 样）、M10少量出货；生益科技2026年6月将向联瑞采购的关联交易金额上 调82%，二股东绑定加深。 与树脂环节PTFE与碳氢存在路线分歧不同，硅微粉是少见的\"PTFE与碳 氢双路线中性受益\"环节——不论CCL走哪条方案用量都会提升，且下游升级 后能参与的玩家更少、格局更好。9月以来全球硅微粉稼动率满载，海外大厂 寻求国内代工产能、国内大厂寻求新扩产空间，价格弹性\"一触即发\"。由此， 本环节窗口内最需跟踪的边际信号是Q4备货指引的上修——它是\"需求上修→ 稼动率满载→价格弹性\"传导链的最终验证点。 2.4覆铜板：高端与低端脱钩，低端方向待观察 高端与低端走的是两条路。面向AI服务器、载板、光模块的高端覆铜板订 单饱满、持续提价，交期拉长至数周；面向消费电子的普通板材则承压。高端 的定价与低端已经基本脱钩，量级上高端等级比普通FR4高出数倍乃至近十 倍。 中低端板材方面，8月出现过一次局部回调：部分前期涨幅过快、价格出现 倒挂的厂商率先降价，一度被解读为价格拐点。但从成因看，这更接近均值回 归，而不是需求走弱引发的行业性下跌——同期仍有龙头厂商继续补涨、并上 调后续报价；产能持续向高端转移，又令普通板供应偏紧，中低端价格整体维 持强势。据此，对低端价格更稳妥的判断是\"方向待观察\"，而不是趋势性下 行。 建滔积层板的提价自2026年3月启动后逐月加密：7月6日FR4/PP上调 15%（厚度>1.3mm），为本年第六轮；8月28日发布第七轮涨价函（FR-4全 系列+10%、薄布半固化片+20%），9月1日起执行FR4+10%、7628厚布 +10%、薄布+20%；10月13日第八轮仅针对以2116（含）以下薄布为原料的 板料与PP上调15%。年内第7、8轮以9月1日执行、10月13日通知为分 界，2025年以来累计提价达10轮。10月这一轮不再普涨全系列而是单挑\"薄布 \"这一结构性紧俏品种，是本窗口最重要的变化，标志提价由总量推动转入以 稀缺规格为锚的新阶段。 供给端出现历史首次的\"配额制供应\"，并伴生客户预付定金、合资锁供等 议价结构变化，CCL由被动跟随成本转向主动分配产能，二、三线PCB厂订 单能见度拉长至3—4个月。台系三厂至2028年底累计扩产约80%，相较M7 以上需求约90%的增长仍有缺口；英伟达M9仅台光电子与生益科技通过认 证，EMC预计M9的ASP较上一代高30%以上；斗山规划9,700亿韩元扩产、 2028年下半年起投产。CCL稀缺性使其议价能力罕见增强，供需错配的持续 时间成为价格上行最关键的支撑变量。 三、需求：平台迭代是唯一的量级驱动 从单机柜的用料结构看，Switch部分的M8用量约为Compute部分的两 倍，这解释了为什么交换机板的材料升级对上游拉动更直接。出货爬坡的节奏 整体是\"比预期更慢，但更确定\"：新一代平台的实际出货在7月一度冲高（含 前期欠交回补），8月回落，正常水平约为上半年的两倍；终端客户的板卡产 能也给出了到2027年下半年见峰的指引。量产后M8的月需求约两百万张、 M9约一百二十万张——这属于前瞻判断，只用于把握量级需求的全部增量来自三个平台的板卡迭代 ——英伟达的 Rubin/Rubin Ultra、谷歌的 TPUv8、亚马逊的 Trainium 3 。三者的材料方案差异，直接决 定上游各材料的消耗结构 ：Rubin的计算卡与交换机板以 M8加第四代铜箔为 主，中板开始导入 M9；Rubin Ultra 的正交背板则在 PTFE与M9之间做取舍， 也是M10材料的首次应用平台；谷歌 TPUv8的板卡在 M8上罕见地搭配了较低 代铜箔；亚马逊 Trainium 3 则以纯 M8加第四代铜箔为主，并已导入国产铜箔 作为第二供应商。 qq1490929960 。 四、供给 到27年，甚至28年，仍然有很大的上升空间，这是第一个维度，更多的去关注高端设备 的放量节奏。 发言人31:08第二其实就是大家也要看到，现在其实这些AIP这个闪电投了很多，原先一条B这个闪 电投产完之后，可能7到8年我是不需要做设备更新的。但是现在客户的方案一年一换工艺有很大的一 个升级的需求，所以它整个升级的节奏是在快速压缩的。而且现在很多PCB产线可能1到2年就可以 完全回本。所以讲到三年维度，它就可以去自由做一些新的设备的更新，它仍然是可以保证盈利的。所 以在这样的一个前提之下，我们认为其实未来PCV设备升级周期的缩短，也是会带来PCV设备空间的 一个潜在上修的。所以从这两个维度来讲，我们其实在现在其实PC的设备回调比较大的一个位置，依 然是非常看好后续这个PCB设备的行情的。所以也重点去建议去关注大陆数控、新奇微装等为代表， 兼具头部平台型设计能力，同时又卡在未来PCB设备和PCB工艺升级的核心方向的龙头公司。对这个 是整个PCP产业链目前各个环节我们的一个观点。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 发言人32:16总结一下的话，其实重点推荐的标的CCL环境的生意科技，PCP设备的大陆数控信息微 装。PCB制造领域，沪电深南这样的白马公司，以及景旺生意电子，这样在后面可能会有很大个股边际 变化的公司。同时也建议关注像广丰科技这样的一个公司，以及新兴科技。 发言人32:41以上是可能现在整体上我们PTP板块的一个观点，以及标的的一个推荐的情况。对我看 今天也聊的比较多了。这边今天我们的汇报就先到这里。如果大家后续有进一步的问题，无论是关于 Q3的业绩前沿的情况，PCP制裁的一些风险，包括后续整个板块节奏的一个涨跌，都欢迎联系我们中 信电子团队做进一步的沟通和交流。今天我们的电话会就到这边，也祝大家业绩长虹，万事顺意，谢谢 大家。感谢大家参加今天的会议，祝大家生活愉快，再见。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-15T13-20:5acdf6c41e0f": {"id": "post:2026-10-15T13-20:5acdf6c41e0f", "kind": "post", "title": "2026-10-15 13:20", "source_label": "帖子正文", "excerpt": "摩根大通——中欧贸易：争取时间，管控分歧 2026年10月8日至9日，欧盟贸易专员谢夫乔维奇与中国商务部长王文涛在北京达成的协议是一揽子稳定方案，而非战略重置。该协议降低了短期扰动风险，并为争端管理建立了更具结构化的流程，但并未解决中欧贸易失衡这一根本矛盾。", "content": "摩根大通——中欧贸易：争取时间，管控分歧 2026年10月8日至9日，欧盟贸易专员谢夫乔维奇与中国商务部长王文涛在北京达成的协议是一揽子稳定方案，而非战略重置。该协议降低了短期扰动风险，并为争端管理建立了更具结构化的流程，但并未解决中欧贸易失衡这一根本矛盾。失衡根源在于中国快速产业升级与内需吸纳不足、欧洲竞争力缺口，以及日益增长的安全与韧性关切。未来路径将是反复摩擦、选择性交易与渐进式本土化，而非全面和解或彻底破裂。 贸易失衡现状 欧盟对华商品贸易逆差目前已达日均约10亿欧元，且逆差结构已从以低成本消费品为主，转向集中于欧洲工业核心领域——包括汽车、电池、机械及电气设备。这一转变显著抬升了争端的经济代价与政治敏感度。 协议核心条款与商业影响 • 混合动力车安排：双方就混合动力及插电式混合动力汽车达成WTO合规谅解。欧盟称该安排可使中国相关车型对欧出口减少逾半，但联合声明未明确配额、时间表及法律工具。透明、可监控且设有时限的机制将保留谈判入市通道；若实施刚性限制，则可能加速中国车企在欧洲的本土化进程。 • 关税减让：双方将探索对涵盖近40亿欧元欧盟对华出口的选定商品实施更低或零最惠国关税，欧盟估算年关税减免至少2.25亿欧元，覆盖汽车零部件、橄榄油及鞋类。 • 稀土绿色通道：中国将通过“绿色通道”便利稀土及永磁体对欧出口许可证发放。若审批时效与拒批风险下降，该通道对供应链连续性的意义将远超关税减让。 • 中国出口退税调整：2026年10月12日，中国财政部及国家税务总局宣布，自2027年4月1日起，新能源汽车（含纯电动及插电式混合动力乘用车）出口增值税退税从13%降至9%。此举适度削减了对EV出口的财政支持，与欧盟对政府补贴竞争的关切方向一致，虽未明确关联本次谈判，但其时机强化了整体降级信号。 其他关键议程 • 欧盟对华纯电动汽车反补贴案的价格承诺与审查程序继续推进。 • 医疗器械、动物检疫限制、计算机预订系统、化妆品及药品领域谈判持续。 • 就欧盟《外国补贴条例》开启技术对话，并加强出口管制合作。 • 中国将推动欧盟加快处理符合条件的动物产品及医疗器械准入；欧盟将就中方优先关注的军民两用物项与成员国协调。 • 更可预期的许可审批、管制清单变更的提前通知及更清晰的移除程序，可能成为本次一揽子协议中最具持久价值的成果。 对欧洲企业的意义 短期直接收益在于运营能见度提升，而非市场的大幅开放。关税减免与监管进展将支撑部分对欧出口，关键矿产许可流程的理顺将降低生产中断风险。但多元化采购、库存缓冲及中国专项合规仍不可或缺——绿色通道仅便利许可，不保证供应。 对中国企业的意义 混合动力车谅解及持续的EV程序保留了谈判进入欧盟的通道，但在贸易防御、外国补贴、公共采购及经济安全审查下的 scrutiny（审查）将持续。本土生产、采用欧洲供应商、融资透明度及可量化的本地价值创造将日益成为市场准入的决定性因素。 后续时间表与催化剂 • 2026年10月15日至16日欧洲理事会：首个政治检查点，领导人将评估协议并保留强化贸易防御、采购及韧性措施的选项。 • 2027年1月部长级中欧视频会议：检验混合动力安排是否构成可行法律形式、关税减让是否落实至具体产品线及实施日期、稀土绿色通道是否兑现加速审批。 • 2027年3月第三届贸易与投资磋商会议：评估行业谈判是否产生实质性市场准入、EV价格承诺谈判是否取得进展。欧盟将当前成果定义为“第一步”与“概念验证”，进一步降级取决于执行。 未来3至6个月基准情景 管控式降级与选择性施压并存。欧盟行动可能继续针对政治与产业敏感产品，而非扩大为全面限制；中国可能维持校准后的调查或特定行业反制。双方相互脆弱性将约束报复范围，但无法消除反复争端。 投资策略启示 协议标志着中欧贸易从“无序对抗”转向“有管理的摩擦”，短期尾部风险下降，但结构性张力未消。建议投资者： • 超配在欧洲具备本土化产能的中国车企及供应链企业，以规避潜在贸易壁垒； • 关注稀土及关键矿物许可便利化带来的欧洲新能源与高端制造链机会； • 警惕2027年一季度各审查节点若执行不力，可能引发的欧盟扩大贸易防御或中方反制风险。 中长期看，双边贸易规模仍将庞大，但构成与治理模式将深刻转变——更多商业活动将由许可、承诺、补贴审查及本地价值要求所塑造。#文字观点", "publish_time": "2026-10-15 13:20", "tags": ["文字观点"]}, "post:2026-10-15T19-44:38007768a952": {"id": "post:2026-10-15T19-44:38007768a952", "kind": "post", "title": "2026-10-15 19:44", "source_label": "帖子正文", "excerpt": "中国新能源设备：专家预计，若无新刺激政策，2027 年国内新增储能装机将较保守📞我们举办投资者电话会，邀请储能行业专家共同探讨中国储能系统（ESS）行业情况。📊专家预测，在有政策支持的情景下，2026 年中国储能装机 200GWh，同比增长 6%", "content": "中国新能源设备：专家预计，若无新刺激政策，2027 年国内新增储能装机将较保守📞我们举办投资者电话会，邀请储能行业专家共同探讨中国储能系统（ESS）行业情况。 📊专家预测，在有政策支持的情景下，2026 年中国储能装机 200GWh，同比增长 6%；2027 年储能装机 240GWh，同比增长 20%。⚠️如果没有出台新政策，2027 年国内储能装机仅能达到 150‑160GWh，同比下滑 20‑25%。🔍截至目前尚未看到新政策落地的迹象，我们无法确定后续是否会推出相关政策。 📉参考专家给出的指引，2027 年新增储能装机的预期相比我们此前的预测更为保守。 💰专家预计储能系统市场价格同比将出现约 10% 的回落，2026 年为 0.52‑0.55 元 / Wh，2027 年将降至 0.47 元 / Wh，主要原因是明年电池供给将更加充足。📉2027 年储能装机不及预期，会对储能设备供应商形成利空。 ✅思源电气来自储能业务的 2026 年上半年营收占比仅 13%，因此我们维持思源电气的买入评级。 1️⃣📌储能装机预测高度依赖新政策是否落地：项目储备正在快速消耗，而新的项目配额尚未下发，由此形成供给缺口。 ⏳如果新政策直到 2027 年 3 月才发布，那么项目培育的时间周期将会受到挤压。 2️⃣📉储能实际新增装机规模远低于项目注册及招标规模。 📋专家表示，已经注册但尚未开工的储能项目取消率达到 40‑50%。 🔎项目取消主要存在四点原因。 🔹第一，项目投资回报下降，无法通过投资委员会审批； 🔹第二，难以获取电网并网指标，该现象较为普遍； 🔹第三，很多省份不允许转让项目前期批复文件（路条），项目配额难以转售； 🔹第四，配套产业、外商投资、土地使用相关要求带来项目进度延迟。 📌招标公示的项目规模较高，但实际落地建设的规模会更低。 3️⃣💴假设电池单瓦成本下行，2027 年储能市场价格将回落。 📋2026 年两小时储能系统价格为 0.52‑0.55 元 / Wh，四小时储能系统价格 0.49 元 / Wh。 📉专家预计，受 314Ah 电芯成本下行带动，2027 年两小时储能系统价格同比下降 0.05 元 / Wh 至 0.47 元 / Wh，四小时系统降至 0.44 元 / Wh。 🔻目前碳酸锂价格已经大幅下跌，但电芯厂商产能处于满负荷状态，电芯供货依旧紧张，上游的降价传导到下游需要时间。 📅电芯厂商、集成商未来 1‑3 个月生产排期全部排满，预计电芯价格将在 2027 年上半年出现回落。4️⃣📉储能新项目投资回报率出现下行。 📊表现较好的地区（内蒙古西部、山东、山西）储能项目总投资内部收益率可以达到 7‑8% 以上。 📉甘肃、河北等地项目总投资内部收益率大约仅 5‑6%。 💸现货价差收窄，叠加 0.07‑0.10 元 /kWh 的系统充电运营费用，挤压峰谷套利的收益空间。 🏦国企项目的投资门槛一般为总投资内部收益率 6%，权益内部收益率 6.5%。 ✨2027 年吉林、安徽等省份计划出台容量电价政策，当地储能项目回报水平有望改善。 📌预计还有广东、福建、辽宁、江苏等十余个省份会在 2027 年陆续推出容量电价相关政策。 ⚠️已经落地容量电价政策的省份，项目投资回报会出现回落。 📈独立储能电站设备利用率，2025 年为 60%，2026 年预计下滑至 50%。 5️⃣📈对上市公司股价的影响：2027 年储能新增装机不及预期会对储能供应商形成利空。 🔹思源电气的营收当中储能业务占比不高； 🔹阳光电源储能业务大部分收入来自海外市场。#文字观点", "publish_time": "2026-10-15 19:44", "tags": ["文字观点"]}, "post:2026-10-15T08-22:ec4b6590388f": {"id": "post:2026-10-15T08-22:ec4b6590388f", "kind": "post", "title": "2026-10-15 08:22", "source_label": "帖子正文", "excerpt": "德业股份：Q3受汇兑+确收延迟略有影响，27年有望持续高增#事件：公司预计26Q1-3实现归母净利润42.2-43.2亿元，同增80-84%，实现扣非归母净利润39.5-40.6亿元，同增73-78%，其中26Q3实现归母净利润15.03-16.03亿元，同增82-94%，环比-2~+5% #储能出", "content": "德业股份：Q3受汇兑+确收延迟略有影响，27年有望持续高增#事件：公司预计26Q1-3实现归母净利润42.2-43.2亿元，同增80-84%，实现扣非归母净利润39.5-40.6亿元，同增73-78%，其中26Q3实现归母净利润15.03-16.03亿元，同增82-94%，环比-2~+5% #储能出货持续向好、确收延迟、汇兑等略有影响。26Q3公司排产持续向好，但受人民币升值导致汇兑损失叠加部分确收有所延迟，Q3盈利预计环比微增。展望Q4，受乌克兰及欧洲其他区域进入冬季备货，需求持续旺盛，公司10月排产环比持平，全年户储出货有望达130万台+，工商储预计出货15-20万台，同比接近翻倍增长，全年营收有望达250e（新能源240e+传统家电10e），其中电池包营收预计有望达110e+，27年工商储高增推动下营收有望持续高成长。投资建议：我们预计公司26-28年归母净利润58.9/78.6/98.5亿元，同增86%/33%/25%，对应PE为16/12/9倍，给予27年20倍PE，对应目标价123元，考虑70-80%分红比例，27年公司股息率约6%，维持“买入”评级。#文字观点", "publish_time": "2026-10-15 08:22", "tags": ["事件", "文字观点"]}, "attachment:files/中信建投-机械设备行业欧洲9月电车跟踪：九国销量同比增长51%，补贴到期国家销量显著修复-2 首先， 原材料成本，特别是封装材料成本上涨剧烈。对于小型功率器件而言，封装成本在总成 本中占比较高，甚至超过晶圆成本，因此封装物料价格的上涨严重侵蚀了毛利空间。其 次，涨价的传导存在时间差。公司分别在1月和7月进行了调价，7月的价格调整对第 二季度财报没有影响，其效果预计将在第三季度财报中体现。相较之下，公司的晶圆代 工业务毛利表现相对较好。 Q3：考虑到涨价通常在4、5、6月执行，且对大客户的调价可能存在滞后， 是否意味着涨价对收入和利润的正面影响将主要在第三或第四季度显现？ 是的，7月份的涨价效应确实要到第三季度财报才能显现。不过，即便如此，其带 来的利润增量也相对有限。目前来看，继续涨价的难度较大，但公司可能计划在10月 份再次提价，目前仍在与客户协商。特别是在8英寸晶圆代工领域，产能非常紧张，价 格可能很快会再次上调。12英寸产线虽然也满产，但价格上涨乏力。8英寸代工业务约 占公司总营收的30%。 二、8英寸晶圆代工业务 Q4：公司的8英寸晶圆代工业务主要涵盖哪些产品？其下游需求主要来自 哪些细分领域？ 8英寸产线主要生产BCD、IGBT和MCU等产品，其中BCD工艺占比最大。目前8英 寸代工业务的毛利表现良好，订单已处于饱和状态。从下游需求来看，IGBT主要应用 于新能源和储能领域。当前产能紧张的局面也促使客户延长了供应链备货周期，普遍从 过去的3-5个月延长至6-12个月。由于工厂从接单到投片生产就需要6个月，加上3 个月的流片时间，客户若没有近一年的库存将面临较大风险。 Q5：目前下游客户的库存水平以及公司的订单能见度情况如何？ 虽然不掌握客户库存的具体数据，但从客户下单情况看，备货周期普遍规划在6到 10个月。 第3页Q6：除了代工业务，公司自有的集成电路产品，如MOSFET、PMIC、IGBT 和MCU，是否也进行了价格上调？ 在家电领域，尽管国内需求存在一定问题，但整体需求并未出现大幅下滑，国外市 场表现相对较好。一个显著的趋势是国产化比例大幅提升，家电厂商已普遍从采购TI、 英飞凌等进口产品转向国内供应商，例如公司和士兰微。尤其士兰微在家电板块表现突 出，其IPM产品在2026年上半年的销售额已达到30多亿元是的，包括 MCU 在内的自有产品也进行了提价。公司的 MCU 主要面向电机、电控和 电源这\"三电\"领域，2026 年至今表现良好。整体而言，集成电路业务在 2026年表现不 错。相比之下，封装业务由于前述的成本急剧上涨问题，毛利表现较差，是今年业绩相 对薄弱的环节。 qq1490929960 Q7：目前集成电路在风光、汽车、智能终端、家电、工业等主要下游领域 的应用情况如何？ 。 三、IPM国产替代与士兰微 Q8：家电领域IPM的国产替代趋势是从何时开始的，其盈利能力和未来的 增长空间如何？ IPM的国产替代趋势已持续多年，关键转折点始于疫情期间。当时由于国外工厂停 产导致严重缺货，国内大型白电厂商开始转向本土供应商，例如士兰微。此后，士兰微 等企业成功切入白电市场的MCU、IPM等领域，并提供整机解决方案，实现了快速增长。 以士兰微为例，其IPM业务在2022至2023年时销售额仅为两三亿元，而现在已增长至 三十多亿元。 综合来看，功率半导体领域中，IPM、SiC-MOSFET、SGT-MOSFET以及氮化镓等产品 的市场需求预计将持续放大。 Q9：在功率模块化领域，哪些国内厂商表现突出或具备较大潜力？ 在模块化领域，士兰微和公司是市场较为熟知的企业，其中士兰微在产品品类和技 术水平上已大幅领先于公司。公司近两年在模块业务上表现不佳，可能与国企体制有关。 第4页模块产品需要与下游客户进行深度融合与定制化开发，而国企在客户支持力度和响应速 度上通常不及民营企业。模块业务更偏向定制化，与标准化的MOSFET产品不同。 Q10：士兰微在功率半导体领域的业务进展、竞争优势以及当前面临的挑战 是什么？ 从行业角度看，士兰微在功率器件和功率模块方面做得相当出色，其规模和增长速 度均已远超公司。考虑到公司的营收中仅约一半来自功率产品，士兰微在功率领域的领 先优势更为明显。士兰微是一家纯粹的IDM厂商，专注于功率领域。然而，其业务模式 也带来一些挑战：首先，由于不做代工，士兰微无法享受到当前产能紧张所带来的代工 红利，而华虹和公司则能从中受益。其次，士兰微近两年扩张较快，其12英寸晶圆厂 的折旧压力较大，负债率相对较高。相比之下，公司的两座12英寸厂均为参股，因此 折旧压力小，现金流状况更为安全。最后，士兰微的LED业务因市场价格竞争激烈，对 整体业绩造成了一定拖累。 四、出海战略与数据中心 Q11：国内功率半导体厂商是否有可能通过ODM等模式向北美市场供货？目 前的出海进展如何？ 国内厂商目前都在积极拓展海外市场，未来在模块等产品领域存在进入北美市场的 机会。这一趋势的背景是，一方面国内市场前两年竞争异常激烈；另一方面，海外传统 大厂由于AI等高毛利业务的吸引力，正逐渐减少在低毛利功率产品上的投入。国内企 业正在抓住这一机遇出海，例如公司已在香港成立贸易公司以拓展出口业务。目前，仅 从功率产品线来看，公司的出口业务占比已接近20%。 Q12：公司在数据中心和海外客户方面的具体业务进展如何？ 在数据中心领域，公司的相关产品目前仍在验证阶段。在海外业务方面，各类产品 均有涉及。整体来看，若单计功率产品线，目前海外业务的营收贡献占比约为百分之十 几，接近20%。 Q13：请介绍一下目前功率器件各类产品的供货情况以及海外市场的规模？ 第5页目前，部分用于数据中心供电的产品还在验证。常规功率器件，如MOS、超级结、 碳化硅和氮化镓，基本都可以实现批量供货。相对薄弱的环节在于IPM和驱动模块。从 整个市场来看，情况基本相似。海外市场方面，预计2025年规模约为11亿至12亿元。 今年（2026年）情况可能稍好。 五、碳化硅业务发展 Q14：与士兰微相比，公司在碳化硅业务上处于何种水平？其发展历程和当 前面临的挑战是什么？ 公司在碳化硅领域起步较早，大约在2010至2012年就开始布局6英寸产线。由于 国企对投资的严格管控，公司未投建8英寸产线，这在早期碳化硅建厂普遍亏损的阶段 反而使其避免了较大亏损。然而，随着市场发展，原有的6英寸线在成本上已不具备优 势，缺乏8英寸产线已成为其竞争力的一大短板。碳化硅的核心竞争力在于衬底，前段 时间衬底价格大幅下降，为具备成本优势的产品替代IGBT创造了条件。士兰微已经拥 有8英寸产线，而公司的6英寸产线在成本上无法与之竞争。因此，公司可能在考虑将 其碳化硅产品委托外部的8英寸工厂进行代工。这种模式存在一定问题，因为功率器件 的技术含量更多体现在制造工艺而非产品设计端。虽然短期内委外代工能以较好的毛利 率开展业务，但长期来看，代工厂在掌握工艺能力后，可以为任何客户服务，这会为公 司培养出竞争对手，从而影响其长期竞争力。 Q15：与扬杰科技等同行相比，公司在毛利率方面表现如何？差异的主要原 因是什么？ 扬杰科技的毛利率表现不错，而公司则相对较低。这主要是因为扬杰科技在汽车电 子和碳化硅驱动领域的业务占比较高，同时其出海业务占比较高，这些因素共同支撑了 其较好的毛利水平。 Q16：当前碳化硅市场的整体情况如何，尤其是在价格、产能和下游需求方 面？ 碳化硅市场正在放量，同时8英寸产线的产能也在快速建设中，甚至有厂商开始计 划布局12英寸产线，尽管12英寸的碳化硅衬底尚未完全成熟。从价格来看，碳化硅衬 底价格在经历从每片2万元降至2000元的剧烈下跌后，近期已开始企稳回升，这主要 第6页是受终端需求增长的拉动。同时，国家对产能过剩的限制也起到了一定作用。目前，碳 化硅制造端和器件端的竞争压力较大，因为国内众多厂商均具备生产能力，其技术护城 河相对不高。相比之下，衬底环节的技术含量更高，投资衬底端可能相对更为稳妥。 六、下游需求分析 Q17：除AI领域外，当前新能源汽车、风光储等下游领域的需求表现如何？ 与2022年的需求周期有何不同？ 数据中心的需求可能存在周期性，需要关注美国AI发展和国内数据中心的建设情 况。国内数据中心已建设了三四年，需求增速可能将逐步放缓。尽管有观点认为运营商 明年的资本开支将接近翻倍，预示着需求会更加旺盛，但从另一个角度看，许多已建成 的数据中心和算力中心的使用率并未完全饱和。 Q19：在整车厂普遍面临较大经营压力的情况下，为何新能源汽车对半导体 的需求依然旺盛目前需求较好的几个方向主要是 AI 数据中心建设、新能源汽车和储能，其他领域 表现则相对平淡。本轮需求周期与 2022 年有本质区别。此轮周期完全由 AI 驱动，挤占 了部分产能，同时全球大厂为追求高毛利而削减了 8 英寸产线，转向光模块或第三代半 导体等领域。而 2022 年的周期则不同，当时受疫情影响，海外工厂停产，居家办公和 视频会议等需求激增，带动了网络设备、电脑等消费电子产品的全面增长。当前消费电 子领域整体表现疲软，手机等产品换机周期拉长，需求拉动效应不明显。 Q18：对于数据中心未来的需求，似乎存在不同看法，您如何评估其需求的 持续性？ qq1490929960 ？ 尽管车企面临压力，但新能源汽车对传统燃油车的替代趋势非常明确。目前新能源 汽车的渗透率已超过60%，这意味着车企销售的车辆中，超过六成是电动车。此外，电 动车的更新换代速度非常快，这也持续拉动了相关半导体的需求。 Q20：当前储能行业的发展状况如何？ 储能目前属于被动需求驱动型市场，例如数据中心等应用场景会配置储能系统。 第7页七、新洁能与公司业务分析 Q21：新洁能这家公司的发展情况如何，其在功率器件制造领域的竞争力体 现在哪些方面？ 新洁能目前与华虹半导体深度绑定。相较于华虹，新洁能的盈利能力更强。作为民 营企业，新洁能在规模扩张方面反应迅速，具备一定优势。不过，从整个半导体行业来 看，功率器件领域与GPU、存储等领域相比，仍然相对较弱。 Q22：功率半导体行业近期的价格上涨情况如何，这对新洁能这类公司的影 响是怎样的？ 功率半导体整体价格上涨了约20%，但原材料成本也在同步上涨。对于新洁能而言， 由于在2025年市场环境不佳时签订的价格较低，当前价格正在逐步回升。然而，向其 大客户传导涨价存在一定的滞后性，需要经过多轮谈判。以华虹为例，其代工价格上涨 相对温和，并未出现大幅度的夸张上涨。主要原因是华虹正处于产能扩张阶段，为确保 产能利用率，不愿意轻易得罪现有的大客户。 Q23：公司在DriverMOS产品线的业务表现如何，以及公司在光模块领域 的进展情况？ 公司的DriverMOS业务表现一般，该产品线主要由重庆的团队负责，目前已经开 始起量，但对公司的整体营收贡献并不显著。同时，公司也在进行光模块的研发，但距 离实现利润贡献尚需时日。 Q24：公司未来的发展战略和营收目标是怎样的？ 根据规划，公司的目标是在\"十五五\"期间实现300亿元的营收。考虑到内生式增长 并非公司的强项，预计未来将主要通过并购等资本运作方式来实现这一目标。回顾公司 从\"十四五\"到\"十五五\"的规模变化，主要的增长来自于收购重庆中航的工厂，这表明资 本运作是其规模扩张的关键手段。 Q25：在功率半导体领域，哪家公司的产能弹性较大？ 相对而言，华虹的产能弹性可能更大，因为其一直在持续进行产能扩张，扬杰似乎 也在建设新工厂。 第8页Q26：华虹的产能扩张情况及其对新洁能等客户的影响如何？ 华虹的产能正在快速释放，其第四季度产能环比第三季度有显著增长。华虹利用12 英寸晶圆生产功率芯片，在代工效率方面具备显著的竞争优势。尽管如此，由于新产线 的折旧成本较高，华虹自身的盈利表现并不突出。相比之下，公司的折旧压力较小，因 为其在重庆和深圳的两个12英寸项目均是参股形式。 Q27：公司在光芯片领域的业务布局和技术储备情况是怎样的？ 公司正在与几家公司洽谈光芯片业务，目前尚处于项目立项和方案研究的初期阶 段。公司在光芯片领域缺乏现成的产能和技术储备，原有技术体系中不包含硅光、相关 模块及封装技术。虽然在microLED方面有少量基础，但整体而言，需要通过与外部大 学及科研机构合作来推进研发。预计光芯片业务在未来五年内难以实现营收贡献。 八、市场竞争与展望 Q28：如何评估AI数据中心对功率器件市场的增量影响，以及该市场与风 光储、汽车、工业等现有市场的规模和竞争格局？ AI数据中心确实为功率器件市场带来了显著且快速增长的增量需求。然而，由于市 场增长前景明确，吸引了众多参与者涌入，导致竞争日趋白热化。包括闻泰科技在内的 一些公司在逐步恢复并完善其供应链后，也开始重新发力。综合来看，功率器件市场的 景气度周期可能会比晶圆代工市场更早结束，主要原因是产能释放速度过快。 Q29：当前功率半导体市场产能情况如何，是否存在紧缺，未来的产能释放 趋势是怎样的？ 目前8英寸和12英寸产线的确处于紧缺状态。但需要注意的是，此前各厂商投资 扩建的产能正在逐步释放。例如，士兰微自建的12英寸线，以及公司自身的12英寸功 率器件产线均已满载。国内正在建设的12英寸线数量众多，尽管许多尚未完全达产， 但功率器件产线的建设和投产速度相对较快。因此，随着这些新增产能的陆续释放，市 场竞争压力将会加大。 Q30：公司在MEMS传感器业务方面的战略布局、发展现状及盈利情况如何？ 第9页公司已将MEMS传感器业务定位为第三增长极，并为此专门成立了事业部，重点推 动MEMS传感器及红外探测器等产品的研发与市场拓展，投入力度较大。尽管当前MEMS 市场热度很高，但盈利状况并不理想。以公司自身的业务为例，南昌的MEMS工厂目前 仍处于亏损状态，无锡工厂的状况相对较好。 Q31：从公司整体业务结构来看，不同业务板块的盈利能力和市场前景有何 差异？ 从当前业绩来看，8英寸晶圆代工板块是公司盈利能力最强的业务。12英寸代工业 务的客户需求也十分旺盛，表现良好。相比之下，功率器件业务面临的市场压力较大。 从投资角度看，晶圆代工业务虽然初期会受到折旧影响导致毛利率不高，但一旦折旧完 成，其盈利能力相对稳定。例如，华虹在完成此轮12英寸产线扩张后，短期内可能不 会再有大规模扩产计划。 Q32：对于功率半导体市场，为何持相对悲观的看法，尤其是在当前产品似 乎正在涨价的背景下？ 尽管功率半导体市场存在涨价现象，但其毛利率表现非常差。低毛利率反映了市场 的真实状况：虽然产品用量很大，但盈利能力弱。这表明市场普遍认为这类产品是必需 品，却不愿意给予高溢价，产品同质化严重，客户可以在多家供应商之间选择，最终导 致价格竞争。这种商业模式类似于光伏产业，虽然中国光伏产业全球领先，但行业内企 业普遍亏损。 Q33：从需求端来看，2027年AI、汽车、储能及家电等领域的增长前景如 何？ 展望2027年，汽车市场的需求可能接近饱和。尽管当前由于传统燃油车企向新能 源转型，新能源汽车的渗透率已达到60%至70%，增长势头看似不错，但长期来看，市 场将逐渐见顶。未来国内车企可能会迎来一轮整合，不过由于许多车企涉及地方政府投 资，这个过程可能需要时间。汽车行业整体的毛利率很差，盈利能力不佳的生意难以持 续，这与国内白电行业毛利无法提升的困境相似。半导体行业中，目前存储是景气度较 高的领域，但即便是存储，DDR4等产品也已不紧缺，价格上涨乏力。当前真正紧缺的 是GPU等少数产品，其供应链尚未完全满足市场需求。数据中心和运算中心的需求是关 键，但根据预测，存储市场的需求到2027年下半年也可能出现回落。 第10页Q34：当前新一轮涨价在不同业务板块和下游客户中的接受度有何差异？ 从当前新一轮涨价的执行情况来看，功率半导体产品涨价面临较大阻力，而晶圆代 工业务的涨价客户接受度则相对较高，因为在产能紧张的情况下，不接受涨价就意味着 被淘汰。在功率半导体的下游应用中，消费电子领域的客户完全无法接受涨价。因此， 公司正在进行产品线转型，将资源向高毛利产品倾斜。 Q35：市场有观点认为中低压MOSFET最为紧缺，尤其是SGTMOSFET，其背 后的驱动因素是什么？ SGTMOSFET的紧缺主要是由其优越的性能（如结电容等参数）以及下游新兴应用的 需求驱动的。具体而言，服务器电源需要用到25V至100V的SGTMOSFET。此外，汽车 电子领域的车载充电器、电机驱动、电源管理以及逆变器等也都在大量采用SGTMOSFET。 Q36：功率半导体大范围涨价是否现实？不同下游领域对价格上涨的承受能 力有何差异？ 目前看，功率半导体大范围涨价并不现实，只能在部分紧缺的细分领域实现。例如， 汽车电子用的高压器件、SGTMOSFET等产品，客户对涨价的承受能力尚可。这最终取 决于下游生意的毛利率，毛利好的行业自然能承受上游成本的增加。汽车行业之所以能 接受芯片涨价，是因为芯片在整车BOM成本中的占比较低，一颗MOSFET的价格即使上 涨，对几十万元的整车成本影响微乎其微，远不及GPU或FPGA等高端芯片。相比之下， 消费电子领域对涨价的抵制情绪最为强烈，传统常规的MOSFET产品在消费领域完全涨 不动。 Q37：公司在常规MOSFET产品线的业务占比情况如何？ 公司在常规MOSFET，特别是40V以下的中低压MOSFET产品线，出货量位居国内第 一，该业务占公司自有产品业务比重高达40%至50%。这也是导致公司功率半导体业务 整体毛利率不高的一个原因。 Q38：综合来看，在功率半导体领域，如何评价公司与士兰微、新洁能等同 行的竞争力，以及公司未来的发展战略？ 在功率半导体领域，士兰微的表现可能会比公司稍好，但公司的晶圆代工业务板块 优于他们。士兰微的增长势头确实不错，如果能剥离其拖累业绩的LED业务，专注于功 第11页率半导体，未来可能成为一个非常强大的公司。新洁能和扬杰科技近两年的增长也十分 迅猛。对于公司而言，当前最大的不确定性在于是否会进行资本并购。当前并购价格可 能偏高，预计在\"十五五\"期间，公司可能会在合适的时机收购一些业务，以寻求发展机 会。", "status": "extracted"}, "post:2026-10-15T08-49:82e9ac9d2c4c": {"id": "post:2026-10-15T08-49:82e9ac9d2c4c", "kind": "post", "title": "2026-10-15 08:49", "source_label": "帖子正文", "excerpt": "📑高盛‑嘉利国际（1050.HK，未覆盖）：工厂及 CEO 调研‑GPU 与 ASIC AI 服务器机箱业务进展；全球产能扩张持续推进 #外资观点# 🔍我们近期走访了嘉利国际（1050.HK，未覆盖）位于东莞的工厂，并与该公司首席执行官、首席财务官开展交流。", "content": "📑高盛‑嘉利国际（1050.HK，未覆盖）：工厂及 CEO 调研‑GPU 与 ASIC AI 服务器机箱业务进展；全球产能扩张持续推进 #外资观点# 🔍我们近期走访了嘉利国际（1050.HK，未覆盖）位于东莞的工厂，并与该公司首席执行官、首席财务官开展交流。 📈管理层对公司未来增长前景保持乐观，增长驱动力来自 GPU、A ation constitutes investment advice to the recipient or otherwise purports entirety and not draw inferences or conclusions from the rating alone. By receiving this document, the recipient acknowledges and agrees with the intended is suggesting that the recipient or any other person take a specific course of action or any action at all. The recipient should carefully read this document in its Investments involve risks, and investors should exercise pru", "status": "extracted"}, "post:2026-10-15T22-55:f76a264f8205": {"id": "post:2026-10-15T22-55:f76a264f8205", "kind": "post", "title": "2026-10-15 22:55", "source_label": "帖子正文", "excerpt": "瑞银——存储半导体跟踪——担忧之墙是否合理？瑞银认为，当前存储板块自9月高点回调约19%，几乎回吐至7月低点，这主要反映市场对短期供需的过度担忧。", "content": "瑞银——存储半导体跟踪——担忧之墙是否合理？ 瑞银认为，当前存储板块自9月高点回调约19%，几乎回吐至7月低点，这主要反映市场对短期供需的过度担忧。然而，从基本面看，CXMT（长鑫存储）潜在的4F2垂直沟道晶体管（VCAT）DRAM技术推进不构成行业供给威胁；HBM（高带宽内存）因服务器DDR5及SSD需求超预期而被动\"降规\"（de-specing），实为需求结构优化的体现；三星正加速DRAM产能扩张，但新增供给在2028年晚些时候前难以实质冲击供需平衡。当前覆盖标的（除CXMT外）2027-2030年预期平均自由现金流收益率高达29%，估值具备显著吸引力。瑞银维持对存储板块的全面看多立场，首选标的为\"关键买入\"评级的三星电子，并对所有覆盖股票维持\"买入\"评级。 CXMT的4F2 VCAT：技术路径差异而非供给冲击 CXMT总裁近期表示将在年底前\"推出\"4F2 VCAT DRAM，但\"推出\"含义模糊，瑞银判断更可能是研发或送样阶段，而其6F2 G5（1a纳米级）制程的量产要等到2027年。4F2 VCAT可在不改变光刻半间距的前提下较6F2提升约50%的位密度，但后续节点仍需更小的半间距和更先进的光刻。该技术还面临沉积（ALD）和选择性外延等独特挑战。作为参照，三星预计2027年完成1d纳米6F2量产，随后在2028年末才目标导入0a纳米级4F2 VCAT。DRAM工艺技术走差异化路径通常需要至少三代工艺迭代才能最大化效率与性能，这可能意味着向3D DRAM的转型晚于预期，而3D DRAM最终将消除DRAM制造对EUV光刻的需求——这才是更值得关注的产业分岔点。 HBM\"降规\"持续：服务器DDR与SSD需求强劲驱动 瑞银调研显示，受智能体AI推理部署推动，DRAM厂商持续收到2027年服务器DDR5的追加订单。同时，英伟达（Vera CPU）的SOCAMM订单在过去两个月显著增强，2027年需求现已超过500亿Gb，这一规模已超过PC与GDDR DRAM的总位消耗。此消彼长之下，HBM出货量承压，瑞银预计2027年HBM位出货量同比增速仅约49%，HBM降规因而具有\"不可避免性\"。具体规格方面：英伟达VR300预计采用HBM4 8层堆叠（后续升级至HBM4E）；Feynman架构可能采用HBM4E 8层或12层；TPU v9亦将跟进；部分以推理为中心的ASIC则可能仅采用4层堆叠。HBM降规的一个连锁反应是对NAND需求的提振——因KV Cache及英伟达CMX等应用需要更多NAND，近期NAND订单已明显回升。 三星产能扩张加速：2028年前供给冲击有限 瑞银近期再次上调三星资本开支预测。预计三星DRAM产能将从2026年四季度的每月70万片晶圆增至2027年四季度的82万片（净增12万片），主要驱动力为P4工厂完成爬坡及P5-1于2027年7月开始搬入设备。2028年，三星可能在P5-1一个洁净室启动爬坡的同时，前一间仍在搬入设备，并/或对P2/P3进行瓶颈突破，这意味着即使在P5分配部分NAND产能的情形下，三星2028年DRAM产能仍可能增加逾15万片/月。但瑞银强调，这一增量在2028年晚些时候之前不会对行业供需产生实质性影响。 估值与投资策略：回调即布局良机 存储类股票自9月峰值已回落19%，瑞银认为这应倒逼存储企业加大股东回报力度。当前覆盖标的（除CXMT外）2027-2030年预期平均自由现金流收益率达29%，板块风险收益比极具吸引力。瑞银重申首选买入三星电子，并对所有覆盖股票维持\"买入\"评级。 HBM需求与供给量化追踪 • 需求端：2026年HBM总需求预计为40.21亿Gb（同比增长84%），2027年跃升至76.90亿Gb（同比增长91%）。英伟达平台（含B200/B300/GB200/GB300/R200/R300/VR200/VR300等）占据需求主导，AMD MI系列及谷歌TPU亦贡献可观增量。HBM3E向HBM4的代际切换将在2027年加速，推动ASP从2026年的1.75美元/Gb升至2027年的3.14美元/Gb。 • 供给端：2026年全球HBM位供给预计36.64亿Gb（同比增长70%），2027年54.58亿Gb（同比增长49%）。SK海力士维持领先，2026/2027年位份额约29.6%/30.4%；三星追赶势头强劲，2026/2027年供给位同比暴增164%/96%，份额从2026年的31.1%升至2027年的41.0%；美光份额稳定在约23%；CXMT虽增速迅猛（2026/2027年供给位同比+130%/+232%），但基数极小，2027年份额仅约0.7%，对全局影响微乎其微。 DRAM整体供需与价格展望 • 供需平衡：2026年DRAM行业供给位约3998.21亿Gb（同比+27.6%），需求（含库存调整）约4325.98亿Gb（同比+34.8%），充足率（Sufficiency Ratio）为-7.6%，显示供给显著偏紧。2027年充足率预计为-5.0%，紧平衡延续。 • 价格：2026年综合ASP（含HBM）预计为1.66美元/Gb（同比+246.8%），2027年2.42美元/Gb（同比+45.1%）。DDR ASP将从2026年的1.66美元/Gb升至2027年的2.33美元/Gb。HBM ASP因规格升级，2027年跳升至3.14美元/Gb（同比+79.8%）。 • 资本开支与产能：2026年行业晶圆出货量约192.2万片/月（12英寸等效，同比+7.7%），2027年升至212.7万片/月（同比+10.7%）。三星、SK海力士、美光三强主导，CXMT产能占比从2025年的约5.4%缓升至2027年的约9.0%。 主要风险 包括：AI服务器GPU/加速器出货不及预期；HBM降规幅度超预期或进度延迟；中国存储厂商技术突破与产能释放快于预期；下游客户库存调整幅度大于预期；宏观经济走弱压制消费电子与服务器需求；地缘政治与出口管制升级；NAND市场复苏不及预期。#文字观点", "publish_time": "2026-10-15 22:55", "tags": ["文字观点"]}, "attachment:files/万联证券-9月贸易数据点评：进出口增速上行，AI、价格为主要拉动-261014.pdf": {"id": "attachment:files/万联证券-9月贸易数据点评：进出口增速上行，AI、价格为主要拉动-261014.pdf", "kind": "attachment", "title": "万联证券-9月贸易数据点评：进出口增速上行，AI、价格为主要拉动-261014", "source_label": "万联证券", "excerpt": "第1页 / 共13页 本报告版权属于中原证券股份有限公司 www.ccnew.co m 请阅读最后一页各项声明 医药 分析师：张蔓梓 登记编码： S0730522110001 zhangmz@ccnew.com 0371 -86537085 行业跑赢对标指数，国产白蛋白批签发占 比提升 ——医药行业月报", "content": "第1页 / 共13页 本报告版权属于中原证券股份有限公司 www.ccnew.co m 请阅读最后一页各项声明 医药 分析师：张蔓梓 登记编码： S0730522110001 zhangmz@ccnew.com 0371 -86537085 行业跑赢对标指数，国产白蛋白批签发占 比提升 ——医药行业月报 证券研究报告 -行业月报 强于大市 (维持) 盈利预测和投资评级 公司简称 25EPS 26EPS 26PE 评级 药明康德 6.70 7.63 21.04 增持 羚锐制药 1.34 1.53 12.18 增持 安图生物 1.87 2.10 than 60 drug developers. Some pipeline products are expected to reach commercialization in 2027 and the company forecasts revenue of approximately $300-400mn by 2030. At the time of the acquisition, Forge was positioned as a Tier 3 player in the gene therapy contract development and manufacturing organization (CDMO) market. However, with its top-line growth oupacing that of its competitors over the past several years, its market share has improved to the Tier 1 level. Strengths are its overwhelming productivity and technological capabilities allowing a broader range of applications What stood out was the high level of productivity. The combination of Forge's proprietary technology and manufacturing platform with Ajinomoto’s AminoScience allows allows the company to achieve adeno-associated virus vector (AAV) manufacturing yields 6-22X the industry average. Gene therapies often target rare diseases, but Forge's proprietary technology, which enables the delivery of high- molecular-weight payloads, appears capable of expanding the scope of application to include common diseases. If the scope broadens, Forge could become a leading player in the gene therapy CDMO market. Ajinomoto’s backing also provides advantages in terms of financing and global raw material procurement. Greater customer confidence in placing orders also appears to be contributing to order growth. If successful, it could develop into a business similar to ABF. Forge aims to achieve profitability on an EBITDA basis in 2026, although we estimate an OP loss of $20-30mn. The company commented that it targets a business profit margin of at least 20% for the overall CDMO business, including small molecules and oligonucleotides, in 2030. Working backward from this, we believe they are likely able to target an OP margin of at least close to 30% for Forge alone. The company also commented that it expects from 2030 to benefit from economies of scale as the proportion of commercial production increases, with mana 制中国混动车型对欧盟出口的保障措施有效期最长可达四年，但该措施在 2027 年下半年之前不太可能完全落地生效。 💶混动车型也或将纳入价格承诺机制，定价参照欧盟到岸价格加关税标准，这会抹平中国混动车型原有的价格优势。 📋中国正对本国出口公司施加更强的政策引导：要求公司完成注册后 180 天内取得出口授权，遏制无序低价出口行为，同时将增值税出口退税率下调 4 个百分点至 9%。 ⚠️上述政策会挤压规模较小以及灰色渠道参与者的生存空间，而海外本地化生产则可以规避该类监管冲击。 🏭本地化生产是最终发展方向，但跨境合规管理才是瓶颈，而非技术层面。📉需求走弱放大了行业风险：2026 年 1‑9 月国内乘用车零售销量同比下滑 22.4%；受宏观经济疲软影响，预计国内车市低迷态势还将持续两年；新能源汽车出口增速已经放缓至 11%。 🔑中美贸易关系若出现缓和，将是行业向上的关键变量。 📈股票层面观点：行业公司之间利润率分化将会进一步拉大，但行业环境更利好准备充分的公司。 ✅我们看好比亚迪、吉利以及上汽，上述公司拥有海外工厂，同时混动产品矩阵实力雄厚；规模不足的出口公司在 2027 年之前面临最大的经营压力。#文字观点", "publish_time": "2026-10-15 12:53", "tags": ["文字观点"]}, "post:2026-10-15T17-12:e7c78dd6c4f0": {"id": "post:2026-10-15T17-12:e7c78dd6c4f0", "kind": "post", "title": "2026-10-15 17:12", "source_label": "帖子正文", "excerpt": "📑【OCP 2026 第二天会议要点：Scale-up 光学、CPO/NPO、CXL 内存成为核心主线】我们在圣何塞参加 OCP 2026 大会第二天的主题演讲与技术分会场，参会企业包含 CRDO、ALAB、MSFT、ORCL、META、三星等厂商。在首日围绕机架级规模化计算的主题基础上，第二天重点", "content": "📑【OCP 2026 第二天会议要点：Scale-up 光学、CPO/NPO、CXL 内存成为核心主线】我们在圣何塞参加 OCP 2026 大会第二天的主题演讲与技术分会场，参会企业包含 CRDO、ALAB、MSFT、ORCL、META、三星等厂商。在首日围绕机架级规模化计算的主题基础上，第二天重点内容包括四点：1）近封装光学（NPO）进入落地部署阶段，规模化光学方案向 1000 个以上 XPU 拓展；2）内存层级体系突破 HBM 范畴源头内容加微wuxl3408，延伸至 CXL、SSD 支撑的 KV 缓存以及 HBF；3）供电架构从约 100 千瓦机架逐步演进至 1 兆瓦 + 方案，后续还会推出基于固态变压器的设计；4）横跨机架启动、固件更新、遥测、供电与散热的开放安全控制平面，也就是 LSCC/AMI 提出的 SCMP 规范。 ✨规模化 NPO：从路线图规划走向量产落地📌随着 100G+ SerDes 铜缆传输距离缩短至 1-3 米，叠加规模化场景向 1000 个以上 XPU 拓展，NPO 技术已经进入落地应用阶段。 📌阿里巴巴表示 3.2T NPO 方案现已投产部署，6.4T 版本正在验证，12.8T NPO/IPO 处于早期研发阶段。 📌腾讯计划在 2026 年第四季度开展 3.2T 试点项目；甲骨文介绍了基于 LPO 的 800G NPO 方案，以及 1.6T 的 LRO 型 NPO 方案。 📌对比可插拔光模块，NPO 可以提升功耗与密度指标，同时降低装配故障概率。 📌Meta 举例说明，在一款基于 16W 重定时 5nm SerDes 的可插拔模块中，仅 400G SerDes 部分就会消耗 6 瓦功率。 📌对比能效更高的 IPO/CPO 方案，NPO 制造难度更低，支持多供应商供货，减少厂商锁定效应，最终有利于技术落地推广。 📌光学领域重要厂商发布动态：MRVL、CRDO、ALAB、LITE📌在 OCP 大会上，MRVL 推出 1.6T 重定时光模块，支持单通道 400G PAM4，连接方案覆盖有源铜缆到光互联；产品矩阵还包含驱动芯片、TIA、SerDes 以及 1.6T/6.4T SiPh 引擎，可拓展适配搭载 CPO 的定制化 XPU。 📌CRDO 管理层在会议中提到，ZeroFlap 光学产品的出货规模有望达到 AEC 业务的数倍，ALC 业务体量可以看齐 AEC 业务，盲插光学背板技术有望打开更大规模的规模化光学市场空间。 📌ALAB 管理层介绍方案规划，将光学驱动芯片 / TIA 与合作方的 SiPh/VCSEL 引擎搭配，推出 Scorpio 交换机与 COSMOS 软件；未来 Scorpio 相关内容的单 XPU 价值有望突破 1000 美元（不含光学器件）。 📌LITE 展示了基于 1060nm VCSEL 的 PCIe-over - 光学链路，采用 ALAB 的 Scorpio 方案与康宁光纤；后续分会场将聚焦可落地的外激光 CPO、慢带宽大尺寸 12.8T VCSEL 架构以及零接触 OCS 光交换网络。 🧠内存层级超越 HBM：CXL DRAM、SSD、HBF📌为满足长推理上下文窗口带来持续增长的内存带宽与容量需求，智能体 AI 正在将内存方案从 HBM 向外拓展，包含三类方向：1）CXL 直连 DRAM；2）SSD 承载的 KV 缓存存储；3）HBF。 📌三星展示 CXL 内存方案，对比 RDMA，实现 2 倍 QPS 提升、3 倍更快的 TTFT；其 SSD 路线图推出搭载 256TB E3.S QLC 硬盘的低温 KV 缓存方案。 📌SK 海力士将 HBF 定位成 HBM 与 SSD 之间全新 NAND 存储层级，容量约为 HBM 的 14 倍，带宽为 HBM 的一半，源头内容加微wuxl3408单堆叠最高可达 512GB，带宽区间约 0.4 至 3TB 每秒。 📌SK 海力士同时展示基于 CXL 的 MARS 架构，在机架内聚合多片内存，将扩容后的 KV 缓存放置在 GPU 显存之外；相比重新计算，TTFT 速度提升 3 至 5 倍。#文字观点", "publish_time": "2026-10-15 17:12", "tags": ["文字观点"]}, "post:2026-10-15T19-44:1f919d822e10": {"id": "post:2026-10-15T19-44:1f919d822e10", "kind": "post", "title": "2026-10-15 19:44", "source_label": "帖子正文", "excerpt": "OCP 第二日模拟与功率半导体要点👥我们出席了加利福尼亚州圣何塞举办的 OCP 大会第二日活动，并且与 ALAB、MPWR、Ferric 半导体开展会谈，下面总结三项核心观点。⚡第一，随着机柜功率需求向约 600 千瓦提升，800 伏直流侧挂电源架构更有可能在 2027 年下半年开始落地应用，该判断", "content": "OCP 第二日模拟与功率半导体要点👥我们出席了加利福尼亚州圣何塞举办的 OCP 大会第二日活动，并且与 ALAB、MPWR、Ferric 半导体开展会谈，下面总结三项核心观点。 ⚡第一，随着机柜功率需求向约 600 千瓦提升，800 伏直流侧挂电源架构更有可能在 2027 年下半年开始落地应用，该判断与我们此前预期保持一致。📦第二，各家公司将在 2026 年第四季度至 2027 年第一季度开展集成稳压器（IVR）方案的样品测试，目前已经有小批量出货的情况。🤖第三，随着人工智能集群采用更高光模块密度以及机柜级液冷方案，我们预计单系统模拟芯片价值量将会提升，利好我们重点给予买入评级的模拟芯片标的 TXN、ADI 以及 MPWR，可参考我们 OCP 大会首日的要点纪要。🔌800 伏直流技术将在 2027 年下半年大规模落地：当前机柜功率约 230 千瓦，还未到必须采用 800 伏直流侧挂架构的阶段。随着机柜功率需求向约 600 千瓦提升，800 伏直流侧挂电源架构更有可能在 2027 年下半年开始落地应用，和我们此前预期一致。 🔋氮化镓与碳化硅均被用于功率转换场景，碳化硅更多应用在高压场景，谷歌在下一代架构的应用方面处于领先地位。 📈集成稳压器（IVR）2027 年逐步获得关注，大规模放量在 2027 年下半年之前难以实现。🧪各家公司将在 2026 年第四季度至 2027 年第一季度开展集成稳压器（IVR）方案的样品测试，目前已经出现小批量出货。 ⏱我们认为集成稳压器难以在 2027 年下半年之前实现大规模放量。 🤝由于芯片、基板以及印刷电路板生态之间需要深度联合开发，一旦集成稳压器方案完成设计导入，将会稳固对应供应商的行业地位。 ✅我们认为 MPWR 以及完成对 Empower 半导体收购的 ADI 最有能力把握集成稳压器带来的行业机遇。 💡网络光模块与液冷拓展模拟芯片市场空间：可插拔光模块、NPO、CPO、交换机、OCS 都需要额外的电源管理、时序、传感、监测、控制以及信号链相关芯片器件。 ❄液冷架构会新增温度、压力、流量、泄漏检测、遥测以及电源管理类集成电路。 📊随着人工智能集群采用更高光模块密度与机柜级液冷方案，我们预计单系统模拟芯片价值量将会提升，利好 TXN、ADI、MPWR。🔍微芯科技（MCHP）逐步切入下一代人工智能机柜电源架构赛道。 📅10 U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-15T10-11:39ed402acc56": {"id": "post:2026-10-15T10-11:39ed402acc56", "kind": "post", "title": "2026-10-15 10:11", "source_label": "帖子正文", "excerpt": "长鑫科技发布新型技术架构 海外龙头垄断壁垒面临重估 10月15日｜国产存储龙头长鑫科技发布新型技术架构，全球存储龙头股价近期明显回调。", "content": "长鑫科技发布新型技术架构 海外龙头垄断壁垒面临重估 10月15日｜国产存储龙头长鑫科技发布新型技术架构，全球存储龙头股价近期明显回调。10月13日，三星电子、SK海力士跌幅超过7%，10月14日跌幅收窄企稳。业内人士向证券时报记者分析，国际存储巨头暴跌，短期是交易层面的情绪超调，长期来看反映了市场对其垄断壁垒的重估，而未来服务器市场会面临分化。报道显示，10月10日，长鑫科技总裁曹堪宇博士在第四届集成芯片和芯粒大会上公布公司在DRAM器件、4F^[2]架构及混合键合等方向进展，并预计年底推出融合新技术的新一代DDR5 RDIMM产品。相比DRAM行业主流6F^[2]架构，4F^[2]意味着每个单元仅占4倍最小特征尺寸的平方，因此单位面积内的晶体管数量会增多，实现存储密度的提升。该技术最核心的特色是在DRAM存储阵列晶体管上的创新，即自研的VSG（Vertical Surrounded Gate）晶体管。#文字观点", "publish_time": "2026-10-15 10:11", "tags": ["文字观点"]}, "post:2026-10-15T12-51:1c06e82d8878": {"id": "post:2026-10-15T12-51:1c06e82d8878", "kind": "post", "title": "2026-10-15 12:51", "source_label": "帖子正文", "excerpt": "野村——亚洲半导体与科技——长鑫科技（CXMT）近期4F2技术进展的影响 一、事件概述：长鑫披露4F2架构DDR5 RDIMM路线图 10月10日，在第四届集成芯片与芯粒大会上，长", "content": "野村——亚洲半导体与科技——长鑫科技（CXMT）近期4F2技术进展的影响 一、事件概述：长鑫披露4F2架构DDR5 RDIMM路线图 10月10日，在第四届集成芯片与芯粒大会上，长鑫科技（CXMT，688825 CH，买入）总裁曹堪宇披露了下一代DRAM单元架构（4F2）的进展，预计年底前推出采用4F2架构并结合晶圆级混合键合（wafer-level hybrid bonding）的DDR5 RDIMM产品。该技术核心在于垂直环绕栅极（VSG）晶体管——沟道垂直排布，栅极环绕沟道，可改善栅控能力，缓解漏电与短沟道效应，同时缩减单元平面面积。在1T1C结构中，F为最小特征尺寸，从行业标准的6F2迁移至4F2架构可使单元面积缩减约33%，单位面积容纳的单元数量提升约50%。此外，该技术将阵列与外围CMOS解耦至不同键合晶圆上，再通过晶圆对晶圆（WoW）混合键合集成。 二、实际产能增量测算：理论值50%，实际约40%，量产推迟至2027-28年 尽管理论上4F2可提升约50%的单元密度，但考虑到以下现实约束，野村估算实际单片晶圆单元增量约40%，且今年底前大概率仅为送样或试验性产品，量产需等到2027-2028年： 1. 将CMOS移至另一晶圆叠加6F2→4F2迁移，单元晶圆的单片单元数可增加约150%； 2. 但需额外一片晶圆及专用产线用于CMOS外围电路，导致净产能收缩（单元晶圆产能减少，CMOS产能因无需最先进制程而增加；综合估算净产能收缩约30%）； 3. 单元重新设计导致良率下降（两片晶圆键合综合良率约80%）； 4. 缺乏先进光刻系统，微缩能力受限。 三、对存储竞争格局的影响：技术代差仍至少维持三年 三星（005930 KS，买入）与SK海力士（000660 KS，买入）已做出战略性选择，不优先推进6F2→4F2迁移，而是聚焦基于EUV的制程路线，后者具备更高效率、更低成本及更优良率。4F2架构要求DRAM单元结构根本性重构，晶体管由水平转为垂直取向，需高深宽比柱状结构及精密间隙填充，将当前光刻与刻蚀能力推向极限。鉴于长鑫在生产节点上的滞后，物理与技术挑战使其短期内难以缩小与韩系厂商的差距。 • 韩系厂商路线图：1c nm（2025）→1d nm（2027）→4F2 v1（2028）→4F2 v2（2030）→3D DRAM（2032）。 • 长鑫预计路线图（按初始量产时间）：G4 1z nm（2024）→G4.5 1z-1a nm（2025）→G5 1a nm（2026）→G5 1a nm 4F2（2027-28）→G6（2028-29）。 两者对比可见，长鑫与全球领先者之间仍存在至少三年的技术代差。 四、对中国产能扩张与半导体设备的启示：本土设备商直接受益 4F2/混合键合流程在国产设备商已获份额的环节进一步提升每片晶圆加工强度，包括： 1. 更多介电层、阻挡层及键合介电质（PECVD/ALD）； 2. 更高深宽比刻蚀； 3. 键合前原子级平坦化（CMP）； 4. 额外的铜/钽/钴金属化。 同时，外围CMOS与单元阵列解耦至不同晶圆，需额外产线（一片变两片）。野村认为最直接受益标的为： ◦ 拓荆科技（Piotech，688072 CH，买入）：受益于PECVD及Dione 300晶圆对晶圆混合键合设备需求，该设备为阵列/CMOS解耦所必需； ◦ 中微公司（AMEC，688012 CH，买入）：受益于高深宽比刻蚀（国内60:1已成标准，90:1接近市场水平），并通过收购杭州中贵（未上市）将产品线拓展至CMP。 五、重点标的估值与目标价（野村口径） • 长鑫存储（688825 CH）：目标价116元人民币，基于20倍2028年预期EPS（5.8元）。因市场份额提升及中国市场对估值溢价的支撑，给予其两倍于美光（历史5年约10倍PE）的估值倍数。基准指数为沪深300。 • 拓荆科技（688072 CH）：目标价913元人民币，基于20倍前瞻EV/Sales及2027年营收预测。 • 中微公司（688012 CH）：目标价480元人民币，基于20倍EV/Sales及2027年营收预测，反映其在刻蚀领域的优势、高于市场的销售增速及份额持续提升。 • SK海力士（000660 KS）：目标价470万韩元，基于6.0倍目标PB与12个月前瞻每股净资产（836,330韩元）。 • 三星电子（005930 KS）：目标价67万韩元，基于4.3倍目标PB与12个月前瞻每股净资产。 六、主要下行风险 • 长鑫：终端需求恶化、国内同业（如长江存储）竞争加剧、CPU等IC及组件供应不足、中美地缘政治紧张升级。 • 设备商：中国晶圆厂产能扩张不及预期、市场份额提升放缓、海外客户替代、竞争加剧、美日荷设备出口管制放松。 • 存储巨头：美国半导体产品潜在关税、电力短缺导致数据中心建设延迟、高利率环境下AI资本开支放缓。#文字观点", "publish_time": "2026-10-15 12:51", "tags": ["文字观点"]}, "post:2026-10-15T20-06:d9581d231ccf": {"id": "post:2026-10-15T20-06:d9581d231ccf", "kind": "post", "title": "2026-10-15 20:06", "source_label": "帖子正文", "excerpt": "A股增持潮来了 1、新易盛：控股股东提议回购8亿至10亿元A股股份 股权激励或员工持股计划 2、天孚通信：控股股东提议1亿元至1.5亿元回购A股股份 3、佰维存储：控股股东提议回购", "content": "A股增持潮来了 1、新易盛：控股股东提议回购8亿至10亿元A股股份 股权激励或员工持股计划 2、天孚通信：控股股东提议1亿元至1.5亿元回购A股股份 3、佰维存储：控股股东提议回购2亿元至2.5亿元A股股份用于注销并减少注册资本 4、沪电股份：控股股东提议2026年度现金分红不低于22亿元 5、温氏股份：董事长提议回购5000万至1亿元股份用于股权激励。#文字观点", "publish_time": "2026-10-15 20:06", "tags": ["文字观点"]}, "post:2026-10-15T20-10:310409aea73d": {"id": "post:2026-10-15T20-10:310409aea73d", "kind": "post", "title": "2026-10-15 20:10", "source_label": "帖子正文", "excerpt": "【天孚通信：拟以人民币1亿元-1.5亿元回购公司股份】天孚通信公告，控股股东苏州天孚仁和投资管理有限公司提议公司以自有或自筹资金通过集中竞价交易方式回购股份，回购资金总额不低于人民", "content": "【天孚通信：拟以人民币1亿元-1.5亿元回购公司股份】天孚通信公告，控股股东苏州天孚仁和投资管理有限公司提议公司以自有或自筹资金通过集中
