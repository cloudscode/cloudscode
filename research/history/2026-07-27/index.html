sh_time": "2026-07-27 07:35", "tags": ["2%", "小米MiMo-V2", "Step_3", "7_Flash", "文字观点"]}, "post:2026-07-27T07-37:8bee186e0eb1": {"id": "post:2026-07-27T07-37:8bee186e0eb1", "kind": "post", "title": "2026-07-27 07:37", "source_label": "帖子正文", "excerpt": "【财通唐佳】海外存储原厂放弃及缩减#自研CXL控制器，利好澜起科技、聚辰股份需求成长 CXL是面向AI算力时代的高速互联标准，核心解决内存墙痛点：传统服务器CPU只能搭载固定容量本地DDR5内存，AI大模型推理、KV Cache场景内存利用率仅50%-65%，硬件浪费严重。CXL总线实现内存池化，算", "content": "【财通唐佳】海外存储原厂放弃及缩减#自研CXL控制器，利好澜起科技、聚辰股份需求成长 CXL是面向AI算力时代的高速互联标准，核心解决内存墙痛点：传统服务器CPU只能搭载固定容量本地DDR5内存，AI大模型推理、KV Cache场景内存利用率仅50%-65%，硬件浪费严重。CXL总线实现内存池化，算力节点可外挂独立内存扩展池，整机按需弹性调用内存，大幅降低数据中心硬件总成本。 从产业趋势看，#2026年是CXL规模化部署的起点，#预计到2027年将进入CXL规模商用的元年。 1️⃣‼️边际变化：据韩国媒体报道，近期#三星电子、SK海力士和美光科技均已缩减或放弃CXL控制器的自研商业化计划。 其中，美光已关闭自研部门并采用PrimeMass的方案；SK海力士终止了自研项目，团队转向PIM（存内计算）领域；三星则将自研控制器从商业化路线图中移除，仅保留前沿研发。 2️⃣澜起科技、聚辰股份直接受益于此‼️ 由于存储原厂放弃了自研控制器的商业化计划，而CXL技术又是原厂共识，因此外采购专业芯片设计公司的产品成为最优解决方案，#因此澜起科技、聚辰股份等独立芯片设计公司有望直接受益#文字...", "publish_time": "2026-07-27 07:37", "tags": ["文字观点"]}, "attachment:files/Nomura-CXMT 国产 DRAM 龙头企业；首次给予买入评级 ChangXin Memory Technologies The DRAM in the Chinese crown; initiate at Buy.pdf": {"id": "attachment:files/Nomura-CXMT 国产 DRAM 龙头企业；首次给予买入评级 ChangXin Memory Technologies The DRAM in the Chinese crown; initiate at Buy.pdf", "kind": "attachment", "title": "Nomura-CXMT 国产 DRAM 龙头企业；首次给予买入评级 ChangXin Memory Technologies The DRAM in the Chinese crown; initiate at Buy", "source_label": "Nomura", "excerpt": "EQUITY: TECHNOLOGYChangXin Memory Technologies 688825.SS 688825 CHGlobal Markets Research 27 July 2026 The DRAM in the Chinese crown;initiate at Buy CXMT should continue to gain ma", "content": "EQUITY: TECHNOLOGYChangXin Memory Technologies 688825.SS 688825 CHGlobal Markets Research 27 July 2026 The DRAM in the Chinese crown; initiate at Buy CXMT should continue to gain market share as global supply of memory could remain tight Initiate coverage at Buy with and a TP of CNY116 We initiate coverage of CXMT – China’s largest DRAM maker – at Buy with a TP of CNY116. We expect CXMT’s market share gain to accelerate considering that the global supply of memory is unlikely to ease in the coming years. Supported by capacity expansion, node migration, and ASP hikes, we forecast CXMT to post 63%/74% sales/net profit to parent CAGRs in 2026-28F. Our TP of CNY116 is based on 20x 2028F EPS of CNY5.8. We assign a 20x target P/E multiple as we expect CXMT to trade at 2x the valuation of its major US competitor, Micron ([MU US, Not rated]; which has traded at ~10x over the past five years), owing to market share gains and the higher valuation multiples in China’s market. Downside risks include: 1) worsening of end demand; 2) intensifying competition from domestic peers such as YMTC (unlisted); 3) insufficient supply of IC and components (e.g., CPUs); and 4) escalation of geopolitical tensions between the US and China. Demand could continue to outpace supply in the foreseeable future; CXMT appears well-positioned to gain market share We estimate that strong demand for agentic AI will drive a more than sevenfold increase in global memory usage (with 60%+ bit CAGR) over 2026-30F, even after accounting for potential adoption of memory-efficiency technologies (discounting memory usage by 4x). However, expansion of semiconductor capacity faces multiple bottlenecks (e.g., clean rooms, equipment, materials, and talents). Memory makers are expanding capacity at a 30-40% bit CAGR over 2026-30F, but that could still be insufficient. We forecast CXMT to record bit expansion at a 40-45% CAGR over 2026-30F and its global DRAM market share to increase from ~10% currently to ~18% by end-2028F. Impact from the MATCH Act (or potential US sanctions) is worth monitoring The MATCH Act is a US export legislation designed to restrict China’s access to advanced chip-making technologies by coordinating with allies to curb exports of crucial equipment and materials and preventing foreign firms from servicing machines already in China. Although CXMT may still have access to sufficient DUV domestically without using EUV to develop its upcoming 12-16nm nodes, whether it can get key foreign-made equipment (localization rate now is around 40%, according to our estimates) and materials (such as photoresist) is worth monitoring, in our view. In the worst case, we assume CXMT’s capacity expansion in Shanghai (potentially 30-40% of its total capacity by 2028F) could be pushed out. Rating Starts at Buy Target price Starts at CNY 116.00 IPO price 27 July 2026 CNY 8.66 Implied upside +1,239.5% Market Cap (USD mn) Research Analysts Semiconductor Donnie Teng - NIHK donnie.teng@nomura.com +852 2252 1439 Frank Fan - NIHK frank.fan@nomura.com +852 2252 2195 Asia Technology CW Chung - NIHK cwchung@nomura.com +852 2252 6075 Year-end 31 Dec FY25 FY26F FY27F FY28F Currency (CNY) Actual Old New Old New Old New Revenue (mn) 61,799 0290,666 0560,788 0773,323 Reported net profit (mn) 1,875 0130,315 0277,248 0393,070 Normalised net profit (mn) 1,875 0130,315 0277,248 0393,070 FD normalised EPS 3.11c 2.05 4.08 5.79 FD norm. EPS growth (%) – 6,488.6 99.0 41.8 FD normalised P/E (x) 278.0 – 4.2 – 2.1 – 1.5 EV/EBITDA (x) 5.6 – 0.2 – -0.5 – -0.9 Price/book (x) 9.2 – 2.3 – 1.1 – 0.6 Dividend yield (%) – – – – – – – ROE (%) 3.8 84.0 70.7 54.0 Net debt/equity (%) 169.8 net cash net cash net cash Source: Company data, Nomura estimates See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts.Production Complete: 2026-07-26 20:31 UTC Key data on ChangXin Memory Technologies Performance (%) 1M 3M 12M Absolute (CNY) M cap (USDmn) Absolute (USD) Free float (%) 2.8 Rel to CSI 300 3-mth ADT (USDmn) Income statement (CNYmn) Year-end 31 Dec FY24 FY25 FY26F FY27F FY28F Revenue 24,178 61,799 290,666 560,788 773,323 Cost of goods sold -22,830 -36,465 -47,451 -60,675 -73,560 Gross profit 1,349 25,334 243,215 500,113 699,764 SG&A -2,765 -7,319 -23,544 -42,620 -54,906 Employee share expense-4,607 -9,593 -39,240 -72,902 -96,665 Opera and fair working environment for its employees; and (3) it indicates that integrity and compliance are the basic requirements for the survival and healthy development of the company by following the highest standards of compliance and business ethics to achieve sustainable business development goals.Nomura | ChangXin Memory Technologies 27 July 2026 3 AI evolution could drive exponential memory demand growth Why cloud AI and agentic AI may generate a lot of memory and networking demand The memory industry entered a structural growth phase following the launch of ChatGPT [owned by OpenAI (unlisted)] in December 2022, which triggered considerable growth in GPU and high-bandwidth memory (HBM) demand. In modern workloads like AI and high- performance computing, memory is one of the primary performance bottlenecks as memory bandwidth cannot keep up with processor speed, where the rate of improvement in processor performance outpaces the rate of improvement in memory performance due to limited I/O and decreasing signal integrity. This disparity limits the overall system performance, as the processor spends more time waiting for data from memory, leading to a bottleneck. Fig. 1: Performance of LLM, computer chips, memory, and interconnect Source: Nomura research To break through the bottleneck, the industry relies on several workarounds, including memory content and bandwidth improvement as well as higher throughput from communication networking: High bandwidth memory (HBM): Stacking more memory chips vertically directly on the processor package to increase bandwidth and drastically reduce distance and latency.• Caching: Utilizing smaller, ultra-fast on-chip memory (like SRAM) to hold frequently accessed data closer to the logic compute die.• Memory-on-logic or compute-in-memory: Packaging or moving the computing logic as close as possible or directly to the memory storage area to prevent data from having to travel across the chip.• Compute express link (CXL): Specialized interconnect technologies that allow processors to pool and access memory dynamically. • More interconnects for both copper and optical: As copper interconnects hit physical scaling limits and traditional packages run out of die shoreline, next-generation hardware is exploring optical interconnects to separate GPUs and HBMs. This bypasses traditional physical constraints, multiplying HBM capacity and reducing electro-optical data travel times.• Model compression: Reducing model size through techniques like quantization (lowering precision) or pruning to make them fit entirely into on-chip cache or HBM.• Subsequently, the adoption of retrieval-augmented generation (RAG) and agentic AI applications has accelerated demand for conventional servers and SSDs, and initiated a triple memory supercycle (commodity DRAM, HBM, and SSD) since 3Q25. As AI semiconductor demand shifts from training toward inference workloads, memory demand is entering a period of exponential expansion. This reflects the rapid growth in KV- cache memory requirements, driven by increases in user base, user engagement time, AI task Nomura | ChangXin Memory Technologies 27 July 2026 4 complexity, reasoning-token consumption, and the emergence of agentic AI, where token usage per user is surging exponentially ( Fig. 2 -3). Memory demand effectively scales as the multiplicative function of these variables (a1 x a2 x a3 x a4 x …), implying that memory demand could rise by several thousand-fold over the next five years, in our view. Fig. 2: Token usage trend by different LLM providers Source: Company data, Nomura estimates Fig. 3: Estimated token consumption by prompt cases Source: Nomura estimates How agentic AI works and how much memory may be consumed if considering the memory efficiency technologies When an end user asks an agentic AI to complete a task, we expect the request flows through eight distinct stages ( Fig. 4 ). Stage 1: User request arrives The user's prompt is tokenized, batched, and queued for inference. The orchestrator parses the request and prepares an execution plan for the agentic pipeline. Stage 2: Model weight loading The model's parameters are loaded (or already resident) into accelerator memory. For large models, weights may be shared across multiple GPUs using tensor or pipeline parallelism. Stage 3: Prefill/prompt processing All input tokens are processed in parallel through the transformer layers. Attention matrices are computed and the KV cache is initialized for subsequent autoregressive decoding. Stage 4: Reasoning and planning The model generates a chain-of-thought plan, deciding which tools to call and in what order. Each new token extends the KV cache, and memory pressure grows with sequence length.Nomura | ChangXin Memory Technologies 27 July 2026 5 Stage 5: Tool execution The agent invokes external tools such as web search, code execution sandboxes, file I/O, or API calls. This stage runs primarily on the CPU side and barely touches GPU memory. Stage 6: Context integration Tool results are tokenized and appended to the conversation. The model re-processes the expanded context window. The KV cache grows significantly, making this one of the most memory-intensive stages. Stage 7: Multi-step iteration Agentic loops repeat stages 4 through 6 multiple times. Each iteration further grows the context window. Memory pressure peaks here, potentially approaching HBM capacity limits. Stage 8: Response generation Final autoregressive decoding produces the output tokens. The response is detokenized, formatted, and streamed back to the user through the API gateway. Fig. 4: Workflow and key bottlenecks of an agentic AI task Source: Nomura research To complete the complicated agentic AI tasks throughout the above-mentioned eight stages of work flow, the modern AI system now heavily relies on a layered memory hierarchy, with each tier trading off speed against capacity. This results in the optimized usage of all different types of memories. We categorise and summarise the memory tiers relevant to agentic AI workloads, including the emerging high bandwidth flash (HBF) technology in Fig. 5 . Each stage activates different memory tiers at different scales. After a complete agentic task run, we expect the peak concurrent memory consumption at stage 7 (multi-step iteration), when memory pressure is at its highest, particularly when the more complicated task requiring multiple steps of iteration repeatedly ( Fig. 6 ). Fig. 5: AI memory hierarchy Source: Nomura researchNomura | ChangXin Memory Technologies 27 July 2026 6 Fig. 6: Different types of memories used in an agentic AI task work flow HBF is not yet ready for mass production Source: Nomura researchNomura | ChangXin Memory Technologies 27 July 2026 7 We note that three different layers of memories will be consumed in the eight stages of running the agentic AI tasks, including per task used memory (mainly SRAM, HBM and DDR, used for end user-specific KV cache), shared memory (mainly HBM, DDR, and SSD for model weights, checkpoint, and KV reuse pool), and persistent storage (mainly SSD and HDD for cold data storage once the data are generated as well as RAG and KV cold pool). For the memory demand trend in the future driven by agentic AI, there are two major variables that may impact the demand trend, including: The concurrent agentic AI task numbers per year (+): This includes the number of AI users, the agentic AI adoption rate, the agentic AI tasks per annum globally, the average duration time of an agentic AI task.1. The memory usage discount driven by memory efficiency technologies (-): ", "status": "extracted"}, "attachment:files/AI抱团松动后，资金流向何方？20260726.docx": {"id": "attachment:files/AI抱团松动后，资金流向何方？20260726.docx", "kind": "attachment", "title": "AI抱团松动后，资金流向何方？20260726", "source_label": "其他", "excerpt": "", "content": "", "status": "failed"}, "post:2026-07-27T08-30:c820a10ec242": {"id": "post:2026-07-27T08-30:c820a10ec242", "kind": "post", "title": "20
