 25%提升至 2025年的约 40%，并有望于 2028年进一步升 至49%。近期海外竞争对手收缩汽车玻璃业务，或为福耀在北美和欧洲配套 及售后市场加速承接订单创造有利条件；国内售后业务亦将受益于新增产能 爬坡与渠道持续深化。我们认为，全球份额提升将有效对冲整车需求波动。 产品结构升级及成本优势巩固 HUD前挡、全景天幕等高附加值产品加速渗透，镀膜隔热、调光玻璃等更高 单价新品亦逐步放量，推动福耀 2020-2025年汽车玻璃单平方米价格实现 约7%的CAGR。凭借在高附加值汽车玻璃领域的领先优势，我们预计公 司2026-2028年汽车玻璃单平方米价格仍有望保持 6%左右的 CAGR。成本 端，我们认为纯碱价格回落、 PVB提前锁价及有限的能源敞口，叠加规模效 应与效率改善，使福耀相较同业具备更强的成本控制能力，并预计公司盈利 能力有望保持稳健。 估值: 目标价由 85.00元小幅下调至 80.00元；维持买入评级 我们看好福耀作为全球汽车玻璃 龙头在市场份额扩张与 ASP提升驱动下的业 绩增长潜力。我们下调 2026-28E盈利预测 2%-4%以反映车市需求修复慢于 我们预期，并对应将 基于DCF估值法（WACC 9.0%，不变）的目标价小幅 下调至 80.00元。 重要数据 (Rmb百万) 12/23 12/24 12/25 12/26E 12/27E 12/28E 12/29E 12/30E 营业收入 33,161 39,252 45,787 48,394 56,359 63,616 69,979 76,059 息税前利润 (UBS) 5,846 8,077 10,064 11,241 13,319 15,427 17,203 18,842 净利润 (UBS) 5,629 7,498 9,312 10,209 11,881 13,659 15,176 16,613 每股收益 (UBS 稀释后 ) (Rmb) 2.16 2.87 3.57 3.91 4.55 5.23 5.82 6.37 每股股息净值 (Rmb) 1.30 1.80 2.10 2.35 2.73 3.14 3.49 3.82 净（债务） /现金 4,389 4,133 2,763 2,382 4,791 9,147 14,370 20,602 盈利能力和估值 12/23 12/24 12/25 12/26E 12/27E 12/28E 12/29E 12/30E 息税前利润率 % 17.6 20.6 22.0 23.2 23.6 24.3 24.6 24.8 ROIC (EBIT) % 23.5 27.9 30.7 30.4 32.4 35.1 37.5 39.7 企业价值 /息税折旧摊销前利润 (UBS核心) x 10.7 11.3 11.8 10.0 8.5 7.2 6.3 5.6 市盈率 (UBS, 稀释后 ) x 16.8 16.9 17.0 14.1 12.1 10.5 9.5 8.6 权益自由现金流 (UBS) 收益率 % 3.4 2.5 3.7 4.1 5.7 7.8 9.1 10.4 净股息收益率 % 3.6 3.7 3.5 4.3 5.0 5.7 6.3 6.9 来源：公司报告、LSEG Eikon、UBS估算。 UBS给出的估值是扣除商誉、例外项目以及其他特殊项目之前的数值。 估值：根据该年度的平均股价得出，(E)：根据 2026年9月15日的股价 (Rmb 55.03)得出. 本证券研究报告由瑞银证券有限责任公司编制 . 分析师声明及要求披露的项目，包括 UBS(瑞银 )发布的有关 Quantitative Research Review 的信息，从第 9 页开始。 股票 中国 汽车零配件业 12个月评级 买入 12个月目标价 Rmb80.00 之前 : Rmb85.00 股价 (2026年9月15日) Rmb55.03 RIC: 600660.SS BBG: 600660 CH 交易数据和主要指标 52周股价波动范围 Rmb74.20-48.01 市值 Rmb144b/US$21.4b 已发行股本 2,610m (ORDA) 流通股比例 63% 日均成交量 (千股) 13,166 日均成交额 (百万) Rmb715.1 普通股股东权益 (12/26E) Rmb42.3b 市净率 (12/26E) 3.4x 净债务 /息税折旧摊销前利润 (12/26E) NM 从到 %市场预测每股收益（ UBS 稀释后） (Rmb) 12/26E 4.04 3.91 -3 3.74 12/27E 4.73 4.55 -4 4.45 12/28E 5.34 5.23 -2 5.12 闵 皓 分析师 S1460518050001 nora.min@ub 4-03-15 43.65 62.00 买入 2024-08-06 42.87 63.00 买入 2024-10-17 56.86 72.00 买入 2025-03-18 60.45 80.00 买入 2025-08", "status": "extracted"}, "post:2026-10-01T16-16:66bce6918101": {"id": "post:2026-10-01T16-16:66bce6918101", "kind": "post", "title": "2026-10-01 16:16", "source_label": "帖子正文", "excerpt": "美光业绩会纪要 整体业绩 2026 财年第四季度营收、毛利率、EPS 均创纪录，且全部超出指引上限。2026 全财年营收达到上一创纪录年度（2025 财年）的 3.5 倍，数据中心营收增长至 4 倍，DRAM（原文作 DLM）营收超过 1,000 亿美元。", "content": "美光业绩会纪要 整体业绩 2026 财年第四季度营收、毛利率、EPS 均创纪录，且全部超出指引上限。 2026 全财年营收达到上一创纪录年度（2025 财年）的 3.5 倍，数据中心营收增长至 4 倍，DRAM（原文作 DLM）营收超过 1,000 亿美元。 为表彰员工，公司提高了全球每位团队成员 2026 财年的激励薪酬；并预计 2027 财年将更胜 2026 财年。 AI 与存储的战略逻辑 AI 正走向 “超级智能”，存储器的性能与容量直接提升各竞争平台的价值主张：更大的内存能力使 AI 应用使用量更具规模化、改善终端体验、提升用户价值。 存储对客户的战略重要性使美光获得历史上最大的差异化机会：差异化性能与品质、上市时间优势、地域多元化供应（含美国本土生产的 DRAM），以及更高价值产品组合。 技术与产能布局 1 Gamma DRAM 节点与 G9 NAND 节点是当前最大量产节点，有望成为公司史上产量最高的节点；下一代 DRAM/NAND 节点研发进展顺利，预计 2027 日历年下半年量产。 全球扩产时间表： 纽约首座晶圆厂完成混凝土浇筑，2030 日历年首批晶圆产出； 爱达荷 ID1 厂 2027 年中出片，ID2 厂 2028 年下半年出片； 日本 DRAM 扩建厂奠基，2028 日历年末产出； 台湾铜锣厂 2027 年中实现有意义的产品出货； 新加坡 HBM 先进封装厂洁净室进度超前，2027 年初产出；新加坡新 NAND 厂 2028 日历年下半年投产。 战略客户协议（SCA） 已签署 26 份多年期照付不议 SCA，预计到 2030 年覆盖超 35% 的收入；其中约四分之三有明确定价框架（多数设价格上下限），其余按市场价格定期议价。 部分协议已延长至 2031 年；新签 / 涉价谈判均基于当前市场状况以更高价格进行。 26 份 SCA 及延期的客户财务承诺增至 320 亿美元，绝大部分为现金存款。 终端市场 预计 2026、2027 日历年服务器出货量均增长 “十几个百分点”。 HBM：Q4 营收增速快于公司整体，2027 日历年绝大部分 HBM 竞标供应已锁定、价格同比大涨、与传统 DRAM 毛利率差距缩小；HBM4 爬坡推进中，并与 NVIDIA 合作业界首款定制 HBM4E（NVHBM），用于下一代 GPU 和 NVLink Fusion 平台。 NAND：数据中心 SSD Q4 营收近 100 亿美元，同比增长 10 倍以上，占公司 NAND 营收三分之二以上，有望连续第五年刷新数据中心 SSD 市场份额纪录。 PC / 手机：尽管整体出货量可能两位数下滑，高端市场带动行业收入本日历年仍增长；MCBU Q4 近半收入来自 1 Gamma 产品。 物理 AI：L4+ 自动驾驶内存通常超 200GB、存储达数 TB，较 L2+/L3 高一个数量级以上；人形机器人需求与之相当，到本十年末物理 AI 或成存储需求的重要驱动力。 行业展望与资本开支 预计 2027、2028 日历年存储供需远比 2026 紧张： NAND：2026 行业位元出货增低 20% 段（美光低于行业增速）；2027–2028 增中 20% 段，行业持续供不应求。 DRAM：2026 行业位元出货增中 20% 段（美光与行业同步）；2027–2028 增低 20% 段，行业持续供不应求。 HBM 位元增速将持续快于传统 DRAM（至 2028 日历年）。 DRAM 供需结构性缺口需新增洁净室弥合；即便行业计划新增洁净室，在强劲需求下美光 “看不到” 供需何时再平衡。 因此计划上调 2027 财年资本开支，大部分用于建设性开支以加速 2028 年末及以后的洁净室可用性；设备支出部分提前，但整体保持审慎。 管理层变动：Manish Bhatia 任总裁兼 COO（对运营 P&L 负责），Scott DeBoer 任总裁兼首席技术与产品官（执掌 Micron Research Labs）。 二、CFO 陈述（Mark Murphy） 全年：2026 财年营收创纪录 1,332 亿美元（同比 +256%）；毛利率 81.1%（较 2025 财年提升 40 个百分点）；EPS 75.52 美元（同比 +811%）；SCA 剩余履约义务（RPO）约 1,500 亿美元，且即使按底价，毛利率也将显著高于以往周期峰值。 Q4 业绩：营收 542 亿美元（环比 +31%，同比 +379%，连续第六个季度创新高）；DRAM 营收创纪录 398 亿美元（占 73%，环比 +27%，价格涨高十几百分点）；NAND 营收创纪录 141 亿美元（占 26%，环比 +42%，位元出货 +10%、价格 +30%）；毛利率 87%（环比 +210bp）；营业利润 446 亿美元，营业利润率 82.3%；非 GAAP 摊薄 EPS 33.42 美元（环比 +33%）。 各业务单元：CMBU 163 亿（环比 +18%，毛利率 83%）、CDBU 180 亿（环比 +56%，毛利率 90%）、MCBU 131 亿（环比 +14%，毛利率 90%）、AEBU 68 亿（环比 +47%，毛利率 84%），营收均创纪录。 现金流与资产负债表：经营现金流 440 亿美元；资本开支 108 亿美元；自由现金流 332 亿美元；期末现金及投资 735 亿美元，净现金 683 亿美元，债务仅 52 亿美元；获三大评级机构升至 BBB+/ 同级；Q4 收到客户现金存款 123 亿美元（计入融资活动，不影响自由现金流），存量客户存款 127 亿美元。 指引：FY27 Q1 营收指引 615 ± 15 亿美元；毛利率约 86.25%；EPS 38.15 ± 1 美元；Q1 资本开支约 115 亿美元，上半年合计约 250 亿美元，下半年更高，且建设类开支增速显著高于设备类；预计 Q1 为 FY27 毛利率低点（因高价库存及激励薪酬计入成本），此后逐季走高、但提价幅度趋缓；FY27 营业费用将增加约 25 亿美元（主要研发与激励薪酬）；税率约 15.5%；自 2026 年 12 月 9 日（CHIPS 最终协议签署两周年）起提高资本回报，长期目标将 100% 超额现金返还股东。 三、问答环节 Timothy Arcuri（UBS）：资本回报的 “里程碑”—— 目标现金水平是多少？ Mark Murphy 回应：市场条件、技术产品地位与运营执行力共同带来强劲自由现金流（Q4 达 330 亿美元），且在加大研发与资本开支的同时仍可增长，自由现金流的强劲 “更具持久性”。 近期看，按 Q1 指引及资本开支计算，Q1 自由现金流将显著高于 Q4 的 330 亿美元；预计在 Q1 末达到目标现金水平。 之后将按计划（自 2026 年 12 月 9 日起）加大资本回报，超额现金返还主要以回购形式进行；当前回购授权为 22 亿美元，可预期公司近期将寻求追加授权。 Timothy Arcuri 追问：资本强度 —— 长期资本开支占收入比，20–25% 会否成为新常态？ Mark Murphy：确认只给了上半年资本开支（下半年更高），开支结构向建设性资本倾斜且该趋势将持续数年。 资本强度目前处于历史低位，反映存储已成为 “战略性资产”、行业已发生结构性重置；公司将以有纪律的方式扩产，确保产能投资获得足够回报。 CJ Muse（Cantor Fitzgerald）：11 月季度指引中的毛利率问题 —— 要求量化高 ASP 库存对毛利率指引的影响及其他混合因素。 Mark Murphy 回应： 毛利率的影响因素：公司 Q4 决定提高激励薪酬，这最明显体现在运营费用上（Q3→Q4 OPEX 明显上升）。制造端的大部分激励薪酬成本在 Q4 被吸收进库存，因此 Q4 影响很小；而 Q4 计提激励薪酬所形成的高成本库存，其影响将体现在 FY27 Q1 的毛利率指引中，此外还有部分启动成本等，但激励薪酬是毛利率展望的主要驱动因素。 量化：上述因素合计使 Q1 增加约 10 亿美元成本。 FY27 激励薪酬又进一步提高，其影响已体现在 Q1 的 OPEX 指引中；制造端的 FY27 激励薪酬增量将从 Q2 开始影响毛利率。除因产量增长和折旧带来的正常成本上升外，FY27 全年约有 10 亿美元的持续性成本（激励薪酬增量、更高启动成本及其他）。 强调业务的盈利结构与回报已发生 “结构性改变”，经营水平远高于以往；27、28 年市场条件预计强于 26 年，加上长期照付不议协议提供超出该期限的可见性。 部分成本可视为 “可变或暂时性” 成本；重申 Q1 是 FY27 毛利率的低点，随着价格继续上涨和强劲运营表现，全年剩余季度毛利率将逐季走高。 CJ Muse 追问：HBM 定价 —— 提到 HBM 价格将上调至更接近传统 DRAM，是否从 1 月 1 日起生效？该业务相对增速如何？ Sanjay Mehrotra 回应： 2026 年的 HBM 价格是去年与客户议定的；2027 年 HBM 绝大部分产量已售罄，价格远高于 2026 年，这正在缩小 HBM 与非 HBM 存储之间的毛利率差距。 价格上涨自 2027 日历年起生效；预计行业 HBM 需求增速将持续快于 DRAM。 产品路线图：HBM3E、HBM4，明年晚些时候推出 HBM4E；HBM 保持强劲增长势头，产品组合定位良好。 Vivek Arya（Bank of America）：现金回报 ——Q2 至 Q4 可能产生超 1,000 亿美元现金流，即使 Q1 需要积累现金达到目标资产负债表，为什么 FY27 不应期待该量级的现金返还？ Mark Murphy 回应：重申公司 “有能力也有意愿” 提高资本回报，将寻求追加授权，并自 12 月 9 日起（依照 CHIPS 协议相关安排）开启更强的资本回报。（未给出具体数字。） Vivek Arya 追问（向 Sanjay）：存储股估值低迷，市场担心明年是价格和盈利的周期顶点 —— 或因行业新增产能、或因数据中心客户因存储占 BOM 比重过大而 “降规格”（despec）。2028 年行业价格能否继续有利甚至高于 2027？ Sanjay Mehrotra 回应： 2027、2028 日历年均需求超过供给，且紧张程度高于 2026；供需环境只会越来越紧。 即便 2028 年有新洁净室投产，供给依然紧张：洁净室建设周期长，出片后产能也只会逐步爬坡；HBM 从 3E 向 4/4E 转换叠加更高的 trade ratio（ die 换算比），进一步抑制供给增长；未来节点转换带来的单片晶圆生产率提升也在下降。 需求端：尽管部分服务器内容增速较此前预期温和下调，但服务器整体出货量在 2026、2027 均预计增长 “十几个百分点”，为 2028 年数据中心 DRAM 出货奠定基础。 客户下调内容增速实质是为了 “多出货”（如服务器出货强劲增长所反映），并非需求走弱；大模型、更长上下文、更多并发和智能体应用持续推升内存容量与性能需求。 关键数据：2027 年公司超过 75% 的产出已锁定；与客户的大部分讨论已围绕 2028 年展开；SCA 客户主动上门要求更多供应，非 SCA 客户也在下 PO；SCA 已有延期至 2031 年的新协议。 结论：看不到供需何时再平衡，健康的供需环境对行业定价环境构成利好。 Krish Sankar（TD Cowen）：HBM \"despec\" 传闻 —— 某大客户减少 HBM 采购；鉴于 HBM 的 die‑to‑wafer 比率更高，若这些晶圆转投 DDR，DDR 供应是否将大幅增加？ Sanjay Mehrotra 回应： 重申 HBM 需求在 2027、2028 日历年均快于行业（DRAM）整体需求增长，两年内存供应均将紧张。 应用对更多内存的潜在需求（latent demand）依然强劲：AI 平台要充分发挥能力，就需要更多、更快的内存，以应对不断增长的上下文规模、并发量和更大的模型。 客户确实会做 “优化”（despec），但主要目的是出货更多整机、推动自身增长并把握终端 AI 扩张机遇；这类优化并不会消除系统对更多内存的潜在需求，且优化的效果会随时间递减。（回答在此处文字中断，其后内容缺失。） Krish Sankar 追问（向 Mark）：FY27 资本开支超 500 亿美元、自由现金流或超 1,000 亿美元，建设类资本开支增速高于设备类 —— 是因明年半导体设备供应受限吗？资本开支是否存在因设备采购受限而形成的自然上限？ Mark Murphy 回应： 与设备供应受限无关，结构性倾斜主要源于强劲的供需失衡，以及建设绿地（greenfield）产能所需的长交付周期。 公司正在推进多个晶圆厂（ID1、ID2、日本、新加坡、铜锣等），通过战略客户协议获得了建设这些绿地产能的需求可见性；随后将根据最新的需求判断为晶圆厂适时配备设备。（回答在此处文字中断。） Harlan Sur（JPMorgan）：SCA 覆盖率 —— 上次财报时 16 份 SCA、预计未来收入覆盖率 50%+；现已 26 份且 27/28 年供需更紧。若当前所有谈判完成，SCA 对未来收入的覆盖率能否达 60–70%？（并请澄清 “FY27 70% 收入已被客户承诺覆盖” 的说法） Sanjay Mehrotra 回应： 澄清：2027 年超 75% 产出已获承诺，这一口径同时涵盖 SCA 客户与非 SCA 客户 —— 公司也与部分大客户按年度开展业务；且因需求强劲，非 SCA 客户也已提前下达 2027 年采购订单。 SCA 最终覆盖率展望维持此前判断：到 2030 年前后约为收入的 50%，未上调；实际比例也可能更低，取决于其余业务的收入规模。 公司会持续管理业务组合，保持灵活性也很重要。 强调 SCA 的战略价值：提供未来需求的可见性、帮助规划投资，从根本上改变了这个行业的性质 —— 能在长交付周期、长时间跨度上管理投资与供应预期，对行业健康远胜于过去的高波动模式。 Harlan Sur 追问：NAND 业务 —— 按位元供应份额美光仅列全球第四、五位，却在数据中心 / 企业级 SSD 稳居第二，靠的是 G9 技术、控制器与固件定制、参与 NVIDIA 直接 GPU 访问存储计划、以及推理 KV cache 向存储卸载的趋势。这是否改变了团队对 NAND 研发和资本开支投资的看法？ Sanjay Mehrotra 回应： 随着上下文窗口扩大和 AI 发展，从 HBM 到 DRAM 再到 SSD 的存储层级被持续充分利用；公司产品组合处于业界史上最佳位置。 数据中心 SSD 成绩印证执行力：连续第五年实现数据中心市场份额增长，Q4 数据中心 SSD 营收达 100 亿美元，占公司 NAND 总营收三分之二。 将持续投入：产品相关研发继续加码，制造端投资也在增加，NAND 相关资本开支在整体 capex 中的占比同样在上升；新加坡新 NAND 晶圆厂按计划 2028 日历年末投产；资本开支支持 G9 NAND 节点转换、设备生产率优化、NAND 研发及新加坡运营的其他方面。#文字观点", "publish_time": "2026-10-01 16:16", "tags": ["文字观点"]}, "post:2026-10-01T18-48:639e8bf85ff3": {"id": "post:2026-10-01T18-48:639e8bf85ff3", "kind": "post", "title": "2026-10-01 18:48", "source_label": "帖子正文", "excerpt": "美光业绩会议原文 一、CEO 陈述（Sanjay Mehrotra，董事长兼 CEO） 整体业绩 • 2026 财年第四季度营收、毛利率、EPS 均创纪录，且全部超出指引上限。• 2026 全财年营收达到上一创纪录年度（2025 财年）的 3.5 倍，数据中心营收增长至 4 倍，DRAM（原文作 D", "content": "美光业绩会议原文 一、CEO 陈述（Sanjay Mehrotra，董事长兼 CEO） 整体业绩 • 2026 财年第四季度营收、毛利率、EPS 均创纪录，且全部超出指引上限。 • 2026 全财年营收达到上一创纪录年度（2025 财年）的 3.5 倍，数据中心营收增长至 4 倍，DRAM（原文作 DLM）营收超过 1,000 亿美元。 • 为表彰员工，公司提高了全球每位团队成员 2026 财年的激励薪酬；并预计 2027 财年将更胜 2026 财年。 AI 与存储的战略逻辑 • AI 正走向\"超级智能\"，存储器的性能与容量直接提升各竞争平台的价值主张：更大的内存能力使 AI 应用使用量更具规模化、改善终端体验、提升用户价值。 • 存储对客户的战略重要性使美光获得历史上最大的差异化机会：差异化性能与品质、上市时间优势、地域多元化供应（含美国本土生产的 DRAM），以及更高价值产品组合。 技术与产能布局 • 1 Gamma DRAM 节点与 G9 NAND 节点是当前最大量产节点，有望成为公司史上产量最高的节点；下一代 DRAM/NAND 节点研发进展顺利，预计 2027 日历年下半年量产。 • 全球扩产时间表：纽约首座晶圆厂完成混凝土浇筑，2030 日历年首批晶圆产出；爱达荷 ID1 厂 2027 年中出片，ID2 厂 2028 年下半年出片；日本 DRAM 扩建厂奠基，2028 日历年末产出；台湾铜锣厂 2027 年中实现有意义的产品出货；新加坡 HBM 先进封装厂洁净室进度超前，2027 年初产出；新加坡新 NAND 厂 2028 日历年下半年投产。 战略客户协议（SCA） • 已签署 26 份多年期照付不议 SCA，预计到 2030 年覆盖超 35% 的收入；其中约四分之三有明确定价框架（多数设价格上下限），其余按市场价格定期议价。 • 部分协议已延长至 2031 年；新签/涉价谈判均基于当前市场状况以更高价格进行。 • 26 份 SCA 及延期的客户财务承诺增至 320 亿美元，绝大部分为现金存款。 终端市场 • 预计 2026、2027 日历年服务器出货量均增长\"十几个百分点\"。 • HBM：Q4 营收增速快于公司整体，2027 日历年绝大部分 HBM 竞标供应已锁定、价格同比大涨、与传统 DRAM 毛利率差距缩小；HBM4 爬坡推进中，并与 NVIDIA 合作业界首款定制 HBM4E（NVHBM），用于下一代 GPU 和 NVLink Fusion 平台。 • NAND：数据中心 SSD Q4 营收近 100 亿美元，同比增长 10 倍以上，占公司 NAND 营收三分之二以上，有望连续第五年刷新数据中心 SSD 市场份额纪录。 • PC/手机：尽管整体出货量可能两位数下滑，高端市场带动行业收入本日历年仍增长；MCBU Q4 近半收入来自 1 Gamma 产品。 • 物理 AI：L4+ 自动驾驶内存通常超 200GB、存储达数 TB，较 L2+/L3 高一个数量级以上；人形机器人需求与之相当，到本十年末物理 AI 或成存储需求的重要驱动力。 行业展望与资本开支 • 预计 2027、2028 日历年存储供需远比 2026 紧张：NAND：2026 行业位元出货增低 20% 段（美光低于行业增速）；2027–2028 增中 20% 段，行业持续供不应求。DRAM：2026 行业位元出货增中 20% 段（美光与行业同步）；2027–2028 增低 20% 段，行业持续供不应求。HBM 位元增速将持续快于传统 DRAM（至 2028 日历年）。 • DRAM 供需结构性缺口需新增洁净室弥合；即便行业计划新增洁净室，在强劲需求下美光\"看不到\"供需何时再平衡。 • 因此计划上调 2027 财年资本开支，大部分用于建设性开支以加速 2028 年末及以后的洁净室可用性；设备支出部分提前，但整体保持审慎。 • 管理层变动：Manish Bhatia 任总裁兼 COO（对运营 P&L 负责），Scott DeBoer 任总裁兼首席技术与产品官（执掌 Micron Research Labs）。 二、CFO 陈述（Mark Murphy） • 全年：2026 财年营收创纪录 1,332 亿美元（同比 +256%）；毛利率 81.1%（较 2025 财年提升 40 个百分点）；EPS 75.52 美元（同比 +811%）；SCA 剩余履约义务（RPO）约 1,500 亿美元，且即使按底价，毛利率也将显著高于以往周期峰值。 • Q4 业绩：营收 542 亿美元（环比 +31%，同比 +379%，连续第六个季度创新高）；DRAM 营收创纪录 398 亿美元（占 73%，环比 +27%，价格涨高十几百分点）；NAND 营收创纪录 141 亿美元（占 26%，环比 +42%，位元出货 +10%、价格 +30%）；毛利率 87%（环比 +210bp）；营业利润 446 亿美元，营业利润率 82.3%；非 GAAP 摊薄 EPS 33.42 美元（环比 +33%）。 • 各业务单元：CMBU 163 亿（环比 +18%，毛利率 83%）、CDBU 180 亿（环比 +56%，毛利率 90%）、MCBU 131 亿（环比 +14%，毛利率 90%）、AEBU 68 亿（环比 +47%，毛利率 84%），营收均创纪录。 • 现金流与资产负债表：经营现金流 440 亿美元；资本开支 108 亿美元；自由现金流 332 亿美元；期末现金及投资 735 亿美元，净现金 683 亿美元，债务仅 52 亿美元；获三大评级机构升至 BBB+/同级；Q4 收到客户现金存款 123 亿美元（计入融资活动，不影响自由现金流），存量客户存款 127 亿美元。 • 指引：FY27 Q1 营收指引 615 ± 15 亿美元；毛利率约 86.25%；EPS 38.15 ± 1 美元；Q1 资本开支约 115 亿美元，上半年合计约 250 亿美元，下半年更高，且建设类开支增速显著高于设备类；预计 Q1 为 FY27 毛利率低点（因高价库存及激励薪酬计入成本），此后逐季走高、但提价幅度趋缓；FY27 营业费用将增加约 25 亿美元（主要研发与激励薪酬）；税率约 15.5%；自 2026 年 12 月 9 日（CHIPS 最终协议签署两周年）起提高资本回报，长期目标将 100% 超额现金返还股东。 三、问答环节 1. Timothy Arcuri（UBS）：资本回报的\"里程碑\"——目标现金水平是多少？ • Mark Murphy 回应：市场条件、技术产品地位与运营执行力共同带来强劲自由现金流（Q4 达 330 亿美元），且在加大研发与资本开支的同时仍可增长，自由现金流的强劲\"更具持久性\"。近期看，按 Q1 指引及资本开支计算，Q1 自由现金流将显著高于 Q4 的 330 亿美元；预计在 Q1 末达到目标现金水平。之后将按计划（自 2026 年 12 月 9 日起）加大资本回报，超额现金返还主要以回购形式进行；当前回购授权为 22 亿美元，可预期公司近期将寻求追加授权。 2. Timothy Arcuri 追问：资本强度——长期资本开支占收入比，20–25% 会否成为新常态？ • Mark Murphy：确认只给了上半年资本开支（下半年更高），开支结构向建设性资本倾斜且该趋势将持续数年。资本强度目前处于历史低位，反映存储已成为\"战略性资产\"、行业已发生结构性重置；公司将以有纪律的方式扩产，确保产能投资获得足够回报。 3. CJ Muse（Cantor Fitzgerald）：11 月季度指引中的毛利率问题——要求量化高 ASP 库存对毛利率指引的影响及其他混合因素。 • Mark Murphy 回应：毛利率的影响因素：公司 Q4 决定提高激励薪酬，这最明显体现在运营费用上（Q3→Q4 OPEX 明显上升）。制造端的大部分激励薪酬成本在 Q4 被吸收进库存，因此 Q4 影响很小；而 Q4 计提激励薪酬所形成的高成本库存，其影响将体现在 FY27 Q1 的毛利率指引中，此外还有部分启动成本等，但激励薪酬是毛利率展望的主要驱动因素。量化：上述因素合计使 Q1 增加约 10 亿美元成本。FY27 激励薪酬又进一步提高，其影响已体现在 Q1 的 OPEX 指引中；制造端的 FY27 激励薪酬增量将从 Q2 开始影响毛利率。除因产量增长和折旧带来的正常成本上升外，FY27 全年约有 10 亿美元的持续性成本（激励薪酬增量、更高启动成本及其他）。强调业务的盈利结构与回报已发生\"结构性改变\"，经营水平远高于以往；27、28 年市场条件预计强于 26 年，加上长期照付不议协议提供超出该期限的可见性。部分成本可视为\"可变或暂时性\"成本；重申 Q1 是 FY27 毛利率的低点，随着价格继续上涨和强劲运营表现，全年剩余季度毛利率将逐季走高。 4. CJ Muse 追问：HBM 定价——提到 HBM 价格将上调至更接近传统 DRAM，是否从 1 月 1 日起生效？该业务相对增速如何？ • Sanjay Mehrotra 回应：2026 年的 HBM 价格是去年与客户议定的；2027 年 HBM 绝大部分产量已售罄，价格远高于 2026 年，这正在缩小 HBM 与非 HBM 存储之间的毛利率差距。价格上涨自 2027 日历年起生效；预计行业 HBM 需求增速将持续快于 DRAM。产品路线图：HBM3E、HBM4，明年晚些时候推出 HBM4E；HBM 保持强劲增长势头，产品组合定位良好。 5. Vivek Arya（Bank of America）：现金回报——Q2 至 Q4 可能产生超 1,000 亿美元现金流，即使 Q1 需要积累现金达到目标资产负债表，为什么 FY27 不应期待该量级的现金返还？ • Mark Murphy 回应：重申公司\"有能力也有意愿\"提高资本回报，将寻求追加授权，并自 12 月 9 日起（依照 CHIPS 协议相关安排）开启更强的资本回报。（未给出具体数字。） 6. Vivek Arya 追问（向 Sanjay）：存储股估值低迷，市场担心明年是价格和盈利的周期顶点——或因行业新增产能、或因数据中心客户因存储占 BOM 比重过大而\"降规格\"（despec）。2028 年行业价格能否继续有利甚至高于 2027？ • Sanjay Mehrotra 回应：2027、2028 日历年均需求超过供给，且紧张程度高于 2026；供需环境只会越来越紧。即便 2028 年有新洁净室投产，供给依然紧张：洁净室建设周期长，出片后产能也只会逐步爬坡；HBM 从 3E 向 4/4E 转换叠加更高的 trade ratio（die 换算比），进一步抑制供给增长；未来节点转换带来的单片晶圆生产率提升也在下降。需求端：尽管部分服务器内容增速较此前预期温和下调，但服务器整体出货量在 2026、2027 均预计增长\"十几个百分点\"，为 2028 年数据中心 DRAM 出货奠定基础。客户下调内容增速实质是为了\"多出货\"（如服务器出货强劲增长所反映），并非需求走弱；大模型、更长上下文、更多并发和智能体应用持续推升内存容量与性能需求。关键数据：2027 年公司超过 75% 的产出已锁定；与客户的大部分讨论已围绕 2028 年展开；SCA 客户主动上门要求更多供应，非 SCA 客户也在下 PO；SCA 已有延期至 2031 年的新协议。结论：看不到供需何时再平衡，健康的供需环境对行业定价环境构成利好。 7. Krish Sankar（TD Cowen）：HBM \"despec\" 传闻——某大客户减少 HBM 采购；鉴于 HBM 的 die-to-wafer 比率更高，若这些晶圆转投 DDR，DDR 供应是否将大幅增加？ • Sanjay Mehrotra 回应：重申 HBM 需求在 2027、2028 日历年均快于行业（DRAM）整体需求增长，两年内存供应均将紧张。应用对更多内存的潜在需求（latent demand）依然强劲：AI 平台要充分发挥能力，就需要更多、更快的内存，以应对不断增长的上下文规模、并发量和更大的模型。客户确实会做\"优化\"（despec），但主要目的是出货更多整机、推动自身增长并把握终端 AI 扩张机遇；这类优化并不会消除系统对更多内存的潜在需求，且优化的效果会随时间递减。（回答在此处文字中断，其后内容缺失。） 8. Krish Sankar 追问（向 Mark）：FY27 资本开支超 500 亿美元、自由现金流或超 1,000 亿美元，建设类资本开支增速高于设备类——是因明年半导体设备供应受限吗？资本开支是否存在因设备采购受限而形成的自然上限？ • Mark Murphy 回应：与设备供应受限无关，结构性倾斜主要源于强劲的供需失衡，以及建设绿地（greenfield）产能所需的长交付周期。公司正在推进多个晶圆厂（ID1、ID2、日本、新加坡、铜锣等），通过战略客户协议获得了建设这些绿地产能的需求可见性；随后将根据最新的需求判断为晶圆厂适时配备设备。（回答在此处文字中断。） 9. Harlan Sur（JPMorgan）：SCA 覆盖率——上次财报时 16 份 SCA、预计未来收入覆盖率 50%+；现已 26 份且 27/28 年供需更紧。若当前所有谈判完成，SCA 对未来收入的覆盖率能否达 60–70%？（并请澄清\"FY27 70% 收入已被客户承诺覆盖\"的说法） • Sanjay Mehrotra 回应：澄清：2027 年超 75% 产出已获承诺，这一口径同时涵盖 SCA 客户与非 SCA 客户——公司也与部分大客户按年度开展业务；且因需求强劲，非 SCA 客户也已提前下达 2027 年采购订单。SCA 最终覆盖率展望维持此前判断：到 2030 年前后约为收入的 50%，未上调；实际比例也可能更低，取决于其余业务的收入规模。公司会持续管理业务组合，保持灵活性也很重要。强调 SCA 的战略价值：提供未来需求的可见性、帮助规划投资，从根本上改变了这个行业的性质——能在长交付周期、长时间跨度上管理投资与供应预期，对行业健康远胜于过去的高波动模式。 10. Harlan Sur 追问：NAND 业务——按位元供应份额美光仅列全球第四、五位，却在数据中心/企业级 SSD 稳居第二，靠的是 G9 技术、控制器与固件定制、参与 NVIDIA 直接 GPU 访问存储计划、以及推理 KV cache 向存储卸载的趋势。这是否改变了团队对 NAND 研发和资本开支投资的看法？ • Sanjay Mehrotra 回应：随着上下文窗口扩大和 AI 发展，从 HBM 到 DRAM 再到 SSD 的存储层级被持续充分利用；公司产品组合处于业界史上最佳位置。 • 数据中心 SSD 成绩印证执行力：连续第五年实现数据中心市场份额增长，Q4 数据中心 SSD 营收达 100 亿美元，占公司 NAND 总营收三分之二。 • 将持续投入：产品相关研发继续加码，制造端投资也在增加，NAND 相关资本开支在整体 capex 中的占比同样在上升；新加坡新 NAND 晶圆厂按计划 2028 日历年末投产；资本开支支持 G9 NAND 节点转换、设备生产率优化、NAND 研发及新加坡运营的其他方面。 结束#文字观点", "publish_time": "2026-10-01 18:48", "tags": ["文字观点"]}, "post:2026-10-01T16-16:eeae19af663f": {"id": "post:2026-10-01T16-16:eeae19af663f", "kind": "post", "title": "2026-10-01 16:16", "source_label": "帖子正文", "excerpt": "标题：财报电话会议纪要解读 总体而言，这是一份强劲的财报和稳健的指引，我在下方的 “初步印象” 中提到的预备评论进一步强化了这一观点。我在之前的评论中漏掉的另一个积极点是，团队提到他们预计 2027 财年第一季度的毛利率将是全年底部，并解释说这主要是由于一次性劳动力成本造成的。", "content": "标题：财报电话会议纪要解读 总体而言，这是一份强劲的财报和稳健的指引，我在下方的 “初步印象” 中提到的预备评论进一步强化了这一观点。我在之前的评论中漏掉的另一个积极点是，团队提到他们预计 2027 财年第一季度的毛利率将是全年底部，并解释说这主要是由于一次性劳动力成本造成的。 然而，在早盘冲高、股价上涨超过 4% 后，该股开始承压，最终转为下跌。目前没有显而易见的原因。 一些人指向了 Sanjay 的评论，这在演示文稿和新闻稿中已经披露过，即2027 财年下半年的资本支出将高于上半年，但未具体说明高出多少。 另一些人则认为，这一点存有争议，关于服务器的评论掩饰了规格下调。原文表述为：“我们预计 2026 和 2027 日历年的服务器出货量增长率均在 15% 以上。在内存供应紧张的情况下，强劲的服务器出货量增长得到了略低于此前预期的内容量增长的支持。” 还有人抱怨说，他们希望更清楚地了解资本回报计划何时能达到 100% 的派息率。我们得到的表述仅为：“公司预计在第一财季末达到目标现金水平，之后多余的现金将主要通过股票回购返还，资本回报规模预计随时间推移而增加。” 市场关心是否会有潜在的并购。但公平地说，在退出芯片法案补贴流程之前，为什么要冒政治阻力的风险呢？ 还有一些人只是纠结于：在这次电话会议之后，人们会上调还是下调他们的预测数字。 甚至有人对库存天数的增加吹毛求疵。 另一个微小但有趣的点是 Sanjay 对 Harlan 提问的回答，似乎为他们决定追求低于 50% 的长期协议（LTA）覆盖率留下了余地，我认为这与现有的投资逻辑相比将是一个变化。 电话会议的其余部分仅仅是一个问题，即你是否同意团队的预期，即供需环境在2027 年和 2028 年将进一步收紧，以及长期协议（LTA）和回购使这一轮周期成为一个独特的周期。 我怀疑在市场表现平稳的情况下，股价明天会走高，但我期待您的反馈或不同意见…… 美光（MU，+1.7%） 新闻稿中几乎没有什么可挑剔的地方。各项指标全面超出预期，强劲的营收指引抵消了略低于预期的毛利率，毛利率仍高于 86%。 资本支出（capex）方面没有意外，但我们本就不预期会有意外。 本季度创造了 33 亿美元的自由现金流（FCF）。 摘自演示文稿： “尽管 2026 财年表现强劲，但我们预计 2027 财年将更加出色。我们预计 2027 和 2028 财年的内存和存储供需状况将比 2026 年更加紧张。凭借我们对更高价值解决方案的关注，与竞争对手相比，我们拥有实现更丰富产品组合的机会。” 1γ（1-gamma）DRAM 节点和 G9 NAND 已实现交叉。 新晶圆厂建设进度均符合预期。 “截至目前，我们已签署了 26 份 SCA（供应协议），目前估计这些协议将占到我们截至 2030 年总营收的 35% 以上。这与我的预期完全一致。客户希望在 2030 年之后获得 SCA 保障的供应，我们现在已经签署了延长至 2031 年的 SCA，并将两份协议延长一年至 2031 年。” “我们已就 2027 日历年绝大部分的 HBM 位元供应达成了协议，价格同比大幅上涨，缩小了与传统 DRAM 之间的毛利率差距。” “我们计划增加 2027 财年的资本支出（capex），相比之前的计划有所提升…… 增加的大部分资金将用于建筑资本支出，其中大部分是为了帮助在 2028 日历年年底及以后加速洁净室空间的供给。或许我们能在电话会议上获得定量的指引。” 市场数据概览： 美光公司的业绩与指引数据：26 财年第四季度实际营收 54.23 亿美元，毛利率 87.1%，每股收益 31.52 美元；DRAM ASP 同比上涨 20%，NAND ASP 同比上涨 30%。 27 财年第一季度指引：营收 56.50-61.50 亿美元，毛利率 86.3%~87.5%，每股收益 32.82~38.15 美元。 27 财年全年指引：营收 150.00 亿美元，毛利率 87.0%，每股收益 153.27 美元。 28 财年指引：营收 150.00 亿美元，每股收益 171.09 美元。 卖方一致预期：26 财年第四季度营收 51.00 亿美元，毛利率 85.0%，每股收益 31.00 美元；27 财年第一季度营收 55.00 亿美元，毛利率 85.0%，每股收益 35.00 美元；27 财年全年营收 150.00 亿美元，每股收益 150.00 美元。 JPM 卖方调研均值：26 财年第四季度营收 53.80 亿美元，毛利率 87.0%，每股收益 33.20 美元；27 财年第一季度营收 59.15 亿美元，毛利率 87.1%，每股收益 37.47 美元；27 财年全年营收 182.47 亿美元，每股收益 234.89 美元。 JPM 卖方调研中位数：26 财年第四季度营收 52.00 亿美元，毛利率 87.0%，每股收益 33.00 美元；27 财年第一季度营收 59.00 亿美元，毛利率 87.0%，每股收益 37.00 美元；27 财年全年营收 180.00 亿美元，每股收益 236.53 美元。 彭博一致预期：26 财年第四季度营收 53.00 亿美元，毛利率 87.0%，每股收益 33.00 美元；27 财年第一季度营收 63.47 亿美元，毛利率 87.0%，每股收益 41.00 美元；27 财年全年营收 248.00 亿美元，每股收益 451.09 美元。#文字观点", "publish_time": "2026-10-01 16:16", "tags": ["文字观点"]}, "attachment:files/A股与港股复盘 20260930.pdf": {"id": "attachment:files/A股与港股复盘 20260930.pdf", "kind": "attachment", "title": "A股与港股复盘 20260930", "source_label": "其他", "excerpt": "A股与港股复盘 2026年9月30日 研究笔记 · 不构成投资建议 第 1 / 10 页 股票市场复盘 地产股跌停后反转收红；美国通胀低于预期，GDP上修 2026年9月30日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。", "content": "A股与港股复盘 2026年9月30日 研究笔记 · 不构成投资建议 第 1 / 10 页 股票市场复盘 地产股跌停后反转收红；美国通胀低于预期，GDP上修 2026年9月30日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 财政部等三部门的购房贷款贴息政策发布次日，地产股先跳水、后急拉。早盘多只个股跳空跌停，尾盘却翻红甚至封板。然而，彭博头条给这次政策效果的定性是“未达市场预期”。今天早上，我在星球上分享了我的看法，以及短期交易可防守的底部点位。显然，市场对于消息的第一反应并不一定正确。 昨日受贴息政策提振而大涨的地产股，今日早盘集体跳空跌停。万科A盘中一度触及跌停，随后强势反弹，收涨4.41%；深物业A从跌停翻红，收出涨停。彭博头条同日却称“中国最大规模刺激政策未能达到市场预期”，与盘面剧烈反转形成剧烈的反差。指数端，权重股撑住，上证收涨0.31%；科创50受芯片股连续第三日走弱拖累，重挫2.51%。 美股盘前最重要的变量是美国8月核心PCE通胀。这个美联储最看重的通胀指标降至3.0%，低于市场预期的3.3%；整体PCE降至3.4%，也低于预期的3.7%，7月数据同步下修30个基点。但这份数据带有一个技术性提醒：本次公布同时更改了三个PCE分项的统计方法，并把历史数据追溯调整回2021年，评论认为市场可能会对这次通胀“超预期回落”打一些折扣，等新口径的可比性更清楚之后再完全采信。尽管如此，美债收益率下跌，美元走软。美国二季度GDP从1.7%上修到2.2%。 本日报要 主线： 9月29日，财政部、央行、金融监管总局联合推出购房贷款贴息政策，市场此前将其视作地产下行周期里的“史诗级”利好。但政策公布次日，地产板块集体跳空低开：万科A盘中触及跌停（低见3.67元），深物业A、世联行等低开逼近或触及跌停。此后盘中大幅反转，万科A收涨4.41%，深物业A从跌停翻红、收出涨停，走出“地天板”；保利发展、世联行等多数地产股仍收跌，板块内部分化剧烈。彭博当天头条《中国最大规模刺激政策未能达到市场预期》点明：政策更偏向为保住增长目标托底，需求端的结构性疲软并未触及。该判断与盘面的暴跌后反转相互反差。 A股： 上证收3,842点，涨0.31%；沪深300涨0.29%；创业板指跌0.23%；科创50跌2.51%，芯片、半导体股走弱拖累，本周已是第三个交易日。两市成交约1.44万亿元（沪+深），比前一交易日增加约288.2亿元。Wind统计显示，全市场上涨家数2,567家、下跌家数2,824家，跌多于涨；涨停家数56家，跌停家数12家。 A股与港股复盘 2026年9月30日 研究笔记 · 不构成投资建议 第 2 / 10 页 港股： 恒生指数收24,613.27点，涨0.37%；国企指数涨0.50%；恒生科技指数涨0.10%。恒指成交额1,871.6亿港元。地产股、科网股的波动幅度明显小于A股同类标的。 货币与汇率： 央行今日7天期逆回购操作量为零，开展隔夜逆回购8,335亿元；当日有80亿元7天期、6,985亿元隔夜逆回购到期，公开市场净投放1,270亿元。央行同时预告，10月8日（国庆长假后首个交易日）开展1.2万亿元3个月期买断式逆回购操作；当月该期限品种到期1万亿元，属加量续作，净投放2,000亿元。人民币中间价报6.7351，较前一交易日的6.7411调升60个基点；在岸即期约6.6958，离岸CNH约6.7062；美元指数报101.10，跌0.27%。 互联互通： 北向成交2,079.4亿元（沪股通1,012.6亿元、深股通1,066.8亿元），较前一交易日的2,129.2亿元小幅回落约2.3%，净额未公布。南向成交699.3亿元，较前一交易日的640.2亿元放大约9.2%；净买入68.64亿元，力度明显强于前一交易日的净买0.15亿元。 大波动： 内地方面，万科A（000002.SZ）盘中一度触及跌停（低见3.67元），尾盘收涨4.41%；深物业A（000011.SZ）从跌停翻红，收出涨停；中芯国际（688981.SH）跌4.70%。港股方面，万科企业（02202.HK）跌0.71%，盘中同样宽幅震荡（开2.65、低2.49、高2.96港元）。 技术： 上证指数收盘价重新站上20日布林下轨（约3,824点）；恒生指数仍在50日、100日、200日均线下方（详见第1、2节图）。 驱动： 地产股“利好出尽”式过山车是全天最大变量（见上）；科创50受芯片股连续第三日走弱拖累重挫（见第1节）；美国8月核心PCE通胀低于预期，美股期货、黄金走高，VIX进一步回落，但标普500成分股中仅约25%高于50日均线，指数上涨与参与广度恶化并存（见第4节）。沪深15:00、港股16:08均已收盘，国庆长假前最后一个交易日收官。 外盘 / 商品 / 国债： 美股期货三大指数齐涨，VIX续降；WTI、布伦特原油同步走高；COMEX黄金延续反弹，白银小涨，铜小涨；美债收益率涨跌互现，中国10年小幅走高（数字见第4节）。 A股与港股复盘 2026年9月30日 研究笔记 · 不构成投资建议 第 3 / 10 页 1. A股 指数 收盘 开 高 低 当日 成交额 上证指数 3,842 3,839 3,851 3,833 +0.3% 6,793.7亿 深证成指 12,888 12,958 12,966 12,855 −0.1% 7,586.2亿 沪深300 4,358 4,357 4,369 4,342 +0.3% 3,564.9亿 创业板指 3,135 3,165 3,173 3,125 −0.2% 3,662.4亿 科创50 1,530 1,577 1,579 1,527 −2.5% 718.8亿 中证500 7,435 7,469 7,485 7,417 −0.1% 2,386.2亿 中证1000 7,299 7,361 7,375 7,289 −0.4% 2,745.0亿 上证50 2,823 2,814 2,828 2,808 +0.5% 1,070.2亿 北证50 1,040 1,036 1,057 1,036 +0.7% 122.4亿 本节给主线补上地产股日内反转的具体证据。万科A今日开盘3.80元，盘中最低3.67元，较昨日收盘4.08元跌超10%，实质触及跌停价；此后一路拉升，最高4.40元，收在4.26元、当日涨4.41%，全天振幅接近20%。深物业A走出更极端的“地天板”：早盘封在跌停附近，尾盘反手封上涨停。同一只股票、同一天在跌停与涨停之间大幅切换，过去两个月行情里没有出现过，说明市场对这次贴息政策的分歧极大：认为“政策不够”的资金离场，认为“跌过头”的资金进场抄底，盘中反复拉锯。与此同时，科创50重挫2.51%，芯片、半导体股三个交易日内第三次明显走弱，与地产股的极端波动分属两条逻辑线，但共同指向国庆长假前资金对高波动板块的谨慎。 A股与港股复盘 2026年9月30日 研究笔记 · 不构成投资建议 第 4 / 10 页 上证指数今日低开3,839点，盘中最高3,851点，最低3,833点，收在3,842点，涨0.31%。收盘价重新站上20日布林下轨（约3,824点），结束此前两个交易日贴线甚至跌破下轨的局面；但仍在50日均线（约3,906点）下方，200日均线在4,000点附近。指数平稳与地产、芯片板块内部剧烈波动形成对比，说明分歧主要发生在个股和板块层面，尚未传导至指数权重股。 板块层面，除地产日内反转外，芯片、半导体股连续第三个交易日承压：中芯国际跌4.70%、寒武纪跌3.54%，均未收复本周一“英伟达采购传闻”冲击当天的跌幅。逆势涨停的题材股包括创业板的善水科技（+20.01%）、科创板的康希诺（+20.00%，疫苗）、继续涨停的襄阳轴承（汽车零部，多日连板）；新华传媒收出第7个涨停，为本轮连板数最多的题材股。 代码 名称 收盘 当日 驱动 301190 善水科技 35.93 涨停 创业板，20%涨幅限制 688185 康希诺 102.64 涨停 疫苗，20%涨幅限制 000011 深物业A 12.24 涨停 地产，早盘跌停翻红收涨停 600825 新华传媒 — 涨停 出版 2%。#文字观点", "publish_time": "2026-10-01 10:01", "tags": ["文字观点"]}, "post:2026-10-01T11-16:aa20daf0fef0": {"id": "post:2026-10-01T11-16:aa20daf0fef0", "kind": "post", "title": "2026-10-01 11:16", "source_label": "帖子正文", "excerpt": "US EQUITIES COLOR: CHOPPY 美股盘面色彩：震荡#交易台标普500指数下跌25个基点，收于7,652点，收盘竞价（MOC）为115亿美元净卖出。纳斯达克100指数上涨23个基点，报30,408点", "content": "US EQUITIES COLOR: CHOPPY 美股盘面色彩：震荡#交易台标普500指数下跌25个基点，收于7,652点，收盘竞价（MOC）为115亿美元净卖出。纳斯达克100指数上涨23个基点，报30,408点；罗素2000指数下跌3个基点，报2,807点；道琼斯指数下跌86个基点，报50,908点。美国各股票交易所成交量为177.21亿股，而今年以来的日均成交量为186.68亿股。VIX指数上涨355个基点，报16.55；WTI原油上涨132个基点，报90.54美元；美国10年期国债收益率上升5个基点，报5.29%；黄金下跌70个基点，报4,152点；美元指数（DXY）上涨13个基点，报101.50；比特币下跌9个基点，报83,501美元。 第三季度已收官。月末出现了115亿美元的巨额MOC卖出失衡（模型预测养老基金将卖出305亿美元的美国股票，这一规模在过去三年中排在第89百分位）。鉴于持续的业绩挑战、日益严峻的宏观背景（市场高度关注油价和利率）、迫在眉睫的中期选举压力以及AI领域叙事的快速切换，市场活跃度依然不稳定。尽管今早公布的PCE数据较软（+25bps，预期为+30bps），但市场并未理会，收益率今日继续走高。结合美联储主席John Williams昨天的言论，高盛研究部（GIR）将美联储加息时间从10月推迟到了12月。其他方面，市场出现了一些平仓迹象，空头回补压力较大，非盈利科技板块表现优异。今日软件股明显强于半导体股，多数人将其归因于财报因素（JBL业绩超预期并上调指引，但股价下跌10%，压制了今晚MU财报前的市场情绪；而FDS业绩/展望喜忧参半，股价上涨4%），以及季末效应和惯常的板块波动。以1-10分衡量，我们交易台的整体活跃度为4分，最终录得+6%的净买入，其中资产管理公司为净买入（科技和宏观板块），而对冲基金基本持平（医疗保健板块有需求，科技和工业板块有供应）。 盘后交易：MU因头条业绩超预期且指引高于预期上涨1%。财报发布前市场情绪分歧。第四财季营收稳健超预期（540亿美元，预期515亿），利润率也略好于预期（87%，预期86.2%），且第一财季营收指引远高于预期（600-630亿美元，预期570亿）。一个潜在的瑕疵是毛利率指引环比下降（86.7%，本季度为87%）……GOOG因发布Gemini 4 ‘Argon’上涨2%。 衍生品：随着市场焦点仍集中在利率上，股市表现坚挺，标普500指数（S&P）和纳斯达克100指数（NDX）的波动率在当日变动不大。虽然指数水平保持韧性，但集中的科技股掩盖了表象下的痛苦，尤其是在利率敏感型资产中。在资金流方面，交易台继续看到博取收益率走低的交易……买入XLU和TLT看涨期权成为当日焦点（市场买入5万张10月30日到期、行权价41的看涨期权）。在指数方面，交易台更倾向于通过2-3个月的QQQ看涨期权而非SPY来布局上行，以捕捉大选和科技股财报季的行情。随着进入第四季度，我们也开始看到年底的保护性头寸……高盛客户买入了7.5万手12月31日到期、行权价650/550的SPY看跌期权价差。市场注意力转向周五的非农就业数据（NFP），本周末到期的平值跨式期权定价为91个基点。#文字观点", "publish_time": "2026-10-01 11:16", "tags": ["交易台", "文字观点"]}, "post:2026-10-01T21-03:6d22488ea60f": {"id": "post:2026-10-01T21-03:6d22488ea60f", "kind": "post", "title": "2026-10-01 21:03", "source_label": "帖子正文", "excerpt": "光伏主产业链重点公司及行业动态日报0930行业动态： 1. PVInfoLink本周价格数据显示：多晶硅致密料均价为40.0元/kg；130μm 9.8%（带动KOSDAQ表现领先KOSPI 4.5%）也随着走强的价格走势同步上涨。 另外，请注意GIR对SEC（买入评级，CL）的3Q25E业绩预览，他们预计在DRAM和NAND强劲的基本面支持下，该季度表现稳健，营业利润将达到100万亿韩元以上。 SEC的第三季度初步业绩预计将于下周（预计10月7‑8日）公布。 资金流向方面，外资和散户投资者共同净卖出SEC和SK HYNIX，而当地机构和其他法人（回购资金流入）最终为净买入。 NC(036570)上涨10.0% NC的大型多人在线角色扮演游戏《永恒之塔2》（Aion 2）于9月30日开启全球抢先体验，并在首日登顶Steam全球销量榜。 据报道，该游戏在发布前的愿望单注册量已超过130万，正式发布定于10月5日。 GIR 3Q25E业绩预览：在第三季度，我们预计NC的收益将大致符合市场预期，营收为6910亿韩元（同比+92%/环比‑10%），营业利润为810亿韩元（环比‑53%）。 《永恒之塔2》全球版10月5日的发布仍是近期的关键催化剂，Steam愿望单和热销榜第35名及第1名的排名表明发布前的需求令人鼓舞。 我们维持对NC的积极看法，因为我们继续看到现有产品线稳定的留存收益，以及日益清晰的AAA级产品线。 HD MOBIS(012330)上涨4.1% HD Mobis宣布将剥离其车灯业务为100%持股的子公司，并有意将其出售给OPmobility。 车灯业务在2025年贡献了Mobis营收的约2%，但占核心零部件营收的7%。 我们（GIR）认为，公司的这一决定强调了管理层优先发展未来出行和机器人执行器等领域的方向。 今日的强势表现似乎也受到反对出售Mobis车灯业务的异议股东可行使的股份收买请求权驱动，行权价为每股408394韩元。 WOORI FG(316140)下跌4.7% 我们金融集团（Woori FG）股东Posco Holdings以每股33360韩元的价格减持了2030万股股票。 该价格较9月30日韩国交易所（KRX）收盘价34900韩元折价4.41%。 宏观｜九月出口 韩国名义出口环比经季节性调整后大幅增长18.1%，高于上月的1.7%，创下1985年以来的最强劲势头。 这一结果远高于我们本已高于共识的预测。 各大主要部门的出口普遍增长，其中半导体（环比季调增长16.4%，非年化）以及汽车和汽车零部件（+36.9%）的增幅最为显著。 对美出口增幅最大，环比季调增长37.1%，约占名义环比增幅的40%，而对其他主要目的地的出口也普遍上升。#文字观点", "publish_time": "2026-10-01 18:50", "tags": ["文字观点"]}, "post:2026-10-01T11-18:1e74bb0a5368": {"id": "post:2026-10-01T11-18:1e74bb0a5368", "kind": "post", "title": "2026-10-01 11:18", "source_label": "帖子正文", "excerpt": "参议员将于11月寻求通过永久禁止中国汽车的议案", "content": "参议员将于11月寻求通过永久禁止中国汽车的议案", "publish_time": "2026-10-01 11:18", "tags": []}, "post:2026-10-01T10-04:201679cb25af": {"id": "post:2026-10-01T10-04:201679cb25af", "kind": "post", "title": "2026-10-01 10:04", "source_label": "帖子正文", "excerpt": "互联网有了第二批受众 在互联网历史的大部分时间里，只有一个群体作为真实受众存在：人类。绝大多数大型自动化程序，不会观看广告、支付任何费用，也不会进行任何有意义的阅读。", "content": "互联网有了第二批受众 在互联网历史的大部分时间里，只有一个群体作为真实受众存在：人类。绝大多数大型自动化程序，不会观看广告、支付任何费用，也不会进行任何有意义的阅读。 这种情况正在改变。2024 年底，Cloudflare 平均每秒处理 630 万次 HTTP 请求。如今，这个数字翻了一番，达到每秒 1250 万次，峰值超过 1500 万次。在过去增长的一年里，我们网络上全自动互联网流量（AI 机器人）的每秒请求增长超过了 100%。 人类互联网并没有为了腾出空间而缩小。与此同时，第二个受众群体出现：代理（agents），即代表人类行事的软件。它们介于人类和传统机器人之间。它们不会看广告，但它们可以从中获取价值。对于销售线索的业务而言，代理是附加的；对于那些没能做到的业务来说，它们则是破坏性的。 我们客户的需求并未改变：被发现、讲述精彩的故事、打造卓越的体验以及进行销售。改变的是，现在有两类访问者。 流量更多，收入更少 三十年来，互联网一直遵循着一种约定：你允许搜索引擎爬虫访问你的网站，它们为你输送访问者，而你将这些访问者转化为抓取你的网站，被发现和获得报酬是同一回事。 AI 阅读器读取页面的方式打破了这个平衡。现在，爬虫会读取网页内容，这消耗网站的带宽，却不会引导人类用户前往网站，广告或者付费转化都无法发生。 爬虫停止访问那些被抓取内容的站点。一些被抓取最严重的类别，例如零售、计算机软件、信息技术以及金融服务，其人工流量在不到一年的时间里下降了多达 40%。 其结果是，单次请求的收入在下降，而成本却在上升。每一次自动化请求都会消耗带宽、计算资源和站点容量，而这些请求不会带来新的线索、销售或订阅。 我们的第一反应是拦截所有自动化流量。去年，我们建议网站所有者拦截 AI 训练爬虫。2025 年，至少可以拒绝其中 22% 用于 AI 训练。到 2026 年 6 月，这一比例已达到 52%。 问题在于，对于正在构建的互联网经济而言，一味地拒绝并不是一种足够细致的处理方式。 其中一部分流量是客户 代理程序代为预订餐桌、比较保险报价或为研究人员购买数据集，这些都是客户。只不过它们不是人类客户。 自动化流量中增长最快的部分已不再是爬虫，而是代理程序，即代表个人获取页面的软件，通常是因为人类向聊天机器人提出了某些问题。这种代理流量遵循人类的浏览规律，具有更高的概率，在看完页面后有所下单。 代理程序的行为也与训练爬虫不同。训练爬虫收集您的页面是为了构建模型，代理程序则是在每次有人询问时读取内容。因此这种流量的增长取决于人类询问的次数，而非您发布内容的多少。 如果一个受众群体是你看不见、无法区分、无法设定条款且无法收费的，你就无法与他们开展业务。直到最近，对于网络上绝大多数的非人类流量来说，这四点都无法实现。 看清真正的访问者 “AI 机器人” 一词已不再具有实际意义。真正重要的是机器人的行为。Cloudflare 的 AI 爬虫控制、业务洞察、BotBase 向网站所有者展示了谁在抓取哪些统一资源定位符。 机器人的名称只有在你可以信任它时才有价值。借助 Web 验证，包括 OpenAI、Google 和 AWS 在内的代理，能够对代理请求进行加密签名，因此网站无需通过 IP 地址或者用户代理字符串进行猜测，即可区分真实的代理和冒充者。 我们每周观察到超过 500 亿次经过验证的机器人请求。 设定你的条款 今年 7 月，我们将单一的拦截 AI 机器人开关替换为独立的搜索、代理和训练控制项，这些功能适用于 Cloudflare 上的所有方案，包括免费方案。数据证明了需要这种区分功能。 只有不到 1% 的网站，会开启全部三项拦截。而有 17% 的网站，会拦截训练爬虫。网站所有者从未想过要禁止代理。但随着代理流量的兴起以及代理信息的新方式，他们突然能够对内容的使用方式，关于谁可以使用、如何付费以及他们想要被发现而不被滥用，制定条款。 对于混合用途的爬虫来说，这尤其困难。当同一个机器人既进行搜索，又进行模型训练时，很难只拦截其中一项。 Disallow AI Training 功能，能够让你告诉搜索引擎，不要使用你的数据来训练模型。Apple、Google 和其他运营商都公开承诺会遵守这一指令。 现在，新的配置会根据网站的盈利模式，而非访问软件的类型，推荐配置。推荐在带有广告的页面上拦截代理，因为只有当真正人类看到广告时，广告才会产生收益。您可以随时更改这些设置。 获得报酬 2026 年 8 月，我们将可代理网络定义为可发现、可调用且可付费的网络。 2023 年，授权市场展示了需求的旺盛，也暴露了差距。自 2023 年以来，已经签署了 50 多份大型出版商与 AI 公司的协议。几乎所有协议都是大型出版商与大型 AI 公司之间定制的双边协议。这些协议，也未能覆盖大多数买家。 并非每一项资产都应以同样的方式出售。高价值内容和数据集需要一个可信任的网络，在那里买家可以使用，而 MCP 工具并不适用于此。每一次请求都代表一次使用。 因此，我们正在针对这两种情况进行构建。 按次付费（Pay Per Use）解决了直接授权无法覆盖的网站。大多数出版商永远无法与每家 AI 公司达成协议，也没有那家公司可以与数百万出版商达成协议。它不对抓取行为收费，而是在内容被实际使用时支付费用。每一位买家都会定义什么是爬虫，以及愿意为此支付多少。 出版商可以看到买家何时停止为他们付费，而买家也可以看到出版商何时停止为他们提供服务。出版商收到报告，Cloudflare 会核对这些报告。 出版商看到报告后，可以选择加入，并在方案不再适用时退出。出版商看到报告，就可以了解人工智能代理阅读了哪些内容，更新什么，以及为智能体提供哪些规定的内容。 使用方式不会只有一种定义。引用来源的搜索引擎、引用段落的研究代理以及完成购买的商务代理，它们创造的价值各不相同。出版商可以定义不同的商业模式。 变现网关（Monetization Gateway），实现了从以往没有过的客户，交易的价值。变现网关追踪每一次与内容的交互，不论是 API 调用，还是智能体请求。 变现网关支持按请求、按查询或者按令牌计费，并提供自定义指标，例如阅读时长、广告和你的网站可以追踪的各类事件。 Cloudflare 的 AI 付费，我们在 2026 年 2 月发布，智能体作为付费方，以便在客户调用之前，发现并解决端点。 出版商可以选择阻止代理访问，或者允许代理访问但设置条款。每一次请求都意味着一次使用。 出版商可以设定自定义规则，在代理访问页面时，触发付费、API 调用。 降低每一次请求的成本 付费是解决收入流失问题的办法。但是成本仍然很高。大部分爬虫都效率低下，抓取了大量实际上不会使用的内容。人类每次点击链接，都决定了接下来要阅读什么。机器人却经常盲目地抓取大量页面，只为提取几段文字。 为了尝试解决这一问题，Cloudflare 在 7 月推出了新的搜索项目。这是一个协议，能够让搜索引擎更高效地获取内容。 我们与出版商合作，打造了 Cloudflare Search。这个协议，能够让搜索引擎只抓取它们需要的页面，而不是整个网站。 Web 的原生抓取，机器人会抓取整个页面，即便只需要其中一小部分。借助 Web 原生抓取，出版商可以告诉机器人，网页的哪些部分可以抓取，哪些部分不能抓取。 Cloudflare 的 2024 总结 互联网正在进入一个全新的阶段，网站所有者终于可以控制他们的内容如何被代理和 AI 系统使用。 过去，网站所有者只能被动接受爬虫的抓取，无论爬虫的目的是什么。现在，网站所有者可以区分人类访问者、搜索代理、训练爬虫，并且为每一类访问者设定不同规则。 代理不只是为了提供收入，智能体本身就是客户。无论请求是简单的读取，还是大型任务中的一个步骤，它们都会为所使用的数据、API 和工具付费。 这是一个全新的互联网，一个人类和智能代理共同作为受众的互联网。#文字观点", "publish_time": "2026-10-01 10:04", "tags": ["文字观点"]}, "post:2026-10-01T11-19:588f21a07f5b": {"id": "post:2026-10-01T11-19:588f21a07f5b", "kind": "post", "title": "2026-10-01 11:19", "source_label": "帖子正文", "excerpt": "【天风海外科技】美光业绩点评 业绩整体强于预期，除了 Q1 毛利率指引偏弱。盘后反应平淡，我们倾向于认为，市场对本轮高盈利的持续性、长协能否实质降低周期波动，以及扩产后的股东现金回报仍持保留态度。", "content": "【天风海外科技】美光业绩点评 业绩整体强于预期，除了 Q1 毛利率指引偏弱。盘后反应平淡，我们倾向于认为，市场对本轮高盈利的持续性、长协能否实质降低周期波动，以及扩产后的股东现金回报仍持保留态度。 管理层希望通过 AI 需求、持续供给约束，以及带有采购承诺和价格保护的长协，延长高盈利持续时间、抬升未来下行周期的盈利底部，进而降低市场给予存储公司的周期性折价。这套逻辑最终需要通过三件事兑现：毛利率按预期回升、长协在市场转弱时有效保护利润，以及扩产后仍能形成充足的股东现金回报。 数字上（Q4是 6-8 月，Q1是 9-11 月），营收利润beat，毛利率指引miss买方预期（但是 Q1 是全年毛利率低点），后续价格涨幅将趋于温和： Q4/Q1E 营收 542/615亿，买方预期为 529/ 590 亿 Q4/Q1E 毛利率 87.0%/86.3%，买方预期为 87.0%/88% Q4/Q1E EPS 33.4/38.2，买方预期为 33+/37.5 Q4（6-8 月，对其它存储公司有一定价格指导意义）环比增长 31%，主要由价格驱动。DRAM 收入QoQ增长 27%，位元出货量仅增长 约 5%，ASP 上涨 17%-19%；NAND 收入环比增长 42%，位元出货量增长约 10%，ASP 上涨约 30%。数据中心 SSD 季度收入约 100 亿美元、占 NAND 收入超过三分之二，云和数据中心业务占比到6成以上，收入结构向数据中心倾斜的趋势已经相当明确。 供给展望： NAND位元增长 26/27/28：20%-23%/24%—26%/24%—26%； DRAM位元增长 26/27/28：24%-26%/20%—23%/20%—23%； HBM增速快于传统DRAM 供需恢复平衡的时间点尚不明朗，2027—2028 年供需将比 2026 年紧张得多 长协SCA对比上个季度： Q3/Q4 已签 SCA 数量：16 /26 份 Q3/Q4 客户财务承诺：220/320 亿美元 Q3/Q4 长协相关 RPO：1000/1500 亿美元 到 2030 年覆盖 35%的收入，部分协议延续至 2031 年，SCA预计收入约75%已确定定价机制，包含上下限价格带；约25%按市场价格定期协商。新协议正按更高价格谈判。即使按价格下限，利润率也高于以往周期高点。 物理 AI长期需求方向，自动驾驶/人形机器人可能需要200GB 以上 DRAM、数 TB 存储，已有客户测试下一代产品。 FY27 Capex 较原计划上调。上半年约 250 亿美元，下半年预计更高，意味着全年可能超过500亿美元。对比看，FY26 是 270亿美金。 长期目标是返还 100%的超额现金（并非承诺返还全部自由现金流）。 李奇/卢可盈#文字观点", "publish_time": "2026-10-01 11:19", "tags": ["文字观点"]}, "post:2026-10-01T11-18:b47e38a5e049": {"id": "post:2026-10-01T11-18:b47e38a5e049", "kind": "post", "title": "2026-10-01 11:18", "source_label": "帖子正文", "excerpt": "汇量科技：新AI Infra上线在即，看好IAP空间打开 汇量科技核心业务为程序化广告平台Mintegral，客户以游戏为主（26H1占比76%，同比+27.5%），并向电商、工具等场景拓展。自2023年起，平台优化目标逐步从安装量转向广告主ROI和用户长期价值。", "content": "汇量科技：新AI Infra上线在即，看好IAP空间打开 汇量科技核心业务为程序化广告平台Mintegral，客户以游戏为主（26H1占比76%，同比+27.5%），并向电商、工具等场景拓展。自2023年起，平台优化目标逐步从安装量转向广告主ROI和用户长期价值。 核心催化：10月新AI Infra即将上线，将全面升级算力、数据、模型训练和实时决策能力，支持GPU及更复杂模型，有望打开IAP投放空间。 我们看好此次升级： （1）IAP广告预算更高，但优化难度也更大。IAA游戏多为休闲游戏，用户行为丰富，优化目标偏点击；IAP游戏多为中重度游戏，核心目标是用户付费，但付费行为稀疏、用户行为更复杂，传统推荐系统效果有限。 （2）Applovin已验证升级AI基础设施可显著提升IAP投放能力。Axon 2.0上线后，公司自23Q3起连续12个季度收入增速超50%。其核心升级包括打通数据闭环、使用GPU服务器，以及由传统决策树转向深度学习和长序列建模。 （3）Mintegral新AI Infra有望形成“数据—模型—预算”正循环。我们推测，公司在积累更多数据后，通过更复杂模型提升用户价值预测能力，并兼顾效率和成本，从而吸引更多IAP预算。 虽然不能简单类比Applovin，但新系统有望提升Mintegral投放效果并带动流水增长。近期已有更多IAP游戏公司扩大投放，预计将拉动26Q4及2027年EPS增长。 首次覆盖给予“买入”评级。预计2026-2028E收入25.32/35.30/46.25亿美元，同比增长24%/39%/31%；经调整归母净利润1.16/1.70/2.79亿美元。现价对应PE 24x/16x/10x。#文字观点", "publish_time": "2026-10-01 11:18", "tags": ["文字观点"]}, "post:2026-10-01T21-04:8bd52a6b2fe0": {"id": "post:2026-10-01T21-04:8bd52a6b2fe0", "kind": "post", "title": "2026-10-01 21:04", "source_label": "帖子正文", "excerpt": "长鑫科技：349亿元投向研发与后道测试，DRAM国产替代再提速 #349亿大手笔：长鑫科技拟使用超募资金合计180亿元，投建两大新项目，总投资349亿元。其中技术研发项目投资241亿元，存储器晶圆后道测试基地二期项目投资108亿元。", "content": "长鑫科技：349亿元投向研发与后道测试，DRAM国产替代再提速 #349亿大手笔：长鑫科技拟使用超募资金合计180亿元，投建两大新项目，总投资349亿元。其中技术研发项目投资241亿元，存储器晶圆后道测试基地二期项目投资108亿元。。 #技术研发项目：总投资241亿元，建设周期30个月，设备购置费高达223.98亿元，占总投92.94%。长鑫已完成第一代至第四代工艺平台量产，第五代G5平台于2026年9月正式量产。2025年上半年研发费用率达23.71%，远超三星（11.74%）、SK海力士（7.39%）、美光（10.66%）同期水平。 #后道测试基地二期：总投资108亿元，建设周期37个月，计划建设一座测试工厂，为DRAM存储芯片提供测试及模组组装。公司表示，随着产能提升和产品种类增多，外部封测产能不足问题逐步凸显，自建测试产能可保障供应链安全并完善IDM运营模式。 受益标的： 长鑫科技：公司受益于DRAM需求增长，根据9月2日外发报告，预计2026-2028年公司的营业收入为3262.05/4481.24/7585.82亿元，归母净利润为1544.11/2180.47/4071.42亿元，给予“买入”评级。 设备：北方华创、中微公司、拓荆科技、中科飞测等； 材料：鼎龙股份、上海新阳、南大光电； 封装：通富微电、长电科技、汇成股份。 ⚠️ 风险提示：DRAM行业周期波动风险，技术研发及产能建设进度不及预期，国际贸易摩擦及设备供应风险。#文字观点", "publish_time": "2026-10-01 21:04", "tags": ["文字观点"]}, "post:2026-10-01T10-08:f84067602447": {"id": "post:2026-10-01T10-08:f84067602447", "kind": "post", "title": "2026-10-01 10:08", "source_label": "帖子正文", "excerpt": "特朗普： 今天，我很高兴地宣布，最后一批美军即将撤离伊拉克！当初我们因为糟糕的决策而陷入这场泥潭，已经过去了很长时间，但很快，这一切都将成为历史。", "content": "特朗普： 今天，我很高兴地宣布，最后一批美军即将撤离伊拉克！当初我们因为糟糕的决策而陷入这场泥潭，已经过去了很长时间，但很快，这一切都将成为历史。今天对美国来说是伟大的一天，更重要的是，我们离开时，伊拉克拥有了一位杰出的新总理——阿里·扎伊迪，我从一开始就支持他，并给予他全力支持。他赢得了一场原本不被看好的选举，而且是以压倒性优势获胜！ “坚定决心行动”于 2003 年在乔治·W·布什总统任期内启动，并在 2014 年巴拉克·侯赛因·奥巴马和“瞌睡乔”拜登的领导下继续进行，将于 2026 年在唐纳德·J·特朗普总统的领导下结束。今天是美国的胜利，是伊拉克的胜利，也是对“伊斯兰国”的决定性胜利。“伊斯兰国”已被特朗普政府第一任期彻底摧毁，其他一些极其邪恶和危险的势力也未能幸免。与阿富汗不同，阿富汗留下了大量军事装备和其他物资，13 名战士阵亡，多人重伤。此次联军部队和装备有序撤离埃尔比勒空军基地，标志着这场代价高昂的“地狱之旅”的结束。我制定了明确的任务，为指挥官们提供了完成任务所需的工具，并且拒绝让临时驻军变成永久驻军。我可以选择留下或离开，但我毫不犹豫地认为，美国该回家了！总理扎伊迪非常出色，希望他能妥善处理一切。我们来到这里是为了对抗哈里发国。哈里发国已经不复存在。我们要回家了！", "publish_time": "2026-10-01 10:08", "tags": []}, "post:2026-10-01T16-19:e96ca819f446": {"id": "post:2026-10-01T16-19:e96ca819f446", "kind": "post", "title": "2026-10-01 16:19", "source_label": "帖子正文", "excerpt": "【中泰电子|美光】业绩超预期，SCA增至26份，CY27—CY28供需预计进一步趋紧！‼️美光发布FY26Q4财报（26/05/29—26/09/03），营收、毛利率及EPS均创公司历史新高，高于此前公司指引！", "content": "【中泰电子|美光】业绩超预期，SCA增至26份，CY27—CY28供需预计进一步趋紧！ ‼️美光发布FY26Q4财报（26/05/29—26/09/03），营收、毛利率及EPS均创公司历史新高，高于此前公司指引！ 【营收】542.29亿美元，qoq+30.8%，yoy+379.3%，高于公司指引中值500亿美元，高于此前BBG预期的514.30亿美元。 【净利润】383.98亿美元（非GAAP口径），qoq+33.1%，yoy+1006.9%，高于此前BBG预期的364.96亿美元。 【毛利率】87.0%，qoq+2.1pcts，yoy+41.3pcts，高于公司指引的约86%。 【净利率】70.8%，qoq+1.2pcts，yoy+40.1pcts。存储价格继续上涨，价格与出货增长共同推动收入提升！ 1）分产品看：FY26Q4 DRAM/NAND营收分别为397.71/141.02亿美元，占总收入73%/26%，收入qoq+27%/+42%；其余约1%主要来自NOR等产品。 ➠DRAM位元出货环比中个位数增长，ASP环比增长约10%高段。 ➠NAND位元出货环比约+10%，ASP环比约+30%。 2）分应用看：FY26Q4云内存/核心数据中心/移动与客户端/汽车与嵌入式收入分别占30%/33%/24%/13%，收入qoq+18%/+56%/+14%/+47%，yoy+258%/+1042%/+249%/+376%；毛利率分别为83%/90%/90%/84%，qoq持平/+2.9pcts/+2.6pcts/+4.7pcts。 ➠FY26Q4数据中心SSD收入接近100亿美元，为上年同期的10倍以上，占公司NAND收入超过2/3；AI推理中的KV cache卸载及替代HDD需求进一步拓展SSD市场。 ➠移动与客户端业务收入增长由涨价和产品结构改善推动，位元出货下降形成部分抵消。公司聚焦高端PC和旗舰手机，FY26Q4该业务近一半收入来自1-gamma产品。 3）供需展望：公司预计CY27、CY28存储供需将较CY26更紧张，DRAM和NAND均面临供应约束，尚无法确定供需恢复平衡的时间。Agentic AI带动CPU及配套DDR、LPDDR和SSD需求；HBM占比提升、后续代际对晶圆产能的消耗增加，以及新洁净室建设和爬坡周期较长，继续制约供给增长。预计CY27、CY28行业DRAM位元出货增长处于20%低段，NAND约20%中段。CY27 HBM协议价格显著提升，先进节点持续爬坡！ 1）HBM：FY26Q4 HBM收入增速高于公司整体收入增速，HBM4爬坡顺利。公司已就CY27绝大部分HBM位元供应达成协议，价格同比显著上涨，新价格从CY27年初开始执行，有望缩小HBM与常规DRAM的毛利率差距。 ➠公司正与英伟达合作开发定制HBM4E方案NVHBM，用于下一代GPU及NVLink Fusion平台。洁净室准备进度快于计划，预计CY27年初开始产出。 2）DRAM/NAND：1-gamma DRAM及G9 NAND已成为公司当前产量最大的节点。下一代1-delta DRAM及下一代NAND节点研发进展顺利，预计CY27H2开始量产。SCA增至26份，资本开支上调以保障长期供应！ 1）SCA：已签署26份多年期take-or-pay协议，较上季16份增加10份，预计对应收入占截至CY30年公司收入的35%以上。部分协议延伸至2031年，客户财务承诺增至320亿美元，绝大部分为现金订金。 ➠预计SCA收入的四分之三具有明确的定价框架，其余四分之一根据市场价格定期议价，新协议定价继续提高。 ➠FY27超过75%的出货已获客户承诺，客户供应分配讨论已推进至CY28。 2）Capex：FY26净资本开支273.67亿美元，其中FY26Q4为107.74亿美元；FY27Q1净资本开支预计约115亿美元。计划上调FY27资本开支，增量主要投向CY28末及以后洁净室供给。 ➠爱达荷ID1及台湾铜锣厂预计CY27年中分别开始晶圆产出及实现有效出货，ID2、日本扩建厂及新加坡NAND新厂预计CY28开始陆续产出，纽约首厂预计CY30开始晶圆产出。下季营收继续增长，毛利率短期受激励薪酬影响！ FY27Q1营收指引615±15亿美元，中值qoq+13.4%；非GAAP毛利率指引约86.25%，qoq-0.75pcts；EPS指引38.15±1.00美元。预计FY27各季度收入环比增长，FY27Q1毛利率主要受到FY26制造端激励薪酬上调后计入库存、并随销售结转成本的影响，为全年低点，此后毛利率进一步提高，价格继续温和上涨。持续关注存储行业供需紧张及产品结构升级，重点跟踪CY27 HBM新价格兑现、SCA执行及新增产能爬坡。 风险提示：下游增长不及预期。派点请支持中泰电子：王芳/杨旭/丁贝渝/张心阳#文字观点", "publish_time": "2026-10-01 16:19", "tags": ["文字观点"]}, "attachment:files/瑞银证券-江淮汽车-600418-尊界盈利延后，调降评级至卖出.pdf": {"id": "attachment:files/瑞银证券-江淮汽车-600418-尊界盈利延后，调降评级至卖出.pdf", "kind": "attachment", "title": "瑞银证券-江淮汽车-600418-尊界盈利延后，调降评级至卖出", "source_label": "瑞银证券", "excerpt": "abc 2026 年 09 月 17 日Global Research 江淮汽车 尊界盈利延后，调降评级至卖出 尊界的盈利可见度下降 年初至今，江淮汽车股价大跌60%以上，大于A股乘用车板块约 30%的跌 幅，主要是年初至今尊界 S800销量走弱，行业对标公司赛力斯业绩持续低 于预期，令投资者担忧与华为合作费用投入太高，或压制了整车厂利润率。尊界8月推出了新", "content": "abc 2026 年 09 月 17 日Global Research 江淮汽车 尊界盈利延后，调降评级至卖出 尊界的盈利可见度下降 年初至今，江淮汽车股价大跌60%以上，大于A股乘用车板块约 30%的跌 幅，主要是年初至今尊界 S800销量走弱，行业对标公司赛力斯业绩持续低 于预期，令投资者担忧与华为合作费用投入太高，或压制了整车厂利润率。 尊界8月推出了新的 MPV车型， MPV是小众车型，销量表现一般；我们预计 主流SUV品牌或在明年下半年才能上市，利润贡献或等到 2028年后。我们大 幅下修公司 2026-28年利润预期，从 3/50/83亿元大幅下修至 -11/0/16亿元， 我们的利润预期远低于市场一致预期，我们认为市场对尊界的盈利可能性过 度乐观：我们预期 2028年尊界品牌销量 4万台，单车盈利 1.5万，利润贡献 6 亿元，净利率 3%，远低于市场预期的 5万台以上，单车盈利 8万元，利润贡 献40亿以上，净利率 10%。调降评级至卖出。 尊界品牌或到 2028年才开始盈利 我们判断尊界品牌可以实现盈亏平衡，但扭亏时间或从 2026年延后至 2028 年，主要由于 1）主流的 SUV产品或在 2028年才贡献营收和利润； 2）参考赛 力斯财务，即使定位中高端品牌，净利率约 4%。我们估计 2026-28年尊界 销量分别为 1.5/2.0/4.0万台，营收贡献 100/125/235亿元，净利润贡 献-7/-2/6亿元，对应净利率分别为 -7/-2/3%。 我们大幅下调业绩预期 考虑到中国国内车市面临需求不振，成本高企，即使中高端品牌亦面临利润 率较大波动；而且尊界 S800销量也并不稳定，今年以来销量趋势走弱。因 此我们大幅下调 2026-28年盈利预测，从 3/50/83亿元大幅下修至 -11/0/16亿 元，我们将2026-28年每股盈利预测下调 443%/98%/80%，主要下调了尊界 品牌的销量与利润率预测。 估值:下调评级为卖出，目标价调降到 13元 调降评级至卖出，目标价从 53元大幅降低至 13元，隐含不到 12倍2028年预 期市盈率。我们的目标价基于 SOTP估值法。受尊界业务盈利延后拖累，我 们降低估值倍数。 其中尊界业务按照 2028年1倍预期市销率，高于蔚来 /理 想/小鹏2028年预期市销率约0.5倍左右（市场预期）， 考虑到 2028年后尊界 进入成熟放量期， 28年尊界收入增速料将快于新势力车企，且作为较为独特 的超高端豪华新能源车，其定价接近新势力的 2倍（之前为 2026年3.4倍预 期市销率），传统业务按照 2027年0.5倍市净率，与 A股传统乘用车同业接 近（之前为 2026年0.9倍预期市净率）。 重要数据 (Rmb百万) 12/23 12/24 12/25 12/26E 12/27E 12/28E 12/29E 12/30E 营业收入 45,016 42,202 46,569 58,349 62,487 74,946 76,477 78,084 息税前利润 (UBS) (1,514) (2,020) (1,932) (768) 320 2,141 2,186 2,233 净利润 (UBS) 152 (1,787) (1,701) (1,065) 86 1,636 1,702 1,767 每股收益 (UBS 稀释后 ) (Rmb) 0.07 (0.82) (0.78) (0.47) 0.04 0.73 0.75 0.78 每股股息净值 (Rmb) 0.02 0.00 0.00 0.00 0.01 0.22 0.23 0.24 净（债务） /现金 7,847 5,991 10,978 12,116 12,198 14,436 16,393 18,501 盈利能力和估值 12/23 12/24 12/25 12/26E 12/27E 12/28E 12/29E 12/30E 息税前利润率 % (3.4) (4.8) (4.1) (1.3) 0.5 2.9 2.9 2.9 ROIC (EBIT) % (38.4) (242.9) 79.4 16.1 (7.8) (48.3) (42.7 三款产品，即 SUV产品或在 2027年下半年上市。 年初至今，江淮股价已经下降了 60%以上，但目前市值仍有400多亿元，对应 3.6倍2027预期市 净率， 0.7倍2027预期市销率，均高于 A股乘用车行业平均。公司 2024-25年连续两年亏损，我们 认为2026年亦不乐观。新车型尊界 V800和V680属于小众 MPV车型，我们认为销量或 很难超预 期。目前市场一致预期， 仍期待2026年公司实现扭亏为盈，我们认为可 见度很低。 价值影响因素（2027E）尊界销量（台） 尊界毛利率（ %）尊界净利润（亿元） 24.0元 乐观情景 50,000 35% 5.0 13.0元 基准情景 20,000 31% -2.1 5.0元 悲观情景 15,000 25% -1.0 来源: 瑞银证券估算 公司是一家集商用车、乘用车及动力 总成研发、制造、销售和服务于一体的综合型汽车厂商 ... 关键问题 瑞银证券观点 论据 什么已反映在股价中？ 乐观/悲观情景分析 公司背景 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 zXwWrQrPvNuM6M8QbRmOpPsQsMiNnNvMlOoMxO8OqQpPMYoNtMuOrQvN 江淮汽车 2026 年 09 月 17 日 abc3江淮汽车 瑞银证券 研究 关键问题 关键问题 问：尊界品牌可否实现盈亏平衡？ 瑞银证券观点 我们判断尊界品牌可以实现盈亏平衡，但扭亏时间或从 2026年延后 至2028年，主要考虑 1）尊界产能 10万台，按照 40%产能利用率可以盈亏平衡估算，需要 4 万台年销量。目前推出的 轿车和MPV，都属于偏小众的车型，豪华 SUV 产品估计要等到 2027年下半年才上市， 真正贡献营收和利润或等 到2028年； 2）从赛力斯的财务表现来 看，跟华为深度合作，尽管可以获取较高的 产品均价和毛利率，但营业费用， 如销售费用和研发费用较高，导 致2024-25年销售净利率仅为4%。 3）目前，我们估计 2026-28年尊界销量分别为 1.5/2.0/4.0万台，营收贡 献100/125/235亿元，净利润贡献 -7/-2/6亿元，对应净利率分别 为-7/-2/3%。 图表1: 赛力斯季度利润和利润率 -10%-8%-6%-4%-2%0%2%4%6%8% (3,000) (2,000) (1,000) - 1,000 2,000 3,000 1Q24 2Q24 3Q24 4Q24 1Q25 2Q25 3Q25 4Q25 1Q26 2Q26(Rmb mn) Net profit (Rmb mn) NPM (%, RHS) 来源: 公司数据， Wind图表2: 尊界销量预测 - 5,000 10,000 15,000 20,000 25,000 30,000 35,000 40,000 45,000 2025 2026E 2027E 2028E 2029E 2030E(unit) Maextro S800 Maextro SUV Maextro MPV 来源: 公司数据，瑞银证券估算 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 江淮汽车 2026 年 09 月 17 日 abc4江淮汽车 瑞银证券 研究 盈利预测调整 由于国内新能源市场 竞争加剧，年初至今尊界 S800销量不及预期，尊界新 的MPV车型销量较淡，我们判断其新 SUV 车型上市时间或延后至 2H27，利 润贡献或延后至 2028年。我们大幅降低尊界的销量和利润率 假设，预 计2026-27年尊界销售持续亏损（此前预测盈利）， 2028年盈利预测下 调93%。因此，我们大幅下调 2026-28年盈利预测，从 3/50/83亿元大幅下修 至-11/0/16亿元。 图表3: 盈利预测变动 - 江淮汽车 来源: 瑞银证券估算 下调盈利预测后，江淮汽车 当前股价对应 3.6x 2027年预期市净率， 0.7x 2027年预期市销率，均高于 A股乘用车企业均值；我们认为江淮汽车 当前估 值反映市场对尊界成功放量及盈利改善的乐观预期，但未充分消化高端新能 源车市场竞争加剧，尊界新车发布潜在的推后，华为合作 模式下车企利润分 成较低等下行风险。 图表4: 市销率 - 江淮汽车 0.7 1.3 1.8 Sep-18 Sep-19 Sep-20 Sep-21 Sep-22 Sep 天强化的逻辑：美光FY2026 Q4营收、毛利率、EPS均创纪录且全部超出指引上限；2026全财年营收达到上一创纪录年度（2025财年）的3.5倍，数据中心营收增长至4倍，DRAM营收超过1,000亿美元；预计行业HBM需求增速持续快于DRAM，下一代DRAM/NAND节点研发进展顺利，预计2027日历年下半年量产。\u003c/li>\n\u003cli>今天出现的催化/验证：美光F4Q26收入$54.23bn，+31%QoQ/+379%YoY，non-GAAP GPM 87.0%，non-GAAP EPS $33.42；SCA增至26份，CY27—CY28供需预计进一步趋紧；长鑫科技拟使用超募资金合计180亿元，投建两大新项目，总投资349亿元，DRAM国产替代再提速。\u003c/li>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>\u003c/li>\n\u003cli>主线：通胀低于预期、地产反转与海外政策扰动。\u003c/li>\n\u003cli>今天强化的逻辑：美国8月核心PCE价格指数低于预期，GDP上修；美联储10月加息概率较一日前降13.8个百分点，年内至少再加息一次概率降至86.8%；地产股跌停后反转收红，指数端权重股撑住，上证收涨0.31%。\u003c/li>\n\u003cli>今天出现的催化/验证：标普500下跌25个基点收于7,652点，收盘竞价净卖出115亿美元；纳斯达克100上涨23个基点报30,408点；最后一批美军正在撤离伊拉克；国际原油期货三季度大涨超30%；微软三季度大涨超37%，市值增加超1万亿美元；美国财政部周四将回购至多60亿美元较长期国债。\u003c/li>\n\u003cli>\u003cstrong>新能源/汽车\u003c/strong>\u003c/li>\n\u003cli>主线：光伏价格、电池供货协议与汽车政策/评级变化。\u003c/li>\n\u003cli>今天强化的逻辑：PVInfoLink本周价格显示多晶硅致密料均价40.0元/kg，130μm的210尺寸硅片均价1.150元/片，182尺寸硅片价格1.000元/片；云南9月29日印发区域协同发展“十五五”规划，推动硅光伏产业提质升级，并培育新能源电池、新材料及先进装备制造业。\u003c/li>\n\u003cli>今天出现的催化/验证：亿纬与Fluence签署206GWh电池供货协议，协议约定2027年交付16GWh，2028-31年预留容量190GWh；江淮汽车尊界盈利可见度下降，调降评级至卖出，年初至今股价大跌60%以上，大于A股乘用车板块约30%跌幅；参议员将于11月寻求通过永久禁止中国汽车的议案；福耀玻璃-A当前股价对应12.1x 2027E PE，处于五年估值低位，2027E股息率达5.0%，剔除汇兑影响后1H26净利润仍约8%同比增长。\u003c/li>\n\u003cli>\u003cstrong>机器人/自动化\u003c/strong>\u003c/li>\n\u003cli>主线：AI机器人流量与物理AI需求。\u003c/li>\n\u003cli>今天强化的逻辑：全自动互联网流量（AI机器人）每秒请求增长超过100%；自动化流量中增长最快的部分已不再是爬虫，而是代理程序；物理AI长期需求方向，自动驾驶/人形机器人可能需要200GB以上DRAM、数TB存储，已有客户测试下一代产品。\u003c/li>\n\u003cli>今天出现的催化/验证：美国国防部长皮特·赫格塞斯宣布成立自主作战司令部，负责监督和协调无人机的研发和部署；五角大楼创建“自动战争司令部”以扩展人工智能和无人机能力。\u003c/li>\n\u003cli>\u003cstrong>商业航天/卫星\u003c/strong>\u003c/li>\n\u003cli>主线：SpaceX相关进展与卫星/航天催化。\u003c/li>\n\u003cli>今天强化的逻辑：SpaceX将使用退役的龙飞船为NASA发射新一批宇航员；马斯克表示SpaceX正与特斯拉合作，目标是每年生产200吉瓦的太阳能产品。\u003c/li>\n\u003cli>今天出现的催化/验证：高盛韩国收盘总结显示，KOSPI跌0.48%至6,838.0，成交额139亿美元，外资净流出15.16亿美元；KOSDAQ涨0.72%至855.9，成交额54亿美元，外资净流出0.51亿美元；机构同步抛售导致涨幅收窄。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>
