判断最早要到2028年市场才可能出现实质性宽松。基于当前水平风险/回报大致平衡，维持中性评级；若行业供给纪律持续至2028年及以后，将考虑转为更积极看法。 二、对覆盖板块的溢出效应 • 半导体设备：受2027财年资本开支指引上修及管理层关于洁净室与设备提前拉货的表态提振，对应用材料（AMAT，买入）和泛林集团（LRCX，买入）产生正面溢出。 • NAND：对闪迪（SNDK，买入）产生正面初步反应，因管理层对NAND供给格局给出积极表述。 三、季度业绩：全面跑赢高盛及市场预期 • 总收入：542.3亿美元，大幅高于高盛预估519.1亿美元及市场预期509.5亿美元。 • 毛利率：87.0%，略低于高盛87.3%但与市场86.9%基本持平。 • Non-GAAP EPS：33.42美元，高于高盛32.54美元及市场31.63美元。 • DRAM收入：398亿美元，高于高盛392亿美元及市场385亿美元。 • NAND收入：141亿美元，大幅高于高盛125亿美元及市场123亿美元。 四、战略客户协议：锁量锁价构筑盈利底 • 美光累计签署26份协议（上季度为16份），覆盖数据中心、消费、汽车等多终端，一般为期五年，含年度\"照付不议\"营收目标及预付款（迄今累计320亿美元）。 • 协议覆盖至2030财年约35%的预期营收，目标逐步提升至50%。 • 约75%的协议包含结构化定价条款。管理层披露，已签协议在保底价格下的五年承诺营收总额约1,500亿美元，且对应毛利率高于此前周期峰值水平。 • 合作方包括4家超大型客户（其中2家为超大规模云厂商）及3家中型客户。 五、制造与供给：资本开支大幅上修，全球产能加速落地 • 美光正加速全球晶圆厂建设与生产计划，2027财年资本开支将显著跃升——其中逾半数增量用于支持HBM及常规DRAM产能扩张。 • 从2026财年四季度108亿美元CapEx基数起步，2027财年一季度预计115亿美元、二季度135亿美元、下半年合计超250亿美元。高盛现模型化2027财年CapEx为550亿美元。 • 爱达荷首厂：提前至2027年年中产出。 • 新加坡工厂：2028年下半年产出。 • 广岛工厂：洁净室完工提前至2028年末。 • 纽约工厂：已破土动工，预计2030年供给。 六、DRAM：供给增速可控，HBM持续放量 • 美光预计2026年全球DRAM bit供给增速约25%区间中段（略高于此前预期），2027及2028年均为20%区间低端，市场紧俏程度较2026年进一步加剧。 • HBM方面：管理层此前预计2025年HBM基准TAM为350亿美元，行业营收至2028年可按40% CAGR增至超1,000亿美元。美光HBM供给年内持续爬坡，并披露正与英伟达合作开发定制HBM4E产品。 七、NAND：供给受限，bit增长依赖制程微缩 • 美光预计2026年NAND bit供给增速略低于25%区间低端。2027及2028年预计在25%区间中段，两年供给持续受限。 • 2027年前bit供给增长主要依赖设备升级与技术微缩，绿地新厂预计2028年年中才上线。 八、2027财年一季度指引：营收与EPS大幅超预期，毛利率承压 • 营收指引中值：6,150亿美元，大幅高于高盛5,770亿美元及市场5,757亿美元。 • Non-GAAP毛利率指引：86.25%，低于高盛88.1%及市场87.4%——主因本季度将销售高成本库存（受薪酬费用上升影响），该效应在二季度将部分消退。 • Non-GAAP EPS指引：37.15–39.15美元（中值38.15美元），高于高盛37.06美元及市场35.81美元。 九、盈利预测调整 高盛上调近期Non-GAAP EPS预估平均约10%，以反映更高的营收假设。具体调整幅度：2026日历年上调3.3%，2027日历年上调12.3%，2028日历年上调12.1%，2029日历年上调13.1%。毛利率预估小幅下调约40–70个基点。 十、目标价与估值 • 将目标价从1,100美元上调至1,250美元，基于18倍P/E（倍数不变）乘以正常化EPS预估70.00美元（此前为62.00美元，因营收与利润率假设上修）。 • 当前股价1,065.11美元，目标价隐含17.4%上行空间。 • 牛熊情景：牛案（19倍P/E × 84美元EPS）目标价1,596美元（+71.5%）；熊案（12倍P/E × 42美元EPS）目标价504美元（-45.8%）。 • 股息率约0.1%，总潜在回报约34.4%。 十一、评级与关键风险 维持中性评级。DRAM与NAND市场基本面持续健康，客户协议披露增强了周期盈利的持久性。但高盛担忧2028年供给大幅扩张可能导致HBM价格动能放缓，这是维持中性的核心原因。 关键上行风险：（1）HBM路线图执行与份额提升持续；（2）AI加速器HBM含量超预期跃升；（3）供给纪律长期维持。 关键下行风险：（1）CXMT（长鑫存储）持续获取DRAM份额冲击定价；（2）2028年供给释放超预期致HBM价格承压；（3）行业资本开支竞赛失控。#文字观点", "publish_time": "2026-10-02 11:55", "tags": ["文字观点"]}, "post:2026-10-02T11-54:e6588ba30aaf": {"id": "post:2026-10-02T11-54:e6588ba30aaf", "kind": "post", "title": "2026-10-02 11:54", "source_label": "帖子正文", "excerpt": "摩根大通——台积电（2330.TW）：预期三季度业绩强劲、四季度指引健康且产能爬坡加速——目标价上调至3300新台币 • 投资评级与估值：重申增持，目标价上调至3300新台币 摩根大通维持台积电增持评级，将2027年6月目标价由3200新台币上调至3300新台币，基于约20倍12个月远期市盈率。上调", "content": "摩根大通——台积电（2330.TW）：预期三季度业绩强劲、四季度指引健康且产能爬坡加速——目标价上调至3300新台币 • 投资评级与估值：重申增持，目标价上调至3300新台币 摩根大通维持台积电增持评级，将2027年6月目标价由3200新台币上调至3300新台币，基于约20倍12个月远期市盈率。上调依据为AI驱动的先进制程需求持续强劲、N3与N2产能扩张提速，以及A14制程节点提前量产带来的增量贡献。当前股价为2475新台币。 • 三季度业绩与四季度指引：全面超预期 预计台积电三季度营收将达指引区间上限，摩根大通预估为458.4亿美元，环比增长14%，毛利率约66.8%，亦处于指引高端。四季度营收指引预计环比增长10至12%，摩根大通预估为11%，受N3产能瓶颈及年内无进一步提价限制，全年美元营收增速预计达41%，略高于公司略超40%的指引。毛利率指引预计维持在65.5至67.5%区间，主因N2制程稀释效应及海外晶圆厂爬坡拖累。 • 先进制程供需格局：N3紧俏延续至2027年，N2成2028年核心引擎 N3产能持续吃紧，2027年供需缺口将较2026年的约60万片进一步扩大。英伟达预计将占据2027年N3晶圆出货量的55至60%，谷歌、AWS等需求亦强劲。N3紧张局面预计2028年才缓解，因更多产能上线且加速器与CPU需求向N2迁移。2028年N2产能预计达21万片月产能，成为主要增长驱动力，占晶圆总收入比重将从2027年的约20%升至30%以上。N2需求由旗舰加速器项目（英伟达Feynman、AMD MI500、谷歌TPU v9、AWS Trainium 4）及数据中心CPU（AMD Venice、英伟达Rosa、谷歌Axion 3、亚马逊Graviton 6等）共同拉动。 • A14制程提前量产：良率超预期，2028年下半年即可贡献营收 A14制程原定2028年量产、2029年产生营收，但近期供应链核查显示其风险试产可能提前至2027年上半年，量产爬坡提前至2028年上半年，2028年下半年即可录得约18亿美元营收。A14 SRAM及器件良率已达90%以上，初期量产将在新竹Fab 20展开，后续扩展至台中Fab 25及高雄Fab 22。台积电正尝试将HPC需求与智能手机需求分流至不同节点，以避免当前N3全面拥挤的局面。 • 2027年全面提价与混合均价跳升 受强劲AI需求及代理式AI等新用例驱动，2027年台积电将实施更广泛的晶圆提价：先进制程（N3、N2）涨幅约10%，成熟制程（N7及以上）将迎来自本轮AI半导体上行周期以来的首次提价，幅度为低至中个位数。叠加N2与N3占比提升（2027年约占晶圆销售60%，2026年为40%）及N3产能更多倾斜至HPC（较移动芯片溢价20至25%），预计2027年混合晶圆均价将同比上涨25%，支撑毛利率维持在65至70%区间。 • 资本开支大幅上修：2026至2028年累计或达2500亿美元 为支持N3、N2及A14激进的产能爬坡，摩根大通将台积电2026至2028年资本开支预期分别上调至640亿、860亿及1000亿美元。N3产能预计2028年底达25万片月产能峰值，N2产能2027年底及2028年底分别达11.8万及21万片。此外，美国德州第二晶圆集群传闻具备可信度，但最终决策阶段可能落在2030年之后，近期美国产能扩张仍集中于亚利桑那州。 • 竞争格局：N2节点市占率料维持95%以上 英特尔18A等效于台积电N3E，14A（2028年底量产）等效于N2或N2P，仍落后台积电A14。在极端产能紧张下，英特尔与三星代工或获得部分非关键项目份额（如ADAS、智能网卡、低端苹果项目及HBM基底芯片），但N2节点台积电市占率预计稳守95%以上。后端封装领域，英特尔EMIB-T构成一定竞争，但台积电3DSoIC与COUPE平台有望分别成为3D封装与CPO的行业标准，延续CoWoS在2.5D封装的统治地位。 • 毛利率展望：中高位60%区间震荡，2027年底至2028年初或逼近70% 未来数季毛利率受N2稀释及海外厂爬坡影响，预计维持在65至70%中高位区间。2027年一季度起提价生效、N3需求强劲及跨晶圆厂协作将部分对冲N2稀释。待N2稀释效应减弱（预计2027年底或2028年初），毛利率有望逼近70%。 • 盈利预测与财务预测 因N3与N2需求强于预期、毛利率展望略优及A14提前量产，摩根大通将2027年及2028年每股盈利预测分别上调5%及6%至147.80新台币及190.42新台币。2026至2028年营收预计分别为5.47万亿、7.60万亿及9.82万亿新台币，同比增幅为44%、39%及29%。调整后净利润分别为2.82万亿、3.83万亿及4.94万亿新台币。 • 关键风险 下行风险包括AI资本开支增长周期持续性存疑，以及2026年下半年PC与智能手机需求疲弱带来的负面冲击。#文字观点", "publish_time": "2026-10-02 11:54", "tags": ["文字观点"]}, "post:2026-10-02T19-17:afdb83dd80db": {"id": "post:2026-10-02T19-17:afdb83dd80db", "kind": "post", "title": "2026-10-02 19:17", "source_label": "帖子正文", "excerpt": "美光 26 财年第四季度业绩启示：资本开支与存储供需美光（MU，未评级）于美国时间 9 月 30 日公布 2026 财年第四财季（6‑8 月）业绩。第四财季总销售额达 542 亿美元，环比增长 31%、同比增长 379%，季度环比、同比均维持高速增长态势。", "content": "美光 26 财年第四季度业绩启示：资本开支与存储供需美光（MU，未评级）于美国时间 9 月 30 日公布 2026 财年第四财季（6‑8 月）业绩。 第四财季总销售额达 542 亿美元，环比增长 31%、同比增长 379%，季度环比、同比均维持高速增长态势。 实际销售额大幅超出业绩指引区间（指引 500 亿美元，上下浮动 10 亿美元）。 2026 财年全年资本开支达 273 亿美元，同比增长 98%，略高于此前 270 亿美元的指引。 2027 财年资本开支指引为上半年 250 亿美元，下半年 250 亿美元以上，计划新增资本开支主要用于晶圆厂及配套建设。 第四财季（2026 财年）业绩：销售额 542 亿美元，环比增长 31%，同比增长 379%。 这已经是公司销售额连续第 12 个季度实现同比增长；自 2023 财年第二财季触底至 36.9 亿美元之后，销售额已连续 13 个季度环比走高。 市场一致预期为 513 亿美元。 第四财季毛利率 87.0%，环比提升 2.1 个百分点，同比提升 41.3 个百分点，高于 86% 的业绩指引。 营业利润达到 437 亿美元，环比增加 104 亿美元，同比增加 400 亿美元，实现连续 11 个季度正增长。 每股收益 33.40 美元，超出指引上限 31.00 美元（上下浮动 1 美元），市场一致预期为 31.20 美元。 存货规模 103 亿美元，环比增长 21%；存货周转天数 129 天，较第三财季增加 9 天。 第四财季期末存货有所上升，部分原因在于对即将停产产品进行备货，但存储行业整体供需格局依旧紧张。 2026 财年全年销售额 1332 亿美元，同比增长 256%，大幅刷新历史最高纪录。 2027 财年第一财季业绩指引：销售额 615 亿美元，上下浮动 15 亿美元，环比增速 13%，浮动正负 3 个百分点；市场一致预期 573 亿美元。 预计毛利率约 86.25%。 每股收益指引 38.15 美元，上下浮动 1 美元，市场一致预期 25.70 美元。 资本开支情况：第四财季净资本开支 107 亿美元，环比增加 30 亿美元，同比增加 51 亿美元。 2026 财年全年净资本开支 273.7 亿美元，同比增加 80 亿美元。 本财年初资本开支指引为 180 亿美元，到第三财季上调至 270 亿美元，实际资本开支略高于该水平。 第四财季资本强度 19%，全年资本强度 20%。 针对 2027 财年，公司预计第一财季净资本开支 115 亿美元，上 ptical Transceivers More Likely to Come in at 3.2T Recent DC meetings highlight 3.2T as the most lik", "content": "M Update Telecom & Networking Equipment | North America Potential FCC Rules on Optical Transceivers More Likely to Come in at 3.2T Recent DC meetings highlight 3.2T as the most likely generation to see restrictions on China-based optical transceivers. This echoes conversations with LITE during the Q noting that any restrictions would need to be phased in. See potential rules keeping laser market tight, a pos for LITE/COHR. Morgan Stanley & Co. LLC Meta A Marshall Equity Analyst Meta.Marshall@morganstanley.com +1 212 761-0430 Antonio Jaramillo Research Associate Antonio.Jaramillo@morganstanley.com +1 212 761-4438 Morgan Stanley Asia (Singapore) Pte.+ Daniel K Blake Equity Strategist Daniel.Blake@morganstanley.com +65 6834-6597 Morgan Stanley Asia Limited+ Andy Meng, CFA Equity Analyst Andy.Meng@morganstanley.com +852 2239-7689 Morgan Stanley MUFG Securities Co., Ltd.+ Yu Shirakawa Equity Analyst Yu.Shirakawa@morganstanleymufg.com +81 3 6836-5432 Telecom & Networking Equipment North America Industry View In-Line What Happened: Morgan Stanley strategists recently met with a senior Washington telecom, FCC and export-control legal team with direct engagement across the White House and FCC. Discussion focused on the Administration’s efforts to reduce reliance on Chinese technology, with the FCC Covered List emerging as the more likely near-term mechanism for optical transceivers (a note we made in our AI Safety DC trip wrap-up last week ). Policy discussions suggest 3.2T transceivers would likely be where restrictions would be phased in, potentially as soon as October, with industry recently asked to demonstrate credible U.S. or friend-shoring plans before 3.2T becomes broadly deployed. Our conversations noted that discussions are also indicating Chinese-built transceivers could still be importable, even at 3.2T, as long as 65% of the BOM comes from US-based companies (DSP / laser would get you pretty close). Initial 3.2T volumes are not expected to ramp in volume until 2029, limiting the near-term revenue impact of a restriction even if action comes sooner. We would see these rules as having the potential to avoid creating a constraint on hyperscalers' ability to build today, but keeping the laser market tighter given laser would largely need to be from a US-based vendor to meet a 65% value threshold, a positive for LITE/COHR. How this echoes conversation with LITE earlier in the quarter: We hosted LITE at Nasdaq Asia in late August , where we asked the company about potential FCC rules. At the time they noted that the FCC had been in contact with them about potential Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. Key Takeaways Recent DC trip by our strategist team gave a greater idea of what potential FCC rules on optical transceivers could look like. Potential restrictions, likely to come in at 3.2T, limit Chinese-based transceivers, with a potential workaround if US-based content above 65% of the BOM. Solution seemingly a win-win for LITE/COHR, with laser market likely to stay tight, but not having to take on lower module assembly business. Also, does not create bottlenecks for hyperscalers. Assuring InP substrate delivery will be key to look at going forward. October 1, 2026 04:09 AM GMT Not for redistribution without written consent of Morgan Stanley M更新 电信与网络设备\u0003| 北美 针对光收发器的潜在美国联邦 通信委员会规定更可能在3.2T阶段 落地 近期在华盛顿特区举办的多场会议凸显，3.2T是最有可能对中国本 土光收发器施加限制的一代产品。这与我们在季度财报期和LITE交 流时的结论相呼应，当时对方指出任何限制措施都需要分阶段落地。 相关潜在监管规则将维持激光市场供应紧俏，对LITE/COHR构成利 好。摩根士丹利有限责任公司 Meta A Marshall股票分析师\u0003Meta.Marshall@morganstanley.com\u0003 +1 212 761-0430 Antonio Jaramillo研究助理\u0003 Antonio.Jaramillo@morganstanley.com\u0003+1 212 761-4438摩根士丹利亚洲（新 加坡）私人有限公司+ Daniel K Blake股票策略师\u0003Daniel.Blake@morganstanley.com\u0003 +65 6834-6597摩根士丹利亚洲有限公司+ Andy\u0003Meng,\u0003特许金融分析师股票分析师\u0003 Andy.Meng@morganstanley.com\u0003+852 2239-7689 摩根士丹利三菱日联证券有限公司+ Yu Shirakawa股票分析师\u0003Yu.Shirakawa@morganstanleymufg.com\u0003 +81 3 6836-5432 电信与网络设备 北美行业观点 同步大市 事件概要：\u0003摩根士丹利的策略师近期与直接对接白宫及美国联邦通信委员会的华 盛顿资深电信、FCC及出口管制法律团队会面。讨论聚焦于美国政府降低对中国 技术依赖的相关举措，目前来看FCC受控清单更有可能成为针对光收发器的近期 落地机制（我们在上周的人工智能安全华盛顿之行总结中就曾提及这一点）。政 策讨论显示，相关限制或将率先针对3.2T收发器逐步落地，最早可能于10月就推 出，近期相关部门已要求行业在3.2T大规模部署前拿出可信的美国本土或友岸外 包生产方案。我们的沟通内容还显示，即便到了3.2T阶段，中国制造的收发器仍 可进口，前提是物料清单中65%的份额来自美国企业（数字信号处理器/激光器的 占比就几乎能达到这一要求）。3.2T收发器的初始出货量预计要到2029年才会显 著攀升，因此即便相关限制更早落地，其对营收的短期影响也十分有限。我们认 为这些规则既有可能避免对超大规模云服务商当前的建设能力造成约束，也会令 激光市场的供应格局更为紧张——因为要满足65%的价值占比要求，激光器大部 分将采购自美国本土厂商，这对LITE和COHR而言是利好。 这与本季度早些时候和LITE的对话有何呼应：我们在8月下旬的纳斯达克亚洲活动上 接待了LITE，我们在活动中向该公司询问了潜在的美国联邦通信委员会规定相关事宜。 当时该公司表示，美国联邦通信委员会已就相关潜在事项与其取得了联系摩根士丹利目前与摩根士丹利研究部覆盖的多家公司存在 业务往来，且有意持续拓展此类合作。因此，投资者应当 知晓，本公司可能存在利益冲突，进而对摩根士丹利研究 部报告的客观性造成影响。投资者在制定投资决策时，仅 应将摩根士丹利研究部的内容作为参考因素之一。 有关分析师认证及其他重要披露信息，请参阅披 露章节，位于本报告末尾。 += 受雇于非美国关联机构的分析师未在美国金融业监管局 注册，不属于会员公司的关联人员，且可能不受美国金融 业监管局针对研究分析师账户的相关限制约束，这类限制 包括与标的公司沟通、公开露面以及所持证券的交易行为。核心要点 我们的策略团队近期前往华盛顿特区的行程，让我们更清晰地了解到美国联 邦通信委员会针对光收发器的潜在美国联邦通信委员会规定可能的形态。 预计将针对3.2T产品出台的潜在限制会约束中国本土收发器厂商，若物料清 单中美国原产内容占比高于65%，则存在可行的规避方案。 该方案对LITE/COHR而言看似是双赢局面，激光市场大概率将维持紧俏态 势，且两家企业无需承接附加值较低的模块组装业务。 此外，该安排也不会给超大规模云服务商造成瓶颈。 确保磷化铟衬底的交付将是后续需要重点关注的核心事项。2026年10月1日\u0003上午04:09\u0003格林尼治标准时间 未经摩根士丹利书面许可，不得转载分发。本文档仅供三有 ina-based lasers while allowing them to remain relevant at the module level, reducing the risk from China-based laser makers. We therefore see a stronger read-through for high-speed laser pricing and LITE/COHR component share than for a wholesale redistribution of transceiver share. 3. Replacement capacity not ready; nor is it the most attractive opportunity - As noted above, LITE noted that assembly of transceivers (mid-30's to low- 40s gross margin product), is not the most attractive opportunity for US- based optical companies (vs. EMLs and lasers well north of 50% steady state and approaching 75% today). While 3.2T is not yet in production, we use AAOI's current 800G and 1.6T capacity ramp as an illustration of the scale of US supply available to absorb a potential future demand shift. AAOI (not covered), the only material US-based production of transceivers, is currently ramping capacity. AAOI exited Q2 with manufacturing capacity approaching 200,000 800G and 1.6T units per month and expects to reach ~650,000 units per month by year-end 2026, while management continues to expect demand to outpace production through mid-2027. AAOI’s YE26 capacity annualizes to ~12M 800G/1.6T units, versus ~101M units combined for Innolight and Eoptolink based on annualized 1H capacity (44.3M and 56.7M, respectively), or >8x AAOI. Based on AAOI’s year-end capacity plans and our Internet team’s hyperscaler capex work, we estimate AAOI could support less than 4 GW of hyperscaler capacity even before M更新 2相关规则，该公司指出他们的反馈是这些规则需要逐步分阶段推行，以避免市场 出现严重的供需错配问题当前60%-65%的收发器均来自中国本土收发器厂商。他 们还表示，在现有定价体系下，仅靠收发器的销量规模本身并非他们最有意愿承 接的高吸引力业务。这些规则既采用分阶段落地模式，又不会限制中国组装厂商， 只要足够多的产品组件来自美国本土，似乎就可以同时解决上述两方面的顾虑。 我们的观点： 1. 3.2T似乎是当前政策的主要施压点，但其短期影响应当十分有限——美国 政府的相关举措重心似乎放在3.2T形成规模化出货前重塑供应链，而非打乱 目前已成熟的800G光模块和1.6T光模块市场基本盘。由于3.2T的量产推进预 计要到2028年才会启动，大范围普及更是接近2029年，10月落地的受控清 单相关举措将留出约两年的缓冲期，之后相关产品才会形成大规模市场交付 量。超大规模云服务商已经在筹备相关计划，意在展示其提升美国本土或友 岸制造占比的布局，这表明政策目标正逐渐转向确定下一代产品的生产选址， 而非立即替代当前来自中国的成熟供应链供给。 2. 激光器定价的信号参考性要强于光 Research: Arista Networks, Axon Enterprise Inc, Ciena Corporation, Cisco Systems Inc, Coherent Corp, Corning Inc, F5 Inc, Keysight Technologies Inc, Lumentum Holdings Inc, Motorola Solutions Inc, Zebra Technologies Corporation. Within the last 12 months, Morgan Stanley managed or co-managed a public offering (or 144A offering) of securities of Axon Enterprise Inc. Within the last 12 months, Morgan Stanley has received compensation for investment banking services from Axon Enterprise Inc, Coherent Corp, Zebra Technologies Corporat", "status": "extracted"}, "post:2026-10-02T18-03:610d2bbb26d8": {"id": "post:2026-10-02T18-03:610d2bbb26d8", "kind": "post", "title": "2026-10-02 18:03", "source_label": "帖子正文", "excerpt": "亚马逊寻求向投资者转让价值 80 亿美元的 Nvidia 芯片 向投资者转让 Nvidia 昂贵的 Grace Blackwell 芯片，将使亚马逊能够在其资产负债表上采取更轻资产的模式。据知情人士透露，亚马逊正寻求通过一种新的工具向外部投资者转让价值约80 亿美元的先进 Nvidia 芯片，旨在增", "content": "亚马逊寻求向投资者转让价值 80 亿美元的 Nvidia 芯片 向投资者转让 Nvidia 昂贵的 Grace Blackwell 芯片，将使亚马逊能够在其资产负债表上采取更轻资产的模式。 据知情人士透露，亚马逊正寻求通过一种新的工具向外部投资者转让价值约80 亿美元的先进 Nvidia 芯片，旨在增强其资产负债表。 这家总部位于西雅图的云巨头在最近几周与投资者进行了会谈，以评估对该交易的兴趣。该交易将允许该公司将其在美国各地数据中心部署的数千颗 Grace Blackwell 芯片剥离到一个特殊目的载体（SPV）中。 随后，亚马逊将从该 SPV 租回这些先进的 AI 芯片，而该 SPV 将通过发行债券吸引外部投资者。通过向投资者转让这些昂贵的半导体，该公司可以在其资产负债表上采取更加轻资产的策略。 亚马逊拒绝置评。 这一拟议举措出台之际，科技巨头们正寻求创意方式，为数据中心基础设施的巨额支出筹集资金。这些设施建设相关的大部分成本都与用于训练先进人工智能模型的芯片挂钩。 科技公司正采取一系列策略将债务移出资产负债表，以维持其信用评级。他们利用残值担保，向贷款人提供有关芯片或数据中心未来价值的保证，而无需自行借入现金为项目融资。这种做法掩盖了科技巨头所承担的风险程度。 投资者预计，基于亚马逊目前的双 A 信用评级，该实体将获得投资级信用评级，从而为保险和养老基金等更广泛的投资者群体参与交易铺平道路。 知情人士补充称，亚马逊还计划提供该工具高达 10% 的股权，这意味着它将不持有该实体的任何股份。亚马逊与投资者之间的讨论仍在进行中，可能会发生变化。 知情人士补充称，亚马逊购买或租赁了该提议交易中涉及的芯片，这些芯片已部署在包括内华达州和弗吉尼亚州在内的五个州的十几个美国数据中心。 英伟达的 Grace Blackwell 芯片是该半导体公司最先进的产品之一，但很快将被其最新的 Vera Rubin 产品所取代。 领先的 AI 实验室，如 OpenAI 和 Anthropic（亚马逊已承诺向后者投资高达830 亿美元），使用最新的芯片来训练其模型。前几代芯片则继续用于运行应用程序。根据监管文件，亚马逊预计每系列半导体的寿命至少为五年。 亚马逊预计今年的资本支出将达到2200 亿美元，其中大部分将分配给其云部门 AWS，用于购买先进芯片以及更大规模的 AI 数据中心建设。 该公司已进入市场寻求资金以支持这项投资。今年 3 月，由于需求强劲，该公司将公司债券发行计划从 370 亿美元增加至约 500 亿美元。该公司在 7 月发行 250 亿美元债券时，面对长期债务需求减弱的局面，投资者要求更高的收益率。 以图形处理器（GPU）为抵押的融资已在 CoreWeave 等公司中流行起来，这些公司利用其现成的芯片资源来支持借贷。 为了降低客户的借贷成本，英伟达在 8 月份提议通过一个与华尔街主要机构合作的 5000 亿美元融资平台，为高达 1250 亿美元的此类债务提供担保。#文字观点", "publish_time": "2026-10-02 18:03", "tags": ["文字观点"]}, "post:2026-10-02T14-36:277a24b3bfac": {"id": "post:2026-10-02T14-36:277a24b3bfac", "kind": "post", "title": "2026-10-02 14:36", "source_label": "帖子正文", "excerpt": "亚马逊正在寻求向投资者出售一批价值约80亿美元的 Nvidia 芯片。此举旨在改善这家科技集团的资产负债表，同时帮助其投资者。", "content": "亚马逊正在寻求向投资者出售一批价值约80亿美元的 Nvidia 芯片。 此举旨在改善这家科技集团的资产负债表，同时帮助其投资者。 亚马逊正在与投资者洽谈，将其持有的部分 Nvidia 芯片转让出去。 该公司希望通过出售这些芯片，提高资产负债表的灵活性，并减少相关资本投入。 据报道，亚马逊已与投资者讨论出售数千颗 Nvidia 的 Grace Blackwell 芯片，这些芯片目前用于其数据中心。 这些芯片是人工智能基础设施的重要组成部分。 亚马逊表示，正在探索新的融资方式，以支持其不断扩大的人工智能业务。 该公司拒绝对此发表评论。 拟议中的交易是科技巨头寻找创新融资方式的一部分。 随着人工智能数据中心投资持续增加，企业正在寻找新的资金来源。 投资者预计将获得与亚马逊信用评级相关的投资级信用评级。 亚马逊也在考虑提供最高约30%的股权权益。 此前，亚马逊已经采购了大量 Nvidia 芯片，用于建设人工智能计算基础设施。 Nvidia 的 Grace Blackwell 芯片是半导体行业中较新的产品，预计未来几年需求仍将保持强劲。 包括 OpenAI 和 Anthropic 在内的人工智能公司，都依赖大量先进芯片来训练和运行模型。 亚马逊预计将在未来几年投入数十亿美元用于资本支出，其中大部分资金将用于云计算和人工智能基础设施。 该公司已经在市场上寻找融资方式，包括发行债券等。 一些投资者担心人工智能基础设施投资可能带来长期资本压力。 通过出售部分 Nvidia 芯片，亚马逊可以释放资金，并降低资产负债表压力。#文字观点", "publish_time": "2026-10-02 14:36", "tags": ["文字观点"]}, "post:2026-10-02T18-02:09d4eb9b2974": {"id": "post:2026-10-02T18-02:09d4eb9b2974", "kind": "post", "title": "2026-10-02 18:02", "source_label": "帖子正文", "excerpt": "摩根大通：英伟达 Vera Rubin Ultra 与 AWS Trainium 3 液冷机柜冷却部件价值大幅提升 英伟达与 AWS 新一代液冷机柜的冷却零部件金额出现明显上涨。成本上升的原因并不是简单的降规格，而是GPU/ASIC 功耗提升、冷板设计复杂度提高、快拆接头（QD）规格升级共同造成。", "content": "摩根大通：英伟达 Vera Rubin Ultra 与 AWS Trainium 3 液冷机柜冷却部件价值大幅提升 英伟达与 AWS 新一代液冷机柜的冷却零部件金额出现明显上涨。 成本上升的原因并不是简单的降规格，而是GPU/ASIC 功耗提升、冷板设计复杂度提高、快拆接头（QD）规格升级共同造成。 第一部分：NVIDIA NVL72 机柜冷却部件价值 不包含 CDU 设备的单台机柜冷却部件价值大致如下。 GB300 NVL72 机柜，冷却部件约 48250 美元。 Vera Rubin NVL72 机柜，冷却部件约 66250 美元。 Vera Rubin Ultra（VRU）NVL72 机柜，冷却部件约 98500 美元。 GPU 热设计功耗从 GB300 的 1400 瓦提升至 Vera Rubin 的 2300 瓦，Vera Rubin Ultra 预计进一步达到约 2600 瓦。 Vera Rubin Ultra 的量产时间预计落在 2027 年下半年，这是观察机柜级热管理方案落地的关键里程碑。 运算托盘，每台机柜配置 18 个。 GB300 机型每个运算托盘约 1500 美元。 Vera Rubin 机型每个运算托盘 2000‑2500 美元。 Vera Rubin Ultra 机型每个运算托盘 3000‑3500 美元。 Vera Rubin Ultra 采用双面冷板方案，Bianca 模组一共需要 6 片冷板，正面 2 片、背面 4 片，另外还要配置 CX‑9 以及 PDB 冷板。 垂直供电设计把电源元器件与 SOCAMM 移到电路板背面，因此必须使用双面冷却方案；高带宽内存上方贴附钻石铜材质，用来强化热传导能力，同时抬升零部件单价。 交换托盘配置情况。 GB300 与 Vera Rubin 机柜均配置 9 个交换托盘。 Vera Rubin Ultra 依旧配置 9 个交换托盘，但升级为 1.5U 双层板设计，单托盘冷却部件价值超过 3000 美元。 三代产品的机柜歧管采购金额均约 10000 美元。 第二部分：快拆接头（QD）的采购金额大约实现翻倍 单台机柜快拆接头部件价值情况如下。 GB300 机柜约 9400 美元。 Vera Rubin 机柜约 11000 美元。 Vera Rubin Ultra 机柜约 20500 美元，对比 Vera Rubin 提升幅度接近 100%。 成本上涨主要来自旧版 UQD/MQD 升级为零滴漏的 ZQD 接头，ZQD 单品价格几乎提升一倍。 Vera Rubin Ultra 硬件配置重点。 运算托盘内部包含 12 个 MQD 接头、8 个 ZQD06 接头、8 个 miniQD 接头，外部配备 2 个 ZQD14 接头；单托盘快拆接头成本约 750 美元。 交换托盘为双层板，搭载 8 个 MQD 接头，外部配置 2 个 ZQD14 接头。 44U 机柜歧管的 88 个插座，由 UQD08 全部更换为大流量规格的 ZQD14 接头。 Fositek 这类供应商有望受益于毛利率改善，核心观察要点依旧是 2027 年下半年的量产进度。 第三部分：Rubin Ultra GPU 均热盖部件价值提升 4‑5 倍 以标准 Rubin 均热盖单价作为基准 x。 B300 均热盖价值为 0.6x，采用一体成型盖子。 Rubin 均热盖价值为 x，一体成型，但是尺寸有所加大。 Rubin Ultra 均热盖价值达到 4‑5x，改为可拆卸三件式组件，包含加强件、临时保护盖以及多颗固定螺丝。 先进封装与测试阶段会使用可拆卸保护盖；ODM 厂商后续会拆除保护盖，让液冷冷板直接压合在 TIM1.5 导热界面材料上。 Jentech 被报告列为该项零部件的主要供应商。 Rubin 机型小批量试产预计在 2026 年第四季度；Rubin Ultra 均热盖量产时点预计为 2027 年第一至二季度。 如果项目长期停留在试产阶段，无法快速大规模导入，对应约 50 倍的前瞻本益比将存在估值风险，需要持续追踪 2026 年试产良率与封装通过率。 第四部分：AWS Trainium 3 液冷机柜的冷却部件成本甚至高于 Vera Rubin AWS Trainium 3，也就是 Teton3 MAX／NRL72 机型，单台机柜冷却部件整体价值约 86000 美元，高于英伟达 Vera Rubin 的 66250 美元。 Trainium3 的 ASIC 热设计功耗仅 700 瓦，对比 GPU 的 2300 瓦要低，但整机热设计方案更加激进。 两者关键参数对比。 运算托盘同样配置 18 个，Trainium3 每个托盘 3000‑3500 美元，单托盘内部 4 颗 ASIC 搭配 8 片双面冷板，外加 1 片托盘底板冷板，一共 22 个快拆接头；Vera Rubin 每个运算托盘为 2000‑2500 美元。 交换托盘数量，Trainium3 配置 10 个，Vera Rubin 配置 9 个，两者的交换托盘单价均处于 1500‑2000 美元区间。 Trainium3 单机柜合计约 512 个快拆接头，对应部件金额约 10200 美元。 报告当中两套硬件的量产时间均标注为 2026 年第三、四季度。 AVC、Fositek 等液冷供应链公司有望迎来业务放量，多机柜集群扩建是实际出货的关键催化因素。#文字观点", "publish_time": "2026-10-02 18:02", "tags": ["文字观点"]}, "attachment:files/20261001Potential FCC Rules on OpticalTransceivers More Likely toCome in at 3.2T.pdf": {"id": "attachment:files/20261001Potential FCC Rules on OpticalTransceivers More Likely toCome in at 3.2T.pdf", "kind": "attachment", "title": "20261001Potential FCC Rules on OpticalTransceivers More Likely toCome in at 3.2T", "source_label": "其他", "excerpt": "M Update Telecom & Networking Equipment | North America Potential FCC Rules on Optical Transceivers More Likely to Come in at 3.2T Recent DC meetings highlight 3.2T as the most lik", "content": "M Update Telecom & Networking Equipment | North America Potential FCC Rules on Optical Transceivers More Likely to Come in at 3.2T Recent DC meetings highlight 3.2T as the most likely generation to see restrictions on China-based optical transceivers. This echoes conversations with LITE during the Q noting that any restrictions would need to be phased in. See potential rules keeping laser market tight, a pos for LITE/COHR. Morgan Stanley & Co. LLC Meta A Marshall Equity Analyst Meta.Marshall@morganstanley.com +1 212 761-0430 Antonio Jaramillo Research Associate Antonio.Jaramillo@morganstanley.com +1 212 761-4438 Morgan Stanley Asia (Singapore) Pte.+ Daniel K Blake Equity Strategist Daniel.Blake@morganstanley.com +65 6834-6597 Morgan Stanley Asia Limited+ Andy Meng, CFA Equity Analyst Andy.Meng@morganstanley.com +852 2239-7689 Morgan Stanley MUFG Securities Co., Ltd.+ Yu Shirakawa Equity Analyst Yu.Shirakawa@morganstanleymufg.com +81 3 6836-5432 Telecom & Networking Equipment North America Industry View In-Line What Happened: Morgan Stanley strategists recently met with a senior Washington telecom, FCC and export-control legal team with direct engagement across the White House and FCC. Discussion focused on the Administration’s efforts to reduce reliance on Chinese technology, with the FCC Covered List emerging as the more likely near-term mechanism for optical transceivers (a note we made in our AI Safety DC trip wrap-up last week ). Policy discussions suggest 3.2T transceivers would likely be where restrictions would be phased in, potentially as soon as October, with industry recently asked to demonstrate credible U.S. or friend-shoring plans before 3.2T becomes broadly deployed. Our conversations noted that discussions are also indicating Chinese-built transceivers could still be importable, even at 3.2T, as long as 65% of the BOM comes from US-based companies (DSP / laser would get you pretty close). Initial 3.2T volumes are not expected to ramp in volume until 2029, limiting the near-term revenue impact of a restriction even if action comes sooner. We would see these rules as having the potential to avoid creating a constraint on hyperscalers' ability to build today, but keeping the laser market tighter given laser would largely need to be from a US-based vendor to meet a 65% value threshold, a positive for LITE/COHR. How this echoes conversation with LITE earlier in the quarter: We hosted LITE at Nasdaq Asia in late August , where we asked the company about potential FCC rules. At the time they noted that the FCC had been in contact with them about potential Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. Key Takeaways Recent DC trip by our strategist team gave a greater idea of what potential FCC rules on optical transceivers could look like. Potential restrictions, likely to come in at 3.2T, limit Chinese-based transceivers, with a potential workaround if US-based content above 65% of the BOM. Solution seemingly a win-win for LITE/COHR, with laser market likely to stay tight, but not having to take on lower module assembly business. Also, does not create bottlenecks for hyperscalers. Assuring InP substrate delivery will be key to look at going forward. October 1, 2026 04:09 AM GMT Not for redistribution without written consent of Morgan Stanley wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 M Update 2rules, with the company noting their feedback was that the rules would need to be phased in over time to prevent material supply/demand dislocation in the market with 60-65% of transceivers coming from China-based transceiver vendors. They also noted that pure transceiver volumes alone, at current pricing structures, would not be the most attractive business for them to bring on. These rules, which are both phased in and don't limit Chinese assemblers, as long as enough content is US-based, would seemingly address both of these concerns. Our Thoughts: 1. 3.2T looks like the likely policy pressure point, but the near-term impact should be limited - Administration efforts appear focused on reshaping the supply chain before 3.2T reaches volume rather than disrupting the existing 800G and 1.6T base. With the 3.2T ramp not expected to begin until 2028 and broader adoption closer to 2029, an October Covered List action would provide roughly two years before meaningful volumes enter the market. Hyperscalers are already working on plans intended to demonstrate greater U.S. or friend-shored manufacturing, suggesting the policy objective is increasingly about determining where the next generation is built rather than immediately displacing current Chinese supply. 2. Laser pricing looks like the stronger read-through versus transceiver share - A Covered List framework does not necessarily require Chinese module vendors to lose significant share if they can increase the U.S. content of the underlying BOM. Combining a U.S. DSP from Marvell with laser content from LITE/COHR could potentially move a Chinese-built transceiver to the 65% U.S.-value threshold discussed in our strategists team policy meeting. Such an outcome would leave Innolight and Eoptolink (both covered by Andy Meng) with less flexibility to substitute toward China-based lasers while allowing them to remain relevant at the module level, reducing the risk from China-based laser makers. We therefore see a stronger read-through for high-speed laser pricing and LITE/COHR component share than for a wholesale redistribution of transceiver share. 3. Replacement capacity not ready; nor is it the most attractive opportunity - As noted above, LITE noted that assembly of transceivers (mid-30's to low- 40s gross margin product), is not the most attractive opportunity for US- based optical companies (vs. EMLs and lasers well north of 50% steady state and approaching 75% today). While 3.2T is not yet in production, we use AAOI's current 800G and 1.6T capacity ramp as an illustration of the scale of US supply available to absorb a potential future demand shift. AAOI (not covered), the only material US-based production of transceivers, is currently ramping capacity. AAOI exited Q2 with manufacturing capacity approaching 200,000 800G and 1.6T units per month and expects to reach ~650,000 units per month by year-end 2026, while management continues to expect demand to outpace production through mid-2027. AAOI’s YE26 capacity annualizes to ~12M 800G/1.6T units, versus ~101M units combined for Innolight and Eoptolink based on annualized 1H capacity (44.3M and 56.7M, respectively), or >8x AAOI. Based on AAOI’s year-end capacity plans and our Internet team’s hyperscaler capex work, we estimate AAOI could support less than 4 GW of hyperscaler capacity even before wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 M Update tch - Exhibit 1Potential FCC rules could create a win-win for LITE/COHR by reducing the risk of China-based laser makers flooding the market, without forcing them to build significant transceiver module capacity to absorb lower-margin assembly business. Were China to view the rules as too one-sided, it could respond with tighter restrictions on InP substrate exports, a key bottleneck to laser capacity ramping. At the same time, sourcing outside of China could broaden the beneficiary set beyond U.S. suppliers, supporting InP substrate demand at JX Advanced Metals (5016 JP), while providing a tailwind for Sumitomo Electric’s (5802 JP) CWLD products and Furukawa Electric’s (5801 JP) DFB lasers. Ò»ÊÖÍ¶ÑÐ×ÊÁÏ¼Ó V£ºWUXL3408 : As it relates to optical transceivers (all speeds), Innolight and Eoptolink collectively have ~8x more capacity than US player AAOI wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 M Update 4Disclosure Section The information and opinions in Morgan Stanley Research were prepared by Morgan Stanley & Co. LLC, and/or Morgan Stanley C.T.V.M. S.A., and/or Morgan Stanley Mexico, Casa de Bolsa, S.A. de C.V.. As used in this disclosure section, \"Morgan Stanley\" includes Morgan Stanley & Co. LLC, Morgan Stanley C.T.V.M. S.A., Morgan Stanley Mexico, Casa de Bolsa, S.A. de C.V. and their affiliates as necessary. For important disclosures, stock price charts and equity rating histories regarding companies that are the subject of this report, please see the Morgan Stanley Research Disclosure Website at www.morganstanley.com/eqr/disclosures/webapp/generalresearch , or contact your investment representative or Morgan Stanley Research at 1585 Broadway, (Attention: Research Management), New York, NY, 10036 USA. For valuation methodology and risks associated with any recommendation, rating or price target referenced in this research report, please contact the Client Support Team as follows: US/Canada +1 店、零食及数码3C门店规模实现正增长，超市、美妆、珠宝等 多个赛道延续收缩。渠道端，胖东来郑州二店确定落户弘坊， 五芳斋上半年山姆渠道销售突破亿元，并持续深化盒马、胖东 来及开市客合作。平台端，京东推出 “百城千亿计划”，抖音电商 发布精选计划，加大对优质内容及商家资源投入。供应链端， 太古可口可乐智能拣配机器人投入商业运作，进一步提升仓储 拣配效率；餐饮方面， “很久以前羊肉串”完成股份制改革，资本 化进程进一步推进。 维持 强于大市 刘乐文 liulewen@csc.com.cn SAC 编号:S1440521080003 SFC 编号:BPC301 石旖瑄 shiyixuan@csc.com.cn SAC 编号:S1440526040001 陈如练 chenrulian@csc.com.cn SAC 编号:S1440520070008 SFC 编号:BR V097 发布日期： 2026年09月29日 市场表现 相关研究报告 26.09.22 【中信建投社服商贸】:中秋国庆 民航日均客运量预计稳健增长，携 程集团国际化业务维持高增 26.09.15 【中信建投社服商贸】:关注出行 链需求结构验证，子板块供给侧优 化趋势深化 26.09.07 【中信建投社服商贸】:半年报总 结：供给侧机会频现，出海依旧景 气 26.09.07 【中信建投社服商贸】:暑期国内 民航及酒店市场表现稳定，关注中 秋国庆长假预订增长 26.08.31 【中信建投社服商贸】:暑运国内 民航旅客量预计增超4%，中报落地 关注行业供给优化+自身经营质量 提升标的 -27%-17%-7%3%13% 2025/9/24 2025/10/24 2025/11/24 2025/12/24 2026/1/24 2026/2/24 2026/3/24 2026/4/24 2026/5/24 2026/6/24 2026/7/24 2026/8/24 社会服务沪深300社会服务 仅供内部参考，请勿外传！ 社会服务 行业动态报告 请务必阅读正文之后的免责条款和声明。 目录 板块表现及投资建议 ................................ ................................ ................................ ............................. 1 （一）重点数据跟踪 ................................ ................................ ................................ ..................... 1 （二）投资建议 ................................ ................................ ................................ ............................ 7 （三）板块行情 ................................ ................................ ................................ ...........................16 （四）子行业表现 ................................ ................................ ................................ .......................17 公司动态 ................................ ................................ ................................ ................................ ..............20 （一）休闲服务板块 ................................ ................................ ................................ ....................20 （二） 商业贸易板块................................ ................................ ................................ ...................21 行业动态 ............... -29.2%，MoM -11.0%，Q3累计交付124,637辆，YoY -14.2%； -蔚来：交付37,408辆，YoY +7.7%，MoM +4.4%，Q3累计交付109,178辆，YoY +25.4%； -小鹏：交付41,256辆，YoY -0.8%，MoM +5.5%，Q3累计交付118,390辆，YoY +2.1%； -极氪：交付37,216辆，YoY +103.8%，MoM +0.6%，Q3累计交付110,034辆，YoY +108.2%； -埃安：交付35,494辆，YoY +21.9%，MoM -2.4%，Q3累计交付106,864辆，YoY +29.2%； -深蓝：交付30,185辆，YoY -10.2%，MoM +5.3%，Q3累计交付88,057辆，YoY -1.1%； -理想：交付31,817辆，YoY -6.3%，MoM -15.6%，Q3累计交付99,964辆，YoY +7.2%； -小米汽车：交付超40,000辆，Q3累计交付超100,000辆； -岚图：交付13,025辆，YoY -14.4%，MoM +0.2%，Q3累计交付39,217辆，YoY -4.0%； -智己：9月交付数据暂未公布。", "publish_time": "2026-10-02 11:55", "tags": []}, "post:2026-10-02T20-29:309fd6911a7e": {"id": "post:2026-10-02T20-29:309fd6911a7e", "kind": "post", "title": "2026-10-02 20:29", "source_label": "帖子正文", "excerpt": "📑中国汽车制造公司：“电池十五五” 政策对比亚迪、宁德时代等公司的影响及资金流向更新国务院于 9 月 28 日发布的十五五规划中，我国电池产业规划的重心，已经从产能扩张转向技术、品质与绿色合规层面，重点扶持固态电池、更长的储存循环寿命以及碳溯源相关方向。来自投资者的反馈显示，该规划将利好头部电池制造", "content": "📑中国汽车制造公司：“电池十五五” 政策对比亚迪、宁德时代等公司的影响及资金流向更新国务院于 9 月 28 日发布的十五五规划中，我国电池产业规划的重心，已经从产能扩张转向技术、品质与绿色合规层面，重点扶持固态电池、更长的储存循环寿命以及碳溯源相关方向。 来自投资者的反馈显示，该规划将利好头部电池制造公司宁德时代与比亚迪。两家公司研发管线匹配度高、合规能力强劲，双寡头格局会进一步巩固；而二线电池公司或将面临利润率承压，存在行业整合风险。 吉利、长城汽车这类垂直整合整车公司，其内部自研配套战略得到政策印证；采用外部采购电池方案的新能源汽车品牌，则会遭遇一定成本压力，同时需要调整固态电池相关的技术落地时间规划。 虽然该规划长期有利于电池行业发展，但我们判断短期难以推动相关股票估值修复。行业基本面偏弱（9 月新能源汽车零售量同比或将出现两位数下滑）源头内容加微wuxl3408，蔚来与吉利换电合作、广汽‑一汽丰田合并两件事均得到市场负面反馈，同时第四季度还有两项政策风险悬而未决，以上因素都有可能压制估值水平。 汽车‑比亚迪、电池‑宁德时代、玻璃‑福耀，CBG 板块资金流向更新：我们将福耀视作衡量大型汽车零部件公司估值底部的参照标的。其 H 股、A 股当前市盈率分别接近自身十年估值低位，对应为 10 倍、12 倍。 宁德时代 H 股市盈率相对比亚迪 H 股、福耀 H 股的非加权平均水平仍有溢价，当前溢价为 45%，该数值较一周前的 49% 有所收窄。 A 股投资者态度更为谨慎，宁德时代 A 股相较比亚迪、福耀 A 股非加权平均已经出现 16% 的折价，其估值向福耀靠拢的速度要快于 H 股。 我们认为，我国十五五规划当中的电池相关规划，短期很难推动相关股票估值修复，主要存在四项压制因素。 第一，蔚来与吉利的换电合作市场反馈偏负面：市场对于蔚来、吉利的换电合作给出负面解读，合作公告发布次日，蔚来股价下跌 5%，吉利股价下跌 7%。 第二，市场对已经公布的广汽‑一汽丰田合并事件态度审慎：海外投资者对广汽‑一汽丰田合并持谨慎态度，反映在广汽 H 股股价表现低迷。 第三，新能源汽车出口退税下调风险以及欧盟关税问题，将对第四季度估值形成压制：全国乘用车市场信息联席会秘书长崔东树预计，新能源汽车出口退税下调政策大概率会在 2026 年末‑2027 年初公布，晚于我们此前预计的 2026 年 10 月。欧盟关税的决议与公告也不会立刻落地，第四季度存在这两项政策层面的不确定性，会对估值带来压力。 第四，9 月全月新能源汽车零售量同比依旧可能出现两位数下滑：我们认为当下市场只聚焦基本面，而基本面数据偏弱；9 月 21‑27 日的新能源车订单数据推算，乐观情景下 9 月全月新能源车零售量同比下滑 9%，基准情景下同比下滑 14%。#文字观点", "publish_time": "2026-10-02 20:29", "tags": ["文字观点"]}, "post:2026-10-02T11-55:058b7a4fed27": {"id": "post:2026-10-02T11-55:058b7a4fed27", "kind": "post", "title": "2026-10-02 11:55", "source_label": "帖子正文", "excerpt": "【东吴电新】碳酸锂周度更新（9.25-10.1）：本周进一步去库，锂价下跌 #价格：本周碳酸锂现货、精矿价格下跌。SMM电池级碳酸锂12.3万元/吨，周环比-9.2%", "content": "【东吴电新】碳酸锂周度更新（9.25-10.1）：本周进一步去库，锂价下跌 #价格：本周碳酸锂现货、精矿价格下跌。SMM电池级碳酸锂12.3万元/吨，周环比-9.2%；锂辉石精矿（CIF中国）1735美元/吨，周环比-8.7%。期货主力合约LC2701收盘价11.8万元，周环比-5%。 #库存：本周SMM碳酸锂新口径库存14.9万吨、去库0.4万吨。其中上游库存3.1万吨，环减0.03万吨；正极厂库存5.1万吨，环增0.15万吨；电芯厂及其他库存2.0万吨，环减0.03万吨；贸易商库存4.7万吨，环减0.5万吨。仓单量3.2万手，周环比-4%。 #产量：本周产量增加203吨至2.6万吨，其中辉石提锂产量环增557吨至14240吨，盐湖产量环减240吨至6088吨，云母提锂产量环增155吨至2892吨，回收料提锂产量环减269吨至2721吨。 #情绪面冲击延续价格承压、供给紧缺逻辑不变。情绪面，市场对隐性库存压力及下游排产、明年需求担忧。但基本面上旺季供需仍偏紧，9月以来国内锂盐检修产能陆续恢复、叠加津巴布韦部分货船到港，锂盐产量抬升，但整体有效供给弹性有限，10月下游排产环比微增、旺季趋势延续。年度看，26-27年碳酸锂供给紧平衡，27年价格中枢预计12万/吨左右。 投资建议：看好具备优质资源且利润弹性较大的公司，重点推荐赣锋锂业、国城矿业、盛新锂能、大中矿业、永兴材料、天齐锂业、中矿资源、华友钴业、雅化集团、藏格矿业，关注盐湖股份。 风险提示：需求不及预期", "publish_time": "2026-10-02 11:55", "tags": ["价格", "库存", "产量", "情绪面冲击延续价格承压、供给紧缺逻辑不变"]}, "post:2026-10-02T11-57:6a8c4ad4bb25": {"id": "post:2026-10-02T11-57:6a8c4ad4bb25", "kind": "post", "title": "2026-10-02 11:57", "source_label": "帖子正文", "excerpt": "摩根士丹利报告总结：北美电信网络设备—FCC或针对3.2T光模块出台监管规则 核心要点 1. 政策方向：监管大概率落在3.2T光模块 投行团队华盛顿调研显示，FCC拟通过《Covered List》实施管制，约束中国产3.2T光收发模块，最早或2026年10月启动，采用分阶段落地模式。设置豁免条款", "content": "摩根士丹利报告总结：北美电信网络设备—FCC或针对3.2T光模块出台监管规则 核心要点 1. 政策方向：监管大概率落在3.2T光模块 投行团队华盛顿调研显示，FCC拟通过《Covered List》实施管制，约束中国产3.2T光收发模块，最早或2026年10月启动，采用分阶段落地模式。 设置豁免条款：若物料清单（BOM）中美国本土元器件占比≥65%，中国制造的光模块仍可进口；DSP+激光器就可接近该占比门槛。 3.2T规模放量预计到2029年，短期对收入冲击有限；政策目标是重塑下一代供应链，而非立刻替换现有800G/1.6T中国供应，不会对云厂商（超大规模客户）现有建设造成瓶颈。 2. 利好上游激光器厂商LITE（Lumentum）、COHR（Coherent） - 规则无需美国企业切入低毛利的光模块组装业务（组装业务毛利率仅30‑40%，激光器稳态毛利率超50%，最高接近75%），主要利好高速激光器价格与组件份额。 - 中国模块厂商（中际旭创Innolight、新易盛Eoptolink）若要满足65%美系物料要求，会减少选用国产激光器，降低国产激光器冲击市场的风险。 3. 美国本土光模块产能严重不足 - 美国仅AAOI具备可观光模块制造能力，预计2026年末年化产能1200万只800G/1.6T；中际旭创+新易盛年化合计1.01亿只，是AAOI的8倍以上。 - AAOI满产情况下仅可支撑约3.7GW AI算力网络需求。想要大规模替代国内厂商供给，需要多年大规模扩产，短期美国产能无法承接需求转移。 4. 关键风险：InP磷化铟衬底供应链 - InP衬底是激光器产能扩张的核心瓶颈。若中方认为政策不公，或收紧InP衬底出口。 - 非中国地区供应商将间接受益：JX Advanced Metals、住友电工、古河电工。 与LITE企业访谈的印证 LITE反馈监管需要分阶段实施，当前60‑65%光模块来自中国，骤然管制会造成供需剧烈扰动；同时公司对光模块组装业务兴趣有限。本次FCC政策的分阶段+物料占比豁免设计，契合企业的诉求。 四大核心观点提炼 1. 监管瞄准3.2T下一代产品，短期影响可控，不扰动800G/1.6T存量； 2. 受益主体是激光器芯片环节，不一定带来光模块份额大洗牌； 3. 美国本土模块产能缺口巨大，短期不具备大规模替代条件； 4. InP衬底供应链是最大潜在风险点，日本相关供应商有望受益。 风险提示：报告为机构研究观点，不构成投资建议。#文字观点", "publish_time": "2026-10-02 11:57", "tags": ["文字观点"]}, "post:2026-10-02T18-05:f1e75bb5463e": {"id": "post:2026-10-02T18-05:f1e75bb5463e", "kind": "post", "title": "2026-10-02 18:05", "source_label": "帖子正文", "excerpt": "“FCC 关于光收发器的潜在规则更有可能在 3.2T 时出台” - $LITE，$AAOI，$COHR，$SIVE。摩根士丹利会见了华盛顿官员： - 限制措施可能首先针对中国制造的 3.2T 模块（800G/1.6T 模块将不受影响）。", "content": "“FCC 关于光收发器的潜在规则更有可能在 3.2T 时出台” - $LITE，$AAOI，$COHR，$SIVE。 摩根士丹利会见了华盛顿官员： - 限制措施可能首先针对中国制造的 3.2T 模块（800G/1.6T 模块将不受影响）。 - 潜在的限制可能会使激光市场保持紧张状态（美国数字信号处理器和激光器的总和可能达到每个移动终端 65% 的美国价值门槛）。 如果中国制造模块的物料清单中至少 65% 的部件来自美国，则该模块可能符合标准。采用美国 DSP 和激光器的中国模块已经接近这一水平。 分析师预计，对激光器价格的积极影响……将比收发器市场份额的任何广泛重新分配都更为重要。 分析师预计这不会成为超大规模人工智能部署的瓶颈，他们认为 InP 衬底的供应才是需要关注的关键变量（你好）$AXTI。 总结： 零部件供应商普遍持非常积极的态度。 $SMTC 可能是 TIA/驱动程序方面的赢家（我不认为这一项被列入了名单），也许吧。 $MXL 也适用于数字信号处理器（DSP）。 $AAOI 另一位主要受益者。 $SIVE 是激光受益者的关键 alpha，因为他们有“巨大的产能”即将上线，这指向美国代工厂（他们尚未正式披露位置）。 之前的幻灯片显示，就产能合作关系而言，共有两家美国晶圆代工厂和一家台湾晶圆代工厂（盈透半导体）。这是一个排除法。 从 CIOE Channel 的调查来看，他们似乎已经开始与中国的可插拔厂商合作，（因此他们作为美国供应链组件的受益者，未来发展前景广阔）。 当然 $LITE / $COHR 会很高兴。 简而言之：西方激光器/DSP/TIA/其他产品的供应链已经出现瓶颈，但合格产能变得更加重要。#文字观点", "publish_time": "2026-10-02 18:05", "tags": ["文字观点"]}, "post:2026-10-02T20-30:b13259f8bb78": {"id": "post:2026-10-02T20-30:b13259f8bb78", "kind": "post", "title": "2026-10-02 20:30", "source_label": "帖子正文", "excerpt": "📑屹唐股份：刻蚀及表面处理设备推动下一阶段增长依托国内存储芯片与先进制程产能扩张（报告链接），以及半导体设备持续国产化进程，我们对屹唐半导体维持乐观态度。我们预计，公司在干法去胶以及快速热处理（RTP）领域的领先地位将支撑核心业务，刻蚀设备与等离子体表面处理设备将驱动下一阶段业务增长。", "content": "📑屹唐股份：刻蚀及表面处理设备推动下一阶段增长依托国内存储芯片与先进制程产能扩张（报告链接），以及半导体设备持续国产化进程，我们对屹唐半导体维持乐观态度。我们预计，公司在干法去胶以及快速热处理（RTP）领域的领先地位将支撑核心业务，刻蚀设备与等离子体表面处理设备将驱动下一阶段业务增长。 特别地，伴随新型金属 / 铝刻蚀设备、晶圆边缘刻蚀设备完成客户验证，RENA‑E 设备预计将在 2027‑2028 预测年度实现产能爬坡。供应链国产化持续推进以及产品认证取得进展，也有望推动公司盈利能力改善。基于估值处于合理水平，维持中性评级。 📊盈利调整情况我们对 2027‑2028 预测年度的净利润预测基本保持不变，收入预测平均下调 1%，该调整反映出公司在国内市场逐步拓展以及新产品推进落地的现状。 尽管收入预测小幅下调，但受益于国内半导体资本开支维持高位以及公司新产品产能爬坡，我们依旧预计 2027、2028 预测年度收入将实现强劲同比增长，增速分别为 55%、16%。 针对 2026 预测年度，我们将净利润下调 9%，主要源于收入不及预期以及研发费用有所抬升，背后原因包含原材料供给紧张以及新产品研发投入增加。#文字观点", "publish_time": "2026-10-02 20:30", "tags": ["文字观点"]}, "post:2026-10-02T18-03:3149026cda24": {"id": "post:2026-10-02T18-03:3149026cda24", "kind": "post", "title": "2026-10-02 18:03", "source_label": "帖子正文", "excerpt": "博通开始筹集 600 亿美元资金，为 Anthropic 芯片提供支持 据知情人士透露，博通公司（Broadcom Inc.）的华尔街财团正开始筹集600 亿美元的新型 AI 芯片融资，以惠及 Anthropic PBC 等公司。知情人士表示，参与这一巨额债务方案的银行准备就420 亿美元的 A 类", "content": "博通开始筹集 600 亿美元资金，为 Anthropic 芯片提供支持 据知情人士透露，博通公司（Broadcom Inc.）的华尔街财团正开始筹集600 亿美元的新型 AI 芯片融资，以惠及 Anthropic PBC 等公司。 知情人士表示，参与这一巨额债务方案的银行准备就420 亿美元的 A 类高级担保部分发出辛迪加信函。由于该交易尚未公布，知情人士要求匿名。 知情人士称，黑石集团（Blackstone Inc.）正领投180 亿美元的 B 类次级债务，已从旗下各类基金中承诺出资 90 亿美元，并计划对剩余部分进行辛迪加分销。 Broadcom 的一位代表拒绝置评。 这笔融资已筹划数周，正受到华尔街和硅谷专业人士的密切关注，以确认在公众对数据中心建设产生抵触情绪的情况下，投资者是否仍然热衷于支持人工智能的扩建。 Broadcom 正寻求销售更多芯片和其他数据中心设备，向 Nvidia Corp. 发起挑战，而像 Anthropic 这样的人工智能公司则需要不断增长的计算能力。 据 8 月份知情人士透露，这项潜在交易将帮助包括 Anthropic 在内的公司获得芯片和其他关键的人工智能基础设施。 阅读更多：Broadcom 在最新的人工智能债务交易中寻求超过 600 亿美元融资 这为已经筹集的数千亿美元债务又增添了新的一笔，这些债务旨在建设人工智能基础设施。虽然其中大部分资金流向了数据中心，但针对芯片和服务器融资的交易也在成倍增加。 今年 8 月，Nvidia 还宣布与包括 Blackstone 在内的六家金融巨头建立合作伙伴关系，旨在为人工智能筹集超过 5000 亿美元资金，其中包括帮助客户为其购买该公司芯片提供资金。 与此同时，Blackstone 对 Anthropic 的投资也助力提升了其面向富裕阶层的私募股权基金的业绩。 阅读更多：Anthropic 推动 Blackstone 富裕阶层基金实现最大涨幅 在 Laura Benitez 的协助下#文字观点", "publish_time": "2026-10-02 18:03", "tags": ["文字观点"]}, "post:2026-10-02T18-03:8667915e21ad": {"id": "post:2026-10-02T18-03:8667915e21ad", "kind": "post", "title": "2026-10-02 18:03", "source_label": "帖子正文", "excerpt": "美股盘面分析：第四季度第 1 交易日#交易台标普 500 指数上涨 20 个基点，收于 7666 点，收盘竞价（MOC）为 45 亿美元买入。纳斯达克 100 指数上涨 31 个基点，报 30501 点", "content": "美股盘面分析：第四季度第 1 交易日#交易台标普 500 指数上涨 20 个基点，收于 7666 点，收盘竞价（MOC）为 45 亿美元买入。纳斯达克 100 指数上涨 31 个基点，报 30501 点；罗素 2000 指数上涨 37 个基点，报 2807 点；道琼斯指数上涨 4 个基点，报 50927 点。全美股票交易所成交量为 171.01 亿股，而今年以来的日均成交量为 186.63 亿股。VIX 指数上涨 49 个基点，报 16.42；WTI 原油上涨 304 个基点，报 93.17 美元；美国 10 年期国债收益率下跌 5 个基点，报 5.23%；黄金上涨 54 个基点，报 4179 美元；美元指数（DXY）上涨 57 个基点，报 102.03；比特币上涨 135 个基点，报 84754 美元。 今天市场有大量关于全球利率的问题，有几点值得重点关注。 1）在 PCE 数据和近期美联储鸽派言论之后，收益率曲线继续呈现牛市趋陡态势。10 月加息概率降至 30%，市场已经定价至 2027 年底前将有大约 3 次降息。利率交易台观察到短端利率品种迎来各类买家入场，市场对加息次数减少的预期趋于稳定。 2）法国的财政整顿计划引发了部分跨境资金流动，同时催生了 “避险情绪”。 3）关于避险情绪，值得留意美元指数（DXY）今日出现约 2 个标准差的正向波动。 微观层面，本次交易时段行情波动较为煎熬，科技股财报、ACN 上涨 16% 以及 SNPS 投资者日上涨 13%，推动热门空头标的以及被视作存在 AI 风险相关个股（GSTMTAIR +3.7%）出现大幅空头挤压。尽管大多数对冲基金计划在这一板块上涨时增加空头头寸，但我们实际观察到市场买盘多于卖盘。市场交投活跃度仍然参差不齐。以 1-10 分的衡量标准，我们交易台整体活跃度仅为 4 分，客户整体持仓倾向较为温和。 盘后动向：NKE 下跌 6%，此前市场预期已经压至极低水平，事实证明该谨慎预期是合理的，公司营收确实不及预期。每股收益（EPS）符合预期，但这并非市场关注焦点。市场核心关注点在于公司是否发布全财年业绩指引，而公司确实给出了指引。本次指引下调幅度较大，低于绝大多数基准情景的下调幅度，基本与我们听到的最悲观情景预测保持一致。按照新指引的中值测算，该股当前交易对应 26 倍市盈率（P/E）。分析师日将在下个月举办。 明天将公布非农就业数据。我们预计 9 月非农就业人数（NFP）增加 8 万，略低于市场一致预期的增加 8.8 万。 积极的一面是，裁员水平依旧处于低位，就业增长的大数据指标环比有所回升。 消极的一面是，当劳动节落在当月下旬时（就像今年），9 月就业增长往往弱于近期趋势。另外，上月非农就业人数大幅增长，主要由休闲酒店业和地方教育服务业岗位超预期增加所拉动，我们预计该情况不会再次出现。 我们预计失业率小幅回落至 4.0%，此前我们的预测与市场共识以及上月数值一致，均为 4.1%，该变化反映持续申领失业金人数的下降。 我们预测平均时薪环比增长 0.2%，低于市场一致预期，受到负面日历效应影响。 衍生品板块：市场走势震荡，在今早信贷市场领跌的抛售行情中，我们数周以来首次观察到真实恐慌情绪。 有意思的是，随着波动率（VOL）在现货价格下行阶段获得坚实买盘，现货 / 波动率回归到 “正常” 的联动表现。其余风险参数同步变动，偏度（skew）以及波动率的波动率（vol of vol）同样获得买盘。 资金流层面，我们看到多家客户在 QQQ 和 IWM 中增加对冲仓位，但是资金流向再次与市场情绪脱节，芯片板块依旧不在资金选择范围内。随着市场走出一轮强劲反弹，标普 500 固定行权价波动率随行情上行有所回落，收盘基本持平，近月偏度维持买盘。罗素 2000 固定行权价波动率在伽马期限内获得买盘，但在曲线远端遭遇抛售。在个股与主题投资领域，今天更偏向选股型市场，没有明显的行业偏好。 市场出现一笔大额 MRVL 期权交易，某机构买入 15000×7500 张 Jan28 280 比例跨式期权组合，对应 250 万 Vega。 交易台认为，受美韩相关协议影响，叠加投资者当前仓位明显低配，核能板块当前具备吸引力。 展望明日，市场将迎来非农就业数据，标普隐含波动幅度为 67 个基点。#文字观点", "publish_time": "2026-10-02 18:03", "tags": ["交易台", "文字观点"]}, "attachment:files/中信建投-新产业(300832)26Q2国内外业务恢复明显，政策影响正逐步出清-261001.pdf": {"id": "attachment:files ": "post:2026-10-02T11-59:9623f3f2cf15", "kind": "post", "title": "2026-10-02 11:59", "source_label": "帖子正文", "excerpt": "大摩这份报告的逻辑推演，A股的影响可以分成三档。受益方向 第一个是光器件，代表是天孚通信。", "content": "大摩这份报告的逻辑推演，A股的影响可以分成三档。 受益方向 第一个是光器件，代表是天孚通信。报告的底层结论是：中国模块厂不会丢份额，美国也接不住盘——AAOI的年化产能只有中际旭创加新易盛的八分之一。模块照常生产、照常爬坡，那\"卖零件的\"就是最确定的受益者。无论政策怎么博弈，器件需求量都在，这是整份报告逻辑里最政策免疫的一环。 第二个是有海外产能的公司，代表是光库科技。报告的规则设计是65%美国含量加友岸制造，本质上是给\"有海外实体产能的公司\"发合规通行证。光库科技早年收购了欧洲的铌酸锂调制器资产，在海外有真实产能和渠道，这类资产在新规则下的稀缺性会被重新定价。 第三个是国产磷化铟衬底，代表是云南锗业。报告里最有锋芒的推演是：如果中国反制，磷化铟出口管制就是最大的牌，因为它是激光器扩产的命门。一旦这个叙事发酵，国产InP衬底的战略价值立刻抬升，这是A股对这条逻辑最直接的映射。 第四个是中际旭创和新易盛，但要打折看。报告原话是两家仍可在模块层面保持竞争力，且3.2T放量要到2029年，留了约两年缓冲期。最坏的\"被踢出美国供应链\"情景被证伪，短期是情绪修复。但它们的采购自主权被规则锁死，必须买美国DSP和激光器，成本主动权让渡，远期利润率的天花板被压低了。属于利空出尽、利好打折的中性偏正。 受损方向 第一个是国产激光芯片，代表是源杰科技。这是报告里被明确点名的受损方。报告原文的逻辑是：65%规则让中国模块厂向中国本土激光器切换的空间被压缩，降低了中国本土激光器厂商涌入市场的风险。翻译过来就是：原本\"模块厂扶持国产激光芯片放量\"的替代叙事，在美国出口链条上被政策直接截断了。这类公司估值里\"国产替代\"那部分预期，需要重新打折。 第二个是模块厂自身的长期估值逻辑。旭创和新易盛当期业绩没事，但报告揭示了一个残酷的结构：光模块组装毛利率只有30%到40%，激光器毛利率却接近75%。规则把利润最厚的环节永久锁给了美国厂商，模块厂被定位在\"赚辛苦钱\"的角色上。伤的不是当期利润，而是远期估值锚——从\"有定价权的技术公司\"被压向\"高级组装厂\"。 第三个是蹭\"美国制造替代\"概念的公司。报告用数据证伪了这个叙事：AAOI满打满算只够支撑3.7GW，美国供应链两年内接不住中国厂商的盘子。所以A股里那些讲\"美国建厂替代中国光模块\"故事的标的，逻辑基本不成立。 一句话总结 这份报告的真正指向是：利好\"卖铲的\"（器件）、利好\"有海外门票的\"（友岸产能）、利好\"反制筹码\"（磷化铟）；利空\"国产激光替代叙事\"，压模块厂的远期估值，证伪美国替代概念。 最后提醒 以上是我顺着大摩单篇报告逻辑的推演，有三个前提可能被打破：一是10月FCC规则的实际文本中65%怎么定义；二是中国是否真打磷化铟这张牌；三是模块厂能否通过涨价把新增成本转嫁出去。单篇报告只是地图的一格，别拿一张地图走全程。 （本文仅为基于公开研报的逻辑推演，不构成投资建议。）#文字观点", "publish_time": "2026-10-02 11:59", "tags": ["文字观点"]}, "post:2026-10-02T20-30:49ccb252bbc5": {"id": "post:2026-10-02T20-30:49ccb252bbc5", "kind": "post", "title": "2026-10-02 20:30", "source_label": "帖子正文", "excerpt": "📑怡合达：关注新兴行业的长尾机会，维持 “买入”我们下调怡合达 2026/2027 财年盈利预测，下调幅度分别为 11%/7%，主要原因是展会投入、数字化建设以及员工持股计划带来更高的运营成本。但我们维持怡合达 “买入” 评级，我们认为公司不仅可以把握电子、半导体行业的长尾机会，还可以抓住光模块、人", "content": "📑怡合达：关注新兴行业的长尾机会，维持 “买入”我们下调怡合达 2026/2027 财年盈利预测，下调幅度分别为 11%/7%，主要原因是展会投入、数字化建设以及员工持股计划带来更高的运营成本。 但我们维持怡合达 “买入” 评级，我们认为公司不仅可以把握电子、半导体行业的长尾机会，还可以抓住光模块、人形机器人、航空航天等 AI 相关赛道带来的长尾业务机遇。 怡合达正在东盟与匈牙利建设工厂，把握中国公司出海带来的商业机遇。 虽然我们下调目标估值倍数，从原先 36 倍下调至33 倍 2026 年预期市盈率，反映盈利预测下调，但是随着我们切换至 2026 年每股收益测算，我们小幅上调目标价至 32 元人民币。 我们在中国自动化及设备板块的首选标的：大族激光（002008.SZ）> 大族数控‑H（3200.K）> 精密津上中国（1651.HK）。与米思米中国业务对比我们注意到，怡合达 2026 年第二季度收入增速已经追平米思米中国的销售增速，二者同比增速均为 32%。 2026 年第二季度，米思米中国营收规模依旧为怡合达的 1.3 倍，该比值相较于 2026 年一季度、2025 年四季度的 1.6 倍已经出现回落，体现怡合达市场份额正在提升。 我们将份额提升归功于新能源、电子、半导体板块的业务贡献。 如果增量需求主要来自国内人形机器人源头内容加微wuxl3408、光模块、半导体设备行业，怡合达有机会取得更高市场占有率，我们认为其市场份额有望进一步提升。估值情况我们新给出的目标价 32 元人民币，对应 33 倍 2026 年预期市盈率，较该股五年均值低 0.5 个标准差，用来反映运营费用抬升以及毛利率存在小幅压力。 当前股价对应约 25 倍 2026 年预期市盈率，估值具备吸引力。 我们看好怡合达，不仅是看好其长尾业务模式，也看重公司强劲的经营现金流以及 15%‑20% 的净利率水平。#文字观点", "publish_time": "2026-10-02 20:30", "tags": ["文字观点"]}, "post:2026-10-02T19-26:f811a27488c0": {"id": "post:2026-10-02T19-26:f811a27488c0", "kind": "post", "title": "2026-10-02 19:26", "source_label": "帖子正文", "excerpt": "安费诺：实地调研要点我们于 9 月 28 日在康涅狄格州沃林福德的安费诺总部开展投资者实地调研，与公司总裁兼首席执行官亚当・诺维特、执行副总裁兼首席财务官克雷格・兰波、战略与投资者关系副总裁雪莉・斯克里布纳进行会谈。双方交流议题包含安费诺市场定位、公司取得成功的内在原因、下游终端需求趋势、供应链情况", "content": "安费诺：实地调研要点我们于 9 月 28 日在康涅狄格州沃林福德的安费诺总部开展投资者实地调研，与公司总裁兼首席执行官亚当・诺维特、执行副总裁兼首席财务官克雷格・兰波、战略与投资者关系副总裁雪莉・斯克里布纳进行会谈。 双方交流议题包含安费诺市场定位、公司取得成功的内在原因、下游终端需求趋势、供应链情况以及利润率水平。 本次会议核心调研要点如下： 安费诺看好人工智能领域的多年级机遇，重点介绍公司覆盖铜缆与光纤的丰富产品组合。 管理层看好 AI 赛道带来的发展机遇，认为这是由终端市场变化、多元技术产品以及具备创业精神的运营架构共同驱动的长周期趋势。 安费诺拥有约 150 位拥有高度自主权限的总经理，管理层表示，各业务单元归属于更大的运营集团，围绕客户需求与技术研发开展协同合作。 这套组织模式让公司可以面向客户提供全套解决方案，匹配多元化的技术需求。 安费诺强调自身拥有齐全的铜缆、光纤产品矩阵，伴随 AI 基础设施建设持续推进，预计两类产品都将维持重要地位。 公司进一步扩充了光通信产品产品线。 在发布 2026 财年第二季度每股收益报告时，公司上调康普业务全年业绩预期；目前预计该业务全年销售收入可达 46 亿美元，经拆股调整后，对每股收益的影响为‑0.15 美元；此前预期分别为 41 亿美元、‑0.07~‑0.08 美元。 公司预计 IT 数据通信终端市场营收占康普全年营收比重接近一半，2025 年该占比约为 33%，体现光连接产品需求旺盛。 IT 数据通信板块为安费诺统计 AI 相关收入的业务板块，该板块 2026 财年第二季度内生收入同比增长 63%；管理层预计该终端市场第三季度内生收入将实现中双位数的环比增长。 安费诺下游终端市场布局广泛，同时覆盖长周期与短周期业务。 管理层举例提到，防务业务 2026 财年第二季度内生同比增速达到 24%。 除此之外，管理层表示，公司并不会以牺牲其他终端市场为代价来投入 AI 相关业务，会持续布局数据中心以外的各类市场。 公司同时认为，AI 以及电气化的长期发展趋势，会在防务、机器人 / 工厂自动化、自动驾驶汽车、农业等多个应用场景带来单机价值量提升的机会。 公司一边为业务增长开展投入，同时保持运营层面的灵活应变能力。 公司持续通过运营成本以及资本开支两个维度进行增长相关投入。 尤其针对康普业务，管理层表示，安费诺稳健的资产负债表，可以为该业务提供更高水平的投入支持，例如新产品开发、资本开支；而康普的前股东时期背负极高的财务杠杆，难以做到同等规模投入。 当被问及如果公共政策发生变化、对数据中心投资造成冲击时公司将如何调整经营，管理层表示，公司拥有在强周期下行环境开展经营的经验，必要时会对自身运营模式与投入规模进行调整。 公司持续应对各类供给约束问题。 虽然部分原材料与零部件处于供给紧张状态，但公司依旧能够拿到满足需求所需的零部件，既覆盖 IT 数据通信业务，也包含公司全部业务线；2026 财年第二季度公司整体内生营收同比增长 30%，就是有力佐证。 公司表示，能够保障零部件供应，部分得益于自身具备创业活力的运营架构。 公司利润率表现强劲。 公司表示高度重视盈利能力，盈利驱动要素包括新产品创新、生产效率与运营效率提升；必要情况下，产品调价也可以用来对冲成本上行压力。 高盛对安费诺股票给予买入评级，12 个月目标价 102 美元，测算逻辑为对归一化每股收益 3.40 倍给予 30 倍市盈率。 我们观点对应的主要下行风险包含：营收增长不及预期、利润率承压、对华贸易环境变化（安费诺在中国设有多处生产基地）、公司并购业务能否持续高效落地。#文字观点", "publish_time": "2026-10-02 19:26", "tags": ["文字观点"]}, "post:2026-10-02T21-25:ce10c4b0c0a5": {"id": "post:2026-10-02T21-25:ce10c4b0c0a5", "kind": "post", "title": "2026-10-02 21:25", "source_label": "帖子正文", "excerpt": "泉峰控股：TTI前CEO Joseph Galli Jr接任行政总裁近期密集组织交流调研，经营情况欢迎沟通#TTI前CEOJoseph Galli Jr接任行政总裁。Galli曾在百得（Black & Decker）任职超过19年并升至全球电动工具及配件事业部总裁，于1992年推出DeWalt并带领", "content": "泉峰控股：TTI前CEO Joseph Galli Jr接任行政总裁近期密集组织交流调研，经营情况欢迎沟通#TTI前CEOJoseph Galli Jr接任行政总裁。Galli曾在百得（Black & Decker）任职超过19年并升至全球电动工具及配件事业部总裁，于1992年推出DeWalt并带领该品牌实现全球化，后任职亚马逊总裁兼COO、Newell Rubbermind行政总裁，2006年加入TTI担任行政总裁。#Galli在TTI任职期间将Milwaukee打造为全球领先的电动工具品牌之一，同时推动了Ryobi工具的持续扩张。泉峰董事长潘龙泉评价Galli为Industry Legend，Galli在团队组建和组织环境方面具备强大领导力，在无绳化、电池平台扩张、全球渠道推广、内部组织管理和品牌力提升方面具备成熟完整的系统化打法，接任泉峰行政总裁有望推动泉峰进一步强化自有品牌驱动、电池平台建设和全球化扩张。#2026年渠道补库、替换周期、锂电渗透三重共振，驱动业绩反转：①25年底渠道商主动补库，趋势延续；②上一轮房地产周期触发爆发式购买潮对应2025-2027年集中替换窗口；③锂电OPE渗透率提升趋势确定，26H1公司推出130款产品，90%为锂电产品。#EGO品牌护城河极深，平台生态飞轮已形成：①26H1 OBM收入占比进一步提升至80%，EGO多类别市场份额第一；②电池平台持续拓展，电池保有量越大、生态越宽，护城河越深。电池包独立销售CAGR约46%（2019-2025年），体现平台扩张的强大动能；③深度嵌入劳氏供应链和货架体系，短期内竞争对手难以复制。除北美基本盘外，#区域拓展与客群拓展构成公司中长期第二增长曲线。①区域拓展：2025年收购比荷卢地区渠道SDL，26H1在欧洲发布割草机器人，反响出色。②客群拓展：2B专业渠道开拓，26H1美国市场商用割草机推广成功，为商用渠道重要里程碑。#文字观点", "publish_time": "2026-10-02 21:25", "tags": ["TTI前CEO", "文字观点"]}, "post:2026-10-02T21-34:7c67dd6291fa": {"id": "post:2026-10-02T21-34:7c67dd6291fa", "kind": "post", "title": "2026-10-02 21:34", "source_label": "帖子正文", "excerpt": "据日经报道，东芝计划投入约600亿日元（约3.8亿美元）扩建菲律宾HD 专属团队升级问界业务。\n\n- **机器人/自动化**\n  - 今天强化的逻辑：怡合达维持“买入”评级，但下调2026/2027财年盈利预测，下调幅度分别为11%/7%，主要因展会投入、数字化建设以及员工持股计划带来更高运营成本；公司可把握电子、半导体行业长尾机会，并抓住光模块、人形机器人、航空航天等AI相关赛道长尾业务机遇；若增量需求主要来自国内人形机器人、光模块、半导体设备行业，怡合达有机会取得更高市场占有率。\n  - 今天出现的催化/验证：安费诺投资者实地调研在康涅狄格州沃林福德总部开展，交流议题包含市场定位、成功内在原因、下游终端需求趋势、供应链情况，管理层预计该终端市场第三季度内生收入将实现中双位数环比增长；东芝计划投入约600亿日元扩建菲律宾HDD制造设施，目标2027财年前将面向AI数据中心的HDD产能提高一倍，这是东芝约五年来首次对HDD业务进行大规模投资。\n\n- **宏观/策略**\n  - 今天强化的逻辑：港股大跌，更多券商加入禁止内地资金买港股行列；隔夜美股和日韩上涨，港股表现与外部市场背离。中国经济增长放缓后考虑更具针对性的财政支持；美国放缓对华飞机零部件出口，特朗普寻求在贸易谈判中增加筹码；日本经济界代表团拟明年3月访华。\n  - 今天出现的催化/验证：香港股市创3月以来最大跌幅，金融股领跌；美股第四季度第1交易日，标普500上涨20个基点收于7666点，收盘竞价45亿美元买入，纳斯达克100上涨31个基点报30501点；韩国KOSPI上涨0.46%报7003.7点，外资净卖出1.06亿美元，KOSDAQ下跌0.11%报893.3点，外资净卖出1.29亿美元；8月PCE超预期回落、9月ADP就业数据走强、二季度GDP终值上修，形成冷热相宜的数据组合。\n\n## 三、今日重点关注\n### 3.1 今天已经发生的重点变化\n- 美光2026财年第四财季销售额542亿美元，环比增长31%、同比增长379%；CEO表示2027年和2028年内存和存储供应将比2026年更加紧张。\n- 美光2027财年资本开支将显著跃升，逾半数增量用于支持HBM及常规DRAM产能扩张；风险是CXMT持续获取DRAM份额冲击定价。\n- 台积电重申增持，2027年6月目标价由3200新台币上调至3300新台币，基于约20倍12个月远期市盈率；上调依据为AI驱动先进制程需求持续强劲、N3与N2产能扩张提速。\n- 台积电2027年将实施更广泛晶圆提价，先进制程N3、N2涨幅约10%，成熟制程N7及以上迎来自本轮AI半导体上行周期以来首次提价，幅度低至中个位数。\n- FCC潜在监管方向落在3.2T光模块，最早或2026年10月启动，分阶段落地；BOM中美国本土元器件占比≥65%可豁免，800G/1.6T模块不受影响。\n- 美国仅AAOI具备可观光模块制造能力，预计2026年末年化产能1200万只800G/1.6T；初期3.2T产品出货量预计到2029年才会明显爬坡。\n- 亚马逊寻求向投资者转让价值约80亿美元的Nvidia芯片，工具由外部投资者提供资金，可发行债务并向投资者出售至多10%股权，使亚马逊回租芯片并采用更轻资产融资模式。\n- 博通开始筹集600亿美元资金为Anthropic芯片提供支持，参与银行准备就420亿美元A类高级担保部分发出辛迪加信函；Nvidia和SoftBank各完成100亿美元、合计200亿美元对OpenAI上一轮融资投资。\n- 三星在HBM4价格谈判中报价每千兆4美元中高段位，比当前主流HBM3E每千兆比特1.50美元高出三倍多。\n- 壁仞科技BR20X近期已点亮并将投入量产，基于国产工艺，支持FP8/FP4，配备144GB HBM3E，卡间互联超900GB/s，性能超越H200，定价或较为可观。\n- 比亚迪9月交付463,561辆，同比增长17.0%、环比增长5.3%，Q3累计1,323,065辆，同比增长18.7%；零跑交付105,656辆，同比增长58.5%、环比增长2.5%，Q3累计310,052辆，同比增长78.3%；小鹏交付41,256辆，同比下降0.8%、环比增长5.5%。\n- 碳酸锂周度更新：SMM电池级碳酸锂12.3万元/吨，周环比下降9.2%，本周进一步去库，锂价下跌。\n- 国务院9月28日发布的“十五五”规划中，电池产业规划重心从产能扩张转向技术、品质与绿色合规层面，重点扶持固态电池、更长储存循环寿命以及碳溯源相关方向；投资者反馈显示将利好头部电池制造。采用外部采购电池方案的新能源汽车品牌则遭遇一定成本压力，并需调整固态电池相关技术落地时间规划。\n- 宁德时代和正力新能被列为中国电池行业重点标的，行业份额将进一步向具备规模、技术和成本优势的企业集中，宁德时代继续被列为行业首选。\n- 港股创3月以来最大跌幅，金融股领跌；更多券商加入禁止内地资金买港股行列；隔夜美股和日韩上涨。\n- 美股第四季度第1交易日，标普500上涨20个基点收于7666点，收盘竞价45亿美元买入；纳斯达克100上涨31个基点报30501点。\n- 8月PCE超预期回落，9月ADP就业数据走强，二季度GDP终值上修，形成冷热相宜的数据组合。\n- 礼来在米兰会议上公布的研究显示，其在减肥方面取得创纪录成绩，超越诺和诺德，并取得提高肥胖症和糖尿病患者治疗标准的成果；诺华与中国公司签署价值高达78亿美元的mRNA疗法交易协议。\n- 怡合达下调2026/2027财年盈利预测，下调幅度分别为11%/7%，主要因展会投入、数字化建设及员工持股计划带来更高运营成本，但维持“买入”评级，并关注电子、半导体长尾及光模块、人形机器人、航空航天等AI相关赛道机遇。\n- 安费诺实地调研显示，管理层预计该终端市场第三季度内生收入将实现中双位数环比增长；东芝计划投入约600亿日元扩建菲律宾HDD制造设施，目标2027财年前将面向AI数据中心的HDD产能提高一倍。\n- 美股EDA主题方面，AI4S不只是制药；卫星/太空数据中心/情报摄入层也需要上修至少15%；液冷仿真/太空数据中心仿真加速2.5倍。\n\n### 3.2 接下来要继续跟踪的验证点/催化点\n- FCC 3.2T光模块监管规则是否最早于10月颁布并生效，分阶段实施节奏、BOM美国本土元器件≥65%豁免条款的实际执行，以及对800G/1.6T与3.2T产品出货的差别影响。\n- 美光2027财年资本开支落地节奏，HBM及常规DRAM产能扩张进度，2027年和2028年供需紧张程度，以及CXMT份额提升对DRAM定价的冲击。\n- 台积电三季度业绩、四季度指引、N3与N2产能扩张速度，以及2027年先进制程与成熟制程提价能否全面落地。\n- 三星HBM4价格谈判进展及每千兆4美元中高段报价能否被主要客户接受，对HBM3E价格体系和存储厂盈利的影响。\n- 亚马逊约80亿美元Nvidia芯片转让工具的结构、发行进展及外部投资者参与情况，是否形成更轻资产融资模式的示范。\n- 博通600亿美元AI芯片融资进展，尤其是420亿美元A类高级担保部分的辛迪加结果，以及对Anthropic等公司芯片供应的支持。\n- Nvidia和SoftBank完成对OpenAI上一轮融资最后200亿美元投资后的后续融资动作，以及Anthropic与OpenAI估值差距变化。\n- 英伟达Vera Rubin Ultra与AWS Trainium 3液冷机柜冷却部件价值提升，GPU/ASIC功耗提升、冷板设计复杂度提高、快拆接头规格升级对供应链的持续拉动。\n- 壁仞科技BR20X量产进度、基于国产工艺的实际性能与定价，以及国产GPU在H200对标中的客户验证。\n- 9月全月新能源汽车零售量是否出现同比两位数下滑，外部采购电池方案品牌的成本压力与固态电池技术落地时间调整。\n- 电池“十五五”政策对固态电池、长循环寿命、碳溯源相关方向的后续配套措施，以及头部电池制造企业份额集中趋势。\n- 碳酸锂去库与锂价下跌的持续性，SMM电池级碳酸锂12.3万元/吨周环比下降9.2%后的下一步价格与库存验证。\n- 港股资金限制变化，更多券商禁止内地资金买港股的范围与影响；隔夜美股和日韩上涨与港股下跌背离是否延续。\n- 8月PCE超预期回落、9月ADP走强、二季度GDP终值上修后的市场降息与增长预期变化。\n- 美国对华飞机零部件出口放缓、特朗普贸易谈判筹码、日本经济界代表团拟明年3月访华、中国更具针对性财政支持的后续进展。\n- 10月TMT催化剂观察涉及30多个事件，10月5日当周旧金山科技周于10月5日至11日举办。\n- 怡合达新兴行业长尾机会兑现情况，安费诺第三季度内生收入中双位数环比增长指引，以及东芝菲律宾HDD产能翻倍计划。\n- AI4S主题中卫星/太空数据中心/情报摄入层上修至少15%、液冷仿真/太空数据中心仿真加速2.5倍的后续验证。\n\n## 四、高价值内容摘录\n\n### 文字观点\n- 11:54｜摩根大通——台积电（2330.TW）：预期三季度业绩强劲、四季度指引健康且产能爬坡加速——目标价上调至3300新台币 • 投资评级与估值：重申增持，目标价上调至3300新台币 摩根大通维持台积电增持评级，将2027年6月目标价由3200新台币上调至3300新台币，基于约20倍12个月远期市盈率。上调依据为AI驱动的先进制程需求持续强劲、N3与N2产能扩张提速，以及A14制程节点提前量产带来的增量贡献。\n- 11:54｜巴克莱——美国股票策略：AI风险溢价的演变 • 核 融资投资。\u003c/li>\n\u003cli>FCC光模块监管方向明确：限制更可能落在3.2T光模块，最早或2026年10月启动并分阶段落地；若BOM中美国本土元器件占比≥65%，中国制造光模块仍可进口美国；800G/1.6T模块将不受影响。美国仅AAOI具备可观光模块制造能力，预计2026年末年化产能1200万只800G/1.6T；初期3.2T产品出货预计到2029年才会明显爬坡，对营收短期冲击有限。\u003c/li>\n\u003cli>新能源车销量分化与电池政策转向：比亚迪9月交付463,561辆，同比增长17.0%、环比增长5.3%，Q3累计1,323,065辆，同比增长18.7%；零跑交付105,656辆，同比增长58.5%、环比增长2.5%，Q3累计310,052辆，同比增长78.3%；小鹏交付41,256辆，同比下降0.8%、环比增长5.5%。碳酸锂现货价格12.3万元/吨，周环比下降9.2%，本周进一步去库；电池“十五五”规划重心从产能扩张转向技术、品质与绿色合规，重点扶持固态电池、更长储存循环寿命及碳溯源。\u003c/li>\n\u003cli>市场与宏观信号交织：港股创3月以来最大跌幅，金融股领跌，更多券商加入禁止内地资金买港股行列；隔夜美股和日韩上涨。美股第四季度第1交易日，标普500上涨20个基点收于7666点，纳斯达克100上涨31个基点报30501点；8月PCE超预期回落、9月ADP就业走强、二季度GDP终值上修，形成冷热相宜的数据组合。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>半导体/先进封装与存储\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：美光业绩与指引强劲，新签客户协议叠加资本开支上修以支撑供给扩张；2027财年资本开支显著跃升，逾半数增量用于HBM及常规DRAM产能扩张；2027年和2028年内存和存储供应预计比2026年更紧张。台积电预期三季度业绩强劲、四季度指引健康且产能爬坡加速，目标价上调至3300新台币；2027年台积电将实施更广泛晶圆提价，先进制程N3、N2涨幅约10%，成熟制程迎来自本轮AI半导体上行周期以来首次提价，幅度为低至中个位数。\u003c/li>\n\u003cli>今天出现的催化/验证：美光第四财季销售额542亿美元，环比增长31%、同比增长379%；三星在HBM4价格谈判中报价每千兆4美元中高段，比当前主流HBM3E每千兆比特1.50美元高出三倍多；屹唐股份被看好，干法去胶及RTP领先地位支撑核心业务，刻蚀设备与等离子体表面处理设备驱动下一阶段增长。风险验证为CXMT持续获取DRAM份额冲击定价。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI基建资本洪流重塑跨资产风险定价，超大规模云厂商、新云及数据中心SPV通过IG债、HY债、可转债及股权融资为AI数据中心建设募资；2026年初至今上述渠道融资总额达3460亿美元，较2025年全年1720亿美元翻倍。亚马逊寻求向投资者转让价值约80亿美元的Nvidia芯片，以更轻资产模式改善资产负债表；博通开始筹集600亿美元为Anthropic芯片提供支持；Nvidia和SoftBank完成对OpenAI上一轮融资的最后200亿美元投资。\u003c/li>\n\u003cli>今天出现的催化/验证：英伟达Vera Rubin Ultra与AWS Trainium 3液冷机柜冷却部件价值大幅提升，成本上升因GPU/ASIC功耗提升、冷板设计复杂度提高、快拆接头规格升级；壁仞科技BR20X已点亮并将投入量产，基于国产工艺，支持FP8/FP4，配备144GB HBM3E，卡间互联超900GB/s，性能超越H200；Liquid。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：FCC拟通过《Covered List》实施管制，约束中国产3.2T光收发模块，最早或2026年10月启动，采用分阶段落地模式；设置豁免条款，若BOM中美国本土元器件占比≥65%，中国制造光模块仍可进口美国。政策目标是重塑下一代供应链，而非立刻替换现有800G/1.6T中国供应，不会对云厂商现有建设造成瓶颈。\u003c/li>\n\u003cli>今天出现的催化/验证：800G/1.6T模块将不受影响；美国仅AAOI具备可观光模块制造能力，预计2026年末年化产能1200万只800G/1.6T；初期3.2T产品出货量预计到2029年才会明显爬坡，即便监管很快落地，对营收短期冲击有限。A股影响可分成三档，受益方向首先是光器件，代表为天孚通信。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>新能源/汽车\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：9月新能源车销量披露，比亚迪、零跑维持同比高增，小鹏同比微降；电池“十五五”规划重心从产能扩张转向技术、品质与绿色合规，重点扶持固态电池、更长储存循环寿命以及碳溯源相关方向；投资者反馈显示该规划将利好头部电池制造。宁德时代和正力新能被列为中国电池行业重点标的，行业份额将进一步向具备规模、技术和成本优势的企业集中，宁德时代继续被列为行业首选。\u003c/li>\n\u003cli>今天出现的催化/验证：比亚迪9月交付463,561辆，同比增长17.0%、环比增长5.3%，Q3累计1,323,065辆，同比增长18.7%；零跑交付105,656辆，同比增长58.5%、环比增长2.5%，Q3累计310,052辆，同比增长78.3%；小鹏交付41,256辆，同比下降0.8%、环比增长5.5%，Q3累计118,390辆，同比增长2.1%。碳酸锂周度更新显示本周进一步去库，SMM电池级碳酸锂12.3万元/吨，周环比下降9.2%。赛力斯与华为达成新五年合作，联合组建问界业务专属团队升级问界业务。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>机器人/自动化\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：怡合达维持“买入”评级，但下调2026/2027财年盈利预测，下调幅度分别为11%/7%，主要因展会投入、数字化建设以及员工持股计划带来更高运营成本；公司可把握电子、半导体行业长尾机会，并抓住光模块、人形机器人、航空航天等AI相关赛道长尾业务机遇；若增量需求主要来自国内人形机器人、光模块、半导体设备行业，怡合达有机会取得更高市场占有率。\u003c/li>\n\u003cli>今天出现的催化/验证：安费诺投资者实地调研在康涅狄格州沃林福德总部开展，交流议题包含市场定位、成功内在原因、下游终端需求趋势、供应链情况，管理层预计该终端市场第三季度内生收入将实现中双位数环比增长；东芝计划投入约600亿日元扩建菲律宾HDD制造设施，目标2027财年前将面向AI数据中心的HDD产能提高一倍，这是东芝约五年来首次对HDD业务进行大规模投资。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：港股大跌，更多券商加入禁止内地资金买港股行列；隔夜美股和日韩上涨，港股表现与外部市场背离。中国经济增长放缓后考虑更具针对性的财政支持；美国放缓对华飞机零部件出口，特朗普寻求在贸易谈判中增加筹码；日本经济界代表团拟明年3月访华。\u003c/li>\n\u003cli>今天出现的催化/验证：香港股市创3月以来最大跌幅，金融股领跌；美股第四季度第1交易日，标普500上涨20个基点收于7666点，收盘竞价45亿美元买入，纳斯达克100上涨31个基点报30501点；韩国KOSPI上涨0.46%报7003.7点，外资净卖出1.06亿美元，KOSDAQ下跌0.11%报893.3点，外资净卖出1.29亿美元；8月PCE超预期回落、9月ADP就业数据走强、二季度GDP终值上修，形成冷热相宜的数据组合。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>美光2026财年第四财季销售额542亿美元，环比增长31%、同比增长379%；CEO表示2027年和2028年内存和存储供应将比2026年更加紧张。\u003c/li>\n\u003cli>美光2027财年资本开支将显著跃升，逾半数增量用于支持HBM及常规DRAM产能扩张；风险是CXMT持续获取DRAM份额冲击定价。\u003c/li>\n\u003cli>台积电重申增持，2027年6月目标价由3200新台币上调至3300新台币，基于约20倍12个月远期市盈率；上调依据为AI驱动先进制程需求持续强劲、N3与N2产能扩张提速。\u003c/li>\n\u003cli>台积电2027年将实施更广泛晶圆提价，先进制程N3、N2涨幅约10%，成熟制程N7及以上迎来自本轮AI半导体上行周期以来首次提价，幅度低至中个位数。\u003c/li>\n\u003cli>FCC潜在监管方向落在3.2T光模块，最早或2026年10月启动，分阶段落地；BOM中美国本土元器件占比≥65%可豁免，800G/1.6T模块不受影响。\u003c/li>\n\u003cli>美国仅AAOI具备可观光模块制造能力，预计2026年末年化产能1200万只800G/1.6T；初期3.2T产品出货量预计到2029年才会明显爬坡。\u003c/li>\n\u003cli>亚马逊寻求向投资者转让价值约80亿美元的Nvidia芯片，工具由外部投资者提供资金，可发行债务并向投资者出售至多10%股权，使亚马逊回租芯片并采用更轻资产融资模式。\u003c/li>\n\u003cli>博通开始筹集600亿美元资金为Anthropic芯片提供支持，参与银行准备就420亿美元A类高级担保部分发出辛迪加信函；Nvidia和SoftBank各完成100亿美元、合计200亿美元对OpenAI上一轮融资投资。\u003c/li>\n\u003cli>三星在HBM4价格谈判中报价每千兆4美元中高段位，比当前主流HBM3E每千兆比特1.50美元高出三倍多。\u003c/li>\n\u003cli>壁仞科技BR20X近期已点亮并将投入量产，基于国产工艺，支持FP8/FP4，配备144GB HBM3E，卡间互联超900GB/s，性能超越H200，定价或较为可观。\u003c/li>\n\u003cli>比亚迪9月交付463,561辆，同比增长17.0%、环比增长5.3%，Q3累计1,323,065辆，同比增长18.7%；零跑交付105,656辆，同比增长58.5%、环比增长2.5%，Q3累计310,052辆，同比增长78.3%；小鹏交付41,256辆，同比下降0.8%、环比增长5.5%。\u003c/li>\n\u003cli>碳酸锂周度更新：SMM电池级碳酸锂12.3万元/吨，周环比下降9.2%，本周进一步去库，锂价下跌。\u003c/li>\n\u003cli>国务院9月28日发布的“十五五”规划中，电池产业规划重心从产能扩张转向技术、品质与绿色合规层面，重点扶持固态电池、更长储存循环寿命以及碳溯源相关方向；投资者反馈显示将利好头部电池制造。采用外部采购电池方案的新能源汽车品牌则遭遇一定成本压力，并需调整固态电池相关技术落地时间规划。\u003c/li>\n\u003cli>宁德时代和正力新能被列为中国电池行业重点标的，行业份额将进一步向具备规模、技术和成本优势的企业集中，宁德时代继续被列为行业首选。\u003c/li>\n\u003cli>港股创3月以来最大跌幅，金融股领跌；更多券商加入禁止内地资金买港股行列；隔夜美股和日韩上涨。\u003c/li>\n\u003cli>美股第四季度第1交易日，标普500上涨20个基点收于7666点，收盘竞价45亿美元买入；纳斯达克100上涨31个基点报30501点。\u003c/li>\n\u003cli>8月PCE超预期回落，9月ADP就业数据走强，二季度GDP终值上修，形成冷热相宜的数据组合。\u003c/li>\n\u003cli>礼来在米兰会议上公布的研究显示，其在减肥方面取得创纪录成绩，超越诺和诺德，并取得提高肥胖症和糖尿病患者治疗标准的成果；诺华与中国公司签署价值高达78亿美元的mRNA疗法交易协议。\u003c/li>\n\u003cli>怡合达下调2026/2027财年盈利预测，下调幅度分别为11%/7%，主要因展会投入、数字化建设及员工持股计划带来更高运营成本，但维持“买入”评级，并关注电子、半导体长尾及光模块、人形机器人、航空航天等AI相关赛道机遇。\u003c/li>\n\u003cli>安费诺实地调研显示，管理层预计该终端市场第三季度内生收入将实现中双位数环比增长；东芝计划投入约600亿日元扩建菲律宾HDD制造设施，目标2027财年前将面向AI数据中心的HDD产能提高一倍。\u003c/li>\n\u003cli>美股EDA主题方面，AI4S不只是制药；卫星/太空数据中心/情报摄入层也需要上修至少15%；液冷仿真/太空数据中心仿真加速2.5倍。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>FCC 3.2T光模块监管规则是否最早于10月颁布并生效，分阶段实施节奏、BOM美国本土元器件≥65%豁免条款的实际执行，以及对800G/1.6T与3.2T产品出货的差别影响。\u003c/li>\n\u003cli>美光2027财年资本开支落地节奏，HBM及常规DRAM产能扩张进度，2027年和2028年供需紧张程度，以及CXMT份额提升对DRAM定价的冲击。\u003c/li>\n\u003cli>台积电三季度业绩、四季度指引、N3与N2产能扩张速度，以及2027年先进制程与成熟制程提价能否全面落地。\u003c/li>\n\u003cli>三星HBM4价格谈判进展及每千兆4美元中高段报价能否被主要客户接受，对HBM3E价格体系和存储厂盈利的影响。\u003c/li>\n\u003cli>亚马逊约80亿美元Nvidia芯片转让工具的结构、发行进展及外部投资者参与情况，是否形成更轻资产融资模式的示范。\u003c/li>\n\u003cli>博通600亿美元AI芯片融资进展，尤其是420亿美元A类高级担保部分的辛迪加结果，以及对Anthropic等公司芯片供应的支持。\u003c/li>\n\u003cli>Nvidia和SoftBank完成对OpenAI上一轮融资最后200亿美元投资后的后续融资动作，以及Anthropic与OpenAI估值差距变化。\u003c/li>\n\u003cli>英伟达Vera Rubin Ultra与AWS Trainium 3液冷机柜冷却部件价值提升，GPU/ASIC功耗提升、冷板设计复杂度提高、快拆接头规格升级对供应链的持续拉动。\u003c/li>\n\u003cli>壁仞科技BR20X量产进度、基于国产工艺的实际性能与定价，以及国产GPU在H200对标中的客户验证。\u003c/li>\n\u003cli>9月全月新能源汽车零售量是否出现同比两位数下滑，外部采购电池方案品牌的成本压力与固态电池技术落地时间调整。\u003c/li>\n\u003cli>电池“十五五”政策对固态电池、长循环寿命、碳溯源相关方向的后续配套措施，以及头部电池制造企业份额集中趋势。\u003c/li>\n\u003cli>碳酸锂去库与锂价下跌的持续性，SMM电池级碳酸锂12.3万元/吨周环比下降9.2%后的下一步价格与库存验证。\u003c/li>\n\u003cli>港股资金限制变化，更多券商禁止内地资金买港股的范围与影响；隔夜美股和日韩上涨与港股下跌背离是否延续。\u003c/li>\n\u003cli>8月PCE超预期回落、9月ADP走强、二季度GDP终值上修后的市场降息与增长预期变化。\u003c/li>\n\u003cli>美国对华飞机零部件出口放缓、特朗普贸易谈判筹码、日本经济界代表团拟明年3月访华、中国更具针对性财政支持的后续进展。\u003c/li>\n\u003cli>10月TMT催化剂观察涉及30多个事件，10月5日当周旧金山科技周于10月5日至11日举办。\u003c/li>\n\u003cli>怡合达新兴行业长尾机会兑现情况，安费诺第三季度内生收入中双位数环比增长指引，以及东芝菲律宾HDD产能翻倍计划。\u003c/li>\n\u003cli>AI4S主题中卫星/太空数据中心/情报摄入层上修至少15%、液冷仿真/太空数据中心仿真加速2.5倍的后续验证。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>11:54｜摩根大通——台积电（2330.TW）：预期三季度业绩强劲、四季度指引健康且产能爬坡加速——目标价上调至3300新台币 • 投资评级与估值：重申增持，目标价上调至3300新台币 摩根大通维持台积电增持评级，将2027年6月目标价由3200新台币上调至3300新台币，基于约20倍12个月远期市盈率。上调依据为AI驱动的先进制程需求持续强劲、N3与N2产能扩张提速，以及A14制程节点提前量产带来的增量贡献。\u003c/li>\n\u003cli>11:54｜巴克莱——美国股票策略：AI风险溢价的演变 • 核心主题：AI基建资本洪流重塑跨资产风险定价 超大规模云厂商、新云及数据中心SPV通过IG债、HY债、可转债及股权融资渠道，为史无前例的AI数据中心建设募资。2026年初至今，上述渠道融资总额达3460亿美元，较2025年全年的1720亿美元翻倍。\u003c/li>\n\u003cli>11:55｜【东吴电新】碳酸锂周度更新（9.25-10.1）：本周进一步去库，锂价下跌 #价格：本周碳酸锂现货、精矿价格下跌。SMM电池级碳酸锂12.3万元/吨，周环比-9.2%\u003c/li>\n\u003cli>11:55｜汽车核心新能源品牌9月销量速览： -比亚迪：交付463,56 const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=(v)=>Array.isArray(v)?'<ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
