 "kind": "post", "title": "2026-10-21 22:36", "source_label": "帖子正文", "excerpt": "看好公司几大业务线齐头并进，光芯片业务进展加速，#核心大客户积极锁定公司产能来缓解物料紧缺问题，公司27年产能超亿颗。", "content": "", "publish_time": "2026-10-21 22:36", "tags": ["下游涵盖国内外头部客户", "100mw", "文字观点"]}, "post:2026-10-21T22-38:0f1755fa840c": {"id": "post:2026-10-21T22-38:0f1755fa840c", "kind": "post", "title": "2026-10-21 22:38", "source_label": "帖子正文", "excerpt": "【国海通信】仕佳光子2026三季报点评：营收及净利润同比高增，28亿元定增已获受理公司发布2026年三季报：2026Q1-Q3公司实现营收27.22亿元，同比增长74.46%", "content": "", "publish_time": "2026-10-21 22:38", "tags": ["文字观点"]}, "post:2026-10-21T18-15:a7bc3985c509": {"id": "post:2026-10-21T18-15:a7bc3985c509", "kind": "post", "title": "2026-10-21 18:15", "source_label": "帖子正文", "excerpt": "【国盛电子】东山精密：平台型公司强者恒强，一栈式布局完善 【光芯片+光模块业务】行业整体处于紧缺状态，索尔思已打入m，n，o，a等多家北美一线龙头客户，x等新客户进展十分顺利，NP", "content": "", "publish_time": "2026-10-21 18:15", "tags": ["文字观点"]}, "post:2026-10-21T09-17:930587df9eb0": {"id": "post:2026-10-21T09-17:930587df9eb0", "kind": "post", "title": "2026-10-21 09:17", "source_label": "帖子正文", "excerpt": "【优利德】期待矢量网络分析仪（VNA）、1.6T光模块采样示波器等新产品接力亮相！", "content": "", "publish_time": "2026-10-21 09:17", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-21T12-58:c2950fd27e5d": {"id": "post:2026-10-21T12-58:c2950fd27e5d", "kind": "post", "title": "2026-10-21 12:58", "source_label": "帖子正文", "excerpt": "专家要点：数据中心 1. Open-Source Models Closing the Gap 1. 开源模型正在缩小差距 > Open-source models are catching up to state-of-the-art frontier models faster than exp", "content": "专家要点：数据中心 1. Open-Source Models Closing the Gap 1. 开源模型正在缩小差距 > Open-source models are catching up to state-of-the-art frontier models faster than expected, driven by lower costs and improved performance. > 在成本降低、性能提升的推动下，开源模型追赶前沿顶尖模型的速度超出预期。 > Starting in Q2, customers began replacing Anthropic and OpenAI models with open-source alternatives (such as Qwen variants like Composer 2.5). > 从第二季度开始，客户逐渐以开源替代方案（例如 Qwen 系列模型，如 Composer 2.5）取代 Anthropic 和 OpenAI 的模型。 > The transition started with basic tasks like tool calling and Model Context Protocol (MCP) and has advanced to low-level agent orchestration (e.g., parallel code searches). > 这一转变最初涉及工具调用和模型上下文协议（MCP）等基础任务，如今已扩展到低层级的智能体编排（例如并行代码搜索）。 2. Compute Capacity & Latency Bottlenecks 2. 算力容量与延迟瓶颈 > Demand is constrained by GPU capacity, with some companies experiencing 5x traffic growth. > GPU 容量限制了需求的满足；部分公司的流量增长了 5 倍。 > Capacity shortages are most acute in the U.S., where strict latency requirements prevent companies from shifting workloads overseas to regions with available supply (e.g., Singapore, Malaysia, Australia). > 美国的容量短缺尤为严重。由于严格的延迟要求，企业无法将工作负载转移到供应充足的海外地区（例如新加坡、马来西亚和澳大利亚）。 3. Compute Provider Ecosystem Dynamics 3. 云服务提供商生态动态 > AWS, GCP, Azure, and Oracle offer reliability but are expensive, require long-term commitments (3+ years), and lack immediate availability for late-generation hardware (such as NVIDIA B300s). > AWS、GCP、Azure 和 Oracle 可靠，但价格昂贵，要求长期承诺（3 年以上），且无法立即提供最新一代硬件（例如 NVIDIA B300）。 > Companies host 80–90% of their capacity with neoclouds (e.g., CoreWeave, Lambda Labs, Nebius) due to cost flexibility. However, neoclouds suffer from reliability issues (e.g., unexpected GPU drop-offs from networking failures or Blackwell overheating), requiring ongoing engineering resources to manage fleet stability. > 由于成本灵活，企业将 80%–90% 的算力托管在新兴云服务商（如 CoreWeave、Lambda Labs、Nebius）。然而，新兴云服务商存在可靠性问题（例如网络故障或 Blackwell 过热导致 GPU 意外掉线），需要持续投入工程资源来维护集群稳定性。 > Small operators leasing GPU racks (typically ~4,000 GPUs) attempt to recoup investments within 1–2 years. In practice, they are often unusable due to a lack of cloud management, infrastructure maintenance, and operational expertise. > 租赁 GPU 机柜的小型运营商（通常为 ~4,000 块 GPU）试图在 1–2 年内收回投资。但实际上，由于缺乏云管理、基础设施维护和运营专业能力，这些设备往往无法使用。 4. Supply Dynamics & Industry Bottlenecks 4. 供应动态与行业瓶颈 > While NVIDIA continues to scale GPU production, the true limitation in the U.S. is power/electricity supply and data center infrastructure, rather than physical GPU availability. > 尽管 NVIDIA 持续扩大 GPU 产能，但美国真正的限制因素是电力供应和数据中心基础设施，而非 GPU 实体供应。 > Major model developers and players with spare capacity are beginning to lease out their idle GPU fleets directly to the market. > 主要模型开发商和拥有闲置产能的参与者开始将闲置 GPU 集群直接出租给市场。 5. Payment Terms & Financial Structures 5. 付款条款与财务结构 > U.S.-based neoclouds generally require 20%–30% upfront prepayment, with the remainder paid monthly or quarterly, and rebates negotiated at term completion for SLA/traffic disruptions. > 美国本土的新兴云服务商通常要求预付 20%–30%，其余款项按月或按季度支付；若发生 SLA 违约或流量中断，客户可在合同期满时协商获得返利。 > Providers in the APAC region operate under more lenient terms, requiring no prepayment upfront. > 亚太地区的服务商条款更宽松，无需预付款。", "publish_time": "2026-10-21 12:58", "tags": []}, "post:2026-10-21T21-26:3c5789237801": {"id": "post:2026-10-21T21-26:3c5789237801", "kind": "post", "title": "2026-10-21 21:26", "source_label": "帖子正文", "excerpt": "📌 黄仁勋GTC柏林演讲要点速递 1️⃣ 主线：欧洲要从\"用AI\"变成\"造AI\"，加入token经济叙事 🌟 原话大意：参与AI经济不能只消费AI，要生产AI；按能源→算力→AI工厂→模型→应用五层，欧洲每层都要有自己的公司。", "content": "📌 黄仁勋GTC柏林演讲要点速递 1️⃣ 主线：欧洲要从\"用AI\"变成\"造AI\"，加入token经济叙事 🌟 原话大意：参与AI经济不能只消费AI，要生产AI；按能源→算力→AI工厂→模型→应用五层，欧洲每层都要有自己的公司。 🌟 英伟达过去一年在欧洲投了近100亿美元，本周在法、英、瑞典、德国投了14家初创公司，欧洲合作方超1.2万家。 🌟 客户名单变长：去年只谈OpenAI，今年点名OpenAI、Anthropic、Meta、Grok、Gemini，另有Mistral、Nebius等区域云。#算力买家在变多（各国自建和更多模型厂）。 2️⃣ AI工厂：DSX POD把上线时间从4-5个月压到1个月 🌟 7个Vera Rubin液冷机柜加17公里线缆，原来在现场装，现在在供应链里装好测好，装集装箱发货。 🌟 1GW造价约500亿美元、年收入约400亿美元，晚上线3个月少收约100亿美元。#没有新的订单数字。3️⃣ Agent：token用量暴涨，带动GPU需求 🌟 重申AI不会干掉软件：agent干活要靠工具，工具公司都会变成agent公司，企业的数据和工具是自己的。#对AI应用是正面表态4️⃣ 物理AI：Robotaxi有新进展，人形还在铺路 🌟 Robotaxi：Hyperion做统一标准（14摄像头、9雷达、3激光雷达、双GPU），新增大众商用车、捷豹路虎新车、沃尔沃车队、奔驰下一代4个车系，接入网约车平台组成\"虚拟车队\"；全球每年1万亿英里，按每英里1-2美元算空间。英伟达自己也做自动驾驶软件。 🌟 人形：参考机Agile ONE明年一季度上市，预装算力和软件；他认为人形会是出货量最大的机器人形态，前提是先统一标准。 🌟 电信：基站也算物理AI，全球约10万个站点、100GW未来会变成分布式AI网络；上周和诺基亚在T-Mobile网络打通首个商用电话。 🌟 演示：Astra用FreeCAD、Blender建3D物体，在Isaac Sim里搭训练场景，训练放在云端；做这个机器人的Pollen Robotics只有约10人。#3D资产和训练场景是真实需求近期风语筑/阅文/乐动机器人/中坚/凡拓/上海电影调研情况欢迎小窗交流～#文字观点", "publish_time": "2026-10-21 21:26", "tags": ["没有新的订单数字", "对AI应用是正面表态", "3D资产和训练场景是真实需求", "文字观点"]}, "post:2026-10-21T10-36:6690cc4c7487": {"id": "post:2026-10-21T10-36:6690cc4c7487", "kind": "post", "title": "2026-10-21 10:36", "source_label": "帖子正文", "excerpt": "专家要点1. 开源模型正在缩小差距在成本降低、性能提升的推动下，开源模型追赶前沿顶尖模型的速度超出预期。从第二季度开始，客户逐渐以开源替代方案（例如 Qwen 系列模型，如 Composer 2.5）取代 Anthropic 和 OpenAI 的模型。", "content": "专家要点1. 开源模型正在缩小差距在成本降低、性能提升的推动下，开源模型追赶前沿顶尖模型的速度超出预期。 从第二季度开始，客户逐渐以开源替代方案（例如 Qwen 系列模型，如 Composer 2.5）取代 Anthropic 和 OpenAI 的模型。 这一转变最初涉及工具调用和模型上下文协议（MCP）等基础任务，如今已扩展到低层级的智能体编排，例如并行代码搜索。2. 算力容量与延迟瓶颈GPU 容量限制了需求的满足，部分公司的流量增长了 5 倍。 美国的容量短缺尤为严重，由于严格的延迟要求，公司无法将工作负载转移到供应充足的海外地区，例如新加坡、马来西亚和澳大利亚。3. 云服务提供商生态动态AWS、GCP、Azure 和 Oracle 服务可靠，但价格昂贵，要求长期承诺，期限在 3 年以上，且无法立即提供最新一代硬件，例如 NVIDIA B300。 由于成本灵活，公司将 80%‑90% 的算力托管在新兴云服务商，如 CoreWeave、Lambda Labs、Nebius。然而，新兴云服务商存在可靠性问题，例如网络故障或者 Blackwell 过热造成 GPU 意外掉线，需要持续投入工程资源维护集群稳定性。 租赁 GPU 机柜的小型运营商，通常规模约 4000 块 GPU，试图在 1‑2 年内收回投资。但实际上，受限于云管理能力、基础设施维护水平以及运营专业能力不足，这些设备往往无法投入使用。4. 供应动态与行业瓶颈尽管 NVIDIA 持续扩大 GPU 产能，但美国真正的制约因素是电力供应与数据中心基础设施，并非 GPU 实物供给。 头部模型开发机构以及手握闲置产能的市场参与者，已经开始直接对外出租闲置的 GPU 集群。5. 付款条款与财务结构美国本土的新兴云服务商一般要求客户预付 20%‑30% 款项，剩余部分按月度或者季度结算；如果出现服务等级协议违约、流量中断，客户可以在合同到期后协商获取返利。 亚太地区服务商的合作条款相对宽松，不需要客户支付预付款。#文字观点", "publish_time": "2026-10-21 10:36", "tags": ["文字观点"]}, "attachment:files/中信建投-计算机行业超节点系列报告1：国产算力的下一个主战场-261020.pdf": {"id": "attachment:files/中信建投-计算机行业超节点系列报告1：国产算力的下一个主战场-261020.pdf", "kind": "attachment", "title": "中信建投-计算机行业超节点系列报告1：国产算力的下一个主战场-261020", "source_label": "中信建投", "excerpt": "超节点系列报告 1： 国产算力的下一个主战场", "content": "超节点系列报告 1： 国产算力的下一个主战场证券研究报告 本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下，本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。发布日期：2026年10月20日分析师：应瑛 yingying@csc.com.cn SAC 编号：S1440521100010分析师：王嘉昊 wangjiahao@csc.com.cn SAC 编号：S1440524030002分析师：方闻千 fangwenqian@csc.com.cn SAC 编号：S1440526030002行业动态报告 下载日志已记录，仅供内部参考 2核心观点 超节点通过扩大 ScaleUp 互联域、统一内存编址并提升柜内互联效率，以系统工 程能力突破传统八卡服务器在跨节点通信上的瓶颈，相比传统算力集群，超节点 在算力利用率、互联带宽、吞吐、时延、 MoE 适配和单卡有效吞吐等维度均存 在显著优势。目前 国内外厂商当前正密集发布超节点产品，行业由方案验证正式 进入规模化交付阶段。产业链细分环节来看，服务器整机、交换芯片、交换机、 连接器等产业环节有望率先受益。此外， PCB、液冷、电源、 CPU 及国产算力芯 片等环节也将随超节点渗透率提升而持续受益。 下载日志已记录，仅供内部参考 3内容摘要 2026年是国产超节点的落地元年， 超节点在大模型训推场景优势显著 。随着大模型参数规模持续提升，超节点已成为突破内存墙、通信墙的必然 工程解法；同时传统集群算力闲置率偏高，客户对有效算力提升的需求愈发刚性。超节点通过扩大 ScaleUp 互联域、统一内存编址并提升柜内互 联效率，以系统工程能力突破传统八卡服务器在跨节点通信上的瓶颈，相比传统算力集群，超节点在算力利用率、互联带宽、吞吐、时延、 MoE 适配和单卡有效吞吐等维度均优势。 国内外厂商当前正密集发布超节点产品，行业由方案验证进入规模化交付阶段。 海外方面，英伟达以 GB200／GB300 NVL72 为起点，向Vera Rubin NVL144、NVL288 和NVL576 演进，通过更大的NVLink 域、正交背板及柜间光互联持续提升单柜性能。国内方面，华为昇腾已发布 Atlas 950／960 SuperPoD，阿里推出磐久AL128、AL64 和AL144；百度昆仑芯、海光、沐曦、摩尔线程、燧原科技、壁仞科技等芯片厂商也相继布局 ，浪潮信息、中科曙光、紫光股份、中兴通讯、华勤技术等服务器及 ODM 厂商同步推进整机柜交付。随着头部云厂商和行业客户开始部署， 2026 年有望成为国产超节点放量元年，渗透率进入快速提升通道。 服务器整机、交换芯片、交换机、连接器等产业环节将率先受益。 首先，超节点将交付单元由单机升级为整机柜或 Pod 级系统，计算、交换、 供电、液冷和结构件需协同设计，整机厂商的集成价值量、技术壁垒与客户粘性同步提升，头部整机及 ODM 厂商有望率先兑现业绩弹性。其次， Scale-Up 架构新增一级柜内交换，交换芯片与 AI 芯片的配比明显提高，且交换芯片规格升级带来单机价值量提升，交换芯片与交换机环节具备 更大的量价弹性。再次，单柜卡数提升及正交直连架构带动高速连接器用量增长，连接器速率由 56G向112G、224G 迭代，产品单价亦具备上行 空间。此外，PCB、液冷、电源、CPU 及国产算力芯片等环节也将随超节点渗透率提升而受益。 相关标的：1）服务器整机：浪潮信息、华勤技术、中科曙光、软通动力、神州数码等；（ 2）交换机&交换芯片：锐捷网络、盛科通信等；（ 3） 连接器：华丰科技、胜蓝股份等；（ 4）国产芯片：寒武纪、海光信息、摩尔线程、沐曦股份、燧原科技、壁仞科技、天数智芯等。 风险提示：下游客户需求波动风险、供应链稳定性风险、行业竞争加剧。 下载日志已记录，仅供内部参考 目录CONTENTS 1、超节点在大模型训推场景优势显著 2、国内外超节点产品密集发布， 行业进入规模化交付阶段 3、超节点产业链梳理&核心受益环节 4、投资建议 5、风险提示 下载日志已记录，仅供内部参考 5超节点多维度提升算力基础设施效率 大模型参数规模由万亿量级向十万亿量级演进，传统算力集群难以承载训练与推理负载。 MoE架构下每层需执行上百次专家路由通信， Agent场景下 KV Cache容量呈TB级增长，芯片间数据移动开销超过芯片内计算，成为集群有效算力的主要约束。 超节点通过统一互联协议与跨物理节点统一内存编址，提升通信效率。 超节点具备跨节点统一内存编址， 950SuperPod拥有256TB全局统一编址，相 比8卡节点间相互隔离规避传统分布式通信的数据拷贝与序列化开销。 《超节点定义与实践白皮书 》案例中，华为Atlas900 A3 SuperPod实测卡间单 跳时延由2-3μs降至约200ns；某互联网客户在DeepSeek-V3二次训练中All2All性能较RoCE提升5–6倍。 超节点大幅提升单域上限。 华为昇腾950SuperPod、阿里磐久AL64等当前最新超节点产品可实现单柜 64卡，分别可扩展至单域内 8192卡、1024卡，突 破8卡服务器单域上限，华为昇腾 960超节点预计将扩展至单节点 4096卡较前代进一步提升。 资料来源：中信建投证券表：超节点多维度提升算力基础设施效率 收益维度 定义 技术原理 主导机制 算力利用率（MFU）峰值算力中真正用于模型计算的 占比通信时间占比下降（40%→被掩盖）+ 无需频繁跨 节点重分布+ 气泡消除互联带宽 吞吐 单位时间集群token 产出权重瘦身（42GB→2.33GB）→ 显存转KV Cache → Batch 8→30；KV 池化免搬运、前缀复用带宽+ 内存语义双驱动 ‑2 台设备。前端市场对标科磊，它的市场空间假设具备合理性，但后端市场该假设并不成立；后端赛道现有参与者已经较多，该预期让我们感到意外。 摩根士丹利中立观点：应用材料布局前端工艺控制业务逻辑通顺，但我们对它后端业务的发展目标存在疑问。 应用材料发力前端光学检测业务具备合理性，该赛道存在明确机会，目前科磊近乎处于垄断地位。 今年应用材料工艺控制业务增速高于科磊，应用材料增速 50% 以上，摩根士丹利预测科磊增速 25%。 但即便应用材料工艺控制业务实现 50% 增速，营收也只是略微超过 2022 年前期高点，还需要观察来年能否继续维持高增长。 针对后端业务，我们存有疑惑。电子束技术或许存在部分独特应用场景，但大概率只能够作为补充方案；先进封装工艺控制最核心的要求，是兼顾高缺陷检测灵敏度与检测吞吐量。 另外科磊直到 2026 年，先进封装相关营收才突破 10 亿美元；应用材料想要做到同等规模，需要夺取可观的市场份额。 争论二：零部件短缺问题 MKS 仪器立场：部分零部件交期开始拉长，但受同行产能受限影响，我们拿到更多订单。我们已经对部分零部件增加备货，重点是那些在过往周期中给我们造成麻烦的零部件。 AEIS 的立场：我们吸取了 2022 年的经验教训，正在提高库存水平，提前应对潜在的零部件短缺。 摩根士丹利观点（偏向看好 MKS 仪器、AEIS）：我们首次观测到实质性零部件问题的信号，印制电路板短缺是核心矛盾。MKS 仪器与 AEIS 两家公司都曾在 2022 年因为零部件短缺受到明显冲击，当前两家都在提高被视作风险点的零部件库存。 MKS 仪器在和我们会面时提出几个值得关注的信息点： 供应商层面：部分零部件交期拉长。95% 的供应商我们并不担心，但还有 5% 的供应商，我们需要深度介入跟进。 同行层面：部分竞争对手扩产进度不及预期；客户要求我们针对双源供应的产品提高供货量。 优先级：首席执行官约翰・李表示，公司第一要务就是扩充产能，满足客户需求。 争论三：测试设备赋能先进封装 泰瑞达立场：计算测试事业部总经理罗伊・乔雷夫在主题演讲《依靠测试打通先进封装技术路线》当中提出两点内容。 第一，测试左移：为了在成本允许的最早环节检出缺陷，催生裸芯片探针、分立器件探针等新增测试工序。 第二，测试成为营收保障工具。受产能限制、百万缺陷容忍度极低的影响，测试已经从单纯的成本管控环节转变为保护营收的关键环节。 摩根士丹利观点（中性偏看好泰瑞达）：我们认同罗伊・乔雷夫阐述的全部内容。尚存的疑问是测试设备占晶圆设备整体的比重会抬升到何等水平；该占比已经出现明显上行，2020‑2024 年均值 5.8%，摩根士丹利预测 2026 年达到 8.5%。#文字观点", "publish_time": "2026-10-21 11:30", "tags": ["文字观点"]}, "post:2026-10-21T12-19:6ef4396f1ade": {"id": "post:2026-10-21T12-19:6ef4396f1ade", "kind": "post", "title": "2026-10-21 12:19", "source_label": "帖子正文", "excerpt": "大摩‑SEMICON West 要点总结 我们在参加 SEMICON West 展会之前，原本期待会看到有关整体行业趋势、硅光及配套测试、先进封装领域大量积极的行业言论。尽管整体市场情绪保持高涨，但展会结束后我们的态度却偏向矛盾。", "content": "大摩‑SEMICON West 要点总结 我们在参加 SEMICON West 展会之前，原本期待会看到有关整体行业趋势、硅光及配套测试、先进封装领域大量积极的行业言论。 尽管整体市场情绪保持高涨，但展会结束后我们的态度却偏向矛盾。 除去行业普遍 “所有人都很乐观” 这一共识之外，我们整理出如下核心要点。 2026 对比 2027：供应链环境将发生巨大改变。从 2025 年第四季度到 2026 年第四季度，仅仅四个季度时间，行业年化运行规模就从约 1250 亿美元扩张至约 2000 亿美元，这一轮增长很大程度依靠供应商提升现有产能利用率来实现。 但是 2027 年，即便是要达成基准情景预测（摩根士丹利预测增长 37%，规模达到 2230 亿美元），行业也必须新增大量产能，这项任务的难度会显著高于 2026 年。 行业正在向着乐观情景的方向演进。我们感受到产业链扩充产能的意愿出现明显提升。 业务部门负责人着重指出，如果竞争对手选择扩产而自身不跟进扩产，将会产生巨大机会成本。 主要次级供应商提及应用材料计划到 2028 年实现产能翻倍；整条供应链各个环节愿意加大投入，以支撑 2028 年晶圆设备市场规模达到 2 测试设备占晶圆设备整体的比重会抬升到何等水平；该占比已经出现明显上行，2020‑2024 年均值 5.8%，摩根士丹利预测 2026 年达到 8.5%。#文字观点", "publish_time": "2026-10-21 12:19", "tags": ["文字观点"]}, "post:2026-10-21T13-03:3258bf22eac2": {"id": "post:2026-10-21T13-03:3258bf22eac2", "kind": "post", "title": "2026-10-21 13:03", "source_label": "帖子正文", "excerpt": "伯恩斯坦——澜起科技（6809.HK / 688008.CH）3Q26初步业绩：自上而下全面beat，净利率冲抵60%——近期错杀提供买点，维持跑赢大市 1. 核心结论：3Q26初步业绩自上而下全面超预期，营收同比加速至46%，毛利率环比走阔，归母净利率中点落至60.1%；近期抛压属情绪性误读，市场", "content": "伯恩斯坦——澜起科技（6809.HK / 688008.CH）3Q26初步业绩：自上而下全面beat，净利率冲抵60%——近期错杀提供买点，维持跑赢大市 1. 核心结论：3Q26初步业绩自上而下全面超预期，营收同比加速至46%，毛利率环比走阔，归母净利率中点落至60.1%；近期抛压属情绪性误读，市场错误将其归入存储周期标的，实则公司为纯正服务器CPU代理与DDR5接口芯片标的，不受存储周期摆布。伯恩斯坦维持“跑赢大市”，H股目标价520港元、A股目标价400元人民币，现价对应2027年预期市盈率约30倍，视为本季度首选标的（top pick），回调即为布局窗口。 2. 营收端：同比加速释放，供给约束边际缓和得到交叉印证 3Q26实现营业收入20.79亿元人民币，同比增长46%、环比增长10.9%，高出伯恩斯坦自身预测9.9%、高出市场一致预期3.2%；同比增速较2Q26的33%显著抬升。驱动来自两层共振：其一，智能体（agentic）AI浪潮下服务器CPU相关需求强劲释放；其二，DDR5世代迭代推动接口芯片升级放量。出货量的抬升叠加新品占比上行共同贡献增量。伯恩斯坦特别指出，上半年一度压制营收斜率的供应链约束，已在三季度显现边际缓解迹象，这与营收环比加速的读数相互印证，排除了“缺料硬顶”的中期担忧。 3. 毛利率：产品组合优化完全吸收代工与封测成本上行，市场低估组合红利 互连类芯片毛利率落于68.0%–68.5%区间，环比走阔57至107个基点、同比走阔231至281个基点。市场此前担忧全年锁价合同下芯片均价难以上调，且晶圆代工与OSAT成本上行将侵蚀毛利，但本次实绩证明：第三代、第四代乃至第五代寄存时钟驱动器（RCD）出货占比提升所带动的混合均价（blended ASP）改善，足以轻易覆盖成本端压力，这一经营杠杆正是市场模型显著低估的部分。换言之，毛利率的环比扩张并非成本红利，而是产品结构升级的内生结果，具备一定的可延续性。 4. 盈利端与经营杠杆：净利增速远超营收，但超高净利率不可简单线性外推 初步归母净利润区间为12.0亿至13.0亿元，中点12.5亿元，同比大增164%，高出伯恩斯坦预测26.8%、高出一致预期34.1%；中点净利率达60.1%，同比跳升2690个基点。伯恩斯坦拆解得出，净利高增除收入端的经营杠杆释放外，还受到3Q25一次性股份支付费用（SBC）形成的高费用基数反向放大效应——该基数扭曲了表观杠杆，因此60%量级的净利率不具备稳态可持续性，但收入增长撬动固定费用摊薄的底层经营杠杆，确属市场尚未充分定价的另一重上行期权。若剔除一次性扰动，经常性归母净利中点约10.0亿元，对应经常性净利率约48.1%，这一常态口径更贴近中期真实盈利中枢。 5. 估值框架与目标价推导：A股47倍前瞻两年市盈率锚定400元，H股享地缘稀缺溢价 伯恩斯坦披露估值方法：A股目标价400元对应47倍前瞻两年（2BF）市盈率；H股520港元目标价隐含较A股目标价15%的溢价（按人民币兑港元1:1.13汇率折算）。该行明确，H股溢价的逻辑支点在于：相较多数受实体清单或出口管制掣肘的中国半导体同业，澜起是全球资金视角下少有的“高纯度中国AI敞口+无直接地缘压制”稀缺标的，因而享有跨市场估值溢价。现价层面，H股收盘203港元对应2027年预期市盈率30.4倍，A股169.27元对应29.8倍，距离目标价均有充足空间；对应2026/2027年预期EPS分别为3.44元、5.69元（2025年实际1.97元）。 6. 叙事纠偏与交易含义：错杀即是买点，本季度首选的逻辑闭环 伯恩斯坦在报告中做了一次明确的叙事纠偏：近期的回撤并非基本面走弱，而是交易层面的认知错位——部分资金将澜起与存储周期品种混同交易，但公司实质业务属性是服务器互连与接口芯片，并非存储颗粒或模组厂商，天然隔离DRAM价格周期的双向波动。在30倍2027年预期市盈率的定价下，该行判断风险回报比已显著转优。交易策略上，不建议等待右侧确认，而是在情绪错杀阶段逆向吸纳；催化剂将来自后续季度DDR5渗透率数据、新一代RCD放量节奏及海外云厂商AI服务器capex指引的上修。 7. 关键风险监测 下行风险： 第一，内存与AIDC服务器总需求若出现周期性放缓，将直接压制RCD与内存接口芯片的长期渗透斜率；第二，同业竞争加剧引发份额流失与价格竞争，侵蚀当前优异的产品组合红利；第三，面向AIDC网络市场的新一代产品迭代迟滞，错过AI服务器架构升级窗口。 上行风险： 第一，agentic AI服务器出货超预期，带动DDR5及以上世代接口芯片升级节奏前置；第二，供应链约束较预期更快出清，令营收同比加速在2027年延续；第三，H股流动性改善叠加南向及外资增配，使15%的跨市场溢价进一步走阔。 伯恩斯坦终局判断：基本面clean beat已被初步数据坐实，估值并未透支，情绪面误读创造的回调是高质量介入窗口，维持跑赢大市与本季度top pick定位。#文字观点", "publish_time": "2026-10-21 13:03", "tags": ["文字观点"]}, "attachment:files/万联证券-人形机器人行业跟踪报告：首批人形机器人领域国家标准发布，资本布局持续加密-261020.pdf": {"id": "attachment:files/万联证券-人形机器人行业跟踪报告：首批人形机器人领域国家标准发布，资本布局持续加密-261020.pdf", "kind": "attachment", "title": "万联证券-人形机器人行业跟踪报告：首批人形机器人领域国家标准发布，资本布局持续加密-261020", "source_label": "万联证券", "excerpt": "第1页 / 共39 页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 半导体 分析师：邹臣 登记编码： S0730523100001 zouchen @ccnew.com 021 -50581991 AI驱动全球晶圆厂加速扩产，国产半导 体设备厂商迎来高速成长期 ——半导体行业深度 报告", "content": "第1页 / 共39 页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 半导体 分析师：邹臣 登记编码： S0730523100001 zouchen @ccnew.com 021 -50581991 AI驱动全球晶圆厂加速扩产，国产半导 体设备厂商迎来高速成长期 ——半导体行业深度 报告 证券研究报告 -行业深度 报告 强于大市 (维持) 半导体相对沪深 300指数表现 资料来源：中原证券 研究所，聚源 相关报告 《半导体行业月报： Muse引发个人智能体 应用热潮， Agentic AI 时代 CPU重要性持续 提升 》 2026 -10-12 《半导体行业月报：半导体行业 26Q2保持 快速增长，国内存储厂商业绩表现亮眼 》 2026 -09-15 《半导体行业月报：海外云厂商继续上调 26 年资本支出计划，服务器 CPU需求旺盛 》 2026 -08-11 联系人： 李智 电话： 0371 -65585629 地址： 郑州郑东新区商务外环路 10号18楼 地址： 上海浦东新区世纪大道 1788号T1座22楼 发布日期： 2026年10月20日 投资要点：  AI驱动全球晶圆厂加速扩产，国产半导体设备厂商有望 充分受 益。AI基础设施投资持续加速，推动全球半导体市场强劲增长 ， 存储器和逻辑芯片是驱动全球半导体市场增长的主要动力 。AI驱 动全球半导体设备支出持续快速增长 ，SEMI预计 2026年全球半 导体设备销售额将 达1659亿美元，同比增长 23.2%，预计 2028 年将达到 2295亿美元，存储相关设备支出有望持续加速扩张 。全 球晶圆厂加速扩产，三星 与SK海力士规划 2030年DRAM产能 接近翻倍 。根据 Counterpoint Research 的数据，长鑫科技 DRAM全球市占率从 25Q1的3%逐步提升至 26Q1的8%，长江 存储 NAND全球市占率从 25Q1的8%逐步提升至 26Q1的 13%，长鑫科技与长江存储市场份额稳步提升 ；Omdia预计 2026 年中国存储市场占全球比重约为 51%，目前中国存储市场仍然高 度依赖进口，长鑫科技与长江存储国产替代空间巨大，未来扩产 6年销售额将实现 42%增幅，预计 2027年继续增长 28%；预计微处理器 2026年销售 额同比增长 25%，2027年继续增长 21%；预计模拟芯片 2026年销售额同比增长 11%， 2027年继续增长 7%；预计分立器件 2026年销售额同比增长 12%，2027年继续增长 9%。 图2：2023-2027年全球半导体各细分领域 市场规模及预测情况 资料来源： WSTS，中原证券 研究所 下载日志已记录，仅供内部参考 第7页 / 共39 页 半导体 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 AI驱动全球半导体设备支出持续快速增长 。由于 AI基础设施投资 持续加速，以及支持更 高计算密度、高带宽存储相关投资和日益复杂的器件架构所需的前沿逻辑、先进存储和后端技 术投资的增加 ，推动全球半导体设备支出持续快速增长。根据 SEMI的预测，预计 2026年全 球半导体设备销售额将创下 1659亿美元的历史新高，同比增长 23.2%，增长势头预计将持续 至2028年，预计 2028年将达到 2295亿美元， AI驱动的需求正在重塑半导体制造投资格 局。由于晶圆厂 正在加速产能扩张和技术迁移以满足 AI相关工作负载需求 ，SEMI预计 2026 年晶圆厂设备（ WFE）领域销售额将增长 23.1%至1439亿美元，预计 2027年再增长 21.8%，2028年增长 14.1%，突破 2000亿美元。受益于器件复杂度提升、先进异构 封装采 用率提高，以及 AI和HBM器件对性能和可靠性更严格的要求 ，AI相关半导体需求也在推动 后端设备领域市场扩张 ，SEMI预计 2026年全球半导体测试设备销售额将增长 31%至153亿 美元，预计 2026年封装设备销售额将增长 9.6%至67亿美元，增长预计将持续至 2028年， 预计 2028年测试设备 及封装设备 销售额将分别达到 208亿美元和86亿美元。 图3：2024-2028年全球半导体设备销售额及预测按细分市场划分 情况 资料来源： SEMI，中原证券研究所 存储相关设备支出有望持续加速扩张 。AI推理、上下文窗口扩展 及智能体推动存储产品 需求呈现 爆发式增长态势，存储市场正经历一轮 超级周期，存储相关设备支出预计将在 2028 年前显著扩张 ，SEMI预计 2026年全球 DRAM设备销售额 同比增长 39.0%至388亿美元， 预计 2027年增长 27.4%，2028年增长 15.0%，达到 569亿美元；受益于 3D NAND 层数迁 移和更高密度架构投资 ，SEMI预计 2026年全球 NAND设备销售额 同比增长 30.7%至139亿 美元， 2027年再增长 31.1%，2028年增长 14.5%，达到 208亿美元。受益于 AI加速器、高 性能计算和高端移动处理器的前沿节点产能建设 ，SEMI预计 2026年用于逻辑应用的晶圆厂 设备销售额同比增长 18.9%至780亿美元，预计 2027年增长 18.1%，2028年增长 13.6%， 达到 1047亿美元。 下载日志已记录，仅供内部参考 第8页 / 共39 页 半导体 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 图4：2024-2028年全球晶圆厂设备销售额及预测按应用划分情况 资料来源： SEMI，中原证券研究所 1.2. 全球晶圆厂加速扩产，国产半导体设备厂商有望充分受益 全球存储龙头加速扩产，三星、 SK海力士规划 2030年DRAM产能接近翻倍 。三星当前 整体 DRAM产能约 65万片/月，扩产项目包括 平泽 P4工厂剩余产能及 平泽 P5两座工厂， 平 泽P5一座工厂 满产设计目标约 30万片/月，双厂产能合计约 60万片/月，扩产项目投产后三 星DRAM总产能约 135万片/月。SK海力士当前 DRAM产能约 55万片/月，规划新增产能绝 大部分落地韩国龙仁半导体集群，龙仁厂区是 SK海力士的 AI高端 DRAM/HBM 核心扩产基 地，龙仁一号 工厂内部划分 6间独立洁净车间，每间完成设备调试后，新增 6万片/月产能， 龙仁一号 工厂新增 36万片/月DRAM产能，SK海力士同步推进清州市 M15X产线扩建 ，清 州M15X新增 8万片/月产能，SK海力士计划将 DRAM产能提升至 2030年100万片/月的规 模。美光科技 当前 DRAM产能约 35万片/月，亚洲新增产能集中在中国台湾铜锣厂区，铜锣 厂区一期和二期工厂投产后 合计新增 DRAM产能约8万片/月，美国本土新建产能集中在爱达 荷、纽约两大集群 ，两座爱达荷工厂 满产合计新增 DRAM产能 10–12万片/月，纽约首座晶 圆厂规划 DRAM 创业板一度拉升，最后还收绿，盘中还有个宁德传业绩一般，拖累指数，盘后还验证了。整体上抛压已经小了，需要更多边际利空才能引发更多抛压，静待美股财报后的方向选择。今晚中东利好催化了美股油价黄金，算是短期缓和了一个点，但这一点又很容易打破（码完这一句，没多久就打破了），靠中东和平短期不容易，还得靠财报端AI收入的利好，或者没有利空也是一种利好。来自星球小牛研报纪要 2. 板块方面，计算机、机械设备和电子领涨，主要是物理ai（机器人）延续大涨，并传递到端侧芯片。AI整体发展向好不变，就算一些投资收不回，仍然不会改变大部分投资还是会在这个方向，只是我们的关注点可能短期从硬件转向应用，硬件也不是完全不关注，还是会关注增长更快的细分，国产链和新技术。 3. 题材方面，开盘还是pcb带队反弹，各种超跌科技也都小幅拉升，但最后走出延续性强度的是物理ai（外加机器人和端侧），短催化够多，远叙事性感，这里机游共振无疑了。国产gpu小票稍有回暖，就展现出了弹性。投机侧，围绕龙头九阳发散了羊字辈、大消费，他还有机器人概念，但也面临异动，不能连续涨停。物理ai连续大涨后，其他题材的分支龙也有些拉升，想等待轮动的意思，不过晚上美股如果反弹太好，可能先去反弹超跌了。#文字观点", "publish_time": "2026-10-21 07:26", "tags": ["文字观点"]}, "post:2026-10-21T08-37:d29c0d6c41f2": {"id": "post:2026-10-21T08-37:d29c0d6c41f2", "kind": "post", "title": "2026-10-21 08:37", "source_label": "帖子正文", "excerpt": "政策利率官宣“换锚”——金融街论坛点评 10月19日下午，2026金融街论坛年会开幕，中国人民银行行长潘功胜发表讲话。市场对此关注较高，总结了货币政策的五大要点： ★要点一：政策利率换锚，隔夜取代7天 投资者对本次论坛“降准降息”的期待非常低，近期市场对总量宽松并不抱期待。", "content": "政策利率官宣“换锚”——金融街论坛点评 10月19日下午，2026金融街论坛年会开幕，中国人民银行行长潘功胜发表讲话。市场对此关注较高，总结了货币政策的五大要点： ★要点一：政策利率换锚，隔夜取代7天 投资者对本次论坛“降准降息”的期待非常低，近期市场对总量宽松并不抱期待。而其他政策中，选择“结构性政策”的投资者最多，其次是“无明显增量信息”，最后是“政策利率换锚”，从这一角度看，本次论坛宣布“换锚”，略超出市场预期。 潘行长表示，\"为了进一步提高利率调控的精准性，人民银行将研究择机把央行公开市场主要操作品种的期限切换为隔夜，公开市场隔夜回购利率将相应成为主要政策利率\"。这是2024年6月陆家嘴论坛确立7天期逆回购利率的主要政策利率地位之后，政策利率框架的又一次换锚，意义重大。 为何选择此时换锚？ 一是DR001本身已经成熟，潘行长表示DR001\"作为货币市场交易活跃、最具基准性的利率，能够灵敏反映短期资金供求状况，近年来运行也更趋稳定\"。实际中，隔夜成交占比常年在90%以上，本身就是市场最有代表性的资金利率。 二是工具与目标匹配的需要。\"从现在的情况看，银行间隔夜回购利率实际上已成为央行货币政策调控的目标利率\"，今年一季度货政报告已将沿用多年的表述改为\"引导隔夜利率在政策利率水平附近运行\"，调控实践早已围绕隔夜（DR001）展开。但当前公开市场操作主要品种和政策利率的期限仍是7天，\"两者并不完全一致\"，切换后能进一步提高利率调控的精准性。 三是，近日监管对机构拉久期有一定关注，管控长端的同时降低短端利率，也是保持“收益率曲线”斜向上的要求，二者并不矛盾。 对债市而言，我们此前提示，换锚的实际影响在于政策利率中枢实质性下移。当前隔夜逆回购操作利率为1.25%，较7天逆回购低15BP。三季度DR001基本围绕在1.4%附近运行，实际锚定7天逆回购，若后续转为锚定隔夜逆回购，相当于中枢降至1.25%。资金利率中枢的下移直接打开收益率曲线的空间。存款、存单等利率也将向政策锚靠拢，负债成本重定价会推动配置资金沿曲线向中长端传导，套息空间也随之提高。 不过也要看到，债市对此已做了部分定价。十一之后资金面明显转松，DR001已降至1.26%附近、创6月以来新低。超长债利差也出现压缩，债市对资金利率中枢下移的交易已经比较充分。本次讲话的表述是\"研究择机\"，时点并未明确。今日超长债利率先上后下，7-10年表现更强，市场定价较为“理性”。后续存单和超长债仍有结构性机会。时点上关注：①切换落地的具体时点，②央行何时官宣隔夜逆回购操作利率，③切换前后央行对DR001合意区间是否有进一步引导。 ★要点二：贷款定价基准亦转向隔夜 潘行长表示，\"未来随着多元化贷款定价基准不断完善，一些财务能力强的企业，可与金融机构协商后自主选择银行间隔夜回购利率或贷款市场报价利率作为浮动利率贷款定价基准，贷款市场报价利率作为小企业、个人贷款的定价基准可继续发挥作用。债券、金融衍生品的定价基准也可考虑将银行间隔夜回购利率作为一个选择\"。 2024年7月，7天逆回购利率取代 MLF 成为主要政策利率，LPR 报价随之转向更多参考短期政策利率。去年以来部分地区已经试点贷款利率挂钩DR001，算是贷款定价的一次新探索。本次宣布属于政策利率换锚向资产端定价的延伸，走的仍是渐进路线。大企业可选、小微和个人仍锚锚定LPR 的分层设计，主要是避免对存量定价体系的一次性冲击。潘行长同时表示将择机发布政策指引、持续改革 LPR 报价机制，说明落地节奏同样留有余地，实际切换还要看后续指引。另一点启示在于，随着企业贷款越来越多挂钩DR001，DR001的波动区间将会更窄，资金面稳定性将增强。 ★要点三：SLF 扩围至外资银行 潘功胜行长表示，“扩大常备借贷便利（SLF）的适用机构范围，进一步纳入境内外资法人银行。同时明确全国性银行适用同样的操作安排，实现对境内存款类金融机构的全覆盖。境内外资法人银行纳入后，也获得了央行流动性支持渠道，有助于更好展业\"。SLF 于2013年初创设，最初面向政策性银行和全国性商业银行提供大额短期流动性支持，后续范围逐渐扩大。对外资行而言，获得央行流动性支持渠道意味着在华展业的流动性保障与中资机构拉平，有利于金融市场对外开放。对利率走廊而言，上限约束覆盖全部存款类机构，框架完整性进一步增强。 ★要点四：设立非银机构大额赎回的流动性支持工具 去年金融街论坛已提出探索特定情景下向非银机构提供流动性的机制安排，今年6月陆家嘴论坛进一步提出“研究设立特定情景非银流动性支持宏观审慎工具”，当时的提法是“通过互换方式应对正常融资渠道受阻、非银机构面临群体性流动性危机的情形”，并已明确宏观审慎和高等级抵押品要求。此次增量主要在于，由“研究探索”进一步走向“设立”，明确三部门协同，将适用机构具体到理财子公司、公募基金管理人及对应母行、证券母公司等，更有针对性。 对债市而言，该工具的价值在于缓解非银资金分层问题，降低尾部风险，缓解极端情景下的“赎回-抛售”循环，对债市整体偏正面。对股市同样有间接支持，今年“固收+”基金和理财规模增长较快，股债同向性有所增强，尤其当下市场环境中，该工具有助于缓解“固收+”赎回风险。 ★要点五：存贷款基准利率退出，存款利率进一步市场化 贷款端已有LPR等市场化定价基准，存款端也在2022年建立市场化调整机制，引导银行参考国债收益率、LPR等变化调整存款利率。但实际中存款基准利率仍对一些银行发挥自律性引导。今年一季度起，央行进一步公布各期限存款平均利率，为银行存款定价提供参考。此次提出退出存贷款基准利率，是进一步推动旧基准向市场化指标过渡，利率市场化再进一步。#文字观点", "publish_time": "2026-10-21 08:37", "tags": ["文字观点"]}, "attachment:files/A股与港股复盘 20261021.pdf": {"id": "attachment:files/A股与港股复盘 20261021.pdf", "kind": "attachment", "title": "A股与港股复盘 20261021", "source_label": "其他", "excerpt": "A股与港股复盘 2026年10月21日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 SpaceX一飞冲天，宁德时代领创业板连续12天年内新低 2026年10月21日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 宁德时代两地齐跌逾11%，把创业板指和沪深300拖到14个月低", "content": "A股与港股复盘 2026年10月21日 研究笔记 · 不构成投资建议 第 1 / 13 页 股票市场复盘 SpaceX一飞冲天，宁德时代领创业板连续12天年内新低 2026年10月21日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 宁德时代两地齐跌逾11%，把创业板指和沪深300拖到14个月低点，连日的ETF净流入也没托住成长股 宁德时代A股收跌12.0%、H股收跌11.4%。该股为创业板指第一大权重，创业板指跌1.6%，连续第4个交易日创年内最低收盘；沪深300同样收在14个月低点。昨天稿中验证条件今天兑现一半：隔夜逆回购首次操作利率与预期一致，但国债期货回吐昨天全部涨幅，股市也没有补涨。恒指开盘即全天最高，此后一路走低，收跌0.9%；腾讯控股跌4.0%，创一年新低。 然而，纵观全球市场，A股是为数不多的、在昨晚美股利好的背景下和韩国、美国AI板块反弹的情况下走出了独立行情的市场。另一个是法国。在最近的播客和采访中，我们指出由于今年的增长目标基本可以实现，因此不应该预期大规模的刺激政策，而是更直接的市场托底措施。今天临近收盘时创业板ETF的大额申购就是“看得见的手”的影子。这次申购缩小了创业板今天的日内跌幅。 当然，如此下行的压力，市场有利好也不涨却反其道而行之，需要引起交易员的注意。同时，在基本面没有太多问题的情况下市场继续拋售，那么肯定是有基本面和资金面以外的因子在影响情绪。比如，明天是海外信托自查的最后期限。这个日子与今天造富股的拋售似乎不谋而合。昨晚SpaceX业绩惊人，远超预期，马斯克称明年收入目标5,000 -10,000亿美元，并宣布开始着手SpaceX和Tesla的价值3.5万亿美元的合并工作。如果能够修成正果，那么这将是历史上最大的公司合并案例。于此同时，Anthropic宣布将进行7,500亿美元的资本开支计划，而SuperMicro的业绩也远超预期。这些都打消了市场对于算了开支需求的疑虑，美光盘前拉升 。 我们在最新的播客和电视采访中还讨论了现在依然是左侧交易，而左侧交易非常动荡，将考验交易员的心脏和肠胃功能。同时，我们还指出，“在下行的后半程，下行的压力往往会加速”。现在从盘面上看，的确十分动荡。交易员需要屏气凝神，控制仓位和风险，不宜过急过分。 A股与港股复盘 2026年10月21日 研究笔记 · 不构成投资建议 第 2 / 13 页 本日报要 主线段： 宁德时代两地齐跌逾11%，把创业板指和沪深300拖到14个月低点，连日的ETF净流入也没托住成长股。起点是周二晚间披露的三季报：第三季度归母净利润212.46亿元，同比增14.5%，比市场预期低约12%（高盛）。周二摩根大通已把宁德时代H股评级降到中性、目标价从725港元降到500港元；今天高盛把目标价从859港元降到777港元，花旗也下调4%，中信里昂则维持“优于大市”和670港元的目标价，公司自己在业绩说明会上说，2027年行业需求“没有市场预期的那么悲观”。A股开盘就低开5.0%，收盘跌12.0%报227.90元，成交324.4亿元，是周二的2.1倍；H股收跌11.4%。宁德时代是创业板指第一大权重、沪深300第三大权重，创业板指因此跌1.6%（见第1节）。昨天稿子里的验证条件是隔夜逆回购首次操作的利率：今天操作800亿元，利率1.25%，与预期一致，但国债期货全线回吐昨天的涨幅，沪深300和恒指也没有补涨（见第4节）。 A股： 上证收3,713点，跌0.6%；沪深300跌1.0%；创业板指跌1.6%；科创50涨0.1%；中证1000涨0.2%；北证50跌0.7%。沪深两市成交1.43万亿元，较周二缩量约268亿元。上涨1,981家、下跌3,363家、平盘225家（沪深A股，不含北交所）。涨停家数50家、跌停家数5家（沪深，东方财富涨停池）。 港股： 恒生指数收23,652点，跌0.9%；国企指数跌1.1%；恒生科技指数跌1.3%。恒指成交1,766.0亿港元，较周二1,904.5亿港元减约7.3%。 货币与汇率： 人民银行今天7天期逆回购操作量为零，同时开展800亿元隔夜逆回购操作；当日560亿元逆回购到期，单日净投放240亿元。隔夜逆回购利率1.25%（华泰证券研报引述），比7天期1.40%低15个基点。人民币中间价6.7192，较前一日6.7200调升8个基点。在岸即期约6.676，离岸CNH约6.675，两者几乎无差；中间价弱于在岸即期约434个基点。美元指数约101.8，较上一收盘几乎持平。 互联互通： 北向成交2,220.8亿元，较周二2,094.9亿元增约6.0%，净额未公布。南向成交706.9亿港元，较周二765.1亿港元减约7.6%；全天净卖出44.3亿港元（买入331.3亿港元，卖出375.6亿港元）。周二净卖出17.2亿港元，方向未变，连续第6个交易日净卖出；最近5日累计净卖出149.4亿港元。 A股与港股复盘 2026年10月21日 研究笔记 · 不构成投资建议 第 3 / 13 页 大波动： 内地方面，利亚德（300296.SZ）、莱美药业（300006.SZ）涨20.0%，致尚科技（301486.SZ）涨17.1%；宁德时代（300750.SZ）跌12.0%，蔚蓝锂芯（002245.SZ）跌9.2%，先导智能（300450.SZ）跌9.0%。港股方面，澜起科技（06809.HK）涨9.0%；宁德时代（03750.HK  "excerpt": "高盛 —— 天岳先进（688234.SS）：26 年第三季度净利润大幅超越一致预期，毛利率环比改善至 27.5%；电动车 800V 高压平台与人工智能电源需求驱动成长", "content": "高盛 —— 天岳先进（688234.SS）：26 年第三季度净利润大幅超越一致预期，毛利率环比改善至 27.5%；电动车 800V 高压平台与人工智能电源需求驱动成长；维持中性评级，目标价下调至人民币 110 元 天岳先进 2026 年第三季度营收 6.46 亿元，同比增长 103%，环比增长 18%，较彭博一致预期低 8%，毛利率从 2026 年第二季度的 25.4% 提升至27.5%。 公司运营费用率从 2026 年第二季度的 19.3% 下降至 13.4%，推动净利润达到 0.85 亿元，较市场一致预期高出 142%。 营收增长来源于新能源汽车 800V 高压平台渗透率提升，带动车规级导电碳化硅衬底出货量上涨，同时人工智能服务器电源、光伏储能、大功率快充带来新增需求。 我们看好天岳先进长期成长空间，成长逻辑来自新能源汽车、数据中心碳化硅渗透率持续提升，产品结构向利润率更高的 8 英寸碳化硅衬底升级。基于估值合理，我们维持中性评级。26 年第三季度业绩拆解：净利润超预期主要来自运营费用管控效果好公司营收环比增长 18%，同比增长 103%，达到 6.46 亿元，对比市场一致预期低 8%，对比高盛此前预测低 34%。 毛利润环比增长 28%，同比增长 171%，达到 1.77 亿元；毛利率环比提升 2.1 个百分点至27.5%，但是分别低于市场一致预期 1.2 个百分点、低于高盛此前预测 1.3 个百分点。 运营费用率环比下降 5.9 个百分点至 13.4%，带动营业利润率从 2026 年第二季度 6.1% 扩张至 14.1%。 营业利润达到 0.91 亿元，高出市场一致预期 175%，但比高盛此前预测低 42%。 净利润从 2026 年第二季度 0.03 亿元提升至 0.85 亿元，高出市场一致预期 142%，但较高盛此前预测低 52%。 我们认为，净利润相对市场预期实现超额，主要来自超预期的运营费用管控以及经营杠杆释放，而不是营收或者毛利率表现超出预期。盈利预测调整说明结合天岳先进 2026 年第三季度业绩，我们下调 2026‑2028 年净利润预测，下调幅度分别为 32%、13%、14%。 我们将 2026‑2028 年营收预测同步下调 16%、16%、16%，主要原因是前三季度业绩显示我们此前对于碳化硅衬底出货量假设偏乐观。 我们把 2026 年毛利率预测下调 0.6 个百分点，以此反映第三季度实际业绩；同时上调 2027、2028 年毛利率预测，分别上调 0.3、0.4 个百分点，逻辑是产品结构持续向高毛利 8 英寸碳化硅衬底升级。 公司管理层目标，2026 年 8 英寸产品出货占比超过 40%，2025 年该占比仅约 14%，管理层将 8 英寸金属‑氧化物半导体衬底视作公司核心利润来源。 参考第三季度表现，我们小幅下调 2026 年运营费用率预测 0.1 个百分点，2027‑2028 运营费用率预测维持不变。 上述一系列调整，最终带来 2026‑2028 年净利润预测分别下调 32%、13%、14%。#文字观点", "publish_time": "2026-10-21 13:48", "tags": ["文字观点"]}, "post:2026-10-21T18-58:cb104d3f6da2": {"id": "post:2026-10-21T18-58:cb104d3f6da2", "kind": "post", "title": "2026-10-21 18:58", "source_label": "帖子正文", "excerpt": "20261021今日段子汇总 1、致尚科技：1、控股子公司福可喜玛主营MPO/MT插芯、连接器，主要应用于4G/5G通讯及光模块产品中，应用场景包括数据中心、FTTH及FTTA等；2、公司拟收购恒扬数据，标的为AI智算中心、云计算数据中心及边缘计算核心基础设施供应商 2、敏芯股份：公司为国内领先的M", "content": "20261021今日段子汇总 1、致尚科技：1、控股子公司福可喜玛主营MPO/MT插芯、连接器，主要应用于4G/5G通讯及光模块产品中，应用场景包括数据中心、FTTH及FTTA等；2、公司拟收购恒扬数据，标的为AI智算中心、云计算数据中心及边缘计算核心基础设施供应商 2、敏芯股份：公司为国内领先的MEMS传感器设计企业，布局机器人用力传感器、力矩传感器及惯性测量单元，相关产品正按计划研发 3、润建股份：领先的数字化智能运维（AIO /simple cell sales) & policy/tax items (consumption tax from Sep 1; export V AT rebate cut with fuller impact showing in Q3), with pass-through still under negotiation. 2/ Demand/growth momentum intact: management framed growth momentum as intact to achieve ~20–30% YoY as previously, driven by strong momentum in the EU & global ESS, while acknowledging a softer/slowing demand outlook for domestic China ESS. •JPM Valuation: Rebecca Wen rates CATL-H as Neutral w/ PT of HK$500 /CATL-A as OW w/ PT of RMB340, Read Rebecca Wen’s latest on CH Battery & CATL •Initial Feedback - Underwhelming : The miss was somewhat expected as investor expectations had already moved lower, but results still fell below the lowered buy-side bar, with a sharper-than-expected q/q decline in unit profit. The working capital increase also stood out, with some investors viewing this as the company holding more inventory risk and sharing cost pressure with OEMs—risk that could worsen as the auto OEM export V AT rebate cut takes effect next year. Investors expect unit profit to keep declining in 4Q as the consumption tax impact runs for a full quarter (vs. one month in 3Q), with further downside risk next year as OEM V AT rebate cuts take effect and China battery V AT rebate falls from 6% this year to 0% next year. Overall, investors see limited near-term rebound potential and expect the A (long) / H (short) pair trade to remain in place. •JPM Access: Rebecca Wen is hosting CATL 3Q26 post-results review call tomorrow (Oct 21, Wed) 1/ Mandarin Session( 4pm HKT) , 2/ English Sessoin(8pm HKT/1pm UK/8am NY) •3750 HK SI Est: ~28% of float, -3,5% MoM, 15.7X DTC CATL Key Financials & Shipment/ Unit Profit Trend J.P Morgan Industrials & Auto Contacts {[{0lniI86SGjuoyL2bB7jIXfjj1QF7e_cHSU40OQfvQavZ-DxavDMDTSVzWp_pqmO3jz6e6-qBWlkWbfn2M6Pkya082pB4wQ}]}专业销售亚太区专业销售 2026年10月20日摩根大通 宁德时代2026年第三季度会后要点：业绩不及预期且单位利润下滑 Joann Kim +852 2800 8016 joann.kim@jpmorgan.com *仅为销售评述 宁德时代（300750\u0003CH/3750\u0003HK）2026年第三季度：业绩不及预期且单位利润下滑 •32026年季度财报：宁德时代公布2026年第三季度净利润为212亿元（甚至低于下调后的买方预期220-230亿元人民币）。总出货量为 260吉瓦时（+75%\u0003同比，环比提升12%，买方预期为250-260吉瓦时）。单位利润降至0.08人民币/瓦时（2026年第二季度为0.10人民币/瓦 时）。尽管销量走高，毛利率仍跌至20.7%（2026年第二季度为23.2%）。 •电话会核心要点： 1/\u0003本次问答环节大多围绕盈利能力展开；提问聚焦于环比利润率/利润下滑及相关应对策略；管理层将该压力主要归 因于产品结构（包括更多低附加值/普通电芯销售）与政策/税务事项（自9月1日起开征的消费税，出口增值税退税下调的全面影响在第三 季度显现），目前成本传导事宜仍在协商中。2/\u0003需求与增长动能保持完好：管理层表示增长动能充足，仍可实现此前设定的同比增速~20– 30%的目标，增长由欧盟及全球储能系统的强劲态势驱动，同时也承认中国国内储能系统的需求前景偏软、增速放缓。 •摩根大通估值：\u0003Rebecca\u0003Wen\u0003给予宁德时代H股中性评级，目标价为500港元/给予宁德时代A股增持评级，目标价为340人民币， 阅读Rebecca\u0003Wen关于中国电池行业及宁德时代的最新观点 •初步反馈：表现不及预期：由于投资者预期早已下修，本次业绩不及预期在一定程度上符合市场预判，但业绩仍低于已经下调的买方预 期，单位利润的环比降幅超出市场预期。营运资金的攀升也十分突出，部分投资者认为这意味着公司面临更高的库存风险，同时与原始设备 制造商分摊成本压力——随着明年汽车原始设备制造商出口增值税退税下调政策正式生效，该风险可能进一步恶化。投资者预计单位利润将 在第四季度持续下滑，因消费税的影响将覆盖完整季度（第三季度仅受影响1个月），后续明年还存在进一步下行风险：原始设备制造商增 值税退税下调落地，同时中国电池增值税退税将从今年的6%降至明年的0%。总体来看，投资者认为宁德时代的短期反弹空间有限，预计A 股（多头）/H股（空头）的配对交易策略将持续。 •摩根大通访问服务：Rebecca\u0003Wen\u0003将于明日（10月21日，周三）主持宁德时代2026年第三季度业绩后复盘电话会\u00031/\u0003普通话场次 （香港时间下午4点），\u00032/ 英文场次（香港时间晚8点/英国时间下午1点/纽约时间早8点） •3750 香港空头持仓预估：~28占流通股比例，月环比-3.5%，平仓天数15.7倍 宁德时代核心财务数据及出货量/单位利润趋势 摩根大通工业与汽车行业联系人 {[{0lniI86SGjuoyL2bB7jIXfjj1QF7e_cHSU40OQfvQavZ-DxavDMDTSVzWp_pqmO3jz6e6-qBWlkWbfn2M6Pkya082pB4wQ}]} 本文档仅供三有私募基金(南京)有限公司13054213038研究使用，请勿外传 2Specialist Sales APAC Specialist Sales 20 October 2026J P M O R G A N Sector Specialists: APAC Industrials: Joann Kim joann.kim@jpmorgan.com +852 2800 0816 EU Industrials : Sam Edmunds sam.edmunds@jpmorgan.com +44 207 742 8733 APAC Industrials Trading: Jonathan Malts jonathan.maltz@jpmorgan.com +852 2800 8820 APAC Electric Equipment & Multi-Industry Research: Junya Ayada (Japan) junya.ayada@anmol.com +81 3 6736 8631 Stephen Tsui (Korea & China) stephen.tsui@jpmorgan.com +852 2800 8592 APAC Aerospace & Defense Research: Atul Tiwari (India) atul.tiwari@jpmorgan.com +91 22 6157 3582 Simon Han (Korea) simon.x.han@jpmorgan.com +82 2 758 5711 Karen Li (Singapore) karen.yy.li@jpmorgan.com +852 2800 8589 APAC Machinery & 机械 王华君18610723118/蒋逸18158576706/秦乐恒15221680140】#文字观点", "publish_time": "2026-10-21 22:10", "tags": ["文字观点"]}, "post:2026-10-21T23-05:a51ef6572e0d": {"id": "post:2026-10-21T23-05:a51ef6572e0d", "kind": "post", "title": "2026-10-21 23:05", "source_label": "帖子正文", "excerpt": "今日核心增量： 1、物理AI数采：海天瑞声/龙旗科技/奥比中光/天奇股份 — OpenAI确认自研人形机器人，每月采购Ego数据量相当于国内头部具身公司一年的采购量；海天瑞声年内具身数据订单达上亿元，奥比中光千元级EGO数采设备已批量出货 2、SpaceX算力超预期：赛意信息/新雷能/瑞可达 — S", "content": "今日核心增量： 1、物理AI数采：海天瑞声/龙旗科技/奥比中光/天奇股份 — OpenAI确认自研人形机器人，每月采购Ego数据量相当于国内头部具身公司一年的采购量；海天瑞声年内具身数据订单达上亿元，奥比中光千元级EGO数采设备已批量出货 2、SpaceX算力超预期：赛意信息/新雷能/瑞可达 — SpaceX Q3营收145.8亿美元、同比+161%，SI业务收入75.6亿美元、首超Starlink；指引27Q1营收330-370亿美元，2027年计划新增最高20GW供电及冷却能力 3、宁德时代Q3盈利承压：宁德时代/尚太科技/璞泰来 — Q3归母212.5亿元、环比-5.8%，毛利率20.7%、环比-2.5pct；消费税9月起征收2%、出口退税由9%降至6%，公司指引2027年需求增长20%-30% 4、端侧与互连芯片业绩：澜起科技/移远通信/天岳先进 —澜起科技Q3扣非净利同比+152.6%~179.2%；移远通信Q3利润升至6亿元以上；天岳先进Q3营收同比+102.89% 5、生猪去产能深化：牧原股份/温氏股份 —三季度末能繁母猪存栏3602万头、环比-4.7%，生猪存栏同比-2.6%、为2025年以来首度转负 6、电力设备出海：思源电气/望变电气 —9月液体变压器出口53.66亿元创新高，北美同比+308.64%；9月逆变器出口697万台、同比+104.21%重要提醒： ★ 宇树世界物理AI大会/特斯拉Q3业绩会：10月22日举办，Optimus V3量产节奏为焦点；10月29日智元AI Day ★ 中船特气（688146）：10月21日3.84亿股原始股解禁，占解禁后流通股72.62% ★ Meta Q3财报：美东10月21日盘后发布，AI资本开支指引为核心变量 ★ 业绩与股价背离：天岳先进Q3营收同比翻倍但收跌9.78%，福耀玻璃Q3归母同比-9.87%、收跌7.19%，关注三季报兑现后的定价分化 （仅供内部参考，不构成任何投资建议，请勿外传）#文字观点", "publish_time": "2026-10-21 23:05", "tags": ["文字观点"]}, "post:2026-10-21T07-25:71ac615fe8de": {"id": "post:2026-10-21T07-25:71ac615fe8de", "kind": "post", "title": "2026-10-21 07:25", "source_label": "帖子正文", "excerpt": "10月21日：数据要素、智能制造、机器人与物理AI、量子计算等概念股梳理 一、昨夜发酵消息精选。1、数据要素：10月20日，国家数据集团有限公司在河北雄安新区成立。", "content": "10月21日：数据要素、智能制造、机器人与物理AI、量子计算等概念股梳理 一、昨夜发酵消息精选。 1、数据要素：10月20日，国家数据集团有限公司在河北雄安新区成立。晚上，国家数据集团成立登上百度热搜第一。记者从集团获悉，该集团是一家以数据资源开发利用为主责主业的中央企业，总部位于河北雄安新区。据了解，集团成立旨在推进数据资源开发利用、释放数据要素价值、服务人工智能发展、繁荣数据产业生态。据微信公众号“国资小新”发布的央企名录显示，新组建成立的国家数据集团有限公司位列第28位，排在中国卫星网络集团有限公司、中国电子信息产业集团有限公司之间。 概念股：南威软件、太极股份、零点有数、铜牛信息、易华录、深桑达A、浙数文化、云赛智联、海量数据、久远银海、电科数字、数字政通、博思软件、德生科技、每日互动、合合信息、万达信息等 2、智能制造：10月20日举行新闻发布会上介绍，工信部正在研究起草新一代智能制造的有关政策措施，加快推动人工智能与制造业深度融合。发展新一代智能制造，关键在于推动人工智能技术与制造业全链条深度融合，提升装备和系统的自感知、自决策和自执行能力，促进生产方式和企业组织形态变革，探索形成新的制造模式，帮助企业降低成本、提升效率，更好满足多样化市场需求。工业和信息化部将充分发挥我国人工智能创新活跃和制造业场景丰富的独特优势，重点做好梯度培育智能工厂、创新发展智能装备等四方面工作。 概念股：鼎捷数智、能科科技、云鼎科技、赛意信息、宝信软件、中控技术、埃斯顿、汇川技术、绿的谐波、华中数控、用友网络、东土科技、海康威视、奥普特、凌云光、拓普集团、双环传动、海天精工、纽威数控、赛摩智能、华中数控、沈鼓集团、汉得信息等 3、机器人与物理AI：当地时间10月20日至22日，英伟达GTC大会将在德国柏林举行，黄仁勋将在21日发表主题演讲。作为英伟达下半年最受关注的技术与生态大会，本届GTC把重心从“卖GPU”进一步推向“卖AI工厂”，据官方介绍，大会设有100多场专题分享，覆盖完整人工智能技术栈，将聚焦加速计算、智能体AI（Agentic AI）、物理AI（Physical AI）、机器人、开源模型、AI基础设施等方向。2026物理AI与世界模型大会在南京开幕，全国首个“物理AI与世界模型投资基金”达成战略合作 “物理AI与世界模型”产业联盟揭牌成立。三星加快追赶脚步，押注“24小时工作不停歇机器人”。优必选科技落子阿联酋拉斯海玛，共推人形机器人前沿研发与产业生态共建。 概念股：福莱新材、索辰科技、浙江荣泰、大业股份、嘉晨智能、凡拓数创、赛摩智能、长盈精密、模塑科技、宁波东力、长龄液压、日海智能、润建股份、美格智能、华密新材、乐鑫科技、德马科技等。来自小牛研报纪要星球 4、量子计算：10月20日讯，当地时间10月19日，英伟达宣布，在德国于利希（Jülich）超级计算中心完成了一项创纪录的容错量子计算模拟，研究人员利用超级计算机JUPITER，成功模拟104量子比特的容错量子计算系统，并验证了一种名为“魔态培育”的技术。JUPITER是欧洲首台百亿亿次级超级计算机，也是欧洲目前规模最大的超算系统。此次模拟运行于英伟达加速量子研究中心（NVAQC）的GB200 NVL72超级芯片系统，由8192块GPU组成。英伟达称，这是迄今为止对容错量子计算系统进行的最大规模、最全面的模拟，此前没有任何模拟能够如此详细地对量子处理器进行建模。 概念股：国盾量子、科大国创、格尔软件、国仪公司、神州信息、西部超导、东方中科、普源精电、天奥电子、纬德信息、彩讯股份、浙江东方、中国联通、吉大正元等 5、短剧：国家广电总局，微短剧用户规模达8.5亿，月活用户超过6亿。中国微短剧正成为继美国电影、日本动画、韩国电视剧之后的第四大全球性视听产品新业态。重磅！抖音集团官方开启征集互动剧、互动影游合作！ 概念股：欢瑞世纪、德才股份、中文在线、掌阅科技、华策影视、慈文传媒、荣信文化、中广天择、芒果超媒、捷成股份、昆仑万维、博纳影业等。 6、AI算力：DeepSeek推理框架全开源，公布日均吞吐和毛利，真正的OpenAI来了工信部：下一步将加快算力设施扩容提质为先进制造业发展夯实网络和算力底座。 概念股：润泽科技、奥飞数据、数据港、光环新网、宝信软件、英维克、高澜股份、申菱环境、锐捷网络、中兴通讯、首都在线、优刻得、青云科技、燧原科技、摩尔线程等。 7、端侧AI：Counterpoint预计，全球市场生成式AI手机渗透率将在2027年达到52%，端侧AI由高端卖点转为出厂标配。端侧AI正从技术验证迈向商业化关键节点，26-27年密集催化，持续看好国内SoC厂商卡位与竞争优势。 概念股：慕思股份、日海智能、美格智能、博通集成、豪鹏科技、瑞芯微、恒玄科技、晶晨股份、泰凌微、炬芯科技、中科蓝讯、全志科技、星宸科技、富瀚微、安凯微等。 8、医药：10月23日至27日 欧洲肿瘤内科学会(ESMO)年会 多家中国药企将参会并发布最新成果。（恒瑞医药、科伦药业、百利天恒） 9、消费：国家发展改革委：正在研究制定扩大内需战略实施方案，将加快推动印发实施。（百洋股份、九阳股份、安记食品） 10、传媒广告：七部门发布《广告产业发展“十五五”规划。（蓝色光标、分众传媒、省广集团） 11、军工：深化央企战略合作，东风、兵器集团拟7.27亿元双向股权互换。（东风股份、凌云股份） 12、无人驾驶：2026世界智能网联汽车大会21日开幕。（浙江世宝、索菱股份） 13、种业振兴：农业农村部部署“十五五”时期深入实施种业振兴行动。（隆平高科、登海种业） 14、碳化硅：碳化硅龙头前三季度净利润暴增2330%，车规级导电衬底需求放量。（天岳先进、三安光电） 15、美股三大指数收盘涨跌不一，截止收盘，道指涨1.02%，纳指跌0.02%，标普500指数涨0.29%。大型科技股多数下跌，苹果、谷歌、Meta跌超1%，SK海力士跌超2%，特斯拉涨超1%。生物制药、减肥药涨幅居前，礼来、安进涨超3%，阿斯利康涨近3%，诺和诺德、辉瑞涨超2%。半导体设备与材料、油气板块走低。 二、个股新增概念精选。 1、人形机器人（奥莱德、博杰股份） 2、智能座舱（鸿富诚） 3、一带一路（天安新材） 4、ip经济（报喜鸟） 5、军工信息化（星帅尔） 6、消费电子概念（王子新材） 7、先进封装（鸿富诚） 8、存储芯片（博杰股份）", "publish_time": "2026-10-21 07:25", "tags": []}, "post:2026-10-21T21-03:dcdde98d0446": {"id": "post:2026-10-21T21-03:dcdde98d0446", "kind": "post", "title": "2026-10-21 21:03", "source_label": "帖子正文", "excerpt": "Google Cloud 与 NVIDIA 宣布 NVIDIA Vera Rubin 基础设施正式全面可用 由 NVIDIA Vera Rubin NVL72 系统加速的 Google Cloud A5X 实例，为欧洲创新者提供下一代智能体与强化学习基础设施。这些实例将于下个月正式全面可用，并计划将", "content": "Google Cloud 与 NVIDIA 宣布 NVIDIA Vera Rubin 基础设施正式全面可用 由 NVIDIA Vera Rubin NVL72 系统加速的 Google Cloud A5X 实例，为欧洲创新者提供下一代智能体与强化学习基础设施。 这些实例将于下个月正式全面可用，并计划将可用范围扩展至欧洲，为云客户带来一个集训练、推理和大规模强化学习于一体的集成平台。 A5X 实例将NVIDIA Vera Rubin NVL72、NVIDIA ConnectX-9 SuperNICs、Google Cloud Virgo 网络以及 Google Cloud 第四代先进液冷技术整合在一起，以大规模应对高要求的智能体推理和强化学习工作负载。Google Cloud 计划将其基于 Vera Rubin 的基础设施扩展至多个站点、最多960000 块 Rubin GPU。 Ineffable Intelligence 是一家总部位于伦敦的科技公司，由 AlphaGo 创造者 David Silver 创立，是首家使用 A5X 的客户。Ineffable 正利用该平台推进大规模强化学习，并打造能够从经验中持续学习的 “超级学习者” 系统。 通过交互进行学习需要持续循环地生成经验、评估结果并更新模型，这要求基础设施能够大规模支撑整个流程。A5X 将 Vera Rubin 作为集成系统引入 Google Cloud 的 AI Hypercomputer，融合计算、网络和存储，以大规模支持经验驱动的学习。 Ineffable Intelligence 创始人兼首席执行官 David Silver 表示，我们正在构建能够通过自身经验不断改进的超级学习者，这既需要强大的算力，也需要在生成经验与基于经验进行训练之间建立紧密连接，从而使智能体的每一次改进都能迅速塑造其下一次经验。Vera Rubin 将计算性能与高带宽连接相结合，既包括 Vera CPU 与 Rubin GPU 之间，也包括机架内 Rubin GPU 之间，使我们能够进一步拓展强化学习研究的规模和雄心。 总部位于伦敦的营销与传播公司 WPP，也已在基于 NVIDIA Vera Rubin 的 A5X 实例上展示了其创意智能体参考架构，使用了 NVIDIA Nemotron 模型和 NVIDIA OpenShell，后者是 NVIDIA OpenShell 参考架构的一部分，用于构建安全的 AI 智能体。 智能体将对话式请求转化为多步骤创意工作流，例如视频生成、画质提升和风格重塑，并在执行前获得人工审批。OpenShell 为智能体执行提供受管控的沙箱环境，帮助控制对敏感品牌资产和创意工具的访问。在 WPP 的初步测试中，通常需要多节点集群才能运行的工作负载，在单台 A5X 实例上即可完成。 随着各组织部署智能体系统，他们需要保护驱动这些系统的专有模型和敏感数据，即使运行在并非自身拥有的基础设施上也是如此。 Google Cloud 将成为首批在裸金属实例上以机架规模提供 NVIDIA 机密计算的云服务提供商之一，例如由 NVIDIA GB300 NVL72 驱动的 A4X Max 实例。此外，Google Cloud 正在由 NVIDIA RTX PRO 6000 Blackwell 服务器版 GPU 驱动的 G4 虚拟机上全面提供机密计算，为机密推理和微调提供灵活的平台。包括 Vertebrae、Polaris Cloud 和 Confidential Core AI 在内的客户正在使用机密 G4 实现对话隐私、可验证的智能体执行以及受策略治理的公司智能。 为支持大规模高能效部署，Google Cloud 与 NVIDIA 正在探索面向 Vera Rubin 基础设施的 NVIDIA DSX Max LPS 能力，以帮助优化每瓦性能，并在现有数据中心电力预算内扩展容量。 可以深入了解 NVIDIA Vera Rubin 与 Google Cloud A5X 实例。#文字观点", "publish_time": "2026-10-21 21:03", "tags": ["文字观点"]}, "attachment:files/2026.10.12-10.18_机构调研全景分析.xlsx": {"id": "attachment:files/2026.10.12-10.18_机构调研全景分析.xlsx", "kind": "attachment", "title": "2026.10.12-10.18_机构调研全景分析", "source_label": "2026.10.12", "excerpt": "报告所载信息均来源于公开渠道，虽力求准确完整，但不保证其绝对真实性、及时性与完整性；调研数据仅反映机构在特定时点的关注行为，不代表其实际持仓或后续买卖动向。", "content": "机构调研全景分析报告 A股上市公司机构调研数据全景梳理 · 深度分析 调研区间：2026年10月12日 — 2026年10月18日 | 数据来源：Wind | 生成日期：2026年10月21日 核心数据速览 参与调研机构总数 892 家 被调研上市公司（有机构实际参与） 112 家 机构调研家次合计 1,766 家次 参与私募机构 407 家（548次，占比31%） 参与百亿私募 42 家 调研热度与区间涨跌相关系数 -0.04（基本无关） 微信：WUXL3408 目录 01 核心结论总览 02 个股调研热度TOP30 03 关注度焦点榜 04 行业热度分布 05 热度-涨跌背离分析 06 机构活跃度TOP30 07 机构类型与板块分布 08 私募调研全景 09 百亿私募专项 10 策略提示 11 全量数据明细 免责声明 本报告基于Wind提供的2026年10月12日至10月18日机构调研公开数据整理分析，仅供研究参考，不构成任何投资建议、要约或招揽。报告所载信息均来源于公开渠道，虽力求准确完整，但不保证其绝对真实性、及时性与完整性；调研数据仅反映机构在特定时点的关注行为，不代表其实际持仓或后续买卖动向。区间涨跌幅受市场系统性因素影响，调研热度与股价表现之间不存在必然因果关系。投资者据此操作，风险自担。历史业绩不代表未来表现，市场有风险，投资须谨慎。本报告版权归整理方所有，未经许可不得转载或商用。 核心结论总览 五大核心结论 · 机构调研全景（2026.10.12-10.18） 编号 结论 要点阐述 结论1 ① 电子链独占鳌头 电子设备仪器（301家次/10家）、电子元件（255家次/10家）、工业机械（128家次/14家）、半导体设备（122家次）合计占比超45%，AI硬件/算力链仍是机构调研绝对主线。 结论2 ② 调研热度≠短期收益 调研家次与区间涨跌幅相关系数仅-0.04，且各热度分组平均涨跌幅全为负（市场系统性调整），本周调研数据应作资金行为观察而非短线信号。 结论3 ③ 双极分化明星股 源杰科技（284家次、-14.71%）与海康威视（200家次、+2.09%）并列关注度最高：源杰属\"高热度深跌\"逆向关注型；海康属\"高热度抗跌\"配置确认型（174家机构No.1关注，高毅冯柳亲自出席）。 结论4 ④ 百亿私募与全市场焦点重合 海康威视（35分）、源杰科技（28分）、华测检测（11分）居百亿私募关注度前三，与全市场焦点榜一致，头部资金共识度高。 结论5 ⑤ 成长板是调研主战场 创业板619+科创板370=989个股次，占55%；上证主板仅88。机构调研偏好与科技成长定价权高度绑定。 注：本页结论基于全样本统计，详细数据见后续各分页。 个股调研热度 TOP30 按调研机构家次排序 · 前30名（2026.10.12-10.18） 排名 证券代码 证券简称 调研机构家次 证券公司 基金公司 保险及保险资管 投资机构 外资机构 私募公司 其它 区间涨跌幅% 所属Wind行业 1 688498.SH 源杰科技 284 37 77 22 14 4 英伟达新款显卡。 🔹【宁德时代 —— 业绩不及预期，回购进度慢于预期】 高盛研究观点：2026 年第三季度利润率不及预期，主要受暂时性的产品结构和税务不利因素影响。我们认为大部分利润率压力是暂时性的，随着收入确认，储能系统集成带来的收益将日益明朗；不过，税务成本转嫁进度放缓，促使我们将 2026 至 2028 年每股收益预测下调 4%-7%。管理层重申未来五年全球电池销量年复合增长率为 20%-30% 的展望，并强调海外储能系统和电动汽车领域的机遇，尽管短期内国内市场承压。 🔹【中国房地产：高盛研究部 2027 年展望 —— 迈向 2035 年新均衡的四个关键转折点】 四个转折点（三个在供给侧，一个在需求侧）： 预计 2028 年可售新房项目将大幅减少，且未来几年很可能持续显著下滑。 土地出让收入预计自 2031 年起加速下滑。 新开工面积和房地产开发投资预计于 2032 年回升。 结构性需求预计自 2030 年起加速下滑。 🔹【有色金属】 中国镍企计划讨论削减印尼产量。#文字观点", "publish_time": "2026-10-21 09:23", "tags": ["文字观点"]}, "post:2026-10-21T09-38:72508d61b7a9": {"id": "post:2026-10-21T09-38:72508d61b7a9", "kind": "post", "title": "2026-10-21 09:38", "source_label": "帖子正文", "excerpt": "🍁🍁🍁鸿富瀚持续重点推荐：公司按明年业绩预期已经跌破10倍pe，后续弹性十足 🍁机器人板块：当下已经拿到海外大厂人形机器人大单数千万级别，年内交付，公司预期明年数十亿，后年或百亿。这一块利润明年或5亿，后年20多亿。", "content": "🍁🍁🍁鸿富瀚持续重点推荐：公司按明年业绩预期已经跌破10倍pe，后续弹性十足 🍁机器人板块：当下已经拿到海外大厂人形机器人大单数千万级别，年内交付，公司预期明年数十亿，后年或百亿。这一块利润明年或5亿，后年20多亿。 🍁液冷板块：公司已经开始在释放利润，故事阶段已经过去，现在是实际落地业绩阶段。公司为液冷行业最先大规模释放利润的公司之一，且国内海外均处于快速放量阶段，为当之无愧的柜内龙头。 🍁当下，我们看市场估值来看，有直接供应逻辑的，pe没有比鸿富瀚估值更低的了，持续重点推荐。我们看好公司后续有望成为与英维克、申菱比肩的公司。过去两年，公司液冷业务一步一台阶，逐步兑现，基本无miss。 🍁市场行情不好，将公司股价带下来，但是我们认为当下恰恰是一个比较好的时间点。公司明年后年业绩高速增长，当下处于切换明年估值阶段，行情向好，公司估值走20倍pe，明年市值可看接近千亿，持续重点推荐。#文字观点", "publish_time": "2026-10-21 09:38", "tags": ["文字观点"]}, "post:2026-10-21T21-07:2ab86a819a56": {"id": "post:2026-10-21T21-07:2ab86a819a56", "kind": "post", "title": "2026-10-21 21:07", "source_label": "帖子正文", "excerpt": "【SpaceX 26 Q3点评：AI算力商业化拐点确立，星链与星舰共筑增长极】 【财务：业绩飙升，AI驱动资本开支】 🌌Q3营收145.8亿美元（YoY+161%），净利润44.0亿美元（同比扭亏）；调整后EBITDA达88.1亿美元（YoY+306%）。", "content": "【SpaceX 26 Q3点评：AI算力商业化拐点确立，星链与星舰共筑增长极】 【财务：业绩飙升，AI驱动资本开支】 🌌Q3营收145.8亿美元（YoY+161%），净利润44.0亿美元（同比扭亏）；调整后EBITDA达88.1亿美元（YoY+306%）。#27Q1营收指引330亿–370亿美元。 🌌在手订单630亿美元，维持2026年底年化收入运行率超千亿美元目标。 🌌Q3资本开支195.9亿美元（SI业务占84%），预计Q4升至350亿–400亿美元； 【太空：星舰有望迎商业化突破，复用技术决定运力上限】 🚀Q3太空业务收入17.7亿美元（YoY+6%），调整后EBITDA3.57亿美元；单季发射35次（含12次客户任务），国家安全及NASA订单持续扩容。 🚀星舰第14次试飞首入轨并交付26颗V3卫星（单次下行容量约猎鹰9号10倍）。第15次拟尝试全面捕获回收，若成功，有望大幅降本并加速星座部署。 【Starlink：B/C端双发力，直连手机打开第二曲线】 🛰Q3连接收入52.5亿美元（YoY+69%），调整后EBITDA达35.0亿美元。 🛰消费用户1360万（同比近翻倍），ARPU环比提升5%至69美元/月。其中，企政业务成新引擎，收入21.3亿美元（YoY+91%），航空签约约1.2万架。 🛰直连手机月活破2200万，计划2027部署V2卫星、2028年初开通服务。 【AI：SI业务猛增，算力步入兑现期】 🤖Q3 SI收入75.6亿美元（YoY+830%，QoQ+195%），受云合同、Cursor并表及GrokBot驱动，商业化提速。 🤖季末算力1.7GW，预计26年底达2.5-3GW、27年底冲刺13GW。管理层预计，新增算力投资回收期不足一年，供电及冷却为扩张核心瓶颈。 🤖公司将火箭发动机高端铸造能力延伸至燃气轮机叶片及导向叶片制造，有望将相关供电能力上线时间提前12–18个月。 【Starlink构筑经常性收入与利润底盘，SI成为业绩增长核心引擎，Starship决定长期运力与成本曲线】 📈我们认为，短期应重点跟踪Q4巨额资本开支向云收入及现金流的转化效率，以及2027年算力扩张与Starship复用进展。需关注资本开支持续攀升、算力交付节奏及管理层远期目标的兑现风险。 电话会纪要及PPT翻译请联系：国金电子樊志远团队 陈矣骄13342954878#文字观点", "publish_time": "2026-10-21 21:07", "tags": ["文字观点"]}, "post:2026-10-21T09-18:379dcbcfe473": {"id": "post:2026-10-21T09-18:379dcbcfe473", "kind": "post", "title": "2026-10-21 09:18", "source_label": "帖子正文", "excerpt": "SpaceX三季度财报五大要点 1、马斯克回应SpaceX与特斯拉持续发酵的合并传闻，称两家公司已设立特别委员会探讨合并方案。他表示合并并非确定事项，但认为这是个不错的选择。", "content": "SpaceX三季度财报五大要点 1、马斯克回应SpaceX与特斯拉持续发酵的合并传闻，称两家公司已设立特别委员会探讨合并方案。他表示合并并非确定事项，但认为这是个不错的选择。 2、在上季度预测SpaceX将于今年年底实现1000亿美元年度经常性收入后，管理层进一步上调预期，目前预计2027年底年度经常性收入可达5000亿至1万亿美元。 3、首席财务官Bret Johnsen预测，公司明年第一季度营收将落在330亿至370亿美元区间，显著高于分析师预期。 4、SpaceX三季度营收145.8亿美元，同比增长161%，分析师预期128亿美元，其中太空业务营收17.7亿美元，市场预期14.3亿美元，AI收入75.6亿美元，市场预估63亿美元。公司三季度净利润44亿美元，分析师预期18.8亿美元，这也是SpaceX首个盈利季度。SpaceX AI板块营收也首次超过星链连接业务，证明这项新业务盈利能力强劲、客户需求旺盛。人工智能相关投入是SpaceX资本开支的主要方向，不过本季度相关支出低于分析师此前预期。 5、星舰下一次发射意义重大，SpaceX计划在发射后实现箭体完整回收，这是团队尚未达成的目标。SpaceX总裁Gwynne Shotwell同时提到，团队计划在2027年初开展关键的星舰在轨加注验证试验。 SpaceX盘后大涨近7%，报157.817美元。#文字观点", "publish_time": "2026-10-21 09:18", "tags": ["文字观点"]}, "post:2026-10-21T09-18:1db8cb8080ef": {"id": "post:2026-10-21T09-18:1db8cb8080ef", "kind": "post", "title": "2026-10-21 09:18", "source_label": "帖子正文", "excerpt": "【国泰海通海外科技】SpaceX（SPCX.O）业绩会更新：继续全面超预期，盈利能力改善、业务线进展清晰度提升 #26Q3三大业务线继续全面超预期、盈利能力显著改善。1）营收侧：26Q3公司营收145.8亿美元（yoy+161.4%，vs预期yoy+130.9%），Space/Connectivit", "content": "【国泰海通海外科技】SpaceX（SPCX.O）业绩会更新：继续全面超预期，盈利能力改善、业务线进展清晰度提升 #26Q3三大业务线继续全面超预期、盈利能力显著改善。 1）营收侧：26Q3公司营收145.8亿美元（yoy+161.4%，vs预期yoy+130.9%），Spac 0398ec5e": {"id": "post:2026-10-21T11-40:1f4c0398ec5e", "kind": "post", "title": "2026-10-21 11:40", "source_label": "帖子正文", "excerpt": "AI收入首次超过Starlink，SPCX打开AI数据中心新格局❗️SpaceX 26Q3业绩速递【国联民生海外｜美股】 整体业绩：SpaceX Q3营收145.75亿美元，同比+161%；调整后EBITDA为88.09亿美元，同比+306%", "content": "AI收入首次超过Starlink，SPCX打开AI数据中心新格局❗️SpaceX 26Q3业绩速递【国联民生海外｜美股】 整体业绩：SpaceX Q3营收145.75亿美元，同比+161%；调整后EBITDA为88.09亿美元，同比+306%；净利润44亿美元，同比扭亏。收入与利润均明显超预期，核心来自SI算力收入集中兑现。 业务亮点： 1）SI收入75.60亿美元，同比+830%，首次超过Starlink；调整后EBITDA达到49.53亿美元，云服务合同进入集中交付期； 2）Starlink收入52.48亿美元，同比+69%；经营利润23.67亿美元，同比+99%，用户达到1360万； 3）航天业务收入17.67亿美元，同比+6%。Starship Flight 14首次将26颗运营级V3卫星送入轨道，成为首个产生收入的Starship任务。#地面算力进入加速交付阶段。1）算力规模：Q3末达到1.7GW，预计10月底接近2GW、2026年底达到2.5—3GW。管理层对2027年新增10GW具备较高信心，对应#2027年底总算力至少达到13GW。2）交付效率：公司当前每月可上线约20万颗GB300，明年逐步转向Vera Rubin；计划2027Q2建成包含44万颗Vera Rubin的训练集群。新增算力定价已略高于此前30—50美元/W区间上限，投资回收期仍低于一年。 #Starlink继续承担利润底盘，Starship开始打开带宽上限。 1）传统连接：Q3用户净增160万，ARPU环比+5%至69美元；企业及政府收入同比+91%。Starlink已签约约1.2万架飞机，约占全球可服务机队的四分之一。 2）卫星升级：Flight 14一次部署的V3带宽相当于约10次Falcon 9发射。管理层预计2027年中部署数百颗V3后，用户端将开始明显感受到网速改善。 3）手机直连：Starlink Mobile月活用户达到2200万，环比+37%；公司新增收购800MHz低频段最多14MHz成对频谱。移动V2卫星计划2027年开始部署，整合频谱后的升级服务预计2028年初开通。 #SpaceX与Tesla的协同开始进入资本层面讨论。潜在协同集中在SI软件、芯片设计、Terafab、机器人、Starmind及通信网络。Terafab目标2027年5—6月产出首颗测试芯片，2028Q3—Q4进入规模量产。 ️往后看，管理层预计2026年底实现1000亿美元ARR，2027Q1收入达到330—370亿美元；Q4毛利率将回到Q2附近。 风险提示：基于公开资料整理，可能存在信息滞后、不全面或翻译不准确的风险；任何情况下均不构成投资建议。 ☎️欢迎联系国联民生海外孔蓉/樊程安吉/赵志远#文字观点", "publish_time": "2026-10-21 11:40", "tags": ["地面算力进入加速交付阶段", "2027年底总算力至少达到13GW", "文字观点"]}, "attachment:files/JPM-SpaceX2026 年第三季度要点复盘：AI 基础设施动能增强，有望缓解供给约束担忧 SpaceX 3Q26 Read-Through Reinforces AI Infrastructure Momentum and Should Temper Constraint Concerns.pdf": {"id": "attachment:files/JPM-SpaceX2026 年第三季度要点复盘：AI 基础设施动能增强，有望缓解供给约束担忧 SpaceX 3Q26 Read-Through Reinforces AI Infrastructure Momentum and Should Temper Constraint Concerns.pdf", "kind": "attachment", "title": "JPM-SpaceX2026 年第三季度要点复盘：AI 基础设施动能增强，有望缓解供给约束担忧 SpaceX 3Q26 Read-Through Reinforces AI I 0%）。 粘胶短纤与棉花、涤纶短纤部分性能相近但又存在差异，根据吉林化纤公司公告，粘胶短纤相较于涤纶等 合成纤维，其在舒适性、透气性等性能上有明显的优势，是最接近棉花的人造纤维；相较于棉花 ，其在可纺性、 标准化程度及染色性上较棉花又有着比较优势。因此粘胶短纤与棉花、涤纶短纤在某种程度上可以互相替代， 当棉花紧缺、价格高企，下游便会增加短纤的用量；相反，如果短纤价格处于高位，下游对棉花的用量会相应 增加。 图1:粘胶短纤在透气性与舒适性等方面与棉花较为接近 对比维度 粘胶短纤 棉花 涤纶短纤 性质 人造天然纤维 天然纤维 化学合成纤维 吸湿性 非常好（12%-14%）含湿率 最符合人体皮肤的生理要 求，光滑凉爽 较好（4%-8.5%） 差（0.4%-0.5%） 透气性 非常好 非常好 较差 悬垂性 好（比重大 1.5-1.52） 较差（易变形起皱） 好（耐皱性好、弹性好、尺 寸稳定性较好） 染色难度 非常好， 可使用直接、 还原、 碱性、色酚、媒染、硫化、 反应性及颜料等染料染色 较好，可使用直接、还原、 碱性、硫化、活性、偶氮、 媒染等 一般，可使用分散、色酚、 还原、可溶性等染料染色 舒适性 与棉花非常接近，亲肤性 好，抗静电 非常好 一般 强度 较强 一般 非常强，是棉花的两倍 数据来源：华经产业研究院，中 信建投证券 根据百川盈孚，2020-2025年粘胶短纤与涤纶短纤表观消费量稳步提升，而棉花表观消费量在经历 22-23年 下滑后逐步回升。但从需求结构角度而言，若仅考虑这三种纤维对应的市场需求， 2020年粘胶短纤/涤纶短纤/ 棉花的表观消费量占比分别为 19%/36%/45%，2025年变化为23%/39%/38%，粘胶短纤/涤纶短纤消费占比分别 +4%/+3%，棉花占比下滑7%，因此在过去五年的时间维度，粘胶短纤与涤纶短纤在一定程度上正在对于部分的 棉花需求领域形成替代。 下载日志已记录，仅供内部参考 2 行业深度报告 化学纤维 请务必阅读正文之后的免责条款和声明。 图2:粘胶短纤、涤纶短纤表观消费量 （万吨）稳步增长 图3:粘胶短纤、涤纶短纤需求占比 （%）稳步提升 数据来源：百川盈孚，中信建投证券 数据来源：百川盈孚，中信建投证券 棉花-粘胶短纤价差达到近三年高位，粘胶性价比显著提升。 2026年年初以来，由于棉花价格中枢的上行， 棉花与粘胶短纤价差呈现逐步扩大趋势，根据百川盈孚，今年 1-9月国内棉花与粘胶短纤价差均值为 3511元/ 吨，而2024/2025年价差均值仅为2488/1747元/吨。与此同时，以2015年至今为时间区间，截至今年 9月30 日，国内棉花-粘胶价差处于64%的相对较高历史分位数，尽管年初以来粘胶短纤价格有所上涨，但涨价幅度整 体不及棉花，在此情形下粘胶短纤性价比随着价差扩大逐步提升。 图4:棉花-粘胶短纤价差呈现扩大趋势 数据来源：同花顺iFind，百川盈孚，中信建投证券 “高开工+低库存”印证景气复苏。根据百川盈孚， 25年8月以来国内粘胶短纤行业开工率均维持在 85% 以上的较高水平；库存方面，今年整体延续了去年的去库趋势，截至 26年10月9日，国内粘胶短纤库存约为 6.75万吨，接近2020年以来历史最低库存水平（ 6.33万吨），在开工率上行空间有限的情况下去库节奏或将延 续，供给趋紧有望驱动粘胶短纤价格维持上涨趋势。 下载日志已记录，仅供内部参考 3 行业深度报告 化学纤维 请务必阅读正文之后的免责条款和声明。 图5:当前国内粘胶短纤开工率处于历史高位 图6:25年以来国内粘胶短纤持续去 库 数据来源：百川盈孚，中信建投证券 数据来源：百川盈孚，中信建投证券 1.2、全球棉花供给预期偏紧，有望支撑粘胶短纤价格中枢上行 棉花大部分主产区存在减产预期，全球棉花库存或将下降。根据 USDA于26年10月发布的《Cotton: World Markets and Trade》最新预测，2026/2027全球棉花主要产区中，中国、美国和澳大利亚的产量预计均有所下滑， 预计2026/2027全球棉花总产量2568万吨， 相较于2025/2026减少约89.3万吨， 同比降幅约为3.4%。 与此同时， USDA预计2026/2027全球棉花需求约为2680万吨，相较于2025/2026增长约50万吨，同比温和增长 1.9%， 全球棉花供给预期偏紧，预计 2026/2027全球棉花期末库存将达到 2022/2023以来的最低水平。 图7:USDA 10月最新预测2026/2027全球棉花将经历减产去库（千吨） （1000MT） 2022/23 2023/24 2024/25 2025/26 Sep 2026/27 Oct 2026/27 Production China 6,695 成为有系统性监测以来最强厄尔尼诺事件。 超强厄尔尼诺可能引发区域或全球一系列极端事件，部分区域暴雨洪涝， 另一些地方干旱少雨，台风路径、 高温热浪都会随之改变。 在厄尔尼诺的发展年， 我国长江以南地区易发生洪涝； 西北太平洋台风生成数量偏多、 生成位置偏东偏南，强度偏强；冬季我国出现“暖冬”的概率较大，但冷暖起伏仍较明显。在厄尔尼诺的衰减 年，长江流域洪涝风险更高，而台风生成数量偏少，夏季我国大部地区气温偏高，高温热浪可能更强。气象部 门专家预计，2027年夏季，我国气候受厄尔尼诺的影响将比 2026年更显著，长江中下游地区降水偏多明显， 暴雨洪涝风险较高，可能有较重汛情，江淮、江南、华南等地的高温热浪也会更加明显。 2027年春夏季，我国 东北、华北等粮食主产区需关注降水偏多、易发洪涝等对粮食生产造成的影响，西北地区大部、新疆等存在高 温少雨带来的气象干旱风险 ，因此明年气候因素对于我国棉花产量的影响有待进一步观察。 下载日志已记录，仅供内部参考 8 行业深度报告 化学纤维 请务必阅读正文之后的免责条款和声明。 图15:中国棉花供需平衡表 数据来源：农业农村部市场与信息化司，中信建投证券 注：不同数据来源对于棉花产量等数据统计口径或预测结果存在区别仅供参考。 供给预期偏紧推动棉花价格上行，或将支撑粘胶短纤价格中枢提升。整体而言，今年棉花部分主要产区因 气候影响以及作物种植经济性等原因存在一定的减产预期，同时根据前文所述， USDA预计2026/2027全球棉 花需求仍有小幅增长，全球棉花供给偏紧预期较强， 2026年年初以来包括中国、印度以及巴基斯坦等主要棉花 消费市场的棉花价格整体呈现上涨趋势，同时棉花价格上涨导致棉花 -粘胶价差处于历史相对高位，因此粘胶短 纤或将具备较强的涨价动能，价格中枢有望上行。 下载日志已记录，仅供内部参考 9 行业深度报告 化学纤维 请务必阅读正文之后的免责条款和声明。 图16:2026年全球主要棉花消费市场棉花价格中枢有所上行 数据来源：USDA，中信建投证券 下载日志已记录，仅供内部参考 10 行业深度报告 化学纤维 请务必阅读正文之后的免责条款和声明。 二、中长期供需格局向好，龙头企业定价权或将显著提升 2.1、高集中度格局形成，行业新增产能有限 政策引导落后产能逐步退出， 行业产能利用率稳步提升。 根据百川盈孚数据， 国内粘胶短纤行业在 2017-2018 年经历了新一轮产能集中投放期，两年内行业产能增长 90万吨；但从2019年开始国内粘胶短纤产能增长逐步 放缓并最终稳定在目前 510万吨左右的规模。一方面，由于粘胶短纤生产能耗相对较高，政策端严控新增产能 与淘汰落后产能；另一方面，行业整体盈利水平陷入低谷，从经济性角度考量，多数粘胶短纤生产企业新增产 能意愿有限。 政策以产能规模和能耗为主要抓手，严控新增产能的同时淘汰部分落后 产能，2017年工信部发布《粘胶纤 维行业规范条件（2017版）》，明确提出“改扩建粘胶纤维项目总生产能力要达到：粘胶短纤维年产 80000吨 及以上，产品差别化率高于 30%。能耗方面，要求“粘胶短纤维吨产品综合能耗≤ 1000公斤标煤”。此外，《产 业结构调整目录（2019年本）》明确将“4 万吨/年及以下粘胶常规短纤维生产线”列入淘汰类目录。 盈利能力方面，在2017-2018年行业产能快速扩张的过程中粘胶短纤单吨利润持续下滑，此后多数时间行 业整体均处于大幅亏损或在盈亏平衡线上下震荡状态，因此企业扩产意愿或相对较 弱，但2025年以后行业盈利 能力开始出现逐步修复。 图17:近五年国内粘胶短纤产能稳中有降 数据来源：百川盈孚，中信建投证券 下载日志已记录，仅供内部参考", "status": "extracted"}, "post:2026-10-21T13-06:e1ef39af4c0a": {"id": "post:2026-10-21T13-06:e1ef39af4c0a", "kind": "post", "title": "2026-10-21 13:06", "source_label": "帖子正文", "excerpt": "⏰高盛香港午盘速评 📊恒生指数 -0.3%｜恒生中国企业指数 -0.5%｜恒生科技指数 -0.8%｜成交额 904 亿港币 📈领涨板块：半导体板块 +2.7%", "content": "⏰高盛香港午盘速评 📊恒生指数 -0.3%｜恒生中国企业指数 -0.5%｜恒生科技指数 -0.8%｜成交额 904 亿港币 📈领涨板块：半导体板块 +2.7%；保险板块 +0.6%；制药与生物科技板块 +0.5% 📉领跌板块：汽车及零部件板块 -2.1%；可选消费分销板块 -1.5%；必需消费分销板块 -1.3% 💹港股早盘高开后  "伯恩斯坦 —— 海光信息（688041.SS）：26 年第三季度毛利率环比修复至 58.7%，但上游供给约束拖累收入与现金流", "content": "伯恩斯坦 —— 海光信息（688041.SS）：26 年第三季度毛利率环比修复至 58.7%，但上游供给约束拖累收入与现金流；维持跑赢大市评级，目标价 450.00 元人民币 海光信息 26 年第三季度业绩：毛利率有所修复，但供给约束压制业绩增长与现金流表现。 海光信息于 2026 年 10 月 20 日发布 26 年第三季度业绩。26 年第三季度营收达到 58.6 亿元人民币，同比增长 45.5%，远低于我们全年 63% 的同比增长预期。毛利率从 26 年第二季度的 54.9% 修复至 58.7%。 我们认为，尽管上游供给存在约束，但智能代理人工智能时代下 CPU 的底层需求依旧保持强劲，维持跑赢大市评级。 营收不及预期，大概率来自供给约束以及收入确认延后。第三季度同比增速回落至 45.5%，对比 26 年第二季度 65.3% 的同比增速。 我们认为供给短缺，包括 DCU 所需 HBM 供应以及晶圆代工产能紧张，仍是主要制约因素。 DCU 的收入确认周期可能拉长，我们可以看到应收账款出现环比大幅攀升。 受益于国产替代以及智能代理人工智能带来算力需求上涨，服务器 CPU 需求依旧保持旺盛。 另外，海光信息推出 1000 系列 CPU 产品，将产品布局拓展至嵌入式以及边缘计算应用场景。 毛利率环比修复 384 个基点，我们判断这是海光信息在供给受限的背景下优化产品结构带来的结果。 毛利润环比上涨 23.7%，增速超过营收增速，不过毛利率仍然较 25 年第三季度低 130 个基点。 海光信息持续增加存货规模，同时提高对供应商的预付款，以此保障产能，对冲原材料成本上涨带来的影响。 存货规模达到 89.2 亿元人民币，环比增加 14.0 亿元人民币；预付款项环比增加 11.0 亿元人民币，达到 59.0 亿元人民币。 我们认为这类资金投入能够保障交付产能，但意味着公司需要在确认收入之前就提前付出大量现金。 毛利率的修复是积极信号。 投资逻辑分析 海光信息是国内领先的 x86 架构服务器 CPU 供应商，技术基于 AMD 授权，充分受益于服务器 CPU 国产替代浪潮。 海光信息的 AI 加速芯片有望成为另一大增长引擎，尽管技术水平相比华为、寒武纪等头部厂商仍存在差距，但我们认为 DCU 深度计算单元（第二代产品已于 2023 年第三季度发布）可以通过 CPU 捆绑销售拿到大量政府订单，带来额外的业绩增长弹性。 维持跑赢大市评级，目标价 450 元人民币。#文字观点", "publish_time": "2026-10-21 13:49", "tags": ["文字观点"]}, "post:2026-10-21T18-15:d820f3601525": {"id": "post:2026-10-21T18-15:d820f3601525", "kind": "post", "title": "2026-10-21 18:15", "source_label": "帖子正文", "excerpt": "关注：1）国产AI芯片：寒武纪、海光信息、云天励飞等。", "content": "【国联民生计算机】‼️DeepSeek开源推理框架DeepInfer：模算协同再迎重要进展10月20日，DeepSeek在知乎专栏发布《DeepSeek V4.1 Flash大规模推理部署实践》，正式开源大规模云服务推理框架DeepInfer。据报告，DeepInfer支持分布式推理、推测解码、结构化输出，可在英伟达与华为昇腾平台上运行，同日还开源了生产级Token编解码组件deepseek-recipe。报告将“兼容多种厂商的计算芯片、充分发挥各平台性能”列为三大设计目标之一 部署上用8卡机器做Prefill、64～128卡超节点做Decode：Prefill取尽可能小的EP/DP，为EP2～8；Decode取尽可能大的EP/DP，为EP64～128。对Token工厂等推理服务的意义：基于该框架，DeepSeek已实现V4.1 Flash高吞吐、低延迟推理服务，单一集群吞吐达155万亿Tokens/天，收入每卡每小时38美金，按谷价计。建议关注：1）国产AI芯片：寒武纪、海光信息、云天励飞等。2）超节点：浪潮信息、软通动力、紫光股份、中国长城、联想集团、神州数码、慧博云通、拓维信息等。3）算力租赁/Token工厂：宏景科技、集智股份（ARM Token工厂）、协创数据、利通电子、行云科技等。 风险提示：算力需求释放节奏具有不确定性；行业竞争加剧。 联系人：国联民生计算机吕伟/郭新宇#文字观点", "publish_time": "2026-10-21 18:15", "tags": ["文字观点"]}, "post:2026-10-21T22-11:81c9fa106af2": {"id": "post:2026-10-21T22-11:81c9fa106af2", "kind": "post", "title": "2026-10-21 22:11", "source_label": "帖子正文", "excerpt": "仕佳光子Q3业绩超预期，光器件+光芯片深度赋能公司成长2026年10月21日，公司发布2026年三季报，前三季度公司实现营业收入27.22亿元，同比增长74.46%，归母净利润5.", "content": "仕佳光子Q3业绩超预期，光器件+光芯片深度赋能公司成长2026年10月21日，公司发布2026年三季报，前三季度公司实现营业收入27.22亿元，同比增长74.46%，归母净利润5.86亿元，同比增长95.43%；单Q3实现营收12.27亿元，同比+116.06%，环比+33.51%，归母净利润2.71亿元，同比+226.19%，环比+36.43%，业绩超越市场预期。我们认为，利润增速显著跑赢收入增速的背后，或印证着规模效应的初步显现以及运营效率的提升。费用端来看，上半年销售、管理、研发费用率分别为1.56%、3.90%、4.60%，较去年同期分别下降0.43、0.93、1.66个百分点，费用管控提质增效的显著升级，公司利润端持续改善。公司未来成长路径清晰，核心聚焦光芯片与光器件两大方向：1）光芯片领域，依托完整的IDM全流程业务体系，在产品端，公司100mW CW产品已批量出货，400mW等规格产品实现小批量交付；在产能端，总投资12.65亿元的高速光芯片与器件开发及产业化项目正在有序推进，产能加速扩容，同时公司计划通过向特定对象发行A股股票募集28亿元资金，为原有在建项目的升级扩产提供支撑；2）光器件领域，MPO正向MMC/SNMT等小型化连接器方向演进，赛道“量升价涨”趋势逐步显现，公司MPO、MMC等高速连接器跳线系列产品已通过全球主流布线厂商认证并实现大批量持续出货，预计将成为又一重要业务增长点。北美头部云厂商资本开支延续快速扩张态势，2026 年第二季度合计规模超 1700 亿美元，全年资本开支指引进一步上修至约 7450 亿美元，算力基础设施投入力度持续加码。与此同时，云厂商核心业务的增长与盈利韧性同步验证：谷歌云单季实现营收 248 亿美元，同比增长 82%，利润率大幅提升至 35.6%；微软 Azure 全年收入首次突破 1000 亿美元，商业化落地成效凸显。我们认为，算力基建端明确的投入指引，叠加云业务端的强劲增长支撑，将深度推动光通信产业景气度持续上行，光芯片与光器件细分赛道的景气度将进一步提升。#文字观点", "publish_time": "2026-10-21 22:11", "tags": ["文字观点"]}, "post:2026-10-21T22-36:ae30730075af": {"id": "post:2026-10-21T22-36:ae30730075af", "kind": "post", "title": "2026-10-21 22:36", "source_label": "帖子正文", "excerpt": "看好公司几大业务线齐头并进，光芯片业务进展加速，#核心大客户积极锁定公司产能来缓解物料紧缺问题，公司27年产能超亿颗。", "content": "【国金电子】仕佳光子26Q3点评：经营性利润超预期，无源产能加速释放带动公司营收高增公司26年前三季度实现营收27.22亿元，同增74%。实现归母5.86亿元，同增95%。#单三季度，实现营收12.27亿元，同增116%，环增34%。实现归母2.71亿元，同增226%，环增36%。加回股权激励费用0.49亿，单季度经营性利润3.2亿，超市场预期，#Q4有望延续环比高增趋势。公司产品进展加速，#下游涵盖国内外头部客户。100mwCW批量出货，400mw CW小批量出货，100G EML客户送样验证中，CPO高通道FAU小批量出货等。看好公司几大业务线齐头并进，光芯片业务进展加速，#核心大客户积极锁定公司产能来缓解物料紧缺问题，公司27年产能超亿颗。#CPO用DFAU通过客户验证开始批量出货，客户给出很大指引，公司爬产顺利，明年有望增厚大量利润。#无源业务产能爬坡加速，MPO和AWG产能持续扩产，配合客户指引持续上量。 联系人：国金电子樊志远团队 应明哲#文字观点", "publish_time": "2026-10-21 22:36", "tags": ["下游涵盖国内外头部客户", "100mw 可用。\u003c/li>\n\u003c/ul>\n\u003ch3>2. 半导体/先进封装\u003c/h3>\n\u003cul>\n\u003cli>主线：先进封装、前端检测与存储份额提升。\u003c/li>\n\u003cli>今天强化的逻辑：SEMICON West展会总结显示会后态度偏矛盾，先进封装单客户仅配置1–2台设备；前端看好光学晶圆检测、材料计量；长鑫科技DRAM全球市占率从25Q1的3%提升至26Q1的8%，长江存储NAND从25Q1的8%提升至26Q1的13%。\u003c/li>\n\u003cli>今天出现的催化/验证：澜起科技3Q26初步业绩全面超预期，营收同比加速至46%，毛利率环比走阔，归母净利率中点60.1%；港股涨9.0%，半导体板块+2.7%。\u003c/li>\n\u003c/ul>\n\u003ch3>3. 商业航天/SpaceX\u003c/h3>\n\u003cul>\n\u003cli>主线：SpaceX业绩增长与星舰商业化。\u003c/li>\n\u003cli>今天强化的逻辑：Q3营收145.8亿美元（YoY+161%），净利润44.0亿美元（同比扭亏），调整后EBITDA 88.1亿美元（YoY+306%）；Space/Connectivity/AI业务营收17.7/52.5/75.6亿美元，AI收入首次超过Starlink；太空业务收入17.7亿美元（YoY+6%），调整后EBITDA 3.57亿美元。\u003c/li>\n\u003cli>今天出现的催化/验证：星舰下一次发射计划在发射后实现箭体完整回收；业绩会提及SpaceX与特斯拉已设特别委员会探讨合并方案，合并并非确定事项。\u003c/li>\n\u003c/ul>\n\u003ch3>4. 光通信/CPO\u003c/h3>\n\u003cul>\n\u003cli>主线：光模块/光芯片紧缺与CPO产能扩张。\u003c/li>\n\u003cli>今天强化的逻辑：东山精密索尔思已打入多家北美一线龙头客户，NPO/CPO已拿到北美客户订单，光芯片净利润率预期50%以上，光模块利润率30%以上，在手订单充沛；2026–2027年主流产品为800G，1.6T量逐步提升，2028–2029年绝大部分产品升级至1.6T。\u003c/li>\n\u003cli>今天出现的催化/验证：SPIL计划到27年年中将CPO光引擎产能提高15倍，并计划到28年底再翻一番；仕佳光子前三季度营收27.22亿元（同比+74.46%），28亿元定增已获受理。\u003c/li>\n\u003c/ul>\n\u003ch3>5. PCB/CCL/高端材料\u003c/h3>\n\u003cul>\n\u003cli>主线：高端CCL/PCB材料紧缺与材料升级。\u003c/li>\n\u003cli>今天强化的逻辑：台光电表示高阶CCL缺口至少看到2030年，M10年底到明年初推；M10类似PTFE，存在有布和无布两种路线；台光电在M8、M9两个世代均为第一家量产厂商，M9量产后若市场反应顺利，明年会迎来爆发放量；高端CCL紧缺持续至2029年之后，并扩散至高端PCB、ABF基板、工艺设备及耗材。\u003c/li>\n\u003cli>今天出现的催化/验证：台湾电路板协会2026年展会关注PCB基板上游材料升级，台光电、欣兴、太阳油墨、腾辉及金居、富乔等将持续受益；BCB树脂受M9新版本、M8改进、PTFE混压三大需求拉动；金刚石散热首次大批量量产订单在即，合格供应商交付量预计逐月递增。\u003c/li>\n\u003c/ul>\n\u003ch3>6. 机器人/物理AI\u003c/h3>\n\u003cul>\n\u003cli>主线：物理AI数据采集与人形机器人零部件验证。\u003c/li>\n\u003cli>今天强化的逻辑：OpenAI确认自研人形机器人，每月采购Ego数据量相当于国内头部具身公司一年采购量；海天瑞声年内具身数据订单达上亿元，奥比中光千元级EGO数采设备已批量出货；斯莱克金刚石铜冷板完成样品开发与性能验证，后续启动量产前置工作；谐波减速器柔轮通过疲劳测试、原型机通过性能验证。\u003c/li>\n\u003cli>今天出现的催化/验证：宇树世界物理AI大会/特斯拉Q3业绩会10月22日举办，Optimus V3量产节奏为焦点；鸿富瀚称已拿到海外大厂人形机器人大单数千万级别，年内交付，预期明年数十亿、后年或百亿。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>SpaceX 26Q3三大业务线全面超预期，AI收入首次超过Starlink；星舰下一次发射计划实现箭体完整回收；SpaceX与特斯拉已设特别委员会探讨合并方案，合并并非确定事项。\u003c/li>\n\u003cli>澜起科技3Q26初步业绩全面超预期，营收同比加速至46%，毛利率环比走阔，归母净利率中点60.1%；港股涨9.0%，半导体板块+2.7%。\u003c/li>\n\u003cli>仕佳光子Q3业绩超预期，前三季度营收27.22亿元（同比+74.46%），28亿元定增已获受理。\u003c/li>\n\u003cli>台光电表示高阶CCL缺口至少看到2030年，M10年底到明年初推；高端CCL紧缺持续至2029年之后，并扩散至高端PCB、ABF基板、设备及耗材。\u003c/li>\n\u003cli>国家数据集团10月20日在河北雄安新区成立；截至2026年8月，全国国有数据集团已超120家，近30个省级行政区基本实现省级数据运营主体全覆盖。\u003c/li>\n\u003cli>政策利率“换锚”，隔夜取代7天；金融街论坛提出推出非银流动性支持工具、贷款定价基准多元化、优化短端政策利率等改革方向；11部门发布金融支持三大国际科技创新中心建设的指导意见。\u003c/li>\n\u003cli>宁德时代两地齐跌逾11%，拖累创业板指和沪深300至14个月低点，A股收跌12.0%；腾讯控股跌4.0%创一年新低；今日成交14716亿元、增量226亿元。\u003c/li>\n\u003cli>天岳先进Q3净利润大幅超越一致预期，毛利率环比改善至27.5%；春风动力Q3收入增速50%、四轮车收入增速76%、表观利润剔除退税后5.6亿元符合此前市场预期。\u003c/li>\n\u003cli>泽璟制药收到艾伯维1000万美元里程碑付款，叠加年初1亿美元首付款累计回款1.1亿美元；9月电子烟出口同比-6.8%至8.19亿美元，美国同比-37.8%。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>10月22日宇树世界物理AI大会/特斯拉Q3业绩会，Optimus V3量产节奏为焦点。\u003c/li>\n\u003cli>星舰下一次发射及箭体完整回收目标；SpaceX与特斯拉合并特别委员会探讨进展，合并并非确定事项。\u003c/li>\n\u003cli>Google Cloud A5X实例下月全面可用及Vera Rubin基础设施部署进度。\u003c/li>\n\u003cli>台光电M10年底到明年初推出、M9量产后明年放量情况，以及高端CCL紧缺持续至2029年之后的验证。\u003c/li>\n\u003cli>SPIL CPO光引擎产能到27年年中提高15倍、28年底再翻一番的落地进展。\u003c/li>\n\u003cli>仕佳光子28亿元定增进展及27年光芯片产能超亿颗的兑现。\u003c/li>\n\u003cli>美国中期选举11月第一周出结果，对AI资本开支和美债长端收益率的影响。\u003c/li>\n\u003cli>国家数据集团成立后，数据要素在工业、医疗、金融数据集等具体场景的落地。\u003c/li>\n\u003cli>10/21周三盘后META、LRCX、SAP、TXN财报；10/22周四盘后SPOT、WDC财报。\u003c/li>\n\u003cli>澜起科技3Q26业绩后存储概念随韩股反弹走强的持续性；宁德时代下跌后ETF净流入能否托住成长股。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>01:40｜2026年10月20日云盘汇总\u003c/li>\n\u003cli>07:23｜盘前热点事件一、昨日热点机器人：大业股份、福莱新材 飞行汽车：东安动力 军工：长春一东 AI安全：吉大正元 端侧AI：日海智能、移远通信 三季报：昂立教育、海正药业二、国家数据集团成立经国务院批准，10月20日，国家数据集团有限公司正式挂牌成立。由国务院国有资产监督管理委员会代表国务院履行出资人职责，列入国务院国有资产监督管理委员会履行出资人职责的企业名单。\u003c/li>\n\u003cli>07:25｜10月21日：数据要素、智能制造、机器人与物理AI、量子计算等概念股梳理 一、昨夜发酵消息精选。1、数据要素：10月20日，国家数据集团有限公司在河北雄安新区成立。\u003c/li>\ const list=(v)=>Array.isArray(v)?'<ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
