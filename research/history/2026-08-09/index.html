产替代趋势确定 ，公司格局溢价 凸显。英伟达等海外 AI芯片在中国市场销售的不确定性限制了国内 互联网厂商的采购，这给国产 AI芯片公司填补其留下的市场提供了很好的机会。在国产 AI芯片产品中，寒武 纪的思元系列芯片是少有的得到互联网厂商认可和规模化采购的产品，在商业化方面具有先发优势。从下游互 联网厂商采购的角度，基于商 业运营效率考虑，其不会同时无差别的导入过多的芯片供应商。总体而言 ，寒武 纪在互联网领域商业拓展的先发优势和其供应链的领先优势 是公司格局溢价 的重要组成部分，其格局溢价在 AI芯片国产替代的趋势中有望进一步凸显。 表 1：季度财务关键数据（单位：百万元） 财报数据 25Q1 25Q2 25Q3 25Q4 26Q1 26Q2 营业收入 1,111.40 1,769.24 1,726.78 1,889.77 2,884.70 3,110.88 营业成本 489.13 780.50 790.21 854.04 1317.43 1,365.55 销售费用 14.39 13.73 14.55 25.35 12.65 13.59 管理费用 43.07 54.92 39.75 60.35 35.94 46.51 研发费用 272.57 269.32 300.93 507.98 324.04 378.43 财务费用 10.18 -2.10 8.20 -5.31 6.35 -4.29 投资净收益 1.12 2.12 10.42 -4.76 16.01 67.26 营业利润 355.35 683.10 567.25 455.69 1014.25 1,286.96 归母公司净利润 355.47 682.62 566.56 454.58 1013.21 1,297.70 扣非净利润 275.96 636.60 506.32 351.05 934.30 1,231.26 主要比率 毛利率 55.99% 55.88% 54.24% 54.81% 54.33% 56.10% 销售费用率 1.29% 0.78% 0.84% 1.34% 0.44% 0.44% 管理费用率 3.88% 3.10% 2.30% 3.19% 1.25% 1.50% 研发费用率 24.53% 15.22% 17.43% 26.89% 11.23% 12.16% 营业利润率 31.97% 38.61% 32.85% 24.11% 35.16% 41.37% 归母净利率 31.98% 38.58% 32.81% 24.05% 35.13% 41.71% YoY 营业收入 4,230.22% 4,425.01% 1332.52% 91.05% 159.56% 75.83% 归母净利润 - - - 67.03% 185.04% 90.11% 扣非净利润 - - - - 238.56% 93.41% QoQ 营业收入 12.36% 59.19% -2.40% 9.44% 52.67% 7.84% 归母净利润 30.61% 92.03% -17.00% -19.76% 122.89% 28.08% 扣非净利润 11,145.91% 130.68% -20.47% -30.67% 166.15% 31.78% 数据来源： wind, 广发证券发展研究中心 二、盈利预测和投资建议 预计 26-28年，公司营收 171.8 /446.3 /892.6亿元，同比增长 164.3%/159.9%/ 100.0 %；归母净利润 56.7/172.2/350.8亿元，每股净收益为 9.03/27.41/55.84元/股。 可比公司估值：在芯片设计行业，海光信息、沐曦股份、摩尔线程，这三家公司与寒武纪在技术路线、盈利模 式和下游市场上较为类似。故我们选取这三家公司作为可比公司。 1. 在生态建设方面，寒武纪的思元系列 AI芯片是国内较早开始推广，在商业落地上取得领先优势的基础上， 下载日志已记录，仅供内部参考 请务必阅读末页的免责声明 04 / 8 [Table_PageText1] 中报点评 | 寒武纪 与互联网厂商和模型公司积极进行生态适配。例如， DeepSeek V4、SenseNova U1 在推出的第一时间即宣布 适配寒武纪的芯片 。（数据来源：寒武纪开发者官方微信公众号） 因此，公司已形成较强的生态壁垒。 2. 在供应链方面 ，国内新晋 AI芯片厂商若要将其产品性能及成熟度提升至公司当前水准，则必须攻克公司过 去数年间在供应链体系建设中所经历并克服的挑战，例如先进制程工艺的长期磨合与良率爬坡、先进封装技术 的突破、建立稳定可靠的原材料来源以及能否得到有限供应体系下相对充足的资源支持等。而从存货、预付款 项以及周转率等指标来看，公司供应链在快速改善中，供应链的优势有望进一步凸显。 3. 在竞争格局方面，英伟达高端 AI芯片在中国市场销售的不确定性带来的国内 AI芯片竞争格局的改善；而 在国产 AI芯片中，寒武纪在较早的商业化落地的基础上正在扩大对追赶者的优势，因为最终用户不大会接受 同时采用诸如四、五种以上不同的 AI芯片。因此，寒武纪在国产 AI芯片的市场地位较高，具有明显的格局溢 价。 综合考虑公司行业地位、竞争优势、下游需求前景以及独立第三方平台的稀缺性等因素，在参考可比公司估值 水平基础上我们给予一定的稀缺性和市场地位的溢价，我们给予公司 27年70倍PE，对应合理价值 1918.71 元/股，维持“买入”评级。 表 2：寒武纪 可比公司 PE估值情况（市值统计截止 2026.8.7 收盘） 公司名称 公司代码 业务类型 市值 （亿元） 净利润（百万元） PE估值水平 2025A 2026E 2027E 2025A 2026E 2027E 海光信息 688041 GPU+CPU 6874 2545 4445 6707 205 155 103 沐曦股份 688802 GPU 2917 -789 35 941 - 8238 310 摩尔线程 688795 GPU 2810 -1001 -229 464 - - 606 数据来源： Wind、广发证券发展研究中心 注：海光信息 、沐曦股份 、摩尔线程 盈利预测来自 Wind一致预期 三、风险提示 供应链完善节奏的不确定性；国产 AI芯片产品迭代和落地加剧行业竞争；软件生态拓展的不确定性；以互联 网公司为代表的商业客户，国产化提升的需求节奏的不确定性。 下载日志已记录，仅供内部参考 请务必阅读末页的免责声明 05 / 8 [Table_PageText1] 中报点评 | 寒武纪 [Table_Finance Detail] 资产负债表 单位:人民币百万元 现金流量表 单位:人民币百万元 2024A 2025A 2026E 2027E 2028E 2024A 2025A 2026E 2027E 2028E 流动资产总额 5,800 12,080 21,668 40,498 77,979 经营活动现金流净额 -1,618 -498 350 8,710 25,472 货币资金 1,986 1,317 7,608 14,978 34,762 合并净利润 -457 2,058 5,675 17,222 35,081 应收及预付 1,108 1,421 3,518 6,700 10,106 折旧摊销 209 285 340 396 450 存货 1,774 4,944 9,156 17,107 28,511 营运资金变动 -1,443 -3,258 -5,643 -8,900 -10,112 其他 931 4,398 1,386 1,713 4,600 其他 0 0 -79 -250 50 非流动资产总额 917 1,357 1,090 869 1,419 投资活动现金流净额 -412 -4,530 3,870 -349 -4,010 长期股权投资 247 300 305 305 305 资本性开支 -366 -569 -230 -300 -630 固定资产 231 373 277 246 276 投资 -90 -3,963 3,536 -229 -3,010 在建工程 150 164 174 154 164 其他 44 1 564 180 -370 使用权资产 16 17 17 17 17 融资活动现金流净额 48 3,986 2,458 -991 -1,677 无形资产 183 189 129 49 169 股本融资 56 4,137 207 0 0 其他 91 315 188 98 488 债权融资 100 -100 2,307 -500 -500 资产总额 6,718 13,438 22,758 41,367 79,398 股利分配与偿付利息 0 -4 -203 -574 -1,094 流动负债总额 818 1,333 2,794 5,015 9,700 其他 -108 -47 148 83 -83 短期借款 100 0 200 100 200 现金净增加额 -1,982 -1,043 6,679 7,370 19,784 应付及预收 516 1,117 2,296 4,580 9,159 期初现金余额 3,954 1,972 929 7,608 14,978 其他 203 216 298 335 341 期末现金余额 1,972 929 7,608 14,978 34,762 非流动负债总额 469 261 2,420 2,103 1,420 长期借款 0 0 2,000 1,500 1,000 应付债券 0 0 0 0 0 其他 469 261 42 司坚持 “正道追 求，特异创新 ”，在上海、深圳、美国、荷兰设立研发中心 ，内部研发与外部战 略咨询双轮驱动 ， 星空篷、 Novara 吊伞等产品 获得红点奖。 公司特有的专利和持 续创新构筑强产品护城河， 爆品战略（好看、好用、高价值）推动品牌从制造型 向产品型、品牌型升级 ，并持续迭代 以保持产品优势。 生产端，临海、顺德晴天 和印尼基地 全球供应链协同 ，通过数字化生产降本增效。厚积薄发， 2023 -2025 年Mirador 星空篷位列全球户外廊架销量第一， 2025 全年星空蓬占总营收达 50%+ 。未来，公司还将 聚焦于渠道深度铺设和户外品类拓展 ，包括入驻 Costco 等北美线下 KA渠道，露营车、户外家具多品类协同开拓，以开启第二增长曲线。 投资建议： 浙江正特作为面向海外市场的户外龙头之一，大单品星空蓬 0-1的爆 品逻辑已线上得到验证， 拓展北美线下大型 KA门店后有望完成 1-100持续放量； 露营车及户外家具有望开启公司第二增长曲线。 预计公司 2026 -2028 年营收分 别为 21.30/26.11/31.04 亿元， 同比 +26.97%/ +22.60%/ +18.86% ；归母净利润 0.94/1.59/2.21 亿元，同比 +158.17%/ +69.89%/ +39.33% ；EPS为0.60/1.02/ 1.43 元/股，当前股价对应 PE分别为 42/25/18x。首次覆盖， 给予 “ 推荐” 评级。 风险提示： 1）欧美等海外消费不及预期风险； 2）原材料价格大幅上涨风险； 3） 汇率波动风险 ；4）核心产品销售不及预期风险 ；5）新品扩展不及预期风险 。 [Table_Forcast] 盈利预测与财务指标 项目/年度 2025A 2026E 2027E 2028E 营业收入（百万元） 1,677 2,130 2,611 3,104 增长率（ %） 35.6 27.0 22.6 18.9 归属母公司股东净利润（百万元） 36 94 159 221 增长率（ %） 359.1 158.2 69.9 39.3 每股收益（元） 0.23 0.60 1.02 1.43 PE (X) 108 42 25 18 PB (X) 3.5 3.3 2.9 2.6 资料来源： iFinD ，国联民生证券研究所预测；（注：股价为 2026 年8月7日收盘价） 推荐 首次评级 当前价格： 25.26 元 [Table_Author] 分析师 徐皓亮 执业证书： S0590525120007 邮箱： xuhaoliang@glms.com.cn 分析师 童苇航 执业证书： S0590526070011 邮箱： tongwh@glms.com.cn 相对走势 -30%-7%17%40% 2025/8 2026/2 2026/8浙江正特 沪深300 2026 年 08 月 08 日 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 2 浙江正特 (001238.SZ )/轻工及中小盘 投资聚焦 1）大单品驱动增长，渠道深化： 公司战略爆品“星空篷”凭借差异化设计和 强产品力， 线上市占率已处于领先地位， 未来也将持续替代传统木质廊架， 大单品 星空蓬的爆品逻辑已线上得到验证，拓展北美线下大型 KA门店后有望持续放量； 2）新品类拓展，贡献未来增量： 公司在户外场景领域进行了品类拓展，推出 了露营车、户外家具套组等新品，已获得渠道和消费者积极反馈，并成功进入 Walmart 等线下渠道，有望开启公司第二增长曲线。 核心假设 1）收入端：①遮阳制品： 截至 2025 年，公司星空蓬已进入北美 Costco 多 家线下门店， 并上线 Costco 及Sam ’s Club 电商平台， 预计产品将实现高速增长， 2026 -2028 年遮阳制品收入同比增速为 +25.00%/+20.00%/+16.00% ；②户外休 闲家具： 公司加速拓展户外场景，推出储物、户外家具、露营车等多个品类，露营 车已进入 Walmart 多家线下门店，预计户外休闲家具也将在未来持续放量，假设 2026 -2028 年收入同比增速为 +60.00%/+50.00 %/+40.00 %；③其他业务： 假设 2026 -2028 年收入同比增速为 +20.00%/+20.00%/+20.00% 。 2）毛利率： 分业务来看， ①遮阳制品： 预计随着星空篷等大单品持续放量， 规模效应下毛利率将有所提升， 因此我们假设 2026 -2028 年遮阳制品毛利率分别 为28.70%/28.90%/29.10% ；②户外休闲家具： 预计未来公司将持续拓展户外休 闲家具新品并不断扩大规模， 假设新品导入和规模效应 带动毛利率持续改善， 因此 我们假设 2026 -2028 年户外休闲家具毛利率分别为 18.00%/19.00%/20.00% ； ③其他业务： 我们假设 2026 -2028 年其他业务毛利率维持稳定，分别为 3.00%/3.00%/3.00% 。综上，我们预测 2026 -2028 年公司毛利率有望达到 25.67%/25.78%/25.85% 。 近期催化 浙江正特作为面向海外市场的户外行业龙头，凭借星空篷大单品率先实现从 线上验证到北美线下核心 KA渠道的放量突破，有望开启 “1到100”高速扩张。 公司多品类快速拓展，露营车、户外家具打开第二增长曲线，战略主线清晰，创新 动力与全球化渠道能力兼备。渠道、产品、供应链共振下，公司 有望步入利润快速 修复与业绩高增阶段。 从股价来看， 近期地缘冲突下出口链整体估值处于低位， 若 地缘因素缓解 ，出口链估值有望回升。 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 3 浙江正特 (001238.SZ )/轻工及中小盘 目录 1 浙江正特：面向海外市场的户外龙头 ................................ ................................ ................................ ........................ 4 2 多因素共振，海外零售商转型正当时 ................................ ................................ ................................ ........................ 9 3 创新驱动：品正质优，特异求新 ................................ ................................ ................................ ............................ 13 3.1 以“品正质优 ”为核心， 内外设计网络并进 ................................ ................................ ................................ ................................ 13 3.2 “好看、好用、高价值 ”打造极致产品 ................................ ................................ ................................ ................................ ............ 15 3.3 全球供应链协同，数字化生产降本增效 ................................ ................................ ................................ ................................ ...... 16 4 厚积薄发：廊架升级，星空蓬热销 ................................ ................................ ................................ ........................ 19 5 高瞻远瞩：户外场景拓展，发展空间可期 ................................ ................................ ................................ .............. 22 5.1 户外场景拓展，协同进步 ................................ ................................ ................................ ................................ ............................... 22 5.2 如何测算星空蓬和户外家具空间？ ................................ ................................ ................................ .... 顺德晴天 和印尼基地 全球供应链协同 ，通过数字化生产降本增效。厚积薄发， 2023 -2025 年Mirador 星空篷位列全球户外廊架销量第一， 2025 全年星空蓬占总营收达 50%+ 。未来，公司还将 聚焦于渠道深度铺设和户外品类拓展 ，包括入驻 Costco 等北美线下 KA渠道，露营车、户外家具多品类协同开拓，以开启第二增长曲线。 投资建议： 浙江正特作为面向海外市场的户外龙头之一，大单品星空蓬 0-1的爆 品逻辑已线上得到验证， 拓展北美线下大型 KA门店后有望完成 1-100持续放量； 露营车及户外家具有望开启公司第二增长曲线。 预计公司 2026 -2028 年营收分 别为 21.30/26.11/31.04 亿元， 同比 +26.97%/ +22.60%/ +18.86% ；归母净利润 0.94/1.59/2.21 亿元，同比 +158.17%/ +69.89%/ +39.33% ；EPS为0.60/1.02/ 1.43 元/股，当前股价对应 PE分别为 42/25/18x。首次覆盖， 给予 “ 推荐” 评级。 风险提示： 1）欧美等海外消费不及预期风险； 2）原材料价格大幅上涨风险； 3） 汇率波动风险 ；4）核心产品销售不及预期风险 ；5）新品扩展不及预期风险 。 [Table_Forcast] 盈利预测与财务指标 项目/年度 2025A 2026E 2027E 2028E 营业收入（百万元） 1,677 2,130 2,611 3,104 增长率（ %） 35.6 27.0 22.6 18.9 归属母公司股东净利润（百万元） 36 94 159 221 增长率（ %） 359.1 158.2 69.9 39.3 每股收益（元） 0.23 0.60 1.02 1.43 PE (X) 108 42 25 18 PB (X) 3.5 3.3 2.9 2.6 资料来源： iFinD ，国联民生证券研究所预测；（注：股价为 2026 年8月7日收盘价） 推荐 首次评级 当前价格： 25.26 元 [Table_Author] 分析师 徐皓亮 执业证书： S0590525120007 邮箱： xuhaoliang@glms.com.cn 分析师 童苇航 执业证书： S0590526070011 邮箱： tongwh@glms.com.cn 相对走势 -30%-7%17%40% 2025/8 2026/2 2026/8浙江正特 沪深300 2026 年 08 月 08 日 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 2 浙江正特 (001238.SZ )/轻工及中小盘 投资聚焦 1）大单品驱动增长，渠道深化： 公司战略爆品“星空篷”凭借差异化设计和 强产品力， 线上市占率已处于领先地位， 未来也将持续替代传统木质廊架， 大单品 星空蓬的爆品逻辑已线上得到验证，拓展北美线下大型 KA门店后有望持续放量； 2）新品类拓展，贡献未来增量： 公司在户外场景领域进行了品类拓展，推出 了露营车、户外家具套组等新品，已获得渠道和消费者积极反馈，并成功进入 Walmart 等线下渠道，有望开启公司第二增长曲线。 核心假设 1）收入端：①遮阳制品： 截至 2025 年，公司星空蓬已进入北美 Costco 多 家线下门店， 并上线 Costco 及Sam ’s Club 电商平台， 预计产品将实现高速增长， 2026 -2028 年遮阳制品收入同比增速为 +25.00%/+20.00%/+16.00% ；②户外休 闲家具： 公司加速拓展户外场景，推出储物、户外家具、露营车等多个品类，露营 车已进入 Walmart 多家线下门店，预计户外休闲家具也将在未来持续放量，假设 2026 -2028 年收入同比增速为 +60.00%/+50.00 %/+40.00 %；③其他业务： 假设 2026 -2028 年收入同比增速为 +20.00%/+20.00%/+20.00% 。 2）毛利率： 分业务来看， ①遮阳制品： 预计随着星空篷等大单品持续放量， 规模效应下毛利率将有所提升， 因此我们假设 2026 -2028 年遮阳制品毛利率分别 为28.70%/28.90%/29.10% ；②户外休闲家具： 预计未来公司将持续拓展户外休 闲家具新品并不断扩大规模， 假设新品导入和规模效应 带动毛利率持续改善， 因此 我们假设 2026 -2028 年户外休闲家具毛利率分别为 18.00%/19.00%/20.00% ； ③其他业务： 我们假设 2026 -2028 年其他业务毛利率维持稳定，分别为 3.00%/3.00%/3.00% 。综上，我们预测 2026 -2028 年公司毛利率有望达到 25.67%/25.78%/25.85% 。 近期催化 浙江正特作为面向海外市场的户外行业龙头，凭借星空篷大单品率先实现从 线上验证到北美线下核心 KA渠道的放量突破，有望开启 “1到100”高速扩张。 公司多品类快速拓展，露营车、户外家具打开第二增长曲线，战略主线清晰，创新 动力与全球化渠道能力兼备。渠道、产品、供应链共振下，公司 有望步入利润快速 修复与业绩高增阶段。 从股价来看， 近期地缘冲突下出口链整体估值处于低位， 若 地缘因素缓解 ，出口链估值有望回升。 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 3 浙江正特 (001238.SZ )/轻工及中小盘 目录 1 浙江正特：面向海外市场的户外龙头 ................................ ................................ ................................ ........................ 4 2 多因素共振，海外零售商转型正当时 ................................ ................................ ................................ ........................ 9 3 创新驱动：品正质优，特异求新 ................................ ................................ ................................ ............................ 13 3.1 以“品正质优 ”为核心， 内外设计网络并进 ................................ ................................ ................................ ................................ 13 3.2 “好看、好用、高价值 ”打造极致产品 ................................ ................................ ................................ ................................ ............ 15 3.3 全球供应链协同，数字化生产降本增效 ................................ ................................ ................................ ................................ ...... 16 4 厚积薄发：廊架升级，星空蓬热销 ................................ ................................ ................................ ........................ 19 5 高瞻远瞩：户外场景拓展，发展空间可期 ................................ ................................ ................................ .............. 22 5.1 户外场景拓展，协同进步 ................................ ................................ ................................ ................................ ............................... 22 5.2 如何测算星空蓬和户外家具空间？ ................................ ................................ ................................ ................................ .............. 24 6 盈利预测与投资建议 ................................ ................................ ................................ .....  45%。公司主营业务为浓缩 果蔬汁 (浆)的生产和销售，以苹果、梨等果蔬农产品为生产原料。公司 2025年收入 19.84亿元，同比下降 0.15%，收入中 99%来自果汁、香料 及果糖主业，以出海为主， 2025年国际收入占比约 73%。 ◼ 规划收购 电子信息工程设计优质资产 ， 探索战略转型 ：2025年国投中鲁 拟筹划重大资产重组，拟通过发行股份方式购买中国电子工程设计院 （简称电子院） 100%股份，交易对价为 60.26亿元，探索战略转型电子 信息上游产业。 ◼ 半导体扩产推动 工程设计 需求增长。2021年以来， 我国已竣工半导体项 目数量与投资规模持续增长， 当下仍处在高速增长期。 AI算力革命推动 半导体扩产新周期，同时先进制程与封装创新双轮驱动技术迭代，第三 代半导体产业化进程加速， 半导体产业升级和加速扩产将直接推动工程 设计需求增长 。 ◼ 电子院：电子信息工程设计国家队 。电子院控股股东同样为国投集团， 大基金二期为电子院的重要股东之一。 公司前身是 1953年成立的重工 业部电信工业管理局设计处。在集成电路领域，从我国第一个集成电路 项目至第一条由国内企业主导的 12英寸 3D闪存芯片生产线项目，承 担了多条集成电路芯片生产线的咨询、设计和工程总承包工作， 电子院 助力完成国家基础战略布局。 目前电子院服务领域已从电子信息产业逐 步延伸到算力基础设施、大科学装置等其他相关领域，主业包括 工程总 承包与分项承包 、设计与全过程咨询、工程技术服务与销售，覆盖中芯 国际、长鑫存储、京东方等头部客户。在电子信息产业工程勘察设计行 业，公司与太极实业旗下的十一科技占有绝大部分市场份额。 ◼ 电子院：归母净利润高增，业绩承诺彰显发展信心 。2025年1-11月电 子院收入 70.6亿元，相较于 2024全年增长 3.7%，归母净利润 2.14亿 元，相较于 2024全年增长 89%。此次重大资产重组，电子院业绩承诺 为2026 -2028年扣非归母净利润 3.12/3.48/3.75 亿元，彰显发展信心。 ◼ 盈利预测与投资评级： 我们预计公司 2026 -2028年营收分别为 20.83、 21.87、22.97亿元，归母净利润分别为 0.42/0.43/0.47 亿元，同比增长 2%、2%、9%，对应 EPS分别为 0.16/0.16/0.18 元。若公司完成电子院 100%股权收购， 则有望大幅增厚公司营收和归母净利润， 我们看好国投 中鲁作为国投系上市平台， 拟收购电子院战略转型半导体上游“卖铲 人” ，首次覆盖，给予“买入”评级。 ◼ 风险提示： 重大资产重组失败风险；跨界整合风险；商誉减值风险；电 子院业绩不及预期；募集资金不确定性风险；下游需求不及预期；原材 料价格波动 。 -7%-1%5%11%17%23%29%35%41%47%53% 2025/8/6 2025/12/5 2026/4/5 2026/8/4国投中鲁 沪深 300 仅供内部参考，请勿外传 请务必阅读正文之后的免责声明部分 公司深度研究 东吴证券研究所 2 / 16 内容目录 1. 全球浓缩苹果汁领军企业 ................................ ................................ ................................ .................. 4 2. 电子院：电子信息工程设计国家队 ................................ ................................ ................................ .. 7 2.1. 半导体扩产推动工程设计需求增长 ................................ ................................ ......................... 7 2.2. 电子院： 电子信息工程设计国家队 ，迎接半导体国产替代大时代 ................................ ..... 9 3. 浓缩果汁市场：稳健发展 ................................ ................................ ................................ ................ 11 4. 盈利预测和估值 ................................ ................................ ............................ 电商和沃尔玛、 Costco 等大型连锁渠道 。 其中 星空篷 等大单品 带动收入 增长， 虽地缘政治影响下 2023 年需求下降， 去库 不及预期 ，但2024年收入 迅速 回暖，2025 年持续增长， 其中 2025 年线下/线上收入分别同比 +41.6%/+12.3% 。 多因素共振，海外线下零售商转型正当时。 公共卫生事件和跨境电商兴起 彻底改 变了欧美零售业格局 ，我们将美国渠道分为 “边缘渠道” 和“灯塔渠道” 两部分： 一方面， 中美贸易摩擦 背景下 中小渠道式微， 边缘渠道 通过 OBM 转DDP 模式将 风险转移至供应链上游，同时利用店中店 模式引入新品类 ，以提升店效 ；另一方 面，传统选品模式下， 以Walmart 、Best Buy 为代表的大型零售商主要依赖买 手、供应商等线下渠道 选品。而近年来灯塔渠道加速布局自有线上平台，选品路 径上开始更多 依赖于 第三方电商平台发掘 热销商品并在自身线上渠道 进行试销， 后再将高销量商品 推向线下门店。主流零售仍以线下为主，但 选品模式的变化为 企业打通了一条通往线下渠道的路径， 线上畅销能力、供应链综合管理成为中国 出口企业进入线下核心渠道的必备条件，浙江正特的星空篷产品即为典型代表。 创新引领爆款周期叠加线下渠道红利，业务进入成长快车道 。公司坚持 “正道追 求，特异创新 ”，在上海、深圳、美国、荷兰设立研发中心 ，内部研发与外部战 略咨询双轮驱动 ， 星空篷、 Novara 吊伞等产品 获得红点奖。 公司特有的专利和持 续创新构筑强产品护城河， 爆品战略（好看、好用、高价值）推动品牌从制造型 向产品型、品牌型升级 ，并持续迭代 以保持产品优势。 生产端，临海、顺德晴天 和印尼基地 全球供应链协同 ，通过数字化生产降本增效。厚积薄发， 2023 -2025 年Mirador 星空篷位列全球户外廊架销量第一， 2025 全年星空蓬占总营收达 50%+ 。未来，公司还将 聚焦于渠道深度铺设和户外品类拓展 ，包括入驻 Costco 等北美线下 KA渠道，露营车、户外家具多品类协同开拓，以开启第二增长曲线。 投资建议： 浙江正特作为面向海外市场的户外龙头之一，大单品星空蓬 0-1的爆 品逻辑已线上得到验证， 拓展北美线下大型 KA门店后有望完成 1-100持续放量； 露营车及户外家具有望开启公司第二增长曲线。 预计公司 2026 -2028 年营收分 别为 21.30/26.11/31.04 亿元， 同比 +26.97%/ +22.60%/ +18.86% ；归母净利润 0.94/1.59/2.21 亿元，同比 +158.17%/ +69.89%/ +39.33% ；EPS为0.60/1.02/ 1.43 元/股，当前股价对应 PE分别为 42/25/18x。首次覆盖， 给予 “ 推荐” 评级。 风险提示： 1）欧美等海外消费不及预期风险； 2）原材料价格大幅上涨风险； 3） 汇率波动风险 ；4）核心产品销售不及预期风险 ；5）新品扩展不及预期风险 。 [Table_Forcast] 盈利预测与财务指标 项目/年度 2025A 2026E 2027E 2028E 营业收入（百万元） 1,677 2,130 2,611 3,104 增长率（ %） 35.6 27.0 22.6 18.9 归属母公司股东净利润（百万元） 36 94 159 221 增长率（ %） 359.1 158.2 69.9 39.3 每股收益（元） 0.23 0.60 1.02 1.43 PE (X) 108 42 25 18 PB (X) 3.5 3.3 2.9 2.6 资料来源： iFinD ，国联民生证券研究所预测；（注：股价为 2026 年8月7日收盘价） 推荐 首次评级 当前价格： 25.26 元 [Table_Author] 分析师 徐皓亮 执业证书： S0590525120007 邮箱： xuhaoliang@glms.com.cn 分析师 童苇航 执业证书： S0590526070011 邮箱： tongwh@glms.com.cn 相对走势 -30%-7%17%40% 2025/8 2026/2 2026/8浙江正特 沪深300 2026 年 08 月 08 日 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 2 浙江正特 (001238.SZ )/轻工及中小盘 投资聚焦 1）大单品驱动增长，渠道深化： 公司战略爆品“星空篷”凭借差异化设计和 强产品力， 线上市占率已处于领先地位， 未来也将持续替代传统木质廊架， 大单品 星空蓬的爆品逻辑已线上得到验证，拓展北美线下大型 KA门店后有望持续放量； 2）新品类拓展，贡献未来增量： 15 年完成股份制改革，并于 2022 年9月19日在深圳证券交易所主板成 功上市。 陈永辉先生将公司发展分为三个阶段： 初创期、发展期和升级期。 初创阶段 （1996 -2000 年，以来料加工为主）、发展阶段（ 2001 -2008 年，开展自营出口 并扩展产品线）和升级阶段（ 2009 年至今，注重自主研发和品牌建设）。公司积 极推动公司从 OEM 向ODM/OBM 转型，逐步从 “生产型 ”公司向 “产品型 ”公司迈 进。2014 年布局跨境电商，于 2015 年与 2016 年分别设立荷兰晴天花园与美国 晴天花园子公司， 2020 年推出星空蓬爆品，持续驱动公司增长。 图1：浙江正特公司发展历程 资料来源：浙江正特 招股说明书，公司公告 ，国联民生证券研究所 公司经过近 30年的发展与积累， 已建立较为完整的户外休闲家具及用品业务 体系。 公司现拥有 遮阳制品、 户外休闲家具 两大产品系列， 其中遮阳制品主要包括 星空篷、遮阳篷和遮阳伞 ，户外休闲家具主要包括 宠物屋、户外家具、储物用品 ， 使用场景为家庭庭院、露台、餐馆、酒吧、海滩、公园、酒店等休闲场所。公司拥 有MIRADOR 、ABBA PATIO 、AVAAR 多个自主品牌，通过跨境电商、 KA渠道 渗透欧美市场。 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 5 浙江正特 (001238.SZ )/轻工及中小盘 图2：公司产品由遮阳制品和户外休闲家具两大系列组成 资料来源：浙江正特公司公告，国联民生证券研究所 公司战略大单品星空篷带动 2025年收入增长， 成功进入 Costco 、Sam's 等 主流渠道 ，并荣登 Amazon “Best Seller ”榜单 ，2025/202 6Q1 公司总营收 16.77/6.32 亿元，同比 +35.6%/+24.7%，其中遮阳产品占据绝大比例， 2025 占 总营收比达 84.5%。新增长势能正在逐渐形成： 1.Mirador 品牌星空篷产品荣获 全球户外廊架销量第一 ， 市占率行业领先。 公司将凭借持续的产品迭代、 渠道深度 渗透与供应链优势， 通过持续释放爆品势能， 巩固星空篷系列产品的全球领先地位 ； 2.产品结构持续优化 ， 高附加值产品销售占比不断提升， 销售额实现较快增长，带 动整体盈利水平提升。 图3：2026Q1 公司营收 6.32 亿元，同比 +24.7% 图4：遮阳制品收入大部分比例且逐年提升 资料来源： iFinD ，国联民生证券研究所 资料来源： iFinD ，国联民生证券研究所 公司以北美、欧洲为主要出口市场， 2025 内销/外销收入分别为 1.38/15.39 亿元， 同比 +54.5%/+3 4.1%， 海外收入整体占比超 90%。 销售模式分为 2B和2C 渠道： 2B渠道： 主要覆盖 沃尔玛、 Costco 等大型超市， JEC等品牌商及 DIY连 6.026.86 5.177.04 6.759.1012.4013.82 10.9112.3716.77 6.32 -3.1%14.1% 0.0% 0.0% -4.1%34.8%36.3% 11.5% -21.1%13.4%35.6% 24.7% -30%-20%-10%0%10%20%30%40%50% 024681012141618营业总收入 (亿元) yoy 6.519.7111.45 9.3610.6414.1771.6%78.3%82.8%85.8% 86.1% 84.5% 0%20%40%60%80%100% 05101520 2020 2021 2022 2023 2024 2025遮阳制品 户外休闲家具 其他业务 遮阳制品占比 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 6 浙江正特 (001238.SZ )/轻工及中小盘 锁店。 公司通过位于欧美的子公司在主要客户总部附近布局， 以开拓区域市场； 2C 渠道： 重点发展 跨境电商（亚马逊、 Wayfair 等）、客户自有线上平台和公司自主 品牌独立站。 2025 公 司 线 下 /线 上 收 入 分 别 为 13.96 /2.82 亿 元 ， 同 比 +41.6%/+12.3%。 图5：外销收入占比超过 90%，近年来持续双位数增长 图6：线下为主要销售渠道， 2025 实现 41.6% 高增 资料来源： iFinD ，国联民生证券研究所 资料来源： iFinD ，国联民生证券研究所 2026Q1 公司毛利率达 25.9% ，2021 -2026Q1 毛利率整体持续上行 ，主要 系：1） 星空篷持续带动收入增长， 差异化爆款占比提升 ；2） 线下渠道逐步放量 、PCB上游超跌修复，三井载体铜箔扩产加速-260809.pdf", "kind": "attachment", "title": "国金证券-非金属建材行业周观点：mSAP、PCB上游超跌修复，三井载体铜箔扩产加速-260809", "source_label": "国金证券", "excerpt": "本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明", "content": "本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 1 浙江正特（ 001238 .SZ）深度 报告 创新驱动，厚积薄发 glmszqdatemark 浙江正特：面向海外市场的户外龙头。 浙江正特创立于 1996 年，拥有 遮阳制品、 户外休闲家具 两大产品系列， 打造了MIRADOR 、ABBA PATIO 等自主品牌， 主攻跨境电商和沃尔玛、 Costco 等大型连锁渠道 。 其中 星空篷 等大单品 带动收入 增长， 虽地缘政治影响下 2023 年需求下降， 去库 不及预期 ，但2024年收入 迅速 回暖，2025 年持续增长， 其中 2025 年线下/线上收入分别同比 +41.6%/+12.3% 。 多因素共振，海外线下零售商转型正当时。 公共卫生事件和跨境电商兴起 彻底改 变了欧美零售业格局 ，我们将美国渠道分为 “边缘渠道” 和“灯塔渠道” 两部分： 一方面， 中美贸易摩擦 背景下 中小渠道式微， 边缘渠道 通过 OBM 转DDP 模式将 风险转移至供应链上游，同时利用店中店 模式引入新品类 ，以提升店效 ；另一方 面，传统选品模式下， 以Walmart 、Best Buy 为代表的大型零售商主要依赖买 手、供应商等线下渠道 选品。而近年来灯塔渠道加速布局自有线上平台，选品路 径上开始更多 依赖于 第三方电商平台发掘 热销商品并在自身线上渠道 进行试销， 后再将高销量商品 推向线下门店。主流零售仍以线下为主，但 选品模式的变化为 企业打通了一条通往线下渠道的路径， 线上畅销能力、供应链综合管理成为中国 出口企业进入线下核心渠道的必备条件，浙江正特的星空篷产品即为典型代表。 创新引领爆款周期叠加线下渠道红利，业务进入成长快车道 。公司坚持 “正道追 求，特异创新 ”，在上海、深圳、美国、荷兰设立研发中心 ，内部研发与外部战 略咨询双轮驱动 ， 星空篷、 Novara 吊伞等产品 获得红点奖。 公司特有的专利和持 续创新构筑强产品护城河， 爆品战略（好看、好用、高价值）推动品牌从制造型 向产品型、品牌型升级 ，并持续迭代 以保持产品优势。 生产端，临海、顺德晴天 和印尼基地 全球供应链协同 ，通过数字化生产降本增效。厚积薄发， 2023 -2025 年Mirador 星空篷位列全球户外廊架销量第一， 2025 全年星空蓬占总营收达 50%+ 。未来，公司还将 聚焦于渠道深度铺设和户外品类拓展 ，包括入驻 Costco 等北美线下 KA渠道，露营车、户外家具多品类协同开拓，以开启第二增长曲线。 投资建议： 浙江正特作为面向海外市场的户外龙头之一，大单品星空蓬 0-1的爆 品逻辑已线上得到验证， 拓展北美线下大型 KA门店后有望完成 1-100持续放量； 露营车及户外家具有望开启公司第二增长曲线。 预计公司 2026 -2028 年营收分 别为 21.30/26.11/31.04 亿元， 同比 +26.97%/ +22.60%/ +18.86% ；归母净利润 0.94/1.59/2.21 亿元，同比 +158.17%/ +69.89%/ +39.33% ；EPS为0.60/1.02/ 1.43 元/股，当前股价对应 PE分别为 42/25/18x。首次覆盖， 给予 “ 推荐” 评级。 风险提示： 1）欧美等海外消费不及预期风险； 2）原材料价格大幅上涨风险； 3） 汇率波动风险 ；4）核心产品销售不及预期风险 ；5）新品扩展不及预期风险 。 [Table_Forcast] 盈利预测与财务指标 项目/年度 2025A 2026E 2027E 2028E 营业收入（百万元） 1,677 2,130 2,611 3,104 增长率（ %） 35.6 27.0 22.6 18.9 归属母公司股东净利润（百万元） 36 94 159 221 增长率（ %） 359.1 158.2 69.9 39.3 每股收益（元） 0.23 0.60 1.02 1.43 PE (X) 108 42 25 18 PB (X) 3.5 3.3 2.9 2.6 资料来源： iFinD ，国联民生证券研究所预测；（注：股价为 2026 年8月7日收盘价） 推荐 首次评级 当前价格： 25.26 元 [Table_Author] 分析师 徐皓亮 执业 的预期。 也就是说，黄金4500美元之前，每一次紫金大于5%的回调，都至少是你正T的机会。 当然，8月12日公布的7月CPI，是下周真正的大考。市场预期总CPI同比约3.4% ，核心CPI 同比约2.5% 。核心CPI就是剔除食品和能源后的价格，更能反映服务和工资压力。6月总 CPI环比下降0.4%，主要靠能源降价；核心CPI环比持平、同比2.6%。 所以下周最值得看的数字是CPI核心环比：如果在0.2% 以内，服务价格也继续放慢，十年期 美债和美元就有机会回落，黄金、纳斯达克、恒生科技和A股成长都会更舒服；若达到 0.3%或更高，市场会重新担心二次通胀，高估值科技会先承压。 13日的PPI和14日的零售销售也重要，但它们更多是补充验证，主考题仍是CPI。 油价给这场通胀考试又加了一道题。美国与伊朗一度接近就霍尔木兹海峡达成临时安排， 随后伊朗又表示协议不足以立即重开航道，并拒绝在临时协议遭破坏时直接谈判；阿联酋 同时报告ADNOC 船只遭到导弹攻击。布伦特原油8月6日回到每桶82.49 美元。大家在这争 议伊朗到底会怎么样。 我的判断很明确：伊朗问题即将收官，只要以色列不参战，那么当下一切的噪音都是扰 动。美伊谈妥了，而且谈妥之后的美伊关系，可能会变化之快让中国人难以置信，这很有 可能是伊朗神权政府对外关系政策全面重大调整的一个开始。 我知道我说这个判断，很多人可能觉得不可思议。没关系，反正这个判断跟股票关系不 大，我们留在这里，不需要去争论什么，留给时间去验证。当有一天你看到一个亲美的伊 朗出现的时候，不要太惊讶就好。 再谈谈国内宏观。 7月国内数据最鲜明的特点，是外需和内需完全两种温度。 以美元计价，出口同比增长23.9% ，进口增长27.5% ，贸易顺差达到1125亿美元。高技术 产品出口增长40.7% ，集成电路出口接近翻倍，机械设备也保持高增长。外需、全球AI投资 和企业提前交货共同撑住了出口，说明中国制造在全球资本开支上行阶段仍有很强竞争 力。进口增长很快，其中也包含油价和上游原材料涨价的影响，不能直接理解成国内需求 全面回暖。 价格数据更明显，7月CPI环比下降0.1% 、同比上涨0.5% ，核心CPI同比上涨0.9%； 服务价 格环比上涨0.4% ，主要来自旅游、住宿和机票的季节性涨价。汽油价格环比下降10.7% ， 把居民端的总通胀压了下来。PPI是工业品出厂价格，7月环比下降0.7% 、同比上涨3.5% ， 其中生产资料上涨4.8%，生活资料仍下降0.8%。 说人话就是原油、化工、有色这些上游更容易涨价，消费品工厂还在降价抢市场。 传统行业和下游消费还是卷，卷死一个算一个。 上半年社会融资存量增长7.4% ，但新增社融20.84 万亿元，同比少2.02万亿元；流向实体企 业的人民币贷款同比少1.98万亿元，居民贷款减少3668 亿元。M2增长8%，M1只有4%。 M2可以大致理解成整个金融体系里的钱，M1更接近企业随时会拿来经营和投资的活钱。 现在的状态就是银行体系不缺钱，居民和企业借钱、花钱、扩张的意愿还不强。 这些数据对股市的影响很直接。 消费和地产链暂时缺少整体重估的基础。 不要看什么周末北京解除限购地产就能火热，老百姓差的是那一年社保吗？差的是买房的 收入。 还是要观察现在这些存量的房子收储、保民生收入之类的动作，还是关注存量怎么化解。 光让市场自行消化二手房市场，我觉得短期内可能比较难。 所以至于白酒、家电、消费、地产之类的还要等收入预期、渠道库存和销量出现更硬的改 善，我觉得这些都只能做右侧，左侧的机会不大，等后续看看有什么更硬的政策再说。 相反，我觉得贵州茅台之类的前一段时间如果有抄底了的可以兑现一些。 真正有新增需求的方向，仍集中在AI、高端制造、出口设备和创新药。指数可以涨，但很 难所有行业一起涨，选行业和选公司会比单纯押指数更重要。 再讲讲大盘。 本周A股的强度方向很明显，资金已经明显从银行、红利和消费这些防守方向，转回科技和 中小盘。 所谓“右侧修复”，说白了就是低点出现后，市场用上涨和成交量证明卖盘在减弱。7月下 旬急跌可以看成第一只脚，本周科技股重新走强，相当于第二只脚得到了确认。 周中通信链遇到外部政策利空，光模块一度大跌，但卖盘很快被接住；随后国产算力、半 导体设备和Rubin 相关方向接力。周五光模块龙头再度波动，也没有把全市场拖下水。个别 科技龙头下跌已经很难引发全盘恐慌，市场的状态确实变了。 这轮上涨也有隐患。 第一，股票ETF一周净流出约454亿元，股指期货仍有贴水，说明长期资金没有一起追高， 本周部分涨幅来自此前减仓资金和空头回补。 第二，电子和通信的机构持仓只从高位降了一部分，很多基金刚回到成本线。反弹越接近 前高，赎回和减仓压力越容易出来。 因此，大盘低点大概率 继续观察观察，大涨了就降点本。 最后讲个防守的另类小方向，光伏，这一波反内卷协议出来之后，通威股份这种硅料龙头 对整合是最有利的，当然不用想太多，就是个预期交易，跟做生猪是很像的，跌的时候慢 慢补，涨起来了就降本。 当时怎么做新希望的，现在就怎么做通威就行了。如果你新希望当时套了几根K就忍不住割 肉的，说明你性子急，这种网格走得慢的反转交易不适合你，那就别参与就行了。 做股票，说一千道一万，一定要选跟自己合财的。 最后就还是强调 同花顺 吧，其他的不会做非AI方向把这个方向做好我觉得是最简单的。 就说这么多，祝大家投资顺利。 申文冠 执业编号：A0670623050002 云南约牛软件技术有限公司 风险提示：投资有风险，入市需谨慎 内容未经同意严禁转载，违者追究法律责任", "status": "extracted"}, "post:2026-08-09T19-32:580ad259e68e": {"id": "post:2026-08-09T19-32:580ad259e68e", "kind": "post", "title": "2026-08-09 19:32", "source_label": "帖子正文", "excerpt": "#0809重磅#周期起点美国就业拐点叠加关键矿产战略升级，金银与战略小金属进入价值重估周期阶段 市场当前交易的主线已经十分清晰。一条来自宏观，美国就业持续降温，全球流动性预期重新定价，#黄金重新成为国际资金争抢配置的重要方向，白银凭借金融属性与工业属性双重优势，进入价格弹性释放阶段。", "content": "#0809重磅#周期起点美国就业拐点叠加关键矿产战略升级，金银与战略小金属进入价值重估周期阶段 市场当前交易的主线已经十分清晰。一条来自宏观，美国就业持续降温，全球流动性预期重新定价，#黄金重新成为国际资金争抢配置的重要方向，白银凭借金融属性与工业属性双重优势，进入价格弹性释放阶段。 另一条来自产业链。#特朗普召集全球大型矿业公司高管召开关键矿产会议，会议核心直指保障美国及盟友关键矿产供应安全。这一动作意味着，关键矿产已从普通资源品正式进入国家战略资源配置体系。稀土、钨、锑、钼等战略小金属，是导弹、航空发动机、战斗机、红外探测器、半导体装备、硬质合金及高端数控机床不可替代的核心材料，#全球资源竞争正进一步强化其战略价值。 #当前市场正在形成两条周期主线共振：黄金负责全球流动性定价，#战略小金属负责产业安全定价。两条逻辑共同推动资源板块进入价值重估阶段，资金关注点也正从单一贵金属逐步扩散至战略矿产全产业链。 重点关注方向#黄金：招金黄金、紫金矿业黄金价格上行直接受益标的，兼具资源价值与盈利兑现能力。#白银：盛达资源白银兼具避险资产与工业金属双重属性，价格弹性领先贵金属板块。#高弹...", "publish_time": "2026-08-09 19:32", "tags": ["黄金", "招金黄金、紫金矿业", "白银", "盛达资源", "高弹性", "浩通科技、晓程科技", "战略锑", "湖南黄金、华锡有色", "战略钼", "金钼股份", "文字观点"]}, "attachment:files/华创证券-【宏观专题】旧尺难刻新舟之金融指标思考：当存款搬家遇到弱债务增长-260807.pdf": {"id": "attachment:files/华创证券-【宏观专题】旧尺难刻新舟之金融指标思考：当存款搬家遇到弱债务增长-260807.pdf", "kind": "attachment", "title": "华创证券-【宏观专题】旧尺难刻新舟之金融指标思考：当存款搬家遇到弱债务增长-260807", "source_label": "华创证券", "excerpt": "本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明", "content": "本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 1 浙江正特（ 001238 .SZ）深度 报告 创新驱动，厚积薄发 glmszqdatemark 浙江正特：面向海外市场的户外龙头。 浙江正特创立于 1996 年，拥有 遮阳制品、 户外休闲家具 两大产品系列， 打造了MIRADOR 、ABBA PATIO 等自主品牌， 主攻跨境电商和沃尔玛、 Costco 等大型连锁渠道 。 其中 星空篷 等大单品 带动收入 增长， 虽地缘政治影响下 2023 年需求下降， 去库 不及预期 ，但2024年收入 迅速 回暖，2025 年持续增长， 其中 2025 年线下/线上收入分别同比 +41.6%/+12.3% 。 多因素共振，海外线下零售商转型正当时。 公共卫生事件和跨境电商兴起 彻底改 变了欧美零售业格局 ，我们将美国渠道分为 “边缘渠道” 和“灯塔渠道” 两部分： 一方面， 中美贸易摩擦 背景下 中小渠道式微， 边缘渠道 通过 OBM 转DDP 模式将 风险转移至供应链上游，同时利用店中店 模式引入新品类 ，以提升店效 ；另一方 面，传统选品模式下， 以Walmart 、Best Buy 为代表的大型零售商主要依赖买 手、供应商等线下渠道 选品。而近年来灯塔渠道加速布局自有线上平台，选品路 径上开始更多 依赖于 第三方电商平台发掘 热销商品并在自身线上渠道 进行试销， 后再将高销量商品 推向线下门店。主流零售仍以线下为主，但 选品模式的变化为 企业打通了一条通往线下渠道的路径， 线上畅销能力、供应链综合管理成为中国 出口企业进入线下核心渠道的必备条件，浙江正特的星空篷产品即为典型代表。 创新引领爆款周期叠加线下渠道红利，业务进入成长快车道 。公司坚持 “正道追 求，特异创新 ”，在上海、深圳、美国、荷兰设立研发中心 ，内部研发与外部战 略咨询双轮驱动 ， 星空篷、 Novara 吊伞等产品 获得红点奖。 公司特有的专利和持 续创新构筑强产品护城河， 爆品战略（好看、好用、高价值）推动品牌从制造型 向产品型、品牌型升级 ，并持续迭代 以保持产品优势。 生产端，临海、顺德晴天 和印尼基地 全球供应链协同 ，通过数字化生产降本增效。厚积薄发， 2023 -2025 年Mirador 星空篷位列全球户外廊架销量第一， 2025 全年星空蓬占总营收达 50%+ 。未来，公司还将 聚焦于渠道深度铺设和户外品类拓展 ，包括入驻 Costco 等北美线下 KA渠道，露营车、户外家具多品类协同开拓，以开启第二增长曲线。 投资建议： 浙江正特作为面向海外市场的户外龙头之一，大单品星空蓬 0-1的爆 品逻辑已线上得到验证， 拓展北美线下大型 KA门店后有望完成 1-100持续放量； 露营车及户外家具有望开启公司第二增长曲线。 预计公司 2026 -2028 年营收分 别为 21.30/26.11/31.04 亿元， 同比 +26.97%/ +22.60%/ +18.86% ；归母净利润 0.94/1.59/2.21 亿元，同比 +158.17%/ +69.89%/ +39.33% ；EPS为0.60/1.02/ 1.43 元/股，当前股价对应 PE分别为 42/25/18x。首次覆盖， 给予 “ 推荐” 评级。 风险提示： 1）欧美等海外消费不及预期风险； 2）原材料价格大幅上涨风险； 3） 汇率波动风险 ；4）核心产品销售不及预期风险 ；5）新品扩展不及预期风险 。 [Table_Forcast] 盈利预测与财务指标 项目/年度 2025A 2026E 2027E 2028E 营业收入（百万元） 1,677 2,130 2,611 3,104 增长率（ %） 35.6 27.0 22.6 18.9 归属母公司股东净利润（百万元） 36 94 159 221 增长率（ %） 359.1 158.2 69.9 39.3 每股收益（元） 0.23 0.60 1.02 1.43 PE (X) 108 42 25 18 PB (X) 3.5 3.3 2.9 2.6 资料来源： iFinD ，国联民生证券研究所预测；（注：股价为 2026 年8月7日收盘价） 推荐 首次评级 当前价格： 25.26 元 [Table_Author] 分析师 徐皓亮 执业证书： S0590525120007 邮箱： xuhaoliang@glms.com.cn 分析师 童苇航 执业证书： S0590526070011 邮箱： tongwh@glms.com.cn 相对走势 -30%-7%17%40% 2025/8 2026/2 2026/8浙江正特 沪深300 2026 年 08 月 08 日 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 2 浙江正特 (001238.SZ )/轻工及中小盘 投资聚焦 1）大单品驱动增长，渠道深化： 公司战略爆品“星空篷”凭借差异化设计和 强产品力， 线上市占率已处于领先地位， 未来也将持续替代传统木质廊架， 大单品 星空蓬的爆品逻辑已线上得到验证，拓展北美线下大型 KA门店后有望持续放量； 2）新品类拓展，贡献未来增量： 公司在户外场景领域进行了品类拓展，推出 了露营车、户外家具套组等新品，已获得渠道和消费者积极反馈，并成功进入 Walmart 等线下渠道，有望开启公司第二增长曲线。 核心假设 1）收入端：①遮阳制品： 截至 2025 年，公司星空蓬已进入北美 Costco 多 家线下门店， 并上线 Costco 及Sam ’s Club 电商平台， 预计产品将实现高速增长， 2026 -2028 年遮阳制品收入同比增速为 +25.00%/+20.00%/+16.00% ；②户外休 闲家具： 公司加速拓展户外场景，推出储物、户外家具、露营车等多个品类，露营 车已进入 Walmart 多家线下门店，预计户外休闲家具也将在未来持续放量，假设 2026 -2028 年收入同比增速为 +60.00%/+50.00 %/+40.00 %；③其他业务： 假设 2026 -2028 年收入同比增速为 +20.00%/+20.00%/+20.00% 。 2）毛利率： 分业务来看， ①遮阳制品： 预计随着星空篷等大单品持续放量， 规模效应下毛利率将有所提升， 因此我们假设 2026 -2028 年遮阳制品毛利率分别 为28.70%/28.90%/29.10% ；②户外休闲家具： 预计未来公司将持续拓展户外休 闲家具新品并不断扩大规模， 假设新品导入和规模效应 带动毛利率持续改善， 因此 我们假设 2026 -2028 年户外休闲家具毛利率分别为 18.00%/19.00%/20.00% ； ③其他业务： 我们假设 2026 -2028 年其他业务毛利率维持稳定，分别为 3.00%/3.00%/3.00% 。综上，我们预测 2026 -2028 年公司毛利率有望达到 25.67%/25.78%/25.85% 。 近期催化 浙江正特作为面向海外市场的户外行业龙头，凭借星空篷大单品率先实现从 线上验证到北美线下核心 KA渠道的放量突破，有望开启 “1到100”高速扩张。 公司多品类快速拓展，露营车、户外家具打开第二增长曲线，战略主线清晰，创新 动力与全球化渠道能力兼备。渠道、产品、供应链共振下，公司 有望步入利润快速 修复与业绩高增阶段。 从股价来看， 近期地缘冲突下出口链整体估值处于低位， 若 地缘因素缓解 ，出口链估值有望回升。 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 3 浙江正特 (001238.SZ )/轻工及中小盘 目录 1 浙江正特：面向海外市场的户外龙头 ................................ ................................ ................................ ........................ 4 2 多因素共振，海外零售商转型正当时 ................................ ................................ ................................ ........................ 9 3 创新驱动：品正质优，特异求新 ................................ ................................ ................................ ............................ 13 3.1 以“品正质优 ”为核心， 内外设计网络并进 ................................ ................................ ................................ ................................ 13 3.2 “好看、好用、高价值 ”打造极致产品 ................................ ................................ ................................ ................................ ............ 15 3.3 全球供应链协同，数字化生产降本增效 ................................ ................................ ................................ ................................ ...... 16 4 厚积薄发：廊架升级，星空蓬热销 ................................ ................................ ................................ ........................ 19 5 高瞻远瞩：户外场景拓展，发展空间可期 ................................ ........... 成临时安排， 随后伊朗又表示协议不足以立即重开航道，并拒绝在临时协议遭破坏时直接谈判；阿联酋 同时报告ADNOC 船只遭到导弹攻击。布伦特原油8月6日回到每桶82.49 美元。大家在这争 议伊朗到底会怎么样。 我的判断很明确：伊朗问题即将收官，只要以色列不参战，那么当下一切的噪音都是扰 动。美伊谈妥了，而且谈妥之后的美伊关系，可能会变化之快让中国人难以置信，这很有 可能是伊朗神权政府对外关系政策全面重大调整的一个开始。 我知道我说这个判断，很多人可能觉得不可思议。没关系，反正这个判断跟股票关系不 大，我们留在这里，不需要去争论什么，留给时间去验证。当有一天你看到一个亲美的伊 朗出现的时候，不要太惊讶就好。 再谈谈国内宏观。 7月国内数据最鲜明的特点，是外需和内需完全两种温度。 以美元计价，出口同比增长23.9% ，进口增长27.5% ，贸易顺差达到1125亿美元。高技术 产品出口增长40.7% ，集成电路出口接近翻倍，机械设备也保持高增长。外需、全球AI投资 和企业提前交货共同撑住了出口，说明中国制造在全球资本开支上行阶段仍有很强竞争 力。进口增长很快，其中也包含油价和上游原材料涨价的影响，不能直接理解成国内需求 全面回暖。 价格数据更明显，7月CPI环比下降0.1% 、同比上涨0.5% ，核心CPI同比上涨0.9%； 服务价 格环比上涨0.4% ，主要来自旅游、住宿和机票的季节性涨价。汽油价格环比下降10.7% ， 把居民端的总通胀压了下来。PPI是工业品出厂价格，7月环比下降0.7% 、同比上涨3.5% ， 其中生产资料上涨4.8%，生活资料仍下降0.8%。 说人话就是原油、化工、有色这些上游更容易涨价，消费品工厂还在降价抢市场。 传统行业和下游消费还是卷，卷死一个算一个。 上半年社会融资存量增长7.4% ，但新增社融20.84 万亿元，同比少2.02万亿元；流向实体企 业的人民币贷款同比少1.98万亿元，居民贷款减少3668 亿元。M2增长8%，M1只有4%。 M2可以大致理解成整个金融体系里的钱，M1更接近企业随时会拿来经营和投资的活钱。 现在的状态就是银行体系不缺钱，居民和企业借钱、花钱、扩张的意愿还不强。 这些数据对股市的影响很直接。 消费和地产链暂时缺少整体重估的基础。 不要看什么周末北京解除限购地产就能火热，老百姓差的是那一年社保吗？差的是买房的 收入。 还是要观察现在这些存量的房子收储、保民生收入之类的动作，还是关注存量怎么化解。 光让市场自行消化二手房市场，我觉得短期内可能比较难。 所以至于白酒、家电、消费、地产之类的还要等收入预期、渠道库存和销量出现更硬的改 善，我觉得这些都只能做右侧，左侧的机会不大，等后续看看有什么更硬的政策再说。 相反，我觉得贵州茅台之类的前一段时间如果有抄底了的可以兑现一些。 真正有新增需求的方向，仍集中在AI、高端制造、出口设备和创新药。指数可以涨，但很 难所有行业一起涨，选行业和选公司会比单纯押指数更重要。 再讲讲大盘。 本周A股的强度方向很明显，资金已经明显从银行、红利和消费这些防守方向，转回科技和 中小盘。 所谓“右侧修复”，说白了就是低点出现后，市场用上涨和成交量证明卖盘在减弱。7月下 旬急跌可以看成第一只脚，本周科技股重新走强，相当于第二只脚得到了确认。 周中通信链遇到外部政策利空，光模块一度大跌，但卖盘很快被接住；随后国产算力、半 导体设备和Rubin 相关方向接力。周五光模块龙头再度波动，也没有把全市场拖下水。个别 科技龙头下跌已经很难引发全盘恐慌，市场的状态确实变了。 这轮上涨也有隐患。 第一，股票ETF一周净流出约454亿元，股指期货仍有贴水，说明长期资金没有一起追高， 本周部分涨幅来自此前减仓资金和空头回补。 第二，电子和通信的机构持仓只从高位降了一部分，很多基金刚回到成本线。反弹越接近 前高，赎回和减仓压力越容易出来。 因此，大盘低点大概率形成了，科技筹码还没有完全清干净，后面很可能通过一次回踩或 一段横盘重新换手。 估值也决定了下一段行情会更挑公司。 上证指数过去12个月市盈率约16.8倍，处在自身偏高位置；沪深300约14.4倍，也谈不上便 宜。创业板约45倍，看起来更高，但放在自己的历史里反而没有主板那么贵，因为过去两 年股价跌得多、盈利也在增长。只要盈利预测继续上调，成长相对红利仍有优势；如果利 润跟不上，只靠估值往上抬，很快就会遇到天花板。市场接下来会从“谁跌得多”切换到 “谁的订单能兑现、毛利率能改善、盈利预测还能上调”。 眼下是超跌修复，市场重新愿意给基本面定价，但接下来如果到了3900-4000 这个筹码密 集区大概率还会有一次回踩，而那一次的回踩也不会破3750的前低。 现在可以参与修复，也要在涨了多了之后，在小级别上积极降本，给第二阶段的回踩留出 仓位。 下周基准情景是高位震荡，成长仍占优，盘中波动会放大。若美国核心CPI环比在0.2% 以 内、十年期美债回落，科创50、创业板和恒生科技还有继续补涨的条件；如果核心CPI达到 0.3% 或更高，油价和美债利率又同时上行，本周涨幅最大、利润兑现最远的科技股会先承 压，银行和高股息可能短暂回流。 简单讲，只要上证没有重新跌破3750 ，科技龙头没有集体放量破位，成交额也没有明显塌 下来，回调仍按反转右侧行情处理。若这三项同时走坏，就要把之前的反转判断降级成一 次反弹。 最后谈一谈板块。 我一直讲的一句话，AI的中期逻辑仍然成立，但早已经过了名字里有AI就能涨的阶段。 现在我看一家公司，至少要问三个问题：订单能不能证明需求是真的，毛利率能不能说明 公司有议价权，经营现金流能不能证明利润已经收回来。三项都有验证的做核心仓；订单 正在兑现、利润弹性较大的做弹性仓；商业模式和收入还需要时间验证的，只放在短线里 给同学们推荐。 国产算力仍是我们的第一优先级，产业顺序可以理解为晶圆制造先扩产，AI芯片随后放 量，半导体设备再跟着接订单。 我觉得下周中芯国际港股/华虹很有可能表现一下。半导体设备应该也会挺强的，北方华 创、中科飞测 没权限的直接 半导体设备E TF就行了。 然后寒武纪的中报，上半年收入59.96 亿元、净利润23.11 亿元，业绩很强；同时存货达到 82.48 亿元，较年初增长66.83% ，预付款增长291.37% ，经营现金流只有3.11亿元。备货 增加说明公司在为交付做准备，不要以为寒武纪暴雷了，实际上是2季度因为HBM 的货不 够，延期到3季度去交，股价已经提前跌过了，现金都拿来备这么多货，恰恰说明公司对下 半年订单的需求是非常乐观，实际上字节下订单也确实很狠。 买寒武纪=买字节跳动算力。你每天用不用豆包？想明白就很简单，如果周一韭菜比较多， 寒武纪给低开的机会，可以考虑果断加仓。 阿里巴巴当然没得说，最新一季云业务外部收入增长40%，AI相关产品收入连续11个季度 保持三位数增长，已经占云外部收入的30%。它既能受益于算力投入，也能直接看到AI应 用收入，未来收入和利润比纯概念公司更容易估。补充材料按电商、云业务和净现金分开 估值。苹果也没什么问题。 通富预计上半年净利润16亿—18 亿元，同比增长288%—337% ，剔除一次性因素后的利润 增长66%—90%， 立讯做过ppt了，耐心按ppt来拿就行了。 海外算力链因为FCC的事情，所以资金从光模块里撤退，选择去打了PCB，所以胜宏科技被 打起来了，我的理解是反正现在海外这边都差不多，过两天PCB美国再给你来一刀你咋办？ 你只能是快进快出，跌多了捞点，涨了就卖。 没办法，谁让你卖给美国人，美国人卡你脖子你有什么办法。 至于涨价链条什么中国巨石、兴森、生益这种超跌反弹的海外链你想做就去做，我只想说 一句，就是这些回到前高都几乎不可能，你要想搞你就奔着超跌反弹做个短线的思路去。 存储板块整体都很贵，不想讲了。兆易创新之类从一年的维度看肯定是没跌透的，模组厂 更是狗都不看。 然后创新药这边反正就那些东西，药明康德是我这一轮最看好的，药明康德上半年收入 288.9 亿元，同比增长38.9% ，调整后利润115.7 亿元，同比增长83.2% ，公司还上调了全 年指引。在手订单、利润率和现金流都有支撑，继续做医药核心，事实证明也是走的最强 的，你要不想选股就选全天候里的那个 创新药etf ，反正我全天候一直拿着呢。 防守这边，还是紫金矿业，想搞铜的就洛阳钼业，然后锡矿也涨了，可以回头搞厦门钨 业，反正搓一搓都没毛病。紫金肯定没涨完，我会盯着的，卖的时候书院会说。 阿里、紫金、沪深300、科创50，这四个我都会讲。 然后储能这边我看宁德走的还比较稳定的话你可以考虑做个湖南裕能的超跌反弹，给点肉 就可以跑的那种。券商这边我觉得 同花顺 走的还不错，继续观察观察，大涨了就降点本。 最后讲个防守的另类小方向，光伏，这一波反内卷协议出来之后，通威股份这种硅料龙头 对整合是最有利的，当然不用想太多，就是个预期交易，跟做生猪是很像的，跌的时候慢 慢补，涨起来了就降本。 当时怎么做新希望的，现在就怎么做通威就行了。如果你新希望当时套了几根K就忍不住割 肉的，说明你性子急，这种网格走得慢的反转交易不适合你，那就别参与就行了。 做股票，说一千道一万，一定要选跟自己合财的。 最后就还是强调 同花顺 吧，其他的不会做非AI方向把这个方向做好我觉得是最简单的。 就说这么多，祝大家投资顺利。 申文冠 执业编号：A0670623050002 云南约牛软件技术有限公司 风险提示：投资有风险，入市需谨慎 内容未经同意严禁转载，违者追究法律责任", "status": "extracted"}, 户外廊架销量第一， 2025 全年星空蓬占总营收达 50%+ 。未来，公司还将 聚焦于渠道深度铺设和户外品类拓展 ，包括入驻 Costco 等北美线下 KA渠道，露营车、户外家具多品类协同开拓，以开启第二增长曲线。 投资建议： 浙江正特作为面向海外市场的户外龙头之一，大单品星空蓬 0-1的爆 品逻辑已线上得到验证， 拓展北美线下大型 KA门店后有望完成 1-100持续放量； 露营车及户外家具有望开启公司第二增长曲线。 预计公司 2026 -2028 年营收分 别为 21.30/26.11/31.04 亿元， 同比 +26.97%/ +22.60%/ +18.86% ；归母净利润 0.94/1.59/2.21 亿元，同比 +158.17%/ +69.89%/ +39.33% ；EPS为0.60/1.02/ 1.43 元/股，当前股价对应 PE分别为 42/25/18x。首次覆盖， 给予 “ 推荐” 评级。 风险提示： 1）欧美等海外消费不及预期风险； 2）原材料价格大幅上涨风险； 3） 汇率波动风险 ；4）核心产品销售不及预期风险 ；5）新品扩展不及预期风险 。 [Table_Forcast] 盈利预测与财务指标 项目/年度 2025A 2026E 2027E 2028E 营业收入（百万元） 1,677 2,130 2,611 3,104 增长率（ %） 35.6 27.0 22.6 18.9 归属母公司股东净利润（百万元） 36 94 159 221 增长率（ %） 359.1 158.2 69.9 39.3 每股收益（元） 0.23 0.60 1.02 1.43 PE (X) 108 42 25 18 PB (X) 3.5 3.3 2.9 2.6 资料来源： iFinD ，国联民生证券研究所预测；（注：股价为 2026 年8月7日收盘价） 推荐 首次评级 当前价格： 25.26 元 [Table_Author] 分析师 徐皓亮 执业证书： S0590525120007 邮箱： xuhaoliang@glms.com.cn 分析师 童苇航 执业证书： S0590526070011 邮箱： tongwh@glms.com.cn 相对走势 -30%-7%17%40% 2025/8 2026/2 2026/8浙江正特 沪深300 2026 年 08 月 08 日 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 2 浙江正特 (001238.SZ )/轻工及中小盘 投资聚焦 1）大单品驱动增长，渠道深化： 公司战略爆品“星空篷”凭借差异化设计和 强产品力， 线上市占率已处于领先地位， 未来也将持续替代传统木质廊架， 大单品 星空蓬的爆品逻辑已线上得到验证，拓展北美线下大型 KA门店后有望持续放量； 2）新品类拓展，贡献未来增量： 公司在户外场景领域进行了品类拓展，推出 了露营车、户外家具套组等新品，已获得渠道和消费者积极反馈，并成功进入 Walmart 等线下渠道，有望开启公司第二增长曲线。 核心假设 1）收入端：①遮阳制品： 截至 2025 年，公司星空蓬已进入北美 Costco 多 家线下门店， 并上线 Costco 及Sam ’s Club 电商平台， 预计产品将实现高速增长， 2026 -2028 年遮阳制品收入同比增速为 +25.00%/+20.00%/+16.00% ；②户外休 闲家具： 公司加速拓展户外场景，推出储物、户外家具、露营车等多个品类，露营 车已进入 Walmart 多家线下门店，预计户外休闲家具也将在未来持续放量，假设 2026 -2028 年收入同比增速为 +60.00%/+50.00 %/+40.00 %；③其他业务： 假设 2026 -2028 年收入同比增速为 +20.00%/+20.00%/+20.00% 。 2）毛利率： 分业务来看， ①遮阳制品： 预计随着星空篷等大单品持续放量， 规模效应下毛利率将有所提升， 因此我们假设 2026 -2028 年遮阳制品毛利率分别 为28.70%/28.90%/29.10% ；②户外休闲家具： 预计未来公司将持续拓展户外休 闲家具新品并不断扩大规模， 假设新品导入和规模效应 带动毛利率持续改善， 因此 我们假设 2026 -2028 年户外休闲家具毛利率分别为 18.00%/19.00%/20.00% ； ③其他业务： 我们假设 2026 -2028 年其他业务毛利率维持稳定，分别为 3.00%/3.00%/3.00% 。综上，我们预测 2026 -2028 年公司毛利率有望达到 25.67%/25.78%/25.85% 。 近期催化 浙江正特作为面向海外市场的户外行业龙头，凭借星空篷大单品率先实现从 线上验证 元气大伤， 其渠道结构发生较大变化 。新冠疫情对欧美 线下零售业造成了毁灭性冲击： 社交距离要求导致实体店客流量断崖式下跌 ， 美国 2020年3月零售销售额环比 下跌 8.7% ，创 1992 年以来最大跌幅，其中服装零 售骤降 50.5% ，百货商店下滑 19.7% ；供应链中断和运营成本激增 迫使大量门店 关闭， Bed Bath & Beyond 等品牌已转型纯线上运营； 消费者行为结构性转变 加 速向线上迁移。 这场危机不仅造成短期经营瘫痪， 更永久改变了零售生态格局。 大 型零售商展现出更强的抗风险能力和修复速度： 头部企业通过供应链优化和渠道 重构， 库存周转率变化相对较小， 如 Costco 维持 30天左右高周转效率， 2020 年 库存周转率 12.26% ，相比 2025 年13.05% 变化不大 ；然而中小企业面临结构性 淘汰压力 。 图11：美国零售商库销比变化 表2：2020 -2025年美国零售业变化 2020~2025 年美国零售业变化 2020 疫情初期，供应链中断和消费模式剧变导致周转率普遍下降。特 别是百货业态受冲击严重。但必选消费品 (超市)和电商表现相对 稳健。 2021 在财政刺激下消费反弹，但供应链持续紊乱导致库存积压，周转 率进一步承压。特别是家居、电子等品类库存高企。 2022 高通胀抑制消费，零售商开启主动去库存，家得宝等专业零售商 周转率降至 5.2左右。 2023 去库存见效，头部企业周转率开始修复。家得宝周转率回升至 9.3% ，Costco 维持 30天的高周转效率。 2024 补库周期开启，周转率继续改善。服饰等品类库销比回归健康水 平(2.3左右)，头部企业优化供应链带动效率提升。 2025 2025 年1月库销比达到阶段性峰值。 4月2日对等关税落地， 面对中美地缘政治不确定性， 4-5月出口订单出现回调，此后零 售商调整订单节奏，减弱补库动作维持较低库销比 。 资料来源： iFinD ，国联民生证券研究所 资料来源： Wind ，国联民生证券研究所 多因素共振， 灯塔渠道与边缘渠道经营战略出现分化： 一方面， 中美贸易摩擦 背景下边缘渠道式微，后排零售商持续关店， 中小渠道通过 DDP 模式或者 OBM 模式将风险转移至供应链上游， 同时利用店中店模式低风险、 轻资产引入新品类， 如匠心家居利用店中店 MOTO Gallery 与美国中小零售商建立合作； 另一方面， 灯塔渠道如 Walmart 、BestBuy 开始布局线上电商， 主要系 2022 -2023 年疫情 影响下其选品模式也出现变化， 以前通过买手选品， 现在通过亚马逊等线上渠道选 品后，先推到自己的线上渠道，再推向线下渠道。 0.91.01.11.21.31.41.51.61.71.8 1992-12 1995-01 1997-02 1999-03 2001-04 2003-05 2005-06 2007-07 2009-08 2011-09 2013-10 2015-11 2017-12 2020-01 2022-02 2024-03 2026-04 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 10 浙江正特 (001238.SZ )/轻工及中小盘 图12：美国灯塔渠道和边缘渠道经营战略分化 资料来源：国联民生证券研究所整理 表3：关税等多因素共振，后排零售商持续关店 资料来源：今日家居，国联民生证券研究所 表4：2016 -2025 年美国零售商净利率变化 资料来源： iFinD ，国联民生证券研究所 头部企业加速供应链重构，将采购地从中国转移至越南、印度等地。 例如，家 得宝为降低关税成本， 采购业务逐渐往北美集中， 且沃尔玛历来对中国供应商具有 强大的议价能力， 降价要求大多得到满足。 然而中小零售商受限于资金规模、 议价 能力不足和供应链识别难度， 转移速度明显滞后， 导致其主要依靠传统中国供应链 体系，形成 \"大企业加速转移、小企业被动依赖 \"的分化态势。 海外渠道大变局 灯塔渠道边缘渠道 产品迭代速度弱于线上，线 下受线上冲击明显DDP模式风险转移至上游 店中店模式轻资产引入新品 全渠道融合成为重点，北美 线下零售商招商加速 2024年 2023年 同比（%） 2024年 2023年 同比（%） TOP100家具店 51.6 56.1 -8.0% 9108 11517 -20.9% TOP10家具店 28.2 29.4 -4.1% 4488 4542 -1.2% TOP100家具店中的传统家具店 25.7 28.5 -9.8% 2975 4042 -26.4% TOP100家具店中的专卖店 26 27.6 -5.8% 613 大单品 带动收入 增长， 虽地缘政治影响下 2023 年需求下降， 去库 不及预期 ，但2024年收入 迅速 回暖，2025 年持续增长， 其中 2025 年线下/线上收入分别同比 +41.6%/+12.3% 。 多因素共振，海外线下零售商转型正当时。 公共卫生事件和跨境电商兴起 彻底改 变了欧美零售业格局 ，我们将美国渠道分为 “边缘渠道” 和“灯塔渠道” 两部分： 一方面， 中美贸易摩擦 背景下 中小渠道式微， 边缘渠道 通过 OBM 转DDP 模式将 风险转移至供应链上游，同时利用店中店 模式引入新品类 ，以提升店效 ；另一方 面，传统选品模式下， 以Walmart 、Best Buy 为代表的大型零售商主要依赖买 手、供应商等线下渠道 选品。而近年来灯塔渠道加速布局自有线上平台，选品路 径上开始更多 依赖于 第三方电商平台发掘 热销商品并在自身线上渠道 进行试销， 后再将高销量商品 推向线下门店。主流零售仍以线下为主，但 选品模式的变化为 企业打通了一条通往线下渠道的路径， 线上畅销能力、供应链综合管理成为中国 出口企业进入线下核心渠道的必备条件，浙江正特的星空篷产品即为典型代表。 创新引领爆款周期叠加线下渠道红利，业务进入成长快车道 。公司坚持 “正道追 求，特异创新 ”，在上海、深圳、美国、荷兰设立研发中心 ，内部研发与外部战 略咨询双轮驱动 ， 星空篷、 Novara 吊伞等产品 获得红点奖。 公司特有的专利和持 续创新构筑强产品护城河， 爆品战略（好看、好用、高价值）推动品牌从制造型 向产品型、品牌型升级 ，并持续迭代 以保持产品优势。 生产端，临海、顺德晴天 和印尼基地 全球供应链协同 ，通过数字化生产降本增效。厚积薄发， 2023 -2025 年Mirador 星空篷位列全球户外廊架销量第一， 2025 全年星空蓬占总营收达 50%+ 。未来，公司还将 聚焦于渠道深度铺设和户外品类拓展 ，包括入驻 Costco 等北美线下 KA渠道，露营车、户外家具多品类协同开拓，以开启第二增长曲线。 投资建议： 浙江正特作为面向海外市场的户外龙头之一，大单品星空蓬 0-1的爆 品逻辑已线上得到验证， 拓展北美线下大型 KA门店后有望完成 1-100持续放量； 露营车及户外家具有望开启公司第二增长曲线。 预计公司 2026 -2028 年营收分 别为 21.30/26.11/31.04 亿元， 同比 +26.97%/ +22.60%/ +18.86% ；归母净利润 0.94/1.59/2.21 亿元，同比 +158.17%/ +69.89%/ +39.33% ；EPS为0.60/1.02/ 1.43 元/股，当前股价对应 PE分别为 42/25/18x。首次覆盖， 给予 “ 推荐” 评级。 风险提示： 1）欧美等海外消费不及预期风险； 2）原材料价格大幅上涨风险； 3） 汇率波动风险 ；4）核心产品销售不及预期风险 ；5）新品扩展不及预期风险 。 [Table_Forcast] 盈利预测与财务指标 项目/年度 2025A 2026E 2027E 2028E 营业收入（百万元） 1,677 2,130 2,611 3,104 增长率（ %） 35.6 27.0 22.6 18.9 归属母公司股东净利润（百万元） 36 94 159 221 增长率（ %） 359.1 158.2 69.9 39.3 每股收益（元） 0.23 0.60 1.02 1.43 PE (X) 108 42 25 18 PB (X) 3.5 3.3 2.9 2.6 资料来源： iFinD ，国联民生证券研究所预测；（注：股价为 2026 年8月7日收盘价） 推荐 首次评级 当前价格： 25.26 元 [Table_Author] 分析师 徐皓亮 执业证书： S0590525120007 邮箱： xuhaoliang@glms.com.cn 分析师 童苇航 执业证书： S0590526070011 邮箱： tongwh@glms.com.cn 相对走势 -30%-7%17%40% 2025/8 2026/2 2026/8浙江正特 沪深300 2026 年 08 月 08 日 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 2 浙江正特 (001238.SZ )/轻工及中小盘 投资聚焦 1）大单品驱动增长，渠道深化： 公司战略爆品“星空篷”凭借差异化设计和 强产品力， 线上市占率已处于领先地位， 未来也将持续替代传统木质廊架， 大单品 星空蓬的爆品逻辑已线上得到验证，拓展北美线下大型 KA门店后有望持续放量； 2）新品类拓展，贡献未来增量： 公司在户外场景领域进行了品类拓展，推出 了露营车、户外家具套组等新品，已获得渠道和消费者积极反馈，并成功进入 Walmart 等线下渠道，有望开启公司第二增长曲线。 核心假设 1）收入端：①遮阳制品： 截至 2025 年，公司星空蓬已进入北美 Costco 多 家线下门店， 并上线 Costco 及Sam ’s Club 电商平台， 预计产品将实现高速增长， 2026 -2028 年遮阳制品收入同比增速为 +25.00%/+20.00%/+16.00% ；②户外休 闲家具： 公司加速拓展户外场景，推出储物、户外家具、露营车等多个品类，露营 车已进入 Walmart 多家线下门店，预计户外休闲家具也将在未来持续放量，假设 2026 -2028 年收入同比增速为 +60.00%/+50.00 %/+40.00 %；③其他业务： 假设 2026 -2028 年收入同比增速为 +20.00%/+20.00%/+20.00% 。 2）毛利率： 分业务来看， ①遮阳制品： 预计随着星空篷等大单品持续放量， 规模效应下毛利率将有所提升， 因此我们假设 2026 -2028 年遮阳制品毛利率分别 为28.70%/28.90%/29.10% ；②户外休闲家具： 预计未来公司将持续拓展户外休 闲家具新品并不断扩大规模， 假设新品导入和规模效应 带动毛利率持续改善， 因此 我们假设 2026 -2028 年户外休闲家具毛利率分别为 18.00%/19.00%/20.00% ； ③其他业务： 我们假设 2026 -2028 年其他业务毛利率维持稳定，分别为 3.00%/3.00%/3.00% 。综上，我们预测 2026 -2028 年公司毛利率有望达到 25.67%/25.78%/25.85% 。 近期催化 浙江正特作为面向海外市场的户外行业龙头，凭借星空篷大单品率先实现从 线上验证到北美线下核心 KA渠道的放量突破，有望开启 “1到100”高速扩张。 公司多品类快速拓展，露营车、户外家具打开第二增长曲线，战略主线清晰，创新 动力与全球化渠道能力兼备。渠道、产品、供应链共振下，公司 有望步入利润快速 修复与业绩高增阶段。 从股价来看， 近期地缘冲突下出口链整体估值处于低位， 若 地缘因素缓解 ，出口链估值有望回升。 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 3 浙江正特 (001238.SZ )/轻工及中小盘 目录 1 浙江正特：面向海外市场的户外龙头 ................................ ................................ ................................ ........................ 4 2 多因素共振，海外零售商转型正当时 ................................ ................................ ................................ ........................ 9 3 创新驱动：品正质优，特异求新 ................................ ................................ ................................ ............................ 13 3.1 以“品正质优 ”为核心， 内外设计网络并进 ................................ ................................ ................................ ................................ 13 3.2 “好看、好用、高价值 ”打造极致产品 ................................ ................................ ................................ ................................ ............ 15 3.3 全球供应链协同，数字化生产降本增效 ................................ ................................ ................................ ................................ ...... 16 4 厚积薄发：廊架升级，星空蓬热销 ................................ ...... 头地位，受益于高功率 机型渗透率提升，业务稳步增长；在泛半导体领域，公司布局光刻、退火、先进 封装等环节的核心光学器件，依托国产替代趋势逐步实现突破；汽车激光雷达、 医疗美容等业务也凭借技术优势， 业务有所突破 。 投资建议： 我们预计公司 2026/2027/2028 年归母净利润分别为 0.21亿元、 2.23 亿元、 5.35亿元，对应 2026/2027/2028 年PE分别为 1320x、122x、51x。考 虑到公司在微纳光学领域的稀缺性、新兴业务放量节奏，首次覆盖，给予“推荐” 评级。 风险提示： 技术与产品迭代及量产风险、海外标的资产经营拖累风险、大客户依 赖风险。 [Table_Forcast] 盈利预测与财务指标 项目/年度 2025A 2026E 2027E 2028E 营业收入（百万元） 880 1,364 1,991 2,750 增长率（ %） 41.9 55.0 45.9 38.1 归属母公司股东净利润（百万元） -38 21 223 535 增长率（ %） 78.0 153.5 985.6 139.9 每股收益（元） -0.30 0.16 1.71 4.11 PE (X) / 1320 122 51 PB (X) 12.2 12.3 11.2 9.1 资料来源： Wind，国联民生证券研究所预测；（注：股价为 2026年08月5日收盘价） 推荐 首次评级 当前价格： 208.35元 [Table_Author] 分析师 张宁 执业证书： S0590523120003 邮箱： zhangnyj@glms.com.cn 分析师 薛宏伟 执业证书： S0590526060002 邮箱： xuehongwei@glms.com.cn 分析师 袁妲 执业证书： S0590525110053 邮箱： yuanda@glms.com.cn 分析师 范宇 执业证书： S0590525110074 邮箱： fanyu@glms.com.cn 相对走势 -10%160%330%500% 2025/8 2026/2 2026/8炬光科技 沪深300 2026 年 08 月 08 日 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 2 炬光科技 (688167.SH )/通信、电子 投资聚焦 研究背景 全球 AI算力集群向 1.6T/3.2T 高速演进， CPO、OCS、NPO等新技术路线 加速落地，高端光互联对纳米级微纳光学需求 快速增长 。同时消费电子 AR/VR、 先进半导体制程、 汽车智能照明多赛道同步高增， 光子调控成为跨领域核心共性技 术。市场对炬光科技 “全球光子平台 ”定位、跨赛道技术复用壁垒及海外大客户认证 价值认知不足，本报告深度拆解技术壁垒、全球化卡位与多场景兑现逻辑。 区别于市场的观点 /方法 定义公司为全球稀缺的 “微纳光学 +高功率激光 ”全链条光子平台，聚焦 “技术 壁垒+大客户绑定 +产能”等维度，分析各赛道成长性与价值空间。 近期催化 AI集群可插拔光模块 1.6T升级、CPO、NPO等带动 FAU CPO V型槽、微 透镜阵列需求快速增长 且产品升级 ，公司客户进展较多 ；消费电子 WLO光学元件 有望突破 ；2025年光通信收入同比 +134.49% 、消费电子 +1028.51% ，减亏拐点 确立。 结论与建议 AI光互联革命叠加多赛道技术共振，微纳光学刚需属性确立， CPO/OCS 为 短期+中期核心增量、消费电子为长期成长曲线。公司作为兼具 “晶圆级微纳光学 + 高功率激光 +海外大客户认证 ”的平台型企业，技术壁垒与卡位优势凸显 ，建议关 注公司长期价值。 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 3 炬光科技 (688167.SH )/通信、电子 目录 1 炬光科技：全球微纳光学领军企业 ................................ ................................ ................................ ........................... 4 1.1 三轮海外并购，完善微纳级 “调控光子 ”版图 ................................ ................................ ................................ ................................ 4 1.2 组织架构：管理层技术背景深厚，股权激励绑定人才 ............................. 生产，暂无动力进行技改，2027年仍以3-4英寸衬底为主。 6英寸衬底不仅需要技改，还需要更换生产炉子，落地进度更慢，短期不会规模化应用。 扩产瓶颈： 核心瓶颈包括海外高端生产设备供应紧张（当前已被订满）、良率提升难度大、产业工人培训周期长。 衬底厂商的核心竞争力为良率控制能力，除长晶炉子外，切磨抛等后道加工工艺也会拉开厂商间的成本和良率差距。 3. 磷化铟衬底价格趋势 2026年价格走势：上半年通美有小幅提价，因2025年旧库存消耗，供应相对平稳；2026年三季度起缺货逐步显现，通美当前报价已达4500元/片，预计2026年还有1-2次涨价，全年价格有望涨至5000元以上。 涨价支撑逻辑： 衬底成本在最终光模块中的占比较低，下游对涨价的接受度较高。 下游客户已开始主动锁单保障供应，进一步推涨涨价预期；当前锁单以锁量为主，锁价难度较大，上游铟、6N红磷原材料价格上涨也对价格形成支撑。 相关厂商盈利预期：通美2027年利润预计达2.5-3亿美金。 4. 磷化铟产业链生产环节与良率情况 核心生产工序：衬底→外延（20层左右，包含缓冲层、波导层、有源区、掺杂层、光栅层）→光刻刻蚀→划片→测试→封装耦合→光模块组装。 各环节良率情况： 外延环节：层数多、工艺复杂，磷化铟衬底质地较脆，每一层生长都可能产生微裂纹，是良率最低的环节；单步良率约50%-60%，多层累积后良率显著降低。 晶圆制造、封装测试环节：良率约70%-80%。 划片环节：因磷化铟脆性易产生微裂纹，良率差异较大，做得好的约50%-60%，做得差的仅30%-40%。 工艺演进对良率的影响： 高功率激光器需要采用掺铁掺杂工艺，掺铁工艺的良率显著低于无掺杂、掺硫工艺，随着激光器功率提升，整体良率会进一步下降。 良率差异影响：当前主流衬底厂商对外供应的衬底均为经过测试的良品，良率差异主要体现在下游加工环节，最终导致单片衬底的可用芯片产出存在差距。 5. 行业竞争格局与认证、出口情况 竞争格局展望： 短期通美仍为全球龙头，技术优势显著；国内厂商中大庆溢泰、先导扩产进度领先，竞争优势较强，云锗受团队变动影响存在不确定性。 国内厂商只要能将衬底品质做到接近通美水平，叠加海外需求缺口较大，将具备广阔的市场空间。 供应商认证： 常规认证周期约1年；当前供需紧张下，对具备扩产能力的供应商认证周期将加速，有望缩短至半年以内，无扩产能力的供应商认证进度将放缓。 出口相关情况： 出口需要获得商务部相关许可，政策层面的不确定性较大，厂商需各自解决出口资质问题，具备出口能力的厂商将受益于海外高需求和更高的产品价格。 厂商当前优先推进国内扩产，预计2027-2028年才会有厂商考虑海外建厂，当前暂未看到相关规划。 产业链分工趋势：衬底厂商暂无向上游延伸做外延的趋势，核心目标为提升自身衬底生产良率。 Q&A Q： 磷化铟衬底当前的下游使用场景有哪些？各场景的需求规模及增速情况如何？ A: 当前磷化铟衬底用量最大的领域是光通信及AI算力领域，2026年该领域需求量接近200万片，2027年预计达到250-280万片，2028年需求量将达到400-500万片，2029年需求量会进一步提升。其余应用场景包括射频芯片、卫星通信、雷达、传感器以及量子技术领域，目前这些领域的需求量相对较小，暂未形成大规模应用。 Q： 当前光通信领域需求的磷化铟衬底主要是几英寸的？更大尺寸衬底的推广进度如何？ A: 目前光通信领域使用最成熟的是3英寸磷化铟衬底。衬底需要搭配外延工艺使用，外延层数普遍在20层左右，当前行业产能紧张，企业优先保障生产交付，没有多余动力进行产线技改，因此4英寸衬底的推广进度较慢。长期来看2029-2030年行业可能会逐步转向6英寸衬底，但6英寸产线需要更换核心生产炉体，整体更新迭代需要较长时间。 Q： 当前磷化铟衬底的供给和涨价情况如何？ A: 2026年上半年磷化铟供应相对平稳，通美有小幅度提价，主要原因是通美有2025年的旧库存支撑供应。从2026年6月开始行业已经逐步出现缺货情况，后续存在进一步提价的可能，当前通美的磷化铟衬底报价已经达到4500元/片，预计年内还有1-2次涨价，价格很有可能上涨到5000元/片以上。 Q： 通美当前的出口限制情况和盈利预期如何？ A: 通美可以通过多种方式应对出口限制，目前经营情况良好，预计2027年通美的利润将达到2.5-3亿美金。 Q： 磷化铟衬底切割激光器的理论产出数量较高，但实际产出较少的原因是什么？ A: 主要原因是各环节损耗和良率叠加导致实际产出远低于理论值：首先磷化铟衬底材质较脆，晶体切片环节本身就有较多损耗；其次衬底需要做平均20层的外延工艺，包含缓冲层、波导层、有源区、掺杂层、光栅层等，每一层沉积过程中都可能出现微裂纹或者结合不良的问题，各环节良率会逐层损耗；后续还有切割划片、测试、封装耦合、模块组装等环节，每个环节都存在良率损耗，多层良率叠加之后，最终可正常使用的激光器芯片数量远低于理论值，一片3英寸衬底最终仅能产出几百到不足1000颗可用芯片。 Q： 磷化铟衬底加工成为EML或光源的完整工序有哪些？各工序对应的良率水平如何？ A: 整体流程分为外延、芯片制造、后道测试封装三大环节：1. 外延环节：先做1-2层缓冲层，用于晶格匹配与应力释放；之后制作下限制波导层，用于控制光场分布；再制作3-10层的多量子阱有源区，该环节复杂程度高、良率相对较低；接着制作上波导层并进行掺杂，掺杂技术从无掺、掺硫发展到掺铁，100毫瓦CW激光器可使用掺硫工艺，200毫瓦及以上高功率激光器必须使用掺铁工艺，掺杂层难度高、良率较低；最后制作光栅层，外延环节整体良率为各层良率的乘积。2. 芯片制造环节：外延完成后进行光刻、刻蚀工艺。3. 后道环节：先对晶圆进行划片，由于磷化铟材质较脆，划片过程容易产生肉眼不可见的微裂纹，会降低芯片发光功率，导致该环节折损率较高；划片后进行单颗芯片测试，测试完成后进行封装耦合，最终组装到光模块中，该环节整体良率约为70%-80%。 Q： 一片3英寸磷化铟衬底，以100G EML或者100毫瓦CW激光器为最终产出目标，最终可以产出多少颗合格产品？ A: 产出数量受各环节良率影响，100G EML单衬底产出约500-600颗，100毫瓦CW激光器单衬底产出约700颗。 Q： 随着光芯片速率提升，整体良率会出现明显下降吗？ A: 速率提升对应功率要求提升，需要使用掺铁掺杂工艺，相较于无掺、掺硫工艺，掺铁工艺会带来整体良率下降。同时磷化铟衬底的微裂纹缺陷在低功率场景下可能不影响产品合格性，但在高功率场景下会导致产品不合格，进一步拉升高功率产品的良率水平。 Q： 目前国内主要厂商在磷化铟掺硫、掺铁工艺上的布局情况如何？ A: 由于光芯片功率提升必须使用掺铁工艺，目前国内外延厂商均在向掺铁工艺方向布局。 Q： 2026、2027年磷化铟衬底的下游需求情况如何？ A: 需求可以根据光模块芯片用量测算，单光模块的磷化铟芯片用量约为5-6颗，部分场景可达7-8颗，具体用量取决于单通道、双通道配置。2026年国内需求方面：云锗需求约10多万片，华星需求约8-10万片，群磊需求约5-6万片；索尔思可根据其光模块出货量推算，若年出货1000万支，对应芯片需求约6000万颗，折合衬底需求约10-12万片【口径验证修改】。海外需求处于爆发期，AOI预计2029年磷化铟衬底需求将达到100万片，Lumentum和Coherent的需求预计比AOI更高。2027年整体需求预计为250万片-280万片。 Q： 目前已有多家磷化铟厂商宣布扩产，还有不少企业跨界进入该领域，2027年磷化铟衬底是否还会处于紧缺状态？ A: 2027年磷化铟衬底仍会处于紧缺状态。2027年整体需求预计为250万片-280万片，而供给端受扩产进度限制，产能爬坡需要经历炉子调通、良率爬升的过程，叠加工艺人才储备需要时间，2027年有效供给预计仅为一百大几十万片，不足200万片，存在明显供给缺口。 Q： 公司合作的磷化铟衬底供应商有哪些？各家产品情况如何？ A: 目前主流磷化铟衬底供应商有通美、云锗、先导、大庆溢泰这几家，供应商对外交付的衬底都是经过测试的良品，不良品不会向外供应。衬底的良率损失主要发生在我方后续的外延、划片等生产工序中，各家供应商交付的产品使用起来差异不大。 Q： 国内几家磷化铟衬底供应商和通美相比，在技术水平、扩产进度等方面的情况如何？ A: 通美目前仍是综合实力较强的磷化铟衬底供应商。国内厂商的情况如下： 云锗：目前国内实际出货量相对更高云锗：2026年出货量高于先导，是当前国内实际出货量相对更高的厂商，计划2027年扩产至25万片，但目前可能存在团队变动的问题，该信息有待核实。 先导：计划2027年扩产至25万片，整体发展情况较好。 溢泰：是几家中扩产速度最快的厂商，其原有砷化镓业务的工艺、生产设备可迁移参考至磷化铟生产，且产业工人可从砷化镓业务线直接转岗，同时其号称生产炉子为自制，进一步加快了扩产节奏。 Q： 是否了解几家磷化铟衬底供应商的自身生产良率情况？ A: 各家供应商自身的生产良率属于内部信息，我们并不了解，仅能掌握我方采购后进行后续生产环节的相关良率情况。 Q： 海外磷化铟衬底厂商的扩产情况和国内相比有什么差异？ A: 住友、JX金属等海外厂商也有扩产计划，但因为原材料受限，扩产困难，国内厂商的扩产速度优势明显，国内预计扩产最快的是溢泰，因为工人可以从砷化镓这边比较快的迁移过来。 Q： 下游客户对磷化铟衬底涨价的接受度如何？后续价格走势怎么看？ A: 磷化铟衬底成本在最终光模块中的占比不高， 利的，当然不用想太多，就是个预期交易，跟做生猪是很像的，跌的时候慢 慢补，涨起来了就降本。 当时怎么做新希望的，现在就怎么做通威就行了。如果你新希望当时套了几根K就忍不住割 肉的，说明你性子急，这种网格走得慢的反转交易不适合你，那就别参与就行了。 做股票，说一千道一万，一定要选跟自己合财的。 最后就还是强调 同花顺 吧，其他的不会做非AI方向把这个方向做好我觉得是最简单的。 就说这么多，祝大家投资顺利。 申文冠 执业编号：A0670623050002 云南约牛软件技术有限公司 风险提示：投资有风险，入市需谨慎 内容未经同意严禁转载，违者追究法律责任", "status": "extracted"}, "post:2026-08-09T11-23:29f81de63b6d": {"id": "post:2026-08-09T11-23:29f81de63b6d", "kind": "post", "title": "2026-08-09 11:23", "source_label": "帖子正文", "excerpt": "【西部计算机】寒武纪：存货高速增长，26H2业绩确定性高收入环增，毛利率持续增长：公司26Q2单季度实现收入31.11亿元（QoQ+8%），归母净利润12.98亿元（QoQ+28%", "content": "【西部计算机】寒武纪：存货高速增长，26H2业绩确定性高收入环增，毛利率持续增长：公司26Q2单季度实现收入31.11亿元（QoQ+8%），归母净利润12.98亿元（QoQ+28%）。公司26Q2单季度毛利率56.1%，为2025年以来单季度最高。资产负债表为后续业绩提供确定性：截至26Q2末，公司存货为82.48亿元（较26Q1末增长37.51亿元），其中，委托加工物资为25.37亿元（代工厂尚未完成制造的晶圆或芯片归为此项，较25年末增长9.14亿元）；预付款为29.14亿元（较26Q1末增长10.17亿元）。26Q2公司购买商品、接受劳务支付的现金为40.78亿元（QoQ+113%）或预示战略备货增加。 郑宏达 谢忱 李想 王朗#文字观点", "publish_time": "2026-08-09 11:23", "tags": ["文字观点"]}, "post:2026-08-09T11-23:e567254b5fec": {"id": "post:2026-08-09T11-23:e567254b5fec", "kind": "post", "title": "2026-08-09 11:23", "source_label": "帖子正文", "excerpt": "寒武纪：2026H1收入/利润翻倍增长，预付款+存货单季新增47.68亿元 # 🔥#Q2营收略低于35亿元市场预期、但净利率好于预期 公司发布2026年半年报：#26H1营收59.", "content": "寒武纪：2026H1收入/利润翻倍增长，预付款+存货单季新增47.68亿元 # 🔥#Q2营收略低于35亿元市场预期、但净利率好于预期 公司发布2026年半年报：#26H1营收59.96亿元，同比+108.13%；毛利率55.3%，同比下降0.7pct；销售/管理/研发 0.26/0.82/7.02亿元，同比变动-6.68%/-15.86%/+29.63%；＃归母净利23.11亿元、归母扣非21.66亿元，同比增长122.61%、137.30%；净利率达38.54%。 #2026Q2单季：营收31.11亿元，同比+75.83%；毛利率56.10%，同比+0.22pct，环比+1.77pct；归母净利12.98亿元、归母扣非12.31亿元，同比+90.11%、93.41%；归母净利率41.71%，同比+3.10pct，环比+6.60pct。 🔥#预付/存货单季新增47.68亿元，持续锁定上游资源保障供应 截至2026H1，公司预付款项达29.14亿元，环比增长10.17亿元；存货82.48亿元，环比增长37.51亿元。二者单季合计新增47.68亿元；公司主动锁定上游资源保障供应，同时...", "publish_time": "2026-08-09 11:23", "tags": ["26H1营收", "文字观点"]}, "post:2026-08-09T16-09:1ee6ffda7d3c": {"id": "post:2026-08-09T16-09:1ee6ffda7d3c", "kind": "post", "title": "2026-08-09 16:09", "source_label": "帖子正文", "excerpt": "【广发计算机刘雪峰团队 | 寒武纪、国产链和其他推荐】寒武纪中报，上半年营收60.0亿元，同比增长108.1%", "content": "【广发计算机刘雪峰团队 | 寒武纪、国产链和其他推荐】寒武纪中报，上半年营收60.0亿元，同比增长108.1%；归母净利润为23.1亿元，同比增长122.6%；扣非归母净利润为21.7亿元，同比增长137.3%。产品在金融、互联网等核心行业实现了持续性的规模化商用部署。Q2营收31.1亿元，同比增长75.8%，环比增长7.8%。重点公司前瞻指标如预付款项、采购现金支出和存货大幅增加，供应链优势进一步凸显，预计将持续扩大①截至26年6月底，公司预付款项为29.1亿元，较26年3月底增加了10.2亿元； ②26Q2，公司购买商品、接受劳务支付的现金为40.8亿元，较26Q1增长了21.6亿元； ③截至26年6月底，公司存货为82.5亿元，较26年3月底增加了37.5亿元。 结合5月银行授信大幅增加并考虑投片周期，预计明年出或将大幅攀升(详细计算请参考5月点评报告)AI芯片国产替代趋势确定，公司格局溢价凸显。在国产AI芯片产品中，寒武纪的思元系列芯片是少有的得到互联网厂商认可和规模化采购的产品，在商业化方面具有先发优势。公司在互联网领域商业拓展的先发优势和供应链的领先优势是其格局溢价的重要组...", "publish_time": "2026-08-09 16:09", "tags": ["文字观点"]}, "attachment:files/Bernstein-寒武纪（688256.CH）2026年二季报点评——营收增速阶段性放缓，盈利韧性超预期.pdf": {"id": "attachment:files/Bernstein-寒武纪（688256.CH）2026年二季报点评——营收增速阶段性放缓，盈利韧性超预期.pdf", "kind": "attachment", "title": "Bernstein-寒武纪（688256.CH）2026年二季报点评——营收增速阶段性放缓，盈利韧性超预期", "source_label": "Bernstein", "excerpt": "Economics - North AmericaUS Economic WeeklyGlobal Markets Research 7 August 2026 Data support a hold Headline nonfarm pa", "content": "Economics - North AmericaUS Economic WeeklyGlobal Markets Research 7 August 2026 Data support a hold Headline nonfarm payrolls (NFP) surprised to the downside in July, declining 23k alongside large negative revisions to prior months.• Household survey details improved as the unemployment rate fell for the second consecutive month to 4.1%, driven by a historically low rate of job losses. Overall, the report should keep the Fed focused on inflation risks.• We expect core CPI inflation rebounded modestly to 0.180% m-o-m in July. Goods inflation likely remained muted, while supercore inflation picked up. Our core PCE forecast of 0.211% m-o-m points to continued disinflation progress.• We expect retail sales declined in July following exceptionally strong spending in Q2 , as temporary consumption tailwinds waned• Marginally dovish employment data, broader Fedspeak this week, our forecast for a subdued core CPI print, and an expected pullback in consumer spending support our % y-o-y, but the BEA’s planned methodological changes to certain PCE price components could reduce core PCE inflation by about 20bp to 3.1% y-o-y in Q4 2026. Tariff-related price pressures are abating, but new AI-related price pressures from robust demand and supply shortages could push up goods inflation. Overall, we expect core PCE inflation to decelerate in coming months on residual seasonality and moderating wage growth. Policy: We expect the Fed to remain on hold indefinitely . Fed Chair Warsh likely remains motivated to ease, but elevated inflation and hawkish Fedspeak suggest he may not be able to convince the majority to support cuts. In addition, he is likely to encourage the committee to keep policy rates steady until recently announced task forces make recommendations on different aspects of data and monetary policy. The balance of risks tilts towards tightening, specifically as Warsh’s dovishness has fueled market concerns around Fed’s inflation fighting credibility. Risks: Further escalation of geopolitical risks could lead to a tightening of financial conditions and a worsening of the fiscal outlook. Increased political pressures on FOMC participants could undermine the Fed’s credibility and cause sharp market reactions. An AI bust could lead to material corrections in asset valuations and reduced business investment. A continued shortage of memory chips and supply-chain disruptions due to a protracted Iran war could lead to a second round effects on inflation. Fig. 12: United States: Details of the forecast % 1Q25 2Q25 3Q25 4Q25 1Q26 2Q26 3Q26 4Q26 1Q27 2Q27 3Q27 4Q27 2025 2026 2027 2025 2026 2027 q-o-q Real GDP (%, a.r.) -0.6 3.8 4.4 0.5 2.1 1.5 2.1 1.9 1.9 1.9 1.7 1.6 2.1 2.1 1.9 2.0 1.9 1.8 (%) -0.2 0.9 1.1 0.1 0.5 0.4 0.5 0.5 0.5 0.5 0.4 0.4 Personal consumption (%, a.r.) 0.6 2.5 3.5 1.9 0.5 3.2 1.8 1.8 1.7 1.7 1.5 1.5 2.6 2.0 1.8 2.1 1.8 2.1 Nonresidential fixed invest (%, a.r.) 9.5 7.3 3.2 2.4 10.6 8.4 4.5 3.6 3.4 3.1 2.5 2.5 4.1 6.3 3.6 5.6 6.7 通常为3—5年，而根据润建股份等企业的公开测算，在Token分成模式下，其投资回收期可缩短至2年左右，这种更快的资金回笼速度，显著增强了企业的再投资与扩张能力；与此同时，在优化的Token分成模式下，Token服务收入有望达到传统算力租赁的5-10倍，在高效的运营下，毛利率可达50%以上，约为传统算力租赁的两倍，由于固定成本占比极高，Token分成模式的超额收益几乎全部转化为利润，净利率有望从此前的 10%—15%跃升至30%以上。 1.2 投资建议 伴随开源模型与闭源模型差距持续收窄，K3 License开创的分成模式有望加速渗透，DeepSeek的涨价或正式打开国内大模型量价齐升的商业化黄金期，利好开源模型公司与算力租赁厂商两大方向。建议重点关注：1）开源模型方向的智谱、MiniMax。2）算力租赁方向的宏景科技、集智股份（ARM Token工厂）、协创数据、利通电子、行云科技、智微智...", "publish_time": "2026-08-09 20:25", "tags": ["文字观点"]}, "attachment:files/科翔股份深度：陶瓷混压PCB先行者，卡位北美客户格20260807.pdf": {"id": "attachment:files/科翔股份深度：陶瓷混压PCB先行者，卡位北美客户格20260807.pdf", "kind": "attachment", "title": "科翔股份深度：陶瓷混压PCB先行者，卡位北美客户格20260807", "source_label": "其他", "excerpt": "周策略：反弹右侧 【摘要】： 每周周策略，不读不要做交易!", "content": "周策略：反弹右侧 【摘要】： 每周周策略，不读不要做交易! 这周阳了以来，挂了几天水+特效药加持，感觉好多了，昨天终于是退烧了。嗓子还是疼， 有点刀片嗓的意思，这周内部课估计是上不了了了，今天坚持一下把周策略写了。 同学们还是也要保重身体，这一波毒株还是挺厉害的，至少疫情期间我打的那两针科兴疫 苗看来是毫无作用。 至于这次的周策略，为什么叫反弹右侧，是因为我认为这一次的大底就是3750 ，3750 之后 就是反转，而不是反弹，这是我上个月在大家最黑暗的时候提出来的，也是当时正好周五 策略会上我现场讲的。 那么当时可以说是市场反弹的左侧，那么到了8月9号的现在，我们就已经身处反弹的右侧 了，这个拐点是已经比较清晰了。 很明显看出来，红利在跌，科技在涨，A股已经从防守重新切回进攻。7月下旬那轮急跌带 来的量化踩踏、机构减仓和止损盘，经过一周反弹已经消化了大半；科技股在利空冲击后 还能迅速收回来，也说明愿意接盘的资金重新出现了。接下来仍可以偏成长，但行情大概 率会走成“涨一段、歇一下、再看业绩”，很难一路直线。 老规矩，先讲讲海外宏观。 美国7月就业报告确实弱。非农就业减少2.3万人，明显低于经济学家的一致预期，5月和6 月又合计下修10.3万人。失业率仍是4.1% ，还没有看到企业大规模裁员，但新增招聘已经 明显变慢。分行业看，地方政府教育减少5万人，零售减少1.9万人，医疗保健增加2.2万 人。劳动参与率降到61.4% ，比年初低0.7个百分点，说明找工作的人也少了。工资同比仍 增长3.2%， 所以当前更像“就业降温、工资还有韧性”，距离衰退还有一段距离。2026-08-09 21:13:59 但就业的弱势已经是很明显了，所以黄金出现了大涨，这也完全是我们宏观判断中看得到 的东西。 自从明确判断黄金4000 就是底以来，这个重要的宏观判断让我们确认了紫金矿业/灵宝黄金 的超然地位，也顺利收获了这一波黄金的大涨，很好的作为防守股帮助我们穿越了这一波 牛熊。 这份就业数据让美联储更难受。7月议息会议把利率维持在3.50%—3.75% ，表决是9票对3 票，三位官员希望再加息25个基点。就业在走弱，通胀又没有完全解决，内部自然会分成 两派。 就业公布后，市场对9月加息的预期从约67%降到44%，两年期美债收益率回到4.20% 附 近；十年期美债仍在4.64% 左右，降得很少。也就是说，市场相信经济会慢下来，却仍担心 长期通胀和政府发债压力，所以短端利率先降，长端利率还撑在高位。 我的判断是当前的加息预期的张力仍然存在，9月加息实际上可能性非常低，只是市场还没 有像我一样看穿美联储的真正动机，所以这里也给我们很好的赚钱机会。 这里给一个重要判断： 黄金不要怕回调，这一波黄金的涨幅可能会超出很多人预期，黄金已经上了我们的第一目 标位4300 ，下面至少要先上第二目标位4500 ，美元和美联储的信用溃烂之快可能会超出很 多人的预期。 也就是说，黄金4500美元之前，每一次紫金大于5%的回调，都至少是你正T的机会。 当然，8月12日公布的7月CPI，是下周真正的大考。市场预期总CPI同比约3.4% ，核心CPI 同比约2.5% 。核心CPI就是剔除食品和能源后的价格，更能反映服务和工资压力。6月总 CPI环比下降0.4%，主要靠能源降价；核心CPI环比持平、同比2.6%。 所以下周最值得看的数字是CPI核心环比：如果在0.2% 以内，服务价格也继续放慢，十年期 美债和美元就有机会回落，黄金、纳斯达克、恒生科技和A股成长都会更舒服；若达到 0.3%或更高，市场会重新担心二次通胀，高估值科技会先承压。 13日的PPI和14日的零售销售也重要，但它们更多是补充验证，主考题仍是CPI。 油价给这场通胀考试又加了一道题。美国与伊朗一度接近就霍尔木兹海峡达成临时安排， 随后伊朗又表示协议不足以立即重开航道，并拒绝在临时协议遭破坏时直接谈判；阿联酋 同时报告ADNOC 船只遭到导弹攻击。布伦特原油8月6日回到每桶82.49 美元。大家在这争 议伊朗到底会怎么样。 我的判断很明确：伊朗问题即将收官，只要以色列不参战，那么当下一切的噪音都是扰 动。美伊谈妥了，而且谈妥之后的美伊关系，可能会变化之快让中国人难以置信，这很有 可能是伊朗神权政府对外关系政策全面重大调整的一个开始。 我知道我说这个判断，很多人可能觉得不可思议。没关系，反正这个判断跟股票关系不 大，我们留在这里，不需要去争论什么，留给时间去验证。当有一天你看到一个亲美的伊 朗出现的时候，不要太惊讶就好。 再谈谈国内宏观。 7月国内数据最鲜明的特点，是外需和内需完全两种温度。 以美元计价，出口同比增长23.9% ，进口增长27.5% ，贸易顺差达到1125亿美元。高技术 产品出口增长40.7% ，集成电路出口接近翻倍，机械设备也保持高增长。外需、全球AI投资 和企业提前交货共同撑住了出口，说明中国制造在全球资本开支上行阶段仍有很强竞争 力。进口增长很快，其中也包含油价和上游原材料涨价的影响，不能直接理解成国内需求 全面回暖。 价格数据更明显，7月CPI环比下降0.1% 、同比上涨0.5% ，核心CPI同比上涨0.9%； 服务价 格环比上涨0.4% ，主要来自旅游、住宿和机票的季节性涨价。汽油价格环比下降10.7% ， 把居民端的总通胀压了下来。PPI是工业品出厂价格，7月环比下降0.7% 、同比上涨3.5% ， 其中生产资料上涨4.8%，生活资料仍下降0.8%。 说人话就是原油、化工、有色这些上游更容易涨价，消费品工厂还在降价抢市场。 传统行业和下游消费还是卷，卷死一个算一个。 上半年社会融资存量增长7.4% ，但新增社融20.84 万亿元，同比少2.02万亿元；流向实体企 业的人民币贷款同比少1.98万亿元，居民贷款减少3668 亿元。M2增长8%，M1只有4%。 M2可以大致理解成整个金融体系里的钱，M1更接近企业随时会拿来经营和投资的活钱。 现在的状态就是银行体系不缺钱，居民和企业借钱、花钱、扩张的意愿还不强。 这些数据对股市的影响很直接。 消费和地产链暂时缺少整体重估的基础。 不要看什么周末北京解除限购地产就能火热，老百姓差的是那一年社保吗？差的是买房的 收入。 还是要观察现在这些存量的房子收储、保民生收入之类的动作，还是关注存量怎么化解。 光让市场自行消化二手房市场，我觉得短期内可能比较难。 所以至于白酒、家电、消费、地产之类的还要等收入预期、渠道库存和销量出现更硬的改 善，我觉得这些都只能做右侧，左侧的机会不大，等后续看看有什么更硬的政策再说。 相反，我觉得贵州茅台之类的前一段时间如果有抄底了的可以兑现一些。 真正有新增需求的方向，仍集中在AI、高端制造、出口设备和创新药。指数可以涨，但很 难所有行业一起涨，选行业和选公司会比单纯押指数更重要。 再讲讲大盘。 本周A股的强度方向很明显，资金已经明显从银行、红利和消费这些防守方向，转回科技和 中小盘。 所谓“右侧修复”，说白了就是低点出现后，市场用上涨和成交量证明卖盘在减弱。7月下 旬急跌可以看成第一只脚，本周科技股重新走强，相当于第二只脚得到了确认。 周中通信链遇到外部政策利空，光模块一度大跌，但卖盘很快被接住；随后国产算力、半 导体设备和Rubin 相关方向接力。周五光模块龙头再度波动，也没有把全市场拖下水。个别 科技龙头下跌已经很难引发全盘恐慌，市场的状态确实变了。 这轮上涨也有隐患。 第一，股票ETF一周净流出约454亿元，股指期货仍有贴水，说明长期资金没有一起追高， 本周部分涨幅来自此前减仓资金和空头回补。 第二，电子和通信的机构持仓只从高位降了一部分，很多基金刚回到成本线。反弹越接近 前高，赎回和减仓压力越容易出来。 因此，大盘低点大概率形成了，科技筹码还没有完全清干净，后面很可能通过一次回踩或 一段横盘重新换手。 估值也决定了下一段行情会更挑公司。 上证指数过去12个月市盈率约16.8倍，处在自身偏高位置；沪深300约14.4倍，也谈不上便 宜。创业板约45倍，看起来更高，但放在自己的历史里反而没有主板那么贵，因为过去两 年股价跌得多、盈利也在增长。只要盈利预测继续上调，成长相对红利仍有优势；如果利 润跟不上，只靠估值往上抬，很快就会遇到天花板。市场接下来会从“谁跌得多”切换到 “谁的订单能兑现、毛利率能改善、盈利预测还能上调”。 眼下是超跌修复，市场重新愿意给基本面定价，但接下来如果到了3900-4000 这个筹码密 集区大概率还会有一次回踩，而那一次的回踩也不会破3750的前低。 现在可以参与修复，也要在涨了多了之后，在小级别上积极降本，给第二阶段的回踩留出 仓位。 下周基准情景是高位震荡，成长仍占优，盘中波动会放大。若美国核心CPI环比在0.2% 以 内、十年期美债回落，科创50、创业板和恒生科技还有继续补涨的条件；如果核心CPI达到 0.3% 或更高，油价和美债利率又同时上行，本周涨幅最大、利润兑现最远的科技股会先承 压，银行和高股息可能短暂回流。 简单讲，只要上证没有重新跌破3750 ，科技龙头没有集体放量破位，成交额也没有明显塌 下来，回调仍按反转右侧行情处理。若这三项同时走坏，就要把之前的反转判断降级成一 次反弹。 最后谈一谈板块。 我一直讲的一句话，AI的中期逻辑仍然成立，但早已经过了名字里有AI就能涨的阶段。 现在我看一家公司，至少要问三个问题：订单能不能证明需求是真的，毛利率能不能说明 公司有议价权，经营现金流能不能证明利润已经收回来。三项都有验证的做核心仓；订单 正在兑现、利润弹性较大的做弹性仓；商业模式和收入还需要时间验证的，只放在短线里 给同学们推荐。 国产算力仍是我们的第一优先级，产业顺序可以理解为晶圆制造先扩产，AI芯片随后放 量，半导体设备再跟着接订单。 我觉得下周中芯国际港股/华虹很有可能表现一下。半导体设备应该也会挺强的，北方华 创、中科飞测 没权限的直接 半导体设备E TF就行了。 然后寒武纪的中报，上半年收入59.96 亿元、净利润23.11 亿元，业绩很强；同时存货达到 82.48 亿元，较年初增长66.83% ，预付款增长291.37% ，经营现金流只有3.11亿元。备货 增加说明公司在为交付做准备，不要以为寒武纪暴雷了，实际上是2季度因为HBM 的货不 够，延期到3季度去交，股价已经提前跌过了，现金都拿来备这么多货，恰恰说明公司对下 半年订单的需求是非常乐观，实际上字节下订单也确实很狠。 买寒武纪=买字节跳动算力。你每天用不用豆包？想明白就很简单，如果周一韭菜比较多， 寒武纪给低开的机会，可以考虑果断加仓。 阿里巴巴当然没得说，最新一季云业务外部收入增长40%，AI相关产品收入连续11个季度 保持三位数增长，已经占云外部收入的30%。它既能受益于算力投入，也能直接看到AI应 用收入，未来收入和利润比纯概念公司更容易估。补充材料按电商、云业务和净现金分开 估值。苹果也没什么问题。 通富预计上半年净利润16亿—18 亿元，同比增长288%—337% ，剔除一次性因素后的利润 增长66%—90%， 立讯做过ppt了，耐心按ppt来拿就行了。 海外算力链因为FCC的事情，所以资金从光模块里撤退，选择去打了PCB，所以胜宏科技被 打起来了，我的理解是反正现在海外这边都差不多，过两天PCB美国再给你来一刀你咋办？ 你只能是快进快出，跌多了捞点，涨了就卖。 没办法，谁让你卖给美国人，美国人卡你脖子你有什么办法。 至于涨价链条什么中国巨石、兴森、生益这种超跌反弹的海外链你想做就去做，我只想说 一句，就是这些回到前高都几乎不可能，你要想搞你就奔着超跌反弹做个短线的思路去。 存储板块整体都很贵，不想讲了。兆易创新之类从一年的维度看肯定是没跌透的，模组厂 更是狗都不看。 然后创新药这边反正就那些东西，药明康德是我这一轮最看好的，药明康德上半年收入 288.9 亿元，同比增长38.9% ，调整后利润115.7 亿元，同比增长83.2% ，公司还上调了全 年指引。在手订单、利润率和现金流都有支撑，继续做医药核心，事实证明也是走的最强 的，你要不想选股就选全天候里的那个 创新药etf ，反正我全天候一直拿着呢。 防守这边，还是紫金矿业，想搞铜的就洛阳钼业，然后锡矿也涨了，可以回头搞厦门钨 业，反正搓一搓都没毛病。紫金肯定没涨完，我会盯着的，卖的时候书院会说。 阿里、紫金、沪深300、科创50，这四个我都会讲。 然后储能这边我看宁德走的还比较稳定的话你可以考虑做个湖南裕能的超跌反弹，给点肉 就可以跑的那种。券商这边我觉得 同花顺 走的还不错，继续观察观察，大涨了就降点本。 最后讲个防守的另类小方向，光伏，这一波反内卷协议出来之后，通威股份这种硅料龙头 对整合是最有利的，当然不用想太多，就是个预期交易，跟做生猪是很像的，跌的时候慢 慢补，涨起来了就降本。 当时怎么做新希望的，现在就怎么做通威就行了。如果你新希望当时套了几根K就忍不住割 肉的，说明你性子急，这种网格走得慢的反转交易不适合你，那就别参与就行了。 做股票，说一千道一万，一定要选跟自己合财的。 最后就还是强调 同花顺 吧，其他的不会做非AI方向把这个方向做好我觉得是最简单的。 就说这么多，祝大家投资顺利。 申文冠 执业编号：A0670623050002 云南约牛软件技术有限公司 风险提示：投资有风险，入市需谨慎 内容未经同意严禁转载，违者追究法律责任", "status": "extracted"}, "post:2026-08-09T11-08:f3402a1ab662": {"id": "post:2026-08-09T11-08:f3402a1ab662", "kind": "post", "title": "2026-08-09 11:08", "source_label": "帖子正文", "excerpt": "mSAP交流反馈5（SN）—0808周更新1 历史：mSAP交流1-4（XS，HB，SH，FX参考722以来交流），技术升级方向如我们预期正在逐步走出 🐟1️⃣mSAP规划：南通m", "content": "mSAP交流反馈5（SN）—0808周更新1 历史：mSAP交流1-4（XS，HB，SH，FX参考722以来交流），技术升级方向如我们预期正在逐步走出 🐟1️⃣mSAP规划：南通mSAP产线已建设完成，2026年上半年处于爬坡调试阶段，全部达产后mSAP产能约1万平米，后续继续扩产；无锡w15 mSAP产线仍在基建，预计2027年投产；未来无锡+南通mSAP总产能预计可达3万平米。 🐟2️⃣mSAP良率：1.6T、800G光模块PCB工艺成熟，当前良率在60%-70%，理想状态下高阶HDI良率可达到80%-85%，新厂初期良率仅30%-40%。主要客户包括XC、XYS、菲尼萨，剑桥科技也有部分份额。 🐟3️⃣价格：800G光模块PCB：采用mSAP工艺的5阶HDI产品单价约110元/只，常规8-10层普通产品单价约80-90元/只，当前均价在109元/只；1.6T光模块PCB：高端产品单价约230-240元/只，中低端产品单价约170-200元/只，价格差异由层数、设计、线宽线距决定。 设备材料数据较多，具体参考我们交流内容#文字观点", "publish_time": "2026-08-09 11:08", "tags": ["文字观点"]}, "attachment:files/申万宏源-松发股份(603268)稀缺产能持续扩张，高端船型订单密集落地开启成长新阶段-260807.pdf": {"id": "attachment:files/申万宏源-松发股份(603268)稀缺产能持续扩张，高端船型订单密集落地开启成长新阶段-260807.pdf", "kind": "attachment", "title": "申万宏源-松发股份(603268)稀缺产能持续扩张，高端船型订单密集落地开启成长新阶段-260807", "source_label": "申万宏源", "excerpt": "本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明", "content": "本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 1 浙江正特（ 001238 .SZ）深度 报告 创新驱动，厚积薄发 glmszqdatemark 浙江正特：面向海外市场的户外龙头。 浙江正特创立于 1996 年，拥有 遮阳制品、 户外休闲家具 两大产品系列， 打造了MIRADOR 、ABBA PATIO 等自主品牌， 主攻跨境电商和沃尔玛、 Costco 等大型连锁渠道 。 其中 星空篷 等大单品 带动收入 增长， 虽地缘政治影响下 2023 年需求下降， 去库 不及预期 ，但2024年收入 迅速 回暖，2025 年持续增长， 其中 2025 年线下/线上收入分别同比 +41.6%/+12.3% 。 多因素共振，海外线下零售商转型正当时。 公共卫生事件和跨境电商兴起 彻底改 变了欧美零售业格局 ，我们将美国渠道分为 “边缘渠道” 和“灯塔渠道” 两部分： 一方面， 中美贸易摩擦 背景下 中小渠道式微， 边缘渠道 通过 OBM 转DDP 模式将 风险转移至供应链上游，同时利用店中店 模式引入新品类 ，以提升店效 ；另一方 面，传统选品模式下， 以Walmart 、Best Buy 为代表的大型零售商主要依赖买 手、供应商等线下渠道 选品。而近年来灯塔渠道加速布局自有线上平台，选品路 径上开始更多 依赖于 第三方电商平台发掘 热销商品并在自身线上渠道 进行试销， 后再将高销量商品 推向线下门店。主流零售仍以线下为主，但 选品模式的变化为 企业打通了一条通往线下渠道的路径， 线上畅销能力、供应链综合管理成为中国 出口企业进入线下核心渠道的必备条件，浙江正特的星空篷产品即为典型代表。 创新引领爆款周期叠加线下渠道红利，业务进入成长快车道 。公司坚持 “正道追 求，特异创新 ”，在上海、深圳、美国、荷兰设立研发中心 ，内部研发与外部战 略咨询双轮驱动 ， 星空篷、 Novara 吊伞等产品 获得红点奖。 公司特有的专利和持 续创新构筑强产品护城河， 爆品战略（好看、好用、高价值）推动品牌从制造型 向产品型、品牌型升级 ，并持续迭代 以保持产品优势。 生产端，临海、顺德晴天 和印尼基地 全球供应链协同 ，通过数字化生产降本增效。厚积薄发， 2023 -2025 年Mirador 星空篷位列全球户外廊架销量第一， 2025 全年星空蓬占总营收达 50%+ 。未来，公司还将 聚焦于渠道深度铺设和户外品类拓展 ，包括入驻 Costco 等北美线下 KA渠道，露营车、户外家具多品类协同开拓，以开启第二增长曲线。 投资建议： 浙江正特作为面向海外市场的户外龙头之一，大单品星空蓬 0-1的爆 品逻辑已线上得到验证， 拓展北美线下大型 KA门店后有望完成 1-100持续放量； 露营车及户外家具有望开启公司第二增长曲线。 预计公司 2026 -2028 年营收分 别为 21.30/26.11/31.04 亿元， 同比 +26.97%/ +22.60%/ +18.86% ；归母净利润 0.94/1.59/2.21 亿元，同比 +158.17%/ +69.89%/ +39.33% ；EPS为0.60/1.02/ 1.43 元/股，当前股价对应 PE分别为 42/25/18x。首次覆盖， 给予 “ 推荐” 评级。 风险提示： 1）欧美等海外消费不及预期风险； 2）原材料价格大幅上涨风险； 3） 汇率波动风险 ；4）核心产品销售不及预期风险 ；5）新品扩展不及预期风险 。 [Table_Forcast] 盈利预测与财务指标 项目/年度 2025A 2026E 2027E 2028E 营业收入（百万元） 1,677 2,130 2,611 3,104 增长率（ %） 35.6 27.0 22.6 18.9 归属母公司股东净利润（百万元） 36 94 159 221 增长率（ %） 359.1 158.2 69.9 39.3 每股收益（元） 0.23 0.60 1.02 1.43 PE (X) 108 42 25 18 PB (X) 3.5 3.3 2.9 2.6 资料来源： iFinD ，国联民生证券研究所预测；（注：股价为 2026 年8月7日收盘价） 推荐 首次评级 当前价格： 25.26 元 [Table_Author] 分析师 徐皓亮 执业证书： S0590525120007 邮箱： xuhaoliang@glms.com.cn 分析师 童苇航 执业证书： S0590526070011 邮箱： tongwh@glms.com.cn 相对走势 -30%-7%17%40% 2025/8 2026/2 2026/8浙江正特 沪深300 2026 年 08 月 08 日 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 2 浙江正特 (001238.SZ )/轻工及中小盘 投资聚焦 1）大单品驱动增长，渠道深化： 公司战略爆品“星空篷”凭借差异化设计和 强产品力， 线上市占率已处于领先地位， 未来也将持续替代传统木质廊架， 大单品 星空蓬的爆品逻辑已线上得到验证，拓展北美线下大型 KA门店后有望持续放量； 2）新品类拓展，贡献未来增量： 公司在户外场景领域进行了品类拓展，推出 了露营车、户外家具套组等新品，已获得渠道和消费者积极反馈，并成功进入 Walmart 等线下渠道，有望开启公司第二增长曲线。 核心假设 1）收入端：①遮阳制品： 截至 2025 年，公司星空蓬已进入北美 Costco 多 家线下门店， 并上线 Costco 及Sam ’s Club 电商平台， 预计产品将实现高速增长， 2026 -2028 年遮阳制品收入同比增速为 +25.00%/+20.00%/+16.00% ；②户外休 闲家具： 公司加速拓展户外场景，推出储物、户外家具、露营车等多个品类，露营 车已进入 Walmart 多家线下门店，预计户外休闲家具也将在未来持续放量，假设 2026 -2028 年收入同比增速为 +60.00%/+50.00 %/+40.00 %；③其他业务： 假设 2026 -2028 年收入同比增速为 +20.00%/+20.00%/+20.00% 。 2）毛利率： 分业务来看， ①遮阳制品： 预计随着星空篷等大单品持续放量， 规模效应下毛利率将有所提升， 因此我们假设 2026 -2028 年遮阳制品毛利率分别 为28.70%/28.90%/29.10% ；②户外休闲家具： 预计未来公司将持续拓展户外休 闲家具新品并不断扩大规模， 假设新品导入和规模效应 带动毛利率持续改善， 因此 我们假设 2026 -2028 年户外休闲家具毛利率分别为 18.00%/19.00%/20.00% ； ③其他业务： 我们假设 2026 -2028 年其他业务毛利率维持稳定，分别为 3.00%/3.00%/3.00% 。综上，我们预测 2026 -2028 年公司毛利率有望达到 25.67%/25.78%/25.85% 。 近期催化 浙江正特作为面向海外市场的户外行业龙头，凭借星空篷大单品率先实现从 线上验证到北美线下核心 KA渠道的放量突破，有望开启 “1到100”高速扩张。 公司多品类快速拓展，露营车、户外家具打开第二增长曲线，战略主线清晰，创新 动力与全球化渠道能力兼备。渠道、产品、供应链共振下，公司 有望步入利润快速 修复与业绩高增阶段。 从股价来看， 近期地缘冲突下出口链整体估值处于低位， 若 地缘因素缓解 ，出口链估值有望回升。 仅供内部参考，请勿外传 本公司具备证券投资咨询业务资格，请务必阅读最后一页免责声明 证券研究报告 3 浙江正特 (001238.SZ )/轻工及中小盘 目录 1 浙江正特：面向海外市场的户外龙头 ................................ ................................ ................................ ........................ 4 2 多因素共振，海外零售商转型正当时 ................................ ................................ ................................ ........................ 9 3 创新驱动：品正质优，特异求新 ................................ ................................ ................................ ............................ 13 3.1 以“品正质优 ”为核心， 内外设计网络并进 ................................ ................................ ................................ ................................ 13 3.2 “好看、好用、高价值 ”打造极致产品 ................................ ................................ ................................ ................................ ............ 15 3.3 全球供应链协同，数字化生产降本增效 ................................ ................................ ................................ ................................ ...... 16 4 厚积薄发：廊架升级，星空蓬热销 ................................ ................................ ................................ ........................ 19 5 高瞻远瞩：户外场景拓展，发展空间可期 ................................ ................................ ................................ .............. 22 5.1 户外场景拓展，协同进步 ................................ ................................ ................................ .. 子公司之江易算与Fedimoss合资设立的新易算，已完成首批ARM架构192核心CPU服务器部署，正式具备Token生产能力，卡位Agentic时代ARM异构Token工厂；寒武纪H1营收60.0亿元（同比+108.1%），Q2单季毛利率56.1%为2025年以来单季最高，预付款+存货单季新增47.68亿元。（来源：16:09【国联民生计算机】；11:23【西部计算机】；16:09【广发计算机】；附件：广发证券-寒武纪260809）\u003c/li>\n\u003cli>光通信/CPO被AAOI超预期财报点燃，产业链紧缺逻辑强化。AAOI财报带动Coherent当日大涨13%、Lumentum和康宁分别上涨6%和5%、AAOI涨9%；磷化铟专家纪要显示2026年光通信及AI算力需求接近200万片，2027年250-280万片；Coherent 27年1.6T订单有望翻3倍，预计26H2向汇绿分批释放1.6T订单。（来源：16:21周末舆情热度；附件：磷化铟专家交流纪要-20260809；光通信主线核心逻辑）\u003c/li>\n\u003cli>人形机器人进入定价窗口：宇树科技将于8月10日网上申购，发行市值609-610亿元，显著高于前期一致预期420亿元，发行价150.80元/股、超募比例45.15%，DeepSeek参与战略配售。（来源：21:17【HF大制造】；23:01【中金机械】；21:50帖子）\u003c/li>\n\u003cli>宏观面：FOMC鹰派暂停落地，美国Q2 GDP初值低于预期；中国7月CPI/PPI双双低于预期，美国7月非农转负。美国2026Q2实际GDP环比折年率初值1.5%（预期2.0%、前值2.1%）；中国7月CPI年率0.5%（前值1.00%）、PPI年率3.5%（前值4.10%）。（来源：20:26【国盛有色】；11:07【长江宏观】；附件：东海证券-海外观察-260809、东吴证券-7月非农-260808）\u003c/li>\n\u003cli>PCB/CCL/铜箔获高盛上调空间，成为AI算力链新焦点。高盛将27年PCB/CCL潜在市场规模预测上调38%/18%，AI需求或推动2026-28年增幅保持三位数；东吴预计26年全球AI服务器高端铜箔（HVLP3-4）需求1-2万吨、27年翻番至3-4万吨；Rubin产业链CCL备货量超Q1整体体量、8月正式确认收入。（来源：附件：高盛-全球PCBCCL；16:06【东吴电新】；13:49 Rubin产业反馈）\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线一：AI算力/大模型——Token工厂落地与推理成本下行\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：Agentic时代算力需求向付费推理迁移，Token工厂成为核心载体；新易算通过软硬一体化面向全球Coding、Research等领域深度AI使用群体的付费推理需求。\u003c/li>\n\u003cli>今天出现的催化/验证：首批ARM架构192核心CPU服务器+GPU算力服务器+自建推理云全部完成部署，正式具备Token生产能力；OpenAI宣布GPT5.6Luna降价80%、Terra降价20%，单位推理成本利好AI应用大规模发展。\u003c/li>\n\u003cli>对应证据来源：16:09【国联民生计算机】；AI主线逻辑链；20:34算力租赁调研更新0809\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线二：光通信/CPO——AAOI验证需求超产能，磷化铟缺口扩大\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI回报率和回报速度远超预期，云和AI收入上限大幅提升；Scale-up光互联价值占比大幅提升；800G高增长→1.6T/3.2T高斜率→CPO再爆量；EML与硅光方案全口径良率极低导致供给瓶颈。\u003c/li>\n\u003cli>今天出现的催化/验证：AAOI创始人称800G/1.6T需求持续超产能，瓶颈在自身产能及DSP、TIA等组件供应；磷化铟2026年需求接近200万片；Coherent预计26H2向汇绿释放1.6T订单；TIA国内玩家全景图梳理（优迅股份等）。\u003c/li>\n\u003cli>对应证据来源：16:21周末舆情热度；19:33【中信通信】；22:54 InP的反攻；附件：磷化铟专家交流纪要-20260809；20:02 TIA全景图帖子\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线三：PCB/CCL/铜箔——高盛上调+Rubin落地，景气从预期转向验证\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI高端铜箔（HVLP及载体铜箔）持续紧缺，PCB量价齐升、高端化加速；FCBGA载板驱动ABF用量成倍增长，味之素份额约98%且扩产保守；mSAP高景气获海外财报验证。\u003c/li>\n\u003cli>今天出现的催化/验证：高盛大幅上调AI服务器PCB及CCL市场空间；Rubin产业链5-6月CCL备货量超Q1整体体量，8成需求来自Rubin平台；三井金属26Q2载体铜箔发货及扩产超预期，营业利润同比+84%；公告显示拟21亿元投建高多层及HDI PCB P3项目。\u003c/li>\n\u003cli>对应证据来源：16:06【东吴电新】铜箔；附件：高盛-全球PCBCCL；13:49 Rubin产业反馈；16:09三井金属财报梳理；附件：【公告全知道】P3项目\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线四：人形机器人——宇树申购开启，本体价值重估\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：26年国产人形本体类似20年新势力车企，具备密集上市期、大的产业叙事、技术端突破三要素；电动化是存量替代逻辑，人形机器人是纯增量逻辑、市场空间不可测；人形机器人最大魅力在于成为AI时代历史性大单品。\u003c/li>\n\u003cli>今天出现的催化/验证：宇树8月10日开启网上申购，发行市值609-610亿元（前期一致预期420亿元）、超募比例达45.15%、DeepSeek参与战略配售；东吴证券、中信建投同日发布宇树深度报告。\u003c/li>\n\u003cli>对应证据来源：11:08【天风电新】上纬新材；21:17【HF大制造】；23:01【中金机械】；附件：东吴证券-宇树科技-260809、中信建投-宇树科技-260807\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线五：半导体/存储——SK海力士扩产+苹果验证长鑫，国产链逻辑强化\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：存储/HBM扩产周期启动，集邦咨询预计2026年全球九大云厂商合计资本支出规模突破8867亿美元、同比增幅接近90%；半导体扩产带动量检测、载板等\"卖铲层\"受益。\u003c/li>\n\u003cli>今天出现的催化/验证：SK海力士宣布在韩国投资384亿美元建设晶圆厂，扩大HBM、下一代DRAM及NAND闪存产能；华尔街日报称苹果一直测试长鑫存储内存芯片，覆盖iPhone和MacBook多条产品线；国投中鲁收购电子院转型半导体\"卖铲人\"，电子院2025年1-11月归母净利润2.14亿元。\u003c/li>\n\u003cli>对应证据来源：半导体主线核心逻辑；20:22华尔街日报帖子；16:07【东吴计算机王紫敬】；附件：东吴证券-国投中鲁-260807\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线六：宏观/策略——FOMC鹰派暂停+数据降温，风格再平衡\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：FOMC鹰派暂停靴子落地，流动性转向仍取决于下半年经济基本面；会议过后美股、美元、美债下跌，黄金小幅走强，加息预期小幅降温，但利率期货市场依旧定价年内100%将加息；市场处于\"没有增量、受制于人\"的存量博弈状态。\u003c/li>\n\u003cli>今天出现的催化/验证：中国7月CPI年率0.5%、PPI年率3.5%，均低于预期；7月美国非农转负、劳动力市场维持弱平衡；国内政策预期强化；中信建投策略提出\"W型底部确立\"。\u003c/li>\n\u003cli>对应证据来源：20:26【国盛有色】；08:38帖子\"多光空存\"；11:07【长江宏观】；16:18【信达消费】；附件：中信建投-策略周思考-260809、东海证券-海外观察-260809\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>寒武纪中报落地：H1营收59.96-60.0亿元（同比+108.1%），Q2单季收入31.11亿元（QoQ+8%）、归母净利润12.98亿元（QoQ+28%）、毛利率56.1%创2025年以来单季最高；预付款+存货单季新增47.68亿元。伯恩斯坦将目标价由2000元下调至1340元，维持\"跑赢大盘\"，认为\"营收增长疲软，但或仅为季度波动，盈利能力极强\"。（来源：11:23【西部计算机】；16:09【广发计算机】；20:29伯恩斯坦）\u003c/li>\n\u003cli>宇树科技定价落定：发行价150.80元/股，预计募集资金总额60.99亿元（高于此前招股书预计的42.02亿元），发行市值610亿元（另一口径609亿元），超募比例45.15%，8月10日开启网上申购；DeepSeek参与战略配售。（来源：23:01【中金机械】；21:17【HF大制造】）\u003c/li>\n\u003cli>苹果测试长鑫存储内存芯片：测试范围覆盖iPhone和MacBook等多条产品线，已就供应零部件进行初步洽谈，目标用于在中国市场销售的部分设备。（来源：20:22华尔街日报）\u003c/li>\n\u003cli>SK海力士宣布在韩国投资384亿美元建设晶圆厂，扩大HBM、下一代DRAM及NAND闪存产能；另据帖子，SK海力士筹备约100万亿韩元股东回报方案，其中股票回购规模预计40万亿韩元。（来源：半导体主线核心逻辑；11:11帖子）\u003c/li>\n\u003cli>中国7月物价数据出炉：CPI年率0.5%（预期0.80%、前值1.00%），PPI年率3.5%（预期3.80%、前值4.10%），均低于预期。（来源：11:07【长江宏观】）\u003c/li>\n\u003cli>美股光模块板块因AAOI超预期财报大涨：Coherent涨13%、Lumentum和康宁分别涨6%和5%、AAOI涨9%；A股周末舆情聚焦光模块/CPO、PCB/存储芯片方向（生益科技、方邦股份、红板科技、中一科技、景旺电子、博敏电子、方正科技等）。（来源：16:21周末舆情热度）\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>宇树上市后的估值锚与人形机器人本体价值重估、零部件产业链关注度传导（21:17【HF大制造】；21:50帖子；23:01【中金机械】）\u003c/li>\n\u003cli>Rubin平台8月正式确认收入的兑现度，以及Q3 PCB链边际变化；Rubin商业化落地被认为是板块景气上行的核心驱动力（13:49 Rubin产业反馈；20:28【东吴电子】）\u003c/li>\n\u003cli>行云科技三季度新订单进展及涨价预期，关注8月催化（20:34算力租赁调研更新0809）\u003c/li>\n\u003cli>Coherent 26H2向汇绿分批释放1.6T订单的节奏，以及800G/1.6T组件（DSP、TIA）紧缺情况；TIA环节关注优迅股份等标的（20:02帖子；光通信主线核心逻辑）\u003c/li>\n\u003cli>苹果与长鑫存储供应谈判后续进展，以及长鑫是否要求同步涨价（20:22帖子；11:08伯恩斯坦引用趋势分析）\u003c/li>\n\u003cli>美联储年内加息路径：利率期货市场依旧定价100%将加息，后续经济基本面（GDP、非农）决定流动性转向（20:26【国盛有色】）\u003c/li>\n\u003cli>SST渗透率验证：2027年Rubin Ultra场景下SST供电渗透率约10%-20%、2028年提升至20%-30%；比亚迪液冷SST研发是否按2027年上半年落地推进（19:49 SST&amp;SOFC帖子）\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003cul>\n\u003cli>帖子（08:37）：长三角枢纽算力调研（芜湖+嘉善）——中国移动园区全部出租给腾讯，隔壁中国电信园区247亩也在建、同样全部租给腾讯，主要用昆仑芯（客户自带），园区规划约300亩、IT负荷300MW，用地紧张、临时改容积率。\u003c/li>\n\u003cli>帖子（08:37）：呼和浩特和林格尔园区（华为、电信、并行科技）及乌兰察布察哈尔新区（华为、世纪互联、优刻得）算力调研——华为片区计划6000亩地、目前拿地745亩，园区计划负荷3.5-4GW，约等于240万张卡、192万P算力，目前刚装机3万个标准机柜。\u003c/li>\n\u003cli>帖子（11:08）：mSAP交流反馈5（SN）—0808周更新1——南通mSAP产线已建设完成，2026上半年爬
