”：“减速”文章发在Dario个人Blog，并非Anthropic官方新闻；Jensen昨晚在All-In明确反对AI减速，#特朗普也接入电话并直接把AI失控风险/围绕AI和数据中心的限制性叙事称为“hoax（骗局）”。至少从产业链和美国政策端看，并没有形成同步减速。 🌟模型未见明显减速：Claude Opus 5.2、Gemini 4 Pro、GPT-6 Spark近期都还有灰测/发布传闻；Musk一边支持Dario，一边继续推进Grok 4.8训练和RL，且此前还反复把Grok 5与AGI挂钩，这种#实际行动和“减速”几乎没什么关系。🌟算力未见明显减速：Anthropic最新又签下Rum Group六年算力合作，#长期算力锁量仍在继续。后续如果安全Eval、Red Team、Monitoring、Alignment进一步加强，反而可能产生额外算力需求。 🌟产业博弈的解释：Dario这次突然强化“Pace the Frontier”，也可能与GPT-6等下一代模型即将带来的竞争压力有关——如果Anthropic预期下一轮模型竞争对自身形成明显冲击，推动行业统一提高安全门槛、放慢frontier迭代，也客观上有利于降低竞争节奏、延长现有模型生命周期。 ☎️From 华泰计算机 郭雅丽/范昳蕊/袁泽世/岳铂雄/王浩天/徐诚伟#文字观点", "publish_time": "2026-09-15 08:48", "tags": ["开盘后没有进一步恶化", "实际影响目前看相对可控", "实际行动和“减速”几乎没什么关系", "长期算力锁量仍在继续", "文字观点"]}, "post:2026-09-15T15-48:71b162cae85c": {"id": "post:2026-09-15T15-48:71b162cae85c", "kind": "post", "title": "2026-09-15 15:48", "source_label": "帖子正文", "excerpt": "9月15日复盘笔记：芯片/风电设备/PCB/固态电池/网络安全/电力/MLCC/光纤/钨等一、重磅财经信息①8月份一线城市商品住宅销售价格环比上涨二三线城市环比降幅总体收窄 ②8月份一二三线城市商品住宅销售价格同比降幅继续收窄 ③8月份社会消费品零售总额39824亿元 同比增长0.4% ④8月规模以", "content": "9月15日复盘笔记：芯片/风电设备/PCB/固态电池/网络安全/电力/MLCC/光纤/钨等一、重磅财经信息①8月份一线城市商品住宅销售价格环比上涨二三线城市环比降幅总体收窄 ②8月份一二三线城市商品住宅销售价格同比降幅继续收窄 ③8月份社会消费品零售总额39824亿元 同比增长0.4% ④8月规模以上工业增加值同比实际增长5.2% ⑤美国10年期国债收益率升至5.02% 为2007年以来最高水平二、大盘表现截止收盘，沪指跌0.54%，深证成指跌0.72%，创业板指跌1.15%，科创50指数涨1.55%。沪深京三市成交额仅1.62万亿，较昨日小幅缩量，创年内新低。三、强势板块和个股分析备注：只列举部分涨停板芯片①工信部、国家发改委日前联合印发《电子信息制造业发展“十五五”规划》。规划提出，构筑先进计算生态体系，加快存算一体、量子计算、光计算、类脑计算等新计算范式布局，突破超大规模智算设施架构设计。 ②摩根大通发布半导体SPE板块报告，将晶圆厂设备市场增长预测大幅上调，2025至2028年复合年增长率达28%。涨停板：大为股份、德尔未来、天龙股份、中晶科技、和顺石油其他强势股：臻宝科技、超纯应材、燧原科技风电设备挪威咨询机构Rystad Energy最新分析称，欧洲海上风电扩张正面临结构性供应约束。自2020年以来，海上风机整机售价（按MW计）已上涨40%-45%，涨幅远超同期制造成本20%-25%的增幅。涨停板：大金重工、天顺风能、宏盛股份、锡华科技、吉鑫科技其他强势股：海力风电、盘古智能PCB机构：随着PCB上游材料价格持续上涨，涨价开始向部分PCB品类传导，涨价效果自2026年第三季度起将逐步体现。涨停板：华正新材、澳弘电子、诺德股份、欧克科技、西陇科学其他强势股：方邦股份、超声电子、南亚新材、满坤科技固态电池比亚迪计划在2027年推出搭载固态电池的车型，已持续推进固态电池研发并计划通过车型搭载推动技术落地。涨停板：金龙羽、上海洗霸、英联股份其他强势股：宏工科技、灵鸽科技、纳科诺尔网络安全英伟达、Palantir和BoozAllenHamilton正要求OpenAI、Anthropic提供新的安全保障，并减少或停止使用两家公司最先进的AI模型。涨停板：中新赛克、启明信息、博汇科技其他强势股：天融信、永信至诚电力国常 19.1 -4.2 69.3 66.9 52.0 归母净利润（百万元） 52 281 93 215 517 增长率 yoy（%） -15.4 437.0 -66.8 129.6 140.8 ROE（%） 5.4 22.7 7.3 14.9 27.3 EPS最新摊薄（元） 0.33 1.79 0.59 1.37 3.29 P/E（倍） 142.9 26.6 80.0 34.9 14.5 P/B（倍） 7.1 6.0 5.8 5.1 3.9 资料来源： 聚源数据 ，公司财报， 长城证券产业金融研究院 产品技术及应用横向拓展，暖通设备 板块持续高增。公司成立于 2006年，致力于 为客户提供空气动力系统全场景数智化解决方案 。着重布局暖通空调设备领域，围 绕“磁悬浮”核心技术重点突破热泵、磁悬浮冷水机组等暖通产品的研发与升级， 并逐步将下游应用拓展至数据中心液冷板块。 2026年H1公司营业收入为 3.96亿 元，同比增长 16.23 %，主要系本期暖通产品销售收入大幅提升 。 高性能液冷方案必要性显著，加固智算中心液冷全面应用趋势。 数据中心是我国数 字经济发展中 的核心基础设施 ，降低制冷系统能耗 是达成 PUE目标的主要途径。 随着全球 高密度智算集群 大规模建设，未来 高性能液冷方案 将成为主流， 磁悬浮离 心式冷水机组有望成为 最优配置。根据华经产业研究院 2026年1月发布的报告， 丹佛斯在我国磁悬浮压缩机 市场市占率达 65%以上，随国内厂商技术进步和产能 扩张， 国产化替代趋势明确 ， 我们认为 未来数据中心冷水压缩机市场空间较为广阔 。 围绕“磁悬浮 +”打造产品 建设，拓展 AI产业链新兴应用 。公司注重研发及产能 投入，在磁悬浮轴承、高功率密度热管理等领域持续实现技术突破 ，2025年公司 磁悬浮离心式压缩机成功入选浙江省首台（套）装备名单 ，节能优势 显著，预计将 有1000台磁悬浮（水冷）热泵产能于 2027年6月30日达产。此外公司还 布局了 AI算力硬件 PCB环节，满足工厂气动及冷热温控需求 。公司持续切入 AI产业链等 高增长市场，拓展 新兴发展空间 。 盈利预测与投资评级： 考虑到国内外数据中心建设液冷需求稳步起量，冷水压缩机 市场空间有望持续提升，公司作为国内头部暖通设备制造企业之一，或率先受益于 需求起量；且公司有望在扩产后持续提升市场竞争力与市场份额，进一步提升公司 业绩。我们预计公司 2026-2028年营收分别达 15.03/25.08/38.1 3亿元，同比分别 提升69.3%/66.9%/52.0% ；2026-2028年归母净利润可分别达 0.93/2.15/5.17 亿 元，同比分别提升 -66.8%/129.6%/140.8% ，PE分别为 80x/35x/14x，EPS分别为 0.59/1.37/3.29 元/股，首次覆盖给予买入评级 。 风险提示： 数据中心建设进度不及预期、液冷需求不及预期、公司扩产进度不及预 期、市场竞争加剧 、测算数据或与实际情况不一致 。 买入（首次评级） 股票信息 行业 电力设备及新能源 2026年09月14日收盘价 （元） 46.95 总市值（百万元） 7,380.07 流通市值（百万元） 2,450.64 总股本（百万股） 157.19 流通股本（百万股） 52.20 近3月日均成交额 （百万元） 205.38 作者 分析师 张磊 SAC：S1070525100001 邮箱： zhanglei2@cgws.com 分析师 陈子锐 SAC：S1070525110003 邮箱： chenzirui@cgws.com 相关研究 仅供内部参考，请勿外传！ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408 公司深度报告 P.2 请仔细阅读本报告末页声明 内容目录 打造空气动力全景生态，围绕 “磁悬浮”开拓暖通设备 ................................ ................................ ...................... 4 公司发展历程与股权架构 ................................ ................................ ................................ ...................... 4 聚焦空气动力及暖通空调设备 ................................ ................................ ................................ ............... 5 整体业绩稳 破30万亿元，研发投入强度达到3.5%，集成电路、先进计算、基础电子等领域形成一批长板技术和产品，算力供给能力大幅增长。 🌹#集成电路首次突出“全链条攻关”，先进制程+先进封装+3D集成同步推进。《规划》提出提升先进制程能力，推动先进封装测试技术开发应用，持续提升关键装备、材料和零部件供给能力，并推进三维集成等技术突破；同时发展高性能处理器、高密度存储器，以及氧化镓、金刚石等超宽禁带半导体。 🌹#半导体及电子材料被直接列入重点突破清单。《规划》点名大尺寸晶片等半导体材料，以及高频高速覆铜板、低轮廓铜箔、封装基板、DAF、导电胶、电子纱/布、热界面材料；工艺材料方面重点发展先进工艺湿化学品、高性能电子树脂、金属及其氧化物/氮化物靶材、高纯石墨/石英制品、超纯微纳米铜粉及浆料等。 🌹#AI算力升级进一步放大先进材料需求。《规划》提出发展高带宽内存、高带宽闪存，突破高速互连、全光交换、液冷散热等关键技术，并支持数十万卡级人工智能集群；AI芯片方向重点提升GPGPU、ASIC、SoC等综合计算能力。随着国产AI芯片、HBM/先进存储、高速互连及3D封装持续升级，对CMP、湿电子化学品、靶材、电子特气、前驱体、电镀材料、先进封装材料、高端基板及配套PCB材料的需求有望同步提升。 🌹建议关注 #鼎龙股份、#江丰电子、#安集科技、#艾森股份、#彤程新材、#中船特气、#上海新阳、#雅克科技、#飞凯材料、#宏昌电子、#联瑞新材、#有研新材、#华海诚科。我们深度跟踪半导体材料产业链，原始文档也欢迎联系我们。 🎉联系人：孙维容/王锐#文字观点", "publish_time": "2026-09-15 23:48", "tags": ["文字观点"]}, "attachment:files/中信建投-晶合集成(688249)订单持续饱满，电源管理芯片与逻辑芯片等多元化布局-260914.pdf": {"id": "attachment:files/中信建投-晶合集成(688249)订单持续饱满，电源管理芯片与逻辑芯片等多元化布局-260914.pdf", "kind": "attachment", "title": "中信建投-晶合集成(688249)订单持续饱满，电源管理芯片与逻辑芯片等多元化布局-260914", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时 请务必阅读正文之后的免责条款和声明。 证券研究报告 ·A股公司简评 半导体 晶合集成： 订单持续饱满 ，电源管理芯片与 逻辑芯片 等多元化布局 核心观点 公司 2026Q2业绩稳健、收入和毛利率 向好。 Q2单季度实现营业 收入为 30.45亿元， YoY +15.73% ，QoQ +4.56% 。毛利率 22.09%， 净利率为 6.34%。与此同时， 公司预计 Q3收入约在 32.00亿元至 33.00亿元之间； Q3毛利率约在 25%至27%之间。 公司 2026H1实现主营业务收入 57.66亿元， 从制程节点分类， 55nm 及以下、 90nm、110nm、150nm 占主营业务收入的比例分别为 14.29%、39.38%、26.72%、19.61%；从应用产品分类， DDIC、CIS、 PMIC、Logic、MCU占主营业务收入的比例分别为 53.24%、 25.34%、12.82%、4.02%、4.25%，其中 CIS 和PMIC产品营收占 比不断提升。 事件 晶合集成8月24日晚间发布 2026Q2业绩， Q2单季度实现营业 收入为 30.45亿元， YoY +15.73% ，QoQ +4.56% ，Q2净利润为 1.93 亿元， YoY +32.04% ，QoQ +576.82% ，归母净利润为 1.95亿元， YoY -0.99%，QoQ +284.37% ；毛利率 22.09%，净利率为 6.34%。 根据 Q3指引来看， 公司预计 2026 Q3收入约在 32.00亿元至 33.00 亿元之间； 2026Q3毛利率约在 25%至27%之间。 重要财务指标 2024 2025 2026E 2027E 2028E 营业收入 (百万元) 9,249.25 10,885.45 13,192.59 16,201.98 19,431.62 YoY(%) 27.69 B6DA981D91E6DDB81F4368DBE8CC36DDA7A4AE3463F47DFE5EA7EAB9DEC4356E7D4A81E073CEA1F4003446674C31E9B282A51EA4C7E5902CE333F36A35 一个跟踪体系。我们认为在这三个指标都没有出现明确的拐点之前 ，不会进行一个主线级别的一个切 换，这是一个整体的判断。 发言人 36:29 在后续的配置思路上 ，我们也是基于刚才的历史周期的一个历史产业产业景气周期的一个复盘 ，以及当 前AI产业周期的一个定位。我们有几点配置的思路。首先第一个 ，我们还是认为科技是下半年的一个核 心的主线 ，这一点我们在近期的中期策略当中也是做了一个详细的阐述和分析。从历史复盘规律上来 看，在整个产业景气上行的当中可能比较少的出现一个主线行情的一个切换。那么真正的切换往往是发 生在景气周期见顶之后。如果他的这个产业的本身景气度没有问题 ，那么可能整体的这个主线的根基可 能难以动摇。所以往往阶段性的调整之后 ，这些主线仍然是具备非常强的一个修复动力的这是第一点。 发言人 37:37 第二个点就是行情的波动率会分放大 ，警惕这个高估值分位数的一个阶段性的回撤。那么在整个估值进 入到80%以上的这个高压业绩验证期之后 ，板块的波动必然会被放大 ，整体不能再以这个单线上涨的一 个心态去对待。我们认为后续可能更多的要去合理控制仓位跟节奏 ，避免在情绪高点追涨 ，然后利用调 整去逐步布局 ，这是第二个对于后续行情波动率的一个判断。 发言人 38:16 第三个就是对于板块配置 ，我们认为主线内部会有一个分化 ，可能更多的像业绩确定性强的环节去进行 集中。也是同样的 ，在整个板块进入到高压验证期之后 ，资金肯定是会持续向有正式订单以及业绩能够 持续兑现的这些环节去进行集中。所以看到产业链的分化可能会更加明显。具体到细分方向的话 ，我们 看到我们认为这个量增逻辑还是比较明确的 ，然后量增逻辑明确 ，竞争格局清晰以及进入壁垒高的这几 个细分领域 ，它的确业绩确定性可能更强。我们觉得像半导体设备 ，晶圆代工以及芯片 ，高端的先进封 装这些方向 ，可能既能够受益于行业的贝塔 ，又有自身的一个成长的逻辑 ，未来可能抗波动的这个能力 会更强一些。 发言人 39:29 做一个总结 ，整体先回顾一下今天的核心逻辑 ，就是我们认为每一轮有产业周期中的一个主线行情切 换，通常它不会发生在产业景气的上行当中 ，它应该是产业基本面拐点跟僵硬结构拐点的一个双重的共 振。那么当前的 AI产业还是在一个景气加速兑现的一个上行的周期 ，那短期的预期分歧和估值相话是行 情走到目前这个高压区间的一个正常现象 ，而不是一个周期的一个拐点和终结。那我们现在现阶段可能 更多的要去做的 ，或者是比较好的是既不能因为短期的上涨盲目乐观 ，或也不能因为阶段性的调整就否 认现在这个 AI产业的一个长期的一个发展趋势。后续可能还会更多的要聚焦在这个产业层面的一些拐点 的一个变化。我们也会持续跟踪云长的一个资本开支 ，包括我们之前反复提到的一个对现金流的一个变 化，投融资的一个变化 ，以及产业的紧急兑现 ，是不是能够维持着一个高速增长的一个态势 ，以及在交 易层面的一些核心指标 ，根据这个产业端和交易端两方面的情况做一些 ，交叉的验证跟判断。那这一 点，我们也会在后续的市场聚焦的观点当中 ，跟各位投资者 ，跟各位领导做及时的 ，更新跟汇报 ，希望 今天的这个复盘框架会有一点帮助和启发。今天我的分享就主要到这里了 ，也感谢各位领导的参会。 发言人 41:22 如果有其他的问题 ，也欢迎跟我们做进一步的深入的交流。 E6636BB1012F9B6DA981D91E6DDB81F4368DBE8CC36DDA7A4AE3463F47DFE5EA7EAB9DEC4356E7D4A81E073CEA1F4003446674C31E9B282A51EA4C7E5902CE333F36A35", "status": "extracted"}, "post:2026-09-15T10-25:29be996b6977": {"id": "post:2026-09-15T10-25:29be996b6977", "kind": "post", "title": "2026-09-15 10:25", "source_label": "帖子正文", "excerpt": "PCB油墨是PCB制造专用的功能性油墨，核心作用是保护电路、绝缘防焊、印刷标识、制作线路等，是PCB生产的关键材料。随着PCB行业向M9升级，对绝缘可靠性要求更严，阻焊干膜厚度从M8的15–20μm提升至20–25μm，直接增加油墨消耗", "content": "PCB油墨是PCB制造专用的功能性油墨，核心作用是保护电路、绝缘防焊、印刷标识、制作线路等，是PCB生产的关键材料。随着PCB行业向M9升级，对绝缘可靠性要求更严，阻焊干膜厚度从M8的15–20μm提升至20–25μm，直接增加油墨消耗；同时M9需低Dk/Df油墨，配方中高固含、高粘度树脂比例提升，同等涂布面积下湿墨消耗量增加约10%–15%。从产业调研下来，同等面积的M9 PCB对油墨的价值量将翻倍以上（量价双升）。25年全球PCB油墨市场空间约300亿元，其中AI类空间在70亿元左右。全球龙头为日企太阳油墨和日立化学，两家合计市占率超过60%。随着AI需求的爆发+材料的升级，PCB油墨出现了供不应求的局面，今年以来已经涨价20~30%，预计后续将进一步提价，是继电子布、铜箔后，又一通胀潜力品种。 推荐：容大感光，广信材料 PCB涨疯了，油墨这个分支还在低位#文字观点", "publish_time": "2026-09-15 10:25", "tags": ["文字观点"]}, "post:2026-09-15T09-18:e5a08948caff": {"id": "post:2026-09-15T09-18:e5a08948caff", "kind": "post", "title": "2026-09-15 09:18", "source_label": "帖子正文", "excerpt": "🎁PCB电子铜箔产业链更新：供给端硬约束+涨价传导存在时差-20260915 ⭕近期我们对 PCB 电子铜箔及设备产业链完成8场调研，观点更新如下： ➠高端HVLP铜箔供给端硬约束：HVLP4良率天花板约75%、行业实际良率50%–63%，核心设备产线仅德福具备进口设备+自研表处能力、供需缺口或持续", "content": "🎁PCB电子铜箔产业链更新：供给端硬约束+涨价传导存在时差-20260915 ⭕近期我们对 PCB 电子铜箔及设备产业链完成8场调研，观点更新如下： ➠高端HVLP铜箔供给端硬约束：HVLP4良率天花板约75%、行业实际良率50%–63%，核心设备产线仅德福具备进口设备+自研表处能力、供需缺口或持续至2029–2030年。供给硬约束不是预期，是产能与良率的物理现实。 ➠涨价传导存在环节时差：近期中小PCB厂完成4–5轮提价、Q3净利率修复至10%+，而铜箔端反馈涨价的高弹性或集中于2027年（德福判断27Q2起HVLP4成为产业链最核心瓶颈；三井26Q2 HVLP放量660吨/月略慢于预期）。当前是''PCB/CCL利润兑现期、铜箔利润蓄水期''，铜箔是本轮景气周期中偏后但弹性更大的环节。 ➠技术迭代mSAP增量主线落在铜箔环节：mSAP从光模块向服务器、交换机全场景扩展、1.6T光模块PCB全面转向mSAP，铜箔端边际变化最大在于载体箔进度超预期（三井26Q2销量407万平/月、同比+30%，2030年扩至800万平/月），国内德福（9月完成2家公司批测，10月光模块核心客户起量），铜冠、中一均已送样。mSAP工艺放量=载体铜箔放量，对应铜箔链中确定性最高的技术升级映射。 🎯关注Q3业绩拐点，推荐【德福科技】、【海亮股份】、【铜冠铜箔】、【泰金新能】、【洪田股份】。#详细报告欢迎联系对口销售。#文字观点", "publish_time": "2026-09-15 09:18", "tags": ["文字观点"]}, "post:2026-09-15T13-07:24b7bf894cbd": {"id": "post:2026-09-15T13-07:24b7bf894cbd", "kind": "post", "title": "2026-09-15 13:07", "source_label": "帖子正文", "excerpt": "#华正新材定增公告解读：净利润大幅增长、高端产品结构性放量 【东北计算机】20260915 1️⃣ 7-8月归母净利润爆发 2026年7-8月实现归母净利润 3.55亿元（同比 +9,347.18%）；实现营业收入 16.65亿元（同比 +139.90%）。", "content": "#华正新材定增公告解读：净利润大幅增长、高端产品结构性放量 【东北计算机】20260915 1️⃣ 7-8月归母净利润爆发 2026年7-8月实现归母净利润 3.55亿元（同比 +9,347.18%）；实现营业收入 16.65亿元（同比 +139.90%）。 2️⃣ 原材料成本成功传导，高等级产品毛利率改善明显 上游原材料采购单价提升（26年1-6月）：铜箔采购均价 106.13元/千克（同比 +27.61%）；玻纤布 6.26元/米（同比 +68.22%）；树脂 26.78元/千克（同比 +3  09:06", "source_label": "帖子正文", "excerpt": "【东财宏观】每日宏观资讯台（2026年9月15日）#国际重要资讯1. 【中东】美国总统特朗普14日在社交媒体发布多条帖文为其对伊朗政策辩护。特朗普称对与伊朗谈判持“开放”态度，并称美方在霍尔木兹海峡帮助石油运输，各国应对美进行“护航补偿”。", "content": "【东财宏观】每日宏观资讯台（2026年9月15日）#国际重要资讯1. 【中东】美国总统特朗普14日在社交媒体发布多条帖文为其对伊朗政策辩护。特朗普称对与伊朗谈判持“开放”态度，并称美方在霍尔木兹海峡帮助石油运输，各国应对美进行“护航补偿”。 2. 【中东】也门胡塞武装发言人叶海亚·萨雷亚9月14日表示，过去5天内，沙特发动了300余次空袭，作为回应，也门（胡塞）武装力量使用打击了沙特海米斯穆谢特的哈立德国王空军基地，胡塞武装将继续坚持“封锁对封锁、升级对升级”的准则，直至沙特停止侵略并解除对也门的封锁。 3. 【美国】克利夫兰联储前主席洛雷塔·梅斯特在接受采访时表示，“市场给出的概率似乎比我目前愿意赋予的概率更高。”预计纽约联储主席威廉姆斯和美联储理事沃勒的立场将成为关键。 4. 【美国】美国能源部长赖特表示，预计(沙特)东西向管道将很快投入运行。美国希望从中东获得更多石油精炼产品。 5. 【美加】加拿大总理卡尼表示，加拿大和美国之间有可能达成互利共赢的协议。准备坐下来与美国谈判达成协议。 6. 【英国】英国威尔士、苏格兰和北爱尔兰地方政府首席部长9月14日举行会晤，签署谅解备忘录，呼吁英国政府为宪政变革做好准备，并表示英国政府无权“阻止民主”。 7. 【欧洲】9月14日，欧洲央行管理委员会成员卡齐米尔表示，如有必要，欧洲央行将毫不犹豫地进一步加息，不过确定下一步行动仍需要时间，能源仍是通胀面临的主要风险来源。 8. 【韩国】韩国央行在近日发布的《2026年9月货币信贷政策报告》中指出，在KOSPI今年6月从8000点冲至9000点的过程中，两只股票对指数涨幅的贡献率高达99%。 9. 【乌克兰】据乌克兰国际文传电讯社14日报道，乌克兰总统泽连斯基计划前往纽约与美国总统特朗普讨论乌俄实施海上停火和“能源停火”事宜。 10. 【苹果】苹果公司14日发布了新版iPhone操作系统iOS 27，其中包括重新设计的Siri AI个人助理，据苹果介绍，Siri AI具备理解个人上下文、掌握广泛的全球信息、感知屏幕内容以及执行更多跨系统应用操作等能力。#国内重要资讯1. 【央行】中国人民银行9月14日发布公告称，为保持银行体系流动性充裕，2026年9月15日，将以固定数量、利率招标、多重价位中标方式开展5000亿元买断式逆回购操作，期限为6个月（181天）。 2. 【金融数据】中国人民银行9月14日公布的数据显示，人民币贷款增加600亿元，8月社会融资规模增加1.66万亿元，债券和股票融资在社融增量中占比超过贷款。 3. 【智能家居】商务部等八部门近日印发《促进智能家居消费行动方案》，针对智能家居消费的增长点及存在的堵点卡点，提出扩大优质智能家居供给、完善智能家居标准体系、优化社区便民服务等举措。 4. 【中小企业】国务院办公厅印发并公布了《关于加强中小企业回款难问题治理有关工作的通知》。《通知》提出4方面10条措施，包括：健全行业账款支付规则、加强大型企业支付行为监管、规范管理非现金支付工具以及强化资金传导效能和融资支持。 5. 【工信部】9月14日，工业和信息化部副部长柯吉欣表示，将联合财政部、中国人民银行等为中小微企业提供贷款贴息政策，科技创新和技术改造再贷款政策，切实降低中小微企业的融资成本。同时将设立国家中小企业发展基金二期，为中小企业转型推进发展注入长期资本、耐心资本。 6. 【AI安全】外交部发言人郭嘉昆14日在例行记者会上答问时表示，人工智能的发展关乎全人类共同福祉，各方应该共同推动人工智能开放、包容、普惠、向善。散播各种威胁叙事不符合任何一方利益。 7. 【重组】9月14日晚间，广汽集团发布重组公告。公告称，广汽集团筹划以发行股份的方式购买一汽股份持有的某整车合资公司的部分股权，并募集配套资金。交易完成后，一汽股份将成为广汽集团第二大及具有战略影响力的股东 8. 【科技信贷】上海金融监管局指出，科技信贷持续增量扩面，2026年上半年末同比增长超12%，科技保险保障稳步提升2026年上半年科技活动风险保险业务的保险金额超6600亿元。 9. 【宇树】宇树科技今日宣布，人形机器人G1全面升级，正式推出G1+。G1+围绕运动性能、感知交互、智能体验三大维度一次性带来6项升级。 10. 【石化】《中国石油化工行业循环经济蓝皮书》发布，其中指出，用生物质和二氧化碳替代化石碳源，是石化原料体系的“可再生碳入口”。预计到2030年，国内生物化工产业规模将从2025年的650亿元增至约990亿元。#文字观点", "publish_time": "2026-09-15 09:06", "tags": ["国际重要资讯", "国内重要资讯", "文字观点"]}, "post:2026-09-15T10-11:5b4de0f786ec": {"id": "post:2026-09-15T10-11:5b4de0f786ec", "kind": "post", "title": "2026-09-15 10:11", "source_label": "帖子正文", "excerpt": "【JPM摩根大通】9月15日晨报 今日重点研究： 1.（策略）中国股票策略 | 反内卷双主线：去库存赢家vs困于贸易关系不确定性的出口商 2.（消费）中国消费 | 2026上半年综述：磨底多于亮眼复苏，下半年一致预期仍偏高 3. （宏观）中国宏观、外汇及银行：范式转变将加速人民币国际化，渣打（STA", "content": "【JPM摩根大通】9月15日晨报 今日重点研究： 1.（策略）中国股票策略 | 反内卷双主线：去库存赢家vs困于贸易关系不确定性的出口商 2.（消费）中国消费 | 2026上半年综述：磨底多于亮眼复苏，下半年一致预期仍偏高 3. （宏观）中国宏观、外汇及银行：范式转变将加速人民币国际化，渣打（STAN）和中银（BOC）是主要受益者 4.（工业) 创科实业（0669）：简报会重申增长如期推进，回购缓冲下行风险、AIDC结构占比提升驱动上行空间，维持增持 5.（科技) 地平线机器人 – H：份额继续扩大而且变现模式更加灵活；维持“增持”评级 今日活动推荐： 8:00am 戴尔科技（英文） 9:00am 中国储能行业政策与装机展望（中文） 9:00am FOMC、中国8月数据与反内卷政策进展（英文） 4:00pm 菲律宾市场投资机会（英文） 4:00pm 亚洲保险业出海西方市场：机遇与风险并存？（英文） 11:00pm 美国中期选举前瞻（英文） 11:00pm 2026秋季美股点评｜互联网（英文） 近期调研和策略会推荐： 10/12-14日 中韩机器人调研 （首尔/上海） 11/16-18日 亚太科技创新与增长峰会（香港） 请各位领导关注我们每日邮件获取更多信息!#文字观点", "publish_time": "2026-09-15 10:11", "tags": ["文字观点"]}, "post:2026-09-15T08-39:36020e747717": {"id": "post:2026-09-15T08-39:36020e747717", "kind": "post", "title": "2026-09-15 08:39", "source_label": "帖子正文", "excerpt": "【中信前瞻】美股半导体大幅下跌点评（09/14）：来自放缓AI开发步伐倡议的恐惧 ------------------ 事件背景：周末OpenAI、Anthropic联手倡议放缓AI开发步伐，Anthropic建议嵌入第三方评估、引入国家监管等。同时关于该事件的讨论在产业、资本市场持续发酵，引发美股", "content": "【中信前瞻】美股半导体大幅下跌点评（09/14）：来自放缓AI开发步伐倡议的恐惧 ------------------ 事件背景：周末OpenAI、Anthropic联手倡议放缓AI开发步伐，Anthropic建议嵌入第三方评估、引入国家监管等。同时关于该事件的讨论在产业、资本市场持续发酵，引发美股市场对AI CAPEX放缓担忧，周一美股科技再次开启软、硬件之间的跷跷板行情，费城半导体指数（SOX）开盘一度下跌近6%； Dario Amodei、Sam Altman言论：从过去几年两位CEO公开言论回溯统计来看，他们似乎并不存在明显道德洁癖、绝对利他主义，其关于安全相关言论、后续实际举措之间大多时候存在明显矛盾。在当下IPO临近、前沿模型竞争持续加剧的窗口，其背后意图值得认真思考，是源于对RSI进步的恐惧、还是模型训练回报率下降，我们短期难以判断。但毫无疑问，监管强化会带来行业门槛显著上升，符合头部模型厂商的利益，也有利于市场对其存在价值、商业逻辑的定位（最强模型）； 模型越狱、入侵等威胁：所谓的Claude 模型自行''越狱''、1200多个Agent“联合入侵”等事件，相较于部分观点渲染的“有意识的危险行为”，我们更倾向于将其归类为大模型自身幻觉、长程推理能力不足等缺陷导致的模型行为的随机性、不可预测性。从这个维度出发，嵌入第三方评估、可靠对齐极为必要； 产业可能影响：这些所谓的倡议更多属于精细算计的利己安排，后续可能的政策监管亦属遥远，当下Anthropic、OpenAI能做的事情，以及带给产业的可能影响均非常有限，对半导体硬件板块的影响也将更多停留于叙事层面。我们比较容易达成的共识是：对于当下快速推进的AI产业而言，不进则退，对于模型厂商、半导体硬件厂商等均是如此； 后续市场判断：短期相关言论的发酵料将推动本就摇摆的AI叙事继续发生摆动，半导体硬件承压，对软件、互联网影响中性偏正面。我们判断，三季报开启之前，资本市场关注焦点仍将聚集于：闭源&开源模型之间的能力差距、AI货币化进展、中期选举带来的可能政策变化等。而对于Dario Amodei、Sam Altman而言，未来两个月观察他们干了什么更重要。#文字观点", "publish_time": "2026-09-15 08:39", "tags": ["文字观点"]}, "attachment:files/加息会导致流动性危机吗？20260915_原文.pdf": {"id": "attachment:files/加息会导致流动性危机吗？20260915_原文.pdf", "kind": "attachment", "title": "加息会导致流动性危机吗？20260915_原文", "source_label": "其他", "excerpt": "加息会导致流动性危机吗 ？20260915_ 原文 2026 年09月15日 23:15 发言人 00:00 各位投资朋友早上好 ，期货策略首席曹柳红和大家汇报一下我们最新的观点 ，也是各位投资者很关注的 问题。", "content": "加息会导致流动性危机吗 ？20260915_ 原文 2026 年09月15日 23:15 发言人 00:00 各位投资朋友早上好 ，期货策略首席曹柳红和大家汇报一下我们最新的观点 ，也是各位投资者很关注的 问题。就是当前美联储加息是否可能会导致美国以及全球出现流动性危机 ，首先我们做一个正本清 源，就是加息。美联储加息和流动性危机之间 ，它其实并不存在必然的关系。存在的这种流动性风 险，它背后的原因是强美元蓄势出现了系统性坍塌 ，强美元蓄势在今年上半年的时候 ，吸引全球资金回 流美国去购买美股 ，购买美债。所以今年上半年虽然美国财政部发了大量的美债 ，但是也有乔美元叙事 的支撑。所以美国至少没有发生这种系统性的流动性的风险。但是今年下半年乔美元叙事它的根基三个 根基都出现了坍塌 ，强美元趋势不在全球资金加速从美国从美股和美债当中撤离 ，这就导致了最近一段 时间的美债高利率。这才是当前美股可能发生流动性危机的一个主要的原因。 发言人 00:49 所以当前美股如果发生流动性危机 ，那么它主要原因其实就是支撑美国强美元蓄势的三个根基 ，在今年 下半年都出现了系统性的松动。而加息本质它的目的其实不在于或者说加息它事实上不会直接导致美国 发生流动性危机。因为加息的本质它的目的是试图通过树立美国列出瑛太的形象来重塑强元趋势。所以 我们一直在强调就是加息它永远不是单出 ，它永远不是张百分出。 发言人 01:14 加息一定是三张牌叠加在一起共同出牌的。那么一旦本周三美跌幅加息的话 ，那这也就意味着它必然会 伴随着每周升级以及 AI叙事的升为从 AI从纯粹的产业的贝塔升为到国家使命国家叙事的这样的贝塔。所 以家庭的本质他目的是修复强美元趋势。所以我们认为美联储加息和未来可能有两条路径存在两个方 向。 发言人 01:36 第一个方向我们认为是提交概率的情况。就如果美联储加息能够重塑成元叙事的话 ，那它会驱动全球资 金重新回流 ，回流到美国去购买美国购买美债 ，那当前美国的流动性危机就能够得到系统性的解决。但 是加息修复强美元需求 ，它的前提是美国能够在未来一个月内能够搞定医疗 ，能够打开医疗 ，这是第一 种情况。 发言人 01:55 第二种情况的话就是如果未来决绝的美国就是死活搞不低了 ，那么加息它不仅没办法重塑强美元蓄 势，反而加息可能导致强美元蓄势进一步出现坍塌。那他这会带来什么结果呢 ？这会带来全球资金更快 幅度的从美国市场撤离 ，从美股和美债当中撤离。那这种情况下加息才会加剧当前的美国的流动性冲 击。所以加息到底会不会导致美国市场发生流动性危机 ？它有个前提 ，如果美国在未来一个月内能够搞 定伊朗的话 ，那加息它不仅不会导致美国发生流动性冲击 ，加息反而能够缓解美国的流动性冲击。但第 二种情况就是如果美国没有办法搞定伊朗在未来一个月内 ，或者是美伊冲突它的局面进一步扩张 ，但美 国没有办法收拾这个局面的话 ，那么加息非常有可能会导致美国发生流动性危机。 发言人 02:37 美国发生流动性危机 ，我们认为只有战争 ，战争它是唯物的 ，美国打不赢了就是打不赢了。所以我们认 我觉得如果是三种情况的话 ，那么我们地方的消费可能要等到今年底明年初才会彻底的反转。就是一 旦美联储加息 ，美元战争升级 ，那么我们可能要等一个月后。比如说十月下旬开始 ，美国会发生流动性 冲击，那这种流动性冲击会在 11月初十月中上旬到批美联储 QE。而一旦美联储 QE，那么11月中下旬最 晚是12月12月份，我们能够看到国内政策空间 ，财政大礼包是有可能落地。那么地产和消费在 11月下 旬到12月份，它会底部彻底的反转。 发言人 14:27 第三个方向的话就是我们建议中长期去布局这个港股互联网。现在布局港股互联网了 ，就像20年去 买AI硬件是类似的。如果 20年买了 AI硬件，2020 年会非常重要。那么今年现在如果我们第三种情况发生 流动性危机的时候 ，港股恒科以及港股互联网都会跟着一波暴跌。那在这个暴跌的过程中 ，我们去不断 的去抄底港股互联网的话 ，在明年和后年 ，它应该能够有一波系统性的重估的投资机会。 E6636BB1012F9B6DA981D91E6DDB81F44668BE8CB36DDD9ADAE3463F47DFE5EA5E0B9DEC4855E7D4A81E076C2E1F40184E6674C31A9B282A5DEDDC7E5002CEC93F36A35 发言人 14:52 这就是我们今天汇报的一个主要的内容。首先第一点 ，通胀根本就不重要 ，通胀它只是加息的借口。第 二点，加息之后有两种情况 ，就是如果从强美元趋势的话 ，那就不会发生美国市场的流动性危机 ，但这 种情况出现的概率是极小的。而更大的情况是加息以后美国没有办法搞定的了。那么强美元趋势会进一 步的坍塌 ，反而会加剧全球资金从美国撤离。加息以后 ，大概一个月左右 ，那么美股可能就会出现流动 性危机。 发言人 15:19 第三个就是当前已经发生八月份已经有三次不再会三杀。如果算上九月份的话 ，就最近一个月已经出现 了五次不再会三杀。所以这个时候一旦美国加息。我们一定要做好防冲击准备。 发言人 15:31 这个就是我这次汇报的一个核心的内容 ，核心其实就是强美元叙事 ，强美元蓄势它是一切。如果重塑强 美元蓄势 ，那就没有流动性危机。但如果加息战争升级 ，但强美元叙事还是没有被重塑 ，那么就会发生 流动性危机。而我们认为第二种情况发生的概率极高。所以一旦美联储在本周三一旦美联储加息 ，我们 就一定要做好防资质。这就是我们最新的一个观点 ，谢谢各位领导。最后还是祝各位投资朋友 ，马云投 资继续禁止炒红 ，谢谢。 E6636BB1012F9B6DA981D91E6DDB81F44668BE8CB36DDD9ADAE3463F47DFE5EA5E0B9DEC4855E7D4A81E076C2E1F40184E6674C31A9B282A5DEDDC7E5002CEC93F36A35", "status": "extracted"}, "attachment:files/AIoT 芯片调研：中高端 SoC 竞争格局与产品矩阵 260914.pdf": {"id": "attachment:files/AIoT 芯片调研：中高端 SoC 竞争格局与产品矩阵 260914.pdf", "kind": "attachment", "title": "AIoT 芯片调研：中高端 SoC 竞争格局与产品矩阵 260914", "source_label": "其他", "excerpt": "A股与港股复盘 2026年9月15日 研究笔记 · 不构成投资建议 第 1 / 10 页 股票市场复盘 内银承压，油价推升全球债券收益率上扬 2026年9月15日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 今天全球宏观三条线交错。", "content": "A股与港股复盘 2026年9月15日 研究笔记 · 不构成投资建议 第 1 / 10 页 股票市场复盘 内银承压，油价推升全球债券收益率上扬 2026年9月15日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 今天全球宏观三条线交错。中国8月数据走弱——社零、投资、地产无一及预期；中东原油供应受扰，油价被推高；美债10年期收益率顺势升破5%，站上2007年以来最高位。本周美联储议息会议因此更添变数。三重压力砸向港股内银股，跌幅落在2%到3%；恒指收跌1%，收在布林带下轨之下；黄金跌至一个月新低。A股方面：工信部与国家发改委的「十五五」规划带动半导体逆市走高，与昨日美股半导体的下跌（费城半导体指数跌5.9%）方向相反。这就是我们日前讨论过的半导体分化行情。 今天的驱动力在收益率和数据，不在芯片股。中国内需疲软，叠加美债10年期升破十九年来高点，把港股银行股和黄金直接压下去；本周美联储决议尚未定夺，又把这层不确定性放大。A股半导体的政策行情支持科创板逆势上涨，二者不在同一条因果链上。 本日报要 主线段： 中国8月数据不及预期（详见本节统计局）；中东供应冲击推升油价；美债10年期收益率升破5%，创2007年以来最高（详见第4节）；本周美联储议息会议悬念被放大。三者合力压住港股：招商银行、建设银行等内银股跌2%到3%，恒指收跌1%、跌破布林带下轨，黄金跌至一个月新低（详见第2、4节）。A股半导体受政策规划提振逆市大涨，科创50涨1.55%（详见第1节），与同日走低的美股半导体（费城半导体指数跌5.9%）方向背离。这是今天另一条独立线索，不能拿来解释港股的下跌。 A股： 上证收3864.28点，跌0.54%；深证成指跌0.72%；沪深300跌0.67%；创业板指跌1.15%；科创50涨1.55%。沪深两市成交约1.63万亿元。涨跌家数：上涨超1,100只，下跌超4,300只，涨停家数超30只（中新网2026-09-15收盘稿）。内地股市已连续第四个交易日下跌。 港股： 恒生指数收24667.24点，跌1.00%；国企指数跌0.96%；恒生科技跌0.62%。 货币与汇率： 人民币中间价6.7670，较上日上调28个基点。在岸即期6.711，离岸6.712，两者基本贴近中间价。美元指数99.600，涨0.13%。央行今日开展隔夜逆回购5,970亿元，7天期操作量为零；另将开展5,000亿元6个月期买断式逆回购操作，2027年3月15日到期。 互联互通： 南向资金9月15日净买入8.8亿港元，成交746.1亿港元，买入377.4亿、卖出368.6亿。连续第7个交易日净买入，但净买规模较前一日44.7亿港元明显缩水。北向（外资）当日成交2,297.1亿元，净额按现行规则不披露。以上均为交易所收盘后公布的全日终值。 A股与港股复盘 2026年9月15日 研究笔记 · 不构成投资建议 第 2 / 10 页 统计局： 国家统计局今天发布8月数据：规模以上工业增加值同比增5.2%；社会消费品零售总额8月同比增0.4%（1—8月累计增1.1%）；1—8月固定资产投资（不含农户）同比降7.2%，其中房地产开发投资降19.9%。生产端偏强、内需（消费、投资、地产）偏弱，这一组合直接构成港股内银股下跌的背景（见第2节）。 大波动： 内地——华海清科（688120）涨8.64%、拓荆科技（688072）涨7.99%，半导体设备领涨（见本节主线段）；西陇科学（002584）涨10.01%涨停；张家界（000430）跌10.04%跌停、桂林旅游（000978）跌10.04%跌停，旅游股集体重挫。港股——宁德时代（03750）跌6.01%，新能源股走弱；招商银行（03968）跌2.94%，内银股领跌。 技术： 上证指数收3864.28点，贴近布林带下轨（3857.58），未跌破。恒生指数收24667.24点，跌破布林带下轨（24726.23），本轮回调以来首次。两图详见第1、2节。 驱动： 国家统计局发布8月社零、投资、地产数据，内需偏弱（见本节统计局）；中东供应冲击推升油价，美债10年期收益率随之突破5%、升至2007年以来最高，本周美联储议息会议悬念被放大（见第4节）；工信部、国家发改委联合印发电子信息制造业「十五五」规划，带动A股半导体政策行情，与同日下跌的美股半导体形成背离，是宏观背景之外的另一条线索（见本节主线段）；南向连续第7日净买但规模收窄（见互联互通）；宁德时代等新能源股港股走弱（见本节大波动）。 外盘/商品/国债： 美股期货（美东时间约04:00）：纳斯达克100期货跌0.8%，标普500期货跌0.5%。中概ADR与ETF、商品、国债详见第4节。 1. A股 指数 收盘 开/高/低 涨跌幅 上证指数 3864 开3880 高3892 低3858 −0.54% 深证成指 13288 开13362 高13484 低13273 −0.72% 沪深300 4450 开4474 高4497 低4445 −0.67% 创业板指 3248 开3281 高3315 低3245 −1.15% 科创50 1552 开1524 高1578 低1524 +1.55% 中证500 7562 开7551 高7642 低7544 −0.13% 中证1000 7438 开7453 高7525 低7427 −0.41% 上证50 2846 开2858 高2867 低2842 −0.52% 北证50 1029 开1015 高1034 低1015 +0.65% 沪深两市成交约1.63万亿元。 A股与港股复盘 2026年9月15日 研究笔记 · 不构成投资建议 第 3 业上面 ，像采矿 ，能化行业的增加值值在提速 ，出口的这个交货值在改善。同 时如果我们看新老动能其实分化还是比较大 ，高技术制造业的同比还是在 16.7% 的高位。但是这个传统 行业的增加值还是一个负的。另一方面我们如果看这个三驾马车里面的消费和投资 ，消费其实还是一个 从偏弱的运行的状态。 发言人 01:51 我们八月份的社 0同比是连续第二个月放缓到了 0.4%。这里面的焕新品类 ，包括像家电、家去建材这些 换新品类 ，在这个技术走低之下 ，同比是有所改善的。但是占比最高的这个在收银当中占比最高的到了 负的18.5% ，这也是 22年5月以来最大的降幅 ，所以对社林的这个边降拖累是在加大的。但如果要是把汽 车踢掉 ，整个社 0同比是 2.5%，是持平预期的。当然在 618之后我们会看到 8月份七月份八月份的这个线 上零售都是在持续回落的。 发言人 02:33 那投资方面其实前八个月的累计供应链投资的同比是 -7.2% ，然后这个比前七月负的 6.7%进一步降幅走 扩。但是如果推算单月的话 ，是从这个七月份的负的 13%左右，这个降幅收窄值的负的 11%，说明可能这 个投资在单月的这个状态稍微还有有一点改善。当然在投资当中 ，跟设备更新相关的设备投资 ，以及其 他的比如说像建安其他费用这些。这个分化还是在延续的 ，前者高后者低 ，前者往上走或者往下走 ，高 技术与传统的这个投资也是分化在延续的那我们如果看到这个工资产投资 ，虽然说这个单月稍微有点降 幅收窄 ，但是由于它还是整体偏弱的。所以我们觉得分散投资的进一步改善 ，可能还是需要存量政策发 力的加快落地的财政 ，就包括像我们目前中央债的发行进度还不是跟往年相比 ，还是比较的慢。 发言人 03:44 然后同时像新证券工具 ，我们看到虽然说九月份开始投放了一些 ，但是这个目前的体量还是比较小 哈，就是今年的审批可能还没有完全下来。如果看分项投资的分项 ，基建前八月的累计同比是从前七月 的负的 3.6%进一步走回到负的 4%。但是单算这个单月的话 ，其实八月的同比是比 7月的负的 11%是收窄 的。现在收窄到负的 7%左右，这个边界上是有一些改善的信号的。基建投资理念其实也是依然是分化 的。像公用环保、水利、公用设施管理这些是 -7%，-11% 还是比较微弱的。但是像交通运输的基建 E6636BB1012F9B6DA981D91E6DDB81F426A6BE8C936DD75A1AE3463F47DFE5EACE6B9DEC4C56E7D4A81E072C0C1F40944B6674C31F9B282A5EEB0C7E5602CED63A36A35 是2%左右，稍微好一点点。我们看到 8月份有一些高频的数据 ，比如说像沥青设备的这个开工率环比有 点回升。那我们觉得可能这个也说明有一些基建投资可能现在在边上稍微好一点。我们也看到了八月份 像发改和财政 ，都陆陆续续去督导地方的开工 ，还有中央债发行使用的这个进度上 ，可能后续中央政策 发力，我们觉得可能还是稍微有望边上有点改善。 发言人 04:58 制造业的投资前七月是百负的 1.2%，那到目前八月其实是降幅进一步走扩到负的 2.3%。虽然说有出 口AI这些产业的支持 ，像交运设备还有电子设备 ，其实这些行业投资还保持比较高的增速 ，但是内需比 较弱。我们现在看到多数的制造业的行业的投资还是处于偏弱的一个状态。然后房地产的状况是销售新 房销售是再度走弱了。我们看到 8月份的新房销售面积和金额同比降幅分别走扩到了负的 15%和负 的12%。 发言人 05:36 开发投资的跌幅也是比较阔的。房企到位资金的降幅也是进一步走过了负的 27%。然后我们看到拿地的 情况，像300城的这个宅地成交 ，面积也是同比降幅在走扩。像新开工、竣工施工 ，同比降幅都在往往 差里走哈那整个八月的房产开发投资的同比降幅 ，单月是负的 25.5% ，这个降幅虽然说比 4月份的负 的27%有点收窄 ，但是其实还是比较大的。那之后我们其实还是比较关注这个进一步稳增长政策发力的 这个节奏以及下半年稳投资的一些政策的出台以上。 发言人 06:22 好的，谢谢文杰老师。我们接下来有请策略组的分析师李欣老师来分享一下看看。好的 ，各位投资者大 家下午好。我们从策略的这个角度再看一下这个经济数据。刚才其实文静姐已经讲的非常的全面。然后 我们从宏观经济的这个层面上看 ，需求端的分化还是延续的 ，尤其是消费表现偏弱。我们看到 8月份的 这个设定同比是只有 0.4%。同时国内的投资和地产也都是维持了一个弱势 ，像是这个固固定资产投资同 比是-11% ，让房地产投资负的 26%。 发言人 07:03 在这个内需比较偏平淡的情况之下 ，出口还是维持了非常强的韧性 ，延续了一个高增长。 息，还是新⼀轮加息周期的 起点。 两种场景的定价逻辑，分别落在短端和⻓端，落点并不相同。 短端要回答的问题，现在 4 次的加息定价，正确吗？ 花旗认为，⽀撑现有定价的数据经不起追。 8 ⽉核⼼ CPI 环⽐ 0.29% ，⾼于市场预期 的约 0.2% ，但拆开看，⽆线服务⼀项环⽐ 5.9% 、对核⼼ CPI 的贡献接近 0.1% ；剔 除那个提价分项，环⽐回到 0.19% 。 花旗据此判断，核⼼通胀数据回到了环⽐涨 0.2% 的节奏，同⽐已降到 2.45% 、剔除 汽油约 2.22% ； 9 ⽉底 PCE 数据还会把核⼼读数再压低⼀档。 ⼀个分项的⼀次性提价，换来了定价从 2.5 次到 4 次的跳变。 花旗、⼤摩、⼩摩都认为，这次加息将会被渲染成⼀次性加息，⽽市场 4 次的定价明 显过度了。 ⻓端要回到的问题，是通胀趋势会持续多久，⾼油价会产⽣需求破坏吗？ 需要注意的是，美国需求对⾼油价⼏乎没有弹性。当前油价上涨已经导致了需求破 坏，全球需求同⽐降约 3.1 mbd ，拆开是亚太降 1.4 、中东降 0.9 、欧洲降 0.4 ，可北 美基本持平。美国汽油在劳动节周末创下历史最⾼季节性价格，⽽美国需求预测仍与 2025 年持平。 价格压不住需求，这句话⽀持的不是预防式，⽽是起点。 经济承受得起加息，美联储 就有加到不⽌⼀次的空间。 摩根⼤通补了⼀条历史校准， 2022 年市场定价未来⼀年 180 个基点、实际落在 450 个基点。花旗测算的 Warsh 影⼦利率（加息概率的代理变量）处历史⾼位，加息阵营 已有 4 ⼈。⽽加息⼀旦开始就需要更强的理由来阻⽌ 。 将⻓短两端的叙事摆在⼀起，⽭盾开始浮现。 市场现在是短端按起点的量级定价、⻓端按预防式加息的逻辑定价。这两件事互斥。 真相信这是加息周期起点，⻓端就该⾛的更⾼⼀些。 修复⽅向只有两个，要么短端往下修，要么⻓端往上补。 >短端往下修，靠的是通胀的内⽣部分在降。 >⻓端往上补，靠的是 Warsh 对这次加息性质的定性。机制要先说清，⻓端定价的从 来不是加息⼏次，是终点利率。 他若把这次加息放进逐次会议收紧的框架，市场就得把终端预期往上修，⻓端随之上 ⾏。他的定性因此是⽅向变量，那⻓端收益率将会更多反应市场（基本⾯）供需的定 价。 ⼆、油价会把⻓端收益率锁多久？ 这⼀问要问油价，是因为油价是⻓端收益率的驱动源。 ⾼盛说能源价格的上⾏⻛险把全球收益率锁在⾼位，⽽且这轮收益率上⾏没有伴随利 率波动率放⼤，说明推它的是基本⾯⽽不是技术因素。 花旗的读法⼀致，驱动⻓端的是能源价格⽽不是财政⻛险，美国的期限溢价指标并没 有扩张。⻓端往哪⾛，先取决于油价在定什么价。 不过，油本身此刻不是值得交易的标的，卖⽅三家的表达全都绕开了对油价⽅向的判 断，摩根⼤通做曲线形态、花旗做跨资产相关性、 Alpine Macro 做品种间相对价值。 它的重要性不在能不能交易，在于它牵着⻓端。 先看硬的那⼀块，它决定的是锁住的持续性。中东出⼝含改道近三周均值约 13.5 mbd （百万桶／⽇） ，⽐正常低约 10 mbd ，相当于全球供应少了⼗分之⼀。 这是已经在数据⾥的缺⼝，不是预期，它决定新增供给能不能在选举前补上。 成品端同样短缺，欧洲柴油裂解创下历史纪录、美国零售柴油超过冲突初期峰值。冲 击落点在下游，原油价格看着温和，不等于市场不紧。 缺⼝补不上，通胀预期就不会⾃⼰松，⻓端收益率也就下不来。 再看软的那⼀块，它决定的是松动的时点。 2027年的远期合约只在 80 美元上下，现货 107.63 美元，近⽉⾼、远⽉低，贴⽔很 深。市场并没有在恐慌现货，⽽是在确信将来必然恢复正常。摩根⼤通的量价⼝径把 这层直觉量化成了美元，前端⾼估 6 美元、后端低估 10 美元，错不在⽔平⽽在结 构。 市场⾃⼰已经把正常化定价进去， ⻓端收益率的下⾏空间就埋在这条曲线⾥。 两块并置之后，关键落在⼀个反常识处，这条线还不是红线。 摩根⼤通在原油报告⾥写了⼀句要紧的话，冲突要收场，需要跨过某条红线，可能在 经济、⾦融市场 或通胀，⽽⾄今⼀条都没有跨过。美国股市接近纪录⾼位，经济有韧 性，消费者正在硬抗通胀冲击。 ⻓端收益率上⾏本该是那条红线之⼀，但上周⻉森特不及预期的⼲预⼒度暗示了， 它 可能只是反映了美联储反应函数的转变，不是经济受不了。 油价把⻓端顶在⾼位，⽽⻓端的⾼位还不⾜以逼冲突收场，⻓端收益率短期没有下⾏ 的场景。 三、监管会打断 AI 盈利这条⽀撑吗？ 这⼀问的分量，来⾃它接的位置。⻓端收益率正在往上⾛，⾼盛说能源价格的上⾏⻛ 险把全球收益率锁在⾼位，这是分⺟在抬。 同⼀时间，摩根⼤通认为美国经济有韧性、 AI 投资⽀撑企业盈利，这是分⼦也在抬。 两边同时抬，信⽤利差和股价才都撑住了。 AI资本开⽀对盈利的拉动，因此是市场最坚定的那根⽀柱。即便油价再度往 120 美元 的场景逼近、⻓债利率已经突破前⾼，美股市场的调整反⽽不如 Q2 。 可它⼀旦塌了，那市场现在就成了空中楼阁。 北美闭源模型三巨头表示，希望暂缓模型进步速度，及时堵住 AI 失控的漏洞。 它给的机制落在训练侧，禁令暂停训练，⽽训练是算⼒需求的⼤头，已建成的产能会 ⼀次性闲置。最直接受到冲击的，就是从数字资产矿产转型成算⼒租赁商的新云⼚ 商。 图：新云⼚商盘前已经开始⼤幅下跌 其次是云⼚商，他们的海量 Capex 预期可能会⾯临回退，进⽽带动 AI 硬件⼚商的盈利 预期的下修。 不过9⽉以来的三场 TMT ⾏业峰会（ Hot Chips 、⾼盛和花旗的⾏业峰会）上的信息显 示，市场的交易重⼼已经转向推理侧，训练算⼒与推理算⼒的叙事正在分道。 上周投⾏会议给出的全部增量信息，都指向智能体落地，也就是推理，对应的链条是 CPU、服务器、存储和本地部署。训练侧⻰头现在并不在买⽅的 Wishlist ⾥。 真正该担⼼的不在训练侧，在监管的真实⽬的。 Anthropic 在 9 ⽉ 10 ⽇发布了⼀份 AI 滥⽤报告，⽤⼀整节点名中国的主要实验室做 ⾮法蒸馏。这份报告的分量不在技术判断，在它把叙事从模型安全切到了知识产权与 国家安全，为⾏政限制备好了事实弹药。 图：A家组合拳的第三招，则是表示出被招安的极强兴趣。这招在去年的 O 家上也上演 过多次。 这条路径已经有⼀例在⾛，不必再假设。 FCC 光模块禁令的动机从头到尾都是限制中 国⼚商的份额，与模型安全⽆关。监管的落点因此是按产业链逐环节切割，算⼒硬 件、光模块、开源 AI 模型。 ⽽这个落点恰好正对着推理侧，因为推理要的正是 CPU 、服务器、存储、光模块和本 地部署。 这样⼀来，周末的反应函数应该细化为三条叙事裂缝： 1）训练侧的需求担忧，对算⼒租赁的超额利润⽔平影响有多⼤？对微软等⼤ CSP ⼚商 来说，或许是个叙事压⼒缓解的边际利好？ 2）推理侧的叙事发展，能否对冲训练侧的恐慌？ 3）Anthropic 的监管组合拳，是否会放⼤ AI 硬件产业链⾥的地缘⻛险定价？ 总的来说，在接连超预期的数据⾯前，市场不仅完全定价了 9 ⽉加息，⽽且给出了后 续4次加息的定价。但外资⾏们普遍认为，拆分细项后，并不⾜以⽀撑加息周期重启 的叙事，更容易被 Warsh 定性为「预防性加息」 。 在这个背景下，⻓端收益率反⽽会被油价锁在当前⾼位。⽽上周⻉森特不及预期的⼲ 预⾏为，也暗示当前状态也尚未达到叙述转变的临界点。 油价再度逼近 Q2 ⾼点，⻓债收益率已经突破，但美股仍然历史⾼位附近，靠的是 AI Capex和AI 叙事对于盈利预期趋势的⽀撑。⽽周末 Anthropic 的「 AI 放缓」叙事，可能 会带来更多盈利层⾯的负⾯影响，需要留意后续的⾛势。 总的来说，除⾮ Warsh 在 FOMC 会议上强势宣布， 「通胀趋势不是暂时了，当前可能是 加息周期的起点」 ，否则市场的恐慌定价已经过度了。 今⽇彩蛋： 花旗在对上周的 TMT ⼤会总结⾥提到⼀个有趣的细节： 「 虽然参会⼈数众多，但表⾯数字未能揭示的是，参会者中混合型投资者的⽐例很⾼。 以往，我们总能看到⼀些积极的业绩预告来活跃⽓氛，并吸引专业投资者的关注，但 今年没有。本周与我交谈过的⼤多数 专业投资者都认为，各公司的表态⼤多是对此前 更新的重复 。 然⽽，如果你是今年夏天⼀直在减持半导体的混合型投资者，你之前可能根本没听到 过这些信息 。」 和花旗叙事能相互印证的是，作为 Warsh 和⻉森特的共同导师， Druckenmiller 适时地 放出了上周闭⻔会议的讲稿。 「-⻓债收益率⾛⾼是基本⾯投资者推动的； -不需要担⼼美国利率⾛⾼的问题，尤其是在 AI 科技竞赛背景下； -现在和上半年那种科技内部⼈⼠主导的氛围不同，他们推⾼的盈利预期幻影已经破 灭，⽽估值仍是合理位置。但 Druckenmiller 只是认为需要谨慎， AI 仓位是 6 个⽉前的 20%。」", "status": "extracted"}, "post:2026-09-15T10-31:7969eb427b01": {"id": "post:2026-09-15T10-31:7969eb427b01", "kind": "post", "title": "2026-09-15 10:31", "source_label": "帖子正文", "excerpt": "❗【天风电新】聚和材料：半导体材料布局逐渐清晰，聚焦Blank Mask、光刻胶等领域-0914 ———————————— 公司拟与聚和致远（公司实控人刘海东控制的企业）、启航基金、北京国谦、浙江见识、元禾璞华共同投资国聚同辉，其中公司、聚和致远分别认缴3、3.5亿元，占出资额的31.58%、36.", "content": "❗【天风电新】聚和材料：半导体材料布局逐渐清晰，聚焦Blank Mask、光刻胶等领域-0914 ———————————— 公司拟与聚和致远（公司实控人刘海东控制的企业）、启航基金、北京国谦、浙江见识、元禾璞华共同投资国聚同辉，其中公司、聚和致远分别认缴3、3.5亿元，占出资额的31.58%、36.84%。国聚同辉#重点关注半导体材料相关领域，并持续寻找其他意向出资者，最终公司认缴出资比例预计不超过33.33%。 本次合作方中，启航基金、北京国谦、浙江见识、元禾璞华分别认缴出资额1、1、0.5、0.5亿元，占国聚同辉出资额10.53%、10.53%、5.26%、5.26%。其中启航基金为上海市闵行区国资，北京国谦、元禾璞华均为聚焦半导体赛道的投资机构。 半导体材料领域，公司明确布局Blank Mask和光刻胶赛道： Blank Mask方面，韩国产能正推动国内头部Fab厂送样、验证工作，上海一期2万片产能同步建设中。公司已经向头部晶圆、存储厂商送样验证，年底头部存储厂预计率先放量。公司已经在Blank Mask赛道成功卡位，未来将推动国产化率、市占率大幅提升。 光刻胶方面，2月底，公司成立聚芯光新材料，聚焦光刻胶材料。国聚同辉已于近期投资聚芯光实业，该公司法定代表人为胡华勇。胡华勇是#晶圆光刻工艺专家，曾任职于中芯国际。公司或在光刻材料领域进一步布局。 🌟投资建议：光伏银浆主业看80~100亿市值。Blank Mask预计27H2开始放量，看100~120亿市值。光刻胶等半导体材料潜在期权，看100亿市值，合计看300亿目标市值，继续重点推荐。 ———————————— 欢迎交流：孙潇雅/敖颖晨#文字观点", "publish_time": "2026-09-15 10:31", "tags": ["文字观点"]}, "post:2026-09-15T10-43:34ecdd37ef5b": {"id": "post:2026-09-15T10-43:34ecdd37ef5b", "kind": "post", "title": "2026-09-15 10:43", "source_label": "帖子正文", "excerpt": "【ZX化工】AI材料观点更新 —————————— # 覆铜板端保持高增速，且增速持续提升。台湾覆铜板企业台光、台耀、联茂8月收入同比+130%、+132%、+98%，且收入同比增速仍在持续提升。", "content": "【ZX化工】AI材料观点更新 —————————— # 覆铜板端保持高增速，且增速持续提升。台湾覆铜板企业台光、台耀、联茂8月收入同比+130%、+132%、+98%，且收入同比增速仍在持续提升。rubin等服务器26H2放量，高阶CCL显著受益。 2027年高阶CCL的高强度扩产，支撑上游材料的需求，对上游材料的迭代、保供提出更高要求。 # 树脂 # 行业需求仍然非常旺盛。国内两大龙头树脂企业均保持满产状态，国内、台湾的CCL客户需求旺盛，需求指引清晰。 # PTFE方案不影响现有树脂的配方体系。 现有树脂配方体系以PPO及碳氢树脂为主，M6~M8级别CCL体系不变，相关材料性价比高，较为稳定。PTFE基材CCL，利润留存在头部CCL企业中。 # 硅微粉 # 化学法硅微粉起量。行业需求旺盛，国内头部上市公司化学法硅微粉逐步起量，龙头硅微粉企业处于上市扩产阶段。 # 硅微粉用量提升趋势不改，PTFE方案提升用量。硅微粉为高性价比选择，追求极限介电性能，硅微粉添加量会持续提升。M8~M9级别硅微粉的价值量显著提升，头部企业占据先发优势，弹性具备。 # AI、算力仍是大趋势。阶段性的扰动不影响算力基建的持续增长，龙头材料企业在下游迭代过程中经验、技术、客户持续积累，壁垒稳固，龙头占优的格局巩固。我们认为，定制化满足下游客户的需求，是在下一阶段的算力基建的胜负手。# 推荐东材科技、凌玮科技，建议关注圣泉集团、联瑞新材。 —————————— 欢迎交流~#文字观点", "publish_time": "2026-09-15 10:43", "tags": ["文字观点"]}, "attachment:files/华创证券-华海药业(600521)深度研究报告系列二：战略聚焦，经营兑现正当时-260915.pdf": {"id": "attachment:files/华创证券-华海药业(600521)深度研究报告系列二：战略聚焦，经营兑现正当时-260915.pdf", "kind": "attachment", "title": "华创证券-华海药业(600521)深度研究报告系列二：战略聚焦，经营兑现正当时-260915", "source_label": "华创证券", "excerpt": "证 券 研 究 报 告 证监会审核华创证券投资咨询业务资格批文号：证监许可（ 2009）1210号 公司研究 化学原料药 2026年09月15日 华海药业（ 600521）深度研究报告系列二 强推 （维持） 战略聚焦，经营兑现正当时 目标价： 25元 当前价： 15.62元 ❖ 战略聚焦，经营兑现正当时。站在当前时点，我们认为公司正进入资源聚焦、 产能释放和", "content": "证 券 研 究 报 告 证监会审核华创证券投资咨询业务资格批文号：证监许可（ 2009）1210号 公司研究 化学原料药 2026年09月15日 华海药业（ 600521）深度研究报告系列二 强推 （维持） 战略聚焦，经营兑现正当时 目标价： 25元 当前价： 15.62元 ❖ 战略聚焦，经营兑现正当时。 站在当前时点，我们认为公司正进入资源聚焦、 产能释放和经营兑现的新阶段。过去几年，公司围绕原料药、国内外制剂及创 新药持续进行研发投入、产能建设和商业化体系搭建，短期带来了较高的资本 开支、折旧摊销及研发投入压力，但随着新建产能陆续转固、资源配置进一步 向优势产业链集中，公司三大业务逐渐步入经营向好阶段，公司规模体量、盈 利能力和 ROE均有望进入持续改善通道。 ❖ 原料药：存量筑底，新产品放量与产能周期共振。 特色原料药业务是公司发展 的核心基础，经过多年积累公司在沙坦、普利及精神神经等领域建立了全球竞 争优势，核心沙坦价格已处历史低位，基本盘有望进入价稳量增阶段。展望未 来，随着全球小分子药物专利到期高峰来临，公司以沙班类、列净类为代表的 新品逐步商业化放量， 并向多肽等新分子类型持续拓展。 同时， 随着公司川南、 湖北赛奥等新增产能陆续投产，伴随产能利用率爬坡，规模效应下有望加速释 放利润弹性。 ❖ 国内制剂： 稳固国内仿制药领先地位，向高壁垒复杂制剂平台升级。 经历多轮 集采后，公司国内制剂逐步进入存量企稳、新品接力阶段。一方面，存量品种 价格及采购量可见度提升，公司凭借较高中选率及成本、质量、规模优势稳固 基本盘， 并持续强化仿制药头部地位， 行业集中度有望进一步提升。 另一方面， 公司持续扩充产品矩阵并向缓控释、 复方、 透皮及复杂注射等高壁垒剂型升级， 同时拓展院内、零售及基层渠道，打开存量增长与新品放量空间。 ❖ 海外制剂： 产品储备逐步兑现，销售渠道与美国工厂持续推动盈利改善 。公司 持续推进“新、难、偏、大”产品策略，已形成较丰富的美国 ANDA及FDA 暂批产品储备和成熟商业化网络。截至 2026年5月，纳入 IQVIA统计的在美 销售产品达 60个，其中 35个市场份额位居前三、 15个位居第一；截至 6月 末累计 15个产品获得 FDA暂时批准，形成后续上市梯队。随着专利到期后新 品陆续上市，叠加夏洛特工厂承接更多产品生产及政府采购业务拓展，海外制 剂收入与盈利能力有望持续改善。 ❖ 生物类似物蓄势待发，创新药开启商业化元年。 生物类似物方面，公司阿达木 单抗已进入上市申请阶段，后续有望依托既有大分子平台，并复用小分子业务 积累的海外注册、质量体系及商业化渠道，拓展欧美市场。创新药方面，首个 自主创新生物药 HB0034（IL-36R单抗）已于 2026年7月获批上市， HB0017 （IL-17A单抗） 银屑病适应症上市申请已获 CDE受理， HB0025（PD-L1/VEGF 双抗） 一线 NSCLC及子宫内膜癌三大适应症进入 III期临床， 一线 鳞状 NSCLC II期截止 2026年5月11日mPFS达16.46个月，展现 BIC潜力。 ❖ 投资建议： 我们预计公司 2026至2028年营业收入分别为 95.19亿元、 109.55 亿元和 126.45亿元（前值分别为 89.11/101.46/115.96 亿元），归母净利润分别 为12.86亿元、 12.79亿元和 15.05亿元（前值分别为 11.45/11.40/13.40 亿元）， 对应 EPS分别为 0.86元、 0.85元和 1.01元。随着原料药新品逐步进入商业化 放量阶段，国内制剂加快向高壁垒复杂制剂延伸，以及海外制剂产品储备陆续 商业化， 公司在全球医药先进制造领域的优势将进一步增强。 采用分部估值法， 公司合理估值为 367亿元（原料药及国内外制剂业务 316亿元，创新药业务 52亿元），对应目标价 25元，维持“强推”评级 。 ❖ 风险提示 ：产品价格波动及市场竞争风险；新品审批及商业化不及预期风险； 海外监管及贸易政策风险；创新药研发及项目建设风险。 [ReportFinancialIndex] 主要财务指标 2025A 2026E t:2026-09-15T13-58:7e4981297cb9": {"id": "post:2026-09-15T13-58:7e4981297cb9", "kind": "post", "title": "2026-09-15 13:58", "source_label": "帖子正文", "excerpt": "🥇天风通信 | 拓邦股份：#AI数据中心电源业务获重大突破，拐点将至！🔥事件：公司公告，#拓邦与维谛签署主供框架协议，约定拓邦为维谛提供PCBA、电子组件、机电组件及系统组装等产品，主要应用于其UPS供配电设备。", "content": "🥇天风通信 | 拓邦股份：#AI数据中心电源业务获重大突破，拐点将至！ 🔥事件：公司公告，#拓邦与维谛签署主供框架协议，约定拓邦为维谛提供PCBA、电子组件、机电组件及系统组装等产品，主要应用于其UPS供配电设备。 1、#AI数据中心战略新业务打响第一枪：本次与维谛在AI数据中心UPS的框架协议，属于公司在AIDC战略新兴方向的重大突破。截至目前，公司今年已为维谛供货2880万元，本次长期框架协议，反映维谛对公司研发、产品、制造能力的高度认可，拓邦切入后有望加速替代维谛EMS厂商。 2、#电源到液冷、江森到维谛、公司面临巨大新成长空间： 1）公司电源业务技术积累深厚，维谛UPS合作有望带来持续放量； 2）维谛为全球电源、液冷巨头，公司基于大客户战略（类比TTI），未来在HVDC、液冷线条的延伸突破也值得期待； 3）液冷散热端，江森作为全球制冷龙头之一，其上市公司主体JCI聚焦AIDC热管理作为最高战略，#而江森作为公司大客户（拓邦去年供货江森超4亿元），拓邦已经量产供货江森的液冷、风冷源控制驱动，未来有望跟随大客户持续放量； 4）此外，公司在控制、算法等核心优势显著，构筑丰富液冷产品矩阵，#在CPU/GPU芯片散热冷板、HVDC-PDU、混合AC/HVDC的PDU、BBU都有积极布局，未来液冷赛道可期。 3、增长新动能爆发在即，基本面有望迎反转：公司传统业务稳定增长（家电、工具、汽车+新能源），同时培育的自主智能新兴业务上半年3.4亿呈近2倍增长，新业务爆发提供增长新动能，#看好公司低位反转逻辑积极推荐！☎天风通信团队#文字观点", "publish_time": "2026-09-15 13:58", "tags": ["AI数据中心战略新业务打响第一枪", "看好公司低位反转逻辑积极推荐", "文字观点"]}, "post:2026-09-15T09-29:73b957c84482": {"id": "post:2026-09-15T09-29:73b957c84482", "kind": "post", "title": "2026-09-15 09:29", "source_label": "帖子正文", "excerpt": "#出处未知维谛ZJ交流要点：预制舱有望成为主流趋势，高澜股份是北美主力供应商 1️⃣预制舱需求：预制舱包括配电母线、液冷二次侧管网、网络桥架、封闭通道，有效较快AIDC基建周期并提升产品可靠性。维谛去年交付200-300套，今年预计2000套，#明年预计4000套以上（一套对应16个NVL72机柜）", "content": "#出处未知维谛ZJ交流要点：预制舱有望成为主流趋势，高澜股份是北美主力供应商 1️⃣预制舱需求：预制舱包括配电母线、液冷二次侧管网、网络桥架、封闭通道，有效较快AIDC基建周期并提升产品可靠性。维谛去年交付200-300套，今年预计2000套，#明年预计4000套以上（一套对应16个NVL72机柜） 2️⃣BOM拆分：一套售价180万美金，维谛毛利率约40%。其中配电母线成本占比35%、#二次侧管网占比30%、桥架和封闭通道占比35%。 3️⃣供应商：配电母线和封闭通道自产，二次侧管网外采。#其中高澜股份占北美约75%份额，产能性能及成本优于海外供应商。 4️⃣弹性测算：明年维谛二次侧管网54亿需求，假设高澜占75%份额，20%净利率，#对应8.2亿利润弹性。❗️维持重点推荐。#文字观点", "publish_time": "2026-09-15 09:29", "tags": ["出处未知", "文字观点"]}, "post:2026-09-15T10-33:de4894642105": {"id": "post:2026-09-15T10-33:de4894642105", "kind": "post", "title": "2026-09-15 10:33", "source_label": "帖子正文", "excerpt": "华曙高科：自主研发铜合金3D打印方案 破解液冷散热难题#文字观点", "conte WLP 产品已量产，2.5D 产品多客户验证。\n\n3. **PCB/CCL/铜箔/电子布**\n   - 今天强化的逻辑：AI 需求爆发+材料升级推动 PCB 油墨供不应求，今年以来涨价 20~30%，预计后续进一步提价；M9 升级使阻焊干膜厚度从 M8 的 15–20μm 提升至 20–25μm，且高固含、高粘度树脂比例提升，同等涂布面积下湿墨消耗量增加约 10%–15%。HVLP4 供给端硬约束，核心设备产线仅德福具备进口设备+自研表处能力，供需缺口或持续至 2029–2030 年。\n   - 今天出现的催化/验证：电子布 9 月初厚布、薄布分别涨 1.5/2 元，实际最后涨 1.5/2.5 元，预期 10 月涨价和 9 月一样；华正新材 7-8 月归母净利润 3.55 亿元，同比+9,347.18%，营业收入 16.65 亿元，同比+139.90%；金禄电子接单价持续上行，预计 2027 年利润 9-10 亿元，当前 ASP 1300 元/平方米、净利率 15%；台光、台耀、联茂 8 月收入同比+130%、+132%、+98%。\n\n4. **新能源/固态电池**\n   - 今天强化的逻辑：2027 年被视为全固态电车元年，政策支持加码、行业标准日渐清晰，固态电池也是全球科技竞争锚点；税收政策给固态电池留出成本窗口。\n   - 今天出现的催化/验证：比亚迪高级副总裁李柯表示比亚迪计划 2027 年推出首款搭载固态电池车型；中国牵头制定的固态电池 IEC 国际标准成功立项，为固态电池领域全球首个国际标准；9 月 1 日起锂电池征 2%消费税、2027 年升至 4%，固态电池和钠离子电池免税至 2028 年底；三星 SDI 计划 2027 年下半年在韩国蔚山工厂启动全固态电池量产；宁德时代获准收购与中国最大汽车制造商之一有关联的电池公司股份；今日固态电池概念走强，产业迈入实车验证窗口期。\n\n5. **液冷/电源/光通信**\n   - 今天强化的逻辑：液冷与高压化正重塑数据中心供电架构并拉动高端铜材需求，机架母线已成为高载流最优解，通过集成液冷槽实现数倍载流提升，正替代风冷母线；光通信领域 NPO/CPO 放量带来通胀，单个光引擎带宽提高、局部散热要求提升，叠加方案升级，单模块配套价值量增长 2-3x。\n   - 今天出现的催化/验证：金田铜业 2025 年芯片半导体铜材销量 4.1 万吨，其中算力散热 1.41 万吨、同比增 55%，现有铜排产能 5 万吨，并拟在越南建 3 万吨液冷及母线用高精密铜排项目；拓邦股份公告与维谛签署主供框架协议，提供 PCBA、电子组件、机电组件及系统组装等产品，应用于其 UPS 供配电设备；维谛预制舱去年交付 200-300 套，今年预计 2000 套，明年预计 4000 套以上，一套对应 16 个 NVL72 机柜；东田微三大新产品线小批量出货，传统光模块隔离器&滤光片处于紧缺、涨价周期。\n\n6. **宏观/策略**\n   - 今天强化的逻辑：8 月经济数据延续结构性特征，国内利率低位与海外通胀、油价利率双高并存；9 月加息已成定论，但市场定价是否过度悲观、加息是否会导致流动性危机成为讨论焦点。\n   - 今天出现的催化/验证：央行 9 月 14 日公告，9 月 15 日以固定数量、利率招标、多重价位中标方式开展 5000 亿元买断式逆回购操作，期限 6 个月；8 月一线城市商品住宅销售价格环比上涨，二三线城市环比降幅总体收窄；8 月一二三线城市商品住宅销售价格同比降幅继续收窄；10 年美债利率破 5%，布油逼近 110 美元；中金经济数据联合解读认为 8 月及 1-8 月主要经济数据延续今年以来较明显的结构性特征。\n\n## 三、今日重点关注\n### 3.1 今天已经发生的重点变化\n- AI 安全与“减速论”持续发酵：OpenAI、Anthropic 联手倡议放缓 AI 开发步伐，Anthropic 建议嵌入第三方评估、引入国家监管；英伟达、Palantir、Booz Allen Hamilton 要求 OpenAI、Anthropic 提供新的安全保障，并减少或停止使用两家公司最先进 AI 模型；英伟达 CEO 与特朗普通电话并拒绝放缓先进 AI 开发。\n- 美股半导体大幅下跌，点评指向“来自放缓 AI 开发步伐倡议的恐惧”；同时美股网安大涨，AI 风险被定价为网安“新需求”。\n- 半导体设备材料午后上攻：科创半导体设备 ETF 截至 13:53 涨幅超 4.34%，材料+设备超 85%；电子信息制造业“十五五”规划正式发布，强调集成电路全链条攻关。\n- PCB/材料涨价继续验证：电子布 9 月涨价落地并预期 10 月继续；PCB 油墨今年以来涨价 %，低于预期 0.80%；8 月规模以上工业增加值同比 5.2%，高于预期 4.80%；央行 9 月 15 日开展 5000 亿元买断式逆回购，期限 6 个月；广汽集团 H 股涨超 12%，拟发 A 股购买一汽股份所持合资车企股权。\u003c/li>\n\u003cli>固态电池催化密集：比亚迪计划 2027 年推出首款搭载固态电池车型；中国牵头制定的固态电池 IEC 国际标准成功立项；9 月 1 日起锂电池征 2%消费税、2027 年升至 4%，固态电池和钠离子电池免税至 2028 年底；三星 SDI 计划 2027 年下半年启动全固态电池量产；宁德时代获准收购与中国最大汽车制造商之一有关联的电池公司股份。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>AI算力/大模型与AI安全\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：有观点明确“模型没减速、算力没减速”，并认为若后续安全评测、Red Team、RL、Monitoring 加强，安全本身甚至可能增加额外算力消耗；Anthropic 签下 Rum Group 六年算力合作，长期算力锁量仍在继续。\u003c/li>\n\u003cli>今天出现的催化/验证：OpenAI、Anthropic 倡议放缓 AI 开发步伐，Anthropic 建议嵌入第三方评估、引入国家监管，引发美股半导体大幅下跌；英伟达 CEO 与特朗普通电话，两人均拒绝放缓先进 AI 开发，并称美国必须保持 AI 对中国的领先；美股网安大涨，AI 风险被定价为网安“新需求”。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：AI 算力需求推动先进逻辑、存储和先进封装同步扩产，晶圆厂建设、产线改造和设备更新仍需持续投入；半导体设备材料低位修复弹性释放。\u003c/li>\n\u003cli>今天出现的催化/验证：科创半导体设备 ETF 截至 13:53 涨幅超 4.34%，材料+设备超 85%；晶合集成订单持续饱满，电源管理芯片与逻辑芯片等多元化布局；电子信息制造业“十五五”规划发布，集成电路全链条攻关，半导体及电子材料迎政策催化；甬矽电子交流涉及 Bumping、FC、晶圆级封装及 2.5D/3D 异构封装能力，Fan-out 结构 RWLP 产品已量产，2.5D 产品多客户验证。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>PCB/CCL/铜箔/电子布\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：AI 需求爆发+材料升级推动 PCB 油墨供不应求，今年以来涨价 20~30%，预计后续进一步提价；M9 升级使阻焊干膜厚度从 M8 的 15–20μm 提升至 20–25μm，且高固含、高粘度树脂比例提升，同等涂布面积下湿墨消耗量增加约 10%–15%。HVLP4 供给端硬约束，核心设备产线仅德福具备进口设备+自研表处能力，供需缺口或持续至 2029–2030 年。\u003c/li>\n\u003cli>今天出现的催化/验证：电子布 9 月初厚布、薄布分别涨 1.5/2 元，实际最后涨 1.5/2.5 元，预期 10 月涨价和 9 月一样；华正新材 7-8 月归母净利润 3.55 亿元，同比+9,347.18%，营业收入 16.65 亿元，同比+139.90%；金禄电子接单价持续上行，预计 2027 年利润 9-10 亿元，当前 ASP 1300 元/平方米、净利率 15%；台光、台耀、联茂 8 月收入同比+130%、+132%、+98%。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>新能源/固态电池\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：2027 年被视为全固态电车元年，政策支持加码、行业标准日渐清晰，固态电池也是全球科技竞争锚点；税收政策给固态电池留出成本窗口。\u003c/li>\n\u003cli>今天出现的催化/验证：比亚迪高级副总裁李柯表示比亚迪计划 2027 年推出首款搭载固态电池车型；中国牵头制定的固态电池 IEC 国际标准成功立项，为固态电池领域全球首个国际标准；9 月 1 日起锂电池征 2%消费税、2027 年升至 4%，固态电池和钠离子电池免税至 2028 年底；三星 SDI 计划 2027 年下半年在韩国蔚山工厂启动全固态电池量产；宁德时代获准收购与中国最大汽车制造商之一有关联的电池公司股份；今日固态电池概念走强，产业迈入实车验证窗口期。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>液冷/电源/光通信\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：液冷与高压化正重塑数据中心供电架构并拉动高端铜材需求，机架母线已成为高载流最优解，通过集成液冷槽实现数倍载流提升，正替代风冷母线；光通信领域 NPO/CPO 放量带来通胀，单个光引擎带宽提高、局部散热要求提升，叠加方案升级，单模块配套价值量增长 2-3x。\u003c/li>\n\u003cli>今天出现的催化/验证：金田铜业 2025 年芯片半导体铜材销量 4.1 万吨，其中算力散热 1.41 万吨、同比增 55%，现有铜排产能 5 万吨，并拟在越南建 3 万吨液冷及母线用高精密铜排项目；拓邦股份公告与维谛签署主供框架协议，提供 PCBA、电子组件、机电组件及系统组装等产品，应用于其 UPS 供配电设备；维谛预制舱去年交付 200-300 套，今年预计 2000 套，明年预计 4000 套以上，一套对应 16 个 NVL72 机柜；东田微三大新产品线小批量出货，传统光模块隔离器&amp;滤光片处于紧缺、涨价周期。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：8 月经济数据延续结构性特征，国内利率低位与海外通胀、油价利率双高并存；9 月加息已成定论，但市场定价是否过度悲观、加息是否会导致流动性危机成为讨论焦点。\u003c/li>\n\u003cli>今天出现的催化/验证：央行 9 月 14 日公告，9 月 15 日以固定数量、利率招标、多重价位中标方式开展 5000 亿元买断式逆回购操作，期限 6 个月；8 月一线城市商品住宅销售价格环比上涨，二三线城市环比降幅总体收窄；8 月一二三线城市商品住宅销售价格同比降幅继续收窄；10 年美债利率破 5%，布油逼近 110 美元；中金经济数据联合解读认为 8 月及 1-8 月主要经济数据延续今年以来较明显的结构性特征。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>AI 安全与“减速论”持续发酵：OpenAI、Anthropic 联手倡议放缓 AI 开发步伐，Anthropic 建议嵌入第三方评估、引入国家监管；英伟达、Palantir、Booz Allen Hamilton 要求 OpenAI、Anthropic 提供新的安全保障，并减少或停止使用两家公司最先进 AI 模型；英伟达 CEO 与特朗普通电话并拒绝放缓先进 AI 开发。\u003c/li>\n\u003cli>美股半导体大幅下跌，点评指向“来自放缓 AI 开发步伐倡议的恐惧”；同时美股网安大涨，AI 风险被定价为网安“新需求”。\u003c/li>\n\u003cli>半导体设备材料午后上攻：科创半导体设备 ETF 截至 13:53 涨幅超 4.34%，材料+设备超 85%；电子信息制造业“十五五”规划正式发布，强调集成电路全链条攻关。\u003c/li>\n\u003cli>PCB/材料涨价继续验证：电子布 9 月涨价落地并预期 10 月继续；PCB 油墨今年以来涨价 20~30%；HVLP4 良率与设备瓶颈被具体量化；华正新材 7-8 月业绩爆发；金禄电子接单价持续上行。\u003c/li>\n\u003cli>固态电池：比亚迪计划 2027 年推出首款搭载固态电池车型；中国牵头固态电池 IEC 国际标准成功立项；锂电池消费税与固态电池免税窗口明确；三星 SDI 计划 2027 年下半年启动全固态电池量产；宁德时代获准收购与中国最大汽车制造商之一有关联的电池公司股份。\u003c/li>\n\u003cli>宏观数据与政策：8 月社零同比 0.4%、低于预期；8 月规模以上工业增加值同比 5.2%、高于预期；央行开展 5000 亿元买断式逆回购，期限 6 个月；广汽集团 H 股涨超 12%，拟发 A 股购买一汽股份所持合资车企股权。\u003c/li>\n\u003cli>液冷/电源：拓邦股份与维谛签署主供框架协议；维谛预制舱今年预计交付 2000 套、明年预计 4000 套以上；金田铜业算力散热铜材销量 1.41 万吨，同比增 55%，并拟在越南建 3 万吨液冷及母线用高精密铜排项目。\u003c/li>\n\u003cli>光通信/CPO：东田微全面布局 NPO/CPO“隔离器/硅透镜/FAU”，三大新产品线均小批量出货；隔离器和滤光片 26Q2 处于紧缺、涨价周期；光模块散热单模块配套价值量增长 2-3x。\u003c/li>\n\u003cli>医药：维立志博 LBL-024 肺癌数据披露，鳞癌 ORR 达 87.1%，PD-L1 阴性人群同样亮眼，62 例疗效可评估患者 ORR 为 71.0%；华海药业深度报告给出目标价 25 元、当前价 15.62 元；药石科技为分子砌块一体化 CRDMO，管线后移有望驱动收入放量。\u003c/li>\n\u003cli>机器人/自动化：宇树科技宣布人形机器人 G1 全面升级，正式推出 G1+；泰瑞达官宣与博硕科技战略合作，共同服务北美算力客户，围绕智能组装自动化、测试自动化；华为全联接大会 2026 将于 9 月 17-19 日在上海举行；北交所流动性改善预期被关注。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>AI 安全评测、Red Team、RL、Monitoring 加强是否真实增加算力消耗；OpenAI、Anthropic 安全保证要求与最先进模型使用限制对算力需求和网安订单的后续影响。\u003c/li>\n\u003cli>半导体设备材料国产替代订单与先进逻辑、存储、先进封装扩产节奏；晶合集成订单饱满的持续性；电子信息制造业“十五五”规划后续落地细节。\u003c/li>\n\u003cli>10 月电子布涨价是否兑现；HVLP4 良率、核心设备瓶颈与供需缺口持续至 2029–2030 年的验证；铜箔涨价高弹性是否集中于 2027 年，尤其 27Q2 起 HVLP4 是否成为产业链最核心瓶颈；mSAP 从光模块向服务器、交换机全场景渗透。\u003c/li>\n\u003cli>固态电池 2027 年装车节点、IEC 标准后续、免税窗口、三星 SDI 量产进度、宁德时代整合进展，以及产业实车验证窗口的进一步数据。\u003c/li>\n\u003cli>9 月加息定价与流动性危机风险；10 年美债利率破 5%、布油逼近 110 美元对全球股债和风险资产的影响；8 月社融“总量薄弱、结构换毛和部门分化”的后续变化。\u003c/li>\n\u003cli>房地产价格环比、同比降幅收窄的持续性；8 月经济数据结构性特征的延续；央行 5000 亿元买断式逆回购后的流动性环境。\u003c/li>\n\u003cli>维谛预制舱交付量、拓邦与维谛合作落地；光模块 NPO/CPO 放量与散热价值量兑现；隔离器/滤光片涨价和份额提升；金田股份液冷及母线铜排项目进展。\u003c/li>\n\u003cli>宇树 G1+、泰瑞达与博硕科技北美客户合作进展；华为全联接大会 2026；北交所主题基金上报与 Q4 流动性改善。\u003c/li>\n\u003cli>华海药业经营兑现、药石科技管线后移收入放量、维立志博 LBL-024 后续数据；零食量贩 3.0、黄金价格分析及展望、大消费专题等后续观点。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>08:37｜【招商机械】鸿仕达：AI时代自动化设备“小巨人” #北交所流动性有望迎来改善。11月15日，北交所迎来开市五周年重要节点，首批8只三个月持有期主题基金正式上报，面市后增量资金渠道有望进一步拓宽，看好Q4北交所流动性迎来改善\u003c/li>\n\u003cli>08:38｜💫华正新材定增亮点解读0914晚🌛 🐟1️⃣#涨价带来的利润大幅度显现、毛利率提升显著： 7～8月收入利润同比双高增，实现收入16.65e，同比+140%，归母实现3.55e，同比+6958%，大幅度超预期。1-8月H2 CCL毛利率达到22.99%（比H1增长7.38pct），H3达到19.21%（比H1增长5.48pct）。\u003c/li>\n\u003cli>08:39｜❗️东
