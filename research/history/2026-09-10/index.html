{"id": "post:2026-09-10T10-08:12234199e840", "kind": "post", "title": "2026-09-10 10:08", "source_label": "帖子正文", "excerpt": "直击苹果发布会❗️首款折叠屏落地，🍎全家桶升级【申万批零与社会服务业】 🎯发布会直击：今日凌晨苹果2026秋季发布会上，苹果首款折叠屏iPhone Duo登场：横向书本式内折，外屏5.4英寸、展开内屏7.6英寸（接近iPad mini），铰链由100余个精密组件构成、以3D打印25层光敏聚合物微层消", "content": "", "publish_time": "2026-09-10 10:08", "tags": ["核心标的爱施德", "文字观点"]}, "post:2026-09-10T10-58:cd71d55f87b3": {"id": "post:2026-09-10T10-58:cd71d55f87b3", "kind": "post", "title": "2026-09-10 10:58", "source_label": "帖子正文", "excerpt": "AI铜箔国产突破的加速时刻 HVLP铜箔国内进度全面超预期：1）铜冠铜箔HVLP4月出货已大几十吨→年底预计200t/月。", "content": "", "publish_time": "2026-09-10 10:58", "tags": ["文字观点"]}, "post:2026-09-10T10-09:c440f7475d29": {"id": "post:2026-09-10T10-09:c440f7475d29", "kind": "post", "title": "2026-09-10 10:09", "source_label": "帖子正文", "excerpt": "看好折叠新品放量＋Pro系列规格升级！", "content": "", "publish_time": "2026-09-10 10:09", "tags": ["文字观点"]}, "post:2026-09-10T15-50:d0df6223b1d8": {"id": "post:2026-09-10T15-50:d0df6223b1d8", "kind": "post", "title": "2026-09-10 15:50", "source_label": "帖子正文", "excerpt": "9月10日复盘笔记：绿电/PCB/存储/海工装备/消费类/玻纤/油气/煤炭/CPO/金融等一、重磅财经信息铜价逼近1.5万美元后引发“泡沫”警告 分析师称涨势或难持续二、大盘表现沪", "content": "", "publish_time": "2026-09-10 15:50", "tags": ["文字观点"]}}, "source_details": {"post:2026-09-10T07-43:99ffad7cafe6": {"id": "post:2026-09-10T07-43:99ffad7cafe6", "kind": "post", "title": "2026-09-10 07:43", "source_label": "帖子正文", "excerpt": "🔥GPT-6：循环架构升级，抬升智能上限 | 中信证券计算机GPT-6 Astra推出，端到端任务与自主操作能力显著加强 与前代GPT-5.6 Sol相比，Astra在推理与执行上实现了代际跨越：ARC-AGI-3测试从个位数跃升至99.9%，FrontierMath Tier 4达98%，OSWo", "content": "🔥GPT-6：循环架构升级，抬升智能上限 | 中信证券计算机GPT-6 Astra推出，端到端任务与自主操作能力显著加强 与前代GPT-5.6 Sol相比，Astra在推理与执行上实现了代际跨越：ARC-AGI-3测试从个位数跃升至99.9%，FrontierMath Tier 4达98%，OSWorld 2.0任务完成率从65.7%提升至72.6%且耗时从75分钟锐减至40分钟。 其核心优势在于端到端任务执行，GPT-6 Astra能直接操作电脑界面，将检索、分析、代码执行到交付物制作整合为完整工作流，在Terminal-Bench 4.0（57.9% vs 55.8%）、AutomationBench（41.4% vs 31.4%）等长程Agent测试中已超越Claude Fable 5.1等竞品。或采用循环Transformer的升级架构，有望抬升智能上限 根据the information等媒体报导，GPT-6 核心技术迭代核心为循环Transformer（Recurrent Transformer）架构升级，引入层内循环迭代+持久化KV记忆机制，无需大幅增加物理层数与参数量，通过单层网络的多次隐空间迭代就可以提升有效推理深度。同时，模型多数复杂推理步骤在隐状态内部完成，无需输出大量中间思维链Token，且持久化KV可跨时间步、跨迭代复用，彻底改变了传统架构逐层单向计算、KV实时重算即用即弃的模式。架构迭代带来算力与IO需求结构的切换，对高算力服务器硬件需求进一步抬升 一方面，内部迭代使单Token计算量小幅上升；另一方面，有效压缩任务整体Token输出量，且持久化KV缓存大幅缓解长序列场景下显存与IO带宽压力。整体来看，大模型推理瓶颈从显存IO带宽约束，一定程度上转向芯片算力利用率约束。因此，循环transformer有望拉升高算力服务器需求。循环Transformer增加思维链获取难度，理性看待对蒸馏的影响 循环Transformer架构将显式思维链转为隐空间计算，导致通过外部蒸馏手段获取模型思维链的难度增加。这对需要获取教师模型思维链过程的软蒸馏有影响，对只需要取得答案的硬蒸馏无影响。此外，随着以GPT-6为代表的模型走向端到端任务与CoWork场景，真实操作日志、执行轨迹等过程数据，其反哺价值已超越静态Benchmark答案。具备完整开发者生态与商业用户池的头部厂商，可通过真实数据闭环与RL迭代巩固优势，合成数据（RSI）则进一步放大其算法先发优势。建议关注海外算力、云产业链、国产模型及算力的相关公司： 1）海外算力，包括工业富联等； 2）云产业链，包括深信服、金山云等； 3）国产模型与国产算力，包括智谱、海光信息、中科曙光、浪潮信息等。 ========================欢迎联系中信证券计算机团队#文字观点", "publish_time": "2026-09-10 07:43", "tags": ["文字观点"]}, "post:2026-09-10T07-54:a2fa2df56bf7": {"id": "post:2026-09-10T07-54:a2fa2df56bf7", "kind": "post", "title": "2026-09-10 07:54", "source_label": "帖子正文", "excerpt": "【招商电子】再call具强劲基本面、H2业绩超预期释放的PCB产业链！#行业基本面强劲，短期季度存在超预期潜力，且新的架构变化给远期业绩带来上修的空间。", "content": "【招商电子】再call具强劲基本面、H2业绩超预期释放的PCB产业链！ #行业基本面强劲，短期季度存在超预期潜力，且新的架构变化给远期业绩带来上修的空间。 经过8月的反弹，目前PCB核心标的估值上修至对应明年19-21xPE，CCL上修至对应明年23-24xPE。展望后续，#我们整体看好此轮反弹的持续性，理由如下： 1️⃣短期基本面存在超预期潜力：进入9🈷️交易业绩阶段，结合目前行业下游的景气来看，算力领域，北美AI服务器（NV的Rubin、谷歌和AWS等ASIC新架构）处于新品拉货旺季，新增高端产能稼动率逐步满载，给Q3-Q4季度带来弹性利润空间；此外，#要重视Q3非AI领域PCB的通胀逻辑持续演绎亦将带来毛利率的向好、利润弹性释放的向上空间。9月科技公司交流会的展望以及后续的产业链调研都会让市场得到一个明确的结论：#PCB产业链Q3-Q4业绩存在较大的上修空间。所以反弹过程中的回调幅度不会很大，且即使较大也会被快速修复。 2️⃣新技术新架构有望推动PCB板块远期成长空间上修。当下据我们跟踪产业链的信息来看： 1）Rubin Ultra 架构新变化：VRU NVL576 的Oberon Rack布局从“10+9+8”调整为“9+18+9”，中间的 NVLink Switch托盘数量从 9 个翻倍到 18 个，单个交换托盘高度从 1.5U 压缩到 0.75U；可扩展版本(NPO)Switch Tray的NVLink Switch ASIC 从 2 颗增加到 4 颗。集成度和设计的复杂度大幅提升，#相关CCL材料有望进一步升级至PTFE方案，PCB板的层数亦有望进一步增加。 2）mSAP应用场景有望拓宽：今年随着1.6T光模块的规模化量产，其PCB采用6阶mSAP-SLP的设计方案，PCB行业中的mSAP产能供给变得极度紧张。往27年看，HW的计算板UHDI、Rubin的SOCAMM内存卡、三次电源垂直供电板亦将采用mSAP工艺制作，且更远期的CoWoP封装技术亦将大量采用mSAP工艺。这显示AI领域的PCB正从Tenting向mSAP升级的趋势，泛半导体化的升级有望提升PCB整体在AI系统设备中的价值量。 3）其他的新技术：a）陶瓷基板技术：考虑到单GPU功耗的大幅提升，PCB板的散热需求亦在增加，相应的在计算板中加入陶瓷基板的技术方案的必要性和可行性被产业和市场关注，产业链的开发进度已较为顺利，有望成为明天的可选方案版本；2）内埋PCB技术：集成度的持续提升，被动元件及功率器件有望被内埋进PCB中，工艺难度和价值量均有望大幅提升。 故我们认为PCB产业链未来仍存在较多可预见的技术迭代升级的催化，板块亦有望迎来“戴维斯双击”。 建议关注及排序： PCB：#【景旺电子、深南电路、生益电子、鹏鼎控股、方正科技】；沪电股份、广合科技、胜宏科技； 此外，#关注科翔股份、兴森科技、中富电路、奥士康、世运电路、博敏电子、中京电子、红板科技、超颖电子等弹性标的。 CCL：#【生益科技】、南亚新材、华正新材等；硅微粉：#联瑞新材、凌玮科技等；铜箔：#【宝鼎科技】、德福科技、方邦股份、铜冠铜箔等； 玻布：#国际复材、中材科技、菲利华、宏和科技、中国巨石等； 设备：#大族数控、芯碁微装、东威科技、泰金新能、鼎泰高科、合锻智能、三孚新科等。 欢迎交流，鄢凡/程鑫，重视9🈷️做多业绩爆发板块的窗口期！#文字观点", "publish_time": "2026-09-10 07:54", "tags": ["【生益科技】、南亚新材、华正新材等", "联瑞新材、凌玮科技等", "文字观点"]}, "post:2026-09-10T15-21:9fe3916f0fa3": {"id": "post:2026-09-10T15-21:9fe3916f0fa3", "kind": "post", "title": "2026-09-10 15:21", "source_label": "帖子正文", "excerpt": "【深南电路】核心看点：AI算力PCB+封装基板双轮驱动，载板进入量价齐升周期 ------------------------- 🧨PCB业务（基本盘+AI核心受益）：下游数据中心业务占比升至近30%，AI加速卡、服务器、光模块等应用领域快速增长。🧨封装基板业务（弹性最大板块）： 2026年H1营收", "content": "【深南电路】核心看点：AI算力PCB+封装基板双轮驱动，载板进入量价齐升周期 ------------------------- 🧨PCB业务（基本盘+AI核心受益）：下游数据中心业务占比升至近30%，AI加速卡、服务器、光模块等应用领域快速增长。 🧨封装基板业务（弹性最大板块）： 2026年H1营收翻倍增长，毛利率同比大幅提升16pcts。BT载板自2025年下半年起满产满销，存储、处理器类产品量价齐升；ABF载板全年增长来自CPU、GPU、ASIC类客户，部分海外外溢订单已开始流入。 🧨产能扩张（成长确定性支撑）： 深圳、无锡、南通已有工厂目前满产；南通四期（聚焦高多层/HDI，具备载板及mSAP能力）、泰国工厂（首个海外基地）爬坡中；无锡新厂（AI交换机、服务器、加速卡）加速产能推进。48.8亿元再融资已获交易所受理。 ------------------------- 📮近期与公司进行了深度交流，欢迎沟通#文字观点", "publish_time": "2026-09-10 15:21", "tags": ["文字观点"]}, "attachment:files/1.6T 光模块 TIM 散热材料调研：代际升级带动散热材料通胀化 260909.pdf": {"id": "attachment:files/1.6T 光模块 TIM 散热材料调研：代际升级带动散热材料通胀化 260909.pdf", "kind": "attachment", "title": "1.6T 光模块 TIM 散热材料调研：代际升级带动散热材料通胀化 260909", "source_label": "其他", "excerpt": "GPU散热方案调研：Rubin转向石墨烯过渡，液态 金属与新材料蓄势2026/09/09 要点 •GPU散热核心部件GPU、HBM、光模块及VRM均需TIM材料，GB300单GPU 及HBM配套TIM价值量约20美元，Rubin平台因材料升级价值量将进一步提升。•Rubin平台散热路线由液态金属转向石墨烯作为大规模量产替代方案，主因液态金 属存在爬移泄漏、铜", "content": "GPU散热方案调研：Rubin转向石墨烯过渡，液态 金属与新材料蓄势2026/09/09 要点 •GPU散热核心部件GPU、HBM、光模块及VRM均需TIM材料，GB300单GPU 及HBM配套TIM价值量约20美元，Rubin平台因材料升级价值量将进一步提升。 •Rubin平台散热路线由液态金属转向石墨烯作为大规模量产替代方案，主因液态金 属存在爬移泄漏、铜腐蚀及量产良率瓶颈，石墨烯被视为液态金属成熟前的过渡方案。 •石墨烯散热优势在于XY轴平面性能，但Z轴垂直散热能力受限；液态金属虽性 能更优且单颗价值量预计超20美元，但长期可靠性(5‑10年)仍是行业核心痛点。 •北美顶级客户（谷歌、微软）要求供应链完全北美化，核心配方与制造需在北美完 成；国内厂商如中石科技目前主供光模块TIM，尚未进入GPU核心石墨烯供应链。 •下一代散热技术SuperTIM(高分子聚合物)及金刚石复合材料已进入预研阶段，主 要针对谷歌ASIC等高热流密度芯片，但距离工程化量产仍有较长距离。 以下内容来自资深行业专家： Q&A 服务器散热系统主要包含哪几个需要散热的关键部件？这些部件是 否都采用TIM材料进行散热？ 服务器中需要散热的关键部件主要有四块：首先是功耗最大的GPU，其次是HBM(高 带宽内存)，然后是光模块，以及VRM(电压调节模块)，即电源模块。这四个部分都需 要散热，并且都会使用TIM材料，只是根据具体需求，所用TIM材料的类型或散热 方式会有所不同。目前公司接触到的方案主要以TIM材料为主，例如一些导热凝胶或 其它类型的TIM材料，当然也会配合使用冷板和VC(VaporChamber，均热板)。 在液冷散热方案中，TIM材料、冷板和VC是如何协同工作的？ 可以这样理解，在液冷系统中，每个需要散热的部件上都会先应用TIM材料，TIM材 料再与冷板连接。所有部件的冷板共同构成服务器的液冷系统，通过在冷板内部流动的 液体（不一定是水）将热量带走。如果不是液冷方案，则可能没有冷板这个环节。 针对英伟达GB300和Rubin平台，其TIM材料方案有何不同？ 具体到单个GPU，TIM材料的价值量分别是多少？ 目前实际应用的主要是相变材料或石墨烯等新型TIM材料。像液态金属或某些液冷方 案，可能仅用于Rubin平台中性能更高的版本，而标准版则不同。 在价值量方面，以GB300为例，公司之前销售的方案中，单个GPU及其配合的HBM 所使用的TIM材料（主要是相变材料）合计价值约为20美元，价格会有上下浮动。 对于Rubin平台，由于尚未真正大批量生产，公司预计其TIM材料的单价会更高， 但用量可能会减少。 Rubin平台相较于GB300，其TIM材料在技术上有何升级？ Rubin平台会采用性能更好的TIM材料。例如，公司之前的产品可能是7900系列， 而针对Rubin平台则会升级到7958、7950等更先进的相变材料系列。这种材料升级 导致了其价值量的提升，尽管用量可能有所减少。 请问相变材料(PhaseChangeMaterial)的具体构成是什么，其主 要成分是否为石墨烯和氧化铝的混合物？ 相变材料是一种最初应用于军工领域的材料，形态上类似胶带状的贴片。其内部是多种 物质的混合物，配方通常是保密的。可以作为填料的成分包括石墨烯和氧化铝等，但并 非固定为此两种材料的组合。 市场有观点认为GB200未使用石墨烯，而Rubin平台将采用石墨 烯，这一说法是否准确？ GB200未使用石墨烯。Rubin平台最初的技术路线确实曾考虑使用石墨烯，但后来转 向液态金属方案。在液态金属方案遇到问题后，又重新考虑使用石墨烯作为替代方案， 以支持大规模量产。 公司在相变材料中使用的石墨烯是自产还是外购？ 公司使用的石墨烯是外购的。 在相变材料的终端产品供应市场中，除了霍尼韦尔，还有哪些主要参 与者？ 除了霍尼韦尔，市场上的主要参与者还包括钢泰、汉高以及陶氏化学等。陶氏化学业务 范围广泛，在这一领域也有所涉足。 这些相变材料供应商的市场份额分布情况如何？ 目前没有对各家供应商的市场份额进行过具体评估，因此尚不清楚详细的市占率情况。 在相变材料领域，是否有国内或台湾地区的公司参与竞争？ 有国内公司正在进行样品测试和认证，但具体进展尚不明确。台湾地区有多家公司在此 领域进行布局，日本也有相关企业参与。整体来看，这个行业的供应格局相对分散，不 像GPU或芯片制造那样高度集中。 相变材料的技术壁垒是否不高？另外，是否所有GPU都需要使用 最高性能的相变材料？ 并非如此，能够生产高性能相变材料的公司并不多，霍尼韦尔等几家是其中的佼佼者。 在应用层面，并非所有场景都需要最高规格的材料。 例如，一个GB200或Rubin机柜，其GPU数量（如英伟达宣传的72颗）会根据 客户的算力需求和成本预算进行调整，并非所有客户都会采用满配72颗GPU的方 案。只有在对算力要求极高的配置中，才会使用性能最好的相变材料；而在标准或低配 版本中，则会采用性能要求不那么高的材料。 有市场消息称，石墨烯原材料在每颗GPU上的价值量约为150元 人民币，这似乎高于最终相变材料140美元的价值量，请问如何解 释这一差异？ 150元人民币的价值量数据可能不准确。从实际应用来看，高性能的石墨烯或液态金属 主要用于TIM1或TIM1.5（即GPU芯片与冷板之间的导热界面材料），部分公司也 称之为TIM2。而在VRM等其他散热需求不高的部件上，仅使用普通的硅胶等材料。 因此，石墨烯的实际使用量和价值远低于市场传闻的水平，单颗价值量达到100多元 人民币的可能性不大。 在GPU散热方案中，石墨烯材料具体应用于哪个位置？是用于 GPU与盖板之间的TIM1，还是盖板与冷板之间的TIM2？ 在散热结构中，GPU与盖板之间通常应用TIM1或TIM1.5，而盖板与冷板之间应用 TIM2。目前，TIM1层面已有采用相变材料和石墨烯的方案出现。对于TIM2层面， 最初在NVIDIA的RubinUltra版本规划中，曾考虑使用液态金属而非相变材料，但 由于存在泄漏、腐蚀及良率等问题，最终方案可能转向石墨烯。因此，将TIM2原有 的部分材料更换为石墨烯或石墨方案，是一种在液态金属技术成熟前的替代选择。综合 来看，TIM1和TIM2两个层面都有应用石墨烯的可能性。 与石墨烯相比，液态金属作为散热材料的性能和成本如何？NVIDIA 为何倾向于选择液态金属？ 液态金属在性能上优于石墨烯。评估散热材料不能仅看单一的导热率参数，液态金属与 散热器件及散热板的接触更为紧密，综合散热效果更佳。 成本方面，液态金属比石墨烯更昂贵，尽管其单次用量可能更低，但整体价格会更高。 NVIDIA官方倾向于选择液态金属，但目前由于爬移泄漏、铜腐蚀以及封装良率等技术 难题尚未完全解决，因此暂时转向了石墨烯方案。可以认为，石墨烯是当前阶段的一个 过渡性解决方案，最终的技术方向仍是液态金属。 目前液态金属在GPU散热应用中的单颗价值量大约是多少？有观 点认为仅为十几元人民币，这个估算是否准确？ 目前液态金属尚未实现规模化量产，因此无法提供精确的单颗GPU价值估算。不过， 从技术和材料角度分析，其价值远不止十几元人民币，无论是应用于哪个具体环节，其 价值都应高于此水平。 类似德邦科技这样的液态金属材料供应商，能否直接向NVIDIA供 货，还是必须通过散热方案厂商？其产品供应模式是怎样的？ 这类材料供应商通常无法直接向NVIDIA供货，主要原因是难以通过NVIDIA的认证。 即使他们生产出液态金属产品，也需要通过认证环节，而这一认证过程门槛很高。因此， 他们需要与公司这样的散热方案厂商合作。在合作模式上，他们提供的液态金属原材料 基本不需要公司进行太多额外加工，但必须通过公司的体系完成最终的认证，才能进入 供应链。 国内的石墨烯材料供应商，例如中石科技或思泉新材，是否能直接向 NVIDIA或其组装厂供货？如何区分\"产业链\"和\"供应链\"的概 念？ 国内的石墨烯材料供应商无法直接向NVIDIA供货，甚至公司这样的散热方案集成商 也不是直接供给NVIDIA，而是供给其下游的组装厂。 需要明确区分\\\\“进入产业链”与“进入供应链”\\\\的差异。一个原材料供应商，例如氧 化铝生产商，将其产品卖给霍尼韦尔，可以说自己进入了产业链，但这个范围非常宽泛。 而“供应链”则特指处于上游关键环节、与最终产品直接相关的供应商。国内厂商在宣 传时，这两个词的用法存在差异，供应链的层级和重要性远高于产业链。 在TIM(热界面材料)市场中，主要的市场参与者和竞争格局是怎样 的？ 汉高与霍尼韦尔处于绝对的垄断地位，是市场的两大巨头。其他厂商如陶氏、信越化学 (Shin‑Etsu)等属于第二梯队。随着液态金属方案的出现，美国的Indum公司也成为 一个重要的参与者，NVIDIA曾直接与其合作开发相关产品，其液态金属技术较为领先。 如果GPU散热方案中部分采用石墨烯材料，是否会改变当前由汉 高和霍尼韦尔主导的市场竞争格局？ 至少从目前情况来看，即使在散热方案中增加了石墨烯材料，也未观察到市场竞争格局 发生显著变化。现有的市场份额分布预计将保持稳定。 假设明年(2027年)GPU出货量达到2000万颗，若以单颗GPU 石墨烯价值150元人民币计算，市场规模将达到30亿人民币。对 于这样的市场需求，北美地区的石墨烯供应链能否满足？ 公司的石墨烯产品生产主要集中在墨西哥和北美地区。关于原材料的来源，则可能是全 球化的，例如来自中国、中东或其他地区。具体的供应链细节无法透露，但产能布局主 要在北美。 北美工厂的具体业务是石墨烯的生产还是仅限于加工？ 北美工厂的业务核心是配方开发与产品制造，而非生产石墨烯原材料。具体来说，核心 的工艺和配方环节在美国宾夕法尼亚州完成，随后基于这些配方生产出例如7950等型 号的最终产品。公司不涉及最底层的原材料生产，例如氧化铝和石墨烯等均从外部采购。 考虑到公司外购石墨烯原材料，为何没有与市场上一些知名供应商 (如鸿富诚)合作？ 针对核心客户，例如谷歌或微软的数据中心机柜项目，目前普遍要求供应链实现完全的 北美制造。虽然市场上存在一些供应商，如泰吉诺等，但他们可能主要服务于一些非核 心的定点项目，而非直接供应给这些顶级的北美客户。 北美地区是否有石墨烯原材料的生产工厂？原材料主要从哪些地区 采购？ 据了解，北美当地的石墨烯原材料生产能力有限。主要的采购来源地是中国或中东地区。 展望明年(2027年)，考虑到GPU和ASIC芯片的需求增长，石 墨烯原材料是否存在短缺的风险？ 石墨烯并非应用于所有芯片产品，主要用于一些先进型号，如Rubin或300系列。 因此，其市场需求并未达到2000万颗GPU的总量规模。如果未来市场确认所有高 性能芯片均采用石墨烯方案，那么可能会出现短缺。 然而，目前液态金属方案因存在一些技术问题而未能广泛应用。一旦这些问题得到解决， 部分高功率密度ASIC（尤其是推理类芯片）以及RubinUltra版本的机柜可能会转向 选用液态金属，这将影响石墨烯的最终需求量。 各类AI芯片的功率情况如何？除了英伟达的GPU，哪些类型的芯 片会使用石墨烯散热方案？ 英伟达RubinGPU的满载功率大约在2000瓦上下。谷歌的ASIC芯片总功率较低， 约为1000瓦，但其芯片面积也更小，导致单位面积的功率密度（每平方毫米的功率） 可能比GPU更高。因此，这类高功率密度的ASIC芯片也会采用石墨烯散热方案。 相比之下，一些较早的产品系列，如200系列、100系列，以及其他普通IC和光模 块等部件，则不会使用石墨烯。 石墨烯和液态金属作为散热方案各自的技术优劣势是什么？ •石墨烯：在XY轴（平面方向）的散热性能较好，但Z轴（垂直方向）的散热能 力相对较差，构成应用瓶颈；无铜腐蚀问题，技术成熟。长期运行后散热性能依旧会发 生衰减。 •液态金属：垂直方向散热性能更优，综合散热效果更佳；成本更高。存在爬移泄漏、 铜腐蚀、大规模量产良率、5‑10年长期可靠性等行业痛点。 石墨烯可以视为液态金属技术成熟前的过渡方案。 液态金属散热方案存在已久，为何其泄漏问题至今仍未得到有效解 决，是否意味着该技术路线存在根本性难题？ 液态金属的泄漏问题在实验室或小批量层面已经可以解决，但核心挑战在于大规模生产 时的良率无法保证。散热系统对于服务器机柜等需要长期稳定运行的设备至关重要，任 何故障都可能是致命的。与计算单元不同，例如72颗GPU中一颗失效，其余71颗 仍可工作；而散热系统一旦出现问题，将导致整个系统瘫痪，影响更为严重。因此，在 大批量生产中确保其五年甚至十年的长期可靠性，目前仍然存在问题。 与液态金属相比，石墨烯散热方案在长期可靠性方面表现如何，是否 存在类似的问题？ 石墨烯材料不存在液态金属所面临的铜腐蚀等问题，技术相对更为成熟。然而，所有液 冷散热材料，包括石墨烯，都面临一个共同的行业痛点，即经过长期运行（如五年、十 年）后，散热性能会不可避免地出现衰减。材料在长期运行中必然会发生变化，完全保 持初始性能是不可能的。 行业内一个关键的衡量指标是材料在运行五年或十年后，其散热率能保持在初始状态的 百分比。例如，若能维持在80%，已属业界领先水平。对于一些成立时间不足五年的 国内厂商，其宣称的五年或十年质保承诺在业内看来是缺乏可信度的。 国内厂商中石科技(中石)在TIM(热界面材料)领域的市场地位和 业务进展如何？ 传统的TIM厂商，例如中石科技，目前尚未进入GPU的石墨烯TIM供应链。中石 科技主要涉足光模块领域的TIM供应，与一些传统的硅脂供应商有原材料层面的合作， 但供应量并不大。对于GPU这类核心部件，即使国内厂商技术领先，NVIDIA等公司 也不太可能将如此重要的环节完全交由单一国内供应商负责。 除了液冷方案，未来是否存在进一步TIM技术路线？ 是的，目前业界正在探索更前沿的散热方案。 1.一个方向是被称为SuperTIM的高分子聚合物材料，但该技术仍处于早期研究阶 段，具体细节尚未公开。 2.另一个方向是金刚石复合材料，少数厂商正在进行相关研究。这种材料并非直接使 用块状金刚石，而是将金刚石粉末与聚合物结合，制成一种新型TIM材料。 金刚石复合材料的应用前景和目前的研发进展如何？ 金刚石复合材料目前主要被视为下一代TIM的解决方案，而非替代冷板。理论上，其 优异的性能使其具备应用潜力，但商业化仍需考虑成本因素。谷歌等公司对其表现出较 高的兴趣，尤其是在其ASIC芯片散热方面。虽然ASIC的单颗功耗低于GPU，但 其芯片面积小，导致单位面积热流密度极高，对散热材料提出了更严苛的要求。 目前金刚石复合材料已进入预研阶段，主要针对谷歌等客户下一代芯片每平方毫米3 瓦的高热流密度需求做初步开发验证；仿真与初步设计性能尚可，但距离工程化量产还 有很长距离。", "status": "extracted"}, "attachment:files/液冷龙头调研：谷歌液冷项目放量延后 260909.pdf": {"id": "attachment:files/液冷龙头调研：谷歌液冷项目放量延后 260909.pdf", "kind": "attachment", "title": "液冷龙头调研：谷歌液冷项目放量延后 260909", "source_label": "其他", "excerpt": "液冷龙头调研：谷歌液冷项目放量延后，液冷业务业 绩兑现面临预期差（2026‑09‑08） 要点 •谷歌2MW液冷项目备料已覆盖，但进度慢于预期，预计2027年方可大规模放 量。•谷歌CDU需求总量预计5,000‑7,000台，1.4MW因技术成熟仍为当前主流， 2MW方案竞争激烈，供应商多达8‑10家。", "content": "液冷龙头调研：谷歌液冷项目放量延后，液冷业务业 绩兑现面临预期差（2026‑09‑08） 要点 •谷歌2MW液冷项目备料已覆盖，但进度慢于预期，预计2027年方可大规模放 量。 •谷歌CDU需求总量预计5,000‑7,000台，1.4MW因技术成熟仍为当前主流， 2MW方案竞争激烈，供应商多达8‑10家。 •液冷渗透率提升不及预期，风冷仍能满足当前多数算力需求，全液冷方案在未来 8‑10年内难以完全实现。 •公司美市场拓展实力偏弱，集成式液冷方案仍处于PPT阶段，干冷器等配套产品 竞争力及成本控制尚无优势。 专家Q&A 谷歌2兆瓦液冷项目订单市场分歧 关于该项目的后续情况，市场存在两种截然不同的消息：一种认为项目进展顺利，前景 乐观；另一种则认为后续订单并未落实。第二种声音目前传播较广，但其真实性有待商 榷。 谷歌2MW项目备料生产进展；2026Q3‑Q4交付预期 项目正在执行中，但整体进度慢于预期，原期望在2026年Q3开始放量，但至今尚 未实现。预计Q4会有一定交付量，但规模不会太大，真正的放量可能要等到2027 年。 谷歌1.4MW与2MW订单分布 近期包括1.4兆瓦产品在内的订单总量中，1.4兆瓦产品的订单占比较大，主要由宝 德等供应商承接，其交付量稳定在每月50至80套。 谷歌同时采购1.4MW液冷产品的原因；主流交付版本 谷歌目前主要交付的产品版本是V5、V6和V7，其中V6和V7是主打型号，V5仅 有少量库存。V8版本可视为工艺更先进、功耗更低的升级版。之所以继续采购1.4兆 瓦产品，主要是因为该方案经过长期应用，技术成熟稳定，且大规模采购带来了更高 的性价比，符合其稳健运营、避免风险的策略。 谷歌2MW项目供应商竞争格局；新进入者影响 谷歌2兆瓦项目的供应商竞争非常激烈，市场上知名和不知名的参与者合计可能多达 八到十家。除了几家主要供应商外，还涌现出许多新成立或液冷交付经验较少的公司， 这些公司虽然行业知名度不高，但具备一定的背景实力。谷歌对供应商持开放态度， 只要能按技术要求提供样机即可参与测试，这导致国内供应商之间竞争加剧，陷入\" 内卷\"状态。例如在2026年7月和8月，仍有新的供应商在提交样机，测试结果预 计在10月至11月公布。这些新参与者普遍将目标市场瞄准2027年，预计从Q2 开始发力。 谷歌2MW项目值得关注的新进入厂商 市场上出现了一些新的竞争者，例如申菱、深度智冷、广东东阳光以及同飞等公司都在 积极参与该项目。 国内供应商获取谷歌项目信息的时间差 国内供应商获取的信息通常会比谷歌的内部规划至少落后半年。 CDU需求预测下调，市场需求存在高估可能 关于CDU的需求预测，最初提及的每年2万台可能偏高。从个人观察来看，实际需 求可能并未达到如此高的水平。这种审慎判断主要基于以下几点：首先，V8的出现并 未被视为一项革命性的巨大进步。其次，深入了解美国AI市场后，包括谷歌内部部 分团队也认为市场存在一定程度的夸大成分。回顾过去四至五年的行业发展，每一年 市场对未来的预期都极为乐观，但最终的实际数据，无论是数据中心的部署规模还是 液冷方案的渗透率，都远未达到预期值，且差距显著。 液冷渗透率与GPU迭代关系；新一代GPU是否必须液冷 尽管液冷渗透率的提升与GPU迭代存在一定关联，但这并非唯一决定因素。从实际应 用来看，风冷方案目前仍能满足包括光模块、硬盘、以及相当一部分CPU和GPU的 散热需求，并非所有场景都必须采用液冷。液冷的应用更多是基于多种考量：它代表 了技术进步的趋势；是为未来功耗更高、不得不采用液冷时的前期技术验证；同时也 受到投资方决策和商务层面因素的影响。液冷方案在节能方面优势显著，尤其在美国 电力短缺的背景下，这一点尤为突出。然而，目前液冷方案的风险依然较高，其初期 投资和后期运维成本并非所有用户都能承担。因此，尽管全液冷是未来的一个方向， 但预计在未来八到十年内也不可能完全实现，没有绝对的必要性。 液冷实际部署进度对比市场预期 无论是国内还是海外市场，液冷方案的实际部署进度普遍严重落后于最初的规划。国内 市场前几年声量很高，但实际落地的数据并不理想。在海外，包括AWS、Meta、甲 骨文、微软在内的主要参与者，其项目进度均大幅低于各自的预期。许多采用风冷方 案的数据中心，从H100时代至今仍在稳定运行，并未出现明显的算力短缺问题。很 多项目建设更多是着眼于未来的规划布局，而非当下的迫切需求。 2026谷歌CDU整体需求；已下单/已交付规模 预计2026年谷歌的CDU需求总量在5,000至7,000台之间。这个预测涵盖了1 兆瓦、1.4兆瓦和2兆瓦等所有型号。截至2026年8月，市场整体已交付的总量 大约为3,000台。需要注意的是，谷歌的采购模式是与具体项目紧密绑定的，其采购 计划会根据项目的提前或滞后进行动态调整，并非严格执行固定的年度采购计划。 谷歌CDU供应商体系、竞争地位、交付情况 目前在中国大陆市场，谷歌CDU的主要供应商是宝德和英维克。相较而言，宝德在技 术储备和交付量上处于领先地位，其作为美资企业，在获取订单方面具备天然优势。 宝德的研发团队在国内规模接近300人，远超英维克不到30人的团队规模。其他 厂商如艾特网能和讯凯在CDU领域的实力相对较弱。 谷歌CDU项目对企业业务的影响 为全力保障谷歌项目的交付，公司目前已基本停止承接其他新的CDU订单，对于一些 小批量(如一两台)的订单，则会采取委外贴牌的方式处理。 谷歌CDU技术方案确定、核心零部件供应商指定模式 谷歌在项目初期会向市场广泛征集供应商进行合作开发。以宝德为例，其早期积极参与， 与其他主要供应商一同，根据谷歌的要求分享控制逻辑与设计单元，通过不断调整、完 善并吸取各家之长，逐步形成了当前的产品结构和控制逻辑模式。方案定版后，谷歌 会对供应商的生产线(如自动化水平、无尘车间等级)、企业规模、技术人员配置及交 付经验等方面进行严格评估以确保产品质量和可靠性。同时，由于产品结构和内部所 有零部件都经过了样机验证，谷歌会直接指定核心零部件的供应商。 CDU水泵零部件供应商选择逻辑 谷歌会主导核心零部件供应商的选择。以水泵为例，目前宝德在其CDU中大批量使用 的是一个美国品牌的产品。尽管国内供应商如飞龙和三花、大元也与宝德有过接触， 并进行了样机验证和论证，但最终选择权在谷歌。其核心逻辑是在谷歌允许的供应商 范围内，选择价格最低的方案。 新供应商引入策略；海外零部件交付瓶颈 引入新供应商的策略是分阶段进行的。首先，供应商必须通过验证才有供货资格。在项 目前期，会先确保有一批通过验证的供应商来满足\"从无到有\"的需求。一旦供应稳定， 便会扩大供应商规模，以获取成本、交期或多元化方面的优势，从而培养整个供应生 态。新供应商的引入通常是在项目进行中，一边交付现有订单，一边验证新供应商。 这些新加入的供应商可能获得的是项目中后期或尾期的订单。 目前，谷歌指定的海外板换和水泵供应商确实存在交付周期和产能瓶颈，因此当前正 处于一边交付、一边验证新供应商的阶段。 液冷系统功率上限、未来趋势 液冷系统的功率不会无限增大，系统设计需要讲究各部件的匹配性，而非追求单个部件 的极限性能。目前来看，功率发展到3兆瓦已接近上限，再往上提升的经济性和可靠 性会降低。预计未来若干年内才会有新的技术突破带来功率的进一步提升。 CDU单价 CDU的单价大约在170万人民币左右，具体价格会根据汇率有所波动。 CDU水泵技术特点与品牌 目前CDU中使用的水泵是谷歌指定的海外品牌，并非磁悬浮泵或屏蔽泵等先进技术， 而是已在市场上应用多年的传统产品。由于被谷歌指定，其采购成本相对较高。内部 曾探讨过切换为屏蔽泵的方案，但研发部门评估后认为切换难度较大。除了当前指定 的品牌，还有另一家海外品牌的水泵产品也表现不错，并在公司其他产品线上有过应 用。 环境管网业务进展 公司向客户推广自有的环境管网产品，并已通过客户验证。该产品本质上是不锈钢管， 技术门槛不高，关键在于工艺控制。对于为谷歌CDU配套的环境管网项目，仅物料 成本就接近2000万元，加上生产制造成本，总成本约2000万元。目前尚不清楚谷 歌是否采购了其他供应商的环境管网产品。 环境管网与CDU价值占比 公司内部将环境管网和CDU视为两款独立交付的产品，而非一个整体来核算。因此， 公司作为设备和部件供应商，更关注自身产品的销售，并未详细核算其产品在客户项 目总成本中的具体占比。通常，总包方、集成方或IDC运营商会从整体项目角度去计 算这类占比数据。 谷歌不再追加采购传闻核实 目前无法确认此消息的真实性，但确实从供应商处听到了类似的传闻，即谷歌可能不再 增加采购额度或追加采购。这一传闻的来源尚不清楚，也未找到确切的溯源，但其内 容与公司当前表现似乎并不完全相符。 市场传闻数亿元订单规模核实 市场传闻的数亿元订单规模可能包含了储能、D系列等其他业务线的总和，并非单一接 头业务的订单额。实际上，专门负责接头业务的部门在2026年已被合并，相关销售 负责人也已离职。2026年1月至今，所有交付均为样品订单，用于验证，并未产生 批量订单。 液冷接头市场竞争地位；订单增长驱动因素 在液冷接头市场，公司目前被定义为排名第四的供应商。业务能否起量在很大程度上依 赖于前三家供应商(如丹佛斯等)是否出现问题。如果主要供应商供货稳定，公司的订 单量将很难增长。未来的机会可能在于英伟达的Rubin平台，如果公关和价格策略得 当，或许能获得一部分订单。 CDU市场竞争格局、需求现状 CDU市场的竞争非常激烈，但真正的优质供应商并不多。竞争激烈的主要原因是市场 需求尚未完全释放，需求量过少。对于供应商而言，接到几十台的CDU订单就已经 算是公司级别的大单。 资本市场对液冷业务的预期 资本市场在2025年推高公司市值，主要基于几点预期：首先，液冷趋势将在2026年 和2027年大规模兴起；其次，市场传闻公司进入了谷歌和Meta的ASIC液冷供应 商名单，成为首家进入北美大型CSP厂商供应链的A股上市公司，因此被视作行业 龙头。当前，市场期待公司在2026年第四季度开始兑现业绩，特别是谷歌V8和英 伟达Rubin液冷平台的订单。 北美市场业务拓展实力与策略 目前与微软、AWS等客户的合作基础还不够深入。但公司一直在努力开拓市场，能否 成功存在不确定性。 和天弘合作的初衷 这一逻辑基本符合当时公司的实际考量。当时公司非常重视与天弘的合作，希望借此进 入由台湾厂商主导的供应链体系。对于谷歌、Meta等客户而言，他们也希望在英伟达 供应商之外引入新的供应方，以避免供应链过于集中，这为公司提供了切入机会。2025 年公司市值的大幅上涨，正是基于这一市场预期。 天弘合作的实际作用 天弘的角色和影响是多方面的。首先，天弘的引荐本身就是一项重大的帮助和成就，当 然其付出与回报是成正比的。通过与天弘的合作，公司的算力冷板产品才首次真正实 现了大规模量产。在此之前，该产品在过去四五年间始终停留在小批量、灰度测试和 样品阶段。这次量产也暴露了公司在研发、工艺、制造、设备及交付等多个环节的不 足，导致现阶段需要通过委外贴牌的方式来逐步提升交付能力。展望未来，在天弘业 务中的份额大小将取决于市场情况，因为竞争对手也在积极争取天弘的业务。客户关 系并非一成不变，重要关系的维护不代表全部，且客户方的人员也可能发生变动，因 此存在一定的不确定性。尽管如此，2026年天弘对公司的带动作用非常显著，与天弘 的合作项目毛利率非常高。 2026年除液冷板、CDU之外批量出货业务 2026年除了液冷板和CDU，主要的批量订单还包括字节跳动的一些订单以及储能领 域的部分液冷订单。除此之外，没有其他大规模的批量订单。 2026Q3、Q4业绩展望 展望未来，第三季度的业绩不会有大的改观，将维持空调、储能等业务的正常交付节奏， 液冷业务也基本维持现状，字节跳动的订单已交付完毕，预计不会有重大的新订单注 入，业绩不会出现飞跃式增长。第四季度的表现则存在不确定性，需要观察谷歌项目 的交付与付款情况以及合同签订进展。 集成式液冷/集装箱方案进展 维谛推出的集成了液冷和电源的SmartAisle解决方案在北美市场反响良好。公司内部 有类似的产品规划，但目前仍停留在PPT阶段，尚未制造过样品，也未曾有过交付。 维谛在该领域具备先天优势，因为其空调和配电柜均为自产，整合难度较低。相比之下， 公司仅有空调产品，配电柜是短板，且之前在矿机业务中积累的相关技术储备不多， 许多部件依赖委外。虽然理论上可以开发此类产品，但目前客户对公司的方案并不看 好，公司也不会投入资金去开发一个可能在半年后就过时的产品。 国内集成液冷方案厂商；申菱、同飞进展 据了解，中航光电也在进行相关布局。申菱和同飞则没有推出此类产品，申菱的情况与 公司类似，方案同样停留在PPT阶段，尽管其之前有过交付矿机的经验。 干冷器产品竞争力、技术现状、定价策略 干冷器并非公司的强势产品，在竞争力或价格上均无优势。该产品线的发展历经波折： 最初由LCS部门负责，但两三年间未取得实质性进展；后因市场需求，被IDC部门 接手，几年内也仅产出样机，市场销量有限；近期，公司决定再次将其划归LCS部 门。这种反复调整导致产品发展停滞。目前产品的性能表现中规中，成本控制也不理 想。唯一有利的因素是，公司曾为比特大陆的蚂蚁矿机提供过干冷器，可以借鉴部分 经验进行改造，使产品达到勉强可用的水平 增长引擎，维持中性（Neutral）评级，12个月目标价 70美元（基于25倍归一化EPS 2.80美元）。 数字半导体与AI：支出强劲，供给受限 博通与高通均强调AI支出环境极为强劲，但供给约束主要集中在数据中心基础设施端（土地、电力、外壳），而非上游芯片组件。客户能见度已延伸至两年以后，部分甚至更远。博通明确表示供给是其AI收入展望的主要制约因素，但公司凭借定制芯片设计、先进封装与AI网络的差化能力，有望持续获取份额。高通则将其数据中心业务定位为多元化战略的核心，FY29目标150亿美元中，亚马逊定制芯片合作、Humain AI加速器及Meta CPU机会构成清晰路径。此外，博通推出350亿美元XPV战略融资工具，与Blackstone和Apollo合作，可支持超过20GW的AI计算容量，在加速基础设施部署的同时将资产负债表风险降至最低。管理层预计AI经济价值的大部分将归属于拥有领先前沿模型的开发者，当前1GW AI集群可产生约300亿美元收入，对应约100亿美元年化运营成本。 半导体设备与晶圆代工：AI驱动结构性扩产 Camtek订单积压至7月已达6亿美元，覆盖逻辑、封装与HBM存储等多元化应用，管理层称当前需求环境为公司历史上最佳，预计2026年下半年环比增长超30%，2027年将是强劲增长年，增速有望与或超越行业WFE支出。Hawk与Eagle 5产品预计2026年贡献超半数收入，毛利率有望在未来几年升至54%-55%。格芯方面，数据中心/通信基础设施仍是中期关键增长驱动，硅光子收入预计2028年末达到10亿美元以上年化运行率，2030年末达20亿美元。智能手机业务短期构成逆风，但公司高附加值市场敞口可部分缓冲影响。格芯计划增加资本开支，重点在现有300mm晶圆厂内将硅光子产能提升10倍。 公司专场要点 高通（Qualcomm） • 亚马逊合作：涉及定制芯片与连接产品，高通向亚马逊发行认股权证，对应未来10年最高600亿美元数据中心产品采购额，首期归属15%并附带亚马逊前期承诺，是FY29数据中心目标的核心支柱。 • AI收入目标：对FY27数据中心收入50亿美元目标高度确信，FY28预计强劲增长。亚马逊、Humain及Meta CPU三大驱动 alone 即可清晰勾勒150亿美元路径。 • 软件战略：以Modular为AI软件核心支柱，强调硬件无关架构，实现软件栈与底层芯片解耦，显著降低移植成本与供应商锁定。 • 智能手机：AI驱动新一轮换机周期，高端设备差异化在于端侧算力、内存与连接。内存成本通胀对入门级手机冲击更大（内存占BOM超50%），低端市场持续承压。 • 汽车与机器人：汽车计算内容从Gen3到Gen5增长8倍，公司从芯片向集成模块与完整方案延伸，汽车硬件栈为机器人产品路线图提供强力杠杆。 • 利润率：预计毛利率大致稳定，低毛利定制产品被高毛利商品产品抵消，运营支出增速低于收入，三年内运营利润率有望接近30%。 博通（Broadcom） • 客户关系：与Google长期合作持续深化，与OpenAI在Jalapeno定制芯片项目上合作，并与Anthropic建立战略关系。 • 供给瓶颈：土地、电力与厂房建设是AI部署主要瓶颈，供应链约束相对可控且更直接受公司影响，因此重申AI收入目标。 • 客户融资：XPV结构旨在加速AI基础设施部署，350亿美元合作可支持20GW以上计算容量，为新兴AI实验室提供有吸引力融资，同时限制博通直接财务风险。 • 价值创造：前沿模型所有者将获取大部分AI经济价值。当前行业训练支出约2000亿美元/年，前沿与开源平分，但前沿模型贡献约75%行业收入（约1200亿美元收入 vs 约1000亿美元成本），开源模型仅约300亿美元收入。 • 开源 vs. 专有前沿模型：长期AI价值将主要向领先前沿模型开发者集中，而非开放权重模型。 Camtek • 订单积压与2027增长：订单积压增至6亿美元，需求环境历史最佳，预计2026年下半年环比增超30%，对2027年高度确信。 • 毛利率趋势：Hawk与Eagle 5收入占比超50将推动毛利率持续上行，成本效率、ASP提升与产品组合优化有望推动毛利率未来几年达54%-55%。 • 传感器与光子学：相机传感器与硅光子（占6亿美元积压约5%）不一定稀释增长。 • 中国业务：中国收入占比约45%，预计中国与亚洲整体仍将是主要收入来源，中国市场需求趋势与全球一致。 格芯（GlobalFoundries） • 数据中心与硅光子：硅光子是核心增长驱动，800V DC转型提供增量。公司预计光学连接采用已发生，支撑硅光子收入目标。 • IP业务收购：近期IP收购增强代工战略合作，并作为独立业务扩展，客户反馈积极，技术改进加速。 • 智能手机逆风：预计近期SMD收入同比下滑低双位数，受内存成本驱动的单位需求破坏影响，但高端市场敞口表现优于低端。 • 资本开支：正增加CapEx并计划明年进一步增加，但投资规模将被数据中心与物理AI需求增长所覆盖。硅光子产能可在现有300mm厂内提升10倍。 估值与风险（高盛观点） • 高通（中性，160美元）：上行风险包括数据中心CPU进展超预期、智能手机份额企稳/提升、ARM PC渗透加速；下行风险包括智能手机份额流失大于预期、汽车与IoT收入爬坡慢于预期。 • 博通（买入，540美元）：下行风险包括AI基础设施支出放缓、定制计算业务份额流失、非AI领域持续库存消化、VMware竞争加剧。 • Camtek（中性，160美元）：上行/下行风险包括芯粒架构显著推迟、未能传导涨价、HPC驱动收入中期增长超预期。 • 格芯（中性，70美元）：上行/下行风险包括智能手机市场动能增强、额外美国制造补贴、成熟制程定价压缩、长期协议（LTA）下滑。#文字观点", "publish_time": "2026-09-10 20:13", "tags": ["文字观点"]}, "post:2026-09-10T09-02:4d79d3138736": {"id": "post:2026-09-10T09-02:4d79d3138736", "kind": "post", "title": "2026-09-10 09:02", "source_label": "帖子正文", "excerpt": "20260909复盘 宏观： 1. 布伦特原油期货今天突破100美元/桶关口，创7月24日以来新高。2. 欧美国债市场再度掀起抛售潮，美国10年期国债收益率日内一度创出2023年11月以来最高水平，欧洲多国国债收益率全线走高。", "content": "20260909复盘 宏观： 1. 布伦特原油期货今天突破100美元/桶关口，创7月24日以来新高。 2. 欧美国债市场再度掀起抛售潮，美国10年期国债收益率日内一度创出2023年11月以来最高水平，欧洲多国国债收益率全线走高。 3. 美国财政部将在周四回购最多60亿美元长债。 4. 贝森特谈日元:想跟我对着干尽管来。 5. 国内CPI同比0.8%，核心CPI同比1%，PPI同比3.8%。8月能源价格同比涨幅由0.6%大幅扩大至4.1%，消费电子价格集体上行。 人工智能： 1. 卖方：从光tim厂商了解到，zjxc已经开始尝试在1.6t tim加入金刚石微粉模式。华为、海光、hwj：推进金刚石微粉+铜复合冷板方案、纯单、多晶金刚石片方案都在推进。台积电：金刚石和芯片封装在一起。 2. Openai企业端业务收入首度反超C端，6-7月年化营收增长20%，并拟弃用Token计费改按业务成果定价；公司预计到2030年算力支出累计达7500亿美元，当前公司仍然深感算力严重不足。 3. 卖方：AI 的第三阶段了，也就是取代白领的工作，这个 TAM 是 4T 美金（全球上市公司 SG&A 费用 10 万亿，G&A 费用是 4万亿）。 4. 谷歌宣布在芬兰投资至少130亿欧元（约151亿美元）建设AI数据中心基础设施，为欧洲最大单笔投资。 5. 卖方：scale across 超级周期开启，订单即将外溢国内。 6. 知情人士证实DeepSeek备战科创板IPO 中信已入场尽调。 7. 传博通会重点保障索尔思1.6T DSP供应。 8. 传闻nv打算绕过模块厂，直接采购光引擎。（都说假） 9. Meta Muse具备自主执行能力，能代表用户完成日常任务，标志着一个尚未被市场定价的重大产品周期的开始，试用体验良好（界面精致、功能丰富、集成新闻流、支持免费层级），同时可能对Google核心搜索及OTA业务构成新的分流风险 。 半导体： 1. 长鑫已着手第四代高带宽存储器(HBM3)的试生产，但初期良率迟迟未能提升。据悉，其良率停滞在25%。 2. 功率大厂瑞萨电子宣布对产品价格体系进行调整，新价格将于2027年1月1日起正式生效。 航运： 中东-中国VLCC TCE上涨至76万美元/天，刷新历史新高。美湾-中国接近21万美元/天，西非-中国近 24万美元/天均接近前高。 农业： 日本农林水产省将进口小麦价格上调12%。 煤炭： 1. 卖方：现在开始一直到2028年3月都是选举换届大会年，安全责任更为重要，煤价也会一直高位。 2. 生意社动力煤基准价升至972.75元/吨，月内涨幅达11.11%。 金融： 9月10日15：00国新办就金融领域贯彻落实“十五五”规划、推动金融强国建设有关情况举行新闻发布会。 策略观察： 1. 今日成交18732亿，缩量105亿。指数维持震荡，创业板被权重和宏观因素压着，科创板被三季度国产预期一般压着，上证倒是没啥压着，就是缺少能涨的主心骨，只有红利支撑，金融没看到发力理由，不知道会不会因为明天盘后发布会去拉一下。 2. 板块方面，煤炭（价格+防守）、有色（商品价格+博弈晚上贝森特）和交运（厄尔尼诺+中东）领涨。科技今天仍然受压制，费半昨天收盘回落+油价等宏观因素+担心光博会结束兑现，不过压不住短期催化较多的细分，今晚截止发稿，也没啥特别利好，贝森特不够给力，油价利空持续但也没引起大跌。 3. 题材方面，农业低位继续活跃，高位也不算差，航运反正也归类到一起了，这块反正不单纯看作是防守，是真的短趋势。科技仍然聚焦在短期锐度高而且筹码好的方向，光模块设备+金刚石散热，其他更有基本面更有信仰的（也就是筹码相对更差的）就表现得不尽人意，光纤利好顶板炸板就马上放量了，小光也回落很多，宏观因素仍然压制着科技，产业新叙事还需要时间来演绎，这时候只有筹码结构好（边际变化蹲的人少也行）的细分先走出来了。 4. 今天家里2岁的鹦鹉早逝，今年还有养了十几年的狗子走了，敲完复盘最后一个字，才能把伤感的情绪释放出来。市场不是生活的全部，感觉市场充满不确定性的时候，就多看看生活里的美好吧。#文字观点", "publish_time": "2026-09-10 09:02", "tags": ["文字观点"]}, "attachment:files/存储设备调研：公司扩产及企业级产能规划 260909.pdf": {"id": "attachment:files/存储设备调研：公司扩产及企业级产能规划 260909.pdf", "kind": "attachment", "title": "存储设备调研：公司扩产及企业级产能规划 260909", "source_label": "其他", "excerpt": "存储设备调研：公司扩产及企业级产能规划，各类设 备国产化率、进展及份额预期，核心零部件国产替代 瓶颈2026/09/09 要点 1、公司扩产及企业级产能规划；2、各类设备国产化率/进展及份额预期", "content": "存储设备调研：公司扩产及企业级产能规划，各类设 备国产化率、进展及份额预期，核心零部件国产替代 瓶颈2026/09/09 要点 1、公司扩产及企业级产能规划； 2、各类设备国产化率/进展及份额预期； 3、核心零部件国产替代瓶颈。 专家观点 请介绍一下公司当前的扩产情况，以及今明两年的产能规划是怎 样的？ 目前，Fab1和Fab2均已实现满产状态。Fab3的设备正在进场安装，预计2026年 11月至12月开始投产,在2027年下半年达到满产目标。至于Fab4和Fab5,项 目用地已获批，但仍处于筹备阶段，具体时间表尚未确定。可以确定的是，这两个工厂 的规划产能均为每月10万片。 在Fab1、Fab2和Fab3这三个工厂的产能规划中，消费级和 企业级产品的占比分别是多少？ 各个工厂的产品结构规划有所不同。 •Fab1目前以消费级产品为主，占比约为85%,主要生产128层TLC和QLC产 品，应用于PCSSD等领域；企业级产品占比为15%,主要供应筛选后的高规格128 层TLC产品。 •Fab2的消费级产品占比略有下降，约为70%,主要生产232层TLC和QLC的 消费级硬盘；企业级产品占比则相应提升至30%以上。 •对于新建的Fab3,规划上消费级产品的比重将降至50%,企业级产品占比将提升 至50%以上。待其核心的294层产品生产成熟后，最终目标是将企业级产品占比提 升至60%,消费级产品占比降至35%。 从整个公司的层面来看，当Fab3满产后，消费级与企业级产品的整体产能结构将大 致为6:4。 在企业级产品中，应用于AI、传统服务器和车规等不同领域的 具体构成是怎样的？ 在企业级产品的下游应用中，传统服务器是主要部分，约占\\\\50%的份额。应用于AI领 域的产品占比约为30%左右。剩余约15%\\\\的产品则用于车规级控制等领域。消费级 产品则不涉及AI应用，主要为普通的SSD盘等产品。 关于2026年的新增产能，市场普遍预期为6至7万片/月， 请问如何理解这一差距？ 市场预期的6至7万片/月新增产能，可能是将产能爬坡的过程也计算在内。 关于Fab4和Fab5的建设计划，目前的进展如何？从动工到 投产，通常需要多长时间？ 目前有两项明确的进展：首先，Fab5的规划产能为每月10万片；其次，位于武汉产 业园区的建厂地块已经确定，目前处于规划阶段。由于建厂周期较长，即使现在动工， 也无法在2027年底前投产。通常从动工到最终建成，大约需要13至14个月,因此 新工厂最快也要到2028年才能投产。厂房建设会先于设备采购启动，厂房主体建设到 可以进驻设备的状态，一般需要10到11个月。 未来Fab4的国产化率趋势是怎样的？ 未来Fab4的设备国产化率将会在现有基础上进一步提高。 在刻蚀设备方面，Fab3的国内外供应商格局是怎样的？中微公 司和北方华创在其中的供应占比及产品分工有何差异？ 在Fab3的刻蚀设备采购中，国产设备占比约为55%,剩余部分仍由海外供应商供应。 主要的海外供应商是LamResearch和TEL。 在国产供应商中，中微公司占据主导地位，份额约为60%,北方华创的份额则相对较小。 从技术分工来看，中微公司主要提供用于HAR堆叠孔工艺的CCP刻蚀设备,而北方 华创则主要供应ICP刻蚀设备和去胶设备。尽管两家公司在技术上可能存在重叠，但 上述分工是目前供应的主力格局。 在化学机械抛光环节，Fab1、Fab2与Fab3的供应商格局有 何不同？国产设备导入情况如何？ 在化学机械抛光环节，Fab1和Fab2中，AppliedMaterials占据约\\\\60%\\\\的份额， 国产供应商华海清科占比较低。而在Fab3中，随着混合键合和CMP的批量导入， 国产化率显著提升，华海清科的份额接近70%,AMAT的份额则降至约30%。尽管国 产设备已大规模应用，但在一些微小凹凸控制方面，海外设备仍具有微弱优势。 在清洗设备领域，Fab1、Fab2与Fab3的供应商份额是怎样 的？ 在清洗设备领域，即使在较早的Fab1和Fab2产线中，盛美上海的份额也已达到50%, 与海外供应商TEL各占一半。而在Fab3中，盛美上海的份额进一步提升至接近 70%,TEL的份额则相应降至约30%。 在炉管、热处理及离子注入等环节，Fab1、Fab2与Fab3的 供应商构成有何变化？ 在炉管、热处理及离子注入环节，较早的Fab1和Fab2产线中，北方华创的份额略 低于50%,约为44‑45%,海外设备占比约55%。而在Fab3中，北方华创的份额大 幅提升至接近65%,海外设备降至35%。这主要是因为炉管设备国产化程度非常成 熟，而离子注入等部分仍需依赖海外设备。 在量测与缺陷检测领域，Fab1、Fab2与Fab3的供应商格局 及国产化进展如何？ 在量测与缺陷检测领域，国产化水平相对较低。在较早的产线中，海外设备占比高达 85%,其中KLA是主要供应商，份额约75%,国产供应商中，精测电子份额约7‑8%, 中科飞测约5‑6%。在Fab3中，海外设备(主要是KLA和AMAT)依然占据主导， 份额约75%,国产设备份额提升至约25%。 中科飞测在公司的产品验证进展如何？ 中科飞测的CD‑SEM样机已经完成，目前正在进行工艺验证。不过，EBI(电子束复 查)设备的验证进度相对较慢，尚未准备就绪。该产品目前仍在验证中，尚未达到在线 量产的闭环使用标准，仍处于实验室离线复查阶段。从缺陷拍照回看的效果来看，其表 现尚未达到KLA级别。具体而言，在缺陷检出的灵敏度、误报率以及长时间连续生产 的稳定性等方面，表现尚属一般。 针对Fab4和Fab5的规划，其技术节点和产能规划是怎样 的？ Fab4和Fab5已确定不再生产128层产品。Fab4将会导入5.0技术，其产能规划 中，294层产品将占据一半。Fab5的产能规划预计也将与Fab4类似。 随着Fab4和Fab5的层数增加，设备价值量是否会相应提 升？ Fab4和Fab5的设备价值量目前尚未确定。 在刻蚀设备领域，整体国产化率预计能达到什么水平？ 整体刻蚀设备市场的国产化率冲上70%没有问题,但能否达到80%尚不确定。 芯源微的第四代涂胶显影设备在公司的验证进展如何？ 芯源微的涂胶显影设备目前仍在验证过程中，进展比较缓慢。 在量检测设备领域，预计FAB4和FAB5的国产化率能提升 到多少？ 量检测设备的国产化率提升空间有限，因为国产设备在这一领域确实比较薄弱。先进的 电子束缺陷检测仍需依赖KLA等厂商的设备，国产设备目前主要覆盖OCD和宏观缺 陷检测，在微小缺陷检测方面能力还不足。无论是明场还是暗场检测，国内厂商的表现 都比较一般。 在刻蚀设备领域，华创和中微的订单份额是否有变化？ 两家公司的份额没有太大变化，基本维持原有格局。即使存在一些小的微调，也并未出 现大的格局变动。 芯源微第四代机台的验证目前在哪个环节？ 芯源微的设备目前处于厂内加产线验证的阶段。在非关键层的量产验证进展尚可，但批 量导入进程没有那么快，实现工艺量产还很难。这涉及到进行长期的稳定性与自动化对 接、关键通孔层的颗粒控制、膜厚均匀性控制，以及多台设备并线运行时对仪器稳定性 的更高要求。 涂胶显影环节国产化率低的原因是什么？除了芯源微，国内还有 其他有竞争力的厂商吗？ 目前国产厂商中只有芯源微在涂胶显影设备方面做得稍微好一些，其他厂商表现都比较 一般。这个环节国产化难度大，因为它并非简单的滴胶、转片、显影，而是需要协同联 动的整套系统。目前能进入前道12英寸产线的国产厂商也只有芯源微。该设备对热盘 的温控精度、旋转的流体控制、颗粒与微污染的管控、显影的流体控制，以及硬件机械 手的时序和软件充电协议等都有非常高的要求，其他国内厂商在这些方面都还不行。 KLA在海外的设备交付出现问题，这对公司的扩产是否有影 响？ KLA的交付问题肯定会产生影响。不过由于FAB1和FAB2时期采购的设备数量较 多，目前尚能应对。 目前国内外主要半导体设备厂商的交货周期分别是多久？ •海外厂商 ￮LamResearch普通刻蚀机：约13至14个月 ￮AppliedMaterials：基本需要一年 ￮TEL：约11至12个月 ￮ASM：13至14个月 ￮KLA光学量测设备：约一年；电子束量测设备只能调拨存量翻新机，交付特殊。 •国内厂商 ￮北方华创刻蚀机、PVD、炉管：8‑9个月 ￮中微公司CCP刻蚀机：10个月以内 ￮拓荆科技：9个月 ￮华海清科CMP：7‑8个月 ￮盛美上海：7‑8个月 ￮芯源微：7‑8个月 ￮中科飞测光学量测：6‑7个月；电子束样机：约一年 在PECVD设备领域，北方华创和中微公司是否会对拓荆科技 的市场份额构成挑战？ 目前来看，拓荆科技仍然占据主要市场份额，其设备在公司产线的使用效果良好。 当前半导体设备行业的通用付款周期和付款方式是怎样的？ 不同供应商的付款周期和方式各不相同。对于海外供应商，从生产验收的周期通常为3 到6个月，完整的合同周期基本需要两年。国内供应商的完整合同周期稍短，大约在 一年半左右。目前国内设备采购普遍采用的付款方式是\\\\\"3331\"模式\\\\。 从设备应用端的角度看，哪些零部件环节存在价值量高、技术壁 垒强且国产化有待突破的情况？ 存在技术瓶颈的零部件主要有以下几个方面： 1.高端射频电源及匹配器：刻蚀设备领域，国产低功率射频电源尚可；CCP刻蚀大 功率主射频发生器国产存在差距，国产设备仍采购海外射频源。 2.静电卡盘：核心为温度均匀性控制；国产处于小批量验证阶段，整体表现一般。 3.高端分子泵与干泵：国产真空泵可在次要腔体试点；CCP主反应腔高负载工况尚 未量产放行。 4.高精度质量流量控制器：普通工艺MFC国产上量快；ALD工艺高精度MFC国 产无法满足。 5.高精度陶瓷热盘：涂胶显影关键部件，芯源微相关产品仍在验证。 6.微量流体计量泵、中空轴高精度电机：高精度光刻胶泵海外主导；国产样机长时间 运行易流量漂移、结晶阻塞。 7.电子束设备核心组件：电子枪、电子光学柱依赖海外；备件更换需要美方审批；高 速FPGA信号采集芯片海外采购。 8.超高真空阀门、特殊密封件、高纯气密管路：严苛工况以海外VAT等为主；国产 在批量一致性、漏率、稳定性存在差距。 9.特种陶瓷粉体原料：氮化铝、氧化铝粉体主要来自德山、住友，制约国内陶瓷零件 量产稳定性。 臻宝科技所处的零部件环节，其国产渗透率未来趋势如何？ 该领域的国产渗透率肯定会持续提升。随着晶圆厂整体国产化率的不断提高，对上游零 部件的国产化需求也会相应增加，因此渗透率将会逐步提升。 目前在CP测试和FT测试机领域，国内外主要供应商格局是 怎样的，国产厂商的进展如何？ 在测试设备领域，海外厂商爱德万和泰瑞达占据主导地位。国产厂商主要包括精智达、 御渡半导体和长川科技等。御渡半导体目前主要提供离线工程测试设备，尚未进入量产 机台的生产阶段。长川科技的存储FT整机尚未进入公司的量产验证阶段。精智达则在 老化测试和KGD分选方面有所放量，其CP测试机主要集中在中低速试点应用，而 高速CP和FT主机尚未进入主产线。总体而言，目前测试环节仍以爱德万和泰瑞达 为主。 在公司的测试设备供应商中，爱德万、泰瑞达和精智达各自的份 额占比情况如何？ 目前在公司的测试设备中，爱德万是绝对的主要供应商。泰瑞达其次。精智达的份额还 比较小，大约在5%左右。 展望未来，哪家国产厂商最有潜力大规模替代爱德万和泰瑞达的 高价测试机？ 从潜力来看，精智达可能是最有机会的厂商。其他厂商目前看还不太成熟。例如，联讯 尚未进入产线验证阶段，他们可能在长鑫存储那边有所进展。目前，包括精智达在内的 高端测试机，在公司都还处于比较初期的阶段，仅限于一些中低速的试点应用，尚未进 入更深入的测试阶段，因此短期内实现大规模替代还比较困难，预计到2027年都很难 看到显著进展。 精智达目前送测的机台具体是哪种类型？ 精智达目前送测的是用于CP测试的中低速机台。 各类半导体设备的大致单价是多少？ •刻蚀设备：Lam刻蚀机约8000万元/台；中微CCP刻蚀机5000余万元；国 产普通ICP刻蚀机约2500万元。 •薄膜沉积设备：国产PECVD2700‑2800万元；金属ALD海外6000万元；北 方华创PVD2300‑2400万元。 •CMP设备：约1800‑1900万元。 •清洗设备：约1600‑1700万元。 •炉管设备：约1500‑1600万元。 •量测设备：中科飞测光学检测设备约3400‑3500万元。 •探针台：约2400‑2500万元，主要依赖海外。", "status": "extracted"}, "attachment:files/封装调研：CoWoS‑L 技术进展及量产良率 260909.pdf": {"id": "attachment:files/封装调研：CoWoS‑L 技术进展及量产良率 260909.pdf", "kind": "attachment", "title": "封装调研：CoWoS‑L 技术进展及量产良率 260909", "source_label": "其他", "excerpt": "封装调研：CoWoS‑L技术进展及量产良率，公司 封装供应商导入规划，HBM3E供应及2027年产品 放量预期2026/08/31 要点 1、CoWoS‑L技术进展及量产良率；2、公司封装供应商导入规划", "content": "封装调研：CoWoS‑L技术进展及量产良率，公司 封装供应商导入规划，HBM3E供应及2027年产品 放量预期2026/08/31 要点 1、CoWoS‑L技术进展及量产良率； 2、公司封装供应商导入规划； 3、HBM3E供应及2027年产品放量预期。 专家观点 请介绍一下目前国内先进封装行业的整体情况，包括主流技术、 主要参与者以及各自的技术进展？ 目前国内在先进封装领域，特别是针对算力芯片产品，主流应用的是2.5D封装技术， 未来可能会向3D封装发展。在2.5D封装中，国内主要采用的技术路径是CoWoS, 该技术流程以台积电的技术为蓝本。行业内的头部企业主要有三家：通富微电、盛合晶 微和长电科技。具体到CoWoS‑S技术,即通过硅中介层连接一颗GPU和数颗 HBM颗粒的2.5D封装，在国内已相对成熟。通富微电、长电科技和盛合晶微均已实 现大规模量产，且良率表现良好。 寒武纪除了与通富微电合作外，在先进封装领域还有哪些供应 商？其新款芯片的封装方案是怎样的？ 对于CoWoS‑L技术,寒武纪同时在与盛合晶微和长电科技进行接洽。其计划于 2026年至2027年开始放量的新款芯片690,其封装业务由盛合晶微承接。这款芯片 采用的方案并非真正意义上的CoWoS‑L,而是先将一颗芯片与四颗HBM封装在一 起(1+4),再将两个这样的模块在ABF载板上拼接成一个2+8的结构。这种方式本 质上仍属于CoWoS‑S技术范畴,由于是在载板层面进行拼接，技术难度相对较低。 目前国内CoWoS‑L技术的量产情况和各主要产商的技术进 展如何？ 目前国内的CoWoS‑L技术尚未实现量产。在技术进展方面，长电科技的进度相对领 先。其技术路线与通富微电和盛合晶微不同，后两者沿用台积电的技术路径，而长电科 技采用的是类似于英特尔先进封装技术的桥接方案。尽管长电科技进展较快，但其良率 目前仍未达到量产水平。 先进封装产品达到量产水平的良率标准是多少？目前 CoWoS‑S技术的良率能达到什么水平？ 对于这类高价值的先进封装产品，由于其集成的存储芯片(如HBM)成本高昂，通常 要求良率达到90%以上才能视为满足量产标准。目前，国内几家主要厂商的 CoWoS‑S技术良率均已超过90%,部分厂商甚至达到了95%的水平。 目前国内CoWoS‑S封装的产能格局是怎样的 在CoWoS‑S封装产能方面，通富微电和盛合晶微的规模最大。从2026年的情况 来看，这几家厂商的总产能是充足的，并未出现满载的情况。 公司的CoWoS‑S产品选择了哪家供应商？ 沐曦的CoWoS‑S封装业务目前由通富微电承接，主要原因是现阶段的产品量还不是 特别大。 在芯片设计中，选择采用CoWoS‑S还是CoWoS‑L技术 方案，其背后的主要考量逻辑是什么？ 选择CoWoS‑S还是CoWoS‑L,主要取决于芯片设计的复杂度和需求。在简单的 CoWoS‑S方案中，硅中介层的设计相对简单，主要功能是布设GPU到HBM之间 的数据通路走线。 在多GPU芯片设计中，采用CoWoS‑L封装技术是否为必 要选择？其相较于其他方案在性能上具体有何优势？ 对于双GPU芯片设计，采用CoWoS‑L封装是必要的。与单GPU芯片仅需处理 GPU到存储之间的布线不同，双GPU芯片还涉及GPU之间的高带宽互联，这使得 布线层数和复杂度显著增加。单纯的硅中介层无法满足其高带宽需求，必须在表层额外 增加RDL走线以提升效率。因此，需要升级到CoWoS‑L技术。目前，采用 CoWoS‑L封装的方案基本都针对双GPU芯片。 另一种替代方案是在载板上将两个CoWoS‑S封装的芯片连接起来，但这种方案的互 联效率较低。最理想的方式是直接在Interposer上实现互联，例如2+8(2个GPU+8 个HBM)的集成方案，这种方式可以使速率得到充分发挥，整体性能基本能实现翻倍。 在CoWoS‑L技术尚不成熟的背景下，芯片设计公司与封装厂 之间如何协作以提升良率？各自扮演何种角色？ 良率的优化过程完全由芯片设计公司主导,封装厂主要扮演配合的角色。由于良率与每 个具体的产品设计紧密相关，设计公司必须投入产品进行大量的实验设计验证和提升良 率。例如，寒武纪在盛合晶微或长电科技进行的良率提升工作，就需要自身投入大量的 资金和人力资源。封装厂，如长电科技或盛合晶微，会从其封装技术的角度提供优化改 善建议，但最终的芯片投片验证仍需由设计公司承担费用。因此，封装厂在此过程中是 以配合为主，协助设计公司完成整个良率提升的目标。 目前长电科技、通富微电、盛合晶微等厂商的CoWoS‑L技术 进展到了哪个阶段？是否已经具备了让设计公司投入资源进行 合作的基础？ 这几家厂商的CoWoS‑L技术流程已经基本打通，达到了可以进行样品投片的阶段, 这说明设计公司已经可以与其合作。虽然目前样品的良率还比较低，尚未达到大规模量 产的标准，但其工艺流程的通畅性已经得到验证。这为设计公司愿意投入资源进行后续 的良率提升和产品验证奠定了基础。 汇成和上海易卜半导体在CoWoS‑L技术上的进展如何？与 长电、盛合、通富等厂商相比存在哪些差距？ 汇成和上海易卜半导体在CoWoS‑L技术上仍处于流程打通阶段,与长电科技、盛合 晶微、通富微电等厂商存在显著差距，后三者已经通过客户产品验证了其工艺的可行性， 目前的核心任务是持续提升良率以满足量产要求。相比之下，汇成和易卜半导体当前需 要有芯片设计公司愿意投入资源，配合它们进行首次产品验证。 汇成选择跳过CoWoS‑S直接开发CoWoS‑L的技术路径 是否可行？以及在当前阶段，设计公司是否有意愿投入资源支持 其发展？ 从技术路径上看，跳过CoWoS‑S直接开发CoWoS‑L是可行的,两者之间没有必 然的递进关系。至于设计公司是否愿意投入资源进行合作验证，这取决于多方面因素。 首先，汇成自身需要先通过使用测试芯片或带有IO接口的PCB板等方式，证明其封 装流程本身是通畅的。在此基础上，能否吸引到客户，则依赖于商业层面的契合度。对 于那些在主流封装厂已有稳定量产方案的客户，通常不会轻易投入资源：但对于寻求第 二或第三供应商以分散风险的客户，或者一些无法获得头部封装厂优质资源的新客户， 则可能愿意合作。 公司为何会选择与技术尚在验证阶段的汇成合作，而不是选择技 术相对成熟的盛合晶微或通富微电作为其C700产品的 CoWoS‑L供应商？ 盛合晶微与通富微电的CoWoS‑L产能及工程资源已被其现有的大客户占用，主要用 于产品验证。如果公司此时进入，将难以获得优质的工程资源支持。因此，公司选择与 汇成、易卜半导体这类新兴供应商合作。对于这些新供应商而言，公司可能成为其首个 大客户，从而能够获得更集中的资源投入和更好的支持。这种策略为新兴封装厂提供了 发展机会，也满足了公司寻找新合作伙伴的需求。 公司与汇成在C700项目上的合作是从何时开始的？ 双方的接洽始于2026年。公司大约在第一季度开始寻找封装设计方案时，便与汇成等 供应商进行了对接。公司的策略是优先确保在长电科技的CoWoS‑L方案顺利导入， 在此基础上，于2026年第二季度左右正式开始推进与汇成的第二供应商导入工作。 请问汇成在先进封装领域的技术水平和能力背景是怎样的？ 汇成原本的核心业务是显示芯片，例如DDI和MicroOLED等产品，其强项并不在数 据中心业务的先进封装领域。不过，由于显示驱动芯片的部分封装流程与先进封装中的 某些工艺(如CoWoS中的Microbonding等)具有较高的相似性，汇成希望借此进入 先进封装领域，以拓展数据中心业务。此举旨在抓住先进封装产业的发展机遇，并受益 于国家对该领域的扶持，从而提升其整体业绩天花板。 相较于通富微电、长电科技以及盛合晶微，汇成的技术积累路径不同。通富微电很早就 为AMD提供先进封装产品：盛合晶微由为扶持发展：长电科技则走的是独立技术路线。 这些公司在先进封装领域均已布局多年，例如通富微电从2023年起至今已投入超过三 年，其CoWoS‑S技术已经成熟：盛合晶微也自2022至2023年开始布局。因此， 在CoWoS或2.5D先进封装技术(无论是CoWoS‑S还是CoWoS‑L)的积累 方面，汇成与前述几家公司相比仍存在差距。 汇成引进了前台积电的资深人士，并直接推广其CoWoS‑L技 术，宣称技术领先，这种策略在争取客户方面是否具备说服力？ 从台积电引进负责先进封装的人才确实是一个加分项，但并非具有百分之百的说服力。 在硬件领域，即便拥有过往的成功经验，要在新的环境(国内)重新搭建整套体系，仍 需克服诸多困难，并不能保证一定能成功复现。 既然汇成的技术流程已经打通，是否意味着只要有设计公司愿意 配合，实现量产只是时间问题？预计这个过程需要多长时间？ 是的，可以这么理解。如果今年(2026年)其整体流程能够打通，并有客户愿意进行 验证，预计验证周期将接近一年。顺利的话，到2027年第三季度左右,汇成或许能够 进入批量生产阶段，即开始接收客户的批量封装订单。目前其可能拥有的是试验线，建 立量产线仍需要时间。 目前公司与汇成在CoWoS‑L方面的合作进展如何？作为早 期客户，可能会面临哪些主要问题？ 公司确实在与汇成对接，双方已经进行了一至两轮技术交流。作为汇成在CoWoS‑L 业务上的早期客户，公司可能会面临其技术方案成熟度不及行业内其他领先厂商的问 题。因此，合作过程中可能需要给予汇成一定的试错机会，通过共同进行失效分析等方 式，帮助其对封装架构等进行优化和提升。 除了公司之外，汇成是否还有与其他芯片设计公司，特别是头部 企业进行对接？ 头部厂商与汇成合作的难度相对较大，因为这些厂商通常已经拥有稳定的一、二、三级 供应商体系。除非有巨大的新增需求，否则他们一般不愿轻易更换或增加封测供应商， 因为这会对下游产生较大影响。至于其他设计公司，公司在今年(2026年)算是汇成 导入的新客户。除了公司，应该还有其他GPU公司在与汇成接洽。有部分客户的进展 比公司稍快，已经有样品在投片，并且正在推进封装设计等前期工作，例如进行流程打 通、验证以及外观时效性分析优化等。这些都是产品正式投产前必须完成的准备工作。 随着芯片技术的发展，采用CoWoS‑L这类先进封装技术的必 要性是否会持续提升？ 是的，CoWoS‑L技术对于产品性能的提升非常显著。通过Interposer走线的带宽远 高于在PCB基板上的走线带宽。因此，为了实现更大规模算力的产品，采用 CoWoS‑L这类技术是必然趋势。目前，国内各大厂商也正在积极地对CoWoS‑L技 术进行大规模投资和布局。 与汇成合作是否能获得比其他供应商更优惠的条件？具体是怎 样的优惠？ 与汇成合作，在项目前期，其提供的工程资源和收费标准相较于目前在长电或通富微电 已进行验证的产品，确实更具价格优势和友好度。由于汇成目前没有其他同类客户，如 果现在能够导入，预计将获得较好的资源倾斜。 具体的优惠体现在，2026年下半年(尤其是第三、四季度)计划投入的样品，汇成提 供的机时是免费的，直至其良率达到预定标准。目前CoWoS‑L的良率大约在 60‑70%,因此前期的验证投入主要由汇成承担，封装环节基本不收取费用，公司仅提 供晶圆、载板等原材料，投入成本相对较小。待其整体流程打通且良率稳定提升后，才 会更新收费协议。目前投入的首批次产品，均由汇成主导验证，并未收取封装费用。 长电在项目工程阶段的合作条件是怎样的？对于因良率问题产 生的物料损失，由哪方承担？ 长电在工程阶段是收费的，但其收费模式基于良品数量。例如，一批次加工1,000颗 芯片，若良率是70%,则产出700颗良品，长电仅收取这700颗的工程费用。然而， 对于另外300颗因工艺不成熟而报废的芯片，其物料损失目前由公司承担。进入量产 阶段后，相关责任和条款会重新商议。 通富微电的CoWoS‑L封装服务单价大约是多少？这个价格 包含了哪些项目？ CoWoS‑L的封装价格与封装尺寸密切相关。对于尺寸较小，例如小于60mm×60mm 的产品，加工费用相对较低，大约在1500元人民币以内。对于尺寸较大的产品，如寒 武纪的590,其封装价格会更高，目前1500元无法覆盖。公司的C500系列产品封 装费用包含了interposer的成本，interposer由公司主导设计，通富微电进行审核， 并作为客供原材料提供。 通富微电的CoWoS‑L产能情况如何？其封装价格是否有上 涨趋势？ 从2025年年底到2026年上半年，通富微电的CoWoS‑L产能已陆续扩充起来， 目前产能是充足的，足以满足国内所有GPU公司的封装需求。关于价格，目前封装价 格没有明显上涨，涨价的可能性不大。主要原因是，价值较高的核心原材料如封装载板 和interposer均由客户自行采购并提供(客供),封装厂主要赚取的是设备、人员和流 程管理的费用。此外，尽管通富微电、长电以及盛合晶微都储备了相当的CoWoS‑L产 能，但实际上并未完全满载。2026年采用HBM的新产品较少，且新产品要么搭配 HBM3E,要么采用其他技术路线，导致现有产能利用率并未达到饱和状态。 公司在选择先进封装供应商时，决策流程是怎样的，主要会考量 哪些标准？ 供应商的选择由公司自主决定，评估标准主要有几个层面。首要的衡量因素是技术，这 是一个具有一票否决权的硬性指标。公司会通过考察供应商过往的流程验证数据，或其 客户正在进行的DOE(实验设计)数据来判断其技术水平。此外，一个重要的评估维度 是该供应商是否已有大客户实现量产。最后才会考虑费用及性价比等因素，因为对于公 司目前的产品阶段，性价比并非首要考量。 在对新的封装供应商进行技术验证时，通常需要投入多少晶圆， 这些投入的损耗情况如何？ 在进行realdie验证时，公司需要使用真实的芯片。通常，公司会对三个不同批次的晶 圆进行封装验证，每个lot包含25片晶圆，总计需要投入至少75片晶圆。这些投 入的晶圆大部分会作为损耗处理。只有在验证过程中条件最优、最终被选定为量产条件 的样品可能会被利用，而其他在不同条件下测试的样品则不会交付给客户，最终都会报 废。 C600产品为何定价更高？其搭载的HBM3E存储芯片目前的 供应情况如何？ C600定价较高是因为其采用了双die设计，并且存储升级为HBM3E。目前HBM3E 的供应并不顺畅，交期长且价格高。2026年使用的HBM3E颗粒是2025年储备的 库存，而2027年所需的颗粒则需在2026年进行采购。 如何看待国内算力芯片市场的竞争格局？ 从国内算力芯片的竞争格局来看，华为和寒武纪处于第一梯队,无论从产品性能还是客 户端导入情况来看，这两家公司的产品都是目前国内最好的。第二梯队包括公司、壁仞、 天数智芯、摩尔线程、平头哥以及昆仑芯等公司。第二梯队内部各家公司的技术水平差 距不大，但与第一梯队的华为和寒武纪相比仍有差距。在放量方面，平头哥和昆仑芯分 别有母公司阿里和百度的支持，因此出货量不小，但其产品性能与公司、壁仞等公司处 于同一水平。 寒武纪相较于第二梯队公司的核心竞争优势是什么？ 寒武纪的核心优势在于其芯片研发能力。将其产品与华为对比可以发现，寒武纪的芯片 研发能力甚至更强，其每一代产品的单卡性能都优于同代华为产品的单卡性能。这正是 寒武纪能够在字节市场占据稳固份额的关键原因。 字节自研芯片的进展如何，是否会对外部采购产生影响？ 字节的自研芯片项目布局广泛，进展也较快。根据信息，预计到2027年，字节自研的 芯片可以满足其一部分需求。不过，目前其自研团队主要聚焦于低端卡，性能水平大致 与天数智芯的天垓150相当，主要用于数据中心内的传统业务。虽然字节在高端芯片 领域也有布局，但研发难度较大。", "status": "extracted"}, "post:2026-09-10T07-50:4513bc8dc5c4": {"id": "post:2026-09-10T07-50:4513bc8dc5c4", "kind": "post", "title": "2026-09-10 07:50", "source_label": "帖子正文", "excerpt": "MRVL 董事长兼 CEO Matt Murphy、CFO Dan Dum✨核心：光模块前景乐观，10 月 6 日投资者日将更新指引；在 NPO/CPO 赛道布局优势明显📈- 光模块业务：今年年末毛利率将逼近长期目标区间 38%-40%，明年年末有望摸到该区间上沿", "content": "MRVL 董事长兼 CEO Matt Murphy、CFO Dan Dum✨核心：光模块前景乐观，10 月 6 日投资者日将更新指引；在 NPO/CPO 赛道布局优势明显📈- 光模块业务：今年年末毛利率将逼近长期目标区间 38%-40%，明年年末有望摸到该区间上沿；10 月 6 日投资者日会重新调整长期目标。 🤝- 和谷歌合作：定制 ASIC 业务经历了长期演进，从单一收购项目、单一核心客户，拓展为更丰富的产品矩阵与更广客户群。谷歌的 XPU 配套产品是一套完整配套方案。公司会在 10 月 6 日投资者日，给出该业务多情景预测。 🌏- 上周管理层在亚洲拜访多家供应商，同步产品路线图，确认供应商可以配合产能爬坡计划，供应商方面已经达成共识。 ⚠️- 部分供应商存在顾虑：社会舆论对新建数据中心的抵制情绪在上升。 📜- 2016 年公司战略转向数据中心业务；依托多年投资、收购与资产剥离，当前在 AI 机遇上卡位良好。 🚀- Scale Up 业务：视作全新增量市场，是交换芯片 + 光器件一体化机会。通过收购补齐产品方案。行业还在 ESUN 和 UALink 两条技术路线之间选择，美满两条路线都有布局，英伟达的投资也带来助力。 🔧- NPO：5 年前收购 Inphii，获得支撑 NPO 方案的核心技术；去年收购 Celestial AI 拿到 CPO 技术，两支团队已完成整合。 💡- 模拟芯片：硅锗（SiGe）产品成为 NPO/CPO 新增长动力，模拟业务营收规模已经达到 10 亿美元。 🎯- NPO 是美满电子重要的放量主线，公司判断 NPO 与 CPO 会长期共存。 🔬- 1.6T 迭代：对自身卡位很有信心；在 400G/800G 基础扎实，看好 1.6T 机会，硅光（SiPho）的市场需求热度极高。#文字观点", "publish_time": "2026-09-10 07:50", "tags": ["文字观点"]}, "post:2026-09-10T15-22:19be4df84c14": {"id": "post:2026-09-10T15-22:19be4df84c14", "kind": "post", "title": "2026-09-10 15:22", "source_label": "帖子正文", "excerpt": "🚀【光博会核心变化】NPO去“DSP”加速落地，TIA/Driver迎价值重估 🌞 NPO/LPO去DSP：高速TIA/Driver价值量迎来重估 本届深圳光博会，NPO成为AI光互联核心方向之一。9月10日大会专门举办 NPO Summit， NPO/LPO最核心的变化之一就是去掉模块内部DSP/", "content": "🚀【光博会核心变化】NPO去“DSP”加速落地，TIA/Driver迎价值重估 🌞 NPO/LPO去DSP：高速TIA/Driver价值量迎来重估 本届深圳光博会，NPO成为AI光互联核心方向之一。9月10日大会专门举办 NPO Summit， NPO/LPO最核心的变化之一就是去掉模块内部DSP/Retimer。DSP减少后，高速链路对 ASIC SerDes＋高线性Driver＋低噪声TIA＋硅光PIC 本身的性能要求更高。 🔥 因此，去DSP并不是削弱电芯片，而是推动部分价值从数字DSP重新分配至高速模拟TIA/Driver。优迅股份也明确表示：LPO移除DSP后，TIA＋Driver的绝对价值量及其在系统中的相对价值占比均会提升。 🌹 1.6T：200G/Lane推动升级 单通道由100G升至 200G，TIA/Driver对带宽、线性度和功耗要求明显提升。Marvell已量产200G/Lane TIA＋Driver，验证高速模拟前端价值提升。 🌹 3.2T/NPO：价值量进一步重估 3.2T相对800G总带宽提升约 4倍，叠加 去DSP＋通道增加＋200G/Lane升级，预计硅光PIC价值量提升至约 2.5—4倍，TIA＋Driver整体价值量提升至约 2—3倍。 ⭐️ 优迅股份：TIA/Driver直接弹性。 公司持续推进 单波100G/200G TIA、Driver及LPO/NPO方案，并布局可覆盖3.2T/6.4T NPO需求的高速电芯片。去DSP后，独立TIA/Driver价值量及系统占比提升，是最直接的国产受益环节之一。 ⭐️ 卓胜微：12英寸光电制造平台弹性。 公司12英寸平台覆盖 SOI、SiGe等特色工艺，目前光芯片与电芯片并行推进，硅光工艺已进入最后定型阶段。NPO时代有望同时受益于 硅光PIC渗透＋高速TIA/Driver价值提升。 🌹 产业链关注： 中际旭创、新易盛——NPO光引擎及高速光模块； 优迅股份——TIA/Driver设计弹性； 卓胜微——12英寸硅光＋高速电芯片制造平台弹性。 🚀 深圳光博会释放的信号越来越清晰：NPO时代真正稀缺的，是在没有DSP“兜底”的情况下，仍能把200G/Lane乃至更高速率信号做好的TIA、Driver和硅光PIC。 ☎️近期光博会产业动态及公司调研欢迎交流～#文字观点", "publish_time": "2026-09-10 15:22", "tags": ["文字观点"]}, "post:2026-09-10T10-08:f03600c78dd4": {"id": "post:2026-09-10T10-08:f03600c78dd4", "kind": "post", "title": "2026-09-10 10:08", "source_label": "帖子正文", "excerpt": "光博会第一天感受 人比往年都多，密集聊了近二十家公司，可以充分感受到行业整体的高景气度，走路到处都能听到紧缺、紧张、缺货等字眼。今年老外数量也不少，几家头部厂商外国客人络绎不绝，光通信依赖cn产业链的情况在ai时代进一步放大。", "content": "光博会第一天感受 人比往年都多，密集聊了近二十家公司，可以充分感受到行业整体的高景气度，走路到处都能听到紧缺、紧张、缺货等字眼。今年老外数量也不少，几家头部厂商外国客人络绎不绝，光通信依赖cn产业链的情况在ai时代进一步放大。 比较超预期的一个是相干下沉致数据中心，一个是3.2t和铌酸锂方案，以及scaleup的npo和ocs，部分上游公司已经开始配合客户进行下一代产品迭代。其次是1.6t，明年确定性大放量，上下游均在积极备产匹配需求。 关于地缘影响，和数位企业家沟通来看，首先近两年难以落地，光通信全面紧张，完全无法离开我们，这个不多解释。其次两年及更长期，需要我们继续加大创新，引领方案，做到人无我有人有我精，就干不掉我们，因此产业上也在齐心协力加速技术创新、方案创新、材料创新。再加上本身价值量占比相对低、部分核心芯片如dsp美系为主，以及csp极强的盈利能力，海外部分客户在用无可用情况，以及不再纠结供应产地，整体感受无需担心，相信常识。 请多支持国盛通信团队djb#文字观点", "publish_time": "2026-09-10 10:08", "tags": ["文字观点"]}, "attachment:files/磷化铟调研：高纯红磷与多晶供给节奏 260909.pdf": {"id": "attachment:files/磷化铟调研：高纯红磷与多晶供给节奏 260909.pdf", "kind": "attachment", "title": "磷化铟调研：高纯红磷与多晶供给节奏 260909", "source_label": "其他", "excerpt": "磷化铟调研：高纯红磷与多晶供给节奏，衬底扩产、 锁单与价格趋势，大尺寸衬底及新进入者进展 （2026/09/0914:20） 要点 1、高纯红磷与多晶供给节奏；2、衬底扩产/锁单与价格趋势", "content": "磷化铟调研：高纯红磷与多晶供给节奏，衬底扩产、 锁单与价格趋势，大尺寸衬底及新进入者进展 （2026/09/0914:20） 要点 1、高纯红磷与多晶供给节奏； 2、衬底扩产/锁单与价格趋势； 3、大尺寸衬底及新进入者进展。 以下为专家观点： 请先介绍业务，以及对磷化铟产业链哪些环节更熟悉？ 公司主要做磷化铟多晶材料，上游采购高纯铟和高纯磷，将其合成为磷化铟多晶，再销 售给衬底企业。下游衬底厂拿到多晶后，通过VGF等方法生长单晶，再经过切、磨、 抛形成衬底。 磷化铟多晶在产业链中通常是单独的一个环节吗？下游衬底企 业会不会自己生产多晶？ 多晶严格来说是中间产品，做多晶的目的就是为了后续生长单晶。磷化铟与部分其他半 导体材料不同，多晶合成本身有一定技术门槛，因此有些单晶企业具备自产多晶能力， 但绝大多数衬底企业仍会外购多晶。 哪些衬底企业的多晶是自己做的？ 通美过去大部分多晶由自己生产，同时从国外进口一部分；现在由于需求增加，自产量 也不够，需要外购。先导的多晶主要以自产为主。云南锗业只有很小一部分自产，其余 基本依赖外购，其他多数衬底厂也以外购为主。 先看上游红磷，目前国内6N/6.5N级高纯红磷的技术水平怎么 样？能不能稳定批量供货？ 国内部分企业做的红磷已经可以使用，也能够批量供货，但从质量和技术水平看，与日 本产品仍有差距。当前更突出的问题不是\"完全做不出来\"，而是原有产能规模较小、需 求增长较快，因此整体仍比较紧缺，国产红磷的实际供货体量也还比较小。 国内高纯红磷的扩产能不能跟上2027年的需求？ 目前已经在推进的国内高纯红磷新增产能至少有40吨‑50吨，公司所在的多晶环节 也在加快验证国产红磷。个人认为，从2026年底到2027年上半年，国产红磷可能 仍会偏紧；到2027年下半年，随着新增产能释放和工艺逐步磨合，供给有望相对缓和。 刚才提到新增40吨‑50吨红磷产能，大概是由哪些企业构成 的？ 先导约20吨，威顿约20吨‑30吨，且威顿是分批建设；川至、秦烯等也有红磷产 能在建设。 国内7N级红磷目前是什么情况？磷化铟多晶一定要使用7N 吗？ 目前多晶合成主要使用6N和6.5N红磷，二者成本差异相对较小。7N红磷成本明显 更高，但从现有工艺看并不是必须使用。对于磷化铟合成，纯度当然重要，但并不是简 单追求总纯度越高越好，更关注的是某些敏感杂质元素能否控制在要求范围内。 如果最终要做6英寸衬底，是不是就必须使用7N红磷？ 不是。衬底厂本身并不直接大量使用红磷，中间还有多晶环节。多晶合成时使用红磷， 并且合成工序本身包含除杂；衬底厂在单晶生长时只会使用少量高纯红磷去平衡磷蒸气 压。因此，做多大尺寸的衬底与直接使用多高纯度的红磷之间没有必然关系，\"尺寸越 大就必须使用纯度越高的红磷\"这一说法不准确。 也就是说，在多晶环节使用6.5N红磷就可以满足6英寸衬底 的需求？ 对，6.5N可以使用，没有必要因为最终做6英寸衬底就强制追求7N。 相比总纯度，多晶合成更关注哪些杂质指标？ 其中硫、砷等元素在高纯红磷中相对难去除，一般需要控制在1PPB以下。其他元素 也有相应要求，但硫、砷是比较难控制的部分。只要关键敏感杂质控制到要求范围，继 续从6.5N追求到7N带来的成本增量未必值得。 目前主流国产红磷供应商有哪些？ 目前主流国产供应商包括威顿、先导、精一等，其他企业也能做，但批量很小，尚未形 成规模。 国产红磷此前为什么替代得比较慢？现在的外销量大概是什么 水平？ 此前除被公司收购的一家较早推进国产化外，2025年以前磷化铟应用的红磷大部分仍 来自日本。过去日本红磷供应充足、质量稳定，国产红磷价格也没有明显优势，因此国 产化推进较慢。2026年以来，日本红磷在海外用量增加、对国内供应减少，国内才明 显加速验证和导入。当前几家主要国产供应商合计月度外销量大约仍是几十公斤，整体 体量不大。 先导的国产红磷实际使用效果怎么样？ 没有做过大批量使用，但小批量试用过。做出来的产品总体可以接受，虽然稳定性和性 能还没有日本红磷那么好，但目前处于可用范围。 生产更大尺寸晶片时，原料纯度会不会成为主要难点？ 不会因为尺寸变大就直接提高红磷纯度要求。大尺寸晶片更难做，主要难点是热场工艺 和温度控制，而不是原料纯度本身。 铟目前是短缺状态吗？ 铟目前并不缺，更多是市场价格被炒得较高。 个人怎么看后续铟价？为什么认为可能有下行压力？ 个人认为铟价后续存在下行压力。磷化铟在铟的总需求中占比只有个位数，国内原生年 产量接近2000吨，而磷化铟历史上一年的铟消耗量只有几十吨，因此磷化铟需求增长 很难单独改变铟的整体供需。铟过去的大头应用是ITO靶材，当前高铟价也推动部分 靶材厂研发无铟方案。如果这些传统需求减少，一旦市场炒作退潮，铟价可能回落；但 资本市场交易因素本身难以判断。 无铟靶材现在进展到什么程度？ 具体进展不清楚，只是了解到行业内有不少厂商在研发无铟靶材，因此这一点只能作为 需求端潜在变化，不能给出更确定的判断。 展望2027年，原材料端会不会因为磷供不应求而卡住产量？ 个人认为会存在阶段性因为磷而卡产能的情况，但更像几个月的短期瓶颈，不是长期缺 口。红磷属于危化品，扩产项目在安全、环保、审批和建设周期上都比其他环节更慢； 同时过去国产红磷导入较少，日本供应偏紧时，国产供给短期可能跟不上。 除了名义产能不够，切换国产红磷还会带来哪些实际问题？ 另一个问题是质量和工艺适配。过去国内厂商使用国产红磷较少，切换后可能在短时间 内出现良率下降，使多晶的实际有效产出低于建设产能，进一步影响下游单晶衬底的原 料供给。因此，名义上建成多少吨产能，不一定能够在最初阶段全部转化成有效供给。 先导有铟、磷等上游资源，是否会因此明显占优？ 先导在铟、磷资源以及垂直产业链整合方面确实有优势，但相对薄弱的环节仍是晶体生 长，包括多晶和单晶衬底。根据了解，先导此前单晶衬底的出货量相对其他头部厂商更 少，因此资源端是强项，晶体环节的规模供货能力仍需要观察。 从时间节奏看，2027年红磷的紧张更可能集中在什么时候？ 个人认为2027年上半年可能更明显，并可能影响整体供给；到下半年，随着国产产能 逐步释放、工艺适配成熟，原材料供应会进入相对缓和阶段。 多晶环节从2026年到2027年的瓶颈怎么变化？ 从2026年五六月份到年底，多晶环节本身相对偏紧，原因是过去产能小、当前扩产还 没有完全释放。预计到2027Q1，包括公司在内的主要多晶厂都会有新增产能释放。届 时只要上游原料足够，多晶环节本身就不再是主要卡点。 先导、珠海鼎泰以及其他小厂目前是什么出货水平？ 先导当前具体出货量不清楚，珠海鼎泰的出货水平与先导大致相当。其他规模较小的企 业目前基本还不能算正常批量出货，更多是偶尔出一点货或者送样。 从2026年底往2027年看，主要衬底厂大概还会扩多少？ 2027年主要厂商还会在2026年底基础上继续扩，很多厂商大体可能再翻一倍，部分 企业增幅会更高。 规划扩产这么快，设备真的能跟上吗？ 老牌厂商扩产速度可以比较快。单晶炉方面，几家头部厂商很多都参与设备设计，并有 长期合作的加工厂，因此设备供给本身问题不大。切、磨、抛设备方面，这些厂商过去 做过砷化镓，即使买不到全新设备，也可以改造原有砷化镓设备并调整工艺配方用于磷 化铟。 场地是否会成为扩产瓶颈？ 当前扩产大多发生在原有厂区，不需要重新拿地建设。通美将部分砷化镓产线转移至朝 阳，为北京的磷化铟扩产腾出空间；云南企业也将部分砷化镓产线转移至湖北，再利用 原有场地做磷化铟技术改造。因为是在原场地改造，手续更快，设备和场地都不是主要 瓶颈。 如果衬底良率并不高，规划的40万片、110万片是不是还要 对应更大的实际投料和设备数量？ 这里的口径是，这些规划数字指的是最终能够出货的产品量，企业在做扩产规划时已经 考虑了行业现有良率水平。也就是说，不能再简单把目标出货量按某个低良率机械乘几 倍去理解其设备需求。 磷化铟单晶生长很依赖老师傅经验，快速扩产时人才培养能跟上 吗？ 对已有产能、长期生产的头部厂商而言，人才培养和复制相对可控，更大的变量可能是 管理水平。对新进入者来说这一块明显更难，目前行业核心人才也比较难挖，因此新厂 在经验积累和人员体系上会面临更大挑战。 能不能把磷化铟生产做成一套标准手册，然后直接复制？ 所有工业生产都有SOP或标准操作流程，磷化铟企业也一样。问题在于，行业过去规 模小、相对封闭，设备设计理念比较传统，设备本身有一些先天限制。每次生产后热场 结构、装料状态、测温探头位置等都可能出现细微变化，标准手册无法把所有现场变量 写进去，因此操作人员仍需要根据经验微调。 这里说设备\"老旧\"，是指设备用了很多年吗？新的设计理念能 不能解决？ 这里的\"老旧\"指设计理念，不是使用年限。随着资金进入，部分大厂从2025年开始 研发控制精度更高、对人工依赖更低的新设备，但研发时间还不到一年，短期内不可能 大面积投入市场。后续预计会出现更先进的设备，但现阶段仍以经验和工艺积累为主。 对通美、云南锗业这类老厂来说，人的依赖会不会成为扩产瓶 颈？ 个人认为问题不大。老厂做的时间长、交的\"学费\"多，已经针对不同状况积累了更厚、 更细的ISO和标准操作流程，能够覆盖更多异常场景。因此同样是依赖经验，老厂和 新进入者的复制能力差别很大。 通美2026年底扩到110万‑120万片、云南锗业2027年 目标40万片4英寸，这些目标达成概率高吗？ 个人仍有信心，主要依据是扩产节奏、原材料拿货量和已经了解到的订单量。同时，即 使这些新增产能释放，2027年整体市场仍可能存在供给缺口。 客户现在下单会锁到什么时候？已经开始谈2027年全年了 吗？ 近期已经开始确定2027年全年的意向采购量，并进一步谈具体价格等细节。这里更接 近年度锁量，而不是只看一两个季度。 这种年度锁单有没有约束？客户是否需要预付款？ 锁量时通常会要求一定比例的预付款，预付款与最终总采购量挂钩。价格是否完全锁死 可以单独谈，但数量锁定并不是没有约束的口头意向。 磷化铟产品出口许可证一般由谁申请？ 谁出口就由谁申请，但需要进口方或最终用户配合，提供最终用途和最终用户说明等原 件，并声明产品不用于军事用途。因此出口商负责申请，进口商需要提供材料。 在当前供需关系下，2英寸、3英寸和4英寸衬底的价格是不 是已经不能简单按面积比较？ 是。2英寸的良率或得片率相对更高，因此3英寸和4英寸的价格并不是简单按照面 积比例放大，溢价和涨幅会更明显。尤其对于新签订单，大尺寸产品的价格弹性更大。 2027年的衬底价格相对2026年大概是什么趋势？ 2027年年度订单整体价格会比2026年高不少。2026年部分订单是在年初低价锁定， 后面即使市场涨价也难以调整；到2027年重新谈年度订单时，价格会重新反映当时的 供需关系。 衬底厂从2/3英寸转向4英寸，对上游多晶原料的杂质等性能 指标会提出新的要求吗？ 不同尺寸本身不会改变原材料在杂质等方面的核心要求。原材料指标主要取决于最终做 哪种衬底，例如N型掺硫衬底和半绝缘铁衬底有不同要求，但与晶圆是2英寸、3英 寸还是4英寸没有直接关系。 掺铁半绝缘磷化铟衬底主要用于什么场景？需求增长怎么样？ 掺铁半绝缘衬底主要用于射频领域，不是激光器。射频需求也在增长，但驱动力与AI光 通信不同，增速没有光通信那么夸张，更多涉及军事等特定应用。 2026年原材料涨价会不会影响多晶环节毛利？ 会有影响，因为价格传导存在滞后。年初原料价格较低、销售价格也较低，后来成本上 涨后不能立刻全部提价，需要经过一段时间逐步传导，因此当年毛利率会受到一定影响。 国内多晶厂明年的扩产计划怎么样？ 多晶生产流程相对短，主要是合成环节，因此扩产速度较快。 铭镓的扩产情况了解吗？ 铭镓目前已经较2025年扩张约3倍，预计2027年整体体量可能达到百吨级。 到2027年中期，多晶环节本身还会不会供不应求？ 个人认为，只要红磷等上游原材料卡点得到解决，到2027年中期多晶产能本身基本可 以满足市场需求。 目前使用威顿红磷的实际效果怎么样？ 可以使用，但稳定性相对差一些。主要问题是批次间波动：这一批原料可能生长良率较 高、参数较好，下一批的参数和良率又可能下降。 2026年全球2英寸、3英寸和4英寸磷化铟衬底总出货量大 概是多少？ 2026年全球2/3/4英寸衬底合计出货约100万片左右，而不是200万‑300万片。 2027年全球衬底出货量大概能到多少？ 预计2027年可以达到200万‑250万片。 2028年还能继续增长多少？ 2028年距离较远，如果按现有规划做粗略估算，可以在2027年基础上再乘约1.5 倍，但这只是基于当前产能规划的估算，最终仍取决于各家扩产建设和产能爬坡情况。 未来几年不同尺寸衬底的结构会怎么变化？ 2027年3英寸和4英寸占比会明显提升。个人认为国外市场3/4英寸合计占比会超 过50%‑60%，国内市场短期可能还达不到这一水平。到2028年，6英寸衬底可能 开始贡献一定出货量。 目前全球6英寸磷化铟外延线有哪些？ 全球6英寸外延线目前Coherent有两条、IQE有一条，国内另有几条处于在建状态， 最早预计到2027年才能释放。当前能够量产一定6英寸外延片的主要是Coherent 和IQE。 6英寸衬底目前哪些厂商已经能够出货？大概是什么量？ 目前主要是住友和AXT能够实现一定量出货，其中住友月出货大约小几百片，其他厂 商大多尚未进入稳定量产阶段。 现在很多新企业都在进入磷化铟衬底领域，它们最快什么时候能 形成有效供给？ 新进入者大多计划在2026Q4开始做晶体生长实验。按照正常节奏，需要先把晶体生 长跑顺，再解决切片工艺，之后到2027年下半年逐步给客户送样验证，因此批量出货 最快也要到2027年下半年甚至Q4。 这些新进入者对2027年的整体供给会有多大贡献？ 个人认为贡献不会太大。2027年更多还是验证和爬坡，真正形成较大规模供给需要更 长时间。 到2028年、2029年，新进入者会不会明显冲击行业格局？ 个人认为会。虽然磷化铟衬底难做，但参考其他行业的发展规律，两三年后通常会有部 分新玩家实现技术突破。届时市场竞争会明显加剧，头部老厂也会继续扩产，因此长期 供需和竞争格局不能简单外推当前的紧缺状态。 对于后续CW、EML外延片以及光刻环节的良率是否了解？ 这一部分不在熟悉范围内，因此不做延伸判断。 目前国内衬底厂使用的晶体生长炉主要是什么技术来源？ 当前国内很多晶体生长炉的技术源头都来自通美，或者由通美相关技术衍生而来，这也 是不同厂商良率上限比较接近的原因之一。设备可以直接采购，也可以采购由相关技术 衍生出来的产品。", "status": "extracted"}, "post:2026-09-10T10-11:0f28c86618ff": {"id": "post:2026-09-10T10-11:0f28c86618ff", "kind": "post", "title": "2026-09-10 10:11", "source_label": "帖子正文", "excerpt": "如何用量能研判风格？量能维度将市场成交量分为三档：2.5万亿以上为单边牛市规模，2万亿左右为偏震荡行情，1.5万亿以下为转熊基础门槛，当前市场持续缩量，可保持定力等待机会。", "content": "如何用量能研判风格？ 量能维度将市场成交量分为三档：2.5万亿以上为单边牛市规模，2万亿左右为偏震荡行情，1.5万亿以下为转熊基础门槛，当前市场持续缩量，可保持定力等待机会。 大盘价值：走势与整体经济基本面高度绑定，只要整体经济向好，公用事业、金融、消费等大盘价值板块自然有行情。 大盘成长：走势与新兴赛道产业催化直接相关，只要有强产业催化，即便虹吸其他板块、债市流动性也能走出独立行情，与整体流动性宽裕度关联度低，比如2026年5-6月的科技行情。 小微盘：走势核心取决于剩余流动性：首先看宏观流动性松紧，其次看资金是否流入股市（熊市下即使宏观宽松资金也不会流入股市），最后看大盘价值、大盘成长是否有强催化吸收流动性，若大盘无强驱动，充裕流动性会流入小微盘推动其相关的概念主题板块走出超额行情。 量能≥2.5万亿：对应强劲牛市，大盘价值换手率≥1.5%、大盘成长换手率≥2%，有明确强催化。 量能维持在2万亿左右：对应流动性宽松但产业驱动不足的震荡行情，大盘价值换手率1%-1.5%、大盘成长换手率1.5%-2%，特征为小盘有超额收益、行业高速轮动，仍有交易性机会。 量能回落至1.5万亿左右：对应偏弱震荡行情，大小盘换手率均偏低，小盘无整体超额收益，仅红利、自由现金流策略及个别微盘标的能获得超额，类似2023年弱现实行情。 量能跌破1.5万亿：除掉量化占比，实际投资者成交量已跌破牛市标准的万亿成交，则市场存在更大下行风险，需警惕避险冲击。 历史行情印证：牛市主升浪后进入高位震荡、基本面新增验证有限的阶段，若流动性仍宽松，小微盘相对大盘价值的自由换手率会抬升至3倍以上，走出显著超额收益，2010年、2013年、2019-2021年均符合该规律；若大盘价值、大盘成长基本面兑现极强，会虹吸流动性导致小盘相对热度走弱，2017-2018年、2021年公募抱团行情符合该规律。 辅助判断规律：市场有明确催化时，换手率大幅抬升、行业轮动速度下降；市场无催化时，行业轮动速度快速抬升，对应小微盘行情更优。---xz#文字观点", "publish_time": "2026-09-10 10:11", "tags": ["文字观点"]}, "post:2026-09-10T07-46:fd7b5900d819": {"id": "post:2026-09-10T07-46:fd7b5900d819", "kind": "post", "title": "2026-09-10 07:46", "source_label": "帖子正文", "excerpt": "📌Nebius 集团需求排至 2028 年，盈利转正仍看交付落地 📊Nebius 集团（NBIS）的客户需求能见度已经延伸至 2028 年，但旺盛的订单意向并未改变当下的财务节奏。高盛维持其每股 328.00 美元的目标价，较 2026 年 9 月 8 日收盘价测算出 34.5% 的上涨空间。", "content": "📌Nebius 集团需求排至 2028 年，盈利转正仍看交付落地 📊Nebius 集团（NBIS）的客户需求能见度已经延伸至 2028 年，但旺盛的订单意向并未改变当下的财务节奏。高盛维持其每股 328.00 美元的目标价，较 2026 年 9 月 8 日收盘价测算出 34.5% 的上涨空间。尽管管理层表示现在就有能力卖光规划产能，但高盛预测其年度息税前利润在 2027 年底前仍将保持亏损，直到 2028 年才会转正，产能交付与公司落地能否兑现为持续的现金流是当下的核心矛盾。 💰为了加快资金回流，Nebius 集团主推 1 至 3 年的中短期合同，定价明显高于超大规模云厂商的长单，并要求客户支付预付款来分担大笔建设支出。这种签约组合缩短了投资回报周期，再配合溢价即时算力与长周期客户分散风险。同时，Nebius 集团联手 Palantir 拓展公司级分销，通过支持公司在私有数据上微调开源模型来拉高客户切换成本，试图把分销合作转化为更大规模的算力部署。 🔍这套增长逻辑能否兑现，接下来取决于 Vineland 项目能否按时交付，以及 2027 至 2028 年的产能协议能否正式签署。虽然目前前瞻需求能见度约为 18 至 24 个月，但意向需求不等于已经签约产生收入，保留未售产能虽然留出了筛选高价值客户的余地，但也留存了执行不确定性。如果超大规模云厂商发起竞争削弱其定价与获客能力，或者人工智能落地放缓导致公司过度依赖短期合同，收入的长期稳定性就会受到冲击。 📋核心结论：1）需求的能见度延伸至 2028 年，NBIS 持续聚焦维护不同合同期限构成的多元化客户群体；2）与 Palantir 的合作强化了公司分销渠道，并且巩固了全栈平台战略；3）产能扩张按计划推进，而监管层面的复杂性可能会成为全行业供给约束，我们认为这有望支撑利润率；4）合同的经济效益正在改善，能够支撑具备吸引力的投资回报周期、利润率以及融资灵活性。 📄公司可获取全套产品方案对应的公司需求，而不只是单纯的基础设施供给。此外，我们注意到，和 Palantir 的合作能够为 Nebius 的产品提供成熟的公司分销渠道，Nebius 的代币工厂可以用于运行开源权重模型，让公司能够依托自有专有数据微调模型，实现更低成本、更强的领域内性能，同时掌握更多数据所有权。最后，该合作可以建立更深层次的合作关系，相比传统基础设施合同带来更高的客户迁移成本以及更长的合作周期，同时助力 Nebius 实现更大规模的产能部署。 📈Nebius 拥有约 18 至 24 个月的前瞻需求能见度，相关沟通正越来越多地转向 2028 年的产能。此外，该公司重申，即便当下也能够售罄规划的 2027 年产能，但目标是在 2027 年供给紧张的市场环境中，为战略客户保留灵活空间。我们认为这体现出公司对需求韧性与价格走势具备信心。最后，我们注意到 Nebius 的合同结构采用杠铃策略：面向原生 AI 公司以及各类公司的 1 至 3 年中期合同是业务核心，同时增长最快；搭配低风险客户（例如微软、Meta）的长期协议，以及机会型短期激增订单，这类订单定价显著更高，相关内容已在其最新 2026 年二季度财报中披露（更多详情，请参阅我们的财报要点笔记）。#文字观点", "publish_time": "2026-09-10 07:46", "tags": ["文字观点"]}, "attachment:files/折叠屏调研：液态金属铰链应用趋势 260909.pdf": {"id": "attachment:files/折叠屏调研：液态金属铰链应用趋势 260909.pdf", "kind": "attachment", "title": "折叠屏调研：液态金属铰链应用趋势 260909", "source_label": "其他", "excerpt": "折叠屏调研：液态金属铰链应用趋势，后续折叠屏产 品规划，销售、市占率预期（2026/09/0914:06） 要点 1、液态金属铰链应用趋势；2、后续折叠屏产品规划", "content": "折叠屏调研：液态金属铰链应用趋势，后续折叠屏产 品规划，销售、市占率预期（2026/09/0914:06） 要点 1、液态金属铰链应用趋势； 2、后续折叠屏产品规划； 3、销售/市占率预期。 以下为专家观点： iPhoneUltra的具体上市销售时间是什么时候？ 根据当前计划，iPhoneUltra的预购将在2026年四季度，即10月至11月期间开启。 然而，消费者实际拿到产品的时间预计要到2026年12月底至2027年1月初。 在即将举行的发布会上，新任CEO是否会亲自宣讲折叠屏产 品，并且他在整场活动中将扮演何种角色？ 据悉，新任CEO将亲自负责发布折叠屏产品(iPhoneUltra)，并进行完整和深入的讲 解，包括与生态相关的对比。此外，他在此次发布会中扮演着核心角色，将负责整场活 动的开场致辞，向上一任CEO致敬，并分享标志着Apple进入一个全新时代的硬件 创新理念。他还会串联iPhone18Pro、AppleWatch以及AirPods5等其他产品的发 布环节，并进行最后的总结。因此，可以将其理解为贯穿全场的总主讲人。同时，软件 工程高级副总裁也将在发布会中扮演重要角色，负责讲解iOS27及应用分屏等相关内 容。 据供应链消息，苹果折叠屏的核心创新之一是\"无折痕\"设计， 请问发布会脚本中是否会详细介绍实现这一效果的铰链技术？ \"无折痕\"确实是2026年产品一个非常核心的视觉卖点，发布会脚本中安排了专门的 环节对此进行展示。届时，演讲者会强调这是对iPhone和折叠屏的重新定义，并通过 现场展示铰链的展开过程、特写镜头以及手指滑动屏幕来凸显其平整无痕的效果，同时 会提及为解决折痕问题所投入的研发时间与努力。 相较于目前国内折叠屏手机在软件适配上仍存在不足，苹果在软 件生态适配方面做了哪些具体的优化工作，以确保用户在折叠与 展开状态下获得无缝的体验？ 针对软件适配问题，主要从四个维度进行了优化。 1.通过一个四层架构进行底层支持，其中核心是iOS27系统级别的折叠感知能力， 确保大部分APP在闭合、展开及半折叠状态下都能有良好的视觉和功能表现，避免出 现显示异常。 2.设备展开后会自动切换至类似iPad风格的布局，即\\\\\"边栏+分屏\"模式\\\\，以 提升大屏使用效率和导航性。 3.AppleChina的团队已主动与国内头部应用开发商进行对接，成立了专门的折叠屏 适配团队，为微信、支付宝、TikTok、淘宝、钉钉、高德地图、美团、小红书、哔哩哔 哩、飞书及企业微信等应用进行了深度优化，确保其在中国市场的核心应用场景下有出 色的呈现效果。 4.通过原生应用(如Safari、备忘录等)率先采用手写定制的双侧边栏布局，树立一 种\"样板式\"的生态效应，为用户在折叠屏产品上提供一个美观且高效的生态体验。 如何评价竞争对手(如华为、小米)在2026年推出的折叠屏产 品，特别是华为的三折叠形态和小米的外折形态，以及如何预估 这款产品上市后的市场舆论和销量预期？ 华为一直被视为折叠屏赛道上最主要的竞争对手，并始终保持尊重。从市场份额来看， 华为在2026年第一季度以及2025年第三、第四季度，其出货量占据了中国折叠屏 市场约60%至70%的份额，稳居第一。从产品技术角度看，其产品形态和影像能力 非常出色和炫酷。在营销策略上，华为通过强调其外折叠形态接近A4纸的比例来教育 市场，并结合其成熟的鸿蒙生态以及12期免息、赠送HuaweiCare等服务来吸引消 费者。 小米在折叠屏市场主要采取实用主义路线，其核心竞争策略是打造兼具大屏体验与高性 价比的产品。近期，小米通过发布自研的03芯片，并结合国家信创政策中关于2026 年5月起关键领域要求使用国产芯片的背景，极大地提升了产品热度。其产品定价在 8,000至10,000元人民币区间，相较于iPhone有3,000至4,000元的价格优势， 精准地避开了与苹果和华为在高净值市场的直接竞争。此外，其AI推理速度达到 295token/s，也成为一大吸引力。综合来看，小米折叠屏手机凭借价格优势、自研芯片 叙事以及徕卡影像等传统优点，被认为是\"六边形战士\"。然而，市场也存在负面反馈， 主要包括：产品贬值速度快，保值率差，例如8,999元的机型可能很快会大幅降价； 在无线快充技术和第三方APP外屏适配方面体验不佳。 苹果首款折叠屏iPhone的核心卖点、市场预期以及面临的潜 在挑战是什么？ 苹果首款折叠屏iPhone的核心卖点主要有四方面： 1.生态壁垒：依托iOS系统的无缝衔接、A20Pro芯片的性能领先以及iPadmini级 别的内屏体验，构建了安卓阵营短期内难以打破的生态优势； 2.技术突破：实现了\\\\\"无折痕\"的设计\\\\，折痕深度将控制在0.15毫米，并将重点 宣传其新材料的应用； 3.极致轻薄：该机型将成为史上最薄的iPhone； 4.强大的品牌溢价。 然而，该产品也面临四大挑战： 1.价格极其贵，256GB版本的售价比iPhone18ProMax高出约4,000元，上市初 期黄牛和渠道加价可能导致其因\"史上最贵iPhone\"而被负面舆论推上热搜； 2.产品配置被指\"挤牙膏\"，缺少长焦镜头和FaceID，可能引发用户关于体验倒退的 批评； 3.作为初代产品，这是苹果首次涉足该领域，缺乏市场试水经验，面临巨大压力，其 表现将直接影响2027年和2028年第二、三代产品的迭代； 4.硬件参数存在短板，如运行内存较小、电池容量不足、快充功率不高等，同时，铰 链的内部良率不高或将引发品控问题。 针对华为和小米在折叠屏市场的竞争，苹果制定了怎样的应对策 略？ 苹果针对不同的竞争对手制定了差异化的竞争策略。 •对于华为：苹果选择避开其完善的\"形态战\"布局，即不追求推出多种折叠形态的 产品矩阵，而是聚焦于自身的传统优势，打一场\\\\\"生态战\"\\\\，通过强化iOS生态系统 的整合与体验来构筑壁垒。 •对于小米：苹果则明确不会进行\\\\\"价格战\"，不会通过补贴或降价等方式与其竞争， 而是选择打\"价值战\"\\\\。这场价值战的核心是服务忠实用户群体，并着重维护产品的保 值率，承诺该款折叠屏产品不会像以往部分机型一样，在次年\"618\"等大促期间出现 大幅降价，以此来夯实其高端品牌价值。 对于即将发布的新产品，公司在中国市场具体的出货节奏是怎样 的？ 从出货节奏来看，2026年第三季度基本不会有新产品出货。第四季度出货量也有限， 消费者预计要到2027年1月左右才能拿到产品。因此，主要的出货和销量爬坡期将 集中在2027年第一季度，该季度将成为销售主战场和稳定供货的时间点。 考虑到2025年华为市场份额超过70%，荣耀约占9%，三星占4‑5%的竞争格局， 公司对于产品上市首年的目标相对务实，主要承接高端iPhone用户的换机需求，并对 三星、荣耀、小米等品牌的市场造成一定冲击。 如果市场反响热烈，供应链是否有能力支持超过1,000万台， 例如达到1,500万或2000万台的年出货量？ 即使市场需求非常旺盛，也无法实现1,500万或2000万台的出货量。主要的瓶颈在 于核心零部件的供应。例如，新产品采用了台积电最新的2纳米工艺A20芯片，而该 工艺目前仍处于模拟量产阶段，其产能能否跟上是首要挑战。此外，包括三星屏幕在内 的其他核心部件供应同样是产能的限制因素之一。根据目前的预估，全球供应链的极限 产能在现有800万至1000万台目标的基础上，最多只能增加约200万台。 从产品发布到消费者可以线上预约购买有一个月的时间差，在此 期间，消费者是否有机会在AppleStore等线下门店体验到样 机？ 消费者在线下门店体验样机的时间会比往年有所提前，但无法在发布会后立刻实现。根 据计划，中国大陆的主要合作媒体将在9月发布会同期率先拿到评测样机。随后，美 国部分AppleStore将在9月中下旬展示少量样机。公司力争在2026年国庆黄金周 前，即9月30日左右，在中国大陆部分核心城市的旗舰AppleStore提供样机展示。 但要实现中国大陆所有门店的全面铺货，预计需要等到10月中旬至11月。授权经销 商和三大运营商渠道获得样机的时间会更晚，大约在10月底至11月中旬，比直营店 晚一到两周。 与往年相比，公司2026年针对新品发布的媒体与大V的策略 有何不同？对于拿到评测样机的媒体或个人，是否存在拆机等方 面的限制？ 公司2026年的策略与往年有所不同。以往，公司会邀请B站、小红书、微博等平台 的数码测评博主前往美国参加发布会，并在当地获取评测样机进行内容创作，如拍摄 Vlog。2026年，公司将重点邀请国内顶级的大V以及微博、小红书等平台的官方媒 体，并首次允许他们将评测样机带回中国大陆。此举旨在让更多用户能更早地接触到产 品信息。不过，此次提供的评测样机数量非常有限，仅提供给行业内最头部、最资深的 专业人士。公司与接收样机的个人或机构签订了严格的合同，明确规定在消费者拿到产 品之前，绝对禁止对设备进行任何形式的拆解。 市场传闻公司正在储备折叠iPad项目，并高度关注此次折叠手 机的市场反馈，这一情况是否属实？可否介绍一下公司在其他折 叠产品系列上的构想与进展？ 从宏观战略层面看，公司致力于完善产品矩阵与生态矩阵，以增强与主要竞争对手(如 华为)的竞争力。华为在产品矩阵方面表现出色，而公司的优势在于生态系统。通过强 化产品矩阵，公司有望获得更大的市场优势。 具体到折叠产品，公司确实有一个折叠iPad项目。该产品可以视为苹果与三星之间的 一次重要合作。尽管公司在供应链、研发及专利方面已为这款折叠iPad进行了大量部 署，但目前在供应链环节遇到了一些技术挑战。公司计划采用与Ultra系列产品相同的 无折痕铰链技术，但在相关材料与技术上遇到了瓶颈。因此，该产品的上市时间预计将 推迟至2028年或2029年。 除了已提及的折叠iPhone和折叠iPad项目，公司是否还有 更大尺寸折叠产品的规划？ 公司确实有开发更大尺寸可折叠设备的计划，可以将其视为现有iPad产品的升级版， 或是平板与笔记本电脑核心形态的革新，类似于一款可触屏版的MacBookUltra。不过， 该项目在公司当前的全球战略中并非最高优先级。 公司的初步战略规划是：首先确保Ultra系列产品的成功，其次是推进折叠iPad项目， 最后再着手开发更大屏幕的折叠设备。因此，这款更大尺寸的折叠产品属于公司在2029 至2030年之后的远期规划。 在发布会脚本中，新任负责人提及\"液态金属\"这一技术点的具 体频次和呈现方式是怎样的？ 根据记忆，在发布会脚本中，\"液态金属\"这一技术概念会被提及。在呈现方式上，除了 口头讲解，还会配合动画进行视觉化展示。 关于折叠屏产品，第一代与第二代之间是何种关系？是否存在第 一代产品仅作为小批量试水(例如一两百万台)的可能性？ 第一代和第二代折叠屏产品之间是迭代关系。第一代产品并非小批量试水，而是计划进 行大规模量产和销售的正式产品。 苹果折叠屏手机第一代和第二代的迭代策略是怎样的，是否会因 为第一代销量不佳而影响第二代的推出？ 苹果折叠屏手机第一代和第二代的迭代计划不会受到第一代市场表现的影响。从产业结 构和公司战略两个维度来看，中国大陆是至关重要的3C市场，竞争激烈，消费者也 变得更为理性。因此，若想在中国市场取得成功，必须推出具备吸引力的产品。 第一代产品的核心使命是\\\\\"破冰\"并获得市场的\"入场券\"。而计划于2027年发布的 第二代产品\\\\，其目标是实现体验上的全面补全。更重要的是，2027年是iPhone发 布20周年，这对苹果公司具有里程碑式的意义。因此，届时发布的第二代产品，必须 被打造成一款非常出色的产品，既要取得市场成绩，也要真正展现苹果的品牌魅力。基 于此战略考量，即使第一代产品销售不佳，第二代的项目也不会被取消。 既然第一代折叠屏手机已经应用了3D玻璃和液态金属等新材 料，第二代产品将在哪些方面实现更惊艳的升级？ 第二代产品带来的惊艳之处主要体现在体验感的全面升级，而非侧重于引入新的材料技 术。 新任CEO是否会亲自介入并决定具体的技术路线，例如在材料 选择上？ 新任CEO会深度介入技术方向的决策。他本身具备深厚的技术背景，上任后已进行了 一次大规模的组织架构调整，将产品路线委员会提升至运营委员会的层级，这在库克时 期是没有的。这一系列调整表明，他会直接参与包括自研芯片、电池技术、材料技术在 内的多项关键技术决策。 液态金属技术方案是否由新任CEO亲自过问？该技术未来是 否会扩展应用到转轴以外的其他部件，如中框或支撑件？ 液态金属方案是由新任CEO亲自过问并最终确定的。在铰链方案的甄选过程中，内部 曾有三套备选方案：不锈钢加齿轮、钛合金加齿轮以及液态金属加复合齿轮。最终选择 了成本最高的液态金属方案，其目的正是为后续产品进行技术铺垫。这项技术的应用并 非一次性尝试，未来将扩展应用于苹果更多的高端产品线，如折叠iPad和折叠Mac 等，并会持续优化其应用效果。 新任CEO上任后，苹果的手机型号似乎显著增多，这是否反映 了他的个人风格？未来是否会效仿安卓厂商，形成春秋两季的发 布节奏，并推出不同定位的折叠屏手机？ 增加产品型号是为了构建一个更完备的产品矩阵，以应对中国及欧洲等市场的变化，从 而获取更多话语权。其核心目标是通过错峰发布来抢占更多市场份额。具体的策略是\\\\\" 高端先行\"\\\\，通过Ultra等高端型号保证利润、营造稀缺性；而其他产品线则通过硬件 优先和技术代差来展开竞争。在这种策略下，错峰发布成为必然选择。 不过，苹果不会效仿安卓厂商每年推出两款定位不同的折叠屏手机。公司需要依靠高端 产品来维持利润，必须回归高端市场的生意模式，避免与中低端市场的品牌进行价格竞 争，因为这会损害公司的营收和利润。 从供应链角度看，苹果在2026年四季度与NAND、DRAM供 应商的议价能力是否会增强，从而带动存储芯片价格下降？ 鉴于三星、海力士、美光三大巨头受AI市场影响，高带宽内存价格正处于上涨周期， 存储芯片价格短期内下降的可能性不大。面对这一趋势，苹果的策略是调整产品配置以 拉动利润。未来的机型将普遍从256GB起步，128GB的时代基本结束。通过提升入 门容量，并推出1TB甚至2TB等更大容量的版本，以大容量存储配置来提升整体利 润空间。", "status": "extracted"}, "attachment:files/中金公司-不动产与空间服 nd": "post", "title": "2026-09-10 09:39", "source_label": "帖子正文", "excerpt": "老师们重视网络安全 1）美股AI安全个股持续上涨，cloudflare、datadog昨晚大涨，okta、crwd、panw今年趋势涨幅均超三倍 2）自openai越狱事件后，AI安全每天都有重磅新闻，联合国等各国际组织相继发出重磅警告，openai昨晚表示正推动实施强制性AI安全监管要求 3）中美", "content": "老师们重视网络安全 1）美股AI安全个股持续上涨，cloudflare、datadog昨晚大涨，okta、crwd、panw今年趋势涨幅均超三倍 2）自openai越狱事件后，AI安全每天都有重磅新闻，联合国等各国际组织相继发出重磅警告，openai昨晚表示正推动实施强制性AI安全监管要求 3）中美924会面将讨论AI安全风险，这次对话级别很高，是中美之间首次专门讨论AI的正式双边对话 关注：中新赛克、天融信、国安股份、绿盟科技#文字观点", "publish_time": "2026-09-10 09:39", "tags": ["文字观点"]}, "attachment:files/中金公司-血制品行业跟踪(1)：难替代的刚需赛道，长期仍具韧性-260908.pdf": {"id": "attachment:files/中金公司-血制品行业跟踪(1)：难替代的刚需赛道，长期仍具韧性-260908.pdf", "kind": "attachment", "title": "中金公司-血制品行业跟踪(1)：难替代的刚需赛道，长期仍具韧性-260908", "source_label": "中金公司", "excerpt": "血制品行业跟踪 血制品行业跟踪(1) ：难替代的刚需赛道 ：难替代的刚需赛道 长期仍具韧性 长期仍具韧性 2026-09-08 行业近况 尽管血制品行业短期面临压力，但作为国家的重要战略性储备物资及重大疾病急救药品，其临床刚需价值在创伤急救、免 疫缺陷、血友病等治疗领域，短期内无法被完全替代。评论 血液制品源于人体血浆，具备资源稀缺性。", "content": "血制品行业跟踪 血制品行业跟踪(1) ：难替代的刚需赛道 ：难替代的刚需赛道 长期仍具韧性 长期仍具韧性 2026-09-08 行业近况 尽管血制品行业短期面临压力，但作为国家的重要战略性储备物资及重大疾病急救药品，其临床刚需价值在创伤急救、免 疫缺陷、血友病等治疗领域，短期内无法被完全替代。 评论 血液制品源于人体血浆，具备资源稀缺性。血浆约占血液体积的 55% ，血浆中仅有约 7% 是蛋白质。血液制品的特殊性体 现在其从原料到终端均受到严格约束。原料来源上，血浆是目前唯一的生产原料，国内采浆量长期存在较大缺口。产品方面，血 液制品在急救、免疫缺陷和部分罕见病治疗中具有临床必需性，血浆中多种蛋白组分无法完全通过重组技术替代，生产环节也对 质量控制要求较高。监管层面，国家严格监管，血浆站按区域设置。这些因素共同构成了血制品行业区别于一般药品的行业基 础。 血液制品临床刚需属性明显，部分场景不可替代。白蛋白在失血性休克、烧伤等的治疗中发挥着不可替代的作用。免疫球 蛋白 G （ IgG ）替代治疗是抗体缺陷类 PID 的重要治疗手段。重型血友病患者一旦发生出血，必须立即、足量予以凝血因子替代 治疗。血液制品用药得到多个国家医保政策保障，我国国家医保目录收录的血液制品用药种数与海外部分发达国家目录相差不 大，医疗保障力度较大。 产业链监管较为严格，供给端具备高准入壁垒。中国血液制品的产业链呈现一体化态势。从上游看，中国血液制品禁止使 用回收血浆且对捐献血浆行为规定较为严格；从中游看，血液制品企业拥有单采血浆站的所有权和管理权，监管细致；从下游 看，相较于普通药品，血液制品的流通及销售要求依然细化明确。我们认为中国对血液制品的监管或将继续严格并逐步细化。 估值与建议 我们认为当前血制品行业短期虽面临一定程度的供需错配，但血制品行业的临床刚需底色并未根本性转变，长期看仍具备 一定韧性，建议关注行业领先的头部公司，天坛生物等。 风险 血浆供应安全性；行业政策变化；技术进步超预期。 仅供内部参考，请勿外传", "status": "extracted"}, "post:2026-09-10T07-45:643b7479c85d": {"id": "post:2026-09-10T07-45:643b7479c85d", "kind": "post", "title": "2026-09-10 07:45", "source_label": "帖子正文", "excerpt": "🎁 c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>AI 算力/大模型\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：GPT-6 Astra 在推理与执行上实现代际跨越，智能水平提升，对齐程度最高，在理解用户意图和规范模型行为方面有显著改进；架构迭代带来算力与 IO 需求结构切换，对高算力服务器硬件需求进一步抬升。\u003c/li>\n\u003cli>今天出现的催化/验证：GPT-6 Astra 推出；DeepSeek V4.1 Flash 正式落地；摩尔线程合作京东云拟建十万卡集群；工信部正式印发《信息通信行业发展“十五五”规划》，将 AI 算力纳入新型信息基础设施建设核心板块。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：AI 驱动结构性扩产，Camtek 订单积压至 7 月已达 6 亿美元，覆盖逻辑、封装与 HBM 存储等多元化应用，管理层称当前需求环境为公司历史上最佳，预计 2026 年下半年环比增长超 30%，2027 年将是强劲增长年。\u003c/li>\n\u003cli>今天出现的催化/验证：封装调研涉及 CoWoS-L 技术进展及量产良率、封装供应商导入规划、HBM3E 供应及 2027 年产品放量预期；存储设备调研涉及公司扩产及企业级产能规划、各类设备国产化率/进展及份额预期、核心零部件国产替代瓶颈；寒武纪除与通富微电合作外，在先进封装领域同时与盛合晶微和长电科技接洽。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：光模块前景乐观，10 月 6 日投资者日将更新指引；在 NPO/CPO 赛道布局优势明显；光模块业务今年年末毛利率将逼近长期目标区间 38%-40%，明年年末有望摸到该区间上沿；3.2T/NPO 价值量进一步重估，3.2T 相对 800G 总带宽提升约 4 倍，预计硅光 PIC 价值量提升至约 2.5—4 倍，TIA+Driver 整体价值量提升至约 2—3 倍。\u003c/li>\n\u003cli>今天出现的催化/验证：光博会 NPO Summit 举办，NPO/LPO 去 DSP 加速落地；瑞可达 NPO socket 配套大客户研发，FAU 单月出货量环比翻倍增长；铭普光磁 ELSFP 外置光源模块启动送样；磷化铟调研涉及高纯红磷与多晶供给节奏、衬底扩产/锁单与价格趋势、大尺寸衬底及新进入者进展。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：行业基本面强劲，短期季度存在超预期潜力，新架构变化给远期业绩带来上修空间；mSAP 应用场景有望拓宽，1.6T 光模块规模化量产，其 PCB 采用 6 阶 mSAP-SLP 设计方案，PCB 行业中的 mSAP 产能供给变得极度紧张；经过 8 月反弹，PCB 核心标的估值上修至对应明年 19-21xPE，CCL 上修至对应明年 23-24xPE。\u003c/li>\n\u003cli>今天出现的催化/验证：德福科技 CCL 客户份额扩张提速，27 年有望成为松下（份额 70%）、生益一供；HVLP 铜箔出货提速，26 年 8 月 HVLP 铜箔 533 吨（HVLP-4 73 吨），9 月 650~700 吨（HVLP-4 150~160 吨）；铜冠铜箔 HVLP4 月出货已大几十吨，年底预计 200t/月；生益科技 9 月已开始落地新一轮提价，材料仍高度短缺，CCL 及电子布等 27 年仍将保持相对供需紧缺状态。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>液冷/电源/散热\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：GPU 散热核心部件 GPU、HBM、光模块及 VRM 均需 TIM 材料，GB300 单 GPU 及 HBM 配套 TIM 价值量约 20 美元，Rubin ；Rubin ；液冷业务海外突破，高盈利订单有望加速释放。\u003c/li>\n\u003cli>今天出现的催化/验证：谷歌 2MW 液冷项目备料已覆盖，但进度慢于预期，预计 2027 年方可大规模放量；谷歌 CDU 需求总量预计 5,000-7,000 台，1.4MW 因技术成熟仍为当前主流，2MW 方案竞争激烈，供应商多达 8-10 家；高澜股份是维谛液冷方舱管网方案现阶段国内唯一供应商；德邦科技已给 cx 送样 TIM 散热材料、底填胶产品。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>新能源/汽车\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：中东冲突升级推动油价破百、欧洲气价创近三年新高，化石能源性价比显著下降，“性价比提升+替代刚需释放+能源安全加码”三重利好光储板块；储能企业 1H26 出海趋势明确，带动板块业绩增长，但短期波动会重整储能行业竞争格局。\u003c/li>\n\u003cli>今天出现的催化/验证：欧洲天然气价格攀升至 80 欧元/兆瓦时，连续第四个交易日上涨，创下自 2023 年以来的最高水平；碳酸锂周度更新显示本周进一步去库，SMM 电池级碳酸锂 14.5 万元/吨，周环比 -7.2%；光伏治理低价无序竞争再落一子，国家发展改革委、市场监管总局联合印发《关于重要工业品低价无序竞争成本核算有关事项的通知》。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>GPT-6 Astra 推出：ARC-AGI-3 从个位数跃升至 99.9%，FrontierMath Tier 4 达 98%，OSWorld 2.0 任务完成率从 65.7% 提升至 72.6%；在计算机使用、浏览器操作、软件工程、网络安全、科学及专业工作等领域均达到业界领先水平。\u003c/li>\n\u003cli>DeepSeek V4.1 Flash 正式落地，国产模型开始推进新一代基座架构；市场对 OpenAI Astra 循环深度架构讨论升温，海外旗舰模型可能将更多能力沉淀。\u003c/li>\n\u003cli>光博会 NPO Summit 举办，NPO/LPO 最核心变化之一是去掉模块内部 DSP；瑞可达 NPO socket 配套大客户研发，FAU 单月出货量环比翻倍增长；铭普光磁 ELSFP 外置光源模块启动送样。\u003c/li>\n\u003cli>苹果发布 iPhone 18 Pro/Pro Max 及首款折叠屏 iPhone Duo、Apple Watch Series 12/Ultra 4 与 AirPods 5；iOS 27 将于 9 月 14 日推送，Siri AI 同步推送。\u003c/li>\n\u003cli>PCB 产业链再获强调：Q3-Q4 业绩存在较大上修空间；德福科技 HVLP 铜箔出货提速；铜冠铜箔 HVLP4 月出货已大几十吨，年底预计 200t/月；生益科技 9 月已开始落地新一轮提价。\u003c/li>\n\u003cli>液冷龙头调研显示：谷歌 2MW 液冷项目备料已覆盖，但进度慢于预期，预计 2027 年方可大规模放量；谷歌 CDU 需求总量预计 5,000-7,000 台，1.4MW 为当前主流，2MW 方案竞争激烈，供应商多达 8-10 家；高澜股份海外客户重大突破，液冷业务迎来放量拐点。\u003c/li>\n\u003cli>工信部正式印发《信息通信行业发展“十五五”规划》，将 AI 算力纳入新型信息基础设施建设核心板块，聚焦算力设施升级、算网协同融合、国产算力赋能、绿色安全发展等关键方向。\u003c/li>\n\u003cli>宏观与策略：布伦特原油期货突破 100 美元/桶，创 7 月 24 日以来新高；欧美国债市场再度掀起抛售潮，美国 10 年期国债收益率日内一度创 2023 年 11 月以来最高水平，欧洲多国国债收益率全线走高；美国财政部将在周四回购最多 60 亿美元长债；今日成交 18732 亿，缩量 105 亿。\u003c/li>\n\u003cli>铜行业：上半年全球主要铜矿企业产量同比 -4.6%（Q1 -4.3%/Q2 -4.9%），连续四个季度下滑；铜价双创历史新高，铜价逼近 1.5 万美元后引发“泡沫”警告，
