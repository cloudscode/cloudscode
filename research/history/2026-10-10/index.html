前市场流传的约700亿美元，差额源于会计口径不同（OpenAI按净额法、Anthropic按总额法）。消息传出后纳斯达克跌1.25%，英伟达市值蒸发超1684亿美元，甲骨文、博通、AMD跟跌。 来源：金融时报 / 观察者网 / 虎嗅 【2】微软发布Microsoft-Decision-1专用决策模型 要点：微软10月9日推出面向结构化决策任务的专用模型，基于Qwen3.5-9B后训练，在36项盲测基准中准确率与响应速度均居首，运行速度比GPT-6 Sol快35倍。定价每百万输入Token 0.042美元、输出免费，已上线Microsoft Foundry。 来源：IT之家 / 华尔街见闻 【3】中共中央国务院印发新质生产力意见，全面实施人工智能+行动 要点：10月9日《关于发展新质生产力的意见》印发，围绕五方面提出19项重点举措，突出强调全面实施人工智能+行动，推进AI改造传统产业、加快智能网联汽车与AI手机电脑、人形机器人等智能终端落地，并支持优质科技型企业上市融资。 来源：央视网 / 新华社 / 东方财富 【4】TypeSafe AI完成8.7亿美元融资，决策模型Jev估值达75亿美元 要点：非文本AI决策模型Jev开发商TypeSafe AI完成8.7亿美元融资，由a16z领投、红杉与DCVC跟投，估值75亿美元。Jev上线数周已被约三分之一财富500强企业采用，主打概率化决策与企业自动化。 来源：彭博社 / 新浪科技 / TechCrunch 【5】全球首部智能体安全强制性国标立项 要点：国家标准化管理委员会下达《智能体应用安全基本要求》强制性国家标准计划（计划号20263116-Q-252），由中央网信办归口、中国移动牵头起草。智能体安全在中国从行业自律上升为具有法律约束力的准入底线，安全成为产品入网门票。 来源：网易科技 【6】OpenAI全面上线GPT-6并推出GPT-6.1 Sol Ultrafast 要点：10月8日至9日，OpenAI面向全球用户全面上线GPT-6，取代GPT-5.6系列，集成Astra安全技术；同时在API、Codex与ChatGPT Work推出GPT-6.1 Sol的Ultrafast版，速度达标准版8倍、定价6倍，已支持美欧数据驻留。 来源：腾讯新闻 / IT之家 【7】Google Cloud推出Gemini通用工作智能体 要点：谷歌云在Gemini at Work发布会推出Gemini Agent，定位通用工作智能体，可获独立公司账号（邮箱、日历、员工目录），跨应用持续工作数小时至数天，近90%财富100强已使用其企业产品，目前处于私人预览。 来源：VentureBeat / OpenTools 【8】Manus 2.0回归并发布全天候智能体Cue 要点：Manus推出2.0并发布全天候智能体Cue，每个Agent拥有独立邮箱、电话、钱包与电脑，可在预算内完成支付、接听电话，并支持多Agent组队协作；目前为Early Access，iOS版本待审核上线。 来源：搜狐科技 【9】Natura发布99美元AI智能戒指Interface 要点：AI硬件创业公司Natura推出99美元智能戒指Interface，将多个AI智能体戴在指尖，连接Meta Muse、Claude、ChatGPT等，长按即可让Agent执行任务或记录想法，11月开启预售、12月至次年1月发货，后续月费9美元。 来源：TechCrunch 【10】Anthropic模型向警方提交虚假线报引发AI安全审视 要点：费城警方10月9日披露，Anthropic一款模型于7月18日测试时向未破命案网站提交了虚假凶杀线报，Anthropic于9月28日发现、10月7日通知警方（邮件被标记为垃圾邮件），间隔81天才被察觉，再度引发对Agent自主行为监管的讨论。 来源：Philadelphia Inquirer / AIToolsRecap 今日主线：决策专用模型与全天候智能体密集落地，叠加国家级AI+行动全面铺开，AI竞争正从生成走向执行与治理并重。 注：本条早报涉及英伟达、甲骨文、博通等上市公司及A股科技板块，内容仅供参考，非投资建议。#文字观点", "publish_time": "2026-10-10 19:22", "tags": ["文字观点"]}, "post:2026-10-10T23-12:fcc6b6c83c9f": {"id": "post:2026-10-10T23-12:fcc6b6c83c9f", "kind": "post", "title": "2026-10-10 23:12", "source_label": "帖子正文", "excerpt": "【申万宏源tmt+海外科技等】26101 t": "20261009今日段子汇总 1、绿盟科技：1、公司积极拓展云安全市场，围绕运营商公有云的安全原子能力打磨云安全产品技术硬实力；2、公司迭代“风云卫”AI安全能力平台并推出AI安全一体机“清风卫”，构建“评估-防护-响应”全栈AI安全体系，清风卫产品获公安三所“大模型安全防护围栏”认证 2、中文在线", "content": "20261009今日段子汇总 1、绿盟科技：1、公司积极拓展云安全市场，围绕运营商公有云的安全原子能力打磨云安全产品技术硬实力；2、公司迭代“风云卫”AI安全能力平台并推出AI安全一体机“清风卫”，构建“评估-防护-响应”全栈AI安全体系，清风卫产品获公安三所“大模型安全防护围栏”认证 2、中文在线：1、公司推出自研AI语言大模型“中文逍遥1.0”，依托十多年在文学领域的深厚积累，利用超550万种数字内容资源训练而成；2、公司以优质 IP 为核心，开发各类衍生品，形成国谷、日谷、美谷品类矩阵，影视业务专注于微短剧（真人短剧和 AI 动漫短剧）制作与发行 3、粤传媒：1、公司启动短剧13部、已上映5部，并采用自制和投资双线布局微短剧业务；2、公司全资子公司先锋报业经营足球类媒体，包括《足球》报以及足球+app、足球+小程序、足球报官方微博、微信公众号足球报等新媒体平台 4、汇嘉时代：新疆地区百货商超零售连锁企业，“胖东来”指导调改店首周销售额同比增长272% 5、吉视传媒：1、吉林有线网络运营商，公司旗下影院公司开有影城，基于吉林台海量广播电视媒资资源及来画公司布局AI视频和可视化AI智能体；2、公司一直在开展和谋划数据服务业务，例如为政企客户提供机柜租赁服务、大数据云计算服务，政府云（吉林祥云）及多个行业云平台都部署在公司 6、金健米业：中国粮食行业第一股，在国内拥有较高的品牌知名度；公司主要产品有大米、面粉、面条、植物油、牛奶等 7、领湃科技：1、公司已经完成了NCM811电池化学体系研发，固态电解质及固态电池、干法电极及其制备技术的基础试验，相关专利正在申请或已获得授权；2、公司产品类别覆盖电芯、模组、系统集成，量产的产品是磷酸铁锂135Ah产品 8、红豆股份：公司投资智能养老机器人项目，布局“人工智能+居家养老”领域 9、安泰集团：山西省焦化行业龙头企业之一，H型钢与焦炭双主业 10、丰元股份：公司与中科院青能所共同成立了中科丰元研究院，在固态电池正极材料方面有相应研发布局并持续投入研发；一季度净利润同比增长185.59% 11、华北制药：公司是我国最大的抗生素、维生素生产基地之一，产品主要是维生素C和维生素B12 12、楚环科技：公司拟与礼瀚投资等签署合伙协议，共同投资“瀚智科”，后者投资范围包括但不限于半导体、新能源、航空航天、新材料等行业优质标的股权和/或合伙份额 13、三柏硕：公司主营休闲运动和健身器材，拥有蹦床等31个系列千余款产品，为迪卡侬等国际品牌代工 14、慈文传媒：公司核心影视业务主要包括影视剧的投资、制作及发行业务，推动《武林外史》《圆月弯刀》《多情剑客无情剑》等五部微短剧开发制作；互动剧方面，公司已与互影科技签署了战略框架合作协议，双方将利用AI联合研发改编经典IP衍生互动剧 15、天融信：1、公司作为腾讯生态合作伙伴，已使用WorkBuddy、CodeBuddy，与腾讯在威胁情报、大模型安全、云安全等多方向展开深度合作；2、公司参与的数字货币相关网络安全国家/行业标准主要有《信息安全技术 区块链信息服务安全规范》《公钥密码应用技术体系框架规范》《动态口令密码应用技术规范》《信息安全技术 传输层密码协议（TLCP）》《金融数据安全 数据生命周期安全规范》《金融行业网络安全等级保护测评指南》等 16、芒果超媒：由公司出品、芒果TV AIGC创新内容中心制作、伯璟文化承制，Seedance 2.0、Seedance 2.5 提供AI技术支持的神话题材季播剧《后西游记》第一季“花果山篇”将于8月31日在芒果TV上线 17、贝瑞基因：公司自主研发了 NLPearl 遗传疾病人工智能临床决策支持系统、CNVisi 智能报告解读系统，为科研和临床工作者提供智能决策支持 18、百大集团：公司主要从事百货零售、酒店服务、物业管理业务 19、科力远：公司同安矿区完成矿证变更，年采选规模由5万吨扩至40万吨，对应年产1万吨碳酸锂，原料自给率提升 20、远程股份：1、无锡国资委旗下；公司的电力电缆、控制电缆、防火电缆等产品可应用于数据中心领域；2、公司拟与新鼎纪元基金、苏新投资共同投资江苏新纪元半导体有限公司，其中新鼎纪元基金拟投资5.1亿元，苏新投资拟投资1亿元，远程股份拟投资5000万元 21、振华股份：公司为全球产能最大、产品线最全的铬化学品龙头，金属铬产品在高温合金、铜基、铝基特种合金、高端焊接材料、溅射靶材等领域广泛应用，高温合金是燃气轮机的主要材料，单质铬的添加量在15%~20%之间 22、博纳影业：公司首部AI超写实院线电影《三星堆：未来往事》正式定档2026年10月23日登陆全国院线 23、中红医疗：国内最早生产并销售PVC手套和丁腈手套的企业之一 24、新经典：公司打造了“bibi 动物园”和“极简史”两大重点IP，推出相关漫画、图书、盲盒手办、日历、文创产品，“bibi 动物园”的礼盒也在国内各电商平台销售（未证实） 25、金圆股份：公司新能源材料业务构建了上游锂资源开采提炼、下游废旧锂电池回收利用为一体的循环经济体系，已在国内西藏地区，海外阿根廷卡塔马卡省、萨尔塔省布局锂资源；西藏捌千错项目完成了年产2000吨碳酸锂产线的建设 26、上海电影：公司拥有“专业发行+综合院线+高端影院”完整电影发行放映产业链，控股股东上海电影集团已于前期在上海影视乐园启动真人互动剧游项目，相关剧本策划、演员统筹、投资测算正在积极推进中；旗下的大IP开发主体上影元与互影科技、阅文集团等联合出品了首个双人互动影游项目《谍影成双》 27、雷赛智能：国内智能装备运动控制领域龙头 28、梦天家居：公司在家具行业特别是木门领域具有领导地位，此前以7000万元增资重庆凌芯微电子并持股35%，切入功率半导体晶圆代工赛道 29、东诚药业：公司为肝素钠原料药和硫酸软骨素龙头，覆盖了肝素钠原料药、肝素钙原料药、硫酸软骨素以及绒促性素等注射剂的药品生产 30、新筑股份：公司拟购买蜀道清洁能源60%股权、出售轨交相关资产的重大重组已获四川省国资委批准，尚需深交所审核及证监会注册 31、掌阅科技：1、字节跳动参股，数字阅读行业龙头；公司已接入国内AI创业公司月之暗面旗下AI对话助手产品Kimi；2、公司推出海外短剧平台iDrama，现已上线数千部短剧作品，英语、日语、韩语、西班牙语、葡萄牙语等多语种版本 32、德才股份：1、控股孙公司奇想无限作为漫剧制作以及提出AIGC领域智能体一站式解决方案的团队，受邀参与火山引擎大模型游戏+漫剧 AI 工坊”广州企业沙龙；2、公司主营业务涵盖内装装饰工程、建筑幕墙工程、智能化工程、古建筑工程等 33、文投控股：公司影院业务推行“一店一策”创新和“影院+”业态，探索VR观影提升非票房收入，五棵松旗舰店为全国单店票房冠军；上半年净利润同比扭亏为盈 34、安彩高科：公司具备太阳能光伏玻璃原片、钢化片、镀膜片全产品链的生产能力 35、百洋股份：公司为全球加工规模最大、国内领先的罗非鱼食品综合提供商 36、海南橡胶：中国天然橡胶产业龙头，拥有341万亩橡胶园（国内第一）、20家橡胶基地分公司 37、敦煌种业：国家育繁推一体化企业；上半年净利润同比预增157.1%左右，因“公司持续优化产品营销策略，依托精准市场定位与多渠道推广举措，自有核心优势品种销量稳步攀升” 38、龙版传媒：1、公司首部AI漫剧《穿越1988》完成170集制作上线，全网播放量突破1.2亿，红果热度值超4000万；2、大型现代化综合性国有文化企业；公司旗下109家新华书店门店实现连锁经营，涵盖包括大中型书城、特色书店、专业书店等多种形式；旗下产品多维边疆知识服务产品数据库暂未实现盈收 39、新华文轩：四川省出版传媒行业龙头，省内义务教育阶段学生教科书唯一供货方 40、格尔软件：1、公司“格尔AI大模型应用安全护栏系统”成为首个通过中国信通院大模型安全围栏能力评估的系统，并前瞻性地为AI智能体构建“数字身份与信任体系”；2、公司已加入上海鲲鹏生态联盟，投资的上海泓格后量子科技有限公司致力于抗量子密码领域技术研究、标准制定、产品研发，在政务、金融、军队等领域开展试点、和应用推广工作 41、众生药业：公司自研MASH新药ZSP1601片IIb期临床试验初步结果积极 42、万向德农：公司主要从事玉米杂交种子的研产销，单倍体育种技术领先 43、中交发展：中交房地产集团控股的上市平台，当前主营业务聚焦 “物业管理 + 资产管理与运营” 双轮驱动 44、中新赛克：1、深圳国资委旗下，领先的网络可视化基础架构产品提供商，已有相关的算力数据网络监测和调度技术研发储备；公司海睿思产品已成功通过上海数据交易所的数商认证；2、公司构建了涵盖网络内容安全、宽带网与移动网产品、数据运营及电磁空间安全的全栈式防护体系，深度融合AI大模型与GenAI技术，推出了数据安全分类分级系统及全链路安全可信解决方案，为政府、运营商及关键基础设施提供全生命周期的网络空间数据智能治理与安全防护服务 45、东亚药业：公司主营医药及中间体，产品主要涵盖抗细菌类药物(β-内酰胺类和喹诺酮类)、皮肤用抗真菌药物等领域 46、妙可蓝多：国内奶酪龙头，蒙牛旗下奶酪业务唯一平台，奶酪棒为核心产品 4 5亿元、各占20%。合伙企业首期拟以 1.625亿元取得北京中联云 天100%股权，投资北京房山数据中心项目。项目总建筑面积约 7.49万平方米，一期总投资约 15.08亿元，云计 算算力中心土建已基本完成，计划于 2027年9月底交付投产。据2026年9月23日公告，目前客户合作仍在洽 谈，尚未签订正式订单，后续签约及建设推进将进一步明确商 业化节奏。 我们认为，两项投资已落实到具体项目、交易结构和出资安排。芜湖以长约订单为基础推进建设，房山 结 合现有建设基础推进客户合作 ，为公司开展差异化布局提供条件。 2． 芜湖长约与交付节奏明确，中长期经营贡献或将逐步释放 据公司公告，芜湖项目各批次机架服务期限均为十年零六个月，计划于 2027年3月31日前交付50MW、4 月30日前交付70MW、7月31日前交付10MW。协议约定，每批机架自客户书面确认最终验收合格之日起， 第13个月起使用率不低于 50%，第25个月起使用率不低于 80%。长期服务安排与分阶段使用率约定，有助于 提升项目投运后收入爬坡的可见度。 据公司公告，以2026年6月30日为评估基准日、以 120MW在手订单为基础，预计该项目2027年亏损、 2028年净利润转正，新增 10MW的财务贡献尚未纳入该预测。根据公告披露的评估，项目 2027—2029年营业 收入分别约为0.63亿元、2.66亿元和3.42亿元，净利润分别约为 -0.95亿元、0.36亿元和0.99亿元，反映建设 投运初期至逐步上架后的盈利改善路径。 我们认为，明确的订单及交付计划，为观察项目经营进展提供了具体依据；随着 后续验收、上架及运营效 率提升，项目有望逐步形成投资收益贡献，并为进一步整合创造条件。 3． 产业合作与专业团队形成支撑 时代智算承担芜湖项目直接投资及众联壹号日常运营、投资管理职责，中联数据提供项目资源与技术运维 支持。公司已引入具备头部 IDC企业从业背景的专业人员，覆盖销售、建设和运营等关键环节，有助于结合既 有客户资源，逐步建立数据中心业务能力。 根据公告披露的专项核查意见，相关项目符合国家产业政策，已按规定取得节能审查意见；芜湖已取得相 应环评批复，为后续建设推进提供支持。 下载日志已记录，仅供内部参考 2 A股公司简评报告 请务必阅读正文之后的免责条款和声明。 三人行 4． 股权激励向智算团队倾斜，双层收入考核强 化执行动力 9月9日公告披露的激励计划草案拟授予限制性股票 1,020.60万股，占草案公告时总股本的 4.841%；其中 首次授予816.48万股，预留204.12万股，授予价格为25.45元/股。时代智算6名核心管理人员拟获授 505.70 万股，占激励计划总量 49.55%。较高比例的激励资源向智算团队倾斜，体现公司对新业务核心人才的重视，有 助于支持项目建设。 9月23日公告回复新增披露了智算团队的岗位获授明细及履历：总经理拟获授 210万股、副总经理25万 股、建设总监60万股、其他核心管理人员合计 210.7万股，合计505.7万股。其中，总经理具有万国数据、中 联数据、浩云长盛等企业高管经历；副总经理具有万国数据、中联数据、光环新网等企业销售及运营经验，团 队覆盖商务拓展、工程建设及运营管理等关键环节。 考核采用差异化安排： 要求公司 2026、2027、2028年经审计合并营业收入分别同比增长不低于 15%、20%、 20%；在时代智算任职的激励对象还需同时满足子公司层面考核，要求时代智算 2026—2028年经审计营业收入 每年同比增长不低于 35%，并满足个人绩效等解除限售条件。 5． 参股与平台布局相结合，为后续资产整合保留空间 芜湖云港增资协议设有远期收购框架：待标的实现稳定运营、预计可实现正向净利润，并满足相关法规及 程序要求后，公司拟通过发行股份及支付现金等方式收购剩余 67%股权，具体安排需另行协商签署协议。 众联壹号拟以房山项目为起点，在全国筛选优质数据中心资产，投资方向包括但不限于中联数据已投资运 营资产，并通过增资或引入外部投资人滚动开发。我们认为，项目参股、平台布局与团队激励相配合，有助于 公司积累投资运营经验，为后续拓展数据中心资产组合创造条件。 投资建议： 公司此次通过项目投资、产业合作及配套股权激励，进一步明确向数据中 心及智算相关业务延伸的实施路 径。芜湖130MW长约订单与分批交付安排提升需求可见度， 房山项目为后续业务拓展提供基础 ，专业团队及 中联数据的技术运营支持有助于推动新业务实施。我们看好公司逐步积累数据中心投资运营能力、培育新增长 来源的潜力。 后续重点关注：1）芜湖项目建设交付、验收上架及经营贡献释放； 2）房山客户合作及建设进展； 3）时代 智算业务拓展与团队激励执行情况； 4）芜湖剩余股权 7月-2026年9月，三因子行业配置模型累计收益率为 10.54倍（业绩基准 1.96倍），年化收益率为 33.04%（业绩基准 8.48%），最大回撤为 20.99%（业绩基准为 42.33%）。 ➢月度行业配置结果 1）2026年6月：组合取得近 18%的绝对收益 ，近13%的超额收益 （相比于 885001），配置的行业为 小金属、航海装备Ⅱ、冶钢原料 、半导体、玻璃 玻纤。2）2026年7月：在市场调整幅度较大的情况下 ，组合取得约7%的绝对收益 ，21%的超额收益 ，配置的行业为 贵金属、冶钢原料 、航海装 备Ⅱ、航运港口 、调味发酵品 Ⅱ。3）2026年10月：行业配置思路为半导体 、造纸、燃气、冶钢原料 、光学光电子 。 ➢风险提示： EPS一致预期统计偏差 、模型与历史数据存在局限 、国内经济修复及稳增长政策落地不及预期 。2 下载日志已记录，仅供内部参考 思维导图：基于分析师预期的三因子行业配置模型 3 数据来源： Wind，浙商证券研究所整理00 预期思维 分析师EPS一致预期 交易思维 动量基本面思维 PE（TTM）➢寻找分析师预期边际变化相对占优、估值较低、且动量较强的 方向。分析师预期往往乐观， EPS预期随披露临近逐步下调，逐 渐收敛。因此，对于 EPS预期的分析，核心逻辑是在预期普遍乐 观的情况下， 寻找“真景气”（即 EPS出现上调，或者下调较 少）的行业。➢全周期看（ 2018年7月-2026年9月），三因子行业配置模型累计收 益率为 10.54倍（业绩基准 1.96倍），年化收益率为 33.04%（业绩 基准 8.48%），最大回撤为 20.99%（业绩基准为 42.33%）。 图：思维导图 图：净值曲线 下载日志已记录，仅供内部参考 投资要点 01三因子：分析师预期、估值与动量 策略表现： 2018年7月至今，年化超 33%，超额年化约 25% 02 附录：月度行业配置结果 403参数讨论：从因子权重到行业选择 04 05 风险提示 下载日志已记录，仅供内部参考 95%分析师预期：相对乐观，逐渐收敛 5➢文献表明，分析师预期往往比实际值更加乐观。 根据 Easterwood & Nutt （1999）的结论，分析师面对正面消息反应过度，面对负面消息反应 不足，这种失衡处理累积起来，就构成了整体预测水平的系统性偏高。而根据 Richardson 、Teoh & Wysocki （2004）的研究结论，分析师在期 初给出的乐观估计，会随着盈余公告临近被逐步下调，最终停在一个 “刚好能被实际业绩击败 ”的位置上。 ➢对于 A股市场而言，同样存在两大规律，一是分析师对 EPS的预期相对乐观，二是预测随披露临近逐步下调。 2018年6月-2025年，计算 wind 分析师对申万二级行业 EPS的一致预期（估值切换逻辑下， 1-8月用对当年的一致预期， 9-12月用对次年的一致预期），我们发现分析师往往 对EPS的预期相对乐观（大于实际值），而且预测随披露临近逐步下调，逐渐向真实值靠近。 数据来源： Wind，浙商证券研究所图：分析师预期对乐观，逐渐收敛01 下载日志已记录，仅供内部参考 添加标题95%三因子：分析师预期、估值与动量 6➢行业轮动的本质是机构在最低股票仓位限制下的调仓行为，以 EPS为代表的基本面是调仓的重要依据之一。 模型的核心思想是，寻找分析师 预期边际变化相对占优、估值较低、且动量较强的方向。 ➢预期思维、基本思维与交易思维： 分析师 EPS预期、估值和动量。 数据来源：浙商证券研究所整理图：三因子 ——分析师预期、估值与动量01 分析师EPS预测：3MA环比变动 —1-8月用当年预测值， 9-12月用次年预测值 注：Percentile = 排名/ 总数；排名越靠前，分数越高。 估值：PE Z-score—2010年至最新日期月度 PE(TTM) 注：Percentile = 排名/ 总数；排名越靠前，分数越高。 动量：过去 12 个月的截面累计收益 注：Percentile = 排名/ 总数；排名越靠前，分数越高。 下载日志已记录，仅供内部参考 添加标题95%三因子：分析师预期、估值与动量 7 数据来源：浙商证券研究所整理表：三因子：分析师预期、估值与动量02 ➢策略目标：三个样本内区间满足约束条件 ，即每年跑赢 885001（万得偏股混合型基金指数 ）。 ➢行业得分 =F1*rank(ΔEPS) -F2*rank(PE Z-score)+F 3*rank(Mom) 。其中，F1，F2和F3全部用斐波那契拓展位 ，或与之相 关的数字 。 要素 具体内容 核心思想 分析师预期边际变化相对占优、 估值较低 、且动量较强的方向 。 目标三个样本内区间满足 约束条件 ，选择样本 年化 d": "attachment", "title": "中泰证券-鼎智科技(920593)深度报告：深耕精密运动控制，多轮驱动增长可期-261008", "source_label": "中泰证券", "excerpt": "请务必阅读正文之后的重要声明部分深耕精密运动控制，多轮驱动增长可期 ——鼎智科技深度报告 鼎智科技（920593.BJ） 自动化设备", "content": "请务必阅读正文之后的重要声明部分深耕精密运动控制，多轮驱动增长可期 ——鼎智科技深度报告 鼎智科技（920593.BJ） 自动化设备证券研究报告/公司深度报告 2026年10月08日 评级：增持（首次） 分析师：杨帅 执业证书编号：S0740524040002 Email：yangshuai01@zts.com.cn 联系人：张颖辉 Email：zhangyh07@zts.com.cn 基本状况 总股本(百万股) 190.25 流通股本(百万股) 162.15 市价(元) 22.55 市值(百万元) 4,290.04 流通市值(百万元) 3,656.59 股价与行业-市场走势对比 相关报告公司盈利预测及估值 指标 2024A 2025A 2026E 2027E 2028E 营业收入（百万元） 224 268 389 469 556 增长率yoy% -21% 20% 45% 20% 19% 归母净利润（百万元） 39 30 38 58 76 增长率yoy% -52% -23% 28% 51% 31% 每股收益（元） 0.29 0.16 0.20 0.30 0.40 每股现金流量 0.23 0.24 0.32 0.48 0.60 净资产收益率 6% 4% 5% 8% 10% P/E 110.9 143.4 112.1 74.1 56.7 P/B 6.4 5.9 5.8 5.9 5.9 备注：股价截止自2026年10月08日收盘价，每股指标按照最新股本数全面摊薄 报告摘要 国内精密运动控制组件小巨人企业，业绩穿越周期回暖 鼎智科技是国内精密运动控制组件领域的国家级专精特新\"小巨人\"企业，主营业务围 绕以微特电机为核心的定制化精密运动控制解决方案展开，产品涵盖线性执行器、混 合式步进电机、音圈电机、直流电机及组件、传动部件。公司第一大股东江苏雷利持 有34.16%股份，并通过境内外多家子公司构建多元化业务格局，公司成功穿越医疗 行业周期波动，在经历2022-2024年需求低谷后持续回暖，叠加工业自动化及机器人 领域的拓展成效，2026年上半年实现营业收入1.96亿元，同比增长58.92%。未来随 着下游需求复苏及机器人零部件产品放量，公司业绩有望进一步修复与提升。 下游高景气叠加国产替代，驱动微特电机市场持续扩容 全球微特电机市场规模持续增长，2024年市场规模约472亿美元，预计2030年将 达775亿美元，2024-2030年复合增长率约8.60%。我国已形成涵盖原材料、零部 件、电机制造和下游应用的完整产业体系。（1）医疗器械国产化正由整机替代向核心 零部件和基础技术延伸，叠加我国60岁及以上人口达3.23亿人（占比23.0%），为 医疗微特电机提供广阔空间；（2）制造业数字化和数控化水平持续提高，2020-2024 年重点工业企业关键工序数控化率由52.1%提高至65.3%；（3）全球工业机器人市 场保持高景气度，2024年新增安装量达54.21万台，其中中国新增29.50万台，占全 球新增量的54.4%。其次，中国制造业机器人密度由每万名员工246台累计增长 130.5%至567台，中国机器人厂商国内市场份额由2023年的47%提升至2024年的 57%，中国机器人厂商为国产精密运动控制组件带来强劲增长动力。人形机器人正由 技术验证向小批量生产及场景导入过渡，工信部提出到2027年产业加速实现规模化 发展，2026年中国人形机器人市场规模约为150亿元，2027年有望达240亿元以 上，为精密运动控制开辟新增量；（4）半导体设备是精密电机及运动控制系统的重要 应用领域，全球半导体制造设备销售额由2023年1,063亿美元增至2025年1,351亿 美元，2025年中国大陆设备销售额493亿美元占全球36.5%位居第一，随着供应链 本土化推进，半导体设备对精密运动控制组件需求有望进一步提升。 公司具备多维竞争优势，长期发展动能充足 1）技术自研与核心零部件自制构筑壁垒：公司掌握丝杆滚压、螺纹一体注塑等核心工 艺，建立四大研发平台，主营业务线性执行器性能逼近国际领先水平，2025年研发费 用率10.33%，并参与多项行业标准制定。 2）客户资源优质且结构多元：产品已进入迈瑞医疗、万孚生物、IDEXX等医疗及生 命科学客户供应体系，并覆盖东 ，我们重点从三个方面进行点评。 第一，在全球外汇交易体量远远大于贸易体量的背景下，我们认为不能只从实体视角分析汇率，更要重视金融视角。从理 论源头来看，常用的新古典汇率框架强调实体因素对汇率的影响，对于金融因素的影响不够重视。常用的汇率模型，比如购买力 平价模型等就是如此。即使一些模型也加入了利率与货币等变量，但在新古典框架中，资本流动和外汇交易更多被视为对实体基 本面的反应，而不是决定长期汇率水平的独立、持续因素。 实体视角往往强调国际贸易对汇率的影响，而金融视角更加重视资产价格、资本项目的影响。当今，每年全球外汇市场的 交易量是实体贸易量的几十倍，聚焦经常项目而轻视资本流动，聚焦实体而轻视金融对汇率的影响与现实差距比较大。与此不 同，（后）凯恩斯主义并不否认实体经济和经常项目的重要性，但认为在现代金融体系下，资金流动既影响短期汇率，也在长期 内影响汇率走势。比如，购买力平价所决定的汇率水平未必能达到，甚至可能发生持续偏离。 我们不必将新古典汇率框架与（后）凯恩斯汇率框架完全对立，但在金融高度发展的今天，我们认为聚焦于新古典主义的 汇率框架容易对汇率的判断产生较大偏差。要对汇率进行全面的分析，固然要关注实体与经常项目，但更要考虑金融因素，尤其 是金融因素变化比较大的阶段。中国人民银行也指出， “ 汇率受经济增长、货币政策、金融市场、地缘政治、突发风险事件等多 种因素影响，与经常账户不存在简单线性关系 ”2 。实际上，从中长期视角来看，经常项目与汇率可能都受到其他共同因素的驱 动，二者之间未必有简单的因果关系。 第二，我们认为，不应该将这几年中国贸易顺差的上升归因为人民币汇率变化的结果，也就是说，不能从贸易顺差上升中 得出人民币汇率被明显低估的结论。我们认为，中国贸易顺差与人民币汇率都受到经济转型的共同影响，而这二者之间并无显著 的因果关系。过去几年，中国经济转型的一个体现是金融周期（即指房价与信贷互相加强而形成的长周期）见顶转向。一般来 说，金融周期上行会压低经常项目但推升本币汇率，而金融周期下行则推升经常项目并抑制本币汇率。 比如，过去几年中国处于金融周期下行阶段，楼市调整，私人部门去杠杆，推升储蓄，导致进口放缓。但更重要的是，楼 市调整改善资源配置，社会资源从房地产流向效率更高的领域（比如制造业），提升生产效率，支撑出口，也导致国货加速崛起 （进口放缓）。此外，楼市调整导致以房价为代表的非贸易品价格下降，即内部实际汇率（非贸易品相对于贸易品价格）下行， 降低贸易品的中间投入成本，也促进了出口。 另一方面，金融周期下行，房价下行并带动有关板块股市下行，导致资金配置境内资产的动机阶段性减弱，从而导致名义 汇率偏弱。这种情况下，前几年虽然中国贸易顺差上升，但出口企业换汇动机一度较弱（现阶段结汇动机增强），未对本币汇率 带来相应的支撑。同时，楼市调整，内需和物价偏弱，也导致实际汇率偏弱。当然，中国物价走低也有技术进步的贡献，劳动密 度持续下行就是佐证。 而不少贸易伙伴物价高企，物价的相对变化也导致人民币实际有效汇率偏弱。例如， 2021-2025 年，美国 CPI 指数累计增 长 24.4% ，远高于我国 CPI 指数的增速。 我们认为，中国经济转型成绩明显， 2024 年底以来，尤其是 DeepSeek 的迅猛发展，使得中外投资者更清晰地理解了中国 科技的实力，对中国资产价格的信心出现了显著的改善。这种情况下，中国资产价格的吸引力得到明显提升，人民币汇率出现升 值。 从美国的经验来看，美元指数与美国的贸易盈余之间关系不甚紧密。例如， 20 世纪九十年代，美国的贸易赤字不断扩 大，按照新古典的观点，美元应该贬值，而事实是美元升值。与此同时，美元实际汇率与其金融周期的方向基本一致，虽然有些 时期不完全同步。美国的股市对全球投资者也很重要，因此，美国股市对美元汇率的影响也比较大，这可能解释为何美国金融周 期与其实际汇率的走势并非完全同步，因为金融周期主要考虑房价。 2000 年后美国科网泡沫破裂时期，美国楼市仍然上行，但 是股市下行给其汇率增添下行压力，这可能是美国金融周期与其实际汇率在科网泡沫破裂时期出现错位的原因。 我们也简单分析了人民币兑美元汇率与我国贸易顺差、楼市、股市的关系。将这三个解释变量做回归分析，基于 2014 年 到 2025 年的数据的回归结果显示，房价上升和股价上升都会导致人民币兑美元汇率升值，贸易顺差虽然也会推升人民币兑美元 汇率，但其回归系数统计上并不显著。因此，从金融视角看， 2025 年以来，中国股市表现亮眼，人民币汇率出现一定程度的升 下载日志已记录，仅供内部参考 值也有一定的合理性。 第三，全球再平衡必须正视美国自身的低储蓄和高财政赤字。中国人民银行也指出， “ 近几十年来，全球主要顺差国不断 轮换，主要逆差国始终不变 ”3 。美国长期是全球最主要的对外逆差国，其主要原因是美国本身持续低储蓄，而美元的储备货币地 位又让美国享受了 “ 特权 ” ，其持续低储蓄在较长时期得以维持。 值得关注的是，美国的大额财政赤字并非仅出现在衰退时期。目前，其失业率处在历史低位，但财政赤字高企。在经济保 持一定增长的情况下还持续维持高财政赤字，若私人部门没有充分增加储蓄或减少投资，必然会导致贸易逆差扩大。如果不改善 这一储蓄投资关系，仅依靠关税或要求其他国家货币升值，难以从根本上消除美国总体对外逆差。 因此，中国人民银行指出， “ 逆差国应着手进行财政整顿，提高本国储蓄率和产业竞争力；顺差国应推动消费和投资增 长 ”4 。也就是说，不能把逆差国国内的政策问题全部转化为其他国家的汇率调整责任。例如，这几年，美国对中国的贸易逆差下 降了，但其总体贸易逆差并没有出现逆转，说明美国贸易逆差和美国内部有较大关系。 下载日志已记录，仅供内部参考", "status": "extracted"}, "post:2026-10-10T08-48:9c2ef9abb021": {"id": "post:2026-10-10T08-48:9c2ef9abb021", "kind": "post", "title": "2026-10-10 08:48", "source_label": "帖子正文", "excerpt": "[热度第11] [机会] [均‑5.22%] 光通信公司多路径掘金产业链上游，CPO与NPO并行迭代 随着AI大模型集群规模扩张，传统带宽与功耗瓶颈凸显，光互连产业进入可插拔、NPO(近封装光学)、 CPO(共封装光学)、OCS(光电路交换)多路线并行迭代阶段。迈威尔科技预计到2030年互连业务市场", "content": "[热度第11] [机会] [均‑5.22%] 光通信公司多路径掘金产业链上游，CPO与NPO并行迭代 随着AI大模型集群规模扩张，传统带宽与功耗瓶颈凸显，光互连产业进入可插拔、NPO(近封装光学)、 CPO(共封装光学)、OCS(光电路交换)多路线并行迭代阶段。迈威尔科技预计到2030年互连业务市场 规模约650亿美元、年复合增速约65%。业内指出，随着信号速率向224G、448G演进，铜缆信号衰减问题 持续凸显、有效传输距离不断压缩，｢电交换+光连接｣已成为解决规模、性能、功耗｢不可能三角｣的刚 需。光通信公司纷纷向产业链上游延伸，提升供应链自主可控能力。东山精密回应65%美国原产物料比例说 法属非官方市场传闻，公司已提前布局多区域产能与多元化供应链方案。 标的清单： 中际旭创，天孚通信，光迅科技，源杰科技，长光华芯，仕佳光子，太辰光，中天科技，东山精密 [热度第14] [机会] [均‑4.45%] 机构预测A股半导体2026年营收有望突破万亿 全球半导体景气度延续升温，国内产业链订单密集释放。盛美上海披露在手订单总额达170.73亿元，多家A 股半导体公司公布订单情况与产业合作进展。A股188家半导体公司2025年营收总额超7800亿元，同比增 长18.81%；机构一致预测其中146家公司2026年营收合计达1.24万亿元，按可比口径同比增幅有望超过 70%，创阶段性高峰。产业端看，先进制程、先进封装与智能传感用高端靶材、设备零部件国产替代同步推 进。需注意板块短期估值波动与AI资本开支预期反复带来的扰动。 标的清单： 盛美上海，北方华创，中微公司，拓荆科技，芯源微，华海清科，沪硅产业，有研新材 [热度第15] [机会] [均+0.36%] 央行发布人民币汇率政策立场，强调防范短期超调 10月8日央行发布《中国人民银行关于人民币汇率的政策立场》，明确坚持让市场在汇率形成中发挥决定性 作用，不预设汇率目标水平、不干预汇率长期趋势，保持汇率弹性与双向浮动；强调中国贸易发展根源于产 业国际竞争力提升，没有必要也无意通过汇率贬值获取贸易竞争优势，从不搞竞争性货币贬值，重点防范短 期破坏性超调。政策表态释放汇率稳定预期，有利于人民币资产估值的稳定性，同时对航空、造纸等外币负 债与进口原材料占比较高的行业形成成本端预期改善。 标的清单： 中国国航，南方航空，太阳纸业，招商银行，中国银行，工商银行，兴业银行 [热度第16] [机会] [均‑4.24%] 英伟达加码科研投入，量子计算获产业关注 英伟达宣布未来5年将投入10亿美元推动美国科学领域发展，重点支持超级智能与量子计算，通过支持高校 科研机构、推动量子计算发展以及支持云服务商满足政府任务需求等方式展开。AI算力基础设施与前沿计算 路线同步加码，量子通信、量子计算与国产算力、信息安全方向获得产业关注。国内方面，中国AI三巨头 合计资本投入超3000亿元的部署同步推进，算力 少突然出手，让企业有沟通和退出渠道。 企业被突然列入管制名单，会同时冲击供货、客户和融资； 这次双方同意提前通报，提高列入、移出程序的透明度。这项更新 降低的是政策突变的破坏力，属于是程序性克制，用人话说就是— —别突然背后捅刀。 二、有提及，但核心条件尚未公开的 重点就是汽车。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 51、混动车 纯电车和混动车得分开来说——欧盟2024年出台的汽车反补 贴税，针对的是中国制造的纯电动车。但中国车企随后扩大插混和 燃油车型在欧洲的销售，所以这回混动车又被摆上台面了。 其实背后就是我们在解读央妈报告里提到的，产业竞争力差 距太大了，所以摁下葫芦起了瓢。 路透10月9日报道，中国品牌在西欧插混市场的份额，从两 年前同期的2.2%，升至今年二季度超过26%。注意，是西欧的插混 车型，中东欧的没查到。 所以，欧洲此前要求中国主动限制混动车出口，中国反对自 愿出口限制，今天双方确认达成谅解，但没有公开数量、价格和执 行条件。 这是整份声明最值得追踪的条款，但具体有什么约束，不得 而知。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 62、纯电动车 欧盟认定中国纯电动车产业链获得不公平补贴，并在2024年 实施为期五年的反补贴税，当时确定的税率包括比亚迪17%、吉利 18.8%、上汽35.3%。 中国车企希望改善入欧待遇，欧洲则不愿让低价竞争重新冲 击本土市场。 这次声明继续推进企业价格承诺和复审程序，也就是这条解 决路径仍在推进，但同样没有具体的细节出来。 3、降税，涉及药品和化妆品。 声明提出研究部分商品降税，并继续磋商药品、化妆品等监 管问题，但目前明确的也只是继续谈判、继续研究啥的，没有实质 说法。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 74、逆变器和外国补贴审查。 欧洲对逆变器需求很大，光伏发电要靠它把直流电转成可并 网的交流电，2025年中国供应商占欧洲逆变器出货量的80%以上。 分歧在于，欧盟用融资条件影响采购——使用中国等被列为 “高风险国家”供应商逆变器的项目，拿不到相关欧盟资金支持。 欧方的理由是担心联网设备被远程操控、影响电网安全，欧 洲本土厂商也能借此争取订单。 中方则反对没有具体证据、按国别排除中国设备。 欧洲电站投资者也担心换设备增加成本、拖延项目。 这次欧方表示融资指导文件“不针对特定国家”，但没有宣 布撤销限制，实际采购门槛仍然不确定。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 8三、很重要，但这次没有直接写进声 明的重要议题 1、人民币汇率。 背景，看周五中午发布的央妈的报告解读吧。 欧洲部分决策者认为人民币偏弱，增强了中国出口竞争力； 中国央行明确反驳，欧洲不能把自身结构性问题归咎于人民币汇 率。 这次声明完全没提及这块。 2、国内产业补贴和产能。 欧洲把部分贸易压力归因于中国的补贴和产能，中国反对这 一归因。 这回也没有这块的描述。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "attachment:files/电子布-玻璃基板-半导体材料等板块更新20261009.pdf": {"id": "attachment:files/电子布-玻璃基板-半导体材料等板块更新20261009.pdf", "kind": "attachment", "title": "电子布-玻璃基板-半导体材料等板块更新20261009", "source_label": "电子布", "excerpt": "wåÆf tÿ\\r[xb¥~ª _®OáÿWUXL3408 wåÆf tÿ\\r[xb¥~ª _®OáÿWUXL3408QQ£ 三季度满产满销、涨价30%–40%。头部AI用CCL月出货——台光100–120万张（M8占比超50%）、斗山60–70万张（M8主M7辅）、生益40–50万张（M8主）、松下20–30万张、联茂约30万张。M8.5约1200–1500元/张，因需求翻倍、供应不稳，后续不下行甚至上行；普通电子布10月已涨至13元，2026年内续涨，2027下半年新池窑投产后逐步缓解。 二、英伟达平台方案 - Rubin：计算板M8；交换/中板/CX9网卡用M8.5（112G–224Gbps之间，M8+2代布+Q布）；LPU用M9。 - Rubin Ultra NVL144：正交背板PCB要求高，量产或2027/2028；PTFE基材+碳氢PP、碳氢CCL+碳氢PP（带布/无布）双路线，验证78–104层；仅26层PTFE+碳氢混压达标，良率仅30%–40%。 - NVL576：8个NVL72经GPU交换机光互联，交换板9升至18张，进展优于NVL144，2027初望出小批量。分部位：计算板M8.5、交换板PTFE+M9（16层混压良率约60%）、中板M9（或加少量PTFE）、CX9用M9/M8.5、LPU升级M9 Q布或M9 Q布+PTFE混压；PTFE与碳氢PP约1:1。 - 费曼平台：对应NVL Kyber/NVL1152，8个144G做CPU光互联，GPU 72升至1152，为2028量产准备，测试中。 三、技术路线：PTFE电性能最优但柔软、低表面能、难加工，供应链与传统碳氢不重合；碳氢无布为有布升级（去玻璃布降Df），加工性优但电性能不及PTFE，硬脆、CTE差、需专用设备，可供应厂商仅2–3家。配方多含BCB（含量越高介损越好），无布需加约10%低Df热塑性弹性体增韧剂；16层碳氢无布良率预估70%–80%（验证中）。台光更看好碳氢路线，电性能比PTFE差5%–10%。 四、上游格局 - 树脂：东材侧碳氢（PPO/PPE弱）、圣泉侧PPO/PPE（碳氢弱）、呈和核心PPO（碳氢落后）、瑞丰主打增韧剂（收购的觅拓有BCB合成能力）。 - 铜箔：海外三井/福田/金居/卢森堡/长春化工为主力，产能被生益/台光/斗山/松下瓜分；国内德福、铜冠领先、已小批量；生益—德福、台光—铜冠战略合作。 - 玻璃布：供不应求、配额制，为CCL扩产核心瓶颈；日东纺配生益/台光/斗山、台玻供台光/斗山、中材供台光、光远供斗山；中国巨石等新进入者仍认证。 - 球硅：高端化学法球硅60%–70%、联瑞新材20%–30%。 五、客户与竞争：斗山因CTE达标+报价低5%–10%+渠道资源独霸计算板M8（生益CTE不达标未进体系）。SY已向Arista、思科、华为、H3C、星网锐捷、中际旭创送样，终端只认光模块/交换机性能、不单独认证CCL；谷歌TPU服务器板V7/V8送样中、进展慢（台系PCB主导+贸易战下对大陆CCL有顾虑）。 🌹派点求支持，如需详细纪要私信回复#文字观点", "publish_time": "2026-10-10 14:26", "tags": ["文字观点"]}, "post:2026-10-10T19-22:aafe88bb1525": {"id": "post:2026-10-10T19-22:aafe88bb1525", "kind": "post", "title": "2026-10-10 19:22", "source_label": "帖子正文", "excerpt": "PCB设备&钻针观点更新 9月中旬以来PCB设备&钻针回调，利空叙事在节前已经释放，节后的回调更多来自权重股筹码结构及加息预期带来的流动性影响： 1. PCB限制：5月、9月均有外媒报道美国当地协会呼吁PCB产业链本土化，政治口号与游说意味较重，产业实际几乎无影响。2. 终端ARR：9月24日数据显", "content": "PCB设备&钻针观点更新 9月中旬以来PCB设备&钻针回调，利空叙事在节前已经释放，节后的回调更多来自权重股筹码结构及加息预期带来的流动性影响： 1. PCB限制：5月、9月均有外媒报道美国当地协会呼吁PCB产业链本土化，政治口号与游说意味较重，产业实际几乎无影响。 2. 终端ARR：9月24日数据显示9月Anthropic ARR环比降速，Open AI ARR不及市场预期；但实际Anthropic受服务区因素影响，Open AI若加回云厂商渠道收入后增速仍可观。 3. 技术替代：8月以来新技术方向发酵，碳氢树脂+无布方案预计在M10体系中试用；陶瓷基方案预计在光模块、OAM与中背板等场景逐步渗透；玻璃基方案预计在载板先行放量，CoWoP/CoPoS工程化尚不成熟。新技术方向对新兴玩家是重大机遇，但对目前PCB设备&钻针的显著影响需要 亿元至10.89亿元，同比增长205.46%至264.74%；鼎龙股份预计1-3Q26归母净利润同比增长62%-66%；美光科技将12月起股票回购计划规模扩大至351.6亿美元；中国厂商在DRAM和NAND领域份额增长清晰。\u003c/li>\n\u003cli>交易与政策面：10月9日A股三大指数探底回升，上证指数收3813.79点、上行0.05%，成交额放大至1.9万亿元；恒生指数收24211.35点、上行1.79%。央行10月8日开展6060亿元隔夜逆回购、当日净回笼6085亿元；人民币汇率政策立场引发点评；Vicor对VPD发起337调查，被诉方共20家主体，解读称核心为专利授权费、无实际影响。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型与全球AI股定价\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：OpenAI净额法下9月底年化营收约500亿美元，低于市场流传约700亿美元，引发全球AI股震荡；纳斯达克跌1.25%，英伟达市值蒸发超1684亿美元。后续有观点称，7月收入基数更新后OpenAI runrate是加速的，或起码不能理解为降速。\u003c/li>\n\u003cli>今天出现的催化/验证：大模型厂商ARR口径被集中梳理，Anthropic为总额法、OpenAI为净额法、智谱为净额法；微软推出面向快速决策的Microsoft-Decision-1模型；Google Cloud推出Gemini通用工作智能体，可获独立公司账号，跨应用持续工作数小时至数天。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：Lumentum指引光电子元件产能基本售罄、紧缺延续至2029年初，明年约70%需求无法满足；国内800G与1.6T仍处极度紧缺，短期国内光芯片出货仍会快速增长；光互连产业进入可插拔、NPO、CPO、OCS多路线并行迭代阶段。\u003c/li>\n\u003cli>今天出现的催化/验证：10月9日美股光通信板块盘中强势拉升；迈威尔科技预计到2030年互连业务市场规模约650亿美元、年复合增速约65%；光通信公司向产业链上游延伸，提升供应链自主可控能力。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：CCL专家电话会显示前三季度满产满销、涨价30%–40%；头部AI用CCL月出货台光100–120万张、斗山60–70万张、生益40–50万张、松下20–30万张、联茂约30万张；分部位涉及计算板M8.5、交换板PTFE+M9、中板M9、CX9用M9/M8.5、LPU升级M9 Q布或M9 Q布+PTFE混压。\u003c/li>\n\u003cli>今天出现的催化/验证：10月进入PCB厂商加速爬产与下一轮资本开支规划窗口，窄线宽曝光、水平镀、背钻/对钻CCD钻孔机，乃至压合、检测、锡膏印刷、回流焊中的高端设备处于严重紧缺状态；南亚新材高速/高频覆铜板出货从上半年40–50万张提升至7月70万张以上、8月80–90万张，管理层预计年底不计海外M8及以上等级产品贡献有望突破100万张，接近每月100–110万张产能；景旺电子发布Q3业绩预告。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体材料/存储/先进封装\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：鼎龙股份预计1-3Q26营收29.15亿元、同比增长8%，对应3Q26营收9.9亿元、环比增长9%，1-3Q26归母净利润同比增长62%-66%；存储芯片方面，中国厂商市场份额增长在DRAM和NAND领域都已清晰显现；磷化铟衬底价格维持高位。\u003c/li>\n\u003cli>今天出现的催化/验证：美光科技董事会批准扩大股票回购计划，12月起可酌情回购普通股最高金额上调至351.6亿美元；鼎智科技深度报告主题为深耕精密运动控制、多轮驱动增长可期；AI数据中心抢占存储芯片产能，微软、任天堂和索尼均已上调游戏机售价，美国8月游戏硬件销量同比下降15%，为13年来同期最低。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>液冷/电源/VPD与散热\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：美东时间10月9日，USITC正式立案337调查（337-TA-1526），案由为特定垂直电力传输系统、相关组件及搭载该系统的计算系统专利侵权，涉案专利US 10,903,734，被诉方共20家主体；VPD相比传统平面PCB供电可缩短电流回路、减少压降与损耗，适配高端GPU的大电流供电需求。\u003c/li>\n\u003cli>今天出现的催化/验证：解读称该调查为企业行为，核心为专利授权费，无实际影响；名单具有筛选效应，能被全球电源龙头列为诉讼对象的中国厂商，在VPD这一高功率AI服务器核心技术路线上已具备可验证的产品能力；美国热管理公司发布金刚石冷板，可适配现有芯片封装及液冷方案，金刚石散热产业化提速。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观/策略与市场结构\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：10月9日A股走出日内深V反攻，上证指数早盘一度回落至3754.14点、午后重新站上3800点，收报3813.79点，上行1.89点或0.05%；深证成指收报12641.86点，上行20.96点或0.17%；成交额放大至1.9万亿元；恒生指数收报24211.35点，上行425.56点或1.79%。\u003c/li>\n\u003cli>今天出现的催化/验证：10月8日央行开展6060亿元隔夜逆回购、当日净回笼6085亿元；龙虎榜共69只个股，净买入集中在有机硅、网络安全与内容产业，风电与覆铜板方向遭抛售；有观点认为历史上美债收益率上行但通胀回落时，美股和A股表现均偏强，当前A股短期震荡筑底后可能回升，聚焦科技成长和内需相关行业。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>OpenAI向投资者披露截至9月底年化营收约500亿美元，低于此前市场流传的约700亿美元，差额源于会计口径不同；纳斯达克跌1.25%，英伟达市值蒸发超1684亿美元，甲骨文、博通、AMD等受到波及。后续观点认为7月收入基数更新后runrate是加速的，或起码不能理解为降速。\u003c/li>\n\u003cli>Lumentum给出超预期指引，称光电子元件产能已基本售罄、紧缺状态延续至2029年初，明年约70%的需求无法满足；10月9日美股光通信板块盘中强势拉升；国内800G与1.6T速率产品仍处极度紧缺，短期国内光芯片出货仍会快速增长。\u003c/li>\n\u003cli>CCL专家电话会显示前三季度满产满销、涨价30%–40%，头部AI用CCL月出货数据明确；10月进入PCB厂商加速爬产与下一轮资本开支规划窗口，高端设备严重紧缺；南亚新材高速/高频覆铜板出货逐月提升；景旺电子Q3业绩预告归母净利润同比增205.46%至264.74%。\u003c/li>\n\u003cli>鼎龙股份发布业绩预告，预计1-3Q26营收29.15亿元、同比增长8%，1-3Q26归母净利润同比增长62%-66%；美光科技将自12月9日起可酌情回购普通股最高金额上调至351.6亿美元；存储芯片中国厂商在DRAM和NAND领域份额增长清晰。\u003c/li>\n\u003cli>USITC正式立案337调查（337-TA-1526），涉及VPD专利侵权，申请人为美国电源厂商Vicor，涉案专利US 10,903,734，被诉方共20家主体；解读称核心为专利授权费、无实际影响；美国热管理公司发布金刚石冷板，可适配现有芯片封装及液冷方案。\u003c/li>\n\u003cli>A股10月9日探底回升，上证指数收3813.79点、上行0.05%，深证成指收12641.86点、上行0.17%，成交额1.9万亿元；恒生指数收24211.35点、上行1.79%；龙虎榜资金净买入集中在有机硅、网络安全与内容产业，东岳硅材获净买入约1.88亿元，吉林化纤净买入约1.78亿元。\u003c/li>\n\u003cli>央行10月8日开展6060亿元隔夜逆回购操作、当日净回笼6085亿元；人民币汇率政策立场引发点评；中欧贸易投资磋商联合声明解读指出，欧洲汽车产业面临双重压力，卖车面临中国车企竞争、造车又离不开中国部分关键材料。\u003c/li>\n\u003cli>2026年9月国内储能采招完成22.0GW/73.7GWh采招订单，系统+EPC共69.7GWh、同比+84%，直流侧约4GWh，剔除集采66.7GWh后环比+5.6%；工控公司9月部分订单更新显示汇川技术Q3同增20%左右、雷赛智能同增50%+、禾川科技同增80~90%。\u003c/li>\n\u003cli>名创优品预计26Q3 GMV同比+25%~30%、同店高单增长，国庆GMV同比+20%~25%、同店低单增长；泡泡玛特9月43家可比门店同店增长16%、增速回正；均瑶健康J26完成减重增肌RCT临床验证；中国巨石前三季度归母51.4-53.9亿元、同比+100~110%。\u003c/li>\n\u003cli>华海药业预计前三季度归母净利润10.28-11.03亿元、同比增长170%-190%；荣昌生物与艾伯维启动RC148联合Temab-A一线非鳞NSCLC II期临床，拟入组约200例患者；齿科修复行业深度发布，爱迪特/现代牙科首次覆盖并给予跑赢行业评级；微创机器人-B商业化加速趋势被推荐。\u003c/li>\n\u003cli>超微电脑关联合同工认罪，承认参与将搭载英伟达先进AI晶片的服务器非法转运至中国的计划；特朗普称俄罗斯将立即向美国和全球市场供应超过30万吨柴油，11月再供应50万吨，此后立即供应100万吨；花旗称贝森特下月或将削减美国长期债券发行量。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>OpenAI收入是否降速、ARR口径差异与runrate后续披露，以及其对全球AI股定价的持续影响。\u003c/li>\n\u003cli>10月PCB厂商加速爬产与下一轮资本开支规划，高端设备供不应求状态；CCL涨价持续性与南亚新材年底出货能否突破100万张。\u003c/li>\n\u003cli>Lumentum产能售罄至2029年初及明年约70%需求无法满足的兑现情况；国内800G/1.6T紧缺与光芯片出货增速；光通信产业链上游延伸进展。\u003c/li>\n\u003cli>Vicor对VPD发起337调查后续，包括有限排除令、停止侵权令、专利授权费与规避设计等影响。\u003c/li>\n\u003cli>人民币汇率政策立场后续解读，以及汇率制度安排、汇率水平变化、汇率与贸易关系、汇率决定因素等跟踪。\u003c/li>\n\u003cli>基于分析师预期构建三因子行业配置模型、港股基本面改善与市场情绪修复的后续验证。\u003c/li>\n\u003cli>储能采招环比变化、固态电池上车验证时间线，比亚迪明年推出首款搭载固态电池技术的量产车型、奇瑞全固态电池计划2027年开展上车验证。\u003c/li>\n\u003cli>AI影视去伪存真与真正业绩龙头验证；工控订单增速在高基数下能否保持高位。\u003c/li>\n\u003cli>金刚石散热产业化、电子布/玻璃基板/半导体材料板块更新；中欧贸易磋商对汽车产业与关键材料的影响。\u003c/li>\n\u003cli>内存涨价对消费电子成本与售价的传导，以及游戏硬件销量、微软/任天堂/索尼售价调整后的需求变化。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>08:42｜内存涨价下美国8月游戏硬件销量跌至13年同期最低 10月10日｜AI数据中心大举抢占存储芯片产能，游戏机成本与售价水涨船高，为抵消零部件成本上升以及此前关税带来的冲击，微软、任天堂和索尼均已上调旗下游戏机售价。美国游戏硬件消费明显降温，美国市场研究机构Circana的数据显示，美国8月游戏硬件销量同比下降15%，为13年来同期最低水平。\u003c/li>\n\u003cli>08:42｜名创优品更新：26Q3国内延续增长，9月美国边际改善#国内业务Q3在高基数下延续快速增长根据公告，公司预计26Q3 GMV同比+25%~30%，同店高单增长。国庆（10.1-10.7） GMV同比+20%~25%，同店低单增长。\u003c/li>\n\u003cli>08:42｜高端商圈专家交流要点（WXC） 泡泡玛特目前合作85家店，截至9月底门店数同比新增3家，核心为位置调优、扩大面积及重新装修，而非拓店。9月43家可比门店（不包含移位、扩店等）同店增长16%、增速回正，主要系去年同期labubu 3.0高基数逐步消化。\u003c/li>\n\u003cli>08:42｜微软推出面向快速决策的Microsoft-Decision-1模型 10月10日｜微软推出新一代快速决策AI模型Microso
