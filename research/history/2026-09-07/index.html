号的公司-> pcb全面涨价。", "content": "", "publish_time": "2026-09-07 10:42", "tags": ["文字观点"]}, "post:2026-09-07T20-22:8de02c864717": {"id": "post:2026-09-07T20-22:8de02c864717", "kind": "post", "title": "2026-09-07 20:22", "source_label": "帖子正文", "excerpt": "领导好，简单回顾下过去一年的工作： 2026年广发机械组全面拥抱AI产业，重点推荐AI设备+船舶，#实现AI设备行业全覆盖（PCB设备、AIDC发电、半导体设备、光模块设备、液冷）", "content": "", "publish_time": "2026-09-07 20:22", "tags": ["广发机械团队【6号】", "文字观点"]}, "post:2026-09-07T10-54:8d51602bdc01": {"id": "post:2026-09-07T10-54:8d51602bdc01", "kind": "post", "title": "2026-09-07 10:54", "source_label": "帖子正文", "excerpt": "# 【弘信电子】大涨： 算力订单累计签约近100亿，Token出海星辰大海【浙商化工&算力 杨占魁】 ⭕️算力租赁：2026年上半年公司新增算力资源综合服务订单46亿元，# 累计签", "content": "", "publish_time": "2026-09-07 10:54", "tags": ["具备Token规模化出海交付能力", "文字观点"]}}, "source_details": {"post:2026-09-07T10-48:66f949c9ec99": {"id": "post:2026-09-07T10-48:66f949c9ec99", "kind": "post", "title": "2026-09-07 10:48", "source_label": "帖子正文", "excerpt": "【东吴通信张良卫/欧子兴】本周光博会叠加模型侧催化，光通信板块预期进一步修复@260907 🌹事件：光博会召开、GPT-6 Astra发布 1）本周CIOE中国光博会召开，光通信产业催化密集。9月9日至11日，第27届中国国际光电博览会将在深圳举行，AI算力光互联是本届展会核心方向之一，1.6T高速", "content": "【东吴通信张良卫/欧子兴】本周光博会叠加模型侧催化，光通信板块预期进一步修复@260907 🌹事件：光博会召开、GPT-6 Astra发布 1）本周CIOE中国光博会召开，光通信产业催化密集。9月9日至11日，第27届中国国际光电博览会将在深圳举行，AI算力光互联是本届展会核心方向之一，1.6T高速光模块、CPO/NPO/XPO、硅光、OCS以及单波400G等新技术、新产品有望集中展示。随着产业链新品发布及客户验证进展持续释放，市场对于下一代高速光互联技术产业化节奏的预期有望进一步升温。 2）GPT-6 Astra发布，前沿模型竞争提速。OpenAI近期发布GPT-6 Astra，在复杂推理、编程、Computer Use及Agent任务等方向能力进一步提升，模型侧再次出现明显能力跃迁。前沿模型能力提升叠加OpenAI、Anthropic、Google等厂商竞争持续加剧，有望推动训练规模继续扩大，同时加速Agent和推理侧Token需求增长，进一步强化云厂商对于GPU集群及网络基础设施的投入意愿。#观点重申# 筹码结构有所改善，FCC预期逐步纠偏。 前期拥挤交易和高位筹码已有所消化，筹码因素对板块的压制减弱。前期市场对FCC影响定价偏悲观，目前看对主要光模块公司整体订单影响有限。 # 英伟达接近历史新高，提振海外AI链风险偏好。 市场对AI资本开支和GPU需求预期仍强，对海外收入占比较高的光模块公司形成估值和情绪支撑。 # CPO产业化进程正加速推进。英伟达CPO交换机已进入全面量产。Lumentum披露其领先CPO客户的生产计划持续推进；COHR规划CPO营收在2027财年下半年开始量产爬坡。 # NPO复用成熟供应链，落地基础坚实。Lumentum预计NPO将于2027年底至2028年入市；Coherent首批收入将于12月季度落地。相关受益标的： 1）大光：重点推荐中际旭创，建议关注新易盛； 2）小光：建议关注光迅科技、联特科技、汇绿生态、剑桥科技、东山精密、长芯博创、华工科技、COHR、FN、AAOI等； 3）新光：CPO产业链，重点推荐天孚通信、炬光科技，建议关注长盈通、罗博特科、致尚科技、蘅东光、LITE、COHR等；OCS产业链，重点推荐炬光科技，建议关注德科立、腾景科技、光库科技、LITE、COHR等；DCI产业链，建议关注光迅科技、德科立、CIEN、MRVL、LITE、COHR等； 4）物料：光芯片光器件，建议关注源杰科技、仕佳光子、永鼎股份、长光华芯、AXT、LITE、COHR等。风险提示：AI建设不及预期、光互联技术发生重大变化、系统性风险#文字观点", "publish_time": "2026-09-07 10:48", "tags": ["观点重申", "文字观点"]}, "post:2026-09-07T08-59:c524fcc99a33": {"id": "post:2026-09-07T08-59:c524fcc99a33", "kind": "post", "title": "2026-09-07 08:59", "source_label": "帖子正文", "excerpt": "周观点906：GPT-6发布，关注3D资产锐度方向和游戏估值修复 🔺上周传媒指数放量上涨6%，周初交易AI长剧主题，后续逐步扩散至广告、院线、游戏等方向。一方面，产业侧确实有变化（AI漫剧/Ai长剧不断涌现），另一方面，成交量下降之后，市场更加倾向于中小市值方向+AI应用筹码结构好阻力小。", "content": "周观点906：GPT-6发布，关注3D资产锐度方向和游戏估值修复 🔺上周传媒指数放量上涨6%，周初交易AI长剧主题，后续逐步扩散至广告、院线、游戏等方向。一方面，产业侧确实有变化（AI漫剧/Ai长剧不断涌现），另一方面，成交量下降之后，市场更加倾向于中小市值方向+AI应用筹码结构好阻力小。展望本周，周末GPT6大量3D资产用例出现，看好带动游戏板块的估值修复+3D资产的锐度行情。此外，我们上周在北京对AI产业进行了一系列的调研，稍后更新调研Takeaways～ 🔺AI：9/3，OpenAI正式发布GPT-6 Astra，多维度能力大幅升级，关注3D、游戏等应用方向。Astra在Computer Use、浏览器使用、软件工程、网络安全与科学工作等领域表现亮眼，规格上支持1.05M Token上下文、128K最大输出，API定价输入10美元、输出50美元每百万Token。建议关注大模型Minimax、智谱、腾讯、阿里，应用锐度方向本周建议关注：①游戏引擎方向：掌趣；②3D方向：风语筑、凡拓、丝路等；③其他：海致、中文在线、昆仑万维、蓝色光标、易点天下等。 🔺游戏：当前估值低位+中期底部区域，GPT6 3D资产&游戏用例效果超预期带来关注度，看好估值修复。标的首选低估值+边际变化，配置看好【世纪华通】、【三七互娱】、巨人网络、吉比特；锐度方向看好【掌趣科技】。 🔺影视：AI多模态持续在产业落地，如上周芒果上映AI长剧《查找图书后西游记》，建议关注①上游IP、工具方如奥飞、上影、Minimax、昆仑、阅文等；②下游渠道：芒果等；③中游内容制作：欢瑞、中文、掌阅等。 🔺互联网：上周，9/2腾讯在深圳召开WorkBuddy生态发布会，牵手各行业多家合作伙伴；阿里2026云栖大会定档9/22-24杭州，主题「智以致用」，设三大主论坛与140余场分论坛，其中技术主论坛将围绕模型、Agent、Agentic Cloud拆解五层全栈技术并发布阿里云核心技术及年度产品。建议关注腾讯、阿里等。#文字观点", "publish_time": "2026-09-07 08:59", "tags": ["文字观点"]}, "post:2026-09-07T09-29:2d8eb2ee4021": {"id": "post:2026-09-07T09-29:2d8eb2ee4021", "kind": "post", "title": "2026-09-07 09:29", "source_label": "帖子正文", "excerpt": "🔥GPT6循环架构提高智能上限，美股硬件回升有望带动工业富联 ---------- 🎈循环transformer有望拉升高算力服务器需求 - The Information称，OpenAI GPT-6（Astra）采用循环 Transformer架构，通过同一组网络层多次循环迭代运算，把模型推理深度", "content": "🔥GPT6循环架构提高智能上限，美股硬件回升有望带动工业富联 ---------- 🎈循环transformer有望拉升高算力服务器需求 - The Information称，OpenAI GPT-6（Astra）采用循环 Transformer架构，通过同一组网络层多次循环迭代运算，把模型推理深度与参数量解耦，拓展模型智能上界，推理侧算力消耗结构发生变化，对高算力服务器硬件需求进一步抬升。 🎈美股硬件显著回升 - 周五美股硬件表现良好，闪迪+11.90%，MRVL+7%，COHR+6.6%，美光+6.1%、西部数据、康宁涨幅近6%，AMD、Intel、vertiv涨超4%，Oracle+3%，HPQ+2.2%、Dell+1.5%，NVIDIA+0.84%。 🎈工业富联在NVIDIA Rubin机柜生产继续维持高份额，26H1与各家大算力ASIC合作的机柜出货量同比增长3倍以上，CPO交换机量产出货，我们维持目标价100元，重申“买入”评级。 ----------#文字观点", "publish_time": "2026-09-07 09:29", "tags": ["文字观点"]}, "attachment:files/Mikko的全球市场日志（2026年9月6日）.pdf": {"id": "attachment:files/Mikko的全球市场日志（2026年9月6日）.pdf", "kind": "attachment", "title": "Mikko的全球市场日志（2026年9月6日）", "source_label": "其他", "excerpt": "ACECAMPTECH 文章原文 第 1 页 ACECAMPTECH · 文章原文 北美大模型行业调研：SOTA模型竞争格局变化，Gemini 相比Claude、GPT掉队原因及后续追赶可能性，后续Gem ini Flash及Pro版本模型能力预期 发布时间：2026/09/06 08:10:09 以下为专家观点： 1，如何看待当前北美SOTA模型的竞争格局", "content": "ACECAMPTECH 文章原文 第 1 页 ACECAMPTECH · 文章原文 北美大模型行业调研：SOTA模型竞争格局变化，Gemini 相比Claude、GPT掉队原因及后续追赶可能性，后续Gem ini Flash及Pro版本模型能力预期 发布时间：2026/09/06 08:10:09 以下为专家观点： 1，如何看待当前北美SOTA模型的竞争格局？ 当前，参数量巨大的SOTA模型（例如5T或更高参数级别）之间的性能差距正变得越来越小。这主要是由几个 因素共同导致的：首先，在模型架构层面，各家方案趋同，并未出现能够带来根本性性能提升的重大创新，现 有的一些创新更多是聚焦于提升性价比，而非直接增强模型的智能水平；其次，在训练方法上，虽然存在一些 差异，但并非决定性因素。目前行业内普遍认可并采用相似的技术路径，例如通过循环和验证器等方式来延长 任务处理链路。 由于架构和训练方法的趋同，各家模型的性能表现也日趋一致。尽管业界普遍认为训练更大规模的模型可能会 涌现出意想不到的能力，但实践中面临严峻挑战，当前超大规模模型很难得到充分训练。例如，要训练一个5T 到10T参数的模型，即便采用GB300这样的高性能计算集群，并满足最低的20倍参数量的token训练要求，也 需要至少两到三个月的时间。在实际研发过程中，为了调试和优化，通常需要训练10到20个候选模型来探索不 同的参数配比、架构层数以及Dense/Sparse Attention等参数组合，这意味着对算力的需求会成倍增加。 然而，目前没有任何一家公司拥有足够充裕且能支持如此大规模并行训练的算力资源。因此，无论是模型架构 的探索，还是单个模型的训练程度，都远未达到理想状态。这直接导致了当前SOTA模型性能水平非常接近的 局面。 2，如何理解大模型难以被充分训练的问题？具体哪些方面没有被充分训练？ 难以充分训练体现在两个方面： 一方面，从训练token与参数量的倍数来看，许多小模型已经训练到了接近200倍的水平，而理论上大模型因 其更复杂的内部组合，需要更高倍数的训练才能收敛。但现实是，即便是满足20倍这一最低限度的训练要求， 使用约10万张GB300显卡训练一个大模型也需要两到三个月。如果考虑到需要训练5个不同的变体以进行模型 结构探索，所需的算力规模将是巨大的，通常企业难以承担。 另一方面，这种算力限制导致了模型架构的探索不充分，并且每一款发布的大模型，其训练程度都远未达到小 模型那样的饱和水平。其结果是，新发布的模型相较于前代版本的性能提升有限。例如，Anthropic发布的新 模型在Artificial Analysis榜单上的得分仅比上一代高出约3分，这种幅度的提升并未给市场带来显著的体感差 异。 ACECAMPTECH 文章原文 第 2 页 3，从中短期来看，提升模型性能的主要路径是否是在现有参数体量的基础上增加训练时长？ 理论上增加训练时长是主要路径，但在实践中存在矛盾。当前市场竞争日益激烈，领导层很难给予团队充足的 时间去训练众多模型变体。现实情况是，几乎所有5T以上参数的模型都未能得到充分训练。 此外，当前良好的市场行情也加剧了算力资源的紧张。例如，在DeepMind，周一至周四需要将大量算力资源 调配给GCP用于商业化服务，只有在周末才能收回更多算力用于内部训练。这种情况在行业内是普遍现象，因 为周末算力成本较低，Anthropic和Google等公司会利用这个时间窗口进行训练。在算力卡和电力供应双重短 缺的背景下，很难有公司能拥有大量富余算力来支持对SOTA模型的充分训练。 因此，除非出现类似今年（2026年）年初的循环模型（loop model）或Harness这类颠覆性的新范式，否则 在现有技术路径下，SOTA模型之间的性能差距很难被拉开。目前尚未观察到任何可能带来重大突破的新技术 发明。 4，业界如何看待近期推出的Gemini 3.8 Flash，以及它对Looping Model或模型自训练等 递归自提升方法可能带来的影响和未来预期？ 递归自提升是一个较为宽泛的概念，目前在模型训练中已广泛应用各类模型自我训练的方法。传统的优化器采 用的是固定的、通用性较好的策略，例如利用一阶或二阶动量，但并未针对特定训练任务进行深度优化。而自 训练方法则通过模型自身学习来优化整个训练过程，旨在让模型收敛得更快，从而提升训练效率。当前，递归 自提升的应用基本集中在类似这样的领域。 5，采用Looping Model或模型自训练这类方法，是否意味着模型能力更强的参与者训练出 的模型会更强大？ 这并非绝对。许多中国的开源模型也具备了实施这类方法的能力，通常在MMLU基准测试上得分达到57至58 分以上的模型，都可以胜任。当前阶段的递归自提升并非全自动化过程，核心思想仍由研究员提出，而非模型 自主产生。模型的作用在于执行，研究员提出想法后，具体实现过程是一个“黑盒”，需要模型通过类似 AlphaFold的函数搜索（function search）方法，去寻找各种可能的公式组合，以使优化器收敛得更快。 Transformer架构非常擅长处理这类黑盒拟合任务。因此，现阶段的递归自提升仍然需要人类研究员提出创新 想法，对模型本身的智能水平要求并未达到极高的程度。 6，近期头部模型如OpenAI和Anthropic似乎处于交替领先状态，而Google自2026年以来 似乎有所掉队，如何评估Google模型当前在SOTA领域的竞争力，以及对未来4.0版本的预期 ，它能否重返第一梯队？ Google重返第一梯队存在难度。主要劣势体现在数据层面，具体有以下几点： 第一，Google是目前已知唯一一家在预训练或后训练阶段不使用C端（消费者）用户数据的公司。当前模型训 练，尤其是为了实现类似“Looping”的精细化推理，需要大量的轨迹数据。这类数据要求模型能够进行小步 推理、反思、回溯并决策，而这种复杂的交互过程很难通过合成数据有效生成，因为合成各类工具的真实交互 非常困难。同时，网络上公开的人类解题或调试思路，通常是直接给出分析结果，缺乏这种逐步迭代的循环过 程。因此，无法使用C端数据进行预训练，使Google在模型底座的构建上处于不利地位，而预训练效果很大程 度上固化了模型的权重，后续训练难以弥补这一差距。 ACECAMPTECH 文章原文 第 3 页 第二，Google的合规要求非常严格，禁止蒸馏任何竞争对手的模型，无论是通过调用API还是在本地部署模型 （如Kimi K3或DeepSeek）进行“偷偷蒸馏”都不被允许。 第三，许多公司会购买竞争对手模型的轨迹数据，用于行为克隆（Behavior Cloning）的强化学习训练，以实 现模型的快速冷启动。Google虽然不缺资金，但目前未能找到合规的方式购买此类数据，因为市面上的轨迹 数据大多从各种路由器上获取，通常未获得用户授权，这是Google无法接受的。 为应对这些数据劣势，Google主要采取两种策略：一是使用员工数据进行预训练；二是在模型能力相对较弱 的初期，雇佣专家录制高质量的专家轨迹，例如通过招聘专家完成类似Terminal Bench中的任务，以此进行 模型冷启动。尽管如此，在模型架构差异不大的行业背景下，数据是决定性因素，Google在数据上的劣势目 前仍未看到有效的解决方案。 对比来看，OpenAI和Anthropic虽然对自身要求也很高，但他们会使用C端数据进行预训练。各家公司对合规 的标准不尽相同。值得注意的是，OpenAI和Anthropic在2026年上半年修改了用户协议，取消了数据保留期 限，这意味着对于付费的C端用户，如果其数据被认为有价值，平台可以永久保留而不删除。这是Google目前 不愿采取的做法。 7，与OpenAI、Anthropic等竞争对手相比，谷歌在模型训练中不使用C端数据，是否是出 于更严格的内部合规要求？具体是指哪类C端交互数据？ 是的，谷歌在C端数据使用上的限制源于其比竞争对手更严格的用户条款。与OpenAI、Anthropic等公司通过 修改用户条款来合规使用C端数据不同，谷歌领导层选择不修改现有条款。这主要是出于对品牌形象的保护， 担心修改条款会引发用户在YouTube、Search、Gmail等核心产品上的隐私敏感和联想，从而对公司整体形象 造成负面影响。因此，尽管竞争对手使用C端数据并不违规，但谷歌因其更高标准的用户条款而无法使用。 这类数据主要是指用户与AI的交互数据，这些数据是极具价值的反馈信号。例如，当用户让AI编写一个小游戏 时，过程中可能会产生大量交互，包括指出代码错误、要求将非玩家角色替换为特定形象（如牛头怪）的Boss ，以及对生成内容进行点赞或点踩等操作。这些交互数据目前完全不能用于模型训练。 8，无法使用C端数据是否会持续成为谷歌训练SOTA模型的一项限制？ 是的，这确实是一项限制，并且目前没有计划更改相关的用户条款。谷歌公司内部，包括法务和高层管理人员 ，普遍认为修改条款可能引发用户对隐私问题的过度敏感，进而影响到YouTube、Search、Gmail等核心业务 ，对公司整体形象构成风险。因此，当前策略是利用谷歌在纯技术方面的优势以及内部员工数据来弥补这一差 距。在小模型领域，例如各种Flash版本，通过这种方式已经取得了较快的追赶速度。 9，从当前时间点看，C端数据对SOTA模型训练的影响是会逐渐增大还是减小？ 在Gemini 3.6版本之前，C端数据缺失的影响较大，因为当时缺乏有效利用这类数据的方法。然而，现在情况 已有所改变。例如，Gemini 3.7 Flash的评分仅比OAI 4.8低1分，而3.8 Flash与OAI SOTA模型的差距也仅为 2分。这表明，通过使用规模小一个数量级的模型，谷歌已经能够实现有效的自我生成和迭代。当模型的绝对 智能水平达到一定阈值后，它便可以更好地进行自我优化，从而部分解决了C端数据缺失的问题。 尽管如此，问题并未完全解决，尤其是在技术广度方面。谷歌内部的技术栈相对固定，例如编程语言、数据库 和前端框架都有统一规范。这种内部环境的同质性限制了模型接触多样化编程实践的广度。一个显著的例子是 ，在Artificial Analysis排行榜上，谷歌是唯一一家不使用自家评测工具Antigravity，而是采用外部的 ACECAMPTECH 文章原文 第 4 页 OpenCode进行模型跑分的公司。这是因为Antigravity自身存在许多因无法访问用户数据而难以修复的bug。 10，所以AI Overviews及AI Mode产生的数据是否完全不能用于Gemini模型的训练？ 是的，相应AI模型产生的用户数据本身不能用于训练，这与对Coding数据的处理方式一致。不过，法务部门 允许使用这些数据的元数据进行训练。元数据在特定场景下，尤其是在处理C端应用时非常有用。通过对元数 据进行聚类分析，可以发现用户的共同兴趣点，比如发现讨论鹦鹉的用户群体可能就属于稀有宠物类别，从而 进行针对性优化。 11，元数据和数据在模型训练中的具体差异和应用？ 以一个用户编写Python游戏程序的场景为例，该用户产出的设计文档、UI/UX设计稿以及源代码本身，这些都 属于“数据”。同时，用户与AI Agent的交互过程、每一步的反馈以及Agent的各种循环也同样被归类为“数 据”。 相对而言，元数据包含的信息则非常有限，它可能只记录了诸如“游戏”、“Python”、“三次点赞”、“ 五次点踩”这类维度层面的信息，而不包含具体的交互内容或源代码。对于C端应用，仅使用元数据进行分析 ，例如了解用户对鹦鹉脱毛问题的关注，并据此生成或购买相关的QA数据，是可行的，因为这不触及用户聊 天的具体内容。然而，对于代码生成这类场景，如果只被允许使用元数据，模型训练将受到极大限制。 12，谷歌公司在算力分配上似乎更优先满足商业化和外部合作方（如Anthropic），这种策 略是否对内部核心模型的训练节奏和算力使用产生了影响？ 这种算力分配策略对探索性项目（explore ideas）会产生影响，但对于最核心的Gemini系列模型的训练，目 前没有实质性的影响。受影响的主要是其他优先级稍低的项目，例如机器人、文生视频、Gemini在特定垂直 领域（如医疗健康领域）的应用等。Gemini系列本身，无论是Flash、Nano、Pro还是新的Gemini 4，其训练 进程都未受到实质性干扰。 13，2026年以来Gemini团队出现的人才流失，特别是Jeff Dean的离开，是否会对后续模型 的迭代（例如下一代模型）产生影响？ 厉害。然后讲其他板块的事情。这张图是台积电在讲，为什么需要用异构集成或 先进封装，因为摩尔定律每两年性能提高一倍，但AI算力需求每年增长5倍，摩尔定律完 全满足不了。从2020到2025年实际数字如此，往后看如果多模态进来，可能仍保持5倍 增速。台积电的解法是3D叠加或2.5D封装。2.5D封装在2029年已经给到14个reticle， 两条路径：一条是CoWoS，另一条是CPO（比较敏感，这次会上没有明确讲）。但客户如 AMD都提到，台积电自己避免提CoWoS的量产时间表，但主要客户在提CoWoS成为主要 方向。3DIC也是台积电重点方向，最近小米出的hybridbonding也是3DIC的一种变形。前 道方面，继续演进。台积电3nm之后，今年做第一代2nm，2nm之后还有A16（背面供 电），再往后A12也是背面供电，从N2到A14等节点切换。但台积电明确2030年之前不 会用HBM，至少正式发布。ASML在会上也提到AI设备性能已大规模量产，但提升速度可 能还满足不了台积电要求，所以台积电目前没用，反而是存储客户可能先用AI设备。这是 CoWoS的情况。AMD的图显示，虽然大家讲英伟达CoWoS产量，但AMD在技术领先和采 用新速度上快于英伟达。同一块面板上能放的芯片数量：目前一个晶圆只能放3个模组， 300x300mm主流能放6个，500mm能放16个，趋势继续。测试方面，SEMI报告显示测 试板块增速是所有半导体设备细分中最快的，从2025年117亿到2028年235亿，三年翻 倍，快于晶圆制造增速。右图是飞控net（罗伯特科收购的欧洲公司）做光学测试，光测 试机开始出现。CPO产业链，我最大感受是产业链开始成型。去年只有台积电在讲，今年 成立了硅光子产业联盟，包括测试机公司、封测公司、Fraunhofer、LamResearch、OnTec 等，光源公司也很全，从光源到制造、设计、测试全产业链开始成型。这次还找了思科系 统厂商来讲，系统厂商说过去五年数据传输速度上千倍，但每比特能耗下降100倍，导致 传输功耗涨了10倍，这对数据中心能耗预算很严重。这是导入CPO的最大动力，可能先 从scaleout到scaleup演进。很多投资人担心CPO会取代光模块，会上反复讲，CPO transition从3.2T开始，到2030年左右才可能超过NPO成为主流，之前长期并存，特别是 CPO和可插拔光模块的关系。台积电也更新了它的CPO方案，就是把PIC和EIC之间用HDI 贴合，PIC用特殊微粉，EIC用传统3nm微粉。存储方面，SEMI预测存储紧缺状态从HBM 扩散到传统DRAM。客户和原厂趋势是区分消费级和服务器级，保留一定量给消费级，但 增量主要在服务器端。HBM和DRAM都缺得厉害，产能扩张速度跟不上需求。核心原因是 存储越多，AI越智能。闪迪（Sandisk）的做法是除了HBM，开始推出不同形态，根据AI workload（prefill/decode）采用不同存储，比如prefill用HBM，decode用其他。存储变 贵，优化使用成为趋势。电力方面，半导体行业唯一不需要讨论技术路线的是能耗。从24 到26年能耗已上4倍，到2030年还有20倍能效提升需要。全球缺电是个核心问题。发 电设备受益但扩产慢。在电约束下产生更多token是技术研发方向。例如Blackwell 1400W，PB2300-3600W，费曼66kW。这样功耗下要用800V直流、SST、功率半导体器 件，电网改造。英飞凌功率数据中心业务有10倍增长，功率半导体价值量提升，包括 SiC、GaN、高压IGBT、固态电源等。总结感受：去年SEMICONTaiwan呼吁把系统做大， 今年在电和资金约束下提升效率。G瓦成为新计量单位，台积电保守预测2030年较2026 年有3倍以上增长。技术革新方向是降低数据搬运时间，相关技术如CPO、先进封装、液 冷关注度高。先进封装重要性提升，产业链包括封测、设备、载板材料。光刻重要性相对 下降。CPO今年进入规模量产。存储缺货是结构性问题，到2027-2028年无法解决。投资 排序坚持设计大于代工大于存储大于设备。我们要讲的就是这些内容。后续大家有什么问 题？欢迎联系我们的海外科技团队。谢谢大家。", "status": "extracted"}, "post:2026-09-07T11-20:68d2861e907e": {"id": "post:2026-09-07T11-20:68d2861e907e", "kind": "post", "title": "2026-09-07 11:20", "source_label": "帖子正文", "excerpt": "【周观点】看好半导体测试机ATE设备订单高景气开启；推荐具备安全边际的油服设备和工程机械 【半导体设备】AI驱动测试需求高景气，国产存储ATE迎规模放量拐点 国产存储测试设备接连斩获大额订单，产业进入规模化放量。", "content": "【周观点】看好半导体测试机ATE设备订单高景气开启；推荐具备安全边际的油服设备和工程机械 【半导体设备】AI驱动测试需求高景气，国产存储ATE迎规模放量拐点 国产存储测试设备接连斩获大额订单，产业进入规模化放量。9.3精智达公告签订15.76亿元测试设备采购协议、2年内交付；8.20悦芯科技获国内龙头存储厂超15亿元ATE订单，核心产品TM8000支持LPDDR、DDR、HBM测试。两笔合计超30亿元，国产存储ATE由小批量验证跨越至批量采购+规模替代。据爱德万统计，全球SoC+存储测试机市场规模由2023年44亿美元增至2025年90亿美元，预计2026年SoC/存储分别达91/24.5亿美元。AI芯片复杂度提升带来测试时长延长、价值量提升，HBM3D堆叠后测试道数由传统DRAM约3-4道升至15道以上，用量约为其5-6倍。2025年国内存储测试机国产化率仅8%-10%，海外龙头交期拉长，国产设备商有望快速替代。推荐：长川科技、联讯仪器，关注精智达、联动科技、悦芯科技（未上市）。 【工程机械】中报收入同比+15%创近5年板块新高，龙头公司表现更为优异 A股17家工程机械企业2026H1收入2218亿元同比+15%，为近5年增速新高，受益国内外周期共振上行，上半年国内外挖机销量同比+21%/+34%。龙头三一重工、恒立液压收入同比+19%/+32%，好于板块。归母净利润182亿元同比-4%，主系人民币升值汇兑损失较多；扣除汇兑损失，三一重工、徐工机械、中联重科等经营性利润增速均达30%-40%。展望Q3，国内外上行趋势持续叠加汇兑压力减小，板块利润增速有望迎明显拐点。推荐：三一重工、徐工机械、中联重科、柳工、山推股份、恒立液压。 【油服设备】中东冲突短空长多，看好全球油服龙头中长期成长 2026年2月末美伊冲突爆发，霍尔木兹海峡封锁至今未通航。中东冲突对油服设备影响短空长多，关注全球化领先的国产龙头。短期看：一、油气价格中枢上涨；二、船只绕行好望角致运费增加、提货意愿下降；三、部分施工项目暂停后延1-2季度，2026H1国内龙头订单积压、确认节奏后移。中长期看：一、地缘冲突强化全球能源安全诉求，推动油气资本开支中枢上移，复盘2022年俄乌冲突，油价高位后上游资本开支回升并向LNG、深海及非常规能源倾斜，北美、南美、非洲投资有望加速；二、战后油气设施修复形成新增设备需求。中东项目短期延迟仅影响节奏而非需求消失，行业中长期景气有望强化。关注：杰瑞股份、纽威股份。 【东吴机械】周尔双/李文意/韦译捷/黄瑞/谈沂鑫/陶泽/柴悦茹/刘捷宇/闻嘉怡#文字观点", "publish_time": "2026-09-07 11:20", "tags": ["文字观点"]}, "post:2026-09-07T18-32:79ba8dfca218": {"id": "post:2026-09-07T18-32:79ba8dfca218", "kind": "post", "title": "2026-09-07 18:32", "source_label": "帖子正文", "excerpt": "51、北特科技：1、公司根据客户需求，配合推进人形机器人用丝杠产品的样件研发工作；2、公司目前通过Tier one客户间接向华为问界系列车型配套供应转向器齿条、齿轮等产品，向特斯拉配套相应底盘零部件产品 52、浙江荣泰：公司新设智能机器人子公司，一季度净利润同比增长20.63% 53、江南新材：公司", "content": "51、北特科技：1、公司根据客户需求，配合推进人形机器人用丝杠产品的样件研发工作；2、公司目前通过Tier one客户间接向华为问界系列车型配套供应转向器齿条、齿轮等产品，向特斯拉配套相应底盘零部件产品 52、浙江荣泰：公司新设智能机器人子公司，一季度净利润同比增长20.63% 53、江南新材：公司铜基新材料产品广泛应用于PCB制造及服务器液冷散热领域，高精密铜基散热片已应用于服务器液冷散热 54、红豆股份：公司投资智能养老机器人项目，布局“人工智能+居家养老”领域 55、斯菱智驱：公司计划逐步开发和量产谐波减速器、执行器模组、丝杠三大类产品 56、华盛昌：公司收购伽蓝特100%股权，后者专注光通信模块和光芯片测试 57、长江通信：1、参股公司长飞光纤是世界领先的光纤预制棒、光纤及光缆供应商之一；2、低轨卫星通信是公司重点开拓的新行业之一，公司背靠中国信科，其在星地融合标准制定上发挥了突出的贡献，自R18开始首次实现中国在3GPPNTN的标准立项，目前已累计牵头16项，是全球牵头卫星NTN立项最多的公司\" 58、中远通：1、公司服务器电源可配套数据中心建设，标准化服务器电源360W到3200W系列产品已全部小批量生产，部分实现批量生产，且均有国产化产品；2、公司拟与郑州正方科技合作共同拓展两轮电动车快充充电桩业务 59、金字火腿：1、全资子公司拟不超过3亿元取得中晟微电子不超过20%股权，后者专注于高速光模块核心电芯片的研发设计；2、公司主营火腿及特色肉制品，重点发展香肠、腊肉、咸肉等，同时加快休闲食品市场布局 60、超声电子：公司M7/M8级高速覆铜板处于研发测试阶段，800G、1.6T光模块配套PCB在研究跟进中 61、桂林旅游：公司主营为游船客运、景区旅游业务 62、沪电股份：国内规模最大、技术实力最强的PCB制造商之一 63、天马科技：公司位于福建省福清市，鳗鱼产业链龙头 64、综艺股份：参股企业神州龙芯是一家集成电路设计企业，第一款完全自主知识产权的通用CPU龙芯一号就诞生于该公司 65、福莱新材：1、电子皮肤在人形机器人用途有身体关节的防碰撞、灵巧手等，公司全资子公司浙江欧仁新材料拥有传感器专利，分别是基于柔性压敏元件的拉伸传感器、一种柔性温度传感器及其制备方法等；2、目前公司电子级功能材料主要应用于苹果、华为、三星及国内知名高端品牌手机的无线充电模组及石墨散热模块 66、景旺电子：国内少数产品类型覆盖RPCB、FPC和MPCB的厂商 67、科森科技：1、公司为某品牌家用机器人提供相关结构件；2、公司与清陶能源共同投资设立了合资公司——科森清陶能源科技有限公司，专注于固态电池的集成、组装和系统集成等业务 68、读者传媒：公司期刊出版发行方面长期处于行业领先地位，拥有优质IP资源，已尝试通过人工智能生成文章、创作杂志封面并开发AI应用产品 69、豪尔赛：1、公司参股的华奕新能源已中标某头部通讯公司的数据中心冷板试点项目，其基于蒸发冷却独有冷水技术，复合液冷板，可完全实现无压缩机补冷；2、公司智慧灯杆解决方案基于灯具节能、智能灯控等技术，结合物联网、大数据、5G、AI、机器视觉等新一代信息技术，通过智慧照明云平台对城市路灯等公共照明实现统一智能化管理 70、魅视科技：1、公司授权管理层开展磷化铟半导体材料产业化项目前期准备工作，项目分两阶段推进：第一阶段拟投资1200万元建设磷化铟半导体材料研发实验室，配置20台（套）工艺验证设备，进行技术性实验及可行性验证；第二阶段若实验结论可行，计划投资2亿元至2.6亿元进行产业化扩建，购置主要生产制造设备280台（套）及其他配套设施；2、公司AI边缘智能分析平台深度融合边缘计算与CV视觉分析技术，可对存量摄像头进行AI赋能，打造“事前预警-事中干预-事后追溯”的全流程闭环监管体系 71、广合科技：公司拥有CPU PCB产品，上半年度净利同比预增85.12%—95.29%，主要受益于算力硬件需求激增、产品结构优化及泰国广合一期产能利用率提升带动盈利能力增强 72、新华百货：宁夏地区最大的商业零售企业，拟斥资2亿元至4亿元回购公司股份 73、京能置业：实控人为北京国资委，主营房地产，公司大量的土地储备资产位于规划中的奥运村附近，自身介入的天元港国际中心项目地处北京涉外气氛最浓的区域 74、金海高科：公司通过全资子公司专业布局 AIDC 算力基础设施服务， 以温控洁净为核心技术底座， 具备“算、 网、 电、 冷” 一体化全栈设计与系统集成能力， 构建冷板液冷、 浸没液冷两大成熟技术路线， 目前正有序推进液冷板、 CDU、 流量分配器、 不锈钢环网、 浸没机柜等核心温控洁净部件的自主研发及技术迭代工作 75、博纳影业：公司短剧业务坚持 “主旋律 + 精品化” 路线，2025年推出《长津湖之冰雪尖兵》《红海行动：蛟龙小队》等短剧，延续电影叙事风格，在央视影音、腾讯视频播放量均破1.5亿；搭建 “博纳短剧工作室”，引入电影级制作团队，控制单部短剧成本超500万元，目前已储备6部主旋律短剧项目 76、兴森科技：国内本土IC封装基板行业的先行者之一；公司生产的FCBGA封装基板可用于HBM存储的封装 77、博杰股份：1、公司拿下鼎泰芯源控股权，鼎泰芯源由中科院半导体所Ⅲ-V族化合物半导体技术团队创立，目前的核心产品为磷化铟衬底，是国内少数几家掌握磷化铟衬底材料核心技术并实现国产化量产的企业；2、公司聚焦液冷服务器制造与检测环节，核心提供液冷板精密焊接设备、液冷系统密封性检测设备及自动化产线解决方案 78、金健米业：中国粮食行业第一股，在国内拥有较高的品牌知名度；公司主要产品有大米、面粉、面条、植物油、牛奶等 79、集泰股份：公司当前研发的液冷导热硅油，其应用主要聚焦于数据中心及储能领域的热管理解决方案 80、华体科技：公司投资5.4亿元构建全国首个以智慧城市为主题的卫星星座“天座 81、崇达技术：公司是全球领先的小批量PCB企业，供给工业控制领域客户的PCB产品有应用于智能家居、人形机器人、工业机器人等方面 82、天通股份：公司生产的铌酸锂晶体材料是铌酸锂电光调制芯片及器件的上游关键原材料；公司已自主量产6英寸铌酸锂/钽酸锂晶体及黑化抛光晶片 83、青山纸业：1、控股子公司恒宝通光主营光通信模块及组件产品的研产销，系国家级高新技术企业，产品主要应用于移动通信领域，为全球大型模拟半导体设备供应厂商Avago逾十年的供应商；2、综合性造纸上市公司，实控人福建省国资委；公司主要产品为“青山牌”系列伸性纸袋纸、牛皮包装纸、溶解浆等产品 84、万向德农：公司是国内采用单倍体育种技术领先供应商 85、美格智能：公司5G模组已用于国内人形机器人并小批量发货，高算力AI模组为合作伙伴人形机器人原型机提供端侧AI算力 86、万讯自控：1、公司自身为工业自动化仪器仪表龙头，测氢专用传感器可应用在氢气储罐、加氢站、氢燃料电池测试台、氢能源汽车等领域，目前在市场销售；2、公司产品包括工业机器人3D视觉系统，可以配合机械手使用，应用于汽车、玩具、设备等行业智能制造自动化生产线中；此外持续开拓物流分拣、引导焊接机器人和康复机器人等应用领域，已完成物流自动化分拣工业机器人3D视觉系统第一代产品 87、剑桥科技：公司已向微软供应高速光模块产品，800G光模块产品已实现小批量发货，1.6T光模块产品在给客户送样测试 88、日盈电子：公司压阻式的电子皮肤样品已研发成功，在人形机器人新领域，公司以布局柔性触觉传感电子皮肤新产品为契机，结合发展战略及市场需求加快布局柔性线束等其他人形机器人产品 89、莱克电气：据网络资料，公司机器人无框力矩电机近期将交样，主要为协作机器人领域无框力矩电机（人形机器人通用），预计3-6个月批产，客户为北方头部大客户 90、泰金新能：公司是国际上可提供高性能电子电路铜箔和极薄锂电铜箔生产线整体解决方案的龙头企业，自主开发的3D陶瓷封装外壳已小批量进入CPO相关设备领域 91、三人行：公司与科通技术签署战略合作并投资，科通为NVIDIA中国区总代理，保障公司算力中心GPU硬件需求，并拟2.8亿元在青海设全资子公司青海三人行绿能智算科技有限公司，主营算力租赁及数据中心业务 92、国芳集团：公司为甘肃省内最大的连锁零售企业#市场段子#文字观点", "publish_time": "2026-09-07 18:32", "tags": ["市场段子", "文字观点"]}, "post:2026-09-07T07-50:9aae3aa95222": {"id": "post:2026-09-07T07-50:9aae3aa95222", "kind": "post", "title": "2026-09-07 07:50", "source_label": "帖子正文", "excerpt": "【中泰电子】“韬定律”预热，重视9月多催化！👉华为发布“韬定律”新论文，针对市场担心的散热问题作出解答。", "content": "【中泰电子】“韬定律”预热，重视9月多催化！ 👉华为发布“韬定律”新论文，针对市场担心的散热问题作出解答。 👉9月华为全联接大会和搭载“韬定律”的终端有望成为关注热点。 重视“韬定律”对国内突破先进制程重大战略意义。#设计优化单位算力功耗，但散热仍然重要论文通过热感知布局等方式实现了功耗下降：在性能对齐条件下，麒麟2026功耗降低分别为NPU66%、GPU58%、CPU性能核41%。这种优化是【单位算力的功耗下降】，而非【整机的功耗下降】，核心在于通过垂直架构缩短信号运输距离，优化的功耗会被用于拉算力、跑AI模型等计算环节；同时堆叠层数演进、热点重合也会导致单位面积内热量飙升。随着整体性能升级+局部热流密度增加，散热仍然关键。#重视主动散热大趋势一方面端侧AI、3D dram、NPU等发展，整机性能持续升级，另一方面韬定律堆叠架构局部热流密度飙升至数百W量级，被动散热较难满足要求，风冷、液冷主动散热新技术成为必然趋势，其较被动方案散热效率提高4倍。 #韬定律带来晶圆消耗倍增+混合键合+测试需求多重增量 ①逻辑折叠高度依赖混合键合技术，单颗芯片对应的晶圆消耗量将有望数倍增长，大幅打开先进制程空间； ②混合键合工艺预计在晶圆厂完成，单片价值量有望到数千美金，增量可观；当前pitch达1.5um，未来往1um/720nm/480nm方向迭代，发展方向明确且迅速！ ③在芯片迭代的过程中，芯片堆叠、集成度大幅提升使得单颗芯片测试时长延长，且测试工序与步骤增加，大幅增加对测试设备的需求量。 建议重点关注： 【晶圆代工】中芯国际、华虹宏力等 【混合键合】拓荆科技等 【散热】艾为电子等#文字观点", "publish_time": "2026-09-07 07:50", "tags": ["设计优化单位算力功耗", "但散热仍然重要", "重视主动散热大趋势", "文字观点"]}, "attachment:files/精智达：重大订单解读和经营展望.docx": {"id": "attachment:files/精智达：重大订单解读和经营展望.docx", "kind": "attachment", "title": "精智达：重大订单解读和经营展望", "source_label": "其他", "excerpt": "1. 核心订单情况及2026-2027年订单与收入指引 近期重大订单：公司公告一笔接近16亿（15.7几亿）的测试机订单，系继2026年1月公告单笔超13亿订单之后的又一重大订单，进一步巩固公司在存储测试设备领域的技术及业务优势。订单结构：本次订单最大亮点为包含5台18G超高速FT测试机采购需求，单台金额大几千万人民币，整个价值量占订单接近30%。", "content": "1. 核心订单情况及2026-2027年订单与收入指引 近期重大订单：公司公告一笔接近16亿（15.7几亿）的测试机订单，系继2026年1月公告单笔超13亿订单之后的又一重大订单，进一步巩固公司在存储测试设备领域的技术及业务优势。 订单结构：本次订单最大亮点为包含5台18G超高速FT测试机采购需求，单台金额大几千万人民币，整个价值量占订单接近30%。 全年订单完成情况：年初设定的35亿订单目标已提前完成；截至会议当日，在手订单、新签订单已超过年初预期，订单构成涵盖测试机、探针卡、AI眼镜及显示业务。 全年新签订单目标：下游景气度非常高，全年新签订单目标将向40-50亿甚至更高努力，具体取决于下游扩产整体节奏。 交付节奏：18G测试机自下个月（2026年10月）开始陆续交付，剩余测试设备于2027年上半年交付完毕，整个订单争取一年之内全部交付完毕。 2027年订单展望：全年预期非常乐观，订单能见度逐步清晰，预计较2026年有翻倍增长；其中高速测试产品（FT测试机+应用于HBM的CP测试机）占比有望超过30%。 收入与增速指引：2026年收入目标此前口径为15-20亿，考虑订单数量超年初预期、交付节奏快，存在超预期可能；2027年订单、收入增长速度有望保持三位数增长，有机会实现翻倍增长。 行业地位：全市场唯一一家公告获得超大体量存储测试机订单的设备厂商。 卖方点评：浙商证券本月发布公司深度报告并作重点推荐，认为多项指标超过市场此前预计及长期跟踪研究员的预判。 2.18G超高速FT测试机：国产唯一重大技术突破 行业卡位：本次获得的是国内第二台、国产厂商第一台18G高速测试机订单（第一台为国际厂商），系国际厂商之后第一家、也是目前唯一一家获得18G超高速FT测试机采购订单的国产设备厂商。 技术演进脉络： 2025年已交付9G高速测试机，过去一年持续在客户现场进行验证、改进、debug迭代；18G系在9G基础上对设备架构、硬件软件架构进行升级，面向客户未来两到三年新的存储芯片。 向下兼容9.6G、10.8G、12.8G、14G多档速率，覆盖全系列高速DRAM测试需求；匹配DDR5、DDR5X、DDR6、LPDDR6等更高一代DRAM芯片成品测试，为存储芯片10G级以上数据迭代的核心量产测试设备，系国内首款完成工程验证、即将进入量产的该规格设备。 未来存储芯片速率将向9.6G、10.8G、14.4G甚至更高频率演进，18G测试机是未来高速测试需求的\"必选项\"。 ASIC芯片底座：18G产品基于第二代自研ASIC打造；18G ASIC于2024年下半年立项（2年前启动），于2025年回片，系国内首个18G ASIC芯片回片；2026年大半年时间用于芯片校正、验证、bring up、debug及工程机调试、量产机组装调试验证，整体进度非常顺利。 性能对标：测试速度、通道数（为国际竞品的1.5倍）、测试并测数、效率上优于国际同行，能有效降低客户测试成本；单台性能比肩甚至超越国际竞品，在价格、交付周期、现场响应速度上具备国内显著优势。 后续路线图：18G有望成为后续设备基线版本用于对比，积累的中低速→9G→18G量产验证经验可反馈至22G、36G甚至更高速率产品研发，有望奠定18G上至少两年以上量产验证经验优势。 产品分层格局：中低速段ST测试机保持量产交付经验绝对领先；9G为当前FT主力出货产品，可覆盖目前主流存储芯片测试需求；18G巩固超高速先发优势；同步承接其他中低速及9G前几代订单需求，满足客户扩产计划。 3.探针卡业务：3D MEMS国产替代进入放量兑现期 行业痛点与替代逻辑：DRAM探针卡长期仅两家海外供应商——日本供应商不对中国供应、美国供应商存在地缘政治因素导致的供应不稳定及交期紧缺两大问题，客户对国产探针卡供应链培养诉求强烈。 技术突破：公司3D MEMS探针卡采用与美国同行相同技术路线，已攻克3D MEMS pin技术与工艺，实现关键部件本地化可控，为国内首家能够量产3D MEMS探针卡的厂商，并已实现全流程自研量产。 客户验证与交付：上半年针对DRAM 125度高温burn-in测试的探针卡已成功交付多张，在客户现场已量产数千片wafer，高温环境下测试良率、uptime均较理想，客户满意程度很高。 价值量与盈利性：单张探针卡价值量几百万级别，今年已实现批量、高毛利出货；攻克3D MEMS pin技术与工艺后，探针卡毛利率将有很大提升。 市场空间：此前几年市场空间在十几亿基础上，未来随HBM扩产及封装测试需求提升，需求有望成倍数级增长。 竞争地位与目标：已成为核心客户探针卡最主要供应商，目标进一步提升市场份额，有机会成为主力供应商、市占率快速提升。 卖方点评：探针业务已快速进入放量阶段，而非仅停留在研发阶段，属超预期；对标美国F公司仅探针赛道即支撑大几百亿市值，耗材潜力需充分重视。 4.财务指标与盈利能力指引 毛利率爬坡轨迹：综合毛利率自2024年的30%、2025年的37%，提升至2026年上半年接近43%-44%，呈持续提升节奏；且该提升是在原材料成本攀升、快速扩产增加生产成本、前期导入前沿产品导致产品结构不利的情况下实现的。 毛利率指引： 短期目标：45%-50%； 中期目标：50%-60%，向国际友商看齐； 特定先进产品：可达60%-70%； 相对量产经验丰富的产品（如老化测试机）：落在45%-50%区间。 研发投入：2026年上半年研发投入比例接近20%，未来一段时间仍将保持高强度投入，以保障前沿技术开发和核心竞争力。 净利润率指引：未来目标设在20%-30%区间；受研发团队投入及股份支付成本等影响，可能产生阶段性波动。 盈利趋势判断：随着2026-2027年主力产品进入量产交付阶段，公司订单、业绩、利润、毛利率、净利率水平将出现显著提升。 5.产品线梯度布局：SOC、NAND、KJSD与新兴业务 SOC高端数字测试机（算力芯片方向）： 将于2026年第四季度推出SOC高端测试机，测试频率达1.6Gbps，对标国际同行93K X最高端标准。 布局始于6年前，采取上市公司与子公司双路线同步投入策略，在底层高速信号、向量生成、电源等共性技术平台上已取得重大进展。 目标客户分两类：GPU/AI算力芯片厂商与消费类高端大芯片厂商；目前工程机产品已取得可观进展，在公开场合陆续推广，已与至少五家以上国内头部客户对接验证，其中两到三家进展较快。 时间表：希望在2026-2027年完成验证和批量订单工作，2027年有所突破，2028年成为新的业务增长点。 差异化优势：AI+HBM异构时代具备存储+算力芯片一体化成套测试解决方案能力——跨芯粒复合测试对ATE设备在硬件（高精度电源、高速测试、多站点并行、探针卡配套）和软件生态上均提出很高要求，公司依托存储/HBM测试能力、自研ASIC储备及系统化方案形成独特卡位。 市场判断：算力芯片测试机市场比存储测试机更复杂、体量更大。 NAND领域：与DRAM测试方式有所差别，但在主要站点、核心技术上有很强的共通性；将提供9G以上版本以契合下游产业升级需求；与国内领先客户接触推进顺利，预期近期同步交付相关产品并在订单上有所体现；存储领域量产经验优势与技术优势是进一步跨客户合作最有利的基础。 KJSD晶圆段测试：属全新测试需求，测试站点多；已全面推出KJSD CP各环节测试设备，包括wafer level burn-in设备、read测试CP测试机、高速speed测试机；客户现场加速验证中，期望2027年客户该类产品上量时验证进度吻合、获取更多订单。 AI眼镜及显示业务：2026年零散订单中亦包含AI眼镜及显示业务订单。 卖方点评：NAND和HBM方向公司均已看到突破，2026年底前或可能看到进一步进展；SOC方向尤其是头部GPU阵营已进入实质性推进阶段。 6.存储测试设备行业空间与需求测算 FT测试设备市场：仅FT测试设备需求每年即接近100亿；加上CP段（Normal CP、高速CP、HBM测试）需求，在DDR4时代每10万片对应60-70亿需求的基础上，未来扩产需求起码有2-3倍增长。（管理层未就具体客户DRAM/HBM每万片价值量作回复，以上为整体市场口径） HBM测试量价关系：HBM测试环节多、测试时长为普通DRAM的20-30倍；3万片HBM产能对应的测试价值量保守为普通DRAM的几倍以上；HBM测试是未来采购的核心增量。 需求扩张倍数：整体测试设备市场需求扩张呈倍数级、几倍级、甚至在一段时间内10倍级增长，公司对此非常期待。 行业增速背景：SEMI口径下2025年、2026年测试设备市场增速明显高于前道制造设备，核心驱动来自AI芯片和HBM芯片测试时长通胀。 中长期需求逻辑：存储芯片性能提升（更快速度、更大容量）带动测试环节价值量显著提升、测试站点增加、测试时间加长；下游扩产速度比预想快很多，设备交期拉长促使客户提前下单，为2027年业绩提供支撑。 7.竞争格局与核心壁垒 三大\"唯一\"标签：目前唯一一家能够提供全品类系统化解决方案的测试设备厂商；唯一一家拥有DRAM长期量产经验的厂商；唯一一家拥有自研ASIC能力及高速/超高速测试能力的厂商。 ASIC团队储备：拥有超过100人的ASIC研发团队，专门从事相关专用测试芯片研发，系保持核心竞争力的关键环节。 系统化壁垒：测试机涉及自研ASIC、高精度电源模块、精密温控、高速连接及信号完整性、一致性、稳定性等维度，需长期技术积累与客户端长期验证；复杂测试机量产经验及长期配合客户扩产的积累绝非一时之功，急功近利会直接影响客户交付周期及后续生产节奏。 国际竞争窗口期：海外竞争对手产能与国内下游客户扩产节奏存在错配，且对国内高端产品交付比较偏保守，为公司提供良好的窗口期；谁先在产品卡位、率先通过量产验证，将获得更好的市场份额机会，公司判断自身在产品布局完整性、验证进度上处于较强领先优势。 市值对标参考（浙商机械点评）：美国F公司仅探针赛道即支撑大几百亿市值；日本A公司约1万亿左右市值；全球测试领域头部K公司接近2万亿市值；国产半导体测试设备及后道耗材均有较大提升空间。 8.产能交付保障、新客户与资本运作 产能准备：自2025年起大幅扩充产能，人员规模、生产场地均大规模扩张；供应链关键元器件已提前备货，自研ASIC芯片准备尤为充足；2027年将继续扩展，以支撑逐年翻倍的订单交付。 交付风险与应对：最大压力为核心部件交期变长、不确定性变高，部分物料可能涨价；核心产能已提前锁定，订单按客户节奏分季度下达，将优先保障战略客户交付，大订单产能交付风险可控。 新客户拓展：武汉、福建新存储客户正在密切对接、商务洽谈中，期望2027年实现更多客户拓展。 资本运作与生态构建：将在前沿技术研发、供应链产能锁定、核心技术人才招募方面重点投入；基于公司核心技术平台，通过自研、并购、产业基金投资等方式拓展新产品、新技术、新业务领域，构建并参与核心业务生态；具体进展将通过公开信息披露。 资金与订单状况：整体资金状况和未来订单情况均非常良好。 问答整理 1 请问公司在NAND领域的进展以及SOC产品线上目前的推进情况如何？ 关于NAND业务，公司产品属于存储测试范围，NAND与DRAM在技术上有一定共通性，公司在高速测试和老化测试领域具备较强优势，能够帮助客户解决扩产过程中的痛点。公司推出的9级以上版本新产品契合客户未来生产需求，与国内领先客户接触推进顺利，预计近期同步交付相关产品并在订单上有所体现。综合来看，公司在存储领域具备量产经验优势和技术优势，这是进一步与不同客户展开合作的基础。关于SOC或算力芯片测试机，公司早在6年前启动布局，采取在子公司和上市公司层面同步投入的策略。上市公司重点发展存储测试机，部分核心技术如底层高速信号、向量生成电源等打造共用技术平台，但芯片测试机架构和软件生态存在差异，两条路线均取得重大进展。上市公司层面工程机及相关产品在客户方面取得可观的进展，测试速率达到1.6Gbps，对标国际最领先产品。目标客户包括GPU/AI芯片/AI算力芯片厂商以及消费类大芯片厂商，目前已经与至少五家以上头部客户进行对接验证，其中两到三家进展较快，希望在2026年和2027年完成验证和批量订单工作。算力芯片测试机市场体量比存储测试机更大，公司作为存储测试机厂商在AI+HBM异构时代一体化成套测试解决方案方面具有优势。跨芯粒复合测试是存储+测试组合方案的核心差异化赛道，对ATE设备硬件和软件要求很高，需要高精度电源、高速测试能力、多站点并行、探针卡配套等系统化解决方案，软件更复杂。公司依托存储、HBM测试能力、ASIC储备等能够配合算力芯片测试机推广，希望在存储+算力芯片一体化测试咨询方案方面为国内更复杂测试需求客户提供针对性方案，这是公司独特且符合未来市场发展的最大优势。 2 请问公司当前国内头部客户DRAM产线及潜在HBM扩产带来的每万片测试机价值量大概是多少？以及如何测算？ 公司不能针对具体客户回复，但根据目前看到的测试需求，不管AI芯片还是HBM或更复杂测试需求，未来仅FT测试设备需求每年接近100亿市场。加上CP测试（包括Normal CP高速、HBM测试），在DDR4时代每10万片可能有60-70亿需求基础上，未来扩产需求起码有2-3倍增长。具体还要看技术演进情况，公司产品和技术服务于客户攻克尖端技术，引领后续需求增长。客户核心需要降低整体测试成本，但对复杂测试的投入可观，HBM测试是未来采购的核心增量，该环节测试点多，测试时长可能是普通DRAM的20~30倍。因此3万片产能对应的测试价值量保守来看是普通DRAM的几倍以上。公司CP段和FT产品都采用高速测试需求，对于未来整体市场需求扩张呈倍数级、几倍级甚至10倍级增长非常乐见和期待。 3 公司今年收入目标15-20亿是否有超预期可能，对明年展望如何，毛利率指引有何变化？ 收入方面，公司已尽尽全力推动，订单数量超过年初预期，最终要看客户确认收入的节奏，整体交付很快，对公司收入比较乐观。盈利方面，产品毛利率从2024年开始到2026年年中，综合毛利率从30%多提升至去年37%，今年上半年接近43%-44%，持续提升，这是在面临原材料成本攀升、公司快速扩展导致生产成本增加以及前期导入产品结构偏高不利情况下实现的。随着今年及明年主力产品量产交付，毛利率会进一步上升，短期目标为45%-50%，中期目标为50%-60%，整体毛利率向国际友商看齐。特定先进产品毛利率会达到60%-70%，量产经验丰富的产品如老化测试机毛利率落在45%-50%区间。净利润方面，目前公司为保证客户端扩产过程用上最前沿技术，提升行业产品良率，大力投入研发，2026年上半年研发投入比例接近20%，未来一段时间会保持较高强度，这是保障客户和核心竞争力的长期必要投资。公司未来目标净利润率水平设在20%-30%之间，过程中会受研发团队投入和股份支付成本影响，可能有阶段性波动，但公司始终以保持产品竞争力和未来盈利能力作为产品推广和技术投入的重要标准。", "status": "extracted"}, "post:2026-09-07T20-22:24d9838bfb4e": {"id": "post:2026-09-07T20-22:24d9838bfb4e", "kind": "post", "title": "2026-09-07 20:22", "source_label": "帖子正文", "excerpt": "通信十五五规划落地，光纤光缆迎来AI新周期——重点推荐亨通光电# 事件点评 工信部今日发布“十五五”信息通信行业发展规划相关信息，明确到2030年我国信息基础设施累计投资将达到3.8万亿元，智能算力规模达到9800 EFLOPS，并重点推进新一代通信网、算力网建设，推动400G以上超高速传输、1.6", "content": "通信十五五规划落地，光纤光缆迎来AI新周期——重点推荐亨通光电# 事件点评 工信部今日发布“十五五”信息通信行业发展规划相关信息，明确到2030年我国信息基础设施累计投资将达到3.8万亿元，智能算力规模达到9800 EFLOPS，并重点推进新一代通信网、算力网建设，推动400G以上超高速传输、1.6Tb/s光传输、10G光网络等发展。 我们认为，这一轮信息基础设施建设与过去最大的不同，是AI正在重新定义通信网络。AI集群规模从万卡走向十万卡，算力中心之间的DCI互联、数据中心内部高速互联以及长距离骨干网络，对光纤数量、单纤容量和低损耗性能都提出更高要求。 我们坚定看好光纤光缆板块，这可能是未来几年AI基础设施中被市场低估的方向。 # 一、光纤价格已经进入新一轮景气周期 近期中国移动2026-2027年普通光缆集采落地，18家入围企业中17家报价达到最高限价，产业链调研对应光纤价格已经突破80元/km，部分口径达到约83元/km。 更重要的是，本轮集采供应承诺并未完全覆盖中国移动约6922万芯公里需求，意味着行业供需关系正在发生变化。 过去几年光纤光缆经历长期价格竞争，市场容易形成“产能充足、缺乏弹性”的固有认知。但现在情况正在改变：传统运营商需求逐步恢复，同时AI数据中心带来新的增量需求，而光纤预制棒扩产周期长、数据中心认证周期更长，新增供给无法快速释放。 这意味着光纤价格一旦进入上行周期，盈利弹性可能明显高于市场预期。 # 二、真正值得重视的是AI带来的光纤需求 AI数据中心正在从“服务器堆算力”转向“网络堆连接”。 以GW级智能算力中心为例，DCN网络本身可能对应数百万芯公里级别的光纤需求，同时DCI还会进一步增加跨数据中心互联需求。 产品结构也在升级。传统652D正在向657A1、657A2以及G.654.E等高端低损耗光纤迁移，AI数据中心内部则需要更多高密度光缆、MPO等产品。 此外，空芯光纤正在从技术验证走向产业化探索。规划中明确提出推进新型光通信技术，空芯光纤、超低损耗光纤等新产品有望成为下一阶段产业升级的重要方向。 海外同样如此。我们近期产业链跟踪了解到，北美数据中心光纤供应依然偏紧，国内头部厂商正在加速进入海外供应链，公司海外客户合作也在持续推进。 因此，光纤不是简单的传统通信周期，而正在成为AI基础设施的新型刚需。 # 三、亨通的核心优势：光纤龙头+AI光连接双轮驱动 我们为什么在光纤板块重点推荐亨通光电？ 首先，公司本身就是全球光纤光缆核心企业，在预制棒、光纤、光缆以及海外产能布局上具备完整产业链优势。随着A1/A2等高端产品占比提升，产品结构改善有望进一步放大盈利弹性。 其次，公司正在持续向AI光互联升级。G.654.E新型光纤已经完成800G传输验证，并覆盖干线、城域、DCI等应用场景；空芯光纤、高密度光缆、MPO等产品也在持续推进。 更值得关注的是海外市场。我们产业链跟踪了解到，公司与北美Tier-1客户的合作进展好于此前市场预期，海外光纤业务正在从“客户导入”向“订单兑现”推进。 # 四、另一个预期差：光模块业务进展超预期 这里需要单独强调，光模块与光纤是两条业务逻辑，但亨通同时布局两端，形成了区别于传统光纤企业的重要增量。 我们了解到，公司光模块业务进展明显好于市场此前预期，目前已经进入多个北美Tier-1客户供应链，800G产品已经实现较大规模出货，1.6T产品即将进入小批量交付阶段。 随着新基地明年逐步投产，1.6T产品有望进一步走向规模化出货。 公司此前已经完成硅光平台、400G/800G硅光模块以及CPO相关布局，并持续推进1.6T高速计算光模块。 也就是说，亨通的逻辑正在从“光纤价格上涨”逐步变成： 光纤涨价带来的周期弹性 + AI光纤需求增长 + 海外市场扩张 + 800G/1.6T高速光模块放量。 这也是我们认为公司估值体系有望发生变化的关键。# 投资观点 我们对未来几年光纤光缆产业景气度保持强烈看好。 十五五信息通信基础设施建设叠加AI算力网络升级，正在共同推动光纤需求进入新的增长阶段；而价格上涨、供给扩张周期长以及高端产品结构升级，又进一步强化了行业盈利弹性。 因此，我们坚定看好光纤光缆板块，也坚定看好亨通光电。 公司2026H1实现营收420.26亿元，同比增长31.13%；归母净利润31.2亿元，同比增长93.38%，光通信业务收入同比增长超过130%，盈利兑现已经开始验证产业景气。 我们认为市场当前对亨通的定价仍主要围绕传统光纤光缆，而AI光纤、海外市场以及高速光模块业务的增量价值尚未充分反映。 在AI基础设施从“算力建设”走向“算力互联”的阶段，我们认为，光纤光缆将成为通信板块值得持续重估的核心方向，亨通光电则是其中值得重点跟踪和配置的核心标的。目标市值3000亿元，较当前近翻倍空间！#文字观点", "publish_time": "2026-09-07 20:22", "tags": ["文字观点"]}, "post:2026-09-07T18-32:30533dd56eec": {"id": "post:2026-09-07T18-32:30533dd56eec", "kind": "post", "title": "2026-09-07 18:32", "source_label": "帖子正文", "excerpt": "20260907今日段子汇总 1、迅捷兴：1、公司拥有深圳、信丰和珠海三个制造基地，PCB业务涵盖样板、小批量板和大批量板，是行业内为数不多可以为客户提供从样板到批量生产一站式服务的PCB企业；2、公司表示在光模块领域已积累了相关产品经验和客户，目前可批量接单", "content": "20260907今日段子汇总 1、迅捷兴：1、公司拥有深圳、信丰和珠海三个制造基地，PCB业务涵盖样板、小批量板和大批量板，是行业内为数不多可以为客户提供从样板到批量生产一站式服务的PCB企业；2、公司表示在光模块领域已积累了相关产品经验和客户，目前可批量接单；3、公司产品主要应用于工业机器人类型产品，如焊接机器人、多关节机器人、智能协作机器人、移动机器人等 2、思看科技：1、公司与拓竹科技签订框架合作，共同开发消费级3D扫描仪；2、公司6D位姿跟踪系统已在工程机械、焊接机器人等场景实现批量订单 3、中石科技：1、中际旭创拟以55.70元/股受让公司控股股东10.47%股份，交易总价17.47亿元，成为公司持股5%以上股东；2、公司宜兴子公司主营产品包括液冷模组等，建立相关技术储备和产品线，为国内外多家服务器企业提供液冷等全方位的管理综合解决方案；3、公司VC产品在高速光模块中的市场化应用加速落地 4、爱仕达：公司与智元机器人签署战略合作协议，是前海再保险股份有限公司的发起股东之一，持股比例为14.50% 5、亚盛集团：我国当前最大规模的农艺种植基地；公司主营啤酒花、苜蓿牧草、马铃薯、制种玉米、大麦、食葵、果蔬等作物规模化种植 6、百大集团：公司主要从事百货零售、酒店服务、物业管理 瓶颈、损耗 大、需定期维护（约 3年更换）等问题。硅光方案（ IPronics ）切换速度快（亚毫秒级）、 体积紧凑、插损低，但良率低、封装成本高，处于商业化早期。液晶方案（ Coherent ）介 于两者之间。插损方面，硅光最低，液晶次之， MEMS 最高。 谷歌的OCS 架构：谷歌在 TPU 集群中大规模采用 OCS，从V6开始，V8/V9 代采用6D torus 拓扑，OCS 用量显著增加。 V9可能采用双层 OCS 架构，交换机数量增加 30%以上。 谷歌目前约 70%使用MEMS 方案，同时也在研发其他方案。 OpenAI 的ASIC 架构：OpenAI 采用博通设计的 Ultra Ethernet 架构，OCS 用于spine 层，配比约为一个机柜一台 OCS（64端口对应 64颗芯片）。目前主要使用 MEMS 方案， 未来可能转向硅光。 其他厂商布局： Meta 倾向于液晶方案（与 Coherent 合作），亚马逊和微软关注硅光 方案。 国内供应链机会：国内厂商在 OCS 领域处于早期验证阶段。光库、德科利为英伟达送 样光学器件；天孚、藤井提供环形器；太辰光提供光纤连接器；中际旭创和光库有机会成 为英伟达的整机代工商。光库曾为谷歌代工核心器件，但非整机。炬光提供微透镜阵列， 处于早期验证。 英伟达采用 OCS 的必要性： CPO 技术主要解决板级互联，而 OCS 用于解决机柜间 （rack-to-rack ）的光路路由，降低系统功耗和信号阻塞。未来终极形态是 GPU 和交换机通 过CPO 输出光纤直接接入 OCS，实现全光互联，功耗可降低至 1/4到1/5。 光模块速率趋势：谷歌 V9可能采用 1.6T 和2.4T 光模块，内部 1.6T，外部相干 2.4T， 明年可能推出 3.2T。 其他细节： MEMS 方案产能不足，易损耗；硅光方案良率低； OpenAI 芯片数量为 64 颗，机柜与 OCS 1:1 对应；英伟达未来可能将 OCS 用于scale up 层，但短期内不会。 总结：OCS 技术正成为 AI集群互联的关键， MEMS 当前占主导，硅光被视为未来方向。国 内厂商在器件和代工领域有切入机会，但整体仍处于早期。 会议实录 专家：英伟达因为前端有 MA link 等，所以其 OCS 主要部署在后端，即 scale out 算力互联 网络。从网络层级来看，一般是指 spine 节点。它主要用来替代部分电包交换机，或者说 应用层。这样做的主要目的是为了降低功耗。另外，在成本上也有削减。因为以前的光电 交换机网络部署成本较高，而使用全光交换的话，成本会大幅下降，同时功耗也会大幅下 降。另外，从英伟达的拓扑结构来看，如果采用 OCS 方式，升级节点（如升级到 1.6T 或 3.2T）时，并不需要更换 OCS 交换设备。这样对网络拓扑的投资是一个比较好的选项，因 为不需要频繁更换整体网络架构。 提问者1（0:02:02 ）：好的，专家，英伟达用 OCS，在28年的那一代里面是用在 scale out 吗？是机柜之间互联吗？还是具体的？ 专家（0:02:14 ）：是scale out 的。 提问者1（0:02:17 ）：那配比情况能介绍一下吗？谢谢。 专家（0:02:23 ）：配比取决于端口密度。因为 OCS 主要用在 spine 层，所以整体用量还不 是很大，因为 all reduce 在节点开始收缩。英伟达 OCS 常见的端口密度是 320×320 或 512×512 。对于320×320 的OCS，基于1.6T 网络架构，配比大概在 160:1 或320:1 ，即每 160颗或320颗GPU 需要一台 OCS 交换机。这取决于一个 GPU 对应几个上行光口。如果 一个GPU 对应一个 uplink ，则一台 OCS 可连接320个GPU，配比320:1 ；如果一个 GPU 对 应两个uplink ，则一台 OCS 可连接160个GPU，配比160:1 。 提问者1（0:04:22 ）：专家，就端口而言， GPU 端口和OCS 光端口是 1:1吗？ 专家（0:04:32 ）：取决于几个上行光口，如果是一个，就是 1:1。 提问者1（0:04:40 ）：所以现在有两种方案，对吧？ 专家（0:04:41 ）：是的。 提问者1（0:04:44 ）：明白。 NV现在主要的产品端口情况如何？它对于方案的偏好是什 么？ 专家（0:04:53 ）：对于 NV来说，比如万卡集群，如 NV L72 ，如果spine 层全部用 320端 口OCS 替换传统电交换机，对于 3.2万卡集群， spine 层大概需要 100到128台OCS。总体 配比约为 256:1 ，即256颗GPU 配一台OCS，这是针对超大规模万卡集群，考虑冗余的情 况。 提问者1（0:05:48 ）：好的，专家。有提到 NV偏好小端口 OCS，请问NV的端口情况是否 与谷歌有较大量级差别？ 专家（0:06:00 ）：是的。因为 NV的集群规模比谷歌小，谷歌的 TPU 通常是9000 多颗芯片 组成一个 superpod ，而NV更注重单芯片算力，其 Rubin Ultra 也只有576颗芯片，比谷歌 小一个量级。所以 NV不会一味追求大端口，更可能选择小端口光交换机。 提问者1（0:06:46 ）：明白。 NV目前主要研发的方向，偏好的端口数量以及方案（硅光、 MEMS 、液晶等）能否介绍一下？ 专家（0:06:59 ）：英伟达投资了一家做 OCS 的公司叫 IPronics ，主要推硅光方案。但英伟 达目前也在用成熟的 MEMS 微镜，因为硅光还不够成熟。硅光方案最大的优点是切换时间 非常短，是亚毫秒级，比 MEMS 切换速率更高。由于没有机械组件，节点故障时重构速度 是亚毫秒级，体积也更紧凑。但硅光和液晶方案目前都不太成熟，最成熟的还是 3D MEMS 结构。 提问者1（0:08:44 ）：明白。硅光和液晶方案不成熟的主要技术卡点在哪里？ 专家（0:08:53 ）：硅光方案量产良率低，封装成本高。 IPronics 今年3月才建了专门的封 装产线。相比之下，谷歌从 TPU V6 就开始做 OCS，与Lumentum 一起做的 3D MEMS 架构 已有近5年历史，所以 3D MEMS 更成熟。硅光还处于商业化早期，预计到 2028-2029 年逐 渐成熟。 提问者1（0:10:02 ）：感谢。请问国内有哪些厂商进入到 NV的硅光方案供应链中，大概份 额如何？ 专家（0:10:17 ）：你是指 OCS？ 提问者1（0:10:19 ）：对， OCS 的硅光方案。 专家（0:10:23 ）：国内 OCS 领域还处于很早期的研发阶段。有一些公司如光库、德科利 等，给英伟达送样，但处于早期。还有一些光学组件供应商，如天孚、藤井做环形器，太 辰光做光纤阵列连接器，也都给英伟达送样验证。英伟达这边也处于早期验证阶段。 提问者1（0:12:02 ）：明白。不同方案（ MEMS 、液晶、硅光、压电陶瓷）的价值量情况如 何？ 专家（0:12:14 ）：你是指 OCS 整体的价格？这个我不太清楚。 提问者1（0:12:22 ）：好的。请教一下， OCS 未来使用层级，可能会在柜内使用吗？从架 构上讲，在英伟达的 scale up 层，会不会下沉到这个层级？ 专家（0:12:45 ）：短期内可能不会。英伟达在 scale up 层主要做 CPO，CPO 经过四五年发 展已经比较成熟，结合 NVLink 、以太网，成熟度很高。唯一瓶颈是台积电的制程良率。未 来两三年主打 CPO。OCS 是下一代方案，当机柜需要塞成百上千个加速器时， NVLink 或 CPO 可能不够灵活。英伟达在 OCS 上的投资和研发是为了未来 3到5年部署。 提问者1（0:14:22 ）：明白。 NV整机代工现在给 Lumentum 和Coherent 做，还有其他供应 商吗？您觉得国内哪些厂商有可能拿到份额？ 专家（0:14:43 ）：你指的是 OCS？ 提问者1（0:14:47 ）：对，都是 OCS。 专家（0:14:49 ）：整机代工方面，中际旭创有机会。中际旭创是英伟达最大的光模块供应 商之一，也在全面推进 OCS 全光交换机的系统集成研发，包括与 CP硅光光引擎的合作， 以及与英伟达下一代 scale across 全光架构的搭建合作。另外光库也具备 OCS 关键器件能 力，如光开关、隔离器、保偏组件，曾为谷歌代工 OCS 设备，现在也与英伟达有前期合作 验证。目前主要就是这两家。 提问者1（0:16:23 ）：好的。光库给谷歌代工 OCS 是整机代工还是模组？与 NV合作供应 的零部件主要有哪些？ 专家（0:16:37 ）：光库帮谷歌做的是核心器件的集成和代工，不是整机。谷歌 OCS 整机代 工是一家台湾公司，叫 K L E T 。 提问者1（0:17:19 ）：那么与 NV的合作也是类似吗？具体是什么样的零部件？ 专家（0:17:30 ）：在NV这边，光库主要集合其在光开关、隔离器方面的积累，将 IPronics 的硅光器件与光开关、隔离器结合，做整机代工。所以光库在英伟达这边可能充当整机代 工商，可能是中际旭创的合作方或备选代工商。 提问者1（0:18:46 ）：好的。介绍一下 OpenAI 的ASIC 互联与OCS 的落地情况，以及与谷 歌OCS 架构的区别？ 专家（0:19:05 ）：OpenAI 的整体架构基于博通帮设计的 Ultra Ethernet 架构，配合高密度 OCS 矩阵。OCS 主要用于 spine 层，与英伟达类似，取代外围的光电交换机。 提问者1（0:19:51 ）：明白。用量情况如何？ 专家（0:19:54 ）：用量情况，在 OpenAI 的架构中，我看看最新的架构图。 提问者1（0:20:16 ）：方便投屏吗？ 专家（0:20:21 ）：我找一下图发到群里，不知道能不能看到。 提问者1（0:20:50 ）：可以的，麻烦讲解一下。 专家（0:20:55 ）：中间部分是芯片架构，外围是大量 HBM3E 。芯片级互联类似谷歌的 ICI，采用自研总线协议。机柜内网络采用低延迟，机柜间网络部分采用 OCS，类似谷歌的 Dragonfly 拓扑，大量使用 OCS 实现光互联。右下角是机柜级网络。 提问者1（0:22:00 ）：可以看到。之前了解到 OpenAI 架构是一个机柜用一台 OCS，是吗？ 专家（0:22:14 ）：是的。因为芯片数量没有谷歌那么多，所以可以实现单个 OCS 管理一个 机柜的连接。 提问者1（0:22:41 ）：感谢。介绍 MEMS 方案产能不足的原因以及国内供应链情况。 专家（0:23:06 ）：MEMS 方案的推进者主要是 Lumentum 和Calient 。MEMS 是机械部件， 利用微镜偏转角度实现，难以像集成电路或硅光那样大规模量产，加工更接近手工，很难 大规模量产。随着谷歌 OCS 规模扩大， Lumentum 和Calient 的产能有瓶颈。另外， MEMS 机械部件易损耗，谷歌的 OCS 微镜阵列约 3年需维护或替换，加剧了生产紧缺。 提问者1（0:25:03 ）：所以 MEMS 方案的不稳定性比其他方案更高？ 专家（0:25:08 ）：对，端口规模大时损耗较大，机械部件易磨损，限制了 MEMS 大规模扩 展。 提问者1（0:25:32 ）：明白。现在谷歌大概 70%是MEMS 方案？ 专家（0:25:38 ）：是的。但也有液晶和硅光方案，液晶主要是 Coherent ，硅光是 IPronics 等。这两个方案没有 MEMS 成熟，但相信 2028 年会有更新的 OCS 方案出来。 提问者1（0:26:08 ）：明白。这些方案中哪个插损最多，哪个最少？ 专家（0:26:16 ）：插损最低是硅光方案，其次是液晶，再其次是 MEMS 。 提问者1（0:26:34 ）：明白。谷歌 V9T新架构中，整个 TPU Pod 对OCS 的使用量相对于 V7 的翻倍关系如何？ 专家（0:27:04 ）：V9T还没出来，你是指 V8吧？ 提问者1（0:27:09 ）：V9结构是6D拓扑，大家讨论对 OCS 的增量。那 V8的出货量和 OCS 增量怎么看？ 专家（0:27:29 ）：对于 V8T，如果superpod 有1万多颗TPU，OCS 配比会变高，用量更 大。早期小型 3D torus 架构约64:1，可能用 16台OCS。但进入 Ultra superpod （1万多颗 TPU）的6D torus 结构（V9T），OCS 配比达到 1:96 甚至1:128 ，OCS 用量达到 256台。而 且单层OCS 拓扑可能不够，需要采用双层结构。 提问者1（0:29:08 ）：明白，一个 TPU Pod 对应200多台OCS。 专家（0:29:14 ）：对，相当于双层 OCS 架构，比单层 OCS 交换机数量增加 30%以上。 提问者1（0:29:29 ）：除了 NV和谷歌，其他 ASIC 厂商的OCS 落地情况如何？现在大部分 厂商开始布局 OCS。 专家（0:29:47 ）：除了谷歌和英伟达， Meta 也在部署其 MTIA 芯片的新数据中心，目前大 多数云厂商在尝试 MEMS 方案，因为最成熟。但不同厂商未来方向不同： Meta 看重液晶 方案（与 Coherent 合作），亚马逊和微软看重硅光方案，与英伟达接近。 提问者1（0:31:37 ）：了解国内供应商如炬光等在 OCS 整机中的价值量占比？ 专家（0:31:50 ）：炬光主要做微透镜阵列。但 OCS 量还小，价值量占比不清楚。炬光还处 于早期验证阶段，没有完全打入谷歌或英伟达体系。 提问者1（0:32:25 ）：了解谷歌 V9光模块的速率情况吗？ 专家（0:32:38 ）：谷歌 V9下一代在做 1.6T 和2.4T 光模块。 提问者1（0:32:56 ）：都是 2.4T？ 专家（0:33:00 ）：2.4T 更多用于外部相干（ coherent light ）在spine 外层。内部会用到 1.6T，如果顺利，明年 3.2T 光模块会出来。 提问者1（0:33:34 ）：最后请教一个问题：英伟达使用 OCS 的必要性是什么？ CPO 已经能 解决大部分问题，为什么还要引入 OCS？ 专家（0:33:58 ）：开头就提到，英伟达采用 OCS 是因为传统的 NVLink 、InfiniBand 或CPO 只解决了机柜内互联，但当集群规模扩大， CPO 和NVLink 会面临挑战。 OCS 解决的是 box- to-box 或rack-to-rack 之间的光路径路由和网络拓扑。 CPO 只解决chip-to-board 或board-to- board ，而box-to-box 或rack-to-rack 的连接能力有限。所以英伟达在 OCS 上做前期研发。 未来终极形态是 GPU 和交换机通过 CPO 输出光纤，直接接入 OCS，完全消除光电转换，实 现scale out 。 提问者1（0:36:33 ）：总结来说， OCS 可以降低信号阻塞，是吗？ 专家（0:36:44 ）：对，降低信号阻塞，并降低整体系统功耗。 OCS（无论是硅光还是 MEMS ）功耗远低于 CPO，只有CPO 的1/5到1/4。 提问者1（0:37:21 ）：明白，了解 NV的动机了。感谢。看线上有没有其他问题。 提问者2（0:37:31 ）：专家， OpenAI 在OCS 方案上有没有偏好（ MEMS 、液晶、硅光）？ 作为新参与者，他们的选择是什么？ 专家（0:37:50 ）：目前 OpenAI 使用最成熟的 MEMS 方案，采用类似谷歌的 3D MEMS 微镜 结构。后期更倾向于硅光方案，但技术未成熟，无法规模化使用。 提问者2（0:38:31 ）：ASIC 芯片量与 OCS 端口数量的配比关系？ 专家（0:38:41 ）：OpenAI 芯片架构是 64颗芯片，一个机柜对应一台 OCS 交换机。 提问者2（0:39:06 ）：机柜和 64端口OCS 交换机？ 专家（0:39:12 ）：对， 1:64，64端口。 提问者2（0:39:14 ）：明白，谢谢专家。 提问者1（0:39:19 ）：看线上还有没有其他问题？没有的话，会议结束，感谢大家。", "status": "extracted"}, "post:2026-09-07T08-59:0230ce3495aa": {"id": "post:2026-09-07T08-59:0230ce3495aa", "kind": "post", "title": "2026-09-07 08:59", "source_label": "帖子正文", "excerpt": "高盛台湾PCB/CCL行业研报详细总结 报告日期：2026年9月7日 核心主题：Compeq管理层交流验证光模块PCB高景气，维持行业正面观点，重申三家公司买入评级 一、Compeq（2313.TW，未覆盖）管理层访谈核心要点 1. 业绩指引大幅上调 - 2027年营收目标上调至1100-1200亿", "content": "高盛台湾PCB/CCL行业研报详细总结 报告日期：2026年9月7日 核心主题：Compeq管理层交流验证光模块PCB高景气，维持行业正面观点，重申三家公司买入评级 一、Compeq（2313.TW，未覆盖）管理层访谈核心要点 1. 业绩指引大幅上调 - 2027年营收目标上调至1100-1200亿新台币，以中值计算2025-2027年复合增速达23%，快于此前“2028年破千亿”的规划。 - 两大核心增长引擎： - 光模块PCB：2027年营收目标250亿+新台币（较2026年指引增长7倍以上），1.6T产品毛利率达40%+，远高于公司2Q26整体18.6%的毛利率。 - LEO低轨卫星相关PCB：2027年营收目标250亿+新台币（较2026年指引同比+30%+），高端卫星PCB占比提升。 2. 2026年业务进度 - 光模块业务：全年营收约30亿新台币（2025年贡献极少），800G产品3Q26起放量，约20亿营收将在4Q确认。 - LEO业务：全年营收约190亿新台币（2025年约150亿，同比+30%），地面终端PCB为主要驱动力，增速高于卫星端高端PCB。 3. 产能与资本开支 - 2026、2027年资本开支均超200亿新台币（2025年仅约70亿），50%投向光模块PCB产能，50%投向高端PCB（主要支撑LEO业务）。 - 光模块PCB产能目标：2027年底月营收达30亿新台币（2Q26月均不足1亿）；即便大幅扩产，2027年仍仅能满足60-70%的客户总需求。 - 核心LEO客户要求公司3-5年内PCB产能扩产5倍以上，驱动来自三方面： 1.下一代LEO卫星4Q26-1Q27起放量，单星PCB面积翻倍； 2.2H27起D2C卫星量产，PCB面积再增40-50%； 3.2H27起AI卫星部署，单星PCB价值与LEO相当，但年部署量达数万颗（2025年该客户仅发射3-4千颗LEO）。 4. 供应链与成本传导 - 材料端：低端CCL供给改善（E-glass瓶颈缓解），高端CCL无供给压力，核心供应商保障充足。 - 成本传导：几乎全产品线可向下游转嫁成本上涨，仅核心智能手机客户的SLP产品除外。 5. 数据中心PCB额外增长点 - 核心LEO客户的AI卫星高端PCB需求； - 核心手机客户的AI服务器PCB，4Q26起放量； - 国内客户的交换机、AI服务器PCB需求； - 小型ASIC客户的合作项目。 二、行业层面核心结论 1.1.6T光模块mSAP是当前核心瓶颈：年初至今价格上涨30%+，毛利率普遍40-45%，行业景气度极高。 2.市场规模高速扩容：1.6T+光模块mSAP市场规模将从2026年的0.8亿美元增至2028年的2.9亿美元，复合增速达94%。 3.CCL厂商同步受益：EMC、TUC等上游CCL企业将随光模块需求爆发实现份额提升，2027-2028年产能释放后业绩弹性显著。 三、三家覆盖公司投资要点（均维持买入评级） 1. 臻鼎科技（ZDT，shturl.）｜目标价：925新台币 - 行业地位：全球PCB龙头（市占率7-10%），中国市场ABF载板份额最高的厂商。 - 核心逻辑： - 中国ABF载板市占率2027年将超40%（2024年31%），受益于国内AI算力芯片国产化趋势； - mSAP产能未来两年扩5倍，2027/28年占营收比例提升至8%/10%+，毛利率40-45%，成为核心增长与盈利引擎； - 折叠屏手机渗透提升长期驱动FPC业务，2027年FPC占总营收50%。 - 估值方法：SOTP分部估值法，ABF/BT载板3.5x 2028E P/B，AI服务器/交换机PCB 20x 2028E P/E，消费电子PCB 8x 2028E P/E。 - 核心风险：iPhone需求不及预期、载板产能良率爬坡慢、ABF市场竞争加剧。 2. 台光电子（EMC，shturl.）｜目标价：10200新台币 - 行业地位：高端HDI材料（市占70%+）、SLP材料（市占90%+）龙头，AI服务器CCL核心供应商。 - 核心逻辑： - 服务器CCL份额从Purley世代\u003c10%提升至Whitley/Eagle Stream平台的15-20%+，覆盖英伟达、谷歌、AWS全头部AI客户； - 交换机CCL市占率达40%，AI客户矩阵持续拓展。 - 估值方法：27x 2H27-1H28E P/E，对标AI组件供应商历史估值峰值。 - 核心风险：RCC材料替代高端手机HDI、贸易摩擦、大陆厂商竞争。 3. 台燿科技（TUC，6274.TWO）｜目标价：3010新台币 - 行业地位：全球高端M7+高速CCL核心厂商，近2年市占率20%+。 - 核心逻辑： - 服务器CCL份额从Whitley/Purley的15%向Eagle Stream世代持续提升； - 400G/800G交换机放量是核心需求驱动，推出T2A/T2C高低端两款产品抢占市场； - 与CSP及企业端客户合作高端AI项目，长期增长动能充足。 - 估值方法：22x 2027E P/E，较过去3年行业均值高2个标准差。 - 核心风险：低损耗CCL份额提升不及预期、贸易摩擦、大陆厂商竞争。 四、其他重要信息 1.评级与利益披露： - 高盛全球股票覆盖中，买入/持有/卖出占比为50%/34%/16%； - 高盛持有Compeq、TUC 1%以上股权；预期未来3个月从EMC、ZDT获取投行服务费；过去12个月与ZDT有投行业务合作。 2.统一判断：光模块PCB/CCL赛道量价齐升逻辑明确，叠加AI服务器、低轨卫星两大需求共振，行业高景气度具备持续性，优先布局具备技术与产能先发优势的龙头。#文字观点", "publish_time": "2026-09-07 08:59", "tags": ["文字观点"]}, "post:2026-09-07T09-31:42ff52dbbc5c": {"id": "post:2026-09-07T09-31:42ff52dbbc5c", "kind": "post", "title": "2026-09-07 09:31", "source_label": "帖子正文", "excerpt": "GPT-6增强信心，叠加周五费半+3.4%，A股硬件需要一场“大洋彼岸的回应”。7-8月AI叙事反复拉扯，消化筹码、也是消化预期。", "content": "GPT-6增强信心，叠加周五费半+3.4%，A股硬件需要一场“大洋彼岸的回应”。7-8月AI叙事反复拉扯，消化筹码、也是消化预期。我们继续跟踪变化-AI 新材料更新 0906 （1）近期PTFE仍是最热点，预计9月底、10月是第一个验证节点。短期无法证伪、是ultra各类方案中最有冠军相的，但是纯PTFE很难应用、主要是搭配M 系列使用。 （2）4场法说会梳理（联茂、臻鼎、广达、华通） 一、联茂（CCL） ①#26Q2的CCL涨价30%，主力是M4等中低产品，因E-glass电子布最缺。认为下半年电子布涨价趋势明确、高阶铜箔需求越来越好（下半年还要调价1-2次，最近9月铜箔涨价2-3k）。 ②认为28年之前、CCL原材料确定性旺盛、供给相对不足，#电子布具备持续调价的市场基础。③M6及以下用E-Glass，M7及以上采用LowDK1、LowDK2以及Q布。目前E-Glass供给最缺。 ④CCL产品结构高端化，M4及以下营收占比70%，M6及以上占比30%。27年传统服务器产品将从M6全面升级至M7。 ⑤通用服务器产品，原计划Q3放量、受制于IC封装、测试环节供给短缺，推迟到年底/年初，M6向M7切。 ⑥联茂的CCL、1-3季度产能利用率70%、都赖缺电子布，如果布充足、Q4有望上到80%。 ⑦M9：逐步起量，25H2就通过了验证，预计27H1开始小幅放量。 ⑧产品价格：以M6单价为1基准，M4单价约0.8；M7单价为1.3-1.5；M8最低2-3倍；M9目前未放量，无定价。 二、臻鼎 ①#判断AI需求将从服务器、光模块进一步延伸至AI集成型机器人等终端应用。 ②1.6T光模块良率达90%以上，业内最高。 ③仅供应光模块所用的电路板，不属于禁令限制范畴，认为PCB产业链生态特殊、涉及环保要求，产能转移难度高。 ④#上游T-Glass（t布）仍存在短期短缺，同时推进第二供应来源验证。 ⑤玻璃基板取代玻璃布仍处于技术验证阶段，短期能否调节供需平衡尚未可知。 ⑥部分高阶订单通过专案付款锁定订单能见度，可有效控制重复下单的风险。 三、金像电子（PCB） ①26Q2收入占比：服务器78%、网通15%、笔记本电脑5%、其他2% ②#预计26Q3服务器业务将持续向好，网通业务环比改善，笔电持平。 四、华通 ①光模块业务：已获1-2家实际订单，26Q4单月产能接近10亿元，27Q4单月产能预计扩充上年同期的3倍； ②#缺布：目前客户正积极验证大陆玻布，大陆玻布供给相对充足，缺料状况从26Q4开始会环比缓解。 ③预计未来3-5年PCB产业将处于高速成长阶段。 五、广达 ①AI的ASP环比持平、增长主要靠量。 ②26Q3开始部分订单由买卖模式调整为客户供料的寄售模式，缓解资金需求。 ③#判断下半年笔电旺季不旺，Q3出货环比减20%，全年同比降双位数。主因提前备货、需求抑制。 ------ （一马平川）#文字观点", "publish_time": "2026-09-07 09:31", "tags": ["电子布具备持续调价的市场基础", "文字观点"]}, "post:2026-09-07T14-15:ca3e2c136e1a": {"id": "post:2026-09-07T14-15:ca3e2c136e1a", "kind": "post", "title": "2026-09-07 14:15", "source_label": "帖子正文", "excerpt": "【中信电子】AI PCB量价双增逻辑持续，载板/msap释放高弹性，持续推荐 1）短期业绩动能强劲：AI PCB领域，H2以来Rubin/Trainium 3已开始大规模拉货（台光H2 AI CCL出货预计环增40%、智邦指引Q3收入环比增长32%），TPU v8拉货则有望于Q4启动，同时PCB端良", "content": "【中信电子】AI PCB量价双增逻辑持续，载板/msap释放高弹性，持续推荐 1）短期业绩动能强劲：AI PCB领域，H2以来Rubin/Trainium 3已开始大规模拉货（台光H2 AI CCL出货预计环增40%、智邦指引Q3收入环比增长32%），TPU v8拉货则有望于Q4启动，同时PCB端良率和产能稳步推进，业绩增长斜率有望提升；传统PCB领域，具备拿料能力的厂商6-8月集中提价20%+，涨价节奏提升，26Q3起盈利能力有望大幅改善。#我们看好26Q3/4头部PCB公司的业绩增长动能。 2）中长期供需紧张延续，PCB业绩高增能见度提升：需求端持续上修，英伟达Rubin ultra PCB方案逐步清晰，ASP预计较Rubin继续提升50%+，M9/超高多层设计渗透率将进一步提升，同时PTFE+热固材料混压方案进展顺利，有望率先在SwitchTray落地，后续正交背板存在超预期机会；谷歌TPU、AWS等出货量亦在持续上修，v9/T4 PCB升级持续，同时国产算力也在迎来加速放量期；供给侧仍偏紧，当前核心钻机、曝光机、电镀等设备交期持续拉长，新接订单已排至2年后，短期产能上修空间有限。#我们认为中期维度供给产能强约束将延续，PCB高增能见度持续提升。 3）载板景气周期进一步拉长，全球载板供不应求和涨价趋势明确，日韩台产能均以长协落单，设备扩产周期长，交期已经看到29年，#国产BT载板随产能释放加速释放利润，#ABF载板良率和产能蓄势待发，26H2有望迎来全面起量。 4）高端光模块/msap PCB紧缺延续，量价双增驱动27年msap PCB需求有望激增至300亿+，我们通过梳理各家实际扩产进度及设备交付情况，#判断27年msap行业仍将维持供需紧张状态，相关公司业绩有望高斜率释放。 投资结论：Q3/短期业绩强势+中长期增长能见度提升，PCB交易面/基本面有望持续走强，我看好27年行业估值水平向25-30x提升，建议重点关注：H2拉货、ASIC、载板、msap、PTFE等受益方向，重点推荐：沪电股份、深南电路、生益科技、兴森科技#其他公司变化情况欢迎联系交流欢迎联系 中信电子#文字观点", "publish_time": "2026-09-07 14:15", "tags": ["其他公司变化情况欢迎联系交流", "文字观点"]}, "attachment:files/科翔股份纪要0906：陶瓷混压PCB先行者，卡位北美客户格局优——浙商先进制造战队.pdf": {"id": "attachment:files/科翔股份纪要0906：陶瓷混压PCB先行者，卡位北美客户格局优——浙商先进制造战队.pdf", "kind": "attachment", "title": "科翔股份纪要0906：陶瓷混压PCB先行者，卡位北美客户格局优——浙商先进制造战队", "source_label": "其他", "excerpt": "1.陶瓷混压PCB需求背景与技术优势 芯片热功耗提升驱动散热需求：随着AI芯片性能持续提升，芯片热功耗大 幅增长。以英伟达为例，H100芯片的TDP为700瓦，而下一代Rubin 架构预计将提升至2,300瓦，后续芯片功率会更高，散热需求极为紧迫。", "content": "1.陶瓷混压PCB需求背景与技术优势 芯片热功耗提升驱动散热需求：随着AI芯片性能持续提升，芯片热功耗大 幅增长。以英伟达为例，H100芯片的TDP为700瓦，而下一代Rubin 架构预计将提升至2,300瓦，后续芯片功率会更高，散热需求极为紧迫。 传统PCB面临板翘曲问题：当芯片功耗较大时，传统PCB因材料导热能力不足， 容易出现受热不均导致的爆板和板翘曲问题，对PCB板产生致命影响。 陶瓷板解决方案的两大优势： o导热能力强：以氮化铝陶瓷板为例，其导热率在120-180W/m·K， 远高于M8等级的传统PCB材料。 o热膨胀系数与芯片匹配：陶瓷板的热膨胀系数与芯片相对一致，有利 于从根本上解决PCB板的翘曲问题。 2.科翔股份核心壁垒与竞争格局 五重壁垒构筑稀缺性：公司能够率先实现陶瓷混压PCB突破，源于多重能 力的综合壁垒，包括： o陶瓷板配方与材料制备：旗下广州陶瓷电分公司成立于2017年，在 陶瓷板领域有近十年积累，执行董事徐总为资深专家。 o先进封装及：需要结合先进半导体封装工艺 oHDI制造能力：高阶HDIPCB的制造能力。 o激光打孔等配套工艺：陶瓷材质硬且脆，打孔等环节需要激光打孔等 特殊工艺配合。 o客户关系与联合研发：与北美大客户联合研发以及后续AI服务器领 域保持紧密合作，是产品突破的关键。 竞争格局极佳： o当前唯一供应商：目前能够做出陶瓷混压PCB产品的基本只有科翔 股份一家，稀缺性极强。 o先发优势显著：陶瓷混压PCB属于全新产品，高度依赖与客户的联 合研发和长时间迭代。后来竞争者即使有意进入，也面临较长的研发 与客户导入时间差距，难以在短期内追平科翔的先发优势。 3.市场空间测算 北美大客户需求可观：以英伟达为例，若其后续年出货的千万块以上GPU 全部采用陶瓷混压PCB，对应市场空间测算约50多亿美元。 长期空间有望进一步打开：若未来海外其他AI算力厂商及国内算力芯片制 造商也采用该产品，整体市场空间将大幅提升。 4.主业拐点与业绩展望 2026年三季度盈利拐点：公司主业呈现拐点向上态势。2026年上半年公 司亏损6,000多万元，但判断2026年三季度单季度盈利概率较大，且不 排除2026年前三季度累计业绩转正的可能性。 四季度盈利有望扩大：若前三季度实现扭亏，预计2026年四季度盈利将进 一步扩大。 5.投资逻辑与后续催化 核心投资逻辑：科翔股份所处的陶瓷混压PCB赛道需求空间大且确定性强， 同时公司凭借多重壁垒构建了极佳的竞争格局，具备强稀缺性。 订单与产能扩张预期：期待公司在北美客户订单方面取得突破。订单落地后， 预计将伴随产能的大幅扩张，可通过公司在广东、江西等地的产能投入及激 光设备采购等动作进行验证，并逐步在报表端兑现业绩。", "status": "extracted"}, "post:2026-09-07T07-49:b87345436841": {"id": "post:2026-09-07T07-49:b87345436841", "kind": "post", "title": "2026-09-07 07:49", "source_label": "帖子正文", "excerpt": "铜箔板块更新0906：保供性扩产印证紧缺，长期聚焦结构性拓量 1、宁德时代官方微信公众号披露，近日与泰金新能、深圳惠科等正式签署战略合作协议，围绕铜箔装备集采、产能共建、成本定价、联合研发及绿电共用建立长期战略合作。其中，将与深圳惠科等2家合作方在未来 3 年共同新建 40 万吨铜箔产能，确立新建产", "content": "铜箔板块更新0906：保供性扩产印证紧缺，长期聚焦结构性拓量 1、宁德时代官方微信公众号披露，近日与泰金新能、深圳惠科等正式签署战略合作协议，围绕铜箔装备集采、产能共建、成本定价、联合研发及绿电共用建立长期战略合作。其中，将与深圳惠科等2家合作方在未来 3 年共同新建 40 万吨铜箔产能，确立新建产能长期供货量与加工费锁定机制，并通过预付款与账期优化给予资金赋能。 2、#短期：协议反证铜箔紧缺、宁德策略仍以保供优先、27年难以形成有效供给。近期存量铜箔供应商的涨价谈判进展并不顺利，宁德的扩产动作主要保供，并打压涨价情绪。考虑到，1）铜箔系重资产投资行业（单万吨投资额4-5e），龙头嘉元时点ROE仅4.6%，远低于宁德的电池环节，叠加高营运压力，印证本次扩张以保供为主；2）设备供给刚性，泰金订单饱满，战略合作协议下仍需1-2年的扩产周期；3）新增产能大多以超薄高强高延铜箔为主，惠科等公司的多规格稳定供货能力仍待观察。 3、#中长期：供需格局仍将维持紧平衡、聚焦HVLP&超薄箔的结构改善。需求端，未来三年复合增速约20%的置信度仍高，年化新增铜箔需求在30万吨+；供给端，锂电铜箔行业扩产相对谨慎，增量资金倾向高附加值的高端电子箔，有效产能扩张在15-20万吨左右。宁德3年40万吨折合年均约13万吨，铜箔供需紧平衡预计仍将持续。此外，按照宁德扩产系保供逻辑推演，有望进一步积压潜在的尾部产能扩张预期，行业中长期加工费锚定在合理盈利水平，基本告别亏损定价。后续重点聚焦在个股的结构性改善（HVLP铜箔、载体铜箔、固态无负极等）。 4、#配置主线：HVLP>设备端>锂电铜箔#AI期权驱动：铜冠（确定性）、德福（量弹性）、方邦（载体铜箔），锂电箔涨价预期定价不多，预计扩产影响有限；#设备：泰金新能（装备集采+订单增长）#锂电：短期情绪扰动提供买点，个股基本在27年10-12X左右，关注诺德、 中一、海亮、 嘉元的业务延伸和结构变化。#文字观点", "publish_time": "2026-09-07 07:49", "tags": ["配置主线", "HVLP_设备端_锂电铜箔", "AI期权驱动", "设备", "锂电", "文字观点"]}, "post:2026-09-07T09-04:8bf3d3d405b6": {"id": "post:2026-09-07T09-04:8bf3d3d405b6", "kind": "post", "title": "2026-09-07 09:04", "source_label": "帖子正文", "excerpt": "【华源大能源】35周周观点：超节点带动高速连接器机遇 关注钠电产业链机遇 ⭕️AI算力迈向超节点，高密度集成与高速互联推动高速连接器需求增长。高速连接器高端市场仍由安费诺、泰科等海外厂商主导，国内企业加速推进技术研发和客户认证。", "content": "【华源大能源】35周周观点：超节点带动高速连接器机遇 关注钠电产业链机遇 ⭕️AI算力迈向超节点，高密度集成与高速互联推动高速连接器需求增长。 高速连接器高端市场仍由安费诺、泰科等海外厂商主导，国内企业加速推进技术研发和客户认证。胜蓝股份持续布局AI服务器、交换机和存储设备连接器，相关产品已通过 AMD、浪潮、联想等客户验证并实现量产交付。建议关注：#胜蓝股份、华丰科技等。⭕️钠电出海加速，关注钠电产业链 （1）中科海钠与韩国VOLTA株式会社正式签署战略合作协议，在此前15MWh储能项目基础上，双方推动5年10GWh长期供货协议的落地。（2）随着全球储能建设放量及钠电技术和应用体系日渐成熟，钠电需求有望规模化落地。重点关注钠离子电池、铝箔、负极企业，建议关注#维科技术、万顺新材、鼎胜新材、贝特瑞、圣泉集团。#文字观点", "publish_time": "2026-09-07 09:04", "tags": ["胜蓝股份、华丰科技等", "文字观点"]}, "post:2026-09-07T13-10:9b1fdccc1518": {"id": "post:2026-09-07T13-10:9b1fdccc1518", "kind": "post", "title": "2026-09-07 13:10", "source_label": "帖子正文", "excerpt": "事件：GPT‑6 长任务能力落地，Computer Use 模式带来算力结构变化，token 消耗大幅抬升。行业反馈，AI 不再单纯依赖 GPU 推理，模型化身调度 + 执行主体，通过代码执行操控浏览器、桌面环境，大量负载转移至 CPU、沙箱、I/O 环节，CPU 成为 AI 智能体时代新的紧缺环节", "content": "事件：GPT‑6 长任务能力落地，Computer Use 模式带来算力结构变化，token 消耗大幅抬升。行业反馈，AI 不再单纯依赖 GPU 推理，模型化身调度 + 执行主体，通过代码执行操控浏览器、桌面环境，大量负载转移至 CPU、沙箱、I/O 环节，CPU 成为 AI 智能体时代新的紧缺环节，AI 算力硬件迎来结构性增量机会。 重点关注：禾盛新材、龙芯中科、综艺股份、中国长城禾盛新材：参股熠知电子，布局 AI 服务器 CPU+NPU 芯片，旗下海曦技术打造 AI 一体机，适配 AI Agent 调度、代码执行、沙箱运算场景，充分受益 AI 长任务带来 CPU 算力扩容需求。龙芯中科：国产通用 CPU 龙头，自主指令集生态完善，AI 智能体任务中任务编排、调度、I/O 处理高度依赖 CPU 算力，公司产品适配 AI 服务器、智算场景，迎来需求拐点。综艺股份：参股神州龙芯，手握国产工业级 CPU 产品，同时布局算力租赁业务，适配 AI 执行类任务算力供给，充分享受国产 CPU 算力增量红利。中国长城：PKS 体系核心整机平台，依托飞腾 CPU 打造 AI 服务器、训推一体机，内核级沙箱、任务调度、IO 交互能力突出，完美匹配 Computer‑Use 模式下 CPU 侧算力扩容需求，国产算力底座核心标的。#文字观点", "publish_time": "2026-09-07 13:10", "tags": ["文字观点"]}, "attachment:files/【盘中宝】新材料领域中核心赛道，AI算力+机器人+新能源车三驾马车拉动需求，这家公司产品应用多个高端领域.pdf": {"id": "attachment:files/【盘中宝】新材料领域中核心赛道，AI算力+机器人+新能源车三驾马车拉动需求，这家公司产品应用多个高端领域.pdf", "kind": "attachment", "title": "【盘中宝】新材料领域中核心赛道，AI算力+机器人+新能源车三驾马车拉动需求，这家公司产品应用多个高端领域", "source_label": "其他", "excerpt": "ACECAMPTECH 文章原文 第 1 页ACECAMPTECH · 文章原文 北美大模型行业调研：SOTA模型竞争格局变化，Gemini 相比Claude、GPT掉队原因及后续追赶可能性，后续Gem ini Flash及Pro版本模型能力预期 发布时间：2026/09/06 08:10:09 以下为专家观点： 1，如何看待当前北美SOTA模型的竞争格局？", "content": "ACECAMPTECH 文章原文 第 1 页ACECAMPTECH · 文章原文 北美大模型行业调研：SOTA模型竞争格局变化，Gemini 相比Claude、GPT掉队原因及后续追赶可能性，后续Gem ini Flash及Pro版本模型能力预期 发布时间：2026/09/06 08:10:09 以下为专家观点： 1，如何看待当前北美SOTA模型的竞争格局？ 当前，参数量巨大的SOTA模型（例如5T或更高参数级别）之间的性能差距正变得越来越小。这主要是由几个 因素共同导致的：首先，在模型架构层面，各家方案趋同，并未出现能够带来根本性性能提升的重大创新，现 有的一些创新更多是聚焦于提升性价比，而非直接增强模型的智能水平；其次，在训练方法上，虽然存在一些 差异，但并非决定性因素。目前行业内普遍认可并采用相似的技术路径，例如通过循环和验证器等方式来延长 任务处理链路。 由于架构和训练方法的趋同，各家模型的性能表现也日趋一致。尽管业界普遍认为训练更大规模的模型可能会 涌现出意想不到的能力，但实践中面临严峻挑战，当前超大规模模型很难得到充分训练。例如，要训练一个5T 到10T参数的模型，即便采用GB300这样的高性能计算集群，并满足最低的20倍参数量的token训练要求，也 需要至少两到三个月的时间。在实际研发过程中，为了调试和优化，通常需要训练10到20个候选模型来探索不 同的参数配比、架构层数以及Dense/Sparse Attention等参数组合，这意味着对算力的需求会成倍增加。 然而，目前没有任何一家公司拥有足够充裕且能支持如此大规模并行训练的算力资源。因此，无论是模型架构 的探索，还是单个模型的训练程度，都远未达到理想状态。这直接导致了当前SOTA模型性能水平非常接近的 局面。 2，如何理解大模型难以被充分训练的问题？具体哪些方面没有被充分训练？ 难以充分训练体现在两个方面： 一方面，从训练token与参数量的倍数来看，许多小模型已经训练到了接近200倍的水平，而理论上大模型因 其更复杂的内部组合，需要更高倍数的训练才能收敛。但现实是，即便是满足20倍这一最低限度的训练要求， 使用约10万张GB300显卡训练一个大模型也需要两到三个月。如果考虑到需要训练5个不同的变体以进行模型 结构探索，所需的算力规模将是巨大的，通常企业难以承担。 另一方面，这种算力限制导致了模型架构的探索不充分，并且每一款发布的大模型，其训练程度都远未达到小 模型那样的饱和水平。其结果是，新发布的模型相较于前代版本的性能提升有限。例如，Anthropic发布的新 模型在Artificial Analysis榜单上的得分仅比上一代高出约3分，这种幅度的提升并未给市场带来显著的体感差 异。 ACECAMPTECH 文章原文 第 2 页 3，从中短期来看，提升模型性能的主要路径是否是在现有参数体量的基础上增加训练时长？ 理论上增加训练时长是主要路径，但在实践中存在矛盾。当前市场竞争日益激烈，领导层很难给予团队充足的 时间去训练众多模型变体。现实情况是，几乎所有5T以上参数的模型都未能得到充分训练。 此外，当前良好的市场行情也加剧了算力资源的紧张。例如，在DeepMind，周一至周四需要将大量算力资源 调配给GCP用于商业化服务，只有在周末才能收回更多算力用于内部训练。这种情况在行业内是普遍现象，因 为周末算力成本较低，Anthropic和Google等公司会利用这个时间窗口进行训练。在算力卡和电力供应双重短 缺的背景下，很难有公司能拥有大量富余算力来支持对SOTA模型的充分训练。 因此，除非出现类似今年（2026年）年初的循环模型（loop model）或Harness这类颠覆性的新范式，否则 在现有技术路径下，SOTA模型之间的性能差距很难被拉开。目前尚未观察到任何可能带来重大突破的新技术 发明。 4，业界如何看待近期推出的Gemini 3.8 Flash，以及它对Looping Model或模型自训练等 递归自提升方法可能带来的影响和未来预期？ 递归自提升是一个较为宽泛的概念，目前在模型训练中已广泛应用各类模型自我训练的方法。传统的优化器采 用的是固定的、通用性较好的策略，例如利用一阶或二阶动量，但并未针对特定训练任务进行深度优化。而自 训练方法则通过模型自身学习来优化整个训练过程，旨在让模型收敛得更快，从而提升训练效率。当前，递归 自提升的应用基本集中在类似这样的领域。 5，采用Looping Model或模型自训练这类方法，是否意味着模型能力更强的参与者训练出 的模型会更强大？ 这并非绝对。许多中国的开源模型也具备了实施这类方法的能力，通常在MMLU基准测试上得分达到57至58 分以上的模型，都可以胜任。当前阶段的递归自提升并非全自动化过程，核心思想仍由研究员提出，而非模型 自主产生。模型的作用在于执行，研究员提出想法后，具体实现过程是一个“黑盒”，需要模型通过类似 AlphaFold的函数搜索（function search）方法，去寻找各种可能的公式组合，以使优化器收敛得更快。 Transformer架构非常擅长处理这类黑盒拟合任务。因此，现阶段的递归自提升仍然需要人类研究员提出创新 想法，对模型本身的智能水平要求并未达到极高的程度。 6，近期头部模型如OpenAI和Anthropic似乎处于交替领先状态，而Google自2026年以来 似乎有所掉队，如何评估Google模型当前在SOTA领域的竞争力，以及对未来4.0版本的预期 ，它能否重返第一梯队？ Google重返第一梯队存在难度。主要劣势体现在数据层面，具体有以下几点： 第一，Google是目前已知唯一一家在预训练或后训练阶段不使用C端（消费者）用户数据的公司。当前模型训 练，尤其是为了实现类似“Looping”的精细化推理，需要大量的轨迹数据。这类数据要求模型能够进行小步 推理、反思、回溯并决策，而这种复杂的交互过程很难通过合成数据有效生成，因为合成各类工具的真实交互 非常困难。同时，网络上公开的人类解题或调试思路，通常是直接给出分析结果，缺乏这种逐步迭代的循环过 程。因此，无法使用C端数据进行预训练，使Google在模型底座的构建上处于不利地位，而预训练效果很大程 度上固化了模型的权重，后续训练难以弥补这一差距。 ACECAMPTECH 文章原文 第 3 页 第二，Google的合规要求非常严格，禁止蒸馏任何竞争对手的模型，无论是通过调用API还是在本地部署模型 （如Kimi K3或DeepSeek）进行“偷偷蒸馏”都不被允许。 第三，许多公司会购买竞争对手模型的轨迹数据，用于行为克隆（Behavior Cloning）的强化学习训练，以实 现模型的快速冷启动。Google虽然不缺资金，但目前未能找到合规的方式购买此类数据，因为市面上的轨迹 数据大多从各种路由器上获取，通常未获得用户授权，这是Google无法接受的。 为应对这些数据劣势，Google主要采取两种策略：一是使用员工数据进行预训练；二是在模型能力相对较弱 的初期，雇佣专家录制高质量的专家轨迹，例如通过招聘专家完成类似Terminal Bench中的任务，以此进行 模型冷启动。尽管如此，在模型架构差异不大的行业背景下，数据是决定性因素，Google在数据上的劣势目 前仍未看到有效的解决方案。 对比来看，OpenAI和Anthropic虽然对自身要求也很高，但他们会使用C端数据进行预训练。各家公司对合规 的标准不尽相同。值得注意的是，OpenAI和Anthropic在2026年上半年修改了用户协议，取消了数据保留期 限，这意味着对于付费的C端用户，如果其数据被认为有价值，平台可以永久保留而不删除。这是Google目前 不愿采取的做法。 7，与OpenAI、Anthropic等竞争对手相比，谷歌在模型训练中不使用C端数据，是否是出 于更严格的内部合规要求？具体是指哪类C端交互数据？ 是的，谷歌在C端数据使用上的限制源于其比竞争对手更严格的用户条款。与OpenAI、Anthropic等公司通过 修改用户条款来合规使用C端数据不同，谷歌领导层选择不修改现有条款。这主要是出于对品牌形象的保护， 担心修改条款会引发用户在YouTube、Search、Gmail等核心产品上的隐私敏感和联想，从而对公司整体形象 造成负面影响。因此，尽管竞争对手使用C端数据并不违规，但谷歌因其更高标准的用户条款而无法使用。 这类数据主要是指用户与AI的交互数据，这些数据是极具价值的反馈信号。例如，当用户让AI编写一个小游戏 时，过程中可能会产生大量交互，包括指出代码错误、要求将非玩家角色替换为特定形象（如牛头怪）的Boss ，以及对生成内容进行点赞或点踩等操作。这些交互数据目前完全不能用于模型训练。 8，无法使用C端数据是否会持续成为谷歌训练SOTA模型的一项限制？ 是的，这确实是一项限制，并且目前没有计划更改相关的用户条款。谷歌公司内部，包括法务和高层管理人员 ，普遍认为修改条款可能引发用户对隐私问题的过度敏感，进而影响到YouTube、Search、Gmail等核心业务 ，对公司整体形象构成风险。因此，当前策略是利用谷歌在纯技术方面的优势以及内部员工数据来弥补这一差 距。在小模型领域，例如各种Flash版本，通过这种方式已经取得了较快的追赶速度。 9，从当前时间点看，C端数据对SOTA模型训练的影响是会逐渐增大还是减小？ 在Gemini 3.6版本之前，C端数据缺失的影响较大，因为当时缺乏有效利用这类数据的方法。然而，现在情况 已有所改变。例如，Gemini 3.7 Flash的评分仅比OAI 4.8低1分，而3.8 Flash与OAI SOTA模型的差距也仅为 2分。这表明，通过使用规模小一个数量级的模型，谷歌已经能够实现有效的自我生成和迭代。当模型的绝对 智能水平达到一定阈值后，它便可以更好地进行自我优化，从而部分解决了C端数据缺失的问题。 尽管如此，问题并未完全解决，尤其是在技术广度方面。谷歌内部的技术栈相对固定，例如编程语言、数据库 和前端框架都有统一规范。这种内部环境的同质性限制了模型接触多样化编程实践的广度。一个显著的例子是 ，在Artificial Analysis排行榜上，谷歌是唯一一家不使用自家评测工具Antigravity，而是采用外部的 ACECAMPTECH 文章原文 第 4 页 OpenCode进行模型跑分的公司。这是因为Antigravity自身存在许多因无法访问用户数据而难以修复的bug。 10，所以AI Overviews及AI Mode产生的数据是否完全不能用于Gemini模型的训练？ 是的，相应AI模型产生的用户数据本身不能用于训练，这与对Coding数据的处理方式一致。不过，法务部门 允许使用这些数据的元数据进行训练。元数据在特定场景下，尤其是在处理C端应用时非常有用。通过对元数 据进行聚类分析，可以发现用户的共同兴趣点，比如发现讨论鹦鹉的用户群体可能就属于稀有宠物类别，从而 进行针对性优化。 11，元数据和数据在模型训练中的具体差异和应用？ 以一个用户编写Python游戏程序的场景为例，该用户产出的设计文档、UI/UX设计稿以及源代码本身，这些都 属于“数据”。同时，用户与AI Agent的交互过程、每一步的反馈以及Agent的各种循环也同样被归类为“数 据”。 相对而言，元数据包含的信息则非常有限，它可能只记录了诸如“游戏”、“Python”、“三次点赞”、“ 五次点踩”这类维度层面的信息，而不包含具体的交互内容或源代码。对于C端应用，仅使用元数据进行分析 ，例如了解用户对鹦鹉脱毛问题的关注，并据此生成或购买相关的QA数据，是可行的，因为这不触及用户聊 天的具体内容。然而，对于代码生成这类场景，如果只被允许使用元数据，模型训练将受到极大限制。 12，谷歌公司在算力分配上似乎更优先满足商业化和外部合作方（如Anthropic），这种策 略是否对内部核心模型的训练节奏和算力使用产生了影响？ 这种算力分配策略对探索性项目（explore ideas）会产生影响，但对于最核心的Gemini系列模型的训练，目 前没有实质性的影响。受影响的主要是其他优先级稍低的项目，例如机器人、文生视频、Gemini在特定垂直 领域（如医疗健康领域）的应用等。Gemini系列本身，无论是Flash、Nano、Pro还是新的Gemini 4，其训练 进程都未受到实质性干扰。 13，2026年以来Gemini团队出现的人才流失，特别是Jeff Dean的离开，是否会对后续模型 的迭代（例如下一代模型）产生影响？ Jeff Dean从Gemini 2.0版本开始便不再负责具体的Gemini模型工作，这一点可以从模型论文的作者署名顺序 中得到印证，他的署名只到1.5版本。因此，Jeff Dean的离开对模型研发本身目前没有直接影响。他在离开 Google前的工作重心已转向硬件方面，他领导了GCP以及DeepMind的许多硬件团队，推动了诸多硬件合作 ，例如TPU v8和v9的新拓扑结构设计，并主导了与Marvell的合作。因此，他的离开对硬件方面有影响，但对 模型层面则没有。 14，关于Gemini模型系列，目前发布的Flash版本表现如何？对于Pro版本，市场应抱持怎 样的预期，或者说达到何种标准才有可能发布？ 首先需要明确具体指代哪个Pro版本。目前正在训练的是Gemini 4的Pro版本，预计将在11月中旬发布，因此 现阶段其性能尚无法评估。至于已经存在的Gemini 3.5 Pro，在Artificial Analysis排行榜上的得分约为60分。 由于Gemini 3.5 Pro与竞品相比没有显著优势，发布它的意义不大，因此已被撤回。通常，新模型需要比现有 模型高出4到5分，至少要达到或超过Opus 5的水平才具备发布的价值，但目前谷歌手中没有达到这个标准的 模型。 ACECAMPTECH 文章原文 第 5 页15，基于当前情况，是否意味着中短期内不会看到新的Pro模型发布，需要等到今年10月或 11月？ 是的，除非出现重大的技术突破。目前Gemini 3.9 Flash版本已经存在，但如果其性能无法超过Opus 5，那么 它也只是一个与Opus 5同等水平的模型。因此，更有意义的Pro版本更新可能确实需要等到10月至11月的时 间窗口。", "status": "extracted"}, "post:2026-09-07T07-55:112c5cf4bd45": {"id": "post:2026-09-07T07-55:112c5cf4bd45", "kind": "post", "title": "2026-09-07 07:55", "source_label": "帖子正文", "excerpt": "【半导体设备】华为\"韬定律”再更新，持续看好先进封测设备需求【东吴机械】 2026年9月4日华为何庭波再次更新韬定律论文，披露麒麟2026逻辑折叠更多实测数据，#其晶体管密度较上一代提升55%、等性能下NPU、GPU、CPU性能核功耗分别下降66%、58%、41%，叠加9月23日华为mate90有望", "content": "【半导体设备】华为\"韬定律”再更新，持续看好先进封测设备需求【东吴机械】 2026年9月4日华为何庭波再次更新韬定律论文，披露麒麟2026逻辑折叠更多实测数据，#其晶体管密度较上一代提升55%、等性能下NPU、GPU、CPU性能核功耗分别下降66%、58%、41%，叠加9月23日华为mate90有望发布收首款韬定律的麒麟芯片，建议重点关注先进封测设备。 1、华为将发布新的麒麟手机芯片，完整采用逻辑折叠技术，大幅提升相关性能：何庭波在论文中给指出现代芯片的大量能耗并非来自晶体管本身的计算，而是来自数据和信号在芯片内部的移动。#LogicFolding将原本在平面上延伸的长距离走线、折叠为上下层之间的短距离垂直连接、从而显著缩短信号传输路径、降低互连电容和能耗。#麒麟2026采用1.5μm混合键合间距，拥有约5000万个垂直互连，其中10%-15%用于信号传输。论文进一步透露，麒麟2027实测硅片已经将混合键合间距缩小至1μm，垂直互连数量超过1亿个；未来三年还计划进一步缩小至720nm，并实现超过2亿个垂直互连。 2、先进封装技术快速发展，带来封测设备新需求：（1）测试机：SoC芯片设计和制造的复杂性大幅增加，同时先进存储芯片为AI算力芯片提供高带宽的数据存储和传输支持、其容量和带宽的不断提升也进一步增加了芯片的复杂性，对高性能测试机需求显著增长；（2）封装设备：AI芯片主要采用HBM、CoWoS等2.5D、3D封装，涉及TSV刻蚀设备、薄膜沉积设备等前道图形化设备、同时对减薄机要求提升、还新增了混合键合等新电气互联方式。 3、投资建议：（1）测试设备：关注AI芯片带来的国产SoC测试机突破，相关标的长川科技、华峰测控、联动科技等；（2）封装设备：相关标的为北方华创（TSV刻蚀）、中微公司（TSV刻蚀）、拓荆科技（薄膜沉积+键合）、芯源微（涂胶显影+键合机）、华海清科（减薄机）、盛美上海（电镀机）、光力科技（划片机）、晶盛机电（减薄机）、迈为股份（磨划+键合）等。 东吴机械：周尔双/李文意/谈沂鑫/柴悦茹#文字观点", "publish_time": "2026-09-07 07:55", "tags": ["文字观点"]}, "post:2026-09-07T14-15:14be34cdfe1f": {"id": "post:2026-09-07T14-15:14be34cdfe1f", "kind": "post", "title": "2026-09-07 14:15", "source_label": "帖子正文", "excerpt": "再次强调三个月前我们对无源光器件的判断：重视NPO/CPO时代无源光器件的价值通胀，最新fau产业报告欢迎探讨 1⃣无源光器件不受CPO/NPO的路线选择影响，均需高通道FAU；2⃣相比1.6T硅光模块，6.4T NPO光引擎（含配套ELS）#所用FAU总价值量提升超10倍，系NPO BOM最高比重", "content": "再次强调三个月前我们对无源光器件的判断：重视NPO/CPO时代无源光器件的价值通胀，最新fau产业报告欢迎探讨 1⃣无源光器件不受CPO/NPO的路线选择影响，均需高通道FAU； 2⃣相比1.6T硅光模块，6.4T NPO光引擎（含配套ELS）#所用FAU总价值量提升超10倍，系NPO BOM最高比重环节； 3⃣NPO 27年将规模交付，出货厂商预计是旭创、新易盛、Coherent，与三家厂商绑定的FAU供应商显著受益，#重点关注已有36通道FAU量产能力的厂商； 4⃣除FAU外，隔离器、光芯片等价值量也有较大膨胀，此外Scale up光互联还产生Shuffle全新增量。#文字观点", "publish_time": "2026-09-07 14:15", "tags": ["文字观点"]}, "post:2026-09-07T09-28:c891c1561c58": {"id": "post:2026-09-07T09-28:c891c1561c58", "kind": "post", "title": "2026-09-07 09:28", "source_label": "帖子正文", "excerpt": "【HYDZ BY 】非农落地+GPT6超预期，市场有望重回算力赛道#宏观利空逐步出清，AIAgent带来新算力叙事： 在非农数据超预期及加息预期提升的背景下，周五美股算力板块大幅反弹，科技股逐渐对加息预期不敏感，甚至或已充分反应在前期股价下跌中。GPT6周末各种测评，在AI Agent方面的超预期将", "content": "【HYDZ BY 】非农落地+GPT6超预期，市场有望重回算力赛道#宏观利空逐步出清，AIAgent带来新算力叙事： 在非农数据超预期及加息预期提升的背景下，周五美股算力板块大幅反弹，科技股逐渐对加息预期不敏感，甚至或已充分反应在前期股价下跌中。GPT6周末各种测评，在AI Agent方面的超预期将带动tokens消耗指数级增长，算力硬件远期需求量进一步上调； 上周策略会我们跟PCB及上游产业链公司、元器件、部分光通信公司交流下来，整体景气度在26、27年维度没有看到任何下降的迹象，部分客户开始讨论28年订单需求。 其中，#PCB公司仍处于加速扩产阶段，很多算力新产品、新技术持续迭代，行业齐头并进，很多28年落地的新技术（cowop、3.2t npo、陶瓷基板、ptfe等）开始在产线上测试，设备采购周期持续加长，目前产能规划基本为28年需求做准备。 #上游原材料厂商，钻针、铜箔等环节仍处于加速量价齐升时刻，钻针的均价及高价值产品加速提升，铜箔、电子布高端低端的价格同时上涨趋势不变，此外海外竞对的扩产依旧较慢，国内厂商不同程度的拿到海外客户的增量订单，全球市场份额持续提升。 #元器件赛道高端品国产化加速+大宗品涨价加速，MLCC原厂价在8月份加速提升，9月份作为传统最旺月份，涨价二阶导有望进一步加速，目前看行业内部普遍认为年内持续涨价将成为大概率事件。服务器等级超高容产品、TLVR、光模块高频晶振等高端元器件，均开始在海外客户开启认证+导入，国产元器件厂商有望通过本轮算力周期进入高端产品市场。 #光通信上游InP材料仍保持量价齐升的高景气趋势。2、3、4、6英寸InP衬底价格年内已4轮涨价，但仍然处于供不应求的格局，单晶炉扩产有限+良率提升缓慢，中期看供给紧缺格局很难改变。出口管制等因素导致批量海外外延订单转移国内，利好国内衬底产商加速国产替代。#建议关注：PCB：生益、深南、鹏鼎、景旺 PCB上游：德福、国际复材、鼎泰 元器件：三环、风华、顺络 InP：云锗、先导等#文字观点", "publish_time": "2026-09-07 09:28", "tags": ["宏观利空逐步出清", "AI", "PCB", "建议关注", "文字观点"]}, "post:2026-09-07T17-15:6d277830e7a8": {"id": "post:2026-09-07T17-15:6d277830e7a8", "kind": "post", "title": "2026-09-07 17:15", "source_label": "帖子正文", "excerpt": "比亚迪电子电子更新0907：（by财通灰灰团队） 1.最近两个月底部已上涨30%+。2.基本面消费电子变化的结论是：消费电子业务下半年好于上半年，27年好于26年，26年。", "content": "比亚迪电子电子更新0907：（by财通灰灰团队） 1.最近两个月底部已上涨30%+。 2.基本面消费电子变化的结论是：消费电子业务下半年好于上半年，27年好于26年，26年。下半年好的Driver是苹果新品带来量升。27年好的Driver是苹果春节和9月都有大新品、零部件材料这块也有更新带来毛利率提升。汽车这块贝塔虽差，但是增长还是正的。 3.基本面AI新业务这边结论是：26年30亿+收入指引量级（主要来自服务器、Q4开始有液冷冷板贡献）、27年百亿收入目标、28年几百亿收入目标。利润率也会高于消电这块。 3.估值角度：当前比亚迪电子当前市值520亿RMB，假设27年恢复至40亿+RMBde Nongaap净利润，对应当前估值是13X。 我们这周在带反路演，需要安排的童鞋联系我们！也欢迎跟我们探讨！#文字观点", "publish_time": "2026-09-07 17:15", "tags": ["文字观点"]}, "post:2026-09-07T13-02:8edb75294fd3": {"id": "post:2026-09-07T13-02:8edb75294fd3", "kind": "post", "title": "2026-09-07 13:02", "source_label": "帖子正文", "excerpt": "政策加持，底部共振，电源到了最佳击球点！#事件：9月4日，中央网信办、国改委、工信部等七部门联合印发《促进数字化绿色化协同转型发展实施方案（2026—2030年）》，首次在国家级政策文件中明确提出探索算力设施800V高压直流供电架构，并同步强调算电协同、绿电直连和新型储能等方向。", "content": "#锐翔智能(920178)市值仅14亿北交所小票，拿下索尔思光模块全套自动化整线首单500余万，11月交付，正式切入头部光企整线设备供应链，后续复制放量空间打开。#文字观点", "publish_time": "2026-09-07 13:02", "tags": ["文字观点"]}, "post:2026-09-07T15-52:bb7d7964ded4": {"id": "post:2026-09-07T15-52:bb7d7964ded4", "kind": "post", "title": "2026-09-07 15:52", "source_label": "帖子正文", "excerpt": "9月7日复盘笔记：PCB/CPO/零售/食 电力和资本开支硬约束下如何提升效率\"；英伟达CPO交换机已进入全面量产。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线一：GPT-6 Astra带来的算力结构变化与循环Transformer叙事\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：GPT-6采用循环Transformer架构，把模型推理深度与参数量解耦，推理侧算力消耗结构发生变化；循环transformer有望拉升高算力服务器需求；Computer Use模式通过代码执行操控浏览器、桌面环境，token消耗大幅抬升。\u003c/li>\n\u003cli>今天出现的催化/验证：Anthropic 2026年7月总ARR达650亿美元，按每月100亿美元新增净ARR计算，Q3为850亿美元、Q4为1150亿美元；亦有观点测算Astra用10万张Grace Blackwell NVL72进行训练，并开始讨论下一步所需算力规模；\"Loop Transformer大概率会成为Scaling的下一个旋钮\"。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线二：光博会召开 + 无源光器件/CPO/FAU价值重估\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：CIOE光博会9月9日至11日召开，1.6T高速光模块、CPO/NPO/XPO、硅光、OCS等集中展示；英伟达CPO交换机已进入全面量产。\u003c/li>\n\u003cli>今天出现的催化/验证：台湾零部件供应商上银、大银、直得等传出硅光商业化加速带动封装与检测设备需求爆发，Q3起订单大增；直得称\"近期一口气接国际CPO设备龙头千套订单，较去年全年增长近30倍\"；无源光器件不受CPO/NPO路线选择影响，相比1.6T硅光模块，6.4T NPO光引擎所用FAU总价值量提升超10倍，系NPO BOM最高比重。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线三：国产存储ATE设备订单落地与18G FT测试机突破\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI驱动测试需求高景气，2025年国产化率仅8%-10%，海外龙头交期拉长，国产替代窗口打开。\u003c/li>\n\u003cli>今天出现的催化/验证：精智达公告接近16亿元测试机订单，继2026年1月超13亿订单后的又一重大订单，最大亮点为包含5台18G超高速FT测试机，单台金额大几千万人民币；管理层电话会解读表态超预期；悦芯科技8月20日获国内龙头存储厂超15亿元ATE订单，核心产品TM8000支持LPDDR、DDR、HBM测试。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线四：AI PCB景气验证——高盛上调Compeq目标+台系供应链量价齐升\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI PCB量价双增逻辑持续，载板/msap释放高弹性；H2以来Rubin/Trainium 3已开始大规模拉货，TPU v8拉货有望于Q4启动。\u003c/li>\n\u003cli>今天出现的催化/验证：高盛报告显示Compeq管理层将2027年营收目标上调至1100-1200亿新台币，以中值计算2025-2027年复合增速达23%；台光电子H2 AI CCL出货预计环增40%、智邦指引Q3收入环比增长32%；据SemiAnalysis，2026年全球六大ABF基板供应商产能已基本售罄，交期由6-8个月延长至12-14个月。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线五：通信十五五规划 + 光纤光缆AI新周期\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：工信部发布\"十五五\"信息通信行业发展规划相关信息，明确到2030年我国信息基础设施累计投资达3.8万亿元，智能算力规模达9800 EFLOPS，重点推进新一代通信网、算力网建设，推动400G以上超高速传输。\u003c/li>\n\u003cli>今天出现的催化/验证：中国移动2026-2027年普通光缆集采开标，价格突破80元；电子布9月再提价，7628电子布提价1.5-1.6元/米，提价后约11.4-11.8元/米，价格再创历史新高，电子布到覆铜板涨价链传导顺畅。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>OpenAI发布GPT-6 Astra（代号），在复杂推理、编程、Computer Use及Agent任务等方向能力进一步提升；The Information报道其采用循环Transformer架构。\u003c/li>\n\u003cli>精智达披露接近16亿元重大测试机订单，为继1月超13亿订单后的又一重大订单，包含5台18G超高速FT测试机；管理层召开重大合同解读电话会。\u003c/li>\n\u003cli>中国移动2026-2027年普通光缆集采开标，光缆价格突破80元。\u003c/li>\n\u003cli>工信部发布\"十五五\"信息通信行业发展规划相关信息，提出到2030年信息基础设施累计投资3.8万亿元、智能算力9800 EFLOPS。\u003c/li>\n\u003cli>今日下午多家金融央企密集公告财政部注资，引发市场对后续政策发力的广泛讨论。\u003c/li>\n\u003cli>电子布9月再度提价，提价幅度继续走扩，价格创历史新高至约11.4-11.8元/米。\u003c/li>\n\u003cli>高盛发布台湾PCB/CCL行业研报：Compeq管理层交流验证光模块PCB高景气，2027年营收目标上调至1100-1200亿新台币；重申臻鼎科技、台光电子、联茂三家买入评级。\u003c/li>\n\u003cli>成都多晶硅减产会议：26年国内多晶硅总产量下调至100-110万吨左右，Q4预计全行业减产50万吨年产能，头部硅料企业签字+盖公章，周一统一上报至北京总局。\u003c/li>\n\u003cli>B站完成7亿美元2031年到期零息可转债定价，腾讯认购2亿美元并同时向市场配售近4亿美元B站股票。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>9月9日-11日CIOE中国光博会\u003c/strong>：1.6T高速光模块、CPO/NPO/XPO、硅光、OCS、单波400G等新产品展示情况；本周光博会叠加模型侧催化，光通信板块预期修复能否延续。\u003c/li>\n\u003cli>\u003cstrong>9月23日华为Mate 90发布\u003c/strong>：是否发布首款\"韬定律\"麒麟芯片，为先进封测设备需求的验证窗口。\u003c/li>\n\u003cli>\u003cstrong>GPT-6 Astra长任务/Computer Use的算力结构影响\u003c/strong>：CPU、沙箱、I/O环节的负载迁移是否带动新一轮算力硬件需求结构变化；tokens消耗指数级增长对算力硬件远期需求的上调幅度。\u003c/li>\n\u003cli>\u003cstrong>光模块PCB/CCL产业链景气验证\u003c/strong>：台光电子H2 AI CCL出货环比增40%、智邦Q3收入环比增长32%的兑现情况；TPU v8拉货Q4启动节奏；六大ABF载板产能售罄后交期变化。\u003c/li>\n\u003cli>\u003cstrong>存储ATE订单后续落地节奏\u003c/strong>：精智达2026-2027年订单与收入指引、18G FT测试机后续放量情况；国产存储测试设备商在国产化率8%-10%基础上的替代进度。\u003c/li>\n\u003cli>\u003cstrong>财政部注资金融央企后的政策信号\u003c/strong>：此次注资（历史上第四次）是否如1998年注资后伴随降准降息与财政加码；保险机构注资后权益配置变化。\u003c/li>\n\u003cli>\u003cstrong>多晶硅减产执行与库存去化\u003c/strong>：Q4减产50万吨年产能的执行情况，以及头部硅料企业签字监督机制的落地效果。\u003c/li>\n\u003cli>\u003cstrong>中国移动光缆集采价格突破80元后\u003c/strong>：光纤光缆板块\"AI新周期\"逻辑能否从价格弹性走向持续性成长叙事。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>07:48｜【广发
