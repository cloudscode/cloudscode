纤价格追踪报告：中国价格仍居高位，海外价格正在迎头赶上 据 CRU 数据，2026 年 9 月，中国 G657.A1 裸光纤价格为 133.1 元 /fkm（约 19.83 美元 /fkm），环比下降 1.6%，8 月环比涨幅为 30.5%；其相对美国市场的价格溢价，从 2026 ", "content": "", "publish_time": "2026-10-04 15:42", "tags": ["文字观点"]}, "post:2026-10-04T15-45:3bfc4f997c4a": {"id": "post:2026-10-04T15-45:3bfc4f997c4a", "kind": "post", "title": "2026-10-04 15:45", "source_label": "帖子正文", "excerpt": "Tesla：车端产销持续超预期，油价危机延续带动销量高基数下的环比正增【锂电】 车端：2026Q3Tesla产量46.44万辆，同比+4%，环比+3%；交付量48.65万辆，同比-2%，环比+1%。", "content": "", "publish_time": "2026-10-04 15:45", "tags": ["文字观点"]}, "post:2026-10-04T20-16:507b0cc5bbb9": {"id": "post:2026-10-04T20-16:507b0cc5bbb9", "kind": "post", "title": "2026-10-04 20:16", "source_label": "帖子正文", "excerpt": "Evercore ISI： 按GPU代数划分的每机架功耗和散热量", "content": "", "publish_time": "2026-10-04 20:16", "tags": []}}, "source_details": {"post:2026-10-04T15-42:b89b92d51579": {"id": "post:2026-10-04T15-42:b89b92d51579", "kind": "post", "title": "2026-10-04 15:42", "source_label": "帖子正文", "excerpt": "大摩‑英伟达：重启 “首选标的” 评级，NDR 反馈印证我们的乐观判断 在本周的路演当中，英伟达首席执行官强调，近期在土地、电力、壳公司、融资、元器件短缺以及代理业务等方面的发展，都凸显了该公司的竞争优势；我们对此表示认同，重新将该股列为半导体板块的首选股。", "content": "大摩‑英伟达：重启 “首选标的” 评级，NDR 反馈印证我们的乐观判断 在本周的路演当中，英伟达首席执行官强调，近期在土地、电力、壳公司、融资、元器件短缺以及代理业务等方面的发展，都凸显了该公司的竞争优势；我们对此表示认同，重新将该股列为半导体板块的首选股。 要点总结 路演凸显了该公司除超大规模云服务商和前沿实验室之外的业务多样性。 受制于土地、电力和机房空间的限制，选择每吉瓦成本更高的处理器的策略，有望取得成效。 我们认为，代理计算的兴起对 CPU（包括英伟达的 CPU）而言具备积极意义，但对 GPU 而言会形成更强大的驱动力。 鉴于英伟达在开放权重模型和封闭参数模型领域均占据强势地位，开放模型的重要性也是这一叙事当中的关键要素。 如此广泛的客户群，也有助于化解土地、电力和基础设施方面的约束，因为这些制约因素对美国超大规模云服务商的冲击最为显著。各个国家希望利用本国土地、电力与基础设施发展相关业务，由此催生主权业务。这同时也给英伟达带来重大机遇，推动收入分成协议落地，开拓价值可观的软件及服务收入来源。参考摩根士丹利报告：英伟达、新云服务商与收入分成：下一场重大辩论（2026 年 8 月 14 日）。 传统超大规模及前沿实验室领域的增长。尽管有观点认为，本次业务重新划分是为了淡化传统超大规模业务，但该公司证明，自己从前五大云服务提供商处持续拿到更大的支出份额。一方面是人工智能在整体支出当中占比提升，另一方面英伟达在极短时间内成长为以太网等市场营收份额领头羊，还将在微处理器市场同行业头部企业展开竞争。定制芯片在这些超大规模云服务商内部发挥重要作用，可以针对特定工作负载做优化，但英伟达的通用处理器承担核心角色，同时拥有最长资产使用寿命。 该战略的核心目标是大幅提升每吉瓦营收，保证英伟达解决方案持续实现每吉瓦最高收益。英伟达展示的演示幻灯片显示，费曼（Feynman，即 2028 年架构），会将英伟达每吉瓦收入从 400 亿美元，提升至远超 500 亿美元的水平。该举措会引发市场争议，竞争对手会拿自身更低的每吉瓦收入，以及更慢的增长速度，当作成本优势的核心卖点。 但如果最大发展约束转变为土地、电力、机房空间，其余条件保持一致的前提下，每千兆瓦产出的令牌数量越高，竞争胜算就越大。我们正在亲眼见证这一现象：那些使用每千兆瓦成本更低的 ASIC 芯片的最大客户，恰恰是遭遇最严峻数据中心土地、电力、机房空间难题的企业。对比 Blackwell 架构，新架构的令牌产出最高提升 25 倍，极大缓解市场对于每千兆瓦成本上行的担忧。 英伟达提出和摩根士丹利分析师斯蒂芬・伯德一致的观点：当前算力无法满足全部需求，半导体生产数量已经超过现有基础设施的容纳上限。英伟达明确表示，自身不存在该类问题。 我们也看到上述各类制约因素，但人工智能发展势头十分强劲，我们判断短期不会出现芯片供应短缺。不过根据行业渠道信息，英伟达每千瓦芯片产出远高于同行，部分情形下高出数倍。如果千瓦功率成为核心约束，那么 “千瓦级高密度化” 策略，也就是在更小功耗区间完成性能优化，很可能会成为行业主流方向。 持久化代理确实会拉动 CPU 需求，但绝大部分支出依旧投向 GPU。这点在我们看来十分清晰。在 Muse 这类智能代理工作负载当中，单颗 CPU 核心每天仅需要花费数分钟，完成智能代理测试框架的若干处理步骤，这意味着一台具备数百核心的 CPU，就可以服务海量用户；但同时会产生规模庞大的增量推理令牌。英伟达推测，单个智能代理用户每日生成令牌数量，最高可以达到普通人类用户的十倍。 即便如此，CPU 短缺的局面依旧严峻，不过我们判断过去一个月该情况没有进一步恶化。英伟达对自身 CPU 出货增长计划充满信心，计划从 2026 年 200 亿美元，提升至 2027 年 400 亿美元。我们认为该增长当中略超五成来自 AI 机架内部的主节点 CPU，剩余增长来自独立 CPU 机架。 公司会持续运用资产负债表构筑竞争优势，同时兑现将百分之五十现金返还股东的承诺。英伟达已经调动五千亿非英伟达资本投入 AI 数据中心，提前大量采购半导体元器件、电力资源，同时获取计划转让给客户的数据中心租赁合同。虽然人工智能领域自带的杠杆效应仍存争议，但英伟达完全没有采用股票分红或者其他循环属性更强的财务支持手段。公司长期目标是建立把 AI 工厂作为抵押资产的行业标准，对于该目标我们尚且存疑。但我们预期，英伟达对生态系统的大力扶持，会成为其竞争优势。 继 NDR 投资者日会议之后，我们重新将英伟达列为首选股。今年三月，在我们此前更看好内存板块高弹性个股之后，我们就曾经将英伟达列为首选股。按照摩根士丹利内部流程，该头衔六个月之后会自动撤销，现在我们再次将其恢复为首选股。 我们看好英伟达成为首选股的核心逻辑： 英伟达正处在新产品周期非常早期的启动阶段，算力驱动的市场需求高度契合英伟达自身竞争优势，当下市场对 AI 的普遍乐观情绪，还会加速 Vera 产品落地。该股对应 2028 财年每股收益市盈率仅 15 倍，估值水平相对偏低。如果市场 AI 投资热情再度升温，股价存在市盈率扩张空间；就算市盈率不扩张，依托持续向好的业绩，股票依旧有望取得不错表现。 近期围绕 Muse 热潮，市场出现大量和 CPU 相关的报道，英伟达阶段性表现相对偏弱。但我们认为，消费级设备赛道，会为长期人工智能应用场景、令牌需求注入源源不断动力，英伟达后续表现会进一步跑赢大盘。 过去十二个月市场焦点集中在半导体产能约束，如今行业瓶颈快速转向新建数据中心的建设速度以及融资模式，这恰好属于英伟达生态系统的优势领域。伴随美国国内政治压力上升，本土建厂容错空间不断收窄，但在海外业务布局上英伟达走在行业前列，带动全球各国政府加大相关投资，催生更多新云服务商。英伟达官网罗列八十家云合作伙伴，其中五十五家位于美国境外，部分合作伙伴同时在多个地区布局数据中心。这让英伟达可以灵活切入资金充裕、但传统超大规模云服务商难以涉足的海外市场。 资金是 AI 实验室面临的另一重约束，计算资源相关决策越来越高度依赖融资。针对该现状，英伟达已经推出重大举措，要么通过合作渠道募集资金，要么直接提供资金支持。英伟达动员五千亿美元投资属于重大利好，市场焦点转向收入分成模式（2026 年 8 月 11 日报告）。英伟达提供融资的意向，以及业务重组举措，此前曾经遭到投资者负面评价，但市场情绪有望转向利好英伟达。这让英伟达成为半导体板块当中韧性更强的 AI 受益标的。一旦市场对于 AI 产能部署速度预期发生调整，半导体供应链当中，盈利高度依赖供应短缺的细分领域，会在交货周期缩短之后承受最大压力。 我们认为英伟达 2028 财年营收指引存在向上修正空间，主要来自两点原因。在上一次财报电话会议，管理层给出下一财年营收同比增长百分之七十的指引，对应数据中心业务大约百分之七十五增速。该指引是基于供给受限做出的预测，真实市场需求增速接近百分之百。供给端的核心制约之一，是数据中心土地、电力基础设施的交付周期。虽然我们无法指明哪些站点可以支撑更乐观的预测，但依旧存在其他乐观依据。 我们重点强调两个驱动因素： 客户 SpaceX 以及亚马逊，过去九十天进一步加深和英伟达的合作，给其余客户树立业绩基准。保守测算两家客户对英伟达百分之七十五数据中心营收指引的贡献，超大规模业务板块其余客户的增速大约百分之二十，该增速显著低于市场一致预期给出的百分之三十九资本支出同比增速。 SpaceX 管理层目标，2026 年底达成约 2GW 数据中心容量，2027 年底提升至 5‑10GW。按照下限测算，以每吉瓦四百亿美元口径，SpaceX 明年对英伟达的支出规模最高可达一千二百亿美元。我们的分析当中，假设 2027 年 SpaceX 一千三百二十亿美元 AI 资本支出当中，百分之七十九用于实际部署，该比例和 2026 年一季度保持一致。SpaceX 每落地 1GW 装机容量，会在 2028 财年为英伟达贡献大约百分之五营收。 亚马逊与英伟达近期官宣扩大合作，2027‑2028 年新增两百万块 GPU、Vera 处理器以及相关技术。Vera 处理器预计 2027 年底才会上市，AWS 和英伟达合作进一步深化，我们判断英伟达 2027 年可以拿到一部分 AWS 资本支出份额。我们互联网研究团队预测，亚马逊 2026 年投向英伟达的支出约四百亿美元，2027 年达到七百八十亿美元。 如果剔除独立产品线贡献，核心 GPU 销售额可以实现中个位数至高个位数增长，该测算还没有计入频谱、DPU、存储等其他业务带来的增量。我们大中华区半导体团队，对于 Blackwell 加上 Rubin 对应的 CoWoS 封装需求预期接近持平。但考虑英伟达和台积电深度合作，我们相信英伟达可以拿到充足产能分配；叠加后端产能交期，明年 3nm 晶圆产能释放之后，业绩依旧存在向上空间。 我们同样看好推理赛道高速增长带来的业务贡献。当下判断硬件配备率还为时过早，基于管理层公开发言，我们做出相关部署假设。我们假设托盘平均售价三点五万美元，托盘内部包含多颗芯片组件。我们并不认为把单颗逻辑芯片均价定为三千五百美元的假设过于激进。我们承认该分析存在一定循环论证问题，假设机架数量，等价于假设芯片出货量。为尽量规避该问题，我们对明年 VR 机架数量假设，贴近 ODM 分析师霍华德・高给出的 2026 年预测。 我们认为 2028 财年百分之七十二至百分之七十三的毛利率是扎实的业绩下限，背后有两点支撑。DRAM 等投入成本上行，一直是压制英伟达毛利率的主要利空因素。在公司下调 2028 财年毛利率指引之后，投资者最关心会不会出现毛利率进一步下行。我们判断毛利率会维持在指引区间，英伟达有两项手段对冲成本上涨：产品提价、硬件规格下调。依托鲁宾架构转换搭建简易毛利率模型，以百分之七十五毛利率作为基准，英伟达提价百分之十五，可以消化百分之三十销售成本上涨；通过下调 HBM 内存规格，可以消化百分之四十四销售成本上涨。如果成本上涨全部来自 HBM，那么芯片价格涨幅最高可能达到百分之一百到百分之二百。我们无法确认 2026 年 HBM 现货真实价格；在降规格的情景假设下，Rubin 架构 HBM 单 GB 价格上限四十三美元，该价格远高于 DDR5 现货价格，我们认为该假设偏保守。 乐观预测情景：2027 财年每股收益 16 美元，对应目标价 350 美元 随着供给释放，CPU、Groq 等新产品势能释放，数据中心业务营收超预期；高毛利的数据中心业务，AI 软件服务业务加速增长；收入分成协议带来数十亿美元高毛利收入；AI PC 设备普及，大幅扩大整体可触达市场规模。 基准情景：2027 财年每股收益 15.01 美元，对应目标价 300 美元 市盈率约 20 倍，和大盘水平接近，对比半导体同行存在估值折价，高市场份额压制短期估值扩张；营收 2026 年增长百分之八十八，2027 年增长百分之七十。 熊市情景：2027 财年每股收益 13 美元，对应目标价 160 美元 两大核心市场辩论出现不利走向，投资者下调增长预期；供给释放速度快于预期，推理业务增长显著放缓；AI 开发成本大幅下行，强劲竞争对手抢占份额，客户大规模转向自研定制硬件；关税、出口管制带来负面影响超出市场预期。 我们确实认为英伟达处于有利地位，并且估值水平很低，我们将英伟达重新列为我们的首选股。 我们近期在纽约和波士顿举办投资者会议，接待了英伟达首席执行官黄仁勋、首席财务官科莱特・克雷斯以及投资者关系负责人哈里・俊哉。 管理层所传递的信息，主要是重申近期围绕人工智能投资环境变化而制定的优先事项。我们得出的主要结论包括： 客户群的多样性：六个月前该公司对业务进行重新细分，初衷是让投资者理解业务的广度。尽管九成的投资者对话都围绕最大的超大规模云服务商和前沿模型公司展开，但有一半业务，并且很可能是增长更快的那一部分业务，覆盖了更加广泛的人工智能模型公司、Neoclouds、主权实体、ODM 和 OEM 厂商，以及公司客户。ACIE 这一细分市场需要英伟达所能提供的全栈式 AI 工厂生态系统。#文字观点", "publish_time": "2026-10-04 15:42", "tags": ["文字观点"]}, "post:2026-10-04T15-43:a9bfb1cf4037": {"id": "post:2026-10-04T15-43:a9bfb1cf4037", "kind": "post", "title": "2026-10-04 15:43", "source_label": "帖子正文", "excerpt": "伯恩斯坦‑Celestica：OpenAI Jalapeno 订单会否超越 Google TPU？AI 硬件业务又能撑多久？", "content": "伯恩斯坦‑Celestica：OpenAI Jalapeno 订单会否超越 Google TPU？AI 硬件业务又能撑多久？ 我们认为，市场对项目带来影响的评估存在重大偏差。许多投资者似乎是通过将本项目与谷歌 TPU 项目进行对比，来预测其对财务状况的影响。然而，两者的财务影响在两个关键方面存在差异。首先，也是更重要的是，OpenAI 的设计旨在绕过 “规模扩展” 层，转而最大限度地发挥 “规模扩展” 领域的潜力。这提高了 “规模扩展” 开关的重要性与复杂性 —— 进而也提升了 Celestica 的附加值和利润。此外，我们认为投资者尚未充分认识到 ASIC 封装所采用的寄售模式对营收带来的影响。 我们认为市场对项目的估值模型存在偏差。根据我们初期调研获得的反馈，我们认为大多数投资者通常要么完全不确定如何对项目给财务状况带来的影响进行建模，要么将每机架的经济效益与谷歌 TPU 进行对比。然而，我们认为后一种方法在两个关键方面仍显著低估了项目的影响。 与其他机架架构相比，OpenAI 的设计在可扩展性方面具有显著优势，从而提升了 Celestica 的附加值和利润。我们观察到，谷歌和 OpenAI 都是精明的买家，很可能能够将 Celestica (或任何其他供应商) 的利润与附加值挂钩。然而，OpenAI 的 Jalapeno 采用了一种雄心勃勃的设计，与 Nvidia 或 TPU 等更成熟的机架设计存在实质性差异，其中一个主要区别在于，Jalapeno 力求最大限度地减少对横向扩展的依赖，转而尽可能扩大纵向扩展的范围。鉴于高性能交换机是业务中价值最高 (且毛利率最高) 的部分之一，且这增加了纵向扩展型交换机的重要性与复杂性，这反过来将提升向客户提供的附加值，进而增加 Celestica 的利润。 由于 Jalapeno 是一个全机架项目，Celestica 的业务占比应远高于 TPU 项目，且营收差距可能比利润金额的差距更大。我们提醒投资者，在这两个项目中，均采用寄售模式处理封装业务。在寄售模式下，虽然 Celestica 负责制造，因此元器件进入 Celestica 的工厂，成品从工厂出厂，但从会计角度来看，这被视为供应商直接向客户销售。ASIC 封装 (主要包括 ASIC 芯片本身和封装好的 HBM) 不会计入 Celestica 的库存或损益表，而其余组件则会流经 Celestica 的库存并最终计入损益表。由于 Jalapeno 是一个整机架项目，流经 Celestica 损益表的组件总价值远高于 TPU 项目。虽然这种会计处理方式可能不会影响利润金额，利润金额很可能与实际经济增值挂钩，但与假设中更大比例的元器件价值采用寄售模式的替代方案相比，这可能会显著增加项目带来的收入贡献。 因此，我们认为，那些通过参照 TPU 的经济效益来预测表现的投资者，严重低估了 Jalapeno 对营收的贡献。我们认为 Jalapeno 的单机架成本约为 494 万美元；若大规模部署，则意味着巨大的收入规模。基于我们与行业参与者的交流，并参照我们此前关于英伟达机架经济性的研究，我们估计 Jalapeno 的单机架成本约 494 万美元。我们认为，该代工加速器封装包含价值约 200 万美元的 ASIC 和约 90 万美元的 HBM，因此扣除加速器封装后，机架其余部分包含价值约 220 万美元的 Celestica 组件，这部分将计入 Celestica 的库存和损益表。鉴于博通披露该项目将于 2027 年部署 1.3GW，结合 SemiAnalysis 关于 Jalapeno 需要 180 千瓦预留电力的估算，以及我们自己的估算 —— 即 Jalapeno 机柜将消耗数据中心总电力的约 80%，这意味着到 2027 年可能达到约 5600 个机柜，或带来 116 亿美元的营收机会。 从理论上讲，与寄售模式相比，交钥匙模式虽然利润总额相同，但收入更高，这可能会引发对利润率稀释的担忧。不过，与 Celestica 的整体业务相比，我们仍预计 Jalapeno 将带来利润率提升。我们的营收预估包含大量推测成分，而对利润率的判断则更为不确定。不过，即使假设 Celestica 在 OpenAI 规模化生产业务上的利润率为约 50%，低于更广泛的开关行业水平，且在机架其余部分的利润率为零，这也意味着其每台机架的利润。除以 Celestica 总内容价值 220 万美元，可得出 16% 的毛利率，而 Celestica 当前的毛利率为 11.5%。因此，即使采用我们认为非常保守的毛利率假设，Jalapeno 项目仍应能为 Celestica 带来利润增长。 从更广泛的角度来看，我们认为市场对 Celestica 的共识预期明显偏低。综合考虑谷歌 TPU、Jalapeno，以及更广泛的 1.6T 交换机业务，我们预计其营收将实现约 250 亿美元的增量增长机遇。即使在对潜在运营风险进行保守预估的情况下，我们仍认为其业绩有望显著超越市场普遍预期的约 160 亿美元。 受新项目推动，2027 财年营收将 “加速增长”：市场共识预计 CCS 营收将同比增长 128 亿美元，公司整体营收将同比增长约 150 亿美元。在 7 月 28 日举行的 2026 年第二季度财报电话会议上，Celestica 预计 2026 年营收将达到 205 亿美元，这意味着同比增长 65%。该公司进一步表示，虽然 2027 财年的详细全年展望将于今年晚些时候发布，但 “得益于异常强劲的客户需求以及新项目的成功拿下，我们预计营收增长率将较 2026 财年展望中预期的 65% 进一步加快。市场共识似乎预期增长将温和加速：彭博社的共识预测显示，公司总营收将从 206 亿美元增至 357 亿美元，增幅为 150 亿美元，同比增长 73%。 我们对新项目进行了分析，认为这可能带来约 250 亿美元的营收机会。谷歌 TPU 可能带来 80 亿美元的增量营收，Jalapeno 可能带来 115 亿美元，而 1.6T 交换机业务可能带来 60 亿美元。 谷歌占 Celestica 总出货量的约 35%，主要来自 TPU 产品。随着 TPU 出货量预计将翻一番，Celestica 来自谷歌的营收也有望翻番。Celestica 在其 10‑Q 报告中披露，有 3 家客户分别占其 2026 年上半年营收的 34%、16% 和 15%。谷歌的 TPU 项目是 Celestica 最具影响力的客户合作项目，谷歌几乎无疑就是占营收 34% 的那家客户，这意味着 Celestica 预计 2026 年将从谷歌获得约 70 亿美元的营收。尽管谷歌从未将 Celestica 作为独家供应商，据广泛报道，英业达是另一家 TPU 合作伙伴，但我们注意到，随着机架密度的提高，TPU 项目的复杂性随之增加，谷歌制造合作伙伴的附加值也相应提升，这很可能推动每台 TPU 的收入增长。尽管谷歌并非仅从 Celestica 独家采购，但我们认为谷歌在供应商结构上发生重大变化的理由有限，尤其是考虑到贸易不确定性，且 Celestica 是北美地区少数拥有充足制造产能的公司之一，该公司还强调将增加资本支出以支持产能爬坡。因此，我们预计每台 TPU 的收入将保持稳定；鉴于外部销售量增长，TPU 出货量预计将同比增长约 110%，我们预计 Celestica 来自谷歌的收入将按比例增长，这意味着将带来约 76 亿美元的增量收入。Celestica 一直在增加资本支出以支持这一产能提升，这表明其对强劲增长充满信心。 综合考虑 Jalapeno 以及其他高性能交换机业务，我们认为营收达到预测目标是可行的。我们注意到，Celestica 是首批在其客户群中大规模推广交换机的供应商之一。特别是，Celestica 正在为客户生产交换机。我们估计每机架的扩展型交换机内容价值为约 60 万美元，鉴于我们预计 2027 年出货量将达 73 万片，这可能意味着约 1 万个机架，或约 60 亿美元的高性能交换 (HPS) 收入。换个角度看，若剔除谷歌的潜在贡献，Celestica 的非谷歌 HPS 营收预计将达到约 55 亿美元。若不计入 Jalapeno 的增长，我们预计交换机市场将增长约 30%，这主要得益于向新一代产品过渡带来的平均销售价格 (ASP) 上涨；鉴于 Celestica 在该领域的领导地位以及规模化生产的逐步推进，我们认为 Celestica 应能提升市场份额并实现显著高于市场平均水平的增长，这意味着其交换机业务收入将实现可观增长。 即使对执行风险进行保守预估，我们仍将 CCS 在 2027 年的估值上调至约 200 亿至 360 亿美元。我们得出的净收入为 400 亿美元，每股收益 (EPS) 为 23.79 美元，而市场共识分别为 357 亿美元和 19.87 美元。我们承认这些机遇存在显著的运营风险。我们认为 Jalapeno 面临的风险最大 —— 尽管博通曾表示计划在 2027 年部署，且据报道 OpenAI 正试图进一步加快量产进度，但我们注意到，这是一种全新的机架架构，与更成熟的设计存在相当大的差异：值得注意的是，Jalapeno 旨在最大限度地扩展纵向扩展能力并减少对横向扩展的依赖，同时将缓存保留在 SRAM/HBM/DRAM 本地，并降低对 NAND 的依赖。因此，我们认为 Jalapeno 可能难以制造，从而导致时间表延迟，这一风险相当显著。同样，尽管 TPU 项目已相当成熟，但正处于量产爬坡阶段，该方面的风险也不容忽视。最后，HPS 的量产进度取决于博通交换机芯片的供应情况。尽管博通对芯片的量产表现出了信心，但他们已承认量产进度将向后倾斜，因此即使是相对轻微的延迟也可能将时间表推迟至 2028 年。总体而言，我们将 270 亿美元的潜在机会进行了下调，并将 CCS 的预测上调 200 亿美元至 360 亿美元。总体而言，我们预测营收为 400 亿美元，每股收益 (EPS) 为 23.79 美元，仍显著高于市场共识的 355 亿美元和 19.69 亿美元。 围绕该股票的大部分讨论似乎已超越 2027 年的业绩数据，这反映出市场对人工智能基础设施建设可持续性的普遍担忧，以及更具体而言，对 Celestica 竞争地位的担忧。这进而导致市盈率倍数收窄：尽管市场对 Celestica 的短期预期持续上调，但长期投资者似乎不愿将这种强劲表现视为结构性因素而非周期性因素。然而，我们认为 Celestica 在 2027 年之后仍能保持强劲表现。我们承认，未来前景的可见度已显著下降。 2027 年之后，尽管 Celestica 的许多现有项目可能仍在增长，但其中许多项目的增长幅度可能会远低于过去几年所看到的水平。不过，我们认为 Celestica 仍处于有利地位，能够继续在新兴项目中胜出。Celestica 在管理复杂项目方面的经验难以复制，且其利润在数据中心总资本支出中所占比例仍然相对较小。数据中心运营商似乎对价格相对不敏感，但对良率和时间表极为敏感；转用更便宜的供应商虽然能在物料清单 (BOM) 上节省相对较少的成本，但可能带来重大的运营风险，对于复杂且高价值的建设项目而言尤其如此。因此，我们认为，随着新项目开始取代旧项目，Celestica 仍处于有利地位，有望在规模化扩展领域取得成功；随着新的项目逐步投产，还将更广泛地在机架项目中赢得更多订单。 我们认为10 月 27 日的分析师日将是一个关键催化剂。此外，我们认为 Celestica 的估值水平较低，且似乎已对 2027 年后的有限增长进行了折价。我们给予 Celestica “跑赢大盘” 评级，目标价为 520 美元。我们仍然认为，Celestica 即使采取保守的业绩指引，其指引数值仍将显著高于卖方共识。然而，鉴于市场对短期强劲势头可持续性的担忧，我们不太确定 2027 年给出更高的业绩指引是否足以带动股价上涨。单就这一点而言，随着盈利预期上调而股价未见上涨，反而可能导致 Celestica 的市盈率进一步压缩。相反，如果管理层能够阐明为何 Celestica 即使在现有项目之外，仍能继续在 EMS 和 ODM 同行中占据优势，从而让长期投资者对业务的可持续性更有信心，这将有助于释放市盈率的上行空间。不过，我们认为 Celestica 的估值具有吸引力，且即使在 10 月 27 日这一催化剂之后，其风险回报比仍持续偏向积极。我们给予 Celestica “跑赢大盘” 评级，目标价为 520 美元。#文字观点", "publish_time": "2026-10-04 15:43", "tags": ["文字观点"]}, "post:2026-10-04T15-45:b258e8420ca9": {"id": "post:2026-10-04T15-45:b258e8420ca9", "kind": "post", "title": "2026-10-04 15:45", "source_label": "帖子正文", "excerpt": "【国泰海通电新徐强团队】TEC更新：光模块推动量价齐升，HBM升级扩大市场 我们一直重点推荐TEC行业，核心逻辑是随着AI 算力持续扩张驱动硬件 TDP 不断抬升，散热成为了产业核心瓶颈。从需求端来看，伴随800G/1.6T光模块放量、CPO/NPO演进、HBM与高功耗交换芯片热密度抬升，共同推动T", "content": "【国泰海通电新徐强团队】TEC更新：光模块推动量价齐升，HBM升级扩大市场 我们一直重点推荐TEC行业，核心逻辑是随着AI 算力持续扩张驱动硬件 TDP 不断抬升，散热成为了产业核心瓶颈。从需求端来看，伴随800G/1.6T光模块放量、CPO/NPO演进、HBM与高功耗交换芯片热密度抬升，共同推动TEC从可选器件逐步走向关键器件。 ⭕ 从需求端来看：光模块激光器功率增加导致温控需求提升，HBM为TEC行业提供进一步扩容。 1️⃣ 光模块：采用EML激光器的方案须搭配TEC，EML的激光器与电吸收调制器的波长温度系数差异大（温度每升高1℃，激光器波长偏移\u003c0.1nm，调制器吸收边偏移0.6nm），温度漂移会导致两段错位，行业要求EML温度控制在±0.5℃以内。800G光模块配套TEC价值量约9美金；1.6T光模块配套TEC价值量约12美金，NPO/CPO时代有望持续增长。 2️⃣ HBM：HBM发热量极高，英伟达等厂商正在尝试用TEC为HBM散热，2025年已有企业与海外头部数据中心企业对接需求，且所需TEC远大于光模块用Micro TEC，预计单颗价值量有望进一步提升。 ⭕ 从供给端来看：日本大和热磁份额较高，国产份额替代动力强劲。 1️⃣ 供应链安全需求凸显，头部企业对自主可控诉求明确。国产TEC价格比日系产品低10%-20%，在成本、交货期、配合度上具备优势；2026年海外厂商曾出现品质波动，进一步加快了国内厂商导入国产TEC的进度。 2️⃣ 行业壁垒较高，盈利能力可观。行业整体盈利可观，TEC产品毛利率预计可达50%左右；核心壁垒来自技术门槛、客户认证壁垒、良率与一致性要求，热挤压晶棒全球仅少数厂商可生产，预计短期内难有新增有效供给。#相关标的①富信科技（TEC国内头部厂商） ②华盛光电（威星智能董事长体外控股，核心布局TEC长晶、磨抛等设计制造环节，头部客户小规模供货） ☎️我们对行业保持最紧密的跟踪，详细公司/行业资料欢迎联系 徐强/孟皓#文字观点", "publish_time": "2026-10-04 15:45", "tags": ["相关标的", "文字观点"]}, "post:2026-10-04T15-42:5cd192e4deb8": {"id": "post:2026-10-04T15-42:5cd192e4deb8", "kind": "post", "title": "2026-10-04 15:42", "source_label": "帖子正文", "excerpt": "高盛——日本科技：半导体——投资者反馈：AI投资与利率上行忧虑犹存，但市场情绪边际改善 一、市场情绪：7-9月颓势难续，估值进入中期以下区间 投资者对半导体/SPE板块的整体情绪仍偏谨慎，核心忧虑在于2028年后AI资本开支的可持续性，以及日本与美国利率上行压力。然而，多数投资者并不认为7-9月股价", "content": "高盛——日本科技：半导体——投资者反馈：AI投资与利率上行忧虑犹存，但市场情绪边际改善 一、市场情绪：7-9月颓势难续，估值进入中期以下区间 投资者对半导体/SPE板块的整体情绪仍偏谨慎，核心忧虑在于2028年后AI资本开支的可持续性，以及日本与美国利率上行压力。然而，多数投资者并不认为7-9月股价与估值倍数持续下行的趋势将延续至年底。随着盈利增长未见放缓迹象，越来越多个股的估值倍数已回落至周期中值以下，部分投资者表示将积极增配那些有望实现超预期盈利的公司。 二、个股多空分歧：爱德万测试、国际电气获青睐；Lasertec、迪思科仍遭看空 • 看多阵营：爱德万测试（Advantest）与国际电气（Kokusai Electric）获较多投资者青睐。 • 看空阵营：Lasertec与迪思科（Disco）因估值偏高且缺乏短期催化剂而承受较重卖压。尤其对迪思科，许多投资者担忧客户将HBM堆叠层数从12层降至8层将压制设备需求。但高盛认为，HBM供需趋紧反而可能加速HBM投资，层数减少的影响中性甚至偏正面。对于Lasertec，需求增长提升了一季度业绩会上上调全年订单指引（当前为区间指引）的可能性，这有望成为股价上行的催化剂。 三、选股框架：聚焦营收增速、产能释放与利润率扩张 在需求整体强劲的背景下，高盛提出SPE板块选股三大核心标准： 1. 营收增速：能否实现超越行业平均的增长； 2. 产能弹性：是否具备充足产能以兑现强劲订单； 3. 利润率改善：在收入高增阶段能否实现利润率扩张。 基于上述框架，高盛维持Lasertec（ACTIS检测设备增长率加速）为亚太区确信买入名单（Conviction List）首选标的，同时维持以下买入评级： • 迪思科（出货动能加速） • 东京电子（提价驱动利润率改善） • 荏原制作所（CMP业务增速超越晶圆前道设备WFE市场整体） • 铠侠控股（预期价格持续上涨及额外股东回报） • HOYA（尽管盈利强劲，估值仍被低估） 四、关键标的估值方法与目标价（文字版） • 迪思科（Buy）：目标价105,000日元。基于全球SPE板块平均EV/EBITDA倍数18倍及FY3/28预期，并附加50%板块相对溢价。主要风险：AI相关需求放缓或份额流失、中国需求走弱或出口管制放松、日元快速升值。 • 荏原制作所（Buy）：目标价7,900日元。基于P/B与FY12/27预期ROE的相关性。风险：半导体资本开支进入下行周期、中国CMP设备商竞争力提升、新技术采用缓慢、原油/LNG价格下跌。 • 国际电气（Neutral）：目标价10,500日元。基于全球SPE平均EV/EBITDA 18倍及FY3/28预期。风险：关键客户投资变动、出口管制调整、竞争对手战略变化。 • 爱德万测试（Neutral）：目标价43,000日元。基于全球SPE平均EV/EBITDA 18倍及FY3/28预期，附加40%溢价。风险：客户资本开支波动、市场份额变化、中国测试机需求趋势、汇率波动。 • Lasertec（Buy，确信买入）：目标价70,000日元。基于全球SPE平均EV/EBITDA 18倍及FY6/28预期，附加50%溢价。风险：新进入者导致份额下降、晶圆厂采用ACTIS进展缓慢、客户对先进制程投资意愿减弱、日元快速升值。 • HOYA（Buy）：目标价36,000日元。采用分部加总估值法（SOTP），医疗业务（FY3/27 EV/EBITDA 15倍，FY3/28 13倍）与IT业务（FY3/27 35倍，FY3/28 28倍）。风险：EUV光罩基板竞争格局变化、EUV薄膜采用导致EUV光罩用量下降、利率环境变动。 • 东京电子（Buy）：目标价18,000日元。基于全球SPE平均EV/EBITDA 18倍及FY3/28预期，附加30%溢价。风险：半导体行业库存调整延长、出口限制加码、利率上行压制估值倍数。 • 铠侠控股（Buy）：目标价38,667日元。基于P/B与FY3/27-3/28预期ROE的相关性。风险：超大规模企业AI投资放缓、中国NAND厂商崛起、成本上升或产能利用率波动导致利润率下滑、日元急升。 五、上行风险与策略启示 • AI Capex长尾效应：若2028年后AI基础设施投资维持高位，设备商订单能见度将延长。 • HBM技术路径变化：层数减少可能促使客户通过增加晶圆投片量来弥补单芯片容量损失，反而利好刻蚀/沉积设备。 • 估值修复窗口：当前板块估值处于周期中值以下，一旦宏观利率预期企稳，具备盈利上修潜力的个股有望迎来戴维斯双击。#文字观点", "publish_time": "2026-10-04 15:42", "tags": ["文字观点"]}, "post:2026-10-04T20-17:8a2b37a3483a": {"id": "post:2026-10-04T20-17:8a2b37a3483a", "kind": "post", "title": "2026-10-04 20:17", "source_label": "帖子正文", "excerpt": "瑞银：交付周期 晶圆代工：3-4 年 半导体设备：1-2 年 先进封装/基板：1-1.5 年 存储系统：1-2 年 GPU/AI 加速器：6-12 个月 存储器（HBM/DRAM）：6-12 个月 光收发器/网络设备：3-9 个月 CPU：3-6 个月 服务器：1-2 个月", "content": "瑞银：交付周期 晶圆代工：3-4 年 半导体设备：1-2 年 先进封装/基板：1-1.5 年 存储系统：1-2 年 GPU/AI 加速器：6-12 个月 存储器（HBM/DRAM）：6-12 个月 光收发器/网络设备：3-9 个月 CPU：3-6 个月 服务器：1-2 个月", "publish_time": "2026-10-04 20:17", "tags": []}, "post:2026-10-04T15-43:b36ce1cbbd34": {"id": "post:2026-10-04T15-43:b36ce1cbbd34", "kind": "post", "title": "2026-10-04 15:43", "source_label": "帖子正文", "excerpt": "Coherent 专家访谈：NPO、CPO、EML 与 OCS 的产量、ASP 及供应链展望 针对可插拔光收发器，Coherent 在 2025 年出货约 310 万个 800G 单元，ASP 为 415 美元，同时出货 220 万个 1.6T 单元，ASP 为 1320 美元。该公司 2026 年", "content": "Coherent 专家访谈：NPO、CPO、EML 与 OCS 的产量、ASP 及供应链展望 针对可插拔光收发器，Coherent 在 2025 年出货约 310 万个 800G 单元，ASP 为 415 美元，同时出货 220 万个 1.6T 单元，ASP 为 1320 美元。 该公司 2026 年预测为 740 万个 800G 单元（ASP 370 美元）以及 320 万个 1.6T 单元（ASP 1100 美元）。 DSP 芯片涨价将于 2026 年 9 月启动，预计成本增加 12%。 成本带来的影响将从 2026 年第四季度开始显现；Coherent 计划通过季度合同价格调整，将大部分成本压力向下游客户转嫁。 NPO 业务将在 2027 年下半年实现大规模上量，该年份将成为 NPO 业务的元年。 2027 年，Coherent 的目标是生产 22 万‑23 万个 1.6T NPO 引擎、38 万‑40 万个 3.2T 单元，以及 7 万‑8 万个 6.4T 单元。 目前全部 NPO 设计仍然需要使用 DSP 芯片。 Coherent 的 OCS 产品在 2026 年为 300×300 双向端口型号，整体出货量为 1400 台；其中谷歌占比约 1300 台。 512×512 大端口版本还处在实验室测试阶段，要到 2029 年才能够实现量产。 OCS 出货预测：2027 年为 4400 台，其中谷歌约 4000 台，英伟达约 300 台为小端口单元。 在客户验证进展顺利的前提之下，2028 年 OCS 出货量有望达到 10500 台，包含谷歌 7500 台、英伟达 2200 台，还有 Meta 首次导入使用的 500 台。 英伟达、谷歌分别占 Coherent 光模块销售额的 48% 与 23%。 EML 芯片行业展望：2026 年，100G EML 整体出货量为 1780 万颗，ASP 约 9 美元；200G EML 出货量达到 1150 万颗，ASP 约 17 美元。 大批量订单可以享有折扣，大客户实际成交价格，100G EML 可以低至约 8 美元。 CW 激光器出货情况：300mW CW 激光器 2025 年出货 110 万台，2026 年出货 320 万台。 该产品 ASP 由 2025 年 38 美元，下降至 2026 年的 34 美元。 HD Optics 属于关键的 FAU 供应商。 该供应商在 Coherent 的 CPO DFAU 采购份额达到 45%‑48%，在 NPO FAU 采购当中占比约 40%。 另外一家核心供应商为 TFC。 工业板块收入预测：2025 年 22.1 亿美元、2026 年 23.2 亿美元、2027 年 24.8 亿美元、2028 年 27 亿美元。 2025 年工业板块毛利率 34.2%，净利率 13.1%。 全公司盈利目标：2026 年净利率预计 17.8%，2027 年约 19%。 长期目标为 2028‑2030 年区间，将净利率维持在 22%‑25%。 Coherent 已于 2026 年上半年完成 6 英寸 InP 产能第一次翻倍；第二次产能翻倍计划安排在 2027 年，用来支撑 CW 激光器、EML 芯片、NPO、CPO 各类产品的市场需求。#文字观点", "publish_time": "2026-10-04 15:43", "tags": ["文字观点"]}, "post:2026-10-04T15-43:cb2d16452688": {"id": "post:2026-10-04T15-43:cb2d16452688", "kind": "post", "title": "2026-10-04 15:43", "source_label": "帖子正文", "excerpt": "Coherent 专家访谈要点 可插拔收发器 & ASP 趋势 2025 年表现：出货约 310 万台 800G 产品（ASP 415 美元）和 220 万台 1.6T 产品（ASP 1320 美元）。2026 年预测：预计增长至 740 万台 800G 产品（ASP 降至 370 美元）和 320", "content": "Coherent 专家访谈要点 可插拔收发器 & ASP 趋势 2025 年表现：出货约 310 万台 800G 产品（ASP 415 美元）和 220 万台 1.6T 产品（ASP 1320 美元）。 2026 年预测：预计增长至 740 万台 800G 产品（ASP 降至 370 美元）和 320 万台 1.6T 产品（ASP 降至 1100 美元）。 DSP 成本压力：从 2026 年 9 月起 DSP 芯片价格上涨 12%，将从 2026 年第四季度开始影响成本；Coherent 计划通过季度合同调整将大部分成本增加转嫁下游。 NPO & CPO 路线图 大规模量产（2027 年）：NPO 业务将于 2027 年下半年进入大规模量产，目标为 22‑23 万台（1.6T）、38‑40 万台（3.2T）和 7‑8 万台（6.4T）。所有当前设计仍需 DSP 芯片。 FAU 供应链：HD Optics 是关键供应商，在 CPO DFAU 领域占有 45%‑48% 份额，在 NPO FAU 领域占有约 40% 份额，TFC 是另一主要供应商。 InP 产能扩张：2026 年上半年完成 6 英寸 InP 产能首次翻倍，计划于 2027 年进行第二次翻倍，以支持激光器、EML 以及 NPO/CPO 需求。 光学电路交换器 (OCS) 2026 年出货量：出货 1400 台 300×300 双向端口型号，其中 Google 驱动约 1300 台。512×512 大端口版本推迟至 2029 年。 未来预测：2027 年预计为 4400 台（Google 约 4000 台，NVIDIA 约 300 台），2028 年扩展至 10500 台（新增 Meta 采用）。 客户集中度：NVIDIA 和 Google 分别占 Coherent 光学模块销售额的约 48% 和 23%。 激光器 & EML 芯片 EML 出货量（2026 年）：100G EML 达到 1780 万件（ASP 约 9 美元，大批量订单降至约 8 美元）；200G EML 达到 1150 万件（ASP 约 17 美元）。 CW 激光器（300mW）：从 2025 年的 110 万台增长至 2026 年的 320 万台，ASP 从 38 美元降至 34 美元。 财务 & 盈利目标 工业收入：预计为 22.1 亿美元（2025 年）、23.2 亿美元（2026 年）、24.8 亿美元（2027 年）和 27 亿美元（2028 年）。（2025 年基准：毛利率 34.2%，净利率 13.1%）。 净利率目标：公司整体净利率目标为 17.8%（2026 年）、约 19%（2027 年），以及从 2028 年至 2030 年的长期目标 22%‑25%。#文字观点", "publish_time": "2026-10-04 15:43", "tags": ["文字观点"]}, "post:2026-10-04T15-42:430788b34547": {"id": "post:2026-10-04T15-42:430788b34547", "kind": "post", "title": "2026-10-04 15:42", "source_label": "帖子正文", "excerpt": "人工智能融资现状：是 “暂歇”，不是 “退潮” 9 月份 AI 债券发行规模未达预期，这与我们的预期一致。不过，这并不反映基本面走弱，也不意味着缺乏用于支持建设所需的资金。", "content": "人工智能融资现状：是 “暂歇”，不是 “退潮” 9 月份 AI 债券发行规模未达预期，这与我们的预期一致。 不过，这并不反映基本面走弱，也不意味着缺乏用于支持建设所需的资金。 我们认为，9 月份供应增速放缓是以下因素共同作用的结果：1）此前数月（尤其是夏季）发行量显著前置；2）新建数据中心面临监管和政治挑战的迹象初现；3）利率下跌可能导致数据中心交易需要在项目层面重新谈判。 在美国固定收益领域，我们认为宏观背景 —— 而非供应过剩 —— 是当前至年底期间面临的最大考验，预计随着回报率大幅下滑，将出现资金流出。 我们预计美国市场还将出现至少一笔交易，并注意到，总部位于美国的超大规模科技公司在今年早些时候完成几笔大型美国交易后，仍在持续利用非美元货币进行融资。 这些超大规模科技公司对利率上升的敏感度应仍较低，我们预计秋季将迎来新一轮市场波动，尤其是在 2026 年第三季度财报发布期间，届时资本支出预测可能进一步上调。 列夫・芬相关业务在 9 月份表现活跃，但我们预计 2026 年第四季度的市场表现将更接近第一季度和第三季度，受利率上升以及监管和政治限制的影响，交易节奏将放缓。 我们认为，信用质量较低的发行主体和项目级债务对当前的利率环境更为敏感，但发行主体或许能够与租户协商更有利的租赁条款，从而提高其回报率。 继 8 月份暂停后，9 月份市场推出了一小批新的证券化产品交易，这些交易带来了更宽的利差和结构创新。 随着发起主体的债务成本飙升，浮动利率资产支持证券交易和商业抵押贷款支持证券中的部分摊销，反映了市场为吸引增量需求而正在经历的演变。 我们预计利差将从当前水平继续扩大，并重申我们更青睐 “共址” 型数据中心资产支持证券，而非超大规模数据中心资产支持证券。 利率波动加剧可能会对数据中心证券化的经济效益产生不利影响。 就个券而言，尽管 9 月份的发行规模有所缩减，但非周期性盈利和市场热点仍持续推动着投资者资金的大幅流入。 甲骨文和英伟达（后者是新纳入我们覆盖范围的个券）因其不断演变的融资策略以及对租赁文件审查趋严所起的作用，仍是相关讨论的核心。#文字观点", "publish_time": "2026-10-04 15:42", "tags": ["文字观点"]}, "post:2026-10-04T15-42:bae14fa3ee84": {"id": "post:2026-10-04T15-42:bae14fa3ee84", "kind": "post", "title": "2026-10-04 15:42", "source_label": "帖子正文", "excerpt": "国海海外宏观和大宗商品组王之凡团队 # 非农点评和大类资产配置20261003: 【非农点评】非农如期回落并低于预期，新增就业2.9万，低于市场预期，失业率升至4.2%，高于市场预期，整体偏弱。私人部门接近盈亏平衡水平。", "content": "国海海外宏观和大宗商品组王之凡团队 # 非农点评和大类资产配置20261003: 【非农点评】非农如期回落并低于预期，新增就业2.9万，低于市场预期，失业率升至4.2%，高于市场预期，整体偏弱。私人部门接近盈亏平衡水平。信息和金融再度成为拖累。失业率仍然失业率上行伴随参与率回升，需要关注劳动力回归是否长期化。薪资明显降温，让美联储10月按兵不动的理由增加，但美联储重心仍然在通胀上。美联储官员近期态度有所软化，10月加息与否仍然需要关注CPI走势。cpi目前预测同比大概率小幅反弹，重点关注核心cpi环比走向。 【基本面】宏观大概率继续维持就业降温、通胀未退的组合延续，12月加息预期目前仍存。目前紧缩节奏不明确、期限溢价高企、欧洲财政风险、原油价格仍然偏高共同影响背景下，美债收益率仍然难以明确回落。美债收益率目前是核心矛盾。中期而言，关注中选进展，中选或成为周期分水岭，后续财政政策和科技产业相关政策变化可能带来明确影响。如果民主党横扫，则财政政策可能受限制，而外交政策不确定性可能放大，如果两院分立，则外交政策和财政政策可能均受到一定限制，如果共和党继续控制两院，则财政不排除继续偏宽，外交政策不确定性也会继续放大。对于利率水平的影响，民主党横扫和两院分立下，利率水平可能相对更温和，共和党控制下，利率水平中枢不排除再度上移。 【资产配置】 1️⃣美债：短端跟随政策预期，高位震荡，长端预计继续维持高位。短期只有油价确定性回落能带动美债收益率小幅回落，但仍然难以快速缓解。关注美国中期选举对于美债收益率影响。中期而言中选结果或直接影响后续美债收益率中枢，民主党控制两院或两院分立会相对有利于收益率回落。 2️⃣美元：美联储政策仍然偏鹰，但部分官员态度有所软化。美欧利差与法国风险支撑美元震荡偏强。 3️⃣黄金：短期受实际利率和美元压制，短期震荡为主。中期而言，中期选举结果对于后续政策的影响，或影响增长水平，对黄金中期走势带来影响。长期而言，科技革命生产力演化进展仍然是决定性因素，黄金在ai彻底突破进入拓展期之前仍然有确定性。大周期维持看好。 4️⃣美股：短期靠AI盈利对冲估值压力，AI产业链上游仍然最有确定性，但对10年期利率重回5.3%以上高度敏感。阶段性顶部出现的概率上升。 5️⃣工业金属：铜在制造业扩张支撑下相对抗跌。 6️⃣原油：仍由美伊局势定价，围绕100美元宽幅波动。最大变数是油价，同时决定通胀读数、央行路径和长端利率，是各类资产共同的上游变量。 【风险点】原油再度超预期上行，cpi数据超预期 ☎详细联系：国海海外宏观&大宗商品组 王之凡, 或对口销售。🏁打分派点请打： “王之凡”/钢铁组/钢铁组王之凡/海外宏观王之凡 （根据贵司不同分类）#文字观点", "publish_time": "2026-10-04 15:42", "tags": ["文字观点"]}, "post:2026-10-04T15-44:19129dd4bce4": {"id": "post:2026-10-04T15-44:19129dd4bce4", "kind": "post", "title": "2026-10-04 15:44", "source_label": "帖子正文", "excerpt": "【东吴电新】美国大储：装机放缓，备案量突破66GW，环比+2.1% 根据 EIA 数据，美国大储美国大储 8 月新增装机 743.3MW，同环比‑30%/‑33%。2026 年 1‑8 月累计装机 10437.3MW，同比+10%。", "content": "【东吴电新】美国大储：装机放缓，备案量突破66GW，环比+2.1% 根据 EIA 数据，美国大储美国大储 8 月新增装机 743.3MW，同环比‑30%/‑33%。2026 年 1‑8 月累计装机 10437.3MW，同比+10%。同时8月新增装机容量2166MWh,同环比-37%/‑79%，2026 年 1‑8 月累计装机容量33362MWh，同比＋32%。平均配储时长2.91h。 8月末美国大储备案量66.7GW，较7月末大储备案量+2.1%。备案量中，计划26年9月并网规模为1.1GW，EIA预计年内新增装机22.8GW。 产业链看，美国大储需求旺盛，25年美国大储装机增速45%+，美国AI催生需求，2026年美国大储装机需求约55GWh；AI储能需求约13GWh。27-28年，受益于AI数据中心拉动，我们预计需求增速持续提升。若后续绿电比例提升，需求存在进一步上调空间。此外，关税及大而美法案落地，26年发货景气度高，且目前北美本土电芯产能有限、27-28年增量有限情况下，中国供应链依然有望借势美国光储高增。 另外Wood Mac口径，25Q4美国储能装机14.8GWh，同环比+56%/9%，刷新最高单季记录。截至Q4末，全年累计装机51GWh，同比+52%，创下历史新高。其中，大储装机13.6GWh，同环比+40%/-9%；工商储装机67MWh，同环比-16%/-21%；户储为0.8GWh，同环比+27%/+7%。 观点重申：全球大储未来2-3年连续高增可期、产业链高景气度持续！继续强推大储：阳光电源、宁德时代、亿纬锂能、海博思创、比亚迪、阿特斯、中创新航、上能电气、科华数据等； 并看好户储/工商储：德业股份、思格新能、锦浪科技、固德威、盛弘股份、科士达、艾罗能源、派能科技、禾迈股份、昱能科技等。 风险提示：竞争加剧、政策超预期变化、新能源装机不及预期、海外政策风险等。#文字观点", "publish_time": "2026-10-04 15:44", "tags": ["文字观点"]}, "post:2026-10-04T15-45:3ac48b6e1357": {"id": "post:2026-10-04T15-45:3ac48b6e1357", "kind": "post", "title": "2026-10-04 15:45", "source_label": "帖子正文", "excerpt": "【9月国内销量跟踪】已公布车企/车型9月销量合计72.6万辆，同比+16%，环比+5%【锂电】 比亚迪(乘用车):销量456713辆，同比+16.2%，环比+5.4%；主要系海外销量大幅增长，纯电车型出口放量。", "content": "【9月国内销量跟踪】已公布车企/车型9月销量合计72.6万辆，同比+16%，环比+5%【锂电】 比亚迪(乘用车):销量456713辆，同比+16.2%，环比+5.4%；主要系海外销量大幅增长，纯电车型出口放量。 蔚来:交付37408辆，同比+7.7%，环比+4.4% 理想:交付31817辆，同比-6.3%，环比-15.6% 小鹏:交付41256辆，同比-0.8%，环比+5.5% 零跑:交付105656辆，同比+58.5%，环比+2.5% 岚图:交付13025辆，同比-14.4%，环比+0.2% 小米:销量40000辆，同比-4.6%，环比+33.3%；澎程系列首月交付超1万辆 预计9月国内电车销量180万辆（含商用），同比+12%，环比+10%#文字观点", "publish_time": "2026-10-04 15:45", "tags": ["文字观点"]}, "post:2026-10-04T15-43:d1be7f62ff06": {"id": "post:2026-10-04T15-43:d1be7f62ff06", "kind": "post", "title": "2026-10-04 15:43", "source_label": "帖子正文", "excerpt": "特斯拉与 Rivian 均于 2026 年 10 月 2 日美股开盘前发布 2026 年第三季度交付数据。特斯拉三季度交付量约 48.7 万辆，环比上涨 1%，同比下滑 2%，显著高于公司统计的市场一致预期 46.2 万辆、Visible Alpha / 慧博投研给出的 45.5 万‑46.5 万辆", "content": "特斯拉与 Rivian 均于 2026 年 10 月 2 日美股开盘前发布 2026 年第三季度交付数据。 特斯拉三季度交付量约 48.7 万辆，环比上涨 1%，同比下滑 2%，显著高于公司统计的市场一致预期 46.2 万辆、Visible Alpha / 慧博投研给出的 45.5 万‑46.5 万辆一致预期区间，同时也高于我方 43.5 万辆的预测值。 我们在 2026 年 9 月 15 日发布报告中对特斯拉三季度交付给出的偏谨慎判断是错误的。 基于 9 月最后两周的车辆注册数据，我们判断交付超预期的增量主要来自欧洲与美国市场。 欧洲方面，截至 9 月中旬，可披露日度数据的欧洲国家季度至今销量同比约下滑 25%；但这些国家全季度最终录得同比 3% 的增长，意味着季度末销量表现十分强劲，欧洲市场整体本季度大概率实现同比正增长。 与之类似，最新美国注册数据以及订单交付周期显示，美国本土市场的下滑幅度低于我们此前的预期。 整体来看，我们认为油价走高、Model Y L 车型产能爬坡以及全自动驾驶 FSD 功能（尤其在美国市场）对特斯拉形成支撑。 在本次数据发布之前，我方对特斯拉 2026 年第四季度交付量的预测已经高于 Visible Alpha 的市场一致预期，本次我们小幅上调 2026、2027、2028 三年的交付预测。 另外，特斯拉 2026 年三季度储能装机量为 13.7 吉瓦时，同比增长 10%，低于我方 17.8 吉瓦时预测以及公司统计的市场一致预期 15.9 吉瓦时。 Rivian 公布 2026 年三季度交付 1.92 万辆，环比增长 58%，同比增长 46%，高于 Visible Alpha 1.8 万辆的一致预期，同样高于我方 1.88 万辆的预测。 展望两家公司后续的车辆交付，我们认为核心影响因素包含两点：第一，全新车型 / 改款车型上市能够带来多大的利好拉动，例如特斯拉 Model Y L，我们预计该车型今年会在更多地区投放；以及 Rivian 的 R2 车型；第二，自动驾驶技术迭代能否带动汽车销量与利润水平提升。#文字观点", "publish_time": "2026-10-04 15:43", "tags": ["文字观点"]}, "post:2026-10-04T18-03:d4c5dc63787d": {"id": "post:2026-10-04T18-03:d4c5dc63787d", "kind": "post", "title": "2026-10-04 18:03", "source_label": "帖子正文", "excerpt": "【天风军工】FCC或于3.2T出台限制，海外物料链条或为重中之重 -----------------------------------Morgan Stanley在10月1日发布标题为“Potential FCC Rules on Optical Transceivers More Likely ", "content": "【天风军工】FCC或于3.2T出台限制，海外物料链条或为重中之重 -----------------------------------Morgan Stanley在10月1日发布标题为“Potential FCC Rules on Optical Transceivers More Likely to Come in at 3.2T”的研报，#针对3.2T光模块的限制可能较快出台、前提是BOM清单中65%的价值来自美国企业，并列出了可能的美国零部件价值构成：DSP（如Marvell）约占40-50%；激光器（Lumentum/Coherent）约占15-30%；光学/电芯片/材料等约占5-10%，合计价值可接近或超65%。#因此该研报隐含观点为DSP及激光器供应链可能迎来重构、而模块环节的供应格局变化不大。我们认为，在这样的FCC政策假设下，#光通信行业中游的DSP及激光器供应格局或迎来重构： 远期3.2T需求放量后、海外DSP、激光器供应商的市场占比或迅速提升、而国内相关厂商或面对下游份额变化；#而光通信行业上下游两个方向面对的是如何重整供应链及客户结构的问题： 1）目前来看海外AAOI等光模块厂商短期产能仍远低于旭创和新易盛，且组装毛利率较低，受益相对有限，因此国内光模块大厂供应格局短期风险下降，中长期来看需要解决海外供应链及毛利率问题； 2）上游材料端多采用InP作为光芯片衬底，高纯磷、高纯铟的技术与资源稀缺性决定InP衬底目前全球短缺的供应格局，#如此政策背景或推动上游材料企业逐渐开拓海外下游客户、因海外衬底价格基本都相比国内翻倍、国内厂商拓展海外客户后盈利能力有望显著提升。在以上逻辑假设下，#海外客户InP衬底需求多集中在4/6英寸、且国内厂商需直接与住友等海外厂商进行竞争、在大尺寸片产能、良率及供应稳定性方面仍需继续发力。当下海外客户直接向国内厂商下单稀少，#率先打入海外供应链有望在链条重构过程中占据较大份额，因此看好目前大尺寸衬底片直接进入海外供应链的企业。首推#光智科技，#公司9月已公告获得Coherent订单，Lumentum也有望签单，作为国内第一批进入海外大尺寸片供应链的企业，订单的落地无疑是对公司材料全产业链的技术能力、稳定批量供应能力的又一认可。在FCC政策隐含以上未来前景下，公司供应和盈利能力的突出有望更为凸显，#我们仍持续看好全球视角下光智科技依托全产业链打通带来的供应优势。#文字观点", "publish_time": "2026-10-04 18:03", "tags": ["文字观点"]}, "post:2026-10-04T15-42:6928b3f37283": {"id": "post:2026-10-04T15-42:6928b3f37283", "kind": "post", "title": "2026-10-04 15:42", "source_label": "帖子正文", "excerpt": "中国光纤行业月度光纤价格追踪报告：中国价格仍居高位，海外价格正在迎头赶上 据 CRU 数据，2026 年 9 月，中国 G657.A1 裸光纤价格为 133.1 元 /fkm（约 19.83 美元 /fkm），环比下降 1.6%，8 月环比涨幅为 30.5%；其相对美国市场的价格溢价，从 2026 ", "content": "中国光纤行业月度光纤价格追踪报告：中国价格仍居高位，海外价格正在迎头赶上 据 CRU 数据，2026 年 9 月，中国 G657.A1 裸光纤价格为 133.1 元 /fkm（约 19.83 美元 /fkm），环比下降 1.6%，8 月环比涨幅为 30.5%；其相对美国市场的价格溢价，从 2026 年 8 月的 23%、6 月的 40% 收窄至 17%。 电信领域，2026 年 9 月中国 G652.D 裸光纤价格为 88.1 元 / 公里（约 13.13 美元 /fkm），环比上涨 2.8%，8 月环比涨幅为 5.2%，受新增产能重新向 G657.A1/A2 生产分配影响，价格依旧维持高位。 海外市场方面，供应紧张态势向全球扩散，美国 G657.A1 裸光纤价格正逐步向中国看齐，2026 年 9 月价格达到 17.00 美元 /fkm，环比上涨 3.7%，8 月环比涨幅为 2.5%。 欧洲 G657.A1 裸光纤 9 月价格为 13.28 欧元 /fkm（约 15.10 美元 /fkm），环比上涨 40.6%，8 月环比涨幅为 0.9%。 在供应趋紧的支撑之下，美国、欧洲地区 G652.D 裸光纤价格同样保持强劲上涨，环比涨幅分别为 5.0% 和 7.2%。 需求：市场需求表现强劲，美国需求增长由数据中心扩张驱动。 CRU 发布 2026 年第三季度的行业需求预测。 2026 年第三季度，中国光缆消费量同比下降 3%，2026 年第二季度同比降幅为 6%，主要是光纤价格处于高位叠加电信运营商集中采购合同到期，造成电信端需求走弱。 受益于电信网络、超大规模数据中心扩张双重拉动，美国 2026 年第三季度光缆需求维持高增，同比增长 46%，2026 年第二季度同比增长 40%，环比增长 7%。 欧洲、东盟以及拉丁美洲市场需求实现稳健综合增长，同比增长 4%。 行业动态：产能扩张按计划推进；光纤需求保持稳健。 在中国市场，亨通 (600487.SH，未纳入覆盖范围) 公布 43 亿元人民币全新融资计划，资金投向光纤相关业务，涵盖光纤预制棒、特种光纤产能扩建，同时布局 CPO 及其他连接产品研发。 上述融资计划并未改变我们对于光纤供过于求风险有限的判断，预制棒扩产进度符合预期，但新型连接产品需要周期完成客户验证。 除此之外，长飞光纤 (688143.SH，未纳入覆盖范围) 公告取得客户 1.47 亿元人民币的 PM 光纤新订单。 我们判断该订单大概率用于下一代 AI 网络的部署。 美国市场，Verizon、AT&T 均和康宁签署多年期、数十亿美元规模合作协议，锁定充足光纤供给，既满足家庭、企业宽带业务爆发式扩张，同时支撑面向人工智能的全国长途骨干网络建设。 估值：ASP 将强于市场预期；重申对长飞光纤港股的 “买入” 评级。 我们近期首次覆盖长飞光纤，重申对中国光纤行业的积极观点；观点包含长飞光纤 (H)‑买入，长飞光纤 (A)‑中性。 我们认为光纤价格实际表现好于市场预期，行业预制棒产能扩张在未来 2 年以上时间依旧偏慢；下游连接产品、海外市场渗透 O AROUND WITH POP MART荷兰限定。\n\n## 五、stocks.json关注标的摘要\n\n当天没有形成有效的 stocks.json 命中证据。\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>英伟达重启“首选标的”评级，NDR 反馈印证乐观判断；管理层强调土地、电力、壳公司、融资、元器件短缺及代理业务等发展凸显竞争优势。同时，报告对其“把 AI 工厂作为抵押资产”的长期行业标准目标仍存疑。\u003c/li>\n\u003cli>光通信/CPO 供应链数据密集更新：Coherent 2025 年出货约 310 万个 800G 单元、ASP 415 美元，220 万个 1.6T 单元、ASP 1320 美元；2026 年预计 740 万个 800G、ASP 370 美元，320 万个 1.6T、ASP 1100 美元。英伟达、谷歌分别占其光模块销售额 48% 与 23%。\u003c/li>\n\u003cli>宏观层面，9 月非农新增 2.9 万，低于预期，失业率升至 4.2%；9 月 AI 债券发行未达预期被定义为“暂歇”而非“退潮”，不反映基本面走弱或缺乏建设资金。\u003c/li>\n\u003cli>半导体/先进封装焦点在 HBM 成本与规格变化：通过下调 HBM 内存规格，可消化 44% 销售成本上涨；若成本上涨全部来自 HBM，芯片价格涨幅最高可能达 100%-200%。HBM 层数减少可能促使客户增加晶圆投片量，反而利好刻蚀/沉积设备。\u003c/li>\n\u003cli>新能源/汽车分化：美国大储 8 月新增装机 743.3MW，同环比 -30%/-33%，备案量突破 66GW、环比 +2.1%；国内 9 月已公布车企/车型销量合计 72.6 万辆，同比 +16%、环比 +5%；特斯拉 2026Q3 交付 48.65 万辆，同比 -2%、环比 +1%，高于一致预期。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI 算力/大模型\u003c/strong>：强化逻辑是高毛利数据中心业务与 AI 软件服务业务加速增长，管理层强调土地、电力、壳公司、融资、元器件短缺及代理业务等发展凸显竞争优势；催化来自英伟达重启“首选标的”评级、NDR 反馈印证乐观判断，以及 SpaceX 管理层目标 2026 年底约 2GW 数据中心容量、2027 年底提升至 5-10GW，并追求每吉瓦营收最大化。\u003c/li>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>：强化逻辑是 HBM 成本压力与规格下调可能改变芯片价格与晶圆投片量，通过下调 HBM 规格可消化 44% 销售成本上涨；若成本上涨全部来自 HBM，芯片价格涨幅最高可达 100%-200%。HBM 层数减少可能促使客户增加晶圆投片量，利好刻蚀/沉积设备；催化来自日本科技投资者反馈 AI 投资与利率上行忧虑犹存但情绪边际改善，以及交付周期显示先进封装/基板 1-1.5 年、半导体设备 1-2 年、晶圆代工 3-4 年。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>：强化逻辑是 Coherent 800G/1.6T 出货与 ASP 预测更新，英伟达、谷歌占其光模块销售额 48% 与 23%；TEC 因 800G/1.6T 光模块放量、CPO/NPO 演进、HBM 与高功耗交换芯片热密度抬升，从可选器件走向关键器件。催化来自 Coherent 专家访谈更新 NPO、CPO、EML 与 OCS 产量、ASP 及供应链展望，NPO/CPO 大规模量产指向 2027 年，以及 FCC 或于 3.2T 出台光模块限制、海外物料链条或为重中之重。\u003c/li>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>：强化逻辑是 9 月 AI 债券发行未达预期，但被视为“暂歇”而非“退潮”；美国固定收益领域宏观背景而非供应过剩是至年底最大考验，预计回报率大幅下滑带来资金流出；超大规模科技公司对利率上升敏感度应仍较低。催化来自 9 月非农新增 2.9 万低于预期、失业率 4.2%、私人部门接近盈亏平衡，以及日本科技投资者反馈 7-9 月颓势难续、估值进入中期以下区间。\u003c/li>\n\u003cli>\u003cstrong>新能源/汽车\u003c/strong>：强化逻辑是美国大储 8 月新增装机 743.3MW，同环比 -30%/-33%，1-8 月累计 10437.3MW、同比 +10%，备案量突破 66GW、环比 +2.1%；另一口径 25Q4 美国储能装机 14.8GWh，同环比 +56%/9%，刷新最高单季记录。催化来自 9 月国内已公布车企/车型销量合计 72.6 万辆、同比 +16%、环比 +5%，比亚迪乘用车销量 456713 辆、同比 +16.2%、环比 +5.4%，以及特斯拉 2026Q3 交付 48.65 万辆、同比 -2%、环比 +1%，显著高于一致预期。\u003c/li>\n\u003cli>\u003cstrong>液冷/电源与散热\u003c/strong>：强化逻辑是 AI 算力持续扩张驱动硬件 TDP 不断抬升，散热成为产业核心瓶颈；800G/1.6T 光模块放量、CPO/NPO 演进、HBM 与高功耗交换芯片热密度抬升，共同推动 TEC 从可选器件走向关键器件。催化来自按 GPU 代数划分的每机架功耗和散热量梳理，以及美国大储数据中户储 0.8GWh、同环比 +27%/+7%，工商储 67MWh、同环比 -16%/-21%。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>英伟达重启“首选标的”评级，NDR 反馈印证乐观判断；管理层强调土地、电力、壳公司、融资、元器件短缺及代理业务等发展凸显竞争优势。\u003c/li>\n\u003cli>Coherent 专家访谈更新：2025 年出货约 310 万个 800G、ASP 415 美元，220 万个 1.6T、ASP 1320 美元；2026 年预测 740 万个 800G、ASP 370 美元，320 万个 1.6T、ASP 1100 美元；英伟达、谷歌分别占其光模块销售额 48% 与 23%。\u003c/li>\n\u003cli>9 月非农新增 2.9 万，低于预期；前两个月累计下修 6 万；劳动参与率 61.8%，高于预期 61.6%；失业率 4.2%，高于预期。\u003c/li>\n\u003cli>9 月 AI 债券发行规模未达预期，被视为“暂歇”而非“退潮”；超大规模云服务商表外承诺金额 3.6 万亿美元，仅一个月增加 5000 亿美元，主要来自英伟达。\u003c/li>\n\u003cli>交付周期数据：晶圆代工 3-4 年、半导体设备 1-2 年、先进封装/基板 1-1.5 年、存储系统 1-2 年、GPU/AI 加速器 6-12 个月、存储器（HBM/DRAM）6-12 个月、光收发器/网络设备 3-9 个月、CPU 3-6 个月、服务器 1-2 个月。\u003c/li>\n\u003cli>年度机架容量部署量预计从 2026 年 26.5 吉瓦增至 2030 年 104.5 吉瓦，其中 50.5 吉瓦专供英伟达使用；中国 GPU 国产化率预计从 2026 年约 10% 升至 2029 年 30% 以上。\u003c/li>\n\u003cli>中国光纤价格：2026 年 9 月 G657.A1 裸光纤价格 133.1 元/fkm，约 19.83 美元/fkm，环比 -1.6%，8 月环比涨幅 30.5%；相对美国市场价格溢价从 2026 年 8 月 23%、6 月 40% 收窄至 17%。\u003c/li>\n\u003cli>美国大储：8 月新增装机 743.3MW，同环比 -30%/-33%；2026 年 1-8 月累计装机 10437.3MW，同比 +10%；备案量突破 66GW，环比 +2.1%；另一口径 25Q4 美国储能装机 14.8GWh，同环比 +56%/9%，刷新最高单季记录。\u003c/li>\n\u003cli>国内 9 月已公布车企/车型销量合计 72.6 万辆，同比 +16%，环比 +5%；比亚迪乘用车销量 456713 辆，同比 +16.2%，环比 +5.4%，主要系海外销量大幅增长、纯电车型出口放量。\u003c/li>\n\u003cli>特斯拉 2026Q3 产量 46.44 万辆，同比 +4%，环比 +3%；交付量 48.65 万辆，同比 -2%，环比 +1%，高于一致预期 46.2 万辆，也高于 45.5 万-46.5 万辆区间和 43.5 万辆预测；Rivian 同日发布 2026 年第三季度交付数据。\u003c/li>\n\u003cli>中国 9 月国内乘用车销量下滑幅度可能进一步加剧，初步测算同比增速从 8 const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=(v)=>Array.isArray(v)?'<ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
