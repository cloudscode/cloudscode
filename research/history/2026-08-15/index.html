与。 Q9：高端存储业务（Infinite）整合后的协同效率如何？对未来拿单有多大帮助？ 答： 4 月份完成收购后，协同效应显著。以前存储业务更多是入门级产品且贴牌 NetApp，Infinite 补 齐了 ISG 最大短板，使公司从服务器硬件厂商升级为 AI 领域全栈数据基础设施提供商，拥有自主可控 高端存储软件定义平台。可提供 GPU 服务集群+自研高端存储端到端一体化方案，对标友商形成完整 竞品对位能力。该业务全年收入体量小（小几亿美金），当期对收入贡献有限，但与 AI 算力场景及 Infinite Box 深度耦合后，可适配 AI 大集群训练、大规模 AI 推理及知识库场景，与海神液冷整机方案 协同，有望提高一体化订单毛利率（高端存储毛利率可达 50%以上）。 Q10：国内服务器与海外服务器的毛利率或 margin 水平比较？ 答： 海外会稍微高一些，但国内也不低。目前 ISG 整体毛利率已提升至两位数水平。 原文 联想集团 20260814_原文 2026 年 08 月 15 日 发言人 在线的还有我的同事郑欣怡，我也是发布了 202627 财年的第一财季业绩，可以说是亮点非常多，看不 过来。首先公司整体的这个呢 HKFRS 的净利润是达到了 10.75 亿美金，同比增长了 176%。调整后的 这个净利率是提升到了四个百分点。这个最终的一个业绩表现是大幅度超出了我们和市场的乐观预期。 在板块当中我们也看到服务器所在的 RSG 板块，不仅仅是收入实现了接近乎翻倍的同比高增长，而且 在运营利润率上也来到了 9.1%的一个高水平，环比提升了 5.5 个百分点。在 IDG 层面上，尽管市场持 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 续担心上游零部件各种供应量，还有成本的压力冲击，但是公司在本个季度仍然是录得了 27%的一个 收入增长，并且运营利润率也维持在 7.1%的一个非常优秀的一个水平。 发言人 今天我们非常荣幸的有请到了公司的 IRD 鲍总，来和我们针对公司最新发布的这个材质的一个业绩做 分享和交流。上个财季其实公司整体的业绩也已经是取得了非常亮眼的一个表现，并带动了公司的股价 在过去一段时间里面取得了很好的一个相较于市场的表现。这个台阶我们来听一下鲍总帮我们分享一下 从公司业绩层面上来看，几个板块的一些核心要点，以及公司战略层面上的考量和指引，有请包总，谢 谢。 发言人 好的，感谢各位投资人，大家中午好，我是联想集团鲍晓刚。感谢参加联想集团 2027 财年第一季度的 业绩的沟通会，很高兴跟大家分享我们拿出了联想史上最强的一份季度的成绩单。是你可能要把那个什 么 mute 一下。营收创新高，然后调整后的净利润的话也是创了新高。AI 业务的创 AI 业务也是创新 高，再次证明了我们的战略前瞻性和正确性。在混合式 AI 战略卓越运营和不懈创新的驱动下，我们非 常有信心继续保持增长势头，实现长期可持续的增长以及盈利的持续提升。 发言人 首先来看一下集团层面我们的营收达到了 269 亿美金，折合人民币在 1834 亿元，年比年猛增 43%。 调整后的净利润达到了突破了 10 亿美元，突超过了 73 亿人民币，年比年增长了 176%。调整后的净 利润率达到了 4.0 个百分点，同比提升了近两个百分点，环比提升了 1.4 个百分点。同样重要的是我们 的业绩全面开花，所有业务集团的营收同时都实现了大双位数的高速增长，全部创下了同季度历史新 高。所有市场大区的营收也全都达成了 25%到 58%的超高速增长。随着混合式 AI 战略的扎实推进，我 们 AI 相关的营收加速成长到了百分之成长到了 600 600 多亿人民币，年比年增长 60%。 发言人 也就是说 AI 的它的增速会比我们营收的整体的营收的增速会更快一些。目前 AI 的这个占比已经占到了 整个集团营收的 35%左右。相辅相成。我们也持续加大创新投入，研发投入也是年比年大幅提升了 30 个百 30%。 发言人 另外就是在 IDG 业务这一块，IDG 业务的话在一季度也是创下了新高，达到了 171 亿美元，同比提升 了 27%。IDG 的毛利率稍微有些下降，是因为受存储价格上涨的影响。但是通过我们对运营效率的提 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 升以及费用的控制，使得我们运营利润率维持在 7.1 个百分点，环比略有提升。上个季度的话，联想个 人电脑的出货量达到了 1660 万台，同比下降了 2.1 个百分点，但是收入却年比年增长 30%。 发言人 这个主要是得益于较好的产品结构，还有我们 ASP 的持续提升。我们 ASP 同比增长了百分之高双位数 并且保持行业领新的盈利水平，运营利润率也是远超行业平均水平，我们也进一步巩固了个人电脑的全 球领导地位，PC 出货量 动久期缺口收窄， 其中负债端久期管理成效更为突出。 头部险企久期缺口普遍控制在-3年左右。2025年国寿久期缺口较低，仅为-1.5年， 国寿、太保、平安和人保寿险2025年久期缺口呈收窄态势，总体来看，由于持续增 配长久期债券，头部险企的资产负债匹配相对稳健，久期缺口处于持续收窄阶段。太 保的“哑铃型配置策略”是这一趋势的典型代表——一端以长久期利率债作为压舱石拉 长资产久期，另一端以权益资产提升长期收益弹性，中间压缩信用类资产敞口。不过， 同样也面临低利率环境下再投资压力与权益市场波动的双重挑战。 投资建议：当前低利率环境下，险企面临久期缺口和收益缺口的挑战困境。一方面， 人身险公司监管指标引导有效久期缺口在±5年以内，倒逼险企拉长固收资产久期， 增配利率债。但另一方面，持续低利率环境下，险企负债成本相对刚性，防范潜在利 差损隐忧不可忽视。可以客观看到的是，在系列监管政策落深落实后，行业整体修正 久期缺口得到有效收窄，资产负债匹配能力增强，板块估值底部有望得到有力支撑。 资金面再平衡有望延续，8月板块有望延续7月相对与绝对收益贡献。建议关注：中 国太保、中国财险、中国平安、中国人寿、新华保险。 风险提示：利率假设偏离风险；衍生工具运用不及预期；负债端结构调整风险；数据 披露及口径差异；研报更新不及时风险 仅供内部参考，请勿外传 行业深度报告 -2- 请务必阅读正文之后的重要声明部分内容目录 1.引言：保险资负匹配中的久期缺口..............................................................................4 1.1久期缺口的定义与分类......................................................................................4 1.2寿险公司久期缺口的成因..................................................................................4 2.资负新规征求意见稿：监管指标有效久期缺口需控制在±5年内............................6 3.久期缺口的计算与行业久期缺口数据统计...................................................................8 3.1指标选取............................................................................................................8 3.2规模调整后的久期缺口计算...............................................................................8 3.3寿险行业久期缺口调研数据统计.......................................................................9 3.4中小型寿险公司久期缺口变动趋势及原因......................................................10 3.5上市险企久期缺口调研数据统计分析..............................................................13 4.久期缺口管理的意义及措施.......................................................................................15 4.1从资产端管理久期缺口：拉长资产久期..........................................................15 4.2从负债端管理久期缺口：优化负债久期结构...................................................16 4.3新准则对久期缺口的影响及管理策略..............................................................16 4.4传统险对久期缺口敏感性更大.........................................................................17 4.5分红险占比提升对信用利差与期限利差的影响分析................... 中小型寿险公司久期缺口相对较大，2022年以来大多呈逐年扩张态势， 2025年有所收窄。我们从Wind数据库中拥有存量债券的39家保险公司中， 选取了24家在评级报告中披露“规模调整后的修正久期缺口”的未上市中 小型寿险公司作为样本进行统计。计算得出2022-2025年样本寿险公司的 久期缺口加权平均值分别为：-9.26、-9.82、-11.10和-8.74年。其中，中 华联合人寿、北京人寿与国联人寿久期缺口较大，2025年分别为-17.79、 -15、-14年，利率波动时资负变动难以相互对冲，风险较大。 经过分析及历年发债评级报告的表述变化，我们发现如下结论： 1.样本寿险公司久期缺口披露情况各有不同，变化明显。评级报告中明 确披露2025年久期缺口数据的公司有20家，部分公司2025年评级报告 中对久期缺口的表述相比2024年，从定量分析转为定性分析。具体来看， 中信保诚人寿2024年久期缺口高达-17.95年，但在最新评级报告中对缺口 表述转为“公司资产久期小于负债久期，资产负债存在期限错配风险”、“截 至2026年3月末，资产负债存在一定程度上的期限错配，但面临的资产负 债错配风险可控”。除该公司外，交银人寿、中银三星人寿、东方嘉富人寿 相比2024年，2025年评级报告未明确久期缺口数据。而工银安盛人寿 2022-2024年评级报告中对久期缺口的变化方向进行定性描述，2025年评 级报告中明确久期缺口为-6.2年，其绝对值低于行业平均水平，在银保系公 司处于久期缺口管理较好的层次。 2.样本寿险公司久期缺口相比2024年2025年平均收窄2.36年。从有 可比数据的公司来看，样本寿险公司久期缺口整体呈收窄趋势。缺口缩窄较 多的机构依次为：幸福人寿（缩短4.72年）、长城人寿（缩短3.72年）、 中英人寿（缩短2.53年）、同方全球人寿（缩短1.9年）、中华联合人寿 （缩短1.8年）、财信吉祥人寿（缩短1.65年）、建信人寿（缩短1.56年）、 中邮人寿（缩短1.19年）、农银人寿（缩短1.12年）。 3.样本寿险公司久期缺口差异显现。多数样本公司久期缺口于2022-2024 年处于持续扩大趋势，但在2025年呈现收窄情况，英大泰和人寿为样本中 小型寿险公司中少见的2022-2025年久期缺口持续扩大的寿险公司， 仅供内部参考，请勿外传 行业深度报告 -11- 请务必阅读正文之后的重要声明部分2024-2025年扩大了0.45年。此外，工银安盛人寿、中荷人寿、建信人寿、 光大永明人寿、华泰人寿、农银人寿、泰康人寿、幸福人寿资产负债久期缺 口绝对值低于行业平均水平，而中华联合人寿、北京人寿、国联人寿、同方 全球人寿、长城人寿、招商局仁和人寿、中英人寿、横琴人寿、财信吉祥人 寿久期缺口绝对值显著高于行业平均水平，久期缺口管理有待进一步改善。 4.样本中新发债公司积极披露久期缺口数据。近年来，随着偿付能力过渡 期逐步到期以及750天国债收益率平均曲线的逐季下移，寿险公司核心偿 付能力明显承压，永续债及资本补充债发行意愿提升。具体来看，本期样本 公司中新发债公司有4家，分别是东吴人寿、北京人寿、中荷人寿、横琴 人寿，均定量披露了详细久期缺口数据。其中，久期缺口管理较好的是中荷 人寿，久期缺口为-3.57，绝对值显著低于2025年行业平均水平。 图表11：2022-2025年24家中小型寿险公司的久期缺口统计（单位：年） 公司名称 2022202320242025境内存债规模（亿） 泰康人寿 —-8.11-9.01-8.16 200 工银安盛人寿 — — —-6.2 120 中信保诚人寿-14.26-16.22-17.95— 90 建信人寿 — —-8-6.44 80 中英人寿 — —-13.47-10.94 75 中邮人寿 —-7.66-10.09-8.9 62 招商局仁和人寿-7— —-11.07 57 农银人寿-5.84-7.33-8.55-7.43 55 中银三星人寿-7.52-10.75— — 48 长城人寿-10.67-12.12-14.95-11.23 36.5 东吴人寿 — — —-9.5 30 幸福人寿-10.3-11-13-8.28 30 交银人寿-5.81-6.58-7.9— 27 财信吉祥人寿 —-10.25-12.16-10.51 25 英大泰和人寿-4.64-6.36-9.06-9.51 25 光大永明人寿 —-8.8-7.19-7.11 24.7 同方全球人寿-9.27-9.45-13.33-11.43 20 北京人寿 — — —-15 14 东方嘉富人寿 — —-9.02— 14 中荷人寿 — — —-3.57 12.4 中华联合人寿-15.48-15.6-19.59-17.79 11 发展新模式。 “好房子”建设指南（试行）公开征求意见。 4月财政部等、住建 部围绕安全、健康、绿色、智慧提升住房品质。 扩大专项债项目“自审自发”试点范围。 财政部等 提升城市更新、存量盘活项目推进效率。 4—6月中共中央政治局、 国务院提出努力稳定房地产市场。 提出扎实推进城市更新。 城市更新行动部署六类任务、二十三项重点工作。 住房城乡建设部推动城市更新与存量空间提质。 公积金条例修订征求意见稿公开征求意见。 上半年中央层面拟拓宽缴存与提取使用范围。 稳市场、去库存、优供给。 中央层面 城市更新与“好房子”并重。 资料来源：财政部、人民银行、国务院、自然资源部、住建部等官网，中泰证券研究所 仅供内部参考，请勿外传 2026年1—6月地方政策回顾 2026年1—6月，核心城市聚焦限购优化、公积金、以旧换新、住房品质提升与城市更新。 时间施政主体 政策内容 1—2月北京、上海完善城市更新项目实施和支持机制。 推动老旧小区、危旧房及存量空间改造。 优化住房限购政策，支持合理住房需求。 上海、武汉提高公积金贷款额度，最高324万元。 优化限购及公积金贷款政策，支持合理住房需求。 4月武汉、青岛优化灵活就业人员公积金贷款测算。 完善二套住房贷款及商转公支持。 扩大公积金提取使用场景。 深圳、广州支持住房消费、维修和城市更新需求。 优化限购政策，支持合理住房需求。 提高公积金贷款额度，最高351万元。 4—5月广州提高公积金贷款额度，支持住房消费。 完善“卖旧买新”住房支持。 青岛鼓励国企市场化收购二手住房。 出台13项措施推进住房品质提升。 上半年核心城市推进城市更新及住房消费支持。 限购、公积金、以旧换新组合优化。 住房品质提升与城市更新联动推进。 地方政策政策聚焦降低置业门槛与使用成本。 核心城市仍是需求端优化的重要载体。 资料来源：北京、上海、武汉、青岛、深圳、广州相关政府部门官网，中泰证券研究所 仅供内部参考，请勿外传 “十四五”与“十五五”规划中提及房地产方面表述 “十四五”规划建议 “十五五”规划建议 五、形成强大国内市场，构建新发展格局 16.畅通国内大循环。 推动金融、房地产同实体经济均衡发展。 18.全面促进消费。 促进住房消费健康发展。五、建设强大国内市场，加快构建新发展格局 (15)大力提振消费。 完善促进消费制度机制，清理汽车、住房等消费不合理限制性措施。 六、全面深化改革，构建高水平社会主义市场经济体制 22.建立现代财税金融体制。 23.建设高标准市场体系。深化土地管理制度改革。推进土地、 劳动力、资本、技术、数据等要素市场化改革。六、加快构建高水平社会主义市场经济体制，增强高质量发展动力 (19)加快完善要素市场化配置体制机制。 全面摸清存量资源资产底数，优化资产负债结构。完善并购、破产、置换等政策，盘活用好低效用地、闲置房产、存 量基础设施。完善工商业用地使用权续期法律法规，依法稳妥推进续期工作 八、优化国土空间布局，推进区域协调发展和新型城镇化 31.推进以人为核心的新型城镇化。 实施城市更新行动，…，加强城镇老旧小区改造和社区建设。 坚持房子是用来住的、不是用来炒的定位，租购并举、因城 施策，促进房地产市场平稳健康发展。 有效增加保障性住房供给，完善土地出让收入分配机制，探 索支持利用集体建设用地按照规划建设租赁住房，完善长租 房政策，扩大保障性租赁住房供给。九、优化区域经济布局，促进区域协调发展 (30)优化国土空间发展格局。 赋予省级政府统筹建设用地更大自主权，探索实施建设用地总量按规划期管控模式，实行统筹存量和增量综合供地。 (31)深入推进以人为本的新型城镇化。 坚持城市内涵式发展，大力实施城市更新，建设创新、宜居、美丽、韧性、文明、智慧的现代化人民城市。 十一、加大保障和改善民生力度，扎实推进全体人民共同富裕 (41)推动房地产高质量发展。加快构建房地产发展新模式，完善商品房开发、融资、销售等基础制度。优化保障性住 房供给，满足城镇工薪群体和各类困难家庭基本住房需求。因城施策增加改善性住房供给。建设安全舒适绿色智慧的 “好房子”，实施房屋品质提升工程和物业服务质量提升行动。建立房屋全生命周期安全管理制度。 十三、推进国家安全体系和能力现代化，建设更高水平平安中国 (50)加强重点领域国家安全能力建设。 提高防范化解重点领域风险能力，统筹推进房地产、地方政府债务、中小金融机构等风险有序化解，严防系统性风险。 资料来源：wind、中国政府网、中泰证券研究所 仅供内部参考，请勿外传 CONTENTS 目录 CCONTENTS 专业｜领先｜深度｜诚信中泰证券研究所2板块财务分析 仅供内部参考，请勿外传 2.1.板块财务分析-营业收入 我们选取申万房地产板块的95家公司，以2025年年报数据作为板块数据的样本，另选取5家A股上市公司中销售排名靠前的大中型房企，作 为5家大中型房企进行着重分析，这5家包括：万科A、招商蛇口、滨江集团、保利发展、华发股份。 2025年，房地产板块营业收入为1.61万亿元，同比下降18.2%；5家样本房企营业收入合计8,626.2亿元，同比下降10.4%，降幅较板块低7.9 个百分点，头部房企收入韧性相对更强。 图表：房地产板块营业收入及同比增速 资料来源：iFinD、中泰证券研究所 图表：5家样本房企营业收入及同比增速 资料来源：iFinD、中泰证券研究所 仅供内部参考，请勿外传 2.2.板块财务分析-归母净利润 2025年，房地产板块归母净利润亏损2,000.3亿元，较2024年亏损增加409.4亿元；5家样本房企合计亏损938.8亿元，较2024年亏损增加 569.4亿元。其中，万科A亏损885.6亿元，招商蛇口、滨江集团和保利发展归母净利润分别同比下降74.6%、16.9%和79.3%，仍保持盈利， 而华发股份由盈利转为亏损。收入规模下行与结算毛利率压缩仍是利润承压的主要表内表现，项目结算结构及减值压力差异进一步放大了 业绩分化。综合来看，行业波动调整的背景下，剔除万科的影响，大中型房企收入优于板块，但业绩表现承压。 图表：房地产板块归母净利润及同比变动（亿元） 图表：5家样本房企归母净利润及同比变动（亿元） 资料来源：iFinD、中泰证券研究所 资料来源：iFinD、中泰证券研究所 仅供内部参考，请勿外传 2.3.板块财务分析-销售回款 2025年，房地产板块销售商品、提供劳务收到的现金为1.14万亿元，同比下降22.3%；5家样本房企销售回款为5,816.1亿元，同比下降 23.4%，降幅较板块高1.1个百分点。整体来看，板块和大中型房企销售现金回流均显著下滑，主要因素是行业销售端调整波动所致，后续 回款修复仍需关注核心城市成交与融资环境的边际变化。 图表：房地产板块销售回款及同比增速 图表：5家样本房企销售回款及同比增速 资料来源：iFinD、中泰证券研究所 资料来源：iFinD、中泰证券研究所 仅供内部参考，请勿外传 2.4.板块财务分析-盈利能力 2025年，房地产板块销售毛利率为13.4%，较2024年下降1.1个百分点；销售净利率为-13.7%，下降5.3个百分点。5家样本房企销售毛利率 为11.7%，下降0.9个百分点；销售净利率为-10.7%，下降7.6个百分点。5家大中型房企，受万科A、华发股份亏损拖累，除万科、华发以外， 其余三家盈利能力及运营能力显著优于板块，在行业政策持续放松的背景下，未来有望率先受益于行业的复苏。 图表：房地产板块销售毛利率及销售净利率 图表：5家样本房企销售毛利率及销售净利率 资料来源：iFinD、中泰证券研究所 资料来源：iFinD、中泰证券研究所 仅供内部参考，请勿外传", "status": "extracted"}, "post:2026-08-15T10-15:5b6789615496": {"id": "post:2026-08-15T10-15:5b6789615496", "kind": "post", "title": "2026-08-15 10:15", "source_label": "帖子正文", "excerpt": "闪迪举办投资者日活动。野村重点梳理其对铠侠控股（285A，买入评级）及NAND市场的指引意义：本次披露信息为权益市场提供了更清晰的NAND长期能见度，闪迪亦反复强调与铠侠的制造协议及联合开发的BiCS系列技术竞争力的重要性。", "content": "闪迪举办投资者日活动。野村重点梳理其对铠侠控股（285A，买入评级）及NAND市场的指引意义：本次披露信息为权益市场提供了更清晰的NAND长期能见度，闪迪亦反复强调与铠侠的制造协议及联合开发的BiCS系列技术竞争力的重要性。 核心指引与产业信号： 1. 盈利预期极具韧性：闪迪预计2026年6月-2028年6月营收复合增速达15%-19%，非GAAP毛利率约80%、非GAAP营业利润率约75%。即便多年期合约采用底价定价，公司仍有望实现80%的毛利率水平，凸显其盈利韧性。 2. AI数据中心成NAND需求核心驱动力：闪迪预测2030年AI数据中心SSD出货量将达1200EB，其中KV缓存应用占比35%（即420EB）。尽管需确认闪迪对KV缓存的定义是否与英伟达“CMX”一致，但其提出的2026年NAND总出货量达1200EB的预期，至少再次验证了KV缓存应用有望成为NAND需求增长的核心引擎。 3. 高带宽闪存（HBF）开启架构变革：闪迪计划2027年向客户交付首批面向推理场景的HBF样品，其架构方案提出可将部分或全部高带宽内存（HBM）堆栈及芯片 tent": "中芯国际 2026Q2 业绩说明会纪要 20260814 要点总结 1.二季度财务业绩 销售收入 30.06 亿美元，环比增长 20%；毛利率 25.3%，环比增长 5.2 个百分点。 经营利润 5.34 亿美元；息税折旧及摊销前利润（EBITDA）21.09 亿美元，EBITDA 利润率 70.2%。 归属于本公司应占利润 4.79 亿美元。 二季度末总资产 572 亿美元，其中库存资金 139 亿美元；总负债 193 亿美元，其中有息负债 140 亿美元；总权益 379 亿美元；有息债务权益比 37%，净债务权益比 0.4%。 二季度经营活动所得现金金额 25.22 亿美元，投资活动所用现金金额 22.71 亿美元，融资活动所得 现金金额 6.07 亿美元。 2.上半年财务业绩 销售收入 55.11 亿美元，同比增长 23.7%；毛利率 22.9%，同比上升 1.5 个百分点。 经营利润 7.82 亿美元；EBITDA 35.45 亿美元，EBITDA 利润率 64.3%。 归属于本公司应占利润 6.77 亿美元。 上半年资本开支合计 34 亿美元。 3.三季度指引 销售收入预计环比上升 2%到 4%；毛利率预计在 26%到 28%之间。 出货量预计继续增长，价格保持稳健；在抵消三季度新增折旧和暑期电力高峰后，毛利率环比继续 提高。 新增产能后的产能利用率预计维持在 95%左右的高位，有效摊薄单位固定成本。 4.二季度运营情况 出货量环比增长 14.4%，晶圆平均销售单价（ASP）环比提升 5.7%。 出货量增加主要源于人工智能对配套芯片需求激增及客户提拉出货。 新增 8000 片折合 12 英寸月产能；产能利用率 93.7%，环比增长 0.6 个百分点。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 收入按地区分类：中国、美国、欧亚占比分别为 90%、8%和 2%，金额均有增加；中国区增长幅度 最大达 22%，主要原因为 AI 配套芯片需求旺盛、海外订单回流及在地化制造继续加强。 按尺寸分类：12 英寸和 8 英寸占比分别为 78%和 22%；12 英寸晶圆收入环比增长 24%，8 英寸 晶圆收入环比增长 11%。 按应用分类：智能手机、电脑与平板、消费电子、互联与可穿戴、工业与汽车收入占比分别为 17%、16%、44%、7%和 17%，绝对值环比均有提升。 公司将产能更多调配给需求紧缺领域，AI 配套、电脑与平板、工业与汽车收入绝对值环比增长约四 成；手机、消费、互联与可穿戴收入绝对值分别实现 8%、16%和 13%的增长（受客户提前拉货抵 消终端下行影响）。 毛利率环比提升主要因 ASP 上升与产能利用率好于预期，抵消了折旧增加对毛利率的拖累； EBITDA 利润率环比提升近 13 个百分点至 70%。 5.下半年展望与行业判断 下半年人工智能产生的产业推动与溢出效应将继续为集成电路制造带来广泛需求；公司灵活调配已 有产能、快速验证新增产能，帮助缓解产业链紧缺局面。 供应链成本上升压力已向制造环节传导，公司将积极应对，努力将影响降到最低。 管理层对行业走向和公司发展保持乐观看法。 6.价格与供需情况 中芯国际不采用一次性统一调价方式，而是与客户逐一协商；今年 2-3 月已按行业趋势与客户进行 了一轮部分产品涨价谈判。 涨价主要集中在产能最紧缺、公司有竞争优势的领域（AI 配套芯片相关）；手机类、面板驱动类等 产品至今并未涨价，与客户共度难关。 公司永远不是第一个涨价、也不是涨得最高的，但在业界有口碑，与客户协商价格较为合理。 供不应求领域：与算力/AI 数据中心相关的配套芯片（逻辑电路、BCD、光模块发送接收等）、电 源管理/电源供应（一个 72 个 GPU 的机柜中电源管理器件需求达 16000 多个）、HBM/DRAM、 SSD 驱动、冷却电机驱动等。 海外存储器公司因 AI 配套芯片增加而挤压传统业务（如专用 logic、NOR flash、SLC NAND 等不 再做），这些领域产能远不能满足需求，价格持续上涨。 手机相关芯片和显示驱动 DDIC 等此前无人愿意做的领域，因产能紧缺已出现回流趋势，客户开始 协商未来产能和价格布局，预计价格将逐步上涨。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 去库存主要集中在手机方面；面板驱动等消费类库存不高但需求不旺；随着产能紧缺，客户担心来 年拿不到产能或涨价，已开始备货。 7.产能分配与定价权原则 产能分配第一优先考虑长期战略合作客户，兑现过去对客户的承诺；不是后来者出更高价格就转 向。 在公司已达业界第一梯队水平的领域，若业界价格与公司价格差距大，会与客户协商给予公司适当 确认和认可，具备一定定价权。 公司产品分为 8-10 个赛道、5 大应用场景（未来将细分为 6-7 个场景，包括单独列出 AI 套片）， 不同场景紧缺程度不同，分别采取支持产能/技术研发或支持价格共度难关等不同策略。 8.折旧与 EBITDA 展望 今年折旧同比上升约 30%，上半年折旧约 23 亿美元，全年总额接近 50 亿美元。 二季度折旧量 12.2 亿美元，每个季度增长约 1.2-1.4 亿美元。 每个季度折旧增加影响毛利率约 4%-5%。 根据已公告的项目扩产计划，2027 年将达折旧高峰；但公司正根据市场和订单情况调整扩产计 划，实际峰值时间存在不确定性。 二季度 EBITDA 利润率超 70%为历史高点，部分受一次性收益（联营公司金融资产公允价值变动） 影响；三季度该收益存在不确定性，但毛利率指引继续提升，EBITDA 总体应能保持高位向好。 9.毛利率驱动因素拆解 涨价因素影响大于产品结构优化。 产品结构优化体现在：客户不需要的领域产能调配至客户更需要的领域（如逻辑电路产能调配做 MCU、s memory，RCD driver 产能调配做 NOR flash 等）。 新增产能均为客户提前订购，上量直接满载，产品好、价格好，带来结构性优势。 三季度价格效益体现更多：二季度出货的很多晶圆是一季度甚至去年四季度下线的（旧价格），三 季度开始出货或下线的均使用新价格。 10.BCD 平台与模拟电路景气度 AI 产业推动两头：一头是先进算力/标准逻辑，另一头是非常成熟的模拟电路（尤其 8 英寸需求增 长远超想象）；中间环节（40nm、28nm）是被溢出效应推动的。 BCD 平台需求和价格走势坚挺，持续供不应求。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 模拟电路产品类型极多（国外巨头动辄 20 万-30 万个型号），没有任何一家能完全覆盖；单一需求 量大的可快速上量（包括用 12 英寸做），但需求量小、需长期供应（未来十年不断供）的产品无 法短时间转移。 8 英寸设备更成熟，12 英寸产线做 65nm/50nm 时部分设备相当于 22nm 或更先进，老型号搭配 需磨合时间，不一定能立刻取代 8 英寸。 48V 高压大电流产品基本在 8 英寸上，耐压需达 80-100V，需长期验证，供应者较少；部分单一大 宗产品正逐渐向 12 英寸转移。 需求可见性可看到来年年底；数据中心/GPU 建设不会浪费，每片 GPU 或算力 ASIC 必然搭配模拟 电路、电源供应、光模块、数据管理、HBM、SSD 等配套。 问答整理 Q1（华泰证券 黄乐平）：二季度出货量增长 14.4%的来源是什么？产能增长仅 1.7%、产能 利用率小幅增长，出货量明显快于产出增速，主要来自新厂启动贡献还是制品/成品库存释 放？AI 配套芯片具体是什么样的产品？ 答：二季度营业额增长主要来自出货增加和价格因素。出货量增加是因为客户需要晶圆越快越多越好， 公司将靠近出货的部分加速、新投片的地方放缓，在产能一样的情况下分配给后段工艺制造能力更强， 多给客户出货。另外，中芯国际过去几年建的产能一直在验证——新设备进来搭产线、放产品、客户到 终端 PCN 开出，平均约 16 个月，前几年投资的产能在客户需求下都冲上来了，有一部分是产能净增 量。关于 AI 配套芯片，公司笼统讲了 AI 配套芯片和电脑与平板合起来有四成成长，但目前报告还比较 严谨，因为客户交流中关于产品用途的分类（AI 套片、server 等）以前没有单独列项，数据还不能说 得很细，下个季度或更晚些时候会把 AI 配套芯片单独拉出来。需求是巨大的，提前拉货增加很多，报 告中说增加相比应有四成。 Q2（华泰证券 黄乐平）：三季度指引收入环比增长 2%-4%，毛利率继续上升 （25.3%→26%-28%），是否意味着毛利率继续往上走？出货量是否因提前发货影响而相对 平稳？ 答：营收来自出货量和价格两个因素。二季度出货的很多晶圆是一季度甚至去年四季度下线的，还是旧 价格；中芯国际定价从下线开始算，新订单新下线用新价格。三季度开始出货或继续下线的都使用新价 格，价格带来的效益在第三季度体现更多，带来毛利率成长。每个季度都有很大折旧增加，约影响毛利 率 4%-5%，三季度还能增加说明没有折旧增加的情况下增长更多。产能基本是匀速直线增加、爬坡均 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 匀，上季度平均每月增加 8000 片 12 英寸，二季度增加量也差不多。三季度没有更多提拉，因为再提 拉会破坏产线匀速直线运营，公司需要平衡客户提拉要求和产线健康运营。 Q3（中信证券 王子源）：今年以来代工提了几次价格？每次幅度如何？涨价是针对部分产品 还是全面？下半年到明年是否还有提价空间？Q2 ASP 990-991 美元、等效 8 英寸环比提升 5.7%，其中单纯提价和产品组合结构变化的影响分别多少？ 答：中芯国际没有一次性发通报统一提价，都是跟客户商量。公司涵盖的细分赛道和客户不一样，在产 能紧张、供不应求、公司有优势的地方提价早一些。今年手机、汽车和工业实际是下行的，这些领域没 有涨价或推迟。今年 2 月左右跟客户业界宣布涨价，在最紧俏、产能最紧缺的部分协商后提了价钱。一 季度已体现 5.7%的营业增长，二季度毛利率进一步上升但折旧增加了 4%以上，考虑这个因素，二季 度毛利率比一季度大概高 9%-10%，体现涨价影响在一季度谈成、二季度开始释放。接下来在满载供 不应求的产能部分会继续跟客户协商，跟业界看齐，达到合理价格取向。中芯国际永远不是第一个涨价 的，也不是涨得最高的。 Q4（中信证券 王子源）：哪些细分应用需求边际上变得更紧张？哪些应用可以带来更高附加 价值？ 答：价格走向跟供需关系密切相连。供不应求且公司有竞争力的地方价格一定会起来。目前跟算力相关 的细分市场、算力电路板配套的器件（配套芯片）都紧张，需求量会更大。美国方面 AI 投资从上季度 说的 6000 亿美元提升到 8800 亿美元，中国互联网公司也大幅提高硬件投资，都超出原来预测。客户 谈以后的合作和下限量都远超预期。直接相关的包括数据中心电路板、算力板配套芯片（逻辑电路、 BCD、光模块发送接收等），长期供不应求。海外因 AI 配套芯片增加挤压了传统业务，存储器公司不 再做专用 logic、NOR flash、SLC NAND 等，这些领域产能远不能满足需求，价格一直上涨。手机相 关芯片和显示驱动 DDIC 等此前没人愿意做的领域，现在已拿不到产能，开始协商未来产能和价格布 局。整个产能不够的情况下，先是 AI 配套直接受益，接下来是 AI 挤压效应，再接下来其他相关行业芯 片（手机类、面板驱动类）也会因得不到产能而逐步涨价。 Q5（中金公司 张宇康）：产能利用率高位运行能否持续？电源管理、MCU、CIS、显示驱 动、模拟等成熟制程门类如何归类（供不应求/供需平衡/去库存）？车规和工业是否已从补库 存转为终端复苏？ 答：行业热度不一样。供不应求的是跟 AI、算力、数据中心、边缘计算相关的产能，主要是逻辑电路 相关，以及所有板子里跟电源管理/电源供应有关的——CPU、HBM/DRAM、SSD 驱动、冷却电机驱 动、光模块电源都需要，量非常大。一个机柜 72 个 GPU 加配套，电源供应/电源管理一项就达 16000 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 多个。去库存主要在手机方面，提拉了一些货后库存慢慢降高。面板驱动等消费类价格很低、下单少、 库存不高，但需求不旺。随着产能紧缺，大家担心来年手机和消费类需求回来时储备库存不够、拿不到 产能，所以开始备货；也担心来年涨价、供应链涨价、封装材料涨价，现在多备一点。中芯国际汽车类 和工业类比值增加，是因为这些客户的产品既可供应汽车/工业，也可供应手机/面板，最近坚持下货主 要用于汽车和工业类，手机和消费类用得少，所以公司这方面出货实际下降但比值增加。 Q6（中金公司 张宇康）：公司在消费、工业、车规、AI 客户之间按什么原则分配产能？剔除 产品组合后不同类别工艺价格环比升降多少？三季度所有价格增量是否都已谈完，还有未兑现 部分吗？ 答：价格方面，行业启动较早，中芯国际今年 2-3 月按行业趋势跟客户谈了一次，是部分涨价而非所有 产品。手机类产品一直到现在没有涨价，DDIC 面板驱动也没有。随着产能供不应求和大家对来年手机 和消费类回升的备货需求，会判定这些价钱、分配产能。产能分配第一考虑长期战略合作，过去答应给 客户建设的产能优先供应，不是后来者出更高价就转向。第二，在公司有竞争优势、已达业界第一梯队 水平的领域，若业界价格与公司价格差距大，会跟客户协商给予适当确认和认可，有一定定价权。其他 方面做到业界最好水准，但价钱跟业界情形一起走，不会在业界下行时主动减产能或加价钱。公司产品 分 8-10 个赛道、5 大应用场景（未来细分到 6-7 个，包括单独列出 AI 套片），不同场景紧缺程度不 同，有些客户对价格不敏感但要求支持产能和技术研发，有些要求支持价格共度难关。今年消费类和手 机类跟客户共度难关，没有涨价也没有大幅减产，手机类消费类营业额持续增长，客户要拉货优先给。 Q7（东方证券 款项）：二季度 EBITDA 利润率超 70%，在公司和全球晶圆厂对比中都非常 优秀。三季度毛利率继续提升、折旧占比高位，后续 EBITDA 利润率如何展望？ 答：分近期和远期。今年已给三季度指引，订单已收到四季度和年尾，今年之内没有看到降价可能性， 至少维持。中芯国际已达到的价格、毛利率、产能利用率都是可预测、可连续、可持续的。今年折旧增 加约 30%，二季度折旧量 12.2 亿美元，全年 49-50 亿美元，每个季度增长 1.2-1.4 亿美元。如果没有 价格增长，就要减掉折旧增加的份量。产能利用率 95%基本维持，会留出 5%产能做研发，不会再提 高。接下来价格进一步释放主要体现在原来价格偏低的消费类、手机类、面板驱动类产品，但今年不会 有很大幅度提升。简言之，如果没有折旧增加，毛利率本来可以维持，但折旧每季度增加会有一些降 低；消费类价格提升会补偿一部分，但不会非常大。公司处在非常好的时期，技术和产品受客户欢迎。 吴俊峰补充：Q2 EBITDA 达历史高点，除毛利率和本年利润外，还受其他收益一次性影响（Q2 体 现）；Q3 来自联营公司金融资产公允价值变动有不确定性，会对 EBITDA 有影响，但折旧一直在增 加、Q3 毛利率指引增加，EBITDA 总体应能保持高位和向好，剔除一次性影响。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Q8（国泰海通证券 罗通）：26 年折旧同比增长超 30%，理论上毛利率压力较大，但本季度 和下季度毛利率都在提升。从涨价和产品结构优化两方面看，哪个贡献占比更高？ 答：涨价因素影响大过产品结构优化。产品结构优化有一定灵活性，但不是说产能可以给张三也可以给 李四、谁价钱高就做谁。产能优化主要是客户不需要的领域调配到客户更需要的、价钱更高的地方—— 比如逻辑电路减少一点拿去做 MCU、s memory，原来做 RCD driver 的拿出来做 NOR flash。新增产 能都是客户提前订购的，客户说来年需要多少产能，公司买了产能后上量直接满载，都是比较好的产品 和价钱，带来优势。 Q9（中信里昂证券 Tony）：之前预期今年折旧费用同比上涨 30%，现在看折旧情况如何？ 下半年预计折旧具体金额？折旧何时达到峰值或拐点？ 答：吴俊峰：之前业绩发布会说过今年折旧同比上升约三成。上半年折旧约 23 亿美元，全年预计折旧 增长与之前说的基本一致，上升 30%左右，总额接近 50 亿美元。根据已发布的项目扩产计划，2027 年应是折旧高峰；但扩产计划在逐步调整，根据市场和订单情况做相应安排，峰值时间有不确定性。目 前看 2027 年折旧会进一步增长，二期之后 capex 投入的资产逐步进入折旧，折旧还会进一步增长。赵 海军补充：已公告的固定资产投资 capex 可以算出确切哪个季度达到峰值，按已公告的到今天为止， 2027 年达到最高峰。但从今年 2 月开会时对 AI 和客户需求的预测，到今天收到客户要求备产能，中间 有很大变化（增长），公司正在调整各厂已有空间进一步增加设备，会陆续在沟通会或公告中说明。以 前讲的峰值就是最后一个峰值、以后逐年下降、毛利率越来越高，现在不能这样讲。在扩产过程中会牢 记保证毛利率和竞争优势，不对公司表现产生特别大的负面影响，会不断与投资者交流。 Q10（国海证券 福建）：BCD 工艺平台当前供需和价格走势与其他环节景气度差异？AI 需求 带动影响有多大？不同模拟公司在产品切换和工艺差异上有何不同？ 答：AI 带动的新产业首先推动两头：一头是先进算力/标准逻辑，另一头是非常成熟的模拟电路（尤其 8 英寸需求增长远超想象）；中间环节（40nm、28nm）是被溢出效应推动的，没有任何东西可以直 接进入跟算力和 AI 数据中心有关的部分。BCD 产能供不应求，所有做 BCD 做模拟电路的都在讲大幅 成长。第一，产品类型非常多，B 系列模拟电路是长期经营慢慢积累的，没有任何一家能完全吃掉，只 能吃掉要求最高、价钱最好的部分。国外巨头模拟电路动辄 20 万-30 万个型号，单一需求量大的可迅 速上量（包括用 12 英寸做），但需求量小、未来十年要一直供应不能断的，几千个产品不可能短时间 拿过去；每月只有 100 片的换成 12 英寸一个月不到，下线都不方便。8 英寸设备更成熟，12 英寸产线 做 65nm/50nm 时有的设备相当于 22nm 或更先进，老型号搭配需磨合，不一定立刻取代 8 英寸。 48V 高压大电流需求量大、供应者少，耐压需达 80-100V 才能工作在 48V，需长期验证。需求可看到 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 来年年底没问题，因为数据中心和 GPU 建设不会浪费，每片 GPU 或算力 ASIC 一定搭配模拟电路、电 源供应、光模块、数据管理、HBM、SSD 等。BCD 平台需求和价格走势一直坚挺、供不应求。不同公 司差异看两点：一是电压，要求做高压一点可节省导线、提供更大电流，从 48V 变到 1V，48V 需求量 较大、供应者较少、可靠性要求高；二是跟原来经营多年的大客户有十来年联系，突然爆发时可以攻上 去，如果现在再转移客户就慢一点。 原文 中芯 2026-08-15T20-33:dcfc4d023028": {"id": "post:2026-08-15T20-33:dcfc4d023028", "kind": "post", "title": "2026-08-15 20:33", "source_label": "帖子正文", "excerpt": "【东吴电新】国内7月储能并网16gwh，创历史同月新高超预期！#7月国内新增装机量创历史同月新高。", "content": "【东吴电新】国内7月储能并网16gwh，创历史同月新高超预期！ #7月国内新增装机量创历史同月新高。26年7月国内新型储能新增装机4.90GW/15.77GWh，同增46%和75%，新增能量规模创历年7月新高。1-7月累计装机约74gwh，同增14%。 #独立储能贡献主要增量占比7成、配储时长持续提升创年内新高。7月新增装机中网侧独立储能装机3.45gw/11.7gwh，同比+58%/+94%，环比+33%/+75%；占总装机70.3%；电源侧储能装机1.16GW/3.46GWh，同比+59%/+69%，环比-37%/-32%；电源侧新增功率装机中98.6%来源于新能源配储项目，其对应新增装机规模1.14GW/3.44GWh，同比+57%/+68%，环比-18.4%/-0.3%。#整体配储时长约3.22h创年内月度新高，主要系内蒙古、新疆相继有多个GWh级（≥4小时）长时独立储能项目实现投运，其中独储平均时长3.39h，同增23%，新能源配储平均时长3.01h，同增8%。 #内蒙新疆等省领衔增长。分区域看，7月华北地区新增装机2.23GW/8.09GWh，占比超过全国50%。西北...", "publish_time": "2026-08-15 20:33", "tags": ["文字观点"]}, "attachment:files/中泰证券-宇树科技(688836)四足与人形出货量全球第一，具身智能时代的全栈自研本体龙头-260814.pdf": {"id": "attachment:files/中泰证券-宇树科技(688836)四足与人形出货量全球第一，具身智能时代的全栈自研本体龙头-260814.pdf", "kind": "attachment", "title": "中泰证券-宇树科技(688836)四足与人形出货量全球第一，具身智能时代的全栈自研本体龙头-260814", "source_label": "中泰证券", "excerpt": "请务必阅读正文之后的重要声明部分宇树科技：四足与人形出货量全球第一，具身智能时代的全栈自 研本体龙头 宇树科技（A688836.SH） 汽车", "content": "请务必阅读正文之后的重要声明部分宇树科技：四足与人形出货量全球第一，具身智能时代的全栈自 研本体龙头 宇树科技（A688836.SH） 汽车证券研究报告/新股研究报告 2026年08月14日 评级：无 分析师：何俊艺 执业证书编号：S0740523020004 Email：hejy02@zts.com.cn 分析师：刘欣畅 执业证书编号：S0740522120003 Email：liuxc03@zts.com.cn 分析师：袁泽生 执业证书编号：S0740525070006 Email：yuanzs01@zts.com.cn 基本状况 发行后总股本(百万股)404.46 本次发行股本(百万股) 40.45 发行价(元) 150.80 发行市值(百万元) 60,993.22报告摘要 四足+人形出货全球第一，率先盈利的高性能通用机器人本体龙头。宇树科技成立于 2016年，深耕高性能机器人全栈自研，以四足机器人为根基逐步拓展至人形机器人与 核心组件，已形成\"四足+人形+组件\"完整产品矩阵。四足机器人2023-2025年累计销 量超3.3万台、连续多年全球第一；2025年人形机器人出货超5500台居全球第一， 是当前唯一实现科研教育、商业消费、行业应用全场景批量交付的厂商。创始人王兴 兴通过特别表决权合计控制发行后表决权65.31%，控制权稳固，美团、腾讯、阿里、 蚂蚁、中国移动等产业资本与红杉、经纬等头部机构在列。 四足商业化已落地、人形站在放量前夜，中国有望成全球最大单一市场。1）四足机 器人已进入商业化起步阶段，巡检、消防应急率先落地并向工业延伸，据GGII，2030 年中国四足销量有望超77.9万台、2025-2030年CAGR达68.4%，市场规模有望超 160亿元。2）人形机器人仍处技术探索的商业化初期，中短期以科研教育、表演、服 务为主，中长期瞄准工业与家庭，据GGII，2030年全球人形市场规模约150亿美元、 CAGR超56%，中国近380亿元、CAGR超61%。3）行业景气由\"运动可用性—模 型智能化—量产降本\"三重驱动；行业形成\"技术—资金—品牌\"三重进入壁垒，头部先 发优势显著。 收入爆发式增长、毛利率显著领先，全栈自研+量产领先构护城河。经营现状： 2023/2024/2025年营收1.59/3.93/16.99亿元，2025年同比+333%，2022-2026年 营收CAGR约140%。2024年扭亏、2025年归母净利润2.78亿元（同比+191%）， 是率先盈利的机器人公司，人形收入占比由1.9%升至51.8%成第一大收入来源。竞 争优势：①核心部件电机、减速器、关节模组、激光雷达、灵巧手全栈自研，2025 年综合毛利率60.44%，显著高于可比公司均值；②\"小脑\"运动控制率先产品化，多 次实现全尺寸电驱人形空翻、5m/s奔跑等全球首例；③以四足利润支撑人形研发、 技术复用摊薄成本，量产领先积累供应链磨合与场景数据飞轮。 以量补价打开成长空间，具身大模型与制造产能决定长期天花板。1）量价驱动：人 形销量由2023年5台增至2025年5215台、以价换量（均价3年降72%）推动收 入8.1倍增长，四足销量3年增7.4倍。行业级维持高客单高毛利、消费级沿智能手 机降价路径放量，双轨并进。2）产能驱动：IPO拟募资42.02亿元投向\"模型—本体 —新产品—制造\"全链条，制造基地建成后预计年产7.50万台人形+11.50万台四足， 较现有产能数量级跃升。3）模型驱动：近半募资投向具身大模型，公司已开源WMA （UnifoLM-WMA-0）与VLA（UnifoLM-VLA-0）模型并接入英伟达Isaac生态，本体 量产反哺真机数据飞轮，是长期发展的核心变量。 风险提示：行业需求与商业化进度不及预期的风险；价格竞争加剧与毛利率下行的风 险；产能交付与制造纵深不及预期的风险；具身大模型研发与装机不及预期的风险； 出口合规与股份支付口径波动的风险；信息滞后与行业测算偏差的风险。 仅供内部参考，请勿外传！ 新股研究报告 -2- 请务必阅读正文之后的重要声明部分内容目录 1、宇树科技：机器人本体龙头，四足与人形出货量全球第一..................................4 1.1发展历程：十年全栈自研，从四足到人形的产品矩阵完善..........................4 1.2股权结构：实控人特别表决权稳固控制，产业与头部机构资本加持...........9 1.3财务分析：收入爆发式增长，盈利能力优势显著......................................10 1.4产能与研发布局：采用柔性生产，募投42亿元加码大脑与制造基地.......14 2、机器人市场：硬件整机先行，人形站在具身智能放量前夜................................15 2.1机器人赛道：整机制造处在具身智能产业链中枢......................................15 2.2市场与空间：双轨驱动，中国有望成为全球最大单一市场........................17 2.3技术演进：小脑优势率先产品落地，大脑决定长期天花板........................19 2.4商业化与空间：以劳动力替代为锚，按场景分层定价...............................21 2.5竞争格局：国内出货领先，行业有技术-资金-品牌三重壁垒.....................24 3、对比全球龙头：量产与运控已领先，大脑是决赛...............................................26 3.1技术与本体：对标特斯拉，强在“小脑”短板在“大脑”........................26 3.2量产与交付：快速出货抢占市场反哺研发，制造能力亟待补强................28 3.3模型与数据飞轮：尚未收敛，长期重估的核心变量...................................29 4、风险提示..............................................................................................................30 图表目录 图表1：宇树科技发展历程.......................................................................................4 图表2：宇树科技人形机器人产品介绍............ 控制及AI服务器带动片式元器件需求增长，纸质载带及配套材料稳步扩容。洁美科技全球市占率超过60%，仙鹤股份凭借工业棉纸领域的长期积累，有望持续受益于产业链需求增长。 3）芳纶纸：AIDC、电网升级及新能源装机推动高等级绝缘材料需求扩容，海外供应体系调整为国产厂商打开份额提升窗口。民士达产能持续扩张、客户认证深入推进，全球市场份额具备提升空间。 欢迎交流：蔡方羿/米雁翔/仲敏丽/尹姜子/许健玮#文字观点", "publish_time": "2026-08-15 21:37", "tags": ["文字观点"]}, "attachment:files/中泰证券-氧化锆行业专题研究：稀土供给变局造就替代机遇，新兴应用打开需求空间-260812.pdf": {"id": "attachment:files/中泰证券-氧化锆行业专题研究：稀土供给变局造就替代机遇，新兴应用打开需求空间-260812.pdf", "kind": "attachment", "title": "中泰证券-氧化锆行业专题研究：稀土供给变局造就替代机遇，新兴应用打开需求空间-260812", "source_label": "中泰证券", "excerpt": "1 中 泰 证 券 研 究 所 专 业 ｜ 领 先 ｜ 深 度 ｜ 诚 信 |", "content": "1 中 泰 证 券 研 究 所 专 业 ｜ 领 先 ｜ 深 度 ｜ 诚 信 |证券研究报告 | 2 0 2 6 .08.12氧化锆行业专题研究：稀土供给变局造就替代机遇， 新兴应用打开需求空间 分析师： 孙颖博士 中泰研究所副所长 /建材&化工行业首席 执业证书编号： S0740519070002 分析师：曹惠 执业证书编号： S0740525030003 研究助理：郝文阳 仅供内部参考，请勿外传 2核心要点 ◼氧氯化锆：锆产业链关键中间体 ，原料成本上行推升价格 。 ➢产业定位： 氧氯化锆作为锆产业链的核心中间原料 ，是制备氧化锆 、碳酸锆及各类锆化合物的基础 ，也是生产核级海绵 锆的前置关键环节 ，其生产以锆英砂为原料 ，经过碱熔 、酸浸等高纯化工艺实现提纯 。 ➢需求端： 据预测，全球氧氯化锆市场规模将由 2025年的6.17亿美元增至 2032年的9.16亿美元，CAGR为5.57%。应用结 构方面，锆化学品及陶瓷与耐火材料是传统基本盘 ，核级海绵锆等是新兴增量 ，据测算，受益于核电机组密集投产 ， 2025 -2030年中国核电机组对氧氯化锆需求量将从 1.33万吨增至 2.08万吨，CAGR约为9.37%。 ➢供给端： 全球市场方面 ，长裕集团为全球氧氯化锆龙头企业 ，与晶安高科 、东方锆业 、IMERYS 和DKK Group共同构成 全球前五大核心厂商 ，2025年CR5合计占据约 79%的市场份额 。国内市场方面 ，长裕集团 、晶安高科 、东方锆业 、英格 瓷、三祥新材为主要生产企业 ，产能分别为 7.5万吨、7万吨、5万吨、3.5万吨及 2.5万吨，2025年CR5比重超 65%。 ➢市场供需与价格走势： 我们将氧氯化锆产品应用领域分为锆化学品 、陶瓷、耐火材料 、铸造用砂及其他 （含核级氧化 锆），分别假设锆化学品 、陶瓷及耐火材料 、铸造用砂 、其他（含核级氧化锆 ）2025 -2028年CAGR为10%、3%、5% 及9.4%，得到2025 -2028年氧氯化锆需求量预计从 23.94万吨增长至 27.87万吨，CAGR为5.21%；而供给端 ，考虑到长 裕集团 4.5万吨超纯氧氯化锆 2026年落地，国内氧氯化锆总产能预计提升至 42.62万吨，参考行业历史开工率情况 ，预计 2026 -2028年我国氧氯化锆产量在 25-28万吨之间 ，供需整体保持紧平衡状态 。在供需平衡基础上 ，氧氯化锆价格主要 受锆英砂成本驱动 ，受锆英砂成本强劲支撑 （2026年以来累计上涨近 17%），氧氯化锆价格较年初增长近 36%，目前主 流报价已达 18000 -19000元/吨。 仅供内部参考，请勿外传 3核心要点 ◼钇稳定氧化锆：多场景需求持续扩容 ，稀土禀赋重塑供应格局 。 ➢产业定位： 钇稳定氧化锆 （YSZ）是全球先进陶瓷材料体系中的关键品类 ，凭借高硬度 、生物相容性 、氧离子导电等综 合性能，广泛应用于光通信 、齿科、消费电子 、固态电池 、SOFC等领域。 ➢需求端： 据测算，陶瓷背板 、光纤连接器 、齿科、固态电池及 SOFC五大应用领域的钇稳定氧化锆总需求量预计从 2025年的2.57万吨增长至 2030年的6.66万吨，CAGR约21%。细分赛道需求有所分化： ①SOFC领域增速领先 ，需求量 由2025年0.03万吨增至 2030年0.58万吨，CAGR约77%，主要受益于数据中心备电需求爆发与全球清洁能源转型； ②固 态电池是需求增量核心来源 ，需求量由 0.69万吨增长至 3.35万吨，CAGR约37%，驱动力为 LLZO为代表的氧化物固态电 解质产业化加速； ③陶瓷背板需求稳步提升 ，需求量自 0.36万吨增至 0.59万吨，CAGR约11%，依托高端手机陶瓷结构 件渗透率持续提高； ④齿科领域需求平稳扩容 ，需求量由 0.51万吨提升至 0.76万吨，CAGR约8%，人口老龄化持续带动 牙科修复需求； ⑤光纤连接器作为成熟存量市场 ，需求量从 1.08万吨增长至 1.38万吨，CAGR约 5%，在 AI算力网络与 数据中心建设支撑下维持温和增长 。 ➢供给端： 氧化锆整体产能较为集中，据 QYResearch 统计， 2017年全球近 90%的氧化锆供应来自欧洲、日本及中国。进 一步聚焦至性能更优异的纳米复合氧化锆，生产企业则主要集中在日本和欧美。生产企业方面，全球纳米复合氧化锆主 要玩家有第一稀元素、法国圣戈班、日本东曹、长裕集团、国瓷材料等，其产能占比分别为 21.01%、21.01%、12.61%、 11.76%及10.50%，全球 CR5近77%。 仅供内部参考，请勿外传 4核心要点 ➢价格端： 普通氧化锆的价格主要受上游原料成本驱动，生产 1吨氧化锆理论消耗 2.71-2.83吨氧氯化锆，受上游原料涨价 传导，据百川盈孚，截至 2026年7月 6日，普通氧化锆价格明显抬升，较年初上涨 29%至5.6万元/吨。钇锆特别是 纳米 复合氧化锆，价格中枢显著高于普通氧化锆，其价格受成本端、技术壁垒、产品自身性能等级等多重因素共同作用。 当前稀土供给扰动是影响钇锆价格的核心因素。 ①海外涨价逻辑：受我国出口管制影响，海外氧化钇难得且价格暴涨， 每公斤价格从 100美元下提升到 1000+美元，提升 10倍以上，导致海外钇锆厂商氧化钇采购成本大幅抬升，驱动海外钇 锆产品被动提价。②国内涨价逻辑：海外厂商氧化钇安全库存逐步消耗，高端粉体供给缺口开始显现， 26年6月全球高 端氧化锆龙头日本东曹受原料端制约，已对国内齿科企业爱迪特进行断供。随着东曹等日本企业断供范围持续扩大，国 内钇锆厂商有望迎来份额提升 +价格上涨的历史性机遇。 ◼重点个股 ➢长裕集团：全球氧氯化锆龙头，向上把握锆化工原料底座，向下布局高端锆制品延伸。 公司现有氧氯化锆产能 7.5万吨/ 年，为全球最大氧氯化锆生产商；同时拥有碳酸锆 1万吨/年、氧化锆 1万吨/年，纳米复合氧化锆有效产能 2800吨/年，产 品覆盖特种陶瓷、光通信、医疗器械、消费电子等领域。 同时公司 募投4.5万吨超纯氧氯化锆及深加工项目（总投资 3.04亿元）及年产1000吨生物陶瓷及功能陶瓷制品项目（总投资 1.61亿元），有望进一步放大 原料优势并向高附加值下 游延伸，完善一体化产业链壁垒。 ➢国瓷材料： 国内齿科氧化锆绝对龙头， 深度受益 海外巨头稀土原料断供带来的替代 红利。在生物医疗领域，公司已打 通“锆粉 -瓷块-口腔终端”全产业链，并依托对澳洲牙科巨头 SDI的并购， 有望顺利切入欧美高端市场，驱动 板块持续 放量；在消费电子领域，其纳米级复合氧化锆粉体已广泛应用于手机背板、智能手表等高频场景。当前公司纳米氧化锆 粉体总产能已达 6000吨/年，产销量稳步攀升，在国际巨头 稀土原料 受限的背景下，公司 有望充分受益于高端市场缺口 带来的量价红利 。 ◼风险提示： 下游需求不及预期 、行业竞争加剧、稀土出口政策不确定性、原材料价格波动、第三方数据失真及信息滞后、 数据结果测算偏差 风险 仅供内部参考，请勿外传 5 CONTENTS 目录 CCONTEN TS 专 业 ｜ 领 先 ｜ 深 度 ｜ 诚 信中 泰 证 券 研 究 所 CONTENTS 目录 CCONTE NTS 专 业 ｜ 领 先 ｜ 深 度 ｜ 诚 信中 泰 证 券 研 究 所1氧氯化锆：锆产业链关键中间体， 原料成本上行推升价格 仅供内部参考，请勿外传 6 1.1氧化锆产业链：从锆英砂到高端新材料 ◼锆产业链上游基础原料为锆英砂 ，产业链从锆英砂起分化为两条加工路径： 第一条为锆化工路线 ，锆英砂经碱熔 -酸解处理制得氧 氯化锆，此为各类锆化学品的核心中间原料 ，氧氯化锆经水解 、煅烧可生成普通氧化锆 、碳酸锆等基础产品；也可掺杂氧化钇溶 液，经晶相改性 、煅烧制备出钇稳定氧化锆 （YSZ）纳米粉体 ，属于中游高附加值功能粉体材料 。第二条为金属锆冶炼路线：锆 英砂经沸腾氯化生成四氯化锆 ，经锆铪分离提纯后 ，通过镁热还原得到海绵锆 ，进一步精深加工可生产核级锆合金 ，是技术壁垒 极高的核电专用战略金属材料 。下游应用方面 ，普通氧化锆主要应用于玻璃添加剂 、陶瓷釉料 、耐火填料等传统领域；钇稳定氧 化锆凭借优异力学及电化学性能 ，切入齿科医疗 、耐磨结构陶瓷 、固态电池电解质 、固体氧化物燃料电池 （SOFC）、电子陶瓷 等高附加值新兴赛道；核级锆合金则专属核电领域 ，用于制造反应堆燃料包壳管 、格架和导向管等堆芯关键结构材料 。 来源： KINTEK、智研咨询、 QYResearch 、铁合金在线、华经产业研究院、 中泰证券研究所图表：氧化锆行业产业链图 仅供内部参考，请勿外传 71.2氧氯化锆：锆制品核心中间原料 ◼氧氯化锆亦称作二氯氧化锆 ，是锆化学品产业链核心基础中间体 ，市面主流品类为八水合氧氯化锆 。产品外观呈白色 或微黄色针状结晶 ，具备风化性 、带有轻微刺激性气味 ，易溶于水 、甲醇、乙醇，微溶于盐酸 ，水溶液显酸性 。常规氧 氯化锆工业级产品以锆英砂为原料 ，通过碱熔 、水洗脱硅 、盐酸浸出 、蒸发结晶工艺量产；面向电子 、核应用领域的高 纯规格，则需叠加高纯氯化物多级萃取 、重结晶工序深度提纯 。氧氯化锆是众多锆系列制品生产所需的主要基础性原材 料，其可作为原料用于制备高纯氧化锆 、碳酸锆、硫酸锆、硝酸锆等几十种锆化合物 ，也可用于生产稳定型 、复合型氧 化锆及海绵锆 ，被广泛应用于高端陶瓷 、核电材料及其他化工装备材料 。除此之外 ，氧氯化锆也是重要化工 、冶金等行 业基础原料 ，可直接用于纺织 、皮革、橡胶、塑料等行业 ，作为助染剂 、鞣革剂、添加剂和干燥剂等 。 来源： QYResearch 、中国无机盐工业协会、智研咨询、公司公告、 中泰证券研究所图表：氧氯化锆产业链示意图 性质 内容 分子量 322.2 熔点 400℃ 密度 1.91g/cm³ 物理特性白色针状晶体，加热至 150℃失去6个 结晶水， 210℃失去全部结晶水 溶解性溶于水、甲醇、乙醇、醚、不溶于其 它有机溶剂，微溶于盐酸，水溶液呈 酸性图表：氧氯化锆性质介绍 仅供内部参考，请勿外传 81.3需求端： 26-32年市场规模 CAGR为5.57% ◼以工业级 、高纯级等各类商品化氧氯化锆销售额为统计口径 ，2025年全球氧氯化锆市场规模约 6.17亿美元，预计2032 年将增至 9.16亿美元。按照有效锆铪总含量 ，产品可分为两大品类： ZrO₂+HfO₂≥36.0%高含量型号适配稳定氧化锆 、 高纯锆盐 、催化、功能粉体等高附加值领域 ，营收占比持续提升； ZrO₂+HfO₂介于 35.0%-35.5%的普通规格依托成本 优势，多用于陶瓷 、纺织、涂料等基础助剂市场 。 ◼具体需求结构上 ，锆化学品为第一大应用领域 ，占比48%；陶瓷与耐火材料为第二大应用市场 ，占比 22%-25%；催化 剂领域占比 12%-15%，是高附加值增量赛道；油漆与涂料领域占比 8%-10%；纺织、水处理等其他应用合计占比 8%- 10%。氧氯化锆行业依靠多元下游扩容实现稳步发展 ，目前正从传统基础化工原料向精细化高附加值材料转型 ，核级、 新能源电池级锆材料等新兴需求逐步成为主要增量来源 。 来源： QYResearch 、中泰证券研究所图表：氧氯化锆各应用领域占比示意图 图表：全球氧氯化锆市场规模（亿美元） 6.1689.161 012345678910 2025 2032E48.16% 22-25%12-15%8-10%8-10%锆化学品 陶瓷与耐火材料 催化剂 油漆与涂料 其他 仅供内部参考，请勿外传 91.3锆铪分离拉动氧氯化锆需求 ◼锆与铪天然伴生存在于锆英砂矿 ，矿石中铪含量仅 1%-4%，全球铪产品的主要来源为锆冶炼环节的锆铪分离提纯 。二者 中子吸收性能完全相反 ，衍生出核电核心配套应用：锆中子吸收能力弱 ，是核反应堆燃料包壳核心用材；铪中子吸收能 力强，多用于反应堆控制棒 。同时二者拓展多元高端场景 ，铪可制备航空航天高温合金 、半导体栅介质材料 ，锆适配生 物医用陶瓷植入件 。 ◼新建核电机组将密集投产 ，核级海绵锆需求有望爆发 。核级海绵锆属于高端特种金属原材料 ，是生产核级锆合金的基础 原料；核级锆合金凭借耐腐蚀性强 、中子吸收截面低的独特性能 ，为核电站燃料组件核心用材 。据世界核能协会 2026年7 月统计，全球在运核电机组 439台，总装机容量 401.8GWe；我国不含台湾地区在运机组 62台、在建机组 38台。我国核能 产业起步偏晚 ，但近年发展速度领先 ，目前国内在建机组数量占全球在建总量 48.1%，未来将迎来机组集中投产周期 ， 据观研报告 ，2030年国内新增核电装机容量将达 10GW，届时在运总装机规模可达 108.43GW。新建核电机组密集落地将 直接带动核级锆合金需求提升 ，核级海绵锆市场有望迎来需求爆发 ，并同步拉动上游锆原料产业链景气上行 。 来源： WOR an直上CPO，A16台积电助攻2028放量。（来源：10:15野村Coherent帖；10:15 JPM硬件论坛；10:16 NVIDIA帖）\n- 宏观/策略层面：市场传言9月底前将出台地产政策（贷款贴息、降低公积金贷款利率、减少交易税费等），但判断政策力度大概率小于924；长江宏观+金属判断8-10月金价修复至4700美元/盎司、板块至少50%+空间；A股短期反弹可能未结束。（来源：14:22本周政策观点；20:00黄金策略帖；20:01 A股反弹帖）\n\n## 二、今日最强主线\n\n1. AI算力/大模型——华为超节点+国产大模型双催化\n   - 今天强化的逻辑：智谱发布GLM 5.3，后训练Scaling驱动代码及Agent能力再跃升；传统超大规模云厂虽乐观，但受自由现金流、美国本土土地/电力/外壳限制，算力供给追不上token增速。（来源：AI算力主线核心逻辑；09:27智谱帖）\n   - 今天出现的催化/验证：申万计算机周报专题关注；申万宏源将智微智能定义为“大模型+具身智能的算力底座”。（来源：21:08申万计算机周报；申万宏源-智微智能附件）\n\n2. 英伟达“新云”商业模式——算力供给的新交易结构\n   - 今天强化的逻辑：英伟达与新云签兜底协议，担保“每GPU每小时”收益，换取对方云业务收入分成；传统云厂受自由现金流与土地/电力/外壳限制，算力供给追不上token增速。（来源：AI算力主线逻辑链；10:14新云帖）\n   - 今天出现的催化/验证：英伟达对OpenAI财务担保金额下调至1200亿美元以下；MS以《英伟达、新云厂商与收入分成——下一场大辩论》为题专门讨论。（来源：09:27帖；MS-英伟达附件）\n\n3. 半导体/存储——闪迪投资者日打开NAND/HBF能见度\n   - 今天强化的逻辑：HBF架构方案可将部分或全部高带宽内存（HBM）堆栈及芯片替换为HBF；AI数据中心成为NAND需求核心驱动力，2030年AI数据中心SSD出货量预计1200EB，其中KV缓存占35%。（来源：半导体主线核心逻辑；10:15闪迪帖）\n   - 今天出现的催化/验证：中芯国际26Q2业绩及三季度毛利率指引大幅超预期，华虹半导体二季度净利不及预期，板块业绩分化。（来源：中芯国际2026Q2业绩说明会纪要；半导体主线）\n\n4. 光通信/CPO——海外产业链业绩共振\n   - 今天强化的逻辑：800G与1.6T需求持续强劲，与Lumentum业绩会表述一致，再次验证光模块上行周期未改；1.6T预计四季度开始贡献收入，2027年初放量。（来源：光通信主线核心逻辑；10:15野村帖）\n   - 今天出现的催化/验证：AAOI与LITE CEO访谈使CPO时间节奏更清晰；NVIDIA Feynman直上CPO、A16加速助攻2028放量。（来源：10:15 JPM硬件论坛帖；10:16 NVIDIA帖）\n\n5. 液冷/电源——“电”的逻辑强化，800V直流白皮书落地\n   - 今天强化的逻辑：±400V架构对电源模块时序控制要求提升，新雷能为ADI核心电源模块ODM厂；中富电路为三次电源PCB龙头，新增光模块二三次电源与存储相关电源模块订单。（来源：液冷/电源主线核心逻辑；19:44“电”逻辑帖）\n   - 今天出现的催化/验证：8月12日英伟达800VDC 2.0白皮书正式发布；奇鋐科技26Q2收入491.2亿新台币、同比+66%，散热产品收入占比62.4%。（来源：中金800V白皮书附件；22:52奇鋐科技帖）\n\n6. 机器人/具身智能——产能、出货与激励目标具象化\n   - 今天强化的逻辑：科达利谐波减速器为核心，北美大客户对接推进顺利，江门5万台产能近饱和，泰国基地规划100万台（27年大规模量产）。（来源：17:26科达利帖）\n   - 今天出现的催化/验证：上纬新材股权激励测算26-28年机器人业务收入不低于6亿、16亿、48亿元（27、28年增速160%、200%）；中泰证券宇树科技研报称其“四足与人形出货量全球第一”。（来源：21:38上纬新材帖；中泰宇树附件）\n\n## 三、今日重点关注\n\n### 3.1 今天已经发生的重点变化\n\n- 模型竞争：智谱发布GLM-5.3，帖子评价其性能超Nemotron、Laguna、Inkling；美国据报准备告知数十个国家必须在中美AI竞赛中选边。（来源：09:27两条帖子）\n- 英伟达资本/商业模式变化：新云兜底模式推出；对OpenAI财务担保降至1200亿美元以下；周五披露持有SpaceX近210亿美元股份、英特尔300亿美元股份。（来源：10:14新云帖；09:27帖；09:25帖）\n- 半导体业绩分化：中
