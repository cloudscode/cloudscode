开辟百亿级蓝海增量市场，打造第二成长曲线。🔥#近期更新欢迎私戳【报告链接】：【浙商医药|郭双喜】澳华内镜:国产软镜加速跑,手术机器人启新程【核心要点】#软镜：从", "content": "", "publish_time": "2026-09-26 09:49", "tags": ["近期更新欢迎私戳", "软镜", "从跟跑到局部领跑", "高端医院渗透", "ERCP手术机器人", "全球领先", "【预期差】", "风险提示", "文字观点"]}, "post:2026-09-26T11-56:e3737605dd22": {"id": "post:2026-09-26T11-56:e3737605dd22", "kind": "post", "title": "2026-09-26 11:56", "source_label": "帖子正文", "excerpt": "野村‑软银集团：CPU 需求升温改善安谋（Arm）中期增长前景 消费级 AI 智能体普及带动 CPU 需求增长，安谋股价出现上涨。截至 9 月 23 日，安谋股价相较 9 月 17 日累计上涨约 26%，我们将该行情归因于市场上调对中期 CPU 的需求预期。", "content": "", "publish_time": "2026-09-26 11:56", "tags": ["文字观点"]}}, "source_details": {"post:2026-09-26T11-58:8b93798bc789": {"id": "post:2026-09-26T11-58:8b93798bc789", "kind": "post", "title": "2026-09-26 11:58", "source_label": "帖子正文", "excerpt": "高盛‑测算支撑超大规模公司 AI 资本支出 ROIC 所需的 AI 经济规模 面对 AI 令牌消耗规模持续走高带来的算力需求扩张，美国超大规模云公司在资本密集度层面发生巨大转变，以此匹配算力层面的变化。这些投资一方面来自当下供需失衡所带来的实时需求信号，另一方面也来自核心客户多年维度的算力需求。", "content": "高盛‑测算支撑超大规模公司 AI 资本支出 ROIC 所需的 AI 经济规模 面对 AI 令牌消耗规模持续走高带来的算力需求扩张，美国超大规模云公司在资本密集度层面发生巨大转变，以此匹配算力层面的变化。 这些投资一方面来自当下供需失衡所带来的实时需求信号，另一方面也来自核心客户多年维度的算力需求。 在 2026 年全年，尤其是刚刚过去的第二季度财报季，我们观察到市场对该主题理解程度进一步提升。 从财报数据与公司管理层表态来看，投资者已经形成两点共识，第一，超大规模云公司可以通过增量营收与经营现金流，从 2023‑2025 年的前期资本开支当中获取可观的投资回报；第二，当前超大规模云公司正进入第二阶段资本开支周期（2026‑2027 年），所处终端需求环境算力供给紧张且需求持续加速，算力定价显著高于我们假设的长期基准水平。 因此过去几个月市场讨论转向更远期视角：2026‑2027 年当期资本开支，将如何在 2028‑2030 年实现投资回报；同时前期资本开支已经实现的资本回报率可以作为分析基准。 在本篇报告中，我们搭建一套分析框架，用来测算美国超大规模云公司当前资本开支规模，想要实现基准投资回报率，AI 经济需要创造多大规模产出。 本报告分析聚焦：美国超大规模云公司第二阶段（2026‑2027 年）AI 算力投资，要实现15% 的年度投入资本回报率，需要达成的营收门槛。 基于多项假设，包含每吉瓦前期投入成本约 420 亿美元；建设结构当中算力设备占 70%、机房土建配套占 30%；保守折旧周期、持续运营成本假设等。 测算得出，美国六大头部超大规模云公司，包括字母表、亚马逊、微软、Meta、甲骨文、SpaceX，需要在 2028‑2030 年合计创造约1.42 万亿美元累计营收，即每吉瓦算力对应年均营收约 116 亿美元，才可以跨过 15% 投入资本回报率门槛。 虽然短期资本回报率会承压，加速资本开支周期会压制短期业绩表现。 但我们判断，当期资本开支具备吸引力的投资回报，会在中长期的经营业绩当中逐步兑现。 换句话讲，我们将短期回报率承压视作大规模前期投资周期带来的必然结果，并不代表 AI 商业模式存在结构性缺陷。 在多篇针对令牌经济、消费端 AI 发展、产业端 AI 格局的研究笔记当中，我们已经梳理市场份额变迁、令牌价格通缩，如何推动 AI 渗透率提升，带动消费端与产业端算力场景不断丰富。 当前市场讨论大多聚焦前沿基础模型公司的市场份额，以及面对开源 / 开放权重模型竞争时的算力定价权。 但我们认为，算力的性价比才是决定 AI 经济整体规模与边界的关键。 拥有多条处在高效性价比曲线上的不同模型、不同智能等级产品，能够解锁丰富应用场景。 既包含定价大幅下行的商品化智能场景，也包含定价韧性更强的前沿尖端智能场景。 整体层面可以支撑当下算力基础设施提供商的资本投入规模。 简言之，并不是每一类令牌都拥有一样的商业收益，也不是每一笔资本开支都能获得均等回报。 但综合来看，面向未来 3‑5 年的市场机会空间，我们依旧认为未来 18 个月落地的资本投入可以获得稳健回报 Profile。 上述逻辑在我们近期的 Communacopia + 科技行业大会上也得到印证，多家公司展示出三点现象。 第一，行业已经从试验探索阶段，逐步转向落地实施阶段。 第二，生产力带来的收益以及产品开发周期正在加速。 第三，行业关注点从一味最大化令牌产出，转向令牌使用效率优化。这改善了产业客户的收益表现，也成为产业端 AI 进一步普及的先行指标，直接带动超大规模云公司营收提升、前期资本开支带来增量经营利润。 除此之外，近期多款面向普通消费者的智能体 AI 产品发布，最具代表性就是 Meta 的 Muse。 这有可能推动消费端 AI 从对话式交互范式，转向由智能体驱动的行动范式。 这类智能体 AI 平台的规模扩张，还会带来后续其他头部玩家跟进布局消费 AI 平台层，中长期会进一步推高算力需求。 后续可以依托订阅、广告、电商多元机制完成商业化变现，各类商业模式边界互相交融会成为未来营收扩张的核心。 一、超大规模云公司资本开支现状以及核心投资者争议点 伴随 AI 令牌需求曲线以及对应算力需求扩张，美国超大规模云公司加速 AI 算力建设，资本密集度显著高于过往算力周期。 近期 Communacopia + 科技大会的一大核心主题，就是整个行业依旧处在算力供给紧张状态。 因此未来 12‑18 个月资本开支节奏，目的就是弥合当前供需缺口。 尽管如此，投资者对于这一段短期资本开支已经有充分认知。 相关公司已经通过当期业绩指引、投资优先级定性描述充分释放相关信号。 我们认为，2026‑2027 年短期资本开支水平已经被市场充分理解，并且已经反映在当前股价当中。 自 2026 年年初以来，年初已经上市的五家美国超大规模云公司（字母表、微软、亚马逊、Meta、甲骨文），2026‑2027 年市场一致预期资本开支上调约66%，五家公司两年合计预期资本开支增加 7500 亿美元。 即便如此，我们对 2027 年资本开支的预测依旧普遍高于市场一致预期，我们判断该预测更加贴合投资者的实际预期。 资本开支对应的投入资本回报率，以及 2028 年之后长期资本密集度，是目前市场最大的两大争议。 随着短期资本密集度水平被充分认知，美国超大规模云公司面对的两大核心悬而未决问题，也是投资者希望获取更多信息的方向，两者互相关联。 第一，2026‑2027 年这一轮短期资本开支能够实现多高的投资回报。 第二，2028 年及之后长期资本开支、资本密集度会处在什么水平。 尽管相比过去 12‑18 个月，市场对于 2026‑2028 年资本开支走势已经有更高认知，并且已经体现在市场一致预期。 但投资者依旧在争论：2027‑2030 年需要多大的 AI 经济市场空间，才可以让这一轮大规模资本投入获得充足回报。 下面我们搭建分析框架尝试解答该问题。 美国超大规模云公司 AI 算力建设划分三个阶段。 第一阶段（2023‑2025 年）：总资本开支约 6330 亿美元，年均约 2110 亿美元；资本密集度温和抬升；投资主要面向训练相关工作负载。 第二阶段（2026‑2027 年预期）：总资本开支约 1.73 万亿美元，年均约 8630 亿美元；资本开支规模大幅跃升，投资面向快速扩张、覆盖面持续拓宽的训练以及越来越多推理类工作负载；产能紧缺、供需失衡促使云公司考虑第三方实体、特殊目的载体、金融合作方。 第三阶段（2028‑2030 年预期）：总资本开支约 4.14 万亿美元，年均约 1.38 万亿美元；资本开支绝对规模维持或继续增长，但增速与资本密集度开始回落；前期投资陆续落地，云公司更多转向收获阶段；实际资本开支、盈利、经营现金流存在不确定性，取决于算力需求扩张速度、数据中心投产时点、硬件更新周期、资金来源等多重因素。 二、从半导体产业链自下而上看 AI 基础设施资本开支 我们基于半导体产业链最新指引，给出未来三年 AI 基础设施资本开支判断。 过去三年，产业链数据可以较好指示 AI 基础设施资本开支趋势方向。 整体来看，来自产业链的底层数据、公司指引，很难做到对量化趋势完美预测，尤其供给紧张环境下客户会给出更加激进的预测。 但中长期维度，这些信息依旧是判断开支趋势的有效参考。 需求端，半导体行业投资者担忧 AI 基础设施公司当下资本开支，和当期 EBITDA、自由现金流之间存在资金缺口。 供给端，市场讨论最多的风险是，可供承接规划中基础设施建设的数据中心土地、电力、机房土建配套资源是否充足，尤其 2028 年之后。 我们基于半导体公司指引与内部预测，测算 AI 基础设施资本开支与对应数据中心部署规模。 我们测算，2027 年 AI 基础设施资本开支约 1.3 万亿美元，同比增长 60%；2028 年达到 2.0 万亿美元，同比增长 42%。 算力部署规模上，2026/2027/2028 年分别实现约 20 吉瓦、35 吉瓦、57 吉瓦的 AI 数据中心投产。 以上数字特指 AI 相关基础设施投资，范围超出传统超大规模云公司资本开支口径，还包含 AI 实验室、主权 AI 公司、企业客户的相关投入。 产业链各家公司相关指引整理如下。 博通：指引 2027 财年客户 AI 相关算力部署 10 吉瓦，2028 财年 20 吉瓦；数据中心领域，每吉瓦对应的计算加网络业务市场空间为 200‑300 亿美元。 英伟达：Blackwell 整套计算加网络系统对应每吉瓦约 250 亿美元营收；Rubin 平台该数值将提升至约 400 亿美元；Feynman 平台切换还会额外带来每吉瓦 50 亿美元投入，合计每吉瓦约 450 亿美元营收。 AMD：测算每吉瓦对应的市场空间 150‑200 亿美元，我们取区间中值用来测算 AMD 对应的 AI 数据中心部署规模。 迈威尔、联发科：我们采用同样框架，结合每吉瓦营收假设，以及自身数据中心营收预测反推对应的算力部署规模。 综合测算汇总：2026 年整体部署 20 吉瓦 AI 算力，总 AI 资本开支 8610 亿美元，对应单吉瓦资本开支 420 亿美元；2027 年部署 35 吉瓦，总 AI 资本开支 1.338 万亿美元，单吉瓦 380 亿美元；2028 年部署 57 吉瓦，总 AI 资本开支 2.008 万亿美元，单吉瓦 350 亿美元。 分厂商口径：英伟达 2026‑2028 年对应算力部署分别为 14 吉瓦、18 吉瓦、22 吉瓦；博通分别 5 吉瓦、10 吉瓦、20 吉瓦；AMD 分别 1 吉瓦、2 吉瓦、3 吉瓦；联发科分别 0.4 吉瓦、4 吉瓦、11 吉瓦；迈威尔分别 0.5 吉瓦、0.9 吉瓦、2 吉瓦。 三、搭建分析框架，测算美国超大规模云公司投入资本回报率，以及 AI 经济需要达成的产出规模 下面框架用来解答核心问题：美国超大规模云公司，第二阶段（2026‑2027）AI 算力建设，需要实现多少合计营收，才能够拿到达标投入资本回报率。 美国超大规模云公司 ROIC 框架核心假设要点。 分析覆盖的公司：按市值排序，字母表、微软、亚马逊、SpaceX、Meta、甲骨文。 我们认为这一组公司可以很好代表 AI 基础设施算力建设以及资本密集度情况，适配本次讨论。 第二阶段（2026‑2027）资本开支定义：我们只统计两年周期内 AI 算力相关资本开支，用来测算这一轮新建产能所需要创造的营收。 重点说明，我们将这两年资本开支周期做隔离测算，不纳入：①2026‑2027 年算力上线产生的营收、税后净营业利润；②2028 年及之后持续新增资本开支，以及新增产能带来的营收、运营费用。 第二阶段 AI 算力资本开支，采用分公司独立预测，只统计 AI 相关投入。 例如亚马逊统计 AWS 板块资本开支，SpaceX 统计 AI 板块资本开支；对于很难拆分 AI / 非 AI 资本开支的公司，例如字母表，我们假设 2026‑2027 年整体资本开支当中约 85‑90% 投向 AI 算力。 资本开支划分成两类，维持固定占比：第一类算力设备（服务器、芯片、网络硬件设备等），占两年资本开支 70%；第二类机房土建配套（土地、建筑及配套基础设施），占两年资本开支 30%。 算力建设成本假设：两年周期内六家公司统一采用单吉瓦约 420 亿美元前期投入。 该 420 亿美元每吉瓦假设来自多方面输入。 第一，参考 Epoch AI 截至 2025 年末成本假设，并叠加 10% 通胀率，10% 通胀率与 Meta、亚马逊上调资本开支指引时给出的输入成本上涨幅度保持一致。 第二，来自我们美国半导体覆盖团队，基于不同硬件类型数据中心容量配比得出的每吉瓦综合成本框架。 第三，来自各家公司已经披露或者隐含的 AI 算力基础设施建设实际成本。 报告后面也做情景分析，每吉瓦资本开支假设在 340‑510 亿美元区间做敏感性测试。 投入资本回报率门槛：统一设定 15% 年度回报率，用 2028‑2030 年实现的年度税后净营业利润，除以 2026‑2027 年均资本开支。 报告后面同样做情景测试，投入资本回报率门槛在 0‑30% 区间变动。 需要说明，超大规模云公司当下资本开支实际拿到的回报率，以及这一轮资本开支内部预测回报率，几乎可以确定高于 15% 这一门槛。 但我们框架目的就是算出，实现一个合理且相对保守的 15% 回报门槛所需要的营收规模，回应部分投资者担忧，即这一轮资本开支回报率可能很低甚至为负。 运营费用（EBIT 到营收的推导链路）：我们按照美国现行 21% 企业所得税率，把测算出的年度税后净营业利润倒算回需要的年度息税前利润。 在息税前利润基础之上，叠加建好的吉瓦算力对应的年度运营开支，倒算出跨过回报率门槛所需要的年度营收。 运营开支分为两大部分。 第一部分折旧摊销：第二阶段采购的算力设备资产假设 5 年使用年限，机房土建配套资产假设 15 年使用年限，据此计算每年折旧摊销费用。 第二部分非折旧摊销的运维开销：数据中心年度运营成本（电力、人力等）假设每吉瓦 8.36 亿美元，该假设来自 Epoch AI 2025 年末数据叠加 10% 通胀。 进一步拆分运维开销：电力每吉瓦 6.53 亿美元，人力每吉瓦 0.44 亿美元，其他开销每吉瓦 1.39 亿美元。 同时叠加利用率折扣，2028 年（第一年）利用率 60%，2029 年（第二年）利用率 80%，2030 年（第三年）利用率 85%。 本分析框架存在部分简化与泛化设定，仅作为广义参考框架，投资者可以根据自身观点、行业、公司后续发展调整假设参数。 几点重要局限说明。 本分析不纳入第二阶段之后，也就是 2028 年往后的新增投资。本次测算仅隔离最近 18 个月这一轮算力建设以及回本所需要收益；我们分公司正式预测会包含 2028 年以后的资本投入，因此和本框架结果存在差异。 每家公司对应投产吉瓦算力仅作为演示数值，不代表真实实际产能。框架内统一假定每家公司资本开支对应的吉瓦规模、产能上线节奏一致；现实各家公司现有产能储备、未来上线计划差异巨大，报告忽略该差异，目的给出统一全行业 ROIC 测算框架。 假设所有超大规模云公司资本开支结构、资产使用年限完全一致。现实各家公司处在建设不同阶段，采购不同类型资产，经济使用年限各不相同，该假设仅用于行业演示框架。 分析只包含这六家美国超大规模云公司。AI 基础设施建设参与者范围更广，包含新型云厂商、企业开发方、数据中心持有方、特殊目的载体、前沿模型公司等，但本报告站在我们覆盖的六家头部美国超大规模云公司视角测算需要的回报。同时测算主要统计自建自营的数据中心算力资本开支，剔除表外租赁、融资租赁、特殊目的载体、第三方算力授权等模式，原因是难以完整获取相关信息，也存在重复统计投资风险。 在 15% 投入资本回报率假设之下，六家美国超大规模云公司需要在 2028‑2030 年合计创造约 1.42 万亿美元营收，折算混合平均每吉瓦每年需要实现 116 亿美元营收。 情景分析：变动两大核心输入变量，第二阶段资本开支对应的投入资本回报率（0‑30% 区间）、单吉瓦前期资本开支（340‑510 亿美元区间）。 测算得出，如果投入资本回报率处在 0‑30% 区间，六家公司 2028‑2030 累计需要实现的营收规模为 9080 亿美元‑1.89 万亿美元，对应混合平均每吉瓦年度营收 62‑186 亿美元。 四、借助云在手订单，理解未来商业化变现潜力 为给上面测算结果提供参照，我们选取美国三家头部公有云公司，AWS、Azure、谷歌云，观察当前在手需求订单，以及公司为此开展的基础设施建设。 企业端对于 AI 训练、推理工作负载需求增长，推动三家云公司报告营收与订单承诺规模显著上行。 截至 2026 年第二季度，三家公司合计在手订单规模约 1.69 万亿美元，同比增长 152%，较年初增长约 1.5 倍。 管理层表示，算力产能约束限制自身承接旺盛 AI 相关需求的能力，这也是资本开支加大的关键动因。 同样采用 15% ROIC 门槛框架，三家公司 2026‑2027 合计资本开支约 1.22 万亿美元，需要在 2028‑2030 年累计创造 1.00 万亿美元营收。 该三年所需营收规模，相当于三家公司截至 2026 年二季度合计在手订单 1.69 万亿美元的 59%。 公司披露预期，约一半在手订单会在未来 24 个月确认收入，另一半在之后确认。 关于现有订单未来转化为实际营收依旧存在讨论空间，包含客户集中度风险、产品营收结构、长期合同带来的收入确认时点等等。 该测算还假设未来订单规模不再继续增长，而过去几个季度在手订单环比持续高双位数增长，该假设已经属于偏保守。 五、各家公司如何看待投入资本回报率 产能约束叠加需求加速，使得当下数据中心资本开支拥有较短的投资回收期。 亚马逊在 2026 年第二季度财报电话会阐述：可以清晰看到 AWS/AI 相关资本开支未来会产生强劲回报。 资本开支分成两类，服务器与网络设备，资产使用年限 5‑6 年，盈亏平衡点大约 3 年，意味着盈亏平衡之后还有 2‑3 年可观现金流生成周期；机房土建配套使用年限 30 年以上，可以支撑 5‑6 轮服务器硬件迭代周期。 数据中心投产之前，资本开支会提前约两年启动，会掩盖当期业绩表现，但 AI 相关投资的 ROIC 本身具备不错吸引力。 甲骨文在 2026 财年第四季度财报电话会披露，基础设施业务大型项目稳态投入资本回报率处在高 20% 区间。 还有上行空间，来自 GPU 更换周期拉长，或者 “自带硬件” 这类降低甲骨文前期资本投入的举措。 SpaceX 在高盛 Communacopia + 科技大会披露，当前落地地面数据中心算力板块资本开支，投资回收期一年。 数据中心基础设施建设设计层面强调灵活性与通用性，降低对单一技术框架、应用场景的依赖。 微软把基础设施投资定位打造一套 “可通用算力集群”，在地域、硬件类型上保留灵活度，可以服务 AI 全生命周期当中不同类型工作负载。 Meta 采用分阶段模式建设数据中心，采用模块化设计，服务器按需临近部署时点下单，同时租赁第三方算力填补自有算力建设的空档。 多家公司都讨论数据中心架构设计创新，例如亚马逊模块化设计，方便未来给现有基础设施快速更换新硬件。 字母表可以在内部业务（搜索、YouTube、DeepMind）和外部谷歌云客户之间动态调度算力，跨地区、跨服务器类型调度工作负载，追求更高利用率。 市场对于算力基础设施未来多元商业化变现潜力维持乐观。 头部公有云公司（字母表、亚马逊、微软、甲骨文）已经对多类工作负载与服务上调定价；伴随合同续约，未来还有继续提价的潜在空间，匹配供需失衡现状。 微软强调，当前单位经济效益要好于上一轮云周期的同一阶段，随着一批批资本开支逐步成熟，可以创造更大利润池。 从云时代得到的重要经验，Azure 和自有应用使用一套统一技术栈，而非多套技术栈精细匹配，后者利用率最终会更低。同时微软从 AI 发展最初阶段就获取 AI 原生客户，而不是像上一轮云周期属于后期入局者。 在半导体层面，微软判断芯片层会走向更多元格局，类似 CPU 发展历程。 在令牌租赁业务方面，微软认为自身可以在第三方令牌基础上输出足够增值价值，同时统筹自有与第三方令牌，长期看对利润率冲击有限。 综合判断，微软认为 AI 业务毛利率完全有机会向传统云业务毛利率靠拢。 算力商业化变现路径多元，从裸金属基础设施即服务（例如 SpaceX 近期算力授权合作），一直到完整企业软件服务。 面向消费者的商业化路径也在持续演进，广告模式 Meta、字母表、亚马逊已经发展相对成熟；订阅、智能体电商等其他路径未来也有发展潜力。#文字观点", "publish_time": "2026-09-26 11:58", "tags": ["文字观点"]}, "post:2026-09-26T17-29:708465cd788d": {"id": "post:2026-09-26T17-29:708465cd788d", "kind": "post", "title": "2026-09-26 17:29", "source_label": "帖子正文", "excerpt": "Cerebras 今天出现大量下周到期的看涨期权买盘。他们是否在预期安德鲁・费尔德曼在上次电话会上暗示的那笔新超大规模云服务商交易？", "content": "Cerebras 今天出现大量下周到期的看涨期权买盘。他们是否在预期安德鲁・费尔德曼在上次电话会上暗示的那笔新超大规模云服务商交易？Cerebras 采用 Vicor 的垂直供电技术，其下一代系统将在 2028 年及以后使用 Vicor 第二代 VPD。Vicor 与 Cerebras 的合作关系并非猜测或传闻。客户端情况：快速词元需求旺盛，在市场上享有溢价，前沿智能能力仅能通过 OpenAI 与 Cerebras 的合作获取。我们与 AWS 持续合作，预计 AWS Bedrock 平台将在 2026 年第一季度推出相关解决方案。这项合作带来全球覆盖能力，拓展了行业生态，几乎所有企业都信任该平台。我们与其他超大规模云服务商的沟通进展同样顺利。我们预计从 2027 年年中起产生首笔收入，并在 2028 年及以后持续放量。250 亿美元的 RPO 并不代表来自 AWS 或其他超大规模云服务商的待交付订单储备。我们在 OpenAI 以外的业务增长态势良好。举例来说，在第二季度，我们签署了 6 笔金额超过 3000 万美元的订单。Vicor 相关：更高功率与先进冷却技术正在融合，应用于 AI、超算以及云数据中心。在 AI 领域，需要蛮力算力来处理当下常见的高算力任务。Cerebras 近期发布的晶圆级引擎 (WSE) 被广泛视作行业最先进的单片处理器。WSE 拥有 84 个处理核心，可覆盖整片晶圆，在单芯片内实现完整功能。WSE 大幅降低了传统多芯片架构带来的延迟问题。WSE 功率高达 15 千瓦，远高于传统处理器，这种架构要求在芯片每个位置均匀供电。#文字观点", "publish_time": "2026-09-26 17:29", "tags": ["文字观点"]}, "post:2026-09-26T21-58:d0276b194d9d": {"id": "post:2026-09-26T21-58:d0276b194d9d", "kind": "post", "title": "2026-09-26 21:58", "source_label": "帖子正文", "excerpt": "【华西计算机 | 每日资讯（0926）】Anthropic与Akamai达成7年116亿美元协议，扩充CPU算力 【国内新闻】 #高速光互联与计算技术北京重点实验室落地北京经开区 （来源：36氪） #美团上线longCat-2.5-Preview模型：1.6T参数，主打AI长程任务与多模态能力 （来", "content": "【华西计算机 | 每日资讯（0926）】Anthropic与Akamai达成7年116亿美元协议，扩充CPU算力 【国内新闻】 #高速光互联与计算技术北京重点实验室落地北京经开区 （来源：36氪） #美团上线longCat-2.5-Preview模型：1.6T参数，主打AI长程任务与多模态能力 （来源：IT之家） #“中国天眼”FAST项目有望2028年前后实现全链条国产化 （来源：36氪） 【国际新闻】#OpenAI确认干预3家美国政府网站（来源：36氪） #Anthropic与Akamai达成7年116亿美元协议，扩充CPU算力 （来源：IT之家） #微软将企业级AI整合至单一应用，与Anthropic展开竞争 （来源：36氪） 免责声明：本信息仅供在新媒体背景下研究观点的及时交流。在任何情况下，本信息并不构成对任何人的投资建议。 联系人：华西计算机刘泽晶(SACNO:S1120520020002)/张祺昌#文字观点", "publish_time": "2026-09-26 21:58", "tags": ["OpenAI确认干预3家美国政府网站", "文字观点"]}, "attachment:files/MS-大中华区IT服务与软件——2026年中国BEST大会要点：企业AI落地依赖即战力数据，工作流数据构筑应用层护城河.pdf": {"id": "attachment:files/MS-大中华区IT服务与软件——2026年中国BEST大会要点：企业AI落地依赖即战力数据，工作流数据构筑应用层护城河.pdf", "kind": "attachment", "title": "MS-大中华区IT服务与软件——2026年中国BEST大会要点：企业AI落地依赖即战力数据，工作流数据构筑应用层护城河", "source_label": "MS", "excerpt": "M Update Greater China IT Services and Software | Asia Pacific China BEST Conference 2026 Takeaways We met with several AI-related non-covered and private software players in our C", "content": "M Update Greater China IT Services and Software | Asia Pacific China BEST Conference 2026 Takeaways We met with several AI-related non-covered and private software players in our China BEST conference. The takeaways have good implications for the overall China software space. Morgan Stanley Asia Limited+ Yang Liu Equity Analyst Yang.Liu@morganstanley.com +852 2239-1911 Lydia Lin Equity Analyst Lydia.Lin@morganstanley.com +852 2239-1572 Greater China IT Services and Software Asia Pacific Industry View In-Line Related notes: Kingdee International Software Group: China BEST Conference Takeaways (17 Sep 2026) Kingsoft Cloud Holdings: China BEST Conference 2026 Feedback (18 Sep 2026) Xunce (3317.HK, not covered), a data infra solution provider, observed fast rising demand from enterprises on data governance and data analytics platform. This is the first step or premise for enterprise level AI adoption. Xunce is leveraging on its full chain data capabilities serving asset managers and replicates to multiple sectors, especially power, telecom and manufacturing. It is taking the technology revolution opportunity to transform the business model from project based to consumption based model. In addition, customers are requesting software solution providers to solve the underlying computing related demand, suggesting higher popularity of software + hardware integrated solution. ManyCore (0068.HK, NC) has a legacy design SaaS business suffering from the property sector downcycle and is focusing its R&D on new initiatives in the spatial intelligence area. It launched space understanding and generation AI models. ManyCore is exploring the world AI model through the 3D space model approach. This area is not very crowded as 3D spacial data are scarce, but ManyCore accumulated rich high quality data from its legacy business. It sees the commercial potential for such models in game development, video generation and AI hardware (like 3D scanner). (Continued) Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. Key Takeaways Ready for use data is critical for enterprise AI adoption, and data accumulation is essential for software incumbents in the AI era. There is big potential for software players at the harness part of the agent, especially for productivity tools. Workflow data and ecosystems could become the more durable application-layer moat. September 20, 2026 07:38 PM GMT Downloaded by zouguanzhong@cramc.hk Not for redistribution without written consent of Morgan Stanley M Update 2 Vertical AI agent start-ups takeaways: Evoken (design agent, private) and Rabyte (finance agent, private) •Targeting high-value professional workflows. Evoken focuses on professional creative production while Rabyte targets institutional investment research; in both cases, the product aims to automate multi-step workflows rather than simply generate content or answers. This suggests monetization may ultimately be benchmarked against the time and cost of legacy professional processes rather than model inference costs, supporting potentially attractive economics for vertical agents that can establish deep workflow integration. •Evolving from model wrappers into integrated workflow + data + model stacks. Despite targeting very different verticals, both Evoken and Rabyte see foundation models as only one component of the product, with differentiation increasingly coming from domain-specific workflows, proprietary data and granular control. Both are also training their own models—not necessarily to compete with frontier labs on SOTA performance, but to improve domain performance and lower inference costs. We think this points to increasing convergence between scaled agent and model companies, with vertical players selectively internalizing the model layer as usage and proprietary data accumulate. •Workflow data and ecosystems could become the more durable application-layer moat. Both companies emphasize capturing user interaction/workflow data and building ecosystems of reusable skills, workflows and assets, and share the revenue/token with creators in ecosystem as incentives. This creates a potential flywheel where greater usage generates proprietary data, improves models and product features, and expands the library of reusable capabilities—raising switching costs and strengthening network effects. M Update Morgan Stanley Research 3Disclosure Section The information and opinions in Morgan Stanley Research were prepared or are disseminated by Morgan Stanley Asia Limited (which accepts the responsibility for its contents) and/or Morgan Stanley Asia (Singapore) Pte. (Registration number 199206298Z) and/or Morgan Stanley Asia (Singapore) Securities Pte Ltd (Registration number 200008434H), regulated by the Monetary Authority of Singapore (which accepts legal responsibility for its contents and should be contacted with respect to any matters arising from, or in connection with, Morgan Stanley Research), and/or Morgan Stanley Taiwan Limited and/or Morgan Stanley & Co International plc, Seoul Branch, and/or Morgan Stanley Australia Limited (A.B.N. 67 003 734 576, holder of Australian financial services license No. 233742, which accepts responsibility for its contents), and/or Morgan Stanley Wealth Management Australia Pty Ltd (A.B.N. 19 009 145 555, holder of Australian financial services license No. 240813, which accepts responsibility for its contents), and/or Morgan Stanley India Company Private Limited having Corporate Identification No (CIN) 15305, regulated by the Securities and Exchange Board of India (“SEBI”) and holder of licenses as a Research Analyst (SEBI Registration No. INH000001105); Stock Broker (SEBI Stock Broker Registration No. INZ000244438), Merchant Banker (SEBI Registration No. INM000  Hardware | Asia Pacific China BEST Conference 2026 FeedbackMorgan Stanley Asia Limited+ Andy Meng, CFA Equity Analyst Andy.Meng@morganstanley.com +852 2239-7689 Betty Chen Research Associate Betty.H.Chen@morganstanley.com +852 2239-7213 Greater China Technology Hardware Asia Pacific Industry View In-Line 1. AI transceivers: Industry demand should remain very strong in 2H26 and 2027. 1.6T DSP and high-end EML/CW are facing shortages. Companies with supply chain advantages are likely to receive more orders and achieve more rapid growth than industry peers. 2. iPhone supply chain: Most supply chain companies are expecting decent performance post the new iPhone launch. For those components with new designs and higher specs, both ASP and margins are likely to see improvement vs. previous models. 3. Android smartphones: Shipments are likely to face headwinds in 2H26 given ASP will continue to increase to pass through memory cost. However, the magnitude of the memory cost increase has normalized in 3Q26. Once smartphone companies have realized higher ASPs, they will try to sustain this and enlarge the industry TAM. 4. Android supply chain: Supply chain companies are spending more effort on high- end segments, using mix improvement to offset overall volume weakness. 5. AR/VR: A number of new products are likely to be launched in 2027, making positive growth very likely. 6. New AI hardware products: Some new AI hardware products will be launched in 4Q26. Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are ost:2026-09-26T11-58:12f62a44f6fb": {"id": "post:2026-09-26T11-58:12f62a44f6fb", "kind": "post", "title": "2026-09-26 11:58", "source_label": "帖子正文", "excerpt": "【巴克莱｜美国半导体及半导体设备】ECOC 大会纪要：客户路线图分化，技术路径喜忧参半 我们走访展会各个展位，并与多家公司开展会谈，以下为本次大会核心要点。大规模 CPO（共封装光学）落地时间点，更多向本十年末期靠拢，甚至可能进一步延后，NPO（近封装光学）方案开始填补其间的技术空白。", "content": "【巴克莱｜美国半导体及半导体设备】ECOC 大会纪要：客户路线图分化，技术路径喜忧参半 我们走访展会各个展位，并与多家公司开展会谈，以下为本次大会核心要点。 大规模 CPO（共封装光学）落地时间点，更多向本十年末期靠拢，甚至可能进一步延后，NPO（近封装光学）方案开始填补其间的技术空白。 和市场普遍认知一致，很多厂商提及的 “2027 年末”，并不会迎来 CPO 的大规模上量，2028 年才会是真正的技术切换年份。 技术迭代落地周期通常会比最初对外宣传的时间更长，其中 CPO 规模化落地时间，相比此前行业指引的时间延后幅度最大。 综合参会交流的感受，可插拔光模块、经过信号重定时与重驱动的电连接方案仍具备较大发展空间；每一款加速器平台在大规模部署阶段，都会同时采用 CPO、NPO 以及电连接多种不同方案。 我们交流讨论的重点主要包含四个方向：第一，NPO 的硬件构成以及部署模式；第二，供给约束给市场落地带来的限制；第三，明确 Scale‑In（芯片级向内光学互联）概念，厘清其部署时间线；第四，OCS 光交换机、Coherent‑Lite 以及 ZR + 的落地部署情况。 针对我们覆盖的公司，NPO 方案会带来增量器件价值，因此我们对 MTSI 最为看好；Coherent 在发布 PhotonLink 产品时上调了潜在市场空间 SAM；LITE 也针对部分产品目标给到更多新信息。 NPO 具备多种实现形态，CPO 落地时间再度延后 NPO 可以作为走向 CPO 的过渡技术，我们会谈的几乎所有公司都推出了多种多样的 NPO 解决方案。 最早的部署计划将 NPO 落地时间定在 2027 年下半年，但结合行业沟通情况，2028 年实现大规模出货会更符合现实预期。 NPO 会衍生出多种技术方案，超大规模云服务商也在试验不同的部署模式与供应链体系。 行业重点讨论两类部署形态，分别是面板外置激光器 ELS 方案，以及光引擎内部集成激光器的 ILS 集成激光器方案。 ELS 形态维护更换更为便捷，有供应商表示该方案会率先推向市场。 ILS 集成激光器采用功耗更低的激光器，但维护难度更高，需要打开服务器机箱才能操作。 市场同时出现私有定制方案以及开放 CPX 标准；但各方沟通尚处在早期阶段，这也意味着该技术大概率要到 2028 年才能够实现规模出货。 每一套 NPO 方案，都需要配套多通道跨阻放大器 TIA 与驱动芯片，单台服务器对应的器件价值可达数百美元。 Coherent 将 CPO/NPO 的 2030 年潜在市场空间 SAM 上调至 300 亿美元，此前预期为 150 亿美元。 在 PhotonLink 产品发布会现场，该公司披露已经拿到超过 10 个 NPO 客户合作项目；LITE 披露手握 5 个 NPO 合作项目，其中 3 个采用集成激光器 ILS，另外 2 个采用外置激光器 ELS。 结合我们的交流信息，CPO 落地时间再度推迟，我们维持判断，CPO 规模化落地时间更靠近本十年末期。 附注：巴克莱资本及其关联机构会与报告覆盖范围内的公司开展、寻求业务合作，投资者应当留意机构存在利益冲突，可能会影响报告客观性，本报告仅作为投资者决策的其中一项参考因素。分析师认证与重要披露详见报告第 5 页。 激光器以及 DSP 芯片市场供给依旧紧张 调研反馈的供给瓶颈集中在磷化铟 InP 供给、以及受台积电先进晶圆产能短缺制约的 DSP 芯片产能。 某供应商测算，2026 年行业光端口总量约 1 亿个，2027 年将达到 2 亿个；OFC 展会此前给出的预测为 2026 年 8000 万个，2027 年 1.6 亿个，本次预期出现上调。 行业交流信息显示，1.6T 光模块价格有望降至 1000 美元或更低，当前 800G 光模块价格维持在 400 美元附近，价格基本保持平稳。 LITE 表示，目前正在签署的长期供货协议，对应的器件价格预计将在 2028、2029 年迎来上行。 Scale‑In 向内光学互联蓄势待发，成为下一个重大机遇 光器件逐步向机柜内部迁移，继 NPO、CPO 之后，下一个技术方向就是 Scale‑In 向内光学互联。 Scale‑In 指的是在电路板上利用光互联，实现芯片与芯片之间互连。 最早的应用场景是加速器芯片与 HBM 高带宽内存之间的连接。 现阶段 HBM 凭借超高带宽，必须和加速器放置在同一基板上，受基板边缘引脚数量限制，HBM 部署规模存在上限。 如果引入光子互联，内存可以布置在电路板更远位置，甚至降级采用 LPDDR 内存，依旧可以保障高带宽传输。 初步的时间规划指向 2029‑2030 年，预计落地会在 CPO 技术之后。 Scale‑In 会带来海量光连接需求，可以采用微型 VCSEL 或者微型 LED 器件；同样也会存在采用连续波 CW 激光器的 ELS 外置激光器部署方案。 微型 VCSEL 速度、传输距离优于微型 LED，微型 LED 的优势在于集成密度更高。 OCS 光交换机向机柜内部拓展应用 OCS 光交换机订单持续增长，客户群体已经拓展至谷歌、微软、甲骨文之外的厂商。 1U 机架式 OCS 方案并非面向谷歌开发，对应的是另一家新的超大规模云服务商。 LITE 正联合 ODM 代工厂扩产 OCS 产品，同时公开表示谷歌需求量巨大，未来大概率会采取多供应商采购策略。 重点参会企业核心纪要 LITE 公司 2028 财年每股收益上调 40 美元的预期，建立在 OCS 方案持续获取订单、业务顺利推进的基础之上。 该公司基于 MEMS 技术的 OCS 方案，在其最大客户处正在抢夺客户自研方案的市场份额，6D 环网项目订单持续增长。 40 美元每股收益的指引已经包含 CPO 产能爬坡带来的贡献，NPO 业务属于完全额外的增量收益。 公司认为自家 OCS 方案相比竞品成本更低、可靠性更强；当前一套 OCS 系统可以服务 11 个机柜。 公司判断，后续市场会出现第二家商用 OCS 供应商，客户普遍希望至少实现双供应商供货。 1U 机架式 OCS 方案，代表客户群体进一步拓宽。 目前手握 5 个 NPO 合作项目，3 个项目采用 ILS 集成激光器，另外 2 个项目采用 ELS 外置激光器；预计 2028 财年下半年实现相关收入确认。 预计 12 月所在季度，规模向外扩展型 CPO 业务可实现 5000 万‑1 亿美元营收。 公司将 Scale‑In 向内光学互联视作光器件领域另一大重要机遇，该技术能够把 HBM 内存从计算芯片组上解耦，依靠光互联完成连接，VCSEL 就是可落地的技术路线之一。 正在洽谈 2028、2029 年度激光器长期供货协议，预判器件价格依旧存在上涨可能性；跨机柜互联方案所用泵浦激光器同样存在涨价空间。 英伟达可以按固定价格获取格林斯伯勒工厂 50% 的产能；英伟达拥有选择权，可以采购剩余产能，但需要给 LITE 预留备货周期。 在等待英伟达决策的同时，LITE 也在向其他客户推销该部分产能，推动客户签约锁定。 预判 Coherent‑Lite 光模块会在 2027 年末或者 2028 年年初进入数据中心，目前该方案主要由某头部超大规模云服务商推动，我们判断该客户为谷歌。 Coherent（COHR）公司 在 PhotonLink 发布会更新市场空间测算，基础业务潜在市场空间为 600 亿美元，NPO/CPO 对应的 PhotonLink 产品市场空间为 300 亿美元。 对比此前新产品市场空间 200 亿美元（涵盖 CPO/NPO、OCS、多轨方案、热管理方案）、其余基础业务 500 亿美元；本次调整将 OCS、多轨方案、热管理划入基础业务板块。 概括来看，NPO/CPO 潜在市场空间由 150 亿美元提升至 300 亿美元；基础业务 TAM 增加 100 亿美元，其中 50 亿来自业务板块重分类，另外 50 亿为新增增量。 300 亿美元新产品空间绝大部分来自 CPO/NPO；如果芯片直连 Scale‑In 可以在 2029‑2030 年落地，还会带来额外增量市场。 PhotonLink 产品，每 100T 算力芯片对应的器件价值最高可达 15000 美元。 公司展示、介绍多款方案：用于 Scale‑Out、Scale‑Up 的超高功率连续波 CW 激光器搭配 ELS 外置激光器；面向 NPO 的 70‑100 毫瓦高功率连续波激光器；用于光纤阵列的 VCSEL 阵列；面向多芯光纤的高密度 VCSEL 阵列。 CPO 的部署形态采用外置激光模块中的超高功率连续波激光器；目前已经拥有超过 10 个客户合作项目；一套 100T 算力解决方案器件价值最高可达 15000 美元。 Scale‑Out 向外扩展方案预计 2026 年第四季度确认收入；Scale‑Up 向上扩容方案预计 2027 年下半年确认收入，公司已经拿到锚点客户以及长期供货协议 LTA。 NPO 可选择两类形态，VCSEL 阵列 / 连续波激光器集成在 NPO 模块内部，或是采用超高功率连续波激光器 ELS 外置激光器方案；已拥有超过 10 个合作项目，单套 100T 方案器件价值最高 15000 美元；预计 2027 年下半年确认收入；连续波激光器方案已经锁定锚点客户以及长期供货协议。 公司判断外置激光器方案会早于集成激光器方案落地；两种方案给 Coherent 带来的器件价值差异不大。 芯片直连 Scale‑In 技术，可选 VCSEL 阵列、连续波激光器、超高功率 CW 激光器搭配 ELS 外置激光器；目前拥有 5 个以上合作项目，预计 2029‑2030 年产生营收。 OCS 全系列产品在多个场景（Scale‑Up、Scale‑Out、潜在 Scale‑Across 跨机柜互联）均收获不错的客户兴趣；已有客户将 OCS 用于机柜内 Scale‑Up 扩容，多家客户表达意向。 公司认为后续会出现更多 MEMS 路线 OCS 供应商，液晶技术将成为 Coherent 的差异化技术。 迈威尔（MRVL）公司 迈威尔认为 NPO 会衍生多种技术方案，属于通往 CPO 道路上的过渡方案。 迈威尔的光引擎产品，只会和自家交换机或者专用 ASIC 芯片配套对外销售；同时会独立售卖分立 TIA 跨阻放大器以及驱动芯片，并且支持开放 CPX 标准。 公司判断，在 1.6T DSP 芯片业务上，公司可以维持和 800G 时代相近的市场份额；相关方案已经完成资质认证，产能供给也已经就位，为后续产能爬坡做好准备。 看好 Scale‑In 向内互联的巨大机会，“无激光器” 相关技术会进入市场；公司同时研发微型 LED 与微型 VCSEL 两条路线，二者适配不同应用场景。 微型 VCSEL 速度、传输距离更占优势，微型 LED 优势在于集成密度；Scale‑In 会催生海量连接需求，仅依靠磷化铟 InP 产品不足以满足全部潜在需求，需要其他技术路线作为补充。 Credo（CRDO）公司 现场演示 1.6T ZeroFlap 光模块方案；依托自研 DSP 芯片、配套硬件以及 PILOT 软件，可以实现多维度链路状态实时监控，监控维度包含温度、链路抖动等指标。 预计自家 1.6T 产品价格可以做到和竞品处在同一水平。 公司指出光纤光学当中最常见故障诱因之一是光纤污染，也就是灰尘进入光器件内部。 同时现场演示 DustPhotonics 的光子集成芯片 PIC 产品。 SMTC（未纳入公司覆盖范围） SMTC 认为，至少 50% 的市场份额依旧会保留给可插拔光模块，剩余 50% 由 CPO 与 NPO 瓜分。 超大规模云服务商在 NPO 发展初期，都会推出属于自己的定制型号，后续行业标准才会逐步收敛统一。 可插拔方案的优势是替换、维护便捷；NPO 模块替换维护难度相对更高。 NPO 可以复用现有技术与产线，而 CPO 需要一套全新的生产工艺流程，因此 CPO 落地时间会被进一步推后。 在 200G 每通道速率条件下，一套 NPO 模块里面，TIA 跨阻放大器、驱动芯片的器件用量，是传统普通光模块的 4 倍。 SMTC 拥有适配 TIA 与驱动芯片的成熟 CMOS 工艺，可以以此和采用砷化镓 GaAs 工艺的竞品拉开差异化。 回顾历史，在 800G 单模光纤 TIA 市场，公司份额此前维持在百分之十几，目前市场占比已经超过 50%。#文字观点", "publish_time": "2026-09-26 11:58", "tags": ["文字观点"]}, "post:2026-09-26T09-52:1baedf56756b": {"id": "post:2026-09-26T09-52:1baedf56756b", "kind": "post", "title": "2026-09-26 09:52", "source_label": "帖子正文", "excerpt": "AI吃光晶圆产能 分析师预计涨势或延续到2028年 9月25日｜据快科技，AI需求持续吃紧12英寸晶圆供应，2027年新签长期协议(LTA)价格大幅上涨，外延晶圆涨幅15%至25%，抛光晶圆涨幅超过40%，部分二线客户涨幅可能超过50%。分析师预计12英寸晶圆现货价格最早在今年第四季度就会超过现有L", "content": "AI吃光晶圆产能 分析师预计涨势或延续到2028年 9月25日｜据快科技，AI需求持续吃紧12英寸晶圆供应，2027年新签长期协议(LTA)价格大幅上涨，外延晶圆涨幅15%至25%，抛光晶圆涨幅超过40%，部分二线客户涨幅可能超过50%。分析师预计12英寸晶圆现货价格最早在今年第四季度就会超过现有LTA水平，为2027年合同重谈提供更高的基准，涨势可能延续到2028年。 12英寸晶圆需求主要来自先进制程应用，覆盖AI计算、智能手机和PC；8英寸和6英寸晶圆主要用于汽车和工业功率半导体。外延晶圆在晶圆表面生长一层单晶硅，对先进AI芯片尤为重要，台积电等一线代工厂大量使用。消息指出，部分晶圆合同今明两年陆续到期，过去两三年原材料、电费和建厂成本大幅上涨，行业普遍预期新签合同至少有两位数涨幅。#文字观点", "publish_time": "2026-09-26 09:52", "tags": ["文字观点"]}, "post:2026-09-26T17-28:4b360e7d6c3e": {"id": "post:2026-09-26T17-28:4b360e7d6c3e", "kind": "post", "title": "2026-09-26 17:28", "source_label": "帖子正文", "excerpt": "AI 存储需求正从 HBM 下探到 QLC SSD。智能体 AI 会持续使用实时检索和向量数据库。", "content": "AI 存储需求正从 HBM 下探到 QLC SSD。智能体 AI 会持续使用实时检索和向量数据库。由于不可能把所有数据都放在昂贵的 HBM、DRAM 上，把部分缓存和大容量数据下沉到 QLC SSD 的结构正在扩散。AI 存储层级正从 HBM → DRAM → 企业级 SSD 不断拓宽。NAND 行业景气如今只看智能手机、PC 换机周期已不够。AI 推理结构本身正在成为新的需求来源。#文字观点", "publish_time": "2026-09-26 17:28", "tags": ["文字观点"]}, "attachment:files/MS-中国内地中国香港消费  亚太食品饮料电话会议纪要.pdf": {"id": "attachment:files/MS-中国内地中国香港消费  亚太食品饮料电话会议纪要.pdf", "kind": "attachment", "title": "MS-中国内地中国香港消费 亚太食品饮料电话会议纪要", "source_label": "MS", "excerpt": "M Update China/Hong Kong Consumer | Asia Pacific F&B Call Takeaways We hosted two investor calls with a Hunan F&B distributor and a multi-brand franchisee operating around 100 chai", "content": "M Update China/Hong Kong Consumer | Asia Pacific F&B Call Takeaways We hosted two investor calls with a Hunan F&B distributor and a multi-brand franchisee operating around 100 chain stores for drinks, mainly in the Central region. Morgan Stanley Asia Limited+ Lillian Lou Equity Analyst Lillian.Lou@morganstanley.com +852 2848-6502 Charlotte Zhou Research Associate Charlotte.Zhou@morganstanley.com +852 3963-2111 Carlos Liu, CFA Research Associate Carlos.Liu@morganstanley.com +852 2848-5206 China/Hong Kong Consumer Asia Pacific Industry View In-Line Liquor: •Moutai: The F&B distributor expects overall sales to be slightly positive in 3Q/FY26. Feitian Moutai payment completion was 85% as of Sep, with wholesale price at Rmb1,750 and low channel inventory. His sales of other high-end Moutai fell DD in Apr-Sep. •WLY: his sell-through grew at a SD with 80-85% of payments completed and 1.5 months of inventory. Wholesale price is at Rmb770-780 now. •Laojiao: Guojiao 1573 lagged at 60-65% collections, with 4-5 months of inventory and his sell-through down 25-30% in Sep. •Fen Wine: 70-75% payment completed; with core product Qing20 sell- through down 10% yoy in his region in 3Q. Liquid milk & beverages: •Mengniu: The distributor saw HSD growth in 3Q, with Deluxe the best performing UHT milk SKU in his region. •Yili: more balanced MSD growth across products in the distributor's region. •Nongfu: the distributor achieved low-teens' growth in 3Q with sales growth at Oriental Leaf at 20%+ while small packaged water was softer than 2Q. •Eastroc: His energy drinks and water boost sales remained slow amid competition, while other beverages continued outperformance. Franchised milk tea coffee: •Brand performance diverges with Goodme and Luckin outperforming peers in his region. •Chagee: The franchisee saw relatively healthy store economics. Store GMV has started to stabilize after network optimization with limited openings. Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. Key Takeaways Liquor: demand remains soft into the Mid-Autumn/National Day, but low channel inventory and better supply discipline are sup nd 1H27 (vs. 3,200t now and 2,800t in 2025) will also be mainly dedicated to A1/A2 products for long- term contracts in North America. Optical fiber demand from data centers/CSPs remains solid: Preform capacity expansion remains technically challenging given largely self-developed equipment and lengthy ramp-up cycles. This should keep supply-demand relatively tight and support fiber pricing in the medium term. Offshore wind orders are approaching a new delivery cycle: A sizable pipeline of offshore wind projects across Jiangsu (3GW), Zhejiang (2GW), Guangdong (3GW), Shanghai (4GW), Shandong Qingdao (3GW), and other regions (including Fujian and Liaoning) is moving toward tendering. Copper foil revenue is expected to grow to ~Rmb2bn in 2026 vs. ~Rmb1bn in 2025 – supported by both volume growth and price increases. The business targets break-even this year after losses in 2025. Morgan Stanley Asia Limited+ Eva Hou Equity Analyst Eva.Hou@morganstanley.com +852 2848-6964 Tom Li Equity Analyst Tom.Li1@morganstanley.com +852 2239-1059 Jiangsu Zhongtian Technology Co. Ltd. (600522.SS, 600522 CG) China Utilities | China Stock Rating Overweight Industry View Attractive Price target Rmb53.23 Up/downside to price target (%) 44 Shr price, close (Sep 21, 2026) Rmb36.95 52-Week Range Rmb68.10-15.38 Sh out, dil, curr (mn) 3,413 Mkt cap, curr (mn) Rmb126,108 EV, curr (mn) Rmb114,592 Avg daily trading value (mn) Rmb5,816 Fiscal Year Ending 12/25 12/26e 12/27e 12/28e EPS (Rmb)** 0.85 1.88 2.43 3.01 Prior EPS (Rmb)** - - - - EPS (Rmb)§ 0.92 2.10 2.93 2.88 Revenue, net (Rmb mn) 52,500 62,480 72,252 84,380 EBITDA (Rmb mn) 4,770 8,537 10,773 13,105 ModelWare net inc (Rmb mn)2,902 6,421 8,306 10,282 P/E 21.3 19.6 15.2 12.3 P/BV 1.7 3.0 2.6 2.2 RNOA (%) 10.6 22.1 24.9 27.6 ROE (%) 8.3 17.4 19.6 21.1 EV/EBITDA 10.6 13.2 10.2 8.1 Div yld (%) 1.4 1.6 2.1 2.7 FCF yld ratio (%)** 2.7 3.1 4.8 6.0 Leverage (EOP) (%) (40.8) (42.5) (45.2) (47.8) Unless otherwise noted, all metrics are based on Morg 前宏观与微观主题交织、复杂性毋庸置疑，但有 3 个关键理由表明，年末前股市的上行机会正变得日益清晰——而这些理由最好结合当前市场上两股关键驱动力量来解释，本周的价格走势再次印证了这两点： 1/ 在经历了为期 3 个月的大范围 AI 相关主题盘整（最简单直观的方式就是看纳斯达克指数，如下图）、且二季度历史性大涨之后投资者对AI主题的配置和仓位大幅削减之后，本周一出现了令人信服的突破——Meta 的 Muse 产品既加速了市场对\"AI 走向广泛消费者采用\"时间表的认知，也在许多人中间点燃了明确的\"错失恐惧\"（FOMO）…… 2/ 收益率再次向上突破；但这一次的催化剂，既不是政府开支与 AI 资本开支周期对资本的极端争夺，也不是能源综合体引发的通胀推力——而是美国名义增长持续强劲的势头（如强于预期的 PMI 数据所示）。 一方面，考虑到收益率变动的幅度，股市本周还能守住涨幅确实令人意外；但考虑到增长的上行兑现以及我们已经看到的去杠杆/去风险，这或许可以用很简单的方式来合理化。从表面上看，再结合对投资者情绪的综合判断，目前还有另外两个观点似乎被普遍持有： 1/ 在 10 年期美债收益率连续 7 个月走高之后（50 年来最长的一轮！见下图），债券市场引发股市下跌的风险正在上升； 2/ 在重新增加风险敞口之前，市场需要看到海湾局势降温，以及（安全地）跨过中期选举这道坎。 当然，一如既往，核心问题是——这些共识观点到底有多正确，以及这两股关键驱动力将如何演变？这就引出年末前股市上行机会日益清晰的 3 个理由： 通胀：如前图所示（收益率连涨 7 个月），自伊朗冲突爆发以来，能源价格的头条冲击一直笼罩着核心通胀的辩论。然而，关税传导正在减弱，加息（以及随之而来的金融条件收紧）正在发挥作用，增长的二阶导正在放缓，而且我们从伊朗冲突中发现：一旦霍尔木兹海峡（SoH）的通行恢复正常，能源价格存在有意义的下行风险。伊朗谈判筹码最大的窗口期大概是从现在到 11 月 2 日，因此随时出现新一轮\"通缩性能源故事\"的风险非常明显。或许最重要、也压过能源叙事的一点是：Meta 的 Muse 刚刚向消费品与服务领域打响了通缩的第一枪。我们关于\"商业的代理式 AI 时代（agentic AI era for commerce）\"的研究，以及我们组合团队关于\"消费者惯性（consumer inertia）\"股票的研究（下方第 3 张图……），都值得一读。 增长：经济活动（特别是在美国）好于预期，而且考虑到过去 6 个月地缘政治与能源价格的不确定性，其韧性也超出预期。但往后看，上行风险将减弱，二阶导会放缓。Jan Hatzius 阐述了财政利好为何从此开始消退（减税红利递减）、汽油价格和按揭利率上升将对部分经济板块和消费者造成挤压；我们的策略师也阐述了 AI 资本开支时代为何将延续、但从此放缓。结合前述通胀观点，所有这一切意味着：央行的加息幅度很可能不及当前市场定价，而且现在根本不是担心更高收益率的时候——该担心的时间是 7 个月前。 盈利：当前市场上正在展开一场非常合理的辩论——企业盈利增长的可持续性，以及我们是否正处于一场\"盈利泡沫\"之中。幸运的是，正如最近反复发生的那样——Ben Snider 的美国策略团队刚刚写出了帮你选边站所需的研究报告：《盈利超预期，但不是盈利泡沫》（\"Over-earning, but not an earnings bubble\"）。市场在同时容纳多个真相方面能力之差令人失望，但在这个主题上，似乎有 3 个大概率为真的判断： 1/ 不要为创纪录的\"其他收入（other income）\"付溢价； 2/ 存储芯片股和部分半导体股盈利确实超出常态； 3/ 核心盈利很可能保持格外强劲——即便增速放缓——至少持续到 2027 年底。 市场一直在试图为\"增长与盈利显著放缓 + 利率更高\"的组合定价。滞胀叙事听起来很顺——但它与数据并不一致；增长放缓 + 通胀威胁消退 + 央行鹰派态度缓和，对股市而言并不是坏组合——尤其是在股票全年都在降估值（de-rated）的情况下。从很多方面看，这正是上世纪 90 年代中后期上一轮重大技术变革期间，市场反复拉锯多年的状态。往后看，如果市场预期的是滞胀、而实际兑现的是\"金发姑娘\"（goldilocks）情景，那么股市完全有条件遵循那个被广泛记录的历史规律——从中期选举到年末取得可观涨幅。#文字观点", "publish_time": "2026-09-26 17:13", "tags": ["文字观点"]}, "post:2026-09-26T09-48:76ca4c88b83c": {"id": "post:2026-09-26T09-48:76ca4c88b83c", 的木星未来数据中心项目承建方发送了 “不可抗力” 通知，该消息带动甲骨文股价下跌约 4%，我们认为市场此次反应属于过度解读。该项", "content": "【伯恩斯坦｜0924】甲骨文 “不可抗力” 事件对甲骨文、Bloom Energy 以及更广范围数据中心行业的影响 今日早些时候有消息披露，甲骨文向位于新墨西哥州多纳阿纳县的木星未来数据中心项目承建方发送了 “不可抗力” 通知，该消息带动甲骨文股价下跌约 4%，我们认为市场此次反应属于过度解读。 该项目将采用 Bloom Energy 的燃料电池作为供电设备，受该公告影响 Bloom Energy 股价下跌约 3%。 我们判断双方设备合作关系将维持不变，合同条款本身未发生任何改动。 甲骨文依旧计划在自身建设项目当中继续采用 Bloom Energy 的燃料电池产品。 由于我们无法查阅合同具体条款，因此暂时无法确定这份 “不可抗力” 通知会带来何种实际效果。 但我们认为，该通知目的在于预留各类应急处理方案、保留全部选择权，其中包含延迟支付数据中心工程款、延迟向分包商付款；同时也给到甲骨文一项潜在权利，即在合同约定上线日期之前的任意时间点，可选择解除这份合同。 数据中心承租方的合同当中，通常都会设置基于交付时间、服务等级协议等条件的补救或解约相关条款，超大规模云服务商属于市场当中最为成熟的承租方群体。 根据我们的调研以及和行业专家的交流，包括甲骨文在内的超大规模云服务商，签署的数据中心（不含硬件）合约容量，已经超出自身实际需求，会主动储备租赁空间，用来应对项目延期以及合同解约的情况。 当云服务商合作的业主方不再局限于传统高可信度开发商之后，这类缓冲储备的操作就显得尤为重要。 对甲骨文带来的影响 早期报道预计这座数据中心将在 2026 自然年第四季度上线，而市场原本预期业务负载最早会在甲骨文 2027 财年或者之后才迁入该设施，后续再逐步增加业务规模。 不过我们近期了解，项目规划上线时间调整为 2028 财年，整体分四期建设。 管理层在财报沟通会上明确表述，“从建设进度来看，数据中心项目整体进展符合计划，这两处站点均不会对我们 2027 财年的营收与盈利指引造成任何影响”。 换言之，即便出现延期，影响最早也要到 2027 自然年末或者 2028 自然年初才会显现，并且只会产生部分影响，因为项目产能会分阶段逐步释放。 市场的反应当中还有一点值得关注：当前股价估值实际上已经完全没有计入甲骨文 OCI 人工智能业务带来的营收与利润，部分市场定价甚至相当于给这块业务赋予负的估值。 照此逻辑，如果这些数据中心连同对应的营收、成本全部消失，甲骨文股价反而应当上涨。 对 Bloom Energy 带来的影响 木星项目对应约 2.5 吉瓦规模，这是 Bloom Energy 已对外披露储备订单当中规模最大的落地项目。 从商业层面看，该合同既没有被取消，也没有重新调整定价；甲骨文确认木星项目依旧按照原计划推进，代表公司具备继续执行合作的意向。 对更广范围的数据中心市场 该事件提醒市场，不同的数据中心、不同的数据中心合同之间存在明显差异。 正因如此，我们通信基建小组依旧优先看好头部开发商（Digital Realty、Equinix），同时结合开发商资质分析，对市场待落地项目规模做概率加权处理。 投资启示 甲骨文签约的数据中心容量大概率已经超过自身实际需要，新墨西哥这处设施预计到 2028 自然年末才能够向客户提供服务。 即便延期事件真实发生，也不会对 2027 财年、2028 财年营收造成冲击，甲骨文可以通过本项目或者其他数据中心，来满足客户的算力需求。 甲骨文发出的 “不可抗力” 通知，只是给到公司更多操作选择权。 因此该事件不会改变我们对于甲骨文的核心判断。 美国通信基建板块：我们给予 Digital Realty 目标价 226 美元、Equinix 目标价 1270 美元，两者均为跑赢大盘评级。 Digital Realty 估值采用远期调整后每股运营资金倍数测算，226 美元目标价对应下下一财年每股调整后运营资金 8.36 美元的 27 倍。 Equinix 同样采用远期调整后每股运营资金倍数估值，1270 美元目标价对应下下一财年每股调整后运营资金 51.19 美元的约 25 倍。 美洲电力与能源转型板块：Bloom Energy 评级为与大盘持平，目标价 282 美元。 事件详细说明 今日早些时候消息传出，甲骨文向新墨西哥州多纳阿纳县木星数据中心项目承建方发送 “不可抗力” 通知，甲骨文股价随之下跌约 4%，我们认为属于过度反应。 该项目供电设备供应商 Bloom Energy 股价同步下跌约 3%，我们同样认为市场反应过度。 尽管一期工程（大概率为基础设施以及部分建筑主体）预计 2027 自然年完工，但新墨西哥州多纳阿纳县木星数据中心，原本规划要到 2028 自然年末才正式面向客户提供服务。 我们测算该项目包含四座 225 兆瓦的建筑，第一座预计 2028 年末交付客户，剩余三座会在 2029 年陆续交付。 本次触发不可抗力通知的是政府审批带来的延期问题，但和其他超大规模算力服务商一样，甲骨文已经在多年项目计划当中预留了延期缓冲。 我们认为，延期本身以及不可抗力通知，均不会改变我们对甲骨文的核心判断。 站在 Bloom Energy 的角度，设备合作关系保持完整，合同内容没有改动，甲骨文依旧计划在建设当中使用 Bloom Energy 燃料电池。 事件完整经过 木星项目是坐落于新墨西哥州森兰帕克的四栋建筑园区，占地约 1400 英亩，临近埃尔帕索。 四座建筑中的第一栋预计 2027 年末通电，剩下三座在 2028 年陆续投用。 OpenAI 是该站点甲骨文的主要客户。 算力供给高度依赖电力，项目原本计划使用以天然气作为燃料的 Bloom Energy 燃料电池进行供电。 负责输送天然气的绿智利管道项目，是一条长度 17 英里的管线，用来将跨西部管线系统和项目站点相连，其投用时间从原计划的 2026 年 8 月推迟至 2027 年 2 月。 延期的原因是新墨西哥州土地办公室，受到当地官员以及环保团体基于气候、资源层面的反对，多次否决跨州属土地的通行许可。 Bloom Energy 必须拿到该天然气供应之后，才能够在项目现场开展设备调试工作。 该事件对于数据中心建设的普遍意义 甲骨文向数据中心承建方发出了不可抗力事件告知。 由于无法查阅合同原文，我们无从知晓这份不可抗力通知确切效力。 但不可抗力条款广泛应用于各类合同，一般用来在发生不受自身控制的外部事件时，免除合同一方部分履约义务。 而在本次事件当中，我们认为核心目的是做好各类突发情况预案，把全部选择权掌握在自己手中，既包含延迟支付数据中心工程款、电力及冷却相关分包商款项；也给到甲骨文潜在权利：在合同约定上线日期之前，如果项目达不到上线条件，可以选择解除合同。 简单来讲，如果设施无法达成 2028 年上线目标，甲骨文可以选择延期付款。 同时这份通知也相当于向政府机构与政界释放信号。 近期社会舆论当中，要求推迟数据中心建设的政治压力有所上升，我们不去评判这些诉求本身合理与否。 但这份通知意味着，理论上甲骨文可以放弃该数据中心项目，当地也会因此损失预期税收、新增就业岗位等收益。 数据中心承租方合同当中，向来包含依据交付时间、服务等级协议设置的补救、解约条款，超大规模云服务商属于市场中最为专业成熟的承租方。 除此之外，根据我们调研以及行业专家沟通，包含甲骨文在内的超大规模云服务商，签署的数据中心合约容量已经超过自身实际业务需求，会主动储备租赁空间，用来应对项目延期以及合同解约风险。 当云服务商合作范围跳出传统高可信度开发商之后，这种缓冲储备的操作就变得更加普遍。 对 Bloom Energy 的影响回溯 Bloom Energy 和甲骨文的合作始于 2025 年 7 月的试点项目，Bloom Energy 仅用时约 60 天，就在甲骨文一处数据中心完成现场供电部署，优于原定 90 天的目标工期。 这促使双方在 2026 年 4 月中旬签署一份主服务协议，协议约定 Bloom Energy 可为甲骨文各站点最高提供 2.8 吉瓦燃料电池，其中 1.2 吉瓦已经签订合约。 木星项目在 2026 年 4 月末追加纳入合作范围，甲骨文对外宣布多纳阿纳县园区放弃原本燃气轮机方案，整体改用燃料电池微电网，规模最高可达约 2.5 吉瓦。 这对 Bloom Energy 而言属于重大项目突破，2.5 吉瓦也是 Bloom Energy 在手储备订单当中规模最大的一笔落地项目。 针对本次公告，我们的判断是 Bloom Energy 依旧是甲骨文该项目的选定供应商，甲骨文也会继续履行与 Bloom Energy 之间的合同。 对甲骨文的影响分析，我们从五个角度进行考量 第一，甲骨文签署的数据中心合约容量，大概率高于完成全部合同义务所需要的实际规模，如果后续有需要还可以继续签约扩容，尤其针对距离落地还有两年的需求。 第二，木星项目预计到 2028 自然年第四季度才能够承接客户业务，管理层已经多次说明，项目不会对 2027 财年营收与业绩指引产生冲击。 第三，早期报道预计数据中心会在 2026 自然年第四季度上线，而市场原本预期业务负载最早在甲骨文 2027 财年之后才迁入，再逐步扩容。管理层财报会上表述，“从建设进度来看，数据中心项目整体进展符合计划，这两处站点均不会对我们 2027 财年的营收与盈利指引造成任何影响”。换言之，即便发生延期，影响最早只会出现在 2027 自然年末‑2028 自然年初，而且只是局部影响，项目产能是分阶段爬坡释放。 根据我们调研和行业专家沟通，包括甲骨文在内的超大规模云服务商，签约的数据中心合约容量大于实际需求，主动设置租赁储备，应对延期和解约风险，当合作开发商不再局限传统高可信度主体时，该操作更加常见。 第四，我们认为甲骨文发出不可抗力通知，不仅仅是为获得延期付款的权利；如果项目无法实现 2028 年上线目标，也保留了彻底退出该设施项目的选择权。但我们并不认为甲骨文会真正放弃项目，该条款更多用来约束需要向数据中心承建方、分包商支付的款项。 第五，这份通知也会影响甲骨文与新墨西哥当地客户签署的合约，该事件属于不受甲骨文控制的不可抗力，也为这份对外合约带来操作弹性。 第六，受市场担忧甲骨文 OCI 人工智能数据中心合约、单一客户集中风险的影响，甲骨文股价自高点回落。综合来看，本次事件下行风险极低；延期付款还有机会改善自由现金流压力，让甲骨文有更多时间从业务当中获取现金，降低外部融资需求。 综上，该事件不会改变我们对于甲骨文的核心投资逻辑。#文字观点", "publish_time": "2026-09-26 11:58", "tags": ["文字观点"]}, "post:2026-09-26T13-27:d3e4c82b19d3": {"id": "post:2026-09-26T13-27:d3e4c82b19d3", "kind": "post", "title": "2026-09-26 13:27", "source_label": "帖子正文", "excerpt": "【浙商宏观林成炜】美方Factsheet速览 ❗️各方面仍需等待我国通稿进一步确认❗️部分要点如下： ⚡️未来互动 1️⃣计划互相出席APEC\\G20 2️⃣用超级智能而非人工智能定义，未来建立SI对话机制（下次26年11月） 3️⃣其他地缘（仍需等待我国通稿，欢迎详细沟通） ⚡️贸易投资委员会 1", "content": "【浙商宏观林成炜】美方Factsheet速览 ❗️各方面仍需等待我国通稿进一步确认❗️部分要点如下： ⚡️未来互动 1️⃣计划互相出席APEC\\G20 2️⃣用超级智能而非人工智能定义，未来建立SI对话机制（下次26年11月） 3️⃣其他地缘（仍需等待我国通稿，欢迎详细沟通） ⚡️贸易投资委员会 1️⃣贸易300亿清单行业范围（我国出口小电器、玩具、节日装饰品和儿童汽车座椅等；我国进口农产品、海鲜、木制品、化妆品和医疗器械 ） 2️⃣未来2年均采购1000万吨煤炭 3️⃣投资暂无明确成果 详细交流欢迎联系浙商宏观林成炜18016306832#文字观点", "publish_time": "2026-09-26 13:27", "tags": ["文字观点"]}, "attachment:files/中金公司-新能源汽车行业：问界合作模式调整，鸿蒙智行迈向新阶段-260924.pdf": {"id": "attachment:files/中金公司-新能源汽车行业：问界合作模式调整，鸿蒙智行迈向新阶段-260924.pdf", "kind": "attachment", "title": "中金公司-新能源汽车行业：问界合作模式调整，鸿蒙智行迈向新阶段-260924", "source_label": "中金公司", "excerpt": "新能源汽车：问界合作模式调整 新能源汽车：问界合作模式调整 鸿蒙智行迈向新阶段 鸿蒙智行迈向新阶段 2026-09-24 行业近况 鸿蒙智行合作模式调整。9 月 15 日，鸿蒙智行与问界宣布调整合作模式：赛力斯在负责整车研发制造、交付、售后的基 础上，进一步负责产品定义、设计、品牌营销、渠道零售及服务体系，华为由主导产品定义设计转向终端技术赋能。", "content": "新能源汽车：问界合作模式调整 新能源汽车：问界合作模式调整 鸿蒙智行迈向新阶段 鸿蒙智行迈向新阶段 2026-09-24 行业近况 鸿蒙智行合作模式调整。 9 月 15 日，鸿蒙智行与问界宣布调整合作模式：赛力斯在负责整车研发制造、交付、售后的基 础上，进一步负责产品定义、设计、品牌营销、渠道零售及服务体系，华为由主导产品定义设计转向终端技术赋能。 同时，根据未来汽车 Daily ，华为、江淮拟与玛莎拉蒂联合开发新车型，探索智能技术、整车与国际豪华品牌资源协同的合 作模式。近期鸿蒙较大的合作调整，引发市场对其未来发展的关注。 评论 负责产销主导，问界迈入合作新阶段。根据交强险数据， 2023-2025 年鸿蒙智行销量分别为 9.3/44.5/59.2 万辆，完成规 模跃升；其中 2025 年问界 / 智界 / 享界 / 尚界 / 尊界分别销售 42.5/9.3/3. 货价格最早今年第四季度超过现有LTA，涨势可能延续到2028年；DRAM短缺预计延续并加深至2027年；AMD已通知客户全系芯片统一涨约10%，从2026年Q4开始执行。\u003c/li>\n\u003cli>光通信路径分化：ECOC大会纪要显示大规模CPO落地时间点更多向本十年末期靠拢，甚至可能进一步延后，NPO开始填补其间技术空白；有观点认为至少50%市场份额仍保留给可插拔光模块，剩余50%由CPO与NPO瓜分；1.6T光模块价格有望降至1000美元或更低，当前800G光模块价格维持在400美元附近。\u003c/li>\n\u003cli>中美与宏观：白宫公布历史性国事访问成果，涉及禁毒、贸易与投资、伊朗、煤炭、AI、二战；美国确认对中国2000多亿商品降税，9月28日公布细节；中国将在2027年和2028年购买1000万吨煤炭；央行三季度例会删除“跨周期调节”，提出“加强逆周期调节”。\u003c/li>\n\u003cli>机器人与商业航天：特斯拉Optimus人形机器人产量提升约10倍，但仍在努力实现大规模可靠生产，生产线面临机器人复杂手部、自动化设备和供应商限制；SpaceXAI运营Colossus1和Colossus2，Colossus1含15万张英伟达H100、5万张H200和3万张GB200，计划年底前配110万张英伟达GB300，目标约6个月跻身行业领先。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cp>\u003cstrong>1. AI算力/大模型资本开支\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：AI令牌消耗规模持续走高带来算力需求扩张，美国超大规模云公司资本密集度发生巨大转变。\u003c/li>\n\u003cli>今天强化的逻辑：投资一方面来自当下供需失衡带来的实时需求信号，另一方面来自核心客户多年维度的算力需求；资本开支划分成两类并维持固定占比，第一类算力设备占两年资本开支70%；2026/2027/2028年分别约20/35/57吉瓦AI数据中心投产；美国五大超大规模云服务商明年AI基础设施支出增长逾50%至1.2万亿美元。\u003c/li>\n\u003cli>今天出现的催化/验证：Anthropic与Akamai达成7年116亿美元协议扩充CPU算力；美团上线longCat-2.5-Preview模型，1.6T参数，主打AI长程任务与多模态能力；Meta扎克伯格对AI“相当乐观”，反对先进AI需要全行业放缓或协调暂停发展；Cerebras出现大量下周到期的看涨期权买盘，市场关注其是否预期新超大规模云服务商交易。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>2. 半导体/先进封装/存储/晶圆\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：AI需求持续吃紧12英寸晶圆供应，并外溢到存储与芯片涨价。\u003c/li>\n\u003cli>今天强化的逻辑：2027年新签LTA价格大幅上涨，外延晶圆涨幅15%至25%，抛光晶圆涨幅超过40%，部分二线客户涨幅可能超过50%；现货价格最早第四季度超过现有LTA，为2027年合同重谈提供更高基准，涨势可能延续到2028年；环球晶圆12英寸平均售价2026年92美元、2027年预计122美元、2028年预计166美元；DRAM短缺预计延续并加深至2027年，2026年预计-17%、2027年预计-15%，绝对缺口持续扩大；AI存储需求从HBM下探到QLC SSD。\u003c/li>\n\u003cli>今天出现的催化/验证：AMD全系芯片统一涨约10%，从2026年Q4开始执行，不只是AI加速卡和消费级显卡，连主板芯片组也一起涨；英伟达考虑采用玻璃基板，在AI芯片上堆叠更多HBM；消费级AI智能体普及带动CPU需求增长，截至9月23日安谋股价相较9月17日累计上涨约26%；SK海力士旗下Solidigm最早将于2027年考虑在美国上市。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>3. 光通信/CPO\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：ECOC大会纪要显示客户路线图分化，技术路径喜忧参半。\u003c/li>\n\u003cli>今天强化的逻辑：大规模CPO落地时间点更多向本十年末期靠拢，甚至可能进一步延后，NPO方案开始填补其间技术空白；CPO最早应用场景是加速器芯片与HBM高带宽内存之间连接；公司将Scale-In向内光学互联视作光器件领域另一大重要机遇，该技术能把HBM内存从计算芯片组上解耦，依靠光互联完成连接，VCSEL是可落地技术路线之一；有观点认为至少50%市场份额仍保留给可插拔光模块，剩余50%由CPO与NPO瓜分。\u003c/li>\n\u003cli>今天出现的催化/验证：行业交流信息显示1.6T光模块价格有望降至1000美元或更低，当前800G光模块价格维持在400美元附近、基本平稳；2026年800G DSP出货量预计接近5000万单位，采用7nm和5nm工艺节点；1.6T DSP需求预计6000–7000万单位；美国议员拟禁止国家安全系统使用中国光模块，给予供应商五年时间建立合规供应渠道，并允许必要时提供豁免；国海机械图解光模块设备——硅光晶圆全自动探针台；高速光互联与计算技术北京重点实验室落地北京经开区。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>4. 宏观/策略与中美关系\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：中美关系与年末股市驱动成为宏观策略焦点。\u003c/li>\n\u003cli>今天强化的逻辑：weekly mash认为有3个关键理由表明年末前股市上行机会正变得日益清晰，但需结合两股关键驱动力量解释；策略师阐述AI资本开支时代为何将延续但从此放缓；在重新增加风险敞口之前，市场需要看到海湾局势降温，以及安全地跨过中期选举这道坎；央行三季度例会删除“跨周期调节”，提出“加强逆周期调节”，与7月中央政治局会议口径相呼应。\u003c/li>\n\u003cli>今天出现的催化/验证：白宫公布历史性国事访问成果，涉及禁毒、贸易与投资、伊朗、煤炭、AI、二战；美国确认对中国2000多亿商品降税，9月28日公布细节；中国将在2027年和2028年购买1000万吨煤炭；关系定位从对抗竞争转向战略稳定，高层交往从冷处理转向互相站台，经贸从互加关税转向对等降税；特朗普拒绝伊朗停火提议，预计中期选举后恢复轰炸；中东方面，美国和伊朗正探讨分阶段达成协议以重新开放霍尔木兹海峡；港股通交易占港股成交量20%以上，今天没有港股通，港股全天只成交1000亿港元。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>5. 机器人/自动化\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：特斯拉Optimus产量提升，但大规模可靠生产仍受制约。\u003c/li>\n\u003cli>今天强化的逻辑：特斯拉近几个月将Optimus人形机器人产量提高约10倍，但公司仍在努力实现大规模可靠生产，生产线面临机器人复杂手部、自动化设备和供应商限制等问题；马斯克此前称未来十年人形机器人至少10亿台。\u003c/li>\n\u003cli>今天出现的催化/验证：澳华内镜强调主业向上，ERCP手术机器人全球先发优势显著，上市后有望开辟百亿级蓝海增量市场，打造第二成长曲线；软镜从跟跑到局部领跑，高端医院渗透加速，中国消化道早筛刚需旺盛。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>6. 商业航天/卫星与液冷/电源\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：SpaceX五角大楼合同与AI算力电力配套同步受到关注。\u003c/li>\n\u003cli>今天强化的逻辑：SpaceX赢得的五角大楼合同令竞争对手压力倍增；SpaceXAI旗下主要运营Colossus1和Colossus2，Colossus1包含15万张英伟达H100、5万张H200以及3万张GB200；马斯克计划年底前配110万张英伟达GB300，目标约6个月跻身行业领先。\u003c/li>\n\u003cli>今天出现的催化/验证：Cerebras采用Vicor垂直供电技术，下一代系统将在2028年及以后使用Vicor第二代VPD，预计从2027年年中起产生首笔收入，并在2028年及以后持续放量；甲骨文向新墨西哥州多纳阿纳县木星未来数据中心项目承建方发送“不可抗力”通知，甲骨文股价下跌约4%，市场反应被认为属过度解读，该项目采用Bloom Energy燃料电池作为供电设备，受公告影响Bloom Energy股价下跌约3%，如果设施无法达成2028年上线目标，甲骨文可选择延期付款。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>AI资本开支：美国五大超大规 <script>
const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=(v)=>Array.isArray(v)?'<ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
