"source_label": "帖子正文", "excerpt": "高盛——中国策略：AI改变游戏规则——中国正在崛起 自2025年初DeepSeek里程碑事件以来，中国AI相关公开股票通过股价上涨和IPO已创造近5万亿美元市值。", "content": "", "publish_time": "2026-10-12 13:01", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-12T08-09:9ffd85b74cc8": {"id": "post:2026-10-12T08-09:9ffd85b74cc8", "kind": "post", "title": "2026-10-12 08:09", "source_label": "帖子正文", "excerpt": "美股科技周观点（10/5~10/11）：市场避险情绪进一步升温 ---------------------------------- 市场表现：伴随中期选举民主党横扫两院概率上升，以及长端债券收益率持续高位震荡，叠加媒体关于OpenAI ARR的混乱报道，本周美股市场开启广泛的避险模式，市场广度进一", "content": "美股科技周观点（10/5~10/11）：市场避险情绪进一步升温 ---------------------------------- 市场表现：伴随中期选举民主党横扫两院概率上升，以及长端债券收益率持续高位震荡，叠加媒体关于OpenAI ARR的混乱报道，本周美股市场开启广泛的避险模式，市场广度进一步收窄。科技领域，CSP、软件SaaS、AI电力领涨市场，硬件半导体周内跌幅明显，存储、算力租赁、量子计算等子板块继续延续低迷表现； Hyperscaler：近期SpaceX融资、博通为Anthropic项目融资担保等再次成为市场的焦点，当下市场对任何形式的AI巨额融资均表现出明显的警惕和顾虑。这将使得即将到来的三季报极为关键，按照惯例，四大CSP将在三季报中给出2027年的CAPEX指引，并进行必要、合理的解释，目前市场一致预期2027年CAPEX增速为40%~50%左右，但考虑到英伟达此前70%的同比增速指引，以及存储芯片对AI CAPEX BOM进一步挤占等，若要实现自上而下、自下而上的逻辑自洽，四大CSP给出的数字可能需要远高于当下40%~50%的预期，如果这样，资本市场又会如何反应，我们对此保持谨慎； 半导体硬件：电力供需约束、民主党中期选举横扫可能带来的AI监管&IDC建设风险等，正在快速计入当下资本市场预期当中。同时《金融时报》关于OpenAI 9月500亿美元ARR的报道继续雪上加霜，虽然事后被认为更多是统计口径的差异，但市场当下惊弓之鸟的心态可见一斑。今年大部分时间，市场一直将Anthropic、OpenAI的ARR数据视为下游AI应用货币化进展的主要参考指标。但该指标的行业指示意义正在快速减弱，主要源于：1）主要模型厂商coding能力对齐之后带来的定价持续通缩效应；2）低垂果实收获之后，市场重心正在转向金融、医疗、法律等2B行业场景，CSP、平台软件厂商正在接力成为AI货币化的焦点。当下市场对OpenAI ARR数据的剧烈反应，更多反映了当下市场对AI货币化进展，以及缺乏更多可观测指标的焦虑； 软件&其他：短期市场避险情绪升温有助于资金流向软件SaaS。未来几周，我们也将看到更多软件企业的年度投资者会议，这亦将是其向资本市场传达乐观指引，并进一步从AI威胁论中突围的重要事件性机会。Spacex对美国低频段频谱资源的收购，意味着其进入传统电信运营市场的节奏正在加快，和Uber类似，本土电信运营商迅速在股价层面成为倒霉蛋。中期维度，应用软件、互联网板块机会更多依赖于三季报乐观数据&展望的注入。信息安全、基础软件虽面临持续的高估值的担忧，但作为典型的动量股，成长性依然是最为核心的支撑，乐观情绪向二线信息安全个股的扩散亦值得关注； 未来1~3个月：宏观压力、有利于民主党的民调数据等约束短期市场风险偏好，但闭源&开源模型能力阶段性拉大、系列AI Agent发布等有助于乐观AI叙事的延续，美股半导体硬件、CSP的三季报基本可以在Q2基础上线性外推，我们对短期的市场仍持相对乐观看法。市场节奏方面，未来1~2周关注光通信、半导体设备板块的潜在催化剂。考虑到10月底~11月上旬的Hyperscaler厂商三季报（2027年CAPEX指引）、美国中期选举，市场波动性料将显著加剧，三季报后市场交易逻辑则将逐步趋于清晰； 下周关注：1）宏观&行业：美国9月CPI数据，OCP（光通信）、SEMICON West（半导体设备）会议；2）公司：台积电、ASML财报。#文字观点", "publish_time": "2026-10-12 08:09", "tags": ["文字观点"]}, "post:2026-10-12T13-01:1cd41c77ea1e": {"id": "post:2026-10-12T13-01:1cd41c77ea1e", "kind": "post", "title": "2026-10-12 13:01", "source_label": "帖子正文", "excerpt": "野村——AI数据中心电源市场：新型GPU供电网络演进与被动元器件需求 本研究基于与英伟达Blackwell及Rubin系列电气特性等效的虚拟处理器，构建电源输送网络（PDN）仿真模型，对比分析从传统横向供电（Lateral Power Delivery）向垂直供电（Vertical Power De", "content": "野村——AI数据中心电源市场：新型GPU供电网络演进与被动元器件需求 本研究基于与英伟达Blackwell及Rubin系列电气特性等效的虚拟处理器，构建电源输送网络（PDN）仿真模型，对比分析从传统横向供电（Lateral Power Delivery）向垂直供电（Vertical Power Delivery, VPD）及集成式电压调节器（Integrated Voltage Regulator, IVR）系统的技术迁移路径与投资影响。 供电架构演进与仿真核心结论 • 横向供电的瓶颈：在Blackwell等效模型（功耗1,000W）中，横向供电可满足50%负载阶跃（step-load）设计标准；但在Rubin等效模型（功耗2,300W）中，即使增加电容，目标阻抗仍超标约70%，必须将负载阶跃条件放宽至30%方能达标。这印证了单纯增加电容和提升电压调节器响应速度已无法应对未来高功耗GPU的瞬态负载波动。 • 垂直供电与IVR的突破：将电压调节器置于GPU正下方（VPD）或将调压功能集成至封装内（IVR），可大幅缩短供电路径，降低环路电感与电阻。在50%严苛负载阶跃下，VPD的阻抗峰值仅超出容忍上限约2%（条件性兼容），而IVR完全满足标准，且电压纹波显著改善。 • 电容配置的结构性变革：新架构大幅削减电压调节器输出侧有效电容（VPD约13.1mF，IVR仅约1.77mF，对比横向供电的31.5mF），但输入侧电容需求激增（尤其IVR系统，需大量高耐压MLCC）。电容需求不再单纯随GPU功耗线性增长，而是呈现“输出侧减少、输入侧增加、封装内嵌入化、耐高压化”的定性转变。 • 功率损耗优化：供电路径缩短带来能效质变。在2,300W功耗下，从电压调节器输出到GPU的布线损耗：横向供电约260W（占调节器输出20%），VPD降至约50W，IVR仅约20W。若功耗升至4,000W，横向供电损耗将高达820W，凸显近处理器供电的必要性。 • 电感器的关键地位：电压调节器小型化、高密度化要求电感具备低矮化、低损耗、高耐热及抗磁饱和特性。薄膜电感（thin-film inductors）与磁耦合技术（如TVLR）将成为下一代PDN的核心增量部件。 被动元器件产业影响与投资标的 • 村田制造所（Murata Manufacturing, 6981 JP, 买入）：全面受益于PDN架构迭代。优势在于：1）横向供电所需的小型大容量MLCC；2）垂直供电用集成封装方案（iPaS），可将电容电感嵌入基板，预计2027年量产用于VPD输出侧；3）IVR系统所需硅电容（silicon capacitors）；4）广泛的被动件与模块技术组合，能灵活应对架构变迁，提升单部件附加值。 • TDK（6762 JP, 买入）：核心优势在于薄膜电感技术（采用HDD磁头工艺，低损耗、低DCR），预计2027年应用于IVR及VPD系统。同时，其高温额定MLCC（与太阳诱电合作开发）契合近GPU封装的高温环境需求。此外，TDK在数据中心配电侧高压被动件（铝电解电容、薄膜电容等）亦具竞争力。 • 其他关注：太阳诱电（Taiyo Yuden）的金属复合电感（MCOIL）与堆叠技术；京瓷（Kyocera）的贯通电极MLCC及嵌入封装基板技术。 终极投资逻辑 AI数据中心电源市场正从“堆砌电容”转向“系统级供电设计”。GPU功耗飙升倒逼供电网络从横向转向垂直/IVR架构，驱动被动元器件需求发生结构性分化：单位价值量提升（高温、高压、嵌入式、薄膜化）将取代单纯的数量增长，具备全产品线布局与模块级解决方案的厂商（村田、TDK）将攫取超额收益。#文字观点", "publish_time": "2026-10-12 13:01", "tags": ["文字观点"]}, "post:2026-10-12T08-06:0ff97d3e499e": {"id": "post:2026-10-12T08-06:0ff97d3e499e", "kind": "post", "title": "2026-10-12 08:06", "source_label": "帖子正文", "excerpt": "📢【中信传媒】周观点：AI应用催化持续，分众收购新潮反垄断审查通过 🎁【AI应用】 本周AI应用板块表现活跃，AI影视方向领涨，市场关注度持续提升。产业层面，OpenAI推出ChatGPT新型视觉广告形式，并扩展广告归因及效果衡量工具，推动AI原生流量商业化", "content": "📢【中信传媒】周观点：AI应用催化持续，分众收购新潮反垄断审查通过 🎁【AI应用】 本周AI应用板块表现活跃，AI影视方向领涨，市场关注度持续提升。产业层面，OpenAI推出ChatGPT新型视觉广告形式，并扩展广告归因及效果衡量工具，推动AI原生流量商业化；谷歌推出AI游戏平台Playground，支持通过自然语言生成、试玩及分享游戏，进一步降低游戏开发门槛。我们认为，随着多模态模型能力迭代、Token成本下降及Agent应用生态完善，AI应用有望加速从技术验证向规模化商业化延伸，市场关注方向亦有望由AI影视进一步扩散至AI营销、AI游戏等领域。其中，AI剧受益于内容生产提效及精品化升级，AI营销受益于广告素材生产、投放优化及AI原生流量变现，AI游戏则有望在研发降本、内容供给扩张及玩法创新等方面持续兑现应用价值。建议持续关注AI剧、AI营销及AI游戏等方向。 🎬【并购重组】 10月10日，市场监管总局公告附加限制性条件批准分众传媒收购新潮传媒股权案，传媒行业重点并购项目取得关键进展。根据此前交易方案，分众拟以发行股份及支付现金方式收购新潮传媒90.02%股权，交易对价约77.94亿元；监管认定双方在国内电梯媒体广告市场合计份额达到55%-60%，并对广告价格、公平服务及点位独家合作等提出为期5年的限制性条件。本次反垄断审查通过有望降低交易不确定性，后续双方通过点位网络互补、重复资源优化及运营体系整合，有望进一步提升经营效率、释放成本协同效应。结合此前新华传媒拟收购界面财联社100%股权等案例，传媒行业资产整合及并购重组持续推进。我们认为，分众收购新潮取得重要进展有望进一步提升市场对传媒并购重组方向的关注度，建议持续关注优质内容及渠道资源整合、地方国有文化传媒资产注入等方向，把握行业整合及上市公司业务转型带来的投资机会。 📈【投资策略】 ① 绩优及高分红标的：游戏建议关注#世纪华通、#完美世界、#三七互娱、#恺英网络、#巨人网络、#吉比特；营销建议关注#分众传媒；线下娱乐关注#大麦娱乐。 ② 新技术及新消费趋势：新技术建议关注AI，新消费趋势建议关注IP商业化。AI建议重点关注游戏、营销、教育等方向，2C应用建议关注陪伴类产品，推荐#浙数文化；IP商业化建议重点关注谷子经济、AI玩具以及动画电影等方向。 ③ 监管宽松下，游戏以及影视行业进入稳定发展通道：有优质内容储备的公司经营有望持续向上，推荐#恺英网络、#芒果超媒、#上海电影。 🌹详询：中信传媒 叶敏婷/林圳杭/卞榛#文字观点", "publish_time": "2026-10-12 08:06", "tags": ["文字观点"]}, "attachment:files/中金公司-A股策略：重回哑铃型结构？-261011.pdf": {"id": "attachment:files/中金公司-A股策略：重回哑铃型结构？-261011.pdf", "kind": "attachment", "title": "中金公司-A股策略：重回哑铃型结构？-261011", "source_label": "中金公司", "excerpt": "A 股策略：重回哑铃型结构？股策略：重回哑铃型结构？", "content": "A 股策略：重回哑铃型结构？ 股策略：重回哑铃型结构？ 2026-10-11 三季度以来， A 股红利风格相对占优 2026 年上半年， A 股科技成长风格受益于 AI 产业链、高端制造等领域的高景气，延续结构性行情。 7 月以来，全球 AI 产业 链负面叙事增多，叠加海外流动性预期收紧及中东地缘局势不确定性上升， A 股市场整体表现不佳，行业轮动加快，前期表现较 强的成长板块出现明显调整。截至 10 月 9 日，创业板指和科创 50 较 6 月底分别下跌 29.9% 和 34.0% ，同期中证红利上涨 11.5% ， 煤炭、石油石化、银行等防御性板块表现相对较强。年初至今，中证红利累计上涨 1.8% ，在主要指数中表现仅次于科创 50 （ +8.4% ），优于上证指数（ -3.9% ）和沪深 300 （ -6.8% ）。科技成长与红利风格呈现一定的 “ 跷跷板 ” 效应。在成长风格波动 加大、市场风险偏好回落背景下，红利资产的相对配置价值值得重新审视。 与 2022-2024 年上半年的整体性、趋势性行情不同，近年来红利风格更多呈现阶段性、结构性行情。 2022 年至 2024 年上半年，红利风格是 A 股和港股市场持续性较强的主线之一。我们在 2023 年 5 月《高股息投资如何在 A 股穿越周期》中提出，高景气投资机会稀缺、股市资金面紧平衡与 “ 资产荒 ” 环境三重因素共振，是彼时红利策略占优的主要原 因。 “924” 行情之后，前两大因素出现逆转。一方面， AI 产业链景气加速演进，高增长机会并不稀缺；另一方面，交投活跃，增 量资金持续入市与赚钱效应形成正反馈。叠加风险偏好回升， “ 资产荒 ” 逻辑弱化，红利风格相对吸引力下降。不过，红利风格的 配置逻辑并未结束，当外部不确定性上升、市场风险偏好回落或成长主线阶段性调整时，红利资产往往能够凭借相对稳健的盈利 和股息回报及防御属性，展现出相对收益优势。例如 2025 年 4 月关税政策扰动、 2026 年 3 月美伊冲突，以及 2026 年 7 月以来 AI 产业链预期反复、成长风格回调期间，红利风格均有相对表现。 红利风格的中长期配置价值与阶段性再平衡机会从资产配置角度看，红利风格的中长期配置逻辑依然成立。国内低利率环 境、中长期资金配置需求、上市公司股东回报机制持续完善，共同构成优质红利资产的中长期支撑。 中长期资金持续增配权益资产，保险资产负债管理新规强化稳定收益配置需求。政策层面持续引导保险、养老金等中长期 资金入市，叠加低利率环境下的收益诉求，险资权益配置力度不断加大。 截至 2026 年二季度末，保险资金股票和证券投资基金配置总规模达 6.4 万亿元，较年初增长 12.1% ，占资金运用余额的 16.2% ，规模与占比创历史新高；其中股票配置比例已连续 8 个季度环比提升 1 。新会计准则下， FVOCI 股票的公允价值变动计 入其他综合收益，不直接影响当期净利润，而符合条件的股息收入可计入当期损益，有助于兼顾长期股息回报与利润表稳定性， 增强险资配置高股息资产的动力。 2026 年中报显示，上市险企普遍增配 FVOCI 股票，股票组合中 FVOCI 占比较年初平均增加 5.5ppt 至 46.3%2 。与此同时， 2026 年 8 月《保险公司资产负债管理办法》 3 进一步强化资产负债成本收益匹配要求，明确要求 人身险公司净投资收益覆盖率不低于 100% ，有望进一步增强险资对稳定分红权益资产的长期配置需求。 分红制度完善与企业现金流改善推动上市公司分红水平稳步提升。 2023 年以来，政策持续强化上市公司分红导向， “ 十五 五 ” 规划纲要进一步提出，健全上市公司分红激励约束机制 4 ，推动分红机制向常态化、制度化发展。据国新办 2026 年 9 月新闻 发布会披露，新 “ 国九条 ” 以来，上市公司累计分红、回购超过 7 万亿元，超过 2000 家公司连续 5 年分红，超过 1000 家公司开展 中期分红，分红的频次、金额持续提升 5 。 2025 年 A 股上市公司现金分红总额达 2.4 万亿元，整体分红比例升至 44.9% ，均创历 史新高； 2026 年中期已实施及拟实施现金分红合计约 7209 亿元，分红公司数量与规模延续 2024 年以来较高水平。我们认为随 着上市公司盈利质量与现金流改善，以及分红激励约束制度持续完善， A 股整体分红水平有望保持稳中有升态势。 低利率环境下，股债相对收益优势仍较突出。截至 10 月 9 日，中证红利指数的 TTM 股息率为 4.24% ，沪深 300 的 TTM 股息 率为 2.75% ，均显著高于 10 年期国债收益率 1.69% 。在国内利率中枢维持低位背景下，稳定现金分红资产相对债券、存款等传 统低风险资产仍具有较好的投资吸引力。 中短期红利风格的相对配置吸引力有所提升。 2022-2024 年上半年支持红利全面占优的三个条件 —— 高景气投资机会稀 缺、资金面紧平衡及 “ 资产荒 ” 环境，并未完全重现，但高增长机会的波动性上升和近期市场风险偏好与资金面边际收紧，可能带 来相较过去两年持续性更高的红利配置需求。 宏观总量修复弹性有限，盈利增长仍以结构性机会为主。国内经济基本面温和修复，出口和 AI 产业链维持高景气，但内需 和地产仍然偏弱，政策传导与复苏的广度及弹性仍待观察。根据《哪些公司三季报有望好于中报？》，三季报 A 股整体盈利增速 或环比回落，上游能源原材料及 TMT 领域有望延续较高增长。 下载日志已记录，仅供内部参考 市场风险偏好阶段性回落，增量资金趋缓。尽管 AI 长期产业趋势并未改变，但近期市场对海外资本开支回报周期、主要大 模型厂商 ARR 增长不及预期、光模块领域外部限制等担忧有所升温，叠加部分热门赛道估值偏高、持仓较为集中，加剧了成长板 块的短期波动。与此同时，海外流动性收紧预期与中东地缘局势反复，持续扰动全球风险偏好， A 股交投活跃度边际降温。资金 供给方面， 7 月以来， A 股 新开户数和新成立偏股型基金份额较上半年明显回落，增量资金入市积极性下降。 美债利率上行提高估值敏感度，红利资产历史上和美债利率存在一定相关性。我们此前的历史复盘显示 6 ， A 股红利风格 相对收益与 10 年期美债利率的走势存在一定相关性。在美债利率进入上行周期后，高股息策略在 A 股市场上有较大概率取得超额 收益。 2026 年 7 月以来，美债长端利率持续攀升， 10 月初 10 年期与 30 年期美债收益率均创下 2002 年以来新高。 后市展望： “ 科技 + 红利 ” 的哑铃型配置结构重视程度有望提升我们在《高股息策略能否继续占优？》中指出，高股息策略 不仅仅在基本面走弱、股市调整时具备防御属性，在基本面缓慢修复、市场区间震荡或缓慢向上时，也可能凭借稳定回报和价值 属性取得阶段性相对收益。展望后市，科技成长的中期产业逻辑仍然成立，但短期不确定性与估值波动可能加大，优质红利有望 在成长主线之外提供另一类配置考量。 一方面，国内经济总量修复偏温和，但 AI 硬件、算力基础设施、半导体、创新药等领域仍具备相对独立的产业景气逻辑和 盈利增长潜力。当前 A 股 AI 产业链整体仍处于需求驱动的良性扩张阶段，具备核心竞争优势、能够兑现盈利增长的科技成长企业 仍有自下而上的配置机会。但海外 AI 资本开支的持续性及商业化回报仍存在不确定性，叠加海外通胀压力与流动性紧缩风险上 升，成长板块可能面临更大的盈利预期与估值波动。另一方面，在高增长机会不确定性上升、市场风险偏好波动加大背景下，投 资者对盈利确定性和稳定现金流的重视程度有望提升。国内低利率环境、中长期资金配置需求和分红制度持续完善，为优质红利 资产提供了中长期支撑，有望发挥提供稳定现金回报、缓冲成长板块波动风险的作用。 综合来看，在总量增长弹性有限、结构性高景气与市场风险偏好波动加大并存的环境下， “ 科技 + 红利 ” 的哑铃型结构有望 成为兼顾盈利增长弹性、股东现金回报与组合稳定性的配置选择。科技端建议关注产 业趋势明确、具备长期竞争优势及盈利 兑现能力的企业；红利端关注盈利与现金流稳健、分红可持续且估值合理的优质公司。 A 股高股息选股组合更新 2025 年 A 股企业分红总额继续增长，但板块分红情况分化，高股息投资更应关注分红背后的盈利质量、现金流创造能力和 分红持续性。我们在 2023 年 5 月发布的《高股息投资如何在 A 股穿越周期》中，提出 “ 优质自由现金流、稳定高分红和中等股息 率 ” 的优化选股思路。本期延续上述框架，结合最新估值、股息率及 2026 年半年报披露的盈利和资产质量数据，对高股息选股组 合进行更新。具体数值设定请参照我们此前发布的报告《红利风格怎么配？》，本期共入选 72 家上市公司。 从本期选股结果来看，在金融、能源、公用事业等传统高分红板块之外， 1 ）泛消费红利仍是优质高股息资产的重要来 源。食品饮料、家用电器、纺织服装、轻工制造、传媒等泛消费红利入选公司具有较强延续性，相关企业多为处于成熟期的龙头 公司，具备一定的渠道和品牌优势、行业竞争格局稳定，增长与现金流稳健。医药生物领域入选公司主要集中在品牌中药、 OTC 及医药零售等偏消费属性的细分方向，相关企业通常具有相对稳定的终端需求、较好的盈利能力及持续分红记录。 2 ）工业 制造龙头逐步进入高股息投资视野。汽车、电力设备、机械设备等工业制造领域涌现更多符合高股息筛选条件的企业。随着部分 制造业环节产能周期改善、行业竞争格局优化，具备技术、规模和市场竞争优势的龙头企业有望在盈利能力提升的同时，改善现 金流与资本开支结构，逐步释放现金分红潜力，向 “ 盈利增长 + 稳定分红 ” 的股东回报模式发展，成熟制造业龙头的长期配置价值 提升。 3 ）高股息特征开始向科技行业延伸。 2025 年计算机行业现金分红股息率相比 2024 年有所上升，分红率亦明显改善。 2026 年计算机行业上市公司开始进入高股息组合，部分具备较强现金创造能力、资本开支需求相对可控及持续分红意愿的科技 企业，已开始呈现一定的高股息投资特征，值得持续关注。 A 股周度市场回顾（ 2026 年 10 月 8 日至 10 月 9 日）市场表现：本周节后两个交易日 A 股延续震荡调整。上证指数下跌 0.7% ，偏大盘蓝筹的上证 50 和沪深 300 分别下跌 0.6% 和 0.9% ；偏成长风格的科创 50 和创业板指分别下跌 demand for passive parts We compare and ana", "content": "AI data center power supply marketANCHOR REPORTGlobal Markets Research 8 October 2026 Development of new GPU power delivery networks and demand for passive parts We compare and analyze the shift from lateral power delivery to vertical power delivery and IVR systems using simulations based on virtual processors. Methodology: We devised virtual processors equivalent to Nvidia's Blackwell and Rubin series and compared GPU power delivery network configurations using simulations.• Comparison of power delivery systems: Lateral power delivery met our design criteria in the Blackwell-equivalent model but failed to do so in the Rubin-equivalent model, even with increased capacitance, and we had to relax the conditions. The use of vertical power delivery and integrated voltage regulator (IVR) systems improved power supply stability, and the IVR system met our design criteria. These systems use less capacitance on the output side of the voltage regulator but need more capacitance on the input side.• Implications for passive parts: Increases in GPU power consumption are changing the configuration of electronic parts, the required capacitance, and where they are located. In future, we think embedding capacitors and making inductors smaller will be crucial.• Stock picks: We recommend Murata Manufacturing for the comprehensive strengths of its broad product lineup, and TDK for its lead in thin-film inductors.•Research Analysts Japan electronic parts Manabu Akizuki - NSC manabu.akizuki@nomura.com +81 3 6703 1185 See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts. wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 EQUITY: JAPAN ELECTRONIC PARTSAI data center power supply marketGlobal Markets Research 8 October 2026 Development of new GPU power delivery networks and demand for passive parts We compare and analyze shift from lateral power delivery to vertical power delivery and IVR systems using simulations based on virtual processors Simulating power supply configurations based on virtual processors We think the market for AI data center power supplies will present a wide range of investment opportunities. Power delivery networks (PDNs), which supply electricity to GPUs, are approaching a turning point in terms of designing the configurations of capacitors and voltage regulators as the power consumption of GPUs increases. In this report we carry out a simulation of virtual processors with the same electrical properties as Nvidia's Blackwell and Rubin products to compare and study PDN configurations for these virtual processors. Comparing use of vertical power delivery and IVR systems versus lateral power delivery We first built lateral power delivery models for both processors and calculated the split in current demanded by the GPU between voltage regulators and capacitors, as well as PDN impedance and voltage droop. We then constructed models for the Rubin-equivalent processor using vertical power delivery, where the voltage regulator is placed below the GPU, and for an integrated voltage regulator (IVR) system, where voltage regulation is integrated into the package. We compared these against lateral power delivery in terms of how improved voltage regulator responsiveness and shorter power delivery pathways affect voltage stability and capacitor configuration. Qualitative changes in component configurations depending on power delivery system The results of our simulations showed that the lateral power delivery model for our Blackwell- equivalent processor cleared our design criteria, but the Rubin-equivalent processor, which has higher power consumption, failed to achieve its target impedance with lateral power delivery, and we needed to relax our load fluctuation condition. Even after this, the effective capacitance on the output side was some 60% higher than for the Blackwell-equivalent processor (roughly 32mF). Increasing capacitance on the PCB side had little impact, and the only effective measure was increasing capacitance within the package, close to the GPU. By contrast, the improved voltage regulator responsiveness and shorter power delivery pathways in the vertical power delivery and IVR systems improved voltage stability. The IVR model met our design criteria, and impedance in the vertical power delivery model only exceeded the tolerable maximum by around 2%. The shorter power delivery pathways also reduced power distribution losses caused by resistance. The effective capacitance on the output side of the voltage regulator fell to around 13mF in vertical power delivery and around 1.8mF in IVR, but more capacitance was needed on the input side. The higher the voltage of input-side rails, the lower the capacitance required. This shows that increased GPU power consumption will not just simply boost capacitor demand in terms of capacitance but have a qualitative impact on part types, capacitance, and mounting locations. Given the limited mounting area provided by packages, we think moves to embed capacitors and increase mounting density will be crucial, alongside inductors to help make voltage regulators smaller. We recommend Murata Manufacturing for comprehensive capabilities, TDK for leading position in thin-film inductors We recommend Murata Manufacturing [6981] and TDK [6762] as companies likely to benefit from these advances in PDNs. Murata Manufacturing's strength lies in its broad product lineup that can keep up with changes in power delivery systems, including compact, high-capacitance MLCCs for lateral power delivery, Integrated Package Solution (iPaS) products for vertical power delivery, and silicon capacitors for IVR systems. TDK has strengths in thin-film inductors that we expect to be used in vertical power delivery and IVR systems, and it has also been working on the development of high temperature-rated MLCCs, which we think will be increasingly used in PDNs.Research Analysts Japan electronic parts Manabu Akizuki - NSC manabu.akizuki@nomura.com +81 3 6703 1185 See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts. wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Introduction Looking for investment opportunities in market for AI data center power supplies We think the market for AI data center power supplies will present a wide range of investment opportunities. Power supply to data centers is broadly divided between power distribution, which refers to getting electricity to the racks, and power delivery networks (PDNs), which take the electricity supplied to the racks and step the voltage down so that it can be used by the processors. Two power supply markets: Power distribution and PDN Power distribution systems have been shifting to higher voltages to deliver more power closer to the load and to reduce both current and power losses. PDNs take the high- voltage power delivered to the rack and step it down to 1.0V or lower close to the GPU, and are seeing a shift towards shorter low-voltage, high-current wiring sections. PDN market: Supplying power to GPU using voltage regulators and capacitors The power required by a GPU is not consistent but varies widely in a short space of time depending on the operating state of compute units and memory. Different components are used to deal with these fluctuations in load, with capacitors close to the GPU, capacitors in package or on the PCB, and voltage regulators supplying power in different time windows depending on their responsiveness. Capacitors close to the GPU make up for current shortfalls immediately after a surge in load, and high-capacitance capacitors and voltage regulators that are more distant take over power supply after that. Generally speaking, capacitors closer to the GPU provide less energy but can deal with faster changes in load. By contrast, more distant capacitors and voltage regulators can supply more energy but it takes longer for them to get the current to the load because of the resistance of the wires and loop inductance. Shift in voltage regulators from lateral power delivery to vertical power delivery and integrated voltage regulators This means that ensuring stable power supply to GPUs requires an integrated design approach that factors in voltage regulator responsiveness and capacitor placement not only to ensure the necessary capacitance in the capacitors but also to get the energy required to the GPU when it is needed. In particular, increasing fluctuations in GPU power consumption and load current can make it more difficult for lateral power delivery, the current mainstream type of PDN, to respond just by raising the number of capacitors and increasing voltage regulator responsiveness. Notable solutions to this issue are technologies to shorten the power supply path itself, such as vertical power delivery, where the voltage regulators are sited directly below the GPU, and integrated voltage regulator IVR), where voltage regulation happens on-package. Construction of simulation models using virtual processors In this report we construct a simulation model for PDNs that can respond to the power requirements of virtual processors that have the power characteristics of Nvidia's Blackwell and Rubin products (Blackwell: power consumption of 1,000W and core voltage of 0.75V, Rubin: power consumption of 2,300W and core voltage of 0.70V). We use these models to analyze the conditions required in power supply for future high-performance processors rather than to reproduce the internal circuitry and components used with actual Nvidia products. Time window model of capacitor/voltage regulator supply of GPU required current In our simulation, we look at whether the voltage regulators and capacitors can cope with the current required by the GPU and whether the system can keep the voltage at the processor terminals within the tolerable range. Voltage regulators cannot immediately keep up with rapid changes in GPU load, and capacitors are used to make up for the interim current shortfalls. Here, we look at capacitor charge swing, defined as the variance in electrical charge over the charging cycle of the capacitor resulting from the difference between current demanded by the GPU and current supplied by the voltage regulator (measured in coulombs), and look at how it affects changes in voltage. We also look at the energy buffer, defined as the energy that capacitors can supply to the GPU during periods of change in load to ensure that the voltage remains within its tolerable range (measured in joules), and see whether it can fully support the GPU requirements.Nomura | AI data center power supply market 8 October 2026 3 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 We use these evaluations to come up with capacitor requirements (measured in farads) and mounting configurations that can keep voltage swings within the tolerable range, factoring in wiring resistance, loop inductance, and voltage regulator responsiveness. First assumptions are for Blackwell- and Rubin-equivalent lateral power delivery We first construct a lateral power delivery model for Blackwell- and Rubin-equivalent processors, and analyze how higher GPU power consumption affects PDN design criteria. Using a strict load-step condition (ΔI) with the Rubin-equivalent processor pushes the impedance of the lateral power delivery model above the upper limit (target impedance) needed to keep voltage swings within the tolerable range, and resolving this requires either easing the load-step condition, sharply increasing capacitor count, or increasing voltage regulator responsiveness. Having identified these design constraints, we compare voltage stability and the required energy buffer in models that assume vertical power delivery or integrated voltage regulators. Potential impact of using vertical power delivery or integrated voltage regulators We use this information to analyze potential changes to the energy buffer needed between the input and output sides of the voltage regulator from the shift in power supply design to vertical power delivery or IVR, thereby providing insight into how this will affect future capacitance requirements, capacitor mounting location, and product mix, as well as demand for related parts and materials. 1. AI data center power supply configuration and GPU power delivery AI data center power supply configuration AI accelerators consist of multiple compute units running in parallel, which means PDNs have to both supply of large currents at low voltage and respond to sudden changes in load. Understanding the mechanisms that can support these power requirements can give us an insight into how power supplies for AI data centers are configured. Power distribution: Supplying 480V AC to server racks AI data centers take the medium-voltage (MV) alternating current (AC) provided by electric power companies and use transformers to step it down to 400V or 480V. From here, the power is supplied to the rack enclosures via automatic transfer switches (ATSs), uninterruptible power supplies (UPSs), and power distribution units (PDUs). Rack enclosure: Stepping down from 480V AC to less than 1V Within the rack enclosure, power supply units (PSUs) on power shelves are used to convert this current to nominal 48V DC (50–54V in real terms), which is then distributed to the server units via busbars. In the server units, this is then stepped down to intermediate voltage using DC-DC converters such as intermediate bus converters (IBCs) as needed, and the final voltage regulators then step this down to the GPU's core voltage of 1V or less (Figure 1). Voltage regulators adjust the supplied current by monitoring the output voltage and ensuring that the voltage remains within a given range (however, they cannot immediately respond to sudden changes in load, and capacitors have to be used to provide current shortfalls). Fig. 1: AI data center power supply configuration Source: Nomura, based on Schneider Electric, Delta dataNomura | AI data center power supply market 8 October 2026 4 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008QQ£º1490929960 48V DC power supply buses are current mainstream for rack enclosures Conventional servers frequently use PSUs within the server unit to convert 200V AC to 12V DC. In 48V power supply systems, the conversion to DC is centralized in the power shelf at the rack level, and then distributed to the server units using a common 48V-class busbar. A higher voltage allows the same power to be delivered at a lower current, thereby reducing the power distribution losses in the busbar and connectors. 48V buses are connected to battery backup units (BBUs) to ensure ongoing power supply over a certain period of time even if the AC input is lost. We analyze power supply from PDN voltage regulators through to GPU In this report we define power distribution as everything from MV input through to just before 48V DC conversion in the PSU (the AC input side) and the power distribution network (PDN) as everything from the 48V DC output of the PSU through to the AI accelerator. The PDN includes the 48V bus, IBCs, which are installed as needed, and final-stage voltage regulators, capactors, and wiring. Here, the main targets of analysis in our simulation are the final-stage voltage regulators, the capacitors on the input and output sides of this, and the wiring, while upstream, one- time voltage conversion parts, such as the power shelf and the 48V bus, fall outside the scope of our analysis. We estimate voltage regulator output current and capacitor charging/discharging current over time in response to changes in GPU load and use this to evaluate energy allocation and voltage changes for different time windows. Based on this, we identify the roles of the voltage regulators and capacitors in each different power supply method and also use determine the required capacitance of capacitors on both the input and output sides via simulation. Electrical energy characteristics required by GPUs GPUs achieve their high compute performance by operating multiple compute units and on-chip memory in parallel. Large-scale AI GPUs operate these circuits at high activity rates, which means they require the supply of average current of several thousand amps at low voltages. Moreover, the compute units and memory repeatedly switch between active and idle states depending on what processing they are doing, resulting in a load current that is not constant. The current increases sharply when multiple circuits start calculations or data transfer at the same time, and then falls when the processing is complete. As these changes occur at intervals measured in nanoseconds, GPU PDNs require the ability to both supply power continuously at with a high average current and to respond to sudden changes in step-load (large ΔI). Electrical energy supply to GPU The voltage regulator constantly supplies electrical current to the GPU and adjusts the output according to changes in load. However, the control circuitry has a response time, and it cannot change the current flowing through the output inductor of the voltage regulator instantly. Because of this, capacitors placed close to the GPU are used to supply the missing current immediately following a sharp increase in load, while in the interim the voltage regulator increases the supply current and then takes over the load. When the load declines, the capacitors absorb the spare current (in a charge cycle) to curb any increase in voltage. Role of inductors and capacitors in PDNs Capacitors help reduce voltage fluctuations by absorbing or releasing the load, while inductors prevent sharp fluctuations in current flow. Step-down voltage regulators smooth out the current using inductors, but their characteristics limit the take-off of current when the load rises sharply. Capacitors can make up the shortfall until the voltage regulator output can catch up with the load. Target impedance set during power supply design stag", "status": "extracted"}, "post:2026-10-12T17-46:84122461bfec": {"id": "post:2026-10-12T17-46:84122461bfec", "kind": "post", "title": "2026-10-12 17:46", "source_label": "帖子正文", "excerpt": "京仪装备——中信电子10月金股，现价持续推荐，强烈看好！核心观点：先进逻辑与高层数存储扩产，持续提升晶圆厂对高精度温控和工艺废气处理设备的需求，我们估计NAND客户订单占比超50%，存储订单占比超70%。", "content": "京仪装备——中信电子10月金股，现价持续推荐，强烈看好！核心观点：先进逻辑与高层数存储扩产，持续提升晶圆厂对高精度温控和工艺废气处理设备的需求，我们估计NAND客户订单占比超50%，存储订单占比超70%。我们看好公司受益于“客户扩产＋国产替代＋品类延伸”，真空泵的客户验证进展提供新的中长期看点，持续推荐。 #看点一：受益扩产。我们认为，随着国内存储扩产需求持续增强，制程升级和NAND堆叠层数提升，使刻蚀等工序对控温精度、温区及设备稳定性的要求提高，公司Chiller和Scrubber有望随客户新产线建设及工艺升级获得增量需求。公司和国内头部存储客户合作深入，在客户份额较高，我们认为有望充分受益于下游客户扩产，公司收入业绩有望加速成长。 #看点二：产品&客户强。公司产品已批量应用于14nm逻辑芯片和192层3D NAND产线，温控区间覆盖-120℃至120℃，并具备贴近客户的现场服务能力。公司产品已应用于长江存储、中芯国际、华虹集团、长鑫存储等主流晶圆制造客户，并可适配境内外主要前道主设备。 #看点三：产能交付提升。根据公司公告，公司安徽研发生产基地按计划推进，为后续交付提供产能支撑。公司自主开发的爪式和多级罗茨式干式真空泵，已有部分型号送往国内晶圆厂验证，后续关注其批量订单进展。#文字观点", "publish_time": "2026-10-12 17:46", "tags": ["文字观点"]}, "post:2026-10-12T20-13:d33def5778b8": {"id": "post:2026-10-12T20-13:d33def5778b8", "kind": "post", "title": "2026-10-12 20:13", "source_label": "帖子正文", "excerpt": "【tfjx】联讯仪器业绩预告点评：Q3业绩爆发增长环比+220%，新产品循序渐进，调整即是布局好时机 公司发布公告，预计2026年前三季度归母净利润19.00亿元~21.00亿元，同比增长1866%~2073%。业绩变动主要系受益于人工智能技术快速发展及全球算力需求持续提升，数据中心建设加速推进，高", "content": "【tfjx】联讯仪器业绩预告点评：Q3业绩爆发增长环比+220%，新产品循序渐进，调整即是布局好时机 公司发布公告，预计2026年前三季度归母净利润19.00亿元~21.00亿元，同比增长1866%~2073%。业绩变动主要系受益于人工智能技术快速发展及全球算力需求持续提升，数据中心建设加速推进，高速光通信领域市场需求保持较快增长，带动公司通信测试仪器产品及光电子器件测试设备产品销售增长。 其中，Q3预计实现归母净利润13.33~15.33亿元，同比+3233%~3277%，环比+198%~242%；Q3业绩预期中值实现归母净利润14.3亿元，同比+3483%，环比+220%。Q3业绩持续爆发增长，业绩符合我们之前预期。 光通信及光芯片检测。#以示波器为主的光通信测试设备Q3起逐步放量，核心产品向多家国内外知名用户量产供货，公司市场份额持续扩大，面向高速DAC铜缆测试需求的高速线缆测试仪批量交付。CPO等环节有望带来检测环节整体前置，加大在光芯片及光器件检测方面投入。公司CoC光芯片老化测试系统等产品向国际头部用户的出货规模持续增长。#硅光晶圆测试系统累计出货量突破100台，实现规模化量产。面向CPO/NPO OE芯片裸Die级分选测试需求的OE芯片KGD分选测试系统产品已通过行业一流用户的验证并实现收入。 新产品持续拓展。采样示波器方面，2.4T/3.2T采样示波器自研采样保持芯片已成功流片，预计2026年下半年向行业头部用户送样验证。CPO检测方面覆盖CPO全环节测试需求。CPO/NPO的KGD分选测试系统产品，进一步开展与国内外知名CPO厂商的对接合作。同时，公司拟启动高速光电混合测试ATE项目，已初步完成技术预研，将电学测试与光学测试集成到统一的自动化测试平台中，满足CPO全环节光电混合量产测试需求。 外延存储芯片检测验证取得突破。加速推进存储芯片测试设备的战略布局。高速存储芯片测试系统方面，公司自研ASIC芯片、PE芯片流片成功，已通过国内头部DRAM厂商的ETS工程验证，正在进行整机验证；HBM芯片KGD分选测试系统在客户处的送样验证工作有序推进中；中速存储芯片测试系统的研发项目已启动。 我们认为，公司在光通信测试领域卡位优势明显，有望抓住下游扩产及国产替代浪潮，实现规模快速攀升；Q3业绩有望实现环比翻倍以上爆发增长。而行业资本开支高点还远未到来，当前估值明显低位，建议重点关注！#文字观点", "publish_time": "2026-10-12 20:13", "tags": ["文字观点"]}, "post:2026-10-12T11-07:c4365905544e": {"id": "post:2026-10-12T11-07:c4365905544e", "kind": "post", "title": "2026-10-12 11:07", "source_label": "帖子正文", "excerpt": "【浙商电子】强call【燕东微】:硅光+存储+先进逻辑三重共振，弹性最大FAB!1、【硅光】公司是国内少数、北京首家实现硅光芯片规模化代工量产的企业(8英寸量产、12英寸突破)，打破了Tower、GlobalFoundries的垄断。", "content": "【浙商电子】强call【燕东微】:硅光+存储+先进逻辑三重共振，弹性最大FAB! 1、【硅光】公司是国内少数、北京首家实现硅光芯片规模化代工量产的企业(8英寸量产、12英寸突破)，打破了Tower、GlobalFoundries的垄断。 2、【存储】依然是今年半导体投资主要抓手公司4F2+CBA工艺进展迅速，有望承接头部DRAM企业工艺升级需求;能可达3万片+; 3、【二季度国产算力催化密集】:顶级团队下场，永芯科技通线加速，当前已入场3台浸没式设备，一期预计8台，对应7nm产#文字观点", "publish_time": "2026-10-12 11:07", "tags": ["文字观点"]}, "attachment:files/中泰证券-当前经济与政策思考：中美高技术企业的比较——以上市公司为对象-261010.pdf": {"id": "attachment:files/中泰证券-当前经济与政策思考：中美高技术企业的比较——以上市公司为对象-261010.pdf", "kind": "attachment", "title": "中泰证券-当前经济与政策思考：中美高技术企业的比较——以上市公司为对象-261010", "source_label": "中泰证券", "excerpt": "请务必阅读正文之后的重要声明部分中美高技术企业的比较——以上市公司为对象 ——当前经济与政策思考", "content": "请务必阅读正文之后的重要声明部分中美高技术企业的比较——以上市公司为对象 ——当前经济与政策思考 证券研究报告/宏观专题报告 2026年10月10日 分析师：杨畅 执业证书编号：S0740519090004 Email：yangchang@zts.com.cn 分析师：夏知非 执业证书编号：S0740523110007 Email：xiazf01@zts.com.cn 相关报告报告摘要 我国高技术产业快速发展，已经形成较为完整的产业体系和较强的规模基础。从规模 和创新基础来看，我国高技术产业已经成为经济增长的重要支撑。2025年我国高技术 制造业增加值增长9.4%，明显快于规模以上工业整体增速；高技术制造业占规模以上 工业增加值比重达到17.1%，“三新”经济增加值占GDP比重达18.4%，信息传输、软 件和信息技术服务业占GDP比重升至5.0%，与美国约5.6%的差距由2019年的约 2.1个百分点收窄至约0.6个百分点。投资和出口也提供支撑。2026年世界500强 中，美国141家、中国122家；高技术板块38家中，美国18家、中国11家，中国 合计收入1.01万亿美元，美国为2.23万亿美元。 在创新投入方面，2024年中国研发支出按购买力平价计算达到1.03万亿美元，首次 超过美国；2025年全社会研发经费超3.9万亿元。创新产出方面，2025年中国PCT 国际专利申请量达到7.37万件，连续多年位居全球第一；2024年中国科研产出在 NatureIndex中同样位居全球第一。与此同时，我国企业发明专利产业化率、技术合 同成交额以及知识产权使用费出口等指标持续改善，表明我国已经形成较为扎实的科 技创新和产业化基础。 如果进一步观察企业盈利和资本市场表现，中美高技术企业之间仍存在一定差异，而 且更多体现为产业结构和商业模式的差异。一方面，我国科技板块市值占比已经明显 提升，A股高技术板块市值占比超过三成，与美国科技板块的差距有所收窄，盈利占 比也在持续改善，但两国科技企业在盈利结构上仍存在一定差异。另一方面，2026年 美国500强企业平均利润为112.4亿美元，中国为48.4亿美元；在高技术企业中， 美国18家企业平均利润约348亿美元，中国相关企业平均利润约104.9亿美元。进 一步比较500强高技术龙头企业可以发现，美国企业在软件、互联网平台、半导体设 计等高附加值环节布局较多，中国企业在电子制造、整机集成等环节具备较强优势； 由于不同环节的利润率水平存在客观差异，企业收入规模的接近程度通常会高于利润 规模。 未来伴随我国高技术产业进入由规模扩张向质量提升转变的阶段。一方面，需要关注 企业盈利能力、研发投入产出效率以及现金流状况的变化；另一方面，软件、云服务、 平台业务等高附加值领域的发展，以及硬件企业向软硬件一体化和服务化延伸的进 展，也可能成为改善企业利润结构的重要方向。此外，企业全球化经营能力、海外品 牌建设，以及基础研究、科技成果转化与产业资本之间的衔接，同样值得持续关注。 风险提示：海外政策风险；地缘政治风险；研究报告中使用的公开资料可能存在信息 滞后或更新不及时的风险。 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 宏观专题报告 -2- 请务必阅读正文之后的重要声明部分内容目录 1.中国高技术企业已经形成较为扎实的规模与产业基础..........................................3 1.1从增加值来看，我国高技术产业已经发展为经济增长的重要支撑...............3 1.2从世界500强数量看，中国与美国已较为接近.............................................4 1.3中国创新投入总量持续提升..........................................................................5 1.4从创新产出来看，我国数量优势已确立.......................................................6 2.中美高技术企业的结构性差异...............................................................................8 2.1高技术企业在股市中的市值与盈利占比仍有差距.........................................8 2.2500强企业盈利能力的结构特征....................................................................8 2.3企业层级与产业环节特征..............................................................................8 3.总结与投资含义....................................................................................................12 3.1中美高技术企业的差异更多体现为结构特征..............................................12 3.2对高技术产业和资本市场的启示................................................... ）净利润合计约5402亿 元，占比15.1%；其中，电子行业归母净利润达到2587.2亿元，同比增长 195.1%，占A股整体利润约7.2%，位居各行业第三，仅次于银行和非银金 融。对比之下，2026年9月，美股标普500信息技术板块最近四个季度的 净利润占比达39.9%。值得注意的是，科技板块当前的改善更多体现为盈利 增速和产业结构变化。2026年上半年，电子行业利润同比增长近2倍，其 中AI算力需求带动半导体、存储、PCB、光模块等细分领域景气度快速提 升；科创板同期归母净利润达到1448.9亿元，同比增长约438%，显示科 技企业盈利弹性显著增强。但从利润总量看，金融业仍占据A股利润分配的 主导地位。 2.2500强企业盈利能力的结构特征 从2026年《财富》世界500强数量看，中国与美国已经形成较为接近的企 业规模。从利润指标看，两国企业仍存在一定差异。2026年美国上榜企业 利润总额达到15848.7亿美元，占全部500强企业利润的约46.7%，每家 企业平均利润112.4亿美元，销售利润率10.2%；对比之下，中国家上榜企 业利润总额约5906.5亿美元，占比约17.4%，每家企业平均利润48.4亿美 元，销售利润率5.7%。从这一指标看，中国企业进入全球大企业行列的同 时，在盈利能力和全球价值分配方面仍有进一步提升空间。2021年以来， 中国入榜企业平均利润累计增长27%，全榜平均利润增长105%，美国入榜 企业增长110%。这意味着在近5年全球500强整体盈利翻倍的背景下，中 国企业盈利的改善幅度大约只有全榜四分之一，盈利能力差距在进一步扩大。 盈利表现的差异在高技术行业也有所体现。2026年世界500强共有38家 高技术企业，美国企业18家，平均利润达到348亿美元，平均销售利润率 28.1%；而美国之外的20家企业平均利润约104亿美元，其中11家中国 企业平均利润约104.9亿美元，平均销售利润率11.4%。企业利润失衡也体 现在我国利润的行业分布结构上。中国500强上榜企业分属14个经营领域， 有金融、零售、电信、高技术4个领域的企业整体销售利润率超过5%。9 家中国上榜银行利润约2290亿美元，占122家中国上榜企业总利润约39%， 平均销售利润率超20%，远超其他行业平均水平。 2.3企业层级与产业环节特征 进一步观察500强中的中国11家（包括中国香港、中国台湾）及美国18家 高技术龙头企业，可发现深层结构差异。总量上，18家美国企业合计收入 22289亿美元，约为11家中国企业合计10136亿美元的2.2倍；但合计利 润达6271亿美元，为中国1153亿美元的5.4倍。 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 宏观专题报告 -9- 请务必阅读正文之后的重要声明部分在头部层级上，美国利润高度集中于苹果、Alphabet、微软、英伟达、Meta 五大平台巨头，五家合计利润5265亿美元、占美国合计的84%，其中 Alphabet（1322亿美元）与英伟达（1201亿美元）任一家的利润都超过全 部11家中国企业的利润总和，苹果（1120亿美元）也与之相当；而中国收 入之首鸿海精密以2601亿美元收入位列全球第23位、排名高于Alphabet 和Meta，利润却仅61亿美元，销售利润率约2.3%，中国利润实际依赖台 积电（545亿美元）与腾讯（313亿美元）两家公司，合计贡献中国合计利 润的约74%。 从业务结构看，两国样本企业在产业环节上的分布存在差异。中国11家企 业中鸿海、纬创、广达、和硕、立讯精密、联想等6家处于电子制造与组装 环节，销售利润率普遍仅1%-2.5%；美国名单则以软件、互联网平台与半导 体设计为主，英伟达销售利润率达55.6%，博通36.2%、微软36.1%、 Alphabet32.8%。反过来看，中国销售利润率超过20%的是不属组装制造 的台积电（44.6%）与腾讯（29.9%），或进一步显示利润差距源于环节。当 然，美国尾部同样有亏损的英特尔（-2.7亿美元）和销售利润率仅0.2%的 慧与，戴尔、惠普等硬件企业收益率亦仅约5%；中国的小米（9.1%）、华 为（7.6%）则展现了品牌硬件相对的盈利韧性。总体而言，中国龙头高技术 企业在收入规模上已较为接近美国，利润规模的差异主要集中在平台、软件、 先进制程与AI芯片等高附加值环节，这也正是我国企业未来向价值链上游 延伸的主要方向。 图表8：2026年500强中美高技术企业净利润规模（百万美元） 来源：《财富》、中泰证券研 B检测自动化 业务对全球PCB百强企业覆盖率超过90%。 2）历史包袱逐步出清，核心业务放量推动业绩反转。公司历史并购形成的商誉账面净 值已于2023年末降至零，并先后剥离光伏新能源及智能制造整体解决方案业务，经 营资源进一步向工业检测和高端材料集中。2025年公司营收同比增长22.30%至8.69 亿元，归母净利润0.37亿元，实现扭亏；2026H1营收和归母净利润分别同比增长 28.32%和32.27%，盈利修复延续。 3）国资入主推动治理切换，资本支持持续强化。2021年景德镇国资取得公司控制权 后，原控股股东楚联科技持股逐步下降，徐氏原管理团队分阶段退出；至2025年， 楚联科技持股降至0，公司由创始人家族治理向国资控股、职业经理层经营完成过渡。 2025年6月公司拟由控股股东参与定增，用于补充流动资金和偿还债务，资本结构 有望进一步改善。 储能扩产与检测升级共振，锂电X光设备进入量价齐升周期 1）储能需求成为锂电扩产主要增量，大容量电芯与检测升级同步抬升设备价值量。 EVTank预计，全球锂离子电池出货量将由2025年的2281GWh增至2030年的 6012GWh，CAGR为21%，其中储能电池出货量有望由652GWh增至2TWh以上， CAGR超25%。随着储能电芯由280Ah、314Ah向500Ah以上迭代，内部缺陷检测 难度持续提升；同时，检测项目由极片对齐向异物、焊接、气泡、空洞等更多缺陷扩 展，成像方式向多角度、2.5D及快速CT升级，共同推动检测工位和设备配置增加， 抬升单线价值量。据沙利文，2021年国内电池检测领域X射线设备市场规模为13.2 亿元，预计2026年增至58.0亿元，CAGR约35%，锂电扩产与检测能力升级共同 支撑设备需求增长。 2）产品平台、复杂整线交付能力与头部客户验证共同构筑公司竞争壁垒。公司产品覆 盖软包、圆柱、方形电芯，适配卷绕和叠片工艺，并将射线成像、视觉定位、AI识别、 运动控制、自动上下料及分拣集成至多工位在线设备，可满足动力、储能及消费电池 的差异化检测需求。公司已进入ATL、宁德时代、比亚迪、亿纬锂能、楚能新能源、 江苏正力等客户体系，2025年X光检测自动化收入同比增长168.93%至2.56亿元； 截至2026H1末，公司在手订单含发出商品约12亿元，其中X光检测业务超7亿元， 储能订单持续释放为后续业绩增长提供支撑。 AI算力推动PCB高端化，公司由单机量测向多工序检测与自动化平台升级 1）AI服务器成为PCB结构性增长主线，高多层与高密度互连提升检测设备价值量。 Prismark预计，全球PCB产值将由2025年的约852亿美元增至2030年的约1,233 亿美元，其中服务器及数据存储领域产值由157亿美元增至347亿美元，CAGR约 仅供内部参考，请勿外传 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 深度报告 -2- 请务必阅读正文之后的重要声明部分17%。随着AI服务器PCB向高多层、HDI、细线宽、高纵横比及复杂孔结构升级， 制程容错率持续收窄，检测需求由抽样量测向在线全检、自动判定和数据追溯延伸， 单条产线的检测工序数量和设备配置深度有望同步提升。 2）企业深耕PCB行业二十余年，品类布局齐全，持续加深对单个客户的全品类配 套能力。公司产品覆盖线宽、铜厚、板厚、尺寸、孔结构、阻抗等量测环节，并延伸 至字符喷印、PP裁切、自动预叠、分板及成品板综合检测自动线，已由实验室单机设 备向在线检测和自动化连线拓展，可覆盖PCB多道制程质量控制需求。公司PCB检 测自动化业务对全球PCB百强企业覆盖率超过90%，客户包括鹏鼎控股、深南电路、 生益科技、胜宏科技等；2025年该业务收入同比增长50.03%至1.02亿元，毛利率达 43.22%，AI高阶板扩产有望进一步放大客户复购及多品类协同空间。 给予“持有”评级。公司历史包袱显著减轻，储能X光订单逐步进入交付验收阶段，PCB 检测及高端材料构成稳健业务底盘，在线CT等新产品有望拓展长期成长空间。我们 预计公司2026-2028年营业收入分别为9.91/11.64/13.41亿元，归母净利润分别为 0.40/0.70/0.90亿元。按2026年9月30日收盘价，公司对应PE分别为79/45/35 倍。首次覆盖，给予“持有”评级。 风险提示：下游需求不及预期、订单交付及验收不及预期、新产品及市场拓展不及预 期、市场竞争加剧、研究报告中使用的公开资料可能存在信息滞后或更新不及时的风 险 仅供内部参考，请勿外传 wåÆf t\u0 动汽车贸易稳定发展。 观点重申： #锂电悲观预期已充分反应、预期及估值历史低位、叠加Q3业绩预计同环比持续增长、看好板块反弹： 1）10月排产恢复旺季显现、环增5%+。产业链反馈10月行业排产修复，整体环增5%+，其中龙头排产110GWh+，环增6%，已显著修复。明年储能维持40%+增长，叠加动力需求恢复，预计27年行业维持25%增长，此外宁德对明年增速维持25-30%预期，远好于市场悲观预期！ 2）板块Q3涨价陆续落地、预计Q3业绩同环比增长。电池龙头盈利受消费税影响，但预期已充分下修，预计同增30%，环增5%+；电解液VC Q3均价提升至15-18万，单吨净利环比提升，9月散单价格上涨至22万+，Q4预计进一步体现；铜箔Q3涨价落地，单吨净利预计修复至0.4-0.5万；隔膜、铝箔、负极受益于Q2涨价充分体现，单位净利预计环比进一步增长。 3）锂电5月以来已回调50%，当前估值已降至10-12x，市场悲观预期已充分反应，叠加油价回升至100美元+，海外储能、动力需求依然强劲，支撑27年行业增长。 #产业链涨价陆续落地、行业估值低位。电池龙头盈利受消费税+出口退税合计对利润影响1分/wh+，但市场已充分反应，预计26H2-27年单wh利润9分有支撑，对应27年仅12x，二线电池厂预计单位盈利稳定；隔膜Q3头部单平利润有望升至0.15-0.2元/平，环比进一步提升；铝箔Q2大客户涨价1k落地，龙头盈利有望升至0.3万/吨；铜箔Q3涨价落地，单吨净利预计修复至0.3-0.5万，27年龙头盈利有望恢复至0.6-0.8万/吨；负极头部已顺价1k/吨，其余厂商有望跟进； #投资建议：龙头公司对应27年估值10-12x，低估明显，继续强推格局和盈利稳定龙头电池（推荐宁德时代、亿纬锂能、蔚蓝锂芯、鹏辉能源、比亚迪、中创新航、欣旺达）、以及具备涨价弹性和优质锂电材料龙头，推荐隔膜、铝箔、铜箔、六氟、结构件等环节（推荐璞泰来、恩捷股份、鼎胜新材、佛塑科技、尚太科技、天赐材料、科达利、湖南裕能、诺德股份、富临精工、星源材质、华友钴业、嘉元科技等，关注海科新源、德福科技、多氟多、万润新能、龙蟠科技、石大胜华等）。 风险提示：价格竞争超市场预期。#文字观点", "publish_time": "2026-10-12 08:34", "tags": ["文字观点"]}, "attachment:files/天风证券-道恩股份(002838)“内生增长+外延并购”双轮驱动，DVA或开启新纪元-261012.pdf": {"id": "attachment:files/天风证券-道恩股份(002838)“内生增长+外延并购”双轮驱动，DVA或开启新纪元-261012.pdf", "kind": "attachment", "title": "天风证券-道恩股份(002838)“内生增长+外延并购”双轮驱动，DVA或开启新纪元-261012", "source_label": "天风证券", "excerpt": "公司报告 | 首次覆盖报告 请务必阅读正文之后的信息披露和免责申明 1 道恩股份 （002838）", "content": "公司报告 | 首次覆盖报告 请务必阅读正文之后的信息披露和免责申明 1 道恩股份 （002838） 证券研究报告 2026年10月12日 投资评级 行业 基础化工 /塑料 6个月评级 买入（首次评级） 当前价格 23.75元 目标价格 元 基本数据 A股总股本 (百万股 ) 478.40 流通 A股股本 (百万股 ) 420.64 A股总市值 (百万元 ) 11,361.96 流通 A股市值 (百万元 ) 9,990.19 每股净资产 (元) 8.02 资产负债率 (%) 52.02 一年内最高 /最低(元) 38.30/20.38 作者 唐婕 分析师 SAC执业证书编号： S1110519070001 tjie@tfzq.com 丁文宇 分析师 SAC执业证书编号： S1110526070001 dingwenyu@tfzq.com 资料来源：聚源数据 相关报告 股价走势 “内生增长 +外延并购 ”双轮驱动 ，DVA或开启新纪元 改性塑料：深度挖掘下游客户需求，持续拓宽下游领域 据智研咨询数据统计显示， 2016年至 2024年我国塑料改性化率从 18.81% 增长至 23.54%，整体呈现较好的发展趋势，但相较于全球近 50%改性化率 仍有较大提升空间 。随着新能源汽车、 5G通信、低空经济等新兴领域对材 料性能要求的提升，高端改性塑料需求快速增长。 TPV：国内 TPV龙头制造商，多重催化行业需求有望稳健增长 TPV是一类替代传统橡胶的新型高分子材料， 具有“可热塑加工、常温弹 性”优点。据 Mordor Intelligence 预测，全球 TPV市场需求量有望从 2026 年的 50.4万吨增长至 2031年的 65.3万吨， 2026 -2031年CAGR达5.32%， 其中汽车轻量化、电动汽车电池包密封、汽车整车回收、消费电子产品等 领域为 TPV需求的主要增量。 中国 TPV核心厂商包括山东道恩和塞拉尼斯 等， 前两大厂商占有中国大约 50%的份额， 其中山东道恩是中国最大的 TPV 生产商，占有超过 35%的市场份额。 DVA：联合国内轮胎大厂开展研发测试， 2026H2有望推进商业化应用 DVA是将聚酰胺（ PA）与溴化丁基橡胶（ BIIR）共混，采用动态硫化加工 技术制备的热塑性硫 化胶。由于 DVA具有优异的气密性及可加工性能，使 其在轮胎气密层和软管等诸多领域逐渐代替 BIIR。近年来，道恩与玲珑轮 胎合作，通过在线贴膜与成型工艺实现关键突破，将 DVA材料规模化生产 的最后一道障碍清除。公司 DVA现有 5000吨中试线，并已着手建设 2万 吨DVA专用产线以匹配未来的需求，目前 DVA已进入小批量生产状态， 计划 2026 年下半年推进商业化应用。 外延并购项目拓疆，紧盯前沿产业布局未来赛道 2025年末公司收购宁波爱思开合成橡胶有限公司 80%股权，成功进入三元 乙丙橡胶业务。我国 EPDM正处于从中端自 主向高端突破的关键期，公司 抢占国产替代先机，扩建 2.5万吨 EPDM项目，项目建成后 EPDM产能将 从6.5万吨/年提升至 9万吨/年。 主业行稳致远，新材厚积薄发 ，首次覆盖，给予“买入”评级 我们预测 26/27/28 年公司归母净利润 4.7/6.0/7.1 亿元， EPS分别为 0.97/1.25/1.49 元。我们选取金发科技、会通股份、国恩股份、沃特股份作 为可比公司，公司估值具有一定优势。通过 “内生增长 +外延并购 ”双轮 驱动，打破地域限制，同时加快 DVA、TPU等重大项目建设， 2026年下半 年有望进行 DVA的商业化推广， 有望为公司打开新的成长空间。 首次覆盖， 给予“买入”评级。 风险提示：原材料价格超预期 上涨风险；产品价格超预期下跌风险 ；拟建 及在建产能投放不及预期风险 等；股价大幅波动风险。 财务数据和估值 2024 2025 2026E 2027E 2028E 营业收入 (百万元 ) 5,300.76 6,055.92 7,982.14 8,986.06 9,960.02 增长率 (%) 16.65 14.25 31.81 12.58 10.84 EBITDA (百万元 ) 583.12 716.55 816.84 994.90 1,155.57 归属母公司净利润 (百万元 ) 140.94 188.90 465.47 599.38 711.63 增长率 (%) 0.67 34.03 146.41 28.77 18.73 EPS(元/股) 0.31 0.39 0.97 1.25 1.49 市盈率 (P/E) 75.50 60.15 24.41 18.96 15.97 市净率 (P/B) 3.52 3.12 2.82 2.57 2.31 市销率 (P/S) 2.01 1.88 1.42 1.26 1.14 EV/EBITDA 10.86 17.58 15.49 12.66 10.68 资料来源： wind，天风证券研究所 -25%-16%-7%2%11%20%29%38% 2025-10 2026-02 2026-06道恩股份 沪深300 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 公司报告 | 首次覆盖报告 请务必阅读正文之后的信息披露和免责申明 2 内容目录 1. 主业行稳致远，新材厚积薄发 ................................ ................................ ................................ .......... 5 1.1. 深耕热塑弹性基材，打造高分子材料平台 ................................ ................................ ......... 5 1.2. 公司控股股东 为道恩集团 ，实际控制人为于晓宁、韩丽梅 ................................ .......... 6 1.3. 重视研发创新，多措并举强布局四大技术平台 ................... 持续拓宽 下游领域 改性塑料 指通过对塑料进行改性， 提高阻燃性、强度、抗冲击性、韧性等方面的性能 。塑 料是", "status": "extracted"}, "post:2026-10-12T09-14:0cc00ea34042": {"id": "post:2026-10-12T09-14:0cc00ea34042", "kind": "post", "title": "2026-10-12 09:14", "source_label": "帖子正文", "excerpt": "张忆东香江策论1011《深秋反弹：精选红利价值与科技成长》 （一）回顾：“夏日寒风”已经如期兑现， 9月份趁宏观利空而逢低“播种秋天” （二）行情展望——维持深秋反弹的预判，10月下旬全球股市有望由risk-off转向risk-on 一、深秋反弹行情的资金面展望：维持“美债10年期收益率10月将从急", "content": "张忆东香江策论1011《深秋反弹：精选红利价值与科技成长》 （一）回顾：“夏日寒风”已经如期兑现， 9月份趁宏观利空而逢低“播种秋天” （二）行情展望——维持深秋反弹的预判，10月下旬全球股市有望由risk-off转向risk-on 一、深秋反弹行情的资金面展望：维持“美债10年期收益率10月将从急升转向高位震荡回落”的预判 首先，美债高收益率开始吸引配置需求，深秋行情的海外资金面重点关注四件事。 1） 进入10月，随着季末交易性因素消退，美债10年期收益率在9月急升之后，基本面高增长背景下的美债高收益率开始吸引配置需求，收益率走势由急升转向高位震荡。 上周10年期和30年期美债拍卖均获较强需求，投标倍数分别为2.77倍和2.54倍，均高于此前6次拍卖均值，表明在当前收益率水平下，长端供给仍能获得较强的市场承接。 2） 深秋行情，海外资金面重点关注四件事：一是美国通胀与就业数据，10月14日CPI数据，11月6日非农数据，关注美国通胀和就业数据是否释放降温信号；二是10月27日至28日FOMC决议及会后表态；三是11月3日美国中期选举；四是美国财政部11月4日公布2026年第四季度再融资公告（QRA），10月16日启动向一级交易商发放季度调查问卷则是潜在风向标，关注是否调整债券发行策略。其中，经济数据、美联储和财政部行为是战术性事件，中期选举是更具影响的关键性事件。 3） 随着11月初美国中期选举临近，美方将持续积极通过多方协调缓解成品油等燃料供应紧张，美方对于中东局势也有望保持克制，为通胀压力缓解和美债收益率回落创造条件。 其次，美债收益率急升之势转向放缓甚至震荡回落，有望为美股乃至新兴市场的深秋行情提供支撑，支撑美股行情从M7向具备业绩和估值性价比的更多领域扩散。 二、深秋反弹行情的中国基本面展望：重点关注经济政策的“预期差”及股市基本面和估值的“性价比” 基于基本面，我们依然维持港股10月份大概率出现反弹行情的判断。 10月4日周报我们指出，港股当前盈利和估值的性价比较好，风险偏好极低，卖空和估值等指标已到极端值；美债长端利率能否结束急升、中国经济基本面能否企稳回暖，是打开港股修复空间的两个关键变量。 首先，上周港股指数探底回升，部分情绪指标开始从极端水平修复，但风险偏好依然处于低位。港股整体、恒生科技及互联网龙头的卖空成交占比分别降至19%、22%和18%。 其次，内资仍将有望是港股深秋反弹的主要动能，当前对于中国逆周期调控政策有两大“预期差”，一是总体预期较低，二是外资相对内资的信心和预期更低。10月8日至9日，南向资金净流入68亿港元，已连续七周保持净流入，为市场提供承接。 海外投资者应该更合理地预判中国的逆周期政策：方向比节奏重要，政策方向调整之后政策力度持续加码，直到达到政策目标。我们判断，四季度政策将持续发力，以实现全年GDP目标，这是中国股市反弹的基本面基础。 第三，盈利方面，四季度随着中国经济政策落地，港股盈利预期有望改善，有利于深秋反弹，建议重点关注基本面改善较强的港股部分细分领域。当前，恒指和恒科未来12个月每股盈利预期分别较前周上升0.16%和0.75%，较9月11日分别累计增长1.18%和2.51%。 （三）投资策略：“防守反击+杠铃策略”参与深秋反弹，精选红利价值和科技成长 ——四季度，中、美股市行情反弹的催化剂：1、美国中期选举之前，美债长端收益率震荡回落，海外资金面迎来转机；2、基本面的催化剂关注，美国超级智能的应用持续扩散，而中国经济政策持续发力。 ——基于基本面，我们继续维持四季度看多美股的判断。 未来数月，如果美债长端利率如期从急升转向震荡回落，有助于科技资产的成长行情从科技龙头进一步扩散到AI应用的细分领域，还有助于在高增长高利率的格局下，能源板块、优质银行、医药、高端制造等现金流较强的优质资产的配置价值。 ——基于基本面，我们继续维持中国股市的深秋反弹行情，其中，港股10月份有望先抑后扬，在情绪修复、盈利预期改善与政策支持下厚积薄发，启动一轮具有可操作性的反弹。 港股前期调整已充分释放情绪压力，10月份，随着南向资金信心的逐步恢复以及港股自身龙头股票的“short cover”，港股有望确认见底企稳。后续，随着美债收益率冲高回落，为港股估值修复和反弹延续创造更有利的外部条件。 ——投资建议：杠铃策略参与深秋反弹行情，进攻的弹性方向聚焦科技成长，防守配置方向立足深度价值红利资产。 主线一、科技成长：精选全球科技龙头，把握应用扩散的成长机会。 首先，AI产业链：AI行情有望以AI应用为主导，聚焦安全可靠和推理应用扩散，兼顾AI硬件的反弹。 其次，重视生物医药、能源科技（电力设备、储能等）、高端装备、具身智能、有色金属等领域受益于AI应用落地带来的机遇。 主线二、配置价值资产：中国经济降速转型期、海外高利率高波动时代，港股和A股有一种确定性的硬核资产就是“熬出来的精华”——具备中长期价值的中国核心资产。 首先，四季度，我们预判中国经济政策将持续发力、中国经济四季度有望企稳，可以立足中期，配置运营商、电网、电力、煤炭、能源炼化、化工、金融等领域的红利型价值资产。 其次，四季度，具有较强价值安全边际的成长价值型资产，在反弹行情下将有更大的弹性，特别是港股可能迎来风险溢价收缩与盈利边际改善的共同支撑。具体而言：有色金属、 保险、香港本地股、精选具备现金流支撑的传统互联网领域的细分龙头等。#文字观点", "publish_time": "2026-10-12 09:14", "tags": ["文字观点"]}, "post:2026-10-12T14-50:d9c88716203e": {"id": "post:2026-10-12T14-50:d9c88716203e", "kind": "post", "title": "2026-10-12 14:50", "source_label": "帖子正文", "excerpt": "【华泰地产】香港房地产月度跟踪：9月香港住宅仍处于调整期9月香港住宅量价和租金均出现调整，我们认为在美联储加息预期反复、港股难言反转的背景下，短期调整或仍将持续，但依然对未来2-3年的复苏周期抱有信心。此外，香港2026年施政报告和五年规划未涉及短期地产举措，符合市场预期", "content": "【华泰地产】香港房地产月度跟踪：9月香港住宅仍处于调整期9月香港住宅量价和租金均出现调整，我们认为在美联储加息预期反复、港股难言反转的背景下，短期调整或仍将持续，但依然对未来2-3年的复苏周期抱有信心。此外，香港2026年施政报告和五年规划未涉及短期地产举措，符合市场预期；商业地产景气度延续改善，写字楼租金接近同比回正。我们维持对于香港市场占比高的港资房企的推荐，阶段性更看好受住宅量价波动影响较小、租金表现逐步迎来拐点、股息率更具吸引力的持有类房企，重点推荐太古地产、新鸿基地产、领展房产基金、港铁公司。私人住宅：量价和租金均现调整，房贷利率暂未上行 9月香港住宅量价和租金均出现调整。成交量方面，根据香港土地注册处的数据，9月香港新房私人住宅成交合约数量为1500份，在西九龙叡璟热销提振下环比+62%，但同比依然-26%；二手房成交3029份，环比+11%，同比-13%。房价方面，9月末中原地产领先指数月环比-1.2%（8月+1.4%），继7月后再度出现调整。租金方面，9月中原地产私人住宅租金指数环比-0.3%，在暑期旺季结束后迎来小幅回调。利率方面，由于港币流动性较为宽松，9月香港Prime rate并未跟随美联储加息而上升，这使得房贷利率仍维持在3.25%，略低于70平以下私人住宅平均租金收益率（8月为3.20%）。但港币兑美元已接近弱方兑换保证，若后续触发金管局收紧港币流动性，Hibor和Prime rate（以及房贷利率）均有上行压力。往前看，在美联储加息预期反复、港股难言反转的背景下，我们预计香港住宅市场短期调整仍将持续，但依然对未来2-3年的复苏周期抱有信心。施政报告&五年规划：未涉及短期地产举措，聚焦北都和公屋建设 9月16日，香港政府公布2026年施政报告和历史首份五年规划，其中房地产相关表述符合市场预期。其一，未对印花税等可能影响短期市场的政策进行调整，仅在鼓励生育组合拳中为合资格购房家庭提供最多2万港币印花税减免。其二，更多聚焦北部都会区建设和公营房屋供应，其中北都将进入建设高峰期，未来五年计划产出900-1000公顷熟地（全港1400公顷）和7万个住宅单位，争取年内通过《北部都会区发展条例草案》；公屋将继续增加供应，未来十年香港公屋建屋量将达19.6万个单位，推动公屋综合轮候时间从当前的4.5年，至2030-31年度下降到4年以下。其三，再度提出尽快落实REITs的互联互通。商业地产：零售额和空置率延续改善，写字楼租金接近同比回正 根据香港政府统计处的数据，8月香港零售业销货价值同比+5.6%，其中奢侈品零售同比+11.9%，高端零售复苏程度继续强于必选消费。根据JLL的数据，8月香港甲级写字楼空置率为12.5%，环比-0.3pct，较年初-1.6pct；其中中环空置率7.8%，已较年初-3.2pct。宏观经济和前端指标的复苏继续推动商业地产租金筑底，根据香港差饷物业估价署的数据，8月香港零售/写字楼/工厂大厦租金指数分别环比持平/+0.05%/持平，同比-2.9%/-0.1%/-0.9%，写字楼租金已连续5个月环比上涨，同比亦接近回正。 陈慎 刘璐 林正衡", "publish_time": "2026-10-12 14:50", "tags": []}, "attachment:files/中泰证券-科创跌破年线，筹码出清情况如何？-261011.pdf": {"id": "attachment:files/中泰证券-科创跌破年线，筹码出清情况如何？-261011.pdf", "kind": "attachment", "title": "中泰证券-科创跌破年线，筹码出清情况如何？-261011", "source_label": "中泰证券", "excerpt": "请务必阅读正文之后的重要声明部分科创跌破年线，筹码出清情况如何？", "content": "请务必阅读正文之后的重要声明部分科创跌破年线，筹码出清情况如何？ 证券研究报告/策略定期报告 2026年10月11日 分析师：徐驰 执业证书编号：S0740519080003 Email：xuchi@zts.com.cn 分析师：张文宇 执业证书编号：S0740520120003 Email：zhangwy01@zts.com.cn 相关报告 1、《节后行情的关键美债收益率拐 点何时出现》2026-10-07 2、《持股过节》2026-09-26 3、《10月金股报告》2026-09-24报告摘要 一、海外创新高、A股再探底，两大变量决定市场底部与反弹高度 节后前两日A股继续明显弱于海外。假期纳斯达克创新高，10月8日至9日上午A 股连续下挫，多项科技和中小市值指数再度走弱，部分创出阶段新低；9日下午，科 创等ETF获得长线资金集中承接，叠加资本市场和新质生产力相关政策，指数快速修 复。全球AI趋势未转弱，A股相对弱势主要来自内部资金出清和长端美债收益率上行 共同作用。 当前需要把两个问题分开：资金结构决定市场底部，美债收益率及美伊局势决定反弹 高度。3741点附近仍是上证下半年重要底部区域，周五更接近政策底与资金底的再 确认；但保险和固收+卖盘尚未全部消化，市场仍可能磨底，周五反弹不能直接外推为 连续主升。 二、本轮卖盘主要来自保险和固收+，出清已到后段但尚未结束 本轮资金结构与7月有明显差异。两融余额降速约为7月同期的一半，担保比例降速 也明显较慢，主观私募、杠杆资金和量化资金此前已完成较多去化；散户9月以来入 市有限，情绪指标已降至历史低位；QFII资产规模与北向交易占比没有明显变化；科 创50、创业板和中证2000等ETF则持续获得长线资金较大额度的流入。这些对照 基本排除了杠杆、量化、散户、外资和长线资金成为本轮主要卖方的可能。 保险和固收+被动赎回是本轮核心卖盘，出清已到后段。本轮机构资金呈现持续卖出 趋势，这其中，公募科技仓位也已明显下降：成交额前5%个股的交易集中度已从六 七月接近54%的高位回落至约43%的历史中枢，更值得关注的是二季度集中增配科 技的保险和固收+资金。按不同加权口径，其与科技板块的相关性已从高位回落约七 至八成，但仍高于2025年常态水平约两至三成，对应新增科技仓位可能尚有约20% 至30%待消化。资金出清已进入尾声，最后阶段仍可能带来反复，但持续性抛压正在 下降。 三、特朗普极限施压接近“临界点”，美债收益率“斜率放缓与利好催化钝化” 9月22日以来A股调整与长端美债收益率快速上行高度同步。短期压力仍主要来自 美伊冲突及其对全球通胀、汇率和官方美债持仓的影响，存量债务和AI融资需求构 成长期放大器。 中美元首会晤后，美国对华光模块等科技限制强化、中欧贸易摩擦升级和中东增兵接 连出现是本轮下跌的催化剂，但从基本面看，上述行为更接近特朗普将对伊杠杆集中 使用的极限施压，是特朗普自身政治压力和美伊-美债利率进入“临界点”的正面信号， 如同今年4月初一样，“拐点”或随时出现。 选举压力正在压缩强硬政策的持续时间。基准情景是10月或11月形成阶段性协议， 美伊局势缓和后，美债收益率较快回落；若拖至中期选举之后，共和党失利及党内、 国会对战争预算的约束会继续上升，美伊-美债利率拐点亦会在11-1月出现。 当前最重要的市场信号是美债收益率上行斜率放缓，并开始对增兵、制裁等上行催化 出现钝化。10月8日增兵消息只带来短暂冲高，随后收益率快速回落。若类似现象持 续，美债顶部信号或逐步明晰。 四、AI与政策边界未变，配置围绕科技、有色及安全对冲 OpenAI年化收入的争议主要来自统计口径。只计算直接收入与纳入间接收入会得到 不同静态规模，静态数字的差异不足以说明增速放缓。更有判断力的是月度变化： OpenAI近几个月增速继续加快，Anthropic环比增速则在放缓；周四美股短暂交易口 径争议，周五已出现修复。全球AI周期的大方向暂未改变。 国内政策仍以科技、新质生产力为主线，需求侧政策强调务实有效。消费和地产领域 可能继续出台规模适度的措施，实际力度受财政约束，重新依赖地产和基建大刺激的 概率较低。外媒报道和事件窗口仍可能催化阶段性政策预期，相关板块更适合作为主 题交易，难以替代科技、高端制造的中期主线。 科技和中小市值已进入底部区域，仓位可分批增加，反弹高度仍以美债拐点为条件。 下载日志已记录，仅供内部参考 策略定期报告 -2- 请务必阅读正文之后的重要声明部分1）中期关注科创50、中证2000和有色。保险和固收+尚有少量仓位待消化，短期更 适合逢低分步配置；若长端美债收益率确认见顶，可进一步提高科技仓位。 2）组合继续保留能源安全相关资产，如电力设备、油运等，对冲特朗普继续强硬、油 价再度上行的小概率情景。 3）医药、创新药和AI应用可积极关注。消费、地产相关方向更多交易政策预期，参 与仓位宜保持克制。 风险提示：保险及固收+资金去化慢于预期，美债收益率继续上行，美伊局势及中美、 中欧贸易摩擦超预期升级，对华科技限制实质落地，AI收入增速放缓，国内政策预期 与实际力度偏离，市场博弈复杂性超预期等。 下载日志已记录，仅供内部参考 策略定期报告 -3- 请务必阅读正文之后的重要声明部分内容目录 一、科创跌破年线，筹码出清情况如何？..................................................................5 1.1海外创新高、A股再探底，两大变量决定市场底部与反弹高度...................5 1.2本轮卖盘主要来自保险和固收+，出清已到后段但尚未结束........................5 1.3特朗普极限施压接近“临界点”，美债收益率“斜率放缓与利好催化钝化” .............................................................................................................................6 二、国内筹码出清接近尾声，美债拐点决定反弹高度...............................................6 2.1本轮卖出主体已经改变：杠杆、散户、外资和公募均非核心......................6 2.2保险和固收+是当前主要卖压，科技暴露已去化七至八成...........................8 2.3长线资金与政策共同确认底部，剩余卖压决定磨底时间.............................9 2.4美债利率：特朗普“极限施压”的“临界点”与“利多钝化”的“顶部信号” .............................................................................................................................9 2.5极限施压正在逼近政策转折，选前与选后路径均指向缓和..........................9 三、AI与政策边界未变，配置围绕科技、有色及安全对冲.....................................10 四、本周宏观资金面和行业观察（2026年10月8日-9日）.................................11 五、本周市场微观结构观察（2026年10月8日-9日）........................................15 5.1宽基指数表现............................................................................................. 延并导致共和党在中期选举中 明显失利，约束会从党外迅速转入党内。共和党高层还要面对2028年选举，很 难继续为一场被选民否决的战争承担成本；新国会正式履职后，战争拨款、军费 和行政部门人事又会受到更直接的预算与监督约束。即使错过选前窗口，政策转 向仍可能在选后出现，美债收益率的重要拐点最迟可能延后至明年1月至2月。 该路径的代价更高，期间市场波动也会更大，但并不支持选后重新发动长期战争 的情景。 市场价格已经开始出现前瞻信号。近期美债收益率上行斜率明显放缓。10月8日 美国向中东增兵的消息一度推高收益率，但冲高后很快回落，说明市场对进一步 推动收益率上行的信息已经出现钝化。这类“利多不涨”通常是顶部区域的重要 观察特征。对华限制也存在现实约束。美国未来一两年的高端光模块供给仍然不 足，若全面限制中国相关产品，将直接抬高美国AI产业的资本开支和通胀压力。 因此，相关限制可以继续作为谈判筹码，其全面落地的可行性相对有限。 综合来看，国内资金面已经给出较明确的底部，市场仍可能因保险和固收+剩余 20%至30%的科技暴露继续磨底；反弹能否从修复升级为更大行情，取决于美债 收益率是否形成趋势性拐点。若极限施压转向阶段性协议，长端利率回落将同时 改善估值和风险偏好，科创50、中证2000、有色等进攻方向的弹性会明显打开。 协议落地前，电力设备、油运等能源安全方向仍有必要保留，用于对冲特朗普继 续强硬和油价上行的小概率风险。医药、创新药与AI应用也可作为反弹中的补 充配置。 三、AI与政策边界未变，配置围绕科技、有色及安全对冲 OpenAI年化收入的争议主要来自统计口径。只计算直接收入与纳入间接收入会 得到不同静态规模，静态数字的差异不足以说明增速放缓。更有判断力的是月度 变化：OpenAI近几个月增速继续加快，Anthropic环比增速则在放缓；周四美股 短暂交易口径争议，周五已出现修复。全球AI周期的大方向暂未改变。 国内政策仍以科技、新质生产力为主线，需求侧政策强调务实有效。消费和地产 领域可能继续出台规模适度的措施，实际力度受财政约束，重新依赖地产和基建 大刺激的概率较低。外媒报道和事件窗口仍可能催化阶段性政策预期，相关板块 更适合作为主题交易，难以替代科技、高端制造的中期主线。 科技和中小市值已进入底部区域，仓位可分批增加，反弹高度仍以美债拐点为条 件。 1）中期关注科创50、中证2000和有色。保险和固收+尚有少量仓位待消化，短 期更适合逢低分步配置；若长端美债收益率确认见顶，可进一步提高科技仓位。 2）组合继续保留能源安全相关资产，如电力设备、油运等，对冲特朗普继续强 硬、油价再度上行的小概率情景。 下载日志已记录，仅供内部参考 策略定期报告 -11- 请务必阅读正文之后的重要声明部分3）医药、创新药和AI应用可积极关注。消费、地产相关方向更多交易政策预期， 参与仓位宜保持克制。 四、本周宏观资金面和行业观察（2026年10月8日-9日） 图表5：R001与DR001(%) 图表6：R001-DR001(bp) 来源：iFinD，中泰证券研究所；注：数据截至2026年10月9日 来源：iFinD，中泰证券研究所；注：数据截至2026年10月9日 图表7：两融余额和担保比例 图表8：年化波动率（%） 来源：iFinD，中泰证券研究所；注：数据截至2026年10月9日 来源：iFinD，中泰证券研究所 图表9：上证指数与沪深300股权风险溢价 图表10：机构资金情绪变化 来源：iFinD，中泰证券研究所 来源：iFinD，中泰证券研究所 下载日志已记录，仅供内部参考 策略定期报告 -12- 请务必阅读正文之后的重要声明部分图表11：全AMA20宽度情绪 来源：iFinD，中泰证券研究所 图表12：A股成交集中度 来源：iFinD，中泰证券研究所；注：当日全A成交额最高5%的股票占比；名单含北交所、ST。不是固定股票名单的成交占比。 图表13：长线稳定资金流入与流出情况（亿元） 来源：iFinD，中泰证券研究所；数据截至2026年10月9日 下载日志已记录，仅供内部参考", "status": "extracted"}, "attachment:files/万联证券-策略快评报告：《关于发展新质生产力的意见》发布，五方面举措明确产业升级路径-261012.pdf": {"id": "attachment:files/万联证券-策略快评报告：《关于发展新质生产力的意见》发布，五方面举措明确产业升级路径-261012.pdf", "kind": "attachment", "title": "万联证券-策略快评报告：《关于发展新质生产力的意见》发布，五方面举措明确产业升级路径-261012", "source_label": "万联证券 %；销售额约195万亿韩元，增长126.6%。这是三星 电子单季营业利润首次突破 100万亿韩元，也是连续第四个季度刷新历史纪录 ，但仍略低于部分市场预期 。与此同时，因手机内存价 格暴涨，三星正大幅削减第四季度智能手机供应量 20%至30%。 OpenAI在9月底向投资者披露 ，当前年化营收规模已接近 500亿美元。这一数值较去年同期实现大幅增长 ，但较媒体此前报道的 OpenAI近700亿美元年化营收水平少约 200亿美元。消息披露后，周四英伟达、甲骨文、美光科技等AI相关股票股价纷纷走低 。知情 人士指出，此前市场上出现的营收数据偏差 ，源于OpenAI投资者试图将其营收与 Anthropic年化营收做直接对标对比 。 苹果供应链公司透露 ，苹果公司结构性调整 2026年秋季手机新品订单量：对 iPhoneDuo加单30%，但总量仍未超过 1000万部，并对 iPhone18Pro砍单10%—15%，同时对iPhone18ProMax加单10%—15%，iPhone18Pro系列总订单量未变 。 资料来源：Wind，科创板日报，中信建投 下载日志已记录，仅供内部参考 机构调研热度 10本周机构调研82次，调研家数共计372家，热度有所回落。 机构调研次数来看 ，本周较多的行业有：计算机 、电子、基础化工，环比提升较多的行业有：计算机 、石油石化。 机构调研家数来看 ，本周较多的行业有：医药生物 、有色金属、国防军工，环比提升较多的行业有：有色金属 、医药生物。 资料来源：Wind，中信建投图表：机构调研次数和家数（周度） 05,00010,00015,00020,00025,000 05001,0001,5002,0002,500 2026-012026-022026-032026-042026-052026-062026-072026-082026-092026-102026-112026-12调研次数调研家数右轴 下载日志已记录，仅供内部参考 机构调研热度 11图表：机构调研行业热度（月度）截至 20261011 资料来源：Wind，中信建投 调研次数1月2月3月4月5月6月7月8月9月10月11月12月调研家数1月2月3月4月5月6月7月8月9月10月11月12月 石油石化7416253612426261 石油石化111844296869942196230 煤炭94717366213211 煤炭14118121119720188830 有色金属5320331101485943591042 有色金属4452476571638337717425118028579 钢铁12713194315918430 钢铁7388291019672251241180 基础化工90297021041211087873018 基础化工1080297981183890080659217567779 轻工制造26141988151251848972 轻工制造251167214140514610810111421390 建筑材料7217465110623361 建筑材料3963129412414538503200 建筑装饰1761950114161325812 建筑装饰199461401431511091231082180 电力设备81407823137092721362286 电力设备1597982237836371299983126341738241 国防军工271126701363327271113 国防军工3129423880244752821669148826 机械设备200921423316551931491564707 机械设备248796021944851268818441456350618163 汽车94338419829184641032126 汽车116242212131983941587454193680815 商贸零售144184275131522632 商贸零售24828253407147113942501610 社会服务93103066101315423 社会服务8972083912341031094601340 美容护理442116257517291 美容护理3262505982861885741640 家用电器144114488132026641 家用电器130264838322101081718961180 纺织服饰3011235798312131730 纺织服饰28614922097929216519010591120 农林牧渔1613225995141738523 农林牧渔248794608422021471487982160 食品饮料21112280120301948832 食品饮料31811 重视！ 1️⃣硅微粉9月以来全球稼动率🈵，海外大厂寻求国内代工产能，国内大厂寻求新扩产空间，以往价格属性并未在硅微粉行业体现过，但当前结合供需来看，价格弹性一触即发，Q4会是行业变化很大的一个季度。 2️⃣供应链跟踪下来，SY在Q3为m8和更高等级的CCL材料加速备货，多个环节公司接到Q4上修备货的指引。我们相信，以SY为代表的高速CCL公司将在Q4加速拉货，上游高规格硅微粉弹性较大，价值量/毛利率相对传统产品明显增加。 碳氢树脂的CCL和ptfe方案并非互相替代，而是互为补充，且碳氢CCL也有无布版本方案，逻辑上看硅微粉用量也将有提升，这个角度上碳氢和ptfe不管怎么用，对硅微粉都是利好。 3️⃣三季度联瑞产能利用率明显提升，且是液相法完整放量的第一个Q，我们测算公司Q3表现有望较佳。 我们深度报告先前已发，这个位置建议您重点关注！！#文字观点", "publish_time": "2026-10-12 22:30", "tags": ["文字观点"]}, "post:2026-10-12T09-53:a46b29e80528": {"id": "post:2026-10-12T09-53:a46b29e80528", "kind": "post", "title": "2026-10-12 09:53", "source_label": "帖子正文", "excerpt": "各位大佬好，本周建议关注新方向边际变化及主线业绩超预期标的。具体来看： 1、新方向边际变化和后续催化值得期待，机器人9月底供应商反馈周产抬升至800-1000，后续关注特斯拉三季报10月21日、万圣节产品发布预期。", "content": "各位大佬好，本周建议关注新方向边际变化及主线业绩超预期标的。具体来看： 1、新方向边际变化和后续催化值得期待，机器人9月底供应商反馈周产抬升至800-1000，后续关注特斯拉三季报10月21日、万圣节产品发布预期。固态交易十五五规划催化，后续关注是否有发布会、设备招标等进一步进展。铜箔锂电涨价落地，电子边际趋紧预期明确，此外关注m-SAP等新技术对载体铜箔催化。周度重点标的#福赛科技#斯菱智驱#田中精机#嘉元科技#德福科技等。 2、主线方向更建议关注三季报超预期及超跌标的，本周欧贸易相关新闻暂未涉及锂电池、储能，等待本月15-16日欧洲理事会进一步明确；风电关注度提升，可关注三季报后国内深远海政策和海外订单落地；电网继续关注年底美国细则落地。周度重点标的：#宁德时代#德业股份#海博思创#思源电气#东方电缆#特锐德等。#文字观点", "publish_time": "2026-10-12 09:53", "tags": ["文字观点"]}, "attachment:files/兴业证券-鄂尔多斯(600295)轻重双主业布局分红强劲，电冶化工降本增效具备弹性-261011.pdf": {"id": "attachment:files/兴业证券-鄂尔多斯(600295)轻重双主业布局分红强劲，电冶化工降本增效具备弹性-261011.pdf", "kind": "attachment", "title": "兴业证券-鄂尔多斯(600295)轻重双主业布局分红强劲，电冶化工降本增效具备弹性-261011", "source_label": "兴业证券", "excerpt": "请阅读最后评级说明和重要声明 1/32 公司深度报告 | 钢铁", "content": "请阅读最后评级说明和重要声明 1/32 公司深度报告 | 钢铁 证券研究报告 公司评级 增持（首次） 报告日期 2026年10月11日 基础数据 10月09日收盘价（元） 13.21 总市值（亿元） 369.72 总股本（亿股） 27.99 来源：聚源，兴业证券经济与金融研究院整理 相关研究 分析师：史一粟 S0190523110001 shiyisu@xyzq.com.cn 分析师：蔡屹 S0190518030002 caiyi@xyzq.com.cn 分析师：李怡然 S0190525040001 liyiran@xyzq.com.cn 分析师：林寰宇 S0190524080006 linhuanyu@xyzq.com.cn 鄂尔多斯 (600295.SH) 轻重双主业布局分红强劲， 电冶化工降本增效 具备弹性 投资要点： 服装+电冶化工双主业布局， 2025年归母净利润重回增长 。鄂尔多斯自 1980年长期深耕 羊绒产业 ，2003年围绕矿产资源开发 —电—电冶及化工 打造第二主业 ，重点推动 一体化及 精细运营 。2025年8月，公司硅基合金创新工厂作为一体化标杆项目顺利投产 ；同年公司 电冶化工板块优势集中显现， 板块毛利率 同比提升 4.29pct至18.48%，助力 2025年公司 归母净利润同比 +27.9%至23.63亿元。 2026年H1，公司实现归母净利润 14.16亿元，同 比+43.19%，经营优势进一步放大 。我们认为公司两大主业 未来均存亮点： ➢ 电冶化工 ：煤电一体化和资源 高效转化构筑自身成本护城河，同时 产品价格 具备看涨 期权。一方面， 公司在精益运营下通过资源循环利用和产业链 延伸进一步降低主要产 品单位成本， 以硅铁为例， 2021 -2025年公司硅铁 单吨成本从 5933元/吨下降至 4681 元/吨。另一方面， 公司权益煤炭产量约 1000万吨/年，产量与自身发电用煤炭需求基 本匹配；而电力成本 均占硅铁、电石等核心产品生产成本 的50%及以上，自备电力为 公司产品带来显著成本节约 ，且后续电力新能源化后可进一步降低。 我们判断，尽管 硅铁与氯碱化工 产品供需宽松格局短期或难以扭转， 但随着电力供需改善及电力市场 化改革推动，电价企稳将为电冶化工产品 价格提供底部支撑， 且或将推动硅铁价格进 一步向上 。2026年硅铁价格中枢已连续三个季度实现上涨，公司 具备成本优势 的同 时产品价格 具备看涨期权 。 ➢ 服装业务品牌价值逐步凸显，持续维持高毛利能力。 公司服装业务依托于优质羊绒资 源和持续抬升的品牌价值，近年已构筑起多品牌矩阵精准覆盖不同消费群体，并通过 技术改进等生产四季服装拓宽羊绒应用边界。 同时公司在 拓展产品品类的同时并没有 牺牲盈利水平，反而依托 全产业链优势 和品牌价值持续体现 使得 2022年后公司服装 业务毛利率 持续抬升，至2025年已达 59.80%。 控股股东及一致行动人持股比例 72.84%，连续3年维持70%以上高比例派息 。公司现金 创造能力强 且净现金流 已转正。2026H1，公司资产负债率仅有 43.60 %， 财务费用率 0.17%， 货币资金 70.43亿元。公司控股股东及一致行动人合计持有公司 72.84%股份，大股东分红 意愿较强，公司 2023-2025连续三年维持 70%以上派息比例，股息率回报均在 5%以上。 首次覆盖，给予 “增持”评级。当前公司可定义为拥有坚实利润壁垒的一体化公司，行业产 品价格存在潜在上行可能，同时兼具分红能力 。预测公司 2026 -2028年分别实现归母净利 润30.31亿/31.91亿/35.07亿元，分别同比 +28.3%/+5.3%/+9.9% ，分别对应 2026年10 月9日收盘价的 PE估值为 12.2x/11. 6x/10. 5x。 风险提示： 宏观环境变化风险，政策风险，产品价格风险，成本波动风险。 主要财务指标 会计年度 2025A 2026E 2027E 2028E 营业总收入（百万元） 25741 27345 29164 31070 同比增长 -9.4% 6.2% 6.6% 6.5% 归母净利润（百万元） 2363 3031 3191 3507 同比增长 27.9% 28.3% 5.3% 9.9% 毛利率 25.3% 26.2% 25.8% 26.0% ROE 10.8% 13.5% 13.8% 14.8% 每股收益（元） 0.84 1.08 1.14 1.25 市盈率 15.6 12.2 11.6 10.5 数据来源：携宁，兴业证券经济与金融研究院整理 注：每股收益均按照最新股本摊薄计算 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 请阅读最后评级说明和重要声明 2/32 公司深度报告 | 鄂尔多斯 目录 一、 鄂尔多斯：服装 +电冶化工双轮驱动，近年维持高派息比例 ................... 4 （一） 鄂尔多斯：服装 +电冶化工双主业布局，股权结构及管理层稳定 ........ 4 （二） 财务分析：电冶业务条线周期波动下，现金流仍保持韧性 ................. 5 （三） 分红派息： 2023 -2025年度连续高比例派息，股东回报持续强化 .... 10 二、 电冶化工业务：煤电一体化与资源高效转化构筑成本护城河，行业成本上 行或将支撑产品价格 ................................ ................................ ..................... 11 （一） 核心阿尔法 来源：煤电一体化 +单位成本下降共同构筑成本壁垒 ...... 11 （二） 硅铁与氯碱化工行业：供需宽松格局短期难以扭转，成本端提供底部支 撑 .. BA：长鑫科技、晶合集成等 ➠设备：拓荆科技、华海清科、中科飞测、强一股份等 ➠材料：鼎龙股份、上海新阳等#文字观点", "publish_time": "2026-10-12 11:07", "tags": ["文字观点"]}, "attachment:files/20261011-慧博智能投研-机构周策略：机构观点及行业配置.xlsx": {"id": "attachment:files/20261011-慧博智能投研-机构周策略：机构观点及行业配置.xlsx", "kind": "attachment", "title": "20261011-慧博智能投研-机构周策略：机构观点及行业配置", "source_label": "20261011", "excerpt": "观点来源 核心观点 建议关注 申万宏源 中长波段，A股处于两个大波段上涨之间的震荡休整期，且仍偏向于弱势震荡。短波段，市场短期性价比已明显改善，各维度悲观预期都已有所反映。", "content": "观点来源 核心观点 建议关注 申万宏源 中长波段，A股处于两个大波段上涨之间的震荡休整期，且仍偏向于弱势震荡。短波段，市场短期性价比已明显改善，各维度悲观预期都已有所反映。 （1）短期AI链仍偏逆风，但中期机会增加阶段，有效的AI链审美不变。（2）非科技方向跑赢的时间拉长，高股息绝对收益时间拉长。非科技赛道方向，重点方向不变：CXO、创新药、煤炭、航运、贵金属、工业金属和基础化工。房地产销售新规后，进入历史遗留问题化解，增量政策布局期阶段；叠加短期地产销售有亮点，房地产中短期内可能反复有脉冲机会。高股息和科技赛道是“跷跷板效应”，据此关注银行和公用事业。在市场重回强势线索显现前，仍可以基于防御持有高股息。 中信建投 整体来看，积极信号已开始累积，防御优先、等待转机是现阶段最优策略。 银行、煤炭、公用事业、港股红利、AI算力硬件、基础化工、新能源等。 招商证券 行业配置标准应由“远期空间”转向“当期景气兑现”。 未来3-6个月依次把握三类机会：一是10Y美债利率确认转跌后的科技宽度修复，率先受益的是算力芯片、存储、半导体设备与材料、PCB、液冷等配套环节；二是内外共振下的内需与顺周期扩散，关注食品饮料、家电、商贸零售、工程机械、化工；三是若指数先行出现较大幅度回撤，则重点关注低PB、并购重组主线下的券商。 华泰证券 继续沿盈利与景气寻找性价比方向。 1）科技硬件侧重业绩兑现，重点关注PCB、服务器等需求有支撑的环节，结合三季报验证择机布局，对高估值品种保持克制；2）顺周期与基建链，关注化纤、工程机械、航海装备：化纤中氨纶、尼龙等产品价差有所改善，工程机械历史估值位置相对较低且盈利预期边际修复，房企风险化解消息与四季度财政发力预期或带来修复催化；航海装备重视订单交付与盈利兑现；3）红利继续作为底仓，优选股息回报、估值与分红稳定性相匹配的股份行、公用事业等方向。 东吴证券 美债长端利率回落，均衡布局算力硬件景气、地产链政策与三季报确定性品种。 1）关注受益于房贷贴息、PSL扩容与现房销售改革等政策落地、且后续存在一揽子增量政策预期的地产链，尤其是地产后周期的消费建材等方向；2）关注景气回升、价格稳中有升的化工、天然气等周期上游方向；3）关注业绩持续兑现、估值仍有吸引力的消费龙头以及供给格局偏紧的有色品种。 光大证券 短期修复窗口开启，四季度锚点或切换至政策预期。 方向一，政策链，即沿着政策发力的重点方向进行布局，涵盖基建链、地产链、消费链以及各类细分领域。方向二，硬科技赛道。聚焦半导体、AI、高端制造等具有核心技术壁垒与国产替代逻辑的领域，这些板块既受益于全球科技产业周期的上行，也契合国家科技创新与自主可控的政策导向，具备较强的成长确定性与估值弹性。方向三，有自下而上景气的其他板块，例如农林牧渔、医药、非银金融等，这些行业更多依靠自身基本面逻辑驱动而走出独立行情，不依赖宏观政策的强刺激，能够在市场震荡中提供一定的超额收益。 财信证券 适当低吸顺周期及高股息方向。 （1）政策催化的顺周期方向，例如地产、建材、食品饮料等；（2）防守的高股息方向，银行、非银、煤炭、公用事业、交通运输等；（3）涨价线方向，例如贵金属、工业金属、化工、部分农产品等；（4）AI硬件的龙头标的，例如光模块、PCB、存储、芯片的核心标的，受益于扩产逻辑的半导体设备及材料。 天风证券 赛点2.0第三阶段攻坚不易，波折难免，重视AI产业趋势。 1）AI产业革命带来的算力、存力、电力及应用的科技主线机会，2）内外共振，经济逐步修复，牛市主线风格“强者恒强”，但周期后半段易有所表现，3）赔率思维，即考虑风格轮动、底部反转的可能性。连续三年跑输但第四年跑赢概率较大的行业有食品饮料、农林牧渔、社会服务、医药生物。 方正证券 积极布局，把握好四季度做多的窗口期。 一是科技的超跌反弹，进入10月份之后科技催化增多，AI的产业趋势和景气度仍较为坚实，近期大幅回调之后配置价值显著提高，关注10月公布的公募基金持仓变化，科技股内部向能涨价、能扩量、有新技术突破的细分方向倾斜；二是关注HALO资产逢低布局机会，油价回落之后，聚焦核心资源相关的有色金属+化工；三是对于货币政策变化反应最为直接，业绩估值匹配度较好，能够稳指数的非银金融。 日期：2026年10月11日", "status": "extracted"}, "post:2026-10-12T09-13:bd1ea024f8a2": {"id": "post:2026-10-12T09-13:bd1ea024f8a2", "kind": "post", "title": "2026-10-12 09:13", "source_label": "帖子正文", "excerpt": "【中信建投】10月12日晨会要点💡#【ESG及绿色金融】零碳筑园，金融活水——零碳园区资金需求、金融工具与投资机会(祁星) → 在我国，园区兼具经济增长载体与碳排放管控场景的双重战略地位，在中央经济工作会议及多部门配套政策的指引下，零碳园区建设成为我国的系统性工程。→ 根据我们测算，仅国家级零碳园区", "content": "【中信建投】10月12日晨会要点💡#【ESG及绿色金融】零碳筑园，金融活水——零碳园区资金需求、金融工具与投资机会(祁星) → 在我国，园区兼具经济增长载体与碳排放管控场景的双重战略地位，在中央经济工作会议及多部门配套政策的指引下，零碳园区建设成为我国的系统性工程。 → 根据我们测算，仅国家级零碳园区的零碳改造投入在千亿级。可持续金融工具层面，绿色信贷、ESG债券、绿色租赁等已具规模，与园区资本开支大、回收期长、部分资产现金流稳定的项目特征高度适配。 → 鄂尔多斯蒙苏、盐城大丰港等案例已验证“低成本可溯源绿电+产业集聚”的商业闭环，零碳园区有望成为绿色金融与产业投资共振的下一个主线。 💡#【政策研究】出口系列研究（一）：量价切换与结构分化(胡玉玮) → 本轮出口高增长并非全面扩张，而是由AI相关电子产品、电动汽车和锂电池等优势品类集中驱动，且不同产业的量价结构明显分化。 → AI相关电子产业链和“新三样”构成主要增量来源，其中AI链当前更多依靠单位价值和产品结构提升，汽车和锂电池主要依靠数量扩张，光伏仍处调整阶段，“老三样”更多发挥出口基本盘作用。 → 基准情形下，预计2026年全年出口增长约22%，2027年和2028年分别回落至15%和10%；AI链与“新三样”仍将贡献主要增量，但增长动力将逐步由价格和产品结构向数量切换。 → 中长期出口韧性最终取决于AI需求能否转化为实际交付、新能源产品终端需求能否支撑持续出货，以及中国高价值产品的全球市场份额能否继续提升。 💡#【金工】公募基金运作规则迎系统性修订(姚紫薇) → 10月9日，中国证监会对《公开募集证券投资基金运作管理办法（征求意见稿）》及配套规则进行修订。 → 主要修订内容包括完善基金投资运作监管要求、支持权益类基金发展、优化部分投资运作指标和机制等。 → 未来随着相关制度逐步落地，公募基金行业竞争格局有望从规模驱动转向能力驱动，为公募基金行业实现高质量、可持续发展奠定基础。 → 本周消费板块基金整体表现相对领先，近一周平均收益为-0.47%。本周基金仓位总体下降，处于近1年中等水平。风格来看，基金较多加仓中盘成长，行业加仓医药生物等。本周基金发行热度处于近2年较高水平，类型以指数型为主。 欢迎索要报告/预约路演交流#文字观点", "publish_time": "2026-10-12 09:13", "tags": ["【ESG及绿色金融】", "【政策研究】", "【金工】", "文字观点"]}, "attachment:files/【东吴电新数据库】锂电池材料价格周报 -20261009.xlsx": {"id": "attachment:files/【东吴电新数据库】锂电池材料价格周报 -20261009.xlsx", "kind": "attachment", "title": "【东吴电新数据库】锂电池材料价格周报 -20261009", "source_label": "【东吴电新数据库】锂电池材料价格周报", "excerpt": "XL Toolbox Settings export_preset \u003c?xml version=\"1.0\" encoding=\"utf-16\"?", "content": "XL Toolbox Settings export_preset \u003c?xml 用深化，提效+商业化变现；2）“华流”出海，网文/短剧/游戏释放潜力；3）IP需求升级/产业价值重估。 ☀️关注要点 3Q26我们预览A股重点公司31家（详见图表1），总市值7,249亿元，占比传媒（申万）板块总市值48.7%（截止10月9日）。各子板块关注： 1）数字媒体：我们判断芒果三季度会员受渠道端合作模式调整影响或仍承压，广告收入同比改善，AIGC内容有望在4Q26至27年初陆续上线。 2）网络游戏：7、8月国内游戏市场实现高单位数增长，出海市场维持双位数增长。我们判断重点A股公司存量游戏流水持续性较好，驱动业绩高景气度延续；3Q26因基数提升增速环比略有收窄。建议关注储备产品上线节奏，存量游戏利润释放节奏及低估值、高股东回报下部分个股的高股息价值。 3）营销广告：3Q25即时零售在竞争加剧下加大投放力度，预计3Q26主要广告公司收入将受到高基数影响；建议关注宏观环境改善趋势、AI办公等垂类应用投放增量。 4）影视院线：据艺恩，3Q26全国含服务费票房122亿元，同降3.9%；而2026年暑期档（6月至8月）含服票房125亿元，同增4.4%，需求呈现旺季愈旺淡季愈淡的特征，我们建议关注贺岁春节档票房弹性。 5）图书出版：预计相对稳健，关注头部标的股息价值及国有企业并购重组节奏。 6）有线广电：根据勾正科技，全国7~8月IPTV和OTT平台竞争格局相对稳定。 ☀️估值与建议：综合考虑基本面边际趋势与行业估值水位，我们对部分公司盈利预测与估值做出调整（详见图表2）。A股推荐世纪华通/恺英网络/三七互娱/芒果超媒；港美股推荐网易/快手/阅文集团等。 风险：宏观政治经济波动，监管收紧，内容或产品表现不及预期。#文字观点", "publish_time": "2026-10-12 17:44", "tags": ["文字观点"]}, "attachment:files/中泰证券-10月10日证监会资本市场和金融形势专家座谈会解读：稳市机制与投资端改革持续推进，新质生产力政策强化产业支撑-261011.pdf": {"id": "attachment:files/中泰证券-10月10日证监会资本市场和金融形势专家座谈会解读：稳市机制与投资端改革持续推进，新质生产力政策强化产业支撑-261011.pdf", "kind": "attachment", "title": "中泰证券-10月10日证监会资本市场和金融形势专家座谈会解读：稳市机制与投资端改革持续推进，新质生产力政策强化产业支撑-261011", "source_label": "中泰证券", "excerpt": "请务必阅读正文之后的重要声明部分稳市机制与投资端改革持续推进，新质生产力政策强化产 业支撑 ——10月10日证监会资本市场和金融形势专家座谈会解读", "content": "请务必阅读正文之后的重要声明部分稳市机制与投资端改革持续推进，新质生产力政策强化产 业支撑 ——10月10日证监会资本市场和金融形势专家座谈会解读 证券研究报告/策略事件点评报告 2026年10月11日 分析师：徐驰 执业证书编号：S0740519080003 Email：xuchi@zts.com.cn 分析师：张文宇 执业证书编号：S0740520120003 Email：zhangwy01@zts.com.cn 相关报告 1、《增量政策预期升温，资本市场兼 顾改革与稳预期》2026-07-31 2、《美伊阶段性协议落定：风险溢价 回落，A股交易转向成长修复》2026- 06-16 3、《从“重规模”转向“重回报”，资 本市场生态有望加速重塑》2026-06- 08报告摘要 一、事件： 10月10日，中国证监会党委书记、主席吴清在北京召开资本市场和金融形势专家座 谈会，与部分上市公司负责人、证券基金机构专家深入交流，听取对当前资本市场和 金融形势的意见建议。 二、点评： 稳市机制建设持续推进，资本市场政策更加注重稳定市场预期与增强内在韧性。本次 座谈会围绕稳市机制、增量政策储备和跨境风险监测听取意见，与9月金融领域“十 五五”发布会关于稳定市场、深化投融资改革的部署相延续。近期A股呈现明显的风 格分化：7月31日至10月9日，沪深300、创业板指和科创50分别下跌5.91%、 8.99%和10.92%，中证1000上涨1.14%，成长板块内部调整与中小盘相对表现较强 并存。我们认为，当前稳市机制的意义不仅在于应对短期波动，更在于通过稳定市场 运行和投资者预期，为中长期资金配置、上市公司融资和产业转型创造相对稳定的市 场环境。 成交活跃度回升，市场趋势广度修复相对温和，结构性行情仍是现阶段A股的重要特 征。9月22日沪深两市成交额约2.14万亿元，9月29日回落至约1.41万亿元，10 月9日回升至1.90万亿元；同期站上20日均线的股票比例由55.9%降至33.4%，节 后恢复至39.7%。成交额回升较快，但更多股票重新站上中期均线仍需要时间，显示 资金在不同板块之间的轮动较为活跃，市场整体趋势尚未同步修复。与会专家提出加 强交易监管和跨境风险监测，延续了监管部门维护市场运行秩序、提高应对外部波动 能力的方向。从策略角度看，稳市政策对风险偏好的支持有望减轻市场波动对估值的 压制，但行情从局部修复走向更广泛的上涨，仍需要资金配置向更多行业扩散以及企 业盈利预期的配合。 中长期资金入市与公募基金运作改革相互衔接，投资端改革开始更多落到产品供给和 投资管理环节。座谈会上，与会专家建议拓宽中长期资金来源、渠道和入市方式，发 展壮大耐心资本。10月9日，证监会就《公开募集证券投资基金运作管理办法》及配 套规则公开征求意见，拟将权益类基金、基金中基金等产品的成立规模与份额门槛由 2亿元、2亿份分别降至5000万元、5000万份，并完善指数基金部分运作限制、投 资风格约束以及大额申赎管理。此前政策持续强调推动中长期资金入市，此次修订进 一步回应了公募基金在产品设立、投资运作和风险管理中的实际需求。降低权益类产 品成立门槛，有助于管理人开展差异化产品布局；优化被动指数基金有关制度安排， 有利于提高指数投资运作效率；强化基金比较基准和投资风格约束，则有助于推动公 募行业由产品规模扩张向投资管理质量提升转变。 投资端制度完善有望提高权益产品的长期持有吸引力，资金结构改善将更多依靠产品 体验和持续配置需求。对于A股，公募改革的影响可能首先体现在基金产品结构和机 构投资行为的调整。权益基金供给更加丰富，有助于满足不同风险收益偏好的配置需 求；投资风格与业绩基准更加清晰，有利于投资者识别基金真实风险暴露，减轻市场 波动中频繁切换产品和追逐热点的倾向；大额申赎管理的完善则有助于缓和集中赎回 对基金组合运作的影响。随着长期投资理念与基金产品制度相互配合，资本市场有望 逐步形成更稳定的权益资金持有基础。对股票市场而言，资金结构改善有助于提升投 资者对盈利质量、公司治理和长期回报的重视程度，也为优质上市公司形成相对稳定 的机构持仓提供支持。 分红回购与投资者保护改革持续深化，优质上市公司的长期投资价值有望得到进一步 重视。与会专家建议推动有条件的上市公司加大分红回购力度，完善投资者回报和权 益保护机制。这与新“国九条”以来提升上市公司质量、增强股东回报和完善治理的 改革方向一致。长期资金的配置意愿既与基金和保险等投资机构的制度安排有关，也 下载日志已记录，仅供内部参考 策略事件点评报告 -2- 请务必阅读正文之后的重要声明部分取决于权益资产能否提供可持续的收益。现金分红为投资者提供相对稳定的回报来 源，规范实施的股份回购有助于改善资本配置效率，良好的公司治理则有助于降低投 资者承担的不确定性。随着投资端改革推进，具备稳定自由现金流、合理资本开支和 持续股东回报能力的上市公司，有望更好匹配中长期资金的投资需求。相较单纯依赖 估值扩张的行情，这一方向更强调盈利、现金回报和治理质量对股票定价的支撑。 发行上市制度优化与新质生产力政策相互呼应，资本市场将进一步强化对科技创新全 周期的融资支持。本次座谈会上，与会专家建议优化发行上市制度，支持不同类型、 不同行业、多元化的优质企业发展壮大。10月9日公布的《中共中央国务院关于发 展新质生产力的意见》明确提出，完善长期资本支持科技创新的政策，鼓励和规范发 展天使投资、风险投资和私募股权投资，丰富科技创新债券产品体系，支持优质科技 型企业上市融资，并优化科技型企业并购重组、股权激励等制度。与此前提高资本市 场制度包容性、适应性的改革方向相衔接，近期政策进一步将早期风险资本、股权融 资、债券融资和上市后产业整合贯通起来。我们认为，科技创新具有研发周期长、投 入较大和产业化不确定性较高等特点，需要不同期限和风险承受能力的资本相互接 续。融资制度持续完善，有利于为优质创新企业拓宽成长空间，同时借助并购重组和 资本配置提高产业链协同效率。 新质生产力政策从科技突破延伸至成果转化和场景应用，产业升级有望成为科技成长 盈利的重要支撑。中央《意见》提出建设概念验证和中试平台、开展新技术新产品新 场景大规模应用示范，同时部署制造业重大技术改造、大规模设备更新和“人工智能 +”行动。上述安排将政策支持从研发端进一步延伸到生产端和需求端：一方面，传统 产业数字化、智能化改造有望带动工业软件、智能制造装备、自动化系统与关键零部 件需求；另一方面，人工智能在制造业和其他行业的应用，有望逐步拓展算力、软件 服务、智能终端等领域的商业空间。不同细分方向的盈利兑现节奏也存在差异，设备 更新与技术改造更容易通过项目 万华化学 -季报点评 :三季度业绩承 压，新项目稳步推进》 2024-11-16 股价走势 量价齐升致盈利改善 ，资本开支延续 放缓趋势 事件：万华化学发布 2026年中报， 实现营业收入 1193.2亿元， 同比 +31.3%； 实现营业利润 141亿元，同比 +84.5%；实现归属于上市公司股东的净利润 100.6亿元，同比 +64.3%，扣非后归母净利润 96.8亿元，同比 +55%。2026 年上半年公司 EPS（基本）为 3.2元（扣非后为 3.1元） ，每股经营现金流 为3.8元。 其中第二季度实现营业收入 652.6亿元， 同比 +36.4%、 环比 +20.7%； 实现归属于上市公司股东的净利润 63.5亿元，同比 +108.7%、环比 +70.7%； 单季度 EPS为 2.03元。 三大业务板块销量同比均实现增长，主营产品价差同比有所走扩 。2026年 上半年，公司实现毛利额 203. 8亿元，同比 +78. 0亿元；分产品看，聚氨酯 系列、石化系列、精细化学品及新材料系列分别实现毛利额 121.6、32.5、 36.7亿元，同比分别增加 26.9、33.8、21.8亿元。 2026年上半年公司聚氨 酯、石化、精细化学品及新材料三大系列产量分别 340、370、163万吨， 分别同比 +42、+75、+39万吨；销量方面，上述三个系列产品分别销售 326、 339、148万吨，较去年同期分别增加 23、54、29万吨。从价格上看，据 公司公告及百川盈孚数据， 26H1公司三大业务板块多数产品同比上涨 。从 价差来看，上半年纯 MDI/聚合 MDI/TDI 价差分别同比 +18%/ -6%/+41% ，二 季度单季度同比 +30%/+8%/+55% 、环比变动 +20%/+21%/+5% 。 费用控制卓有成效，研发投入持续增长 。26年上半年，公司期间费用率 5.0%，较去年同期下降 0.3pcts。分项看， 2026H1公司销售 /管理 /研发 /财 务费用率分别为 0.70%/1.17%/1.93%/1.20% ，费用合计 59.6亿元，较去年 同期 +11.14亿元。其中财务费用同比增加 8.32亿元，主要系本期汇兑收益 减少所致。公司研发费用投入持续增加，公司 26H1研发费用为 23亿元， 同比增加 0.09亿元，研发费用率为 1.93%，yoy-0.59pcts。 资本开支节奏放缓，在建工程规 模明显下降 。公司 2026H 1在建工程为 335 亿元，较 2025H1期末减少 62亿元，在建工程 /固定资产的比例为 21.2% （2018年以来次低水平） ； 2026年二季度购建固定资产、无形资产和其他 长期资产支付的现金为 57.1亿元，同比减少 22.31亿元，较前一季度增加 6.8亿元。根据公司公告，重要在建工程项目如聚氨酯产业链延伸及配套项 目、异氰酸酯新建及配套项目工程等进度已达到 90%以上，其余如 BC公 司造气项目、高性能材料一体化项目以及大型煤气化等项目进程过半。 盈利预测与估值： 公司部分产品价格今年以来有所 抬升，结合产品价格趋 势、未来产能投放节奏，我们预计 2026-2028年归母净利润为 190、203、 225亿元（ 2026、2027前值为 163、225亿元） ，维持“买入”投资评级 风险提示：宏观经济下行风险，产品及原料价格大幅波动风险、新建项目 进度及盈利不达预期风险 。 财务数据和估值 2024 2025 2026E 2027E 2028E 营业收入 (百万元 ) 182,069.12 203,234.57 239,657.64 245,052.62 254,668.26 增长率 (%) 3.83 11.62 17.92 2.25 3.92 EBITDA (百万元 ) 36,908.45 38,715.40 49,862.40 54,984.28 60,258.37 归属母公司净利润 (百万元 ) 13,033.07 12,527.20 18,954.27 20,277.57 22,489.45 增长率 (%) (22.49) (3.88) 51.30 6.98 10.91 EPS(元/股) 4.15 4.00 6.05 6.48 7.18 市盈率 (P/E) 16.91 17.54 11.59 10.84 9.77 市净率 (P/B) 2.33 2.03 1.82 1.63 1.46 市销率 (P/S) 1.21 1.08 0.92 0.90 0.86 EV/EBITDA 7.83 7.76 5.63 4.96 4.34 资料来源： wind，天风证券研究所 -10%-3%4%11%18%25%32%39% 2025-10 2026-02 2026-06万 田路 3088号 中洲大厦 22层 邮编： 518028 电话： (86755) -23915663 邮箱： research@tfzq.com 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-12T13-01:9104b311de19": {"id": "post:2026-10-12T13-01:9104b311de19", "kind": "post", "title": "2026-10-12 13:01", "source_label": "帖子正文", "excerpt": "伯恩斯坦—— 美国对垂直供电系统启动337调查——对电源供应链的影响 ▍事件速览：Vicor发起337调查，20家企业被列为应诉方 10月9日，美国国际贸易委员会（USITC）基于Vicor（VICR US，未覆盖）的投诉，正式对特定垂直供电系统（VPD）、相关组件及包含该产品的计算系统启动337调", "content": "伯恩斯坦—— 美国对垂直供电系统启动337调查——对电源供应链的影响 ▍事件速览：Vicor发起337调查，20家企业被列为应诉方 10月9日，美国国际贸易委员会（USITC）基于Vicor（VICR US，未覆盖）的投诉，正式对特定垂直供电系统（VPD）、相关组件及包含该产品的计算系统启动337调查。Vicor指控专利侵权，寻求有限排除令及停止令。调查共涉及20家应诉实体，包括台达电子（Delta）、立讯精密（Luxshare）、英飞凌（Infineon）及广达电脑（Quanta）等。USITC尚未就侵权是否成立作出裁定，将在立案后45天内设定目标完成日期。 ▍Vicor历史诉讼与337调查脉络 Vicor此前曾发起两起涉及电源转换器产品的337调查： • 第一起（337-TA-1370）：2023年7月投诉，2025年2月USITC作出终裁，认定Vicor两项专利有效且被侵权，发布有限排除令。并行德州诉讼于2025年5月撤诉。 • 第二起（337-TA-1484）：2026年1月投诉，2月立案，目前仍在审理中，目标完成日期为2027年9月。 • 第三起（本次，337-TA-1526）：2026年9月投诉，10月立案，涉及20家企业，初始裁决及终裁日期尚未确定。 ▍VPD技术背景与产业应用 VPD将电压调节器置于AI处理器下方而非侧方，缩短大电流供电路径，较传统横向供电降低电阻损耗与压降，支持更高电流并释放板级信号布线空间。但采用VPD需重新设计板布局、开发可置于处理器下方的紧凑型稳压器并解决底部散热问题。2025年8月，英飞凌与台达宣布合作开发AI芯片VPD方案，预计每机架三年生命周期可减排150吨CO₂。目前Google是VPD在TPU服务器中的关键采用者。 ▍对覆盖标的的影响评估 • 台达电子（评级：跑赢大市，目标价2,620新台元）：VPD约占其今年营收的5%，其他AI电源产品（PSU、BBU、UPS）及液冷贡献约40%。调查本身不要求暂停出货，预计台达将积极抗辩、与客户评估风险并在必要时开发替代设计。公司可能在10月下旬的三季报中澄清潜在影响。 • 立讯精密（评级：跑赢大市，目标价86元人民币）：VPD产品仍处于认证阶段，短期营收贡献微乎其微，预计影响有限。 • 广达电脑（评级：跑输大市，目标价250新台元）：可根据客户需求采用替代板卡或机架设计，规避风险。 • 英飞凌（评级：跑赢大市，目标价102欧元）：目前是VPD主要电源半导体供应商之一（另一家为MPS，未覆盖）。鉴于整体AI电源半导体仍严重短缺，预计实际影响较小。 • 瑞萨电子（评级：跑赢大市，目标价6,300日元）：虽未被点名，但预计年底前进入VPD领域，需持续监测潜在影响。 ▍投资评级与估值 • 立讯精密：基于2027年EPS 3.5元人民币，给予25倍PE，目标价86元人民币。 • 台达电子：基于2027-28年平均EPS 74.6新台元，给予35倍PE，目标价2,620新台元。 • 广达电脑：基于2027年EPS 23.1新台元，给予11倍PE，目标价250新台元。 • 英飞凌：基于Q5-Q8 EPS预估3.72欧元，给予27倍PE，目标价102欧元。 • 瑞萨电子：基于前瞻Q5-Q8 EPS预估337日元，给予19倍PE，目标价6,300日元。 ▍主要下行风险 • 台达电子：AI服务器电源组件及热管理方案竞争加剧或HVDC技术采用延迟；中国自动化及全球基础设施市场复苏推迟；美国关税政策风险。 • 立讯精密：iPhone 18换代周期弱于预期；AI服务器关键产品份额提升放缓；新产品的利润率压力；存储芯片价格上涨。 • 广达电脑：AI服务器需求低于预期；毛利率拖累超预期；PC出货疲软。 • 英飞凌：汽车需求或电动车渗透率放缓；SiC解决方案价格侵蚀与产能过剩；半导体需求整体走弱。 • 瑞萨电子：模拟市场复苏延迟；汽车MCU及AI电源市场份额增长不及预期；汇率波动。 核心结论：本次337调查是Vicor在电源技术专利领域的又一次激进维权，短期对台达等企业的VPD业务构成法律不确定性，但鉴于调查程序漫长（通常12-16个月出裁决）且AI电源半导体整体供不应求，实际供应链冲击可控。中长期看，VPD作为AI数据中心供电升级的关键路径，技术迭代与本土化替代方案将并行推进，具备专利护城河及多元产品线的头部供应商仍具配置价值。#文字观点", "publish_time": "2026-10-12 13:01", "tags": ["文字观点"]}, "post:2026-10-12T09-31:f77abf082c21": {"id": "post:2026-10-12T09-31:f77abf082c21", "kind": "post", "title": "2026-10-12 09:31", "source_label": "帖子正文", "excerpt": "【国联民生电子】Vicor再启337调查：企业竞争个案，印证中国AI电源供应链竞争力 ＃Vicor诉讼无政治背景 ：25年vicor的专利授权费与诉讼和解金收入合计超过1亿美金，占总收入的20%以上。本次诉讼的对象也包括多家美国公司，＃本质是针对大客户供应链进行，可借由诉讼维持大客户专利费以及潜在的", "content": "【国联民生电子】Vicor再启337调查：企业竞争个案，印证中国AI电源供应链竞争力 ＃Vicor诉讼无政治背景 ：25年vicor的专利授权费与诉讼和解金收入合计超过1亿美金，占总收入的20%以上。本次诉讼的对象也包括多家美国公司，＃本质是针对大客户供应链进行，可借由诉讼维持大客户专利费以及潜在的和解金的利益。本次诉讼与Vicor自身的经营策略相关， 不属于政治行为或众案。 ＃实际对供应链公司业务产生的风险可控 ：调查周期或长达18个月+，调查中不会对供应链的业务开展产生直接限制，且生效前不会追溯已进入美国的产品，Vicor已是第三次开启诉讼，第一次23年诉讼判决后供应链基本可通过与Vicor和解和主动技术规避解决，最终几乎不可能真正限制供应链公司的正常业务开展。 ＃侧面印证了中国AI电源供应商的能力 ：Vicor多次诉讼的背后往往针对特定大客户/方案商展开，本次针对VPD专利展开诉讼亦是在某大客户量产节点前夕进行，立讯、富联等公司在列反而说明了公司在服务器电源端的良好进展与客户的认可——立讯目前被涉及的这部分业务尚在客户验证而未量产；富联被涉及的产品尚处于内部验证评估。观点：立讯已调整至接近今年3月的位置，当前市值仅勉强反应消费电子部分估值，已不含有对明年光模块放量和液冷电源等高增AI业务的定价，立讯、富联均已仅明年10x出头，在行业β压力、政策风险以及汇率等多个利空因素已反应的当前不应进一步悲观，建议领导底部布局，若受短期情绪扰动反而更是良机。 风险提示：贸易摩擦风险，客户进程不及预期#文字观点", "publish_time": "2026-10-12 09:31", "tags": ["文字观点"]}, "post:2026-10-12T08-07:fd049ca14ff1": {"id": "post:2026-10-12T08-07:fd049ca14ff1", "kind": "post", "title": "2026-10-12 08:07", "source_label": "帖子正文", "excerpt": "本周核心观点-20261011 锂电：工信部发布“新型电池产业发展十五五”规划，看好固态电池中的宏工科技、纳科诺尔、逸飞激光、先导智能、国轩高科、海亮股份、长阳科技。主产业链关注宁德时代、鹏辉能源、龙蟠科技、天赐材料、万顺新材。", "content": "本周核心观点-20261011 锂电：工信部发布“新型电池产业发展十五五”规划，看好固态电池中的宏工科技、纳科诺尔、逸飞激光、先导智能、国轩高科、海亮股份、长阳科技。主产业链关注宁德时代、鹏辉能源、龙蟠科技、天赐材料、万顺新材。 风电： 近期，国内海风包括招标，或EPC中标结果公布，均加速启动，看好“十五五”海风成长性。关注天顺风能等。 AIDC： 中央网信办等七部门联合印发数字化实施方案，将探索800VHVDC架构，推动超  · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>美股科技周（10/5~10/11）避险情绪进一步升温：中期选举民主党横扫两院概率上升、长端债券收益率持续高位震荡、媒体关于OpenAI ARR的混乱报道，共同导致美股开启广泛避险模式，市场广度进一步收窄；科技领域CSP、软件SaaS、AI电力领涨。\u003c/li>\n\u003cli>AI算力/大模型仍为今日最热主线（正文帖子83条）：10月被视为国产大模型较好布局窗口，短期悲观预期已反映，后续新模型发布有望成为估值修复的重要催化；同时OpenAI ARR数据及统计口径反复变化继续扰动全球模型Beta。\u003c/li>\n\u003cli>半导体/先进封装催化密集：京仪装备被列为10月金股并现价持续推荐，估计NAND客户订单占比超50%、存储订单占比超70%；长鑫存储预计年底推出融合4F²架构与混合键合技术的新一代DDR5 RDIMM；联讯仪器单Q3归母净利润13.33-15.33亿元，中枢14.33亿元，环比+220%。\u003c/li>\n\u003cli>新能源/汽车政策变化落地：自2027年4月1日起新能源汽车增值税出口退税率由13%下调至9%；中欧贸易战缓和，双方达成16条成果共识，中欧混动车贸易风险阶段性缓解，预计15-16号欧洲理事会峰会有正式结论。\u003c/li>\n\u003cli>PCB/CCL/铜箔涨价验证：10月以来电子布涨价再次落地，7628型号涨1.5元/米，电子纱G75涨3000元/吨，薄布（2116、1080型号）涨2.5元/米，多家电子布头部上市公司回应涨价属实；下游AI领域对PCB产品需求增加，AI领域特种电子布是覆铜板主要原材料之一。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型与光通信共振\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI算力/大模型正文帖子数最高；10月是国产大模型较好布局窗口，短期悲观预期已反映，后续新模型发布有望成为估值修复的重要催化；光通信方面，AI光模块是美国投资者最核心关注话题，美国投资者对1.6T光模块平均售价假设高于亚洲投资者。\u003c/li>\n\u003cli>今天出现的催化/验证：OpenAI推出ChatGPT新型视觉广告形式，并扩展广告归因及效果衡量工具，推动AI原生流量商业化；联讯仪器Q3业绩高增，期待光通信&amp;半导体共振，单Q3归母13.33-15.33亿元，中枢14.33亿元，环比+220%。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：先进逻辑与高层数存储扩产持续提升晶圆厂对高精度温控和工艺废气处理设备的需求；国产DRAM以4F²架构创新替代单纯制程微缩，打开不依赖最先进光刻机的追赶路径。\u003c/li>\n\u003cli>今天出现的催化/验证：京仪装备被列为10月金股并现价持续推荐，估计NAND客户订单占比超50%、存储订单占比超70%；长鑫存储总裁曹堪宇在第四届集成芯片和芯粒大会上宣布，预计年底推出融合4F²架构与混合键合技术的新一代DDR5 RDIMM；联讯仪器预计前三季度归母净利润19.00-21.00亿元，同比增长1866%-2073%。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>新能源/汽车：出口退税退坡与中欧缓和\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：新能源车出口退税退坡利空落地，自主出海趋势不改；中欧贸易战缓和，头部车企估值压制因素解除。\u003c/li>\n\u003cli>今天出现的催化/验证：10月12日财政部、税务总局公告自2027年4月1日起，将新能源汽车增值税出口退税率由13%下调至9%；中欧达成16条成果共识，并约定27年1月举行部长级会议、3月召开第三次例会；中欧混动车贸易风险阶段性缓解，预计15-16号欧洲理事会峰会有正式结论。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>PCB/CCL/铜箔：电子布涨价落地\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：下游AI领域对PCB产品需求增加，AI领域特种电子布是PCB上游覆铜板主要原材料之一；供应链跟踪显示SY在Q3为m8和更高等级的CCL材料加速备货，多个环节公司接到Q4上修备货的指引。\u003c/li>\n\u003cli>今天出现的催化/验证：10月以来电子布涨价再次落地，7628型号涨1.5元/米，电子纱G75涨3000元/吨，薄布（2116、1080型号）涨2.5元/米；10月12日多家电子布头部上市公司回应涨价属实；宏和科技高性能电子材料产业园主体结构施工已完成，预计11月生产设备陆续进场安装。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>液冷/电源：337调查启动\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：美国对垂直供电系统启动337调查，Vicor指控专利侵权并寻求有限排除令及停止令；诉讼本质是针对大客户供应链进行，侧面印证中国AI电源供应商能力。\u003c/li>\n\u003cli>今天出现的催化/验证：10月9日USITC基于Vicor投诉，正式对特定垂直供电系统（VPD）、相关组件及包含该产品的计算系统启动337调查，20家企业被列为应诉方；台达电子VPD约占其今年营收5%，其他AI电源产品（PSU、BBU、UPS）及液冷贡献约40%；英飞凌目前是VPD主要电源半导体供应商之一；立讯、富联等公司在列。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观/策略：深秋反弹与risk-off转向risk-on\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：维持深秋反弹预判，10月下旬全球股市有望由risk-off转向risk-on；美债10年期收益率10月将从急升转向高位震荡回落；港股整体、恒生科技及互联网龙头卖空成交占比分别降至19%、22%和18%。\u003c/li>\n\u003cli>今天出现的催化/验证：策略观点提出“防守反击+杠铃策略”参与深秋反弹，精选红利价值和科技成长；四季度中、美股市反弹催化剂包括美国中期选举之前美债长端收益率震荡回落，海外资金面迎来转机。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>美股科技周（10/5~10/11）开启广泛避险模式：中期选举民主党横扫两院概率上升、长端债券收益率持续高位震荡、OpenAI ARR混乱报道；科技领域CSP、软件SaaS、AI电力领涨。\u003c/li>\n\u003cli>国产大模型：10月是较好布局窗口，短期悲观预期已反映，后续新模型发布有望成为估值修复重要催化；近期承压来自OpenAI ARR数据及统计口径反复变化，扰动全球模型Beta。\u003c/li>\n\u003cli>半导体：长鑫存储预计年底推出融合4F²架构与混合键合技术的新一代DDR5 RDIMM；4F²单元面积较主流6F²理论缩小约30%；京仪装备存储订单占比超70%；联讯仪器Q3业绩爆发。\u003c/li>\n\u003cli>新能源车：出口退税率自2027年4月1日起由13%下调至9%；中欧贸易战缓和，双方达成16条成果共识，并约定27年1月举行部长级会议、3月召开第三次例会。\u003c/li>\n\u003cli>电子布：10月涨价落地，7628涨1.5元/米、G75涨3000元/吨、薄布涨2.5元/米，多家头部上市公司回应属实。\u003c/li>\n\u003cli>液冷/电源：USITC基于Vicor投诉启动337调查，20家企业应诉；台达VPD约占今年营收5%，其他AI电源产品及液冷贡献约40%。\u003c/li>\n\u003cli>传媒：分众传媒收购新潮反垄断审查有条件获批，附加要求5年期；2024年分众、新潮在国内梯体广告市场份额分别为50%-55%、5%-10%，合并后市占率达55%-60%。\u003c/li>\n\u003cli>宏观：10月9日财政部明确今年将动用5500亿元地方债结存限额，用于改善县区财力和支持投资；10月9日证监会就《公开募集证券投资基金运作管理办法（征求意见稿）》及配套规则公开征求意见，共涉及9大章节、66个条目。\u003c/li>\n\u003cli>策略：机构周策略观点认为，A股处于两个大波段上涨之间的震荡休整期，且仍偏向于弱势震荡；短波段市场短期性价比已明显改善，各维度悲观预期都已有所反映。\u003c/li>\n\u003cli>AI安全：海外2026年企业保护AI工具支出约28.3亿美元、同比增83%，2027年增速超过60%。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>10月下旬全球股市能否由risk-off转向risk-on；美债10年期收益率是否从急升转向高位震荡回落。\u003c/li>\n\u003cli>国产大模型后续新模型发布及估值修复催化；OpenAI ARR统计口径变化对全球模型Beta的扰动。\u003c/li>\n\u003cli>10月底~11月上旬Hyperscaler厂商三季报对AI算力链的验证。\u003c/li>\n\u003cli>长鑫存储4F² DDR5 RDIMM年底推出、良率与服务器认证进展；长鑫在DDR5及服务器市场加速上量的可能性。\u003c/li>\n\u003cli>联讯仪器Q4和明年业绩持续性；光通信&amp;半导体共振。\u003c/li>\n\u003cli>新能源车出口退税退坡后续影响；中欧15-16号欧洲理事会峰会正式结论，以及27年1月部长级会议、3月第三次例会。\u003c/li>\n\u003cli>电子布新增产能预计明年年底前集中释放；Q4供应链上修备货指引落地。\u003c/li>\n\u003cli>337调查后续对电源供应链影响；立讯被涉及业务尚在客户验证而未量产。\u003c/li>\n\u003cli>特斯拉三季报10月21日、万圣节产品发布预期；Optimus年底建成周产逾1,000台连续自动化产线。\u003c/li>\n\u003cli>台积电AI芯片背面散热单晶金刚石计划自2026年下半年起在高端AI芯片的背面散热贴片上采用该材料。\u003c/li>\n\u003cli>宏和科技新产能：预计11月生产设备陆续进场安装。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>08:05｜2026北美OCP大会前瞻 (电力分配、机架与电源板块)\u003c/li>\n\u003cli>08:05｜【中信海外策略|周聚焦】2026-10-11：回归基本面\u003c/li>\n\u003cli>08:06｜📢【中信传媒】周观点：AI应用催化持续，分众收购新潮反垄断审查通过 🎁【AI应用】 本周AI应用板块表现活跃，AI影视方向领涨，市场关注度持续提升。产业层面，OpenAI推出ChatGPT新型视觉广告形式，并扩展广告归因及效果衡量工具，推动AI原生流量商业化\u003c/li>\n\u003cli>08:06｜2026年10月11日云盘汇总\u003c/li>\n\u003cli>08:06｜【国泰海通传媒】分众传媒：收购新潮反垄断审查有条件获批，进一步推进收购节奏 10月10日，分众传媒收购新潮传媒反垄断审查取得市场监管总局有条件获批。具体附加要求5年期：1）继续履行现有客户合同及其所有商业条款。\u003c/li>\n\u003cli>08:07｜【国海轻工】周观点：10-11月黑纸预计偏强运行，继续布局出口链低估值+确定性细分方向-20261011 造纸：10-11月黑纸预计偏强运行，进口木浆或呈现针弱阔强分化 -废纸系：本周瓦楞及箱板纸市场均价有所上调。本周箱板纸价格3759元/吨（+10元/吨）、瓦楞纸价格3113元/吨（+16元/吨）\u003c/li>\n\u003cli>08:07｜本周核心观点-20261011 锂电：工信部发布“新型电池产业发展十五五”规划，看好固态电池中的宏工科技、纳科诺尔、逸飞激光、先导智能、国轩高科、海亮股份、长阳科技。主产业链关注宁德时代、鹏辉能源、龙蟠科技、天赐材料、万顺新材。\u003c/li>\n\u003cli>08:07｜【兴证多行业】鄂尔多斯：轻重双主业布局分红强劲，电冶化工降本增效具备弹性服装+电冶化工双主业布局，2025年归母净利润重回增长。鄂尔多斯自1980年长期深耕羊绒产业，2003年围绕矿产资源开发—电—电冶及化工打造第二主业，重点推动一体化及精细运营。\u003c/li>\n\u003cli>08:07｜AI影视行业：模型能力与制片流程协同，产业化进入验证期【东吴传媒互联网张良卫团队】 事件：按最新公布的Artificial Analysis含音频文生视频榜单，Wan 3.0、Utopai X、Seedance 2.5和MiniMax H3分别位列前四；博纳影业出品的《三星堆：未来往事》将于10月23日登陆全国院线，AI影视产业化进程持续推进。\u00
