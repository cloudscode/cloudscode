", "content": "【申万tmt】周度大模型趋势跟踪（260913）：DeepSeek降价、Kimi FDE推进，关注GPT-6反蒸馏讨论与RSI进展本周重点事件梳理观点一：模型能力持续迭代并降本，以Gpt6为例的循环架构或致蒸馏成本提高 #DeepSeekV4.1-Flash发布、能力升级同时降价。9月10日起，高峰时段每百万Token未缓存输入/输出价为2/8元，较前代Flash分别降低33%/11%；缓存命中输入降至0.04元、降低60%，闲时再减半。模型原生支持视觉理解及1M上下文，架构优化与低价结合，有望扩大长任务Agent的应用范围。 #KimiK2.8Preview上线、Coding与Agent能力继续升级。9月11日全量上线Kimi Code，沿用会员订阅模式。官方称性能接近K3、思考效率较K2.7 Code明显提升，并将最高1M上下文开放至全部会员档。 #GPT6Astra引发反蒸馏讨论、能力迁移门槛或提高。据外媒报道，Astra或通过循环调用Transformer层增加内部有效计算深度。若有效CoT等过程监督减少，同等数据下的蒸馏效率或下降（增加蒸馏成本但答案与任务轨迹仍可用于行为学习）。观点二：融资能力及商业化进展为模型公司重要指标 #Kimi推进FDE伙伴计划、ARR据报约10亿美元。9月10日启动企业合作伙伴计划，与华胜天成、金山云等共建前线部署工程师（FDE）队伍，覆盖需求诊断、系统集成与生产部署。另据彭博，8月ARR约10亿美元，26年年末ARR或可达20亿美元。 #智谱拟通过配售及可转债融资50亿美元、补充研发与算力投入。9月11日，公司拟以每股714港元配售约2197万股H股，较当日收盘价折让约10%，约20亿美元；另同步发行总额201.4亿元人民币（约30亿美元）于2027年9月到期的美元零息可转换债券，初始转股价为892.5港元（溢价约12.5%）。所得款项拟用于研发、算力部署及业务扩张等。观点三：RSI或为模型下一步发展路径 #OpenAI披露研究自动化进展、AI开始加速AI研发。公司称“自动化研究实习生”已可在人类指导下完成原需研究员数日的限定任务（原定26年秋季目标达成）；8月中旬Agent运行时长约为人工工时3.1倍，研究人员日均API使用成本超600美元，目标在2028年3月实现“自动化AI研究员”目标（完善的RSI）。OpenRouter 数据 track：整体调用量继续提升，本周Hy4p贡献近一半Token净增量，Mimo及Gemini新模型逐步起量。 #总Token约122.61万亿、环比+7.1%；文本请求约55.83亿次，环比+11.1%。 按slug口径，#Hy4preview以17.75万亿Token、约+26.2%贡献最大绝对增量（约+3.68万亿）；MiMo V2.5、Gemini3.8 Flash分别约+120.1%、+195.8%。DeepSeekV4.1 Flash新slug录得约2.22万亿Token。交流及详情联系林起贤/任梦妮/王昊#文字观点", "publish_time": "2026-09-13 11:26", "tags": ["文字观点"]}, "post:2026-09-13T22-10:b7c7ddc3757d": {"id": "post:2026-09-13T22-10:b7c7ddc3757d", "kind": "post", "title": "2026-09-13 22:10", "source_label": "帖子正文", "excerpt": "重申AI安全: 海外TOP3模型厂因安全问题呼吁降速，看好全球AI安全需求释放【天风计算机 缪欣君/刘鉴团队】 此前组织五场AI安全系列调研，欢迎私信❗️2026我们特别希望得到领导您的肯定和支持#重点关注：1）企业侧：深信服、绿盟科技 2）政务侧：奇安信、启明星辰 3）行业侧：安恒信息、亚信安全、", "content": "重申AI安全: 海外TOP3模型厂因安全问题呼吁降速，看好全球AI安全需求释放【天风计算机 缪欣君/刘鉴团队】 此前组织五场AI安全系列调研，欢迎私信❗️2026我们特别希望得到领导您的肯定和支持#重点关注：1）企业侧：深信服、绿盟科技 2）政务侧：奇安信、启明星辰 3）行业侧：安恒信息、亚信安全、天融信等 1、海外模型厂商呼吁降速，AI安全有望成为新模型准入前提 9月12日Anthropic CEO Dario Amodei发长文，呼吁全行业放慢能力提升，让安全测试、运行监控和第三方评估跟得上。我们理解，#AI安全前置这个事情已经发生，安全有望成为后续模型发布的#准入前提。OpenAI披露安全监控算力开销约为被监控#推理算力的20%，安全已经成为大模型的刚性成本。 2、Dario的长文中给出影响AI安全的两大因素： 1）自今年夏天以来，AI的发展速度急剧加快，主要由AI构建下一代AI的能力驱动，这种动态被称为RSI； 2）OpenAI内部评测中AI Agent自主利用未知漏洞逃出沙箱、攻入Hugging Face生产服务器窃取评测答案，#全链条零人工干预，能力已经跑在安全前面。 不加以控制，如果一群能力更强但同样存在未对齐问题的智能体出现，可能在6到12个月内具备接管整个互联网的能力。 3、海外AI安全需求已得到验证，国内需求有望加速兑现 需求端已被北美业绩验证：Fortinet最新季度产品收入同比+52%，CrowdStrike ARR突破58亿美元，Palo Alto下一代安全ARR同比+63%。北美网安业绩已验证AI非但没有挤占安全预算，反而在推动#安全支出增长。国内中报验证网安业绩在修复，且AI安全相关的订单量价齐升。下游安全有望从合规驱动 转向#价值驱动，Agent身份安全、AI大通量防火墙、AI安全平台等方向订单加速释放。重申#AI安全大时代！ 欢迎交流！ 天风计算机 缪欣君/王祺深#文字观点", "publish_time": "2026-09-13 22:10", "tags": ["重点关注", "AI安全前置", "文字观点"]}, "post:2026-09-13T23-21:c370163f2864": {"id": "post:2026-09-13T23-21:c370163f2864", "kind": "post", "title": "2026-09-13 23:21", "source_label": "帖子正文", "excerpt": "【浙商AI战队冯翠婷】快评“AO呼吁放缓AI发展”🔥🔥🔥 ⭐事件：Anthropic、OpenAI两家头部大模型厂商周末罕见联合呼吁放缓AI发展、加强政府监管，马斯克也公开表示赞同，而谷歌、Meta暂未表态。Anthropic同期发布150页风险报告，点名中国部分大模型企业通过蒸馏美国模型，将敏感数", "content": "【浙商AI战队冯翠婷】快评“AO呼吁放缓AI发展”🔥🔥🔥 ⭐事件：Anthropic、OpenAI两家头部大模型厂商周末罕见联合呼吁放缓AI发展、加强政府监管，马斯克也公开表示赞同，而谷歌、Meta暂未表态。Anthropic同期发布150页风险报告，点名中国部分大模型企业通过蒸馏美国模型，将敏感数据传至境外，伪装自主产出，变相警示“蒸馏本质是留有后门的特洛伊木马”；同时月底将迎来中美首脑会晤，市场猜测双方可能就AI监管发布联合声明。 🏆当前中美经济均高度绑定AI：美国最新GDP增长的80%由AI相关投资贡献，但面临电力短缺、数据中心交付难的问题；中国正推进包含电力、算力在内的“六张网”建设，以AI算力投资替代传统地产基建投资，AI竞争被视作“国本之战”，长期不会退缩。后续关注以下方向： 1️⃣监管强化护垄断，通过监管抬高准入门槛。 2️⃣前沿模型不再公开，留作战略储备，公开模型与训练完成的时间差进一步拉长，优先做安全对齐。 3️⃣有效阻缓蒸馏链条，现代版“特洛伊木马”，因安全风险不敢过度蒸馏美国模型。 4️⃣自主可控成为核心，国模配国芯，数据流动管理更严格，硬件物理隔断成必选项，国内算力建设速度、技术迭代节奏放缓，东南亚算力中心建设也会降速。 5️⃣利好agent and infra，通用模型迭代减速后，厂商可更多投入安全协调，解决AI Agent调用APP的权限障碍，推动终端应用落地，比如苹果封闭生态已支持AI自动操作所有APP，安卓生态的权限协调也将提速。 6️⃣利好中下游应用，通用大模型迭代放缓，减少下游行业模型适配压力，深耕垂直领域的中小AI应用企业生存空间改善，2B领域对模型稳定性、准确率的要求远高于“最先进”。 ⭐投资观点：短期利空AI硬件、大模型厂商，业绩增速及估值双杀；中长期利好AI中下游尤其agent & infra（投入更多于网络安全等）、应用、国产算力等。 风险提示：AI投资及商业化节奏不确定性、外部环境不确定性、宏观经济不确定性、股票大幅波动等风险。 ☎️快评“AO呼吁放缓AI发展”详询浙商AI战队冯翠婷17317141123，请支持“浙商传播与文化团队”。#文字观点", "publish_time": "2026-09-13 23:21", "tags": ["文字观点"]}, "attachment:files/[周末吹什么，下周跌什么]的机制拆解-20260913.pdf": {"id": "attachment:files/[周末吹什么，下周跌什么]的机制拆解-20260913.pdf", "kind": "attachment", "title": "[周末吹什么，下周跌什么]的机制拆解-20260913", "source_label": "[周末吹什么，下周跌什么]的机制拆解", "excerpt": "第1页 / 共38页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 通信 分析师：李璐毅 登记编码： S0730524120001 lily2@ccnew.com 021 -50586278 光芯片产业链分析及河南省概况 ——通信行业专题研究", "content": "第1页 / 共38页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 通信 分析师：李璐毅 登记编码： S0730524120001 lily2@ccnew.com 021 -50586278 光芯片产业链分析及河南省概况 ——通信行业专题研究 证券研究报告 -行业专题研究 同步大市 (维持) 通信相对沪深 300指数表现 资料来源：中原证券 研究所，聚源 相关报告 《通信行业月报：腾讯资本开支大幅提高，英 伟达 CPO交换机量产》 2026 -08-17 《通信行业月报：谷歌、 Meta上调资本开支 指引，我国首个 NPO光互连 MSA启动 》 2026 -07-30 《通信行业半年度策略：运力扩张，光互联迈 入新周期》 2026 -06-29 联系人： 李智 电话： 0371 -65585629 地址： 郑州郑东新区商务外环路 10号18楼 地址： 上海浦东新区世纪大道 1788号T1座22楼 发布日期： 2026年09月11日 摘要： ⚫ 光芯片是光通信产业链的核心环节， 属于国家战略性新兴产业， “十 五五规划纲 要”明确提出推进深化 5G、千兆光网规模部署，推进 5G-A、 万兆光网建设发展和 6G技术创新， 深入推进东数西算工程， 构建多层次算力设施体系和全国一体化算力网，是未来五年相关产 业发展的纲领。 受全球供应链波动及国际贸易环境变化影响，下游 系统设备商及模块厂商对供应链安全与自主可控的重视程度 提升， 为具备自主研发能力的本土芯片企业提供 市场导入和升级 机遇。 ⚫ 全球数字化转型加速，特别是 AI、大数据、云计算等新一代信息技 术的快速发展，数据流量呈现指数级增长。数据中心作为信息基础 设施的核心，其内部及相互间的数据交换需求激增，直接驱动高速 率光模块及核心光芯片的迭代升级。同时， 5G/6G网络建设、 FTTx 以及3D传感、激光雷达 等领域的拓展，为光芯片行业提供多元化 的应用场景和持续增长的市场空间 。LightCounting 预计全球光芯片 市场 2024 -2029年的 CAGR为21.7%。AI算力建设带动的需求增 长已全面传导至光通信全产业链，头部厂商业绩印证行业高景气 。 ⚫ 美、日厂商占光芯片市场的主导地位 ，国内光通信行业自主可控、 国产替代进程持续提速，产业链垂直整合趋势愈发明显。 国内专业 光芯片厂商 代表性企业包括源杰科技、长光华芯、武汉敏芯等；综 合光通信厂商 代表性企业有华为海思、纳真科技、仕佳光子等；光 芯片模块一体化厂商 代表性企业有光迅科技、海信宽带及东山精密 收购的索尔思光电等 。传统光芯片在速率、集成度、功耗及成本方 面正逐步接近物理极限。以硅光技术、薄膜铌酸锂为代表的新一代 集成技术路线，凭借其与 CMOS工艺兼容、高集成度、低功耗等 优势，成为满足 800G、1.6T及以上超高速光传输需求的新技术方 案。新技术的产业化应用，有望打破传统工艺路径的壁垒，为后来 者提供在新一代技术平台上构建竞争力的可能性，从而重塑市场竞 争格局。 ⚫ 河南省依托 “一核四极多点 ”空间布局，系统打造算力产业生态。 鹤壁市以仕佳光子为核心载体，集聚河南标迪、腾天光通信、威讯 光电、九黎光电、河南杰科等上下游配套企业，构建有源、无源芯 片协同发展的完整产业链。中科院半导体所河南研究院输出技术支 撑，叠加产业引导基金赋能，有效加速科研成果产业化落地。河南 创新“中试基地 + 企业 + 基金”模式，降低技术成果转化风险，加快 光芯片商业化落地。光电产业链被列为河南省重点打造的千亿级产 业链， 按照规划， 2026年全省算力规模将达到 120 EFLOPS ，2027-9%7%24%40%56%72%88%105% 2025.09 2026.01 2026.05 2026.09通信 沪深 300 9469 仅供内部参考，请勿外传 第2页 / 共38页 通信 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 年全省人工智能产业规模将突破 1600亿元。该目标将持续吸引资 本、 技术要素向河南集聚， 巩固其中部地区光电产业核心枢纽地位。 ⚫ 河南省光芯片行业发展主要面临核心技术瓶颈与高端产品依赖风 险、产能供给难以匹配持续增长的市场需求、技术快速迭代带来的 研发与商业化风险、产业链协同不足与人才竞争压力等挑战。针对 上述情形，我们提出以下建议：前瞻布局硅光、 CPO等前沿方向， 加快中试平台市场化运营；布局高端有源芯片赛道，支持龙头企业 加速产能建设，增强供应链韧性；推动 “边研发、边转化 ”的快速 迭代模式，支持企业联合高校院所开展共同预研；强化省域内产业 协同与跨区域协作，推动产业链投融资机制创新，构建多元化人才 “引育留用 ”体系。 风险提示： 下游需求 不及预期；技术升级迭代风险；行业竞争加剧。 仅供内部参考，请勿外传 第3页 / 共38页 通信 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 内容目录 1. 光芯片位于光通信产业链上游，占据价值制高点 ................................ ............. 5 1.1. 光芯片负责光电信号转换，其性能决定光通信系统的传输效率 ................................ ........ 5 1.2. EML 是目前技术迭代中的主流品类，大功率 CW激光器的重要性提高 ............................ 7 2. AI需求增长传导至光通信全产业链，光芯片行业维持高景气 ........................... 8 2.1. 光模块作为数据中心内部高速互连的核心硬件，正经历前所未有的需求增长 .................. 8 2.2. 光芯片有望成为下一代光通信技术升级迭代的核心动力，未来市场需求将保持高速增长 9 2.3. AI、云计算等新兴产业带动算力基础设施大规模建设 ................................ ...................... 10 2.4. 无线通信对光模块和光芯片的需求结构正发生代际切换 ................................ ................. 11 2.5. 接入网领域 10G-PON逐渐普及， 50G-PON加速部署 ................................ .................. 13 2.6. 光芯片属于技术密集型行业，制造难度较高，工艺流程复杂，研发周期较长 ................ 14 2.7. 光芯片向更高速率、更长距离发展，呈现集成化与小型化趋势，硅光技术正成为行业新 技术方向 ................................ ................................ ................................ ................................ . 15 3. 美、日厂商占光芯片市场的主导地位，自主可控、国产替代进程提速 ........... 17 3.1. 光芯片企业主要采用 IDM和Fabless 两种经营模式 ................................ ....................... 19 3.2. 光芯片企业核心竞争力的评价维度包括技术研发、工艺制造及产品交付、产品质量与创 新能力 ................................ ................................ ................................ ................................ ..... 20 4. 光芯片创新性强，各级政府在光电子技术产业进行重点政策布局 .................. 21 4.1. 河南省出台相关方案支持算力产业发展，为本土企业创造良好发展环境 ....................... 23 5. 河南省企业仕佳光子是国产光芯片 “隐形冠军 ” ................................ .............. 26 6. 光芯片企业发展借鉴案例：陕西省源杰科技 ................................ .................. 29 7. 河南省光芯片行业发展面临的挑战及建议 ................................ ...................... 34 8. 风险提示 ................................ ....... 组件。作为光通信网络的核心组件之一，光芯片 负责光电信号转换，其性能决定光通信系统的传输效率。光芯片可进一步加工成光学组件，再 集成到光模块中。 光芯片是现代光通信器件核心元件 ，激光器芯片和探测器芯片合称为光芯片。光芯片是光 电子器件的重要组成部分，是半导体的重要分类，其技术代表着现代光电技术与微电子技术的 前沿研究领域，其发展对光电子产业及电子信息产业具有重大影响。高速光芯片是现代高速通 信网络的核心之一。光芯片 是实现光电信号转换的基础元件，其性能直接决定光通信系统的传 输效率。光纤接入、 4G/5G移动通信网络和数据中心等网络系统里，光芯片都是决定信息传输 速度和网络可靠性的关键。 图3：光芯片和半导体的关系 资料来源：源杰科技，中原证券 研究所 根据是否需要能源驱动，光芯片可分为有源光芯片和无源光芯片，其中有源光芯片主要包 括激光器芯片（ LD）及探测器芯片（ PD） ，其中激光器芯片用于将电信号转换为光信号实现信 号传输，探测器芯片用于将光信号转换为电信号实现信号接收。为实现光通信网络的稳定、可 靠，激光器芯片及探测器芯片在材料选择、结构设计及制造工艺精度方面的要求极高。因此， 光芯片在光通信产业链中具有极高的技术壁垒。 按照出光结构的不同，激光器芯片可进一步分为边发射芯片和面发射芯片，边发射芯片包 括FP、DFB和EML芯片，面发射芯片主要包括 VCSEL芯片。按照衬底材料的不同，磷化铟 仅供内部参考，请勿外传 第7页 / 共38页 通信 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 衬底芯片主要包括边发射激光器芯片（ FP、DFB和EML芯片） 、探测器芯片（ PIN和APD芯 片）等，砷化镓衬底芯片包括面发射激光器芯片（ VCSEL芯片） 、高功率激光器芯片等，此外 硅基衬底芯片包括硅光子芯片以及 PLC芯片、 AWG芯片等无源光芯片，薄膜铌酸锂衬底芯片 包括高速调制器芯片等。 图4：光模块结构示意图 （SFP+封装） 图5：光芯片的分类 资料来源： IMT-2020（5G）推进组，源杰科技， 中原证券 研究所 资料来源：云岭光电，中原证券 研究所 1.2. EML是目前技术迭代中的主流品类 ，大功率 CW激光器的重要性提高 光芯片正向更高速率及更高集成度的方向发展。单通道 100G/200G 高速光芯片已成为行 业技术演进的主流方向，而单通道 400G芯片有望引领下一代光通信技术的发展。单通道 100G/200G 芯片通过 PAM4调制，可应用于 800G/1.6T 光模块，其中 EML芯片凭借优异的调 制带宽、高线性度及低驱动电压，是目前光通信芯片技术迭代中的主流品类。同时，随着数据 中心需求的增长，大功率 CW激光器芯片的重要性提高，通过支持更多光通道，与硅基调制芯 片集成，制成硅光子芯片，可广泛应用于下一代数据中心、高性能计算机及光通信系统。 在电信领域，主流的激光器芯片按速率可划分为 10G DFB/EML 、25G DFB/EML ；在数通 领域，为实现算力集群性能最大化，对高速率、低延迟、低功耗的数据需求不断增加，目前主 流光模块对激光器的需求分为 EML方案及硅光方案，其中 EML方案使用单通道 100G/200G EML激光器芯片， 广泛应用于 400G、800G、1.6T高速光模块中； 硅光方案使用 70mW/100mW CW激光器芯片，搭配硅基调制器，凭借其高集成度、低成本及对 CPO等前沿封装方案的适 配， 正逐步成为下一代高速光模块的主流方案之一。 光模块与激光器芯片通常非一一对应关系， 以800G光模块为例，如采用 EML方案，需要 8颗100G或4颗200G EML 激光器芯片；如 采用硅光方案，需要 2-4颗70mW CW 激光器芯片。 表1：各类别激光器芯片对比 产品类别 主流传输速率 工作波长 产品特性 应用场景 EML 10G/25G/50G/100G/200G 1270 -1610nm InP衬底， 将 DFB激光器芯 片（发光）与电吸收调制器 （EAM，调制）集成在单芯 片，实现“发光 +调制”一 体化， 低啁啾、 高调制速率、 长距传输能力强；是高速中 长距光通信的核心。 长距离传输，如高速率、远距离的电 信骨干网、城域网和数据中心互联 。 仅供内部参考，请勿外传 第8页 / 共38页 通信 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 CW 50mW/70mW/100mW 1270 -1610nm InP衬底， 以 DFB为基础的 高稳定性单模激光器芯片， 无调制光模块，持续输出稳 定连续激光，低噪声、高功 率波长一致性极佳； InP衬 底，是硅光 /CPO外调制架 构的核心光源。 ta_Muse登场，再议腾讯小微生态与商业化-260912.pdf": {"id": "attachment:files/中金公司-互联网行业周思考：Meta_Muse登场，再议腾讯小微生态与商业化-260912.pdf", "kind": "attachment", "title": "中金公司-互联网行业周思考：Meta_Muse登场，再议腾讯小微生态与商业化-260912", "source_label": "中金公司", "excerpt": "互联网周思考： 互联网周思考：Meta Muse 登场 登场 再议腾讯小微生态与商业化 再议腾讯小微生态与商业化 2026-09-12 行业动态 行业近况 本周（ 2026 年 09 月 07 日 -09 月 11 日）美股 KWEB 下跌 5.6% ，港股恒生科技指数下跌 5.5% ，美股纳斯达克指数下跌 0.7% 。评论 Meta 近期发布个人 AI A", "content": "互联网周思考： 互联网周思考：Meta Muse 登场 登场 再议腾讯小微生态与商业化 再议腾讯小微生态与商业化 2026-09-12 行业动态 行业近况 本周（ 2026 年 09 月 07 日 -09 月 11 日）美股 KWEB 下跌 5.6% ，港股恒生科技指数下跌 5.5% ，美股纳斯达克指数下跌 0.7% 。 评论 Meta 近期发布个人 AI Agent Muse 。 Muse 可自主拆解任务、操作网页，并在议价、付款等关键环节请求用户确认，免费 档每周约 1 亿 token ，另设 20 美元与 100 美元两档月费。上线两日升至美国 App Store 免费榜第 2 位，反映出较高用户关注度。 从实际体验看，当前瓶颈已不全是模型能力，更多是账户登录、授权、实时数据和第三方服务接入等外部问题：优惠价格失效、 账户登录失败等，本质上都来自模型之外的系统约束；相较之下，邮箱检索、邮件分类等只需单次授权的任务更容易跑通。 Muse 也进一步凸显完整服务生态对 Agent 执行能力的重要性，腾讯小微或有优势。小微仍在灰测阶段，由较小模型 WeLM 驱动，复杂任务可调用外部模型补足能力。 Meta 虽拥有 FB 、 Ins 等庞大的社交与内容生态，但购物、出行等生活服务仍 较多依赖第三方应用和网页；相比之下，微信还通过小程序和微信支付承载大量消费及生活服务，小微因此更可能从微信现有场 景延伸，在信息处理、社交管理及跨小程序复杂任务中率先形成闭环。长期看，微信生态内较高的服务密度有望成为小微的重要 壁垒；但腾讯、阿里、字节等生态相互割裂，仍将限制其跨平台任务执行和通用性。 C 端个人 Agent 的商业价值可能同时来自存量再分配与增量创造。若 Agent 仅替代用户原有的小程序操作，对行业整体未 必创造新增交易；但对腾讯而言，若 Agent 由工具升级为新的意图分发入口，即使 GMV 不变，也可能强化微信对交易链条的掌 控并提升变现率。更大的长期空间则取决于其能否解决现有 App 未充分满足的复杂需求，进一步创造增量 GMV 。成本端，腾讯 以较小模型降低单位任务成本，不追求 SOTA ，也意味着可能走出和 Muse 依赖订阅覆盖前沿模型高推理成本不一样的商业模 式。 估值与建议 我们维持相关覆盖个股盈利预测、估值和评级。 风险 宏观环境不确定性，核心业务放缓，监管政策变化。 仅供内部参考，请勿外传！", "status": "extracted"}, "post:2026-09-13T20-10:2efc51ef9856": {"id": "post:2026-09-13T20-10:2efc51ef9856", "kind": "post", "title": "2026-09-13 20:10", "source_label": "帖子正文", "excerpt": "【天风建筑建材 & 新材料】周观点：PCB材料链重新获验证 20260912 --- 上周复盘 --- 天风建筑、天风建材、天风新材料、海外新材料平均涨跌幅分别为-1.5%、+0.1%、+0.2%、-0.1%。强弱排序为PCB/铜箔>电子布/高端CCL/硅微粉>MLCC>PTFE/玻璃基板>地产链与", "content": "【天风建筑建材 & 新材料】周观点：PCB材料链重新获验证 20260912 --- 上周复盘 --- 天风建筑、天风建材、天风新材料、海外新材料平均涨跌幅分别为-1.5%、+0.1%、+0.2%、-0.1%。强弱排序为PCB/铜箔>电子布/高端CCL/硅微粉>MLCC>PTFE/玻璃基板>地产链与建筑工程。迅捷兴、超声电子、逸豪新材、崇达技术、博敏电子、明阳电路、金安国纪、德福科技分别上涨约43%、42%、42%、38%、31%、29%、28%、25%；生益科技、建滔积层板、联瑞新材分别上涨约8%、8%、9%，中国巨石、中材科技、国际复材、宏和科技分别上涨约11%、9%、16%、8%；海外英伟达、美光分别下跌约5%、4%。PCB材料链完成股价验证，而传统建材与建筑工程仍偏弱。 --- 上周核心边际信息 --- 1. 9月电子纱、厚布和薄布报价继续上调，薄布涨幅高于厚布；CCL厂商亦通过FR-4、半固化片及特殊规格调价向下游传导。 2. MLCC由渠道涨价转向高端订单、产能迁移和分规格提价。三星电机已公告约1.0722万亿韩元AI服务器MLCC合同，供货覆盖2027年，并与多家全球客户签署长期协议；村田产品线优化及停产安排，反映产能继续向AI服务器所需超高容、低电压、高可靠规格倾斜。消费级X5R与AI级X6S均有调价。 3. AI系统瓶颈继续从算力芯片外溢至内存、互连和基础设施。美光强调智能体AI约束正转向HBM、DRAM、NAND与数据互连构成的内存层级，并披露HBM4量产送样；NVIDIA宣布在澳大利亚建设最高2GW、可承载多代DSX计算基础设施的能力。 4. 玻璃基板/TGV进入工程验证期，短期仍看认证与良率。三星电机在KPCA Show 2026展示玻璃芯封装基板及完整TGV路线，进一步验证玻璃基板在高密度封装中的技术方向。 5. 传统建材政策托底仍在，但价格、需求和股价尚未形成反转验证。8月PPI同比回升，上游有色与化工原料价格偏强，而建筑材料及非金属类购进价格仍下降。 --- 下周重点推荐 --- 【一、AI新材料主线】 本周最强信号是PCB材料链多环节同步修复。优先高端CCL、低介电电子布与HVLP铜箔，其次球形硅微粉、MLCC/陶瓷基板和洁净室，再跟踪PTFE与玻璃基板的客户认证。 PCB产业链：CCL看生益科技、建滔积层板；电子布看中材科技、国际复材、中国巨石、宏和科技；树脂看东材科技、圣泉集团；铜箔看德福科技、铜冠铜箔，设备端洪田股份；硅微粉看联瑞新材、凌玮科技；钻针看中钨高新、鼎泰高科。 MLCC与陶瓷材料：MLCC看国瓷材料、三环集团、洁美科技、博迁新材；陶瓷基板看旭光电子、中瓷电子、金博股份。核心验证高端粉体售价、客户认证、量产订单和毛利率。 PTFE及玻璃基板：PTFE混压方案看昊华科技、东岳集团；玻璃基板看京东方、沃格光电、美迪凯、凯盛科技、戈碧迦、旗滨集团、帝尔激光、德龙激光。 先进封装、散热与其他材料：关注飞凯材料、肯特催化、赛腾股份；液冷与连接器关注鸿日达，金刚石铜关注四方达、国机精工；磷化铟关注实朴检测、有研新材、云南锗业。 【二、传统建材板块】 政策托底仍在、基本面尚未反转，优先海外盈利和现金流。海外建材看华新建材、科达制造；C端建材看兔宝宝、悍高集团、三棵树；新开工端看东方雨虹、北新建材等。 【三、海外新材料】 重点跟踪联茂、台光电、南亚、欣兴的月度收入与高阶板产能利用率，日东纺的低介电电子布供给，村田的高容MLCC产能迁移，以及住友、德山的高纯材料。 【四、高股息+转型+建筑工程】 重现金流、分红和订单质量，降低对短期主题弹性的依赖。高股息看江河集团、四川路桥；业绩修复跟踪鸿路钢构，三季度业绩有望继续超预期；转型看联检科技、时空科技、中天精装；洁净室工程关注亚翔集成、柏诚股份、圣晖集成、华康洁净。 --- 请鼎力支持【天风证券】【建筑和工程】鲍荣富、王丹团队#文字观点", "publish_time": "2026-09-13 20:10", "tags": ["文字观点"]}, "post:2026-09-13T20-43:d59cd92a16fb": {"id": "post:2026-09-13T20-43:d59cd92a16fb", "kind": "post", "title": "2026-09-13 20:43", "source_label": "帖子正文", "excerpt": "摩根大通——硬件与网络：2026年新兴科技领袖论坛纪要 摩根大通在纽约举办了\"2026年新兴科技领袖论坛\"，与会公司包括Calix、Ciena、HP Inc.、NetApp、Sanmina及Semtech ------ Ciena（CIEN）——市值最大 需求与指引 需求韧性持续，管理层重申FY26", "content": "摩根大通——硬件与网络：2026年新兴科技领袖论坛纪要 摩根大通在纽约举办了\"2026年新兴科技领袖论坛\"，与会公司包括Calix、Ciena、HP Inc.、NetApp、Sanmina及Semtech ------ Ciena（CIEN）——市值最大 需求与指引 需求韧性持续，管理层重申FY26末积压订单将超100亿美元。受供应链约束影响，FY27营收增速基线指引至少为同比30%以上，叠加与核心客户的长周期能见度，支撑中期需求前景保持健康且可持续。管理层同时表示，有望恢复中期指引（此前因需求环境高度动态化而暂停近一年）。 规模扩张（Scale-across） 规模扩张部署尚处极早期阶段，Ciena有望在已占据50%—70%的主导份额基础上进一步提升市占率。部署包含光子线路系统及相干端点（以相干可插拔模块或嵌入WaveServer等系统的高性能光模块形式交付），FY27两部分合计营收预期为数亿美元量级。需求来源包括超大规模云厂商的直接建设以及通过MOFN（城域光融合网络）服务他们的电信运营商。 供应链瓶颈 制造产能并非制约因素（Ciena依托多家合约制造商，且自主掌握测试设备的IP与产能——这是吞吐量的关键决定因素，公司已提前投入资本开支）。核心瓶颈在于元器件供应（如泵浦激光器和光封装），应对路径包括：(1)认证额外供应商，尤其是泵浦激光器；(2)深化垂直整合（相干调制解调器已实现高度垂直整合，交换机则较低）；(3)通过长期供应商承诺锁定产能分配。 数据中心内部机会 至本年代末，数据中心内部机会将占TAM的约20%。当前仅数据中心带外管理（DCOM）产生营收（来自单一客户），每新增一个客户预计带来数亿美元增量。Nubis收购将贡献两条新收入线：(1)有源铜缆与重定时器，FY27预期温和营收，后续逐步放量；(2)面向XPO的光引擎（每通道200G，3.2/6.4T，与Tomahawk 7级交换机对齐），营收预计FY28启动。此外，Coherent-lite（旨在推动相干光技术在数据中心内部的渗透）同样预计FY28开始贡献营收。整体而言，至本年代末，数据中心内部机会对应的TAM约100亿美元，而公司总TAM约500亿美元。 毛利率 管理层将45%确立为毛利率新基线，上行驱动包括：(1)向高毛利方案的有利组合迁移（如类硅数据中心产品——重定时器、光引擎，以及因定价哲学转向按价值定价而非传统刀片式定价而带来利润率增厚的多轨线路系统）；(2)长期协议提供显著的价格确定性（对比历史上的合同价格侵蚀），使公司得以保留设计降本成果而非让渡给客户；(3)鉴于供应商在定价决策上态度明确，将上涨的元器件成本转嫁给客户。 研发优先级 研发支出按以下顺序分配：技术周期迭代（最大占比，如当前从3nm WaveLogic 6向2nm WaveLogic 7的过渡）> TAM扩张与客户导入（如共封装光学和重定时器等数据中心内部机会）> 现有方案的新客户上量（如DCOM）。除研发运营杠杆外，管理层强调随着营收组合向超大规模云厂商倾斜（决策更集中，而电信客户需更广的销售覆盖），销售效率将进一步提升。 推理与训练 长期来看，推理有望超越训练成为更大的机会。当前AI训练是更大机会（构建定制化的高带宽网络以支持分布式训练及更广泛的AI骨干网），而推理仍主要来自现有网络上的通用流量。但管理层预计未来几年推理在流量中的占比将大幅提升，可能成为多数。具体而言，推理将更分散，流量经融合骨干网传输至主要城域网接入点，再进入小型定制化城域网络。因此，虽然单个推理项目规模小于训练项目，但总体机会最终可能更大。此外，不断增长的推理与智能体AI流量将进一步提升骨干网带宽需求，并随时间推移支撑公司超轨架构的更广泛应用，尽管时机仍不确定。 ------ NetApp（NTAP） 需求韧性 管理层将需求定性为结构性驱动（由AI基础设施投资建设推动），并重申了近期上调的F2Q27及FY27预期——在财年早期即进行非典型的下半年上调，体现了对需求环境的信心。尽管受定价影响，F1Q27存储容量出货量同比下滑，但整体存储支出预算保持韧性，各部门流向IT支出的AI预算亦如此。技术更新节奏稳定（对比此前通胀周期中的放缓），指向健康的潜在需求环境，意味着下半年减速更多源于保守预期而非实质性放缓的早期信号。 产品毛利率 F1Q产品毛利率54%超预期（指引低端附近），由有利组合及高于预期的使用低成本库存驱动，但两者均不可重复，故F2Q27指引为环比下滑，FY27下半年利润率持平。全年公司毛利率指引因组合因素下调约40个基点。管理层指出NAND价格上涨放缓有助于未来规划，且公司已以优惠条款锁定FY27全年内存供应。 NAND与HDD价差 NAND涨幅高于HDD，推动需求向混合闪存迁移，但对利润率影响有限。NetApp产品组合覆盖高性能及中端闪存方案以及基于HDD的混合闪存。近期QLC与HDD定价分化，成本敏感型客户需求正向混合闪存转移（已连续两季度同比增长，但全闪存增速仍更快）。鉴于全产品线的定价举措，向混合闪存的迁移对利润率影响甚微，而NetApp在全闪存与HDD领域的广泛产品组合是相对同业的核心差异化优势。 竞争定位 NetApp在最近季度从竞争对手处夺取份额，管理层认为AI浪潮将惠及所有参与者。NetApp的价值主张在于\"商品硬件+专有软件\"，相较商品化IT系统更难被替代。管理层坦承价格驱动的竞争是该品类的常态，每家供应商都会周期性地牺牲利润率以夺取战略客户，NetApp亦曾身处攻守两端，结果无明确规律。 公有云 公有云毛利率目标已上调至约80%—85%（此前为70%—75%），过去三年实际水平甚至更高。管理层暗示该目标未来可能进一步上调，将云经济效益定位为相对竞争对手的重大差异化优势。此外，NetApp提及最终将向Azure数据中心部署系统，这将驱动部分投资，但管理层预计利润率仍将维持在80%以上，影响定性为暂时性而非结构性。最后，NetApp与超大规模云厂商的关系正助力其赢得新云（neo-cloud）订单，以传统云模式销售系统。 ------ HP Inc.（HPQ） CEO过渡与FY27展望 管理层强调运营在CEO过渡期间未受影响（搜索已进行7个月，通常需6—9个月），深厚的梯队和Bruce的无缝衔接使新联盟与交易推进未受影响。管理层对F4Q26代表利润率底部充满信心，预计FY27各季度（除季节性因素外）环比改善，因成本增速较FY26放缓。 成本应对 内存BOM占比1H26约35%，预计年底趋近40%并持续至FY27，内存价格增速放缓提供了更好的能见度。应对成本压力的工具箱包括：确保及时供应、向高毛利AI PC及工作站转移组合、采取支持性定价行动、以及通过内存优化和WXP智能配置来引导供需。树脂等大宗商品虽也在涨价，但BOM占比远小于内存且涨幅更缓。日元走弱增加了重新定价难度，但新打印机发布有望部分抵消成本压力。 利润率驱动 展望未来，组合将成为利润率的第一驱动力（结构性顺风），其次是成本优化，定价因弹性考量被刻意置于末位。合约重新定价进展合理，但多年期企业/公共部门合约（约3/4营收来自商用）比交易型托管设备服务（MDS）更难重新定价。鉴于低端PC换机仍延迟且不太可能回到200—300美元价位段，管理层优先通过保护高端份额（正在提升市占率）来追求营业利润，同时防守600—1000美元的主流价位段（约占市场40%），该段已流失入门级份额。 边缘/混合AI 边缘/混合AI正成为核心战略驱动力。管理层将AI定位为分布式/混合模型，由智能编排器根据token成本、延迟、连接性和安全性在设备端、本地和云端之间路由工作负载。设备端AI的持续性由移动/离线工作者、计算机视觉延迟和安全敏感型开发者等用例支撑，新的\"智能体PC\"品类可能进一步加速需求。开源模型（GPT-OSS、Gemma等）和仅NPU智能体进一步推动采用，HP在芯片选项上具备灵活性（Intel、AMD、Qualcomm及NVIDIA RTX），其中Qualcomm在性能/功耗比上最优，在消费级/SMB品类市占率正提升。 WXP WXP是HP基于订阅的设备群\"控制塔\"，让IT团队能够细分用户画像并合理配置，同时也作为价格敏感客户的设备退役工具，正被定位为高毛利、提升附加率的经常性收入杠杆。尽管推出仅数年，WXP已拥有超500万台设备注册，为经常性软件收入建立了可观的安装基数。长远来看，WXP可能演变为企业设备和AI智能体的控制层，随着AI向边缘迁移，有望成为更大的战略性软件平台。 打印业务 在贡献总营业利润三分之二的打印板块，管理层正执行F4Q26硬件策略，在连供打印机（tank printers）上取得显著份额提升（已升至20%中段，而整体打印机市场地位约30%中段），品牌力支撑下预计F4Q26持续获客。然而硬件利润率低于目标区间，拖累短期盈利。该策略可能导致F1H27利润率处于低端，但管理层预计将被订阅增长和严格的成本管理所抵消。 关税退款 F3Q26营业利润率18.1%（剔除1.2—1.25亿美元关税后为16%—19%目标区间的低端）。F4Q26指引已包含约9000万美元关税退款，另有8000—9000万美元因仍在处理中而未纳入，若当季兑现将构成F4Q26营业利润的上行空间。 ------ Calix（CALX） 平台化捆绑 Calix已从模块化产品转向企业订阅协议（ESA），客户可访问全部产品组合，鼓励端到端平台采用而非从其他供应商采购单点方案。随着额外功能累积至平台且不额外收费，为下一代ESA的平台定价跃升铺路。交叉销售动作因此减轻，销售团队可更聚焦新客户获取（即\"一对多\"模式）。 Managed MDU Managed MDU是下一增长机会，聚焦邻近的企业及物业导向市场，拥有独立领导团队和单独的上市组织。管理层视其为分散化、碎片化的数十亿美元TAM，有望捕获10—20亿美元机会。其中多户住宅（MDU）是子集，传统上室内网络由系统集成商拼接多供应商方案，Calix的策略是将其整合为基于现有SmartLife组合（SmartHome、SmartBiz、SmartMDU、SmartTown漫游Wi-Fi）的单一托管方案，类似平台可延伸至酒店、校园和电网网络。随着大量工程人力从Calix One平台过渡中释放，计划快速构建面向邻近市场的垂直特定用例。 AI策略 Calix内部部署标准化的企业级智能体AI，驱动运营效率并加速产品迭代，预计2027年实现年度产品功能迭代速度的显著跃升。同时，Calix通过投资搭载Nvidia刀片的私有数据中心（Google提供额外算力）以及依赖开源模型，将成本结构与按使用量计费的AI token支出隔离。Calix One平台的端到端特性实现了客户工作流的自动化，改善客户投资回报率并增强全平台附加价值。Calix拥有超18个月的工作流自动化路线图，客户通过平台部署增量自动化几乎无摩擦。 现金流 管理层预计持续的环比营收增长叠加运营支出优化将驱动更高的现金流收益率。借助内部AI实施带来的更高运营支出效率及更具扩展性的销售模式，多余现金将通过额外股票回购返还。Calix目标中期运营支出增速约为历史水平的一半，最终目标是在营收大幅增长的同时保持员工总数大致持平。管理层还提到累积现金是年内早些时候加速回购的理由，回购以金额而非股价为目标，并持续偏好回购作为资本返还方式。 内存逆风 内存供应有保障，但成本通胀前景仍不确定，产品交货周期和客户采购价格保护可能导致毛利润逆风持续。客户在内存附加费生效前基本未大量囤货，限制了需重新定价的积压量，Calix已实施订单量上限以防止利用价格保护过度下单。对于新订单，附加费调整为月度（此前为季度），客户须下达不可取消的采购订单并享有六个月价格保护。Calix预计将吸收短期元器件成本通胀，但若价格后续回落，经济效益将转为有利。Calix选择不在定价上激进，#文字观点", "publish_time": "2026-09-13 20:43", "tags": ["文字观点"]}, "post:2026-09-13T22-07:8fa3441aeac8": {"id": "post:2026-09-13T22-07:8fa3441aeac8", "kind": "post", "title": "2026-09-13 22:07", "source_label": "帖子正文", "excerpt": "【广发机械】专用设备跟踪：光博会显示行业高景气度，华为全连接大会在即 #光设备。上周深圳举办光博会，NPO/CPO等技术方案展示较多，多家推出1.6T相关设备，行业供不应求，订单持续上修", "content": "【广发机械】专用设备跟踪：光博会显示行业高景气度，华为全连接大会在即 #光设备。上周深圳举办光博会，NPO/CPO等技术方案展示较多，多家推出1.6T相关设备，行业供不应求，订单持续上修；在SEMICON Taiwan 2026上，台积电发表主题为\"How COUPE Redefines AI Interconnects\"的技术演讲，同时ficonTEC表示，未来五年所需的产能将超过过去25年总和，其累计出货2000台系统，并计划在未来1-1.5年内出货1000台系统；如同我们路演一直强调的，近两年行业的产能将有10倍级增长，叠加产品升级，光模块设备市场将从百亿级别迈向千亿级别。 CPO设备关注罗博特科、联讯仪器、天准科技、强一股份、科瑞技术等，光模块设备关注联讯仪器、罗博特科、华兴源创、猎奇智能、华盛昌（伽蓝特）、矽电股份、凯格精机、博众精工、奥特维、快克智能、科瑞技术、智立方、和林微纳等。 #半导体设备。下周将举办华为全联接大会2026，有望进一步阐述韬定律（长川+强一）；台积电2026年8月合并营收为5148.06亿新台币，环比增长10.1%，同比增长53.3%，显示下游超高景气度；我们持续看好半导体设备。 继续强调长川科技、强一股份、华峰测控、精智达、联动科技、金海通、矽电股份、欧康诺（CC SLT测试）以及精测电子、微导纳米（CC占比超过50%）、迈为股份等半导体设备。 #玻璃基板。台湾检测设备厂商Spirox(创意电子)发布SP7000G高速TGV 裂纹检测系统，强化其面向玻璃芯基板与TGV大批量制造的检测解决方案；SKC玻璃基板从原型验证转入量产准备，Absolix近期在美国密集发布招聘信息；我们一直强调，行业逐步形成了玻璃作为终极材料的共识，未来半年到一年内行业的变化会持续不断。 继续强调帝尔激光、长川科技、强一股份、汇成真空、长信科技以及大族激光、德龙激光、英诺激光、东威科技、芯碁微装等。#欢迎支持广发机械团队【6】孙柏阳/汪家豪/王宁/许贝尔#文字观点", "publish_time": "2026-09-13 22:07", 策鼓励行业创新；同时建议积极关注前沿技术的发展。创新药及制药企业（ ADC、二代IO、小核酸、减重、 TCE、AI制药）、创 新药产业链公司（临床前 CXO、AI CXO、CDMO）、器械（AI、脑机接口、手术机器人等）。创新药及制药领域的相关公司包括：恒瑞医药、信达 生物、康方生物、百济神州、科伦药业、科伦博泰、石药集团 /新诺威、荣昌生物、中国生物制药、和黄医药、海思科、信立泰、泽璟制药等；创新 药产业链领域相关公司包括：药明康德、药明合联、药明生物、凯莱英、康龙化成、昭衍新药、百奥赛图等；器械领域的相关公司包括联影医疗、 惠泰医疗、海泰新光等； 出海主线：中国医药产业逐步具备全球竞争力，长期看医药行业有望走出全球性大公司，但投资人也需对出海带来的挑战有充分预期，这必定是一 个长期而曲折的过程。代表性的细分行业是创新药和器械公司，对公司产品及团队国际竞争力的评估是最核心的选股依据。创新药领域关注已有重 磅品种license-out或者co-development的公司，相关公司有百济神州、恒瑞医药、信达生物、康方生物、科伦博泰、三生制药、荣昌生物、百利 天恒等；器械领域包括迈瑞医疗、联影医疗、华大智造等；疫苗领域包括康泰生物、康希诺及欧林生物等。 边际变化主线：（ 1）政策改善：包括医药流通、高值耗材、电生理赛道、医疗设备，看好高端设备进口替代和出海。更新主线，流通领域相关公司 包括国药控股、上海医药、华润医药及九州通等；高值耗材的集采政策逐步出清，关注电生理赛道、医疗设备采购恢复常态化，看好高端设备进口 替代和出海，相关公司包括联影医疗、惠泰医疗等。 （2）需求量价边际回暖： 医疗服务板块消费医疗温和复苏，严肃医疗政策影响边际趋稳，长期 刚需属性不变。中药经历渠道调整后有望在基药目录等催化下边际改善；医药零售加速向“健康驿站”转型升级。 整合主线：建议重点关注器械及中药子行业、部分制药企业、央国企。 风险提示：行业政策风险；研发不及预期风险；审批不及预期风险；宏观环境波动风险。 3 下载日志已记录，仅供内部参考 目录 02.疫苗：利润端表现分化 ，关注产品放量及创新管线进展 03.血制品：26H1业绩持续承压 ，关注行业整合 、新品放量及出海进展 04.医药零售：同店改善 ，门店回归扩张周期中药：院外库存逐步出清 ，院内政策影响分化 01. 05.医药流通：收入稳定增长 ，回款有所改善 06.风险提示 下载日志已记录，仅供内部参考 下载日志已记录，仅供内部参考 中药：院外库存逐步出清，院内政策影响分化 院外渠道库存逐步出清 ，院内端有所承压： 26年Q2中药行业收入端同比下降 8.4%，归母净利润增速为 -18.4%，扣非归母净利润增速为 -0.9%，收入略有承压，主要由于院外感冒呼吸品类有所承压 ，院内端政策影响产品销售；归母净利润表现较弱 ，扣非归母净利润表现 好于收入端，主要由于上年同期达仁堂非经常贡献较多 ，影响基数。随着多数公司渠道逐步出清 ，叠加院内政策影响逐步削弱 ，我们看 好中药公司基本面经营逐季改善 。 数据来源：Wind，中信建投表：中药板块增速统计（单季度） 表：中药板块增速统计（累计）2024Y 2025Y 2026Y Q1Q2Q3Q4合计Q1Q2Q3Q4合计Q1Q2 营业收入增速 0.7%-5.2%-3.1%-8.1%-3.8%-8.6%-1.7%-0.7%1.6%-2.7%0.3%-8.4% 归母净利润增速 -4.5%-6.2%-10.3%-76.7%-13.8%-5.9%4.7%-4.4%30.7%-1.2%-2.0%-18.4% 扣非归母净利润增速 -4.0%-1.7%-14.8%-128.5%-17.2%-6.7%-15.6%-8.2%-177.0%-4.8%-0.5%-0.9% 2024Y 2025Y 2026Y Q11HQ1-Q3Q1-Q4Q11HQ1-Q3Q1-Q4Q11H 营业收入增速 0.7%-2.1%-2.4%-3.8%-8.6%-5.4%-4.0%-2.7%0.3%-3.9% 归母净利润增速 -4.5%-5.3%-6.6%-13.8%-5.9%-1.3%-2.1%-1.2%-2.0%-9.6% 扣非归母净利润增速 -4.0%-3.0%-6.0%-17.2%-6.7%-10.6%-10.0%-4.8%-0.5%-0.7% 6下载日志已记录，仅供内部参考 中药：院外库存逐步出清，院内政策影响分化 2026年H1，中药行业平均毛利率为 55.0%，同比略有下行，主要由于品类结构调整 ，后续有望随着成本压力减弱环比有所回升 ，平均 销售费用率、管理费用率、研发费用率、财务费用率分别为 27.5%(-1.4pct)、9.4%(+1.0pct)、4.0%(+0.2pct)、 就【安克创新更新，申菱环境调研，TCL科技更新，泉峰", "content": "华创家电周观点（20260913） #板块涨跌幅：本周上证指数下跌1.1%，家电（申万）指数下跌1.7%，白电板块下跌1.6%，厨电板块下跌1.0%，黑电板块下跌1.7%，小家电板块下跌4.2%，摩托车板块下跌2.6%。 #周度动态更新：本周我们重点就【安克创新更新，申菱环境调研，TCL科技更新，泉峰控股更新】展开讨论。 #本周我们与安克创新进行多地反路演交流。储能Q2增速回落主要是断货与新品切换所致，当前供货已恢复，预计下半年增速表现将明显恢复；小充Q2提速主要是公司大单品策略+PD前置+核心市场份额提升；安防业务降速主要是渠道调整影响，核心市场预计Q3完成切换；存算一体芯片耳机表现良好年化有望过亿美金，后续影音板块增速有望提升。IFA发布MindBase（本地AI agent+AI NAS，实现存/连/算一体，抓手为1700万家庭存量用户）与助听器（大健康首款产品，复用耳机端侧模型与存算一体芯片），同时宣布品牌归一为One Anker。 #本周我们调研申菱环境。#H1液冷订单约18亿元、7/8月订单继续增加约为H1的2-3倍，短期交付压力很大、处于有单不敢接的状态。订单至收入转化目前取决于验收环节，很多海外项目由于验收卡在缺机柜、缺燃机没有验收，整体在手订单收入节奏乐观可能到27H1、也有可能到27Q3。国内市场毛利率有压力，主要受同行竞对投标价格竞争影响、短期看没有缓和迹象。成本端主要受铜价上涨影响，公司直接用铜比例不高、但外购件中接触器、水泵中大量含铜，已签合同无法调价、未签合同重新定价。#欢迎联系我们交流调研细节及纪要。 # Q4面板涨价确定性提升，持续推荐TCL科技。专家口径指向十一月涨价#确定性高，TCL科技公司交流反馈十月可能启动。专家口径：十一月涨1美元、十二月或再涨1—2美元，对应均价1%-2%。三方数据较保守：Omdia预计Q4不涨，集邦最新口径为9月持平、Q4仅提稼动率调控稳价，我们预计实际价格情况大概率好于市场预期。本轮提价靠#供给侧控价，是可持续的价格联盟，26Q4落地、27Q1继续，关注度有望提升。按明年100亿利润、年化业绩30%增速，27年估值仅10倍。 #本周泉峰公告新CEO出任、股价大涨23%。Joseph为创科实业前首席执行官、操盘百亿美金营收品牌Milwaukee，其在专业电动工具经验积累与泉峰的SKIL、FLEX具备较强互补，股价大涨也反应了市场对新CEO为公司带来积极变化的较强预期，经营层面从26H1来看公司半年度收入毛利率新高、处于下游锂电OPE库存需求修复周期，新任CEO催化估值提升、H2业绩若超预期有望形成双击，建议重点关注。#文字观点", "publish_time": "2026-09-13 20:16", "tags": ["文字观点"]}, "post:2026-09-13T23-00:c385af987e09": {"id": "post:2026-09-13T23-00:c385af987e09", "kind": "post", "title": "2026-09-13 23:00", "source_label": "帖子正文", "excerpt": "奥特维：底部再发股权激励，28年10亿业绩目标，当前不到13倍 2026年9月，公司发布2026年限制性股票激励计划，激励对象共计492人，授予合计不超过500万股限制性股票，授予价格为不低于21.66元/股。前次股权激励仍在进行，2025年12月公司发布2025年限制性股票激励计划，向28名激励对", "content": "奥特维：底部再发股权激励，28年10亿业绩目标，当前不到13倍 2026年9月，公司发布2026年限制性股票激励计划，激励对象共计492人，授予合计不超过500万股限制性股票，授予价格为不低于21.66元/股。 前次股权激励仍在进行，2025年12月公司发布2025年限制性股票激励计划，向28名激励对象授予不超过570万股限制性股票，授予价格为22.73元/股。 2025年公司净利润3.73亿元，2026-2028年目标净利润分别为6、7、10亿。两次股权激励业绩考核目标不变，2026-2028年业绩将保持高增长，且本次股权激励范围更大，彰显公司发展信心。 2026H1公司新签订单超过50亿，全年新签订单目标100亿，10%净利率已经可对应10亿净利润；2026年依靠光伏、锂电订单实现20%稳健增长。同时，公司大力发展半导体设备，2026年订单目标4-5亿，2027年继续翻倍增长。 重点关注！#文字观点", "publish_time": "2026-09-13 23:00", "tags": ["文字观 价值量的钒酸钇晶体等）。半导体设备第二增长极。 长芯博创：展出O全链路真机实时演示，当前64*64，FA、光引擎到全光交换机全链路自主设计。 此外，上游插芯侧，唯科科技收购久腾切入稀缺的插芯制造领域。 光纤：海外/国内27年数据中心需求比实际预期更乐观，行业扩产实际进度慢于此前市场预期。保偏光纤为展会热点，指引积极。 中天科技：光棒满产，新增产能27年逐步释放；目前主要通过布线厂切入北美市场，后续有望直接进入P供应链。保偏光纤具备相关供货能力。 某领军：光棒满产，产能主要集中在A1、A2，价格高位稳定，内蒙产能27年逐步释放。海外布线厂等进展积极，保偏光纤具备相关供货能力。 欢迎联系通信团队～ （刘菁菁15021130724/郝知雨/陈力扬/包轩豪/黄俊儒/赵航/林起贤18926086984等）#文字观点", "publish_time": "2026-09-13 15:28", "tags": ["文字观点"]}, "post:2026-09-13T22-11:684ad1596960": {"id": "post:2026-09-13T22-11:684ad1596960", "kind": "post", "title": "2026-09-13 22:11", "source_label": "帖子正文", "excerpt": "NV专家调研 Rubin刚开始小批量出货，如富士康交付给微软和OAI的首批机柜。今年的出货量相对较小，预计约为100万颗芯片，主要的发货量在27年，预计Rubin总出货量将非常大。", "content": "NV专家调研 Rubin刚开始小批量出货，如富士康交付给微软和OAI的首批机柜。今年的出货量相对较小，预计约为100万颗芯片，主要的发货量在27年，预计Rubin总出货量将非常大。 Kyber Nvl144原本想用全铜互联，但正交背板做不出来或性能达不到要求。因此kyber144已经从明年规划中移除，大概率取消了，明年主要产品为NVL72以及扩展形成的NVL576；NVL8这类单机形态仍会继续存在。但是正交背板方案仍在尝试，也许feyman世代可能会继续尝试使用。 ptfe会在明年的nv link7的交换板使用，32层，6.5mm厚。 Ultra最快明年9月或10月量产，与今年Rubin的量产时间相当。主要有nvl72和576版本。新机柜的架构相较于Rubin机柜有所变化，将采用9+9+9的布局：中间的两层交换机将合并为一层。 交换机分为两种版本： • 一种是用于72 GPU配置的不可扩展双芯片版本； • 另一种是用于多柜互联的四芯片可扩展版本。 可扩展版本的机柜会多出许多用于多柜互联的MMC连接器，可以把八个机柜互联实现576 方案，这8个机柜主要使用NPO或CPO互联。这样一来，整个机柜的光互联价值量持续提升。 目前NPO和CPO两种方案预计将并存，但NV一直把CPO优先于NPO，在Scale-out只有可插拔光模块和CPO两种方案，Scale-up只有NPO和CPO两种选择。 Scale-up运维成本极高，Ultra版本单机柜断电1h租金损失至少2000多美元，NPO模组设计为可独立插拔，维修时间较短，而CPO方案维修过程复杂且影响范围大。 NPO/CPO的els（光源模块）国内光模块相关厂商都有参与，份额不好拆。 CPO、NPO渗透率的提高会冲击可插拔光模块，尤其是800G以上的光模块。 综合看，天孚是受益的厂商，中际表现稳健。其他厂商包括xys就不好说了。 不过27年NV体系内1.6T光模块需求在1200万只以上，最快也要到27年下半年才能看到CPO、NPO对光模块的显著影响。 这就是我一直说的：今明两年光模块业绩非常景气，28年以后看不清。 核心原因：CPO渗透率一旦超过30%，NV体系的高端光模块增速会直线下降。其他ASIC方案虽然仍会使用，但整体需求下行。同时scale up、scale in无传统光模块需求，最终导致光通信企业传统光模块业务增速回落。寻找行业“公约数”，是未来光通信投资的关键。 这里插入我了解到的萝卜最近情况。 罗博特科作为英伟达、台积电NPO、CPO核心设备工厂，高度受益。目前萝卜设备不是卖不卖得出去的问题，而是做多少卖多少、供不应求，甚至头部客户给钱也拿不到货。 例如COHR代工厂汇绿生态公开吐槽拿不到设备；COHR与国内头部厂商已全包萝卜耦合设备，框架订单体量极其夸张。 CPO目前综合良率已经超过55%量产最低标准，现有约9K柜体量。 CPO方案采用外置光源（最新版本280毫瓦以上），CW光源目前国外厂商为主。源杰今年5月已进入测试。 博通光芯片、DSP利润丰厚，因此主动推进CPO迭代动力偏弱。另外Marvel的CPO落地进度非常快。 未来Scale-up架构中，光互联用量远超Scale-out数倍。 NPO属于明确过渡路线，生命周期基本锁定在Rubin、Feynman第一代，时间窗口大致到28年底、29年初。 明年NPO光引擎出货预计不足千万，原计划对应约7K机柜NVL72规模，单机柜搭载288颗NPO，后续用量存在上调可能。 目前全球NPO主要应用于Scale-up场景，例如国内超节点项目。 NV的NPO目前三种方案同步赛马： 1. ODM模式：与中际旭创、新易盛合作。核心外部连接器规格锁定富士康、立讯。此模式下，源杰CW为二供，住友为一供。 2. JDM联合研发制造模式：NV深度参与全流程，直接定供应商。 3. NV完全自研方案：自主设计，代工厂代工。 NV的NPO采用内置光源，依托极致液冷能力，光源功耗可控制在150毫瓦以下。 天孚通信在CPO、NPO双线均为电光封装第一供应商，本轮AI光互联升级价值量大幅提升。 除3.2T CPO、1.6T NPO核心无源器件外，同时供应PIC陶瓷基板等关键零部件。 MMC连接器将成为下一代主流互联形态，技术壁垒高： MPO-12体积大、12芯仅8芯有效传输； MMC-16体积更小、16芯全部有效，密度大幅提升。 今年三款Scale-out交换机，两款搭载MMC； 明年所有NPO、CPO的Scale-up交换机全部标配MMC-16。 MMC存在强专利壁垒，NV核心供应商：康宁、US Conec、藤仓、住友。国内厂商多为纯代工，无核心专利。 FAU规格统一：NPO、CPO共用36通道DFAU（可插拔光纤阵列单元），4根保偏+32根单模。 NPO传输距离仅2cm，保偏光纤用量极少； CPO最长传输距离35cm，保偏用量显著更高。 DFAU国内核心供应商为天孚，中际年初已启动自研36通道DFAU。 透镜环节：炬光、苏纳为三四供。 Shufflebox由太辰光代工康宁方案。 LPU产品迭代： 一代LPU面向头部AI超大并发推理实验室，普通低并发场景无刚需，架构偏传统互联。 二代LPU将与Ultra深度协同，搭载NVLink Fusion，可与Rubin、Ultra全系交换机无缝互联。 PCB格局： 交换机卡：胜宏份额最大，沪电、景旺次之； 低端以太网交换机PCB：方正为主。 液冷整体服务器价值量变化不大，行业竞争激烈、定价权在ODM。 NV内部供应商分为三类： 1. NV直采零部件（传统光模块时代） 2. NV定规格、ODM/ASIC厂自选供应商（当前主流模式，如新款光模块） 3. NV给合格清单、ODM自由选型（液冷、电源等，竞争最激烈） 最后：周末A、O大厂表态“放缓节奏”，市场无需当真。优等生不会真停学，优等生家长（头部资本、巨头顶层）更不可能放任追赶者弯道超车。#文字观点", "publish_time": "2026-09-13 22:11", "tags": ["文字观点"]}, "post:2026-09-13T20-14:07b9b5b920d8": {"id": "post:2026-09-13T20-14:07b9b5b920d8", "kind": "post", "title": "2026-09-13 20:14", "source_label": "帖子正文", "excerpt": "【西部计算机】PCB产业链更新本周四晚9点，我们组织了PCB产业链的重磅专家会。我们认为：PCB是目前AI各细分子行业中最好的，展望未来6-9个月，PCB的二阶导还在向上。", "content": "【西部计算机】PCB产业链更新本周四晚9点，我们组织了PCB产业链的重磅专家会。我们认为：PCB是目前AI各细分子行业中最好的，展望未来6-9个月，PCB的二阶导还在向上。上游供给情况：电子布供给仍有不足，影响CCL产能投产。预计26年10月前后，产能投产问题会驱动CCL再次调价，整体涨价趋势持续。CCL扩产情况：CCL扩产核心瓶颈为设备（部分交期一年半）。mSAP供需情况：行业整体扩产幅度为70%-200%。行业整体26Q2出货量是26Q1的2倍，26Q3预计为26Q2的1.5倍，出货量持续攀升。27年光模块领域mSAP需求将在26Q3月均水平基础上再翻倍。 标的：深南电路、景旺电子、生益科技。 更多干货，欢迎联系西部计算机团队：郑宏达 谢忱 李想 王朗#文字观点", "publish_time": "2026-09-13 20:14", "tags": ["文字观点"]}, "post:2026-09-13T11-26:e083c750bdf5": {"id": "post:2026-09-13T11-26:e083c750bdf5", "kind": "post", "title": "2026-09-13 11:26", "source_label": "帖子正文", "excerpt": "“建材建筑新材料”数据库-更新260913 1、沥青开工率：环比+0.8pct至22.2%，同比-5.9% 2、水泥出货率：全国45.7%（环比+2.5pct），华东50.3%（环比+10.3pct） 3、水泥库存：全国环比持平至71.6%，长三角环比+0.5pct至75.9% 4、水泥价格：全国高", "content": "“建材建筑新材料”数据库-更新260913 1、沥青开工率：环比+0.8pct至22.2%，同比-5.9% 2、水泥出货率：全国45.7%（环比+2.5pct），华东50.3%（环比+10.3pct） 3、水泥库存：全国环比持平至71.6%，长三角环比+0.5pct至75.9% 4、水泥价格：全国高标均价314元/吨，同比-30元/吨，环比+2.8元/吨；华东313元/吨，同比-13元/吨，环比+6.4元/吨 5、建筑玻璃：库存6577万重量箱，环比上周-237万重量箱，价格1077.30元/吨，环比+0.7% 6、光伏玻璃：芜湖信义3.2mm镀膜玻璃价格17.25元/平米，环比持平，同比-8.0% 7、玻纤：粗纱价格3732元/吨，环比-0.2%，同比+6.0%；电子布均价11.65元/米，环比持平，同比+181% 8、碳纤维：T300价格71元/kg，环比持平，同比+1.4%，T700价格105元/kg，环比持平，同比持平 9、涂料上游：丙烯酸7950元/吨，环比+3.2%，同比+33.6% 10、防水上游：沥青期货结算价5414元/t，同比+56.5%，环比+8.4% 11、有机硅胶上游：DMC价格14700元/吨，环比+6.5%，同比+32.2%（关联：硅宝、回天等） 12、减水剂上游：环氧乙烷现货价8600元/吨，同比+36.5%，环比+3.6%（关联：苏博特） 13、玻璃上游：轻质纯碱980元/吨，环比+0.6%，同比-15% 14、煤炭：本周秦皇岛港动力煤（Q5500K）730元/吨，环比+10.0%，同比+8.15% 15、天然气：本周广州、成都、嘉兴、天津天然气价格分别为4.41、3.99、4.17、3.56元/立方米，同比分别-1%、+16%、+7%、+13% 来源：Wind、数字水泥、卓创资讯、百川等#文字观点", "publish_time": "2026-09-13 11:26", "tags": ["文字观点"]}, "post:2026-09-13T11-24:d95917d1f8ab": {"id": "post:2026-09-13T11-24:d95917d1f8ab", "kind": "post", "title": "2026-09-13 11:24", "source_label": "帖子正文", "excerpt": "复盘历史，基本面回升但股价偏弱时，后续走势主要受政策和流动性是否持续宽松、经济基本面是否强劲等影响；当前来看，A股短期可能延续震荡筑底趋势，外部紧缩预期落地后可能震荡回升", "content": "复盘历史，基本面回升但股价偏弱时，后续走势主要受政策和流动性是否持续宽松、经济基本面是否强劲等影响；当前来看，A股短期可能延续震荡筑底趋势，外部紧缩预期落地后可能震荡回升；科技成长和部分大金融、消费等行业可能相对占优。供参考！派点请多多支持华金策略！#文字观点", "publish_time": "2026-09-13 11:24", "tags": ["文字观点"]}, "post:2026-09-13T20-15:bd9d52d6d040": {"id": "post:2026-09-13T20-15:bd9d52d6d040", "kind": "post", "title": "2026-09-13 20:15", "source_label": "帖子正文", "excerpt": "David Sacks 科技创始人兼投资人，任职于 Craft Ventures 与 theallinpod。总统科技顾问委员会联合主席。", "content": "David Sacks 科技创始人兼投资人，任职于 Craft Ventures 与 theallinpod。总统科技顾问委员会联合主席。 Dario 曾写道，我们需要 “为前沿设定节奏”，Sam 对此表示赞同。人们可能会对我的回应感到惊讶：请便。 你们就是前沿。以任何合理的标准衡量 —— 市场份额、收入增长、模型能力 —— 你们两家在前沿智能领域形成了双头垄断。你们还声称，由于递归式自我改进，领先优势正在扩大。 我在实验室里看不到你们所看到的东西。如果那些未发布的模型可怕到让你们认为应该放慢脚步，我支持你们做出负责任的这一决定。 但别再假装你们需要别人的许可。别再假装必须暂停反垄断法，好让你们组建卡特尔。别再假装你们需要一个凌驾于产品责任之上的监管审批流程。别再假装 METR 是独立的，而它与 Anthropic 的投资者和员工有着千丝万缕的联系。别再假装你们需要那些同样的评估者去监管甚至都不在前沿的竞争对手。 最重要的是，别再假装放缓的动机是纯粹利他的。如果你们的产品助长了一次真正具有破坏性的网络攻击，你们将面临巨大的产品责任风险。市场已经在惩罚那些行为不可预测或未经授权的模型。在 Hugging Face 事件之后，OpenAI 和 Anthropic 用一些原始能力换取可靠性和可预测性，纯粹是明智的商业选择。你想称之为对齐也行。这也不过是给客户他们想要的东西。 放缓前沿也会为一场比伯尼・桑德斯 “全部关停” 更有智慧的监管对话创造喘息空间。如你所知，中国极不可能加入一项全球协议，这一点也必须纳入考量。 所以，尽管去放缓前沿吧。设定前沿的正是你们。不构建超级智能的最简单办法，就是你们同意不构建它。要求以你们偏好的监管框架作为这样做的代价，看起来就像是对公众和政治体系的勒索。所以，做就是了。 如果你们这么做，就会为下一场对话赢得善意。如果你们不这么做，我们就会知道，这不过是又一次谋求监管俘获的尝试 —— 或者一场选举季的心理战。#文字观点", "publish_time": "2026-09-13 20:15", "tags": ["文字观点"]}, "post:2026-09-13T20-44:3b2732f8446e": {"id": "post:2026-09-13T20-44:3b2732f8446e", "kind": "post", "title": "2026-09-13 20:44", "source_label": "帖子正文", "excerpt": "国海海外宏观和大宗商品组王之凡团队 # 海外宏观大类资产配置20260913: 【cpi点评】8月美国cpi同比3.4%符合预期，核心CPI环比0.3%超预期，推动9月加息预期上行。核心CPI环比的超预期主要来自电信运营商集中涨价和高波动项影响。", "content": "国海海外宏观和大宗商品组王之凡团队 # 海外宏观大类资产配置20260913: 【cpi点评】8月美国cpi同比3.4%符合预期，核心CPI环比0.3%超预期，推动9月加息预期上行。核心CPI环比的超预期主要来自电信运营商集中涨价和高波动项影响。粘性cpi温和，非粘性cpi维持偏强。沃什提到的通胀上涨分项占比变化温和。整体来看，cpi数据超预期彻底打消9月政策不确定性，叠加近期飙升的原油价格，未避免美债收益率失控，9月加息几乎已成定局。但市场本身对加息定价相对充分，2年内加息预期定价近4次。期限利差在数据公布后反而收窄，市场的不确定性消散推动利空出尽交易，美股、黄金有所上涨。 【9月美联储议息会议前瞻】展望fomc，这份cpi数据让9月加息几乎已成定局，但更多博弈落在利率路径上，市场仍需要美联储明确到底是短暂调整还是开启加息周期。从目前cpi数据成分来看，高波动项贡献较大，能源仍然是主要推动，内生性通胀压力有限。从cpi预测来看，主要症结仍然在原油汽油价格，如果美伊局势能有效缓解，能源价格明确下行，则cpi可能走回回落通道。我们对于美联储行动的判断仍然是短暂调整。如果价格高位持续时间继续超出预期，则不排除年内还有再度加息可能。但针对能源价格的加息仍在技术性调整框架内并非加息周期，在能源价格下行后，预期仍然可能快速回摆。 【资产配置】 1️⃣黄金：短期震荡，需等待明确利率路径，但开启大加息周期仍是小概率事件，不排除反复交易利空出尽。原油明确见顶后或再度反弹上行。中长期而言，黄金长期核心逻辑仍然稳定甚至有所加强，长期仍然看好。 2️⃣美债：10Y美债收益率阶段性顶部震荡，但仍然受到油价干扰，如果油价再度大幅上行，则不排除再度推升收益率。短期大幅下行仍然需要油价确定性回落。 3️⃣美元：震荡。加息预期定价相对充分，短期主要受到非美货币走势、原油影响。 4️⃣美股：短期短暂走出利空出尽，主要驱动仍然在ai产业链本身，短期产业链上游确定性仍然更强。 5️⃣原油：低库存下继续维持偏强等待美伊局势明朗，目前特朗普有一定的taco激励，但政治压力仍大。值得注意的是言语taco很难明显缓解原油压力，仍然需要实际行动。 【风险点】原油再度超预期上行，fomc超预期鹰派 ☎详细联系：国海海外宏观&大宗商品组 王之凡，吴悠, 或对口销售。🏁打分派点请打： “王之凡”/钢铁组/钢铁组王之凡/海外宏观王之凡 （根据贵司不同分类）#文字观点", "publish_time": "2026-09-13 20:44", "tags": ["文字观点"]}, "post:2026-09-13T20-11:28f79505ee3c": {"id": "post:2026-09-13T20-11:28f79505ee3c", "kind": "post", "title": "2026-09-13 20:11", "source_label": "帖子正文", "excerpt": "结论： 第一， 重视服务器新增需求。", "content": "汇报-3❗️【天风电新】陶瓷基板再推荐：重视服务器新增需求 - 0913 ——————————— 🌟核心结论： 第一， 重视服务器新增需求。陶瓷基板市场空间27/28年分别为276/707亿元，其中27年光模块占据65%市场空间，但是到28年随着ultra上量，#服务器市场空间超过光模块成为最大看点，市场预期差大，#核心关注【TEC制冷片】、【PCB-陶瓷基板】。 第二， 把目光看向下游金属化方向。根据产业链分工，短期粉体是瓶颈（充分受益于中日对抗），中期看越下游附加值越高。按光模块1.6T计算，粉体20元/颗、白板100元、制品（金属化后）300元。 分结构看，核心细分领域情况如下： ✅【光模块】27年TEC制冷片和陶瓷管壳中陶瓷基板合计占据该领域近80%份额，核心增量来自于1.6T光模块中TEC制冷片中氮化铝渗透率从50%提升100%，陶瓷管壳渗透率从20%提升到50%，往下一代看，3.2TCW光源可能从金属碟式管壳转换为陶瓷管壳，因此28年管壳占比有望提升。 ✅【TEC制冷片】成为28年陶瓷基板市场空间最大的应用领域，其中HBM+CPO交换机28年占比60%+，特别是HBM TEC需求增长明显，从27年到28年翻三倍。 【TEC制冷片】全球最核心玩家大和热磁和phononic，占全球市场空间的60%/35%。光模块核心厂商大和热磁占到zjxc50%份额，xys70%，大和热磁的陶瓷基板供应商为【富乐德】；服务器核心厂商phononic，陶瓷基板供应商【国瓷材料】、【科创新源】。 ✅【PCB-陶瓷基板】为28年增量最快的应用领域，假设28年出货10w ultra，单机柜陶瓷基板价值量不到2k元，对应189亿元市场空间，用于计算板内解决材料热淤积问题。 当前进展较快的厂商为【科翔股份】，陶瓷+HDI均自行生产；【胜宏+泰金新能】当前也积极研发验证中。 🌟投资建议 1、推荐HBM和CPO交换机新增需求中绑定TEC全球龙头的【国瓷材料】（一体化）、【富乐德】（金属化）、【科创新源】（金属化）。 2、推荐PCB-陶瓷基板进展最快的【科翔股份】（白板＋金属化）。 3、光模块中先发优势明显的【中瓷电子】（白板＋金属化）以及新进一体化【旭光电子】（粉体白板金属化一体化）。#文字观点", "publish_time": "2026-09-13 20:11", "tags": ["文字观点"]}, "post:2026-09-13T20-15:d731c1b87f4c": {"id": "post:2026-09-13T20-15:d731c1b87f4c", "kind": "post", "title": "2026-09-13 20:15", "source_label": "帖子正文", "excerpt": "#兴森科技2026年员工持股计划：董秘兼财务总监蒋总认购50万股，按照受让价格19.4元，出资970万 总工程师乔总认购40万股，按照受让价格19.4元，出资776万 考核收入目标", "content": "#兴森科技2026年员工持股计划：董秘兼财务总监蒋总认购50万股，按照受让价格19.4元，出资970万 总工程师乔总认购40万股，按照受让价格19.4元，出资776万 考核收入目标：26-28年分别不低于80亿（+11%）、100亿（+25%）、120亿（+20%）#文字观点", "publish_time": "2026-09-13 20:15", "tags": ["兴森科技2026年员工持股计划", "文字观点"]}, "post:2026-09-13T22-48:bf649929ac01": {"id": "post:2026-09-13T22-48:bf649929ac01", "kind": "post", "title": "2026-09-13 22:48", "source_label": "帖子正文", "excerpt": "#产业观点更新1）模型放缓论，训练不存在放缓，只是发布可能放缓，在原来训练完基模的基础上，额外增加安全部分的训练。", "content": "#产业观点更新1）模型放缓论，训练不存在放缓，只是发布可能放缓，在原来训练完基模的基础上，额外增加安全部分的训练 n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>AI大模型同时出现降本迭代与安全放缓信号：DeepSeek V4.1-Flash发布并降价，9月10日起高峰时段每百万Token未缓存输入/输出价为2/8元；OpenAI披露研究自动化、RSI进展；Anthropic与OpenAI罕见呼吁放缓AI发展并加强监管，马斯克赞同，谷歌、Meta暂未表态。相关资产出现OpenAI、Anthropic跌幅分别达7%和2.8%，并出现“AI股票周一早盘将下跌10%以上”的说法；芯片股短期或承压，但算力基础设施支出仍强，长期影响可能有限。\u003c/li>\n\u003cli>算力硬件景气延续：Rubin开始小批量出货，富士康交付微软和OAI首批机柜，今年约100万颗芯片，主要发货在27年；甲骨文Q1收入、利润均超市场预期，RPO增量均有预付款或客户自带硬件，所有续约GPU算力均已重新售出且价格较此前合同上涨20%；智谱完成约50亿美元融资，算力租赁Q3业绩持续向好。\u003c/li>\n\u003cli>光通信光博会验证高景气：1.6T进入规模上量，NPO/CPO/XPO共封装集中爆发；OCS需求主体从谷歌扩展为全球CSP，TFLN、光芯片变化最多；海外27年800G翻倍以上增长、1.6T数倍增长，28年2.4T有望释放2000万只需求，国内800G明年预计放量到4-5千万只。\u003c/li>\n\u003cli>PCB/材料链重新获验证：上周强弱排序为PCB/铜箔&gt;电子布/高端CCL/硅微粉&gt;MLCC&gt;PTFE/玻璃基板&gt;地产链与建筑工程；电子布供给不足影响CCL产能投产；PCB二线厂业绩改善，本B环节三季度利润拐点，10月重点三季报，优选PCB+MLCC；MLCC现货价格企稳上升，经销商酝酿新一轮涨价。\u003c/li>\n\u003cli>宏观与海外数据：8月美国CPI同比3.4%符合预期，核心CPI环比0.3%超预期，推动9月加息预期上行，核心超预期主要来自电信运营商集中涨价和高波动项；A股短期可能延续震荡筑底，外部紧缩预期落地后可能震荡回升。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型与安全监管\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：DeepSeek V4.1-Flash能力升级同时降价；GPT-6反蒸馏讨论与RSI进展升温；OpenAI安全监控算力开销约为被监控推理算力的20%，安全成为大模型刚性成本；模型放缓论下，训练不存在放缓，只是发布可能放缓，额外增加安全部分训练。\u003c/li>\n\u003cli>今天出现的催化/验证：Anthropic、OpenAI联合呼吁放缓AI发展，马斯克公开赞同；OpenAI今年不会上市；智谱完成约50亿美元融资；甲骨文续约GPU价格上涨20%；算力租赁Q3业绩持续向好。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>光通信/CPO/光博会\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：OCS、TFLN、光芯片变化最多；OCS需求主体从谷歌扩展为全球CSP，生产商涵盖LITE、COHR、旭创、新易盛、光迅、光库、华为等；无源器件价值成倍增长，FAU从8/12通道向32/36/64或更高通道跃升。\u003c/li>\n\u003cli>今天出现的催化/验证：1.6T进入规模上量，NPO/CPO/XPO共封装集中爆发；海外27年800G翻倍以上、1.6T数倍增长，28年2.4T有望释放2000万只需求；国内800G明年预计放量4-5千万只；光模块散热成为重视元年，1.6T以上散热方案显著变化；炬光科技2026年三、四季度目标实现盈亏平衡。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>PCB/CCL/铜箔/MLCC材料链\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：PCB材料链重新获验证；电子布供给仍有不足，影响CCL产能投产；PCB二线厂业绩改善明显，6月开始传导价格、三季度完整体现，更重要是PCB自身格局改善，小厂在26H1基本坚持不下去。\u003c/li>\n\u003cli>今天出现的催化/验证：10月重点三季报，优选PCB+MLCC作为先锋；MLCC现货价格企稳上升，7-8月连续下滑后本周上半周略企稳、周五小幅上涨，经销商酝酿新一轮涨价；陶瓷基板27/28年市场空间276/707亿元，28年服务器市场空间超过光模块；钽电容Rubin Ultra单机柜用量是Rubin的3倍，均价预计提升到7元/颗。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体/先进封装/内存\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：智能体AI约束正转向HBM、DRAM、NAND与数据互连构成的内存层级；树脂等大宗商品虽涨价，但BOM占比远小于内存且涨幅更缓。\u003c/li>\n\u003cli>今天出现的催化/验证：美光披露HBM4量产送样；三星电机在KPCA Show 2026展示玻璃芯封装基板及完整TGV路线，进一步验证玻璃基板在高密度封装中的技术方向。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>新能源/汽车/家电\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：新能源车中游2Q26业绩反转趋势延续、业绩加速兑现，下游新能源车需求结构性增长支撑电池需求，电池格局整体稳固；储能Q2增速回落主要是断货与新品切换所致，当前供货已恢复，预计下半年增速明显恢复。\u003c/li>\n\u003cli>今天出现的催化/验证：泉峰公告新CEO出任、股价大涨23%，2026年依靠光伏、锂电订单实现20%稳健增长，半导体设备2026年订单目标4-5亿、2027年继续翻倍；奥特维发布2026年限制性股票激励计划，28年10亿业绩目标，当前不到13倍。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观/策略与海外流动性\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：复盘历史，基本面回升但股价偏弱时，后续走势主要受政策和流动性是否持续宽松、经济基本面是否强劲等影响；当前A股短期可能延续震荡筑底，外部紧缩预期落地后可能震荡回升。\u003c/li>\n\u003cli>今天出现的催化/验证：8月美国CPI同比3.4%符合预期，核心CPI环比0.3%超预期，9月加息预期上行；AI高管呼吁放缓技术发展短期可能对芯片制造商及供应链股票造成压力；国常会提出进一步完善算力基础设施，加强算力资源监测调度和骨干光纤网络建设。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>DeepSeek V4.1-Flash发布，9月10日起高峰时段每百万Token未缓存输入/输出价为2/8元，能力升级同时降价。\u003c/li>\n\u003cli>Anthropic CEO发布长篇博文，提出引入第三方评估机构等安全措施，呼吁行业支持更广泛放缓AI模型发展；OpenAI CEO表示将采纳“赋予独立评估机构类似员工访问权限”建议。\u003c/li>\n\u003cli>OpenAI称今年不会上市，仍有大量安全工作需要完成；Anthropic、OpenAI与马斯克罕见达成“放缓AI开发”共识，谷歌、Meta暂未表态。\u003c/li>\n\u003cli>OpenAI披露研究自动化进展，称“自动化研究实习生”已可在人类指导下完成原需研究员数日的限定任务，原定26年秋季目标达成；RSI或为模型下一步发展路径。\u003c/li>\n\u003cli>甲骨文Q1财报收入、利润均超市场预期，RPO增量均有预付款或客户自带硬件；所有续约GPU算力均已重新售出，价格较此前合同上涨20%，大部分相关设备已使用4年以上。\u003c/li>\n\u003cli>Rubin刚开始小批量出货，富士康交付给微软和OAI首批机柜；今年出货量相对较小，预计约100万颗芯片，主要发货量在27年，预计Rubin总出货量将非常大。\u003c/li>\n\u003cli>光博会复盘显示，OCS、TFLN、光芯片三大新变化；1.6T进入规模上量；NPO/CPO/XPO共封装集中爆发；海外27年800G翻倍以上增长、1.6T数倍增长，28年2.4T有望释放2000万只需求，国内800G明年预计快速放量到4-5千万只。\u003c/li>\n\u003cli>光模块散热成为模块厂重视的元年，以1.6T方案为分界线，1.6T以上产品散热方案相比现在会有显著变化，关注中石科技、东阳光、苏州天脉；国产DSP电芯片、TIA&amp;Driver在NPO方案下国产化加速。\u003c/li>\n\u003cli>PCB材料链重新获验证，上周建筑、建材、新材料、海外新材料平均涨跌幅分别为-1.5%、+0.1%、+0.2%、-0.1%；强弱排序为PCB/铜箔&gt;电子布/高端CCL/硅微粉&gt;MLCC&gt;PTFE/玻璃基板&gt;地产链与建筑工程。\u003c/li>\n\u003cli>MLCC现货价格企稳上升，Q3板块性业绩高增；此前现货持续跌价，7-8月连续下滑，至本周上半周略有企稳，周五小幅上涨，被视为拐点信号，经销商酝酿新一轮涨价。\u003c/li>\n\u003cli>陶瓷基板再推荐，重视服务器新增需求：27/28年市场空间276/707亿元，27年光模块占据65%市场空间，28年随着ultra上量，服务器市场空间超过光模块成为最大看点，核心关注TEC制冷片、PCB-陶瓷基。\u003c/li>\n\u003cli>钽电容：下一代Rubin Ultra单机柜钽电容用量是这一代Rubin的3倍，均价预计进一步提升到7元/颗；聚合物在钽电容整体中占比今年预计80%，高端聚合物钽电容价格范围从三块到十几块，普通二氧化锰产品只要五毛到一块五。\u003c/li>\n\u003cli>AI电源调研反馈：芯片端主要供应商为伟创力绑定瑞萨、台达绑定英飞凌、MPS自研芯片并配套自有模块，合计五大核心玩家；第二供应商ADI、TI自研芯片，TI 3D电源产品规模远小于MPS。\u003c/li>\n\u003cli>中富电路：NV现有分离式电源方案用到mSAP载板，公司mSAP载板样品线目前打样阶段，产能预计2026年年底开出、叠加认证周期，最早2027年一季度供货；传统主业2026年+15%-20%。\u003c/li>\n\u003cli>兴森科技2026年员工持股计划：董秘兼财务总监蒋总认购50万股，按照受让价格19.4元，出资970万；总工程师乔总认购40万股，按照受让价格19.4元，出资776万；并披露考核收入目标。\u003c/li>\n\u003cli>炬光科技投资者开放日，董事长、董秘、光通信负责人、消费电子负责人和泛半导体负责人分别演讲并与投资者交流，其中针对光通信板块更新信息较多；指引更清晰，公司2026年三四季度的目标是实现盈亏平衡。\u003c/li>\n\u003cli>算力租赁板块性利好频发：甲骨文Q1财报收入、利润超预期，RPO增量均有预付款或客户自带硬件；智谱于9月13日发布港股公告，确认完成约50亿美元融资，其中以714港元/股配售新股募资。\u003c/li>\n\u003cli>恺英网络拟间接参股韩国Wemade：全资子公司上海恺英与上海星巨达拟先对上海融探增资21亿元，然后通过全资香港子公司赛布利斯香港收购Nexpulse持有的Neosphere 49%股权并对其增资。\u003c/li>\n\u003cli>家电周观点：本周上证指数下跌1.1%，家电（申万）指数下跌1.7%，白电跌1.6%，厨电跌1.0%，黑电跌1.7%，小家电跌4.2%，摩托车跌2.6%；重点讨论安克创新更新、申菱环境调研、TCL科技更新、泉峰控股更新。\u003c/li>\n\u003cli>泉峰公告新CEO出任、股价大涨23%；2026年依靠光伏、锂电订单实现20%稳健增长，同时大力发展半导体设备，2026年订单目标4-5亿，2027年继续翻倍。\u003c/li>\n\u003cli>奥特维2026年9月发布2026年限制性股票激励计划，激励对象492人，授予合计不超过500万股限制性股票，授予价格不低于21.66元/股；前次2025年12月发布2025年限制性股票激励计划，28年10亿业绩目标，当前不到13倍。\u003c/li>\n\u003cli>建材数据库更新：沥青开工率环比+0.8pct至22.2%，同比-5.9%；水泥出货率全国45.7%（环比+2.5pct），华东50.3%（环比+10.3pct）；水泥库存全国环比持平至71.6%，长三角环比+0.5pct至75.9%；水泥价格全国高标均价314元/吨，同比-30元/吨，环比+2.8元/吨。\u003c/li>\n\u003cli>建材周度：全国水泥价格指数322元/吨，环比上涨1.84%，同比下跌4.9%；全国七大区域共17个省份集中涨价，煤炭成本上涨系本轮涨价主要推手，其次为错峰停窑力度加大和需求边际改善；电子纱和高端布涨价斜率扩大。\u003c/li>\n\u003cli>商业航天：工信部近日印发《信息通信行业发展“十五五”规划》，明确打造天地一体空间网络，升级低轨卫星互联网、推广手机直连卫星、发展机载通信；重点攻关6G核心技术、适时启动6G商用，布局鸿蒙终端及新型通信设备研发。\u003c/
