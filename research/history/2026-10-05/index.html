post:2026-10-05T19-31:da3cb595bd40": {"id": "post:2026-10-05T19-31:da3cb595bd40", "kind": "post", "title": "2026-10-05 19:31", "source_label": "帖子正文", "excerpt": "我听说一些测试和测量设备，甚至一些激光器和功率计的交货期长达一年。需求如此巨大。", "content": "", "publish_time": "2026-10-05 19:31", "tags": []}}, "source_details": {"post:2026-10-05T11-23:64ee6181372c": {"id": "post:2026-10-05T11-23:64ee6181372c", "kind": "post", "title": "2026-10-05 11:23", "source_label": "帖子正文", "excerpt": "关于 gemini 4 的分析 1、Gemini 4 Argon 发布，但还只是纸面实力：9 月 30 日发布，距上次大改款近一年，打破 “谷歌只做 Flash 小模型” 的猜疑；单次输出上限拉到100 万 token，18 项基准 12 项领先（Harvey 法律、DeepSWE、Zapier 自", "content": "关于 gemini 4 的分析 1、Gemini 4 Argon 发布，但还只是纸面实力：9 月 30 日发布，距上次大改款近一年，打破 “谷歌只做 Flash 小模型” 的猜疑；单次输出上限拉到100 万 token，18 项基准 12 项领先（Harvey 法律、DeepSWE、Zapier 自动化等大幅甩开 GPT-6 Astra 和 Opus 5.5），内部已有量子计算优化 + 40%、释放 300TiB + 内存、80 万行 C/C++ 转 Rust 等落地案例。 但目前仅 Fairwind 受控计划可用（大公司、安全机构、政府），公众无法上手，缺少与竞对同场景的直接对比，市场还无法真正定价其性能。 2、定价激进、体感在线，但目标是 “喘气” 不是抢份额：入门价 $2/$10（每百万 token），入门期后涨回 $4/$20 与 Claude 持平、远低于 GPT-6 Astra 的 $10/$50。 专家侧每天近 10 万次 elo 对战显示体感优于 Opus 5.5 和 Fable 5.1 Max，GA 预计很快。 但 C 端有 OpenAI、B 端有 Anthropic，抢份额概率低 —— 谷歌真正的差异点是算力到服务自闭环带来的稳定性，此次发布的核心意义是稳住内外信心、为技术转型赢得追赶窗口，是一场豪赌。 3、全行业 C 端订阅都在涨价 / 缩配额，算力是硬约束：OpenAI 200 美元套餐用户月消耗 token 价值曾达 4000 + 美元，严重亏损，重开后配额减半并新开 500 美元套餐；Anthropic、Gemini 同步收紧（免费用户降级到 light），只有 Meta 还给免费额度所以增长最快。 B 端只有金融 / 法律愿意追 SoTA，其他行业升级意愿下降。 GCP 算力租赁涨价要等 TPU v8 年底大规模上量后落地，主要冲击 on-demand 客户；广告、电商闭环等新功能全球推广也都卡在算力上。 4、产品格局与产业链信号：C 端增长主力是 Muse（免费 + Meta 生态流量），Grok Bot/Dots/Spark 实际都是小 B 场景（客服、营销邮件、Google workspace 自动化），小 B 付费意愿强于纯 C；Shopify 是 Agent 电商最激进玩家，闭环交易已跑通、瞄准年底购物季。 两个值得跟踪的结构性趋势：一是 Muse/Dots 类 AI 硬件单人需 7-9 vCPU +8-10G DRAM，若全球铺开将显著拉动云端 CPU/DRAM 需求；二是 Agent 已深度进入模型训练环节（写 kernel、提 MFU、合成数据、自动调 reward model），且辅助 agent 用 Flash 级模型即可 —— 训练提效对 SoTA 推理量的依赖在下降。#文字观点", "publish_time": "2026-10-05 11:23", "tags": ["文字观点"]}, "post:2026-10-05T11-23:001c0454b978": {"id": "post:2026-10-05T11-23:001c0454b978", "kind": "post", "title": "2026-10-05 11:23", "source_label": "帖子正文", "excerpt": "独家新闻：强大的开源模型将撼动 AI 竞赛格局 一家备受关注、由 Nvidia 支持的初创公司 Reflection 正准备通过一套强大的开源权重系统来撼动 AI 竞赛，这可能会同时威胁到中国的初创公司和美国的 AI 巨头。重要原因：美国开源权重模型与 Nvidia GPU 的结合，将为个人和公司提", "content": "独家新闻：强大的开源模型将撼动 AI 竞赛格局 一家备受关注、由 Nvidia 支持的初创公司 Reflection 正准备通过一套强大的开源权重系统来撼动 AI 竞赛，这可能会同时威胁到中国的初创公司和美国的 AI 巨头。 重要原因：美国开源权重模型与 Nvidia GPU 的结合，将为个人和公司提供一个替代 Anthropic、OpenAI 和 Google 的更廉价的新选择。 旨在与中国对手竞争的开源模型，比所谓的 “三大巨头” 前沿模型更难监管和规范。此类生态系统的支持者表示，其广泛的可用性和透明度也带来了安全优势。 消息人士告诉 Axios，Reflection 的首个模型预计将于本月与来自其他西方厂商的开源权重模型一同发布。这将为 AI 热潮带来全新的竞争维度。 现状：Reflection 即将发布的模型预计初期会落后于美国最尖端的模型，但将具备与中国顶尖开源权重模型竞争的实力。 消息人士告诉 Axios，该模型仍将拥有强大的智能水平，足以帮助公司构建自有的、低成本的人工智能系统。 在特定情况下，将较低层级的开源模型与高质量的公司数据相结合，可以产生足以媲美最昂贵的前沿人工智能系统的效果。 Reflection 的发言人拒绝置评。 大局观：权重开放模型（其中最强大的模型几乎清一色由中国制造）席卷了硅谷。 与 Claude 和 ChatGPT 等封闭模型不同，像 Reflection 这样的权重开放模型通常可以免费下载，并且任何人都可以使用和定制。 在提供多种模型的平台上，它们的合计市场份额有时会激增，占据大部分使用量。 然而，AI 高管和分析师表示，在支出高得多的公司级应用领域（通常通过 API 和公司计费处理），权重开放模型仅占使用量的一小部分。 深入分析：Reflection 的最终目标是开创AI 工厂—— 这是一款允许机构建立属于自己的本地化 AI 生态系统的产品。 例如，一家公司可以利用其专有的数据，通过 Reflection 的模型并确保自身的计算算力，来构建一个高度定制化且低成本的 AI 系统。 一些机构，尤其是对冲基金和贸易公司，已经迫切希望利用其严密保护的私有数据来构建专有的 AI 系统。 这家初创公司已经开始测试这一概念，并宣布与韩国新世界集团（Shinsegae Group）达成主权 AI 工厂合作伙伴关系。 幕后消息：据 Axios 消息人士透露，为了筹备发布，Reflection 在最近几周与华盛顿及其他地区的利益相关方进行了讨论，详细介绍了其模型的发布计划，并解释了 AI 工厂的运作机制。 该公司还在积极锁定扩展所需的算力资源。最近几周，这家初创公司与 Nebius 和 SpaceX 签署了巨额协议，租用 Nvidia AI 服务器。 各方观点：Reflection 首席执行官 Misha Laskin 表示，让模型达到最先进的能力水平尚需时日。 Laskin 曾在谷歌任职，他告诉 CNBC，它们有点像火箭船，建造一艘大型火箭船是需要时间的。 Nvidia 因素：多年来，AI 工厂一直是 Nvidia 首席执行官黄仁勋的核心愿景，该方案将计算硬件与开源模型相结合，允许公司保留其数据的所有权。 西方商业和政府领域的顶级 AI 用户（如银行或五角大楼）出于安全风险，对使用高性能的中国模型犹豫不决，Reflection 和其他西方参与者正试图填补这一空白。 多年来《华尔街日报》和《The Information》报道称，黄仁勋一直大力支持 Reflection 致力于构建顶级开放 AI 系统的举措。 Reflection 的发布，以及该初创公司与 Nvidia 的紧密联系，将使人们重新关注开源权重模型，并与其他即将推出的产品一同撼动 AI 竞赛的格局。#文字观点", "publish_time": "2026-10-05 11:23", "tags": ["文字观点"]}, "post:2026-10-05T09-06:0fd237ea1130": {"id": "post:2026-10-05T09-06:0fd237ea1130", "kind": "post", "title": "2026-10-05 09:06", "source_label": "帖子正文", "excerpt": "谷歌：Gemini 4 Argon 能否让谷歌重振雄风？周三，谷歌发布全新前沿模型 Gemini 4 Argon。", "content": "谷歌：Gemini 4 Argon 能否让谷歌重振雄风？ 周三，谷歌发布全新前沿模型 Gemini 4 Argon。该模型在复杂工作流、网络防御以及软件工程领域展现出前沿水准。 根据 DeepMind 提供的基准测试数据，在大量用例与工作流场景下，Argon 对比 GPT‑6 Astra、Claude Fable 5.1 以及 Claude Opus 5.5 表现不俗。 尽管该模型已经在谷歌内部大规模投入使用，但目前公司仅通过预发布模型访问自愿流程，向一批受信任的网络防御人员以及美国政府开放。 值得注意的是，Argon 单次回复的输出 token 上限达到行业领先的 100 万 token，对比之下，其他主流模型的该项数值普遍为 12.8 万 token。 Arena AI 的数据表明，Argon 的单任务价格显著低于 GPT‑6.1 Sol 与 Claude Opus 5.5，使 Argon 处在帕累托最优前沿。 我们注意到，彭博社昨日报道，部分谷歌内部员工对 Argon 的实际落地性能存在质疑，但我们预计模型会快速迭代更新，包括推出新版本，桑达尔此前也曾表示，后续版本几乎会保持月度更新节奏。 我们认为，谷歌重新站在行业前沿、树立 AI 行业龙头地位，对行业本身以及投资者而言都至关重要；同时 Gemini 4 还需要赋能谷歌搜索、云业务、Gemini 等一众谷歌旗下产品，并且作为智能代理等新产品的底层基座。 过去数月，Alphabet 持续消耗资金，股价累计下跌 18%。 核心影响因素包含：谷歌在前沿 AI 赛道掉队、产品迭代节奏相较竞品更慢且声量更低、下半年搜索业务面临更严苛的同比基数压力以及利润率承压。 市场重点关注 AI 基础设施的大规模建设，公司给出 2026 年资本开支指引为 1950‑2050 亿美元，我们预测 2027 年资本开支将提升 85%，达到 3780 亿美元，这大概率会导致谷歌明年自由现金流转为大额负数，我们测算亏损规模可达 1150 亿美元。 但我们相信谷歌 AI 投入终将兑现回报，第二季度搜索业务同比增长 17%，云业务同比增长 82%。 Gemini 4 Argon 能否重振谷歌雄风？ 现阶段尚处于早期，但 Gemini 4 Argon 的初始基准测试结果与性价比表现令我们感到鼓舞，我们预计伴随更广泛的版本发布以及更频繁的迭代优化，该模型性能还会进一步提升。 我们依旧认为，谷歌手握实现 AI 领域领跑的全部关键要素，包含自研芯片、重返前沿梯队的大模型、云业务的强劲增长势能、数据储备，还有产品分发能力，公司拥有 5 款月活超 30 亿用户、14 款月活超 10 亿用户的产品。 我们维持增持评级，2027 年 12 月目标价 420 美元，该目标价基于我们测算的 2028 年公认会计准则每股收益 16.66 美元，给予 25 倍估值。 谷歌当下的困境 前沿模型可持续竞争能力存疑。我们认为投资者一直担忧谷歌的前沿赛道竞争实力，近几个月，新版模型的发布节奏以及市场感知到的模型质量均落后同行。 谷歌 DeepMind 出现 AI 人才流失与管理层变动，进一步放大上述担忧；同时，谷歌的算力需求覆盖云业务、内部产品、持续的模型训练多方面，对比专注 AI 赛道的同行，算力分配与优先级排布复杂度更高，市场就此也产生诸多讨论。 我们认为 Gemini 4 Argon 的发布可以缓解该类担忧，该模型多项基准测试处于行业前沿，同时实现智能能力与成本的帕累托最优。 但需要说明，Argon 目前仅面向首批测试群体开放；投资者会持续关注模型更新迭代节奏，以及模型在真实场景当中的实际表现。 产品发布声势不足。谷歌生态内持续落地大量 AI 产品、功能以及优化升级。 今年代表性动作包含：在 Gemini 与搜索上线个人智能功能、推出图像、视频、音乐多模态模型、发布 Gemini Spark，同时持续为搜索、Gmail 与办公套件、地图、YouTube 以及其他核心产品扩充 AI 能力。 但谷歌难以把充足的产品迭代速度转化为有影响力的发布活动，无法充分获取消费者关注度，难以持续塑造市场对于自身 AI 龙头地位的正面认知。 下半年经营环境承压，同时市场担忧智能代理带来业务颠覆风险。二季度财报披露后，投资者关注到，2026 下半年搜索业务的同比对比基数将抬升 5 个百分点，经营环境难度加大。 与此同时，第三方算力租赁、折旧、数据中心运营成本、AI 和云业务人员招聘、AI 产品营销，外加 Wiz 收购案，都将对利润表形成压力，市场担忧下半年经营利润率。 更本质的一点，近期 Muse、Grok Bot、Instinct 这类面向消费者的智能代理产品热度走高，再次引发市场讨论搜索业务被颠覆的风险。 截至目前，AI 实际上拓展了搜索业务的市场空间，但消费者对于智能代理的使用尚处在非常早期；倘若代理逐步替用户处理交易，尤其覆盖零售、旅行等高价值垂直领域，则会带来实质业务风险。 推动公司改善的核心驱动要素 Gemini 4。Gemini 4 Argon 初步基准测试结果亮眼，有望帮助谷歌重回前沿阵营。需要重点说明，Argon 还只是 Gemini 4 的早期版本。 谷歌 DeepMind 新任主管 Koray Kavukcuoglu 在 9 月 24 日表示，公司会尽快推出早期版本；我们预计随着完整 Gemini 4 产品家族陆续发布，性能还会持续优化。 Argon 尚未深度接入谷歌各个核心业务界面，若深度集成到搜索、云、Gemini、智能代理相关产品，会夯实基本面表现。 月度模型迭代节奏。谷歌已经实现大致按月更新模型，但该更新节奏面向轻量化的 Flash 版本，并非对代码、智能代理业务更关键的 Pro 版本。 近期发布版本包括：9 月 2 日的 Gemini 3.8 Flash 与 Flash Cyber；9 月 15 日面向实时对话场景的 Gemini 3.8 Live 与 Live 深度思考版本；9 月 23 日面向高吞吐、表现力语音场景的 Gemini 3.8 Flash 语音合成以及轻量化语音合成版本；9 月 24 日搭载虚拟形象的 Gemini Live。 我们认为 Flash 及其衍生版本持续更新，可以填补前沿大模型两次发布之间的产品迭代空白；而 Gemini 4 Argon 的推出，是谷歌加快更大规模、更高智能水平模型迭代的第一步，这也是投资者重点关注方向。 我们注意到，二季度业绩沟通会上管理层提到，在搭建 Gemini 4 并且持续迭代的路线图当中，实现近乎月度的模型发布是规划的一部分。 面向消费者与企业端的智能代理产品。Muse、Grok Bot、Instinct 拉高端到端 “完成实际工作” 产品体验的行业标准，智能代理赛道竞争加剧。 谷歌对应的产品包含 Gemini Spark、Antigravity、搜索 AI 模式 / 搜索智能代理，以及云业务板块的 Gemini 企业版。 已经有实际使用数据作为佐证：Gemini 应用月活用户突破 10 亿；Antigravity 二季度周活约 240 万；Gemini 企业版付费月活一季度环比提升 40%。 但对比同行，谷歌产品依旧缺少 “惊艳感”。我们相信谷歌具备人才、技术能力与算力储备，但智能代理产品需要实现跨越式升级，做到用户必需使用，而不仅仅是可供选择。 搜索业务增长。搜索以及其他广告是公司规模最大的收入来源，也是最核心的利润贡献板块；一季度同比增长 19%，二季度同比增长 17%，收入规模 633 亿美元，AI 模式月活已经突破 10 亿。 管理层在二季度电话会提到，下半年同比基数难度提升。即便如此，想要反驳市场当中搜索业务增长下行的论调，三季度需要实现稳健的 15% 以上增速。我们测算三季度报告口径增速 14%，四季度 13%。 我们依旧认为 AI 会扩大搜索业务的市场空间，但搜索业务自身同样需要迭代，才能够和智能代理平台展开竞争。 云业务的增长与待交付订单。云业务是基本面支撑最确定的板块，二季度云业务同比增速 82%，收入 248 亿美元；二季度待交付订单环比增加 520 亿美元，来到 5140 亿美元，其中略超半数会在未来 24 个月转化为收入。 我们期待三季度需求持续高于供给、待交付订单顺利转化而不是单纯累积，同时第三方过渡算力成本维持管理层所说的 “适度水平”。 我们预测云业务增速继续抬升，三季度报告口径同比 88%，四季度 90%。 TPU 加速器硬件。二季度开始确认相关收入，已经向首批客户的数据中心完成交付。2026 年现有订单贡献收入占比有限，但年末开始放量，绝大部分收入将落在 2027 年。 即便没有单独披露 TPU 业务板块，硬件业务带来增量收入，也会验证全栈自研芯片的底层基础。 我们预测 TPU 确认的总营收，2026 年介于 40‑70 亿美元区间，2027 年超过 300 亿美元。#文字观点", "publish_time": "2026-10-05 09:06", "tags": ["文字观点"]}, "attachment:files/液冷产业链梳理.docx": {"id": "attachment:files/液冷产业链梳理.docx", "kind": "attachment", "title": "液冷产业链梳理", "source_label": "其他", "excerpt": "一、全文总结 1. 总体判断与产业趋势 整体比较看好液冷明年的产业趋势，核心催化在于英伟达 Rubin 平台的放量，明年有望出现较大的出货增长。除总量扩张外，后续部分环节可能出现供不应求，同时存在国产化替代机会，产业链整体的价值量还有进一步抬升的空间。", "content": "一、全文总结 1. 总体判断与产业趋势 整体比较看好液冷明年的产业趋势，核心催化在于英伟达 Rubin 平台的放量，明年有望出现较大的出货增长。除总量扩张外，后续部分环节可能出现供不应求，同时存在国产化替代机会，产业链整体的价值量还有进一步抬升的空间。 2. 市场空间测算（按芯片平台与客户拆分） 按 CDU＋冷板＋一次侧冷板三个部分自下而上拆解：Rubin 机柜今年对应市场空间约六七十亿元；GB200/GB300 出货量较大，约 6.7 万—7 万台机柜，对应约 450 亿—480 亿元；LPU 出货量约 4000—5000 台机柜，对应 50 亿—60 亿元；AMD 约 50 亿—70 亿元。加总后英伟达链条需求约 550 亿—600 亿元（其中 GB200/GB300 接近 300 亿元，再加上 LPU）；谷歌需求约 300 亿—350 亿元；海外整体需求约 1000 亿—1200 亿元。国内市场需求约为海外的八分之一，对应 100 亿—200 亿元，增量主要来自英伟达与谷歌。 3. 冷板环节：格局、壁垒与供需 NV 目前的冷板产能主要给到 Cooler Master 和 AVC 两家，供给非常紧缺，尚未导入新的冷板供应商，但已具备标准化产线，技术工艺壁垒很强。壁垒主要体现在产品精度需要从 0.1 做到 1.0，同时要保证焊接后长期不漏液。二线厂商包括双鸿、高力。冷板供应商以 AVC、双鸿、富士康等台系散热代工厂为主，另有新莱应材、同飞股份等。 4. CDU 环节：构成、紧缺与供应商 CDU 主要由水泵和板式换热器构成，同样是紧缺环节，相关代工厂交期很长、产能紧张。相关厂商均在 NV 的供应商名单中，NV 直接采购的范围较窄。谷歌的 CDU 主要供应商为 Boyd、Cooler Master 和 Nidec；预计主要供应商还包括赛铁、丹佛斯和 nVent。CDU 是整个液冷系统的\"心脏\"和智能控制中心，负责精确控制冷却液的温度、流量和压力。 5. Manifold 与 UQD 等环节 Manifold 方面主要包括 Cooler Master、Nidec、Boyd、台达电子等，以及金发科技等厂商，其余明确的还有海鸥股份、冰轮环境和申菱环境。UQD 快接头由公头、母头配合，内置密封件与进出口导向槽，是实现机柜内部液体与服务器之间不漏液快速连接的关键部件。Manifold 是机柜内核心的流量分配部件，负责将冷却液分配至各分支、进入微通道冷板带走热量。 6. 国内服务器液冷供应格局 国内方面，曙光数创主要对应中科曙光；阿里对应合一、英维克；华为对应超聚变和联想；CDU 液冷厂商包括双鸿等。目前进入 NV 白名单的大陆厂商还比较少，英维克及比亚迪电子已进入白名单。预计液冷 CDU 的采购主要执行供应商白名单制，服务器厂商只能在白名单内选择，一次侧供应商暂时还不在 NV 的白名单内。 7. 价值量与单价拆分（以 Rubin 机柜为例） 冷板直接负责芯片的热量传导与分配，价值量占比较高；CDU 内部高度集成流量分配、板式换热器、溶液泵组、阀门控制系统等部件。Rubin 机柜中，冷板单价约 1000 美金，一块冷板对应 2 个 GPU 和 1 个 CPU；Switch tray 也有冷板使用，但用量面积非常小。Manifold 单价约 800 美金，单机柜约 18 套，合计约 1.4 万美金；UQD 单价约 30 美金，整机约 200—300 对，合计约 6000—9000 美金。 8. CDU 的产品分类、价格与盈利 CDU 按部署方式可分为机架级、列间级、室外多联式/集中式、机柜内置型等。液冷 CDU 与风冷 CDU 的配比有 1:2、2:1、1:1 等方案，1:1 对应 CDU 功率一般为 120—150kW。价格方面，单瓦约 1 元/瓦，国内价格目前约 0.3 元/瓦，整体取决于客户选型需求；海外毛利率可达 40%。成本结构中换热器占比 20%—25%，水泵、控制系统、阀门等环节需要落地国内供应商（如高力，主要做板式换热器）。CDU 的核心难点在于系统设计与软件控制系统。一线品牌交期已达 4—6 个月。机架级 CDU 单机功率约 28kW，4U 高度、19 英寸标准宽度，多用于小型数据中心和边缘场景；列间级功率约 80—300kW，兼顾密度与数据中心适配；室外多联式和集中式功率可达 300kW—3MW，支持多机柜共用，适配 2N 冗余配置，是 Rubin 平台的努力方向；机柜内置型功率约 5—150kW，直接集成在机柜内，有利于提升部署密度、减少改造。 9. 重点更新：申菱环境 数据中心液冷业务去年启动，五月底开始爆单；今年数据中心液冷全年业务收入约 8 亿—10 亿元，明年有希望做到二三十亿元的液冷收入。产品主要做冷板、CDU 和管网，其中一次侧主要做干冷器，二次侧做 CDU；二次侧占整个产业链价值量的比重较高（约 77%），金额取决于机柜密度。目前二次侧产品处于开发、生产和订单阶段，客户包括超聚变、宝德等。公司定位上不直接对接终端客户，主要先给干冷器厂商等供货，海外客户如 Vertiv 等。整体看，公司明年液冷收入有希望做到 3 亿、5 亿元甚至更高的量级。 10. 需注意的口径问题 原文为语音转写稿，部分数字、厂商名称与年份存在转写误差（如年份、个别占比数据和厂商名），整理时已尽量按语境还原，对无法确认之处保留了原始数字并标注\"原文如此\"。 二、通顺化整理后的全文 说明：以下在保留全部信息点与数据口径的前提下仅做语句通顺化处理，并已隐去发言人身份相关表述；个别转写不清、无法确认的片段标注\"原文如此\"。 各位好，今天再更新一下液冷产业链的整体观点。 一、市场空间 市场空间方面，我们按 CDU、冷板以及一次侧冷板进行拆解。首先，Rubin 机柜（原文标注为 2020 年）出货量较大，今年的市场空间大概在六七十亿元；GB200 和 GB300 出货量较大，约 6.7 万到 7 万台机柜，对应市场空间大约 450 亿到 480 亿元。LPU（原文标注为 2021 年）出货量大概 4000 到 5000 台机柜，对应 50 亿到 60 亿元的市场。其次是 AMD，AMD 大概对应 50 亿到 70 亿元。整体需求大概在 550 亿到 600 亿元，其中包括 GB200、GB300 接近 300 亿元，再加上 LPU。其次是谷歌，谷歌的需求大概在 300 亿到 350 亿元。整体来看，海外市场的需求大概在 1000 亿到 1200 亿元。国内市场需求约为海外的八分之一，大概对应 100 亿到 200 亿元的需求，市场增量主要来自英伟达和谷歌。 二、冷板环节 目前冷板方面，NV 的产能主要给到 Cooler Master 和 AVC 两家，供给非常紧缺，目前还没有导入新的冷板供应商，但已经具备标准化的产线，技术工艺有很强的壁垒。这一块主要的壁垒在于，产品精度需要从 0.1 做到 1.0，同时要保证焊接之后长期不漏液。目前二线厂商包括双鸿和高力。 三、CDU 与一次侧 CDU 主要由水泵和板式换热器构成，这一环节也比较紧缺。由于板式换热器的代工厂产能有限、交期很长（原文为\"一年交期 630\"），目前非常紧缺。这两家都在 NV 的供应商名单中，NV 目前直接采购的范围较窄（原文为\"26 个\"，存疑）。 谷歌方面，对应的需求规模较大（原文转写为\"26.1 万台\"\"1.8 万台\"，口径存疑），主要涉及明治电机、美光股份等（原文如此）。其 CDU 的主要供应商为 Boyd、Cooler Master 和 Nidec；预计目前的主要供应商还包括赛铁、丹佛斯和 nVent。Manifold 方面，主要包括金发科技等厂商，其余比较明确的还有海鸥股份、冰轮环境和申菱环境。 四、国内服务器液冷供应格局 目前国内服务器液冷供应商的情况大致是：曙光数创，主要对应中科曙光；阿里是合一、英维克；华为有超聚变和联想；CDU 液冷厂商有双鸿等。 五、价值量占比与环节分工 从价值量占比来看，冷板大概占 32%（原文如此），直接负责芯片的热量传导与分配。CDU 在内部高度集成了流量分配、板式换热器、溶液泵组、阀门控制系统等部件，价值量占比较高（原文为 85%，口径存疑）。水冷板、水管与快接头 UQD 共同构成供液分配的方式，其中漏液控制阀门占一定比重；CDU 与 Manifold 两大核心部件合计占比较高（原文为 49.8、20，口径存疑）。 二次侧为整个系统提供冷却和循环动力。二次侧的 CDU 由结构件、换热器、水泵、管路组件、控制箱及各种传感器组成，核心集中于控制系统和冷却液的稳定性。 冷板属于高附加值环节，是整个液冷系统中完成热量转移、末端热传导的核心。它以铜、铝等为基材加工而成，内部集成微通道、鳍片和封闭式流道，是芯片热量进入液冷循环的核心。 快接头 UQD 是实现机柜内部液体与服务器之间不漏液快速连接的关键部件，通常由公头、母头配合使用，内置密封件以及进出口导向槽，以保证机柜的正常运行。 Manifold 是服务器机柜内的核心分配部件，负责流量的分流与沟通。冷却液经过分配后进入供液主管，或通过若干分支进入微通道，由服务器冷板带走热量。以上大体就是 Rubin 机柜内部液冷以及国内整体液冷系统各环节的情况。 六、Rubin 机柜的价值量拆分 其中，冷板单价在 1000 美金左右，一块冷板对应 2 个 GPU 和 1 个 CPU，整体价值量较高（原文分别提及 3.6 万美金与 14.6 万美金两个口径）。Switch tray 这块也有冷板使用，但用量面积非常小。 Manifold 单价大概 800 美金，一个机柜大约用 18 套，对应合计大概 1.4 万美金。 UQD 的配置上，公头、母头配合使用，单价 30 美金，整个机柜大概 200 到 300 对，合计大概 6000 到 9000 美金。 七、NV Rubin 的供应商名单 关于 NV Rubin 的供应商名单：预计液冷 CDU 的采购主要依据供应商白名单，目前服务器厂商只能在白名单内选择供应商；一次侧的供应商暂时还不在 NV 的白名单内。 冷板这一块，主要是 AVC、双鸿、富士康等台系散热代工厂，以及新莱应材、同飞股份等。Manifold 方面，主要包括 Cooler Master、Nidec、Boyd 和台达电子等；结构件供应商包括丹佛斯、Nidec、Cooler Master，大陆厂商中英维克及比亚迪电子已进入白名单。目前国内的供应商还比较少。 八、CDU 的产品分类与参数 CDU 是整个液冷系统的心脏和智能控制中心，负责精确控制冷却液的温度、流量和压力，主要有四种分类方式，不同类别的流量、压力等都不同，包括 In-row、In-rack 等类型。液冷 CDU 和风冷 CDU 的比例有 1:2、2:1 和 1:1，1:1 对应功率的 CDU 一般是 120 到 150kW，一个管一个机柜；单个 180kW 的机柜，七个机柜共用一台 1300kW 的 CDU。机架式 CDU 由服务器厂商进行技术采购规划，CDU 一般由液冷厂商自行采购。 价格方面，独立柜式 CDU 的单瓦价格大概 1 元/瓦，国内价格目前约 0.3 元/瓦，整体价格主要取决于客户的选型需求。海外毛利率能做到 40%。成本结构中换热器占比 20% 到 25%，水泵、控制系统、阀门等环节需要落地国内供应商，包括高力（主要做板式换热器）。CDU 的核心难点在于系统设计和软件控制系统。一线品牌的交期已经达到 4 到 6 个月。 机架级 CDU：单机功率约 28kW，4U 高度，19 英寸标准宽度，一般部署在小型数据中心和边缘场景附近。 列间级（In-row）CDU：功率范围为 80 到 300kW，在列间级上较好地平衡了功率密度与数据中心的适配性，属于相对主流的方案。 室外多联式和集中式 CDU：功率非常高，范围大概是 300kW 到 3MW，支持整个多机柜共用，适配现在的 2N 冗余配置，也是 Rubin 平台努力的方向。 机柜内置型 CDU：内置功率大概 5 到 150kW，CDU 直接集成在机柜里，有利于提升部署密度、避免大规模算力改造项目。 九、结论 整体来看，比较看好液冷明年的产业趋势，核心事件在于 Rubin 的放量，明年应该会有比较大的放量。除此之外，后续可能会有一些环节出现供不应求，并带来国产化替代的机会，整个液冷产业链的价值量也有望进一步提升。 十、重点更新：申菱环境 申菱环境的数据中心液冷业务是去年启动的，五月底开始爆单。整个数据中心液冷业务今年全年大概 8 亿到 10 亿元的收入，明年有希望做到二三十亿元的液冷收入。产品主要做冷板、CDU 和管网，其中一次侧主要做干冷器，二次侧做 CDU，二次侧大概占到整个产业链价值量的 77%，具体金额取决于机柜的密度。 目前二次侧产品处于开发、生产和订单阶段，客户包括超聚变、宝德等。客户定位上，公司不直接对接终端客户，主要先给干冷器厂商等供货，海外客户如 Vertiv 等。整体看，公司明年液冷收入有希望做到 3 亿、5 亿元甚至更高的量级。 以上就是本次液冷产业链观点的主要内容，谢谢。", "status": "extracted"}, "attachment:files/Bernstein-全球半导体资本设备：26 年 8 月半导体追踪报告，日本 SPE 同比增长 50% Global Semiconductor Capital Equipment Global Semicap Tracker (Aug 26)：Japan SPE +50% YoY.pdf": {"id": "attachment:files/Bernstein-全球半导体资本设备：26 年 8 月半导体追踪报告，日本 SPE 同比增长 50% Global Semiconductor Capital Equipment Global Semicap Tracker (Aug 26)：Japan SPE +50% YoY.pdf", "kind": "attachment", "title": "Bernstein-全球半导体资本设备：26 年 8 月半导体追踪报告，日本 SPE 同比增长 50% Global Semiconductor Capital Equipment Global Semicap Tracker (Aug 26)：Japan SPE +50% YoY", "source_label": "Bernstein", "excerpt": "2 October 2026 Global Semiconductor Capital Equipment Global Semicap Tracker (Aug 26): Japan SPE +50% YoY David Dai, CFA +852 2918 5704 david.dai@bernsteinsg.com Stacy A. Rasgon, P", "content": "2 October 2026 Global Semiconductor Capital Equipment Global Semicap Tracker (Aug 26): Japan SPE +50% YoY David Dai, CFA +852 2918 5704 david.dai@bernsteinsg.com Stacy A. Rasgon, Ph.D. +1 213 559 5917 stacy.rasgon@bernsteinsg.com Qingyuan Lin, Ph.D. +852 2123 2654 qingyuan.lin@bernsteinsg.com Juho Hwang +81 3 6777 6980 juho.hwang@bernsteinsg.com Alrick Shaw +1 917 344 8454 alrick.shaw@bernsteinsg.com Arpad von Nemes +1 917 344 8461 arpad.vonnemes@bernsteinsg.comThis tracker analyzes the billings data released by SEAJ whose members are Japanese suppliers & represent ~25% of the global wafer fab equipment (WFE) market. SEAJ released August data on 30th September (dataset can be downloaded at SEAJ+SEMI Model ). Japan SPE saw YoY growth in August with Japan SPE billing of +39% in USD (+50% in JPY). 3M average billing was relatively stable at +10% MoM / +35% YoY in USD (+7% MoM / +47% YoY in JPY). Sequentially, August single month data was -4% MoM in JPY. By equipment type, Japan front end equipment revenue (relevant to TEL) was +37% YoY in August. Assembly equipment revenue (relevant to DISCO) was +22% YoY. T esting equipment (relevant to Advantest) showed growth of +98% YoY. On a sequential basis, testing equipment is +17% MoM and 3M average was +14%. For Advantest, SEAJ data suggests upside to FQ2. Regression suggests Advantest’s revenue could be +35% QoQ, above the consensus of +18% QoQ. This is much better than what was indicated by 1-month data (+25% QoQ), and could suggest Advantest may beat and raise again. Note that SEAJ data has very high R2 (0.98) with 2 months of data. For TEL, SEAJ data suggests downside to FQ2. Our regression suggests TEL's FQ2 revenue could be +13% QoQ, below the consensus of +21% QoQ. Note that SEAJ data has decent R2 (0.91) with 2 months of data. We expect TEL revenue to still grow strongly in this year driven by strong DRAM and advanced logic capex. We forecast global WFE to be +26.3% YoY in CY2026, and +32.6% in CY2027 (WFE Model , Report Link ). We expect CY2026 will see strong growth from DRAM and NAND spending. We believe the Japanese equipment companies will benefit from the rise of memory capex, and there should be more upside. We maintain our Outperform on Disco, Advantest, Tokyo Electron, Kokusai and Lasertec within Japan semi. Within our US coverage we maintain our Outperform on LRCX, AMAT and KLAC. For Chinese semicap, we maintain our Outperform on NAURA, AMEC, and Piotech. See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website.www.bernsteinresearch.com First Published: 01 Oct 2026 20:30 UTC Completion Date: 01 Oct 2026 14:47 UTC on 02-Oct-2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 David Dai, CFA +852 2918 5704 david.dai@bernsteinsg.com 2 October 2026 BERNSTEIN TICKER TABLE 1 Oct 2026 TTM Reported EPS Reported P/E (x) Closing Price Rel. Ticker Rating Cur Price Target Perf. Cur 2025A 2026E 2027E 2025A 2026E 2027E 8035.JP (T okyo Electron) O JPY 12,580 79,300 109.0% JPY 1,250.88 1,687.17 2,635.81 10.1 7.5 4.8 6146.JP (DISCO) O JPY 60,440 99,000 (3.1)% JPY 1,245.79 1,830.28 2,336.94 48.5 33.0 25.9 6525.JP (Kokusai) O JPY 10,120 12,420 104.0% JPY 128.63 262.29 373.69 78.7 38.6 27.1 6857.JP (Advantest) O JPY 37,610 45,800 121.6% JPY 513.30 948.96 1,088.87 73.3 39.6 34.5 7735.JP (Screen) M JPY 15,590 15,000 97.4% JPY 486.61 574.49 759.55 32.0 27.1 20.5 6920.JP (Lasertec) O JPY 45,710 54,000 95.9% JPY 863.65 1,185.31 1,348.53 52.9 38.6 33.9 AMAT (Applied Materials) O USD 511.38 700.00 120.5% USD 9.42 12.76 18.30 54.3 40.1 27.9 LRCX (Lam Research) O USD 328.51 385.00 115.7% USD 5.82 9.22 10.97 56.5 35.6 30.0 KLAC O USD 194.93 250.00 58.3% USD 3.76 5.47 7.05 51.8 35.6 27.7 688012.CH (AMEC) O CNY 318.55 660.00 36.5% CNY 2.28 5.30 7.26 139.6 60.2 43.9 002371.CH (NAURA) O CNY 615.97 1,380.00 13.9% CNY 5.66 10.11 19.92 108.8 61.0 30.9 688072.CH (Piotech) O CNY 640.00 1,200.00 123.7% CNY 3.32 10.18 16.61 192.8 62.8 38.5 JPL 2,675.53 SPX 7,651.54 ASIAX 1,944.04 O - Outperform, M - Market-Perform, U - Underperform, NR - Not Rated, CS - Coverage Suspended AMAT, LRCX, KLAC estimate is Adjusted EPS; AMAT, LRCX, KLAC valuation is Adjusted P/E (x); 6920.JP, LRCX, KLAC base year is 2026; Source: Bloomberg, Bernstein estimates and analysis. INVESTMENT IMPLICATIONS Tokyo Electron: Outperform, PT=¥79,300. TEL is the #4 SPE supplier globally and the biggest Japanese SPE supplier with major presence in 6 product segments. It is expected to gain share and expand margins with competitive pricing after yen depreciation. DISCO: Outperform, PT=¥99,000. DISCO is the dominant supplier of grinders and dicers with ~85% market share. The growing usage of dicers/grinders driven by advanced packaging is sustainable, especially for HBM and CoWoS in the near term, and hybrid bonding for HBM/3D stacking NAND/backside power delivery network in the midterm. Kokusai: Outperform, PT=¥12,420. Batch ALD should see more adoption in advanced nodes especially GAA (gate-all- around). The biggest use of batch ALD is in NAND, and NAND capex recovery is accelerating. Lasertec: Outperform, PT=¥54,000. As major supplier for mask inspection (~50% share) and sole supplier for actinic inspection, Lasertec delivered phenomenal growth in the past, but saw deceleration in recent years. We expect reacceleration from TAM expansion driven by the new A200HiT tool penetrating more actinic inspection at wafer fabs. Advantest: Outperform, PT=¥45,800. Benefits from rising testing intensity for HBM and Blackwell. As the dominant supplier for HBM tester (~65%) and Nvidia AI GPU (100% share), Advantest is able to lift the ASP and margin with product migration, especially with HBM4 in 2025. Screen: Market-Perform, PT=¥15,000. Leading supplier in cleaning equipment with the lowest valuation in our coverage, but also the one with the least specific growth drivers. Cleaning intensity is not increasing, and the market is competitive with both global rivals (TEL, Lam) and Chinese (ACMR, Naura). Declining China revenue contribution presents margin downside risk. AMAT (Outperform, $700.00): We maintain a positive view on secular WFE growth and see a number of drivers for AMAT including SAM growth, an increasing services narrative, and capital return. LRCX (Outperform, $385.00): The company is benefiting from key inflections (GAA, packaging, HBM, NAND upgrades) and CY26 commentary seems supportive. KLAC (Outperform, $250.00): Amid positive WFE trends KLAC posseses structural growth drivers, a strong and durable competitive position, lower China replacement risk, and disciplined capital allocation, warranting premium valuation. GLOBAL SEMICONDUCTOR CAPITAL EQUIPMENT 2 on 02-Oct-2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 David Dai, CFA +852 2918 5704 david.dai@bernsteinsg.com 2 October 2026 NAURA (Outperform, CNY 1,380.00): As the domestic WFE leader, NAURA has the broadest product portfolio covering Deposition (PVD, CVD), Dry Etch (ICP), Thermo Processes, and Cleaning, as well as a more diverse client base covering leading logic, DRAM, NAND players, benefiting from the WFE domestic substitution in China with acceleration share gain. AMEC (Outperform, CNY 660.00): Primarily focus on Dry Etch (CCP, ICP) with rapid expansion in Deposition (ALD, LPCVD, EPI), commonly perceived as the domestic WFE company with the best technology and widest global recognition, continue to benefit from the WFE domestic substitution in China with acceleration share gain. Piotech (Outperform, CNY 1,200.00): Rising domestic WFE vendor primarily focus on Deposition (PECVD, HDPCVD, SACVD, ALD) with expansion in W2W and C2W hybrid bonding equipment for advanced packaging. Piotech has a strong track record of product innovation, which will allow it to benefit from the WFE domestic substitution in China with acceleration share gain. GLOBAL SEMICONDUCTOR CAPITAL EQUIPMENT 3 on 02-Oct-2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 David Dai, CFA +852 2918 5704 david.dai@bernsteinsg.com 2 October 2026 DETAILS This tracker analyzes the billings data released by SEAJ whose members are Japanese suppliers & represent ~25% of the global wafer fab equipment (WFE) market. SEAJ released August data on 30th September (dataset can be downloaded at SEAJ+SEMI Model ). As usual, we examine the data on both a single-month and 3-month-average basis as the single-month data reflects near-term inflection on a more timely basis and the 3-month moving average reduces the influence of seasonality and reveals the underlying trend better. We also provide the read-across for Tokyo Electron (TEL) and Advantest based on a regression analysis. August SPE billings were +39% YoY in USD (+50% in JPY). 3M average SPE billings were +35% in USD (+47% YoY in JPY). We forecast the WFE market to be up +26.3% YoY in CY2026 & +32.6% in CY2027. •On 3-month basis, august billings of Japanese equipment suppliers continued the cyclical upward swing that began in mid- CY2023 ( Exhibit 1 ). Sequentially 3M average was +7%. •On single month basis, August billings of Japanese suppliers was at ¥545 bn (-4% MoM / +50% YoY in JPY) ( Exhibit 2 ). •By equipment type, Japan front end equipment revenue (relevant to TEL) was +37% YoY in August. Assembly equipment revenue (relevant to DISCO) was +22% YoY. T esting equipment (relevant to Advantest) grew +98% YoY. ( Exhibit 3 -Exhibit 6). •We forecast global WFE to be +26.3% YoY in CY2026, and +32.6% in CY2027 (WFE Model , Report Link ). We expect CY2026 will see strong growth from DRAM and NAND spending. EXHIBIT 1: On three-month moving average basis, August SEAJ billings was +47% YoY in JPY . -40%-20%0%20%40%60%80% 0100200300400500600700 Jan-16 Apr-16 Jul-16 Oct-16 Jan-17 Apr-17 Jul-17 Oct-17 Jan-18 Apr-18 Jul-18 Oct-18 Jan-19 Apr-19 Jul-19 Oct-19 Jan-20 Apr-20 Jul-20 Oct-20 Jan-21 Apr-21 Jul-21 Oct-21 Jan-22 Apr-22 Jul-22 Oct-22 Jan-23 Apr-23 Jul-23 Oct-23 Jan-24 Apr-24 Jul-24 Oct-24 Jan-25 Apr-25 Jul-25 Oct-25 Jan-26 Apr-26 Jul-26 YoYJPY bnSEAJ Monthly Billings (3M Avg) SEMI 3M-Avg Billings Billings YoY Source: SEAJ and Bernstein analysis. GLOBAL SEMICONDUCTOR CAPITAL EQUIPMENT 4 on 02-Oct-2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 David Dai, CFA +852 2918 5704 david.dai@bernsteinsg.com 2 October 2026 EXHIBIT 2: August single-month billings data was -4% MoM and +50% YoY in JPY . -40%-20%0%20%40%60%80%100% 0100200300400500600700800 Jan-16 Apr-16 Jul-16 Oct-16 Jan-17 Apr-17 Jul-17 Oct-17 Jan-18 Apr-18 Jul-18 Oct-18 Jan-19 Apr-19 Jul-19 Oct-19 Jan-20 Apr-20 Jul-20 Oct-20 Jan-21 Apr-21 Jul-21 Oct-21 Jan-22 Apr-22 Jul-22 Oct-22 Jan-23 Apr-23 Jul-23 Oct-23 Jan-24 Apr-24 Jul-24 Oct-24 Jan-25 Apr-25 Jul-25 Oct-25 Jan-26 Apr-26 Jul-26 YoYJPY bnSEAJ Monthly Billings (Single Month) SEMI Single Month Billings Billings YoY Source: SEAJ and Bernstein analysis. EXHIBIT 3: Monthly billings for Japanese WFE was +36.6% YoY / -8.3% MoM. -60%-40%-20%0%20%40%60%80%100% Jan-22 May-22 Sep-22 Jan-23 May-23 Sep-23 Jan-24 May-24 Sep-24 Jan-25 May-25 Sep-25 Jan-26 May-262022 -2026: Japan WFE Monthly Billings (YoY) YoY 3M avg (YoY) Source: SEAJ, Bernstein analysis.EXHIBIT 4: Monthly billings for Japanese assembly SPE was +22% YoY / +5.9% MoM. -60%-40%-20%0%20%40%60%80%100% Jan-22 May-22 Sep-22 J onomous.bluematrix.com/sellside/Disclosures.action. Or, you can also write to the Director of Compliance, Bernstein Institutional Services LLC, 245 Park Avenue, New York, NY 10167. RATINGS DEFINITIONS, BENCHMARKS AND DISTRIBUTION EQUITY RATINGS DEFINITIONS Bernstein brand The Bernstein brand rates stocks based on forecasts of relative performance for the next 12 months versus the S&P 500 for stocks listed on the U.S. and Canadian exchanges, versus the Bloomberg Europe Developed Markets Large and Mid Cap Price Return Index EUR (EDME) for stocks listed on the European exchanges and emerging markets exchanges outside of the Asia Pacific region, versus the Bloomberg Japan Large and Mid Cap Price Return Index USD (JPL) for stocks listed on the Japanese exchanges, and versus the Bloomberg Asia ex-Japan Large and Mid Cap Price Return Index (ASIAX) for stocks listed on the Asian (ex-Japan) exchange", "status": "extracted"}, "post:2026-10-05T11-23:ffc3401c079d": {"id": "post:2026-10-05T11-23:ffc3401c079d", "kind": "post", "title": "2026-10-05 11:23", "source_label": "帖子正文", "excerpt": "高盛对存储器板块表达了温和乐观的看法。DDR4 现货价格继续上涨，环比上涨 5%，现货价格较合约价溢价 44%。", "content": "AI 药物研发正成为一种 “瓶颈交易” 当一个行业开始经历真正的范式转移时，我会感到兴奋。AI 药物研发（“AIDD”）看起来正处于这样一个时刻。 两件事正在发生： 1、上游：前沿 AI 实验室正蜂拥而至。 2、下游：供应链正在发生明显的变动。 供应链调研显示，药物发现和早期临床前研发的上游 “卖水者”（基础工具与服务）已开始感受到实验量的显著增长。 完整链路为 DNA → 蛋白质 → 筛选分析 → 测序 → 自动化 → 临床前测试。 该产业链条中的代表性公司包括\\(TWST、@GenScript、\\)ILMN、$TXG，以及实验室自动化供应商和 CRO。 $TWST 预计在 2026 财年，AI 赋能的药物研发订单将实现三位数的百分比增长，并在 2027 财年再次实现三位数的订单增长。 @GenScript 的 AIDD 业务在 2026 财年上半年同比增长了一倍。其现有平台宣称具备每日 4000 多个设计的工业级验证能力，并集成了从序列到数据的完整工作流。我们的渠道调研显示，其增长速度甚至更快：目前约为每日 8000 个设计，并有望在 2026 年底达到每日约 16000 个。 为什么 AI 会驱动更多的湿实验需求？ 1、AI 让假设生成几乎零成本 → 尝试机会大幅增加。 瓶颈正在从专家驱动的设计转向生物学验证。 2、AI 模型需要持续的实验反馈 —— 而且无论好数据还是坏数据都有价值。 传统上，只有信心最高的一流（A + 级）候选药物才会被推向昂贵的验证环节。有了 AI，即使是 B/C 级的候选药物也具有价值，因为失败的实验也能生成训练数据。 @GenScript 表示其从序列到结合的工作流程可以在 4-7 天内返回数据，而更快的周期至关重要，因为 AI 模型依赖于持续的实验反馈。 @Anthropic 是一个典型的例子。@claudeai 设计了 1320 个蛋白质结合剂。@adaptybio 将这些数字序列转换为 DNA，表达了蛋白质并测试了结合情况。结果只有 354 个成功结合。而那 966 个失败案例也并未被浪费。它们是很有用的负标签：哪些不表达、哪些不结合、哪些亲和力差。这些结果有助于训练下一次模型迭代。 3、湿实验室不再仅仅是在制造药物。它们正在制造训练数据。 $TWST / @GenScript 越来越像生物数据代工厂。 $TWST 明确提到了从 AI 设计的序列中生成模型就绪型数据。在某些工作流程中，客户可能并不那么在意是否收到蛋白质实体，而更在意将结构化的实验结果反馈回模型中。 传统药物研发会问：候选药物 X 有效吗？ AI 药物研发还会问：这项实验能教给模型什么？ AIDD 的市场规模（TAM） 如果 AI 仅仅是一种更好的研发工具，那么相关的支出池就是全球制药业每年 3000 亿至 4000 亿美元的研发费用。如果 AI 能显著增加可行药物项目的数量，那么机遇将更为广阔，因为它会扩大下游对 DNA 合成、蛋白质生产、检测分析以及临床前工作的需求。 短期来看，我们也可以从 AI 公司的支出中衡量需求。如果 Anthropic 在 2026 年达到 800 亿美元的年度经常性收入（ARR），并且仅将 1% 用于 AIDD，仅此一项就意味着每年约 8 亿美元的投资。 交易布局 这是一个可能具有长期潜力的交易。在 I/II 期临床结果出来之前（2028 年及以后），很难真正停止发力。 这闻起来非常像我们刚刚在半导体领域看到的瓶颈交易：GPU→HBM→网络→电力 / 冷却。在生物学领域，它基本上遵循药物研发的流程：AI 模型 → 设计 → DNA / 蛋白质 → 检测 → 临床前产能。 在完成上游的 “卖铲子” 阶段后，动物实验 CRO 可能会成为下一个瓶颈。猴类价格已经接近历史高点。AIDD 将更多的候选药物推向临床前开发阶段，只会进一步增加这一需求。 但是临床试验难道不是瓶颈吗？ 这是我们不断遇到的最大质疑。无论药物发现的速度变得多快，药物仍然需要经过临床前→I 期→II 期→III 期→审批。你仍然需要患者、时间和资金。 但这并不意味着 “瓶颈交易” 行不通。更多可行的候选药物 —— 尤其是具有更高成功率的药物 —— 仍然意味着整个开发过程中会有更多的需求。 而且谁知道呢：临床试验本身最终也可能被 AI 优化。 什么会打破这一交易逻辑？ 短期来看，如果实验预算停止增长、AI 生成的设计无法转化为有效的实验验证结果，或者产能过快追上需求，那么这种 “卖铲子” 的交易逻辑就会破裂。 长期来看，如果 AI 药物在药物发现或 I 期临床阶段表现出色，但在 II/III 期临床中仍以常态概率失败，那么这一论点就不再成立。这就是为什么 II 期临床如此重要的原因。 里程碑 2026 年底至 2027 年：首批由 Isomorphic 设计的药物进入人体临床试验，更多 AI 原生项目进入 IND 申报准备 / 毒理学阶段。 2028 年至 2030 年：临床试验结果将开始揭示，AI 设计的药物在实际表现上是否优于传统药物。#文字观点", "publish_time": "2026-10-05 11:23", "tags": ["文字观点"]}, "post:2026-10-05T22-07:4c24ae06a33a": {"id": "post:2026-10-05T22-07:4c24ae06a33a", "kind": "post", "title": "2026-10-05 22:07", "source_label": "帖子正文", "excerpt": "Advanced Materials - PCB & CCL 我们重启对 PCB/CCL 行业的覆盖，重点聚焦谷歌 TPU 供应链，我们认为该供应链将在 2028 年及以后实现最强劲、可持续的增长。我们预测到 2025 至 2026 年，TPU 总出货量将增长两倍以上，超过其他竞争平台。", "content": "Advanced Materials - PCB & CCL 我们重启对 PCB/CCL 行业的覆盖，重点聚焦谷歌 TPU 供应链，我们认为该供应链将在 2028 年及以后实现最强劲、可持续的增长。我们预测到 2025 至 2026 年，TPU 总出货量将增长两倍以上，超过其他竞争平台。关键在于，我们预计下一代 TPU ASIC 的单台设备内含价值将提升。随着谷歌将更多先进逻辑与 HBM 裸芯片集成到单个计算模块中，我们预计未来三到四年 TPU 内含价值将提升五至十倍。据此，我们估算仅可触达的 PCB 内含价值就可能从 2026 年至 2029 年翻两番。同样重要的是，谷歌在超级节点光互联领域长期保持领先，不断提升的交换速率与互联带宽将成为第二重利好，进一步推高 PCB 内含价值。因此，我们预计 PCB/CCL 市场将迎来持续的定价权上行，并且有可能形成长期协议，复刻存储行业的供应链动态。在主要 TPU 供应商矩阵内，我们重启对 ISU Petasys 和 EMC 的买入评级，目标价分别为 27 万韩元、10000 新台币。我们同时启动对 TTM 的覆盖，给出买入评级，目标价 236 美元。风险包含需求、落地执行以及美国针对 AI 数据中心扩张的相关政策。 Why Google’s TPUs? 我们预测 TPU 出货量将从 2027 年的 3600 万片，增长至 2028 年的 1.2 亿片，涨幅超两倍，这其中包含内部部署以及通过 ASIC 服务分配给第三方 AI 实验室的数量。大规模订单的佐证来自 2026 年第二季度谷歌高达 520 亿美元的云服务后端资本开支订单。与此同时，TPU 预计将在 V9 版本（2028 年中端）对比 V8 版本（2026 年下半年）实现性能翻倍，V10 版本（2029 年）有望再度翻倍，原因是谷歌在其 ASIC 设计中集成更多裸芯片。PCB 设计复杂度提升至 50 层以上或 HDI 方案，CCL 升级至 M8/M9 材料甚至 PTE 材料，代表每一代产品的 ASP 至少提升 50%。此外，随着架构扩容，网络相关的 PCB/CCL 也会迎来类似增长，带宽需求从 400Gbps 提升至 800Gbps 乃至 1.6Tbps。 LTA likely becomes new norm under strong demand and supply constraint 我们的供应链调研显示，云服务商正在越来越多地讨论 PCB 和 CCL 供应链的长期协议（LTA）。不同供应商的协议条款存在差异，现阶段大部分条款仍在磋商。但这些讨论释放了明确信号：终端客户正在通过预付款以及长期协议锁定高端 PCB/CCL 产能，这是未来数年的趋势，因为整个行业大概率持续供给不足。同时我们判断，预付款第一会缓解供应链资本开支与现金流压力；第二会促使供应链厂商加大长期产能投入、保障交付；第三会借助更优的盈利能力改善供应链管理。我们相信如果长期协议落地，供应链的市盈率估值将进一步抬升，获得更长的业绩可见度与稳定订单储备。 We prefer TPU supply chain into 2027/28: buy on EMC, ISU and TTM TPU 供应链将成为 2027 至 2028 年最大赢家，具备强劲的单位出货量增长与内含价值升级。我们预计 2026 年 PCB 出货量 850 万片，2027 至 2028 年增长至 3600 万片。PCB 单台内含价值达到 3 万至 4 万美元，TPU V8 版本 CCL 价值 1.2 万至 1.8 万美元，V7 版本 CCL 价值 2000 至 7000 美元。我们预计 V9 版本随着谷歌的采用，价值再提升 40%-50%。我们看好 EMC 的领先地位，预计 TPU 配套 800Gbps 交换机将成为公司盈利增长引擎。我们给出 EMC 新目标价 10000 新台币，对应 2027 至 2028 财年 30 倍市盈率。ISU 处于有利位置，能够把握这些行业趋势，高度绑定谷歌与网络业务。我们给予 ISU 买入评级，目标价 27 万韩元，对应 2027 至 2028 财年 30 倍市盈率。最后，TTM 是美国本土最优标的，能够承接其他 AI 服务器与国防订单，具备更好盈利能力与不可替代性。#文字观点", "publish_time": "2026-10-05 22:07", "tags": ["文字观点"]}, "post:2026-10-05T09-05:19d9bce37ff1": {"id": "post:2026-10-05T09-05:19d9bce37ff1", "kind": "post", "title": "2026-10-05 09:05", "source_label": "帖子正文", "excerpt": "散热零组件：英伟达 VRU 与 ASIC 散热升级加速，支撑热设计功耗持续提升 我们观察到 AI 专用集成电路以及 GPU 系统均出现散热规格加速升级的趋势，产品价值提升幅度超出投资者预期，英伟达下一代 VR Ultra（VRU）表现尤为突出，这与近期市场担心规格降级的观点相反。我们依旧认为，散热是", "content": "散热零组件：英伟达 VRU 与 ASIC 散热升级加速，支撑热设计功耗持续提升 我们观察到 AI 专用集成电路以及 GPU 系统均出现散热规格加速升级的趋势，产品价值提升幅度超出投资者预期，英伟达下一代 VR Ultra（VRU）表现尤为突出，这与近期市场担心规格降级的观点相反。 我们依旧认为，散热是制约全部 AI 芯片热设计功耗继续提升、AI 服务器系统迭代迁移的核心瓶颈。 针对 VRU 产品，冷板（双面设计、采用金刚石铜材质）、快速接头（MQD 升级为 ZQD）、盖板 / 均热板（三件式、可拆盖板设计）均会采用全新设计，实现规格升级。 我们认为英伟达 VRU 产品超预期的产品价值增长，叠加 ASIC、AMD GPU 散热单机价值进一步抬升，将持续利好各个散热零部件的头部供应公司。 展望未来 1‑2 年，伴随液冷在新一代产品中成为主流方案（大概率从 1.6T/3.2T 代际开始），共封装光学 / 近封装光学交换机以及更高规格光收发器 / 光模块，将会成为下一轮增长驱动力。 在散热赛道中，我们看好 AVC、Fositek。 冷板：英伟达 VRU 或将采用双面设计，AWS Trn3、AMD MI450 同步跟进，产品价值提升 50%；金刚石铜带来价值增量 双面冷板设计将成为散热规格的下一轮升级方向，我们预计该设计会应用于 AWS Trainium 3（Trn3）、AMD MI450 计算托盘，英伟达 VRU 也将跟进使用。 芯片板卡采用垂直供电架构之后，芯片背面也需要配置冷板实现散热，因此催生了这套全新的双面设计。 VRU Bianca 冷板还会把材料升级为金刚石铜，以此获得更好散热效果，进一步拉高单台产品价值。 受上述因素共同作用，VRU 散热单机价值相比 VR200 可以实现约 50% 的提升，而此前市场受规格降级担忧影响，预期散热单机价值持平甚至下滑。 除上述平台以外，谷歌 TPU v8 使用镀金冷板，同时为周边集成电路额外配置冷板，带来可观的散热单机价值。 TPU v9 芯片裸片面积更大、热设计功耗更高，采用双面冷板的可能性也随之上升。 快速接头（QD）：VRU 1.5U 九层交换机托盘双层架构方案不会带来单机价值变化；VRU 切换使用 ZQD 规格，单机机架价值约实现翻倍增长 在 VRU 系统内，英伟达计划将部分快速接头从原有 MQD（多通道快速接头）/UQD（通用快速接头）升级至规格更高的 ZQD（无滴漏可控流量快速接头），该产品平均售价约为原有产品两倍，能够改善液体流量，降低泄漏风险，提升散热效率。 根据摩根大通测算，对比 VR200/GB300 机架，VRU NVL72 整机机架快速接头整体单机价值大约提升 100%，ZQD 会在三处落地：①计算托盘 Bianca 模块，伴随 GPU 冷板升级，使用 ZQD06 规格；②全部 9 个计算托盘、9 个双层架构交换机托盘的入口快速接头，托盘外部 2 个插拔接头升级为 ZQD14 规格；③机架集流腔底座快速接头同样升级为 ZQD14 规格。 均热盖板：Rubin Ultra 推进三件式可拆盖板落地无延期，部分 Rubin GPU 甚至有可能将导入时间从 2026 年第四季度‑2027 年第一季度提前 我们判断英伟达 Rubin Ultra GPU 将如期采用 “可拆盖板 + 加强筋 + 多颗螺丝” 也就是三件式盖板设计，对比 Rubin GPU 当前的单件式盖板方案，均热板 / 盖板单机价值提升 4‑5 倍。 根据产业链调研，英伟达甚至会从 2026 年第四季度开始小批量在 Rubin GPU 上试用这套新结构，下一代 Rubin Ultra GPU 预计 2027 年第一季度实现大规模量产。 落地节奏略超市场预期，有望给三件式盖板供应公司带来短期营收、业绩向上弹性。 除此之外，AMD MI450 系列使用两件式盖板，对比 MI350 系列平均售价提升约十倍；未来共封装光学 / 近封装光学产品放量会拉动加强筋需求，长期 ASIC 规格迭代升级，共同构成均热板市场的结构性发展趋势。 股价影响分析 散热板块当中我们优先看好 AVC，GPU 与 ASIC 系统冷板规格持续升级，该公司在各个项目当中拥有领先地位与市场份额，可以获得优于同业的利润率以及业绩增速，当前估值并不高，股价表现跑输同业。 同时看好 Fositek，该公司短期毛利率具备向上空间，长期受益快速接头规格升级、单机价值提升，市场份额持续扩张，整体可触达市场规模不断扩大。#文字观点", "publish_time": "2026-10-05 09:05", "tags": ["文字观点"]}, "attachment:files/Bernstein-美国IT硬件：硬盘驱动器（STX、WDC）——东芝风波，杯中风暴.pdf": {"id": "attachment:files/Bernstein-美国IT硬件：硬盘驱动器（STX、WDC）——东芝风波，杯中风暴.pdf", "kind": "attachment", "title": "Bernstein-美国IT硬件：硬盘驱动器（STX、WDC）——东芝风波，杯  "帖子正文", "excerpt": "🎁【长江社零】2026年国庆消费数据高频监测 🌹交通出行：国庆前三天，全社会跨区域人员流动量同比下滑0.42%，其中铁路客运量同比下滑1%，民航客运量同比下滑2.66%。🌹零售：商务部数据显示，国庆假期前三天，商务部重点监测的78个步行街（商圈）客流量、营业额同比分别增长3.4%、5.3%。", "content": "🎁【长江社零】2026年国庆消费数据高频监测 🌹交通出行：国庆前三天，全社会跨区域人员流动量同比下滑0.42%，其中铁路客运量同比下滑1%，民航客运量同比下滑2.66%。 🌹零售：商务部数据显示，国庆假期前三天，商务部重点监测的78个步行街（商圈）客流量、营业额同比分别增长3.4%、5.3%。 🌹景区：国庆假期苏州市园林综合服务中心服务号显示，拙政园10月2日至10月5日门票已售罄；九寨沟10月1日单日接待达4.1万人最大承载量；10月1—5日门票全部售罄；三星堆博物馆10月1日吸引游客23611人次，10月1—6日个人预约门票全部售罄；稻城亚丁10月1—6日门票售罄（每日1.5万张最大承载额，9月29日起即满）。 🌹区域旅游：2026年国庆假期，截至4日15时，四川全省纳入统计的908家A级旅游景区四天累计接待游客2755.55万人次、实现门票收入2.67亿元，接待人次与2025年同口径同比增长3.62%，5A级旅游景区累计接待游客291.65万人次、门票收入1.24亿元，与2025年同口径同比分别增长3.44%和0.72%；前四天，湖北A级旅游景区累计接待游客1117.18万人次，同比增长5.93%；星级酒店平均出租率76.39%，同比增长3.36pct；前四天北京全市公园共接待游客798.81万人次，与2025年同期相比增加8.2%；第4天截至15：00，山东重点监测的200家旅游景区，当日接待游客491.2万人次，营业收入2.7亿元，同比分别增长6.7%和3.2%。 🌹免税：据海口海关统计，10月1日至3日，2026年国庆假期前三天，海口海关共监管海南离岛免税购物金额3.58亿元，参与购物人数5.51万人次，购买离岛免税商品27.70万件，比2025年同期分别增长8.85%、12.90%、8.02%。 🌹出入境：国庆假期前三日，上海浦东国际机场口岸累计出入境人员突破31.9万人次，其中经该口岸入境的外籍人员达4.3万人次，较去年国庆假期同期增长23.5%；珠海边检总站前三天查验出入境客流量达224万人次，同比增长约5%；超过73.2万人次内地旅客访港，按年增加约8.4%，香港入境处并预计整个黄金周将有约129万人次内地旅客访港，日均人次按年上升超过5%。 🌸欢迎联系长江社零团队～ -------------------------- ☎联系人 长江社服：赵刚/杨会强/马健轩/曹淑蕊 长江零售：李锦/罗祎/秦意昂/张彦淳/曾维朵", "publish_time": "2026-10-05 11:22", "tags": []}, "post:2026-10-05T21-01:ca410150f946": {"id": "post:2026-10-05T21-01:ca410150f946", "kind": "post", "title": "2026-10-05 21:01", "source_label": "帖子正文", "excerpt": "《广发海外电子通信》 ☄ PCB行业：2H27 AI GPU PCB规格展望 👉部分市场观点认为，英伟达将在VR300 NVL576交换托盘中采用碳氢树脂 (HC) 替代PTFE。我们认为，PTFE混压仍是目前测试中最领先的方案", "content": "《广发海外电子通信》 ☄ PCB行业：2H27 AI GPU PCB规格展望 👉部分市场观点认为，英伟达将在VR300 NVL576交换托盘中采用碳氢树脂 (HC) 替代PTFE。我们认为，PTFE混压仍是目前测试中最领先的方案；HC仅于近期通过信号完整性 (SI) 测试，尚未进入PCB量产 (MP) 测试。最终方案预计将于2026年底确定。我们重申PTFE混压仍是明年VR300 NVL576 switch最可能采用的配置。 ☀ 新HC方案：我们在9月9日PCB行业报告中强调，原先PTFE混压方案中的PTFE层大致分为含布和无布两条路线，HC是无布路线中的材料之一。近期测试的HC方案同样采用混压结构，即HC + ABF/M9 (Q-glass)；核心变化是在混压结构中以HC层替代PTFE层。 ☀ HC认证进度落后PTFE：HC混压方案近期才通过SI测试，尚未进入PCB量产测试，认证进度较PTFE混压落后约3个月。因此，目前市场关于HC将取代PTFE成为VR300 NVL576交换板方案的推测，尚缺乏充分依据。我们持续看好PTFE在高端PCB中的长期应用，认为其最符合高频、高速场景的要求。对HC等替代材料的评估主要出于短期量产可行性的考虑；即使采用HC，也更可能作为过渡方案，预计不会改变长期向PTFE发展的趋势。 ☀ PTFE混压很可能成为VR300 NVL576的方案：一家中国PCB龙头已在PTFE混压方案上取得可观的量产良率。因此，我们对PTFE混压仍有信心，并认为该方案能兼顾性能与量产可行性。 ☀ 个股观点：中国PTFE CCL龙头目前认证进度领先，有望成为主要供应商。其配套PCB供应商中，一家中国PCB龙头的PTFE混压良率向好。台虹 (8039 TT) + 台光电 (2383 TT) 的组合有望成为二供。台虹已宣布投资NT$2bn建设PTFE产能，目前PTFE CCL样品已送至欣兴 (3037 TT)，用于后续PCB开发。#文字观点", "publish_time": "2026-10-05 21:01", "tags": ["文字观点"]}, "post:2026-10-05T22-08:9ca0e0a1f192": {"id": "post:2026-10-05T22-08:9ca0e0a1f192", "kind": "post", "title": "2026-10-05 22:08", "source_label": "帖子正文", "excerpt": "AI 服务器 PCB/CCL 规格及主要供应商 英伟达 GB200，时间节点：2025 年上半年，PCB 规格：22 层 HDI、24 层（交换机板），PCB 供应商：VGT、欣兴电子；交换机板供应商为 VGT、TTM、欣兴电子。", "content": "AI 服务器 PCB/CCL 规格及主要供应商 英伟达 GB200，时间节点：2025 年上半年，PCB 规格：22 层 HDI、24 层（交换机板），PCB 供应商：VGT、欣兴电子；交换机板供应商为 VGT、TTM、欣兴电子。CCL 规格：M8/M4；交换机板规格 M8/M2。CCL 供应商：斗山、生益科技、EMC（交换机板）。 GB300，时间节点：2026 年上半年，PCB 规格：22 层 HDI、24 层（交换机板），PCB 供应商：VGT、欣兴电子；交换机板供应商 VGT、TTM、欣兴电子。CCL 规格：M8/M4、交换机板 M8/M2、M8/M4。CCL 供应商：斗山、生益科技、EMC（交换机板）。 Vera Rubin，时间节点：2026 年下半年，PCB 规格：26 层 HDI、32 层（交换机板）、44 层（中间背板），PCB 供应商：VGT、欣兴电子、ZDT；交换机板供应商 VGT、WUS、TTM、欣兴电子。CCL 规格：M8/M4、交换机板 M8、中间背板 M8。CCL 供应商：斗山、生益科技、EMC、南亚（交换机板）。 Rubin Ultra，时间节点：2027 年下半年，PCB 规格：30 层 HDI、32 层（交换机板）、44 层（中间背板），PCB 供应商：VGT、欣兴电子、ZDT；交换机板供应商 VGT、WUS、TTM、欣兴电子、SCC。CCL 规格：M8/M6、交换机板 M8/M9+PTFE、中间背板 M9。CCL 供应商：斗山、生益科技、EMC / 泰福（交换机板）。 谷歌 TPU v7 Ironwood，时间节点：2026 年上半年，PCB 规格：26 层，PCB 供应商：ISU、LCS、WUS、TTM。CCL 规格：M7。CCL 供应商：松下、EMC。 TPU v8i Sunfish，时间节点：2026 年第四季度，PCB 规格：32 层 M+M，PCB 供应商：ISU、LCS、WUS、TTM、Dynamic。CCL 规格：M8/M6。CCL 供应商：松下、EMC、南亚。 TPU v8t Zebrafish，时间节点：2027 年第一季度，PCB 规格：34 层 N+M，PCB 供应商：ISU、LCS、WUS、TTM、GCE、Dynamic。CCL 规格：M8/M6。CCL 供应商：松下、EMC、斗山。 TPU v9 Humufish，时间节点：2028 年，PCB 规格：HDI，PCB 供应商：ISU、LCS、WUS、TTM、欣兴电子、Dynamic。CCL 规格：M9/M8。CCL 供应商：松下、EMC、斗山。 亚马逊 Trainium 2e，时间节点：2026 年上半年，PCB 规格：26 层，PCB 供应商：GCE、生益科技、FHT。CCL 规格：M8。CCL 供应商：EMC、TUC。 Trainium 3，时间节点：2026 年下半年，PCB 规格：26 层 / 40 层、22 层（交换机板），PCB 供应商：GCE、生益科技、FHT、WUS、ZDT。CCL 规格：M8。CCL 供应商：EMC、TUC。 Trainium 4，时间节点：2027 年下半年，PCB 规格：34 层、30 层（交换机板），PCB 供应商：GCE、生益科技、ZDT。CCL 规格：M9（待确认）。CCL 供应商：EMC、TUC、南亚。 AMD MI450，时间节点：2026 年第四季度，PCB 规格：48 层，PCB 供应商：SCC（主力）、欣兴电子、Dynamic。CCL 规格：M8。CCL 供应商：EMC、斗山。 MI500，时间节点：2027 年第四季度，PCB 规格：48-52 层，PCB 供应商：SCC（主力）、欣兴电子、Dynamic。CCL 规格：M9。CCL 供应商：EMC、斗山。 OpenAI Jalapeño，时间节点：2026 年第四季度，PCB 规格：40 层，PCB 供应商：GCE 及其他厂商。CCL 规格：M8（待确认）。CCL 供应商：EMC、斗山。", "publish_time": "2026-10-05 22:08", "tags": []}, "post:2026-10-05T09-06:fd9835fe15b8": {"id": "post:2026-10-05T09-06:fd9835fe15b8", "kind": "post", "title": "2026-10-05 09:06", "source_label": "帖子正文", "excerpt": "CoreWeave—— 来自 CRWV Fully Connected 大会的思考：战略或许有所优化，但前路依旧漫长 CRWV 本周在旧金山举办首届 Fully Connected 大会，参会对象主要面向 AI 工程师、平台工程师、首席技术官等人群。这是一次明确的营销活动，试图围绕自身平台搭建社群与", "content": "CoreWeave—— 来自 CRWV Fully Connected 大会的思考：战略或许有所优化，但前路依旧漫长 CRWV 本周在旧金山举办首届 Fully Connected 大会，参会对象主要面向 AI 工程师、平台工程师、首席技术官等人群。 这是一次明确的营销活动，试图围绕自身平台搭建社群与生态，对标 AWS re:Invent、谷歌云 Next 或者英伟达 GTC 大会。 本次大会恰逢 CRWV 对外传递 “我们不再是新一代云厂商” 的全新定位，同时发布一套名为 CoreWeave Forge 的全新开发者工具。 众所周知，我们并不看好 CoreWeave 的商业模式：在竞争日趋激烈的市场中做 GPU 租赁业务。 在其现有的潜在客户群体当中，超大规模云厂商已经成为直接竞争对手；同时超大规模厂商会通过自建、托管机房来平衡内部算力供给。 主流 AI 实验室大多采用自建算力、机房托管，或是采购超大规模云厂商性价比更高的云服务的混合模式。 而公司客户也具备很强的动力继续选择他们传统的云服务商采购服务。 我们判断，最终市场赢家会是超大规模云厂商，而这就让 CRWV 陷入了一定的战略困境。 站在 CoreWeave 的视角，如果我们是它会怎么做？ 进行业务转型，向软件栈上层延伸，争取在未来 GPU 云市场切分出属于自己的一块份额。 筛选出有充分理由采购外部服务商服务的一批公司客户，构筑护城河把这类客户牢牢留住。 尽最大力度扶持一批优质 AI 初创企业，期待其中部分企业成长壮大之后依旧保持忠诚度，以此带动营收大幅增长。 打造高毛利、具备明显可规模化属性的产品，以此抬升基础设施业务回报率，为持续投入提供资金基础。 和生态头部企业维持紧密合作关系，借助合作方提升自身在目标客户群体当中的公信力。 Fully Connected 大会正是 CRWV 朝着上述方向做出的尝试。 这是一场典型的旧金山科技大会，现场设置格斗机器人表演、邀请 Pitbull，发放大量品牌 T 恤，参会人群也符合这类科技大会的特征。 但这套举措真的能够奏效吗？我们对此持怀疑态度。 即便你看好 Forge、托管推理、全栈的发展愿景（我们对此保持审慎，详细观点在后文），本质上这依旧是一家被 GPU 即服务核心业务捆绑的初创企业，手握超过千亿美元的在手订单，订单对应的商业条款大多已经锁定。 我们维持原有投资评级不变，但至少公司已经开始尝试新方向。 财务预测数据： 调整后每股亏损：2025 实际‑1.20 美元；2026 预测‑4.56 美元；2027 预测‑4.77 美元 营收（单位：百万美元）：2025 实际 5131；2026 预测 12622；2027 预测 23552，复合增速 114.2% EBITDA（单位：百万美元）：2025 实际 2442；2026 预测 6826；2027 预测 14974，复合增速 147.6% 估值指标 EV/EBIT 倍数：2026 预测 302 倍；2027 预测 38.2 倍 调整后市盈率：2025 实际‑72.8 倍；2026 预测‑19.1 倍；2027 预测‑18.3 倍 在本次大会的发言与交流当中，我们没有挖掘到太多核心主业的新增信息，绝大部分内容都是二季度财报观点的复述： CRWV 依旧将二季度视作利润率的拐点，认为价格上行、市场环境变化以及规模效应共同推动利润率改善。 公司重申当前在用电力规模 1.5 吉瓦，签约电力规模 4.2 吉瓦，手握 51 处建筑资产，各项规模都在持续扩张。 管理层重新阐述 GPU 的生命周期，重点强调公司客户当中，使用或者自研中小型、私有模型的客户对 A100、H200 芯片依旧存在需求。 管理层反复强调当前需求大幅超过供给，新签合同客户可以接受涨价，同时市场对短期算力容量存在增量需求。 现场展示了各行各业的众多合作客户案例，但依旧没有披露新增客户数量、产品数量、托管推理业务收入等明确指标；除去已经公开披露的大额合作，其余业务体量依旧偏小。 整场活动完全没有谈及债务规模与资本成本，但这两点是我们重点担忧的风险点。 接下来我们聚焦本次重磅新发布产品，但我们判断该产品在相当长一段时间内都难以在财务报表形成实质性贡献： CoreWeave Forge 整合了 CoreWeave 收购的 Weights & Biases、OpenPipe 的后训练能力、Marimo 笔记本工具，以及 CRWV 围绕一套被称作 “AI 循环” 的迭代流程打造的配套服务。 产品目标：不再仅仅提供 GPU 硬件资源，而是深度切入 GPU 算力消耗周边的全流程工作。 除托管推理和后训练模块之外，这套产品大部分能力具备云中立特性，更适配开放权重模型生态。 理论上该产品可以对冲 CRWV 来自大型 AI 实验室的合约业务风险，但前提是这项业务能够做到巨大规模，存在实现可能性，但难度较高。 这套整合后的 Forge 解决方案面向公司客户，尤其是原生 AI 初创企业，目前已经收获部分大型企业的合作案例，例如 Canva、MasterClass。 这套工具集同时承担获客工具的作用，希望依靠产品本身的用户粘性，最终带动更多基础设施相关服务的采购。 公司会不断扩充合作生态伙伴，目标把 Forge 打造成一站式 AI 开发平台。 管理层也承认，这套产品的绝大多数功能，市面上其他服务商或者开源方案都可以实现；CoreWeave 的差异化来自于功能之间的整合。 这可以成为一条可行战略：当工具分散、需要跨工具对接时，用户确实会更青睐体验更流畅的一体化方案。 但这套差异化优势能否长期维持，是一个更大的疑问。 我们对于 Forge 产品差异化能力与长期生命力的初步判断 Forge 刚刚正式对外发布，我们后续会完成详细竞品对比分析，但我们初步判断该产品很难构建真正的护城河。 和 GPU 即服务业务处境相似，超大规模云厂商依托传统云业务基础和庞大的公司客户基数，在打造全栈方案这件事上处于更有利位置。 CoreWeave 会反驳这一点，称自己凭借 AI 原生属性可以实现对超大规模厂商的弯道超车，就像过去行业讨论 “云原生” 概念一样。 但我们不会去押注巨头会落败，即便是 AI 原生的公司客户，依旧会需要大量传统云算力资源。 就算当下只有 CRWV 具备完整整合的 AI 循环解决方案，超大规模竞争对手也并不是从零起步。 AWS 已经提供训练、追踪、模型部署、智能体可观测性全套文档化能力；谷歌打通模型评估、故障分析和性能优化；LangSmith 可以把生产链路追踪和数据集、故障诊断、优化建议结合，同时已经和多家超大规模云厂商完成部分集成。 这不代表竞品已经实现和 CRWV 完全等同的整合效果，但说明一体化整合能力是可以被复刻的。 这套产品最适配的目标客户，是技术团队能力强、工作负载可复现、具备定制模型诉求的专业化 AI 原生公司。 也就是说，客户要有充分理由承担模型定制带来的操作复杂度。 如果未来推理账单持续走高，小型专业化模型吸引力提升，模型蒸馏技术可以进一步拓宽产品受众；产品不一定要求客户全面采用开源模型，但需要存在足够多有价值的任务依赖模型定制能力。 当企业普遍采用多云 IT 架构，或是 CRWV 成为客户首选基础设施供应商时，独立的 Forge 产品才能发挥最大价值、实现最高用户粘性。 但我们认为 CRWV 成为客户首选基础设施供应商这件事本身难度很高，产品价值就只能寄托于多云架构普及。 矛盾点在于，当下最有可能采纳 Forge 的 AI 原生初创公司，恰恰很少会搭建真正的多云架构。 根据我们的行业观察，初创公司这类小型机构，大多只会使用单一云平台；多云架构更多出现在大型公司内部，大型公司更多出于冗余备份、降低供应商集中风险而选择多云，但这并不是 Forge 现阶段瞄准的核心客群。 就算 CoreWeave 无法成长为独立软件巨头，Forge 依旧存在多种可以兑现商业价值的路径。 它有机会降低基础设施业务的新客户获客成本；当 GPU 合约到期释放闲置算力之后，拉动竞价算力资源的需求；改善利润率以及基础设施业务的投资回报率等等。 但 CoreWeave 才刚刚踏上这条转型道路。 结合我们对其核心主业的判断以及业务当前体量，我们需要看到实实在在的财务落地证据，才会对这家公司转向更加乐观的观点。 投资启示 我们对 CRWV 维持跑输大盘评级，目标价 74 美元。 CRWV 当前确实受益于数据中心市场算力供给紧张的现状，供给短缺问题目前依旧客观存在。 但我们预判未来算力供给会逐步宽松，到那个时候，CoreWeave 会是最先受到冲击，且受冲击程度最深的企业之一。 我们采用 25.5 倍 EV/EBIT 倍数对公司完成估值。#文字观点", "publish_time": "2026-10-05 09:06", "tags": ["文字观点"]}, "post:2026-10-05T11-22:0b54a6985ff5": {"id": "post:2026-10-05T11-22:0b54a6985ff5", "kind": "post", "title": "2026-10-05 11:22", "source_label": "帖子正文", "excerpt": "SpaceX 与 xAI：10GW–20GW AI 数据中心建设、Terra Fab 与供应链战略 1. 该集团目标为 10GW 算力容量，长期目标为 20GW；当前已装机容量为~1.3GW。", "content": "SpaceX 与 xAI：10GW–20GW AI 数据中心建设、Terra Fab 与供应链战略 1. 该集团目标为 10GW 算力容量，长期目标为 20GW；当前已装机容量为~1.3GW。 2. 初期 10GW 容量中，60%将内部分配给 xAI、SpaceX 和 Tesla，40%提供给 Anthropic 和 Google 等外部客户。 3. 三条长期基础设施路径包括地面数据中心、2027 年底发射的 Star Mine 太空数据中心，以及 2028 年部署的月球数据中心。 4. Terra Fab 将仅面向内部使用制造专有 ASIC，此举源于此前亚洲零部件采购中断及地缘政治风险。 5. 该集团维持一支 43 人的供应链团队，并对 GPU 等关键硬件保持 20%–40%的库存缓冲。 6. 主要数据中心选址为 Memphis/Southaven，规划容量 10–12GW；Texas 厂址已获批土地和许可，但尚未开工。 7. 燃气轮机被选为主要电力来源；固体氧化物燃料电池计划于 2029 年用于 Terra Fab。 8. Memphis 和 Mississippi 厂址采用多元化电力组合：电网 3.6–4GW、燃气轮机 4GW、Tesla 太阳能 2GW、Megapack 备用 2GW。 9. 近期的主要瓶颈在于 PCB、光模块、变压器和散热硬件，受原材料、设备和劳动力短缺制约。 10. CCL/PCB 供应高度依赖中国大陆和台湾；从 C 供应商采购光学元件需要通过第三方进行间接采购。#文字观点", "publish_time": "2026-10-05 11:22", "tags": ["文字观点"]}, "attachment:files/Bernstein-在线旅游：我们与 DirectBooker 创始人 Sanjay Vakil 开展 AI 与在线旅游平台辩论的核心要点 Online Travel：Key takeaways from our AI vs OTA debate with Founder of DirectBooker, Sanjay Vakil.pdf": {"id": "attachment:files/Bernstein-在线旅游：我们与 DirectBooker 创始人 Sanjay Vakil 开展 AI 与在线旅游平台辩论的核心要点 Online Travel：Key takeaways from our AI vs OTA debate with Founder of DirectBooker, Sanjay Vakil.pdf", "kind": "attachment", "title": "Bernstein-在线旅游：我们与 DirectBooker 创始人 Sanjay Vakil 开展 AI 与在线旅游平台辩论的核心要点 Online Travel：Key takeaways from our AI vs OTA debate with Founder of DirectBooker, Sanjay Vakil", "source_label": "Bernstein", "excerpt": "2 October 2026 Global Hotels & Leisure Online Travel: Key takeaways from our AI vs OTA debate with Founder of DirectBooker, Sanjay Vakil Richard J. Clarke, FCA +44 20 7676 6850 ric", "content": "2 October 2026 Global Hotels & Leisure Online Travel: Key takeaways from our AI vs OTA debate with Founder of DirectBooker, Sanjay Vakil Richard J. Clarke, FCA +44 20 7676 6850 richard.clarke@bernsteinsg.com Niall Mitchelson +44 20 7676 7144 niall.mitchelson@bernsteinsg.com Lasith Siriwardana +44 20 7550 2191 lasith.siriwardana@bernsteinsg.comWe recently hosted a webinar with Sanjay Vakil, the Founder of DirectBooker with prior experience at Google Hotels and TripAdvisor (replay ). We discussed the impact of AI agents on travel distribution, recent changes to Google’s hotels product as a result of the DMA, and whether short-term rental platforms are naturally insulated from AI risk. AI Agents are the next big thing - the trust barrier is overstated. Sanjay believes that AI agents have fundamentally transformed the consumer perception of AI from research tools to action tools. He expects utilization to increase as perception continues to shift and agents become more powerful. He drew parallels between the dawn of agents and internet: financial infrastructure developed to process payments online whilst protecting consumers. He expects the same to happen with agents, with systems to authenticate payments and precautions, such as one-time card details, to prevent erroneous spending. Chat is not necessarily a suboptimal user interface. Sanjay disagreed with the prevailing view that chat is a suboptimal UI for travel booking. Industry leaders have argued that visual features such as images and filter boxes are necessary in travel and ill-suited to chat-based UIs. Sanjay argued that today’s picture heavy UI adds little value and cited the use of chat to conduct e-commerce in markets such as India. An agent which suggests a few, tailored options can thrive on a chat-based UI. The value of an aggregation layer. Sanjay was an ardent defender of an aggregation layer under agentic travel search. Without one, agents must crawl hundreds of relevant hotel websites. The computational costs of this are enormous - doubling the quantity of content to parse quadruples the computation demands. Therefore, having an agent parse every hotel website in Paris would be significantly more costly than having an aggregation layer suggest a shortlist of hotels from which is can sub-select inventory to suggest to users. OTAs are designed for consumer search, they are a poor aggregation layer for agents. OTAs offer a “bundle of trust“ to consumers - they provide rates, reviews, information on inventory and a booking mechanism that consumers have faith in. This is less valuable for agents who can source different information from the most reliable source (i.e. reviews from T ripAdvisor, room details from hotel websites). He expects ultimately agents will charge commission, as agentic “clicks” are too numerous to charge for. He challenged some features OTAs usually cited as moats; he sees loyalty as providing limited value to consumers and argued that OTAs have little data advantage over agents. Changes to Google’s hotels product as a result of the DMA are likely to persist. Sanjay said that hotels are seeing a material decline in traffic directly from Google as a result of DMA changes, with some small hotel chains seeing declines of ~30%. He expects the changes to the UI to persist and soon apply to AI mode / overviews, citing that project managers at Google will be focused on AI-projects instead. The Short-Term Rental platforms are naturally insulated. There is a far shorter list of potential providers of STR suggestions, and few have an effective direct option. See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website.www.bernsteinresearch.com First Published: 02 Oct 2026 07:19 UTC Completion Date: 02 Oct 2026 07:19 UTC on 02-Oct-2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Richard J. Clarke, FCA +44 20 7676 6850 richard.clarke@bernsteinsg.com 2 October 2026 BERNSTEIN TICKER TABLE 1 Oct 2026 TTM Adjusted EPS Adjusted P/E (x) Closing Price Rel. Ticker Rating Cur Price Target Perf. Cur 2025A 2026E 2027E 2025A 2026E 2027E ABNB (Airbnb ) O USD 160.47 217.00 17.0% USD 4.03 5.37 6.58 39.8 29.9 24.4 BKNG (Booking) M USD 160.28 188.00 (39.3)% USD 9.12 10.44 12.05 17.6 15.3 13.3 EXPE (Expedia) M USD 262.67 310.00 6.3% USD 15.86 21.14 24.22 16.6 12.4 10.8 TRIP (T ripAdvisor) O USD 8.38 20.00 (61.0)% USD 1.27 0.75 1.91 6.6 11.1 4.4 SPX 7,666.45 O - Outperform, M - Market-Perform, U - Underperform, NR - Not Rated, CS - Coverage Suspended Source: Bloomberg, Bernstein estimates and analysis. INVESTMENT IMPLICATIONS OUR RECENT RESEARCH ON ONLINE TRAVEL: Online T ravel: AI Agents are here. Who wins now? Online T ravel: UX Wars - AI Agents show the future, DMA means Google steps back to the past Online T ravel: Deep dive into the top of the funnel. The last Google Hotels analysis worth doing? OTAs: Google didn't kill the OTAs, so why might AI? We rate Airbnb and T ripAdvisor Outperform, Booking and Expedia Market-Perform. GLOBAL HOTELS & LEISURE 2 on 02-Oct-2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Richard J. Clarke, FCA +44 20 7676 6850 richard.clarke@bernsteinsg.com 2 October 2026 DETAILS The new generation of agents. •Instinct and Muse have shown the consumer that AI is not just a tool for research but also for doing things. As agents become faster, more powerful and reliable, consumers will utilize them more and more. •The new agents, particularly Instinct, positions itself for permissions aggressively, asking for calendar access and personal details. •Sanjay expects that trust concerns with agents will reduce over time. He cites the initial trust concern with the internet from consumers, who were wary of giving websites their personal details and card details. He expects the technological and financial infrastructure to create solutions which engender trust just as Stripe and PayPal did for internet payments. For example, banks/payment companies may create one-off payment details which can be used for a particular transaction to limit further erroneous spending by an agent. •Sanjay pushes back against the criticism of the chat-based UI currently favored by agents. He argues that much of the UI under the current travel distribution paradigm (i.e. pictures of hotels) doesn’t add that much value to the consumer and that e-commerce happens through chat in many large markets (i.e. India). Perhaps a search paradigm where an agent provides a limited number of option is suited to chat, especially if an agents recommendations are high-quality and personalized. The value of an aggregation layer. •Sanjay was an ardent defender of the aggregation layer in an agentic distribution landscape. He argued that the scaling of compute costs with content parsed means that agents can’t feasibly scrape every single hotel website for a given search (i.e. 2,600 direct hotel booking websites for a hotel in Paris search). This necessitates an aggregation layer to deliver a shortlist of hotels to the agent which it can sub-select from and reapproach for new options given user feedback. •He believes aggregation layers will make money through a commission. This commission rate will be small given that “clicks” are low intent and derived from agents rather than humans. •Importantly, he doesn’t think OTAs are well-placed to dominate this aggregation layer. He believes that OTAs provide a compelling “trust bundle” for consumers - they have strong brands that supply rates, room types, information on hotels, reviews and a booking mechanism. In an agentic world, the availability of this information in one place is less valuable as agents can conveniently source the relevant information from the best platform (i.e. T ripadvisor for reviews, Google maps for location). •Sanjay believes that the traditional defenses against agentic disruption cited by OTAs, such as being the merchant or record, their large base of data on travelers, and loyalty schemes, don't actually provide that much insulation. He believes that lots of platforms can be merchants of record, and do so at 0% commission rates. Although OTAs do have lots of data, this data is across lots of different trips by lots of different travelers. The most commercial data is user specific such as knowing their preferences. He believes agents will be able to build must more detailed pictures of their users’ preferences than OTAs. •The OTA ads-business is threatened by the rise of agentic search in travel. He believes agents will take a dim view of sponsored listings when interrogating sources of supply. DirectBooker have found ways of influencing agents which OTAs may be able to uncover. Google and the DMA. •Sanjay said his partners through DirectBooker are seeing a significant decline in direct traffic from Google Hotels are a result for changes to the Google Hotels UI because of the DMA - some small European hotel chains have seen declines as large as 30%. •He believes that these changes to the UI are likely to persist - project managers at Google are judged on the AI projects they work so will be unwilling to commit time and effort to improving the UI within the constraints of the DMA. He also expects the DMA changes to extend to AI mode and AI overviews in the near-term future. Price Parity. GLOBAL HOTELS & LEISURE 3 on 02-Oct-2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Richard J. Clarke, FCA +44 20 7676 6850 richard.clarke@bernsteinsg.com 2 October 2026 •Sanjay emphasized that price parity is not a legal obligation but rather a contractual agreement between OTAs and their supply partners. •He believes that price party agreements may influence agentic travel search if the product appears like a meta product but if agents are treated by the regulators like humans conducting a manual search, price parity agreements are unlikely to hold. He was unsure how aggressively the OTAs will pursue price parity clauses with agentic travel search, and he urged suppliers to hold strong arguing that consumers ultimately do want to book direct. Short-term rentals. •The nature of short-term rental booking insulates platforms from the risks associated with agents. Sanjay argued that there is no reliable way of booking a short-term rental direct - consumers need a platform that can sit in the middle of the transactions who they can “hang their hat on” . Furthermore, STR booking is less about price comparison and inventory is unique to platforms making it much more difficult to be an aggregator. GLOBAL HOTELS & LEISURE 4 on 02-Oct-2026 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 Richard J. Clarke, FCA +44 20 7676 6850 richard.clarke@bernsteinsg.com 2 October 2026 DISCLOSURE APPENDIX I. REQUIRED DISCLOSURES References to \"Bernstein\" or the “Firm” in these disclosures relate to the following entities: Bernstein Institutional Services LLC (April 1, 2024 onwards), Sanford C. Bernstein & Co., LLC (pre April 1, 2024), Bernstein Autonomous LLP, BSG France S.A. (April 1, 2024 onwards), Sanford C. Bernstein (Hong Kong) Limited 盛博香港有限公司, Sanford C. Bernstein (Canada) Limited, Sanford C. Bernstein (India) Private Limited (SEBI registration no. INH000006378), Sanford C. Bernstein (Singapore) Private Limited, Sanford C. Bernstein Japan KK (サンフォード・C・バーンスタイン株式会社) and analysts employed by Société Générale Africa T ec  7628 布调价 1.5 元/米至 13-13.3 元/米。\n\n## 二、今日最强主线\n\n- **AI 算力/大模型**\n  - 今天强化的逻辑：Gemini 4 Argon 发布后，讨论集中在“纸面实力”与谷歌算力到服务自闭环的稳定性；全行业 C 端订阅涨价/缩配额，算力是硬约束；美国开源权重模型与 Nvidia GPU 结合，可能为个人和公司提供替代 Anthropic、OpenAI 和 Google 的更廉价选择。\n  - 今天出现的催化/验证：Gemini 4 Argon 于 9 月 30 日发布；SpaceX 与 xAI 目标为 10GW 算力容量、长期目标 20GW，当前已装机容量约 1.3GW；Reflection 正准备通过一套强大的开源权重系统撼动 AI 竞赛；微软新版 M Copilot 依托 Home、Code 和 Autopilot 统一网页、Windows 及移动端入口，向 AI 操作系统方向演进，约 5000 人参与为期 50 天的内部测试。\n\n- **半导体/存储**\n  - 今天强化的逻辑：对存储器板块表达温和乐观，DDR4 现货价格继续上涨；通用 DRAM 和 NAND 价格涨幅分别为 20% 和 10%；韩国 8 月 DRAM 出口环比增长 11%、同比增长 412%；8 月全球半导体资本设备追踪显示日本 SPE 同比增长 50%。\n  - 今天出现的催化/验证：高盛对存储器板块的温和乐观看法；DDR4 现货价格环比 +5%、较合约价溢价 44%；长江存储预计 NAND 闪存短缺还将持续三年；英伟达合作伙伴鸿海因人工智能热潮销售额超出预期。\n\n- **液冷/散热/电源**\n  - 今天强化的逻辑：AI 专用集成电路以及 GPU 系统均出现散热规格加速升级趋势，产品价值提升幅度超出投资者预期；芯片板卡采用垂直供电架构之后，芯片背面也需要配置冷板实现散热，因此催生了全新的双面设计；VRU 散热单机价值相比 VR200 可实现约 50% 的提升，而此前市场受规格降级担忧影响，预期散热单机价值持平甚至下滑。\n  - 今天出现的催化/验证：散热零组件观察显示英伟达下一代 VR Ultra（VRU）表现尤为突出；液冷产业链梳理判断整体比较看好液冷明年的产业趋势，核心催化在于英伟达 Rubin 。\n\n- **PCB/CCL/铜箔**\n  - 今天强化的逻辑：市场部分观点认为英伟达将在 VR300 NVL576 交换托盘中采用碳氢树脂（HC）替代 PTFE，但 PTFE 混压仍是目前测试中最领先的方案；HC 仅于近期通过信号完整性（SI）测试，尚未进入 PCB 量产（MP）测试，近期测试的 HC 方案同样采用混压结构，即 HC + ABF/M9（Q-glass）；PCB 设计复杂度提升至 50 层以上或 HDI 方案，CCL 升级至 M8/M9 材料甚至 PTE 材料，代表每一代产品的 ASP 至少提升 50%。\n  - 今天出现的催化/验证：关于 PTFE 与 HC 思考的总结指出，HC 混合材料在认证方面落后 PTFE 混合材料约 3 个月，最终料决定预计在年底做出；Advanced Materials - PCB & CCL 重启对 PCB/CCL 行业的覆盖，重点聚焦谷歌 TPU 供应链，预测到 2025 至 2026 年 TPU 总出货量将增长两倍以上，超过其他竞争；10 月电子纱、电子布迎来新一轮涨价。\n\n- **光通信/CPO**\n  - 今天强化的逻辑：FCC 针对中国制光模块的政策（可能是 3.2T 规格）不会对中际旭创造成影响，甚至会带来利好；美国根本无太大意愿搞组装；龙头光模块其实已经拿到上游激光和 DSP，真正利空的是二线光模块厂；光模块毛利率会下降，因为 DSP 和激光的重要性会越来越高。\n  - 今天出现的催化/验证：测试和测量设备，甚至一些激光器和功率计的交货期长达一年，需求如此巨大；对于 CPO 测试，尚未完全准备好减少测试时间或将其作为首要重点，但所有道路最终都会通向那里。\n\n- **宏观/策略与商业航天**\n  - 今天强化的逻辑：下周全球市场将迎来多重重磅事件交织，国内 A 股将于 10 月 8 日结束国庆长假开市；G7 联合释放 1 亿桶战略油储与中东地缘局势动向将加剧能源市场波动；美联储加息预期降温，新兴市场资产上涨，油价下跌。\n  - 今天出现的催化/验证：国庆前三天全社会跨区域人员流动量同比下滑 0.42%，铁路客运量同比下滑 1%，民航客运量同比下滑 2.66%，商务部重点监测的 78 个步行街（商圈）客流量、营业额同比分别增长 3.4%、5.3%；马斯克回复确认“SpaceXAI”将更名为“SpaceXSI”。\n\n## 三、今日重点关注\n\n### 3.1 今天已经发生的重点变化\n\n- **Gemini 4 Argon 发布及初步分析**：9 月 30 日发布，单次输出上限 100 万 token，18 项基准 12 项领先，但被评价为“纸面实力”；谷歌此次发布的核心意义被解读为稳住内外信心、为技术转型赢得追赶窗口。\n- **存储板块观点与数据**：DDR4 现货价格环比上涨 5%、较合约价溢价 44%；通用 DRAM 和 NAND 价格涨幅分别为 20% 和 10%；韩国 8 月 DRAM 出口环比增长 11%、同比增长 412%；长江存储预计 NAND 闪存短缺还将持续三年。\n- **散热规格升级**：英伟达 VRU 与 ASIC 散热升级加速，支撑热设计功耗持续提升；VRU 散热单机价值相比 VR200 可实现约 50% 提升。\n- **PCB/CCL 材料路线讨论**：PTFE 混合材料仍是 Nvidia VR300 NVL576 交换板最可能的 PCB 解决方案；HC 混合材料最近通过 SI 测试，认证落后约 3 个月，目前未进入 PCB 量产测试；最终料决定预计在年底做出。\n- **电子纱/电子布涨价**：进入 10 月份，主流企业电子纱 G75 调价 3000 元/吨，报价达 25800-26000 元/吨；电子布 7628 布调价 1.5 元/米，报价达 13-13.3 元/米。\n- **华为与高通达成协议**：10 月 5 日宣布达成一项为期多年、范围广泛的专利许可协议，内容包括双方在 5G、计算、人工智能和网络等多个领域的专利组合交叉许可，以及高通将收购华为部分美国专利，该交易将在获得必要的监管批准后完成。\n- **半导体供应链动态**：AMD CEO 苏姿丰到访台湾以确保公司在台湾的封装、测试和基板供应链安全；台积电在台湾上市的股票创下历史新高；SKC 再增资 18.4 亿人民币以抗衡中国玻璃基板的领先优势。\n- **商业航天/算力**：马斯克确认“SpaceXAI”将更名为“SpaceXSI”；SpaceX 与 xAI 目标为 10GW 算力容量、长期目标 20GW，当前已装机容量约 1.3GW。\n- **宏观与监管动态**：特朗普助手哈塞特表示鲍威尔应该“离开”美联储理事会；贝森特称将寻求与中国建立 AI 风险双边通报机制；英国预计将效仿欧盟对中国电动汽车征收关税；OpenAI 首席执行官奥尔特曼称 OpenAI 和 Anthropic 在人工智能监管立场上存在很大不同；据彭博行业研究报道，过去几个月随着 DeepSeek 等实验室取得进展，美国人工智能公司对中国的领先优势急剧缩小至历史新低。\n- **国庆消费高频数据**：国庆前三天全社会跨区域人员流动量同比下滑 0.42%，铁路客运量同比下滑 1%，民航客运量同比下滑 2.66%；商务部重点监测的 78 个步行街（商圈）客流量、营业额同比分别增长 3.4%、5.3%；预计 10 月 4 日全社会跨区域人员流动量 30619 万人次，同比增长 1.6%，其中铁路客运量预计 2035 万人次，同比增长 11.0%；9 月 30 日至 10 月 3 日日均民航旅客量 240.7 万，同比 -1.7%，日均铁路旅客量 2119.6 万，同比 +7.3%。\n\n### 3.2 接下来要继续跟踪的验证点/催化点\n\n- **PCB/CCL 最终料决定**：VR300 NVL576 交换板 PTFE 与 HC 路线选择的最终料决定预计在年底做出，HC 认证进度与量产测试进展是后续验证点。\n- **液冷产业链放量节奏**：英伟达 Rubin 。\n- **谷歌 TPU 供应链出货预测验证**：2025 至 2026 年 TPU 总出货量增长两倍以上的预测，以及该供应链在 2028 年及以后实现最强劲、可持续增长的可能性。\n- **光通信外部政策与供需**：FCC 针对中国制光模块政策（可能是 3.2T 规格）的落地影响；测试和测量设备、激光器和功率计交货期长达一年的供需紧张状况。\n- **存储周期**：NAND 闪存短缺是否如长江存储预计的“还将持续三年”，以及 DDR4 现货价较合约价溢价 44% 的后续变化。\n- **宏观事件窗口**：美联储决议、G7 联合释放 1 亿桶战略油储、中东地缘局势、A 股 10 月 8 日结束国庆长假开市。\n- **国庆假期消费数据**：假期后续日度的交通出行、零售与免税数据变化。\n- **算力建设进度**：SpaceX 与 xAI 10GW-20GW 算力容量目标的推进，当前已装机容量约 1.3GW。\n- **华为与高通交易**：该交易将在获得必要的监管批准后完成，监管审批进展是后续跟踪点。\n- **CoreWeave 评级与生态建设**：对 CRWV 维持跑输大盘评级、目标价 74 美元，其首届 Fully Connected 大会后的。\n\n## 四、高价值内容摘录\n\n### 文字观点\n- 09:05｜散热零组件：英伟达 VRU 与 ASIC 散热升级加速，支撑热设计功耗持续提升 我们观察到 AI 专用集成电路以及 GPU 系统均出现散热规格加速升级的趋势，产品价值提升幅度超出投资者预期，英伟达下一代 VR Ultra（VRU）表现尤为突出，这与近期市场担心规格降级的观点相反。我们依旧认为，散热是制约全部 AI 芯片热设计功耗继续提升、AI 服务器系统迭代迁移的核心瓶颈。\n- 09:06｜马斯克称“SpaceXAI”将更名为“SpaceXSI” 10月4日｜在X。马斯克回复称“是的，我们会做出这个改变”。\n- 09:06｜下周大事提醒丨美联储决议、地缘巨震与A股节后第一枪 10月4日｜下周全球市场将迎来多重重磅事件交织。国内市场方面，A股将于10月8日(周四)结束国庆长假开市。\n- 09:06｜SKC再增资18.4亿人民币以抗衡中国玻璃基板的领先优势#文字观点\n- 09:06｜CoreWeave—— 来自 CRWV Fully Connected 大会的思考：战略或许有所优化，但前路依旧漫长 CRWV 本周在旧金山举办首届 Fully Connected 大会，参会对象主要面向 AI 工程师、。这是一次明确的营销活动，试图围绕自身。\n- 09:06｜谷歌：Gemini 4 Argon 能否让谷歌重振雄风？周三，谷歌发布全新前沿模型 Gemini 4 Argon。\n- 09:07｜芒果超媒：《后西游记》战天宫篇6-7集观感更新【中信传媒】 《后西游记》战天宫篇6-7集观感较此前进一步改善，场景丰富度与角色辨识度均有所提升。地府、天宫呈现了更多不同场景，环境细节更加精细，大招特效也更为丰富\n- 11:18｜特朗普助手哈塞特表示，鲍威尔应该“离开”美联储理事会。\n- 11:18｜美联储加息预期降温，新兴市场资产上涨，油价下跌\n- 11:18｜东南亚以及中国、日本和韩国比大多数经济体更容易受到人工智能繁荣可能崩溃的影响，这可能会引发金融市场和实体经济的冲击。\n- 11:19｜《泰晤士报》称，英国预计将效仿欧盟对中国电动汽车征收关税。\n- 11:19｜据彭博行业研究报道，过去几个月，随着 DeepSeek 等实验室取得进展，美国人工智能公司对中国的领先优势急剧缩小至历史新低\n\n### 附件正文\n- Bernstein-全球半导体资本设备：26 年 8 月半导体追踪报告，日本 SPE 同比增长 50% Global Semiconductor Capital Equipment Global Semicap Tracker (Aug 26)：Japan SPE +50% YoY｜2 October 2026 Global Semiconductor Capital Equipment Global Semicap Tracker (Aug 26): Japan SPE +50% YoY David Dai, CFA +852 2918 5704 david.dai@bernsteinsg.com Stacy A. Rasgon, Ph.D. +1 213 559 5917 stacy.rasgon@bernst\n- Bernstein-在线旅游：我们与 DirectBooker 创始人 Sanjay Vakil 开展 AI 与在线旅游\n- Bernstein-美国IT硬件：硬盘驱动器（STX、WDC）——东芝风波，杯中风暴｜press release Nikkei reported First Published: 02 Oct 2026 20:14 UTC Completion Date: 02 Oct 2026 20:14 UTCwww.bernsteinresearch.com . Global Research Disclosure Website important information. Alternatively, visit our Se\n- 液冷产业链梳理｜一、全文总结 1. 总体判断与产业趋势 整体比较看好液冷明年的产业趋势，核心催化在于英伟达 Rubin 。除总量扩张外，后续部分环节可能出现供不应求，同时存在国产化替代机会，产业链整体的价值量还有进一步抬升的空间。\n\n## 五、stocks.json关注标的摘要\n\n当天没有形成有效的 stocks.json 命中证据。\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Gemini 4 Argon 发布成为 AI 主线焦点\u003c/strong>：9 月 30 日发布，距上次大改款近一年，打破“谷歌只做 Flash 小模型”的猜疑；单次输出上限拉至 100 万 token，18 项基准中 12 项领先（Harvey 法律、DeepSWE、Zapier 自动化等大幅甩开 GPT-6 Astra 和 Opus 5.5），但被评价为“还只是纸面实力”。\u003c/li>\n\u003cli>\u003cstrong>算力硬约束下全行业 C 端订阅涨价/缩配额\u003c/strong>：OpenAI 200 美元套餐用户月消耗 token 价值曾达 4000+ 美元，严重亏损，重开后配额减半并新开 500 美元套餐；C 端有 OpenAI、B 端有 Anthropic，抢份额概率低，谷歌真正差异点是算力到服务自闭环带来的稳定性。\u003c/li>\n\u003cli>\u003cstrong>存储价格与出口数据同步强化\u003c/strong>：DDR4 现货价格继续上涨，环比上涨 5%，现货价格较合约价溢价 44%；通用 DRAM 和 NAND 价格涨幅分别为 20% 和 10%；韩国 8 月 DRAM 出口环比增长 11%、同比增长 412%；长江存储预计 NAND 闪存短缺还将持续三年。\u003c/li>\n\u003cli>\u003cstrong>散热规格升级超预期，液冷明年核心催化明确\u003c/strong>：英伟达下一代 VR Ultra（VRU）表现突出，与近期市场担心规格降级的观点相反；芯片板卡采用垂直供电架构后芯片背面也需配置冷板，形成双面设计，VRU 散热单机价值相比 VR200 可提升约 50%；液冷明年核心催化在于英伟达 Rubin 。\u003c/li>\n\u003cli>\u003cstrong>PCB/CCL 材料路线与成本端同步出现变化\u003c/strong>：市场部分观点认为英伟达将在 VR300 NVL576 交换托盘中采用碳氢树脂（HC）替代 PTFE，但 PTFE 混压仍是目前测试中最领先方案，HC 最近通过 SI 测试、认证落后约 3 个月、尚未进入 PCB 量产测试，最终料决定预计年底做出；进入 10 月电子纱 G75 调价 3000 元/吨至 25800-26000 元/吨，电子布 7628 布调价 1.5 元/米至 13-13.3 元/米。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI 算力/大模型\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：Gemini 4 Argon 发布后，讨论集中在“纸面实力”与谷歌算力到服务自闭环的稳定性；全行业 C 端订阅涨价/缩配额，算力是硬约束；美国开源权重模型与 Nvidia GPU 结合，可能为个人和公司提供替代 Anthropic、OpenAI 和 Google 的更廉价选择。\u003c/li>\n\u003cli>今天出现的催化/验证：Gemini 4 Argon 于 9 月 30 日发布；SpaceX 与 xAI 目标为 10GW 算力容量、长期目标 20GW，当前已装机容量约 1.3GW；Reflection 正准备通过一套强大的开源权重系统撼动 AI 竞赛；微软新版 M Copilot 依托 Home、Code 和 Autopilot 统一网页、Windows 及移动端入口，向 AI 操作系统方向演进，约 5000 人参与为期 50 天的内部测试。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体/存储\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：对存储器板块表达温和乐观，DDR4 现货价格继续上涨；通用 DRAM 和 NAND 价格涨幅分别为 20% 和 10%；韩国 8 月 DRAM 出口环比增长 11%、同比增长 412%；8 月全球半导体资本设备追踪显示日本 SPE 同比增长 50%。\u003c/li>\n\u003cli>今天出现的催化/验证：高盛对存储器板块的温和乐观看法；DDR4 现货价格环比 +5%、较合约价溢价 44%；长江存储预计 NAND 闪存短缺还将持续三年；英伟达合作伙伴鸿海因人工智能热潮销售额超出预期。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>液冷/散热/电源\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI 专用集成电路以及 GPU 系统均出现散热规格加速升级趋势，产品价值提升幅度超出投资者预期；芯片板卡采用垂直供电架构之后，芯片背面也需要配置冷板实现散热，因此催生了全新的双面设计；VRU 散热单机价值相比 VR200 可实现约 50% 的提升，而此前市场受规格降级担忧影响，预期散热单机价值持平甚至下滑。\u003c/li>\n\u003cli>今天出现的催化/验证：散热零组件观察显示英伟达下一代 VR Ultra（VRU）表现尤为突出；液冷产业链梳理判断整体比较看好液冷明年的产业趋势，核心催化在于英伟达 Rubin 。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：市场部分观点认为英伟达将在 VR300 NVL576 交换托盘中采用碳氢树脂（HC）替代 PTFE，但 PTFE 混压仍是目前测试中最领先的方案；HC 仅于近期通过信号完整性（SI）测试，尚未进入 PCB 量产（MP）测试，近期测试的 HC 方案同样采用混压结构，即 HC + ABF/M9（Q-glass）；PCB 设计复杂度提升至 50 层以上或 HDI 方案，CCL 升级至 M8/M9 材料甚至 PTE 材料，代表每一代产品的 ASP 至少提升 50%。\u003c/li>\n\u003cli>今天出现的催化/验证：关于 PTFE 与 HC 思考的总结指出，HC 混合材料在认证方面落后 PTFE 混合材料约 3 个月，最终料决定预计在年底做出；Advanced Materials - PCB &amp; CCL 重启对 PCB/CCL 行业的覆盖，重点聚焦谷歌 TPU 供应链，预测到 2025 至 2026 年 TPU 总出货量将增长两倍以上，超过其他竞争；10 月电子纱、电子布迎来新一轮涨价。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：FCC 针对中国制光模块的政策（可能是 3.2T 规格）不会对中际旭创造成影响，甚至会带来利好；美国根本无太大意愿搞组装；龙头光模块其实已经拿到上游激光和 DSP，真正利空的是二线光模块厂；光模块毛利率会下降，因为 DSP 和激光的重要性会越来越高。\u003c/li>\n\u003cli>今天出现的催化/验证：测试和测量设备，甚至一些激光器和功率计的交货期长达一年，需求如此巨大；对于 CPO 测试，尚未完全准备好减少测试时间或将其作为首要重点，但所有道路最终都会通向那里。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观/策略与商业航天\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：下周全球市场将迎来多重重磅事件交织，国内 A 股将于 10 月 8 日结束国庆长假开市；G7 联合释放 1 亿桶战略油储与中东地缘局势动向将加剧能源市场波动；美联储加息预期降温，新兴市场资产上涨，油价下跌。\u003c/li>\n\u003cli>今天出现的催化/验证：国庆前三天全社会跨区域人员流动量同比下滑 0.42%，铁路客运量同比下滑 1%，民航客运量同比下滑 2.66%，商务部重点监测的 78 个步行街（商圈）客流量、营业额同比分别增长 3.4%、5.3%；马斯克回复确认“SpaceXAI”将更名为“SpaceXSI”。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Gemini 4 Argon 发布及初步分析\u003c/strong>：9 月 30 日发布，单次输出上限 100 万 token，18 项基准 12 项领先，但被评价为“纸面实力”；谷歌此次发布的核心意义被解读为稳住内外信心、为技术转型赢得追赶窗口。\u003c/li>\n\u003cli>\u003cstrong>存储板块观点与数据\u003c/strong>：DDR4 现货价格环比上涨 5%、较合约价溢价 44%；通用 DRAM 和 NAND 价格涨幅分别为 20% 和 10%；韩国 8 月 DRAM 出口环比增长 11%、同比增长 412%；长江存储预计 NAND 闪存短缺还将持续三年。\u003c/li>\n\u003cli>\u003cstrong>散热规格升级\u003c/strong>：英伟达 VRU 与 ASIC 散热升级加速，支撑热设计功耗持续提升；VRU 散热单机价值相比 VR200 可实现约 50% 提升。\u003c/li>\n\u003cli>\u003cstrong>PCB/CCL 材料路线讨论\u003c/strong>：PTFE 混合材料仍是 Nvidia VR300 NVL576 交换板最可能的 PCB 解决方案；HC 混合材料最近通过 SI 测试，认证落后约 3 个月，目前未进入 PCB 量产测试；最终料决定预计在年底做出。\u003c/li>\n\u003cli>\u003cstrong>电子纱/电子布涨价\u003c/strong>：进入 10 月份，主流企业电子纱 G75 调价 3000 元/吨，报价达 25800-26000 元/吨；电子布 7628 布调价 1.5 元/米，报价达 13-13.3 元/米。\u003c/li>\n\u003cli>\u003cstrong>华为与高通达成协议\u003c/strong>：10 月 5 日宣布达成一项为期多年、范围广泛的专利许可协议，内容包括双方在 5G、计算、人工智能和网络等多个领域的专利组合交叉许可，以及高通将收购华为部分美国专利，该交易将在获得必要的监管批准后完成。\u003c/li>\n\u003cli>\u003cstrong>半导体供应链动态\u003c/strong>：AMD CEO 苏姿丰到访台湾以确保公司在台湾的封装、测试和基板供应链安全；台积电在台湾上市的股票创下历史新高；SKC 再增资 18.4 亿人民币以抗衡中国玻璃基板的领先优势。\u003c/li>\n\u003cli>\u003cstrong>商业航天/算力\u003c/strong>：马斯克确认“SpaceXAI”将更名为“SpaceXSI”；SpaceX 与 xAI 目标为 10GW 算力容量、长期目标 20GW，当前已装机容量约 1.3GW。\u003c/li>\n\u003cli>\u003cstrong>宏观与监管动态\u003c/strong>：特朗普助手哈塞特表示鲍威尔应该“离开”美联储理事会；贝森特称将寻求与中国建立 AI 风险双边通报机制；英国预计将效仿欧盟对中国电动汽车征收关税；OpenAI 首席执行官奥尔特曼称 OpenAI 和 Anthropic 在人工智能监管立场上存在很大不同；据彭博行业研究报道，过去几个月随着 DeepSeek 等实验室取得进展，美国人工智能公司对中国的领先优势急剧缩小至历史新低。\u003c/li>\n\u003cli>\u003cstrong>国庆消费高频数据\u003c/strong>：国庆前三天全社会跨区域人员流动量同比下滑 0.42%，铁路客运量同比下滑 1%，民航客运量同比下滑 2.66%；商务部重点监测的 78 个步行街（商圈）客流量、营业额同比分别增长 3.4%、5.3%；预计 10 月 4 日全社会跨区域人员流动量 30619 万人次，同比增长 1.6%，其中铁路客运量预计 2035 万人次，同比增长 11.0%；9 月 30 日至 10 月 3 日日均民航旅客量 240.7 万，同比 -1.7%，日均铁路旅客量 2119.6 万，同比 +7.3%。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>PCB/CCL 最终料决定\u003c/strong>：VR300 NVL576 交换板 PTFE 与 HC 路线选择的最终料决定预计在年底做出，HC 认证进度与量产测试进展是后续验证点。\u003c/li>\n\u003cli>\u003cstrong>液冷产业链放量节奏\u003c/strong>：英伟达 Rubin 。\u003c/li>\n\u003cli>\u003cstrong>谷歌 TPU 供应链出货预测验证\u003c/strong>：2025 至 2026 年 TPU 总出货量增长两倍以上的预测，以及该供应链在 2028 年及以后实现最强劲、可持续增长的可能性。\u003c/li>\n\u003cli>\u003cstrong>光通信外部政策与供需\u003c/strong>：FCC 针对中国制光模块政策（可能是 3.2T 规格）的落地影响；测试和测量设备、激光器和功率计交货期长达一年的供需紧张状况。\u003c/li>\n\u003cli>\u003cstrong>存储周期\u003c/strong>：NAND 闪存短缺是否如长江存储预计的“还将持续三年”，以及 DDR4 现货价较合约价溢价 44% 的后续变化。\u003c/li>\n\u003cli>\u003cstrong>宏观事件窗口\u003c/strong>：美联储决议、G7 联合释放 1 亿桶战略油储、中东地缘局势、A 股 10 月 8 日结束国庆长假开市。\u003c/li>\n\u003cli>\u003cstrong>国庆假期消费数据\u003c/strong>：假期后续日度的交通出行、零售与免税数据变化。\u003c/li>\n\u003cli>\u003cstrong>算力建设进度\u003c/strong>：SpaceX 与 xAI 10GW-20GW 算力容量目标的推进，当前已装机容量约 1.3GW。\u003c/li>\n\u003cli>\u003cstrong>华为与高通交易\u003c/strong>：该交易将在获得必要的监管批准后完成，监管审批进展是后续跟踪点。\u003c/li>\n\u003cli>\u003cstrong>CoreWeave 评级与生态建设\u003c/strong>：对 CRWV 维持跑输大盘评级、目标价 74 美元，其首届 Fully Connected 大会后的。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>09:05｜散热零组件：英伟达 VRU 与 ASIC 散热升级加速，支撑热设计功耗持续提升 我们观察到 AI 专用集成电路以及 GPU 系统均出现散热规格加速升级的趋势，产品价值提升幅度超出投资者预期，英伟达下一代 VR Ultra（VRU）表现尤为突出，这与近期市场担心规格降级的观点相反。我们依旧认为，散热是制约全部 AI 芯片热设计功耗继续提升、AI 服务器系统迭代迁移的核心瓶颈。\u003c/li>\n\u003cli>09:06｜马斯克称“SpaceXAI”将更名为“SpaceXSI” 10月4日｜在X。马斯克回复称“是的，我们会做出这个改变”。\u003c/li>\n\u003cli>09:06｜下周大事提醒丨美联储决议、地缘巨震与A股节后第一枪 10月4日｜下周全球市场将迎来多重重磅事件交织。国内市场方面，A股将于10月8日(周四)结束国庆长假开市。\u003c/li>\n\u003cli>09:06｜SKC再增资18.4亿人民币以抗衡中国玻璃基板的领先优势#文字观点\u003c/li>\n\u003cli>09:06｜CoreWeave—— 来自 CRWV Fully Connected 大会的思考：战略或许有所优化，但前路依旧漫长 CRWV 本周在旧金山举办首届 Fully Connected 大会，参会对象主要面向 AI 工程师、。这是一次明确的营销活动，试图围绕自身。\u003c/li>\n\u003cli>09:06｜谷歌：Gemini 4 Argon 能否让谷歌重振雄风？周三，谷歌发布全新前沿模型 Gemini 4 Argon。\u003c/li>\n\u003cli>09:07｜芒果超媒：《后西游记》战天宫篇6-7集观感更新【中信传媒】 《后西游记》战天宫篇6-7集观感较此前进一步改善，场景丰富度与角色辨识度均有所提升。地府、天宫呈现了更多不同场景，环境细节更加精细，大招特效也更为丰富\u003c/li>\n\u003cli>11:18｜特朗普助手哈塞特表示，鲍威尔应该“离开”美联储理事会。\u003c/li>\n\u003cli>11:18｜美联储加息预期降温，新兴市场资产上涨，油价下跌\u003c/li>\n\u003cli>11:18｜东南亚以及中国、日本和韩国比大多数经济体更容易受到人工智能繁荣可能崩溃的影响，这可能会引发金融市场和实体经济的冲击。\u003c/li>\n\u003cli>11:19｜《泰晤士报》称，英国预计将效仿欧盟对中国电动汽车征收关税。\u003c/li>\n\u003cli>11:19｜据彭博行业研究报道，过去几个月，随着 DeepSeek 等实验室取得进展，美国人工智能公司对中国的领先优势急剧缩小至历史新低\u003c/li>\n\u003c/ul>\n\u003ch3>附件正文\u003c/h3>\n\u003cul>\n\u003cli>Bernstein-全球半导体资本设备：26 年 8 月半导体追踪报告，日本 SPE 同比增长 50% Global Semiconductor Capital Equipment Global Semicap Tracker (Aug 26)：Japan SPE +50% YoY｜2 October 2026 Global Semiconductor Capital Equipment Global Semicap Tracker (Aug 26): Japan SPE +50% YoY David Dai, CFA +852 2918 5704 david.dai@bernsteinsg.com Stacy A. Rasgon, Ph.D. +1 213 559 5917 stacy.rasgon@bernst\u003c/li>\n\u003cli>Bernstein-在线旅游：我们与 DirectBooker 创始人 Sanjay Vakil 开展 AI 与在线旅游\u003c/li>\n\u003cli>Bernstein-美国IT硬件：硬盘驱动器（STX、WDC）——东芝风波，杯中风暴｜press release Nikkei reported First Published: 02 Oct 2026 20:14 UTC Completion Date: 02 Oct 2026 20:14 UTCwww.bernsteinresearch.com . Global Research Disclosure Website important information. Alternatively, visit our Se\u003c/li>\n\u003cli>液冷产业链梳理｜一、全文总结 1. 总体判断与产业趋势 整体比较看好液冷明年的产业趋势，核心催化在于英伟达 Rubin 。除总量扩张外，后续部分环节可能出现供不应求，同时存在国产化替代机会，产业链整体的价值量还有进一步抬升的空间。\u003c/li>\n\u003c/ul>\n\u003ch2>五、stocks.json关注标的摘要\u003c/h2>\n\u003cp>当天没有形成有效的 stocks.json 命中证据。\u003c/p>"}</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=(v)=>Array.isArray(v)?'<ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');
document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
