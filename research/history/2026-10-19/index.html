差异化优势。 2. RSI与决策模型：叙事从概念切到可量化基准​ #RSI竞赛已从\"概念验证\"进入\"工程化冲刺\"。 O+A及谷歌三巨头正围绕RSI展开激烈角逐，模型迭代周期从季度级压缩到周度级。在最新的DeepRSI评测中，国内Kimi K3位列第三，紧随Claude Fable 5.1和GPT-6 Astra之后，表明国内在RSI赛道并非完全缺席。但差距在于：#海外已形成\"模型写代码→代码训练模型\"的完整闭环、国内尚未形成规模化工程闭环。若这一gap不能在6-12个月内收敛，海外模型的迭代效率优势或出现数量级分化。 #决策模型开辟全新赛道。继JEV以极简API和低延迟打开市场后，OpenAI快速跟进推出Decisions API，微软发布Microsoft-Decision-1，StartLux-Decision在部分基准上取得断层领先。这类模型短期落地场景清晰：订单风控、合规判断、工单路由、调度决策，比通用Agent更容易进生产系统，因为输入输出可审计、可回滚。 RSI主叙事海外领先的是研发自动化指标化，国内领先的是infra自优化+开放权重跑真实流量；决策模型会先于通用RSI在产业里变现。 3. 算力：国产栈从能跑到架构协同，出口管制进入征求意见期 ​#算力自主化取得实质性进展、但软件生态仍是短板。算力侧标志性事件是DeepSeek将TileLang适配昇腾，把GPU算子编程抽象层搬到NPU，降低上层模型对单一硬件栈的耦合；阶跃Step 5 Preview开源同步点亮1024卡Atlas 950 SuperPoD，昇腾用vLLM+Ascend C+Triton吃下稀疏注意力、MoE路由、MTP投机解码。#国产算力不再只跑\"能跑\"、开始跑\"架构级优化\"，Sparse GQA、EPD分离、序列并行这些设计直接决定国产卡能不能接旗舰模型。#海外反面是算力稀缺溢价——数据中心电力、变压器、HBM、租卡价格持续抬升，头部实验室互买算力，小厂靠预付和担保拿卡。 #出口管制从\"芯片硬件\"延伸至\"模型+算力技术\"。此前的管制主要集中在芯片硬件层面（如HBM、先进制程设备），而现在已将触角延伸至模型权重、训练算法和算力基础设施技术。同期总书记考察乌兰察布，重点了解绿色算力产业布局，释放出\"算力即国力\"的明确信号。#出口管制升级看似是\"堵\"、实则是\"疏\"，为国产算力和大模型争取宝贵的迭代窗口期。 相关标的： 【国产算力】昇腾系（华丰/#杰华特/兴森）、#寒王、海王等 【超节点】#浪潮、华勤、盛科、澜起等 【散热】#高澜、申菱、飞龙、#五洋、同飞、冰轮等 【算租/Token工厂】行云、利通、协创、智微、杰创等 【AI应用】#中控、金蝶、鼎捷、泛微、#税友等 其他：#征和工业（农机钨刀具弹性）、中胤时尚（EDA新贵）、东方材料（头部IP超精品AI漫剧）等#文字观点", "publish_time": "2026-10-19 07:58", "tags": ["海外反面是算力稀缺溢价", "杰华特", "寒王、海王", "浪潮、", "高澜", "五洋、同飞", "中控", "税友", "文字观点"]}, "post:2026-10-19T07-58:babcd13bfa5a": {"id": "post:2026-10-19T07-58:babcd13bfa5a", "kind": "post", "title": "2026-10-19 07:58", "source_label": "帖子正文", "excerpt": "【开源计算机】服务器上游系列（一）：先进封装破局后摩尔时代，玻璃基板进入量产前夕-20261018先进封装带动材料升级，玻璃基板验证与设备订单协同推进 AI芯片集成规模与互连密度持续提升，推动先进封装向大尺寸、高带宽与低损耗演进，玻璃基板凭借高平整度、可调热膨胀系数及低介电损耗，为封装升级提供新路径", "content": "【开源计算机】服务器上游系列（一）：先进封装破局后摩尔时代，玻璃基板进入量产前夕-20261018先进封装带动材料升级，玻璃基板验证与设备订单协同推进 AI芯片集成规模与互连密度持续提升，推动先进封装向大尺寸、高带宽与低损耗演进，玻璃基板凭借高平整度、可调热膨胀系数及低介电损耗，为封装升级提供新路径。产业化方面，临时载板与玻璃基IPD已形成规模供货，玻璃芯载板加快送样与客户认证，光模块FAU基板同步推进，多个应用方向梯次落地。工艺层面，TGV成孔与金属化构成核心价值环节，激光、电镀、清洗等设备已取得订单或完成交付，部分厂商实现复购。国内载板企业中试线贯通、可靠性验证与产能规划并行推进，产业正由技术验证向量产准备迈进。随着良率提升、客户认证及量产投资逐步落地，设备、材料与载板制造环节有望迎来持续成长机会。长程Agent与企业工作流加快融合，模型效率及算力生态持续升级 本周AI产业围绕长任务执行、企业应用与部署效率持续迭代。模型端，阶跃星辰开放Step 5 Preview权重，强化百万上下文与长程Agent能力；谷歌上线Gemini 4 Argon，拓展软件工程与企业复杂任务场景。应用端，腾讯WorkBuddy深度融合企业微信，打通企业数据调用、任务执行与成果交付。算力端，国产厂商推进训练集群交付、推理新品与工业AI部署，面壁MiniCPM-V 4.7同步完成多款国产芯片适配。AI应用相对表现占优，细分领域结构性机会持续显现 10月12日至10月16日，计算机指数周度变动为-5.02%，同期沪深300、上证指数、创业板指及科创50分别变动-3.40%、-2.56%、-8.90%和-6.77%，计算机板块相对创业板指与科创50表现更具韧性。AI细分方向中，AI应用指数周度变动为-4.80%，AI算力指数为-7.91%，应用方向取得3.11个百分点的相对收益。个股层面，金自天正上涨15.10%，华策影视、华盛昌分别上涨8.23%和6.14%；盛视科技、开普云分别上涨13.06%和2.77%，部分个股表现活跃。产业创新持续积累，可关注AI应用落地带来的细分领域机会。受益标的 国产算力：寒武纪、海光信息、禾盛新材、沐曦股份、浪潮信息、工业富联等；海外算力：东山精密、胜宏科技、联特科技、德邦科技等；算力租赁：宏景科技、利通电子、协创数据等；大模型：智谱、MiniMax、阿里巴巴、腾讯控股；液冷：盾安环境、同飞股份、恒铭达等。 风险提示：玻璃基板技术产业化进展不及预期风险等。#文字观点", "publish_time": "2026-10-19 07:58", "tags": ["文字观点"]}, "post:2026-10-19T11-01:11e4348f668b": {"id": "post:2026-10-19T11-01:11e4348f668b", "kind": "post", "title": "2026-10-19 11:01", "source_label": "帖子正文", "excerpt": "DeepSeek更新V4.1 Flash，编程与Agent任务性价比提升本周组合：深信服、海光信息、鼎捷数智、浪潮信息、税友股份、视源股份、中控技术、金蝶国际、国能日新。#DeepSeek更新Flash模型，#编程与Agent任务表现提升 10月17日，DeepSeek发布V4.1-Flash-10", "content": "DeepSeek更新V4.1 Flash，编程与Agent任务性价比提升本周组合：深信服、海光信息、鼎捷数智、浪潮信息、税友股份、视源股份、中控技术、金蝶国际、国能日新。#DeepSeek更新Flash模型，#编程与Agent任务表现提升 10月17日，DeepSeek发布V4.1-Flash-1017，官方评测中DeepSWE成绩由74.2%升至77.0%，Terminal-Bench 4.0由31.2%升至42.3%，强化代码工程和终端执行能力。开发者选取10项日常工程任务、每项重复3次的独立评测显示，新版在Pi框架high档位下全部通过隐藏测试，平均每任务费用0.045美元，较同表GPT-5.6 Sol medium档位低77.7%，体现日常编程任务的性价比。#API价格保持低位，#搜索与工具配套扩大应用范围 新版API价格不变，非高峰时段每百万未命中缓存输入、输出Token分别为0.15美元、0.60美元，低成本调用有利于增加任务尝试和并行Agent部署。DeepSeek同步开放Search与Fetch接口，并优化DeepSeek Harness、腾讯CodeBuddy及WorkBuddy等框架，结合开放模型权重，为联网研究、数据分析和工程开发提供配套，降低开发者接入及企业定制部署成本。#智谱拓展法律专业场景，#阶跃强化长程Agent训练 10月12日，智谱发布法律专用模型GLM-Legal，通过法律语料训练及真实任务环境强化学习，提升合同审查、证据分析和文书交付能力，Harvey法律Agent评测全项通过率达19.2%，较基模提升12.5个百分点。10月15日，阶跃披露Step 5 Preview架构与训练方案，支持100万Token上下文，围绕长程任务优化训练环境和上下文管理。国产模型能力与工具配套改善，有望推动Agent进入企业业务流程，带动应用落地与推理需求增长。 投资建议：重点关注算力服务、2B类AI收入占比较高的应用公司、国产算力中芯片与超节点方向。具体标的#见报告。#文字观点", "publish_time": "2026-10-19 11:01", "tags": ["见报告", "文字观点"]}, "attachment:files/Anthropic三季度数据解读 261019.pdf": {"id": "attachment:files/Anthropic三季度数据解读 261019.pdf", "kind": "attachment", "title": "Anthropic三季度数据解读 261019", "source_label": "其他", "excerpt": "1、Anthropic经营业绩表现 ·前三季度营收盈利情况： 2026年Anthropic单季度营收规模持续扩张， Q1营 收47亿美金，Q2营收116亿美金，Q3营收168亿美金，Q3环比增长45%， 增速有所下降；季度末累计收入占同期末 ARR的比例从近20%提升至接近45%。", "content": "1、Anthropic经营业绩表现 ·前三季度营收盈利情况： 2026年Anthropic单季度营收规模持续扩张， Q1营 收47亿美金，Q2营收116亿美金，Q3营收168亿美金，Q3环比增长45%， 增速有所下降； 季度末累计收入占同期末 ARR的比例从近20%提升至接近45%。 公司收入质量优异，披露毛利率达 85%，商业模式延续去年的订阅制与 API调 用模式，其中API调用占收入主要部分，且该板块算力利用率、毛利率更高。 盈利端表现持续改善， 2026年前三季度调整后经营利润率为 11%，二季度已实 现转正，三季度进一步提升。算力变现效率优化，当前每 1美元算力支出对应 1.7美元收入，较一季度的 1.41美元有所提升。 · ARR增长与融资估值情况：随着三季度收入数据披露，投资人对 Anthropic的 IPO估值预期有所下调， 当前已降至 1.5万亿美金， 对应15倍ARR估值倍数。 ARR增长速度放缓， 预计 2026年10月ARR约为740亿美金， 较7月末的650 亿美金，两个月增长不足 100亿美金；其增速最快阶段为 2026年Q2，2月至 5月期间ARR共增长330亿美金。公司在增速最快的 5月底完成上一轮融资， 融资后估值达9650亿美金，融资金额为 650亿美金，融资情况与当期业绩表 现相对匹配。 2、Anthropic业务与运营情况 ·客户结构与留存表现：从历史数据来看， Claude Code采购情况可反映核心产 品收入表现，夏末时 Claude Code年化收入约为当期 ARA的1/10，该产品适配 多种使用场景。客户结构层面， Anthropic能较早实现营业利润率转正，核心原 因是客户以企业客户为主，头部集中效应突出： 2026年8月第三方投资机构估 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 算数据显示， 头部 1%的客户支出占总客户支出比例达 46%， 较上年同期的25% 大幅提升，该头部客户贡献营收的特征在 OpenAI企业客户群体中同样存在， 头部客户支出对大模型厂商整体营收贡献度极高。高价值客户规模增长明显， 年化消费超过100万美金的客户数量从 2月的500家增至4月的超1000家， 结合软件行业调研及智谱披露的头部客户占比情况来看，头部客户支出方差较 大，支出规模排名前 5或前10的客户单家支出规模远高于排名 50-100位的客 户。企业客户整体留存率处于较高水平。 ·业务构成与盈利质量： Anthropic收入按计费模式可分为订阅和 API按量计费 两类，API收入占绝大多数， 订阅收入占比约 10%； 成本端两类模式差异显著， 订阅业务仅贡献10%的收入， 却消耗了 41.7%的推理算力， 而API业务贡献90% 的收入，仅消耗58%的推理算力，因此 API模式利润率显著高于订阅模式，该 业务结构特征与国内两家上市大模型公司情况基本一致。渠道层面， Anthropic B端拓展成效突出的核心原因是其率先接入三大云平台，达成 API调用合作， 云渠道的支出占比接近总支出的一半，其中合作最紧密的是 AWS，其次为谷 歌，AWS的云收入中有较大部分由 Anthropic的企业客户带动。 业绩表现方面， 2024年、2025年Anthropic经营性利润均为亏损， 2025年经营亏损规模达 80 亿美金，2026年业绩实现突破性增长， 2026年一季度单季度收入已超过 2025 年全年收入规模。 ·算力储备与匹配情况： 作为头部大模型厂商， Anthropic是重要的算力需求方， 其通过长期采购及设备租赁，锁定了未来 10年至少5180亿美元的基础  端Claude Code的收入估算情况如何？ A: 如果单按Claude Code的采购情况来看，估算在夏末时 Claude Code的年化 收入约为当时ARR的十分之一水平，且 Claude Code在很多形式下都可以使 用。 Q: Anthropic的客户结构及头部客户支出占比情况如何？ A: Anthropic大部分是企业客户，且高支出企业客户的一九分化很重。 8月份第 三方投资机构估算显示，头部支出最高的 1%客户占总客户支出金额的比例从 一年前的25%提升至46%，头部效应明显。其年化消费超过 100万美金的客户 由2月的500家增至4月的超过1000家，头部公司的支出方差较大，最头部 的前5或前10家单个公司规模远高于后续客户，企业客户留存率非常高。 Q: Anthropic的收入分类及不同模式的算力消耗与利润率情况如何？ A: Anthropic收入按形式分为订阅和 API计费，API占绝大多数。其云渠道支 出占比接近一半，首推合作最紧密的 AWS，其次是谷歌。订阅模式贡献了 10% 的收入但消耗了41.7%的推理算力，利润率较低； API方式贡献了90%的收入 但仅消耗58%的推理算力，利润率更高，订阅的使用强度会直接影响单位收入 所需的算力成本。 Q: Anthropic的历史经营损益及未来算力合同锁定规模如何？ A: Anthropic在2024和2025年的经营性利润均为亏损， 2025年亏损80亿，但 2026年一季度单季度收入已超过去年全年。在算力需求方面， Anthropic通过 长期采购及设备租赁锁定了未来 10年至少5180亿美元的基础设施，其中博通 约1600亿，谷歌1100亿，亚马逊1100亿，微软314亿，AAR有845亿可取 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 消的算力租赁合同。其在四五月份收入 ARR增速最快时集中签订了较多算力 协议并锁定了最新推理芯片，整体收入和 ARR对应的算力相对可控。 Q: 端侧AI在物联网设备上存在哪些潜在安全风险？ A: Anthropic在12号发布了一篇关于模型在物联网设备上复制传播的论文，指 出模型会借助各种物联网设备进行分布式推理，这提示了端侧 AI在物联网设 备上存在潜在的安全风险。 Q: AI在企业端的采用集中率、员工 AI支出及Token价格趋势如何？ A: AI支出排名前1%的企业贡献了Anthropic和OpenAI合计支出的80%，企 业端AI渗透未来仍有较多空间。 9月份每员工AI支出中位数环比增长，弥补 了8月因程序员休假导致的下降。 Token调用量持续增长，但单位 Token价格 因Anthropic和OpenAI高端模型降价及推出低端模型而降低。 未来国内开源模 型在美国企业端占比提升会进一步带动 Token价格下降，目前国内开源模型在 美国企业端占比仅为个位数。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "attachment:files/国内开源专家调研.docx": {"id": "attachment:files/国内开源专家调研.docx", "kind": "attachment", "title": "国内开源专家调研", "source_label": "其他", "excerpt": "国内开源专家调研 以下为专家观点： 1，在Kimi K3发布以及海外SOTA模型持续迭代和降价的背景下，公司的商业化策略将如何调整，这对国内开源模型在海外的商业化会产生何种影响？Kimi公司的未来商业化布局将从通用的token批发模式，转向基于长程Agent交互的模式。", "content": "国内开源专家调研 以下为专家观点： 1，在Kimi K3发布以及海外SOTA模型持续迭代和降价的背景下，公司的商业化策略将如何调整，这对国内开源模型在海外的商业化会产生何种影响？ Kimi公司的未来商业化布局将从通用的token批发模式，转向基于长程Agent交互的模式。具体而言，未来的主要盈利模式将不再是售卖token，而是以交付Agent服务为主，按照长思维链、多步骤任务的容器化形式进行定价。目前，许多网页端的个人订阅服务主要依赖订阅制。 2，公司未来的商业化策略将如何侧重于C端和B端业务，以及如何看待海外SOTA模型对国内商业化的潜在冲击？ 在C端，未来的策略将更多地转向提供套件式服务，例如研报的抽取与分析、合同审查等，以提升用户价值。在B端，业务重心将放在为金融、法律及科研院所等机构提供基于私有镜像的软硬一体化解决方案，这类合同金额通常在百万元级别以上，旨在减少对C端订阅业务的依赖。 关于海外SOTA模型的冲击，主要体现在以下两方面： 第一，价格方面，尽管海外顶尖模型在代码、数理等方面能力很强，但其价格预计不会降至国内市场的水平，因此价格竞争压力不大。 第二，合规审查方面，海外模型在国内使用可能面临监管问题，这方面带来的冲击可能比价格因素更大。 对于国内模型出海的策略，将主要采取以下路径： 首先，减少自建API的模式，转而通过与亚马逊等云市场的合作进行分销。 其次，由AWS等合作伙伴承担合规背书，通过设立专用的VPC路由进行采购，而非直接提供API接口。 最后，利用自身在百万级上下文处理、低手机延迟和低成本单向推理等方面的优势，切入海外中小企业或独立开发者市场。 3，在商业化方面，公司对C端和B端业务的侧重点是什么？特别是在长文本任务（Agent层面）上，会优先满足哪一端的需求？ 公司当前的业务重心已从C端转向B端。2025年业务以C端驱动为主，而现在则明显向B端倾斜，重点发展API调用和企业级解决方案。对于长文本任务，也将优先满足B端客户的需求。C端业务将聚焦于提供订阅服务，如无限次调用、长文档处理能力和思维链等功能。B端业务则会深入金融、法律和研究等领域，这也是公司采购相关领域数据的原因。 4，针对B端客户，主要的商业化模式有哪些？在国内和海外市场分别采用何种策略？ B端业务的商业化主要通过三条路径展开： 第一，国内API业务采取双价策略。一方面，通过Flash等模型的低价策略抢占市场份额，实现走量和跑流水；另一方面，针对深度推理、代码重构、工具规划等高价值场景，设定较高价格以提升毛利率。 第二，国内企业解决方案业务。利用在百万级、两百万级上下文处理方面的能力，针对金融客户、投研机构和法律行业，提供研报分析、法律冲突审查、合规诊断等定制化场景的解决方案，并签订B2B合同。 第三，海外业务。通过与AWS等云服务商的合作模式，撬动海外客户市场。 5，在B端业务的商业化潜力方面，国内市场与海外市场相比哪个更大？ 国内市场的商业化潜力更大，推进速度也可能更快。主要原因是海外市场涉及更复杂的法律法规和合规性问题，企业在采购时可能会有较多顾虑。在海外市场中，东南亚地区可能相对有更好的发展机会。 6，公司如何看待与亚马逊等海外云厂商的合作，以及海外潜在的监管政策对国内开源模型可能产生的影响？ 与亚马逊的合作有两大核心驱动力。首先，K3模型已入驻其平台，亚马逊提供合规保障，包括零数据流程和VPC等，这解决了海外客户对于数据出境和隐私的顾虑。其次，通过与亚马逊合作并采用收入分成的模式，可以避免自建海外API所带来的高昂运维和获客成本，从而实现市场的快速渗透。 在市场竞争方面，策略并非与海外顶尖模型在通用能力上直接竞争，而是发挥自身在百万级无损长上下文、首次延迟和缓存命中率等方面的优势，满足海外金融投研等机构的特定需求。与亚马逊的合作模式跑通后，将为后续与Google、Oracle等厂商的合作积累更多筹码和可行性。 关于监管政策，目前判断短期内出现“一刀切”政策，即禁止所有中国模型与亚马逊、Google、Oracle等合作的可能性不大。 7，除了与亚马逊的合作，公司同其他云服务厂商的合作目前处于何种状态？ 与其他几家云服务厂商的合作也在推进中。与Oracle的合作已经落地，K3模型目前也可以在Oracle云上使用。与Google的合作目前处于商务意向和基础推荐阶段，因为Google方面仍需要进行一些合规评估。此外，公司也正在与包括印尼、韩国、日本在内的亚太地区本土云服务商洽谈合作。 8，K3模型上线AWS后，其日调用量的变化趋势如何？ 模型上线AWS后，调用量在经历短暂的起步期后已进入比较稳定的状态。上线初期，日调用量整体呈现持续上升的趋势。 9，如何看待国内外开源模型的竞争格局变化，以及B端企业对开源模型的接受度演变？ 国内企业基本不自研基础模型，普遍接受通过Lora或预训练的方式在开源模型基础上进行开发，接受度很高。2024年时，接受度可能仅为20-30%，现在已达到60-70%。海外企业早期依赖如OpenAI或Anthropic的闭源API，但在Llama等开源模型推出后，许多企业开始采用混合部署策略。具体而言，常规化业务使用闭源的SOTA模型，而高频业务则全面切换至开源模型或使用托管的开源服务，主要动因是成本节约。 竞争格局方面呈现几个特点：首先，模型开源降低了成本，促使OpenAI和Anthropic等公司也开放了轻量级模型（如Haiku）的API并持续降价。其次，模型竞争的核心指标已转向适配度、KV cache的压缩能力、首次延迟以及损耗，而非传统的基准测试分数。最后，闭源模型主要聚焦于构建具备最高智能水平的、端到端的融合应用；而开源模型则更多地应用于数据微调、研发以及顶层应用的普及，整体来看开源模式优势大于劣势。 10，国内几家主要开源模型的竞争情况如何，各自的优劣势是什么？尤其是Kimi与DeepSeek对比？ 国内开源模型的竞争早期以“刷榜”为主。具体到厂商，DeepSeek的核心优势在于工程架构和高性价比，其首创的MLA加Multi-token技术能将训练成本和显存占用压缩到极限，在代码和数理方面表现较强。其市场策略主要是低价倾销API以建立品牌。DeepSeek的劣势在于长文本处理能力较差，且正式的交付团队相对薄弱。 相较之下，Kimi的核心优势在于长文本处理和端到端的Agent能力，例如在100万、200万token的长文本场景下表现突出。此外，混合注意力机制的能力以及与AWS的合作也构成了Kimi的渠道优势。Kimi的劣势在于，业务增长较依赖私有化部署或开发者，在开源社区矩阵的建设和运营能力方面，可能相较于DeepSeek会弱一些。 11，Kimi模型在发布K3之后，其后续版本如K3.5和K4的预训练进展如何？对于更大参数规模的模型训练，其稳定性和技术上限在何处？ K3的2.8T参数模型训练已相对成熟。目前，Kimi正着重于测试K3.5，而K4尚处于原型验证阶段。根据规划，K4的参数规模将在5T以上。从当前看，scaling law的上限预计在10T左右，超过这个规模可能需要探索其他的技术路径。K3.5目前仍在预训练阶段。K4的时间表更不确定，尚在原型阶段。内部并未明确区分K3.5和K4的说法，训练中的模型可以根据情况随时调整其最终命名和定位，因此存在不发布K3.5而直接将新模型命名为K4的可能性。 12，预计在2026年底或2027年初发布的新模型，其参数规模和训练稳定性如何？ 预计届时发布的新模型参数量不会达到5T。下一代模型才会达到5T以上的规模。目前，针对这个低于5T参数规模的模型（即K3.5）的训练状态相对稳定。而5T以上参数规模的模型训练目前仍处于验证阶段，尚未进入预训练周期，因此稳定性还无法保证。 13，在中远期，公司的算力策略是怎样的，特别是在国产和海外芯片的配比和使用上？ 公司的算力策略是两手准备，同时采用国产和海外芯片。海外方面，Kimi主要通过租赁AWS等云服务商的GB200、GB300等先进芯片进行前沿大模型的预训练。国内方面，Kimi正积极进行国产卡的适配工作，主要以升昇腾910C和海光等为主。总体策略是，前沿的大模型训练通过海外租赁或采购的方式进行，而国内业务则以国产卡为主。 14，国产卡在模型训练中扮演何种角色？是否会用于预训练，尤其是在K3.5和K4这类模型上？ 国产卡目前主要用于后训练（post-training）阶段，而预训练（pre-training）绝大部分仍在海外先进芯片上完成。这是一种分阶段的策略，预训练依赖海外卡，后训练则以国产卡为主。不过，国产卡也会参与一部分预训练工作，并非完全不参与。例如，在一个万卡集群中，可能70%的预训练任务由海外卡承担，30%由国产卡承担，特别是在算力需求的低峰期，部分任务会分配给国内的算力（预训练这里用的国内算力更多还是国内的NV卡，而非国产AI芯片）。 15，对于K4或参数超过5T的更前沿模型，其预训练将依赖何种算力？ 对于K4这类前沿模型的实验和算子验证，基本上会使用顶级的GB200、GB300芯片。而像自博弈、后推理等后训练环节，则会使用国产卡，主要包括昇腾以及国内合规的H20芯片。", "status": "extracted"}, "post:2026-10-19T07-58:022aceb8331a": {"id": "post:2026-10-19T07-58:022aceb8331a", "kind": "post", "title": "2026-10-19 07:58", "source_label": "帖子正文", "excerpt": "本周关注： （1）电子整体情绪反馈：本周电子板块整体走弱，板块涨跌幅-7.7%，排名29/30，其中光学光电-5.1%、元器件-6.6%、消费电子-7.9%、半导体-8.2%，其他电子零组件-9.6%。海外方面，美国9月CPI数据超预期，叠加市场对AI链投资回报及融资可持续性的担忧加剧，科技板块股价", "content": "本周关注： （1）电子整体情绪反馈：本周电子板块整体走弱，板块涨跌幅-7.7%，排名29/30，其中光学光电-5.1%、元器件-6.6%、消费电子-7.9%、半导体-8.2%，其他电子零组件-9.6%。海外方面，美国9月CPI数据超预期，叠加市场对AI链投资回报及融资可持续性的担忧加剧，科技板块股价有所回调；国内方面，节后内外部情绪扰动较大，投资者情绪及风险偏好偏弱，电子板块震荡调整。进入三季报窗口期，市场继续聚焦博弈公司业绩兑现与基本面改善，周末长鑫三季度业绩讨论较多，主要聚焦于财务处理讨论，对景气度与升级方向并无担忧；此外四季度以来，市场开始着眼布局2027年产业趋势更明朗、业绩确定性更强的细分方向，我们认为国内自主可控链仍是市场未来几年确定性最强的核心主线，在全球AI发展与国产替代双轮驱动下，半导体设备、晶圆制造（Fab）及国产算力在全球科技资产中具备突出的配置价值，同时AI需求驱动PCB、AI电源、存储等细分领域基本面强劲，我们持续看好。 （2）湾芯展调研反馈及半导体板块持续推荐：设备零部件全面爆单，成为产业链核心卡点。零部件最紧缺环节包括MFC、分子泵、真空电容器、阀门、静电卡盘等，相关领域日本、欧洲企业交期大幅延长，带动相关国内企业“备胎转正”，国产零部件企业普遍出现爆单状态。设备公司Q3订单可观，进一步强化信心，部分企业认为本轮订单加速可看至28-29年。我们持续看好零部件及设备环节。 （3）PCB行业观点反馈更新及持续推荐： 本周多家PCB产业链公司集中发布业绩预告，整体超预期，反映了26H2 AI PCB受益于算力芯片平台迭代升级而量价齐升的需求高景气，以及传统PCB年中集中涨价带来的盈利能力改善动能，CCL则亦处于盈利能力快速提升阶段，随着三季度业绩的释放，行业龙头公司26Q4及27年业绩预期有望进一步上修。近期PCB板块调整较大，但当前行业不存在实质/逻辑利空，PCB升规升阶、应用拓展的产业趋势仍在持续兑现，当前行业整体估值水平已处于较低水平，我们看好后续板块的投资机会，重点推荐：生益科技、沪电股份、深南电路、景旺电子、兴森科技，建议关注广合科技。#文字观点", "publish_time": "2026-10-19 07:58", "tags": ["文字观点"]}, "post:2026-10-19T13-07:7e2e16adc9ea": {"id": "post:2026-10-19T13-07:7e2e16adc9ea", "kind": "post", "title": "2026-10-19 13:07", "source_label": "帖子正文", "excerpt": "大摩——追踪AI的1.6万亿美元资金轨迹：绘制资本开支繁荣所驱动的收入版图 摩根斯坦利指出，超大规模云厂商（Hyperscalers）与新型云服务商（Neoclouds）的AI基础设施投资正以前所未有的规模重塑企业收入格局。我们的自下而上测算显示，2027年全球AI计算相关资本开支（含现金资本开支与", "content": "大摩——追踪AI的1.6万亿美元资金轨迹：绘制资本开支繁荣所驱动的收入版图 摩根斯坦利指出，超大规模云厂商（Hyperscalers）与新型云服务商（Neoclouds）的AI基础设施投资正以前所未有的规模重塑企业收入格局。我们的自下而上测算显示，2027年全球AI计算相关资本开支（含现金资本开支与租赁资本开支）总额将达到1.58万亿美元，较此前市场共识高出约14%，其中租赁形式的“合成资本开支”新增1,950亿美元，揭示了传统财报现金流中隐藏的真实投资强度。 1. 收入传导与指数影响 上述资本开支将直接转化为供应商收入，预计2027年超大规模与新型云客户贡献的收入占标普500总收入的4.9%，并驱动该指数约24%的同比收入增长（若剔除AI直接影响，标普500收入增速仍达6.6%，表明整体基本面稳健）。AI相关板块（赋能者与采用者）预计将贡献标普500约78%的盈利增长，其中“科技七巨头”占AI板块收入的70%及盈利增长的75%，凸显市场对AI主题的高度集中依赖。 2. 资本开支结构演变 2026年AI资本开支同比增幅约100%，2027年放缓至约60%，2028年进一步降至约14%，但绝对增量依然庞大（2027年单年新增约7,000亿美元）。由于数据中心大量通过租赁融资（不体现在GAAP资本开支中），我们首创的租赁资本开支模型填补了统计缺口，使总可追踪投资规模更真实地反映算力扩张节奏。 3. 供应链受益层级与瓶颈机会 • 半导体与算力：英伟达（NVDA）仍是最大受益者，单GW收入规模向400亿美元迈进，并有望在2028年推动XPU市场突破1万亿美元；博通（AVGO）及存储（MU、SNDK）在定制ASIC与HBM领域持续攫取价值。存储周期预计在2026年四季度进入晚期而非终结，尽管合约价格涨幅放缓，但长期协议（LTA）将缓冲下行，当前国际存储股市盈率仅约3倍，隐含风险收益比具备吸引力。 • 服务器与ODM：戴尔（DELL）、慧与（HPE）及台湾ODM厂商（鸿海、广达、纬创等）通过组装与集成获取单机柜价值增量，其中VR200机柜较GB300的附加值提升35-40%。代工模式（寄售vs买卖）将显著影响营收确认与利润率，但绝对利润额随复杂度上升而增长。 • 电力与热管理：电力瓶颈催生现场发电与高端设备需求，卡特彼勒（CAT）、康明斯（CMI）、EROC受益明确；电气化与液冷解决方案供应商（Vertiv VRT、Eaton ETN、Trane TT、Johnson Controls JCI等）正加速产能扩张，模块化部署成为应对劳动力短缺与提速需求的关键，这些公司的数据中心收入预计未来3-5年实现两位数复合增长。 • 电子设计自动化（EDA）：新思科技（SNPS）与楷登电子（CDNS）随超大规模厂商自研芯片（定制硅）浪潮，从设计软件与IP授权中获取增量收入，特许权使用费模式使其盈利与芯片量产规模直接挂钩，市场对此类“AI颠覆”的过度担忧提供了潜在布局窗口。 4. 超大规模厂商的回报与融资前景 模型测算显示，AI资本开支在不同商业模式中均可实现25%-50%的增量投入资本回报率（ROIC）：模型API业务边际EBIT利润率超70%，GPU租赁（IaaS）边际EBIT利润率约60-70%。尽管2027年部分厂商自由现金流缺口可能扩大，但高评级主体仍具备融资能力；资本开支若因回报不及预期而放缓，将分化为“良性利润率扩张”与“产能过剩导致的估值收缩”两种情景，当前我们更倾向前者。 5. 投资策略：聚焦瓶颈与定价权 随着资本开支增速在2028年明显减速，市场焦点将从“总量增长”转向“结构韧性”。我们筛选出的受益标的具备两大特征：一是身处关键瓶颈环节（电力、HBM、先进封装、液冷），拥有短期无法缓解的供需缺口带来的定价权；二是能在算力扩散过程中夺取市场份额（如定制化服务器设计、光模块升级）。建议超配那些在资本开支周期下半场仍能实现收入与盈利双升的“赋能+采用”混合型公司，而非单纯依赖资本开支放量的纯硬件标的。 风险提示：AI变现进度不及预期、电力与供应链瓶颈持续、融资环境收紧及租赁会计政策变动可能影响短期波动，但长期算力稀缺性逻辑未改。#文字观点", "publish_time": "2026-10-19 13:07", "tags": ["文字观点"]}, "post:2026-10-19T19-40:bd5f72025509": {"id": "post:2026-10-19T19-40:bd5f72025509", "kind": "post", "title": "2026-10-19 19:40", "source_label": "帖子正文", "excerpt": "中国半导体‑OCP 大会总结：光通信崛起与 AI 基础设施替代方案😃本次美国参会调研，重点看到 ICA/IPO 技术取得进展、配套机架管理芯片、硬件安全技术以及基于 CXL 的内存池化方案，存储服务器同样具备潜在上行空间。📌核心要点 🔍ICA/PO 技术取得进展：中国云服务商与 TE 的演示表明该技", "content": "中国半导体‑OCP 大会总结：光通信崛起与 AI 基础设施替代方案😃本次美国参会调研，重点看到 ICA/IPO 技术取得进展、配套机架管理芯片、硬件安全技术以及基于 CXL 的内存池化方案，存储服务器同样具备潜在上行空间。 📌核心要点 🔍ICA/PO 技术取得进展：中国云服务商与 TE 的演示表明该技术正在获得更多采用，但成本依旧偏高。🔎IMC 对比 BMC：迈威尔的 IMC 可对 AST2700 形成功能补充，我们判断不会造成生产中断。🛡️硬件安全：Caliptra 框架进一步凸显 eMemory 基于 PUF 的安全知识产权方案的价值。🔥CXL 与散热：CXL 可实现内存池化；散热方案、专用 ASIC/CPU 的量产推进，形态从 XPO/NPO 逐步走向中介层光互联（IPO）与共封装光学（CPO），以上均为行业持续关注方向。Muse 技术或将拉动存储服务器需求。💡ICA/IPO 技术板块 ✨ICA/IPO 技术正在获得行业关注，但成本仍是主要阻碍。一家中国云服务商介绍了 IPO 搭配中介层铜连接（ICA）的光学集成方案。 🔧泰科电子展示 224G/448G 规格的 NPO/CPO 插座以及 ICA 插座，插座具备 0.4 毫米间距，引脚数量最高可达 10000 根，能够实现高密度连接、降低串扰，同时可改善返修性能。 📈我们判断 ICA/PO 技术关注度持续提升，有希望在 2027 年实现大规模量产（更多详情可参考我们近期的 CPO 专题报告）。 🛠️迈威尔 IMC 部分 🤝迈威尔 IMC 是 AST2700 的补充方案，并非替代产品。迈威尔展示基于 OCTEON 架构的基础设施管理控制器（IMC），该产品用于处理更高层级 AI 机架 / 集群的遥测与控制工作。 🖥️智邦科技的 AST2700 基板管理控制器（BMC）依旧负责节点级安全以及远程管理工作。 📌由于二者功能、软件生态存在明显区分，我们不认为 IMC 会直接和 AST2700 形成竞争关系。 ✅同时我们预计 AST2700 不会出现生产问题，产品量产进度符合预期。 🤔行业真正的争议点实际集中在 TPU/Axion 相关产品的市场份额争夺。 🔐Caliptra 硬件安全板块 🔓Caliptra 拓展硬件信任根的应用机会。开源 Caliptra 框架为数据中心处理器、加速器定义芯片层面的硬件信任根（RoT），支持安全启动、设备身份识别与设备认证。 📜eMemory（3529.TW）旗下子公司 PUFsecurity 推出 PUFrt 产品，依托 NeoPUF 技术提供设备相关能力、NeoFuse 一次性可编程安全存储、硬件熵源，作为物理安全基础组件，用于 Caliptra 框架落地。 💰如果该框架获得大范围普及，有望带动 PUF、安全知识产权授权收入增长；不过商业化落地，取决于资质认证以及客户设计项目落地情况。 🌐其他内容：CXL 架构、散热、算力芯片量产 🌡️微通道盖板的演示案例，凸显随着机架密度提升，芯片级热设计的重要性。 🔗与合作方共同完成的 MARS 方案演示，证明 CXL 架构交换芯片，能够在机架层面实现多主机与共享内存的互联，不过整套方案距离完全成熟仍需要时间。 ⚙️定制专用 ASIC 以及服务器 CPU 的量产推进进度符合预期。 💾Muse 技术有望带动存储服务器需求上行。#文字观点", "publish_time": "2026-10-19 19:40", "tags": ["文字观点"]}, "attachment:files/大摩：台积电业绩、ABF载板、智能手机及PC月度趋势、三星初步业绩、京东与腾讯业绩前瞻20261016.pdf": {"id": "attachment:files/大摩：台积电业绩、ABF载板、智能手机及PC月度趋势、三星初步业绩、京东与腾讯业绩前瞻20261016.pdf", "kind": "attachment", "title": "大摩：台积电业绩、ABF载板、智能手机及PC月度趋势、三星初步业绩、京东与腾讯业绩前瞻20261016", "source_label": "其他", "excerpt": "大摩：台积电业绩、ABF载板、智能手机及PC月度趋势、三 星初步业绩、京东与腾讯业绩前瞻20261016 要点总结 1.台积电法说会：AI需求远大于供给，资本开支与产能规划全面上修：尽管面临融资、电力供应、科 技供应链及ABF载板缺货等多重变数，台积电仍认为客户需求远超现有供应，决定采取更激进的扩张 策略——评估德州新增建厂用地、台湾新增3纳米产线，2纳米产", "content": "大摩：台积电业绩、ABF载板、智能手机及PC月度趋势、三 星初步业绩、京东与腾讯业绩前瞻20261016 要点总结 1.台积电法说会：AI需求远大于供给，资本开支与产能规划全面上修：尽管面临融资、电力供应、科 技供应链及ABF载板缺货等多重变数，台积电仍认为客户需求远超现有供应，决定采取更激进的扩张 策略——评估德州新增建厂用地、台湾新增3纳米产线，2纳米产能明年翻倍（今年底约10万片，明 年底公司目标约20万片，大摩模型仅估16万片）。大摩据此上调明后年资本开支预测，并观察到 2028年ASMLEUV设备交付量将比2027年多20%-30%。 2.台积电对与三星、英特尔合作持开放态度，但坚持主导建厂：对于三星CEO提出的合作可能性，台 积电回应\"可以谈，但工厂要我们自己建\"，球已抛回三星；与英特尔的关系上，台积电表示对IDM客 户外包\"尽量做到公平\"——用则支持、不用则支持其竞争对手；在先进封装上，若客户使用英特尔方案 效果不佳，台积电表示愿意介入\"帮助客户成功\"。 3.台积电毛利率指引略低于买方预期，但属预期差而非基本面问题：实际66.4%落在指引上缘，只是 券商preview估得偏高；管理层提示明年海外厂稀释效应仍大，虽已部分反映在价格上，但明年毛利 率最好看flash（保守看待），大摩已相应下调模型毛利率假设。维持台积电\"买进\"评级与目标价。 4.ABF载板：扩产消息不改看多观点，供需缺口反而扩大：今年载板厂累计宣布约140亿美元资本开 支，但新产能来不及缓解2027-2028年缺口——三星电机适中厂2028年9月才量产，南电嘉义新厂 （集团史上最大ABF投资，约470亿台币）要到2029年下半年放量，且设备排队、海外土 据中心与电力基础设施、国防等国产替代与资本开支周期，则具备业绩能见度；相反，内需消费受制于购买力疲软与有限财政刺激，短期难有超额收益。 3. 医疗健康板块：医院资产“越跌越贵”，CDMO热度高但性价比不足，头部仿制药成新宠 路演中机构讨论最密集的细分领域是医疗健康，且观点撕裂明显： • 医院板块：野村原有的负面观点获广泛认同，但持仓仍显拥挤（over-owned）。监管干预风险（如药品利润上限可能扩展至更多品类）是核心悬顶之剑。投资者虽承认短期盈利承压，但寄望于公司通过提升服务收费来对冲仿制药毛利压缩。野村认为，自9月23日以来15%至20%的回调仅部分反映盈利下修预期，在监管阴影、利率上行与拥挤交易未出清前，板块估值将长期困于25倍一年期远期EV/EBITDA之下。 • CDMO板块：机构情绪压倒性乐观，认可高质量CDMO的长期成长逻辑。但野村提示一个关键的市场盲点：当前估值已充分甚至过度定价了这一增长预期，意味着未来6至12个月获取超额收益的空间极为有限，建议投资者勿在情绪高点追涨。 • 头部仿制药（Frontline Pharma）：成为本次路演的边际亮点。机构虽承认个别催化剂，但整体认为板块缺乏足够的宏观故事支撑超配。野村则相对更积极，指出这些公司在印度本土及非美国市场持续兑现强劲增长，且近年的并购执行记录优良（如Sun Pharma收购Organon、Dr Reddy’s的欧美布局）。尽管国内价格管控是潜在风险，但估值安全边际与海外扩张确定性令其风险回报比优于医院与CDMO。 4. 野村首选标的与估值方法论（均为“买入”评级） 野村明确列出五只首选股票，均给予买入评级，核心逻辑与估值锚点如下： • Dr Reddy's Laboratories（DRRD IN）：目标价1,740印度卢比（基于24倍FY28预期EPS 72.6卢比）。看好其品牌仿制药在美国与新兴市场的双位数增长，以及并购整合带来的品类扩张。下行风险在于美国定价侵蚀与监管行动。 • Sun Pharma（SUNP IN）：目标价2,400卢比（基于32.5倍FY28预期EPS 65.5卢比，外加收购Organon产生的268卢比价值）。逻辑在于 specialty 产品放量及美国市场复杂化下的防御属性。风险包括 specialty 销售爬坡不及预期及美国最惠国（MFN）定价令。 • Lupin（LPC IN）：目标价2,675卢比（基于30倍FY28预期EPS，剔除Tolvaptan后为89.1卢比）。核心看点是其美国仿制药组合的恢复与印度本土品牌的韧性。关键风险为关键产品审批延迟与价格压力。 • Alkem Laboratories（ALKEM IN）：目标价6,850卢比（基于28倍FY27预期EPS 244.8卢比）。野村认为其国内品牌业务贡献约70%盈利，且CDMO与MedTech业务存在市场未充分定价的期权价值，估值区间26至33倍具备支撑。 • Gland Pharma（GLAND IN）：目标价3,750卢比（基于27.5倍FY29预期EPS 136.5卢比）。作为CDMO与注射剂龙头，野村承认其长期成长性，但提示监管不利发展是首要下行风险，此外包括汇率波动与现有业务定价压力。 5. 核心矛盾与投资启示 野村在报告中刻画了一个典型的“宏观悲观、微观精选”的市场阶段：指数层面受制于估值与资金流，难有趋势性行情；但具备真实海外现金流、并购执行力与监管免疫力的细分龙头，已在回调中构筑了中期底部。对于海外投资者，当前策略不是择时大盘，而是用自下而上的选股去对冲自上而下的宏观不确定性——在印度这个“高波动新兴市场”中，只有那些能将增长锚定在北美与欧洲需求、且资产负债表稳健的医药与制造类公司，才能持续获得长钱溢价。 结论：野村对印度股市的定性是“谨慎但不逃离”，对医疗板块的定性是“回避医院、警惕CDMO估值泡沫、超配头部仿制药”。建议客户在2026年四季度至2027年一季度，沿“出口导向+资本开支周期+并购整合能力”三条主线布局，并紧密跟踪11月联邦预算中的资本利得税动向与美国对印关税谈判进展，这两者将是触发资金回流的关键变量。#文字观点", "publish_time": "2026-10-19 12:41", "tags": ["文字观点"]}, "post:2026-10-19T18-19:2aaddea92076": {"id": "post:2026-10-19T18-19:2aaddea92076", "kind": "post", "title": "2026-10-19 18:19", "source_label": "帖子正文", "excerpt": "摩根大通 - 韩国股票策略：研判近期股价走势📊上周韩国综合指数（KOSPI）5 个交易日回撤幅度达到‑15%，这是今年继 3 月、7 月之后第三次出现该级别回调。📊本轮下跌最初源于公司回购节奏放缓，之后受全球人工智能市场情绪恐慌进一步加剧", "content": "摩根大通 - 韩国股票策略：研判近期股价走势📊上周韩国综合指数（KOSPI）5 个交易日回撤幅度达到‑15%，这是今年继 3 月、7 月之后第三次出现该级别回调。 📊本轮下跌最初源于公司回购节奏放缓，之后受全球人工智能市场情绪恐慌进一步加剧；当韩国综合指数跌破 200 日移动平均线后，技术面抛压进一步释放。 📊在这一轮行情当中，纯防御板块（必需消费品、医疗保健、低波动板块）表现抗跌；质量因子、价值因子以及盈利上调因子取得最优收益表现，价格动量因子回调幅度最大。 📊值得注意，整体股票风险环境在此之前就已经走弱。自 9 月中旬开始，我们就针对区域股票市场发出战术层面的谨慎提示。 📊正如我们上月撰写的报告：“从 9 月中旬至 10 月末，美联储开启加息周期、长期债券收益率易上难下、日元走强对套利交易形成压制、油价维持高位叠加美国中期选举带来季节性走弱，在此多重因素影响下，我们预计市场风险偏好将持续低迷。质量因子以及金融板块是该阶段最好的对冲工具。” 📍我们当前所处的市场位置 📊从技术指标看，相对强弱指标 RSI 处于低位，大量股票进入超卖区间；估值维度，韩国综合指数远期市盈率处于历史低位，剔除存储芯片后的韩国综合指数估值处于历史的第 11 百分位，综合来看韩国综合指数已经具备吸引力。 📊但目前我们尚未看到资金流入的信号，不足以构筑可信的市场底部。 📊站在 6‑12 个月维度，我们对人工智能产业链以及韩国股票依旧维持基本面看多的判断；其利好不仅来自人工智能资本开支，也来自安全与产业韧性相关支出、治理改革以及流动性盈余。 📊不过，资金失衡问题得到修复、全球风险厌恶情绪消退，仍然需要一定时间。 📊短期即将到来的催化事件包括：存储芯片公司财报、股东回报政策更新；韩国波动率指数 VKOSPI 回落；美国中期选举过后全球风险偏好修复；超大规模科技公司财报；大模型公司财务数据披露等。 💸市场资金流向 📊近期资金面最主要变化是公司回购规模放缓。自 8 月末起，公司回购一直是市场重要资金支撑，如今三星回购计划已经完成，海力士回购也临近收尾。 📊外资方面，整个亚太区域内外资都在抛售人工智能相关股票，中国台湾市场资金流出规模更大；趋势跟踪类投资者近期大概率已经大幅削减韩国市场持仓。 📊长线投资者有买入意愿，但前提是市场波动率回落之后才会进场。 📊国内机构资金（养老金、券商）的资金流入规模都比较有限。 📊散户投资者情绪极度脆弱，韩国综合指数已经跌破今年以来散户估算平均持仓成本线。 📊杠杆型交易所交易基金的资产管理规模虽较前期明显收缩，但存量规模依旧可观，资金流出十分有限；市场大幅下跌的交易日中，该类产品会带来大量卖出订单，尤其对比 6 月高点之后显著萎缩的市场成交，抛压影响更为突出。 ❓非存储芯片板块同样下跌的原因 📊资金层面的各类压力主要集中在存储芯片标的身上，包括回购结束、市场对存储板块情绪恶化、杠杆交易所交易基金调仓。但剔除存储芯片之后的韩国股票同样出现下跌。 📊诚然，非存储板块回调幅度相对温和，但也带来一批与全球人工智能情绪不相关的投资机会。#文字观点", "publish_time": "2026-10-19 18:19", "tags": ["文字观点"]}, "post:2026-10-19T13-03:3819a9f98e10": {"id": "post:2026-10-19T13-03:3819a9f98e10", "kind": "post", "title": "2026-10-19 13:03", "source_label": "帖子正文", "excerpt": "📑野村‑中国互联网与新媒体‑中国拟对 AI 技术出口实施监管 📰 中国拟出台 AI 技术出口管制相关监管规则。📅 10 月 16 日，中国商务部、科技部对外公示《禁止出口限制出口技术目录》修订草案，拟新增 40 项技术，覆盖人工智能、生物医药、光伏三大领域。", "content": "📑野村‑中国互联网与新媒体‑中国拟对 AI 技术出口实施监管 📰 中国拟出台 AI 技术出口管制相关监管规则。 📅 10 月 16 日，中国商务部、科技部对外公示《禁止出口限制出口技术目录》修订草案，拟新增 40 项技术，覆盖人工智能、生物医药、光伏三大领域。 🗓️ 公开征求意见的截止时间为 11 月 15 日。 ℹ️ 修订版目录正式施行日期暂未对外公布，但目录内指定技术的出口前置登记要求已经正式生效。 ✅ 本次草案明确：已经对外公开发布的全部开源模型、AI 技术不在本次监管约束范围之内。 📋 草案将 AI 技术划分成两大类别，第一类为禁止出口的敏感 AI 技术；第二类为需要实施出口管制的 AI 技术及相关产品。 🔒 拟禁止出口的技术聚焦敏感数据以及国家安全相关技术，草案划定四大类。 📌 第一类，主要用于保障中国跨境数据传输的高级深度伪造检测技术。 📌 第二类，部分具备 AI 能力的网络攻击技术、面向国家安全敏感场景源头内容加微WUXL3408使用的高性能智能代理程序。 📌 第三类，使用中国《数据安全法》定义下的核心数据完成训练的基础大模型。 📌 第四类，面向关键基础设施、国防、政府核心职能这类敏感场景所开发的高性能 AI 智能代理程序。 ⚠️ 上述出口禁令绑定特定技术、数据、应用场景，并非单纯依据模型参数量、性能指标来划定管控范围。 📋 草案另外设置限制出口 AI 技术清单，清单覆盖 AI 全产业链的前沿技术，包含基础大模型、AI 智能代理、AI 芯片、AI 计算集群。 🧠 针对基础大模型，只要满足下面三项条件当中任意一项，就会被划入限制出口清单。 📌 条件一：模型累计计算量至少达到 10 的 26 次方浮点运算量。 📌 条件二：参数量达到至少 2 万亿。 📌 条件三：具备全球领先能力；判定标准包含在综合性能、专项能力、使用规模、安全性、训练效率等公开评测当中进入全球前十。 📎 除此之外，如果模型训练过程使用了中国《数据安全法》定义的重要数据，该模型同样归入限制出口清单。 ✅ 草案设置两类豁免情形，满足其一即可不划入限制出口管控。 📌 第一种：训练仅使用极少量重要数据，占全部训练数据比重不足 0.1%；该部分数据不会实质性提升模型能力；同时采用数据脱敏、清洗等防护手段，确保这部分数据不会在模型输出内容当中复现。 📌 第二种：训练所用到的重要数据属于合法向公众公开的数据。 🏛️ 根据商务部的说明，针对限制出口清单内 AI 技术的监管，重点判断标准是技术是否从中国境内向境外完成技术转移。 🤝 商务部同时表示，致力于建设 AI 开源生态，推动行业共同发展，并明确四条执行口径。 📌 第一，达到限制清单阈值的开源基础大模型，完成向商务部登记之后，可自动获得出口批准。 📌 第二，限制清单内的模型，如果部署在我方主体自主运营的海外基础设施上，完成登记后自动获得出口批准。 📌 第三，通过应用程序接口、应用、网页界面、软件即服务、移动端 / 电脑端轻量化本地部署这类方式对外提供模型调用访问，不属于本次草案的监管范围。 📌 第四，在海外进行本地部署限制清单内模型，需要遵守本草案规则；但如果部署于模型开发方自主运营的海外基础设施，登记后依旧可以自动获得审批。 📝 草案明确，几类跨境交易行为需要向监管机构履行事前登记义务。 📌 将技术所有权向境外进行转移。 📌 将境内技术授权给境外主体使用。 📌 境内技术的所有权人、实际控制人变更为境外实体。 💡野村机构观点 📊 我们判断，本次新规对于国内基础大模型行业的短期影响整体可控，已经对外公开发布的开源模型可以享受草案豁免条款。 ✅ 国内 AI 实验室已经对外发布的开放权重模型，大概率能够适用该项豁免；国内前沿大模型系列大多属于开放权重模型。 🤔 但独立 AI 实验室未来发展前景相对复杂。 🔋 考虑到国内算力资源紧张，部分独立 AI 实验室未来计划将新模型部署在海外云基础设施，以此服务海外用户。 ⚠️ 该计划有可能会被本次监管草案阻碍，只有满足下面两个条件其中之一才可以实现。 📌 条件一：新模型被监管机构认定属于开源模型。 📌 条件二：受管制模型部署在模型开发方自主直接运营的海外云设施之上。 📈 我们认为第二个条件对于独立 AI 实验室门槛较高；但是对于已经布局海外自建数据中心的三家互联网平台公司构成利好，分别是阿里巴巴（美股，买入评级）、字节跳动（未上市）、腾讯（港股，买入评级）。 🎯 草案监管对象主要是前沿大模型，例如参数量超过 2 万亿的模型；大量轻量化模型不在监管覆盖范围。 ✨ 像深度求索 V4.1 Flash、通义千问 3.8‑Flash 这类轻量化模型，依靠优秀性价比实现海外大规模使用，基本不受约束。 ❓ 草案当中依旧存在部分模糊地带，监管机构后续拥有调整执行尺度的操作空间。 📌 模型训练所用数据，如果被判定为《数据安全法》下的核心数据，会被划入禁止出口清单；如果判定为重要数据，则划入限制出口清单；法律条文对于核心数据、重要数据的定义存在较大解释空间。 📌 草案将海内外模型平台、评测机构给出的全球排名，作为划入限制清单的判定依据，但并未明确指定具体采用哪些排名、哪些评测机构。 📜 草案规定，不在禁止清单内的开源模型对外发布至海外市场可以自动获批。 ⚠️ 但草案没有明确定义何为 “开源”；国内主流 AI 实验室发布前沿模型大多采用开放权重模式，并非严格技术定义上的开源。 💬 结合我们和多家 AI 实验室业内人士沟通，我们倾向于认为，只要国内前沿大模型整体依旧落后全球顶尖大模型，监管机构大概率会将当下开放权重的实践广义视作符合开源原则。 🧭 我们的判断建立在监管会采取务实 AI 政策的前提之上：监管一方面重视 AI 安全、数据安全、技术主权，另一方面也希望国内 AI 实验室能够追赶全球顶尖同行，即便国内算力约束条件更加严苛。 🌍 海外市场对于国内大模型具备财务与战略双重关键意义。 📊 根据我们测算，海外市场能够贡献国内独立 AI 实验室30%‑50% 的模型相关收入；同时海外用户高频调用，还可以加速模型迭代优化。 ✅ 基于以上原因，我们认为现阶段监管大概率会继续允许国内前沿大模型参与全球市场竞争。 ⭐ 在我们覆盖的中国互联网公司当中，我们更看好阿里巴巴，它在国内 AI 领域实力突出，电商业务还可以提供稳定现金流。#文字观点", "publish_time": "2026-10-19 13:03", "tags": ["文字观点"]}, "attachment:files/策略 - 微观资金结构如何了·周末一刻钟系列20261018.pdf": {"id": "attachment:files/策略 - 微观资金结构如何了·周末一刻钟系列20261018.pdf", "kind": "attachment", "title": "策略 - 微观资金结构如何了·周末一刻钟系列20261018", "source_label": "策略", "excerpt": "策略-微观资金结构如何了·周末一刻钟系列20261018 要点总结 1.市场止跌的第一性原理在宏观与中观，微观资金只影响节奏与体感：微观资金动向决定下跌的节 奏、空间与实际体感，但并非市场调整的根源；回答\"抛售压力是否出清\"需先看宏观中观何时明朗。", "content": "策略-微观资金结构如何了·周末一刻钟系列20261018 要点总结 1.市场止跌的第一性原理在宏观与中观，微观资金只影响节奏与体感：微观资金动向决定下跌的节 奏、空间与实际体感，但并非市场调整的根源；回答\"抛售压力是否出清\"需先看宏观中观何时明朗。 2.十月末是宏观层面重要观察窗口，明确企稳的右侧信号大概率在11月后浮现：两条线索——一是中 东局势与美国中期选举的关联，11月3日中选节点关键，地缘演变会通过油价、通胀预期影响海外流 动性与风险资产估值；二是十月末至11月初宏观与产业事件密集，包括美联储FOMC会议、APEC会 议提供的中美对话窗口，以及美股大型CSP厂商财报与资本开支指引落地。 3.宏观明朗前1-2周资金难以系统性回归，短期可能回踩，核心风险点在杠杆资金：融资盘7月后虽 有减仓，但并非全部真正离开融资系统；以电子为代表的板块杠杆去化相对滞后，需在未来1-2周持续 观察。 4.主动权益基金：总量缓和、结构分化，系统性卖压有限：上半年偏股混合型累计净赎回约2600多亿 份，7-8月收窄至600多亿份；混合偏股型基金仓位从4月初81.6%降至6月底77.9%，下半年基本 维持在77%-78%。三季度电子、通信持仓占比分别降至27.8%和9.2%，较二季度高点回落两到三 成，回落幅度大于同期流通市值占比收缩幅度，科技核心方向仓位消化已较充分。 5.保收益诉求带来的潜在卖盘体量有限：国庆后万得偏股混基金指数年内转负，截至本周五年初以来 累计跌5.7%，超六成主动权益基金年内收益转负；年内涨跌幅在±2%以内的普通股票型与偏股混合型 基金规模合计不到4000亿元，即使按减仓5%的悲观假设，对应减仓规模也不到200亿元。 6.杠杆资金是最需关注的资金主体，融资余额下降不等于杠杆出清：截至本周四，下半年融资资金累 计净流出五千多亿元，融资余额从接近3万亿回落至2.47万亿，电子和通信净流出最多。判断出清需 看两个维度：一是融资者交易心态，若融资余额下降但担保物中现金规模上升，说明资金仍在信用账户 内观望而非离场（7月调整期间及10月少数交易日已现类似特征）；二是行业内部去化是否充分—— 电子行业融资杠杆比例较年中仅降10.9%，而流通市值占比降幅接近30%；建材融资余额占仓位比例 反而上升33.1%，同期流通市值占比下降25.9%；通信去化相对充分。 7.险资与固收加对科技敞口有限，无需特别担忧：固收加科技持仓约1900多亿元，保险资金约3200 亿元，均明显低于主动权益、私募、外资及杠杆资金。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 8.私募：主动兑现而非被动止损，后续回补空间大：8月起转为减仓， 衡并随后两年转向过剩。长安汽车与宁德时代（CATL）计划将合资电池产能从50GWh扩至75GWh，新增25GWh设施预计2027年投产，并深化固态与钠电池合作。宝马在沈阳启动第六代高压电池量产（全球第三座Gen6工厂），采用大圆柱电芯与细胞到包（cell-to-pack）架构，能量密度提升超20%、充电速度与续航改善达30%。广汽集团旗下Greater Bay Technology（GBT）在广州改造现有产线，实现全固态电池 Cells 量产（初始1GWh，可扩至4GWh），采用有机-无机复合电解质，可在传统锂电设备上兼容生产。赛力斯（Seres）延长与CATL的长期绑定，Aito全系搭载CATL电池，重庆工厂将新增10-12GWh产能（总超20GWh），并拓展至充电与海外市场。韩国Standard Energy呼吁政府支持钒离子等非锂储能技术示范，Eco&Dream募资350亿韩元备战2027年前驱体创纪录出货及硫化物固态电解质等下一代材料。蔚来在国庆假期完成119万次电池换电，日均增长22%，凸显换电网络利用率提升。 3. 欧洲动态：储能盈利窗口开启、固态装车测试与材料创新 彭博新能源财经（BNEF）指出，欧洲自2022年能源危机以来累计投入约400亿美元建设的电池储能资产，正因天然气价格波动与可再生能源出力变化而迎来“强劲冬季盈利窗口”，英国储能收入中约73%已转向批发交易套利。弗劳恩霍夫研究所（Fraunhofer）开发出新型铝负极架构，可消除体积膨胀、省去石墨/硅与铜集流体，有望降低材料与制造成本且兼容现有产线。固态电池方面，ProLogium与Rimac Technology规划2027年功能性电池包、2027下半年全包、2028下半年上路测试；法国ACC工厂达产500万只电芯（可装4万辆车），2027年将再启12.9GWh区块（总产能近26GWh，长期目标40GWh）。查尔姆斯理工大学研究可重构电池包，通过旁路弱电芯延长EV电池寿命超20%。标致雪铁龙（Peugeot）发布RCZ Vision概念车，搭载Factorial固态电池与1000V架构，宣称续航600公里、10-80%充电仅需10分钟（仍处概念阶段）。 4. 其他区域与材料价格：硫化物/硫正极处于验证期，金属价格全面走弱 英国-澳大利亚Gelion与一家全球前15车企签署协议，评估其纳米封装硫（NES）正极在液态/固态电解质及不同负极组合下的表现，旨在降低关键原料依赖。商品价格方面（截至10月16日），氢氧化锂现货周跌16%、月跌22%，电池级碳酸锂现货月跌21%；LFP正极材料月跌10%，前驱体LFP月涨1%但NMC前驱月跌5%；LFP电芯现货价报57美元/kWh（周跌2%），LFP模组价70美元/kWh（同比跌9%），NMC电芯报价72-76美元/kWh。整体看，材料端延续疲软，电芯价格稳中微降，反映需求预期修正与产能释放的滞后影响。 5. 板块估值与伯恩斯坦观点：基本面分化，储能韧性优于车用动力 从伯恩斯坦跟踪的电池产业链公司估值看，CATL A股对应13.1倍2026年预期市盈率，H股17.8倍；LG新能源、三星SDI因盈利波动估值难用PE衡量，但市净率与EV/EBITDA处于历史低位；锂矿商如天齐锂业A股2026年PE仅9.3倍、H股5.2倍，已较充分反映过剩预期；正极材料商EcoPro BM 2026年PE高达124倍，显示市场对其长期高镍渗透率仍存幻想但短期盈利承压。伯恩斯坦在报告重申其年度核心判断：储能（ESS）需求已成为电池行业增长的主引擎，数据中心配储与电网级储能的爆发部分对冲了EV增速放缓；技术路线上，LMR、固态、钠电在2026-27年处于“投资期而非收割期”，投资者应关注具备量产兑现能力的设备与材料龙头，而非单纯追逐概念。 结论：本期周报并未改变伯恩斯坦对电池板块的整体配置框架，但进一步印证了“储能强于动力、材料弱于电芯、新技术早于大规模商业化”的格局。操作上，建议投资者短期规避纯材料端因锂价与需求双杀的波动，逢低布局与北美/欧洲储能供应链深度绑定的电池制造商与设备商，并紧密跟踪2026年四季度欧洲储能现货价差、美国IRA补贴细则落地以及固态电池中试良率数据。#文字观点", "publish_time": "2026-10-19 12:43", "tags": ["文字观点"]}, "post:2026-10-19T17-33:8c7784e38076": {"id": "post:2026-10-19T17-33:8c7784e38076", "kind": "post", "title": "2026-10-19 17:33", "source_label": "帖子正文", "excerpt": "20261019今日段 的数据中心项目#市场段子#文字观点", "publish_time": "2026-10-19 17:33", "tags": ["市场段子", "文字观点"]}, "post:2026-10-19T22-25:192869ee3aaf": {"id": "post:2026-10-19T22-25:192869ee3aaf", "kind": "post", "title": "2026-10-19 22:25", "source_label": "帖子正文", "excerpt": "伯恩斯坦‑中国汽车：金九成色不再🚗9 月中国汽车批发销量同比下滑 9.6%，国内零售销量同比下降 26.8%，出口同比增长 64.2%。📌我们跟踪中国机动车交强险首保上牌数据，我们认为该数据可以最精准反映终端零售真实销售情况。", "content": "伯恩斯坦‑中国汽车：金九成色不再🚗9 月中国汽车批发销量同比下滑 9.6%，国内零售销量同比下降 26.8%，出口同比增长 64.2%。📌我们跟踪中国机动车交强险首保上牌数据，我们认为该数据可以最精准反映终端零售真实销售情况。 📊9 月乘用车零售总销量 167 万辆，同比下滑 26.8%。 📉同比大幅下滑，主要源于消费者信心偏弱，同时去年基数较高；2025 年 9 月受益于力度更强的政府补贴政策。 📈9 月零售年化销量（SAAR）仅为 187 万台，相较 2026 年 8 月的 194 万台进一步走低，同时低于我们测算的正常年化需求中枢约 220 万台。 ⚠️“金九” 行情被消费疲软以及去年补贴扰动带来的高基数所掩盖，这代表季节性因素对需求的拉动作用正在逐步减弱。 🌅10 月上旬市场表现依旧偏弱，乘联会数据显示，包含黄金周在内的 10 月前 11 天零售销量同比下滑 24%。 🔮展望后市，2026 年 12 月起销量同比对比压力会开始缓解，2027 年第一季度基数将完成重置。 🔋9 月新能源车渗透率达到 65%，其中纯电（BEV）占 45.9%，插混（PHEV）占 14%。 📉新能源车销量同比下滑 16.5%；纯电销量同比下滑 9.7%，插混销量同比下滑 29.3%。 ⚠️插混车型面临更大需求压力，一方面纯电技术持续迭代，另一方面政策支持退坡，削弱了插混产品的综合价值。 ⛽燃油车（ICE）销量同比下滑 40.4%。 🏆比亚迪 9 月在中国新能源车市场份额达到 23.1%，相较 7‑8 月的 23.7% 小幅回落，但仍显著高于 2026 年上半年 21.5% 的平均水平。🚙比亚迪依旧是国内规模最大的新能源车制造公司，旗下包含比亚迪、方程豹、腾势、仰望、灵辉多个品牌，合计交付 25 万台。 ⚡旗下最新快充车型市场需求旺盛，随着电池供应约束逐步解除，我们预计未来数月交付量会加速上行。 📋公司管理层表示，新增电池产能每月可多支撑 2 万台快充新能源车的产出，电池供应约束预计会在 2027 年第一季度完全解决。 🥈吉利集团排名第二，销量 13.2 万台，市场份额 14.4%；零跑汽车位列第三，销量 7.8 万台，份额 5.3%。 💎高端品牌 9 月零售销量同比下滑 21.3%，大众主流品牌销量同比大幅下滑 27.8%，高基数叠加去年补贴透支需求，市场持续走弱。 📉主流传统豪华品牌当中，奔驰销量同比下滑 45%，奥迪同比下滑 43%，宝马同比下滑 29%；雷克萨斯、保时捷分别同比下滑 27%、17%。 🌍9 月出口同比增长 64.2%；燃油车出口同比仅增长 1%，新能源车出口同比大涨 164%。 📊出口占乘用车总批发量的 36%，在一定程度对冲国内市场的疲软。 🚚纯电与插混车型出口合计占到总出口规模的 55% 左右。 🥇奇瑞出口继续领跑，9 月出口 20.5 万台，同比增长 48%； 🥈比亚迪出口 17.6 万台，同比增长 154%； 🥉吉利出口 10.6 万台，同比增长 161%。#文字观点", "publish_time": "2026-10-19 22:25", "tags": ["文字观点"]}, "attachment:files/10月行业配置关注红利和成长两条主线20261014.pdf": {"id": "attachment:files/10月行业配置关注红利和成长两条主线20261014.pdf", "kind": "attachment", "title": "10月行业配置关注红利和成长两条主线20261014", "source_label": "其他", "excerpt": "功率半导体：汽车与AIDC重塑供需格局，涨价潮密集来袭 20261015 要点总结 1.行业周期拐点已现，由产能扩张转向供需改善与价格修复：2023—2024年行业因产能快速扩张处 于价格下行周期，2025年筑底，2025年下半年起边际好转；2026年全球等效8英寸成熟制程产能增 速测算为小幅负增长（下降约0%点几），叠加AIDC等新兴需求爆发对传统功率产能", "content": "功率半导体：汽车与AIDC重塑供需格局，涨价潮密集来袭 20261015 要点总结 1.行业周期拐点已现，由产能扩张转向供需改善与价格修复：2023—2024年行业因产能快速扩张处 于价格下行周期，2025年筑底，2025年下半年起边际好转；2026年全球等效8英寸成熟制程产能增 速测算为小幅负增长（下降约0%点几），叠加AIDC等新兴需求爆发对传统功率产能形成挤出效应， 供需进入吃紧、价格上行阶段。 2.涨价已落地两轮，顺价滞后约一个季度，四季度有望再涨：2026年2—5月国内外头部企业提价 8%—15%，7月再次集中涨价；由于此前长协锁价，报表端顺价滞后约一个季度，三季度起报表已体 现涨价贡献，四季度盈利改善更明显。海外方面安森美10月已再涨一轮，国内企业有望跟随，四季度 预计还有新一轮涨价。 3.供给端扩产明显克制，产能向大尺寸迁移：梳理2025—2028年国内外头部功率器件厂商扩产规 划，经历上一轮周期后企业扩产谨慎、\"走一步看一步\"，不再大肆扩张；硅基由8英寸向12英寸过渡 （12英寸有效产出约为8英寸的2.25倍，但良率是主要挑战），碳化硅由6英寸向8英寸过渡（国内 8英寸良率尚未达理想水平）。 4.材料格局：硅基为主流，碳化硅加速渗透、成本差距大幅收窄：传统硅基MOS与IGBT仍占主流应 用；碳化硅凭低导通损耗、耐高温优势在新能源汽车800V三电、光伏储能等高压高功率密度场景渗透 加快，价格较前两年大幅下降，与同性能硅基价差已收窄至约30%（此前为数倍差距）；氮化镓主要 用于消费电子快充等中低压高频场景，在AIDC的PSU部分尝试应用但渗透率仍不高。 5.AIDC成为最大增量，单机架功率与器件价值量激增：传统服务器功率芯片价值仅数百元，800V HVDC趋势下碳化硅器件数量从10个增至24个以上、氮化镓从40个增至128个，单台AI服务器功 率半导体价值量已超200美元；机架功率从传统5—12kW、H100约40kW、GB200/GB300约 125—132kW，预计RubinUltra一代达600kW至1MW。英伟达白皮书迭代路径为：第一代48V供 电→第二代功率模块由分散走向集中（powerrack）→第三代sidecar成主流→第四代原生800V服 务器加SST架构（渗透较慢）。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 6.汽车电动化持续拉动，车规壁垒高、国产替代空间大：国内新能源汽车渗透率已达65%—70%，单 车MOS用量约100—180个，800V普及推动IGBT向碳化硅升级，碳化硅单价与IGBT差距已缩至约 1.3倍。车规芯片需通过AEC-Q认证、功能安全件需满足ISO26262，设计寿命15年以上、15—20 万公里，验证周期长；供应链长期由博世等Tier1绑定，随着国内整车厂份额提升，本土芯片厂商切入 机会更大。 7.竞争格局清晰，中低端国产替代已成、中高端仍待突破：全球市场英飞凌以约17.3%份额（2025年 数据）领先，安森美、ST紧随其后各占5%—10%；国内士兰微、比亚迪半导体在模块出货量较大。 中低端已实现大规模国产替代，中高端MOS、IGBT因起步晚、工艺复杂、缺乏验证机会，仍有进入门 槛。 8.市场规模与下游结构：全球功率器件规模约6000亿元，国内约2500亿元且增速有望更快；下游四 大应用中工业与汽车占比各约25%（2024年数据，未含AIDC），AIDC为后续增长潜力最大的领 域。 9.标的建议关注头部企业：IDM企业关注士兰微、扬杰、华润微、捷捷微电；Fabless关注新洁能； 代工关注芯联集成（部分IDM模式、模块产品）；纯碳化硅/氮化镓关注时代电气、斯达、英诺赛科， 衬底关注天岳。中报整体表现不错，芯联集成、扬杰已发布Q3业绩预告，业绩环比加速，四季度预计 更好。 问答整理 本次电话会为单方面报告解读，未设置问答环节。 原文 功率半导体汽车AIDC重塑行业供需关系涨价潮密集来袭_行业深度报告20261015_原文2026年10 月19日00:05发言人00:00大家好，欢迎参加西部汽车汽车芯片系列E功率半导体汽车加AIDC重塑 行业供需关系，涨价潮密集来袭，行业深度报告解读第138期。目前所有参会者均处于静音状态，下 面开始播报声明，本次电话会议服务于西部证券研究所客户，不构成投资建议，相关人员担投 方案将进一步披露，叠加同期南京物理AI与世界模型大会。 事件三：产业资本与数据供给持续验证。宇树官宣世界物理AI大会，京东开源EgoLive具身数据集缓解训练数据瓶颈，新芯航途完成战略轮融资。海外Figure、Optimus持续释放作业视频，验证物理AI从实验室走向实体作业。 观点重申：物理AI的核心是打通虚拟仿真与真实物理世界，人形机器人是终端载体，#工业场景是国内产业链最快兑现收入的赛道。 仿真软件、工业控制、机器感知构成落地核心底座，产业链价值向#仿真平台、工业智能体、感知硬件迁移。建议关注：中控技术、敏芯股份、索辰科技、能科科技、奥比中光、东土科技、海康威视、品茗科技等。 风险提示：GTC大会技术发布不及预期；人形机器人产业化落地进度不及预期；技术路线迭代风险；下游资本开支不及预期。#文字观点", "publish_time": "2026-10-19 19:12", "tags": ["仿真平台、工业智能体、感知硬件迁移", "文字观点"]}, "post:2026-10-19T19-41:2bf614063b69": {"id": "post:2026-10-19T19-41:2bf614063b69", "kind": "post", "title": "2026-10-19 19:41", "source_label": "帖子正文", "excerpt": "Optimus量产加速+OpenAI官宣入局 机器人板块催化密集【国联民生汽车 崔琰团队】 —————————————— #特斯拉：Optimus产能加速爬坡、瓶颈集中于灵巧手装配与AI泛化 1、产能情况：Optimus周产量由Q2数十台提升至8月的数百台，年底目标建成周产超1000台的全连续自动化", "content": "Optimus量产加速+OpenAI官宣入局 机器人板块催化密集【国联民生汽车 崔琰团队】 —————————————— #特斯拉：Optimus产能加速爬坡、瓶颈集中于灵巧手装配与AI泛化 1、产能情况：Optimus周产量由Q2数十台提升至8月的数百台，年底目标建成周产超1000台的全连续自动化产线，远期规划周产约2万台； 2、硬件瓶颈：单只灵巧手及前臂含100余颗螺钉与小型零件，目前仍以人工装配为主，夹具定位一致性不足导致部分整机需下线返工。触觉传感器存在可靠性问题，公司计划明年推出可更换的\"传感手套\"予以解决； 3、软件瓶颈：机器人面对未经训练的场景时难以稳定完成任务，学习基础任务仍需数天；公司正搭建基础动作库、以动作组合拓展新任务，训练数据已超50万小时（年底前目标翻倍），FSD数据标注团队大部分转岗至Optimus项目，并在多地设立训练中心。 4、落地进展：当前下线的V3并非最终商用版本，主要用于内部测试与数据采集；对外只租不售，首批客户为产线环境与特斯拉相近的少数企业。 #OpenAI：官宣入局人形机器人研发、以大脑为核心攻关方向 1、路线定位：明确机器人外观等并非现阶段研发重点，智能大脑才是核心要务。 2、节奏预期：有望于2027年推出演示样机，但奥特曼同时表示未来几年内难以看到人形机器人走上街头，距正式商业化仍较远。 3、研发投入：已启动运动控制、执行器控制、整机行为开发等岗位招聘；团队正自研集成电机、传动、传感与热管理的机电一体化执行器，同步布局硬件量产相关的制造与供应链。 4、落地规划：短期打造通用机器人、辅助技术工人开展基础设施建设，长期开发面向个人的多元任务场景机器人产品。 #特斯拉将于北京时间10月22日（周四）5:30召开2026Q3业绩会、有望带来机器人进展更新。我们认为，随着特斯拉首批机型内测与规模化量产临近，加之国产机器人行业利好密集催化，海内外进展形成强共鸣，行业正加速进入1-10的产业化落地阶段。#相关标的梳理汽配机器人T链【拓普集团、新泉股份、伯特利、沪光股份、双环传动、隆盛科技】，国产主机厂【宇树科技、小鹏集团】、零部件【浙江荣泰、福赛科技、斯菱智驱】。 风险提示：人形机器人产业发展不及预期#文字观点", "publish_time": "2026-10-19 19:41", "tags": ["相关标的梳理", "文字观点"]}, "post:2026-10-19T12-35:6319ba8bea8d": {"id": "post:2026-10-19T12-35:6319ba8bea8d", "kind": "post", "title": "2026-10-19 12:35", "source_label": "帖子正文", "excerpt": "📌Funda： 💡AI 交易对近期数据已变得敏感得多。投资者正更密切地关注 ARR、个人智能体日活跃用户数和留存率，而更高的收益率已成为不利因素。", "content": "📌Funda： 💡AI 交易对近期数据已变得敏感得多。投资者正更密切地关注 ARR、个人智能体日活跃用户数和留存率，而更高的收益率已成为不利因素。一个引人注目的长期故事如今必须应对月度增长数据，而个人智能体使用量近期的停滞使这一转变更加令人不安。 💡本周，信贷市场又添了一个压力来源。CoreWeave 的债券收益率攀升至约 15%，其五年期 CDS 周四达到约 1195 个基点，投资者开始质疑 AI 建设背后的资金支持；Nebius 和 IREN 也遭到抛售。对于高杠杆的新型云服务商而言，当新资本昂贵或更难获取时，收入增长放缓的破坏性会更大。这可能延迟数据中心的扩张和芯片采购，使担忧蔓延至整个人工智能供应链。我们认为，融资紧缩是本轮抛售的重要放大器：市场目前正在同时检验收入轨迹以及为其提供资金所需的资产负债表。 💡一个相关的需求端变化，新获融资的 AI 实验室（即 \"新实验室\"）已成为短期 GPU 算力的重要边际买家，尽管商业模式尚不确定，它们仍支付高额租金。它们的资金大约可支撑六到十二个月的开支，此后能否继续采购将取决于能否筹集更多资金。我们正密切关注这一点：如果风险偏好减弱、下一轮融资变得更加困难，这些实验室可能会削减算力采购，从而对 neoclouds 的短期租赁费率构成压力。因此，融资环境既会影响 neoclouds 的资本成本，也会影响其客户的支付能力。 💡Anthropic 在 2026 年第三季度实现 168 亿美元营收，按模型推算，9 月期末 ARR 约为 700 亿美元，低于此前跟踪的 800 亿美元预期。放弃大部分蒸馏营收只能解释部分缺口，更难回答的问题是年底前如何达到 1000 亿美元 —— 我们认为公司并未明确指引过这一市场预期。模型显示，9 月滚动 28 天 ARR 约为 690 亿美元；要达到 1000 亿美元，大约需要每月净新增 900 亿美元 ARR，而过去一个季度剔除蒸馏后约为 500 亿美元。Opus 5.5 可能有助于增长加速，但随着竞争辩论加剧，Anthropic 的进展届时可能重新引发对 OpenAI 增长的担忧。 💡年末营收交付将继续推动 AI 交易，预期已变得更难判断，而真正达到 1000 亿美元仍可能令市场意外。我们正在寻找能够拓宽营收增长的下一个应用场景，从药物研发和诊断到供应链自动化和网络防御。更接近 AGI 可能会让投资体验在过程中变得更加艰难：在回报容易证明之前，更多算力会被投入训练。在这一转折点之前找到下一个大型应用，仍然是研究核心。#文字观点", "publish_time": "2026-10-19 12:35", "tags": ["文字观点"]}, "post:2026-10-19T08-58:7794570f3d1b": {"id": "post:2026-10-19T08-58:7794570f3d1b", "kind": "post", "title": "2026-10-19 08:58", "source_label": "帖子正文", "excerpt": "10月19日gf推荐信息汇总 欢迎交流 🔽 【海外】OCP大会： 系统架构升级，CPU与互连需求提升 AI系统加速协同设计，英伟达与思科推出12.8Tb/s可插拔标准，微软计划2027年起部署多GW Maia 300，光互连及800VDC路线推进。调研显示GPU利用率仅20%—30%，液冷仍是瓶颈", "content": "10月19日gf推荐信息汇总 欢迎交流 🔽 【海外】OCP大会： 系统架构升级，CPU与互连需求提升 AI系统加速协同设计，英伟达与思科推出12.8Tb/s可插拔标准，微软计划2027年起部署多GW Maia 300，光互连及800VDC路线推进。调研显示GPU利用率仅20%—30%，液冷仍是瓶颈；Agent有望推动CPU与加速器配比至1:1。看好# 英伟达、PTFE、Marvell、AMD及英特尔。 ——— 【计算机】财报季重视国产链的确定性信号 财报季重视预付款、存货及采购现金流等需求前瞻指标。# 寒武纪 供应链优势预计2027年中后转化为收入增长；浪潮、紫光三季度利润或环比承压，但国产化与超节点放量支撑后续改善。# 晶泰控股 受益AIDD及自研BD催化，# 星环科技 四季度或突破公有云、向推理数据流量收费转型；推荐上述标的及# 广立微、卓易信息、CPU龙头。 ——— 【电子】 # 澜起科技、聚辰股份 CPU扩容带动内存接口需求 Agent提升CPU需求配比，内存接口芯片增长弹性有望达到CPU的两倍。下一代英特尔Diamond Rapids、AMD Venice内存通道数从12增至16，进一步提升接口芯片需求。行业需求逐 63294460": {"id": "post:2026-10-19T17-23:1f5863294460", "kind": "post", "title": "2026-10-19 17:23", "source_label": "帖子正文", "excerpt": "金融街论坛，怎么看？———财通固收·隋修平 1. 如何理解“择机换锚”？", "content": "金融街论坛，怎么看？ ———财通固收·隋修平 1. 如何理解“择机换锚”？ 潘行长原话是：“人民银行将研究择机把央行公开市场主要操作品种的期限切换为隔夜，公开市场隔夜回购利率将相应成为主要政策利率。” 后面一句话从未出现过，央行明确“换锚”，有利于资金成本下移、实现变相降息，从盘面看，被市场理解为利好，但“择机”二字可以回想一下当年的“择机降准降息”，叠加潘行所说的“货币政策框架的转型是一个渐进、持续的过程”，#未来真正“换锚”可能还比较遥远。另一方面，#实际上当前换锚的利好已经部分兑现了，DR001震荡区间由“1.35~1.45”下行至“1.25~1.35”，体现的就是换锚的影响。 因此，我们维持前期判断，短期内市场的交易重心在于央行敲打，债市可能继续保持震荡思路。 2. 什么是“应对非银机构大额赎回的流动性支持工具”？ 第一，主要针对的是债券市场；第二，非常规；第三，针对“听话的孩子”。这不是一项日常给流动性的工具，是为了完善宏观审慎框架的，未来用来应对极端的赎回潮，不能简单理解为利好。 此处贴出6月陆家嘴论坛时潘行长的讲话，供投资者参考： “在此基础上，我们继续研究政策工具，当债券等市场出现系统性压力，正常流动性渠道受阻，#机构群体性面临流动性危机且可能引发系统性风险时，通过互换方式向非银机构提供紧急流动性。 机制设计将综合权衡维护金融市场稳定运行和防范金融市场道德风险。‘特定情景’意味着该机制不是对非银金融机构的常态化流动性供给；#“防范金融市场道德风险”意味着非银机构与央行操作必须满足宏观审慎要求，还要提供高等级抵押品。 债券市场方面，我们有杠杆水平、期限错配管理和窗口指导等工具。刚刚宣布的特定情景下向非银机构提供流动性的工具，也是完善金融市场宏观审慎管理的一项具体举措。 同时，我们将落实强监管要求，加强监管协同，健全行政监管和自律管理功能互补的管理框架，严厉打击内幕交易、财务造假、利益输送等违法违规行为，对各类非法金融活动保持高压态势，维护金融市场秩序。”#文字观点", "publish_time": "2026-10-19 17:23", "tags": ["未来真正“换锚”可能还比较遥远", "文字观点"]}, "attachment:files/策略 - 聚焦一刻系列电话会议：A股见底了吗20261018.pdf": {"id": "attachment:files/策略 - 聚焦一刻系列电话会议：A股见底了吗20261018.pdf", "kind": "attachment", "title": "策略 - 聚焦一刻系列电话会议：A股见底了吗20261018", "source_label": "策略", "excerpt": "策略-聚焦一刻系列电话会议：A股见底了吗20261018 要点总结 1.A股已进入底部区域，但短期是否立即见底尚不确定：本周A股走势偏弱超出预期，与海外市场偏 弱有关，投资者预期较为悲观。但当前悲观情绪已较充分反映此前担忧，基本面担忧已体现在股价中， 进一步下行空间不大，判断当前处于底部区域，可能经历底部震荡。", "content": "策略-聚焦一刻系列电话会议：A股见底了吗20261018 要点总结 1.A股已进入底部区域，但短期是否立即见底尚不确定：本周A股走势偏弱超出预期，与海外市场偏 弱有关，投资者预期较为悲观。但当前悲观情绪已较充分反映此前担忧，基本面担忧已体现在股价中， 进一步下行空间不大，判断当前处于底部区域，可能经历底部震荡。 2.两大宏观担忧已被较充分定价：一是美伊冲突，冲突规模虽小但局势无改善、油价震荡偏强（一度 达110美元），不过美元与贵金属走势显示市场对油价上涨引发紧缩的预期已充分定价；二是美国通 胀数据超预期（9月CPI及核心CPI均高于预期且较8月上行），但10月美联储加息预期仅20%多， 因通胀主要由油价驱动、就业偏弱，美联储无需连续紧缩。 3.美债收益率冲高回落，流动性担忧边际缓解：美债长端收益率上行主因是信用风险与债务担忧而非 通胀加息，美国财政部表态整顿财政纪律，叠加股市下跌推动部分资金增配债券，收益率已明显回落。 10月美联储大概率不加息，流动性担忧虽未完全缓解但已好于此前。 4.交易结构出清已较充分：上证综指跌幅超10%，科创、创业板跌幅超20%，缩量超60%；融资 争 ，统一大市场 ，不能搞各种违法违规的补贴、税费返还等等。那么今年还有一个客观的 约束是地方政府的土地出让金的下滑 ，其实倒逼了地方政府进一步的减少补贴。 发言人 04:45 E6636BB1012F9B6DA981D91E6DDB85C41A69BEDC136DD822EA8B463F47DFE5EA9E4B9DEC435EE8D4A81947CBFF1F40A79D68D4C3089B28975E552C7E5D0DCEF84333635 今年前八个月土地创金的收入是 1.37万亿，比去年进一步的下滑了 28.6，那么今年全年的土地出让 金，恐怕是不到 3万亿，这个相比于峰值有将近 9万亿来说 ，这个已经跌掉了 3分之2以上了 ，所以在这样 的一个背景下 ，地方政府补贴企业 ，不管是意愿还是能力 ，都在进一步的下滑。甚至我们看到了越来越 多的要求企业补税的一些公告。在今年 ，你比如说在这个六月份的时候 ，当时北大荒就披露了这个补 税，21年到25年，要交14年1亿的所得税和滞纳金 ，这个可能比他一年的全年的净利润都要高。今年这 个，梯度补税事项的上市公司 ，不止北大荒一家 ，大概有二三十家。这个是在这个六月份的时候就有所 披露的 ，有些甚至是在后面披露的这个数量 ，应该已经 ，超过了 ，我印象中是超过了去年全年 ，记录的 企业的数量。截止到 6月25号，有80家A股上市公司都公告了这个补缴税款 ，去年全年是 29家，那么在 三季报的时候 ，估计还会有企业继续去公告不缴税款的这样的一个情况。这个应该说 ，他也是在倒逼着 一些企业被迫的去提升它的质量 ，提升它的品牌 ，或者去建立群组 ，淘汰出清。地方政府的这个税收的 监管，包括国税的这个税收的监管力度都在进一步的提升。 发言人 06:33 从已经披露的这个 A股补税的公告的情况来看 ，这个主要的情形有几种 ，一种就是高新技术企业优惠的 政策适用的偏差。因为之前给高新技术企业是有增值税的税率的优惠的。那么关于到底什么是高新技术 这个问题 ，往往都是事后才去进行认定 ，所以像有一些他把这个不属于研发的作为了研发的投入 ，人类 的公司作为研发投入。这些投入去掉之后 ，如果他的这个研发的支出达不到支出的占比的话 ，那么这个 就不属于高新技术企业 ，所以这是一个事后的补缴的主要的原因。 发言人 07:23 第二就是有些跨期的收入和成本 ，它的确认产生的税会有一些差异 ，还有一些对税收优惠的政策理解有 偏差。比如说一些新药的研发 ，他可能还没有到新药的生产的阶段 ，比较早的把这个技术就已经转让出 去了。这个在创新药这个领域里边是非常正常的 ，有一些 BD在早期就已经转让出去了。那这个转让到 底算不算一个科技型的收入 ，这个算不算技术转让款 ？这个问题也会有一些理解的偏差 ，有些地方理解 的就是这个不算 ，因为还没有产生新药 ，还没有研发出来 ，所以不算一个成熟的技术成果。但是这个问 题又在创新药行业里面是非常常见的。 发言人 08:11 还有一些 ，就比如说像这个光伏 ，它的这个发电 ，它占用了一些耕地 ，占了一些农田 ，这个算不算是一 种耕地使用 ？那过去讲这个渔光一体、暮光一体的时候 ，这其实都是下面能养鱼 ，上面能发电 ，这其实 都是一种生态农业和工业的这种结合 ，但是现在对这个问题的认定也存在着一些分歧。所以这些都是我 们看到上市公司公告里边到了补税的这些理由之一。这个误解的主要的还是像高新企业税收优惠 ，还有 西部大开发税收优惠等等等等。所以这些问题也是今年从上半年开始 ，变得越来越普遍了。这个可以说 变相的其实是倒逼的一个过剩产能的初期 ，这也是一种地方政府提高征税的力度。第二加快了这个产业 的反内卷的一种实际的行动。 发言人 09:20 另外一块提高征税 ，它就体现在这个出口退税上面 ，逐渐的下调出口退税 ，这里面新三样 ，这个光伏电 池还有新能源车 ，他们三个的出口退税都有下调。那么这个光伏的出口退税是在 2024 年的时。对 ，然后 到了2026 年，这个4月1号，今年就直接就变成零了 ，那么就是这一步 ，从13到9，然后就到 0。那么电 池是分成两步 ，也是跟这个光伏一样 ，先从13到9，然后今年 4月份的时候没有一次到 0，而是从 9000 降 到了6，然后再逐渐从 0到0。我想这个电池的产能过剩的情况可能比光伏要稍微好一点 ，因为毕竟电池 E6636BB1012F9B6DA981D91E6DDB85C41A69BEDC136DD822EA8B463F47DFE5EA9E4B9DEC435EE8D4A81947CBFF1F40A79D68D4C3089B28975E552C7E5D0DCEF84333635 集中度明显是高于光伏 ，所以光伏组件它的技术门槛也相对高一些 ，所以这个电池的出口退税的速度是 啊比光伏要稍微来的慢一点。 发言人 10:29 第三个是新能源车 ，这个是最新的。这个新能源车的出口退税率是从 13到9。这个有可能未来跟光伏一 样，跟这个电池一样 ，先13到9，然后9到6，那么电池会在明年 1月1号从六变成 0，那么现在新能源车 是明年 4月1号，先从13到9，就是整个时间比这个光伏和电池平均要晚上 1到2年。 发言人 10:59 这个也是通过压缩低价内卷出口 ，倒逼企业靠退税 ，低价来抢单 ，变成靠技术低价 ，靠品牌和海外本地 化的运营 ，来提高企业的市占率和附加值。所以这些其实都是在逼着企业有更好的技术 ，更好的质量、 更好的品牌和更大规模的更长期的可持续的出海的战略政策的方向去进行的转型。所以这些事情某一些 也跟中欧之间的贸易谈判 ，包括欧盟和美国在看法规 ，在贸易补贴上的一些升级是有关的。但是整体来 说的话 ，这个对于行业的出清来说 ，可能是一次进一步的加速 ，所以回到一开始讲到的这个汽车刹车踏 板指甲断裂事情 ，和部委对于速乘车的这种联手的这种制止 ，其实都是一个行业加速出清的一些催化 剂。 发言人 12:13 这个政策本质上是要提升产品的质量 ，让中国制造的这个品牌布局之后 ，又变成了一个低价劣质这样的 一种印象 ，像当年的中国的摩托车一样 ，最后又被欧美的品牌 ，日本的品牌重新的反包。最终要靠这个 产业的升级 ，技术的升级 ，品牌的升级 ，不断的去提升质量 ，所以经历完阵痛之后 ，能够出清的留下来 的这些企业 ，就跟当年的白色家电一样。格力、美的这些白电一样 ，会成为行业里的优胜者 ，会重新的 提高毛利润 ，提高净利率 ，成为一家优秀的全球化的龙头企业。它也成为资本市场的核心资产 ，这就是 这一件事情所引发的一系列的转变和思考。我觉得今年回头来看 ，整个反跌卷进入到了一种常态化 ，也 进入到了一种更加的市场化、法制化的这种路径中。他其实对这些中国的制造业企业 ，出海的企业来 说，长期依然是好事 ，长期这依然是中国最优秀的企业 ，最优秀的民企 ，也是最能够代表中国制造业竞 争力的核心的资产。那么本期的这个去谈 ，我们就聊到这里 ，下周同一时间不见不散 ，拜拜。 E6636BB1012F9B6DA981D91E6DDB85C41A69BEDC136DD822EA8B463F47DFE5EA9E4B9DEC435EE8D4A81947CBFF1F40A79D68D4C3089B28975E552C7E5D0DCEF84333635", "status": "extracted"}, "post:2026-10-19T14-45:acbdf9249c88": {"id": "post:2026-10-19T14-45:acbdf9249c88", "kind": "post", "title": "2026-10-19 14:45", "source_label": "帖子正文", "excerpt": "【机器人】AI巨头入局 重视反弹机会#机器人ETF鹏华159278人形机器人含量领先同类 1️⃣：OpenAI入局人形机器人，核心价值是加速行业时间线 OpenAI重点攻坚机器人高层智能规划层，暂不涉足低延迟的底层执行控制；行业会形成“大模型做顶层规划+专用模型做端侧高频控制”的分层格局。", "content": "【机器人】AI巨头入局 重视反弹机会#机器人ETF鹏华159278人形机器人含量领先同类 1️⃣：OpenAI入局人形机器人，核心价值是加速行业时间线 OpenAI重点攻坚机器人高层智能规划层，暂不涉足低延迟的底层执行控制；行业会形成“大模型做顶层规划+专用模型做端侧高频控制”的分层格局。依靠算力、人才优势，OpenAI将前移整个具身智能行业成熟周期，但只加速智能算法，不加速硬件制造。 2️⃣：人形机器人T链进入量产爬坡阶段，国产产业链催化密集 T链产能提速，10月单周供应商产能目标上千台，全年订单保底1.5万台，11月集中交付，后续还有新增订单；近期多家国内厂商陆续举办工厂开放、生态大会，国产产业链事件催化较多。 3️⃣：特斯拉Optimus执行器实现跨产品复用，硬件产业化持续验证 Optimus腿部执行器被应用在Roadster跑车主动尾翼，印证硬件技术跨场景落地。特斯拉采用系统化模块化设计思路，提升零部件复用性，为规模化生产铺路。 4️⃣：执行器降本是规模化放量的关键，持续跟踪三大验证指标 国内供应链推动执行器成本下行，硬件经济性逐步改善。现阶段尚未迎来Optimus大规模量产，后续重点跟踪执行器成本、生产良率、整机可靠性与实际出货进展。 （历史数据不代表未来表现，基金投资需谨慎）#文字观点", "publish_time": "2026-10-19 14:45", "tags": ["机器人ETF鹏华159278", "文字观点"]}, "post:2026-10-19T12-41:37f703a37797": {"id": "post:2026-10-19T12-41:37f703a37797", "kind": "post", "title": "2026-10-19 12:41", "source_label": "帖子正文", "excerpt": "高盛——胜宏科技（300476.SZ）：迈向下一代AI PCB平台；产能扩张紧随强劲订单增长与最新技术迭代", "content": "高盛——胜宏科技（300476.SZ）：迈向下一代AI PCB平台；产能扩张紧随强劲订单增长与最新技术迭代；维持买入评级 翻译精华 高盛维持公司买入评级，12个月目标价由人民币550元小幅下调至540元，较当前股价（182.00元）隐含约196.7%的上行空间。此番判断的核心逻辑在于：短期产品切换带来业绩波动，但中长期AI算力硬件升级与公司产能释放的共振趋势未改，公司正卡位下一代AI服务器PCB的增量红利。 1. 短期业绩展望：三季度稳健增长，四季度有望迎来环比加速 预计胜宏科技2026年第三季度净利润达16亿元人民币，同比实现增长、环比微增3%，主要受AI PCB贡献提升及产品向新平台逐步迁移支撑。由于旧型号向新一代AI服务器平台切换存在短暂阵痛，高盛小幅下修了2026至2030年盈利预测（幅度1%至4%），但明确指出四季度营收环比增速将明显走强，驱动力来自新一代AI服务器机柜出货爬坡加速，以及规格升级（高阶CCL、更高层数PCB）带来的单机美元价值量提升。 2. 产能扩张与资本开支：积极备战AI PCB下一波需求浪潮 公司正持续扩充MLPCB及HDI产能，惠州第十、十一工厂的新产能正在逐步释放，以承接客户强劲的订单能见度。更值得关注的是，公司已在惠州启动新厂建设，专门面向光模块用mSAP PCB及CoWoS-PCB等前沿产品，旨在捕捉AI集群架构演进带来的增量市场。高盛预计公司2026及2027年资本开支将显著高于2025年水平，反映其为锁定长期份额而主动前置产能布局的战略意图。 3. 核心投资逻辑：五大支柱支撑中长期成长叙事 高盛对胜宏科技保持乐观，基于以下五大驱动因素： • 全球AI基础设施资本开支上行：NVIDIA及ASIC集群放量持续拉动高端PCB需求。 • AI PCB规格持续升级：从普通高层板向M9级材料、高多层及mSAP工艺跃迁，单机价值量（dollar content）显著提升。 • 铜缆替代趋势：AI服务器内部高速连接中PCB对部分铜缆的替代比例上升，扩大单机PCB用量。 • 客户群向ASIC领域拓展：除传统GPU平台外，公司正加速导入各大云厂商自研ASIC AI服务器供应链，客户多元化提升抗风险能力。 • 研发与资本开支承诺：公司持续高强度投入先进制程良率与产能，构筑技术壁垒。 4. 盈利预测与毛利率展望 因产品组合切换导致2026年AI PCB收入短期承压，高盛将2026年净利预测下调4%至84.03亿元，2027至2028年净利预测微调下调1%，对应2027年预测净利润179.22亿元、2028年236.58亿元。毛利率方面，预计2026年为35.6%（略低于此前35.9%），但随高附加值产品占比提升，2027年将回升至41.3%，2028年及以后稳定在38.9%至43.3%的优异区间，凸显产品结构优化对盈利质量的支撑。 5. 估值方法与目标价推导 沿用近端市盈率（P/E）法定价，维持26.3倍2027年预期EPS的目标倍数不变。该倍数取自科技硬件同业前瞻市盈率与盈利增长的相关性模型，并介于胜宏历史均值与均值加一个标准差之间，以体现市场对其AI PCB稀缺性溢价的认可。基于下调后的2027年预期每股收益（20.54元），目标价相应由550元微调至540元。当前股价对应2027年预测P/E仅约8.9倍，考虑其未来三年净利润复合增速有望维持高位，估值性价比突出。 6. 核心投资风险 高盛提示的主要下行风险包括：AI服务器出货放量节奏慢于预期、AI PCB规格升级路径出现延迟或技术替代、以及行业竞争加剧导致份额与定价承压。 结论：高盛认为胜宏科技虽面临短期产品迭代的扰动，但其在AI PCB高阶领域的领先卡位、积极的产能先行策略以及客户结构的持续优化，已使其处于本轮AI硬件通胀的核心受益区间。维持“买入”评级及人民币540元目标价，建议投资者在AI算力基建主线下，逢布局窗口期重点配置该标的。#文字观点", "publish_time": "2026-10-19 12:41", "tags": ["文字观点"]}, "post:2026-10-19T15-48:e64d4f953a47": {"id": "post:2026-10-19T15-48:e64d4f953a47", "kind": "post", "title": "2026-10-19 15:48", "source_label": "帖子正文", "excerpt": "Rubin Ultra 有两种样品方案：一种采用与 Rubin 相同的材料等级；另一种将树脂从 M8 升级到 M9，即采用 M9、低介电常数第一代布料以及 HVLP4 铜箔。", "content": "Rubin Ultra 有两种样品方案：一种采用与 Rubin 相同的材料等级；另一种将树脂从 M8 升级到 M9，即采用 M9、低介电常数第一代布料以及 HVLP4 铜箔。后一种方案的可能性较大，但尚未完全敲定。 正交背板最初采用了……进行打样。", "publish_time": "2026-10-19 15:48", "tags": []}, "post:2026-10-19T08-48:3fdd6712b4af": {"id": "post:2026-10-19T08-48:3fdd6712b4af", "kind": "post", "title": "2026-10-19 08:48", "source_label": "帖子正文", "excerpt": "新材料周观点：关注碳纤维和广东宏大20261018科技方向情绪仍偏弱（美国CPI、Anthropic增速、费半8连跌等），同时市场对三季报业绩相对敏感，还是重业绩、重变化。碳纤维： 特斯拉展示了新款Roadster跑车的飞行功能，该功能利用了SpaceX在火箭方面的技术。", "content": "新材料周观点：关注碳纤维和广东宏大20261018科技方向情绪仍偏弱（美国CPI、Anthropic增速、费半8连跌等），同时市场对三季报业绩相对敏感，还是重业绩、重变化。 碳纤维： 特斯拉展示了新款Roadster跑车的飞行功能，该功能利用了SpaceX在火箭方面的技术。同时珠海航展临近。下游飞行汽车&军工方面均有催化。中复神鹰、光威复材、吉林化纤、吉林碳谷 广东宏大： 民爆矿服主业稳健，国内虽阶段性承压、但海外增长迅速；军贸推进顺利，预计年内有望实现0-1、明年1-N放量，叠加黑索金扩产落地、宏大卫星利润起量，军工多点共振，预计今年净利润10-11亿，对应当前PE 20X。 PCB材料： 1）电子布：下周中国巨石玻纤年会&三季报交流，再进一步跟进行业景气变化。2）树脂：OCP大会NV展出PTFE板卡样品，意味着该方案胜出概率进一步提升，但CH方案也存可能性。3）硅微粉：不论什么方案都受益，只是PTFE标签更明显。 电子气体： 氩气再次重回上涨通道，本周上涨超40%，关注弹性。另重点关注Q4下游电子大宗项目招标进度。#广钢、杭氧玻璃基板、陶瓷基板、ABF重点跟踪产业和价格变化。#文字观点", "publish_time": "2026-10-19 08:48", "tags": ["广钢、杭氧", "文字观点"]}, "post:2026-10-19T12-40:3f025aa970aa": {"id": "post:2026-10-19T12-40:3f025aa970aa", "kind": "post", "title": "2026-10-19 12:40", "source_label": "帖子正文", "excerpt": "高盛——中国PCB系列：建滔积层板（1888.HK，未覆盖）——受益于AI趋势与规格升级，CCL及玻璃纤维布量价齐升 高盛近期在香港组织了针对建滔积层板（1888.HK，未覆盖）的非交易性调研，与管理层就AI驱动下的上游材料供需格局进行了深度交流。核心结论为：AI服务器平台规格持续升级正加速高端CC", "content": "高盛——中国PCB系列：建滔积层板（1888.HK，未覆盖）——受益于AI趋势与规格升级，CCL及玻璃纤维布量价齐升 高盛近期在香港组织了针对建滔积层板（1888.HK，未覆盖）的非交易性调研，与管理层就AI驱动下的上游材料供需格局进行了深度交流。核心结论为：AI服务器平台规格持续升级正加速高端CCL及特种玻璃纤维布的“量价齐升”，且公司凭借垂直整合优势与产能扩张，有望在这一轮AI硬件通胀中显著受益。 1. 涨价趋势明确，AI需求支撑CCL与玻璃布价格强势 受上游材料持续紧张及AI产品需求拉动，公司已于10月中旬再度上调薄玻璃布价格，此前已进行多轮提价。管理层预计，随着下一代高端AI服务器平台（如NVL72及后续架构）采用更高层数、更高频高速的CCL材料，且部分非AI产能转产AI产品导致传统供给趋紧，CCL及玻璃纤维布的强价格态势有望在未来数个季度延续。 2. 特种玻璃纤维产能扩张，卡位低介电与低热膨胀材料升级 公司正积极扩充内部产能，重点包括第一代、第二代低介电常数（Low-DK）、低热膨胀系数（Low-CTE）以及石英玻璃纤维纱，并同步新增玻璃纤维布产能。此类高阶材料是M9级及以上CCL的核心组分，直接对应AI服务器机架中高附加值组件的增量需求，公司产能投放节奏与AI规格升级周期高度契合。 3. 织布机供给瓶颈凸显，公司供应链韧性领先 管理层指出，当前玻璃纤维织布机（loom）全球供应依然紧张，但公司已锁定本年度所需设备。展望2027年，随着主要设备供应商扩产，公司预计将采购更多织布机以支撑产能释放。同时，尽管国产织布机供应逐步增加，但短期内公司仍以海外高端设备为主，这保障了产品一致性与良率，构筑了短期难以复制的供给壁垒。 4. 垂直整合战略构筑成本与交付优势，AI敞口持续扩大 建滔积层板是全球少数实现“玻璃纤维纱—玻璃布—铜箔—CCL”全链条垂直整合的供应商，1988年于内地设厂，目前在全球拥有20余家工厂，产品覆盖消费电子、汽车、工业及AI基础设施等多元场景。其母公司建滔集团（0148.HK）同为全球PCB龙头，亦是公司的重要客户，内部协同进一步强化了订单能见度与产能调配效率。 5. 对AI PCB/CCL产业链的启示（Read-across） 此次调研观点与高盛此前对AI服务器CCL市场的乐观预测相互印证：高盛预计2026至2028年全球AI服务器CCL市场价值年复合增速（CAGR）达161%，至2028年规模将达475亿美元，且高单位价值材料（如Low-DK、石英布）的占比将快速提升。建滔作为上游关键材料供应商，其产能扩张与涨价传导能力，为整个AI硬件供应链的规格升级提供了关键支撑，也预示着上游材料环节在AI资本开支浪潮中的利润池正在重新分配。#文字观点", "publish_time": "2026-10-19 12:40", "tags": ["文字观点"]}, "post:2026-10-19T14-45:82d7193a8fea": {"id": "post:2026-10-19T14-45:82d7193a8fea", "kind": "post", "title": "2026-10-19 14:45", "source_label": "帖子正文", "excerpt": "英伟达多维度突破行业瓶颈，物理 AI 产业迎来规模化爆发拐点 英伟达在2026年GTC大会上重磅发布全开源Cosmos3全模态物理AI模型，叠加Agent Toolkit工具链落地", "content": "英伟达多维度突破行业瓶颈，物理 AI 产业迎来规模化爆发拐点 英伟达在2026年GTC大会上重磅发布全开源Cosmos3全模态物理AI模型，叠加Agent Toolkit工具链落地与全球开发者联盟组建，从底层模型、开发工具、产业生态三重维度解决行业长期痛点，打开产业成长空间。 1）Cosmos 3依托混合Transformer架构实现技术革新，通过推理 + 双专家生成模块攻克物理AI训练数据稀缺、仿真碎片化两大难题，依托海量多模态样本缩短研发周期，同时分层产品矩阵在多项国际权威基准测试登顶，全维度降低全行业研发落地门槛； 2）公司落地NVIDIA物理AI智能体技能并并入Agent Toolkit体系，构建起“基础物理大模型 + 自动化开发工具”双层架构，依托标准化工作流实现物理AI开发全流程自动化，大幅缩减研发调试周期，补齐产业长期存在的工具短板； 3）英伟达牵头设立Cosmos Coalition全球开发者协作联盟，聚合全球顶尖科研团队与产业厂商，实现技术、算力、数据资源共享，统一行业技术标准、改善技术碎片化难题。 机器人、智能驾驶、工业AI三大赛道率先享受技术红利，头部企业集中落地印证商业化落地提速 全赛道头部厂商加速入局验证平台产业化价值：机器人赛道汇聚三星、LG电子、Doosan Robotics、Agile Robots等全球龙头厂商开展技术落地；智能汽车领域理想汽车依托平台落地自动驾驶相关研发项目；视觉AI赛道Centific、Milestone Systems落地工业AI、智能空间配套解决方案，多领域龙头集中落地进一步夯实产业落地逻辑，物理AI商业化落地路径持续走通，行业产业化图景逐步明晰。 全产业链自上而下共振受益，上中下游各环节价值同步兑现 在Cosmos3开源及生态联盟落地催化下，物理AI产业链上游（价值占比35%）、中游（30%）、下游（35%）全链条将开启需求的同步扩容。 1）上游物理AI仿真算力需求较通用大模型高出5-10倍，生态扩张将带动算力、仿真软件、物理数据集行业订单与业务规模的稳步上行； 2）中游作为产业枢纽，感知硬件、物理AI大模型与运动控制系统企业依托开放底座迭代自研物理大模型与端侧操作系统，产品落地节奏有望持续提速； 3）Cosmos平台推动下游精密执行零部件、智能装备整机、及各行业应用场景三大板块的规模化落地能力与商业价值的兑现效率。 相关公司 上游：工业富联、浪潮信息、寒武纪、海光信息、景嘉微、索辰科技、中望软件、海天瑞声、拓尔思 中游：凌云光、禾赛科技、速腾聚创、柯力传感、商汤科技、云天励飞、科大讯飞、三六零、中科创达 下游：奥比中光、金马游乐、中大力德、兆威机电、拓普集团、拓斯达、祥鑫科技、中控技术、五一视界、能科科技、科远智慧、赛意信息、维宏股份、弘信电子、索辰科技、领益制造、麦迪科技#文字观点", "publish_time": "2026-10-19 14:45", "tags": ["文字观点"]}, "post:2026-10-19T20-36:afaa29df92f5": {"id": "post:2026-10-19T20-36:afaa29df92f5", "kind": "post", "title": "2026-10-19 20:36", "source_label": "帖子正文", "excerpt": "IPhone 18出货量情况调研 请问当前iPhone Pro和Pro Max机型从2026年第四季度到2027年第二季度的备货情况如何，与原计划相比是否有调整？", "content": "IPhone 18出货量情况调研 请问当前iPhone Pro和Pro Max机型从2026年第四季度到2027年第二季度的备货情况如何，与原计划相比是否有调整？ iPhone Pro Max机型从2026年9月至2027年1月的备货量从原计划的2,200万部上调至2,300万部。若按季度拆分，2026年第四季度（10月至12月）的备货量约为1,800万部，而2027年1月的备货量约为500万部。根据当前的预测，2027年第一季度的备货量预计在1,700万至1,750万部之间，也可以估算为1,800万部。目前所有机型的预测遵循滚动释放的模式，正式采购订单的能见度基本锁定到2027年1月。 与去年同期相比，iPhone Pro Max在2026年第四季度和2027年第一季度的备货量有何变化？同时，能否提供2027年全年的产量预估，并与2026年的实际产量进行对比？ 与去年同期（17 Pro Max）相比，今年的备货量有所增加。2025年第四季度，17 Pro Max的产量约为1,600万台，而2026年第四季度18 Pro Max的产量为1,800万台。2026年第一季度，17 Pro Max的实际产量约为1,450多万台，也低于2027年第一季度约1,700万至1,800万台的预期。对于全年产量，2027年Pro Max机型的初步预估总量约为4,000万台。作为对比，2026年全年17 Pro Max的预期产量约为3,200万台。 iPhone Pro机型从2026年第四季度到2027年全年的备货量及产量预估分别是多少？ iPhone Pro机型从当前至2027年1月的预估备货量约为3,300万台。其中，2026年第四季度的备货量约为2,700万台，2027年1月的备货量约为600万台。根据目前的预测规划，2027年第一季度的备货量预计在1,900万至2000万台之间，第二季度的内部预估量约为1,600万台。对于2027年全年，预估Pro机型的总产量能达到4,500万至4,600万台。 与去年同期相比，iPhone Pro机型在2026年第四季度和2027年第一季度的产量有何变化？ 对比17 Pro机型的数据，2025年第四季度的产量约为2,600万台，而2026年第四季度18 Pro的产量约为2,700万台。在第一季度方面，2026年第一季度17 Pro的产量约为1,600万台，而2027年第一季度18 Pro的预估产量在1,900万至2000万台之间，产量同样呈现增长趋势。 关于17代机型，今年（2026年）第二季度的出货量以及全年的出货预期分别是多少？ 17代机型在今年（2026年）第二季度的出货量约为1,300万台。由于今年机型分割后仅有两款高端机型在售，低端机型的需求被叠加到了高端机型上。对于全年，17代机型的出货预期并不乐观，相比之前有大幅削弱。 对比去年（2025年）三款机型（Pro Max、Pro及基础款）的总出货量，今年（2026年）机型的总出货量表现如何？ 今年（2026年）的总出货量相较去年（2025年）是下降的，即便将所有款型都计算在内。去年三款机型合计最终的出货量达到了约6,300万台。今年的大方向是规格提升，但款型变少，虽然单个款型的数量有所增加，但总出货量是减少的。 在Pro机型的组装业务中，公司的份额是怎样的？ 在Pro机型项目前期，组装份额为90%。后期会略有下降，预计会分出约10%的份额给塔塔和立讯等厂商，最终整体份额将持续维持在80%左右。如果其他厂商报告了更高的份额，可能是因为他们将Apple Care的业务量也计算在内了。 近期是否有关于Pro和Pro Max排产计划下修的情况？具体调整的幅度和执行时间是怎样的？ 确实存在排产下修的通知，但这一下修并非立即执行，而是计划在明年（2027年）第一季度执行。下修的原因是物料价格持续上涨，客户预判未来销量可能不及预期，因此对采购订单锁定期之外的预测部分进行了小幅调整。目前收到的下修量合计约为200万台，这一下修量是针对公司的，不确定竞争对手如和硕、立讯等是否面临更大规模的调整。排产计划的调整是常态，通常会进行每周回顾（weekly review），例如周三评估物料状态，周五评估成品出货和订单需求，因此每周都可能出现订单的微调。 关于200万台的下修量，Pro和Pro Max各自的下修比例是怎样的？这是否反映了需求放缓？ 这200万台的下修量是Pro和Pro Max两款机型的合计数量，其中Pro机型下修的量稍微多一些。这种调整幅度在总订单量的5%左右，属于正常波动。这确实反映了需求放缓的趋势，主要原因是18代机型价格较去年上涨了1,000多元，超出了部分消费者的承受能力，导致一些有刚性需求的用户转向选择Pro或旧款机型。 去年（2025年）第四季度三款机型合计出货6,300万台，今年（2026年）同期预计为4,500万台。明年（2027年）第一季度正常款机型上市后，其出货量预期如何？ 明年（2027年）第一季度正常款（标准款型）机型上市后，初期的出货量不会太大。原计划量产时间在1月底（约1月20日），但由于生产线量产前验证的一个环节出现延误，预计要到2月10日才能开始向客户发货。经过客户验证等流程后，真正开始量产发货的时间将在2月中下旬，因此对第一季度的贡献有限。根据目前的产能预估，2月份每个款型的出货极限约在50多万台。到3月份，出货量会开始爬升，每个款型预计能达到250万至300万台的水平，因此三款机型在3月份合计出货量可能不足1,000万台。新机型的产能爬坡通常需要两个月时间，所以真正的放量预计要到4月份。总体而言，明年第一季度的出货量仍将主要依赖现有的高端机型。 2026年第一季度，标准款机型的月度产量预期是多少？为何其销量似乎低于Pro和Pro Max机型？ 2026年3月份，标准款机型的单月产量预计将爬升至250万至300万台，按照往年经验，实际上线产量大约在280万台。尽管具备相应的产能，但市场需求订单未必能完全匹配。客户方面会综合考虑产能爬坡情况与实际市场需求来下达订单。标准款销量相对较低主要是需求问题。往年，低端与高端款型通过价格差吸引消费者，且芯片性能差异不大（例如同为A19或A20系列）。但现在低端款型的可选项有限，且部分机动款型被安排在春季上市，导致用户选择减少。一旦新品发布初期的热度消退，后续选择该款型的用户便会减少。此外，春节后的购买高峰期已过，消费者利用新品进行社交展示的心理需求减弱，购买意愿也随之降低。综合来看，这些因素导致了标准款机型的订单需求减少。 2026年第一季度整体的生产节奏和订单情况如何？与2025年同期相比有何变化？ 往年首月的量产爬坡阶段，产量通常在80万至120万台。今年2月份由于春节假期影响，工厂返工率不高，人员相对偏少，因此更加依赖高度智能化的生产线。虽然智能化产线效率高，但数量有限，导致整体产能爬坡速度不会太快。同时，节后用户购买意愿相对降低，市场需求并不急迫。因此，客户一方面会照顾产能爬坡节奏，另一方面会根据安全库存和实际销售速度进行平衡，不会要求全员加班加量生产。第一季度末至第二季度初通常是订单相对薄弱的时期。对比来看，2025年负责的第17代机型产量约为1,300万台，份额为50%。2026年第一季度的总产量预计为1,150万台，基本与去年同期持平。 对于即将推出的第18代系列中的标准款、Air款和E款机型，2026年第一季度及2027年全年的生产和销售预期分别是多少？ 对于将在明年（2027年）1月开始生产的第18代标准款机型，预期单月产量上限约为300万台，整个第一季度（按三个月计算）产量约为900万台。对于Air款型，以第17代Air为例，公司承担了超过70%的订单份额，但该机型市场表现较差，单月实际销量不足200万台。对于今年的第18代Air，预计将获得接近80%的份额，但实际月销量能突破100万台已是极限。在生产方面，考虑到客户安全库存和订单爬坡速度，计划在3月份将月产能提升至250万台以上，力争达到280万台，极限情况下通过加班可接近300万台。至于第18代E款机型，由于其定位是纯粹的低价产品线，且目前第17代E款仍在销售，导致第18代E款的价格难以降低，预计其销量不会太大。 2026年第四季度的订单是否有下调？第一季度的订单调整情况如何？ 2026年第四季度的订单量暂时没有下调，因为采购订单早已滚动释放并锁定。PO锁定周期是X+3+1模式，因此在9月份新品发布时就已经完成了相关调整。2026年第一季度的订单量有小幅度的相对下调。具体来说，是下修了Pro和Pro Max机型的订单。 在订单下修之后，2027年第一季度Pro和Pro Max两款机型的最新预测出货量分别是多少？ 订单下修后，预计2027年第一季度Pro机型的出货量约为1,900万台，Pro Max机型的出货量约为1,700万台。两者合计为3,600万台，相较于之前的3,800万台，整体下修幅度约5%。 关于代号为“Duo”的新产品，其最新的量产计划、订单和物料准备情况是怎样的？ 该产品的量产计划已提前，内部已于10月16日转入大规模量产，并同步开启外部预定。目前项目正处于从工程验证阶段向量产过渡的最后时期。在订单与物料方面，当前已锁定的正式采购订单为350万台。不过，已到位的物料可以支持约720万套产品的生产。如果市场反馈积极，订单量有可能增加至600万至650万台，生产线的极限产能可以达到700万台。 针对代号为“Duo”的新产品，其物料采购、2027年第一季度的出货量预估以及客户的后续规划是怎样的？ 目前已向上游供应商下达了约1,000万套的物料需求，预计这批物料将在2027年1月底前全部到料。对于2027年第一季度，初步预测的出货量在800万至1,000万台之间，此预测数据不包含2026年第四季度的产量。不过，这份预测尚未进行详细拆解，因为客户计划根据产品上市后首月的市场反馈，再制定更具体的生产和配置计划。 考虑到当前的物料和生产准备情况，从2026年第四季度到2027年第三季度这一年周期内，新产品的总产能能否达到3,000万套？ 从生产能力的角度来看，在这一年周期内生产3,000万套是没有问题的。然而，实际产量会受到市场反馈的影响。如果市场反响不理想，产量将面临挑战，主要问题在于良率。 2026年iPhone 17系列中，Pro、Pro Max和标准款的各自出货量分别是多少？ 2026年，iPhone 17 Pro的出货量为1,500万台，Pro Max为900万台，标准款为1,100万台，合计约为3,500万台。 2027年款机型（iPhone19/20系列）的产品规划是怎样的？目前项目进展到了哪个阶段？ 2027年的产品线规划包括五款直板机型和两款折叠机型。直板机具体型号为20、Air、 Pro、Pro Max，外加一款特殊纪念版。折叠机则包括第二代左右折叠机和第一代上下折叠机。目前，所有这些机型都处于Prototype One的工程打样阶段。 从零部件角度看，2027年款机型相较于2026年款有哪些显著的升级或变化？ 2027年款机型的主要零部件升级集中在以下几个方面：首先，高端机型将实现全面屏，前置摄像头和显示屏的物料会发生变化，导致成本增加。其次，折叠机相关的零部件升级较为明显，铰链和显示屏的尺寸会有所变化；特别是上下折叠机型，其屏幕和中控玻璃的价格非常高。最后，人脸识别（3D sensing）及视频摄像头部分有较大的性能规格升级。其他内部组件如钢壳电池、马达、声学部件以及外部按键等没有明显变化。 3D sensing系统在2027年款机型上进行升级的具体原因是什么？ 升级3D sensing系统的主要目的是提升其抗干扰能力和识别精准度。2026年款的Pro和Pro Max机型已将红外识别摄像头移至屏下，但其显示像素和识别性能略有不足，尤其是在用户佩戴口罩或使用磨砂类钢化膜时，识别率会受到影响。因此，2027年的高端机型将对3D sensing所使用的红外摄像头进行升级，以增强其在复杂环境下的识别表现。 2027年款机型的电池技术是否有变化？另外，在AI功能和折叠屏产品策略方面有何规划？ 电池方面没有明显变化，但目前正在配合研发钠电池，只是状态尚不理想。AI功能方面，暂时没有规划颠覆性的性能迭代设计。2027年的主要产品目标是实现全面屏和推出折叠屏手机。折叠屏产品线将对标三星的Flip和Folder系列，其中上下折叠机型主要面向女性用户，但其最终是否推出尚待定，不过相关的工程研发工作仍在持续进行。 关于折叠屏手机的铰链，其成本和技术在2026年和2027年款机型上有何不同？ 2026年款左右折叠机型的铰链模组量产采购价格预计会经历季度性下调，在圣诞节前后会有小幅下调，到2027年3月底会再次下调，至2027年9月时，第一代铰链的价格可能降至80美元左右。对于2027年推出的第二代左右折叠机型，其铰链将进行升级，主要调整加工工艺和材质，采用液态金属转轴和钛合金小结构件。升级后的新铰链初始价格预计在103美元左右，价格方面不会有太大变动。 目前在手机零部件制造中，3D打印技术的应用范围是怎样的，未来是否会进一步扩大？ 目前，3D打印技术主要应用于中框和铰链部件的制造，但其应用占比相对较小，是与多种工艺并行的一种方案。现有的生产线主要分为两种工艺路径：第一种以传统的CNC加工为主；第二种则采用3D打印技术制造预制胚料，再结合少量的CNC精加工来完成最终的外形轮廓和尺寸要求。 3D打印的胚料在完成打印后，为何还需要成本较高的后续加工工序？ 3D打印的胚料需要后续加工，主要源于对产品精度和复杂结构的要求。以一个需要制成带有齿轮结构的空心管状部件为例，为了确保其内部空腔的精度和结构稳定性，打印过程中需要添加支撑结构或预留模具空间，这会降低打印速度。同时，为了给后续的CNC减法加工留出余量，胚料的尺寸需要进行预设。此外，在加工空心管中间的通体柱时，也需要考虑单个部件的产能和性能，这些因素共同导致了后续加工的复杂性和成本增加。 在中框制造方面，3D打印技术的介入程度如何？ 在中框制造中，3D打印技术的介入体量占比约为10%。预计在2026年，所有手机款型中由3D打印技术提供的中框套件总量约为1,000万套。其余的中框则全部采用以CNC为主的传统硬加工工艺生产。 对于中框制造，3D打印工艺与传统CNC工艺在成本和质量等方面有何差异？ 目前，从中框成品来看，采用3D打印工艺和传统CNC工艺的成本差别不大。对于下游的Tier 1整机组装厂而言，无论上游的Tier 2供应商采用何种工艺，其采购中框的价格是相同的。3D打印工艺的主要价值量体现在上游的Tier 3材料层级，该环节的价值几乎翻倍，这部分成本传导至Tier 2层级。因此，虽然产业链上游的成本结构发生了变化，但最终交付给Tier 1客户的产品价格保持一致。 目前3D打印中框的产业链分工是怎样的？ 产业链的分工如下：最下游的Tier 1是终端总装厂，如富士康、和硕、立讯、塔塔，负责出货完整的手机；其上游的Tier 2层级负责提供中框料件；再上游的Tier 3层级则负责提供特殊形状的材料。在传统CNC工艺中，Tier 3提供的是型材，例如四根长方体材料。而在3D打印工艺中，Tier 2层级的厂商也会参与一部分材料制造环节。 3D打印业务主要由哪些层级的供应商负责？ 3D打印业务主要由Tier 2和Tier 3层级的供应商共同承担。Tier 2层级包括工业富联、比亚迪、蓝思科技等公司，公司自身也购买设备并参与生产。Tier 3层级则主要是上游的棒料形态供应商，他们也会采购设备进行生产。这是一个正常的产业链上下游传导过程。 除了常规的产业链传导模式，是否存在其他供应商参与3D打印业务？例如，铂力特和华曙高科在这其中扮演何种角色？ 除了从Tier 4（基础原材料）到Tier 1（最下游）的常规产业链传导模式外，还存在一种直接外发模式。在这种模式下，部分结构件会直接外发给铂力特、华曙高科等公司进行生产。他们完成生产后，会将部件交付给Tier 2层级厂商进行下一步工序。需要明确的是，铂力特和华曙高科等公司主要参与的是铰链部件的直接制造，并不参与中框的3D打印生产。对于中框业务，他们仅作为设备和服务供应商。 用于生产中框的3D打印设备主要从哪些供应商处采购？ 设备到场主要有四种方式：客户提供设备（客供）、直接购买、租赁以及其他方式。设备供应商涵盖国内外多家企业。国内供应商主要为铂力特和华曙高科。国外供应商中，美系厂商包括3D Systems、Desktop Metal、Markforged、惠普和X One；德系厂商则有EOS、Concept Laser、Trumpf、SLM Solutions等。 针对今年10月即将进行的3D打印设备招标，订单份额将如何分配？大族激光等厂商是否会获得主要份额？ 用于生产中框的设备均为超大尺寸型号，其特点是单价高、采购数量少。而大族激光（通过其子公司大族机床）、华工科技、联泰科技等供应商主要生产的是小尺寸3D打印设备，其主流设备尺寸集中在300毫米至600毫米之间。例如，大族机床能做到的设备尺寸上限为800毫米，这类设备的单次购买价格相对较低，常规型号约在60万至110万元人民币，其最新的800毫米尺寸设备价格接近130万元人民币。因此，这些厂商主要参与的是小尺寸设备的供应，与中框生产所需的大尺寸设备属于不同赛道。针对2026年的项目需求，已向国产设备商下发了约1,100台的设备订单，目前设备正在陆续到场安装。#文字观点", "publish_time": "2026-10-19 20:36", "tags": ["文字观点"]}, "attachment:files/IPhone 18出货量情况调研.docx": {"id": "attachment:files/IPhone 18出货量情况调研.docx", "kind": "attachment", "title": "IPhone 18出货量情况调研", "source_label": "其他", "excerpt": "而大族激光（通过其子公司大族机床）、华工科技、联泰科技等供应商主要生产的是小尺寸3D打印设备，其主流设备尺寸集中在300毫米至600毫米之间。", "content": "IPhone 18出货量情况调研 请问当前iPhone Pro和Pro Max机型从2026年第四季度到2027年第二季度的备货情况如何，与原计划相比是否有调整？ iPhone Pro Max机型从2026年9月至2027年1月的备货量从原计划的2,200万部上调至2,300万部。若按季度拆分，2026年第四季度（10月至12月）的备货量约为1,800万部，而2027年1月的备货量约为500万部。根据当前的预测，2027年第一季度的备货量预计在1,700万至1,750万部之间，也可以估算为1,800万部。目前所有机型的预测遵循滚动释放的模式，正式采购订单的能见度基本锁定到2027年1月。 与去年同期相比，iPhone Pro Max在2026年第四季度和2027年第一季度的备货量有何变化？同时，能否提供2027年全年的产量预估，并与2026年的实际产量进行对比？ 与去年同期（17 Pro Max）相比，今年的备货量有所增加。2025年第四季度，17 Pro Max的产量约为1,600万台，而2026年第四季度18 Pro Max的产量为1,800万台。2026年第一季度，17 Pro Max的实际产量约为1,450多万台，也低于2027年第一季度约1,700万至1,800万台的预期。对于全年产量，2027年Pro Max机型的初步预估总量约为4,000万台。作为对比，2026年全年17 Pro Max的预期产量约为3,200万台。 iPhone Pro机型从2026年第四季度到2027年全年的备货量及产量预估分别是多少？ iPhone Pro机型从当前至2027年1月的预估备货量约为3,300万台。其中，2026年第四季度的备货量约为2,700万台，2027年1月的备货量约为600万台。根据目前的预测规划，2027年第一季度的备货量预计在1,900万至2000万台之间，第二季度的内部预估量约为1,600万台。对于2027年全年，预估Pro机型的总产量能达到4,500万至4,600万台。 与去年同期相比，iPhone Pro机型在2026年第四季度和2027年第一季度的产量有何变化？ 对比17 Pro机型的数据，2025年第四季度的产量约为2,600万台，而2026年第四季度18 Pro的产量约为2,700万台。在第一季度方面，2026年第一季度17 Pro的产量约为1,600万台，而2027年第一季度18 Pro的预估产量在1,900万至2000万台之间，产量同样呈现增长趋势。 关于17代机型，今年（2026年）第二季度的出货量以及全年的出货预期分别是多少？ 17代机型在今年（2026年）第二季度的出货量约为1,300万台。由于今年机型分割后仅有两款高端机型在售，低端机型的需求被叠加到了高端机型上。对于全年，17代机型的出货预期并不乐观，相比之前有大幅削弱。 对比去年（2025年）三款机型（Pro Max、Pro及基础款）的总出货量，今年（2026年）机型的总出货量表现如何？ 今年（2026年）的总出货量相较去年（2025年）是下降的，即便将所有款型都计算在内。去年三款机型合计最终的出货量达到了约6,300万台。今年的大方向是规格提升，但款型变少，虽然单个款型的数量有所增加，但总出货量是减少的。 在Pro机型的组装业务中，公司的份额是怎样的？ 在Pro机型项目前期，组装份额为90%。后期会略有下降，预计会分出约10%的份额给塔塔和立讯等厂商，最终整体份额将持续维持在80%左右。如果其他厂商报告了更高的份额，可能是因为他们将Apple Care的业务量也计算在内了。 近期是否有关于Pro和Pro Max排产计划下修的情况？具体调整的幅度和执行时间是怎样的？ 确实存在排产下修的通知，但这一下修并非立即执行，而是计划在明年（2027年）第一季度执行。下修的原因是物料价格持续上涨，客户预判未来销量可能不及预期，因此对采购订单锁定期之外的预测部分进行了小幅调整。目前收到的下修量合计约为200万台，这一下修量是针对公司的，不确定竞争对手如和硕、立讯等是否面临更大规模的调整。排产计划的调整是常态，通常会进行每周回顾（weekly review），例如周三评估物料状态，周五评估成品出货和订单需求，因此每周都可能出现订单的微调。 关于200万台的下修量，Pro和Pro Max各自的下修比例是怎样的？这是否反映了需求放缓？ 这200万台的下修量是Pro和Pro Max两款机型的合计数量，其中Pro机型下修的量稍微多一些。这种调整幅度在总订单量的5%左右，属于正常波动。这确实反映了需求放缓的趋势，主要原因是18代机型价格较去年上涨了1,000多元，超出了部分消费者的承受能力，导致一些有刚性需求的用户转向选择Pro或旧款机型。 去年（2025年）第四季度三款机型合计出货6,300万台，今年（2026年）同期预计为4,500万台。明年（2027年）第一季度正常款机型上市后，其出货量预期如何？ 明年（2027年）第一季度正常款（标准款型）机型上市后，初期的出货量不会太大。原计划量产时间在1月底（约1月20日），但由于生产线量产前验证的一个环节出现延误，预计要到2月10日才能开始向客户发货。经过客户验证等流程后，真正开始量产发货的时间将在2月中下旬，因此对第一季度的贡献有限。根据目前的产能预估，2月份每个款型的出货极限约在50多万台。到3月份，出货量会开始爬升，每个款型预计能达到250万至300万台的水平，因此三款机型在3月份合计出货量可能不足1,000万台。新机型的产能爬坡通常需要两个月时间，所以真正的放量预计要到4月份。总体而言，明年第一季度的出货量仍将主要依赖现有的高端机型。 2026年第一季度，标准款机型的月度产量预期是多少？为何其销量似乎低于Pro和Pro Max机型？ 2026年3月份，标准款机型的单月产量预计将爬升至250万至300万台，按照往年经验，实际上线产量大约在280万台。尽管具备相应的产能，但市场需求订单未必能完全匹配。客户方面会综合考虑产能爬坡情况与实际市场需求来下达订单。标准款销量相对较低主要是需求问题。往年，低端与高端款型通过价格差吸引消费者，且芯片性能差异不大（例如同为A19或A20系列）。但现在低端款型的可选项有限，且部分机动款型被安排在春季上市，导致用户选择减少。一旦新品发布初期的热度消退，后续选择该款型的用户便会减少。此外，春节后的购买高峰期已过，消费者利用新品进行社交展示的心理需求减弱，购买意愿也随之降低。综合来看，这些因素导致了标准款机型的订单需求减少。 2026年第一季度整体的生产节奏和订单情况如何？与2025年同期相比有何变化？ 往年首月的量产爬坡阶段，产量通常在80万至120万台。今年2月份由于春节假期影响，工厂返工率不高，人员相对偏少，因此更加依赖高度智能化的生产线。虽然智能化产线效率高，但数量有限，导致整体产能爬坡速度不会太快。同时，节后用户购买意愿相对降低，市场需求并不急迫。因此，客户一方面会照顾产能爬坡节奏，另一方面会根据安全库存和实际销售速度进行平衡，不会要求全员加班加量生产。第一季度末至第二季度初通常是订单相对薄弱的时期。对比来看，2025年负责的第17代机型产量约为1,300万台，份额为50%。2026年第一季度的总产量预计为1,150万台，基本与去年同期持平。 对于即将推出的第18代系列中的标准款、Air款和E款机型，2026年第一季度及2027年全年的生产和销售预期分别是多少？ 对于将在明年（2027年）1月开始生产的第18代标准款机型，预期单月产量上限约为300万台，整个第一季度（按三个月计算）产量约为900万台。对于Air款型，以第17代Air为例，公司承担了超过70%的订单份额，但该机型市场表现较差，单月实际销量不足200万台。对于今年的第18代Air，预计将获得接近80%的份额，但实际月销量能突破100万台已是极限。在生产方面，考虑到客户安全库存和订单爬坡速度，计划在3月份将月产能提升至250万台以上，力争达到280万台，极限情况下通过加班可接近300万台。至于第18代E款机型，由于其定位是纯粹的低价产品线，且目前第17代E款仍在销售，导致第18代E款的价格难以降低，预计其销量不会太大。 2026年第四季度的订单是否有下调？第一季度的订单调整情况如何？ 2026年第四季度的订单量暂时没有下调，因为采购订单早已滚动释放并锁定。PO锁定周期是X+3+1模式，因此在9月份新品发布时就已经完成了相关调整。2026年第一季度的订单量有小幅度的相对下调。具体来说，是下修了Pro和Pro Max机型的订单。 在订单下修之后，2027年第一季度Pro和Pro Max两款机型的最新预测出货量分别是多少？ 订单下修后，预计2027年第一季度Pro机型的出货量约为1,900万台，Pro Max机型的出货量约为1,700万台。两者合计为3,600万台，相较于之前的3,800万台，整体下修幅度约5%。 关于代号为“Duo”的新产品，其最新的量产计划、订单和物料准备情况是怎样的？ 该产品的量产计划已提前，内部已于10月16日转入大规模量产，并同步开启外部预定。目前项目正处于从工程验证阶段向量产过渡的最后时期。在订单与物料方面，当前已锁定的正式采购订单为350万台。不过，已到位的物料可以支持约720万套产品的生产。如果市场反馈积极，订单量有可能增加至600万至650万台，生产线的极限产能可以达到700万台。 针对代号为“Duo”的新产品，其物料采购、2027年第一季度的出货量预估以及客户的后续规划是怎样的？ 目前已向上游供应商下达了约1,000万套的物料需求，预计这批物料将在2027年1月底前全部到料。对于2027年第一季度，初步预测的出货量在800万至1,000万台之间，此预测数据不包含2026年第四季度的产量。不过，这份预测尚未进行详细拆解，因为客户计划根据产品上市后首月的市场反馈，再制定更具体的生产和配置计划。 考虑到当前的物料和生产准备情况，从2026年第四季度到2027年第三季度这一年周期内，新产品的总产能能否达到3,000万套？ 从生产能力的角度来看，在这一年周期内生产3,000万套是没有问题的。然而，实际产量会受到市场反馈的影响。如果市场反响不理想，产量将面临挑战，主要问题在于良率。 2026年iPhone 17系列中，Pro、Pro Max和标准款的各自出货量分别是多少？ 2026年，iPhone 17 Pro的出货量为1,500万台，Pro Max为900万台，标准款为1,100万台，合计约为3,500万台。 2027年款机型（iPhone19/20系列）的产品规划是怎样的？目前项目进展到了哪个阶段？ 2027年的产品线规划包括五款直板机型和两款折叠机型。直板机具体型号为20、Air、 Pro、Pro Max，外加一款特殊纪念版。折叠机则包括第二代左右折叠机和第一代上下折叠机。目前，所有这些机型都处于Prototype One的工程打样阶段。 从零部件角度看，2027年款机型相较于2026年款有哪些显著的升级或变化？ 2027年款机型的主要零部件升级集中在以下几个方面：首先，高端机型将实现全面屏，前置摄像头和显示屏的物料会发生变化，导致成本增加。其次，折叠机相关的零部件升级较为明显，铰链和显示屏的尺寸会有所变化；特别是上下折叠机型，其屏幕和中控玻璃的价格非常高。最后，人脸识别（3D sensing）及视频摄像头部分有较大的性能规格升级。其他内部组件如钢壳电池、马达、声学部件以及外部按键等没有明显变化。 3D sensing系统在2027年款机型上进行升级的具体原因是什么？ 升级3D sensing系统的主要目的是提升其抗干扰能力和识别精准度。2026年款的Pro和Pro Max机型已将红外识别摄像头移至屏下，但其显示像素和识别性能略有不足，尤其是在用户佩戴口罩或使用磨砂类钢化膜时，识别率会受到影响。因此，2027年的高端机型将对3D sensing所使用的红外摄像头进行升级，以增强其在复杂环境下的识别表现。 2027年款机型的电池技术是否有变化？另外，在AI功能和折叠屏产品策略方面有何规划？ 电池方面没有明显变化，但目前正在配合研发钠电池，只是状态尚不理想。AI功能方面，暂时没有规划颠覆性的性能迭代设计。2027年的主要产品目标是实现全面屏和推出折叠屏手机。折叠屏产品线将对标三星的Flip和Folder系列，其中上下折叠机型主要面向女性用户，但其最终是否推出尚待定，不过相关的工程研发工作仍在持续进行。 关于折叠屏手机的铰链，其成本和技术在2026年和2027年款机型上有何不同？ 2026年款左右折叠机型的铰链模组量产采购价格预计会经历季度性下调，在圣诞节前后会有小幅下调，到2027年3月底会再次下调，至2027年9月时，第一代铰链的价格可能降至80美元左右。对于2027年推出的第二代左右折叠机型，其铰链将进行升级，主要调整加工工艺和材质，采用液态金属转轴和钛合金小结构件。升级后的新铰链初始价格预计在103美元左右，价格方面不会有太大变动。 目前在手机零部件制造中，3D打印技术的应用范围是怎样的，未来是否会进一步扩大？ 目前，3D打印技术主要应用于中框和铰链部件的制造，但其应用占比相对较小，是与多种工艺并行的一种方案。现有的生产线主要分为两种工艺路径：第一种以传统的CNC加工为主；第二种则采用3D打印技术制造预制胚料，再结合少量的CNC精加工来完成最终的外形轮廓和尺寸要求。 3D打印的胚料在完成打印后，为何还需要成本较高的后续加工工序？ 3D打印的胚料需要后续加工，主要源于对产品精度和复杂结构的要求。以一个需要制成带有齿轮结构的空心管状部件为例，为了确保其内部空腔的精度和结构稳定性，打印过程中需要添加支撑结构或预留模具空间，这会降低打印速度。同时，为了给后续的CNC减法加工留出余量，胚料的尺寸需要进行预设。此外，在加工空心管中间的通体柱时，也需要考虑单个部件的产能和性能，这些因素共同导致了后续加工的复杂性和成本增加。 在中框制造方面，3D打印技术的介入程度如何？ 在中框制造中，3D打印技术的介入体量占比约为10%。预计在2026年，所有手机款型中由3D打印技术提供的中框套件总量约为1,000万套。其余的中框则全部采用以CNC为主的传统硬加工工艺生产。 对于中框制造，3D打印工艺与传统CNC工艺在成本和质量等方面有何差异？ 目前，从中框成品来看，采用3D打印工艺和传统CNC工艺的成本差别不大。对于下游的Tier 1整机组装厂而言，无论上游的Tier 2供应商采用何种工艺，其采购中框的价格是相同的。3D打印工艺的主要价值量体现在上游的Tier 3材料层级，该环节的价值几乎翻倍，这部分成本传导至Tier 2层级。因此，虽然产业链上游的成本结构发生了变化，但最终交付给Tier 1客户的产品价格保持一致。 目前3D打印中框的产业链分工是怎样的？ 产业链的分工如下：最下游的Tier 1是终端总装厂，如富士康、和硕、立讯、塔塔，负责出货完整的手机；其上游的Tier 2层级负责提供中框料件；再上游的Tier 3层级则负责提供特殊形状的材料。在传统CNC工艺中，Tier 3提供的是型材，例如四根长方体材料。而在3D打印工艺中，Tier 2层级的厂商也会参与一部分材料制造环节。 3D打印业务主要由哪些层级的供应商负责？ 3D打印业务主要由Tier 2和Tier 3层级的供应商共同承担。Tier 2层级包括工业富联、比亚迪、蓝思科技等公司，公司自身也购买设备并参与生产。Tier 3层级则主要是上游的棒料形态供应商，他们也会采购设备进行生产。这是一个正常的产业链上下游传导过程。 除了常规的产业链传导模式，是否存在其他供应商参与3D打印业务？例如，铂力特和华曙高科在这其中扮演何种角色？ 除了从Tier 4（基础原材料）到Tier 1（最下游）的常规产业链传导模式外，还存在一种直接外发模式。在这种模式下，部分结构件会直接外发给铂力特、华曙高科等公司进行生产。他们完成生产后，会将部件交付给Tier 2层级厂商进行下一步工序。需要明确的是，铂力特和华曙高科等公司主要参与的是铰链部件的直接制造，并不参与中框的3D打印生产。对于中框业务，他们仅作为设备和服务供应商。 用于生产中框的3D打印设备主要从哪些供应商处采购？ 设备到场主要有四种方式：客户提供设备（客供）、直接购买、租赁以及其他方式。设备供应商涵盖国内外多家企业。国内供应商主要为铂力特和华曙高科。国外供应商中，美系厂商包括3D Systems、Desktop Metal、Markforged、惠普和X One；德系厂商则有EOS、Concept Laser、Trumpf、SLM Solutions等。 针对今年10月即将进行的3D打印设备招标，订单份额将如何分配？大族激光等厂商是否会获得主要份额？ 用于生产中框的设备均为超大尺寸型号，其特点是单价高、采购数量少。而大族激光（通过其子公司大族机床）、华工科技、联泰科技等供应商主要生产的是小尺寸3D打印设备，其主流设备尺寸集中在300毫米至600毫米之间。例如，大族机床能做到的设备尺寸上限为800毫米，这类设备的单次购买价格相对较低，常规型号约在60万至110万元人民币，其最新的800毫米尺寸设备价格接近130万元人民币。因此，这些厂商主要参与的是小尺寸设备的供应，与中框生产所需的大尺寸设备属于不同赛道。针对2026年的项目需求，已向国产设备商下发了约1,100台的设备订单，目前设备正在陆续到场安装。", "status": "extracted"}, "post:2026-10-19T13-21:eb5b26442580": {"id": "post:2026-10-19T13-21:eb5b26442580", "kind": "post", "title": "2026-10-19 13:21", "source_label": "帖子正文", "excerpt": "核心观点：今年以来国内大储装机不及预期的最核心原因是西北区域峰谷价差收窄。", "content": "我们发布电新前沿观察：2026年国内大储可能不及预期的原因有哪些？ 🚀#核心观点：今年以来国内大储装机不及预期的最核心原因是西北区域峰谷价差收窄。 目前看市场预期的系统运行费的调整至少短期内难以看到。 下调26年国内大储新增装机至230~250GWh。明年随着锂价下行，以及华北、东北、华南等地起量，国内大储仍有增长潜力。 🚀#主要内容1️⃣峰谷价差下滑以西北为主，原因与负荷增速偏慢、气候因素、储能存量规模较大有一定关系。 2️⃣其他影响储能经济性的重 Q3营收168亿美元，Q3环比增长45%、增速有所下降；季度末累计收入占同期末ARR比例从近20%提升至接近45%；AI交易对ARR、个人智能体日活跃用户数和留存率更敏感，更高收益率成为不利因素。\u003c/li>\n\u003cli>\u003cstrong>半导体/先进封装短期承压，但设备零部件与先进封装材料是核心卡点\u003c/strong>：本周电子板块涨跌幅-7.7%、排名29/30，半导体-8.2%；美国9月CPI超预期叠加市场对AI链投资回报及融资可持续性担忧；湾芯展调研反馈设备零部件全面爆单，成为产业链核心卡点；台积电AI需求远大于供给，资本开支与产能规划全面上修，但仍面临融资、电力供应、科技供应链及ABF载板缺货等变数；玻璃基板进入量产前夕，临时载板与玻璃基IPD已形成规模供货。\u003c/li>\n\u003cli>\u003cstrong>机器人/物理AI催化密集，特斯拉产能爬坡与OpenAI入局形成验证\u003c/strong>：Optimus周产量由Q2数十台提升至8月数百台，当前产量较Q2数十台周产量提升10倍及以上，年底目标建成周产超1000台的全连续自动化，千台以上产能爬坡仍受手部装配复杂、供应链配合及良率约束；OpenAI入局人形机器人，重点攻坚高层智能规划层，暂不涉足低延迟底层执行控制；物理AI板块大涨，索辰科技20%涨停、奥比中光-W涨11.54%、能科科技10%涨停、中控技术涨4.86%。\u003c/li>\n\u003cli>\u003cstrong>AI PCB与光通信规格升级延续，四季度营收与配比数据是直接验证\u003c/strong>：AI PCB从普通高层板向M9级材料、高多层及mSAP工艺跃迁，单机价值量显著提升；旧型号向新一代AI服务器；Meta今明年光模块需求850万支、1810万支，明年800G硅光EML配比62:32、1.6T配比57:41。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型\u003c/strong>\u003c/li>\n\u003cli>主线：海外模型矩阵化+决策模型新赛道，国产化从“芯片”延伸至“模型+算力”。\u003c/li>\n\u003cli>今天强化的逻辑：DeepSeek将TileLang适配昇腾，把GPU算子编程抽象层搬到NPU，降低上层模型对单一硬件栈耦合；DeepSeek V4.1 Flash提升编程与Agent任务性价比；长程Agent与企业工作流加快融合。\u003c/li>\n\u003cli>今天出现的催化/验证：Anthropic Q3营收168亿美元、环比+45%，累计收入占ARR接近45%；AI交易对ARR、个人智能体日活跃用户数和留存率更敏感。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>\u003c/li>\n\u003cli>主线：自主可控链与先进封装材料升级。\u003c/li>\n\u003cli>今天强化的逻辑：国内自主可控链仍被视为未来几年确定性最强核心主线；湾芯展调研反馈设备零部件全面爆单，成为产业链核心卡点；台积电AI需求远大于供给，资本开支与产能规划全面上修；玻璃基板进入量产前夕，临时载板与玻璃基IPD已规模供货。\u003c/li>\n\u003cli>今天出现的催化/验证：电子板块本周-7.7%、排名29/30，半导体-8.2%；美国9月CPI超预期叠加AI链投资回报及融资可持续性担忧；台积电仍面临融资、电力供应、科技供应链及ABF载板缺货变数。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>机器人/物理AI\u003c/strong>\u003c/li>\n\u003cli>主线：特斯拉Optimus产能爬坡+OpenAI入局，物理AI板块集中催化。\u003c/li>\n\u003cli>今天强化的逻辑：Optimus周产量由Q2数十台提升至8月数百台，当前产量较Q2数十台周产量提升10倍及以上；OpenAI重点攻坚高层智能规划层，暂不涉足低延迟底层执行控制；行业形成“大模型做顶层规划+专用模型做端侧高频控制”分层格局。\u003c/li>\n\u003cli>今天出现的催化/验证：年底目标建成周产超1000台的全连续自动化，千台以上爬坡受手部装配复杂、供应链配合及良率约束；物理AI板块索辰科技20%涨停、奥比中光-W涨11.54%、能科科技10%涨停、中控技术涨4.86%。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>\u003c/li>\n\u003cli>主线：AI PCB规格升级带动单机价值量提升。\u003c/li>\n\u003cli>今天强化的逻辑：从普通高层板向M9级材料、高多层及mSAP工艺跃迁；Rubin Ultra两种样品方案，一种采用与Rubin相同材料等级，另一种将树脂从M8升级到M9，采用M9、低介电常数第一代布料及HVLP4铜箔；CCL及玻璃纤维布量价齐升。\u003c/li>\n\u003cli>今天出现的催化/验证：旧型号向新一代AI服务器。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>\u003c/li>\n\u003cli>主线：Meta光模块需求与硅光/EML配比明确，CPO路线逐步清晰。\u003c/li>\n\u003cli>今天强化的逻辑：Meta今明年光模块需求850万支、1810万支；明年800G硅光EML方案配比62:32，1.6T产品配比57:41；主要供应商中际、新易和cohr，东山、剑桥和联特为新进供应商，份额个位数。\u003c/li>\n\u003cli>今天出现的催化/验证：27-29年非光模块端口比例NPO 85%、70%和50%，其余为CPO，29-30年大量使用CPO；东山目前主要供应800G光模块，预计明年份额有所提升。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>市场策略与资金面\u003c/strong>\u003c/li>\n\u003cli>主线：A股底部区域判断与高波动阶段等待。\u003c/li>\n\u003cli>今天强化的逻辑：A股已进入底部区域，但短期是否立即见底尚不确定；悲观情绪较充分反映此前担忧，基本面担忧已体现在股价中，进一步下行空间不大，可能经历底部震荡；微观资金只影响节奏、空间与实际体感，并非调整根源。\u003c/li>\n\u003cli>今天出现的催化/验证：当前高波动阶段建议下周仍以等待为主，重点观察市场何时企稳；资金面呈现杠杆资金撤离、ETF资金承接，近期融资资金持续流出，年内融资净流入已转负；9月22日以来机构持股占比最高组和最低组分别下跌13.6%和6.8%，融资持股占比最高组和最低组分别下跌11.7%和5.9%。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型\u003c/strong>：DeepSeek将TileLang适配昇腾；DeepSeek更新V4.1 Flash；Anthropic Q3营收168亿美元、环比+45%、增速下降，累计收入占ARR接近45%；AI交易对ARR、个人智能体日活跃用户数和留存率更敏感，更高收益率成为不利因素。\u003c/li>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>：电子板块本周-7.7%、排名29/30，半导体-8.2%；湾芯展调研反馈设备零部件全面爆单；台积电AI需求远大于供给，资本开支与产能规划全面上修，但仍面临融资、电力供应、科技供应链及ABF载板缺货等变数；玻璃基板进入量产前夕，临时载板与玻璃基IPD已规模供货。\u003c/li>\n\u003cli>\u003cstrong>机器人/物理AI\u003c/strong>：Optimus周产量由Q2数十台提升至8月数百台，当前产量较Q2数十台周产量提升10倍及以上；OpenAI入局人形机器人；物理AI板块索辰科技20%涨停、奥比中光-W涨11.54%、能科科技10%涨停、中控技术涨4.86%。\u003c/li>\n\u003cli>\u003cstrong>PCB/光通信\u003c/strong>：AI PCB规格升级至M9级材料、高多层及mSAP，单机价值量提升；Rubin Ultra两种样品方案；Meta今明年光模块需求850万支、1810万支，800G硅光EML配比62:32、1.6T配比57:41。\u003c/li>\n\u003cli>\u003cstrong>市场与消费\u003c/strong>：A股已进入底部区域但短期是否立即见底尚不确定；双11首日预售偏弱，专家口径全品类首日增长约10%（去年同日增速
