帖子正文", "excerpt": "# 国轩高科：Q3业绩符合预期，产品结构持续优化 # Q3业绩基本符合预期。", "content": "", "publish_time": "2026-10-29 09:18", "tags": ["文字观点"]}, "post:2026-10-29T08-16:c7a4db285030": {"id": "post:2026-10-29T08-16:c7a4db285030", "kind": "post", "title": "2026-10-29 08:16", "source_label": "帖子正文", "excerpt": "看好PCB上游【东北计算机】 🌟据最新行业研究及测算，受AI服务器需求爆发推动，高阶CCL及PCB上游核心原材料出现严重供需失衡，其中铜箔缺口达33%、玻纤布缺口高达60%。", "content": "", "publish_time": "2026-10-29 08:16", "tags": ["文字观点"]}, "post:2026-10-29T11-04:6fa451187d3e": {"id": "post:2026-10-29T11-04:6fa451187d3e", "kind": "post", "title": "2026-10-29 11:04", "source_label": "帖子正文", "excerpt": "国轩高科2026年三季报分析 1、国轩高科发布2026年三季报，2026Q3实现收入176.62亿元，同比增长74.62%，归母净利润-5.37亿元，扣非净利润1.45亿元，同比增", "content": "", "publish_time": "2026-10-29 11:04", "tags": ["文字观点"]}, "post:2026-10-29T08-18:857f28452021": {"id": "post:2026-10-29T08-18:857f28452021", "kind": "post", "title": "2026-10-29 08:18", "source_label": "帖子正文", "excerpt": "关注三大方向全面大涨 1. Q4高增长确定的方向：【国产AI链】：智谱（本周+12.42%）、寒武纪（+4.35%）、Minimax（+5.865%） 2. AI下一轮叙事主线：【", "content": "", "publish_time": "2026-10-29 08:18", "tags": ["文字观点"]}, "post:2026-10-29T09-29:799225b28838": {"id": "post:2026-10-29T09-29:799225b28838", "kind": "post", "title": "2026-10-29 09:29", "source_label": "帖子正文", "excerpt": "看好，继续看好物理AI【东北计算机】261029 🌊 昨日数采方向个股表现有所分化，今日板块再度走强。", "content": "", "publish_time": "2026-10-29 09:29", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-29T09-15:917cad11f814": {"id": "post:2026-10-29T09-15:917cad11f814", "kind": "post", "title": "2026-10-29 09:15", "source_label": "帖子正文", "excerpt": "【国金计算机&科技】Gemini 4 Carbon发布：谷歌重回综合智能榜首，长程Agent与网络安全能力突破 【#谷歌模型重回SOTA，Coding与Agent能力显著提升】 ——综合智能： Gemini 4 Carbon在Artificial Analysis Intelligence Inde", "content": "【国金计算机&科技】Gemini 4 Carbon发布：谷歌重回综合智能榜首，长程Agent与网络安全能力突破 【#谷歌模型重回SOTA，Coding与Agent能力显著提升】 ——综合智能： Gemini 4 Carbon在Artificial Analysis Intelligence Index v5.0中获得59分，超过Claude Opus 5.5（58分）和GPT-6 Astra（57分），谷歌模型重回全球第一；较两周前发布的Gemini 4 Argon（50分）提升9分。 ——编码与Agent能力： Artificial Analysis测试显示，Terminal-Bench 4.0达65.2%，领先Claude Opus 5.5（59.6%）和GPT-6 Astra（59.1%）。Google披露，Agents’ Last Exam达77.4%，同样领先；内部测试中Carbon可连续自主运行数天，完成大型代码库复杂问题的定位、调试和修复，Agent正由短程任务向长程自主执行演进。 ——专业知识工作能力： Google披露，AutomationBench（Zapier）达53.9%，高于Claude Opus 5.5（42.5%）和GPT-6 Astra（41.4%）。 ——网络安全能力： Google披露，SEC-bench Pro、ExploitGym、CWE-bench分别达88.2%、54.8%、71.0%，均为三项基准下的最优成绩；安全代码生成成功率较Argon提升2倍以上，覆盖漏洞发现、验证到修复的全流程。 【#长程Agent推动算力需求持续扩张】随着Agent从短程Coding向持续数天的自主研发、软件维护和安全运维演进，单任务推理轮次、工具调用及Token消耗有望显著增加。Google公布的首发API定价为输入2美元/百万Token、输出10美元/百万Token，与Argon一致，首发期缓存输入享95%折扣，优惠期后为4美元/20美元。当前仅向部分网络安全防御合作伙伴开放。 我们认为，谷歌与OpenAI、Anthropic在头部模型能力上交替领先，叠加长程Agent应用拓展，有望共同推动Token需求增长，利好云计算、AI服务器及算力基础设施产业链。#文字观点", "publish_time": "2026-10-29 09:15", "tags": ["长程Agent推动算力需求持续扩张】", "文字观点"]}, "post:2026-10-29T08-26:8382a7ff537f": {"id": "post:2026-10-29T08-26:8382a7ff537f", "kind": "post", "title": "2026-10-29 08:26", "source_label": "帖子正文", "excerpt": "【中信证券前瞻】Microsoft微软FY2027Q1季报速评——Azure增长加速至48%，AI商业化持续深化，算力效率驱动增长超预期 【1】财务概览：云业务增长显著加速 公司FY27Q1实现营收923亿美元（同比+19%），经营利润459亿美元（同比+21%），Non-GAAP EPS 4.89", "content": "【中信证券前瞻】Microsoft微软FY2027Q1季报速评——Azure增长加速至48%，AI商业化持续深化，算力效率驱动增长超预期 【1】财务概览：云业务增长显著加速 公司FY27Q1实现营收923亿美元（同比+19%），经营利润459亿美元（同比+21%），Non-GAAP EPS 4.89美元（同比+18%），均超公司预期。按照新财务口径，A&I业务收入768亿美元（同比+25%），其中Microsoft Cloud收入639亿美元（同比+30%），Azure同比增长48%，M365 Commercial Cloud调整后同比增长18%（固定汇率+19%）；D&C收入155亿美元（同比-3%），搜索广告收入同比+12%，Windows OEM及设备同比-22%。商业RPO达到6770亿美元（同比+73%）。展望FY27Q2，公司指引总收入960-971亿美元（同比+18%-19%），其中A&I收入801-807亿美元（同比+24%-25%），D&C收入159-164亿美元。 【2】AI进展：Copilot使用强度与Agent消费持续提升 M365 Copilot 日活跃用户环比增长近50%，拥有超过5万个Copilot席位的客户数量同比增长超8倍。E7套件已获得数千家企业客户采购，付费席位达到数百万，持续推动M365高端SKU升级和ARPU提升。商业模式方面，Copilot 从按席位订阅向“订阅+按量消费”延伸，本季度通过用量计费实际消费Credits的Copilot客户数量环比增长超75%。其他AI应用方面，Foundry客户超过12万家，收入同比增长超3倍；Fabric付费客户达到4.4万家（同比+50%以上），Agent 365注册管理的Agent数量超过5000万个（环比+30%以上），AI商业化逐步从办公助手向企业级Agent平台延伸。 【3】Azure：收入增长加速至48%，Foundry与算力利用率改善 本季度Azure收入332亿美元（同比+48%），较上季度新口径的42%进一步加速，显著超出市场预期。增长主要来自Foundry需求强劲及算力资源利用率改善，其中Foundry收入同比增长超3倍，GPU集群效率提升释放更多可售产能，CPU资源优化及Token定价、模型组合变化亦贡献增量收入。管理层强调，Azure需求依然超过可用供给，企业AI Agent应用部署范围持续扩大，但第三方GPU产能交付有所延期。展望FY27Q2，公司指引Azure固定汇率增长49%-50%，预计现有CPU/GPU资源效率持续改善，有望部分对冲新增产能延期影响；同时强调算力交付节奏、模型定价与工作负载结构变化可能带来季度增速波动。 【4】资本开支与展望：CAPEX低于预期，产能交付延后但AI基础设施建设持续推进 本季度CAPEX为452亿美元，低于此前约500亿美元预期，主要由于部分第三方算力产能延期交付，约75%的资本开支用于CPU、GPU等短周期资产。公司本季度新增24座数据中心，GB300在主要区域的部署上线周期环比缩短约20%，Copilot工作负载吞吐量环比提升超50%，反映软硬件协同优化带来的效率改善。展望FY27Q2，公司预计CAPEX超过500亿美元，2026自然年资本开支约1700亿美元，低于此前1750亿美元预期，主要反映产能交付时间调整；FY27下半年CAPEX预计重新加速，重点投入GPU、CPU及第三方算力资源。公司本季度自由现金流186亿美元，管理层预计FY27全年仍将保持正向自由现金流。我们认为，当前AI需求仍显著超过供给，短期产能交付延后并未改变长期投资逻辑，而基础设施效率提升及AI应用消费增长有望持续改善资本开支回报。 欢迎联系中信前瞻团队！#文字观点", "publish_time": "2026-10-29 08:26", "tags": ["文字观点"]}, "post:2026-10-29T08-26:7dd7f896722a": {"id": "post:2026-10-29T08-26:7dd7f896722a", "kind": "post", "title": "2026-10-29 08:26", "source_label": "帖子正文", "excerpt": "【中信证券前瞻】谷歌3Q26季报速览—宏观事件与AI转型拖累广告增速，云业务强劲但略不及买方预期 【财务概览】 3Q26公司收入1276亿美元（同比+25%，cc+25%，一致预期1282亿美元），营业利润406亿美元（同比+30%，营业利润率31.8%，一致预期432亿美元）；净利润262亿美元（", "content": "【中信证券前瞻】谷歌3Q26季报速览—宏观事件与AI转型拖累广告增速，云业务强劲但略不及买方预期 【财务概览】 3Q26公司收入1276亿美元（同比+25%，cc+25%，一致预期1282亿美元），营业利润406亿美元（同比+30%，营业利润率31.8%，一致预期432亿美元）；净利润262亿美元（同比-25%）。其他收益净亏损82亿美元，主要为所持SpaceX股权的未实现亏损；剔除后，净利润约329亿美元。CapEx 514亿美元（同比+114%）；经营现金流423亿美元（同比-13%），自由现金流-91亿美元。本季度通过ATM发股净融资124亿美元、发债净融资287亿美元。季末未来采购承诺9,240亿美元，未起租租赁及其他义务1,520亿美元。 【谷歌服务】 3Q26广告收入820亿美元（同比+11%）。搜索及其他634亿美元（同比+12%），零售贡献最大、金融次之；YouTube广告112亿美元（同比+9%），品牌广告贡献最大；网络联盟75亿美元（同比+1%）。订阅、平台及设备收入143亿美元（同比+11%），主要由YouTube Music及Premium与Google One AI订阅驱动。搜索查询量增速为近五年最高，管理层表示搜索增速环比放缓主要因汇率、欧盟取消小额包裹免税影响部分APAC零售广告主、2Q26世界杯带动的媒体娱乐广告回落，以及AI Mode查询增长快但变现率仍低。谷歌服务营业利润392亿美元（同比+17%，营业利润率40.7%，同比+2.2pcts）。 【谷歌云】 3Q26谷歌云收入307亿美元（同比+103%），以GCP为主，AI基础设施、AI解决方案与核心GCP均增长强劲，TPU系统销售贡献显著，剔除TPU后增速依然强劲。营业利润111亿美元（同比+209%，营业利润率36.2%，同比+12.5pcts）。Backlog环比增加470亿美元至5,610亿美元，预计未来24个月确认略超55%。TPU客户近100家，除Anthropic、Apple外，新增Physical Intelligence等前沿模型公司及Citadel Securities等资本市场客户，并与Oracle、Crux AI达成TPU系统交付合作。Gemini 4 Argon、Carbon相继发布，第一方模型API每分钟处理token近320亿（环比+40%），Gemini App月活超10亿；近九成财富100强企业使用Gemini Enterprise，AI知识工作席位累计售出超1亿个。 【业绩展望】 收入端：4Q26汇率逆风较3Q26略扩大，主要影响搜索及YouTube广告；搜索继续面临的高基数，管理层表示3Q26因此少增约3pcts，4Q26预计仍拖累约2pcts；TPU系统销售4Q26继续放量，2027年收入显著提升。利润端：受供给约束，3Q26末开始使用第三方算力，4Q26将扩大使用，短期压制云业务利润率；基础设施投入带来的数据中心成本继续增加。资本端：维持2026年CapEx指引1,950-2,050亿美元，2027年将显著增长，具体指4Q26电话会给出；TPU系统备货将继续压制自由现金流。 欢迎联系中信证券前瞻团队！#文字观点", "publish_time": "2026-10-29 08:26", "tags": ["文字观点"]}, "attachment:files/1029强势股脱水.pdf": {"id": "attachment:files/1029强势股脱水.pdf", "kind": "attachment", "title": "1029强势股脱水", "source_label": "其他", "excerpt": "1029强 势股脱水 | 把算力搬上天，连火箭都供不应求 了 xuangut ong.com.cn 2026/10/29 17:36 本文是对当日大涨公司进行研报深度复盘，相关个股信息仅供参考，不构成投 资建议。（1）大涨题材：航天+卫星互联网 29日，AI卫星互联网公司国星宇航正式向港交所递交聆讯后资料，有望成为国 内首个登陆资本市场的太空AI算力服务企业", "content": "1029强 势股脱水 | 把算力搬上天，连火箭都供不应求 了 xuangut ong.com.cn 2026/10/29 17:36 本文是对当日大涨公司进行研报深度复盘，相关个股信息仅供参考，不构成投 资建议。 （1）大涨题材：航天+卫星互联网 29日，AI卫星互联网公司国星宇航正式向港交所递交聆讯后资料，有望成为国 内首个登陆资本市场的太空AI算力服务企业，拿下“太空AI第一股”。 本周早些时候，上海发布卫星互联网方案，提到目标2030年在轨超3000星、 产业规模800亿，以及低轨28组卫星成功发射。 分析认为，此前尽管二级市场行情表现低迷，但商业航天一级市场融资持续火 热。2026年第三季度，垣信卫星、长光卫星、鸿擎科技、星际荣耀等企业分别完成 10亿元规模及以上的融资，垣信卫星完成近70亿元增资，投后估值约500亿。 行情上，航天板块今日逆势走强，顺滑股份、上海沪工等涨停。朗读 全屏 手机 浏览 保存 设置 帮助 退出 （2）研报深度复盘（长江证券、中航证券、中泰证券）：大运力火箭供不应 求 ①全球卫星及航天器发射量从2024年的2874颗增至2025年的4515颗，而部分 新一代卫星在变重：Starlink V3单星质量估算约2吨，AST的BlueBird 6约6.1吨。 星座扩容抬高发射批次，卫星增重抬高单次运力门槛，新增需求正往中大型火箭集 中，小火箭接不住这部分的量。 ②SpaceX承担全球约半数轨道发射，但2026年上半年自用占比升至约78%， 对外商业余量被压到约19次；亚马逊的Amazon Leo计划超过30次、OneWeb再占 一次Ariane 64任务，两家已披露的2027年需求至少32次，缺口还有七八次发射没 着落。ULA的Vulcan与蓝色起源的New Glenn能否稳定交付，直接决定运营商明年 的组网目标能不能兑现。 图片加载中… ③截至9月30日，2026年我国航天发射70次，去年同期59次；民商火箭完成1 6次，发射与成功次数都已追平2025年全年。9月中旬，民商火箭在24小时内连发 两批千帆星座组网星，从“试验载荷承运方”迈入“星座组网服务商”；星网二代 星预期11至12月集采、2027年批量发射，国内组网节奏在往后段递延。 （1）大涨题材：教育+业绩增长 公司预计三季报净利润同比增长超10倍，公司此前主营职业教育，目前已成为 国内AI人才培训龙头，课程包括大模型开发、AI短剧、AI应用等。 上半年《“人工智能+教育”行动计划》、《教育发展“十五五”规划》先后 发布，从应用和中长期规划层面明确“AI+教育”发展方向。另一方面，教育行业 也是AI重要的应用场景。 行情上，公司今日涨停。 （2）研报深度复盘（华西证券、天风证券）：经营杠杆释放 图片加载中… ①26年三季度收入1.74亿元、同比增长64.07%，增长来自AI开发与应用职业 培训报名人数增加、以及学历教育在校生人数增加。产能利用率提升带动毛利率同 比抬升8.0个百分点，收入是带着毛利一起走的。 ②销售、管理、研发费用率分别同比下降5.0、9.9、3.2个百分点，归母净利率 修到24.89%。费用被摊薄之后，利润的增速远远跑在收入前面，经营杠杆在报表上 直接看得见。 ③26年7月公司发布闭环式具身智能人才培养方案与6款分层教学机器人硬件， 课程已覆盖AI大模型开发、具身智能机器人、AI鸿蒙、AIGC微短剧，并与华为、阿 里、科大讯飞、智元等企业共建。三季度末合同负债2.32亿元、同比增长36%，这 笔预收是后续收入的先行指标。 （1）大涨题材：航运+业绩增长 公司主营特种船，具体包括汽车船、纸浆船、重吊船、半潜船，传统集装箱船 难以承接超长、超宽、超重装备，特种船成为高端出海的必需载具。 公司预计三季报净利润同比接近翻倍，行业层面得益于特种船市场需求爆发、 运力趋紧，运价持续上行；公司层面则受益于船队规模增长、运力迭代优化。 行情上，公司今日涨停。 （2）研报深度复盘（国联民生、天风证券、申万宏源）：特种船量价齐升 ①1至9月中国汽车出口同比增长66%，全年有望突破千万辆；同期交运行业的 基金持仓里，航运板块持仓市值环比增269%，占交运基金持仓的49.48%。需求落 在货量上，资金落在仓位上，两边指向的是同一个方向。 ②三季度归母净利润12.5亿元、同比增147%，单季盈利创历史新高；毛利率3 0.4%，同比提升7.0个百分点。运价上行叠加船队扩张，两条腿同时踩下去，毛利 才抬得这么陡。 ③三季度6500CEU汽车运输船一年期期租租金78333美元/天、同比涨65%， 舱位持续紧缺；公司汽车船规模较年初增加29%，三季度新接入一艘重吊船、一艘 汽车船、一艘沥青船。 研报来源 长江证券，杨洋，S0490517070012，通信设备行业商业航天产业链观察系列 七：2027年海外组网提速，大运力火箭供不应求。2026年10月27日 图片加载中… 中航证券，滕明滔，S0640525080001国防军工行业商业航天2026年四季度 展望：千箭竞发，星河长明。2026年10月22日 中泰证券，王子杰，S0740522090001，筹码出清催化密集，重点关注核心标 的。2026年10月29日 华西证券，唐爽爽，S1120519090002，传智教育-Q3业绩超市场预期，转型 AI课程效果显著。2026年10月28日 天风证券，何富丽，S1110521120003，传智教育：26Q3利润&现金流延续 高增，AI短训需求爆发，经营杠杆释放。2026年10月28日 国联民生，黄文鹤，S0100524100004，中远海特三季报点评：汽车船运输量 价齐升，看好核心货种出口景气延续。2026年10月29日 天风证券，陈金海，S1110521060001，中远海特-汽车船高景气，盈利高弹 性。2026年10月14日 申万宏源，闫海，A0230519010004，2026Q3交运行业基金重仓分析：交运 持仓大幅增长，航运、机场及跨境物流板块配置提升明显。2026年10月28日 *免责声明：文章内容仅供参考，不构成投资建议 *风险提示：股市有风险，入市需谨慎", "status": "extracted"}, "post:2026-10-29T07-25:2f413308b34d": {"id": "post:2026-10-29T07-25:2f413308b34d", "kind": "post", "title": "2026-10-29 07:25", "source_label": "帖子正文", "excerpt": "10月29日股市早报：人形机器人/物理AI/工业母机/6G/存储芯片/PCB/商业航天/医药/AI传媒等一、重要财经信息①截至10月28日，2026年新型政策性金融工具全部完成投放，共计8000亿元。②贵州茅台、药明康德“重回”公募十大重仓，前者是被动标配，后者是主动看多", "content": "10月29日股市早报：人形机器人/物理AI/工业母机/6G/存储芯片/PCB/商业航天/医药/AI传媒等一、重要财经信息①截至10月28日，2026年新型政策性金融工具全部完成投放，共计8000亿元。 ②贵州茅台、药明康德“重回”公募十大重仓，前者是被动标配，后者是主动看多；中际旭创稳居榜首。③《北京市“十五五”时期新型能源体系规划》：聚焦钙钛矿太阳能电池及高效光伏组件研发及设备制造，推广建筑光伏一体化。 ④媒体报道，当前投资机构普遍认为市场出现超调，部分年金、保险、公募基金等机构已加大买入力度。 ⑤美股三大指数集体收涨，纳指涨0.27%，道指涨 -29T08-47:c39fce8f83d4": {"id": "post:2026-10-29T08-47:c39fce8f83d4", "kind": "post", "title": "2026-10-29 08:47", "source_label": "帖子正文", "excerpt": "策略会与几家机构交流了最近市场比较担心的险资卖出的事情： 养老和年金很多都是以委外给公募专户的形式，窗口指导难以干预，因为赎回是可以卖出的。现在净值确实打到了一些产品的风控线，卖出时候有些是先从跌的多的票开始卖，再卖跌的少的。", "content": "策略会与几家机构交流了最近市场比较担心的险资卖出的事情： 养老和年金很多都是以委外给公募专户的形式，窗口指导难以干预，因为赎回是可以卖出的。现在净值确实打到了一些产品的风控线，卖出时候有些是先从跌的多的票开始卖，再卖跌的少的。其中有些保险仍然会响应保持较高仓位，会调结构，也有些就把仓位空着等待。 对市场的负反馈一个是在本就缩量的市场，他们的卖出同时还会引发量化跟随，大量抛压导致没有承接。第二个是导致公募不能反向交易，当天执行委托人卖出指令后，想买也买不了。各家机构情况都不一定相似，目前持仓结构和数量也不尽相同，所以很难估算还有多少等着在卖。 所以近期的下跌主要归因是流动性踩踏而非基本面变差，优质标的存在错杀机会。当前科技股尤其AI硬件的暴跌已经较大程度反映了产业趋势担忧、FCC政 策制裁、宏观加息、美债、原油波动、三季报瑕疵等预期，但以上因素后续存在边际改善空间。 7月杀估值、10月杀流动性、明年杀估值、后年杀盈利的一致性悲观预期已提前计提于近三个月的腰斩跌幅。随着后续美股对明后年展望有望出现边际改善、三季报A股AI硬件陆续披露业绩预计增速仍在加速、国 家队资金正以一年来最快最大规模注入流动性，预期与流动性同步改善后，股价的纠偏预计也就不远了。---xz#文字观点", "publish_time": "2026-10-29 08:47", "tags": ["文字观点"]}, "post:2026-10-29T09-22:ebd27c628433": {"id": "post:2026-10-29T09-22:ebd27c628433", "kind": "post", "title": "2026-10-29 09:22", "source_label": "帖子正文", "excerpt": "【中金传媒】基金3Q26传媒持仓分析：偏好小幅回暖 公募基金3Q26报告基本披露完毕，我们分析了传媒板块持仓情况及变化趋势（成分股参考申万传媒指数），3Q26主动偏股型基金重仓持股中，传媒板块比重为0.33%，较2Q26环比提升0.12ppt。个股配置偏好分化，世纪华通、分众传媒和恺英网络的基金重仓", "content": "【中金传媒】基金3Q26传媒持仓分析：偏好小幅回暖 公募基金3Q26报告基本披露完毕，我们分析了传媒板块持仓情况及变化趋势（成分股参考申万传媒指数），3Q26主动偏股型基金重仓持股中，传媒板块比重为0.33%，较2Q26环比提升0.12ppt。个股配置偏好分化，世纪华通、分众传媒和恺英网络的基金重仓市值位居前列。 ☀️评论 3Q26传媒板块维持低配，偏好环比小幅提升。3Q26申万传媒季度上涨0.7%，表现位于各行业涨跌幅中上游，同期沪深300指数下降11.6%。 3Q26主动偏股型基金的重仓持股中，传媒板块比重为0.33%，较2Q26环升0.12ppt。3Q26传媒板块的基金持仓占比与整体市值差距为-1.00ppt（2Q26为-1.02ppt）。#个股变化来看：数字媒体：9月国内首部AI长剧《后西游记》上星播出驱动AI文娱行情演绎，其出品方芒果超媒3Q26重仓基金数量环比增加23只。网络游戏：3Q26游戏板块偏好分化，世纪华通和恺英网络重仓基金数量环比增加居前，但巨人网络和完美世界重仓基金数量环比明显减少。营销广告：分众传媒3Q26重仓基金数量环比增加2只，偏好相对平稳。影视院线：3Q26华策影视和上海电影重仓基金数量环比略有增加。图书出版：凤凰传媒3Q26重仓基金数量环比明显减少。有线广电：东方明珠3Q26重仓基金数量环比增加8只。 #港股通与陆股通持股偏好分化。港股通：网易纳入港股通后，3Q26重仓基金数量57只，快手、泡泡玛特和哔哩哔哩3Q26重仓基金数量环比减少，阅文集团偏好环比小幅提升。陆股通：3Q26陆股通持股比例前10个股中表现分化，吉比特、巨人网络和世纪华通陆股通持股比例位列前三。 估值与建议 维持覆盖评级，盈利预测及目标价。A股推荐游戏（世纪华通/恺英网络等），关注芒果超媒（AI影视应用进展）/分众传媒（股息价值）；港美股推荐网易/阅文集团/欢聚/心动公司/快手，关注腾讯音乐/网易云音乐/猫眼娱乐/大麦娱乐等。 风险 宏观景气度低于预期，监管政策变化，盈利修复较慢。#文字观点", "publish_time": "2026-10-29 09:22", "tags": ["个股变化来看", "文字观点"]}, "post:2026-10-29T16-10:b20d36b2a8c7": {"id": "post:2026-10-29T16-10:b20d36b2a8c7", "kind": "post", "title": "2026-10-29 16:10", "source_label": "帖子正文", "excerpt": "在《经济学人》2026 年 10 月 28 日发表的文章《中国股市是全球罕见的例外》中，该刊探讨了一个引人注目的悖论：如果中国正在主导未来的先进技术与工业制造，为何其投资者却如此悲观？尽管全球主要股市正受制于通胀、利率及科技周期波动，中国股市却呈现出一种深度脱钩的现实，其特征是结构性矛盾、政府干预", "content": "在《经济学人》2026 年 10 月 28 日发表的文章《中国股市是全球罕见的例外》中，该刊探讨了一个引人注目的悖论：如果中国正在主导未来的先进技术与工业制造，为何其投资者却如此悲观？尽管全球主要股市正受制于通胀、利率及科技周期波动，中国股市却呈现出一种深度脱钩的现实，其特征是结构性矛盾、政府干预，以及技术实力与市值之间日益扩大的背离。 分析的关键主题 1）高科技悖论与企业利润： 中国在电动汽车、可再生能源、机器人及高科技供应链等关键先进制造领域迅速领先。然而，这种主导地位并未转化为广泛的企业财富或股市繁荣。激烈的国内价格战、过度竞争以及产能过剩，导致许多工业企业仅能维持微利甚至出现亏损。 2） 人工智能与科技投机的降温： 在零售和机构投资者的狂热追捧之后，中国部分表现强劲的科技及人工智能相关股票遭遇了大幅回调。国内人工智能基础设施和机器人等领域投机泡沫的快速破裂，凸显了国家推动的产业政策与商业盈利能力之间的张力。 3）国内逆风的重量： 更广泛的宏观经济压力继续对投资者情绪造成沉重影响。房地产行业的长期低迷、地方政府债务的持续紧张以及国内消费者需求的疲软，都抑制了市场热情。在就业环境充满挑战的背景下，消费者并未进行消费，而是倾向于保持高储蓄率。 4）国家强力干预： 中国市场仍保持独特的监管模式。国有实体和监管机构频繁介入，举措涵盖打击市场波动与高频交易，以及在市场快速上涨时进行干预。尽管这些措施旨在遏制系统性风险，但也加剧了投资者对政府优先事项凌驾于股东回报之上的担忧。 归根结底，《经济学人》指出，中国市场拒绝照搬全球通用模式：即便中国正巩固其工业强国的地位，国内投资者仍深陷结构性悲观情绪之中。#文字观点", "publish_time": "2026-10-29 16:10", "tags": ["文字观点"]}, "post:2026-10-29T09-12:5ebc42884896": {"id": "post:2026-10-29T09-12:5ebc42884896", "kind": "post", "title": "2026-10-29 09:12", "source_label": "帖子正文", "excerpt": "《广发海外电子通信》 ☄️谷歌-3Q26业绩会纪要 ☀️3Q26低于预期 第三季收入1276亿美元，略低于预期的1282亿美元，受核心广告业务不如预期所致。调整后EPS $2.67低于预期的 $3.02。", "content": "《广发海外电子通信》 ☄️谷歌-3Q26业绩会纪要 ☀️3Q26低于预期 第三季收入1276亿美元，略低于预期的1282亿美元，受核心广告业务不如预期所致。调整后EPS $2.67低于预期的 $3.02。自由现金流为负91亿美元，主要受资本支出投资的推动，并受支持TPU销售而增加的库存及欧盟罚款的影响，未达预期的接近收支平衡。 ☀️2026年资本支出不变 第三季度资本支出514亿美元，环比增加14%、同比增加114%，由绝大部分支出用于基础设施以支持AI投资，65%用于服务器及网络设备，使用寿命通常为六年，35% 投资于数据中心，使用寿命40年。全年资本支出维持在1950-2050亿美元，并持续预期2027年资本支出将大幅增加。 ☀️云端业务强劲 第三季度云端收入达307亿美元，同比增加103%（前季同比增加82%)，主要得益于 GCP 的强劲增长、AI基础设施和方案及TPU系统销售推动增长，公司正全力提升更多算力容量，以满足长期需求。云端业务利润率提升至36.2%。未交付订单金额达到5610亿美元，环比增长9，%预计在未来 24 个月内，将有略高于 55% 的订单总额转化为营收。鉴于供应受限，第三季度末开始引入第三方算力，并将在第四季度进一步加大使用，预计短期内利润率将面临一定压力。 ☀️AI业务加速推进 AI领域的投资正在推动使用量增加和整体查询量的增长，查询量同比增长率达到了近五年来的最高水平，AI Mode 月视觉搜索量已突破 500 亿。 第三季度Gemini 模型就帮助广告主生成了超过 15 亿个广告营销素材，同比增长超过 7 倍。 AI模型客户使用率达到新高，第一方模型 API 目前每分钟处理近 320 亿个 Token，比上季度增长了 40%，处理量同比四倍多。 TPU也是重要贡献，过去 12 个月有超过 2,600 位客户在 Gemini Enterprise 上的使用量至少达到 1000 亿个 Token，近 75 位客户至少达到 10 万亿个 Token。 👉 股价盘后下跌10%，反映三季度利润与营收均未达市场预期，同时AI领域的支出加速影响自由现金流表现。#文字观点", "publish_time": "2026-10-29 09:12", "tags": ["文字观点"]}, "post:2026-10-29T08-13:1ebe3b7ae579": {"id": "post:2026-10-29T08-13:1ebe3b7ae579", "kind": "post", "title": "2026-10-29 08:13", "source_label": "帖子正文", "excerpt": "伯恩斯坦——全球存储与NAND：HBF深度解析——HBF能否成为突破内存瓶颈的终极方案？• 内存墙与AI架构迁移：AI正从训练向高级推理及智能体工作负载演进，内存容量、带宽及数据复用的重要性日益凸显。", "content": "伯恩斯坦——全球存储与NAND：HBF深度解析——HBF能否成为突破内存瓶颈的终极方案？ • 内存墙与AI架构迁移：AI正从训练向高级推理及智能体工作负载演进，内存容量、带宽及数据复用的重要性日益凸显。模型参数膨胀与上下文长度扩展，将超出HBM承载能力，数据被迫向更广阔的存储层级扩散；同时缓存经济学（复用KV缓存的成本仅为重新计算的约10%）激励保留而非重算数据。这推动基础设施从“计算为中心”转向“内存为中心”，需求从单纯的GPU/HBM扩展至传统DRAM、NAND及HDD。 • HBF的核心价值：高带宽闪存（HBF）通过融合HBM级读取带宽与8-16倍于HBM的容量，且每GB成本显著降低，有望大幅提升AI推理的内存效率与经济性。在分层架构中，HBM保留对延迟敏感的活跃数据集，HBF则承载庞大模型参数（如非活跃MoE专家）及可复用的KV缓存。其价值主张并非简单廉价内存，而是通过减少托管大模型所需的GPU/HBM数量，并避免昂贵重算，实现资本开支与计算效率的双重优化。 • 高性能NAND作为新内存层级：多种技术正涌现以填补HBM与传统NAND间的空白，包括HBF、超高性能IOPS SSD（如Storage Next）、低延迟NAND（如Z-NAND）、池化闪存KV缓存平台（如NVIDIA CMX）及CXL附加DRAM。这些方案多基于NAND（尤其中低密度SLC），其采用将消耗大量NAND晶圆产能，无论哪种架构胜出，均将收紧NAND供需平衡，支撑行业定价。 • HBF经济性分析：由于采用高性能SLC闪存及额外硅片面积（TSV、高带宽I/O等），我们估算HBF的晶圆容量置换比（trade ratio）高达6.5倍（基准情景），远高于HBM的约3倍；成本比约为eSSD的10倍。但若按模块定价与HBM相近（容量8-16倍于HBM），HBF毛利率可达80-90%，与NAND闪存持平甚至更高，对NAND ASP、营收及利润具显著增厚效应。 • 对NAND及GPU/HBM需求的影响：HBF有望复刻HBM对DRAM行业的重塑——创造NAND增量需求的同时，因晶圆消耗比高而减少每片晶圆产出的GB数，结构性改善供需。尽管HBF可能降低单工作负载的GPU强度与HBM需求，但杰文斯悖论（Jevons Paradox）下，AI总成本下降将刺激更广泛的应用，反而驱动HBM与GPU的聚合需求增长。 • 技术实现与局限：HBF通过3D堆叠、CBA（CMOS键合阵列）架构、TSV垂直互连、UCIe接口及SLC模式，将NAND转化为高带宽内存。但其本质仍受限于NAND的物理特性：微秒级延迟、页级读取导致有效带宽打折、写入慢及耐久性有限，故无法替代HBM，而是作为互补的分层容量层。 • 商业化挑战：最大障碍是缺乏NVIDIA等关键玩家的背书。Google、Meta、SK海力士已组建HBF联盟，但NVIDIA、铠侠等力推Storage Next与CMX方案。此外，HBF需占用稀缺的CoWoS封装资源，且要求处理器与软件栈重新设计以优化数据放置。NVIDIA已规划至2028年的GPU路线图均未纳入HBF，意味着即便采用也可能在数年后。 • Sandisk的领先地位：Sandisk目标2027年推出首款HBF样品，二代面向边缘AI。其NAND IP、垂直整合制造及系统能力增强执行可信度。HBF尚未纳入公司财务指引，构成潜在上行期权。 投资逻辑与评级 报告覆盖多家存储及硬件公司，均给予跑赢大盘（Outperform）评级，目标价具显著上行空间： • Sandisk (SNDK)：目标价3,000美元（现价1,255.58美元），评级跑赢。 • Seagate (STX)：目标价1,350美元（现价644.21美元），评级跑赢。 • Western Digital (WDC)：目标价600美元（现价356.13美元），评级跑赢。 • Samsung Electronics (005930.KS)：目标价440,000韩元（现价222,000韩元），评级跑赢。 • SK hynix (000660.KS)：目标价2,700,000韩元（现价1,341,000韩元），评级跑赢。 • Micron (MU)：目标价1,300美元（现价903.70美元），评级跑赢。 • KIOXIA (285A.JP)：目标价49,000日元（现价12,605日元），评级跑输（Underperform）。 主要下行风险：HBF商业化进度不及预期；NVIDIA等生态巨头持续不支持；CoWoS封装产能挤占；替代技术（如CXL、CMX）抢占市场；NAND晶圆产能转换导致短期供给波动；AI推理需求增长放缓。 估值与行业影响 HBF的引入将NAND从通用存储升维至AI内存层级，其高置换比（6.5倍）意味着少量需求即可吸收大量晶圆产能，行业供需趋紧将支撑NAND定价与利润率。长期来看，AI推理的爆发与MoE模型普及将放大分层内存架构的价值，具备先发技术优势与生态联盟的厂商将优先受益。#文字观点", "publish_time": "2026-10-29 08:13", "tags": ["文字观点"]}, "post:2026-10-29T21-05:6025b5670c69": {"id": "post:2026-10-29T21-05:6025b5670c69", "kind": "post", "title": "2026-10-29 21:05", "source_label": "帖子正文", "excerpt": "【中信证券汽车/电池】比亚迪发布2026年三季报 #公司2026Q3归母净利润100亿元、扣非86亿元 公司2026Q3收入2215亿元，同比+13.6%，环比+13.8%，扣非归母净利润86.3亿元，同比+25.2%，环比+4.9%，归母净利润100.2亿元，同比+28.1%，环比+21.6%，2", "content": "【中信证券汽车/电池】比亚迪发布2026年三季报 #公司2026Q3归母净利润100亿元、扣非86亿元 公司2026Q3收入2215亿元，同比+13.6%，环比+13.8%，扣非归母净利润86.3亿元，同比+25.2%，环比+4.9%，归母净利润100.2亿元，同比+28.1%，环比+21.6%，26Q3的非经常性损益约14亿元，较过往季度较高，我们预计及主要系公司取得的投资收益 #2026Q3车业务毛利率21.5%环比有所下降 公司2026Q3总体毛利率18.0%，同比+0.4ppt，环比-0.9ppt，其中车业务毛利率21.5%，同比+0.9ppt，环比-1.5ppts，环比小幅下降，我们预计系各类原材料成本持续上涨影响 #2026Q3单车归母7.3k环比微增、单车扣非6.3k有所下滑 车业务扣非82.8亿元，车业务归母96.7亿元，公司三季度销量131.6万辆（国内75.3万辆，海外56.4万辆），单车归母7300元+，环比增加100元+，单车扣非接近6300元，环比下降约900元，我们预计系各类原材料成本持续上涨以及锂电池消费税政策调整影响 #2026Q3利润的干扰项较多、还原后经营层面基本符合预期 26Q3汇兑损失我们预估20亿元左右，2026Q3税金环比增加约7亿元（规模增大以及9月起征收2%锂电池消费税），研发费用环比也多了10亿，影响因素较多。还原汇兑和消费税影响后经营层面净利润接近110亿元，同口径环比有所增长，基本符合此前市场预期欢迎交流，中信证券汽车/电池团队~#文字观点", "publish_time": "2026-10-29 21:05", "tags": ["文字观点"]}, "post:2026-10-29T09-20:af892a415895": {"id": "post:2026-10-29T09-20:af892a415895", "kind": "post", "title": "2026-10-29 09:20", "source_label": "帖子正文", "excerpt": "#信捷电气：业绩符合市场预期，机器人零部件批量供货&产能建设持续 #业绩符合市场预期。公司发布26年三季报。", "content": "#信捷电气：业绩符合市场预期，机器人零部件批量供货&产能建设持续 #业绩符合市场预期。公司发布26年三季报。26Q1-3实现营收17.43亿元，同比+26.2%；归母2.15亿元，同比+19.1%；扣非归母1.70亿元，同比+1.8%；毛利率35.2%，同比-2.0pct，归母净利率12.3%，同比-0.7pct。其中Q3实现营收6.42亿元，同环比+27.1%/+0.7%；归母0.60亿元，同环比+12.2%/-40.9%；扣非归母0.38亿元，同环比-23.4%/-56.3%；毛利率33.4%，同环比-2.0/-1.8pct，归母净利率9.3%，同环比-1.2/-6.5pct，主要系原材料成本上升。综合看，公司业绩符合市场预期。 #持续拓展新行业&大客户、工控主业快速增长。26年以来，AI、半导体及消费电子等下游资本开支修复，叠加制造业设备更新与产线自动化升级，带动OEM市场需求回暖；供应链自主可控推动国产工控品牌份额持续提升。26Q1-3公司PLC/驱动系统/HMI/智能装置实现收入5.66/9.08/1.61/1.02亿元，同比+15.1%/+31.7%/+9.9%/+108.6%。根据MIR，公司26Q3小型PLC/交流伺服市占率分别为9.80%/4.91%，同比+0.15/+0.86pct。同时，公司大型PLC逐步切入流程工业、能源及市政等项目型市场，有望进一步拓宽客户覆盖，打开中长期成长空间。 #机器人核心部件批量供货、产能建设支撑后续放量。公司无框电机已与多家客户达成合作并实现规模化批量供货，多条自动化产线投入使用；同步布局空心杯电机、高性能编码器及配套驱动系统，电感式编码器实现全栈自主可控。产能方面，公司拟投资不低于20亿元建设具身智能及高端制造核心部件项目，其中一期投资8亿元，已于26年1月开工，预计27年10月交付使用。工业AI方面，公司持续推进AI智能编程、故障预警运维及多模态温控等应用。 #期间费用率基本稳定、备货及应收规模增加。前三季度期间费用率24.5%，同比-0.1pct，销售/管理/研发/财务费用率分别为9.8%/4.7%/9.9%/0.1%，同比-0.7/-0.1/+0.3/+0.4pct。前三季度经营活动现金净流入0.64亿元，同比增加0.70亿元，其中Q3净流入0.14亿元。Q3末应收账款/存货/合同负债4.83/11.49/0.71亿元，同比+69.8%/+70.5%/+73.2%。 #投资建议：预计公司26-28年归母净利润预测3.1/3.7/4.4亿元，同比+22%/+21%/+17%，对应现价PE分别为24/20/17倍。公司工控产品持续向高端拓展，机器人核心零部件批量配套及工业AI应用打开中长期成长空间，维持“买入”评级。 风险提示：下游需求不及预期，竞争加剧。#文字观点", "publish_time": "2026-10-29 09:20", "tags": ["文字观点"]}, "post:2026-10-29T07-36:7eb0fdaefd66": {"id": "post:2026-10-29T07-36:7eb0fdaefd66", "kind": "post", "title": "2026-10-29 07:36", "source_label": "帖子正文", "excerpt": "10月FOMC速评 | 财通宏观·张伟 ---------------- 总体来说，这是一场不鹰不鸽、较为中性的FOMC，利率政策按兵不动，既强调经济增长强劲，也强调长期通胀预期平稳，符合市场预期。1、沃什对9月加息的评价： 金融条件边际收紧，但并非已经处于紧缩状态，且沃什称符合他此前的预期。", "content": "10月FOMC速评 | 财通宏观·张伟 ---------------- 总体来说，这是一场不鹰不鸽、较为中性的FOMC，利率政策按兵不动，既强调经济增长强劲，也强调长期通胀预期平稳，符合市场预期。 1、沃什对9月加息的评价： 金融条件边际收紧，但并非已经处于紧缩状态，且沃什称符合他此前的预期。 2、10月暂停加息主要为了规避政治影响。 尽管沃什并不承认这一点，但他并没有很好地解释“既然通胀目标没有实现且多数委员支持12月加息，为什么不在10月就直接加息这个问题”，而是将问题甩给了未来的数据，本质上还是为了规避对紧接着的中期选举的影响。 3、承认通胀预期没有脱锚。 沃什明确认为，虽然实体部门非常短期的通胀预期有所升温，但更多的企业、居民和金融市场的长期通胀预期仍然平稳。 事实也是如此。纽约联储调查显示，实体部门1年期通胀预期已经从2月的3%提升到了9月的3.9%（超过了去年关税战时期，但远低于21-22年），3年期通胀预期只是小幅提升了0.25个百分点（3.0%→3.25%），5年期通胀预期仍然和2月份相当、维持在3%；金融市场类似，美债利率的上行更多是由实际利率贡献的，通胀预期总体较为平稳。 4、美联储是否应该很迫切地连续加息？ 我们的答案仍然是否定的。 沃什在讲话中强调了美联储在通胀方面的职责：确保部分行业的#相对价格变化不会扩散到整个经济，并#确保通胀预期继续保持锚定。 虽然沃什也反复强调2%的PCE同比是底线，但如何回归也很关键。同比增速毕竟是物价相比于12月以前水平的变化幅度，如果是一次性冲击，等同比窗口结束以后增速会自然回落，这种情况实际上不需要过度紧缩的货币政策。真正令央行担忧的是持续性、扩散性的通胀和脱锚的、可能自我实现的通胀预期，#因为这种物价上涨并不会简单地随着时间窗口的推移而回落。 无论是数据还是沃什的讲话，都证明了通胀预期仍然平稳，物价还没有快速扩散的风险，那么连续加息实际上并不是一个合理的选择，而且沃什也承认，多数美联储委员不认为经济已经过热。 此外，#AI资本开支的拐点可能会改变美国通胀。美国当前物价上涨动能中，真正具备内生的、由需求驱动的、有扩散性和持续性的只有AI，如果市场当前对AI资本开支增速即将放缓的预期成立，那么通胀压力实际上也在边际减弱。 5、沃什认为，利率对AI同样会有很重要的影响，并且已经体现在了过去一段时间的信用利差上。 既然如此，这不得不让人怀疑，沃什或者美联储有意通过货币政策干预的方式对AI产业适度降温. 6、沃什认为，美国经济正在越来越强劲、过去几年生产率也在不断提升，而是并不是完全是来自于AI的资本开支，增长范围正在扩大。 7、缩表最早要等到资产负债表小组提交正式报告以后才有可能实施，该报告目前预计会在27年初提交。 8、生产率与就业小组将在11月16日举行听证会，这场听证会可能比FOMC更重要，因为会探讨AI到底会带来更多的通胀，还是冲击更多的就业。#文字观点", "publish_time": "2026-10-29 07:36", "tags": ["文字观点"]}, "post:2026-10-29T17-26:5a4b87591fb7": {"id": "post:2026-10-29T17-26:5a4b87591fb7", "kind": "post", "title": "2026-10-29 17:26", "source_label": "帖子正文", "excerpt": "Marvell拟收购Lumentum：从电芯片到光芯片，AI光互联产业链或迎来大整合 事件：Marvell或斥资超800亿美元收购Lumentum，打造AI光互联全产业链巨头。据彭博、路透10月28日报道，Marvell正与Lumentum进行深入收购谈判，最快下周可能宣布交易。", "content": "Marvell拟收购Lumentum：从电芯片到光芯片，AI光互联产业链或迎来大整合 事件：Marvell或斥资超800亿美元收购Lumentum，打造AI光互联全产业链巨头。 据彭博、路透10月28日报道，Marvell正与Lumentum进行深入收购谈判，最快下周可能宣布交易。目前Lumentum市值约830亿美元，Marvell市值约2200亿美元。消息公布后，LITE盘后一度上涨约11%，MRVL下跌超8%。目前双方尚未签署最终协议。 ① 为何收购？Marvell开始全面进军“大而全”，转型光电一体化平台。 Marvell本是DSP第一梯队，在电芯片（SerDes、TIA/Driver等）领域具备优势，2026年先后完成Celestial AI、Polariton等并购，补齐Scale-up光互联及先进光调制技术。若成功收购Lumentum，将进一步获得InP激光器、CW外置光源、光模块及OCS等核心能力，实现从DSP、电芯片、硅光到激光器的垂直整合。 ② 为何选择Lumentum？不仅仅看重激光器，还有OCS。 随着800G向1.6T、3.2T升级，激光器性能、功率与产能的重要性持续提升。尤其CPO、NPO等架构中，CW光源成为关键组件。此前英伟达已向Lumentum投资20亿美元，并签署长期采购协议。且Lumentum早年就有MEMS技术，在OCS的地位不可忽视，Marvell收购Lumentum或因此切入OCS供应链。 ③ 产业影响：产业日渐走向光电整合，业内玩家整合或加速 展望后续的CPO甚至OIO时代，光电预计将会更紧密的整合，意味着后续厂商需要“光电一体化”设计能力才有望继续立足，若交易成功，Marvell将形成“从电到光”的全技术综合平台，有望强化与博通在AI互联市场的竞争。另一方面，Coherent作为另一家大型独立光器件供应商，战略稀缺性有望提升，但Marvell+Lumentum的整合体未来或对公司造成压力，模组厂商则需关注上游供应商整合带来的议价能力变化。 ⚠④ 交易风险：融资压力巨大，短期不确定性仍高。 Lumentum市值已达800亿美元以上，而Marvell最近季度现金仅约39亿美元，大规模股权融资或换股难以避免，可能带来股权摊薄、整合风险及客户利益冲突。此外，交易仍面临监管审查及最终定价的不确定性。 我们的观点：本次潜在收购最重要的信号，并非单纯的并购溢价，而是AI光互联战略价值持续提升。 随AI集群从Scale-out向跨机柜Scale-up拓展，未来竞争将由单一器件转向电芯片、硅光、激光器及系统架构的协同优化。我们持续看好AI光互联长期成长空间，关注Lumentum、Coherent、Marvell、博通及Tower半导体等产业链公司。#文字观点", "publish_time": "2026-10-29 17:26", "tags": ["文字观点"]}, "post:2026-10-29T10-36:6d34ca6d8e7a": {"id": "post:2026-10-29T10-36:6d34ca6d8e7a", "kind": "post", "title": "2026-10-29 10:36", "source_label": "帖子正文", "excerpt": "陶瓷基板行业专题报告：AI算力升级驱动需求放量，稀土管制加速高端国产替代AI算力功耗指数级跃升，#氮化铝（AIN）基板凭借优异热导率等综合优势、成为AI散热关键衬底材料。本篇报告对AIN基板在AI领域的核心应用场景进行了全面拆解，同时沿产业链脉络对重要标的进行系统梳理。", "content": "陶瓷基板行业专题报告：AI算力升级驱动需求放量，稀土管制加速高端国产替代AI算力功耗指数级跃升，#氮化铝（AIN）基板凭借优异热导率等综合优势、成为AI散热关键衬底材料。本篇报告对AIN基板在AI领域的核心应用场景进行了全面拆解，同时沿产业链脉络对重要标的进行系统梳理。#需求端：AI算力四大场景共振、AlN基板迎量价齐升。800G光模块开始导入AlN，1.6T成为标配，据测算，27年AlN基板需求量预增至8.96亿片，同比+50.84%，市场规模增至13.18亿美元，同比+75.73%。同时，CPO/NPO光互连、HBM热管理及AI服务器PCB/陶瓷HDI混压等场景不断拓展，芯片功耗攀升叠加高密度集成持续打开陶瓷基板增量空间。#供给端：高端市场日企主导、稀土管制加速国产替代。高端AlN基板端，京瓷、丸和、日本精密陶瓷3家占据80%以上DPC基板份额；高端AlN粉体端，日本德山占据全球70%以上份额。随稀土出口管制影响关键烧结助剂氧化钇供应，国内企业迎历史性替代机遇。产业链：聚焦“粉体-基板-金属化”产业链脉络。建议重点关注：①粉体-金属化-基板一体化标的：#国瓷材料、旭光电子；②氮化铝粉体新兴玩家：#金博股份；③DPC载板、光通信基板及管壳领先厂商：#中瓷电子、富乐德、科创新源；④陶瓷混压PCB主要厂商：#科翔股份。#文字观点", "publish_time": "2026-10-29 10:36", "tags": ["国瓷材料、旭光电子", "金博股份", "中瓷电子、富乐德、科创新源", "科翔股份", "文字观点"]}, "post:2026-10-29T12-47:2ff8f9ee6587": {"id": "post:2026-10-29T12-47:2ff8f9ee6587", "kind": "post", "title": "2026-10-29 12:47", "source_label": "帖子正文", "excerpt": "瑞穗证券，Lumentum Marvell 被收购的可能性——股价上涨​​潜力超过 1260 美元 目标价格：1140美元 潜在收购价格：1260美元或以上 相对于当前股价的潜在上涨空间：约 38% 1. Marvell (MRVL) 收购 Lumentum (LITE) 的可能性 彭博社在 10 ", "content": "瑞穗证券，Lumentum Marvell 被收购的可能性——股价上涨​​潜力超过 1260 美元 目标价格：1140美元 潜在收购价格：1260美元或以上 相对于当前股价的潜在上涨空间：约 38% 1. Marvell (MRVL) 收购 Lumentum (LITE) 的可能性 彭博社在 10 月 28 日股市收盘后报道称，Marvell 正在就收购 Lumentum 进行深入谈判。 Marvell 市值：约 2260 亿美元 Lumentum 市值：约。 $83B 具体收购条款和企业价值尚未披露。 瑞穗证券分析了过去15年中10家最大的上市半导体公司并购案例。 平均收购价值：相对于过去 12 个月的收入，市销率约为 7 倍 P/S 范围：3~24x 平均收购溢价：约 38% 将 38% 的平均收购溢价应用于 Lumentum 的收盘价 913.95 美元，得出潜在收购价格超过 1260 美元。 2. Marvell 和 Lumentum 合并带来的协同效应 瑞穗银行评估认为，两家公司的合并可能会打造一家行业领先的网络解决方案提供商。 Lumentum 的核心技术： 用于可插拔光模块的先进激光器 NPO/CPO 光学技术 OCS（光开关） 泵浦激光器 漫威的核心技术： 先进的铜缆网络 光通信 DSP NPO 和铜互连 Celestial AI 的 Scale-up Photonics 合并可以扩大生产能力、业务规模和融资能力。 3. Lumentum 的核心竞争力 ① 在 EML、CW 激光和 OCS 技术领域处于市场领先地位。 ② 基于共识的每股收益增长率： Lumentum：2027 财年增长 150%，2028 财年增长 63% 漫威：2027财年增长49%，2028财年增长73% ③ 拥有强大的 NPO/CPO 业务渠道，主要客户包括 NVIDIA (NVDA)。 $NVDA ④ 一家在基于 InP 的 EML/CW 激光器市场领先的公司，推动数据中心的大规模光通信转型。 瑞穗银行估计，到 2030 年，相关市场规模将达到约 600 亿美元。 4. 有可能成为史上规模最大的半导体并购案 过去 15 年间，半导体行业发生了大约 25 起并购案，其中前 10 笔交易的金额从 5 亿美元到 350 亿美元不等。 如果对目前市值约为 830 亿美元的 Lumentum 的收购成功，这可能是半导体行业历史上规模最大的并购案。 Lumentum 目前的市销率是其最近 12 个月营收的 13 倍。 瑞穗银行评估认为，考虑到 Lumentum 的全球市场主导地位、增长潜力、光通信技术转型和业务渠道，该公司可能会获得较高的收购溢价。", "publish_time": "2026-10-29 12:47", "tags": []}, "post:2026-10-29T18-35:b9c4ff5196b2": {"id": "post:2026-10-29T18-35:b9c4ff5196b2", "kind": "post", "title": "2026-10-29 18:35", "source_label": "帖子正文", "excerpt": "【中泰电子&机械丨联讯仪器】Q3盈利同环比大增，光通信&半导体双轮驱动！Q3净利率达57%，现金流持续大幅改善！", "content": "【中泰电子&机械丨联讯仪器】Q3盈利同环比大增，光通信&半导体双轮驱动！Q3净利率达57%，现金流持续大幅改善！ 【营收】25.12 亿，yoy+711.40%，qoq+140.78%； 【归母】14.39 亿，yoy+3488.07%，qoq+220.99%； 【扣非】13.72 亿： 【毛利率】77.63%，yoy+22.76pcts，qoq+4.95pcts； 【净利率】57.27%，yoy+43.98pcts，qoq+14.32pcts。 【现金流】前三季度累计15.21亿，同比大幅扭亏。 【合同负债】前三季度累计9.24亿，yoy+526.29%。 核心增长驱动力来自光芯片设备和光模块仪器。#光通信领域1️⃣光芯片：核心是KGD设备，联讯市占率超50%，当前EML和CW光芯片实际良率较低，设备需求量大，公司订单持续高增。 2️⃣光模块：公司1.6T示波器全球领先，正迎来爆发增长；2.4t已给客户送测，3.2t随后推出。 3️⃣CPO：实现CPO四大测试环节全覆盖，其中OE测试，公司测试效率较行业平均水平提升2倍，优势明显，正对接全球头部客户。#半导体领域1️⃣FT测试机：公司18G高速FT测试机在存储大厂验证顺利，核心芯片一次流片成功，预计26-27年逐步放量。此外，新增CP测试，有望在27年送存储大厂验证，进展可期。存储业务线持续拓宽。 2️⃣soc测试机：国产替代从0到1，联讯自研ASIC芯片，稀缺性突出，且专门针对GPU测试研发设备，样机已送样头部大厂。未来几年GPU测试市场需求有望突破200亿元，高速增长，联讯有望充分受益。 [闪电]风险提示：新品研发和客户拓展不及预期。 ☎联系人【中泰电子&机械】：王芳/杨旭/谢校辉#文字观点", "publish_time": "2026-10-29 18:35", "tags": ["光通信领域", "半导体领域", "文字观点"]}, "post:2026-10-29T22-36:073f593ed776": {"id": "post:2026-10-29T22-36:073f593ed776", "kind": "post", "title": "2026-10-29 22:36", "source_label": "帖子正文", "excerpt": "胜宏科技三季度营收68.31e，同比增长34%，净利润5.27e，扣非净利润12.76e，同比增长16.2%，这个业绩无论如何都是miss的，跟之前的任何一次交流都对不上。", "content": "胜宏科技三季度营收68.31e，同比增长34%，净利润5.27e，扣非净利润12.76e，同比增长16.2%，这个业绩无论如何都是miss的，跟之前的任何一次交流都对不上。 单看营收跟毛利都是没问题的，最主要的还是出在费用端了。 除了公允价值变动损益外，还有2.07e的营业外支出，一些汇兑损失，一些额外的管费用，其它就没什么了，但是即便全部加回去也不够。 一些比较好的 存货92.5e，环比增加33.6e，主要是备货增加，这里也能印证； 固定资产128.13e，环比增加10e，主要是产能扩张，在建工程转固； 合同负债8842.5万，历史新高，也算是订单旺盛的印证； 之前Q2的时候就说Q3开始上量，然后交流的时候话也说得比较满，现在这个出来以后全年预期肯定得下调，如果还按照原来的话，Q4利润得要Q1+Q2+Q3才能满足之前的预期。#文字观点", "publish_time": "2026-10-29 22:36", "tags": ["文字观点"]}, "post:2026-10-29T23-32:377b35204880": {"id": "post:2026-10-29T23-32:377b35204880", "kind": "post", "title": "2026-10-29 23:32", "source_label": "帖子正文", "excerpt": "科技股今晚业绩汇总 1、中际旭创：Q3净利润同比增长173%，环比增长8%。", "content": "科技股今晚业绩汇总 1、中际旭创：Q3净利润同比增长173%，环比增长8%。光模块一哥业绩还行，维持住了体面。 2、新易盛：Q3净利润38.43亿同比增长61.15% 环比下降19%。光模块二哥，三哥都不大行。 3、胜宏科技：Q3净利润5.27亿元 同比下降52% 环比下降66%。这个有点拉胯了。 4、工业富联：Q3净利润166.34亿元 同比增长60% 环比增长26%。妇联业绩挺炸裂的，但市场可能默认它还是代工厂。 5、北方华创：Q3净利润20.22亿元 同比增长5.1% 环比增长16%。这个业绩不算惊艳，但挺稳的。 6、大普微：Q3净利润12.09亿元 同比增长15倍 环比增长25.41%。这个还不错了。 7、兆易创新：Q3净利润42.09亿元 同比增长728.93% 环比下降21%。 8、江波龙：Q3净利润37.45亿元 同比增长437% 环比下降44%。两大存储巨头环比下降，应该挺难原谅的。 9、立讯精密：第三季度净利52.14亿元 同比增长7% 环比增长24%。果链龙头还算不错的。#文字观点", "publish_time": "2026-10-29 23:32", "tags": ["文字观点"]}, "post:2026-10-29T08-13:86ff2ff636b8": {"id": "post:2026-10-29T08-13:86ff2ff636b8", "kind": "post", "title": "2026-10-29 08:13", "source_label": "帖子正文", "excerpt": "结论：AI算力硬件瓶颈正从晶圆与先进封装，向“基板—PCB—CCL—电子布—铜箔—关键设备”全链条下沉。", "content": "野村——亚洲AI PCB（印刷电路板）/封装基板与CCL（覆铜板）：2026年TPCA展会观察——供给进一步收紧，技术创新同步推进 一、核心判断 • 台北IMPACT-IAAC与TPCA展会调研结论：AI算力硬件瓶颈正从晶圆与先进封装，向“基板—PCB—CCL—电子布—铜箔—关键设备”全链条下沉。供给约束不是短期脉冲，而是2026下半年至2028年的结构性紧缺。 • 整体ABF（味之素堆积膜）载板名义产能过剩，但高端ABF载板（大尺寸、高层数、细线宽线距、嵌入无源/有源器件）缺口持续扩大；材料与设备交期拉长，是核心定价权来源。 二、封装基板与材料瓶颈 • 低CTE（热膨胀系数）T-glass（低介电玻璃布）持续紧缺：日东纺（Nittobo）计划FY28E将“厚T-glass”产能较FY26翻倍以上，但受织机瓶颈限制，预计其长期份额仍下降。织机核心供给来自丰田自动织机，交期由去年约3年延长至5年（至2031—2032年）；津田驹设备尚未完全满足行业标准。 • 电子级E-glass（常规电子布）涨价周期延续至2027上半年以后；E-glass与Low-Dk1玻璃布价差收窄，可能触发产能切换，反而推升Low-Dk1价格。 • 关键设备交期全面拉长：CO2激光钻孔机由12—14个月升至3年；曝光设备由1年升至3—5年；ABF真空层压机由不足6个月升至2.5年。 • 基板技术路线：尺寸由90—100mm迈向120—150mm乃至230mm；层数由10+2+10向18+n+18演进；线宽/线距由8/8μm向5/5μm、3/3μm迭代；嵌入IPD（集成无源器件）、DTC（深沟槽电容）、MLCC与多层核（MLC）成为系统级集成方向。 • 玻璃芯（Glass Core）TGV（玻璃通孔）回归产业视野，但SeWaRe（分层微裂）与可靠性仍是商用前主要障碍；氮化铝陶瓷芯具备高导热优势，但Dk（介电常数）偏高。玻璃芯商业化仍需时间。 三、PCB/HDI与CCL演进 • AI平台材料升级路径：2026—2027年主流由M8K1/K2（搭配M4/M6）向M9K1/K2迁移；Rubin Ultra计算板倾向HDI+5结构；交换板与计算板高层HDI化加速。 • 光模块驱动mSAP（改良半加成法）HDI升级：800G用10—12层、1.6T用12—16层、NPO（近封装光学）需16—18层；嵌入硅电容（Si-cap）提升高频性能，臻鼎（ZDT）具备主动IC嵌入经验，先发优势明确。 • 铜箔供给拐点：HVLP3/4（超低轮廓铜箔）受AI平台拉动紧缺；龙头退出HTE/RTF低端产能，导致消费级与通用服务器用铜箔同步收紧。德福、铜冠等国内供应商进入替代序列。 • 树脂路线分歧：碳氢树脂（HCR）阵营——台光电（EMC）、斗山、南亚；PTFE（聚四氟乙烯）阵营——生益科技（SYTECH）、联茂（TUC）在M9/M10以上布局。PTFE电气性能优，但高温层压、钻孔、除胶渣、界面结合良率难度大；混合方案（PTFE+HCR）为过渡解，2027年中前难定终局。 四、价格与盈利传导 • 中低端CCL受E-glass涨价推动月度提价；高端CCL因供需更紧，预计2026年四季度起有10%—20%提价空间，毛利结构进一步优化。 • 若AI CPU/定制化平台需求超预期，短缺将甚于基准假设，涨价与盈利预测上修为板块核心催化。 五、投资结论与评级 • 封装基板：重申欣兴（Unimicron，买入），受益高端ABF紧缺、EMIB-T、大尺寸与嵌入技术领先。 • PCB/HDI：重申买入臻鼎（ZDT）、华通（Compeq）、深南电路（SCC）、胜宏科技（VGT）、沪电股份（WUS）；HDI迁移利好具备高层HDI能力的头部板厂。 • CCL：重申买入台光电（EMC）、生益科技（SYTECH）；EMC凭产能规模与HDI材料卡位占优，生益科技PTFE与AI CCL渗透提升。 • 风险：设备交期延长、玻璃布/铜箔扩产不及预期、PTFE工艺良率低于预期、客户认证节奏放缓、AI资本开支波动。 六、产业映射结论 本轮不是“周期见顶”，而是“瓶颈后移+材料重定价”。真正稀缺的是可通过大客户认证的有效产能，而非名义扩产面积。供给慢变量（织机、T-glass、HVLP4、层压机、HDI良率）将主导2027—2028年利润分配。#文字观点", "publish_time": "2026-10-29 08:13", "tags": ["文字观点"]}, "post:2026-10-29T07-28:6f84ea5252d3": {"id": "post:2026-10-29T07-28:6f84ea5252d3", "kind": "post", "title": "2026-10-29 07:28", "source_label": "帖子正文", "excerpt": "1️⃣SK海力士三季报大超预期，单季销售额达104.6万亿韩元、营业利润达83.3万亿韩元创历史峰值，并正式宣布历时两年的100万亿韩元股东回报计划，盘中狂飙近11%。", "content": "1️⃣SK海力士三季报大超预期，单季销售额达104.6万亿韩元、营业利润达83.3万亿韩元创历史峰值，并正式宣布历时两年的100万亿韩元股东回报计划，盘中狂飙近11%。#相关个股：长鑫科技、太极实业2️⃣UCTT公布三季报，受益于AI/HBM/先进封装带动刻蚀、沉积设备需求持续超预期，Q3收入+49%、EPS、利润率大超预期，Q4继续上调，市场开始重新定价2027年WFE超过2000亿美元背景下的业绩弹性，大涨近10%。#相关个股：华亚智能、飞利信、富创精密3️⃣全球数据中心温控龙头维谛技术（Vertiv）公布三季报，Q3整体内生订单同比增速超100%，美洲区内生增速达66.2%，营收与指引双双超预期，大涨近12%。 #相关个股：英维克、高澜股份、大元泵业#文字观点", "publish_time": "2026-10-29 07:28", "tags": ["相关个股", "长鑫科技、太极实业", "华亚智能、飞利信、富创精密", "文字观点"]}, "post:2026-10-29T12-58:d55e9dce50fa": {"id": "post:2026-10-29T12-58:d55e9dce50fa", "kind": "post", "title": "2026-10-29 12:58", "source_label": "帖子正文", "excerpt": "📑📌市场正在抛售中国光模块龙头，因 Marvell 计划收购 Lumentum ⏰光模块龙头厂商新易盛跌 9.2%，中际旭创跌 6.9%。", "content": "📑📌市场正在抛售中国光模块龙头，因 Marvell 计划收购 Lumentum ⏰光模块龙头厂商新易盛跌 9.2%，中际旭创跌 6.9%。激光器厂源杰科技跌 9.88%，天孚通信跌 18.96%。创业板指跌 3.6%。 💡恐慌的逻辑不难理解。Marvell和Lumentum合并后，会同时成为 800G、1.6T 光模块里 DSP 和激光器这两样核心零件的主要供应商之一，而 Lumentum CEO 说他们的激光器产能基本上已经订满到 2029 年。激光器紧到这个程度，谁拥有工厂，谁就决定先给谁供货。 ⚠️可这份恐慌有个前提：交易得按 Marvell 的条件完成。但两家都轻松超过中国的经营者集中申报门槛，Marvell 还有 36% 的营收出货到中国，没有市场监管总局点头，这笔交易在中国就不能合法交割。2020 年北京批准英伟达收购 Mellanox 时，就把条件写进了批文：继续向中国客户供货，不得强制捆绑销售。市场今天担心的供货问题，恰恰是最后大概率会被写进这类条件里的东西。#文字观点", "publish_time": "2026-10-29 12:58", "tags": ["文字观点"]}, "post:2026-10-29T20-36:1060dbd74b2a": {"id": "post:2026-10-29T20-36:1060dbd74b2a", "kind": "post", "title": "2026-10-29 20:36", "source_label": "帖子正文", "excerpt": "转发 各位领导和朋友们： 今晚，新易盛的业绩，即使有心理准备，仍然令人难以平静。", "content": "转发 各位领导和朋友们： 今晚，新易盛的业绩，即使有心理准备，仍然令人难以平静。 想必很多人的第一反应是焦虑，是想要抢在集合竞价前按下核按钮的冲动。 但不妨把记忆的时钟往回拨一拨，看一看那些似曾相识的夜晚。🔁 第一次回响：2024年二季度，中际旭创的利润波动。 当时旭创季报利润阶段性走弱，此后数日，板块情绪崩塌，仿佛AI光模块行情终结。但全球算力扩容、高速光模块迭代的产业进程，并未中断。那个因恐慌砸出的低点，恰恰是2024年下半年AI算力行情的最佳买入点。📈 第二次回响：2025年一季度，天孚通信的“短期业绩阵痛”。 交卷Q1时，盈利阶段性承压，光通信配件龙头似乎在行业降价潮中“失速”了，市场同样一片哗然。但随后几个季度，行业持续兑现AI算力资本开支，公司用持续放量的海外订单回应了所有质疑。那根季报后的阴线，如今再看，不过是K线图中一段不起眼的毛刺。 历史不会重复，但会押韵。🎵 现在，轮到了新易盛。 本次业绩不及预期，存在“海外客户订单节奏错位，行业价格竞争加剧，高端产品研发投入，汇率波动侵蚀利润”等多种因素。 但我们要清醒地认识到：新易盛作为海外算力大厂核心供应商的地位不变，高速光模块迭代、全球化客户突破的五年战略趋势不变。中际旭创和天孚通信的例子已经证明，短期的波动不应成为我们扔掉核心筹码的理由。💪 各位如果感到焦虑，不妨关上账户，去睡个好觉。🌙 明天，周末的太阳照常升起—— 上海的朋友可以去松江看看醉白池的古典园林 🌳， 北京的朋友可以去雍和宫探访名胜古迹 🏯， 深圳的朋友不妨去深圳湾看看日落 🌅。 今晚过后，新易盛还是昨日那个新易盛， 全球千亿级的高速光模块算力市场，还是昨日那个市场。 AI算力高速传输的方舟，颠簸了一下，越过一阵波浪， 其实，也并没有变。🚢#文字观点", "publish_time": "2026-10-29 20:36", "tags": ["文字观点"]}, "post:2026-10-29T08-46:d7ed2fccb5cb": {"id": "post:2026-10-29T08-46:d7ed2fccb5cb", "kind": "post", "title": "2026-10-29 08:46", "source_label": "帖子正文", "excerpt": "鼎通科技三季报不及预期原因：三季度收入环比二季度下降10%，或由于风冷Cage产品客户需求前置、液冷产品大规模放量略有延迟所致。", "content": "鼎通科技三季报不及预期原因：三季度收入环比二季度下降10%，或由于风冷Cage产品客户需求前置、液冷产品大规模放量略有延迟所致。鼎通1.6T液冷Cage提前规划了5条专用产线，目标2026年底全部建成。利润及毛利率下降主要由于：①外汇损失约1500万；②短期借款及可转债利息费用约1200万；③新增产品产线设备及人员投入较大，液冷Cage大单与加单尚未落地，产能尚未饱和。1.6T/3.2T光模块驱动液冷Cage需求放量增长，维持2027年1.6T光模块液冷元年判断，公司作为全球液冷Cage龙头有望直接受益。 奕东电子三季报符合预期点评：业绩符合市场预期，利润偏低，为减值0.11亿、机器人产能兑现问题，以及冠鼎利润还未完全统计内。年底前有望出验证结果，供货在即，有3条液冷产线储备。全年预计8亿收入，27年收入有望从10亿并且存在上修机会。液冷Cage行业核心点在于北美龙头液冷Cage大单何时落地，目前机构跟踪下来下游专家和两家公司来看，明年份额基本会由鼎通和奕东瓜分，且基本是巨量订单。落地时间有望在年内，落地之后随着产能陆续打满与业绩逐步兑现，两家公司股价会迎来可观修复，在此超跌位置展望明年盈利与估值无需悲观。 早上与专家交流液冷Cage放量节奏与渗透率： 1）液冷Cage放量节奏：1.6T液冷Cage当前渗透率很低，整体仍以电连接（风冷）为主；GB200、GB300及NVL72的后端网络均采用电连接，预计NVL144（专为容纳 Rubin Ultra GPU 而设计的机架系统）才会引入光连接，形成两级架构（第一级电、第二级光），初期光连接占比仍低于电连接。 2）单机柜网络配置：NVL72机柜内共有10台交换机，其中9台为scale-up场景的switch tray，采用铜缆电连接，无需液冷；仅1台TOR/leaf交换机对应前端/跨柜网络，若采用光模块则需液冷Cage，第二层以上跨柜网络因传输距离长基本采用光连接，对应交换机也需要液冷，但设备数量更少。 3）今年进展暂时低于预期原因：液冷Cage需随系统主板同步出货，无法像光模块一样独立囤货，所以订单节奏与下游系统应用同步，主要Rubin系列量产存在延迟，这是今年液冷Cage出货量偏低的核心原因，明年有望改善；当前液冷Cage仍处于增长过程中，尚未到渗透天花板。鼎通良率最好状态约85%，在此良率水平下，液冷Cage毛利率可达40%-50%。---xz#文字观点", "publish_time": "2026-10-29 08:46", "tags": ["文字观点"]}, "post:2026-10-29T11-05:067e00c0ed70": {"id": "post:2026-10-29T11-05:067e00c0ed70", "kind": "post", "title": "2026-10-29 11:05", "source_label": "帖子正文", "excerpt": "液冷 Cage 板块交流纪要（鼎通科技、奕东电子 + 专家交流） 鼎通科技三季报不及预期原因：三季度收入环比二季度下降 10%，或由于风冷 Cage 产品客户需求前置、液冷产品大规", "content": "液冷 Cage 板块交流纪要（鼎通科技、奕东电子 + 专家交流） 鼎通科技三季报不及预期原因：三季度收入环比二季度下降 10%，或由于风冷 Cage 产品客户需求前置、液冷产品大规模放量略有延迟所致。鼎通 1.6T 液冷 Cage 提前规划了 5 条专用产线，目标 2026 年底全部建成。利润及毛利率下降主要由于：①外汇损失约 1500 万；②短期借款及可转债利息费用约 1200 万；③新增产品产线设备及人员投入较大，液冷 Cage 大单与加单尚未落地，产能尚未饱和。1.6T/3.2T 光模块驱动液冷 Cage 需求放量增长，维持 202 e": "2026-10-29 09:18", "source_label": "帖子正文", "excerpt": "# 国轩高科：Q3业绩符合预期，产品结构持续优化 # Q3业绩基本符合预期。", "content": "# 国轩高科：Q3业绩符合预期，产品结构持续优化 # Q3业绩基本符合预期。公司26年Q1-3营收454亿元，同增54%，归母净利润8.5亿元，同降67%，扣非净利润2.1亿元，同增196%，毛利率15.5%，同-1.3pct，归母净利率1.9%，同-6.7pct；其中26年Q3营收177亿元，同环比+75%/+10%，归母净利润-5.4亿元，同环比转负，扣非净利润1.5亿元，同环比+1063%/+120%，毛利率15.3%，同比-2.3pct，环比持平，归母净利率-3%，同环比-24.5/-11.5pct。 # Q3出货40GWh+、环增10%、全年出货145GWh。公司Q1-3出货105GWh，同增65%，含动力82.5GWh，储能23GWh，其中Q3出货40.6GWh，环增10%，含动力34.5GWh，环增9%，储能8.1GWh，环增11%。公司已切入大众、奇瑞、零跑等主流车企供应链，大众UC标准电芯开启放量，绑定奇瑞成为多款主力车型主供，在零跑中高配版本占比提升。全年看，我们预计26年出货145GWh，同增45%，其中动力110GWh，同增50%，储能35GWh，同增25%，27年预计增速维持40%增长。 # 单wh利润维持微利、产品结构持续优化。公司Q3含税价格0.48/wh，环降7.5%，毛利率15.3%，环比持平，动力毛利率14-15%，储能毛利率20%，单位扣非利润0.004元/wh，环增0.002元/wh。Q3含减值损失3.4亿元，环降7%，汇兑损失2.0亿元，环降60%，乘用车产品受消费税影响，但整体产品结构略有优化，扣非利润相对保持稳定。后续看，公司产品结构持续优化，海外出货占比已升至30%+，中高端的车型渗透率提升，盈利能力预计维持稳定。 # Q3公允价值变动损失较大、系奇瑞汽车+铜冠铜箔股价下跌。公司26年Q1-3期间费用59亿元，同增36%，费用率13.0%，同-1.8pct，其中Q3期间费用21亿元，同环比+30%/-4%，费用率11.8%，同环比-4.0/-1.7pct；Q3公允价值变动损益-7.86亿元，环降20.8亿元；26年Q1-3经营性净现金流5.6亿元，同增23%，其中Q2经营性现金流1.3亿元，同环比+0.5%/-14%；26年Q1-3资本开支122亿元，同增110%，其中Q3资本开支25亿元，同环比+31%/-49%；Q3末存货173.9亿元，较年初79.5%。 # 投资建议：我们预计公司26-28年归母净利润9.5/11.9/14.4亿元，同比-60%/+26%/+20%，对应PE分别为49/39/32倍，维持“买入”评级。 风险提示：下游需求不及预期。#文字观点", "publish_time": "2026-10-29 09:18", "tags": ["文字观点"]}, "post:2026-10-29T08-16:c7a4db285030": {"id": "post:2026-10-29T08-16:c7a4db285030", "kind": "post", "title": "2026-10-29 08:16", "source_label": "帖子正文", "excerpt": "看好PCB上游【东北计算机】 🌟据最新行业研究及测算，受AI服务器需求爆发推动，高阶CCL及PCB上游核心原材料出现严重供需失衡，其中铜箔缺口达33%、玻纤布缺口高达60%。", "content": "原料缺口持续放大，坚定看好PCB上游【东北计算机】 🌟据最新行业研究及测算，受AI服务器需求爆发推动，高阶CCL及PCB上游核心原材料出现严重供需失衡，其中铜箔缺口达33%、玻纤布缺口高达60%。 1️⃣AI算力底座刚性需求，供需失衡超预期： AI服务器对高层数、高频高速PCB及高阶CCL需求倍增，而上游高阶铜箔与电子级玻纤扩产周期长、技术门槛高，导致产能缺口在短期内难以填补，供需失衡持续超预期。 2️⃣议价能力与业绩弹性大幅提高： 产业链龙头企业具备极强的成本传导能力，在“成本推动+需求拉动”双重作用下，板块毛利率与盈利弹性将大幅向上。 🔥相关公司（未覆盖公司不作为推荐标的） 电子布：宏和科技、中材科技、国际复材（未覆盖） 铜箔：德福科技、铜冠铜箔 树脂：东材科技、呈和科技、圣泉集团、瑞丰高材（未覆盖） 硅微粉：凌玮科技、联瑞新材（未覆盖） mSAP：景旺电子（未覆盖）、深南电路、兴森科技（未覆盖）、红板科技（未覆盖） 🔥风险提示：下游PCB需求不及预期等。 ☎ >\n\u003cli>\u003cstrong>光通信整合预期与股价冲击并存\u003c/strong>：Marvell或斥资超800亿美元收购Lumentum，正进行深入收购谈判，最快下周可能宣布交易；市场同时抛售中国光模块龙头，新易盛跌9.2%、中际旭创跌6.9%。\u003c/li>\n\u003cli>\u003cstrong>市场流动性与业绩风险需并重\u003c/strong>：FOMC按兵不动、整体中性；险资卖出受产品风控线影响，近期下跌被归因于流动性踩踏而非基本面变差，优质标的存错杀机会；但胜宏科技Q3净利润同比下降52%、环比下降66%，业绩miss，鼎通科技Q3收入环比下降10%，显示部分个股业绩兑现压力。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型\u003c/strong>：强化逻辑是头部模型能力交替领先，长程Agent应用拓展推动Token需求增长；今日催化/验证为Gemini 4 Carbon综合智能59分超过Claude Opus 5.5，微软FY27Q1营收923亿美元、同比+19%，Azure增长加速至48%。\u003c/li>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>：强化逻辑是AI/HBM/先进封装带动刻蚀、沉积设备及封装环节需求；今日催化/验证为SK海力士Q3营业利润创历史峰值并宣布100万亿韩元股东回报、CXMT计划两个月内启动HBM3E小规模试产、台积电酝酿CoWoS涨价最高约20%、拉姆研究将2026年全球晶圆制造设备市场规模预测上调至约1550亿美元。\u003c/li>\n\u003cli>\u003cstrong>液冷/电源\u003c/strong>：强化逻辑是AI数据中心电力及热管理需求持续高增，订单增速显著高于收入增速；今日催化/验证为维谛技术Q3营收43.13亿美元、同比+61%，调整后EPS 2.21美元、同比+78%，并上调全年指引，Rubin液冷方案落地。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>：强化逻辑是800G向1.6T、3.2T升级，激光器性能、功率与产能重要性持续提升，收购若成功将实现从DSP、电芯片、硅光到激光器的垂直整合；今日催化/验证为Marvell拟超800亿美元收购Lumentum的深入谈判，以及新易盛跌9.2%、中际旭创跌6.9%。\u003c/li>\n\u003cli>\u003cstrong>机器人/自动化\u003c/strong>：强化逻辑是Optimus应用场景扩展与加单预期、缝制机器人新品发布共同形成催化；今日催化/验证为特斯拉计划使用Optimus为Robotaxi完成充电枪插拔作业，特斯拉确认加单到周产1500台、年底2500台，杰克科技发布艾妮缝制机器人中国区首发价30.8万元及整线方案“产线王”，并与波司登、太平鸟、晨风签署战略合作。\u003c/li>\n\u003cli>\u003cstrong>商业航天/卫星\u003c/strong>：强化逻辑是海外星舰回收、星链用户与频谱资源推进，国内火箭发射与回收试验密集；今日催化/验证为国星宇航通过港交所上市聆讯，马斯克预计11月完成星舰全回收验证，力箭二号遥二待发射，朱雀三号等火箭分批开展回收试验。\u003c/li>\n\u003c/ul>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>Gemini 4 Carbon发布，在Artificial Analysis Intelligence Index v5.0中获得59分，超过Claude Opus 5.5；微软FY27Q1营收923亿美元、同比+19%，Azure增长加速至48%；谷歌3Q26收入1276亿美元、同比+25%，略低于预期1282亿美元，调整后EPS 2.67美元低于预期3.02美元，盘后大跌10%。\u003c/li>\n\u003cli>SK海力士Q3销售额104.6万亿韩元、营业利润83.3万亿韩元创历史峰值，并宣布100万亿韩元股东回报计划；CXMT计划未来两个月内启动HBM3E小规模试产；台积电酝酿CoWoS涨价最高约20%；拉姆研究将2026年全球晶圆制造设备市场规模预测上调至约1550亿美元。\u003c/li>\n\u003cli>维谛技术Q3营收43.13亿美元、同比+61%，调整后EPS 2.21美元、同比+78%，订单增速显著高于收入增速，并上调全年指引
