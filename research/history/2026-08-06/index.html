559529d41630": {"id": "post:2026-08-06T13-23:559529d41630", "kind": "post", "title": "2026-08-06 13:23", "source_label": "帖子正文", "excerpt": "🍁🍁🍁hcdx 科翔股份：陶瓷混压pcb黑科技解决散热问题，主业HDI景气盈利修复 🍁陶瓷pcb混压板独家突破，切入高功率算力散热： 大功率算力芯片功耗超1800W后，传统PCB ", "content": "", "publish_time": "2026-08-06 13:23", "tags": ["文字观点"]}, "post:2026-08-06T19-38:afa2306053e7": {"id": "post:2026-08-06T19-38:afa2306053e7", "kind": "post", "title": "2026-08-06 19:38", "source_label": "帖子正文", "excerpt": "浙商机械&电子 |【科翔股份】深度：陶瓷混压PCB先行者，卡位北美客户格局优 时间: 今天 20:30 主讲人: 王华君 浙商所长助理、机械首席 田发祥 浙商电子分析师 蒋逸 浙商", "content": "", "publish_time": "2026-08-06 19:38", "tags": ["文字观点"]}, "post:2026-08-06T13-26:63844c9cf426": {"id": "post:2026-08-06T13-26:63844c9cf426", "kind": "post", "title": "2026-08-06 13:26", "source_label": "帖子正文", "excerpt": "看好NV-Rubin升级链-0806 ——————————— 没有哪一个AI Lab不把目标定为实现AGI，那模型训练必然是最重要的任务。", "content": "", "publish_time": "2026-08-06 13:26", "tags": ["文字观点"]}, "post:2026-08-06T07-46:43e533efbb35": {"id": "post:2026-08-06T07-46:43e533efbb35", "kind": "post", "title": "2026-08-06 07:46", "source_label": "帖子正文", "excerpt": "看好低估PCB板块此前海外算力受Capex增速、ARR放缓等担忧迎来较大调整，最新CSP财报显示其合计云业务积压订单至Q2末达到1.7万亿美元，已成为后续AI最重要增长方向，PCB", "content": "", "publish_time": "2026-08-06 07:46", "tags": ["文字观点"]}}, "source_details": {"post:2026-08-06T11-35:e03578d8c56a": {"id": "post:2026-08-06T11-35:e03578d8c56a", "kind": "post", "title": "2026-08-06 11:35", "source_label": "帖子正文", "excerpt": "🚀【华创计算机｜AI 】DeepSeek 拟上调API价格，模型从价格走向价值竞争 @智谱/Minimax 20260806 🔹 #涨价信号明确：DeepSeek近日提示，计划近期整体上调API服务定价，预计涨幅较大，具体方案以正式通知为准。当前DeepSeek-V4-Flash价格为缓存命中0.0", "content": "🚀【华创计算机｜AI 】DeepSeek 拟上调API价格，模型从价格走向价值竞争 @智谱/Minimax 20260806 🔹 #涨价信号明确：DeepSeek近日提示，计划近期整体上调API服务定价，预计涨幅较大，具体方案以正式通知为准。当前DeepSeek-V4-Flash价格为缓存命中0.02元、输入1元、输出2元/百万tokens；DeepSeek-V4-Pro为缓存命中0.025元、输入3元、输出6元/百万tokens，整体仍处于极低价格区间。若后续整体涨价落地，国产大模型API价格中枢有望迎来上移。 🔹 #低价策略难以长期持续：大模型API背后对应高额推理算力成本，尤其Coding、Agent、长上下文和多模态任务，涉及多轮规划、工具调用、代码执行和反复验证，单位任务Token消耗远高于普通问答。随着调用量增长，模型厂商需要重新平衡用户规模、算力成本、服务质量与商业回报，单纯依靠低价换取份额的竞争模式难以长期延续。 🔹 #从“便宜可用”转向“效果付费”：DeepSeek涨价的核心影响，是推动行业定价逻辑从比较Token单价，转向比较任务完成率、模型稳定性、推理速度、...", "publish_time": "2026-08-06 11:35", "tags": ["文字观点"]}, "post:2026-08-06T12-32:5892bf1cf869": {"id": "post:2026-08-06T12-32:5892bf1cf869", "kind": "post", "title": "2026-08-06 12:32", "source_label": "帖子正文", "excerpt": "底部反弹买什么，重点提示国产链-昇腾链锐度！#底部反弹趋势确立，内外围本质共振。", "content": "自8月1日起，匈牙利将对电池行业实施全国性检查。", "publish_time": "2026-08-06 12:32", "tags": []}, "post:2026-08-06T13-56:5ed88a0c9ccf": {"id": "post:2026-08-06T13-56:5ed88a0c9ccf", "kind": "post", "title": "2026-08-06 13:56", "source_label": "帖子正文", "excerpt": "DeepSeek官方称将“近期整体上调API服务定价，预计涨幅较大 DeepSeek官方称将“近期整体上调API服务定价，预计涨幅较大”。当前V4-Flash的缓存命中/未命中输入/输出价分别为0.02/1/2元/百万Token，V4-Pro为0.025/3/6元。", "content": "DeepSeek官方称将“近期整体上调API服务定价，预计涨幅较大 DeepSeek官方称将“近期整体上调API服务定价，预计涨幅较大”。当前V4-Flash的缓存命中/未命中输入/输出价分别为0.02/1/2元/百万Token，V4-Pro为0.025/3/6元。 国产大模型竞争正式从价格战进入商业化和算力兑现阶段。7月31日V4-Flash刚强化Agent和代码能力，随后预告涨价，说明模型厂商开始按照任务价值、算力稀缺度定价，而不只是按照边际成本定价。 涨价亦是AI需求的强支撑-开源是大模型的策略而非冲击。此前V4已经引入峰时双倍计费，这次强调“整体上调”，说明Token需求可能已经足以支撑提价，推理收入与毛利率预期有望继续提升。继续推荐算租【宏景、协创、智微】+云厂【阿里巴巴、金山云】；以及直接受益的【大模型】公司智谱。 招商计算机刘玉萍#文字观点", "publish_time": "2026-08-06 13:56", "tags": ["文字观点"]}, "attachment:files/微软专家交流.docx": {"id": "attachment:files/微软专家交流.docx", "kind": "attachment", "title": "微软专家交流", "source_label": "其他", "excerpt": "微软的专家，讲云（真实专家，信息量大） Q3智能云展望？以及主要driver？", "content": "微软的专家，讲云（真实专家，信息量大） Q3智能云展望？以及主要driver？ 预计同比增速能进一步小幅提升，争取实现更大的提升。MaaS收入里绝大部分是OAI的GPT为底层的API收入，占到70%左右；Claude模型为底层的API token收入在去年占到不到10%，剩下的则是自有模型和其他模型的收入。 OPM这个季度小幅提升的主要原因有几个：首先，在四季度，由于之前签订了一些capex和LTA，把采购价格锁定，利润得以保持。其次，从2024年下半年开始，进行了DC战略调整，进行战略性校准。原来大部分资源都放在AIDC，传统云DC扩容不够，导致传统云SaaS部分的收入受到一定抑制。这样在今年（2026年）F26的H2，也就是日历年的Q1和Q2，开始释放一些订单，收入端有所增加。而成本端因为之前签了LTA，能够守住价格，成本没有进一步恶化。 此外，本季度还在推进租赁方式的调整，把融资租赁转为经营性租赁，满足相关会计准则后，不再计入capex。这些因素共同作用下，F26的Q4表现还可以。如果未来一个季度收入端表现不错，成本端波动不大，与供应商签订的LTA和Rubin订单的价格还能维持。因此，Q3的OPM会向好。Q4则需要进一步观察。从全年角度看，智能云的OPM整体较为稳定，不会有特别大的波动。 如果今年（2026年）F27的AI云增速能实现进一步曾航，且Copilot达到目标，今年（2026年）的capex有可能会显著上升。 当然还有其他因素，比如自研模型、agent层面，以及最近auto pilot进展，这些都是复合作用力。从F27来看，业绩增长的承压相对还是可控的。但到F28财年，能否持续，目前还不好下定论。 算力供给能够进一步补充，数据中心（DC）能进一步释放，传统云DC能持续推进。去年（2025年）一年上线了80多个DC，今年（2026年）肯定会更多。传统云DC的数量提升，不仅仅是新建，也有部分是扩容。如果传统云DC的capacity提升，传统云业务就敢签单，包括IaaS、PaaS和标准的SaaS。在这几个层面，IaaS毛利率在50%~60%，PaaS在60%~70%，SaaS在70%~80%，个别SaaS甚至能到80%的毛利，这些都会大大缓解压力。在RPO层面，目前最大的部分还是来自OAI，具体数字记不太清。剔除OAI 后，B端环比还是增长的，但大头还是在OAI。这是一个比较大的不确定因素。 现在B端RPO主要来源于AI的牵引，把IaaS、PaaS、SaaS打包向云端销售。云基础架构要进行存量迁移，AI是抓手。第二个层面是AI自身能力的提升。AI自身能力提升的同时，也能带动其他产品。第三，今年（2026年）I色可能进一步上涨，支撑的就是核心产品序列，现在基本上已经比较全了，还在持续延续。客户层面，会基于之前提到的go back to essential plus one行业战略，侧重EC和PS。今年（2026年）SMC中的corporate，也就是腰部客户，这部分要进一步深耕，是走量的部分。 最后，AI token的用量增长也需要重点关注，要追踪客户，不仅要买，还要用，还要收，这是一个关键点。今年（2026年）issue能稳步增长的另一个因素是全球区域性扩张，原来主要在北美和西欧，今年（2026年）会拓展到亚太，比如日本、南亚的印度、澳洲，以及欧洲的德国、南欧、北欧，还有北非和中东地区。这些都是今年（2026年）Azure的核心增长点。 Q2 Copilot付费用户数显著增加的driver？ 这些payment user的数字不用太在意。因为买一个seat也算pay，有些客户买了seat其实是为了0~1破冰，半买半送一部分trial席位。关键还是要看实际revenue。A公司的企业级客户基本上签3年，大客户付费占比最高，约60%或更多，中小客户约30%。F26增长主力还是大客户，集中在S500大客户和战略EC客户，财报披露如HSBC、E&Y等客户都是几万seat。中小客户中的SMB相对较弱。SMC中的corporates，今年（2026年）他们也预见到一些新的变化。因为在2026年5月1日，公司推出了一期99美金的版本。这个99美金的一期版本中，M365 Copilot是一个COMPONENT，是打包销售的。当然不仅仅包含M365 Copilot，还包括cowork、call以及其他组件都整合在一起。如果单独购买这些组件，总价可能在110美金以上，但打包购买一期则是99美金。 这个99美金的版本主要面向EC客户，或者GA加EC的客户，甚至是PS中的规模较大的政府或医疗客户。剩下的部分，就是针对腰部客户，基本上还是按照E3或E5去配置M365 Copilot的模式。价格和折扣会更灵活一些，尤其在四季度，为了拉动业绩增长，会有更大的数字目标。从客户存量来看，SMEC客户的数量和体量最大，包括用户量也很大。但这些SMB客户能否转化到M365或M365，主要取决于价格因素。因为今年（2026年）下半年公司即将全面提升OFFICE价格，这对SMB客户来说并不利好。 回顾上个财年Q4，高增长的驱动因素主要有几个：第一，企业级大客户增长，头部企业客户试点结束后，开始批量全员部署。世界500强中80%～90%的客户基本完成了POC，客户部署规模从几百、几千席提升到万级以上，5万席以上的大客户同比增长了六七倍。第二，产品层面的进一步整合。之前M365 Copilot类产品有八九十个，从上个财年三季度开始，公司要求精简和合并部分功能和组件，提升客户的使用体验，同时加强数据安全、用户隔离和混合多云的结合方式，增强了金融、政府、医疗、高科技制造等行业客户的采购意愿。第三，垂直行业解决方案的联动，包括D365、Teams、工作流和FDE。7月初组建了Microsoft Frontier Company，FDE团队独立核算，专注于行业和客户场景的一线支撑，Post Train和二开数据结合标准化版本，推动客户定制化需求。 合作伙伴层面，M365 Copilot给予合作伙伴一定的激励政策，相比其他标准云产品，M365 Copilot的rebate要更高。全体客户的通用驱动在于用户活跃度的提升。Copilot推动客户大规模部署，采购部门推动终端用户使用，客户激活率和使用频率都有所提升。展望明年（2027年），除了大客户和行业渗透、FDE驻场进一步深耕外，最主要的变化是M365本体涨价。但一期99美金的版本在其他版本涨价时不会涨价，这意味着原有E3、E5等版本的价格优势会逐步减弱，鼓励客户向E7转化，M365 Copilot成为99美金的COMPONENT，客户选择空间被进一步收窄，这将成为明年拉动增长的潜在点。 M365 Copilot未来将有三个版本：标准版（现有30美金版本）、中小客户版（配自研或开源模型）、高阶版（premium，配备高端硬件和最先进模型如GPT或cloud）。通过多版本策略，逐步将客户的收费方式转向API token，同时在行业和场景层面提供定制化服务，包括workflow、club等功能的定制和on site frontier的支持。针对不同客户规模和适用范围，配置不同版本的M365 Copilot，并通过价格折扣灵活调整，满足不同segment和客户属性的需求。 明年（2027年）以及今年（2026年）财年，另一个突破点是针对SMEC中的corporate中部、腰部客户。这类客户主要使用标准版，难以承担高阶版费用。标准版价格更灵活，可能会推出30天免费试用，适用于SMB和SMC中的Copilot客户。同时，agent功能将从大客户定制逐步渗透到腰部客户，FDE团队也将为中大型客户提供支持，以提升组织架构的ROI。 行业层面，依然按照三层tier结构，并根据客户规模横向细分，形成井格状结构，分别配置标准化或定制化方案，针对金融风控、医药文档管理、诊疗、制造业供应链、零售客服等场景，进一步定制和渗透agent，形成点线面布局。 对于腰部客户，将进一步扩大三年期EA长约，通过价格优势锁定更多长期客户的seat和付费能力。 最后，整体战略是将ECPS和SMEC客户，从原有的embedding、copilot、copilot stock逐步转向autopilot。autopilot类似于OAI的ChatGPT work，集成问答、文档处理、编程等多功能，未来发展方向是将所有单点Copilot（如M360 Copilot、D360 Copilot、GitHub Copilot、Security Copilot）、agent、cloud、cowork等聚合为平台，向客户提供平台化服务。核心本质是从单点产品转向平台和端口销售。 有说法称Nebius租用了一部分Azure资源，规模和对收入的贡献？ 公司之前和Nebius签了一个大约五年的协议，金额在170多亿到190多亿美元之间，主要在新泽西的温兰，协议大约是2025年9月签的，到2031年左右结束。Nebius确实租用了一部分Azure资源，但规模很小，大约每年2000多万美元，三年不到1亿美元。这2000多万美元中，80%以上是租用公司的IaaS和PaaS，包括网络、计算、存储、数据池、数据湖等。剩下10%左右是高阶GPU，这部分不是对外租用。 Nebius不会既向公司租高阶卡，又用这些卡对外销售给B端客户，避免了和公司B端客户的直接竞争。之前和OAI的合作模式是他们拿了公司的高阶卡再对外销售，形成了直接竞对。现在和Nebius的协议明确规定，他们只能自用，不能对外销售，而且规模很小。这基本是一个3+1或3+2年的协议，每年滚动续约，采用混合模式。价格折扣参照大客户标准，具体折扣未公开。 对于公司这边，他租的这个体量，一年才两千多万美元，这个规模其实并不大。对于I式的基本盘面来说，拉动作用也不是特别明显。在这两千多万的年租金中，IaaS加PaaS占了核心主体，当然也有一小部分是SaaS层面。真正的GPU反补给到老黄家的卡，这部分相对较少，而且主要是内部使用，基本上不用太多考虑。明年（2027年）再看，Nebius的核心算力依然依靠自有的新泽西园区和欧洲的机房。 Nebius返租公司那10%多不到20%的卡，主要原因有几个：第一是跨区冗余和灾备，需要有一部分承载，最主要是用于自训练和自备用。第二是模型研发和客户POC测试的弹性缓冲。第三是合规和多云保障，毕竟不能完全自由，担心欧盟方面对垄断的质疑。地缘层面来看，新泽西园区还需要一定周期，所以主体战场在欧洲，北美相对来说短期内竞争力不如CoreWeave。公司租给他一部分算力，他就能腾出部分算力对外出租，本质上是资源的内部流转，有助于其进一步扩大北美市场。这就是主要的逻辑。 公司会把Nebius进一步推进，因为现在多模型化，包括未来的多卡化，比如公司自己的MAIA，或者其他家的，前两天Helios也上线了。在多卡化模式下，像Nebius、CoreWeave、neocloud这些厂商，不仅是战略合作伙伴或供应商，将来也可能成为公司的云客户或云合作伙伴。这里面其实是双向的，大家互为资源，但考量和思路还是有差异。 近期微软租用的Nebius的算力资源的上线进展？上线了多少MW？？ 基本上在2026年下半年，也就是今年（2026年）这个时点，就要开始进一步交付。首先，2026年应该可用的大概有大几十兆瓦，不到100兆瓦。2025年11月应该已经上线一批，大约20多兆瓦，是B200集群。2026年4到6月，也就是二季度，又增加了几十兆瓦，大约60到70兆瓦，加上之前的20多兆瓦，整体在80到90兆瓦左右。但现在有一些瓶颈，比如电网并网、环评、电池分阶段运行节奏较慢，目前缺电，建设周期也可能延长。原计划三季度末能到150兆瓦，现在可能只有130到140兆瓦。到2026年年底，预计比150兆瓦再多四五十兆瓦，整体到200兆瓦左右。F27后续就开始布局，F27中期，也就是二季度，剩下的兆瓦会大规模推进。目前整体节奏大致如此。", "status": "extracted"}, "attachment:files/华创证券-电力设备及新能源行业海外新兴产业日报：AI算力与网络需求延续，GTCC订单增长，数据中心电源业务扩张-260805.pdf": {"id": "attachment:files/华创证券-电力设备及新能源行业海外新兴产业日报：AI算力与网络需求延续，GTCC订单增长，数据中心电源业务扩张-260805.pdf", "kind": "attachment", "title": "华创证券-电力设备及新能源行业海外新兴产业日报：AI算力与网络需求延续，GTCC订单增长，数据中心电源业务扩张-260805", "source_label": "华创证券", "excerpt": "基础化工 |", "content": "基础化工 | 证券研究报告 — 行业深度 2026年8月5日 强于大市 相关研究报告 《化工行业周报 20260726 》20260726 《化工行业周报 20260719 》20260721 《化工行业周报 20260712 》20260713 中银国际证券股份有限公司 具备证券投资咨询业务资格 基础化工 证券分析师：余嫄嫄 (8621 )20328550 yuanyuan.yu@bocichina.com 证券投资咨询业务证书编号： S1300517050002 证券分析师：范琦岩 qiyan.fan@bocichina.com 证券投资咨询业务证书编号： S1300525040001 半导体材料涨价深度报告 需求高增、成本上升及地缘冲突三重共振 受需求高增、成本上升等影响， 2026年以来全球半导体材料掀起涨价浪潮 ， 海外部分龙头扩产较慢，或受关键原材料制约， 国内优秀材料企业有望 迎来 加速替代窗口 。 支撑评级的要点  半导体材料行业高景气，产品价格全面上涨 。2026年以来全球半导体材 料掀起涨价浪潮，且本轮涨价范围 已经由点到面从关键化工原料扩散至 制造全链条，覆盖硅片、电子特气、湿电子化学品、靶材、封装材料等 几乎所有核心品类，形成全产业链价格上行态势。 从二级市场表现来看， 2026年以来半导体材料板块 走势跑赢市场： 截至 2026年7月31日，申 万半导体材料指数年内累计涨幅为 47.19%，跑赢沪深 300指数 /申万电子 指数 48.09/25.57pct ；申万电子化学品指数年内累计涨幅为 35.94%，跑赢 沪深300指数 /申万电子指数 36.84/14.32pct 。  半导体材料涨价原因：需求 高增、成本上升及地缘冲突三重共振 。首先， AI算力需求高增拉动半导体全产业链需求 ，全球半导体市场规模大幅增 长。WSTS预计 2026年全球半导体市场规模有望达 1.51万亿美元（同比 +89.9%），2027年达1.91万亿美元（ 同比 +26.6 %）。半导体材料需求直 接受益于下游晶圆厂扩产周期，且 AI浪潮大幅提升了上游材料消耗量。 2025年全球半导体材料市场销售额 732亿美元（同比 +6.8%），其中晶圆 制造材料销售额 458亿美元（同比 +5.4%），封装材料销售额 274亿美元 （同比 +9.3%）。其次，中东事件对全球供应链与能源成本 产生影响，能 源价格波动传导至化工原料与 部分电子材料 制造成本 ，红海航道扰动推 高国际物流成本 。例如，位于日本的全球硅片与光刻胶龙头公司因成本 等原因开启本轮涨价。 此外，由于供给端硬约束 +AI需求高增 ，金属价格 走强，算力金属集体涨价。 例如，受 化工品、算力金属等 原材料以及生 产成本上涨影响， 靶材、电子级氢氟酸等 产品涨价；受原材料出口管制 以及海外供应扰动 影响，六氟化钨 、氦气等产品价格出现上涨。地缘政 治或成为半导体材料定价的核心矛 盾，我们认为本轮涨价周期区别于以 往单纯需求拉动，部分材料呈现“管制触发 -产能断供 -价格跳涨 -传导加 速”的特征。  我国半导体材料企业国产替代持续推进。 2025年中国大陆 半导体材料 销 售额为 156亿美元（同比 +12.5%）。近年来，依托国家政策支持和市场 需求红利，我国 半导体材料行业进入快速发展阶段，国产替代进程持续 推进。国内材料企业产品技术水平和研发能力不断增强，从单一产品突 破向产业链配套完善逐步过渡，整体产业竞争力稳步提升 。随着全球半 导体供应链本土化、多元化布局趋势加深，我国 半导体材料行业 有望迎 来技术突破和市场 扩容的双重发展机遇。 此外，本轮下游高景气，叠加 海外龙头扩产速度较慢、受到原材料供应波动等影响，我国半导体材料 行业或迎来国产替代加速的关键窗口期。 投资建议  基于下游行业快速发展 、先进技术不断迭代以及国产替代大背景，我们 认为电子材料领域有望持续迎来发展良机。 1、受益于下游需求增长以及技术不断进步，全球半导体材料市场规模持 续扩大， 先进材料需求快速提升 。在多种关键半导体材料方面，我国企 业稳健布局产能与技术研发，竞争力与产销规模有望持续提升。 2、部分半导体材料及原料受益于涨价，下游高景气叠加海外龙头扩产速 度较慢、受到原材料供应波动等影响，我国半导体材料行业或迎来国产 替代加速的关键窗口期。  推荐：安集科技、鼎龙股份、江丰电子、雅克科技、彤程新材、沪硅产 业、德邦科技、 阳谷华泰 ；建议关注： 华特气体、联瑞新材、中船特气、 中巨芯、西安奕材、广钢气体、昊华科技等 。 风险提示  技术升级迭代的风险 ，下游需求复苏不及预期的风险 ，全球经济周期性 波动、国际贸易摩擦及不可抗力的风险 。 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 2 目录 半导体材料行业高景气，多个产品价格上涨 ................................ .............. 5 多个半导体材料进入涨价周期 ................................ ................................ ................................ ........ 5 2026年以来板块走势跑赢市场 ................................ ................................ ................................ ....... 6 半导体材料 涨价原因：需求高增、成本上升及地缘冲突三重共振 ........... 7 AI算力需求高增拉动半导体全产业链需求 ................................ ................................ .................... 7 地缘冲突引发供给侧冲击，上游原材料成本持续上行 ................................ ................................ 10 本轮涉及涨价的部分关键半导体材料 ................................ ........................ 15 六氟化钨：原料涨价助推，全球格局重塑、国产龙头崛起 ................................ ........................ 15 半导体硅片： 供需与成本共振，硅片酝酿新一轮涨价 ................................ ................................ 17 靶材： AI算力需求高增、原材料价格波动与地缘政治共振推动涨 价 ................................ ........ 19 电子级氢氟酸： 涨价预期持续升温，高端 G5级产品供需偏紧 ................................ .................. 21 氦气：全球供应遭受冲击，我国实施出口管制 ................................ ................................ ........... 24 我国半导体材料企业国产替代持续推进 ................................ .................... 28 投资建议 ............................... MI《材料市场数据订阅》报告， 2025年全球半导 体材料市场销售额为 732亿美元，同比增长 6.8%，晶圆制造材料和封装材料两大板块均实现增长， 反映出更高的工艺复杂度、先进制程需求以及高性 能计算和高带宽存储制造领域的持续投资。 SEMI 数据显示， 2025年晶圆制造材料销售额 为458亿美元，同比 增长 5.4%，其中光刻相关材料（包括光 掩膜、光刻胶及辅助材料）以及湿化学品均实现强劲的双位数增长，因为更高的工艺强度和更严苛 的光刻要求持续推动材料消耗量的增加 ；2025年封装材料销售额 为274亿美元，同比 增长 9.3%，其 中基板和键合线引领增长，键合线受到 金价上涨的支撑，先进基板则受益于强劲需求。 分地区来看， 中国台湾地区连续第 16年保持全球最大半导体材料消费地区位置， 2025年销售额达 217亿美元； 中国大陆 以156亿美元的销售额排名第二 ；韩国以 112亿美元销售额排名第三。除欧洲外，所有地 区均实现同比增长，中国和北美在主要地区中增长最强。 图表 6. 2021 -2025年全球半导体材料市场销售额 图表 7. 2025年全球分地区半导体材料市场销售额 资料来源： SEMI，中银证券 资料来源： SEMI，中银证券 展望后市 ， 半导体材料 市场需求增量确定性强 。 1）半导体材料 需求直接受益于 下游晶圆厂扩产周期 。 根据 Yole Group ，从半导体产业价值链来看 ， 晶圆制造占据 50%的价值 ，晶圆制造材料供应商占 4%。 下游晶圆厂处于大规模扩产周期，需要大量采购设备，设备到位后需持续消耗材料， 新增产能持续 释放为半导体材料 市场需求 提供了确定性增量 ，行业景气度具备持续性。 根据中研网以及 SEMI，我 国是全球新建晶圆厂数量最多的国家 ，近年国内新增了大量 8英寸和 12英寸晶圆厂， 12英寸晶圆 厂市场份额已较数年前大幅提升。 此外，先进制程加速建设放大了 材料需求 ——随着芯片线宽持续 缩小、结构复杂度显著提升，制造过程对高品质半导体材料的需求呈指数级上升。 2）AI浪潮大幅 提升上游材料消耗量。 根据中研网， AI服务器需要高性能的 GPU、CPU、TPU和存储等硬件支持， 对芯片的处理速度、容量和带宽都提出了更高要求，直接推动先进封装技术发展 以及 HBM需求增 长，打开了半导体材料的增量空间。 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 10 图表 8. 2025年半导体 产业价值链 资料来源： Y ole Group ，EETimes，中银证券 地缘冲突引发供给侧冲击 ，上游原材料成本持续上行 中东事件对全球供应链与能源成本 产生影响。1）能源价格波动传导至化工原料与 部分电子材料 制造 成本。中东局势紧张导致国际原油、天然气价格大幅波动。 美国能源信息署（ EIA）2026年6月发 布的短期能源展望（ STEO）报告显 示，受霍尔木兹海峡航运中断影响， 2026年布伦特原油现货均 价预计为每桶 95美元，其中 5月布伦特原油现货价格均价为每桶 107美元，6-7月均价预计维持在 每桶 105美元左右 。6月中下旬以来，受美伊停战谈判进展影响，国际油价出现回落 。能源价格上 涨直接推升半导体材料制造成本：一是 硅片、电子特气 等材料生产属于高耗能行业， 海外企业能源 成本大幅上涨， 而国内企业 积极布局于低电价区域以控制成本；二是光刻胶、 CMP抛光液等 材料部 分上游原材料价格与原油价格高度联动，油价上涨通过产业链传导至半导体材料端 。例如，根据百 川盈孚数据 ，2026年光刻工艺核心耗材丙二醇单甲醚 醋酸酯（ PGMEA）价格最高于4月涨至 1.42 万元 /吨左右， 较年初 7,600元/吨的低点上涨 86.84 %。根据环球网 的信息，杜邦、陶氏、 LG化学已 发出提价通知 ，PGMEA价格预计上涨 40%-50%，稀释剂成品厂商计划 4月出货产品提价约 20%。 能源价格上涨对生产成本形成直接压力 ，在当前能源 成本高企的背景下， 材料企业通过涨价向下游 传导成本压力成为必然选择。 2）红海航道扰动推高国际物流成本 。根据百运网， 中东地缘冲突引发 红海航运危机，绕行好望角使亚洲至欧洲单程航程增加约 10-14天、成本上涨30%-50%。物流成本 上升直接传导至半导体材料终端售价，成为推动本轮涨价的重要外部因素。 从国内数据来看， 国家统计局 2026年6月发布的最新数据显示， 2026年5月全国工业生产者出厂 价格指数（ PPI）同比上涨 3.9%，环比上涨 0.5%，PPI同比涨幅较 4月扩大 1.1pct，连续 8个月环比 上涨。受国内部分行业需求增加以及国际大宗商品价格波动传导等因素影响， 2026年5月我国工业  同比 +26.6 %）。半导体材料需求直 接受益于下游晶圆厂扩产周期，且 AI浪潮大幅提升了上游材料消耗量。 2025年全球半导体材料市场销售额 732亿美元（同比 +6.8%），其中晶圆 制造材料销售额 458亿美元（同比 +5.4%），封装材料销售额 274亿美元 （同比 +9.3%）。其次，中东事件对全球供应链与能源成本 产生影响，能 源价格波动传导至化工原料与 部分电子材料 制造成本 ，红海航道扰动推 高国际物流成本 。例如，位于日本的全球硅片与光刻胶龙头公司因成本 等原因开启本轮涨价。 此外，由于供给端硬约束 +AI需求高增 ，金属价格 走强，算力金属集体涨价。 例如，受 化工品、算力金属等 原材料以及生 产成本上涨影响， 靶材、电子级氢氟酸等 产品涨价；受原材料出口管制 以及海外供应扰动 影响，六氟化钨 、氦气等产品价格出现上涨。地缘政 治或成为半导体材料定价的核心矛 盾，我们认为本轮涨价周期区别于以 往单纯需求拉动，部分材料呈现“管制触发 -产能断供 -价格跳涨 -传导加 速”的特征。  我国半导体材料企业国产替代持续推进。 2025年中国大陆 半导体材料 销 售额为 156亿美元（同比 +12.5%）。近年来，依托国家政策支持和市场 需求红利，我国 半导体材料行业进入快速发展阶段，国产替代进程持续 推进。国内材料企业产品技术水平和研发能力不断增强，从单一产品突 破向产业链配套完善逐步过渡，整体产业竞争力稳步提升 。随着全球半 导体供应链本土化、多元化布局趋势加深，我国 半导体材料行业 有望迎 来技术突破和市场 扩容的双重发展机遇。 此外，本轮下游高景气，叠加 海外龙头扩产速度较慢、受到原材料供应波动等影响，我国半导体材料 行业或迎来国产替代加速的关键窗口期。 投资建议  基于下游行业快速发展 、先进技术不断迭代以及国产替代大背景，我们 认为电子材料领域有望持续迎来发展良机。 1、受益于下游需求增长以及技术不断进步，全球半导体材料市场规模持 续扩大， 先进材料需求快速提升 。在多种关键半导体材料方面，我国企 业稳健布局产能与技术研发，竞争力与产销规模有望持续提升。 2、部分半导体材料及原料受益于涨价，下游高景气叠加海外龙头扩产速 度较慢、受到原材料供应波动等影响，我国半导体材料行业或迎来国产 替代加速的关键窗口期。  推荐：安集科技、鼎龙股份、江丰电子、雅克科技、彤程新材、沪硅产 业、德邦科技、 阳谷华泰 ；建议关注： 华特气体、联瑞新材、中船特气、 中巨芯、西安奕材、广钢气体、昊华科技等 。 风险提示  技术升级迭代的风险 ，下游需求复苏不及预期的风险 ，全球经济周期性 波动、国际贸易摩擦及不可抗力的风险 。 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 2 目录 半导体材料行业高景气，多个产品价格上涨 ................................ .............. 5 多个半导体材料进入涨价周期 ................................ ................................ ................................ ........ 5 2026年以来板块走势跑赢市场 ................................ ................................ ................................ ....... 6 半导体材料 涨价原因：需求高增、成本上升及地缘冲突三重共振 ........... 7 AI算力需求高增拉动半导体全产业链需求 ................................ ................................ .................... 7 地缘冲突引发供给侧冲击，上游原材料成本持续上行 ................................ ................................ 10 本轮涉及涨价的部分关键半导体材料 ................................ ........................ 15 六氟化钨：原料涨价助推，全球格局重塑、国产龙头崛起 ................................ ........................ 15 半导体硅片： 供需与成本共振，硅片酝酿新一轮涨价 ................................ ................................ 1  300mm晶圆厂展望报告》 （ 300mm Fab Outlook ） 中指出，全球 300mm晶圆厂设备支出预计 2026年将增长 18%至1,330亿美元， 2027年将增长 14% 至1,510亿美元。 2027 -2029年全球 300mm晶圆厂设备投资预计将广泛覆盖主要半导体制造区域， 反映了先进制程扩张、 memory产能增加 以及政策支持下的供应链本地化等多种因素的综合影响。中 国大陆、中国台湾 地区、韩国和美洲地区在此期间均将迎来大规模投资，而日本、欧洲与中东、东 南亚地区也将从较小的基数继续扩大投资。 图表 5. 2024 -2029E全球 300mm晶圆厂设备 资本开支 资料来源： SEMI，中银证券 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 9 全球半导体材料 市场销售额创历史新高 。根据 SEMI《材料市场数据订阅》报告， 2025年全球半导 体材料市场销售额为 732亿美元，同比增长 6.8%，晶圆制造材料和封装材料两大板块均实现增长， 反映出更高的工艺复杂度、先进制程需求以及高性 能计算和高带宽存储制造领域的持续投资。 SEMI 数据显示， 2025年晶圆制造材料销售额 为458亿美元，同比 增长 5.4%，其中光刻相关材料（包括光 掩膜、光刻胶及辅助材料）以及湿化学品均实现强劲的双位数增长，因为更高的工艺强度和更严苛 的光刻要求持续推动材料消耗量的增加 ；2025年封装材料销售额 为274亿美元，同比 增长 9.3%，其 中基板和键合线引领增长，键合线受到 金价上涨的支撑，先进基板则受益于强劲需求。 分地区来看， 中国台湾地区连续第 16年保持全球最大半导体材料消费地区位置， 2025年销售额达 217亿美元； 中国大陆 以156亿美元的销售额排名第二 ；韩国以 112亿美元销售额排名第三。除欧洲外，所有地 区均实现同比增长，中国和北美在主要地区中增长最强。 图表 6. 2021 -2025年全球半导体材料市场销售额 图表 7. 2025年全球分地区半导体材料市场销售额 资料来源： SEMI，中银证券 资料来源： SEMI，中银证券 展望后市 ， 半导体材料 市场需求增量确定性强 。 1）半导体材料 需求直接受益于 下游晶圆厂扩产周期 。 根据 Yole Group ，从半导体产业价值链来看 ， 晶圆制造占据 50%的价值 ，晶圆制造材料供应商占 4%。 下游晶圆厂处于大规模扩产周期，需要大量采购设备，设备到位后需持续消耗材料， 新增产能持续 释放为半导体材料 市场需求 提供了确定性增量 ，行业景气度具备持续性。 根据中研网以及 SEMI，我 国是全球新建晶圆厂数量最多的国家 ，近年国内新增了大量 8英寸和 12英寸晶圆厂， 12英寸晶圆 厂市场份额已较数年前大幅提升。 此外，先进制程加速建设放大了 材料需求 ——随着芯片线宽持续 缩小、结构复杂度显著提升，制造过程对高品质半导体材料的需求呈指数级上升。 2）AI浪潮大幅 提升上游材料消耗量。 根据中研网， AI服务器需要高性能的 GPU、CPU、TPU和存储等硬件支持， 对芯片的处理速度、容量和带宽都提出了更高要求，直接推动先进封装技术发展 以及 HBM需求增 长，打开了半导体材料的增量空间。 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 10 图表 8. 2025年半导体 产业价值链 资料来源： Y ole Group ，EETimes，中银证券 地缘冲突引发供给侧冲击 ，上游原材料成本持续上行 中东事件对全球供应链与能源成本 产生影响。1）能源价格波动传导至化工原料与 部分电子材料 制造 成本。中东局势紧张导致国际原油、天然气价格大幅波动。 美国能源信息署（ EIA）2026年6月发 布的短期能源展望（ STEO）报告显 示，受霍尔木兹海峡航运中断影响， 2026年布伦特原油现货均 价预计为每桶 95美元，其中 5月布伦特原油现货价格均价为每桶 107美元，6-7月均价预计维持在 每桶 105美元左右 。6月中下旬以来，受美伊停战谈判进展影响，国际油价出现回落 。能源价格上 涨直接推升半导体材料制造成本：一是 硅片、电子特气 等材料生产属于高耗能行业， 海外企业能源 成本大幅上涨， 而国内企业 积极布局于低电价区域以控制成本；二是光刻胶、 CMP抛光液等 材料部 分上游原材料价格与原油价格高度联动，油价上涨通过产业链传导至半导体材料端 。例如，根据百 川盈孚数据 ，2026年光刻工艺核心耗材丙二醇单甲醚 醋酸酯（ PGMEA）价格最高于4月涨至 1.42 万元 /吨左右， 较年初 7,600元/吨的低点上涨 86.84 %。根据环球网 的信息，杜邦、陶氏、 LG化学已 发出提价通知 ，PGMEA价格预计上涨 40%-50%，稀释剂成品厂商计划 4月出货产品提价约 20%。 能源价格上涨对生产成本形成直接压力 ，在当前能源 成本高企的背景下， 材料企业通过涨价向下游 传导成本压力成为必然选择。 2）红海航道扰动推高国际物流成本 。根据百运网， 中东地缘冲突引发 红海航运危机，绕行好望角使亚洲至欧洲单程航程增加约 10-14天、成本上涨30%-50%。物流成本 上升直接传导至半导体材料终端售价，成为推动本轮涨价的重要外部因素。 从国内数据来看， 国家统计局 2026年6月发布的最新数据显示， 2026年5月全国工业生产者出厂 价格指数（ PPI）同比上涨 3.9%，环比上涨 0.5%，PPI同比涨幅较 4月扩大 1.1pct，连续 8个月环比 上涨。受国内部分行业需求增加以及国际大宗商品价格波动传导等因素影响， 2026年5月我国工业 生产者价格继续上涨，其中计算机通信和其他电子设备制造业价格呈上升趋势 ，同环比分别上涨 2.1%/0.6% 。 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 11 图表 9. 2021-2026年7月WTI及布伦特 原油期货价格 图表 10. 202 5-2027E布伦特原油现货价格及全球库存变化 资料来源： 同花顺 iFinD，中银证券 资料来源： EIA，中银证券 图表 11. 2021 -2026年7月NYMEX 天然气期货价格 图表 12. 202 6年丙二醇甲醚醋酸酯（ PGMEA/PMA ）价格 （截至 2026.7.6） 资料来源：同花顺 iFinD，中银证券 资料来源： 百川盈孚 ，中银证券 供给端硬约束 +AI需求高增 ，金属价格走强 ，算力金属集体涨价 。根据万得数据， 2025年初 /2026 年初至2026年7月30日，LME铜价分别 +56.78 %/+10.74 %至13,798.50美元 /吨， LME铝价分别 +26.26%/+5.69%至3,193.00美元 /吨。此外，钨、钼、锡、钽、铟、锗 等战略金属轮番走强。 钨金属 方面，根据中钨在线数据， 2026年7月28日钨粉价格为 975元/千克，较 2025年均价 +98.16%。钼 金属方面， 根据中钨在线， 2026年1-7月我国多数钼制品均价同比均上涨 ，其中钼精矿均价 4,697 元/吨度（同比 +29.64%），钼铁均价 29.92万元/吨（同比 +27.68%）。根据上海钢联数据， Mysteel 锡锭现货价格从年初的 33.23万元/吨涨至 2026年6月1日的 43.00万元/吨的高点 ， 涨幅达 29.42%； 99.95%高纯金属钽锭在 6月1日达到 6,700元/kg的高点；6月26日，标准精铟价格区间为 5,200-5,350 元/千克，较年初的 2,960元/kg大幅上涨，并有望延续强势上涨行情。 根据维赛特资讯 ，钼、钨、锡、 钽、铟、锗、镓等均被纳入算力金属序列 ，此前在存储大厂“以钼代钨”的消息下，钼的市场关注 度大幅提升 ，锡、钽、铟、锗 等金属价格的上涨也与AI需求高增有关。此外，政策方面，新版《矿 产资源法实施条例》于 2026年6月15日正式施行，将稀土、钨、锑、镓、锗、铟、钽等 36种关键 矿产纳入国家级战略性矿产目录。 我们认为 ，供给端硬约束以及 AI需求高增 双重共振 有望抬升算力 金属价格中枢 ，而算力金属作为 靶材、电子特气、封装材料等部分半导体材料的关键原材料， 其涨 价也将推动相关半导体材料 成本上涨。 405060708090100110120130 2021-01-04 2022-01-04 2023-01-04 2024-01-04 2025-01-04 2026-01-04（美元 /桶） 期货结算价 (连续 ):WTI原油 :NYMEX 期货结算价 (连续 ):布伦特原油 :NYMEX 012345678910 2021-01-04 2022-01-04 2023-01-04 2024-01-04 2025-01-04 2026-01-04（美元 /百万英热单位） 期货结算价 (连续 ):天然气 :NYMEX 7,0008,0009,00010,00011,00012,00013,00014,00015,000 2026-01-01 2026-02-01 2026-03-01 2026-04-01 2026-05-01 2026-06-01 2026-07-01 丙二醇甲醚醋酸酯 PMA山东地区 (元/吨)丙二醇甲醚醋酸酯 PMA华东地区 (元/吨) 丙二醇甲醚醋酸酯 PMA华南地区 (元/吨) 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 12 图表 13. 202 0-2026年7月L 美元 （同比 +9.3%）。其次，中东事件对全球供应链与能源成本 产生影响，能 源价格波动传导至化工原料与 部分电子材料 制造成本 ，红海航道扰动推 高国际物流成本 。例如，位于日本的全球硅片与光刻胶龙头公司因成本 等原因开启本轮涨价。 此外，由于供给端硬约束 +AI需求高增 ，金属价格 走强，算力金属集体涨价。 例如，受 化工品、算力金属等 原材料以及生 产成本上涨影响， 靶材、电子级氢氟酸等 产品涨价；受原材料出口管制 以及海外供应扰动 影响，六氟化钨 、氦气等产品价格出现上涨。地缘政 治或成为半导体材料定价的核心矛 盾，我们认为本轮涨价周期区别于以 往单纯需求拉动，部分材料呈现“管制触发 -产能断供 -价格跳涨 -传导加 速”的特征。  我国半导体材料企业国产替代持续推进。 2025年中国大陆 半导体材料 销 售额为 156亿美元（同比 +12.5%）。近年来，依托国家政策支持和市场 需求红利，我国 半导体材料行业进入快速发展阶段，国产替代进程持续 推进。国内材料企业产品技术水平和研发能力不断增强，从单一产品突 破向产业链配套完善逐步过渡，整体产业竞争力稳步提升 。随着全球半 导体供应链本土化、多元化布局趋势加深，我国 半导体材料行业 有望迎 来技术突破和市场 扩容的双重发展机遇。 此外，本轮下游高景气，叠加 海外龙头扩产速度较慢、受到原材料供应波动等影响，我国半导体材料 行业或迎来国产替代加速的关键窗口期。 投资建议  基于下游行业快速发展 、先进技术不断迭代以及国产替代大背景，我们 认为电子材料领域有望持续迎来发展良机。 1、受益于下游需求增长以及技术不断进步，全球半导体材料市场规模持 续扩大， 先进材料需求快速提升 。在多种关键半导体材料方面，我国企 业稳健布局产能与技术研发，竞争力与产销规模有望持续提升。 2、部分半导体材料及原料受益于涨价，下游高景气叠加海外龙头扩产速 度较慢、受到原材料供应波动等影响，我国半导体材料行业或迎来国产 替代加速的关键窗口期。  推荐：安集科技、鼎龙股份、江丰电子、雅克科技、彤程新材、沪硅产 业、德邦科技、 阳谷华泰 ；建议关注： 华特气体、联瑞新材、中船特气、 中巨芯、西安奕材、广钢气体、昊华科技等 。 风险提示  技术升级迭代的风险 ，下游需求复苏不及预期的风险 ，全球经济周期性 波动、国际贸易摩擦及不可抗力的风险 。 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 2 目录 半导体材料行业高景气，多个产品价格上涨 ................................ .............. 5 多个半导体材料进入涨价周期 ................................ ................................ ................................ ........ 5 2026年以来板块走势跑赢市场 ................................ ................................ ................................ ....... 6 半导体材料 涨价原因：需求高增、成本上升及地缘冲突三重共振 ........... 7 AI算力需求高增拉动半导体全产业链需求 ................................ ................................ .................... 7 地缘冲突引发供给侧冲击，上游原材料成本持续上行 ................................ ................................ 10 本轮涉及涨价的部分关键半导体材料 ................................ ........................ 15 六氟化钨：原料涨价助推，全球格局重塑、国产龙头崛起 ................................ ........................ 15 半导体硅片： 供需与成本共振，硅片酝酿新一轮涨价 ................................ ................................ 17 靶材： AI算力需求高增、原材料价格波动与地缘政治共振推动涨 价 ................................ ........ 19 电子级氢氟酸： 涨价预期持续升温，高端 G5级产品供需偏紧 ....................... 计将广泛覆盖主要半导体制造区域， 反映了先进制程扩张、 memory产能增加 以及政策支持下的供应链本地化等多种因素的综合影响。中 国大陆、中国台湾 地区、韩国和美洲地区在此期间均将迎来大规模投资，而日本、欧洲与中东、东 南亚地区也将从较小的基数继续扩大投资。 图表 5. 2024 -2029E全球 300mm晶圆厂设备 资本开支 资料来源： SEMI，中银证券 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 9 全球半导体材料 市场销售额创历史新高 。根据 SEMI《材料市场数据订阅》报告， 2025年全球半导 体材料市场销售额为 732亿美元，同比增长 6.8%，晶圆制造材料和封装材料两大板块均实现增长， 反映出更高的工艺复杂度、先进制程需求以及高性 能计算和高带宽存储制造领域的持续投资。 SEMI 数据显示， 2025年晶圆制造材料销售额 为458亿美元，同比 增长 5.4%，其中光刻相关材料（包括光 掩膜、光刻胶及辅助材料）以及湿化学品均实现强劲的双位数增长，因为更高的工艺强度和更严苛 的光刻要求持续推动材料消耗量的增加 ；2025年封装材料销售额 为274亿美元，同比 增长 9.3%，其 中基板和键合线引领增长，键合线受到 金价上涨的支撑，先进基板则受益于强劲需求。 分地区来看， 中国台湾地区连续第 16年保持全球最大半导体材料消费地区位置， 2025年销售额达 217亿美元； 中国大陆 以156亿美元的销售额排名第二 ；韩国以 112亿美元销售额排名第三。除欧洲外，所有地 区均实现同比增长，中国和北美在主要地区中增长最强。 图表 6. 2021 -2025年全球半导体材料市场销售额 图表 7. 2025年全球分地区半导体材料市场销售额 资料来源： SEMI，中银证券 资料来源： SEMI，中银证券 展望后市 ， 半导体材料 市场需求增量确定性强 。 1）半导体材料 需求直接受益于 下游晶圆厂扩产周期 。 根据 Yole Group ，从半导体产业价值链来看 ， 晶圆制造占据 50%的价值 ，晶圆制造材料供应商占 4%。 下游晶圆厂处于大规模扩产周期，需要大量采购设备，设备到位后需持续消耗材料， 新增产能持续 释放为半导体材料 市场需求 提供了确定性增量 ，行业景气度具备持续性。 根据中研网以及 SEMI，我 国是全球新建晶圆厂数量最多的国家 ，近年国内新增了大量 8英寸和 12英寸晶圆厂， 12英寸晶圆 厂市场份额已较数年前大幅提升。 此外，先进制程加速建设放大了 材料需求 ——随着芯片线宽持续 缩小、结构复杂度显著提升，制造过程对高品质半导体材料的需求呈指数级上升。 2）AI浪潮大幅 提升上游材料消耗量。 根据中研网， AI服务器需要高性能的 GPU、CPU、TPU和存储等硬件支持， 对芯片的处理速度、容量和带宽都提出了更高要求，直接推动先进封装技术发展 以及 HBM需求增 长，打开了半导体材料的增量空间。 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 10 图表 8. 2025年半导体 产业价值链 资料来源： Y ole Group ，EETimes，中银证券 地缘冲突引发供给侧冲击 ，上游原材料成本持续上行 中东事件对全球供应链与能源成本 产生影响。1）能源价格波动传导至化工原料与 部分电子材料 制造 成本。中东局势紧张导致国际原油、天然气价格大幅波动。 美国能源信息署（ EIA）2026年6月发 布的短期能源展望（ STEO）报告显 示，受霍尔木兹海峡航运中断影响， 2026年布伦特原油现货均 价预计为每桶 95美元，其中 5月布伦特原油现货价格均价为每桶 107美元，6-7月均价预计维持在 每桶 105美元左右 。6月中下旬以来，受美伊停战谈判进展影响，国际油价出现回落 。能源价格上 涨直接推升半导体材料制造成本：一是 硅片、电子特气 等材料生产属于高耗能行业， 海外企业能源 成本大幅上涨， 而国内企业 积极布局于低电价区域以控制成本；二是光刻胶、 CMP抛光液等 材料部 分上游原材料价格与原油价格高度联动，油价上涨通过产业链传导至半导体材料端 。例如，根据百 川盈孚数据 ，2026年光刻工艺核心耗材丙二醇单甲醚 醋酸酯（ PGMEA）价格最高于4月涨至 1.42 万元 /吨左右， 较年初 7,600元/吨的低点上涨 86.84 %。根据环球网 的信息，杜邦、陶氏、 LG化学已 发出提价通知 ，PGMEA价格预计上涨 40%-50%，稀释剂成品厂商计划 4月出货产品提价约 20%。 能源价格上涨对生产成本形成直接压力 ，在当前能源 成本高企的背景下， 材料企业通过涨价向下游 传导成本压力成为必然选择。 2）红海航道扰动推高国际物流成本 。根据百运网， 中东地缘 E领域客户PCB制 板层数高，厚径比大，部分 订单用到高速板材及高阶HDI，产品价值高，与珠海板厂定位高度契合，越来越多 的ATE客户把打样及批量订单交给公司。目前单个客户收入占总体营收比重仍不 大，但呈逐渐上升趋势。 【PCB制 板产能满产积压】 PCB制 板业务订单每月呈较快增长态势，部分瓶颈工序产能已经满产，订单有 所积压，相关扩产设备正在添置中。公司将结合订单增长的需求加快产能的完全释 放。 【LED领域阶段性承压后迎来大额订单】 2025年至今年一季度，公司LED领域部分主要客户因阶段性产能消化和技术路 线选型，对测试设备新增采购需求有所减少。但公司表示，LED先进显示领域市场 需求持续增长的长期逻辑没有改变，目前公司已公告与兆驰股份签订大额订单合 同，后续LED将有更多主要厂商进入设备采购阶段，公司争取承接更多订单。 【在手订单充足，产能满负荷运转】 今年以来，公司主要在售产品的市场需求旺盛，景气度持续上升，目前在手订 单较为充足，产能利用率达到满产状态，生产计划安排紧凑，产线排产周期拉长。 【新增产能已按规划分阶段投产】 公司加快产能扩张速度以应对下游客户需求的持续增长，新增产能已按规划分 阶段投产，产能规模持续提升。朗读 全屏 手机 浏览 保存 设置 帮助 退出 【光通信芯片领域布局硅光晶圆测试】 光通信芯片测试是公司产品应用领域之一，公司目前销售适用于PD/APD/VCS EL等芯片测试的探针测试一体机、分选机、AOI等设备，适用于硅光晶圆测试的12 吋全自动高精度晶圆探针台设备。公司看好该领域长期发展前景，将持续推进技术 储备与客户验证。 【集成电路领域已进入多家主要厂商试机验证】 公司正加快推进集成电路领域的晶圆探针台导入验证工作，2025年至今已进入 多家国内集成电路主要厂商开展试机验证。由于高端晶圆探针台市场的定制化需求 和验证要求高等特点，验证周期较长，公司争取加快推进项目进展，为后续承接相 关订单打下基础。 【柔性传感器进入批量出货】 公司表示，从十几年前开始研发柔性传感器，积累了丰富的Know-how以保证 产品的重复性、稳定性、一致性，现阶段已进入批量出货阶段，能够更好、更快地 为客户提供产品及个性化解决方案。柔性传感器收入近年来不断提升，涵盖汽车、 医疗健康、具身智能、消费电子等多个领域，已形成较为稳定的应用领域及市场需 求。 【威晶光电产能快速爬坡】 威晶光电主业为半导体激光器、光电子器件的研发、设计、生产、封装和销 售，具备TO、TOSA、蝶形等成熟产品封装工艺能力，服务于激光传感、光纤传 感、光谱检测、气体检测等关键领域。受益于国内燃气安全行业市场需求激增以及 光谱检测、光纤传感等领域需求增加，目前公司产能正处于快速爬坡阶段。 【承接半导体封装代工业务】 公司近期开始承接部分TOSA、BOSA及晶圆后道加工等代工类业务。公司设计 产线初期已做了较多应用领域的技术产品储备，采购了一系列先进的高端封装设 备，能够满足多种产品的封装需求。未来将根据市场需求及整体发展情况综合考虑 产品布局，当前阶段优先提升产线整体产能及盈利能力。 【数据采集类产品需求明显增长】 今年收到了较多关于数据采集的项目合作需求，基于公司弹性传感器所生产的 数据抓取手套、数据抓取服有比较明显的需求增长，公司不仅能为厂商提供传感器 硬件产品，还能为个性化场景的搭建及丰富提供支持。 ────────────────────────────────────── 内容来源： 1、一博科技：2026年8月4日投资者关系活动记录表。 2、矽电股份：2026年7月1日-2026年7月29日投资者关系活动记录表。 3、汉威科技：2026年8月4日投资者关系活动记录表。 *免责声明：文章内容仅供参考，不构成投资建议 *风险提示：股市有风险，入市需谨慎", "status": "extracted"}, "post:2026-08-06T19-24:fb88a1e414f3": {"id": "post:2026-08-06T19-24:fb88a1e414f3", "kind": "post", "title": "2026-08-06 19:24", "source_label": "帖子正文", "excerpt": "【国泰海通通信】海光芯正：硅光全栈稀缺标的，产能释放与海外业务共振0805海光芯正是国内稀缺的AI硅光平台型公司，核心看点已从“技术验证”逐步进入“产能释放、海外放量、盈利改善”阶段。随着南通基地扩产推进，叠加海外合作落地，公司有望迎来业绩和估值的双重重估。", "content": "【国泰海通通信】海光芯正：硅光全栈稀缺标的，产能释放与海外业务共振0805海光芯正是国内稀缺的AI硅光平台型公司，核心看点已从“技术 位， 25H2以来国内BD、IPO及一级市场融资同步改善。随着资金由融资端向 CXO逐级传导，叠加板块估值仍处历史较 低水平，行业业绩与估值有望持续修复。 创新药全球化加速，供需格局确立长期产业趋势。 全球新药获批维持高位，研发成本上升推动外包渗透率持续提升，预计由 2024年的52%增至2026年的57%； 中国创新药在ADC、双多抗、新一代小分子药物等前沿领域竞争力增强， 2025年重磅license-out交易数量和金额占全球约 44%和49%，BD首付款成为重要资金来 源。近年来专利悬崖推动 MNC通过并购持续补充管线， FDA加速审评与新方法学政策有望进一步激励研发、提升效率、扩大全球外包需求。 AI制药潜力释放，有望重塑医药未来图景。 AI制药领域正经历着快速的迭代和变革，算法的更新迭代和算力的支持为 AI在制药领域的应用打下了良好的基础。 传统药物开发过程花费时间长成本高，且成功率较低，随着已有靶点的新药陆续获批，新药开发难度逐渐上升。近年来 AI特别是深度学习的发展，促进了其在包 括靶点筛选、分子生成及优化、 ADMET预测、晶型预测以及合成路线筛选等的应用，有望重塑早期药物发现的流程，大大加速早期药物筛选的效率及成功率。 投资建议：确定性角度看好药明康德；成长性角度看好药明生物、药明合联、康龙化成、百奥赛图、及 AI制药领域龙头英矽智能、剂泰科技等；弹性角度看好 金斯瑞、昭衍新药、凯莱英、毕得、皓元医药等；边际修复建议关注泰格医药、诺思格等。 风险提示：行业政策风险，研发不及预期风险，审批不及预期风险，宏观环境波动风险 仅供内部参考，请勿外传 目录 3AI制药潜力释放，有望重塑医药未来图景2创新药全球化趋势明确，供需格局确立长期产业趋势 4风险提示海外需求持续叠加国内投融资持续回暖，推动行业估值修复1 仅供内部参考，请勿外传 仅供内部参考，请勿外传 5外需与内需向好推动行业估值修复 CXO板块发展阶段回顾： 1）国内CXO行业2018年起受益于海内外重磅药物品种涌现、国内政策支持及美国降息周期等多重有利因素 ，进入高速成长阶 段，板块业绩及估值双升， 2020年新冠需求进一步推高需求及估值水平。 2）2021年中至2023年，受国内新药研发监管审批政策收紧、本土商业化瓶颈显现、 地缘政治冲突加剧、美元加息周期开启、新冠需求消退等影响，行业需求下滑，业绩及估值双双进入调整期。 3）2024年初《生物安全法案》进一步加重产 业链脱钩担忧，板块估值进一步下滑至严重偏离基本面水平，部分龙头公司估值从此前高点的未来 12个月2-4xPEG下滑至不到0.5xPEG。4）2024年下半年 以来，随着美元降息预期走强、龙头公司订单 /业绩表现超预期、法案未能落地等因素驱动，行业估值开始修复。 2025年以来，随着市场对 《生物安全法案》 实质影响认知回归理性、头部公司业绩持续超预期、 CXO板块估值持续向基本面修复。后续随着 AI制药热度提升、创新药景气度延续，行业 beta持续向好。5） 26年受潜在加息预期、港股流动性收紧等因素影响、板块表现调整后进入再平衡阶段、估值趋近业绩导向。板块（ TTM）PE平均估值回升至约25x水平，12 个月前瞻市盈率在 15-20x，多数公司当前股价距 2027年1xPEG仍有较大空间。 数据来源：Wind（20260706），中信建投证券020406080100120140 0%100%200%300%400%500%600% 2019-01-04 2020-04-04 2021-07-04 2022-10-04 2024-01-04 2025-04-04 2026-07-04医疗研发外包(申万)沪深300医药生物(申万)PE（申万医药外包） 20Q2全 球疫 情爆 发， 美元进入降息周期； 20Q3起，海 外供 应 链 向国内转移，国内CXO 企业优势凸显 21H1板块业绩持续兑 现21年7月，CDE “以临 床价值为导向”政策出 台，引发行业订单下滑 担忧 22年2月，药明生物纳 入UVL； 22年9月，拜登政府鼓 励制造业回流，引发产 业链脱钩担忧22Q3起，美元进入加 息周期，板块持续下行 23H1新冠高基数业绩 持续承压；美联储持续 加息，全球医药投融资 下滑； 国内细分行业竞争加剧 逐渐进入价格战阶段24年1月，“生物安全 法案”迅速发酵，产业 链脱钩担忧加剧；板块 估值剧烈萎缩跌穿基本 面 24年9月，美联储开始 降息；“生物安全法 案”最终未获通过；龙 头公司业绩超预期，板 块估值启动开始第一阶 段修复25H1，板块业绩持续 向好，估值持续修复； AI制药行情以及国内创 新药BD高景气度驱动 CXO板块持续上行； 25H2-26Q1，26年 NDAA通过，含修改版 生物安全法案，仅康德 被纳入1260H 26Q2，板块基本面持 续走强，阶段性资金面 扰动加剧后，进入再平 衡阶段，估值调整回归 业绩导向CXO板块 受 益于海内 外大药物品种出现、国 内政策支持、美国降息 周期多重有利因素的推 动，进入高速成长阶段， 板块业绩及估值双升 仅供内部参考，请勿外传 国内需求持续复苏，海外市场整体稳健，重点赛道景气度延续 25H2国内投融资同比环比恢复明显，海外热点赛道订单延续增长势头。 23年受大订单影响和生物医药投融资影响，大部分公司常规业 务增速放缓，行业利润同比出现下滑。 24年行业头部企业海外新签订单恢复较好，地缘政治对部分大分子订单造成一定干扰，国内投融资 整体处于底部，内需持续承压； 25年受益创新药行业 BD持续火热，下游客户需求开始回暖， 25H2投融资同比环比恢复明显，地缘干扰退 潮。26H1板块基本面持续走强，阶段性资金面扰动加剧后，进入再平衡阶段，估值调整回归业绩导向。 •分板块来看，CDMO端订单相对增长稳健、受 AI影响相对有限；分阶段看，临床早期 CRO以及临床前服务订单数量恢复明显； •分药物类型来看： ADC、双多抗等二代IO赛道、及小分子领域的部分新药物形式（ GLP-1、小核酸、RAS等）需求延续高景气度； •价格方面供给端偏紧的临床前安评服务、及行业产能有限的新分子形式订单更具备弹性优势。 2026年行业表现持续修复，龙头公司加速增长。 2025年行业收入利润重回正增长， 25年板块总体收入、归母净利润、扣非归母净利润 分别同比增长为 13.5%、77.9%、33.0%。26Q1行业整体展现较好恢复势头，第一季度行业的收入、归母净利润、扣非归母净利润分别同 比增长为19.3%、6.1%、62.5%。2026年受到中东地缘政治对小分子为主的制药产业链影响、以及人民币持续升值影响，海外敞口较大的 CXO企业较过去三年面临更大的报表利润端冲击，高成长、利润水平更优秀的公司具备更好的调节能力。 我们认为，在海外敞口较高的公 司中，具备以下特征的企业： 1）产业技术壁垒、产能稀缺性及 2）高利润率的后期复杂新药物管线放量驱动的公司，有望在未来 1-3年展现 出更有韧性及成长性的利润端表现。 数据来源：Wind，中信建投证券注：行业数据包括药明康德、药明生物、药明合联、泰格医药、康龙化成、凯莱英、九洲药业、昭衍新药、药石科技、博腾股份、成都先导、美迪西、 博济医药、维亚生物、皓元医药、和元生物、药康生物、诺思格、普蕊斯、诺泰生物，其中季度数据不包括港股公司表：CXO板块增速统计（累计） 2022Y 2023Y 2024Y 2025Y 2026Y Q11HQ1-Q3Q1-Q4Q11HQ1-Q3Q1-Q4Q1H1Q1-Q3Q1-Q4Q1H1Q1-Q3Q1-Q4Q1 营业收入增速73.8%74.6%70.2%62.4%10.7%3.8%0.8%-2.1%-13.2%-11.7%-8.3%-4.0%14.1%14.8%13.9%13.5%19.3% 归母净利润增 速38.4%77.4%83.8%63.8%22.1%-1.1%-5.1%-16.1%-48.6%-34.9%-31.7%-24.5%118.0%72.9%63.0%77.9%6.1% 扣非归母净利 润增速100.5%103.1%109.9%89.8%8.5%-1.1%-4.2%-12.5%-34.4%-32.4%-31.8%-20.5%28.1%27.1%36.0%33.0%62.5% 6 仅供内部参考，请勿外传 7资金供给是 CXO景气的源头，融资回暖推动行业持续发展 CXO需求本质由创新药企业的可支配研发资金驱动。 大型药企依靠“营收×研发投入率 +现金储备”形成相对稳定的预算， Biotech则更 依赖“外部融资 +现金储备”。融资回暖后，资金沿“研发立项 —临床推进—生产放大—商业化”逐级传导，需求通常先体现于 CRO、再向 CDMO及上游工具扩散；因此，全球创新药融资与大药企研发投入是 CXO订单和业绩的核心指标。 数据来源：Wind，中信建投证券科研客户生命科学工具耗材 生物工艺设备 CRO/CDMOCRO CDMO大型药企 生物科技营收×研发%+现金储备 融资+现金储备 开发/生产%×营收+现金储备 产业客户 仅供内部参考，请勿外传 826H1 投融资回暖明显，展现复苏趋势 创新药投融资26年上半年显著回暖，带动海外需求加速复苏。 根据医药魔方数据，全球创新药投融资额在经历 23年调整后，24年小幅回 升至338.46亿美元，同比增长 24%；25年有所波动，全年融资 290.93亿美元，同比下滑 14%。进入26年，市场显著回暖， Q1融资86.74亿 美元，同比增长 13%；Q2融资115 ct ；申万电子化学品指数年内累计涨幅为 35.94%，跑赢 沪深300指数 /申万电子指数 36.84/14.32pct 。  半导体材料涨价原因：需求 高增、成本上升及地缘冲突三重共振 。首先， AI算力需求高增拉动半导体全产业链需求 ，全球半导体市场规模大幅增 长。WSTS预计 2026年全球半导体市场规模有望达 1.51万亿美元（同比 +89.9%），2027年达1.91万亿美元（ 同比 +26.6 %）。半导体材料需求直 接受益于下游晶圆厂扩产周期，且 AI浪潮大幅提升了上游材料消耗量。 2025年全球半导体材料市场销售额 732亿美元（同比 +6.8%），其中晶圆 制造材料销售额 458亿美元（同比 +5.4%），封装材料销售额 274亿美元 （同比 +9.3%）。其次，中东事件对全球供应链与能源成本 产生影响，能 源价格波动传导至化工原料与 部分电子材料 制造成本 ，红海航道扰动推 高国际物流成本 。例如，位于日本的全球硅片与光刻胶龙头公司因成本 等原因开启本轮涨价。 此外，由于供给端硬约束 +AI需求高增 ，金属价格 走强，算力金属集体涨价。 例如，受 化工品、算力金属等 原材料以及生 产成本上涨影响， 靶材、电子级氢氟酸等 产品涨价；受原材料出口管制 以及海外供应扰动 影响，六氟化钨 、氦气等产品价格出现上涨。地缘政 治或成为半导体材料定价的核心矛 盾，我们认为本轮涨价周期区别于以 往单纯需求拉动，部分材料呈现“管制触发 -产能断供 -价格跳涨 -传导加 速”的特征。  我国半导体材料企业国产替代持续推进。 2025年中国大陆 半导体材料 销 售额为 156亿美元（同比 +12.5%）。近年来，依托国家政策支持和市场 需求红利，我国 半导体材料行业进入快速发展阶段，国产替代进程持续 推进。国内材料企业产品技术水平和研发能力不断增强，从单一产品突 破向产业链配套完善逐步过渡，整体产业竞争力稳步提升 。随着全球半 导体供应链本土化、多元化布局趋势加深，我国 半导体材料行业 有望迎 来技术突破和市场 扩容的双重发展机遇。 此外，本轮下游高景气，叠加 海外龙头扩产速度较慢、受到原材料供应波动等影响，我国半导体材料 行业或迎来国产替代加速的关键窗口期。 投资建议  基于下游行业快速发展 、先进技术不断迭代以及国产替代大背景，我们 认为电子材料领域有望持续迎来发展良机。 1、受益于下游需求增长以及技术不断进步，全球半导体材料市场规模持 续扩大， 先进材料需求快速提升 。在多种关键半导体材料方面，我国企 业稳健布局产能与技术研发，竞争力与产销规模有望持续提升。 2、部分半导体材料及原料受益于涨价，下游高景气叠加海外龙头扩产速 度较慢、受到原材料供应波动等影响，我国半导体材料行业或迎来国产 替代加速的关键窗口期。  推荐：安集科技、鼎龙股份、江丰电子、雅克科技、彤程新材、沪硅产 业、德邦科技、 阳谷华泰 ；建议关注： 华特气体、联瑞新材、中船特气、 中巨芯、西安奕材、广钢气体、昊华科技等 。 风险提示  技术升级迭代的风险 ，下游需求复苏不及预期的风险 ，全球经济周期性 波动、国际贸易摩擦及不可抗力的风险 。 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 2 目录 半导体材料行业高景气，多个产品价格上涨 ................................ .............. 5 多个半导体材料进入涨价周期 ................................ ................................ ................................ ........ 5 2026年以来板块走势跑赢市场 ................................ ................................ ................................ ....... 6 半导体材料 涨价原因：需求高增、成本上升及地缘冲突三重共振 ........... 7 AI算力需求高增拉动半导体全产业链需求 ................................ ................................ .................... 7 地缘冲突引发供给侧冲击，上游原材料成本持续上行 ................................ ................................ 10 本轮涉及涨价的部分关键半导体材料 ................................ .......... ，关注质量类红利-260805", "source_label": "东方证券", "excerpt": "基础化工 |", "content": "基础化工 | 证券研究报告 — 行业深度 2026年8月5日 强于大市 相关研究报告 《化工行业周报 20260726 》20260726 《化工行业周报 20260719 》20260721 《化工行业周报 20260712 》20260713 中银国际证券股份有限公司 具备证券投资咨询业务资格 基础化工 证券分析师：余嫄嫄 (8621 )20328550 yuanyuan.yu@bocichina.com 证券投资咨询业务证书编号： S1300517050002 证券分析师：范琦岩 qiyan.fan@bocichina.com 证券投资咨询业务证书编号： S1300525040001 半导体材料涨价深度报告 需求高增、成本上升及地缘冲突三重共振 受需求高增、成本上升等影响， 2026年以来全球半导体材料掀起涨价浪潮 ， 海外部分龙头扩产较慢，或受关键原材料制约， 国内优秀材料企业有望 迎来 加速替代窗口 。 支撑评级的要点  半导体材料行业高景气，产品价格全面上涨 。2026年以来全球半导体材 料掀起涨价浪潮，且本轮涨价范围 已经由点到面从关键化工原料扩散至 制造全链条，覆盖硅片、电子特气、湿电子化学品、靶材、封装材料等 几乎所有核心品类，形成全产业链价格上行态势。 从二级市场表现来看， 2026年以来半导体材料板块 走势跑赢市场： 截至 2026年7月31日，申 万半导体材料指数年内累计涨幅为 47.19%，跑赢沪深 300指数 /申万电子 指数 48.09/25.57pct ；申万电子化学品指数年内累计涨幅为 35.94%，跑赢 沪深300指数 /申万电子指数 36.84/14.32pct 。  半导体材料涨价原因：需求 高增、成本上升及地缘冲突三重共振 。首先， AI算力需求高增拉动半导体全产业链需求 ，全球半导体市场规模大幅增 长。WSTS预计 2026年全球半导体市场规模有望达 1.51万亿美元（同比 +89.9%），2027年达1.91万亿美元（ 同比 +26.6 %）。半导体材料需求直 接受益于下游晶圆厂扩产周期，且 AI浪潮大幅提升了上游材料消耗量。 2025年全球半导体材料市场销售额 732亿美元（同比 +6.8%），其中晶圆 制造材料销售额 458亿美元（同比 +5.4%），封装材料销售额 274亿美元 （同比 +9.3%）。其次，中东事件对全球供应链与能源成本 产生影响，能 源价格波动传导至化工原料与 部分电子材料 制造成本 ，红海航道扰动推 高国际物流成本 。例如，位于日本的全球硅片与光刻胶龙头公司因成本 等原因开启本轮涨价。 此外，由于供给端硬约束 +AI需求高增 ，金属价格 走强，算力金属集体涨价。 例如，受 化工品、算力金属等 原材料以及生 产成本上涨影响， 靶材、电子级氢氟酸等 产品涨价；受原材料出口管制 以及海外供应扰动 影响，六氟化钨 、氦气等产品价格出现上涨。地缘政 治或成为半导体材料定价的核心矛 盾，我们认为本轮涨价周期区别于以 往单纯需求拉动，部分材料呈现“管制触发 -产能断供 -价格跳涨 -传导加 速”的特征。  我国半导体材料企业国产替代持续推进。 2025年中国大陆 半导体材料 销 售额为 156亿美元（同比 +12.5%）。近年来，依托国家政策支持和市场 需求红利，我国 半导体材料行业进入快速发展阶段，国产替代进程持续 推进。国内材料企业产品技术水平和研发能力不断增强，从单一产品突 破向产业链配套完善逐步过渡，整体产业竞争力稳步提升 。随着全球半 导体供应链本土化、多元化布局趋势加深，我国 半导体材料行业 有望迎 来技术突破和市场 扩容的双重发展机遇。 此外，本轮下游高景气，叠加 海外龙头扩产速度较慢、受到原材料供应波动等影响，我国半导体材料 行业或迎来国产替代加速的关键窗口期。 投资建议  基于下游行业快速发展 、先进技术不断迭代以及国产替代大背景，我们 认为电子材料领域有望持续迎来发展良机。 1、受益于下游需求增长以及技术不断进步，全球半导体材料市场规模持 续扩大， 先进材料需求快速提升 。在多种关键半导体材料方面，我国企 业稳健布局产能与技术研发，竞争力与产销规模有望持续提升。 2、部分半导体材料及原料受益于涨价，下游高景气叠加海外龙头扩产速 度较慢、受到原材料供应波动等影响，我国半导体材料行业或迎来国产 替代加速的关键窗口期。  推荐：安集科技、鼎龙股份、江丰电子、雅克科技、彤程新材、沪硅产 业、德邦科技、 阳谷华泰 ；建议关注： 华特气体、联瑞新材、中船特气、 中巨芯、西安奕材、广钢气体、昊华科技等 。 化剂。逻辑芯片预计将成为另一大主要贡献板块， 2026年增长 37%。其他 产品类别预计将以较为温和的速度扩张 ：微处理器 20%、模拟芯片 10%、分立半导体 8%、传感器 与光电子 3%。WSTS预测 2027年全球半导体市场 有望再增长 26.6%至1.91万亿美元 ，其中存储器 预计将再次 以32%的同比增长率 引领市场扩张 ，而逻辑器件 预计同比 增长 27%。AI系统的持续部署、 先进的计算基础设施以及各终端市场半导体含量的不断提升，有望为行业 持续发展势头提供支撑。 分区域来看， 受AI相关半导体需求集中以及云基础设施投资的推动， 2026年美洲市场预计 增长 112%， 亚太地区预计增长 87%，欧洲和日本则分别增长 58%和28%。WSTS预计 2027年所有地理区域都将 持续增长，其中美洲和亚太地区领跑。 图表 3. 2018 -2029 E全球半导体市场规模 资料来源： WSTS，中银证券 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 8 图表 4. WSTS预测摘要 资料来源： WSTS，中银证券 芯片产业 出现结构性供需缺口 ，产业涨价潮蔓延 。根据证券市场周刊， 在全球半导体产能扩张进程 中，先进制程供给增长 远低于需求增速，导致高效能芯片长期处于供不应求的状态。台积电 2026一 季报数据 显示，其先进制程（ 7nm及以下）占比维持在 74%的高位，受强劲 AI需求驱动， 3nm和 5nm产线满载，分别贡献了 25%和36%的营收。供给刚性与需求弹性之间的错位，导致全球半导体 有效产能利用率持续维持在 90%以上。行业供需紧平衡直接传导至产品价格 。根据TrendForce 数据， 2026年一季度 DRAM合约价环比上涨 90%-95%，NAND Flash 环比上涨约 60%，二季度预计继续上 涨58%-63%和70%-75%。此外，涨价正在向 更广泛的品类扩散 ，2026年初以来，国内外数十家芯 片企业密集发布涨价函，覆盖 MCU、NOR Flash 、功率器件等多个品类，涨幅普遍在 10%-80%。 全球半导体资本开支 持续扩张。SEMI在最新发布的 《 300mm晶圆厂展望报告》 （ 300mm Fab Outlook ） 中指出，全球 300mm晶圆厂设备支出预计 2026年将增长 18%至1,330亿美元， 2027年将增长 14% 至1,510亿美元。 2027 -2029年全球 300mm晶圆厂设备投资预计将广泛覆盖主要半导体制造区域， 反映了先进制程扩张、 memory产能增加 以及政策支持下的供应链本地化等多种因素的综合影响。中 国大陆、中国台湾 地区、韩国和美洲地区在此期间均将迎来大规模投资，而日本、欧洲与中东、东 南亚地区也将从较小的基数继续扩大投资。 图表 5. 2024 -2029E全球 300mm晶圆厂设备 资本开支 资料来源： SEMI，中银证券 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 9 全球半导体材料 市场销售额创历史新高 。根据 SEMI《材料市场数据订阅》报告， 2025年全球半导 体材料市场销售额为 732亿美元，同比增长 6.8%，晶圆制造材料和封装材料两大板块均实现增长， 反映出更高的工艺复杂度、先进制程需求以及高性 能计算和高带宽存储制造领域的持续投资。 SEMI 数据显示， 2025年晶圆制造材料销售额 为458亿美元，同比 增长 5.4%，其中光刻相关材料（包括光 掩膜、光刻胶及辅助材料）以及湿化学品均实现强劲的双位数增长，因为更高的工艺强度和更严苛 的光刻要求持续推动材料消耗量的增加 ；2025年封装材料销售额 为274亿美元，同比 增长 9.3%，其 中基板和键合线引领增长，键合线受到 金价上涨的支撑，先进基板则受益于强劲需求。 分地区来看， 中国台湾地区连续第 16年保持全球最大半导体材料消费地区位置， 2025年销售额达 217亿美元； 中国大陆 以156亿美元的销售额排名第二 ；韩国以 112亿美元销售额排名第三。除欧洲外，所有地 区均实现同比增长，中国和北美在主要地区中增长最强。 图表 6. 2021 -2025年全球半导体材料市场销售额 图表 7. 2025年全球分地区半导体材料市场销售额 资料来源： SEMI，中银证券 资料来源： SEMI，中银证券 展望后市 ， 半导体材料 市场需求增量确定性强 。 1）半导体材料 需求直接受益于 下游晶圆厂扩产周期 。 根据 Yole Group ，从半导体产业价值链来看 ， 晶圆制造占据 50%的价值 ，晶圆制造材料供应商占 4%。 下游晶圆厂处于大规模扩产周期，需要大量采购设备，设备到位后需持续消耗材料， 新增产能持续 释放为半导体材料 市场需求 提供了确定性增量 ，行业景气度具备持续性。 根据中研网以及 SEMI，我 国是全球新建晶圆厂数量最多的国家 ，近年国内新增了大量 8英寸和 12英寸晶圆厂， 12英寸晶圆 厂市场份额已较数年前大幅提升。 此外，先进制程加速建设放大了 材料需求 ——随着芯片线宽持续 缩小、结构复杂度显著提升，制造过程对高品质半导体材料的需求呈指数级上升。 2）AI浪潮大幅 提升上游材料消耗量。 根据中研网， AI服务器需要高性能的 GPU、CPU、TPU和存储等硬件支持， 对芯片的处理速度、容量和带宽都提出了更高要求，直接推动先进封装技术发展 以及 HBM需求增 长，打开了半导体材料的增量空间。 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 10 图表 8. 2025年半导体 产业价值链 资料来源： Y ole Group ，EETimes，中银证券 地缘冲突引发供给侧冲击 ，上游原材料成本持续上行 中东事件对全球供应链与能源成本 产生影响。1）能源价格波动传导至化工原料与 部分电子材料 制造 成本。中东局势紧张导致国际原油、天然气价格大幅波动。 美国能源信息署（ EIA）2026年6月发 布的短期能源展望（ STEO）报告显 示，受霍尔木兹海峡航运中断影响， 2026年布伦特原油现货均 价预计为每桶 95美元，其中 5月布伦特原油现货价格均价为每桶 107美元，6-7月均价预计维持在 每桶 105美元左右 。6月中下旬以来，受美伊停战谈判进展影响，国际油价出现回落 。能源价格上 涨直接推升半导体材料制造成本：一是 硅片、电子特气 等材料生产属于高耗能行业， 海外企业能源 成本大幅上涨， 而国内企业 积极布局于低电价区域以控制成本；二是光刻胶、 CMP抛光液等 材料部 分上游原材料价格与原油价格高度联动，油价上涨通过产业链传导至半导体材料端 。例如，根据百 川盈孚数据 ，2026年光刻工艺核心耗材丙二醇单甲醚 醋酸酯（ PGMEA）价格最高于4月涨至 1.42 万元 /吨左右， 较年初 7,600元/吨的低点上涨 86.84 %。根据环球网 的信息，杜邦、陶氏、 LG化学已 发出提价通知 ，PGMEA价格预计上涨 40%-50%，稀释剂成品厂商计划 4月出货产品提价约 20%。 能源价格上涨对生产成本形成直接压力 ，在当前能源 成本高企的背景下， 材料企业通过涨价向下游 传导成本压力成为必然选择。 2）红海航道扰动推高国际物流成本 。根据百运网， 中东地缘冲突引发 红海航运危机，绕行好望角使亚洲至欧洲单程航程增加约 10-14天、成本上涨30%-50%。物流成本 上升直接传导至半导体材料终端售价，成为推动本轮涨价的重要外部因素。 从国内数据来看， 国家统计局 2026年6月发布的最新数据显示， 2026年5月全国工业生产者出厂 价格指数（ PPI）同比上涨 3.9%，环比上涨 0.5%，PPI同比涨幅较 4月扩大 1.1pct，连续 8个月环比 上涨。受国内部分行业需求增加以及国际大宗商品价格波动传导等因素影响， 2026年5月我国工业 生产者价格继续上涨，其中计算机通信和其他电子设备制造业价格呈上升趋势 ，同环比分别上涨 2.1%/0.6% 。 仅供内部参考，请勿外传！ 2026年8月5日 半导体材料涨价深度报告 11 图表 9. 2021-2026年7月WTI及布伦特 原油期货价格 图表 10. 202 5-2027E布伦特原油现货价格及全球库存变化 资料来源： 同花顺 iFinD，中银证券 资料来源： EIA，中银证券 图表 11. 2021 -2026年7月NYMEX 天然气期货价格 图表 12. 202 6年丙二醇甲醚醋酸酯（ PGMEA/PMA ）价格 （截至 2026.7.6） 资料来源：同花顺 iFinD，中银证券 资料来源： 百川盈孚 ，中银证券 供给端硬约束 +AI需求高增 ，金属价格走强 ，算力金属集体涨价 。根据万得数据， 2025年初 /2026 年初至2026年7月30日，LME铜价分别 +56.78 %/+10.74 %至13,798.50美元 /吨， LME铝价分别 +26.26%/+5.69%至3,193.00美元 /吨。此外，钨、钼、锡、钽、铟、锗 等战略金属轮番走强。 钨金属 方面，根据中钨在线数据， 2026年7月28日钨粉价格为 975元/千克，较 2025年均价 +98.16%。钼 金属方面， 根据中钨在线， 2026年1-7月我国多数钼制品均价同比均上涨 ，其中钼精矿均价 4,697 元/吨度（同比 +29.64%），钼铁均价 29.92万元/吨（同比 +27.68%）。根据上海钢联数据， Mysteel 锡锭现货价格从年初的 33.23万元/吨涨至 2026年 0亿美元】财联社8月6日电，高盛在最新发布的全球印刷电路板（PCB）和覆铜板（CCL）行业报告中，大幅上调人工智能（AI）服务器相关市场规模预测。该行预计，全球AI服务器PCB市场将在2027年达到375亿美元，较此前预测上调38%，2028年进一步增至840亿美元；CCL市场2027年预计达到221亿美元，上调18%，2028年则有望增至480亿美元。这意味着，2026年至2028年，AI服务器PCB和CCL市场规模的复合年增长率将分别达到148%和161%。 与传统服务器周期不同，本轮增长不仅来自服务器出货量增加，还受到PCB层数提高、高阶HDI（高密度互连）渗透、CCL材料升级，以及整机柜内部PCB使用量增加等多重因素推动#文字观点", "publish_time": "2026-08-06 22:10", "tags": ["文字观点"]}, "attachment:files/0805评级日报.pdf": {"id": "attachment:files/0805评级日报.pdf", "kind": "attachment", "title": "0805评级日报", "source_label": "其他", "excerpt": "PCB制板产能已经打满，但订单每月都在增长；晶圆 探针进入多家主要厂商，目前满负荷生产——080… xuangut ong.com.cn 2026/08/05 16:34 【ATE测试板进入量产】 从2025年下半年开始，ATE测试板已成为公司PCB制 板业务中占比较高的业 务，部分客户已经进入量产阶段。", "content": "PCB制板产能已经打满，但订单每月都在增长；晶圆 探针进入多家主要厂商，目前满负荷生产——080… xuangut ong.com.cn 2026/08/05 16:34 【ATE测试板进入量产】 从2025年下半年开始，ATE测试板已成为公司PCB制 板业务中占比较高的业 务，部分客户已经进入量产阶段。ATE领域客户PCB制 板层数高，厚径比大，部分 订单用到高速板材及高阶HDI，产品价值高，与珠海板厂定位高度契合，越来越多 的ATE客户把打样及批量订单交给公司。目前单个客户收入占总体营收比重仍不 大，但呈逐渐上升趋势。 【PCB制 板产能满产积压】 PCB制 板业务订单每月呈较快增长态势，部分瓶颈工序产能已经满产，订单有 所积压，相关扩产设备正在添置中。公司将结合订单增长的需求加快产能的完全释 放。 【LED领域阶段性承压后迎来大额订单】 2025年至今年一季度，公司LED领域部分主要客户因阶段性产能消化和技术路 线选型，对测试设备新增采购需求有所减少。但公司表示，LED先进显示领域市场 需求持续增长的长期逻辑没有改变，目前公司已公告与兆驰股份签订大额订单合 同，后续LED将有更多主要厂商进入设备采购阶段，公司争取承接更多订单。 【在手订单充足，产能满负荷运转】 今年以来，公司主要在售产品的市场需求旺盛，景气度持续上升，目前在手订 单较为充足，产能利用率达到满产状态，生产计划安排紧凑，产线排产周期拉长。 【新增产能已按规划分阶段投产】 公司加快产能扩张速度以应对下游客户需求的持续增长，新增产能已按规划分 阶段投产，产能规模持续提升。朗读 全屏 手机 浏览 保存 设置 帮助 退出 【光通信芯片领域布局硅光晶圆测试】 光通信芯片测试是公司产品应用领域之一，公司目前销售适用于PD/APD/VCS EL等芯片测试的探针测试一体机、分选机、AOI等设备，适用于硅光晶圆测试的12 吋全自动高精度晶圆探针台设备。公司看好该领域长期发展前景，将持续推进技术 储备与客户验证。 【集成电路领域已进入多家主要厂商试机验证】 公司正加快推进集成电路领域的晶圆探针台导入验证工作，2025年至今已进入 多家国内集成电路主要厂商开展试机验证。由于高端晶圆探针台市场的定制化需求 和验证要求高等特点，验证周期较长，公司争取加快推进项目进展，为后续承接相 关订单打下基础。 【柔性传感器进入批量出货】 公司表示，从十几年前开始研发柔性传感器，积累了丰富的Know-how以保证 产品的重复性、稳定性、一致性，现阶段已进入批量出货阶段，能够更好、更快地 为客户提供产品及个性化解决方案。柔性传感器收入近年来不断提升，涵盖汽车、 医疗健康、具身智能、消费电子等多个领域，已形成较为稳定的应用领域及市场需 求。 【威晶光电产能快速爬坡】 威晶光电主业为半导体激光器、光电子器件的研发、设计、生产、封装和销 售，具备TO、TOSA、蝶形等成熟产品封装工艺能力，服务于激光传感、光纤传 感、光谱检测、气体检测等关键领域。受益于国内燃气安全行业市场需求激增以及 光谱检测、光纤传感等领域需求增加，目前公司产能正处 卡\"淡 季不淡\"，7月销量发布在即，龙头业绩与估值双升逻辑延续 。 乘用车：本周7月主机厂产销/交付数据陆续披露 ，仍呈现\"内需淡季承压、出口强劲超预期\"特征。乘联分会预估7月狭义乘用车零售约 152万辆，其中新能源零 售约98万辆、渗透率64.5%创月度新高；受去年末需求透支及盛夏高温暴雨影响 ，内需悲观预期延续 price-in。出口端亮点纷呈：比亚迪 7月销售41.9万辆（同比 +21.8%），其中海外17.98万辆、同比+124.3%，方程豹同比+190.6%；奇瑞集团27.7万辆（同比+23.3%），成为首个单月出口破 20万辆的中国车企，新能源 12.9万辆、同比+97.5%；吉利25.0万辆连续5个月同环比双增，出口10.67万辆同比+202%再创新高，极氪同比+111%；零跑交付10.1万辆（同比+102%），成为 首个月销破10万的新势力。小鹏7月交付3.8万辆（同比+4%），环比小幅回落主因 MonaL03产能供应受限，随产能爬坡后续有望重回上行通道 。我们维持前期观 点：内需悲观预期已充分定价 ，8月进入中报密集披露期 ，Q2业绩兑现和Q3开始的预期将决定行情持续性；结构性 α继续看好乘用车出口超预期 +高端新能源加速 起量，估值空间看好物理 AI重构成长新范式。 商用车：持续推荐出海龙头中国重汽 、AI电力龙头潍柴动力 、客车出口龙头宇通客车 。6月重卡批发销量11.5万辆、同比+18%，上半年累计66万辆、同比 +22%创近五年新高，\"淡季不淡\"验证报废更新政策与出口共振逻辑； 7月重卡销量（即将发布）有望延续稳健，预计批发销量约10万辆、同比+20%左右，其中出 口维持4万辆左右高位（6月出口同比+35%）。中国重汽本周调研披露上半年出口销量占比已超总销量一半 ，重汽国际连续21年保持行业出口第一 ，出海龙头地位 持续夯实；潍柴动力数据中心大缸径发动机量价齐升逻辑不变 ，AI电力第二成长曲线持续兑现 。客车方面，上半年大中客车出口近 3万辆、同比+12%，宇通7月 产销快报即将披露 ，看好出口交付旺季下 Q2业绩兑现及下半年弹性 ，中欧贸易风险释放后胜率 /赔率依然突出。 物理AI：1）机器人主线\"量产节奏+资本化\"双催化落地。特斯拉Q2财报进一步明确Optimus量产路径：弗里蒙特工厂 ModelS/X产线已停用，正在安装 Optimus第一代产线、预计今年晚些时候投产 ，首批产品将投入\"Optimus学院\"采集训练数据；马斯克直言人形机器人是公司史上最难的量产爬坡 ，2026年资本开 支预计超250亿美元，量产元年。国内侧，宇树科技7月30日公告启动发行： \"人形机器人第一股 \"上市有望引发具身智能板块价值重估；智元启动赴港上市流程 ， 优必选年内人形机器人订单累计突破 6.3亿元。后续看，8月19-23日世界机器人大会将在北京亦庄举办 ，成为下一个密集催化节点 。我们建议关注特斯拉链高胜率 、 技术迭代升级方向 、具备预期差的低估值 ，以及宇树等具备放量能力的国产整机链 。2）智驾板块核心催化渐近：特斯拉监督版 FSD有望获批；Robotaxi马斯克称 8月奥斯汀车队规模将翻倍 ，海外商业化规模部署提速 。智驾向高而行的中长期趋势依旧清晰 ，看好L3/L4产业趋势下增量部件及解决方案供应商 。 推荐组合：江淮汽车 、潍柴动力、中国重汽、宇通客车、金龙汽车、小鹏汽车、禾赛、吉利汽车、隆鑫通用、贝斯特、三花智控。 4 下载日志已记录，仅供内部参考 下载日志已记录，仅供内部参考 本周：行业 指数上涨 4.98%，子板块中商用车板块涨幅领先 2026年7月27日-7月31日，SW汽车行业+4.98%；子板块中 ，乘用车、汽车零部件 、商用车分别+7.04%、 +3.34%、+11.75%。 资料来源：Wind，中信建投图表：汽车行业主要指数走势 61000012000140001600018000200002200024000 45005500650075008500950010500 2026-05-19 2026-05-21 2026-05-23 2026-05-25 2026-05-27 2026-05-29 2026-05-31 2026-06-02 2026-06-04 2026-06-06 2026-06-08 2026-06-10 2026-06-12 2026-06-14 2026-06-16 2026-06-18 2026-06-20 2026-06-22 2026-06-24 2026-06-26 2026-06-28 2026-06-30 2026-07-02 2026-07-04 2026-07-06 2026-07-08 2026-07-10 大模型定价体系变化——模型从价格走向价值竞争\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：大模型 API 背后对应高额推理算力成本，Coding、Agent、长上下文和多模态任务单位 Token 消耗远高于普通问答，低价策略难以长期持续；国产开源大模型进一步引领算力 ROI 转正速度，DeepSeek-V4-Flash 后训练调优的极致性价比与 Agent 能力飙升、Kimi K3 综合评测跻身全球一梯队。\u003c/li>\n\u003cli>今天出现的催化/验证：DeepSeek 官方称将“近期整体上调API服务定价，预计涨幅较大”；当前 V4-Flash 缓存命中/输入/输出价分别为 0.02/1/2 元/百万 Token，V4-Pro 为 0.025/3/6 元。\u003c/li>\n\u003cli>对应证据来源：11:35 华创计算机帖子、13:56 DeepSeek 官方消息帖子、AI 算力/大模型主线证据包概括。\u003c/li>\n\u003cli>\u003cstrong>主线2：国产算力/半导体自主可控——最大空头出清，反弹看 fab\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：中美科技指数最大空头出清，国产区反弹顺序为 fab 先行、后 AI 芯片、再设备；半导体自主可控正从成熟制程替代迈向先进制程突破；国产区核心 FAB 为长鑫科技、华虹宏力、中芯国际。\u003c/li>\n\u003cli>今天出现的催化/验证：华虹已“两根大阳线”，国产区确认度提高；寒武纪 26Q1 营收+160%、归母+185%、经营现金流上市以来首次转正；微导纳米被点名为国内 ALD 设备龙头，先进制程与存储扩产核心受益。\u003c/li>\n\u003cli>对应证据来源：07:45 华鑫电子帖子、07:45 hcdx 帖子、08:10 国金通信帖子、半导体/先进封装主线证据包概括。\u003c/li>\n\u003cli>\u003cstrong>主线3：PCB/CCL——交易进入出货落实轨道\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：TAM 框架新增三大领域——ASIC（谷歌 TPU 等）、CPU 和光模块，增厚市场空间；电子布涨价未停止，普通布看供给约束，特种布关注二代布和 T 布结构性弹性；二代布需求由英伟达 Rubin 及谷歌 TPU V8/V9 等平台拉货带动。\u003c/li>\n\u003cli>今天出现的催化/验证：高盛大幅上调 AI 服务器 PCB 和 CCL 预测；景旺电子金湾工厂调研显示 Q3 算力板业务开始放量、26/27 年算力板收入预期上修、光模块 mSAP-SLP 产能供不应求。\u003c/li>\n\u003cli>对应证据来源：15:40 申万宏源帖子、07:44 电子布帖子、12:38 招商电子帖子、22:10 高盛消息帖子。\u003c/li>\n\u003cli>\u003cstrong>主线4：光通信/CPO——硅光全栈与测试仪器卡位\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：全硅光方案不依赖 EML，在当前 EML 供应紧张环境下体现供应链优势；光模块不缺订单，缺的是长期核心供应能力。\u003c/li>\n\u003cli>今天出现的催化/验证：海光芯正新增两家北美 NASDAQ 上市公司合作伙伴，合作开发 800G、1.6T 硅光模块及 NPO、CPO 产品，当前推进顺利；联讯仪器在 800G 到 1.6T、3.2T 再到 CPO 时代均有核心卡位。\u003c/li>\n\u003cli>对应证据来源：19:24 国泰海通通信帖子、08:24 联讯仪器帖子、07:48 FCC 点评帖子。\u003c/li>\n\u003cli>\u003cstrong>主线5：宏观与黄金——黄金宏观压制极值或已过\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：美债问题关注再起，压低美债收益率迫切性提升（7 月 9 日 30 年期、7 月 22 日 20 年期美债拍卖正尾差为近半年首次）；6、7 月经济数据全面降温，宏观压制极值已过。\u003c/li>\n\u003cli>今天出现的催化/验证：7 月小非农（ADP）+4.4 万，显著不及市场约 7 万预期，创 2 月以来最弱读数；COMEX 黄金期货站上 4300 美元。\u003c/li>\n\u003cli>对应证据来源：07:27 东吴金属帖子、07:27 GMF 市场追踪帖子、07:24 隔夜全球要闻帖子。\u003c/li>\n\u003cli>\u003cstrong>主线6：新能源/汽车——大储景气再验证，锂供需预测上修\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：国内政策方向确定，《新型电力系统建设“十五五”规划》提出到 2030 年独立储能顶峰 1.4 亿 kW/等效 4h；新能源利用率分 3 档差异化考核（85%/90%/95%）。\u003c/li>\n\u003cli>今天出现的催化/验证：7 月国内大储中标 16.5GW/47.1GWh、同比+83%，独立储能中标占比 81%；雅保将 2026 年全球储能电池产量预测由 800-1,000GWh 上调至 900-1,100GWh。\u003c/li>\n\u003cli>对应证据来源：09:31 长江电新帖子、22:45 雅保分析师会议精要帖子、新能源/汽车主线证据包概括。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>政策与反制：美国联邦通信委员会（FCC）计划限制中国光模块进入美国数据中心市场，专家认为该政策大概率经过长期内部讨论，并非无依据传闻；商务部公告 2026 年第 33 号，对装有外国系统软件的进口打印复印办公设备发起我国首例对外贸易国家安全调查；外交部回应“美国禁止进口中国产新型光收发模块”：坚决反对美方泛化国家安全概念，滥用国家力量打压中国企业。（来源：07:25、07:24、07:20 帖子）\u003c/li>\n\u003cli>AI 大模型定价：DeepSeek 官方宣布将“近期整体上调API服务定价，预计涨幅较大”。（来源：13:56 帖子）\u003c/li>\n\u003cli>半导体与被动元件：华虹两根大阳线，国产区确认度提高；太阳诱电 FY27Q1 大超预期，营收 939 亿日元（+10.7%）、营业利润 48 亿日元（+53.3%）、上调全年营业利润至 450 亿日元，AI 服务器 MLCC 订单爆发，利好洁美科技。（来源：07:45、07:28 帖子）\u003c/li>\n\u003cli>PCB/CCL：8 月电子布 1080、2116、7628 均价环比分别上涨约 17%—18% 至 13.25、12.7、10.1 元/米；高盛大幅上调 AI 服务器 PCB 和 CCL 预测。（来源：07:44、22:10 帖子）\u003c/li>\n\u003cli>光通信：海光芯正新增两家北美 NASDAQ 上市公司合作伙伴，合作开发 800G、1.6T 硅光模块及 NPO、CPO 产品；公司 2025 年自研硅光芯片实现批量量产，采用成熟 65nm 制程，全硅光方案不依赖 EML。（来源：19:24 帖子）\u003c/li>\n\u003cli>新能源/汽车：7 月国内大储中标 16.5GW/47.1GWh、同比+83%；福田汽车 7 月出口 2.06 万辆、同比+90.7%、环比+4.4%，单月销量创年内次高。（来源：09:31、08:29 帖子）\u003c/li>\n\u003cli>机器人：宇树科技发行价 150.8 元，对应约 600 亿市值；IPO 定价出炉，募集 60.99 亿元、超募 40%，是今年 IPO 超募幅度最多的公司。（来源：21:15、22:18 帖子）\u003c/li>\n\u003cli>其他：西门子能源 FY26Q3 燃机 GS 总订单 100 亿欧元、同比+62%，在手订单 730 亿欧元；荣昌生物公告 1H26 收入 58.5 亿元、同比+433%，归母净利润 47 亿元。（来源：07:28 帖子）\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>DeepSeek 具体调价方案以正式通知为准，关注涨价幅度与落地节奏。（来源：11:35、13:56 帖子）\u003c/li>\n\u003cli>周五非农数据：7 月 ADP 已显著不及预期，非农将验证经济降温是否延续。（来源：07:27 GMF 帖子）\u003c/li>\n\u003cli>科技反弹节奏：预计科技 9 月前还有一波行情，9 月底访美前谈判筹码大概率到位，率先利好 fab，后渗透至 AI 芯片与设备。（来源：07:45 华鑫电子帖子）\u003c/li>\n\u003cli>景旺电子：Q3 算力板业务放量，26/27 年算力板收入预期上修；光模块 mSAP-SLP 产能供不应求，H2 迎来放量。（来源：12
