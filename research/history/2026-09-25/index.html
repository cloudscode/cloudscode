、同期数据在C端AI产品表现突出。根据SensorTower数据，Muse上线首14天累计下载约283.4万次，单日下载最高达35.8万次。同期窗口ChatGPT、Sora、Claude、GrokBot分别为367.2万、222.6万、25.2万次、18.0万次。活跃度方面，海外iOS及安卓合计DAU于9月20日达到74.6万人，斜率增长陡峭。我们认为，当前数据展现生活类Agent的需求积极信号，后续需重点关注留存率、验证新增流量能否转化为持续使用。 #产品功能：高频场景集中生活交易类、后端虚拟机架构是差异化关键 1）功能闭环：包括邮件管理、网页助手、生活管理（订餐/酒店/机票/日程）、购物助手（比价/结账）、省钱助手（识别重复订阅）、目标执行者（目标拆解并持续跟进）等。早期高频需求主要集中于网购比价、寻找优惠及出行预订。 2）架构是差异化关键、注重隐私保护：每个用户拥有一台Meta云端独立运行的虚拟电脑（Muse Secure VM，含独立浏览器），可在用户离开后继续执行任务，实现7/24个人助理；Sentinel则负责独立审查对外行动、敏感操作需人工确认；与 Stripe Link 合作生成一次性卡号；Meta表示不会将数据提供给广告系统。 #商业化：短期订阅为主、长期关注交易抽佣打开天花板 1）订阅：免费版每周1亿 token（覆盖绝大多数日常任务），重度用户$20/月（5亿 token）、$100/月（30亿 token）两档补充。 2）交易抽佣：短期暂不考虑、当前第三方平台态度仍有分化。亚马逊明确封锁Muse，Shopify、沃尔玛、丝芙兰等则选择接入，长尾餐饮、票务及本地生活网站多数没有官方接口，依赖Computer Use。最重要的是证明用户愿意持续把任务交给Muse，只有形成稳定需求入口后，Meta才具备向商户收费的能力。#如何看待Muse的影响？1）Meta：有望借助社交分发拓展服务入口，从广告平台向个人服务与交易入口延伸，也能带动模型调用及算力需求。 2）第三方平台：长尾商户和支付、金融基础设施可通过接入Muse获得增量订单；Amazon等大型平台则面临搜索、推荐、广告和用户数据被上层Agent截流的风险，选择封锁或发展自有Agent。 3）硬件：Muse每用户对应持续运行的虚拟机、无头浏览器、高频API调用与多步任务编排，带来大量轮询、状态维持类新负载——GPU负责复杂推理，海量轻量任务可向CPU/高效推理芯片卸载，服务器CPU与内存有望出现结构性增量。 #国内映射：更适合平台原生Agent、关注腾讯微信\"小微\"灰测进展。我们认为，美国用户的线上需求分散在不同平台，大量核心功能仍保留在网页端，支付体系也具有较强的跨商户通用性，因此Muse可以通过云端浏览器完成任务并在用户授权后完成交易，无需逐一适配所有商户App。相比海外市场，中国市场移动化水平高，服务入口更集中、更封闭，更可能出现平台原生Agent，而不是完全独立于应用的通用Agent。#腾讯微信\"小微\"最贴近Muse入口逻辑、依托微信流量、小程序生态与支付体系完成闭环、2025年小程序GMV超9万亿、其中电商/餐饮/出行旅游/本地生活占比25%/17%/12%/7%。微信\"小微\"6月底开始测试、预计年底有望更大规模放量、当前重点提升任务执行准度以及丰富AI小程序生态，建议持续关注测试进展。#文字观点", "publish_time": "2026-09-25 08:51", "tags": ["如何看待Muse的影响", "文字观点"]}, "post:2026-09-25T18-54:d3b2bb0f28f2": {"id": "post:2026-09-25T18-54:d3b2bb0f28f2", "kind": "post", "title": "2026-09-25 18:54", "source_label": "帖子正文", "excerpt": "瑞银——美光科技（MU.US）2026财年第四财季（8月）前瞻：基本面持续收紧，市场辩论焦点转向周期持续性 核心逻辑：供需缺口持续扩大，资本回报与周期持续性成新焦点 尽管市场对美光的分歧仍集中在动量交易与周期长度上，但基本面仍在持续改善。最新渠道调研显示，供需缺口正进一步扩大并延续至2027年——具", "content": "瑞银——美光科技（MU.US）2026财年第四财季（8月）前瞻：基本面持续收紧，市场辩论焦点转向周期持续性 核心逻辑：供需缺口持续扩大，资本回报与周期持续性成新焦点 尽管市场对美光的分歧仍集中在动量交易与周期长度上，但基本面仍在持续改善。最新渠道调研显示，供需缺口正进一步扩大并延续至2027年——具体而言，DRAM订单履行率仍维持在约60%水平，服务器DDR比特需求同比增长约80%，服务器+存储SSD比特需求潜在增长超100%。由于美光已披露长期协议（LTA）细节且这些协议开始抑制短期上行空间，投资者关注点应转向需求持续性，尤其是资本回报。就后者而言，与《查找图书芯片法案》相关的股票回购限制将于2026年12月9日解除，我们预计回购将于2027财年第二财季（2月）以约200亿美元/季度的规模启动，并迅速攀升至400-500亿美元/季度，但公司大概率不会提前释放信号。因此，本次业绩电话会未必能提供回购新信息。对于2026财年第四财季（8月），我们预计营收约524亿美元（略超指引上限），毛利率约87.6%（高于指引约160个基点），并预计第一财季（11月）营收指引为580-590亿美元，毛利率环比再提升约100个基点。综上，我们再次上调盈利预测——主要反映周期持续性延长及更大规模回购，2027/2028/2029财年每股收益预期现分别为212/277/219美元，均远超当前市场共识。考虑到巨额回购，我们测算每股有形账面价值（TBV）将于2028财年末达到约360美元；即便假设周期另一面（自2028年下半年开始）现货定价下跌约80%，低谷期年化每股收益仍将高于美光下季度可能给出的年化指引——这一论断极具冲击力，我们认为市场终将予以奖励。我们维持1,625美元目标价（基于2029财年每股收益219美元折现至2028财年，仅约8倍远期市盈率），对应2028财年末约4.5倍TBV。重申买入评级。 第四财季业绩预览 • 营收与盈利：预计营收524亿美元、每股收益32.50美元，均超公司指引，上行空间几乎全部来自定价改善（与行业调研及管理层本季度表态一致）。 • DRAM：预计营收397亿美元（比特量环比+3%，均价环比+23%，成本/GB环比+3%）。其中DDR营收约362亿美元（比特量+2%，均价+24%），与第三季度行业合约价（含LTA）环比涨约26%的预判吻合。HBM营收约35亿美元（比特量+9%，均价+10%）。 • NAND：预计营收127亿美元（比特量环比+4%，均价+23%，成本/GB持平），与第三季度行业合约价涨约23%的预判一致。我们认为NAND定价将于2027年第三、四季度见顶，因长江存储正将大量新增产能（约4.5万片/月中的3万片）转向DRAM而非NAND，这将延长NAND定价周期。 • 毛利率：预计87.6%，较公司86%的指引高160个基点；预计11月财季毛利率环比再升100个基点至88.6%。整体毛利率预计在2027年第四财季至2028年第一财季期间达到约91%的峰值，对应2026/2027/2028财年毛利率分别为85.6%/90.2%/89.5%。 第一财季及2027财年指引前瞻 • 短期指引：我们预计营收/每股收益约593亿/37.04美元，因此美光可能给出营收580-590亿美元指引（市场预期570亿美元），毛利率环比提升约100个基点。LTA效应压制了综合均价涨幅，但我们仍预计综合均价录得高个位数增长（现货市场均价环比+10%被LTA抵消）。 • HBM与算力链：2027财年HBM比特出货量预估约117.2亿Gb（较此前微上调）。尽管英伟达Rubin Ultra规格调整——首款VR300 GPU仅采用384GB HBM4（8-Hi x 24Gb x 8），后续版本于2027年三季度转向512GB HBM4E（8-Hi x 32Gb x 8），低于此前768GB的预期——但有限HBM供应可分摊至更多GW级机架出货，形成对冲。同时，供应商正重新扩大HBM与DDR的溢价（自4月持续强调），推动2027财年综合HBM均价同比涨约76%，其中HBM4达约30美元/GB，HBM4E约33美元/GB。 • 供给格局：我们的预测已纳入长鑫存储（CXMT）的供应增长（其DRAM比特份额将从2025年的7%升至2027年的9%），但鉴于其安装、良率及技术差距，市场对产能扩张的担忧有些过度。整体行业DRAM至少在2028年第二季度前将维持供不应求。 • 全年指引：美光通常不发布全年营收指引，但可能给出某种底线预期（我们模型为2,821亿美元），并暗示2027财年毛利率将逐步走高。 • 资本开支：2027财年资本开支预计约510亿美元（高于此前预估），但隐含资本密集度仍仅低双位数，处于极低水平。 • 资本回报：美光可能泛泛提及资本回报/回购，但我们认为公司不会提前预告12月9日限制解除后的回购计划。预计回购启动规模为约200亿美元/季度，至2027财年末升至近500亿美元/季度。 估值与目标价 我们维持1,625美元目标价（不变），基于约8倍NTM市盈率（此前为11倍）乘以2029财年每股收益预估219美元，再以约12%的股权成本（CoE）折现至2028财年，隐含2028财年每股收益现值约195美元。我们锚定2029财年每股收益，因其最能反映LTA框架下美光穿越周期的盈利韧性——到该时点，我们的模型假设存储行业进入温和下行周期，但LTA仍托底盈利基础。 关键预测调整 • 第四财季：营收上调至524亿美元（原515亿），每股收益上调至32.50美元（原31.94），分别较市场预期高3.9%和4.3%。 • 远期盈利：2027/2028/2029财年每股收益分别上调至184.19/274.97/219.15美元（原184.89/265.65/165.37），全面碾压市场共识（2027财年共识156.46美元）。 主要风险 存储行业强周期属性；若宏观经济恶化导致需求破坏或ASP跌幅超预期，股价存下行风险；技术迁移延迟可能影响供应释放节奏；AI adoption加速或供应延迟则可能带来上行惊喜。#文字观点", "publish_time": "2026-09-25 18:54", "tags": ["文字观点"]}, "post:2026-09-25T19-00:0ab8777fc2bd": {"id": "post:2026-09-25T19-00:0ab8777fc2bd", "kind": "post", "title": "2026-09-25 19:00", "source_label": "帖子正文", "excerpt": "大摩——全球洞察：绘制AI变革速率图谱——从建设铺开到广度扩散 摩根士丹利发布第六版全球AI股票映射报告，覆盖约3,600只全球股票。报告指出，AI投资主线正进入新阶段：从集中于\"赋能者\"（Enablers）的交易，转向更广泛、呈杠铃型（Barbell）的机会组合——一端是精选的基础设施赋能者与早期", "content": "大摩——全球洞察：绘制AI变革速率图谱——从建设铺开到广度扩散 摩根士丹利发布第六版全球AI股票映射报告，覆盖约3,600只全球股票。报告指出，AI投资主线正进入新阶段：从集中于\"赋能者\"（Enablers）的交易，转向更广泛、呈杠铃型（Barbell）的机会组合——一端是精选的基础设施赋能者与早期软件企业，另一端是新兴的AI采用者（Adopters）。历史上每一轮计算周期均呈现半导体→基础设施→软件/服务的超额收益轮动规律，但本轮周期因AI资本开支规模空前且电力等瓶颈制约，市场领涨格局不会出现过往那种线性交接。摩根士丹利建议，在过渡期采取杠铃策略：1）持有解决数据中心关键瓶颈的电力相关标的；2）在半导体/基础设施领域保持精选；3）扩大对早期软件赋能者与AI采用者的敞口。 五大核心洞察 一、利润率改善尚未完全反映于采用者的远期盈利预测 市场一致预期显示，高AI关联度采用者（AI对投资逻辑具\"显著\"至\"核心\"影响）在2025-26年预计实现460个基点的EBIT利润率扩张，幅度小幅领先标普500，且近乎MSCI ACWI（全球可投资市场指数）均值的两倍。然而这一优势在后续年份迅速消退——2026-27及2027-28年采用者的预期利润率扩张收敛至与 broader market 持平。换言之，分析师虽已计入近期的利润率提振，但尚未对AI驱动的生产率增益给予持续化、复利化的定价。摩根士丹利认为，AI带来的生产力提升将比当前一致预期更持久，随着效益在损益表中逐步显现，采用者的远年期盈利存在上行惊喜空间。 二、盈利动量正从赋能者向采用者扩散 过去两年，赋能者的一致预期NTM（未来12个月）EPS增长逾一倍，动能最强；但采用者的NTM EPS同期亦录得约70%的跃升，跑赢大盘。过去一年，随着采用者盈利预期加速上修，与赋能者的分化进一步扩大。这种基本面格局构成了杠铃策略的底层逻辑：精选赋能者盈利动能依旧强劲，而AI效益向公司报表的转化正将动量延伸至采用者阵营。 三、估值分化改善采用者端的风险收益比 尽管精选赋能者因更成熟的AI建设敞口仍享有估值溢价，但采用者估值在过去一年已显著重置。高关联度采用者的中位数远期市盈率（Forward P/E）已降至18倍，与MSCI World基本持平，远低于赋能者的22倍。摩根士丹利认为，在AI采用的基本面红利（利润率与盈利）初露端倪但尚未完全嵌入远年期预期的当下，估值分化使采用者端构成了更具吸引力的建仓窗口。策略上应保留盈利持续性可支撑溢价的精选赋能者，同时增配基本面改善与估值优势并存的采用者。 四、AI敞口广度扩散，但深度集中 广度（Broadening）指从无AI敞口到具备正向敞口的公司数量增加，深度（Deepening）指既有AI主题公司关联度上升。新进入AI领域的公司日益来自传统科技板块之外——房地产、汽车、耐用消费品、交通运输及消费者服务等行业AI敞口广度显著扩张。然而，AI关联度加深（即成为投资逻辑核心）仍高度集中于软件、半导体、公用事业及媒体四大领域。AI正跨越科技圈向外扩散，创造庞大的潜在采用者池，同时在精选赋能者及既有高关联行业中持续深化。 五、市场对AI影响的\"量级\"（Materiality）定价日益精细化 单纯具备正向或负向AI敞口已不足以驱动超额收益，AI对投资逻辑的重要程度正成为相对表现的关键变量。在赋能者与采用者中，AI被视为\"核心逻辑\"（Core to Thesis）的公司，表现超越\"显著关联\"（Significant）者达107%；在受AI颠覆冲击的标的（AI Challenged）中，分化更为极端——AI构成\"核心威胁\"的公司跑输仅面临\"中度颠覆\"者约161%。随着周期演进，投资者对AI能否实质性重塑公司基本面的甄别能力显著提升，关联度分级（Materiality）已成为筛选标的的关键维度。 杠铃策略的具体实施路径 摩根士丹利通过 proprietary AI映射数据库，量化筛选出以下五类\"玩法\"（Ways to Play），构成当前阶段的推荐持仓框架： 1. 采用者：关联度正提升且获摩根士丹利超配评级的标的 筛选条件：AI采用者关联度由中等升至显著、AI采用敞口大于赋能敞口、获分析师超配（Overweight）评级、各地区市值前十大达标公司。覆盖亚太/日本（农业银行、HSBC、建设银行、中国银行、必和必拓、招商银行等）、欧洲（诺华、阿斯利康、AXA、渣打、拜耳等）、北美（苹果、礼来、沃尔玛、Costco、RTX、Welltower、AppLovin、Northrop Grumman等）。 2. 采用者：具备高定价权的标的 筛选条件：高定价权（能将AI带来的成本节约留存而非让渡客户）、AI采用关联度中等至核心、获超配评级。代表标的包括三星电子、富士康工业、Fast Retailing、平安保险、鸿海、Airbus、Rolls-Royce、苹果、Visa、MasterCard、可口可乐、宝洁、GE Aerospace、家得宝等。 3. 赋能者：电力瓶颈标的 涵盖带电外壳供应商（PSPs，如Terawulf、Hut8、Cipher Mining、Riot Platforms）、数据中心REITs（Equinix、新加坡电信）、离网发电（Solaris、Bloom Energy、GE Vernova、INNIO、Liberty Energy等）、储能（宁德时代、康明斯、三星SDI）、可再生能源开发商（NextEra、Clearway、Adani Green）、中游能源（Williams Companies）、数据中心电气设备（施耐德电气、Legrand、Rexel）、电网设备/变压器（HD现代电气、LS Electric、CG Power）、数据中心输电（Adani Energy）等。 4. 赋能者：具备持续性的半导体/硬件标的 覆盖GPU/ASIC（英伟达、博通、联发科）、云端半导体（Aspeed、Montage）、晶圆代工（台积电）、半导体设备（ASML）、晶圆基板与材料（Soitec）、ABF载板（Unimicron、Nan Ya PCB、三星电机、Ibiden）、MLCC（Murata）、后端半导体设备/OSAT（Advantest、Chroma、King Yuan）、电源（台达电）、存储（CXMT、SK海力士、三星电子、KIOXIA）、网络（Lumentum、诺基亚、古河电气）、硬盘（希捷）、材料（三井金属）等。 5. 赋能者：早期软件标的 覆盖基础设施软件（微软、Snowflake、Datadog、MongoDB、Dynatrace、Cloudflare）、安全软件（Palo Alto Networks、Crowdstrike、Okta）、SaaS应用（Atlassian、ServiceNow、Shopify、ServiceTitan、Navan）、模型提供商/消费应用（Meta、谷歌、亚马逊、Minimax、Z.ai、腾讯、阿里巴巴、美图）等。 技术周期过渡期的核心逻辑 • 历史规律与本轮回响：每一轮计算周期均遵循半导体→基础设施→软件/服务的超额收益序列。本轮周期中，半导体相对标普500已跑出约700个百分点的超额收益，基础设施约500个百分点，软件/服务约200个百分点。AI在美国家庭的渗透速度达移动互联时代的2倍——仅用3年即达50%渗透率，而半导体与基础设施的相对表现已达移动时代峰值的3-4倍。 • 硬件增长放缓触发交接的历史经验：过往周期中，当硬件渗透率成熟、增长降至个位数时，价值创造向软件/服务转移（如iPhone保有量达~6.5亿后，苹果服务收入在FY16-25年录得18%复合增速；全球智能手机渗透率达55%后Meta收入加速）。摩根士丹利团队预测超大规模厂商/新云（Hyperscaler/Neocloud）资本开支同比增速将从2026年的93%骤降至2028年的14%，暗示2028年前后硬件向软件/服务的切换窗口。 • 瓶颈的持久性：电力短缺是核心制约——摩根士丹利预测2026-28年数据中心将面临57GW的电力缺口（扣除\"通电时间\"解决方案后净缺口约33GW）。此外，劳动力约束与监管障碍（如社区反对已导致美国价值2,860亿美元的数据中心项目延期或取消）进一步拖慢建设节奏。因此，精选电力瓶颈标的（年初至今跑赢标普500但落后半导体约100个百分点、落后基础设施约40个百分点）仍有显著超额收益空间。 • 采用者端的价值创造时机：当前标普500市值的逾三分之一集中于市值前十的AI赋能者，而前十采用者仅占约五分之一。历史表明，新技术周期中最终崛起为最大市值公司的往往是技术采用者（如福特与通用借助流水线、软件企业借助互联网与iPhone平台）。当前约25%的标普500公司在业绩电话会中引用了AI带来的可量化效益，采用者利润率扩张的早期证据正在积累，一旦AI对收入与市场份额的拉动在损益表中确立，采用者交易将进入甜蜜点。 关键风险 • 上行风险：AI采用速度超预期、电力瓶颈更快缓解、软件/服务商业化提前放量、利润率扩张持续性超预期。 • 下行风险：资本开支减速早于预期、电力短缺恶化拖累AI部署、监管阻力加大、采用者盈利兑现不及预期、估值重评逆转。#文字观点", "publish_time": "2026-09-25 19:00", "tags": ["文字观点"]}, "attachment:files/中金公司-中国国际金融-AI应用参考(2)从WorkBuddy看生产力Agent发展-20260923.pdf": {"id": "attachment:files/中金公司-中国国际金融-AI应用参考(2)从WorkBuddy看生产力Agent发展-20260923.pdf", "kind": "attachment", "title": "中金公司-中国国际金融-AI应用参考(2)从WorkBuddy看生产力Agent发展-20260923", "source_label": "中金公司", "excerpt": "请仔细阅读在本报告尾部的重要法律声明 1 AI应用参考（ 2） ：从 WorkBuddy 看生产力 Agent发展 白洋 分析员 肖俨衍 分析员 魏萌 分析员 SAC 执证编号： S0080520110002 SFC CE Ref ：BGN055 yang3.bai@cicc.com.cn SAC 执证编号： S0080521010001 SFC CE Re", "content": "请仔细阅读在本报告尾部的重要法律声明 1 AI应用参考（ 2） ：从 WorkBuddy 看生产力 Agent发展 白洋 分析员 肖俨衍 分析员 魏萌 分析员 SAC 执证编号： S0080520110002 SFC CE Ref ：BGN055 yang3.bai@cicc.com.cn SAC 执证编号： S0080521010001 SFC CE Ref ：BIL686 yanyan.xiao@cicc.com.cn SAC 执证编号： S0080524070011 SFC CE Ref ：BVB685 meng.wei@cicc.com.cn 纵轴：相对值 （%） 股票 股票 目标 P/E (x) 名称 评级 价格 2026E 2027E 腾讯控股 -H 跑赢行业 666.00 12.4 11.3 阿里巴巴 -H 跑赢行业 172.00 18.0(a) 11.8(a) 阿里巴巴 -US 跑赢行业 178.00 17.9(a) 11.8(a) 标有(a)的数值所对应的年份为本列顶部所示年份之后的一年 中金一级行业 ：科技 资料来源： Wind，彭博资讯，中金公司研究部 ⚫ 传媒互联网 | AI应用参考（ 1）：从 Meta Muse 探讨C端 Agent路径 (2026.09.17) ⚫ 传媒互联网 | 线上平台 2Q26回顾及展望：办公 Agent或成 共识发力方向 (2026.09.16) ⚫ 腾讯控股 -H | Hy4 preview 开源发布，生产力场景深化 (2026.08.28) ⚫ 阿里巴巴 -H | Qwen3.8 -Max发布；全球云计算演绎重估逻 辑 (2026.08.07) ⚫ 腾讯控股 -H | Hy3正式发布，模型能力再进一步 (2026.07.07) 观点聚焦 投资建议 WorkBuddy 推出以来数据反馈较好， 阿里、字节也于近期 加速整 合追赶。 我们认为 B端Agent长期潜力较大 ，关注具备先发优势 和生态壁垒的 腾讯、云与模型双强的 阿里，以及字节的竞争。 理由 生产力 Agent是AI发展的又一个重要方向， 腾讯占据先发。 当前 AI发展经历 先泛化（Chatbot）、再聚焦 （编程 Agent）、然后又泛 化（生产力 Agent）的阶段，过程中 逐步清晰用户价值的落点； 用创新扩散曲线来看， 相比编程Agent，生产力 Agent是从早期使 用者跨越到早期大众的关键一跃。 当前腾讯领先，字节与阿里均 在加速整合追赶 ，据易观分析， 26年6月WorkBuddy PC端月访 问量超第二名字节 TRAE与第三名阿里 QoderWork 之和。短期 WorkBuddy 用巧劲领先对手：产品节奏快（低门槛） 、模型接入 快（API开放度高） 、生态开放快（自有产品 MCP互通）。 往未来看：一个核心、横纵发展 。1）核心：Agent产品智能力 提升涉及 多维竞争 （模型、上下文、 Harness），腾讯不以模型智 能上限提升为唯一目标 、综合能力强， 反而可能在考验综合能力 的Agent产品侧具备结构性机遇 ；2）横向拓生态： 我们认为， Workbuddy 有望成为连接旧时代互联网产品与新时代 AI产品的通 道，打通腾讯存量的产品矩阵 ；3）纵向做深 企业服务 ：我们认 为，Workbuddy 有望成为 “尖刀型产品 ”，助力腾讯云客户拓展 与维护。参考早期 PC的发展， 泛生产力 Agent有潜力成为综合 Agent入口，当前正是 PMF验证+平台标准建立 的关键阶段。 市场空间判断：长期潜力 被低估。谈及办公 Agent，市场多以 Office甚至WPS等办公软件 作为对标参考 ，市场空间 较为有限； 然而，我们认为 从一横一纵两个发展方向来看：横向拓展生态， 有望从办公场景切入到更大消费级的市场 ；纵向做深企业服务， 有望助力腾讯 撬动AI时代万亿元级云市场 的份额。 盈利预测与估值 我们维持相关公司的盈利预测和目标价 。 风险 产品竞争加剧风险 ，商业化兑现不及预期风险 ，模型能力追赶不 及预期风险 ，数据安全与合规风险 。 60708090100110 2025-09 2025-12 2026-03 2026-06 2026-09CSI 300 中金传媒互联网 传媒互联网 证券研究报告 2026.09.23 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 请仔细阅读在本报告尾部的重要法律声明 2 目录 WorkBuddy 发展历史和现状 ................................ ................................ ................................ ............ 4 厚积薄发成就战略级产品 ................................ ................................ ................................ ............ 4 WorkBuddy 运营数据亮眼 ................................ ................................ ................................ ........... 6 WorkBuddy 当前的价值锚点是个人办公 ................................ ................................ .......................... 6 个人生产力 Agent从编程 Agent泛化而来 ................................ ................................ ................... 6 当下优势：产品节奏快、模型接入快、生态开放快 ................................ ................................ ...... 7 往未来看：智能力为轴，横向拓展场景生态、纵向做深企业服务 ................................ .................... 12 Agent产品智能力是多维竞争，也是模型追赶者的结构性机遇 ................................ .................. 12 横向拓生态：存量生态是腾讯的优势， 栈、 Skills技能体系、隔离沙箱和模型适配层。 这些能力后来 直 接构成了 WorkBuddy 的工程底座。 2026年产品方向切到 “全民办公 ”，经历“赛马”后资源聚拢，快速迭代。 1） 2026年1月WorkBuddy 雏形诞生： 转向办公场景的触发点是 团队意外发现 非技术员工开始用 CodeBuddy 检索论文、整理资料，绕过 IDE的专业界面把 一款编程工具用成了通用工作台。 2026年1月中旬，Anthropic 发布 Claude Cowork从外部验证了同一方向 ，WorkBuddy 产品负责人 汪晟杰随即决定做一 个面向非技术用户的版本 ，完成了 WorkBuddy 0.01原型，复用 CodeBuddy 完整基建和 Agent SDK ，团队将主要精力集中在界面简化和办公场景 Skills的 开发上。 2） 2026年3月，QClaw、WorkBuddy 第一轮“赛马”：2026年春节后，开源 AI Agent 工具 OpenClaw 在中国引发广泛关注 ，腾讯内部迅速涌现出多款类 似产品——WorkBuddy 、QClaw、Marvis，3月6日，彼时内部 同时存在 WorkBuddy （基于自研 CodeBuddy 架构）和 QClaw（基于开源 OpenClaw 框架）两条路线 ，却指向相近的人群和场景，由此形成了一轮内部 “赛马”。 3月9日前后， QClaw启动测试， WorkBuddy 也正式公测。 3月12日， WorkBuddy 微信一键直连全量开放 。 3） 2026年3月-6月资源收拢， WorkBuddy 个人版快速迭代： 在后续的内部 “赛马”中，QClaw相关团队、产品能力和微信入口逐步向 WorkBuddy 体系 合并。3月下旬微信小程序版 上线，支持云端和本机双模式； 4月底腾讯文档 接入资料库， 5月底 ima知识库上线， QQ邮箱、腾讯会议、腾讯网盘、腾讯 乐享等业务陆续打通。 5月28日在香港 Tencent Cloud Day 上国际版正式 发 布，深度适配 Slack、Telegram 、Discord，同场发布 Miora和TokenHub ；随 后一个月内在新加坡、印尼完成东南亚 扩张。根据 WorkBuddy 更新日志 ，其 产品端 5个月迭代 70+版本， 8月底混元 Hy4预览版接入，海内外版本同 步、模型发布到产品接入仅 一天完成。 WorkBuddy 企业级和生态产品在 6月密集发布。 6月5日腾讯云 AI产业应用大 会上，企业版及 Agent Suite 发布，提供 7×24专家数字员工、人机协同项目模 式、企业级管理后台；中国移动、联通云、平安银行、携程、美团等 20余家企业 作为首批生态伙伴亮相。 7月22日独立 App上线（ iOS/Android/ 鸿蒙） ，成为首 个登陆鸿蒙系统的通用智能体应用 。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 请仔细阅读在本报告尾部的重要法律声明 5 图表 1：WorkBuddy 产品演进时间 线 资料来源： 腾讯云官网， WorkBuddy 官网，中金公司研究部 团队资源收拢： WorkBuddy 团队规模从 2023年初的约 10人扩展至 2026年5月 的100余人，外围还有腾讯文档、腾讯会议、元宝及已整合的 QClaw等业务协 同力量。 7月20日QClaw业务和团队调整至 云产品六部 ，标志内部 “赛马”结 束；2026年7月CodeBuddy 与WorkBuddy 升格为腾讯云云产品六部独立组 织，在内部资源排序中仅次于微信，被视为继 QQ、微信之后有潜力成为第三款 现象级业务 ，CodeBuddy& WorkBuddy 负责人刘毅从总监升任为 腾讯云产品六部 助理总经理 （AGM），作为项目的主要负责人。 图表 2：WorkBuddy 组织架构 注：数据截至 2026年9月2日 资料来源： 腾讯云产品目录、混元 API 官方文档、中金公司研究部 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 请仔细阅读在本报告尾部的重要法律声明 6 WorkBuddy运营数据亮眼 易观分析报告显示，3月WorkBuddy PC端月访问量为885万次，环比增速达 831%，在国内PC端AI原生办公智能体市场中，月访问量与环比增速均位列第 一，领先第二名约 2.6倍。这一领先优势在 Q2进一步扩大——易观7月20日发 布的Q2报告显示，6月WorkBuddy月访问量达2,097万次，位居行业第一，超 过第二名字节跳动 TRAE IDE（1,279万次）与第三名阿里巴巴 QoderWork（788 万次）之和。同期， 17款主流桌面端AI原生办公智能体合计月访问量突破 6,000 万次，腾讯以WorkBuddy、CodeBuddy、QClaw、Marvis四款产品合计贡献月 访问量3,262万次，占据大盘半数以上份额，集团军 优势显著。 图表3：2026年6月中国桌面端AI原生办公智 能体平台月访问量 图表4：2026年5月中国桌面端智能体用户渗 透率 资料来源：易观分析、中金公司研究部 资料来源：易观分析、中金公司研究部 场景分布上，CodeBuddy&WorkBuddy负责人刘毅披露当前高价值使用场景集中 于金融、文档办公、教育、法律四个领域 。 WorkBuddy当前的价值锚点是个人办公 个人生产力Agent从编程Agent泛化而来 AI产品的演进是人群的聚焦与再泛化，为用户创造价值的落点从模糊走向清晰。 对话式AI面对的是极为分散的人群，输出只是一段回答，替代的是搜索与思考的 时间，人群之泛使得它为用户创造的价值点反而不清晰；编程 Agent是这层泛之 上的一次聚焦，把人群收窄到开发者这一约 1亿人的群体，任务是写代码、交付 一次代码变更，正因为人群聚焦，价值点随之变得清晰，代码可编译、可测试、 正确性可被客观判定、容错成本低，编程 Agent因此率先建立信任并率先跑通商 业化。生产力Agent则是在编程Agent之上再做一次泛化，人群从开发者扩展到 知识工作者，任务从写代码扩展到写文档、做表格、发邮件与跨应用操作，交付 物是一份报告、一张表格或一套整理好的完整任务结果 ，带着编程阶段已经明确 找到的价值创造点向更大人群扩散，技术同源而服务广度与任务性质不同。表面 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 请仔细阅读在本报告尾部的重要法律声明 7 上看是先泛化、再聚焦、又泛化的往复，实质是在这个过程中 逐步清晰的 用户价 值的落点；用创新扩散曲线来看，从编程 Agent走向生产力 Agent，正是从早期 使用者跨越到早期大众的关键一跃，后者市场更大，但工作成果的好坏见仁见 智、无法像代码一样被客观判定，信任的建立也 相对更慢。 图表 5：编程 Agent与生产力 Agent的差异化定位 资料来源：中金公司研究部 当下优势 ：产品节奏快、模型接入快、生态开放快 产品节奏快：绕开 硬核编程市场 ，办公原生 WorkBuddy 面向办公场景的定位清晰。 Claude Code 和Codex以编程执行为中 心，办公能力是用户主动绕开产品主路径的延伸使用，而非产品原生设计的系统 支持； WorkBuddy 从第一天就是办公原生。负责人汪晟杰建立产品之初的核心 判 断是：用（CodeBuddy ）同一套 Agent底座，换掉 IDE界面、增加办公 Skills， 就能服务一批全新的用户 ，因此前期规划就是复用 CodeBuddy 的完整基建，把 迭代重心集中在 界面简化 和办公场景 Skills开发上。 产品易用， 降低了 Agent从极客到大众的跨越成本。 产品设计的三个关键决策值 得关注： 1）单一对话窗口，所有交互收敛至一个界面，降低非编程人员的认知负 担；2）零编程术语： Skills叫“技能” 、 MCP叫“连接器” 、 Agent叫“专家” ， 全部中文化释义； 3）低门槛设计，模型 配置过程完全 UI化。这一设计哲学与部 门负责人刘毅 强调的“追求那种心流状态，让用户用起来流畅不割裂” 形成闭 环。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 请仔细阅读在本报告尾部的重要法律声明 8 图表 6：WorkBuddy 产品界面设计低门槛，突出呈列垂类技能、 MCP 资料来源： WorkBuddy 客户端， 中金公司研究部 模型接入快 ：聚合平台的战略弹性 WorkBuddy 的5家13款加自动路由加自定义 API，开放度最高。在模型快速 迭代的周期里，一个能以低成本、短路径接入新模型的平台，获客能力强于绑定 特定模型的封闭生态。 WorkBuddy 当前内置了 5家头部国产大模型厂商的 13款 主流模型，涵盖腾讯混元（ H 部 生态开放快 ：微信入口 +腾讯产品 MCP互通 理解腾讯社交生态对 生产力 Agent的战略意义，需要回到一个简单事实： 对大量 中国白领而言，微信已经成为日常工作沟通与任务协同的重要入口之一 。2026年 3月12日，WorkBuddy 微信一键直连全量开放，自动化任务执行（循环工程） 与Skills导入功能同时上线，这是 WorkBuddy 上线仅 3天后的一次关键更新 ；如 今已接入微信小程序、企业微信、 QQ、Slack、Discord、Telegram 等多端，用 户在手机上通过微信下达指令，桌面端 Agent后台执行，完成后微信推回结果。 对比来说， Claude Code 需要装 CLI和配置 API Key、Codex需要 Terminal 、 Trae需要装 IDE。阿里的钉钉生态虽强，但在 C端社交渗透率远低于微信；字节 的飞书生态在企业协作上持续追赶，但缺乏微信级别的个人社交入口。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 请仔细阅读在本报告尾部的重要法律声明 11 图表 11：WorkBuddy 微信小程序实现远程桌面端控制 资料来源： WorkBuddy ，中金公司研究部 产品生态的 MCP深度互联 腾讯自有产品实现深度互通。 WorkBuddy 已通过 MCP连接器接入 18个以上腾 讯自有产品，覆盖文档（腾讯文档） 、邮箱（ QQ邮箱） 、会议（腾讯会议） 、知识 库（乐享） 、笔记（ ima） 、项目管理（ TAPD）等全链路办公场景，产品之间天然 共享账号体系、文件格式和权限系统， Agent能跨这些产品完成端到端任务。 对 比来说， 竞争对手需要逐一对接三方 SaaS，且难以实现同等级别的深层次数据 互通。此外， WorkBuddy 还支持 100+内置 Expert Skills ，将高频办公场景（竞品 调研、舆情分析、发票处理、文档归档、销售洞察）封装为完整工作流 ，对比 ClaudeCode 等深度路线，牺牲了一定的灵活性，但学习成本有所降低。 图表 12：WorkBuddy 通过 MCP连接器接入 18个以上腾讯自有产品 资料来源： WorkBuddy ，中金公司研究部 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 请仔细阅读在本报告尾部的重要法律声明 12 往未来看： 智能力为轴，横向拓展场景生态 、纵向做深 企业服务 Agent产品智能力是多维竞争，也是模型追赶者的结构性机遇 类比操作系统例如 Windows ，其核心来自系统底层稳定性、易用性、可靠性等。 对于 WorkBuddy 这类泛生产力 Agent，我们认为其底层核心是智能交付能力 。市 场对 WorkBuddy 的能力评估建立在现有产品体验上，但我们认为模型、工程、数 据都还在持续演进， 因此我们认为产品智能力 还存在预期差。 ► 上下文是稀缺资源 ，也是智能前进的方向 ；腾讯具备上下文优势 。根据姚顺 雨团队研究《从Context学习，远比我们想象的要难 》，人类在 AI系统中的 角色从数据提供者（ training data provider ）变成了上下文提供者（ context provider） ，未来，竞争的焦点 是“谁能为任务提供最丰富、最相关的上下 文”。腾讯在社交、办公、内容等领域的深厚积累为 AI提供了竞品难以获取 的高质量上下文 ，比如企业微信里的协作关系、腾讯文档中的项目进展、腾 讯会议纪要里的决策逻辑， 均是带有业务语义的过程数据 ，对于 Agent环境 下的模型训练 更为关键 。规模上， CodeBuddy 覆盖的 1.2万名工程师是 早期 内部验证场， WorkBuddy 面向的千万级用户与亿级任务量， SkillHub 技能数 代表任务丰富度 持续提升，对上下文的获取有进一步补充。 ► 工程框架 优化或为短期智能力提升的主要来源 。腾讯 Workbuddy 团队将核心 资源投入 Harness En gineering ，以两层同心圆结构组织工程体系，并在 2026年7月以《从模型到 Harness：如何把 Agent做成可用产品》对外 发布 方法论。 据刘毅在 CSDN专访表述，2025年中以后产品功能层面已无差 距，CodeBuddy 的Harness 工程在 SWE -bench类评测中得分不低于 Claude Code 。 LD）、探测器(PIN/APD-TIA)，主要功能为光电信号的转换，为光通信设备中最核心的器件之一，主要应用于接入网、无线移动网络、骨干传输网、数据中心、传感器等产品。投资建议：1）量：近年来公司生物发酵产能持续扩大，26H1公司白酒糟生物发酵饲料产品销量10.57万吨，同比增长45.92%，#我们预计26年销量或可达23万吨以上，截止25年公司产能规划合计66万吨/年，#未来量增趋势确定。2）价：今年厄尔尼诺现象导致豆粕价格持续上行，目前豆粕现货价已升至3400元/吨，较年内低点已上升19%，#26H1白酒糟生物发酵饲料业务吨价达1549元/吨，同比提高2.30%，参考22-23年公司产品吨价高达2100元/吨以上，#生物发酵饲料产品吨价有较大修复空间；3）利润率：#目前公司旗下众多饲料生产主体均已实现盈利，未来吨价提升有望催化利润率进一步修复。我们认为应关注公司产能利用率提升下的销量增长+豆粕价格提升下的吨价增长双重催化，#另重视本次与深圳市东飞凌科技有限公司（光电芯片封装公司）成立合资公司的重要催化，重视底部反转下的投资价值。 联系人：杨骥/张家祯#文字观点", "publish_time": "2026-09-25 20:35", "tags": ["文字观点"]}, "attachment:files/3D打印设备专家交流20260924..pdf": {"id": "attachment:files/3D打印设备专家交流20260924..pdf", "kind": "attachment", "title": "3D打印设备专家交流20260924.", "source_label": "其他", "excerpt": "11中邮证券供给刚性铸就底色， AI浪潮重塑需求 ——小金属行业 2026年下半年投资策略", "content": "11中邮证券供给刚性铸就底色， AI浪潮重塑需求 ——小金属行业 2026年下半年投资策略 证券研究报告 李帅华 /魏欣 中邮证券研究所 有色&新材料团队行业投资评级：强大于市 |维持 发布时间：2026-09-24 下载日志已记录，仅供内部参考 2 投资要点 ➢锡：供给弹性弱， AI焊料需求景气，长期供不应求 。 缅甸佤邦复产缓慢，锡矿进口仅恢复至正常年份 40-50%；印尼 RKAB 改为一年一审、 配额收紧。需求端 AI服务器与 HBM 先进封装带来焊料增量，测算供需缺口由 2025 年约0.9万吨扩大至 2030 年约7万吨，锡价处于长期上行趋 势。 ➢铟：光模块驱动磷化铟需求指数级增长 。 供给以再生铟为主，中国精铟产量占全球 70%以上； ITO靶材为基本盘（占消费近 80%）。 800G/1.6T 光模块发射端全面采用磷化铟基 EML激光器、接收端升级为磷化铟基 APD探测器，测算 2030 年光模块领域高纯铟需求有望达 440 吨以上，占精铟总需求比例升至 15%以上，成为最强边际变量。 ➢钽：供给脆弱叠加 AI需求爆发，价格中枢持续上行 。 刚果（金）、卢旺达、尼日利亚三国占全球产量 83.6% ，手工采矿叠加战乱，供给极为 脆弱；美西方渗透钽产业链，贸易流向生变。 AI服务器单机钽电容用量可达传统服务器 8-10倍，叠加半导体钽靶材、高温合金三重拉动， 2030 年供需缺口预计约 460吨，钽价中枢有望持续上行。 ➢钨：供给持续紧缺，内外价差或进一步扩大 。 中国钨矿产量占全球约 83%，指标管理叠加打击超采走私，供给刚性明确；美国废钨出口禁令 后海外现货紧张，海外 APT价格约为国内三倍。中高端钨制品出口结构改善， AI PCB 微钻、六氟化钨贡献边际增量，战略属性催化下钨价中 枢稳定上移。 ➢稀土：废料回收预期下滑，镨钕价格短期看多 。 指标严格管理、增速逐年收窄，税务合规加码致合规含税废料偏紧；中国冶炼分离产能占比 88%，海外产能多在建设调试期、短期不构成扰动。 2026 年上半年高性能钕铁硼产量同比增长约 23%，新能源汽车基本盘稳定，人形机器人、 低空经济打开远期空间，氧化镨钕价格短期看多 。 ➢投资建议 ：建议关注云南锗业、锡业股份、华锡有色、中钨高新、厦门钨业、东方钽业等。 ➢风险提示 ：价格波动风险；下游需求不及预期风险；国内外项目投产进度不及预期风险；模型假设与实际不符；政策超预期风险等 。 请参阅附注免责声明 下载日志已记录，仅供内部参考 3 （一）锡：半导体行业是锡的基本盘 ◼锡（Stannum ）金属元素，元素符号 Sn，原子序数为 50，是一种有银白 色金属光泽的低熔点金属。 ◼锡在地壳中含量较少，平均含量只有 0.004% 。全球锡矿资源高度集中， 新矿山建设周期长，整体供给弹性弱，全球处于紧平衡，库存低位，易受 事件冲击。 ◼供给端，全球矿产锡主要来自缅甸、印尼、中国、刚果（金）、秘鲁。 2025 年全球锡矿产量约 29 万吨，其中中国锡矿产量稳定 ，年产 7.1 万吨 印尼锡矿产量仅次于中国，缅甸锡矿由于佤邦矿区复产缓慢仅 1.2万吨，秘 鲁、刚果（金）、巴西合计约 8.8万吨。 ◼需求侧，焊料是第一大用途，占全球消费 50% 以上，用于电子焊接， 传 统需求 包括消费电子、家电、马口铁、锡化工、铅酸电池等提供基本盘 ， 新兴需求包括 AI 服务器、先进封装（ HBM ）带来增量，服务器单机耗锡 高于普通设备；新能源车电子、光伏也拉动焊料消费。 请参阅附注免责声明图表1：锡产业链 资料来源 ：前瞻产业研究院， 中邮证券研究所 下载日志已记录，仅供内部参考 4 ◼缅甸进口处于正常年份 40%水平，复产进度缓慢 。缅甸佤邦 6-10 月为雨季，露天矿开采、山区运输受阻，矿料流入持 续偏低，今年整体进口水平仅恢复至正常年份 40-50%，复产缓慢可能由于（ 1）30% 实物税 叠加油价上涨，高成本矿 没有复产动力。（ 2）4月邦康炸药厂爆炸 ，当地炸药审批收紧，难以快速复产。（ 3）佤邦当地矿权整合，主 观上不追 求快速回到历史峰值产量 。 ◼刚果金：产量 /进口量稳定 。Alphamin 二季度含锡产量 5013 吨，年化 2万吨，刚果金 1-8月累计进口量同比 +5.03% 。 ◼印尼：出口审批收紧 。印尼出口 需审批RKAB （矿山年度开采工作计划） ，2026 年改为一年一审，不再三年审批， 锡 金属生产配额定在 6万吨，低于市 场预期。（一）锡：缅甸复产不及预期，长期供应仍然紧缺 图表2：缅甸锡进口量（精矿千克） 请参阅附注免责声明图表3：刚果金锡进口量（精矿千克） 资料来源： iFinD ，中邮证券研究所 资料来源： iFinD ，中邮证券研究所 下载日志已记录，仅供内部参考 5 ◼全球总库存处于较低水平，国内去库转 累库，国外持续去库，短期库存逻辑削 弱。上期所、社会库存去库转平，去库 逻辑有所削弱； LME库存6月底以来快速 去库41.98% 。内外分化主要由于进口盈 利窗口持续高位震荡，贸易商转运意愿 增强。 ◼大型锡焊料企业开工改善 。需求侧，国 内大型企业锡焊料开工率好于往年，主 要得益于 AI锡焊料需求景气，费半指数 仍处于历史高位。 ◼宏观方面，美联储加息落地，后续仍有 继续加息可能，锡价宏观承压。（一）锡：库存逻辑削弱，静待宏观转向 图表4：上期所库 存（吨） 请参阅附注免责声明资料来源： iFinD ，百川盈孚，中 邮证券研究所图表6：LME锡库存（吨）图表5：锡锭社会库存变 动（吨） 图表7：费城半导体指数 下载日志已记录，仅供内部参考 6 ◼综合来看，锡的长期供应持续紧缺，扰动频繁， AI发展带动整体需求景气度提升，锡价处于长期上行趋势。 请参阅附注免责声明资料来源： ITA，USGS ，中邮证券研究所图表8：锡供需平衡表（万吨）（一）锡：AI需求景气，长期供不应求 2025 2026E 2027E 2028E 2029E 2030E 中国 11.4 12.0 12.0 12.0 12.0 12.0 缅甸 1.2 2.2 2.5 3.0 3.4 3.4 刚果 2.7 2.5 2.5 2.5 2.5 2.5 印尼 6.1 5.8 5.8 5.6 5.6 5.6 其他 9.0 9.0 9.2 9.5 9.5 9.5 矿山产量 30.4 31.5 32.0 32.6 33.0 33.0 再生锡 9.5 9.5 10.5 11.0 11.5 12.0 供给合计 39.9 41.0 42.5 43.6 44.5 45.0 焊料（含 AI算力） 23.9 25.1 26.6 28.4 30.4 32.7 其中：AI算力直接需求 0.7 1.2 1.5 1.8 2.0 2.3 镀锡板 6.2 6.3 6.5 6.7 6.9 7.1 锡化工 5.5 5.6 5.8 6.0 6.2 6.4 其他需求 4.5 4.2 4.0 3.8 3.6 3.5 需求合计 40.8 42.4 44.4 46.7 49.1 52.0 供需缺口 -0.90 -1.42 -1.91 -3.11 -4.61 -6.97 缺口占比 2.21% 3.35% 4.30% 6.66% 9.39% 13.41% 下载日志已记录，仅供内部参考 7 （二）铟：具备极强的可塑性和延展性 ◼铟，元素符号为 In，原子序数为 49，位于元素周期表第五周期 IIIA族（硼族元素）。 其为银白色略带淡蓝色调的软质金属，质地较软可以用指甲轻易划出痕迹，具有 极强的可塑性和延展性，能被压制成极薄的片状。 ◼铟产业链主要分为矿产开采、铟矿冶炼及处理、含铟产品加工及下游应用等环节。 ➢上游主要涉及铟矿的开采、选矿及高纯铟的提炼 。铟通常以伴生矿形式存在于闪 锌矿等锌矿中，原矿石经过破碎、浮选等工艺处理后，可得到铟精矿 ，通过冶炼 制取粗铟， 再生铟回收厂通过将回收的尾料还原制取粗铟 。粗铟经进一步精炼提 纯后形成精铟（纯度在 4N-4N5）。 ➢中游加工环节是整个产业链的枢纽 。精铟经高纯化处理后形成高纯铟（ 5N以上） 或经过氧化处理形成高纯氧化铟（ 4N以上），高纯铟通过不同的加工工艺，可制 成ITO靶材、特种焊料与合金、铟系化工品、精密电气元件以及半导体材料等核心 产品。 ➢下游应用领域呈现多元化发展态势 。铟锡氧化物制成的 ITO薄膜可将电数据转换为 光数据，在 3C领域广泛应用。此外，铟基合金在航空航天、军工等特殊领域发挥 重要作用；半导体行业则使用锑化铟、砷化铟等化合物半导体材料制造红外探测 器、LED等器件。 请参阅附注免责声明图表9：铟产业链 资料来源： 粉体工业， 中邮证券研究所 下载日志已记录，仅供内部参考 8 （二）铟：主要来源于原生铟提炼和再生铟回收 ◼铟主要来源于原生铟提炼和再生铟回收。 ➢再生铟是精铟供给主要来源 。2022 -2025 年，全球精铟产量分别为 2280 吨、2342 吨、2530 吨和2682 吨，其中原生铟 产量分别为 1041 吨、1069 吨、1116 吨和1150 吨。 ➢国内是最大的原生铟生产国。 中国作为最大的原生铟生产国， 2023 -2025 年原生铟产量分别为 646吨、426吨、441吨， 再生铟产量受环保监管、政策驱动 、技术进步 等影响，回收率和产量持续增长。 ➢根据安泰科预测，全球精铟产量 2026 -2027 年将分别达到 2785 吨和2880 吨，其中中国精铟产量将分别达到 1960 吨和 2050 吨，占全球精铟总产量的比重超过 70%。 请参阅附注免责声明图表10：全球精铟、原生铟产量（吨） 资料来源： 安泰科， 中邮证券研究所图表11：中国精铟、原生铟、再生铟产量（吨） 资料来源： 安泰科，锡业股份年报， 中邮证券研究所 下载日志已记录，仅供内部参考 9 （二）铟： ITO靶材是主要应用 ◼精铟整体需求预计稳步增长 。根据安泰科 《2025 年铟市场发展报告 》数据， 2025 年全球精铟消费量为 2316 吨，2022 -2025 年复合 增长率约为 7.31% ；根据安泰科预测，未来全球精铟消费量预计将持续增长， 2026 年和 2027 年预计分别达到 2510 吨和2813 吨， 同比增长 8.38%/12.07% 。 ◼ITO靶材是铟的主要消费应用，新兴需求逐步发展 。从需求结构看， ITO 靶材作为全球铟消费的核心支柱，占全球总消费量的近 80%，主要用于液晶显示（ LCD）、OLED 、触控面板等产业链，消费区域高度集中于东亚，其中中国大陆是全球最大的实际消费市 场，其次为韩国、日本及中国台湾地区。随着 ITO 靶材国产化率逐年提升，以及铟在光伏异质结电池及化合物半导体等新兴领域的 扩大应用，全球铟的消费结构正在发生深刻变化。 图表12：全球精铟消费量走势（吨） 请参阅附注免责声明资料来源：安泰科， 中邮证券研究所 图表13：国内精铟下游需求占比（吨） 资料来源：安泰科，锡业股份年报， 中邮证券研究所 下载日志已记录，仅供内部参考 10 （二）铟： 800G、1.6T光模块带动磷化铟需求指数级增长 ◼光模块核心是光电信号的双向高速转换，由电芯片和光芯片构成，其中光芯片根据功能分为：光发射芯片、接收芯片、收 发集成芯片、探测器阵列芯片、调制器阵列芯片等等。 ◼磷化铟成为高端光模块的核心底材 。800G/1.6T 光模块下 带宽翻倍、单通道速率翻倍 ，普通砷化镓 / 硅材料难以满足调制 速率要求，磷化铟具备独特的直接带隙结构，让光电转换效率接近 100% ，完美适配 1310nm 、1550nm 光纤通信黄金波段 ， 因此800G、1.6T光模块中 发射端全面采用磷化铟基 EML 激光器，硅光方案新增磷化铟 CW 泵浦芯片 ；接收端由 PIN 探 测器升级为磷化铟基 APD 探测器 ，磷化铟成为高端光模块的核心底材。 图表14：光模块内部构成 资料来源： 电子发烧友， 中邮证券研究所 请参阅附注免责声明 图表15：激光器构成 资料来源： 电子发烧友， 中邮证券研究所 下载日志已记录，仅供内部参考 11 ◼基于单通道速率， 800G 光模块大致可分为单通道 100G 和200G 两类，对应 8通道和 4通道，每条通道涉及发射端 EML和接收 端APD均需使用磷化铟芯片，硅光方案还需增加 磷化铟 CW 泵浦芯片 。单颗800G 光模块需要 8-17颗磷化铟芯片衬底。 ◼1.6T光模块对应主流为 8×200G 硅光架构，单位数 应用，深加工的元部件主要包括高温合金添加物、靶 材、表面声波滤波器、电容器以及钽加工材料；下游终端应用领域，包括光学玻 璃、硬质合金、电子、航空零件、化学设备、半导体等领域的应用。 请参阅附注免责声明图表17：钽产业链 资料来源 ：宁夏东方钽业股份有限公司 2022 年向特定对象发行 A 股股 票募集说明书 ，中邮证券研究所 下载日志已记录，仅供内部参考", "status": "extracted"}, "post:2026-09-25T18-55:91b0a270d4bc": {"id": "post:2026-09-25T18-55:91b0a270d4bc", "kind": "post", "title": "2026-09-25 18:55", "source_label": "帖子正文", "excerpt": "【浙商‖银行&政策 杜秦川/邓贺方/沈涛】央行货币政策委员会三季度例会点评：逆周期加力、框架改革提速、银行竞争格局加速重塑 9月24日，央行发布26Q3货币政策委员会例会。我们认为，货币政策延续适度宽松，强化逆周期调节，同步推进框架改革、汇率预期管理与结构性支持", "content": "【浙商‖银行&政策 杜秦川/邓贺方/沈涛】央行货币政策委员会三季度例会点评：逆周期加力、框架改革提速、银行竞争格局加速重塑 9月24日，央行发布26Q3货币政策委员会例会。我们认为，货币政策延续适度宽松，强化逆周期调节，同步推进框架改革、汇率预期管理与结构性支持；政策重在托需求、稳物价、优结构。银行流动性支撑稳固，信贷投放更趋结构化，行业由规模驱动向结构、定价、效率驱动转型。重点关注以下五点： 1、需求：逆周期调节聚焦有效需求。26Q3较26Q1-Q2“加大逆周期和跨周期调节力度”保留“加大逆周期调节力度”；同时将“着力扩大内需”改为“加力扩大内需”，并由“做优增量、盘活存量”调整为“加快推动新旧动能转换”。当前经济结构性分化，生产、新动能韧性较强，消费、投资、地产需求偏弱，政策重心向稳当期有效需求倾斜。 2、工具：政策操作更重相机抉择。26Q3新增“综合运用并适时调整货币政策工具”，政策灵活性进一步落实到工具操作。后续数量、价格和结构性工具均保留操作空间，“适时调整”强调的仍是相机抉择。 3、利率：操作框架加快重塑。26Q3较26Q1-Q2“强化央行政策利率引导，完善市场化利率形成传导机制”调整为“推动货币政策操作框架改革完善”，政策表述由利率传导机制上升至操作框架层面。价格型调控持续深化，政策利率锚定、市场利率传导的方向更加明确。银行资产负债管理、负债成本管控与自主定价能力的重要性显著提升。 4、汇率：防范预期顺周期放大。26Q3首次明确“坚持市场在汇率形成中的决定性作用”，新增“防范市场‘羊群效应’和非理性预期的自我强化”，较26Q1-Q2更重视防范单边交易和预期自我强化。汇率政策更加兼顾市场化、预期管理和金融稳定。 5、结构：信贷增量更加结构化。26Q3将结构性货币政策工具由“优化工具管理”调整为“不断完善工具设计和管理”，并首次将“六张网”建设纳入重点支持领域。政策更加注重资金投向和使用效率，融资增量将更多来自科技、内需、重大建设和薄弱环节。银行业“降速提质”特征更加明确。增长逻辑正由“扩规模、以量补价”转向“稳价格、优结构、提效率”，资本实力雄厚、负债成本较低、客户基础优质且风险定价能力突出的银行竞争优势更强。 投资建议继续沿两条主线：一是经营基本面扎实、分红兑现确定性高的“大银行”，包括中国银行、建设银行等；二是扎根高财富区域、聚焦长三角的优质区域“富银行”，如浦发银行、南京银行、宁波银行等。 风险提示：宏观经济修复不及预期；货币政策调整超预期；净息差下行超预期；重点领域信用风险暴露超预期等。 您有相关问题，欢迎随时联系 杜秦川15701281690 邓贺方或对口销售。祝大家中秋快乐，账户长红，月圆人更圆#文字观点", "publish_time": "2026-09-25 18:55", "tags": ["文字观点"]}, "post:2026-09-25T08-44:25356fc3d0d8": {"id": "post:2026-09-25T08-44:25356fc3d0d8", "kind": "post", "title": "2026-09-25 08:44", "source_label": "帖子正文", "excerpt": "美联储周四公布了稳定币发行机构的提案 ，这是监管机构推进加密货币规则制定的最新举措。", "content": "美联储周四公布了稳定币发行机构的提案 ，这是监管机构推进加密货币规则制定的最新举措。", "publish_time": "2026-09-25 08:44", "tags": []}, "post:2026-09-25T08-44:08dfb66b654b": {"id": "post:2026-09-25T08-44:08dfb66b654b", "kind": "post", "title": "2026-09-25 08:44", "source_label": "帖子正文", "excerpt": "谷歌 、OpenAI 和 Anthropic 正在推进一项计划，拟自行创建一个以人工智能安全为重点的新标准机构，不受政府监管，希望在年底或 2027 年初启动该机构。", "content": "谷歌 、OpenAI 和 Anthropic 正在推进一项计划，拟自行创建一个以人工智能安全为重点的新标准机构，不受政府监管，希望在年底或 2027 年初启动该机构。", "publish_time": "2026-09-25 08:44", "tags": []}, "attachment:files/中金公司-主题策略：加息如何影响中国市场？-20260921.pdf": {"id": "attachment:files/中金公司-主题策略：加息如何影响中国市场？-20260921.pdf", "kind": "attachment", "title": "中金公司-主题策略：加息如何影响中国市场？-20260921", "source_label": "中金公司", "excerpt": "主题策略：加息如何影响中国市场？主题策略：加息如何影响中国市场？", "content": "主题策略：加息如何影响中国市场？主题策略：加息如何影响中国市场？ 2026-09-21 9 月FOMC 上，美联储如期加息 25bp 。对于加息本身，与我们此前多次提示的情形一致，即从维护美联储信誉的角度，最好 是加（《如何才能 “预防式加息 ”？》、《沃什转鹰意味着什么？》）；对市场影响，加息后的反应也与我们提示的基本类似，即 加息有助于稳定市场预期，且加息的影响更多是提前计入，所以兑现时反而是利空出尽，市场会 “反着做”（《如果加息会发生什 么？》）。总结而言，我们与市场最大的不同，就是认为会加息、但不认为加息是洪水猛兽，加息不是坏事，不加息也未必是好 事，加息后美债利率一度回落、市场反而反弹，也印证了这一点。潜在风险来自持续且大幅的加息（如三次以上），但现在不具 备连续加息的基础，除非油价彻底失控（《美联储加息一次够么？》）。 相比全球市场，市场更关注的是美联储加息如何影响中国市场，尤其是对海外流动性更敏感的港股市场。 综合来看，有如下几个结论： 1）与全球类似，整体影响幅度也与加息周期的长短和大小直接相关，例如短暂的加息或降 息，影响多是提前计入，如 2024 年和2025 年降息，而长期且大幅加息影响要大很多，如 2022 年加息； 2）美联储只是其中一 个、甚至有些时候不是主导的影响变量，例如降息周期市场依然可以跌，外资流出，如 2019 年，而加息周期市场依然可以涨， 且外资流入，如 2017 年；3）一般情况下，相比 A股，港股整体对美联储政策变动的敏感度更大，尤其是因联系汇率制度加息而 更敏感的本地地产与金融股，现金流久期较长的成长板块也会承压。 放在当下： 1）美联储连续且大幅加息的基础并不存在，更可能是短暂预防式加息，类似 1997 年；2）但当前中国自身的 内需基本面偏弱，又会放大外部扰动，所以两两相抵，整体影响依然有限，更类似 2025 年降息的反例。但是，如果变成连续且 大幅的加息，在内在基本面疲弱下影响就会明显放大，需要防范。 只要加息就有大影响？短暂加息与持续收紧要区别看待，全球资产和中国市场均是如此与全球市场类似，美联储加息对中 国市场的影响大小，也要看加息本身的幅度与时长。复盘 1990 年以来六轮加息，虽然全球市场在加息后平均都有不同程度下 跌，但不同加息周期的差异很大，因此不能不区分情形地看简单平均。 持续且大幅的加息，影响会明显放大。持续大幅加息不仅推高无风险利率、压制风险偏好，还会通过提高融资成本、收紧 金融条件对实际增长和金融市场造成更大冲击。历史上五轮连续加息，恒生指数和上证指数在加息后一个月的平均跌幅大于 1997 年的“预防式加息 ”。以2022-2023 年为例： 美联储在 16 个月内累计加息 525bp ，10 年美债利率直到 2023 年10 月才见顶。紧缩冲击最集中的 2022 年3 月至年底，除 美元和短端美债外，股票、长债、黄金等资产普跌（《如果加息会发生什么？》）；中国市场也不能幸免， 10 年美债利率从 2022 年3 月的1.7% 攀升至2022 年10 月4.2% 的期间，恒生指数和上证指数分别下跌 33%和14%，甚至跑输标普 500（-13% ）。 相反，短暂 “预防式加息 ”影响有限，且通常 “反着走”。1997 年3 月底美联储仅加息 25bp ，加息落地后两到三周美债利率见 顶，美股也见底回升；中国市场也是类似，恒指加息后一周下跌 5.3% ，随后迎来反弹，上证指数则持续上涨，加息后一周上涨 4.1% 。 降息也有类似规律， 2019 、2024 和2025 年都是3 次的短暂降息，美债利率在降息前下行，降息后反而见底回升。对中国 市场的影响也很有限： 1）2019 年，恒指和上证在降息前的 2019 年6 月均有反弹，降息后反而分别下跌 5.3% 和0.4% ，呈现利好 兑现的局面； 2）2024 年AH两地受“924” 政策影响在 10 月初大涨，随后美联储虽还有两次降息，但恒指和上证反而分别下跌 4.3% 和2.6% ；3）2025 年也是类似，恒指在宽松交易下两周反弹 3.2% ，利好兑现后于 10 月初见顶回落，即便后续还有两次降 息，上证指数则震荡持平。 因此，美联储政策影响的大小不在 “加息”或“降息”这一标签本身，而要区分加息的时长与幅度。 加息有多大影响？对中国市场而言，并不是主导变量对于中国市场，美联储货币政策只是其中一个、甚至一些时候都不是 主导的变量，国内基本面更为关键。 2017 年和2019 年提供了两个方向相反、但逻辑一致的例子： 2017 年美联储持续加息，但中国市场大幅上涨、并伴随外资流入。 2016 年12 月至2017 年底，美联储累计加息 4 次共 100bp ，2017 年10 月又启动缩表；但同期棚改等政策支持带动中国基本面明显改善，信用周期扩张， 2017 年上证和恒指分别 上涨7%和36%，主动外资也于 2017 年4 月后转为流入中国市场，至 2017 年底累计流入约 17 亿美元。仅供内部参考，请勿外传 2019 年恰恰相反，美联储降息，中国市场反而走弱，外资也依然流出。 2019 年7 月至10 月，美联储连续降息 3 次共 75bp ，但由于中国信用周期震荡走弱，叠加中美贸易摩擦，美联储降息后 1 个月，上证和恒指分别下跌 2.2% 和8.6% ，主动外资 并未因海外流动性转松流入，降息期间反而流出约 35 亿美元。 以上两个反例表明，美联储加息降息对中国市场会有影响，但并非主导。究其原因，美联储政策的影响更多体现在短期的 分母端，对港股的传导比 A股更为直接；但影响分子端需要更长时间，通过美国金融条件、海外需求、中国出口和企业盈利逐步 传导。因此，美联储短周期的政策调整难以改变中国市场趋势；只有国内基本面偏弱时，才会凸显外部影响。 加息对谁的影响更大？港股比 A股敏感，本地地产金融与科技更敏感 AH两地市场和不同板块对加息的敏感度也有差异： 1）受离岸市场开放金融体系，以及联系汇率制度跟随美联储加息影响，港股对美联储加息更敏感，加息前后通常跑输 A股；2） 板块层面，香港本地的地产、金融因为香港跟随美联储加息也会更敏感； AH两地成长板块因为高估值也会更敏感。具体来看： 预防式加息：港股跑输 A股。1997 年美联储加息后 1 个月，恒生指数下跌 1%，上证指数上涨 14%，港股跑输 A股。 板块上，港股通信服务和房地产跌幅较大，加息后 1 个月分别下跌 5.9% 和5.0% ，公用事业、可选消费分别下跌 2.3% 和 2.0% ，但信息技术、原材料和金融板块上涨，预防式加息下因为影响较短，也并非所有利率敏感板块都会承压。 A股地产、原材 料和医疗保健板块领跌，加息后 1 个月分别下跌 4.8% 、4.3% 和3.7% ，工业、公用事业、金融等板块上涨。 连续加息：港股依然跑输 A股，利率敏感和科技板块跌幅更深，行业下跌范围扩大至周期板块。历史上五轮连续加息，初 期港股均会跑输 A股，恒指加息后 1 个月内最大跌幅中位数为 -12% ，超过上证指数的 -11% ，且加息前港股已经承压，加息前至 加息后一个月恒指收益中位数为 -13% ，上证指数则为 -10% 。 板块上，港股房地产、信息技术、通信服务、金融板块偏弱，历史上五轮连续加息，加息后一个月收益中位数分别约为 - 4.7% 、-3.9% 、-3.8% 和-2.9% ，能源和原材料也下跌约 4%，受全球需求影响的周期板块同样承压。 A股金融、消费和原材料承 压较大，加息后一个月金融、可选消费、原材料和必需消费板块收益中位数分别约为 -13% 、-10.2% 、-9.1% 和-7.7% ，信息技术 也下跌约 6%。 当前更像哪个阶段？加息节奏类似 1997 年，结合基本面类似 2025 年的反面 首先，本轮大概率是短暂的 “预防式加息 ”，更接近 1997 年，美国当前基本面并不支持连续且大幅加息。一方面， 9 月 FOMC 会议表态并未进一步释放明显超预期的鹰派信号，点阵图给出的年内一次加息和明年没有加息低于市场担心和 CME 期货 此前隐含的大幅加息预期（《美联储加息一次够么？》）。另一方面，高利率会抑制传统需求，美国 30 年期按揭利率升至近 7%，成屋销售已再度回落，甚至 AI投资对融资成本的敏感度也在上升，美国基本面未必 “扛”得住连续加息。因此，除非油价大 幅失控，当前不具备连续加息的基础。我们测算，若油价中枢维持在 100 美元以上甚至更高， CPI将无法继续走低，从而给 美联储带来更大压力；但若油价三四季度中枢降至 80 美元，CPI同比会在年底回落至 3%左右，美联储进一步大幅加息的必要性 也将下降（《美联储加息一次够么？》）。 其次，当前中国基本面偏弱，外部扰动容易被放大，更类似 2025 年底以来的信用周期震荡。正如 2019 年中国信用周期震 荡，美联储降息都无法有效提振市场，那 2026 年以来信用周期震荡走弱，加息反而可能会放大影响。今年财政增量有限，且资 金投向仍更多集中于科技和产业升级，对居民消费、地产等传统信用部门带动不足，尽管三季度信用周期可能小幅扩张，也不改 变全年偏弱格局。 因此，当前美联储连续且大幅加息的基础并不存在，更可能是短暂预防式加息，类似 1997 年；但中国自身的内需基本面 偏弱，又会放大外部的扰动，所以两两相抵，整体影响依然有限，更类似 2025 年降息的反例：市场在短暂扰动后回归基本面定 价，恒生指数冲高后于 10 月2 日见顶回落，上证指数则震荡持平；板块层面，降息后一个月原材料、资本品、保险板块领涨， 信息技术、房地产、医疗保健板块领跌，也说明预防式降息影响有限，否则利率敏感和科技板块本应上涨。当然，在极端风险 下，如果变成连续且大幅加息，影响就会明显放大，需要防范。 当前策略：市场 “反着走”，加息落地缓解估值压制，但上行空间仍受基本面约束指数层面，加息影响逐步消化，符合我们 提示的“反着走”的规律。美联储加息落地后，上周五市场已经反弹，恒指上涨 0.6% ，上证指数上涨 0.9% 。若美联储不持续大幅 加息，扰动可能暂告段落。其中，港股对美债利率的敏感程度高于 A股，加息落地或缓解前期估值压制，尤其是恒科。但在信用 周期震荡、结构分化的格局下，上行空间依然有限，更多是波段行情和 “赔率”思维。仅供内部参考，请勿外传 板块层面，科技看产业、周期压制减少、消费看政策、分红做对冲。 1）科技仍是主线，随着加息影响消化，前期估值压 制较多、但基本面仍有支撑的方向也有更大修复弹性，但整体空间仍取决于产业进展。 2）有色等周期板块在加息兑现后承受的压制会逐步减少，但黄金的上行空间不如不加息大，除非加息持续并拖累全球需 求和增长，才会明显承压。 3）消费板块依然取决于国内财政政策发力和倾斜情况，目前进展有限。 4）分红则作为其他板块都 疲弱时的 “哑铃型”对冲。 此外，值得关注的是实际受加息影响的香港本地地产和银行板块。今年以来香港本地地产和银行指数上涨 10%和35%，主 要得益于香港地产的持续修复，中原地产指数上涨 12.5% ，也是恒指跑赢恒科的原因。香港地产的修复与去年底美联储降息以及 大量新增需求密不可分：加息前香港金管局基本利率为 4%，按最优惠贷款利率 BLR减175bp 测算，部分浮息按揭利率为 3.25% ，7 月A类私人住宅毛租金回报率则为 3.4% ，超过按揭利率；此次加息后，基本利率走高至 4.25%1 ，BLR尚未同步上调 2，后续如果调整，可能产生一定影响。仅供内部参考，请勿外传", "status": "extracted"}, "post:2026-09-25T18-54:5fc4b9c099b0": {"id": "post:2026-09-25T18-54:5fc4b9c099b0", "kind": "post", "title": "2026-09-25 18:54", "source_label": "帖子正文", "excerpt": "瑞银——特斯拉（TSLA.US）——预测2026年第三季度交付量约47万辆 瑞银预测特斯拉2026年第三季度（3Q26）全球交付量约为47.0万辆，同比下降5%，环比下降1%。该预测较Visible Alpha一致预期（45.4万辆）高出4%（瑞银预计公司收集的一致预期将在约一周内发布）。", "content": "瑞银——特斯拉（TSLA.US）——预测2026年第三季度交付量约47万辆 瑞银预测特斯拉2026年第三季度（3Q26）全球交付量约为47.0万辆，同比下降5%，环比下降1%。该预测较Visible Alpha一致预期（45.4万辆）高出4%（瑞银预计公司收集的一致预期将在约一周内发布）。尽管瑞银认为买方目前并未过度聚焦汽车交付量，但买方预期近期有所上调，预计区间在46万至48万辆之间。储能部署方面，瑞银预测为16.9吉瓦时（GWh），同比增长35%，环比增长25%；但需提示储能业务本身具有间歇性特征，渠道核查难度较高。特斯拉预计于10月2日公布3Q26交付数据。 区域市场拆解 美国：纯电市场整体走弱但特斯拉份额提升，Model S/X停产不再计入。 据Autodata估算，特斯拉7月至8月在美国交付8.33万辆，较3Q25前两个月节奏下降29%，但较2Q26前两个月增长7%。本季度初Cybercab的注册数据将纳入报告统计，尽管其基数尚小。当前美国市场提供多项金融激励：Model Y 72个月贷款年化利率低至1.49%（覆盖后驱、全轮驱动及Premium版本），Performance版本为3.99%；所有新交付特斯拉车辆提供30天FSD（监督版）试用；Model 3新租赁方案为月付419美元、首付3,000美元。 欧洲：前两大月八大市场交付量同比下降5%。 季度内表现分化显著：挪威（-83%）、西班牙（-80%）、意大利（-57%）和英国（-36%）大幅走弱；法国（+183%）、德国（+33%）、比利时（+28%）和荷兰（+13%）强劲增长。欧洲季度交付通常向第三个月集中，这为瑞银预测带来一定变数。 中国：7月至8月工厂批发量（含出口）同比增长19%，环比增长9%。 中国国内零售（不含出口）同比下降21%，但环比增长6%。出口表现尤为强劲，同比增长92%，环比增长11%，支撑了瑞银对除美国、欧洲、中国以外地区（RoW）的乐观判断。为冲刺季度末交付，特斯拉当前在中国提供限时激励：2026年9月30日前提走库存Model Y可获1万元人民币优惠，Model 3最高可获5,000元人民币优惠，这可能为交付预测带来上行空间。韩国与澳大利亚等RoW市场需求旺盛：韩国前两个月交付2.1万辆（同比+35%，环比-14%）；澳大利亚交付量同比激增224%，环比增长63%。 股价逻辑与催化剂 交付数据对股价的影响有限，叙事驱动才是核心。 瑞银明确指出，随着投资者日益不再关注传统汽车业务，车辆交付量对股价的影响已大幅减弱（尽管交付当日仍可能产生噪音）。传统业务中真正可能重获关注的是全自动驾驶（FSD）的渗透率及其对利润的拉动。当前投资者焦点完全集中于特斯拉向物理AI公司的转型，股价由Robotaxi、Optimus人形机器人、Terafab、太阳能等AI业务的未来叙事和情绪主导。此外，投资者亦高度关注与SpaceX潜在合并的可能性——马斯克本月再次暗示了这一方向。 近期催化剂包括： 即将到来的季度财报（焦点在利润率和自由现金流）；Robotaxi的持续扩展与Cybercab的进一步进展；10月1日新款Roadster的发布（瑞银认为对财务数据影响有限）；Tesla Semi、Optimus V3更新，以及Terafab的更多细节披露。 历史交付日股价表现参考 从历史数据看，交付超预期当日股价平均上涨0.4%，不及预期当日平均下跌3.2%；交付日前五个交易日，超预期平均涨幅5.6%，不及预期平均跌幅2.5%。不过，特斯拉股价对交付数据的反应近年来波动加大，且当前市场定价更多反映AI与机器人叙事而非短期交付节拍。 估值与评级 瑞银对特斯拉维持中性评级（Neutral，核心评级例外，因该股波动率高于平均水平，评级波段设为±15%而非标准±6%），12个月目标价385美元。当前股价379.78美元（2026年9月23日），隐含上行空间约1.4%，低于瑞银设定的市场回报假设（9.7%），预期超额回报为-8.4%。估值方法基于2027年预测市盈率（P/E）。 核心下行风险： 全球经济与可选消费支出放缓冲击汽车生产；电动车渗透率不及预期；成本下降不及预期；材料供应与供应链风险；产能扩张执行风险；监管风险；关键人物风险。上行风险： 电动车及特斯拉产品需求强于预期；能源产品表现超预期；Robotaxi及其他AI业务变现速度快于预期。 ------ 投资结论 瑞银对特斯拉3Q26交付量47万辆的预测高于市场一致预期，反映出对RoW市场（尤其韩国、澳大利亚及中国出口）的乐观判断以及中国限时激励带来的潜在上行。然而，美国与欧洲核心市场需求分化、中国国内零售同比走弱，以及储能业务的间歇性特征，均构成短期不确定性。从投资逻辑看，特斯拉股价已脱离传统汽车交付周期，全面进入\"物理AI叙事\"驱动阶段——Robotaxi、Optimus、Terafab及SpaceX合并预期构成估值锚。在中性评级框架下，385美元目标价较当前股价仅余有限上行空间，建议投资者将关注点从季度交付节拍转向FSD渗透率、AI业务里程碑及潜在资本运作催化剂。#文字观点", "publish_time": "2026-09-25 18:54", "tags": ["文字观点"]}, "post:2026-09-25T08-50:85096fff9eb9": {"id": "post:2026-09-25T08-50:85096fff9eb9", "kind": "post", "title": "2026-09-25 08:50", "source_label": "帖子正文", "excerpt": "【中信基础材料和工程服务】强Call富乐德#业绩确定性有多强？800V新能源汽车渗透率持续提升+光模块TEC+半导体扩产上行周期，各个细分领域份额领先且有提升空间，26-28年业绩有望达到5/10/15e！", "content": "【中信基础材料和工程服务】强Call富乐德#业绩确定性有多强？800V新能源汽车渗透率持续提升+光模块TEC+半导体扩产上行周期，各个细分领域份额领先且有提升空间，26-28年业绩有望达到5/10/15e！#未来有想象空间吗？公司行业地位及技术优势明显，PCB混压、EML底座、HBM等领域用陶瓷基板均在推进，未来拓展空间均可扩张数倍！#市值目标上修到600e#文字观点", "publish_time": "2026-09-25 08:50", "tags": ["业绩确定性有多强", "未来有想象空间吗", "市值目标上修到600e", "文字观点"]}, "post:2026-09-25T23-28:2ebff6856d5d": {"id": "post:2026-09-25T23-28:2ebff6856d5d", "kind": "post", "title": "2026-09-25 23:28", "source_label": "帖子正文", "excerpt": "铜箔：近期投资者交流反馈📊股价表现分化，HVLP（高端极薄铜箔）落地执行成为关注焦点📈📎AI 铜箔供应链板块内本月至今股价表现出现显著分化，德福科技股价上涨 15%，跑赢三井金属下跌 22%、科泰材料下跌 8% 等同业海外公司。🤝📎在我们近期发布铜箔专题报告（报告中点明德福科技 9 月 HVLP 目", "content": "铜箔：近期投资者交流反馈📊股价表现分化，HVLP（高端极薄铜箔）落地执行成为关注焦点📈📎AI 铜箔供应链板块内本月至今股价表现出现显著分化，德福科技股价上涨 15%，跑赢三井金属下跌 22%、科泰材料下跌 8% 等同业海外公司。 🤝📎在我们近期发布铜箔专题报告（报告中点明德福科技 9 月 HVLP 目标产量约 700 吨，已经接近三井金属 2026 下半年 730 吨的目标）之后，我们和十余家投资者开展了行业交流。 👍📎市场依旧看好 AI 带动的需求增长，但投资者的关注点已经越来越向项目实际落地执行层面转移。 ❓📎市场主要争论的三大方向：第一，HVLP 实际出货量以及良率改善进度；第二，2027 年产量、产能目标是否具备可实现性；第三，锂电铜箔利润修复能否持续。🔍HVLP 业务：产量兑现与盈利释放是核心争论点✅📎投资者对 AI 拉动的 HVLP 需求维持乐观态度，但核心分歧在于，当前产能爬坡节奏能否延续，并且最终转化为实际盈利。 📋📎德福科技披露 8 月份 HVLP‑4 出货量 73 吨，良率大约 60%；公司目标 2027 年一季度 HVLP 整体月出货 900‑1000 吨，2027 年三季度月出货超过 2000 吨。 👀📎投资者重点关注指标包含稳定的月度出货规模、HVLP‑4 产品占比提升、良率保持稳定、重复订单落地，以及对应业务贡献的利润水平。 📍📎因此，2026 年第三、四季度财报以及后续经营更新，是检验产能落地与盈利兑现情况的关键观察节点。🔋锂电铜箔：主要客户加工费上调，盈利拐点信号更加明确📝📎根据我们行业调研，二级客户已于 2026 年三季度完成加工费上调，上调幅度约 1500‑2000 元每吨；主要电池客户已经接受加工费上调 1000‑2000 元每吨，该调价将从四季度开始生效。 📈📎展望 2027 年，中国电子材料行业协会铜箔分会预计国内铜箔行业产能利用率，将从 2026 年的 92% 提升至 2027 年的 98%，支撑加工费在年底延续上行，或者延续至 2027 年一季度。 ⚠️📎投资者更多担忧 2027 年之后盈利的可持续性；经历连续数年亏损之后，现有多数铜箔生产商扩张意愿不强，资产负债表承压，项目投资回报率依旧缺乏吸引力；但头部电池制造公司的产能规划，最终有可能限制加工费进一步上行空间。 💹个股启示：盈利端向上弹性更大📌📎我们对德福科技（301511.SZ）、诺德新材（600110.SH）维持中性评级，但判断盈利存在向上的弹性。 🚀📎主要上行风险包含两点：第一，德福科技 HVLP 产品出货量爬坡速度快于预期，该公司 HVLP1‑4 型号产品已经全部完成认证；第二，诺德新材顺利完成 HVLP‑4 的供应商资质认证，该公司 HVLP1‑3 型号已完成认证。#文字观点", "publish_time": "2026-09-25 23:28", "tags": ["文字观点"]}, "attachment:files/Bernstein-中国半导体：中国下一代赢家：Montage—— 搭乘智能体 AI 浪潮 China Semiconductors China Next Winners Montage - riding on the Agentic AI boom.pdf": {"id": "attachment:files/Bernstein-中国半导体：中国下一代赢家：Montage—— 搭乘智能体 AI 浪潮 China Semiconductors China Next Winners Montage - riding on the Agentic AI boom.pdf", "kind": "attachment", "title": "Bernstein-中国半导体：中国下一代赢家：Montage—— 搭乘智能体 AI 浪潮 China Semiconductors China Next Winners Montage - riding on the Agentic AI boom", "source_label": "Bernstein", "excerpt": "电新双周报：风电设备招标增长可观；人形机器人量产提速电新双周报：风电设备招标增长可观", "content": "电新双周报：风电设备招标增长可观；人形机器人量产提速电新双周报：风电设备招标增长可观；人形机器人量产提速 2026-09-21 行业近况 2026 年9 月7 日至9 月18 日，风电 /光伏/电网设备 /新能源车 /储能/工控设备涨跌幅 +4.5%/+1.4%/-1.7%/-2.9%/-3.4%/- 4.6%。 评论 新能源车中游：排产逐步进入旺季，消费税加征或短期影响锂电盈利、但中长期有望向下游逐步传导。 3Q26 锂电产业链 排产环比提升 10-20%、基本符合预期，同时 9 月起电池消费税开始加征，短期或对电池盈利有一定影响，但随着电池厂逐步与 下游达成传导协议，我们仍看好电池盈利中长期修复。 新能源产业链： 1）风电：看好风电 “十五五 ”景气度提振。 9月上旬风电设备招标开标实现可观增长，山东八部门联合发文 推动风电设备产业链高质量发展，我们看好风电 “十五五 ”景气度提振。 2）光伏：多晶硅环节部分企业已安排生产降负，成本团 标等政策持续推进，我们预计盈利修复仍需减产力度进一步兑现。我们看好成本与效率能够拉开差异的环节。 3）储能：浙江电 力交易中心发布《关于电网侧独立新型储能参与电力市场的通知》，公布了 40 个电网侧储能项目名单，规模合计 2.54GW/5.1GWh ，并按照是否统调和是否转商运对独立新型储能参与电力市场做出分类和限制，运营能力直接决定储能项目收 益水平。 4）电力设备：国网发布第 2 次电表招标， 2026YTD 合计招标量同比 +69%；国网发布现代化用电营商环境举措；美国宾 州研究预警 PJM 2030 年或面临电力可靠性风险。我们持续看好国内 +海外需求共振，细分环节中 2H26 配用电利润有望企稳回 升。 AIDC 与工控设备： 1）AIDC：海外 CSP 持续加码 AI 基建并锁定绿电，国内高密算力扩容带动液冷与备电订单兑现，我们 认为算力密度升级有望带来电源、液冷等环节增长。 2）工控机器人：宇树实现人形机器人全自主搏击，小鹏产线启用，优必选 海外订单超 5000 万元、万台级工厂投产，特斯拉 Optimus 中国量产审厂。我们认为人形机器人量产与商业化持续提速，工控企 业有望受益于核心零部件需求放量。 估值与建议 维持相关公司盈利预测、评级与目标价不变。 风险 宏观经济下行，原料价格波动，政策落地不及预期，关税变化。仅供内部参考，请勿外传！ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-09-25T19-01:b8f3d243098c": {"id": "post:2026-09-25T19-01:b8f3d243098c", "kind": "post", "title": "2026-09-25 19:01", "source_label": "帖子正文", "excerpt": "摩根大通——建滔积层板（1888.HK）：量增、利升、份额扩三重催化；2028年净利润预增8倍", "content": "摩根大通——建滔积层板（1888.HK）：量增、利升、份额扩三重催化；2028年净利润预增8倍；首次覆盖予“增持”评级 摩根大通首次覆盖全球最大传统覆铜板（CCL）生产商建滔积层板（KBL），给予增持（Overweight）评级，设定2027年12月目标价65港元，较当前股价隐含41%上行空间。建滔积层板是全球仅有的两家具备全整合PCB材料供应链的企业之一（另一家为南亚塑料）。AI及通用服务器需求爆发导致电子级玻璃布严重短缺，年初至今E-glass价格涨幅超100%，这将显著增厚公司一体化毛利并加速市场份额提升。我们预计2025-2028年每股盈利（EPS）将增长8倍，核心驱动包括：①行业供需缺口及高端化迁移推动CCL综合均价累计上涨150%；②江西与广东产能扩张；③未来两年织布机规模提升75%；④佛冈工厂HVLP1-3铜箔产能放量及HVLP4客户认证突破。目标价对应2026/2027年预期市盈率21倍/13倍，高于其十年历史均值12.5倍。 投资逻辑（三大核心催化） 1. 电子材料超级周期“更高更久”，玻璃布短缺至少持续至2027年 AI服务器迭代正以前所未有的速度拉动高速CCL需求，摩根大通科技团队预计全球AI/HPC CCL市场规模将从2025年的42亿美元增至2027年的120亿美元以上。为生产高端Low-Dk玻璃纤维，行业产能向AI级切换导致传统E-glass供应严重受限——生产Low-Dk 1及以上规格的织机产能转化率下降超60%，加剧全球玻璃布紧缺。建滔积层板已锁定丰田织机未来两年35-40%的供应份额，织布机总数将从2026年的约3,300台增至2028年的约5,800台，带动2025-2028年玻璃布总出货量增加55%（含特种品种），并贡献超50亿港元的净利润增量。我们判断玻璃布价格涨势将至少延续至2027年。与以往仅持续约2年的周期不同，本轮上行周期因AI驱动规格升级与产能转换损失叠加，有望成为史上最长CCL上升周期。 2. 一体化模式赋能利润扩张与市场份额提升 建滔积层板在常规FR4 CCL市场拥有第一大份额，并实现环氧树脂、电子级玻璃纱/布、铜箔等关键原料100%自给。年初至今，公司已宣布7轮FR4 CCL提价，充分传导上游成本压力。在同行（如松下、TUC）因玻璃布短缺被迫退出传统CCL生产的背景下，公司凭借上游保供能力维持100%产能利用率，成功抢夺新客户。展望2027年，江西基地FR4 CCL产能将扩充12%至月产110万张，同时配套增加55%的玻璃纱和13%的铜箔产能，进一步巩固垂直整合优势。我们测算，至2028年，一体化模式将推动公司CCL销量增长13%，玻璃布盈利显著增厚。 3. AI/特种级材料占比提升，切入高速CCL供应链 公司正加速从传统FR4向AI级材料升级：特种玻璃纤维产能计划于2028年前扩充5倍至年产1亿平方米，并通过新建窑炉提升Low-Dk及T-glass产量。目前，公司已开始向EMC、斗山、SYtech等全球前五大高速CCL厂商中的三家批量供货特种玻璃布。同时，2027年将是铜箔业务的关键拐点——佛冈21千吨/年HVLP1-3铜箔产线预计三季度投产，电子级铜箔加工费有望在2026年上涨20-60%。随着2027-2028年下一代CCL普遍采用HVLP4及以上铜箔，公司有望成为继南亚塑料之后第二家具备M6+ CCL全整合供应能力的厂商。此外，通用服务器平台从M6向M7+规格升级将带来翻倍的单位PCB板材价值量，而M7与M8级CCL的毛利率差距已因供应紧张收窄至仅3-5个百分点，通用服务器订单放量将为公司带来“类AI级”的均价与毛利提升。 估值与风险折价 我们的目标价65港元基于2027年预期市盈率20倍（与亚太PCB产业链均值一致），但给予30%估值折扣，以反映投资者对创始家族持股变动或高位配售摊薄的持续担忧。即便如此，当前估值仍具吸引力：尽管预计2028年净利润将增长8倍，公司2026/2027年预期市盈率仅15倍/10倍。我们盈利预测较彭博共识高出19-24%。创始家族近期在股价回调后已重启增持，且持股比例接近30%触发全面要约的红线，短期进一步减持风险有限。 关键风险 • 下行风险：①E-glass/CCL进入下行周期，均价大幅低于预期；②PTFE（聚四氟乙烯）在AI应用中渗透率超预期，替代高端玻璃布及CCL需求；③创始家族持股进一步公众化或配售；④产能扩张导致资本开支超预期，自由现金流承压。 • 上行风险：若行业供需持续紧张，2027年CCL分部经营利润率有望从基准预测的35%升至40%，推动目标价上看80港元。 结论 建滔积层板作为全球覆铜板龙头，在AI与通用服务器双轮驱动的电子材料超级周期中，凭借全整合供应链、锁定关键设备产能及积极的高端化转型，有望实现量、价、利三重扩张。尽管短期面临创始家族持股变动的噪声，但强劲的基本面增长与估值折价提供了极具吸引力的风险回报比，首次覆盖给予增持评级。#文字观点", "publish_time": "2026-09-25 19:01", "tags": ["文字观点"]}, "post:2026-09-25T20-44:6c73bc180c54": {"id": "post:2026-09-25T20-44:6c73bc180c54", "kind": "post", "title": "2026-09-25 20:44", "source_label": "帖子正文", "excerpt": "鹏鼎调研 从整个行业来看，今明两年高端pcb产能都是供不应求，27年供需缺口比今年还严重，28年产能各家产能释放出来以后行业供需缺口会缩小，29年达到平衡。pd主要服务于大型CSP，今年最大客户是微软，明年谷歌", "content": "鹏鼎调研 从整个行业来看，今明两年高端pcb产能都是供不应求，27年供需缺口比今年还严重，28年产能各家产能释放出来以后行业供需缺口会缩小，29年达到平衡。 pd主要服务于大型CSP，今年最大客户是微软，明年谷歌；NV仍在验证中，主要是rubin的oam板；因为产能有限，aws合作业务小。 泰国工厂产能有一半给微软，主要是通孔板和HDI。微软的ASIC规格是五阶HDI，5+12+5结构。 谷歌给出的需求量是一个天文数学，远超芯片厂，PCB厂，CCL材料商的实际供给总量，因此无法满足。V9架构采用6阶28层板（6+16+6），单价接近1K美元。除了台积电，谷歌还和联发科等其他合作，明年获得的芯片产能可能与NV相当甚至可能超过NV。 淮安工厂为中际提供pcb，1.6T二季度开始出货。1.6T和3.2T的slp载板大约十几层，几十美元价格。slp毛利率是HDI的一倍。 设备方面，目前几大PCB厂已经基本锁定所有的设备，HDI相关设备是当前最紧缺的。像国内的大族激光设备订单已经排到28年。估计后面几年的竞争关键在于良率。当前NV这代产品pd的良率比sh高10%以上，但sh会通过压低报价维护其NV份额。#文字观点", "publish_time": "2026-09-25 20:44", "tags": ["文字观点"]}, "attachment:files/中金公司-奥士转债投资价值分析-20260922.pdf": {"id": "attachment:files/中金公司-奥士转债投资价值分析-20260922.pdf", "kind": "attachment", "title": "中金公司-奥士转债投资价值分析-20260922", "source_label": "中金公司", "excerpt": "请仔细阅读在本报告尾部的重要法律声明 1 奥士转债 投资价值 分析 李奎霖 分析员 杨冰 分析员 陈健恒 分析员 SAC 执证编号： S0080524060016 kuilin.li@cicc.com.cn SAC 执证编号： S0080515120002 SFC CE Ref：BOM868 bing.yang@cicc.com.cn SAC 执证编号： S", "content": "请仔细阅读在本报告尾部的重要法律声明 1 奥士转债 投资价值 分析 李奎霖 分析员 杨冰 分析员 陈健恒 分析员 SAC 执证编号： S0080524060016 kuilin.li@cicc.com.cn SAC 执证编号： S0080515120002 SFC CE Ref：BOM868 bing.yang@cicc.com.cn SAC 执证编号： S0080511030011 SFC CE Ref ：BBM220 chenjh@cicc.com.cn 概要 奥士康公告转债发行，规模 10.00亿元，设有原股东优先配售（每股配售 3.2104元面值）及网上申 购，T日为 9月23日（周三） ，主体与债项评级均为 AA、不设担保。根据我们的新券定价模型，我 们认为其在当前平价下的上市定位可能在 139—145元区间，对应转股溢价率约 38%—44%。 正股分析 发行人奥士康是内资刚性 PCB头部制造商之一，产品以四层及以上多层板为主，境外收入占比过 半。公司下游覆盖通信及数据中心、汽车电子、消费电子、能源电力、工业控制与医疗设备等领 域，主要客户包括中兴、捷普、富士康等， 2026年上半年前五大客户销售占比 26.12%，不存在单 一客户依赖。据募集说明书， 2024年公司在中国电子电路行业协会（ CPCA）内资 PCB百强中排名 第11位，在 Prismark 全球 PCB百强中排名第 36位。公司生产基地位于湖南益阳、广东肇庆，并 于2024年第四季度投产泰国工厂； 2025年、2026年上半年境外收入占主营业务收入比重分别为 61.21%、53.76%，以美元结算为主。 公司增收不增利，原材料涨价与泰国基地爬坡压制盈利， 2026年二季度起边际改善。 2021 -2025年 营收 CAGR为5.67%。2021 -2025年归母净利润 CAGR为-10.97%。公司 2025年实现营业收入 55.30亿元（ YoY+21.11% ） 、归母净利润 3.08亿元（ YoY-12.84%）；2026年上半年实现营业收入 29.87亿元（ YoY+16.45% ） 、归母净利润 0.83亿元（ YoY-57.79%） ，销售毛利率 20.05%、同比下 降2.29个百分点。 分产品来看， 2026年上半年四层板及以上板收入 21.92亿元，占主营业务收入 81.99%，其中高多 层板及 HDI板收入 13.69亿元，占比由 2023年的 42.30%升至 51.22%；主营业务毛利率为 11.50%、同比下降 4.38个百分点 ，主要系含铜材料与金盐采购价格上涨 拖累。2026年上半年公司 其他业务（以废料销售为主）贡献毛利 2.91亿元，占综合毛利的 48.65%，主营 PCB业务的盈利较 薄。横向对比，行业普遍受原材料涨价挤压，景旺电子、崇达技术 2026年上半年扣非净利润同比分 别下降 13.33%、31.99%，而 AI服务器业务占比较高的胜宏科技同比增长 12.50%。我们认为公司 的核心看点与增长逻辑在于： 1）涨价传导开始落地，二季度盈利环比修复，在手订单价格显著抬升。 公司主要产品单价在 2026 年逐季上行，二季度产品平均售价 776.90元/平方米、环比提升 12.66%，带动二季度扣非净利润 0.61亿元、环比增长 247.35% ，营业毛利 3.24亿元、同比增长 10.70%。据募集说明书，截至 2026 年8月31日公司在手订单 28.84亿元，其中高多层板及 HDI板平均单价为 2,057.85 元/平方米，较 二季度提升 69.89%。与此同时，二季度 LME铜价环比涨幅 3.78%、金价环比回落 8.98%，成本端 压力有所缓和。我们认为盈利修复的方向较为明确，但在手订单单价的大幅抬升同时包含产品结构 变化，难以完全归因于同品类提价，下半年毛利率修复幅度是验证成本传导能 力的关键。 2）产品结构向高多层板及 HDI板倾斜，但高端化尚未转化为盈利优势。 公司高多层板及 HDI板收 入占比持续提升，产能利用率维持在较高水平（ 2025年88.01%、2026年上半年 86.45%），2025 年总产能 875.54万平方米。但与同业相比，公司盈利能力仍有差距：据募集说明书， 2026年上半 年公司主营业务毛利率 11.50%，低于可比公司均值 15.78%，与景旺电子（ 13.86%）接近，明显低 于胜宏科技（ 28.58%） 、生益电子（ 31.21%）等 AI服务器业务占比较高的同业。我们认为公司在 AI 服务器、高速网络等高价值场景的渗透仍处导入阶段，高端化目前体现为收入结构而非利润结构， 简评 证券研究报告 2026.09.22 本研报版权归中国国际金融股份有限公司（中金公司）所有，仅限中金公司授权杭州同花顺数据开发有限公司在iFinD金融终端和APP展示给白名单客户查阅。未经中金公司书面许可，任何机构和个人不得以 任何形式将研报内容和相关信息对外公布、转发、转载、传播、复制、编辑、修改等。如有上述违法行为，中金公司保留追究相关方法律责任的权利。 请仔细阅读在本报告尾部的重要法律声明 2 后续需关注 AI服务器等领域客户导入及订单放量进度。 3）泰国基地爬坡是短期拖累，也是中期承接海外订单的产能基础。 泰国工厂于 2024年第四季度投 产，营收贡献尚在爬坡、规模效应未充分显现，单位折旧与人工成本上升对毛利率形成阶段性拖 累；截至 2026年6月末，泰国生产基地项目预计仍有 4.74亿元工程及设备等资本性开支。我们认 为泰国基地有助于公司应对海外客户的供应链多元化要求，但其扭亏节奏仍需跟踪，未来可关注泰 国工厂的产能利用率与盈亏平衡 进度。 本次可转债拟募集资金总额 10.00亿元，扣除发行费用后全部投向由全资子公司广东喜珍电路科技 有限公司实施的 \"高端印制电路板项目 \"（项目总投资 18.20亿元） ，达产后将形成年产 84万平方米高 多层板及 HDI板产能，约为公司 2025年总产能的 9.6%。我们认为本次募投有 种布验证不及预期、竞争加剧、行业投放产能不及预期等。 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-09-25T19-01:977eff1e171c": {"id": "post:2026-09-25T19-01:977eff1e171c", "kind": "post", "title": "2026-09-25 19:01", "source_label": "帖子正文", "excerpt": "摩根大通——中国AI价值链：不断扩大的蛋糕与价值争夺——扩大覆盖范围；阿里巴巴、腾讯和智谱（Zhipu）是我们的首选标的 核心结论：摩根大通首次对中国AI产业链进行系统性覆盖，给予行业建设性展望。", "content": "摩根大通——中国AI价值链：不断扩大的蛋糕与价值争夺——扩大覆盖范围；阿里巴巴、腾讯和智谱（Zhipu）是我们的首选标的 核心结论：摩根大通首次对中国AI产业链进行系统性覆盖，给予行业建设性展望。预计2026E-2030E期间，中国AI价值链将累计创造5,440亿美元营业利润，其中模型与应用层贡献行业利润总额的三分之一，并贡献2026E至2030E年度盈利增幅的近三分之二（64%）。当前模型与应用层仅占中国AI相关上市市值约14%，市场定价仍锚定现有营收分布，尚未充分反映摩根士丹利（原文为摩根大通）模型所隐含的收入与盈利结构性迁移。基于机会×稀缺性×价值捕获（Opportunity × Scarcity × Value Capture）框架，报告首选阿里巴巴、腾讯、智谱（Zhipu），并对其余9家公司启动覆盖或假设覆盖。 智能消费指数级增长驱动全链条扩张：预计中国AI推理token消耗量2026E-2030E将增长约60倍，2030年约69%来自企业端（编码、客服、运营等嵌入式工作流），31%来自消费端。token需求扩张由双重引擎驱动：前沿模型能力解锁更复杂任务，推理成本下降将成熟能力下沉至更广泛客群。企业工作流提供持续、可预期的消耗基底，消费端则贡献规模经济与长尾用例。终端客户支出锚定1.4万亿美元全球AI总可寻址市场（TAM，2030E），其中中国约占四分之一（约3,500亿美元），B2B约2,500亿美元（AI智能体/副驾驶/AI赋能SaaS），B2C约1,000亿美元。该估算基于现有劳动力与服务经济学，AI替代人工或外包的经济价值构成支付意愿基础。 利润池结构性迁移：从基础设施向上游向下游变现转移：2026E硬件占价值链营业利润93%，但到2030E将降至30%；云层利润占比由7%升至15%（2030E）；模型与应用层由亏损转为2030E占行业利润54%。2028E为关键拐点——下游层营业利润首度转正（6.2亿美元），毛利率达40%，训练支出降至下游营收约25%。2026E-2030E累计营业利润中，硬件占53%（286亿美元），云占16%（86亿美元），模型与应用占32%（172亿美元）。增长贡献高度集中于2030E——下游约四分之三的五年累计利润将在最后一年兑现，凸显选股中融资能力与终端年敏感度的关键性。 预测方法论：\"一美元投资，三次获利\"：模型自下而上构建，以中国超大规模企业2026E-2030E累计7,780亿美元云资本开支为起点。同一美元投资在三层中被三次确认：硬件于采购时点确认营收（2026E 100亿美元→2030E 184.8亿美元，累计777.6亿美元）；云层在资产5年服务期内通过训练/推理重复变现（营收由20亿美元增至249亿美元，12.5倍）；模型与应用层基于推理容量产生的毛利扣减训练成本后确认利润（营收由157亿美元增至4,234亿美元，26.9倍）。各层营收存在重叠，不可加总为终端支出；营业利润具备可加性，是跨层价值分配的核心指标。关键假设包括：云营收收益率0.50倍（年增4%）、利用率逐年爬坡至80%、下游毛利率由30%升至50%、训练/推理占云收入比由45/55演变为15/85。 投资框架：机会×稀缺性×价值捕获： • 机会：以工作流周边的经济池为起点，衡量token消耗、可触达客户支出规模。 • 稀缺性：识别难以复制或替代的能力。稀缺性随模型进步与跨层扩张而迁移——由初期算力/前沿模型能力，逐步转向部署瓶颈、执行权限与工作流状态。通用内容生成与基础分析易被复制，而实时工作流状态、权限控制与交易执行构成持久壁垒。 • 价值捕获：稀缺性须转化为定价权、留存率、单任务推理成本优势与毛利扩张。云厂商通过异构计算优化与分发变现；模型厂商通过基础设施效率、专有工具链（harness）与智能体变现；中间件厂商将实施工作转化为可复用软件；应用厂商向智能体开放数据与操作权限。 • 估值：优质经济模型仍需提供股价上行空间。报告对阿里巴巴、腾讯、智谱的目标价隐含53%至170%上行潜力，其余覆盖标的基于2027E-2028E盈利或2030E折现估值。 首选标的与评级详情： • 阿里巴巴（BABA/9988.HK）— 增持，目标价210美元/205港元（上行81%/79%）：跨层稀缺性+产能回报。平头哥（T-Head）芯片、阿里云与通义千问（Qwen）生态提供硬件/云/模型三层一体化参与。假设更强营收收益率与更快利用率，增量产能税后IRR约26.6%（行业均值10%）。 • 腾讯（700.HK）— 增持，目标价690港元（上行53%）：未被定价的稀缺应用资产+执行捕获。分发网络、专有上下文与交易执行直接对接现有消费与商业活动，AI应用资产当前市场定价极低。 • 智谱（Zhipu，2513.HK）— 增持，目标价2,000港元（上行170%）：差异化智能稀缺性+下游捕获。模型能力与商业 traction 支撑智能稀缺性，专有工具链延伸收费点。 其余覆盖标的： • 增持：商汤（20.HK，目标价2.0港元，+58%）— 优化稀缺+部署捕获；Phancy（6682.HK，目标价50港元，+78%）— 异构计算优化+部署捕获；Xunce（3317.HK，目标价160港元，+54%）— 企业上下文+产品化；金山办公（688111.CH，目标价325元，+40%）— 分发+工作流捕获。 • 中性：MiniMax（100.HK，目标价300港元，+5%）— 机会大但变现待验证；JST（6687.HK，目标价14港元，+8%）— 工作流资产强但受电商周期与估值抵消；美图（1357.HK，目标价4.5港元，+10%）— TAM扩张但模型级替代风险上升；金蝶（268.HK，目标价8.3港元，+5%）— 系统记录稀缺但捕获待显；Manycore（68.HK，目标价7港元，-14%）— 工作流+专有空间上下文但变现早期。 • 减持：用友（600588.CH，目标价6元，-39%）— 战略稀缺性强但财务转化疲弱。 关键风险：智能消费增长慢于预期；公司特定稀缺性被侵蚀；采用率向毛利与现金流的转化弱于预期；下游利润高度集中于2030E导致终端年假设敏感度极高；硬件与云层投资回报不及预期可能制约整体价值链扩张。#文字观点", "publish_time": "2026-09-25 19:01", "tags": ["文字观点"]}, "post:2026-09-25T10-06:12b3a6b5ae45": {"id": "post:2026-09-25T10-06:12b3a6b5ae45", "kind": "post", "title": "2026-09-25 10:06", "source_label": "帖子正文", "excerpt": "【华西电子卜灿华团队】瀚天天成公布巨额增购合作，SiC产业景气度再度验证 根据瀚天天成9.24公告，公司一客户同意增购外延片，最高销售额约为9580万美元（约7.5亿港币）。如按最高金额计算，则该采购事项贡献营收有望超过25年整体营收80%。", "content": "【华西电子卜灿华团队】瀚天天成公布巨额增购合作，SiC产业景气度再度验证 根据瀚天天成9.24公告，公司一客户同意增购外延片，最高销售额约为9580万美元（约7.5亿港币）。如按最高金额计算，则该采购事项贡献营收有望超过25年整体营收80%。 📈碳化硅需求爆发 ➠根据瀚天天成公告，该客户为SiC行业全球领导者，也为上市公司，该采购事项将于26年底前交付客户。 ➠25年公司第一大客户占比35%，如该采购事项按最高额落地，预计将为25年第一大客户全年采购量240%+。 🔥上游验证碳化硅行业需求景气度高企 ➠根据天岳先进9月公告，公司碳化硅衬底产品销量实现显著增长，市场需求呈现积极释放态势，现阶段公司产能供给已较为紧张，#预计下半年产能将更加紧张。 🌟#我们认为碳化硅行业已经进入高速成长期，AI、工业、消费、车规等多方位需求持续增长，根据我们此前深度报告，我们预计SiC衬底需求有望从25年的85亿元增长至未来约2000亿元，坚定看好碳化硅行业未来高速增长趋势。 📋受益标的 #设备： 晶升股份、新益昌、联动科技等； #衬底： 天岳先进、三安光电、晶盛机电等； #外延： 瀚天天成、天域半导体等； #芯片器件： 新洁能、芯联集成、士兰微、扬杰科技、宏微科技、时代电气、基本半导体等； #SST： 阳光电源、金盘科技、四方股份等。 风险提示：行业竞争加剧风险、订单落地交付风险等。 具体信息欢迎联系华西电子卜灿华团队/卜灿华(SAC：S1120524120006)17773137781#文字观点", "publish_time": "2026-09-25 10:06", "tags": ["文字观点"]}, "attachment:files/中泰证券-煤炭行业点评报告：制度阀门越拧越紧，煤矿生产管控全面趋严-260924.pdf": {"id": "attachment:files/中泰证券-煤炭行业点评报告：制度阀门越拧越紧，煤矿生产管控全面趋严-260924.pdf", "kind": "attachment", "title": "中泰证券-煤炭行业点评报告：制度阀门越拧越紧，煤矿生产管控全面趋严-260924", "source_label": "中泰证券", "excerpt": "请务必阅读正文之后的重要声明部分制度阀门越拧越紧：煤矿生产管控全面趋严 煤炭", "content": "请务必阅读正文之后的重要声明部分制度阀门越拧越紧：煤矿生产管控全面趋严 煤炭证券研究报告/行业点评报告 2026年09月24日 评级：增持（维持） 分析师：杜冲 执业证书编号：S0740522040001 Email：duchong@zts.com.cn 基本状况 上市公司数 33 行业总市值(亿元) 22,218.01 行业流通市值(亿元) 20,848.52 行业-市场走势对比 相关报告 1、《煤价高位震荡蓄势，关注板块配 置机会》2026-09-19 2、《迎接煤炭新周期，徐行未止积极 布局》2026-09-12 3、《煤价股价不同步，积极把握加仓 机遇》2026-09-05投资要点 2025下半年以来，国家层面集中修订煤矿安全生产相关制度，叠加煤炭主产地出台地 方专项监管新规，我国煤矿监管体系从安全生产、产能管控两大维度同步收紧。监管 逻辑由事后处罚转向全流程、全链条穿透式监管：安全生产端强化重大灾害治理、反 “三违”、隐患动态清零，责任链条延伸至上级集团、实际控制人；产能管控端明确超 能力生产重大事故隐患判定标准，通过许可管理、执法惩戒约束产量释放。整体来看， 煤炭生产制度阀门持续拧紧，煤矿合规生产约束显著增强，超产行为认定更清晰、查 处力度更大，煤矿超产难度持续提升。 安全生产视角：制度密集修订，全链条安全约束持续加码。本轮监管改革围绕制度建 设、执法追责、地方落地三层推进，覆盖灾害防治、现场作业、隐患治理、主体责任、 许可监管全流程，安全监管从事后处置向事前预防、过程管控转变。 国家层面基础制度集中迭代，压实生产全过程安全底线。（一）重大灾害防治技术标准 全面升级：《煤矿安全规程》全面修订，煤矿安全基础制度和技术要求进一步完善。 2025年7月，应急管理部发布《煤矿安全规程》（应急管理部令第17号），自2026 年2月1日起施行。根据国家矿山安全监察局新版《煤矿安全规程》专题新闻发布会 介绍，本次修订是《煤矿安全规程》自1951年发布以来的第16次修订，与上版相比 新增56条、实质性修改353条，重点围绕“实、准、放、清、智”五个方面，进一 步强化重大灾害防治、安全技术管理、露天煤矿安全、设计及井巷布置和隐蔽致灾因 素普查等方面；（二）现场作业强化管控与“闭环”管理：瓦斯治理精准管控与“三违” 治理强化闭环管理。《关于进一步加强煤矿瓦斯防治工作的紧急通知》从提高政治站 位、压实制度体系、聚焦核心环节、强化现场管控和强化监管执法五个方面部署瓦斯 防治工作，重点强化隐蔽致灾因素普查、通风系统管理、瓦斯抽采、防突措施、安全 监控和高风险环节管控。《关于加强矿山企业反“三违”工作的通知》建立“预防—发 现—查处—分析—帮教—回访”闭环管理机制，推进“无视频不作业”和AI智能反 “三违”技术应用，明确事故隐患未消除前不得开展作业。对严重三违人员实施停岗 学习、家属帮教、返岗承诺，强化人的行为管控。（三）重大事故隐患判定标准细化： 通过封闭式列举+量化阈值+数据穿透，让隐患认定更科学、精准。新版《煤矿重大事 故隐患判定标准》（应急管理部令第21号，2026‑07‑01实施）划分17大类重大隐患， 把生产组织、采掘工作面数量、单班作业人数纳入隐患判定，将安全风险从灾害风险 延伸至生产组织风险。（四）安全生产许可范围和持续管理要求强化：新版《煤矿企业 安全生产许可证实施办法》（应急管理部令第22号，2027-01-01实施）中许可对象 拓展至煤矿上级企业法人、煤层气地面开采企业；发证调整为省级统一发证，开采条 件发生变化（托管、瓦斯等级、水文地质、冲击地压）应当办理许可变更；延续煤矿 取得许可证后不得降低安全生产条件，不满足条件不得开展生产的要求。 监管执法与责任追究穿透升级，违法违规成本抬升。我国煤矿安全监管执法与责任追 究相关制度集中完善，监管要求依次覆盖行政处罚、隐患治理、企业主体责任和监管 监察履职等环节。执法体系不再只针对事故结果处罚，转向隐患排查、过程违法的全 过程执法，责任链条穿透到集团总部、实际控制人、最终受益人。（一）行政处罚工具 扩容，现场强制处置手段完善。修订《安全生产违法行为行政处罚办法》（应急管理部 令第18号，2026‑02‑01实施），新增没收非法财物、限制从业、限制生产经营等处 罚；重大隐患无法保证安全时可撤人停产，拒不执行的可停止供电、停供民用爆炸物 品，强化现场即时处置能力。（二）重大事故安全隐患全环节实现动态清零。《煤矿重 大事故隐患动态清零办法》围绕企业自查、行政检查执法、举报核查、全量汇总、跟 踪督办和整改销号等环节，压实重大事故隐患排查治理“一件事”全链条责任。重大 隐患必须实现动态清零，未治理完成不得采掘生产。（三）主体责任向上级公司、实际 控制人延伸。《关于进一步加强矿山企业安全生产主体责任落实的指导意见》，将法定 代表人、实际控制人、实际负责人、最终受益人、幕后操控人全部纳入安全生产第一 责任人；要求煤矿主要负责人每月现场检查不少于1次、带班下井不少于5个；严禁 上级企业向下属煤矿下达超能力生产计划与经营指标；严禁以包代管、违法外包。多 仅供内部参考，请勿外传 行业点评报告 -2- 请务必阅读正文之后的重要声明部分层级集团需要压缩安全管理层级，建立覆盖实际控制人的全员安全生产责任制。（四） 开展三级突出问题专项整治。《关于开展矿山安全生产突出问题整治的通知》同时覆盖 企业、地方监管、国家监察三个层面。企业端严查隐蔽工作面、监控数据造假、转包 分包；地方监管纠治打卡式履职、有案不立、以罚代刑；国家监察层面整治人情执法、 重罚款轻隐患整改；对举报舆情线索开展回头查回头看，从企业到监管全链条压实责 任。 煤炭主产地出台地方新规，进一步细化落地安全红线。内蒙古、山西作为国内煤炭核 心主产地，出台地方性刚性规定，把国家政策进一步细化为可落地的禁止性条款，填 补地方监管细则。内蒙古“十条”和山西“十七条”共同体现出地方煤矿安全监管趋 严、趋细、趋实，主要表现为：（一）安全生产红线进一步刚性化。两大主产区均将隐 蔽工作面、人员入井、灾害治理、外委施工和停产停建煤矿等列为重点管控对象，推 动安全要求转向明确的禁止性和强制性要求。（二）监管范围从矿井现场延伸至生产经 营全链条。内蒙古重点强调作业审批、风险研判、灾害治理、数据上传和应急撤人； 山西进一步将监控数据、劳务外包、煤炭产销、“五量”数据、税务审计及违法“四链” 纳入监管。（三）部门协同和责任落实机制进一步强化。内蒙古要求外委施工队伍、第 三方服务机构100％向安全监管监察部门报备，“三堂一舍”等地面建筑及各类灾害治 理项目100％明确安全管理责任、落实安全管理职责；山西进一步落实“三管三必须” 实施细则和煤矿安全管理职责清单，加强地方煤矿安全监管机构建设，改革煤矿安全 监管人员派驻制度，并通过巡查考核、审计监督、税务监管和“行刑纪”衔接强化部门协 同与责任追究。 产能管控视角：超产认定清晰化，超产难度持续加大。本轮政策并非简单行政压减产 量，而是通过隐患判定、上级企业责任约束、安全生产许可证动态监管、执法处罚多 套工具，把超能力生产纳入重大事故隐患，从制度源头约束超产行为，煤矿想要实现 超产的制度空间显著压缩。（一）量化判定标准细化，重大事故隐患认定严格。新版《煤 矿重大事故隐患判定标准》给出明确量化阈值：煤矿全年原煤产量超过核定（设计） 生产能力的110%，或者井工煤矿季度原煤产量超过核定（设计）生产能力的30%， 直接认定为“超能力、超强度或者超定员组织生产”重大事故隐患。同时将采掘工作 面数量、单班作业人数纳入重大隐患判定。量化更严，堵住冲量漏洞。（二）从源头约 束集团考核导向，禁止下达超能力生产指标。《关于进一步加强矿山企业安全生产主体 责任落实的指导意见》（矿安〔2026〕77号）严格上级公司管理责任“矿山企业上级 公司主要负责人每半年到生产现场督促检查安全生产工作不少于1次，严禁超能力下 达生产计划或者经营指标。”从“谁来下指标”的层面压实上级公司责任，严控超能力 生产。（三）安全生产许可证动态监管，生产条件变化应当变更许可。新版《煤矿企业 安全生产许可证实施办法》把开采技术条件变化纳入许可变更。当矿井生产条件、灾 害等级发生改变，需要重新核查安全条件。过去煤矿的瓦斯等级、水文地质类型、冲 击地压危险性等条件可能随开采深度和范围发生变化，但许可证信息长期不变，导致 监管与实际脱节。如果生产条件恶化，不能继续满负荷生产。（四）地方主产地配套细 化监管，挤压超产操作空间。内蒙古、山西地方新规，严控隐蔽工作面 03cli>**主线：AI算力/大模型与\u003c/li>\n\u003cli>今天强化的逻辑：Muse用户快速增长验证海外C端生活类场景需求；国内映射更适合。\u003c/li>\n\u003cli>今天出现的催化/验证：Muse首14天累计下载约283.4万次、单日最高35.8万次；腾讯小微有望成为中国首选代理式AI助手；中国AI价值链覆盖首选阿里巴巴、腾讯和智谱；AI应用参考关注从WorkBuddy看生产力Agent发展，Kimi推出金融行业解决方案、Co-Work应用场景正在打开。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：半导体/先进封装/存储\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：供需缺口持续扩大并延续至2027，市场辩论焦点转向周期持续性；NAND定价2027年第三、四季度见顶；长鑫存储供应增长已纳入预测，但安装、良率及技术差距使市场对产能扩张的担忧有些过度。\u003c/li>\n\u003cli>今天出现的催化/验证：美光2026财年第四财季前瞻；DRAM订单履行率约60%；HBM 2027财年比特出货量预估约117.2亿Gb；瀚天天成客户同意增购外延片，最高销售额约9580万美元，按最高金额计算贡献营收有望超过2025年整体营收80%，SiC产业景气度再度验证。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：PCB/CCL/铜箔/电子布\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：高端PCB供不应求，2027年供需缺口比今年还严重，2028年缩小、2029年达到平衡；CCL一体化模式赋能利润扩张与份额提升，关键原料100%自给，下一代CCL普遍采用HVLP4及以上铜箔趋势明确。\u003c/li>\n\u003cli>今天出现的催化/验证：建滔积层板2028年净利润预增8倍；鹏鼎调研高端PCB供需；铜箔股价分化，HVLP落地执行受关注；电子布需求景气，国产设备迎扩容窗口；奥士转债投资价值分析显示，胜宏科技AI服务器业务占比较高，2026年上半年扣非净利润同比增长12.50%，但主营业务毛利率11.50%，低于可比公司。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：新能源/汽车/机器人\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：特斯拉交付预测高于一致预期，储能增长强劲；投资者焦点完全集中于特斯拉向物理AI公司转型，包括Robotaxi、Optimus人形机器人、Terafab、太阳能等AI业务叙事；人形机器人零部件供应与设备出货形成订单验证。\u003c/li>\n\u003cli>今天出现的催化/验证：特斯拉3Q26交付约47.0万辆，储能16.9GWh；继峰股份获座椅总成定点，生命周期总金额92亿元；恒立液压在美国头部人形机器人客户零部件供应占比≥70%，单台价值约15000元；瑞松科技国内首条MPO整线设备下单，国产存储探针台与下游原厂合作加速，27/28年对应800-1000台/2000-2500台六轴机器人本体，对应12/30亿产线收入、3/8亿利润增量；富乐德受益800V新能源汽车渗透率提升、光模块TEC、半导体扩产上行周期，26-28年业绩有望达5/10/15e。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：宏观/策略/利率与地缘\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：央行26Q3货币政策委员会例会延续适度宽松，强化逆周期调节，同步推进框架改革、汇率预期管理与结构性支持；删除“跨周期”，保留“逆周期”；汇率部分首次出现“防范市场羊群效应和非理性预期的自我强化”，指向人民币单边升值趋势，重斜率、不控方向；银行流动性支撑稳固，信贷投放更趋结构化，行业由规模驱动向结构、定价、效率驱动转型。风险提示为宏观经济修复不及预期。\u003c/li>\n\u003cli>今天出现的催化/验证：美国30年期国债收益率触及2004年以来最高水平后债券抛售加剧；油价高企加剧通胀担忧，长期国债收益率升至数十年来的最高水平，并增加美联储进一步加息可能性，亚洲债券和股票预计进一步下跌；美联储公布稳定币发行机构提案；伊朗要求重新开放霍尔木兹海峡并重启谈判，美国有七天时间满足条件。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：光通信/CPO\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：燕麦科技战投亿源通，卡位光器件赛道，双向协同打开成长天花板；亿源通是国内无源光通信器件头部ODM/JDM厂商，具有26年行业经验，员工人数3000+，主营CPO光组件、PLC分路器、WDM波分复用器等核心光器件，深度覆盖AI数据中心、5G/6G、云计算等高景气赛道。\u003c/li>\n\u003cli>今天出现的催化/验证：燕麦科技拟以自有资金5722万元溢价增资亿源通，投后持股10%，投前整体估值5.1亿元；标的将被认定为联营企业，不纳入合并报表，按10%持股比例确认净损益份额；优利德VNA、1.6T光模块采样示波器等新产品有望接力亮相；霍莱沃开关矩阵+VNA被视为国产替换关键；大中华区科技硬件中国BEST大会反馈覆盖AI基础设施、智能手机供应链及新兴硬件品类。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>AI应用：Muse上线首14天累计下载约283.4万次，单日下载最高达35.8万次；腾讯微信“小微”灰测进展受关注，有观点认为其有望成为中国首选代理式AI助手；中国AI价值链首次被系统性覆盖，首选阿里巴巴、腾讯和智谱。\u003c/li>\n\u003cli>半导体存储：美光前瞻显示DRAM订单履行率约60%、供需缺口延续至2027；NAND定价预计2027年第三、四季度见顶，长江存储新增产能转向DRAM；长鑫存储DRAM比特份额从2025年7%升至2027年9%；HBM 2027财年比特出货量预估约117.2亿Gb，较此前微上调；瀚天天成客户增购外延片最高约9580万美元。\u003c/li>\n\u003cli>AI映射：第六版全球AI股票映射报告覆盖约3,600只全球股票，AI交易从“赋能者”转向杠铃型机会组合；AI在美国家庭渗透仅3年达50%，速度为移动互联时代2倍。\u003c/li>\n\u003cli>PCB/铜箔：建滔积层板2028年净利润预增8倍；鹏鼎调研称高端PCB今明两年供不应求，2027年缺口比今年严重；铜箔股价分化，德福科技本月上涨15%，三井金属下跌22%、科泰材料下跌8%；电子布需求景气，国产设备迎扩容窗口；HDI相关设备是当前最紧缺环节。\u003c/li>\n\u003cli>新能源/机器人：特斯拉3Q26交付预测约47.0万辆、储能16.9GWh；继峰股份获座椅总成定点，2028年5月量产、总额92亿元；恒立液压在美国头部人形机器人客户零部件供应占比≥70%，单台价值约15000元；瑞松科技MPO整线设备下单，国产存储探针台与下游原厂合作加速。\u003c/li>\n\u003cli>宏观：央行26Q3例会点评删除“跨周期”，保留“逆周期”；汇率部分首次出现防范羊群效应和非理性预期自我强化；美联储公布稳定币发行机构提案；美国30年期国债收益率触及2004年以来最高，债券抛售加剧；油价高企加剧通胀担忧。\u003c/li>\n\u003cli>其他产业变化：甲骨文就Project Jupiter发出不可抗力通知，若项目未按2028年上线希望推迟付款，甲骨文仍为主要租户并非退出，项目约2.5GW，占2027-2028年美国数据中心预测建设量4-5%，拟由Bloom Energy燃料电池供电；国网主网招标仍有承压，电表招标量大幅回暖；北京现房销售细则土地出让金首付50%、可分期两年、新预售需主体结构封顶；诺诚健华与礼来合作总额最高33.5亿美元；SpaceX赢得五角大楼合同令竞争对手压力倍增；CSCO年会调研显示小细胞肺癌、双抗、ADC成为关键词。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>腾讯微信“小微”灰测进展、Muse用户增长与C端生活类场景需求持续性；中国AI价值链首选标的后续验证。\u003c/li>\n\u003cli>美光2026财年第四财季前瞻及全年指引底线预期；DRAM/NAND供需缺口、长江存储产能转向、长鑫存储实际扩产与良率；HBM 2027财年出货预估兑现。\u003c/li>\n\u003cli>第六版全球AI股票映射报告后的广度扩散与杠铃型组合表现；AI在美国家庭渗透率是否延续。\u003c/li>\n\u003cli>高端PCB供需缺口：2027年是否比今年严重、2028年缩小、2029年平衡；HDI设备紧缺；HVLP铜箔落地执行；建滔积层板2027-2028年M6+ CCL全整合供应及2028年净利润预增8倍兑现；电子布国产设备扩容。\u003c/li>\n\u003cli>特斯拉3Q26交付，公司收集的一致预期预计约一周内发布；储能16.9GWh、Robotaxi/Optimus/Terafab/太阳能叙事；继峰股份定点2028年5月量产；恒立液压人形机器人供应占比与单台价值；瑞松科技MPO设备27/28年出货与利润增量。\u003c/li>\n\u003cli>央行货币政策框架改革、汇率预期管理、银行竞争格局重塑；美联储稳定币监管提案、AI安全标准机构年底或2027年初启动；伊朗霍尔木兹海峡协议七天期限及后续谈判；美国长端利率与油价对通胀和加息预期影响。\u003c/li>\n\u003cli>甲骨文Project Jupiter是否按2028年上线及付款推迟影响，Bloom Energy客户多元化；国网后续招标、电表回暖持续性；北京现房销售细则执行；诺诚健华与礼来合作项目推进；CSCO/WCLC临床数据更新；SpaceX五角大楼合同后续。\u003c/li>\n\u003cli>光通信：燕麦科技与亿源通协同、亿源通联营企业投资收益确认；优利德VNA、1.6T光模块采样示波器；霍莱沃开关矩阵与VNA国产替换；中国BEST大会反馈的AI基础设施、智能手机供应链及新兴硬件品类。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>08:43｜【中泰先进产业】燕麦科技战投亿源通，卡位光器件赛道，双向协同打开成长天花板 #事件：9月24日燕麦科技披露拟以自有资金5722万元溢价增资亿源通，投后持股10%，对应标的投前整体估值 5.1 亿元。#标的质地：亿源通是国内无源光通信器件头部 ODM/JDM 厂商，国家级高新技术企业、省级专精特新企业，具有26年行业经验，员工人数3000+，主营 CPO 光组件、PLC 分路器、WDM 波分复用器等核心光器件，深度覆盖 AI 数据中心、5\u003c/li>\n\u003cli>08:44｜美联储周四公布了稳定币发行机构的提案 ，这是监管机构推进加密货币规则制定的最新举措。\u003c/li>\n\u003cli>08:44｜Anthropic 与 Akamai 达成价值 120 亿美元的人工智能计算协议\u003c/li>\n\u003cli>08:44｜Meta 创下自 2013 年以来最佳单月表现，市值逼近 2 万亿美元大关。\u003c/li>\n\u003cli>08:44｜谷歌 、OpenAI 和 Anthropic 正在推进一项计划，拟自行创建一个以人工智能安全为重点的新标准机构，不受政府监管，希望在年底或 2027 年初启动该机构。\u003c/li>\n\u003cli>08:44｜美国和伊朗正在探讨分阶段开放霍尔木兹海峡的协议。\u003c/li>\n\u003cli>08:44｜市场综述：周五，由于油价高企加剧了通胀担忧，长期国债收益率升至数十年来的最高水平，并增加了美联储进一步加息的可能性，亚洲债券和股票预计将进一步下跌。\u003c/li>\n\u003cli>08:44｜【国金电新】甲骨文“不可抗力”通知点评：正常商业应对，BE客户多元化加速，单一项目扰动有限-2609249月24日Bloomberg报道，甲骨文向Project Jupiter开发商发出不可抗力通知，若项目未按2028年上线，希望推迟付款。甲骨文仍为主要租户，并非退出。\u003c/li>\n\u003cli>08:45｜伊朗表示，已向美国提出一项新方案，要求重新开放霍尔木兹海峡，并重启谈判，以达成“最终协议”。外交部长阿巴斯·阿拉格奇表示，美国在接受该提议后有七天时间来满足根据六月份伊斯兰堡协议制定的未公开条件，该协议涵盖解除制裁、冻结资产和结束军事行动。\u003c/li>\n\u003cli>08:45｜伊朗总统马苏德·佩泽什基安： 我们面临的问题之一是，我们在中国的资金被冻结了。我们甚至无法将自己向其提供货物的国家的资金取回，更不用说用这些资金支付给世界其他角落的人了。\u003c/li>\n\u003cli>08:45｜伊朗总统： 我们确实与特朗普达成了协议。该协议已经签署，基于此，我们愿意并且仍然希望继续推进，并且双方已经就框架达成一致。\u003c/li>\n\u003cli>08:45｜Anthropic PBC 宣布其 Claude AI 模型发现了一种类似于早期突破性基因编辑技术的酶系统，但该领域的一些专家对此表示谨慎，他们认为该公司夸大了其重要性。\u003c/
