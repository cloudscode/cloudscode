"呈和科技", "东材科技", "文字观点"]}, "post:2026-10-07T23-30:a4edaec02d14": {"id": "post:2026-10-07T23-30:a4edaec02d14", "kind": "post", "title": "2026-10-07 23:30", "source_label": "帖子正文", "excerpt": "各位领导好，我们更新了中信电子组【电子亮马组合】26年10月/Q4的金股组合如下，供领导们参考：【26M10-月度金股5只】：三环集团（MLCC涨价）、聚辰股份（AI存储）、睿创微", "content": "", "publish_time": "2026-10-07 23:30", "tags": ["文字观点"]}, "post:2026-10-07T23-30:451433dbc16a": {"id": "post:2026-10-07T23-30:451433dbc16a", "kind": "post", "title": "2026-10-07 23:30", "source_label": "帖子正文", "excerpt": "看好光通信20261007 政策：外资券商研报提到“FCC对光收发器的潜在规定更可能以3.2T规格为切入点”和“可能设置光模块满足65%美国BOM”这两个猜想。", "content": "", "publish_time": "2026-10-07 23:30", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-07T09-53:8deaec07e466": {"id": "post:2026-10-07T09-53:8deaec07e466", "kind": "post", "title": "2026-10-07 09:53", "source_label": "帖子正文", "excerpt": "【DW电子】海外大涨，节后电子板块怎么看？假期台股AI硬件全线爆发，PCB/CCL领涨，5日港股建滔/胜宏/广和/景旺单日亦大涨。", "content": "【DW电子】海外大涨，节后电子板块怎么看？假期台股AI硬件全线爆发，PCB/CCL领涨，5日港股建滔/胜宏/广和/景旺单日亦大涨。核心驱动在于Q4 Rubin、TPU V8等订单上量，带动AI PCB景气上行，业绩有望高增。此外重点关注载板产业链，Rubin ultra及使用EMIB的TPU，Trainium载板尺寸持续放大推动ABF需求爆发，上游短缺的T布，载体铜箔，BT Core板景气加码。#建议重点关注：胜宏科技/宏和科技/兴森科技/深南电路/沪电股份等。假期LITE/COHR等大涨，FCC政策是核心催化。但在产品BOM金额65%自美采购及美本土供应链完整性的双重约束条件下，对头部模块厂短期实质影响有限。另政策风险也有望推动资金向OCS/CPO等新技术方向流动，LITE及COHR的大涨既是政策情绪映射，更是产业链重估信号，建议重点关注A股产业链补涨机会。#致尚科技/腾景科技/炬光科技/东山精密/长光华芯假期全球MLCC共振向上：太诱与TDK于9月30日签备忘录，联合开发AI服务器用MLCC及电感；三星电机10月6日披露2856亿韩元AI服务器MLCC长协，锁至2027年全年，为今年第6份同类合同。AI MLCC为当前最强方向，需求外溢带动普通高容涨价。#建议关注三环集团/风华高科；AI服务器供电架构高压化、近芯化、脉冲化升级，钽电容、TLVR、超级电容弹性大，#关注顺络电子/江海股份。假期端侧AI催化密集：Meta强化Personal Agent，将智能体延伸至AI眼镜；阿里发布Qwen Intelligence手机Agent全栈方案，覆盖模型、Planner及端云协同，率先落地荣耀；Apple亦酝酿AI Siri智能家居Hub。同时，高通、联发科、苹果新一代旗舰SoC均搭载2nm制程与高性能NPU，支持30B级大模型端侧运行，带动联发科假期大涨。SoC升级为端侧智能大脑，AI端侧硬件有望放量打开量价空间，#建议关注瑞芯微/晶晨股份/兆易创新。先进封装：假期台积电创新高，核心支撑来自CoWoS紧缺逻辑兑现：产能持续供不应求，订单可见度已延伸至2030年，后段工序外溢至OSAT承接，并追加封装设备采购。国内2026年2.5D/3D密集扩产落地并上调报价，华为纵向3D折叠封装带来额外增量。AI算力增长正由制程驱动转向封装驱动，本土封测、设备、材料弹性充足，#建议关注：芯碁微装/通富微电/甬矽电子/拓荆科技/盛美上海。存储：美光FY26Q4营收超预期。公司已完成明年大部分HBM供货协议，价格显著提高，1号美光涨超3%带动存储板块上涨。2号东芝宣布将启动600亿日元大规模HDD产能投资，存储板块略有回调。我们持续看好存储板块景气，后续以HBM为代表的存储价格有望在27年持续上涨。#建议关注：长鑫科技/兆易创新/东芯股份/普冉股份。国产算力：华为与高通正式官宣多年期专利许可协议，覆盖 5G、计算、AI 等多领域，有望推动国产半导体标准+专利+制造全链条闭环。叠加前期发改委算力网投资、政府采购国产芯片等政策持续落地，国产算力已进入订单验证期。2026Q4 是产能释放关键拐点，GPU上游物料厂商及具备产能优先级的GPU厂商率先受益。#建议关注：杰华特/寒武纪/海光信息/盛科通信/华勤技术/华丰科技功率半导体：WOLF自9月24日至10月5日累计上涨约27.5%，明显跑赢大盘，与公司新推出Premium 200mm SiC衬底、市场重新交易8英寸SiC良率改善和成本下降预期有关；国内方面，芯联集成公布Q3预告，营收yoy+66%，归母yoy+238%。AI景气下SiC营收今年或翻倍。建议关注SiC产业链#天岳先进/芯联集成。恳请支持东吴电子#文字观点", "publish_time": "2026-10-07 09:53", "tags": ["建议关注瑞芯微", "晶晨股份", "兆易创新", "天岳先进", "芯联集成", "文字观点"]}, "post:2026-10-07T20-38:887cd19ecd72": {"id": "post:2026-10-07T20-38:887cd19ecd72", "kind": "post", "title": "2026-10-07 20:38", "source_label": "帖子正文", "excerpt": "【广发机械】专用设备假期总结：海外AI链创新高，产业趋势不变 十一期间海外科技大涨，纳指再创新高，AI产业趋势不变。#光设备。", "content": "【广发机械】专用设备假期总结：海外AI链创新高，产业趋势不变 十一期间海外科技大涨，纳指再创新高，AI产业趋势不变。 #光设备。【Anthropic】拟上市，2025年营收45.9亿美元，同比增1088%，多年期云与算力合同承诺高达【5180亿美元】；【Marvell】上调长期营收目标，上调28年营收目标至200e美元（其中数据中心业务180e美元，上修约20e美元），目标2031年实现收入700~900e美元，non-GAAP EPS达到30美元以上；外资发布【FCC相关报告】，光模块的潜在限制更可能在3.2T阶段分阶段实施，可能最快10月有动作，中国造的收发模块仍可进口，条件是BOM美国含量≥65%(Marvell DSP+LITE/COHR激光就能接近)；10月5日，特朗普任命国家情报总监JayClayton领导“超级智能特别工作组”，9月29日白宫与Google、Anthropic、Meta、OpenAI、xAI、Nvidia签署四层管控《超级智能协议》，龙头模型与算力公司的政策不确定性显著下降。 如同我们路演一直强调的，近两年行业的产能将有10倍级增长，叠加产品升级，光模块设备市场将从百亿级别迈向千亿级别，临近Q3季报，光通信设备将成为业绩最强的板块之一。CPO设备关注罗博特科、联讯仪器、天准科技、强一股份、科瑞技术等，光模块设备关注联讯仪器、罗博特科、华兴源创、猎奇智能、矽电股份、凯格精机、博众精工、奥特维、快克智能、科瑞技术、智立方、华盛昌（伽蓝特）、和林微纳等。 #半导体设备。海外方面，【美光】26Q4超预期，收入4.23bn，YOY +379%/QOQ +31%，27Q1指引收入$61.5bn±$1.5bn，且美光预计2028年的供应将比2026年【更加紧张】，HBM定价2027年将大幅上涨；【台积电】，预计三季度营收将达指引区间上限，摩恨大通预估为458.4亿美元，环比增长14%，毛利率约66.8%，亦处于指引高端；10月6日，DRAM供应商对四季度合约价的早期谈判已明确指向大幅上涨，美国采购端需求动能显著增强；马斯克宣布与台积电治谈Terafb合作。 国产方面，【DeepSeek】正式开源面向华为昇腾算力平台的基础设施组件，涵盖 TileLang 高级语言编译工具、计算库、分布式通信库，全面对标英伟达的CUDA生态；【DeepSeek】最新一轮融资额接近锁走至少800亿元人民币(120亿美元)，大幅超过公司原走融资目标，为计划于2027年初进行的首次公开嘉股奠定基础；【长鑫科技】349亿元投向研发与后道测试，其中技术研发项目投资241亿元，存储器晶圆后道测试基地二期项目投资108亿元；亚马逊云科技(AWS)旗下大模型服务平台Ama20n Bedrock官宣接入【智谱GLM-5.3】，AWS基于模型调用星与智谱进行收入分成；【华为与高通】达成多年期广泛专利交叉许可，覆盖5G/计算/AI网络，高通同步收购华为部分美国专利； 先进制程和存储不断涨价的背景下，我们持续看好半导体设备。继续强调长川科技、强一股份、华峰测控、精智达、联动科技、金海通、矽电股份、欧康诺以及精测电子、微导纳米、迈为股份等半导体设备。 #玻璃基板。【三星电机】已进入其下一代大尺寸玻璃基板的封装级验证阶段，该公司已完成100毫米×100毫米玻璃基板本身的可靠性测试，正与多家全球大型企业展开合作，目标是在2027年底前实现生产线投产；【LPKF】收到亚洲头部先进封装厂商意向订单，用于玻璃基板的产能扩产；【英伟达】已要求韩国、日本和台湾的基板制造商在两年内完成玻璃基板的开发，可能在2028年之前完成；我们一直强调，行业逐步形成了玻璃作为终极材料的共识，未来半年到一年内行业的变化会持续不断。 继续强调帝尔激光、长川科技、强一股份、汇成真空、长信科技以及大族激光、德龙激光、英诺激光、东威科技、芯碁微装等。 欢迎交流。 孙柏阳/汪家豪/王宁/许贝尔#文字观点", "publish_time": "2026-10-07 20:38", "tags": ["文字观点"]}, "post:2026-10-07T09-52:2a2043694c79": {"id": "post:2026-10-07T09-52:2a2043694c79", "kind": "post", "title": "2026-10-07 09:52", "source_label": "帖子正文", "excerpt": "伯恩斯坦——数据中心冷却设备——冷却液分配单元（CDU）的后市场服务空间究竟几何？核心结论：CDU的后市场服务价值显著弱于传统冷水机组，长期持有逻辑更偏向冷水机组OEM。", "content": "伯恩斯坦——数据中心冷却设备——冷却液分配单元（CDU）的后市场服务空间究竟几何？ 核心结论：CDU的后市场服务价值显著弱于传统冷水机组，长期持有逻辑更偏向冷水机组OEM。 一、研究方法与核心假设 • 由于CDU大规模部署时间尚短（仅数年），其后市场服务现金流难以直接量化。报告以数据中心冷却领域更成熟的冷水机组（Chiller）为参照基准，通过对比两者在约25年生命周期内的收入与利润率倍数，推演CDU的服务尾端价值。 • 现金流拆解为三大组件：①维护收入（假设设备安装2年后、保修期结束后开始）；②维修配件/人工收入（假设5年后开始）；③升级/改造（冷水机组）或替换设备销售（CDU，因其使用寿命不足25年）。 • 折现率假设约5%，新设备营业利润率假设15%，服务业务营业利润率假设25%。 二、冷水机组服务尾端基准 • 收入端：25年周期内，服务现金流现值约为初始设备 capex 收入的4倍（Trane管理层口径为未折现8-10倍）。 • 利润端：由于服务业务利润率高于新设备销售，营业利润倍数高达约6倍。 三、CDU服务尾端测算（核心发现） • 假设CDU使用寿命约10年，在同等25年周期内： ◦ 收入倍数约3.6倍（与冷水机组的4倍相差不大）； ◦ 营业利润倍数仅约3倍，仅为冷水机组的一半。 • 利润倍数偏低的主因：CDU在寿命末期被替换时，新设备销售利润率将显著低于当前水平。当前CDU设备利润率因底层GPU/ASIC快速迭代、液冷设备需同步升级而维持高位（新设备营业利润率超20%）；但随着芯片架构演进放缓（预计短期内不会发生，但终将到来），CDU设备将趋于标准化，新设备营业利润率将向10-15%的常态区间回归（类似亚洲制造商的历史轨迹）。 四、投资启示与标的偏好 • 短期无虞：当前数据中心GW级扩容需求主导叙事，新设备销售仍将维持高利润率，CDU制造商短期盈利无忧。 • 中长期配置与下行保护：若投资视野超过5年，或担忧GW扩容放缓需寻求防御性，冷水机组OEM更具吸引力——其服务尾端利润倍数是CDU的两倍。 • 关键风险提示：模型假设所有后市场收入均归属初始OEM，且更换设备时客户不更换品牌。但CDU寿命较短（约10年），未来产品标准化程度提高后，数据中心运营商更可能在更换CDU时切换品牌，导致新设备销售及后续服务收入流失。冷水机组因寿命长达20年以上，此风险小得多。 五、模型灵活性与局限性 • 上述倍数可能仍偏乐观（例如未充分考虑品牌切换风险）。报告提供可下载的Excel模型，供投资者根据自身假设（如不同使用寿命、新设备利润率）调整测算。 • 后市场服务机会仍处早期理解阶段，若CDU维护/维修频率高于冷水机组或能维持更高服务利润率，经济性将向CDU倾斜。 总结：液冷CDU虽坐享AI算力扩张的短期硬件红利，但后市场“长尾价值”远不及冷水机组，长期投资者应更看重拥有深厚服务 月14日 Anthropic 投资者日和11月份具体上市时间，将为大模型板 块整体估值设立估值框 架。 5 / AMD 82 亿美元收购 World Labs：算力巨头补充上游模型能力 AMD 9月28日宣布以约 82 亿美元全股票收购李飞飞创立的 World Labs，为公司史上第二大收购，预计 2026 年底前完成；李飞飞出任 AMD 执行副总裁兼首席科学家，直接向苏姿丰汇报。 World Labs 主攻世界模 型（生成和重建 3D 物理环境），首款产品 Marble 已上线。我们认为，芯片公司购买模型团队，主要是为下 一代芯片架构的设计做提前考量。 【云计算板块】 1/ 国内大厂数据中心AI容量扩张提速，关注交付与资本回报 ——五大厂商容量集中，字节和阿里领先。 据9月27日云头条转引 SemiAnalysis 图表刻度估算，2026 年底中国境内预计已交付容量：字节约 5.3GW、阿里约3.9GW、腾讯约2.4GW、百度约1.1GW、华为约 1.0GW，合计约13.7GW。以上为自建与租赁合计的 IT电力容量，包含传统云等负载，不能直接换算为 AI算 力或GPU数量；公司分项为公开转引估读，未取得付费模型底表。 ——自建与租赁路径分化。 字节以租赁为主，华为以自建为主，阿里、腾讯和百度采用混合模 式。 SemiAnalysis公开报告预计中国2026年底容量超过24GW，另有约20GW明确时间表的项目储备及约 30GW 已宣布项目；报告还指出，传统低密度机房空置与 AI机房紧缺同时存在。 我们认为，国内算力扩张对第三方 IDC的拉动，首先取决于大厂租赁需求及订单交付。对互联网公有云 而言（阿里、腾讯、百度），主要关注新增容量能否转化为外部云收入或内部业务效率，并覆盖折旧和资金占 用。 下载日志已记录，仅供内部参考 信息技术 行业动态报告 2/ 海外CSP：Agent推动需求扩散至执行环境与数据层 ——近期更新集中在企业 Agent落地。微软9月24日更新Foundry模型、语音及长任务能力， 9月28日 将Fabric业务数据接入Copilot；AWS与Salesforce扩大Agent及数据互通；Google Cloud在9月更新中强化 沙盒、存储和推理调度。三家的共同方向是让模型调用进入持续运行的企业工作流。 我们认为，云需求有望由训练和推理进一步扩散至 CPU执行、内存、存储、数据库和安全治理。大厂优 势来自企业客户、应用入口与完整云产品。 【建议关注】  海内外大厂：Meta、阿里巴巴、谷歌、腾讯  大模型：智谱、MiniMax  垂类应用：汇量科技 、哔哩哔哩、美图公司、易点天下。  游戏：网易、巨人网络、恺英网络、心动公司 2、全球AI产业进展 大模型：海外前沿模型密集迭代，旗舰模型降价 1、国庆前后前沿模型密集升级，编程、长任务执行是主要迭代方向，同时 旗舰能力下沉到半价 。我们认 为，GPT-6.1 Sol和Sonnet 5.5强化的是常用工作负载的性能效率， Gemini 4 Argon扩展长程推理能力，重回 T1；但旗舰模型价格在降低， Opus 5.5 降价 20%、Argon 打 1/5 价格、GPT-6 Luna 打一折。 ——Google Gemini 4 Argon（9月30日）。沉寂 7 个月后的旗舰，Artificial Analysis 智能指数 53 分追 平 GPT-6 Astra、重回前三，幻觉率为高分模型中最低；首发优惠价 $2/$10（约为 Astra 的 1/5）；先通过 Fairwind计划向受信任网络安全防守方分阶段开放，尚未面向所有开发者。最大输出上限由 64K升至100万 token；面向长程编码、法律、金融与防御性网络安全任务。 ——Anthropic Claude Sonnet 5.5 （9月22日/9月28日）。一周内双发。Opus 5.5 定价比 Opus 5 低 20%、典型负载成本降 40%、Terminal-Bench 4.0 达 66.4%；Sonnet 5.5 输出速度比Sonnet 5提高30%以上、 单任务成本最高降 30%。 ——OpenAI GPT-6.1 Sol/Luna（9月22日）。API 价格较上代促销价腰斩（ Luna 低至 $0.10/$0.50）。 下载日志已记录，仅供内部参考 信息技术 行业动态报告 ——Grok 4.7（xAI，9月21日）：结束四次跳票，50 万 token 上下文，定价不变（$2/$6），Artificial Analysis 智能指数 46 分、首进全球前四；但单任务 token 消耗翻倍引发\"总价不便宜\"争议。 ——Kling 4.0（快手，9月28日官宣内测）：单次原生生成最长 30 现看，国庆期间海外光通信板块大幅上涨，说明全球资金在AI产业趋势内部寻找景气度高、业绩确定性强的细分方向时，#仍首选光通信。我们继续看好光通信赛道：经过前期调整，市场对板块的短期悲观预期已消化得较为充分；与此同时，全球AI在光通信、光互联环节仍处于一轮大的技术升级周期，板块有望重新回归业绩与产业趋势驱动。#建议重点关注联特科技、九州一轨、中际旭创、新易盛、天孚通信、炬光科技、汇绿生态等。#文字观点", "publish_time": "2026-10-07 20:37", "tags": ["对A股光通信龙头中性偏利好", "文字观点"]}, "post:2026-10-07T23-47:f380523173e9": {"id": "post:2026-10-07T23-47:f380523173e9", "kind": "post", "title": "2026-10-07 23:47", "source_label": "帖子正文", "excerpt": "【东方通信-半导体】光通信假期热点事情点评 一、FCC监管路径逐渐清晰，短期不影响光模块基本面 近期大摩认为，美国若限制中国光模块，更可能采取渐进式方式：不明显影响当前800G、1.6T供应，而从3.2T开始提高准入门槛，同时要求更多核心零部件和BOM价值量来自美国供应链。我们认为，这符合美国AI供", "content": "【东方通信-半导体】光通信假期热点事情点评 一、FCC监管路径逐渐清晰，短期不影响光模块基本面 近期大摩认为，美国若限制中国光模块，更可能采取渐进式方式：不明显影响当前800G、1.6T供应，而从3.2T开始提高准入门槛，同时要求更多核心零部件和BOM价值量来自美国供应链。 我们认为，这符合美国AI供应链的长期思路。当前美国AI数据中心仍高度依赖中国光模块产能、良率和交付能力，短期难以找到替代方案。因此更现实的路径是：当下产品继续用，未来产品提高门槛；制造仍可借助中国供应链，但核心技术和主要价值量尽可能留在美国。 目前800G、1.6T仍处于核心放量周期，未来1-2年行业主要矛盾仍是AI需求、1.6T放量和供给能力。倘若大摩提到的相关方案真的最终落地，#我们相信头部模块厂凭借规模、制造效率、客户关系和交付能力将仍有机会继续参与北美市场。只不过在 DSP、激光器等核心环节可能需要更多采用美国供应商产品。因此对头部模块厂而言，更多的问题将来自于供应链自主权和利润空间受到一定约束。当然，这个影响的时间我们认为至少也要在2028年之后才会看到。 二、Marvell投资者日：连接成为AI基础设施下一核心增量 1. Marvell预计2030年全球数据中心CapEx约3万亿美元，Interconnect TAM达到650亿美元，2025-30年CAGR约65%，是增长最快的业务方向。 2. FY26收入82亿美元，预计FY27约120亿美元、FY28约200亿美元、FY31达到700-900亿美元；FY28需求和供应基本锁定。 3. Scale-up流量占数据中心流量超过85%，随着带宽提升、铜连接距离缩短，机架互联将持续向NPO/CPO+OCS迁移。 4. Scale-across打开新空间：AI集群从单数据中心向多Campus扩展，带宽需求约为传统DCI的15倍。相干模块预计从当前不足100万只（400G为主）增长至2030年超过300万只（1.6T/3.2T为主）。 总结：#下一阶段增量来自Scale-up光化和Scale-across。#光互联正在从服务器互联走向多机架互联+算力中心互联，连接正在实打实的成为AI基础设施下一核心增量。 重点推荐：#MPO+CPO致尚科技、OCS+DCI德科立、剑桥科技#文字观点", "publish_time": "2026-10-07 23:47", "tags": ["文字观点"]}, "post:2026-10-07T21-49:eaee51a48a81": {"id": "post:2026-10-07T21-49:eaee51a48a81", "kind": "post", "title": "2026-10-07 21:49", "source_label": "帖子正文", "excerpt": "天风通信 | 假期事件梳理和观点：#期待优质资产的“拨乱反正”，才能真正带动市场有效正反馈 1、#美股表现：纳指创新高，#其中GPU、CPU龙头英伟达和AMD、光芯片龙头Lite、芯片制造龙头台积电都创出新高走势。我们认为，一方面反映全球AI硬科技龙头韧性十足，抗住了外部压力（美债、加息、地缘政治、", "content": "天风通信 | 假期事件梳理和观点：#期待优质资产的“拨乱反正”，才能真正带动市场有效正反馈 1、#美股表现：纳指创新高，#其中GPU、CPU龙头英伟达和AMD、光芯片龙头Lite、芯片制造龙头台积电都创出新高走势。我们认为，一方面反映全球AI硬科技龙头韧性十足，抗住了外部压力（美债、加息、地缘政治、AI叙事担忧等）；另一方面AI产业尽头交易脱敏，产业内在逻辑、趋势和成长性在持续定价修复股价，交易方向逐步明朗。 2、#FCC：大摩报告所述内容比预期温和很多。 首先，FCC并未有正式文件，相关内容仍属于大摩通过专家交流，形成的政策预期； 其次，预期从下一代3.2T产品开始，#并未涉及800G、1.6T和未来即将放量的NPO，中国光模块公司未来3年高成长逻辑依旧； 再次，#如果BOM中65%价值量来自美国企业、中国光模块产品仍可进入美国市场，假设以上要求执行（当前进口的DSP、TIA、Driver、硅光晶圆、PD、高速EML等器件即可满足），明显比市场担忧的预期好很多。 3、#Marvell指引：1）#定调连接：AI工作负载从训练转向推理、AGENT、具体应用。#连接将成为计算、存储之后的下一个决定性瓶颈和突破口； 2）#预计2030年capex达3万亿美金，公司收入从26财年82亿美金，预计27年120亿，28年200亿（已锁定需求和供应），2031年预计700-900亿美金； 3）未来机架连接唯一途径为光互联，#其中Scale-up流量占数据中心85%，scale-out占比15%。NPO快于CPO，但并行非互相替代。 4、#观点：过去1-2个月受外部扰动（美债、加息、地缘政治、FCC、AI叙事等），A股跟外围市场定价反差明显，我们认为节后随着资金回流、产业趋势再明朗以及三季报催化，#高景气赛道的低位低估值核心资产有望“拨乱反正”带动市场修复。 ☎天风通信团队#文字观点", "publish_time": "2026-10-07 21:49", "tags": ["美股表现", "Marvell指引", "定调连接", "观点", "文字观点"]}, "post:2026-10-07T20-40:c270a2b9da9c": {"id": "post:2026-10-07T20-40:c270a2b9da9c", "kind": "post", "title": "2026-10-07 20:40", "source_label": "帖子正文", "excerpt": "是什么推动了市场？#交易台尽管美股创下历史新高，但风险情绪在整个亚洲地区降温，亚洲股市收盘普遍下跌。", "content": "是什么推动了市场？#交易台尽管美股创下历史新高，但风险情绪在整个亚洲地区降温，亚洲股市收盘普遍下跌。油价上涨、全球债券收益率走高以及政策不确定性给市场带来压力。韩国领跌区域市场，三星电子的财报、科技和人工智能板块供应链承压；而黄金周期内地产板块持续走强。日本终结两连涨，投资者在强劲反弹后选择获利了结；印度则在印度储备银行（RBI）近四年来首次加息并维持鹰派政策立场后走弱。澳大利亚和台湾表现相对稳健，收盘几乎无变化，投资者选择性轮动至房地产、金融及动能板块。中国因黄金周假期休市。纵观整个地区，投资者继续青睐部分周期性板块和防御性板块，同时在关键财报和宏观催化剂公布前，削减了对利率敏感型资产和大型科技股的敞口。 区域综述 澳大利亚：标普 / 澳股 200 指数 -0.09%。澳大利亚股市收盘几乎无变化，终结了三连涨势头。平淡的收盘掩盖了盘中分化走势：尽管亚洲市场整体呈现避险情绪，且未能充分参与华尔街隔夜创纪录的反弹，但澳股仍展现出相对韧性。房地产板块领涨板块表现，其次为非必需消费品、医疗保健和科技板块，而金融和材料板块则对指数构成小幅拖累。Arena REIT（ARF）表现最为突出，一笔涉及 Goodstart Early Learning 托儿所资产的交易提振市场情绪。铀相关标的包括 Deep Yellow、NexGen Energy 和 Silex Systems，在 AlphaBet 与 Constellation 达成核电协议后上涨，推动了整个板块的热情。Telix Pharmaceuticals（TLX）在推出其脑癌成像产品在美国的商业供应后股价上涨，Domino’s Pizza Enterprises 和 James Hardie 也表现优异。下跌方面，SKS Technologies 因重大内部人士减持而大跌，Sims 和 Fortescue 随大宗商品走弱同步下行。联邦银行（CBA）因金融板块表现不佳而成为拖累指数的最大因素。 ******** 台湾：台股加权指数 -0.03%。台湾股市午盘再次呈现震荡走势，台股加权指数收市几乎无变化，仍守在 50000 点关口下方。大型科技股相对低迷，其中联发科（2454）持续主导主要资金流出并压制市场情绪。动量型板块表现突出，以巨国（2327）为首；与此同时，科技股的热情转向与 CPO 相关的标的。板块领涨格局依然牢牢掌握在非科技股手中，该类股票连续第二个交易日跑赢科技股。金融股提供稳定支撑，石化类个股则连续第二天扩大涨幅，成为表现最强的群体之一。总体而言，市场参与度保持选择性，投资者轮动至动量型和周期机会，同时对大型半导体持仓保持谨慎态度。 韩国：KOSPI 指数 -1.98%。韩国股市试图反弹，但未能收复 7000 点关口，尾盘持续走低。外国投资者延续连续两天的净卖出态势，本地机构也呈现净卖出，其中科技板块领跌（-16 亿美元 /-4500 万）。散户投资者是主要买方，在科技板块买入 4.15 亿美元，部分抵消了机构的资金流出；与此同时，随着三星电子的回购计划已于前一日基本结束，其他公司的回购支撑力度有所减弱。三星电子（005930）下跌 1.3%，SK 海力士（000660）下跌 2.8%，回吐早盘涨幅，因投资者在三星电子将于明日发布的第三季度初步业绩前保持谨慎。疲软情绪蔓延至更广泛的人工智能供应链，半导体设备与材料股如 WONIK IPS（240810）（-7.2%）和 JUSUNG ENG（036930）（-11.1%）承压，电网相关股票也走低。外国投资者小幅流入化工板块，在对美国大型零售购物节前对 APR（278470）的买入推动，同时资金流入食品饮料（+1300 万美元）和娱乐（+500 万美元）板块。KOSPI 成交额较其 20 日均高出 2.3%，而韩元下跌 0.15%，至 1340.2。 日本：日经指数 -0.92%。日本股市终结了两连涨，开盘触及日内高点后全天回落，日股指数在交易日的大部分时间震荡。卖盘在上午中段加速，尽管指数在下午获得支撑并大体区间震荡，但尾盘再度承压。不过，日经指数仍守在关键的 70000 点心理关口上方。市场出现与近期趋势相反的逆转，对重仓股及特定股息（SPE）相关的个股表现落后，导致日经 / 东证股价指数（TOPIX）比率终结连涨，并维持在约 17 的相对水平。技术阻力也可能构成压力，日指数在触及 RSI 70 后回落，这是自 6 月峰值以来的首次超买读数。市场焦点转向财报，Fast Retailing、Seven & i Holdings 和 Yaskawa 等公司将在接下来两个交易日公布业绩。收盘后，日本交易所集团（JPX）宣布自 10 月 30 日起将 35 只股票纳入 TOPIX，其中值得注意的新增成分股包括 GSO Inc。(581A)、麦当劳日本（2702）和 JSR。 中国：因国庆黄金周假期休市。 香港：恒生指数 -0.62%。港股收跌于 24130.5 点，回吐前一交易日涨幅。内地市场收于黄金周假期，市场成交额为 947 亿港元。板块表现分化，工业（+1.2%）和房地产（+0.8%）领涨，而医疗保健（-1.5%）和科技（-0.8%）落后。受美国生物科技同业走弱影响，医疗保健遭遇抛售，金斯瑞生物科技、药明生物、中国生物制药和翰森制药下行。在区域半导体行业整体疲软的背景下，科技股承压，华虹半导体下跌 2.7%；工业股走强，由汇川技术支撑，该股在券商上调目标价后上涨 4.7%。地产股表现稳健，新鸿基地产上涨 2.2%，领涨该板块，此前市场对其租金收入前景给予积极评价。投资者也在关注传艺的香港 IPO 启动，而油价上涨和美债收益率攀升则拖累了整体市场情绪。目前焦点转向黄金周后中国市场的重新开放，以及三星电子第三季度初步业绩。 东南亚：雅加达综指 -0.70%。印尼股市收低，在广泛的亚洲避险情绪下收盘走低。油价上涨以及印尼央行意外加息加剧了新兴市场紧缩担忧，尤其拖累房地产和大宗商品相关个股。Bayan Resources 成为跌幅最显著的个股之一，煤炭相关股票普遍走弱，同时，多家房地产股因利率敏感性担忧而承压。涨幅主要集中在少数个股。泰国 SET 指数 + 0.40%。泰国股市跑赢该区域，SET 指数收盘走高，整体市场保持稳定。表现由暹罗水泥（SCC）和暹罗玻璃（SITG）的强势支撑。尽管亚洲其他地区的市场表现疲软，SET 指数仍维持韧性。尽管收盘表现积极，投资者持续关注高企的油价、区域加息以及中国国庆黄金周期间流动性偏紧的状况。 印度：NIFTY -0.79%。Nifty 指数再次承压，回吐昨日涨幅，收盘下跌 0.8%，创下 2600 点关口。今日重点事件是印度储备银行（RBI）近四年来首次加息。市场定价此次加息，且预期本次加息可能是本轮周期最后一次鹰派表态，市场定价政策转向的可能性。板块表现分化：中型股指数下跌 0.8%，而小型股指数相对更好，上涨 0.1%。按板块，公用事业板块领涨，紧随其后的是银行、金融板块小幅走弱。利率敏感的金属、汽车和房地产板块表现最差。印度 10 年期国债收益率上升 3-5 个基点。#文字观点", "publish_time": "2026-10-07 20:40", "tags": ["交易台", "文字观点"]}, "post:2026-10-07T09-52:58fcef4d0031": {"id": "post:2026-10-07T09-52:58fcef4d0031", "kind": "post", "title": "2026-10-07 09:52", "source_label": "帖子正文", "excerpt": "建银国际高端制造｜施耐德电气史上最大并购 ✅ $237bn 收购工业软件龙头PTC（10月5日） - 全现金收购PTC：每股$205，股权估值$226bn｜企业价值$237bn｜较停牌前溢价42.3% - PTC：头部工业软件，核心→Creo 3D CAD / Windchill PLM，聚焦产品研", "content": "建银国际高端制造｜施耐德电气史上最大并购 ✅ $237bn 收购工业软件龙头PTC（10月5日） - 全现金收购PTC：每股$205，股权估值$226bn｜企业价值$237bn｜较停牌前溢价42.3% - PTC：头部工业软件，核心→Creo 3D CAD / Windchill PLM，聚焦产品研发数字化 - 交割预期：2027Q3，待股东+多国监管审批 - 市场反应：施耐德巴黎股跌近10%；PTC美股+33.5%｜市场担忧对价高，资本回报周期≈5Y ✅ 施耐德年内并购矩阵 - 6月：$31bn 收购工业数据平台 Cognite - 9月：€12亿 要约收购 Shelly Group（家居能源管理软硬件） ✅ 战略逻辑：补齐产品开发软件短版+工业数据 - 原有底盘：工控硬件 + 能源管理 + AVEVA（工厂运营软件） - 短板补齐：上游CAD/PLM，打通产品研发→建厂→生产运维完整数字主线 - 可触达工业软件TAM扩大3x，跻身工业软件第一梯队，对标西门子 / 达索系统 - 赛道主线切换：硬件竞争 → 工业数据底座 + 工业AI平台之争 ✅ 中港资本市场对标：汇川技术（买入）、中控技术、中望软件、浩辰软件 - 工厂工控层对标：汇川技术、中控技术、和利时 - 上游三维CAD对标：中望软件、浩辰软件；产品力&大客户生态与海外龙头存代差 - 港股稀缺：底层工业软件平台标的稀缺，供给集中于机器人本体、自动化零部件 - 底层原因：工业软件需要数十年客户案例沉淀，国内厂商仍处产品迭代期 ✅ 总结：GenAI加持、工业软件数据为核心资产 - 高溢价并购印证：高毛利、强客户粘性的研发端工业软件+ Generative AI 工业数据 = 全球工业龙头核心必争资产#文字观点", "publish_time": "2026-10-07 09:52", "tags": ["文字观点"]}, "post:2026-10-07T11-04:ce88e920c5d1": {"id": "post:2026-10-07T11-04:ce88e920c5d1", "kind": "post", "title": "2026-10-07 11:04", "source_label": "帖子正文", "excerpt": "美股盘面分析：趋于稳定#交易台标普 500 指数上涨58 个基点，收于 7818 点，收盘竞价（MOC）为 28 亿美元净卖出。纳斯达克 100 指数上涨48 个基点，报 31224 点", "content": "美股盘面分析：趋于稳定#交易台标普 500 指数上涨58 个基点，收于 7818 点，收盘竞价（MOC）为 28 亿美元净卖出。 纳斯达克 100 指数上涨48 个基点，报 31224 点；罗素 2000 指数下跌68 个基点，报 2827 点；道琼斯指数上涨49 个基点，报 51521 点。 全美股票交易所总成交量为 165.14 亿股，今年以来日均成交量为 186.38 亿股。 VIX 恐慌指数下跌335 个基点，报 15.01；WTI 原油上涨46 个基点，报 89.84 美元。 美国 10 年期国债收益率下降0.025 个基点，报 5.2793%；黄金上涨72 个基点，报 4169 点。 美元指数（DXY）下跌31 个基点，报 101.85；比特币下跌22 个基点，报 85593 美元。 随着宏观背景趋于稳定，原油和利率在隔夜欧元债券获得买盘以及 Bessent 发表评论后走稳，纳斯达克 100 指数与标普 500 指数震荡走高。 动量因子连续第二个交易日走低，RTY 指数表现也大幅落后。 市场焦点集中在三个方向，第一是我们的 Power Up America 一篮子股票（GSENEPOW 上涨约450 个基点）位居涨幅榜前列，今早有关 GOOG 的新闻，让市场重新关注 AI 带来的电力需求增长，CEG 上涨 12%。 第二是硬磁盘驱动器（HDD）板块走弱，拥挤的多头头寸标的 STX 和 WDC，因来自东芝的新一轮竞争担忧下跌 8%-10%，该负面情绪进一步波及到更广泛的半导体设备板块，包括 AMAT、KLAC、LRCX。 第三是生物技术板块下跌约350 个基点，其中 AVBP 因临床数据未达预期下跌 46%，尽管该标的对 XBI 指数拖累较小，这也是近期又一项负面更新。 以 1 至 10 分衡量，交易台的整体活跃度为 4 分，最终呈现+670 个基点的净买入偏好。 在宏观和科技板块的推动下，资产管理公司和对冲基金的资金流向偏向买入，但整体资金活跃度依旧低迷。 Bartlett 总结，个股层面的交易并不算繁忙，纳斯达克 100 指数的持续突破，主要由三点因素驱动。 第一，投资者仓位干净，高盛私募业务数据显示对冲基金净敞口接近 5 年低点，高盛情绪指标也徘徊在多年低点附近。 第二，宏观产品与对冲头寸的回补。 第三，资金持续向科技 / AI 领域集中，市场里几乎其余所有板块都受到资金流出的冲击，市场广度骤降至 2000 年以来最低水平。 与此同时，投资者在各类担忧情绪中继续持仓，尤其是宏观层面的各类风险，并且 AI 板块的基本面数据依旧极其强劲。 明日将有几项重要数据更新，宏观层面包含 FOMC 会议纪要以及 390 亿美元 10 年期国债拍卖。 微观层面包含 APLD、LEVI 财报，以及 Costco9 月销售数据。 衍生品板块：随着投资者继续被止损入场，股市当日进一步反弹。 尽管连续第三天实现上行跨式套利的涨幅，但标普 500 固定执行价波动率未能获得显著买盘。 标普 500 的偏度持续被压缩，纳斯达克 100 偏度沿着曲线进一步陡峭化。 指数层面的资金流向，在追涨做多与调仓重组之间平分秋色。 临近收盘阶段，高盛客户卖出 4.4 万手 SPY 在 2026 年 12 月 18 日到期的 800 看涨期权，同时买入 5.5 万手同到期日的 810 看涨期权，以及 3.3 万手 2026 年 11 月 20 日到期的 800 看涨期权，本次交易支付了 1500 万美元。 交易台看好至 11 月的 VIX 看涨期权价差策略，我们认为无论现货市场表现如何，波动率都有可能保持粘性或震荡走高，并且资产管理公司在 VIX 期货上的头寸处于历史最低水平。 板块内部交易活跃度不减，可再生能源板块大涨，存储芯片与生物科技个股表现落后。 交易活动主要集中在上述板块，生物科技板块增加了下行保护，核能板块增加了上行押注。 我们继续看好 URA 以及特定个股的上行空间，政府和企业的投资交易持续影响盘面，而投资者对相关标的配置严重不足。 标普 500 指数至明日为止的隐含波动幅度为 0.39%。#文字观点", "publish_time": "2026-10-07 11:04", "tags": ["交易台", "文字观点"]}, "attachment:files/中信建投-基础化工行业：8月化工品出口同比增速放缓，石化板块延续较快增长-261006.pdf": {"id": "attachment:files/中信建投-基础化工行业：8月化工品出口同比增速放缓，石化板块延续较快增长-261006.pdf", "kind": "attachment", "title": "中信建投-基础化工行业：8月化工品出口同比增速放缓，石化板块延续较快增长-261006", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业动态 8月化工品出口同比增速放缓 , 石化板块 延续较快增长 核心观点 从中期维度来看，中国化工的核心逻辑依然是化工资产的稀缺性，而这 种稀缺性在石化供应链的扰动之下是进一步增强的。长期看化工龙头在 周期底部的盈利底已经非常优秀，拥有足够的价值，但是短期依然面临 Q2高基数和Q3弱补库。建议重点关注 Q3业绩有望进一步上行的行业 和个股。本周（2026.9.21-9.25）中信建投化工行业指数 128.75，环比- 1.22% 合理融资需求。 五、优化土地供应管理 强化规划引领、资源统筹、市场导向，实施“规储供用”一体化机制，加强房地联动，优化城市设计，统 筹考虑出让地块的区位、规模、结构、节奏和规划指标要求，着力推动区位、产品符合市场需求、规模适度、 周期适中的优质地块供应。加强市场研判，坚持“一地一策”稳妥有序供应。 2026年8月28日后发布出让公告的商品住宅用地，出让价款可按国家规定分期缴纳。首付款在出让合同 签订之日起30个自然日内缴纳，缴纳比例不低于总价款的 50%，余款可延长至出让合同签 订后一年内缴清；适 应市场和项目需要，按规定程序决策后，可再延长一年；分期付款的，不计利息。出让价款具体交缴方式，经 当地土地出让协调决策机构集体决策后，在土地出让公告中予以明确。分期缴款项目，开发企业可凭国有建设 用地使用权出让合同， 申请办理建设用地规划许可证、 建设工程规划许可证。 分期缴款项目在出让价款缴清后， 方可办理国有建设用地使用权首次登记，核发该出让合同范围内第一批次的商品住房预售许可。 六、持续做好质量监管和市场秩序规范 （一）统筹推进“好房子”建设。商品住房开发建设实行项目开发公司制，建立 健全商品住房项目工程质 量保障体系，压实各方主体责任，做好从规划设计到交付使用的全过程管理，加强施工现场质量安全管理。 （二）优化项目行政审批。持续优化商品住房项目规划设计、开发建设、竣工验收以及上市销售等审批流 程，提高管理服务效能，积极营造良好营商环境。 （三）规范市场秩序。健全房地产市场信息公开发布机制，加强房地产市场监管，加大对违法违规行为的 查处力度，切实维护购房人合法权益。 本实施意见自2026年9月28日起执行。此前所发文件相关内容与本实施意见不一致的，按本实施意见规 定执行。 市住房城乡建设管理委 下载日志已记录，仅供内部参考 5 行业简评报告 房地产 请务必阅读正文之后的免责条款和声明。 市房屋管理局 市规划资源局 上海金融监管局 2026年9月28日 附2：广州政策原文 广州市住房和城乡建设局 广州市规划和自然资源局 国家金融监督管理总局广东监管局关于贯彻落实《关于完 善商品住房销售制度的通知》的实施意见 各有关单位： 为贯彻落实 《住房城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知》 （建房规 〔 2026〕 3号），加快构建房地产发展新模式，稳步推进我市商品住房销售制度改革，推动房地产市场平稳健康发展， 结合我市实际，制定如下实施意见。 一、全面加强商品住房预售管理 （一）分类明确预售条件 1.新取得土地项目。2026年8月28日后， 发布国有建设用地使用权出让公告的商品住房项目， 实行预售的， 单体建筑应完成主体结构封顶。 2.在途项目。2026年8月28日前（含当日），已取得（含部分取得）建设工程规划许可证但未办理预售许 可证的商品住房项目，实行预售的，预售条件、预售资金监管等按我市原有政策规定执行。 2026年8月28日前（含当日），已取得国有建设用地使用权未取得建设工程规划许可证的商品住房项目， 以及8月28日前（含当日）已发布出让公告但在 8月28日后取得国有建设用地使用权的项目，原则上执行新 的预售政策；为保持市场供需平稳，各区政府确保能够按时建成交付的，在加强预售资金监管的情况下，报市 住房城乡建设部门备案后， 2027年底前仍可按我市原有预售条件申请 预售。项目预售资金监管设定重点监管额 度，重点监管额度要覆盖项目全部剩余工程建设费用，保障项目竣工验收及水电气等配套设施具备交付使用条 件。 3.2026年8月28日前（含当日），已取得国有建设用地使用权（含部分取得）的历史遗留问题项目，经各 区政府评估风险后，可按在途项目有关规定执行。 （二）加强预售资金监管 下载日志已记录，仅供内部参考 6 行业简评报告 房地产 请务必阅读正文之后的免责条款和声明。 广州市房屋交易监管中心作为住房资金监管机构，具体承担预售资金监管工作。购房人支付的首付款、个 人住房贷款等购房资金应全部存入预售资金监管账户。房地产开发企业应与购房人签订购房合同，并依法办 理 网签备案，合同应约定购房资金存入预售资金监管账户的相关权利责任。 在完成项目竣工验收备案、水电气等配套设施具备交付条件、居住用地内独立设置的居住区配套公共服务 设施竣工验收后，由住房资金监管机构留存一定额度后，解除资金监管；在项目完成房屋首次登记后，注销预 售资金监管账户，资金余额转入企业在主办银行开立的资金账户。 二、有序实施商品住房现房销售 （一）完善现房销售备案和网签管理 2026年8月28日起，新公告出让土地商品住房项目，优先选择现房销售；实行现房销售的项目，在土地 出让公告中向社会公开现房销售相关信息。实行现房销售的商品住房项目，房地产开发 .3模型已于美国时间10月5日（北京时间10月6日）正式上线Amazon Bedrock。观点重申： 1）GLM-5.3在Bedrock上", "content": "智谱：GLM-5.3上线Amazon Bedrock，定价具备竞争力，有望提升全球调用量【东吴传媒互联网张良卫团队】 事件： 根据Amazon官网，智谱GLM-5.3模型已于美国时间10月5日（北京时间10月6日）正式上线Amazon Bedrock。 观点重申： 1）GLM-5.3在Bedrock上的定价仍具竞争力。 根据Amazon官网披露，GLM-5.3在Bedrock Standard tier下的定价相对官方API（输入1.40美元/输出4.40美元，每百万token）溢价20%，Global CRIS profile下输入1.68美元/输出5.28美元（US CRIS为1.848/5.808美元），溢价部分对应AWS全球基础设施与合规体系带来的附加值。横向比较（输出价，每百万token）：GLM-5.3为5.28美元，显著低于海外闭源旗舰Claude/GPT（约27~47美元），亦低于Kimi K3（15美元，输入3美元）；官方API口径下，GLM-5.3输出价（28元）与DeepSeek V4 Pro高峰时段输出价（27元）接近。GLM系列整体定价仍体现出较强性价比。 2）有望快速提升全球调用量。 Bedrock是模型厂商触达海外企业客户的重要分发渠道。据路透报道的Anthropic IPO申报材料，2025 年营收近46亿美元，其中21.6亿美元（占比47%，全额法记）通过Amazon和Google云marketplace完成，2023 年和2024年占比分别为11%及32%。在9月16日我们主持的公开交流中，公司表示已与多家国内外头部云厂商签署收入分成协议，相关收入自10月起确认；当时公司披露全业务口径ARR达18亿美元，并将年底ARR目标由24亿美元上调至30亿美元。此次GLM-5.3上线Bedrock并明确按调用量与AWS进行收入分成，是海外分成计划的最新落地。值得注意的是，这并非GLM系列首次上线Bedrock——GLM-4.7系列已于2026年2月上线，GLM-5亦于今年早些时候上线；但此次分成模式明确落地后，有望对Q4业绩形成正向拉动。 3）维持公司\"买入\"评级。 公司前期因配售出现股价波动，但考虑到算力逐步到位后，大参数模型训练与推理的算力约束将显著缓解，公司有望逐步进入新一轮模型迭代与ARR放量周期，当前位置值得关注。 风险提示： 模型迭代进展不及预期；行业需求增长低于预期。 联系人： 张良卫/周良玖#文字观点", "publish_time": "2026-10-07 11:03", "tags": ["文字观点"]}, "attachment:files/UBS-欧洲科技硬件：美国路演——少谈宏观，多抠微观；少做Beta，多做Alpha.pdf": {"id": "attachment:files/UBS-欧洲科技硬件：美国路演——少谈宏观，多抠微观；少做Beta，多做Alpha.pdf", "kind": "attachment", "title": "UBS-欧洲科技硬件：美国路演——少谈宏观，多抠微观；少做Beta，多做Alpha", "source_label": "UBS", "excerpt": "+44-20-7568 5385harry.blaiklock@ubs.comAnalystHarry Blaiklock, CFA+44-20-7568 7105francois.bouvignies@ubs.comAnalystFrancois-Xavier BouvigniesTechnologyEurope including UKEquities ", "content": "+44-20-7568 5385harry.blaiklock@ubs.comAnalystHarry Blaiklock, CFA+44-20-7568 7105francois.bouvignies@ubs.comAnalystFrancois-Xavier BouvigniesTechnologyEurope including UKEquities . 3 information on the Quantitative Research Review published by UBS, begin on page ANALYST CERTIFICATION AND REQUIRED DISCLOSURES, including This report has been prepared by UBS AG London Bra  contained, referred to here", "status": "extracted"}, "post:2026-10-07T11-07:7f399090eb89": {"id": "post:2026-10-07T11-07:7f399090eb89", "kind": "post", "title": "2026-10-07 11:07", "source_label": "帖子正文", "excerpt": "台积电渠道调研：先进制程产能、利用率与价格展望1. 3 纳米 18B 晶圆厂预计到 2026 年底月产能将达到～200 千片晶圆，届时全部八个阶段满产运行；每个阶段平均产能为 25 千片，个别阶段上限可达 30 千片。", "content": "台积电渠道调研：先进制程产能、利用率与价格展望1. 3 纳米 18B 晶圆厂预计到 2026 年底月产能将达到～200 千片晶圆，届时全部八个阶段满产运行；每个阶段平均产能为 25 千片，个别阶段上限可达 30 千片。 2.台积电极有可能在 2027 年对先进制程再次提价 5% 至 10%，且遭遇的阻力极小，原因在于 AI 驱动的供需失衡背景下，晶圆衬底、设备、人力及全球厂区运营成本持续上涨。 3. 亚利桑那 P2 厂 3 纳米量产可能比官方指引提前 1 至 2 个季度；乐观预测认为大批量生产将在 2027 年上半年启动，而非官方公布的 2027 年下半年时间表，并以台湾 18B 厂的工艺流程为基准。 4.到 2027 年底，Fab 20 和 Fab 22 的 2 纳米月产能将轻松超过 120 千片晶圆，高于市场普遍预期的 110 千片；Fab 22 第四阶段的爬坡速度比两个月前的预测更快。 5. 台积电 15B 厂 7 纳米产线利用率上升并非源于 7 纳米芯片的有机需求。其约 20% 的产出用于加工 3 纳米 / 4 纳米 / 5 纳米产品的中后段金属层，以缓解 Fab 18B 的腔体瓶颈。 6.人力短缺 —— 而非设备交付或环评审批 —— 是台积电全球产能扩张的首要瓶颈；先进制程岗位面临最紧张的招聘压力，台积电正在招募国际人才以填补缺口。 7. 台积电亚利桑那 P3 厂瞄准 2 纳米制程，官方规划为 2030 年前投产，但基于 P1/P2 厂累积的学习曲线收益，专家给出的风险试产时间预估为 2028 年底，2029 年实现满产。 8.日本熊本第二阶段 3 纳米项目在公司内部优先级不高；台积电将顶尖工程人力优先配置于台湾和亚利桑那厂区，原因在于尽管有政府补贴，日本当地缺乏大规模 AI 客户基础。 9.CoWoS 先进封装产能将在 2027 至 2028 年间实现 70% 至 80% 的同比增长；封装环节对 AI 芯片产出的制约比前端晶圆制造更为严格，此前学习曲线上的痛点目前已基本解决。 10. 台积电位于 Fab-25 的 A14（1.4 纳米）制程官方目标为 2028 年量产；风险试产可能于 2027 年底启动。每个阶段均维持每月 2.5 万至 3 万片晶圆的基础产能区间，与此前先进制程各阶段的规模保持一致。#文字观点", "publish_time": "2026-10-07 11:07", "tags": ["文字观点"]}, "post:2026-10-07T23-30:e2eea808d845": {"id": "post:2026-10-07T23-30:e2eea808d845", "kind": "post", "title": "2026-10-07 23:30", "source_label": "帖子正文", "excerpt": "Marvell投资者开放日释放互联发展信心，Scale across、Scale in催生互联新需求2026年10月7日，Marvell在其投资者开放日指出到CY30互联总市场规模将达到650亿美元，CY25-CY30年复合增速约为65%。得益于Scale out、Scale up、Scale ac", "content": "Marvell投资者开放日释放互联发展信心，Scale across、Scale in催生互联新需求2026年10月7日，Marvell在其投资者开放日指出到CY30互联总市场规模将达到650亿美元，CY25-CY30年复合增速约为65%。得益于Scale out、Scale up、Scale across的增长，Marvell互联业务营收将在FY31达到375亿美元，FY26-FY31年复合增速约为60%-70%。光互联领域市场空间广阔，Marvell把互联作为重要发展战略 基于光互联业务未来的广阔市场，Marvell采取“连接优先”战略，将互联业务覆盖100mm-1000km，涵盖Scale in、Scale up、Scale out、Scale across全场景：在Scale in领域主要提供μLED,、μVCSEL为技术路线的OIO解决方案；在Scale up领域可提供 DSP、ACC、NPO、CPO、μVCSEL、TIA、Driver等产品；在Scale out领域可提供DSP、相干DSP、TIA、Driver等；在Scale across领域可提供相干光模块、相干DSP、TIA、Driver等。Scale across场景快速发展，驱动相干可插拔光模块需求增长 IDC研究显示，全球边缘企业基础设施支出预计将从2025年的500亿美元增长至2030年的1100亿美元，主要驱动力正是AI工作负载的边缘化部署，算力供给正在从集中走向分布，Scale-Across逐步成为下一阶段关键场景。Marvell也指出AI数据中心之间互联的带宽需求为传统DCI的15倍，传输距离可达1000km，由此带来相干光模块需求快速增长，1.6T、3.2T阶段相干光模块演进预期加速，利好具有相干技术的厂商。#相关标的：光迅科技、德科立等Scale in带来互联新需求，芯片架构创新和先进封装迭代重要性进一步凸显 Scale In本质是通过芯片架构创新和先进封装技术，在有限物理空间内最大化算力密度与互联效率，随着大模型参数规模向万亿乃至百万亿级跃迁，单纯依赖工艺制程提升已难以满足能效与带宽需求。当前电接口仍为主流，互联距离仅为10mm左右；Marvell计划将光学原生能力拓展至计算领域，采用光学芯粒集成实现规模化接入，从而使互联距离达到1.5m以上，该场景下Marvell计划采用μLED、μVCSEL光源路线，利好布局Micro LED或VCSEL的相关公司。#相关标的：长光华芯等。风险提示：技术升级迭代风险、路线竞争与标准分歧风险、宏观政策波动的风险、汇率波动风险。#文字观点", "publish_time": "2026-10-07 23:30", "tags": ["相关标的", "光迅科技、德科立等", "长光华芯等", "文字观点"]}, "post:2026-10-07T11-04:1f37a479bf7a": {"id": "post:2026-10-07T11-04:1f37a479bf7a", "kind": "post", "title": "2026-10-07 11:04", "source_label": "帖子正文", "excerpt": "美股盘面及行业观察#交易台纳斯达克 100 指数（NDX）收涨50 个基点，然而，市场广度再次表现不一，罗素 2000 指数（R2K）当日收跌约50 个基点，在过去 16 个交易日中，NDX 有 14 天跑赢 R2K，且当日有约 40% 的 NDX 成分股下跌。成交量和活跃度依然适中，市场情绪充其量", "content": "美股盘面及行业观察#交易台纳斯达克 100 指数（NDX）收涨50 个基点，然而，市场广度再次表现不一，罗素 2000 指数（R2K）当日收跌约50 个基点，在过去 16 个交易日中，NDX 有 14 天跑赢 R2K，且当日有约 40% 的 NDX 成分股下跌。 成交量和活跃度依然适中，市场情绪充其量只能说是 “复杂”，投资者正在争论，在当前背景下（利率、原油、广度不佳、选举等），继续追逐科技 / AI 板块，这似乎是过去 1 个月里唯一表现亮眼的美国股票题材，是否仍有意义。 投资者同时也在探讨，在市场领涨板块（半导体、七大科技巨头、网络安全等）接近超买水平时，“等待” 回调是否是更好的选择。 今日最受关注的咨询问题，排名第一的绝对是：为什么半导体设备股表现滞后，尤其是 KLAC、LRCX？背后存在一堆似是而非的原因。 硬盘驱动器（HDD）类股走向如何，是否具备防御属性？ 是什么因素在持续推高网络安全板块？ SPHR 回调的幅度有多大，是否值得关注？ 在线旅游平台（OTA，尤其是 ABNB）的疲软表现如何解读？为什么 TWLO 下跌了 6%？ 明日事件，整体议程不多，包含美联储会议纪要。 微软 Windows & Surface 发布会，于美国东部时间下午 1 点举办。 亚马逊举办 Prime 会员大促活动。 西门子湾区半导体峰会。 纽约广告周活动。 2026 阿姆斯特丹世界人工智能大会。 网络安全焦点，并不是说估值一定存在 “上限”，特别是对于主题方向正确的公司而言，但值得注意的是，CRWD 目前的远期企业价值 / 销售额（EV/Sales）已达40 倍，接近其在 20/21 年触及的峰值水平。 需要说明的是，20/21 年当时 10 年期国债收益率约为 1%，而当前收益率接近 5.5%。 我们持续收到关于网络安全板块倍数扩张持久性的咨询，投资者关心业绩增长是否 “足够” 支撑这些估值倍数，以及什么因素会打破这一趋势。 话虽如此，顺势而为仍是上策，因为很难反驳 “安全” 在未来日子、月份、年份里将变得愈发重要这一主题框架。 互联网观察，在大型股之外，我们感觉到在进入第三季度互联网财报季之际，关于 “是否值得” 的讨论日益增多。 投资者正在辩论，考虑到持续的自上而下层面的讨论，包括智能体商业、油价与利率因素，相关标的在交易日之后是否还有后续上涨空间。 顺带一提：尽管在 BKNG、EXPE、UBER、NFLX、PINS、APP 这类股票中没有太多抄底呼声，但值得注意的是，我们开始收到一些 “还有下跌空间吗” 之类的问题。 大型科技股，经过数月的盘整，亚马逊的图表似乎正试图突破近期的下行趋势，同时年内剩余时间会迎来更好的季节性行情。 半导体板块，在经历了像今天这样的行情后，光学器件大幅上涨，而存储、半导体设备大幅下跌，我们感觉到关于 AI / 半导体 / 硬件细分领域合理估值倍数的争论仍在继续。 大多数反馈将原因归结为毛利率走势或相对规模，如市值或者营收。在过去的 3.5 年多时间里，这些估值一直存在很大的波动性。#文字观点", "publish_time": "2026-10-07 11:04", "tags": ["交易台", "文字观点"]}, "attachment:files/中信建投-房地产行业：按揭贴息落地，中央财政首次支持信号意义重大-261006.pdf": {"id": "attachment:files/中信建投-房地产行业：按揭贴息落地，中央财政首次支持信号意义重大-261006.pdf", "kind": "attachment", "title": "中信建投-房地产行业：按揭贴息落地，中央财政首次支持信号意义重大-261006", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时 请务必阅读正文之后的免责条款和声明。 证券研究报告·行业简评 按揭贴息落地， 中央财政首次支 持信号意义重大 核心观点 9月29日三部门联合发布《通知》，房贷贴息自 10月1日正式 落地。 本次贴息为中央财政首次直接支持需求侧，信号意义重大。 贴息精准锚定刚需，最多可减少付息 5万元，直接降低居民购房 成本，有助于驱动刚需入市。同时本次贴息将二手房纳入补贴范 围，有利于稳定低总价刚需住房价格、 打通置换链条。本次政策 与828现房销售改革形成供需两端共振，有助于加快行业止跌回 稳。 事件： 9月29日，财政部、中国人民银行、金融监管总局联合发布《关 于实施居民购房贷款贴息政策的通知》（下称 “《通知》”），政 策自2026年10月1日起实施，实施期限暂定 1年，其间经办银 行新发放的符合条件的首套住房商业性个人住房贷款，财政部门 按照贷款本金给予年化 1个百分点、期限不超过 5年的贴息支 持，单户可享受贴息的贷款规模上限为 100万元。 简评 中央财政首次直接支持需求侧，信号意义重大。 《通知》明确贴 息资金由中央财政、地方财政按照 90%、10%承担，政策由过往 的地方性补贴上升至全国性财政金融政策。同时，政策从供给端 转向需求端发力，根据中国人民银行数据， 2026年二季度全国新 发放商业性个人住房贷款加权平均利率为 3.06%，贴息后符合条 件的购房者前5年实际商业贷款利率降至 2.06%，商贷利率的下 降也为后续公积金利率下调创造条件，需求侧政策仍有发力空 间。 政策精准锚定刚需，利好二三线城市库存去化。 《通知》明确贴 息支持对象需同时满足新发贷款购买首套房（不包括置换存量贷 款）、购房减免为120平米及以下、购房总价在 150万元及以下 三个条件，对应均价在 1.25万/平米以内，因此政策主要覆盖二 三线城市刚需购房群体，有利于二三线城市库存去化。 贴息力度适中，直接降低居民购房成本。 本次贴息按照贷款本金 给予年化1个百分点、期限不超过 5年的贴息支持，单户可享受 贴息的贷款规模上限为 100万元，贴息政策最多可为购房人减少 付息5万元，直接降低居民购房成本，利好需求释放。 二手房纳入贴息范围，有利于打通置换链条。 此前地方政策多 维持 强于大市 竺劲 zhujinbj@csc.com.cn SAC 编号:S14405191  合同时，以 适当方式告知贴息比例、贴息期限、贴息额度等要素，确保借款人知晓政策内容；按月收息时，自动扣除对应 贴息金额，实现“免申即享”，并通过手机短信、 APP消息等方式告知借款人国家政策享受情况。 （二）强化各方协同。 财政部牵头组织实施，做好预算管理，加强资金使用情况监督。金融管理部门按职 责分工做好房地产信贷管理，指导督促经办银行依法合规开展贷款发放和贴息工作。中国人民银行省级分行与 省级财政部门共享相关政策执行情况，强化货币政策与财政政策协同联动。 （三）加强联合监管。 财政部会同金融监管总局适时组织财政部 各地监管局、金融监管总局各监管局开展 联合抽查，发现通过违规操作套取骗取贴息的，收回贴息资金。对与客户合谋进行违规操作的银行，严格追究 责任，情节严重的，不得继续经办相关贴息业务。 财 政 部 中国人民银行 金融监管总局 2026年9月29日 下载日志已记录，仅供内部参考 3 行业简评报告 房地产 请务必阅读正文之后的免责条款和声明。 风险分析 1、销售不及预期，房地产销售未来仍有继续下行或恢复不及预期的风险，将会对房企的开发业务规模带来 影响； 2、结转不及预期：施工进度受多重因素影响，施工进度变慢将导致结转不及预期； 3、房企信用修复不及预期：部分高杠杆的民营房企出险可能性仍存，导致行业整体信用修复进度缓慢，影 响房企公开市场债务的融资规模与融资成本，进而导致行业竣工及现金流压力加剧。 4、宏观经济波动风险。当前外部经济形势不确定性较大，可能影响居民对经济以及收入预期，从而影响购 房意愿。 下载日志已记录，仅供内部参考 4 行业简评报告 房地产 请务必阅读正文之后的免责条款和声明。 分析师介绍 竺劲 地产、周期及中小盘研究组组长，房地产和建筑行业首席分析师，北京大学国家发展 研究院金融学硕士，专注于房地产、物业管理等行业研究， 13年证券从业经验。 连续三年（2018-2020）荣获最佳行业金牛分析师奖（房地产行业），获得 2020年新 财富最佳分析师（房地产行业）入围奖， 2020年机构投资者·财新资本市场分析师成 就奖（房地产行业）大陆区入围奖， 2020年卖方分析师水晶球奖（房地产行业）第 5 名。 吴梦茹 房地产组分析师，香港中文大学经济学硕士，曾任职于上市房企资本运作中心，物业 公司上市小组，华安证券和财通证券研究所，研究领域为房地产开发及物业管理，工 作地上海。 下载日志已记录，仅供内部参考 行业简评报告 房地产 评级说明 投资评级标准 评级 说明 报告中投资建议涉及的评级标准为报告发布日后 6 个月内的相对市场表现， 也即报告发布日后的 6个 月内公司股价（或行业指数）相对同期相关证券市 场代表性指数的涨跌幅作为基准。 A股市场以沪深 300指数作为基准； 新三板市场以三板成指为基准； 香港市场以恒生指数作为基准；美国市场以标普 500 指数为基准。 股票评级 买入 相对涨幅15％以上 增持 相对涨幅5%—15％ 中性 相对涨幅-5%—5％之间 减持 相对跌幅5%—15％ 卖出 相对跌幅15％以上 行业评级 强于大市 相对涨幅10%以上 中性 相对涨幅-10-10%之间 弱于大市 相对跌幅10%以上 分析师声明 本报告署名分析师在此声明：（ i）以勤勉的职业态度、专业审慎的研究方法，使用合法合规的信息，独立、客观地出具本报告 , 结论不 受任何第三方的授意或影响。（ ii）本人不曾因，不因，也将不会因本报告中的具体推荐意见或观点而直接或间接收到任何形式的补偿。 法律主体说明 本报告由中信建投证券股份有限公司及 /或其附属机构（以下合称“中信建投” ）制作，由中信建投证券股份有限公司在中华人民共和国 （仅为本报告目的，不包括香港、澳门、台湾）提供。中信建投证券股份有限公司具有中国证监会许可的投资咨询业务资格，本报告署名分 析师所持中国证券业协会授予的证券投资咨询执业资格证书编号已披露在报告首页。 在遵守适用的法律法规情况下，本报告亦可能由中信建投（国际）证券有限公司在香港提供。本报告作者所持香港证监会牌照的中央编 号已披露在报告首页。 一般性声明 本报告由中信建投制作。发送本报告不构成任何合同或承诺的基础，不因接收者收到本报告而视其为中信建投客户。 本报告的信息均来源于中信建投认为可靠的公开资料，但中信建投对这些信息的准确性及完整性不作任何保证。本报告所载观点、评估 和预测仅反映本报告出具日该分析师的判断，该等观点、评估和预测可能在不发出通知的情况下有所变更，亦有可能因使用不同假设和标准 或者采用不同分析方法而与中信建投其他部门、人员口头或书面表达的意见不同或相反。本报告所引证券或其他金融工具的过往业绩不代表 其未来表现。报告中所含任何具有预测性质的内容皆基于相应的 假设条件，而任何假设条件都可 GR约2%（前五年不足1%）。 • 制造业回流预计贡献约102 TWh的增量电力需求，其中得克萨斯州占近半数，主要受电池与电动车供应链投资拉动。 三、居民需求（电动车+热泵） • 电动车（EV）：假设美国轻型车销量维持约1,600万辆/年，EV份额每年提升约2个百分点，到2030年达20%（五年累计新增约1,600万辆EV）。基于DOE数据（年均行驶约1.4万英里、能耗0.3 kWh/英里），预计新增电力需求约66 TWh。 • 热泵：美国空气源热泵年出货量约400万台，预计至2030年累计新增约2,000万台，单台年耗电约3.4 MWh，贡献增量约69 TWh。 • 居民板块整体CAGR约2%，从当前约1,500 TWh增至2030年约1,700 TWh。 四、交通与输配电损耗 • 交通需求体量极小（约7 TWh），主要覆盖公共交通系统用电，预测期内持平。 • 输配电历史线损率约8%，在预测期内对应约400 TWh的\"隐性需求\"需被发电侧覆盖。 供给端预测：天然气与太阳能双核驱动 • 太阳能：预计2025—2030年CAGR约21%，为增速最快的电源。伯恩斯坦对EIA数据库中远期太阳能项目数据做向上修正（第3年+6%、第4年+20%、第5年+35%），以弥补其历史上对并网太阳能装机低估最高达50%的偏差，但因政策逆风较IRA时期更为谨慎。 • 天然气：作为平衡资源填补供需缺口，预计发电用气需求每年增长约2 bcfd（十亿立方英尺/日），至2030年累计增量显著；燃气发电CAGR约2.9%。 • 风电：CAGR约3.6%；可再生能源整体CAGR约9%。 • 煤电：持续退场，CAGR约-6%。 • 核电重启：手动纳入三项已公告的核电重启计划——Holtec Palisades（800 MW，2025年四季度）、Constellation Three Mile Island（835 MW，2028年一季度）、NextEra Duane Arnold（615 MW，2028年四季度），合计新增核电容量2,250 MW。 投资启示：谁是最直接受益者 伯恩斯坦明确指出，AI基建浪潮下电力板块的最大杠杆受益方为以下五类公司： 1. 天然气发电新增装机相关企业——燃气轮机、服务及设备商； 2. 核电重启与延寿运营商； 3. 电网设备与输电线路升级供应商； 4. 表后（Behind-the-Meter）及可调度、可靠且清洁的电力解决方案提供商（因并网排队周期过长，超大规模算力客户转向自建电源）； 5. 拥有高质量电力开发储备管道的电力公司。 覆盖标的评级与目标价（截至2026年10月2日） • 跑赢大盘（Outperform）：GE Vernova（GEV，目标价1,298美元）、Vistra（VST，181美元）、Constellation Energy（CEG，296美元）、NextEra Energy（NEE，108美元）、Fervo Energy（FRVO，47美元）。 • 与大盘同步（Market-Perform）：Bloom Energy（BE，282美元）、Ormat Technologies（ORA，112美元）、T1 Energy（TE，9美元）、Enphase Energy（ENPH，56美元）。 • 跑输大盘（Underperform）：First Solar（FSLR，197美元）。 主要风险 • 数据中心建设节奏的时变性是最大的预测不确定性来源。当前模型隐含2026—2030年新增约100 GW数据中心IT负载，但各州及RTO/ISO的暂停令（moratoriums）可能导致年度需求数据出现显著波动。 • 并网排队周期拉长与供应链瓶颈可能制约供给响应速度，进而影响需求兑现节奏。 投资结论 伯恩斯坦认为，美国电力市场正从\"低增长公用事业\"范式切换至\"高需求、紧平衡、多源竞合\"的新常态。4%的需求CAGR、千TWh级增量、数据中心过半贡献——这组数字背后是天然气发电设备、核电重启、电网设备、表后清洁电力四条主线的系统性投资机会。市场尚未充分定价\"谁能最快送电\"这一核心稀缺性，具备已并网资产、长周期服务合同和快速部署能力的平台型公司将持续获得估值溢价。#文字观点", "publish_time": "2026-10-07 21:29", "tags": ["文字观点"]}, "post:2026-10-07T20-37:b0d0ec0e54d8": {"id": "post:2026-10-07T20-37:b0d0ec0e54d8", "kind": "post", "title": "2026-10-07 20:37", "source_label": "帖子正文", "excerpt": "BofA：AI PCB/CCL 规格升级加速迈向 M9/M10 → 美国超大规模云服务商正推动 CCL 规格全面升级。NVIDIA、Google 和 Amazon 均在从 M7/M8 左右迈向 M9/M10，同时采用更高端的玻璃布、HVLP4/5 铜箔和更先进的 PCB 结构。", "content": "BofA：AI PCB/CCL 规格升级加速迈向 M9/M10 → 美国超大规模云服务商正推动 CCL 规格全面升级。NVIDIA、Google 和 Amazon 均在从 M7/M8 左右迈向 M9/M10，同时采用更高端的玻璃布、HVLP4/5 铜箔和更先进的 PCB 结构。 → NVIDIA 在 Rubin 级电路板上转向低 Dk/Q 玻璃，直接带动对高端玻璃布的需求。日东纺预计，FY3/27 的 NER 需求将增长 ~100%，次年还将再增长 ~60%（看好日东纺，3110）。 → Google TPU、Amazon Trainium 以及 1.6T/3.2T 网络正日益转向采用 HVLP4/5 铜箔；与此同时，三井金属矿业预计 HVLP4+ 占比将从 1H26 的 ~45% 升至 2H26 的 ~60%，且平均售价（ASP）也将提高。 → CCL 每一代升级带来的价值提升都相当可观。BofA 估计，M8.5 的价格比 M8 高约 50%，而 M9 则高约 100%，这意味着每套 AI 系统的材料价值增长速度可能远超出货量增长。", "publish_time": "2026-10-07 20:37", "tags": []}, "post:2026-10-07T21-30:bea4f5ec17a1": {"id": "post:2026-10-07T21-30:bea4f5ec17a1", "kind": "post", "title": "2026-10-07 21:30", "source_label": "帖子正文", "excerpt": "【财通大化工&ai材料】M9/10树脂方案假期更新：建议重点关注碳氢BCB树脂，重大预期差，确定性呈现量涨价升趋势，建议关注#呈和科技/东材科技结论：碳氢树脂在高阶CCL/PP的的应用持续扩大。具体为：1、26年Q4放量的M9", "content": "【财通大化工&ai材料】M9/10树脂方案假期更新：建议重点关注碳氢BCB树脂，重大预期差，确定性呈现量涨价升趋势，建议关注#呈和科技/东材科技结论：碳氢树脂在高阶CCL/PP的的应用持续扩大。具体为：1、26年Q4放量的M9；2、27年Q2量产的Rubin Ultra NVL576之switchtray ；3、未来的M10。 1、Nvidia开始测试以碳氢树脂为主的无布CCL，评估能否满足2H27量产的Rubin Ultra NVL576之switchtray PCB需求。 2、M9方案最新进展，添加10%左右的BCB碳氢树脂可以显著改性电性能，玻纤布可以从Q布调整成二代布，成本下降约20%（具体测算可以私信），根据头部CCL厂家反馈，M9方案未来会是ODV碳氢+少量BCB碳氢+二代布+HVLP4铜。 2、M10四大主流测试方案的共同点在于BCB树脂。我们了解到，目前M10有四大主流方案，他们共性在于都需要绝对增量的BCB树脂。最有可能的方案是：PTFE有布core层+PP层方案或者纯碳氢树脂（BCB)+二代布core层+PP层方案。 3、我们测算（具体私信），BCB碳氢树脂在2027-2029年需求量为1350吨，5400吨，9720吨，BCB单价300万/吨，2029年市场空间270亿左右。由于目前单体产出有限，在未来两年时间内会出现紧俏供给问题。 综上，我们认为市场对于BCB树脂的认知存在很大的预期差，确定性和爆发性是当下AI材料中最强的方向，建议重点关注：呈和科技、东材科技等。#文字观点", "publish_time": "2026-10-07 21:30", "tags": ["呈和科技", "东材科技", "文字观点"]}, "post:2026-10-07T23-30:a4edaec02d14": {"id": "post:2026-10-07T23-30:a4edaec02d14", "kind": "post", "title": "2026-10-07 23:30", "source_label": "帖子正文", "excerpt": "各位领导好，我们更新了中信电子组【电子亮马组合】26年10月/Q4的金股组合如下，供领导们参考：【26M10-月度金股5只】：三环集团（MLCC涨价）、聚辰股份（AI存储）、睿创微", "content": "各位领导好，我们更新了中信电子组【电子亮马组合】26年10月/ 元。\u003c/li>\n\u003cli>机器人量产线索强化：Optimus灵巧手良率提升带动本体10月产能迅速爬坡，预计11月左右周产1k+；特斯拉下调自研AI芯片内存配置保障Optimus量产内存供应；英伟达讨论再向Figure投资10亿美元。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cp>\u003cstrong>AI算力/大模型\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：海外AI硬件与模型侧催化共振，算力链和AI应用继续被验证。\u003c/li>\n\u003cli>今天强化的逻辑：纳指再创新高、AI产业趋势不变；三星电机AI服务器MLCC长协锁至2027；政策端，10月5日特朗普任命国家情报总监JayClayton领导“超级智能特别工作组”，9月29日白宫与Google、Anthropic、Meta、OpenAI、xAI、Nvidia签署四层管控《超级智能协议》，龙头模型与算力公司的政策不确定性显著下降；Anthropic拟上市，2025年营收45.9亿美元，同比增1088%。\u003c/li>\n\u003cli>今天催化/验证：台股AI硬件全线爆发，PCB/CCL领涨，5日港股建滔/胜宏/广和/景旺单日大涨；智谱GLM-5.3上线Amazon Bedrock，定价具备竞争力，有望提升全球调用量；Muse 9月8日上线，首日美国iOS下载约8.3万，前两周约280万，9月底突破500万；AI智能体影响高价值购买决策，旅游占支出30%、仅占交易量12%；AI资本开支总额100美元中，半导体芯片板块合计50美元，加速器25、内存15、CPU及其他服务器生产芯片10；SpaceX计划通过阿波罗主导的融资筹集400亿美元采购英伟达芯片。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>半导体/先进封装\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：先进制程与存储涨价、扩产和设备。\u003c/li>\n\u003cli>今天强化的逻辑：先进制程和存储不断涨价背景下，持续看好半导体设备；长鑫科技349亿元投向研发与后道测试，其中技术研发241亿元、存储器晶圆后道测试基地二期108亿元；公司已完成明年大部分HBM供货协议，价格显著提高；南亚科通知客户再次调高DRAM合约价，涨幅上看20%，打破市场先前对新增产能改变供需、压抑报价的预期。\u003c/li>\n\u003cli>今天催化/验证：美光涨超3%带动存储板块；电子行业周报主题为美光业绩超预期并上修资本支出，假期海外半导体设备领涨；台积电3纳米18B晶圆厂预计到2026年底月产能约200千片，全部八个阶段满产，每阶段平均25千片、个别上限30千片；AMD CEO苏姿丰将与三星芯片负责人会面，内存短缺问题严峻；AMD需求仍显著高于供给，2027或进入供给释放期，产能规划周期由1-2年拉长至3-5年，并要求先进晶圆、先进封装、基板及HBM同步扩产。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>光通信/CPO\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：FCC监管路径清晰、互联需求与Marvell指引。\u003c/li>\n\u003cli>今天强化的逻辑：FCC限制短期不影响光模块业绩，随着预期消化，利空有望逐步出尽；限制更可能渐进式，不明显影响当前800G、1.6T供应，而从3.2T开始提高准入门槛，同时要求更多核心零部件和BOM价值量来自美国供应链；对A股光通信龙头中性偏利好，若按美系BOM≥65%豁免，LPO/NPO难达标，但带DSP的分立EML-DSP和硅光CW-DSP可通过采购美系DSP、激光器等满足合规。\u003c/li>\n\u003cli>今天催化/验证：预计限制最可能在3.2T代际落地，2028爬坡、2029放量，对800G/1.6T无实质影响；Marvell投资者开放日指出到CY30互联总市场规模650亿美元，CY25-CY30 CAGR约65%；上调FY28营收指引至约200亿美元，数据中心营收增速约80%；FY29（CY28）ASIC收入从10b上修至12b+，但低于买方预期，FY28收入指引20b对应EPS约$8，比consensus高$1左右；相干模块预计从当前不足100万只（400G为主）增长至2030年超过300万只；纳真科技称美国工厂、四大智能制造基地及明年美国本土大规模大功率光芯片产能能力。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>PCB/CCL/铜箔\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：AI PCB/CCL规格升级加速。\u003c/li>\n\u003cli>今天强化的逻辑：美国超大规模云服务商推动CCL规格全面升级；NVIDIA、Google和Amazon均从M7/M8左右迈向M9/M10，同时采用更高端玻璃布、HVLP4/5铜箔和更先进PCB结构；载板产业链方面，Rubin ultra及使用EMIB的TPU、Trainium载板尺寸持续放大推动ABF需求爆发，上游短缺的T布、载体铜箔、BT Core板景气加码。\u003c/li>\n\u003cli>今天催化/验证：假期台股AI硬件全线爆发，PCB/CCL领涨，5日港股建滔/胜宏/广和/景旺单日大涨；M9/10树脂方案假期更新建议重点关注碳氢BCB树脂，重大预期差，确定性呈现量涨价升趋势，碳氢树脂在高阶CCL/PP应用持续扩大，26年Q4放量的M9。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>机器人/自动化\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：Optimus量产量产爬坡与产业投资。\u003c/li>\n\u003cli>今天强化的逻辑：Optimus本体产量持续爬升，新增授信+降芯片规格保障量产顺利推进；灵巧手良率逐步提升带动本体10月产能迅速爬坡，本体产能爬坡打消供应商生产累库问题，10月将迎来本体的量产拐点，预计到11月左右提升至周产1k+，本体起量将支撑供应商订单景气；特斯拉主动下调自研AI芯片的内存配置，为保障Optimus人形机器人的量产内存供应。\u003c/li>\n\u003cli>今天催化/验证：英伟达讨论再向人形机器人公司Figure投资10亿美元；人形机器人板块周观点主题为商业化落地加速、进入量产验证期。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>液冷/电源\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：OCP峰会前瞻、800V直流供电与SOFC。\u003c/li>\n\u003cli>今天强化的逻辑：OCP全球峰会前瞻（10/12–15圣何塞）五大主题包括异构AI系统（利好AMD、Marvell、博通）和800V直流供电落地节奏（看好TI、MPWR、AEIS、台达）；根据BE测算，1GW AI数据中心采用SOFC+800V DC方案，非算力CAPEX降低36亿美元，降幅27%；预计SOFC出货量也将相应上修。\u003c/li>\n\u003cli>今天催化/验证：SOFC深度（4）称扩产&amp;降本超预期，非AI需求仍被低估，BE扩产超预期，看好SOFC出货量上修；美国AIDC正面临社区更严格审查，SOFC清洁低碳优势能缓解当地居民对环境污染和审批担心，正日益受到客户青睐；数据中心冷却设备方面，CDU后市场服务价值显著弱于传统冷水机组，长期持有逻辑更偏向冷水机组OEM；飞龙股份26Q3业绩预告显示主业承压，液冷大泵Q3交付约1.5k台预计Q4确收，26Q1‑Q3归母净利润0.95亿元到1.17亿元，yoy‑67%到‑59%。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>海外AI硬件与市场：台股AI硬件全线爆发，PCB/CCL领涨，5日港股建滔/胜宏/广和/景旺单日大涨；纳指、标普500创收盘新高；标普500上涨58bp收7818，MOC净卖出28亿美元；纳指100上涨48bp报31224；NDX收涨50bp，R2K收跌约50bp，过去16个交易日NDX有14天跑赢R2K，约40%的NDX成分股下跌。\u003c/li>\n\u003cli>亚洲风险情绪降温：日本日经-0.92%，香港恒生-0.62%，亚洲股市收盘普遍下跌；韩国投资者因杠杆ETF损失17亿美元；台湾取代韩国登顶全球市场，随着AI交易扩大。\u003c/li>\n\u003cli>MLCC：三星电机10月6日披露2856亿韩元AI服务器MLCC长协，锁至2027年全年，为今年第6份同类合同；AI MLCC为当前最强方向，需求外溢带动普通高容涨价。\u003c/li>\n\u003cli>半导体/存储：长鑫科技349亿元投向研发与后道测试；公司已完成明年大部分HBM供货协议且价格显著提高；美光涨超3%带动存储板块；南亚科再次调高DRAM合约价，涨幅上看20%；台积电3纳米18B晶圆厂预计到2026年底月产能约200千片，八阶段满产；AMD CEO苏姿丰将与三星芯片负责人会面，内存短缺严峻。\u003c/li>\n\u003cli>光通信：FCC监管路径逐渐清晰，短期不影响光模块基本面；预计限制最可能在3.2T代际落地，2028爬坡、2029放量，对800G/1.6T无实质影响；Marvell投资者开放日上调CY30互联总市场规模至650亿美元、CY25-CY30 CAGR约65%，并上调FY28营收指引至约200亿美元；智谱GLM-5.3上线Amazon Bedrock。\u003c/li>\n\u003cli>机器人：Optimus灵巧手良率提升带动本体10月产能迅速爬坡，预计11月左右周产1k+；特斯拉下调自研AI芯片内存配置保障Optimus量产内存供应；英伟达讨论再向Figure投资10亿美元。\u003c/li>\n\u003cli>并购与融资：施耐德电气$237bn收购工业软件龙头PTC（10月5日），全现金每股$205，股权估值$226bn，企业价值$237bn，较停牌前溢价42.3%，交割预期2027Q3，待股东+多国监管审批；PTC美股+33.5%，市场担忧对价高，资本回报周期≈5Y；传音控股寻求通过香港发行股票筹集至多33.6亿港元（4.28亿美元）；SpaceX计划通过阿波罗主导的融资筹集400亿美元采购英伟达芯片。\u003c/li>\n\u003cli>宏观与消费：截至10月6日晚，影响周四A股开盘的主要事件包括美国就业走弱、通胀压力仍存，加息预期有所缓和但高利率继续制约估值；国庆前五天全社会跨区域人员流动量同比增长0.32%，铁路客运量同比增长11.88%，民航客运量同比下滑1.55%；前三天78个步行街（商圈）客流量、营业额同比分别增长3.4%、5.3%；自2026年10月10日起国内航线燃油附加费上调，800公里以下50元、上涨10元，800公里以上90元、上涨20元；特朗普表示正考虑暂停征收联邦汽油税以在11月中期选举前缓解高昂能源成本。\u003c/li>\n\u003cli>其他行业：房地产沪穗细则落地，新政持续推，按揭贴息落地，中央财政首次支持信号意义重大；基础化工8月化工品出口同比增速放缓，石化板块延续较快增长；9月游戏版号209款，国产206款、进口3款，连续第二个月单月超200款；艾博生物与诺华达成首付款5.75亿美元授权，授予诺华核心资产ABO2203全球独家许可；美国电力需求2025—2030年CAGR由3%上调至4%，到2030年累计新增用电约1,000 TWh；欧盟拟对中国混合动力汽车设进口上限。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>OCP全球峰会（10/12–15圣何塞）：异构AI系统、800V直流供电落地节奏。\u003c/li>\n\u003cli>光通信FCC政策：3.2T代际落地、2028爬坡/2029放量、美系BOM≥65%豁免路径。\u003c/li>\n\u003cli>AI PCB/CCL规格升级：NVIDIA、Google、Amazon从M7/M8迈向M9/M10，高端玻璃布、HVLP4/5铜箔、先进PCB结构，载板/ABF需求。\u003c/li>\n\u003cli>半导体：美光上修资本支出后的设备链验证、先进制程和存储涨价、HBM供货协议、台积电3纳米产能、南亚科DRAM合约价。\u003c/li>\n\u003cli>机器人：Optimus 10月产能拐点、11月周产1k+、英伟达对Figure投资进展、人形机器人量产验证期。\u003c/li>\n\u003cli>MLCC：三星电机长协锁至2027后AI MLCC外溢与普通高容涨价。\u003c/li>\n\u003cli>施耐德收购PTC：2027Q3交割、股东和多国监管审批。\u003c/li>\n\u003cli>房地产：沪穗细则落地、按揭贴息落地后的推进。\u003c/li>\n\u003cli>新能源/汽车：欧盟拟对中国混合动力汽车设进口上限；锂电池材料价格周报、光伏价格周报后续数据。\u003c/li>\n\u003cli>宏观：美国就业走弱、通胀压力仍存，加息预期缓和但高利率制约估值；亚洲风险情绪降温。\u003c/li>\n\u003cli>AI大模型：GLM-5.3上线Amazon Bedrock后的全球调用量提升；Anthropic拟上市及2025年营收45.9亿美元、同比增1088%的后续。\u003c/li>\n\u003cli>液冷/电源：SOFC扩产降本、非A
