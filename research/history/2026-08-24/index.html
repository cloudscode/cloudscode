9d546398c", "kind": "post", "title": "2026-08-24 10:21", "source_label": "帖子正文", "excerpt": "#好些领导问为啥【无源业绩大幅超预期】我觉得核心原因就是我们一直说的，‼️Q2-3开始是行业业绩的大拐点！", "content": "", "publish_time": "2026-08-24 10:21", "tags": ["好些领导问为啥【无源业绩大幅超预期】", "原因-》很多通信企业", "量变引发质变", "业绩有望大幅超预期", "文字观点"]}}, "source_details": {"post:2026-08-24T17-03:6c5bc08dc617": {"id": "post:2026-08-24T17-03:6c5bc08dc617", "kind": "post", "title": "2026-08-24 17:03", "source_label": "帖子正文", "excerpt": "野村——韩国科技：2026年下半年科技巡回路演纪要 存储供需紧平衡延续，长协锁量锁价成行业共识。三星电子管理层对2027-2028年存储供需维持乐观判断，当前DRAM与NAND长协履约率仅60%-70%，仍有提升空间。", "content": "野村——韩国科技：2026年下半年科技巡回路演纪要 存储供需紧平衡延续，长协锁量锁价成行业共识。三星电子管理层对2027-2028年存储供需维持乐观判断，当前DRAM与NAND长协履约率仅60%-70%，仍有提升空间。公司已与5家头部数据中心客户签署5年期长协（设价格下限），另有5家处于谈判尾声，目标将60%-70%产能纳入长协框架，剩余30%-40%留作现货市场弹性调配。DRAM产能受晶圆厂建设周期及HBM产能挤占限制，2028年后年增速仍将封顶在20%左右。HBM虽利润率低于标准DRAM，但因其对AI客户的战略价值，收入占比将持续提升；管理层认为HBM定价将保持结构性坚挺，当前不会长期大幅上涨，因此通过长协锁定收益，且HBM利润率难以超越标准DRAM（受成本结构劣势及客户权衡取舍影响）。代工端因美国芯片厂商、ASIC客户及内部Exynos订单需求旺盛，正提前投资P5/P6基础设施并扩充4nm产能，股东回报维持自由现金流50%的派发比例，后续长协细节将在更多交易落地后披露。 SK海力士资本回报政策升级，HBM4驱动盈利上行。管理层宣布资本回报政策重大调整：此前50%的自由现金流派发比例从此前上限变为下限，未来3个月将推进回购注销，三季度将披露更多细节（含潜在股息上调或特别股息）。长协是平滑收入与自由现金流波动、弱化存储周期属性的核心抓手，目前正与约10家客户谈判，多采用5年期框架并选择性设置价格上下限，优先级为锁定需求能见度而非最大化价格。随着产品组合向HBM4迁移，HBM定价将持续上涨，且不受标准DRAM价格走势影响，叠加成本上升，当前价格不具备结构性下跌基础。供应端今年DRAM位元增速略超20%（含HBM），2027-2028年韩中两地产能合计有望推动NAND位元增速达20%-30%；制程迁移带来的位元增益将逐步消退，实际产能扩张重要性提升，龙仁集群（2033年前建成4座晶圆厂）及M17工厂将支撑长期增长。NAND增长仍由321层制程迁移及大连工厂扩产驱动。管理层淡化CXMT的竞争威胁，认为公司聚焦先进存储领域，且市场传闻的英伟达HBM降规需求是供应短缺导致的临时性妥协（非结构性需求变化），一旦短缺缓解将逆转。 SEMCO受益AI驱动，MLCC与基板业务双线向好。管理层预计2027年数据中心MLCC收入占比将显著提升，长期营业利润率将随产品组合优化及涨价持续上行。AI用MLCC均价更高，明年超大规模云厂商的长协（1年期、100%照付不议）将覆盖大部分MLCC收入。今年产能扩张超20%，但仍无法满足AI需求，预计2027-2028年前GPU功耗上升将带动MLCC单机价值量持续增长，行业产能利用率将从2026年下半年至2027年维持近满产状态。新签15亿美元2年期超大规模云厂商硅电容合同，作为被动元件与基板一站式供应商将获更多机会。玻璃基板正与4家客户合作，目标2028年量产，ABF基板营业利润率明年将显著改善。 三星SDI聚焦ESS电池，盈利拐点明确。三星SDI是野村电池板块首选标的，二季度已成功扭亏，ESS业务动能强劲。2026年下半年将进一步聚焦ESS，10月起将通过Stellantis合资工厂量产LFP电池。8月11日宣布收购通用在印第安纳合资工厂的持股，工厂建成后专产LFP电池。Stellantis合资厂现有1条7GWh NCA电池产线供ESS使用，2026年四季度将新增12GWh LFP产线，2027年上半年再增10GWh。管理层预计ESS收入三季度环比增30%-40%，四季度受LFP量产推动环比大增50%-60%；备电领域需求强劲，2026年BBU（电池备份单元）与UPS（不间断电源）收入预计同比增60%-70%。公司拟以约4.45万亿韩元向三星显示出售所持5%三星显示股权，交易8月27日完成，交易后仍持有10.2%股份。 HD现代电气AIDC成新增长极，变压器交付周期拉长。二季度利润率不及预期主要受产品组合变动影响（高毛利美国项目因安装延迟未确认收入，低毛利配电设备占比上升）。市场认为52亿美元新订单指引偏保守，管理层解释需考虑季节性（上半年订单强、下半年收入强）。美国收入占比将持续提升，当前 backlog 中美国占70%。中东订单因签约延迟二季度放缓，产能将向欧洲倾斜，欧洲订单利润率已匹配或超过中东。AIDC领域已签11亿美元长协（2027-2028年交付），预计数据中心相关订单占电力设备新订单比例将从2025年的1.8%升至2027年的16%，目前正与另外3家科技巨头谈判。熟练工人短缺是电力变压器产能主要瓶颈，交付周期已延长至约4年，配电与旋转设备交付周期已恢复正常。管理层未看到美国订单延迟迹象，因订单周期长且客户履约记录良好，对AI数据中心相关的船用发电机长期市场空间持谨慎态度。 LGD份额与结构双优化，OLED盈利持续改善。管理层上调大尺寸（TV/OLED显示器）与小尺寸（手机/智能手表）面板出货预期，OLED收入占比将持续提升。下半年增长依托三大支柱：出货量提升、美国核心客户份额扩大、高端手机占比提升（优于去年全产品线结构）。芯片与材料成本上涨仍是压力，但营业利润仍有望实现强劲同比增长。中尺寸IT面板将通过收缩LCD供应、聚焦战略客户改善盈利。折叠屏领域因现金流限制，将优先聚焦直板手机面板，暂未大规模投资折叠屏产线。小尺寸面板盈利受中国竞争对手技术迭代后份额下滑影响，压力可控。 HPSP NAND成新增长引擎，竞争壁垒稳固。二季度营业利润率超60%，受益均价上涨与汇率利好。应用结构显著变迁，随着客户采用更高层数NAND，2027年NAND将成为最大收入来源，晶圆代工与DRAM贡献次之。管理层认为短期无市场份额风险，竞争对手距量产认证仍有2-3年差距，当前设备仅用于研发而非商业化生产。当前产能100台/年，若客户释放2028年需求超预期信号，有望在2026年四季度至2027年一季度做出扩产决策，总部旁已预留土地，也可通过租赁临时洁净室过渡。 Soulbrain半导体材料迎上行周期，核心品类近乎垄断。二季度营收3120亿韩元（环比增18.3%、同比增36.3%），受主要存储厂商新厂爬坡驱动；原材料成本上涨压制利润率，但下半年将通过成本传导缓解。半导体业务（占营收84%）进入增长期，蚀刻液、CMP slurry及前驱体受益晶圆厂利用率提升、存储客户新产线放量及海外工厂产量增长，核心材料在国内存储客户中市占率达80%-100%，近乎垄断。显示业务（占7%）同比下滑因2025年二季度退出薄玻璃业务，剔除该因素后营收持平，2027-2028年下半年将随新品放量增长。电池业务（占7%-8%，历史占比约20%）受产能利用率仅20%压制，但管理层认为已触底（2025年营收约600亿韩元），随ESS需求与EV市场复苏将回暖。NAND层数提升将结构性增加材料用量，3D NAND用HSN蚀刻液近乎垄断，今年客户无降本压力，ASP有望提升，湿法蚀刻液利用率60%，正通过自动化扩产。公司正推动客户多元化，当前90%营收来自国内半导体客户。#文字观点", "publish_time": "2026-08-24 17:03", "tags": ["文字观点"]}, "post:2026-08-24T09-46:b31ee04256aa": {"id": "post:2026-08-24T09-46:b31ee04256aa", "kind": "post", "title": "2026-08-24 09:46", "source_label": "帖子正文", "excerpt": "骄成超声跟踪更新：先进封装弹性标的，长江存储重复订单落地 1、1）近期跟踪到武汉长江存储客户3D超扫复购订单落地，从首台到重复订单不到一年。此外，Q2 合肥长鑫存储客户小批量订单已经落地，全年DRAM客户订单保守预计10+台。", "content": "骄成超声跟踪更新：先进封装弹性标的，长江存储重复订单落地 1、1）近期跟踪到武汉长江存储客户3D超扫复购订单落地，从首台到重复订单不到一年。此外，Q2 合肥长鑫存储客户小批量订单已经落地，全年DRAM客户订单保守预计10+台。两大存储客户都实现了超扫重复订单，直接受益后续大扩产。2）此外，机构从产业跟踪到华虹、星辰、新芯、盛合、通富、长电等接近十家头部客户都在积极验证公司3D超扫，涵盖先进逻辑、先进封装等，目前客户评价良好，预计年内陆续看到订单兑现。 2、市场低估了3D超扫需求空间：1）全球超扫需求产业趋势确定，PVA现有超扫产能已全部锁定至27上半年，订单能见度已延伸至2028年。2）两存外，长电、通富、盛合、星辰、中芯国际等先进封装客户都规划了较大扩产，涵盖2.5/3D，国内需求超扫空间确定。保守预计HBM、2.5/3D单万片超扫需求台数20+/10+，NAND/DRAM/先进逻辑单万片超扫需求台数5-10，中期可以预计国内超扫需求市场规模50亿+/年，叠加耗材逻辑，潜在空间更加可观；3）公司在超声波设备赛道具备全球竞争力，完全可以参考锂电领域的份额去估算，国内有望接近独供状态，利润空间可以看到20亿级别。 3、1）C-SAM是HBM生产的刚需设备，3D堆叠要求高精度无损检测。若按照国内两存20万片计算，单万片需20-30台，单台价格超1千万，对应市场空间50亿，公司市占率有望超50%，耗材占比20%，净利率30-40%，对应利润10亿，给予30x，对应300亿市值空间。主业订单大幅改善、耗材提供持续增长。2）公司主业为超声波焊接，国内市占率超80%，受益于下游电池厂扩产，叠加开工率维持高位，锂电业务订单大幅改善，预计锂电设备收入增长50%，耗材收入增长30%，贡献收入7亿元，半导体+线束26年预计贡献收入3-3.5亿元，同增65%。公司26-27年归母利润预计达2.6/4.5亿元，同增121%/75%，给予27年30倍，对应150亿市值，叠加先进封装，市值空间可看到500亿。 观点总结：公司作为先进封装设备弹性标的，叠加近期存储客户重点进展以及卡位HNM增量的通胀环节，此前7月的跟踪点评中的市值目标不变，感兴趣的同学可自行搜索回顾，顺便温习逻辑对比进展，逢低关注反弹修复机会。---xz#文字观点", "publish_time": "2026-08-24 09:46", "tags": ["文字观点"]}, "post:2026-08-24T10-21:d3649ccc9cc8": {"id": "post:2026-08-24T10-21:d3649ccc9cc8", "kind": "post", "title": "2026-08-24 10:21", "source_label": "帖子正文", "excerpt": "【最新观点&市场情绪反馈】本周关注 （1）电子整体情绪反馈：本周电子板块整体-1.5%，排名20/30，其中元器件-5.1%跌幅较大。海外方面，本周美债长端利率冲高、油价及地缘风险抬升通胀担忧，同时市场对AI资本开支融资及回报的关注升温，科技股情绪转弱。", "content": "【最新观点&市场情绪反馈】本周关注 （1）电子整体情绪反馈：本周电子板块整体-1.5%，排名20/30，其中元器件-5.1%跌幅较大。海外方面，本周美债长端利率冲高、油价及地缘风险抬升通胀担忧，同时市场对AI资本开支融资及回报的关注升温，科技股情绪转弱。国内方面，海外科技调整叠加前期快速修复后的获利了结，市场分歧进一步加大，PCB、被动元件等方向调整较多，主题投资往苹果折叠屏、cc产业链相关方向聚焦。产业端基本面仍然强劲，PCB/CCL业绩及供需保持高景气，长电科技Q2净利润同比+107%、环比+91%，进一步验证AI驱动下的封测景气。整体来看，本周调整更多来自海外风险偏好及前期涨幅后的交易压力，产业景气趋势未变，市场进一步进入基本面筛选阶段。回归基本面，国内半导体设备、Fab及国产算力自主可控链上行趋势明确，全球AI带动PCB、AI电源及存储景气延续，叠加电子公司二季度业绩强劲，我们坚定看好板块后续表现。 （2）国产算力市场情绪及关注点反馈更新：腾讯阿里Q2资本开支合计超1200亿，处于显著上行阶段，拉动国内算力需求；与此同时，先进制程/HBM/Drmos等供给紧张约束了国产算力短期放量节奏。后续展望，考虑到需求端极其旺盛，H2随着供给约束逐步缓解，国产算力有望进入加速放量阶段，重点推荐上游的中芯国际/华虹宏力（先进制程），长鑫科技（HBM）， 通富微电/长电科技/甬矽电子（cowos）等，以及寒武纪等设计公司。 （3）HBM行业更新及持续推荐：海外HBM新一轮定价预计Q3落地，截至Q2，HBM3E、HBM4价格分别约15美元/GB、20美元/GB；受供应商竞争加剧及大客户议价影响，涨幅预计相对温和仅50%~100%。国内渠道采购HBM3、HBM3E达40～60美元/GB，价格中枢显著高于海外。市场预期国内原厂下半年有望量产HBM3，明年下半年有望量产HBM3E，国产HBM替代空间广阔，缺货高可见度下定价或显著高于海外，我们持续看好长鑫科技及相关产业链受益公司。 （4）存储龙头链市场关注点更新及持续推荐：周五晚间cjcc披露招股书，从19号辅导验收到20号辅导工作完成、到21号披露招股书，用时仅3天。当前市场关注存储产业链的机会，设备里面关注cc客户占比高的微导纳米、京仪装备、广钢气体，国产化率空间大的中科飞测、芯源微。此外国产算力驱动下的先进封装以及后道设备环节“通胀“、光刻机国产化催化下的相关零部件机会也是重要主线，关注长川科技、金海通、茂莱光学等。 （5）模拟行业更新及持续推荐：思瑞浦、纳芯微、圣邦等头部公司Q2业绩亮眼（基本同比翻倍），泛工业持续复苏为基石，光模块、多相电源等细分方向起量迅速且持续有超预期可能，此外fab、海外模拟龙头对行业景气度同样指引积极，多方验证产业周期向上趋势明确，我们预计国内龙头26H2/27年业绩持续向好，尤其高AI敞口公司，重点推荐圣邦股份、优迅股份等。#文字观点", "publish_time": "2026-08-24 10:21", "tags": ["文字观点"]}, "attachment:files/中信建投-机械设备行业周观点：存储IPO稳健推动利好半导体设备，船舶行业景气度持续上行-260823.pdf": {"id": "attachment:files/中信建投-机械设备行业周观点：存储IPO稳健推动利好半导体设备，船舶行业景气度持续上行-260823.pdf", "kind": "attachment", "title": "中信建投-机械设备行业周观点：存储IPO稳健推动利好半导体设备，船舶行业景气度持续上行-260823", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业动态 周观点：存储IPO稳健推动利好半导体设 备，船舶行业景气度持续上行 核心观点 （1）人形机器人：宇树登陆科创板、世界机器人大会 WRC顺 利召开，板块持续催化 ，建议聚焦优质环节。 （2）AIDC发电 设备：Q2全球燃机订单创历史新高，坚定看好国产燃机出海。 （3）工程机械：7月挖机内外销继续共振向上，板块将迎来逐 季度改善。（4）半导体设备：存储IPO继续推动，看好半导体 设备下半年创新高。（5）锂电设备：排产创新高、涨价潮启 动，锂电景气延续强势。 行业动态信息 人形机器人：宇树登陆科创板、世界机器人大会WRC顺利召 开，板块持续催化。宇树IPO定价150.80元/股，对应发行市值 约610亿元，超出此前预期，有望带动本体厂商估值重塑。国 产链厂商积极推动“大脑”、“小脑”、“本体”等多维度能 力建设，积极探索在工业、商业等多场景落地应用，出货量规 模持续扩大；随着机器人泛化水平提高，预计其落地场景将进 一步扩大。物理AI是人工智能的下一波浪潮，机器人是 AI最 好的物理载体之一，产业发展趋势明确。 2026世界机器人大会 将于8月19日至23日在北京亦庄北人亦创国际会展中心举 行；后续Optimus V3发布及量产进展、国产机器人新 品发布、 机器人公司IPO推进、应用落地将持续为板块行情带来催化， 建议聚焦优质环节。 AIDC发电设备：Q2全球燃机订单创历史新高， 坚定看好国产燃 机出海。2026Q2全球燃机订单约38GW，创单季度历史新高，美 国贡献接近一半；同时远期联合循环项目报价显著上升， 2030年 前后交付槽位仍高度稀缺。 PJM上半年与输电约束相关的价格调 整从去年同期的21亿提升至约60亿美元，进一步强化了表后燃 机的经济性。此外，杰瑞股份半年报披露燃机机组及配套设备自 2025年11月起累计新增订单超过 31亿美元，全球燃气轮机高景 气度延续。我们的观点： Q2全球燃机订单创历史新高，三巨头订 单、收入、利润率、产能、指引同步高增并集体上修，在手订单 规模为未来交付提供极强可见度。当前全球燃机需求高景气与交 付槽位紧张并存，行业供需缺口仍将延续。国产燃机凭借更短的 交付周期、较高的性价比及不断增强的产品竞争力，有望加快获 取海外市场份额。坚定看好国产燃机出海，重点看好整机【中 维持 强于大市 许光坦 xuguangtan@csc.com.cn SAC 编号:S1440523060002 SFC 编号:BWS812 陈宣霖 chenxuanlin@csc.com.cn SAC 编号:S1440524070007 籍星博 jixingbo@csc.com.cn SAC 编号:S1440524070001 吴雨瑄 wuyuxuan@csc.com.cn SAC 编号:S1440525070008 乔磊 qiaoleibj@csc.com.cn 010-56135085 SAC 编号:S1440525070006 发布日期： 2026年08月23日 市场表现 -3%7%17%27%37%47% 202 5/8/22 202 5/9/ 22 202 5/10 /22 202 5/11 /22 202 5/12 /22 202 6/1/ 22 202 6/2/22 202 6/3/ 22 202 6/4/22 202 6/5/22 202 6/6/ 22 202 6/7/22 机械设备上证指数机械设备 仅供内部参考，请勿外传 国动力】【杰瑞股份】等，推荐零部件【应流股份】【万泽股份】等 。 工程机械:7月挖机内外销继续共振向上 ，板块将迎来逐季度改善。 2026年7月销售各类挖掘机19521台，同 比增长13.9%。其中：国内销量7608台（含电动挖掘机41台），同比增长4.13%；出口11913台（含电动挖掘 机62台），同比增长21.2%。总体来看，内外销依旧维持正增长，其中出口依旧维持 20%以上高增速，内销增 速出现较多降速，结构上小挖增速降低，且受到去年 Q3内销基数相对较高影响，总体仍维持较好趋势，看好内 外需继续共振向上。今年挖机内销呈现较为明显的旺季后移，因为今年春节相比去年较晚，国内挖机自 3月以 来恢复较高的同比正增长，预计后续将继续维持增长。出口维持较强表现，并未受国际形势、关税变化、加息 预期等扰动，中国工程机械高增态势依旧维持。 国内格局改善，头部企业开始涨价。 三一、徐工、柳工、山推 等公司宣布对挖机、起重机等产品进行涨价，反映年初以来的行业价格战趋缓，行业转向良性发展。 半导体设备：本周长存招股书挂网， 全球景气周期持续确认，关注出海进程 。SEMI更新预测、预计半导体设 备未来3年持续增长。SEMI预计2026年全球半导体制造设备销售额将创下 1659亿美元的历史新高，同比 +23.2%。增长势头预计将持续至 2028年，总设备销售额有望达到创纪录的 2295亿美元，实现连续五年增长。 台积电上修26年资本开支。台积电预计2026年全年资本支出为600亿至640亿美元，此前预估为 520亿至560 亿美元，上调80亿美元，幅度约15%。ASML整体业绩全面超市场及公司前期指引。 季度总净销售额93.26亿 欧元，同比+21%、环比+6.4%，大幅超越公司前期 84–90亿欧元指引及市场88.5亿欧元一致预期，年内第二次 上调全年业绩目标，AI算力+存储复苏双驱动行业高景气，盈利结构持续优化。 全球半导体设备零部件正经历 一轮历史罕见的全链条涨价潮。 半导体产业链的定价权正从芯片终端向设备与零部件环节结构性上移。零部件 企业规模较小、固定成本占比高，涨价直接转化为利润；同时产线扩产周期长达 12-18个月，供给弹性最差。重 视阀门管路、陶瓷件、射频电源、 GAS BOX等海外供应商交期延长带来的国产替代诉求与涨价逻辑。 锂电设备：排产创新高、涨价潮启动，锂电景气延续强势。 一是排产与价格端，需求景气延续强势： 8月全市 场锂电总排产约304GWh、环比+7.4%，储能电芯排产125GWh、环比净增约10GWh，海外大储项目集中备货 推动储能跃升第一增长引擎；龙头 314Ah储能电芯报价上调2.17%，电芯涨价潮启动，叠加电池消费税 9月开 征，下半年量价双升信号明确。二是固态产业化端，工程化拐点确立：宁德时代宜宾全固态中试线 8月正式通 线，硫化物首批样品能量密度突破 500Wh/kg、循环寿命超1000次，规划2027年小批量装车验证；比亚迪重 庆璧山20GWh量产线三季度开工，全球首条万吨级高纯硫化锂产线在安庆动工、计划 2027年全面建成，上游 短板补齐；硫化物电解质成本已下降超 35%，全固态正由技术可行走向经济可行。三是装备兑现端，增量价值 量显现：上半年固态电池及核心材料公开投资项目超 40个、规划投资总额超 500亿元，中试线与量产线建设 高峰拉动干法电极、等静压、叠片等新工艺装备需求，单 GWh设备价值量约为液态产线 3-5倍，设备端率先 受益确定性强。当前板块处于排产高景气、固态装车验证与设备兑现三重共振窗口，继续看好锂电设备与固态 电池板块配置价值。 机械板块重点推荐： 中国动力、东威科技、杰瑞股份、中国船舶、恒立液压、奥比中光、三一重工、豪迈科 技、埃科光电、中微公司、先导智能、博众精工、徐工机械、中集集团、华测检测、迈为股份。 风险分析：国内宏观经济波动的风险、海外市场波动的风险、下游扩产不及预期的风险。 仅供内部参考，请勿外传 目录 总体观点：存储IPO稳健推动利好半导体设备，船舶行业景气度持续上行 ..................................................................... 1 专用设备重点子行业观点 .................................................................................................................................................................. 3 工程机械 ....................................................................................................................................................................................... 3 半导体设备 .................................................................................................................................................................................. 3 AIDC发电设备 ........................................................................................................................................................................... 4 PCB设备 ...................................................................................................................................................................................... 4 3C设备 ......................................................................................................................................................................................... 5 油服设备 ....................................................................................................................................................................................... 5 电梯................................................................................................................................................................................................ 5 轨交设备 ....................................................................................................................................................................................... 6 矿山机械 ............................................................................................... a3718e0218", "kind": "post", "title": "2026-08-24 10:55", "source_label": "帖子正文", "excerpt": "《广发海外电子通信》ASIC展望 Nvidia vs. ASIC：我们认为Nvidia 在 2027 年的份额将保持稳定；预计与 AMD 合计 GPU 整体份额将呈上升趋势。", "content": "《广发海外电子通信》ASIC展望 Nvidia vs. ASIC：我们认为Nvidia 在 2027 年的份额将保持稳定；预计与 AMD 合计 GPU 整体份额将呈上升趋势。我们认为 Nvidia 的 Vera Rubin 平台在性能/TCO/供应链方面领先，并在 AWS、Google 等CSP中持续拿份额。 TPU - 偏好联发科：我们先前下调Broadcom Sunfish 2026/27年出货量预测，预计2026年底开始出货、1Q27放量，维持2027年Broadcom向Meta供应Iris+及ARKE 5万片CoWoS的预测，但2H27将产能分配回TPU难度较高 (MTK Humufish凭N2制程优势进入爬坡)。投资者反馈市场担忧Humufish tape-out、Google AI模型进展较慢，然我们预计工程版tape-out将在今年11月左右完成，且通过率可控，因此我们偏好联发科。 Google Attach Silicon - 偏好 MRVL：我们继续看好Google的CXL、DPU及MPU带来显著收入贡献，预计2028年CXL和DPU可分别贡献~30亿美元收入、MPU将于2Q28基于台积电N2启动。我们认为Google的股权合作关系将提高MRVL获得2H28 TPU v10（Merope）的机会，但不影响MTK，因Icefish已确认。 AWS T3/T4 - 偏好 MRVL 与 SMTC：我们预计Marvell参与T3，CY26/27贡献~10亿/20亿美元收入，Marvell在收购Celestial AI后强化scale-up光互连能力，有望在T4获更高份额；加上ASP提升，预计T4在CY28对MRVL收入贡献将超30亿美元。此外，我们预计6.4T OE将成T4的主要规格，预测AWS在2H27E/2028E的T4将分别消耗500万/1,200万颗OE，并看好SMTC作为第二供应商的机会。 ASIC封装 - 偏好Intel及ABF载板厂商：我们已将Intel FY27/FY28后道业务收入预测上调至11亿/70亿美元，受益AWS T3在2027年采EMIB-T的可见度提升，以及Google Humufish/Triggerfish于2H27–2028年放量，并认为Intel有机会获得美国Fabless客户 (Microsoft、Qualcomm及Marvell)，覆盖ASIC、CPU及CPO。我们预计ABF载板将显著受益EMIB增长。#文字观点", "publish_time": "2026-08-24 10:55", "tags": ["文字观点"]}, "post:2026-08-24T07-09:31c8a238048e": {"id": "post:2026-08-24T07-09:31c8a238048e", "kind": "post", "title": "2026-08-24 07:09", "source_label": "帖子正文", "excerpt": "8月24日股市早报：长存控股/服务器/光通信/算力/铜/算力硬件/陶瓷基板/液冷/消费电子等一、重要财经信息①国常会：要积极顺应新一轮科技革命和产业变革趋势，牢牢把握新一代通信网建设的机遇②《促进网信企业高质量发展行动计划（2026-2030年）》：引导新建算力设施与可再生能源发电等协同布局 持续开", "content": "8月24日股市早报：长存控股/服务器/光通信/算力/铜/算力硬件/陶瓷基板/液冷/消费电子等一、重要财经信息①国常会：要积极顺应新一轮科技革命和产业变革趋势，牢牢把握新一代通信网建设的机遇②《促进网信企业高质量发展行动计划（2026-2030年）》：引导新建算力设施与可再生能源发电等协同布局 持续开展国家绿色算力设施建设 ③市场监管总局：具身智能机器人、固态动力电池等纳入质量强链二期攻关方向二、今日热点聚焦阿莱德：筹划取得源宝精密不低于51%股权 预计构成重大资产重组锦龙股份：筹划转让东莞证券20%股份 预计构成重大资产重组信濠光电：拟不超9.5亿元收购迪滴新能源100%股权。标的公司由滴滴出行、比亚迪两大行业头部企业联合合资设立，是双方在新能源合规出行运力领域的运营平台华阳集团：控股股东华越投资与九洲集团签署股份转让协议， 合成本依然是下降趋势， 8月22日OpenAI宣布GPT-5.6 Sol开发者价格 限时下调三个月，输入 /输出价格分别下调20%/33%，今年7月以来开源、闭源模型价格收敛，综合 token价格 下降，利好AI应用落地。 1 / 根据彭博，Anthropic近期告知投资人，其 7月份的ARR约650亿美金，而Yipit口径为约800亿美金，较 前者高20%。我们认为，几个原因可能导致 yipit口径较高：1）Yipit样本包含信用卡，可能有 creidt预付部分； 2）核心样本1300家公司为AI的early adopter，平均水平较高。但总体来看，现在比较明确的趋势是， Yipit之 前在口径上有高估A社但低估了OpenAI。我们认为全球大模型 ARR整体快速增长的趋势没有变化。 2/ 我们认为，随着Rubin进入规模量产，有望进一步打开大模型训练与推理的上限。我们回顾 Blackwell架构 推出后，GPT‑5.5、GPT‑5.3‑Codex和Grok 4.5等新一代模型开始明确使用 GB200/GB300训练，模型能力提升 主要体现在复杂编程、专业知识工作和长周期智能体任务。更高的集群规模、显存带宽和互联效率，推动模型 训练持续Scaling，并加速长上下文、MoE及强化学习等能力演进。 Rubin在HBM4、NVLink 6和每瓦Token 吞吐量等方面再次实现代际提升，有望支持更大参数、更长思维链及更复杂的智能体训练，模型的智能上限空 间仍然值得期待。 3/ 模型竞争仍然激烈，GPT sol系列降价，OxAlpha 模型引发讨论 我们观察到，本周OpenAI将GPT 5.6 Sol短上下文API价格由输入5美元、输出30美元/百万Token，下调至4 美元和20美元，降幅分别为20%和33%，优惠至少持续至11月21日；叠加此前Luna降价80%、Terra降价 20%，头部模型竞争正由单纯的能力比拼进一步转向价格、速度和 Agent可用性。与此同时，OpenRouter上线 匿名模型Ox Alpha，免费提供约105万Token上下文，支持文本、图像、视频和工具调用，定位长周期编程与 智能体任务，上线数日累计调用量已接近 100亿Token，其编程表现及真实来源迅速引发开发者讨论。 2、全球AI产业进展 AI 应用相关公司。下跌：汇量科技 -10.89%，美图公司 -1.45%，赤子城科技 -0.61%。 美股 NeoCloud（GPU 云）公司： 上涨：Galaxy Digital +9.14%。 下跌：Nebius -21.09%，CoreWeave -16.54%，Applied Digital -12.79%，Core Scientific -11.74%，Cipher Mining 仅供内部参考，请勿外传 2 行业动态报告 科技 请务必阅读正文之后的免责条款和声明。 -11.71%，TeraWulf -10.01%，Hut 8 -5.36%，IREN -4.95%，英伟达 -4.64%，Bit Digital -2.55%。 商业化：GPT-5.6 Sol开发者价格限时下调三个月 我们认为，token综合成本依然是下降趋势， GPT-5.6 Sol开发者价格限时下调三个月 。据OpenAI官方X账号， 在不断拓展能力边界并提升效率的同时，将在未来三个月内将 GPT-5.6 Sol的API及额度价格下调超20%，最 新输入/输出价格为每百万tokens 4/20美元，降幅分别为20%、33.3%。据SiliconData，目前整体LLM Token指 数稳中有降，尤其是今年 6月以来，下降趋势较为明显；闭源模型指数自今年 7月下降，且趋势陡峭；开源模 型指数从底部攀升，趋势向上，但目前涨幅相对较低。 图1: 全球主流大模型定价梳理（统一划归为美金） 数据来源：各公司官网，中信建投证券 仅供内部参考，请勿外传 3 行业动态报告 科技 请务必阅读正文之后的免责条款和声明。 图2:大语言模型token价格指数 数据来源：Silicon Data，中信建投证券 Token：本周OpenRouter预计token调用量环比增长19.6%，提速 本周（8.17-8.23）预计Token调用90.2万亿，环比+19.6%，周度调用再创新高 。本周提速增长预计系新模型 Ox Alpha上线，目前免费，且 MiMo-V2.5、Nemotron 3 Ultra折扣力度均较大，带动 token需求快速释放。本周 DeepSeek V4 Flash正式版的token调用保持排名第一，匿名模型 Ox Alpha 8.21上线OpenRouter，位于本周排名 第4，从技术指纹来看，较大概率是国产模型；本周排名前 5中4名为国产开 ） 【Omdia观察：AI监管应政策进展到什么阶段了？ 】2026年6月，Omdia发布了《AI监管：全球政策与监管 框架分析》报告以及分别针对美洲、亚洲与大洋洲以及欧洲的区域案例研究报告。这些报告评估了 AI政策和 监管举措，并讨论了需要应对的监管挑战。这些报告显示出，许多国家已宣布国家 AI战略，其共同目标是成 为AI领域的全球领导者。这些战略通常强调支持 AI研究与创新；培养AI技能和人才队伍能力；加速公共和 私营部门的采用；以及加强数据生态系统和信息通信技术基础设施的建设。出于国家安全和经济方面的考虑， AI也正成为世界各国政府的优先事项。 Omdia监管首席分析师Sarah McBride表示，许多监管机构采取了事后 监管方式，或优先制定伦理、隐私和安全指南。仅有少数国家发布了具体法规。例如，欧盟《人工智能法案》 于2024年8月生效（各项要求分阶段适用）。 2026年8月，欧盟《人工智能法案》第二阶段生效，扩展了对 高风险AI系统的义务，并提高了各行业的透明度要求，这标志着向 2027年全面实施迈出了重要一步。另一个 例子是韩国，其《人工智能基本法》于 2026年1月生效，使其成为第二个生效的全面人工智能法规。不过，在 不合规行为处罚生效前将有一年的宽限期。与欧盟《人工智能法案》类似，韩国《人工智能基本法》也 采取了 基于风险的方法。但与欧盟《人工智能法案》不同的是，韩国《人工智能基本法》仅适用于利用 AI提供产品 和服务的开发者或实体，而非 AI用户。（C114通信网） 5G/6G 【全球视野：5G专网处于发展转折点，未来几年仍充满挑战 】来自市场研究公司Omdia的最新报告《Omdia 市场雷达：2026年端到端5G专网供应商》显示，随着战略和投入水平的演变， 5G专网市场正在涌现新的发展 趋势。Omdia专网首席分析师Pablo Tomasi在报告中指出，5G专网市场正处于发展转折点，一些供应商正大幅 调整其战略。现实情况是 ，部分电信运营商和供应商对 5G专网市场的规模和增长抱有不切实际的预期。这导 致他们未能兑现承诺，并最终不得不面对与其描绘的场景截然不同的现实。然而，市场创新仍在继续，新产品、 新解决方案的发布以及并购活动仍在进行。 Globalstar推出其XCOM RAN端到端方案，就是一家公司瞄准特定 细分市场的典型例子。 在分析师看来，未来几年将充满挑战， 5G专网仍将是一个小众市场机会。这项技术不 下载日志已记录，仅供内部参考 5 通信 行业动态报告 请务必阅读正文之后的免责条款和声明。 会扩展到小型企业，但会继续在港口、机场、矿山、公用事业和大型制造工厂中稳步扩张。 5G专网市场仍需 要市场教育，但这项艰巨的工作此前主要 由诺基亚承担。随着诺基亚如今将重心大幅转向其他市场 ——包括光 网和AI——教育市场、游说频谱资源以及与电信运营商和系统集成商交互合作的重任，必须由更广泛的生态系 统共同承担。（C114通信网） 【Dell’Oro：全球RAN市场走势趋稳 前五供应商份额总计 96%】Dell’Oro集团的研究发现，全球无线接入 网（RAN）收入在第二季度同比略有增长，这是继两年多萎缩之后该领域连续第三个季度实现增长。 Dell’ Oro集团副总裁斯特凡·庞格拉茨（ Stefan Pongratz）表示，这一结果印证了该公司一直以来所传递的 观点： “由覆盖转向容量的调整在很大程度上已成为过去， RAN市场正在趋于稳定。”他指出，不同地区和供应商 之间的复苏仍不均衡，但连续三个季度的温和增长支持了未来走势更加稳定的判断。本季度，供应商的表现出 现分化。华为业绩强劲，而爱立信则低于预期。尽管存在差异，但整体供应商排名保持稳定，第二季度仅出现 小幅市场份额变动。Dell’Oro解释称，与2025年相比，2026年上半年的竞争格局总体保持平稳。华为、爱立 信、诺基亚、中兴通讯和三星仍位居上半年全球 RAN收入前五名，合计占市场份额的 96%。尽管第二季度表 现略强于预期，Dell’Oro维持对2026年全年的预测不变，仍预计全球 RAN收入同比基本持平。该研究公司 表示，供应链动态和区域需求模式仍是 2026年剩余时间需要关注的重要因素。此前由于运营商在早期 5G部署 周期中大力投入覆盖和容量升级，随后进入网络投资调整期， RAN市场已连续两年处于下滑状态。这导致供 应商在2025年底增长恢复前，长期面临需求放缓的局面。（ C114通信网） 【中国电信首度披露5G-A用户数，累计468万户】中国电信公布2026年第二季度主要运营数据。期间，中国 电信移动用户数净增 188万户，移动用户数累计 4.4243亿户。其中，5G网络用户数当季净增 837万户，5G网 络用户数累计3.2250亿户，渗透率提 盎司，SPDR黄金ETF周度持仓量+23.68吨至1047.21吨（自2026年7月17日开始增加，至今约+48.19吨）。伦敦银价格+6.52%至68.857美元/盎司，COMEX白银主连合约价格+6.46%至69.01美元/盎司，SLV白银ETF持仓量-16.87吨至15295.27吨。 #美债回购虽然释放托底信号，但尚未解决长端利率的核心矛盾。本周美国财政部宣布扩大长期国债回购规模，推动长端美债收益率快速回落、美元走弱，并带动黄金明显上涨。此次操作更重要的意义在于财政部向市场释放维护长债流动性、抑制收益率失序上行的政策信号，为美债及相关资产提供底部支撑。由于回购规模相较于长债市场体量仍然有限（公众持有债务32.27万亿美元，联邦债务总额40.05万亿美元），也没有改变财政赤字扩张、国债供给增加以及期限溢价上升等结构性问题。【对于黄金核心是财政出手，叙事逐步切换到美元信用交易的顺风局】。 #短期增长担忧升温，市场本周交易向“滞胀”摇摆。当前AI产业链短期遭遇逆风，叠加原油价格维持高位，市场一方面担忧科技投资与终端需求放缓，另一方面又面临能源成本对通胀的支撑，短期贴近“增长走弱、通胀偏高”的组合。相较于对经济增长和实体需求更为敏感的铜，黄金同时受益于避险需求、美元走弱及财政信用担忧，表现明显占优，金铜比上升至700附近，反映市场定价正在由增长交易向滞胀及货币信用风险交易切换。后续重点关注JH会议沃什论调对9月FOMC政策利率指引，当前9月CME定价加息25bp概率上升6.8%至39.9%；Polymarket 9月CME定价加息25bp概率上升6%至31%。但从经济和中期选举角度，我们认为9月整体按兵不动概率较大。 🔸对于金价，中期上涨高度依然维持在4800-4900美元/盎司 🔸对于权益，维持看好不变，黄金股或迎来中期维度的叙事顺风局（金价与估值双修复），全面看多黄金股，交易上当前已处于反转阶段，建议重点关注前期涨幅较少的板块头部黄金公司山金、招金、紫金黄金国际；以及板块有α公司赤峰、灵宝、万国、招金黄金等；银弹性标的盛达资源等。#文字观点", "publish_time": "2026-08-24 10:22", "tags": ["文字观点"]}, "post:2026-08-24T17-04:3ac739b00370": {"id": "post:2026-08-24T17-04:3ac739b00370", "kind": "post", "title": "2026-08-24 17:04", "source_label": "帖子正文", "excerpt": "野村——阿里巴巴（BABA.US）：为AI投资募资；股权配售落地消除估值压制 800亿港元股权配售落地，稀释可控且获超额认购。", "content": "野村——阿里巴巴（BABA.US）：为AI投资募资；股权配售落地消除估值压制 800亿港元股权配售落地，稀释可控且获超额认购。阿里巴巴宣布拟配售约7.1亿股新普通股，配售价112.70港元，较8月21日港股收盘价折让8.4%，募资总额约800亿港元（约合102亿美元），净额将100%投入全栈AI能力建设及基础设施扩容。据路透报道，本次配售获主权财富基金等机构踊跃认购，因需求火爆最终上调发行规模。测算显示本次增发仅稀释现有股东权益约3.7%，对股东影响可控。此前市场因担忧AI资本开支压力，8月21日阿里美股已提前下跌8.6%，本次融资落地将消除这一长期压制因素，引导市场注意力回归基本面。交易完成后，公司净现金将从6月末的700亿美元增至800亿美元。 融资方式虽超预期但合乎逻辑，债务成本上升是主因。野村此前预期阿里会优先选择债务融资，本次股权融资略超预期。但全球AI资本开支热潮下， hyperscaler（超大规模云厂商）债券发行激增，信用利差走阔、新债发行折让扩大、投资者覆盖率下降，使得债务融资的相对经济性显著弱化，选择股权融资具备合理性。 AI业务增长与盈利双升，自研芯片构筑核心壁垒。6月季度阿里云外部收入同比增速加速至45%，为连续第9个季度提速，管理层预计9月季度增速将超50%，12月及次年3月季度进一步加速。MaaS（模型即服务）年化收入已达160亿元人民币，有望在财年末突破300亿元。更重要的是，云业务盈利能力同步提升：调整后EBITA利润率达11.6%（去年同期约7%），管理层预计后续将持续改善，向20%的长期目标迈进，驱动因素包括收入高增长、利用率与定价优化、高毛利MaaS占比提升及自研平头哥芯片的规模化应用。平头哥芯片布局覆盖GPU、CPU、存储及网络全栈，已实现系统级优化。前代AI芯片累计出货超50万颗，最新一代国产芯片已于8月以超节点形式部署于阿里云平台，进入大规模商业化阶段；下一代国产AI芯片预计2026年下半年流片，同时支持大规模模型训练与推理，是国内少数具备商业级全场景支撑能力的AI芯片设计商。若先进GPU供应持续受限，自研芯片将成为阿里云极具差异化的竞争优势。 AI Labs亏损见顶，电商板块夯实现金流底座。本季度新设的AI Labs及应用板块（含千问模型业务及AI应用）6月季度调整后EBITA亏损139亿元人民币，管理层确认此为财年亏损峰值，9月季度亏损将收窄至110-120亿元区间，此后保持平稳或持续改善。亏损中不足一半来自模型训练，其余主要为千问App的推理、营销及运营成本，训练效率提升将支撑模型能力迭代而不必线性推高亏损。变现方面，目前主要通过阿里云MaaS服务实现，长期将探索多元化变现模式。电商板块则聚焦盈利稳定与现金流生成：6月季度阿里巴巴电商集团（AEG）调整后EBITA达397亿元保持平稳，中国电商CMR同比降7%（同口径持平微增1%），即时零售单位经济模型持续改善，管理层预计9月季度亏损环比持平或收窄，全年亏损同比收窄约50%，维持2029财年盈利目标不变。成熟业务的现金流韧性为AI投入提供了坚实支撑。 AI资本开支回报清晰，维持“买入”评级及178美元目标价。6月季度资本开支达677亿元人民币（约合100亿美元），自由现金流流出447亿元，但管理层强调季度支出受硬件采购交付节奏影响波动较大，不宜简单年化。增量AI基础设施投资回收期通常在3年以内，叠加产品利润率提升、平头哥芯片应用、客户预付款及灵活算力安排，资本效率有望进一步优化。野村认为阿里愿意承受短期自由现金流压力以把握AI增长机遇，维持“买入”评级及12个月目标价178美元，较当前股价119.34美元有49.1%的上行空间。目标价基于SOTP估值：中国电商集团按5倍2027财年市盈率估值87亿美元；阿里云按7倍2028财年外部云收入估值278亿美元；非核心资产净值40亿美元；叠加净现金贡献，对应整体估值逻辑清晰。 主要下行风险包括：AI投入导致利润率承压、支付及互联网金融行业监管趋严冲击主业及蚂蚁集团估值。上行催化则来自AI云增长及盈利超预期、自研芯片商业化进展顺利、电商现金流表现强于预期。#文字观点", "publish_time": "2026-08-24 17:04", "tags": ["文字观点"]}, "attachment:files/中银证券-策略周报：主线折返积蓄，增配副线对冲-260823.pdf": {"id": "attachment:files/中银证券-策略周报：主线折返积蓄，增配副线对冲-260823.pdf", "kind": "attachment", "title": "中银证券-策略周报：主线折返积蓄，增配副线对冲-260823", "source_label": "中银证券", "excerpt": "策略研究 |", "content": "策略研究 | 证券研究报告 — 总量周报 2026年8月23日 相关研究报告 《1-7月财政数据点评》 20260823 《美债的“近忧与远虑” 》 20260822 《7月经济数据点评》 20260817 中银国际证券股份有限公司 具备证券投资咨询业务资格 策略研究 证券分析师：王君 (8610)66229061 jun.wang@bocichina.com 证券投资咨询业务证书编号： S1300519060003 证券分析师：徐沛东 (8621)20328702 peidong.xu@bocichina.com 证券投资咨询业务证书编号： S1300518020001 策略周报 主线折返积蓄，增配副线对冲 外部定价锚收紧 ，AI最乐观叙事修正 ，面对短期不确定性建议 多元化副线配 置，优先增速最快的有色 +逻辑覆写的医药  主线再折返 。本周在国内 AI基本面未出现大变化的背景下 A股反弹迎来 折返调整， 8月19日中外科技链条集中大跌。长端美债收益率一度冲高 ， 30年期逼近多年来敏感高位，压缩算力、半导体等长久期资产的估值天 花板。Anthropic 披露 7月底 ARR约650亿美元，明显低于此前更乐观的 专家 /机构预测，投资者忧虑 AI变现斜率二阶导放缓。两件事结合来看， 高利率环境本就要求 AI板块收入更快增长兑现来支撑估值，本次 Anthropic 收入预期落空与利率端分母抬升叠加，使得主线阶段性抛压再 次放大。我们判断，本周下跌本质是外部定价锚收紧与 AI最乐观叙事被 修正，叠加前期反弹浮盈厚、存量博弈结构脆弱后的集中释放，属结构 性冲击与风险偏好回摆，后续仍要看长端美债能否稳住以及海外大模型 商业化数据能否重新给出斜率尚可的证据，在此之前更现实的是波动消 化与风格再平衡，而非产业逻辑一夜间证伪。  美债问题显化或加剧短期交易难度 。本轮美债收益率上行并不是突然出 现的，美债长期利率目前处于周期性和长期性上行因素叠加状态，美伊 冲突的反复更是使得收益率易上难下。美债问题之所以在上周出现了显 化剧烈冲击了科技板块， 更多还是源于分子端 AI收入预期的变化。若下 周美债收益率继续冲高且伴随美元走强以及美股科技板块下跌， A股端 也许顺势降低高估值成长的拥挤暴露，控制组合久期度，增加其他副线 景气配置做对冲。中期仍更应锚定国内盈利修复与产业景气主线，把美 债波动当作节奏与仓位管理工具，而非 A股趋势定价的唯一锚。  短期多元化副线配置 : 1)增速最快的有色 。在已经披露的中报业绩预告汇总中，有色金属在所有 披露率超 10%的行业里 增速中位数 排在第一位。在当前宏观环境背景 下，有色板块靠矿端趋紧、低库存与美铜关税导致的供给错配托住价格 中枢，靠新能源和 AI 电力需求 打开中长期空间。黄金则短期受益于地 缘溢价和中期央行购金，金价 7月到达阶段性底部后短期易上 难下，黄 金股有望 进一步开启抬升通道。 2)逻辑覆写的医药，Moderna 个性化 mRNA黑色素瘤疫苗取得临床突破， 未来一旦黑色素瘤路径跑通，同类方案可外延至其他癌症，医药板块有 望开启技术天花板、商业天花板以及估值方法天花板三层重估，将为全 球及 A股创新药（ mRNA、新抗原疫苗、 AI制药与 CXO配套）抬高了 叙事上限与风险偏好锚点。对于 AI在医药行业的应用而言， Moderna 个 性化疫苗的研发手法意味着 AI不再只是提效工具，更是个 性化疗法能否 规模化量产、压缩临床迭代周期的基础设施。  风险提示： 1）政策落地不及预期，宏观经济波动超预期 ；2）市场波动 风险；3）海外经济超预期衰退、流动性风险。 仅供内部参考，请勿外传 2026年8月23日 策略周报 2 目录 市场热点思考 ................................ ................................ ................................ . 4 一周数据集锦 ................................ ................................ ................................ . 6 风险提示 ................................ ................................ ................................ ......... 9 仅供内部参考，请勿外传 2026年8月23日 策略周报 3 图表目录 图表 1. 8月19日东亚股市集中下跌，科技领跌 ................................ ........................ 4 图表 2. Athropic ARR 一定程度被视为 AI产业天花板 ................................ ............. 4 图表 3. 申万一级行业中报预告盈利增速情况 ................................ ........................... 5 图表 4. 金价阶段性筑底，黄金股弹性更超现货 ................................ ........................ 5 图表 5. Moderna 个性化 mRNA疫苗覆写了传统行业路径 ................................ ....... 5 图表 6.本周全球资产表现 ................................ ................................ ............................ 6 图表 7. 当前金油比 48.47，自本轮低点回升 51.9% ................................ .................. 6 图表 8 本周大盘价值风格表现相对占优 ................................ ................................ .... 7 图表 9. 当前 BOCI情绪指数 ................................ ................................ ...................... 7 图表 10. 本周主力资金结束净流入 .............. 财政支出中占比 13.2%，仍是重要 支撑，但对当期广义财政支出同比增速有所拖累， 1-7月广义中央财政支 出同比下滑 9.6%，降幅较 6月小幅收窄。 1-7月一般公共预算支出在全年 公共预算支出中占比 54.3%，支出力度整体不弱。但 7月当月支出在全年 公共预算支出中占比为 6.5%，仍略低于 2024 -2025年同期水平， 7月财政 支出节奏仍维持定力。 需注意的是， 8月21日，财政部副部长廖岷在国新办发布会上表示，年 内地方政府专项债券和超长期特别国债仍有超过 2万亿元的剩余额度， 有 望维持政策强度。此外，加快资金使用、加力扩大内需将是年内财政发力 提效的重要方向。我们认为，三季度财政存量政策有望加力提效，对当期 经济数据表现形成支撑。 本周，我们维持大类资产配置顺序：股票 >大宗 >债券 >货币。  风险提示 ：海外大宗商品价格震荡；地缘关系的不确定性；政策效果不及 预期。 本期观点（ 2026.8.23） 宏观经济 本期观点 观点变化 一个月内 = 关注三季度财政支出进度 调整 三个月内 = 关注美联储最新政策表述及美、伊冲突的持续性 不变 一年内 = 地缘关系仍有较大不确定性 不变 大类资产 本期观点 观点变化 股票 + 关注“增量”政策落实情况 超配 债券 - 关注货币政策对债市的传导影响 低配 货币 - 收益率将在 2%上下波动 低配 大宗商品 = 关注美、伊冲突对商品市场的供给冲击 标配 外汇 = 中国经济基本面优势支撑汇率宽幅波动 标配 资料来源：中银证券 下载日志已记录，仅供内部参考 2026年8月23日 宏观和大类资产配置周报 2 目录 一周概览 ................................ ................................ ................................ ......... 4 本周沪深 300指数下跌 1.01% ................................ ................................ ................................ ........ 4 要闻回顾和数据解读（新闻来源：万得） ................................ ................................ ..................... 6 宏观上下游高频数据跟踪 ................................ ................................ ............. 8 大类资产表现 ................................ ................................ ............................... 10 A股：本周市场指数表现普遍较弱 ................................ ................................ .............................. 10 债券：十年期国债收益率周五收于 1.68% ................................ ................................ .................... 11 大宗商品：本周商品期货指数上涨 7.02% ................................ ................................ ................... 12 货币类：货币基金收益率波动中枢在 1.5%下方 ................................ ................................ .......... 13 外汇：人民币兑美元中间价本周下行 ................................ ................................ .......................... 13 港股：原材料业涨幅居前 ................................ ................................ ................................ ............. 14 下周大类资产配置建议 ................................ .................. 高速CCL对应高端球硅需求量为1.64万吨，高性能先进封装中EMC对应高端球硅总需求为0.88万吨。供给看，日本（市占率70%，垄断高端球硅）无大规模扩产规划，短期内国内新增高端球硅产能有限。我国龙头联瑞掌握3大工艺，Low-α微米/亚微米球硅已批量导入存储封装链，新锐逐步实现国产替代，建议关注联瑞新材、国瓷材料、凌玮科技等。#文字观点", "publish_time": "2026-08-24 10:21", "tags": ["M9+CCL时代的量价齐升", "先进封装中不可或缺", "文字观点"]}, "post:2026-08-24T12-33:149a32abd74d": {"id": "post:2026-08-24T12-33:149a32abd74d", "kind": "post", "title": "2026-08-24 12:33", "source_label": "帖子正文", "excerpt": "锂电：超预期旺季，涨价弹性空间大 年底超预期旺季来临，出口退税目前6%，27年0%，单wh敏感性巨大。此外电动重卡、乘用车各类补贴也是12月底到期，27年存在较大不确定性。", "content": "锂电：超预期旺季，涨价弹性空间大 年底超预期旺季来临，出口退税目前6%，27年0%，单wh敏感性巨大。此外电动重卡、乘用车各类补贴也是12月底到期，27年存在较大不确定性。叠加国内储能年底装机潮，预计排产持续走旺至12月，电池盈利随着规模效应改善，推荐宁德、亿纬、中航、瑞浦、正力。 直接受益碳酸锂-铁锂、6F：8.23日jxw公布采矿第一次环评信息公示，按此节奏旺季复产不确定性增强，碳酸锂突破MA60阻力后续或继续上涨，看年内估值铁锂已经不到10x，Q3磷酸铁也实现大幅涨价，建议关注裕能、万润、天赐、龙蟠、富临 PCB打开远期空间-铜箔：SMM周五锂电铜箔普涨1000，电子标箔普涨2000。根据产能规划统计27年扩产主要也都是HVLP3代以上项目，锂电箔需要涨价刺激扩产，考虑单吨资本开支5亿，吨净利或升至1w可能才会匹配需求，建议关注诺德、海亮、嘉元、中一、德福 负极石墨化供给紧张，根据百川盈孚数据，目前均价来到了9750元/吨，石墨化投资重，约1.5亿，目前普通石墨化盈利水平下回本周期10年以上，投资动力不足，下半年紧缺情况下有望涨价，推荐尚太、中科、贝特瑞、滨海。 隔膜下半年仍处在供不应求的状态，新增产能基本都在明年投放，隔膜厂商逐步掌握议价权，Q3持续推进涨价，目前大部分客户已实现多轮涨价，推荐恩捷、佛塑、星源、璞泰来。#文字观点", "publish_time": "2026-08-24 12:33", "tags": ["文字观点"]}, "post:2026-08-24T09-33:cca71faeea7c": {"id": "post:2026-08-24T09-33:cca71faeea7c", "kind": "post", "title": "2026-08-24 09:33", "source_label": "帖子正文", "excerpt": "【国金业绩点评260824】 （超预期）🌹【交运李丹】极兔速递26H1业绩超预期，收入73.6亿美元（+40%），经调净利润3.5亿美元（+124%）。东南亚市场表现尤为突出，市占率提升至38.1%（同比+5.3pct），充分受益于TikTok Shop高速增长", "content": "【国金业绩点评260824】 （超预期）🌹【交运李丹】极兔速递26H1业绩超预期，收入73.6亿美元（+40%），经调净利润3.5亿美元（+124%）。东南亚市场表现尤为突出，市占率提升至38.1%（同比+5.3pct），充分受益于TikTok Shop高速增长；中国市场实现量价齐升，单票收入同比+12%，行业反内卷效果显现。单票毛利及经调EBIT均持续上行，规模效应与区域结构优化驱动利润率提升。上调2026-2028年经调净利至7.7/11.2/14.3亿美元，对应归母净利5.7/9.0/12.0亿美元，维持“买入”。 （超预期）🌹【可选-纺服杨欣/赵中平】李宁26H1业绩超预期，营收152.4亿元（+2.8%），归母净利18.2亿元（+4.5%），净利率提升至11.9%，直营店效改善、电商客流提升贡献主要增量。跑鞋表现亮眼（销量突破1480万双），但篮球品类下滑明显。毛利率逆势提升0.9pct至50.9%，体现成本管控能力；销售费用率因奥运及专业运动营销投入上升至30.45%。预计2026-2028年净利润为23.33/28.22/31.98亿元，对应PE为12/10/9倍，维持“买入”。 🌹【计算机刘高畅】摩尔线程26H1业绩符合预期，营收17.36亿元（+147.42%），归母净利-0.12亿元（减亏95.73%），受益于AI算力强劲需求及夸城智算集群商业化加速。规模效应明显，三项费用率大幅下降，但研发投入仍保持高增（+38.16%）。存货较年初大增166%至35.5亿元，反映积极备货与产品快速放量。新一代“花港”架构及华山/庐山芯片研发持续推进。上调2026-2028年收入至37.19/59.44/89.74亿元，归母净利-1.25/5.93/16.66亿元，维持“买入”。 🌹【建材&新材料李阳】中国巨石26H1业绩亮眼，归母净利29.33亿元，同比+74%，Q2环比+31%，主因电子布涨价在报表端充分体现。粗纱及制品销量维持中高个位数增长，供给偏小且冷修加速，期待后续价格弹性；电子布受织布机紧张及下游需求超预期影响，价格涨幅超预期（7628电子布较25Q3涨143%），AI级低介电产品有序推进。上调2026-2028年归母净利润至78.98/120.87/128.4亿元，对应PE为21/14/13倍，维持“买入”。 🌹【金属吴晋恺/王钦扬】厦门钨业26H1业绩符合预期，营收与归母净利润分别同比大增81.70%和127.04%，但Q2钨价高位回落对单季利润形成拖累。三大主业（钨钼、稀土、能源新材料）营收与利润均实现同比高增，深加工产品如PCB钴针用硬质合金棒材加速放量，同时公司正积极推进矿山资源收储与产能扩张。预计2026-2028年归母净利润分别为51.8/65.4/80.9亿元，对应PE为16/13/10倍，维持“买入”评级。#文字观点", "publish_time": "2026-08-24 09:33", "tags": ["文字观点"]}, "attachment:files/玻纤电子布专家近况交流20260823.pdf": {"id": "attachment:files/玻纤电子布专家近况交流20260823.pdf", "kind": "attachment", "title": "玻纤电子布专家近况交流20260823", "source_label": "其他", "excerpt": "景旺电子 2026 年半年度业绩交流会 20260823 要点总结 1.经营业绩与财务表现 2026 年上半年实现营业收入 86.1 亿元，同比增长 21.37%；归母净利润 6.02 亿元，同比下降 7.38%。", "content": "景旺电子 2026 年半年度业绩交流会 20260823 要点总结 1.经营业绩与财务表现 2026 年上半年实现营业收入 86.1 亿元，同比增长 21.37%；归母净利润 6.02 亿元，同比下降 7.38%。 利润下滑主要受人民币升值影响，上半年汇兑损失 1.23 亿元，上年同期为汇兑收益 0.38 亿元，汇 兑因素对净利润影响超过 1.5 亿元。 二季度实现营业收入 47.20 亿元，同比和环比增速均超过 20%；归母净利润 3.69 亿元，同比增长 13.61%，环比增长 58.55%，盈利能力明显修复。 按产品结构拆分，硬板与软板收入比重约为 8:2。 2.业务板块与收入结构 汽车电子业务收入占比约 45%，公司已做到全球汽车 PCB 第一，通过多措并举降低原材料价格波 动影响，盈利能力在 6 月份实现明显修复。 通信与数据中心基础设施业务收入占比接近两成，AI 服务器、高速光模块等高确定性高景气细分赛 道多点突破。 公司为全球 AI 基础设施领先企业批量供应高性能 PCB，应用场景和产品覆盖度持续拓宽；随着客 户当代产品陆续进入量产交付阶段，订单快速增长，预计金湾 AI 算力工厂下半年特别是四季度有望 满产，对未来几个季度经营业绩形成明确增量贡献。 3.AI 算力业务进展与产能布局 公司去年进入北美算力大客户供应链，完成工厂技改并启动当代产品验证打样，目前已取得客户新 平台产品大量料号。 珠海两个工厂的高多层及高阶 HDI 产品产能均已跑满，6-7 月开始备产，7-8 月大批量生产，预计 8-9 月开始滚动交货，四季度产能基本爆满。 全年 AI 算力相关订单预计销售收入将超过 30 亿元，上半年完成约四五个亿，主要以高多层产品为 主，另有部分液冷短板产品。 四季度单月出货量有望达到 8-10 亿元量级，业绩释放高峰预计出现在四季度。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 金湾基地已建成三条 MSPC 产线，8 月第四条线建成并调试中，年内将扩至五条线产能，设备配置 均为行业顶尖水平。 高阶 HDI 工厂（Advanced HDI）建设顺利，预计 10 月份投产；泰国生产基地即将正式投产，将 具备超高多层、高多层及 HDI 产品交付能力。 鉴于现已建及在建产能预计未来数月无法充分满足客户快速增长的交货需求，公司将适时推动新的 扩产计划。 4.金湾新扩产计划（UHC 工厂） 公司公告在珠海金湾推进新的扩产项目，主要围绕超高多层 PCB（UHC），目标打造业界高多层标 杆工厂，平均层数做到 36 层或以上。 去年公告建设的第三个工厂主打 HDI（AI 算力及高阶智驾 HDI 工厂），目前已进入试产阶段，目 标 10 月份全面投产。 新扩产计划一方面源于大客户订单需求，另一方面公司在交换机领域产品能力及客户开拓取得长足 进展，主流 ODM 厂商需求逐步释放。 公司已提前与设备供应商锁定产能和设备交付，包括钻机、压机、电路线、曝光机等关键瓶颈设 备，项目产能将快速释放。 5.高速光模块与 MSPC 业务 公司已批量交付 800G 和 1.6T 光模块 PCB，与多家全球领先客户建立稳固战略合作伙伴关系。 公司自 2023 年起与客户接触并提前布局 MSPC 产线，在珠海 SLP 工厂安装第一条 M 线；去年底 意识到产能可能产生巨大瓶颈后优先决定增加产线。 过去几个月平均约一个半月新增一条线，从今年 3-4 月至今已具备四条线生产能力，第四条线一两 个礼拜内装好，10 月份第五条线基本装好，预计 11 月份具备五条线生产能力。 月产出有效产出（非产能）可达 200 万只以上，在 800G 光模块为主力生产交付状态下，综合良率 超过 85%，为业内最高水平之一，且仍在持续提升。 一季度和二季度初存在物料准备度问题，目前已基本解决，关键物料均无重大问题，三条线已打 满；终端客户正在对包括国产 CCL、铜箔等不同材料进行验证，公司积极配合确保供应链安全。 6.交换机业务进展 国产客户如新浪、锐捷等，56G 产品去年已进入批量阶段，112G 产品去年年底认证通过，目前 56G 和 112G 均在批量交付中。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 近半年积极拓展海外主流 ODM 厂商交换机项目，国内外及台湾主流 ODM 厂商已陆续进入其 AVL （合格供应商名录），部分项目已在进行打样。 有个别客户已提出明年 3 月到二季度前需准备好相应产能的要求。 7.北美云厂商（CSP）客户拓展 公司对北美几家云厂商均有接触，进度各不相同，个别已进入打样和验证阶段，主要以验证下一代 产品的方式进行。 目标在 2028 年至少有两家云厂商成为不仅通过认证、而且有实际业绩交付的供应商。 8.原材料价格与毛利率展望 过去约十个月 PCB 材料涨价是主旋律，对一季度业绩造成较大困扰；5-6 月份公司与客户沟通取得 较大进展，材料顺价效果较好，客户基本接受。 公司坚持从今年年初以来材料涨价部分全部向下游客户传导，目前价格已不再是讨论话题，焦点集 中在供应保障上。 全年传统产品毛利率水平目标不低于去年水平；三季度和四季度传导力度将不低于二季度，同时将 一季度及二季度前期未覆盖的成本叠加到后续季度中。 公司预计材料涨价趋势可能延续至明年乃至明年下半年，未感受到材料降价的迹象。 公司主要材料合作伙伴包括生益科技、台湾南亚塑胶、EMC、陡山（AI 材料）、上海南亚、华中等 主流高质量厂商。 9.技术储备与前沿研发 埋嵌陶瓷技术：公司在车载应用中已广泛应用埋铜、埋陶瓷等技术，积累了丰富经验，并积极拓展 其他器件埋嵌及加工工艺。 PTFE 材料：公司从 5G 天线到毫米波雷达等方面积累多年 PTFE 加工经验，在 AI 应用领域也在持 续跟进，跟进节奏和程度处于行业较前位置。 陶瓷基板：公司具备 DPC 到 AMB 等陶瓷基板技术，覆盖氮化铝、氮化硅、氧化铝等材料，AMB 和 DBC 已在汽车电子领域打开应用，同时持续投入 DPC、低温多层共烧等新技术研发。 公司研发费用绝对值与相对值均持续提升，对前沿材料与工艺保持高度重视。 10.海外布局与竞争策略 泰国工厂已进入试产阶段，定位与 AI 相关，属于技术含量较高的领域，将具备超高多层、高多层及 HDI 产品交付能力。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 公司认为中国大陆是全球 PCB 乃至电子产品技术的最优供应链，凭借强大的工程师资源、产能和供 应链资源，在很长一段时间内不可替代；内地产能和资源预计将领先海外 1-2 代甚至更多。 海外产能何时成为有效产出仍需时间，但公司会积极配合客户要求进行海外布局。 公司认为竞争优势的核心在于：拥有有效的高质量产能、深度理解客户技术痛点并提供解决方案、 以及拥有头部客户群；单纯扩产若为无效产能或良率低，反而会带来麻烦。 11.下半年展望与战略定位 今年下半年是公司从预期驱动转向业绩驱动的关键期，在 AI 算力需求持续释放、智能化加速演进的 结构性机遇中，公司已从传统 PCB 制造商向高端算力硬件核心供应商战略延伸。 下半年及未来两三年 PCB 行业处于涨价周期，公司已实现与客户共同承担上游材料价格压力，实时 进行价格传导，有利于供应链健康发展和毛利改善。 下半年是公司从传统 PCB 向高端高性能 PCB 转化的关键拐点，AI 服务器高性能 PCB 及高速网络通 信光模块 PCB 占比将逐渐提升，产品结构持续优化，业绩将逐季持续提升和改善。 问答整理 Q1：三季度算力业务（珠海金湾）的交付稼动率和订单有无具体指引？金湾新扩产是否有其 他算力客户的具体进展？ 答： 公司去年进入北美算力大客户供应链，完成工厂技改并开始当代产品验证打样，目前已取得客户新 平台产品大量料号。珠海两个工厂的高多层和高阶 HDI 产品产能均已跑满。从客户交付计划看，6-7 月 开始备产，7-8 月大批量生产，预计 8-9 月开始滚动交货，四季度产能基本爆满，部分月份出货计划超 出原计划。从三季度开始出货将比上半年大幅提升，全年 AI 相关销售预计超过 30 亿元。新扩产方面， 去年公告的第三个工厂（主打 HDI，名为 AI 算力及高阶智驾 HDI 工厂）已进入试产阶段，目标 10 月 全面投产；金湾基地原有 SLP 工厂和 HLC 高多层工厂，第三个工厂为 Advanced HDI，主打 AI 计算 HDI 高阶厚板产品。同时公司在交换机领域产品能力和客户开拓取得长足进展，主流 ODM 厂商需求逐 步释放，催生了超高多层（UHC）工厂的扩产需求。公司已提前锁定设备产能和交付，项目将快速释 放产能。UHC 工厂目标平均层数做到 36 层或以上。 Q2：公司在 N 客户 HDI 产品方面，除网卡外，算力板等是否有进一步突破性进展？ 答： 客户的 HDI 产品目前已在公司产线上运行，当前主要受限于产能。公司正重点加快 HDI 产能释 放，高阶 HDI 工厂已在试运行，部分工序试运行中，计划 10 月份全面投产，以满足客户高阶 HDI 需 求。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Q3：四季度是否会在 AI 算力板方面形成大批量交付？ 答： 新工厂有一系列程序和流程要走，公司会尽可能去争取和加快，四季度有望形成较大批量的交付。 Q4：交换机市场目前客户进展如何？ 答： 国产客户如新浪、锐捷等，56G 产品去年已进入批量阶段，112G 产品去年年底认证通过，目前 56G 和 112G 均在批量交付。近半年公司积极拓展海外主流 ODM 厂商的交换机项目，国内外及台湾 主流 ODM 厂商已陆续进入 AVL，部分项目已在打样，有个别客户提出明年 3 月到二季度前需准备好 产能的要求。 Q5：北美 CSP 客户方面，四季度是否会有客户群体的突破？ 答： 云厂商客户相对复杂，除产能和技术要求外还有其他层面的要求。公司对北美几家云厂商均有接 触，进度各不相同，个别已进入打样和验证阶段，主要以下一代产品方式验证。目标是在 2028 年至少 有两家云厂商成为不仅通过认证、而且有实际业绩交付的供应商。 Q6：AI 算力领域材料变化（PTFE、陶瓷材料、马酒 Q 布等）的应用前景和进展如何？ 答： 这些材料都具备应用可能性，公司作为前沿深度参与厂商都在积极跟进和配合。但具体在什么时 间、什么平台、什么情况下使用，目前没有明确结论，涉及客户具体产品方案不便多做讨论。公司在材 料发展趋势上追求高速、低损等前沿方向，但具体落地时间节点和平台仍有大量工作要做。 Q7：光模块 MSPC 目前的量、良率情况如何？MSPC 工艺在 AI 其他领域能否普遍应用？ 答： 公司从 2023 年开始与客户接触，提前在珠海 SLP 工厂安装第一条 M 线，当时金湾基地整体亏 损、压力很大的情况下仍坚持技术升级。经过多年布局和沉淀，积累了大量经验。去年底意识到光模块 MSPC 产能可能产生巨大瓶颈时，优先决定增加产线。过去几个月平均一个半月新增一条线，从今年 3-4 月至今已具备四条线生产能力，第四条线一两个礼拜内装好，10 月份第五条线基本装好，预计 11 月份具备五条线生产能力。月产出有效产出可达 200 万只以上，在 800G 光模块为主力生产交付状态 下，良率超过 85%，爬坡速度非常快。物料方面，一季度和二季度初存在准备度问题，目前已基本解 决，关键物料无重大问题，三条线已打满。终端客户正在对包括国产材料在内的不同材料进行验证，从 CCL 到铜箔都在配合推进。 Q8：如何看待后续 MSPC 竞争格局？ 答： 从长远发展方向看，MSPC 工艺技术在光模块从 800G 到 1.6T 再到未来 2.4T、3.2T、NPO 等演 进路径中是跑不掉的，将充当非常重要的角色。目前整体仍供不应求，短期内难以解决，且设备交付周 期很长，现在才想切入该领域压力很大。该产品门槛不低，公司在 24-25 年 MSPC 未出现巨大瓶颈时 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 就开始产品验证，交了很多学费。未来 MSPC 竞争格局将相对集中，拥有头部客户至关重要，头部客 户引领市场和技术发展方向，只要在头部客户核心供应商群体内，即使行情波动也基本能保持稳定。 Q9：NPO 明年放量节奏如何？MSPC 是否可理解为通往 CPO 甲板化的过渡环节，公司在 CPO 领域是否有卡位优势？ 答： NPO 方面公司团队正在积极与客户沟通新产品情况，但具体产品形态、设计及量产节奏尚在了解 过程中，不方便透露。公司当前最核心的任务是解决 800G 和 1.6T 产品的交付问题。CPO 涉及从芯片 到载板到 PCB、涵盖先进封装多个领域的变化，还有很多问题需要解决，具体以什么设计和技术落地尚 不确定。MSPC 技术储备确实重要，未来以什么形态呈现不好说，但 MSPC 是值得关注的方向，公司 正在过程中不断尝试。 Q10：AI 相关（MSPC、高多层、HDI）产品毛利率相比常规产品能增加多少？ 答： AI 和光模块产品的毛利率很大程度上取决于良率。得益于公司过去多年在金湾的沉淀和客户的信 任支持，公司这两个产品的良率进展速度很快，对标业界优秀水平没有落后，某些方面表现较好。从良 率和毛利情况看，公司已进入第一梯队。从量产产品交付情况看，客户对品质和交付给予高度认可，上 线良率在客户眼中处于第一梯队。 Q11：常规覆铜板原材料近期是否有降价？后续常规覆铜板价格趋势如何？ 答： 过去约十个月 PCB 材料涨价是相当大的主旋律，对一季度造成较大困扰。5-6 月份公司与客户沟 通取得较大进展，材料顺价效果较好，客户基本接受。公司目标是将材料成本上涨基本转移到下游。目 前面临的最大挑战不是价格而是供应保障。公司未感受到材料降价的迹象，可能有些材料降价说法并非 公司常用材料或属于其他领域。公司主要合作伙伴包括生益科技、台湾南亚塑胶、EMC、陡山、上海 南亚、华中等主流高质量厂商。公司预计材料涨价趋势可能延续至明年乃至明年下半年，下半年仍存在 价格上升的可能性。 Q12：目前珠海产能中可用于 AI 的比例有多少？下半年是否全部切给 AI？ 答： 公司每周与客户梳理产能和可接订单信息，不存在接了订单交不出来的情况。公司能做多少必定使 命必达，并通过良率提升和流程优化进一步增加产出。可用于 AI 生产的产线和相关产能均已核算给客 户，并给出可接单数量。去年获得客户验证后，公司投入超过 15.5 亿元人民币对产线进行优化和改 造，已调整完毕，接下来核心工作是新产能释放以承接订单。 Q13：MSPC 扩产设备是否已锁定关键长交期设备供应？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 答： 大部分设备已在去年下单，今年年初追加了一部分。10 月份能开出的产能均为去年已下单设备， UHC 工厂设备也基本安排完毕。个别工序存在追单情况，但主要瓶颈设备均已下单。公司已提前与设 备商锁定关键瓶颈设备产能，包括钻机、压机、电路线、曝光机等。 Q14：下半年传统 PCB 盈利能力提升节奏如何？何时能恢复到涨价前水平？ 答： 一季度承受较大压力，二季度毛利率明显恢复，很大程度上来源于向下游客户传导的效果。三季度 和四季度坚持以下原则：今年年初以来材料涨价部分全部向下游客户传导。目前客户已不再讨论价格问 题，焦点集中在供应上。全年传统产品毛利率水平目标不低于去年水平。根据对下半年材料行情的判 断，材料价格仍将保持高位，三季度和四季度传导力度将不低于二季度。同时会将一季度及二季度前期 的成本缺口叠加到后续季度中，确保全年毛利水平不低于去年。过程中会分客户、分产品、分领域有重 点地提出涨价诉求。 Q15：从刘总在美国与终端客户接触的经历看，如何展望 2028 年及更长期的项目投资需求？ 国内同行扩产凶猛，公司相对竞争优势在哪里？如何看待内卷？ 答： AI 对硬件需求只会越来越高、越来越难，PCB 能贡献的价值点和可做的事情非常多，客户需求非 常确定，较长一段时间都会供不应求。竞争优势方面，第一，是否有产能且是有效的高质量产能非常重 要；第二，如何深度与客户沟通、了解技术发展方向和痛点难点，从研发、技术、产品上帮客户解决问 题极其关键；第三，拥有头部客户群是必要门槛。竞争肯定要关注，但核心应盯着客户导入、技术能 力、产品对客户下一代产品的支持。公司多年积累的技术经验、材料技术和产品能力是打动客户的重要 优势。 Q16：中美地缘博弈下，海外客户提出供应链备份需求，公司如何平衡海外与大陆扩产节奏？ 答： 泰国工厂已进入试产阶段，定位与 AI 相关，属于技术含量较高的领域。中国大陆一定是全球 PCB 乃至很多电子产品技术的最优供应链，凭借强大的工程师资源、产能和供应链资源，在很长一段时间内 不可替代。内地产能和资源预计将领先海外 1-2 代甚至更多，海外何时成为有效产出还需要时间。公司 会积极配合客户要求进行海外布局，同时对内地供应链和产能的持续发展和领先有信心。 Q17：公司在埋嵌陶瓷 HDI、高多层 PTFE 材料、低轨卫星 PCB 等前沿技术和工艺方面有哪 些储备？ 答： 埋嵌类技术公司多年前就有储备，车载应用中已广泛应用埋铜、埋陶瓷等技术，积累了丰富经验， 并积极拓展其他器件埋嵌和加工工艺。PTFE 方面，公司从 5G 天线到毫米波雷达积累了多年加工经 验，在 AI 应用领域也在持续跟进，跟进节奏和程度处于行业较前位置。陶瓷方面，公司具备 DPC 到 AMB 等陶瓷基板技术，覆盖氮化铝、氮化硅、氧化铝等材料，AMB 和 DBC 已在汽车电子领域打开应 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 用，同时持续投入 DPC、低温多层共烧等新技术研发。公司研发费用绝对值与相对值均持续提升，对 前沿材料与工艺高度重视。 Q18：AI 算力基础设施全年订单指引 30 亿元，上半年完成度多少？HDI 和 HLC 占比如何？ 三季度和四季度交付节奏怎样？ 答： 上半年完成约四五个亿，主要以高多层为主，还有部分液冷短板产品。随着下半年客户当代产品批 量交付，出货将逐月提升，四季度单月出货量有望达到 8-10 亿元量级，业绩释放高峰预计出现在四季 度。 Q19：大客户订单滚动下单周期和可见性如何？是否有明年的订单规划？ 答： 细节不方便透露。客户新平台的生命周期和总量决定最终总量。公司在这些平台的主要板子上均通 过相关认证，会维护好现有产品表现和量，产能释放后积极拓展新项目平台。客户目前滚动下单，今年 内订单已基本明确，明年一季度左右陆续确定。具体数字和份额不适合分享。 Q20：一条 MSPC 产线从投放到达产 85%良率需要多长时间？ 答： 非常快，基本上个把月就能搞定。一开始单条线良率并不理想，但随着 5-6 月份二线、三线到四线 安装，三条线综合良率达到 85%。快速投产、快速上良率是公司长期竞争力的最大保证。 Q21：85%的良率是否是业内最高水平？还有提升空间吗？ 答： 85%是目前听到的业内最高水平。公司目标不止于此，还会继续努力提升。 Q22：光模块 MSPC 未来 1-2 个季度价格和毛利率趋势如何？ 答： 需要与客户整体状态沟通，过去确实有调整动作，客户也非常支持。毛利率提升一方面靠提升良 率，另一方面靠客户给予的激励。客户会给出一些指引，团队干劲很足，提前一个月交付客户给予的激 励会更大。 原文 景旺电子 20260823_原文 2026 年 08 月 24 日 发言人 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 大家好，欢迎参加景旺电子 2026 年半年度业绩交流会。在会议室前我们代为声明，未经本平台及主办 方书面授权许可，任何机构或个人不得以任何形式转发、翻版、复制、引用或发布本次会议全部或部分 内容，不得制作会议纪要对外发送。擅自制作会议纪要引起不当传播的，后果自负。 发言人 为保证会议流畅进行，目前所有线上投资者均处于静音状态，在主讲嘉宾发言结束后将留有提问时间。 下面介绍出席本次会议的领导，总裁刘总，财务总监孙总，董事会秘书黄总。接下来有请公司领导发 言。 发言人 好，各位尊敬的投资者还有分析师朋友们，大家下午好。我是景光电子的董秘黄田。我们今天很荣幸邀 请到公司总裁刘总，还有财务总监孙总，共同向大家汇报公司 2026 年度上半年的经营情况和未来的发 展计划。2020 年上半年，公司扎实推进各项经营部署，实现营业收入 86.1 亿元，同比增长 21.37%。 归母净利润 6.0 2 亿元，同比下降 7.38%。 发言人 其中受人民币升值的影响，汇兑损失 1 点二三亿元，上年同期实现汇兑收益 0.3 8 亿元。这一进一步就 是会对收益，对公司的净利润就影响了超过 1.5 亿元。单单的二季度我们公司实现营业收入 47.20 亿 元，同比环比增速均超过 20%。 发言人 规模净利润 3.6 9 亿元，同比增长 13.61%，环比增长 58.55%。我们对上半年的主营业务的情况进行 拆分。按产品结构的话，那个硬板跟原版的收入比重是 8 比 2。然后按下一个个领域来划分的话，报告 期内汽车电子的业务收入占比约 45%。 发言人 我们在汽车店多措并举的像降低原材料价格波动带来的影响，盈利能力已经在六月份实现了明显的修 复。另外一个是通信与数据中心基础设施业务的收入占比接近两成，在 AI 服务器高速多模块等高确定 性的高景气度的细分赛道多点实现了突破。然后 AI 服务器和数据中心领域，我们公司为全球的 AI 基础 设施领先企业的客户批量供应高性能的 PCD，应用场景和产品的覆盖度 通信与数据中心基础设施业务收入占比接近两成，AI 服务器、高速光模块等高确定性高景气细分赛 道多点突破。 公司为全球 AI 基础设施领先企业批量供应高性能 PCB，应用场景和产品覆盖度持续拓宽；随着客 户当代产品陆续进入量产交付阶段，订单快速增长，预计金湾 AI 算力工厂下半年特别是四季度有望 满产，对未来几个季度经营业绩形成明确增量贡献。 3.AI 算力业务进展与产能布局 公司去年进入北美算力大客户供应链，完成工厂技改并启动当代产品验证打样，目前已取得客户新 平台产品大量料号。 珠海两个工厂的高多层及高阶 HDI 产品产能均已跑满，6-7 月开始备产，7-8 月大批量生产，预计 8-9 月开始滚动交货，四季度产能基本爆满。 全年 AI 算力相关订单预计销售收入将超过 30 亿元，上半年完成约四五个亿，主要以高多层产品为 主，另有部分液冷短板产品。 四季度单月出货量有望达到 8-10 亿元量级，业绩释放高峰预计出现在四季度。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 金湾基地已建成三条 MSPC 产线，8 月第四条线建成并调试中，年内将扩至五条线产能，设备配置 均为行业顶尖水平。 高阶 HDI 工厂（Advanced HDI）建设顺利，预计 10 月份投产；泰国生产基地即将正式投产，将 具备超高多层、高多层及 HDI 产品交付能力。 鉴于现已建及在建产能预计未来数月无法充分满足客户快速增长的交货需求，公司将适时推动新的 扩产计划。 4.金湾新扩产计划（UHC 工厂） 公司公告在珠海金湾推进新的扩产项目，主要围绕超高多层 PCB（UHC），目标打造业界高多层标 杆工厂，平均层数做到 36 层或以上。 去年公告建设的第三个工厂主打 HDI（AI 算力及高阶智驾 HDI 工厂），目前已进入试产阶段，目 标 10 月份全面投产。 新扩产计划一方面源于大客户订单需求，另一方面公司在交换机领域产品能力及客户开拓取得长足 进展，主流 ODM 厂商需求逐步释放。 公司已提前与设备供应商锁定产能和设备交付，包括钻机、压机、电路线、曝光机等关键瓶颈设 备，项目产能将快速释放。 5.高速光模块与 MSPC 业务 公司已批量交付 800G 和 1.6T 光模块 PCB，与多家全球领先客户建立稳固战略合作伙伴关系。 公司自 2023 年起与客户接触并提前布局 MSPC 产线，在珠海 SLP 工厂安装第一条 M 线；去年底 意识到产能可能产生巨大瓶颈后优先决定增加产线。 过去几个月平均约一个半月新增一条线，从今年 3-4 月至今已具备四条线生产能力，第四条线一两 个礼拜内装好，10 月份第五条线基本装好，预计 11 月份具备五条线生产能力。 月产出有效产出（非产能）可达 200 万只以上，在 800G 光模块为主力生产交付状态下，综合良率 超过 85%，为业内最高水平之一，且仍在持续提升。 一季度和二季度初存在物料准备度问题，目前已基本解决，关键物料均无重大问题，三条线已打 满；终端客户正在对包括国产 CCL、铜箔等不同材料进行验证，公司积极配合确保供应链安全。 6.交换机业务进展 国产客户如新浪、锐捷等，56G 产品去年已进入批量阶段，112G 产品去年年底认证通过，目前 56G 和 112G 均在批量交付中。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 近半年积极拓展海外主流 ODM 厂商交换机项目，国内外及台湾主流 ODM 厂商已陆续进入其 AVL （合格供应商名录），部分项目已在进行打样。 有个别客户已提出明年 3 月到二季度前需准备好相应产能的要求。 7.北美云厂商（CSP）客户拓展 公司对北美几家云厂商均有接触，进度各不相同，个别已进入打样和验证阶段，主要以验证下一代 产品的方式进行。 目标在 2028 年至少有两家云厂商成为不仅通过认证、而且有实际业绩交付的供应商。 8.原材料价格与毛利率展望 过去约十个月 PCB 材料涨价是主旋律，对一季度业绩造成较大困扰；5-6 月份公司与客户沟通取得 较大进展，材料顺价效果较好，客户基本接受。 公司坚持从今年年初以来材料涨价部分全部向下游客户传导，目前价格已不再是讨论话题，焦点集 中在供应保障上。 全年传统产品毛利率水平目标不低于去年水平；三季度和四季度传导力度将不低于二季度，同时将 一季度及二季度前期未覆盖的成本叠加到后续季度中。 公司预计材料涨价趋势可能延续至明年乃至明年下半年，未感受到材料降价的迹象。 公司主要材料合作伙伴包括生益科技、台湾南亚塑胶、EMC、陡山（AI 材料）、上海南亚、华中等 主流高质量厂商。 9.技术储备与前沿研发 埋嵌陶瓷技术：公司在车载应用中已广泛应用埋铜、埋陶瓷等技术，积累了丰富经验，并积极拓展 其他器件埋嵌及加工工艺。 PTFE 材料：公司从 5G 天线到毫米波雷达等方面积累多年 PTFE 加工经验，在 AI 应用领域也在持 续跟进，跟进节奏和程度处于行业较前位置。 陶瓷基板：公司具备 DPC 到 AMB 等陶瓷基板技术，覆盖氮化铝、氮化硅、氧化铝等材料，AMB 和 DBC 已在汽车电子领域打开应用，同时持续投入 DPC、低温多层共烧等新技术研发。 公司研发费用绝对值与相对值均持续提升，对前沿材料与工艺保持高度重视。 10.海外布局与竞争策略 泰国工厂已进入试产阶段，定位与 AI 相关，属于技术含量较高的领域，将具备超高多层、高多层及 HDI 产品交付能力。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 公司认为中国大陆是全球 PCB 乃至电子产品技术的最优供应链，凭借强大的工程师资源、产能和供 应链资源，在很长一段时间内不可替代；内地产能和资源预计将领先海外 1-2 代甚至更多。 海外产能何时成为有效产出仍需时间，但公司会积极配合客户要求进行海外布局。 公司认为竞争优势的核心在于：拥有有效的高质量产能、深度理解客户技术痛点并提供解决方案、 以及拥有头部客户群；单纯扩产若为无效产能或良率低，反而会带来麻烦。 11.下半年展望与战略定位 今年下半年是公司从预期驱动转向业绩驱动的关键期，在 AI 算力需求持续释放、智能化加速演进的 结构性机遇中，公司已从传统 PCB 制造商向高端算力硬件核心供应商战略延伸。 下半年及未来两三年 PCB 行业处于涨价周期，公司已实现与客户共同承担上游材料价格压力，实时 进行价格传导，有利于供应链健康发展和毛利改善。 下半年是公司从传统 PCB 向高端高性能 PCB 转化的关键拐点，AI 服务器高性能 PCB 及高速网络通 信光模块 PCB 占比将逐渐提升，产品结构持续优化，业绩将逐季持续提升和改善。 问答整理 Q1：三季度算力业务（珠海金湾）的交付稼动率和订单有无具体指引？金湾新扩产是否有其 他算力客户的具体进展？ 答： 公司去年进入北美算力大客户供应链，完成工厂技改并开始当代产品验证打样，目前已取得客户新 平台产品大量料号。珠海两个工厂的高多层和高阶 HDI 产品产能均已跑满。从客户交付计划看，6-7 月 开始备产，7-8 月大批量生产，预计 8-9 月开始滚动交货，四季度产能基本爆满，部分月份出货计划超 出原计划。从三季度开始出货将比上半年大幅提升，全年 AI 相关销售预计超过 30 亿元。新扩产方面， 去年公告的第三个工厂（主打 HDI，名为 AI 算力及高阶智驾 HDI 工厂）已进入试产阶段，目标 10 月 全面投产；金湾基地原有 SLP 工厂和 HLC 高多层工厂，第三个工厂为 Advanced HDI，主打 AI 计算 HDI 高阶厚板产品。同时公司在交换机领域产品能力和客户开拓取得长足进展，主流 ODM 厂商需求逐 步释放，催生了超高多层（UHC）工厂的扩产需求。公司已提前锁定设备产能和交付，项目将快速释 放产能。UHC 工厂目标平均层数做到 36 层或以上。 Q2：公司在 N 客户 HDI 产品方面，除网卡外，算力板等是否有进一步突破性进展？ 答： 客户的 HDI 产品目前已在公司产线上运行，当前主要受限于产能。公司正重点加快 HDI 产能释 放，高阶 HDI 工厂已在试运行，部分工序试运行中，计划 10 月份全面投产，以满足客户高阶 HDI 需 求。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Q3：四季度是否会在 AI 算力板方面形成大批量交付？ 答： 新工厂有一系列程序和流程要走，公司会尽可能去争取和加快，四季度有望形成较大批量的交付。 Q4：交换机市场目前客户进展如何？ 答： 国产客户如新浪、锐捷等，56G 产品去年已进入批量阶段，112G 产品去年年底认证通过，目前 56G 和 112G 均在批量交付。近半年公司积极拓展海外主流 ODM 厂商的交换机项目，国内外及台湾 主流 ODM 厂商已陆续进入 AVL，部分项目已在打样，有个别客户提出明年 3 月到二季度前需准备好 产能的要求。 Q5：北美 CSP 客户方面，四季度是否会有客户群体的突破？ 答： 云厂商客户相对复杂，除产能和技术要求外还有其他层面的要求。公司对北美几家云厂商均有接 触，进度各不相同，个别已进入打样和验证阶段，主要以下一代产品方式验证。目标是在 2028 年至少 有两家云厂商成为不仅通过认证、而且有实际业绩交付的供应商。 Q6：AI 算力领域材料变化（PTFE、陶瓷材料、马酒 Q 布等）的应用前景和进展如何？ 答： 这些材料都具备应用可能性，公司作为前沿深度参与厂商都在积极跟进和配合。但具体在什么时 间、什么平台、什么情况下使用，目前没有明确结论，涉及客户具体产品方案不便多做讨论。公司在材 料发展趋势上追求高速、低损等前沿方向，但具体落地时间节点和平台仍有大量工作要做。 Q7：光模块 MSPC 目前的量、良率情况如何？MSPC 工艺在 AI 其他领域能否普遍应用？ 答： 公司从 2023 年开始与客户接触，提前在珠海 SLP 工厂安装第一条 M 线，当时金湾基地整体亏 损、压力很大的情况下仍坚持技术升级。经过多年布局和沉淀，积累了大量经验。去年底意识到光模块 MSPC 产能可能产生巨大瓶颈时，优先决定增加产线。过去几个月平均一个半月新增一条线，从今年 3-4 月至今已具备四条线生产能力，第四条线一两个礼拜内装好，10 月份第五条线基本装好，预计 11 月份具备五条线生产能力。月产出有效产出可达 200 万只以上，在 800G 光模块为主力生产交付状态 下，良率超过 85%，爬坡速度非常快。物料方面，一季度和二季度初存在准备度问题，目前已基本解 决，关键物料无重大问题，三条线已打满。终端客户正在对包括国产材料在内的不同材料进行验证，从 CCL 到铜箔都在配合推进。 Q8：如何看待后续 MSPC 竞争格局？ 答： 从长远发展方向看，MSPC 工艺技术在光模块从 800G 到 1.6T 再到未来 2.4T、3.2T、NPO 等演 进路径中是跑不掉的，将充当非常重要的角色。目前整体仍供不应求，短期内难以解决，且设备交付周 期很长，现在才想切入该领域压力很大。该产品门槛不低，公司在 24-25 年 MSPC 未出现巨大瓶颈时 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 就开始产品验证，交了很多学费。未来 MSPC 竞争格局将相对集中，拥有头部客户至关重要，头部客 户引领市场和技术发展方向，只要在头部客户核心供应商群体内，即使行情波动也基本能保持稳定。 Q9：NPO 明年放量节奏如何？MSPC 是否可理解为通往 CPO 甲板化的过渡环节，公司在 CPO 领域是否有卡位优势？ 答： NPO 方面公司团队正在积极与客户沟通新产品情况，但具体产品形态、设计及量产节奏尚在了解 过程中，不方便透露。公司当前最核心的任务是解决 800G 和 1.6T 产品的交付问题。CPO 涉及从芯片 到载板到 PCB、涵盖先进封装多个领域的变化，还有很多问题需要解决，具体以什么设计和技术落地尚 不确定。MSPC 技术储备确实重要，未来以什么形态呈现不好说，但 MSPC 是值得关注的方向，公司 正在过程中不断尝试。 Q10：AI 相关（MSPC、高多层、HDI）产品毛利率相比常规产品能增加多少？ 答： AI 和光模块产品的毛利率很大程度上取决于良率。得益于公司过去多年在金湾的沉淀和客户的信 任支持，公司这两个产品的良率进展速度很快，对标业界优秀水平没有落后，某些方面表现较好。从良 率和毛利情况看，公司已进入第一梯队。从量产产品交付情况看，客户对品质和交付给予高度认可，上 线良率在客户眼中处于第一梯队。 Q11：常规覆铜板原材料近期是否有降价？后续常规覆铜板价格趋势如何？ 答： 过去约十个月 PCB 材料涨价是相当大的主旋律，对一季度造成较大困扰。5-6 月份公司与客户沟 通取得较大进展，材料顺价效果较好，客户基本接受。公司目标是将材料成本上涨基本转移到下游。目 前面临的最大挑战不是价格而是供应保障。公司未感受到材料降价的迹象，可能有些材料降价说法并非 公司常用材料或属于其他领域。公司主要合作伙伴包括生益科技、台湾南亚塑胶、EMC、陡山、上海 南亚、华中等主流高质量厂商。公司预计材料涨价趋势可能延续至明年乃至明年下半年，下半年仍存在 价格上升的可能性。 Q12：目前珠海产能中可用于 AI 的比例有多少？下半年是否全部切给 AI？ 答： 公司每周与客户梳理产能和可接订单信息，不存在接了订单交不出来的情况。公司能做多少必定使 命必达，并通过良率提升和流程优化进一步增加产出。可用于 AI 生产的产线和相关产能均已核算给客 户，并给出可接单数量。去年获得客户验证后，公司投入超过 15.5 亿元人民币对产线进行优化和改 造，已调整完毕，接下来核心工作是新产能释放以承接订单。 Q13：MSPC 扩产设备是否已锁定关键长交期设备供应？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 答： 大部分设备已在去年下单，今年年初追加了一部分。10 月份能开出的产能均为去年已下单设备， UHC 工厂设备也基本安排完毕。个别工序存在追单情况，但主要瓶颈设备均已下单。公司已提前与设 备商锁定关键瓶颈设备产能，包括钻机、压机、电路线、曝光机等。 Q14：下半年传统 PCB 盈利能力提升节奏如何？何时能恢复到涨价前水平？ 答： 一季度承受较大压力，二季度毛利率明显恢复，很大程度上来源于向下游客户传导的效果。三季度 和四季度坚持以下原则：今年年初以来材料涨价部分全部向下游客户传导。目前客户已不再讨论价格问 题，焦点集中在供应上。全年传统产品毛利率水平目标不低于去年水平。根据对下半年材料行情的判 断，材料价格仍将保持高位，三季度和四季度传导力度将不低于二季度。同时会将一季度及二季度前期 的成本缺口叠加到后续季度中，确保全年毛利水平不低于去年。过程中会分客户、分产品、分领域有重 点地提出涨价诉求。 Q15：从刘总在美国与终端客户接触的经历看，如何展望 2028 年及更长期的项目投资需求？ 国内同行扩产凶猛，公司相对竞争优势在哪里？如何看待内卷？ 答： AI 对硬件需求只会越来越高、越来越难，PCB 能贡献的价值点和可做的事情非常多，客户需求非 常确定，较长一段时间都会供不应求。竞争优势方面，第一，是否有产能且是有效的高质量产能非常重 要；第二，如何深度与客户沟通、了解技术发展方向和痛点难点，从研发、技术、产品上帮客户解决问 题极其关键；第三，拥有头部客户群是必要门槛。竞争肯定要关注，但核心应盯着客户导入、技术能 力、产品对客户下一代产品的支持。公司多年积累的技术经验、材料技术和产品能力是打动客户的重要 优势。 Q16：中美地缘博弈下，海外客户提出供应链备份需求，公司如何平衡海外与大陆扩产节奏？ 答： 泰国工厂已进入试产阶段，定位与 AI 相关，属于技术含量较高的领域。中国大陆一定是全球 PCB 乃至很多电子产品技术的最优供应链，凭借强大的工程师资源、产能和供应链资源，在很长一段时间内 不可替代。内地产能和资源预计将领先海外 1-2 代甚至更多，海外何时成为有效产出还需要时间。公司 会积极配合客户要求进行海外布局，同时对内地供应链和产能的持续发展和领先有信心。 Q17：公司在埋嵌陶瓷 HDI、高多层 PTFE 材料、低轨卫星 PCB 等前沿技术和工艺方面有哪 些储备？ 答： 埋嵌类技术公司多年前就有储备，车载应用中已广泛应用埋铜、埋陶瓷等技术，积累了丰富经验， 并积极拓展其他器件埋嵌和加工工艺。PTFE 方面，公司从 5G 天线到毫米波雷达积累了多年加工经 验，在 AI 应用领域也在持续跟进，跟进节奏和程度处于行业较前位置。陶瓷方面，公司具备 DPC 到 AMB 等陶瓷基板技术，覆盖氮化铝、氮化硅、氧化铝等材料，AMB 和 DBC 已在汽车电子领域打开应 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 用，同时持续投入 DPC、低温多层共烧等新技术研发。公司研发费用绝对值与相对值均持续提升，对 前沿材料与工艺高度重视。 Q18：AI 算力基础设施全年订单指引 30 亿元，上半年完成度多少？HDI 和 HLC 占比如何？ 三季度和四季度交付节奏怎样？ 答： 上半年完成约四五个亿，主要以高多层为主，还有部分液冷短板产品。随着下半年客户当代产品批 量交付，出货将逐月提升，四季度单月出货量有望达到 8-10 亿元量级，业绩释放高峰预计出现在四季 度。 Q19：大客户订单滚动下单周期和可见性如何？是否有明年的订单规划？ 答： 细节不方便透露。客户新平台的生命周期和总量决定最终总量。公司在这些平台的主要板子上均通 过相关认证，会维护好现有产品表现和量，产能释放后积极拓展新项目平台。客户目前滚动下单，今年 内订单已基本明确，明年一季度左右陆续确定。具体数字和份额不适合分享。 Q20：一条 MSPC 产线从投放到达产 85%良率需要多长时间？ 答： 非常快，基本上个把月就能搞定。一开始单条线良率并不理想，但随着 5-6 月份二线、三线到四线 安装，三条线综合良率达到 85%。快速投产、快速上良率是公司长期竞争力的最大保证。 Q21：85%的良率是否是业内最高水平？还有提升空间吗？ 答： 85%是目前听到的业内最高水平。公司目标不止于此，还会继续努力提升。 Q22：光模块 MSPC 未来 1-2 个季度价格和毛利率趋势如何？ 答： 需要与客户整体状态沟通，过去确实有调整动作，客户也非常支持。毛利率提升一方面靠提升良 率，另一方面靠客户给予的激励。客户会给出一些指引，团队干劲很足，提前一个月交付客户给予的激 励会更大。 原文 景旺电子 20260823_原文 2026 年 08 月 24 日 发言人 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 大家好，欢迎参加景旺电子 2026 年半年度业绩交流会。在会议室前我们代为声明，未经本平台及主办 方书面授权许可，任何机构或个人不得以任何形式转发、翻版、复制、引用或发布本次会议全部或部分 内容，不得制作会议纪要对外发送。擅自制作会议纪要引起不当传播的，后果自负。 发言人 为保证会议流畅进行，目前所有线上投资者均处于静音状态，在主讲嘉宾发言结束后将留有提问时间。 下面介绍出席本次会议的领导，总裁刘总，财务总监孙总，董事会秘书黄总。接下来有请公司领导发 言。 发言人 好，各位尊敬的投资者还有 增97%，印证需求旺盛；尽管对华设备出口同比下滑20%（反映中国本土化趋势），但整体WFE（晶圆厂设备）市场仍维持高景气，高盛预计2026-2028年存储WFE资本开支将分别同比增长47%/47%/38%。 基板/CCL：供给持续紧俏，AI驱动下盈利弹性释放。韩国6家主要基板/CCL厂商二季度营收同比增44%、营业利润同比大增124%，订单 backlog 均实现三位数同比增长，产能利用率持续提升，部分厂商已启动扩产计划。受T-glass等原材料紧缺及需求旺盛推动，3-6月多家厂商已提价，部分计划进一步调涨价格。下游AI加速器、800G交换机、汽车电子、GDDR7/SSD控制器及光模块需求强劲，其中SOCAMM（低功耗压缩附加内存模块）需求远超预期，Simmtech已将2026年相关营收指引上调超50%，高盛预计2026年全球SOCAMM需求将同比暴增420%，占全球DRAM需求的7%。行业供需缺口将持续扩大，ABF基板将从2026年供不应求8%扩大至2027/2028年的34%/51%，支撑价格与盈利上行。高盛预计SEMCO基板业务2026年营收将同比大增51%，营业利润率提升10个百分点至16%。 芯片测试：服务器CPU及存储测试需求旺盛，利好存储板块。韩国芯片测试供应链企业二季度业绩稳健，服务器CPU插座及存储测试插座/设备需求强劲，且未来展望乐观，对高盛覆盖的三星、SK海力士等存储厂商构成正向催化。 HBM：产业链高景气延续，市场空间持续扩容。HBM供应链企业二季度业绩稳健、指引乐观，叠加近期行业数据印证，高盛预计2026/2027年全球HBM市场规模将分别同比增长67%/108%，成为存储板块核心增长引擎。 整体来看，本次供应链调研全面印证了AI驱动下韩国半导体产业链的高景气，尤其是存储及配套设备、材料环节的供需紧平衡与盈利上行趋势，进一步强化了高盛对三星电子、SK海力士及SEMCO的乐观判断。#文字观点", "publish_time": "2026-08-24 17:04", "tags": ["文字观点"]}, "post:2026-08-24T17-04:cf76b723c37a": {"id": "post:2026-08-24T17-04:cf76b723c37a", "kind": "post", "title": "2026-08-24 17:04", "source_label": "帖子正文", "excerpt": "【申万宏源电子】小米集团：玄戒完成能效、带宽、算力能力迭代，人车家全生态AI算力底座成型核心观点：本次三芯集结是小米造芯战略\"从点到面\"的能力展示，小米自研芯片从单一手机SoC扩展为“高能效、高带宽、高算力”三条产品线，技术+工艺亮点密集、场景指向清晰。O3的量产落地（9月小米18 Fold）是关键", "content": "【申万宏源电子】小米集团：玄戒完成能效、带宽、算力能力迭代，人车家全生态AI算力底座成型核心观点：本次三芯集结是小米造芯战略\"从点到面\"的能力展示，小米自研芯片从单一手机SoC扩展为“高能效、高带宽、高算力”三条产品线，技术+工艺亮点密集、场景指向清晰。O3的量产落地（9月小米18 Fold）是关键验证节点，面向端侧推理的O100、智驾芯片D100的2027年商用则是人车家全生态AI算力底座的叙事旗帜。 #O3：定位AI旗舰SoC；9月随旗舰折叠屏上市 24B晶体管@133mm2|3nm。O3代际提升幅度（CPU+60%/GPU+85%）。在核心数量（10核全大核）、GPU核心数（16核）、内存代际（LPDDR6@113.8GB/s）对比8GEN5、9500、A19 Pro均有亮点。NPU@200T适配定制小米MiMo端侧5值模型(vs. INT4的16值)。 #O100：端侧3D-DRAM推理芯片新范本 -工艺：2层DRAM die堆叠于6nm Logic die上方（参考谦合益邦4Dram-on-1Logic)，以空间换时延，权衡HBM高容量和SRAM极高带宽。 -带宽：#玄戒高带宽矩阵总线(期待更多细节)，据演示图为2D Mesh NoC拓扑，实现14核NPU互连，总带宽1.22TB/s。Prefill阶段采用环形拓扑、Decode阶段切换为广播拓扑。 -吞吐：Mimo-3B可实现330Token/s吞吐（或媲美光羽芯辰TC1000在3B模型上的300Token/s） #D100：国内首款3nm智驾高算力AI芯片。 3nm工艺，20核CPU+16核NPU，160GB统一内存，支持200B模型。已完成所有验证，将于明年正式商用。#文字观点", "publish_time": "2026-08-24 17:04", "tags": ["文字观点"]}, "attachment:files/消费电子走出至暗时刻，关注超节点机会20260823.pdf": {"id": "attachment:files/消费电子走出至暗时刻，关注超节点机会20260823.pdf", "kind": "attachment", "title": "消费电子走出至暗时刻，关注超节点机会20260823", "source_label": "其他", "excerpt": "消费电子走出至暗时刻，关注超节点机会 20260823 要点总结 1.会议概述与核心逻辑 本次会议由中金公司科技硬件分析师团队召开，围绕两大投资主线展开：消费电子板块（果链与安 卓链）和国产算力超节点机会。自 7 月以来，市场呈现两条逻辑主线：一是对海外算力短期出现争论与质疑", "content": "消费电子走出至暗时刻，关注超节点机会 20260823 要点总结 1.会议概述与核心逻辑 本次会议由中金公司科技硬件分析师团队召开，围绕两大投资主线展开：消费电子板块（果链与安 卓链）和国产算力超节点机会。 自 7 月以来，市场呈现两条逻辑主线：一是对海外算力短期出现争论与质疑；二是产业景气度持续 向上。在此背景下，消费电子板块（受存储涨价压制）正逐步走出低谷，同时国内 CSP 资本开支上 行叠加国产大模型迭代加速，国产算力走出独立行情。 2.果链：新品发布节奏与定价策略 苹果 9 月初将发布 iPhone 18 系列（含 Pro/Pro Max）及折叠屏产品，市场关注焦点集中在定价 方向。 日本作为苹果全球最早进行 iPhone 17 涨价测试的市场（除中国大陆外唯一单独统计的国家/地 区），苹果通过日本市场观察约 10%涨价幅度对消费者购买意愿的影响，实际反馈显示基本无太大 影响。 上周渠道反馈显示，苹果 9 月这波涨价大概率参考日本类似幅度，即在 10%左右。该涨幅好于市场 此前悲观预期（此前市场最悲观预期苹果会在 iPhone 上沿用 Mac/Pad 的涨价幅度以维持硬件端 高毛利率水平），苹果实际采取更审慎的产销策略，通过相对控毛利、控价格来保证毛利稳定性。 iPhone 18 Pro/Pro Max 主要创新点：外观层面挖孔屏尺寸调整、新配色；内部结构方面两纳米芯 片为最大卖点，叠加散热材料升级。 3.果链：折叠屏产品与备货情况 苹果折叠屏打磨超过 3-4 年，供应链和研发工艺具有明显苹果特色：内折屏采用双重衬底（金属+ 玻璃两块衬底）以减少应力带来的折损；铰链方面有特殊专利申请和代工安排。 定价预期与苹果 Pro Max 2TB 最高端机型定价类似；供应链反馈备货量为 800-1000 万台，该数 字不算激进，若销售表现好可能继续加单，加单信息将成为产业链重要催化。 市场对量的担忧主要源于新机发布节奏（下半年无普通款和 Air，放到明年上半年发布），可能对 三季度普通款及 Air 零部件/组装环节份额较高的供应商造成压力，但 A 股大部分公司不会受到明显 影响。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 折叠屏价值量至少为一台普通款的 3-5 倍，且 Pro Max 相比去年有加单，叠加折叠屏更高价值量 贡献，从营收端看小幅出货量下滑会被更大幅度 ASP 提升所抵消，下半年整体供应链营收利润可观 （暂不考虑汇兑等不可预测因素）。 4.果链：中长期展望与创新方向 明年为 iPhone 20 周年，参照十周年经验，预计苹果会有非常大的外观改款和产品更新创新，有望 给手机出货带来正面影响。 配件类产品值得关注：可穿戴（耳机、手表）陆续有新品迭代；0 到 1 创新品类方面，眼镜是市场 关注度最高的产品品类，未来 6-9 个月供应链应有更多确定性进展；此外还有胸针佩戴类 AI 产品 （主打摄像头+语音交互信息获取）及带摄像头的耳机，预计未来半年到 9 个月能看到产品进展。 国内果链公司超过 60%甚至 80%以上营收和利润来自手机，手机基本盘稳健；配件类新品创新可 从估值维度增强市场对端侧（尤其果链）强创新周期的信心。 OpenAI 等大模型公司未来半年左右可能发布新品，叠加存储涨价带来的估值折价压力，后续边际 改善趋势明显。 AI 眼镜方面，此前半年左右多个互联网巨头及国内科技巨头的产品有所延迟，预计未来一段时间将 陆续解决或如期发布，对端侧板块情绪和信心有正面提振。 5.安卓链：上半年业绩信号（量、ASP、毛利率） 传音和小米上半年智能机出货量同比均呈双位数左右下降；环比看，传音单季度稳定在 1900-2000 万台区间，小米二季度与一季度相比也基本稳定。存储确实对安卓手机出货量产生了影响。 ASP 方面，两家公司为转移存储涨价压力均有一定程度提升，且量的下降幅度小于 ASP 上升幅度， 体现量价平衡的努力。传音在业绩会上提到 150 美金以上价位段占比提升最为显著；小米提到做了 手机提价，并在规模和利润之间做了较好平衡。 毛利率方面，小米和传音手机毛利率整体好于市场微观预期：小米二季度手机毛利率约 8.5%，上 半年平均约 9.3%；传音二季度总体毛利率在四季度基础上环比继续向上。 市占率方面，小米维持全球第三市场份额，传音智能机出货量市场份额相对稳定，体现头部公司面 对产业波动的韧性。 综合来看，二季度安卓链状况相对一季度有所缓解，各厂商尽量平衡量、价、毛利率三方面状态； 小米发完业绩后第二天股价上涨，体现市场对消费电子板块利空出尽的逻辑。 6.安卓链：存储预期、存货准备与中长期展望 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 存储预期：小米在业绩会上表示二季度内存成本仍处历史较高位置，一二季度存储涨幅超出公司预 期，成本增加客观存在且无法全部转嫁给消费者；但从第三方数据看涨幅正逐渐趋缓，2027 年下 半年存储价格预计将进入企稳状态。 存货准备：两家公司存货环比均有大幅上涨。传音 2026 年初存货约 90 多亿元，六月底达 200 多 亿元；六月底存货中原材料占比 52%，最大构成为存储备货，原材料从年初不到 40 亿元增长至六 月底 107 亿元，主要驱动因素为存储芯片和部件备货。传音备货逻辑基于 2027 年为存储行业供应 最困难一年的判断，但已观察到 2026 年 Q3/Q4 存储涨价趋缓，将在 2027 年 Q1 逐步控制备货节 奏。小米二季度库存约 400 多亿元人民币，内存相关占比较大，原材料占比也在往上走。 中长期判断：往半年到一年维度，消费电子/手机市场将处于逐渐修复过程——量上从 2027 年或以 后慢慢修复（至少不再大幅下滑）；ASP 上移，各厂商抓住危机中的机遇将产品结构向中高端迁 移。复盘 2022 年库存危机，小米、传音抓住了机会获取更多市场份额，份额来源为尾部中小品牌 厂商及 Others 中的白牌厂商。 三个可判断方向：①智能手机即使在较长换机周期下，对部分消费者每年的需求仍存在刚性；②手 机厂商适应今年存储波动后，明年将以更从容状态应对；③端侧 AI 市场在 2027 年底以后将有强劲 突破和变化（苹果 Apple Intelligence、小米大模型、传音端侧大模型准备等）。 结论：安卓终端确实走出了最悲观的时刻，只是恢复节奏问题；结合市场对海外算力链波动的担 忧，安卓链/消费电子成为具有防御属性的板块投资机会。 7.安卓链：供应链三季度压力与长期成长逻辑 按存货先进先出法，安卓链三季度可能仍面临一定成本压力，因存储价格即使趋缓仍处高位，部分 公司三季度预计仍面临成本压力。 但从股价预期看，与存储板块高位担忧逻辑相同，利空出尽情况下当前股价已基本充分 Price in； 三四季度基本面仍有压力，但市场更多锚定明年一年维度消费电子修复逻辑。 龙头/供应链核心公司除手机外，在 AIPC、可穿戴 IOT、储能等方向均有较大突破和进展，非消费 电子部分增长值得关注。 3-5 年远期视角：消费电子龙头公司经过十几年洗礼，在产品定义、制造、精密制造和组装能力上 非常强；从去年开始已看到龙头公司跨界做 AI 相关业务（PCB 公司、光通信业务、玻璃基板等方 向）。精密制造和组装能力是消费电子龙头公司的核心竞争力，可迁移至其他领域；基于对 AI 产业 链的乐观判断，建议前瞻性关注消费电子龙头公司凭借精密组装制造能力在 AI 算力时代切入新赛道 的机会。 8.模拟板块观点 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 上周龙头公司出业绩，与消费电子情况类似：关注度不高但龙头业绩较好，主要逻辑来自与 AI 算力 链（尤其光模块）相关业务的快速增长。 飞利浦在业绩会上提到光模块业务随 400G/800G 方向及后期 1.6T 持续迭代，收入占比持续提升。 这些板块估值处于历史相对低位，同时受 AI 相关业务催化，后续业绩有持续增长动能；与消费电子 龙头跨界做 AI 业务逻辑相呼应——主业企稳走出谷底，同时关注新业务长期成长逻辑。 推荐顺序：果链优先于安卓链；安卓链中品牌公司优先于供应链公司。 9.国产算力：CSP 资本开支情况 腾讯二季度资本开支达 528 亿元，同比大幅增长超 170%，环比增速也非常可观，超出很多投资人 预期。业绩会上腾讯表示资本开支首要用途为未来几个月训练更大更好的模型，重要次要用途为提 供推理算力（服务于模型及元宝等应用）。 阿里二季度资本开支达 677 亿元，同比增长 75%。管理层表示行业共识是 2030 年前看不到 AI 算 力紧缺情况有非常大改变；阿里云对 AI 算力投资回报确定性非常高，按目前 AI 产品盈利水平，AI 算力投入可在三年内回本，未来随 AI 产品毛利率提升，回报周期有望向 2.5 年推进。 国内头部 CSP 厂商资本开支处高速增长过程中，且潜在有资本开支上升可能性，为今年下半年及后 续国产算力链需求和厂商订单提供良好支撑。 10.超节点：背景与必要性 算力扩张分两个方向：Scale Out（增加节点数量）和 Scale Up（把单个计算域/计算节点做强）。 超节点核心是 Scale Up，将几十甚至上百张卡以高带宽、低时延连接成大的计算单元。 算力瓶颈已不仅在于芯片计算能力本身，更核心在于显存容量及卡间互联带宽。模型训练和推理过 程中存在张量并行、专家并行等策略，会提升通信复杂度和卡间通信需求。 张量并行：当模型隐藏维度、注意力层或单个专家规模较大时，单张 GPU 难以承载权重和计算， 需将同一层或同一专家权重矩阵切分到多张 GPU，通过集合通信操作交换中间激活值并汇总局部计 算结果。 专家并行：针对 MoE 模型，将不同专家分布到不同 GPU 上降低单卡装载专家权重的规模，系统需 根据路由结果将 token 发送至目标专家所在 GPU 计算，再通过通信返回汇总结果。 显存角度：GPU 计算单元性能迭代速度高于显存迭代速度，产生计算性能与存储性能之间的 Gap 或不匹配。超节点核心通过高性能 Scale Up 互联扩展计算域，缓解显存容量与卡间通信瓶颈。 国内大模型已迈入万亿参数阶段：Kimi K3 模型官方技术文档建议放在 64 卡以上的 AI 加速卡组成 的超节点上。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 11.超节点：K3 模型部署需求测算 K3 模型总参数量 2.8T，含 896 个专家，每个 token 激活其中 16 个，支持 100 万上下文。 显存需求：按每参数 4 比特估算，2.8 万亿参数对应约 1.4TB 权重数据量；还需考虑量化因子、激 活值、注意力层及其他非专家参数占用；高频专家复制进一步增加显存容量要求。单卡 HBM 容量 有限时，系统需依靠更多加速卡拼出足够大显存容量；100 万 token 上下文进一步提高整体系统显 存负担。 896 个专家分布在多张卡上，系统需为每个 token 完成专家选择、数据分发及计算结果汇合，互联 速率直接影响系统生成 token 效率。未来模型参数持续迭代、专家数量不断上升，对显存和互联要 求只会更高。 尽管国产芯片单卡性能与英伟达存在差距，但可通过系统优化方式弥补：第三方测评显示，昇腾 384 集群 BF16 计算性能可达 NVIDIA NVL72 的 1.7 倍，HBM 容量为后者 3.6 倍。代价是卡数量 更多、能耗更高，压力更多给到交换互联环节。 12.超节点：核心受益环节——交换互联 超节点最核心性能除卡数量（算力）外，更在于能否聚合足够大的显存以及卡间互联带宽是否足够 大，卡互联实现需用到交换芯片，交换互联重要性持续提升。 以 51.2T 交换芯片为例：传统 Scale Out 网络中多张算力卡共享网卡，单卡数网带宽较低。按单张 网卡端口传输速率 800GB/s 测算，1:1 无收敛配置下，三层组网算力卡与 51.2T 交换芯片配置比例 约 13:1，两层组网约 21:1。 Scale Up 场景中，按单卡单向带宽 800GB/s 测算，单层无冗余且不计协议开销情况下，一颗 51.2T 交换芯片理论上对应 8 张算力卡，配置比例约 8:1；实际交换芯片配置通常等于或高于理论 测算值。 当前阶段 Scale Up 单张算力卡对应交换芯片数量可达 Scale Out 的 2-3 倍。未来随单卡 Scale Up 互联带宽提升、Scale Up 域端口冗余配置增加，单卡对应交换芯片数量有望进一步提升，带动 Switch 芯片等配套环节增长。 相关标的：锐捷网络、紫光股份等头部交换机厂商，二季度交出亮眼业绩，后续随超节点交换环节 放量值得关注。 13.超节点：核心受益环节——ODM/系统集成 传统 AI 服务器以 8 卡节点为基本交付单元，服务器厂商核心竞争点在于主板及整机设计、供应链 成本管控、散热和供电设计等。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 超节点形态需涉及十几张甚至上百张 GPU 卡协同，需要 Scale Up 交换系统、供配电及液冷设施配 套等。服务器厂商责任边界从过去单节点制造测试交付延伸至整机柜甚至跨机柜系统集成。 要求厂商具备计算、机电与交换系统协同设计、高速互联布线、信号完整性管理、高功率供配电链 路等能力，推动服务器厂商交付边界从单节点向系统级延伸，具备整机集成能力的厂商可扩大利润 池。 PCB、连接器等环节也将受益于超节点放量；超节点提高单个功率密度，带来液冷、 指数：6977.94（+2.42%） 韩国是亚太区域表现最为亮眼的市场，韩国综合指数大涨超 2.4%，创下近数周最佳单日表现。受闪迪投资者日利好，市场对人工智能基建带来的存储需求预期改善，SK 海力士领涨大盘，上涨 6.5%。美国大型科技企业财报表现强劲，资金重新涌入 AI 交易主线，三星电子也对指数形成显著正向贡献。【中国内地】 —— 沪深 300：4665.88（+0.04%）｜上证综指：3927.18（+0.01%） A 股基本横盘，沪深 300 与上证综指微幅收红。7 月新增人民币贷款出现创纪录收缩，居民与企业合计净偿还 5900 亿元贷款，为 2002 年以来最大偿还规模，反映出居民及企业信心疲弱，压制市场情绪。央行开展 3490 亿元隔夜逆回购，为月中首次开展该操作，实现净投放 3480 亿元流动性，对债券市场形成一定支撑。【中国香港】 —— 恒生指数：25116.85（‑1.10%） 港股跑输区域大盘，恒生指数跌幅超 1%。跨境资金监管趋严的担忧叠加国内信贷数据疲弱，市场承压。MiniMax 在 8 月 19 日财报发布前，盘中最大跌幅达 16%，创下近一个月最大单日回撤。星展银行即将卸任的香港区 CEO 表示，该行尚未观察到跨境监管带来的直接冲击，但该事件带来的整体风险仍持续打压市场情绪。【中国台湾】 —— 台湾加权指数：45811.01（‑0.46%） 尽管区域科技板块整体向好，台湾加权指数小幅收跌。受外资流入、分红相关资金流出消退影响，新台币汇率表现强势，对出口导向型个股形成一定压力。闪迪事件为存储及半导体板块带来利好催化，但板块涨幅弱于韩日市场。【印度】 —— 孟买敏感指数：78009.25（‑0.09%）｜印度 NIFTY50 指数：24366.00（‑0.12%） 印度股市连续第四个交易日下挫，终结两周连涨行情。油价高企，叠加 AI 主线行情吸引资金流向其他亚洲市场。印度国家银行对 NIFTY 指数拖累最大，下跌 1.4%；塔塔汽车乘用车板块下跌 4.3%。利好方面，LG 电子印度公司一季度财报超预期，营业利润率达 12.5%，股价盘中最高大涨 8%；阿波罗医院凭借强劲经营表现以及产能扩张，股价走高。若感兴趣的投资者需要订阅，可随时联系中信证券对口销售老师。后续我们会逐步以销售外发【订阅制】形式推送。#文字观点", "publish_time": "2026-08-24 17:09", "tags": ["文字观点"]}, "attachment:files/大摩周一宏观策略会：全球流动性大考？20260824_导读.pdf": {"id": "attachment:files/大摩周一宏观策略会：全球流动性大考？20260824_导读.pdf", "kind": "attachment", "title": "大摩周一宏观策略会：全球流动性大考？20260824_导读", "source_label": "其他", "excerpt": "宏观经济 |", "content": "宏观经济 | 证券研究报告 — 总量周报 2026年8月23日 相关研究报告 《黄金价格较快回升》 20260823 《1-7月财政数据点评》 20260823 《美债的“近忧与远虑” 》 20260822 中银国际证券股份有限公司 具备证券投资咨询业务资格 宏观经济 证券分析师：陈琦 qi.chen@bocichina.com 证券投资咨询业务证书编号： S1300521110003 证券分析师：朱启兵 (8610)66229359 Qibing.Zhu@bocichina.com 证券投资咨询业务证书编号： S1300516090001 宏观和大类资产配置周报 本周沪深 300指数下跌 1.01% 大类资产配置顺序：股票 >大宗 >债券 >货币。 宏观数据回顾  要闻：国务院总理李强 8月17日主持召开国务院第十二次全体会议，强 调要扎实做好各项工作，努力完成全年经济社会发展目标任务，实现 “十 五五”良好开局。李强指出，当前内需不足问题仍然突出，一些行业企业 困难增多，外部环境不确定性上升。要锚定发展目标，充分发挥存量政策 效能，及时谋划出台务实管用的增量政策，破除各种堵点卡点，推动经济 持续向新向优向好发展。 资产表现回顾  本周沪深 300指数下跌 1.01%，沪深 300股指期货下跌 0.98%；焦煤期货 本周上涨 16.03%， 铁矿石主力合约本周下跌 0.63%；余额宝 7天年化收益 率下跌 1BP至0.82%；十年国债收益率下行 1BP至1.68%，活跃十年国债 期货本周下跌 0.08%。 资产配置建议  1-7月广义财政支出累计同比降幅为 3.1%， 降幅较 6月走扩 0.2个百分点， 相对偏弱。中央财政支出在 1-7月广义财政支出中占比 13.2%，仍是重要 支撑，但对当期广义财政支出同比增速有所拖累， 1-7月广义中央财政支 出同比下滑 9.6%，降幅较 6月小幅收窄。 1-7月一般公共预算支出在全年 公共预算支出中占比 54.3%，支出力度整体不弱。但 7月当月支出在全年 公共预算支出中占比为 6.5%，仍略低于 2024 -2025年同期水平， 7月财政 支出节奏仍维持定力。 需注意的是， 8月21日，财政部副部长廖岷在国新办发布会上表示，年 内地方政府专项债券和超长期特别国债仍有超过 2万亿元的剩余额度， 有 望维持政策强度。此外，加快资金使用、加力扩大内需将是年内财政发力 提效的重要方向。我们认为，三季度财政存量政策有望加力提效，对当期 经济数据表现形成支撑。 本周，我们维持大类资产配置顺序：股票 >大宗 >债券 >货币。  风险提示 ：海外大宗商品价格震荡；地缘关系的不确定性；政策效果不及 预期。 本期观点（ 2026.8.23） 宏观经济 本期观点 观点变化 一个月内 = 关注三季度财政支出进度 调整 三个月内 = 关注美联储最新政策表述及美、伊冲突的持续性 不变 一年内 = 地缘关系仍有较大不确定性 不变 大类资产 本期观点 观点变化 股票 + 关注“增量”政策落实情况 超配 债券 - 关注货币政策对债市的传导影响 低配 货币 - 收益率将在 2%上下波动 低配 大宗商品 = 关注美、伊冲突对商品市场的供给冲击 标配 外汇 = 中国经济基本面优势支撑汇率宽幅波动 标配 资料来源：中银证券 下载日志已记录，仅供内部参考 2026年8月23日 宏观和大类资产配置周报 2 目录 一周概览 ................................ ................................ ................................ ......... 4 本周沪深 300指数下跌 1.01% ................................ ................................ ................................ ........ 4 要闻回顾和数据解读（新闻来源：万得） ................................ ................................ ..................... 6 宏观上下游高频数据跟踪 ................................ ................................ ............. 8 大类资产表现 ................................ ................................ ............................... 10 A股：本周市场指数表现普遍较弱 ................................ ................................ .............................. 10 债券：十年期国债收益率周五收于 1.68% ................................ ................................ .................... 11 大宗商品：本周商品期货指数上涨 7.02% ................................ ................................ ................... 12 货币类：货币基金收益率波动中枢在 1.5%下方 ................................ ................................ .......... 13 外汇：人民币兑美元中间价本周下行 ................................ ................................ .......................... 13 港股：原材料业涨幅居前 ................................ ................................ ................................ ............. 14 下周大类资产配置建议 ................................ .... 降低原材料价格波 动影响，盈利能力在 6 月份实现明显修复。 通信与数据中心基础设施业务收入占比接近两成，AI 服务器、高速光模块等高确定性高景气细分赛 道多点突破。 公司为全球 AI 基础设施领先企业批量供应高性能 PCB，应用场景和产品覆盖度持续拓宽；随着客 户当代产品陆续进入量产交付阶段，订单快速增长，预计金湾 AI 算力工厂下半年特别是四季度有望 满产，对未来几个季度经营业绩形成明确增量贡献。 3.AI 算力业务进展与产能布局 公司去年进入北美算力大客户供应链，完成工厂技改并启动当代产品验证打样，目前已取得客户新 平台产品大量料号。 珠海两个工厂的高多层及高阶 HDI 产品产能均已跑满，6-7 月开始备产，7-8 月大批量生产，预计 8-9 月开始滚动交货，四季度产能基本爆满。 全年 AI 算力相关订单预计销售收入将超过 30 亿元，上半年完成约四五个亿，主要以高多层产品为 主，另有部分液冷短板产品。 四季度单月出货量有望达到 8-10 亿元量级，业绩释放高峰预计出现在四季度。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 金湾基地已建成三条 MSPC 产线，8 月第四条线建成并调试中，年内将扩至五条线产能，设备配置 均为行业顶尖水平。 高阶 HDI 工厂（Advanced HDI）建设顺利，预计 10 月份投产；泰国生产基地即将正式投产，将 具备超高多层、高多层及 HDI 产品交付能力。 鉴于现已建及在建产能预计未来数月无法充分满足客户快速增长的交货需求，公司将适时推动新的 扩产计划。 4.金湾新扩产计划（UHC 工厂） 公司公告在珠海金湾推进新的扩产项目，主要围绕超高多层 PCB（UHC），目标打造业界高多层标 杆工厂，平均层数做到 36 层或以上。 去年公告建设的第三个工厂主打 HDI（AI 算力及高阶智驾 HDI 工厂），目前已进入试产阶段，目 标 10 月份全面投产。 新扩产计划一方面源于大客户订单需求，另一方面公司在交换机领域产品能力及客户开拓取得长足 进展，主流 ODM 厂商需求逐步释放。 公司已提前与设备供应商锁定产能和设备交付，包括钻机、压机、电路线、曝光机等关键瓶颈设 备，项目产能将快速释放。 5.高速光模块与 MSPC 业务 公司已批量交付 800G 和 1.6T 光模块 PCB，与多家全球领先客户建立稳固战略合作伙伴关系。 公司自 2023 年起与客户接触并提前布局 MSPC 产线，在珠海 SLP 工厂安装第一条 M 线；去年底 意识到产能可能产生巨大瓶颈后优先决定增加产线。 过去几个月平均约一个半月新增一条线，从今年 3-4 月至今已具备四条线生产能力，第四条线一两 个礼拜内装好，10 月份第五条线基本装好，预计 11 月份具备五条线生产能力。 月产出有效产出（非产能）可达 200 万只以上，在 800G 光模块为主力生产交付状态下，综合良率 超过 85%，为业内最高水平之一，且仍在持续提升。 一季度和二季度初存在物料准备度问题，目前已基本解决，关键物料均无重大问题，三条线已打 满；终端客户正在对包括国产 CCL、铜箔等不同材料进行验证，公司积极配合确保供应链安全。 6.交换机业务进展 国产客户如新浪、锐捷等，56G 产品去年已进入批量阶段，112G 产品去年年底认证通过，目前 56G 和 112G 均在批量交付中。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 近半年积极拓展海外主流 ODM 厂商交换机项目，国内外及台湾主流 ODM 厂商已陆续进入其 AVL （合格供应商名录），部分项目已在进行打样。 有个别客户已提出明年 3 月到二季度前需准备好相应产能的要求。 7.北美云厂商（CSP）客户拓展 公司对北美几家云厂商均有接触，进度各不相同，个别已进入打样和验证阶段，主要以验证下一代 产品的方式进行。 目标在 2028 年至少有两家云厂商成为不仅通过认证、而且有实际业绩交付的供应商。 8.原材料价格与毛利率展望 过去约十个月 PCB 材料涨价是主旋律，对一季度业绩造成较大困扰；5-6 月份公司与客户沟通取得 较大进展，材料顺价效果较好，客户基本接受。 公司坚持从今年年初以来材料涨价部分全部向下游客户传导，目前价格已不再是讨论话题，焦点集 中在供应保障上。 全年传统产品毛利率水平目标不低于去年水平；三季度和四季度传导力度将不低于二季度，同时将 一季度及二季度前期未覆盖的成本叠加到后续季度中。 公司预计材料涨价趋势可能延续至明年乃至明年下半年，未感受到材料降价的迹象。 公司主要材料合作伙伴包括生益科技、台湾南亚塑胶、EMC、陡山（AI 材料）、上海南亚、华中等 主流高质量厂商。 9.技术储备与前沿研发 埋嵌陶瓷技术：公司在车载应用中已广泛应用埋铜、埋陶瓷等技术，积累了丰富经验，并积极拓展 其他器件埋嵌及加工工艺。 PTFE 材料：公司从 5G 天线到毫米波雷达等方面积累多年 PTFE 加工经验，在 AI 应用领域也在持 续跟进，跟进节奏和程度处于行业较前位置。 陶瓷基板：公司具备 DPC 到 AMB 等陶瓷基板技术，覆盖氮化铝、氮化硅、氧化铝等材料，AMB 和 DBC 已在汽车电子领域打开应用，同时持续投入 DPC、低温多层共烧等新技术研发。 公司研发费用绝对值与相对值均持续提升，对前沿材料与工艺保持高度重视。 10.海外布局与竞争策略 泰国工厂已进入试产阶段，定位与 AI 相关，属于技术含量较高的领域，将具备超高多层、高多层及 HDI 产品交付能力。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 公司认为中国大陆是全球 PCB 乃至电子产品技术的最优供应链，凭借强大的工程师资源、产能和供 应链资源，在很长一段时间内不可替代；内地产能和资源预计将领先海外 1-2 代甚至更多。 海外产能何时成为有效产出仍需时间，但公司会积极配合客户要求进行海外布局。 公司认为竞争优势的核心在于：拥有有效的高质量产能、深度理解客户技术痛点并提供解决方案、 以及拥有头部客户群；单纯扩产若为无效产能或良率低，反而会带来麻烦。 11.下半年展望与战略定位 今年下半年是公司从预期驱动转向业绩驱动的关键期，在 AI 算力需求持续释放、智能化加速演进的 结构性机遇中，公司已从传统 PCB 制造商向高端算力硬件核心供应商战略延伸。 下半年及未来两三年 PCB 行业处于涨价周期，公司已实现与客户共同承担上游材料价格压力，实时 进行价格传导，有利于供应链健康发展和毛利改善。 下半年是公司从传统 PCB 向高端高性能 PCB 转化的关键拐点，AI 服务器高性能 PCB 及高速网络通 信光模块 PCB 占比将逐渐提升，产品结构持续优化，业绩将逐季持续提升和改善。 问答整理 Q1：三季度算力业务（珠海金湾）的交付稼动率和订单有无具体指引？金湾新扩产是否有其 他算力客户的具体进展？ 答： 公司去年进入北美算力大客户供应链，完成工厂技改并开始当代产品验证打样，目前已取得客户新 平台产品大量料号。珠海两个工厂的高多层和高阶 HDI 产品产能均已跑满。从客户交付计划看，6-7 月 开始备产，7-8 月大批量生产，预计 8-9 月开始滚动交货，四季度产能基本爆满，部分月份出货计划超 出原计划。从三季度开始出货将比上半年大幅提升，全年 AI 相关销售预计超过 30 亿元。新扩产方面， 去年公告的第三个工厂（主打 HDI，名为 AI 算力及高阶智驾 HDI 工厂）已进入试产阶段，目标 10 月 全面投产；金湾基地原有 SLP 工厂和 HLC 高多层工厂，第三个工厂为 Advanced HDI，主打 AI 计算 HDI 高阶厚板产品。同时公司在交换机领域产品能力和客户开拓取得长足进展，主流 ODM 厂商需求逐 步释放，催生了超高多层（UHC）工厂的扩产需求。公司已提前锁定设备产能和交付，项目将快速释 放产能。UHC 工厂目标平均层数做到 36 层或以上。 Q2：公司在 N 客户 HDI 产品方面，除网卡外，算力板等是否有进一步突破性进展？ 答： 客户的 HDI 产品目前已在公司产线上运行，当前主要受限于产能。公司正重点加快 HDI 产能释 放，高阶 HDI 工厂已在试运行，部分工序试运行中，计划 10 月份全面投产，以满足客户高阶 HDI 需 求。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Q3：四季度是否会在 AI 算力板方面形成大批量交付？ 答： 新工厂有一系列程序和流程要走，公司会尽可能去争取和加快，四季度有望形成较大批量的交付。 Q4：交换机市场目前客户进展如何？ 答： 国产客户如新浪、锐捷等，56G 产品去年已进入批量阶段，112G 产品去年年底认证通过，目前 56G 和 112G 均在批量交付。近半年公司积极拓展海外主流 ODM 厂商的交换机项目，国内外及台湾 主流 ODM 厂商已陆续进入 AVL，部分项目已在打样，有个别客户提出明年 3 月到二季度前需准备好 产能的要求。 Q5：北美 CSP 客户方面，四季度是否会有客户群体的突破？ 答： 云厂商客户相对复杂，除产能和技术要求外还有其他层面的要求。公司对北美几家云厂商均有接 触，进度各不相同，个别已进入打样和验证阶段，主要以下一代产品方式验证。目标是在 2028 年至少 有两家云厂商成为不仅通过认证、而且有实际业绩交付的供应商。 Q6：AI 算力领域材料变化（PTFE、陶瓷材料、马酒 Q 布等）的应用前景和进展如何？ 答： 这些材料都具备应用可能性，公司作为前沿深度参与厂商都在积极跟进和配合。但具体在什么时 间、什么平台、什么情况下使用，目前没有明确结论，涉及客户具体产品方案不便多做讨论。公司在材 料发展趋势上追求高速、低损等前沿方向，但具体落地时间节点和平台仍有大量工作要做。 Q7：光模块 MSPC 目前的量、良率情况如何？MSPC 工艺在 AI 其他领域能否普遍应用？ 答： 公司从 2023 年开始与客户接触，提前在珠海 SLP 工厂安装第一条 M 线，当时金湾基地整体亏 损、压力很大的情况下仍坚持技术升级。经过多年布局和沉淀，积累了大量经验。去年底意识到光模块 MSPC 产能可能产生巨大瓶颈时，优先决定增加产线。过去几个月平均一个半月新增一条线，从今年 3-4 月至今已具备四条线生产能力，第四条线一两个礼拜内装好，10 月份第五条线基本装好，预计 11 月份具备五条线生产能力。月产出有效产出可达 200 万只以上，在 800G 光模块为主力生产交付状态 下，良率超过 85%，爬坡速度非常快。物料方面，一季度和二季度初存在准备度问题，目前已基本解 决，关键物料无重大问题，三条线已打满。终端客户正在对包括国产材料在内的不同材料进行验证，从 CCL 到铜箔都在配合推进。 Q8：如何看待后续 MSPC 竞争格局？ 答： 从长远发展方向看，MSPC 工艺技术在光模块从 800G 到 1.6T 再到未来 2.4T、3.2T、NPO 等演 进路径中是跑不掉的，将充当非常重要的角色。目前整体仍供不应求，短期内难以解决，且设备交付周 期很长，现在才想切入该领域压力很大。该产品门槛不低，公司在 24-25 年 MSPC 未出现巨大瓶颈时 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 就开始产品验证，交了很多学费。未来 MSPC 竞争格局将相对集中，拥有头部客户至关重要，头部客 户引领市场和技术发展方向，只要在头部客户核心供应商群体内，即使行情波动也基本能保持稳定。 Q9：NPO 明年放量节奏如何？MSPC 是否可理解为通往 CPO 甲板化的过渡环节，公司在 CPO 领域是否有卡位优势？ 答： NPO 方面公司团队正在积极与客户沟通新产品情况，但具体产品形态、设计及量产节奏尚在了解 过程中，不方便透露。公司当前最核心的任务是解决 800G 和 1.6T 产品的交付问题。CPO 涉及从芯片 到载板到 PCB、涵盖先进封装多个领域的变化，还有很多问题需要解决，具体以什么设计和技术落地尚 不确定。MSPC 技术储备确实重要，未来以什么形态呈现不好说，但 MSPC 是值得关注的方向，公司 正在过程中不断尝试。 Q10：AI 相关（MSPC、高多层、HDI）产品毛利率相比常规产品能增加多少？ 答： AI 和光模块产品的毛利率很大程度上取决于良率。得益于公司过去多年在金湾的沉淀和客户的信 任支持，公司这两个产品的良率进展速度很快，对标业界优秀水平没有落后，某些方面表现较好。从良 率和毛利情况看，公司已进入第一梯队。从量产产品交付情况看，客户对品质和交付给予高度认可，上 线良率在客户眼中处于第一梯队。 Q11：常规覆铜板原材料近期是否有降价？后续常规覆铜板价格趋势如何？ 答： 过去约十个月 PCB 材料涨价是相当大的主旋律，对一季度造成较大困扰。5-6 月份公司与客户沟 通取得较大进展，材料顺价效果较好，客户基本接受。公司目标是将材料成本上涨基本转移到下游。目 前面临的最大挑战不是价格而是供应保障。公司未感受到材料降价的迹象，可能有些材料降价说法并非 公司常用材料或属于其他领域。公司主要合作伙伴包括生益科技、台湾南亚塑胶、EMC、陡山、上海 南亚、华中等主流高质量厂商。公司预计材料涨价趋势可能延续至明年乃至明年下半年，下半年仍存在 价格上升的可能性。 Q12：目前珠海产能中可用于 AI 的比例有多少？下半年是否全部切给 AI？ 答： 公司每周与客户梳理产能和可接订单信息，不存在接了订单交不出来的情况。公司能做多少必定使 命必达，并通过良率提升和流程优化进一步增加产出。可用于 AI 生产的产线和相关产能均已核算给客 户，并给出可接单数量。去年获得客户验证后，公司投入超过 15.5 亿元人民币对产线进行优化和改 造，已调整完毕，接下来核心工作是新产能释放以承接订单。 Q13：MSPC 扩产设备是否已锁定关键长交期设备供应？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 答： 大部分设备已在去年下单，今年年初追加了一部分。10 月份能开出的产能均为去年已下单设备， UHC 工厂设备也基本安排完毕。个别工序存在追单情况，但主要瓶颈设备均已下单。公司已提前与设 备商锁定关键瓶颈设备产能，包括钻机、压机、电路线、曝光机等。 Q14：下半年传统 PCB 盈利能力提升节奏如何？何时能恢复到涨价前水平？ 答： 一季度承受较大压力，二季度毛利率明显恢复，很大程度上来源于向下游客户传导的效果。三季度 和四季度坚持以下原则：今年年初以来材料涨价部分全部向下游客户传导。目前客户已不再讨论价格问 题，焦点集中在供应上。全年传统产品毛利率水平目标不低于去年水平。根据对下半年材料行情的判 断，材料价格仍将保持高位，三季度和四季度传导力度将不低于二季度。同时会将一季度及二季度前期 的成本缺口叠加到后续季度中，确保全年毛利水平不低于去年。过程中会分客户、分产品、分领域有重 点地提出涨价诉求。 Q15：从刘总在美国与终端客户接触的经历看，如何展望 2028 年及更长期的项目投资需求？ 国内同行扩产凶猛，公司相对竞争优势在哪里？如何看待内卷？ 答： AI 对硬件需求只会越来越高、越来越难，PCB 能贡献的价值点和可做的事情非常多，客户需求非 常确定，较长一段时间都会供不应求。竞争优势方面，第一，是否有产能且是有效的高质量产能非常重 要；第二，如何深度与客户沟通、了解技术发展方向和痛点难点，从研发、技术、产品上帮客户解决问 题极其关键；第三，拥有头部客户群是必要门槛。竞争肯定要关注，但核心应盯着客户导入、技术能 力、产品对客户下一代产品的支持。公司多年积累的技术经验、材料技术和产品能力是打动客户的重要 优势。 Q16：中美地缘博弈下，海外客户提出供应链备份需求，公司如何平衡海外与大陆扩产节奏？ 答： 泰国工厂已进入试产阶段，定位与 AI 相关，属于技术含量较高的领域。中国大陆一定是全球 PCB 乃至很多电子产品技术的最优供应链，凭借强大的工程师资源、产能和供应链资源，在很长一段时间内 不可替代。内地产能和资源预计将领先海外 1-2 代甚至更多，海外何时成为有效产出还需要时间。公司 会积极配合客户要求进行海外布局，同时对内地供应链和产能的持续发展和领先有信心。 Q17：公司在埋嵌陶瓷 HDI、高多层 PTFE 材料、低轨卫星 PCB 等前沿技术和工艺方面有哪 些储备？ 答： 埋嵌类技术公司多年前就有储备，车载应用中已广泛应用埋铜、埋陶瓷等技术，积累了丰富经验， 并积极拓展其他器件埋嵌和加工工艺。PTFE 方面，公司从 5G 天线到毫米波雷达积累了多年加工经 验，在 AI 应用领域也在持续跟进，跟进节奏和程度处于行业较前位置。陶瓷方面，公司具备 DPC 到 AMB 等陶瓷基板技术，覆盖氮化铝、氮化硅、氧化铝等材料，AMB 和 DBC 已在汽车电子领域打开应 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 用，同时持续投入 DPC、低温多层共烧等新技术研发。公司研发费用绝对值与相对值均持续提升，对 前沿材料与工艺高度重视。 Q18：AI 算力基础设施全年订单指引 30 亿元，上半年完成度多少？HDI 和 HLC 占比如何？ 三季度和四季度交付节奏怎样？ 答： 上半年完成约四五个亿，主要以高多层为主，还有部分液冷短板产品。随着下半年客户当代产品批 量交付，出货将逐月提升，四季度单月出货量有望达到 8-10 亿元量级，业绩释放高峰预计出现在四季 度。 Q19：大客户订单滚动下单周期和可见性如何？是否有明年的订单规划？ 答： 细节不方便透露。客户新平台的生命周期和总量决定最终总量。公司在这些平台的主要板子上均通 过相关认证，会维护好现有产品表现和量，产能释放后积极拓展新项目平台。客户目前滚动下单，今年 内订单已基本明确，明年一季度左右陆续确定。具体数字和份额不适合分享。 Q20：一条 MSPC 产线从投放到达产 85%良率需要多长时间？ 答： 非常快，基本上个把月就能搞定。一开始单条线良率并不理想，但随着 5-6 月份二线、三线到四线 安装，三条线综合良率达到 85%。快速投产、快速上良率是公司长期竞争力的最大保证。 Q21：85%的良率是否是业内最高水平？还有提升空间吗？ 答： 85%是目前听到的业内最高水平。公司目标不止于此，还会继续努力提升。 Q22：光模块 MSPC 未来 1-2 个季度价格和毛利率趋势如何？ 答： 需要与客户整体状态沟通，过去确实有调整动作，客户也非常支持。毛利率提升一方面靠提升良 率，另一方面靠客户给予的激励。客户会给出一些指引，团队干劲很足，提前一个月交付客户给予的激 励会更大。 原文 景旺电子 20260823_原文 2026 年 08 月 24 日 发言人 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 大家好，欢迎参加景旺电子 2026 年半年度业绩交流会。在会议室前我们代为声明，未经本平台及主办 方书面授权许可，任何机构或个人不得以任何形式转发、翻版、复制、引用或发布本次会议全部或部分 内容，不得制作会议纪要对外发送。擅自制作会议纪要引起不当传播的，后果自负。 发言人 为保证会议流畅进行，目前所有线上投资者均处于静音状态，在主讲嘉宾发言结束后将留有提问时间。 下面介绍出席本次会议的领导，总裁刘总，财务总监孙总，董事会秘书黄总 27‑Q2 财报将于8月25日盘后发布，800G FiberEdge TIA需求全面强劲，1.6T FiberEdge（TIA + 驱动器）Q2开始出货，下半年快速爬坡。另外，代工厂产能紧缺，高速光模块TIA/Driver刚需工艺为SiGe BiCMOS，Tower、GlobalFoundries、意法半导体产能紧缺扩产加速，整个TIA/Driver行业通胀逻辑进一步强化。#核心推荐：优讯股份、金字火腿2️⃣#方向二：华为韬芯片华为预计在9月初的IFA开幕前开发布会，届时将产出相关消费电子产品。华为韬芯片内部测算顺利，进展比市场预期更好，有望在Q3面向消费者发布。核心fab厂以及相关散热板块有望受益。#核心推荐：中芯国际、华虹宏力、飞荣达3️⃣#方向三：国产HBMHBM成为今明两年国产AI芯片最大瓶颈，长鑫今年HBM 5000片产能，明年预计扩产至3w片+，海力士停供HBM3，对全球HBM3的供应造成严重挑战，因此长鑫明年HBM的突破以及量产对于国产AI基础设备建设的意义至关重大，目前长鑫HBM扩产进一步加速，相关后道设备订单持续放量。 #核心推荐：长鑫科技、盛美上海、拓荆科技、芯源微、ASMPT#文字观点", "publish_time": "2026-08-24 07:51", "tags": ["核心推荐", "优讯股份、金字火腿", "方向二", "华为韬芯片", "中芯国际、华虹宏力、飞荣达", "方向三", "国产HBM", "文字观点"]}, "attachment:files/光通信最好的时代，持续看拐点机会20260820.pdf": {"id": "attachment:files/光通信最好的时代，持续看拐点机会20260820.pdf", "kind": "attachment", "title": "光通信最好的时代，持续看拐点机会20260820", "source_label": "其他", "excerpt": "景旺电子 2026 年半年度业绩交流会 20260823 要点总结 1.经营业绩与财务表现 2026 年上半年实现营业收入 86.1 亿元，同比增长 21.37%；归母净利润 6.02 亿元，同比下降 7.38%。", "content": "景旺电子 2026 年半年度业绩交流会 20260823 要点总结 1.经营业绩与财务表现 2026 年上半年实现营业收入 86.1 亿元，同比增长 21.37%；归母净利润 6.02 亿元，同比下降 7.38%。 利润下滑主要受人民币升值影响，上半年汇兑损失 1.23 亿元，上年同期为汇兑收益 0.38 亿元，汇 兑因素对净利润影响超过 1.5 亿元。 二季度实现营业收入 47.20 亿元，同比和环比增速均超过 20%；归母净利润 3.69 亿元，同比增长 13.61%，环比增长 58.55%，盈利能力明显修复。 按产品结构拆分，硬板与软板收入比重约为 8:2。 2.业务板块与收入结构 汽车电子业务收入占比约 45%，公司已做到全球汽车 PCB 第一，通过多措并举降低原材料价格波 动影响，盈利能力在 6 月份实现明显修复。 通信与数据中心基础设施业务收入占比接近两成，AI 服务器、高速光模块等高确定性高景气细分赛 道多点突破。 公司为全球 AI 基础设施领先企业批量供应高性能 PCB，应用场景和产品覆盖度持续拓宽；随着客 户当代产品陆续进入量产交付阶段，订单快速增长，预计金湾 AI 算力工厂下半年特别是四季度有望 满产，对未来几个季度经营业绩形成明确增量贡献。 3.AI 算力业务进展与产能布局 公司去年进入北美算力大客户供应链，完成工厂技改并启动当代产品验证打样，目前已取得客户新 平台产品大量料号。 珠海两个工厂的高多层及高阶 HDI 产品产能均已跑满，6-7 月开始备产，7-8 月大批量生产，预计 8-9 月开始滚动交货，四季度产能基本爆满。 全年 AI 算力相关订单预计销售收入将超过 30 亿元，上半年完成约四五个亿，主要以高多层产品为 主，另有部分液冷短板产品。 四季度单月出货量有望达到 8-10 亿元量级，业绩释放高峰预计出现在四季度。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 金湾基地已建成三条 MSPC 产线，8 月第四条线建成并调试中，年内将扩至五条线产能，设备配置 均为行业顶尖水平。 高阶 HDI 工厂（Advanced HDI）建设顺利，预计 10 月份投产；泰国生产基地即将正式投产，将 具备超高多层、高多层及 HDI 产品交付能力。 鉴于现已建及在建产能预计未来数月无法充分满足客户快速增长的交货需求，公司将适时推动新的 扩产计划。 4.金湾新扩产计划（UHC 工厂） 公司公告在珠海金湾推进新的扩产项目，主要围绕超高多层 PCB（UHC），目标打造业界高多层标 杆工厂，平均层数做到 36 层或以上。 去年公告建设的第三个工厂主打 HDI（AI 算力及高阶智驾 HDI 工厂），目前已进入试产阶段，目 标 10 月份全面投产。 新扩产计划一方面源于大客户订单需求，另一方面公司在交换机领域产品能力及客户开拓取得长足 进展，主流 ODM 厂商需求逐步释放。 公司已提前与设备供应商锁定产能和设备交付，包括钻机、压机、电路线、曝光机等关键瓶颈设 备，项目产能将快速释放。 5.高速光模块与 MSPC 业务 公司已批量交付 800G 和 1.6T 光模块 PCB，与多家全球领先客户建立稳固战略合作伙伴关系。 公司自 2023 年起与客户接触并提前布局 MSPC 产线，在珠海 SLP 工厂安装第一条 M 线；去年底 意识到产能可能产生巨大瓶颈后优先决定增加产线。 过去几个月平均约一个半月新增一条线，从今年 3-4 月至今已具备四条线生产能力，第四条线一两 个礼拜内装好，10 月份第五条线基本装好，预计 11 月份具备五条线生产能力。 月产出有效产出（非产能）可达 200 万只以上，在 800G 光模块为主力生产交付状态下，综合良率 超过 85%，为业内最高水平之一，且仍在持续提升。 一季度和二季度初存在物料准备度问题，目前已基本解决，关键物料均无重大问题，三条线已打 满；终端客户正在对包括国产 CCL、铜箔等不同材料进行验证，公司积极配合确保供应链安全。 6.交换机业务进展 国产客户如新浪、锐捷等，56G 产品去年已进入批量阶段，112G 产品去年年底认证通过，目前 56G 和 112G 均在批量交付中。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 近半年积极拓展海外主流 ODM 厂商交换机项目，国内外及台湾主流 ODM 厂商已陆续进入其 AVL （合格供应商名录），部分项目已在进行打样。 有个别客户已提出明年 3 月到二季度前需准备好相应产能的要求。 7.北美云厂商（CSP）客户拓展 公司对北美几家云厂商均有接触，进度各不相同，个别已进入打样和验证阶段，主要以验证下一代 产品的方式进行。 目标在 2028 年至少有两家云厂商成为不仅通过认证、而且有实际业绩交付的供应商。 8.原材料价格与毛利率展望 过去约十个月 PCB 材料涨价是主旋律，对一季度业绩造成较大困扰；5-6 月份公司与客户沟通取得 较大进展，材料顺价效果较好，客户基本接受。 公司坚持从今年年初以来材料涨价部分全部向下游客户传导，目前价格已不再是讨论话题，焦点集 中在供应保障上。 全年传统产品毛利率水平目标不低于去年水平；三季度和四季度传导力度将不低于二季度，同时将 一季度及二季度前期未覆盖的成本叠加到后续季度中。 公司预计材料涨价趋势可能延续至明年乃至明年下半年，未感受到材料降价的迹象。 公司主要材料合作伙伴包括生益科技、台湾南亚塑胶、EMC、陡山（AI 材料）、上海南亚、华中等 主流高质量厂商。 9.技术储备与前沿研发 埋嵌陶瓷技术：公司在车载应用中已广泛应用埋铜、埋陶瓷等技术，积累了丰富经验，并积极拓展 其他器件埋嵌及加工工艺。 PTFE 材料：公司从 5G 天线到毫米波雷达等方面积累多年 PTFE 加工经验，在 AI 应用领域也在持 续跟进，跟进节奏和程度处于行业较前位置。 陶瓷基板：公司具备 DPC 到 AMB 等陶瓷基板技术，覆盖氮化铝、氮化硅、氧化铝等材料，AMB 和 DBC 已在汽车电子领域打开应用，同时持续投入 DPC、低温多层共烧等新技术研发。 公司研发费用绝对值与相对值均持续提升，对前沿材料与工艺保持高度重视。 10.海外布局与竞争策略 泰国工厂已进入试产阶段，定位与 AI 相关，属于技术含量较高的领域，将具备超高多层、高多层及 HDI 产品交付能力。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 公司认为中国大陆是全球 PCB 乃至电子产品技术的最优供应链，凭借强大的工程师资源、产能和供 应链资源，在很长一段时间内不可替代；内地产能和资源预计将领先海外 1-2 代甚至更多。 海外产能何时成为有效产出仍需时间，但公司会积极配合客户要求进行海外布局。 公司认为竞争优势的核心在于：拥有有效的高质量产能、深度理解客户技术痛点并提供解决方案、 以及拥有头部客户群；单纯扩产若为无效产能或良率低，反而会带来麻烦。 11.下半年展望与战略定位 今年下半年是公司从预期驱动转向业绩驱动的关键期，在 AI 算力需求持续释放、智能化加速演进的 结构性机遇中，公司已从传统 PCB 制造商向高端算力硬件核心供应商战略延伸。 下半年及未来两三年 PCB 行业处于涨价周期，公司已实现与客户共同承担上游材料价格压力，实时 进行价格传导，有利于供应链健康发展和毛利改善。 下半年是公司从传统 PCB 向高端高性能 PCB 转化的关键拐点，AI 服务器高性能 PCB 及高速网络通 信光模块 PCB 占比将逐渐提升，产品结构持续优化，业绩将逐季持续提升和改善。 问答整理 Q1：三季度算力业务（珠海金湾）的交付稼动率和订单有无具体指引？金湾新扩产是否有其 他算力客户的具体进展？ 答： 公司去年进入北美算力大客户供应链，完成工厂技改并开始当代产品验证打样，目前已取得客户新 平台产品大量料号。珠海两个工厂的高多层和高阶 HDI 产品产能均已跑满。从客户交付计划看，6-7 月 开始备产，7-8 月大批量生产，预计 8-9 月开始滚动交货，四季度产能基本爆满，部分月份出货计划超 出原计划。从三季度开始出货将比上半年大幅提升，全年 AI 相关销售预计超过 30 亿元。新扩产方面， 去年公告的第三个工厂（主打 HDI，名为 AI 算力及高阶智驾 HDI 工厂）已进入试产阶段，目标 10 月 全面投产；金湾基地原有 SLP 工厂和 HLC 高多层工厂，第三个工厂为 Advanced HDI，主打 AI 计算 HDI 高阶厚板产品。同时公司在交换机领域产品能力和客户开拓取得长足进展，主流 ODM 厂商需求逐 步释放，催生了超高多层（UHC）工厂的扩产需求。公司已提前锁定设备产能和交付，项目将快速释 放产能。UHC 工厂目标平均层数做到 36 层或以上。 Q2：公司在 N 客户 HDI 产品方面，除网卡外，算力板等是否有进一步突破性进展？ 答： 客户的 HDI 产品目前已在公司产线上运行，当前主要受限于产能。公司正重点加快 HDI 产能释 放，高阶 HDI 工厂已在试运行，部分工序试运行中，计划 10 月份全面投产，以满足客户高阶 HDI 需 求。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Q3：四季度是否会在 AI 算力板方面形成大批量交付？ 答： 新工厂有一系列程序和流程要走，公司会尽可能去争取和加快，四季度有望形成较大批量的交付。 Q4：交换机市场目前客户进展如何？ 答： 国产客户如新浪、锐捷等，56G 产品去年已进入批量阶段，112G 产品去年年底认证通过，目前 56G 和 112G 均在批量交付。近半年公司积极拓展海外主流 ODM 厂商的交换机项目，国内外及台湾 主流 ODM 厂商已陆续进入 AVL，部分项目已在打样，有个别客户提出明年 3 月到二季度前需准备好 产能的要求。 Q5：北美 CSP 客户方面，四季度是否会有客户群体的突破？ 答： 云厂商客户相对复杂，除产能和技术要求外还有其他层面的要求。公司对北美几家云厂商均有接 触，进度各不相同，个别已进入打样和验证阶段，主要以下一代产品方式验证。目标是在 2028 年至少 有两家云厂商成为不仅通过认证、而且有实际业绩交付的供应商。 Q6：AI 算力领域材料变化（PTFE、陶瓷材料、马酒 Q 布等）的应用前景和进展如何？ 答： 这些材料都具备应用可能性，公司作为前沿深度参与厂商都在积极跟进和配合。但具体在什么时 间、什么平台、什么情况下使用，目前没有明确结论，涉及客户具体产品方案不便多做讨论。公司在材 料发展趋势上追求高速、低损等前沿方向，但具体落地时间节点和平台仍有大量工作要做。 Q7：光模块 MSPC 目前的量、良率情况如何？MSPC 工艺在 AI 其他领域能否普遍应用？ 答： 公司从 2023 年开始与客户接触，提前在珠海 SLP 工厂安装第一条 M 线，当时金湾基地整体亏 损、压力很大的情况下仍坚持技术升级。经过多年布局和沉淀，积累了大量经验。去年底意识到光模块 MSPC 产能可能产生巨大瓶颈时，优先决定增加产线。过去几个月平均一个半月新增一条线，从今年 3-4 月至今已具备四条线生产能力，第四条线一两个礼拜内装好，10 月份第五条线基本装好，预计 11 月份具备五条线生产能力。月产出有效产出可达 200 万只以上，在 800G 光模块为主力生产交付状态 下，良率超过 85%，爬坡速度非常快。物料方面，一季度和二季度初存在准备度问题，目前已基本解 决，关键物料无重大问题，三条线已打满。终端客户正在对包括国产材料在内的不同材料进行验证，从 CCL 到铜箔都在配合推进。 Q8：如何看待后续 MSPC 竞争格局？ 答： 从长远发展方向看，MSPC 工艺技术在光模块从 800G 到 1.6T 再到未来 2.4T、3.2T、NPO 等演 进路径中是跑不掉的，将充当非常重要的角色。目前整体仍供不应求，短期内难以解决，且设备交付周 期很长，现在才想切入该领域压力很大。该产品门槛不低，公司在 24-25 年 MSPC 未出现巨大瓶颈时 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 就开始产品验证，交了很多学费。未来 MSPC 竞争格局将相对集中，拥有头部客户至关重要，头部客 户引领市场和技术发展方向，只要在头部客户核心供应商群体内，即使行情波动也基本能保持稳定。 Q9：NPO 明年放量节奏如何？MSPC 是否可理解为通往 CPO 甲板化的过渡环节，公司在 CPO 领域是否有卡位优势？ 答： NPO 方面公司团队正在积极与客户沟通新产品情况，但具体产品形态、设计及量产节奏尚在了解 过程中，不方便透露。公司当前最核心的任务是解决 800G 和 1.6T 产品的交付问题。CPO 涉及从芯片 到载板到 PCB、涵盖先进封装多个领域的变化，还有很多问题需要解决，具体以什么设计和技术落地尚 不确定。MSPC 技术储备确实重要，未来以什么形态呈现不好说，但 MSPC 是值得关注的方向，公司 正在过程中不断尝试。 Q10：AI 相关（MSPC、高多层、HDI）产品毛利率相比常规产品能增加多少？ 答： AI 和光模块产品的毛利率很大程度上取决于良率。得益于公司过去多年在金湾的沉淀和客户的信 任支持，公司这两个产品的良率进展速度很快，对标业界优秀水平没有落后，某些方面表现较好。从良 率和毛利情况看，公司已进入第一梯队。从量产产品交付情况看，客户对品质和交付给予高度认可，上 线良率在客户眼中处于第一梯队。 Q11：常规覆铜板原材料近期是否有降价？后续常规覆铜板价格趋势如何？ 答： 过去约十个月 PCB 材料涨价是相当大的主旋律，对一季度造成较大困扰。5-6 月份公司与客户沟 通取得较大进展，材料顺价效果较好，客户基本接受。公司目标是将材料成本上涨基本转移到下游。目 前面临的最大挑战不是价格而是供应保障。公司未感受到材料降价的迹象，可能有些材料降价说法并非 公司常用材料或属于其他领域。公司主要合作伙伴包括生益科技、台湾南亚塑胶、EMC、陡山、上海 南亚、华中等主流高质量厂商。公司预计材料涨价趋势可能延续至明年乃至明年下半年，下半年仍存在 价格上升的可能性。 Q12：目前珠海产能中可用于 AI 的比例有多少？下半年是否全部切给 AI？ 答： 公司每周与客户梳理产能和可接订单信息，不存在接了订单交不出来的情况。公司能做多少必定使 命必达，并通过良率提升和流程优化进一步增加产出。可用于 AI 生产的产线和相关产能均已核算给客 户，并给出可接单数量。去年获得客户验证后，公司投入超过 15.5 亿元人民币对产线进行优化和改 造，已调整完毕，接下来核心工作是新产能释放以承接订单。 Q13：MSPC 扩产设备是否已锁定关键长交期设备供应？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 答： 大部分设备已在去年下单，今年年初追加了一部分。10 月份能开出的产能均为去年已下单设备， UHC 工厂设备也基本安排完毕。个别工序存在追单情况，但主要瓶颈设备均已下单。公司已提前与设 备商锁定关键瓶颈设备产能，包括钻机、压机、电路线、曝光机等。 Q14：下半年传统 PCB 盈利能力提升节奏如何？何时能恢复到涨价前水平？ 答： 一季度承受较大压力，二季度毛利率明显恢复，很大程度上来源于向下游客户传导的效果。三季度 和四季度坚持以下原则：今年年初以来材料涨价部分全部向下游客户传导。目前客户已不再讨论价格问 题，焦点集中在供应上。全年传统产品毛利率水平目标不低于去年水平。根据对下半年材料行情的判 断，材料价格仍将保持高位，三季度和四季度传导力度将不低于二季度。同时会将一季度及二季度前期 的成本缺口叠加到后续季度中，确保全年毛利水平不低于去年。过程中会分客户、分产品、分领域有重 点地提出涨价诉求。 Q15：从刘总在美国与终端客户接触的经历看，如何展望 2028 年及更长期的项目投资需求？ 国内同行扩产凶猛，公司相对竞争优势在哪里？如何看待内卷？ 答： AI 对硬件需求只会越来越高、越来越难，PCB 能贡献的价值点和可做的事情非常多，客户需求非 常确定，较长一段时间都会供不应求。竞争优势方面，第一，是否有产能且是有效的高质量产能非常重 要；第二，如何深度与客户沟通、了解技术发展方向和痛点难点，从研发、技术、产品上帮客户解决问 题极其关键；第三，拥有头部客户群是必要门槛。竞争肯定要关注，但核心应盯着客户导入、技术能 力、产品对客户下一代产品的支持。公司多年积累的技术经验、材料技术和产品能力是打动客户的重要 优势。 Q16：中美地缘博弈下，海外客户提出供应链备份需求，公司如何平衡海外与大陆扩产节奏？ 答： 泰国工厂已进入试产阶段，定位与 AI 相关，属于技术含量较高的领域。中国大陆一定是全球 PCB 乃至很多电子产品技术的最优供应链，凭借强大的工程师资源、产能和供应链资源，在很长一段时间内 不可替代。内地产能和资源预计将领先海外 1-2 代甚至更多，海外何时成为有效产出还需要时间。公司 会积极配合客户要求进行海外布局，同时对内地供应链和产能的持续发展和领先有信心。 Q17：公司在埋嵌陶瓷 HDI、高多层 PTFE 材料、低轨卫星 PCB 等前沿技术和工艺方面有哪 些储备？ 答： 埋嵌类技术公司多年前就有储备，车载应用中已广泛应用埋铜、埋陶瓷等技术，积累了丰富经验， 并积极拓展其他器件埋嵌和加工工艺。PTFE 方面，公司从 5G 天线到毫米波雷达积累了多年加工经 验，在 AI 应用领域也在持续跟进，跟进节奏和程度处于行业较前位置。陶瓷方面，公司具备 DPC 到 AMB 等陶瓷基板技术，覆盖氮化铝、氮化硅、氧化铝等材料，AMB 和 DBC 已在汽车电子领域打开应 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 用，同时持续投入 DPC、低温多层共烧等新技术研发。公司研发费用绝对值与相对值均持续提升，对 前沿材料与工艺高度重视。 Q18：AI 算力基础设施全年订单指引 30 亿元，上半年完成度多少？HDI 和 HLC 占比如何？ 三季度和四季度交付节奏怎样？ 答： 上半年完成约四五个亿，主要以高多层为主，还有部分液冷短板产品。随着下半年客户当代产品批 量交付，出货将逐月提升，四季度单月出货量有望达到 8-10 亿元量级，业绩释放高峰预计出现在四季 度。 Q19：大客户订单滚动下单周期和可见性如何？是否有明年的订单规划？ 答： 细节不方便透露。客户新平台的生命周期和总量决定最终总量。公司在这些平台的主要板子上均通 过相关认证，会维护好现有产品表现和量，产能释放后积极拓展新项目平台。客户目前滚动下单，今年 内订单已基本明确，明年一季度左右陆续确定。具体数字和份额不适合分享。 Q20：一条 MSPC 产线从投放到达产 85%良率需要多长时间？ 答： 非常快，基本上个把月就能搞定。一开始单条线良率并不理想，但随着 5-6 月份二线、三线到四线 安装，三条线综合良率达到 85%。快速投产、快速上良率是公司长期竞争力的最大保证。 Q21：85%的良率是否是业内最高水平？还有提升空间吗？ 答： 85%是目前听到的业内最高水平。公司目标不止于此，还会继续努力提升。 Q22：光模块 MSPC 未来 1-2 个季度价格和毛利率趋势如何？ 答： 需要与客户整体状态沟通，过去确实有调整动作，客户也非常支持。毛利率提升一方面靠提升良 率，另一方面靠客户给予的激励。客户会给出一些指引，团队干劲很足，提前一个月交付客户给予的激 励会更大。 原文 景旺电子 20260823_原文 2026 年 08 月 24 日 发言人 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 大家好，欢迎参加景旺电子 2026 年半年度业绩交流会。在会议室前我们代为声明，未经本平台及主办 方书面授权许可，任何机构或个人不得以任何形式转发、翻版、复制、引用或发布本次会议全部或部分 内容，不得制作会议纪要对外发送。擅自制作会议纪要引起不当传播的，后果自负。 发言人 为保证会议流畅进行，目前所有线上投资者均处于静音状态，在主讲嘉宾发言结束后将留有提问时间。 下面介绍出席本次会议的领导，总裁刘总，财务总监孙总，董事会秘书黄总。接下来有请公司领导发 言。 发言人 好，各位尊敬的投资者还有分析师朋友们，大家下午好。我是景光电子的董秘黄田。我们今天很荣幸邀 请到公司总裁刘总，还有财务总监孙总，共同向大家汇报公司 2026 年度上半年的经营情况和未来的发 展计划。2020 年上半年，公司扎实推进各项经营部署，实现营业收入 86.1 亿元，同比增长 21.37%。 归母净利润 6.0 2 亿元，同比下降 7.38%。 发言人 其中受人民币升值的影响，汇兑损失 1 点二三亿元，上年同期实现汇兑收益 0.3 8 亿元。这一进一步就 是会对收益，对公司的净利润就影响了超过 1.5 亿元。单单的二季度我们公司实现营业收入 47.20 亿 元，同比环比增速均超过 20%。 发言人 规模净利润 3.6 9 亿元，同比增长 13.61%，环比增长 58.55%。我们对上半年的主营业务的情况进行 拆分。按产品结构的话，那个硬板跟原版的收入比重是 8 比 2。然后按下一个个领域来划分的话，报告 期内汽车电子的业务收入占比约 45%。 发言人 我们在汽车店多措并举的像降低原材料价格波动带来的影响，盈利能力已经在六月份实现了明显的修 复。另外一个是通信与数据中心基础设施业务的收入占比接近两成，在 AI 服务器高速多模块等高确定 性的高景气度的细分赛道多点实现了突破。然后 AI 服务器和数据中心领域，我们公司为全球的 AI 基础 设施领先企业的客户批量供应高性能的 PCD，应用场景和产品的覆盖度持续的拓宽。随着客户当代产 品陆续进入量产交付阶段，相关的产品订单快速增长金额。客户下半年的这个交货计划，预计上述的订 单将使公司现在 （来源：野村韩国科技巡回路演纪要17:03；07:56帖子）。\u003c/li>\n\u003cli>先进封装/半导体设备订单连续落地验证景气。骄成超声获武汉长江存储3D超扫复购订单（首台到复购不到一年），Q2合肥长鑫小批量订单已落地，全年DRAM客户订单保守预计10+台（来源：09:46骄成超声跟踪更新）。\u003c/li>\n\u003cli>AI算力交易出现剧烈分歧，业绩与股价背离。中际旭创Q2收入222.8亿元（同比+174.6%）、净利润79.2亿元（同比+228.2%），但当日跌7.72%、成交344.9亿元居全市场首位；A股与港股最拥挤的算力筹码集体坍缩，“买方与卖方同日遭质疑”（来源：国金通信07:46；HK_A_Recap_2026-08-24附件）。\u003c/li>\n\u003cli>美债利率与债务约束成为宏观最大变量。30Y美债创新高，市场定价“增长偏弱+通胀韧性”的滞涨担忧，贵金属与BTC定价非主权资产对冲叙事；美国债务总额突破40万亿美元，早于预期两年（来源：XlX策略周思考09:33）。\u003c/li>\n\u003cli>电子材料国产替代与消费电子创新共振。CCL向M8-M10升级带动球硅填充率从20%提升至40-50%；苹果首款折叠屏iPhone Ultra预计9月发布，美国市场首发，供应链迎来确定性增量（来源：广发建材新材料10:21；20260823市场逻辑精选附件）。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>存储/先进封装——长协共识+设备订单双验证\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：DRAM产能受晶圆厂建设周期及HBM产能挤占限制，2028年后年增速仍封顶在20%左右；长协履约率仅60%-70%仍有提升空间（野村韩国科技纪要17:03）。\u003c/li>\n\u003cli>今天出现的催化/验证：骄成超声长江存储复购订单+合肥长鑫小批量订单落地（09:46帖子）；SK海力士为下一代HBM引入包括英特尔EMIB在内的先进封装技术，计划最终迈入3D封装时代（15:36复盘笔记）；长存IPO获受理，加速半导体产业链共振（东北证券点评附件）。\u003c/li>\n\u003cli>来源：野村韩国科技纪要、09:46骄成超声、15:36复盘笔记、东北证券-半导体行业点评-260824。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>AI算力——资本开支高增与利润兑现的赛跑\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：买方（阿里资本开支同比增七成但利润未兑现，且需折价融资）与卖方（SK海力士CPO路线图指向光模块龙头地位）同日遭质疑，AI交易基本面遇考（HK_A_Recap_2026-08-24附件）。\u003c/li>\n\u003cli>今天出现的催化/验证：阿里2Q26 capex 676.78亿元，同比+75%，3年3800亿元capex符合预期（AIDC周度跟踪09:45）；阿里800亿港元股权配售落地，稀释可控且获超额认购（野村阿里巴巴17:04）。\u003c/li>\n\u003cli>来源：HK_A_Recap_2026-08-24、AIDC周度跟踪09:45、野村阿里巴巴17:04。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>美债/宏观——滞涨担忧与非主权资产对冲\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：权益和原油定价“增长偏弱+通胀韧性”，贵金属和BTC定价非主权资产对冲；债务约束从长期财政议题演变为短期交易风险（XlX策略周思考09:33）。\u003c/li>\n\u003cli>今天出现的催化/验证：伦敦金价格+5.18%至4602.66美元/盎司，SPDR黄金ETF周度持仓量+23.68吨；美债回购释放托底信号（天风金属黄金10:22）。\u003c/li>\n\u003cli>来源：XlX策略周思考09:33、天风金属黄金10:22。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>PCB/CCL/电子材料——AI材料量价齐升+苹果折叠屏催化\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：AI服务器/交换机推动PCB层数增加、球硅用量提升；CCL向M8-M10升级，球硅填充率从20%提升至40-50%（广发建材新材料10:21）。\u003c/li>\n\u003cli>今天出现的催化/验证：苹果折叠屏iPhone Ultra预计9月发布，供应链量价齐升，涉及景旺电子、沪电股份、深南电路、兴森科技、生益电子（20260823市场逻辑精选附件）；锂电铜箔涨价弹性大，HVLP已批量（市场逻辑精选附件：德福科技、诺德股份、铜冠铜箔等）。\u003c/li>\n\u003cli>来源：广发建材新材料10:21、20260823市场逻辑精选附件。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>光通信——高速产品迭代与业绩兑现\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：800G/1.6T带动TIA/Driver电芯片量价齐升；FRO+NPO/CPO双线推进（华鑫电子07:51；申万计算机优迅股份22:38）。\u003c/li>\n\u003cli>今天出现的催化/验证：优迅股份26H1收入2.97亿元（+24.7%）、归母净利润6018万元（+28.2%）；蘅东光2026H1营收18.05亿元（+76.75%）、归母净利润3.05亿元（+113.32%）；北美Semtech FY27-Q2财报将于8月25日盘后发布（22:38、10:19、07:51）。\u003c/li>\n\u003cli>来源：申万计算机22:38、蘅东光10:19、华鑫电子07:51。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>液冷/电源/AIDC——AI硬件从算力向配电散热扩散\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：高密度机柜互联需求爆发，高速线缆+电源互联+液冷全方位布局（胜蓝股份10:17）；北美缺电趋势下配电设备弹性大（金盘科技与思源电气交流附件）。\u003c/li>\n\u003cli>今天出现的催化/验证：飞荣达2026H1扣非利润同比+91.30%，AI服务器液冷加速放量（国信机械07:52）；金盘科技、思源电气中报后次日分别涨停/大涨11%（聊透北美AIDC弹性标的附件）。\u003c/li>\n\u003cli>来源：胜蓝股份10:17、国信机械07:52、聊透北美AIDC弹性标的-20260823附件。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>中际旭创等算力龙头放量下跌\u003c/strong>：中际旭创跌7.72%、天孚通信跌8.63%、新易盛跌6.79%、寒武纪跌6.37%；成交额最大八只个股中六只为光模块与芯片（HK_A_Recap_2026-08-24附件）。\u003c/li>\n\u003cli>\u003cstrong>存储设备订单标志性落地\u003c/strong>：长江存储3D超扫复购订单落地，合肥长鑫Q2小批量订单落地，全年DRAM客户订单保守预计10+台（09:46骄成超声）。\u003c/li>\n\u003cli>\u003cstrong>Anthropic ARR数据披露\u003c/strong>：7月底ARR约650亿美金（5月早期约470亿美金），Q2收入115亿美金、环比+143%；低于Yipit此前预计的800亿美金（建投AI互联网09:32）。\u003c/li>\n\u003cli>\u003cstrong>阿里配售落地\u003c/strong>：800亿港元股权配售落地，稀释可控且获超额认购（野村阿里巴巴17:04）。\u003c/li>\n\u003cli>\u003cstrong>商业航天里程碑\u003c/strong>：朱雀三号重复使用遥二火箭实现入轨及回收圆满成功，为我国首次实现入轨级运载火箭一子级着陆支腿方式回收（10:22商业航天新闻）。\u003c/li>\n\u003cli>\u003cstrong>美债/黄金异动\u003c/strong>：伦敦金+5.18%至4602.66美元/盎司，30Y美债新高，财政部释放维护长债流动性信号（
