ost:2026-08-25T19-35:79ce3c0f1682": {"id": "post:2026-08-25T19-35:79ce3c0f1682", "kind": "post", "title": "2026-08-25 19:35", "source_label": "帖子正文", "excerpt": "看好AIDC液冷的以下方向及公司： 1强兑现品种：一次侧冰轮环境（美资子公司身份好，一次侧业绩有望加速释放），光模块环节鼎通科技（对接安费诺、泰科，产业链份额领先，2Q26 cag", "content": "", "publish_time": "2026-08-25 19:35", "tags": ["文字观点"]}}, "source_details": {"post:2026-08-25T08-54:c28e0a37c00f": {"id": "post:2026-08-25T08-54:c28e0a37c00f", "kind": "post", "title": "2026-08-25 08:54", "source_label": "帖子正文", "excerpt": "TMTB EOD Wrap 收盘总结 下午好。纳斯达克 100 指数（QQQs）下跌 1%，费城半导体指数（SOX）下跌 3%，而互联网板块上涨 2%，表现尤为突出。", "content": "TMTB EOD Wrap 收盘总结 下午好。纳斯达克 100 指数（QQQs）下跌 1%，费城半导体指数（SOX）下跌 3%，而互联网板块上涨 2%，表现尤为突出。 关于半导体板块持续疲软的问题很多，其实也没那么多，毕竟现在是八月底。 目前还没有完美的答案，因为人工智能半导体的叙事依然不明朗。 以下是我们昨天在周报中对当前局势的界定： 好了，让我们梳理一下 AI 半导体领域的争论，现在每一个数据点的出现似乎都伴随着多空双方各自的解读。 Anthropic 的年度经常性收入（ARR）目标未达标，对比 OpenAI 的再次加速。 开源模型、Grok 和中国模型正在抢占份额并缩小前沿模型的护城河，对比推理市场总蛋糕的扩大。 Token 价格的崩盘，对比需求弹性。 Sam Altman 承认现实世界的应用速度可能远慢于能力的提升。 关于 Anthropic 是否有能力以约 2 万亿美元估值进行 IPO 的质疑。 存储芯片的二阶导数放缓，对比日益扩大的回购规模。 智能体（Agents）取代软件，对比软件仍是更便宜、更可靠的抽象层。 H100 价格下跌和 GPU 供应出现裂痕，对比日益庞大的开源模型仍需 GB200/NVL72 级别的系统。 英伟达（NVDA）的涨价被视为看涨的需求信号，对比其对日益依赖债务融资的生态系统造成的成本负担。 超大规模云厂商发行债券、信用利差扩大，以及日益花哨的 GPU 融资和残值担保方案。 新型云服务公司缩小与巨头的资金差距，对比其证明了必须依靠英伟达支持的融资才能让账面逻辑通顺。 Anthropic 的 IPO 供应进入市场，究竟是扩大了 AI 投资版图，还是仅仅抽走了现有赢家的流动性。 其 S‑1 文件和路演是会给投资者带来对前沿模型以及可行性的信心，还是让他们更近距离地看到模型层依然是多么昂贵且经济前景不明。 共和党和公众在中期选举前对数据中心建设的抵触情绪。 除此之外，还有利率、中期季节性因素、缓慢的去杠杆进程，以及终极问题：实验室 ARR、Token 增长和现实世界的应用，是否足以支撑 2028 年的资本支出曲线。 所以，情况非常明了。 投资者的情绪反映了这一切：多头对盘面深感沮丧，并日益怀疑 AI 基础设施这一交易是否还能回归。 而空头虽然感到备受鼓舞，但仍未有足够的信心宣告胜利。 我们目前不站在任何一方，但仍认为 5 月和 6 月那种垂直拉升的狂欢日子已一去不复返了。 那是一段特殊的时光，将永远留在科技投资者的记忆中，就像一段美好的夏日恋情，我们都在缓慢或是快速地意识到，它可能再也不会回来了。 市场情绪的恶化程度甚至超出了我们的预期，我们不禁感到心理低点正在临近。 尤其是考虑到 NVDA 财报、杰克逊霍尔年会、9 月的技术会议周期以及 Anthropic 的 S‑1 上市申请都在前方。 自 Leopold 低点以来，我们的基准预测一直是震荡上行。 虽然过去一周的感觉确实并非如此，但这正是实际发生的情况。 除了 HDD 之外，几乎所有的 AI 基础设施板块仍高于该低点，尽管包括 NXPI、TXN、CDNS 和 AVGO 在内的个别股票已跌破该水平。 因此，我们目前将坚持震荡上行的基准预测，对震荡部分的信心要充足得多，同时一如既往地保持开放心态。 在震荡的环境中，在区间低点买入是值得的，而我们现在正处于这个位置。 话虽如此，现在是 8 月下旬，流动性稀薄且叙事模糊。 我们并不急于进行任何大的交易，直到价格走势向我们证明它开始趋于稳定，同时投资者心中的叙事变得清晰。 我们最不想看到的就是继续被反复收割。#文字观点", "publish_time": "2026-08-25 08:54", "tags": ["文字观点"]}, "post:2026-08-25T10-24:17d5727142f9": {"id": "post:2026-08-25T10-24:17d5727142f9", "kind": "post", "title": "2026-08-25 10:24", "source_label": "帖子正文", "excerpt": "海外科技信息追踪-20260825 一是AI硬件出口管制开始向企业内部合规链条延伸。美国要求韩国企业加快在美建设存储工厂，并以韩国800万亿韩元国内半导体投资计划为参照施压", "content": "海外科技信息追踪-20260825 一是AI硬件出口管制开始向企业内部合规链条延伸。美国要求韩国企业加快在美建设存储工厂，并以韩国800万亿韩元国内半导体投资计划为参照施压；中国台湾检方则首次起诉英伟达内部人员参与AI服务器走私，涉案团队通过虚构机房容量、规避现场核查和取得采购白名单购入130台B300服务器，其中74台已流向中国客户、56台被海关扣留，反映客户审核、经销商管理和最终用户核查正成为出口管制新的执法重点； 二是前沿模型公司的收入增长与旗舰模型变现能力出现分化。Anthropic7月年化经常性收入由5月的470亿美元增至650亿美元，并首次实现季度调整后经营利润，但最高价Fable5仅占企业模型支出约11%，客户更多转向价格较低的Opus5；与此同时，英伟达拟通过投资Perplexity以及对Poolside进行技术授权、股权投资和人才招募，将竞争范围由算力硬件进一步延伸至开放模型和应用分发层； 三是消费级智能体开始进入产品上线和订阅定价阶段。Meta拟在未来数周推出可访问外部网站并自主生成工具的Hatch智能体，探索免费版和最高19.99美元的月度订阅，同时准备WhatsApp智能体接入平台及10月发布Watermelon模型；与之对应，企业安全需求正在从“使用AI提升检测效率”扩展至“保护AI智能体”，身份识别、行为意图、动态权限和执行过程可观察性可能形成新的安全采购层； 四是终端厂商和存储企业继续围绕AI需求强化自主芯片与既有产能。小米3纳米XringO3已进入量产，目标出货20万—30万颗，并已完成面向端侧大模型和自动驾驶的O100、D100芯片开发；三星西安和SK海力士大连NAND产线分别规划约4万—5万片和3万片月产能，产能稳定和项目完成节点主要落在2027年； 五是AI硬件竞争正由增加单颗芯片性能，转向存储层级、封装结构和系统软件的联合优化。HBM的硅面积、功耗和可靠性约束推动厂商将存储控制器及部分注意力计算移入基底芯片；高带宽闪存虽能以相近成本提供8—16倍容量，但机架级单位Token经济性仍较HBM低约6—8倍。英伟达首次公开展示CUDA运行于RISC-V，而AgentX测试显示，CUDA护城河更多来自新品发布时的软件成熟度、上游框架覆盖和持续优化速度，AMD在部分深度优化负载中仍可取得领先； 六是人工智能高频采用开始由工程岗位向法律、销售、招聘和医疗等知识工作扩散。a16z引用的企业样本中，Codex每周用户指数自2026年2月以来在法律岗位增长108倍，在销售和招聘岗位均增长41倍，在市场营销和医疗岗位分别增长26倍和24倍；相关数据基于特定企业样本和较低初始基数，不能直接等同于全行业采用率，但可作为智能体工作流向非科技部门渗透的前瞻信号。#文字观点", "publish_time": "2026-08-25 10:24", "tags": ["文字观点"]}, "post:2026-08-25T13-56:77d83958f721": {"id": "post:2026-08-25T13-56:77d83958f721", "kind": "post", "title": "2026-08-25 13:56", "source_label": "帖子正文", "excerpt": "【申万宏源电子】Groq 3 LPX全面投产、Vera获SpaceX采用，看好26H2 NV链业绩释放 20260825 #Groq3LPX全面投产。LPU产品线旨在为Vera Rubin补充传统GPU架构在低延迟Token生成方面的能力。", "content": "【申万宏源电子】Groq 3 LPX全面投产、Vera获SpaceX采用，看好26H2 NV链业绩释放 20260825 #Groq3LPX全面投产。LPU产品线旨在为Vera Rubin补充传统GPU架构在低延迟Token生成方面的能力。在Artificial Analysis测试中，搭载Gemma 4 31B模型、1M Token上下文时，Groq 3 LPX实现3400TPS，为该模型创下最高纪录。 Nebius成为首位部署Neocloud。 后续观察重点在于LPU与GPU联调实现预填充-解码ATTN+解码FFN/MoE分离部署，以及相比于类似方案Cerebras、SambaNova的竞争力。 #VeraRubinOberon进入爬坡期。 基于SemiAnalysis的AgentX工作负载、采用DeepSeek V4 Pro模型，Vera Rubin的TPS/MW达到GB300 NVL72的30X，Token成本下降35X。 #VeraCPU取得关键客户SpaceX。 SpaceXAI宣布将部署Vera CPU，用于下一代智能体AI应用。Vera独立销售管线，不仅将作为Rubin GPU的配套机头销售，还将作为独立CPU、配套CX-9用于存储节点和安全节点销售。英伟达此前指引FY27收入200亿美金，#关注本次季报是否上调。#供应链1）LPX单托盘内8个LPU通过PCB构成all-to-all dragonfly拓扑，C2C单通道速率112G Serdes，主板规格52L多层板、预计采用M9Q+M8(K2)。预计潜在供应商#胜宏、沪电、景旺、生益、台光。2）#鸿海/工业富联指引LPX与Vera机柜将于Q4放量。 3）液冷电源：#领益智造、比亚迪电子等。联系人 杨海晏/陈俊兆#文字观点", "publish_time": "2026-08-25 13:56", "tags": ["关注本次季报是否上调", "供应链", "胜宏、沪电、景旺、生益、台光", "鸿海", "工业富联", "领益智造、比亚迪电子等", "文字观点"]}, "attachment:files/0824脱水研报.pdf": {"id": "attachment:files/0824脱水研报.pdf", "kind": "attachment", "title": "0824脱水研报", "source_label": "其他", "excerpt": "16.85 267.00本该增产的季节供给却大幅缩减！安监高压下煤 炭年化减产规模或达 2.6亿吨， 9-10月旺季缺口或 进一步扩大", "content": "16.85 267.00本该增产的季节供给却大幅缩减！安监高压下煤 炭年化减产规模或达 2.6亿吨， 9-10月旺季缺口或 进一步扩大；板厂开启千亿扩产， AI PCB设备进 入通胀周期 ——0824 脱水研报 2026/08/24 19:56 今日内容： 1、本该增产的季节供给却大幅缩减！安监高压下煤炭年化减产规模或达 2.6亿吨， 9-10月旺季缺 口会进一步扩大 2、现有产能撑不住 2027增长，板厂开启千亿扩产， AI PCB设备进入通胀周期 3、7月价格再涨 4%，中国公司深度获益于全球供需失衡，变压器出口每月都保持 100%以上增长 4、从清洗液到抛光液，湿电子化学品是晶圆厂每天都要喝的水，它不只是耗材，更是 AI时代的 “隐形刚需 ” 【本文来自持牌证券机构，不代表平台观点，请独立判断和决策】 摘要： 1、煤炭： 长江证券量化测算了特大煤矿事故发生后本轮安全监管对于煤炭供给的约束，从统 计局口径来看，预计超产减量空间为 1.2亿吨；而从周度数据来测算，表内 +表外的年化减产 规模有望达到 2.6万吨。表外供给的出清，加上表内复产进度缓慢，预计在 9-10月旺季，煤炭 的供需缺口会进一步扩大，若叠加库存去化，煤价高点有望超越市场预期。关注潞安环能、 平煤股份、淮北矿业等。 2、PCB设备：德邦证券研报指出， AI PCB向高多层、高阶 HDI演进，单机价值量成倍增长。 全球主流 PCB板厂2026年扩产规划达 1012亿元， 2025年合计资本开支仅 225亿元，扩产重心 集中于 AI配套高端产能。预计 AI PCB设备25-27年需求 158、295、670亿元，拉动全球 PCB设 备需求 26、27年同比增速分别达 30%和64%。钻孔、电镀、曝光、检测四大核心设备有望量 价齐升。海外设备厂扩产意愿低，国产厂商有望把握扩产与国产替代双重窗口。关注大族数 控、芯碁微装、东威科技、日联科技、奕瑞科技等。 3、变压器： 美国变压器价格自 2021年以来累计涨超 80%，7月环比再涨 4%。需求端北美电网 750亿美元输电扩容叠加 AI数据中心并网需求，供给端海外龙头累计订单同比均超 50%、交期 拉到160周以上，供给短期无法放量。中国公司正深度获益这轮全球供需失衡， 1-7月变压器 出口330亿元、同比 +30%，大容量变压器对美出口连续数月近翻倍，出海黄金期有望进一步 拉长。关注思源电气、金盘科技、华明装备、神马电力、特锐德、特变电工、伊戈尔、白云 电器。 4、湿电子化学品： AI带动晶圆厂扩产，半导体材料市场重回上行通道， 2026年Q1全球硅片 出货量同比增长 13%，已是连续第 7个季度正增长。湿电子化学品除受益于扩产外，制程演进 让晶圆刻蚀次数从约 20次升至 160次，3D NAND 堆叠至 500余层时单位晶圆材料消耗达 32层 的3倍，用量与单价同步抬升。而日系欧美合计把持约 57%份额，商务部对日出口管制后，去 日化避险正推动国产厂商从边缘替代走向核心主供。标的：安集科技、鼎龙股份、兴福电子 等。 正文： 1、本该增产的季节供给却大幅缩减！安监高压下煤炭年化减产规模或达 2.6亿 吨，9-10月旺季缺口会进一步扩大   特大煤矿事故发生后，国内煤矿安监强度明显提升，国家应急管理部修改《煤矿重大事故隐 患判定标准》、山西省出台《山西省统筹煤炭行业发展和安全新规十七条》等，均印证政策 端对煤矿安全重视程度之深。同时 6/7 月全国原煤产量减量明显，表明安监影响已渐兑现至产 量端。 长江证券详细测算了安监下对于煤炭供给的影响， 短期来看，供给减量至少为亿吨级别，在 年内表内停产产能不复产的情况下，下半年供需格局预计延续偏紧。因此 9-10 月冬储 + 非电采 购旺季，低供给 + 冬储 & 非电需求有望使得煤炭供需缺口进一步扩大，若库存进一步去化至低 位，则后市煤价高点有望超市场预期。 1）月度数据：统计局口径或同比减产 4.7 亿吨，结构化超产减量空间或在 1.2 亿 吨 从统计局数据出发，同比来看， 6&7 月同比减量均值为 3899 万吨，则年化原煤口径同比减产 规模为 4.7 亿吨，占 2025 年全国原煤产量的 10% ；环比来看， 6&7 月环比减量均值为 2701 万 吨，则年化原煤口径环比减产规模为 3.2 亿吨，占 2025 年全国原煤产量的 7% 。 01 若安监限产严格执行，以 100% 为红陑测算全国各省可能存在的超产规模，则新疆和陕西合计 存在约 1.2 亿吨超产产量或面临减量，占 2025 年全国原煤产量的 2.4% 。 02   2）周度数据：测算动力煤 & 焦煤的表内 + 表外年化减产规模或达 2.6 亿吨 而以周度高频数据测算， 表内动力煤年化减产规模约 1.0 亿吨，占2025 年国内动力煤产量 2.6%；焦煤年化减产规模约 0.97 亿吨，占2025 年国内焦煤产量 20.1% 。 表外动力煤供给年化退出规模或为 0.4 亿吨，占2025 年国内动力煤产量 1.1% ；焦煤供给年化退 出规模或为 0.2 亿吨，占2025 年国内焦煤产量 4.2% 。 合计年化减产规模将达到 2.6 亿吨。 03 04   3、煤价高点可能超预期 在9-10月冬储 + 非电采购旺季，当前低供给 + 冬储 & 非电需求有望使得煤炭供需缺口进一步扩 大，若库存在旺季进一步去化至低位，则后市煤价高点有望超市场预期。 相关公司： a）弹性 + 量增攻守兼备： 兖矿能源 /昊华能源 /新集能源 /力量发展 b）补涨动力煤标的： 晋控煤业 /华阳股份 /山煤国际 c）焦煤标的： 潞安环能 /平煤股份 /淮北矿业 d）龙头稳健成长： 陕西煤业 /中国神华 (H+A)/电投能源 2、现有产能撑不住 2027 增长，板厂开启千亿扩产， AI PCB 设备进入通胀周期 AI PCB向高多层、高阶 HDI 升级，单机价值量成倍增长。德邦证券研报显示，主流 PCB 板厂 2026年扩产 1012 亿元， 2025 年合计资本开支仅 225 亿元，扩产集中 AI 配套高端产能。预计 AI PCB设备 25-27 年需求 158 、 295 、 670 亿元，拉动全球 PCB 设备 26/27 年同比增 30%/64% 。海 外扩产慢，国产厂商有望把握扩产与国产替代双重窗口。关注大族数控、芯碁微装、东威科 技、奕瑞科技等。 1）板厂 2026 扩产千亿， PCB 向高多层 /HDI 跃迁 伴随算力硬件快速迭代， PCB 正向高多层板、 HDI 板加速升级。 AI服务器对孔密度、线路精 度、信号完整性要求大幅提高， AI PCB 价值量正随算力升级同步抬升。   需求快速释放，板厂资本开支大幅扩张。从国内主流 PCB 上市公司扩产规划看，胜宏科技、 鹏鼎控股、沪电股份、深南电路等龙头 2025 年合计资本开支 225 亿元， 2026年已公布的扩产 投资规模约 1012 亿元，扩产重心投向 AI 配套高多层、高阶 HDI 高端产能。 05 2）AI PCB 设备需求两年近千亿，量价齐升 从需求端测算， AI PCB 设备未来两年需求合计约 966 亿元，对应设备规模逐年达 158 、 295 、 670亿元，全球 PCB 设备需求 26 、 27 年同比增速分别达 30% 和 64% 。 供给侧吃紧。 现有设备产能或不足以支撑 2027 年行业需求快速增长，核心 PCB 设备有望迎来 量价齐升。 钻孔、电镀、曝光、检测四大核心环节价值量占比合计约 80% ，受益最为突出。 06 3）核心设备价值量拆解，钻孔 / 电镀 / 曝光 / 检测四足鼎立 PCB生产工序较长，主要包括开料、内层线路、压合、钻孔、电镀、曝光、成型、检测等环 节。基于 AI PCB 设备未来两年约 966 亿元的新增需求，参考胜宏科技、方正科技披露的 PCB 建设项目，假设钻孔、电镀、曝光、检测设备 价值量占比分别为 35% 、 20% 、 15% 、 10% 。 07   分环节看： 钻孔是 AI PCB 设备中价值量最高的核心环节。 钻孔是 PCB 层间互连的前道关键工 序，主要用于加工通孔、盲孔、埋孔和微孔； AI PCB 层数提升、板厚增加、孔数量上升，直 接推升钻孔设备需求。 电镀是 PCB 层间导通和可靠性形成的关键工序； AI PCB 向高层数及高密度互连方向升级，对 电镀均匀性、可靠性和良率提出更高要求。 曝光领域，激光直接成像技术在成像解析度、对位精度、产品良率、自动化等方面较传统曝 光技术优势明显。 检测领域，高端 PCB 良率和可靠性要求提升，检测设备配置比例有望提升。 08 4）海外产能受限，国产设备加速替代 海外设备厂在 AI PCB 机遇面前产能受限且扩产意愿较低。 国内设备厂商在钻孔、电镀、曝 光、检测等核心设备领域已形成较强竞争能力，扩产速度较快，有望充分受益于本轮 AI PCB 扩产浪潮，把握国产替代窗口。 具体看几个核心环节的国产突破： 曝光领域， 芯碁微装以约 19% 的市占率位列全球第一，是全球最大的 PCB 直接成像设备制造 商；2025年全球 PCB LDI 设备市场 CR5 约 59.1% ，国产厂商已打破海外品牌垄断。 钻孔领域， 大族数控 形成机械钻孔与激光钻孔双路线布局，机械钻孔国内市占率超 50% 。 电镀领域， 东威科技 的三合一水平镀设备属于国内首创， VCP 垂直连续电镀国内市占率 50% 以上。   检测领域，日联科技、三英精密、奕瑞科技等国产厂商正加快突破，把握高端 X 射线检测设备 的国产替代窗口。 3、7月价格再涨 4% ，中国公司深度获益于全球供需失衡，变压器出口每月都保 持100%以上增长 2026年 7 月美国变压器价格指数环比再涨 4% ，全球高压电力设备供需紧张。北美电网 750 亿美 元输电扩容叠加 AI 数据中心需求，海外龙头累计订单同比最高 64% 、交期过 160 周，供给短期 无法放量。中国公司受益这轮供需失衡，大容量变压器对美出口连续数月近翻倍，出海黄金 期有望进一步拉长。关注思源电气、金盘科技、华明装备、神马电力、特锐德、特变电工、 伊戈尔、白云电器。 1）北美电网 750 亿美元扩容叠加 AI 数据中心，高压设备需求被双轮锁定 AI数据中心的电网需求是最大推动力， 7 月北美数据中心规划容量同比增长 90% ，空置率连续 3年维持在 1% 的低位。 北美电网投资与 AI 数据中心并网需求双轮驱动，高压设备的终端需求 始终维持高位。 09 2）海外龙头订单越积越高，交期拉到 160 周，供给短期无法放量 截至2026 年最新业绩期，晓星重工、日立能源、 GEVernova 的电网业务累计订单同比增速均 超过50% ，全部创出新高。高压设备交期也在拉长，北美市场电力及变电站变压器交付周期 已超过 160 周，约等于下单后要等三年多才能拿货。 供给端短期难以放量，累计订单持续新 高，供需失衡进一步加剧。 10 3）变压器价格再创新高，供需紧张压过铜价成为涨价主因 2026年 7 月美国变压器价格指数环比再涨 4% ，自 2021 年初以来累计涨幅已超过 80% ，供需紧 张是这轮涨价的主导因素。 海外龙头价格传导顺畅，西门子能源、 GEVernova 、日立能源的 电网业务利润率持续提升。 11   4）大容量变压器对美出口连续数月近翻倍，中国公司出海黄金期拉长 中国公司是这轮全球供需失衡的直接受益方。 2026年 1-7 月中国电力变压器出口约 330 亿元，同比增长 30% 以上，已连续近 5 年保持 30% 以上 增速。其中美国市场出口规模近 40 亿元、同比高增 50% 以上， 10MV A以上大容量变压器出口 增速更是逐月保持近 100% 以上增长。 沙特市场规模近 30 亿元、稳居第二。 12 近期一些电力设备出海的头部公司纷纷披露 2026 年中报。 从披露的订单情况来看，充分印证 行业景气度持续上行。 思源电气： 2026H1期末合同负债约 38.3 亿元，较年初增长 29% ；其中合同预收货款 32.3 亿 元，较年初增长 30%，主要系下游需求高企，尤其海外市场需求热度高，订单高增。海外收 入占比再度提升至 30% 左右，订单占比预计高于 30% 。 金盘科技： 2026H1公司在手订单超百亿元，达到 107 亿元，同比增长 42% ，创历史新高。其 中海外新签订单 42 亿元，同比高增 271% ，占比已达 56% ；海外在手订单 62 亿元，同比增长 123%。数据中心相关订单 39 亿元，同比增长 336% 。需求景气持续兑现，尤其海外市场需求 保持高速增长。 5）相关公司 北美链：思源电气、金盘科技、华明装备、神马电力 中东及北美链 ：特锐德、特变电工、伊戈尔、白云电器 4、从清洗液到抛光液，湿电子化学品是晶圆厂每天都要喝的水，它不只是耗 材，更是 AI 时代的 “ 隐形刚需 ” 开源证券研报指出， AI 把晶圆厂的机器都跑满了，全球半导体材料市场已经干到 732 亿美元， 硅片出货量连着 7 个季度往上涨。这里面最值得看的是湿电子化学品 —— 芯片越先进、工序越 多、用的化学品就越多，光伏和面板也在大量消耗。关键是日本和欧美占了高端市场的近六   成，现在 “ 去日化 ” 情绪起来，国内晶圆厂急着找国产替代， 安集科技 、鼎龙股份 、兴福电子 这 些公司正赶上好时候。 1）AI时代半导体材料市场迎来新一轮发展良机 AI带动先进计算 / 存储等行业需求释放，半导体制造端稼动率高企，扩产进入上行周期。半导 体材料作为行业最上游，在本轮成长周期中亦景气高企。全球半导体材料市场规模由 2023 年 的650亿美元增长至 2025 年的 732 亿美元，晶圆制造材料市场规模由 415 亿美元提升至 458 亿美 元，预计 2026 年进一步增至 489 亿美元。 13 2026年 Q1 全球硅片出货量同比增长 13% ，已经是连续第 7 个季度出货量同比增长。 开源证券 认为，随晶圆制造厂投片量持续上行，半导体材料行业有望持续受益。 14   2）湿电子化学品：多领域扩容叠加工艺升级，行业进入量价齐升的发展快车道 湿电子化学品按用途分为通用型和功能型；按场景分为集成电路、显示面板及光伏等，光伏 凭借庞大产能贡献主要需求量， 而集成电路占据约 70% 的全球市场规模，主因高等级产品对 纯度、洁净度和稳定性要求更为严格，具有更高价值量。 15 集成电路领域： 工艺升级带动单位材料消耗提高 + 产品高端化。除制造端扩产直接带动需求扩 容外，更关键的是，新增晶圆制造产能多集中于先进制程以及 3DNAND 等高端芯片领域，图 形化工艺步骤相应增加，进而带动配套的清洗、刻蚀、 CMP 等工艺环节，提高平均单位材料 消耗。同时产品高端化带动价格提升。 16   显示面板及光伏领域： 显示面板领域行业稼动率修复及下游需求回暖带动是湿电子化学品需 求稳步提升。光伏领域，虽然湿电子化学品纯度等指标要求较低，但由于光伏电池片出货量 大、工艺步骤重复性强，整体用量具备较强规模效应。 17 3）日系及欧美厂商把控核心品类， “ 去日化 ” 预期加速国产厂商破局 海外厂商占据高端环节： 日本及欧美企业在全球集成电路用湿电子化学品市场份额分别约为 27%和 30% 。日系材料集群优势明显：在高纯氟化物、超纯清洗材料、 CMP 材料等领域积累 深厚，光刻所需化学品及配套材料亦是其强势领域。 18 受地缘政治博弈影响，上游关键材料的供应链风险被推至前所未有的高度。 “ 去日化 ” 避险情绪 升温，或促使国内主流晶圆厂及封装厂大幅加快本土供应商的验证与提量进程。本土湿电子 化学品厂商加速迈入 “ 全面替代 ” 的黄金窗口期。 4）国产替代稳步推进，看好平台型厂商与细分领域龙头   国产替代正逐步由通用产品向高端材料深化，在当前关键窗口期，稳定供应能力或决定中期 市场份额。看好材料平台型厂商 + 细分领域领先玩家。 安集科技 ：CMP抛光液全球市占率约 13% ，功能性湿化学品加速放量； 鼎龙股份 ：半导体材料平台型公司，抛光液核心研磨粒子自主供应； 兴福电子 ：电子级磷酸国内市占率第一， G5 级硫酸、双氧水已量产； 上海新阳 ：电子级电镀材料龙头，集成电路材料销量同比增 45% ； 中巨芯 -U：电子级氢氟酸、硫酸、硝酸均达 G5 等级，批量供应 12 英寸先进制程； 翰博高新 ：参股芯东进收购韩国东进在华资产，切入功能型湿化学品； 新化股份 ：电子级异丙醇项目 2026 urce_label": "帖子正文", "excerpt": "jpm 首尔之旅纪要，认为三星回报计划不及预期 1. 股东回报政策成为核心议题• 投资者最关心的问题是自由现金流（FCF）回报的规模，以及回报意愿能否向美国同行看齐（即将超额现金的 100% 返还股东）• SK 海力士宣布将实施 40 万亿韩元规模的自家公司股票回购并注销，将股东回报比例从原来的 5", "content": "jpm 首尔之旅纪要，认为三星回报计划不及预期 1. 股东回报政策成为核心议题• 投资者最关心的问题是自由现金流（FCF）回报的规模，以及回报意愿能否向美国同行看齐（即将超额现金的 100% 返还股东）• SK 海力士宣布将实施 40 万亿韩元规模的自家公司股票回购并注销，将股东回报比例从原来的 50% 以下提升至 50% 以上，并表示将在第三季度业绩发布时进一步更新• 铠侠（Kioxia）暗示将在本会计年度内逐步启动分红，并可能在 9 月季度业绩发布会上公布具体方案。• 会议结束后，三星电子宣布 2024~2026 年间将实施 90~110 万亿韩元的股东回报（回购与分红的比例尚未确定），其中第三季度最高分红 30 万亿韩元，但市场普遍认为该方案略低于预期。• 关于美光的相关讨论较为有限，但预计其将维持现行的最低净利润比例回报政策。• 总体来看，三大存储厂商均确认了提升股东价值的意愿，预计未来 3~6 个月内还会有追加公告。 2. LTA（长期供货协议）——估值重估的核心主线• 从供应覆盖率来看，三星电子最高约达 70%，SK 海力士超过 50%，铠侠约为 2027~2028 年供应量的 50%，美光为 50~70%，各家水平大致相近。• 合同期限方面，三星和海力士最长可达 5 年，铠侠签至 2028 会计年度（2029~2030 年的延长已在讨论中），美光目前大多为 1 年以内的合同，但其目标是推动合同长期化。• 具体价格条款保密，但已确认加强了预付款条件、扩大了双向约束力等对供应商有利的条款。• LTA 或许会限制短期 ASP（平均售价）的上涨空间，但判断其将对缓解行业波动性、推动估值重估产生积极作用。• 存储供应商与设备厂商之间的 LTA 讨论也在增多，这被视为整个半导体生态系统趋于健康的信号。 3. 产品结构调整与供需展望• 对于 HBM 从 12 层（12-Hi）切换回 8 层（8-Hi）、以及 SOCAMM 单机容量下调等调整，存储厂商的一致解释是：这并非出于性能退化的考虑，而是源于供应不足。• 整体比特需求（TAM）展望没有太大变化，但在代理 AI（Agentic AI）的带动下，服务器 DRAM 的单机容量增速预计将从过去的 15~20% 加速至 30% 以上。• 在 NAND 领域，随着 HBM/DRAM 的成本负担加重，业界正积极讨论通过 eSSD 来承接 KV 缓存（KV-cache offloading）的需求。TLC NAND 仍被视为主力方案，但面向推理场景的新兴方案也在兴起，如 SLC NAND、超高速 IOPS 及 Z-NAND 等（初期主要针对边缘 AI）。• 具体的供需比率数字提及不多，但各方一致看好：与过去相比，本轮供应短缺周期将持续更长时间。• 美光预计，新兴 AI 应用相关的存储业务营收占比将从明年的一位数水平提升至 2028 年的两位数，其盈利能力预计与现有主力 DRAM 业务相当。 4. HBM 价格谈判——ASP 展望的上行风险• 三星电子被认为采取了相对激进的价格与份额策略，而 SK 海力士则更注重战略伙伴关系，采取较为平衡的方式。• 两家公司 2027 年 HBM ASP 谈判均已进入最后阶段，最终定价将综合考量供需状况、下一代 HBM 的成本结构及性能表现等多重因素。• 相对于当前市场的一致预期（假设 ASP 同比上涨 43%），谈判结果存在上行风险，若落地则可能带动 EPS 上修。• 美光预计，新兴 AI 应用相关的存储业务营收占比将从明年的一位数水平提升至 2028 年的两位数，其盈利能力预计与现有主力 DRAM 业务相当。#文字观点", "publish_time": "2026-08-25 10:27", "tags": ["文字观点"]}, "attachment:files/【风口研报·公司】AI算力倒逼热管理升级_公司通过收购切入芯片液冷与光模块液冷赛道_叠加自身海外布局和客户资源_有望加快切入核心供应链.pdf": {"id": "attachment:files/【风口研报·公司】AI算力倒逼热管理升级_公司通过收购切入芯片液冷与光模块液冷赛道_叠加自身海外布局和客户资源_有望加快切入核心供应链.pdf", "kind": "attachment", "title" 一步延伸至光互联环 节，光模块液冷Cage有望成为高速光模块升级中的重要增量方向。 三、收购东莞运宏切入液冷赛道，强势赋能打开AI业务边界 公司拟收购东莞运宏 $70\\%$ 股权，切入风冷和液冷散热核心部件及相关热管理产品领域。东莞运宏在水冷板、水冷块、 光模块散热器等产品上已有基础，并围绕高密鳞片、微流道、液冷结构设计、焊接及可靠性等环节形成技术积累。 达瑞有望通过产能投入、制造体系、品质管理、海外布局和客户资源赋能运宏，帮助其提升批量交付和大客户服务能力。 随着AI液冷从芯片向光模块等环节延伸，运宏有望借助达瑞平台快速切入AI液冷核心供应链。 产品广泛应用于量子和半导体领域，公司脱胎于中科院下属光机所，依托差异化技术路线构筑壁垒且应用边界持续拓展 ，长期成长空间广阔 上海光机所是国内最早、最大的激光专业所。它的转化路线很“精准”：不是铺摊子，而是把一项高端技术做成一只高 毛利单品。典型是频准激光——高端精准激光器，卡位“量子科技+半导体设备”两条最热赛道，毛利率近70%。 国投证券赵阳认为，频准激光专注于精准激光器研发生产，产品覆盖量子计算、量子精密测量、晶圆制造、晶圆量检测 及晶圆隐切等关键场景，看好量子半导体双轮驱动成长。 与传统工业激光器侧重高功率加工不同，公司核心能力在于对波长、线宽、噪声、功率、相位和脉冲等参数进行精准调 控，为量子科技、半导体及前沿科研提供高性能精准光源。 对标全球龙头TOPTICA，公司已布局宽波段单频激光、稳频、超快激光及光学频率梳等技术，持续向医疗激光、固体激 光等方向投入，其长期成长空间有望进一步向多元高端应用延伸。 赵阳指出，归母净利润由2023年的0.60亿元提升至2025年的1.59亿元，盈利规模持续扩大，且综合毛利率整体保持稳定 ，2023—25年分别为68.53%/67.78%/69.33%。 图5.频准激光归母净利润（百万元） 资料来源：频准激光招股说明书，国投证券证券研究所 第 2 页 / 共 3 页 一、量子科技快速演进，高性能激光需求持续提升 离子阱和中性原子等量子计算路线高度依赖激光完成冷却、囚禁、量子态初始化、量子门操控及读出。 随着量子比特数量提升，对多波长、高功率、低噪声及高频率稳定激光器的需求持续提升；量子精密测量则进一步对超 窄线宽和长期频率稳定性提出严苛要求。 公司已围绕Rb、Cs、Sr、Yb等典型原子体系布局多波长精准激光器，并向超稳激光及光学频率梳等系统级产品延伸，有 望受益于量子科技持续产业化。 二、半导体本土替代提速，工业应用打开成长空间 半导体制造持续向更先进制程演进，晶圆制造、检测量测及切割环节对光源的波长、稳定性、光束质量、噪声及可靠性 提出更高要求。 公司已推出稳频及扫频激光器用于高精度光学计量，266nm、313nm、355nm等紫外激光器用于晶圆量检测，并布局约 1100nm纳秒激光器用于晶圆隐切，精准激光技术正由前沿科研加速向高价值工业场景渗透。 表21：频准激光精密测量产品矩阵及晶圆制造激光器性能指标 产品 中心激光 功率 衰变 功率特性 标准激光模拟组激光器 性能指标 红外光(760nm~1000n m) >10mV \u003c15kHz \u003c15kHz 532nm级激光器 532nm >10mV/100mW C20kHz \u003c0.75MHz 633nm级激光器 633nm >10mV/100mW C20kHz \u003c0.75MHz 780nm级激光器 780nm >10mV/100mW/500m W C20kHz \u003c0.75MHz 1544nm级激光器 1544nm >10mV/100mW C2kHz \u003c0.75MHz 633nm级激光器 633nm >10mV/40mW \u003c300kHz \u003c0.75MHz 775nm级激光器 775nm >10mV/40mW \u003c400kHz \u003c0.75MHz 三、对标全球龙头，应用边界有望持续拓展 TOPTICA已将应用延伸至量子科技、空间、生命科学与医疗、半导体量测、光刻与微纳加工、太赫兹测试以及传感光谱 等多个领域，体现出精准激光底层技术较强的跨行业复用能力。 公司已布局宽波段单频激光、稳频、超快激光及光学频率梳等技术，并持续向医疗激光、固体激光等方向投入，对标海 外龙头，其长期成长空间有望由量子科技和半导体进一步向多元高端应用延伸。 第 3 页 / 共 3 页", "status": "extracted"}, "post:2026-08-25T07-29:11b1361751d4": {"id": "post:2026-08-25T07-29:11b1361751d4", "kind": "post", "title": "2026-08-25 07:29", "source_label": "帖子正文", "excerpt": "【长江电新】国轩高科2026年中报分析：股权投资收益可观，经营基本保持稳健 事件：国轩高科发布2026年中报，上半年实现收入277.76亿元，同比增长43.22%，归母净利润13.86亿元，同比增长278.05%，扣非净利润1.07亿元，同比增长46.71%。其中2026Q2实现收入160.67亿元", "content": "【长江电新】国轩高科2026年中报分析：股权投资收益可观，经营基本保持稳健 事件：国轩高科发布2026年中报，上半年实现收入277.76亿元，同比增长43.22%，归母净利润13.86亿元，同比增长278.05%，扣非净利润1.07亿元，同比增长46.71%。其中2026Q2实现收入160.67亿元，同比增长55.42%，归母净利润13.65亿元，同比增长413.15%，扣非净利润0.66亿元，同比增长13.48%。 1、就上半年经营财务数据看，公司动力电池系统收入225.97亿元，同比增长61.01%，毛利率为14.02%，同比下降0.22pct。储能电池系统收入36.89亿元，同比下降-19.14%，毛利率为19.50%，同比提升0.15pct。公司动力高增而储能有所下滑的原因是，公司储能大容量产能有限，且在商用车需求旺盛的背景下做了产线调整，随着公司后续产能释放，储能占比有望恢复。公司动储电池盈利能力基本稳定，上半年有部分产品原材料、出口退税传导之后，下半年有望逐步修复。输配电业务收入4.01亿元，同比增长62.67%，毛利率为17.30%，同比下降0.77pct；其他业务收入10.88亿元，同比增长97.71%，毛利率为34.56%，同比下降12.25pct。 2、其中就2026Q2来看，预计公司出货在37GWh左右，环比增长超30%，其中储能保持现有产能满产，动力环比高增显著。公司整体毛利率为15.3%，环比略有下降，预计与碳酸锂价格上涨、出口退税退坡有关，下半年将逐步传导修复。此外，公司公允价值变动损益12.91亿元，投资收益2.07亿元，其中铜冠铜箔的股权投资收益较大，赛力斯、奇瑞汽车等股权报告期内有所损失。此外，公司资产价值损失-2.58亿元，信用减值损失-1.06亿元，其他收益0.33亿元。 3、我们认为国轩高科后续的增长点还是在于客户结构的改善，包括国内B级车占比提升，海外越南、摩洛哥、斯洛伐克产能相继投产，海外客户订单和海外基地交付有望起量，半固态电池也在积极推进、有望配套落地。#文字观点", "publish_time": "2026-08-25 07:29", "tags": ["文字观点"]}, "post:2026-08-25T15-50:d5da92159732": {"id": "post:2026-08-25T15-50:d5da92159732", "kind": "post", "title": "2026-08-25 15:50", "source_label": "帖子正文", "excerpt": "8月25日复盘笔记：医药/医药商业/液冷/化工/农业/算力租赁/消费电子/人形机器人/芯片产业等一、重磅财经信息民营商业航天新突破卫星研制到发射全链条首次出口东南亚二、大盘表现沪指涨0.19%，深证成指跌0.35%，创业板指跌1%，科创50涨0.14%。沪深京三市成交额仅1.84万亿，较昨日缩量近2", "content": "8月25日复盘笔记：医药/医药商业/液冷/化工/农业/算力租赁/消费电子/人形机器人/芯片产业等一、重磅财经信息民营商业航天新突破卫星研制到发射全链条首次出口东南亚二、大盘表现沪指涨0.19%，深证成指跌0.35%，创业板指跌1%，科创50涨0.14%。沪深京三市成交额仅1.84万亿，较昨日缩量近2000亿。三、强势板块和个股分析备注：只列举部分涨停板医药①国家药监局召开局务（扩大）会议，会议要求，支持仿制药高质量发展，强化特殊人群用药保障，扩大高水平对外开放。 ②凯莱英、美迪西、益诺思等多家CXO上市公司披露2026年半年度报告。从业绩表现来看，企业营收普遍实现稳健增长，盈利水平持续修复，行业回暖趋势进一步明确。涨停板：凯莱英、华森制药、汉森制药、赛隆医药、海南海药、卫光生物其他强势股：西点药业、近岸蛋白、冀衡医药、新光药业、辰欣药业、泰格医药、九洲药业医药商业涨停板：人民同泰其他强势股：瑞康医药、大参林、鹭燕医药、开开实业液冷机构：全球AI算力芯片功耗加速突破风冷散热极限，数据中心向液冷架构演进，服务器液冷泵作为核心动力组件有望迎来放量周期。这一趋势不仅将重塑数据中心散热格局，更将催生一个千亿级的新兴市场 时握有铜、光、热、电四要素，拥有全栈解决方案，有望为提升公司竞争力。 3）消费电子：AI终端创新周期已启动，看好明年苹果大年 上半年消费电子营收1224.76亿元，同比+19.27%，毛利率10.25%。公司在半年报中明确判断：人工智能加速向终端侧渗透，消费电子产业正迎来由AI驱动的新一轮创新周期，AI手机、AI PC、AI眼镜、智能穿戴等新型终端不断拓展应用边界，产业竞争焦点由单一制造能力转向产品定义、技术整合和规模化交付能力。 通过ODM业务及研发团队整合，强化产品定义、系统开发和全流程制造能力，实现从产品概念、设计开发到规模量产的能力延伸；在精密制造基础上完善声、光、电、热、磁底层技术布局；并已与全球领先客户开展智能穿戴、AI端侧硬件、机器人等复杂度更高的产品开发。 我们判断，明年将是苹果的创新大年——新形态终端与端侧AI功能的集中落地，将同时抬升单机价值量与ODM/JDM份额 4）汽车电子：Leoni整合表现超预期，第三条增长曲线成型 上半年汽车电子营收323.91亿元，同比+274.10%，毛利率14.14%。\"持续深化Leoni整合工作，经营改善持续推进，整体经营表现超预期\"。通过双方在全球制造网络、客户资源、供应链体系及运营管理能力的协同，公司正围绕全球领先Tier 1目标完善连接器、线束、智能控制、智能底盘及动力系统布局，并结合Leoni全球资源为中国汽车品牌出海提供属地化配套。#文字观点", "publish_time": "2026-08-25 10:23", "tags": ["文字观点"]}, "post:2026-08-25T10-22:402fa977365a": {"id": "post:2026-08-25T10-22:402fa977365a", "kind": "post", "title": "2026-08-25 10:22", "source_label": "帖子正文", "excerpt": "【天风通信】 拓邦股份2026年半年报点评 事件：公司发布2026年半年报，26H1实现营收58.09亿元，同比增长5.57%，归母净利润1.11 亿元，同比下降64.14%；扣非净利润 1.11 亿元，同比下降 64.14%", "content": "【天风通信】 拓邦股份2026年半年报点评 事件：公司发布2026年半年报，26H1实现营收58.09亿元，同比增长5.57%，归母净利润1.11 亿元，同比下降64.14%；扣非净利润 1.11 亿元，同比下降 64.14%；剔除汇兑损益影响后，归母净利润同比下降14.95%，扣非净利润同比下降15.20%；26Q2收入31.64 亿元，环比增长约 19.66%；26Q2归母净利润和扣非净利润分别环比增长48.08%、46.67%，盈利质量持续修复。各业务来看#工具和家电26H1收入42.80亿元，同比下降1.62%。其中工具板块收入20.76亿元，同比增长0.25%；家电板块收入22.03亿元，同比下降3.32%。#汽车和高端装备26H1收入6.04亿元，同比增长11.09%。其中汽车板块收入3.23亿元，同比增长17.96%；工业与机器人板块收入2.65亿元，同比下降0.63%；AI数据中心板块收入0.16亿元，同比增长391.80%，公司在供电侧与全球数据中心关键基础设施领导者合作，发挥电源自主研发设计优势，提供 UPS 电源控制类产品，布局PDU、服务器CRPS电源等，也冷散热端，已为 AI 数据中心液冷系统室外侧冷源提供高精度、高可靠性的驱动与控制一体化部件，帮助客户高效稳定地产生并输送冷源至 CDU，公司 AI 数据中心服务器用电机已获供应商定点，将应用于液冷系统中的分区防漏阀门模块。#新能源26H1收入5.83亿元，同比增长21.02%，营收快速增长、市场份额加速提升。#自主智能业务26H1收入3.42亿元，同比增长约170.28%，已从技术培育期进入规模化发展阶段。公司发展自主智能业务，着眼的不是某一款产品或当期的收入规模，而是在稳固主业的同时培育新的增长来源。#盈利能力和各项费用来看26H1公司汇兑损益由上年同期的收益 0.46 亿元转为损失1.13亿元，对当期利润形成较大影响，公司整进行多项举措对冲汇率风险，整逐步生效；由于全球贸易环境复杂及原材料价格波动、新业务爬坡等因素，公司盈利阶段性承压，26H1毛利率19.69%，同比下降2.85个百分点。26H1公司期间费用管控成效显现：销售费用、管理费用、研发费用均实现同比下降，三费合计下降 6.39%。 🏅智能化大趋势下，公司未来有望长期持续成长，叠加组织优化、降本增效等举措，有望保持良好发展。同时随着公司新产品推出、加快海外市场拓展以及高价值量产品占比提升，未来公司盈利能力有望改善，建议关注。 📞天风通信团队 王奕红/陈汇丰/唐海清#文字观点", "publish_time": "2026-08-25 10:22", "tags": ["工具和家电", "汽车和高端装备", "新能源", "自主智能业务", "盈利能力和各项费用来看", "文字观点"]}, "post:2026-08-25T10-56:9b3b38c5c529": {"id": "post:2026-08-25T10-56:9b3b38c5c529", "kind": "post", "title": "2026-08-25 10:56", "source_label": "帖子正文", "excerpt": "⚡️#Nv战略投资Lancium⚡️#产业瓶颈的变化1️⃣战略目的在哪里？电网 →【Lancium：拿并网、建园区、微网储能】→【施耐德/维谛/台达：SST、Sidecar、800VDC灰区配电硬件】→【英伟达Kyber/Rubin整机柜GPU】 Lancium解决：能不能有电进来（资源层） 施耐德", "content": "⚡️#Nv战略投资Lancium⚡️#产业瓶颈的变化1️⃣战略目的在哪里？ 电网 →【Lancium：拿并网、建园区、微网储能】→【施耐德/维谛/台达：SST、Sidecar、800VDC灰区配电硬件】→【英伟达Kyber/Rubin整机柜GPU】 Lancium解决：能不能有电进来（资源层） 施耐德/维谛/台达解决：电怎么安全高效送给机柜（硬件设备层） 英伟达解决：机柜需要什么样的电力标准，消耗算力（芯片&架构标准层） 这次战略投资核心目的是锁定有电可用的算力园区落地载体，保证Rubin、Kyber整机柜有地方上电跑，#解决美国最大痛点：有钱买GPU但拿不到电网并网 2️⃣瓶颈变化怎么看？ 近期无论是白皮书2.0还是这次战略投资，答案都在指向产业瓶颈变化。过去瓶颈是HBM、CoWoS、抢GPU。现在瓶颈是电力底座❗️ 【1】外部瓶颈：电网并网资源（Lancium解决的稀缺资源） 【2】内部瓶颈：灰区电力架构升级（SST/800VDC） 3️⃣灰区投资机会怎么看？#【SST固态变压器】：终局方案，2026‑2027试点认证卡位窗口（施耐德、维谛、台达等） 建议关注：新风光（施耐德）、四方股份（维谛）、阳光电源、特锐德、中国西电等 #【液冷全套】（冷板、歧管、UQD快接头、CDU） ：Rubin强制标配（2026Q4起兑现订单） 建议关注：东阳光、川环科技、磁谷科技、英维克、申菱环境、鸿富瀚、金富科技、鼎通科技 ⚙️东财机械-陆陈炀、张艺蝶、蔡梦琦、杨云杰#文字观点", "publish_time": "2026-08-25 10:56", "tags": ["Nv战略投资Lancium", "产业瓶颈的变化", "【SST固态变压器】", "文字观点"]}, "post:2026-08-25T09-11:f89ac72b923b": {"id": "post:2026-08-25T09-11:f89ac72b923b", "kind": "post", "title": "2026-08-25 09:11", "source_label": "帖子正文", "excerpt": "【华西有色晏溶团队】美国财政部购债下的美元贬值交易，关注贵金属投资机会 本周贵金属加速上涨，交易主线由宏观数据进一步转向美债市场压力与美伊地缘风险。美债方面，10年期收益率由上周末4.68%升至4.74%，30年期收益率周中一度触及5.34%、创2007年以来新高，周末收于5.27%。", "content": "【华西有色晏溶团队】美国财政部购债下的美元贬值交易，关注贵金属投资机会 本周贵金属加速上涨，交易主线由宏观数据进一步转向美债市场压力与美伊地缘风险。美债方面，10年期收益率由上周末4.68%升至4.74%，30年期收益率周中一度触及5.34%、创2007年以来新高，周末收于5.27%。市场加速对美国财政赤字、债券供给和债务可持续性的担忧。财政部长贝森特推动财政部将9月9日至11月4日期间10至30年期债券的单次流动性支持回购规模由20亿美元提高至至少40亿美元，并表示必要时仍可扩大；消息一度推动长债收益率快速回落和美元走弱，但至周末收益率大部分收复跌幅，说明供给与财政风险定价尚未消退。地缘方面，特朗普表示美国与伊朗没有正在进行或已安排的谈判，并威胁制裁伊朗贸易伙伴，布伦特原油周末收于94.39美元/桶、全周上涨6.39%，WTI收于87.06美元/桶。油价上涨强化通胀黏性和高利率压力，但同时放大中东供应中断与避险需求。SPDR黄金ETF增持49.53万金衡盎司的正向作用压过利率压力，推动金价突破。 中长期看，本轮黄金牛市的核心并非单一降息交易，而是美元信用重估、美国财政约束、央行储备多元化与地缘风险共振。美国国债规模已突破40万亿美元，2026财年前10个月财政赤字达到1.8万亿美元；同期净利息支出升至9,630亿美元，同比增长14%，约占财政收入的21.5%，并超过同期7,630亿美元的国防支出，债务滚续与付息压力持续削弱市场对美国财政可持续性的信心。本周30年期美债收益率一度升至5.34%，创2007年以来新高，财政部长贝森特随后推动财政部将10至30年期美债单次回购规模由20亿美元提高至至少40亿美元。该操作并非量化宽松，但反映美国长债供给压力和市场流动性问题已经引起政策层关注，进一步强化黄金对主权信用和货币风险的对冲价值。地缘方面，美伊谈判停滞、特朗普表示双方没有正在进行或已安排的谈判，布伦特原油升至94美元/桶以上，叠加俄乌冲突仍未解决，避险需求与通胀风险同步上升。央行购金趋势亦延续，2026年二季度全球央行净购金289吨，创历史同期新高，表明降低美元资产集中度、提高黄金储备占比仍是长期方向。美元信用弱化、债务扩张、央行购金及地缘风险构成的中长期支撑并未改变。受益于金价上涨，黄金资源股盈利预期增强，目前黄金股估值处于较低水平，关注黄金股配置机会。受益标的：【赤峰黄金】、【山金国际】、【中金黄金】、【山东黄金】、【西部黄金】、【晓程科技】、【株冶集团】、【灵宝黄金】、【中国黄金国际】。 中长期看，白银与黄金共享美元信用重估、美国财政债务扩张、央行购金及地缘避险逻辑，同时兼具更高的工业需求弹性。政策层面，白银已被纳入美国2025年关键矿产清单，其在电气回路、电池、光伏及高端电子领域的重要性得到进一步确认，有利于提升市场对供应链安全和战略库存的关注。基本面方面，尽管光伏行业持续推进银浆减量和铜替代，2026年工业用银需求预计有所回落，但全球白银市场仍将连续第六年出现供需缺口，预计缺口约4,630万盎司，看好白银价格走势。当前白银板块处于回调筑底阶段，虽短期受美元走强、降息预期延后压制，但中长期仍具备布局价值。白银受益标的：【盛达资源】、【兴业银锡】。 ———————————— 欢迎联系华西有色团队及对口销售： 晏溶 陈宇文#文字观点", "publish_time": "2026-08-25 09:11", "tags": ["文字观点"]}, "post:2026-08-25T09-13:51945231722b": {"id": "post:2026-08-25T09-13:51945231722b", "kind": "post", "title": "2026-08-25 09:13", "source_label": "帖子正文", "excerpt": "【华泰宏观｜海外每日评论】 政策：地缘政治方面，美国财长贝森特宣布对伊朗的经济孤立计划，要求相关国家切断与德黑兰的商业往来；美国财政部制裁约60个与伊朗有关的个人和实体，并授权逐步终止部分涉及伊朗的交易。", "content": "【华泰宏观｜海外每日评论】 政策：地缘政治方面，美国财长贝森特宣布对伊朗的经济孤立计划，要求相关国家切断与德黑兰的商业往来；美国财政部制裁约60个与伊朗有关的个人和实体，并授权逐步终止部分涉及伊朗的交易。关税方面，特朗普威胁自明年起将加拿大汽车及零部件关税翻倍至50%。日本方面，前日本央行官员安达诚司表示，日本央行很可能在9月上调基准利率，并最快于明年1月再次加息。 股市：周一美股三大股指涨跌不一，标普、纳指分别下跌0.3%、0.8%，道指上涨0.3%。分行业看，金融与必需消费领涨，科技与能源领跌。 债市：周一美债收益率下行，2y、10y美债收益率分别下行1bp、4bp至4.23%、4.70%。市场预期联储 26 年剩余加息幅度为 23bp。 汇市：周一美元指数上涨0.2%，报99.0；欧元下跌0.1%，报1.17；日元贬值0.1%，报159.1。 商品市场：周一大宗商品涨跌互现。布伦特原油期货下跌2.7%，报91.9美元/桶；WTI原油期货下跌2.4%，报85.0美元/桶；黄金现货上涨1.1%，报4652.2美元/盎司；白银现货基本持平，报68.9美元/盎司；LME期铜上涨0.4%，报14273.0美元/吨。 今日关注：德国二季度GDP季调后环比终值（预估为0.2%，初值为0.2%）；德国8月Ifo企业信心指数（预估为87.2，前值为86.6）；美国里士满联储行长巴尔金讲话；美国6月FHFA房价指数环比（预估为0.2%，前值为0.3%）；美国8月里士满联储制造业指数（预估为7，前值为5）；美国7月新建住宅销量季调后折年率（预估为62万，前值为62.8万）；美国8月世界大型企业联合会消费者信心指数（预估为90.2，前值为90 atus": "extracted"}, "attachment:files/中金公司-A股策略：美债风波如何影响A股？-260823.pdf": {"id": "attachment:files/中金公司-A股策略：美债风波如何影响A股？-260823.pdf", "kind": "attachment", "title": "中金公司-A股策略：美债风波如何影响A股？-260823", "source_label": "中金公司", "excerpt": "A 股策略：美债风波如何影响 股策略：美债风波如何影响A 股？股？", "content": "A 股策略：美债风波如何影响 股策略：美债风波如何影响A 股？ 股？ 2026-08-23 近期，全球部分主要经济体长端国债收益率同步抬升引发市场关注。美国 30 年期国债收益率一度冲破 5.3% ，创 2007 年以 来新高， 10 年期美债利率数次突破 4.7% ；日本 10 年期国债收益率升至 2.93% ，创近 30 年新高，英国及法国 10 年期国债收益率 升至 2008 年以来高位，德国创 2011 年以来新高。 8 月 19 日，美国财政部宣布长期国债回购扩容 1 ，该举措虽有助于缓解长端市 场流动性压力，但并不能从根本上消除投资者对美国财政赤字与债务的担忧。公告当日， 10 年期和 30 年期美债收益率虽一度分 别下行约 6bp/10bp ，但随后两天再度反弹，同期黄金上涨，全球股市反应不一，美股近期略有波动但调整幅度有限。 美债利率上行对 A 股市场的影响主要体现为跨境资本流动和风险情绪传染从历史经验来看，长端美债收益率与 A 股表现之 间不存在显著稳定的相关关系。美债收益率下行， A 股未必上涨；美债收益率上行， A 股也未必下跌。判断美债利率对 A 股的影 响，需要识别利率上升背后的冲击来源，以及看冲击是否伴随美元走强与全球金融条件收紧，最后还是要回归我国自身基本面、 政策与产业趋势。 在无套利期限结构框架下，长端美债收益率可以近似拆分为未来短端利率预期与期限溢价，前者主要受美联储未来政策利 率路径预期影响，后者则是投资者持有长久期债券所要求的额外风险补偿，受债券供需，财政、通胀、利率等不确定性因素影 响。因此，同样是长端美债收益率上升，其背后的经济含义和对风险资产的影响可能不同。 美债利率上行对新兴市场股市的影响，我们认为主要有两个方面。一是跨境资本流动。美债利率上行可能会提高美元资产 相对吸引力，带来全球资金流向边际变化。二是风险情绪传染。美债利率上升可能推升全球投资者风险感知，从而推升权益风险 溢价，对股市估值形成压力。对 A 股而言，本币无风险贴现率更直接受到国内利率影响。当前中美利率周期仍存在错位，近期中 债长端利率并未随美债上升，因此美债利率对 A 股估值的影响，更大程度上需要关注其是否引发全球投资者风险偏好下降和权益 风险溢价上升。由于成长板块价值更多依赖远期盈利，其权益久期更长，对无风险利率和风险溢价上升均更为敏感，因此对估值 层面的影响可能会更明显。 之所以对利率冲击来源加以区分，关键在于其对上述两条机制的触发程度不同。当预期短端利率上升主要体现为美联储政 策利率路径上修时，通常更容易与美元走强和全球金融条件收紧共振，对新兴市场或同时形成跨境资金流动与风险偏好下降的双 重压力。相比之下，期限溢价抬升本身并不一定意味着美元流动性收紧，其对新兴市场的影响或更多取决于是否直接带动其自身 期限溢价上升或进一步影响全球风险感知。 值得注意的是，在上述传统机制之外， AI 可能正在长久期资产市场中形成双向反馈，成为风险传导的放大器。大规模 AI 资本开支提高资本需求，部分科技企业逐渐开始依赖债券融资，使长久期债券供给增加，推高全市场长端利率。反过来，更高的 实际利率又会进一步抬升 AI 企业融资成本。此前美债利率上升对成长股可能主要是估值压力，现在还会在实体层面直接影响 AI 企业融资。不过，如果 AI 资本开支最终能够兑现为更高的生产率和盈利，分子端的改善或足以抵消分母端估值压力。 历史复盘：短端利率预期主导美债利率抬升且美元走强时 A 股承压较显著；期限溢价主导美债利率抬升对 A 股影响不稳 定，更多取决于国内自身基本面与产业趋势 我们参照 Caballero 和 Upper （ 2023 ） 2 思路，识别 2000 年以来 10 年美债利 率 “ 快速且大幅上行 ” 的典型阶段，复盘期间 A 股表现。具体而言，事件起点和终点分别定义为前后 30 自然日内的局低点和高点， 同时要求整个上行阶段累计涨幅不低于 50bp ，平均上行速度不低于 6bp/ 周，且持续事件 30—180 天。进一步，依据 ACM 分解， 比较事件期内 “ 短端利率预期 ” 与 “ 期限溢价 ” 的变化幅度，前者更大归为短端利率预期主导，后者更大则归为期限溢价主导；在此 基础上，再根据同期美元指数涨跌方向将样本划分为四象限，比较不同利率驱动与美元环境下 A 股的表现差异。 样本显示，当美债利率上行主要由短端利率预期上修驱动，并同时伴随美元走强时， A 股表现可能相对偏弱。在这类情形 下，美国货币政策预期趋紧、美元升值与全球金融条件收紧更容易形成共振，影响也可能随着美债利率持续上行而逐步累积，成 长风格的相对弱势通常更加明显。相比之下，期限溢价主导的长端利率上行对 A 股并未表现出稳定的负面影响。即使同期伴随美 元上涨， A 股整体压力也未必显著；若美元同期走弱，市场后续修复可能更明显。当国内产业景气度和盈利趋势足够强时，分子 端改善可以抵消分母端的不利冲击。如 2025 年 4 月 “ 对等关税 ” 期间，期限溢价主导美债利率上行约 60bp ，同期美元贬值； 4 月 中旬以后，随着关税预期缓和、国内政策托底以及 DeepSeek 科技叙事重新强化，中国资产快速修复。 2026 年 2 月底到 5 月中 旬，美债利率累计上行 72.9bp ，美元指数上涨约 1.7% ，但随着地缘风险阶段性缓和、 AI Agent 取得突破，盈利预期与风险溢价 均出现了明显改善， A 股成长风格尤其是科技板块表现活跃。 后市展望 7 月以来，美债长端利率的抬升主要由期限溢价上行推动，其背后既反映了对美国财政赤字与债务可持续性的长期担忧， 仅供内部参考，请勿外传！ 也与近期长久期 AI 债券供给增加、通胀与政策不确定性上升等因素有关。与此同时，美债短端利率回落，美元指数降至 98.8 ， SOFR-OIS 利差、交叉货币基差等指标也未显示出明显的美元流动性紧张。事实上，自 2 月底本轮美债利率上行以来，人 民币对美元总体升值，境内低利率环境延续，境外机构和个人持有境内人民币股票资产由 2 月底约 4.17 万亿元进一步增至 6 月底 约 4.66 万亿元，银行代客结售汇顺差也持续累积，跨境资金紧缩的传导并不突出。 从当前环境看，我们认为，历史上对 A 股相对不利的 “ 短端利率预期上修 + 美元走强 ” 组合持续出现的概率较低。一方面， 美国增长和通胀均呈降温迹象，高位长端利率本身也加大了实体经济和财政付息压力，并不支持货币紧缩，未来短端利率预期进 一步大幅上修的空间相对有限。另一方面，中金缪延亮博士在《 “ 去美元化 ” 结束了吗 ? 》中明确指出， “ 去美元化 ” 仍是大势所 趋。近期美国政府对日元汇率和长端利率的直接干预或进一步增加了市场对政策可预测性的担忧，侵蚀美元资产安全共识，削弱 美元信誉。因此，我们认为，本轮美债利率上行对 A 股调整的影响更多体现为短期外部风险情绪的传染和市场波动的放大，市场 方向选择最终仍要回到国内流动性、盈利周期和产业趋势。正如我们近期在《外部扰动引发短期调整，修复行情仍有望延续》中 指出，近期市场回调还受到海外 AI 负面叙事增多、美伊冲突反复、 A 股自身交易结构仍待修复、短期部分资金有获利了结压力 等因素共同影响。相较于美债利率本身，当前海外 AI 产业链负面叙事与全球科技资产共振所带来的风险情绪传导，可能是对 A 股更直接的外部扰动。 短期等待外围叙事好转、中报盈利兑现与 AI 产业新的催化， A 股修复行情有望延续。中金缪延亮博士在近期发布的《 “ 三 重约束 ” 下的市场方向》中认为，海外流动性方面，美国通胀下半年或进入下行通道，经济增长正在降温，并不支持货币紧缩， 市场可能高估加息风险。 AI 产业趋势方面，当前市场对于 AI 产业链的核心质疑主要是大模型创收与可持续变现能力不足以及持 续高企的算力成本对行业盈利水平形成显著压制，从量价角度来看，市场可能低估 AI 的需求增长以及模型和硬件性能提升，且 头部公司的杠杆仍低，产业趋势有望延续。国内方面，中报披露数据显示非金融企业盈利较好，经过近期市场调整， A 股部分领 域杠杆和拥挤度也有所下降。我们认为，随着市场风险偏好逐步修复，市场关注点或逐渐从外部扰动转向基本面验证，盈利兑现 能力较强、交易拥挤度较低的板块有望获得更多关注。 A 股周度市场回顾（ 2026 年 8 月 17 日至 8 月 21 日）市场表现：本周 A 股震荡调整，交投降温。上证指数微跌 0.6% ，偏大 盘蓝筹的沪深 300 跌 1.0% ，偏成长风格的创业板指和科创 50 分别 -2.2%/-3.7% ，中证红利收涨 1.8% 。成交层面，市场日均成交 额 2.27 万亿元，较上周继续小幅缩量约 855 亿元。行业层面，偏防御的石油石化、有色金属、银行板块领涨；传媒、计算机、综 合板块表现较弱。 近期关注以下进展： 1 ）中国 7 月经济 CP测试/封装测试全工艺，压力变送器+真空计获海内外订单，气体报警器导入中芯国际、法液空，洁净室+特气+厂务场景同步起量，2026H1新兴业务（含半导体）处于“0→1”确认收入节点。 2、A股定价仍按“传统仪表亏损股”给，认知差极大：2026中报营收4.63亿（同比-7.23%）、归母净利润-146万但同比减亏87.52%，Q2单季归母427万扭亏；传统主业阀门定位器/执行机构在化工、船舶、火电继续拿单，提供现金流底盘。 #当前市值30亿不到，距高凯发行市值61亿折价一半以上，而万讯半导体单价毛利率调研口径70%+，#且客户含美国头部半导体公司、北方华创、新凯莱、中芯、长存，送样面比高凯上市前更宽。#财报静默期结束+长存订单预期+高凯上市情绪映射，三者共振在即。 3、资产属性：不是纯题材，是“仪表平台型公司切半导体耗材”：万讯32年工业测控积淀（森纳士压力变送器年出货百万支、西斯特科氏流量计过NEL认证），半导体产线厂务端（洁净室压差、特气报警、真空测量）本来就是它的能力圈外延，不像从零创业的精密流体初创。MFC高端段仍要熬验证周期，但厂务/测试工装/成熟制程这一段是即时可变现的“卖铲人”生意。 胜率看：高凯上市带来板块锚定效应+中报减亏确认主业触底+半导体新兴业务首次单列收入，三面验证。 赔率看：国内精密流体控制部件及设备市场324亿（2030年530亿），MFC+压力/真空仪表+气体检测厂务配套可切百亿级；万讯若3年内半导体业务做到5亿+收入、70%+毛利对应主业利润弹性远超当前4.63亿传统盘，27亿市值对“高凯对标+一站式自主可控”的预期，#向上重估空间看3-5倍不止。#文字观点", "publish_time": "2026-08-25 10:36", "tags": ["向上重估空间看3-5倍不止", "文字观点"]}, "attachment:files/万联证券-医药生物行业快评报告：mRNA癌症疫苗重大突破，全产业链有望迎来价值重估-260824.pdf": {"id": "attachment:files/万联证券-医药生物行业快评报告：mRNA癌症疫苗重大突破，全产业链有望迎来价值重估-260824.pdf", "kind": "attachment", "title": "万联证券-医药生物行业快评报告：mRNA癌症疫苗重大突破，全产业链有望迎来价值重估-260824", "source_label": "万联证券", "excerpt": "AI 寻机 寻机11 ：玻璃基板： ：玻璃基板：AI 先进封装新材料 先进封装新材料 关注核心设备放量 关注核心设备放量 2026-08-22 投资建议 台积电、英特尔等头部厂商正加快推进玻璃基板在下一代先进封装中的导入验证： 2026 年 6 月台积电建成约 310×310mm 面板试点线，并联合揖斐电、群创的 CoWoS 玻璃基板三方验证；2026 年 ", "content": "AI 寻机 寻机11 ：玻璃基板： ：玻璃基板：AI 先进封装新材料 先进封装新材料 关注核心设备放量 关注核心设备放量 2026-08-22 投资建议 台积电、英特尔等头部厂商正加快推进玻璃基板在下一代先进封装中的导入验证： 2026 年 6 月台积电建成约 310×310mm 面板试点线，并联合揖斐电、群创的 CoWoS 玻璃基板三方验证； 2026 年 7 月英特尔与蓝思达成合作研发玻璃封装技术。我们认 为随着 AI 大芯片封装尺寸升级，玻璃基板有望成为下一代先进封装的重要材料平台，相关核心设备环节有望率先受益。 理由 玻璃基板正处于 “ 从 0 到 1” 阶段，核心场景为先进封装，成长潜力高。随着 AI 算力芯片向更大尺寸、更高密度演进，传统 CoWoS 路径面临成本高、翘曲控制难、大尺寸良率瓶颈等挑战，玻璃基板凭借低热膨胀系数、低介电常数等特性，可用于临时 载板、玻璃芯基板与玻璃中介层。全球头部厂商普遍在试点线建设、样品送样与客户验证阶段，我们预计 2027-2028 年为小批量 商用关键节点。同时，玻璃基板在 CPO 光电共封装、消费电子、通信等领域同步打开，成长空间广阔。 玻璃基板至 2030 年设备累计空间近 500 亿元，远期渗透率打开有望达千亿元。材料端，我们测算 2030 年用于玻璃中介层 的 CoPoS Panel 市场空间为 94 亿元，用于玻璃芯载板的玻璃母板市场空间为 415 亿元；设备端至 2030 年累计市场空间约 489 亿 元；我们认为随玻璃基板渗透率提升，远期设备空间有望达千亿元量级。 设备端建议关注两条核心投资路径： 1 ）重点关注核心增量环节： TGV 设备，在玻璃面板上高精度高密度通孔，相比 TSV ，工艺省略了绝缘层，并降低高速信号的损失； 2 ）建议关注针对玻璃特性与板级封装特性的改良设备中高价值量、高技术 壁垒与低国产化率设备：如 PVD 、电镀、曝光、检测等环节。其中， PVD 与电镀环节较为复杂，约占产线投资 40% ，电镀环节壁 垒高且易出现空芯包洞对基板良率影响较大，整体国产化率仍较低。 盈利预测与估值 保持公司盈利预测及目标价不变。 风险 产业化进度不及预期风险；下游需求不及预期风险。 仅供内部参考，请勿外传！", "status": "extracted"}, "post:2026-08-25T08-34:9aa6280a0bb8": {"id": "post:2026-08-25T08-34:9aa6280a0bb8", "kind": "post", "title": "2026-08-25 08:34", "source_label": "帖子正文", "excerpt": "#出处未知宁德时代41亿入股中恒电气母公司（中恒科技投资）核心逻辑 信息仅供参考，不构成投资建议 交易结构：增资母公司，持股49%，不拿控制权，实控人不变；穿透间接持有中恒电气约17.42%股权，派驻1名董事+1名副总深度参与经营。", "content": "#出处未知宁德时代41亿入股中恒电气母公司（中恒科技投资）核心逻辑 信息仅供参考，不构成投资建议 交易结构：增资母公司，持股49%，不拿控制权，实控人不变；穿透间接持有中恒电气约17.42%股权，派驻1名董事+1名副总深度参与经营。 本质不是财务炒股，是补齐算电协同全链条的关键短板。 一、业务互补：补齐算力机房内部电力转换这块最大短板 1.宁德时代原有能力：储能电芯、电池、时代天源PCS储能变流器，擅长电网侧、机房外部储能；但没有AI机房内部的供电设备，只能做机房外面，碰不到GPU机柜“最后一米”供电。 2.中恒电气独有价值 - HVDC高压直流（巴拿马电源）国内龙头，AI智算中心新一代供电方案，替代传统UPS，适配高功耗AI机柜，国内市占率第一，已经大规模进入头部智算中心 。 - 前瞻布局固态变压器SST，下一代算力中心核心供电器件，英伟达白皮书提及的下一代架构，还处在小批量阶段，是远期重要看点 。 - 还有电力数字化（中恒博瑞）、充换电电源业务。 👉组合效果：宁德做储电，中恒做机房内部送电，形成：绿电→储能PCS→HVDC高压直流→AI算力机柜完整闭环，打包对外输出算电协同整体解决方案。 二、三大明确协同方向（协议白纸黑字） 1.算力基础设施（最核心） 宁德时代储能系统+中恒HVDC/巴拿马电源，联合给智算中心做一体化供电总包。以前宁德只能卖电池，现在可以一整套交付给算力客户。 2.新能源充换电 协同拓展充电桩、储能电源业务。 3.新型电力系统（算电协同） 依托中恒博瑞，做算力集群柔性负荷调度、虚拟电厂，把AI数据中心变成电网可调负荷。 三、为什么选择入股母公司，而不是直接买上市公司股票？ 1.不用争夺上市公司控制权：原实控人保留51%，减少管理层动荡，避免整合风险，保留中恒原有团队技术能力。 2.治理层面深度介入：母公司层面持股49%，可以派驻董事、高管，深度主导战略、供应链协同；同时规避二级市场大额举牌、定增复杂监管流程。 3.利益深度绑定：部分出资用时代天源股权置换，互相持股，不是简单买卖股票，产业绑定更强 。 四、市场看重的两层故事 1.短期确定性：AI算力爆发，HVDC高压直流渗透率快速提升，中恒直接受益算力机房建设，宁德给它带来储能、算力客户资源。 2.远期期权：固态变压器SST，如果下一代数据中心大规模落地，会带来量级的业务增量，宁德提前卡位下一代供电技术。 五、核心风险 1.属于战略投资，业务协同落地需要时间，不是入股马上业绩爆发； 2.HVDC行业竞争加剧；固态变压器还没大规模商业化； 3.交易有高溢价，股价已经充分反映算电协同预期。 一句话总结： 宁德时代手里有电池储能，但进不去AI机房内部；中恒掌握算力机柜内部直流供电入口。这笔投资，买的就是算电协同里面算力侧供电的关键卡位。#文字观点", "publish_time": "2026-08-25 08:34", "tags": ["出处未知", "文字观点"]}, "attachment:files/【风口研报·公司】2026年煤炭供需紧平衡格局延续_这家公司具备_高储量_高分红_两大预期差_煤价中枢抬升驱动业绩恢复性增长_这家公司会议产.pdf": {"id": "attachment:files/【风口研报·公司】2026年煤炭供需紧平衡格局延续_这家公司具备_高储量_高分红_两大预期差_煤价中枢抬升驱动业绩恢复性增长_这家公司会议产.pdf", "kind": "attachment", "title": "【风口研报·公司 场一致预期低 6%。 •利润率小幅下降。 调整后营业利润同比增长 5%，低于 8%的收入增 速，对应的调整后营业利润率为 26%，同比下降 1个百分点。由于 继续支持商家并进行生态建设，销售营销费用为 297亿元，同比增 长9%，略快于收入。 市场预期可能发生的变化 •我们预计披露业绩后彭博盈利一致预期将上调。 预期股价反应 •我们预测公司股价将对其业绩做出正面反应。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 中国 证券研究 2026 年8月24日 姚橙 (86 21) 6106 6505 alex.yao@jpmorgan.com 表1: 拼多多业绩回顾 2Q26 百万元 , 年底截至 12月31日 实际 市场一致预期 % 差幅 净收入 112,358 115,196 -2% 毛利 64,341 63,917 1% 营业利润 (GAAP) 27,764 27,304 2% 营业利润 (非GAAP) 29,071 na 税前利润 (GAAP) 33,312 30,049 11% 净利润 (GAAP) 27,182 26,008 5% 净利润 (非GAAP) 28,489 28,023 2% 每ADS收益 (GAAP) 稀释后 (元) 18.45 17.17 7% 每ADS收益 (非GAAP) 稀释后 (元) 19.33 18.51 4% 利润率分析 (%) 毛利率 57.3% 55.5% 1.8% 营业利润率 (GAAP) 24.7% 23.7% 1.0% 营业利润率 (非GAAP) 25.9% 净利润率 (GAAP) 24.2% 22.6% 1.6% 净利润率 (非GAAP) 25.4% 24.3% 1.0% 资料来源：拼多多 2026年二季报、 Bloomberg Finance L.P. 预期（截至 2026年8月24日） 投资理据 我们预计拼多多在未来 3-6个月内不会跑赢大市，原因是我们认为不达预期的 2025 年4季度业绩以及新公布的 1000 亿元投资计划无法证明其可以提升投资者对公司未来几个季度收入 /盈利将恢复稳健的两位数增长的信心。我 们目前保守预测公司 2026 年的调整后每股收益将仅增长 8%，在财务业绩显示出更显著的增长或管理层改变对财 务前景的看法基调之前，这应会限制估值上调空间。我们维持 “中性”评级。 估值 我们截至 2026 年12月的目标价为 110美元，基于 10倍的 2026 年预期市盈率得出，与京东 /快手 8-10倍的估值区 间一致，原因是我们认为拼多多的透明度及财务能见度较低，抵消了其具竞争力的团队和业务模式的正面影响。 影响评级与目标价的风险 我们评级和目标价面临的主要下行风险包括：（ 1）由于增加投资，未来几个季度的利润降幅超过预期；（ 2）美 国/欧盟对所有中国产品征收高关税，破坏了 Temu 的增长趋势和扭亏为盈路径；（ 3）中国消费增长再次开始下滑 。 主要上行风险包括：（ 1）虽然管理层表态追加投资，但利润开始反弹；（ 2）美国宣布温和提升对华产品关税； （3）中国政府推出更有力的刺激政策。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 wUPBrQrPwOuM9PdNbRoMrRsQsMkPrRvNlOnPsP7NoMpPuOpOzRxNrNpO 中国 证券研究 2026 年8月24日 姚橙 (86 21) 6106 6505 alex.yao@jpmorgan.com 分析师声明 （简称 “AC” ）： 本报告首页所示姓名右上角带有 “AC” 标识的证券分析师声明（或者，若多名证券分析师共同对本 报告负责，则在首页或文本中出现的带有 “AC” 标识的分析师各自就本报告中该分析师所覆盖的每支证券或发行人而言，声明） ：（ 1） 本报告中表达的所有观点均准确反映了分析师个人对所提及证券或发行人的看法 ; 且（ 2）任何证券分析师的全部薪酬 ，无论在过去、现在还是将来均与证券分析师在本报告中所表达的具体建议或观点无直接或间接关系。对于首页所列的所有常 驻韩国的证券分析师，如适用，他们还根据韩国金融投资协会（ Korea Financial Investment Association ，简称 “KOFIA” ）的要求 ，确认他们的分析是基于真诚之原则，反映了他们个人的观点，没有受到不当的影响或干预。 除非另有说明，本报告的全体署名作者均为开展独立研究的证券分析师。就欧洲而言，行业专家（销售和交易人员）在本报告 中也可能会被列为联系人，但其并不是本报告的作者或研究部成员。 重要披露 • 做市商： 摩根大通证券有限公司（ J.P. Morgan Securities LLC ）是 拼多多或相关实体的证券的做市商。 .6T光模块产品，高速光模块产品组合涵盖VCSEL/EML、硅光、薄膜磷酸锂等技术解决方案；推出400G和800G ZR/ZR+相干光模块产品、以及基于LPO方案的400G/800G光模块产品。 公司持续跟进NPO产品研发，同步布局CPO、OCS等方向 在NPO方面，目前公司正和客户密切合作推进NPO相关业务，预计2027下半年开始商业起量，2028年出货量级将逐步提升。 在CPO方面，公司已参与CPO相关产品布局。 在OCS方面，目前公司已有充分布局，可以根据客户的定制化需求进行产品开发，预计市场明年下半年或者2028年将有批量供应需求。 风险提示：扩产进展不及预期的风险、物料供应情况改善不及预期的风险、CPO/NPO等产品商业化进度不及预期的风险等、市场竞争加剧的风险、宏观政策影响公司业务发展的风险。 资料来源：新易盛2026半年报，同花顺。 【重要提示】以上信息为公开资料整理，不涉及投资建议及研究观点，仅供参考，本公司不保证其准确性、完整性与时效性；市场有风险，投资需谨慎！#文字观点", "publish_time": "2026-08-25 09:23", "tags": ["文字观点"]}, "post:2026-08-25T08-29:5a0bc149b18c": {"id": "post:2026-08-25T08-29:5a0bc149b18c", "kind": "post", "title": "2026-08-25 08:29", "source_label": "帖子正文", "excerpt": "【ZX通信】立讯精密光通信再提速：物料充足+批量出货+自动化产线落地自动化制程加速，全面布局高端产品：根据公司财报，公司800G今年上半年实现量产出货，并于下半年#完成业内领先的自动化制程开发、验证和量产落地，同时围绕1.6T、2.4T、3.2T LRO、LPO，以及 XPO、NPO、CPO等下一代", "content": "【ZX通信】立讯精密光通信再提速：物料充足+批量出货+自动化产线落地自动化制程加速，全面布局高端产品：根据公司财报，公司800G今年上半年实现量产出货，并于下半年#完成业内领先的自动化制程开发、验证和量产落地，同时围绕1.6T、2.4T、3.2T LRO、LPO，以及 XPO、NPO、CPO等下一代技术方向进行前瞻布局，有望在#2026年下半年和明后年陆续实现自动化制程开发与量产落地。物料储备充足：此前我们提到公司加大备货光模块物料，#26年6月底公司预付款项为33亿（26Q1末仅17.5亿，公司预付款目前是所有光通信公司里最高的）、存货504亿（26Q1末仅460亿），主要系加大光模块上游光电芯片等采购，公司Q3的备货将进一步提升。北美核心客户即将出货：我们预计公司第一批北美大客户的#800G订单即将开始出货，预计第一阶段交付近百万只。预计后续开启1.6T的交付。26年业绩稳健增长，预计光、铜、液冷、电源四大AI领域的利润将于27年爆发：根据公司业绩预告，前三季度预计净利润约132.46亿元-143.98亿元，同比增长15.0%-25.0%。我们预计27年将显著体现AI的利润爆发。立讯将于9.9-9.11光博会期间#首次展示3.2TNPO光引擎动态演示，光博会期间的光通信小范围交流及光模块工厂参观可以联系我们报名（名额很有限，持仓机构优先）。持续看好立讯在光通信全自动化领域的绝对领先优势，看好公司在物料储备、批量出货、产线落地和高端产品研发的进展。公司的光、铜、液、电的综合AI能力正逐步得到验证，看好公司全面向AI硬件综合龙头转型！#文字观点", "publish_time": "2026-08-25 08:29", "tags": ["首次展示3", "2T", "文字观点"]}, "post:2026-08-25T09-14:bbda1c76f629": {"id": "post:2026-08-25T09-14:bbda1c76f629", "kind": "post", "title": "2026-08-25 09:14", "source_label": "帖子正文", "excerpt": "【天风机械】博众精工2026半年报：高增长兑现，多曲线共振 营收利润双高增：#2026H1营收32.36亿元(+72.44%)，归母净利润2.57亿元(+58.18%)，主要系新能源、半导体等新业务快速放量拉动 半导体/光通信成第二增长曲线：半导体营收2.2亿元同比+519.45%，#高精度共晶贴片", "content": "【天风机械】博众精工2026半年报：高增长兑现，多曲线共振 营收利润双高增：#2026H1营收32.36亿元(+72.44%)，归母净利润2.57亿元(+58.18%)，主要系新能源、半导体等新业务快速放量拉动 半导体/光通信成第二增长曲线：半导体营收2.2亿元同比+519.45%，#高精度共晶贴片机拿下全球头部光模块厂商400G/800G/1.6T批量订单并已批量供货，同步启动3.2T、CPO下一代设备研发；收购中南鸿思补齐耦合机能力，从单台设备升级为光模块封装整线解决方案商，具备单站到整厂交付能力 新能源订单饱满，未来1-2年基本盘扎实：#新能源在手订单48.25亿元同比+99.71%，换电站深度绑定宁德时代生态，接单交付规模持续走高；锂电设备注液机、PACK模组线持续出货，海外CE认证完成打开海外量产订单；收购上海沃典补强汽车电驱/电子自动化产线，拓展整车厂Tier1客户。 消费电子基本盘稳健：#柔性模块化产线、MR/VR、折叠屏、穿戴设备持续迭代，拓展vivo、小米、三星等非苹果客户降低单一客户依赖，工艺向前端零部件/模组组装检测延伸，导入AI视觉检测提升设备智能化水平。 算力+海外双布局打开长期空间：#依托汽车热管理技术迁移布局液冷板、液冷泵、控制阀，面向AI服务器/算力中心已启动客户验证导入；墨西哥工厂投产，泰国、波兰工厂推进，匹配下游客户全球化建厂趋势。#文字观点", "publish_time": "2026-08-25 09:14", "tags": ["文字观点"]}, "post:2026-08-25T10-18:af72f5e6f27b": {"id": "post:2026-08-25T10-18:af72f5e6f27b", "kind": "post", "title": "2026-08-25 10:18", "source_label": "帖子正文", "excerpt": "博众精工2026年中报点评1H26营收同比+72%，新能源/半导体加速放量☆业绩高增延续，费率优化显著，Q2盈利边际改善。2026H1公司营收32.36亿元（同比+72.44%），归母净利润2.57亿元（同比+58.18%），扣非净利润0.98亿元（同比+27.92%），利润增厚主要来自非经常性损益", "content": "博众精工2026年中报点评1H26营收同比+72%，新能源/半导体加速放量☆业绩高增延续，费率优化显著，Q2盈利边际改善。2026H1公司营收32.36亿元（同比+72.44%），归母净利润2.57亿元（同比+58.18%），扣非净利润0.98亿元（同比+27.92%），利润增厚主要来自非经常性损益。2026H1毛利率29.16%（同比-3.48pct）、净利率7.95%（同比-0.72pct），主要系高景气新业务结构占比提升；三项费用率同比大幅下行，规模效应持续释放。2026Q2营收17.55亿元（同比+54.04%），归母/扣非净利润2.29/1.14亿元，毛利率34.12%同比转正，盈利边际改善明显。H1经营现金流净额-5.90亿元，主要系业务扩张、前置备货付款所致。 ☆消费电子：行业短期承压，新业务储备充足。2026H1消费电子营收11.33亿元（同比-3.81%），占比35.01%。行业景气偏弱背景下，公司核心大客户结构稳定。柔性产线已实现手机全工艺量产，AR/MR、智能指环处于打样培育期，OPPO、荣耀设备稳步验证小批量出货，短期增量尚未完全释放。目前超五成项目完成标准化与AI升级，vivo柔性产线顺利交付，海外占比持续提升，后续增量有望逐步兑现。 ☆新能源：多业务共振高增，跃升第一大主业。2026H1新能源营收17.05亿元（同比+199.30%），占比52.68%，成为核心增长引擎。换电站累计交付超1900台，同步推进年产2000台以上产能建设；锂电注液设备批量交付、高端机型斩获海外订单，PACK产线落地海内外多基地；新能源仓储物流订单同比+130%+，新能源客户占比约90%。换电、锂电、仓储多线放量，驱动板块实现翻倍级增长。 ☆半导体&光模块：内生放量+外延并表，业绩跨越式突破。2026H1半导体营收2.22亿元（同比+519.45%），低基数叠加双线驱动高增。内生端，共晶/固晶机稳定配套400G/800G光模块，并向1.6T高端迭代，AOI检测设备完成头部封测厂验证落地；外延端，中南鸿思并表补齐耦合设备能力，切入CPO赛道，叠加上海栎智介质系统稳健增长，公司光通信与半导体整线方案能力全面成型。 ☆汽车自动化：高端客户持续突破，静待规模释放。板块维持存量稳健、增量突破态势，产品技术成熟、处于产能爬坡阶段。上半年成功切入舍弗勒、星驱等优质供应链，斩获电机、转子装配订单；上海沃典海内外项目顺利交付，海外业务占比持续提升，为后续规模化增长蓄力。 ☆投资观点：公司依托强精密制造与整线集成平台能力，持续获得全球头部客户严苛认证，技术跨赛道延展性持续验证。2026年上半年新能源、半导体高景气放量，成为核心成长驱动力；消费电子打底蓄力、汽车自动化持续突破，多赛道景气共振。公司规模效应持续显现、盈利能力边际修复，依托跨行业复用的精密制造能力有望持续拓展高景气新领域，我们看好公司发展前景。#文字观点", "publish_time": "2026-08-25 10:18", "tags": ["文字观点"]}, "post:2026-08-25T19-33:69e00ab1db17": {"id": "post:2026-08-25T19-33:69e00ab1db17", "kind": "post", "title": "2026-08-25 19:33", "source_label": "帖子正文", "excerpt": "周二舆情热度： ①泛AI-机构称，全球AI算力芯片功耗加速突破风冷散热极限，数据中心向液冷架构演进，服务器液冷泵作为核心动力组件有望迎来放量周期。", "content": "周二舆情热度： ①泛AI-机构称，全球AI算力芯片功耗加速突破风冷散热极限，数据中心向液冷架构演进，服务器液冷泵作为核心动力组件有望迎来放量周期。（ 金富科技、英维克、豪尔赛、康盛股份、特发信息等） ②医药-国家药监局会议要求，支持仿制药高质量发展，强化特殊人群用药保障，扩大高水平对外开放。（汉森制药、圣达生物、卫光生物、冀衡医药、华森制药、海南海药等） ③国产替代/自主可控-彭博：中国比原计划更早地决定让国有机构停止使用微软Windows操作系统；（诚迈科技、麒麟信安、中国软件、寒武纪等） ④农业-今年的厄尔尼诺现象将成为有现代气象记录以来最强的一次，可能加剧全球多地干旱、强降雨等极端天气，并对农业生产造成影响。（金健米业、万向德农、登海种业、红四方、六国化工、百傲化学等） ⑤泛消费-多部门联合印发《关于进一步做好财政金融协同促内需政策有关工作的通知》,将单人在同家银行累计年贴息上限提至5000元;（新华百货、骏成科技 、上海九百、恒尚节能 、 华天酒店、凯撒旅业等）#文字观点", "publish_time": "2026-08-25 19:33", "tags": ["文字观点"]}, "post:2026-08-25T17-10:565e1ba8e71c": {"id": "post:2026-08-25T17-10:565e1ba8e71c", "kind": "post", "title": "2026-08-25 17:10", "source_label": "帖子正文", "excerpt": "【西部计算机】AI4S有望带来AI的新叙事AI4S从“工具辅助”走向“全流程自主科研”。", "content": "【西部计算机】AI4S有望带来AI的新叙事AI4S从“工具辅助”走向“全流程自主科研”。intismeran的设计流程，是AI for Science赋能新药研发的最佳实践样本——从患者肿瘤样本DNA测序，到AI分析筛选新抗原、设计对应mRNA，最终实现“一人一药、量身定制”。AI4S已成为科研第五范式，在生物医药、材料能源等领域可大幅压缩研发周期、降低试错成本。AI4S打开了AI赋能物理世界与生命科学的全新维度。AI4S的市场空间不比AI Coding小。AI医药+AI新材料+AI其他学科至少万亿级美元的市场。标的： 算力：盛科通信、寒武纪、海光信息 AI4S：华兰股份、英矽智能 郑宏达 谢忱 李想 王朗#文字观点", "publish_time": "2026-08-25 17:10", "tags": ["文字观点"]}, "post:2026-08-25T10-16:c833c81fad13": {"id": "post:2026-08-25T10-16:c833c81fad13", "kind": "post", "title": "2026-08-25 10:16", "source_label": "帖子正文", "excerpt": "【松发股份】中报业绩高速增长，“老登”中的“战斗机”！", "content": "【松发股份】中报业绩高速增长，“老登”中的“战斗机”！船舶行业中最强阿尔法之一，持续力推！上半年公司实现营业收入235亿元，同比增长252%；归母净利润36.1 亿元，同比增长458%。 单二季度，公司归母净利润25亿元（年化净利润100亿元），同比增长540%，净利率提升至17%。相比【扬子江】2025年全年30%的净利率，公司发动机自制，净利率有进一步提升空间。 上半年公司新承接船舶订单207 艘，远超2025年全年115 艘承揽总量，一举刷新全球单体船厂接单规模与船型多元化双项纪录。订单结构同步优化，集装 （同比+90.98%），1.6T光模块Q2出货量较Q1明显增长，预计Q3/Q4起放量节奏进一步加快；但中际旭创业绩表现扎实仍遭抛售，光模块板块拥挤多头头寸集中了结。\u003c/li>\n\u003cli>机器人主线出现新催化：特斯拉官方回复Robot+Cybercab奇妙组合，未来可能形成Cybercab自动驾驶+终端Robot配送组合；T链量产加速、9月EDI产量上修，市场看好机器人行业拐点。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cp>\u003cstrong>主线一：AI算力/大模型——模型层竞争加剧，算力供给结构生变\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：Anthropic ARR目标未达标而OpenAI再次加速，大模型层竞争加剧；H100价格下跌和GPU供应出现裂痕，对比持续扩大的开源模型规模，市场强调GB200/NVL72级别系统仍为刚需。\u003c/li>\n\u003cli>今天出现的催化/验证：Anthropic 7月年化经常性收入增至650亿美元，但高价模型Fable5仅占企业模型支出约11%；Groq 3 LPX全面投产，LPU产品线为Vera Rubin补充低延迟Token生成能力；小米3纳米XringO3已进入量产，目标出货20万—30万颗；盘面上纳指100跌1%、费城半导体指数跌3%、互联网板块涨2%。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>主线二：半导体/先进封装——出口管制向企业合规链条延伸，存储成博弈焦点\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：AI硬件出口管制开始向企业内部合规链条延伸；AI硬件竞争由单颗芯片性能转向存储层级、封装结构和系统软件联合优化；HBM的硅面积、功耗和可靠性约束推动厂商将存储控制器及部分注意力计算移入基底芯片。\u003c/li>\n\u003cli>今天出现的催化/验证：美国要求韩国企业加快在美建设存储工厂，并以韩国800万亿韩元国内半导体投资计划为参照施压；SK海力士工会否决初步薪资协议；JPM首尔之旅纪要认为三星股东回报计划不及预期，SK海力士宣布实施40万亿韩元规模股票回购并注销；佰维存储受益于存储涨价周期，Q2盈利能力持续提升。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>主线三：光通信/CPO——高速光模块放量，1.6T周期临近\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：基于单波200G光器件的800G/1.6T光模块产品已落地，高速光模块产品组合涵盖VCSEL/EML、硅光、薄膜磷酸锂等技术路线；1.6T光模块Q2出货量较Q1明显增长。\u003c/li>\n\u003cli>今天出现的催化/验证：新易盛2026H1营收及净利润同比大幅增长；立讯精密800G今年上半年实现量产出货，下半年完成业内领先自动化制程开发、验证和量产落地，同时围绕1.6T、2.4T、3.2T LRO、LPO及XPO、NPO、CPO等下一代技术方向前瞻布局；中际旭创业绩扎实但股价遭抛售，光模块板块拥挤多头头寸集中了结。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>主线四：液冷/电源——AIDC供电架构升级，散热路径清晰\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：AIDC供电架构由12V向48/50/54V机架级方案及800V高压直流演进；DC-DC低压服务器模块电源已实现从三次电源到一次电源的规模化量产出货，并在布局面向未来两年高功率算力场景的高压、特高压电源方案；同时推进金刚石铜、微通道及CDU等先进散热产品，计划明后年陆续量产。\u003c/li>\n\u003cli>今天出现的催化/验证：立讯精密2026H1营收1745.04亿元（同比+40.16%），AI数据中心板块收入0.16亿元（同比+391.80%）；Nv战略投资Lancium，形成“电网→园区→微网储能→硬件→整机柜GPU”的资源层解决方案链条。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>主线五：宏观/策略——美债风波与美元贬值交易\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>今天强化的逻辑：本周贵金属加速上涨，交易主线由宏观数据转向美债市场压力与美伊地缘风险；1
