"", "publish_time": "2026-08-26 10:57", "tags": []}, "attachment:files/石英股份2026年半年度业绩说明会20260825.pdf": {"id": "attachment:files/石英股份2026年半年度业绩说明会20260825.pdf", "kind": "attachment", "title": "石英股份2026年半年度业绩说明会20260825", "source_label": "其他", "excerpt": "石英股份2026年半年度业绩说明会20260825 要点总结 1.2026年上半年业绩概况与Q2扣非下滑归因：半导体业务营收占比已达公司总营收一半，归母净利 润连续三期下滑，本期存货跌价和应收坏账计提均有扩大。", "content": "", "status": "extracted"}, "post:2026-08-26T13-34:d768f1cdfc9f": {"id": "post:2026-08-26T13-34:d768f1cdfc9f", "kind": "post", "title": "2026-08-26 13:34", "source_label": "帖子正文", "excerpt": "芯原股份： 新签订单合计151.42亿元，AI算力相关订单占比90%，数据处理领域占比89%。", "content": "", "publish_time": "2026-08-26 13:34", "tags": ["文字观点"]}, "post:2026-08-26T10-57:bc5494841a59": {"id": "post:2026-08-26T10-57:bc5494841a59", "kind": "post", "title": "2026-08-26 10:57", "source_label": "帖子正文", "excerpt": "【中泰电新】#液冷：进入订单与业绩兑现的强现实阶段，重视板块机会 #22日早，微软CEO社交平台发布：微软数据中心迎来#首批生产版Vera Rubin交付日。", "content": "", "publish_time": "2026-08-26 10:57", "tags": ["双鸿法说会指出ASIC", "文字观点"]}}, "source_details": {"post:2026-08-26T15-33:6f2a4b66201c": {"id": "post:2026-08-26T15-33:6f2a4b66201c", "kind": "post", "title": "2026-08-26 15:33", "source_label": "帖子正文", "excerpt": "【天风海外科技】NVDA FY2Q26 Preview 业绩数字大概率继续超预期，但本次的核心矛盾已不再是能否 beat，而是市场已经将 beat-and-raise 视为基准情形。因此，这次业绩本身大概率不会成为市场 AI beta 的主要驱动因素，关键仍在于管理层能否进一步抬高市场对中长期增长的", "content": "【天风海外科技】NVDA FY2Q26 Preview 业绩数字大概率继续超预期，但本次的核心矛盾已不再是能否 beat，而是市场已经将 beat-and-raise 视为基准情形。因此，这次业绩本身大概率不会成为市场 AI beta 的主要驱动因素，关键仍在于管理层能否进一步抬高市场对中长期增长的预期。 数字方面，买方预期可能已经接近：本季度收入 940亿–950 亿美元、下季度收入指引 1,070亿–1,100 亿美元，Non-GAAP 毛利率分别约为 75%和74.5%-75%。在此背景下，单纯的业绩超预期可能并不足够，市场更关注管理层能否凭借 Rubin 放量节奏和供应链可见度，继续上修 FY28 预期。 边际变化： Rubin 路线图进一步清晰，但 Kyber 商业化可能延后。Rubin 已于7月开始生产，Rubin Ultra 预计今年第四季度流片，并于2027年下半年落地。Ultra 可能包括双die和四die两个版本：前者继续采用 Oberon NVL72 机架，后者则搭配架构更复杂的 Kyber 机架。由于 Kyber 系统设计和落地难度较高，其商业化进度可能延后。因此，NVIDIA 可能先推出多 Oberon 机架方案，通过铜缆或光互连连接2、4或8个计算机架，形成包含144–576个 GPU 模组的统一算力池。 内存策略由“单卡堆容量”转向按工作负载配置。NVIDIA 的内存策略正从“为每颗 GPU 配置更多内存”，转向根据训练和推理工作负载重新分配内存资源。大模型训练更依赖内存带宽，因此在带宽充足的情况下，略低的内存容量仍可接受；长上下文推理则更依赖容量，因为 KV Cache 会占用大量内存。NVIDIA 的应对策略，是将 KV Cache 从昂贵的 HBM 中拆分出来，把上下文缓存放入独立存储机架，再以亚毫秒级延迟在存储系统与 GPU 之间搬运，从而降低长上下文应用对 HBM 容量的刚性需求。 需求依然强劲，但供给瓶颈正在重新定义。过去市场主要担心 GPU 芯片和 CoWoS 产能不足。随着 CoWoS 产能预期持续上修，以及 NVIDIA 提前锁定台积电等核心供应商的大量产能，供应瓶颈正逐步转向 HBM、光互连、电力和数据中心建设。换句话说，当前的问题已经不是“有没有 GPU 订单”，而是能否把 GPU、内存、网络、电力和数据中心基础设施同时组织起来，形成可按期交付的完整系统。 提价能否传导，将决定增长由“量增”还是“量价齐升”驱动。NVIDIA 提价约 15%，主要用于向客户传导内存等部件的成本上涨。按照通常逻辑，这意味着 NVIDIA 认为下游需求足够强，能够承受更高价格，对产业链景气度应当构成积极信号。但当前市场对提价能否顺利向下游传导仍有疑虑。因此，关键变化在于 NVIDIA 的增长能否从单纯的“量增”，进一步转向“量价齐升”。与此同时，公司的毛利率指引也可作为观察成本传导能力和产业链景气度的重要指标。 市场关注点从“AI 需求是否真实”转向“AI 需求由谁融资”。传统 CSP 的需求仍然稳健，但新增需求越来越多地来自 AI 实验室、neocloud、主权 AI 和企业客户。这些客户的算力需求增长速度普遍快于其资产负债表扩张速度，因此越来越依赖外部融资。NVIDIA 一方面直接投资 OpenAI、Anthropic、CoreWeave 等生态伙伴；另一方面引入华尔街资金，搭建第三方算力融资平台，并可能为部分数据中心项目提供约 25%的剩余价值担保或其他信用支持。这有助于释放新增需求，但也意味着市场需要重新评估 NVIDIA 在 AI 融资生态中的实际风险敞口。 重点跟踪： Rubin 在9月底至10月能够贡献多少收入、FY27 实际出货斜率如何，以及此前 Blackwell 与 Rubin 累计1万亿美元收入目标是否会被进一步量化； HBM4/HBM4E 的供应情况、内存容量调整是否属实，以及15%-20%的提价能否顺利落地； 中期 Non-GAAP 毛利率能否维持在73%-74%； NVIDIA 在 AI 融资、剩余价值担保、GPU 回购及表外承诺方面的实际风险敞口。 整体来看，本次业绩的关键不在于短期数字能否再次超预期，而在于 NVIDIA 能否证明：Rubin 可以按期放量，新增成本可以向下游传导，系统级供给瓶颈可以逐步解决，同时 AI 生态的融资扩张不会演变为不可控的资产负债表风险。 海外科技团队#文字观点", "publish_time": "2026-08-26 15:33", "tags": ["文字观点"]}, "post:2026-08-26T17-41:cc6cb40e9bb7": {"id": "post:2026-08-26T17-41:cc6cb40e9bb7", "kind": "post", "title": "2026-08-26 17:41", "source_label": "帖子正文", "excerpt": "📰独家：截至 7 月，DeepSeek 营收达 7000 万美元，较 2025 年增长十倍 ——《The Information》📝据两位知情人士透露，随着这家中国 AI 实验室全力推进其第二轮融资，DeepSeek 在今年前七个月实现了约 4.75 亿元人民币（7070 万美元）的营收，约为其 2", "content": "📰独家：截至 7 月，DeepSeek 营收达 7000 万美元，较 2025 年增长十倍 ——《The Information》📝据两位知情人士透露，随着这家中国 AI 实验室全力推进其第二轮融资，DeepSeek 在今年前七个月实现了约 4.75 亿元人民币（7070 万美元）的营收，约为其 2025 全年营收的十倍。 💸据上述两位知情人士补充，DeepSeek 在 1 月至 7 月期间录得净亏损约 7.15 亿元人民币，而 2025 年全年的亏损额为 9.35 亿元人民币。该公司目前正与现有及新投资者就新一轮融资进行持续磋商，目标是以 5000 亿元人民币的估值筹集 500 亿元人民币。 📌核心摘要 ✅截至 7 月，DeepSeek 的营收已达到 7070 万美元，较 2025 年增长了十倍。 ✅得益于高效的 AI 基础设施，其 API 访问的毛利率达到了 82.9%。 ✅公司正寻求第二轮 500 亿元人民币的融资，目标估值为 5000 亿元人民币。 📩DeepSeek 未立即回复通过电子邮件发出的置评请求。 📊尽管与 Anthropic 和 OpenAI 等美国 AI 模型开发商相比，DeepSeek 的营收规模仍然较小，但该公司已实现了健康的毛利率。这是因为其成功降低了模型运行成本，例如通过提高 AI 基础设施的效率，使 AI 系统能够使用更少的芯片来执行任务。 📈DeepSeek 前七个月的毛利率为 44.6%，而通过应用程序编程接口（API）销售模型访问权限的毛利率则高达 82.9%。相比之下，OpenAI 第一季度的营收为 57 亿美元，毛利率为 39%；而 Anthropic 第二季度的营收为 115 亿美元，并预计其毛利率将从 2025 年的 40% 增长至 2026 年的 63%。 🔍这些此前未被报道的营收及其他数据表明，公司在过去几个月里正加速发展。《The Information》上个月曾报道，DeepSeek 的年化收入已达到 4 亿至 5 亿美元之间。 🚀DeepSeek 的营收增长可能会为融资谈判以及未来的潜在首次公开募股（IPO）提供助力。该公司在 6 月份完成了首轮 500 亿元人民币的融资，并几乎立即启动了第二轮融资。目前，该公司已聘请投资银行协助筹备明年在上海上市。 🌐不断增长的营收凸显了 DeepSeek 开源 AI 模型正获得更广泛的采用。其旗舰 V4 系列，尤其是小尺寸的 V4‑Flash，因其低廉的成本和扎实的能力而受到全球开发者的青睐。 💱DeepSeek 近期已采取措施进一步增加收入。本月早些时候，该公司上调了 API 价格，以其旗舰模型 V4 Pro 为例，高峰时段每输出 100 万 token 的输出价格上涨至 3.96 美元，非高峰时段为 1.98 美元 —— 较目前 0.87 美元的价格大幅上涨。 ⚖️但即便在涨价之后，DeepSeek 的模型仍然比其他主流的中美模型便宜得多。月之暗面（Moonshot）的 Kimi K3 输出费用为 15 美元，而 Anthropic 的 Claude Opus 5 输出费用则高达 25 美元。 💵DeepSeek 的支出也在快速增长，尽管与美国实验室相比规模仍然较小。今年前七个月，DeepSeek 在 AI 基础设施相关费用上投入了约 110 亿元人民币，其中包括租赁配备 AI 芯片的服务器，或购买芯片及其他的计算设备。而在 2025 年，该公司此类支出仅为约 12 亿元人民币。#文字观点", "publish_time": "2026-08-26 17:41", "tags": ["文字观点"]}, "post:2026-08-26T23-03:826e8a1bf5bc": {"id": "post:2026-08-26T23-03:826e8a1bf5bc", "kind": "post", "title": "2026-08-26 23:03", "source_label": "帖子正文", "excerpt": "大摩——亚太科技——AI供应链：谷歌ASIC，设计服务蛋糕如何切分？1. 谷歌TPU v10三大技术趋势，催生多供应商分包格局 TPU v10（Icefish，1.4nm工艺）复杂度显著提升，不再由单一厂商独揽，而是采用“多模块分包”模式，核心呈现三大趋势： ◦ KGD（已知合格芯片）模式：谷歌自研", "content": "大摩——亚太科技——AI供应链：谷歌ASIC，设计服务蛋糕如何切分？ 1. 谷歌TPU v10三大技术趋势，催生多供应商分包格局 TPU v10（Icefish，1.4nm工艺）复杂度显著提升，不再由单一厂商独揽，而是采用“多模块分包”模式，核心呈现三大趋势： ◦ KGD（已知合格芯片）模式：谷歌自研计算Die并拥有光罩，仅将后端设计服务外包，联发科仍负责I/O Die设计及最终封装整合。 ◦ 3.5D封装普及：计算Die需堆叠在其他附属Die上，需要专业的3D IC IP厂商提供设计服务。 ◦ 光罩尺寸扩大：芯片光罩尺寸从当前的9个扩大至12个以上，预计继续采用英特尔EMIB-T封装技术。 在此架构下，Marvell仅获取计算Die周边的配套芯片（如存储控制器、NIC等）设计机会，AMD虽可能参与但并非核心计算Die供应商，博通（AVGO）与联发科的核心地位未被取代。 2. 联发科：TPU核心整合方，2029年相关营收上看700亿美元 联发科仍是TPU v10的主整合商，负责I/O Die设计及Intel EMIB-T封装集成。尽管不确认计算Die本身的收入，但受益于I/O Die尺寸增大，单颗TPU v10为联发科带来的营收确认（ASP）将高于TPU v9，预计达1.8万美元。摩根士丹利预测：2027/2028年联发科TPU相关营收分别为130-150亿美元和430-450亿美元；到2029年，随着TPU v9出货400万颗、TPU v10出货100万颗，相关总营收将达700亿美元，占联发科总营收比重显著上升。当前股价对应2028年预期PE仅12倍，建议逢低吸纳。 3. 创意电子（GUC）：谷歌CPU+微软AI芯片双轮驱动，目标价上调至6288新台币 GUC将显著受益于2026-2028年谷歌Axion CPU及微软Maia系列AI芯片的放量： ◦ 谷歌CPU：2026年受产能限制出货量略低于预期（120-130万颗），但2027年Axion2（300万颗）与Axion3（50万颗）合计贡献营收近28亿美元，且Axion3因计算Die翻倍导致ASP翻倍。 ◦ 微软及其他CSP：2027年来自微软的营收预计超2.5亿美元，Meta的MTIA 600项目也有望在2027年下半年贡献CoWoS产能。 基于此，摩根士丹利将GUC 2026-2028年EPS预测分别上调13%、11%、11%，目标价从5688新台币上调至6288新台币（对应2027年预期PE约45倍）。虽然Turnkey业务占比提升会拉低毛利率（从2026年的20.8%降至2028年的15.3%），但营收规模的爆发将驱动利润高速增长。 4. 世芯-KY（Alchip）：Trainium4带来80亿美元营收增量，目标价上调至5888新台币 AWS Trainium4将成为世芯2028年的最大增长极。供应链调研显示，2028年Trainium4出货量至少达250万颗，单颗ASP约1万美元，世芯作为Turnkey服务商获取约30%的份额，对应营收贡献达80亿美元（远高于此前预期的40亿美元）。 同时，Trainium3的毛利率表现优于预期，将从原先预测的“低双位数”提升至“高双位数”。摩根士丹利将世芯目标价从5088新台币上调至5888新台币，对应2028年预期PE仅10倍，并认为其有望赢得第二家CSP客户，进一步打开上行空间。 5. 2027年AI芯片供需全景：算力功耗与CoWoS产能瓶颈 ◦ 功耗瓶颈：假设2027年GPU/ASIC平均功耗为2kW，总装机量将消耗约38GW电力，电力供应成为全球性瓶颈。SpaceX计划将算力提升至10GW，对应约400万颗Rubin GPU，占台积电2027年AI加速器产能的20%。 ◦ CoWoS产能：2027年全球CoWoS总需求同比增长93%，其中AMD增速高达308%，GUC增速达329%。台积电仍占据主导地位，但Amkor等OSAT厂份额逐步提升。 ◦ HBM需求：2027年AI芯片HBM总需求达6077万GB，其中英伟达Rubin R200消耗174万GB，谷歌TPU v8i/v8t合计消耗191万GB。 6. 产品周期验证：Blackwell库存无忧，Rubin将于2026年底起量 当前Blackwell芯片的所谓“库存”实为供应链缓冲库存，将在2026年内完全消化，2026年下半年供应将足以满足NVL72机架需求。Rubin芯片将于2026年第三季度开始爬坡，第四季度启动机架出货，2027年总出货量预计接近700万颗（含Rubin Ultra），对应NVL72机架出货9万台。#文字观点", "publish_time": "2026-08-26 23:03", "tags": ["文字观点"]}, "attachment:files/海致科技集团（2706.HK）2026年中期业绩发布会20260825.pdf": {"id": "attachment:files/海致科技集团（2706.HK）2026年中期业绩发布会20260825.pdf", "kind": "attachment", "title": "海致科技集团（2706.HK）2026年中期业绩发布会20260825", "source_label": "其他", "excerpt": "海致科技集团（2706.HK）2026年中期业绩发布会 20260825 要点总结 1.2026年上半年财务核心数据：收入毛利双高增、亏损双收窄、资本结构质变 -营业收入人民币2.96亿元，同比增长70.4%；毛利1.32亿元，同比增长97.8%", "content": "海致科技集团（2706.HK）2026年中期业绩发布会 20260825 要点总结 1.2026年上半年财务核心数据：收入毛利双高增、亏损双收窄、资本结构质变 -营业收入人民币2.96亿元，同比增长70.4%；毛利1.32亿元，同比增长97.8%；净亏损7900万 元，较去年同期收窄38.1%；经调整净亏损1960万元，较去年同期收窄31.5% ，存在卡脖子问题；2026年上半年相关零部件已出现价格上涨，若下半年MATCH法案《硬件技术管制多边协调法", "content": "半导体设备零部件需求展望专家会议要点： 1. 半导体零部件供应整体现状与趋势 卡脖子品类与价格趋势：先进制程相关的涂层类、静电卡盘（E-chuck）、射频电源、真空类阀体等零部件当前国产化率较低，存在卡脖子问题；2026年上半年相关零部件已出现价格上涨，若下半年MATCH法案《硬件技术管制多边协调法案》落地，预计价格将进一步上涨、交期进一步拉长。 海外零部件厂商产能特点：海外厂商不会因为国内需求的短期波动扩大产能，因此供需紧张时零部件会出现交期拉长、价格递增的情况。 分制程零部件国产化率： 先进制程设备中，海外采购零部件价值占比约80%，国内自研/采购占比不足20%。 成熟制程设备中，国内自研/采购零部件价值占比约40%-50%，海外采购占比约50%-60%，其中静电卡盘、真空泵、真空阀、部分射频电源仍依赖海外采购。 2. 射频电源 涨价幅度：先进制程用射频电源涨价幅度为13%-15%，海外供应商以霍廷格、AE为主。 国内厂商竞争格局： 恒运昌：主攻PECVD用3-6000瓦低功率射频电源，产品成熟，主要配套拓荆，成熟制程领域份额较高，未布局高功率刻蚀用射频电源。 英杰电气：主攻刻蚀设备用射频电源，技术优于恒运昌，但12千瓦以上先进制程用高功率射频电源技术仍较落后，未进入长存、长鑫、中芯南方等先进制程产线供应链，先进制程领域国产份额基本为0。 国产化率情况：成熟制程射频电源国产化率较高，先进制程射频电源国产化率基本为0。 3. 真空类零部件（真空泵、真空阀） 涨价幅度： 真空泵整体涨价约9%，其中爱德华、普发等海外厂商的先进制程用真空泵国内暂无供应，国产厂商沈阳科仪的产品仅在长存128层、256层产线小批量验证供应，256层以上先进制程无相关产品。 真空阀整体涨价约7%，国内厂商新莱应材产品可对标海外VAT，且与中微合作时间较长，但品类覆盖少于VAT。 国产化率情况：先进制程真空泵国产化率极低，成熟制程真空阀国产化率相对较高。 4. 机械结构件与硅/石英部件 品类价值占比：金属结构件（反应腔内衬、腔体等）占单台设备价值的约10%。 国内厂商竞争格局：富创精密可供应中微先进制程腔体，中微扶持的托伦斯订单规模持续上升。 涨价幅度： 大型进口金属结构件涨价幅度约5%-6%。 普通石英件（国内菲利华、神工等可生产）涨价幅度约3%-5%；高纯石英件国内材料技术不足，依赖进口，涨价幅度约12%-15%。 刻蚀机用气体分配盘（Showerhead）涨价幅度约18%。 静电卡盘（陶瓷金属结合件）涨价幅度约9%-11%，国内供应商包括江丰电子、珂玛科技。 5. 仪器仪表类（MFC、真空计） 价格与用量： MFC分为热式和压差式：热式MFC单价约3000元/颗，主要用于成熟制程；压差式MFC用于28nm及以下先进制程，灵敏度和监控精度更高，单价约9000-12000元/颗。 单台刻蚀机标配6个MFC（对应6种工艺气体），若增加气体管路则数量为8-12个。 国内厂商竞争格局： 华创微电子（前七星流量计，2025年底从北方华创拆分，计划3年内上市）产品份额国内最高，主打国产替代，产品主要供给北方华创。 蓝动精密、先导科技（收购沃威仪器）主要生产热式MFC，蓝动精密产品已进入长存等晶圆厂小批量供应；高凯技术、青岛芯恩为后进入玩家。 压差式MFC仅华创微电子有布局，但技术成熟度一般，市场仍由Horiba、Kofloc、Brooks等海外厂商主导。 涨价幅度：真空计（Gauge）国内无供应，依赖进口，涨价幅度约12%；MFC涨价幅度约6%。 6. 静电卡盘（E-chuck） 国内厂商竞争格局： 苏州珂玛科技技术领先，先进制程用氮化铝基静电卡盘已实现小批量供应；华卓精科技术水平与珂玛接近，中瓷的12寸氧化铝基静电卡盘已在北方华创上机验证，海古德为后进入厂商。 8寸氧化铝基静电卡盘中瓷产品成熟度较高。 价值量：海外厂商12寸先进制程静电卡盘单价约8万美金（折合人民币约40多万元），国内同类产品单价约20多万元，价格约为海外的7折；8寸静电卡盘单价约10多万元。 配套规则：单台设备的每个腔体对应1个静电卡盘。 7. 陶瓷加热盘（Heater） 国内厂商竞争格局：苏州珂玛技术领先，卡贝尼产品主要覆盖6寸、8寸产线。 海外厂商情况：海外刻蚀设备厂商主要采用日本东洋碳素的产品，其材料致密性和烧结技术优势明显。 配套规则：单台设备的每个腔体对应1个陶瓷加热盘。 8. 机电类零部件 机械手臂：国内新松机器人已实现部分突破，国产化率约10%。 EFEM晶圆传输系统：国产化率约30%。 温控/冷却系统：国产化率相对较高，占单台设备价值的10%-15%。 9. 零部件需求结构与替换周期 高价值零部件品类：静电卡盘、射频电源、硅环/石英环为三大高价值零部件，其中硅环、石英环为消耗品，年度消耗价值较高。 各品类占比与国产化率： 耗材类（硅环、硅电极、密封圈等）：占单台设备价值的10%-12%，国产化率较高。 电器类（射频电源等）：占单台设备价值的约15%，成熟制程国产化率约40%，先进制程国产化率基本为0，海外供应商以AE、霍廷格为主。 真空与气体系统类（干泵、分子泵、真空阀、MFC等）：占单台设备价值的15%-20%，先进制程国产化率约5%，成熟制程国产化率约10%-20%，爱德华产品占海外供应份额的60%-70%。 10. 海外政 策影响与国产替代趋势 MATCH法案核心影响：法案将中芯国际、长江存储、长鑫、华虹列入限制名单，限制28nm以下浸没式DUV、低温刻蚀等设备及相关零部件的供应，同时限制海外厂商对已售设备提供维保服务，目标是限制国内晶圆厂产能扩张和稳定生产。 对国内产业的影响：政 策压力倒逼着国内晶圆厂加快国产设备和零部件的验证进度，2025-2026年国内设备出货量实现量级突变，利好国产设备和零部件厂商，但晶圆厂面临国产设备性能与海外有差距的挑战。 零部件订单趋势：已实现技术突破的品类（如金属结构件、非金属结构件）需求大幅增长，交期明显拉长，例如2020年波纹管交期为20天，2025年交期为1个月，2026年交期已拉长至4个月；未实现技术突破的核心品类仍为卖方市场，突破后市场空间巨大。 国产替代紧迫性排序：①真空类（真空泵、真空计、真空蝶阀）→②电器类（射频电源）→③机电一体类（静电卡盘、机械手臂）→④其他品类，金属、非金属类紧迫性较低。 11. 设备商自研零部件趋势 海外经验：海外设备厂商（如Lam）会自研与设备电气性能、参数强绑定的核心零部件（如静电卡盘），保障供应链安全与产品适配性。 国内趋势：中微、北方华创等国内设备厂已在自研静电卡盘等核心零部件，先进制程、高难度零部件以自研为主，成熟制程、大批量生产的零部件会外包给富创、珂玛、中瓷等专业供应商。---xz#文字观点", "publish_time": "2026-08-26 10:06", "tags": ["文字观点"]}, "post:2026-08-26T10-05:ad4048ca3737": {"id": "post:2026-08-26T10-05:ad4048ca3737", "kind": "post", "title": "2026-08-26 10:05", "source_label": "帖子正文", "excerpt": "北方华创、芯源微、中科飞测业绩解读以及零部件逻辑验证： 三家设备龙头处于“订单高增、收入兑现、利润阶段性承压”的共性特征之中：北方华创凭借平台化矩阵与头部客户扩产，26上半年营收同比+24.9%且在手订单显著抬升，毛利处历史相对低位，体现研发与新品导入阶段性压力，毛利波动与新产品客户端验证期的零部件", "content": "北方华创、芯源微、中科飞测业绩解读以及零部件逻辑验证： 三家设备龙头处于“订单高增、收入兑现、利润阶段性承压”的共性特征之中：北方华创凭借平台化矩阵与头部客户扩产，26上半年营收同比+24.9%且在手订单显著抬升，毛利处历史相对低位，体现研发与新品导入阶段性压力，毛利波动与新产品客户端验证期的零部件迭代升级成本增加、对部分大单客户的商务优惠有关，研发前置对净利端形成阶段性挤压，但为中长期产品力与平台化能力强化奠定基础；芯源微26Q2收入环比提速、化学清洗机进入放量期、上半年订单大幅提升，但单季毛利率与净利率受确收节奏与费用投入影响承压；中科飞测明/暗场量检测设备批量出货、合同负债快速上行，研发前置与产品结构导致上半年仍亏损。对比之下，设备上游零部件环节业绩弹性更强，核心原因是：设备厂扩产带来的提前备货、国产零部件加速导入替代，以及全球需求高增与供给紧缺推动的量价齐升共振。 驱动一：设备厂扩产→提前锁定核心零部件，交付周期延长。全球设备交付周期延长、在手订单饱满，设备厂为保障交付通常提前锁定关键零部件采购并推进供应链备货与产能建设，上游核心零部件需求先行受益。海外零部件公司订单/收入加速增长、利润弹性增强（MKS、AEIS等），印证需求上修与订单景气向上游环节传导。 驱动二：国产替代加速→零部件“备选项”转向“必选项”。海外供给受限+本土安全诉求强化，国产零部件导入窗口打开（去美化/自主可控）；国内零部件企业进入海外设备巨头供应链、模块化产品升级，份额提升与价值量提升并行。产业端反馈出现涨价与挑单，表明零部件供需趋紧、议价能力与盈利中枢抬升。 驱动三：全球需求高增+供给紧缺→景气涨价与量价齐升 。AI/先进逻辑/DRAM/HBM/先进封装扩产同步推进，海外零部件企业普遍上调收入预期并扩产（如MKS扩充广州基地、Edwards并购拓展、AE加速泰国基地）；景气“量价齐升”传导至国内产业链，盈利弹性先释放。 归纳：下游设备扩产对上游零部件形成“提前下单—交期延长—价格上行”的放大效应；设备订单落到零部件端时，会同时形成生产物料、库存修复和装机后服务备件三类需求；再叠加国产替代与海外寻源，零部件订单增速可能高于设备整机；零部件约占整机成本四成，也意味着这种放大对应的绝 对价值量并不小；重资产属性又让产能利用率上升时利润弹性更大，兵马未动粮草先行的卖铲人逻辑，所以零部件板块在本轮全球晶圆厂资本开支上行周期中呈现更强的业绩敏感度与弹性。---xz#文字观点", "publish_time": "2026-08-26 10:05", "tags": ["文字观点"]}, "post:2026-08-26T14-58:94fc62cd1d40": {"id": "post:2026-08-26T14-58:94fc62cd1d40", "kind": "post", "title": "2026-08-26 14:58", "source_label": "帖子正文", "excerpt": "三星、SK 海力士将增加 8 层 HBM4 出货份额，预示英伟达供应链发生变化（Zdnet Korea） 三星电子和 SK 海力士预计将在向英伟达出货的第六代高带宽存储器（HBM4）中增加 8 层产品的份额。主要驱动力是英伟达的采购策略，即通过确保更广泛的 HBM 选项来应对热管理问题并提升供应链稳", "content": "三星、SK 海力士将增加 8 层 HBM4 出货份额，预示英伟达供应链发生变化（Zdnet Korea） 三星电子和 SK 海力士预计将在向英伟达出货的第六代高带宽存储器（HBM4）中增加 8 层产品的份额。 主要驱动力是英伟达的采购策略，即通过确保更广泛的 HBM 选项来应对热管理问题并提升供应链稳定性。 下一代 HBM4E 产品也越来越可能以 8 层配置为中心。 据业内人士 26 日消息，三星电子和 SK 海力士计划在今年下半年向英伟达增加 8 层 HBM4 产品的供应。 这两家公司此前一直在为英伟达下一代 Vera Rubin 系列 AI 加速器供应 12 层 HBM4 产品。 HBM 是一种将多个 DRAM 芯片垂直堆叠的存储器类型，这意味着 12 层产品包含 12 个堆叠的 DRAM 芯片。 三星电子预计将在今年第一季度开始全面量产出货，随后 SK 海力士将在第二季度跟进。 然而，最近英伟达对 HBM 供应链的态度开始发生变化。 根据三星电子和 SK 海力士内部及周边人士的说法，两家公司计划在今年下半年逐步增加 8 层产品在向英伟达 HBM4 出货中的份额，而不是 12 层产品。 一位存储半导体业内人士表示：“英伟达最近要求供应商将主要 HBM4 产品配置从 12 层改为 8 层，据我了解，今年下半年供应计划已据此进行修订。” 另一位人士表示：“此前已有一些 8 层 HBM4 的需求，但下半年该产品的需求增加，这也影响了相关材料和组件的订单。目前还为时过早，无法确定确切比例，但 8 层产品在向英伟达 HBM4 出货中的份额将越来越高的趋势将变得清晰。” 业内人士认为，这一变化可能源于多种因素的综合作用。 从性能角度来看，热问题已成为一个担忧。 HBM4 将输入 / 输出通道数量，也就是数据传输路径，与上一代相比翻倍至 2048，这不仅在单个芯片层面大幅增加发热量，还会影响整个服务器机架系统。 供应链因素也被认为发挥了作用。 目前 HBM 供应极为紧张，这是因为全球大型科技公司对 AI 基础设施的大力投资。 与此同时，HBM4 的性能和密度提升使其更难实现高良率。 虽然 HBM 所用核心 DRAM 芯片的良率可以相对快速改善，但堆叠 12 个芯片、键合并封装成品的过程会显著降低良率。 因此，英伟达被认为正在寻求更多 8 层产品的采购量，同时维持现有的 12 层 HBM4 供应，从而为未来的 AI 加速器提供更广泛的存储容量选项。 一位半导体业内人士表示：“英伟达在设计最新 AI 平台时，将热管理置于最高优先级，这与其说是降低单个芯片规格，不如说是寻找最优的系统级配置，因此不太可能导致整体市场需求发生重大变化。” HBM4 的继任者 HBM4E 也越来越可能主要以 8 层而非 12 层配置出货。 HBM4E 预计将用于英伟达下一代 Rubin Ultra AI 加速器。 一位资深存储半导体业内人士表示：“虽然 12 层和 16 层 HBM4E 样品也在讨论中，但根据目前与客户的讨论，明年供应的 HBM4E 产品很可能以 8 层为主。” “然而，由于 Rubin Ultra 是否使用 HBM4E 还是 HBM4 等问题尚未解决，整个行业的不确定性仍然很高。”#文字观点", "publish_time": "2026-08-26 14:58", "tags": ["文字观点"]}, "attachment:files/GS-韩国晶圆设备_基板覆铜板_芯片测试_HBM 供应链调研强化了我们对三星电子、SK 海力士以及 SEMCO 的乐观判断 SOUTH KOREA TECHNOLOGY Korea WFE_Substrate CCL_Chip testing_HBM Supply Chain Check reinforces ou.pdf": {"id": "attachment:files/GS-韩国晶圆设备_基板覆铜板_芯片测试_HBM 供应链调研强化了我们对三星电子、SK 海力士以及 SEMCO 的乐观判断 SOUTH KOREA TECHNOLOGY Korea WFE_Substrate CCL_Chip testing_HBM Supply Chain Check reinforces ou.pdf", "kind": "attachment", "title": "GS-韩国晶圆设备_基板覆铜板_芯片测试_HBM 供应链调研强化了我们对三星电子、SK 海力士以及 SEMCO 的乐观判断 SOUTH KOREA TECHNOLOGY Korea WFE_Substrate CCL_Chip testing_HBM Supply Chain Check reinforces ou", "source_label": "GS", "excerpt": "In this report, we compile 1) 2Q26 earnings read-across from 20 key non-covered Korean companies across the front-end equipment, substrate/CCL, chip testing, and HBM sectors, 2) ta", "content": "In this report, we compile 1) 2Q26 earnings read-across from 20 key non-covered Korean companies across the front-end equipment, substrate/CCL, chip testing, and HBM sectors, 2) takeaways from meetings with 14 of these firms, and 3) additional data-points to summarize current trends in the Korean tech supply chain and provide implications for our coverage universe. 1. Front-end equipment : Korean equipment vendors overall posted solid 2Q26 results and rapidly expanding order backlogs and customer requests for delivery pull-ins re flect an active capex stance from memory players and raise expectations for 2H earnings improvement among equipment suppliers. Strong yoy growth momentum of WFE imports to Korea also supports strong memory WFE demand. This trend aligns with our WFE team’s positive industry outlook as well as our views on SEC and Hynix capex. 2. Substrates/CCLs : Korean substrate and CCL suppliers sustained robust earnings growth momentum in 2Q26. Amid tight supply conditions, rapidly expanding order intake raises the likelihood that supply tightness will persist. In line with this, our global team expects the substrate supply shortage to continue for several years. Supported by favorable market conditions and expanding AI revenue, we expect SEMCO substrate revenue to grow signi ficantly this year with meaningful improvement in operating margins. 3. Chip testing : Korean chip testing supply chain companies posted solid 2Q26 results and we believe strong demand for server CPU sockets and a positive demand outlook for memory testing sockets/equipment carry positive implications for our memory coverage. 4. HBMs : Solid 2Q26 earnings, optimistic guidance, and upbeat commentary from HBM supply chain companies carry positive implications for our memory coverage. In line with recent data-points and comments, we estimate the HBM TAM to grow by 67% and 108% yoy this year and next year, respectively. The authors would like to thank Jiung Kang for his contribution to this report. Giuni Lee +65-6889-1025 | giuni.lee@gs.com Goldman Sachs (Singapore) Pte Taeyong Lee +82(2)3788-0981 | taeyong.lee@gs.com Goldman Sachs (Asia) L.L.C., Seoul Branch Daiki Takayama +81(3)4587-9870 | daiki.takayama@gs.com Goldman Sachs Japan Co., Ltd.24 August 2026 | 12:11AM SGT Goldman Sachs does and seeks to do business with companies covered in its research reports. As a result, investors should be aware that the firm may have a con flict of interest that could a ffect the objectivity of this report. Investors should consider this report as only a single factor in making their investment decision. For Reg AC certification and other important disclosures, see the Disclosure Appendix, or go to www.gs.com/research/hedge.html . Analysts employed by non-US a ffiliates are not registered/quali fied as research analysts with FINRA in the U.S. Equity Research SOUTH KOREA TECHNOLOGY Korea WFE/Substrate CCL/Chip testing/HBM Supply Chain Check reinforces our positive view on Samsung Electronics, SK Hynix, and SEMCO c45a43530f604d12bcb9a82b5aa6b9f6 Exhibit 1: Korea tec mments, and data-points. Korean equipment vendors overall posted solid 2Q26 results and rapidly expanding order backlogs and customer requests for delivery pull-ins re flect an active capex stance from memory players and raise expectations for 2H earnings improvement among equipment suppliers. Strong yoy growth momentum of WFE imports to Korea also supports strong memory WFE demand. This trend aligns with our WFE team’s positive industry outlook as well as our views on SEC and Hynix capex. What we learned from 2Q26 results/data-points/company comments: #1 Driven by solid spending from chip-makers, Korean equipment companies overall posted solid yoy growth in revenue and operating pro fit in 2Q26 \u003c Exhibit 2 >, extending the yoy improvement trend that began in 1Q26. Notably, a sharp surge in order backlog during the 2Q26 \u003c Exhibit 3 > indicates a positive signal for 2H26 performance. However, some companies posted sluggish results due to deferred shipments to foundry clients, increased R&D expenses, and one-o ff cost impacts. #2 All Korean equipment companies we spoke with said customers are asking to bring forward shipments as DRAM/HBM fab schedules have been moved up and NAND technology upgrade investment is accelerating. #3 Korean equipment companies clearly stated they are receiving more orders recently, notably since 2Q26. Korean equipment companies are overall optimistic on order flow in the next year, and hence expressed positive tone on 2H26 and 2027 earnings. #4 Korean equipment companies we spoke with provided revenue growth guidance for this year of +25-40% yoy and commented strong WFE demand is the main driver of growth. In-line with solid revenue growth guidance, we expect SEC/Hynix capex to grow 59%/75% yoy this year \u003c Exhibit 4 , Exhibit 5 >, however we expect both DRAM and NAND supply to remain tight \u003c Exhibit 6 , Exhibit 7 >. #5 WFE import value to Korea continued strong yoy growth momentum (up 73% yoy in 2Q26 and up 97% yoy in July 2026) \u003c Exhibit 15 >. Korea’s WFE export value to China is showing declining trend (July YTD -20% yoy) \u003c Exhibit 16 > despite Chinese semiconductor market still growing, which we believe is due to nation-wide focus on localization of semiconductor supply chain. #7 Majority of Korean equipment companies we spoke with said they expect UTR to continue to increase going forward and are not yet facing capacity tightness as they expanded capacity some years ago. Some companies, however, said they are reviewing #6 Korean equipment companies we spoke with commonly mentioned customers’ WFE spending is focused on DRAM while overall retained positive tone on NAND WFE outlook as they expect customers’ NAND technology upgrade investment to continue. plans to add capacity as their UTR is reaching close to full level. #8 We haven’t sensed Korea equipment players are raising equipment pricing, however some suppliers mentioned that they are under discussion or reviewing options to initiate 24 August 2026 3Goldman Sachs South Korea Technology c45a43530f604d12bcb9a82b5aa6b9f6 discussion on normalizing pricing. #9 Most of the Korean companies we spoke with said there was no notable change in equipment delivery lead times, with some mentioning they are seeing prolonged lead times. #10 Korean equipment companies commented they are not yet facing tightness in procuring equipment components, however mentioned there could be some impact to display equipment lead times as equipment components companies are prioritizing semiconductor equipment over display equipment. #11 We expect ongoing memory process node migration \u003c Exhibit 8 , Exhibit 9 >, multiple memory fabs currently under construction \u003c Exhibit 10 , Exhibit 11 , Exhibit 12 , Exhibit 13> and memory makers’ large long-term memory fab buildout plan \u003c Exhibit 14 > suggests there are huge growth potentials in WFE TAM in both near-term and long-term, which is in-line with our global WFE team’s view where we expect memory WFE capex to grow by 47%/47%/38% yoy in 2026/2027/2028. #12 EO Technics, which manufactures packaging equipment and PCB equipment as well, commented (1) it saw solid order flow from OSAT companies as one foundry company customer outsourced 2.5D packaging to OSAT companies, and (2) it is receiving strong orders on PCB equipment as PCB equipment supply has become extremely tight, leading to longer lead times from major PCB equipment vendors. #13 Regarding risk factors, Korean semi equipment vendors that also run display equipment businesses cited weak display demand as a risk factor, while those with China exposure shared a cautious view on long-term order sustainability from China due to the country’s equipment localization push. Implication to our coverage: #1 Korean equipment companies we spoke with provided solid revenue growth guidance for this year due to strong WFE demand. In-line with solid guidance, we expect SEC/Hynix capex to see strong growth of 59%/75% yoy this year, however expect both DRAM and NAND supply to remain tight despite higher spending for both DRAM and NAND. #2 We expect ongoing memory process node migration, with multiple memory fabs currently under construction, and memory makers’ large long-term memory fab buildout plans suggest there is huge growth potential in WFE TAM in both near-term and long-term, which is in-line with our global WFE team’s view where we expect memory WFE capex to grow by 47%/47%/38% yoy in 2026/2027/2028. 24 August 2026 4Goldman Sachs South Korea Technology c45a43530f604d12bcb9a82b5aa6b9f6 Exhibit 2: Combined earnings of 9 Korea major front-end equipment companies Front-End combined 1Q24 2Q24 3Q24 4Q24 1Q25 2Q25 3Q25 4Q25 1Q26 2Q26 2023 2024 2025 Revenue (W mn) 1,139,604 1,332,975 1,359,920 2,884,452 1,251,821 1,427,150 1,360,828 1,747,389 1,474,979 1,716,498 5,048,348 5,466,578 5,787,188 qoq -18% 17% 2% 112% -57% 14% -5% 28% -16% 16% yoy -16% 6% 29% 108% 10% 7% 0% -39% 18% 20% -22% 8% 6% Gross Profit (W mn) e by semiconductor makers, we have revised up our global market outlook for WFE (wafer fab equipment; front-end equipment) (see our report here ). We have meaningfully raised our market forecasts for CY26 to US$150.3 bn (+36% yoy), for CY27 to US$217.5 bn (+45% yoy), and for CY28 to US$280.9 bn (+29% yoy) (see Exhibit 1 for details). We raise our forecasts across the board, noting that the expansion in AI demand is leading to broader demand growth across a wide range of semiconductors, with our upward revisions for DRAM and logic/foundry especially marked. In addition, with capex in China also brisk, our China team has raised its WFE forecasts ( link), and expects double-digit (%) growth to continue through CY26-CY28. Production capacity, lead times, and pricing power are becoming increasingly important As noted in our July 27 report , with SPE makers’ orders building up meaningfully amid robust demand, our focus is on three key factors we believe will determine the direction of each maker’s earnings: (1) upward elasticity in production capacity, (2) manufacturing lead times, including the status of component procurement, and (3) pricing power amid rising component costs. We summarize the current situation for each company in Exhibit 6 . We see only a low possibility of earnings expectations rising into FY6/28 and FY3/28, respectively, for Ulvac (Sell) and Tokyo Seimitsu (Sell) in particular, as they face bottlenecks in their production capacity (despite strong orders). For single stocks, our focus remains on top-line growth and pro fit margin delta Our investment ratings for Japan SPE names are unchanged. As highlighted in our 2H CY26 investment strategy report, we focus on two key factors when considering our ratings: (1) whether a company can achieve sales growth exceeding the sector average driven by technological change, proprietary technologies, and/or market share gains, and (2) whether top-line strength will translate into robust growth in Shuhei Nakamura +8 erpt": "中国 证券研究 2026 年8月21日 安克创新 - H 首次覆盖 增持 668.HK, 668 HK 技术驱动型创新企业，打造全球品牌；首次覆盖，给 予“增持”评级 股价（ 2026 年8月21日）： 119.00 港元 目标价（ 2027 年6月）： 150.00 港元", "content": "中国 证券研究 2026 年8月21日 安克创新 - H 首次覆盖 增持 668.HK, 668 HK 技术驱动型创新企业，打造全球品牌；首次覆盖，给 予“增持”评级 股价（ 2026 年8月21日）： 119.00 港元 目标价（ 2027 年6月）： 150.00 港元 证券研究报告 科技 证券分析师 : 刘叶 AC (86-21) 6106-6200 ye.liu@jpmorgan.com 登记编号 : S1730521090001 证券分析师 : 冯令天 AC (86-21) 6106 6359 billy.feng@jpmorgan.com 登记编号 : S1730520030005 证券分析师 : 许日 (86-21) 6106 6318 ri.xu@jpmchase.com 登记编号 : S1730522100001 摩根大通证券（中国）有限公司 资料来源：风格敞口数据源自摩根大通全球市场策略团队；其他所有图表中的数据均为公司数据或摩根大通估算 分析师声明及重要披露，包括非美国分析师披露，见第 39页。 安克创新是一家建立在国内工程能力和全球分销优势基础上的全 球化智能硬件创新企业。公司成功构建了涵盖智能充电储能、智 能家居及智能影音品类的多元化产品组合，并享有较高的全球认 可度。凭借以消费者为中心的创新能力、卓越的用户体验和全球 渠道优势，安克亦在全球范围内建立起广泛的业务布局，为 180 多个国家和地区的超 2亿用户提供服务。展望未来，我们认为安 克可复制的业务模式将助其在持续增长的 “浅海 ”市场中进一步扩 大份额，同时稳健的盈利增长和估值上调潜力应将推动股价上行 。我们首次覆盖安克创新 -H，给予 “增持 ”评级，截至 2027 年6月 的目标价为 150港元。 •分散的浅海市场：成长路径清晰。 安克瞄准 “浅海 ”市场，包括 充电器、可穿戴设备和家用电器等规模低于 800亿美元的产品 品类。这些市场通常较为分散，受产品周期驱动，且存在大量 未被满足的消费者痛点，从而为那些能够识别消费者需求并提 供可靠产品的创新企业创造了机遇。据公司招股书，浅海市场 规模预计将从 2025 年的 3,800 亿美元增长至 2030 年的 6,770 亿 美元（ 2025-30 年预期年复合增长率为 12.2% ）。 •可复制的品类拓展，由品牌、渠道和研发驱动 。安克秉持 “第一 性、求极致、共成长 ”的核心价值观，锚定用户本质需求、背靠 持续研发推出差异化的技术创新型产品、并以可靠的品质和售 后服务强化信任，从而构建起自身的竞争护城河。加之其全球 化的分销渠道（包括在亚马逊上的强势地位）和全球用户基础 方面的优势，这些因素共同形成了 “产品创新 -商业落地 -价值再 循环 ”的正向闭环，在我们看来应将支撑其在持续增长的浅海市 场中进一步扩大份额。 •首次覆盖，给予 “增持 ”评级。 安克创新 -H自2026 年7月2日上 市以来股价上涨 20%（同期恒生指数涨 12%），表现优于大多 数科技同业（后者 7月出现显著回调）。我们认为，安克凭借 其多元化的产品组合、品牌价值和渠道优势，是一只优质成长 股。我们预计公司 2025-28 年盈利年复合增长率为 24%，并基于 17 倍 12个月动态市盈率推导得出截至 2027 年6月目标价 150 港元。首次覆盖，给予 “增持 ”评级。主要风险包括以下方面的不 确定性： 1）创新产品的推出； 2）与第三方电商平台的关系； 3 ）全球贸易政策； 4）第三方供应 /交付。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 股价表现 年内迄今 1个月 3个月 12个月 绝对 - 10.9% - - 相对 - 7.4% - - 公司数据 已发行股票数（百万） 588 52周股价区间（港元） 122.90-90.00 总市值（百万美元） 8,922 汇率 7.84 自由流通股比例 - 三个月日均成交量（百万） - 三个月日均成交额（百万美元） - 波动性（ 90天） - 指数 HSI 彭博 买入 |持有 |卖出 - 重要指标（财年 12月份结束） 单位：百万元，每股数据单位：元 FY25A FY26E FY27E FY28E 财务预测 收入 30,514 39,233 49,180 58,432 调整后的息税前利润 2,949 3,834 4,842 来看，营收38.8e，同比+30.5%，环比+63.7%，归母4.56e，同比+106%，环比+125%，扣非4.57e，同比+152%，环比+131%，测算净利率11.7%，同比+4.2pcts，环比+3.1pcts，盈利能力超预期 #Q2及26年展望、海外盈利在报表端已有明显贡献 我们预计公司毛利率同环比均有提升，主要系高盈利业务如海外、运维服务等占比提升 #行业悲观预期已经很充分、下半年国内装机预计大幅提升 消费税目前看是和电池厂商量着分摊，后续公司海外项目增加，消费税影响趋于减弱，碳酸锂当前价格对需求基本没什么抑制，我们判断下半年国内招中标和装机会加速，估计26年国内装机250~300GWh。十五五可再生能源规划也明确新能源项目置信出力要提升，有望重新打开配储增量，国内各个省份逐步全面推出容量电价，实现与此前部分省份容量补偿装机接力#投资建议：预计公司26/27年20/30e+业绩，当前价格对应27年10倍+，当前位置超跌，盈利能力修复明显，我们认为利空已经充分price in，持续推荐！#文字观点", "publish_time": "2026-08-26 10:47", "tags": ["Q2业绩同环比高增、净利率超预期", "投资建议", "文字观点"]}, "post:2026-08-26T17-18:405238dc1af5": {"id": "post:2026-08-26T17-18:405238dc1af5", "kind": "post", "title": "2026-08-26 17:18", "source_label": "帖子正文", "excerpt": "‼️【固态电池板块点评：上海落地测试示范基地，产业化预期再升温】 🔥事件：上海市政府印发《上海市战略性新兴产业发展“十五五”规划》，明确提出推进建设固态电池等多元技术路线对比测试示范基地，并布局万千瓦级独立储能示范电站。同时将全固态电池、液流电池、高性能钠离子电池等列入下一代储能重点攻关方向。", "content": "‼️【固态电池板块点评：上海落地测试示范基地，产业化预期再升温】 🔥事件：上海市政府印发《上海市战略性新兴产业发展“十五五”规划》，明确提出推进建设固态电池等多元技术路线对比测试示范基地，并布局万千瓦级独立储能示范电站。同时将全固态电池、液流电池、高性能钠离子电池等列入下一代储能重点攻关方向。 📌核心变化在于：固态电池开始从“技术路线竞争”进入“测试验证+示范应用”阶段。过去市场炒作更多集中在实验室突破、能量密度以及量产时间表，而此次上海直接提出建设多技术路线对比测试基地，意味着后续产业链的核心催化将逐步转向产品验证、客户认证、产能建设和订单落地。 🔥第一条主线：固态电解质——上海洗霸辨识度最高。公司已布局氧化物固态电解质，与中科院上海硅酸盐研究所开展合作，固态电解质粉体已经完成吨级至十吨级产线试产，并持续推进产业化。 此次政策又明确落地上海本地固态电池测试示范基地，是本轮政策催化中值得重点跟踪的材料端标的。 🔥第二条主线：硅碳负极——翔丰华。固态/半固态电池为了提升能量密度，对硅碳负极的需求明显提升。翔丰华已经布局硅碳、硅氧等新型负极材料，一代硅碳产品首次效率≥90%，二代产品≥93%，目前处于客户测试及小批量试产阶段。 🔥第三条主线：全固态电芯——金龙羽。相比单纯材料公司，金龙羽的弹性来自“直接做电池”。公司已经展示20Ah硫化物全固态软包电池，能量密度达到400Wh/kg，并采用自研卤化物电解质及硫化物固态电解质体系。 🔥第四条主线：产业龙头——宁德时代。宁德时代具备全球动力电池产业链、客户和制造体系优势，本身也持续推进下一代高比能电池技术研发。 如果固态电池从示范验证逐渐走向量产，宁德时代最大的优势不是短期概念弹性，而是技术储备+客户资源+制造能力+规模化降本能力。 📌此外，板块还可关注#国轩高科、亿纬锂能、赣锋锂业、天赐材料、恩捷股份、当升科技、容百科技、贝特瑞、杉杉股份、金力股份、三祥新材、东方锆业、德尔股份、利元亨、先导智能等固态电池材料、设备及电池产业链公司。 🔔本次政策最大的意义不是简单增加一个题材，而是把固态电池的产业化进程进一步“落地化”。短期看政策催化，中期看测试基地和客户验证，后期真正决定行情高度的，是电解质能不能量产、硅碳负极能不能放量、全固态电芯能不能稳定制造以及头部电池厂何时进入规模化生产。#文字观点", "publish_time": "2026-08-26 17:18", "tags": ["文字观点"]}, "post:2026-08-26T09-23:77ec7c5f74dc": {"id": "post:2026-08-26T09-23:77ec7c5f74dc", "kind": "post", "title": "2026-08-26 09:23", "source_label": "帖子正文", "excerpt": "思看科技2026年中报点评☆ 业绩整体：2026H1营收1.85亿元（同比+4.67%），剔除海外ODM客户FARO采购下滑扰动，收入同比+15.54%，主业需求稳健；归母净利润1412万元（同比-73.85%），扣非归母净利润886万元（同比-81.17%），剔除股份支付后净利润2825万元（同比", "content": "思看科技2026年中报点评☆ 业绩整体：2026H1营收1.85亿元（同比+4.67%），剔除海外ODM客户FARO采购下滑扰动，收入同比+15.54%，主业需求稳健；归母净利润1412万元（同比-73.85%），扣非归母净利润886万元（同比-81.17%），剔除股份支付后净利润2825万元（同比-52.45%）。利润短期承压，主要系研发、销售扩张投入增加，叠加股权激励股份支付、汇兑损失拖累。2026Q2营收9786万元（同比+9.05%），归母/扣非归母净利润684/403万元（同比-74.68%/-82.31%）。2026H1毛利率72.35%（同比-2.17pcts），净利率7.63%（同比-22.91pcts）；Q2毛利率71.51%（同比-1.41pcts），净利率6.99%（同比-23.13pcts）。H1销售、管理、研发费用率30.27%、7.34%、32.00%，同比+5.40、+0.97、+10.49pcts；研发投入6191万元（同比+62.67%），营收占比33.45%（同比+11.93pcts），技术投入力度显著加大。 ☆ 拓竹合作：五年战略合作稳步落地，构建“扫描-建模-打印”完整生态闭环。2026年1月公司与拓竹科技达成5年深度合作，联合研发消费级3D扫描仪，由公司独家生产交付。依托拓竹全球3D打印生态，实现工业级高精技术向下渗透小B、C端市场；公司配套搭建专项研发与产线团队，依托自动化设备提升产能与良率，为消费级产品规模化放量夯实交付能力。 ☆ 工业级业务：高端制造基本盘稳固，新品与自动化检测持续扩容。工业收入增速短期承压，主要受国内项目验收周期拉长、FARO订单下滑影响，剔除扰动后主业维持双位数增长。2026H1三维视觉数字化产品收入1.76亿元，营收占比95.16%，毛利率73.67%。产品聚焦汽车、航空航天、工程机械、能源装备等高景气赛道，自动化检测订单高增，服务弗迪电池、天津爱思达、杭汽轮、东方电气、海信家电等头部客户；新增便携式关节臂测量产品，推出“关节臂+激光扫描仪”协同测量方案，依托现有渠道持续拉动复购增购。 ☆ 专业级业务：数字化场景多点渗透，AI赋能降低使用门槛。公司持续迭代3DeVOK产品，优化使用体验与数据处理功能；重构非工业级软件平台，复用工业级算法架构并适配消费级差异化需求，完成多系统兼容升级。AI全流程赋能扫描参数匹配、分辨率调节、模型智能修复，大幅降低民用建模门槛。下游覆盖教研、工业设计、3D打印、医疗文博、公安司法等场景，持续拓宽专业工具市场空间。 ☆ 技术研发：底层技术持续迭代，打开物理AI与数字孪生新空间。公司深耕双目视觉、三维感知底层技术，持续迭代软硬件、边缘计算与深度学习算法，为机器人、物理AI、数字孪生提供核心三维数据入口。截至2026H1，研发人员254人，占比41.17%；在研项目覆盖彩色三维扫描、无线小型扫描、自动化扫描系统、三维数据后处理软件等，技术储备持续夯实。 ☆ 投资观点：公司上半年主业收入韧性充足，短期利润承压系战略性投入与一次性扰动所致，不改变长期成长逻辑。工业高端检测基本盘稳固，自动化检测、关节臂新品贡献新增量；消费级依托拓竹五年合作实现规模化突破，万物数字化打开专业级成长空间。公司三维视觉龙头壁垒稳固，产品、技术、渠道持续迭代完善，我们看好公司发展前景。#文字观点", "publish_time": "2026-08-26 09:23", "tags": ["文字观点"]}, "attachment:files/BofA-全球存储芯片行业——海力士回购释放积极信号，现货价格超预期，8月科技路演前瞻.pdf": {"id": "attachment:files/BofA-全球存储芯片行业——海力士回购释放积极信号，现货价格超预期，8月科技路演前瞻.pdf", "kind": "attachment", "title": "BofA-全球存储芯片行业——海力士回购释放积极信号，现货价格超预期，8月科技路演前瞻", "source_label": "BofA", "excerpt": "中国 证券研究 2026 年8月21日 领益智造 - H 首次覆盖 增持 1688.HK, 1688 HK 一体化精密解决方案提供商，锚定 AI驱动的增长周 期；首次覆盖，给予 “增持”评级 股价（ 2026 年8月21日）： 6.24 港元 目标价（ 2027 年6月）： 11.00 港元", "content": "中国 证券研究 2026 年8月21日 领益智造 - H 首次覆盖 增持 1688.HK, 1688 HK 一体化精密解决方案提供商，锚定 AI驱动的增长周 期；首次覆盖，给予 “增持”评级 股价（ 2026 年8月21日）： 6.24 港元 目标价（ 2027 年6月）： 11.00 港元 证券研究报告 科技 证券分析师 : 刘叶 AC (86-21) 6106-6200 ye.liu@jpmorgan.com 登记编号 : S1730521090001 证券分析师 : 冯令天 AC (86-21) 6106 6359 billy.feng@jpmorgan.com 登记编号 : S1730520030005 证券分析师 : 许日 (86-21) 6106 6318 ri.xu@jpmchase.com 登记编号 : S1730522100001 摩根大通证券（中国）有限公司 资料来源：风格敞口数据源自摩根大通全球市场策略团队；其他所有图表中的数据均为公司数据或摩根大通估算 分析师声明及重要披露，包括非美国分析师披露，见第 39页。 领益智造 –H（领益）是一家一体化解决方案提供商，拥有专业的精密制 造能力，不断布局把握 AI驱动的多重结构性增长机会。我们认为凭借在 精密组件 /模组方面的专长以及热管理和先进材料方面持续提升的能力， 领益将受益于 AI基础设施投资提速、可折叠设备和机器人渗透率提高以 及消费级 AI终端设备的日益普及。特别是，包括热管理解决方案在内的 AI服务器相关应用可能成为中期内的盈利贡献来源。叠加持续的产品组 合扩张和产品结构升级，我们预计 2026 年下半年将录得强劲的盈利，成 为股价催化剂。 首次覆盖，给予 “增持”评级， 截至 2027 年6月的目标 价为 11港元。 •电子设备业务支撑盈利稳健增长。 领益一直是全球头部消费电子企业 的功能件、结构件和模组的主要供应商。随着智能手机和可折叠产品 （尤其是苹果产品）越来越多地采用先进高精密部件，我们预计在强 韧的下游需求、不断上升的价值量和持续扩大的市场份额的驱动下， 领益将实现稳健的盈利增长。同时，此类项目应有助于公司改善产品 结构、提升利润率并支持可持续的盈利增长。 •AI服务器热管理解决方案和机器人提供增量上行空间。 通过收购英伟 达供应链中的认证供应商 Readore （从 2026 年2月开始合并这项业务 ），领益扩大了在 AI服务器热管理领域的布局。我们预计受益于持续 的AI基础设施投资和不断扩大的先进热管理解决方案需求，领益将利 用其高精密制造能力和全球生产布局，驱动 Readore 的份额增长。同 时，领益与国内外头部机器人厂商建立了战略合作关系，通过提供高 精密组件、模组和系统组装服务，增强长期增长潜力。 •首次覆盖，给予 “增持”评级。 自6月26日上市以来，领益 -H股价跑 输恒生科技指数 46个百分点，我们认为这主要是由于市场对科技股的 风险偏好下降。我们预计 2025-28 年盈利年复合增长率为 37%，支撑 因素包括： 1）苹果产品的订单前景具有韧性； 2）领益在常规机型和 可折叠机型中的价值量和钱包份额不断提升； 3）Readore 和机器人业 务扩张，增厚盈利。我们截至 2027 年6月的目标价为 11港元，基于 15倍的 12个月滚动动态市盈率得出。主要风险包括下游需求疲软、竞 争激烈、并购不确定性、利润率压力和客户集中度。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 股价表现 年内迄今 1个月 3个月 12个月 绝对 - -12.5% - - 相对 - -16.0% - - 公司数据 已发行股票数（百万） 8,120 52周股价区间（港元） 11.80-6.08 总市值（百万美元） 6,460 汇率 7.84 自由流通股比例 55.1% 三个月日均成交量（百万） - 三个月日均成交额（百万美元） - 波动性（ 90天） - 指数 HSI 彭博 买入 |持有 |卖出 - 重要指标（财年 12月份结束） 单位：百万元，每股数据单位：元 FY25A FY26E FY27E FY28E 财务预测 收入 51,429 63,420 75,581 91,057 调整后的息税前利润 3,053 4,117 6,196 7,732 调整后的息税折旧摊销前利润 6,099 6,468 8,407 9,759 调整后的净利润 2,288 3,164 4,666 5 %，扣非归母净利润22.39亿元，同比+76.94%；毛利率31.01%，同比+4.73pcts，净利率14.74%，同比+1.72pcts。 26Q2公司实现营收87.01亿元，同比+53.44%，环比+31.92%，实现归母净利润14.01亿元，同比+61.33%，环比+64.81%，扣非归母净利润13.9亿元，同比+78.13%，环比+63.6%；毛利率32.41%，同比+4.83pcts，环比+3.25pcts，净利率16.13%，同比+0.8pct，环比+3.22pcts。PCB业务：26H1营收85.52亿元，同比+36.32%，毛利率36.85%，同比+2.43pcts。需求侧，数据中心AI服务器、高速光模块需求旺盛，其中AI服务器相关收入超20亿元，光模块特别是msap相关产能紧张，产品价格/盈利水平持续提升；产能端，公司南通四期、泰国产能持续释放，既有产能则向算力、光通倾斜优化，共同支撑业绩高增。 展望后续，26Q4公司asic客户新一代产品有望拉货，同时公司加速海外算力大客户导入，mSAP产能释放+无锡工厂建设进展顺利，26H2及后续业绩高增确定性高载板业务：26H1营收36.67亿元，同比+110.76%，毛利率31.35%，同比+16.20pcts 1）BT载板：25H2以来BT载板产能持续紧缺，公司结合市场情况进行多轮提价，盈利能力大幅改善，目前公司稼动/盈利维持高位，同时加速无锡/广州BT产能扩充，全年产值向百亿迈进，有望贡献重要业绩弹性 2）ABF载板：26年以来全球众多客户通过LTA锁产，ABF载板产能紧缺，公司量产工艺已达主流水平，26H1以来积极完成头部客户导入量产，26H2有望迎来进一步起量。投资观点：公司作为PCB龙头，卡位PCB高增速细分环节，充分受益ASIC、msap/光模块、电源等高增长斜率，同时扩产仍存在超预期空间；此外公司作为内资载板综合布局最领先的公司，BT快速扩产释放业绩，ABF则有望在全球缺货、技术升维下迎来全面放量。我们看好公司未来的增长机遇，持续重点推荐。欢迎联系 中信电子#文字观点", "publish_time": "2026-08-26 21:46", "tags": ["文字观点"]}, "post:2026-08-26T07-52:9ba3c8ba9001": {"id": "post:2026-08-26T07-52:9ba3c8ba9001", "kind": "post", "title": "2026-08-26 07:52", "source_label": "帖子正文", "excerpt": "❗【天风电新】欧陆通2026年半年报点评：经营规模持续扩大，高功率AI服务器电源保持强劲增长‑0825 ——————————— 财务摘要 2026H1：实现营收25.1亿元，同比+18%；归母净利润0.08亿元，同比‑94%", "content": "❗【天风电新】欧陆通2026年半年报点评：经营规模持续扩大，高功率AI服务器电源保持强劲增长‑0825 ——————————— 财务摘要 2026H1：实现营收25.1亿元，同比+18%；归母净利润0.08亿元，同比‑94%；剔除股权激励及可转债费用后经营性净利润0.18亿元，同比‑89%；综合毛利率17.9%，同比‑2.4pcts。 2026Q2：实现营收14.7亿元，同比+19%，环比+41%；归母净利润0.21亿元，同比‑75%，环比+264%；剔除股权激励及可转债费用后经营性净利润0.25亿元，同比‑73%，环比+446%；综合毛利率18.6%，同比‑2.6pcts，环比+1.6pcts；净利率1.4%，同比‑5.4pct，环比+2.6pcts。 26Q2业绩符合预期：公司单季度营收再创新高；利润承压主要来自行业竞争加剧、原材料、汇率波动叠加股权激励、可转债相关费用影响；#Q2环比盈利能力已有明显修复。26H1业绩拆分 收入口径 【消费电子电源】：营收9.2亿元，同比+12%；毛利率13.3%，同比‑3.9pcts。公司积极拓展新市场、新客户，板块营收保持正增长；毛利率承压主要受行业竞争加剧、原材料价格及汇率波动扰动。 【数据中心电源】：营收11.4亿元，同比+18%；毛利率23.3%，同比‑0.2pcts。#其中高功率AI服务器电源营收9.4亿元，同比+41%，占数据中心电源板块收入82 %，增长势头强劲。【高功率服务器电源维持较高盈利水平，整机柜服务器集中式供电方案等高价值量产品出货占比持续提升，对冲部分产品单价下行压力】。 【锂电设备电源及其他】：H1实现营收4.3亿元，同比+32%；毛利率10.9%，同比‑7.6pcts。公司持续开拓新领域产品布局，导入新客户带动板块收入高增；毛利率下滑主要源于新产品尚处导入期，初期盈利水平偏低。 投资建议 公司三大业务板块营收均实现同比增长，经营规模持续扩大；AI算力驱动下高功率服务器电源业务保持强劲增长，高价值整机柜集中式供电方案产品占比提升，是核心增长引擎；锂电设备电源新客户新产品拓展顺利。Q2盈利环比明显修复，后续看好高功率算力电源占比提升带动整体毛利率修复。 公司【已与海外头部CSP客户Google达成算力设备GPU电源项目合作，并与AMD、Juniper等重要客户建立合作关系】；此外，同步与英业达、仁宝等主流服务器系统商保持技术交流和业务接洽，进一步开拓全球市场。 中期维度，以谷歌2027/2028年TPU出货1200万/2500万颗算，按20%/25%份额预期下，对应增量收入约45/129亿元，增量利润11/32亿元，增量市值278/644e，叠加国内市场主业市值180/200e，合计目标市值458/844e，维持重点推荐。 ——————————— 欢迎交流：孙潇雅/高鑫#文字观点", "publish_time": "2026-08-26 07:52", "tags": ["Q2环比盈利能力已有明显修复", "文字观点"]}, "post:2026-08-26T17-13:d266598f15de": {"id": "post:2026-08-26T17-13:d266598f15de", "kind": "post", "title": "2026-08-26 17:13", "source_label": "帖子正文", "excerpt": "📑 金融时报 —— 长江存储：中国长江存储（YMTC）旨在闪存竞赛中超越三星和 SK 海力士🎯 长江存储（YMTC）正准备上市，目标是超越三星（Samsung）和 SK 海力士（SK Hynix），成为全球最大的 Nand 闪存生产商。📎 据两名知情人士透露，这家总部位于武汉的集团在最近的 IPO ", "content": "📑 金融时报 —— 长江存储：中国长江存储（YMTC）旨在闪存竞赛中超越三星和 SK 海力士🎯 长江存储（YMTC）正准备上市，目标是超越三星（Samsung）和 SK 海力士（SK Hynix），成为全球最大的 Nand 闪存生产商。 📎 据两名知情人士透露，这家总部位于武汉的集团在最近的 IPO 筹备会议上告诉投资者和利益相关者，它希望最早在 2027 年底前摘得全球 Nand 市场的桂冠。 💰 根据上海证券交易所网站发布的招股说明书，长江存储上周申请 IPO，拟融资 330 亿元人民币（约合 50 亿美元），主要用于升级生产设施以及研发。 📊 该芯片制造公司第一季度的营业收入为 470 亿元人民币（70 亿美元）。根据其 IPO 招股书显示，净利润为 330 亿元人民币，是 2025 年全年总额的两倍多。 📈 长江存储（YMTC）尚未设定上市时间表，预计交易开始后其市场估值将超过 1 万亿元人民币（1500 亿美元），成为今年中国第二大 IPO。然而，据一位参与该过程的银行家透露，在监管指导下，股票定价可能会趋于保守。 💡 他们补充道，市场共识将其 IPO 估值定在 2000 亿至 3000 亿元人民币之间，而确切数字在上市过程中尚未最终确定。 🚀 在长鑫存储（CXMT）成功上市后，长江存储加速了其 IPO 计划。长鑫存储是另一家中国领先的存储芯片制造公司，主要生产 DRAM 芯片。 ✨ 在上个月底筹集了 90 亿美元并完成今年亚洲规模最大的 IPO 后，该公司的估值飙升了 400% 以上。长鑫存储（CXMT）目前是中国市值最高的上市公司，市值达 5800 亿美元。 💾 Nand 芯片是一种可以在没有电源的情况下存储数据的硬件，最常见于智能手机和平板电脑等设备中。DRAM 芯片则用于临时存储数据，可用于计算机以及 AI 处理任务。 🔍 与 GPU 不同，GPU 需要美国制裁重点针对的尖端光刻生产设备，而存储器制造在很大程度上依赖于堆叠架构和工艺优化，在这些领域，中国公司已迅速缩小了能力差距。 🤝 通过利用国家补贴和世界领先的电子供应链，长江存储（YMTC）和长鑫存储（CXMT）都在 Nand 和 DRAM 市场中占据了更大的份额。 💵 这些收益不仅为他们提供了资助进一步研发所需的现金流，还赋予了他们将中国打造为全球技术生态系统中不可或缺参与者的筹码，无论西方贸易壁垒如何。 📋 根据研究咨询机构 TrendForce 的数据，长江存储（YMTC）在第一季度全球 Nand 生产商中排名全球第三、中国第一，仅次于三星和 SK 海力士。 📈 根据 TrendForce 的数据，去年全球 Nand 市场规模估计价值 710 亿美元，预计到 2026 年这一数字将攀升至约 3000 亿美元以上，到 2030 年，该市场规模预计将达到约 4900 亿美元。 ⚠️ 许多投资者担心，长鑫存储（CXMT）和长江存储雄心勃勃的扩张计划将导致存储芯片价格下滑，从而结束该板块股票的牛市行情。这些股票此前一直是人工智能热潮中最大的赢家。 🗣️ Ninety One 的投资组合经理 Joanna Yang 表示：“对于全球投资者而言，一个问题是这些中国公司的产能扩张将如何影响存储芯片的供需动态。这是一种全球性产品，其定价也是全球化的。” 💬 摩根大通私人银行（JPMorgan Private Bank）亚洲股票策略师 Cameron Chui 表示：“中国是否正在增加新产能？绝对是肯定的。” 😊 然而，由于训练人工智能模型所需的存储芯片需求不断增长，他仍对该行业保持乐观。“供应正在增长，但我们认为需求增长得更快。我们认为这不足以平衡市场。” 📭 长江存储（YMTC）未回应置评请求。#文字观点", "publish_time": "2026-08-26 17:13", "tags": ["文字观点"]}, "attachment:files/三全食品2026年中报业绩交流会20260825.pdf": {"id": "attachment:files/三全食品2026年中报业绩交流会20260825.pdf", "kind": "attachment", "title": "三全食品2026年中报业绩交流会20260825", "source_label": "其他", "excerpt": "美迪西2026年中报业绩说明会20260825 要点总结 1.2026H1核心业绩：扭亏为盈，单Q2净利率9.1%创近年新高 -营收端连续7个季度环比改善，Q2加速确认上行周期。2026H1营业收入7.61亿元，同比增长 41%", "content": "美迪西2026年中报业绩说明会20260825 要点总结 1.2026H1核心业绩：扭亏为盈，单Q2净利率9.1%创近年新高 -营收端连续7个季度环比改善，Q2加速确认上行周期。2026H1营业收入7.61亿元，同比增长 41%；单Q2收入接近4亿元，同比增长45%，净利润3600万元，净利率提升至9.1%，为近几年新 高，确认进入上行周期。 -收入增长受益于自2025年下半年起全球创新药研发需求持续回暖，公司作为国内少有的临床前一体 化综合CRO，订单储备为2026年及2027年业绩良性增长奠定基础。 2.业务分拆：临床前研究为增速最快板块 -药物发现与药学研究服务：2026H1收入3.47亿元，同比增长29%。 -临床前研究：2026H1收入4.14亿元，同比增长52%，为增速最快板块。 3.利润端扭亏为盈，毛利率同比大幅修复 -2026H1归母净利润5160万元，较上年同期增加6450万元，实现扭亏为盈；剔除股份支付费用影 响后的归母净利润为6614万元，同比增加7900万元。 -综合毛利率同比提升10个百分点至31.6%，为近三年来最佳水平（2024年全年毛利率17.36%）。 驱动因素为产能利用率及人效稳步提升、成本结构持续优化、内部提质增效措施推进。 4.海外业务保持高增 -2026H1境外新签订单同比增长46%，国际化业务快速推进；订单储备充足，全球化业务布局持续夯 实。 5.新签订单爆发式增长：量价齐升拆解与全年指引 -2026H1新签订单总额12.33亿元，同比增长104.74%；其中境内新签订单同比增长148%，境外新 签订单同比增长46%。单Q2新签订单环比增长40%以上，持续超预期。 -安评订单量价拆分：猴项目因猴子采购金额占订单金额比重大，价格增长贡献相对更大，量的增长幅 度低于价格增幅；报价端同样保持翻倍以上增长。 -服务费折扣率修复：实验猴项目（大动物）服务费折扣率已恢复至平均9折以上，部分甚至不打折； 非猴项目（安评）平均约7折；药效类（小动物为主）从过去5折以下恢复至当前6-7折左右。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 -2026年全年指引：Q2收入增速、主营毛利率及净利率均优于Q1，公司已将下半年管理目标修正为 以半年报趋势为指引，全年收入维持主要双位数增长。单Q2净利率9.1%可作为未来利润率恢复的参 考锚点。 6.实验猴：价格高位运行、供给端约束与公司保供策略 -猴价自2025年Q4起上行，2026年稳中有升，短期维持高位。供给端受种群老化和培育周期长影响 难以大规模放量；需求端创新药研发活跃，新分子、大分子药物项目增加。 -进口猴进展：第一批进口猴已完成隔离进入公司，自2026年8月起逐步投入项目；当前政策端未全 面放开，进口对国内猴价影响相对有限。 -保供策略三条路径并行：深化国内供应商合作提前锁定猴源；持续推进 影响；中期关注4500吨待点火产能点火时点、印尼项目进 展、原材料价格趋势、海外溢价维持情况、可转债转股价决策；长期关注小窑炉永久性退出节奏、单座 窑炉企业退出确定性、双寡头份额提升趋势、窑炉大型化最优规模探索。 问答整理 Q1：请问目前行业和公司的减产规划情况如何？后续减产或点火是否有新的计划？ 答：目前公司有减产计划，但具体减产时间及哪座窑炉减产尚未完全确定，仍在规划中。在当前价格水 平下，近期点火的可能性不大，行业各企业也以冷修为主，新点火意愿不足。待点火项目主要集中在头 部两家公司（公司和信义），后续将根据市场价格和走势确定点火节奏。 Q2：请问公司目前总产能规模如何？已冷修产能分别冷修多长时间？ 答：2024年公司冷修产能约6600吨，前年冷修约3600吨，今年冷修近2000吨。目前待点火产能约 4500吨。 Q3：请问目前能判断哪些产能可能彻底停产？包括公司和行业层面。 答：从行业来看，80%以上产能为千吨级。此前冷修的300吨、600吨甚至800吨的小产能大概率不 会重新开启，除非市场极端好转，但近1-2年看不到这种情况。去年和前年冷修的产能中，约40%- 50%除小窑炉外也包括千吨级大窑炉。后续若市场好转，小窑炉重开可能性不大，大窑炉仍可能有冷修 复产可能。 Q4：行业中有许多企业仅有一座窑炉，如果此类窑炉冷修时间过长，是否会因人员流失导致 重启困难？ 答：这确实是一个现实问题。目前行业约有21家企业，其中约12-13家（占2/3）仅剩一座窑炉，且 这些窑炉基本为大窑炉。如果这部分窑炉冷修，其订单、人员结构和配置将面临调整，后续可能不会再 重新点火。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 Q5：8月初2.0mm光伏玻璃价格已涨至9-9.5元/平方米，请问9月初价格是否可能进一步 上涨？后续产业链玻璃价格是否有望达到10元/平方米以上？ 答：价格走势主要看行业供需。如果冷修及部分企业减产落地，价格有望稳住甚至微调。 Q6：国内产能达到含税完全成本对应的玻璃价格大概在什么水平？ 答：这需要看当期成本波动。目前公司仍处于亏损状态，其他公司也可能亏损。 Q7：请问公司是否已与组件客户初步洽谈9月份光伏玻璃价格？组件企业对8月份涨价后的 接受程度如何？ 答：一般要到9月初再与客户协商新月价格。目前玻璃价格较低，占组件成本端比例不高，最核心的是 供需关系，若供需端有变化，价格适当上调问题不大。 Q8：请问公司对减产规模是否有底线预期？例如减至多少万吨后不再继续减产？ 答：目前没有明确的底线。行业供需结构相差不大，但库存端仍然偏高，市场将边走边看。 Q9：目前行业库存约40天，是否已属于合理水平？库存稳定后涨价动力是否有所减弱？行业 对当前价格是否满意？ 答：全行业对当前价格均认为偏低，因为全行业都在亏损。库存从5、6月至今有所回落，目前产能供 给与需求基本与组件月度排产相差不大。 Q10：7月国内装机规模增长较多，从光伏玻璃角度观察，组件需求环比趋势如何？ 答：组件需求在8月及9月相对稳定。总体来看，今年下半年国内需求应好于上半年，因上半年受出口 退税政策影响，1季度需求有所透支，4-6月需求回落明显，下半年需求将回到相对稳定状态。 Q11：玻璃价格上涨至何种水平时，行业内企业会认为比较合适？下游组件客户的接受度如 何？ 答：当前价格水平下所有企业都亏损，不太正常。如果产能减少、玻璃价格有所调整，大家会缓一口 气。若价格再往上走，玻璃价格会相对稳定。公司目前的减产计划也是希望稳住玻璃价格，当前价格较 为极端。 Q12：请问公司目前的库存情况如何？9月涨价预期下，下游是否有提前备货需求？ 答：公司库存一直低于行业平均，目前约25天。了解到组件端备货情况并不明显，因为玻璃供给和现 有库存端仍相对充裕。 Q13：公司海外产品的溢价情况及盈利优势如何？包括从国内出口和海外本土产能的情况。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 答：与去年相比，今年上半年外销比例有所上升，去年约30%，今年上半年约35%。海外整体盈利情 况相比国内偏好，但受中东局势影响，海外燃料成本上升，海外盈利情况较以往有所收窄。溢价情况因 地区、客户、产品发货地（国内或海外）及运费差异而不同。 Q14：公司印尼产能规划目前进展如何？ 答：印尼项目整体处于非常前期的建设阶段。印尼营商环境需进一步论证，受政府换届及政策支持力度 减弱影响，公司可能需再观望一段时间。 Q15：印尼项目第一座窑炉预计何时投产？目前是否有明确预期？ 答：目前难以预估第一座窑炉点火时间，因为建设仍处于前期。 Q16：公司海外收入占比已达35%，未来是否有进一步提升的可能？是否有计划将更多精力 投向海外客户？ 答：公司愿意拓展更多海外客户。海外外销占比将跟随订单变化，若海外市场良好，外销比例会自然提 高。 Q17：公司海外产能相比友商偏小，除印尼外，是否有考虑在越南或其他地区扩建新的海外产 能？ 答：公司会继续考察其他生产基地，后续若有落地想法将与投资者分享。 Q18：公司国内基地的燃料成本是否受到油气价格上涨的影响？ 答：国内受影响较小，因为国内多使用管道气，波动不大。四季度将与油气公司商谈旺季价格，预计会 有所上调。 Q19：公司二季度出现亏损，主要原因有哪些？下半年影响盈利的因素是否有修复趋势？出现 哪些边际变化时公司有望扭亏？ 答：亏损主要原因：一是成本端，海外燃料成本上升较多，影响集团整体盈利；二是价格端，二季度光 伏玻璃价格创历史新低，最低不到9元/平方米，全行业亏损。下半年盈利趋势需关注价格走势，价格 取决于供需格局。目前行业库存40多天，若库存下降至合理水平，价格调整将自然发生。此外，二季 度两座窑炉冷修导致部分固定资产减值约1.2亿元，存货也因价格下跌计提了减值损失。 Q20：剔除冷修减值和存货减值后，公司二季度光伏玻璃经营性单品的毛利或净利水平如何？ 答：二季度减值为1.2亿元左右，扣除后可自行计算。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 Q21：公司闲置固定资产原值28亿元，账面价值7.2亿元，其中是否主要为光伏玻璃产能？ 剩余账面价值是否有进一步减值的可能？ 答：公司已对冷修窑炉进行减值，剩余固定资产将根据后续计划进一步使用。目前闲置固定资产按准则 计提折旧和费用，管理费用有所增长，但进一步减值可能性不大，未来是否调整取决于后续轮休计划。 Q22：闲置固定资产中，以前的老旧小窑炉占比多少？ 答：对于未来现金流几乎为零的资产已完全计提减值，剩余闲置资产均有使用价值，包括未来点火或改 造更新。 Q23：公司在安徽、南通、印尼等地有新建产能，后续资本开支计划如何？ 答：后续资本开支不大，大部分项目已接近尾声，只需支付尾款。今年及明年整体资本开支将大幅下 降。 Q24：后续资本开支的体量是否可以量化？ 答：具体数据需查看更详细信息，但整体方向不会特别大。 Q25：公司可转债将于2028年到期，后续处置思路如何？是否考虑下修转股价或其他方案？ 答：最新董事会决议未来3个月不下修转股价，3个月后再结合二级市场表现和投资人反馈决定。当前 股价偏低。 Q26：公司如何展望下半年海外燃料成本？是否可能将成本上涨顺价至终端客户？ 答：下半年海外燃料端波动较大，难以预估。价格端会与客户协商，纯外资客户的价格协商相对容易顺 价。 Q27：海外市场（如印度）本土产能点火对供需和溢价水平有何影响？公司海外溢价能否维 持？盈利水平能否修复至燃料成本上涨前？ 答：印度本土产能较小，且5-6月受当地政策影响，发货不如一季度。海外产能目前约1.1-1.2万吨， 除头部企业外，纯海外供应商扩产较慢，规划落地需要时间。因此，未来2-3年左右的溢价水平应可维 持。 Q28：目前公司是否已将燃料成本波动部分成功顺价至下游？还是处于逐步顺价过程中？ 答：会有一些协商，但完全由客户承担尚需观察，不同客户之间存在差异。 Q29：公司与二三线企业的成本差异在什么区间？后续公司成本是否还有下降空间？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 答：公司与二三线企业一直保持十几个点的毛利差，在行业周期底部不但没有缩小反而扩大。成本下降 除规模优势外，主要来自大窑炉，若从1000吨升级到1500吨或更大，燃料端成本会显著下降。 Q30：公司对后续行业格局及自身份额的展望如何？ 答：过去1-2年，随着行业冷修，前两家企业（公司和信义）份额稳步提升。2024年行业冷修约4.34 万吨，今年冷修约1.6-1.7万吨，前两家市占率被动提升。公司有待点火产能和此前冷修产能，后续市 场好转将释放，两家格局将越来越清晰。 Q31：公司2、3月点火的考量是什么？后续是否会在行业不景气时继续逆周期扩张？此前关 于产能指标失效的讨论目前有何进展？是否会有产能因长期停产而被迫复产？ 答：年初点火因当时价格尚可，未如二季度般下跌，且一季度受出口退税政策影响需求不错。听证会制 度在21-22年因产能过剩担忧设立，但去年已有文件明确取消，后续按正常流程拿省里能评环评备案 即可，不存在指标失效问题。当前大家更关注投资回报，不会重新点火或新增点火。 Q32：后续行业反转主要依赖供给进一步收缩还是需求反转？未来几个月利润修复或减亏的驱 动力更多来自价格修复、需求改善还是小产能退出带来的供给收缩？ 答：供给端和需求端都需努力。供给端公司及行业将继续减产、冷修以缩减供给；需求端下半年可能回 暖，比上半年好。短期重点放在供给端减少，以稳住价格，这是各家企业可努力的方向。 Q33：印尼产能目前投入的资本开支占原计划比例是多少？若后续遇到困难，公司有哪些潜在 处理方式？作为头部企业，公司长期希望达到的合理利润水平是怎样的？ 答：印尼资本开支目前非常小，因为建设处于前期，审批端已通过但资本开支基本没有。公司处于观望 状态，后续方案待定。关于合理利润水平，目前难以确定，行业好时毛利率可达30%以上，但当前极 端情况无法给出具体指引。公司正尽力提质增效、降本以保持竞争优势。 Q34：公司提到燃料成本提高导致海外盈利收窄，但上半年财报显示外销毛利率同比提升7个 百分点，亚洲区域提升14个百分点，原因是什么？ 答：上半年海外生产成本提升，因美伊战争导致布油价格上涨，海外基地燃料成本上升，但该成本上升 具有一定递延性，因公司有燃料油安全库存，成本并未随原油价格大幅上涨而同步上涨，存在顺延。此 外，印度政策限制发生在6月，对上半年影响较小。 Q35：是否可以理解为燃料成本上升的影响将更多体现在下半年财报中？ 答：会顺延1-2个月。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 Q36：近期焦锑酸钠价格大跌，公司三季度以来光伏玻璃成本端是否因此有明显下降？ 答：焦锑酸钠价格下降对光伏玻璃成本下降作用较大，其是除燃料、纯碱、石英砂之外最大的成本来 源。公司凭借规模化采购优势和成本管控，有望享受这波成本下降影响。 Q37：目前焦锑酸钠价格是否还会继续下降？ 答：焦锑酸钠价格波动大，无法预测未来走势，但目前呈下降趋势。 Q38：目前焦锑酸钠在光伏玻璃成本中的占比是多少？ 答：这个问题过于细节，需要进一步查看。 Q39：公司收购福莱瑞晨主要是布局哪些新产品？是否有研发电子玻璃的计划？ 答：可能会做一些汽车玻璃加工，目前量非常小，先收回来尝试运作。 Q40：福莱瑞晨目前是否已有出货？还是处于研发阶段？ 答：会有一些出货，但量非常小。 Q41：南通1500吨窑炉已满产，相比之前的1200吨窑炉，成本能低多少？ 答：成本下降主要在燃料端，有个位数下降。 Q42：公司4500吨待点火产能是否为3座1500吨窑炉？ 答：不是，3座窑炉中1座为1200吨（在安徽），其余在南通。 Q43：南通待点火产能规模是多少？ 答：3300吨，规模会大一些。 Q44：公司未来扩产的窑炉规模是否会进一步提升？ 答：目前不确定。扩产1000吨时已算行业领先，随着技术成熟，行业会逐渐往大扩。公司目前1500 吨，未来若更大也将领先。公司会通过运营尝试寻找最优产能规模。 Q45：公司海外产能是否供应美国本土组件客户？其价格和盈利能力如何？ 答：公司有一些美国本土客户，去年也拓展了小型海外客户。美国盈利相比其他地方稍偏高。 Q46：公司海外产能中，供应中国组件企业、印度和美国企业的比例是否有拆分数据？ 答：目前没有拆分数据。 Q47：目前是否观察到美国本土客户规模有所增长？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408 答：有时难以追踪，因为直接出口是一部分，还有一些组件在国内生产后再出口，这部分不会追踪。过 去1-2年相对稳定，没有特别大波动，主要波动因素是燃料端，可跟随国际油价推测。 Q48：海外产能成本相比战争前涨幅多大？天然气实际成本有何变化？海外产能是否使用油还 是全部用天然气？ 答：海外产能会使用油。 Q49：从油和天然气成本来看，现在变化幅度是否有差异？ 答：变化不大，整体方向同涨同跌。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£ºWUXL3408", "status": "extracted"}, "post:2026-08-26T10-46:cc820ad149da": {"id": "post:2026-08-26T10-46:cc820ad149da", "kind": "post", "title": "2026-08-26 10:46", "source_label": "帖子正文", "excerpt": "杰普特：光纤器件放量带动业绩大幅向好，高端制造与光通信开启成长新周期🚀 ❗️业绩端：26H1收入14.87e同比+68.86%，归母1.95e同比+105.25%，扣非1.93e同比+110.84%。分季度看，26Q2收入8.26e，归母0.98e，扣非0.97e，#股权激励费用等影响表观利润、若剔", "content": "杰普特：光纤器件放量带动业绩大幅向好，高端制造与光通信开启成长新周期🚀 ❗️业绩端：26H1收入14.87e同比+68.86%，归母1.95e同比+105.25%，扣非1.93e同比+110.84%。分季度看，26Q2收入8.26e，归母0.98e，扣非0.97e，#股权激励费用等影响表观利润、若剔除 优化成效显现，应对波动韧性强。尽管防务领域受行业周期性需求波动影响出现阶段性下滑，但在新能源汽车、数据中心、工业装备等领域的强劲增长拉动下，公司整体收入实现正向增长：受益于前期定点项目陆续量产交付，新能源车业务收入实现快速增长；数据中心受益于AI 算力基础设施建设需求释放，工业装备业务受益于下游景气度回升，均保持良好增长势头。上半年，主营光器件的翔通光科技业绩同比实现翻番增长，90%收入配套800G 及1.6T 高速光模块、OCS 交换机、NPO、CPO，当前该子公司产能利用率高、订单饱满，部分排至27年。我们认为，公司战略引领产业优化成效明显，多元业务协同推进，应对单一行业波动的韧性得到提升；随着防务景气度向好，防务业务有望止跌回升，民品紧抓市场机会保持良好增长态势，带动总营收增速回升。  2、业绩超预期，Q2单季度环比高增，盈利能力较Q1环比改善明显。Q2单季度实现归母净利润7.21亿元，环比高增80.92%，超市场预期，带动公司上半年业绩下滑幅度明显收窄。Q2公司盈利能力较Q1改善明显：Q2单季度毛利率和净利率分别为29.36%和12.11%，较Q1分别增加1.36pct和3.43pct。上半年，公司期间费用率较去年同期有所提升，主要是（1），公司以持续稳定的研发投入致力于原创技术研究，研发费用率增加1.03pct（2）由于汇兑损失和利息费用减少，财务费用率增加0.96pct。在大宗物料价格上涨和防务占比阶段性下滑的不利影响下，公司精益管理纵深推进，Q2盈利能力出现回升，我们认为公司持续推动产业布局优化+战略成本管理，盈利能力有望逐步向好。 3、巩固防务首选供应商+多元化发展高端民品，公司变革中培育增长新动能。1）防务：坚持“方案+速度+成本”策略，积极布局无人、深水、星箭等新兴领域； 2）新能源车：聚焦“国际一流，国内主流”客户，抓汽车电动化、智能化发展契机，由高压互连向整车互连加速转型；3）数据中心：25年深度布局数据中心领域，电源、光纤、高速、液冷产品实现突破性应用，持续融入国内外头部客户高效能计算基础设施供应链，以大客户、大项目为抓手，继续保持业务快速增长。4）工业装备：聚焦龙头客户开发，依托深厚技术积淀，为各行业提供全场景的互连解决方案；我们认为随着多元化发展高端民品，民品的营收和利润贡献有望持续提升。 我们维持盈利预测，预计26年公司业绩重回增长，27年受民品业务拉动增速有望提速，预计26~28年EPS为1.15、1.33、1.54元，维持买入评级。 风险提示： 军工订单和收入确认不及预期；民品市场拓展不及预期；原材料涨价幅度比预期大等； 明天（8/27）下午3点，中航光电董事长、民品副总和董秘线上解读中报情况，欢迎大家报名外呼#文字观点", "publish_time": "2026-08-26 23:25", "tags": ["文字观点"]}, "post:2026-08-26T14-33:31d69fb69551": {"id": "post:2026-08-26T14-33:31d69fb69551", "kind": "post", "title": "2026-08-26 14:33", "source_label": "帖子正文", "excerpt": "生益电子副总经理陈正清回答称，公司持续推动技术成果向产业化端落地，报告期内，30层以上高多层板、高阶产品技术能力大幅升级；1.6T交换机配套PCB实现小批量量产", "content": "生益电子副总经理陈正清回答称，公司持续推动技术成果向产业化端落地，报告期内，30层以上高多层板、高阶产品技术能力大幅升级；1.6T交换机配套PCB实现小批量量产；卫星通信领域相关技术达到产业化应用要求；800G光模块PCB已批量生产，出货规模逐步提升，1.6T光模块PCB已打样测试中。#文字观点", "publish_time": "2026-08-26 14:33", "tags": ["文字观点"]}, "attachment:files/GS-新易盛（300502.SZ）：800G_16T 光模块驱动季度环比增长；2026 年二季度营收超预期；买入评级 Eoptolink (300502.SZ) Sequential QoQ growth ahead on 800G_16T optical modules ramp up; 2Q26 Rev better than expected;.pdf": {"id": "attachment:files/GS-新易盛（300502.SZ）：800G_16T 光模块驱动季度环比增长；2026 年二季度营收超预期；买入评级 Eoptolink (300502.SZ) Sequential QoQ growth ahead on 800G_16T optical modules ramp up; 2Q26 Rev better than expected;.pdf", "kind": "attachment", "title": "GS-新易盛（300502.SZ）：800G_16T 光模块驱动季度环比增长；2026 年二季度营收超预期；买入评级 Eoptolink (300502.SZ) Sequential QoQ growth ahead on 800G_16T optical modules ramp up; 2Q26 Rev better than expected;", "source_label": "GS", "excerpt": "Ting Song +852-2978-6466 | ting.song@gs.com Goldman Sachs (Asia) L.L.C. Allen Chang +852-2978-2930 | allen.k.chang@gs.com Goldman Sachs (Asia) L.L.C. Verena Jeng +852-2978-1681 | v", "content": "Ting Song +852-2978-6466 | ting.song@gs.com Goldman Sachs (Asia) L.L.C. Allen Chang +852-2978-2930 | allen.k.chang@gs.com Goldman Sachs (Asia) L.L.C. Verena Jeng +852-2978-1681 | verena.jeng@gs.com Goldman Sachs (Asia) L.L.C.Eoptolink (300502.SZ): Sequential QoQ growth ahead on 800G/ 1.6T optical modules ramp up; 2Q26 Rev better than expected; Buy25 August 2026 | 8:40AM HKT Eoptolink reports 2Q26 NI growth at 101% YoY/ 71% QoQ to Rmb4.8bn, in line with company’s guidance at Rmb4.2bn~Rmb6.2bn ( Report link ). The company delivered strong revenue growth at 51% QoQ/ 97% YoY to Rmb12.6bn, or 11%/ 6% higher than our estimates and Bloomberg consensus, and we attribute it to the (1) strong client demand on AI infrastructure expansion; (2) improving chipset supply vs. 1Q26; and (3) accelerated Silicon Photonics (SiPh) product ramp-up to support 1.6T optical module delivery. We remain positive on the company’s mix upgrade towards high-speed products onwards, meanwhile working with clients on NPO and scale-up solution to capture incremental opportunities. Maintain Buy. Capacity expansion with improving supply: The company’s inventory was up to Rmb11.7bn by end of 2Q26 (vs. Rmb9.0bn/ Rmb7.2bn by end of 1Q26/ 4Q25), and prepayment was up to Rmb869m (vs. Rmb682m/ Rmb17m by end of 1Q26/ 4Q25), supporting the company’s shipment ramp up in 2H26E. We see Eoptolink continues to expand the optical module capacity in China and Thailand, and has capability to offer both EML (100G/ 200G per lane) and SiPh solution to secure the production of 800G/ 1.6T and above optical modules. Earnings revisions: We factor in Eoptolink 2Q26 results and revise up earnings by 4%/ 7%/ 8% in 2026-28E mainly on higher revenues of 800G/ 1.6T optical modules shipment, supported by capacity expansion and improving supply. We keep GM and Opex ratio largely unchanged. Exhibit 1: Eoptolink 2Q26 result snapshot Rmb m 2Q25 1Q26 2Q26 QoQ YoY GS Act / GS Cons. Act / Cons. Revenues 6,385 8,338 12,572 51% 97% 11,283 11% 11,826 6% GP 2,978 4,099 6,030 47% 102% 5,384 12% 5,795 4% OP 2,641 3,835 5,561 45% 111% 5,105 9% Net income 2,370 2,774 4,755 71% 101% 4,649 2% 4,742 0% Margins GM 46.6% 49.2% 48.0% 47.7% 49.0% OPM 41.4% 46.0% 44.2% 45.2% 0.0% NM 37.1% 33.3% 37.8% 41.2% 40.1% Source: Company data, Goldman Sachs Global Investment Research Goldman Sachs does and seeks to do business with companies covered in its research reports. As a result, investors should be aware that the firm may have a con flict of interest that could a ffect the objectivity of this report. Investors should consider this report as only a single factor in making their investment decision. For Reg AC certification and other important disclosures, see the Disclosure Appendix, or go to www.gs.com/research/hedge.html . Analysts employed by non-US a ffiliates are not registered/quali fied as research analysts with FINRA in the U.S. Equity Research c45a43530f604d12bcb9a82b5aa6b9f6 Valuation: We continue to derive our target price using a near-term P/E (2027E P/E). The target P/E multiple is derived from peers’ avg. ratio of trading P/E to forward year fundamentals (NI YoY and OPM). We use a 27.8x target 2027E P/E (vs. previously at 29.3x) based on the company’s forward year avg. NI YoY and avg. OPM in 2027-28E. With higher earnings, our 12-month target price is revised up to Rmb639.0 (from Rmb633). The new target P/E at 27.8x is in line with Eoptolink’s historical avg. forward P/E at 28x since Sep 2018. ve等生态伙伴，另一方面引入华尔街资金搭建第三方算力融资。\u003c/li>\n\u003cli>今天出现的催化/验证：DeepSeek前7个月营收7070万美元、较2025年增长十倍，且正推进第二轮融资；大摩报告指出谷歌TPU v10（Icefish，1.4nm工艺）采用多模块分包模式，KGD模式、多供应商格局形成。\u003c/li>\n\u003cli>\u003cstrong>主线：半导体设备/零部件——MATCH法案预期升温，卡脖子品类涨价与国产替代逻辑强化\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：先进制程涂层类、静电卡盘、射频电源、真空阀体国产化率低；2026H1相关零部件已出现价格上涨；英杰电气12kW以上高功率射频电源技术仍落后，先进制程领域国产份额基本为0。\u003c/li>\n\u003cli>今天出现的催化/验证：专家会议详细拆解MATCH法案影响——将中芯国际、长江存储、长鑫、华虹列入限制名单，限制28nm以下浸没式DUV、低温刻蚀等设备及零部件供应，并限制海外厂商对已售设备提供维保服务；北方华创、芯源微、中科飞测三家设备龙头呈“订单高增、收入兑现、利润阶段性承压”共性。\u003c/li>\n\u003cli>\u003cstrong>主线：PCB/CCL-PTFE方案——订单落地，从预期走向产业化兑现\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：PTFE用于高频和高速，头部企业生产良率已达可量产水平；硅微粉在PCB材料中从辅材变主材，无论下游选M8/M9/M10还是PTFE方案，化学法球硅均会使用且用量持续增加。\u003c/li>\n\u003cli>今天出现的催化/验证：PTFE十几亿订单刚下、终端给NVIDIA，乐观1-2个月、慢则6个月形成PCB成品；NVIDIA内部基本确认除高阶HDI外，switch等后续方案将采用；联瑞新材被重申为PTFE方案最受益标的，量价利三重逻辑（M8填充比例50%+、PTFE达60%-75%）。\u003c/li>\n\u003cli>\u003cstrong>主线：光通信/CPO——订单与产能信号密集，海泰新光交流释放增量\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：光通信核心思路为基于PAM4工艺产能爬坡+围绕OCS、NRZ传输协议等新应用做产品研发；PBS明年中产能规划200-300万片/月、1.8美金/片，应用于1.6T/3.2T/2.4T相干产品。\u003c/li>\n\u003cli>今天出现的催化/验证：海泰新光已拿到美国新锐客户200万只隔离器订单（终端为A云厂商），后续潜在订单5000万只，原约定2027年8月锁定1000万只订单的计划近期有提前迹象；与硅谷新锐公司合作AOC、CPO、OBO等下一代光模块架构；子公司翔通光科技90%收入配套800G/1.6T光模块、OCS、NPO、CPO，部分排产至2027年。\u003c/li>\n\u003cli>\u003cstrong>主线：新能源/储能——海博思创Q2盈利能力超预期，固态电池产业化预期再升温\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：海博思创2026中报预告收入56-69亿元（同比+23.8%~52.6%）、归母6.2-7.0亿元（同比+96.3%~121%）；单Q2中值营收38.8亿元、归母4.56亿元（同比+106%、环比+125%），净利率超预期。\u003c/li>\n\u003cli>今天出现的催化/验证：上海市政府印发“十五五”规划，提出建设固态电池等多元技术路线对比测试示范基地，布局万千瓦级独立储能示范电站，并将全固态电池、液流电池、高性能钠离子电池列入下一代储能重点攻关方向。\u003c/li>\n\u003cli>\u003cstrong>主线：机器人/自动化——人形机器人商业化与ROI迎来良性转变\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：人形机器人进入商业化与投资回报率讨论阶段；英伟达业绩发布前夕，预测市场Kalshi显示交易员预计业绩会讨论超大规模云服务商需求（概率99%）、人形机器人（概率61%）等话题。\u003c/li>\n\u003cli>今天出现的催化/验证：GS参加2026世界机器人大会（8月19-24日）并与10家领先人形机器人公司会面，纪要标题即强调“商业化与投资回报率迎来良性转变”；中科创达2026H1营收43.05亿元/+30.46%，归母净利润2.46亿元/+54.97%，具身领域基于高通。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>英伟达FY2Q26业绩发布前夕（周三收盘后），市场焦点集中于管理层能否抬高中长期增长预期而非单季数字；盘中出现英伟达生态绑定策略的两条具体路径：直接股权投资+第三方算力融资。\u003c/li>\n\u003cli>DeepSeek营收数据首次规模化披露：前7个月营收约4.75亿元人民币（7070万美元），约为2025年全年的十倍，且正推进第二轮融资。\u003c/li>\n\u003cli>三星、SK海力士预计增加向英伟达出货的8层HBM4份额，主因英伟达采购策略转向确保更广泛的HBM选项以应对热管理问题并提升供应链稳定。\u003c/li>\n\u003cli>长江存储（YMTC）IPO推进：目标超越三星和SK海力士成为全球最大NAND闪存生产商。\u003c/li>\n\u003cli>韩国SK海力士回购动作被BofA解读为存储芯片行业积极信号，现货价格超预期。\u003c/li>\n\u003cli>中报密集落地：欧陆通、深南电路、海博思创、海致科技集团、石英股份、福莱特、药明生物、信达生物、长城汽车、桐昆股份、索辰科技等多家公司披露业绩或召开交流。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>英伟达FY2Q26财报发布后的管理层指引：关注能否进一步抬高市场对中长期增长的预期，以及超大规模云服务商需求、Cosmos。\u003c/li>\n\u003cli>MATCH法案落地进度：若正式落地，半导体零部件价格上涨与交期拉长的幅度、对国产替代节奏的推动。\u003c/li>\n\u003cli>PTFE订单从下达到PCB成品的转化周期：乐观1-2个月、最慢6个月，跟踪NVIDIA相关料号进展及硅微粉厂商订单兑现。\u003c/li>\n\u003cli>海泰新光隔离器订单的产能爬坡与锁单提前：客户5000万只潜在订单需求、原定2027年8月1000万只锁定计划是否提前。\u003c/li>\n\u003cli>深南电路AI PCB与载板业绩释放持续性（26H1营收152.96亿元/+46.33%）。\u003c/li>\n\u003cli>固态电池产业化节奏：上海“十五五”规划后示范电站与测试示范基地的落地进展。\u003c/li>\n\u003cli>长江存储IPO后续进程及对NAND闪存竞争格局影响。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>07:51｜【招商商社互联网】唯品会26Q2业绩会https://share.note.youdao.com/ynoteshare/index.htm...【中金互联网】唯品会2026年第2季度业绩电话会议纪要https://share.note.youdao.com/ynoteshare/index.htm...#笔记链接\u003c/li>\n\u003cli>07:52｜❗【天风电新】欧陆通2026年半年报点评：经营规模持续扩大，高功率AI服务器电源保持强劲增长‑0825 ——————————— 财务摘要 2026H1：实现营收25.1亿元，同比+18%；归母净利润0.08亿元，同比‑94%\u003c/li>\n\u003cli>08:08｜智谱和Minimax布财报之前，做空这两家公司的股票押注飙升至历史新高，凸显了投资者对中国人工智能领域激烈竞争日益增长的担忧。\u003c/li>\n\u003cli>08:14｜【兴证医药】伟思医疗2026年中报简评及电话会议邀请2026年上半年，公司实现营业收入2.26亿元，同比+7.59%；实现归母净利润1.00亿元，同比+44.43%\u003c/li>\n\u003cli>08:14｜迪伦·帕特尔：OpenAI 将在第三季度实现盈利\u003c/li>\n\u003cli>08:15｜【兴证医药】威高血净2026年中报整理2026年上半年，公司实现营业收入17.58亿元，同比-0.36%；归母净利润2.30亿元，同比+4.32%\u003c/li>\n\u003cli>08:15｜【兴证医药】康德莱2026年中报简评2026年上半年，公司实现营业收入10.89亿元，同比-3.21%；实现归母净利润1.12亿元，同比-10.23%\u003c/li>\n\u003cli>08:16｜【中信医药】信达生物2026H1简评：营收利润双高增，锚定2030年350-400亿 【业绩】： （1）总收入86.18亿元，同比+44.8%；产品收入82.02亿元，同比+56.7%（Q1/Q2分别38/43亿元，同比+50%/+60%）。\u003c/li>\n\u003cli>08:18｜特步国际2026年中期业绩发布会要点20260825业绩回顾：26H1集团收入67.95亿元，主品牌收入59.2亿元同比微跌2.2%，索康尼/迈乐收入8.75亿元同比增长11.4%。集团毛利率同比提升1.4pct至46.4%，净利润8.18亿元，净利率12%。\u003c/li>\n\u003cli>08:20｜孟加拉国拟购中国歼-10CE战斗机 孟加拉总理新闻与广播顾问拉赫曼星期二（8月25日）说，孟加拉正考虑从中国采购歼-10CE战斗机和攻击直升机，并朝正式谈判迈进。孟加拉政府一个小组目前正在起草协议。\u003c/li>\n\u003cli>08:21｜【国泰海通医药】药明生物2026年H1业绩：经调整归母净利润33.06亿元，同比增长38.4%；经调整净利润率28.0%（同比提升4.0个百分点） ❗️上调全年业绩指引❗️2026全年以固定汇率计，收入增速上调至同比20 – 23% (vs之前预计16-20%)\u003c/li>\n\u003cli>08:21｜【招商医药】药明生物发布2026中报：新增综合项目数再创新高，盈利能力持续提升2026年上半年实现收入117.87亿元（yoy+18.4%）；毛利率46.2%（yoy+3.5pct）\u003c/li>\n\u003c/ul>\n\u003ch3>附件正文\u003c/h3>\n\u003cul>\n\u003cli>AI产业链再审视：市场定价的分野20260825｜A股与港股复盘 2026年8月25日 研究笔记 · 不构成投资建议 第 1 / 11 页 股票市场复盘 洪灝：亚洲盘日间V型反弹，但A股市场宽度延伸 2026年8月25日 · 沪深15:00 / 港股16:08 主线 今日的核心不在于指数涨跌，而在于市场结构出现明显切换：涨停家数由昨日的 46 家跳升至 65 家，上涨个股达 4008 只。前期被无差别抛售的算力筹码，如今被资金按\"纯度\"重新定价——光模块双雄（中际旭创、新易盛）继续出清\u003c/li>\n\u003cli>Bernstein-美国中小盘软件网络安全的 AI 未来：一位企业家的 AI 安全愿景 U.S. SMID‑Cap Software AI‑future of Cybersecurity：An entrepreneur's AI security vision｜Bottom Line: Positive semiconductor CapEx datapoints during 2Q earnings season drive our WFE estimates meaningfully higher. We raise our 2026/27/28 WFE estimates to $150/$218/$281 bn (+36%/+45%/+29%) from $141/$186/$208\u003c/li>\n\u003cli>BofA-全球存储芯片行业——海力士回购释放积极信号，现货价格超预期，8月科技路演前瞻｜中国 证券研究 2026 年8月21日 领益智造 - H 首次覆盖 增持 1688.HK, 1688 HK 一体化精密解决方案提供商，锚定 AI驱动的增长周 期；首次覆盖，给予 “增持”评级 股价（ 2026 年8月21日）： 6.24 港元 目标价（ 2027 年6月）： 11.00 港元\u003c/li>\n\u003cli>GS-中国人形机器人 2026 世界机器人大会要点：商业化与投资回报率迎来良性转变 CHINA HUMANOID ROBOT 2026 WRC takeaways：Healthy shift to commercialization &amp; ROI｜We attended the 2026 World Robot Conference (WRC) across Aug 19-20, 2026 (with the full event running from Aug 19-24), and met with 10 leading humanoid robot companies: Engine AI, Fourier, Galaxea, Galbot, LimX Dynamics\u003c/li>\n\u003cli>GS-新易盛（300502.SZ）：800G_16T 光模块驱
