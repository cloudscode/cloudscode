u003cli>今天出现的催化/验证：SK海力士将重启中国大连NAND二期工厂建设，产能扩大约50%；美光Keybanc纪要显示内存紧张加剧；“味之素通知缩减大陆ABF膜供给30%”成为盘中卖方反馈。\u003c/li>\n\u003cli>对应证据来源：09:59自主可控梳理帖子、18:47 SK海力士帖子、08:41美光帖子、07:00 20260810复盘帖子。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>光通信/CPO（正文帖子=47）\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：美国拟出台中国光模块进口管控引发三大市场分歧（客户资源稳固性、产能规模与成本管控、全球多区域制造布局）；光模块产品带宽覆盖1.6T/2.4T/3.2T，封装路线含可插拔、LPO、NPO、CPO。\u003c/li>\n\u003cli>今天出现的催化/验证：高盛发布FCC相关产业解读及光模块行业报告；8月10日美股光通信板块大幅回调（LITE -8.61%/COHR -14.24%）；TIA成为光通信新瓶颈；源杰科技拟42.68亿元投建光芯片新基地。\u003c/li>\n\u003cli>对应证据来源：08:44/08:47高盛帖子、10:21中信证券前瞻帖子、12:10 TIA帖子、22:45广发通信帖子。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>机器人/自动化（正文帖子=57）\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：特斯拉Optimus工业化落地拐点已至，人形机器人+千亿算力基地双线共振；宇树上市将给国内本体厂明确估值锚，推动国产人形机器人产业链再定价。\u003c/li>\n\u003cli>今天出现的催化/验证：T链EDI系统下单启动，周订单200+，9月周产1k+；高盛报告称AI投资主题正从算力竞赛转向终端应用；天创时尚被指为特斯拉线控丝杠核心供应商、谐波柔性轴承国内市占第一。\u003c/li>\n\u003cli>对应证据来源：14:28国盛机械帖子、12:10长江电新帖子、20:11高盛帖子、08:56 CC电新帖子。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>PCB/CCL/铜箔（正文帖子=30）\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：AI硬件迭代催生层压机需求（Bubin架构→M9材料对层压机温度提出新要求、高端PCB/HDI平整度提升）；PCB/CCL层压机订单从龙头外溢，博可PCB压机交付周期超10个月、CCL层压机交期超1年；HVLP4代铜箔随Rubin系列放量。\u003c/li>\n\u003cli>今天出现的催化/验证：三孚新科HVLP4产品头部CCL客户送样顺利、有望Q3完成全部验证；鹏鼎控股以mSAP+高阶HDI能力迁移打开AI PCB第二成长曲线；UBS发布中国PCB与CCL行业报告。\u003c/li>\n\u003cli>对应证据来源：12:10国金机械帖子、09:22三孚新科帖子、12:14浙商电子帖子、UBS附件（正文已提取）。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>液冷/电源（正文帖子=30）\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：AI芯片迭代带动单机柜功率从传统10kW跃升至Rubin时代MW级别，AIDC负载波动幅度为传统IDC 15倍；供电路线并行AC UPS、240/336V HVDC、巴拿马电源、SST固态变压器，巴拿马电源不兼容英伟达800VDC标准。\u003c/li>\n\u003cli>今天出现的催化/验证：伯恩斯坦电话会显示AI数据中心扩张核心瓶颈转向电力与冷却设备供给能力；英伟达拟向“星际之门”电力开发商Lancium投资最高30亿美元；通合科技800V HVDC获强call；液冷产业链进入订单和业绩兑现强现实阶段。\u003c/li>\n\u003cli>对应证据来源：09:20 AIDC供电专题帖子、22:46伯恩斯坦帖子、07:02通合科技帖子、07:02腾龙股份帖子、液冷产业链附件（正文已提取）。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>大摩发布亚太AI供应链调研：英伟达Rubin Ultra可能采用分层HBM配置，缩短测试时间有望缓解短期产能瓶颈，Kyber机架无明确时间表。（来源：22:47帖子）\u003c/li>\n\u003cli>工业富联发布1H2026业绩：营收5578.61亿元同比+54.6%，归母净利润237.40亿元同比+96.0%，云服务商AI服务器收入同比+2.3倍。（来源：20:42、20:48帖子）\u003c/li>\n\u003cli>源杰科技公告拟投资建设“源杰半导体科技产业园项目”，总投资约42.68亿元，多家券商解读为光芯片扩产、行业高景气信号。（来源：22:45广发通信、22:48招商通信、23:14广发机械帖子）\u003c/li>\n\u003cli>SK海力士将重启中国大连NAND二期工厂建设，产能扩大约50%；并传出拟推出总额约100万亿韩元史上最大股东回报计划。（来源：18:47帖子、18:48财通策略帖子）\u003c/li>\n\u003cli>高盛集中发布光模块/FCC相关报告，覆盖国内头部光模块企业并给予买入评级，但明确不预判政策落地结果。（来源：08:44、08:47帖子）\u003c/li>\n\u003cli>特斯拉Optimus自2026年8月起嵌入现有整车产线，三季度弗里蒙特工厂投产Gen3；T链EDI系统下单正式启动。（来源：14:28国盛机械、12:10长江电新帖子）\u003c/li>\n\u003cli>财政部将于8月20日在澳门发行60亿元人民币国债。（来源：09:29东财固收帖子）\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>英伟达Kyber刀片服务器机架延迟的后续时间表，以及第一代Rubin Ultra机架沿用Oberon架构实现NVL72的实际落地进展。（来源：22:47帖子）\u003c/li>\n\u003cli>存储瓶颈演变：美光所述“上报需求很可能低估真实需求”的验证，以及HBM明年平均售价增幅能否兑现“超四成”预期。（来源：08:41帖子、07:20帖子）\u003c/li>\n\u003cli>源杰科技42.68亿元光芯片扩产项目的后续审批、建设进度及对光芯片供需格局的影响。（来源：22:45、22:48、23:14帖子）\u003c/li>\n\u003cli>光通信板块对美国FCC潜在进口管控的政策落地情况，以及高盛所提三大争议（客户资源、产能成本、多区域布局）的演绎。（来源：08:44/08:47高盛帖子）\u003c/li>\n\u003cli>机器人T链订单放量节奏：8-9月周产爬坡能否按“9月周产1k+”兑现，宇树上市进度对产业链估值锚的影响。（来源：12:10长江电新帖子）\u003c/li>\n\u003cli>盛视科技AI服务器到货与“贸易+服务”业务进展，以及B300现货报价在1450万/台之后能否延续上行。（来源：20:39帖子）\u003c/li>\n\u003cli>三孚新科HVLP4在头部CCL客户验证进展，是否按预期于Q3完成全部验证并拓展台系客户。（来源：09:22帖子）\u003c/li>\n\u003cli>AIDC供电架构切换进度：SST“硅进铜退”长周期逻辑下，燃气发电机组和SOFC作为北美AIDC主电源方案的上量情况。（来源：09:20帖子、08:13招商汽车帖子）\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003cul>\n\u003cli>帖子（22:47）：大摩基于亚太供应链调研，指出英伟达Rubin Ultra可能采用分层HBM配置以平衡供应、成本与workload需求，同时缩短测试时间有望缓解短期产能瓶颈。（AI算力/大模型）\u003c/li>\n\u003cli>帖子（08:41）：美光Keybanc纪要——内存紧张程度加剧，27财年紧张程度已超26财年，DRAM成AI基础设施头号瓶颈，仅能满足部分数据中心客户约一半需求。（半导体/先进封装）\u003c/li>\n\u003cli>帖子（20:39）：国海计算机——盛视科技推进AI服务器到货，8月B300优质可交割现货最高报价突破1450万/台，年初现货单价400万级别。（AI算力/大模型）\u003c/li>\n\u003cli>帖子（14:28）：国盛机械&amp;机器人——特斯拉Optimus工业化落地拐点已至，2026年8月起人形机器人结束演示属性嵌入整车产线，三季度弗里蒙特工厂投产Gen3。（机器人/自动化）\u003c/li>\n\u003cli>帖子（12:10）：TIA（跨阻放大器）成为光通信新瓶颈，AAOI创始人称800G/1.6T需求持续超产能，瓶颈在自身产能及TIA、DSP等组件供应。（光通信/CPO）\u003c/li>\n\u003cli>帖子（09:20）：AIDC供电专题——算力电力约束凸显，SST开启硅进铜退长周期，单机柜功率从传统10kW跃升至Rubin时代MW级别。（液冷/电源）\u003c/li>\n\u003cli>附件（正文已提取）：MS-全球IT硬件｜AI与芯片通胀：两大利好驱动，当前仅一个交易主线（Global IT Hardware AI + Chipflation Two Tailwinds, One Trade... For Now）。（AI算力/大模型）\u003c/li>\n\u003cli>附件（正文已提取）：GS-光网络：投资者关于美国拟对中国光收发模块实施进口限制所产生影响的三大核心争议（Optical Networking Top 3 investor debates）。（光通信/CPO）\u003c/li>\n\u003cli>附件（正文已提取）：JPM-全球存储市场｜全球存储总体市场规模与供需更新：股价回调已经结束，但存储行业危机仍在持续（Global Memory TAM and S&amp;D update）。（半导体/先进封装）\u003c/li>\n\u003cli>附件（正文已提取）：UBS-中国PCB与覆铜板行业：于动荡环境中保持韧性（China PCB and CCL Sector Remain steadfast through turbulence）。（PCB/CCL/铜箔）\u003c/li>\n\u003cli>附件（正文已提取）：Bernstein-寒武纪26财年二季度：营收增长乏力，但或仅为季度波动，盈利能力表现强劲。（光通信/CPO、PCB/CCL交叉引用）\u003c/li>\n\u003cli>附件（正文已提取）：AI制药主题投资策略-从模型跃迁到实验闭环20260810。（医药/AI应用）\u003c/li>\n\u003c/ul>\n\u003ch2>五、覆盖说明\u003c/h2>\n\u003cul>\n\u003cli>今日证据包覆盖日期2026-08-11（周二），目标模型deepseek-v4-flash；总帖数610，正文帖子581，带“文字观点”标签帖子375，覆盖时段06:59~23:59。\u003c/li>\n\u003cli>附件覆盖：总数465，正文成功提取307个，仅识别到文件名83个，正文提取失败75个。\u003c/li>\n\u003cli>今日正文涉及8条主线（AI算力/大模型、半导体/先进封装、宏观/策略、新能源/汽车、机器人/自动化、光通信/CPO、PCB/CCL/铜箔、液冷/电源），本纪要核心结论与主线均基于上述主线证据包中的正文帖子及正文已提取附件。\u003c/li>\n\u003cli>以下附件仅识别到文件名或正文提取失败，未提取正文，因此在正文级结论中未采用，仅在覆盖说明列示：Bernstein-美国多行业及电气设备（电源与散热组件采购动态）、Bernstein-全球半导体资本设备、BofA-英伟达公司融资结构、GS-中国策略（AI重塑格局）、MS-亚太科技（AI供应链GPU架构优化）、MS-SpaceX北美深度专题、【风口研报·洞察】特斯拉Optimus、【公告全知道】液冷+人形机器人、【大佬持仓跟踪】光模块+数据中心、AI的金融时刻20260811、7月出口回落后如何展望后续出口20260811、A股结构性修复行情持续20260811、Al+制药_从降本增效到分子创新等。\u003c/li>\n\u003cli>另有个别帖子被标注为“市场段子/小作文”（如10:30剑桥科技更新），在核心结论中未作为事实性证据使用。\u003c/li>\n\u003c/ul>\n\u003ch2>六、stocks.json命中来源索引\u003c/h2>\n\u003ch3>胜宏科技（300476.SZ）· 当天提及 40 次\u003c/h3>\n\u003cp>\u003cstrong>文字观点原文线索：\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003ccode>2026-08-11 20:36\u003c/code> 【西部计算机】 英伟达Rubin架构更新 1）Rubin相对Blackwell是一次小迭代，Feyman
