": ["文字观点", "市场段子"]}, "post:2026-08-11T12-53:d4ce0b51ed97": {"id": "post:2026-08-11T12-53:d4ce0b51ed97", "kind": "post", "title": "2026-08-11 12:53", "source_label": "帖子正文", "excerpt": "看好MIM新技术在液冷的渗透，今年有望实现0到1的突破。", "content": "", "publish_time": "2026-08-11 12:53", "tags": ["文字观点"]}}, "source_details": {"post:2026-08-11T22-47:64c1d0a7db70": {"id": "post:2026-08-11T22-47:64c1d0a7db70", "kind": "post", "title": "2026-08-11 22:47", "source_label": "帖子正文", "excerpt": "大摩基于亚太供应链调研，指出英伟达Rubin Ultra可能采用分层HBM配置以平衡供应、成本与 workload 需求，同时缩短测试时间有望缓解短期产能瓶颈，AI算力产业链正围绕内存约束与机架级扩展进行深度调整。GPU架构优化：HBM“降规”与机架延迟并存 英伟达Rubin Ultra预计推出多S", "content": "大摩基于亚太供应链调研，指出英伟达Rubin Ultra可能采用分层HBM配置以平衡供应、成本与 workload 需求，同时缩短测试时间有望缓解短期产能瓶颈，AI算力产业链正围绕内存约束与机架级扩展进行深度调整。 GPU架构优化：HBM“降规”与机架延迟并存 英伟达Rubin Ultra预计推出多SKU版本，高端款搭载HBM4e 8Hi，中低端款采用HBM4 12Hi或8Hi，核心驱动是HBM产能短缺、成本压力及不同 workload 对内存容量的差异化需求。最终方案预计2026年三季度末敲定，供应链调研显示HBM规格调整对长上下文窗口大语言模型的“解码（decoding）”环节影响大于“预填充（pre-fill）”环节。单芯片内存容量降低可能推高芯片整体出货量，利好以量驱动的供应商，且不排除主流ASIC项目因类似原因采用差异化HBM配置。 机架层面，英伟达Kyber刀片服务器机架因PCB与散热问题持续延迟，无明确时间表，第一代Rubin Ultra机架预计继续沿用Oberon架构实现NVL72配置，同时通过CPO/NPO技术支持NVL576级扩展。摩根士丹利长期看好CPO作为...", "publish_time": "2026-08-11 22:47", "tags": ["文字观点"]}, "post:2026-08-11T20-39:f5ac3c1c18e5": {"id": "post:2026-08-11T20-39:f5ac3c1c18e5", "kind": "post", "title": "2026-08-11 20:39", "source_label": "帖子正文", "excerpt": "＃盛视科技：算力业务稳定有序到货、贸易与服务并进 【国海计算机0811】 🔥#盛视科技积极推进AI服务器到货、贸易+服务并进 ✔8月，B300现阶段优质可交割现货最高报价已突破1450万/台，年初现货单价400万级别。公司持续稳定到货，＃贸易+服务业务可期。", "content": "＃盛视科技：算力业务稳定有序到货、贸易与服务并进 【国海计算机0811】 🔥#盛视科技积极推进AI服务器到货、贸易+服务并进 ✔8月，B300现阶段优质可交割现货最高报价已突破1450万/台，年初现货单价400万级别。公司持续稳定到货，＃贸易+服务业务可期。 ✔4月14日，公司首次公告拟采购11亿元IT设备，5月11日股东会表决同拟购买不超过60亿元IT设备，＃预计6-8月服务器有望持续大批量到货，整体供应链稳定，验证供应链核心优势。 ✔5月26日，公司公告签署60亿大客户订单。当前，国内CSP企业与头部模型公司对GPU需求旺盛，公司客户侧突破潜力大。 🔥#美国拟进一步封堵AI芯片通道、稳定供应链的稀缺性提升 ✔8月7日《彭博社》报道，美国正在审查受限国家AI企业如何在海外获取和使用英伟达先进芯片，正系统梳理相关AI企业获取先进芯片的渠道，重点关注两种情况：一是受限芯片经第三国流入受限国家，二是相关企业通过海外数据中心远程使用英伟达芯片。 ✔美国对AI芯片出口管制的升级或将导致供货整体趋严，但具备稀缺供应链能力的头部算租厂商的供应链资源稀缺性反而会增强，库存价值与新到货涨价空间或更...", "publish_time": "2026-08-11 20:39", "tags": ["文字观点"]}, "post:2026-08-11T20-42:1a5289f3d618": {"id": "post:2026-08-11T20-42:1a5289f3d618", "kind": "post", "title": "2026-08-11 20:42", "source_label": "帖子正文", "excerpt": "【国金计算机&通信】#工业富联1H点评：份额&单机柜附加值有望持续提升_Rubin链超核心受益股 #2Q26归母利润131亿元_主要系AI服务器订单&份额&利润率不断提升 ——1H2026：营收5,578.61亿元，同比+54.6%；归母净利润237.40亿元，同比+96.0%", "content": "【国金计算机&通信】#工业富联1H点评：份额&单机柜附加值有望持续提升_Rubin链超核心受益股 #2Q26归母利润131亿元_主要系AI服务器订单&份额&利润率不断提升 ——1H2026：营收5,578.61亿元，同比+54.6%；归母净利润237.40亿元，同比+96.0%；毛利率7.15%（同比+55bp），净利率4.26%（同比+90bp）。其中云计算板块同比增长75.7%，GPU AI服务器机柜出货量同比增长3.2倍，ASIC AI机柜出货量同比增长3倍，ASIC CPU服务器出货量同比增长2.5倍。 ——2Q2026：营收3,067.83亿元，同比+53.1%，环比+22.2%；归母净利润131.46亿元，同比+91.0%，环比+24.1%，毛利率6.99%（同比+49bp），净利率4.29%（同比+85bp，环比+7bp） ——业绩高增主要得益于：1）AI算力需求爆发，CSP和NeoCloud资本开支体量持续增长。2）公司在主要客户的市场份额提升。3）高利润率的AI服务器机柜收入占比提升。 #我们认为伴随Rubin的Q3出货_公司作为超核心受益股_业绩有望开启新一轮环...", "publish_time": "2026-08-11 20:42", "tags": ["文字观点"]}, "attachment:files/抓住八月反攻窗口科技怎么选20260809.mp3": {"id": "attachment:files/抓住八月反攻窗口科技怎么选20260809.mp3", "kind": "attachment", "title": "抓住八月反攻窗口科技怎么选20260809", "source_label": "其他", "excerpt": "", "content": "", "status": "title_only"}, "attachment:files/国投证券-大跌之后：总会有些变化-260809.pdf": {"id": "attachment:files/国投证券-大跌之后：总会有些变化-260809.pdf", "kind": "attachment", "title": "国投证券-大跌之后：总会有些变化-260809", "source_label": "国投证券", "excerpt": "本报告版权属于国投证券股份有限公司，各项声明请参见报告尾页。1 2026年08月09日 大跌之后：总会有些变化 策略定期报告 本周上证指数涨 2.81%，沪深300涨2.32%，创业板指涨 6.55%，恒生指数跌 0.84%。", "content": "本报告版权属于国投证券股份有限公司，各项声明请参见报告尾页。 1 2026年08月09日 大跌之后：总会有些变化 策略定期报告 本周上证指数涨 2.81%，沪深300涨2.32%，创业板指涨 6.55%，恒生指数跌 0.84%。 成长风格表现强于价值风格，小盘股涨幅居前，本周全 A日均交易额 23938亿，环 比上周有所上升。 在过去一段时间，我们强调在新老经济 K型分化没有收敛之前， 市场处于“无科技不成牛”状态， 除股息外其他低位板块较难系统性承接科技外溢 资金，对应7月至今煤炭石化等高股息板块领涨。目前看 ，一方面我们在 6月下旬 提示阶段性过热而形成的高切低获得验证， 随着A股高切低指数迅速回落接近区间 下沿30%，科技板块逐渐止跌回稳，本轮 6月下旬开启的再均衡行情已临近尾声； 另 一方面，对于本轮 AI科技浪潮更倾向于是 M顶，从\"杀情绪、杀估值、杀逻辑 \"三杀 框架看， “杀情绪”和“杀估值”已经明确，但 “杀逻辑”依然是无法确认的。事实 上，当前市场有相当多人认为机构本轮 AI科技持仓（ 6-7 成）显著超越历史茅宁抱 团水平，结合在交易层面已经明确破位，“ AI科技抱团”正在瓦解，类比 2021年春 节后“茅指数”和2021年底“宁组合”式产业浪潮最终结束的 M顶一顶已经明确。 根据日常模拟跟踪主动偏股公募基金持仓看， 7月下旬至今涨跌幅误差在上涨时转 正下跌时转负，对应基金实际仓位比估算更低，这意味着机构在 AI暴露出现明显下 降。在交流过程中，我们客观承认市场对 AI\"烧钱换增长 \"的态度已从过去三年无条 件支持转为审慎追问回报， 但目前巨大争议在宏观上时有反复或在产业上以偏概全， 更多界定为股价到高位后天然对利空信息比较敏感，仍无法明确其与产业逻辑的最 终受损相关，结合一顶模糊且有效地对应龙头单季度盈利最高位置 且偏离度一般不 会超过一个季度，直到目前我们对一顶明确仍有所保留。 同时，我们反复强调 A每次大跌之后总会有变化，每次高切低之后也都不会与此前 一模一样，有些品种跌下去后就再也回不来了，且反弹最持续的品种都未必是此前 下跌最多的品种。基于 2016年4月至2026年7月共十一轮高切低样本进行观察， 可以看到 1、低位补涨式高切低后前后主线一致性较强，高低普跌式高切低前后主 线一致性较弱。前者例如去年 Q3双创板块暴涨后 Q4进入HALO资产低位补涨，同期 双创板块作极为有韧性的高位波动，直到今年 4月再次开启暴涨；后者例如今年 3 月美伊冲突导致市场高低普跌，高切低之后可以看到黄金持续走弱，而 AI硬件供需 缺口作为 “新宁组合 ”崛起；2、相邻两轮主线 显著不一样 是常态，约 70%-80%概率 下是主线大换血， 20%-30%概率是仍然是同主线，决定主线切不切的不是涨幅大小， 而是旧主线产业景气能否跨期验证，即便前后是同主线，核心品种也发生一些变化。 1、全样本中仅有新能源（ 2020–2021）与AI（2024–2026）两段构成系统性延续。 当产业趋势可被反复验证时，中途所有下跌都不构成主线切换，而只是内部再平衡 或外部冲击导致的节奏中断，行情虽会被利率、关税、地缘等叙事打断，但最终仍 回归景气方向。例如 2021年春节后美债利率上行虽瓦解白酒抱团，新能源却在前后 两段均居涨幅第一，抱团对象仅由“白酒 +新能源”收敛为“新能源”。又例如本轮 AI主线中2025年4月对等关税导致 AI应用+机器人集体暴跌后，但资金并未离开 AI，前后关键变化是沿产业链由应用迁徙至景气验证度更高的算力硬件。 2、在科技产业定价中，这种变化多体现为或在核心龙头还是二三线品种切换（ 根据 “大-小-大-小（强阿尔法） ”规律），或在产业链上中下游间切换（根据科技产业投 资四阶段逻辑），或在海外映射和国产替代，在硬件和软件以及在涨价和量增（根 据产业实时催化）间切换。以 2020-2022年新能源产业链大 -小-大-小四阶段为例， 2020年新能源趋势从宁德开始→ 2021年10月之前抱团扩散到锂电产业链和汽车零 部件→10月之后过热阶段宁德时代带着二三线品种冲顶→ 2022年M顶一顶到二顶 之间转入以德方纳米天齐锂业等量价齐升二三线强阿尔法品种。 这意味着后续主线即便还是 AI，但内部核心赛道很有可能将再次切换，有相当大的 概率AI核心定价将在本次高切低后从“涨价”信号逐渐转向“量增”信号，可能落 在\"由Agent/推理需求爆发驱动的量增链条 \"——即Token推理算力（含国产算力芯 片、先进 Fab、先进封装、算力租赁等）、光模块出货量（ 1.6T放量）、 AIDC电力 配套、端侧 AI等，这点是需要重点提示的。在此，我们依然想着重强调的是：所谓 “将军不下马”，即在产业趋势没有结束（ AI 产业链二季度财报的业绩兑现程度）， 没有明确宏观 “灰犀牛”（国内严监管与海外步入激进加息周期）和行业竞争格局 崩塌（算力出现产能过剩）这两只拦路虎之前，即便出现短期阶段高切低，但市场 仍将在后续回到产业趋势的主线上。 风险提示：国内政策不及预期、海外货币政策变化超预期，历史测算不代表未来。 证券研究报告 林荣雄 分析师 SAC执业证书编号： S1450520010001 linrx1@sdicsc.com.cn 邹卓青 分析师 SAC执业证书编号： S1450524060001 zouzq2@sdicsc.com.cn 黄玮宗 分析师 SAC执业证书编号： S1450525070002 huangwz1@sdicsc.com.cn 相关报告 2026与2021:再均衡的宿命 2026-03-29 最关键问题： 类比 2021年初 还是类比 2022年初？ 2026-03-25 “躲”可以理解，但不至于 “跑” 2026-03-22 “一边倒”行不通 2026-03-15 永立潮头，东方不败 ——基 于实战检验的 A股 “抓主线” 投资方法论 2026-03-13 下载日志已记录，仅供内部参考 策略 将就业报告整体解读为劳动力市场降温，交易员迅速下调 9月加息押注， 10年期美债 收益率全周下行约 10个基点，美元指数跌至一个半月低位，利率压力缓解直接推升美股风 险偏好， 三大指数周五应声齐涨。 三、 AI财报季业绩分化主导结构性行情。 SpaceX、Palantir 财报大超预期，亚马逊、 Meta绩后走强，强化 AI盈利兑现信心； AMD、闪迪、西部数据指引 不及预期，则一度引发 AI资本开支回报疑虑、压制科技股短线表现。最终业绩兑现逻辑占 优，费城半导体指数全周累涨超 9%、英伟达一周涨超 10%，科技板块成为纳指的核心拉动 。 本周美股整体走强，背后是两条主线的共振：一方面，非农数据意外疲软令加息预期降温， 叠加霍尔木兹海峡风险溢价消退，市场风险偏好明显改善；另一方面， AI财报季业绩兑现带 动科技与半导体板块大涨，成为指数上行的主要拉动。后续来看，一是 AI财报季的定价仍 在延续，本周 SpaceX、Palantir 等超预期财报获得资金奖励，但 AMD、闪迪、西部数据指引 不及预期已引发抛售，市场对已披露财报的消化和对 AI资本开支回报的质疑短期内难以消 散，若后续指引转弱，科技板块波动将明显放大；二是霍尔木兹海峡协议尚未正式落地，谈 判仍存反复，若海峡通行再度受阻，油价可能重新上行并推升通胀预期，对市场风险偏好形 成压制； 三是下周美国 7月CPI与成屋销售数据将检验通胀回落成色， 若核心通胀延续降温， 加息预期将进一步弱化，反之 9月加息风险将重新抬升。短期市场或以震荡为主，后续方向 取决于通胀数据、 AI业绩兑现持续性及地缘局势演变 。 本周主要港股指数涨跌 不一。恒生指数累跌 0.84%，恒生科技累涨 0.60%。盘面上，原材料业 板块领涨， 周涨幅达 10.00%； 医疗保健业上涨 8.50%， 资讯科技业上涨 5.89%， 工业上涨 5.81%， 非必需性消费上涨 0.18%。下跌板块方面，金融业跌幅居前，周跌幅为 3.83%；电讯业下跌 2.98%， 公用事业下跌 2.91%， 必需性消费下跌 2.59%， 能源业下跌 2.34%， 综合企业下跌 1.32%， 地产建筑业下跌 0.40%。 总体来看， 本周港股原材料业、 医疗保健业和资讯科技业表现强势， 主要受铜价上行、创新药业绩爆发及 AI大模型行情带动；金融业、电讯业、必需性消费及能 源业则承压明显 。 本周港股走势分化，核心驱动因素如下：一、市场传出境外保单收益将按 20%征税，保险股 承压，保诚、汇丰、渣打股价一度走低，金融业领跌恒指板块。二、中国 7月服务业 PMI扩 张放缓，反映内需修复偏慢，必需性消费和综合企业承压；与此同时，市场风格向科技成长 倾斜，资金从电讯、公用事业等防御板块流出，相关权重板块明显走弱。三、政策与 AI产业 下载日志已记录，仅供内部参考 策略定期报告 本报告版权属于国投证券股份有限公司，各项声明请参见报告尾页。 5 催化提供对冲。证监会主席吴清表态推进人民币股票交易柜台、 REITs纳入沪深港通并支持 优质港股境内上市；阿里巴巴发布千问 3.8-MAX带动阿里港股大涨， DeepSeek 单周调用量登 顶全球第一并宣布涨价， AI行情支撑资讯科技板块和恒生科技收涨。四、外需与结构性行情 提供支撑。中国 7月出口同比增 23.9%、进口同比增 27.5%，其中芯片出口同比大增 117%， 外需韧性提振市场情绪；铜价全周上涨 2.09%，带动港股原材料业大涨 10.00%；药明康德上 半年营收同比增 38.93%、净利同比增 29.43%，并全面上调全年指引，带动医疗保健业上涨 8.50%；而国际油价全周累跌逾 12%，拖累能源业下跌 2.34%。 本周恒指收跌 0.84%、恒生科技收涨 0.60%，恒指受金融、电讯等权重板块拖累，恒生科技 则靠AI大模型行情支撑，两者明显分化。展望后市，支撑与压制因素并存。支撑方面，证 监会推进人民币股票交易柜台、 REITs纳入沪深港通等政策若加快落地等，将改善港股流动 性与制度环境；阿里、 DeepSeek 等AI大模型产业催化仍在发酵，科技板块情绪有望延续。 压制方面， 下周美国 7月CPI是关键变量，若核心通胀反弹， 9月加息担忧将重燃并压制港 股估值；霍尔木兹协议落地存变数，油价反复可能扰动风险偏好； AI资本开支回报疑虑与美 联储独立性扰动短期难消， 港股科网仍将跟随海外科技波动。 整体看， 港股预计维持高波动， 方向取决于通胀数据、海峡协议进度及 AI行情持续性。 本周美股普涨、港股涨跌不一（ %） 资料来源： Wind，国投证券证券研究所 第一，本周上证指数涨 2.81%，沪深300涨2.32%，中证500涨6.49%，创业板指涨 6.55%， 恒生指数跌 0.8 业趋势可被反复验证时，中途所有下跌都不构 成主线切换，而只是内部再平衡或外部冲击导致的节奏中断，行情虽会被利率、关税、 地缘等叙事打断， 但最终仍回归景气方向： 2021年春节后美债利率上行虽瓦解白酒抱团， 新能源却在前后两段均居涨幅第一， 抱团对象仅由 “白酒+新能源 ”收敛为 “新能源+资源”； 2025年4月对等关税导致 AI应用+机器人集体暴跌后，资金并未离开 AI，而是沿产业链 由应用迁徙至景气验证度更高的算力硬件。因此，当一轮下跌发生，首要判断不是 “切换 到什么风格 ”，而是 “这条主线背后的产业景气是否已到达拐点 ”；若订单、资本开支与量 价逻辑未被证伪，多数属于上车点而非下车点。 第四， 落到当前， 2026年7月起AI硬科技高位补跌、煤炭与石油石化及银行等红利资源相对 占优，其结构与 2021年11月新能源估值极致后深跌去化的形态高度相似，而尚未出现 足以定义下一主线的新现象级产业趋势。据此框架，判断的核心仍在于 AI产业景气（订 单、资本开支、量价）在估值消化之后能否重新主导定价：若能，则更接近 2025年式急 跌后回归， 下一轮主线仍是 AI； 若出现可匹敌的新趋势或强政策主线， 则转为风格切换； 若长期滞留红利资源而缺乏新的产业锚，则 2022年式混沌空窗的风险相应上升。 第五， 根据上述规律推断，我们认为 下一轮高位主线大概率仍是 AI，但内部核心赛道将再次切 换。上一轮主线的核心逻辑是“价涨”，而 下一轮AI主线的核心 可能落在\"由Agent/推 理需求爆发驱动的量增链条 \"——即Token推理算力（含国产算力芯片 、先进Fab、先进 封装、算力租赁等 ）、光模块出货量（ 1.6T放量）、 AIDC电力配套 、端侧AI等。 A股高切低指数目前快速下降已经接近区间底部 资料来源： Wind、国投证券证券研究所 下载日志已记录，仅供内部参考 策略定期报告 本报告版权属于国投证券股份有限公司，各项声明请参见报告尾页。 12 A股高切低历史行情中高位主线的回顾和涨跌幅梳理 资料来源： Wind、国投证券证券研究所 A股高切低主线切换逻辑图 资料来源： Wind、国投证券证券研究所 第五，本周科技领域尤其是 AI硬件集体反弹，部分个股反弹幅度较大，整体来看我们认为本 周的行情属于情绪极致释放后的超跌反弹，从前面对于高切低行情的复盘来看，大概率不是 全面反转和冲击前高的行情。我们从行业和个股两个层面深入观察： 从细分行业层面看， 领涨的PCB(+30.1%) 、半导体材料 (+20.2%) 、光通信 (+19.7%) 、电子布 (+17.2%) 、MLCC(+13.9%) 本质是同一条逻辑 ——\"AI硬件涨价 +放量\"双击。这些方向的共同 点是\"涨价验证、 订单锁定 \"， 且中报业绩正在兑现 。排名靠前但更依赖 \"算力增量 \"的光通信、 GPU、服务器指数（ +10%~+20% ）由英伟达催化 +龙头业绩预告驱动 。总计而言，本轮 AI硬件 的反弹， 优先关注\"涨价+放量+业绩兑现 \"三重确定性的中上游材料 /元件（PCB链、MLCC、光 模块），其次才是逻辑正确但需等待利空落地的存储、设备 。若后续存储反噬利空充分释放 （关注CSPcapex指引、韩系厂商长协 /反买动向），存储有望迎来 \"二次产业回归 \"的补涨， 这是当前排名靠后方向的潜在超额收益来源。 从个股层面看，呈现“超跌反弹”特征，前期跌幅越深，本轮反弹越快： 8月反弹幅度 与7月 跌幅呈清晰的负相关： 7月跌幅在 -40%~-60%区间的个股， 8月反弹普遍落在 15%~40%甚至更 下载日志已记录，仅供内部参考", "status": "extracted"}, "post:2026-08-11T09-59:295a19885780": {"id": "post:2026-08-11T09-59:295a19885780", "kind": "post", "title": "2026-08-11 09:59", "source_label": "帖子正文", "excerpt": "自主可控梳理--AI 新材料更新（0811） 1、芯碁微装：光刻设备打通 pcb/msap/载板/先进封装，立身合肥科技圈。pcb（含msap）载板、先进封装的海外竞对包括美资奥宝/日资ORC/日资牛尾/日资网屏/日资尼康/瑞典迈康尼。", "content": "自主可控梳理--AI 新材料更新（0811） 1、芯碁微装：光刻设备打通 pcb/msap/载板/先进封装，立身合肥科技圈。pcb（含msap）载板、先进封装的海外竞对包括美资奥宝/日资ORC/日资牛尾/日资网屏/日资尼康/瑞典迈康尼。 【#国产替代】性价比更高，外资交期12- 往往缺少长 期样本，主观研究 具备更强灵活性， 通过提炼变局下的交易主线 ， 具有提前识别中长周期风险 的能力，同时也能够通过对短期地缘局 势等复杂问题的深入研究，为投资组合 短期避险 调整提供前瞻性指 引。 单资产量化 控波工具丰富， 可 形成 “预测-择时-控仓” 闭环。 GARCH 组模型实现动态波动率预测并支撑目标波动率策略， BSADF、 LPPLS 针对资产泡沫区间与临界时点风险预警。 HMM市场状态识 别、 防御性因子指标 可提供择时避险信号。 凯利公式、 CPPI/TIPP 组 合保险策略划定仓位安全底线 ，对于控制回撤具有针对性效果 。 多资产量化工具实现风险分层约束与动态调整。 低波底仓配置从源 头弱化常态下组合共振风险，时间 /阈值再平衡持续修正风险权重漂 移。配置模型端从传统均值方差、 BL 收益导向模型，向风险平价、 风险预算等风险导向型模型和 ES、CDaR 尾部约束型模型升级， 因 子配置模型则 以风险贡献分配组合敞口 ， 进一步提升风险穿透能力 。 极值理论、 Copula、因果传染网络刻画极端行情下资产尾部相关性 突变与波动传导路径 ，解决传统模型低估危机损失的缺陷。 综合上述模型，我们对资产配置风险控制流程进行了模拟 ，多环节 复合控波效果明显 。结合 DCC -GARCH、LPPLS、C-V ine-Copula、 TIPP、目标波动率 模型的控波流程对于常态波动、交易泡沫风险、 尾部风险、组合回撤进行了针对性控制，以沪深 300、标普 500、黄 金、固收为投资工具的 MVO模型在 3%目标波动率的情况下， 在回 测期内可实现年化收益 6.15%，夏普比 率2.21，最大回撤 2.99%的 综合表现。 风险因素： 历史回测结果不代表未来收益，因子有效性可能随宏观 环境、政策框架和市场结构变化而阶段性减弱；量化模型基于历史 数据构建，而历史规律存在失效风险。 下载日志已记录，仅供内部参考 通用报告 请务必阅读正文之后的免责条款部分 2 of 32 目录 1. 多资产策略的题眼 ——穿越周期 ................................ ........................... 3 2. 心法篇：主观控波的艺术 ................................ ................................ ..... 4 2.1. 长期控波 ——从美林周期 、信贷周期到多周期协同框架 .................. 4 2.2. 短期避险 ——从高频指标中把握市场情绪与政策变化 ...................... 6 2.3. 桥水历史最大的教训 ——敬畏市场 ，避免过度押注 ......................... 7 3. 单资产量化控波兵器谱 ................................ ................................ ......... 8 3.1. 波动预测模型 ................................ ................................ ................. 9 3.2. 目标波动率策略 ................................ ................................ ............ 10 3.3. 泡沫识别算法 ................................ ................................ ............... 10 3.3.1. ADF与BSADF泡沫识别 ................................ ........................ 11 3.3.2. LPPLS模型 ................................ ................................ ............ 12 3.4. 量化择时与市场状态 识别 ................................ .............................. 13 3.5. BARRA多因子模型 ................................ ................................ ...... 14 3.6. 仓位控制与组合保险 ................................ ................. ，缓冲了市场波动带来的冲击，历史数据显示，合理 的多资产配置可将组合波动降低 50%以上，在牛熊交替的市场环境中，展 现出更强的抗风险能力和收益稳定性。 市场环境的变化推动投资者需求发生根本性转变，从过去单纯追求高收益， 逐步转向追求“稳健收益”和“绝对收益” 。 2026年以来的市场波动，让越 来越多的投资者意识到， “赚得住”比“赚得多”更重要，过度追求短期高 收益往往会面临大幅亏损的风险，因此，能够有效控制波动、实现稳健增值 的投资策略，成为市场的核心需求。 投资者需求的转变直接反映在产品规模的变化上，多资产策略兼具提高收 益和控制波动的能力， 规模不断提升。 自2024年年末以来， 二级债基和 FOF 基金规模的持续增长， 印证了在低利率环境下， 大量风险承担意愿偏弱的投 资者对多资产策略更加青睐，多资产策略的波动回撤控制能力已成为此类 资管产品的核心能力。 下载日志已记录，仅供内部参考 通用报告 请务必阅读正文之后的免责条款部分 4 of 32 图1：国内代表性多资产基金规模快速上升 资料来源： Wind，国泰海通证券研究 2. 心法篇：主观控波的艺术 在波动控制的两大 方法论中，主观分析与量化模型各有侧重、相辅相成，其 中量化模型依赖数据与算法， 擅长捕捉 常态市场规律， 但难以应对政策突变、 地缘冲突等 难以量化因素带来的波动和长周期的市场机制变化 。美林时钟、 本土化货币信用周期等曾长期作为主观研究的重要工具验证了主观择时避 险效果。 当前经济结构与资本市场面对长期机制转换的挑战， 而政策突变、 地缘冲突、 产业制度变革等往往缺少长期样本， 主观研究 具备更强灵活性， 通过提炼变局下的交易主线 ，具有提前识别中长周期风险 的能力， 同时也能 够通过对于短期地缘局势等复杂问题的深入研究，为投资组合 短期避险 调 整提供前 瞻性指引。 2.1. 长期控波 ——从美林周期、信贷周期到多周期协同框架 主观控波的长期逻辑， 离不开对经济周期的深度把握， 投资时钟模型是长期 风险控制 的核心工具， 其清晰展示了在不同经济周期阶段， 如何调整资产配 置以实现收益最大化和风险最小化。 该模型以经济周期为核心， 将资产配置 与经济周期阶段精准匹配， 通过识别经济周期的拐点， 提前调整资产配置比 例，从而规避周期波动带来的风险 ，主观周期研究 是长期控波 御险的“心法 ”。 投资时钟模型的经典代表的是美林时钟， 美林证券通过对 2004年以前逾 30 年的全球资产表现进行系统总结， 提炼出完 整的美林时钟逻辑， 将经济周期 明确划分为复苏、过热、滞胀、衰退四个阶段，并对应不同的最优资产配置 方向。其中，复苏阶段股票表现最优，过热阶段商品表现领先，滞胀阶段现 金为王， 衰退阶段债券表现最佳， 这一逻辑为长期资产配置提供了清晰的框 架，成为主观长期控波的重要参考。 0500010000150002000025000 2024/12/31 2025/03/31 2025/06/30 2025/09/30 2025/12/31 2026/03/31 2026/05/31混合债券型二级基金 FOF基金 （亿元） 下载日志已记录，仅供内部参考 通用报告 请务必阅读正文之后的免责条款部分 5 of 32 图2：美林时钟模型将经济周期划分为 4个典型状态 资料来源：美林证券 需要注意的是， 美林时钟在我国市场的适用性有所褪色， 我国经济与政策环 境具有自身 特殊性， 因而美林时钟 难以直接套用。 我国货币政策需兼顾经济 增长、充分就业、物价稳定、内外平衡、防范金融风险等多重目标，与美林 时钟背后基于单一目标的政策逻辑存在差异； 同时， 我国大类资产表现不仅 受基本面和货币政策影响，还受金融监管、改革等政策的显著影响，部分行 情与实体经济周期脱节， 再加上通胀指标的度量差异， 导致传统美林时钟在 我国的准确率大幅下降，难以直接用于主观控波实践。 2008年金融危机的爆发，让全球投资者深刻意识到货币宽松与信用扩张并 非等同， 也推动经济周期研究从单一经济周期， 延伸至货币周期与信用周期 的协同分析。货币周期聚焦于 央行政策主导的基础货币供给与市场利率变 化，核心关注利率调整、降准降息、公开市场操作等央行行为，反映市场流 动性的松紧程度；而信用周期则反映实体部门（企业、居民、政府）的融资 意愿和银行信贷投放能力，核心关注信贷规模、社融增速等指标，两者的协 同变化，共同决定了宏观经济的走势与资产价格的波动方向。 基于我国经济发展特征，以货币和信用周期作为划分 投资时钟的 变量在我 国市场长期具有较好的实践效果 ，该方法将经济周期划分为 “宽货币 +紧信 用”、“宽货币 +宽信用 ”、“紧货币 +宽信用 ”、“紧货币 +紧信用 ”四个阶段 ，每 个阶段对应  -2000年的无通胀 经济繁荣，这两个关键因素的误判，直接导致其投资策略全面溃败。 此次失败也让达利欧深刻反思 ，提出了 “痛苦 +反思 =进步 ”的理念，逐步构建 了更完善的宏观分析框架。 同时这一经历也推动桥水基金和达利欧开始关 注放弃宏观预判的策略。最终， 全天候策略于 1996年推出， 该策略以无需 预测未来 经济状态为特点， 通过均衡配置适配各类宏观超预期情景的资产， 实现跨周期稳健收益 。 图3：全天候策略对于经济状态的划分 资料来源： 桥水基金 过去几年，全球宏观环境经历了百年未有的复杂局面，从 2020年新冠疫情 的突发冲击，到 2022年开始的全球性高通胀与激进加息周期，再到地缘政 治冲突不断， 仅仅依赖 基于历史经验和直观判断的决策方式， 难以 捕捉多个 市场的快速变化。市场波动的突发性、复杂性、关联性大幅提升，单一的主 观研判难以覆盖所有风险变量，主观控波的难度显著增加。 3. 单资产量化控波 兵器谱 与主观派的困境形成鲜明对比的是，部分量化宏观策略凭借对市场流动性 的实时监控和压力测试模型， 成功规避了最严重的损失， 这种鲜明对比引发 了行业对投资方法论的深思。量化模型的优势在于能够实时捕捉市场数据 变化，快速响应市场波动，通过压力测试提前应对极端风险，而这正是传统 主观分析的短板， 也推动主观派开始借鉴量化方法， 完善自身的波动控制体 系。 行业趋势的变化也印证了这一转型方向，越来越多的新兴对冲基金开始将 下载日志已记录，仅供内部参考 通用报告 请务必阅读正文之后的免责条款部分 9 of 32 量化方法应用于宏观投资，主观与量化的融合成为行业发展的主流。根据 Preqin数据， 2020年以来，采用量化宏观策略的 对冲基金管理规模年均增 长超过 15%，远超传统主观宏观策略的增长速度，这一趋势也预示着，未来 主观控波将不再是单纯的经验判断 ，而是与量化方法深度融合 ，实现 “主观 研判 +量化验证 ”的双重保障 ，提升波动控制的精准度和稳定性 。 3.1. 波动预测模型 波动预测是 控制单资产策略波动 的重要手段 ， 其核心工具之一便是 GARCH 族模型， 该模型凭借对波动率时变性的精准捕捉， 成为量化控波中波动预测 的基础工具。在 2026年全球市场波动加剧的背景下，单一资产波动率呈现 显著的时变 和聚集特征，传统静态波动度量方法已难以满足控波需求，而 GARCH族模型能够有效刻画这种动态波动规律，为后续仓位调整、风险度 量提供可靠支撑。 广义自回归条件异方差（ Generalized Autoregressive Conditional Heteroskedasticity ，GARCH） 模型通过条件方差的动态演化刻画波动聚集。 模型将当期波动与历史冲击、 历史条件方差相联系， 使风险估计能够随市场 状态变化，并为动态风险价值（ V alue at Risk ，V aR） 、期权定价和仓位调整 提供输入。1 GARCH模型的应用重点是预测方向而非追求点预测完美。 常态环境下模型 能够识别高波与低波持续性， 但在跳跃、 流动性枯竭和制度变化时可能滞后； 实际系统需要结合隐含波动率、成交信息和压力情景修正。 σₜ² = ω + αε ₜₜₜ² + βσₜₜₜ² 其中，σₜ²表示 t期条件方差 ，ω表示长期方差基准项 ，εₜₜₜ表示上一 期收益创新 ，α衡量新冲击对波动的影响 ，β衡量条件方差的持续性 ；通常 要求ω>0、α≥0、β≥0，并关注α+β是否接近 1。 GARCH模型的基本原理围绕 “波动率聚类 ”这一核心思想展开 ，核心观点是 波动率本身具有时变性， 即高波动时期往往集中出现， 低波动时期也呈现集 群特征，而非随机分布。该模型通过对历史收益率波动的建模，捕捉波动率 的动态变化趋势， 将过去的波动信息纳入模型， 实现对未来波动率的合理预 测，打破了传统模型中波动率恒定的假设，更贴合真实市场的波动特征。 为了更好地适配市场波动的复杂特征， GARCH模型衍生出多种扩展模型， 其中 EGARCH 、TGARCH 等模型最具代表性，主要用于捕捉波动率的非对 称效应。 当研究对象从单一资产扩展至多资产时， Baba -Engle -Kraft -Kroner 广义自回归条件异方差（ BEKK -GARCH）模型可以同时描述各资产自身的 波动持续性与资产之间的波动溢出。其参数化形式把冲击项和历史协方差 写成二次型， 在适当参数约束下能够保证条件协方差矩阵为正定或半正定2。 Hₜ = C ᵀC + A ᵀεₜₜₜεₜₜₜᵀA + B ᵀHₜₜₜB 其中，Hₜ表示 t期多资产条件协方差矩阵 ，C通常设为下三角常数矩阵 ， A刻画上一期联合冲击及其跨资产传导 ，B刻画历史协方差的持续性 ，ε ₜₜₜ为上一期收益创新向量 。BEKK -GARCH 适合用于动态相关性 、组合 风险和波动溢出分析， 但资 产数量增加后参数规模迅速上升， 实务中常采用 对角或稀疏约束。 DCC -GARCH（Dynamic Conditional Correlation GARCH ，动态条件相关 GARCH）和 BEKK -GARCH相似，两者 都是多变量 GARCH模型，主要用 于估计多资产之间随时间变化的波动率和相关性结构。 DCC -GARCH 模型 的核心思想是将波动率建模和相关性建模分开。 即： 1 Engle, R. F . (1982), “Autoregressive Conditional Heteroscedasticity with Estimates of the Variance of U.K. Inflation, ” Econometrica, 50(4), 987–1007, https://doi.org/10.2307/1912773 ；Bollerslev, T . (1986), “Generalize d Autoregressive Conditional Heteroskedasticity, ” Journal of Econometrics, 31(3), 307–327, https://doi.org/10.1016/0304 -4076(86)90063 -1。 2 Engle, R. F . and Kroner, K. F . (1995), “Multivariate Simultaneous Generalized ARCH, ” Econometric Theory, 11(1), 122–150, https://doi.org/10.1017/S0266466600009063 。 下载日志已记录，仅供内部参考 通用报告 请务必阅读正文之后的免责条款部分 10 of 32 Hₜ = Dₜ Rₜ Dₜ 其中 𝐷𝑡为条件波动率矩阵 𝐷𝑡=𝑑𝑖𝑎𝑔 (σ1,𝑡,…,σ𝑁,𝑡) 在计算中需对 每个资产单独使用 GARCH模型。Rₜ（Dynamic Conditional Correlation Matrix ，动态条件相关矩阵）是整个模型最核心的部分 ，是一个 随时间变化的资产相关性矩阵，它通过标准化收益冲击和历史相关状态动 态更新，用来描述“不同资产在当前市场环境下如何一起波动” 。 它解决的 问题是： 资产之间的相关性不是固定的，而是会随市场状态变化， 尤其在危 机期间相关性会显著上升 。在资产配置中 ，Rₜ 决定了 “分散化是否有效 ”。 在长期资产配置中 ，Rₜ比固定相关矩阵更能反映危机期间风险共振 ，是动 态风险预算和回撤控制的重要输入。 DCC -GARCH在实际应用中相对 BEKK具有一定优势 ，因为它能够在较低 参数复杂度下动态估计多资产相关性； 而BEKK更适合小规模资产体系下 研究波动冲击传导和金融风险溢出。 3.2. 目标波动率策略 目标波动率策略（ Target V olatility Strategy, TVS ）依托资产波动率的集聚规 律， 通过对 风险资产风险敞口的动态逆向调节， 确保组合的绝对风险水平在 任何市场状态下都 维持稳定 。 在经典学术和投资实战中， 资产收益率呈现出 明显的非对称特征 ，即价格暴跌往往伴随着波动率的急剧放大 。为了打破这 一“下行伴随高波动 ”的恶性循环 ，TVS 策略在每日或定期重新测算风险资 产实现的波动率 预测波动上升时降低风险资产权重，预测波动下降时恢复 风险敞口，从而稳定组合风险水平；相关研究显示，波动管理的效果取决于 波动变化是否得到相同比例的预期收益补偿 。3 目标波动策略的关键参数包括目标风险、 预测窗口、 杠杆上限和调仓速度。 目标过低会长期牺牲风险溢价， 窗口过短会放大追涨杀跌， 调仓过快则增加 成本； 较稳健的做法是对预测波动进行平滑， 并在压力期采用快速降风险、 常态期缓慢恢复的非对称规则。 此外，目标波动率策略需要设置杠杆上限、 调仓缓冲和流动性约 束。 若完全按短期波动反向调仓， 市场急跌后可能出现 集中去杠杆，反弹阶段又可能恢复过慢；使用波动平滑、权重上下限和阈值 再平衡能够降低顺周期交易。 wₜ = min(Lₜₐₓ, σ* / σ̂ ₜ) 其中，wₜ表示 t期风险资产或基础组合的缩放倍数 ，Lₜₐₓ表示允许的最大 杠杆，σ*表示目标波动率 ，σ̂ₜ表示 t期预测波动率 。若还存在最低仓位 、 现金占用或交易速度限制，应在该缩放倍数之外增加相应约束。 当市场突发负面冲击 、资产价格暴跌导致 σ̂ₜ急剧攀升时 ，模型会根据规 则要求强制斩仓，调降资产权重；而当市场处于震荡缓涨、资产波动率极低 时，模型则会自动提升仓位以 提升资产的 beta 回报。通过这种动态调仓， TVS 策略能将资产的收益率分布从原有的 “宽幅高尖 ”塑造成更加符合统计 学预期的平缓分布，平滑投资组合的波动。 3.3. 泡沫识别算法 泡沫识别算法是单资产量化控波的重要工具，其核心作用是识别资产价格 泡沫的形成、发展与破裂，提前规避泡沫破裂带来的剧烈波动，尤其适用于 2026年波动剧烈的权益、商品市场。资产价格泡沫一旦破裂，往往会引发 单一资产的大幅回撤，甚至传导至整个投资组合，因 此，精准的泡沫识别是 单资产量化控波的重要环节。 泡沫检验模型通常更适合作为风险预警。价格的爆炸性特征可能来自宏观 3 Moreira, A. and Muir, T . (2017), “Volatility -Managed Portfolios, ” The Journal of Finance, 72(4), 1611 –1644, https://doi.org/10.1111 /jofi.12513 。 下载日志已记录，仅供内部参考 通用报告 请务必阅读正文之后的免责条款部分 11 of 32 冲击、基本面快速变化、制度调整或样本口径变化，需要结合成交、融资和 持仓结构等交叉检验。 3.3.1. ADF与BSADF泡沫识别 增广迪基 —富勒（ Augmented Dickey -Fuller，ADF）检验用于判断时间序列 是否存在单位根； 反向上确界增广迪基 —富勒（ Backward Supremum Augmented Dickey -Fuller，BSADF）方法通过递归右尾单位根检验识别价格 序列的爆炸性阶 段和潜在泡沫 。Phillips -Wu-Yu（PWY）与 Phillips -Shi-Yu （PSY）框架基于 BSADF方法通过扩展窗口和滚动窗口定位泡沫起点与终 点，其中 PSY方法对多重泡沫的识别更具针对性。4 ADF（Augmented Dickey -Fuller）检验主要用于检验时间序列是 否平稳，而 平稳性是后续各类量化模型（如 GARCH、V AR等）应用的前提。平稳性的 核心特征是时间序列的均值、方差基本保持不变，若时间序列非平稳，则容 易出现伪回归现象，导致模型分析结果不可信； ADF检验通过构建回归方 程，检验时间 序列是否存在单位根，若存在单位根则说明序列非平稳，需通 过差分等方法处理后再进行后续分析。 PWY方法和 PSY方法的核心逻辑是使用 ADF单位根检验的右尾变体，其 中零假设是 无泡沫（即价格不存在由随机游走 无法解释的爆炸性增长 ） ，而 备择假设是存在泡沫爆炸过程 。通过递归检验的方式， 可逐步扩大样本范围， 捕捉价格序列中偏离基本面的泡沫特征。 PWY方法的理论基础基于理性泡 沫的资产定价模型， 其本质是检验标准的股息现值模型的有效性， 当模型偏 离显著时，即认为存在资产价格泡沫 。反向 SADF检验则对反向扩展样本 序列执行 sup-ADF检验，其中每个样本的 结束端点固定在 指定目标日期 ， 可进一步提升泡沫 期识别的精准度。 图4：使用BSADF方法对万得全 A检验得到的泡沫信号情况 资料来源： wind，国泰海通证券研究 数据样本： 2004/01/04 -2026/07/30 4 Phillips, P . C. B., Wu, Y. and Yu, J. (2011), “Explosive Behavior in the 1990s Nasdaq, ” International Economic Review, 52(1), 201–226, https://doi.org/10.1111/j.1468 -2354.2010.00625.x ；Phillips, P . C. B., Shi, S. and Yu, J. (2015), “T esting f or Multiple Bubbles: Limit Theory of Real-Time Detectors, ” International Economic Review, 56(4), 1079 –1134, https://doi.org/10.1111/iere.12131 。 下载日志已记录，仅供内部参考 通用报告 请务必阅读正文之后的免责条款部分 12 of 32 3.3.2. LPPLS模型 对数周期幂律奇异（ Log-Periodic Power Law Singularity ，LPPLS）模型是另 一种重要的泡沫识别工具， 其核心观点是金融泡沫具有对数周期性特征， 通 过捕捉这种特征， 可识别泡沫并预测其破裂的临界时间点， 为单资产控波提 供前瞻性指引。 与 ADF、BSADF模型侧重检验平稳性和泡沫 存在时点不同， LPPLS模型更注重对泡沫破裂时间的预测，能够提前发出风险预警，帮助 投资者在泡沫破裂前调整仓位、规避损失。 此外，该模型还可同时提供负泡 沫信号，对于由于羊群效应导致的市场超跌底部给出积极加仓提示。 对数周期幂律奇异模型以超指数增长与对数周期振荡描述泡沫加速过程。 模型将模仿交易、 正反馈和临界点联系起 来， 临界时间参数反映泡沫不可持 续区间， 但并不等同于确定的崩盘日期。 其理论模型和原始形式 LPPL（Log- Periodic Power Law ）将价格预期表达为： E[ln p(t)] = A + B( (tc−t)ᵐ + C( tc−t)ᵐcos[ωln((tc−t)−φ] 其中， p(t)表示 t时点价格， E[ln p(t)]表示对数价格的期望路径， A表示临界 时点附近的基准水平， B和C分别控制幂律趋势与周期振荡幅度， (tc表示 临界时点， m表示增长加速程度， ω表示对数周期频率， φ表示相位 。LPPLS 作为实证增强版本 在模型估计当中对变量进行了一定调整 。 在LPPLS底层的网络结构中，重点考虑了两种类型的交易员，这也是模型 能够捕捉泡沫特征的核心逻辑。 第一组由具有理性预期的交易员组成， 这类 交易员会基于资产基本面进行决策， 不易受市场情绪影响； 第二组由噪音交 易员组成，这类交易员缺乏理性判断，作为一个群体，很容易表现出模仿和 羊群行为， 他们的集体行为可能会破坏资产价格的稳定， 推动泡沫的形成与 膨胀，这也是 LPPLS模型能够捕捉泡沫对数周期性特征的核心前提。 LPPLS模型中，采用了分层钻石网格结构来对交易员网络进行建 模，这种 结构能够精准刻画不同类型交易员的互动关系，进而捕捉泡沫的形成机制。 分层钻石网格结构可以运用在伊辛模型并获得一般解，其构建可以从一对 相互影响的交易者开始， 将此链接替换为菱形， 其中两个原始交易者占据两 个相反的顶点， 而另两个顶点被两个新交易者占据， 此菱形包含四个链接， 通过这种分层扩展，能够模拟复杂的交易员网络互动 。 Johansen et al. (2000) 提出，由于交易者网络中不同交易者的位置、影响力 存在差异，对交易员行为的建模可采用这种分层钻石网格结构的设定方法。 这种结构能够有效区分不同交易员的 影响权重，精准刻画噪音交易员的羊 群行为和理性交易员的决策逻辑，从而更准确地捕捉资产价格的对数周期 性特征， 提升泡沫识别和破裂预测的精准度， 为单资产量化控波提供更具前 瞻性的风险预警。5 LPPLS的稳健性高度依赖样本窗口与参数寻优。不同起点、终点和优化算 法可能产生不同临界区间， 应用时需要开展多窗口拟合、 参数约束和滚动稳 定性检验，并把结果视为概率性风险区间。在实际操作中， 多窗口拟合结果 若在相", "status": "extracted"}, "post:2026-08-11T08-46:cc20ab88f09c": {"id": "post:2026-08-11T08-46:cc20ab88f09c", "kind": "post", "title": "2026-08-11 08:46", "source_label": "帖子正文", "excerpt": "盛弘股份26H1业绩表现亮眼【华西电新】#26H1整体情况26H1公司实现营收17.6亿元，同比+29%；实现归母净利润2.3亿元，同比+44%。", "content": "盛弘股份26H1业绩表现亮眼【华西电新】#26H1整体情况26H1公司实现营收17.6亿元，同比+29%；实现归母净利润2.3亿元，同比+44%。26Q2公司实现营收10.2亿元，同比+34%，环比+36%；实现归母净利润1.4亿元，同比+67%，环比+67%。#26H1分业务来看#工业配套电源：26H1实现收入4.4亿元，同比+58%；26H1毛利率为61.9%，同比+3.28pct。随着AIDC的投建和快速发展，公司工业配套电源业务在数据中心/智算中心领域应用的相关产品销量有所增长。#新能源电能变换设备：26H1实现收入3.8亿元，同比+35%；26H1毛利率为38.1%，同比+10.29pct。随着全球储能市场的供需关系改善、支持政策的落地实施、预期收益率的提升等因素，储能市场在近年迎来了蓬勃发展，带动了公司相关产品的销售收入有所增长。#电动汽车充电设备：26H1实现收入7.5亿元，同比+18%；26H1毛利率为30.4%，同比-4.43pct。#电池检测及化成设备：26H1实现收入1.3亿元，同比-0.2%；26H1毛利率为31.0%，同比-8.32pct。#投资建议依托电力电...", "publish_time": "2026-08-11 08:46", "tags 大问题展开：一是内销何时见到拐点，二是出海业务 的盈利性问题。 内销方面，最新 7 月底至 8 月初的数据仍显示同比下滑 15%-18%，投资者关注内销何时转正及中 长期展望。 出海方面，尽管出海业务如火如荼，但市场因欧洲加征关税、出口退税取消预期、海外建厂盈利性 存疑等因素而并不买账。 2.内销下半年展望：同比降幅收窄是大概率事件 核心判断：看好下半年内销同比降幅收窄，主要因去年四季度基数较低。 新车结构层面：8、9 月及四季度有多款走量车型上市，包括比亚迪秦 MAX（比亚迪共 5 款新 车）、吉利小新月（吉利共 3 款新车）、零跑 A5 等。上半年 4-5 月以旗舰车型为主，下半年以小 车和走量车型为主，对销量增长的边际弹性更大。 补贴分配层面：今年整体补贴规模 1500 亿元，上半年仅使用 500 多亿元，下半年仍有接近 1000 亿元的补贴空间。去年补贴到 10 月份即停止，形成低基数。 上半年补贴使用缓慢的原因：政策较严，禁止跨省市交易，且以旧换新要求旧车必须在名下持有超 过一年，影响了部分真心想买新车用户的参与。 判断：在资金宽裕、效果一般的情况下，下半年适度放宽政策是合理情形，有望看到政策放松迹 象。 3.内销中长期展望：新能源车增换购周期是核心支撑 对中长期内销中枢持乐观态度，核心逻辑在于新能源车的增换购，尤其是 21 年以后销售的新能源 车将逐步进入换购周期。 新能源车销量爆发历程：2019 年约 120 万辆、2020 年约 130 万辆，2021 年跳升至 350 多万辆， 2022 年 680 多万辆，2023 年 950 多万辆。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 当前换购尚未大规模启动的证据：2025 年新能源二手车交易量仅 160 万辆，仅比 2020 年多一 点，远未达到 2021 年 350 万辆的规模，说明 2021-2023 年销量高峰期的车辆尚未进入换购阶 段。 换购周期判断：新能源车换购中位数约为 6 年，据此推算 2021-2023 年销售的车将在明后年至 2029 年进入集中换购期。 6 年换购周期的逻辑支撑： 电车有很强的日历效应，几年前电池技术不如现在成熟，一般开不到 8 年以上； 经济下滑确实会导致增换购延后，但新能源车性价比提升对冲了这一影响。 性价比对比：6 年前（2020-2021 年）秦 PLUS 售价 14-15 万元，现在售价 6 万多且配置全面升级 （智能驾驶、闪充电池等）；理想 ONE 当年 30-40 万元，如今产品力大幅提升而价格大幅下降。 六年前买得起 15 万车的人群，现在依然买得起 6 万多的车。 新能源车换购周期显著短于燃油车，因为产品升级迭代快、价格下滑速度快，无论从消费吸引力还 是实际实惠角度都加速换购。 4.内销总量测算与拐点判断 年销量由新车和换购两部分构成。新车销量跟随人口生育率、结婚率等宏观因素，已从高峰期的 1500-1600 万辆下滑至 600-700 万辆，每年下滑约 100 万辆，未来仍会下滑但速度放缓。 新能源车换购带来的增量测算：2021-2023 年约 2000 万辆新能源车进入活跃换购周期，按 6 年周 期平均每年约 500-600 万辆换购量，相比当前 160 万辆的二手车交易量，将带来约 300-400 万甚 至 400-500 万辆的增量。 今年销量不必过度悲观：前两年（2024-2025 年）补贴透支约 200-300 万辆，从去年 10 月开始按 月消化约 15 万辆，预计一年多时间（即今年年底至明年年初）可消化完毕，届时内销有望回到正 常水平，叠加新能源车换购周期，看好内销拐点出现。 5.出海盈利性分析：政治博弈下的必然选择 出海如火如荼但市场不买账的原因：一是内销下滑需要算此消彼长的账，中报业绩是关键验证；二 是核心担忧在于盈利性而非空间。 出海本质上是政治逻辑而非经济学逻辑：2024 年欧洲对中国纯电加征关税、美国禁止中国车销 售、近期欧洲又在酝酿加征关税、出口退税取消预期等，都指向一个结论——必须出海建厂，不能 仅靠出口。 海外建厂盈利性判断：结论是仍然能赚钱。核心逻辑： 海外价格远好于国内； ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 研发大脑留在国内，大头开支和很多原材料零部件仍可从国内运过去； 海外收购或建厂的价格超预期便宜。 6.海外格局：亟需中国新能源车拯救 海外车企在新能源车发展上进度远低于中国，Stellantis 去年亏损 221 亿欧元、CEO 被干掉，雷 诺、大众、日产等均有撤退迹象。 Stellantis 找零跑合作、找东风岚图合作、想卖厂给比亚迪等事件，都说明欧洲自身不可能发展好 新能源车。 欧洲加关税的本质：不想让钱白白被中国赚走，想通过合作或技术转让方式分一杯羹，但前提是欧 洲发展新能源离不开中国电动车——表面卡脖子，实则身体很诚实，非常欢迎中国去建厂、收购产 能。 7.海外收购案例：吉利收购福特工厂的启示 吉利收购福特在欧洲的工厂具有强象征意义，表明海外车企出售产能的浪潮已经开启，且不同于以 往零部件出海学技术，这一轮收购以中国为主体，海外方真心想卖厂、想靠中国技术盘活资产。 该工厂情况：产能 50 万辆，去年仅生产 9.85 万辆，产能利用率不到 20%，但单车仍能盈利 5400 元人民币。 收购价格：34%股权作价 2.2 亿（原文为“燃油 2.2 油”，按上下文推断为 2.2 亿），相当于单车 不到 1 万元人民币，按去年单车利润 5400 元计算，打满产能一年多即可回本，后续开发投入很 少。 低价原因：卖方经营不下去，若不卖需遣散 4000 名工人，遣散费用高昂。本质上是话语权问题— —中国在新能源车领域占据绝对主导地位，因此能获得合适的收购价格和良好的扩张土壤。 结论：看好出海盈利性，很多公司反馈在海外建厂的盈利性不弱于国内出口（在加关税情况下）。 8.推荐标的与选股逻辑 以往推荐标的一年一换，严格跟随新车周期；近期换手频率明显降低，因行业整体平稳下推阿尔 法，从中长期视角看核心标的。 核心推荐标的： 吉利：已连续推荐两年，今年是出海第一年，后续出海实力将持续显现； 比亚迪 ：今年 5 月起纳入推荐，因闪充技术效果较好、海外订单反馈强烈，海外空间仍很大； 未来（蔚来） ：国内高端化新车周期，已持续推荐一年多。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 问答整理 Q1：内销下半年同比降幅收窄的逻辑除了低基数外，还有哪些具体支撑？ 答：主要有两个支撑。第一，新车结构上，8、9 月及四季度走量车型较多，如比亚迪秦 MAX（比亚迪 共 5 款新车）、吉利小新月（吉利共 3 款新车）、零跑 A5 等，上半年以旗舰车型为主，下半年小车和 走量车型对量的边际弹性更大。第二，补贴分配上，今年总补贴 1500 亿，上半年只用了 500 多亿，下 半年还有接近 1000 亿空间，远大于去年（去年 10 月就停了）。上半年补贴效果一般主要是因为政策 较严，禁止跨省市、旧车需持有一年以上，影响了部分真实购车用户，在资金宽裕的情况下，下半年适 度放宽是合理预期。 Q2：市场担心明年政策退坡后内销会进一步下滑，你们怎么看？ 答：我们的观点比市场乐观很多。核心逻辑是新能源车的增换购周期。2021-2023 年新能源车销量爆 发（350 万→680 万→950 万辆），这些车将在明后年至 2029 年进入集中换购期。目前新能源二手车 交易量仅 160 万辆，远未达到 2021 年 350 万辆的规模，说明换购尚未启动。新能源车换购中位数约 6 年，主要因为电池日历效应（几年前电池开不到 8 年以上）以及现在新能源车性价比极高（6 年前秦 PLUS 卖 14-15 万，现在 6 万多且配置大幅升级），会加速换购。按 2000 万辆存量、6 年周期计算， 每年约 500-600 万辆换购量，相比 160 万辆是三四百万甚至四五百万的增量，足以对冲新车下滑。 Q3：为什么判断新能源车换购周期是 6 年而不是更长？经济下滑不会导致延后吗？ 答：经济下滑一定会导致增换购延后，这是毋庸置疑的。但即便考虑消费降级，六年前能买得起 15 万 秦 PLUS 的人，现在依然买得起 6 万多的秦，收入没有下滑到那个程度。而且现在新能源车相比五六年 前的产品，性价比提升是巨大的——价格大幅下降的同时，智能驾驶、闪充电池等配置全面升级。这种 性价比差异会强烈吸引车主换购。新能源车换购周期远短于燃油车，就是因为产品升级迭代快、价格下 滑快，无论从消费吸引力还是实际实惠角度都在加速换购。 Q4：今年内销下滑的幅度和原因如何理解？什么时候能看到拐点？ 答：今年下滑是正常现象，前两年（2024-2025 年）补贴效果较好，销量在 2350 万区间，透支了约 200-300 万辆需求。很像 2018-2019 年，但下滑速度更快，因为 2024-2025 年透支更厉害。从去年 10 月开始按月消化约 15 万辆，预计一年多时间（今年年底至明年年初）可还完债，内销回到正常水 平，再叠加新能源车换购周期启动，届时能看到内销拐点。 Q5：海外建厂到底能不能盈利？核心逻辑是什么？ ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 答：结论是能赚钱。第一，海外价格远好于国内；第二，研发大脑留在国内，大头开支和很多原材料零 部件仍可从国内运过去；第三，海外收购或建厂的价格超预期便宜。以吉利收购福特欧洲工厂为例， 50 万产能去年只产 9.85 万辆，产能利用率不到 20%，但 ption. We conservatively forecast FR4 CCL prices of Rmb365/ sheet by 1H27, supported by lingering shortages in CCL and upstream materials (E- glass). Kingboard (KBL) and Shengyi Tech (SYT) are likely to be key beneficiaries given their scale, quality and bargaining power, while AI exposure fuel further growth. We see SYT as well positioned to benefit from AI CCL upgrades and KBL as likely to lift its AI exposure via upstream materials before penetration into high-speed/AI CCL. CCL industry consolidation is likely to continue as supply constraints increasingly favour the largest as well as vertically integrated firms. PCB: Optical, ASIC & backplane to support growth beyond Rubin spec upgrades Besides Rubin's spec upgrades, we believe 800G/1.6T optical module PCBs and ASIC units can fuel near-term earnings growth. We prefer suppliers such as Shennan and Avary for their high-end manufacturing capabilities (mSAP , HDI, HLC) and established relationships with key customers. We believe the market has not fully realised Shennan's optical module PCB revenue potential, which could reach 25% of total revenue in 2027E, lifting PCB's 2026/27E YoY growth to 38%/48%. We see Shennan's current valuation as the most attractive given its exposure to optical module PCBs, with upside from the optionality of Kyber backplane adoption not yet priced in (similarly for SYT through potential backplane CCL allocation). We expect the Kyber orthogonal backplane to still launch with Feynman in 2028 and could lift SYT/Shennan's 2026-29E earnings CAGR to 44%/47% from our current estimates of 38%/39%. SYT/Shennan most preferred; initiate on KBL at Buy ; upgrade Avary to Buy Sector-wise, we continue to favour CCL/upstream companies and select PCB names. We keep SYT and Shennan as our top picks, followed by KBL and Avary (all rated Buy). We raise SYT / Shennan / Avary's PTs by 98% / 66% / 136% to Rmb192.00 / Rmb473.00 / Rmb130.00, reflecting stronger AI order visibility, share-gain opportunities and continued margin expansion. We initiate coverage on KBL with a HK$58.00 PT based on 17x 2027E PE. We upgrade Avary from Neutral to Buy based on a 40x 2027E PE on the back of a higher 42% 2026-29E earnings CAGR from optical and AI PCB led growth, as major planned capacity expansion ramps. We remain Neutral on FastPrint as valuation remains demanding despite our above-consensus EPS; we may turn more positive when AI/optical module PCBs and ABF substrate begin to contribute meaningfully. This report has been prepared by UBS Securities Asia Limited. ANALYST CERTIFICATION AND REQUIRED DISCLOSURES, including information on the Quantitative Research Review published by UBS, begin on page 37. Equities China Communications Technology Jimmy Yu Analyst jimmy.yu@ubs.com +86-21-3866 8880 Edward Liu Analyst edward.liu@ubs.com +852-3712 3981 David Chow Associate Analyst david.chow@ubs.com +852-3712 3512 China PCB and CCL Sector 10 August 2026 ab 2China PCB and CCL Sector UBS Research Sector Thesis Map UBS Research THESIS MAP MOST FAVORED SYT, Shennan, KBL, AvaryLEAST FAVORED Q: How do the Rubin and Kyber backplane delays change the PCB outlook? Only to a limited extent in the near term, in our view, and we believe the extended timeline could be a a share gain opportunity for potential entrants as qualification windows extend. We expect backplane to feature in Feynman, ramping up from 2028; we estimate the backplane PCB TAM to be Rmb1.2bn/31.8bn/48.0bn in 2028/29/30. We expect Avary to enter Rubin through HDI qualification, while Shennan's backplane know-how positions it as a potential supplier, alongside SYT on CCL, where we see a PTFE-hybrid solution as the most feasible. Shennan and Avary look well positioned for near-term growth in: 1) optical module PCB, benefiting a handful of suppliers with mSAP know-how; and 2) ASIC, which would see higher unit growth vs. GPUs in 2026/27E. Q: Is the market underappreciating the conventional CCL upcycle? Yes. We believe the market is overlooking the sustainability of this upcycle and pricing in an approaching peak. We think this cycle could be more extended than past cycles due to structural S/D drivers as well as upstream material tightness, with AI crowding out conventional supply and adding incremental demand while near-term supply responses remain limited. We forecast an industry electronic fabric S/D gap of over 10% through 2027E as effective capacity is bottlenecked by Toyota's loom equipment while peers reallocate capacity towards AI/speciality fabric. A conventional CCL upcycle is likely to benefit KBL and SYT, as it remains the primary earnings driver for both. Q: What is the earnings impact and what is mispriced? For our top picks, we raise 2027/28E earnings by 58%/92% for SYT and 30%/80% for Shennan, putting us 8-29% above consensus. We believe the market is not fully pricing in: 1) SYT's leverage to the conventional CCL upcycle, with segment revenue rising 103%/52% in 2026/27E alongside GPM expansion, also helped by a greater AI CCL mix; 2) Shennan's optical module PCB revenue potential, lifting PCB segment growth to 38%/48% YoY in 2026/27E; and 3) the adoption of Kyber backplane, which we expect to lift 2026-29 earnings CAGRs from 38%/39% to 44%/47% for SYT/Shennan, could support potential valuation upside of 59%/50% versus 37%/24% on our current price targets. Sector-wise, we continue to favour CCL/upstream and remain selective on PCB names. We expect KBL and SYT to benefit from more sustainable conventional CCL upcycle through 2027, while emerging AI exposure delivers the next leg of growth. For PCB, we are selective on companies with: 1) share gain potential at Nvidia for longer-term growth; and 2) near-term earnings drivers from optical module PCB and ASIC, which we see at both Shennan and Avary. 1) UBS forecast top 5 hyperscalers' capex to increase 84%/45% YoY in 2026/27E; 2) KBL has hiked FR-4 CCL prices multiple times YTD , with monthly hikes since March; 3) E-glass fabric has seen monthly price hikes YTD, with prices now at historical highs; 4) we forecast the number of ex-Nvidia accelerator units to increase 49%/98% YoY in 2026/27E versus Nvidia GPU (SIP) units of 17%/36%. The Wind PCB sector index has fallen 25% from its June all-time peak, and we view market pessimism as stemming from a later backplane timeline alongside broader weakness in sentiment towards AI infrastructure names. Companies in our coverage now trade within the 30-50x 12-month fwd PE range as the 2019-21 5G upcycle. We forecast our covered companies to record a 46% earnings CAGR in 2026-28 vs. 33% in 2019-21, suggesting further re-rating upside. Figure 1: Our China PCB coverage by preference– ratings, earnings and price target changes Market Price Old price New price NP cap 07-Aug target target Old New EPS Revision Old target New target P/E (x) CAGR PEG ROE Company Ticker (US$m) (LC$) (LC$) (LC$) Rating Rating 2026E 2027E 2028E PE multiple PE multiple 2026E 2027E 2028E 26-29E 27PE/26-29E 2026E 2027E 2028E UBS-S China PCB/CCL Sector Coverage Shengyi Technology 600183.SS 50,393 140 97 192 Buy Buy 38% 57% 91% 35x (on 26E) 40x (on 27E) 43.3 29.2 20.8 38% 0.8 41% 47% 52% Shennan Circuits 002916.SZ 38,627 383 285 473 Buy Buy -1% 27% 73% 38x (on 26E)* 40x (on 27E)* 51.5 32.5 23.9 39% 0.8 26% 31% 31% Kingboard Laminates 1888.HK 15,331 38 - 58 - Buy - - - - 17x (on 27E) 18.1 11.5 9.2 30% 0.4 36% 45% 45% Avary 002938.SZ 34,838 101 55 130 Neutral Buy 0% 8% 9% 24x (on 26E) 40x (on 27E) 45.7 31.2 21.8 42% 0.7 13% 16% 20% Shenzhen FastPrint 002436.SZ 8,514 34 26 37 Neutral Neutral -32% 19% 12% 58x (on 26E)* 55x (on 27E)* 109.8 50.2 33.3 67% 0.7 7% 12% 16% Sector average 53.7 30.9 21.8 43% 0.7 25% 30% 33% Source: LSEG, UBS estimates. Note: The EPS changes of Shennan, Avary and FastPrint impacted by an increased number of shares outstanding. *Implied 2027E PE as valuation is based on SOTP .Pivotal Questions UBS View Evidence What's priced in? China PCB and CCL Sector 10 August 2026 ab 3China PCB and CCL Sector UBS Research PCB/CCL sector: Multiple AI growth drivers ahead We initiate coverage on Kingboard Laminates (KBL) at Buy and add the company to our top picks within the China PCB/CCL sector alongside Shengyi Tech (SYT) and Shennan Circuits (raising our PTs by 98% and 66%). Sector valuations have fallen materially following news of Kyber orthogonal backplane delays ( link) and the broader weakness in investor sentiment on the sustainability of AI infrastructure build-out, but we believe the fundamentals of select companies remain intact while the market seems to be overlooking opportunities in two areas with attractive risk/reward. We prefer: 1) upper-stream CCL companies: SYT/KBL , which are benefiting from an unprecedented and more sustainable conventional CCL upcycle through 2027E as margins expand in their core businesses while emerging AI exposure (speciality/AI glass fabric including Low-Dk/T/Q-glass for KBL and AI-grade CCL/PTFE for SYT) delivers the next leg of growth; and 2) PCB: Shennan/Avary , with share gain potential at Nvidia and diversified AI PCB exposure from optical module and ASIC, given their leading manufacturing know-how (HDI/mSAP) and ample capacity to fulfil demand, in our view. Kyber backplane & Rubin delays as share gain opportunities As we mentioned previously , the backplane timeline is in line with our expectation based on our early industry study of upstream CCL vendors in May, suggesting the adoption of the orthogonal backplane is likely to start with Feynman. Despite a later timeline, we believe the Kyber orthogonal backplane will unlikely be cancelled and could potentially lead to content value/market share gain opportunities for PCB/CCL suppliers. We see emerging solutions such as a PTFE-based CCL solution gaining traction in recent sampling trials of the Kyber backplane, while a longer sampling period provides more time for yield improvement and supply chain preparation. We now believe the M9/PTFE- hybrid CCL solution appears to be the most feasible option for the backplane, where PTFE would be used in critical low-loss layers while M9-level hydrocarbon and Low-Dk2 glass fabric are retained in core layers. We expect SYT and Shennan to be major beneficiaries of the Kyber backplane, with even higher leverage if a PTFE-hybrid solution is adopted. UBS estimates Feynman's rack volumes of 1.0k/26.5k/40.0k in 2028/29/30E, which could represent a Kyber backplane PCB TAM of Rmb1.2bn/Rmb31.8bn/Rmb48.0bn. Our base-case forecasts for Shennan and SYT do not factor in earnings contributions from the Kyber backplane. But we estimate that backplane adoption upside potential could add roughly Rmb2,862m and Rmb2,544m in incremental profits to SYT and Shennan's 2029E bottom line, on the back of our somewhat conservative assumptions of a 20%/50% supplier wallet share for backplane PCB/CCL, respectively. Figure 2: Our estimates for the potential TAM of the Kyber backplane Rack Units 2026E 2027E 2028E 2029E 2030E Blackwell (NVL72) 17,778 1,863 Blackwell Ultra (NVL72) 48,608 27,537 4,738 Rubin (NVL72) 6,150 58,826 20,000 Rubin Ultra (NVL72) 1,800 70,000 20,000 984 Feynman (NVL144/288) 1,000 26,500 40,000 Total 72,536 90,026 95,738 46,500 40,984 Kyber Backplane TAM 2026E 2027E 2028E 2029E 2030E Feynman (NVL144/288) Rack 1,000 26,500 40,000 Backplane per Rack 4 4 4 Backplane ASP (Rmb '000) 300 300 300 Backplane TAM (Rmb mn) 1,200 31,800 48,000 Source: UBS estimates We forecast a SYT/Shennan earnings CAGR of 38%/39% over 2026-29E, and estimate this could accelerate to 44%/47% if SYT/Shennan secure Kyber backplane allocation. We believe this could lead to potential valuation upside to our current PTs, driven by multiples expansion from higher earnings growth. Our current PTs imply 37%/24% price upside, while we estimate backplane could support potential valuation upside of 59%/50% for SYT/Shennan (assuming target PEG remain the same as our base-case valuations). Therefore, we believe current valuations for SYT and Shennan look China PCB and CCL Sector 10 August 2026 ab 4attractive, with upside potential from the Kyber orthogonal backplane not priced in. Figure 3: Oberon (NVL72) versus Kyber (NVL144) rack comparison Source: UBS Figure 4: Kyber (NVL144) orthogonal backplane cross-section depiction Source: UBS In our Q126 PCB sector GTC preview , we noted that the M9 + Q-glass + HVLP4 could be a feasible CCL solution, but our latest industry study suggests the Q-glass combination is on hold after two failed sampling trials in Q126, likely due to Q-glass processing difficulties in a 100+ layers form factor, inadequate supply and higher costs versus other possible solutions (such as Low-Dk2 glass fabric with meaningfully higher yields). We see CCL makers pivoting to alternative solutions, which include: 1) M9 + PTFE-hybrid, which China PCB and CCL Sector 10 August 2026 ab 5has passed Nvidia's verification; and 2) M10 + Low Dk2 (both solutions use HVLP4 copper foil), with final design lock-in for the Kyber backplane expected in Q426 and multiple rounds of sampling currently underway ( we met with Victory Giant at our H- share Corporate Day and it indicated that more than 10 material/vendor combinations are still being considered, including various layer count designs). We now lean towards PTFE as the longer-term beneficiary given its much better Dk/Df performance than alternatives and a longer runway for potential adoption in other PCBs (compute tray Midplane / LPU / switch board) for future generations, making it more worthwhile for R&D. We expect Shennan to be one of SYT's PCB partners on the backplane, which would mark Shennan's first entry into Nvidia, if not earlier. We believe SYT is leading the PTFE CCL formula for the Kyber backplane, while other CCL suppliers remain in early sample stages. However, the technical bar remains high for PTFE CCL production as challenges exist for both the CCL and PCB sides: 1) PTFE is very soft and difficult to drill cleanly, producing burrs that hurt yields; and 2) CTE mismatch with copper creates warpage risk in high-layer-count lamination as well as adhesion difficulties. We think SYT has addressed these issues by adding SiO2 filler to increase rigidity while lowering CTE, alongside adding hydrocarbon coating for better adhesion. This has likely led to production yields increasing to about 40-50% from 20%, putting the solution on track for the mass production timeline, according to our industry studies. Despite Q-glass's optimal Dk/Df performance over other speciality/AI-grade glass fabrics, we believe Q-glass's processing difficulty has shown to be higher than expected, especially for HLC products such as the backplane, and hence alternatives that primarily use Low-Dk2 (with M10) are also being sampled in parallel. Therefore, we expect greater demand for Low-Dk2 in the near-term and likely a longer product lifecycle. We believe a domestic AI CCL supplier was the first to send samples for the M10 solution in February, followed by Doosan, SYT and EMC around June. Figure 5: PTFE outperforms alternative resins on Dk / Df performance Prepreg Components Dk @10GHz Df @10GHz Resins Epoxy 3.8 - 4.2 0.017 - 0.023 PPO 2.6 - 2.8 0.002 Hydrocarbon (BCB/PPO blend) 2.5 - 2.7 0.0007 - 0.0015 PTFE (neat or SiO2-filled) 2.0 - 3.1 0.0002 - 0.0005 Glass fabrics E-glass 6.6 - 7.1 0.0035 - 0.006 Low CTE / T-glass 4.6 - 4.9 0.002 - 0.003 Low Dk1 / NE-glass 4.4 - 4.9 0.001 - 0.003 Low Dk2 / NER-glass 4.0 - 4.3 0.0008 - 0.002 Q-glass 3.8 0.0001 - 0.0003 Source: UBS estimates We believe Shennan could become a supplier of the Kyber backplane PCB, especially if a PTFE-hybrid solution is adopted . We think the combination of large-scale manufacturing HLC PCB and know-how of PTFE processing is a rare capability among PCB vendors. Shennan stands out to us on both fronts with a track record in communication-product backplanes, with the capability for up to 120 layers HLC PCB prototypes currently, as well as experie 98463F44DFE54A9EDB9DEC4E53E3D4A817B74B131F401C296D64C3E99B28C25758AC7E5202CEC87A3C535 因为注资特别国债其实从五月份应该要发行时的时候没有发出来 ，一直推迟到目前为止还没有有明确的 落地。 发言人 20:51 但是如果按照年内还是要达成发行的这样一个目标来讲的话 ，那在三季度依然还是有落地的可能性的。 发言人 21:00 但是我们也提示 ，因为注资特别国债主要还是定向的向这个国有大行来分配来承接。 发言人 21:06 所以说二级市场的一个整体的压力还是相对比较小的。 发言人 21:10 所以对于这个整体市场的一个供给的冲击可能相对不大。 发言人 21:14 另外就是相应的普通国家的这样一个品种 ，那在给到像这个特别国债 ，像专项债来集中提速发行的让路 的这样一个情况之下的话。 发言人 21:24 我们算算下来 ，可能普通国债的净供给规模在发八月份会小幅的回落到 3871 亿元左右。 发言人 21:34 另外就是地方政府在那这方面依然也是会可能会看到一些加速 ，然后压力会相对比较大的。 发言人 21:42 这个主要的品种 ，主要就是还是落在了新增专项债的这样一个品种上。 发言人 21:48 我们也结合到像已经发行的各个地方的发行计划 ，以及今年上半年整体发生比较慢的这样一个占比这个 进度来动态测算的话 ，我们是觉得八月份有可能专项债能够达到 6000 亿以上的这样一个规模。 发言人 22:07 所以说整体算下来 ，我们觉得八月份整体的一个供给规模会有达到 1.62万亿。 发言人 22:13 那这个可这个是可能达到最高的一个峰值。 发言人 22:17 那也是相应可能会带来对于资金面 ，对于央行的操作会有一些扰动和相应带来变化的一个主要的观察 点。 发言人 22:26 所以相应的我们也结合到供给的冲击的情况来看八月份后续的资金链的一些判断。 E6636BB1012F9B6DA981D91E6DDB84146B38BE5C436DD1322A98463F44DFE54A9EDB9DEC4E53E3D4A817B74B131F401C296D64C3E99B28C25758AC7E5202CEC87A3C535", "status": "extracted"}, "post:2026-08-11T07-01:61dd890d28f4": {"id": "post:2026-08-11T07-01:61dd890d28f4", "kind": "post", "title": "2026-08-11 07:01", "source_label": "帖子正文", "excerpt": "【东方材料】持续上涨：#CNTp材料应用广泛，#横跨锂电与AI产业#无负极锂电池CNTp-3D集流体即将放量。和第一元素合作(公司持有合资公司60%股权)，产品用于无负极锂金属电池、固态电池，解决锂枝晶问题，此前在特种行业成熟应用，民用端在导入。", "content": "【东方材料】持续上涨：#CNTp材料应用广泛，#横跨锂电与AI产业#无负极锂电池CNTp-3D集流体即将放量。和第一元素合作(公司持有合资公司60%股权)，产品用于无负极锂金属电池、固态电池，解决锂枝晶问题，此前在特种行业成熟应用，民用端在导入。公司首条产线即将落地，标志着新材料应用即将开启。#CNTp高纯度碳纳米管浆料具备优势。和第一元素合作，产品用在液态电池领域，核心技术领军人物董博士在纳米碳纤维的制备等方面持续研发，已获得50余项发明专利授权。公司产品CNTp粉体的各项性能指标已超过日本昭和电工VGCF-H产品。#电容器：CNTp同类替代VGCF型添加剂可同时进入LIC活性炭正极与不石墨/硬碳负极，下游可用于EDLC(双电层电容器)/LIC(锂离子电容器)/HSC(混合型超级电容)，公司相关产业正在积极推进。【东方材料】持续上涨：#CNTp材料应用广泛，#横跨锂电与AI产业#无负极锂电池CNTp-3D集流体即将放量。和第一元素合作(公司持有合资公司60%股权)，产品用于无负极锂金属电池、固态电池，解决锂枝晶问题，此前在特种行业成熟应用，民用端在导入。公司首条产线即将落地，标志着新...", "publish_time": "2026-08-11 07:01", "tags": ["文字观点"]}, "attachment:files/1.7%突破之后-债市超话20260810.pdf": {"id": "attachment:files/1.7%突破之后-债市超话20260810.pdf", "kind": "attachment", "title": "1.7%突破之后-债市超话20260810 化部署】财联社8月11日电，高盛最新报告显示，随着人工智能计算基础设施投资持续扩张，AI投资主题正从算力竞赛转向终端应用，人形机器人有望成为下一阶段增长引擎。高盛认为，劳动力短缺和自动化需求将为机器人产业提供长期结构性支撑。高盛预计，人形机器人仍处于从技术验证向商业化过渡阶段，大规模部署可能在2027年至2029年逐步展开。该行预计全球人形机器人出货量将在2027年达到7.6万台，并于2032年升至50.2万台。#文字观点", "publish_time": "2026-08-11 20:11", "tags": ["文字观点"]}, "attachment:files/中信建投-汽车行业：鸿蒙豪华车密集上市，机器人“量产+资本化”双击在即-260810.pdf": {"id": "attachment:files/中信建投-汽车行业：鸿蒙豪华车密集上市，机器人“量产+资本化”双击在即-260810.pdf", "kind": "attachment", "title": "中信建投-汽车行业：鸿蒙豪华车密集上市，机器人“量产+资本化”双击在即-260810", "source_label": "中信建投", "excerpt": "鸿蒙豪华车密集上市，机器人“量产 +资本化”双击在即", "content": "鸿蒙豪华车密集上市，机器人“量产 +资本化”双击在即证券研究报告 ·行业动态报告 本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下，本报告亦可能由中信建投（国际）证券有限公司在香港提供。请务必阅读正文之后的免责条款和声明。发布日期：2026年8月10日分析师：程似骐 chengsiqizgs@csc.com.cn SAC 编号:S1440520070001 SFC 编号:BQR089分析师：陶亦然 taoyiran@csc.com.cn SAC 编号:S1440518060002分析师：陈怀山 chenhuaishan@csc.com.cn SAC 编号:S1440521110006分析师：马博硕 maboshuo@csc.com.cn SAC 编号：S1440521050001 分析师：胡天贶 hutiankuang@csc.com.cn SAC 编号:S1440523070010分析师：李粵皖 liyuewan@csc.com.cn SAC 编号:S1440524070017分析师：赵晗智 zhaohanzhi@csc.com.cn SAC 编号S1440525070015分析师：白舸 baige@csc.com.cn SAC 编号：S1440525080001分析师：蔡星荷 caixinghe@csc.com.cn SAC 编号：S1440526010001 仅供内部参考，请勿外传 提纲 01.行业/个股复盘 02. 推荐及关注标的03.分板块跟踪及观点更新 仅供内部参考，请勿外传 核心观点： 鸿蒙豪华车密集上市，机器人“量产 +资本化”双击在即 3核心观点：本周汽车板块催化密集：月初主流主机厂 7月产销/交付数据集中披露 ，出口链再度全面超预期 ，本周鸿蒙豪华车密集上市 ， 内需淡季下结构性 α进一步向出海链和高端链集中；宇树科技正式确定了 150.8元/股的发行价和610亿元的发行市值 ，发行较原募资计划上 修45%，叠加特斯拉Optimus产线年内投产节奏明确 、8月19日世界机器人大会临近 ，8月成为机器人“量产验证+资本化”的密集做多窗口； 商用车二季度“淡季不淡”，业绩亟待发布，龙头业绩与估值双升逻辑延续 。 推荐组合：潍柴动力、江淮汽车、中国重汽、宇通客车、禾赛、吉利汽车、新泉股份、贝斯特。 仅供内部参考，请勿外传 摘要：鸿蒙豪华车密集上市，机器人“量产 +资本化”双击在即 本周汽车板块催化密集：月初主流主机厂 7月产销/交付数据集中披露 ，出口链再度全面超预期 ，本周鸿蒙豪华车密集上市 ，内需淡季下结构性 α进一步向出海 链和高端链集中；宇树科技正式确定了 150.8元/股的发行价和610亿元的发行市值，发行较原募资计划上修 45%，叠加特斯拉Optimus产线年内投产节奏明确 、8月 19日世界机器人大会临近 ，8月成为机器人“量产验证+资本化”的密集做多窗口；商用车二季度 “淡季不淡”，业绩亟待发布，龙头业绩与估值双升逻辑延续 。 乘用车：月初主机厂产销/交付数据陆续披露 ，仍呈现\"内需淡季承压、出口强劲超预期\"特征。乘联分会预估7月狭义乘用车零售约 152万辆，其中新能源零售 约98万辆、渗透率64.5%创月度新高；8月7日海关总署数据显示前 7月电动汽车出口+71.2%，出口端亮点纷呈：比亚迪 7月销售41.9万辆（+21.8%），其中海外 17.98万辆（+124.3%）；奇瑞集团27.7万辆（+23.3%），成为首个单月出口破 20万辆的中国车企；吉利 25.0万辆连续5个月同环比双增，出口10.67万辆同比 +202%再创新高。本周尊界V680/V800正式上市且享界G9开启预售，上市1小时大定2115台（S8001000台），上市24h大定3500台其中70%高配（S8001600 台）；享界G9预售2h5100台，24h10300台，高配占比90%；订单成色足，静待9月交付数据。我们维持前期观点：内需悲观预期已充分定价 ，8月进入中报密集 披露期，Q2业绩兑现和Q3开始的预期将决定行情持续性；结构性 α继续看好乘用车出口超预期 +高端新能源加速起量 ，估值空间看好物理 AI重构成长新范式。 商用车：当前时点建议重视低估值强业绩龙头标的的投资机会 。重卡方面持续看好 AI缺电主线龙头潍柴 ，7月下旬以来AI电力业务迎密集催化 ，包括北美大客 户GNRC上调订单规模，SOFC业务加速欧洲商业化等 ，中报业绩预计稳健兑现 。7月重卡行业出口延续 40%左右高增长，重汽出口有望维持在历史高位水平 ，高 景气度有助于自身估值修复 。客车方面考虑到目前中欧贸易等利空 /风险明显缓解，重点推荐低估值高股息龙头宇通客车 ，Q2公司新能源出口表现强势 ，叠加ASP 同比双位数增长，中报业绩或超预期 。 物理AI：1）机器人主线“量产节奏+资本化”双催化落地。宇树正式确定了150.8元/股的发行价和610亿元的发行市值，发行较原募资计划上修 45%，战配名 单呈现“技术盟友+产业巨头+国家队”强势组合，超预期；其意义一是为具身智能赛道树立估值试金石 ，二是上市后有望引导资本覆盖算法 、整机制造、核心零 部件、场景运营全链条，强化头部示范，加速产业协同。当前市场对于机器人板块预期较弱 ，但根据产业链调研 Optimus量产已然在路上，发酵了4-5年的机器人 产业预计正面临拐点；国内链催化加快 ，除宇树/云深处递表冲击IPO外，后续智元/银河通用/众擎/灵心巧手/普渡等今年或也有资本化进度更新；同时 ，国内机器 人量产及场景验证同步加快 。因此，投资策略我们强调 ——长期布局、逢低配置、聚焦核心标的。建议关注以下方向标的配置价值 ，包括特斯拉链高胜率 、技术 迭代升级方向、具备预期差的低估值；宇树等其他具备放量能力的国产链 。2）智驾板块核心催化渐近：本月亚马逊 Zoox获NHTSA批准在拉斯维加斯开展无方向 盘、无踏板收费运营； 8月4日工信部发布首部 L3/L4强制国标将于2027年7月1日实施，适用于M类、N类车辆，新规将倒逼行业加速产品定型 。智驾向高而行的中 长期趋势依旧清晰 ，看好L3/L4产业趋势下增量部件及解决方案供应商 。 推荐组合：潍柴动力、江淮汽车、中国重汽、宇通客车、禾赛、吉利汽车、新泉股份、贝斯特。 4 仅供内部参考，请勿外传 仅供内部参考，请勿外传 本周：行业指数上涨 1.02%，汽零板块占优 2026年8月3日-8月7日，SW汽车行业+1.02%；子板块中 ，乘用车、汽车零部件 、商用车分别- 6.53%/+4.47%/-4.34%。 资料来源：Wind，中信建投图表：汽车行业主要指数走势 61000012000140001600018000200002200024000 45005500650075008500950010500 2026-05-26 2026-05-28 2026-05-30 2026-06-01 2026-06-03 2026-06-05 2026-06-07 2026-06-09 2026-06-11 2026-06-13 2026-06-15 2026-06-17 2026-06-19 2026-06-21 2026-06-23 2026-06-25 2026-06-27 2026-06-29 2026-07-01 2026-07-03 2026-07-05 2026-07-07 2026-07-09 2026-07-11 2026-07-13 2026-07-15 2026-07-17 2026-07-19 2026-07-21 2026-07-23 2026-07-25 2026-07-27 2026-07-29 2026-07-31 2026-08-02 2026-08-04 2026-08-06汽车（申万） 汽车零部件（申万） 商用车（申万） 乘用车（申万，右轴） 仅供内部参考，请勿外传 7一、个股涨跌幅情况更新 公司代码总市值 （亿元）本周股价涨跌幅 （%）归母净利润（亿元） PE 24A25A26E27E24A25A26E27E ST中路B900915.SH 19 A（跨阻放大器）成为光通信新瓶颈事件催化：AAOI创始人称800G/1.6T需求持续超产能，瓶颈在自身产能及TIA 、DSP等组件供应。瓶颈是产能DSP/TIA 组件。前我们面临的最大运营挑战，是800G和1.6T光模块所需的DSP和TIA芯片。1.6T面临的最大顾虑是材料供应（特指DSP/TIA），而非制造产能，制造产能应在2到3周内准备就绪。 1️⃣卓胜微：射频龙头用 12 寸 SiGe IDM 切800G/1.6T TIA+Driver，112G/224G PAM4 已送样，2026H2–2027 小批量预期，优势在 IDM 工艺复用 2️⃣光迅科技：IDM （InP+SiGe+模块），TIA 以自供配套 25G/50G/100G 光模块为主，单波 100G 自用迭代中，单波 200G 研发；不对外卖 TIA 赚 merchant 钱，是“自产自销型” 3️⃣优迅股份：A 股唯一纯光通信前端电芯片（TIA/LDD/LA/CDR/TRX）上市标的，10G 及以下全球前二（市占 ~28%）、国内第一；25G/50G 批量；单波 100G PAM4 TIA 已回片送...", "publish_time": "2026-08-11 12:10", "tags": ["TIA（跨阻放大器）成为光通信新瓶颈", "文字观点"]}, "post:2026-08-11T08-47:57103426d8d6": {"id": "post:2026-08-11T08-47:57103426d8d6", "kind": "post", "title": "2026-08-11 08:47", "source_label": "帖子正文", "excerpt": "# 高盛 2026.8.11 光模块行业 ## 一、核心背景 特朗普政府拟联合 FCC 出台禁令限制进口中国数据中心光模块，市场衍生三大投资争议；报告不预判政策落地结果，**全覆盖国内头部光模块企业并给予买入评级**，看好龙头长期竞争力。", "content": "# 高盛 2026.8.11 光模块行业 ## 一、核心背景 特朗普政府拟联合 FCC 出台禁令限制进口中国数据中心光模块，市场衍生三大投资争议；报告不预判政策落地结果，**全覆盖国内头部光模块企业并给予买入评级**，看好龙头长期竞争力。 覆盖标的：新易盛、FOCI、联亚光电、RoboTechnik、昱泉光电。 ## 二、三大核心争议 & 核心逻辑 1. **客户粘性只会增强，难以替换龙头** AI 服务器架构迭代快，光模块存在速率、封装、材料、光纤多维度海量 SKU，新厂商验证、生态适配周期极长；叠加 AI 需求爆发、原材料紧缺，云厂商优先绑定具备 400G/800G/1.6T 全球首发技术优势的中国龙头，切换成本极高。 2. **产能与制造效率构筑硬壁垒** 全球前十大光模块厂商 7 家为中国企业，2025 年份额持续提升；龙头自研自动化产线、全球化多基地扩产；1.6T 及以上产品耦合、散热工艺难度陡增，中小厂商短期无法追上良率与成本水平。 3. **东南亚建厂对冲地缘政策风险** 2019 年以来地缘摩擦、疫情、关税扰动持续，头部厂商落地泰国、越南产线，海外工厂可量产 1....", "publish_time": "2026-08-11 08:47", "tags": ["文字观点"]}, "attachment:files/China Communications Infrastructure - Evaluating Potential FCC Regulatory Action & Impact on China Optics.pdf": {"id": "attachment:files/China Communications Infrastructure - Evaluating Potential FCC Regulatory Action & Impact on China Optics.pdf", "kind": "attachment", "title": "China Communications Infrastructure - Evaluating Potential FCC Regulatory Action & Impact on China Optics", "source_label": "China Communications Infrastructure", "excerpt": "See Appendix A-1 for Analyst Certification, Important Disclosures and Research Analyst Affiliations. Not for distribution in the People's Republic of China, excluding the Hong Kong", "content": "See Appendix A-1 for Analyst Certification, Important Disclosures and Research Analyst Affiliations. Not for distribution in the People's Republic of China, excluding the Hong Kong Special Administrative Region and Qualified Foreign Institutional Investors.09 Aug 2026 17:16:43 ET │ 16 pages China Communications Infrastructure Evaluating Potential FCC Regulatory Action & Impact on China Optics CITI'S TAKE Following our commentary on the Reuters report (4-Aug) about the US weighing a Chinese optical components ban, we examine the FCC's Covered List mechanism more closely. FCC 26-50 establishes the regulatory architecture, bifurcating the Covered List into producer-based and production location-based categories, and no enacted FCC rule currently restricts Chinese optical module exports to the US. We view a producer-based approach as unlikely, given Chinese vendors supply 60– 70% of high-speed modules to US CSPs, and near-term alternatives appear insufficient given supply tightness. A production location-based restriction looks more plausible structurally – but we believe reported consideration of such an optical module ban is unlikely to evolve into a genuine near-term enforcement action, given supply-chain challenges. What has been enacted — FCC 26-50 formally bifurcates the Covered List into two mechanisms: Producer/Provider-Based Approach restricting named entities such as Huawei and ZTE regardless of production location, and Production Location- Based Approach restricting entire product categories made outside the US, currently covering UAS, routers, inverters, and advanced robots. Optical transceivers are indirectly mentioned — Optical transceivers do not appear as a restricted product category in any enacted FCC rule. The only reference in FCC 26-50 is a passing mention as an illustrative example in the context of proposed hardware/software BOM disclosure requirements — not a restriction. The Reuters report is entirely separate from FCC 26-50 and reflects a draft proposal stage only. Optical transceiver supply alternatives are limited — There may be a number of possible reasons for Trump administration officials to consider an optical transceivers ban, or to just highlight the possibility of such an enforcement action. But we estimate that a genuine restriction would eliminate the majority of optical transceivers supply to the US domestic AI buildout, with significant supply-chain consequences that US companies may not be ready to absorb within a short timeframe. We understand US optics companies are building highly automated local production lines, but this will take time to ramp and appears insufficient to fulfill upcoming AI demand. Impact on covered names — DSBJ and Eoptolink face high exposure under Producer/Provider-Based and All-Foreign Location-Based approaches given their direct US optical transceiver exports, moderating only under a China-Only restriction as overseas capacity ramps; TFC remains most insulated as a passive component supplier with indirect impact only, in our view. Kyna Wong AC +852-2868-7820 kyna.wong@citi.com Karen Huang +852-2501-2755 karen.xw.huang@citi.com Yiming Li, CFA +852-2501-2857 yiming.li@citi.com Kevin Chen +852-2501-2125 kevin.y.chen@citi.com nVi e w p o i n t | China Communications Infrastructure 10 August 2026 Citi Research 2The Enacted Framework: FCC 26-50 Formalizes Producer-Based and Location-Based Covered List The FCC's equipment authorization framework has evolved through a series of formal actions, culminating in the Third Report and Order (FCC 26-50, adopted 22 July 2026). Two key mechanisms are now formally in force: nProducer/Provider-Based Covered List — The original and established model in which named entities (for example Huawei, ZTE, etc.) and their subsidiaries/affiliates are prohibited from receiving new FCC equipment authorizations. The restriction follows the company, not the factory location. Based on the FCC's established Covered List general rules applied to other product categories, existing authorised models would likely be unaffected; only new models would be blocked. nProduction Location-Based Covered List — Rather than naming a specific company, this approach restricts an entire product category based on where it is made. Currently applied to Unmanned Aircraft System (UAS), UAS critical components, routers, power inverters, and advanced robotic devices produced in a foreign country — defined as any product not meeting the US domestic product standard (≥65% US-origin content, rising to 75% from 2029). Critically, under this standard, products made in Thailand, Vietnam, or Malaysia are as equally \"foreign produced\" as those made in China. Optical Transceivers Are Indirectly Mentioned Optical transceivers are not mentioned as a restricted product category in any enacted FCC rule to date. Their appearance in FCC 26-50 is limited to an illustrative reference in the context of proposed HBOM/SBOM (hardware/software bill of materials) disclosure requirements: \"Should we instead just list out several critical components, such as modular transmitters and IoT modules, semiconductors, and optical transceivers?\" Optical transceiver appears here only as an example of components that might be subject to future disclosure requirements, not as a restriction. The enacted logic-bearing hardware component prohibition (which could theoretically capture modern high-speed optical modules containing DSPs and control chips) similarly only applies to components produced by entities already on the Covered List (for example Huawei); no major Chinese optical module company is currently listed. The Reuters report (4-Aug) describing an optical module import ban is therefore entirely separate from FCC 26-50. The reported possible ban remains at draft/proposal stage, with no formal rule published. China Communications Infrastructure 10 August 2026 Citi Research 3Potential Pathways — Scenario Analysis The following is a speculative analytical inference based on established FCC mechanisms. No formal optical transceivers rule exists as of 9 Aug 2026. For possible Covered List inclusion of China optics names under FCC mechanisms: If Producer/Provider-Based: Specific companies such as Eoptolink and DSBJ would be named on the Covered List. Under the FCC's proposed broad \"produced by\" definition — covering entities exercising substantial control over design, development, manufacturing, or assembly — offshore subsidiaries in Thailand or Vietnam or Taiwan would likely still be captured. Relocating only final assembly would be insufficient. Adjustment space is minimal. Non-Chinese competitors (Japan, Korea, Europe) would be unaffected and would directly benefit. We view this pathway as unlikely in the near term at a moment when Chinese vendors collectively supply 60–70% of high- speed modules at major US CSPs, and US domestic alternatives cannot fill the gap within a meaningful timeframe. If Production Location-Based — All Foreign Production: All optical modules not meeting the US domestic content threshold would be restricted, regardless of whether they are made in China, Thailand, or Vietnam. This is a very restrictive scenario — offshore capacity strategies pursued by Eoptolink or DSBJ would provide no regulatory protection. However, the impact on US AI infrastructure buildout would also be severe, likely creating pressure for a broad exemption mechanism. In this case, there would be more automated production lines to be built in order to fulfill the production location requirement. Equipment or automation companies would benefit. If Production Location-Based — China-Origin Only: Offshore production would theoretically provide relief — but the degree of protection depends heavily on how \"produced in a foreign country\" vs. \"produced in China\" is ultimately defined. But the current enforced FCC 26-50 explicitly notes it is not adopting a simple last-substantial-transformation test; design, firmware, and supply chain control all relevant factors. This scenario offers the most room for discussion, but the definition question remains entirely unresolved. We view Production Location-Based Restriction as the more plausible pathway if any action materialises, as it follows the established template of UAS, inverters and robots. However, we believe the probability of near-term enforcement is low given the following considerations: nChinese vendors supply most high-speed optical transceivers to US AI data centers; a genuine ban would directly impair the US AI infrastructure buildout, which the administration publicly champions. nThe FCC explicitly retains the ability to modify or shelve restrictions — and has done so before. nThe September and November 2026 US-China diplomatic calendar provides natural inflection points at which optical module restrictions could be raised amid negotiations about concessions on rare earths, agricultural purchases, or other bilateral priorities. China Communications Infrastructure 10 August 2026 Citi Research 4We summarise the differential impact on covered China optics names across three regulatory scenarios: DSBJ and Eoptolink face high exposure under both the Producer/Provider-Based and All-Foreign Location-Based scenarios, as they have significant optical transceivers business export to US. The impact will be moderate only under a China-Only Location restriction, as they have ramped up capacity overseas (such as Thailand). TFC is the most insulated across all scenarios, rated Moderate at worst, given it does not directly manufacture optical transceivers and any impact flows indirectly through downstream order softness from module customers. Figure 1. Impact Summary for China Optics Names Across Scenarios © 2026 Citigroup Inc. No redistribution without Citigroup’s written permission. Source: Citi Research Estimates, Company Reports Figure 2. Optical 27E, set at - 0.5SD the 5-year historical mean to reflect a strong 800G/1.6T cycle, ASIC and Scale-Up Opportunity at CSP customers on the one hand and CPO cannibalization at its key customer Nvidia on the other. Risks Downside risks that could impede the stock from reaching our target price include: 1) slower-than-expected data center investments, 2) lower-than- expected optical network capex by telcos and corporates/governments in China, 3) margin pressures due to price competition, 4) slower-than- expected expansion of new customers, 5) China-US tech disputes and 6) faster-than-expected CPO deployment. Suzhou TFC Optical Communication (300394.SZ; Rmb230.68; 1; 07 Aug 26; 15:00) Valuation Our target price for Suzhou TFC of Rmb419/share is based on 34.3x 27E P/E, at the five-year mean of the stock to factor in new CPO re-rate, partially offset by cannibalization of its 1.6T /800G business in 2027. Risks China Communications Infrastructure 10 August 2026 Citi Research 6Downside risks that could impede the Suzhou TFC stock from reaching our target price include: 1) slower-than-expected new product development; 2) slower-than-expected AI development across the globe; 3) slower-than- expected AI infrastructure/data center investment; 4) China-US tech disputes, 5) EML or upstream components supply constraint, 6) rising competition, 7) delayed CPO deployment in scale-out and scale-up. ZTE (0763.HK; HK$24.7; 2; 07 Aug 26; 16:10) Valuation Our target price for ZTE of HK$25.40 is based on 15.0x 26E P/E, set at 1.5SD above its 5-year historical average for its second curve growth driver. We expect ZTE’s revenue growth will be driven by new biz initiatives like AI server, other computing power-related products and consumer biz, which should offset the carrier network segment's weakness. Risks Downside risks for the ZTE stock to reach our target price include: 1) lower- than-expected computing infrastructure investment from Chinese telcos and cloud service providers; 2) faster-than-expected 5G BTS price decline; and 3) global market share pressure on ZTE due to US-China disputes. Upside risks that could lead to the stock trading above our TP include: 1) higher-than- expected computing infrastructure investment from Chinese telcos and cloud service providers; 2) Stabilizing 5G BTS price decline; and 3) settlement of the prior US bribery infringement. China Communications Infrastructure 10 August 2026 Citi Research 7If you are visually impaired and would like to speak to a Citi representative regarding the details of the graphics in this document, please call USA 1-888-500-5008 (TTY: 711), from outside the US +1-210-677-3788 Appendix A-1 ANALYST CERTIFICATION The research analysts primarily responsible for the preparation and content of this research report are either (i) designated by “AC” in the author block or (ii) listed in bold alongside content which is attributable to that analyst. If multiple AC analysts are designated in the author block, each analyst is certifying with respect to the entire research report other than (a) content attributable to another AC certifying analyst listed in bold alongside the content and (b) views expressed solely with respect to a specific issuer which are attributable to another AC certifying analyst identified in the price charts or rating history tables for that issuer shown below. Each of these analysts certify, with respect to the sections of the report for which they are responsible: (1) that the views expressed therein accurately reflect their personal views about each issuer and security referenced and were prepared in an independent manner, including with respect to Citigroup Global Markets Inc. and its affiliates; and (2) no part of the research analyst's compensation was, is, or will be, directly or indirectly, related to the specific recommendations or views expressed by that research analyst in this report. IMPORTANT DISCLOSURES China Communications Infrastructure 10 August 2026 Citi Resear Y in 2026/27E. We see new growth drivers from optical modules, Kyber orthogonal backplane, ASICs and higher-spec CCL/ materials emerging, offering potential volume and content value gains and a favourable competitive landscape for select companies we cover. Trading at an attractive 25x NTM UBSe PE, we forecast a 46% EPS CAGR in 2026-28 for our coverage versus Wind consensus of 35% . CCL: FR4 fuels near-term earnings; AI mix paves a longer runway We believe the durability of the current conventional CCL upcycle is underestimated despite FR4 CCL prices exceeding the previous cycle peak, as supply remains tight due to AI-driven capacity absorption. We conservatively forecast FR4 CCL prices of Rmb365/ sheet by 1H27, supported by lingering shortages in CCL and upstream materials (E- glass). Kingboard (KBL) and Shengyi Tech (SYT) are likely to be key beneficiaries given their scale, quality and bargaining power, while AI exposure fuel further growth. We see SYT as well positioned to benefit from AI CCL upgrades and KBL as likely to lift its AI exposure via upstream materials before penetration into high-speed/AI CCL. CCL industry consolidation is likely to continue as supply constraints increasingly favour the largest as well as vertically integrated firms. PCB: Optical, ASIC & backplane to support growth beyond Rubin spec upgrades Besides Rubin's spec upgrades, we believe 800G/1.6T optical module PCBs and ASIC units can fuel near-term earnings growth. We prefer suppliers such as Shennan and Avary for their high-end manufacturing capabilities (mSAP , HDI, HLC) and established relationships with key customers. We believe the market has not fully realised Shennan's optical module PCB revenue potential, which could reach 25% of total revenue in 2027E, lifting PCB's 2026/27E YoY growth to 38%/48%. We see Shennan's current valuation as the most attractive given its exposure to optical module PCBs, with upside from the optionality of Kyber backplane adoption not yet priced in (similarly for SYT through potential backplane CCL allocation). We expect the Kyber orthogonal backplane to still launch with Feynman in 2028 and could lift SYT/Shennan's 2026-29E earnings CAGR to 44%/47% from our current estimates of 38%/39%. SYT/Shennan most preferred; initiate on KBL at Buy ; upgrade Avary to Buy Sector-wise, we continue to favour CCL/upstream companies and select PCB names. We keep SYT and Shennan as our top picks, followed by KBL and Avary (all rated Buy). We raise SYT / Shennan / Avary's PTs by 98% / 66% / 136% to Rmb192.00 / Rmb473.00 / Rmb130.00, reflecting stronger AI order visibility, share-gain opportunities and continued margin expansion. We initiate coverage on KBL with a HK$58.00 PT based on 17x 2027E PE. We upgrade Avary from Neutral to Buy based on a 40x 2027E PE on the back of a higher 42% 2026-29E earnings CAGR from optical and AI PCB led growth, as major planned capacity expansion ramps. We remain Neutral on FastPrint as valuation remains demanding despite our above-consensus EPS; we may turn more positive when AI/optical module PCBs and ABF substrate begin to contribute meaningfully. This report has been prepared by UBS Securities Asia Limited. ANALYST CERTIFICATION AND REQUIRED DISCLOSURES, including information on the Quantitative Research Review published by UBS, begin on page 37. Equities China Communications Technology Jimmy Yu Analyst jimmy.yu@ubs.com +86-21-3866 8880 Edward Liu Analyst edward.liu@ubs.com +852-3712 3981 David Chow Associate Analyst david.chow@ubs.com +852-3712 3512 China PCB and CCL Sector 10 August 2026 ab 2China PCB and CCL Sector UBS Research Sector Thesis Map UBS Research THESIS MAP MOST FAVORED SYT, Shennan, KBL, AvaryLEAST FAVORED Q: How do the Rubin and Kyber backplane delays change the PCB outlook? Only to a limited extent in the near term, in our view, and we believe the extended timeline could be a a share gain opportunity for potential entrants as qualification windows extend. We expect backplane to feature in Feynman, ramping up from 2028; we estimate the backplane PCB TAM to be Rmb1.2bn/31.8bn/48.0bn in 2028/29/30. We expect Avary to enter Rubin through HDI qualification, while Shennan's backplane know-how positions it as a potential supplier, alongside SYT on CCL, where we see a PTFE-hybrid solution as the most feasible. Shennan and Avary look well positioned for near-term growth in: 1) optical module PCB, benefiting a handful of suppliers with mSAP know-how; and 2) ASIC, which would see higher unit growth vs. GPUs in 2026/27E. Q: Is the market underappreciating the conventional CCL upcycle? Yes. We believe the market is overlooking the sustainability of this upcycle and pricing in an approaching peak. We think this cycle could be more extended than past cycles due to structural S/D drivers as well as upstream material tightness, with AI crowding out conventional supply and adding incremental demand while near-term supply responses remain limited. We forecast an industry electronic fabric S/D gap of over 10% through 2027E as effective capacity is bottlenecked by Toyota's loom equipment while peers reallocate capacity towards AI/speciality fabric. A conventional CCL upcycle is likely to benefit KBL and SYT, as it remains the primary earnings driver for both. Q: What is the earnings impact and what is mispriced? For our top picks, we raise 2027/28E earnings by 58%/92% for SYT and 30%/80% for Shennan, putting us 8-29% above consensus. We believe the market is not fully pricing in: 1) SYT's leverage to the conventional CCL upcycle, with segment revenue rising 103%/52% in 2026/27E alongside GPM expansion, also helped by a greater AI CCL mix; 2) Shennan's optical module PCB revenue potential, lifting PCB segment growth to 38%/48% YoY in 2026/27E; and 3) the adoption of Kyber backplane, which we expect to lift 2026-29 earnings CAGRs from 38%/39% to 44%/47% for SYT/Shennan, could support potential valuation upside of 59%/50% versus 37%/24% on our current price targets. Sector-wise, we continue to favour CCL/upstream and remain selective on PCB names. We expect KBL and SYT to benefit from more sustainable conventional CCL upcycle through 2027, while emerging AI exposure delivers the next leg of growth. For PCB, we are selective on companies with: 1) share gain potential at Nvidia for longer-term growth; and 2) near-term earnings drivers from optical module PCB and ASIC, which we see at both Shennan and Avary. 1) UBS forecast top 5 hyperscalers' capex to increase 84%/45% YoY in 2026/27E; 2) KBL has hiked FR-4 CCL prices multiple times YTD , with monthly hikes since March; 3) E-glass fabric has seen monthly price hikes YTD, with prices now at historical highs; 4) we forecast the number of ex-Nvidia accelerator units to increase 49%/98% YoY in 2026/27E versus Nvidia GPU (SIP) units of 17%/36%. The Wind PCB sector index has fallen 25% from its June all-time peak, and we view market pessimism as stemming from a later backplane timeline alongside broader weakness in sentiment towards AI infrastructure names. Companies in our coverage now trade within the 30-50x 12-month fwd PE range as the 2019-21 5G upcycle. We forecast our covered companies to record a 46% earnings CAGR in 2026-28 vs. 33% in 2019-21, suggesting further re-rating upside. Figure 1: Our China PCB coverage by preference– ratings, earnings and price target changes Market Price Old price New price NP cap 07-Aug target target Old New EPS Revision Old target New target P/E (x) CAGR PEG ROE Company Ticker (US$m) (LC$) (LC$) (LC$) Rating Rating 2026E 2027E 2028E PE multiple PE multiple 2026E 2027E 2028E 26-29E 27PE/26-29E 2026E 2027E 2028E UBS-S China PCB/CCL Sector Coverage Shengyi Technology 600183.SS 50,393 140 97 192 Buy Buy 38% 57% 91% 35x (on 26E) 40x (on 27E) 43.3 29.2 20.8 38% 0.8 41% 47% 52% Shennan Circuits 002916.SZ 38,627 383 285 473 Buy Buy -1% 27% 73% 38x (on 26E)* 40x (on 27E)* 51.5 32.5 23.9 39% 0.8 26% 31% 31% Kingboard Laminates 1888.HK 15,331 38 - 58 -  is in line with our expectation based on our early industry study of upstream CCL vendors in May, suggesting the adoption of the orthogonal backplane is likely to start with Feynman. Despite a later timeline, we believe the Kyber orthogonal backplane will unlikely be cancelled and could potentially lead to content value/market share gain opportunities for PCB/CCL suppliers. We see emerging solutions such as a PTFE-based CCL solution gaining traction in recent sampling trials of the Kyber backplane, while a longer sampling period provides more time for yield improvement and supply chain preparation. We now believe the M9/PTFE- hybrid CCL solution appears to be the most feasible option for the backplane, where PTFE would be used in critical low-loss layers while M9-level hydrocarbon and Low-Dk2 glass fabric are retained in core layers. We expect SYT and Shennan to be major beneficiaries of the Kyber backplane, with even higher leverage if a PTFE-hybrid solution is adopted. UBS estimates Feynman's rack volumes of 1.0k/26.5k/40.0k in 2028/29/30E, which could represent a Kyber backplane PCB TAM of Rmb1.2bn/Rmb31.8bn/Rmb48.0bn. Our base-case forecasts for Shennan and SYT do not factor in earnings contributions from the Kyber backplane. But we estimate that backplane adoption upside potential could add roughly Rmb2,862m and Rmb2,544m in incremental profits to SYT and Shennan's 2029E bottom line, on the back of our somewhat conservative assumptions of a 20%/50% supplier wallet share for backplane PCB/CCL, respectively. Figure 2: Our estimates for the potential TAM of the Kyber backplane Rack Units 2026E 2027E 2028E 2029E 2030E Blackwell (NVL72) 17,778 1,863 Blackwell Ultra (NVL72) 48,608 27,537 4,738 Rubin (NVL72) 6,150 58,826 20,000 Rubin Ultra (NVL72) 1,800 70,000 20,000 984 Feynman (NVL144/288) 1,000 26,500 40,000 Total 72,536 90,026 95,738 46,500 40,984 Kyber Backplane TAM 2026E 2027E 2028E 2029E 2030E Feynman (NVL144/288) Rack 1,000 26,500 40,000 Backplane per Rack 4 4 4 Backplane ASP (Rmb '000) 300 300 300 Backplane TAM (Rmb mn) 1,200 31,800 48,000 Source: UBS estimates We forecast a SYT/Shennan earnings CAGR of 38%/39% over 2026-29E, and estimate this could accelerate to 44%/47% if SYT/Shennan secure Kyber backplane allocation. We believe this could lead to potential valuation upside to our current PTs, driven by multiples expansion from higher earnings growth. Our current PTs imply 37%/24% price upside, while we estimate backplane could support potential valuation upside of 59%/50% for SYT/Shennan (assuming target PEG remain the same as our base-case valuations). Therefore, we believe current valuations for SYT and Shennan look China PCB and CCL Sector 10 August 2026 ab 4attractive, with upside potential from the Kyber orthogonal backplane not priced in. Figure 3: Oberon (NVL72) versus Kyber (NVL144) rack comparison Source: UBS Figure 4: Kyber (NVL144) orthogonal backplane cross-section depiction Source: UBS In our Q126 PCB sector GTC preview , we noted that the M9 + Q-glass + HVLP4 could be a feasible CCL solution, but our latest industry study suggests the Q-glass combination is on hold after two failed sampling trials in Q126, likely due to Q-glass processing difficulties in a 100+ layers form factor, inadequate supply and higher costs versus other possible solutions (such as Low-Dk2 glass fabric with meaningfully higher yields). We see CCL makers pivoting to alternative solutions, which include: 1) M9 + PTFE-hybrid, which China PCB and CCL Sector 10 August 2026 ab 5has passed Nvidia's verification; and 2) M10 + Low Dk2 (both solutions use HVLP4 copper foil), with final design lock-in for the Kyber backplane expected in Q426 and multiple rounds of sampling currently underway ( we met with Victory Giant at our H- share Corporate Day and it indicated that more than 10 material/vendor combinations are still being considered, including various layer count designs). We now lean towards PTFE as the longer-term beneficiary given its much better Dk/Df performance than alternatives and a longer runway for potential adoption in other PCBs (compute tray Midplane / LPU / switch board) for future generations, making it more worthwhile for R&D. We expect Shennan to be one of SYT's PCB partners on the backplane, which would mark Shennan's first entry into Nvidia, if not earlier. We believe SYT is leading the PTFE CCL formula for the Kyber backplane, while other CCL suppliers remain in early sample stages. However, the technical bar remains high for PTFE CCL production as challenges exist for both the CCL and PCB sides: 1) PTFE is very soft and difficult to drill cleanly, producing burrs that hurt yields; and 2) CTE mismatch with copper creates warpage risk in high-layer-count lamination as well as adhesion difficulties. We think SYT has addressed these issues by adding SiO2 filler to increase rigidity while lowering CTE, alongside adding hydrocarbon coating for better adhesion. This has likely led to production yields increasing to about 40-50% from 20%, putting the solution on track for the mass production timeline, according to our industry studies. Despite Q-glass's optimal Dk/Df performance over other speciality/AI-grade glass fabrics, we believe Q-glass's processing difficulty has shown to be higher than expected, especially for HLC products such as the backplane, and hence alternatives that primarily use Low-Dk2 (with M10) are also being sampled in parallel. Therefore, we expect greater demand for Low-Dk2 in the near-term and likely a longer product lifecycle. We believe a domestic AI CCL supplier was the first to send samples for the M10 solution in February, followed by Doosan, SYT and EMC around June. Figure 5: PTFE outperforms alternative resins on Dk / Df performance Prepreg Components Dk @10GHz Df @10GHz Resins Epoxy 3.8 - 4.2 0.017 - 0.023 PPO 2.6 - 2.8 0.002 Hydrocarbon (BCB/PPO blend) 2.5 - 2.7 0.0007 - 0.0015 PTFE (neat or SiO2-filled) 2.0 - 3.1 0.0002 - 0.0005 Glass fabrics E-glass ab656ba12", "kind": "post", "title": "2026-08-11 07:12", "source_label": "帖子正文", "excerpt": "关注国内算力景气度 🎁据《科创板日报》报道，基于首创全模块化设计架构，阿里已将大型AIDC数据中心的交付工期缩短至100天。", "content": "【华泰通信】阿里计划提高全球数据中心产能，关注国内算力景气度 🎁据《科创板日报》报道，基于首创全模块化设计架构，阿里已将大型AIDC数据中心的交付工期缩短至100天。计划将模块化数据中心的全球产能提升两倍以上。如何看待AIDC产能提升？ 国内AIDC建设速度一直在全球市场中遥遥领先，单体数据中心在美国的建设和交付周期通常长达2-3年，近期建设速度跟不上需求的现象日趋明显，在此趋势下，模块化数据中心、一体化集成冷站等提升AIDC建设速度的新解决方案渗透率日益提升。今年阿里云同样转向模块化数据中心开发，进一步提升交付速度，也是下游算力需求旺盛的又一佐证。关注AIDC&算租产业链机遇 随着大模型及AI应用的性能突破，国内算力供需缺口更为明显，高性能算力卡集群仍是关键卡点，5月以来渠道要求趋严，掌握核心算力集群的厂商话语权强化，涨价、商业模式优化（Token分成）现象陆续出现，Q2业绩景气度高，推荐持续关注AIDC&算租产业链龙头厂商机遇。产业链相关公司包括：润泽科技、万国数据、世纪互联、协创数据、宏景科技、行云科技等。#文字观点", "publish_time": "2026-08-11 07:12", "tags": ["文字观点"]}, "post:2026-08-11T21-17:4ede310b356c": {"id": "post:2026-08-11T21-17:4ede310b356c", "kind": "post", "title": "2026-08-11 21:17", "source_label": "帖子正文", "excerpt": "20260811盘后消息汇总 AI 1.NV：Rubin架构更新,OEM/ODM、PCB供应商核心受益", "content": "20260811盘后消息汇总 AI 1.NV：Rubin架构更新,OEM/ODM、PCB供应商核心受益；ABF基板面积、层数有望上升，带动价值量提升 2.光纤:移动普通光缆集采重新发标，较上次流标定价上调8.5%，厂商议价权提升 3.扩产 ①JX先进金属将在FY29年底前进行大规模InP扩产。产能将比原计划的 7-10倍增长20-30倍（盘中） ②报道称SK海力士重启中国NAND闪存生产基地2号工厂建设将产能扩大约50% ③源杰科技：拟投资43亿元建设半导体科技产业园项目扩大高端激光器芯片生产规模 4.行云科技澄清：至今未发生任何算力设备及相关商品被海关扣留、滞留等无法通关的情形 其他 1.高盛称AI投资重点正转向人形机器人 2027年至2029年或迎规模化部署#文字观点", "publish_time": "2026-08-11 21:17", "tags": ["文字观点"]}, "post:2026-08-11T22-45:8e10490e66d0": {"id": "post:2026-08-11T22-45:8e10490e66d0", "kind": "post", "title": "2026-08-11 22:45", "source_label": "帖子正文", "excerpt": "【广发通信】源杰科技拟42.68亿元投建新基地，充分彰显28年行业高景气趋势 事件：源杰科技拟投资建设“源杰半导体科技产业园项目（暂定名称）”，总投资额约为42.68亿元人民币，拟", "content": "【广发通信】源杰科技拟42.68亿元投建新基地，充分彰显28年行业高景气趋势 事件：源杰科技拟投资建设“源杰半导体科技产业园项目（暂定名称）”，总投资额约为42.68亿元人民币，拟购买126亩土地使用权，拟建设包含激光器芯片生产线、厂房及配套设施等。 积极扩产彰显28年景气信心。公司截止到 26年一季度，公司固定资产/在建工程仅分别为8.2亿/1.38 亿元，从投建节奏上看，今年2月公司拟投资二期项目12.51亿元，核心覆盖27年公司新增产能需求。而此轮建设预计在为28年需求做准备，充分彰显对28年行业需求及公司份额的决心。同时，现阶段目前公司亦在加紧 MOCVD、E-BEAM等核心设备的定金支付、到货及工艺调试，我们预计27年公司产能翻倍以上增长、28 年有望继续加速。 高端化为公司当下核心成长逻辑。1）我们预计下半年公司 100G EML 将有大几百万只的出货。2）同时公司300mw以上cw光源等高
