[]}, "post:2026-09-12T11-26:beb2bab8604f": {"id": "post:2026-09-12T11-26:beb2bab8604f", "kind": "post", "title": "2026-09-12 11:26", "source_label": "帖子正文", "excerpt": "浙商机械 邱世梁 【罗博特科】 ——#9月10日举行港股聆讯港股渐近，后续期待CPO、NPO、OCS多点共振#事件：2026年9月10日，公司举行港股上市聆讯。#核心逻辑：公司依托高精度光子学对准技术底座，兼具稀缺性与延展性，始终卡位最前沿的光互联方案。", "content": "", "publish_time": "2026-09-12 11:26", "tags": ["9月10日举行港股聆讯", "事件", "核心逻辑", "边际变化", "后续有何催化", "文字观点"]}, "post:2026-09-12T11-29:dd67ccf1b087": {"id": "post:2026-09-12T11-29:dd67ccf1b087", "kind": "post", "title": "2026-09-12 11:29", "source_label": "帖子正文", "excerpt": "【广发通信】后续光互连板块重要催化及利好方向 🪶光博会结束，我们判断后续光互连板块将在大光带领下整体板块走强，具体原因： 1️⃣业绩。9月中旬开始，市场将开始聚焦三季度业绩。", "content": "", "publish_time": "2026-09-12 11:29", "tags": ["文字观点"]}, "post:2026-09-12T16-10:bbc7fb4eeac9": {"id": "post:2026-09-12T16-10:bbc7fb4eeac9", "kind": "post", "title": "2026-09-12 16:10", "source_label": "帖子正文", "excerpt": "【申万家电&轻工&汽车】两轮车8月数据点评8月行业整体销售仍承压。根据奥维云网数据，2026年8月，两轮车行业产量742万台，同比-6%", "content": "", "publish_time": "2026-09-12 16:10", "tags": ["文字观点"]}, "post:2026-09-12T16-24:99502aafbc8d": {"id": "post:2026-09-12T16-24:99502aafbc8d", "kind": "post", "title": "2026-09-12 16:24", "source_label": "帖子正文", "excerpt": "机构小秘圈 解读一下，昨晚规则针对此前禁令的漏洞进行了精准修补： 1. 填补“组件规避”漏洞（核心漏洞）：原禁令局限：2022年的禁令主要限制“覆盖清单”上实体（如华为、中兴等）直接生产的新设备获得FCC授权，但未能限制第三方通过采购被禁实体的“逻辑硬件组件”自行组装整机来规避禁令。修补措施：新规将", "content": "", "publish_time": "2026-09-12 16:24", "tags": ["文字观点"]}, "post:2026-09-12T16-09:7262893c1756": {"id": "post:2026-09-12T16-09:7262893c1756", "kind": "post", "title": "2026-09-12 16:09", "source_label": "帖子正文", "excerpt": "若 9 月沃什不能兑现其鹰派承诺，美联储公信力将明显受挫、长端利率将更难以控制 8 月核心 CPI 通胀环比超预期升温，数据已为联储 9 月加息 “扫除障碍”，若 9 月沃什不能兑现其鹰派承诺，联储公信力将明显受挫、长端利率将更难以控制。8 月 CPI 环比增速回升 0.32pp 至 0.40%，同", "content": "", "publish_time": "2026-09-12 16:09", "tags": ["文字观点"]}, "post:2026-09-12T11-26:25dcbd0769d3": {"id": "post:2026-09-12T11-26:25dcbd0769d3", "kind": "post", "title": "2026-09-12 11:26", "source_label": "帖子正文", "excerpt": "近日#央视新闻深入东田微南昌工厂进行一线调研，并在南昌发布公众号发布“东田微：一家传统制造企业向高端突围的转型之路”专访。在访谈中，公司明确表示大部分高速光模块光学组件订单已经排产到2027年底交付，订单供不应求！", "content": "", "publish_time": "2026-09-12 11:26", "tags": ["央视新闻深入东田微南昌工厂进行一线调研", "国内为数不多能同时在东莞"]}, "post:2026-09-12T16-24:da9f96d22ed1": {"id": "post:2026-09-12T16-24:da9f96d22ed1", "kind": "post", "title": "2026-09-12 16:24", "source_label": "帖子正文", "excerpt": "机构小秘圈 外面那些瞎扯淡的点评说这次名单里没有光模块就是禁令落地预期反转大利好的，既缺乏投资上的基本常识（阳光电源的逆变器四月被制裁的时候也没打过招呼），也不懂海外政 策出台流程（要先走草案流程征求意见然后再过半年逐渐落地），还缺乏对地缘政治与大国博弈自主可控的理解（元首会晤前要造牌而不是出牌）", "content": "", "publish_time": "2026-09-12 16:24", "tags": ["文字观点"]}}, "source_details": {"post:2026-09-12T11-28:5c28af4d62e9": {"id": "post:2026-09-12T11-28:5c28af4d62e9", "kind": "post", "title": "2026-09-12 11:28", "source_label": "帖子正文", "excerpt": "高盛——美国科技：半导体行业——Communacopia+科技大会2026第三日要点总结 一、 行业核心洞见 • AI宏观趋势与数字半导体：企业对AI基础设施支出的轨迹保持极度乐观。英伟达黄仁勋重申2030年AI基础设施支出规模将达3万亿至4万亿美元。", "content": "高盛——美国科技：半导体行业——Communacopia+科技大会2026第三日要点总结 一、 行业核心洞见 • AI宏观趋势与数字半导体：企业对AI基础设施支出的轨迹保持极度乐观。英伟达黄仁勋重申2030年AI基础设施支出规模将达3万亿至4万亿美元。供应链上下游（上游元器件与下游土地/电力/数据中心产能）约束依然普遍，且下游瓶颈的严峻性在边际上可能更为显著。企业正将AI具体应用于内部业务流程，通过新产品开发与服务创新周期加速来驱动增量收入，并利用内部AI工具提升成本效率。 • 半导体资本设备、代工与存储：企业持续将数据中心建设视为多年结构性增长驱动力。订单与积压量几乎全行业显著增加，能见度达到历史罕见水平。尽管晶圆厂设备（WFE）厂商未提供2027年定量指引，但关于2027年将有8至10座新晶圆厂投产的评论，对WFE支出加速形成支撑。AI推理因上下文窗口产生结构性更高的数据用量，进而推高海量存储需求。AI基础设施中多芯片集成封装的趋势，亦驱动先进封装与PCB结构的增长提速。 • IT服务：在部分垂直领域客户支出疲软的背景下，EPAM预计今年剩余时间仍将面临不利因素。尽管需求环境较弱，但定价利好及向固定价格合同的转变，使公司有望维持稳健的毛利率。 二、 重点公司核心要点 1. 英伟达（Nvidia）——评级：买入 • 2030年TAM展望：管理层重申，受检索式计算向生成式计算范式转移驱动，AI到2030年将构成3万亿至4万亿美元的总可寻址市场（TAM）。摩尔定律放缓提升了英伟达紧密协同设计的硬件与网络堆栈（含NVLink及扩展/伸缩架构）的价值，因客户持续追求更高性能与效率。英伟达正通过向客户交付更多价值，在整体AI资本支出中捕获更大的钱包份额。 • 投资回报：黄仁勋将编程视为当前最具吸引力的生成式AI应用之一，并认为网络安全是AI的重大机遇。AI驱动的代码编写与软件开发正带来显著生产力提升，同时实现更先进的安全能力。 • 供应约束：黄仁勋承认先进封装、晶圆及存储器等领域存在广泛的上游供应约束；同时，电力与场地可用性的数据中心基础设施亦受限。但他强调，英伟达的生态系统规模及深度的客户可视性，是应对这些下游瓶颈的关键优势。尽管供应持续紧张，管理层重申2027年（日历年）营收同比增长约70%的预期。 • 财务担保：黄仁勋探讨了英伟达为支持日益增长的AI生态系统并确保数据中心产能而提供的财务担保与承诺。他表示这有助于培育生态系统，但所产生的回报及参与的投资伙伴种类，与“循环融资”的概念并不相符。 • 物理AI：黄仁勋对物理AI持强烈看多态度，将自动驾驶汽车列为领先用例，并指向仓储自动化、导航系统等新兴应用。他预计下一个重大拐点将来自基于推理的操作系统，认为这大约还需要两年时间，同时亦将6G赋能的系统视为另一物理AI用例。 2. 泛林集团（Lam Research）——评级：买入 • 需求能见度与客户互动：洁净室可用性仍是关键产能约束，新增产能预计在2027年底前上线。管理层围绕2027年需求及长期增长轨迹与客户保持密切沟通，并据此优化生产计划、协调供应链投资。 • 2027年WFE增长：泛林预计2027年WFE增长将由DRAM领跑，紧随其后的是先进制程代工/逻辑与NAND。虽然未量化整体WFE增速，但DRAM支出正缩小与先进制程代工/逻辑的差距。 • 3D架构驱动：环绕栅极（GAA）与背面供电是重大技术拐点，每增加10万片晶圆开工量可扩大其可服务可寻址市场（SAM）约10亿美元。先进封装与存储器日益3D化，驱动硅通孔（TSV）等工艺技术的额外需求，并创造进一步的设备含量增长机遇。 • 毛利率与定价：更丰富的差异化产品组合、更贴近客户的制造与研发能力以及更高的定价，正改善公司的价值主张。管理层预计这些因素将支持更强的价值捕获，并在未来数年将毛利率推升至接近55%左右的中段区间。 3. 希捷（Seagate）——评级：买入 • 定价趋势：持续强劲的需求趋势与存储价值的提升，继续支撑定价显著上涨。继上季度每艾字节价格同比上涨约11%后，管理层预计这一势头将贯穿2027财年。自动驾驶等应用及存储极具吸引力的总体拥有成本（TCO），被视为艾字节需求保持强劲的支撑。 • HAMR进展：热辅助磁记录（HAMR）出货量在本季度持续爬坡，按艾字节计算在2026年底前超越传统垂直磁记录（PMR）的轨道明确。Mozaic 4已获美国及亚洲客户认证，反馈积极。管理层预计几年内HAMR将占其总出货量的80%至90%，但PMR仍将在低容量硬盘中保留一席之地。 • 资本回报：管理层专注于继续偿还高收益债务，并计划下季度再回购一笔高收益票据。公司表示近期将考虑提高股息，但强调加速股票回购仍是向股东返还过剩资本的主要工具。 4. Credo——评级：买入 • 铜互连与光互连：尽管创新延长了铜互连的相关性，但公司过去两年的投资重点已日益转向光学。管理层预计铜在中短距离链路中仍将是首选（基于可靠性），而光连接将在更长距离获得份额，为Credo在微LED与激光架构领域创造显著增长机遇。 • FY27后增长逻辑：FY27之后的增长将由光产品组合（包括解决AI网络可靠性挑战的PIC与ZF光收发器）的放量驱动。现有客户中AEC的持续渗透、新云客户的部署扩大以及有源LED线缆（ALC）的初步贡献，共同构成FY28及以后的多重增长向量。 • 财务表现：Credo重申强劲的近期增长，预计第三财季营收环比增长约20%，第四财季环比增长约30%。管理层预计FY27毛利率与FY26保持一致，而营业费用在FY27预计同比增长约55%，之后将趋于更正常的营收/营业费用2:1比率。 5. Qnity——评级：买入 • 先进节点与成熟节点：先进节点销售加速（上季度增长20%），向3nm的迁移构成利好。管理层对成熟逻辑亦持建设性态度，预计半导体技术部门将在下半年及2027年持续实现环比增长。 • 互连解决方案：互连部门仍是关键增长驱动力，先进封装与AI PCB（约占该部门30%）持续强劲。管理层预计该部门在2026年第三季度环比增长中个位数。 • 利润率趋势：上季度因产品组合与投入成本压力导致毛利率略低于我们预期，但展望未来，Qnity预计利润率将稳步提升，互连解决方案（ICS）占比提高或带来上行空间，尽管投入成本与运营杠杆持续增加。长期毛利率目标指向50%区间。 6. EPAM——评级：中性 • 战略与宏观：由于客户对整体支出预算保持谨慎（尤其是传统业务领域及受油价、中东冲突影响的特定垂直行业），EPAM预计2026年剩余时间可自由支配支出将持续疲软。美国销售执行不力也是近期下调指引的原因之一。 • 生成式AI：公司AI原生服务产品持续获得市场认可（二季度销售额超1.6亿美元），预计2026年生成式AI收入至少达6亿美元。AI原生软件工程等领域表现强劲，但许多客户在以“预算中性”为目标推进代理自动化，这一动态被视为挑战。 • 财务展望：尽管近期营收面临不利因素，但定价与利用率的利好有望支撑下半年健康的毛利率趋势。管理层预计2027财年非GAAP营业利润率维持在15%至16%区间，并认为非T&M（时间与材料）业务的盈利性仍有改善空间。资本配置方面，公司未来将偏向股票回购而非并购。 三、 估值与风险摘要 • Qnity（买入）：12个月目标价175美元，基于32倍市盈率乘以5.50美元的正常化每股收益。主要下行风险：（1）所服务终端市场（DRAM、NAND、代工/逻辑等）晶圆开工量放缓；（2）惩罚性关税与出口限制加码；（3）PFAS诉讼引发的额外或有负债。 • 英伟达（买入）：12个月目标价300美元，基于30倍市盈率乘以10.00美元的正常化每股收益。主要下行风险：（1）AI基础设施支出放缓；（2）竞争加剧导致份额流失；（3）竞争加剧引发利润率侵蚀；（4）供应约束。 • 泛林集团（买入）：12个月目标价380美元，基于35倍市盈率乘以10.75美元的正常化每股收益。主要下行风险：（1）NAND供应商升级支出暂停；（2）美国政府出台更严厉的出口限制；（3）行业对光刻的需求（强度增加）相对于沉积/刻蚀应用发生显著转变。 • 希捷（买入）：12个月目标价960美元，基于24倍市盈率乘以40.00美元的正常化每股收益。主要下行风险：（1）在主要超大规模云厂商处认证HAMR遇到困难；（2）希捷或行业整体在供应端缺乏审慎。 • Credo（买入）：12个月目标价285美元，基于未来12个月（NTM）27倍市盈率乘以10.75美元的未来四季度每股收益预期。主要下行风险：（1）光解决方案采用速度快于预期，蚕食铜业务；（2）AEC领域竞争加剧；（3）客户集中度导致收入波动。 • EPAM（中性）：12个月目标价100美元，基于1年期预期收益乘以7倍。上行风险：（1）可自由支配IT支出早于预期复苏；（2）AI相关项目需求增加；（3）交易转化率强于预期。下行风险：（1）需求进一步放缓；（2）稀释性并购；（3）地缘政治紧张局势升级。#文字观点", "publish_time": "2026-09-12 11:28", "tags": ["文字观点"]}, "post:2026-09-12T11-26:df4dae00a845": {"id": "post:2026-09-12T11-26:df4dae00a845", "kind": "post", "title": "2026-09-12 11:26", "source_label": "帖子正文", "excerpt": "肯特催化更新：半导体业务加快落地，国产替代持续推进公司核心卡位产品四丁基氟化铵（TBAF），半导体应用包括先进封装的键合胶残留清洗、硅/SiO₂的选择性湿法蚀刻、蚀刻后残留物清洗等，公司公告募投项目变更年产1690吨四丁基氟化铵及其中间体项目，有望于明年全部落地，伴随海外HBM持续扩产以及国产HBM", "content": "肯特催化更新：半导体业务加快落地，国产替代持续推进公司核心卡位产品四丁基氟化铵（TBAF），半导体应用包括先进封装的键合胶残留清洗、硅/SiO₂的选择性湿法蚀刻、蚀刻后残留物清洗等，公司公告募投项目变更年产1690吨四丁基氟化铵及其中间体项目，有望于明年全部落地，伴随海外HBM持续扩产以及国产HBM产品突破，公司新产能落地有望带来较大的业绩增量。其他半导体产品，包括TMAH高浓高纯产品、光刻胶功能性添加剂（18-冠醚-6）、半导体清洗剂等。公司特色是核心原件的生产能力与工艺。非半导体产品的国产替代同样加速，包括季鏻盐产品中的大石化非光气法核心催化剂等产品，公司与国内头部化纤企业持续推进对三开（Sachem）产品的国产替代。公司未来业绩释放潜力可观，建议重点关注，细节欢迎交流。#文字观点", "publish_time": "2026-09-12 11:26", "tags": ["文字观点"]}, "post:2026-09-12T11-26:410788e166e7": {"id": "post:2026-09-12T11-26:410788e166e7", "kind": "post", "title": "2026-09-12 11:26", "source_label": "帖子正文", "excerpt": "【广发电子】继续推荐 英集芯 硅电容海外ASIC客户进展超预期，已测试通过。根据公司目前获得产能测算，公司27年硅电容收入有望达到5亿元。", "content": "【广发电子】继续推荐 英集芯 硅电容海外ASIC客户进展超预期，已测试通过。根据公司目前获得产能测算，公司27年硅电容收入有望达到5亿元。硅电容盈利能力很高。 26Q3开始，移动电源芯片迭代升级；26Q4开始硅电容开始贡献收入。27年业绩增长很高，硅电容弹性很大，估值很便宜，继续重点推荐！#文字观点", "publish_time": "2026-09-12 11:26", "tags": ["文字观点"]}, "post:2026-09-12T11-27:3866d70d2f35": {"id": "post:2026-09-12T11-27:3866d70d2f35", "kind": "post", "title": "2026-09-12 11:27", "source_label": "帖子正文", "excerpt": "【申万计算机】浪潮信息：发布定增预案，重视高景气赛道的业绩弹性！#定增预案预案拟定增不超过90亿元，向不超过35名特定对象发行，数量占当前总股本约6.5%（26H1控股股东浪潮集团持股32.12%）", "content": "【申万计算机】浪潮信息：发布定增预案，重视高景气赛道的业绩弹性！#定增预案预案拟定增不超过90亿元，向不超过35名特定对象发行，数量占当前总股本约6.5%（26H1控股股东浪潮集团持股32.12%）；重点投向#Agent规模化应用AI基础设施、#液冷原生绿色智算、#多智能体存算融合、#高密度算力装备智造与交付，及补充流动资金#重视产业趋势、26H1已经验证26H1归母净利29.5亿元，同比+269.6%；利润超预期主要来自超节点带来的利润弹性，Q2单季毛利率已经10%+。存货、合同负债、预付款都有明显增长，验证行业景气度。#AI算力简单公约数🌹 需求侧：仍由CSP主导，字节、阿里、腾讯持续投入，智谱等厂商追加AI基础设施投资趋势明确，算力需求维持高景气。 🌹 供给侧：芯片适配、高速互联、液冷和系统集成要求提升，供给格局进一步集中。芯片路线分散，头部服务器厂商越是确定性的“简单公约数”。#利润率弹性来自【超节点】🌹 传统8卡AI服务器净利率通常仅1%-2%；工业富联超节点服务器净利率可达到约5%。超节点从单机交付升级为整机柜系统交付，价值量和利润空间明显提升。 🌹 海外看，浪潮信息高端超节点服务器出货预期乐观；国内看，国产芯片2026年进入大规模超节点方案落地阶段，浪潮、华勤等前期预研参与者核心受益。#高成长的低估值2026H1归母净利已达29.5亿元，全年65亿元以上利润具备较强实现基础。目前估值低于26年PE 20x，切换27年有很大空间！#文字观点", "publish_time": "2026-09-12 11:27", "tags": ["定增预案", "重视产业趋势、26H1已经验证", "AI算力简单公约数", "利润率弹性来自【超节点】", "高成长的低估值", "文字观点"]}, "post:2026-09-12T11-28:083117f1dca5": {"id": "post:2026-09-12T11-28:083117f1dca5", "kind": "post", "title": "2026-09-12 11:28", "source_label": "帖子正文", "excerpt": "高盛——微软公司（MSFT.US）Communacopia+Technology 2026大会要点 微软CFO Amy Hood在Communacopia+Technology大会上传递了三大核心信息：第一，在算力持续供不应求的背景下，公司资本开支立场保持均衡——土地与电力的长期投资框架已就位，未来", "content": "高盛——微软公司（MSFT.US）Communacopia+Technology 2026大会要点 微软CFO Amy Hood在Communacopia+Technology大会上传递了三大核心信息：第一，在算力持续供不应求的背景下，公司资本开支立场保持均衡——土地与电力的长期投资框架已就位，未来一年可上线的容量规模已有清晰认知，当前重心在于加速新供应达到\"可创收\"状态。第二，随着企业向\"前沿生态系统\"迁移，微软详细阐述了其在分销体系与技术栈层面的护城河，使客户能够基于自身数据运行持续学习循环，从而从整体上扩展可触达市场（TAM）与知识产权创造。第三，向基于消费/成果计费的转型正在证明：交付更优成果能够带来TAM的扩张。 关键要点详述 1. 近期焦点：加速容量变现，从已部署资产中榨取更多Azure增长 在供应持续短缺的环境下，微软对资本开支的表述保持平衡：公司已建立土地与电力的长期投资框架，并对未来12个月内可上线的容量规模有充分认知。因此，管理层的核心关注点并非追加投资规模，而是新供应达到\"可创收\"状态的速度。公司重申过去一年\"从部署到上线\"（dock-to-live）的时间缩短了50%以上，并指出硬件、Azure基础设施及应用层面的效率提升正在扩大有效供应，且无需相应的资本密集度增加。鉴于未来12个月内可上线的基础设施容量（以吉瓦计）在很大程度上已固定，微软的重心在于加快已部署容量转化为收入的速度，从而从每一美元已投入资本中有效提取更多Azure增长。 2. AI通过基于成果的消耗模式扩展软件TAM 微软将AI描述为正在加速软件行业从按席位许可向按工作量、成果和交付生产力计价的模式转变。公司驳斥了\"AI仅仅重新分配现有软件预算\"的观点，主张AI实际上实现了全新的工作流、全新的业务流程以及此前因不经济或无法交付而根本不存在的全新收入机会。在这一框架下，AI不仅是效率工具，更是通过创造增量需求来扩展软件支出的机制。与此同时，微软强调企业采纳AI日益取决于衡量、治理和优化AI使用的能力——Agent 365正是作为控制平面，帮助客户跨模型和跨工作流监控消耗、管理成本并验证投资回报率（ROI），这反映出可观测性与支出管理对企业部署的重要性已不亚于模型性能本身。 3. 价格性能仍是微软芯片战略的首要目标 微软将其芯片战略描述为过去十余年支撑利润率改善的云计算路径的延伸：实现供应商多元化，在能够改善经济效益的领域发展自研（1P）能力，并围绕最优价格性能结果优化工作负载。公司强调了Cobalt CPU的持续扩张——预计今年将部署至25个数据中心，并对MAIA芯片的性能表达了信心。重要的是，微软明确其目标并非简单地以自研芯片替代第三方（3P）芯片。相反，1P芯片是在更广泛的多供应商生态系统中增加的一种工具，使微软能够将工作负载匹配至最高效的计算架构，同时提升灵活性、增强长期基础设施竞争力并改善基础设施投资回报。 估值与核心风险 • 评级与目标价： 买入评级，12个月目标价640美元，基于微软SNTM调整后净利润28倍市盈率（倍数维持不变）。当前股价491.65美元，隐含上行空间30.2%。 • 下行风险： 自研芯片（内部硅）爬坡周期长于预期，可能限制市场份额增长或毛利率扩张；超出预期的项目投资（如非Azure业务）；关键领导层变动；向定制软件更有意义的转向可能对其应用软件业务产生负面影响。#文字观点", "publish_time": "2026-09-12 11:28", "tags": ["文字观点"]}, "post:2026-09-12T11-26:dda3dca65268": {"id": "post:2026-09-12T11-26:dda3dca65268", "kind": "post", "title": "2026-09-12 11:26", "source_label": "帖子正文", "excerpt": "转：据科技媒体The Information报道，黑石预计将采购的谷歌张量处理单元（TPU）数量，将远高于今年5月宣布与谷歌成立合资公司时披露的规模。今年5月，黑石宣布与谷歌成立一家美国合资公司，提供数据中心容量、运营、网络以及谷歌Cloud TPU，以“算力即服务”的模式向客户提供TPU算力。", "content": "转：据科技媒体The Information报道，黑石预计将采购的谷歌张量处理单元（TPU）数量，将远高于今年5月宣布与谷歌成立合资公司时披露的规模。 今年5月，黑石宣布与谷歌成立一家美国合资公司，提供数据中心容量、运营、网络以及谷歌Cloud TPU，以“算力即服务”的模式向客户提供TPU算力。 根据黑石当时公告，公司将作出首期50亿美元股权投入，目标是在2027年上线500兆瓦的数据中心容量，并计划在未来大幅扩张。 路透社当时报道称，该项目在包括杠杆融资在内的情况下，整体投资规模有望达到250亿美元。谷歌则通过提供自研TPU，将其AI芯片进一步推向谷歌云之外的客户。#文字观点", "publish_time": "2026-09-12 11:26", "tags": ["文字观点"]}, "attachment:files/AI硬件资本开支浪潮-迭代变局与产业机遇研判20260911.pdf": {"id": "attachment:files/AI硬件资本开支浪潮-迭代变局与产业机遇研判20260911.pdf", "kind": "attachment", "title": "AI硬件资本开支浪潮-迭代变局与产业机遇研判20260911", "source_label": "AI硬件资本开支浪潮", "excerpt": "微信：WUXL3408 微信：WUXL3408 微信：WUXL3408 公众号：小牛研报纪要 微信： WUXL3408 微信：WUXL3408 微信：WUXL3408 微信：WUXL3408", "content": "知识星球：小牛研报纪要 微信：WUXL3408 知识星球：小牛研报纪要 微信：WUXL3408 知识星球：小牛研报纪要 微信：WUXL3408 公众号：小牛研报纪要 微信： WUXL3408 知识星球：小牛研报纪要 微信：WUXL3408 知识星球：小牛研报纪要 微信：WUXL3408 知识星球：小牛研报纪要 微信：WUXL3408", "status": "extracted"}, "post:2026-09-12T16-24:3872e9752542": {"id": "post:2026-09-12T16-24:3872e9752542", "kind": "post", "title": "2026-09-12 16:24", "source_label": "帖子正文", "excerpt": "机构小秘圈 国际关系专家：全球地缘博弈与中美关系展望会议要点 1. 中美会晤相关情况 会晤基本背景：计划于2026年9月下旬在美国举行，目前官方层面未接到任何推迟通知，市场相关推迟的小作文主要源于美方对接工作进展缓慢，美方牵头人贝森特事务繁杂，精力未大量放在本次会晤准备上，对中方提出的议题、诉求、人", "content": "机构小秘圈 国际关系专家：全球地缘博弈与中美关系展望会议要点 1. 中美会晤相关情况 会晤基本背景：计划于2026年9月下旬在美国举行，目前官方层面未接到任何推迟通知，市场相关推迟的小作文主要源于美方对接工作进展缓慢，美方牵头人贝森特事务繁杂，精力未大量放在本次会晤准备上，对中方提出的议题、诉求、人员对接等反馈迟缓，曾要求缩减中方随团企业家规模 会晤核心目标：以沟通交流的方式锁住中美关系风险，避免极端政 策快速落地 2. 关税相关磋商 301关税现状：目前美国对华301关税分为两类，已落地的强迫劳动相关关税12.5%，以及即将于2026年9-10月落地的产能过剩相关关税7.5%，合计20%，覆盖中国对美出口约三分之二的产品，该加征幅度已得到双方默认，不再是本次谈判核心变量 232关税磋商：为本次谈判重点，232关税覆盖所有非美经济体，目前美国对盟友欧盟、日韩的部分行业（汽车、药品、芯片等）给予10%-15%的优待关税，未谈判的行业将面临25%、50%甚至100%的关税水平。中方将通过采购方式争取特定行业的优待关税，优先谈判出口金额大的行业，目标是争取关税低于原有的25%及以上水平，其中钢铝行业谈判可能性极低，将优先尝试芯片、药品、机器人、工业机械等行业 关税K型分化趋势： 关税上行类：战略类、需推动本土制造业回流的行业面临关税上升风险，除232关税外，成熟芯片及其衍生品在2024年12月已启动301调查，2025年12月公布结果，2027年6月23号起可能被加征额外25%的行业特定关税，该事项未纳入本次谈判范围 关税下行类：衣食住行相关的鞋帽、美妆、纺织服装、部分中低端消费电子产品等非敏感品关税将下降，相关清单已基本制定完成，预计在元首会晤时公布，涉及金额300亿美元，来自2019年1200亿美元的list 4A清单，后续双方将通过贸易理事会机制商讨更多关税下调品类 暂停政 策延续磋商：2025年10月底双方暂停的一系列政 策将于近期到期，本次将磋商延续暂停： 美国商务部实体清单50%控股子公司自动纳入政 策，美方倾向暂停1年（2026年11月10日至2027年11月10日），中方希望直接暂停到特朗普任期结束 中方的稀土管制61号文、62号文、58号文作为对等措施也将相应推迟1年执行，同时海事301关税也将推迟1年执行 3. AI治理对话相关磋商 美方发起对话的核心目标：建立AI产业治理规则，本质是维护美国AI产业高估值与垄断利润，制约中国开源、低成本的AI模型对美国闭源高收费模型的冲击，并非推动中美AI产业合作 磋商预期：中方核心诉求是美国放开先进芯片出口限制，否则难以达成实质协议，预计仅可能形成象征性框架性成果，参考2023年11月拜登时期同类对话最终无实质落地，本次不宜有过高预期 4. 中美科技博弈趋势及相关产业风险 美国科技博弈核心逻辑：一方面限制先进技术对华出口，另一方面减少对中国关键领域产品的进口依赖，推动本土供应链替代 先进芯片管制新动态： 美国国会提议对销往市场的先进芯片加装定位装置，方便追踪芯片流向，打击走私，相关立法预计将于2026年年底尝试搭国防授权法案的便车推进，目前英伟达正在游说反对，暂未落地 美国计划立法管制海外算力租赁业务，要求在东南亚等地区建设的算力租赁中心，向中国、俄罗斯、伊朗等国提供AI训练服务时需向美国商务部报备，同样计划搭2026年国防授权法案推进，暂未落地 美国进口端限制政 策动态： 核心逻辑：美国以供应链安全为由，对中国依赖度超过60%-70%的关键环节产品，推动本土供应链替代，待本土产能具备一定替代能力后逐步减少进口依赖，该趋势是长期规划，并非仅为谈判筹码 FCC现有政 策：已出台消费级路由器、无人机禁令，限制境外新款产品进入美国市场，同时设置豁免通道，目前已获批的豁免企业以美国、欧洲、中国台湾地区企业为主，尚无中国内地企业获批，豁免资格与企业股权归属、在美投资规模、沟通情况挂钩；产品层面玩具无人机已获得无差别豁免，可正常进入美国市场 大容量电力设备禁令：2026年8月26日特朗普发布14420号行政令，覆盖设备增量、存量，目前等待能源部出台细则，预计初期仅覆盖狭义范围产品，后续随美国本土产能提升逐步扩大覆盖范围，该政 策大概率会落地，中美谈判仅可能推迟落地节奏，难以完全取消 光模块管制预期：预计中美元首会晤前不会发布禁令，2027年上半年可能先发布草案征求意见，最终落地要到2027年年中或下半年，且会设置豁免通道，已获得授权的旧设备可正常销售，有充足缓冲时间 政 策覆盖标准倾向：目前美国未明确是按生产商还是按产地限制，但更倾向于按生产商进行限制，仅美国本土生产的产品可能享受产地优待，仅转移到东南亚、欧洲等地区建厂无法规避限制 中方反制措施：中方将对美国在华服务企业、打印复印设备等优势产品开展相关调查，作为对等反制，若谈判不顺相关政 策将加快落地 未来管制方向：美国正在梳理各产业链对华依赖度，对依赖度超过70%-75%且龙头企业为中国内地股权的产品，后续可能出台更多限制政 策 稀土管制的有效性：当前中国稀土管制政 策为全球一刀切，对美国、欧盟均适用，是核心反制牌，目前欧美均高度关注该政 策的落地节奏，有效性依然较强 5. 美国中期选举及对中美关系的影响 选举基本情况：2026年11月举行，众议院435个席位全部改选，参议院100个席位中35个改选，其中22个为共和党现任席位、13个为民主党现任席位 选举结果预期：市场共识为共和党大概率失去众议院控制权，仅需要在改选的22个参议院席位中保住18个即可继续掌控参议院，该结果符合美国近20年总统中期选举普遍失去众议院的历史规律 选举后中美关系走势： 基准预期：60%的中方受访者认为中美停火状态可维持到特朗普任期结束，不会出现完全掀桌子的情况，关系恶化斜率较为平缓，不会急转直下 潜在风险：特朗普对共和党的影响力有所下降，加上民主党若掌控参议院，对华强硬立法的推进速度将加快，先进芯片加装定位、海外算力租赁管制等法案即使2026年年底未通过，2027年新一届国会（120届）也会加速推进；同时美国对台军售力度持续加大，特朗普第二任期对台军售金额已超过拜登四年总和的50%，是中美关系的负面变量 6. 中欧贸易关系相关情况 欧盟核心诉求：2025年欧盟对华贸易逆差达3600亿欧元，核心诉求是中方对电动汽车、储能、化工等出口激增的行业主动设置出口配额，为欧洲本土产业留出发展空间；同时要求中方放松对欧盟的稀土管制 关税相关进展： 新三样中电动汽车、光伏已加征关税，后续储能、插混电动车是重点关注品类，若9月密集磋商中方未采取让欧盟满意的措施，欧盟将通过双反、WTO保障措施对特定行业开展调查，调查到关税落地需要9个月到1年时间，2027年下半年是行业关税密集落地的风险窗口 中方曾提出以投资换贸易再平衡的方案，但欧盟内部对该方案分歧较大，旨在吸引外资的工业加速器法案迟迟无法通过，仅德国对中国投资持较为欢迎的态度，法国等国反对声音较大 中欧投资协定预期：恢复可能性极低，欧盟目前仅希望与中国维持底线层面的合作，无意愿恢复谈判 新能源电池相关风险：储能属于对欧出口剧增行业，符合WTO保障措施的启动条件，存在被加征关税的风险；但宁德时代等在欧洲有本地化建厂布局的企业，受到的影响相对较小 7. 其他相关投资线索 出口退税政 策趋势：出口退税将逐步退出，具体节奏由财政部门制定，方向是优先减少非必要的出口端补贴，将财政资源转向内需领域 出入境新规影响：2026年9月10日施行的出入境新规核心是加强高技术出口管制，限制高技术含量的技术外流，同时打击涉及外资背景的中介倒卖信息的间谍行为，高端制造业企业出海的技术审批难度提升，与欧美吸引中高端制造业投资的需求形成矛盾，未来需关注国内市场对高技术产业的需求培育能力---xz#文字观点", "publish_time": "2026-09-12 16:24", "tags": ["文字观点"]}, "post:2026-09-12T11-27:1a51269729b2": {"id": "post:2026-09-12T11-27:1a51269729b2", "kind": "post", "title": "2026-09-12 11:27", "source_label": "帖子正文", "excerpt": "🎈【宁德时代】首次回购A股股份彰显长期信心，把握底部配置区间，强推！#事件：宁德时代公告，公司于2026年9月11日首次实施A股股份回购，通过集中竞价交易方式回购604293股，占公司当前总股本的0.0131%，最高成交价331.61元/股，最低成交价330.15元/股，成交总金额约2亿元（不含交易", "content": "🎈【宁德时代】首次回购A股股份彰显长期信心，把握底部配置区间，强推！#事件：宁德时代公告，公司于2026年9月11日首次实施A股股份回购，通过集中竞价交易方式回购604293股，占公司当前总股本的0.0131%，最高成交价331.61元/股，最低成交价330.15元/股，成交总金额约2亿元（不含交易费用），回购股份用于注销并减少公司注册资本。 #回购彰显管理层长期信心。此前公司推出大额回购方案，计划以自有/自筹资金回购A股，资金区间200亿-400亿元，回购价格上限573元/股，回购股份全部注销减资，意在提升股东回报、增厚每股收益。今日公司首次回购A股股份，彰显管理层长期信心。 #把握底部配置区间。近期市场对于公司的担心主要在于竞争格局、9-10月排产下修以及明年需求。我们认为：1）车企自研是伪命题，高端新车型的发布C依旧是一供首选，格局无需担忧；2）9-10月排产下修主要因为核心物料短缺以及9.1号消费税下8月部分动力抢装导致的库存小幅波动，侧面印证需求强现实，景气度无需担忧；3）对于明年需求，我们测算动力增速15%（国内不到10%，海外+商用车20%+），储能增速30%+，合计增速20%+，宁德内部排产目标27年1.5T以上，同比增速30%+，因此对需求可以更乐观。#文字观点", "publish_time": "2026-09-12 11:27", "tags": ["事件", "文字观点"]}, "post:2026-09-12T11-29:ef108dcb0336": {"id": "post:2026-09-12T11-29:ef108dcb0336", "kind": "post", "title": "2026-09-12 11:29", "source_label": "帖子正文", "excerpt": "碳酸锂：年线的拷问 碳酸锂主力期货价格已跌破年线，下午虽有反弹但空头减仓为主，多头力量偏弱。我们上周将碳酸锂的观点调整为悲观，核心是低库存+高去库逻辑走坏，目前仍然维持悲观的观点，商品维持逢高空为主的操作思路。", "content": "碳酸锂：年线的拷问 碳酸锂主力期货价格已跌破年线，下午虽有反弹但空头减仓为主，多头力量偏弱。我们上周将碳酸锂的观点调整为悲观，核心是低库存+高去库逻辑走坏，目前仍然维持悲观的观点，商品维持逢高空为主的操作思路。由于宏观环境而非基本面变化导致跌穿关键价格，后续需验证跌穿是否有效。如果有效，我们不排除价格大幅下跌更快到来，当前下行风险仍高于上行风险。 今日负面因素主要来自：1）有色商品的强烈负beta，宏观风险传导导致普跌；2）传：海博思创砍单，大储和集成方面的，9月排产减半，全年下修30%；3）A股跌幅较大。 提示：去库的环境下，不宜过分看空价格，提示低价追空风险。#文字观点", "publish_time": "2026-09-12 11:29", "tags": ["文字观点"]}, "post:2026-09-12T16-11:cb0080c61cee": {"id": "post:2026-09-12T16-11:cb0080c61cee", "kind": "post", "title": "2026-09-12 16:11", "source_label": "帖子正文", "excerpt": "每在 AI 基础设施上支出的 100 美元都花到哪里去了？50% | 50 美元 — 芯片 为 AI 提供动力的芯片和内存。", "content": "每在 AI 基础设施上支出的 100 美元都花到哪里去了？ 50% | 50 美元 — 芯片 为 AI 提供动力的芯片和内存。 20% | 20 美元 — 电力 生产并输送人工智能数据中心所需的电力。 15% | 15 美元 — 网络连接 在 AI 芯片和服务器之间传输数据。 7.5% | $7.50 — 散热 散热并确保 AI 服务器持续运行。 7.5% | $7.50 — 建筑施工 建造数据中心并安装其中的系统。", "publish_time": "2026-09-12 16:11", "tags": []}, "post:2026-09-12T11-26:beb2bab8604f": {"id": "post:2026-09-12T11-26:beb2bab8604f", "kind": "post", "title": "2026-09-12 11:26", "source_label": "帖子正文", "excerpt": "浙商机械 邱世梁 【罗博特科】 ——#9月10日举行港股聆讯港股渐近，后续期待CPO、NPO、OCS多点共振#事件：2026年9月10日，公司举行港股上市聆讯。#核心逻辑：公司依托高精度光子学对准技术底座，兼具稀缺性与延展性，始终卡位最前沿的光互联方案。", "content": "浙商机械 邱世梁 【罗博特科】 ——#9月10日举行港股聆讯港股渐近，后续期待CPO、NPO、OCS多点共振#事件：2026年9月10日，公司举行港股上市聆讯。#核心逻辑：公司依托高精度光子学对准技术底座，兼具稀缺性与延展性，始终卡位最前沿的光互联方案。#边际变化：此次港股募资推进，恰逢CPO/NPO/OCS等大规模放量前夕，有望巩固公司先发优势。#后续有何催化？一、CPO先发优势有望强化 据公司公告，在CPO测试环节，公司在Insertion 2和Insertion 3#占据了特殊的市场地位，是CPO商业化在测试设备端的#核心支撑方。 Insertion 4环节（模组级）设备8月末已在核心客户NPI进程。 CPO放量将至：据公司，#客户订单和交货时间压力持续加强、CPO产业化全面加速推进。二、NPO、OCS有望超预期 本次光博会，#NPO、OCS等光学方案也受到了较大重视。而公司在26年中报已给出积极预期： 1、首次在定期财报中提及NPO； 2、明确表达OCS方面，“预计仍存在较多新增产线需求”。 ❗️风险提示：硅光、CPO/OCS等渗透率不及预期等浙商机械 邱世梁/陈红/陈俊韬#文字观点", "publish_time": "2026-09-12 11:26", "tags": ["9月10日举行港股聆讯", "事件", "核心逻辑", "边际变化", "后续有何催化", "文字观点"]}, "post:2026-09-12T11-29:dd67ccf1b087": {"id": "post:2026-09-12T11-29:dd67ccf1b087", "kind": "post", "title": "2026-09-12 11:29", "source_label": "帖子正文", "excerpt": "【广发通信】后续光互连板块重要催化及利好方向 🪶光博会结束，我们判断后续光互连板块将在大光带领下整体板块走强，具体原因： 1️⃣业绩。9月中旬开始，市场将开始聚焦三季度业绩。", "content": "【广发通信】后续光互连板块重要催化及利好方向 🪶光博会结束，我们判断后续光互连板块将在大光带领下整体板块走强，具体原因： 1️⃣业绩。9月中旬开始，市场将开始聚焦三季度业绩。Q3大光普遍环比增长加速，业绩增速和确定性更强；部分小光开始兑现业绩，验证景气度 2️⃣叙事。10月中旬美国OCP大会，CSP主导，硬件逐步转向ASIC/NPO叙事，利好大光和受益NPO的小光；11月初CSP季报，AI云yoy有望继续提升，云增速将逐步代替ARR成为衡量AI需求更重要指标 3️⃣指引。10月中旬OCP大会前后，光互连2028年大颗粒度需求逐渐明确，板块需求有望再次上修，大光引领 🪶同时需要观察的外围因素包括美国宏观变化、地缘政治因素等 风险提示：产业发展不及预期#文字观点", "publish_time": "2026-09-12 11:29", "tags": ["文字观点"]}, "post:2026-09-12T16-10:bbc7fb4eeac9": {"id": "post:2026-09-12T16-10:bbc7fb4eeac9", "kind": "post", "title": "2026-09-12 16:10", "source_label": "帖子正文", "excerpt": "【申万家电&轻工&汽车】两轮车8月数据点评8月行业整体销售仍承压。根据奥维云网数据，2026年8月，两轮车行业产量742万台，同比-6%", "content": "【申万家电&轻工&汽车】两轮车8月数据点评8月行业整体销售仍承压。根据奥维云网数据，2026年8月，两轮车行业产量742万台，同比-6%；销量696万台，同比-10%；内销量673万台，同比-8%；外销量22万台，同比-49%。8月面临去年同期新国标执行前的高基数，叠加8月雨水天气较多，行业整体增速仍有所下滑，8月降幅基本延续Q2趋势。传统两轮车品牌销售均承压，#九号、小牛、极核等持续逆势增长。雅迪、爱玛等品牌销售以电自为主，受新国标影响较大，8月内销量分别同比-13%、-14%，环比7月有所改善。#九号、小牛、极核等品牌凭借智能化、电动化方面的优势，以及电摩为主的产品结构，逆势实现增长，#8月内销量分别同比+23%、+19%、+2%。#文字观点", "publish_time": "2026-09-12 16:10", "tags": ["文字观点"]}, "post:2026-09-12T16-24:99502aafbc8d": {"id": "post:2026-09-12T16-24:99502aafbc8d", "kind": "post", "title": "2026-09-12 16:24", "source_label": "帖子正文", "excerpt": "机构小秘圈 解读一下，昨晚规则针对此前禁令的漏洞进行了精准修补： 1. 填补“组件规避”漏洞（核心漏洞）：原禁令局限：2022年的禁令主要限制“覆盖清单”上实体（如华为、中兴等）直接生产的新设备获得FCC授权，但未能限制第三方通过采购被禁实体的“逻辑硬件组件”自行组装整机来规避禁令。修补措施：新规将", "content": "机构小秘圈 解读一下，昨晚规则针对此前禁令的漏洞进行了精准修补： 1. 填补“组件规避”漏洞（核心漏洞）：原禁令局限：2022年的禁令主要限制“覆盖清单”上实体（如华为、中兴等）直接生产的新设备获得FCC授权，但未能限制第三方通过采购被禁实体的“逻辑硬件组件”自行组装整机来规避禁令。修补措施：新规将监 管范围从“整机”延伸至“关键硬件组件”，明确禁止授权包含“覆盖清单”实体生产的“逻辑承载硬件组件”的设备，堵住了“仅采购被禁实体组件组装整机”的绕道漏洞。 2. 填补“旧设备与存量设备”漏洞：原禁令局限：2022年禁令主要限制新设备，对2022年前已获FCC授权但后续被列入“覆盖清单”的旧设备，缺乏明确的追溯和禁售规定。修补措施：新规明确对2022年前获证、但在2024年底前被列入“覆盖清单”的设备，受限实体依旧维持华为、中兴、海能达等既有清单，禁止继续进口和销售，堵住了旧设备“带病流通”的漏洞。 3. 填补“设备修改与许可变更”漏洞：原禁令局限：原规则对已授权设备的修改（如更换组件、变更生产者）缺乏严格限制，部分修改可通过简易的“许可变更”程序绕过禁令。修补措施：新规明确，若设备修改后涉及“覆盖清单”实体或会落入禁令范围，必须走完整的重新认证程序，堵住了“先拿证、后换受限硬件”的漏洞。 4. 综上，FCC此次补漏洞是对2022年覆盖清单禁令的全面升级，将监 管从整机向上游组件和存量设备进行了穿透式封堵。同时最终规则明确豁免纯机械及无源类部件，并未采纳激进的全面泛化限制，对光通信产业链而言，上游以及配套的光纤光缆、FAU、MPO连接器、陶瓷套管等不具备逻辑运算处理能力的无源环节，获得悲观预期与政 策不确定性折价的修复。 5. 虽然暂时并未泛化扩大至整个通信硬件以及光模块供应链，但从监 管趋势方向来看，不意味着此前外媒报道的拟做计划以及对应带来的市场对光模块的监 管担忧就是终点或者能翻篇了，靴子仍未落地，其实美债问题也就是这么来的，我发债你们不接，却要赚我发债的钱，而且目前仍是会晤前的各自造牌筹码博弈阶段，毕竟前面FCC制裁逆变器的时候，也没给阳光电源这样的龙头打招呼，机构仍会觉得这次没有不代表以后没有，但短期获得了喘息机会，总之未来一年甚至两年的预期在上个高点提前打满，但再往后面能继续拔估值的产业空间主要源于下一代新技术和美国市场，仍未完全消除或是消化政 策的不确定性，还需要看看元首会晤后的情况。---xz#文字观点", "publish_time": "2026-09-12 16:24", "tags": ["文字观点"]}, "post:2026-09-12T16-09:7262893c1756": {"id": "post:2026-09-12T16-09:7262893c1756", "kind": "post", "title": "2026-09-12 16:09", "source_label": "帖子正文", "excerpt": "若 9 月沃什不能兑现其鹰派承诺，美联储公信力将明显受挫、长端利率将更难以控制 8 月核心 CPI 通胀环比超预期升温，数据已为联储 9 月加息 “扫除障碍”，若 9 月沃什不能兑现其鹰派承诺，联储公信力将明显受挫、长端利率将更难以控制。8 月 CPI 环比增速回升 0.32pp 至 0.40%，同", "content": "若 9 月沃什不能兑现其鹰派承诺，美联储公信力将明显受挫、长端利率将更难以控制 8 月核心 CPI 通胀环比超预期升温，数据已为联储 9 月加息 “扫除障碍”，若 9 月沃什不能兑现其鹰派承诺，联储公信力将明显受挫、长端利率将更难以控制。 8 月 CPI 环比增速回升 0.32pp 至 0.40%，同比回升 0.1pp 至 3.4%，均符合预期（彭博一致预期，下同）；核心 CPI 环比回升 0.07pp 至 0.29%，高于预期的 0.2%，核心 CPI 同比回落 0.1pp 至 2.4%，符合预期。 8 月核心 CPI 环比超预期，通胀放缓进展反复，市场加息预期升温，但黄金、美股上涨，长端美债收益率下行，市场似有 “利空出尽” 之感。#文字观点", "publish_time": "2026-09-12 16:09", "tags": ["文字观点"]}, 行业主动设置出口配额，新三样中电动汽车、光伏已加征关税，后续储能、插混电动车是重点关注品类；美国对台军售为负面变量。FCC规则修补将监管范围从整机延伸至关键硬件组件，有观点认为名单没有光模块不代表禁令落地预期反转。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cp>\u003cstrong>1. AI算力/大模型\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：AI算力需求、资本开支与云厂商投入。\u003c/li>\n\u003cli>今天强化的逻辑：需求仍由CSP主导，字节、阿里、腾讯持续投入，智谱等厂商追加AI基础设施投资趋势明确；微软CFO称算力持续供不应求，资本开支立场保持均衡，土地与电力长期投资框架已就位，未来一年可上线容量已有清晰认知；Cobalt CPU预计今年部署至25个数据中心，并对MAIA芯片性能表达信心；企业采纳AI日益取决于衡量、治理和优化AI使用的能力。\u003c/li>\n\u003cli>今天出现的催化/验证：浪潮信息定增不超90亿元；黑石预计采购谷歌TPU数量远高于5月宣布合资公司时披露规模；AI基础设施支出100美元中50美元用于芯片和内存；有观点称OpenAI因GPT6需求过热停止新增Pro 20x订阅。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>2. 半导体/先进封装\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：先进封装、上游供应约束与设备材料国产替代。\u003c/li>\n\u003cli>今天强化的逻辑：AI基础设施支出乐观；黄仁勋承认先进封装、晶圆及存储器等领域存在广泛上游供应约束；泛林预计2027年WFE增长由DRAM领跑，随后是先进制程代工/逻辑与NAND；互连部门仍是关键增长驱动力，先进封装与AI PCB（约占该部门30%）持续强劲，长期毛利率目标指向50%区间。\u003c/li>\n\u003cli>今天出现的催化/验证：肯特催化TBAF募投项目变更，年产1690吨TBAF及中间体项目有望明年全部落地；英集芯硅电容海外ASIC客户进展超预期，已测试通过，按目前产能测算27年硅电容收入有望达5亿元；铠侠准备赴美ADS上市，NAND被重新定义为AI基础设施资产，今年以来股价大涨约456%。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>3. 光通信/CPO\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：光互连、CPO/NPO/OCS。\u003c/li>\n\u003cli>今天强化的逻辑：光博会结束后，有观点判断后续光互连板块将在大光带领下整体板块走强，9月中旬开始市场将聚焦三季度业绩；罗博特科依托高精度光子学对准技术底座，卡位前沿光互联方案，明确表达OCS“预计仍存在较多新增产线需求”，港股募资推进恰逢CPO/NPO/OCS大规模放量前夕；公司全面转向NPO/CPO/OCS领域，双极隔离器、硅透镜阵列、FAU、微透镜阵列逐步量产，27年将显著贡献增量利润弹性。风险提示为硅光、CPO/OCS等渗透率不及预期。\u003c/li>\n\u003cli>今天出现的催化/验证：罗博特科2026年9月10日举行港股上市聆讯；东田微明确表示大部分高速光模块光学组件订单已排产到2027年底交付，订单供不应求。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>4. 新能源/汽车与锂电\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：新能源车、储能、碳酸锂。\u003c/li>\n\u003cli>今天强化的逻辑：有观点测算明年动力增速15%（国内不到10%，海外+商用车20%+），储能增速30%+，合计增速20%+，宁德内部排产目标27年1.5T以上，同比增速30%+，对需求可以更乐观；两轮车8月行业整体销售仍承压，产量742万台，同比-6%。\u003c/li>\n\u003cli>今天出现的催化/验证：宁德时代9月11日首次回购A股约2亿元，用于注销并减少注册资本；碳酸锂主力期货跌破年线，下午反弹但空头减仓为主，多头力量偏弱，观点维持悲观、逢高空；中欧贸易方面，新三样中电动汽车、光伏已加征关税，后续储能、插混电动车是重点关注品类。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>5. 宏观/策略与地缘\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：全球地缘、中美关系、通胀与利率。\u003c/li>\n\u003cli>今天强化的逻辑：中美会晤计划2026年9月下旬在美国举行，目前官方层面未接到推迟通知，推迟小作文主要源于美方对接工作进展缓慢；欧盟2025年对华贸易逆差达3600亿欧元，核心诉求是中方对电动汽车、储能、化工等出口激增行业主动设置出口配额；美国对台军售力度持续加大，特朗普第二任期对台军售金额已超过拜登四年总和的50%，是中美关系负面变量。\u003c/li>\n\u003cli>今天出现的催化/验证：8月CPI环比+0.40%，同比+3.4%，均符合预期；核心CPI环比+0.29%，显著高于+0.2%一致预期；能源环比+2.10%（汽油+4.24%）贡献约0.13个百分点，占整体通胀环比涨幅三分之一；有观点称若9月沃什不能兑现鹰派承诺，美联储公信力将受挫、长端利率将更难控制。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>6. 机器人/物理AI\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>主线：机器人、物理AI。\u003c/li>\n\u003cli>今天强化的逻辑：九号公司短交通+机器人业务并行，电动两轮车通过智能化构建差异化竞争壁垒，门店网络仍具备较大扩张渗透空间，国内份额向上，出海战略正在搭建，远期有望享受东南亚电摩红利；机器人渗透率向上，九号是全球无边界割草机器人的技术先行者，仍将继续放量；风语筑物理AI打开成长空间，训练基础设施稀缺性凸显。\u003c/li>\n\u003cli>今天出现的催化/验证：九号公司拟以自有资金不超过2000万元投资上海松应科技；7月以来持续提示风语筑物理AI与化债推进。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>浪潮信息发布定增预案，拟定增不超过90亿元，发行数量占当前总股本约6.5%，重点投向Agent规模化应用AI基础设施、液冷原生绿色智算、多智能体存算融合、高密度算力装备智造与交付及补充流动资金。\u003c/li>\n\u003cli>宁德时代2026年9月11日首次实施A股回购，回购604,293股，占总股本0.0131%，最高成交价331.61元/股，最低330.15元/股，成交总金额约2亿元，用于注销并减少注册资本。\u003c/li>\n\u003cli>罗博特科2026年9月10日举行港股上市聆讯；公司明确表达OCS方面“预计仍存在较多新增产线需求”，并推进NPO/CPO/OCS领域量产，27年将贡献增量利润弹性。\u003c/li>\n\u003cli>肯特催化公告募投项目变更年产1690吨四丁基氟化铵及其中间体项目，有望明年全部落地。\u003c/li>\n\u003cli>英集芯硅电容海外ASIC客户进展超预期，已测试通过，按目前产能测算27年硅电容收入有望达5亿元；26Q3开始移动电源芯片迭代升级。\u003c/li>\n\u003cli>东田微大部分高速光模块光学组件订单已排产到2027年底交付，订单供不应求。\u003c/li>\n\u003cli>微软CFO在Communacopia+Technology 2026大会传递三大核心信息：算力持续供不应求，资本开支立场保持均衡，土地与电力长期投资框架已就位，未来一年可上线容量已有清晰认知；Cobalt CPU预计今年部署至25个数据中心，对MAIA芯片性能表达信心；企业采纳AI日益取决于衡量、治理和优化AI使用的能力。\u003c/li>\n\u003cli>黑石预计采购谷歌TPU数量远高于今年5月宣布与谷歌成立合资公司时披露规模。\u003c/li>\n\u003cli>铠侠准备赴美ADS上市，今年以来股价大涨约456%，NAND被重新定义为AI基础设施资产。\u003c/li>\n\u003cli>华锡有色收到间接控股股东转发的广西国资委通知，正在与中国五矿筹划重大合作事项，可能导致公司控制权变更。\u003c/li>\n\u003cli>新宙邦氟化液进入放量新阶段，3M库存见底开启新一轮采购周期；25年年底3M完全退出PFAS制造，包含4000吨全氟胺（冷却）和6000吨氢氟醚（清洗），冷却液市占率80%，清洗液市占率70%；清洗液基本完成国产替代，冷却液验证周期长、壁垒更高。\u003c/li>\n\u003cli>海信视像8月整体两位数以上增长，内外销均是量减价两位数增；7月同样量减价两位数增，整体高单增长。\u003c/li>\n\u003cli>三一欧洲新能源重卡方面，SE636土耳其KD工厂规划单车产值约20万美元，636kWh车型终端售价36.6万美元（约245万元人民币）。\u003c/li>\n\u003cli>两轮车8月行业整体销售承压，产量742万台，同比-6%。\u003c/li>\n\u003cli>碳酸锂主力期货跌破年线，下午虽有反弹但空头减仓为主，多头力量偏弱，观点维持悲观、商品逢高空。\u003c/li>\n\u003cli>8月CPI环比+0.40%，同比+3.4%，均符合预期；核心CPI环比+0.29%，显著高于+0.2%一致预期；能源环比+2.10%（汽油+4.24%）贡献约0.13个百分点，占整体通胀环比涨幅三分之一。\u003c/li>\n\u003cli>中美会晤计划于2026年9月下旬在美国举行，官方层面未接到推迟通知；欧盟2025年对华贸易逆差达3600亿欧元，核心诉求是中方对电动汽车、储能、化工等出口激增行业主动设置出口配额；美国对台军售金额已超过拜登四年总和的50%。\u003c/li>\n\u003cli>FCC规则修补填补“组件规避”漏洞，监管范围从整机延伸至关键硬件组件，明确禁止授权包含被禁实体关键硬件组件的设备；有观点认为名单没有光模块不代表禁令落地预期反转。\u003c/li>\n\u003cli>阿联酋在遭到伊朗袭击之后调整其人工智能数据中心规划，正在重新调整其5吉瓦人工智能数据中心项目方案。\u003c/li>\n\u003cli>中国从9月12日起把汽油、柴油零售价格每吨分别提高260元和250元，这是伊朗战争爆发以来第三次限制成品油零售价格上涨幅度。\u003c/li>\n\u003cli>俄罗斯官员称，不排除未来俄美两国会就两国元首在中国举行会晤一事达成一致，但目前尚无任何最终约定。\u003c/li>\n\u003cli>妙可蓝多公告修订2025年股权激励及员工持股计划，净利润考核目标由累计值调整，原因是对并购基金出资全额确认约1.29亿元公允价值变动损失。\u003c/li>\n\u003cli>有观点称键凯科技为被错杀的高增长医药上游核心，mRNA绕不开的“专利水渠”，二季报业绩非常靓丽。\u003c/li>\n\u003cli>有观点继续看好行云科技，逻辑包括传统算租+国企轻资产+低端卡外租，maas；关注涨价预期+新订单预期+消保解除，按27年保守业绩测算13x PE，长期看千亿市值。\u003c/li>\n\u003cli>农产品方面，2022-2026年为全球农产品大下行周期，当前各农产品价格相对上一轮农产品危机前的比值已跌破1:1，俄乌战争及上一轮拉尼娜天气带来的全部价格涨幅已完全回吐；过去几年全球天气整体正常，无大规模天气灾害。\u003c/li>\n\u003cli>储能行业更新显示国内和海外需求端仍偏积极，短期股价波动主要受中欧贸易争端和各类传言影响；市场出现涉及某国内大储企业的相关传言，据反馈相关情况并不存在。另有传言称海博思创砍单，大储和集成方面9月排产减半、全年下修30%。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>中美会晤9月下旬在美国举行的进展，包括是否推迟、议题、人员对接及随团企业家规模。\u003c/li>\n\u003cli>欧盟9月密集磋商及后续双反、WTO保障措施调查，调查到关税落地需要9个月到1年，2027年下半年是行业关税密集落地期；关注储能、插混电动车品类。\u003c/li>\n\u003cli>美联储9月议息及沃什鹰派承诺兑现情况，以及长端利率控制效果。\u003c/li>\n\u003cli>三季度业绩期从9月中旬开始，光互连板块业绩兑现；光博会结束后光互连板块后续催化。\u003c/li>\n\u003cli>罗博特科港股上市进程，以及CPO、NPO、OCS放量；OCS新增产线需求；双极隔离器、硅透镜阵列、FAU、微透镜阵列量产对27年利润弹性的贡献。\u003c/li>\n\u003cli>浪潮信息定增进展及投向落地：Agent规模化应用AI基础设施、液冷原生绿色智算、多智能体存算融合、高密度算力装备智造与交付。\u003c/li>\n\u003cli>肯特催化年产1690吨TBAF及中间体项目明年全部落地情况，以及海外HBM扩产与国产HBM突破带来的业绩增量。\u003c/li>\n\u003cli>英集芯硅电容海外ASIC客户进展及27年硅电容收入5亿元测算兑现；26Q3移动电源芯片迭代升级。\u003c/li>\n\u003cli>东田微高速光模块光学组件订单排产到2027年底交付的持续性。\u003c/li>\n\u003cli>宁德时代排产目标27年1.5T以上，动力增速15%、储能增速30%+、合计增速20%+的兑现；碳酸锂价格与年线关系、低库存+高去库逻辑变化。\u003c/li>\n\u003cli>中欧贸易争端与储能相关传言澄清；欧盟对储能、插混电动车的潜在调查。\u003c/li>\n\u003cli>铠侠赴美ADS上市进展及NAND需求重估。\u003c/li>\n\u003cli>华锡有色与中国五矿重大合作事项及控制权变更进展。\u003c/li>\n\u003cli>新宙邦氟化液放量，3M退出后冷却液国产替代验证周期。\u003c/li>\n\u003cli>AI硬件资本开支浪潮、AI应用企业端实际落地、电子铜箔产业、工业气体行业、材料升级-硅微粉阻燃剂等专题线索的后续验证。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>11:25｜【国泰海通食饮】妙可蓝多公告修订2025年股权激励及员工持股计划： 公司2025年股权激励与员工持股计划中，净利润考核目标原采用累计值，由于公司2025年对并购基金出资全额确认了约1.29亿元公允价值变动损失，如继续净利润累计值考核，上述非经营性事项将持续影响2025-2026、2025-2027年净利润考核目标达成，因此公司决定将净利润考核目标由累计值调整为按各单年度值，调整前后各单年度的净利润指标实际数值不变。同时，营收考核目标仍采\u003c/li>\n\u003cli>11:25｜俄罗斯官员称，不排除未来俄美两国会就两国元首在中国举行会晤一事达成一致，但目前尚无任何最终约定。\u003c/li>\n\u003cli>11:26｜【广发电子】继续推荐 英集芯 硅电容海外ASIC客户进展超预期，已测试通过。根据公司目前获得产能测算，公司27年硅电容收入有望达到5亿元。\u003c/li>\n\u003cli>11:26｜【688356 键凯科技】：被错杀的高增长医药上游核心，mRNA绕不开的\"专利水渠\"！＃未知来源 1、很多人以为公司二季度业绩不阿红，实际上二季报公司业绩非常靓丽！\u003c/li>\n\u003cli>11:26｜肯特催化更新：半导体业务加快落地，国产替代持续推进公司核心卡位产品四丁基氟化铵（TBAF），半导体应用包括先进封装的键合胶残留清洗、硅/SiO₂的选择性湿法蚀刻、蚀刻后残留物清洗等，公司公告募投项目变更年产1690吨四丁基氟化铵及其中间体项目，有望于明年全部落地，伴随海外HBM持续扩产以及国产HBM产品突破，公司新产能落地有望带来较大的业绩增量。其他半导体产品，包括TMAH高浓高纯产品、光刻胶功能性添加剂（18-冠醚-6）、半导体清洗剂\u003c/li>\n\u003cli>11:26｜近日#央视新闻深入东田微南昌工厂进行一线调研，并在南昌发布。在访谈中，公司明确表示大部分高速光模块光学组件订单已经排产到2027年底交付，订单供不应求！\u003c/li>\n\u003cli>11:26｜转：据科技媒体The Information报道，黑石预计将采购的谷歌张量处理单元（TPU）数量，将远高于今年5月宣布与谷歌成立合资公司时披露的规模。今年5月，黑石宣布与谷歌成立一家美国合资公司，提供数据中心容量、运营、网络以及谷歌Cloud TPU，以“算力即服务”的模式向客户提供TPU算力。\u003c/li>\n\u003cli>11:26｜浙商机械 邱世梁 【罗博特科】 ——#9月10日举行港股聆讯港股渐近，后续期待CPO、NPO、OCS多点共振#事件：2026年9月10日，公司举行港股上市聆讯。#核心逻辑：公司依托高精度光子学对准技术底座，兼具稀缺性与延展性，始终卡位最前沿的光互联方案。\u003c/li>\n\u003cli>11:27｜🎈【宁德时代】首次回购A股股份彰显长期信心，把握底部配置区间，强推！#事件：宁德时代公告，公司于2026年9月11日首次实施A股股份回购，通过集中竞价交易方式回购604293股，占公司当前总股本的0.0131%，最高成交价331.61元/股，最低成交价330.15元/股，成交总金额约2亿元（不含交易费用），回购股份用于注销并减少公司注册资本。\u003c/li>\n\u003cli>11:27｜【申万计算机】浪潮信息：发布定增预案，重视高景气赛道的业绩弹性！#定增预案预案拟定增不超过90亿元，向不超过35名特定对象发行，数量占当前总股本约6.5%（26H1控股股东浪潮集团持股32.12%）\u003c/li>\n\u003cli>11:27｜海信视像更新0911 <script>
const data=JSON.parse(document.getElementById('report-data').textContent),bundle=data.bundle||{},details=bundle.details||{},sources=bundle.source_details||bundle.sources||{};

function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
