 structurally reset SNDK’s margin profile higher and materially reduced cyclicality, with 8 signed NBMs representing ~$94B in total contract value at floor pricing, weighted-average contract duration of 4+ years, and ~80% GM even at the floor pricing tier; 2) NAND market TAM is inflecting from ~$70B in CY25 (JPMe) to $300B+ in CY26 and ~$500B in CY27, with Data Center representing the largest driver of growth (by far) as hyperscale/cloud customers increasingly deploy flash for inference-era workloads (incl. persistent KV cache - a major driver of bit demand growth); and 3) SNDK is delivering technology leadership, with BiCS10 sampling ahead of schedule (332-layer 2Tb QLC with 65% more bits per wafer than BiCS8), a projected 27% CAGR in per-wafer bit productivity through BiCS generations, and High Bandwidth Flash (HBF) emerging as a differentiated inference-era memory platform. Mgmt introduced a long-term financial model for FY28-FY30 targeting mid-/high-teens% revenue growth (in-line with bit growth - implying ~flat pricing was conservatively assumed), ~80% GM, ~75% OpM, and ~50% adjusted FCF margin, representing a clear step-change from historical norms where GMs oscillated well below this level. To us this screens as a substantive reset rather than peak-cycle pricing capture, with NBMs accounting for >50% of FY27 bits and growing to ~2/3 in FY28, and contracts detailing month- by-month volume, mix, and price commitments backed by $16.5B in financial guarantees, significantly improving forward visibility from the \"three months of pricing visibility\" that has been “standard operating procedure” for the industry, to 4+ years of committed economics with strategic customers. Even at floor pricing, we think NBMs sustain ~80% GMs across the multi-year contract lives, with upside captured through variable pricing mechanisms. We also view the LT financial model as embedding meaningful earnings leverage that we think is not fully captured in current consensus estimates as mid-/high-teens% revenue growth ultimately translates into an EPS growth CAGR north of 25%. Layered on top, mgmt's commitment to returning 100% of excess cash flow to shareholders should drive an aggressive share count reduction trajectory that further amplifies EPS growth on a per-share basis. We think this combination of higher through-cycle profitability, sustained bit demand growth, and share count reduction sets up a compounding earnings power dynamic that supports our CY27 EPS estimate of $250 and, in our view, points to a multi-year path toward meaningfully higher EPS levels beyond CY27. Longer-term, we view HBF and emerging 3D Matrix Memory technology as meaningful virtual call options on inference-era memory architecture that, in our view, are not fully reflected in current consensus estimates or valuation. We move to an OW rating and see ~47% upside in the stock from See page 10 for analyst certification and important disclosures.Sources for: Style Exposure – J.P. Morgan Global Markets Strategy; all other tables are company data and J.P. Morgan estimates. {[{dN4RHEsXkdxNkMtiuCqdBHlSTLU2UNLDi6J877W4SUyOoGa_h8WLGyL1asreex-2e6M66nZKwIz7V-sM2A884bzvoh1KE79kzY-Yx_Ciig}]} 2Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 14 August 2026 J P M O R G A N Price Performance YTD 1m 3m 12m Abs 543.7% -8.7% 5.6% 3150.6% Rel 520.7% -12.1% -1.8% 3119.5% Company Data Shares O/S (mn) 157 52-week range ($) 2,354.39-42.82 Market cap ($ mn) 239,913.30 Exchange rate 1.00 Free float (%) 98.7% 3M ADV (mn) 13.42 3M ADV ($ mn) 21,287.3 Volatility (90 Day) 129 Index RUSSELL 2000 BBG ANR (Buy | Hold | Sell) 26|4|0 Key Metrics (FYE Jun) $ in millions FY26A FY27E FY28E Financial Estimates Revenue 20,248 48,646 57,536 Adj. EBIT 12,700 38,866 45,300 Adj. EBITDA 12,408 38,622 45,056 Adj. net income 10,985 33,103 38,572 Adj. EPS 70.07 217.67 267.36 BBG EPS 65.92 211.05 258.66 Cashflow from operations 11,671 29,374 37,355 FCFF 11,522 27,866 34,417 Margins and Growth Revenue Growth Y/Y (%) 175.3% 140.3% 18.3% EBIT margin 62.7% 79.9% 78.7% EBIT Growth Y/Y (%) 1743.3% 206.0% 16.6% EBITDA margin 61.3% 79.4% 78.3% EBITDA Growth Y/Y (%) (1011.7%) 211.3% 16.7% Net margin 54.3% 68.0% 67.0% Adj. EPS growth 2196.9% 210.6% 22.8% Ratios Adj. tax rate 13.0% 14.9% 14.9% Interest cover 4,136.0 NM NM Net debt/Equity NM NM NM Net debt/EBITDA NM NM NM ROE 88.0% 186.3% 196.6% Valuation FCFF yield 4.8% 12.0% 15.6% Dividend yield - - - EV/Revenue 11.6 4.8 4.1 EV/EBITDA 19.0 6.1 5.3 Adj. P/E 21.8 7.0 5.7Summary Investment Thesis and Valuation Investment Thesis Sandisk’s “New Business Model” long-term agreements have structurally reset its margin profile higher and materially reduced cyclicality by converting the majority of its business into long-dated, high-margin, take-or-pay-style revenue, while a structural inflection in NAND demand (driven by AI inference reshaping data center storage) and technology leadership across its BiCS roadmap and emerging High Bandwidth Flash platform underpin a step-change in through-cycle profitability. This combination of durable margins, sustained bit demand growth, and a commitment to returning excess cash to shareholders sets up a compounding earnings power dynamic that points to a multi-year path of meaningfully higher earnings power. Valuation Our December 2027 price target of $2,250 assumes SNDK trades at 9x (within the historical 7-10x forward memory P/E range) applied to our CY27 EPS estimate of $250. Performance Drivers Source: J.P. Morgan Global Markets Strategy for Performance Drivers; company data, Bloomberg Finance L.P. and J.P. Morgan estimates for all other tables. Note: Price history may not be complete or exact. {[{dN4RHEsXkdxNkMtiuCqdBHlSTLU2UNLDi6J877W4SUyOoGa_h8WLGyL1asreex-2e6M66nZKwIz7V-sM2A884bzvoh1KE79kzY-Yx_Ciig}]} 3Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 14 August 2026 J P M O R G A N current levels. Our Dec-27 price target of $2,250 assumes SNDK trades at 9x (mid-point of the historical 7-10x forward memory P/E range) applied to our CY27 EPS estimate of $250. •NBMs structurally reset margin profile higher and materially reduce cyclicality; 8 signed customers with ~$94B TCV at floor pricing and ~80% GM economics. SNDK’s NBM framework, in our view, signifies a major structural change to the flash industry business model. Under NBMs, SNDK signs multi-year, qtr-by-qtr volume and pricing commitments with its most strategic DC and edge customers, with fixed and variable pricing components, floor and ceiling guardrails, financial guarantees to align interests, and detailed month-by-month volume/mix commitments. Since initially announcing five NBMs in April, SNDK has signed three additional NBMs with new customers and expanded two existing NBMs (with those two customers increasing their commitments within a quarter of initial signing) - strong validation that customer demand is running ahead of prior commitments. Financial guarantees amounting to $16.5B serve as protection for SNDK if a customer fails to satisfy its purchase obligations. Critically, we think the ~80% GM economics at floor pricing represents a structural shift rather than the capture of peak-cycle pricing. We expect variable pricing to trend above the floor across most of the contract life given current supply/demand dynamics, providing an upside lever to margin targets. NBM share of SNDK’s bits is expected to grow from >50% in FY27 to ~2/3 in FY28, and we view this as effectively converting the majority of SNDK’s business from spot-priced commodity flash into a long-dated, high-margin, take-or-pay-style revenue stream. In our view, this transition dramatically compresses cyclical volatility relative to the historical “three months of pricing visibility” that produced boom-bust cycles (such as FY23). Going forward, mgmt has stated it will remain highly selective in evaluating additional NBMs, which we think is an appropriate posture given the meaningful share of supply now spoken for, enabling SNDK to preserve optionality for spot-market upside on the non-NBM bit base. •NAND TAM inflecting from ~$70B in CY25 to $300B+ in CY26 and ~$500B in CY27, driven by data center as AI inference workloads reshape storage requirements. The NAND market is undergoing what we think is a structural inflection driven by AI infrastructure investment, with a TAM that is expected to grow from ~$70B in CY25 (JPMe) to >$300B in CY26 and approaching $500B in CY27 (per SNDK estimates, which align closely with JPMe - see here). Data center is the key driver of this growth, shifting from ~30% of TAM in CY25 to ~50% in CY26 and continuing to outpace the overall market in CY27. Underpinning this shift is the emergence of AI inference, which is fundamentally a memory-centric, storage-intensive problem: every AI interaction generates content that must be stored, retrieved, and served at low latency, with persistent KV cache emerging as a critical new NAND workload as models scale to larger context lengths, higher parameter counts, and agentic architectures. Importantly, we think the supply side of the equation is structurally constructive, with industry wafer capacity now ~30% below prior peak and running at ~100% utilization. This means near- term bit growth comes primarily from nodal migrations rather than wafer additions, which structurally supports pricing durability and, we think, extends the current upcycle materially beyond what historical patterns would suggest. On the edge side, we expect unit growth in smartphones and PCs to be >10% in CY26 as demand adjusts to premium mix, before potentially returning to unit growth in CY27 with content per device continuing to expand as on-device AI, richer content, and new form factors drive higher storage requirements. Notably, mgmt indicated bits are expected to remain on allocation beyond CY27 - a data point we think is materially bullish for sustained NAND pricing durability through the remainder of the decade. •Technology and product strength across BiCS roadmap, systems capabilities, and emerging HBF platform; BiCS10 sampling ahead of schedule. On the BiCS roadmap, SNDK introduced BiCS10 (332-layer 2Tb QLC), which mgmt characterized as the world’s highest-density memory chip and confirmed is now sampling (a milestone we {[{dN4RHEsXkdxNkMtiuCqdBHlSTLU2UNLDi6J877W4SUyOoGa_h8WLGyL1asreex-2e6M66nZKwIz7V-sM2A884bzvoh1KE79kzY-Yx_Ciig}]} 4Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 14 August 2026 J P M O R G A N think is particularly notable given development is moving ahead of expectations). BiCS10 delivers ~60% memory density improvement, ~100% write/read bandwidth improvement, ~33% interface speed improvement, and ~75% power efficiency improvement vs. BiCS8, and packs 65% more bits per wafer than the prior generation - metrics that in our view cement SNDK’s strong competitive positioning relative to peers. In parallel, SNDK has also introduced BiCS9 2Tb QLC, which combines the mature BiCS8 cell array with BiCS10-like CMOS features, delivering higher performance and power efficiency vs. BiCS8 QLC with minimal incremental capex, which we view as a reinforcement of SNDK’s industry-leading capital efficiency positioning. Over 5 generations of BiCS technology (BiCS5 through BiCS11), SNDK averages 54% gen-to- gen bit per wafer growth, or a 27% CAGR in per-wafer bit productivity (outpacing the mid-/high-teens% bit growth targeted in the LT model), positioning SNDK to deliver bit growth commitments through technology alone (i.e. no wafer additions), preserving capital and supporting its MSD% capital intensity target. Longer-term, we view HBF (High Bandwidth Flash) as an emerging differentiated inference-era memory architecture that, in our view, is one of the more compelling call options in the memory space. SNDK’s own HBF vs. HBM simulations show 8x CapEx efficiency for minimum- config workloads and 2x GPU efficiency at maximum token output - data points we think are compelling enough that we expect meaningful customer engagement to continue building through 2027. The inaugural HBF specification was released last week, with the first HBF memory die taped out and first HBF inference product samples targeted for 2027. •Moving to an Overweight rating on Sandisk (from Not Rated) - $2,250 PT. Our December 2027 price target of $2,250 assumes SNDK trades at 9x (within the historical 7-10x forward memory P/E range) applied to our CY27 EPS estimate of $250, implying ~47% upside from current levels. We move to an Overweight rating (from Not Rated). {[{dN4RHEsXkdxNkMtiuCqdBHlSTLU2UNLDi6J877W4SUyOoGa_h8WLGyL1asreex-2e6M66nZKwIz7V-sM2A884bzvoh1KE79kzY-Yx_Ciig}]} 5Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 14 August 2026 J P M O R G A N Appendix I: Comp and Group Valuation Figure 1: Sandisk Comp Group 5.9x 4.4x 6.7x Median4.9x 5.1x 8.0x $ 101.54 $ 64.30 $ 548,196 $ 353,266 $55,143 166.3% $514.00 Overweight Jay Kwon NTD 2408 TT NANYA TECHNOLOGY CORP6.8x 3.3x 4.4x 470,842 353,916 539,350,578 349,841,146 $808,427 141.1% 1572000 Overweight Jay Kwon KRW 000660 KS SK HYNIX INC3.1x 3.7x 5.5x 70,440 48,071 976,000,000 729,376,254 $1,082,450 118.4% 263000 Overweight Jay Kwon KRW 005930 KS SAMSUNG ELECTRONICS CO LTD10.6x 5.9x 9.2x $ 161.97 $ 103.46 $ 267,361 $ 172,887 $1,072,731 232.8% $949.83 Overweight Harlan Sur USD MU MICRON TECHNOLOGY INCP/B(x)Current P/2027 P/2026 EPS C27E EPS C26E Sales C27E Sales C26E ($ mm)Market Cap Change %YTD Price RatingJPM AnalystJPM Currency TickerBloomberg Company Name Source: Company reports, Bloomberg Finance L.P., and J.P. Morgan estimates. Prices as of market close 8/13/2026. Appendix II: Financial Tables Figure 2: Sandisk Income Statement 67.80 67.69 67.25 64.63 61.31 56.54 53.22 46.60 39.25 23.41 6.20 1.22 0.29 (0.30) 1.24 1.83 Pro Forma Diluted EPS72.97 72.77 72.22 69.33 65.71 60.54 56.93 49.81 41.92 24.83 6.58 1.24 0. ，可能触发了一些程序化卖盘并加速了跌势。 🌙隔夜新闻重点仍在于财报方面，中芯国际（SMIC）第二季度业绩及第三季度毛利率指引均大幅超出预期。 ℹ️此外，值得注意的是，Counterpoint 发布了第二季度全球存储市场份额报告，中国最大的 NAND 制造商长江存储（YMTC，预计将于年底前上市）在 NAND 出货量上超过了铠侠（Kioxia），跃升至全球第三，但由于其在低价消费级 SSD 领域的敞口较大，按营收计算仍排名第五。 📈长鑫存储（CXMT）的 DRAM 出货量份额也攀升至 9%，缩小了与美光（Micron）的差距。 💹由于腾讯在财报公布后股价下跌，该公司昨日已取代腾讯成为中国市值最高的公司。 📰市场新闻🌐美中关系🔹特朗普政府正在开发一种...", "publish_time": "2026-08-14 08:33", "tags": ["文字观点"]}, "post:2026-08-14T13-32:77fb5a1c56d6": {"id": "post:2026-08-14T13-32:77fb5a1c56d6", "kind": "post", "title": "2026-08-14 13:32", "source_label": "帖子正文", "excerpt": "【SK集团董事长：AI智能体的使用量五年内可能增长77倍】 SK海力士董事长崔泰源在公司韩国总部接受了媒体专访。他表示，产能扩张可能需要四到五年时间，并将各家公司对存储芯片的争夺形容为\"如同一场战争\"。", "content": "【SK集团董事长：AI智能体的使用量五年内可能增长77倍】 SK海力士董事长崔泰源在公司韩国总部接受了媒体专访。他表示，产能扩张可能需要四到五年时间，并将各家公司对存储芯片的争夺形容为\"如同一场战争\"。如果没有足够的内存，客户“就无法生产AI计算设备和AI芯片”。他还表示，随着AI服务器需求持续爆发，HBM高带宽存储供不应求，不少科技巨头甚至提前赶到韩国抢签长期协议。崔泰源还警告称，明年可能会出现有史以来最严重的内存短缺。崔泰源将当前的AI比作一个四岁的孩子，随着行业逐步成熟，内存需求将大幅增长，并预测AI智能体的使用量五年内可能增长77倍。#文字观点", "publish_time": "2026-08-14 13:32", "tags": ["文字观点"]}, "attachment:files/东北证券-登康口腔(001328)产品、渠道双轮驱动，抗敏感龙头多元成长-260813.pdf": {"id": "attachment:files/东北证券-登康口腔(001328)产品、渠道双轮驱动，抗敏感龙头多元成长-260813.pdf", "kind": "attachment", "title": "东北证券-登康口腔(001328)产品、渠道双轮驱动，抗敏感龙头多元成长-260813", "source_label": "东北证券", "excerpt": "谨请参阅尾页重要声明及财通证券股票和行业评级标准 1 封测龙头领跑先进封装，行业景气全面上行 长电科技 （600584）", "content": "谨请参阅尾页重要声明及财通证券股票和行业评级标准 1 封测龙头领跑先进封装，行业景气全面上行 长电科技 （600584） 证券研究报告 半导体 /公司深度研究报告 /2026.08.13 投资评级 :买入（首次） 核心观点 基本数据 2026 -08-12 收盘价（元） 78.18 流通股本 （亿股） 17.89 每股净资产 （元） 16.08 总股本（亿股） 17.89 最近 12月市场表现 分析师 唐佳 SAC证书编号： S0160525110002 tangjia@ctsec.com 分析师 詹小瑁 SAC证书编号： S0160525120008 zhanxm@ctsec.com 相关报告 1. 《整合效果初见端倪，各方利好助推扬帆 起航》 2018 -04-13 2. 《收购协同效应显现， 封测龙头高速发展》 2018 -01-25 ❖ 全球第三、中国大陆第一封测龙头，平台化构筑核心壁垒 。公司深耕半 导体封测五十余年， 2025年营收 388.71亿元，全球委外封测（ OSAT）市占率 12.2%，位居全球第三、中国大陆第一。 目前，公司海内外共布局八大生产基 地、两大研发中心， 已覆盖传统封装至 2.5D/3D 先进封装全链条，提供一站 式芯片制造服务 。 ❖ 行业景气回暖， 全球先进封装集体扩产 。2025年全球半导体销售额达 7956 亿美元，同比 +26.2%，2026年Q1复苏提速，封测厂产能利用率普遍超 80%。 高景气下全球厂商集体加码扩产 ，公司 2026年固定资产投资预算上调至约 100 亿元，聚焦 AI算力、车规、 HBM存储高端赛道，充分受益行业成长红利 。 ❖ 存力、算力、电力三重需求共振，运算电子 高增。公司运算电子 2025年 营收 82.79亿元，同比 +42.6%。存力端，HBM 需求爆发驱动高端存储封测放 量，公司覆盖 DRAM/Flash 全品类； 算力端，AI 算力芯片对 2.5D/3D 封装需 求陡增， 公司 XDFOI®平台实现 4nm多芯片集成量产， CPO硅光引擎完成样 品交付； 电力端，公司基于 SiP的2.5D垂直 VCORE电源模块量产。公司在 存力、算力、电力三条赛道上技术卡位， 目前正处在高速成长通道中。 ❖ 汽车电子为第二成长曲线，车规业务持续放量 。公司是中国大陆首家加 入AEC汽车电子委员会的封测企业，八大基地均通过 IATF16949 认证。临港 汽车电子工厂已于 2026年3月投产， 2025年汽车电子业务营收 37.32亿元， 同比 +31.7%，有望持续受益于汽车电动化与智能化浪潮。 ❖ 投资建议： 公司作为全球封测龙头，深度受益于 AI算力封装需求爆发与汽 车电子国产替代趋势 。我们预计公司 2026-2028年实现营业收入 457.55/535.37/623.73 亿元，归母净利润 为22.09/28.58/34.28 亿元。对应 PE分 别为 63.33/48.95/40.81 倍，首次覆盖，给予 “买入 ”评级。 ❖ 风险提示： 行业周期与外部环境不确定风险；技术研发及产能建设不及预期 风险；先进封测行业需求增长不及预期风险。 盈利预测 [Table_FinchinaSimple ] 币种（人民币） 2024A 2025A 2026E 2027E 2028E 营业收入 （百万元） 35,962 38,871 45,755 53,537 62,373 收入增长率 （%） 21.2 8.1 17.7 17.0 16.5 归母净利润 （百万元） 1,610 1,565 2,209 2,858 3,428 净利润增长率 （%） 9.4 -2.8 41.1 29.4 19.9 EPS（元） 0.90 0.87 1.23 1.60 1.92 PE 45.4 42.3 63.3 48.9 40.8 ROE（%） 5.8 5.5 7.3 8.7 9.6 PB 2.6 2.3 4.6 4.3 3.9 数据来源： Wind，财通证券研究所 （以 2026年08月12日收盘价计算） -2%39%79%119%160%200%长电科技 沪深 300 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 2 公司深度研究报告 /证券研究报告 内容目录 1 公司概况：国内封测 OSAT领航者 ................................ ................................ ................................ .......... 4 1.1 全球封测第一梯队，大陆龙头地位稳固 ................................ ................................ ................................ 4 1.2 治理优化与全球化产能布局，构筑发展坚实底座 ................................ ................................ ................ 6 1.3 营收连创新高，盈利弹性释放可期 ................................ ................................ ................................ ........ 7 2 行业周期与先进封装：景气上行，技术重构 ................................ ................................ ........................... 8 2.1 行业周期：景气周期持续上行，封装板块增长迅猛 ................................ ................................ ............ 8 2.1.1 全球半导体周期上行确立，封测行业高景气联动 ................................ ................................ ............. 8 2.1.2 海内外库存周期分化，补库动能持续释放 ... 周期 ：景气周期 持续上行，封装板块增长迅猛 2.1.1 全球半导体周期上行确立，封测行业高景气联动 全球半导体行业已明确迈入新一轮强复苏周期，市场规模持续创出历史新高 。据 WSTS统计， 2025年全球半导体销售额达到 7956亿美元，同比增长 26.2%，为有 史以来最高的年度销售记录，并预计 2026年全球销售额将突破 1万亿美元大关。 进入 2026年，复苏势头进一步加速 ，根据 SIA数据，第一季度全球半导体销售额 达2985亿美元， 同比增长 79%。半导体作为几乎所有现代技术的基石，其需求正 被人工智能、物联网、 6G、自动驾驶等新兴技术持续驱动。 展望未来，强劲的终 端创新与库存周期的共振，有望支撑全球半导体行业在本轮复苏周期中延续高 景 气度。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 9 公司深度研究报告 /证券研究报告 图10: 全球半导体市场规模以及预测 数据来源： WSTS，财通证券研究所 封测作为半导体产业链后端环节，景气度与产业复苏高度同频，业绩与资本开支 双重验证行业高景气。业绩端 ，全球龙头盈利同步大幅改善：日月光投控 2026年 Q1半导体封装测试营业净利润达新台币 158.77亿元，同比增长 90%；通富微电 Q1净利润同比大增 224%，先进封装业务营收占比达 70%；长电科技 Q1净利润 同比增长 43%，主动优化产品结构 ，2.5D先进封装产品加速量产导入 。 开支端全面加码，先进封装为核心投资主线，高端产能供需持续偏紧。 台厂为扩 产主力： 日月光 2026年资本开支上调至 85亿美元，在全球积极推进建厂计划， 年内 6座新厂动工，预计将大幅扩充封装产能 ；力成、京元各规划 500亿新台币 扩产封测。大陆厂商同步跟进，长电科技 2026年固投预算 100亿元布局算力、车 规、 HBM产线，通富微电拟募资 42.2亿元升级多赛道封测产能；三星、安靠分 别投入 40亿、 25-30亿美元布局海外封测基地。本轮扩产聚焦高端先进封装，传 统封装产能供给宽松，行业红利持续向技术龙头集聚 。 2.1.2 海内外库存周期分化，补库动能持续释放 全球半导体库存周期已触底反转，全行业进入低位去化、补库在即的关键拐点， 供需格局迎来根本性改善 。2026年第一季度，全球半导体大厂库存周转天数降至 121天，环比下降 15天，创下近三年最低水平。其中存储板块去化最为彻底： SK 海力士在高盛电话会明确指出，存储行业已全面进入卖方市场，受 AI真实需求爆 发与洁净室产能刚性约束双重驱动，年内存储价格有望持续上行，公司 DRAM及 NAND库存仅剩约 4周，远低于安全水位，且无法完全满足下游客户需求。 区域格局呈现明显分化，日本品牌芯片仍处于阶段性供过于求状态，而台系、韩 系头部厂商需求持续旺盛，渠道与终端补库存动能充足。当前行业整体库存已处 于历史低位， 2026 年Q1封测龙头企业平均产能利用率超 80%，其中日月光、通 富微电、华天科技稼动率达到 80%-90%，先进封装占比大幅提升，行业在传统淡 季实现高位稼动，订单能见度显著改善。 综合来看，行业大规模补库周期一触即 发，而下游需求的持续高增正是本轮补库的核心驱动力，封测作为产业链后端环 节将直接受益 ，持续带动自身景气度加速上行。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 10 公司深度研究报告 /证券研究报告 表1: 部分封测厂商 2026年产能利用率数据表 厂商 产能利用率 动态 订单预测 日月光 80%-89% 2026年先进封测营收目标上修至 35 亿美元以上 订单饱满，展望积 极 台积电 100% 全力扩产仍难以满足 AI芯片封装 需求 订单能见度高，持 续上升 长电科技 80% 主动削减低毛利传统封装订单，优 化产品结构 订单结构优化，盈 利预期上升 通富微电 80%-90% 先进封装收入占比约 70%，产能持 续满载 在手订单充足 华天科技 80%-90% 在手订单 80-90亿元，产能利用率 高位运行 订单饱满，展望积 极 中小封测厂 60%-70% 通用封装需求疲软，产能利用率偏 低 订单稳定 数据来源：芯智云，财通证券研究所 2.1.3 下游需求结构优化， AI与汽车电子双轮驱动 2026年全球半导体下游需求呈现结构性分化格局， AI与高性能计算成为本轮景 气周期的核心引擎。 逻辑器件在 2025年领跑全球半导体市场增长， 主要受益于数 据中心、 AI加速器与先进计算系统对高性能芯片的强劲拉动。据 QYResearch 统 计，2025年全球 AI芯片市场规模已达 1059.8亿美元，预计 2032年将增至 3956.4 亿美元， 2026 -2032年CAGR高达 20.0%。AI加速芯片需求持续爆发，不仅推动 芯片出货量快速扩容，更强力拉动 HBM堆叠封装、 2.5D异构集成、 CPO光电共 封装等前沿先进封装技术需求，成为封测产业升级的关键动力。 图11: 2025年全球半导体销售额器件细分占比 （单位：十亿美元） 数据来源： WSTS，半导体产业纵横，财通证券研究所 消费电子与汽车电子呈现差异化复苏态势，共同构建行业稳健支撑 。消费电子结 束高增长步入存量时代， 根据 Omdia数据，2025年全球智能手机出货量 12.5亿 部，同比增长 2%；PC出货量 2.795亿台，同比增长 9.2%，整体呈现温和修复。 汽车电子在新能源与智能化双轮驱动下高速成长， 根据 Mordor Intelligence 数据， 2025年汽车半导体市场规模达 1004.8亿美元，预计 2030年以 7.29%的复合增速 扩容至 1428.7亿美元。据台积电资深副总经理张晓强预测， 2030年全球半导体市 场规模将突破 1.5万亿美元， AI与高性能计算占比将达 55%， 智能手机约占 20%， 汽车电子与物联网各占 10%。整体来看， 行业需求结构持续向高附加值赛道集中， AI主导、车规稳健、消费温和的结构性成长趋势明确 。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 11 公司深度研究报告 /证券研究报告 2.2 先进封装：市场扩容加速，格局分化演进 2.2.1 市场规模持续扩大， 先进封装 渗透持续提升 全球封测市场结构性升级， 先进封装成为价值重估核心 。据Yole Group 数据， 2025 年全球先进封装市场规模约 531亿美元，预计 2030年将达 794亿美元，年复合增 长率约 8.4%。到 2026年，先进封装在全球封测市场中的占比将首次突破 54%， 行业结构性升级趋势明确 。在 AI 算力需求持续爆发的带动下，封装测试环节由 传统产业链配套角色升级为性能突破的关键载体，行业地位与价值量持续抬升 。 图12: 2020 -2026年封装市场概览 数据来源： 半导体产业纵横 ，Yole，财通证券研究所 先进封装渗透率快速提升，核心驱动来自技术、需求与成本三大因素共振 。技术 方面，后摩尔时代传统制程微缩边际效益递减，产业转向以集成化、微型化为主 的系统级创新，先进封装成为延续芯片性能增长曲线的核心路径 ；需求方面， AI 与高性能计算的爆发则带来最强需求动力， GPU、AI加速芯片需通过 CoWoS等 先进方案集成 HBM， 以突破内存墙与功耗瓶颈 ；Chiplet异构集成技术持续成熟， 通过芯粒拆分与整合显著提升良率、降低成本、缩短研发周期。多重因素共同推 动下， 先进封装已从芯片配套环节升级为产业链价值 高地， 成长确定性持续强化。 2.2.2 技术路线分层明确，竞争格局龙头主导 先进封装技术路线分层清晰 ，2.5D/3D封装成 AI核心赛道 。后摩尔时代半导体技 术重心由前端制程转向封装与系统级集成，先进封装成为性能跃升的关键载体， 技术路线呈现清晰分层与高速迭代态势。当前主流技术涵盖 2.5D/3D 封装、扇出 型晶圆级 /面板级封装、微间距互连及系统级封装等方向，在 AI、HPC等高端场 景快速渗透。据 QYResearch 预测， 2026 -2032年全球先进封装市场规模 复合增长 率CAGR为9.2%，其中 2.5D/3D 集成电路封装同期 CAGR高达 16.8%，是技术 升级与需求拉动的最强赛道， 增速显著领跑行业。 全球格局双核主导，大陆厂商加速技术突围 。全球先进封装竞争格局高度集中， 呈现台陆双核心、 龙头差异化、 大陆加速追赶的鲜明特征。 据芯思想研究院统计， 2025年全球 OSAT行业 CR10中，中国台湾企业 3家、市占率 33.4%，中国大陆 企业 5家、市占率 32.6%，份额基本持平，亚洲主导地位持续强化。 2025 年全球 封测厂商表现指数显示，日月光、安靠科技、长电科技稳居前三，共同构成全球 第一梯队 。日月光以 VIPackTM3D异构集成平台构建全栈 技术壁垒，安靠在 SWIFT®扇出封装与 2.5D/3D TSV 领域优势显著，长电科技则凭借 XDFOI多维扇 出平台实现 4nm节点多芯片集成，跻身全球第一阵营。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 12 公司深度研究报告 /证券研究报告 图13: 全球六大 OSAT封测厂商 2025市场表现指数 数据来源： 深芯盟半导体产业研究 ，财通证券研究所 中国封测力量全面崛起， 产业结构持续升级 。中国大陆厂商已在全球前十大 OSAT 中稳占五席 ，以长电科技、通富微电为代表，以及盛合晶微等创新企业，正逐步 摆脱低端打线封装依赖 。通过在 XDFOI、VISionS等自主先进封装平台上的实质 性突破，本土龙头企业正加速从“规模扩张”向“质量提升”的结构性升级 。整 体来看，全球封测格局持续优化，大陆龙头依托技术突破与产能扩张，在先进封 装国产替代浪潮中占据有利位置。 2.3 宏观政策与国产替代： 先进封装成突围关键 外部管制升级， 封测环节成为国产替代的关键战略支点 。2026年美国对华半导体 管制进一步加码 ，4月众议院推出 MATCH法案，将先进封装、 HBM生产关键设 备纳入出口管制，管制范围由 EUV扩至 DUV光刻机， 并切断已售设备的全生命 周期服务，要求盟友 150天内与美方标准完全对齐，意图封堵我国先进制程升级 通道。相较于制造端承压，封测环节受直接冲击相对有限，我国已构建全球最完 整封测产业链与最大产能底座，长电科技、通富微电、华天科技等龙头稳居全球 前列。面对设备限制，国内封测企业与设备厂商联合攻关，加快键合机、塑封机、 测试机等核心设备国产替代；同时依托新能源汽车、 AI服务器、 5G基站等海量 本土应用场景，持续迭代具有中国特色的先进封装方案， 为技术突破与规模化量 产提供充足支撑 。 国内政策强力护航，大基金三期引领全链条攻坚。 2026年政府工作报告明确提出 推动集成电路产业全链条协同攻关，将自主可控上升至国家战略核心议程。国家 大基金三期加速落地，注册资本达 3440亿元，规模超前两期总和，首期资金已精 准投放；基金 70%资金定向扶持设备、材料、零部件等卡脖子环节，重点覆盖先 进封装、 AI芯片、高端制程等领域，以国家级资本撬动全产业链技术攻关。与此 同时， “专精特新” 培育计划与半导体深度绑定， 细分领域优质中小企业获得政策、 资金、市场全方位支持。整体来看， 外部管制持续施压与内部政策持续加力形成 共振，共同推动先进封装领域国产替代进入加速期 。 先进封装已成为后摩尔时代我国半导体产业实现技术突围的重要路径。 在单片集 成逼近物理极限的背景下， Chiplet与3D封装通过异构集成路径， 在成本与灵活 性上具备独特优势。 我国在先进封装领域已接近全球主流水平， 长电科技以 XDFOI®多维扇出封装平台为核心，全面覆盖 2.5D/3D、HBM、CPO等先进技术， 仅供内部参考，请勿外传", "status": "extracted"}, "attachment:files/东吴证券-水羊股份(300740)从美妆平台到高奢品牌集团，高端化转型开启成长新周期-260814.pdf": {"id": "attachment:files/东吴证券-水羊股份(300740)从美妆平台到高奢品牌集团，高端化转型开启成长新周期-260814.pdf", "kind": "attachment", "title": "东吴证券-水羊股份(300740)从美妆平台到高奢品牌集团，高端化转型开启成长新周期-260814", "source_label": "东吴证券", "excerpt": "谨请参阅尾页重要声明及财通证券股票和行业评级标准 1 封测龙头领跑先进封装，行业景气全面上行 长电科技 （600584）", "content": "谨请参阅尾页重要声明及财通证券股票和行业评级标准 1 封测龙头领跑先进封装，行业景气全面上行 长电科技 （600584） 证券研究报告 半导体 /公司深度研究报告 /2026.08.13 投资评级 :买入（首次） 核心观点 基本数据 2026 -08-12 收盘价（元） 78.18 流通股本 （亿股） 17.89 每股净资产 （元） 16.08 总股本（亿股） 17.89 最近 12月市场表现 分析师 唐佳 SAC证书编号： S0160525110002 tangjia@ctsec.com 分析师 詹小瑁 SAC证书编号： S0160525120008 zhanxm@ctsec.com 相关报告 1. 《整合效果初见端倪，各方利好助推扬帆 起航》 2018 -04-13 2. 《收购协同效应显现， 封测龙头高速发展》 2018 -01-25 ❖ 全球第三、中国大陆第一封测龙头，平台化构筑核心壁垒 。公司深耕半 导体封测五十余年， 2025年营收 388.71亿元，全球委外封测（ OSAT）市占率 12.2%，位居全球第三、中国大陆第一。 目前，公司海内外共布局八大生产基 地、两大研发中心， 已覆盖传统封装至 2.5D/3D 先进封装全链条，提供一站 式芯片制造服务 。 ❖ 行业景气回暖， 全球先进封装集体扩产 。2025年全球半导体销售额达 7956 亿美元，同比 +26.2%，2026年Q1复苏提速，封测厂产能利用率普遍超 80%。 高景气下全球厂商集体加码扩产 ，公司 2026年  2.1 行业周期 ：景气周期 持续上行，封装板块增长迅猛 2.1.1 全球半导体周期上行确立，封测行业高景气联动 全球半导体行业已明确迈入新一轮强复苏周期，市场规模持续创出历史新高 。据 WSTS统计， 2025年全球半导体销售额达到 7956亿美元，同比增长 26.2%，为有 史以来最高的年度销售记录，并预计 2026年全球销售额将突破 1万亿美元大关。 进入 2026年，复苏势头进一步加速 ，根据 SIA数据，第一季度全球半导体销售额 达2985亿美元， 同比增长 79%。半导体作为几乎所有现代技术的基石，其需求正 被人工智能、物联网、 6G、自动驾驶等新兴技术持续驱动。 展望未来，强劲的终 端创新与库存周期的共振，有望支撑全球半导体行业在本轮复苏周期中延续高 景 气度。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 9 公司深度研究报告 /证券研究报告 图10: 全球半导体市场规模以及预测 数据来源： WSTS，财通证券研究所 封测作为半导体产业链后端环节，景气度与产业复苏高度同频，业绩与资本开支 双重验证行业高景气。业绩端 ，全球龙头盈利同步大幅改善：日月光投控 2026年 Q1半导体封装测试营业净利润达新台币 158.77亿元，同比增长 90%；通富微电 Q1净利润同比大增 224%，先进封装业务营收占比达 70%；长电科技 Q1净利润 同比增长 43%，主动优化产品结构 ，2.5D先进封装产品加速量产导入 。 开支端全面加码，先进封装为核心投资主线，高端产能供需持续偏紧。 台厂为扩 产主力： 日月光 2026年资本开支上调至 85亿美元，在全球积极推进建厂计划， 年内 6座新厂动工，预计将大幅扩充封装产能 ；力成、京元各规划 500亿新台币 扩产封测。大陆厂商同步跟进，长电科技 2026年固投预算 100亿元布局算力、车 规、 HBM产线，通富微电拟募资 42.2亿元升级多赛道封测产能；三星、安靠分 别投入 40亿、 25-30亿美元布局海外封测基地。本轮扩产聚焦高端先进封装，传 统封装产能供给宽松，行业红利持续向技术龙头集聚 。 2.1.2 海内外库存周期分化，补库动能持续释放 全球半导体库存周期已触底反转，全行业进入低位去化、补库在即的关键拐点， 供需格局迎来根本性改善 。2026年第一季度，全球半导体大厂库存周转天数降至 121天，环比下降 15天，创下近三年最低水平。其中存储板块去化最为彻底： SK 海力士在高盛电话会明确指出，存储行业已全面进入卖方市场，受 AI真实需求爆 发与洁净室产能刚性约束双重驱动，年内存储价格有望持续上行，公司 DRAM及 NAND库存仅剩约 4周，远低于安全水位，且无法完全满足下游客户需求。 区域格局呈现明显分化，日本品牌芯片仍处于阶段性供过于求状态，而台系、韩 系头部厂商需求持续旺盛，渠道与终端补库存动能充足。当前行业整体库存已处 于历史低位， 2026 年Q1封测龙头企业平均产能利用率超 80%，其中日月光、通 富微电、华天科技稼动率达到 80%-90%，先进封装占比大幅提升，行业在传统淡 季实现高位稼动，订单能见度显著改善。 综合来看，行业大规模补库周期一触即 发，而下游需求的持续高增正是本轮补库的核心驱动力，封测作为产业链后端环 节将直接受益 ，持续带动自身景气度加速上行。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 10 公司深度研究报告 /证券研究报告 表1: 部分封测厂商 2026年产能利用率数据表 厂商 产能利用率 动态 订单预测 日月光 80%-89% 2026年先进封测营收目标上修至 35 亿美元以上 订单饱满，展望积 极 台积电 100% 全力扩产仍难以满足 AI芯片封装 需求 订单能见度高，持 续上升 长电科技 80% 主动削减低毛利传统封装订单，优 化产品结构 订单结构优化，盈 利预期上升 通富微电 80%-90% 先进封装收入占比约 70%，产能持 续满载 在手订单充足 华天科技 80%-90% 在手订单 80-90亿元，产能利用率 高位运行 订单饱满，展望积 极 中小封测厂 60%-70% 通用封装需求疲软，产能利用率偏 低 订单稳定 数据来源：芯智云，财通证券研究所 2.1.3 下游需求结构优化， AI与汽车电子双轮驱动 2026年全球半导体下游需求呈现结构性分化格局， AI与高性能计算成为本轮景 气周期的核心引擎。 逻辑器件在 2025年领跑全球半导体市场增长， 主要受益于数 据中心、 AI加速器与先进计算系统对高性能芯片的强劲拉动。据 QYResearch 统 计，2025年全球 AI芯片市场规模已达 1059.8亿美元，预计 2032年将增至 3956.4 亿美元， 2026 -2032年CAGR高达 20.0%。AI加速芯片需求持续爆发，不仅推动 芯片出货量快速扩容，更强力拉动 HBM堆叠封装、 2.5D异构集成、 CPO光电共 封装等前沿先进封装技术需求，成为封测产业升级的关键动力。 图11: 2025年全球半导体销售额器件细分占比 （单位：十亿美元） 数据来源： WSTS，半导体产业纵横，财通证券研究所 消费电子与汽车电子呈现差异化复苏态势，共同构建行业稳健支撑 。消费电子结 束高增长步入存量时代， 根据 Omdia数据，2025年全球智能手机出货量 12.5亿 部，同比增长 2%；PC出货量 2.795亿台，同比增长 9.2%，整体呈现温和修复。 汽车电子在新能源与智能化双轮驱动下高速成长， 根据 Mordor Intelligence 数据， 2025年汽车半导体市场规模达 1004.8亿美元，预计 2030年以 7.29%的复合增速 扩容至 1428.7亿美元。据台积电资深副总经理张晓强预测， 2030年全球半导体市 场规模将突破 1.5万亿美元， AI与高性能计算占比将达 55%， 智能手机约占 20%， 汽车电子与物联网各占 10%。整体来看， 行业需求结构持续向高附加值赛道集中， AI主导、车规稳健、消费温和的结构性成长趋势明确 。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 11 公司深度研究报告 /证券研究报告 2.2 先进封装：市场扩容加速，格局分化演进 2.2.1 市场规模持续扩大， 先进封装 渗透持续提升 全球封测市场结构性升级， 先进封装成为价值重估核心 。据Yole Group 数据， 2025 年全球先进封装市场规模约 531亿美元，预计 2030年将达 794亿美元，年复合增 长率约 8.4%。到 2026年，先进封装在全球封测市场中的占比将首次突破 54%， 行业结构性升级趋势明确 。在 AI 算力需求持续爆发的带动下，封装测试环节由 传统产业链配套角色升级为性能突破的关键载体，行业地位与价值量持续抬升 。 图12: 2020 -2026年封装市场概览 数据来源： 半导体产业纵横 ，Yole，财通证券研究所 先进封装渗透率快速提升，核心驱动来自技术、需求与成本三大因素共振 。技术 方面，后摩尔时代传统制程微缩边际效益递减，产业转向以集成化、微型化为主 的系统级创新，先进封装成为延续芯片性能增长曲线的核心路径 ；需求方面， AI 与高性能计算的爆发则带来最强需求动力， GPU、AI加速芯片需通过 CoWoS等 先进方案集成 HBM， 以突破内存墙与功耗瓶颈 ；Chiplet异构集成技术持续成熟， 通过芯粒拆分与整合显著提升良率、降低成本、缩短研发周期。多重因素共同推 动下， 先进封装已从芯片配套环节升级为产业链价值 高地， 成长确定性持续强化。 2.2.2 技术路线分层明确，竞争格局龙头主导 先进封装技术路线分层清晰 ，2.5D/3D封装成 AI核心赛道 。后摩尔时代半导体技 术重心由前端制程转向封装与系统级集成，先进封装成为性能跃升的关键载体， 技术路线呈现清晰分层与高速迭代态势。当前主流技术涵盖 2.5D/3D 封装、扇出 型晶圆级 /面板级封装、微间距互连及系统级封装等方向，在 AI、HPC等高端场 景快速渗透。据 QYResearch 预测， 2026 -2032年全球先进封装市场规模 复合增长 率CAGR为9.2%，其中 2.5D/3D 集成电路封装同期 CAGR高达 16.8%，是技术 升级与需求拉动的最强赛道， 增速显著领跑行业。 全球格局双核主导，大陆厂商加速技术突围 。全球先进封装竞争格局高度集中， 呈现台陆双核心、 龙头差异化、 大陆加速追赶的鲜明特征。 据芯思想研究院统计， 2025年全球 OSAT行业 CR10中，中国台湾企业 3家、市占率 33.4%，中国大陆 企业 5家、市占率 32.6%，份额基本持平，亚洲主导地位持续强化。 2025 年全球 封测厂商表现指数显示，日月光、安靠科技、长电科技稳居前三，共同构成全球 第一梯队 。日月光以 VIPackTM3D异构集成平台构建全栈 技术壁垒，安靠在 SWIFT®扇出封装与 2.5D/3D TSV 领域优势显著，长电科技则凭借 XDFOI多维扇 出平台实现 4nm节点多芯片集成，跻身全球第一阵营。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 12 公司深度研究报告 /证券研究报告 图13: 全球六大 OSAT封测厂商 2025市场表现指数 数据来源： 深芯盟半导体产业研究 ，财通证券研究所 中国封测力量全面崛起， 产业结构持续升级 。中国大陆厂商已在全球前十大 OSAT 中稳占五席 ，以长电科技、通富微电为代表，以及盛合晶微等创新企业，正逐步 摆脱低端打线封装依赖 。通过在 XDFOI、VISionS等自主先进封装平台上的实质 性突破，本土龙头企业正加速从“规模扩张”向“质量提升”的结构性升级 。整 体来看，全球封测格局持续优化，大陆龙头依托技术突破与产能扩张，在先进封 装国产替代浪潮中占据有利位置。 2.3 宏观政策与国产替代： 先进封装成突围关键 外部管制升级， 封测环节成为国产替代的关键战略支点 。2026年美国对华半导体 管制进一步加码 ，4月众议院推出 MATCH法案，将先进封装、 HBM生产关键设 备纳入出口管制，管制范围由 EUV扩至 DUV光刻机， 并切断已售设备的全生命 周期服务，要求盟友 150天内与美方标准完全对齐，意图封堵我国先进制程升级 通道。相较于制造端承压，封测环节受直接冲击相对有限，我国已构建全球最完 整封测产业链与最大产能底座，长电科技、通富微电、华天科技等龙头稳居全球 前列。面对设备限制，国内封测企业与设备厂商联合攻关，加快键合机、塑封机、 测试机等核心设备国产替代；同时依托新能源汽车、 AI服务器、 5G基站等海量 本土应用场景，持续迭代具有中国特色的先进封装方案， 为技术突破与规模化量 产提供充足支撑 。 国内政策强力护航，大基金三期引领全链条攻坚。 2026年政府工作报告明确提出 推动集成电路产业全链条协同攻关，将自主可控上升至国家战略核心议程。国家 大基金三期加速落地，注册资本达 3440亿元，规模超前两期总和，首期资金已精 准投放；基金 70%资金定向扶持设备、材料、零部件等卡脖子环节，重点覆盖先 进封装、 AI芯片、高端制程等领域，以国家级资本撬动全产业链技术攻关。与此 同时， “专精特新” 培育计划与半导体深度绑定， 细分领域优质中小企业获得政策、 资金、市场全方位支持。整体来看， 外部管制持续施压与内部政策持续加力形成 共振，共同推动先进封装领域国产替代进入加速期 。 先进封装已成为后摩尔时代我国半导体产业实现技术突围的重要路径。 在单片集 成逼近物理极限的背景下， Chiplet与3D封装通过异构集成路径， 在成本与灵活 性上具备独特优势。 我国在先进封装领域已接近全球主流水平， 长电科技以 XDFOI®多维扇出封装平台为核心，全面覆盖 2.5D/3D、HBM、CPO等先进技术， 仅供内部参考，请勿外传", "status": "extracted"}, "post:2026-08-14T08-34:c179df541b82": {"id": "post:2026-08-14T08-34:c179df541b82", "kind": "post", "title": "2026-08-14 08:34", "source_label": "帖子正文", "excerpt": "CICC Morning Call 260814 ——宏观—— 【沃什改革下的“货币财政协同”】 沃什的新框架下，财政主导，货币配合，流动性适度宽裕，助力经济脱虚向实。——个股—— 【DIDIY.US(滴滴出行-ADR)业绩回顾】 中国出行释放利润，仍需关注巴西外卖减亏进度。", "content": "CICC Morning Call 260814 ——宏观—— 【沃什改革下的“货币财政协同”】 沃什的新框架下，财政主导，货币配合，流动性适度宽裕，助力经济脱虚向实。 ——个股—— 【DIDIY.US(滴滴出行-ADR)业绩回顾】 中国出行释放利润，仍需关注巴西外卖减亏进度。中国出行业务持续释放利润，国际业务亏损率环比收窄。维持跑赢行业评级，更改为国内出行业务的P/E估值法（给予26年国内出行业务10x P/E），下调目标价23%至4.6美元。 【00325.HK(布鲁可)业绩回顾】 1H26业绩超预期，进入全球化提速期。我们维持26/27年经调整净利润预测8.7/10.7亿元不变。当前股价对应26/27年17.6/13.9倍P/E，维持跑赢行业评级与目标价90港元，对应26/27年22.3/17.6倍P/E，有26.8%上行空间。 【DFI.SG(DFI零售集团控股有限公司)业绩回顾】 宜家和食品业务利润修复；管理层上调FY26指引。DFI零售集团子公司持续经营业务1H26收入达41亿美元，同比增长4%（同店增长3%），包括美心集团在内的总收入达56亿美元，符合...", "publish_time": "2026-08-14 08:34", "tags": ["文字观点"]}, "post:2026-08-14T22-31:2fa1cf46bf7c": {"id": "post:2026-08-14T22-31:2fa1cf46bf7c", "kind": "post", "title": "2026-08-14 22:31", "source_label": "帖子正文", "excerpt": "【东财宏观】直接融资持续向好,政府债券逐步发力——2026年7月金融数据速览 #企业股债融资上升和政府债券发力是社融同比多增的主要原因。2026年7月，国内社会融资规模增量14062亿元，同比多增2755亿元。", "content": "【东财宏观】直接融资持续向好,政府债券逐步发力——2026年7月金融数据速览 #企业股债融资上升和政府债券发力是社融同比多增的主要原因。2026年7月，国内社会融资规模增量14062亿元，同比多增2755亿元。其中，新增企业债券融资4523亿元，同比多增1775亿元；新增非金融企业境内股票融资1127亿元，同比多增622亿元；新增政府债券13204亿元，同比多增722亿元。央行二季度货币政策执行报告指出“淡化对贷款这个单一融资渠道的关注”，“债券、股票等其他渠道重要性上升”，与当前社融结构变化一致，指向科技型企业融资需求上升；7月政治局会议明确提出“加快财政支出和债券资金使用进度”，在社融数据中已有体现。 #企业短贷回升或与票据监管趋严有关。企业季末冲量行为可能从票据转向短贷：2026年7月，非金融性公司及其他部门新增人民币贷款-1300亿元，同比少增1900亿元；其中，新增短期贷款-2500亿元，同比少增3000亿元；新增中长期贷款-2300亿元，同比多增300亿元；新增票据融资3757亿元，同比少增4954亿元。居民短贷与中长贷继续处于低位：2026年7月，居民户新增人民币贷款...", "publish_time": "2026-08-14 22:31", "tags": ["文字观点"]}, "post:2026-08-14T21-07:57180575b167": {"id": "post:2026-08-14T21-07:57180575b167", "kind": "post", "title": "2026-08-14 21:07", "source_label": "帖子正文", "excerpt": "一、宏观经济：外热内冷，政策从“总量宽松”转向“机制改革” 中国经济呈现典型的K型分化。AI相关出口成为最强引擎，占出口总额约四分之一，上半年同比增长45.7%，电信制造业利润飙升96.9%", "content": "一、宏观经济：外热内冷，政策从“总量宽松”转向“机制改革” 中国经济呈现典型的K型分化。AI相关出口成为最强引擎，占出口总额约四分之一，上半年同比增长45.7%，电信制造业利润飙升96.9%；但内需依旧疲弱，7月CPI仅0.5%，核心CPI连续三个月低于1%，下游通缩压力未解。政策层面，央行货币政策框架正式从DR007转向DR001，利率走廊对称化，年内全面降准降息概率极低；但“事实降息”已在发生——企业贷款平均利率降至3.05%，超半数贷款定价低于LPR，DR001挂钩贷款试点进一步压低实际融资成本。财政政策则从传统的“减税降费”转向“收入重建”，金税四期、CRS、消费税后移等改革推进，短期可能压制部分行业利润率，但旨在重构长期财政可持续性。 二、AI产业：资本开支进入兑现期，竞争从“价格战”转向“智能战” 互联网巨头AI资本开支预计在三、四季度运行率翻倍至400-500亿元/季，腾讯单季AI相关投资可能超千亿元，自由现金流转负，但剔除AI后核心经营利润仍增长19%，市场正从担忧成本转向重估长期期权价值。算力基建需求爆发，乌兰察布数据中心容量承诺激增至12.5GW，是2025年实际运...", "publish_time": "2026-08-14 21:07", "tags": ["文字观点"]}, "attachment:files/中银证券-2026年二季度货币政策执行报告学习体会：对外保持稳定，对内积极改革-260813.pdf": {"id": "attachment:files/中银证券-2026年二季度货币政策执行报告学习体会：对外保持稳定，对内积极改革-260813.pdf", "kind": "attachment", "title": "中银证券-2026年二季度货币政策执行报告学习体会：对外保持稳定，对内积极改革-260813", "source_label": "中银证券", "excerpt": "宏观经济 |", "content": "宏观经济 | 证券研究报告 — 总量点评 2026年8月13日 相关研究报告 《7月通胀点评》 20260810 《策略周报》 20260809 《新航道接近达成、 黄金获双重支撑》 20260808 中银国际证券股份有限公司 具备证券投资咨询业务资格 宏观经济 证券分析师：张晓娇 xiaojiao.zhang@bocichina.com 证券投资咨询业务证书编号： S1300514010002 证券分析师：朱启兵 (8610)66229359 Qibing.Zhu@bocichina.com 证券投资咨询业务证书编号： S1300516090001 2026年二季度货币政策执 行报告学习体会 对外保持稳定，对内积极改革 2026年下半年关注货币政策“改革”和“创新” 。  变换的外部环境，不变的应对策略。  从对外货币政策来看， 2026年二季度货币政策执行报告 中，关于汇率的表述与一季度货币 政策执行报告保持一致 。这种表述完全不变的情况，在货币政策执行报告中比较少，但不 是没有。比如 2026年一季度货币政策执行报告中关于防风险的表述内容，就与 2025年四 季度货币政策执行报告是相同的。  我们认为 背后或有两个原因：一是 ，6月末人民币对美元汇率收盘价较上年末升值 3.0%， 中国外汇交易中心人民币汇率指数，较上年末升值 4.7%，2026年上半年外汇市场供求基本 平稳，人民币汇率在合理均衡水平上保持基本稳定 ，表明目前的汇率政策是行 之有效的； 二是央行对当前人民币汇率的整体水平和运行状态比较满意，认为政策短期无需调整。  但另一方面，二季度货币政策执行报告对外部环境的判断发生了明显变化： 一是，对外部 环境的判断从一季度的 “影响加深 ”变成二季度的 “更加复杂多变 ”，特别是一季度仅提及 “地 缘政治风险 ”，二季度还提到了 “经贸摩擦多发频发 ”；二是，对全球通胀的判断发生变化， 强调“全球通胀水平有所抬升 ”；三是，对海外央行的货币政策预期有所调整，从一季度的 “各 国央行货币政策调整存在不确定性 ”，变为二季度的 “主要经济体央行货币政策趋向调整 ”， 这一点在 “专栏 5 海外主要经济体货币政策调整动态 ”中有详细表述。  我们认为从货币政策执行报告表述看，下半年海外的挑战是通胀水平抬升、经贸摩擦增加 为主，同时预防海外央行加息对新兴经济体以及全球债市利率抬升、股市流动性收紧可能 产生的外溢性影响。  国内方面，支持经济高质量发展和金融市场平稳运行是货币政策关注重点：  一是，货币政策执行报告对内资经济增长的信心较强，相较于一季度报告中提到的“持续 稳中向好的基础还需进一步巩固”，二季度报告提出“我国经济高质量发展取得新成效， 后劲持续增强”；  二是，货币政策的态度更加积极，相较于一季度 的“精准有效实施适度宽松的货币政策”， 二季度新增表述“充分发挥各项存量政策效能，及时谋划出台务实管用的增量政策，加大 逆周期调节力度”；  三是，货币政策可能调整，相较于一季度的“灵活运用多种货币政策工具”，二季度报告 提出“综合运用并适时调整货币政策工具”，同时较一季度删掉了“引导金融总量合理增 长、信贷均衡投放”的表述，我们认为未来货币投放量增速数据的重要性或下降；  四是，央行或继续大力打造围绕政策利率运行的利率曲线，一季度货币政策执行报告中的 提法是“强化央行政策利率引导，完善市场化利率形成传导机制”，二季度报 告中的表述 明显更加积极明确，“更好引导货币市场短端利率围绕政策利率平稳运行”；  五是，在金融机构经营方面，二季度货币政策执行报告中有两处变化，删除的是“降低银 行负债成本”，更加强调的是“降低融资中间费用”；  六是，在货币政策作用方面，一季度强调的是“用好”和“优化”，二季度更加强调“落 实”和“完善”，在风险方面内容中，还新增了“创新金融工具”的表述。  五个专栏，五个方向。专栏 1 全面把握金融支持实体经济的力度和效果，主要针对的是实 体经济融资渠道的边际变化；专栏 2 完善短端利率调控机制，通过优化临时正 /逆回购工具 的使用机制、增加隔夜逆回购操作品种等方式，增强政策利率的权威性；专栏 3 设立民营 企业再贷款支持民营经济发展，主要解决面向实体经济融资有效性问题；专栏 4 建立银行 间市场数据报告库，是完善宏观审慎管理的重要一环；专栏 5 海外主要经济体货币政策调 整动态，既是我国货币政策前瞻性的体现，也是防范外部风险的举措 。  我们认为 下一阶段货币政策的重要任务是改革。  二季度我国货币政策所做的调整包括：发布《关于调整银行业金融机构境外贷款业务有关 事宜的通知》；联合发改委、财政部印发《关于扩大科技创新和技术改造贷款投放 进一步 支持设备更新的通知》；首次在公开市场操作中增加隔夜逆回购操作品种，将临时正、逆 回购操作区间宽度由 70个基点收窄至 50个基点；通过境外央行类机构回购工具，向符合 条件的境外央行类机构提供人民币流动性。  从货币政策运行结果看：货币市场隔夜利率 DR001前6个月均值为 1.31%，总体运行平稳； 6月新发放企业贷款利率约为 3.0%，较上年同期低约 20个基点；新发放个人住房贷款利率 约为 3.1%，与上年同期基本持平； 6 月末科技贷款、绿色贷款、普惠贷款、养老产业贷款、 数字经济产业贷款同比持续高于全部贷款增速。  我们认为传统的货币政策工具，特别是总量货币政策工具的运用受到政策空间和外部环境 的双重影响。下一阶段货币政策工具改革可能从三方面入手：一是加大货币政策工具在结 构上的调整，特别是利率工具的使用和完善，二是扩大创新工具的使用范围和规模，在货 币供应量增速趋势性下行的同时作为实体经济融资的补充，三是在国际外汇市场波动性和 不确定性加大的背景下，以稳定的币值、强劲的基本面和确定的国际贸易政策导向，推进 人民币在国际化进程中从交易货币向储备货币积极转变。  风险提示：全球通胀二次上行；全球经济增长动能减弱；地缘政治局势发展前景的不 确定性。 下载日志已记录，仅供内部参考 2026年8月13日 2026年二季度货币政策执行报告学习体会 2 图表 1. 2026年二季度货币政策执行报告下一阶段工作重点及专栏内容与 2026年一季度货币政策执行报告对比 2026年二季度货币政策执行报告 2026年一季度货币政策执行报告 宏 观 形 势 判 断 当前外部环境 更加复杂多变 ，世界经济增长动能疲弱， 地缘冲 突和经贸摩擦多发频发 ，供给冲击和输入型通胀压力 影响仍在 持续，全球通胀水平有所抬升 ，主要经济体央行货币政策趋向 调整。我国经济高质量发展 取得新成效，后劲持续增强 ，经济 长期向好的 内在支撑更加坚实 ，制度优势和大国优势不断彰显， 要坚定信心， 保持高质量发展战略定力，切实巩固拓展经济稳 中向好态势 。 当前外部环境变化影响加深， 世界经济增长动能 疲弱，地缘政治 风险持续上升，供给冲击和输入型通胀压力有所显现 ，主要经 济体经济表现分化 ，各国央行货币政策调整存在不确定性 。我 国经济高质量发展向新向优，但持续稳中向好的基础还需进一 步巩固。 同时， 我国经济长期向好的支撑条件和基本趋势没有变， 制度优势和大国优势不断彰显 ，要坚定信心， 用足用好优势， 沉着应对各种风险挑战 ，着力提升经济韧性、夯实发展基础 。 坚持稳中求进工作总基调，完整准确全面贯彻新发展理念， 充分 发挥各项存量政策效能，及时谋划出台务实管用的增量政策， 加大逆周期调节力度 ，加力扩大内需、优化供给， 推动经济持 续向新向优向好发展 。坚定不移走中国特色金融发展之路，进 一步深化金融改革和高水平对外开放，加快建设金融强国，完善 中央银行制度， 构建科学稳健的货币政策体系和覆盖全面的宏观 审慎管理体系，畅通货币政策传导机制。 坚持稳中求进工作总基调，完整准确全面贯彻新发展理念， 加快 构建新发展格局， 更好统筹国内国际两个大局，精准有效实施 适度宽松的货币政策 ，着力扩大内需、优化供给， 做优增量、 盘活存量 ，增强经济发展内生动力 ，不断巩固拓展经济稳中向 好势头。坚定不移走中国特色金融发展之路，进一步深化金融改 革和高水平对外开放，加快建设金融强国，完善中央银行制度， 构建科学稳健的货币政策体系和覆盖全面的宏观审慎管理体系， 畅通货币政策传导机制。 下 一 阶 段 重 点 工 作 继续实施好适度宽松的货币政策。 继续实施好适度宽松的货币政策。 增强政策前瞻性灵活性针对性， 根据国内外经济金融形势和金融 市场运行情况，把握好政策实施的力度、节奏和时机，加强与财 政政策协同配合， 支持经济稳定增长、高质量发展和金融市场 平稳运行 。 增强政策前瞻性灵活性针对性 ，根据国内外经济金融形势和金 融市场运行情况，把握好政策实施的力度、节奏和时机， 加强货 币财政政策协同配合 ，畅通货币政策传导机制，促进经济稳定 增长和物价合理回升。 综合运用并适时调整货币政策工具 ，保持流动性充裕和社会融 资条件相对宽松，引导社会融资规模、货币供应量增长同经济增 长、价格总水平预期目标相匹配。 灵活运用多种货币政策工具 ，保持流动性充裕和社会融资条件 相对宽松，引导 金融总量合理增长、信贷均衡投放 ，使社会融资 规模、 货币供应量增长同经济增长、 价格总水平预期目标相匹配。 平稳有序推动货币政策操作框架改革完善，更好引导货币市场 短端利率围绕政策利率平稳运行 。发挥市场利率定价自律机制 作用，加强利率政策执行和监督， 推动贷款定价基准多元化 ， 引导金融机构提高利率定价能力， 持续深化明示企业贷款综合融 资成本工作， 降低融资中间费用 ，促进社会综合融资成本低位 运行。 进一步完善利率调控框架， 强化央行政策利率引导，完善市场化 利率形成传导机制 ，发挥市场利率定价自律机制作用，加强利率 政策执行和监督， 降低银行负债成本 ，引导金融机构提高利率 定价能力 ，促进社会综合融资成本低位运行。 轮业务 （2021年至今）： 2021年，公司更名 “三峡旅游 ”，通过定增募资约 8 亿元引入三峡资本、同程旅行， 公司战略重心由交通运输全面转向旅游产业，且 资金重点投向省 际度假游轮项目 ；同年 “长江传奇 ”号启航，实现品牌异地输出。 2023年，公司剥离乘用车经销与 供应链等非核心业务，旅游主业更加纯粹 ；2025年，公司更新 省际游轮 可研报告， 4艘宜渝航线 游轮投资总额由 10.37亿增至 10.63亿元。2026年4月，首艘 “长江行 ·揽月”投运，第二艘 “极光”8 月投运，其余两艘计划 2028年交付，向 “中国内河游轮 旅游领航者 ”目标迈进。 仅供内部参考，请勿外传 三峡旅游首次报告 —— 峡江之上，游轮新生 有关分析师的申明，见本报告最后部分。其他重要信息披露见分析师申明之后部分，或请与您的投资代表联系。并请阅读本证券研究报告最后一页的免责申明。 6 管理层分析：背依宜昌 市国资委，高管团队年富力强 宜昌市国资委为实际控制人。 公司系湖北宜昌市上市旅游公司，截至 2026年7月，第一大股东 湖北三峡文化旅游集团持股 占比 26.08 %，实际控制人宜昌市国资委累计持股占比 35.18%。公司 第一大股东为 湖北三峡文化旅游集团 ，有助于依托股东在文旅资源、项目获取及产业运营方面的 积累，进一步完善区域文旅产业链布局；实际控制人为宜昌市国资委，地方国企背景使其在区域 文旅资源统筹、项目协调、融资支持及政企合作等方面具备较强优势。 控股股东充分支持上市公司战略聚焦 。2026年7月，公司将三峡九凤谷景区运营主体 100%股权， 以评估价 4576.11 万元转让给控股股东湖北三峡文化旅游集团。本次关联交易体现控股股东对上 市公司转型战略的强力支持：九凤谷近年持续亏损，控股股东作为市级国资平台承接低效景区资 产，帮助上市公司卸下亏损包袱，回笼资金可补充流 动资金，集中资源投入两坝一峡短线游船、 长江行省际度假游轮核心主业。 图2：宜昌市人民政府是实际控制人 数据来源：公司公告，东方证券研究；截至 2026年7月30日 高管团队由国资体系人才与内部深耕航运运营骨干组成 。上层战略管理者来自宜昌国资平台，拥 有资源整合与政企对接能力，便于获得股东层面支持；一线经营管理层为公司长期内生培养，深 度熟悉长江内河游船运营、水陆联运业务模式。团队完整见证公司由传统交通企业向游轮运营商 转型，战略目标高度统一，持续推进非核心资产剥离、集中资源布局省际度假游轮；管理层兼具 重资产项目运营、内河航运、旅游客流运营复合视野，能够充分发挥宜昌三峡门户水陆联动资源 优势。 仅供内部参考，请勿外传 三峡旅游首次报告 —— 峡江之上，游轮新生 有关分析师的申明，见本报告最后部分。其他重要信息披露见分析师申明之后部分，或请与您的投资代表联系。并请阅读本证券研究报告最后一页的免责申明。 7 表1：公司管理层成员 年富力强 姓名 职务 任职日期 年龄 工作经历 李根 总经理 2025/6/3 43 曾任宜昌交通旅游产业发展集团战略投资部部长，现任湖北三峡文化旅游集团党 委委员、湖北三峡旅游集团董事、总经理，具备文旅项目投资及企业经营管理经 验 胡军红 董事会秘书 2011/6/19 55 曾任公司副董事长、董事、副总经理及财务总监，现任公司董事会秘书，具备丰 富的文旅企业经营、财务管理及资本运作经验。 叶勇 副总经理 2025/1/21 55 曾任公司旅游发展事业部总经理、宜昌交运三峡游轮总经理及宜昌交运长江游轮 董事长、总经理，现任公司党委委员、副总经理，分管战略投资及旅游产业项目 拓展，具备丰富的游轮运营与文旅项目管理经验。 陈晶晶 副总经理 2022/11/14 42 曾任公司审计与风险管理部部长、计划财务部部长 、财务总监 ，现任公司党委委 员、董事、副总经理，具备丰富的财务管理及风险控制经验。 郦鸿 副总经理、 安全总监 2022/11/14 43 曾任公司道路客运事业部副总经理，现任公司党委委员、副总经理，曾长期从事 道路客运经营管理，具备较丰富的交通运营及安全管理经验。 鲁建国 财务总监 2026/8/3 41 曾任宜昌交旅集团计划财务部部长、党委委员及财务总监，后任湖北三峡文化旅 游集团财务总监，并曾挂职宜昌市国资委产权管理科，具备较丰富的国有文旅企 业财务管理和资本运营经验。 数据来源： choice，东方证券研究；注：数据截至 2026年8月10日 产品策略：“两坝一峡”产品核心独占，切入省际游轮业务 游轮产品矩阵由区域观光向省际度假延伸。 公司游轮旅游产品主要包括观光游轮与省际度假游轮 两类，并依托旅游港口、旅游客运及旅行社等配套资源，形成“船、港、车、社”协同的经营模 式。其中，观光游轮以“两坝一峡”为核心，串联葛 足，客户关系也已经打开； 4. 后续 AMD/HW 放量以及进入 Google/Meta 等客户的预期都是看点。 作为 PCB 产业链最大黑马，继续坚定看好！#前瞻胜率看国联民生电子！#文字观点", "publish_time": "2026-08-14 14:40", "tags": ["前瞻胜率看国联民生电子", "文字观点"]}, "attachment:files/万联证券-策略快评报告：创业板再添三条新质生产力主题指数-260813.pdf": {"id": "attachment:files/万联证券-策略快评报告：创业板再添三条新质生产力主题指数-260813.pdf", "kind": "attachment", "title": "万联证券-策略快评报告：创业板再添三条新质生产力主题指数-260813", "source_label": "万联证券", "excerpt": "", "content": "证券研究报告：基础化工|行业周报 市场有风险，投资需谨慎 请务必阅读正文之后的免责条款部分行业投资评级 强于大市|维持 行业基本情况 收盘点位 4465.24 52周最高 5235.06 52周最低 3827.97 行业相对指数表现 2025-082025-102026-012026-032026-052026-08-1%3%7%11%15%19%23%27%31%35% 基础化工 沪深300 资料来源：聚源，中邮证券研究所 研究所 分析师:刘海荣 SAC登记编号:S1340525120006 Email:liuhairong@cnpsec.com 分析师:费晨洪 SAC登记编号:S1340525120003 Email:feichenhong@cnpsec.com 分析师:李家豪 SAC登记编号:S1340525120005 Email:lijiahao@cnpsec.com 分析师:刘隆基 SAC登记编号:S1340525120002 Email:liulongji@cnpsec.com 分析师:李金凤 SAC登记编号:S1340525120004 Email:lijinfeng@cnpsec.com 近期研究报告 《本周化工品纺织化学制品、涤纶、 民爆制品、复合肥、粘胶涨幅居前》 -2026.08.06化工行业报告（2026.08.03-2026.08.09） 本周溴素、硫磺、异丁醛涨幅居前，极端气候冲击 欧洲能化产业 l本周化工行情概述 本周基础化工行业指数收4391.41点，较上周五上涨6.77%；本 周化工行业指数跑赢沪深300指数4.45%。分子行业看，截至本周五 （8月7日），申万化工三级分类中24个子行业收涨，1个子行业收 跌。其中，膜材料、合成树脂、涂料油墨、氟化工、无机盐行业领涨、 周涨幅分别为19.25%、18.52%、17.04%、15.74%、14.03%;钛白粉行 业走跌，周跌幅为-0.52%。 l极端气候冲击欧洲能化产业 近期，欧洲持续高温干旱天气，致使多瑙河、莱茵河两大经济命 脉河道水位跌至历史低位。两河河床大面积裸露，内河航运全面受阻， 沿线核电站因冷却水供给不足被迫停机、限产，莱茵河沿岸一众头部 化工企业也因原材料运输中断，陆续启动减产措施。从匈牙利保克什 核电站濒临停机，到德国巴斯夫核心工厂受限停产，这场极端天气引 发的生态危机，已通过电价暴涨、原料断供、产能收缩等连锁反应， 全面冲击欧洲能源安全体系与化工产业根基，电力供给缺口率先引发 区域连锁波动。匈牙利保克什核电站运行受限、产能近乎停滞，该国 只能紧急加大从斯洛伐克、奥地利等周边国家的电力进口力度，直接 推高了欧洲区域电力批发行情。罗马尼亚随即启动能源警戒机制，电 力出口能力大幅缩减，进一步加剧了巴尔干地区的电力供需紧张态 势。与此同时，塞尔维亚、奥地利相继出现电力短缺问题，让整个欧 洲中部及巴尔干区域的电力调度调配难度大幅提升。化工行业的原料 供应链危机，正从德国沿河核心工厂逐步向外扩散。巴斯夫、科思创 等欧洲化工龙头纷纷调整生产节奏，直接导致欧洲化工产业链基础原 料供应承压。乙烯、丙烯、苯等大宗化工品高度依赖莱茵河驳船运输， 当前河道航运运力大幅锐减，造成德国本土化工中间体供应持续收 紧。德国化学工业协会预警，若河道低水位现状持续，欧洲各类化工 产品或将迎来全面涨价，并进一步传导至汽车、建筑、制药等全下游 产业。2018年莱茵河干旱灾害曾造成德国化工行业数十亿欧元的经 济损失，而本次极端天气引发的危机程度，已远超2018年同期水平。 更为严峻的是供应链积压带来的持续性累积影响。莱茵河承担着德国 约80%的内河货运任务，德国进口的大量化工原料、能源物资均依靠 这条水道运输。目前河道实际通航运力仅剩正常水平的两成，即便未 来数周水位回升、航运恢复正常，前期积压的海量货物也需要漫长周 期才能完全消化，供应链修复周期大幅拉长。 l风险提示： 原材料价格大幅波动、产能建设进度不及预期、贸易摩擦加剧、 宏观经济增长不及预期等风险。发布时间：2026-08-13 请务必阅读正文之后的免责条款部分 2目录 1本周化工板块行情回顾.......................................................................7 1.1化工板块行情：本周基础化工行业指数收4391.41点，较上周+6.77%，跑赢沪深300指数4.45%...7 1.2化工产品价格涨跌幅排行榜：溴素、硫磺、异丁醛、维生素VE涨幅居前........................8 2重点化工子行业跟踪........................................................................10 2.1涤纶长丝：本周市场价格小幅下跌........................................................10 2.2轮胎：橡胶价格环比上涨................................................................11 2.3制冷剂：市场价格维持偏强运行..........................................................13 2.4MDI：本周MDI市场价格坚挺运行.........................................................15 2.5PC：市场价格高位窄幅震荡运行..........................................................16 2.6纯碱：碱企开启检修降负，纯碱市场价格继续向下寻底......................................17 2.7化肥：秋肥需求尚待启动，价格存在博弈情绪..............................................19 3本周化工品价格走势（截至2026/8/7）.......................................................25 3.1主要石化产品价格走势（截至2026/8/7）.................................................25 3.2主要化纤产品价格走势（截至2026/8/7）.................................................27 3.3主要农化产品价格走势（截至2026/8/7）.................................................29 3.4纯碱、氯碱、钛白粉产品价格走势（截至2026/8/7）.......................................31 3.5主要煤化工产品价格走势（截至2026/8/7）...............................................32 3.6主要硅基产品价格走势（截至2026/8/7）.................................................33 3.7主要食品添加剂产品价格走势（截至2026/8/7）...........................................34 4风险提示..................................................................................35 请务必阅读正文之后的免责条款部分 3图表目录 图表1：本周上证指数收3940.04点，较上周+2.81%..........................................6 图表2：本周基础化工行业指数收4391.41点，较上周+6.77%..................................6 图表3：基础化工各子行业近一周涨幅（截至20260807）......................................7 图表4：基础化工各子行业近一年涨幅（截至20260807）......................................7 图表5：本周化工板块股价涨幅前10上市公司........ 上周五上涨6.77%；本 周化工行业指数跑赢沪深300指数4.45%。分子行业看，截至本周五 （8月7日），申万化工三级分类中24个子行业收涨，1个子行业收 跌。其中，膜材料、合成树脂、涂料油墨、氟化工、无机盐行业领涨、 周涨幅分别为19.25%、18.52%、17.04%、15.74%、14.03%;钛白粉行 业走跌，周跌幅为-0.52%。 l极端气候冲击欧洲能化产业 近期，欧洲持续高温干旱天气，致使多瑙河、莱茵河两大经济命 脉河道水位跌至历史低位。两河河床大面积裸露，内河航运全面受阻， 沿线核电站因冷却水供给不足被迫停机、限产，莱茵河沿岸一众头部 化工企业也因原材料运输中断，陆续启动减产措施。从匈牙利保克什 核电站濒临停机，到德国巴斯夫核心工厂受限停产，这场极端天气引 发的生态危机，已通过电价暴涨、原料断供、产能收缩等连锁反应， 全面冲击欧洲能源安全体系与化工产业根基，电力供给缺口率先引发 区域连锁波动。匈牙利保克什核电站运行受限、产能近乎停滞，该国 只能紧急加大从斯洛伐克、奥地利等周边国家的电力进口力度，直接 推高了欧洲区域电力批发行情。罗马尼亚随即启动能源警戒机制，电 力出口能力大幅缩减，进一步加剧了巴尔干地区的电力供需紧张态 势。与此同时，塞尔维亚、奥地利相继出现电力短缺问题，让整个欧 洲中部及巴尔干区域的电力调度调配难度大幅提升。化工行业的原料 供应链危机，正从德国沿河核心工厂逐步向外扩散。巴斯夫、科思创 等欧洲化工龙头纷纷调整生产节奏，直接导致欧洲化工产业链基础原 料供应承压。乙烯、丙烯、苯等大宗化工品高度依赖莱茵河驳船运输， 当前河道航运运力大幅锐减，造成德国本土化工中间体供应持续收 紧。德国化学工业协会预警，若河道低水位现状持续，欧洲各类化工 产品或将迎来全面涨价，并进一步传导至汽车、建筑、制药等全下游 产业。2018年莱茵河干旱灾害曾造成德国化工行业数十亿欧元的经 济损失，而本次极端天气引发的危机程度，已远超2018年同期水平。 更为严峻的是供应链积压带来的持续性累积影响。莱茵河承担着德国 约80%的内河货运任务，德国进口的大量化工原料、能源物资均依靠 这条水道运输。目前河道实际通航运力仅剩正常水平的两成，即便未 来数周水位回升、航运恢复正常，前期积压的海量货物也需要漫长周 期才能完全消化，供应链修复周期大幅拉长。 l风险提示： 原材料价格大幅波动、产能建设进度不及预期、贸易摩擦加剧、 宏观经济增长不及预期等风险。发布时间：2026-08-13 请务必阅读正文之后的免责条款部分 2目录 1本周化工板块行情回顾.......................................................................7 1.1化工板块行情：本周基础化工行业指数收4391.41点，较上周+6.77%，跑赢沪深300指数4.45%...7 1.2化工产品价格涨跌幅排行榜：溴素、硫磺、异丁醛、维生素VE涨幅居前........................8 2重点化工子行业跟踪........................................................................10 2.1涤纶长丝：本周市场价格小幅下跌........................................................10 2.2轮胎：橡胶价格环比上涨................................................................11 2.3制冷剂：市场价格维持偏强运行..........................................................13 2.4MDI：本周MDI市场价格坚挺运行.........................................................15 2.5PC：市场价格高位窄幅震荡运行..........................................................16 2.6纯碱：碱企开启检修降负，纯碱市场价格继续向下寻底......................................17 2.7化肥：秋肥需求尚待启动，价格存在博弈情绪..............................................19 3本周化工品价格走势（截至2026/8/7）.......................................................25 3.1主要石化产品价格走势（截至2026/8/7 9", "kind": "post", "title": "2026-08-14 10:47", "source_label": "帖子正文", "excerpt": "英伟达关于激光器数量下降4倍的口径，我们倾向于理解为相较于同等容量的电交换机中光模块使用的EML激光器数量下降4倍。比如：以Spextrum 102.4T容量来看，对应了128颗高功率激光器。", "content": "英伟达关于激光器数量下降4倍的口径，我们倾向于理解为相较于同等容量的电交换机中光模块使用的EML激光器数量下降4倍。 比如：以Spextrum 102.4T容量来看，对应了128颗高功率激光器。而对于102.4T的电交换机来说，正常会配置64颗1.6T光模块。如果64颗1.6T都使用EML激光器，则需要512颗200G EML。因此Spectrum CPO相较于上述的EML版本的激光器数量确实可以认为是下降了4倍。 而如果以普通1.6T硅光光模块来看，正常会配置2颗 100 mW或者4颗 70 mW，从数量上看也就是下降2倍甚至不下降。 从价值量上来看，单颗高功率激光器的价值量是普通cW激光器的10倍，整体市场空间一定是大幅提升。#文字观点", "publish_time": "2026-08-14 10:47", "tags": ["文字观点"]}, "post:2026-08-14T11-50:451a4f08c886": {"id": "post:2026-08-14T11-50:451a4f08c886", "kind": "post", "title": "2026-08-14 11:50", "source_label": "帖子正文", "excerpt": "天风通信 | 更新和推荐：#重申跌出的分歧和黄金坑！1、观点：AI长期叙事和FCC制裁的担忧已消化相对充分，市场筹码做了再均衡，而光互联头部厂商位置/估值处于低位。", "content": "天风通信 | 更新和推荐：#重申跌出的分歧和黄金坑！1、观点：AI长期叙事和FCC制裁的担忧已消化相对充分，市场筹码做了再均衡，而光互联头部厂商位置/估值处于低位。 北美AI硬件已经开始进入财报陆续披露窗口，观察股价也是正反馈阶段，我们判断随着8月底旭创/英伟达/Marell/博通等硬件龙头公司披露财报和指引，#月底有望迎来中美AI硬件的共振行情。2、光互联：#Scale-across、scale-out、scale-up再到未来scale-in，光互联不断有增量应用场景，同时内生盈利能力持续提升显著抗通缩属性。#格局：从关键物料锁定和新技术迭代看，格局会呈现强者恒强，#未来轻相干、硅光调制、薄膜铌酸锂、先进封装等核心技术，会持续构筑行业高门槛。 #短期，Rubin上修拉动1.6T光模块显著上修，同时NPO明年开始明确放量；#中长期：2.4T、3.2T、XPO、Scale-in等新技术含量更高的产品打开更大市场空间。 #重点推荐:旭创、新易盛、天孚、东山、剑桥、源杰、永鼎、华懋、光库、长光等 3、个股更新：#源杰科技：最新扩产公告，测算产能对应70和100mw光源近3亿颗，换算...", "publish_time": "2026-08-14 11:50", "tags": ["重申跌出的分歧和黄金坑", "月底有望迎来中美AI硬件的共振行情", "格局", "源杰科技", "永鼎股份", "文字观点"]}, "post:2026-08-14T11-11:b88f33c7e359": {"id": "post:2026-08-14T11-11:b88f33c7e359", "kind": "post", "title": "2026-08-14 11:11", "source_label": "帖子正文", "excerpt": "💡从每个通道一颗 EML，到 4 个通道共享一个 CW，所以是减少四倍📝“从每个通道一颗 EML，到 4 个通道共享一个 CW，减少四倍” 这一说法，主要反映的是光模块 / 光互连架构升级带来的激光器数量减少，但 “减少四倍” 仅是对数量变化的直观描述，其背后涉及技术路线、成本结构和系统架构的深刻变", "content": "💡从每个通道一颗 EML，到 4 个通道共享一个 CW，所以是减少四倍📝“从每个通道一颗 EML，到 4 个通道共享一个 CW，减少四倍” 这一说法，主要反映的是光模块 / 光互连架构升级带来的激光器数量减少，但 “减少四倍” 仅是对数量变化的直观描述，其背后涉及技术路线、成本结构和系统架构的深刻变化。 🔍具体分析如下： 1️⃣数量减少的逻辑（为什么是 “减少四倍”）🔹传统 EML 方案：EML（电吸收调制激光器）是 “发光 + 调制” 一体化芯片，每个通道（如 800G 光模块的 8 个通道）需要独立配置一颗 EML，即“1 通道：1 激光器”。 🔹硅光 + CW 方案：CW（连续波激光器）是 “纯发光” 光源，配合硅光芯片（负责调制）使用。通过分光技术，一颗大功率 CW 激光器可以同时为多个通道（如 4 个通道）供光，即“4 通道：1 激光器”。 🔹数量对比：在实现相同总带宽（如 400G）的情况下，共享方案所需的激光器数量减少为原来的四分之一，即“减少四倍”。 2️⃣数量减少背后的实质（架构与成本重构）🔹成本重构：EML 工艺复杂（需单片集成 DFB 激光器和 EAM 调制器），...", "publish_time": "2026-08-14 11:11", "tags": ["文字观点"]}, "attachment:files/天孚通信CPO专家交流纪要202608.pdf": {"id": "attachment:files/天孚通信CPO专家交流纪要202608.pdf", "kind": "attachment", "title": "天孚通信CPO专家交流纪要202608", "source_label": "其他", "excerpt": "SNDK: Can It Do $600?Stress-testing the analyst-day framework against the Street — and what returning 100% of FCF actually buys August 13, 2026 · SNDK ~$1,545 intraday (+14% on the", "content": "SNDK: Can It Do $600? Stress-testing the analyst-day framework against the Street — and what returning 100% of FCF actually buys August 13, 2026 · SNDK ~$1,545 intraday (+14% on the analyst day) · Scenario math run at $1,500 ≈ $233B market cap on 155m diluted shares All figures non-GAAP/adjusted. FY ends late June; CY estimates = average of the two straddling FYs. 1. Bottom line Yes on $600 — with a precise meaning. CY30 EPS of ~$600 is not a heroic add-on to the analyst-day framework; it is approximately what the framework mechanically produces once you take management’s FY28–30 model at face value (mid-to-high-teens revenue growth, ~80% gross margin, ~75% operating margin, ~50% adjusted-FCF margin) and deploy 100% of the cash into the stock. Across buyback price paths, framework CY30 EPS spans roughly $470 (the stock re-rates to a constant 10x while buying) to $790 (the stock never moves off $1,500 while 100% of FCF is deployed). Your $600 lands near the middle: it is the case where repurchases are executed at an average of roughly $2,000/share over the window — i.e., the stock keeps trading around 5–6x forward earnings, about where it trades today. The arithmetic is not the question. The FY29–31 NAND price assumption is. What \"100% of FCF\" means in size. On the company’s own ~50%-of-revenue FCF framework, that is ~$24B in FY27 rising to ~$38B by FY30 — 10.5% of today’s market cap retired in year one, scaling to ~16% a year by FY30. Cumulative FY27–FY30 capital return is ~$124B on the framework and ~$141B on street estimates: 53–61% of the entire current market cap. Your \"50% of the cap back in cash\" is right and, if anything, conservative — through FY31 the framework figure is ~72%. The share count goes from 155m to ~100m by FY30 if the stock re-rates alongside earnings (constant ~7x), or ~72m if it somehow sits at $1,500. CY27 $280–300 checks out, with one asterisk. Street CY27 is ~$235 (average of FY27 $211 and FY28 $259). The buyback alone — which street barely models (~$9–12B/yr of financing outflow against $24–30B of FCF) — carries mechanical CY27 to ~$255–270. The last $15–30 requires FY27/28 to keep running above the long-term model, which they currently are: the June quarter exited at 84.6% GM versus the ~80% framework, and street FY27 GM is ~84%. Reasonable, not heroic. The whole stock is one assumption. Management and the street agree on bits (mid-to-high-teens growth; FY29 bit growth consistent with FY28). Street FY30 revenue of $35B versus the framework’s ~$76B is therefore almost entirely an ASP call: the street prices a classic NAND mean reversion into FY29–31; the analyst day is management asserting that NBM floors, retired industry capacity, and an AI-reset TAM prevent it. 2. What the analyst day actually committed to The long-term model slide is explicit and covers FY28–FY30 average performance: revenue growth mid-to-high teens, non-GAAP gross margin ~80%, operating margin ~75%, adjusted FCF margin ~50% of revenue, and capital intensity of mid-single-digit % of revenue. Capital allocation is a three-step ladder — fund the business, keep a no-debt balance sheet, then return 100% of excess cash — on top of the $14B repurchase authorization announced with FY26 results last week. The margin-durability argument runs through the NBMs: eight datacenter-centric customers (three US hyperscalers; two have already expanded), ~50% of FY27 bits and ~two-thirds of FY28 bits under committed month-by-month volume/mix/price terms with floors and ceilings, average weighted contract length 4+ years. Total contract value at floor pricing is $93.9B and RPO is $91.1B, backed by $16.5B of financial guarantees — with management expecting realization above floor. The supply side: industry wafer capacity sits ~30% below the CY22 peak (~560 kwpm retired), utilization is ~100%, and bit growth comes from node migration rather than new wafers, which is what underwrites the capital-intensity claim (BiCS roadmap; Kioxia JV extended through 2034, 33% of world NAND wafer output). The demand claim is the aggressive one: a flash TAM that averaged ~$60B historically resetting to >$300B in CY26 and approaching $500B in CY27, with datacenter now the largest swimlane. FY26 exit rates back the near term: June- quarter revenue annualized $36B, GM 84.6%, adjusted FCF annualized ~$20B. Consensus already lives in this world through FY28 (FY27 +141% to $48.9B at ~84% GM; FY28 +20%), then models the cycle ending: FY29 −17%, FY30 −28%, GM fading to 75% — and, crucially, the cash piling up to ~$100B on the balance sheet by FY29 rather than being returned. Two caveats on that benchmark: out-year \"consensus\" is thin (some FY30 lines carry 1–3 estimates) and the line items are not internally consistent (gross profit vs. GM%, CFO vs. FCF), so treat street FY29–30 as a sketch of the prior, not a precise bar. FY28–30 metric Analyst-day framework (avg) Street (BBG): FY28 / FY29 / FY30 Revenue growth Mid-to-high teens per year +20% / −17% / −28% Non-GAAP gross margin ~80% 83.8% / 81.4% / 75.0% Non-GAAP operating margin ~75% 78.5% / 70.1% / 64.7% Adjusted FCF margin ~50% of revenue 66% / 78% / 98% (WC release) Capital intensity Mid-single-digit % of revenue ~1% (capex line only) Capital return 100% of excess cash ~$9–12B/yr modeled Cash balance by FY29 n/a — returned ~$100B accumulates Framework case: FY27 = street; FY28–31 at +16%/yr (mid-to-high-teens midpoint). Street FY31 not published. 3. The $600 math Model mechanics: FY27 uses street operating estimates (which already sit above the long-term model); FY28–31 revenue compounds at +16%, gross margin glides 84% → 80%, opex runs 5% of revenue (~75% opera Ɵng margin), tax 13.5%, and adjusted FCF equals 50% of revenue per the company framework — all of it repurchased. The buyback price path is the free parameter, and it is doing real work: CY EPS ($) CY26 CY27 CY28 CY29 CY30 Street (implied CY) 141 235 222 164 n/a Framework, no buyback 143 229 261 299 345 Framework, buybacks @ constant 10x 147 247 304 375 467 Framework, buybacks @ constant 7x 149 256 324 414 533 Framework, buybacks @ constant 5x 151 267 354 471 634 Framework, buybacks @ flat $1,500 149 259 345 489 787 Buyside (your numbers) — 280–300 — — ~600 Solving for $600 exactly: a constant average repurchase price of ~$2,000 gets CY30 to $591; $1,500 flat overshoots to $787; $2,500 lands $516; $3,000 lands $476. Three observations worth carrying into the debate. First, the decomposition is clean: $300 → $600 over three calendar years is +26% a year, which splits into ~15–16%/yr net-income growth (revenue at +16% with margins roughly flat near 80%) times ~8–9%/yr share retirement — nothing in the bridge requires margin expansion from here. Second, under a constant-multiple buyback the outcome is surprisingly insensitive to gross margin (75% vs. 85% terminal GM moves CY30 by only ~$50–90, because higher profits also raise the repurchase price); it is very sensitive to revenue surviving FY29–31 and to the price path. Third — the reflexive kicker — if the framework prints and the stock refuses to re-rate, EPS overshoots $600. Six hundred is the equilibrium where the market meets the model halfway. The genuinely bad state is the street’s world, where earnings and buyback capacity collapse together. One more point PMs should not miss: street FY29–30 EPS is stale relative to the new policy. Even keeping street’s own down-cycle operating forecasts, deploying street’s own FCF at $1,500 takes street FY30 EPS from the published $141 to ~$268 (share count to ~61m), because consensus currently models the cash sitting idle at ~$100B. Beats against street FY28–30 EPS are therefore partly mechanical, before any pricing debate. Framework model detail (buybacks at a constant 7x) FY Revenue $B Adj. net income $B Adj. FCF $B Shares retired (m) Avg. repurchase $ Shares end (m) EPS $ FY27E 48.9 33.3 24.4 15 1,583 140 226 FY28E 56.7 37.7 28.3 14 1,995 125 285 FY29E 65.7 43.2 32.9 13 2,544 112 363 FY30E 76.3 49.5 38.1 12 3,249 101 464 FY Revenue $B Adj. net income $B Adj. FCF $B Shares retired (m) Avg. repurchase $ Shares end (m) EPS $ FY31E 88.5 57.4 44.2 10 4,209 90 601 CY30 on this path = avg(FY30, FY31) = $533. FY31 extends the FY28–30 framework one year; management’s stated model formally covers FY28–30. CY30 EPS sensitivity (buybacks at constant 7x; FCF margin tied to GM) Revenue growth \\ terminal GM 75% 80% 85% +13%/yr 446 484 524 +16%/yr 489 532 575 +19%/yr 536 582 630 Even the bearish corner of the framework (13% growth, 75% GM) prints ~$450. The fat left tail is not a GM tweak — it is the street’s world (~$150–270), where revenue itself mean-reverts. 4. What returning 100% of FCF actually buys Dollars returned are price-independent; shares retired are not. On the framework, annual FCF is 10.5% of today’s market cap in FY27, 12.2% in FY28, 14.1% in FY29 and 16.4% in FY30 — ~$124B cumulative FY27–30 ($141B on street cash generation), which is 53–61% of the current cap, ~57% mapped onto CY27–CY30, and ~72% through FY31. The same dollars retire 53% of the company if the stock sits at $1,500, but 35% if the stock tracks earnings at a constant 7x. For context on how unusual this is: Micron is targeting 100% of FCF, while Kioxia, Samsung and Hynix run ~50% — two of the five NAND players shrinking their share counts at a cycle peak has no precedent in memory. FY27E FY28E FY29E FY30E FY31E Adj. FCF (framework, 50% of rev), $B 24.4 28.3 32.9 38.1 44.2 % of today’s $233B cap 10.5% 12.2% 14.1% 16.4% 19.0% Cumulative, $B (% of cap) 24 (11%) 53 (23%) 86 (37%) 124 (53%) 168 (72%) Street FCF, $B (memo) 29.8 38.6 38.1 34.6 n/a Execution fine print: the official language is \"100% of excess cash,\" so a working buffer stays on the balance sheet (note $2.5B of the current cash is NBM customer deposits, and the company carries no debt). The 1% US buyback excise tax costs ~$0.25–0.45B a year — a ~1% drag on the retirement pace. At $25–40B a year the program will lean on ASRs and tenders, but it is comfortably executable against SNDK’s trading liquidity. Nothing precludes a shift of some of the return to dividends later; consensus models zero DPS through FY30. 5. Your numbers, checked Your number Verdict The math CY27 EPS $280–300 Reasonable; top end needs beats Street $235. Framework + full buyback ≈ $255–270 mechanically. Near-term GM is running 84–85% vs. the ~80% model, which plausibly covers the rest. CY30 EPS ~$600 Framework-consistent central case Band is $470–790 by buyback price path; $600 = deployment near ~$2,000 avg (~5–6x forward). Requires the framework to hold through FY31 — it is not conservative vs. street ($141–164 area). ~50% of market cap back in cash by CY30 (at $1,500) Confirmed; slightly conservative 53% (framework) to 61% (street FCF) cumulative FY27–30; ~57% on a CY27–CY30 basis; ~72% through FY31. 6. What is underwritten vs. what is faith Underwritten: $91.1B of RPO at floor pricing covers ~46% of the framework’s cumulative FY28–30 revenue (~$199B), backed by $16.5B of guarantees; industry capacity is ~30% below peak at ~100% utilization; and the Kioxia JV is locked through 2034. Faith: the other ~54% of framework revenue (NBM realization above floor plus non-NBM at market prices), the TAM staying near $500B into the turn of the decade, and no greenfield supply response. On share, the framework is actually undemanding: ~$76B of FY30 revenue is ~15% of a $500B TAM, consistent with SNDK’s historical low-to-mid-teens NAND share — the model needs the TAM, not share gains. Demand markers to watch: hyperscale capex (projected $842B CY26 → ~$1.1T CY27), inference/KV-cache storage attach and eSSD displacement of nearline HDD, and HBF as un-modeled optionality (first die taped out, product samples 2027, co-standardization with SK hynix). Disclosure asks for IR: gross margin at floor pricing, NBM share of FY29–30 bits, and the RPO burn schedule. 7. What it is worth if it works — and if it does not At $1,500 the stock trades at 10.6x street CY26, 6.4x street CY27, ~5.2x your buyside CY27, ~4.6x framework CY28, and ~2–3x framework CY30. The matrix below compounds $1,500 to a Dec-2030 exit at multiple × CY30 EPS (4.4 years; no interim cash to the holder since the return is via repurchase): CY30 EPS \\ exit multiple 5x 7x 9x 12x $150 (street trough) $750 / −15% $1,050 / −8% $1,350 / −2% $1,800 / +4% $300 $1,500 / 0% $2,100 / +8% $2,700 / +14% $3,600 / +22% $450 $2,250 / +10% $3,150 / +18% $4,050 / +25% $5,400 / +34% $600 (your case) $3,000 / +17% $4,200 / +27% $5,400 / +34% $7,200 / +43% $750 (flat-price case) $3,750 / +23% $5,250 / +33% $6,750 / +41% $9,000 / +51% Implied price / IRR from $1,500. Read: $600 at a 7x exit is ~$4,200 (~27% IRR); the street’s trough at a generous 9–12x is roughly flat from here; a hard 2019/2023-style reversion (GM back to 30–40%) implies trough EPS an order of magnitude lower and material downside. Post-event sell-side runs ~$2,100 average with highs around $2,800. 8. Where the model breaks Base rates. No NAND upcycle has held peak gross margins much beyond two years; 2018 and 2022–23 gave back 30– 50 points within 6–8 quarters. Street FY29–30 is less a forecast than the historical prior. The framework is a structural- change claim — NBM contracts, retired capacity, an AI-reset TAM — and should be underwritten as one. Supply response. 80% gross margin funds every player’s cost of capital many times over. Greenfield decisions taken by Samsung, Hynix or YMTC in 2027 land as wafers in 2029–30 — precisely the disputed years. SNDK’s \"bits via migration, not wafers\" stance is capital discipline for itself; it does not bind competitors. Industry capex announcements are the single most important lead indicator for the FY29–31 half of this model. Floor opacity and NBM mix. Floors are described as \"attractive,\" and per management NBM margins hold above 80% even at the lowest pricing point, but floor economics are not quantified in the deck and the ~80% blended framework presumably embeds above-floor realization plus non-NBM spot. The bear case inside the framework is revenue drifting to floor on the NBM two-thirds while non-NBM rolls over — this is the gap between the $91B RPO and the $199B of framework revenue. Counterparty concentration and AI capex. Eight customers carry the model; guarantees of $16.5B cover ~18% of the RPO. A hyperscale digestion phase turns \"committed economics\" into a renegotiation conversation, guarantees notwithstanding — the framework’s revenue floor is more durable than its revenue upside. Capex-light durability and cash leakage. Mid-single-digit capital intensity through a doubling of revenue leans on node economics and the JV; Flash Ventures funding (the notes-receivable line) is where cash quietly leaks if wafer adds return. Using the company’s 50% FCF margin rather than street’s 61–66% is the conservative choice here — if street conversion is right, every buyback figure above is ~20% bigger. Reflexivity and consensus mechanics. A company cannot retire 15%+ of itself annually for long without moving the price — the $787 flat-price case is an absurdity proof, not a target. And remember the benchmark is soft: out-year coverage is thin (1–9 estimates on FY29–30 lines), internally inconsistent, and does not yet reflect the return policy. Appendix A. Street consensus snapshot (Bloomberg, adjusted lines) FY26A FY27E FY28E FY29E FY30E Revenue, $B 20.2 48.9 58.7 48.8 35.1 Growth y/y +175% +141% +20% −17% −28% Adj. gross margin 71.6% 84.4% 83.8% 81.4% 75.0% Adj. net income, $B 11.0 33.3 40.0 28.3 19.4 Adj. diluted EPS, $ 70.88 211.05 258.65 186.29 141.20 Adj. FCF, $B 8.7 29.8 38.6 38.1 34.6 Diluted shares, m 155 155 152 150 142 Cash & equivalents, $B 4.8 33.3 64.5 100.3 99.4 FY26 highlights: Q4 revenue $8.97B ($36B annualized), Q4 GM 84.6%, Q4 EPS $39.25 ($157 annualized), FY26 adjusted FCF $8.7B excluding $2.5B of NBM prepayments (Q4 annualized ~$20B); datacenter Q4 run-rate ~$12B; no debt. B. Assumptions and conventions Calendar-year EPS is the average of the two straddling fiscal years given the late-June fiscal year end (CY27 = avg FY27, FY28; CY30 = avg FY30, FY31). All figures are non-GAAP/adjusted; stock-based compensation (~$230–430m/yr) is excluded per company convention. Tax at 13.5% (consensus ~13.6%). Framework case: FY27 = street operating estimates (already above the long-term model); FY28–31 revenue +16%/yr; gross margin 84% → 82% → 81% → 80% → 80%; opex at 5% of revenue; adjusted FCF at 50% of revenue per the company’s long-term model; 100% of FCF repurchased with average share count equal to beginning shares less half the year’s retirement. The constant- multiple paths solve price = multiple × that year’s EPS self-consistently. The 1% buyback excise tax and SBC share issuance (~1–2% combined drag on retirement pace) are ignored. FY31 extends the FY28–30 framework one additional year — management’s model formally covers FY28–30. Sources: Bloomberg consensus screens provided August 13, 2026; Sandisk analyst-day presentation (August 13, 2026), including the FY28–30 long-term model, NBM disclosures (TCV $93.9B, RPO $91.1B at floor, $16.5B guarantees, ~50% of FY27 and ~67% of FY28 bits under NBM), and FY26 GAAP-to-non-GAAP reconciliations; FY26 results (August 5, 2026, including the $14B repurchase authorization). Prepared for internal discussion. Scenario arithmetic on stated assumptions — not investment advice, a forecast, or a price target.", "status": "extracted"}, "post:2026-08-14T20-03:518215715ac9": {"id": "post:2026-08-14T20-03:518215715ac9", "kind": "post", "title": "2026-08-14 20:03", "source_label": "帖子正文", "excerpt": "【东北计算机】20260814【闪迪展望 2028‑2030 财年非 GAAP 毛利率约 80%，预估 2030 年 AI 数据中心企业闪存规模 1.2 泽字节】 —————————————— 1. 闪迪给出财务展望，预计 2028‑2030 财年非 GAAP 毛利率约 80%，完成业务投资后将 1", "content": "【东北计算机】20260814【闪迪展望 2028‑2030 财年非 GAAP 毛利率约 80%，预估 2030 年 AI 数据中心企业闪存规模 1.2 泽字节】 —————————————— 1. 闪迪给出财务展望，预计 2028‑2030 财年非 GAAP 毛利率约 80%，完成业务投资后将 100% 剩余现金回馈股东；同时预估 2030 年 AI 数据中心企业闪存市场规模达 1.2 泽字节。（来源：财联社） 2. 英伟达宣布 Spectrum‑X 硅光 CPO 交换机进入全面量产，为全球首款量产 200G/lane CPO 以太网交换机，实现激光器数量减 4 倍、功耗降 5 倍、MTBI 提升 10 倍，多家厂商参与供应链制造。（来源：科创板日报） 3. 美银上调服务器 CPU 市场预期，将 2030 年 TAM 上调至 2100 亿美元以上，较 2025 年实现近 5 倍增长；AI 智能体推动 CPU 与 GPU 算力配比由 1:4 向 1:1 演进。（来源：财联社） 4. SK 海力士董事长表示，AI 智能体使用量未来五年可能增长 77 倍，公司将围绕 AI 存储需求持续布局...", "publish_time": "2026-08-14 20:03", "tags": ["文字观点"]}, "attachment:files/BofA-The Flow Show_Strife Begins at Forty-20260814.pdf": {"id": "attachment:files/BofA-The Flow Show_Strife Begins at Forty-20260814.pdf", "kind": "attachment", "title": "BofA-The Flow Show_Strife Begins at Forty-20260814", "source_label": "BofA", "excerpt": "North America Equity Research 14 August 2026 J P M O R G A N www.jpmorganmarkets.com Sandisk LTAs Structurally Reset Margin Profile And Dampen Cyclicality;LT Financial Model Drives", "content": "North America Equity Research 14 August 2026 J P M O R G A N www.jpmorganmarkets.com Sandisk LTAs Structurally Reset Margin Profile And Dampen Cyclicality; LT Financial Model Drives Solid Double- Digits % EPS Growth And Strong FCF; Moving to an OW Rating from NROverweight SNDK, SNDK US Price (13 Aug 26 ):$1,528.11 Price Target (Dec-27 ):$2,250.00 Semiconductors & Semiconductor Capital Equipment / IT Hardware Harlan Sur AC (1-415) 315-6700 harlan.sur@jpmorgan.com Mayur Ramdhani (1-212) 622-1664 mayur.ramdhani@jpmorgan.com Apoorva Kumar (1-212) 270-0668 apoorva.kumar@jpmorgan.com J.P. Morgan Securities LLC Quarterly Forecasts (FYE Jun) Adj. EPS ($) 2026A 2027E 2028E Q1 1.22 46.60 64.63 Q2 6.20 53.22 67.25 Q3 23.41 56.54 67.69 Q4 39.25 61.31 67.80 FY 70.07 217.67 267.36 Style Exposure Following a period of restriction on Sandisk (SNDK), we are moving to an OW rating (from Not Rated) and a December 2027 price target of $2,250 (~47% upside from current levels) coming out of the company's 2026 Investor Day held in New York yesterday. In our view, SNDK is in many respects uniquely positioned to capture the ongoing structural inflection in NAND demand driven by rapid growth in AI inference, with three key dynamics underpinning our OW thesis: 1) the New Business Model (NBM) framework (or LTAs - long-term agreements) has structurally reset SNDK’s margin profile higher and materially reduced cyclicality, with 8 signed NBMs representing ~$94B in total contract value at floor pricing, weighted-average contract duration of 4+ years, and ~80% GM even at the floor pricing tier; 2) NAND market TAM is inflecting from ~$70B in CY25 (JPMe) to $300B+ in CY26 and ~$500B in CY27, with Data Center representing the largest driver of growth (by far) as hyperscale/cloud customers increasingly deploy flash for inference-era workloads (incl. persistent KV cache - a major driver of bit demand growth); and 3) SNDK is delivering technology leadership, with BiCS10 sampling ahead of schedule (332-layer 2Tb QLC with 65% more bits per wafer than BiCS8), a projected 27% CAGR in per-wafer bit productivity through BiCS generations, and High Bandwidth Flash (HBF) emerging as a differentiated inference-era memory platform. Mgmt introduced a long-term financial model for FY28-FY30 targeting mid-/high-teens% revenue growth (in-line with bit growth - implying ~flat pricing was conservatively assumed), ~80% GM, ~75% OpM, and ~50% adjusted FCF margin, representing a clear step-change from historical norms where GMs oscillated well below this level. To us this screens as a substantive reset rather than peak-cycle pricing capture, with NBMs accounting for >50% of FY27 bits and growing to ~2/3 in FY28, and contracts detailing month- by-month volume, mix, and price commitments backed by $16.5B in financial guarantees, significantly improving forward visibility from the \"three months of pricing visibility\" that has been “standard operating procedure” for the industry, to 4+ years of committed economics with strategic customers. Even at floor pricing, we think NBMs sustain ~80% GMs across the multi-year contract lives, with upside captured through variable pricing mechanisms. We also view the LT financial model as embedding meaningful earnings leverage that we think is not fully captured in current consensus estimates as mid-/high-teens% revenue growth ultimately translates into an EPS growth CAGR north of 25%. Layered on top, mgmt's commitment to returning 100% of excess cash flow to shareholders should drive an aggressive share count reduction trajectory that further amplifies EPS growth on a per-share basis. We think this combination of higher through-cycle profitability, sustained bit demand growth, and share count reduction sets up a compounding earnings power dynamic that supports our CY27 EPS estimate of $250 and, in our view, points to a multi-year path toward meaningfully higher EPS levels beyond CY27. Longer-term, we view HBF and emerging 3D Matrix Memory technology as meaningful virtual call options on inference-era memory architecture that, in our view, are not fully reflected in current consensus estimates or valuation. We move to an OW rating and see ~47% upside in the stock from See page 10 for analyst certification and important disclosures.Sources for: Style Exposure – J.P. Morgan Global Markets Strategy; all other tables are company data and J.P. Morgan estimates. {[{dN4RHEsXkdxNkMtiuCqdBHlSTLU2UNLDi6J877W4SUyOoGa_h8WLGyL1asreex-2e6M66nZKwIz7V-sM2A884bzvoh1KE79kzY-Yx_Ciig}]} 2Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 14 August 2026 J P M O R G A N Price Performance YTD 1m 3m 12m Abs 543.7% -8.7% 5.6% 3150.6% Rel 520.7% -12.1% -1.8% 3119.5% Company Data Shares O/S (mn) 157 52-week range ($) 2,354.39-42.82 Market cap ($ mn) 239,913.30 Exchange rate 1.00 Free float (%) 98.7% 3M ADV (mn) 13.42 3M ADV ($ mn) 21,287.3 Volatility (90 Day) 129 Index RUSSELL 2000 BBG ANR (Buy | Hold | Sell) 26|4|0 Key Metrics (FYE Jun) $ in millions FY26A FY27E FY28E Financial Estimates Revenue 20,248 48,646 57,536 Adj. EBIT 12,700 38,866 45,300 Adj. EBITDA 12,408 38,622 45,056 Adj. net income 10,985 33,103 38,572 Adj. EPS 70.07 217.67 267.36 BBG EPS 65.92 211.05 258.66 Cashflow from operations 11,671 29,374 37,355 FCFF 11,522 27,866 34,417 Margins and Growth Revenue Growth Y/Y (%) 175.3% 140.3% 18.3% EBIT margin 62.7% 79.9% 78.7% EBIT Growth Y/Y (%) 1743.3% 206.0% 16.6% EBITDA margin 61.3% 79.4% 78.3% EBITDA Growth Y/Y (%) (1011.7%) 211.3% 16.7% Net margin 54.3% 68.0% 67.0% Adj. EPS growth 2196.9% 210.6% 22.8% Ratios Adj. tax rate 13.0% 14.9% 14.9% Interest cover 4,136.0 NM NM Net debt/Equity NM NM NM Net debt/EBITDA NM NM NM ROE 88.0% 186.3% 196.6% Valuation FCFF yield 4.8% 12.0% 15.6% Dividend yield - - - EV/Revenue 11.6 4.8 4.1 EV/EBITDA 19.0 6.1 5.3 Adj. P/E 21.8 7.0 5.7Summary Investment Thesis and Valuation Investment Thesis Sandisk’s “New Business Model” long-term agreements have structurally reset its margin profile higher and materially reduced cyclicality by converting the majority of its business into long-dated, high-margin, take-or-pay-style revenue, while a structural inflection in NAND demand (driven by AI inference reshaping data center storage) and technology leadership across its BiCS roadmap and emerging High Bandwidth Flash platform underpin a step-change in through-cycle profitability. This combination of durable margins, sustained bit demand growth, and a commitment to returning excess cash to shareholders sets up a compounding earnings power dynamic that points to a multi-year path of meaningfully higher earnings power. Valuation Our December 2027 price target of $2,250 assumes SNDK trades at 9x (within the historical 7-10x forward memory P/E range) applied to our CY27 EPS estimate of $250. Performance Drivers Source: J.P. Morgan Global Markets Strategy for Performance Drivers; company data, Bloomberg Finance L.P. and J.P. Morgan estimates for all other tables. Note: Price history may not be complete or exact. {[{dN4RHEsXkdxNkMtiuCqdBHlSTLU2UNLDi6J877W4SUyOoGa_h8WLGyL1asreex-2e6M66nZKwIz7V-sM2A884bzvoh1KE79kzY-Yx_Ciig}]} 3Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 14 August 2026 J P M O R G A N current levels. Our Dec-27 price target of $2,250 assumes SNDK trades at 9x (mid-point of the historical 7-10x forward memory P/E range) applied to our CY27 EPS estimate of $250. •NBMs structurally reset margin profile higher and materially reduce cyclicality; 8 signed customers with ~$94B TCV at floor pricing and ~80% GM economics. SNDK’s NBM framework, in our view, signifies a major structural change to the flash industry business model. Under NBMs, SNDK signs multi-year, qtr-by-qtr volume and pricing commitments with its most strategic DC and edge customers, with fixed and variable pricing components, floor and ceiling guardrails, financial guarantees to align interests, and detailed month-by-month volume/mix commitments. Since initially announcing five NBMs in April, SNDK has signed three additional NBMs with new customers and expanded two existing NBMs (with those two customers increasing their commitments within a quarter of initial signing) - strong validation that customer demand is running ahead of prior commitments. Financial guarantees amounting to $16.5B serve as protection for SNDK if a customer fails to satisfy its purchase obligations. Critically, we think the ~80% GM economics at floor pricing represents a structural shift rather than the capture of peak-cycle pricing. We expect variable pricing to trend above the floor across most of the contract life given current supply/demand dynamics, providing an upside lever to margin targets. NBM share of SNDK’s bits is expected to grow from >50% in FY27 to ~2/3 in FY28, and we view this as effectively converting the majority of SNDK’s business from spot-priced commodity flash into a long-dated, high-margin, take-or-pay-style revenue stream. In our view, this transition dramatically compresses cyclical volatility relative to the historical “three months of pricing visibility” that produced boom-bust cycles (such as FY23). Going forward, mgmt has stated it will remain highly selective in evaluating additional NBMs, which we think is an appropriate posture given the meaningful share of supply now spoken for, enabling SNDK to preserve optionality for spot-market upside on the non-NBM bit base. •NAND TAM inflecting from ~$70B in CY25 to $300B+ in CY26 and ~$500B in CY27, driven by data center as AI inference workloads reshape storage requirements. The NAND market is undergoing what we think is a structural inflection driven by AI infrastructure investment, with a TAM that is expected to grow from ~$70B in CY25 (JPMe) to >$300B in CY26 and approaching $500B in CY27 (per SNDK estimates, which align closely with JPMe - see here). Data center is the key driver of this growth, shifting from ~30% of TAM in CY25 to ~50% in CY26 and continuing to outpace the overall market in CY27. Underpinning this shift is the emergence of AI inference, which is fundamentally a memory-centric, storage-intensive problem: every AI interaction generates content that must be stored, retrieved, and served at low latency, with persistent KV cache emerging as a critical new NAND workload as models scale to larger context lengths, higher parameter counts, and agentic architectures. Importantly, we think the supply side of the equation is structurally constructive, with industry wafer capacity now ~30% below prior peak and running at ~100% utilization. This means near- term bit growth comes primarily from nodal migrations rather than wafer additions, which structurally supports pricing durability and, we think, extends the current upcycle materially beyond what historical patterns would suggest. On the edge side, we expect unit growth in smartphones and PCs to be >10% in CY26 as demand adjusts to premium mix, before potentially returning to unit growth in CY27 with content per device continuing to expand as on-device AI, richer content, and new form factors drive higher storage requirements. Notably, mgmt indicated bits are expected to remain on allocation beyond CY27 - a data point we think is materially bullish for sustained NAND pricing durability through the remainder of the decade. •Technology and product strength across BiCS roadmap, systems capabilities, and emerging HBF platform; BiCS10 sampling ahead of schedule. On the BiCS roadmap, SNDK introduced BiCS10 (332-layer 2Tb QLC), which mgmt characterized as the world’s highest-density memory chip and confirmed is now sampling (a milestone we {[{dN4RHEsXkdxNkMtiuCqdBHlSTLU2UNLDi6J877W4SUyOoGa_h8WLGyL1asreex-2e6M66nZKwIz7V-sM2A884bzvoh1KE79kzY-Yx_Ciig}]} 4Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 14 August 2026 J P M O R G A N think is particularly notable given development is moving ahead of expectations). BiCS10 delivers ~60% memory density improvement, ~100% write/read bandwidth improvement, ~33% interface speed improvement, and ~75% power efficiency improvement vs. BiCS8, and packs 65% more bits per wafer than the prior generation - metrics that in our view cement SNDK’s strong competitive positioning relative to peers. In parallel, SNDK has also introduced BiCS9 2Tb QLC, which combines the mature BiCS8 cell array with BiCS10-like CMOS features, delivering higher performance and power efficiency vs. BiCS8 QLC with minimal incremental capex, which we view as a reinforcement of SNDK’s industry-leading capital efficiency positioning. Over 5 generations of BiCS technology (BiCS5 through BiCS11), SNDK averages 54% gen-to- gen bit per wafer growth, or a 27% CAGR in per-wafer bit productivity (outpacing the mid-/high-teens% bit growth targeted in the LT model), positioning SNDK to deliver bit growth commitments through technology alone (i.e. no wafer additions), preserving capital and supporting its MSD% capital intensity target. Longer-term, we view HBF (High Bandwidth Flash) as an emerging differentiated inference-era memory architecture that, in our view, is one of the more compelling call options in the memory space. SNDK’s own HBF vs. HBM simulations show 8x CapEx efficiency for minimum- config workloads and 2x GPU efficiency at maximum token output - data points we think are compelling enough that we expect meaningful customer engagement to continue building through 2027. The inaugural HBF specification was released last week, with the first HBF memory die taped out and first HBF inference product samples targeted for 2027. •Moving to an Overweight rating on Sandisk (from Not Rated) - $2,250 PT. Our December 2027 price target of $2,250 assumes SNDK trades at 9x (within the historical 7-10x forward memory P/E range) applied to our CY27 EPS estimate of $250, implying ~47% upside from current levels. We move to an Overweight rating (from Not Rated). {[{dN4RHEsXkdxNkMtiuCqdBHlSTLU2UNLDi6J877W4SUyOoGa_h8WLGyL1asreex-2e6M66nZKwIz7V-sM2A884bzvoh1KE79kzY-Yx_Ciig}]} 5Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 14 August 2026 J P M O R G A N Appendix I: Comp and Group Valuation Figure 1: Sandisk Comp Group 5.9x 4.4x 6.7x Median4.9x 5.1x 8.0x $ 101.54 $ 64.30 $ 548,196 $ 353,266 $55,143 166.3% $514.00 Overweight Jay Kwon NTD 2408 TT NA
