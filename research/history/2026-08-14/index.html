ynman 新平台的重大迭代，CPO、A16 精锐尽出。 Vera Rubin 进入量产及爬坡期，但 NVIDIA 重大迭代已提前启动。 供应链传出，NVIDIA 正将研发与供应链资源，快速推向 2028 年下半的 Feynman 世代，牵动台积电先进技术升级，全球设备材料供应链可望再迎新单荣景。 Rubin 以多颗小晶片（Chiplet）与高频宽记忆体（HBM）整合为主，Feynman 将朝 3D 小晶片、SoIC 及共同封装光学（CPO）发展。 对台积电而言，NVIDIA 缩短产品迭代周期，同步推升先进制程与封装扩产压力。 供应链指出，台积电目前正加速嘉义 AP7、南科 AP8 建置，SoIC、CoWoS‑L，下世代 CoPoS 均提前布局，厂务、无尘室及设备进机作业持续「抢进度」。 业界表示，NVIDIA 由硬体平台快速迭代及资本布局，进一步掌握 AI 基础设施的供应与需求两端。 2026 年以来，NVIDIA 已投入逾 400 亿美元布局 AI...", "publish_time": "2026-08-14 09:24", "tags": ["文字观点"]}, "attachment:files/中银证券-舒华体育(605299)国内领先科学运动服务商，加速全球扩张打造“世界舒华”-260814.pdf": {"id": "attachment:files/中银证券-舒华体育(605299)国内领先科学运动服务商，加速全球扩张打造“世界舒华”-260814.pdf", "kind": "attachment", "title": "中银证券-舒华体育(605299)国内领先科学运动服务商，加速全球扩张打造“世界舒华”-260814", "source_label": "中银证券", "excerpt": "谨请参阅尾页重要声明及财通证券股票和行业评级标准 1 封测龙头领跑先进封装，行业景气全面上行 长电科技 （600584）", "content": "谨请参阅尾页重要声明及财通证券股票和行业评级标准 1 封测龙头领跑先进封装，行业景气全面上行 长电科技 （600584） 证券研究报告 半导体 /公司深度研究报告 /2026.08.13 投资评级 :买入（首次） 核心观点 基本数据 2026 -08-12 收盘价（元） 78.18 流通股本 （亿股） 17.89 每股净资产 （元） 16.08 总股本（亿股） 17.89 最近 12月市场表现 分析师 唐佳 SAC证书编号： S0160525110002 tangjia@ctsec.com 分析师 詹小瑁 SAC证书编号： S0160525120008 zhanxm@ctsec.com 相关报告 1. 《整合效果初见端倪，各方利好助推扬帆 起航》 2018 -04-13 2. 《收购协同效应显现， 封测龙头高速发展》 2018 -01-25 ❖ 全球第三、中国大陆第一封测龙头，平台化构筑核心壁垒 。公司深耕半 导体封测五十余年， 2025年营收 388.71亿元，全球委外封测（ OSAT）市占率 12.2%，位居全球第三、中国大陆第一。 目前，公司海内外共布局八大生产基 地、两大研发中心， 已覆盖传统封装至 2.5D/3D 先进封装全链条，提供一站 式芯片制造服务 。 ❖ 行业景气回暖， 全球先进封装集体扩产 。2025年全球半导体销售额达 7956 亿美元，同比 +26.2%，2026年Q1复苏提速，封测厂产能利用率普遍超 80%。 高景气下全球厂商集体加码扩产 ，公司 2026年固定资产投资预算上调至约 100 亿元，聚焦 AI算力、车规、 HBM存储高端赛道，充分受益行业成长红利 。 ❖ 存力、算力、电力三重需求共振，运算电子 高增。公司运算电子 2025年 营收 82.79亿元，同比 +42.6%。存力端，HBM 需求爆发驱动高端存储封测放 量，公司覆盖 DRAM/Flash 全品类； 算力端，AI 算力芯片对 2.5D/3D 封装需 求陡增， 公司 XDFOI®平台实现 4nm多芯片集成量产， CPO硅光引擎完成样 品交付； 电力端，公司基于 SiP的2.5D垂直 VCORE电源模块量产。公司在 存力、算力、电力三条赛道上技术卡位， 目前正处在高速成长通道中。 ❖ 汽车电子为第二成长曲线，车规业务持续放量 。公司是中国大陆首家加 入AEC汽车电子委员会的封测企业，八大基地均通过 IATF16949 认证。临港 汽车电子工厂已于 2026年3月投产， 2025年汽车电子业务营收 37.32亿元， 同比 +31.7%，有望持续受益于汽车电动化与智能化浪潮。 ❖ 投资建议： 公司作为全球封测龙头，深度受益于 AI算力封装需求爆发与汽 车电子国产替代趋势 。我们预计 日月光投控 2026年 Q1半导体封装测试营业净利润达新台币 158.77亿元，同比增长 90%；通富微电 Q1净利润同比大增 224%，先进封装业务营收占比达 70%；长电科技 Q1净利润 同比增长 43%，主动优化产品结构 ，2.5D先进封装产品加速量产导入 。 开支端全面加码，先进封装为核心投资主线，高端产能供需持续偏紧。 台厂为扩 产主力： 日月光 2026年资本开支上调至 85亿美元，在全球积极推进建厂计划， 年内 6座新厂动工，预计将大幅扩充封装产能 ；力成、京元各规划 500亿新台币 扩产封测。大陆厂商同步跟进，长电科技 2026年固投预算 100亿元布局算力、车 规、 HBM产线，通富微电拟募资 42.2亿元升级多赛道封测产能；三星、安靠分 别投入 40亿、 25-30亿美元布局海外封测基地。本轮扩产聚焦高端先进封装，传 统封装产能供给宽松，行业红利持续向技术龙头集聚 。 2.1.2 海内外库存周期分化，补库动能持续释放 全球半导体库存周期已触底反转，全行业进入低位去化、补库在即的关键拐点， 供需格局迎来根本性改善 。2026年第一季度，全球半导体大厂库存周转天数降至 121天，环比下降 15天，创下近三年最低水平。其中存储板块去化最为彻底： SK 海力士在高盛电话会明确指出，存储行业已全面进入卖方市场，受 AI真实需求爆 发与洁净室产能刚性约束双重驱动，年内存储价格有望持续上行，公司 DRAM及 NAND库存仅剩约 4周，远低于安全水位，且无法完全满足下游客户需求。 区域格局呈现明显分化，日本品牌芯片仍处于阶段性供过于求状态，而台系、韩 系头部厂商需求持续旺盛，渠道与终端补库存动能充足。当前行业整体库存已处 于历史低位， 2026 年Q1封测龙头企业平均产能利用率超 80%，其中日月光、通 富微电、华天科技稼动率达到 80%-90%，先进封装占比大幅提升，行业在传统淡 季实现高位稼动，订单能见度显著改善。 综合来看，行业大规模补库周期一触即 发，而下游需求的持续高增正是本轮补库的核心驱动力，封测作为产业链后端环 节将直接受益 ，持续带动自身景气度加速上行。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 10 公司深度研究报告 /证券研究报告 表1: 部分封测厂商 2026年产能利用率数据表 厂商 产能利用率 动态 订单预测 日月光 80%-89% 2026年先进封测营收目标上修至 35 亿美元以上 订单饱满，展望积 极 台积电 100% 全力扩产仍难以满足 AI芯片封装 需求 订单能见度高，持 续上升 长电科技 80% 主动削减低毛利传统封装订单，优 化产品结构 订单结构优化，盈 利预期上升 通富微电 80%-90% 先进封装收入占比约 70%，产能持 续满载 在手订单充足 华天科技 80%-90% 在手订单 80-90亿元，产能利用率 高位运行 订单饱满，展望积 极 中小封测厂 60%-70% 通用封装需求疲软，产能利用率偏 低 订单稳定 数据来源：芯智云，财通证券研究所 2.1.3 下游需求结构优化， AI与汽车电子双轮驱动 2026年全球半导体下游需求呈现结构性分化格局， AI与高性能计算成为本轮景 气周期的核心引擎。 逻辑器件在 2025年领跑全球半导体市场增长， 主要受益于数 据中心、 AI加速器与先进计算系统对高性能芯片的强劲拉动。据 QYResearch 统 计，2025年全球 AI芯片市场规模已达 1059.8亿美元，预计 2032年将增至 3956.4 亿美元， 2026 -2032年CAGR高达 20.0%。AI加速芯片需求持续爆发，不仅推动 芯片出货量快速扩容，更强力拉动 HBM堆叠封装、 2.5D异构集成、 CPO光电共 封装等前沿先进封装技术需求，成为封测产业升级的关键动力。 图11: 2025年全球半导体销售额器件细分占比 （单位：十亿美元） 数据来源： WSTS，半导体产业纵横，财通证券研究所 消费电子与汽车电子呈现差异化复苏态势，共同构建行业稳健支撑 。消费电子结 束高增长步入存量时代， 根据 Omdia数据，2025年全球智能手机出货量 12.5亿 部，同比增长 2%；PC出货量 2.795亿台，同比增长 9.2%，整体呈现温和修复。 汽车电子在新能源与智能化双轮驱动下高速成长， 根据 Mordor Intelligence 数据， 2025年汽车半导体市场规模达 1004.8亿美元，预计 2030年以 7.29%的复合增速 扩容至 1428.7亿美元。据台积电资深副总经理张晓强预测， 2030年全球半导体市 场规模将突破 1.5万亿美元， AI与高性能计算占比将达 55%， 智能手机约占 20%， 汽车电子与物联网各占 10%。整体来看， 行业需求结构持续向高附加值赛道集中， AI主导、车规稳健、消费温和的结构性成长趋势明确 。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 11 公司深度研究报告 /证券研究报告 2.2 先进封装：市场扩容加速，格局分化演进 2.2.1 市场规模持续扩大， 先进封装 渗透持续提升 全球封测市场结构性升级， 先进封装成为价值重估核心 。据Yole Group 数据， 2025 年全球先进封装市场规模约 531亿美元，预计 2030年将达 794亿美元，年复合增 长率约 8.4%。到 2026年，先进封装在全球封测市场中的占比将首次突破 54%， 行业结构性升级趋势明确 。在 AI 算力需求持续爆发的带动下，封装测试环节由 传统产业链配套角色升级为性能突破的关键载体，行业地位与价值量持续抬升 。 图12: 2020 -2026年封装市场概览 数据来源： 半导体产业纵横 ，Yole，财通证券研究所 先进封装渗透率快速提升，核心驱动来自技术、需求与成本三大因素共振 。技术 方面，后摩尔时代传统制程微缩边际效益递减，产业转向以集成化、微型化为主 的系统级创新，先进封装成为延续芯片性能增长曲线的核心路径 ；需求方面， AI 与高性能计算的爆发则带来最强需求动力， GPU、AI加速芯片需通过 CoWoS等 先进方案集成 HBM， 以突破内存墙与功耗瓶颈 ；Chiplet异构集成技术持续成熟， 通过芯粒拆分与整合显著提升良率、降低成本、缩短研发周期。多重因素共同推 动下， 先进封装已从芯片配套环节升级为产业链价值 高地， 成长确定性持续强化。 2.2.2 技术路线分层明确，竞争格局龙头主导 先进封装技术路线分层清晰 ，2.5D/3D封装成 AI核心赛道 。后摩尔时代半导体技 术重心由前端制程转向封装与系统级集成，先进封装成为性能跃升的关键载体， 技术路线呈现清晰分层与高速迭代态势。当前主流技术涵盖 2.5D/3D 封装、扇出 型晶圆级 /面板级封装、微间距互连及系统级封装等方向，在 AI、HPC等高端场 景快速渗透。据 QYResearch 预测， 2026 -2032年全球先进封装市场规模 复合增长 率CAGR为9.2%，其中 2.5D/3D 集成电路封装同期 CAGR高达 16.8%，是技术 升级与需求拉动的最强赛道， 增速显著领跑行业。 全球格局双核主导，大陆厂商加速技术突围 。全球先进封装竞争格局高度集中， 呈现台陆双核心、 龙头差异化、 大陆加速追赶的鲜明特征。 据芯思想研究院统计， 2025年全球 OSAT行业 CR10中，中国台湾企业 3家、市占率 33.4%，中国大陆 企业 5家、市占率 32.6%，份额基本持平，亚洲主导地位持续强化。 2025 年全球 封测厂商表现指数显示，日月光、安靠科技、长电科技稳居前三，共同构成全球 第一梯队 。日月光以 VIPackTM3D异构集成平台构建全栈 技术壁垒，安靠在 SWIFT®扇出封装与 2.5D/3D TSV 领域优势显著，长电科技则凭借 XDFOI多维扇 出平台实现 4nm节点多芯片集成，跻身全球第一阵营。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 12 公司深度研究报告 /证券研究报告 图13: 全球六大 OSAT封测厂商 2025市场表现指数 数据来源： 深芯盟半导体产业研究 ，财通证券研究所 中国封测力量全面崛起， 产业结构持续升级 。中国大陆厂商已在全球前十大 OSAT 中稳占五席 ，以长电科技、通富微电为代表，以及盛合晶微等创新企业，正逐步 摆脱低端打线封装依赖 。通过在 XDFOI、VISionS等自主先进封装平台上的实质 性突破，本土龙头企业正加速从“规模扩张”向“质量提升”的结构性升级 。整 体来看，全球封测格局持续优化，大陆龙头依托技术突破与产能扩张，在先进封 装国产替代浪潮中占据有利位置。 2.3 宏观政策与国产替代： 先进封装成突围关键 外部管制升级， 封测环节成为国产替代的关键战略支点 。2026年美国对华半导体 管制进一步加码 ，4月众议院推出 MATCH法案，将先进封装、 HBM生产关键设 备纳入出口管制，管制范围由 EUV扩至 DUV光刻机， 并切断已售设备的全生命 周期服务，要求盟友 150天内与美方标准完全对齐，意图封堵我国先进制程升级 通道。相较于制造端承压，封测环节受直接冲击相对有限，我国已构建全球最完 整封测产业链与最大产能底座，长电科技、通富微电、华天科技等龙头稳居全球 前列。面对设备限制，国内封测企业与设备厂商联合攻关，加快键合机、塑封机、 测试机等核心设备国产替代；同时依托新能源汽车、 AI服务器、 5G基站等海量 本土应用场景，持续迭代具有中国特色的先进封装方案， 为技术突破与规模化 两河河床大面积裸露，内河航运全面受阻， 沿线核电站因冷却水供给不足被迫停机、限产，莱茵河沿岸一众头部 化工企业也因原材料运输中断，陆续启动减产措施。从匈牙利保克什 核电站濒临停机，到德国巴斯夫核心工厂受限停产，这场极端天气引 发的生态危机，已通过电价暴涨、原料断供、产能收缩等连锁反应， 全面冲击欧洲能源安全体系与化工产业根基，电力供给缺口率先引发 区域连锁波动。匈牙利保克什核电站运行受限、产能近乎停滞，该国 只能紧急加大从斯洛伐克、奥地利等周边国家的电力进口力度，直接 推高了欧洲区域电力批发行情。罗马尼亚随即启动能源警戒机制，电 力出口能力大幅缩减，进一步加剧了巴尔干地区的电力供需紧张态 势。与此同时，塞尔维亚、奥地利相继出现电力短缺问题，让整个欧 洲中部及巴尔干区域的电力调度调配难度大幅提升。化工行业的原料 供应链危机，正从德国沿河核心工厂逐步向外扩散。巴斯夫、科思创 等欧洲化工龙头纷纷调整生产节奏，直接导致欧洲化工产业链基础原 料供应承压。乙烯、丙烯、苯等大宗化工品高度依赖莱茵河驳船运输， 当前河道航运运力大幅锐减，造成德国本土化工中间体供应持续收 紧。德国化学工业协会预警，若河道低水位现状持续，欧洲各类化工 产品或将迎来全面涨价，并进一步传导至汽车、建筑、制药等全下游 产业。2018年莱茵河干旱灾害曾造成德国化工行业数十亿欧元的经 济损失，而本次极端天气引发的危机程度，已远超2018年同期水平。 更为严峻的是供应链积压带来的持续性累积影响。莱茵河承担着德国 约80%的内河货运任务，德国进口的大量化工原料、能源物资均依靠 这条水道运输。目前河道实际通航运力仅剩正常水平的两成，即便未 来数周水位回升、航运恢复正常，前期积压的海量货物也需要漫长周 期才能完全消化，供应链修复周期大幅拉长。 l风险提示： 原材料价格大幅波动、产能建设进度不及预期、贸易摩擦加剧、 宏观经济增长不及预期等风险。发布时间：2026-08-13 请务必阅读正文之后的免责条款部分 2目录 1本周化工板块行情回顾.......................................................................7 1.1化工板块行情：本周基础化工行业指数收4391.41点，较上周+6.77%，跑赢沪深300指数4.45%...7 1.2化工产品价格涨跌幅排行榜：溴素、硫磺、异丁醛、维生素VE涨幅居前........................8 2重点化工子行业跟踪........................................................................10 2.1涤纶长丝：本周市场价格小幅下跌........................................................10 2.2轮胎：橡胶价格环比上涨................................................................11 2.3制冷剂：市场价格维持偏强运行..........................................................13 2.4MDI：本周MDI市场价格坚挺运行.........................................................15 2.5PC：市场价格高位窄幅震荡运行..........................................................16 2.6纯碱：碱企开启检修降负，纯碱市场价格继续向下寻底......................................17 2.7化肥：秋肥需求尚待启动，价格存在博弈情绪..............................................19 3本周化工品价格走势（截至2026/8/7）.......................................................25 3.1主要石化产品价格走势（截至2026/8/7）.................................................25 3.2主要化纤产品价格走势（截至2026/8/7）.................................................27 3.3主要农化产品价格走势（截至2026/8/7）.................................................29 3.4纯碱、氯碱、钛白粉产品价格走势（截至 正在加速", "收入高增可期", "文字观点"]}, "post:2026-08-14T14-26:9adb1ba3f9a7": {"id": "post:2026-08-14T14-26:9adb1ba3f9a7", "kind": "post", "title": "2026-08-14 14:26", "source_label": "帖子正文", "excerpt": "【长江电新】光伏：硅片电池组件涨价，反内卷持续推进 1、硅片价格相比7月底上涨0.1-0.32元/片，电池价格上涨2-3分/W至0.28-0.3元/W（盖锡口径最高达0.35元/W）。涨价原因一方面是成本传导，预期硅料涨价，以及白银涨价", "content": "【长江电新】光伏：硅片电池组件涨价，反内卷持续推进 1、硅片价格相比7月底上涨0.1-0.32元/片，电池价格上涨2-3分/W至0.28-0.3元/W（盖锡口径最高达0.35元/W）。涨价原因一方面是成本传导，预期硅料涨价，以及白银涨价；另一方面是需求端有支撑，印度放松电池进口限制，美国232政策公布后备货增加。硅料企业暂不对外报价和出货，块状硅预期价格上升至40-42元/kg，颗粒硅上升至37-38元/kg。组件龙头企业也上调报价，部分二三线企业跟进，整体涨幅在1-3分/W。 2、我们认为本轮反内卷自上而下落地的可能性更高，从8家硅料企业签署《反内卷倡议书》，再到硅片、电池、组件报价上涨，反映出企业经历10个季度亏损后更容易达成默契。投资上我们认为短期具备博弈价值但中期仍需观察，考虑到当前板块已处于\"估值底+持仓底+基本面底\"的三重底部区间，建议关注光伏底部布局机会，推荐有望率先涨价的硅料环节、新技术相关公司、格局较好/成本优势显著的辅材龙头及一体化龙头，同时建议布局第二成长曲线明确落地的龙头企业。#文字观点", "publish_time": "2026-08-14 14:26", "tags": ["文字观点"]}, "post:2026-08-14T22-31:667e3173b8df": {"id": "post:2026-08-14T22-31:667e3173b8df", "kind": "post", "title": "2026-08-14 22:31", "source_label": "帖子正文", "excerpt": "【国盛能源电力】8月14日＃算电协同 -------------------------------- ＃行业层面 1、国家能源局近日发布对十四届全国人大四次会议第1461号建议的答复，其中提到加快推动煤电向支撑调节性电源转型，积极有序开发建设抽水蓄能电站，积极打造虚拟电厂、负荷聚合商等负荷侧调节资", "content": "【国盛能源电力】8月14日＃算电协同 -------------------------------- ＃行业层面 1、国家能源局近日发布对十四届全国人大四次会议第1461号建议的答复，其中提到加快推动煤电向支撑调节性电源转型，积极有序开发建设抽水蓄能电站，积极打造虚拟电厂、负荷聚合商等负荷侧调节资源。提升新能源消纳利用水平和绿色低碳供给能力，提升新能源发展自主性、增强新能源市场竞争力。目前，全国有99个绿电直连项目完成审批，对应新能源总装机规模3405万千瓦。下一步将持续推进新能源集成融合发展，加快推广新模式新业态，提升新能源就近消纳利用水平。 ＃公司层面 华光环能上涨4.53%，金房能源上涨3.93%，亨通股份上涨3.61%，川能动力上涨2.32%。 1、亨通股份：8月13日，亨通股份发布公告，公司拟向特定对象发行A股股票，募集资金总额不超过36亿元，本次募资中27亿元将投入绿能与电子电路用高端铜箔产业园项目，该项目投资总额为33.02亿元。项目建成后，预计将新增年产4万吨锂电铜箔、1万吨电子电路铜箔的产能。#文字观点", "publish_time": "2026-08-14 22:31", "tags": ["文字观点"]}, "attachment:files/中泰证券-电科蓝天(688818)宇航电源龙头，长期受益我国航天产业高景气发展-260813.pdf": {"id": "attachment:files/中泰证券-电科蓝天(688818)宇航电源龙头，长期受益我国航天产业高景气发展-260813.pdf", "kind": "attachment", "title": "中泰证券-电科蓝天(688818)宇航电源龙头，长期受益我国航天产业高景气发展-260813", "source_label": "中泰证券", "excerpt": "请务必阅读正文之后的重要声明部分宇航电源龙头，长期受益我国航天产业 电能源系统解决方案和核心产品的供应商，拥有发电、储能、控制和系统集 成全套解决方案。2024年，公司宇航电源收入占比超过60%，国内宇航电 源产品市场覆盖率达到50%以上。 3）资本化与产业化加速阶段（2025年至今）。随着载人航天、深空探测、 北斗导航等国家重大航天工程持续深入推进，低轨卫星星座大规模组网建设 加速，商业航天产业迎来爆发式增长，航天器发射数量与在轨规模持续攀升， 带来广阔且持续增长的市场空间。2026年2月，公司在上海证券交易所科 创版成功上市。未来，公司以高效发电、致密储能、集成控制三大核心技术 为引领，不断提升宇航电源、特种电源和新能源应用的研发与制造能力，拓 展新能源服务的新领域，打造电能源产业化基地，稳步提升行业影响力，致 力于打造电能源领域世界一流创新型企业，成为先进电能源系统解决方案和 核心产品供应商。 图表1：公司发展历程 来源：公司招股说明书，公司公告，中泰证券研究所 公司深度报告 -8- 请务必阅读正文之后的重要声明部分公司致力于成为中国先进电能源系统解决方案和核心产品龙头供应商。公司 在电能源领域深耕多年，电能源技术和产品覆盖化学电源、物理电源和混合 组网电源，拥有发电、储能、控制和系统集成全套解决方案，产品应用领域 实现深海（水下1公里）至深空（距地球2.25亿公里）广泛覆盖。 图表2：公司产品主要应用场景 来源：公司招股说明书，中泰证券研究所 公司主营业务涵盖宇航电源、特种电源、新能源应用及服务三大板块。 图表3：公司主要产品及服务 来源：公司招股说明书，中泰证券研究所 公司深度报告 -9- 请务必阅读正文之后的重要声明部分1）宇航电源业务。公司宇航电源产品主要包括宇航电源单机及系统与材料 （砷化镓外延片），其中宇航电源单机包括空间太阳电池阵、空间锂离子电 池组、电源控制设备。公司提供的宇航电源产品是空间飞行器的“心脏”， 主要应用于卫星、飞船、空间站等各类航天器，以及临近空间无人机和平流 层飞艇等临近空间飞行器，可为空间飞行器中的用电设备提供电能。 图表4：公司宇航电源业务主要产品 来源：公司招股说明书，公司公告，中泰证券研究所 公司的宇航电源业务处于航天产业链的上游环节，主要制造卫星、飞船、探 测器、空间站等航天器的电源分系统，为航天器总装单位提供配套。航天产 业链上游主要为卫星、空间站、飞船等航天器及火箭的制造厂商，可进一步 细分为配套分系统及部组件制造商与总装单位。产业链中游为火箭发射与卫 星运营服务厂商，其中卫星运营服务厂商进一步分为遥感运营、通讯运营与 导航运营三类；产业链下游为应用环节，传统应用场景包括通信（广播电视 传输、邮电、远程医疗、应急救灾等）、导航（海陆空交通运输、精准农业、 智慧城市、自动驾驶、应急救援、气候监测等）、遥感（国防情报获取、基 础设施测绘、环境监测、自然资源管理等），新兴应用场景包括卫星互联网、 太空旅行、太空采矿、深空探索等。 公司深度报告 -10- 请务必阅读正文之后的重要声明部分图表5：公司宇航电源业务所处的航天产业链图谱 来源：36氪研究院，公司招股说明书，中泰证券研究所 公司是国内宇航电源的核心供应商，公司研制的宇航电源产品贯穿我国航天 产业发展史。公司先后承担了“863计划”、创新基金、火炬计划等多个 国家级高新技术研究发展计划项目，近年来公司已为神舟系列飞船、天舟系 列飞船、空间站“天和”核心舱、“问天”/“梦天”实验舱、北斗导航、 嫦娥系列探月卫星、探火工程、千帆星座、国网星座等多个国家级重点型号 工程提供了优质可靠的电源产品。在保持国家航天领域竞争优势的同时，积 极发力商业航天市场，已成为包括国网星座、千帆星座、吉林一号遥感星座 等在内的多个重要商业航天星座的电源供应商。 图表6：公司宇航电源产品应用场景图示 来源：公司招股说明书，中泰证券研究所 2）特种电源业务。公司特种电源的产品体系主要为特种锂离子电池组和燃 料电池。公司的特种锂离子电池组主要应用于携行装备、特种车辆、特种无 人机和工业机器人。公司先后承担了为重点工程配套的锂离子蓄电池组科研 项目100余项，产品型号达300余种。在携行装备电源领域，公司是国内 龙头企业；在特种车辆电源、特种无人机电源和工业机器人电源领域，公司 属于国内重要供应商。其中，工业机器人电源领域，公司目前主攻AGV锂 公司深度报告 -11- 请务必阅读正文之后的重要声明部分离子电池方向，并已成为国内AGV锂离子电池组的重要供应商之一。公司 的燃料电池主要应用于携行装备、应急电源等国防领域，燃料电池实现产业 化。 图表7：公司特种电源业务主要产品 来源：公司招股说明书，公司公告，中泰证券研究所 公司深耕化学电源领域，形成较为完成的产业链协同布局，具备一体化竞 争优势。公司特种电源业务位于锂电池产 igence 数据， 2025年汽车半导体市场规模达 1004.8亿美元，预计 2030年以 7.29%的复合增速 扩容至 1428.7亿美元。据台积电资深副总经理张晓强预测， 2030年全球半导体市 场规模将突破 1.5万亿美元， AI与高性能计算占比将达 55%， 智能手机约占 20%， 汽车电子与物联网各占 10%。整体来看， 行业需求结构持续向高附加值赛道集中， AI主导、车规稳健、消费温和的结构性成长趋势明确 。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 11 公司深度研究报告 /证券研究报告 2.2 先进封装：市场扩容加速，格局分化演进 2.2.1 市场规模持续扩大， 先进封装 渗透持续提升 全球封测市场结构性升级， 先进封装成为价值重估核心 。据Yole Group 数据， 2025 年全球先进封装市场规模约 531亿美元，预计 2030年将达 794亿美元，年复合增 长率约 8.4%。到 2026年，先进封装在全球封测市场中的占比将首次突破 54%， 行业结构性升级趋势明确 。在 AI 算力需求持续爆发的带动下，封装测试环节由 传统产业链配套角色升级为性能突破的关键载体，行业地位与价值量持续抬升 。 图12: 2020 -2026年封装市场概览 数据来源： 半导体产业纵横 ，Yole，财通证券研究所 先进封装渗透率快速提升，核心驱动来自技术、需求与成本三大因素共振 。技术 方面，后摩尔时代传统制程微缩边际效益递减，产业转向以集成化、微型化为主 的系统级创新，先进封装成为延续芯片性能增长曲线的核心路径 ；需求方面， AI 与高性能计算的爆发则带来最强需求动力， GPU、AI加速芯片需通过 CoWoS等 先进方案集成 HBM， 以突破内存墙与功耗瓶颈 ；Chiplet异构集成技术持续成熟， 通过芯粒拆分与整合显著提升良率、降低成本、缩短研发周期。多重因素共同推 动下， 先进封装已从芯片配套环节升级为产业链价值 高地， 成长确定性持续强化。 2.2.2 技术路线分层明确，竞争格局龙头主导 先进封装技术路线分层清晰 ，2.5D/3D封装成 AI核心赛道 。后摩尔时代半导体技 术重心由前端制程转向封装与系统级集成，先进封装成为性能跃升的关键载体， 技术路线呈现清晰分层与高速迭代态势。当前主流技术涵盖 2.5D/3D 封装、扇出 型晶圆级 /面板级封装、微间距互连及系统级封装等方向，在 AI、HPC等高端场 景快速渗透。据 QYResearch 预测， 2026 -2032年全球先进封装市场规模 复合增长 率CAGR为9.2%，其中 2.5D/3D 集成电路封装同期 CAGR高达 16.8%，是技术 升级与需求拉动的最强赛道， 增速显著领跑行业。 全球格局双核主导，大陆厂商加速技术突围 。全球先进封装竞争格局高度集中， 呈现台陆双核心、 龙头差异化、 大陆加速追赶的鲜明特征。 据芯思想研究院统计， 2025年全球 OSAT行业 CR10中，中国台湾企业 3家、市占率 33.4%，中国大陆 企业 5家、市占率 32.6%，份额基本持平，亚洲主导地位持续强化。 2025 年全球 封测厂商表现指数显示，日月光、安靠科技、长电科技稳居前三，共同构成全球 第一梯队 。日月光以 VIPackTM3D异构集成平台构建全栈 技术壁垒，安靠在 SWIFT®扇出封装与 2.5D/3D TSV 领域优势显著，长电科技则凭借 XDFOI多维扇 出平台实现 4nm节点多芯片集成，跻身全球第一阵营。 仅供内部参考，请勿外传 谨请参阅尾页重要声明及财通证券股票和行业评级标准 12 公司深度研究报告 /证券研究报告 图13: 全球六大 OSAT封测厂商 2025市场表现指数 数据来源： 深芯盟半导体产业研究 ，财通证券研究所 中国封测力量全面崛起， 产业结构持续升级 。中国大陆厂商已在全球前十大 OSAT 中稳占五席 ，以长电科技、通富微电为代表，以及盛合晶微等创新企业，正逐步 摆脱低端打线封装依赖 。通过在 XDFOI、VISionS等自主先进封装平台上的实质 性突破，本土龙头企业正加速从“规模扩张”向“质量提升”的结构性升级 。整 体来看，全球封测格局持续优化，大陆龙头依托技术突破与产能扩张，在先进封 装国产替代浪潮中占据有利位置。 2.3 宏观政策与国产替代： 先进封装成突围关键 外部管制升级， 封测环节成为国产替代的关键战略支点 。2026年美国对华半导体 管制进一步加码 ，4月众议院推出 MATCH法案，将先进封装、 HBM生产关键设 备纳入出口管制，管制范围由 EUV扩至 DUV光刻机， 并切断已售设备的全生命 周期服务，要求盟友 150天内与美方标准完全对齐，意图封堵我国先进制程升级 通道。相较于制造端承压， 产化）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：HBM成为整个国产算力链最大卡点，多个公司和渠道反应HBM明年进口量将锐减，HBM国产化势在必行；提升良率为大陆HBM最大工艺卡点；超声波扫描设备在DDR5产线中为抽检，到HBM产线则成全检，设备需求量翻四倍。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：骄成超声在YMTC完成设备验证并取得重复订单，与超过10家先进封装及头部Fab建立合作；长鑫存储DRAM出货量份额攀升至9%，缩小与美光差距；SK海力士董事长称“各家公司对存储芯片的争夺如同一场战争”。\u003c/li>\n\u003cli>\u003cstrong>对应证据来源\u003c/strong>：07:50 HYDZ HL；13:32 SK集团董事长专访；半导体主线证据包补充证据\u003c/li>\n\u003c/ul>\n\u003ch3>主线3：PCB/CCL（M10材料升级）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：M10材料有所推进，近期完成一轮测试，性能相比M9明显提高；PTFE电性能优秀但可加工性尚未有良好解决方案，M10可加工性相对较好，等待电性能测试结果通过；M10与PTFE同为NV重点推进方案，优劣势不同。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：天风郭明錤称英伟达M10新一代高频覆铜板CCL正式启动全流程测试；南亚新材M10进展顺利，传统CCL涨价未央、9月后旺季可期；预计今年完成验证、2027年大规模量产。\u003c/li>\n\u003cli>\u003cstrong>对应证据来源\u003c/strong>：10:01；10:46；13:07国联民生电子；14:40南亚新材更新\u003c/li>\n\u003c/ul>\n\u003ch3>主线4：光通信/CPO\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：英伟达激光器数量下降4倍，理解为相较于同等容量电交换机中光模块使用的EML激光器数量下降4倍——从每个通道一颗EML到4个通道共享一个CW；以Spextrum 102.4T容量对应128颗高功率激光器；1.6T硅光方案下激光器数量或仅下降2倍甚至不下降。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：Lumentum业绩会表述积极，指引26Q3 OCS营收首超1亿美元、重申26H2超4亿美元目标；天孚通信CPO专家交流纪要202608（正文已提取）；天风通信重申“跌出的分歧和黄金坑”，光互联头部厂商位置/估值处低位。\u003c/li>\n\u003cli>\u003cstrong>对应证据来源\u003c/strong>：07:49 OCS趋势明确-英唐智控；10:47；11:50天风通信；天孚通信CPO专家交流纪要202608（正文已提取）\u003c/li>\n\u003c/ul>\n\u003ch3>主线5：新能源/光伏（反内卷+海外需求共振）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：电池价格从0.30→0.34元/W连续跳涨，采询单大幅增多；涨因是反内卷价格指导叠加海外需求旺盛；硅片同步跟涨9%–12%。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：N型183.75mm TOPCon均价0.34元/W（+13.33%）；美国232法案落地刺激补货订单、印度ALMM实施节奏变化促使抢装、印尼/非洲/土耳其等新兴市场需求提升；长江电新口径硅片价格相比7月底上涨0.1–0.32元/片，电池涨2–3分/W。\u003c/li>\n\u003cli>\u003cstrong>对应证据来源\u003c/strong>：07:54长江电新；14:26长江电新\u003c/li>\n\u003c/ul>\n\u003ch3>主线6：液冷/电源（算力供电架构升级）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：液冷与高压化正重塑数据中心供电架构并拉动高端铜材需求，
