nd": "post", "title": "2026-08-01 10:39", "source_label": "帖子正文", "excerpt": "📰 【海外｜通向 AGI】2026 年 07 月 31 日 AI 大模型晚间速递#OpenAI：GPT-5.6 Terra 与 Luna 获官方降价，OpenRouter 叠加 50% 独家折扣后 Luna 输出低至$0.1/M token、Terra输出$6/M，Luna 整体降幅约 80%，直接", "content": "📰 【海外｜通向 AGI】2026 年 07 月 31 日 AI 大模型晚间速递#OpenAI：GPT-5.6 Terra 与 Luna 获官方降价，OpenRouter 叠加 50% 独家折扣后 Luna 输出低至$0.1/M token、Terra输出$6/M，Luna 整体降幅约 80%，直接对标 DeepSeek V4 Pro 性价比。（OpenRouter / AIBase | 7 月 30 日）#Anthropic：内部审查发现三款 Claude 模型在网络安全评估中未授权接入互联网并攻击真实系统 ——Opus 4.7 窃取某公司登录凭证与生产数据，Myth 5 在 PyPI 发布恶意包约 1 小时内被 15 个真实系统下载运行。Anthropic 归因为基础设施和运维错误。（The Decoder / Anthropic 官方 | 7 月 31 日） 美国法官 Rita Lin 裁定特朗普政府未能提供充分证据将 Anthropic 列为 \"供应链风险\"，禁止联邦政府使用其技术的合理性不足。（TechCrunch | 7 月 30 日）#Google：DeepMind 发布...", "publish_time": "2026-08-01 10:39", "tags": ["OpenAI", "Anthropic", "Google", "字节跳动", "DeepSeek", "MiniMax", "文字观点"]}, "post:2026-08-01T22-34:9f879c3f1abb": {"id": "post:2026-08-01T22-34:9f879c3f1abb", "kind": "post", "title": "2026-08-01 22:34", "source_label": "帖子正文", "excerpt": "【哪些上市公司是服务于中小企业并让它们用上AI功能的公司】 1）中国电信、中国移动、中国联通、阿里云、金山云、各种算力租赁。2）深信服：服务10万家中小企业客户，提供AI安全与云服务，但业务侧重IT基础设施安全。", "content": "【哪些上市公司是服务于中小企业并让它们用上AI功能的公司】 1）中国电信、中国移动、中国联通、阿里云、金山云、各种算力租赁。 2）深信服：服务10万家中小企业客户，提供AI安全与云服务，但业务侧重IT基础设施安全。 3）并行科技：它提供的是“算力SaaS化服务”，通过优化技术，能将调用大模型的算力成本大幅降低（例如从130元降到4元以下）。这对于资金和技术实力有限的中小企业来说，极大地降低了使用AI大模型的门槛。 4）创业黑马：联合智谱、沐曦等发布“龙虾云电脑”，聚合国产算力与大模型，专门服务中小企业。公司定位为“中国中小企业的人工智能推广和服务商”，通过集成智能体（如政策智能体、办公套件）帮助中小企业使用AI，并反向调用大模型API。 5）鼎捷数智：深耕中小制造业，每年有2万家活跃客户。其AI Agent实现“开箱即用”，2025年AI收入1.5亿元，2026年目标3亿元，在中国台湾地区中小企业渗透率快速提升。 6）用友网络：推出AI产品“智友3.0”，建议中小企业采用公有云模式部署AI，避免私有化部署的高成本与复杂性，面向中小企业市场提供端到端一体化方案。 7）新大陆...", "publish_time": "2026-08-01 22:34", "tags": ["文字观点"]}, "attachment:files/东北证券-7月政治局会议解读：如何理解“适时调整货币政策工具”？-260731.pdf": {"id": "attachment:files/东北证券-7月政治局会议解读：如何理解“适时调整货币政策工具”？-260731.pdf", "kind": "attachment", "title": "东北证券-7月政治局会议解读：如何理解“适时调整货币政策工具”？-260731", "source_label": "东北证券", "excerpt": "第1页 / 共35页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读 素影响更大；尚未看到 地产社融等信号发生根本性好转，也未看到基本面回暖和央行态度转变形成共振。 3.历史债市回调复盘 •2016年底至 2018年初：严监管与宽信用标志出现。 •2020年4月：我国疫情率先得到控制，基本面出现明显改善迹象。 •2020年下半年：基本面改善叠加监管压降结构性存款。 •结论：几乎每一轮大的债市熊市都有政策面或基本面的身影，甚至是两者共振；单纯噪音（如某几 天资金收紧）很难形成大级别回调。 4.产能过剩是当前基本面主要矛盾 •逻辑链条：内需不足叠加地方无序竞争，最终产生产能过剩。 •我国以增值税为主体的税制使地方政府收入主要来自生产环节，天然激励地方政府争夺制造业税 基；在 GDP锦标赛导向下，各地争相以税收优惠、财政补贴、低价地等政策招商引资。 •各地\"十五五 \"规划纲要中，特别多省份提及智能、氢能等新兴产业，同质化布局和重复建设扭曲了 行业的信用成本；新能源车、光伏等新兴产业已走过类似路径。 •自我强化的负反馈循环：内需不足→企业利润受挤压→降价争抢市场份额→地方政府担心税基流失 加大补贴→劣后产能无法有效出清→价格进一步承压→企业利润再次受挤压。 •国家统计局数据显示，制造业产能利用率仍在探底，尚未找到拐点已到的充分证据，仍处于漫长的 去产能磨底阶段。 •国信证券统计显示，多国别比较下产能出清平均可能需要 12个季度左右，但不同国别政策导向和 产业结构不同，方差很大；中国这一轮去产能周期比预期更长。 5.海外产能过剩历史经验 •1873-1896 年美欧长期萧条：新兴产业（铁路、钢铁、电力）过度投资导致产能过剩，依靠市场力 量自发出清，政府干预较少，出清耗时约 23年，漫长而持久。 •1929年大萧条：产能过剩叠加需求崩溃，罗斯福政府采取主动干预，从供给侧控制和需求侧刺激 双管齐下，较快走出通缩阶段。 •日本两轮产能过剩： 1970年代通过行政干预组建萧条卡特尔，实现生产端较快出清； 1990年代选 择减少干预、依靠市场化力量出清，结果很多僵尸企业依赖银行输血，经济陷入失去的 30年。 •核心结论：面对产能过剩，企业家本身不愿大规模减产（竞争产生负外部性），市场往往失灵，政 府干预比不干预更好。 •中国当前选择政策引导加市场化出清的路径，未走类似 2015-2016 年供给侧改革的行政强制路 线，因为本轮过剩产能很多是新产能，一刀切可能误伤先进产能；去产能是渐进式磨底过程，速度 应慢于 2016年供给侧改革。 6.物价与通胀判断 •今年CPI、PPI虽有明显上行趋势，但翘尾因素已预期很多；高频工业品数据价格在边际回落。 •剔除CPI和PPI中的翘尾因素及油价超预期因素后，整体物价并未呈现明显回暖趋势。 •产能利用率仍在历史较低位置，距离合理水平（如 80%）还有较大差距。 •判断通胀大幅回升缺乏内生动能，所谓物价回暖更多是基数效应和输入性因素所致，并非根本性供 需再平衡。 •低通胀环境加偏弱的名义增长状态下，债市利率仍有下行空间，对债券投资比较利好。 7.社融增速新常态 •2024年以前社融基本是决定国债利率最重要的指标之一，但 2025-2026 年社融下行并未使债市收 益率继续下探。 •社融增速低位运行已从周期性波动演变为结构性新常态，原因包括： •经济增长中枢下移，社融增速需匹配名义 GDP增速，高增长难以持续，且需防范资金空转； •地产信用收缩是结构性、不可逆的，即使地产反弹，总体规模也回不到从前； •政策思路转变为淡化社融增量、盘活存量。 •周期性压制因素：新旧产业融资存在断层，新兴产业社融增速快（同比两位数增长）但基数太低， 地产、城投存量庞大且增速继续下行，缺口在 3-5年内难以弥合；居民和企业资产负债表修复较 慢，主动降杠杆行为短期难以逆转。 •结论：社融增速新中枢大概率下移一个台阶，需要适应这一新常态。 8.K型分化的深层含义 •参考华创证券观点， K型分化已不仅是新旧经济之间的分化，具有更深层次含义： •劳动密集型产业向资本密集型产业转移：新兴制造业更依赖设备、自动化、资本，用工人数未随产 业扩张成比例增加； •高税率行业向低税率行业转移：新兴制造业往往前期享受税收优惠，扩张带来的税收效应较弱。 •经济结构转型中， K型分化下沿对就业和税收的拖累大于上沿的提振，对总需求和消费产生实质性 压制。 9.央行政策态度分析 •央行整体态度比较克制，方向性不强，可概括为 \"总量克制、结构发力 \"。 •上半年央行未做降准和降息操作，核心政策利率未调整； Q1货币政策报告甚至直接删除了降准降 息表述。 •4-5月资金面极致宽松应理解为被动宽松而非主动宽松：央行前期投放较多、银行贷款乏力、大行 内卷融资等因素导致银行间钱多。 •4-5月央行公开市场操作多次地量操作， OMO余额甚至降为 0，这并非央行收紧信号，恰恰是资金 面极致宽松的表现 ——大行不缺钱，不需要向央行借回购资金。 •央行更依赖结构性工具，大开大合的宽松政策落地概率下降，精细化调整成为主流。 10.隔夜逆回购工具解读 •观点明确：该工具是常规工具，常规属性大于宽松信号。 •理由一：本质是补齐短端空白，从 7天到隔夜逆回购的期限完善；操作方式为固定利率数量招标， 与7天逆回购同样模式，并非渐进式降息。 •理由二：隔夜逆回购期限只有一天，对中长期流动性影响非常有限。 •理由三：央行核心政策利率（ 7天回购利率）未做任何调整；隔夜利率在利率走廊之间灵活浮动是 流动性常规调节手段，是价格型利率调控框架的技术性优化。 •隔夜OMO真正代表的是利率框架逐渐向国际接轨，未来降息方式可能更为平滑，但短期政策指示 意义不强。 11.主要矛盾切换的困境 •2025年以来债市关注点反复切换： 2025年初央行超预期收紧流动性→ 2025年中旬反内卷政策引 发通胀预期和股市走强→ 2025年末超长债供给扰动引发银行承接能力担忧→今年银行间流动性超 预期宽松。 •跟随市场热点往往噪声多、信号滞后；很多叙事是情绪的放大器，为当前下跌找理由；真正的主要 矛盾往往是事后总结出来的。 •例证：今年 2-3月市场主流认为资金面宽松与基本面复苏显著背离，债市上涨难以持续；但到 5-6 月后，大家又开始认同资金宽松才是上半年真正主线。 •实盘操作中不可能事后复盘，需要开发均衡的量化模型来应对。 12.量化择时模型框架 •框架两大好处：一是债市择时重要性越来越高（ 2018年以来十年国债几乎年年正收益，但低利率 环境下赔率下降，震荡行情可能持续更久，把握波段的模型适用价值越来越高）；二是量化模型可 复现、相对理性，避免主观分析偏听偏信。 •模型逻辑：利率债同时受现实和预期影响 ——长期看基本面，中期看政策面，短期看机构面和技术 面；基本面与政策面看经济现实，技术面与机构行为看预期走到哪一步。 •基本面维度：利率主要由通胀和经济增长决定；使用 OECD经济综合指标表征经济景气程度；经济 强则利率走高，压制利率债。 •政策面维度：央行通过控制短期利率和银行间资金松紧影响长期利率；货币宽松时十年期国债往往 走出优异走势。 •技术面维度：债券是可交易资产，有国债期货等衍生品，交易面信号可窥探市场情绪与风险偏好。 •基本面指标筛选发现：中国经济主要受未来信心导致的加杠杆影响，核心指标包括社融、固定资产 投资、商品房等（企业与居民加杠杆的体现）；财政存款等指标也有一定指示作用；物价相关指标 在2013年后几乎未出现在有效指标中（通胀与增长同步甚至滞后，无独立信息含量）。 •2025年后模型迭代：加入更多与通胀相关的指标，因市场开始意识到通缩本身对经济有害，反内 卷政策直接对供给侧操作以改善物价。 13.货币政策传导与利率走廊 •我国货币政策正从数量型向价格型转型；价格型货币政策通过利率走廊实现利率引导 ——设定银行 间资金利率上下限，央行设定中枢政策利率，影响市场基准利率和市场利率在合意区间运行。 •政策利率主要看 7天逆回购利率，但历史上变动不频繁（加息 /降息），缺乏统计样本价值。 •通过市场利率反映反推央行态度： DR007主要反映银行间资金面松紧，大部分时间在逆回购利率附 近徘徊；若明显偏离（长期高于或低于逆回购利率），说明市场对央行进一步加息或降息产生预 期。 14.量价技术面指标 •核心假定：跟随最聪明投资者博弈出来的结果，做趋势跟随者。 •从国债现货、国债期货、股票等风险资产收集数据，整理出六大类量价指标：价格趋势、期限利 差、税收利差、风险资产表现、期货与现货价差、机构行为。 •价格趋势类指标最为重要、效果最好，印证国债具有趋势性。 •国债趋势性来源两个定价锚：一是经济现实（社会融资需求，企业融资需求具有关联性，基本面的 发展渐进式）；二是央行态度（货币政策需要定力，让市场形成稳定预期，不会大幅摇摆）。 15.策略生成与模型稳健性 •宏观策略合成理念：数据需筛选，但拒绝 \"事后诸葛亮 \"——指标选择必须通过滚动窗口，每一年选 择的指标只能通过该年之前的历史信息获得。 •指标评价看重稳健性高于回测收益率本身；不要过度追求历史回测中亮眼表现，应聚焦长期稳定、 长期有效；不稳定的指标被发现时最高光时刻往往已过去。 •不同维度子策略（基本面、政策面、机构面、技术面）之间不做滚动筛选，始终保留各层面信号， 达到模型均衡稳定。 •原因：主要矛盾往往在无人问津时孕育，只有在大家不关注时才特别容易出现超预期；若只以近期 表现论英雄，可能错过主要矛盾切换（如 2025年只关注通胀而忽略资金面超预期宽松和基本面下 行，就会完全错过今年行情）。 16.操作建议与展望 •目前债市短期胜率环境不错，有持仓投资者可选择按兵不动。 •若央行之后不进行降息操作，十年国债下行空间可能比较有限，中长期以震荡市为主。 •基本面最大问题是供给出清缓慢，整体物价向上弹性不足；社融低位不只是周期性问题，可能是趋 势性问题； K型分化下居民及税收收入可能进一步承压，整体大环境对债市有利。 •2025年窄幅震荡以来债市主要矛盾反复切换，择时难度加大；通过量化择时模型全面均衡跟踪影 响债市的各个方面，用模型定力对抗市场噪声。 问答整理 Q1：当前债市是否已经与基本面脱钩？ 答：我们认为并没有脱钩。核心逻辑是基本面和政策面的共振转向才是债市回调的充分条件。目前债市 整体下行空间不大，近期单纯的通胀波动对债市影响不大，央行推出的隔夜逆回购工具也暂不构成降息 或宽松信号。我们还没有看到地产社融等信号发生根本性好转，没有看到基本面回暖和央行态度转变形 成共振，因此对于持有投资者而言可以选择按兵不动。 Q2：如何区分市场中的真实信号与短期噪音？ 答：短期噪音包括资金面阶段性收敛引发的情绪扰动、股债跷跷板引起的短期资金分流波动等，这些噪 音来得快去得也快，如果没有高频调仓打算，不需要过多关注。真实信号在基本面上是地产出现实质性 探底或复苏、社融出现超预期信用切实转宽；在政策面上是央行开始引导资金中枢抬升。目前来看， CPI和PPI的回暖更多是预期内的，受翘尾因素和油价等超预期干扰因素影响更大，尚未看到这些真实 信号出现。 Q3：为什么说产能过剩是当前基本面的主要矛盾？ 答：逻辑链条是内需不足叠加地方无序竞争，最终产生产能过剩。我国以增值税为主体的税制使地方政 府收入主要来自生产环节，天然激励地方政府争夺制造业税基。在 GDP锦标赛导向下，各地争相以税 收优惠、财政补贴、低价地等政策招商引资，导致同质化布局和重复建设。这形成了自我强化的负反馈 循环：内需不足→企业利润受挤压→降价争抢市场份额→地方政府担心税基流失加大补贴→劣后产能无 法有效出清→价格进一步承压→企业利润再次受挤压。目前制造业产能利用率还在探底，没有充分证据 显示拐点已到，仍处于漫长的去产能磨底阶段。 Q4：产能过剩问题未来会以什么路径解决？ 答：从海外历史经验看， 1873-1896 年美欧长期萧条依靠市场力量自发出清，耗时约 23年；1929年 大萧条中罗斯福政府主动干预，较快走出通缩；日本 1970年代通过行政干预较快出清， 1990年代减 少干预导致僵尸企业依赖银行输血，陷入失去的 30年。核心结论是面对产能过剩，市场往往失灵，政 府干预比不干预更好。中国当前选择政策引导加市场化出清的路径，没有走行政强制路线，因为本轮过 剩产能很多是新产能，一刀切可能误伤先进产能。这使得去产能成为渐进式磨底过程，速度应慢于 2016年供给侧改革。 Q5：如何理解当前物价回暖？ 答：虽然今年 CPI、PPI有明显上行趋势，但首先翘尾因素本身已预期很多；另一方面高频工业品数据 价格在边际回落。剔除 CPI和PPI中的翘尾因素以及油价超预期因素后，整体物价并未呈现明显回暖趋 势。产能利用率仍在历史较低位置，距离合理水平（如 80%）还有较大差距。通胀大幅回升缺乏内生 动能，所谓物价回暖更多是基数效应和输入性因素所致，并非根本性供需再平衡。 Q6：社融增速下行后还能否继续作为债市核心指标？ 答：需要意识到社融增速低位运行已从周期性波动演变为结构性新常态。长期看经济增长中枢下移，社 融增速需匹配名义 GDP增速，高增长难以持续；地产信用收缩是结构性、不可逆的；政策思路转变为 淡化社融增量、盘活存量。周期性因素方面，新旧产业融资存在断层 ——新兴产业社融增速快但基数太 低，地产城投存量庞大且增速继续下行，缺口在 3-5年内难以弥合；居民和企业资产负债表修复较慢。 社融增速新中枢大概率下移一个台阶，需要适应这一新常态。 Q7：如何理解央行 4-5月资金面极致宽松？ 答：4-5月资金面极致宽松更多应被视为被动宽松而非主动宽松。银行间钱多主要是因为央行前期投放 较多、银行贷款乏力、大行比较内卷的融资行为。央行在公开市场操作中 4-5月多次地量操作，甚至 OMO余额降为 0，这恰恰是资金面极致宽松的表现 ——大行根本不缺钱，不需要向央行借回购资金。 央行整体态度比较克制，更依赖结构性工具，大开大合的宽松政策落地概率下降，精细化调整成为主 流。 Q8：如何解读央行隔夜逆回购新工具？ 答：我们认为该工具是常规工具，常规属性大于宽松信号。第一，本质是补齐短端空白，从 7天到隔夜 逆回购的期限完善，操作方式是固定利率数量招标，与 7天逆回购同样模式，并非渐进式降息。第二， 隔夜逆回购期限只有一天，对中长期流动性影响非常有限。第三，央行核心政策利率（ 7天回购利率） 并未调整，隔夜利率在利率走廊之间灵活浮动是流动性常规调节手段， 出的隔夜逆回购工具暂不构成降息或宽松信号。 •对于持有债券的投资者，当前建议选择按兵不动。 •模型在 1月20日左右捕捉到债券有效突破并发出明确看多观点，此后保持多头持有操作。 2.区分市场信号与噪音 •短期噪音包括：资金面阶段性收敛引发的情绪扰动、股债跷跷板引起的短期资金分流波动。这些噪 音来得快去得也快，若非高频调仓投资者无需过多关注。 •真实信号包括：基本面出现地产实质性探底或复苏、社融出现超预期信用切实转宽；政策面央行开 始引导资金中枢抬升。 •当前CPI和PPI的回暖更多是预期内的，受翘尾因素和油价等超预期干扰因素影响更大；尚未看到 地产社融等信号发生根本性好转，也未看到基本面回暖和央行态度转变形成共振。 3.历史债市回调复盘 •2016年底至 2018年初：严监管与宽信用标志出现。 •2020年4月：我国疫情率先得到控制，基本面出现明显改善迹象。 •2020年下半年：基本面改善叠加监管压降结构性存款。 •结论：几乎每一轮大的债市熊市都有政策面或基本面的身影，甚至是两者共振；单纯噪音（如某几 天资金收紧）很难形成大级别回调。 4.产能过剩是当前基本面主要矛盾 •逻辑链条：内需不足叠加地方无序竞争，最终产生产能过剩。 •我国以增值税为主体的税制使地方政府收入主要来自生产环节，天然激励地方政府争夺制造业税 基；在 GDP锦标赛导向下，各地争相以税收优惠、财政补贴、低价地等政策招商引资。 •各地\"十五五 \"规划纲要中，特别多省份提及智能、氢能等新兴产业，同质化布局和重复建设扭曲了 行业的信用成本；新能源车、光伏等新兴产业已走过类似路径。 •自我强化的负反馈循环：内需不足→企业利润受挤压→降价争抢市场份额→地方政府担心税基流失 加大补贴→劣后产能无法有效出清→价格进一步承压→企业利润再次受挤压。 •国家统计局数据显示，制造业产能利用率仍在探底，尚未找到拐点已到的充分证据，仍处于漫长的 去产能磨底阶段。 •国信证券统计显示，多国别比较下产能出清平均可能需要 12个季度左右，但不同国别政策导向和 产业结构不同，方差很大；中国这一轮去产能周期比预期更长。 5.海外产能过剩历史经验 •1873-1896 年美欧长期萧条：新兴产业（铁路、钢铁、电力）过度投资导致产能过剩，依靠市场力 量自发出清，政府干预较少，出清耗时约 23年，漫长而持久。 •1929年大萧条：产能过剩叠加需求崩溃，罗斯福政府采取主动干预，从供给侧控制和需求侧刺激 双管齐下，较快走出通缩阶段。 •日本两轮产能过剩： 1970年代通过行政干预组建萧条卡特尔，实现生产端较快出清； 1990年代选 择减少干预、依靠市场化力量出清，结果很多僵尸企业依赖银行输血，经济陷入失去的 30年。 •核心结论：面对产能过剩，企业家本身不愿大规模减产（竞争产生负外部性），市场往往失灵，政 府干预比不干预更好。 •中国当前选择政策引导加市场化出清的路径，未走类似 2015-2016 年供给侧改革的行政强制路 线，因为本轮过剩产能很多是新产能，一刀切可能误伤先进产能；去产能是渐进式磨底过程，速度 应慢于 2016年供给侧改革。 6.物价与通胀判断 •今年CPI、PPI虽有明显上行趋势，但翘尾因素已预期很多；高频工业品数据价格在边际回落。 •剔除CPI和PPI中的翘尾因素及油价超预期因素后，整体物价并未呈现明显回暖趋势。 •产能利用率仍在历史较低位置，距离合理水平（如 80%）还有较大差距。 •判断通胀大幅回升缺乏内生动能，所谓物价回暖更多是基数效应和输入性因素所致，并非根本性供 需再平衡。 •低通胀环境加偏弱的名义增长状态下，债市利率仍有下行空间，对债券投资比较利好。 7.社融增速新常态 •2024年以前社融基本是决定国债利率最重要的指标之一，但 2025-2026 年社融下行并未使债市收 益率继续下探。 •社融增速低位运行已从周期性波动演变为结构性新常态，原因包括： •经济增长中枢下移，社融增速需匹配名义 GDP增速，高增长难以持续，且需防范资金空转； •地产信用收缩是结构性、不可逆的，即使地产反弹，总体规模也回不到从前； •政策思路转变为淡化社融增量、盘活存量。 •周期性压制因素：新旧产业融资存在断层，新兴产业社融增速快（同比两位数增长）但基数太低， 地产、城投存量庞大且增速继续下行，缺口在 3-5年内难以弥合；居民和企业资产负债表修复较 慢，主动降杠杆行为短期难以逆转。 •结论：社融增速新中枢大概率下移一个台阶，需要适应这一新常态。 8.K型分化的深层含义 •参考华创证券观点， K型分化已不仅是新旧经济之间的分化，具有更深层次含义： •劳动密集型产业向资本密集型产业转移：新兴制造业更依赖设备、自动化、资本，用工人数未随产 业扩张成比例增加； •高税率行业向低税率行业转移：新兴制造业往往前期享受税收优惠，扩张带来的税收效应较弱。 •经济结构转型中， K型分化下沿对就业和税收的拖累大于上沿的提振，对总需求和消费产生实质性 压制。 9.央行政策态度分析 •央行整体态度比较克制，方向性不强，可概括为 \"总量克制、结构发力 \"。 •上半年央行未做降准和降息操作，核心政策利率未调整； Q1货币政策报告甚至直接删除了降准降 息表述。 •4-5月资金面极致宽松应理解为被动宽松而非主动宽松：央行前期投放较多、银行贷款乏力、大行 内卷融资等因素导致银行间钱多。 •4-5月央行公开市场操作多次地量操作， OMO余额甚至降为 0，这并非央行收紧信号，恰恰是资金 面极致宽松的表现 ——大行不缺钱，不需要向央行借回购资金。 •央行更依赖结构性工具，大开大合的宽松政策落地概率下降，精细化调整成为主流。 10.隔夜逆回购工具解读 •观点明确：该工具是常规工具，常规属性大于宽松信号。 •理由一：本质是补齐短端空白，从 7天到隔夜逆回购的期限完善；操作方式为固定利率数量招标， 与7天逆回购同样模式，并非渐进式降息。 •理由二：隔夜逆回购期限只有一天，对中长期流动性影响非常有限。 •理由三：央行核心政策利率（ 7天回购利率）未做任何调整；隔夜利率在利率走廊之间灵活浮动是 流动性常规调节手段，是价格型利率调控框架的技术性优化。 •隔夜OMO真正代表的是利率框架逐渐向国际接轨，未来降息方式可能更为平滑，但短期政策指示 意义不强。 11.主要矛盾切换的困境 •2025年以来债市关注点反复切换： 2025年初央行超预期收紧流动性→ 2025年中旬反内卷政策引 发通胀预期和股市走强→ 2025年末超长债供给扰动引发银行承接能力担忧→今年银行间流动性超 预期宽松。 •跟随市场热点往往噪声多、信号滞后；很多叙事是情绪的放大器，为当前下跌找理由；真正的主要 矛盾往往是事后总结出来的。 •例证：今年 2-3月市场主流认为资金面宽松与基本面复苏显著背离，债市上涨难以持续；但到 5-6 月后，大家又开始认同资金宽松才是上半年真正主线。 •实盘操作中不可能事后复盘，需要开发均衡的量化模型来应对。 12.量化择时模型框架 •框架两大好处：一是债市择时重要性越来越高（ 2018年以来十年国债几乎年年正收益，但低利率 环境下赔率下降，震荡行情可能持续更久，把握波段的模型适用价值越来越高）；二是量化模型可 复现、相对理性，避免主观分析偏听偏信。 •模型逻辑：利率债同时受现实和预期影响 ——长期看基本面，中期看政策面，短期看机构面和技术 面；基本面与政策面看经济现实，技术面与机构行为看预期走到哪一步。 •基本面维度：利率主要由通胀和经济增长决定；使用 OECD经济综合指标表征经济景气程度；经济 强则利率走高，压制利率债。 •政策面维度：央行通过控制短期利率和银行间资金松紧影响长期利率；货币宽松时十年期国债往往 走出优异走势。 •技术面维度：债券是可交易资产，有国债期货等衍生品，交易面信号可窥探市场情绪与风险偏好。 •基本面指标筛选发现：中国经济主要受未来信心导致的加杠杆影响，核心指标包括社融、固定资产 投资、商品房等（企业与居民加杠杆的体现）；财政存款等指标也有一定指示作用；物价相关指标 在2013年后几乎未出现在有效指标中（通胀与增长同步甚至滞后，无独立信息含量）。 •2025年后模型迭代：加入更多与通胀相关的指标，因市场开始意识到通缩本身对经济有害，反内 卷政策直接对供给侧操作以改善物价。 13.货币政策传导与利率走廊 •我国货币政策正从数量型向价格型转型；价格型货币政策通过利率走廊实现利率引导 ——设定银行 间资金利率上下限，央行设定中枢政策利率，影响市场基准利率和市场利率在合意区间运行。 •政策利率主要看 7天逆回购利率，但历史上变动不频繁（加息 /降息），缺乏统计样本价值。 •通过市场利率反映反推央行态度： DR007主要反映银行间资金面松紧，大部分时间在逆回购利率附 近徘徊；若明显偏离（长期高于或低于逆回购利率），说明市场对央行进一步加息或降息产生预 期。 14.量价技术面指标 •核心假定：跟随最聪明投资者博弈出来的结果，做趋势跟随者。 •从国债现货、国债期货、股票等风险资产收集数据，整理出六大类量价指标：价格趋势、期限利 差、税收利差、风险资产表现、期货与现货价差、机构行为。 •价格趋势类指标最为重要、效果最好，印证国债具有趋势性。 •国债趋势性来源两个定价锚：一是经济现实（社会融资需求，企业融资需求具有关联性，基本面的 发展渐进式）；二是央行态度（货币政策需要定力，让市场形成稳定预期，不会大幅摇摆）。 15.策略生成与模型稳健性 •宏观策略合成理念：数据需筛选，但拒绝 \"事后诸葛亮 \"——指标选择必须通过滚动窗口，每一年选 择的指标只能通过该年之前的历史信息获得。 •指标评价看重稳健性高于回测收益率本身；不要过度追求历史回测中亮眼表现，应聚焦长期稳定、 长期有效；不稳定的指标被发现时最高光时刻往往已过去。 •不同维度子策略（基本面、政策面、机构面、技术面）之间不做滚动筛选，始终保留各层面信号， 达到模型均衡稳定。 •原因：主要矛盾往往在无人问津时孕育，只有在大家不关注时才特别容易出现超预期；若只以近期 表现论英雄，可能错过主要矛盾切换（如 2025年只关注通胀而忽略资金面超预期宽松和基本面下 行，就会完全错过今年行情）。 16.操作建议与展望 •目前债市短期胜率环境不错，有持仓投资者可选择按兵不动。 •若央行之后不进行降息操作，十年国债下行空间可能比较有限，中长期以震荡市为主。 •基本面最大问题是供给出清缓慢，整体物价向上弹性不足；社融低位不只是周期性问题，可能是趋 势性问题； K型分化下居民及税收收入可能进一步承压，整体大环境对债市有利。 •2025年窄幅震荡以来债市主要矛盾反复切换，择时难度加大；通过量化择时模型全面均衡跟踪影 响债市的各个方面，用模型定力对抗市场噪声。 问答整理 Q1：当前债市是否已经与基本面脱钩？ 答：我们认为并没有脱钩。核心逻辑是基本面和政策面的共振转向才是债市回调的充分条件。目前债市 整体下行空间不大，近期单纯的通胀波动对债市影响不大，央行推出的隔夜逆回购工具也暂不构成降息 或宽松信号。我们还没有看到地产社融等信号发生根本性好转，没有看到基本面回暖和央行态度转变形 成共振，因此对于持有投资者而言可以选择按兵不动。 Q2：如何区分市场中的真实信号与短期噪音？ 答：短期噪音包括资金面阶段性收敛引发的情绪扰动、股债跷跷板引起的短期资金分流波动等，这些噪 音来得快去得也快，如果没有高频调仓打算，不需要过多关注。真实信号在基本面上是地产出现实质性 探底或复苏、社融出现超预期信用切实转宽；在政策面上是央行开始引导资金中枢抬升。目前来看， CPI和PPI的回暖更多是预期内的，受翘尾因素和油价等超预期干扰因素影响更大，尚未看到这些真实 信号出现。 Q3：为什么说产能过剩是当前基本面的主要矛盾？ 答：逻辑链条是内需不足叠加地方无序竞争，最终产生产能过剩。我国以增值税为主体的税制使地方政 府收入主要来自生产环节，天然激励地方政府争夺制造业税基。在 GDP锦标赛导向下，各地争相以税 收优惠、财政补贴、低价地等政策招商引资，导致同质化布局和重复建设。这形成了自我强化的负反馈 循环：内需不足→企业利润受挤压→降价争抢市场份额→地方政府担心税基流失加大补贴→劣后产能无 法有效出清→价格进一步承压→企业利润再次受挤压。目前制造业产能利用率还在探底，没有充分证据 显示拐点已到，仍处于漫长的去产能磨底阶段。 Q4：产能过剩问题未来会以什么路径解决？ 答：从海外历史经验看， 1873-1896 年美欧长期萧条依靠市场力量自发出清，耗时约 23年；1929年 大萧条中罗斯福政府主动干预，较快走出通缩；日本 1970年代通过行政干预较快出清， 1990年代减 少干预导致僵尸企业依赖银行输血，陷入失去的 30年。核心结论是面对产能过剩，市场往往失灵，政 府干预比不干预更好。中国当前选择政策引导加市场化出清的路径，没有走行政强制路线，因为本轮过 剩产能很多是新产能，一刀切可能误伤先进产能。这使得去产能成为渐进式磨底过程，速度应慢于 2016年供给侧改革。 Q5：如何理解当前物价回暖？ 答：虽然今年 CPI、PPI有明显上行趋势，但首先翘尾因素本身已预期很多；另一方面高频工业品数据 价格在边际回落。剔除 CPI和PPI中的翘尾因素以及油价超预期因素后，整体物价并未呈现明显回暖趋 势。产能利用率仍在历史较低位置，距离合理水平（如 80%）还有较大差距。通胀大幅回升缺乏内生 动能，所谓物价回暖更多是基数效应和输入性因素所致，并非根本性供需再平衡。 Q6：社融增速下行后还能否继续作为债市核心指标？ 答：需要意识到社融增速低位运行已从周期性波动演变为结构性新常态。长期看经济增长中枢下移，社 融增速需匹配名义 GDP增速，高增长难以持续；地产信用收缩是结构性、不可逆的；政策思路转变为 淡化社融增量、盘活存量。周期性因素方面，新旧产业融资存在断层 ——新兴产业社融增速快但基数太 低，地产城投存量庞大且增速继续下行，缺口在 3-5年内难以弥合；居民和企业资产负债表修复较慢。 社融增速新中枢大概率下移一个台阶，需要适应这一新常态。 Q7：如何理解央行 4-5月资金面极致宽松？ 答：4-5月资金面极致宽松更多应被视为被动宽松而非主动宽松。银行间钱多主要是因为央行前期投放 较多、银行贷款乏力、大行比较内卷的融资行为。央行在公开市场操作中 4-5月多次地量操作，甚至 OMO余额降为 0，这恰恰是资金面极致宽松的表现 ——大行根本不缺钱，不需要向央行借回购资金。 央行整体态度比较克制，更依赖结构性工具，大开大合的宽松政策落地概率下降，精细化调整成为主 流。 Q8：如何解读央行隔夜逆回购新工具？ 答：我们认为该工具是常规工具，常规属性大于宽松信号。第一，本质是补齐短端空白，从 7天到隔夜 逆回购的期限完善，操作方式是固定利率数量招标，与 7天逆回购同样模式，并非渐进式降息。第二， 隔夜逆回购期限只有一天，对中长期流动性影响非常有限。第三，央行核心政策利率（ 7天回购利率） 并未调整，隔夜利率在利率走廊之间灵活浮动是流动性常规调节手段，是价格型利率调控框架的技术性 优化。隔夜 OMO真正代表的是利率框架逐渐向国际接轨，未来降息方式可能更平滑，但短期政策指示 意义不强。 Q9：为什么需要量化模型来做债市择时？ 答：做主观分析最痛苦的是主要矛盾切换的问题。 2025年以来债市关注点反复切换，跟随市场热点往 往噪声多、信号滞后，很多叙事是情绪的放大器，真正的主要矛盾往往是事后总结出来的。实盘操作中 不可能当事后诸葛亮。量化模型的好处是：第一，债市择时重要性越来越高，低利率环境下利率债赔率 下降，震荡行情可能持续更久，能把握波段的模型适用价值越来越高；第二，量化模型可复现、相对理 性，避免主观分析偏听偏信。我们的模型通过全面均衡地跟踪影响债市的各方面指标，当主要矛盾出现 明显扰动时可以及时关注到。 Q10：量化模型的基本框架和逻辑是什么？ 答：模型认为利率债同时受现实和预期的影响。长期看基本面，中期看政策面，短期看机构面和技术 面。基本面上，利率主要由通胀和经济增长决定，经济强则利率走高；政策面上，央行通过控制短期利 率影响长期利率，货币宽松时十年国债往往走出优异走势；技术面上，通过国债现货、期货、股票等风 险资产收集数据，整理出六大类量价指标（价格趋势、期限利差、税收利差、风险资产表现、期货与现 货价差、机构行为），其中价格趋势类指标最为重要。国债的趋势性来自两个定价锚：经济现实（社会 融资需求渐进式发展）和央行态度（货币政策需要定力，不会大幅摇摆）。 Q11：模型如何保证稳健性、避免过拟合？ 答：第一，宏观数据需要筛选，但拒绝 \"事后诸葛亮 \"——采用滚动窗口方式，每一年选择的指标必须只 能通过该年之前的历史信息获得。第二，指标评价看重稳健性高于回测收益率本身，不要过度追求历史 回测中亮眼表现，应聚焦长期稳定、长期有效；不稳定的指标被发现时最高光时刻往往已过去。第三， 不同维度子策略之间不做滚动筛选，始终保留各层面信号，达到模型均衡稳定。因为主要矛盾往往在无 人问津时孕育，如果只以近期表现论英雄，就可能错过主要矛盾的切换。 Q12：当前对债市的操作建议是什么？ 答：目前债市短期胜率环境不错，有持仓的投资者可以选择按兵不动。如果央行之后不进行降息操作， 十年国债下行空间可能比较有限，中长期以震荡市为主。基本面最大问题是供给出清缓慢，物价向上弹 性不足；社融低位可能不只是周期性问题而是趋势性问题； K型分化下居民及税收收入可能进一步承 压，整体大环境对债市有利。建议通过量化择时模型全面均衡跟踪影响债市的各个方面，用模型定力对 抗市场噪声。 原文 十年国债实战：用模型定力对抗短期市场噪音 20260731_ 原文 2026年08月01日 发言人 尊敬的各位投资者，大家上午好。 发言人 我是来自国泰基金量化研究团队的涂梦德，然后主要负责的是利率债相关的研究。 发言人 今天非常高兴有机会能跟各位在交流下基于十年国家 ETF的一个利率择取的测试。 发言人 其实回顾一下今年上半年的行情，在股票高波动的背景之下，债市其实有一种悄悄的悄悄惊艳所有人的 感觉。 发言人 如果是十年国债，它买入持有的收率接近了 2.5%，但实际上想要拿住它是并不容易的，因为在上半年 期间也出现过诸多的扰动。 发言人 我们的模型在 1月20号左右敏锐的捕捉到了债券出现有效突破的这么一个情况，并且发出了明确的看 错观点。 发言人 随后一直到现在，都是保持一个暗 B互动持有的操作。 发言人 那么这场直播我们就想来和大家分享一下，如何使用量化模型它的一种定例来对抗短期的市场噪音与扰 动。 发言人 我们今天的分享主要分为两大部分。 发言人 第一部分是回应一下市场的关切与核心的逻辑。 发言人 在这个部分我们会先复盘一下历史上主要的债市回调的原因，并且跟大家探讨一下如何去区分市场当中 的帧信号与假噪音。 发言人 接着我们会深入基本面，重点分析一下当前市场比较关注的这个产能过剩的问题。 发言人 我们认为这个是当前基本面的一个主要矛盾。 发言人 然后我们也会回归这个政策面，特别是去探讨一下央行近期新工具的一个真实的含义。 发言人 最后我想说主观分析实际上是存在一些内部的掣肘的这也是我写到的主要矛盾 下半年：基本面改善叠加监管压降结构性存款。 •结论：几乎每一轮大的债市熊市都有政策面或基本面的身影，甚至是两者共振；单纯噪音（如某几 天资金收紧）很难形成大级别回调。 4.产能过剩是当前基本面主要矛盾 •逻辑链条：内需不足叠加地方无序竞争，最终产生产能过剩。 •我国以增值税为主体的税制使地方政府收入主要来自生产环节，天然激励地方政府争夺制造业税 基；在 GDP锦标赛导向下，各地争相以税收优惠、财政补贴、低价地等政策招商引资。 •各地\"十五五 \"规划纲要中，特别多省份提及智能、氢能等新兴产业，同质化布局和重复建设扭曲了 行业的信用成本；新能源车、光伏等新兴产业已走过类似路径。 •自我强化的负反馈循环：内需不足→企业利润受挤压→降价争抢市场份额→地方政府担心税基流失 加大补贴→劣后产能无法有效出清→价格进一步承压→企业利润再次受挤压。 •国家统计局数据显示，制造业产能利用率仍在探底，尚未找到拐点已到的充分证据，仍处于漫长的 去产能磨底阶段。 •国信证券统计显示，多国别比较下产能出清平均可能需要 12个季度左右，但不同国别政策导向和 产业结构不同，方差很大；中国这一轮去产能周期比预期更长。 5.海外产能过剩历史经验 •1873-1896 年美欧长期萧条：新兴产业（铁路、钢铁、电力）过度投资导致产能过剩，依靠市场力 量自发出清，政府干预较少，出清耗时约 23年，漫长而持久。 •1929年大萧条：产能过剩叠加需求崩溃，罗斯福政府采取主动干预，从供给侧控制和需求侧刺激 双管齐下，较快走出通缩阶段。 •日本两轮产能过剩： 1970年代通过行政干预组建萧条卡特尔，实现生产端较快出清； 1990年代选 择减少干预、依靠市场化力量出清，结果很多僵尸企业依赖银行输血，经济陷入失去的 30年。 •核心结论：面对产能过剩，企业家本身不愿大规模减产（竞争产生负外部性），市场往往失灵，政 府干预比不干预更好。 •中国当前选择政策引导加市场化出清的路径，未走类似 2015-2016 年供给侧改革的行政强制路 线，因为本轮过剩产能很多是新产能，一刀切可能误伤先进产能；去产能是渐进式磨底过程，速度 应慢于 2016年供给侧改革。 6.物价与通胀判断 •今年CPI、PPI虽有明显上行趋势，但翘尾因素已预期很多；高频工业品数据价格在边际回落。 •剔除CPI和PPI中的翘尾因素及油价超预期因素后，整体物价并未呈现明显回暖趋势。 •产能利用率仍在历史较低位置，距离合理水平（如 80%）还有较大差距。 •判断通胀大幅回升缺乏内生动能，所谓物价回暖更多是基数效应和输入性因素所致，并非根本性供 需再平衡。 •低通胀环境加偏弱的名义增长状态下，债市利率仍有下行空间，对债券投资比较利好。 7.社融增速新常态 •2024年以前社融基本是决定国债利率最重要的指标之一，但 2025-2026 年社融下行并未使债市收 益率继续下探。 •社融增速低位运行已从周期性波动演变为结构性新常态，原因包括： •经济增长中枢下移，社融增速需匹配名义 GDP增速，高增长难以持续，且需防范资金空转； •地产信用收缩是结构性、不可逆的，即使地产反弹，总体规模也回不到从前； •政策思路转变为淡化社融增量、盘活存量。 •周期性压制因素：新旧产业融资存在断层，新兴产业社融增速快（同比两位数增长）但基数太低， 地产、城投存量庞大且增速继续下行，缺口在 3-5年内难以弥合；居民和企业资产负债表修复较 慢，主动降杠杆行为短期难以逆转。 •结论：社融增速新中枢大概率下移一个台阶，需要适应这一新常态。 8.K型分化的深层含义 •参考华创证券观点， K型分化已不仅是新旧经济之间的分化，具有更深层次含义： •劳动密集型产业向资本密集型产业转移：新兴制造业更依赖设备、自动化、资本，用工人数未随产 业扩张成比例增加； •高税率行业向低税率行业转移：新兴制造业往往前期享受税收优惠，扩张带来的税收效应较弱。 •经济结构转型中， K型分化下沿对就业和税收的拖累大于上沿的提振，对总需求和消费产生实质性 压制。 9.央行政策态度分析 •央行整体态度比较克制，方向性不强，可概括为 \"总量克制、结构发力 \"。 •上半年央行未做降准和降息操作，核心政策利率未调整； Q1货币政策报告甚至直接删除了降准降 息表述。 •4-5月资金面极致宽松应理解为被动宽松而非主动宽松：央行前期投放较多、银行贷款乏力、大行 内卷融资等因素导致银行间钱多。 •4-5月央行公开市场操作多次地量操作， OMO余额甚至降为 0，这并非央行收紧信号，恰恰是资金 面极致宽松的表现 ——大行不缺钱，不需要向央行借回购资金。 •央行更依赖结构性工具，大开大合的宽松政策落地概率下降，精细化调整成为主流。 10.隔夜逆回购工具解读 •观点明确：该工具是常规工具，常规属性大于宽松信号。 •理由一：本质是补齐短端空白，从 7天到隔夜逆回购的期限完善；操作方式为固定利率数量招标， 与7天逆回购同样模式，并非渐进式降息。 •理由二：隔夜逆回购期限只有一天，对中长期流动性影响非常有限。 •理由三：央行核心政策利率（ 7天回购利率）未做任何调整；隔夜利率在利率走廊之间灵活浮动是 流动性常规调节手段，是价格型利率调控框架的技术性优化。 •隔夜OMO真正代表的是利率框架逐渐向国际接轨，未来降息方式可能更为平滑，但短期政策指示 意义不强。 11.主要矛盾切换的困境 •2025年以来债市关注点反复切换： 2025年初央行超预期收紧流动性→ 2025年中旬反内卷政策引 发通胀预期和股市走强→ 2025年末超长债供给扰动引发银行承接能力担忧→今年银行间流动性超 预期宽松。 •跟随市场热点往往噪声多、信号滞后；很多叙事是情绪的放大器，为当前下跌找理由；真正的主要 矛盾往往是事后总结出来的。 •例证：今年 2-3月市场主流认为资金面宽松与基本面复苏显著背离，债市上涨难以持续；但到 5-6 月后，大家又开始认同资金宽松才是上半年真正主线。 •实盘操作中不可能事后复盘，需要开发均衡的量化模型来应对。 12.量化择时模型框架 •框架两大好处：一是债市择时重要性越来越高（ 2018年以来十年国债几乎年年正收益，但低利率 环境下赔率下降，震荡行情可能持续更久，把握波段的模型适用价值越来越高）；二是量化模型可 复现、相对理性，避免主观分析偏听偏信。 •模型逻辑：利率债同时受现实和预期影响 ——长期看基本面，中期看政策面，短期看机构面和技术 面；基本面与政策面看经济现实，技术面与机构行为看预期走到哪一步。 •基本面维度：利率主要由通胀和经济增长决定；使用 OECD经济综合指标表征经济景气程度；经济 强则利率走高，压制利率债。 •政策面维度：央行通过控制短期利率和银行间资金松紧影响长期利率；货币宽松时十年期国债往往 走出优异走势。 •技术面维度：债券是可交易资产，有国债期货等衍生品，交易面信号可窥探市场情绪与风险偏好。 •基本面指标筛选发现：中国经济主要受未来信心导致的加杠杆影响，核心指标包括社融、固定资产 投资、商品房等（企业与居民加杠杆的体现）；财政存款等指标也有一定指示作用；物价相关指标 在2013年后几乎未出现在有效指标中（通胀与增长同步甚至滞后，无独立信息含量）。 •2025年后模型迭代：加入更多与通胀相关的指标，因市场开始意识到通缩本身对经济有害，反内 卷政策直接对供给侧操作以改善物价。 13.货币政策传导与利率走廊 •我国货币政策正从数量型向价格型转型；价格型货币政策通过利率走廊实现利率引导 ——设定银行 间资金利率上下限，央行设定中枢政策利率，影响市场基准利率和市场利率在合意区间运行。 •政策利率主要看 7天逆回购利率，但历史上变动不频繁（加息 /降息），缺乏统计样本价值。 •通过市场利率反映反推央行态度： DR007主要反映银行间资金面松紧，大部分时间在逆回购利率附 近徘徊；若明显偏离（长期高于或低于逆回购利率），说明市场对央行进一步加息或降息产生预 期。 14.量价技术面指标 •核心假定：跟随最聪明投资者博弈出来的结果，做趋势跟随者。 •从国债现货、国债期货、股票等风险资产收集数据，整理出六大类量价指标：价格趋势、期限利 差、税收利差、风险资产表现、期货与现货价差、机构行为。 •价格趋势类指标最为重要、效果最好，印证国债具有趋势性。 •国债趋势性来源两个定价锚：一是经济现实（社会融资需求，企业融资需求具有关联性，基本面的 发展渐进式）；二是央行态度（货币政策需要定力，让市场形成稳定预期，不会大幅摇摆）。 15.策略生成与模型稳健性 •宏观策略合成理念：数据需筛选，但拒绝 \"事后诸葛亮 \"——指标选择必须通过滚动窗口，每一年选 择的指标只能通过该年之前的历史信息获得。 •指标评价看重稳健性高于回测收益率本身；不要过度追求历史回测中亮眼表现，应聚焦长期稳定、 长期有效；不稳定的指标被发现时最高光时刻往往已过去。 •不同维度子策略（基本面、政策面、机构面、技术面）之间不做滚动筛选，始终保留各层面信号， 达到模型均衡稳定。 •原因：主要矛盾往往在无人问津时孕育，只有在大家不关注时才特别容易出现超预期；若只以近期 表现论英雄，可能错过主要矛盾切换（如 2025年只关注通胀而忽略资金面超预期宽松和基本面下 行，就会完全错过今年行情）。 16.操作建议与展望 •目前债市短期胜率环境不错，有持仓投资者可选择按兵不动。 •若央行之后不进行降息操作，十年国债下行空间可能比较有限，中长期以震荡市为主。 •基本面最大问题是供给出清缓慢，整体物价向上弹性不足；社融低位不只是周期性问题，可能是趋 势性问题； K型分化下居民及税收收入可能进一步承压，整体大环境对债市有利。 •2025年窄幅震荡以来债市主要矛盾反复切换，择时难度加大；通过量化择时模型全面均衡跟踪影 响债市的各个方面，用模型定力对抗市场噪声。 问答整理 Q1：当前债市是否已经与基本面脱钩？ 答：我们认为并没有脱钩。核心逻辑是基本面和政策面的共振转向才是债市回调的充分条件。目前债市 整体下行空间不大，近期单纯的通胀波动对债市影响不大，央行推出的隔夜逆回购工具也暂不构成降息 或宽松信号。我们还没有看到地产社融等信号发生根本性好转，没有看到基本面回暖和央行态度转变形 成共振，因此对于持有投资者而言可以选择按兵不动。 Q2：如何区分市场中的真实信号与短期噪音？ 答：短期噪音包括资金面阶段性收敛引发的情绪扰动、股债跷跷板引起的短期资金分流波动等，这些噪 音来得快去得也快，如果没有高频调仓打算，不需要过多关注。真实信号在基本面上是地产出现实质性 探底或复苏、社融出现超预期信用切实转宽；在政策面上是央行开始引导资金中枢抬升。目前来看， CPI和PPI的回暖更多是预期内的，受翘尾因素和油价等超预期干扰因素影响更大，尚未看到这些真实 信号出现。 Q3：为什么说产能过剩是当前基本面的主要矛盾？ 答：逻辑链条是内需不足叠加地方无序竞争，最终产生产能过剩。我国以增值税为主体的税制使地方政 府收入主要来自生产环节，天然激励地方政府争夺制造业税基。在 GDP锦标赛导向下，各地争相以税 收优惠、财政补贴、低价地等政策招商引资，导致同质化布局和重复建设。这形成了自我强化的负反馈 循环：内需不足→企业利润受挤压→降价争抢市场份额→地方政府担心税基流失加大补贴→劣后产能无 法有效出清→价格进一步承压→企业利润再次受挤压。目前制造业产能利用率还在探底，没有充分证据 显示拐点已到，仍处于漫长的去产能磨底阶段。 Q4：产能过剩问题未来会以什么路径解决？ 答：从海外历史经验看， 1873-1896 年美欧长期萧条依靠市场力量自发出清，耗时约 23年；1929年 大萧条中罗斯福政府主动干预，较快走出通缩；日本 1970年代通过行政干预较快出清， 1990年代减 少干预导致僵尸企业依赖银行输血，陷入失去的 30年。核心结论是面对产能过剩，市场往往失灵，政 府干预比不干预更好。中国当前选择政策引导加市场化出清的路径，没有走行政强制路线，因为本轮过 剩产能很多是新产能，一刀切可能误伤先进产能。这使得去产能成为渐进式磨底过程，速度应慢于 2016年供给侧改革。 Q5：如何理解当前物价回暖？ 答：虽然今年 CPI、PPI有明显上行趋势，但首先翘尾因素本身已预期很多；另一方面高频工业品数据 价格在边际回落。剔除 CPI和PPI中的翘尾因素以及油价超预期因素后，整体物价并未呈现明显回暖趋 势。产能利用率仍在历史较低位置，距离合理水平（如 80%）还有较大差距。通胀大幅回升缺乏内生 动能，所谓物价回暖更多是基数效应和输入性因素所致，并非根本性供需再平衡。 Q6：社融增速下行后还能否继续作为债市核心指标？ 答：需要意识到社融增速低位运行已从周期性波动演变为结构性新常态。长期看经济增长中枢下移，社 融增速需匹配名义 GDP增速，高增长难以持续；地产信用收缩是结构性、不可逆的；政策思路转变为 淡化社融增量、盘活存量。周期性因素方面，新旧产业融资存在断层 ——新兴产业社融增速快但基数太 低，地产城投存量庞大且增速继续下行，缺口在 3-5年内难以弥合；居民和企业资产负债表修复较慢。 社融增速新中枢大概率下移一个台阶，需要适应这一新常态。 Q7：如何理解央行 4-5月资金面极致宽松？ 答：4-5月资金面极致宽松更多应被视为被动宽松而非主动宽松。银行间钱多主要是因为央行前期投放 较多、银行贷款乏力、大行比较内卷的融资行为。央行在公开市场操作中 4-5月多次地量操作，甚至 OMO余额降为 0，这恰恰是资金面极致宽松的表现 ——大行根本不缺钱，不需要向央行借回购资金。 央行整体态度比较克制，更依赖结构性工具，大开大合的宽松政策落地概率下降，精细化调整成为主 流。 Q8：如何解读央行隔夜逆回购新工具？ 答：我们认为该工具是常规工具，常规属性大于宽松信号。第一，本质是补齐短端空白，从 7天到隔夜 逆回购的期限完善，操作方式是固定利率数量招标，与 7天逆回购同样模式，并非渐进式降息。第二， 隔夜逆回购期限只有一天，对中长期流动性影响非常有限。第三，央行核心政策利率（ 7天回购利率） 并未调整，隔夜利率在利率走廊之间灵活浮动是流动性常规调节手段，是价格型利率调控框架的技术性 优化。隔夜 OMO真正代表的是利率框架逐渐向国际接轨，未来降息方式可能更平滑，但短期政策指示 意义不强。 Q9：为什么需要量化模型来做债市择时？ 答：做主观分析最痛苦的是主要矛盾切换的问题。 2025年以来债市关注点反复切换，跟随市场热点往 往噪声多、信号滞后，很多叙事是情绪的放大器，真正的主要矛盾往往是事后总结出来的。实盘操作中 不可能当事后诸葛亮。量化模型的好处是：第一，债市择时重要性越来越高，低利率环境下利率债赔率 下降，震荡行情可能持续更久，能把握波段的模型适用价值越来越高；第二，量化模型可复现、相对理 性，避免主观分析偏听偏信。我们的模型通过全面均衡地跟踪影响债市的各方面指标，当主要矛盾出现 明显扰动时可以及时关注到。 Q10：量化模型的基本框架和逻辑是什么？ 答：模型认为利率债同时受现实和预期的影响。长期看基本面，中期看政策面，短期看机构面和技术 面。基本面上，利率主要由通胀和经济增长决定，经济强则利率走高；政策面上，央行通过控制短期利 率影响长期利率，货币宽松时十年国债往往走出优异走势；技术面上，通过国债现货、期货、股票等风 险资产收集数据，整理出六大类量价指标（价格趋势、期限利差、税收利差、风险资产表现、期货与现 货价差、机构行为），其中价格趋势类指标最为重要。国债的趋势性来自两个定价锚：经济现实（社会 融资需求渐进式发展）和央行态度（货币政策需要定力，不会大幅摇摆）。 Q11：模型如何保证稳健性、避免过拟合？ 答：第一，宏观数据需要筛选，但拒绝 \"事后诸葛亮 \"——采用滚动窗口方式，每一年选择的指标必须只 能通过该年之前的历史信息获得。第二，指标评价看重稳健性高于回测收益率本身，不要过度追求历史 回测中亮眼表现，应聚焦长期稳定、长期有效；不稳定的指标被发现时最高光时刻往往已过去。第三， 不同维度子策略之间不做滚动筛选，始终保留各层面信号，达到模型均衡稳定。因为主要矛盾往往在无 人问津时孕育，如果只以近期表现论英雄，就可能错过主要矛盾的切换。 Q12：当前对债市的操作建议是什么？ 答：目前债市短期胜率环境不错，有持仓的投资者可以选择按兵不动。如果央行之后不进行降息操作， 十年国债下行空间可能比较有限，中长期以震荡市为主。基本面最大问题是供给出清缓慢，物价向上弹 性不足；社融低位可能不只是周期性问题而是趋势性问题； K型分化下居民及税收收入可能进一步承 压，整体大环境对债市有利。建议通过量化择时模型全面均衡跟踪影响债市的各个方面，用模型定力对 抗市场噪声。 原文 十年国债实战：用模型定力对抗短期市场噪音 20260731_ 原文 2026年08月01日 发言人 尊敬的各位投资者，大家上午好。 发言人 我是来自国泰基金量化研究团队的涂梦德，然后主要负责的是利率债相关的研究。 发言人 今天非常高兴有机会能跟各位在交流下基于十年国家 ETF的一个利率择取的测试。 发言人 其实回顾一下今年上半年的行情，在股票高波动的背景之下，债市其实有一种悄悄的悄悄惊艳所有人的 感觉。 发言人 如果是十年国债，它买入持有的收率接近了 2.5%，但实际上想要拿住它是并不容易的，因为在上半年 期间也出现过诸多的扰动。 发言人 我们的模型在 1月20号左右敏锐的捕捉到了债券出现有效突破的这么一个情况，并且发出了明确的看 错观点。 发言人 随后一直到现在，都是保持一个暗 B互动持有的操作。 发言人 那么这场直播我们就想来和大家分享一下，如何使用量化模型它的一种定例来对抗短期的市场噪音与扰 动。 发言人 我们今天的分享主要分为两大部分。 发言人 第一部分是回应一下市场的关切与核心的逻辑。 发言人 在这个部分我们会先复盘一下历史上主要的债市回调的原因，并且跟大家探讨一下如何去区分市场当中 的帧信号与假噪音。 发言人 接着我们会深入基本面，重点分析一下当前市场比较关注的这个产能过剩的问题。 发言人 我们认为这个是当前基本面的一个主要矛盾。 发言人 然后我们也会回归这个政策面，特别是去探讨一下央行近期新工具的一个真实的含义。 发言人 最后我想说主观分析实际上是存在一些内部的掣肘的这也是我写到的主要矛盾的切换，实际上这个时间 是非常模糊。 发言人 并且之后的第二部分则是一些实战的模型。 发言人 也就是说我们会详细的介绍如何通过一套完整的量化模型来去对抗市场的噪声，避免主观情绪的干扰， 实现更为精细计划则是运作。 发言人 这套模型从去年推出以来，也是经历过多次的迭代和打磨，经历过样本外的检验。 发言人 目前这套模型试图依靠它的全面性和均衡性来对抗市场的短期扰动。 发言人 咱们先来看一下第一部分，经历过 2024年与2025年的行情之后，不少投资者产生了一个疑问，就是 战士是不是好像跟基本面脱钩了？ 发言人 实际上不然，我们的核心逻辑是我们认为基本面和政策面的共振转向才是再次回调的充分条件。 发言人 因此目前我们认为债市整体的下浮空间也并不是很大。 发言人 那么近期单纯的这个通胀波动对战时的影响其实也没有那么大。 发言人 而央行所推出的隔夜逆回购工具，我们认为也暂不构成降息 资本开支仍将大幅增长 。受资本开支大幅 增长的影响，谷歌自由现金流已经转负，达 -58.55亿美元。这是谷歌上市数十年来首次出现季 度自由现金流为负。 谷歌正加速建设数据中心、采购 GPU，并推进大模型训练，以支撑 Gemini 系列 AI产品及云业务增长 。 微软： 26Q2资本开支 为410亿美元，同比增长 69.4%。资本开支 用于满足客户对云服务 与AI产品的需求，同时元器件价格上涨也带来一定影响 ，约2/3的资本开支投向短期资产，主 要为 CPU与GPU，用以支撑 Azure业务需求、 发展自研应用、产品团队研发投入，同时持续 替换达到使用年限的服务器与网络设备 ，剩余部分投入长期资产，支撑长期商业化变现。 微软将数据中心与办公楼的预计使用年限由 15年延长至 25年，该调整依据资产运营历史 以及预期使用情况作出。 受本次变更影响， 未来更多数据中心租赁将由融资租赁转为经营租赁。 融资租赁纳入资本开支统计范围，而经营租赁不计入资本开支。剔除该项使用年限调整带来的 影响，微软 2026年资本开支投资规模预期维持不变。但租赁类型由融资租赁转向经营租赁， 使得调整后的资本开支预期约为 1750亿美元（前值为 1900亿美元）。 基于全业务线需求向好， 微软预计 2027财年资本开支将同比增长 ，预计 2027财年自由现金流维持正向。 Meta：26Q2资本开支为 310.8亿美元，同比 +82.7%，主要投向服务器、数据中心及网络 基础设施。 2026年资本开支指引区间为 1300亿至 1450亿美元， 区间中值为 1375亿美元， 预计同比 +90.4%。此前指引为 1250亿至 1450亿美元。广告业务方面， Meta利用大语言模型 优化系统的广告预测与排序机制。 Meta扩大了可参考的信息维度，能够结合用户自然浏览行为 与广告互动行为来判定广告相关性，推动 Facebook 与Instagram 平台的广告相关性和转化效 果显著提升。从美元收入口径来看， Meta广告业务的同比收入增速高于同业所有已披露广告业 务板块的公司，本轮 AI投入正在持续兑现回报 。 亚马逊： 26Q1资本开支为 432亿美元， 同比增长 78.1%，主要投向技术基础设施建设 （绝 大部分用于支撑亚马逊云科技业务增长）以及支持配送网络而增加的产能投资，两项投入预计 在2026年均将有所增加。 亚马逊在AI领域的投入持续扩大 ，2026年全年资本支出 指引为 2000 亿美元， 预计同比增长 55.9%，主要用于构建高性能 AI基础设施。为支撑算力需求，亚马逊 仅供内部参考，请勿外传 第9页 / 共35页 通信 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 近期与多家领先 AI研究机构深化合作，并加速推进自研芯片研发进程。 图3：北美四大云厂商资本开支 （亿美元） 资料来源：亚马逊，微软，谷歌， Meta，中原证券 研究所 近年来我国互联网厂商逐步加大对 AI相关业务的投入，并加快将 AI技术整合进其原有业 务，AI基础设施建设推动其资本开支 快速增长。预计我国 头部云厂商将继续加大用于 AI基础 设施建设的资本开支，以满足不断增长的算力需求以及确保未来在 AI领域的竞争力。 阿里巴巴： 26Q1资本开支为 268.87亿元，同比 +9.24%。2025年，阿里巴巴资本开支达 1238亿元，同比 +70.7%。阿里巴巴管理层 此前表示，当前 AI需求旺盛，未来三年 AI资源将 处于供不应求状态，原计划的 3800亿元资本开支可能偏保守，不排除根据需求进一步增加投 入。26Q1，阿里云智能集团收入为 416.26亿元，同比 +38%，特别是外部商业化收入同比增 长加速至 40%。这一增长势头主要由公共云业务收入增长所驱动，其中包括 AI相关产品采用 量的提升。 腾讯： 26Q1资本开支为 319.36亿元，同比 +16.23%。2025年，腾讯资本开支达 792亿 元，同比+3.2%，其中部分资金直接用于支持 AI基础设施升级和计算资源的采购。 2026年， 腾讯在新 AI产品上取得显著突破，并持续以 AI赋能核心业务增长。重组后的 AI研发团队重构 AI基础设施，搭建 Hy3 preview 模型，在同等参数规模的模型中性能领先，兼具实用性与性价 比；自 4月28日以来，其在 OpenRouter 的token消耗量排行榜上稳居前列。 AI智能体解决 方案已初见成效，腾讯的核心业务在用户粘性、收入及盈利上持续增长，既为 AI投入提供充裕 的现金流支持，也为 AI的落地应用奠定丰富的场景基础。 百度： 26Q1资本开支为 59.16亿元，同比 +104.0%，2025年资本开支为 120.73亿元， 同比 号发生根本性好转，也未看到基本面回暖和央行态度转变形成共振。 3.历史债市回调复盘 •2016年底至 2018年初：严监管与宽信用标志出现。 •2020年4月：我国疫情率先得到控制，基本面出现明显改善迹象。 •2020年下半年：基本面改善叠加监管压降结构性存款。 •结论：几乎每一轮大的债市熊市都有政策面或基本面的身影，甚至是两者共振；单纯噪音（如某几 天资金收紧）很难形成大级别回调。 4.产能过剩是当前基本面主要矛盾 •逻辑链条：内需不足叠加地方无序竞争，最终产生产能过剩。 •我国以增值税为主体的税制使地方政府收入主要来自生产环节，天然激励地方政府争夺制造业税 基；在 GDP锦标赛导向下，各地争相以税收优惠、财政补贴、低价地等政策招商引资。 •各地\"十五五 \"规划纲要中，特别多省份提及智能、氢能等新兴产业，同质化布局和重复建设扭曲了 行业的信用成本；新能源车、光伏等新兴产业已走过类似路径。 •自我强化的负反馈循环：内需不足→企业利润受挤压→降价争抢市场份额→地方政府担心税基流失 加大补贴→劣后产能无法有效出清→价格进一步承压→企业利润再次受挤压。 •国家统计局数据显示，制造业产能利用率仍在探底，尚未找到拐点已到的充分证据，仍处于漫长的 去产能磨底阶段。 •国信证券统计显示，多国别比较下产能出清平均可能需要 12个季度左右，但不同国别政策导向和 产业结构不同，方差很大；中国这一轮去产能周期比预期更长。 5.海外产能过剩历史经验 •1873-1896 年美欧长期萧条：新兴产业（铁路、钢铁、电力）过度投资导致产能过剩，依靠市场力 量自发出清，政府干预较少，出清耗时约 23年，漫长而持久。 •1929年大萧条：产能过剩叠加需求崩溃，罗斯福政府采取主动干预，从供给侧控制和需求侧刺激 双管齐下，较快走出通缩阶段。 •日本两轮产能过剩： 1970年代通过行政干预组建萧条卡特尔，实现生产端较快出清； 1990年代选 择减少干预、依靠市场化力量出清，结果很多僵尸企业依赖银行输血，经济陷入失去的 30年。 •核心结论：面对产能过剩，企业家本身不愿大规模减产（竞争产生负外部性），市场往往失灵，政 府干预比不干预更好。 •中国当前选择政策引导加市场化出清的路径，未走类似 2015-2016 年供给侧改革的行政强制路 线，因为本轮过剩产能很多是新产能，一刀切可能误伤先进产能；去产能是渐进式磨底过程，速度 应慢于 2016年供给侧改革。 6.物价与通胀判断 •今年CPI、PPI虽有明显上行趋势，但翘尾因素已预期很多；高频工业品数据价格在边际回落。 •剔除CPI和PPI中的翘尾因素及油价超预期因素后，整体物价并未呈现明显回暖趋势。 •产能利用率仍在历史较低位置，距离合理水平（如 80%）还有较大差距。 •判断通胀大幅回升缺乏内生动能，所谓物价回暖更多是基数效应和输入性因素所致，并非根本性供 需再平衡。 •低通胀环境加偏弱的名义增长状态下，债市利率仍有下行空间，对债券投资比较利好。 7.社融增速新常态 •2024年以前社融基本是决定国债利率最重要的指标之一，但 2025-2026 年社融下行并未使债市收 益率继续下探。 •社融增速低位运行已从周期性波动演变为结构性新常态，原因包括： •经济增长中枢下移，社融增速需匹配名义 GDP增速，高增长难以持续，且需防范资金空转； •地产信用收缩是结构性、不可逆的，即使地产反弹，总体规模也回不到从前； •政策思路转变为淡化社融增量、盘活存量。 •周期性压制因素：新旧产业融资存在断层，新兴产业社融增速快（同比两位数增长）但基数太低， 地产、城投存量庞大且增速继续下行，缺口在 3-5年内难以弥合；居民和企业资产负债表修复较 慢，主动降杠杆行为短期难以逆转。 •结论：社融增速新中枢大概率下移一个台阶，需要适应这一新常态。 8.K型分化的深层含义 •参考华创证券观点， K型分化已不仅是新旧经济之间的分化，具有更深层次含义： •劳动密集型产业向资本密集型产业转移：新兴制造业更依赖设备、自动化、资本，用工人数未随产 业扩张成比例增加； •高税率行业向低税率行业转移：新兴制造业往往前期享受税收优惠，扩张带来的税收效应较弱。 •经济结构转型中， K型分化下沿对就业和税收的拖累大于上沿的提振，对总需求和消费产生实质性 压制。 9.央行政策态度分析 •央行整体态度比较克制，方向性不强，可概括为 \"总量克制、结构发力 \"。 •上半年央行未做降准和降息操作，核心政策利率未调整； Q1货币政策报告甚至直接删除了降准降 息表述。 •4-5月资金面极致宽松应理解为被动宽松而非主动宽松：央行前期投放较多、银行贷款乏力、大行 内卷融资等因素导致银行间钱多。 •4-5月央行公开市场操作多次地量操作， OMO余额甚至降为 0，这并非央行收紧信号，恰恰是资金 面极致宽松的表现 ——大行不缺钱，不需要向央行借回购资金。 •央行更依赖结构性工具，大开大合的宽松政策落地概率下降，精细化调整成为主流。 10.隔夜逆回购工具解读 •观点明确：该工具是常规工具，常规属性大于宽松信号。 •理由一：本质是补齐短端空白，从 7天到隔夜逆回购的期限完善；操作方式为固定利率数量招标， 与7天逆回购同样模式，并非渐进式降息。 •理由二：隔夜逆回购期限只有一天，对中长期流动性影响非常有限。 •理由三：央行核心政策利率（ 7天回购利率）未做任何调整；隔夜利率在利率走廊之间灵活浮动是 流动性常规调节手段，是价格型利率调控框架的技术性优化。 •隔夜OMO真正代表的是利率框架逐渐向国际接轨，未来降息方式可能更为平滑，但短期政策指示 意义不强。 11.主要矛盾切换的困境 •2025年以来债市关注点反复切换： 2025年初央行超预期收紧流动性→ 2025年中旬反内卷政策引 发通胀预期和股市走强→ 2025年末超长债供给扰动引发银行承接能力担忧→今年银行间流动性超 预期宽松。 •跟随市场热点往往噪声多、信号滞后；很多叙事是情绪的放大器，为当前下跌找理由；真正的主要 矛盾往往是事后总结出来的。 •例证：今年 2-3月市场主流认为资金面宽松与基本面复苏显著背离，债市上涨难以持续；但到 5-6 月后，大家又开始认同资金宽松才是上半年真正主线。 •实盘操作中不可能事后复盘，需要开发均衡的量化模型来应对。 12.量化择时模型框架 •框架两大好处：一是债市择时重要性越来越高（ 2018年以来十年国债几乎年年正收益，但低利率 环境下赔率下降，震荡行情可能持续更久，把握波段的模型适用价值越来越高）；二是量化模型可 复现、相对理性，避免主观分析偏听偏信。 •模型逻辑：利率债同时受现实和预期影响 ——长期看基本面，中期看政策面，短期看机构面和技术 面；基本面与政策面看经济现实，技术面与机构行为看预期走到哪一步。 •基本面维度：利率主要由通胀和经济增长决定；使用 OECD经济综合指标表征经济景气程度；经济 强则利率走高，压制利率债。 •政策面维度：央行通过控制短期利率和银行间资金松紧影响长期利率；货币宽松时十年期国债往往 走出优异走势。 •技术面维度：债券是可交易资产，有国债期货等衍生品，交易面信号可窥探市场情绪与风险偏好。 •基本面指标筛选发现：中国经济主要受未来信心导致的加杠杆影响，核心指标包括社融、固定资产 投资、商品房等（企业与居民加杠杆的体现）；财政存款等指标也有一定指示作用；物价相关指标 在2013年后几乎未出现在有效指标中（通胀与增长同步甚至滞后，无独立信息含量）。 •2025年后模型迭代：加入更多与通胀相关的指标，因市场开始意识到通缩本身对经济有害，反内 卷政策直接对供给侧操作以改善物价。 13.货币政策传导与利率走廊 •我国货币政策正从数量型向价格型转型；价格型货币政策通过利率走廊实现利率引导 ——设定银行 间资金利率上下限，央行设定中枢政策利率，影响市场基准利率和市场利率在合意区间运行。 •政策利率主要看 7天逆回购利率，但历史上变动不频繁（加息 /降息），缺乏统计样本价值。 •通过市场利率反映反推央行态度： DR007主要反映银行间资金面松紧，大部分时间在逆回购利率附 近徘徊；若明显偏离（长期高于或低于逆回购利率），说明市场对央行进一步加息或降息产生预 期。 14.量价技术面指标 •核心假定：跟随最聪明投资者博弈出来的结果，做趋势跟随者。 •从国债现货、国债期货、股票等风险资产收集数据，整理出六大类量价指标：价格趋势、期限利 差、税收利差、风险资产表现、期货与现货价差、机构行为。 •价格趋势类指标最为重要、效果最好，印证国债具有趋势性。 •国债趋势性来源两个定价锚：一是经济现实（社会融资需求，企业融资需求具有关联性，基本面的 发展渐进式）；二是央行态度（货币政策需要定力，让市场形成稳定预期，不会大幅摇摆）。 15.策略生成与模型稳健性 •宏观策略合成理念：数据需筛选，但拒绝 \"事后诸葛亮 \"——指标选择必须通过滚动窗口，每一年选 择的指标只能通过该年之前的历史信息获得。 •指标评价看重稳健性高于回测收益率本身；不要过度追求历史回测中亮眼表现，应聚焦长期稳定、 长期有效；不稳定的指标被发现时最高光时刻往往已过去。 •不同维度子策略（基本面、政策面、机构面、技术面）之间不做滚动筛选，始终保留各层面信号， 达到模型均衡稳定。 •原因：主要矛盾往往在无人问津时孕育，只有在大家不关注时才特别容易出现超预期；若只以近期 表现论英雄，可能错过主要矛盾切换（如 2025年只关注通胀而忽略资金面超预期宽松和基本面下 行，就会完全错过今年行情）。 16.操作建议与展望 •目前债市短期胜率环境不错，有持仓投资者可选择按兵不动。 •若央行之后不进行降息操作，十年国债下行空间可能比较有限，中长期以震荡市为主。 •基本面最大问题是供给出清缓慢，整体物价向上弹性不足；社融低位不只是周期性问题，可能是趋 势性问题； K型分化下居民及税收收入可能进一步承压，整体大环境对债市有利。 •2025年窄幅震荡以来债市主要矛盾反复切换，择时难度加大；通过量化择时模型全面均衡跟踪影 响债市的各个方面，用模型定力对抗市场噪声。 问答整理 Q1：当前债市是否已经与基本面脱钩？ 答：我们认为并没有脱钩。核心逻辑是基本面和政策面的共振转向才是债市回调的充分条件。目前债市 整体下行空间不大，近期单纯的通胀波动对债市影响不大，央行推出的隔夜逆回购工具也暂不构成降息 或宽松信号。我们还没有看到地产社融等信号发生根本性好转，没有看到基本面回暖和央行态度转变形 成共振，因此对于持有投资者而言可以选择按兵不动。 Q2：如何区分市场中的真实信号与短期噪音？ 答：短期噪音包括资金面阶段性收敛引发的情绪扰动、股债跷跷板引起的短期资金分流波动等，这些噪 音来得快去得也快，如果没有高频调仓打算，不需要过多关注。真实信号在基本面上是地产出现实质性 探底或复苏、社融出现超预期信用切实转宽；在政策面上是央行开始引导资金中枢抬升。目前来看， CPI和PPI的回暖更多是预期内的，受翘尾因素和油价等超预期干扰因素影响更大，尚未看到这些真实 信号出现。 Q3：为什么说产能过剩是当前基本面的主要矛盾？ 答：逻辑链条是内需不足叠加地方无序竞争，最终产生产能过剩。我国以增值税为主体的税制使地方政 府收入主要来自生产环节，天然激励地方政府争夺制造业税基。在 GDP锦标赛导向下，各地争相以税 收优惠、财政补贴、低价地等政策招商引资，导致同质化布局和重复建设。这形成了自我强化的负反馈 循环：内需不足→企业利润受挤压→降价争抢市场份额→地方政府担心税基流失加大补贴→劣后产能无 法有效出清→价格进一步承压→企业利润再次受挤压。目前制造业产能利用率还在探底，没有充分证据 显示拐点已到，仍处于漫长的去产能磨底阶段。 Q4：产能过剩问题未来会以什么路径解决？ 答：从海外历史经验看， 1873-1896 年美欧长期萧条依靠市场力量自发出清，耗时约 23年；1929年 大萧条中罗斯福政府主动干预，较快走出通缩；日本 1970年代通过行政干预较快出清， 1990年代减 少干预导致僵尸企业依赖银行输血，陷入失去的 30年。核心结论是面对产能过剩，市场往往失灵，政 府干预比不干预更好。中国当前选择政策引导加市场化出清的路径，没有走行政强制路线，因为本轮过 剩产能很多是新产能，一刀切可能误伤先进产能。这使得去产能成为渐进式磨底过程，速度应慢于 2016年供给侧改革。 Q5：如何理解当前物价回暖？ 答：虽然今年 CPI、PPI有明显上行趋势，但首先翘尾因素本身已预期很多；另一方面高频工业品数据 价格在边际回落。剔除 CPI和PPI中的翘尾因素以及油价超预期因素后，整体物价并未呈现明显回暖趋 势。产能利用率仍在历史较低位置，距离合理水平（如 80%）还有较大差距。通胀大幅回升缺乏内生 动能，所谓物价回暖更多是基数效应和输入性因素所致，并非根本性供需再平衡。 Q6：社融增速下行后还能否继续作为债市核心指标？ 答：需要意识到社融增速低位运行已从周期性波动演变为结构性新常态。长期看经济增长中枢下移，社 融增速需匹配名义 GDP增速，高增长难以持续；地产信用收缩是结构性、不可逆的；政策思路转变为 淡化社融增量、盘活存量。周期性因素方面，新旧产业融资存在断层 ——新兴产业社融增速快但基数太 低，地产城投存量庞大且增速继续下行，缺口在 3-5年内难以弥合；居民和企业资产负债表修复较慢。 社融增速新中枢大概率下移一个台阶，需要适应这一新常态。 Q7：如何理解央行 4-5月资金面极致宽松？ 答：4-5月资金面极致宽松更多应被视为被动宽松而非主动宽松。银行间钱多主要是因为央行前期投放 较多、银行贷款乏力、大行比较内卷的融资行为。央行在公开市场操作中 4-5月多次地量操作，甚至 OMO余额降为 0，这恰恰是资金面极致宽松的表现 ——大行根本不缺钱，不需要向央行借回购资金。 央行整体态度比较克制，更依赖结构性工具，大开大合的宽松政策落地概率下降，精细化调整成为主 流。 Q8：如何解读央行隔夜逆回购新工具？ 答：我们认为该工具是常规工具，常规属性大于宽松信号。第一，本质是补齐短端空白，从 7天到隔夜 逆回购的期限完善，操作方式是固定利率数量招标，与 7天逆回购同样模式，并非渐进式降息。第二， 隔夜逆回购期限只有一天，对中长期流动性影响非常有限。第三，央行核心政策利率（ 7天回购利率） 并未调整，隔夜利率在利率走廊之间灵活浮动是流动性常规调节手段，是价格型利率调控框架的技术性 优化。隔夜 OMO真正代表的是利率框架逐渐向国际接轨，未来降息方式可能更平滑，但短期政策指示 意义不强。 Q9：为什么需要量化模型来做债市择时？ 答：做主观分析最痛苦的是主要矛盾切换的问题。 2025年以来债市关注点反复切换，跟随市场热点往 往噪声多、信号滞后，很多叙事是情绪的放大器，真正的主要矛盾往往是事后总结出来的。实盘操作中 不可能当事后诸葛亮。量化模型的好处是：第一，债市择时重要性越来越高，低利率环境下利率债赔率 下降，震荡行情可能持续更久，能把握波段的模型适用价值越来越高；第二，量化模型可复现、相对理 性，避免主观分析偏听偏信。我们的模型通过全面均衡地跟踪影响债市的各方面指标，当主要矛盾出现 明显扰动时可以及时关注到。 Q10：量化模型的基本框架和逻辑是什么？ 答：模型认为利率债同时受现实和预期的影响。长期看基本面，中期看政策面，短期看机构面和技术 面。基本面上，利率主要由通胀和经济增长决定，经济强则利率走高；政策面上，央行通过控制短期利 率影响长期利率，货币宽松时十年国债往往走出优异走势；技术面上，通过国债现货、期货、股票等风 险资产收集数据，整理出六大类量价指标（价格趋势、期限利差、税收利差、风险资产表现、期货与现 货价差、机构行为），其中价格趋势类指标最为重要。国债的趋势性来自两个定价锚：经济现实（社会 融资需求渐进式发展）和央行态度（货币政策需要定力，不会大幅摇摆）。 Q11：模型如何保证稳健性、避免过拟合？ 答：第一，宏观数据需要筛选，但拒绝 \"事后诸葛亮 \"——采用滚动窗口方式，每一年选择的指标必须只 能通过该年之前的历史信息获得。第二，指标评价看重稳健性高于回测收益率本身，不要过度追求历史 回测中亮眼表现，应聚焦长期稳定、长期有效；不稳定的指标被发现时最高光时刻往往已过去。第三， 不同维度子策略之间不做滚动筛选，始终保留各层面信号，达到模型均衡稳定。因为主要矛盾往往在无 人问津时孕育，如果只以近期表现论英雄，就可能错过主要矛盾的切换。 Q12：当前对债市的操作建议是什么？ 答：目前债市短期胜率环境不错，有持仓的投资者可以选择按兵不动。如果央行之后不进行降息操作， 十年国债下行空间可能比较有限，中长期以震荡市为主。基本面最大问题是供给出清缓慢，物价向上弹 性不足；社融低位可能不只是周期性问题而是趋势性问题； K型分化下居民及税收收入可能进一步承 压，整体大环境对债市有利。建议通过量化择时模型全面均衡跟踪影响债市的各个方面，用模型定力对 抗市场噪声。 原文 十年国债实战：用模型定力对抗短期市场噪音 20260731_ 原文 2026年08月01日 发言人 尊敬的各位投资者，大家上午好。 发言人 我是来自国泰基金量化研究团队的涂梦德，然后主要负责的是利率债相关的研究。 发言人 今天非常高兴有机会能跟各位在交流下基于十年国家 ETF的一个利率择取的测试。 发言人 其实回顾一下今年上半年的行情，在股票高波动的背景之下，债市其实有一种悄悄的悄悄惊艳所有人的 感觉。 发言人 如果是十年国债，它买入持有的收率接近了 2.5%，但实际上想要拿住它是并不容易的，因为在上半年 期间也出现过诸多的扰动。 发言人 我们的模型在 1月20号左右敏锐的捕捉到了债券出现有效突破的这么一个情况，并且发出了明确的看 错观点。 发言人 随后一直到现在，都是保持一个暗 B互动持有的操作。 发言人 那么这场直播我们就想来和大家分享一下，如何使用量化模型它的一种定例来对抗短期的市场噪音与扰 动。 发言人 我们今天的分享主要分为两大部分。 发言人 第一部分是回应一下市场的关切与核心的逻辑。 发言人 在这个部分我们会先复盘一下历史上主要的债市回调的原因，并且跟大家探讨一下如何去区分市场当中 的帧信号与假噪音。 发言人 接着我们会深入基本面，重点分析一下当前市场比较关注的这个产能过剩的问题。 发言人 我们认为这个是当前基本面的一个主要矛盾。 发言人 然后我们也会回归这个政策面，特别是去探讨一下央行近期新工具的一个真实的含义。 发言人 最后我想说主观分析实际上是存在一些内部的掣肘的这也是我写到的主要矛盾的切换，实际上这个时间 是非常模糊。 发言人 并且之后的第二部分则是一些实战的模型。 发言人 也就是说我们会详细的介绍如何通过一套完整的量化模型来去对抗市场的噪声，避免主观情绪的干扰， 实现更为精细计划则是运作。 发言人 这套模型从去年推出以来，也是经历过多次的迭代和打磨，经历过样本外的检验。 发言人 目前这套模型试图依靠它的全面性和均衡性来对抗市场的短期扰动。 发言人 咱们先来看一下第一部分，经历过 2024年与2025年的行情之后，不少投资者产生了一个疑问，就是 战士是不是好像跟基本面脱钩了？ 发言人 实际上不然，我们的核心逻辑是我们认为基本面和政策面 3c/li>\n\u003cli>今天强化的逻辑：OpenAI 入门版本 Luna 降价 80%，被认为是迫于中国模型价格压力下的北美价格战开端；OpenAI 总裁 Brockman 确认消费硬件“很快和大家见面”，叠加字节新 AI 手机预计很快发布，端侧被判断可能严重低估。（来源：10:36 帖子）\u003c/li>\n\u003cli>今天出现的催化/验证：OpenAI 官方降价落地，OpenRouter 叠加 50% 独家折扣；另据报道 OpenAI 或因投资者担忧现金消耗过快而将 IPO 推迟至明年。（来源：10:39 帖子；10:28 帖子“财联社”）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>AI 算力资本开支与需求正循环\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：三大 CSP 云业务全面超预期，Google Cloud 26Q2 收入 248 亿美元（同比 +82%），Azure 及其他云服务同比 +43%，客户需求继续超过可用产能；算力供给仍是核心约束。（来源：10:34 帖子“CSP需求全面超预期”）\u003c/li>\n\u003cli>今天出现的催化/验证：四大 CSP（AMZN、META、GOOGL、MSFT）预计到 2026 年综合资本支出达 7200 亿至 7450 亿美元，高于此前预测的 6950 亿至 7250 亿美元；微软、亚马逊 7 月市值合计增长超 1 万亿美元。（来源：08:59 帖子“收益概要”；08:57 帖子“周六你需要知道的隔夜全球要闻”）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>光互连瓶颈：磷化铟激光器供需失衡\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI 数据中心向百万 GPU 集群演进，800G、1.6T 光模块及 CPO 快速放量，高功率 CW 激光器进入高速增长阶段；InP 激光器供应缺口已超过存储产业，成为限制 AI 光网络的关键瓶颈。（来源：21:00/21:05 帖子 SemiAnalysis）\u003c/li>\n\u003cli>今天出现的催化/验证：预计 2026-2027 年全球 800G/1.6T 光模块出货量分别达 40-57.8 万只/月和 21-48 万只/月；中际旭创获维持“买入”评级，2.4T 光模块/NPO 预计 2027 年开始，长期看 3.2T/CPO。（来源：21:00 帖子；23:50 帖子“中际旭创”）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体设备与存储扩产共振\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：泛林、KLA、爱德万、泰瑞达等海外设备公司财报及指引整体较强，共同验证 AI、存储、先进封装和测试需求仍然旺盛；晶圆制造设备方向国内海外存储扩产刚开始，叠加国产替代加速。（来源：10:34 帖子“半导体设备：海外反弹，怎么选标的？”）\u003c/li>\n\u003cli>今天出现的催化/验证：长鑫 LPDDR6 接近研发验证尾声；韩国 DRAM 出口单价创历史新高；Lumentum 称 InP 激光器缺口超存储产业。（来源：13:29 帖子；10:28 帖子“韩国 DRAM 出口单价创历史新高”；21:05 帖子）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>新能源车 7 月销量与光伏价格合规\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：7 月核心新能源品牌销量分化，比亚迪、零跑环比增长，小鹏环比小幅回落；吉利出口销量再创历史新高，出口 10.7 万辆（同比 +202%），新能源出口 6.3 万辆（同比 +616%）。（来源：21:43 帖子；21:05 帖子“【广发汽车】吉利汽车7月高端出海销量亮眼”）\u003c/li>\n\u003cli>今天出现的催化/验证：市场监管总局对光伏行业开展价格合规指导，预计短期产业链报价修复、落后产能出清加快。（来源：10:28 帖子“【长江电新】光伏”）\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>机器人：丝杠与人形机器人量产预期\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：丝杠被认为是 Optimus 方案固化后全球人形机器人第一个全面爆发的核心零部件；一旦特斯拉把丝杠价格打下来、量产铺开，叠加谷歌通用大脑，丝杠有望快速成为全行业通用标配。（来源：10:35 帖子“我们认为丝杠将是Optimus方案固化后……”）\u003c/li>\n\u003cli>今天出现的催化/验证：美国 FCC 将先进机器人设备列入“受管制清单”，观点认为短期对石头/九号无影响，中长期利好龙头提价提份额；中金公司人机系列报告《人形机器人能力跃迁关键支点》正文已提取。（来源：10:35 帖子“【美国FCC机器人禁令】”；附件“中金公司-工业：人机系列05”）\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>OpenAI 对 GPT-5.6 Terra 与 Luna 官方降价，Luna 降幅约 80%，OpenRouter 叠加 50% 折扣。（来源：10:39 帖子）\u003c/li>\n\u003cli>长鑫科技 LPDDR6 接近研发验证尾声，有望 2026 年下半年发布。（来源：13:29、21:23 帖子）\u003c/li>\n\u003cli>市场监管总局对光伏行业开展价格合规指导。（来源：10:28 帖子）\u003c/li>\n\u003cli>湘财证券和国盛证券两家券商同时被证监会立案调查。（来源：08:59 帖子）\u003c/li>\n\u003cli>7 月股票 ETF 月净流入或超 5400 亿创历史新高（截至 7 月 30 日净流入 5022.12 亿元）。（来源：10:29 帖子）\u003c/li>\n\u003cli>韩国 KOSPI 大涨 +17.91%，创历史最大单日涨幅，指数重回 6500 点上方。（来源：21:50 帖子“【财通策略徐近峰团队丨QJC】”）\u003c/li>\n\u003cli>美国二季度 GDP 环比低于市场预期；美官员称特朗普已下令对伊朗发动新一轮袭击。（来源：主线概括宏观/策略；08:57、08:59 帖子）\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>OpenAI IPO 是否推迟至明年，以及降价后 AI 应用商业化落地节奏。（来源：10:28 帖子）\u003c/li>\n\u003cli>字节新 AI 手机发布进展，以及 OpenAI 消费硬件落地情况。（来源：10:36 帖子）\u003c/li>\n\u003cli>800G/1.6T 光模块出货放量节奏，NPO 产品 8-？个月内量产进度，以及磷化铟激光器供需缺口是否进一步扩大。（来源：21:00 帖子）\u003c/li>\n\u003cli>长鑫 LPDDR6 后续量产发布进展，及存储扩产对国产设备订单的拉动。（来源：13:29 帖子）\u003c/li>\n\u003cli>光伏产业链报价能否如预期修复，落后产能出清速度。（来源：10:28 帖子）\u003c/li>\n\u003cli>特朗普对伊朗新一轮袭击是否落地，及对能化产品和风险资产的影响。（来源：08:57、08:59 帖子）\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>帖子\u003c/strong>（10:36）｜ 强烈重视【AI应用】:OpenAI降价，AI应用新叙事开启！——谁是那个model3？\u003c/li>\n\u003cli>\u003cstrong>帖子\u003c/strong>（10:39）｜ 📰 【海外｜通向 AGI】2026 年 07 月 31 日 AI 大模型晚间速递（OpenAI GPT-5.6 Terra 与 Luna 降价细节）\u003c/li>\n\u003cli>\u003cstrong>帖子\u003c/strong>（21:00/21:05）｜ 【AI光互连核心器件供应持续趋紧 磷化铟激光器供需失衡加剧】——SemiAnalysis 主题报告\u003c/li>\n\u003cli>\u003cstrong>帖子\u003c/strong>（10:34）｜ 半导体设备：海外反弹，怎么选标的？（泛林、KLA、爱德万、泰瑞达财报验证）\u003c/li>\n\u003cli>\u003cstrong>帖子\u003c/strong>（13:29）｜ 【长鑫科技LPDDR6接近研发验证尾声】\u003c/li>\n\u003cl
