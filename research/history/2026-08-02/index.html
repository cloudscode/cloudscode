M7与26M1-7销量分别为： （1）总量：41.9/223万，yoy+22%/-11%。（2）国内：24/126万，yoy-9%/-35%。", "content": "浙商大制造 邱世梁丨顾淳晖【比亚迪】7月销量略超我们预期、海外占比43%（yoy+124%）销量：7月海外销量约18万辆、占总销量约43% 26M7与26M1-7销量分别为： （1）总量：41.9/223万，yoy+22%/-11%。 （2）国内：24/126万，yoy-9%/-35%。 （3）海外：18/97万，yoy+124%/+78%。出海：产能、物流、渠道同步扩张 （1）产能/物流：已形成八国八厂布局，2026年产能超100万辆；8艘滚装船单次合计运量超6万车位。 （2）渠道：海外门店已达2000家，欧洲市场目标于年底翻倍至2000家。公司：全球新能源车龙头，电动化与智能化领先 刀片电池、DM混动及超级e平台持续强化技术优势，天神之眼截至25年底累计搭载超100万辆。业绩回顾：2021-2025年，营收/归母由2161/30升至8040/326亿元，CAGR达39%/81%；近年由于价格竞争激烈，单车利润承压风险提示：行业竞争/海外拓展/原材料波动/产能及车型投放/股东减持风险。#文字观点", "publish_time": "2026-08-02 21:13", "tags": ["文字观点"]}, "post:2026-08-02T22-06:5420264b5b9f": {"id": "post:2026-08-02T22-06:5420264b5b9f", "kind": "post", "title": "2026-08-02 22:06", "source_label": "帖子正文", "excerpt": "【华安电新&汽车】光伏板块中期策略：26年是行业筑底期，关注新技术加速供给出清 ➡国内需求：26年光伏装机有望成为本轮周期筑底年，2027年有望迎来边际修复 ◆136号文政策消化进入尾声，新型储能规模化建设有效对冲峰谷价差，就地消纳与绿电直连打开消纳空间，且观察月均装机已企稳，多重因素影响下，预计国", "content": "【华安电新&汽车】光伏板块中期策略：26年是行业筑底期，关注新技术加速供给出清 ➡国内需求：26年光伏装机有望成为本轮周期筑底年，2027年有望迎来边际修复 ◆136号文政策消化进入尾声，新型储能规模化建设有效对冲峰谷价差，就地消纳与绿电直连打开消纳空间，且观察月均装机已企稳，多重因素影响下，预计国内市场装机下滑趋势基本停止，2027年有望迎来边际修复。 ➡海外需求：新兴市场支撑海外市场温和增长 ◆26-27年，预计海外光伏市场仍将保持低速增长，结构上美国、欧洲等传统市场增速将放缓，同时印度等新兴市场增速将加速，成为海外光伏市场增长主力。 ◆分区域看，美国市场受电网和供应链限制，欧盟受经济性和电网制约但28年开始有望重回增长；新兴市场在需求刺激和政策支撑下，光伏装机则整体呈现轮动式增长，其中印度27年光伏装机有望达42GW，同比+40%；沙特27年光伏装机有望达9.6GW，土耳其26年光伏装机有望达7.5GW，同比增速接近60%。 ➡国内供给：国内政策持续收紧+头部企业技术持续迭代，加速行业出清进度 ◆近期三项光伏能效强标已正式发布，将于27年1月1日开始实施，强标实施后有望至少...", "publish_time": "2026-08-02 22:06", "tags": ["文字观点"]}, "post:2026-08-02T22-09:db421e5e71cc": {"id": "post:2026-08-02T22-09:db421e5e71cc", "kind": "post", "title": "2026-08-02 22:09", "source_label": "帖子正文", "excerpt": "【中泰机械】人形机器人本周两大关键进展：巨头路线再收敛 + T链量产实打实落地 本周机器人板块两件事值得重点跟踪： 一、Google DeepMind 发布 Gemini Robotics，巨头软件路线再收敛 谷歌本周发布 Gemini Robotics 2 大模型（VLA 指令+ER 推理+On-", "content": "【中泰机械】人形机器人本周两大关键进展：巨头路线再收敛 + T链量产实打实落地 本周机器人板块两件事值得重点跟踪： 一、Google DeepMind 发布 Gemini Robotics，巨头软件路线再收敛 谷歌本周发布 Gemini Robotics 2 大模型（VLA 指令+ER 推理+On-Device 端侧三模型协同），支持长序列任务与多机协作。 我们的点评 梳理 1️⃣国产算力：算力国产化从政策鼓励升级为强制准入要求，叠加 WAIC 顶层定调，新建智算中心国产化硬约束落地，需求确定性扩容。重点关注：中科曙光、海光信息、寒武纪。", "content": "【东吴计算机王紫敬】关键时点推荐标的梳理 1️⃣国产算力：算力国产化从政策鼓励升级为强制准入要求，叠加 WAIC 顶层定调，新建智算中心国产化硬约束落地，需求确定性扩容。 重点关注：中科曙光、海光信息、寒武纪。 2️⃣世界模型：AI 加速从数字世界向物理世界渗透，工业化赋能成为核心发展方向，工业数字化赛道迎来价值重估。 重点关注：中控技术、能科科技、品茗科技。 3️⃣算力租赁：大参数模型迭代验证高端算力的战略属性，行业定位从资源服务商升级为模型厂商核心产能支撑，需求景气度与盈利弹性同步提升。 重点关注：宏景科技、协创数据、中威电子。 4️⃣磷化铟：海外龙头 AXT 二季度业绩大幅超预期，磷化铟业务收入创历史新高，光通信上游材料高景气度确认，国内产业链同步受益。 重点关注：云南锗业、光智科技。#文字观点", "publish_time": "2026-08-02 17:16", "tags": ["文字观点"]}, "post:2026-08-02T20-31:26c75222b269": {"id": "post:2026-08-02T20-31:26c75222b269", "kind": "post", "title": "2026-08-02 20:31", "source_label": "帖子正文", "excerpt": "【国金空天】商业航天本周新闻 | 2026.08.01 【国内新闻】 🚀#工信部等七部门启动创新任务揭榜挂帅，重点布局太空算力 2026年7月28日，工业和信息化部等七部门联合启动2026年首批工业和信息化领域创新任务揭榜挂帅工作，围绕未来产业、装备制造、信息技术、通信、人工智能及消费品等六大方向布", "content": "【国金空天】商业航天本周新闻 | 2026.08.01 【国内新闻】 🚀#工信部等七部门启动创新任务揭榜挂帅，重点布局太空算力 2026年7月28日，工业和信息化部等七部门联合启动2026年首批工业和信息化领域创新任务揭榜挂帅工作，围绕未来产业、装备制造、信息技术、通信、人工智能及消费品等六大方向布局24个专题。其中太空算力方向设置晨昏轨道太空数据中心、天基遥感智算平台、高速星地激光通信、卫星机热一体化、天基算力热控及国产GPU智算载荷等8项任务，加快天地一体化通算网络关键技术攻关。 🚀#朱雀三号遥二预计8月中发射，拟再次验证一级垂直回收 2026年7月29日，据相关发射观礼信息，蓝箭航天朱雀三号遥二可重复使用液氧甲烷运载火箭预计8月中在酒泉东风商业航天创新试验区发射，具体时间以官方通知为准。火箭此前已完成全箭静态点火及场区联合测试，并针对遥一任务暴露的问题，对热防护、栅格舵、飞控算法、发动机响应和着陆系统进行升级。本次任务将兼顾载荷入轨与一级垂直回收全流程验证。 【国际新闻】 ⭐#SpaceX首批20颗星链V3卫星完成测试，下一代星座进入部署准备阶段 2026年8月1日，Spa...", "publish_time": "2026-08-02 20:31", "tags": ["国金空天", "文字观点"]}, "post:2026-08-02T17-22:2d79a56506f8": {"id": "post:2026-08-02T17-22:2d79a56506f8", "kind": "post", "title": "2026-08-02 17:22", "source_label": "帖子正文", "excerpt": "国际电子商情讯，7月31日，澜起科技正式宣布，率先在业界试产CXL 3.2内存扩展控制器(MXC)芯片。", "content": "国际电子商情讯，7月31日，澜起科技正式宣布，率先在业界试产CXL 3.2内存扩展控制器(MXC)芯片。这是全球首款CXL 3.2 MXC芯片，基于PCIe 6.x和CXL 3.2协议规范设计，最高支持64 GT/s数据传输速率。 面对AI大模型参数规模持续膨胀带来的\"内存墙\"困局，CXL协议通过将内存从CPU本地解耦，实现跨主机的内存共享与池化，被业界视为突破服务器内存容量上限的核心技术路径之一。 双DDR5控制器+RISC-V，打造内存扩展方案 澜起CXL 3.2 MXC芯片支持CXL Type 3规范的CXL.mem和CXL.io协议，集成双DDR5内存控制器，最高支持8000 MT/s的DDR5内存。芯片内部集成了PCIe 6.x PHY、DDR5 PHY以及双RISC-V处理器子系统，可支持开发P ；有观点维持“科技+红利的均衡配置等待拐点”（来源：21:12【中信前瞻】；10:36 宏观策略观点帖；20:23【中信策略】）。\u003c/li>\n\u003cli>\u003cstrong>新能源/汽车（AI贝塔的产业类比）\u003c/strong>：针对市场对AI贝塔的两大担忧展开——担忧1“token从涨价到降价，上游AI硬件投资机会结束？”类比新能源车从特斯拉溢价放量到比亚迪汉、理想one爆款频出、降价实现百花齐放，锂电中游投资机会也很好；担忧2为通胀环节类比碳酸锂，业绩好就见顶、涨价要杀估值（来源：17:14【天风电新&amp;汽车】0802）。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO\u003c/strong>：Formfactor、Chroma、泰瑞达、爱德万等测试公司均表示CPO相关进展，Formfactor表示其SLT业务高增得益于CPO测试需求增长，Chroma获得i3环节测试设备订单，积极关注光设备尤其是CPO进展（来源：21:41【广发机械】专用设备跟踪）。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>澜起科技率先在业界试产CXL 3.2内存扩展控制器（MXC）芯片（来源：17:22 国际电子商情讯；20:39【国海计算机·周观点·0802】）。\u003c/li>\n\u003cli>宇树科技IPO临近：8/10打新，8月下旬挂牌，发行价约104元，募资42亿，发行市值420亿；2025年全球人形机器人出货超5500台，市占约32%，已盈利，毛利60%，被视为A股“具身智能第一股”（来源：17:09 宇树科技帖子）。\u003c/li>\n\u003cli>字节跳动发布新一代视频生成模型Seedance 2.5，支持单次生成最长30秒视频并支持多轮延长；Minimax发布Hailuo3开源模型，为通用全模态生成模型，最高支持15s 2K分辨率（来源：10:40、13:43【中泰传媒互联网】；13:43【国联民生海外】）。\u003c/li>\n\u003cli>特朗普称收到伊朗请求暂缓攻击，同意取消对伊打击以换取协议框架，地缘走完一个完整“惊魂”循环（来源：13:41、13:42 特朗普相关消息；13:50 周末宏观事件0802）。\u003c/li>\n\u003cli>南网科技公告收购广东电网下属孙公司广州粤能电力科技开发有限公司100%股权，收购价格4.45亿元，使用超募和自有资金（来源：13:50【GFDX】南网科技）。\u003c/li>\n\u003cli>仕佳光子发布2026年中报，营收14.95亿元，同比增长50.66%，归母净利润3.15亿元，同比增长45.30%（来源：20:36【天风通信】仕佳光子点评）。\u003c/li>\n\u003cli>通合科技获强call：800V时代核心电源卡位龙头，HVDC客户进展顺利，产品覆盖336V、800V等多种电压等级的HVDC模块及整机系统，部分产品已在多个项目落地（来源：13:49 通合科技（300491）帖子）。\u003c/li>\n\u003cli>中信策略认为“调整基本结束，8月修复可期”，7月末两融平均担保比例264.5%显示安全垫充足（来源：20:23【中信策略】）。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>后续国产大模型Tokens快速增长能否推动国产AI芯片和服务器产品快速放量；单位Token价格下降对调用量的进一步拉动（来源：17:07 广发计算机）。\u003c/li>\n\u003cli>供给端重点跟踪电子布、钻针、电力及CoWoS-L，国产CoWoS-L产能偏紧，可能约束部分国产GPU出货；Q3上游光芯片、DSP等供给加速释放，光通信龙头收入环比提速的确定性较高（来源：21:38 0802科技纪要）。\u003c/li>\n\u003cli>生益FR-4预期8月继续上涨10%，覆铜板价格能否覆盖上游涨价成本，并通过优化订单结构实现未来毛利持续提升（来源：21:38 0802科技纪要）。\u003c/li>\n\u003cli>机器人方面：杰克科技机器人预计在9月发布会正式发布，此前搭载机器人的首条AI无人化产线样板线值得跟踪（来源：10:39 杰克科技相关帖子）。\u003c/li>\n\u003cli>覆铜板涨价、存储涨价对下游整机BOM成本的影响：存储暴涨大幅抬升小米整机BOM成本，叠加SoC同步涨价，小米机型硬件毛利受影响（来源：21:38 0802科技纪要）。\u003c/li>\n\u003cli>北美缺电方面：8月美国缺电规则文件进入密集落地阶段，PJM提出把大型负荷接电、配套发电和输电升级整合成一份新服务申请（来源：20:27【华安电新】北美缺电跟踪15）。\u003c/li>\n\u003cli>光伏板块：26年是行业筑底期，关注新技术加速供给出清，136号文政策消化进入尾声，新型储能规模化建设对冲峰谷价差（来源：22:06【华安电新&amp;汽车】光伏板块中期策略）。\u003c/li>\n\u003cli>CSP资本开支与AI应用变现的持续验证：微软单季总营收900.1亿美元，AI应用端变现超预期，全球90%五百强企业批量采购AI办公工具，To B付费商业模式跑通（来源：13:53 周末舆情热度；13:50【华福计算机】）。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003cul>\n\u003cli>帖子 | 17:07 【广发计算机刘雪峰团队 | AI模型系列（六）：AI基模新变化下的趋势机会】——国产AI基础模型技术进步对AI应用、算力的积极影响，Token调用量快速增长，需求向Coding、Agent、多模态生成迁移。\u003c/li>\n\u003cli>帖子 | 21:38 0802科技纪要——电子AI行情全球共振判断，持仓筹码变化；供给端电子布、钻针、CoWoS-L约束；覆铜板涨价、小米BOM成本。\u003c/li>\n\u003cli>帖子 | 22:09 【中泰机械】人形机器人本周两大关键进展——Google DeepMind发布Gemini Robotics 2，T链量产落地，技术收敛与落地加速窗口期判断。\u003c/li>\n\u003cli>帖子 | 10:39 【杰克科技】机器人订单超预期——【国金机械】杰克科技与恒峰服饰签订200台人形机器人订单，对应新签订单4000万。\u003c/li>\n\u003cli>帖子 | 13:40 【申万宏源通信】周观点更新（20260802）——市场定价锚从“Capex投多少”切换到“这钱谁出、多久回本”，四大CSP 2026年Capex合计约7450亿美元。\u003c/li>\n\u003cli>帖子 | 21:12 【中信前瞻】美股科技周总结（07/27~07/31）——CSP正在重回AI产业中心，去杠杆后市场波动性短期有望明显收窄。\u003c/li>\n\u003cli>帖子 | 20:23 【中信策略】调整基本结束，8月修复可期——两融平均担保比例264.5%，本轮调整更像拥挤交易修正而非韩国式去杠杆。\u003c/li>\n\u003cli>帖子 | 17:14 【天风电新&amp;汽车】关于市场担忧AI贝塔的思考-0802——两大担忧的类比分析：token降价类比新能源车降价放量，通胀环节类比碳酸锂。\u003c/li>\n\u003cli>帖子 | 21:41 【广发机械】专用设备跟踪——CPO测试需求增长（Formfactor SLT业务高增、Chroma获i3环节测试设备订单），WFE与ATE市场空间预期。\u003c/li>\n\u003cli>帖子 | 21:13 浙商大制造 邱世梁丨顾淳晖【比亚迪】7月销量——7月海外销量约18万辆、占总销量约43%，yoy+124%。\u003c/li>\n\u003cli>帖子 | 17:09 宇树科技IPO信息——8/10打新、8月下旬挂牌，发行价约104元、募资42亿、发行市值420亿，2025年出货超5500台、市占约32%。\u003c/li>\n\u003cli>帖子 | 10:42 【申万计算机周报】——Kimi K2开源补齐国内开源模型代码能力短板，推理成本仅为Claude4的20%，日均调用量超100万tokens。\u003c/li>\n\u003cli>帖子 | 13:50 【GFDX】南网科技——收购广州粤能电力100%股权，收购价格4.45亿元。\u003c/li>\n\u003c/ul>\n\u003ch2>五、覆盖说明\u003c/h2>\n\u003cul>\n\u003cli>今日总帖数204篇，其中正文帖子185篇；带“文字观点”标签120篇；覆盖时段10:36~22:23。\u003c/li>\n\u003cli>附件覆盖情况：附件总数0；正文成功提取0；仅识别到文件名0；正文提取失败0。今日无附件需处理。\u003c/li>\n\u003cli>今日全部内容均基于正文帖子生成；未涉及“只有文件名没有正文”的附件来源，故没有因附件仅有 document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');

function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
