_label": "帖子正文", "excerpt": "GS CHINA OPEN｜高盛中国早报#交易台市场情绪（SENTIMENT） 市场成交额虽有所修复，但行情再度缺乏明确方向；成长、价值板块均出现个股上涨，但尚未形成一致共识。", "content": "", "publish_time": "2026-09-18 08:04", "tags": ["交易台", "文字观点"]}, "post:2026-09-18T10-29:8a4f396240fb": {"id": "post:2026-09-18T10-29:8a4f396240fb", "kind": "post", "title": "2026-09-18 10:29", "source_label": "帖子正文", "excerpt": "亿纬锂能更新-20260918 海外大单大超预期，看好明年需求释放和份额盈利 #与Fluence签订206GWh大额订单 事项：公司早上发布公告，公司与美国储能集成商Fluence签署供应协议，计划2027-2031年向其生产和交付206GWh电池，其中2027年承诺交付16GWh，2028-203", "content": "", "publish_time": "2026-09-18 10:29", "tags": ["文字观点"]}, "post:2026-09-18T08-41:3000b81a890a": {"id": "post:2026-09-18T08-41:3000b81a890a", "kind": "post", "title": "2026-09-18 08:41", "source_label": "帖子正文", "excerpt": "关注寒武纪、海光、摩尔、沐曦、天数、壁仞等 ✨#摩尔线程最新深度：国产全功能GPU蓄锐将驰 全功能GPU：统一架构、覆盖AI计算、3D图形渲染、科学计算与物理仿真和高清视频编解码。", "content": "", "publish_time": "2026-09-18 08:41", "tags": ["重点关注", "国内AI芯片供不应求加剧", "摩尔已与京东云合作建设10万卡", "产品覆盖芯片→集群", "首次覆盖、给予“买入”评级", "文字观点"]}, "post:2026-09-18T10-30:1b2cd16d3604": {"id": "post:2026-09-18T10-30:1b2cd16d3604", "kind": "post", "title": "2026-09-18 10:30", "source_label": "帖子正文", "excerpt": "重视沐曦股份、芯原股份超跌+Q3拐点带来的巨大机遇 【沐曦股份】今日解禁全部承接，当下位置胜率赔率极高。", "content": "", "publish_time": "2026-09-18 10:30", "tags": ["文字观点"]}}, "source_details": {"post:2026-09-18T08-37:3393a9b32609": {"id": "post:2026-09-18T08-37:3393a9b32609", "kind": "post", "title": "2026-09-18 08:37", "source_label": "帖子正文", "excerpt": "美银——前沿AI数据追踪——模型排名、使用数据与Token/GPU成本 前沿AI能力、AI使用与定价、以及AI投资节奏，持续主导大型互联网股票的估值与市场情绪。美银前沿AI追踪器（BofA Frontier AI Tracker）监测AI价值链的关键指标，涵盖前沿模型智能排名、使用趋势、Token定", "content": "美银——前沿AI数据追踪——模型排名、使用数据与Token/GPU成本 前沿AI能力、AI使用与定价、以及AI投资节奏，持续主导大型互联网股票的估值与市场情绪。美银前沿AI追踪器（BofA Frontier AI Tracker）监测AI价值链的关键指标，涵盖前沿模型智能排名、使用趋势、Token定价、GPU租赁费率及存储芯片成本。9月数据显示：Token价格在8月下跌后趋于稳定；Anthropic与OpenAI在智能指数上并列领先，模型间差距微小；Meta最新模型正快速缩小与前沿的差距，美银维持对Meta的买入评级，并期待其10月发布的新一代Watermelon大语言模型；开源模型使用份额持续攀升，DeepSeek在多平台Token用量中领跑；GPU租赁价格整体坚挺，印证AI基础设施需求保持健康；存储成本环比基本持平但同比仍处极高水平。短期内，围绕AI安全与监管的争论可能扰动超大规模云厂商的情绪，投资者需予以关注。 前沿模型智能排名：Claude Fable 5.1与GPT-6 Astra并列榜首 根据Artificial Analysis数据，Claude Fable 5.1（含fallback）与GPT-6 Astra（max版本）以53分的智能指数并列第一，Claude Opus 5以52分紧随其后。Meta最新模型MuseSpark 1.3（max）排名第五（48分），Gemini 3.8 Flash排名第十二（41分）。在代理任务（Agentic）指数上，Claude Fable 5.1以58分领跑，Claude Opus 5与MuseSpark 1.3并列第二（56分）。编程代理（Coding Agent）指数方面，Claude Fable 5.1与GPT-6 Astra同以62分位列榜首。综合来看，Anthropic与OpenAI在高端闭源模型上仍占据主导，但Meta的MuseSpark系列进步显著，性能差距正在收窄。 模型使用情况：DeepSeek领跑Token量，Anthropic领跑支出 Vercel AI平台数据显示，DeepSeek 9月至今的平均Token用量份额跃升至45.7%（8月为30.1%），稳居第一；Anthropic以13.6%位列第二，OpenAI为12%。支出份额方面，Anthropic以52%保持领先，但较8月的63.9%明显回落；OpenAI支出份额从13.3%升至21.8%，增幅显著。在OpenRouter平台，DeepSeek V4 Flash 0731以50.7万亿Token的月至今用量居首，GPT-5.6 Luna以45.1万亿Token位列第二。整体而言，开源/开放权重模型在用量端攻城略地，但闭源高端模型仍主导收入端。 Token定价：TPI环比回升，GPU租赁与存储成本分化 AI Token价格指数（TPI）截至9月13日环比上升5%（同比上升104%）至2.41美元/百万Token，主要驱动因素包括：（1）GPT-6 Astra以10美元/50美元（输入/输出，每百万Token）加入指数，与Fable 5.1并列最高价；（2）GLM-5.3-Flash以0.15/0.50美元成为新的价格下限；（3）DeepSeek V4.1 Flash替代V4 Flash，价格更低。与此同时，LLM Token支出指数（Silicon Data）环比下降11%至0.98美元。单任务成本方面，Claude Fable 5（含fallback）以8.75美元居首，GPT-6 Astra Max为3.26美元，性价比具备竞争力。 GPU租赁与存储芯片：需求健康，成本高企 GPU租赁市场表现分化：9月B200（Blackwell）租金环比微升1%至5.68美元/小时，H100（Hopper）降4%至2.65美元，A100（Ampere）降3%至1.60美元；但同比仍全面上涨（B200 +9%，H100 +30%，A100 +15%）。存储芯片方面，DRAM价格环比微涨1%（同比飙涨476%），NAND价格环比微跌1%（同比涨437%）。服务器使用寿命保持健康（A100自2020年开始出货），AI基础设施投资强度未见衰减。 投资启示 美银认为，9月数据传递出六大信号：（1）Token价格在8月回调后已企稳；（2）Anthropic与OpenAI在智能上并列领先，模型间差距极小；（3）Meta最新模型正缩小智能差距，对即将推出的AI产品及10月新模型Watermelon保持建设性看法，维持Meta买入评级；（4）开放模型使用份额持续提升，DeepSeek在多平台Token用量中领先；（5）GPU租赁价格坚挺暗示AI基础设施需求健康；（6）存储成本环比平稳但同比仍处极高水平。此外，AI安全/监管辩论可能在短期内影响超大规模厂商的市场情绪，建议投资者密切关注相关动态。#文字观点", "publish_time": "2026-09-18 08:37", "tags": ["文字观点"]}, "post:2026-09-18T08-09:7e370303ab84": {"id": "post:2026-09-18T08-09:7e370303ab84", "kind": "post", "title": "2026-09-18 08:09", "source_label": "帖子正文", "excerpt": "📑Gerstner：2027 年 3000 亿美元收入逻辑ℹ️背景：来自 Altimeter 公司布拉德・格斯特纳 2026 年 All‑In 峰会的观点：OpenAI 与 Anthropic 需要在 2027 年实现 3000 亿美元的收入（约为 2026 年收入的 3 倍），才能够维持当前 AI", "content": "📑Gerstner：2027 年 3000 亿美元收入逻辑ℹ️背景：来自 Altimeter 公司布拉德・格斯特纳 2026 年 All‑In 峰会的观点：OpenAI 与 Anthropic 需要在 2027 年实现 3000 亿美元的收入（约为 2026 年收入的 3 倍），才能够维持当前 AI 资本扩张周期。 📝这份草稿进行粗略测算：该收入目标对应分配给两家 AI 实验室 12 吉瓦的专用算力。 📌基准假设： 🔹1. 资本开支‑建设成本：每吉瓦 500 亿美元（66% 为芯片与服务器硬件；33% 为建筑、电力、托管）；12 吉瓦总建设成本等于 6000 亿美元。 🔹2. 算力租赁成本‑市场算力租赁：每吉瓦每年 150 亿美元（参考甲骨文‑OpenAI、Nscale‑Anthropic、Lambda‑Anthropic、IREN‑微软等交易区间每吉瓦每年 120 亿‑180 亿美元）；12 吉瓦年度租金总支出等于 150 亿美元 ×12 吉瓦 = 每年 1800 亿美元（OpenAI 与 Anthropic 支付给算力供应商）。 🔹3. 算力供应商回报测算：6000 亿美元资本开支按照 6 年摊销，每年摊销 1000 亿美元；另加上每年 200 亿美元运营成本（电力、人力）。供应商年度现金流：租金收入 1800 亿美元减去 200 亿美元运营支出等于 1600 亿美元；对应 6000 亿美元资产实现 25% 现金收益率。 🔹4. 训练与推理算力拆分：40% 租赁算力用于训练、安全对齐；因此仅有 7 吉瓦算力用于推理业务，以此产生收入。7 吉瓦推理算力需要覆盖 1800 亿美元总租金成本，实现现金盈亏平衡，对应每推理吉瓦需要实现 260 亿美元毛利。假设 40% 毛利率，每吉瓦推理需要实现 430 亿美元收入；7 吉瓦合计刚好达成目标 3000 亿美元总收入（两家合计）。 🔹5. Token 产出公式：实验室每吉瓦的年收入等于每千瓦时产出 token 数量乘以每年总千瓦时（95% 利用率下，1 吉瓦等于 80 亿千瓦时每年），再乘以实际变现单价（每百万 token 对应的美元）。Rubin 级别芯片：每千瓦时产出 300 万 token；单吉瓦每年可产出 25 千万亿 token。要实现每吉瓦 430 亿美元收入，全口径混合实际变现门槛为每百万 token1.8 美元。 🔹6. 付费与免费用户混合调整：订阅参考：20 美元普通订阅每月给到 1100 万 token，200 美元专业版给到 1.11 亿 token；作者判断普通用户很难耗尽额度，大量 token 被免费或者低价值用户占用。如果仅有 5% 用户付费，但 60% 的 token 流量来自付费用户（OpenAI 历史观测数据），付费 token 需要的实际单价抬升至每百万 token3 美元。 📊初步结论： 🔹每百万 token3 美元的付费 token 门槛看上去并不算高。如果这套测算大体成立，仅这新增的 12 吉瓦算力（尚不包括已经实现 1000 亿美元收入的存量算力），在 40% 毛利率、算力供应商拿到 25% 现金收益的前提之下，达成 3000 亿美元收入看起来难度不大，属于极度乐观的情景。 📈看涨侧额外观点： 🔹1）实际可以实现的混合变现单价大概率高于每百万 token1.8 美元。 🔹2）每千瓦时产出 300 万 token 的能效属于布莱克韦尔芯片级别，尚未计入未来 VR 等硬件带来的进一步性能提升。 🔍因此仅剩下两种可能性： 🔹①开源模型必须大幅压低每百万 token1.8 美元的变现价格（硬件能效不存在优势，只能开展价格战）。 🔹②OpenAI 与 Anthropic 在 2027 年根本拿不到 12 吉瓦算力。#文字观点", "publish_time": "2026-09-18 08:09", "tags": ["文字观点"]}, "post:2026-09-18T12-32:07b163c903b5": {"id": "post:2026-09-18T12-32:07b163c903b5", "kind": "post", "title": "2026-09-18 12:32", "source_label": "帖子正文", "excerpt": "#迈富时5亿港币定增解读#市价发行1、【前募进展】 今年5月的5亿港币定增募资已经用完。尽管公告显示仅使用了1.28亿港元，但实际已经锁定的GPU、服务器、组网硬件采购订单已经超过5亿港币（出于成本控制考虑，均为期货，所以尚未付款）。", "content": "#迈富时5亿港币定增解读#市价发行1、【前募进展】 今年5月的5亿港币定增募资已经用完。尽管公告显示仅使用了1.28亿港元，但实际已经锁定的GPU、服务器、组网硬件采购订单已经超过5亿港币（出于成本控制考虑，均为期货，所以尚未付款）。已经成功上线国内首个沐曦C600A集群，并且已经调试达到沐曦官方的token生产性能。目前正在测试超节点、PD分离等更多组网策略，进一步提升全栈token工厂效率。如果结合部分城市token券补贴（纳入当地token服务商的白名单），有望2-3年内收回成本，长期大幅增厚业绩。 2、【投资DeepSeek】 从紫金矿业的公告可以看到，迈富时子公司上海珍岛，作为唯一的AI应用公司，与宁德时代组团投资了DeepSeek 2亿人民币。宁德时代今年5月9亿美元收购世纪互联，6月50亿人民币投资DeepSeek。迈富时牵手宁德时代投资DeepSeek，显示迈富时正加速布局“能源-AIDC-GPU-大模型-应用”产业链，形成AI应用的生态护城河。 3、【海外布局】 在融资用途方面，相比5月定增，本次公告明确了海外token工厂的布局。公司正在积极地在东南亚和日韩考察AIDC和NCP，通过投资AIDC和长期租赁NV高性能服务器的方式，合规地获取低成本的算力和token，为海外AI应用开拓和全栈token工厂战略落地铺路。 4、【市价发行】 自中期盈喜以来，股价已经从底部28港币/股大幅反弹。在上升通道，采用50.85港币/股的市价发行，且大幅超过上轮定增的40.54港币/股，显示了投资人对未来股价的信心，以及管理层希望减少摊薄、保护现有股东的努力。 5、【投资人背景】 在东南亚和日韩有较强的AIDC和NCP资源，能够助力公司低成本获取海外的算力资源，加速投资回报。#文字观点", "publish_time": "2026-09-18 12:32", "tags": ["迈富时5亿港币定增解读", "市价发行", "文字观点"]}, "attachment:files/20260917 市场逻辑精选.pdf": {"id": "attachment:files/20260917 市场逻辑精选.pdf", "kind": "attachment", "title": "20260917 市场逻辑精选", "source_label": "其他", "excerpt": "市场逻辑精选 · 2026-09-17 · 第 1 页【红宝书】2026年9月17日市场逻辑精选 特别提示：下文涉及的题材或公司，内容罗列和篇幅长短，与后续涨跌无关，亦均非进行推荐，仅作研究辅助。投资者应自主决 策，注意 风险。", "content": "市场逻辑精选 · 2026-09-17 · 第 1 页【红宝书】2026年9月17日市场逻辑精选 特别提示：下文涉及的题材或公司，内容罗列和篇幅长短，与后续涨跌无关，亦均非进行推荐，仅作研究辅助。投资者应自主决 策，注意 风险。 一、市场热点 热点、央地重组破冰，整零协同站台前：汽车产业链三重共振； ◇驱动： 9月14日晚 广汽集团 公告拟发行股份购买 一汽股份 持有的整车合资公司部分股权，央地汽车集团重组首次破 冰，广汽目前停牌中。9月16日至18日，2026汽车产业供应链协同创新对接大会在天津国家会展中心举行，30余家 整车企业、1000余家零部件企业参会，现场签署战略合作协议并共建联合创新实验室，发布《汽车供应链企业及产 品名录(2026)》。9月10日 工信部 等九部门印发《智能网联新能源汽车产业发展“十五五”规 划》，明确2030 年进 入世界 汽车强国行列、推进企业 兼并重组。9月17日 零跑汽车 披露与一汽旗下动力业务达成技术 合作， 叠加金 九银 十旺季临近 ，行业 催化密 集落地。9月17日汽车零部件 板块指数上 涨1.28% 、净流入 16.6亿元 ，汽车整车 板块上 涨2 .04% 、净流入 5.2亿元 ，均胜电子 、金杯汽车 等涨停， 板块资金流入居全 市场前列。 ◇核心公司： 均胜电子 是全球 汽车安全、汽车 电子领域 的Tier1 龙头，也是本 次天津供应链协同大会现场签 约与共建实验室 体系的 零部件 直接受益人 ，客户覆盖全球 主流整车厂。央地重组与整零协同大会 指向供应链 体系的重新 卡位，安全系统 与 座舱电子这类平台级 零部件企业在 定点体系 中份额稳定 ，最容易进入新一轮协同合作名 单。9月17日 该股涨停 上涨1 0.02% ，午后13:17 封板、封板后未开板 ，属于首板启动；近三个交易 日累计上 涨7.1% ，距主板异动阈值 余量充足 。短期需注意首 板后板块情绪波动带来 的震荡风险。 拓普集团 是平台型 Tier1 厂商，覆盖底盘 、热管理 、智能 驾驶多条 产品线，是吉利 、赛力斯 整产业链能力。 DDR系列：公司目前的 DDR4产品已广泛应用于 PC、服务器、消费电子等领域。与此同 时，公司已成功研发并量产 DDR5产品，且性能指标达到国际主流水平（速率可达 8000Mbps ）。 LPDDR系列：针对移动终端市场，公司推出了 LPDDR4X 及LPDDR5/5X 系列产品。其中， LPDDR5X 最高速率可达 10667Mbps ，已进入小米、传音等主流手机厂商的供应链。 仅供内部参考，请勿外传！ 公司报告 | 首次覆盖报告 请务必阅读正文之后的信息披露和免责申明 5 HBM量产节奏规划清晰： 公司计划 2026年底启动 HBM3小规模试产， 2027年实现规模 化投产。随着国内 HBM产能逐步释放，国内 AI算力基础设施供给约束将得到显著缓解， 有效压降信创智算中心建设成本，加速国内 AI算力全产业链国产化落地。 2026年6月22日，长鑫存储自主研发 HBM3高带宽内存样品完成国内头部云厂商首轮适 配验证，国产高端 AI存储商业化进程取得关键突破，有望打破海外厂商长期垄断，补齐国 内信创 AI算力产业链核心短 板。 技术路线层面，公司采用跳代研发策略，跳过迭代相对落后的 HBM2e，直接攻坚 HBM3 前沿技术节点，自研样品技术水平已接轨国际一线标准；产品可适配昇腾、寒武纪等国产 主流 AI芯片，支撑国产智算服务器算力部署需求，实现 “国产 GPU+国产高带宽内存 ”全 链路自主可控。 1.4. 股权结构： 多元制衡，国家战略与市场化机制并行 长鑫科技的股权结构呈现出显著的多元化与制衡特征 ，公司无控股股东及实际控制人。 根 据公司股权结构，直接持有公司 5%以上股份的股东为清辉集电、长鑫集成、大基金二期、 合肥集鑫及安徽省投， 截至 2026年7月27日， 分别持有长鑫科技 19.50 %、10.54%、7.86%、 7.53%及7.12%的股权，不存在单一持股比例超过 50%的股东，公司的股权结构较为分散 。 我们认为 这种股权结构设计具有深远的考量。 首先，大基金二期与安徽省投等国资背景股 东的存在， 可能使公司在政策对接、资金支持及土地资源获取上 取得优势，体现了国家对 存储产业的支持。其次，清辉集电与合肥集鑫等员工持股平台的设置，有效地绑定了核心 管理团队与技术骨干的利益，这对于人才 密集型的半导体行业至关重要。最后，无单一实 控人的结构在一定程度上有利于公司保持经营决策的专业性与市场化导向， 可能避免单一 股东决策带来的盲目性，但也对董事会的协调能力与管理层的执行效率提出了更高的要求。 图 2公司股权结构（截至 2026年7月27日） 资料来源： ifind，天风证券研究所 1.5. 管理团队： 行业资深核心团队筑牢 DRAM人才壁垒 DRAM行业的竞争归根结底是人才的竞争。 公司组建了具备丰富行业经验的专业务实、锐 意进取的核心研发和运营管理团队。公司管理层团队的核心领导者拥有 25年以上半导体 行业经验，具备深刻的行业洞察力和卓越的战略定力，共同引领公司成长与战略落地。公 司技术与研发团队由海内外具备丰富半导体行业经验的专家团队组成，在 DRAM产品设计、 工艺开发、生产制造、质量管控等方面具备深厚的技术背景和丰富的管理经验。 曹堪宇先生（董事、 总裁）： 曹堪宇先生拥有博士学位，曾任职于多家国际知名半导体公 司，具备极深的技术造诣与管理经验。他主导了公司多代工艺技术的研发与量产，是长鑫 科技技术路线图的实际执行者。 表 1公司主要管理人员及职位 姓名 职位 工作经历 曹堪宇 总裁 博士研究生。 2002年5月至 2005年6月，曹堪宇先生先后曾任职 于美国飞利浦半导体股份有限公司、美国 Hyperband comm. 公司； 2005年7月至 2013年8月先后创立了北京昆天科微电子有限公司、 仅供内部参考，请勿外传！ 公司报告 | 首次覆盖报告 请务必阅读正文之后的信息披露和免责申明 6 北京凡达讯科技有限公司； 2013年11月至 2017年10月，任 NoV oMem,Inc. NAND 闪存事业部总经理。 2017年11月加入长鑫 科技后，先后任睿力集成执行副总裁、长鑫存储产品研发执行副总 裁、技术研发执行副总裁、长鑫集电总经理等职务； 2021年6月至 今，任长鑫科技董事； 2023年4月至今，先后任长鑫科技首席执行 官、总裁。 赵纶 总经理 本科学历。赵纶先生 1982年2月至 2002年4月，曾先后任职于原 邮电部半导体研究所、原电信科学技术研究院集成电路设计中心、 大唐电信科技股份有限公司微电子分公司等； 2002年4月至 2012 年2月，先后任大唐微电子技术有限公司总经理、副董事长，期间 曾任大唐电信科技股份有限公司董事、副总经理。 2012年2月至 2015 e33c7", "kind": "post", "title": "2026-09-18 18:14", "source_label": "帖子正文", "excerpt": "国产链加速推进，继续看好半导体机会#1、华为昇腾960提前及NPO发布👉昇腾960DT将于2027年Q1发布，比原计划提前三个季度；昇腾960PR将于2027年Q3发布，比原计划提前一个季度。", "content": "国产链加速推进，继续看好半导体机会#1、华为昇腾960提前及NPO发布👉昇腾960DT将于2027年Q1发布，比原计划提前三个季度；昇腾960PR将于2027年Q3发布，比原计划提前一个季度。同时华为推出业界首个量产的NPO产品，总容量达到7.2T，同时发布了全球首个采用NPO的超节点。 👉目前国产供应链的供应能力正在持续改善，支撑国产算力产品迭代超预期。此外各家公司均反馈在积极解决HBM供应问题，供需紧张态势逐步缓解，国产算力供应链卡点不断解决。#2、半导体设备订单口径上修👉本周召开长鑫供应链大会，根据设备厂商反馈，四季度两存会陆续与各家设备厂商沟通后续的批量采购框架协议（VPA），对明年订单预期会逐渐清晰。 👉除两存以外，晋华、荣芯等存储扩产带来新的增量，这部分或带动明年存储扩产超预期。 👉近期北方华创、华海清科、拓荆科技等设备企业交流口径有所上修，并对明年增速展望乐观。#3、核心关注标的前道设备：中科飞测、微导纳米、京仪装备、芯源微、北方华创、中微公司等 后道设备：长川科技、金海通、联讯仪器、华峰测控 零部件：恒运昌、高凯技术、江丰电子、富创精密、臻宝科技等 晶圆厂：中芯国际、华虹宏力 封测厂：长电科技、通富微电、汇成股份、甬矽电子 存储：长鑫科技#文字观点", "publish_time": "2026-09-18 18:14", "tags": ["1、华为昇腾960提前及NPO发布", "2、半导体设备订单口径上修", "3、核心关注标的", "文字观点"]}, "post:2026-09-18T13-52:9391bc8df570": {"id": "post:2026-09-18T13-52:9391bc8df570", "kind": "post", "title": "2026-09-18 13:52", "source_label": "帖子正文", "excerpt": "【浙商策略廖静池】美联储是“口头独立”还是“假戏真做”？——美债危机叙事辨析与下一步应对思路美国财政部试图托底美债长端利率但效果甚微，30年期美债收益率一度创2007年以来新高，“利率上、美元下”的背离也反复出现。", "content": "【浙商策略廖静池】美联储是“口头独立”还是“假戏真做”？——美债危机叙事辨析与下一步应对思路美国财政部试图托底美债长端利率但效果甚微，30年期美债收益率一度创2007年以来新高，“利率上、美元下”的背离也反复出现。要想理解当前市场的交易逻辑，关键在于把握“债务货币化、美联储独立性、强美元信用”三者之间的不可能三角。九月FOMC将至，当前美国政策选择面临的无非是两种基础情景的取舍： 1. 情景一：美联储“口头独立”，保债务货币化与美元信用，始终推迟真紧缩，结果是主权信用溢价推升长端收益率； 2. 情景二：美联储“假戏真做”，启动加息以修补美元信用，债务货币化阶段性受限，美元指数阶段性反弹，但紧缩周期的终点仍是择机重回宽松。针对上述两种情景，我们并不完全认同“加息则买红利、不加息则买科技”的市场主流观点。具体而言： 1. 若情景一发生，我们建议继续超配黄金、资源品/资源股、中国国债、短久期美债，红利配置侧重周期性红利股；科技股反而会因不确定性而高位震荡、内部分化，微盘风格受益于国内流动性充裕而承接抱团流出的部分资金。 2. 若情景二发生，我们的应对建议是以逆向思维去踩节奏：针对科技股，短期因悲观预期充足可积极交易靴子落地，中期对加息持续性保持敬畏心，长期看宏观洗礼后的新高远景。针对红利股，受益于美联储加息可采取与科技股节奏相反的镜像策略。针对微盘股，国内流动性保持充裕的前提下可参考红利的节奏。针对黄金，主要看信用对冲属性，加息周期阶段性弱势震荡，但美元金价长期看会创新高。针对大宗商品，信用对冲属性稍弱，震荡后价格仍由供需决定，中东冲突和厄尔尼诺是核心变量。 # 具体数据详见报告或联系团队成员 风险提示：美联储政策超预期风险；美国国债发行超预期风险；地缘冲突恶化；国内宏观政策不及预期风险。 ☎️联系人：廖静池/王大霁#文字观点", "publish_time": "2026-09-18 13:52", "tags": ["文字观点"]}, "post:2026-09-18T08-05:ccacecf6583d": {"id": "post:2026-09-18T08-05:ccacecf6583d", "kind": "post", "title": "2026-09-18 08:05", "source_label": "帖子正文", "excerpt": "📈美国股市盘面速览：反弹行情#交易台📌标普 500 指数上涨 114 个基点，收盘报 7637 点，收盘委托买入金额 43 亿美元。纳斯达克 100 指数上涨 173 个基点，报 29446 点。", "content": "📈美国股市盘面速览：反弹行情#交易台📌标普 500 指数上涨 114 个基点，收盘报 7637 点，收盘委托买入金额 43 亿美元。纳斯达克 100 指数上涨 173 个基点，报 29446 点。罗素 2000 指数上涨 55 个基点，报 2874 点。道琼斯指数上涨 61 个基点，报 51778 点。全美股票交易所合计成交 176.97 亿股，而今年日均成交量为 187.03 亿股。VIX 恐慌指数下跌 12.82 个基点，报 15.44。WTI 原油下跌 113 个基点，报 101.26 美元。美国 10 年期国债收益率下行 0.088 个基点，报 4.9344%。黄金上涨 189 个基点，报 4344。美元指数下跌 1 个基点，报 100.24，比特币上涨 72 个基点，报 76649 美元。 📌股票收盘全线走高，标普 500 录得 9 月表现第二好的单日行情。市场上涨广度较好，标普 500 成分股中有 292 只个股收红，AI 以及 “Magnificent7” 七大科技巨头是拉动大盘上行的最主要贡献力量。随着市场继续消化美联储昨日加息决议，美债收益率短暂休整，美国 10 年期国债收益率回落至 4.94%。高盛全球投资研究团队目前预期美联储将在 10 月会议上再次加息，同时认为中性利率将维持在 3.25%-3.5% 区间，并新增一次降息预期，降息时点为 2028 年 3 月（除 2027 年 9 月、12 月的两次降息之外）。有报道称中方要求伊朗约束胡塞武装，油价因此有所回落，WTI 原油维持在 101 美元每桶。特朗普最快将于下周二会见中东领导人，希望沙特的输油管道可以尽快恢复运行。 📌巨型市值科技板块（GSTMTMEG）上涨 168 个基点，领涨大盘，依旧是市场确定性最高的交易方向。根据高盛私人银行昨日数据：过去一个月，TMT 板块在美国所有行业中净买入规模最高，主要由云巨头的多头买入带动。市场对七大科技巨头的净配置比例已经从 6 月年内低点 14% 提升至约 20%，处于过去三年 95 分位。今日市场高弹性板块表现亮眼：动量股（GSPRHIMO）上涨 304 个基点，AI 半导体板块（GSCBSMHX）上涨 348 个基点，AI 龙头标的（GSX1AIL1）上涨 197 个基点，过去 12 个月强势标的上涨 376 个基点。今日空头挤压特征明显，滚动空头仓位标的（GSCBMSAL）上涨 360 个基点，高贝塔过去 12 个月弱势标的（GSCBLMOM）上涨 73 个基点。 📌从交易活跃度来看，我们交易台的活跃程度为满分 10 分中的 4 分，买入端成交贡献提升 586 个基点。资管公司买入端成交改善 3.96 亿美元，在宏观品类、科技板块、工业板块存在需求，可选消费与能源板块供给较少。对冲基金买入端成交改善 6.58 亿美元，在科技、可选消费、工业以及金融板块存在需求，宏观品类与通信服务板块供给较多。 📌衍生品市场：在昨日加息落地之后，叠加油价回落，市场走出一轮力度可观的反弹行情。波动率市场方面，近端 Gamma 期限被积极卖出，而纯 Vega 期限获得买盘，且呈现正向的现货波动率相关性。今日波动率偏斜的压缩走势，完全逆转了昨日偏斜陡峭化的行情。有意思的一点是，尽管行情波动较大，但客户围绕风险参数的交易活动并不多。纳斯达克 100 与罗素 2000 走势相近，罗素 2000 的固定行权价波动率在整条曲线上被积极卖出，对应现货表现相对偏弱。从资金流看，指数和个股层面都出现大量 10 月 20 日期权成交。指数端，高盛客户买入 1.1 万手 2026 年 10 月 20 日到期、行权价 690 的 QQQ 看跌期权，成本 2.96。市场同时出现一笔大规模的 AI 基础设施个股看涨期权买入程序，标的包括 MRVL、MU、SNDK。临近收盘，高盛客户买入 8000 手 2026 年 10 月 20 日到期、行权价 530 的 SMH 看跌期权。标普 500 上涨突破我们短期 CTA 策略阈值（7633 点），我们预计这将在短期内修正当前预估，并逐步消耗部分系统性卖盘。我们判断交易商 Gamma 头寸处于满分 10 分中的 6 分位置，若大盘上行 1%，交易商将进一步增加多头 Gamma 敞口，对应打分 8 分；若大盘下行 1%，打分仅 3 分。期权市场定价，标普 500 在明日期权到期前的预期波动幅度为 0.57%。（撰写人：Gail Hafif）#文字观点", "publish_time": "2026-09-18 08:05", "tags": ["交易台", "文字观点"]}, "post:2026-09-18T08-33:efb6a638bf57": {"id": "post:2026-09-18T08-33:efb6a638bf57", "kind": "post", "title": "2026-09-18 08:33", "source_label": "帖子正文", "excerpt": "【盘前0918】 1、美股在继续消化昨天美联储自2023年以来首次加息的影响，还是偏防御性加息，不能简单得出加息以后经济就要崩的结论。随着宏观因素落地，我们一直强调的三大流动性拐点也逐渐明朗，中东沙特和胡赛缓和，伊朗也有进展，油价出现回落，晚间也有中美前站消息，访美预期变强，英国按兵不动。", "content": "【盘前0918】 1、美股在继续消化昨天美联储自2023年以来首次加息的影响，还是偏防御性加息，不能简单得出加息以后经济就要崩的结论。随着宏观因素落地，我们一直强调的三大流动性拐点也逐渐明朗，中东沙特和胡赛缓和，伊朗也有进展，油价出现回落，晚间也有中美前站消息，访美预期变强，英国按兵不动。美股是最近六周以来最大单日涨幅，也验证了市场风险偏好修复共识，结构上硬科技更强，黄金都先抑后扬了突破4350了，10年美债收益率高位回落，VIX也大幅下降。 2、周三A股提前反应普涨，昨天适当回摆修正下，合情合理，属于良性分歧，指数延续做多窗口。我们还是维持到9.24之前风险偏好明显修复的判断（两周年的情绪催化），国庆前问题应该也不大，临近假期，筹码还是比较松，昨天量能还是1.83万亿，分歧承接的资金也不太多，但往往这个时候，越会酝酿更加平顺的反弹行情，类似8月初的情况。短期来看，加息预期的短期顶点出现了，短期的油价回落窗口开启，A股最近一周当弱不弱，修复行情的黎明将至。 3、技术上进一步确认了3850窄幅震荡区间还是有限，也就看看这轮能不能顺利突破3990的压制，前面两次试探都不太顺利。不过这次没有一举实现重要指数底部钝化的共振，要不然还能高看一线，震荡下探的时候还是有承接盘。结构上昨天抢跑的硬科技和周期调整得多点，都能预期到，前排比较偏题材和分散，前面大幅杀跌的粮食ETF题材跑回来，机器人ETF 也有最后一轮审厂催化。不过结合昨晚美股和商品的表现，大概率今天可以再演绎普涨格局，挺好的，说明是有行情的时候，普反窗口选择自己能够有信心抗住日内或者单日波动品种就好，有色ETF和工业有色ETF 昨天捞也对。 4、中美谈判会不会很顺利不好说，周末应该会有更多消息，加息环境下肯定是对科技景气品种更占优，继续震荡向上。科创半导体设备ETF，消费电子ETF，半导体ETF都有机会。我们继续强调，搞不定轮动的就乖乖拿着弹性宽基，科创100ETF，科创综指ETF，创业板50ETF，还有增强不错的科创50增强ETF。 （仅供内部参考，不做投资建议，基金投资需谨慎）#文字观点", "publish_time": "2026-09-18 08:33", "tags": ["文字观点"]}, "attachment:files/中泰证券-房地产行业统计局数据点评：新房销售延续筑底，二手房交易首次纳入统计-260916.pdf": {"id": "attachment:files/中泰证券-房地产行业统计局数据点评：新房销售延续筑底，二手房交易首次纳入统计-260916.pdf", "kind": "attachment", "title": "中泰证券-房地产行业统计局数据点评：新房销售延续筑底，二手房交易首次纳入统计-260916", "source_label": "中泰证券", "excerpt": "请务必阅读正文之后的重要声明部分新房销售延续筑底，二手房交易首次纳入统计 ——房地产行业统计局数据点评 房地产", "content": "请务必阅读正文之后的重要声明部分新房销售延续筑底，二手房交易首次纳入统计 ——房地产行业统计局数据点评 房地产证券研究报告/行业定期报告 2026年09月16日 评级：增持（维持） 分析师：由子沛 执业证书编号：S0740523020005 Email：youzp@zts.com.cn 分析师：侯希得 执业证书编号：S0740523080001 Email：houxd@zts.com.cn 分析师：王雯 执业证书编号：S0740526040005 Em 时要求从业机构开展助贷业务全面自查，建立健全助贷平台管理机制并加强 自我约束。协会还要求助贷平台在申请加入自律工作委员会筹备组时，须提交是否存在挪用信贷资金的第三方 专项审计报告。从固定收益视角看，助贷业务收缩将直接影响消费信贷资产的生成节 奏与入池资产质量，短期 内消费金融ABS的基础资产供给可能放缓，但合规水平较高的机构与平台有望在行业出清中获取更大的市场份 额，资产池整体信用质量有望在中期改善。 消费金融公司资本补充与公司治理调整集中落地。 8月以来，国家金融监督管理总局天津、上海、河北、重 仅供内部参考，请勿外传 2 多元金融 行业动态报告 请务必阅读正文之后的免责条款和声明。 庆、山西等地监管局集中公开了一批涉及消费金融公司的批复事项，涵盖注册资本变更、股权结构调整与高级 管理人员任职资格核准。其中，晋商消费金融获批由晋商银行增资 5亿元，注册资本由5亿元增至10亿元，晋 商银行持股比例由40%提升至70%，成为绝对控股股东，这也是该公 司成立十年来的首次增资，增资完成后正 式达到新版消费金融公司管理办法规定的注册资本最低 10亿元门槛。 目前行业内仍有蒙商消费金融与盛银消费 金融的注册资本未达标，分别为 5亿元与3亿元。人事方面，河北金融监管局于 8月18日核准幸福消费金融首 席信息官与董事会秘书任职资格，天津金融监管局同日核准天津京东消费金融首席风险官与首席合规官任职资 格。资本与治理的双重补强有助于提升机构的资本充足水平与风险抵御能力，也为后续业务转型与融资渠道拓 展提供支撑，但行业内部的资本实力差距可能进一步拉大，中小机构面临的合规与经营压力仍将持续 。 1.2行业事件 消费金融公司半年考呈现规模让位、业务优化特征。 伴随上市股东方2026年半年报陆续披露，持牌消费金 融公司上半年经营数据逐步浮出水面。截至 8月末，已有6家机构披露经营数据，头部机构总资产普遍出现明 显压降。招联消费金融截至 6月末总资产为1473.6亿元，较2025年年末下降11.9%，半年缩减近200亿元，上 半年实现营业收入66.9亿元、净利润13.8亿元，公司表示上半年主动压降总体规模、持续让利实体经济，信用 减值损失同比下降18.5%， 拨备率远高于行业平均水平。 苏银凯基消费金融总资产 650.2亿元， 较年初下降2.1%， 但较去年同期仍增长 3.1%，公司表示顺应监管政策导向进一步调整和优化资产结构，稳步提升直贷业务占比， 其大股东江苏银行于 4月完成增资，持股比例由 56.4%提升至61.3%。南银法巴消费金融上半年实现营业收入 32.2亿元，同比增长17.5%，净利润1.8亿元，同比增长22.4%。整体来看，规模已不再是消费金融公司的第一 经营目标，资产结构与业绩质量成为机构关注焦点，这一转变有助于改善消费金融 ABS底层资产的稳定性，但 短期内资产规模增速放缓也会对发行规模形成一定制约。 消费金融不良资产批 量转让提速。8月以来，多家消费金融公司集中通过银行业信贷资产登记流转中心挂 牌个人不良贷款转让项目，大额资产包频繁出现。 8月24日，杭银消费金融发布 2026年第14期个人不良贷款 转让公告，项目涉及资产 21265笔，未偿本金5.92亿元，未偿利息3.12亿元，合计本息9.04亿元，加权平均逾 期1083.71天。8月21日，四川锦程消费金融重新挂牌 2026年第2期个人不良贷款转让项目，未偿本息合计 2.3亿元，涉及资产140189笔、借款人86584户。8月14日，北银消费金融挂牌 2026年第6期个人消费贷不 良转让项目，未偿本息合计 6.29亿元，其中未偿利息占比 35.3%，全部为纯信用类贷款且均未进入诉讼程序。 从行业趋势看，个人不良贷款批量转让试点期限已延长至 2026年末，市场成交规模由 2021年的约47亿元增长 至2025年的约3291亿元，处置渠道由试点探索转入常态化运行。不良资产处置效率的提升有助于机构加快存 量风险出清、改善资产周转，但未诉资产比重上升也意味着后续回收处置的难度与不确定性有所增加，需关注 不良资产包定价对机构拨备与盈利的影响。 仅供内部参考，请勿外传 3 多元金融 行业动态报告 请务必阅读正文之后的免责条款和声明。 一级发行：ABS发行规模环比小幅回落，利率中枢保持 低位运行，金 融债发行节奏明显放缓 2.1 ABS发行：发行规模环比小幅回落，票面利率中枢维持低位，信贷 ABS期 限明显拉长 本报告所指消费金融行业 ABS基础资产主要来源于个人消费场景形成的小额、分散化债权。根据基础资产 特性与场景差异可细分为（ 1）信贷ABS，包含微小企业贷款、银行 /互联网消费贷款、信用卡分期贷款以及个 人汽车贷款； （2）企业ABS，包含微小企业贷款、银行 /互联网消费贷款以及一般 A，票面利率1.86%。该只债券与5月发行的26奇瑞汽金绿债01同属绿色金融债系列，票面利率较前一期 同期限品种下行6个基点。截至8月末，2026年消费金融行业累计发行金融债 8只，合计发行规模111亿元， 发行主体仍为5家。 8月金融债发行节奏放缓，反映行业融资修复进程存在波折。 从发行结构看，汽车金融公司仍是行业金融 债的主要发行力量，绿色金融债的 持续落地表明相关机构在绿色金融领域的探索进一步深化，新能源汽车贷款 投放对应的资金需求逐步形成稳定的融资安排。 从票面利率看， 8月新发债券1.86%的利率水平虽高于7月1. 63% 的年内低点， 但较3月同期限品种已明显下行， 头部汽车金融机构的融资成本仍处于历史低位。从主体范围看， 8月未新增发行主体，行业发行仍集中于少数信用资质较优的汽车金融公司。值得注意的是，截至 8月末持牌消 费金融公司仍未实现金融债破冰，行业融资渠道恢复仍不均衡，多数机构继续依赖股东增资、同业借款等资金 来源，融资结构的分化局面在一定时期内将持续存在 。 展望后续，消费金融行业金融债市场有望延续温和恢复态势。 全面重启仍需满足若干条件。首先，监管政 策的持续明朗化将为更多机构发行金融债提供清晰指引，助贷新规与个贷新规下业务整改成效显著的机构有望 逐步获得发行资格。其次，汽车金融公司有望继续发挥引领作用，随着行业资本补充与合规治理的推进，更多 中腰部汽车金融公司可能加入发行行列，发行主体与评级结构将进一步多元化。最后，宏观层面居民消费信贷 需求的稳健修复将支撑融资需求的持续增长。综上所述， 8月发行节奏的阶段性放缓并未改变行业融资环境边 际改善的中期方向，汽车金融公司融 资渠道持续拓宽，但持牌消费金融公司的融资突破仍有待时日，行业融资 结构不均衡的局面将在一定时期内持续存在 。 图表7： 截至8月末，2026年消费金融行业金融债发行情况 债券简称 发行起始日 发行规模(亿) 发行期限(年) 债券评级 票面利率(% ) 发行人简称 26汇理汽车绿色债01 2026-03-10 15.00 3.00 AAA 2.0000 广汽汇理 26奔驰汽车债01 2026-03-17 20.00 2.00 AAA 1.8500 梅赛德斯 26奇瑞汽金绿债01 2026-05-19 15.00 3.00 AAA 1.9200 奇瑞金融 26吉致汽车金融债01 2026-07-09 2.00 2.00 AAA 1.6400 吉致汽车金融 26吉致汽车金融债02 2026-07-09 13.00 3.00 AAA 1.7500 吉致汽车金融 26奔驰汽车债02 2026-07-16 20.00 2.00 AAA 1.6300 梅赛德斯 26瑞福德汽车债01 2026-07-22 11.00 3.00 AA+ 1.9800 瑞福德汽车金融 26奇瑞汽金绿债02 2026-08-18 15.00 3.00 AAA 1.8600 奇瑞金融 资料来源：公司公告，万得资讯，中信建投证券 仅供内部参考，请勿外传 6 多元金融 行业动态报告 请务必阅读正文之后的免责条款和声明。 二级交易：交易所市场内部分化加剧，银行间市场成交量与成交金额 小幅回落 截至2026年8月末，消费金融ABS二级市场成交活跃度呈现分化走势。 交易所市场内部走势分化，银行 间市场在7月回落后继续小幅收缩。成交量与成交金额环比变化方向基本一致，反映市场交易情绪有所分层， 整体流动性环境保持平稳。 交易所市场方面，沪深两所走势出现明显分化。 上海证券交易所成交量环比下降 25.0%至7120.5万份，成 交金额环比下降31.8%至61.6亿元。深圳证券交易所成交量环比增长 55.2%至7285.2万份，成交金额环比增长 61.2%至70.4亿元。深交所成交量与成交金额环比同步大幅增长，机构在深市平台的交易意愿明显回升，沪深 两所合计成交规模与上月基本持平，交易所市场整体流动性并未出现实质性走弱。 银行间市场方面，成交量与成交金额环比小幅回落，核心流动性支撑作用依然稳固。 银行间市场成交量环 比下降5.0%至29148.5万份，成交金额环比下降 4.8%至290.4亿元。银行间市场降幅较 7月明显收窄，交易活 跃度趋于稳定。从绝对规模看，银行间市场仍为全市场最大交易场所，当月成交量占全市场的 67.0%，流动性压 舱石效应依然存在，优先级证券票面利率维持低位，高等级短久期资产的稀缺性持续存在，配置型需求仍是市 场主导力量。 图表8： 当月各交易场所成交量（万份） 图表9： 当月各交易场所成交金额（亿元） 资料来源：万得资讯，中信建投证券 资料来源：万得资讯，中信建投证券 截至2026年8月末，消费金融ABS二级市场按基础资产类型的交易表现总体平稳。 成交分布继续向标准  "【XB机械】电科思仪调研要点更新260917 基本情况：公司是国内高端电子测量仪器龙头，基于高频射频信号仿真设计+大带宽实时中频信号处理+系统集成开发核心能力，产品矩阵涵盖微波/毫米波、光电、通信、基础测量仪器及测试系统，深度覆盖通信、航空航天、雷达、电子对抗及工业电子等高端应用。 光通信： #光谱分析仪：覆盖光芯片、光器件、光模块全产业链测试环节，其中光芯片环节为必备测试设备，针对下游高景气需求加码厂房改造，截至26M9在手订单近1w台。 #产品矩阵持续扩容：1.6T光示波器（芯片自研）、采样示波器、时钟恢复单元、误码仪均预计2027年推出，其中误码仪预计27H1外销，3.2T采样示波器有望27年推出。 PCB测试： #高多层、高传输速率、高价值的GPU背板、交换机背板等产品有明确测试需求，供给端仅是德科技已有批量订单及落地，但其货期极长，存在供给缺口。 #公司67G矢量网络分析仪核心算法已完成研发，误差修正模型、内部信号分离等核心技术经过长期积累已可满足大部分PCB测试需求，正联合开发适配产线的ATE架构测试系统，有望于27H1形成批量订单（当前已有小量订单）。 半导体：围绕射频芯片测试、SoC测试、光电芯片封测等三方向布局，提供向上期权。 卫星互联网及6G：参与星网终端协议等核心标准制定，未来行业进入量产阶段后，卫星组网及终端设备测试需求空间广阔，叠加国产替代趋势，公司亦将充分受益。 经营规划： #业绩：预期26年整体营收增速20%+，光通信高景气+供给端新产能构建提速，营收规模或高速增长。 #研发：持股员工基本以研发一线人员为主，持续加码研发人才的吸引、挖掘。 王昊哲/张恒晅/乐智华#文字观点", "publish_time": "2026-09-18 08:17", "tags": ["文字观点"]}, "attachment:files/华源证券-宇特光电(920157)深耕光连接产品领域，数据中心与光纤接入双领域布局-260918.pdf": {"id": "attachment:files/华源证券-宇特光电(920157)深耕光连接产品领域，数据中心与光纤接入双领域布局-260918.pdf", "kind": "attachment", "title": "华源证券-宇特光电(920157)深耕光连接产品领域，数据中心与光纤接入双领域布局-260918", "source_label": "华源证券", "excerpt": "请务必仔细阅读正文之后的评级说明和重要声明", "content": "请务必仔细阅读正文之后的评级说明和重要声明证券研究报告 电子|其他电子Ⅱ 北交所|新股申购 hyzqdatemark 证券分析师 赵昊 SAC：S1350524110004 zhaohao@huayuanstock.com 联系人 胡文瀚 huwenhan@huayuanstock.com宇特光电(920157.BJ) ——深耕光连接产品领域，数据中心与光纤接入双领域布局 投资要点： 宇特光电本次发行价格13.75元/股，发行市盈率14.05X，申购日为2026年9 月21日。此次发行数量为1767万股，发行后总股本为7067万股，此次发行数 量占发行后总股本的25%；经我们测算，公司发行后预计可流通股本比例为 25.64%，老股占可流通股本比例为2.48%。此次发行未安排超额配售选择权。 本次发行战略配售发行数量为530万股，占本次发行数量的30%。产业链公司 方面，长飞光纤光缆股份有限公司、亨通集团有限公司参与。发行募集资金拟用 于光纤连接器生产基地建设项目和光纤连接器研发中心建设项目：光纤连接器生 产基地建设项目的实施或将显著提升公司在光连接产品领域的产能和技术水平， 有助公司抓住数据中心市场和光通信行业战略机遇。光纤连接器研发中心建设项 目旨在突破行业技术瓶颈，提升公司在小型化、高速化、低能耗等关键技术上的 研发能力，并通过强化产学研合作机制推动技术成果的快速转化。 深耕光连接产品领域，数据中心与光纤接入双领域布局。根据宇特光电招股书， 公司是一家专注于光连接产品研发设计、精密制造与销售业务的国家级专精特新 “小巨人”企业，致力于为光通信领域设备商、系统集成商、国内外电信运营商、 光电子器件企业提供高性能的光连接整体解决方案。公司自成立以来始终深耕光 连接技术，核心产品主要应用于数据中心与光纤接入两大领域，在积极拓展国内 市场的同时，产品也远销南美、欧洲等多个国家和地区，旨在成为全球领先的高 性能光连接整体解决方案供应商。在数据中心领域，凭借领先的技术实力和产品 性能，公司已与光迅科技、长飞光纤、亨通光电等国内头部光通信企业建立长期 稳定的合作关系，相关产品已广泛应用于阿里巴巴、腾讯、字节跳动等全球顶级 互联网企业的数据中心。2023-2025年，公司的营业收入分别为21,218.63万 元、25,318.86万元和33,324.44万元，归母净利润分别为4,186.71万元、 4,644.71万元和6,916.95万元。 数据中心建设持续增长，光纤网络升级带动光纤连接器需求。根据宇特光电招股 书，光纤连接器最主要的应用场景是数据中心和光纤接入（FTTx），同时工业级 光纤连接器也逐渐在医疗、安防、能源等具有高技术要求的领域实现规模化应用。 根据中商产业研究院数据，2020年至2024年，全球数据中心市场规模保持高 速增长，2024年达到904亿美元，年均复合增长率达到10.0%，2025年市场 规模或进一步增长至968亿美元。作为数据中心的核心设备连接器件，数据中 心行业的高速发展也或将带动光纤连接器的需求增长。 申购建议：建议关注。公司是一家专注于光连接产品研发设计、精密制造与销售 业务的国家级专精特新“小巨人”企业，致力于为光通信领域设备商、系统集成 商、国内外电信运营商、光电子器件企业提供高性能的光连接整体解决方案。截 至2026年9月17日，行业可比公司PETTM中值达122X。建议关注。 风险提示：客户集中度较高及单一客户收入占比较高的风险、经营业绩下滑风险、毛 利率下滑风险。2026年09月18日 仅供内部参考，请勿外传 源引金融活水润泽中华大地 请务必仔细阅读正文之后的评级说明和重要声明 第2页/共18页内容目录 1.发行情况..........................................................................................................................4 1.1.发行信息：发行价格13.75元/股，发行市盈率14.05X............................................4 1.2.募投：光纤连接器生产基地及研发中心建设项目助力提升产能与研发能力.............5 2.深耕光连接产品领域，数据中心与光纤接入双领域布局..............................................6 2.1.业务：2025年数据中心领域产品营收1.85亿元，占营业收入55.66%...................6 2.2.模式：客户集中度较高，2025年前五大客户销售占比67.74%，光迅科技为第一大 客户..................................................................................................................................10 2.3.财务：2025年营业收入3.33亿元（yoy+31.62%）、归母净利润6,917万元 （yoy+48.92%）..............................................................................................................11 3.行业：数据中心建设与光纤接入升级带动光连接需求................................................13 3.1.数据中心建设持续增长，光纤网络升级带动光纤连接器需求.................................13 3.2.同行业公司：主要包括太辰光、蘅东光等..............................................................15 4.申购建议：建议关注...................................................................................................16 5.风险提示.....................................................................................................................17 仅供内部参考，请勿外传 源引金融活水润泽中华大地 请务必仔细阅读正文之后的评级说明和重要声明 第3页/共18页图表目录 图表1：宇特光电本次发行价格13.75元/股....................................................................4 度服务 于家庭、园区及政企用户的光通信网络建设，并与中国电信、中国联通、中国移动等大型运 营商及设备商保持了长期稳固的合作关系。截至2025年12月31日，公司已取得141项专 利，其中21项发明专利，并参与制定4项通信行业标准。 截至2026/9/18，谢小波直接持有公司28.77%的股份，并通过淮安宇锦间接控制公司 4.45%的股份，合计控制公司33.22%的股份，系公司控股股东、实际控制人。 图表4：谢小波合计控制宇特光电33.22%股份，为实际控制人 资料来源：宇特光电招股书、华源证券研究所注：截至2026/9/18 2.1.业务：2025年数据中心领域产品营收1.85亿元，占营业 收入55.66%仅供内部参考，请勿外传 源引金融活水润泽中华大地 请务必仔细阅读正文之后的评级说明和重要声明 第7页/共18页根据宇特光电招股书，公司主要从事光连接产品的研发设计、精密制造与销售业务。光 连接是指通过光纤和连接设备将两个或多个光通信设备连接起来，使光信号能够在各设备之 间传输的过程。光连接是光纤通信系统中的一个关键环节。光连接产品主要实现光信号高速、 大容量、长距离传输，提高光通信效率和质量，降低信号损耗和干扰，直接决定整个光纤通 信系统的工作性能。公司主要产品按照下游应用领域不同，可分为数据中心、光纤接入、配 件及其他三大领域产品。 数据中心领域产品：公司数据中心领域产品主要包括高速光模块光微连接组件、预制成 端连接器，主要用于光模块、服务器和交换机之间的光连接，满足大规模数据交互的需求。 图表5：公司数据中心领域产品主要包括高速光模块光微连接组件、预制成端连接器 产品名称 产品介绍 高速光模块光微连接组件产品图示： 产品功能：封装在光模块之中，用于激光器、探测器与外接光缆之间的光连接。可与各类型接头 多样化组合，能够按客户需求定制连接方式。产品应用场景：主要用于400G、800G以及1.6T 等高速光模块中光纤微连接。产品特点：公司产品长度公差量产可以控制到±0.15mm；单模MT 端插损最大值＜0.35dB，多模MT端插损最大值＜0.20dB，可靠性满足GR1435认证标准要求； FA端纤芯距≥127μm可自由定制，精度误差dX≤0.75μm、dY≤0.75μm，光纤端面研磨角度可自 由定制，角度误差≤0.3°，FA端可在-55℃~120℃的环境中正常工作，可通过105℃、 100%RH、1.3倍大气压的高压水煮验证；产品整体可靠性满足GR468认证标准要求。 预制成端连接器产品图示： 产品功能：微米级的精度，具有可实现高速率和低损耗连接的特点，可以根据需求定制不同的器 件。产品应用场景：主要用于数据中心交换机、服务器之间的光纤跳接。产品特点：公司多芯多 模、多芯单模连接器插损平均值分别为0.10dB、0.20dB；量产MT多模CoreDip指标≤50nm， 回损≥35dB；可在-40℃~85℃的环境中正常工作；公司自产的MPO连接器可靠性满足GR1435 认证标准要求。 资料来源：宇特光电招股书、华源证券研究所 光纤接入领域产品：公司光纤接入领域产品主要包括现场组装型光纤连接器、预制成端 单芯光纤连接器、设备及组件，主要用于光纤接入网的现场端接，实现光信号在不同光通信 设备中的传输。 仅供内部参考，请勿外传 源引金融活水润泽中华大地 请务必仔细阅读正文之后的评级说明和重要声明 第8页/共18页图表6：公司光纤接入领域产品主要包括现场组装型光纤连接器、预制成端单芯光纤连接器、设备及组件 产品类别 产品名称 产品介绍 现场组装型光 纤连接器预埋型光纤 活动连接器产品图示： 产品功能：预埋型光纤活动连接器使用冷接技术，内部预置有光纤和与光纤折射率相似的 匹配液，在使用时，现场操作人员仅需将需连接的光缆插入连接器，匹配液即可填充光缆 与预先内置的光纤在端面之间的微小间隙，较大程度降低光信号在连接处的反射和折射， 并在光纤接入场景中快速完成光路连接，不用借助复杂设备即可完成端接，具有现场组装 光学性能好、一致性强等优点。根据接口形状可以分为FC、SC、LC型。 产品应用场景：主要用于FTTH、FTTR、5G等光纤接入场景的光缆现场端接。 产品特点：公司产品插入损耗平均值为0.3dB，UPC研磨端面回波损耗≥50dB，APC研 磨端面回波损耗≥55dB；使用高精度塑料/金属V型槽，加工精度0.5um；光学性能优 异，机械性能、环境性能优良，符合YD/T2341.1-2011、Anatel及GR326可靠性认证 标准要求；可在-25℃～+75℃的环境中正常工作；一次组装成功率≥98%。 熔端型光纤 活动连接器产品图示： 产品功能：熔端型光纤活动连接器使用光纤熔端技术，内部无需预置光纤等材料，在现场 端接时，操作人员使用光纤熔端机， 层面的硬约束。表后自备电源缺口由2026年1.7GW扩至2030 年65.7GW，未来五年现场发电设备需求具备较高的确定性。#发电业务已升级为公司的增长引擎① 双平台分工：索拉燃气轮机主打大功率基荷，Cat 燃气内燃机主打快启与分布式，覆盖数据中心全场景供电； ② 订单可见度高：Joule 4GW、AIP 2GW已明确采购，Hun 最高 1GW，PROPWR至少1.5GW、并可扩至约 2.1GW，合计已形成 GW 级在手储备； ③ 产能同步扩张：2030年大型往复式发动机产能目标提升至2024年近3倍、燃气轮机提升至2.5倍。 #建筑工业26H1同比+36.3%，AI数据中心建设提供新增量 建筑工业 26H1 收入155.1亿美元（+36.3%），占三大板块外部销售 42.5%。北美同比+49.2%、贡献约 75% 的增量；26M6美国数据中心建设支出同比+45.8%至 680亿美元，参与数据中心项目的承包商平均在手订单 11.4 个月、高于行业整体的8.0个月，公司建筑设备需求正持续向数据中心、交通、能源等大型项目集中。本轮增长77.7%来自销量，经销商已由去库转向补库。#资源工业长周期景气延续资源工业 26H1 收入84.5亿美元（+11.9%），金铜价格中枢抬升带动矿企资本开支扩张（2026年预计680亿美元、+18.7%），存量设备后市场收入潜力超过初始设备 3 倍。两大主业同步向上，共同夯实公司整体盈利与现金流基础。 ☎️欢迎联系【国金机械团队】满在朋/刘民喆/郑秀秀#文字观点", "publish_time": "2026-09-18 09:32", "tags": ["发电业务已升级为公司的增长引擎", "资源工业长周期景气延续", "文字观点"]}, "post:2026-09-18T12-46:a7a42a121301": {"id": "post:2026-09-18T12-46:a7a42a121301", "kind": "post", "title": "2026-09-18 12:46", "source_label": "帖子正文", "excerpt": "梅花庄：英伟达的Rubin服务器开始使用800V电源架构；功率器件在服务器中的主要使用场景就是电源方向", "content": "梅花庄：英伟达的Rubin服务器开始使用800V电源架构； 功率器件在服务器中的主要使用场景就是电源方向； 东微半导的产品下游在服务器电源中占比较高； ---ms#文字观点", "publish_time": "2026-09-18 12:46", "tags": ["文字观点"]}, "attachment:files/华源证券-潍柴动力(000338)柴发+气发+SOFC三轮驱动，AI电力时代公司价值重塑-260917.pdf": {"id": "attachment:files/华源证券-潍柴动力(000338)柴发+气发+SOFC三轮驱动，AI电力时代公司价值重塑-260917.pdf", "kind": "attachment", "title": "华源证券-潍柴动力(000338)柴发+气发+SOFC三轮驱动，AI电力时代公司价值重塑-260917", "source_label": "华源证券", "excerpt": "请务必仔细阅读正文之后的评级说明和重要声明", "content": "请务必仔细阅读正文之后的评级说明和重要声明证券研究报告 汽车|汽车零部件 非金融|首次覆盖报告 hyzqdatemark 投资评级：买入（首次） 证券分析师 李泽 SAC：S1350525030001 lize@huayuanstock.com 陈嵩 SAC：S1350525070005 chensong@huayuanstock.com 联系人 市场表现： 基本数据 2026年09月16日 收盘价（元） 25.52 一年内最高/最低 （元）36.34/13.65 总市值（百万元） 220,498.43 流通市值（百万元） 176,073.52 总股本（百万股） 8,640.22 资产负债率（%） 64.49 每股净资产（元/股） 11.09 资料来源：聚源数据潍柴动力(000338.SZ) ——柴发+气发+SOFC三轮驱动，AI电力时代公司价值重塑 投资要点： 砥砺前行数十载，矢志打造自主动力“中国心”。公司前身可追溯到1953年成立的“潍 坊柴油机厂”，1956年试制成功6160型中速柴油机，走上了柴油机专业化生产之路。 2005-2020年公司通过收并购系列国内外优质资产，持续夯实能力矩阵&拓宽业务边界。 2020年至今，公司多次刷新商业化柴油机本体热效率世界纪录。2025年M系列大缸径 发动机全年销量首次突破1万台，推出全球首款5兆瓦级高速柴油发电产品20M61。当 前公司业务已涵盖动力系统、商用车、农业装备、智慧物流、电力能源等多个业务板块。 北美缺电背景下，AIDC用电需求增长：我们测算北美数据中心的装机容量有望从2025 年的40GW左右提升至2030年130-170GW（按中值测算，较之25年增量达110GW）， 非北美地区AIDC驱动新增用电需求预计也有望达到100GW以上。2026-2030年燃机 用于满足AIDC用电需求的有效供给累计在100GW左右，故非燃机AIDC用电需求缺口 预计也在100GW以上，以往复式内燃机/SOFC为代表的其他离网发电形式或大有可为。 往复式内燃机在AI发电的应用主要是柴发（备电）与气发，潍柴产品具备全球竞争力。 柴发目前是数据中心备电的主要选择；气发则可能是50-400MW数据中心离网主电的优 选。大缸径技术是数据中心发电机的核心壁垒，公司攻关该技术多年，大缸径产品性能已 可对标康明斯、卡特彼勒等海外龙头产品且交付周期或有优势。 SOFC可能是中长期最具潜力的离网主电形式，潍柴深度布局金属支撑路线。SOFC的主 要缺点是系统部署成本&LCOE均明显高于燃机。展望2030年，若SOFC的单位部署成 本大幅优化，其可能全方位领先其他离网主电形式，不仅将受益于AIDC非燃机需求的溢 出，也有望一定程度上实现对其他能源形式的替代。潍柴长期深耕的金属支撑型路线兼具 机械强度与抗热震性，支持秒级快速启动，长期发展潜力可观。 盈利预测与评级：我们预计公司2026-2028年归母净利润分别为159.2/200.4/230.1亿 元，同比增速分别为45.7%/25.8%/14.8%，截至2026年9月16日，股价对应PE分别 为13.8/11.0/9.6倍。选取杰瑞股份、中国动力、东方电气为可比公司，可比公司按Wind 一致预期计算的2026年平均PE为25.3x。公司作为国内柴发/气发/SOFC均有较深度布 局的头部企业，有望充分受益于AI电力需求的持续景气，首次覆盖，给予“买入”评级。 风险提示：1）宏观经济与地缘政治风险；2）新业务拓展不及预期风险；3）产能扩张不 及预期风险；4）市场空间测算的风险。 盈利预测与估值（人民币） 2024 2025 2026E 2027E 2028E 营业收入（百万元） 215,691 231,809 250,904 288,924 315,792 同比增长率（%） 0.81% 7.47% 8.24% 15.15% 9.30% 归母净利润（百万元） 11,403 10,931 15,924 20,038 23,009 同比增长率（%） 26.51% -4.15% 45.68% 25.84% 14.83% 每股收益（元/股） 1.32 1.27 1.84 2.32 2.66 ROE（%） 13.15% 11.73% 15.55% 17.58% 18.07% 市盈率（P/E） 19.34 20.17 13.85 11.00 9.58 资料来源：公司公告，华源证券研究所预测2026年09月17日 下载日志已记录，仅供内部参考 源引金融活水润泽中华大地 请务必仔细阅读正文之后的评级说明和重要声明 第2页/共30页投资案件 投资评级与估值 我们预计公司2026-2028年归母净利润分别为159.2/200.4/230.1亿元，同比 增速分别为45.7%/25.8%/14.8%。截至2026年9月16日，股价对应PE分别为 13.8/11.0/9.6倍。我们选取杰瑞股份、中国动力、东方电气为可比公司，三家可比公 司按Wind一致预期计算的2026年平均PE为25.3x。潍柴动力作为国内柴发/气发 /SOFC均有较深度布局的头部企业，有望充分受益于AI电力需求的持续景气，首次 覆盖，给予“买入”评级。 关键假设 我们预计，公司2026-2028年营业总收入分别为2509、2889、3158亿元，同 比分别增长8.2%、15.2%、9.3%；毛利率分别为22.5%、23.2%、23.7%。分业务 来看，2026-2028年预计动力总成、整车整机及关键零部件业务收入为 1042/1376/1596亿元，同比分别增长3.8%/32.0%/16.0%；智慧物流业务收入为 964/1002/1042亿，同比分别增长5.8%/4.0%/4.0%；农业装备业务收入为 203/212/220亿，同比分别增长8.3%/4.0%/4.0%；其他零部件业务收入为 165/165/165亿，同比分别增长38.7%/0.0%/0.0%；其他业务收入为135/135/135亿， 同比分别增长39.8%/0.0%/0.0%。 投资逻辑要点 1）公司传统主业整体景气度向好：公司动力总成、整车 负载的 9%，训练占 14%；预计到 2030 年，推理算力将占到 37%，训练仅占 13%。 今年 2 月，英伟达宣布将与多家数据中心相关方合作，研究专为分布式推理设计的小型数据中心。 《华尔街日报》周四报道，美国公司 Crusoe 曾在德克萨斯州建设大型数据中心综合体，供给 OpenAI 使用，如今该公司也在测试小型数据中心。报道称，这类小型项目相比大型项目成本更低，而美国各地的大型基建项目普遍遭遇工期延误。Crusoe 并未回应置评请求。 Crusoe 是 AI 建设浪潮中业务快速扩张的新型云服务商之一。该公司于周四宣布完成 39 亿美元融资，投后估值达到 309 亿美元。#文字观点", "publish_time": "2026-09-18 18:10", "tags": ["文字观点"]}, "attachment:files/citrini-机器人技术零界点-实地调研.pdf": {"id": "attachment:files/citrini-机器人技术零界点-实地调研.pdf", "kind": "attachment", "title": "citrini-机器人技术零界点-实地调研", "source_label": "citrini", "excerpt": "Robotics Tipping Point: A Citrini Field Trip 机器人技术的临界点：Citrini 实地调研 Seeing is Believing 眼见为实 It was 60 degrees, damp and windy – August in San Francisco. 气温华氏60度（约15.5摄氏度），潮湿多风——这是", "content": "Robotics Tipping Point: A Citrini Field Trip 机器人技术的临界点：Citrini 实地调研 Seeing is Believing 眼见为实 It was 60 degrees, damp and windy – August in San Francisco. 气温华氏60度（约15.5摄氏度），潮湿多风——这是旧金山的八月。 Between graffitied picnic tables in a dive bar’s backyard, between local IPAs and cheap lagers, I listened to the “ reindustrialize bros” talk about slicing US-sourced magnet slabs, building electric motors for military drones, and machining actuators for robots Made in America . 在一家破旧小酒馆的后院，在涂鸦遍布的野餐桌之间，就着本地IPA精酿与廉价拉格，我听那群*“再工业化兄弟们”*谈论切割美国本土磁体板料、为军用 无人机制造电动机，以及为“ 美国制造 ”的机器人加工执行器。 The energy was palpable – a group of mostly young guys passionate about building technology that exists in your hand rather than on a screen. No one could doubt their enthusiasm, but I needed to see it for myself. 现场的劲头清晰可感——这是一群以年轻人为主的伙计，热衷于打造那种握在手中、而非只存在于屏幕上的技术。没有人能否认他们的热情，但我需要 亲眼验证。 Under its new branding of “Physical AI” , is robotics evolving from Bay Area backwaters to a true technological renaissance? Or was this happy hour more like a renaissance fair – a romantic longing for an irretrievable past when the US made things? 在*“物理AI”*这一全新标签之下， 机器人技术 究竟是正从湾区的边缘角落走向一场真正的技术复兴？还是说这场欢乐时光更像一个文艺复兴集市——对 美国曾经制造实物的那个一去不返时代的浪漫怀想？ As a Citrini analyst on a field trip – I wasn’t leaving without some answers. 作为一名前来实地考察的Citrini分析师——不带走一些答案，我是不会离开的。 At Citrini, we’ve dubbed robotics a thematic mega-trend. We’ve followed the industry and its enablers dating back to our Humanoid Robotics primer last April, and have held “robotics” as a core basket in the Citrindex since. Last year, I traveled to China to meet their top robot shops and the factories promising the actuators and roller-screws to feed them. 在Citrini，我们将机器人技术定义为一个主题性超级趋势。自去年4月发布** 人形机器人主题入门报告以来，我们持续跟踪该行业及其赋能企业，并将 “机器人”作为Citrindex的核心篮子持有至今。去年，我远赴中国**，拜访了当地最顶尖的机器人厂商，以及那些承诺供应执行器与滚柱丝杠、为其供货 的配套工厂。 But it’s been an admittedly hard sector to tackle, especially from behind a keyboard. The problem with robotics today is that its most impressive versions live behind a shroud. Everyone has talked to ChatGPT, most readers have probably used a coding agent, yet very few have seen an AI- enabled robot fold laundry, pack a mixed pallet, or speak with a pedestrian. 但不可否认，这是一个难以研究的行业，尤其是隔着键盘远距离观察时。当下机器人领域的问题在于：其最令人瞩目的形态都遮蔽在幕布之后。人人都 和ChatGPT聊过天，大多数读者或许都用过编程智能体，但很少有人亲眼见过一台AI机器人叠衣服、码放混装托盘，或是与行人交谈。 I went to pull back the curtain. Across a week in the Bay, I met with a dozen of the leading labs, watched bots in action, and prodded engineers and investors to understand the true state of US robotics. Most importantly I saw it with my own two, biological, eyes.Robotics Tipping Point: A Citrini Field Trip https://www.citriniresearch.com/p/robotics-tipping-point-a-citrini 1/60 我此行就是要揭开帷幕。 在湾区待了一周，我走访了十几家头部实验室，观看了机器人实际运行，并不断追问工程师和投资者，试图弄清美国机器人 行业的 真实状况。最重要的是，这一切我都亲眼见过——用我这双血肉之躯的眼睛。 What I found changed my view of Robotics broadly, my understanding of form factors and neural networks, my handicap of commercialization timeline, my view of the trade … 此行所见改变了我对机器人行业的整体判断、我对硬件形态与神经网络的理解、我对商业化时间表的预估，也改变了 我对这笔交易的看法…… Note to Readers on Citrini’s New Ownership 致读者：关于 Citrini 所有权变更的说明 Waiting on its (ChatGPT) Moment 等待属于它的（ChatGPT）时刻 In theory, the computational architecture that ushered the AI revolution – generalized intelligence of LLMs – should also unlock a new wave of instruments that both understand and manipulate the physical world. Jensen called Physical AI the “next frontier” of intelligence, Goldman Sachs called humanoids the next leg of the robotics trade. 理论上，引发这场 AI 革命的那套计算架构——LLM 的通用智能——同样应当能解锁一批既能理解又能操控物理世界的新型机器。黄仁勋称 Physical AI 是智能的“下一个前沿”，高盛则称人形机器人是机器人行情的下一程。 But… where are the robots today? Not in mass commercialization, but mostly in development training and tele-op’ed demos, often in controlled environments, optimizing clicks over durability. Early real-world deployments, where they exist, are closer to pilots than obvious ROI investments. The best stuff is mostly held behind tightly monitored, closed doors. 可是……机器人如今在哪里？并没有大规模商业化，大多数仍处于开发训练和遥操作演示阶段，往往在受控环境中运行，追求的是点击量而非耐用性。 少数已有的早期真实部署，与其说是回报清晰的投资，不如说更接近试点项目。最好的东西大多被锁在监管严密的门后。 The unavoidable cliché (which I heard plenty of times) is that robotics is waiting for its “ChatGPT moment ”. 那句避不开的老生常谈（我在此行中听了无数遍）是：机器人行业正在等待它的“ChatGPT 时刻”。 But what does that even mean? For stock-watchers, they are probably asking “when do the charts go up?” In my opinion, a true ChatGPT moment is more of a universal recognition of a broadly applicable and highly disruptive technology. I doubt OpenAI’s own engineers needed the public release to understand what they were sitting on. 但这到底是什么意思？对盯盘的人而言，他们大概在问*“行情图什么时候涨起来？”* 在我看来，真正的 ChatGPT 时刻，更多是市场对一项广泛适用、 高度颠覆性技术形成的 普遍认知 。我并不认为 OpenAI 自己的工程师需要等到公开发布，才明白自己手里握着的是什么。 Part of the problem: there are plenty of candidates earning partial credit, and plenty who have cried wolf. Take just the last month, as an example. 问题的一部分在于：拿到部分分数的候选者不少，喊“狼来了”的也很多。仅以过去一个月为例。 In August, GeneralistAI announced GEN-1.5 , a “one-shot” learner to significant fanfare, showing that a bot could complete simple tasks of manipulation based on instructions without task-specific training. 八月，GeneralistAI 发布了 GEN-1.5 ，这款“单次学习”（one-shot）模型引起广泛关注，表明机器人 无需针对特定任务的专门训练，仅凭指令即可完成 简单的操作任务。 This “in-context” learning suggests the bot has enough broad understanding of the physical world (what are objects, how do they move) that it doesn’t need to be fed mountains of data to brute-force specific tasks.Robotics Tipping Point: A Citrini Field Trip https://www.citriniresearch.com/p/robotics-tipping-point-a-citrini 2/60 这种“上下文内学习”表明，该机器人已对物理世界（物体是什么、如何运动）具备足够广泛的理解，因此无需依靠海量数据以暴力穷举的方式去攻克特 定任务。 Technical detractors, however, question whether this is true generalization, or whether the “distribution” of pretraining data provided sufficiently similar (but technically distinct) examples. Non-technical detractors suggest that opening a pencil case is far from “technological revolution”. 然而，技术层面的质疑者怀疑这是否属于真正的泛化能力，抑或只是预训练数据的“分布”恰好提供了足够相似（但在技术上有所区别）的样本。非技术 背景的质疑者则认为，打开一个铅笔盒距离“技术革命”还很遥远。 Seeing an infant begin to understand and manipulate the world is awe-inspiring but a far cry from high utility. Even if you know it’s learning, you know there is a long way to go. 看到一个婴儿开始理解并摆弄身边的世界，固然 令人惊叹 ，但距离高实用性还相差甚远。即便你知道它在学习，你也清楚前路依然漫长。 Not to be outdone, Skild AI followed up with a very similar announcement of “in-context” demonstrations of its S1 model though with more complex tasks lasting up to 10 minutes – most amusing in my opinion, cooking and flipping a pancake! 不甘示弱， Skild AI 随后发布了内容非常相似的公告，展示了其 S1 模型的“上下文内”（in-context）演示，不过任务更为复杂，时长最长可达 10 分钟 ——在我看来最有趣的一幕，当属做饭和翻煎饼！ (We’ll get much deeper on this brain development later.) （关于这一大脑开发的话题，我们稍后会深入探讨。） The language here is intentional. The obvious allusion is OpenAI’s May 2020 paper: “Language Models are Few-Shot Learners” which showed a massive breakthrough in GPT-3’s generalized reasoning, which improved dramatically with pre-training scale – implicitly suggesting their own future will follow that of TradAI (“traditional AI”, as I’m trying to coin it). 这里的措辞是刻意为之。最明显的典故指向 OpenAI 2020 年 5 月的论文： \"Language Models are Few-Shot Learners\" （《语言模型即少样本学习 者》），该论文展示了 GPT-3 在通用推理上的重大突破，且这一能力随预训练规模的扩大而显著提升——这隐含地暗示着他们自身的未来将沿着 TradAI（“传统 AI\"，我正尝试创造这一说法）的轨迹发展。 But if the ChatGPT litmus test is universal recognition , last month’s World Robotics Games in China was arguably closer to the mark. 但如果说 ChatGPT 这块试金石衡量的标准是 广为人知 ，那么上个月在中国举办的世界机器人运动会可以说更贴近这一标准。Robotics Tipping Point: A Citrini Field Trip https://www.citriniresearch.com/p/robotics-tipping-point-a-citrini 3/60 A flood of viral videos emerged from Beijing showing the advancements in humanoid-form hardware: bots running faster than Usain Bolt, high jumping to ceiling height, and occasionally crashing in comical plumes of sparks and smoke. Unitree’s concurrent IPO helped attract the financial world’s attention. 北京涌现出大量刷屏视频，展示了人形机器人硬件的进步：机器人奔跑速度快过博尔特（Usain Bolt），跳高能触及天花板，偶尔还会在滑稽四溅的火 花与烟雾中摔毁。宇树科技（Unitree）同期推进的 IPO 也帮助吸引了金融界的关注。 Humanoid Olympics may seem like an exercise in the absurd, but really are a top-down strategic effort to push the limits of hardware in a competitive, visible and verifiable setting. Sending a humanoid at full sprint into a crash wall is literally “moving fast and breaking things”. 人形机器人奥运会看似一场荒诞的表演，实则是一项自上而下的战略行动，旨在通过一个竞争性、公开可见且可验证的场合推动硬件的极限。 让一台人 形机器人全速冲刺撞向撞击墙，堪称名副其实的 *“快速行动，打破一切”**。* Scoff at your own risk. Americans watching this little guy going out in a literal blaze of glory should be upset it’s not happening in their country. 嗤之以鼻，后果自负。看着这个小家伙真真切切地在一片烈焰荣光中谢幕，美国人应该感到懊恼的是：这样的场面并没有发生在自己的国家。 The locomotion of these bots, the speed of iteration in hardware, and a growing list of serious builders, is undoubtedly impressive. But we’ve seen impressive, tele-operated and pre-programmed acrobatics for years. Remember Boston Dynamics caught the world’s attention with its humanoid back in 2009. But these machines remain a Sharper Image novelty without a brain.Robotics Tipping Point: A Citrini Field Trip https://www.citriniresearch.com/p/robotics-tipping-point-a-citrini 4/60 这些机器人的运动能力、硬件迭代的速度，以及越来越多认真做事的制造商，无疑都令人印象深刻。但那种令人惊艳的遥操作与预编程杂技，我们已经 看了好些年。别忘了，波士顿动力早在2009年就凭借其人形机器人吸引了全世界的目光。然而，这些机器至今仍是没有大脑的 Sharper Image 式新奇 玩具。 Ok… but what about back in May, when Figure AI hosted a nine day livestream of a furiously-dedicated humanoid (team) sorting 250,000 packages – a blend of both autonomous cognition, dexterous manipulation and full body, locomotion, and real world application? 好吧……但五月份那件事又怎么说？当时 Figure AI 进行了为期九天的直播，一群拼尽全力的人形机器人（团队）分拣了25万个包裹——这可是自主认 知、灵巧操作、全身运动能力与真实世界应用的结合。 Each of these examples misses the mark in some way. We’ve shown the key attributes – early intelligence and autonomy, highly impressive locomotion, real-world automation. What’s less obvious is all three rolled into one indisputably useful package. 上述每一个例子都在某种程度上有所欠缺。我们已经展示了关键属性——早期的智能与自主能力、令人印象深刻的运动能力、现实世界的自动化。不那 么显而易见的是，将这三者集于一身、打包成一个无可争议的实用产品。 I think the “ChatGPT moment” is a red herring (perhaps a cliché of its own) . 我认为“ChatGPT 时刻”是一种误导（这本身或许也已成了一种陈词滥调）。 There might be a massive “aha” moment, but more likely it will be a mosaic of signals that tell us we’ve reached the tipping point. It will be only after the breakthroughs occur and products appear in the real world that their utility is widely acknowledged. 或许会出现一个巨大的“顿悟”时刻，但更可能的是，一组 拼图式的信号 会告诉我们已经到达临界点。只有 在突破发生、产品走进现实世界 之后，其效用 才会得到广泛认可。 As far as where we stand today, here’s what I think is true. The basic locomotion of humanoids is a solved problem that’s only getting cheaper and more accessible (geopolitical and supply chain considerations notwithstanding). Complex dexterity is meaningfully more complicated but is being successfully attacked through multiple hardware approaches. Simple repetitive tasks like package sorting are already readily trainable, unlocking automation opportunities and near-term commercialization while models and bots improve. Complex tasks are coming along faster than you think. 至于我们今天所处的位置，以下是我的判断。人形机器人的基础运动能力是一个已经解决的问题，而且正变得越来越便宜、越来越触手可及（尽管存在 地缘政治和供应链方面的考量）。复杂的灵巧操作则明显更为困难，但正在通过多种硬件路径被成功攻克。像包裹分拣这类简单的重复性任务如今已可 轻松训练，在模型和机器人不断改进的同时，打开了自动化机遇与近期商业化的空间。复杂任务的到来速度比你想象的更快。 Robotic autonomy is more of a curve than a switch, and it looks something like this. 机器人的自主性更像一条 曲线，而非一个开关，大致如下所示。Robotics Tipping Point: A Citrini Field Trip https://www.citriniresearch.com/p/robotics-tipping-point-a-citrini 5/60 Broad generalizability is the furthest goal, but all the ingredients are there so clearly that it seems hard to bet against. Every day the curve pushes a bit further to the right. 广泛的通用能力是最远期的目标，但所有要素都已清晰到位，要押注它不会实现，似乎很难。这条曲线每天都在向右多推进一点。 Maybe the best answer to the cliché is to embrace it. If you had a time machine, would you invest in AI before its ChatGPT moment? 也许应对这个陈词滥调的最佳方式，就是坦然接受它。如果你有一台时光机， 你会在 AI 迎来自己的“ChatGPT 时刻”之前投资 AI 吗？ But before you get robo-pilled, we need to get into the details. There’s a lot of ground to cover, but if you bear with me, it will be well worth it (between you and me, this is my favorite piece I’ve written) . 但在你彻底“入坑”机器人叙事之前，我们需要深入细节。要讲的内容很多，不过如果你耐心读下去，一定会物有所值*（悄悄说一句，这是我自己最满意 的一篇作品）*。 1. The Body: Hardware and Humanoids 2. 躯体：硬件与人形机器人 3. The Brain: Grading the Class 4. 大脑：给全班打分 5. Capability and Commercialization 6. 能力与商业化 7. Four Predictions for Robotics 8. 对机器人领域的四项预测 9. What’s the Trade? 10. 交易机会在哪里？ 1) The Body: Hardware and Humanoids 1) 躯体：硬件与人形机器人 Before we move forward, let’s address the most polarizing word in robotics – humanoid. The very tired debate goes like this: why should a robot look like a human? 在继续之前，先来谈谈机器人领域最具争议性的一个词—— 人形机器人 。那场早已令人厌倦的争论是这样的：机器人凭什么要长得像人？Robotics Tipping Point: A Citrini Field Trip https://www.citriniresearch.com/p/robotics-tipping-point-a-citrini 6/60 The anti-humanoid camp has most of robotics history in its corner. There are many robots today and almost none look like humans (or at least not full humans). They are designed for a specific task which they perform with superhuman speed and precision. Our modern world relies on these workhorses, and the remaining cases that still require human handling are just scraps — small TAM edge cases. 反人形阵营拥有几乎整部机器人发展史的支持。如今的机器人已经很多，但几乎没有长得像人的（至少不像 完整的 人）。它们为特定任务而设计，并以 超越人类的速度和精度执行。现代世界依赖这些主力机型，而剩余仍需人工处理的场景不过是边角料——TAM 很小的边缘案例。 The pro-humanoid camp says a hotdog maker can make 1,000 hotdogs in a day, but what if I want a burger? If we’ve already automated all repetitive and programmable tasks, then what’s left requires something new – a one-size-fits-all Swiss Army knife that can occupy and manipulate a world that has been built for humans. Not a package sorter, but a universal worker that can sort packages if you ask it. 支持人形阵营则认为：一台热狗机一天能做 1,000 个热狗，可如果我想吃汉堡呢？如果我们已经把所有重复性和可编程的任务都自动化了，那么 剩下的 工作就需要一种新事物——一把万能的瑞士军刀，能在一个为人类打造的世界中行动和操作。它不该只是一台包裹分拣机，而应是一个通用工人——你 让它分拣包裹，它就能分拣。 The reason why this hasn’t happened yet is because we haven’t had robots with enough generalizable intelligence and dexterity to be worthwhile. The pro-humanoid camp has most of science fiction’s imagination on its side. 之所以至今未能实现，是因为我们还没有拥有足够可泛化的智能与灵巧性、从而值得投入的机器人。而科幻作品中的想象，大多站在支持人形阵营一 边。 On the Humanoid Spectrum 关于人形光谱 This is yet another false dichotomy. There aren’t two categories – rather there is a wide range of approaches using the same intelligence architecture to tackle different tasks. Often at least some part of them looks human-y. 这又是一个虚假的二分法。实际上并不存在 两种类别——而是存在一系列广泛的技术路线，它们采用相同的智能架构来应对不同任务，其中往往至少有 一部分形态带有人形色彩。 After all, the programmable robotic arm is the most ubiquitous and useful robot form in history. If we just call every factory arm or cobot a “partial humanoid” it would put the debate to rest. 毕竟，可编程机械臂是历史上最普及、最实用的机器人形态。如果我们就把每台工厂机械臂或协作机器人都称作“部分人形机器人”，这场争论也就该尘 埃落定了。Robotics Tipping Point: A Citrini Field Trip https://www.citriniresearch.com/p/robotics-tipping-point-a-citrini 7/60 Where you fall on the humanoid spectrum depends on what you are trying to do. Indeed many humanoid projects start with off-the-shelf arms from companies like Universal Robots, FANUC, or Rainbow. 你在人形机器人谱系上处于哪个位置，取决于你想做什么。事实上，许多人形机器人项目一开始就直接采用 Universal Robots、FANUC 或 Rainbow 等 公司的现成机械臂。 The brains start with table-mounted manipulators. For researchers training physical AI models – Physical Intelligence, Generalist, Skild, or Dyna – the setup is typically a frankenstein-half torso strapped to a table: two cobot arms or manipulators with some kind of “hand” attached and an overhead stereo camera and cameras mounted on each wrist. This is a cheap and easy setup to test and train models without having to think about custom hardware. 至于“大脑”，则往往从桌面式操作臂起步。对于 训练物理 AI 模型的研究机构——Physical Intelligence、Generalist、Skild 或 Dyna——典型配置是固定 在桌面上的一套“拼装”而成的半身躯干：两条协作机械臂或操作臂，末端装上某种“手”，头顶上方一个立体相机，两个腕部各装一台相机。这种配置便 宜且简单，可用于测试和训练模型，而无需考虑定制硬件。 Once you have a robot that can do something useful on a table, the easiest way to add basic mobility to the torso is through a fixed (often wheeled) base. The tradeoffs are obvious – they are far cheaper and simpler but they sacrifice lower-half dexterity and mobility and are incapable of stairs, terrain or any number of other mobility challenges. 一旦你有了能在桌面上做 某些有用的事的机器人，为躯干增加基本移动能力的最简单方式，就是配一个固定（通常为轮式）底座。其取舍显而易见—— 这类底座便宜得多、结构也更简单，但牺牲了下半身的灵巧性与移动能力，无法应对楼梯、复杂地形以及其他诸多移动挑战。 Many early attempts at task-specific commercialization have taken this route. China’s Galbot – whose humanoid was one of the standouts from the Beijing games – currently markets two mobile-based torso’d robots, the S1 and G1 for industrial and personal uses respectively. 许多面向特定任务的早期商业化尝试走的都是这条路。中国的 Galbot——其人形机器人是北京运动会上的亮点之一——目前销售两款带移动底座的躯 干式机器人：S1 和 G1，分别面向工业和个人用途。Robotics Tipping Point: A Citrini Field Trip https://www.citriniresearch.com/p/robotics-tipping-point-a-citrini 8/60 Another example, Weave Robotics, has trained a laundry folding robot with its first iteration Isaac 0 actually now operating in homes and businesses (if you live in California you can order one today for $249/month! ) 另一个例子是 Weave Robotics，该公司训练出了一台叠衣机器人，其第一代产品 Isaac 0 目前已实际投入家庭和商业场所运行（ 如果你住在加州，今 天就能以每月 249 美元的价格订购一台！ ） But what about stairs? Can it load and unload the machine? Does its folding quality pass inspections? 但楼梯怎么办？它能往机器里装取衣物吗？它的折叠质量能通过检验吗？ It’s far from a full-fledged robo-butler, but the argument for early deployments is that you have to start putting things into the field in order to learn what works and what doesn’t, begin to ramp production scale and drive down costs. (Weave’s next iteration Isaac 1 will be out shortly with better capabilities and a cuter demeanor.) 它距离功能齐全的机器管家还很远，但支持早期部署的理由在于：你必须先把产品投入实际场景，才能知道什么可行、什么不可行，并着手扩大生产规 模、压低成本。（Weave 的下一代产品 Isaac 1 即将问世，能力更强，神态也更讨喜。） Full humanoids are the most complex and expensive, but replicate the full mobility and near dexterity of the human form. Something that can climb stairs, run, jump, crouch, crane. From a simple hardware perspective, locomotion and full body dexterity are essentially solved. Pre-programmed dance routines and gymnastic displays demonstrate fluidity, balance and grace, even verging into “superh", "status": "extracted"}, "post:2026-09-18T18-15:0c831f65f752": {"id": "post:2026-09-18T18-15:0c831f65f752", "kind": "post", "title": "2026-09-18 18:15", "source_label": "帖子正文", "excerpt": "国产算力供应链进展顺利，2027年业绩展望积极 供给端：昇腾迭代超预期，国产供应链进展顺利，HBM限制问题逐步解决。华为全联接大会表明昇腾960系列将提前发布，其中960DT提前3个季度到27Q1发布，960PR提前1个季度到27Q3发布，国产供应链能力持续改善，支撑龙头设计公司产品迭代超预期。", "content": "国产算力供应链进展顺利，2027年业绩展望积极 供给端：昇腾迭代超预期，国产供应链进展顺利，HBM限制问题逐步解决。华为全联接大会表明昇腾960系列将提前发布，其中960DT提前3个季度到27Q1发布，960PR提前1个季度到27Q3发布，国产供应链能力持续改善，支撑龙头设计公司产品迭代超预期。此外各家公司均反馈在积极解决HBM供应问题，供需紧张态势逐步缓解，国产算力供应链卡点不断解决。 需求端：下游CSP、算力中心等需求反馈良好。2026年以来下游CSP厂商Capex持续上修，行业仍维持供不应求状态，同时各地算力中心建设推进积极，工信部规划2030年智算规模9800EFLOPS（FP16），需求端无虞。 供应链卡点逐步解决，龙头厂商积极顺价。摩尔线程等龙头公司与下游CSP厂商合作进展顺利，同时积极沟通顺价传导成本压力，整体供应链卡点解决+顺价，2027年龙头公司业绩展望积极。 国产算力链从稀缺的先进制程能力，到百花齐放的设计公司，再到超节点，均会迎来放量机会，同时先进制程、先进封装、先进存储以及配套产业链有望迎来强劲增长动能。建议关注：1）AI芯片设计公司：寒武纪、海光信息、摩尔线程、沐曦股份、天数智芯等。2）上游供应链：中芯国际（A/H）、华虹宏力（A/H）、长鑫科技、长电科技、通富微电、甬矽电子等。3）其他：华勤技术、深南电路、兴森科技、南亚新材、南芯科技等。 欢迎交流~#文字观点", "publish_time": "2026-09-18 18:15", "tags": ["文字观点"]}, "post:2026-09-18T18-15:69f361c5a748": {"id": "post:2026-09-18T18-15:69f361c5a748", "kind": "post", "title": "2026-09-18 18:15", "source_label": "帖子正文", "excerpt": "是什么推动了市场？#交易台亚洲市场普遍走高，科技板块与人工智能相关股票领涨亚太市场，得益于英伟达带动的半导体板块走强以及华为供应链的最新进展，而富时指数再平衡资金流也为多个市场提供了额外提振。", "content": "是什么推动了市场？#交易台亚洲市场普遍走高，科技板块与人工智能相关股票领涨亚太市场，得益于英伟达带动的半导体板块走强以及华为供应链的最新进展，而富时指数再平衡资金流也为多个市场提供了额外提振。韩国、中国台湾地区、日本、中国和香港均录得显著涨幅，资金轮动至半导体、人工智能基础设施及科技龙头股。澳大利亚尽管材料和科技板块表现强劲，但大盘基本持平；东盟市场表现分化，印尼落后，泰国小幅上涨。印度延续近期的反弹势头，能源价格提振了市场偏好。 区域综述 澳大利亚：ASX 200 指数 - 0.01%。澳大利亚股市收盘基本持平，ASX 200 指数收盘报 8725.8 点，下跌 0.08%，掩盖了市场内部的显著分化。科技和材料板块分别上涨 2.38% 和 2.34%，而能源、必需消费品与非必需消费品板块表现落后。材料板块主导涨幅，受黄金和关键矿产类股票走强推动，PDI Gold、Develop Global、Ora Banda Mining、Greatland Resources、Genesis Minerals、Lynas Rare Earths 和 IperionX 等个股表现突出。科技板块也获得强劲买盘，由 4DMedical 和 Megaport 引领。宏观情绪得到日本央行加息 25 个基点至 1.25% 的支撑，其中 7 比 2 的投票分歧被解读为偏鸽派，导致日元走弱并提振区域风险偏好。澳大利亚储备银行行长布洛克的鹰派言论支撑了澳元，而英伟达积极评论后美股隔夜大涨也提供了额外助力。油价下跌支撑了整体风险偏好，但却严重拖累能源板块，使能源板块成为当日表现最弱的行业。 中国台湾地区：TAIEX 指数 + 1.93%。中国台湾股市大幅收涨，TAIEX 指数收于 47000 点上方，隔夜市场利好消息支撑了大盘股的广泛买盘。富时指数再平衡活动在大部分交易时段相对平淡，多数与指数相关的资金集中在收盘竞价阶段。散户投资者主导了日内价格走势，并对动量板块保持风险偏好。此前表现疲软的板块，包括 CCL 和 ABF 相关个股，在昨日表现不佳后出现显著反弹。科技板块全面跑赢非科技板块，为市场涨幅提供支撑。柜台交易活动总体平静，资金流主要来自纯多头投资者。市场成交额显著改善，环比增长 26%，反映出随着市场上行，市场参与度有所增强。 韩国：KOSPI 指数 + 2.66%。指数开盘跳空高开，并在盘中维持上涨动能，收盘站稳 6800 点上方。外国投资者终结了连续七日的净卖出态势，转为净买入，这得益于富时再平衡临近带来的资金大幅流入；国内机构则是主要买方，对科技股需求强劲，全天吸引 9.36 万亿韩元资金流入。涨幅集中在人工智能供应链，其中三星电子（005930）上涨 3.4%，SK 海力士（000660）上涨 6.4%，跟随费城半导体指数（SOX）3.1% 的涨幅。三星电机（009150）上涨 4.4%，LG 伊诺特（011070）攀升 4.9%，受斗山（000150）投资计划相关消息以及本地券商上调三星电机目标价的提振。KOSPI 成交额较 20 日均值高出 9.7%，而韩元兑美元贬值 0.1%，收于 1382.9。 日本：日经指数 + 1.38%。日本股市本周走高，日经 225 指数上涨 2.07%，东证指数（TOPIX）上涨 1.79%。市场逐步走高，但成交量清淡，整体处于区间震荡，因为投资者在美联储和日本央行会议前保持观望态度。两家央行均如期加息 25 个基点，而日本央行内部出现的两张反对票被解读为偏鸽派信号，引发日元走强并推动日经指数回调。尽管美联储决议后日元回落至接近 156 的水平，但受投资者在下周长假前获利了结影响，人工智能相关股票涨势放缓。日本央行决议后出现少量买盘，但资金流入依然有限。银行股在日本央行会议前表现疲软，TPNBNK 周跌幅达 1.43%，而在市场解读此次加息偏鸽派后，抛售有所加速，尽管市场头寸相对较轻。利率互换市场（OIS）仍暗示今年再次加息的概率为 82%，高盛经济学家预计下一次加息将发生在明年一月。国防和造船板块表现最为强劲，分别上涨 4.9% 和 6.3%，得益于有报道称日本正考虑将国防开支提升至国内生产总值的 3.5%。 中国：沪深 300 指数 + 1.06%。内地股市跟随美股隔夜反弹行情提振，A 股走高，上证综指创下三周以来最强表现，成交额时隔两周首次突破 2 万亿元人民币。科技股领涨，在市场强势表现的背景下，华为供应链相关消息也提振了市场情绪。据报道，新款 Atlas 960E SuperPoD 可提供类qq1490929960似算力的同时，容量提升了 4 倍，并采用光互联替代铜互联。高盛中国半导体指数上涨 4.49%，高盛中国存储芯片指数上涨 3.79%。除科技板块之外，地产股在午后大幅拉升，地产行业涨幅居前。投资者还消化了十五五规划相关的房地产行业新闻发布会内容，但未出现重大意外。市场呈现普涨格局，逾 4200 只股票收涨。资金方面，买入账户与卖出账户之比为 1.25:1，买盘集中于存储器、半导体设备和游戏板块，而材料、消费和电池板块则遭遇抛售。 中国香港：恒生指数 + 0.60%。港股上涨，恒生指数上升 0.6%，恒生科技指数表现更佳，涨幅达 2.2%，创下自 9 月初以来最强的单日表现。科技股领涨大盘，平均涨幅为 3.2%，而电信板块是唯一收跌板块，受腾讯（0700）、中国联通（0762）和中国电信（0728）拖累。联想（0992）大涨 9.5%，收于历史高位，领跑恒生指数和恒生科技指数，得益于英伟达在其云大会上带动的强人工智能相关乐观情绪。阿里巴巴（9988）上涨 4.0%，受益于其云大会前的乐观情绪以及市场围绕华为最新芯片发展的热情。半导体个股走强，华为半导体（1347）和中芯国际（0981）分别上涨 4.8% 和 4.4%。南向资金提供支持，连续第十个交易日呈现净流入，资金流入达 119 亿港元。额外支撑来自报道称美国将推迟宣布新关税，直至本周之后，叠加油价走弱以及对日本央行加息的鸽派解读。 东盟：JCI 指数 - 0.52%，表现弱于区域同业，国内板块表现分化。消费品板块表现最差，而材料板块是唯一收涨板块。Bayer Resources 出现交易波动，在创始家族出售公司约 30% 股份给 PT Inalum 之后股价大跌。印尼、马来西亚和泰国板块表现分化，SET 指数上涨 0.13%，小幅走高，由公用事业板块领涨，此前 EGCO 同意收购位于纽约的 Astoria Energy 燃气发电厂 45% 的股权。泰国股市和油价提供了额外支撑，而菲律宾的消费和材料板块内部分化，抵消了多个板块的疲软。 印度：Nifty 指数 + 0.19%。印度股市震荡收高，在 23300 点附近徘徊，有望连续第三个交易日上涨，并可能终结为期五周的连跌态势。此轮反弹得益于全球油价进一步回落，布伦特原油跌破每桶 102 美元，缓解了通胀担忧，以及隔夜标普 500 指数和纳斯达克指数创下自 8 月初以来最佳表现所带来的积极情绪。信息技术板块是唯一收跌的板块，而地产、金属和能源板块则领涨大盘。广基市场表现更优，小盘股和中小盘股指数分别上涨 0.8% 和 1.2%。#文字观点", "publish_time": "2026-09-18 18:15", "tags": ["交易台", "文字观点"]}, "attachment:files/万联证券-电力设备行业跟踪报告：《智能网联新能源汽车产业发展“十五五”规划》印发-260915.pdf": {"id": "attachment:files/万联证券-电力设备行业跟踪报告：《智能网联新能源汽车产业发展“十五五”规划》印发-260915.pdf", "kind": "attachment", "title": "万联证券-电力设备行业跟踪报告：《智能网联新能源汽车产业发展“十五五”规划》印发-260915", "source_label": "万联证券", "excerpt": "本报告由中信建投证券股份限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供，在遵守适用的法律法规前提下， 本报告亦可能由中信建投（国际）证券限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。", "content": "本报告由中信建投证券股份限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供，在遵守适用的法律法规前提下， 本报告亦可能由中信建投（国际）证券限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业动态·理财子产品发行指数周报第 272期 光大理财发混合类产品， 光大理财产品和资产结构 核心观点 从发行数量看，上周样本理财子产品 195只，发行量环比持平。 具体看，发行数量增加的有 5家，占比为45.5%。平均基准利率为 2.44%，环比上升6bps，最新理财子产品发行数量指数 443.18，发行 基准利率波动指数最新 55.43，环比上升2.6%。9月11日，样本理财 子产品破净率0.17%，环比回落0.27%。最新观点更新：上半年，光 大理财产品和资产结构。 本周指数更新（9月7日-9月11日） 1、三大指数环比变化情况 从发行数量来看，最新理财子产品发行数量指数 443.18，环比持 平，发行数量保持稳定。调整后理财子产品发行数量指数 310. 94，环 比持平。从发行数量偏离度来看，最新偏离度为 1.02，环比持平，该 指数显示：上周发行 195只产品中，有193只为固收类产品，2只为 混合类产品，混合类产品发行数与上周持平，偏离度基本持平。 从发行风险指数来看，最新理财子产品风险指数为 1.87，环比上 升4.3%，风险等级有所升高。上周发行 2只PR3的产品，PR3产品占 比为1.03%。从发行基准利率波动指数来看，最新指数为 55.43，环比 上升2.6%。 从不同类型产品的发行基准利率来看，上周固收类产品平均业绩 比较基准为2.44%，环比上升6bps；混合类产品平均业绩比较基准为 2.55%，环比下降5bps；全部产品平均业绩比较基准为 2.44%，环比 上升6bps。 2、样本理财子公司发行情况 从发行数量看，上周样本理财子发行 195只，发行量环比持平。 具体看，发行数量增加的有 5家，占比为45.5%。发行数量减少的有 6家，占比54.5%，减少最多的为农银理财，环比减少 11只。当周发 行数量最多的为信银理财。平均基准利率为 2.44%，环比上升6bps。 其中：基准利率上升的理财子有 6家，占比为54.5%，提升幅度最大 的是招银理财；平均发行基准利率最高的为招银理财，为 3.80%；基 准利率下降的理财子 5家，占比为45.5%，下降最多的是工银理财。 固收类产品平均发行基准利率为 2.44%，最高的亦为 招银理财 （3.80%）；混合类产品平均的基准利率为 2.55%，最高的为光大理财 为2.55%。 维持 强于大市 马鲲鹏 makunpeng@csc.com.cn SAC编号：S1440521060001 SFC编号：BIZ759 李晨 lichenbj@csc.com.cn SAC 编号:S1440521060002 SFC 编号:BSJ178 杨荣 yangrongyj@csc.com.cn SAC 编号：S1440511080003 SFC编号：BEM206 王欣宇 wangxinyu@csc.com.cn SAC 编号:S1440525070014 发布日期： 2026年09月17日 市场表现 相关研究报告 -4%1%6%11%16%21% 银行上证指数 银行 下载日志已记录，仅供内部参考 行业动态报告 银行 请务必阅读正文之后的免责条款和声明 3、 重点理财子产品介绍 上周重点产品共2只为混合类产品，由光大理财发行。我们选择1只产品为例。这1只产品为：“光大理 财·阳光橙鑫盈打新策略优选目标盈 19期（封闭式）”。 4、 最新观点更新：上半年，光大理财产品和资产配置结构 结构特征分析：整体来看，光大理财在2026年上半年呈现出“固收为基、混合发力、权益谨慎”的产品 策略。固收类产品规模增长近 900亿元，但占比下降2.62个百分点至87.87%，虽然仍占绝对主导，但权重进 一步向混合类让渡。混合类产品表现突出，规模增长近 700亿元，占比由9.47%提升至12.09%，实现数量与规 模双增，成为公司产品规模扩张的重要引擎 ，显示出光大理财持续加大 “固收+”及多资产策略布局的方向 。权 益类产品规模则维持在较低水平并小幅收缩。总体而言，光大理财在巩固固收基本盘的同时，继续依靠混合类 产品增强收益弹性，产品结构向“固收为主、混合增强”的方向进一步演进。 整体来看，2026年上半年光大理财穿透后的可投资资产规模增加约 1610.19亿，达到22340.76亿。为与 原模板口径保持一致，将 2026年半年报披露的现金及银行存款、同业存单、拆放同业及债券买入返售、债券 和非标准化债权类资产合并计算为固定收益投资，则固定收益投资规模约 19814.70亿，较2025年末增加742.42 亿；公募基金增加698.41亿，权益类投资增加 65.82亿，金融衍生品减少 20.14亿。固定收益投资占比由 92.00% 下降至约88.70%，公募基金占比由4.44%提高至7.25%，权益类投资占比由 3.14%提高至3.20%，金融衍生品 占比由0.18%下降至0.08%。固定收益投资依然是第一大资产类型。需要注意， 2026年半年报按照G06a口径 重新细分资产类别，“境外资产”等科目与此前“代客境外理财投资QDII”并非完全相同口径。 这显示2026年上半年，光大理财在资产配置上继续延续 “固收为主、多元增强”的稳健基调，但结构调整 进一步向公募基金等标准化多资产工具倾斜 。固定收益投资绝对规模仍增加超过 700亿元，继续发挥组合“压 舱石”作用，但由于公募基金等资产扩张速度更快 ，占比下降约3.3pct。与此同时，公募基金规模大幅增加近 700亿元，占比提升2.81pct，成为上半年最主要的增配方向；权益投资小幅增加，而金融衍生品配置有所回落。 整体来看，光大理财在守住固收基本盘的同时 ，持续推进“固收+”及多资产配置策略，资产端变化也与产品端 混合类产品快速扩张形成较强对应 。 下载日志已记录，仅供内部参考 行业动态报告 银行 请务必阅读正文之后的免责条款和声明 目录 一、理财子产品发行指数简介 ................................ ................................ ................................ ..................1 二、三大指数环比变化情况 ................................ ................................ ................................ .....................2 三、样本理财子公司发行情况 ................................ ................................ ................................ ..................4 四、理财子产品净值变动：上周，理财子产品净值回升 ................................ ................................ ...........6 五、 资金流向和上证指数 ................................ ................................ ................................ .......................7 六、 样本理财子固定收益类产品的收益率和发行数量 ................................ ................................ .............7 七、重点产品介绍 ................................ ................................ ................................ ................................ ...9 八、 理财子公司动态 ................................ ................................ ................................ .............................. 9 九、 最新观点更新：上半年，光大理财产品和资产结构变化 ................................ ................................ ...9 十、风险提示 ................................ ................................ ................................ ................................ ........ 14 图表目录 图表1： 理财子产品发行指数的逻辑与分解 ................................ ................................ ............................2 图表2： 理财子产品发行数量指数 ................................ ................................ ................................ ..........3 图表3： 理财子产品发行数量偏离度 ................................ ................................ ................................ ......3 图表4： 理财子产品发行风险指数 ................................ ................................ ................................ ..........3 图表5： 理财子产品发行基准利率波动指数 ................................ ................................ ............................3 图表6： 理财子不同类型产品发行基准利率走势 .............. 合材料（高增引擎）：固液连铸连轧工艺，界面原子级结合不可剥离，主要用于电芯顶盖极柱及连接母排；公司2025Q4 量产，目前月销约 1000 万元，预计3年内基本完成替代，预计2030年动力+储能市场空间超 200亿元。 4️⃣ #AIDC母排业务（重点布局）：收购正勤电子后实现“从发电厂到芯片”母排产品全覆盖，由柜外电力母排延伸至柜内、芯片级，产品包含电力浇筑母排、电力密集型母排、轨道母排、机架母排、柔性及叠层母排。 核心驱动：随着机柜功率密度升级+高压直流架构落地，母排需求量与技术壁垒同步提升；按照单座 20MW AIDC 对应母排营收约 1650-1800 万元，按年均新增 20GW 测算市场空间约200亿元。 ⭐️振勤电子：安费诺母排核心供应商（间接供货英伟达），2026 年营收约 4 亿元，对赌净利润 1800 万元；公司后续将推进墨西哥工厂布局，主攻海外高盈利市场，同步争取泰科、字节等订单，2027 年目标营收 6-7 亿元，未来三年复合增速 ≥40%。 🚀盈利预测：2026H1公司营收约7.7亿元（同比+68%），归母净利润 1亿元（同比+22%）；研究员预计26/27年PE 32/20X。 ——————#文字观点", "publish_time": "2026-09-18 11:09", "tags": ["文字观点"]}, "post:2026-09-18T08-37:e8ad5752af64": {"id": "post:2026-09-18T08-37:e8ad5752af64", "kind": "post", "title": "2026-09-18 08:37", "source_label": "帖子正文", "excerpt": "汇丰——中国电动汽车追踪：政策转向或将加速行业整合 中国8月乘用车零售销量同比下降24%，但环比改善5%至154万辆，整体仍处于低位。其中，电动汽车零售表现相对更具韧性，达100万辆，同比降幅为10%。", "content": "汇丰——中国电动汽车追踪：政策转向或将加速行业整合 中国8月乘用车零售销量同比下降24%，但环比改善5%至154万辆，整体仍处于低位。其中，电动汽车零售表现相对更具韧性，达100万辆，同比降幅为10%。供给端方面，8月批发量跃升至235万辆，较零售高出约80万辆（而1-7月批发普遍低于零售），表明行业正在为销售旺季主动补库。9月初数据受去年高基数影响依然疲软，但随着成都车展前后发布的新车型开始放量，我们预计需求将从9月下旬起逐步改善。 政策导向：从规模扩张转向高质量发展 9月11日发布的汽车行业“十五五”规划将政策重心从“量”的扩张转向“质”的提升，明确到2030年乘用车电动化渗透率达70%，并引入产能监测机制以推动行业整合、淘汰低效产能。关键优先事项包括：突破车规级芯片、操作系统及固态电池技术，扩大高阶自动驾驶应用规模，并支持整车企业海外本地化生产。我们认为，更严格的产能监管将加速行业洗牌，有利于产品线丰富、技术领先且具备全球布局的头部车企。 特斯拉Cybercab：下一代汽车平台的潜在范式 9月3日，特斯拉Cybercab在奥斯汀部分地区启动付费试运营。该车型为无方向盘、无制动踏板的L4级专用Robotaxi，采用全线控底盘及纯视觉FSD方案，目标车队价格低于3万美元，运营成本约0.2美元/公里，低于行业均值。其核心启示在于验证了“原生自动驾驶平台”的可行性——硬件及电子电气架构围绕自动驾驶软件正向开发，而非对现有AD系统的改装。这很可能使全线控成为下一代车辆的核心要求，将竞争焦点转向软件能力与全生命周期效率，并为整车企业的平台战略及出行服务布局提供长期参考。 选股策略：偏好盈利能见度更高的技术领军者 我们维持以下公司的买入评级： • 蔚来（NIO）：强劲的高端车型需求有望支撑盈利能见度持续改善。 • 比亚迪（BYD）：技术升级、新车型投放及海外扩张仍是下半年核心驱动力；第二代刀片电池产能爬坡将推动月度销量增长。 • 吉利（Geely）：产品结构优化及海外业务拓展应可支撑盈利韧性。 • 宁德时代（CATL）：凭借规模优势、多元化终端市场及行业领先的研发能力，仍为我们板块首选，维持买入评级。 关键数据速览（截至2026年9月14日收盘） • 比亚迪A股（002594 CH）收盘价85.43元人民币，目标价121.00元，潜在上行空间42%；比亚迪H股（1211 HK）收盘价80.20港元，目标价141.00港元，上行空间76%。 • 吉利（175 HK）收盘价16.59港元，目标价32.00港元，上行空间93%。 • 蔚来（NIO US）收盘价3.67美元，目标价6.40美元，上行空间74%。 • 宁德时代A股（300750 CH）收盘价3 \n\u003cul>\n\u003cli>\u003cstrong>主线：半导体/先进封装/国产算力。\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：国产链加速推进，昇腾迭代超预期，HBM限制逐步解决，国产供应链能力持续改善；长鑫、长存扩产预期强化设备与材料需求。\u003c/li>\n\u003cli>今天出现的催化/验证：昇腾960DT 2027Q1发布、提前三个季度，960PR 2027Q3发布、提前一个季度；长鑫一年扩产12万片DRAM+5万片HBM，长存12万片NAND，大陆5万片CoWoS+3万片PLP，超扫总设备需求超500台、价值量40亿+；长鑫科技首次覆盖报告提出十年破局DRAM垄断，算力+国产替代双轮驱动成长，产品可适配昇腾、寒武纪等国产主流AI芯片，支撑国产智算服务器算力部署，实现“国产GPU+国产高带宽内存”全链路自主可控。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：液冷/电源/AIDC发电。\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AIDC缺电属于结构性约束，主电源继续碎片化，发电业务升级为增长引擎；液冷受全球算力扩张驱动，海外认证与业绩兑现受关注。\u003c/li>\n\u003cli>今天出现的催化/验证：Generac为亚马逊数据中心供应备用发电机组，首批交付预计2027/2028，总额24亿美元，推测对应2MW柴发3000台以上；Generac向亚马逊发行认股权证，后者可按200.93美元/股收购最多169万股，合计3.4亿美元；潍柴是Generac柴发机头供应商，占整体附加值60%以上；Rubin服务器开始使用800V电源架构，功率器件可能明年最紧缺；卡特彼勒2026H1发电收入59.2亿美元（+34.3%），26Q2总在手订单同比+92.3%；申菱环境北美大客户Giga总共有60亿订单，公司首次承认北美大单，维持750亿目标市值；海鸥股份冷却塔订单排至30年，正进入北美。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：机器人/自动化。\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：特斯拉Optimus量产前审厂开启，产能扩建是此轮核心，产业链共同验证交付景气。\u003c/li>\n\u003cli>今天出现的催化/验证：特斯拉相关团队9月16日落地宁波，9月17日开启机器人业务量产审厂，已向供应链企业下达相关订单；首批1.5w台量级将打满现有供应商产能，按1.5w台一个季度交付拆算，10-11月周产量将突破2k+；有T供应商反馈已下单2万台；斯菱智驱5k订单只是起步，国内+泰国基地同步扩产，泰国基地10月陆续爬坡投入生产；附件线索包括“机器人技术临界点：实地调研”。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：光通信/CPO与PCB/CCL。\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：光模块升级带动模拟芯片用量成倍提升，800G→1.6T呈现高通胀属性；CPO短期不冲击高端覆铜板，高端CCL供求偏紧。\u003c/li>\n\u003cli>今天出现的催化/验证：思瑞浦截止26Q2连续9个季度收入环比增长，工业、通信、汽车三大板块全面爆发，在手订单充足，Q3环比增长势头有望持续；26H1光通信相关收入1.8亿元（占比11%），预计下半年收入及占比持续提高；与光模块头部客户合作定制1.6T、3.2T、NPO、CPO相关模拟芯片，产品升级模拟芯片用量有望成倍提升；800G→1.6T头部厂商DCA报价提升4-5倍，全球800G以上光模块仪器需求26-28年达460亿元以上；CPO在2026-2028年难以全面替代高频高速覆铜板，高端CCL供求偏紧，情绪杀跌是优质标的配置契机；2027年最缺材料四代铜HVLP4，CCL处于M8-M9-M10升级，M9有“M9+Q布+四代铜”和“M9+二代布+四代铜+高比例碳氢树脂”两条路线；宏昌电子有3个主业，CCL介于金A和华Z之间，环氧树脂暂可忽略；1.6T光模块PCB用ABF膜的CCL（无布、有铜箔）、压合成的PCB，core层来自宏仁CCL（M7/M8级别），树脂来自宏昌，PCB对接包括迅捷兴等。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：宏观/策略与汽车。\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：美股继续消化美联储自2023年以来首次加息影响，偏防御性加息，不能简单得出加息后经济要崩；宏观因素落地后，三大流动性拐点逐渐明朗。\u003c/li>\n\u003cli>今天出现的催化/验证：30年期美债收益率一度创2007年以来新高，“利率上、美元下”背离反复出现；标普500上涨114个基点收7637点，纳斯达克100上涨173个基点报29446点，收盘委托买入金额43亿美元；标普500突破短期CTA策略阈值7633点，预计短期修正并逐步消耗部分系统性卖盘；中国8月乘用车零售销量同比下降24%，环比改善5%至154万辆，电动汽车零售100万辆，同比降幅10%；房地产新房销售延续筑底，二手房交易首次纳入统计；TACO or GAMBLE指数今日+1.24，较昨日小幅回落，整体压力很大；市场成交额有所修复，但行情再度缺乏明确方向，成长、价值板块均出现个股上涨，尚未形成一致共识。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>今日采集统计：AI算力/大模型正文84条、半导体/先进封装71条、宏观/策略23条、光通信/CPO 19条、液冷/电源19条、新能源/汽车17条、PCB/CCL/铜箔14条、机器人/自动化11条。\u003c/li>\n\u003cli>模型使用：DeepSeek 9月至今Token用量份额45.7%，8月为30.1%；Anthropic 13.6%第二，OpenAI 12%。\u003c/li>\n\u003cli>算力/收入：OpenAI与Anthropic需2027年实现3000亿美元收入，约为2026年收入3倍；2027年12吉瓦算力获取存疑，12吉瓦年度租金总支出等于150亿美元×12吉瓦。\u003c/li>\n\u003cli>数据中心合作：Anthropic与OpenAI寻求小型AI数据中心交易。\u003c/li>\n\u003cli>迈富时：5亿港币定增募资已用完；公告显示仅使用1.28亿港元，实际已锁定GPU、服务器、组网硬件采购订单超5亿港币，均为期货未付款。\u003c/li>\n\u003cli>华为昇腾：960DT 2027Q1发布，比原计划提前三个季度；960PR 2027Q3发布，比原计划提前一个季度；HBM限制问题逐步解决，国产供应链能力持续改善。\u003c/li>\n\u003cli>长鑫/长存扩产与设备：按28-29年市场预测，长鑫一年扩产12万片DRAM+5万片HBM，长存一年扩产12万片NAND，大陆一年扩产5万片CoWoS+3万片PLP；超扫总设备需求超500台，价值量40亿+。\u003c/li>\n\u003cli>长鑫科技首次覆盖：十年破局DRAM垄断，算力+国产替代双轮驱动成长；产品可适配昇腾、寒武纪等国产主流AI芯片，支撑国产智算服务器算力部署，实现“国产GPU+国产高带宽内存”全链路自主可控。\u003c/li>\n\u003cli>液冷/电源：Generac与亚马逊签署未来2年24亿美元备用发电机组订单，首批2027/2028；认股权证可按200.93美元/股收购最多169万股，合计3.4亿美元；潍柴是Generac柴发机头供应商，占整体附加值60%以上，该订单利润影响2~2.5亿美金；Rubin服务器开始使用800V电源架构，功率器件最紧缺可能明年。\u003c/li>\n\u003cli>服务器：传统服务器2Q26呈现量降价升的“价格驱动型”强劲增长，AI服务器出货量与均价两端更均衡扩张；戴尔在传统与AI服务器两个细分市场同比份额均显著提升，超微电脑传统服务器份额大增但AI服务器份额微降，慧与份额同比大体稳定；联想ISG 540亿意向订单均为1年内商机，新云客户单客户从数亿美金扩至数十亿美元。\u003c/li>\n\u003cli>机器人：特斯拉Optimus团队9月16日落地宁波，9月17日开启量产审厂，已下达相关订单；首批1.5w台量级打满现有供应商产能，10-11月周产量将突破2k+；有T供应商反馈已下单2万台。\u003c/li>\n\u003cli>光通信：思瑞浦26H1光通信相关收入1.8亿元（占比11%），与头部客户合作定制1.6T、3.2T、NPO、CPO相关模拟芯片；800G→1.6T头部厂商DCA报价提升4-5倍，全球800G以上光模块仪器需求26-28年达460亿元以上。\u003c/li>\n\u003cli>PCB/CCL：CPO在2026-2028年难全面替代高频高速覆铜板，高端CCL供求偏紧，情绪杀跌
