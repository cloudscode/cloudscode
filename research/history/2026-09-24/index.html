ent": "", "publish_time": "2026-09-24 09:44", "tags": ["文字观点"]}}, "source_details": {"post:2026-09-24T08-35:91cfd0a65e55": {"id": "post:2026-09-24T08-35:91cfd0a65e55", "kind": "post", "title": "2026-09-24 08:35", "source_label": "帖子正文", "excerpt": "伯恩斯坦——全球软件、中美互联网及美国通信基础设施云：季度综述——超大规模云厂商在2026年二季度表现几何？超大规模云市场已从传统云基础设施的“镐与铲”角色，进化为支撑传统云与生成式AI浪潮的双重底座，尽管其业务本质仍以CPU驱动为主。", "content": "伯恩斯坦——全球软件、中美互联网及美国通信基础设施云：季度综述——超大规模云厂商在2026年二季度表现几何？ 超大规模云市场已从传统云基础设施的“镐与铲”角色，进化为支撑传统云与生成式AI浪潮的双重底座，尽管其业务本质仍以CPU驱动为主。当前投资者核心关切聚焦于AI基础设施投资的资本开支（CAPEX）增速及其对利润率与回报的挤压效应。本季度最显著的结构性变化在于：此前被视为落后者的一方在AI云赛道脱颖而出——谷歌凭借其垂直整合的全栈方案，本季度新增云收入绝对值已逼近微软；而甲骨文则依托较小的基数实现了远超同侪的增速。 即便全行业CAPEX持续攀升，各云服务提供商（CSP）仍一致指向产能约束，瓶颈已从GPU可得性切换至已通电的物理数据中心容量。这催生了一系列新的市场命题：微软与亚马逊能否实现CAPEX的合理回报？产能上线的速度与成本是否已成为新的竞争基准？大模型之战是否将决定超大规模厂商的输赢？甲骨文AI产能建设的经济效益几何，其能否依赖OpenAI的承诺？英伟达与OpenAI究竟是谷歌的手下败将还是造王者？AI何时能实质性推高云IT预算？前沿模型研发放缓是否会拖累超大规模厂商的增长与利润率？伯恩斯坦本季《云市场季报》旨在为投资者厘清这些长期结构性问题，并解析厂商间业绩分化的根源。 各厂商投资逻辑与关键数据 微软（MSFT，跑赢大盘，目标价660美元）：微软在Azure上押下重注，自2019年起加码AI投资，构建AI数据中心并自研芯片。当前Azure与Copilot双双加速增长，AI已不再是收入拖累而是显著的增长贡献因子。即便在AI泡沫情境下，微软亦具备较强韧性——其自有应用生态驱动的内部算力消耗，叠加来自OpenAI及多元化大型企业客户的第三方合约，且合约期限与设备使用寿命高度匹配。软件行业整体放缓背景下，Azure增长稳健且有望进一步加速，支撑微软双位数收入增长及45%左右的GAAP利润率。Office 365 Copilot席位与GitHub使用量激增，预示AI将同时拉动GPU与CPU需求。关键区别在于，微软已放缓CAPEX增速至低于Azure收入增速，管理层指引FY27自由现金流（FCF）为正且无需额外融资，这与美国同业形成鲜明反差。 甲骨文（ORCL，跑赢大盘，目标价325美元）：甲骨文的故事已从“潜在的云厂商”跃升为“核心超大规模及AI训推提供商”。其剩余履约义务（RPO）高达6,640亿美元，OCI（云基础设施）收入指引为FY30达1,660亿美元，核心驱动力来自OpenAI约3,000亿美元的RPO及多项百亿级交易。尽管近期利润率与现金流承压，但未来数年将驱动显著的盈利与FCF增长。本季度甲骨文完成200亿美元股权融资，预计FY27末前可落实当前需求所需的大部分融资，OpenAI相关情绪持续改善，OCI执行力度强劲。 亚马逊（AMZN，跑赢大盘，目标价320美元）：本季度是AWS多头翘首以盼的拐点。AWS收入同比增长37%，较上季度的28%大幅加速，为18个季度以来最快增速，新增绝对值达46亿美元，领跑全行业。AI收入年化运行率从一季度的150亿美元跃升至250亿美元，自研芯片业务亦突破250亿美元。积压订单（Backlog）激增至4,960亿美元。管理层首次清晰阐述了AI投资的回报框架：当前投资主要集中于数据中心壳体建设，后续转向服务器，投资回收期为2-3年，而对应合约期限为5-6年，经济性极具吸引力。 谷歌（GOOGL，市场同步，目标价385美元）：在AI云竞争中，谷歌已从预AI时代的第三名蜕变为强劲竞争者。云收入同比增长82%，利润率扩张至36%左右，新增绝对值与AWS并驾齐驱。其优势在于业内唯一的真正垂直整合——自研前沿模型Gemini与定制TPU芯片（本季度TPU第三方销售开始货币化）。但隐忧犹存：Gemini 3.5 Pro面临延期，且因持续算力约束被迫依赖第三方容量，可能挤压利润率并引发算力分配难题（需平衡企业客户、开发者及搜索业务的需求）。长期基本面依然稳固，但短期需警惕产能瓶颈带来的扰动。 阿里巴巴（BABA，跑赢大盘，目标价165美元/161港元）：阿里云6月季度收入同比增长44.9%，调整后EBITA利润率环比提升250个基点至11.6%。AI相关产品连续第十二个季度实现三位数增长，占外部云收入的35%。管理层预计外部云收入增速将在未来几个季度突破50%，MaaS收入年化运行率有望在FY3/27第四季度超过300亿元人民币。中国算力市场持续紧张，为阿里云提供了加速增长的有利环境。 CoreWeave（CRWV，跑输大盘，目标价74美元）：作为GPU优先的新兴云厂商，CRWV受益于数据中心市场的供应约束，但一旦产能缓解，该公司将首当其冲受到冲击。基于25.5倍EV/EBIT估值，我们认为其当前估值已过度透支。本季度收入25.8亿美元（同比+112%），积压订单约1,040亿美元，但资本开支高达94亿美元，近期的报告利润与资本部署之间存在显著错配，客户集中度与交付时间表是核心风险点。 行业趋势与利润率观察 • CAPEX与收入增速的赛跑：云收入增长近期虽已加速，但仍需持续提速才能匹配CAPEX的扩张步伐。 • 产能约束性质转变：瓶颈从GPU供应转向物理数据中心与电力容量，各厂商正通过租赁、第三方产能及缩短资产寿命来应对。 • 利润率压力与传导机制：AI在建设阶段将拖累IaaS/PaaS毛利率，但甲骨文等厂商通过合约条款将组件涨价风险转嫁给客户，锁定利润绝对值。微软则强调AI长期利润率将与常规业务趋同。 • GPU经济寿命争议：AI工作负载加速服务器损耗，亚马逊已将部分服务器寿命从6年降至5年，而微软则将网络设备寿命延长至6年，各厂商会计假设的分化值得关注。 • 新 monetization 向量：谷歌TPU第三方销售、甲骨文多云数据库（由AWS/Azure/GCP承担电力与地产成本，甲骨文获取SaaS级高毛利）正开辟增量收入来源。 结论：超大规模云市场正处于AI驱动的结构性扩张初期，谷歌与甲骨文成为本季度最大变量，而微软凭借纪律性的CAPEX与FCF管理脱颖而出。投资者应重点关注各厂商的产能交付节奏、合约期限结构及组件成本传导能力，以甄别长期赢家。#文字观点", "publish_time": "2026-09-24 08:35", "tags": ["文字观点"]}, "post:2026-09-24T08-42:0a7a7d5316ff": {"id": "post:2026-09-24T08-42:0a7a7d5316ff", "kind": "post", "title": "2026-09-24 08:42", "source_label": "帖子正文", "excerpt": "阿里巴巴云栖大会点评：智以致用，力以致远战略层：全栈 AI 迭代战略进一步强化，20GW 锚定中长期增长中枢。模型、芯片与云相互耦合、联合优化，公司首次给出明确长期产能目标：到2032年阿里云运营的全球数据中心规模超过20GW。", "content": "阿里巴巴云栖大会点评：智以致用，力以致远战略层：全栈 AI 迭代战略进一步强化，20GW 锚定中长期增长中枢。模型、芯片与云相互耦合、联合优化，公司首次给出明确长期产能目标：到2032年阿里云运营的全球数据中心规模超过20GW。我们测算20GW对应2032年约1,700亿美元外部云收入，与公司2030年1,000亿美元外部收入目标及中长期约40%复合增速相互耦合，增长中枢确定性进一步加强。AI 模型：全场景全尺寸迭代，RSI 有望加速驱动。Qwen3.8-Max在人类零参与下完成33轮有效迭代，Artificial Analysis智能指数由40升至45、位列国内第一；自主完成平头哥新款GPU推理框架适配，单实例吞吐提升96%。新架构Qwen3.8-Flash-Next训练成本降至1/9，新一代视频生成模型将于11月发布，公司计划训练5-10T参数规模的全新模型。AI 芯片：真武 V900 性能三倍跃升，路线图与出货节奏同步提速。V900算力为M890的3倍，配备216GB显存，计划2027Q1量产售卖，配套磐久超节点单一集群可扩展至50万卡。截至2026年6月真武系列累计服务超650家企业客户，阿里云已规模化上架AI超节点，关注平头哥外售节奏及潜在拆分上市催化。AI 云：Agent Native Cloud 重构，增长确定性与利润率改善并行。公司围绕Agent负载推出AgentCore、Agentic OS等平台，Tair KVCM每token成本下降50%。利润率改善关注AI业务量价齐升、MaaS占比提升及自研芯片导入带来的成本优势，阿里云为国内规模最大的公有云及AI云。应用：B 端与 C 端持续发力。Qoder上线一年服务全球超800万开发者，千问办公依托钉钉（月活超2亿）推出数字员工，效率提升60%；C端Qwen Intelligence由荣耀Magic9系列首批搭载，叠加国行Apple智能确认千问为基座能力提供方，应用侧变现空间有望进一步打开。核心观点：全栈AI能力同步进化且深度耦合，20GW目标彰显投入决心，看好中长期约40%外部云收入复合增速与云业务商业化兑现，维持港股、美股\"买入\"评级。#文字观点", "publish_time": "2026-09-24 08:42", "tags": ["文字观点"]}, "post:2026-09-24T23-23:c15db67e846b": {"id": "post:2026-09-24T23-23:c15db67e846b", "kind": "post", "title": "2026-09-24 23:23", "source_label": "帖子正文", "excerpt": "华福姚婧团队-云栖大会展会&专家反馈#云栖演讲-阿里进展与目标1、AI模型：Qwen团队在递归式自我改进RSI方面取得进展，未来模型将扩展至5-10T参数规模。2、AI芯片：平头哥发布最强国产AI芯片真武V900，算力提升至真武M890的3倍。", "content": "华福姚婧团队-云栖大会展会&专家反馈#云栖演讲-阿里进展与目标1、AI模型：Qwen团队在递归式自我改进RSI方面取得进展，未来模型将扩展至5-10T参数规模。 2、AI芯片：平头哥发布最强国产AI芯片真武V900，算力提升至真武M890的3倍。单一集群可扩展至50万卡。平头哥AI芯片的年出货量预计将大幅提升。 3、AI云：目标是到2032年阿里云运营的全球数据中心规模超过20GW。#CUBE5.0全模块化数据中心方案把传统数据中心现场工程施工，转变为工厂预制模块产品，包含#五大硬件模块中压模块、直流不间断电源模块、锂电模块、IT模块（承载磐久超节点服务器）、冷源模块；#管线&监控预制化预制化管网、预制化母线、监控。#全模块化设计让数据中心100天高效落地、单位千瓦的相关建设成本较上一代降低10%#AL云专家1、云技术栈升级战略：阿里云将在2026年云栖大会重点发布Agentic Cloud，从传统AI云技术栈升级为面向Agent落地的全栈架构，核心竞争逻辑从单一模型参数、API价格竞争，转向Agent全栈能力竞争，目标是与二线云厂商拉开技术差距。#中长期目标是将AI服务渗透到现有500万云客户群体中。 2、平头哥自研芯片：2027年M890和V900合计出货目标80万颗，上半年以M890为主，下半年切换为V900为主。 3、超节点：2026年出货1500柜，#2027年出货目标约4000柜（芯片总出货目标80万颗，其中40万颗用于组装超节点）。单柜总成本约2900-3000万元，其中GPU（含HBM）占比约46%。 4、算力开支：#每年算力相关资本开支约三四千亿元，窄口径（仅数据中心建设）占比约70%；海外业务占中长期规划的40-45%，采用自建+租赁结合的方式布局。 5、大模型进展：千问4预计于2026年10月下旬-11月上旬发布预览版，参数量4-5万亿，预览版与正式版间隔1-1.5个月。后续大版本保持半年更新一次。 详细可联系姚婧团队：姚婧/李天阳18221287247#文字观点", "publish_time": "2026-09-24 23:23", "tags": ["云栖演讲-阿里进展与目标", "CUBE5", "0全模块化数据中心方案", "五大硬件模块", "管线&监控预制化", "AL云专家", "2027年出货目标约4000柜", "文字观点"]}, "attachment:files/电子布调研.docx": {"id": "attachment:files/电子布调研.docx", "kind": "attachment", "title": "电子布调研", "source_label": "其他", "excerpt": "电子布的一个调研 请详细介绍英伟达 Blackwell、Rubin 及 Rubin ULTRA 系列服务器中，不同组件对高端电子布的具体选型方案？在英伟达 Blackwell 系列中，Computer Tray 和 Switch Tray 采用了 M8 等级的材料，对应第二代 LowDK 电子布", "content": "电子布的一个调研 请详细介绍英伟达 Blackwell、Rubin 及 Rubin ULTRA 系列服务器中，不同组件对高端电子布的具体选型方案？ 在英伟达 Blackwell 系列中，Computer Tray 和 Switch Tray 采用了 M8 等级的材料，对应第二代 LowDK 电子布；其余部件则主要使用 M6 等级的材料，对应第一代 LowDK 电子布。对于 Rubin 系列，其 Computer Tray、Switch Tray 和中板均将采用 M8 等级的第二代 LowDK 材料，而 OAM 板则选用 M7 等级的材料，同样对应第二代 LowDK。至于 Rubin ULTRA 系列，其方案尚未最终确定，目前正交背板倾向于采用 M9 等级的混压方案，而 CPX 板等其他部件仍在 M8 和 M9 等级之间进行选型测试。 目前市场上不同等级的高端电子布，如第一代 LowDK、第二代 LowDK、梯布和 Q 布，其价格体系是怎样的？ 当前市场价格显示，第一代 LowDK 电子布的价格区间为每米 35 至 40 元。第二代 LowDK 的价格显著提升，达到每米 150 至 170 元。梯布的价格与第二代 LowDK 相近，甚至略高一些。Q 布作为最高端的产品，其价格在每米 250 至 300 元之间。值得注意的是，日本厂商通过化学合成法生产的 Q 布，因其纯度更高，售价可达每米 300 元以上，显著高于国内同类产品。 在为高速电路板选择电子布材料时，遵循怎样的优先级原则？行业内对 M9 和 PTFE 等特殊材料有何特定定义？ 选型的核心原则是优先采用能够满足性能要求的最低成本方案。只有当第二代 LowDK 材料无法达到极致性能要求时，才会考虑选用成本更高的 Q 布方案。在行业定义中，M9 通常默认指代 Q 布与碳纤维结合的方案。而 PTFE 材料，尽管其 DK 和 DF 值更低，但由于其 CTE性能较差，因此不被归入标准的 M 系列材料定义范畴。 Q 布在生产环节面临哪些核心挑战？ Q 布生产端的核心痛点主要体现在两方面。首先，全产业链的良率偏低，尤其是在 PCB 加工环节，良率不足 50%，导致加工损耗极高。其次，生产效率受限，由于石英材质脆且硬，织布机的转速必须大幅降低，导致单台丰田织机的月产量仅为 5,000 至 6,000 米，远低于普通电子布约 20,000 米的水平。 在导入节奏方面，目前 Q 布仍处于小批量供货阶段。从用量来看，确定性较高的需求主要来自 Rubin Ultra的正交背板，其层数高达 78 层。未来的潜在增量场景包括 1.6T 交换机以及下一代Feynman架构的计算板与交换板，这些后续大概率会采用 Q 布。 Q 布产业链的供需格局如何？核心供应商有哪些，以及未来的议价能力和利润趋势将如何演变？ 在供应商布局方面，国内厂商菲利华是布局最早的企业之一。海外厂商中，日本信越采用化学合成法生产，月产能约为 10 万米，但扩产节奏较为缓慢；旭化成则通过外购德宏的石英纱进行织布，其产能受到上游纱端供应的限制。 关于议价权与利润趋势，短期内，由于石英纱环节的扩产周期更长，是产业链的核心瓶颈，因此纱厂的议价权相对更强。随着后续产能逐步释放，议价权将回归均衡。未来，随着更多厂商进入 Q 布领域，织布环节的超额利润预计将率先被压缩，同时良率的提升也会进一步拉低行业整体成本。 对于供需预判，目前已有多家原从事军工、光伏石英的厂商切入石英纱赛道。预计到 2028 年，石英纱和 Q 布的产能均能匹配市场需求，行业供需将实现均衡，价格也将保持稳定。 目前第二代 LowDK 电子布的供需状况如何？行业内主要厂商的产能规划是怎样的？ 当前，第二代 LowDK 是整个行业中供需缺口最大的品类。预计缺口峰值将出现在明年（2027年）第一季度，到明年下半年供需状况将出现边际缓解。 从具体产能规划来看，参会企业目前的月产量为 30 至 40 万米，计划在今年（2026年）底达到月产 60 万米，明年（2027年）上半年进一步提升至月产 100 万米，并最终在 2028 年达到月产 250 万米的目标。行业其他主要厂商，如国际复材、泰山玻纤、光远等，也规划在 2028 年落地第二代 LowDK 产能，规模在 200 至 500 万米区间。新进入者的产能通常需要约一年的时间获得客户认证。 以下为专家观点： 当前用于AI领域的高速材料月出货量水平如何？其中M8、M8+、M8U及M9等不同等级产品的出货结构是怎样的？ 目前用于AI领域的高速材料月出货量约为40万张。其中，M8和M8+合计占比约80%；M9的出货占比在5%至10%之间，已进入量产阶段，主要应用于LPU版本的产品；M8U也已开始出货。剩余约10%至15%的出货量为M7和M6等级的材料，主要供给国内客户，国外客户已不再使用。 从下游客户结构来看，目前高速材料的主要出货对象？ 目前出货主要集中于两家客户。其中，胜宏是最大的客户；其次是景旺。其他客户如方正、沪电等占比较少。 当前M8、M8U和M9这几款主要高速材料的价格分别是多少？与2026年第二季度相比是否有变化？ 目前M8的价格在900元左右，M8U在1,300元左右，M9的价格区间为2000元至2,500元。这些价格与2026年第二季度相比没有变化。 预计从2026年9月至12月，高速材料的出货量将呈现何种趋势？未来出货量达到每月60万张的目标预计在何时实现？ 预计从2026年9月至12月，整体出货量将保持增长，其中M8U和M9的月度增长率预计为20%至30%。与此同时，用于GB产品的M8出货量将会下降，而主要供给国内的M7材料出货量将保持稳定。预计在2026年年底，高速材料的月出货量有望达到60多万张的水平，届时M8U将占出货总量的80%至90%。 目前的生产产能是否能满足高速材料增长的需求？ 产能是充足的。高速材料与普通板材共用产能，可以根据需求随时进行切换。 目前除PTFE外，其他PCB板材的整体产能在什么水平？ 目前，除PTFE的产能是独立且无法转换外，其他板材的产能可以相互转换。不包含PP在内，这些板材的总产能大约为1,000多万张。 M8和M9系列中PP产品的价格大概是多少？ PP产品的价格通常是对应板材价格的一半左右。以M8为例，其PP产品的价格大约在500元。M9系列产品的定价逻辑与此类似。 M9系列目前的出货构成是怎样的？其中Q布产品在LPU类别中的占比情况如何？ M9系列目前出货的产品包括LowDK二代和Q布，这两者应用的板子存在差异。在LPU类别中，Q布产品的出货量占比约为40%。 关于下一代产品中PTFE材料的应用，其验证进展、技术方案以及供应链准备情况如何？ 目前PTFE的验证效果较以往有明显改善，主要应用在Rubin Ultra平台的两种机柜方案中。 第一种是全新的Kyber机柜，它采用正交背板替代了传统的铜缆背板来连接Switch和Compute Tray。该正交背板最初尝试使用78层的PTFE材料，但由于层数过高，后调整为将三块26层的板进行叠压（即两次压合）的方案，以解决高孔径比及板厚带来的加工与良率问题。该方案自2024年开始尝试，虽然性能满足要求，但良率始终是主要障碍。作为替代方案，M9 Q布因存在约20%的电性能（插入损耗）差距而无法满足要求。自2025年起，业界开始尝试M10方案，但仍有约10%的性能差距。目前最前沿的方案是采用M10的PP与PTFE的芯板进行混压，良率可达到40%至50%，但并非所有PCB供应商都能实现，导致供应商数量不足，项目可能因此延期或仅进行小批量试用。 第二种是基于原有Oberon架构的NVL576 Oberon方案，该方案通过CPU光互联连接八个NVL72单元。尽管这些单元分布在不同机柜，但柜间连接速率需达到337Gbps的柜内Scale-up级别。为实现此目标，交换板数量从9个升级至18个，并提升了其速率。该方案的交换板正在尝试使用PTFE的芯板与M9 Q布的PP进行混压。为提升良率并降低加工难度，PCB设计从原先的32层高多层板改为两块16层的板叠加。目前测试显示，该方案链路已跑通，PCB具备量产性，良率可达60%。 鉴于单一PCB或CCL供应商无法满足下游客户需求，供应链正在积极布局。此前较少涉足PTFE CCL的台光、台燿、联茂等厂商已在送样PTFE基材。同时，鹏鼎、金像电子等PCB厂商也在招聘PTFE PCB加工专家，胜宏、景旺等公司亦在投入资源进行相关开发，以确保在PTFE实现量产时具备相应能力。最终方案的选择将由英伟达根据PTFE CCL和PCB的供应量、供应商数量及价格等因素综合决定，但其应用概率相对较大。 在NVL576 Oberon方案中，交换板最终采用的层数结构是什么？ 该方案曾考虑过多种层数结构，包括18x18和22x22的方案。经过综合评估性价比和良率，最终认为16x16的方案是最佳选择。 交换板（switch board）是否确定会升级到18个NVLink？ 目前的试验方案显示将升级到18个NVLink，且该方案效果相对较好。但这仍是试验阶段的方案，与最终方案可能存在差异，最终决策将由终端客户确定。 关于交换板的材料构成，具体是怎样的？例如，在一块由两个16层板组成的32层板中，PTFE材料和碳氢PP材料各有多少层？ 在总共32层的结构中，包含14层PTFE材料和16层M9级别的碳氢PP材料。该方案使用PTFE。 该交换板方案预计何时能够最终确定？ 预计在明年（2027年）年初左右。 关于采用PTFE材料的新方案，其成本结构与M9材料方案相比有何差异？ 新方案的成本主要在主材方面低于M9方案。具体差异体现在：树脂成本：M9方案使用的树脂价格昂贵，每公斤价格在2000元以上，甚至可达5,000元；而PTFE树脂价格相对便宜，每公斤约一两百元。在每平方米板材添加0.1至0.2公斤树脂的情况下，树脂成本差异显著。增强材料成本：M9方案使用的石英布成本高昂，每米价格约300元，一张板材的石英布成本即达300元，若使用两张则为600元。而PTFE方案不使用玻璃布，此项成本为零。硅粉成本：两方案的硅粉成本相近。PTFE方案因用硅粉替代了玻璃布，其硅粉添加量更高，成本会略高一些，但总体差异不大。加工费用：PTFE方案的加工费约为M8或M9方案的两倍，预计会增加一两百元，但与材料成本的巨大差异相比，整体成本优势依然明显。 采用PTFE材料的新方案，其单价预计是多少？ 价格尚未最终确定，取决于市场供需状况。初期，如果供应商数量有限，形成供不应求的局面，其定价可能会基于其优于M9的性能，价格可能比M9更高，达到每平方米两三千元。后期随着应用普及和更多厂商进入，可能会转向成本定价，届时价格预计将低于每平方米2000元。一手资料＋扣935139387 目前PTFE产品主要送至哪些板厂进行测试？公司的参与情况如何？ 目前主要在深南电路和沪电股份进行较多测试。公司也有参与，但并非主流测试厂商，其在英伟达供应商体系内的排序并不靠前。 公司进入英伟达供应商体系是否存在困难？ 进入该体系需要一定的时间周期。此外，公司目前的产能也是一个限制因素。 按照一块由14层PTFE和16层碳氢PP组成的板材计算，其价值量如何？ 一平方米板材的价值量大约为5万元。考虑到交换板材的裁切规格为一开六，即每张板约0.2平方米，单张交换板的价值量大约在8,000元左右。 为何此次升级主要针对交换板（switch board），而不是计算板（compute board）？ 此次升级的核心目的是提升多机柜之间的传输速率，以实现从72个GPU扩展到144个乃至576个GPU的“scale up”级别性能。在多机柜系统中，数据传输瓶颈主要在于柜间连接。为了让八个机柜像一个整体一样高速通信，需要通过CPO光模块和光纤进行连接。当高速、大容量的光纤信号进入机柜后，交换板需要具备瞬时处理八个机柜同时传来信号的能力，因此必须对交换板进行升级以匹配极高的交换速率。而计算板主要承载其板上四个GPU的算力，其交互功能主要依赖交换板，因此升级的重点是交换板。 在八个机柜的连接方案中，CPO板是否也采用了PTFE材料？ 是的，CPO板也在尝试使用PTFE材料。该板的层数更高，约40多层，制造难度也更大。在NVL72的八机柜系统中，每个机柜顶部都会安装一个CPO，这八个CPO之间通过NVLink协议进行通信，并与柜内的交换板协同工作。 Kyber架构的正交背板产品与英伟达的其他产品是否会同步推出？其市场定位如何？ 这取决于终端客户的决策。一种可能的方案是明年（2027年）同步推出。由于产能和技术原因，Kyber架构可能会作为高端应用场景来发布，特别适用于对空间有严格要求的场景，因为它具备很高的空间计算密度，其体积比NVL576小几十倍。相较之下，NVL576虽然也能达到相当高的集成度，但占用空间更大，可能作为对空间没有特殊要求、但需要升级算力的常规方案。届时，NVL72这类产品的出货量可能会大幅减少。市场的主流可能会转向NVL576和Kyber架构的NVL144，这与以往新机柜推出后旧机柜需求减少的趋势相似。 在Kyber架构的26层板中，PTFE和M10材料是如何混合层压的，各自占据多少层？ 在26层的结构中，大约包含12层的PTFE和13层的M10碳氢PP。其中，M10材料可以选用带Q布或不带Q布的方案。 采用M10 Q布碳氢PP方案后，材料成本如何构成？与之前提到的PTFE材料相比有何变化？ 采用M10方案主要是对树脂进行了升级，而PTFE的价格与之前讨论的一致。M10 Q布版本所用的树脂价格更为昂贵，大约在每公斤5,000至10,000元人民币，部分高端树脂价格甚至可能达到每公斤20,000元。此外，所用的Q布可能会升级到第二代，价格也更高，从每米约300元上涨至500到600元。需要注意的是，这些新材料目前尚无法实现量产。 综合考虑材料成本、良率和开料利用率，如何测算一块26层正交背板的最终材料采购成本？ 首先计算单板的材料成本，例如一块板包含12层PTFE和13层PP，根据各自的单价进行加总。其次，要考虑PCB板的尺寸，例如“一开四”的板子面积约为0.25至0.3平方米。最终的CCL采购量需要基于这个面积进行推算，并计入两个关键损耗因素：第一是PCB制造良率，正交背板的良率可能只有40%，而交换板（switch board）的良率约为60%，上一代GB300的交换板良率则在80%左右；第二是开料利用率，即边角料的损耗，通常在80%左右。因此，总的CCL采购成本可以通过将初始材料成本先除以良率，再除以开料利用率（如0.8）来计算。CCL本身的价格已经考虑了其制造过程中的良率，其良率通常较高，一般在80%至90%，较差的也有50%。 目前第三代和第四代高端铜箔的加工费水平及价格趋势如何？ 目前，第三代铜箔的加工费大约在每吨15万至20万元人民币之间，第四代铜箔稍贵，加工费在每吨20万至25万元之间。高端铜箔市场目前处于供不应求的紧张状态，价格存在上涨趋势。今年年初已经有过一次调价，涨幅大约在10%至30%之间，调价策略因厂商而异：国外和台湾企业可能每半年调价一次，幅度较大，约30%；而国内企业则可能每一到三个月调价一次，幅度较小，约10%。预计到今年年底，随着Rubin持续上量导致铜箔用量增加，可能会迎来新一轮涨价，尤其是海外厂商。 电子布的价格预计何时会出现拐点？具体来说，价格是会持续上涨至2027年中然后开始下滑，还是会持平一段时间？ 预计电子布的价格拐点会出现在2027年中。届时，价格可能会持平甚至开始下行。价格走势主要取决于供需关系，如果供给大于需求，价格会快速下降；如果供需平衡，则可能持平一段时间。预计到2027年中期，行业内将有较多新产能开出，因此价格下降的概率较大。 从现在到2026年底，覆铜板的价格走势将如何演变？如果需求不及预期，价格是否会下降？ 预计到2026年底，覆铜板价格仍将继续上涨，可能还会有一次左右的涨价，大幅下降的可能性不大。即使需求不及预期，价格也更可能在高位震荡。这主要基于两个原因：首先，年底是消费电子的传统旺季，有圣诞节、国庆节和新年等节假日拉动消费，需求不会太差；其次，到年底时，多数CCL厂商已基本完成年度业绩目标，缺乏通过大幅降价来抢占市场的动力。此外，AI领域的需求仍在增长，而消费电子领域虽然因存储颗粒和芯片涨价导致手机、电脑等产品价格上升，抑制了部分需求，但刚性需求的基础依然存在。 考虑到PCB厂商也在向下游传导成本压力，未来单张覆铜板的盈利水平是会保持稳定，还是有机会进一步扩大？ 当前，许多中小型PCB厂商已经倒闭，订单集中于中大型厂商，导致PCB领域也处于供不应求的状态，PCB厂商因此大幅向上游涨价。然而，这种涨价已开始抑制终端消费需求，购买电子产品的消费者数量减少，从而导致PCB的需求量下降。最终，市场可能会达到一个新的供需平衡点，因此单张覆铜板的盈利水平预计将大致保持稳定或持平。 目前PTFE、M8、M8U以及M10等高阶材料未来量产后毛利率的走势会怎样？ 最终的毛利率水平将取决于市场竞争格局，如果竞争厂商增多，毛利率可能会降低；反之，则会保持在较高水平。 预计到2027年，国内供应商在HVLP3和HVLP4铜箔供应中的份额能达到多少？ 到2027年，HVLP3的增量将非常有限。对于HVLP4，其增量需求将主要由国内供应商来满足。如果国内供应商的量产进展顺利，其供应量预计能占到整体增量的30%至40%。 高端铜箔的加工费未来是否会因国内厂商扩产而下降？主要的产能瓶颈是什么？ 普通铜箔的价格并未出现显著上涨。对于高端铜箔，其核心瓶颈在于三井的表面处理设备数量有限。即使铜箔厂商扩充了产能，如果没有足够的三井表面处理设备，也无法形成有效产出，这将限制实际的扩产进度。虽然像德福这样的公司在尝试自研表面处理设备，但目前自产设备的良率较低，成本较高，尚无法大规模生产。相较之下，三井设备的质量更稳定，良率也更高。 PTFE板材在2027年及之后的市场需求量预计有多大？其用量与哪些因素相关？ PTFE板材预计从2027年开始量产，当年的用量可能达到一两百万张。到2028年，随着相关机柜的大量出货，需求量可能激增至每月一两百万张，即年需求量达到千万张级别。其具体用量与多个因素直接相关，包括终端客户（如NVIDIA Rubin Ultra）的出货量、最终采用的技术方案（例如是采用正交背板还是交换板），以及在不同PCB上使用PTFE材料的具体情况。 NVIDIA在高端材料选择上面临哪些挑战？未来的材料应用趋势可能是怎样的？ NVIDIA面临的主要挑战是单一高端材料的供给不足。无论是存量产能还是新增产能，都难以满足其巨大的需求。设备是扩产的主要瓶颈，即使加上设备厂商能提供的新设备所带来的增量，也无法满足NVIDIA在所有产品线上使用单一材料的需求。因此，NVIDIA必须进行策略性选择，在不同的PCB上分配使用不同的高端材料，例如在一种PCB上使用Q布，而在另一种上使用PTFE。未来的趋势很可能是PTFE与Q布（如M9 Q布或M10 Q布）并存的混合应用方案。", "status": "extracted"}, "attachment:files/银河策略 四季度关键叙事20260923.pdf": {"id": "attachment:files/银河策略 四季度关键叙事20260923.pdf  AVGO 动起来？” 是我们收到的最常见问题。从交流来看尚未达成共识，但我认为围绕 NVDA 的情绪似乎更好，而对于 AVGO，许多美国投资者更担心云服务提供商（CSP）的资本支出，而非来自联发科（Mediatek）的竞争。 网络设备。没有明确的共识。在我们的交流中，很少有人对 CRDO 和 CLS 等落后股表现出浓厚兴趣，且有几位对 ANET 的韧性表示惊讶。作为 NPO（近封装光学）的 “铲子股”，市场对 LITE/COHR 的兴趣有所增加（或许是因为它们在 ECOC 期间的评论和路演），尽管只有少数激进的投资者告诉我们他们增加了多头头寸。Nokia 似乎也拥有一批坚定的追随者，不过相当多投资者并不认同 Nokia 能大幅跑赢 CIEN 的观点（考虑到后者是美国投资者的心头好，且一直享有应有的估值溢价）…… 我的感觉是，许多美国对冲基金都在做多 Nokia。 MRVL 和 QCOM 被反复提及为做多对象，而且市场对 EDA（尤其是 CDNS）表现出浓厚兴趣，特别是考虑到近期一些 SaaS 股票的优异表现。一如往常（毕竟是在欧洲），模拟芯片在几乎每一次对话中都会被提及，但大家对该板块似乎缺乏坚定的信心。#文字观点", "publish_time": "2026-09-24 22:28", "tags": ["文字观点"]}, "post:2026-09-24T07-47:ed821b566e32": {"id": "post:2026-09-24T07-47:ed821b566e32", "kind": "post", "title": "2026-09-24 07:47", "source_label": "帖子正文", "excerpt": "【超快激光具有冷加工效果】超快激光一般指飞秒（fs，10⁻¹⁵s）、皮秒（ps，10⁻¹²s）脉冲激光，区别于纳秒长脉冲、连续激光，超快激光核心特点为脉冲宽度极短、峰值功率极高、作用时间远小于材料热扩散时间，具有冷加工效果，几乎无热传导到周边材料【超快适合精密硬脆材料加工】超快激光聚焦光斑可达微米甚", "content": "【超快激光具有冷加工效果】超快激光一般指飞秒（fs，10⁻¹⁵s）、皮秒（ps，10⁻¹²s）脉冲激光，区别于纳秒长脉冲、连续激光，超快激光核心特点为脉冲宽度极短、峰值功率极高、作用时间远小于材料热扩散时间，具有冷加工效果，几乎无热传导到周边材料【超快适合精密硬脆材料加工】超快激光聚焦光斑可达微米甚至亚微米级别，无机械应力，可实现超高加工精度，尤其适合加工脆硬难熔、透明材料。1） 脆硬材料：玻璃、石英、蓝宝石、碳化硅、陶瓷、金刚石；2）难熔材料：钨、钼、高温合金；3）透明材料：普通玻璃、硼硅玻璃等【超快典型场景及代表公司】 ①PCB：HDI/IC载板/msap精细线路（50μm以下小孔），陶瓷&M9/10&ABF/BT材料迭代，拉动超快激光钻孔技术对C02进行替代#大族数控/英诺/德龙/帝尔/杰普特/芯綦 ②TGV：AI 算力芯片向大尺寸、高集成度演进，传统封装基板逐渐逼近物理极限；玻璃基板成为先进封装技术的优选载体；激光诱导湿法刻蚀（LIDE）为 TGV 主流工艺路线#帝尔/海目星/联赢等③半导体：SiC、晶圆划片 / 切割等#大族激光/德龙激光等④3C：盖板玻璃、摄像头镜片切割、打孔等#大族激光等⑤其他：新型显示、医疗、光通信、金刚石等加工#锐科激光等#文字观点", "publish_time": "2026-09-24 07:47", "tags": ["帝尔", "海目星", "联赢等", "大族激光", "德龙激光等", "大族激光等", "锐科激光等", "文字观点"]}, "post:2026-09-24T10-43:3774209f0445": {"id": "post:2026-09-24T10-43:3774209f0445", "kind": "post", "title": "2026-09-24 10:43", "source_label": "帖子正文", "excerpt": "#锦华新材——受益巴斯夫爆炸巨大产能缺口，电子级羟胺国产替代龙头#预期差最大的存储上游材料黑马事件：9月23日：#巴斯夫全球总部基地路德维希港突发爆燃事故，产业端消息指向羟胺装置，若确认受损，全球约7000吨产能面临缺口，而全球50%产能握于巴斯夫之手——国内厂商能接住溢出的，只有锦华独家。#客户结", "content": "#锦华新材——受益巴斯夫爆炸巨大产能缺口，电子级羟胺国产替代龙头#预期差最大的存储上游材料黑马事件：9月23日：#巴斯夫全球总部基地路德维希港突发爆燃事故，产业端消息指向羟胺装置，若确认受损，全球约7000吨产能面临缺口，而全球 森矿山小幅爬坡但受品位下降制约。 5.焊料需求筑底复苏，AI先进封装与光模块迭代成核心边际增量。传统消费电子处于底部恢复期，新 能源汽车单车耗锡量随技术升级提升至800~1000克；AI服务器单机耗锡量为普通服务器数倍，高速 光模块焊锡膏用量翻倍，预计2028年AI相关高端需求将带来近万吨增量。 6.下游补库行为高度跟随价格波动，库存周期呈快速去化特征。国内社会库存维持去库态势，下游原 料库存天数极低（大型企业9~10天，小型企业3天）；补库逻辑以“买涨不买跌”的价格情绪驱动为 主，而非纯消费景气拉动，11-12月订单转弱后市场或转为累库。 问答整理 Q1：目前锡行业供应端和需求端的整体情况是怎样的？对2026至2028年这三年的供需情况 是如何测算的？ 答：从供应端来看，国内供应主要分为国内自采矿和进口矿两部分，国内自采矿自给率约在40%至 50%之间，其余约50%来自进口。自采部分代表企业为云锡和华锡，其余来自湖南、江西、广西等地 小而散的矿山。我们估算2026年1至7月中国锡精矿产量约4.25万吨，8月产量约在6000至8000 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 吨，同比有所下降，主要受环保限制和品位下降带来的自然衰减影响。云锡精锡冶炼产能为8万吨/ 年，下游锡材产能为4.3万吨/年，锡化工产能为2.71万吨/年，自有矿山自给率2025年约28%，超 过七成原料依靠外采。今年上半年公司收购了赤峰大井子锡业100%股权，黄岗牌锡锭产能为1万吨/ 年，该冶炼单位自2025年11月停产至今年8月复产，年内能提供的增量较为有限；后续若技术改造 顺利推进，预计2027年至2028年云锡冶炼产能将提升至9至10万吨/年。华锡方面，今年9月变更 为中国五矿实际控股，冶炼产能为2万吨/年，原料端自给率约50%，受广西环保趋严和自有矿山品位 下降影响，自给率同样逐年下滑；目前开工率约在60%至70%，未达满产。中国五矿控股后对华锡的 加持更多体现在原料供给端，未来两到三年自给率有望逐步提高，但暂未看到冶炼产能明显扩张。兴业 银锡方面，公司自2020年正式复产后产量持续爬坡，2024年技改后达到峰值，当年产量约8900金 属吨，回收率提升至75%以上；2026年上半年产量约2758吨，同比小幅下滑，主要是入选品位和处 理量变化所致，7月发生安全事故后采选系统停产，9月3日选矿系统复产，采矿系统仍在整改。其月 均产能约700至1000吨，年内产量指引为5500吨，若后续顺利复产，预计受影响量约1至2个月。 新增项目方面，一是1万2期项目，2026年7月开工，预计2028年四季度才能实现正式带料试车， 采矿能力从165万吨/年提升至297万吨/年，增幅约80%，全部满产可扩产至约1.6万吨产量；二是 宇邦二期项目，以银为主、锡作为辅料，计划2026年5月开工，达产洗选量约825万吨，预计2028 年四季度带料试车，并非锡的主要产量来源；三是摩洛哥锡矿资源，探明资源量2730万吨，锡金属量 约174千吨，品位较高，已取得矿区开工许可并开展试运营，预计2028年四季度试投产，目前年均产 量尚未公布。整体来看，国内三家企业显示未来2至3年自有矿山开采较难有大幅增量，国内自给率预 计维持在40%左右，新增项目集中到2028年以后。海外进口矿方面，缅甸在2023年前是我国进口矿 主要来源，高峰时占比达80%至90%，2023年曼相矿区全面禁采后占比快速下滑。2026年3至4月 曼相矿区全面复产，但月均进口量仍维持在1000至1500金属吨，高峰约1500至1600金属吨，低 于此前市场预期的月均2000至2500吨。主要原因包括：矿洞成本均摊缺乏明确机制，雨季后高海拔 矿洞持续抽水成本较高；佤邦政权变更后审批流程冗长，30%实物税负担较大；开采成本显著上升，当 前含人工、燃油、抽水、税费等综合开采成本约达23万元/金属吨；小而散投资商逐步被淘汰。缅甸南 部因年初锡钨矿报关方面的不可抗力因素，进口量从月均700至800吨下降至约500至600金属吨， 二季度末曾有一个月基本为零。刚果金方面，2023年以来进口占比快速提升，2025年进口占比达到 31.61%，同期缅甸为18.62%；2024年刚果金为34.22%，缅甸为30.38%；2026年1至8月刚果金 占比28.29%，缅甸占比23.97%。主采矿山为顶级矿山，生产公司为阿法林公司，约占刚果金锡矿供 应70%左右，其余20%至30%来自小矿山和当地手采矿。今年主要受埃博拉病毒、M23武装冲突以 及雨季影响，其中病毒主要影响工人上工率和州际运输，矿山本身未停产；雨季为10月至次年5月下 旬，4至5月为高峰，运输路线上货车容易受泥泞道路影响。阿法林南部项目已正式投产，是2025年 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 底以来产量增量的主要来源，但未来近3年暂无明确新增长项目，预计月均向国内输送量维持在2000 至2500金属吨。澳洲方面，雷尼森矿山生产稳定，2026年上半年产量约5696吨，同比增长 10.47%，增量来自多个作业区同时开采、百年矿山修复以及锡价上涨带来的激励；但矿山品位逐年下 降，后续月均进口量预计维持在700至1000吨附近。尼日利亚进口量上升较快，月均约500至600 吨，高峰可达800吨左右，受益于临近自有港口、运输路线短，是后续非洲增量的主要看点之一。南 美洲方面，玻利维亚受国情限制，出口矿品位仅约10%左右，月度实物吨虽高但金属吨仅100至200 吨，对国内影响不大。以上为供应端的主要情况。 Q2：将增量与扰动因素综合计算后，2026年、2027年、2028年全球整体矿端供给的测算 数字大概分别是多少？ 答：去年（2025年）年底我们拍出的2026年锡矿增量为约2万吨，但今年实际增量可能仅在1万吨 左右，主要原因是缅甸复产不及预期。2027年如果缅甸能够顺利爬坡至月均2000吨至2500吨，全 球锡矿供应增量预计仍约为2万吨；如果缅甸月均仍维持在1500吨附近，全球增量可能不到1万吨， 缺口依然存在。自有矿山方面，类似兴业银锡和雷尼森矿产通过自有矿山升级扩张，单座矿山月均增量 可能在200至300吨，年均增量在1000至2000吨。2028年如果缅甸实现月均2000至2500吨的 常态供应，叠加兴业银锡摩洛哥项目等海外新增布局陆续试投产，全球增量保守估计可能达到3万吨。 但2027至2028年之间整体仍以平稳为主，主要增量仍依赖缅甸，其他地区暂看不到明显的增量，需 到2028年之后全球新增项目投产后才会有更快的爬坡。 Q3：在供需测算中，对缅甸地区复产节奏的假设是如何设定的？ 答：年内缅甸较难有大幅增量，月均仍将维持在1500金属吨上下。明年（2027年）高位可能也就在 月均2000吨左右，要上升到2500吨的难度较大。主要原因在于：佤邦政府虽出台了成本分摊文件， 但至今没有明确具体分摊项目范围和成本均摊划分方案；雨季是每年都有的常态因素，对矿山生产影响 长期存在；目前留存下来的贸易商数量减少、集中度提高；同时曼相矿区原矿品位经过多年开采后持续 下降，限制了全面复产的幅度。因此后续很难回到2021年、2022年月均3000至4000吨的水平， 2028年往后高峰值可能也就在2500吨上下。 Q4：接下来想请陈总介绍一下需求端的情况。 答：从全球需求结构来看，锡焊料占比约48%，锡化工约17%，马口铁约14%，铅酸蓄电池约8%， 浮法玻璃和锡基合金合计约13%，其中浮法玻璃约5%。中国市场需求结构以锡焊料为主，占比约 64%。焊料方面，主要下游为电子消费领域，包括集成电路、手机、光伏、汽车电子、白色家电、通信 和计算机等。行业平均来看，集成电路每万块耗锡量约1.5千克，智能手机单部耗锡量约1.5克，电子 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 计算机单台耗锡量约15克。今年集成电路累计同比增速较快，到7月约24%左右；手机累计同比下滑 6.6个百分点；计算机同比下滑13个百分点，传统消费仍处于底部恢复期。汽车方面，1至7月中国 汽车产量约1756万辆，累计下降约3.5个百分点；新能源汽车约906万辆，同比增长9.3个百分点。 在AI和技术进步驱动下，每台新能源汽车耗锡量可达800至1000克，预计2026年全球新能源汽车 耗锡量约1.54至2.1万吨，国内新能源汽车增量约0.27万吨，总耗锡量增量约2.18万吨。光伏方 面，耗锡主要来自光伏焊带、涂锡铜带、互联带和汇流带，单位耗锡量约46至48吨/吉瓦，2025年 新增装机约315吉瓦，同比增长13.67%，2026年预计新增装机约200至250吉瓦，对应耗锡增量约 9000吨。锡化工方面，分为无机锡化工和有机锡化工，有机占比较高，其中PVC稳定剂是最主要下 游。PVC市场规模当前约9.2万吨，2026年整体需求可能有1至2个百分点的小幅增长；1至8月 PVC产量约1577万吨，同比下降约1.9%，海外订单受海运和局部摩擦影响下滑，但后续三、四季度 行情预计较好。PVC耗锡量行业均值约0.8至1.1千克/吨。镀锡板（马口铁）方面，1至8月国内产 量约392万吨，同比增长约10.9%，产能利用率平均约70%，常规双面镀锡板单吨耗锡量约3.5至 3.6公斤，整体用锡量影响有限。浮法玻璃方面，耗锡主要在锡槽，把锡锭熔为锡液作为浮托介质； 600吨产线锡槽填装量约200至220吨，650至900吨产线约178至230吨，1700吨以上吨线约 520吨，但冷却后回收率高，实际损耗不大；1至8月浮法玻璃产量约3544万吨，同比下滑约7%。 铅酸蓄电池方面，锡用于板栅合金，传统板栅合金含锡量约0.7%至1.5%，新研发高锡含量专利可达 2%左右，板栅占蓄电池总质量的20%至30%，整体影响量较小。AI是未来高端应用核心，到2028 年，类似MISMT的提升对锡金属的拉动量有望达到8.6至9.5之间的一个增量。AI先进封装驱动是 增长的核心引擎，AI服务器单机耗锡量是普通服务器的3至5倍，高速光模块迭代带动焊锡膏用量翻 倍，单模块锡膏用量从400G的0.55克提升至1.6T的2.2克左右。但如果AI投资退潮，相关增量也 将全面承压。我们预测全球PCB用锡需求2026年约9.8万吨，2027年约10.29万吨，2028年约 11.17万吨，逐年增速约5.9%、4.1%和8.5%。 Q5：想请陈总介绍一下锡的库存方面的情况。近期价格变动与库存、下游补库等关联较大， 当前锡的库存及下游补库结构大致是怎样的？ 答：库存方面，国内厂商库存去化较快，上期所仓单逐步减少，国内社会库存全年总体维持去库态势。 金九银十传统旺季是下游补货需求较大的时期，但当前下游补库更多跟随锡价波动，而非单纯的消费驱 动。下游原料库存处于极低水平，大型企业原料库存约10至15天，中小型企业多时约一周；8月数据 显示，大型企业约9至10天，中型企业约6天，小型企业约3天。日度采购量方面，大型企业约200 至300吨，小型企业维持刚需，少量时约2至3吨，月度约20至30吨。此前锡价从40多万元/吨回 落至39万元/吨时，下游当天补库较快，大部分贸易商手中锡锭库存出清，部分贸易商开始卖仓单和期 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 货；价格回升至41万元以上后，下游以消耗库存为主，补货需求转淡。从后续节奏看，10月价格预计 在39至42万元/吨之间波动，金九银十对订单有一定推动，环比好于7、8月份，10月仍以小幅去库 为主；到11、12月海外订单逐步出清，消费转冷，冶炼厂恢复正常生产，市场可能转为累库。此外， 云溪年度检修计划尚未公布，检修期间停产不停销，或对价格有一定影响。海外方面，自5、6月起持 续去库，原因是印尼出口换证审核拖慢生产节奏、国内进口窗口打开吸收货源、海外现货收紧；随着印 尼上半年制度性扰动逐步出清，8、9月起供应量回升，11、12月或环比下降，海外去库节奏将有所缓 和。焊料企业开工率方面，我们统计42家样本企业，1至7月锡焊料产量约4.72万吨，同比下降2.4 个百分点，主要受2月春节假期拉长影响；其中产能在200吨/月的企业开工率约82%，100至200 吨/月的企业开工率约72%，1000吨/月以下的企业开工率约51%，整体开工率小幅下滑。 原文 转写原文如下（标题候选：有色｜中银锡供需及下游生态）： 1.全球锡矿供需总量测算：增量预期两度下修，2027-2028年实际供给弹性高度绑定缅甸2026年增 量预测与实际兑现显著背离2025年底市场拍2026年全球锡矿供给增量约2万吨，但截至2026年9 月，实际增量大概率仅1万吨左右（口径区间1万-1.5万吨），核心拖累为缅甸曼相矿区复产不及预 期。 2027年全球供给增量：分情形假设若缅甸顺利爬坡至月均2000~2500金属吨，全球锡矿供给增量仍 可维持在2万吨/年左右，增量主要来源于缅甸，其他地区暂无明显增量。 若缅甸仅维持在月均1500金属吨上下，全球进口端增量基本看不到太大空间，全球供给增量或不足1 万吨，缺口依然存在。 在2026年基础上测算的折中口径：2027年主要增量来源仍为缅甸，曼相矿区月均增量约500吨左 右，叠加2026年月均下降300~500金属吨的缅甸南部恢复，2027年全球生产增量约1.5万吨左右。 全球范围内矿端自身亦有少量内生增量，典型如兴业银锡自有矿山持续升级扩张、澳洲雷尼森矿山上 量，月均可贡献增量约200~300吨，全年平均增量约1000~2000吨（主要为澳洲部分）。 2028年及以后：短期 09-24T08-58:e139986ad8ec": {"id": "post:2026-09-24T08-58:e139986ad8ec", "kind": "post", "title": "2026-09-24 08:58", "source_label": "帖子正文", "excerpt": "【盘前0924】PH解盘追踪#创业板算力ETF鹏华158057仍有机会#创业板成长ETF鹏华158025下周一上市中秋节快乐！1、昨晚美股如期调整，从历史高位回落，但幅度也还好，毕竟连续上涨那么多。", "content": "【盘前0924】PH解盘追踪#创业板算力ETF鹏华158057仍有机会#创业板成长ETF鹏华158025下周一上市中秋节快乐！ 1、昨晚美股如期调整，从历史高位回落，但幅度也还好，毕竟连续上涨那么多。主要导火索是9月美国PMI大超预期，是2021年7月以来最高水平，即使后面供给侧通胀压力缓解，需求驱动型的通胀仍可能加速，就迫使美联储不得不继续紧缩，美国进入一轮典型的制造业上行周期了。地缘方面，似乎谈判进展不明朗，乐观预期部分回吐，油价回升，美联储官员鹰派发言，也增加了市场对10月美联储进一步加息的押注，美债收益率攀升，市场在重新定价美联储政策路径。不过幅度可控，昨天亚太提前回落，今天韩国休市，日本开盘走高。 2、昨天大盘一直在水面下小幅波动，还符合我们判断低波进二退一的节奏，一方面节前出金日本身交易的主动性就不强，量能萎缩到1.8万亿下。另一方面想观望访美结果，又担心美股新高后调整，这就是A股预期的提前量，昨晚如期表现了，今天如果低开，那就又能期待了，日本打了样，只不过空间也有限，还是受制于外围宏观因素。只要假期不出来超预期的利空，加上本轮元首会晤市场预期不高，美股科技只要稳住，止盈仓位的影响会减弱，反而可能下周会有资金做仓位回补博弈下10月窗口期。 3、从美国数据看出来，K型经济本身就会制造局部韧性行情，如果有超额，抓手还是在双创，只不过不太会有类似Q2那样子一枝独秀的结构化行情。昨天投机情绪都有点减弱，农业开盘就兑现，地产冲高回落后也显著分歧，反而是科技里面国产链还有一定做多意愿，科创半导体设备ETF鹏华#589020和科创芯片设计ETF鹏华#589170的韧性还不错，三线pcb继续涨，小光也有好几个反弹的，今天可以期待下消费电子ETF鹏华#159153，有新催化。创业板算力ETF鹏华#158057 上市有点折价，可以积极低吸。 4、其他的，机器人ETF鹏华#159278消息挺多，还是筹码轻。医药还是很强，尤其是美股，A股连续上涨后也有回踩巩固的需求，看港股通创新药ETF鹏华#159286和恒生生物科技ETF鹏华#159130。最容易的还是先做科创小盘，最近科创200ETF鹏华#588240 走得特别强势，科创100ETF鹏华#588220也很不错，其次才是科创综指ETF鹏华#589680。（仅供内部参考，不做投资建议，基金投资需谨慎）#文字观点", "publish_time": "2026-09-24 08:58", "tags": ["文字观点"]}, "attachment:files/A股与港股复盘20260924.pdf": {"id": "attachment:files/A股与港股复盘20260924.pdf", "kind": "attachment", "title": "A股与港股复盘20260924", "source_label": "其他", "excerpt": "A股与港股复盘 2026年9月24日 研究笔记 · 不构成投资建议 第 1 / 11 页 股票市场复盘 美债收益率飙升冲高，全球市场承压 2026年9月24日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。主线 美债收益率创数十年新高，10月加息定价骤升，压制全球风险资产 美债10年期收益率隔夜单日跳", "content": "A股与港股复盘 2026年9月24日 研究笔记 · 不构成投资建议 第 1 / 11 页 股票市场复盘 美债收益率飙升冲高，全球市场承压 2026年9月24日 · 沪深15:00 / 港股16:08 部分展望评论分开发布在「洪灝的宏观策略」星球上，供星球读者参考。 主线 美债收益率创数十年新高，10月加息定价骤升，压制全球风险资产 美债10年期收益率隔夜单日跳升17个基点，创17个月来最大单日升幅，升至2007年7月以来新高；30年期升破5.44%，创2004年6月以来新高，10月加息预期骤然升温（见主线段），直接推高油价、压低美股期货，成长/久期资产首当其冲。A股顺着这条链条走弱：创业板跌2.68%、深证成指跌2.34%，跌幅明显重于权重股集中的上证（跌1.22%）和港股恒指（仅跌0.29%），两市1,098家上涨、4,047家下跌，普跌面很宽但成交较前一交易日回落，不是恐慌式出逃。 本日报要 主线段： 今天全球市场的主角是美债。10年期美债收益率周三单日跳升17个基点，是17个月来最大的单日升幅，一度触及5.05%、创2007年7月以来新高，较3月低点已累计上行113个基点；这个势头延续到周四，30年期收益率升破5.44%，创2004年6月以来新高，距2020年低点已回升近500个基点。市场把这次上冲解读为通胀而非增长驱动——WTI原油重新站上90美元上方，10月加息（而非降息）的定价概率被推到64%，特朗普政府据报正考虑对美国柴油出口实施90天禁令以压低国内柴油价格，8月M2货币供应量同时创下23.34万亿美元的历史新高、同比增速5.7%为2022年6月以来最快。中美贸易协议延长至2027年1月10日、中国8月出口同比增长25%（对美出口反弹逾三成）这两条本该提振风险偏好的消息，都没能抵消利率冲击——标普期货跌0.5%、纳指期货跌0.9%，金价随实际利率走高回落0.5%。A股顺着这条链条走弱，且成长股跌得明显更深：创业板跌2.68%、深证成指跌2.34%，上证靠权重股撑着只跌1.22%，两市1,098家上涨对4,047家下跌，普跌面很宽；但沪深两市合计成交约1.65万亿元，较前一交易日的成交量回落逾一成，不是资金恐慌出逃，更像是缩量阴跌。港股跟随但幅度小得多，恒指仅跌0.29%，是这条链条上最抗跌的一环。 A股： 上证指数收3,888点跌1.22%，深证成指收13,317点跌2.34%，创业板指收3,289点跌2.68%，科创50收1,622点跌2.35%；沪深两市合计成交约1.65万亿元（沪市7,836.1亿、深市8,697.4亿），较前一交易日成交量回落（沪市成交量降约6%、深市降约10%、创业板降约11%）。两市涨跌家数（交易所口径）1,098:4,047:142，计入北交所为1,134:4,352:148；涨停52只、跌停13只，盘中炸板30家。 A股与港股复盘 2026年9月24日 研究笔记 · 不构成投资建议 第 2 / 11 页 港股： 恒生指数收24,761点跌0.29%，国企指数收8,266点跌0.09%，恒生科技收4,361点跌0.41%，三个指数当日跌幅都在1%以内，明显抗跌于A股成长板块。 货币与汇率： 央行9月24日以固定利率、数量招标开展515亿元7天期逆回购，中标利率1.40%；当日到期1,620亿元（9月17日投放的7天品种到期），7天逆回购口径净回笼1,105亿元。同日另开展8,000亿元1年期MLF操作，本月到期6,000亿元，净投放2,000亿元，是连续第3个月净投放、规模较上月又多1,000亿元——中秋、国庆双节将至，央行用MLF加量对冲短端逆回购的净回笼，呵护跨节流动性。人民币中间价报6.7489，较9月23日的6.7468调贬21个基点；在岸即期约6.7021、离岸约6.7151，在岸比中间价明显偏强（价差约468个基点），在岸也比离岸强约130个基点；美元指数约101.25，较前一交易日的101.10上行约0.15%。 互联互通： 北向资金9月24日成交约2,325.1亿元，较前一交易日的2,365.1亿元小幅回落，净额官方口径不披露。南向资金当日成交约630.0亿元，较前一交易日的821.4亿元明显萎缩（降约23%），净买入约29.0亿元，较前一交易日净买34.5亿元收窄，但方向未变，仍是净买入。 大波动： 内地——新华文轩（601811）涨10.0%（出版，5连板，9月15日落地13.11亿元四川义务教育教材采购合同，9月21日公告拟3.46亿元收购控股股东旗下四川民族出版社整合同业竞争，叠加AI数字化转型业务收入增速超20%，公司已多次公告提示非理性炒作风险）、平潭发展（000592）涨10.0%（福建本地股，福建省印发《美丽中国先行区建设实施方案》带动板块集体涨停）、三星电气（601567）涨10.0%（电网设备）、雷科防务（002413）涨10.1%（军工电子）、康强电子（002119）涨10.0%（半导体）；哈药股份（600664）跌10.0%（化学制药）、百合花（603823）跌10.0%（化学制品）、超声电子（000823）跌10.0%（元件）、国芳集团（601086）跌10.0%（一般零售）——后四只均为个股独立下跌，未见与今日宏观主线相关的共同催化。港股——小米集团-W（01810）涨1.5%、网易（09999）涨1.2%；快手-W（01024）跌0.9%、中国人寿（02628）跌0.9%、美团-W（03690）跌0.8%，港股大盘股当日波动幅度普遍不到2%。 技术： 上证收3 95e7c1e24304": {"id": "post:2026-09-24T16-37:95e7c1e24304", "kind": "post", "title": "2026-09-24 16:37", "source_label": "帖子正文", "excerpt": "PCB、覆铜板与载板📌Prismark 专家电话会核心要点🔹我们邀请了来自 Prismark 的高级顾问 Terry Wang，探讨近期若干议题，包括共封装光学（CPO）对 PCB / 覆铜板的影响，以及聚四氟乙烯（PTFE）的潜在应用前景。核心要点如下： 🔹共封装光学（CPO）对高速覆铜板的影响大", "content": "PCB、覆铜板与载板📌Prismark 专家电话会核心要点🔹我们邀请了来自 Prismark 的高级顾问 Terry Wang，探讨近期若干议题，包括共封装光学（CPO）对 PCB / 覆铜板的影响，以及聚四氟乙烯（PTFE）的潜在应用前景。核心要点如下： 🔹共封装光学（CPO）对高速覆铜板的影响大概率可控。CPO 并不会简单等同于 PCB / 覆铜板规格降级，因为系统仍需要高性能材料来支持供电以及板上剩余的数据传输与通信（即相关需求在光链路本身之外依然存在）。因此 M7（或更高等级）覆铜板预计仍会被采用。 🔹CPO 预计将率先在 2026 年于交换机领域规模化落地，其余领域商业化周期更长，短期内对高速覆铜板需求的替代空间有限。🔹此外，随着器件形态的规模化发展（交换机芯片可搭载光引擎），板 / 载板尺寸、翘曲度与平整度约束或将成为影响系统性能的关键因素，即便 CPO 渗透率进一步提升，市场仍会催生对低 CTE（也就是更高端）材料的需求。🔹聚四氟乙烯（PTFE）的落地尚未敲定，可加工性仍是核心制约因素。在市场关注度较高的 PTFE 议题上，结论是 PTFE 尚未扫清实现 PCB 稳定量产所需的实际障碍（例如压合 / 工艺窗口以及可靠性相关问题），并且材料 “通过认证” 并不一定代表可以实现规模化制造。 🔹对于超高层数应用场景（例如背板，层数已超过 100 层），材料选择仍未确定，相关讨论仍在持续，这表明 PTFE 应当被视作一条仍在发展的技术路线，而不是已经落地、即将直接替代现有材料路线的方案。 🔹目前行业正在探索无玻璃布覆铜板方案，该材料的应用将催生全新的 PCB 制造工艺，率先完成产线革新的公司将获得先发优势。🔹上游材料：供需关系依旧偏紧；树脂或将成为覆铜板的下一个差异化赛道。源头内容加微wuxl3408对于玻纤而言，向高端产品（即低 DK、低 CTE 玻纤）的产能转换，实际上会提升加工强度，可能压缩短期有效产出，使得市场紧张程度高于名义产能扩张所体现的水平。 🔹不过低端玻纤产品的供需缺口未来有望收窄，原因是该领域技术门槛相对更低，整体供给具备扩张空间。 🔹铜箔方面，高端 HVLP 铜箔供给仍被认为存在结构性约束，新增产能往往受制于良率与品质爬坡，而非铭牌产能公告。 🔹与此同时，在覆铜板未来升级的驱动要素上，讨论重心或将转向树脂。树脂配方属于专利技术，树脂与填料之间的相互作用至关重要，这为性能持续优化保留了空间（存在超越 BCB 材料进一步升级的可能性，烃类树脂路线仍有发展空间）。 🔹PCB / 载板的竞争格局持续利好行业存量头部厂商。整体来看，PCB / 载板行业后续竞争中，不断抬升的技术要求（翘曲控制、厚板、PCB 制造工艺革新）提高了行业准入门槛，拉长了客户认证周期，从结构层面利好具备成熟落地经验的老牌公司。🔹尽管部分新进入者会采取激进的产能扩张策略，但 AI 级产品的交付要求以及客户的风险偏好，往往会将订单集中分配给行业头部厂商。 🔹因此，行业格局大概率会持续向具备规模、品质验证的制造厂商集中，强化 “强者恒强” 的格局。#文字观点", "publish_time": "2026-09-24 16:37", "tags": ["文字观点"]}, "post:2026-09-24T12-45:9b83d9150c7c": {"id": "post:2026-09-24T12-45:9b83d9150c7c", "kind": "post", "title": "2026-09-24 12:45", "source_label": "帖子正文", "excerpt": "德福专家调研更新（0924）： #重视锂电铜箔价的提升和PCB铜箔量的提升带来的戴维斯双击机会！！", "content": "德福专家调研更新（0924）： #重视锂电铜箔价的提升和PCB铜箔量的提升带来的戴维斯双击机会！！！ 1.锂电铜箔这一轮铜箔加工费的普涨，幅度基本在1000-2000元每吨这个区间，折算下来差不多就是10%左右的涨幅。#目前在C 催化？20260923 要点总结 1.板块基本面进入利润快速释放期：40家样本股2026H1归母净利润实现翻倍以上增长，盈利公司占 比超一半，预计未来几年收入增速中枢维持在25%左右，行业整体步入盈利兑现阶段。", "content": "未来两年中国创新药在美国研发和上市有哪些关键催化？ 20260923 要点总结 1.板块基本面进入利润快速释放期：40家样本股2026H1归母净利润实现翻倍以上增长，盈利公司占 比超一半，预计未来几年收入增速中枢维持在25%左右，行业整体步入盈利兑现阶段。 2.估值定位具备较强配置吸引力：当前约2万亿市值对应年化利润约600亿，2026/2027年PE约30 倍，叠加25%左右的利润增速，对非医药资金具备显著的配置吸引力。 3.核心出海催化集中在ADC与双抗领域：未来3-4年大量中国创新药将在美国上市，2026-2029年 FDA获批与海外上市产品路径清晰，峰值销售合计可达300~400亿美元，临床数据将直接转化为报表 营收与利润。 4.肺癌为布局最密集癌种且竞争格局将逐步分化：双抗与ADC针对驱动基因突变阴性人群的一线 NSCLC有望改变现有标准治疗，小细胞肺癌后线以ADC为主，当前市占率假设平均化，后续将随数据 读出产生分化。 5.其他重点适应症市场空间明确且存在布局机会：乳腺癌（TNBC及HER2低表达）、妇科肿瘤、泌 尿生殖系统肿瘤及消化道肿瘤均有明确的临床对标与患者基数，结直肠癌等领域尚无ADC布局，具备 重点关注价值。 6.大三期数据读出日历密集且中国研究占比显著提升：2026下半年至2028年将集中发布多款重磅产 品的关键临床数据，ESMO2026主席会议中近半数来自中国研究，标志中国创新药进入全球数据兑现 爆发期。 7.海外竞争力评估聚焦五大核心维度：从对照组可比性、疗效复刻能力、全球临床设计一致性、安全 性及市场价值与先发优势进行综合判断，其中疗效本身的复刻能力与OS转化表现最为关键。 8.头部平台型公司具备长期持有价值而尾部公司生存风险高：信达、百济、恒瑞等头部企业已证明或 具备国际化能力与管线宽度，单产品或小体量公司因技术迭代极快、2020年IPO公司约90%已消失， 难以跨周期持有。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 问答整理 Q1：创新药现在看好哪几个标的？短期催化剂是什么？空间看多少？ 答：创新药重点关注两类公司：一类是有收入有利润的公司，另一类是管线已在海外有关键临床或具备 竞争力的公司。具体标的方面，信达已进入较为确定的利润释放期，旗下363、343以及眼科产品在全 球开展临床；汉森的B7H3ADC年初市场预期并不高，但GSK为其开设了较多临床，后续临床陆续读 出和兑现对公司价值有提升作用；康诺亚国内产品已进入基药，竞争格局较好，海外产品与AZ及吉利 德的合作后续均有临床推进和数据读出；英恩与BioNTech合作多年，在ESMO上及明年均有关键数 据读出。上述公司均值得关注。 Q2：下半年还有哪些事件驱动？比如重要会议。 答：下半年最重要的催化剂是ESMO会议，ESMO的LBA列表已公布，今年近半的LBA文章来自中 国研究，其中最核心的Plenarysession在数千篇研究中仅选取12篇，其中5篇为中国研究，显示中 国创新药已进入数据大爆发期。其他事件驱动包括公司业绩情况，以及可能出现的大药BD交易。此前 市场担心的医药代表新规对销售的影响，目前了解下来影响不是非常大，相比5、6月份较为紧张的状 态已有好转，对国内销售可以预期相对乐观一些。 Q3：从价值投资、长期主义的角度看，创新药投资的长远发展如何？ 答：从价值投资和长期主义角度看，美国前15大MNC药企位置非常稳定，多为百年企业，核心依靠 销售渠道和从外部购买产品，后进入者如吉利德依靠乙肝治愈突破冲入前列，再生元依靠单抗平台做出 重磅产品。中国创新药头部公司中，信达目前市场信任度和认可度最高；百济已证明自身国际化能力， 属于全球化公司；恒瑞管线数量居国内前列，其license-out的合作方在海外股价表现较好。头部公司 未来在中国市占率有望提升，并逐步获取海外市场分成。需要提示的是，单产品公司尤其是押注很新技 术路线的小型单产品公司较难看长，因技术迭代非常快，2020年IPO的创新药公司中约90%已经不存 在。创新药投资应从销售能力、研发能力、管理能力等维度综合评估平台型公司。 原文 转写原文如下（标题候选：未来两年中国创新药在美国研发和上市有哪些关键催化？）： 1.板块基本面与盈利释放：40家样本公司2026年上半 性预期较高。 康方生物卡度尼利单抗新开了胃癌适应症。 和黄医药文字提问问及赛沃替尼在EGFR突变后MET扩增适应症2027年全球上市概率，会议未直接 确认该判断，需跟踪后续临床与监管进展。 9.风险提示与尾部风险肺癌竞争烈度：布局密集，短期各产品市占率假设被平均化，后续数据读出后 分化将扩大，部分产品可能面临数据不及预期或被显著挤压的风险。 对照组与监管不确定性：若头部产品长期成为SOC3~5年后被强制作为对照组，后续竞品临床设计成 本与难度将上升。 OS转化风险：海外后线治疗选择更多，PFS改善无法保证OS同步兑现，毒性、后续治疗交叉因素均 可能消耗OS获益。 基准产品对标风险：在HER2阳性乳腺癌（8201）、尿路上皮癌（帕德西夫）等细分领域中，对标产 品benchmark过高，后续产品即使数据不差也可能面临商业化天花板。 小众适应症市场体量限制：胃癌美国市场新发相对较少、SCLC患者基数不大，单一适应症美国空间需 折让评估。 尾部公司生存风险：技术迭代极快，2020年IPO公司中约90%已消失；单产品、小体量公司即便贝塔 改善也难跨周期持有，需严格甄别阶段与平台属性。 问答整理1创新药现在看好哪几个标的？短期催化剂是什么？空间看多少？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 创新药重点关注两类公司：一类是有收入有利润的公司，另一类是管线已在海外有关键临床或具备竞争 力的公司。具体标的方面，信达已进入较为确定的利润释放期，旗下363、343以及眼科产品在全球开 展临床；汉森的B7H3ADC年初市场预期并不高，但GSK为其开设了较多临床，后续临床陆续读出和 兑现对公司价值有提升作用；康诺亚国内产品已进入基药，竞争格局较好，海外产品与AZ及吉利德的 合作后续均有临床推进和数据读出；英恩与BioNTech合作多年，在ESMO上及明年均有关键数据读 出。上述公司均值得关注。 2下半年还有哪些事件驱动？比如重要会议。 下半年最重要的催化剂是ESMO会议，ESMO的LBA列表已公布，今年近半的LBA文章来自中国研 究，其中最核心的Plenarysession在数千篇研究中仅选取12篇，其中5篇为中国研究，显示中国创 新药已进入数据大爆发期。其他事件驱动包括公司业绩情况，以及可能出现的大药BD交易。此前市场 担心的医药代表新规对销售的影响，目前了解下来影响不是非常大，相比5、6月份较为紧张的状态已 有好转，对国内销售可以预期相对乐观一些。 3从价值投资、长期主义的角度看，创新药投资的长远发展如何？ 从价值投资和长期主义角度看，美国前15大MNC药企位置非常稳定，多为百年企业，核心依靠销售 渠道和从外部购买产品，后进入者如吉利德依靠乙肝治愈突破冲入前列，再生元依靠单抗平台做出重磅 产品。中国创新药头部公司中，信达目前市场信任度和认可度最高；百济已证明自身国际化能力，属于 全球化公司；恒瑞管线数量居国内前列，其license-out的合作方在海外股价表现较好。头部公司未来 在中国市占率有望提升，并逐步获取海外市场分成。需要提示的是，单产品公司尤其是押注很新技术路 线的小型单产品公司较难看长，因技术迭代非常快，2020年IPO的创新药公司中约90%已经不存在。 创新药投资应从销售能力、研发能力、管理能力等维度综合评估平台型公司。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-09-24T22-29:10090dcbcb5b": {"id": "post:2026-09-24T22-29:10090dcbcb5b", "kind": "post", "title": "2026-09-24 22:29", "source_label": "帖子正文", "excerpt": "焦点：半导体圆桌会议纪要 卖方圆桌纪要 从上周的 AI 安全恐慌到本周的 MUSE 乐观情绪，半导体和 AI 领域出现了大量的交叉气流。谁知道下周会发生什么，但 MU 和 OpenAI 将成为市场焦点。", "content": "焦点：半导体圆桌会议纪要 卖方圆桌纪要 从上周的 AI 安全恐慌到本周的 MUSE 乐观情绪，半导体和 AI 领域出现了大量的交叉气流。谁知道下周会发生什么，但 MU 和 OpenAI 将成为市场焦点。当市场出现这种类型的波动时，我的默认做法是召集 “半导体圆桌会议” 进行讨论。 昨天，我们重点讨论了投资者最关心的 5 个话题：1）消费者智能体（Consumer Agents）主题 / 投资（CPU、内存、算力）；2）内存前景；3）半导体设备（Semi Caps，什么能推动它们？）；4）模拟半导体（什么能推动它们？）；以及 5）到年底的最佳风险 / 回报比？ 底线结论：投资者对 AMD 在 AI 领域的地位保持乐观，但在大幅上涨后开始对其估值产生迟疑。内存仍是争论的焦点，一方面是代理式 AI（Agentic AI）带来的潜在拉动，另一方面是由于长期协议（LTA）导致的短期业绩上行空间有限。半导体设备仍难以获得资金支持，尽管有一些个股机会以及即将到来的 SEMICON West（10 月 13 日 - 10 月 14 日）催化剂。模拟半导体在圆桌会议上获得的关注略高于会议期间，但本财报季必须看到正向的业绩修正和更高的利润率。NVDA 作为具有估值支撑的潜在受益者悄然入选，而 AVGO 则引发了一场精彩的双向辩论。 1. 消费者智能体（Muse）主题 投资者对这一机遇持建设性态度，但在经历大幅上涨后对 INTC 和 AMD 的看法不一，转而更关注其他同样可能受益的领域（计算、内存）。 AMD：投资者对消费级智能体对 CPU 的影响持乐观态度（已预期同比增长 70% 以上），但在近期大部分涨幅由估值倍数扩张驱动后（买方预期 2028 年每股收益 30 美元，对应 20 倍市盈率，市值达 1 万亿美元），开始对估值产生抵触情绪。相对于 CPU 的增长前景，市场对 Helios 产能爬坡的信心较弱。（回想一下，这是我们近期 TMT 会议上最拥挤的场次，且该股表现确实不俗）。 INTC：投资者对 CPU 带来的利好持乐观态度，但认为代工业务（Foundry）才是股票进一步重新估值的关键。部分投资者对代工业务前景持建设性态度，而其他投资者则处于 “观望模式”。 ARM：被认为更多受益于估值重估和被纳入 “Muse 赢家组合”，而非短期内的基本面驱动。 NVDA：根据买方消息，按 2028 年每股收益（EPS）的 9 倍计算显得便宜，且首席执行官下周将在纽约出席活动。 AVGO = 辩论焦点：看多者认为，META、MTIA、OAI 日以及首席执行官在未来几周的路演将带来上涨空间。看空者则担心联发科在谷歌 TPU 方面的进展超过预期，从而导致进一步的市场份额流失。 SMTC：该公司持续被提及，在 AI 布局中处于有利位置，且业绩数据有潜在的上行空间。 其他消费智能体相关标的：CIEN、ANET（META 流量增长利好）、COHR、NVDA、CRDO、QCOM。 2. 存储领域仍存在双向争论 存储看多者：鉴于需求拉动以及 2028 年前供应持续收紧的预期，大多数投资者认为与 CPU 相比，该领域更被 “低估”。对于存储领域规格降低（De-Spec）的担忧被视为已反映在价格中。 存储看空者观点：一些人认为智能体（Agents）不会像最初预期的那样全天候 24 小时运行，这对内存需求的推动作用可能有限。此外，市场还担心短期内业绩上行空间受限，以及第四季度大宗商品价格可能走软。 MU 预期（9 月 30 日）：投资者对 2027 年的前景持建设性态度，但由于长期协议（LTA）的价格上限，对短期指标的把握尚不明确。对 11 月季度 EPS 指引的预期在 38-40 美元范围内，但管理层关于 2027 年增长持续性的评论，可能与原始数据同样重要。回购将于今年晚些时候开始，且 DRAM 报价存在超预期上行的潜力。（Atif Malik 的 MU 预览报告） 3. 半导体资本支出展望 对话始于了解为何相关股票最近的表现与存储芯片不一致，但结论是其驱动因素并不那么强劲。 WFE 预期已处于高位：2028 年的预测范围从 2800 亿美元（卖方）到 3000 亿美元（买方）不等，几乎没有上修空间。 亚洲调研显示，DRAM 厂房扩建规模小于预期，这可能限制 2027 年 WFE（晶圆厂设备）投入，这对 DRAM 制造商而言被视为利好。 该板块往往能提供稳定性，但可能会被用作 “资金来源”，去追逐弹性更大的存储芯片板块。 投资者更加关注个股层面的题材（UCTT、VECO、TER、ONTO）。 SEMICON West（10 月 12 日至 14 日）可能会带来一些积极的模型更新，并成为 AMAT 等公司的催化剂。（摘自 Atif Malik 的 Semicon 预览报告） 4. 模拟半导体展望 与两周前在我们的 TMT 会议上相比，投资者在圆桌会议上的态度要积极得多。 鉴于积极定价策略的影响在 2027 年将比 2026 年更为显著，这一上升势头仍有增长空间。 模拟芯片的渠道调研结果依然积极，价格和周期持续改善，同时出货周期仍然较长，我们尚未看到库存积压浪潮的出现。 在利率上升的环境下，模拟半导体公司的业绩（尤其是利润率）超出预期并上调指引至关重要。 投资者正在寻找具有 AI 题材、制造能力和利润率弹性的公司（如 IFX、ON、TXN），尽管有人担心 TXN 将维持高额资本支出。#文字观点", "publish_time": "2026-09-24 22:29", "tags": ["文字观点"]}, "attachment:files/中东专家路演：美伊博弈扩散下的中东局势展望20260923.pdf": {"id": "attachment:files/中东专家路演：美伊博弈扩散下的中东局势展望20260923.pdf", "kind": "attachment", "title": "中东专家路演：美伊博弈扩散下的中东局势展望20260923", "source_label": "其他", "excerpt": "中东专家路演：美伊博弈扩散下的中东局势展望20260923 要点总结 1.短期局势可控但长期无解，市场定价在风险溢价与实质断供间摇摆。总体判断中东短期内不会滑向 迅速全面失控，美伊均不愿承担全面战争的新增成本，特朗普面临强硬保面子与现实约束的两难", "content": "中东专家路演：美伊博弈扩散下的中东局势展望20260923 要点总结 1.短期局势可控但长期无解，市场定价在风险溢价与实质断供间摇摆。总体判断中东短期内不会滑向 迅速全面失控，美伊均不愿承担全面战争的新增成本，特朗普面临强硬保面子与现实约束的两难；市场 需严格区分由袭击事件驱动的短期恐慌溢价与反复受损导致的持续性供应损失，最终结果取决于实际出 口量与产量是否真正减少。 2.沙特东西管道遇袭属一次性冲击，也门战事走向是下一阶段核心变量。管道作为绕行霍尔木兹海峡 的最重要资产被切断，证明绕路方案受阻，但已部分修复且未出现新袭击则危机高峰已过；后续需紧盯 塔伊兹城易手情况及沙特是否被迫出动地面部队直接干涉，这决定了跨境打击能力与动力的演变。 3.美国拒绝大规模干预也门，受限于军事资源、胡塞避战策略及中期选举政治成本。特朗普政府明确 拒绝沙特出兵请求，内在逻辑包括美军深陷伊朗冲突无力再战、胡塞选择性避战提供不出兵理由，以及 中期选举前扩大冲突的政治成本过高，美国顶多提供情报与后勤支持。 4.美伊大概率维持“边打边谈”基准情景，互信缺失导致全面协议难产。双方诉求与关键排序无交 集，历史经验表明当前战争状态下达成JCPOA类协议极不现实；未来更可能通过阿曼、卡塔尔等第三 方传递条件，形成临时停火或航运安排的非正式默契，以“留一口活路”的方式维持现状。 5.特朗普地缘政策受选举需求、战争限度与盟友利益错位三重约束。选前追求“有限胜利”替代长期 协议，奉行“暗让不明让”原则；美国底线是绝对控制参战边界，希望盟友承担安全责任却不愿买单， 美沙关系呈现事实上的双向调整与利益优先级错位，沙特可能被迫进一步靠拢以色列或美国阵营。 6.当前油价已现脱敏迹象，市场韧性源于多重供给缓冲机制。国际石油市场较70年代更具韧性，美 国页岩油增产潜力、推动委内瑞拉出口、中国新能源替代及战略储备释放共同平抑了油价上行空间； “狼来了”效应显现，单次袭击引发的恐慌溢价将在修复后快速消退，大幅飙升概率低。 问答整理 Q1：霍尔木兹海峡虽处于封锁状态，但实际流出中东的原油量可达之前约60%，油价是否会 逐步对谈判新闻脱敏？美国是否有压降油价的手段（如委内瑞拉加大开采）？ 答：油价脱敏判断已被明确认可，当前国际石油市场整体状态与70年代石油危机时期已有明显不同。 本轮冲突中油价最高仅触及120多美元（不到130美元），远未创历史新高，上行空间有限。史诗级 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 市场的韧性来源在于供应链有效性大幅提升：一是美国页岩油具备加大开采能力；二是可推动委内瑞拉 等国加大出口；三是中国新能源发展大幅降低石油进口需求，且中国建立了全球最大规模石油战略储备 并在当前释放了一部分，共同平抑了油价上升力度。“狼来了”效应已出现，此前一艘船遇袭即是大 事，如今一周数艘遇袭市场已基本无反应；管道修复后若无新风险，相关影响也会迅速脱敏。 Q2：若特朗普中期选举失利，美元面临军事支出限制与“战争强制结束”约束，伊朗会否更 强硬、提高核谈要求，甚至刺激美国激化局面？ 答：伊朗在外交层面会进行“追击”。若美国因国会格局变化被迫减少中东投入，伊朗会提出更苛刻的 核谈条件，因其自认在本轮冲突中“赢了”，现有条件已相当苛刻。但伊朗不会主动直接升级局势或攻 击美国基地挑起新一轮战争，因直接交火中占不到便宜。更可能的路径是通过代理人（胡塞武装、黎巴 嫩真主党、伊拉克亲伊朗民兵）间接制造麻烦，同时在外交上释放强硬激进信号，但这些信号不会直接 转化为美伊直接交火。 Q3：特朗普号称会在中期选举后达成协议，对中东局势持续时长怎么判断？油价扰动是否可 能持续至特朗普任期结束？ 答：该言论主要是为中期选举造势，可靠性较低，当前局势连下月都难以看清，中期选举后达成协议基 本不具备实现基础。美伊紧张关系大概率将持续到特朗普任期结束，任期内不太可能出现彻底缓和。此 前达成全面协议光谈判就耗时约2年且当时互信远高于现在，目前双方在交火中互信极低，全面协议只 能留待下届政府。最好的情况仅是交火烈度下降；新增变量是胡塞—沙特问题在中期选举前基本搞不 完，特朗普任期内能调解好该问题已属不易。 Q4：伊朗提出的7个谈判条件提升了门槛，若美伊重回谈判，妥协交集可能出现在哪里？可 能对美伊双方有什么影响？ 答：伊朗7个条件（解冻所有资产、结束海上封锁、美国撤出中东、支付战争赔款等）几乎不可全盘接 受，对美国而言既无政治资本亦无战略利益。可执行层面大概率落在非正式安排而非公开协议：双方逐 步降级海峡区域冲突，伊朗降低袭击商船频率，美国对伊朗油轮制裁与拦截“睁一只眼闭一只眼”并偶 尔放行部分船只，形成事实上的“默契式降温”。由于伊朗革命卫队强硬派构成政治障碍，美方同样难 以公开签交易，妥协只能靠心照不宣的非正式安排落地。 原文 1.核心结论：短期不失控、长期无解，市场定价在脉冲式冲击与趋势性断供之间摇摆三个相互关联的 问题框架：①也门战事是否会进一步威胁沙特的石油设施与红海航运；②美伊已有接触（且一直有接 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 触）的后续走向；③临近2026年11月美国中期选举，特朗普如何在军事施压、控制能源价格与盟友 关系之间做选择；三个问题共同指向国际能源市场如何衡量中东地区风险。 总体判断一：中东局势短期不太可能滑向迅速全面失控：不会回到2026年3月美伊冲突（年初3月那 种情况）的水平，但亦缺少彻底解决的条件，不可能完全恢复到更早前的和平状态；也门战场会持续推 进，核心变量是沙特是否继续加大干涉。 总体判断二：美伊均不愿承担全面战争的新增成本：不可能停火，更不可能达成一揽子解决方案。美国 与伊朗的战略互信极低，伊朗认为自己\"赢了\"，对美提出条件十分苛刻；美国不可能接受等于承认战败 的条件，因此局部军事行动与强硬表态大概率继续。 总体判断三：特朗普面临“既要强硬保面子、又要面对高油价和战争成本现实约束”的两难：对中东不 希望增加直接投入，倾向于让地区盟友承担更多安全责任、自己只拿好处不担成本。 市场定价含义：本地区风险包含两种随行定价——单纯由谈判信号、袭击事件驱动的“风险溢价波动” （短期恐慌、几周内可修复）与“实际供应损失+运输延误”（多个环节反复受损才会出现）是两个不 同概念；最终结果需看实际出口量、产量是否真正减少。若管道等设施只是一次性遇袭、短期修复，则 危机最高峰基本已过。 2.红海与沙特：东西石油管道遇袭、也门双节点、美国拒绝大规模干预东西石油管道遇袭的定性—— 绕行霍尔木兹海峡的\"最重要的石油资产\"被切断基础设施逻辑：沙特主要油田产自东部波斯湾沿岸，在 霍尔木兹海峡通行受阻的状态下，大量石油通过东西石油管道从波斯湾沿岸运至红海沿岸延布港出口、 绕过海峡；这条管道是霍尔木兹受阻时沙特最重要的石油资产，没有比它更值钱的东西，其遇袭证明沙 特\"绕路方案被切断\"。其意义与一般输油管道遇袭完全不同。 对市场近期的核心事实与边际变化：袭击后，管道已部分修复、有限运行，运力尚未达到最高峰状态； 后续修复进度看泵站何时能彻底修好、延布港实际情况以及是否出现新的袭击。只要不发生新袭击，可 以认为这场危机最高峰已过去。 本次袭击的边际信息：来自伊拉克方向的什叶派民兵，非胡塞武装亲自所为多方向威胁成形：无人机发 射方向来自伊拉克的亲伊朗什叶派民兵，而非也门方向，说明沙特在也门战局上面临多方向、多平台的 打击风险——沙特若继续在也门加大投入，可能面临来自伊拉克方向的打击，伊朗甚至不需亲自动手。 “留有就回旋余地\"的博弈信号：袭击应系胡塞武装授意，但胡塞没有亲自做，表明双方还没有走到全 面战争、不留余地的地步。攻击对象进一步从管道扩大到炼油厂、储油设施、泵站、出口终端等，取决 于也门战事是否升级以及胡塞武装的意愿——其对关键石油基础设施 、伊拉克亲伊朗民兵）间接给 美国制造麻烦，同时在外交上释放强硬激进的信号，但信号不会直接转化为美伊直接交火。 Q3：特朗普号称会在中期选举后达成协议，对中东局势持续时长怎么判断？油价扰动是否可 能持续至特朗普任期结束？ 言论本身主要是为中期选举造的势，当前中东局势连下个月会怎样都难以看清，中期选举后达成协议的 说法基本不具备实现基础。 美伊紧张关系大概率持续到特朗普任期结束：此前为达成全面协议光谈判就谈了约2年，且当时军事互 信远好于现在；目前双方在交火中互信极低，全面协议\"下届政府再说\"，最好的情况只是交火烈度下 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 降；新增变量是胡塞—沙特问题在中期选举之前基本搞不完，特朗普任期能间把胡塞与沙特问题调解好 \"就不错了\"。 Q4：伊朗提出的7个谈判条件提升了门槛，若美伊重回谈判，妥协交集可能出现在哪里？ 7个条件几乎不可全盘接受：包括解冻伊朗所有资产、结束美国对伊朗的海上封锁、美国撤出中东、支 付战争赔款等，均不现实；让美国承认严重让步既无政治资本亦无战略利益。 可执行层面大概率落在非正式安排：逐步降级海峡区域冲突——伊朗降低袭击商船频率，美国对伊朗油 轮的制裁与拦截\"睁一只眼闭一只眼\"、偶尔放行部分油轮，形成事实上的\"默契式降温\"。伊朗也同样难 以公开签交易，其革命卫队中的强硬派是一大政治障碍，因此妥协只能靠心照不宣的非正式安排落地。 7.钉在交易上的\"抓手式\"陈述单事件解读——东西石油管道遇袭：这是绕行霍尔木兹海峡的替代出口 命脉首次遭直接打击，短期冲击已过（部分修复、有限但已重启），属于一次性风险溢价事件；持续定 价需警惕的是跨环节、反复打击的期权尾风险与从短期恐慌转为持续供应损失的确认信号。 上下游传导的路径差异：供给端（沙特管道、港口）与运输端（红海、霍尔木兹、苏伊士/绕非洲大陆 的路线迁移）对定价的影响不同——运输端的延滞是更可能出现的持续性冲击来源；库存与替代运输能 力对消化短期冲击的支撑作用更为关键。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-09-24T13-11:2312e3c861ba": {"id": "post:2026-09-24T13-11:2312e3c861ba", "kind": "post", "title": "2026-09-24 13:11", "source_label": "帖子正文", "excerpt": "# 高盛中国午间报告 GS CHINA MIDDAY｜2026-09-24 > > 信息仅供参考，不构成投资建议 ## 一、核心指数表现 - 上证综指：-0.93% - 科创 50：-1.53% - 上证 50：-1.14% - 创业板指：-1.84% - 沪深 300：-1.29% - 中证 50", "content": "# 高盛中国午间报告 GS CHINA MIDDAY｜2026-09-24 > > 信息仅供参考，不构成投资建议 ## 一、核心指数表现 - 上证综指：-0.93% - 科创 50：-1.53% - 上证 50：-1.14% - 创业板指：-1.84% - 沪深 300：-1.29% - 中证 500：-1.63% - 午间成交额：1.08 万亿元，环比昨日下降 7.69%；**预估全天成交额略高于 1.6 万亿** ## 二、盘面核心解读 1. 强弱对比：A 股弱于港股，上证指数回落至 3900 点关口附近。 2. 下跌主因：**长假前资金兑现离场**，市场普跌；技术面，上证跌破 10/20/60 日均线，进一步压制情绪。 3. 外部预期：中美贸易休战仅延长 2 个月，不及此前市场 3-6 个月的乐观预期，短期预期下修。 4. 板块分化： - 领跌：成长板块整体走弱，CCL 覆铜板、CRO、半导体领跌； - 仅有的上涨板块：银行、电力设备，资金明显转向防御属性资产。 ## 三、资金流向（FLOWS） - 整体交易：卖盘力度为买盘的 1.2 倍，整体偏卖出，名义成交规模不大。 - 交易方向：**买入公用事业、医疗保健；卖出 PCB、CPO**。 ## 四、简报小结 今日 A 股是典型**节前避险行情**，资金兑现成长股，切换到银行、电力这类防御板块；叠加中美贸 师：胡天贶 hutiankuang@csc.com.cn SAC 编号:S1440523070010 仅供内部参考，请勿外传 提纲 01.行业/个股复盘 02. 推荐及关注标的03.分板块跟踪及观点更新 仅供内部参考，请勿外传 核心观点： “金九”较弱央国企开启重组，商用车景气度持续稳健 3核心观点：根据乘联会数据 ，9月1-13日乘用车零售51.5万辆，同比下降23%，环比增长4%；全年累计零售同比下降 21%。“金九”成色 较弱，新能源零售渗透率突破 70%。本周广汽集团筹划重大资产重组 ，内需承压外需强劲的景气现状延续 ，受出口退税退坡等政策预期扰 动，板块持续震荡；商用车基本面维持稳健 ，重视低估值强业绩龙头标的阶段性回调配置机会；机器人重点关注特斯拉 9月加州工厂开启整 机量产以及V3潜在发布时点，智驾板块当前关注度仍在低位 ，核心压制因素在于 L3/L4的技术及商业化突破 。 推荐组合：潍柴动力、中国重汽、宇通客车、禾赛、吉利汽车、新泉股份、贝斯特、三花智控、上纬新材、零跑汽车。 仅供内部参考，请勿外传 “金九”较弱央国企开启重组，商用车景气度持续稳健 根据乘联会数据，9月1-13日乘用车零售51.5万辆，同比下降23%，环比增长4%；全年累计零售同比下降 21%。“金九”成色较弱，新能源零售渗透率突破 70%。 本周广汽集团筹划重大资产重组 ，内需承压外需强劲的景气现状延续 ，受出口退税退坡等政策预期扰动 ，板块持续震荡；商用车基本面维持稳健 ，重视低估值强 业绩龙头标的阶段性回调配置机会；机器人重点关注特斯拉 9月加州工厂开启整机量产以及 V3潜在发布时点，智驾板块当前关注度仍在低位 ，核心压制因素在于 L3/L4的技术及商业化突破 。 乘用车：乘联会数据显示9月1-13日乘用车批发55万辆，同比-22%,环比+22%；全年累计批发同比下降 6%。9月1-13日乘用车零售51.5万辆，同比下降23%， 环比增长4%；全年累计零售同比下降 21%。“金九”成色较弱，新能源零售渗透率突破 70%。本周广汽集团筹划重大资产重组 ，拟收购一汽旗下合资整车股权 ，一 汽股份将成为广汽第二大股东 ，这是“十五五”规划写入“产能调控”后的首个国有车企兼并重组 。此外，赛力斯和华为调整问界合作模式 ，产品定义、营销、销售、 服务改由赛力斯主导 ，华为转为技术赋能 ，鸿蒙智行其余四界不变 。今年以来内需景气承压现状延续 ，出口仍是最强结构性 α，当前内需悲观预期已充分定价 ，短 期压制在于出口退税退坡 、消费税加征等政策预期变化 ，建议积极把握中长期周期底部配置买点 。 缺电&商用车：缺电方面重点推荐潍柴动力 ，本周潍柴北美大客户 GNRC官宣Amazon数据中心柴发机组订单落地 ，金额大幅超预期，潍柴作为核心供应商将 持续受益。此前管理层已全面上修 26年AIDC柴发出货目标（4000+台）及27年柴发（6000台）、气发（2000+台）出货指引，看好后续估值修复与中期戴维斯双 击。重卡方面，Q3行业出口维持高景气 ，非洲、东南亚等低风险区域的需求能见度可延伸至 27年，龙头重汽A/H股价对应26年PE仅10-11X，股息率6%左右，看 好未来3-6个月投资赔率，建议重视当前低估值左侧布局机会 。客车方面，受外部不确定性影响 ，龙头估值暂时承压 ，其中宇通Q3出口、业绩预计稳健向上 ，全年 55亿高分红有望兑现 ，股价对应26年预期PE约10X，股息率9-10%，低估值高股息特征突出 。 物理AI：1）本周板块企稳回升 ，特斯拉机器人动态更新带来板块情绪的修复 。我们认为当前市场来到了对于 optimus量产置信度逐步提升的阶段 ，量产节奏 的兑现或催生新一轮产业趋势拐点 。国产机器人方面，随着宇树科技逐步向合理估值贴近 ，后续智元/银河通用/众擎/灵心巧手/普渡等今年或也有资本化进度更新； 同时量产及场景验证同步加快 ，9月下旬上纬新材/七腾机器人相继召开产品发布会 ，有望提升国产本体的市场关注度 。投资策略我们强调 ——长期布局、逢低配置。 2）智驾板块当前关注度仍在低位 ，特斯拉Cybercab已在美国奥斯汀投入运行 ，产能规模超12.5万辆；小马智行在 IAA发布与广汽商用车联合开发的第四代 L4无 人重卡，Q4量产、首批投放欧洲和中东 。预计随着中期L3/L4的技术及商业化突破 ，估值有望迎来上修 。 推荐组合：潍柴动力 、中国重汽、宇通客车、禾赛、吉利汽车、新泉股份、贝斯特、三花智控、上纬新材、零跑汽车。 4 仅供内部参考，请勿外传 仅供内部参考，请勿外传 本周：行业指数小幅上涨 ，商用车板块显著调整 2026年9月14日-9月18日，SW汽车行业+0.11%；子板块中 ，乘用车、汽车零部件 、商用 blish_time": "2026-09-24 12:33", "tags": ["文字观点"]}, "post:2026-09-24T23-24:85d114f959d2": {"id": "post:2026-09-24T23-24:85d114f959d2", "kind": "post", "title": "2026-09-24 23:24", "source_label": "帖子正文", "excerpt": "碳化硅材料专题会议 会议要点 1. 行业发展阶段与核心结论 •碳化硅行业当前正处在成长曲线斜率最陡峭的中段，正在从性能替代迈向规模放量，核心结论包括四点： –碳化硅产业的竞争本质上是成本曲线与良率曲线的竞争，大尺寸化和规模化是当前最确定的产业趋势。–新能源车现在仍是第一大下游，但AI相关新兴应用增速", "content": "碳化硅材料专题会议 会议要点 1. 行业发展阶段与核心结论 •碳化硅行业当前正处在成长曲线斜率最陡峭的中段，正在从性能替代迈向规模放量，核心结论包括四点： –碳化硅产业的竞争本质上是成本曲线与良率曲线的竞争，大尺寸化和规模化是当前最确定的产业趋势。 –新能源车现在仍是第一大下游，但AI相关新兴应用增速更快、弹性更大，需求结构正走向多点开花。 –全球竞争格局已经从海外龙头主导演变为多极竞逐、中国崛起，中国衬底厂商在6英寸规模化以及8英寸的切换当中，已经跻身第一梯队。 –行业目前正经历第一轮出清，具备技术纵深、成本控制、高质量量产能力的企业将穿越周期，分享长期红利。 •行业发展阶段：2026年开始到2030年处于从1到10的规模放量、渗透率快速提升的阶段，属于初步成长期到中段快速放量期的关键节点。 2. 材料特性与分类 •碳化硅是产业化程度最高的第三代半导体核心材料，禁带宽度是硅的3倍，临界击穿场强是硅的10倍，热导率是硅的3倍，具备电能转换损耗更低、器件体积更小、散热需求更少、系统功率密度更高的优势，在高压、高频、高温场景中逐步替代硅基器件，低压、低频且对成本更敏感的场景仍以硅基为主，二者形成互补关系。 •碳化硅衬底分为两类： –导电型衬底：主要用于制造二极管、MOSFET等功率器件，下游以新能源车、光伏、储能为主。 –半绝缘型衬底：主要用于制造对电子迁移率要求较高的射频器件，下游以5G/6G基站、雷达为主。 •两类衬底层技术基本一致，仅后端外延工艺存在差异，多数厂商布局双路线。 3. 产业链壁垒 •碳化硅产业链为衬底→外延→器件→终端应用，衬底是整个产业链价值与技术的制高点，占器件成本的约50%，是决定器件成本曲线的核心变量。 •衬底制备包含原料合成、晶体生长、晶锭加工、切割、研磨、抛光、检测清洗七大环节，其中晶体生长是核心难点，原料合成也具备较高难度，后段工艺与硅材料工艺相似度较高。 •衬底制备共有五大核心难点，构筑深厚行业护城河： –生长过程中缺陷控制难度大。 –粉料合成难度高，杂质控制直接影响晶体纯度和电学性能。 –碳化硅属于高硬度脆性材料，后段切割、研磨、抛光过程中易出现崩裂，加工难度大。 –扩径难度大，尺寸提升需要更均匀的温度分布和更复杂的热应力管理，尺寸越大生产良率越低。 –产品一致性控制难度高，属于半导体材料通用难点。 •衬底厂商存在两种经营模式，长期并存：欧美厂商更倾向IDM全产业链布局（衬底-外延-器件），中国厂商目前以专业分工、仅做衬底的模式为主。 4. 降本主线 •大尺寸化是衬底降本的核心路径：当前6英寸是主流，8英寸正在快速起量，12英寸已处于研发阶段，尺寸越大单位可切割芯片数量越多、成本越低。 •大尺寸化具备先发壁垒，下游验证周期需要6-12个月，率先突破大尺寸技术的厂商具备显著先发优势。 •行业规模预测：预计到2030年8英寸衬底出货占比将达到35%，衬底价格将随出货量上升持续下行，进入“降本-渗透-放量-再降本”的正向循环。 •跟踪指标：一级市场重点考察企业8英寸良率、车规级客户认证进度；二级市场重点跟踪8英寸出货占比、单位成本下降斜率。 5. 整体市场规模 •全球碳化硅功率器件市场处于替代硅基等传统半导体材料的黄金窗口期： –2020年市场规模为6.4亿美元，2024年达到32亿美元，2020-2024年复合增长率超过40%。 –预计2030年市场规模接近200亿美元，2024-2030年复合增长率约35%。 •渗透率情况： –2020年碳化硅功率器件整体渗透率为1.4%，2024年提升至6.5%，预计2030年达到22.6%，已跨过商业化临界点。 6. 传统下游需求 •新能源车：当前第一大下游，2024年碳化硅在该领域渗透率不到20%，预计2030年将超过50%，对应市场规模约150亿美元，2024-2030年复合增长率约36%。增长驱动力来自800V高压平台从旗舰车型向中高端车型渗透，以及碳化硅成本下降，碳化硅可在电机驱动、DCDC转换器、OBC环节显著降低能耗。 •光伏储能：碳化硅基逆变器可将转换效率提升1%-3%，同时减少器件体积和重量，对光伏电站收益提升明显。2024年碳化硅器件在光伏储能领域渗透率不足10%，预计2030年达到20%。 •电网：2024年碳化硅渗透率不足5%，预计2030年达到14.6%，同时轨道交通、家用电器领域也在快速渗透。 7. 新兴下游（第二成长曲线） •AI应用是碳化硅行业第二成长曲线，需求增速快于传统下游，毛利率高于标准衬底，需求与全球AI资本开支深度绑定，且对衬底规格要求与传统功率市场存在差异，可消化半导体级之外的产能，不冲击主力产品价格体系，提升行业整体产能利用率。 •AI领域需求主要来自两个路径： –AI数据中心基础设施：AI算力扩张带来电力供给挑战，预计2025-2030年数据中心新增容量接近100GW，2030年全球数据中心总容量可达200GW，年复合增长率14%，2030年全球数据中心年耗电量将占全球电力需求的3%，碳化硅功率器件凭借高转换效率、低散热需求的优势成为供电系统高密度化的刚需。 –AI终端创新：AR眼镜等新型智能终端对光学、声学材料有全新要求，碳化硅高折射率、高声学性能的物理属性适配相关需求，目前增速较高但市场体量较小。 8. 全球格局 •2024年全球碳化硅衬底市场前五大厂商市占率合计68%，呈现多极竞逐态势：Wolfspeed（原科锐）占23.5%，中国厂商天岳先进占16.7%、天科合达占11.3%，美国其他厂商合计占10%左右，韩国SK占6%。 •海外龙头案例：Wolfspeed1987年成立，1991年推出全球首片商用碳化硅衬底，因扩张过于激进，在2023-2024年行业下行期出现经营不善，2025年6月申请破产调整，提示在资本密集、周期波动的新兴产业中，技术领先不必然等于财务安全，产能扩张节奏需与行业需求曲线匹配。 •其他海外厂商：Coherent、SK通过并购卡位赛道，Coherent通过持续并购成为光电元件供应商；SK集团2017年收购LG旗下子公司，2020年收购杜邦碳化硅晶圆业务，随后在美国扩产，是行业重要竞争者。 9. 中国厂商竞争情况 •中国核心衬底厂商为天岳先进和天科合达： –天岳先进已上市，仅专注衬底业务，与全球前十大功率器件制造商中超过半数建立合作，6英寸已实现大规模量产，8英寸产能在建，12英寸已研发成功，在全球衬底赛道处于第一梯队位置。 –天科合达依托中科院物理研究所，研发实力较强，产业化进度略落后于天岳先进，目前正在推进上市进程。 •中国厂商具备三大体系化竞争优势：成本优势、市场优势（中国是全球最大的新能源车、光伏、储能生产和消费国）、迭代优势（研发端快速追赶海外水平）。 •当前中国厂商凭借成本和产能优势持续抢占份额，欧美日韩厂商仍在部分高端市场占据主导。 10. 投资主线 •行业未来发展围绕三条主线：大尺寸化降本、降本渗透、新场景拓展。 •核心跟踪指标： –大尺寸进展：跟踪8英寸良率提升和出货占比，是形成成本代差的核心。 –降本渗透：跟踪衬底价格下行节奏、头部厂商盈利韧性，是企业穿越周期的核心指标。 –新场景拓展：重点跟踪AI相关需求落地，是核心的边际增量来源。 •穿越周期的企业核心特征：具备技术纵深、较强成本控制能力、高质量量产能力，同时绑定下游优质客户。 •不同市场投资关注要点： –一级市场：关注团队在长晶热场、粉料合成、缺陷控制等核心技术环节的积累，以及车规级客户认证进度。 –二级市场：重点跟踪8英寸出货占比、单位成本下降斜率、AI等新兴下游应用落地情况、功率器件客户端订单落地情况。 11. 风险提示 •下游需求不及预期：新能源车是最大下游，若新能源车销量持续放缓、光伏储能装机不及预期，将影响行业出货量增长。 •技术进步不及预期：若8英寸衬底产业化进度慢于预期，将影响行业降本和渗透节奏。 •行业竞争加剧。 •国际贸易、地缘政治风险影响供应链安全。 •新兴应用产业化不及预期：若AI产业发展不及预期，将影响碳化硅渗透率提升。#文字观点", "publish_time": "2026-09-24 23:24", "tags": ["文字观点"]}, "post:2026-09-24T08-43:462151f6f7e2": {"id": "post:2026-09-24T08-43:462151f6f7e2", "kind": "post", "title": "2026-09-24 08:43", "source_label": "帖子正文", "excerpt": "吉利AI智充发布、潍柴旗下SOFC公司交流、北美卡车自动驾驶公司交流 -20260924#吉利AI智充发布吉利发布AI智充平台及PowerMind全域能源大模型，充电速率覆盖到12C，功率覆盖到2.2MW。吉利确立了2027年建成2.2万座站、10万把枪目标", "content": "吉利AI智充发布、潍柴旗下SOFC公司交流、北美卡车自动驾驶公司交流 -20260924#吉利AI智充发布吉利发布AI智充平台及PowerMind全域能源大模型，充电速率覆盖到12C，功率覆盖到2.2MW。吉利确立了2027年建成2.2万座站、10万把枪目标；依托全液冷自研技术将单枪成本，通过12C/6C产品组合兼顾体验与效率，以开放合作模式加速网络覆盖，并布局7KW/20KW/MW级别自动充电机器人构建能源互联网生态。#潍柴旗下SOFC公司CeresSOFC用于数据中心供电的优势：交付速度、适配800VDC、效率正在被越来越多的下游认可。潍柴在几个合作方中发展速度最快，预计2027年底之前形成200MW产能。Ceres维持SOFC行业2030年22GW新增装机的判断。此外，SOEC制氢系统远期将有38GW年化增量市场，其中中国、印度会有较多需求#北美卡车自动驾驶公司Aurora无人驾驶重卡用于北美开放道路货运，相比传统重卡单公里成本有望降低20%；考虑到利用率提升，单车收入有望翻倍。公司依托AI技术在无人驾驶取得快速突破，目前有20+无人驾驶重卡在北美开放道路运行，预计到2026年底突破200台，2027年底达到1000台，2030年底达到30000台 欢迎交流PPT、详细交流信息！#文字观点", "publish_time": "2026-09-24 08:43", "tags": ["吉利AI智充发布", "潍柴旗下SOFC公司Ceres", "北美卡车自动驾驶公司Aurora", "文字观点"]}, "post:2026-09-24T11-01:dbd7b1fd441f": {"id": "post:2026-09-24T11-01:dbd7b1fd441f", "kind": "post", "title": "2026-09-24 11:01", "source_label": "帖子正文", "excerpt": "重视SiC，台股嘉晶继续涨停，已经三连板，传大陆产能不足，外溢到中国台湾地区。天岳先进：碳化硅衬底龙头，行业拐点确认，基本面由弱转强，预期差逐步显现 【核心结论】SiC行业走出底部，由新能源车单一驱动转向汽车+AI算力+光储工控多场景共振复苏。", "content": "重视SiC，台股嘉晶继续涨停，已经三连板，传大陆产能不足，外溢到中国台湾地区。 天岳先进：碳化硅衬底龙头，行业拐点确认，基本面由弱转强，预期差逐步显现 【核心结论】SiC行业走出底部，由新能源车单一驱动转向汽车+AI算力+光储工控多场景共振复苏。天岳先进作为全球8英寸碳化硅衬底龙头，充分受益行业量价修复，产品、客户与盈利能力同步改善，前期悲观估值已充分消化，基本面持续向上，预期差显著。 碳化硅行业基本面 供给端：前两年价格战完成产能出清，海外大厂扩产与良率提升存在瓶颈，有效产能刚性。车规认证周期长、壁垒高，新玩家难以快速进入，产能向头部集中，行业进入卖方市场，6英寸价格企稳，8英寸价格坚挺，急单小幅涨价。 需求端：新能源车800V高压平台持续渗透，构成行业基本盘；AI服务器高压电源是核心增量，拉动SiC渗透率上行，叠加储能、工控需求复苏，行业摆脱单一赛道依赖。中长期12英寸碳化硅，将在先进封装、散热中介层、AR终端打开新赛道。 周期端：行业进入量稳价升、结构优化的复苏阶段，衬底环节率先兑现毛利修复红利。 公司基本面：全球龙头壁垒稳固，拐点明确、弹性充足 公司8英寸导电型碳化硅衬底全球市占率第一，国内少数实现6/8/12英寸全尺寸覆盖的衬底龙头，成长确定性突出。 1、产能订单饱满：公司维持满产满销，订单储备充足，承接新能源车、AI算力电源增量，产能利用率保持高位。 2、产品结构升级：2026上半年高毛利8英寸产品收入占比突破50%，完成关键结构切换。8英寸附加值显著高于6英寸，叠加良率爬坡与工艺迭代，盈利能力持续提升。 3、盈利拐点落地：Q2毛利率环比+6.2pct至25.4%，主业修复趋势清晰。上半年账面利润受1.18亿一次性汇兑损失扰动，剔除后主业盈利健康。Rubin平台放量带动英飞凌等一线客户订单落地，订单能见度高，业绩具备超预期潜力。 4、短期弹性+长期空间：短期依托8英寸龙头地位，充分享受本轮行业复苏，兑现1-2年业绩上行；中长期12英寸完成技术攻关，已向头部客户送样，切入先进封装散热、AI终端等前沿场景。 预期差 股价已充分反映市场此前对AI电源、先进封装的悲观预期，估值压制充分。当前行业上行周期、公司产品结构质变、海外大客户订单落地三重逻辑共振，基本面持续验证，估值与基本面存在错配，向上修复空间充足。#文字观点", "publish_time": "2026-09-24 11:01", "tags": ["文字观点"]}, "post:2026-09-24T17-06:668b2b3fffbf": {"id": "post:2026-09-24T17-06:668b2b3fffbf", "kind": "post", "title": "2026-09-24 17:06", "source_label": "帖子正文", "excerpt": "关注端侧芯片与CPU机会 🔥事件：Meta于9月8日正式发布首款个人AI智能体Muse，上线一周即登顶美国App Store免费应用榜，Meta股价单日飙涨逾11%。", "content": "【兴证电子】Muse引爆Agent时代，建议关注端侧芯片与CPU机会 🔥事件：Meta于9月8日正式发布首款个人AI智能体Muse，上线一周即登顶美国App Store免费应用榜，Meta股价单日飙涨逾11%。 DAU高粘性应证Muse为用户高频高需工具，而非尝鲜式脉冲。Muse上线第12天美国移动端DAU 64.2万 vs ChatGPT同期23.1万，且DAU增速显著快于下载增速。Muse标志着C端Agent从“对话”向“交付”的范式跃迁。 Muse由Muse Spark模型驱动，可全天候代替用户执行跨应用任务——发送邮件、预订出行、填写表单、商品比价等，用户关闭应用后仍持续运行。 Meta为每个Muse用户配置持久化云端虚拟机(无头浏览器+高频API调用+多步骤任务编排)，单次行程比价最多发起146次网页搜索、批量处理积压邮件、自动电话谈判。这部分负载不消耗 GPU推理，而是大量消耗服务器CPU算力。此外，9月23-24日Meta Connect大会召开在即，#预计Muse与AI眼镜的整合方案将成为焦点。Meta在自有AI眼镜上深耕多年，AI眼镜有望成为Agent触达用户的最自然端侧入口，实现“用户触达→生活场景落地”的完整闭环。 📈Meta AI眼镜建议关注： 端侧：龙迅股份，恒玄科技，炬芯科技，蓝特光学，水晶光电，瑞芯微 整机：歌尔股份，立讯精密 CPU及周边：澜起科技，万通发展，聚辰股份 存储：佰维存储#文字观点", "publish_time": "2026-09-24 17:06", "tags": ["文字观点"]}, "post:2026-09-24T13-53:b8224025222a": {"id": "post:2026-09-24T13-53:b8224025222a", "kind": "post", "title": "2026-09-24 13:53", "source_label": "帖子正文", "excerpt": "东山精密 0924 Meta 是行业内最强的增量客户。", "content": "东山精密 0924 Meta 是行业内最强的增量客户。行业普遍判断，Meta2026 年 800G 光模块需求为千万级别。 此前市场流传的 380 万 - 460 万只的预估量，专家认为这个数值明显偏低，和产业共识不匹配。 供应链订单格局正在快速变化：2026 上半年 800G 订单以中际旭创为主，下半年订单逐步转向索尔思（东山精密）。 按照专家给出的最新排名，索尔思当前已经位居第一，原龙头降至第二，菲尼萨与另一家厂商分列三、四位。 但需要说明，我个人并不完全认同该专家观点，目前缺少官方信息、多方产业信息交叉验证来证实这套竞争格局。#文字观点", "publish_time": "2026-09-24 13:53", "tags": ["文字观点"]}, "post:2026-09-24T08-37:4daef173fa69": {"id": "post:2026-09-24T08-37:4daef173fa69", "kind": "post", "title": "2026-09-24 08:37", "source_label": "帖子正文", "excerpt": "⚡博通遭调查：从AI交换芯片到高端射频，国产替代再迎催化 🔥 据《金融时报》报道，中国有关部门正在审查国资背景数据中心对博通（Broadcom）交换设备/芯片的使用情况，核心指向A", "content": "⚡博通遭调查：从AI交换芯片到高端射频，国产替代再迎催化 🔥 据《金融时报》报道，中国有关部门正在审查国资背景数据中心对博通（Broadcom）交换设备/芯片的使用情况，核心指向AI基础设施供应链自主化。当前调查直接涉及数据中心交换领域，并非射频业务，但博通横跨AI交换芯片+高端射频两大关键赛道，事件对国产半导体自主可控具有较强映射意义。 📡 博通同样是全球射频巨头。 若按整个RF前端模组市场统计，第三方机构估算博通2025年份额约9.9%；但在技术壁垒最高的BAW高端滤波器领域，TechInsights估算博通全球份额高达约87%，尤其深度进入高端手机射频供应链。也就是说，真正高度集中的并非全部“射频芯片”，而是BAW/FBAR等高端滤波器。 🚀 产业链映射： 盛科通信：最直接对应博通AI交换芯片国产替代，公司交换芯片覆盖最高25.6T交换容量、800G端口，面向大型数据中心和云计算市场。 卓胜微：国产RF平台型厂商，持续向SAW/高端滤波器、PA、Switch、LNA及L-PAMiD全集成模组升级，高端滤波器国产化是其核心增量方向。 慧智微：重点布局PA+高集成射频模组，向L-PAMiF、L-PAMiD等高价值产品升级，受益于国产手机射频前端份额提升。 ⚡ 核心逻辑：博通此次被审查的起点在AI交换芯片，但其同时掌握全球高端BAW滤波器核心份额。若国产自主化从AI交换芯片继续向高端RF延伸，产业链有望形成“盛科通信—交换ASIC国产化，卓胜微/慧智微—高端射频国产化”的双主线。#文字观点", "publish_time": "2026-09-24 08:37", "tags": ["文字观点"]}, "post:2026-09-24T14-55:94acba0cd99d": {"id": "post:2026-09-24T14-55:94acba0cd99d", "kind": "post", "title": "2026-09-24 14:55", "source_label": "帖子正文", "excerpt": "各位领导好，我们之前聊的欧洲载板和PCB公司奥特斯（AT&S）大涨10%，接近前高，就是他说载板景气度看到2030年 9月22日，AT&S公告与Marvell扩大长期合作，增加面向", "content": "各位领导好，我们之前聊的欧洲载板和PCB公司奥特斯（AT&S）大涨10%，接近前高，就是他说载板景气度看到2030年 9月22日，AT&S公告与Marvell扩大长期合作，增加面向下一代AI和云基础设施的先进IC载板产能。更重要的是，AT&S确认：Marvell就是此前一直没有公布名字的“另一家领先科技公司”。此前市场只知道居林扩产由AMD+神秘客户支持，现在神秘客户揭晓为Marvell。这说明，AI带来的ABF需求已经从“英特尔/AMD CPU载板升级”，进一步扩散到Marvell这种AI ASIC和数据中心网络芯片。这意味着未来载板增量不只是GPU。 生益科技、兴森科技、深南电路、华正新材、宏昌电子、艾森股份#文字观点", "publish_time": "2026-09-24 14:55", "tags": ["文字观点"]}, "post:2026-09-24T10-43:b248e07d6a94": {"id": "post:2026-09-24T10-43:b248e07d6a94", "kind": "post", "title": "2026-09-24 10:43", "source_label": "帖子正文", "excerpt": "转：弘信电子超薄微型FPC进入Meta AI眼镜供应链，产品验证顺利。", "content": "转：弘信电子超薄微型FPC进入Meta AI眼镜供应链，产品验证顺利。#市场段子#文字观点", "publish_time": "2026-09-24 10:43", "tags": ["市场段子", "文字观点"]}, "post:2026-09-24T09-20:098c261f1472": {"id": "post:2026-09-24T09-20:098c261f1472", "kind": "post", "title": "2026-09-24 09:20", "source_label": "帖子正文", "excerpt": "关注#宏景科技【1】已交付/待交付B300集群，#提价20%，2027年利润有望增厚15亿+", "content": "建议关注#宏景科技【1】已交付/待交付B300集群，#提价20%，2027年利润有望增厚15亿+； 【2】与ZP探索Token分成模式/海外业务进展顺利。 ---------------------#海外方面：高端卡持续涨价【1】B200 +21.4%、H200 +9.5%、H100 SXM +0.7%、A100 SXM4 +2.0%、RTX 5090 +1.6%（ornn，截至9.23） 【2】Nebius宣布10月1日起上调按需GPU价格：H100 +17%、H200 +20%、B200 +1 数量指数级增长，10年内至少10亿台、15年后可能100亿台、20年后可能1000亿台；网传特斯拉Optimus V3设计图，Gen3采用碳纤维复合材料四肢骨架，重量减轻33%。吉利发布AI智充，单枪峰值2.2MW，10%-70%充电平均4分30秒，10-97% 8分40秒；建设目标表述存在差异，一处为27年底1.5万座/5万把，另一处为2027年2.2万座/10万把。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线：AI算力/大模型\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑：\u003c/strong> 超大规模云市场从传统云基础设施的“镐与铲”角色，进化为支撑传统云与生成式AI浪潮的双重底座，尽管业务本质仍以CPU驱动为主。甲骨文完成200亿美元股权融资，预计FY27末前可落实当前需求所需的大部分融资，OpenAI相关情绪持续改善，OCI执行力度强劲；微软在Azure上押下重注，自2019年起加码AI投资，构建AI数据中心并自研芯片；公司围绕Agent负载推出AgentCore、Agentic OS等。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证：\u003c/strong> 阿里云栖大会点评显示，全栈AI迭代战略进一步强化，20GW锚定中长期增长中枢，模型、芯片与云相互耦合、联合优化，到2032年阿里云运营的全球数据中心规模超过20GW；Qwen团队在递归式自我改进RSI方面取得进展，未来模型将扩展至5-10T参数规模；平头哥发布最强国产AI芯片真武V900，算力提升至真武M890的3倍。开源电子观点称，Agent时代强化CPU通胀逻辑，Muse上线两周登顶苹果免费榜，带动META、英特尔及AMD周一开盘大涨10%+，CPU正从算力配角转为系统调度核心。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：半导体/先进封装\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑：\u003c/strong> AI硬件/半导体交易情绪依然充满挫败感，大多数投资者有购买意向或倾向于看好，但很少有人实质性地增加权重或重新增加总敞口；许多人认为，在DRAM情绪彻底好转之前，WFE和HDD相关个股很难有出色表现。存储调研均值显示，26财年第四季度营收528.7亿美元，毛利率87.0%，每股收益33.27美元，DRAM均价环比上涨21%，NAND均价环比上涨20%；激光诱导湿法刻蚀LIDE为TGV主流工艺路线。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证：\u003c/strong> 碳化硅材料专题会议指出，碳化硅产业正处于从性能替代迈向规模放量的快速成长中段，竞争本质是成本与良率曲线的比拼，大尺寸化、降本渗透与新场景拓展为未来三大确定性主线；全球碳化硅功率器件市场预计2030年接近200亿美元，渗透率将突破20%。锡供需方面，2026年全球锡矿实际增量大概率仅1万吨左右，显著低于年初预期2万吨，缅甸复产节奏成核心变量。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：宏观/策略\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑：\u003c/strong> 美债收益率飙升冲高，全球市场承压；2年期美债收益率报4.90%，创两年多新高，10年期美债收益率再度突破5.10%，刷新2007年后新高；标普500下跌75个基点至7706点，纳指下跌85个基点至30470点。四季度市场仍处于高度结构化状态，配置空间收窄，建议前期保持谨慎“苟着”；中美关系与美国中期选举两大变量预计不会走坏，10月中旬后市场将趋于清晰。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证：\u003c/strong> A股与港股复盘显示，美债收益率创数十年新高，10月加息定价骤升，压制全球风险资产；中国主要指数承压，上证综指-0.93%、科创50 -1.53%、上证50 -1.14%、创业板指-1.84%、沪深300 -1.29%。9月24日晨报覆盖中国AI产业链扩大覆盖，首选阿里、腾讯和智谱；迅策、金山办公、商汤等获增持评级。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：PCB/CCL/铜箔/材料\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑：\u003c/strong> PCB、覆铜板与载板专家电话会探讨共封装光学CPO对PCB/覆铜板的影响，以及聚四氟乙烯PTFE的潜在应用前景；树脂或将成为覆铜板的下一个差异化赛道；因此M7或更高等级覆铜板预计仍会被采用。超快激光具有冷加工效果，适合精密硬脆材料加工，在HDI/IC载板/msap精细线路（50μm以下小孔）、陶瓷&amp;M9/10&amp;ABF/BT材料迭代中，拉动超快激光钻孔技术对CO2替代。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证：\u003c/strong> 电子布调研显示，英伟达Blackwell系列中Computer Tray和Switch Tray采用了M8等级材料，对应第二代LowDK电子布。德福专家调研更新强调，重视锂电铜箔价提升和PCB铜箔量提升带来的戴维斯双击机会。东威科技mSAP三合一闪镀排期紧，头部复购且二三线加紧补产能，海外安美特电镀交期非常久，mSAP良率想做到80%以上闪镀要求很高。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：液冷/电源/算电协同\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑：\u003c/strong> 算电协同催化渐显，9月国常会明确推动算电协同，加快绿电直连和源网荷储项目落地；9月15日英伟达展示AI工厂灵活负载及电力优化实践成果。中美供电目标趋同，资源与产业优势塑造不同路径；高密度AI机柜共同推动800V直流、液冷和储能备用升级，制造优势仍需客户认证与批量交付验证。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证：\u003c/strong> 碳化硅材料专题会议指出，AI数据中心基础设施带来电力供给挑战，预计2025-2030年数据中心新增容量接近100GW，2030年全球数据中心总容量可达200GW，年复合增长率14%，2030年全球数据中心年耗电量将占全球电力需求的3%；碳化硅功率器件整体渗透率2020年为1.4%。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>主线：机器人/自动化\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑：\u003c/strong> 马斯克接受专访时指出，未来15年全球人形机器人或达到100亿台；马斯克在央视财经专访中预测，人形机器人数量将呈指数级增长：10年内至少达到10亿台，15年后可能达100亿台，20年后可能达到1000亿台。国际机器人联合会指出，中国工业机器人市场从目前到2029年有望保持年均5%至10%的增长率。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证：\u003c/strong> 网传特斯拉Optimus V3设计图，Gen3线条更流畅，机械感大幅减少，前臂明显变粗，执行器挪到前臂，模仿人类肌腱，一双手第一次有了人手的样子；特斯拉Optimus Gen3机器人升级为碳纤维骨架，重量减轻33%，四肢骨架从铝合金构件替换为碳纤维空心管材。敏芯股份被描述为物理AI感知层的MEMS。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>宏观与市场：美债收益率飙升冲高，10月加息定价骤升，压制全球风险资产；标普500、纳指下跌，中国主要指数同步承压。\u003c/li>\n\u003cli>AI算力/云：阿里云栖大会提出全栈AI迭代战略强化，首次明确到2032年阿里云运营全球数据中心规模超过20GW；Qwen团队在RSI取得进展，未来模型将扩展至5-10T参数；平头哥发布真武V900，算力提升至真武M890的3倍。9月24日晨报覆盖中国AI产业链扩大覆盖，首选阿里、腾讯和智谱；迅策、金山办公、商汤等获增持评级。\u003c/li>\n\u003cli>半导体/存储：伦敦路演显示AI硬件/半导体交易情绪挫败，多数投资者有购买意向但少实质加仓；存储调研均值显示26财年第四季度营收528.7亿美元、毛利率87.0%、EPS33.27美元，DRAM均价环比+21%、NAND均价环比+20%。碳化硅材料专题会议、锡供需及下游生态、巴斯夫爆炸与锦华新材电子级羟胺国产替代逻辑、博通遭调查与国产替代催化、半导体设备板块投资机会等被重点讨论。\u003c/li>\n\u003cli>光通信：800G/1.6T DSP供需动态、2027年SiGe硅锗产能全售罄、12寸硅锗成AI光通讯紧缺产能、ECOC参会纪要显示NPO/CPO量产推迟至2028年等变化被提及。\u003c/li>\n\u003cli>PCB/材料：PCB、覆铜板与载板专家电话会探讨CPO对PCB/覆铜板影响及PTFE潜在应用前景；电子布调研显示英伟达Blackwell系列采用M8等级材料；德福专家调研更新强调锂电铜箔价提升和PCB铜箔量提升的戴维斯双击机会；东威科技mSAP三合一闪镀排期紧。国瓷材料、苏州天脉、裕同科技、四方达、杰瑞股份、富乐德、宁德时代回购、小商品城回调、荣盛石化、钽价上涨、VNA行业变化、Meta眼镜等亦有更新。\u003c/li>\n\u003cli>汽车/机器人：汽车行业主要公司2026Q3前瞻发布，比亚迪26Q3归母净利润预测110亿、同比+41%、环比+33%，上汽集团26Q3归母净利润预测25亿、同比+20%、环比+18%；吉利发布AI智充，单枪峰值2.2MW，10%-70%充电平均4分30秒，10-97% 8分40秒；特斯拉Optimus Gen3设计图与碳纤维骨架减重33%被讨论。\u003c/li>\n\u003cli>医药/其他：医保集采政策专家交流会指出，反腐定性升级与常态化监管，2026年起行贿受贿入刑门槛降至3万，六部门独立办案并就地追责，AI大数据与金税四期实现资金与票据穿透式监管，医药代表实行注册制与人脸识别。割草机器人市场跟踪调研附件正文要点为：未来两年中国创新药在美国研发和上市有哪些关键催化；40家样本股2026H1归母净利润实现翻倍以上增长，盈利公司占比超一半，预计未来几年收入增速中枢维持在25%左右，行业整体步入盈利兑现阶段。中东专家路演指出，短期局势可控但长期无解，市场定价在风险溢价与实质断供间摇摆。\u003c/li>\n\u003cli>采集范围：今日总帖数275，正文帖子191，带“文字观点”标签163；附件总数114，正文成功提取18，仅识别到文件名77，正文提取失败19。仅文件名或提取失败附件未纳入正文级结论。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>四季度核心变量：中美关系与美国中期选举两大变量预计不会走坏，10月中旬后市场将趋于清晰；四季度市场仍处于高度结构化状态，配置空间收窄。\u003c/li>\n\u003cli>AI算力/云资本开支与产能：阿里云到2032年全球数据中心规模超过20GW的目标落地节奏；甲骨文FY27末前融资落实与OCI执行；微软Azure AI投资、自研芯片与AI数据中心进展；AgentCore、Agentic OS等。\u003c/li>\n\u003cli>存储/半导体：DRAM情绪能否彻底好转，WFE和HDD相关个股表现；26财年第四季度营收528.7亿美元、毛利率87.0%、EPS33.27美元、DRAM均价环比+21%、NAND均价环比+20%的调研均值兑现情况；碳化硅产业从性能替代到规模放量，2030年全球SiC功率器件市场接近200亿美元、渗透率突破20%；锡矿2026年实际增量约1万吨、缅甸复产节奏。\u003c/li>\n\u003cli>光通信：2025年800G DSP约2500-2600万颗、1.6T DSP &gt;300万颗，2026年800G DSP约5000万颗的出货预估；2027年SiGe硅锗产能全售罄与12寸硅锗紧缺；NPO/CPO量产推迟至2028年；光库科技首次覆盖报告主题“深耕光通信器件，FAU+OCS放量在即”的后续验证。\u003c/li>\n\u003cli>PCB/材料：试样订单后2026年PTFE需求放量节奏、M9切换后Q布与硅微粉用量变化、高层数产品材料供应商指定方式；电子布在英伟达Blackwell/Rubin及Rubin ULTRA系列服务器中不同组件对高端电子布的选型方案；mSAP三合一闪镀排期与良率；锂电铜箔价与PCB铜箔量的戴维斯双击机会。\u003c/li>\n\u003cli>机器人/自动化：Optimus Gen3设计图与碳纤维骨架减重33%的后续进展；敏芯股份在物理AI感知层、MEMS；中国工业机器人市场到2029年年均5%至10%增长率的验证。\u003c/li>\n\u003cli>医药：医保集采与反腐常态化监管，行贿受贿入刑门槛降至3万、六部门独立办案、AI大数据 document.getElementById('sections').innerHTML=(bundle.sections||[]).map((section,index)=>'<section id="report-section-'+index+'" class="section"><h2>'+esc(section.title)+'</h2><div class="grid">'+(section.items||[]).map(item=>'<article class="card" tabindex="0" data-detail-id="'+esc(item.id)+'" onclick="openDetail(this.dataset.detailId)"><div class="label">'+esc(item.type||'REPORT')+'</div><h3>'+esc(item.label||item.title)+'</h3><div class="summary">'+esc(item.summary)+'</div></article>').join('')+'</div></section>').join('');
function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
