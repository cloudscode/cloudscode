", "source_label": "帖子正文", "excerpt": "看好国内大厂机柜明后年放量带来的液冷机会 🍁昨日液冷板块大涨源自al上调28年机柜出货预期。", "content": "", "publish_time": "2026-09-04 09:33", "tags": ["文字观点"]}}, "source_details": {"post:2026-09-04T07-43:75a755b4796a": {"id": "post:2026-09-04T07-43:75a755b4796a", "kind": "post", "title": "2026-09-04 07:43", "source_label": "帖子正文", "excerpt": "OpenAI 发布 GPT6 解读： 于9月3日发布GPT6，目前仅向合作伙伴开放，定价为$10 / $50 每百万 token，Sol 的 2.5 倍，与 Fable 5.1 持平；训练为Stargate 德州站点 10 万颗以上 GPU，OpenAI 史上最大训练运行", "content": "OpenAI 发布 GPT6 解读： 于9月3日发布GPT6，目前仅向合作伙伴开放，定价为$10 / $50 每百万 token，Sol 的 2.5 倍，与 Fable 5.1 持平；训练为Stargate 德州站点 10 万颗以上 GPU，OpenAI 史上最大训练运行；首次由前代模型大规模参与监督训练。 模型架构：OpenAI系统卡未明确表述，但此前变相承认采用 Looped transformer/Recurrent Depth。 模型能力“达到AGI时代”：科学/几何/3D/电脑使用能力大幅增强，ARCAGI 达到99%，相比5.6Sol 的7.8%大幅提升 Token量大幅下降：从各种任务实测来看，我们认为单任务相比5.6 Sol下降量2-6X，且能力大幅提升。OpenAI表示在Codex中Codex中 Astra 不再压缩每个对话，而是用跨窗口笔记替代压缩，旧窗口可检索。 我们认为为什么影响？ 1、大模型每次前向传播里的计算更多，“不容易用语言表达的推理类型”能力大幅提升，乐谱、零件多视图、GUI 截图、科研数据很难写成清晰文字，这些地方能力提升10倍，极度接近人类，因此OpenAI总裁Greg表示进入AGI时代 2、Astra参数量/单Token成本已经相比5.6Sol大幅提升，但参数量可能略低于Fable，scale 加长程 RL 提升的是“做”，不是“知”；知识容量的增长是另一条曲线，而且在那条曲线上 Anthropic（OA补强）仍然领先。OpenAI已经在训练更大参数量模型 3、输入侧的前缀缓存池在扩大，输出侧 KV 增长放缓，Token我们认为下降2-6X，我们认为模型转向更加Compute Bound而非Memory Bound。 4、OpenAI额外投入推理20%算力实现监控 5、从硬件来看，我们认为对GPU/ScaleUp，CPX，SRAM未来需求大幅提升，而DRAM需求被短期压缩，从应用来看，科学CADUnityEDA等能力大幅提升，有物理验证壁垒的环节受益：自驱实验室，抗体数据，先进工艺的签核，仿真，传统RPA最受损。Agent监控与网安受益。 刘欣/李泽宇#文字观点", "publish_time": "2026-09-04 07:43", "tags": ["文字观点"]}, "post:2026-09-04T08-55:728105b3bb28": {"id": "post:2026-09-04T08-55:728105b3bb28", "kind": "post", "title": "2026-09-04 08:55", "source_label": "帖子正文", "excerpt": "🔥【兴证通信】OpenAI发布GPT-6：十万卡级集群训练，AI能力与使用效率再次跃迁#GPT-6为什么值得关注？#前沿模型正式进入十万卡级训练时代。", "content": "🔥【兴证通信】OpenAI发布GPT-6：十万卡级集群训练，AI能力与使用效率再次跃迁#GPT-6为什么值得关注？#前沿模型正式进入十万卡级训练时代。 OpenAI正式发布GPT-6 Astra，这是目前公司能力最强的旗舰模型，主要面向复杂推理、代码、Computer Use和长链路Agent任务。#模型支持105万token上下文、12.8万token最大输出，并支持从low到max的多档推理强度。更值得通信行业关注的是，GPT-6是OpenAI迄今规模最大的训练任务，#首次使用超过10万颗GPU进行预训练，再次说明前沿模型能力继续往上走，底层依赖的仍然是更大规模的算力集群和网络互联。#单Token价格没降，#但完成一个任务反而更便宜。 GPT-6 API价格为输入10美元/百万token、输出50美元/百万token，和Claude Fable 5.1基本一致。OpenAI Developers 但GPT-6的核心变化是效率明显提升，OpenAI披露其在多项测试中能够用明显更少的输出Token完成更复杂任务，因此虽然单Token价格不便宜，实际单任务API成本反而更低。OpenAI Developers#真正重要的是AI能完成的任务边界又扩大了。 单任务成本下降以后，过去因为能力不够或者成本太高无法落地的代码、研究、办公和企业工作流开始变得可用，Agent的调用频次和任务复杂度都有望继续提升。我们认为模型效率提升和算力需求增长并不矛盾，本质上是单位任务成本下降以后，潜在需求被进一步释放。#AI应用加速落地，#持续拉动算力和光互联升级。 GPT-6的发布进一步验证AI产业正在进入“模型能力提升—应用渗透加速—Token需求增长—基础设施投入增加”的正循环。随着AI模型从聊天、搜索逐步扩展到代码、办公、企业自动化等场景，数据中心需要承载更大规模的GPU集群和更高强度的数据交换需求，800G、1.6T高速光模块以及未来NPO、CPO等新型光互联方案仍将持续受益。#文字观点", "publish_time": "2026-09-04 08:55", "tags": ["文字观点"]}, "post:2026-09-04T08-41:75b09f255f6c": {"id": "post:2026-09-04T08-41:75b09f255f6c", "kind": "post", "title": "2026-09-04 08:41", "source_label": "帖子正文", "excerpt": "深度拆解液冷0904 1、历史回顾 液冷技术并不是从数据中心行业才发展起来的。最早的应用可以追溯到18世纪，当时用水和油作为金属加工业的冷却介质，对工业设备进行降温。", "content": "深度拆解液冷0904 1、历史回顾 液冷技术并不是从数据中心行业才发展起来的。最早的应用可以追溯到18世纪，当时用水和油作为金属加工业的冷却介质，对工业设备进行降温。19世纪，液冷用于变压器的冷却。20世纪进入电子时代后，随着高性能、高功率电子元器件的冷却要求不断提高，液冷技术也在持续发展。从理论上讲，沸腾的热水能够带走的极限热量可达两兆瓦每立方厘米，因此催生了换热器概念——通过不附加动力的冷凝液体，依靠吸液性克服重力，将热量从一个点传到另一个点。20世纪60年代，美国阿波罗登月及后续高精度电子元器件冷却，也都用到了液冷。 液冷在计算机上的首次应用，可以追溯到70年前。1951年，人类历史上第一台商务计算机采用了水冷装置。但此后几十年，液冷行业发展比较曲折，与计算机性能及芯片技术的发展密切相关。在大型计算机运行速度快、性能强的阶段，冷却需求高，液冷是主流，并首次开发了用水冷却的液冷系统。随后几十年，因芯片制程进步，风冷成本更低、部署更简单，液冷未被足够重视。20世纪80年代，计算机性能飞速提升，风冷难以满足散热需求，出现了空气加液冷的混合冷却方式。20世纪90年代，晶体管技术应用使大型计算机和超级计算机芯片功率和热量断崖式下降，散热又回到空气冷却模式。 所以，液冷经历了一段曲折的发展历史。 2、本轮兴起 本轮液冷关注度重新兴起，主要应用场景在数据中心。我们希望在单位体积、单位空间内塞下更高密度的芯片，热设计功耗持续提升，而芯片制程工艺难以大幅改善，因此必须通过液冷这种高效散热手段来控制热量。 从AI机柜来看，功率密度持续提升，风冷已无法满足散热需求。英伟达从GB200开始将液冷作为标配，GB300全覆盖，Rubin及后续产品也必然采用100%全液冷方案，短期内没有可替代的技术。所以液冷是一个刚需方案，与传统风冷不存在同质竞争关系，在产业和技术演进趋势下具有确定性。 此外，单芯片算力提升及Scale Up趋势下，机柜内芯片数量持续增加。英伟达NVL机柜从72卡扩展到288甚至576卡，Meta、亚马逊、谷歌等CSP厂商也遵循这一趋势，功率密度不断提升。液冷在产业和技术演进上，是一个相对确定的环节。 3、市场空间 从英伟达和谷歌两家来看，英伟达单机柜价值量约10万美金，预期2027年10万柜出货；谷歌明年将有800~1000万GPU出货量。仅这两家，2027年液冷市场需求就可能接近千亿甚至两千亿人民币。如果再算上其他CSP厂商和国内厂商，市场空间非常巨大。 液冷技术需要与迭代的芯片做定制化匹配，不是标准化产品，因此价格不会持续下降，盈利能力在几年内将保持稳定。从产业链看，英维克在海外链、谷歌链中已实现高毛利。 4、政策利好 数据中心能耗和芯片散热问题已得到国家重视，国家和地方出台了一系列能耗指标限制政策，如工信部规定新建大型数据中心PUE不能超过1.3。国内曙光、浪潮、联想、新华三、中兴等厂商均已推出液冷产品，中科曙光在2015年就推出了国内首款标准化量产冷板式液冷服务器。 5、技术路径 从热力学角度，热量最终必须通过液冷方式传递或转移。最直接的方式是把服务器直接放在冷却液里，即浸没式液冷；间接的方式是通过贴附在芯片上的冷板，将热量通过冷却液排到室外，即冷板式液冷。目前采用最多、最成熟的是单向冷板式液冷。浸没式液冷也有多家国内外厂商在跟进，未来随功率密度持续增长，存在成为主流路径的可能。 冷板式液冷的散热循环分为一次侧和二次侧两个独立回路。二次侧低温冷却液经供液管路流入紧贴芯片的冷板，通过导热热界面材料吸收芯片热量，液温升高后沿回液管路汇聚到CDU。在CDU内，二次侧冷却液将热量传递到一次侧冷冻水，降温后重新被泵送回冷板，如此往复。一次侧升温后的冷冻水从CDU流出，经管路送至室外冷却塔或干冷器，通过水蒸发或强制对流将热量排到大气，降温后回流至CDU换热器，完成闭环散热。 6、价值量分布 冷板式液冷各部分价值量占比，不同公司、不同产品、不同时期差异较大，但可大致参考：一次侧约占20%，二次侧设备占80%。二次侧中，CDU和冷板各占约30%，Manifold、管路、快接头合计占30%~40%。具体分析供应商及厂商时，仍需结合对应产品、时段的实际价值量和利润情况。 7、投资逻辑当前时点，产业链逻辑已比较清晰，主要分为国产链、NV链和海外CSP链三个视角。- 国产链：国内厂商后续增量是爆发式的，但液冷环节在国内扩产没有瓶颈，因此利润和价格弹性略逊于其他链条。- NV链：进入门槛高，大范围订单难获取。台企、美企及北美、欧洲企业具有先发优势，国内厂商作为追赶者，利润丰厚但格局已确定，进入困难。- 海外CSP链：与英伟达绑定较深的厂商，在产能瓶颈时会优先保障英伟达。谷歌等CSP厂商面临产能排挤风险，而国内企业与英伟达订单关系相对较少，反而成为保障海外CSP产能的优先级优势，从而能获得大量高利润订单。这是目前逻辑最顺的链条。在这一链条中，与谷歌合作较深的英维克、与AWS合作较多的申菱，在三季度TPU和Rubin出货阶段格外受关注。市场希望看到这些厂商在营收和利润层面与海外CSP结出果实，从而通过海外CSP芯片出货量的积极预期，判断其未来利润和增速。价值量高、竞争格局好的环节也值得关注：冷板龙头（全球为数不多通过谷歌验证的冷板龙头）、电子泵/水泵领域（飞龙、大元）等，在液冷弹性释放过程中，有望充分享受红利#文字观点", "publish_time": "2026-09-04 08:41", "tags": ["文字观点"]}, "attachment:files/Bernstein-Asia Semiconductors_.pdf": {"id": "attachment:files/Bernstein-Asia Semiconductors_.pdf", "kind": "attachment", "title": "Bernstein-Asia Semiconductors", "source_label": "Bernstein", "excerpt": ">> Employed by a non -US affiliate of BofAS and is not registered/qualified as a research analyst under the FINRA rules. Refer to \"Other Important Disclosures\" for information on c", "content": ">> Employed by a non -US affiliate of BofAS and is not registered/qualified as a research analyst under the FINRA rules. Refer to \"Other Important Disclosures\" for information on certain BofA Securities entities that take responsibility for the information herein in particular jurisdictions. BofA Securities does and seeks to do business with issuers covered in its resear ch reports. As a result, investors should be aware that the firm may have a conflict o f interest that could affect the objectivity of this report. Investors should consider this report as only a single factor in making their investment decision. Refer to important disclosures on page 9 to 11. 13015222 Global Memory Tech Weekly theme: Japan conf takeaways and investor feedback, Sept spot price upside Industry Overview Bullish guidance at our Japan conference We met with management teams of various companies during our Japan conference (31 Aug–3 Sept). Key takeaways for major tech products: (1) NAND - strong growth opportunities in key value cash memory or overall enterprise solutions, global memory supply continuously tight even for the long term, A SP still rising even with more LTAs, minimal greenfield investments (vs DRAM), active shareholder returns; (2) semis equipment - upbeat order trend continues , led by etching, deposition and grinding tools (stronger orders from Taiwan/Korea/US chipmakers vs China); (3) T -glass (ultra -thin glass fib er) - capacity expansion (100 -200% growth through 2027- 28 vs 2025 level) on track to meet strongly growing AI demand, price increase not yet significant to make the supply chain healthy; (4) substrate - FC BGA supp ly tight for AI chips, capacity expansion not yet sufficient to meet new demand; (5) MLCC – sharply rising demand for AI servers but price hike not yet active to prevent abnormally high margin (to keep high entry barrier); (6) HBM hybrid bonding - too early to expect meaningful equipment order, still at R&D stage (e.g., traditional TCB likely used for 16 -hi or even 20 -hi); and (7) limited competit ion with China AI supply chain companies due to low quality (memory, equipment, substrate, T -glass, MLCC, etc). Investors highly interested in memory , asked when to buy During the conference, lots of investors said memory is still one of the most attracti ve sectors given high margin/return and low P/E. Some investors also alluded to already trimmed position (less overweight or neutral/underweight in their portfolios) through Jul - Aug correction period. Elevated stock -price volatility was also one of the rea sons to have less memory company shares. That said, investors were asking when to buy memory stocks. We believe the current share -price level is highly attractive. Three reasons: (1) trough P/E at 5x or less (like 1.0x P/B established in 2001, 2009, 2019 a nd 2023); (2) 3Q ASP still rising well (DRAM: 20%+ QoQ); (3) no hardlanding even after 2026 due to AI boom (stable ASP or only marginal price cut even in 2028); (4) no severe competition with China chipmakers; and (5) very active share buyback and dividend s. Net -net, we note that many investors with whom we spoke appear ready to rebuild positions in memory stocks. Some room for DRAM/NAND spot price increase Memory spot price increase continued this week , led by 16Gb DDR4 and 1Tb NAND (up 2%). Module makers and channel distributors keep purchasing DRAM and NAND actively, expecting further spot-price rally. This trend seems similar to August (spot price up 10%+/ - MoM or 20- 30% QoQ; Nanya Tech ’s monthly sales and Korea ’s semis exports were also strong). Overall , we expect Sept spot price to rise further as demand /order exceeds broadly tight supply. 04 September 2026 Equity Global Technology Simon Woo, CFA >> Research Analyst Merrill Lynch (Seoul) +82 2 3707 0554 simon.woo@bofa.com Dai Shen >> Research Analyst Merrill Lynch (Hong Kong) dai.shen@bofa.com Vivek Arya Research Analyst BofAS vivek.arya@bofa.com Mikio Hirakawa >> Research Analyst BofAS Japan mikio.hirakawa@bofa.com Matt Shin >> Research Analyst Merrill Lynch (Seoul) matt.shin2@bofa.com Exhibit 1: DRAM up this week vs NAND mixed (1Tb up vs 512Gb down) Spot -market prices among DRAM and NAND US$ Current WoW QoQ YoY DRAM spot 16Gb DDR5 54.0 0% 24% 793% 16Gb DDR4 92.9 2% 45% 878% 8Gb DDR4 44.6 1% 26% 810% 4Gb DDR4 15.1 2% 59% 491% NAND spot 1Tb wafer 32.5 2% 29% 540% 512Gb 证 券 研 究 报 告 机械设备 2026 年09月01日 南风股份 (300004 ) ——Q2业绩环比改善 3D打印业务循序渐进 报告原因： 有业绩公布需要点评 增持 （维持 ） 投资要点： ⚫ 业绩低于预期 。2026 上半年 业绩 略低于 预期。 2026 年上半年 公司实现营收 2.09 亿元， yoy-22.88%，归母净利润 -734.83 万元，yoy-131.30%；扣非归母净利润 -756.52 .16 万 元，yoy-134.47%；其中， 2026Q2 公司实现营收 1.22 亿元， yoy-9.42% ，qoq+40.94%, 归母净利润 -213.34 万元， yoy-129.46%, qoq+59.09% 。2026H1 业绩略低于预期 ， 主要系 因为公司受客户工程项目进度影响而导致的供货延后所致。 ⚫ 拥有核电稀缺资质， 核电领域 +地铁隧道的重要 HVAC 供应商 。在通风与空气处理系统方面， 公司成功打破国外技术封锁，实现了关键设备的国产化替代，特别是核电与地铁领域，公司 研制出的百万级千瓦压水堆核电站核岛 HVAC 关键设备、 地铁通风与空气处理系统设备等， 均达到国内领先、国际先进水平，彻底摆脱了长期依赖进口的局面。 并且， 公司依托成熟的 研发、制造及运维体系，形成了“高可靠性设备交付”与“高效如期执行”的核心竞争优势， 能够快速响应客户需求，确保在复杂工程环境下的稳定供应，深度参与了国内众多核电工程 项目，以及北京、广州、深圳等核心城市的地铁及隧道建设，主要客户涵盖中广核、中核 、 国核及各城市地铁公司等国有大中型企业， 已经成为核电与地铁隧道交通领域 的重要供应商。 值得一提的是， 核电行业实行严格的许可证管理制度。 公司凭借卓越的技术实力， 于 2009 年 成为国内 HVAC 行业首家获得国家核安全局颁发的核级风机和核级风阀设计、 制造许可证的 企业。同时，公司持有全国工业产品生产许可证及多项消防产品认证，完全满足核电、地铁、 隧道、大型民用建筑等高端领域对设备安全性的严苛要求。 ⚫ 传统业务基本盘夯实 。2025 年，公司凭借卓越的品牌影响力和技术实力，先后中标防城港、 台山 TY 项目、青岛地铁 7 号线二期、北京 22 号线等多个核电、地铁及隧道领域的重大 通风与空气处理系统项目；在民用与工业领域，成功斩获河北武安全球最大单体陶瓷项目、 深圳 C 塔等重点工程订单， 为业绩增长储备了充足动能； 成立海外营销部， 并成功推动检测 实验室获得新加坡 SAC 认证，为开拓东南亚及全球等市场提供权威“通行证”。此外，深 圳春风路隧道工程空气净化系统项目顺利通过验收，标志着公司高压静电除尘通风整体解决 方案实现首次成功应用，展现了公司在细分领域的创新实力。 ⚫ 3D打印业务有望成为第二成长曲线。 公司旗下全资子公司南方增材，在 2024 年，公司向南 方增材增资 5000 万元， 用于拓展 3D打印业务及核电材料集采业务。 在 2025 年9月， 南方 增材拟投资 5000 万元用于 3D打印服务项目的固定资产投资。公司 3D打印技术为绿光 +红 光方案并行， 可广泛应用于高精尖工业领域， 比如核电工业部件、 商业航天 +卫星、 汽车 IGBT 组件以及 AI算力中心液冷部件等。 2026 年上半年，公司 3D打印业务收入为 228.24 万元， 目前，公司 3D打印技术正处于起步阶段，后续产业链渠道打通后，有望推动该业务业绩高 速增长。 ⚫ 投资分析意见： 公司传统业务 基本盘稳固， 并且新业务 3D打印业务收入开始显现 。考虑 2026 年公司受客户工程项目进度影响而导致的供货 延期 ，同时公司 3D打印业务拓展仍需更多投 入，从而 将影响 公司在 2026 年业绩释放 ，因此我们下调 2026-2028 年盈利预测（下调前盈 利预期为 1.14、1.95、2.86亿元） ，预计 2026 -2028 年分别盈利 0.58、1.05、1.97亿元， 目前， 对应可比公司行业 2026 年行业平均 PE估值为 82.1x，南风股份 PE为73.7x，维持公 司“增持” 评级。 ⚫ 风险提示： 十五五核电站建设节奏低于预期、 原材料成本波动风险、 3D打印业务进展低于预 期。 市场数据： 2026 年08月31日 收盘价（元） 8.91 一年内最高 /最低（元） 18.08 /6.55 市净率 2.4 股息率 %（分红 /股价） - 流通A股市值（百万元） 4,277 上证指数 /深证成指 3,986.30 /14,015.00 注： “股息率”以最近一年已公布分红计算 基础数据 : 2026 年06月30日 每股净资产（元） 3.69 资产负债率 % 15.55 总股本 /流通 #中金黄金、#招金黄金等。 联系人：黄泽浩 18575892374 / 吴晋恺 / 王钦扬 / 金云涛 / 覃雨阳#文字观点", "publish_time": "2026-09-04 10:26", "tags": ["文字观点"]}, "post:2026-09-04T17-14:39e4bb9d393a": {"id": "post:2026-09-04T17-14:39e4bb9d393a", "kind": "post", "title": "2026-09-04 17:14", "source_label": "帖子正文", "excerpt": "摩根士丹利表示，考虑宏观数据恶化、流动性及资金流前景收紧，且市场对政府加强资金流和财富管理的监管感到担忧，在新基准情境下，全面下调中国内地及香港多项股票指数目标价，包括把恒生指数至明年6月底的目标，由原先5月所订的28,400点下调至26,550点。另恒生国企指数目标由9,900点降至8,900点。", "content": "摩根士丹利表示，考虑宏观数据恶化、流动性及资金流前景收紧，且市场对政府加强资金流和财富管理的监管感到担忧，在新基准情境下，全面下调中国内地及香港多项股票指数目标价，包括把恒生指数至明年6月底的目标，由原先5月所订的28,400点下调至26,550点。另恒生国企指数目标由9,900点降至8,900点。MSCI中国指数目标由91点降至80点。沪深300指数目标由5,400点降至4,880点。#文字观点", "publish_time": "2026-09-04 17:14", "tags": ["文字观点"]}, "post:2026-09-04T21-27:c35c33ca8e58": {"id": "post:2026-09-04T21-27:c35c33ca8e58", "kind": "post", "title": "2026-09-04 21:27", "source_label": "帖子正文", "excerpt": "是什么推动了市场？#交易台亚洲市场整体收高，结束了表现疲软的一周。", "content": "是什么推动了市场？#交易台亚洲市场整体收高，结束了表现疲软的一周。沃勒理事偏向鸽派的立场提振了市场对美联储暂停加息的乐观情绪，推动大多数市场上涨，但涨幅并不均衡，部分指数依旧未能完全收复本周的失地。韩国领涨该区域，受芯片股以及人形机器人概念股大幅反弹带动；香港则因美国财报显示价格战正在消退，带动外卖配送股飙升，小米也凭借其在欧洲电动汽车市场的扩张贡献涨幅。日本日经指数在科技股走强推动下上涨，但日元走强限制了出口商的表现；台湾在芯片股买盘带动下表现优异。印度得益于资本市场走强，终结了连续四日的跌势；澳大利亚则成为该地区表现最弱的市场，必和必拓遭遇自三月以来最差一周拖累，澳交所最终收跌结束本周。 区域综述 澳大利亚：标普 / 澳股指数‑0.02%。尽管美联储理事沃勒暗示将采取谨慎的降息策略，带动华尔街走高，但澳大利亚股市基本持平，本周仍录得约 0.9% 的跌幅。必和必拓（BHP）成为主要拖累，股价最多下跌 2.1%，触及两周低点，并创下自 3 月以来最严重的单周跌幅；在更为广泛的大宗商品走软的背景下，该股拖累了以材料类股为主的基准指数。黄金金矿商表现优于大盘，因美元走弱推动金价最多上涨 3%，突破每盎司 4500 美元，为该板块提供助力。其他方面，Pinnacle Asset Management 本周暴跌 18%，创下 2020 年 3 月以来最差表现，市场担忧房地产开发商 Bathla Group 的倒闭可能会对澳大利亚私营信贷行业产生更为广泛的影响。投资者同时关注劳动力账户报告，并对澳大利亚政府债券日益感兴趣，因其收益率具备吸引力且主权信用质量强劲。 ********** 台湾：台股指数 + 1.5%**。盘中走势震荡，但在尾盘反弹，收于接近当日高点。除台积电以外的大型股上涨 0.8%，加入涨势，由国巨（+10%）、联发科（+1.7%）以及台达电（+3.7%）领涨。动能型板块早盘出现获利了结，但随后收复大部分跌幅，其中 MLCC 为表现最佳的次级行业，ABF 则表现最差。散热相关个股普遍上涨，多数涨幅超过 5%。非科技类股整体上扬，尽管科技股仍相对强势，显示市场风险偏好持续升温。成交量在收盘前逐步放大，全周最低成交量仅较前一周减少 17%。 韩国：韩国综合指数 + 2.2%。延续了昨日的温和涨幅，并在美联储理事克里斯托弗・沃勒隔夜评论的提振下今日大幅走高。外资与本地机构共同净买入（科技板块分别净流入 5.57 亿美元 / 7.05 亿美元），而散户投资者则获利了结（科技板块卖出 24 亿美元）。受风险偏好改善推动，半导体（KRXSEM +3.7%）以及更广泛的内存供应链今日走高；而保险（KRXINS‑4.4%）和银行（KRXBANK‑3.3%）则回吐了过去几日的部分涨幅。机器人板块成为焦点，ROBOTIS（108490）上涨 22.5%，因市场对 Microduck 成功重启乐观情绪而大幅反弹。PEARL ABYSS（263750）上涨 11.5%，同样因《赤潮》相关消息表现优异，并带动其他游戏开发商股价跟涨。韩国综合指数成交额较 20 日平均水平下降 37.5%。韩元升值 49 个基点，至 1350.8 韩元兑 1 美元。 日本：日经指数 + 1.26%。日本股市收盘涨跌互现，随着美联储加息担忧缓解提振了科技股和成长股，日经指数收涨，而更为广泛的东证指数基本持平。软银集团（9984）成为关键推动力，在美联储理事沃勒的评论支撑风险偏好后，该股与人工智能相关以及半导体股票一同反弹。金融板块是另一大亮点，MS&AD 保险、福冈金融集团和日本邮政控股均创下历史新高，使该板块成为日经指数内创新高个股的最大来源。相比之下，尽管美元兑日元汇率已回升至 156 以上，但日元持续走强仍令三井物产和三菱商事等综合贸易公司承压。企业动态继续受到关注，卡普空（9697）、国际电气（6525）和 JX 先进金属（5016）将于 10 月加入日经 225 指数；与此同时，Metaplanet 受益于比特币反弹，住友集团则完成了其股票回购计划。 中国：沪深 300‑0.1%。中国股市在强劲高开后一路走低，表现不及区域市场。在投资者保守情绪主导下，硬科技领跌。Wind 半导体主题指数下跌 2.79%。受此影响，板块轮动，农业指数显著上涨，随着启信万象全堆人工智能制作的剧集上线，传媒板块延续强势。食品饮料板块也吸引了抄底资金。白酒股大幅上涨，其中贵州茅台（600519.SH）涨幅达 2.4%。反馈显示，近期白酒批发价格已经企稳回升，本地资金也在布局蓝筹股，因其在未来几个季度具备更有利的基数效应。其他方面，因期货价格回落，锂矿股大幅走低，含锂期货价格下跌约 7%。 香港：恒生指数 + 1.74%。香港股市大幅上涨，恒生指数、恒生科技指数录得自 7 月下旬以来最强的单日涨幅。美联储理事沃勒的鸽派言论缓解了加息担忧，并引发全面买盘，超 80 只恒生指数成分股上涨，所有板块收高，由消费、工业和科技板块领涨。美团（3690）因财报显示外卖竞争缓和、速度快于预期而大幅反弹；小米（1810）、阿里巴巴（9988）和腾讯（0700）亦同步上涨。商汤（0020）和 MiniMax（98809）引领恒生科技指数走高，而龙湖集团（0960）在就债务义务作出安抚表态后股价跳涨。金融股表现稳健，中国银行（3988）与中银香港（2388）双双创下历史新高。尽管市场大涨，内地投资者通过沪港通及深港通呈现显著净卖出，减持规模达 100 亿港元。 东盟：雅加达综合指数‑0.03%。印尼股市表现落后于区域反弹，尽管本周 BCA、BBNI、BBRI 和 BMRI 走势强劲，但整体市场动能偏弱。基准指数在震荡交投中基本持平。WSK 将股息降至 5%，为潜在恢复交易铺平道路。泰国 SET 指数下跌 0.1%，泰国股市早盘上涨 0.8%，随后转入负值区间，起初受区域情绪改善以及美联储收紧政策担忧缓解的支撑，但在周末前出现抛压。美元兑泰铢汇率下跌 0.2% 至 32.958，实现连续第二个交易日录得涨幅，同时外资流入继续对市场形成支撑。 印度：Nifty 指数 + 0.27%。终结了连续四个交易日的跌势。在全球市场情绪因美联储理事表示通胀持续降温，他可能支持在 9 月维持利率不变而提振的背景下，美股收高，债市收益率回落。布伦特原油接近每桶 96 美元，本周累计上涨约 7%，创下自 7 月以来最大单周涨幅。但原油带来的通胀担忧被美股带来的指数涨幅部分抵消。小盘指数微跌 0.2%；地产、制药和汽车板块表现落后；钢铁、金融和银行板块领涨。印度证券交易委员会（SEBI）晚间发布通告，探讨股票衍生品结算定价的潜在调整，此举直接回应了由 CAS 引发的已经影响市场的扭曲现象。#文字观点", "publish_time": "2026-09-04 21:27", "tags": ["交易台", "文字观点"]}, "post:2026-09-04T13-30:0d39619fbf65": {"id": "post:2026-09-04T13-30:0d39619fbf65", "kind": "post", "title": "2026-09-04 13:30", "source_label": "帖子正文", "excerpt": "高盛——中国工业科技：机器人及自动化——2026年亚洲领袖大会要点 核心主题：需求轮动、全球扩张与人形机器人动能 一、行业综述 高盛在香港举办亚洲领袖大会，与约40家公司进行投资者交流。在机器人及自动化领域，主要结论如下： • 锂电设备需求：尽管投资者担忧国内锂电池产能扩张审批可能收紧及新增产能见顶", "content": "高盛——中国工业科技：机器人及自动化——2026年亚洲领袖大会要点 核心主题：需求轮动、全球扩张与人形机器人动能 一、行业综述 高盛在香港举办亚洲领袖大会，与约40家公司进行投资者交流。在机器人及自动化领域，主要结论如下： • 锂电设备需求：尽管投资者担忧国内锂电池产能扩张审批可能收紧及新增产能见顶，但企业反馈显示，2026年第三季度需求环比持平或微增，后续增长更可能由头部客户主导。展望2026年下半年至2027年，锂电或不再是增长最快的下游。赢合科技（Lead Intelligent）作为订单向龙头集中的最明确受益者，管理层认为政策审查聚焦于低利用率的小型电池厂，而宁德时代、亿纬锂能等头部客户的审批、海外项目、固态及钠离子电池不受影响。公司2026年第三季度订单环比持平或略高，可见度已延伸至2027年8月。怡合达（Yiheda）方面，锂电需求依然稳健但增量有限：2026年上半年锂电收入同比增长48%，占总营收约26%，管理层预计2027年增长将向公司平均水平回归。因此，高盛更偏好客户集中于顶级电池厂且具备非锂电业务选项的领先设备供应商，而非广谱锂电beta。 • 终端需求驱动轮动：需求正转向3C、半导体、光学、MLCC、SOFC及其他利基领域，其中苹果2027年机型（20周年纪念版）形态变化是最明确的中期催化剂。大族激光（Han's Laser）、奥普特（OPT）、凌云光（Luster）等公司均强调，未来1-2年自动化需求驱动将更加多元化。大族激光在3D打印领域催化剂最显著，管理层估计苹果供应链2026-27年总需求约100亿元人民币，公司目标占据约50%份额。奥普特和凌云光在机器视觉替代方面更具优势：凌云光消费电子收入预计2026年增长超20%，2027年增长超30%。利基扩展方面，怡合达将受益于半导体FA需求（主要在后道自动化相关的夹具和治具，半导体毛利率超40%）；奥普特则通过全栈视觉硬件及集成能力，切入光模块/半导体/工业AI机会。赢合科技在MLCC/SOFC及固态领域也具期权价值（去年各低于1亿元，现指引数倍增长），2026年上半年固态订单近10亿元，毛利率超50%。 • 海外扩张：仍是关键结构性主题，其中欧洲是近期最切实的亮点，主因本地制造、客户成本压力及份额提升机会。埃斯顿（Estun）是欧洲利润率改善最具体的案例，尽管短期海外收入占比仍有限。欧洲毛利率约50-60%，中国区约30-35%；管理层目标2026年底在波兰启动部分机器人组装，2027年底实现“欧洲制造”。其战略聚焦成本承压的欧洲汽车客户及中型客户（ incumbent服务覆盖较弱）。双环传动（Shuanghuan）海外出货量更为可见：今年发往海外外资品牌的出货量将超100万套，主要在欧洲，市占率已达双位数。 • 人形机器人供应链：多家供应链公司展现出强劲增长及日益提升的战略定位。来福谐波（Laifual）人形应用占2026年上半年谐波减速器销售约30%，产能目标2026年底月产8万台，2027年底15-16万台。绿的谐波（Leaderdrive）目标未来三年产能每年至少翻倍，长期谐波减速器产能目标超1000万台。三花智控（Sanhua）机器人团队规模较去年翻倍，业务从执行器拓展至灵巧手模块、热管理及传感器，已获头部客户批量订单；但近期更明确的驱动仍是数据中心液冷。凌云光管理层预计具身智能数据采集收入2026年翻倍至约1亿元。 二、重点公司详细纪要 埃斯顿（002747.SZ/2715.HK，A股卖出/港股中性） 海外收入短期占比仍较小，但利润率贡献显著。欧洲/中国以外亚洲/拉美/中国毛利率分别约50-60%/40%/40%/30-35%。因美国对中国机器人进口关税高达约60%，公司优先发展欧洲，利用波兰现有制造基地及部分CLOOS组件本地化。2026年底在波兰组装，2027年底实现“欧洲制造”。欧洲份额提升策略基于性价比及本地工程支持，初期目标5-50台的中小客户。售后市场：预计收入从2025年约1亿元增至2026年约1.7亿元（同比+70%）。具身智能：公司认为“大脑”而非人形形态是关键突破，当前人形在工业应用ROI仍不足；不与基础模型内部开发，而是与阿里等模型开发商合作提供机身、工业场景及训练数据。 大族激光（002008.SZ，中性） 3D打印设备：苹果供应链2026-27年总需求估计约100亿元，公司预计在2-3家玩家中占据约50%份额。首批批量订单可能2026年9月下达，11月开始出货。光纤/预制棒业务：杭州永通（2026年6月收购）自7月1日起并表，预计2026年贡献销售3-5亿元，净利0.5-1亿元。宇通160吨预制棒产能已点火，2027年目标产量120吨。自建项目厂房2027年中完工，3季度点火，初期产能400-800吨。空心光纤（HCF）业务：当前产能4-5万纤公里，年底达8-10万纤公里，长期扩张取决于微软许可进展。毛利率：2026年上半年消费电子/PCB/半导体/电池/高功率/低功率分别为40%+/35%/22%/22%/40%。 大族数控（301200.SZ/3200.HK，未覆盖） 超快激光钻孔设备2026年上半年销售超1亿元，出货20+台，主要由光收发器应用驱动，下半年销售将强劲环比增长。CO2激光钻孔设备2026年四季度至2027年AI PCB应用将激增，公司受益于海外产能约束，产品效率匹配客户需求且较海外对手有约20%价格折扣，目前在国内市占率约20%。 来福谐波（3952.HK，未覆盖） 产能：目标2026年底谐波减速器月产能8万台，2027年底15-16万台（2026年7月为6.5万台）。人形机器人应用占2026年上半年总销售约30%。在国内工业机器人市场份额高于协作机器人，正与 Harmonic Drive Systems 合作开发产品。 先导智能（300450.SZ/0470.HK，A/H均买入） 锂电订单风险可控：政策针对低利用率/低利润小厂，CATL、亿纬等头部客户审批正常，海外、固态、钠电不受限。行业集中度提升将推动订单进一步向龙头电池厂及顶级设备商集中。2026年第三季度订单环比持平或略高，可见度至2027年8月。AIDC储能（ESS）成主要上行变量：储能尤其是AIDC相关储能成为超预期变量，北美客户开始要求AIDC储能方案。非锂电业务：MLCC和SOFC去年订单各低于1亿元，现指引数倍增长；固态2026年上半年订单近10亿元，毛利率50%+。若非锂电订单升至总量约30%，将对收入结构和估值产生更显著影响。 绿的谐波（688017.SS，中性） 产能：国内谐波减速器月产约10万台，公司目标未来三年每年至少翻倍，长期产品线产能目标超1000万台（当前约10倍）。竞争：管理层认为在1000万台规模下，毛利率可接受的底线为30%以上，可能较当前低5-10个百分点。竞争对手设备成本仍为其3-5倍，工艺复杂度和周期长2-3倍，规模优势下成本优势将更显著。与SKF合资主要确保人形机器人谐波减速器轴承供应，未来可能独立对外销售全系列机器人轴承。 凌云光（688400.SS，中性） 中期增长目标：收入CAGR约20%，经常性净利润CAGR约40%，由工业AI、具身智能数据采集及光通信驱动。消费电子机器视觉：2025年收入增长约50%，预计2026年增20%+，2027年增30%+（受折叠屏等复杂工艺推动）。苹果及其供应链占集团收入约20%，公司在苹果供应链机器视觉系统份额约40%。光通信代理业务：2026年收入预计7-8亿元（同比增50%+），2027年再增50%+（需求从传统运营商扩展至AI计算中心）。具身智能数据采集收入预计从2025年约0.5亿元翻倍至2026年约1亿元。 三花智控（002050.SZ/2050.HK，A股中性/H股买入） 机器人业务拓展至灵巧手、热管理、传感器。灵巧手结合合资平台空心杯电机与传感器，已获国内头部客户批量订单。热管理空冷/液冷方案均在开发，部分项目年底量产。数据中心液冷是更明确的近期增长驱动：一次侧产品占比从80-90%降至今年70%，二次侧贡献2027年预计进一步提升。数据中心收入去年约14亿元，储能约6亿元，今年数据中心收入预计增约50%至20亿元，未来几年增速或维持50-100%。 奥普特（688686.SS，中性） 苹果供应链替代不仅限于单一项目，正从FATP/组装/模组/3D打印/AOI全面替代康耐视/基恩士，新项目替代压力加速并逐步延伸至老线改造。3D打印需求真实但仍在验证/小批量阶段，放量取决于2027年手机项目审批。工业AI壁垒：公司优势不在通用大模型，而在设备级全栈视觉能力，光源设计占解决方案价值约30%，直接决定图像质量和AI识别精度。客户可能自建算法，但通常缺乏相机、镜头、光源、控制器及视觉系统集成能力，因此奥普特可作为核心视觉硬件供应商或软硬一体方案商，价值捕获更广且粘性更强。 双环传动（002472.SZ，买入） 海外汽车齿轮份额稳步提升，特斯拉突破或提供上行期权。今年海外外资品牌出货量将超100万套（主要在欧洲，市占率双位数）。同轴齿轮：2026年上半年出货约30-40万套，下半年月均约8万套，全年50-60万套（受长安汽车、比亚迪、华为项目拉动）。智能传动齿轮客户结构优化，降低对激进策略的扫地机器人客户依赖，拓展泳池清洁、割草机、办公、汽车及电单车，全年收入目标约10.5亿元。 怡合达（301029.SZ，买入） 终端市场：锂电将从2026高增长转向2027稳健支撑，上行轮动至3C/半导体。2026年上半年锂电同比+48%（占收26%），但增速正正常化。3C受益苹果新机型/20周年形态变化带动设备更新；半导体主要通过后道自动化FA需求（夹具/治具）增长，毛利率40%+。BOM/FA份额：公司目前FA市占率约10%，目标五年后20%。大客户成熟产品FA上行或受限于多源采购和招标，更大机会在长尾中小企业渗透（一站式采购、SKU广度、短交期）。管理层认为份额提升主要靠客户覆盖、SKU覆盖和供应链整合，而非激进定价。 三、投资论点与估值要点（核心标的） • 先导智能（A/H）：全球领先电池设备商，受益于储能加速（2026-30E占订单40%）、头部集中、钠电/固态长期潜力。预计2026-30E收入/净利CAGR 28%/34%，利润率从2024/25低谷恢复。A股目标价50.9元（30倍2027E PE），H股46.4港元（24倍2027E PE，较A股折价20%）。均予买入。 • 双环传动：中国最大高精度齿轮制造商之一，EV齿轮2026-30E CAGR 18%，智能传动齿轮CAGR 27%。目标价45.5元（25倍2027E PE），买入。 • 怡合达：FA供应链现代化模式，目标价35.7元（32倍2027E PE），买入。 • 三花智控：HVAC热管理全球龙头，机器人执行器具长期潜力。A股目标价38.6元，H股40港元（均基于2030E PE 25倍折现），A股中性/H股买入。 • 大族激光：激光设备龙头，受益于AI PCB、3D打印及消费电子新形态。目标价115元（30倍2027E PE），中性。 • 绿的谐波：谐波减速器国内龙头，人形长期潜力大但估值已反映。目标价186.7元（50倍2030E PE折现），中性。 • 凌云光：机器视觉及光通信代理驱动，目标价40.1元（主业务30倍2030E PE折现+智谱股权价值），中性。 • 埃斯顿：工业机器人国内第一，但价格竞争激烈、盈利记录不稳。A股目标价14.7元（35倍2030E PE折现），卖出；H股目标价11.6港元（25倍2030E PE折现），中性。 • 奥普特：机器视觉替代加速，目标价105元（35倍2027E PE），中性。#文字观点", "publish_time": "2026-09-04 13:30", "tags": ["文字观点"]}, "post:2026-09-04T10-20:be706bf2a1e1": {"id": "post:2026-09-04T10-20:be706bf2a1e1", "kind": "post", "title": "2026-09-04 10:20", "source_label": "帖子正文", "excerpt": "安克创新IFA概览：品牌整合，品类升级 #品牌整合、产品组重新划分。9月3日，公司召开IFA发布会，宣布旗下五大品牌将统一整合至单一品牌Anker，未来安克将划分为两大产品组： 1）Anker For You：定位为伴随用户日常生活的科技产品，覆盖充电、音频、个人健康及创意工具等领域。", "content": "安克创新IFA概览：品牌整合，品类升级 #品牌整合、产品组重新划分。9月3日，公司召开IFA发布会，宣布旗下五大品牌将统一整合至单一品牌Anker，未来安克将划分为两大产品组： 1）Anker For You：定位为伴随用户日常生活的科技产品，覆盖充电、音频、个人健康及创意工具等领域。 2）Anker For Home：定位于能够自主照料自身的家庭，覆盖家庭安防、机器人及家庭能源等领域。 #首家独立门店在德国落地、侧重场景输出。9月5日，公司将于柏林开设首家独立门店。门店中，Anker品牌顾问将展示不同品类产品之间的协同应用，例如让消费者直观看到家庭中枢、摄像头与扫地机器人如何组成一套完整系统协同工作，而不是三个彼此独立的产品。未来拟开设更多门店。新品概览-AnkerForHome #Anker-Mindbase：定位本地AI家庭中枢，包含连接+本地AI+存储三大功能。 1）连接：EasyOmni连接安克设备及其他品牌的可兼容Matter协议的设备，可与苹果HomeKit、亚马逊Alexa等智能家居助手协作。 2）本地AI：搭载TrueSmart™ Agent本地智能系统，通过内置AI Core算力卡运行面向不同家庭场景的专用AI Agent，实现本地化智能处理。目前包括NAS Agent和Security Agent，分别负责家庭数据存储管理与智能安防等任务。 3）存储：EverSafe带来可扩展的48TB内存，可保存家庭照片、影音等数据。 #Anker-SOLIX-Solarbank-Max：全球首款达到家用储能电池规格的即插式储能系统，支持10kW光伏输入，基础容量为7kWh、最高可扩展至42kWh，并提供3500W交流输出。其Plug-in Power2.0系统只需由认证电工对一个插座进行改造，即可在当天完成设备连接，实现全屋供电。 Solarbank Max最高可将安装成本降低80%，并将投资回收周期缩短至约2.6年。新品概览-AnkerForYou #RIC-Hearing-Aids-Pro：听力健康领域OTC助听器产品。搭载公司自研THUS AI芯片，并复用其在耳机领域长期积累的降噪、长续航和快充能力，主打在嘈杂环境下提升语音清晰度和听音体验。采用RIC（Receiver-in-Canal，受话器外置式）助听器形态，定位于无需处方即可购买的消费级听力辅助设备。 #Anker-SleepLab-Pro：睡眠床头音箱产品，将睡眠业务从可穿戴耳机拓展至非佩戴式睡眠解决方案。其中，SleepLab可播放音乐及助眠音效，并结合柔和夜灯和闹钟功能营造睡眠环境；SleepLab Pro则进一步搭载60GHz毫米波雷达，可非接触式监测心率、呼吸及四个睡眠阶段，并根据用户睡眠状态播放个性化音频，帮助用户更快入睡并维持睡眠，全程无需佩戴耳机、智能戒指或其他监测设备。 除上述新品外，安克亦发布了新款睡眠耳机、扫地机、割草机、母婴产品、充电宝等新品。#文字观点", "publish_time": "2026-09-04 10:20", "tags": ["文字观点"]}, "post:2026-09-04T13-36:8547ad99f407": {"id": "post:2026-09-04T13-36:8547ad99f407", "kind": "post", "title": "2026-09-04 13:36", "source_label": "帖子正文", "excerpt": "🏢 高盛在香港举办亚洲领袖大会，与约 40 家公司开展投资者交流。在机器人及自动化领域，主要结论如下： 🔋 锂电设备需求：尽管投资者担忧国内锂电池产能扩张审批可能收紧及新增产能见顶，但公司反馈显示，2026 年第三季度需求环比持平或微增，后续增长更可能由头部客户主导。", "content": "🏢 高盛在香港举办亚洲领袖大会，与约 40 家公司开展投资者交流。在机器人及自动化领域，主要结论如下： 🔋 锂电设备需求：尽管投资者担忧国内锂电池产能扩张审批可能收紧及新增产能见顶，但公司反馈显示，2026 年第三季度需求环比持平或微增，后续增长更可能由头部客户主导。展望 2026 年下半年至 2027 年，锂电或不再是增长最快的下游。赢合科技作为订单向龙头集中的最明确受益者，管理层认为政策审查聚焦于低利用率的小型电池厂，而宁德时代、亿纬锂能等头部客户的审批、海外项目、固态及钠离子电池不受影响。公司 2026 年第三季度订单环比持平或略高，订单可见度已延伸至 2027 年 8 月。怡合达方面，锂电需求依然稳健但增量有限，2026 年上半年锂电收入同比增长 48%，占总营收约 26%，管理层预计 2027 年增长将向公司平均水平回归。因此，高盛更偏好客户集中于顶级电池厂且具备非锂电业务选项的领先设备供应商，而非广谱锂电 β 行情。 📱 终端需求驱动轮动：需求正转向 3C、半导体、光学、MLCC、SOFC 及其他利基领域，其中苹果 2027 年机型，也就是 20 周年纪念版的形态变化，是最明确的中期催化剂。大族激光、奥普特、凌云光等公司均强调，未来 1‑2 年自动化需求驱动将更加多元化。大族激光在 3D 打印领域催化剂最显著，管理层估计苹果供应链 2026‑2027 年总需求约 100 亿元人民币，公司目标占据约 50% 份额。奥普特和凌云光在机器视觉替代方面更具优势，凌云光消费电子收入预计 2026 年增长超 20%，2027 年增长超 30%。利基业务扩展方面，怡合达将受益于半导体工厂自动化需求，业务主要集中在后道自动化相关的夹具和治具，半导体业务毛利率超 40%；奥普特则依托全栈视觉硬件及集成能力，切入光模块、半导体、工业 AI 相关机会。赢合科技在 MLCC、SOFC 及固态电池领域同样具备期权价值，上述业务去年各自营收均低于 1 亿元，当前指引将实现数倍增长，2026 年上半年固态电池订单接近 10 亿元，毛利率超过 50%。 🌍 海外扩张：仍是关键结构性主题，欧洲是近期最切实的亮点，主要驱动来自本地制造落地、客户成本压力以及份额提升机会。埃斯顿是欧洲利润率改善最具体的案例，尽管短期海外收入占比依旧有限。欧洲区域毛利率约 50‑60%，中国区毛利率约 30‑35%；管理层计划 2026 年底在波兰启动部分机器人组装业务，2027 年底实现 “欧洲制造”。公司战略重点面向成本承压的欧洲汽车客户以及中型客户，这部分群体原有服务商覆盖力度偏弱。双环传动海外出货量具备更高可见度，今年发往海外外资品牌的出货量将超过 100 万套，市场集中在欧洲，市占率已经达到双位数水平。 🤖 人形机器人供应链：多家供应链公司展现出强劲增长动能，战略定位也持续提升。来福谐波人形机器人相关业务，占 2026 年上半年谐波减速器销售规模约 30%，产能目标为 2026 年底月产 8 万台，2027 年底月产 15‑16 万台。绿的谐波目标未来三年产能每年至少实现翻倍，长期谐波减速器产能目标超过 1000 万台。三花智控机器人团队规模相较去年实现翻倍，业务范围从执行器拓展至灵巧手模块、热管理以及传感器，已经拿到头部客户的批量订单；但短期更明确的业绩驱动依旧来自数据中心液冷业务。凌云光管理层预计，具身智能数据采集业务收入 2026 年将实现翻倍，规模大约达到 1 亿元。#文字观点", "publish_time": "2026-09-04 13:36", "tags": ["文字观点"]}, "post:2026-09-04T08-41:2d956e0e9c74": {"id": "post:2026-09-04T08-41:2d956e0e9c74", "kind": "post", "title": "2026-09-04 08:41", "source_label": "帖子正文", "excerpt": "❗【天风电新】AI电源再推荐：板块陆续进入订单高增+业绩兑现，重视电源板块低估机会-0903 ——————————— 今日液冷板块继续大涨带动市场关注度逐步外溢至电源板块，叠加盘中传言从上游供应商NXW提货情况看麦米在Rubin系列份额较高，电源整体表现较好。从板块中报及业绩交流反馈看，头部电源企业", "content": "❗【天风电新】AI电源再推荐：板块陆续进入订单高增+业绩兑现，重视电源板块低估机会-0903 ——————————— 今日液冷板块继续大涨带动市场关注度逐步外溢至电源板块，叠加盘中传言从上游供应商NXW提货情况看麦米在Rubin系列份额较高，电源整体表现较好。 从板块中报及业绩交流反馈看，头部电源企业均已进入26H2批量订单落地阶段，#往27年看订单将保持爆发式增长+业绩开始批量兑现；我们看好电源板块未来持续技术升级带来的通胀属性+头部国产厂商份额持续提升，带来明年业绩确定性高增。 当前电源板块产业进展及股价节奏类似启动前的液冷板块，我们认为后续有望复刻液冷走势、逐步走出趋势，建议持续重点关注。 🌼持续重点推荐： 1、麦格米特：Rubin系列今年下半年放量；明年PSU电源和超容柜会同时大规模放量，DSZ预计份额远超市场传闻的10%；我们预估公司AI电源相关订单规模有望2~3倍以上增长至70~100亿。 27年百亿订单对应25亿利润，叠加国内AI电源市场、传统主业合计目标市值超1000亿元；远期PSU+超容柜+HVDC潜在总市场规模超2000亿，潜在收入体量300~400亿、利润体量70~100亿，市值有望冲击1500~2000亿元。 2、欧陆通：谷歌链核心标的，27年业绩逐步兑现。 Google项目目前推进顺利， 2026年内落地，Q4将实现小批量出货，预计份额有望20%及以上（对应27年40+亿订单）。 以谷歌2027/2028年TPU出货1200万/2500万颗算，按20%/25%份额预期下，对应增量收入约45/129亿元，增量利润11/32亿元，增量市值278/640e，叠加国内市场主业市值180e，合计目标市值458/820e。 3、新雷能：All in AI数据中心DC-DC电源，二次电源已实现对亚马逊批量交付、预计明年20~25亿订单。 谷歌800V-50V PDB项目：目前仅3家供应商，预计10月底正式送样，11月接受正式审厂；产品送样到实现量产约7~8个月可靠性实验，保守估计3供也有10%~20%份额。 当前公司市值仅186亿元，未来潜在市值天花板可看400~600+亿（主业60亿 + 已批量的二次电源4~5亿利润、120~150市值 + 明后年800V-48V电源10~20亿利润，200~400亿增量市值），价值重估潜力大。 4、中富电路：目前AI相关订单处于供不应求状态。2027年预计产能达40亿元以上，其中50%以上对应AI业务；谷歌是最大AI项目客户，后续份额有望从今年30%提升至明后年50%；谷歌产品价值量呈指数级增长趋势。 28年及之后：1）2028年谷歌+AWS+AMD+英伟达：80~100亿订单、归母净利24~30亿，20倍PE，对应480~600亿元；叠加主业远期合计目标市值550~650亿。 ———————————#文字观点", "publish_time": "2026-09-04 08:41", "tags": ["文字观点"]}, "post:2026-09-04T07-38:69fe615f4577": {"id": "post:2026-09-04T07-38:69fe615f4577", "kind": "post", "title": "2026-09-04 07:38", "source_label": "帖子正文", "excerpt": "❗【天风电新】NCC交流后更新-0903 ———————————— NCC为日本三大铝电解电容企业之一（另外两家Rubycon、Nichicon），产品主要为电容、绕线电感及压敏电阻、机电产品等。AI服务器电容为公司新产品，2025年中期开始出货。", "content": "❗【天风电新】NCC交流后更新-0903 ———————————— NCC为日本三大铝电解电容企业之一（另外两家Rubycon、Nichicon），产品主要为电容、绕线电感及压敏电阻、机电产品等。 AI服务器电容为公司新产品，2025年中期开始出货。AI铝电解电容在电源输入端用450V产品，同时也涵盖80V到几V不同规格电容。 电容需求方面，牛角电容随芯片性能提升电容需求提升。以H卡配套用量为基准，【Blackwell需求量为3倍，#Rubin为7.5倍，RubinUltra 9倍，Feynman为11倍】。 产能方面，预计#今年下半年产能目标为当前1.5倍，2027年目标为当前2倍。产能提升主要通过现有产线效率提升来实现，无法在不同品类产品进行切换。 公司有涨价计划，#未来通过升级材料提升产品性能，同步推动产品价格上涨。产品升级方向为：实现更大容量、体积更小、重量更轻，电极箔是重要的升级方向。 🌟投资建议 随芯片升级，电源及电容也跟随升级，电容用量提升。尤其400V向800V切换，用2颗450V铝电解电容串联使用，进一步增加电容需求。 电容是Rubin升级链中重要一环，铝电解电容需求增速（容值）超过功率提升，且国内企业在头部电源企业份额提升。江海目前已经是Flex、麦米等电源企业主供，未来在T客户也有望获得较高份额。 继续重点推荐AIDC牛角电容及电极箔【江海股份】、【海星股份】，在验证中有望导入的【艾华集团】、【万裕科技】。 ———————————— 欢迎交流：孙潇雅/薛舟#文字观点", "publish_time": "2026-09-04 07:38", "tags": ["Rubin为7", "5倍", "Rubin", "文字观点"]}, "post:2026-09-04T09-07:e15a8726c66d": {"id": "post:2026-09-04T09-07:e15a8726c66d", "kind": "post", "title": "2026-09-04 09:07", "source_label": "帖子正文", "excerpt": "【东财宏观】每日宏观资讯台（2026年9月4日）#国际重要资讯1. 【美国】美东时间9月3日，美联储理事克里斯托弗·沃勒表示，如果即将公布的数据确认通胀压力正在降温，他倾向于在美联储下一次货币政策会议上支持维持利率不变。2. 【美国】2026年前八个月，美国企业计划裁员人数降至四年来最低水平，进一步", "content": "【东财宏观】每日宏观资讯台（2026年9月4日）#国际重要资讯1. 【美国】美东时间9月3日，美联储理事克里斯托弗·沃勒表示，如果即将公布的数据确认通胀压力正在降温，他倾向于在美联储下一次货币政策会议上支持维持利率不变。 2. 【美国】2026年前八个月，美国企业计划裁员人数降至四年来最低水平，进一步表明企业仍不愿削减员工规模。 3. 【美国】受计算机和其他技术设备进口激增的影响，美国7月份贸易逆差大幅扩大至2025年初以来的最高水平。 4. 【美加贸易】加拿大总理马克·卡尼当地时间3日表示，加拿大政府已准备好与美国签署一项让两国都受益的贸易协议，但任何协议都必须具备稳定性和可信度。 5. 【俄乌】俄罗斯总统普京当地时间周四表示，俄乌双方有可能达成结束战争的协议；与此同时，乌克兰方面声称，和平谈判预计将迎来新进展。 6. 【日本】日本央行数据显示，日本政府周三似乎没有在外汇市场进行大规模干预，这表明汇率的剧烈波动可能是由于加息预期重新调整导致交易员情绪紧张所致。 7. 【韩国】韩国政府宣布大规模重组国有能源和交通企业。韩国国家石油公司与韩国天然气公司将合并，韩国电力公司旗下5家子公司将整合，韩国煤炭公社将清算，4家地区港口管理机构也将合并。 8. 【农业】高盛指出，2026—2027年的超级厄尔尼诺可能收紧全球糖市：短期需要防范巴西糖产恢复带来的回调，中期则要警惕印度、泰国和巴西减产以及出口限制形成的供应冲击。 9. 【AI】G20科技部长会议上，马斯克和扎克伯格罕见同台，共同向全球政策制定者发出警告：熟练工人短缺与电力供应不足，正成为制约AI发展的两大核心瓶颈。 10. 【OpenAI】北京时间4日凌晨，OpenAI正式发布GPT-6 Astra，并称其为“目前全球最智能、且对齐程度最高的模型”，在计算机操作、网页浏览、软件工程、网络安全、科学研究以及专业工作方面均达到当前最先进水平。#国内重要资讯1. 【六张网】9月2日，国家发改委召开“六张网”重大项目协调推进机制会，研究完善政银企协作机制和项目库建设。加快梳理一批具有吸引力的工程项目向社会公开推介，鼓励多元主体参与。 2. 【化债】据第一财经，今年新增债券发行限额为5.2万亿元，前8个月实际发行3.5万亿元，后4个月仍有1.7万亿元待发。 3. 【中小企业】工信部等十部门印发《促进中小企业发展“十五五”规划》。规划指出，到2030年，规模以上中小企业人均营业收入累计增长15%左右。 4. 【服务贸易】商务部服贸司负责人介绍2026年1-7月服务贸易发展情况。2026年1-7月，我国服务进出口总额44467.1亿元，同比增长8.3%。 5. 【入境消费】商务部新闻发言人黄玲表示，今年1月份至7月份，境外人员在华消费2636亿元，同比增长27.8%，办理离境退税的境外旅客数量同比增长3倍以上。下一步将会同各部门、各地方进一步抓好相关政策的落地实施，更好优化入境消费环境。 6. 【电池】9月3日，工信部副部长熊继军在2026世界动力电池大会上表示，当前，全球汽车产业变革仍在加速演进。下一步，工信部将进一步加强技术创新、强化标准引领，推动我国动力电池产业加速向高端化、智能化、绿色化、国际化迈进。 7. 【Token贷】近期，广东省首个词元经济专项金融产品“Token贷”在广州市海珠区落地，中国银行广州分行为相关企业授信约2800万元。 8. 【AI】AI应用侧需求集中释放，叠加英伟达高端芯片对华供应持续受限，国产AI芯片迎来量价齐升窗口。中国信通院数据显示，2026年一季度国内AI算力需求同比增长417%，有效供给增速仅128%。 9. 【腾讯】9月3日，腾讯正式推出WorkBuddy金融版，面向银行、券商、保险等机构上线80多个金融专家及专家团。从对公信贷尽调、基金研究，到保险代理人的客户经营，腾讯试图让Agent真正进入金融机构的业务流程。 10. 【港口】数据显示，2026年前7个月重点港口集装箱吞吐量同比增长5.3%，铁矿石、煤炭等货种亦保持正增长；尽管8月单月吞吐量同比微降，但全年景气度仍稳中有升。#文字观点", "publish_time": "2026-09-04 09:07", "tags": ["国际重要资讯", "国内重要资讯", "文字观点"]}, "attachment:files/GS-罗博特科.pdf": {"id": "attachment:files/GS-罗博特科.pdf", "kind": "attachment", "title": "GS-罗博特科", "source_label": "GS", "excerpt": "Allen Chang +852-2978-2930 | allen.k.chang@gs.com Goldman Sachs (Asia) L.L.C. Verena Jeng +852-2978-1681 | verena.jeng@gs.com Goldman Sachs (Asia) L.L.C.RoboTechnik (300757.SZ): Se", "content": "Allen Chang +852-2978-2930 | allen.k.chang@gs.com Goldman Sachs (Asia) L.L.C. Verena Jeng +852-2978-1681 | verena.jeng@gs.com Goldman Sachs (Asia) L.L.C.RoboTechnik (300757.SZ): Semicon Taiwan Chairman visits: Photonics IC toward scaling trend to drive testing and assembly tools; Buy3 September 2026 | 11:20PM HKT We hosted Robotechnik Chairman and Head of FiconTest and visited the booth in Semicon Taiwan on Sep 3. Management highlights the strong demand on Photonics IC automated production and testing, driving their tools demand. The company’s strong beat in 2Q26 results ( report link ) reaffirms our positive view on Robotechnik, riding on the growing trend across CPO, NPO, OCS, and optical modules. We identify Robotechnik to be the major bene ficiary in the photonics IC scaling trend, considering its comprehensive tools coverage and strong automation capability across software and hardware. Maintain Buy with our 12m TP at Rmb796 (implied 35x 2027E PE vs. 50% EPS CAGR in 2027-29E). Key takeaways 1. Photonics demand outlook: Management highlights in the past 25 years, photonics is not following up semiconductors scales, while today with generative AI, it needs to improve and work together with semiconductors, driving a strong demand on photonics tools, across testing, assembly, etc. to scale photonics. Management describes the numbers of tools they target to ship in coming 1 year would be over 50% of what they’ve shipped in past 25 years, and the capacity they need in coming 5 years is more than what they had in past 25 years, re flecting the strong demand on scaling photonics. Management highlights the strong demand on photonics testing tools, as the industry needs photonics testing to be as fast and scalable as electronics IC / semiconductor testing in coming 18-24 months, which the EIC testing has taken 50 years to establish. 2. Photonics testing tools: On photonics testing, it o ffers comprehensive tools across wafer-level testing (insertion 1 & 2), die-level testing (insertion 3), and the whole module testing (insertion 4). The earlier a failures is found, the lower costs a failure is. The company not only covers the whole chain of testing, but also each testing steps are correlated and traceable, supporting the customers to know where the failure came from. On wafer-level testing, the company o ffers double sided wafer test tool, and newly launched the new generation in 3Q26, fully complied with the global leading foundry’s communication infrastructure. Management highlights their double sided wafer test tool could handle warpage of the wafer, o ffer precision alignment, deal with complex temperature requirement, and handle repeatability and correlation between machines. Goldman Sachs does and seeks to do business with companies covered in its research reports. As a result, investors should be aware that the firm may have a con flict of interest that could a ffect the objectivity of this report. Investors should consider this report as only a single factor in making their investment decision. For Reg AC certification and other important disclosures, see the Disclosure Appendix, or go to www.gs.com/research/hedge.html . Analysts employed by non-US a ffiliates are not registered/quali fied as research analysts with FINRA in the U.S. Equity ResearchFor the exclusive use of KECHENG.JIN@BITMAIN.COM 1fc9fa9cf8844a388c506688498547c5 On die-level testing, the company o ffers double sided die test tool, which could test the small chips with tight pitch, and on the module testing, its tools could cover various architectures, such as ELSFP , OSFP , etc. The module testing needs to deal with multiple chips and fiber cables on the module, raising the complexity of testing and temperature requirement. Management highlights the target is to do more steps in parallel to shorten the testing time. On wafer-level testing, the company targets to shorten the testing time by 50-60% next year, and on die-level testing, it targets to be 4x faster next year. 3. Competition advantages: Management highlights their top three strengths: (1) active alignment: o ffering highly precision, and the company self-developed motion control software and controllers, (2) high automation: o ffering full automated production lines, enabling customers to set up unmanned factory, and (3) AI / Digital twin: allowing customers to simulate the production (e.g. packaging, assembly of transceivers) in labs via AI software. The company highlights they are not only providing testing tools but assembly tools, allowing customers to automated produce optical transceivers. Price Target Risks and Methodology - RoboTechnik Valuation: Our 12-month target price of Rmb796 is based on a 20.7x 2031E P/E, discounted back to 2027E at a COE of 11.3%. Our target multiple is derived from the correlation between consumer electronic peers’ PEG&M (2026E P/E to 2027E NI YoY and OPM), with RoboTechnik’s 2032E net income at 2% YoY and 2032E OPM at 32%. Key downside risks: Fiercer-than-expected market competition; lower-than-expected optical connection end demand; worse-than-expected photovoltaic market downcycle. Source: Company data, Goldman Sachs Research estimates, FactSet. Price as of 3 Sep 2026 close.300757.SZ 12m Price Target: Rmb796.00 Price: Rmb585.20 Upside: 36.0% Buy GS Forecast Market cap: Rmb98.1bn / $14.6bn Enterprise value: Rmb99.1bn / $14.7bn 3m ADTV: Rmb3.8bn / $559.6mn China Greater China Technology M&A Rank: 3 Leases incl. in net debt & EV?: Yes 12/2512/26E 12/27E 12/28E Revenue (Rmb mn) 949.8 2,349.1 12,959.9 26,243.7EBITDA (Rmb mn) 60.8 657.6 4,566.0 9,206.0EPS (Rmb) (0.41) 2.76 22.94 46.52P/E (X) NM NM 25.5 12.6P/B (X) 18.4 48.6 20.0 9.1Dividend yield (%) 0.0 0.1 1.0 2.0N debt/EBITDA (ex lease,X) 17.9 1.6 (0.3) (0.7)CROCI (%) 31.7 31.3 170.9 282.9 FCF yield (%) 0.5 0.2 3.3 7.8 6/26 9/26E 12/26E 3/27E EPS (Rmb) 0.27 0.65 2.08 3.15 3 September 2026 2Goldman Sachs RoboTechnik (300757.SZ)For the exclusive use of KECHENG.JIN@BITMAIN.COM 1fc9fa9cf8844a388c506688498547c5 Disclosure Appendix Reg AC We, Allen Chang and Verena Jeng, hereby certify that all of the views expressed in this report accurately re flect our personal views about the subject company or companies and its or their securities. We also certify that no part of our compensation was, is or will be, directly or indirectly, related to the specific recommendations or views expr 事件：长电科技发布 2026 年度向特定对象发行 A 股股票预案，拟募集资金不超过 65 亿元，其中 46 亿元用于四项先进封装相关产业项目。从资金用途来看，本次定增的核心看点在于先进封装相关产能及工艺平台的扩充方向。 💡具体说明： 1️⃣HPC 为本轮重点投入方向，募投同时覆盖多类高端封装场景高性能计算高端先进封装平台在四项产业项目中项目总投资及拟使用募集资金规模均最高；除 HPC 外，本次募投还覆盖晶圆级先进封装、高密度大容量存储系统级封测及高端电源模组封测，涉及计算、存储、电源及晶圆级工艺等方向。 2️⃣本次项目以扩产和能力升级为主，产业项目为主要资金投向四项产业项目均围绕平台扩产、工艺升级扩能及封测能力提升展开，总投资约 76.70 亿元，本次拟投入募集资金 46 亿元，占 65 亿元募资总额约 71%，重点增强先进封装工艺平台及产业化承接能力。重点推荐#芯碁微装，作为封装厂扩产核心设备受益标的。公司先进封装设备已实现批量交付，LDI 技术路线获得验证；半导体成长路径清晰。 ⚠️风险提示：定增审批及实施进度不及预期；募投项目建设及产能释放不及预期；下游需求不及预期等。 🎁东吴电子：陈海进 / 刘玥娇#文字观点", "publish_time": "2026-09-04 09:00", "tags": ["文字观点"]}, "post:2026-09-04T07-39:edfa18ede538": {"id": "post:2026-09-04T07-39:edfa18ede538", "kind": "post", "title": "2026-09-04 07:39", "source_label": "帖子正文", "excerpt": "【长江证券电力公用 张韦华团队】重申电力行业景气改善周期的低位配置机会 #二阶导反转显现、厄尔尼诺强化供需趋紧、有望加速本轮涨价周期。2026年以来，压制电价表现的电力供需、能源价格等核心要素反转，持续强化电价上涨预期。", "content": "【长江证券电力公用 张韦华团队】重申电力行业景气改善周期的低位配置机会 #二阶导反转显现、厄尔尼诺强化供需趋紧、有望加速本轮涨价周期。2026年以来，压制电价表现的电力供需、能源价格等核心要素反转，持续强化电价上涨预期。一方面，今年以来新增装机节奏阶段性放缓，同时用电负荷屡创历史新高，电力供需形势边际趋紧；另一方面，3月份以来煤炭价格保持震荡上行态势。煤价抬升与供需改善共振，电价二阶导拐点明确，并且已经率先反映在现货及月度电价中，粤苏等沿海地区现货及月度电价同环比均有明显改善，并有望进一步向年度电价谈判传导。展望来看，随着超强厄尔尼诺的持续发展，夏季高温有望支撑用电负荷及能源价格保持较高水平，2027年电价拐点明确。 #持续看好行业β改善、短期市场波动加剧下的低位配置机会，中报后预计基本面配置机会窗口打开，推荐核电、水电、煤电一体化火电。核电运营商受益电价改革及产能释放，在年底电价机制稳定后有望成为永续增长固定收益资产，持续推荐中国核电、中广核电力H，其中中国核电当前安全边际充分，“十五五”期间产能CAGR 10%，2027年当年增速接近20%，向上空间可观；水电息差仍处于相对高位，叠加后续厄尔尼诺有望催化来水改善，推荐长电&两投；火电方面，煤价高位火电即期业绩偏弱，推荐更加充分受益于电价反弹的国电/蒙电/陕西能源等煤电一体化标的，其中国电电力大渡河在建水电机组2026年陆续投产贡献增量，且公司承诺每股分红不低于0.22，对应当前股息率4.2%，绝对收益价值突出。 >>>>> 【系列深度报告】 \u003c\u003c\u003c\u003c\u003c 研究合辑：能源再通胀，电力启新程——系列深度思考 迷雾中寻路，曙光中布局——电力行业2026年度中期投资策略 向胜率，要赔率——周期绝对收益机会掘金相关报告合辑及资料，如有需要欢迎随时与我们联系！ -------------------------- 团队成员：张韦华、司旗、宋尚骞、刘亚辉、张子淳#文字观点", "publish_time": "2026-09-04 07:39", "tags": ["文字观点"]}, "post:2026-09-04T08-44:7effcc966aa8": {"id": "post:2026-09-04T08-44:7effcc966aa8", "kind": "post", "title": "2026-09-04 08:44", "source_label": "帖子正文", "excerpt": "梅花庄：依据产业链逻辑和发展，很多方向圈内已经“算出来了” 中报我们专门讲过，未来算力有2个从0-1的方向，【液冷】+【HVDC电源】 圈内优先选择的是【液冷】，原因是液冷的中报爆出了订单，但是电源企业的业绩出的一般，订单有一定的增长，但是没有“爆发”；如此一来，这里面可能略微存在一定的时间差", "content": "梅花庄：依据产业链逻辑和发展，很多方向圈内已经“算出来了” 中报我们专门讲过，未来算力有2个从0-1的方向，【液冷】+【HVDC电源】 圈内优先选择的是【液冷】，原因是液冷的中报爆出了订单，但是电源企业的业绩出的一般，订单有一定的增长，但是没有“爆发”； 如此一来，这里面可能略微存在一定的时间差； 我认为一定是液冷炒完之后，再炒到电源； 大家可以看，今天爆发的就是【液冷】，而后【电源】又来了，与圈内的思路吻合； 电源今天的表现是【麦格米特】的一则小作文，诸如明年如何释放业绩云云（未经证实）； 但有这样的小作文，其实本质上也反应出市场在基于产业链趋势走。---ms#文字观点", "publish_time": "2026-09-04 08:44", "tags": ["文字观点"]}, "post:2026-09-04T17-15:707b5ace85c0": {"id": "post:2026-09-04T17-15:707b5ace85c0", "kind": "post", "title": "2026-09-04 17:15", "source_label": "帖子正文", "excerpt": "OCS带动小光强势反弹的变化更新： 行业逻辑层面： 1）谷歌需求量的上修，27年从3w提升至5w，28年按TPU出货量有更高预期，谷歌 28年v9t OCS用量翻倍及以上增幅。前几日SemiAnalysis拆解谷歌TPU互联路径，新一代6D架构大幅提升光互联配比，光互联链路增3倍。", "content": "OCS带动小光强势反弹的变化更新： 行业逻辑层面： 1）谷歌需求量的上修，27年从3w提升至5w，28年按TPU出货量有更高预期，谷歌 28年v9t OCS用量翻倍及以上增幅。前几日SemiAnalysis拆解谷歌TPU互联路径，新一代6D架构大幅提升光互联配比，光互联链路增3倍。 2）英伟达的费曼服务器scaleup考虑引入OCS，OCS使用层级由scale across向scale out 、scale up拓展，海外厂商已收到英伟达研发需求，有望在28年费曼架构中大规模部署，OCS整体市场空间有望大幅打开。 3）德意志银行2026科技大会释放超预期信息，Lumentum CEO确认存在体量大于谷歌的超级大客户，产业调研认为为英伟达。 4）OpenAI自建算力，自研ASIC的scaleup侧有望使用OCS，需求进一步扩大。 5）其他云厂商亚马逊、微软、甲骨文等均已进入OCS同步增量甚至量产阶段，OCS正在加速适配云厂商、英伟达巨头生态。 个股逻辑层面： 1）炬光科技OCS MEMS方案微透镜阵列龙头老大且全球唯一，穿透所有 DFAU 方案。 2）腾景科技逐步从绑定coherent的液晶方案向其他方案拓展，当前供应材料占OCS整机价值量10-20%。 3）德科立硅光整机集成领先，但是当前出货量未提升，当前全球份额以MEMS为主，若NV 硅光方案偏好度提升，德科立有望受益。 市场逻辑层面： 1）近期大光（光模块）市场担忧FCC禁令（压制远期估值）、筹码结构（持仓拥挤套牢盘多）等问题，有产业变化的小光标的超额收益更突出，小光（CPO/NPO/OCS）受益从0-1的技术升级而不受AI资本开支边际变化影响，锐度更高。小光中，OCS属于科技板块中少数行业需求超预期/上修的，所以从这个角度看，不是交易反弹，是有望奔着新高去的，机构预计本轮行情强度预计不弱于2026年4月的行情。 2）9月光博会，10月OCP大会等预计更多厂商会展出OCS产品。同时行业进展上较多环节的供应商如透镜阵列，隔离器，准直器，连接器等都已经拿到forecast或订单。 3）当前OCS处于产业链变化的节点，继续逢低关注NV应用层级的变化带来龙头公司的新增量，当前处于强预期的从0-1炒作阶段，2027年将逐步从“强预期弱现实”向”强现实“过渡，但仍要注意阶段性产业催化与乐观预期打满反馈过后的震荡调整，逢低关注2026-2027年全年维度的投资机会，没在车上的不急于追高，因为OCS在28年才会迎来应用的非线性上涨。---xz#文字观点", "publish_time": "2026-09-04 17:15", "tags": ["文字观点"]}, "post:2026-09-04T09-01:46064288572f": {"id": "post:2026-09-04T09-01:46064288572f", "kind": "post", "title": "2026-09-04 09:01", "source_label": "帖子正文", "excerpt": "🔥🔥盘前再call#【联讯仪器、优利德】：光模块测试仪器“一大一小”！！", "content": "🔥🔥盘前再call#【联讯仪器、优利德】：光模块测试仪器“一大一小”！！ 今年4月以来，我们团队持续坚定推荐【光模块测试仪器板块】：是一个极速通胀的赛道，受光模块技术迭代助推，需求爆发性不亚于PCB设备，#是下一个超级成长的赛道！#三重逻辑：1️⃣技术迭代：我们认为，一代光模块，需要一代测试仪器，其中采样示波器技术门槛最高，被誉为电测领域“皇冠上的明珠”，＃“得采样示波器者，＃得光模块仪器天下”。800G→1.6T→3.2G，示波器不能复用，要全部更换，属于新增需求。 2️⃣高通胀：800G→1.6T，是德报价从10万美元提升至40万美元，#3倍提升！我们外发报告《光模块测试仪器专题报告：AI算力驱动代际升级，国产替代正当时》测算，全球800G以上仪器需求26-28年达460亿元以上，市场需求快速扩容，爆发中。 3️⃣玩家缩圈：800G→1.6T→3.2G，测试门槛大幅提升，无法跟随技术迭代的仪器厂商会被淘汰，头部玩家数量减少，集中度提升。同时#全行业面临“需求过剩供应不足”，国产厂商迎来替代窗口期。抓住风口者，方能成为行业龙头。#核心推荐：1️⃣【联讯仪器】：5月初，基于1.6T的核心卡位和重大预期差，在公司1300亿市值左右，我们旗帜鲜明的提出，#2000亿市值以下的联讯可随时重仓参与，每次回调均提示加仓机会，目前公司市值已达2600亿，即将新高！现阶段，基于#【光模块+光芯片+存储+soc+cpo】五重逻辑催化，我们提出，4000亿市值以下的联讯，胜率和赔率双高，可随时参与！ 2️⃣【优利德】：小联讯，有望成为国内第二家推出1.6T（65G）采样示波器的公司，核心采保芯片流片顺利，且#三大件（采样+时钟恢复+误码仪）同步研发推进，稀缺性突出，近期有望推出样机，年底前有望小批量订单！预期差大！ 至少看200亿市值！ 详细内容，欢迎私信沟通～联系人：中泰机械 谢校辉#文字观点", "publish_time": "2026-09-04 09:01", "tags": ["是下一个超级成长的赛道", "三重逻辑", "3倍提升", "核心推荐", "文字观点"]}, "post:2026-09-04T08-40:96e40afb45e4": {"id": "post:2026-09-04T08-40:96e40afb45e4", "kind": "post", "title": "2026-09-04 08:40", "source_label": "帖子正文", "excerpt": "液冷板块深度跟踪更新&先知小秘圈独家机构交流总结： 1. 液冷板块前期调整原因分析 市场归因的调整因素包括两点：一是科技板块整体波动，液冷作为AI产业链核心环节随板块同步调整；二是大摩发布报告测算液冷单机柜价值量增幅较低，部分投资者认为液冷单瓦价值通缩", "content": "液冷板块深度跟踪更新&先知小秘圈独家机构交流总结： 1. 液冷板块前期调整原因分析 市场归因的调整因素包括两点：一是科技板块整体波动，液冷作为AI产业链核心环节随板块同步调整；二是大摩发布报告测算液冷单机柜价值量增幅较低，部分投资者认为液冷单瓦价值通缩；三是英伟达将芯片盖板从两片改为一片，引发市场担忧情绪传导至大陆液冷企业。 分析师对上述负面逻辑的反驳：大摩测算的假设条件存在商榷空间，伯恩斯坦测算同类型机柜液冷价值量可实现翻倍，且行业核心逻辑是未来机柜功耗将持续提升，散热需求持续增长，液冷价值量整体呈上升趋势，无需纠结单一机构的测算结果。英伟达盖板方案调整主要影响台湾盖板企业建策，大陆液冷企业主营服务器芯片冷板、CDU等产品，与盖板不属于同一维度产品，该事件对大陆液冷企业无实际影响。 市场预期修正：液冷公司一季度业绩尚未在报表端兑现，市场信心不足，属于板块发展过程中的正常波动，近期各家公司半年报密集发布，飞龙半年报明确订单开始放量，基本预示着行业在下半年即将迎来收入和利润的释放，英维克二季度业绩也开始逐渐好转，市场修正预期，开始反馈行业从26Q3开始有望逐步迈过0-1进入业绩释放阶段，27/28年多个子板块利润有望大幅上涨。 投资节奏：当前行业不是简单看某一季度利润，而是要看订单、扩产、交付和报表或者业绩是否持续接力；26年9-10月是催化密集爆发期、Q3重点看订单确认和排产爬坡、Q4重点看批量交付、收入确认和毛利率变化；2027年上半年进入份额提升和盈利回归阶段，短期受到的供给紧缺或者产线利用率低带来的扰动预计都会缓释，同时也要注意27年下半年液冷行业中竞争格局一般技术门槛较低的细分环节在国内和东南亚扩产起量后的同质化内卷价格战的情况，预期可能先行反馈。 2. 液冷行业需求与市场空间预测 需求释放节奏：液冷需求释放具有非线性特征，2026年上半年行业订单出货尚未起量，2026年6-7月后出货量将大幅提升，其中GB300 Rubin机柜、谷歌TPU V7/V8集中在2026年二、三季度出货，三季度出货强度更高。 订单将逐步传导至上市公司：代工链企业2026年Q2就会出现业绩体现，ASIC系统方案及核心部件企业订单将分批滚动下发，大量出货集中在2026年三季度初。 液冷订单采用滚动下发模式，当前行业处于“有多少产能就下多少订单”的状态，2026年二季度末到三季度订单量级将明显上升，1-3个月内相关公司订单会有较大提升。 市场规模增长：2025年是液冷技术元年，未实现商业化放量，全球液冷市场规模仅100多亿，国内市场基本为0。2026年仅英伟达GD300加少量Rubin对应的液冷市场空间就达到600-700亿元人民币，叠加谷歌ASIC等需求，2026年全球液冷市场规模接近千亿，同比2025年增长4-5倍。长期来看，仅服务器领域液冷市场规模就将达到2000亿元以上，且随着下一代更高功率机柜推出，液冷价值量呈通胀趋势。 产业链传导特征：当前订单大量集中在台资代工厂，逐步向国内供应链分散，台资代工厂2026年出货量同比2025年增长4-5倍，2027年扩产规模将较2026年增长3-5倍。 3. 系统方案总包/EPC环节 环节优势：可吃到液冷产业链最大价值量，且行业门槛极高，需要具备全面的品类布局、海外项目落地经验以及长期可靠性验证，国内仅有少数企业具备相关能力。 英维克、申菱环境：已获得海外客户认证，项目已在海外落地，2026年将有大量订单落地，二季度末、三季度初订单量级将明显上升，可通过预付款、合同负债等科目验证订单增长。 该环节长期空间广阔：若单家企业获得10%-20%的市场份额，年液冷收入可达到300亿以上，海外业务毛利率可达40%以上。 4. 柜内液冷龙头鸿富瀚交流反馈 液冷放量加速利润弹性释放：液冷仅阿里明年有望贡献6亿+利润：按照明年1万柜，单柜60-70万，份额45%对应30亿+收入，20%净利率测算对应6亿+利润。 其他客户后续也会有突破：拿了多家大厂的代码尤其目标重点突破META（目标份额30%以上）和AWS，NV拿到了RVL，Rack Manifold上了算博会NV的展台（单柜需求大概4000-6000美元）。目标明年液冷加起来做到40亿规模，利润还有上修空间。 明年有望10亿+利润，对应目前PE不足20倍，估值较低。先知研报小秘圈内8月25日点评时提示估值仅11倍出头。 5. 液冷泵环节定位与价值量 液冷系统核心部件包括冷板、CDU、快接头、manifold，其中CDU是液冷系统的核心，价值量占比最高；液冷泵是CDU的核心部件，价值量占CDU的三分之一左右。 液冷泵的采购时间早于CDU，液冷泵的需求和订单是CDU出货量的前置指标。 液冷泵环节投资价值：CDU环节海外+国内有十几家厂商参与，竞争相对激烈；液冷泵环节国内参与厂商较少，竞争格局更优，利润率保持较好，是液冷产业链中优质的投资环节。 飞龙股份：2026年中报披露，μ平台（200瓦以下）、S平台（200瓦-2000瓦）、M平台（2000瓦-10千瓦）的液冷泵、液冷阀终端订单合计超过5万台，配套客户包括申菱环境、H3C、宝德、曙光、数创等；L平台（10千瓦以上大功率泵）订单达到近万台，核心客户包括英维克、台达、施耐德、同飞、申菱环境、字节跳动、阿里等。 大元泵业：与飞龙股份同为国内液冷泵核心厂商，竞争格局较好。 业绩兑现预期：2026年三季度、四季度随着海外云服务商订单在国内结算，飞龙股份、大元泵业将有确定性的业绩兑现。 6. 台资代工链上游环节 环节特征：台资供应链筛选标准严格，且需要英伟达的严格审查，同时要求与台资代工厂有长期合作历史（5-10年以上），行业实际有效参与者数量远少于市场预期，卡位优势明显的企业如金富科技、奕东电子等将充分受益于行业爆发。 金富科技：传统冷板用波纹管、铜管订单已供不应求，产能加速扩张；新增中央分水器（manifold）产品已实现爆单，主要供应台达等客户，核心竞争力为钎焊技术，该单品预计可带来十几二十亿年收入、5-6亿年业绩，且产品毛利较高；2026年Q2子公司并表业绩表现较好，Q3、Q4产能爬坡后业绩将进一步提升。 7. 光模块液冷Cage环节 行业趋势：2026年1.6T光模块液冷渗透率仅20%左右，2027年渗透率将提升至60%-80%甚至更高，叠加风冷模组需求，整体市场规模将达到200亿元以上。 液冷Cage市场空间保守测算（基于2026-2028年1.6T光模块出货量分别为3000万只、9000万只、1.1亿只的假设）：2026-2028年液冷方案渗透率分别为15%、50%、80%，对应液冷Cage市场空间分别为12.2亿元、113亿元、206亿元。 Cage领域格局：详情请参考先知研报小秘圈内8月21日分享的机构内参PPT。安费诺先教会奕东，部分奕东的人去鼎通做了Cage，行业自此出来两家公司。风冷时代Cage由鼎通、意华两家垄断，份额约为五五开。25年鼎通率先与下游客户开展液冷Cage共同开发，具备先发优势，2026年占据液冷Cage绝 对份额。目前奕东电子的液冷Cage已经在下游大厂开始验证。预计伴随着未来几个月行业大规模订单落地，行业两家公司股价有望迎来跃进。---xz#文字观点", "publish_time": "2026-09-04 08:40", "tags": ["文字观点"]}, "post:2026-09-04T08-47:99a81d282d15": {"id": "post:2026-09-04T08-47:99a81d282d15", "kind": "post", "title": "2026-09-04 08:47", "source_label": "帖子正文", "excerpt": "看好标的，我们上市至今已经上调了4次模型，二季度的业绩、利润率我相信各位领导也验证了我们的观点，后续的业绩依然值得期待，我们一起见证。", "content": "【国金机械-前沿制造】写在联讯仪器新高之际：AI设备今年最强推荐！ 各位领导，今天联讯仪器股价再次大涨，7月以来的调整全部收复，接近新高！联讯成为本轮AI设备反弹排头兵，一路推荐过来再汇报下个人的感悟，以及最近的一些边际变化。 自公司上市以来，我们发布了市场首篇深度覆盖报告，并且多次电话会坚定CALL，公司自从上市以来涨幅超过3倍，我在第一次重大推荐时候就跟领导们汇报#这是我从业以来最看好标的，我们上市至今已经上调了4次模型，二季度的业绩、利润率我相信各位领导也验证了我们的观点，后续的业绩依然值得期待，我们一起见证。 1、为什么当下节点我们仍然看好联讯？ 联讯的对标模板，不应该是是德科技、不应该是爱德万测试，而是早年的安捷伦集团（安捷伦≥是德+爱德万）合计市值超过1.4we，重新理解联讯的天花板。 联讯的核心能力：高速信号处理能力+微弱信号处理能力+运动控制能力；本质是光能力+电能力+自动化能力，这三个能集于一身的公司可谓稀缺至极，这也是公司能从光到存的底层，也是为什么公司可以和全球头部公司绑定的核心。 我们认为2500e只是联讯的起点，未来的空间和预期差仍然非常大，值得关注的远不止业绩，欢迎一起探讨。 2、电话会复盘 9月2日联讯仪器深度汇报 8月31日下一个联讯还是联讯 8月30日AI新技术铲子股首推联讯 5月21日如何理解联讯仪器的定价？ 3、联讯仪器报告 《联讯仪器深度：联光测宇、讯通未来》 《联讯仪器点评：26Q2业绩超预期》 《联讯仪器点评：26H1业绩高增，净利率创历史新高》 关于联讯的模型、观点、报告欢迎向我们索取资料。 联讯仪器研究就看国金机械-前沿制造#文字观点", "publish_time": "2026-09-04 08:47", "tags": ["文字观点"]}, "post:2026-09-04T08-51:e7fa6b2bafc3": {"id": "post:2026-09-04T08-51:e7fa6b2bafc3", "kind": "post", "title": "2026-09-04 08:51", "source_label": "帖子正文", "excerpt": "核心观点：高盛在2026年亚洲领导者大会上与澜起科技管理层进行了交流，重点讨论了DDR5 RCD及MRCD/MDB产品迭代、新产品放量以及利润率前景。", "content": "高盛——澜起科技（688008）——2026年亚洲领导者大会要点：PCIe交换机/CXL MXC芯片拓展中；新一代DDR5放量；买入评级 • 核心观点：高盛在2026年亚洲领导者大会上与澜起科技管理层进行了交流，重点讨论了DDR5 RCD及MRCD/MDB产品迭代、新产品放量以及利润率前景。管理层对新一代DDR5接口IC芯片推动产品结构优化保持乐观，尽管短期存在定价压力，并预计MRCD/MDB解决方案将逐步放量以满足更高的内存带宽需求。在新产品方面，公司正致力于CXL MXC芯片和PCIe交换机芯片。高盛维持对澜起科技的“买入”评级。 • 新产品进展：DDR5第三代/第四代RCD芯片已成为2026年上半年的主要收入来源，公司已于2026年上半年开始DDR5第五代产品的量产。管理层透露，速率达9200 MT/s的DDR5第六代RCD芯片目前处于送样阶段。此外，公司在新产品上取得以下进展：在2026年推出PCIe 6.x重定时器后，已启动PCIe 7.0的研发；PCIe交换机芯片目标在2026年底前完成流片；CXL 3.2 MXC芯片的首批试生产已于2026年7月启动，生态系统正在扩展。高盛认为产品结构升级将推动增长和更好的盈利能力，同时多种新产品将带来增量收入。 • 估值与目标价：A股12个月目标价为380.00元人民币（基于2030年预期每股收益折现，目标市盈率48.1倍，较当前股价有78.4%的上涨空间）；H股12个月目标价为572.00港元（基于2030年预期市盈率66.4倍，较A股估值溢价38%，有100.7%的上涨空间）。当前A股股价213.00元人民币，H股股价285.00港元。 • 财务预测：公司营收预计将从2025年的54.56亿元人民币增长至2028年的155.67亿元人民币；每股收益预计从2025年的1.95元增至2028年的5.78元。2026年预期市盈率为62.0倍，2027年降至50.0倍，2028年进一步降至36.9倍。 • 主要风险：下行风险包括内存接口IC市场增长弱于预期、新产品推出慢于预期以及市场竞争比预期更激烈。#文字观点", "publish_time": "2026-09-04 08:51", "tags": ["文字观点"]}, "post:2026-09-04T10-19:0de3ac970c02": {"id": "post:2026-09-04T10-19:0de3ac970c02", "kind": "post", "title": "2026-09-04 10:19", "source_label": "帖子正文", "excerpt": "【西部计算机郑宏达团队】重视GPT6的新架构：Recurent Depth 1、Recurrent Depth：复用同一组Transformer层做多次循环迭代。", "content": "【西部计算机郑宏达团队】重视GPT6的新架构：Recurent Depth 1、Recurrent Depth：复用同一组Transformer层做多次循环迭代。中间思考全部发生在神经网络隐藏向量（隐空间），不会输出成可读的文字token。传统CoT思维链：思考步骤全部写成文字token吐出来；Recurrent Depth：思考在内部循环完成，不需要输出中间思考token。 2、#用计算换存储，模型权重只有一套，KV缓存增长放缓，内存压力降低；同一组层反复跑很多次，每一步token的计算量显著变大。堆HBM容量的逻辑减弱。 3、简单问题循环次数少；复杂几何、3D、科学任务，自动跑更多循环迭代，动态分配推理算力，这也是GPT6的ARC‑AGI分数暴涨的重要原因 。 4、大规模循环深度集群，节点之间高频交换隐状态向量，对低延迟高速互联、NVL多卡直连、高速以太网交换机需求抬升。同时GPU算力卡依然受益。 5、A股标的：盛科通信、澜起科技、寒武纪、海光信息、锐捷网络。#文字观点", "publish_time": "2026-09-04 10:19", "tags": ["文字观点"]}, "post:2026-09-04T15-06:0bde9f847313": {"id": "post:2026-09-04T15-06:0bde9f847313", "kind": "post", "title": "2026-09-04 15:06", "source_label": "帖子正文", "excerpt": "核心观点：#长期来看，基于目前全球航运船队老龄化及新能源化的底层逻辑，叠加全球地缘政治冲突激烈化、全球贸易格局碎片化趋势，集装箱船、油轮、散货船行情轮动交替演绎，我们判断本轮造船景", "content": "造船行业周度更新系列（26）：新船价格继续上涨，造船&海工长景气周期趋势向好，重点看好#松发股份、中集集团、中国动力、中国船舶#8月份以来新船价格延续上涨趋势：本周Clarksons新船价格指数186.34点，环比上周小幅上涨。二手船价格指数达214点，环比上月上涨0.7%，突破前高。目前Clarksons新船价格指数较21年初价格底部上涨49%，较年初上涨0.4%。同时钢材价格持续下跌，较5月高点下跌5.8%，创下年内新低。#新船价格-钢材价格剪刀差趋势继续扩大，造船厂盈利能力持续向好。 #2026年上半年新船订单创2007年以来新高： 2026年7月全球新船订单约450万CGT/130亿美金，同比持平。2026年上半年全球造船订单约4700万CGT/1500亿美金（油轮/集装箱船/散货船/LNG运输船分别占比35%/29%/12%/14%），分别同比增长78%/82%，新船订单量超过2 调十万卡级集群训练的意义；华鑫AI提示Recurrent Depth新架构——复用同一组Transformer层做多次循环迭代。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>半导体/先进封装——长电科技65亿定增加码先进封装\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：封测及上游产业链受益于HPC、存储国产化与先进封装扩产；玻璃基板封装、TGV激光微孔加工、硅晶圆激光隐切等新工艺设备需求受关注。\u003c/li>\n\u003cli>今天出现的催化/验证：长电科技公告投资95.7亿元扩产，拟定增募资不超65亿元，其中高性能计算23.5亿元、高端电源模组16.4亿元、晶圆级封装18.3亿元、存储芯片18.5亿元；东吴电子点评指出HPC为重点投入方向；德龙激光LSD-6130硅晶圆激光隐切设备已获国内存储芯片头部厂商订单并完成量产验证；力芯微依托三星、海力士及国内头部存储客户，AI服务器及AI存储电源芯片已完成多颗48V电源架构新品研发。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>宏观/策略——沃勒鸽派发言引发9月加息预期回摆\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：通胀压力降温迹象叠加褐皮书（就业极小幅增长+价格压力广泛+AI对劳动力影响首次入书）与略高于预期的初请失业金人数，市场按“鸽派”定价。\u003c/li>\n\u003cli>今天出现的催化/验证：国金金属黄金点评指出沃勒鸽派发言、9月加息预期回摆；高盛CAS逐日盯市报告称受沃勒偏鸽讲话影响风险资产反弹；加密市场链上对9月加息预测概率从59%降至42%。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>液冷/电源——订单高增+业绩兑现逻辑扩散\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：头部电源企业均已进入26H2批量订单落地阶段，往27年订单将保持爆发；随芯片升级，电源及电容同步升级，电容用量提升；液冷板块中报已爆出订单，电源企业订单有增长但尚未“爆发”，二者存在时间差。\u003c/li>\n\u003cli>今天出现的催化/验证：天风电新AI电源再推荐指出液冷板块大涨带动电源板块关注度，上游NXW提货情况指向麦米在Rubin系列份额较高；台达PSU事件持续发酵，继光宝后内资电源商或已接到部分转单，江海股份获牛角外溢订单并向海星股份沟通电极箔采购。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>光通信/CPO——OCS与光互联升级逻辑获产业验证\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：AI应用加速落地持续拉动算力和光互联升级；谷歌需求量上修，27年OCS从3万提升至5万，28年v9t OCS用量翻倍及以上增幅；SemiAnalysis拆解谷歌TPU互联路径显示新一代6D架构大幅提升光互联配比，光互联链路增3倍。\u003c/li>\n\u003cli>今天出现的催化/验证：OCS带动小光标的强势反弹；9月光博会、10月OCP大会预计更多厂商展出OCS产品；高盛与罗博特科管理层交流（GS-罗博特科附件），验证光通信设备环节产业进展。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>PCB/CCL——上游成本上涨驱动覆铜板涨价\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>今天强化的逻辑：铜箔和玻璃纤维成本上涨推动CCL价格上调，PCB板块Q3景气度再次验证。\u003c/li>\n\u003cli>今天出现的催化/验证：松下宣布因铜箔和玻璃纤维成本上涨上调CCL价格，自2026年9月1日起出货产品开始执行，部分产品涨幅最高达30%；此前建滔积层板宣布对所有厚度FR-4覆铜板统一涨价10%；某厂商新增3万吨产能爬坡后月产5k吨、月出货环比+67%，下游完全消耗。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>GPT-6正式发布\u003c/strong>：OpenAI于9月3日发布GPT-6 Astra旗舰模型，目前仅向合作伙伴开放；支持105万Token上下文和12.8万Token最大输出，可处理文本及图片输入，并提供low至max五档推理设置；AGI测评（ARC-AGI-3）分数达99%。\u003c/li>\n\u003cli>\u003cstrong>美联储官员鸽派表态\u003c/strong>：美联储理事沃勒表示若下周8月CPI延续改善，倾向于支持9月维持利率不变；CME 9月加息概率定价由59%降至42%。\u003c/li>\n\u003cli>\u003cstrong>长电科技定增预案公布\u003c/strong>：拟定增募资不超65亿元，投向先进封装四项产业项目（合计46亿元），另用于其他与主营业务相关的项目；总投资95.7亿元用于扩产。\u003c/li>\n\u003cli>\u003cstrong>摩根士丹利下调中国股指目标\u003c/strong>：恒生指数目标由28,400点下调至26,550点，恒生国企指数目标由9,900点降至8,900点，MSCI中国指数目标由91点降至80点。\u003c/li>\n\u003cli>\u003cstrong>特斯拉Optimus升级碳纤维骨架\u003c/strong>：人形机器人已正式把碳纤维复合材料应用于四肢骨架结构，原先铝合金构件替换为碳纤维空心管材，重量减轻33%。\u003c/li>\n\u003cli>\u003cstrong>覆铜板涨价落地\u003c/strong>：松下宣布因铜箔和玻璃纤维成本上涨上调CCL价格，9月1日起出货产品执行，部分产品涨幅最高达30%；此前建滔积层板已宣布FR-4覆铜板统一涨价10%。\u003c/li>\n\u003cli>\u003cstrong>台达PSU事件持续发酵\u003c/strong>：继光宝后，据产业链反馈内资电源商或已接到部分转单，江海股份获牛角外溢订单并向海星股份沟通电极箔采购。\u003c/li>\n\u003cli>\u003cstrong>美国商务部长卢特尼克表态\u003c/strong>：正在考虑对进口半导体加征新一轮关税，在美国建厂就豁免，不建厂就交税；市场担心三星、海力士没有美国建厂。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>9月美联储议息会议\u003c/strong>：沃勒表态“若8月CPI延续改善，倾向于支持9月维持利率不变”，下周8月CPI数据将成为关键验证；9月为财政融资大月，需观测沃什与贝森特的博弈。\u003c/li>\n\u003cli>\u003cstrong>GPT-6商业落地与算力需求验证\u003c/strong>：GPT-6高定价（$10/$50每百万token）能否被市场接受、推理算力额外投入20%用于监控、模型转向Compute Bound而非Memory Bound的判断，以及由此对GPU/ScaleUp、CPX、SRAM、DRAM需求结构的影响；OpenAI已在训练更大参数量模型。\u003c/li>\n\u003cli>\u003cstrong>长电科技定增后续进展\u003c/strong>：65亿元定增的审批进程、募投项目（高性能计算23.5亿元、高端电源模组16.4亿元、晶圆级封装18.3亿元、存储芯片18.5亿元）的落地节奏，以及对封测设备和上游产业链的带动。\u003c/li>\n\u003cli>\u003cstrong>AI电源板块订单兑现节奏\u003c/strong>：头部电源企业26H2批量订单落地情况、麦米在Rubin系列份额的验证、电容及电极箔涨价/外溢订单（江海股份→海星股份）的传导持续性。\u003c/li>\n\u003cli>\u003cstrong>OCS产业进展\u003c/strong>：谷歌27年3万→5万台上修及28年v9t OCS用量翻倍的执行情况；9月光博会、10月OCP大会各厂商OCS产品展出；NV应用层级变化节奏（2027年从“强预期弱现实”向“强现实”过渡）。\u003c/li>\n\u003cli>\u003cstrong>存储芯片产业链验证\u003c/strong>：三星、海力士等国际客户及国内存储大客户的电源芯片规模化供货节奏（力芯微）；字节新一代豆包手机（努比亚NaviX Ultra）搭载长鑫最高速率10667Mbps的LPDDR5X内存的市场反馈；长鑫科技
