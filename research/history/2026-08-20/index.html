求持续高景气，但不同环节的盈利节奏与驱动因素分化明显。🔧AI PCB/CCL/ 载板环节：🏭大力（Ta Liang，3167.TT，未评级）：全球前三的 PCB 机械钻", "content": "📑野村在台北举办亚洲科技路演，与 PCB/CCL/ 载板、散热及 AI ODM 产业链多家龙头公司交流，核心反馈指向 AI 算力链需求持续高景气，但不同环节的盈利节奏与驱动因素分化明显。🔧AI PCB/CCL/ 载板环节：🏭大力（Ta Liang，3167.TT，未评级）：全球前三的 PCB 机械钻孔 / 背钻设备商，也是全球最大 PCB 成型机厂商，在光模块 PCB 成型领域市占领先。 📊目前月产能 300‑400 台，年内通过外包新增 50 台 / 月通用设备产能，2027 年计划提升至 100 台 / 月。 📈上半年高端工具收入占比超 60%，其中成型机受光模块需求拉动，预计下半年收入将超过钻孔设备；但考虑 3 个月的交付确认周期，2027 年上半年钻孔设备收入占比将回升。 🔨8 月已将半导体设备业务分拆为子公司 TLSmart，聚焦先进封装的量测、检测与自动化设备，覆盖 SoIC、CoPoS/FOPLP 及 CPO 等前沿技术，将受益于晶圆代工与 OSAT 的先进封装扩产。 📈景硕（Kinsus，3189.TT，未评级）：未来几年 ABF 载板产能将增约 50%，从 2026 年 4000 万颗 / 月提升至 2027 年 5000 万颗、2029 年 8000 万颗 / 月，不签长期协议，而是通过客户注资或设备代工（2028‑2029 年设备资本支出合同额达 600‑800 亿新台币）绑定合作。 ⚙️BT 载板当前利用率约 75%，受存储需求拉动增长稳健，正探索光模块新机会，或于 2027 年中评估扩产。 🔬已验证混合芯技术（T‑glass+E‑glass）缓解 ABF 玻璃布供应压力，但带嵌入式无源 IPD 或多层芯的 GPU/ASIC 暂不会采用该技术；未参与英特尔 EMIB‑T 载板合作，但对与逻辑代工厂在陶瓷芯、类 EMIB 等新封装技术上合作持开放态度。 🚀华通（Compeq，2313.TT，买入）：业务重心从消费电子转向低轨卫星，再向数据中心产品延伸。 🛰️卫星用户终端 PCB 是今年航天业务主要增长动力，客户正激进扩张用户群，相关板件在台湾及泰国生产；v3 版本板面积与层数双增，单板价值量是 v2 的 2 倍以上，预计 2026 年底起太空级 PCB 增速将加快。 💻数据中心方面，2026 年资本支出预计达 200 亿新台币（2025 年为 70 亿），主要用于台湾及大陆的 mSAP 产能建设以配套 800G/1.6T 光模块 HDI；光模块 mSAP HDI 毛利率有望随规模放量成为各业务线最高。 📅同时正调整产能结构，布局 2027 下半年至 2028 上半年 AI 主板 HDI 机会。 💰因上游材料涨价及产能挤占，客户普遍接受价格调整传导成本压力。 📌野村维持华通 “买入” 评级，目标价 345 新台币，基于 2027 年预期 EPS 11.6 新台币的 30 倍市盈率，当前股价对应 18 倍 2027 年预期市盈率。 🌡️AI 散热与组件环节：🔥双鸿（AVC，3017.TT，买入）：通用 GPU 散热方案标准化程度高，而 ASIC 项目高度定制，ASP 与毛利率更优且竞争更少。 📊服务器收入占总营收约三分之二，其中 70% 来自 AI 服务器；AI 服务器收入中 70% 来自英伟达平台，25% 来自 ASIC。 🔄2026 年下半年将业务重心转向 ASIC，把握量增红利并过渡到液冷方案。 📈二季度毛利率提升由产品组合优化、自动化及良率改善驱动；下半年 ASIC 占比提升将继续支撑毛利率上行，但客户设计切换导致自动化收益减少，产线调试成本或抵消部分红利。 💧Vera Rubin 计算托盘全液冷设计使单托盘散热价值量较半液冷的 Grace Blackwell 提升 50%，尽管 CPU/GPU 冷板因标准化价值量下降。 🔩可拆卸上盖设计不影响冷板价值量。 📌野村维持双鸿 “买入” 评级，目标价 4000 新台币，基于 2027 年预期 EPS 148 新台币的 27 倍市盈率，当前股价对应 21 倍 2027 年预期市盈率。 ❄️台达电（Auras，3324.TT，买入）：下半年收入动力来自 GB300 与 ASIC，通过控费使 OPM 改善幅度超过毛利率。 📅目前可见度显示三季度 GB300 需求强于四季度，Blackwell 需求以急单（可能来自新云厂商）为主，可持续至 2027 年一季度。 💧Vera Rubin 相关收入预计 2026 年四季度启动，下一代 ASIC 项目单托盘液冷价值量是 GB300 的 3 倍，VR200 介于两者之间；Rubin HGX（2 颗 CPU+8 颗 GPU）也将以液冷为主，内存亦将采用液冷方案。 📊上半年液冷收入中 30‑35% 来自机柜歧管，内歧管与快接头合计占 55‑60%，CDU 占约 5%，预计 2027 年 CDU 占比提升至 10%。 📈目标每年毛利率提升 2‑3 个百分点，2026 年上半年毛利率已达 29.0%（2025 年上半年 26.7%，2025 全年 27.4%），预计下半年毛利率更高。 📌野村维持 Auras “买入” 评级，目标价 1840 新台币，基于 2027 年预期 EPS 80.01 新台币的 23 倍市盈率，当前股价对应 12 倍 2027 年预期市盈率。 🔌嘉泽（Lotes，3533.TT，买入）：新服务器平台放量对毛利率改善至关重要，但 AMD Venice 新 CPU 平台渗透慢于预期，2026 年底才起量，英特尔 Oak Stream 平台要到 2027 年一季度才启动放量；两大平台切换将带动新插槽采用及 PCIe 6.0 线缆 / 连接器份额提升，推动加速增长。 ⚠️尽管某服务器 CPU 平台客户 2026 年需求预测更激进，但受内存、PCB 等其他组件短缺影响，下半年服务器板产量略有下滑。 🤝正与某云服务商合作其 ARM 架构 CPU 插槽，预计 2027 年下半年量产；该客户 AI xPU 仍采用板对板连接器，嘉泽暂未进入供应链。 📈下半年 SOCAMM 连接器与快接头收入贡献将超预期。 🔬已布局可拆卸 CPO/NPO 插槽，潜在客户 2‑3 家，其中一家由子公司 Lintes 支持；直接客户的 CPO/NPO 插槽预计 2027 年下半年量产，将相应提升中国大陆及越南产能，近期融资活动（股权配售与可转债发行）将用于产能投资。 💰NPO 插槽尺寸虽小于 CPU 插槽，但因复杂度更高且支持 224G SerDes，ASP 较最新一代 CPU 插槽高 20‑30%。 📌野村维持嘉泽 “买入” 评级，目标价 2720 新台币，基于 2027 年预期 EPS 113.3 新台币的 24 倍市盈率，当前股价对应 14 倍 2027 年预期市盈率。 🖥️AI ODM 环节：🏭鸿海（2317.TT，买入）：除现有云服务商客户外，已开始与规模更大的新云厂商合作，2026 年底起有贡献，2027 年逐步显著。 📋新云厂商项目产品更标准化，比需要机架级定制、工程投入更高的云服务商项目更易规模化，利润率取决于商业模式 ——HGX 产品可能采用代工模式，而机架级解决方案更依赖鸿海自有资产负债表。 🌍正为 AI ASIC L6/L10 机会提前布局产能，选址美国、台湾、墨西哥或欧洲，目标凭借垂直整合与设计能力拿下 40% 的 AI ASIC 项目份额。 📈2026 年资本支出同比增超 30%，主要用于美国、墨西哥及越南的 AI 服务器组装产能，其中测试设备是主要瓶颈，将投资建设更多系统组装与测试产能，因出货前需至少一周的机架级测试。 📌野村维持鸿海 “买入” 评级，目标价 435 新台币，基于 2027 年预期 EPS 25.57 新台币的 17 倍市盈率，当前股价对应 10 倍 2027 年预期市盈率。#文字观点", "publish_time": "2026-08-20 13:53", "tags": ["文字观点"]}, "post:2026-08-20T20-11:f50c6fb21a16": {"id": "post:2026-08-20T20-11:f50c6fb21a16", "kind": "post", "title": "2026-08-20 20:11", "source_label": "帖子正文", "excerpt": "Nature Electronics 2026.08.19 论文投研摘要 标题：Co‑packaged optics for high‑performance computing and artificial intelligence 机构：SK海力士、MIT、弗吉尼亚大学、南洋理工 核心观点 现有", "content": "Nature Electronics 2026.08.19 论文投研摘要 标题：Co‑packaged optics for high‑performance computing and artificial intelligence 机构：SK海力士、MIT、弗吉尼亚大学、南洋理工 核心观点 现有CPO共封装光学大多落地在交换机端口侧，仅解决芯片到光模块的短距互连。AI大模型算力持续提升，真正瓶颈向内转移到XPU算力池与内存池之间（内存墙）。论文提出把光互连继续向内渗透，从交换机往封装内部、芯片‑内存之间延伸，实现柜内更大范围的全光互连。 两大架构方案 1. 算力池‑内存池分离架构（第一张图） 将XPU算力芯片、HBM内存各自形成独立池，依靠光子中介层(Photonic interposer)+光纤完成池间光通信，不再完全依赖传统高速电互连。 • 优势：算力、内存可以独立扩容，灵活配比，适配AI动态算力需求。 • 定位：机柜级全光，超越传统板级CPO。 2. 封装内光子中介层集成方案（第二张剖面图） 在2.5D/3D封装内部嵌入光子中介层，集成波导、光学TSV、Micro‑LED光源阵列、光电探测器，Chiplet（ASIC/CPU/HPU/HBM）直接在封装内部做光信号交互。 • 目标性能：单节点带宽>100 Tb/s，功耗＜1 pJ/bit，延迟＜10 ns。 关键技术路径演进 电中介层 → 2D光子中介层 → 2.5D光电器件共封装 → 3D波导堆叠光子中介层 3D波导是下一代重点，突破二维平面波导带宽上限。 现实瓶颈（产业落地阻力） 1. 光源难题：Micro‑LED阵列、片上光源的良率、热干扰，热量来自XPU/HBM，光器件对温度高度敏感。 2. 光学TSV制造难度高，对位精度要求严苛，成本压力大。 3. 缺乏统一行业标准：PIC光子芯片、EIC电子芯片、内存、算力芯片的协同接口没有标准化。 4. 封装良率：光电混合异质堆叠，任意一个光器件失效就影响整个封装。 对产业链的启示 1. CPO概念外延扩张：市场之前认知是交换机侧CPO；本篇把CPO延伸到GPU‑HBM内存之间，内存厂商（SK海力士）深度下场参与光互连研发。 2. 光子中介层（Photonic interposer）成为核心赛道，不只是交换机，AI算力封装、HBM内存都要用到。 3. 上游受益环节：PIC硅光芯片、光学TSV、3D波导、Micro‑LED光源阵列、光探测器。 4. 短期判断：属于前沿学术方案，距离大规模商用还有周期；中长期会改变AI服务器BOM构成，内存墙的解法不止提升HBM带宽，还有用光互连绕开电带宽限制。 一句话交易纪要 当前CPO停留在交换机，本篇Nature论文论证光互连向内走到算力‑内存之间，光子中介层、光学TSV、3D波导是下一代关键技术，内存厂商深度参与，但热、良率、标准化仍有明显落地障碍。#文字观点", "publish_time": "2026-08-20 20:11", "tags": ["文字观点"]}, "post:2026-08-20T10-44:e42cf5b77743": {"id": "post:2026-08-20T10-44:e42cf5b77743", "kind": "post", "title": "2026-08-20 10:44", "source_label": "帖子正文", "excerpt": "金山软件2026年中报业绩会key updates 1. 集团定位：在AI时代的五层架构中，金山办公、金山云和小米分别占据应用、算力、模型与芯片层，集团作为战略协同制定者和上下连接器，推动“小米+金山”生态从个人连接转向组织协同；集团272亿现金，持续回报股东，同时投入新方向", "content": "金山软件2026年中报业绩会key updates 1. 集团定位：在AI时代的五层架构中，金山办公、金山云和小米分别占据应用、算力、模型与芯片层，集团作为战略协同制定者和上下连接器，推动“小米+金山”生态从个人连接转向组织协同；集团272亿现金，持续回报股东，同时投入新方向；集团AI产品中心研究大模型与企业生产间的gap，下一阶段计划聚焦一两个领域做深做透。 2. 办公软件业务：金山办公将WPS灵犀定位为最懂文档的Agent，选择走垂直专业路线，AI时代专业领域的Agent才能做深做精，而不是与互联网大厂比拼大而全；灵犀和WPS Comate已小范围开放，用户活跃度较高且Token消耗量大，后续计划放量至当前十倍。 3. 游戏业务：《剑网3》的活跃用户数保持稳定，收入波动主要系自研引擎画质相比商业引擎有不足，最晚在明年全面升级画面品质，同时因门派数量已超过20个，运营模式也面临新的调整需求；《鹅鸭杀》于Q1上线后维持较高的DAU，实现了初期战略目标，现阶段以优化用户体验和产品品质为核心，不急于商业化变现。 4. 云业务：持续推进AI算力、MaaS及前线部署业务发展，并围绕智算落地及AI应用需求升级全栈AI能力。采用多种资本开支模式应对高昂投入，包括自采设备服务核心战略客户、利用第三方资源池搭配客户资源以及预付费方式。#文字观点", "publish_time": "2026-08-20 10:44", "tags": ["文字观点"]}, "attachment:files/中银证券-计算机行业“一周解码”：国内CSP资本开支加速+大模型涨价，国产算力景气再-260819.pdf": {"id": "attachment:files/中银证券-计算机行业“一周解码”：国内CSP资本开支加速+大模型涨价，国产算力景气再-260819.pdf", "kind": "attachment", "title": "中银证券-计算机行业“一周解码”：国内CSP资本开支加速+大模型涨价，国产算力景气再-260819", "source_label": "中银证券", "excerpt": "计算机 |", "content": "计算机 | 证券研究报告 — 行业周报 2026年8月19日 强于大市 中银国际证券股份有限公司 具备证券投资咨询业务资格 计算机 证券分析师：苏凌瑶 lingyao.su@bocichina.com 证券投资咨询业务证书编号： S1300522080003 证券分析师：郑静文 jingwen.zheng@bocichina.com 证券投资咨询业务证书编号： S1300525010001 国内 CSP资本开支加速 +大 模型涨价，国产算力景气再 获验证 计算机行业“一周解码” 国产算力产业链正由主题预期逐步转向业绩兑现。我们认为， 腾讯等国产 CSP厂商资本开 支上调与 以DeepSeek 为代表的大模型涨价，正成为持续拉动国产算力需求的两大核心引 擎。产业链有望进入需求高景气、供给加速扩张、业绩持续释放的新阶段。 支撑评级的要点  国产 CSP资本开支 扩张趋势确立。 2026H1腾讯资本开支 达到 847.20亿元，同比大增 82%，其中算力采购规模 提升是腾讯资本开支的主要投向 之一。腾讯作为国内 CSP厂 商中 AI资本开支相对较小的企业， 其资本开支规模的扩大 进一步强化 了国产 CSP的 扩张趋势 ，我们预计阿里、字节等 CSP厂商今年或将进一步扩大资本开支规模 。腾讯 等头部云厂商加大 AI基础设施投入，反映 了大模型应用与云服务需求增长，也意味 着国产算力集群建设将从单点项目逐步演进为规模化、持续化采购。考虑到 CSP资本 开支通常领先于服务器出货和数据中心建设，因此其上调有望依次传导至算力芯片、 服务器、交换机、网络互连等环节，从而提升产业链订单能见度。随着互联网厂商、 运营商及行业客户共同增加 AI相关投入，国产算力的需求基础将更加多元化，行业 景气度的持续性与确定性有望进一步增强。  大模型涨价 佐证算力经济效益正在提升 。近期深度求索对 DeepSeek API 价格进行大幅 调价，采用峰谷定价，其中 旗舰模型 DeepSeek -V4-Pro高峰时段每百万 Tokens输出价 格升至 27元，较现行价格上涨约 350%；空闲时段每百万 Tokens输出价格 13.5元， 是现价的 2.25倍。DeepSeek -V4-Pro上调价格的产业信号意义较强。 一方面，大模型 推理成本伴随参数规模、上下文长度和用户调用量提升而增加，价格调整有助于改善 模型厂商的单位算力回报与商业化能力；另一方面，模型能力提升及付费模式逐步成 熟，将推动大模型行业从“低价获客”转向“价值定价”，改善 AI服务的商业闭环。 我们认为，模型调用价格上升并不意味着算力需求减弱，反而验证了高性能模型供需 紧张及优质算力的稀缺性。随着推理需求由互联网应用向办公、金融、工业、政务等 场景扩散，算力需求将从训练侧集中投入转向“训练与推理并重”，从而带动服务器、 交换机、光互连、 PCB、高速连接器、电源及液冷等基础设施持续扩容。  国产半导体受 AI带动扬帆起航 ，半导体扩产设备先行。 从产业链层面来看，当前国 产算力的主要约束并不在需求端，而主要在于高端芯片及先进制造能力供给不足。 算 力芯片加速迭代，将同步拉动晶圆制造、先进封装、设备、零部 件和材料扩产。前道 环节受益于先进及特色工艺产能建设，后道环节则受益于高算力芯片对先进封装、封 装基板和高密度互连的需求提升。半导体设备作为扩产先行环节，订单景气有望率先 兑现，并进一步向核心零部件、薄膜沉积、刻蚀、清洗、检测及封装设备传导。 存储 产业扩产及长江存储上市等相关资本市场催化，也有望提升国产设备与材料板块的关 注度。 投资建议  国产算力预期持续加强，从最近一周的中报反馈来看，底层硬件核心芯片制造、算力 芯片、交换机芯片、服务器 /交换机组装等业绩 进入兑现阶段 。大模型涨价 +CSP厂商 的资本开支上调成为国产算力持续拉动的核心引擎，我们认为国产算力产业链已经进 入高确定、高成长兑现期，建议继续关注： 【算力底层芯片】 寒武纪、海光信息 ；【算 力芯片制造及封装】 中芯国际、华虹宏力、长鑫科技、盛 合晶微、长电科技、通富微 电、长川科技 ；【服务器及交换机】 浪潮信息、华勤技术、工业富联、紫光股份、锐 捷网络、盛科通信 ；【国产算力光互连】 光迅科技、华工科技、长飞光纤 ；【PCB 及 封装基板】 深南电路、生益电子、方正科技、兴森科技、南亚新材 ；【高速连接器】 华丰科技、电连技术、意华股份； 【液冷散热】 曙光数创、申菱环境、英维克、海达 尔；【AIDC】杰华特、晶丰明源、 新雷能、麦格米特 ；【AI 应用】卓易信息、中控 技术、新大陆、同花顺 。半导体方面，我们认为国产半导体大规模扩产设备先行。国 产算力现阶段的症结不在需求在底层芯片的供给方面，因此半导体从前道晶圆制造 到 后道先进封装都将开启扩产节奏，也将带动半导体零部件、材料需求 增加，短期可以 重点关注 长江存储 上市的催化，建议关注 长江存储 供应链相关标的：联芸科技、拓荆 科技、中微公司、微导纳米、先导基电、迈为股份、骄成超声等 。 评级面临的主要风险  国内互联网厂商及运营商资本开支不及预期； AI应用及 Token需求增长不及预期；国 产AI芯片性能迭代或产能释放不及预期。 仅供内部参考，请勿外传！ 2026年8月19日 国内 CSP资本开支加速 +大模型涨价，国产算力景气再获验证 2 目录 “一周解码 ”——本周重点关注事件 ................................ ................................ 4 大模型涨价 +国内 CSP资本开支加速，国产算力景气再获验证 ................................ ...................... 4 新闻及公司动态 ................................ ................................ ................................ 5 行业新闻 ................................ ................................ ................................ ................................ ................ 5 公司动态 ................................ ................................ ................................ ................................ ................ 6 风险提示 ................................ ................................ ................................ ............ 8 仅供内部参考，请勿外传！ 2026年8月19日 国内 CSP资本开支加速 +大模型涨价，国产算力景气再获验证 3 图表目录 图表 1.芯片及服务器 -行业动态 ................................ ................................ ...................... 5 图表 2.云计算 -行业动态 ................................ ................................ ................................ ... 5 图表 3.人工智能 -行业动态 ................................ ................................ ............................... 5 图表 4.数字经济 -行业动态 ................................ ................................ ............................... 5 图表 5.网络安全 -行业动态 ................................ ................................ ............................... 6 图表 6.工业互联网 -行业动态 ................................ ................................ ........................... 6 仅供内部参考 实例， 工信部7月底召开10 项固态锂电池行业标准征求意见稿讨论会、标准体系从术语分类向全链条技术规范纵深推进，财政部等对固态 电池自9月1日起免征消费税至2028年底、政策红利直接增厚企业盈利空间。三是设备兑现端，先惠技术与 清陶能源联合研发的全固态干法辊压设备已完成交付，固态装备前瞻卡位打开第二增长曲线。产业化节奏上， 2026年为全固态验证元年，广汽启动混合固液电池装车验证，宁德时代、比亚迪分别规划 2027年全固态小批 量生产与示范装车，硫化物电解质成本已下降超 35%推动从\"技术可行\"走向\"经济可行\"。当前板块处于\"排产高 景气+固态装车验证+设备兑现\"三重共振窗口期，继续看好锂电设备与固态电池板块配置价值。 机械板块重点推荐： 中国动力、东威科技、杰瑞股份、中国船舶、恒立液压、奥比中光、三一重工、豪迈科 技、埃科光电、中微公司、先导智能、博众精工、徐工机械、中集集团、华测检测、迈为股份。 风险分析：国内宏观经济波动的风险、海外市场波动的风险、下游扩产不及预期的风险。 下载日志已记录，仅供内部参考 机械设备 行业动态报告 请务必阅读正文之后的免责条款和声明。 目录 总体观点：半导体设备出海初见端倪，世界机器人大会即将开幕利好人形机器人板块 ............................................... 1 专用设备重点子行业观点 .................................................................................................................................................................. 3 工程机械 ....................................................................................................................................................................................... 3 半导体设备 .................................................................................................................................................................................. 3 AIDC发电设备 ........................................................................................................................................................................... 4 PCB设备 ...................................................................................................................................................................................... 4 3C设备 ......................................................................................................................................................................................... 5 油服设备 ....................................................................................................................................................................................... 5 电梯................................................................................................ 考虑到整体消费医疗需求疲软，我们继续对 2026 财年盈利增长持保 守态度，且我们认为公司今年 2季度种植和正畸业务量的提升似乎更多 是由低基数及内部执行驱动，而非由于国内口腔保健需求的整体性复苏 。我们仍预计 2026 财年收入增长 5.5% 。政策依然是一个潜在催化剂： 国家医保局 2026 年5月发布的目录草案拟将口腔种植纳入首批全国统一 医保项目目录，并将基础治疗（牙周洁治、补牙、拔牙、根管治疗）纳 入报销范围。这或将对规模化龙头诊疗量构成结构性利好，且我们认为 通策医疗的社区网格化运营策略能够把握住这一机遇。总体而言，我们 维持 38元人民币的目标价，并维持 “中性 ”评级。 •新策略执行驱动业务量增长。 2季度各业务板块增速：大综合 + 15.6% ，正畸 + 12.7% ，修复 + 8.0% ，种植 + 5.8% ，儿科持平。管理层将 2季 度业绩回升归因于大部制改革（七大专科，医生跨院区调配）以及下 沉策略的执行。 2026 年上半年种植量达到 3.49万颗（增长 8.6% ；其 中2季度 1.9万颗，同比增长 13.8% ），平均客单价下降 3.9% 至7,600 元（集采产品占种植量的 72%）；上半年正畸业务量达 1.1万例（增 长5%），平均客单价约 2.1万元（其中 2季度 4860 例，同比增长 12%）。 2,999 元低价种植牙套餐（通过 800多名社区网格员核销 3,800 颗）带来超 3,000 个新客户，并实现了其他治疗的交叉销售。上 半年门诊总量达 183万人次（同比增长 5.7% ），次均收入同比基本持 平。分地区来看，上半年浙江省外医疗服务收入同比下降 12%，浙江 省内增长 6.6% ，凸显了对本省市场的依赖。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 2 中国 证券研究 2026 年8月18日 赵悦伦 , CFA (86-21) 6106 6256 eric.zhao@jpmorgan.com •随着公司执行下沉策略，蒲公英医院继续实现强劲增长；紫金港医院 快速爬坡。 49家蒲公英医院 2026 年上半年实现收入 4.57亿元（同比 增长 17%，占总营收的 32%），毛利率 33%，净利润 8,570 万元（增 长51%）； 49家分院中 36家实现盈利（占 72%）， 4家盈亏平衡， 9 家处于亏损（均为 2025 年新投运院区）。牙椅约 1,215 张，上半年单 椅产值 38万元（单椅产值最高的院区达 97万元）。管理层预计 2026 年新开三家蒲公英医院，其中两家将在 1-2个月内开业。紫金港医院 1-6月实现收入约 4,000 万元、净利润 1,200 万元， 7月营收超 900万元 ，8月预计超 1,000 万元。 •一次性收益解释了净利润超预期原因。 1.33亿元非经常性项目中， 1.18 亿元计入 “其他非经常性收益 ”，我们认为这来源于以权益法确认的通 策眼科医院投资管理有限公司（ “通策眼科 ”，持股 24%）收益。今年 4月，上市公司同意支付 6亿元现金（上半年已支付 5.4亿元）收购 4 家眼视光公司，这 4家公司合计账面资产净值仅 6,380 万元，几乎全部 由通策眼科出售。通策眼科由此录得约 5.36亿元的资产处置收益，上 市公司随后通过权益法确认 1.28亿元（按其 24%的持股比例），其中 1.18亿元被归为非经常性收益。 •模型更新。 鉴于 2026 年上半年增速与摩根大通预测一致，我们维持收 入预测不变。我们已将 2026 年上半年 1.18亿元的一次性项目纳入 2026 财年净利润预测，从而将预测值上调 14%。我们的目标价及 “中性 ”评级不变。主要上行风险包括全国医保项目目录最终确定纳入口腔种 植，以及蒲公英 /紫金港医院爬坡快于预期。主要下行风险包括业绩指 引重设、儿科业务持续疲软、以及浙江省外业务恶化。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª NBPBqRsMwOxP6M9R7NmOpPoMoQeRnNxPjMqRyR6MtRsRuOtRsMxNsQtP 中国 证券研究 2026 年8月18日 赵悦伦 , CFA (86-21) 6106 6256 eric.zhao@jpmorgan.com 股价表现 年内迄今 1个月 3个月 12个月 绝对 -10.5% 2.0% -6.7% -22.0% 相对 -11.0% -4.0% -3.3% -29.1% 公司数据 已发行股票数（百万） 447 52周股价区间（元） 52.22-32.53 总市值（百万美元） 2,389 汇率 6.74 自由流通股比例 62.9% 三个月日均成交量（百万） 8.72 三个月日均成交额（百万美元） 46.2 波动性（ 90天） 33 指数 SSE ：风格敞口数据源自摩根大通全球市场策略团队；其他所有图表中的数据均为公司数据或摩根大通估算 分析师声明及重要披露，包括非美国分析师披露，见第 6页。 通策医疗公布 2026 年上半年实现收入 15.86 亿元（同比增长 4.1% ，基于 重述后基数），与摩根大通预测一致，归母净利润 4.58亿元（增长 32.7% ）。蒲公英医院 2026 年上半年收入 /净利润增速分别为 + 17%/+51% ，是一大亮点。经常性归母净利润为 3.25亿元（增长 5.7% ）， 1.33亿元 （=4.58-3.25 ）的差额来自非经常性项目，主要来源于一项关联方资产出 售（详见下文）。由于 2026 年上半年并表影响，我们无法单独拆分出 2 季度数据（调整后的 1季度财务数据未予披露）。在业绩发布后的电话 会议上，管理层披露 2026 年2季度口腔医疗服务收入同比增长 8.8% （ 就诊量增长 7.6% ），增速明显高于 1季度。 2026 年上半年毛利率 42.95% （同比增长 2.2个百分点）是另一亮点，管理层将这一改善归因 于： 1）随收入规模扩大带来的固定成本摊簿；以及 2）大综合业务占比 加速提升。管理层重申了约 30%的2026 财年收入增长目标（尽管在我们 看来似乎难以企及），并预计新收购的眼科业务今年净利润超 6,000 万 元。考虑到整体消费医疗需求疲软，我们继续对 2026 财年盈利增长持保 守态度，且我们认为公司今年 2季度种植和正畸业务量的提升似乎更多 是由低基数及内部执行驱动，而非由于国内口腔保健需求的整体性复苏 。我们仍预计 2026 财年收入增长 5.5% 。政策依然是一个潜在催化剂： 国家医保局 2026 年5月发布的目录草案拟将口腔种植纳入首批全国统一 医保项目目录，并将基础治疗（牙周洁治、补牙、拔牙、根管治疗）纳 入报销范围。这或将对规模化龙头诊疗量构成结构性利好，且我们认为 通策医疗的社区网格化运营策略能够把握住这一机遇。总体而言，我们 维持 38元人民币的目标价，并维持 “中性 ”评级。 •新策略执行驱动业务量增长。 2季度各业务板块增速：大综合 + 15.6% ，正畸 + 12.7% ，修复 + 8.0% ，种植 + 5.8% ，儿科持平。管理层将 2季 度业绩回升归因于大部制改革（七大专科，医生跨院区调配）以及下 沉策略的执行。 2026 年上半年种植量达到 3.49万颗（增长 8.6% ；其 中2季度 1.9万颗，同比增长 13.8% ），平均客单价下降 3.9% 至7,600 元（集采产品占种植量的 72%）；上半年正畸业务量达 1.1万例（增 长5%），平均客单价约 2.1万元（其中 2季度 4860 例，同比增长 12%）。 2,999 元低价种植牙套餐（通过 800多名社区网格员核销 3,800 颗）带来超 3,000 个新客户，并实现了其他治疗的交叉销售。上 半年门诊总量达 183万人次（同比增长 5.7% ），次均收入同比基本持 平。分地区来看，上半年浙江省外医疗服务收入同比下降 12%，浙江 省内增长 6.6% ，凸显了对本省市场的依赖。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 2 中国 证券研究 2026 年8月18日 赵悦伦 , CFA (86-21) 6106 6256 eric.zhao@jpmorgan.com •随着公司执行下沉策略，蒲公英医院继续实现强劲增长；紫金港医院 快速爬坡。 49家蒲公英医院 2026 年上半年实现收入 4.57亿元（同比 增长 17%，占总营收的 32%），毛利率 33%，净利润 8,570 万元（增 长51%）； 49家分院中 36家实现盈利（占 72%）， 4家盈亏平衡， 9 家处于亏损（均为 2025 年新投运院区）。牙椅约 1,215 张，上半年单 椅产值 38万元（单椅产值最高的院区达 97万元）。管理层预计 2026 年新开三家蒲公英医院，其中两家将在 1-2个月内开业。紫金港医院 1-6月实现收入约 4,000 万元、净利润 1,200 万元， 7月营收超 900万元 ，8月预计超 1,000 万元。 •一次性收益解释了净利润超预期原因。 1.33亿元非经常性项目中， 1.18 亿元计入 “其他非经常性收益 ”，我们认为这来源于以权益法确认的通 策眼科医院投资管理有限公司（ “通策眼科 ”，持股 24%）收益。今年 4月，上市公司同意支付 6亿元现金（上半年已支付 5.4亿元）收购 4 家眼视光公司，这 4家公司合计账面资产净值仅 6,380 万元，几乎全部 由通策眼科出售。通策眼科由此录得约 5.36亿元的资产处置收益，上 市公司随后通过权益法确认 1.28亿元（按其 24%的持股比例），其中 1.18亿元被归为非经常性收益。 •模型更新。 鉴于 2026 年上半年增速与摩根大通预测一致，我们维持收 入预测不变。我们已将 2026 年上半年 1.18亿元的一次性项目纳入 2026 财年净利润预测，从而将预测值上调 14%。我们的目标价及 “中性 ”评级不变。主要上行风险包括全国医保项目目录最终确定纳入口腔种 植，以及蒲公英 /紫金港医院爬坡快于预期。主要下行风险包括业绩指 引重设、儿科业务持续疲软、以及浙江省外业务恶化。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª NBPBqRsMwOxP6M9R7NmOpPoMoQeRnNxPjMqRyR6MtRsRuOtRsMxNsQtP 中国 证券研究 2026 年8月18日 赵悦伦 , CFA (86-21) 6106 6256 eric.zhao@jpmorgan.com 股价表现 年内迄今 1个月 3个月 12个月 绝对 -10.5% 2.0% -6.7% -22.0% 相对 -11.0% -4.0% -3.3% -29.1% 公司数据 已发行股票数（百万） 447 52周股价区间（元） 52.22-32.53 总市值（百万美元） 2,389 汇率 6.74 自由流通股比例 62.9% 三个月日均成交量（百万） 8.72 三个月日均成交额（百万美元） 46.2 波动性（ 90天） 33 指数 SSE 彭博 买入 |持有 |卖出 10|3|2 重要指标（财年 12月份结束） 单位：百万元，每股数据单位：元 FY25A FY26E FY27E FY28E 财务预测 收入 2,913 3,074 3,595 4,244 调整后的息税折旧摊销前利润 940 1,013 1,038 1,218 调整后的息税前利润 746 845 869 1,047 调整后的净利润 502 603 621 748 调整后的每股收益 1.12 1.35 1.39 1.67 彭博一致预期每股收益 1.19 1.28 1.44 1.62 经营活动现金流 811 879 898 1,046 公司自由现金流 0 548 576 726 利润率和增长率 收入增长率 1.4% 5.5% 16.9% 18.1% 息税折旧摊销前利润率 32.3% 33.0% 28.9% 28.7% 息税折旧摊销前利润增长率 (0.5%) 7.8% 2.5% 17.3% 息税前利润率 25.6% 27.5% 24.2% 24.7% 净利润率 17.2% 19.6% 17.3% 17.6% 调整后的每股收益增长率 0.0% 20.2% 3.0% 20.4% 财务比率 调整后的有效税率 16.6% 16.6% 16.6% 16.6% 利息覆盖倍数 - NM NM NM 净债务 /净资产 NM NM NM NM 净债务 /息税折旧摊销前利润 NM NM NM NM 已动用资本回报率 13.8% 14.5% 13.7% 15.3% 净资产收益率 12.2% 13.5% 12.7% 14.0% 估值 公司自由现金流收益率 0.0% 3.4% 3.6% 4.5% 股息率 1.3% 1.5% 1.5% 1.9% 企业价值 /收入 5.7 5.3 4.5 3.7 企业价值倍数 17.6 16.1 15.5 13.0 调整后的市盈率 32.1 26.7 26.0 21.6 投资理据和估值概要 我们给予通策医疗 “中性”评级。通策医疗成立于 1995 年，是国内领先的口腔医疗连锁机构之一。截至 2025 年 3季度，公司经营有 90多家医疗机构，开设牙椅约 3100 台。我们认为口腔医疗服务行业面临短期及长期挑战，导 致盈利承压。但是，公司近期调整战略，更加侧重于低价 产品和低线城市渗透，这可能改变格局，推动近期业务显 著增长。 我们截至 2026 年12月的目标价 38元基于现金流折现估 值法得出，其中假设市场溢价为 6.2% ，无风险收益率为 3.8% 。我们假设贝塔系数为 1.4（来自彭博），加权平均 资本成本为 11.5% ，估算的自由现金流截止到 2033 年， 并假设永续增长率为 2.5% 。 股价表现驱动因素 资料来源：股价表现驱动因素数据源自摩根大通全球市场策略团队；所有其他图表中的数据均源自公司数据、 Bloomberg Finance L.P. 和摩根大通估算。注：历史股价可能不完整或 不准确。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 中国 证券研究 2026 年8月18日 赵悦伦 , CFA (86-21) 6106 6256 eric.zhao@jpmorgan.com 投资理据、估值与风险 通策医疗股份有限公司 - A (中性; 目标价 : 38.00 元) 投资理据 我们给予通策医疗 “中性”评级。通策医疗成立于 1995 年，是国内领先的口 个方向指向高性能内存技术，另一个方向则指向光通信技术。 然而，实际上人工智能竞赛的重点已经从单个芯片的性能转向了整个系统数据传输的效率。 在过去的几年里，HBM 一直在解决 GPU 接收数据速度不足的问题。 通过将多层 DRAM 垂直堆叠并放置在 GPU 旁边，可以实现极高的带宽传输能力。 然而，当越来越多的 HBM 堆叠层被放置在每个 GPU 周围时，封装面积、中介层空间、电源供应以及冷却系统都面临着极限挑战。 与此同时，人工智能集群已经发展到需要使用数千甚至数万个 GPU。 无论每个 GPU 的运算速度有多快，如果数据无法在 GPU 和服务器之间高效传输，那么整个系统的带宽能力最终还是会达到极限。 SK 海力士的愿景是将光学互连技术扩展到内存领域。 低延迟、高带宽的本地 HBM 内存将继续位于 GPU 旁边，而光纤则可以将它们连接到更大的共享内存池上。 这样就能避免需要将所有内存容量集成在单个 GPU 包中，从而实现在机架级别的水平扩展。 投资影响如下： 这并不意味着 HBM 会很快被取代。 相反，更有可能出现一种新的内存层次结构。 那些经常被访问的数据将保留在本地 HBM 中，而那些较少被访问但体积较大的数据则会被存储在光学连接的存储器池、HBF 或 SSD 中。 SK 海力士正在重新定位自己的业务策略。 它不再仅仅专注于销售标准化的内存芯片，而是选择与客户共同设计 HBM 芯片、控制器、高级封装技术以及系统级内存架构。 如果这一规划能够实现，SK 海力士就能增强客户忠诚度，提升产品附加值，并提高其获得长期合同的能力。 此外，这一策略还能使公司能够积极应对未来内存解耦可能对传统 HBM 业务模式带来的潜在影响。 在供应链层面，长期来看，那些有望获得受益的领域包括硅光子芯片、光学引擎、激光器、光纤耦合技术，以及先进的 2.5D 和 3D 封装技术。 不过，这个概念目前似乎还处于非常早期的阶段 —— 基本上只是一个规划蓝图而已。 今天我与一位参与台积电封装业务的人士进行了交谈，他们完全不知道有这个计划的存在。#文字观点", "publish_time": "2026-08-20 21:37", "tags": ["文字观点"]}, "post:2026-08-20T09-38:f7fd4a456b39": {"id": "post:2026-08-20T09-38:f7fd4a456b39", "kind": "post", "title": "2026-08-20 09:38", "source_label": "帖子正文", "excerpt": "📑罗森布拉特：光学板块 —— 罗森布拉特 AI 科技峰会光学板块核心观点 📝摘要 🔹本周，我们在罗森布拉特第六届 AI 时代科技峰会上接待了 11 家覆盖的公司，其中 7 家参与炉边谈话。这批公司中包含我们重点关注的三家标的：朗美通、科锐、应用光电，这几家公司生产磷化铟激光器、光器件、光模块，以及 ", "content": "📑罗森布拉特：光学板块 —— 罗森布拉特 AI 科技峰会光学板块核心观点 📝摘要 🔹本周，我们在罗森布拉特第六届 AI 时代科技峰会上接待了 11 家覆盖的公司，其中 7 家参与炉边谈话。这批公司中包含我们重点关注的三家标的：朗美通、科锐、应用光电，这几家公司生产磷化铟激光器、光器件、光模块，以及 NPO/CPO 相关解决方案。整场会议交流的整体基调高度乐观。我们提炼出的行业核心观点如下： 🔹需求持续大幅高于供给，订单能见度已经延伸至 2028 财年。 🔹市场对于 CPO/NPO 的需求有所抬升，部署时间节点并未向后推迟。 🔹第一阶段规模扩张机遇已经开启，规模上量周期将于 2027 年年中启动。规模上量对应的光模块潜在市场规模最终有望达到规模扩容市场的 3 倍。对于光器件厂商，规模上量市场是 100% 增量市场；规模扩容市场虽然同样可以带来营收增长，但会对光模块市场形成替代效应。 🔹尽管中国激光器厂商可以大幅扩充产能，但在可预见的未来，它们很难压低激光器价格，其技术节点持续落后市场头部厂商大约两代，CPO/NPO 激光器领域差距尤为明显。 🔹短期来看，激光器价格仍将维持快速环比上涨态势。虽然价格增长后续或有所放缓，但长期协议将保障在本十年剩余时间内，价格涨幅仍会优于历史常规水平。 🔹我们维持对朗美通、科锐、应用光电的买入评级。 📈每 GPU 对应的规模上量光模块潜在市场规模最终约为规模扩容的 3 倍 🔹规模上量场景下，单 GPU 发射机带宽需求是规模扩容场景的 9 倍。不过多层交换拓扑架构下，规模扩容场景需要 3 倍数量的光链路，因此整体市场规模仅为规模上量场景的三分之一。关键点在于，对于光器件厂商，规模上量市场是 100% 全新增量市场，当前该市场几乎没有已落地的规模上量产能。 🔹在规模上量网络中，CPO 可以直接替代传统可插拔光模块。但只有超高功率连续波激光器的平均销售单价高于 N 倍的电吸收调制激光器平均销售单价时，CPO 才会带来激光器市场的增量机会，N 代表 4 或者 8 的光分路比。总体而言，虽然规模扩容依旧可以为更广的市场带来营收增量，但规模上量打开了体量更大、长期成长空间更可观的赛道。 💎激光器平均销售单价将继续上行，但后续增速会有所放缓 🔹100G/200G 电吸收调制激光器与连续波激光器现货价格近期受高带宽需求占比提升拉动，出现环比大幅上涨。随着朗美通与科锐越来越多订单签署长期协议，我们预计平均销售单价的扩张速度将回归常态化，每年涨幅 15%‑20%。 🔹相较于此前现货价格的暴涨，虽然增速有所回落，但该价格走势依旧极为向好，AI 时代之前行业典型特征是每年价格下滑 10%‑20%。 ⚠️我们对中国激光器厂商带来的竞争威胁担忧有所下降 🔹中国厂商距离产出 300 毫瓦激光器产品仍有数年时间，并且大概率会持续落后美国供应商约两代技术节点。核心的 1‑2 个头部技术节点决定行业绝大多数平均销售单价以及盈利水平，这就限制了中国竞品在行业利润最丰厚赛道的议价能力。 🔹中国制造的 1.6T 硅光光模块或许会在未来 18 个月迎来更强竞争力，但 CPO 所需的高功率、超高功率激光器，恰恰是美国厂商护城河最深，也是行业未来发展的核心方向。 📝会议上光模块公司核心要点信息 🔹朗美通持续展现行业龙头地位，在磷化铟激光器、1.6T 光模块、光电路交换机、NPO/CPO 架构方面拥有出众的运营落地能力。终端市场需求持续加速，公司产品基本维持满产状态。新投放产能落地速度快于市场预期。总而言之，公司利润率处于有利位置，随着低边际利润 1.6T 光模块出货量爬坡，盈利有望进一步扩张。市场已经可以看到 2028 财年约 60 美元每股的盈利预期，我们再次重申强烈买入观点，给予超配评级。 🔹应用光电对自身持续资本开支能够在未来带来丰厚回报抱有极强信心。终端需求强劲，至少未来一年供给端依旧紧张，客户愿意为美国本土制造支付溢价。垂直整合是应用光电的核心差异化优势，公司自研自产激光二极管，已经向五家潜在客户交付 300 毫瓦 CPO 激光器样品。多维度产能扩建正在推进，应用光电有望将自身光模块市场份额从当前的个位数提升至 10%‑20%。公司股票拥有可观的阿尔法收益潜力，我们重申买入评级，将其列为首选标的。 🔹科锐已经做好准备，将在 2027 财年实现营收加速增长，同时利润率稳步扩张，运营动能将延续至 2028 财年。公司距离目标毛利率区间越来越近，我们预计其长期财务模型将在 2027 财年或之前兑现。运营层面信心充足，6 英寸磷化铟晶圆良率将稳步提升，推动芯片成本效率大幅改善。科锐掌握关键的共封装光学技术，包含光隔离器、高速光电探测器、保偏光纤等全套底层器件。长期来看，我们预计科锐与朗美通能够实现相近的利润率水平。重申科锐买入评级，认为其是具备多年成长逻辑的核心标的，拥有可观的上行空间。 朗美通 🔹本次峰会我们开展炉边谈话以及小组会议，参会人员包含全球业务单元总裁袁武平，投资者关系副总裁陶凯茜，核心要点整理如下。 🔹AI 已经从底层重构光通信行业，磷化铟的地位不可替代。管理层将本次变革定义为一场革命，而非渐进式迭代。AI 把光通信从连接计算设备，转变为连接计算与存储。铜介质已经触碰物理极限，磷化铟不可替代。硅芯片产生热量而非光线，磷化铟激光器芯片越来越多地集成进硅光子平台。公司产能扩张节奏维持 1/3 产品迭代，1/3 产能扩充。 🔹超高功率激光器分为三阶段落地，覆盖三座工厂，泵浦产能计划翻两番。超高功率激光器产能扩张分为三个阶段：第一阶段位于圣何塞，持续至 2027 年上半年；第二阶段落地英国卡斯韦尔，持续至 2028 年；第三阶段落地北卡罗来纳州格林斯伯勒，2028 年之后。未来 12‑18 个月，泵浦激光器产能计划提升 4 倍。管理层表示实际所需产能可能高于该预期。格林斯伯勒工厂规划 6 英寸晶圆产线，但 6 英寸基板良率与处理工艺依旧存在不小挑战，行业预计还需要两年时间解决两项核心问题。基板供给依旧是 7 年周期长周期项目，公司已经和日本供应商达成合作，同时和 AXT 签订协议，在美国、日本、欧洲多地布局产线，以此降低中国出口风险。 🔹来自中国的竞争威胁至少还需要两年以上时间才会显现。中国激光器厂商受到密切关注，但现阶段产品仅局限于 70 毫瓦级别，向 150 毫瓦、400 毫瓦升级需要完整激光器重新设计，增量迭代空间有限。产能爬坡、工具采购是最大难点，管理层预计至少需要两年以上时间，中国竞品才能形成实质威胁。公司自身产能扩张充足，客户没有理由转向其他供应商。 🔹光电路交换机季度出货量翻倍，1.6T 产品向两大超大规模云厂商供货。光电路交换机营收有望在接下来数个季度实现季度环比翻倍。过去的产品问题主要来自制造和工程爬坡，并非设计缺陷。1.6T 光模块已经向两大头部云厂商交付，先发优势将助力公司拿下定价与份额优势。管理层目标，光模块占营收比重维持在 25%，同时持续抬升高毛利组件业务占比。 🔹3‑4 个季度达成单季度 20 亿美元营收目标不变。本季度营收指引 12.5 亿美元，单季度 20 亿美元营收目标预计会在之后 3‑4 个季度落地。未来 3‑4 个季度毛利率与运营利润率会逐步抬升，到 2027 年下半年，受益于富含组件业务的规模上量业务加速，利润率会迎来更加陡峭的拐点。#文字观点", "publish_time": "2026-08-20 09:38", "tags": ["文字观点"]}, "post:2026-08-20T07-28:564f28952ac2": {"id": "post:2026-08-20T07-28:564f28952ac2", "kind": "post", "title": "2026-08-20 07:28", "source_label": "帖子正文", "excerpt": "【长江电新】横店东磁：2026H1磁材器件收入和利润双增长，锂电盈利能力显著提升 事件：横店东磁发布2026年半年报，2026H1公司实现收入123.42亿元，同比增长3%；归母净利9.48亿元，同比下降7%", "content": "【长江电新】横店东磁：2026H1磁材器件收入和利润双增长，锂电盈利能力显著提升 事件：横店东磁发布2026年半年报，2026H1公司实现收入123.42亿元，同比增长3%；归母净利9.48亿元，同比下降7%；其中，2026Q2实现收入68.63亿元，同比增长2%，环比增长25%；归母净利5.62亿元，同比持平左右，环比增长46%。 1、磁材方面，2026H1出货约12万吨，同比增长11%；收入为21.8亿元，同比增长12%；毛利率为26%，同比下降2pct；器件方面，2026H1收入8.1亿元，同比增长86%，毛利率为21%，同比提升3pct。软磁着力拓展 AI 服务器及数据中心相关产品及市场，芯片供电用铜铁共烧电感产能利用率保持高位，整体收入保持稳步增长。 2、锂电方面，2026H1出货超3亿支，同比持平左右；收入17.5亿元，同比增长36%；毛利率20%，同比提升7pct。在碳酸锂等核心原材料价格宽幅震荡下，公司积极应对市场变化，提升了盈利能力。成功导入多家战略客户并实现批量供货，优质客户储备进一步充实。 3、光伏方面，2026H1出货量超12GW，同比下降10%；收入73.7亿元，同比下降8%；毛利率11%，同比下降6pct，在行业需求阶段性回落、贸易壁垒升级、原材料价格上升的多重压力下，公司严控成本，增强差异化市场开拓，光伏业务持续保持盈利。 4、其他财务指标，2026H1财务费用2.6亿元，而去年同期是-3.1亿元，主要是汇兑损益波动影响；2026H1经营活动现金流净额7.3亿元，同比下降57%，主要是质押定期存款存期与对应业务有效期存在差异，形成现金流时间错配，进而导致保证金回流滞后，以及受2025年上半年子公司收到增值税留抵退税叠加退税率同比下降影响所致。 5、展望后续，磁材器件充分受益AI快速发展，芯片电感收入快速放量，预计2027年将达到8亿元（扩产1.2-2亿颗），谷歌和英伟达是海外主要增量客户，垂直供电相关产品预计在27年下半年到28年起量，公司是唯一拿到相关认证的厂商；一二次电源磁芯市占率达到50%以上，保持龙头地位，27年收入预计超过5亿元；SST磁芯覆盖头部厂商，国内可能更快落地，公司通过投资BCI深度参与产业布局。锂电产能规划在一两年实现翻倍，海外电摩、便携式储能均有增量机会，圆柱电池业务仍有较好的成长性。 6、预计2026-2027年归母净利润分别为19、24亿元，对应PE为18、14倍，继续推荐！#文字观点", "publish_time": "2026-08-20 07:28", "tags": ["文字观点"]}, "post:2026-08-20T07-27:ba6c6a98f48b": {"id": "post:2026-08-20T07-27:ba6c6a98f48b", "kind": "post", "title": "2026-08-20 07:27", "source_label": "帖子正文", "excerpt": "【长江电新】亿纬锂能2026年中报分析：盈利能力稳步修复，后续结构改善显著弹性可期 事件：亿纬锂能发布2026年中报，上半年实现收入456.91亿元，同比增长62.20%，归母净利润33.01亿元，同比增长105.66%，扣非净利润24.51亿元，同比增长111.89%。其中2026Q2实现收入25", "content": "【长江电新】亿纬锂能2026年中报分析：盈利能力稳步修复，后续结构改善显著弹性可期 事件：亿纬锂能发布2026年中报，上半年实现收入456.91亿元，同比增长62.20%，归母净利润33.01亿元，同比增长105.66%，扣非净利润24.51亿元，同比增长111.89%。其中2026Q2实现收入250.12亿元，同比增长62.69%，归母净利润18.55亿元，同比增长268.00%，扣非净利润13.37亿元，同比增长294.05%。 1、就上半年来看，公司动力电池出货35.76GWh，同比增长66.47%；储能电池出货44.46GWh，同比增长54.88%。分业务看，消费电池收入64.11亿元，同比增长26.22%，毛利率为22.64%，同比下降4.04pct，主要是马来西亚基地投产前期爬坡影响。动力电池收入172.78亿元，同比增长53.31%，毛利率为16.19%，同比下降2.97pct；储能电池收入150.94亿元，同比增长69.15%，毛利率为12.51%，同比下降1.36pct。电池材料业务为材料贸易和转销业务，收入为68.66亿元，毛利率为5.29%。 2、拆分二季度来看，公司动储出货为45.5GWh，环比增长超30%，保持高于行业增速，其中动力电池出货21.4GWh，环比增长近50%；储能出货24.1GWh，环比增长18%左右。从盈利能力上看，预计公司动力、储能Wh毛利均有小幅提升，同时得益于高毛利的动力占比提升，整体Wh毛利预计在0.06元左右，环比提升0.003元；同时在规模效应下，Wh净利预计接近0.025元，环比同样有所提升。此外，公司Q2公允价值变动收益-2.40亿元，主要是商品套保影响；投资收益8.58亿元，主要是SK on股权变更影响，其中联营合营投资收益3.68亿元，环比提升明显，得益于公司镍冶炼、材料环节合资公司的盈利增加，资产价值、信用减值分别为-1.41、-1.72亿元，其他收益为4.55亿元。 3、展望来看，公司2026年出货预计将达到200GWh左右，考虑到下半年储能大电芯、马来储能、宝马大圆柱的出货占比、稼动率、良率有望提升，预计单位盈利将维持改善趋势，预计2026年归母净利润75亿元，对应PE为16X，底部明确；2027年公司结构改善将更为明显，大圆柱订单达到40GWh，海外储能客户占比有望达到40%、马来西亚基地也将起量，国内储能大电芯占比提升，此外还有AIDC等增量贡献，预计2027年归母净利润有望达到100亿元，对应PE为12X，继续推荐。#文字观点", "publish_time": "2026-08-20 07:27", "tags": ["文字观点"]}, "post:2026-08-20T15-34:e26bd2c32158": {"id": "post:2026-08-20T15-34:e26bd2c32158", "kind": "post", "title": "2026-08-20 15:34", "source_label": "帖子正文", "excerpt": "调整继续发声❗【天风电新】继续看好上纬新材的投资机会-0820 ——————————— 连续两日调整，主要系市场博弈过重，都在提前蹲宇树上市，但不管怎样，最后我们还是相信基本面定价， 我们对本体和公司的观点如下： 26年国产人形本体类似20年新势力车企，相同点有： 1、密集上市期：20H2新势力扎堆", "content": "调整继续发声❗【天风电新】继续看好上纬新材的投资机会-0820 ——————————— 连续两日调整，主要系市场博弈过重，都在提前蹲宇树上市，但不管怎样，最后我们还是相信基本面定价， 我们对本体和公司的观点如下： 26年国产人形本体类似20年新势力车企，相同点有： 1、密集上市期：20H2新势力扎堆美股上市VS 26H2 国产本体扎堆上市A/H股 2、有大的产业叙事：20年的电动化，26年的具身智能 3、技术端出现突破：20年锂电池解决安全性和经济性，26年AI大模型高速发展 以上类似点+当年特斯拉、蔚来等年度涨幅7倍、11倍，给当下的国产本体带来极具想象力的股价空间。 但1）26H2的国产本体无已跑通的海外龙头特斯拉可对标；2）电动化是存量替代逻辑，汽车总市场空间是明确的，但人形机器人是纯增量逻辑，市场空间不可测。故本体估值难度高。 短期维度直接对标20年的整车，龙头公司交易到次年收入PS的20-25X，则上纬新材短期空间为40亿收入*25X估值=1000亿。 但【人形机器人最大魅力在于成为AI时代的历史性大单品】，#类似工业革命时代的汽车、互联网时代的PC、手机，以上估值法完全低估了中长期成长潜力。故我们采用里程碑期权估值法定价。 第一：对标80-90年代的家庭PC，看人形本体C端成长空间（见图1） 预计人形本体C端27/30/35年全球销量分别为55、850、1760万台，均价3、5、5万元，市场空间165、4250、8800亿。分别对应导入期、中产消费品拐点、大众消费品拐点，核心假设、以及和家庭PC类比关系见图一。 第二：为什么消费人形看好的是【上纬新材】 第一阶段：上纬目前产品定位符合新产品导入期放量特征，类似80年代的家庭PC，面向的是极客、超高收入人群，上纬目前Q1/T1产品兼具极客偏好的科技感、契合超高收入家庭儿童精英教育，个人情感陪伴需求。 第二阶段：技术核心是初具通用人形操作系统，上纬目前侧重大模型、数据采集为进入此阶段奠定了技术基础。产品功能核心是家庭轻度物理生产力，上纬第一阶段的产品定位是进入家庭，积累了数据来源、用户需求等反馈。 第三：如何给【上纬新材】估值（见图2） 我们对27/30/35年上纬市占率假设均为25%，27年系定位此方向重磅玩家稀缺，30、35年系认为能成功活到该阶段稀缺。 27年对标20年新势力车企给25X PS，30、25年按照PE估值法分别给到30、20X（公司为软硬件一体化玩家），但考虑年限较久折现因子取20%，为了考虑未来成长期权，采用概率法，预计走到第二阶段概率为45%，第三阶段20%，折现到当下目标市值为1600亿。 ——————————— 欢迎交流：孙潇雅/张童童#文字观点", "publish_time": "2026-08-20 15:34", "tags": ["文字观点"]}, "attachment:files/光大证券-有色金属行业金属新材料高频数据周报：光伏材料多晶硅价格近7日+22%-260819.pdf": {"id": "attachment:files/光大证券-有色金属行业金属新材料高频数据周报：光伏材料多晶硅价格近7日+22%-260819.pdf", "kind": "attachment", "title": "光大证券-有色金属行业金属新材料高频数据周报：光伏材料多晶硅价格近7日+22%-260819", "source_label": "光大证券", "excerpt": "第1页 / 24页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 锂电池 分析师：牟国洪 登记编码： S0730513030002 mough@ccnew.com 021 -50586980 销量同比 持续增长，板块适度关注 ——锂电池行业月报", "content": "第1页 / 24页 本报告版权属于中原证券股份有限公司 www.ccnew.com 请阅读最后一页各项声明 锂电池 分析师：牟国洪 登记编码： S0730513030002 mough@ccnew.com 021 -50586980 销量同比 持续增长，板块适度关注 ——锂电池行业月报 证券研究报告 -行业月报 强于大市 (维持) 锂电池相对沪深 300指数表现 资料来源： 中原证券研究所 ，Wind 相关报告 《锂电池行业月报：销量增长价格短期承压， 板块谨慎关注》 2026 -07-17 《锂电池行业年度策略：业绩高增长，关注四 条主线》 2026 -06-15 《锂电池行业月报：月度占比持续新高，板块 可关注》 2026 -06-12 联系人： 李智 马嵚琦 电话： 0371 -6558 5629 021-50586973 地址： 郑州郑东新区商务外环路 10号18楼 郑州郑东新区商务外环路 10号18楼 地址： 上海浦东新区世纪大道 1788号T1座22楼 上海浦东新区世纪大道 1788号T1座22楼 发布日期： 2026年08月19日 投资要点： ⚫ 7月锂电池板块指数 走势弱于沪深 300指数。2026年7月，锂电 池指数下跌 18.75 %，新能源汽车指数下跌 10.09 %，而同期沪深 300指数下跌 7.86%，锂电池指数走 势持续弱于沪深 300指数。 ⚫ 7月我国新能源汽车 占比首次超 6成。2026年7月，我国新能源 汽车销售 156.10万辆，同比增长 23.69 %，环比回落 4.99%，月度 销量占比 60.41 %持续创历史新高，同比增长主要 受益于新能源汽 车出口持续高增长 。2026年7月，我国动力电池装 机74.60GWh， 同比增长 33.45 %，其中三元材料 装机占比 14.88%；宁德时代、比 亚迪和中创新航 装机位居前三。 ⚫ 上游原材料价格 短期涨跌互现 。截至 2026年8月14日，电池级 碳酸锂价格为 15.10万元/吨，较 2 ，智算业务放量是核心驱动力。在AI算力基础设施建设持续推进、各地 智算中心需求爆发的背景下，公司凭借项目经验和客户资源快速抢占市场，业绩增长弹性极 大。 永鼎股份：【光通信】公司是国内光通信核心厂商，主营光纤光缆及光器件业务。更关键的 是，公司2026年上半年净利润5.03亿元，其中二季度单季净利润同比大增1098.67%，业 绩爆发式增长。在AI算力建设带动光通信需求持续高景气、光纤光缆价格企稳回升的背景 下，公司作为行业核心供应商，规模效应持续释放，驱动盈利能力大幅提升。 平高电气：【特高压】公司是国内特高压设备核心供应商，主营高压开关设备。更关键的是， 公司上半年归母净利润约8.17亿元，同比增长22.87%，毛利率30.0%同比提升8.5个百分点， 盈利能力显著改善。更难得的是，特高压产品交付增长显著，H1新签订单93亿元同比增长 7.5%，在手特高压GIS订单充沛，支撑后续业绩持续释放。 东田微：【光器件】公司主营光学元器件，核心产品包括隔离器和滤光片，广泛应用于光模 块产业链。更关键的是，公司现金流与利润率共振改善，隔离器和滤光片业务加速放量驱动 业绩高增，上半年利润增七成，同时设立全资子公司拓展新业务布局。在光模块产业链持续 高景气、上游光学元器件需求旺盛的背景下，公司核心产品放量将持续驱动业绩增长，成长 空间充足。 横店东磁：【磁性材料】公司是国内磁性材料龙头，同时布局新能源和芯片电感业务。更值 得关注的是，公司新能源业务韧性较强，芯片电感及软磁业务积极推进，虽然上半年受汇兑 因素拖累盈利表现，但主业经营保持稳健。在AI算力对芯片电感需求持续增长、软磁材料 应用场景不断拓宽的背景下，公司多业务线布局将持续贡献增量，中长期成长逻辑清晰明确。 上纬新材：【人形机器人】公司原主营高性能复合材料，近期推出股权激励计划押注新业务 转型。更值得关注的是，公司被市场定位为人形机器人本体标的，26年国产人形本体密集 上市期类似20年新势力车企扎堆上市，具身智能叙事+AI大模型突破带来极具想象空间的 估值重塑机会。虽然上半年亏损1.67亿元，但股权激励方案体现管理层对新业务的信心， 后续关注产业化落地节奏。 胜蓝股份：【铜互联】公司是国内高速连接器核心厂商，国内唯一获得莫仕224G背板连接 器独家授权。更关键的是，公司已中标头部CSP超节点柜内高速铜互联项目40%份额，切入 头部CSP超节点供应链，当下估值被市场明显低估。在AI算力基础设施持续扩张、超节点 部署规模不断提升的背景下，公司高速铜互联产品需求将持续放量，业绩增长确定性强。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408", "status": "extracted"}, "attachment:files/20260820 市场逻辑精选.pdf": {"id": "attachment:files/20260820 市场逻辑精选.pdf", "kind": "attachment", "title": "20260820 市场逻辑精选", "source_label": "其他", "excerpt": "2026年8月20日逻辑市场精选 特别提示：下文涉及的题材或公司，内容罗列和篇幅长短，与后续涨跌无关，亦均非进行推 荐，仅作研究辅助。投资者应自主决策，注意风险。", "content": "2026年8月20日逻辑市场精选 特别提示：下文涉及的题材或公司，内容罗列和篇幅长短，与后续涨跌无关，亦均非进行推 荐，仅作研究辅助。投资者应自主决策，注意风险。 一、市场热点 热点一、Moderna三期成功引爆，mRNA癌症疫苗全线涨停 ◇驱动：催化端，Moderna联合默沙东研发的个性化mRNA癌症疫苗V940黑色素瘤III期达 RFS/DMFS关键终点，为全球首个个性化癌症疫苗三期阳性结果，Moderna单日暴涨177%， 产业级催化直接引爆全球mRNA赛道情绪。映射逻辑清晰，三期成功验证mRNA平台价值， 传导至A股疫苗、创新药板块仅3步链路。盘面端，8月20日生物疫苗板块涨8.06%、细 胞免疫涨6.93%、创新药涨4.46%，主力净流入50.39亿居全市场第一，多只核心标的封20cm 涨停。风险提示：A股公司均为映射/平台逻辑，未直接参与V940研发，相关mRNA管线多 处于早期或为参股布局，兑现节奏存不确定性，连续涨停后情绪高位需警惕分歧。 ◇核心公司： 康希诺：A股稀缺纯mRNA技术平台公司，mRNA技术开发路线与Moderna高度相似，当前 正在推进胶质母细胞瘤、横纹肌肉瘤两大mRNA肿瘤疫苗管线。8月20日直接一字20cm涨 停，全天成交额仅2.13亿，换手率低至2.89%，为板块内锁仓强度最高的标的，同时港股联 动暴涨，盘中 旺盛的背景下，公司核心产品放量将持续驱动业绩增长，成长 空间充足。 横店东磁：【磁性材料】公司是国内磁性材料龙头，同时布局新能源和芯片电感业务。更值 得关注的是，公司新能源业务韧性较强，芯片电感及软磁业务积极推进，虽然上半年受汇兑 因素拖累盈利表现，但主业经营保持稳健。在AI算力对芯片电感需求持续增长、软磁材料 应用场景不断拓宽的背景下，公司多业务线布局将持续贡献增量，中长期成长逻辑清晰明确。 上纬新材：【人形机器人】公司原主营高性能复合材料，近期推出股权激励计划押注新业务 转型。更值得关注的是，公司被市场定位为人形机器人本体标的，26年国产人形本体密集 上市期类似20年新势力车企扎堆上市，具身智能叙事+AI大模型突破带来极具想象空间的 估值重塑机会。虽然上半年亏损1.67亿元，但股权激励方案体现管理层对新业务的信心， 后续关注产业化落地节奏。 胜蓝股份：【铜互联】公司是国内高速连接器核心厂商，国内唯一获得莫仕224G背板连接 器独家授权。更关键的是，公司已中标头部CSP超节点柜内高速铜互联项目40%份额，切入 头部CSP超节点供应链，当下估值被市场明显低估。在AI算力基础设施持续扩张、超节点 部署规模不断提升的背景下，公司高速铜互联产品需求将持续放量，业绩增长确定性强。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408", "status": "extracted"}, "post:2026-08-20T10-44:5411b3a5b17d": {"id": "post:2026-08-20T10-44:5411b3a5b17d", "kind": "post", "title": "2026-08-20 10:44", "source_label": "帖子正文", "excerpt": "🔸天数智芯-BUY TP:HK$1020 天数智芯是一家国内领先的GPGPU芯片及高性能算力系统提供商,有望承接AI算力需求增长。天垓150已获得头部中国云厂商订单,出货爬坡路径清晰。", "content": "🔸天数智芯-BUY TP:HK$1020 天数智芯是一家国内领先的GPGPU芯片及高性能算力系统提供商,有望承接AI算力需求增长。天垓150已获得头部中国云厂商订单,出货爬坡路径清晰。我们预计公司2026E出货量约10.5万片,较2025年约4.5万片显著增长。天垓300性能对标H200,三季度已向核心客户送样,预计四季度量产,毛利率有望超过60%。双轨代工策略是天数智芯相较国内同业的关键差异化优势:其他国产厂商依赖中芯国际的产能配额,而天数智芯同时拥有合规台积电产线。公司现金储备约人民币100亿元,可用于提前锁定产能及备货,保障未来出货量。公司的CUDA兼容架构大幅降低了客户迁移成本,模型适配和部署速度快于同业,有助于在市场窗口期内抢先赢得设计导入。我们首次覆盖天数智芯,给予买入评级,预计2025至2027年收入CAGR达215%,处于同业领先水平,目标价对应23x 2027E P/S。 🔸快手-HOLD TP:HK$34 2Q26 总营收同比增长1%,调整后净利率为 11.0%,均符合市场预期。可灵单季度 8.5 亿元人民币的收入同样符合市场预期。我们认为，1）宏观逆风,2）竞争持续加剧,3）广告、电商及直播行业面临税收政策调整及生态合规治理审查,4）部分垂直领域广告预算缩减等因素对主营业务施加压力,叠加坚定的AI投入（尤其可灵）,共同导致盈利预期大幅下修。尽管我们对可灵的前景仍持乐观态度（预测其 2026 财年营收达38 亿元人民币,至 2026 年底年化收入达 10 亿美元）,但基于集团整体盈利预期的断崖式下修,我们将评级下调至“持有”。 🔸中国生物制药-BUY TP:HK$7.6 1H26业绩表现喜忧参半,药品销售略低于预期,同比增长5.6%,但受益于经营费用改善,核心利润同比大增92%。整体来看,1H26收入为194.4亿元人民币,同比增长10.6%,股东应占利润为34.3亿元人民币,同比增长1.4%。剔除合作收入后,1/2类创新药销售同比增长29.2%。管理层仍有信心实现2026年双位数收入增长,并预计1/2类创新药收入加授权收入将占全年总收入约50%。管理层指引2026年毛利率至少维持在80%,研发费用率为18%-19%,销售及管理费用率下降至约35%,长期目标则为约30%。我们小幅下调药品销售预测，,同时下调销售及管理费用率假设,以反映效率改善快于预期以及管理层更积极的成本控制目标。考虑到公司持续加大对差异化FIC/BIC资产、ADC、下一代IO及siRNA项目的投入,我们上调研发费用假设。 🔸西门子能源业绩后电话会Takeaways 我们在西门子能源披露2026财年第三季度业绩后与其举行了电话会议,公司燃气服务业务目前仅处于利润率上行周期的中段,短期利润仍以2023-24年订单贡献为主,2025财年在手订单中500个基点的利润率提升尚未在财务端兑现,同时2029-30年的交付排期正被快速填满。公司优先保障均衡的地域收入及全生命周期项目价值,而非最大化美国市场或数据中心领域的短期出货量,后市场服务始终是其战略核心。电网技术业务正通过存量改造与新建项目扩产,计划2026-2030财年产能提升50%,当前进度快于预期,公司依托高端定制化的细分市场的优势地位,有效规避与中韩企业的直接竞争。#文字观点", "publish_time": "2026-08-20 10:44", "tags": ["文字观点"]}, "post:2026-08-20T09-15:c4d83f9c8a54": {"id": "post:2026-08-20T09-15:c4d83f9c8a54", "kind": "post", "title": "2026-08-20 09:15", "source_label": "帖子正文", "excerpt": "🇺🇸【申万策略】日观美股 20260820 美股医药、消费大涨，半导体下跌 💲指数层面：今日，美股涨跌互现，价值优于成长，小盘优于大盘。标普500指数上涨0.21%，纳斯达克100指数下跌0.22%，道琼斯指数上涨0.22%，罗素2000上涨0.52%。", "content": "🇺🇸【申万策略】日观美股 20260820 美股医药、消费大涨，半导体下跌 💲指数层面：今日，美股涨跌互现，价值优于成长，小盘优于大盘。标普500指数上涨0.21%，纳斯达克100指数下跌0.22%，道琼斯指数上涨0.22%，罗素2000上涨0.52%。反弹的直接催化剂是美国财政部宣布将长债回购上限提高至少一倍，三大股指就此扭转三连跌，但芯片指数逆市跌超2%。财政部出手后美债收益率曲线趋平，30年期收益率日内降约9个基点。美元指数加速下跌至5月末以来低位，离岸人民币三年多来首次盘中涨破6.73，比特币涨破6.9万美元、较日低涨超8%。美伊僵局支撑原油四连涨、创逾三周新高；黄金大幅反弹，两个多月来首次盘中站上4500美元，现货金盘中涨超4%。 💰行业层面：表现前五的行业有医药生物(4.0%)，汽车(3.4%)，有色金属(2.9%)，建筑材料(2.6%)，商贸零售(1.7%)；表现后五的行业有机械设备(-1.5%)，国防军工(-1.6%)，银行(-2.1%)，综合(-5.0%)，钢铁(-6.5%)。个股层面：M7指数上涨0.9%，特斯拉上涨4.2%，领涨指数。当日最大的单一事件来自生物医药。Moderna与默沙东联合研发的个性化mRNA癌症疫苗在一项大型三期临床试验中取得积极结果，成为mRNA技术在癌症治疗领域首个三期试验成功的案例，Moderna收涨近180%，默沙东涨近13%、领涨道指。科技板块则明显分化，芯片指数逆市跌超2%，博通跌4.6%；迈威尔科技逆势收涨近10%，公司于7月29日与谷歌签订具有约束力的定制半导体开发协议，并于8月18日向谷歌发行认股权证，授予其以每股206.58美元购买至多5897万股股份的权利。存储链的股东回报预期继续兑现，SK海力士推出史上最大规模方案，拟回购注销40万亿韩元股份并承诺将至少50%的现金流回馈股东，其美股盘初一度涨超5%；三星则被曝于7月上调芯片制造价格、最高涨幅15%，产能挤压带来的提价仍在向下游传导。AI两强的业绩分化成为另一条重要线索，据报道OpenAI二季度收入仅67亿美元、增速放缓至18%且运营亏损进一步扩大，而Anthropic同期收入达115亿美元、首次超越OpenAI，环比增长140%并实现小幅盈利；不过杰富瑞等机构对Anthropic年化收入的统计口径提出质疑，认为其存在多种解释可能，增速放缓的结论同样依据不足。此外，\"科技七巨头\"中仅英伟达一家收跌。 联系人：申万策略全球资产配置团队#文字观点", "publish_time": "2026-08-20 09:15", "tags": ["文字观点"]}, "attachment:files/广发证券-国泰海通(601211)加速整合深化协同，科创金融优势突出-260819.pdf": {"id": "attachment:files/广发证券-国泰海通(601211)加速整合深化协同，科创金融优势突出-260819.pdf", "kind": "attachment", "title": "广发证券-国泰海通(601211)加速整合深化协同，科创金融优势突出-260819", "source_label": "广发证券", "excerpt": "01 / 16 请务必阅读末页的免责 tus": "extracted"}, "post:2026-08-20T14-40:b1527219812b": {"id": "post:2026-08-20T14-40:b1527219812b", "kind": "post", "title": "2026-08-20 14:40", "source_label": "帖子正文", "excerpt": "【日联科技】最便宜光模块测试➕半导体设备公司。1️⃣光模块老化测试设备：菲莱上修26年订单至15e，27年订单至40e", "content": "【日联科技】最便宜光模块测试➕半导体设备公司。1️⃣光模块老化测试设备：菲莱上修26年订单至15e，27年订单至40e；2️⃣收购新加坡SSTI，布局半导体晶圆检测业务，并成为＃长鑫、NV等核心设备供应商。 🔥主业100e➕光模块测试设备200e➕半导体100e，＃坚定看400e市值、持续强call！#文字观点", "publish_time": "2026-08-20 14:40", "tags": ["文字观点"]}, "attachment:files/2026：数据流之年-David Dong --- 2026-The Year of Dataflow-David Dong.pdf": {"id": "attachment:files/2026：数据流之年-David Dong --- 2026-The Year of Dataflow-David Dong.pdf", "kind": "attachment", "title": "2026：数据流之年-David Dong --- 2026-The Year of Dataflow-David Dong", "source_label": "2026：数据流之年", "excerpt": "2026: The Y ear of Dataflow2026：数据流之年FlashAttention. Megakernels. Boardfly TPU. Taalas. Extreme co-design. The biggesthardware progressions of the last few years are all converging", "content": "2026: The Y ear of Dataflow2026：数据流之年FlashAttention. Megakernels. Boardfly TPU. Taalas. Extreme co-design. The biggesthardware progressions of the last few years are all converging on dataflow.FlashAttention、巨型内核（Megakernels）、Boardfly TPU、Taalas、极致协同设计。过去⼏年硬件领域最重⼤的进展都在向数据流（Dataflow）汇聚。DAVID DONGAUG 19, 2026I was watching Eric Vishria explain why Benchmark invested in Cerebras a;er adecade of avoiding hardware. His argument was simple: as you add more compute, youalso need more memory nearby and more bandwidth between the compute units. Keepscaling all three, and eventually the chip boundary gets in the way. Cerebras’s answerwas to make the chip as large as a wafer.我曾观看 Eric Vishria Eric Vishria Eric Vishria Eric Vishria 解释为什么 Benchmark Benchmark Benchmark Benchmark 在回避硬件领域⼗年后投资了CerebrasCerebrasCerebrasCerebras。他的论点很简单：随着计算能⼒的增加，你也需要在附近增加更多的内存，并在计算单元之间提供更⼤的带宽。如果这三者持续扩展，芯⽚边界最终会成为阻碍。Cerebras Cerebras Cerebras Cerebras 的解决⽅案是将芯⽚做得像晶圆⼀样⼤。That was 2016, and at the time it looked like an extreme position. In May 2026Cerebras went public above $56 billion, with a multi-year agreement to deploy 750megawatts of wafer-scale systems for OpenAI.那是 2016 2016 2016 2016 年，在当时看来这是⼀个极端的⽴场。2026 2026 2026 2026 年 5 5 5 5 ⽉，Cerebras Cerebras Cerebras Cerebras 以超过 560 560 560 560 亿美元的估值上市，并签署了⼀项多年协议，为 OpenAI OpenAI OpenAI OpenAI 部署 750 750 750 750兆瓦的晶圆级系统。The bet aged well because it was never really about wafers. It was about a boundary.Compute kept getting faster, the things feeding it did not, and the cost of crossingbetween them became the design problem. Cerebras took that observation to itsphysical limit early. Everyone else has been arriving at the same place ever since, fromother directions.Read distraction-free on Substack在 Substack 上享受⽆⼲扰阅读 Listen 670 https://davidhdong.substack.com/p/2026-the-year-of-dataflow?r=2l9xu3&utm_medium=ios2026/8/20 09:15⻚码/gid1431/24 这次豪赌之所以成功，是因为它从来不只是关乎晶圆，⽽是关乎边界。计算速度在不断提升，但为其提供数据的环节却停滞不前，跨越两者之间边界的成本成了设计的核⼼难题。Cerebras Cerebras Cerebras Cerebras 很早就将这⼀观察推向了物理极限。从那时起，其他所有⼈也都在从不同⽅向汇聚到同⼀个终点。Around 2017, the reason to build accelerators was deep learning. In 2026, it isinference. Both push computer systems toward dataQow.2017 2017 2017 2017 年左右，构建加速器的动⼒是深度学习。到了 2026 2026 2026 2026 年，动⼒则变成了推理。两者都在推动计算机系统向数据流（dataQowdataQowdataQowdataQow）架构演进。Deep learning gave hardware an unusually regular workload: large tensor operations,known dependencies, repeated layers, and enough reuse to justify specializedhardware and expensive compilation. Inference pushes this further. The same modelmay execute billions of times, while latency increasingly depends on where weightsand KV cache live, how activations move between stages, and whether communicationcan overlap with computation.深度学习为硬件提供了异常规律的⼯作负载：⼤型张量运算、明确的依赖关系、重复的层结构，以及⾜够的复⽤率，这使得专⽤硬件和昂贵的编译过程变得物有所值。推理则进⼀步推⾼了这⼀需求。同⼀个模型可能会执⾏数⼗亿次，⽽延迟越来越取决于权重和 KV KV KV KV 缓存的存放位置、激活值在各阶段间的移动⽅式，以及通信是否能与计算重叠。Once those costs matter, optimizing each operation independently is no longerenough. The producer-consumer edges have to stay visible: which operation producesa value, where that value lives, how it moves, and when the consumer can run.⼀旦这些成本变得⾄关重要，独⽴优化每个操作就再也⾏不通了。⽣产者----消费者（producer-consumerproducer-consumerproducer-consumerproducer-consumer）之间的连接必须保持透明：哪个操作产⽣了值、该值存放在哪⾥、它是如何移动的，以及消费者何时可以运⾏。That is the version of dataQow this series is about. The clearest way to see it is towatch one algorithm get rewritten around a single boundary.这就是本系列⽂章所探讨的数据流版本。最直观的理解⽅式是观察同⼀个算法如何围绕单⼀边界进⾏重构。Same math, same silicon, different execution https://davidhdong.substack.com/p/2026-the-year-of-dataflow?r=2l9xu3&utm_medium=ios2026/8/20 09:15⻚码/gid1432/24 A straightforward implementation writes the attention score matrix to HBM, reads itback for so;max, then writes and reads another large intermediate before multiplyingby V. FlashAttention works on tiles instead. Q, K, and V blocks are brought intoSRAM, a block of scores is computed, so;max state is updated, and the result isconsumed while the data is still on chip. The full attention matrix never needs to existin HBM. On the backward pass it recomputes values rather than storing and reloadingthem, because on a modern accelerator extra arithmetic can be cheaper than anothertrip through memory.常规实现会将注意⼒评分矩阵写⼊ HBM HBM HBM HBM（⾼带宽内存），再读取回来进⾏so;max so;max so;max so;max 运算，接着写⼊并读取另⼀个巨⼤的中间变量，最后与 V V V V 相乘。⽽FlashAttention FlashAttention FlashAttention FlashAttention 则采⽤分块（tilestilestilestiles）处理。QQQQ、K K K K 和 V V V V 的数据块被调⼊SRAMSRAMSRAMSRAM，计算出⼀块评分，更新 so;max so;max so;max so;max 状态，并在数据仍在芯⽚上时就消耗掉结果。完整的注意⼒矩阵从未需要在 HBM HBM HBM HBM 中存在。在反向传播过程中，它选择重新计算数值⽽⾮存储并重新加载，因为在现代加速器上，额外的算术运算往往⽐再次访问内存更廉价。The important point is not that data stops moving. It is that the producer-consumerchain is reorganized around the memory hierarchy: values stay close to thecomputation long enough to be reused, and are consumed before they have to bewritten back. Same attention, diYerent physical execution.同样的数学原理，同样的芯⽚，不同的执⾏⽅式 https://davidhdong.substack.com/p/2026-the-year-of-dataflow?r=2l9xu3&utm_medium=ios2026/8/20 09:15⻚码/gid1433/24 核⼼要点并⾮数据停⽌了流动，⽽是⽣产者----消费者链条围绕内存层级进⾏了重组：数值在计算单元附近停留⾜够⻓的时间以供复⽤，并在必须写回之前就被消耗掉。同样的注意⼒机制，不同的物理执⾏过程。That is one boundary: HBM to SRAM. There are four others.这是⼀个边界：从 HBM HBM HBM HBM 到 SRAM SRAM SRAM SRAM。此外还有另外四个边界。Thanks for reading! Subscribe for free toreceive new posts and support my work.A seam is a producer-consumer edge that crosses a physical boundary. The boundarymay sit inside an operation, between memory tiers, between operators, between chips,or between racks. For each edge, the system has to decide where the value lives, how itmoves, and when its consumer can run. Placement and scheduling are coupled: wherethe value lives aYects when it arrives, and when it is consumed aYects how long itmust stay live.接缝（SeamSeamSeamSeam）是跨越物理边界的⽣产者----消费者边缘。该边界可能位于算⼦内部、内存层级之间、算⼦之间、芯⽚之间或机架之间。对于每⼀个边缘，系统必须决定数值存储在哪⾥、如何移动，以及消费者何时可以运⾏。放置（PlacementPlacementPlacementPlacement）与调度（SchedulingSchedulingSchedulingScheduling）是耦合的：数值存储的位置影响其到达的时间，⽽消费的时间则影响其必须保持存活的时⻓。Five seams organize almost everything that follows. I will refer to them by number forthe rest of this series.接下来的内容⼏乎全部由五个接缝组织⽽成。在本系列的后续部分中，我将通过编号来指代它们。 Type your email... SubscribeThe seam ladder 接缝阶梯 https://davidhdong.substack.com/p/2026-the-year-of-dataflow?r=2l9xu3&utm_medium=ios2026/8/20 09:15⻚码/gid1434/24 I use seam because no single existing term spans all [ve boundaries. The individualideas already have their own literatures — memory I/O, communication-avoidingalgorithms, placement and routing — but the producer-consumer path is the commonobject.我使⽤““““接缝””””（seamseamseamseam）这个词，是因为没有任何⼀个现有术语能跨越所有这五个边界。这些独⽴的理念各⾃都有相关的⽂献————————内存 I/O I/O I/O I/O、规避通信算法（communication-avoiding algorithmscommunication-avoiding algorithmscommunication-avoiding algorithmscommunication-avoiding algorithms）、布局与布线————————但⽣产者----消费者的路径才是它们共同的研究对象。Follow these seams outward and the design target gets larger: from movement insidean operation, to communication between operators and chips, and eventually to thepath a token takes through several kinds of machines.沿着这些接缝向外延伸，设计⽬标会变得越来越⼤：从操作内部的数据移动，到算⼦与芯⽚之间的通信，最终延伸到⼀个 Token Token Token Token 穿过数种机器的路径。Every time a dependency crosses a seam, it acquires a physical bill.Every time a dependency crosses a seam, it acquires a physical bill.Every time a dependency crosses a seam, it acquires a physical bill.Every time a dependency crosses a seam, it acquires a physical bill. The farther theseam reaches, the more things can enter that bill: distance, serialization, buYering, Why the seams matter 为什么接缝⾄关重要 https://davidhdong.substack.com/p/2026-the-year-of-dataflow?r=2l9xu3&utm_medium=ios2026/8/20 09:15⻚码/gid1435/24 retiming, switching, protocol, and synchronization.每当⼀个依赖关系跨越接缝时，都会产⽣⼀份物理账单。接缝跨度越远，账单中包含的项⽬就越多：距离、序列化、缓冲、重定时、交换、协议以及同步。 The cost does not increase perfectly with the seam number—a good chip-to-chip linkcan be cheaper than an HBM access. What does increase is how much machinery sitshow much machinery sitshow much machinery sitshow much machinery sitsbetween producer and consumerbetween producer and consumerbetween producer and consumerbetween producer and consumer.成本并不会随着接缝数量的增加⽽线性增⻓————————⼀个优秀的芯⽚间链路（chip-to-chip linkchip-to-chip linkchip-to-chip linkchip-to-chip link）甚⾄可以⽐⼀次 HBM HBM HBM HBM 访问更便宜。真正增加的是⽣产者与消费者之间所存在的机制复杂度。As arithmetic gets faster, those boundaries matter more. That is why AI systems keeppulling the expensive seams into the architecture.随着算⼒变得越来越快，这些边界变得愈发重要。这就是为什么 AI AI AI AI 系统不断地将昂贵的接缝引⼊到架构之中。 Why deep learning made an old idea economical为什么深度学习让⼀个古⽼的想法变得经济可⾏ https://davidhdong.substack.com/p/2026-the-year-of-dataflow?r=2l9xu3&utm_medium=ios2026/8/20 09:15⻚码/gid1436/24 DataQow is much older than the current accelerator industry. In the classical model, an operation becomes executable when its inputs are available. Execution follows producer-consumer dependencies rather than a program counter walking through a [xed sequence of instructions. 数据流（ DataQowDataQowDataQowDataQow ）的历史远⽐ 当前的加速器 ⾏业悠久 。在经典模型中，当 输⼊就绪时，操作即可执⾏ 。执⾏过程遵循⽣产 者----消费者的依赖关系，⽽不 是由程序计数器按固定指令序列逐步 运⾏。 A ───┐ ADD ───► C B ───┘ That [ring rule is a statement about causality: ADD cannot run until A and B exist. A dataQow machine carries that dependency into execution itself. Values are produced, routed, stored, matched with their consumers, and then enable the next work. 这条触发规则是对因果关系的 陈述：在 A A A A 和 B B B B 存在之前， ADD ADD ADD ADD ⽆法运⾏。 数据流机将这 种依赖关系带 ⼊执⾏过程本身。数值被产⽣、路由、存储、与它 们的消费者匹配，然后开启下⼀项⼯作。 Researchers built machines around this idea decades ago. Dennis’s static dataQow model, the MIT tagged-token architecture, and the Manchester DataQow Machine diYered in how they represented and scheduled dependencies, but they shared the same problem: the unit of work was small. If every scalar operation needs operand matching, token storage, routing, and scheduling, the machinery around the arithmetic can cost as much as the arithmetic itself. ⼏⼗年前， 研究⼈员就围绕这⼀理念构建了机器。 Dennis Dennis Dennis Dennis 的静态数据流模 型、 MIT MIT MIT MIT 的标记令牌 （tagged-tokentagged-tokentagged-tokentagged-token ）架构以及 曼彻斯特 数据流机 （Manchester DataQow MachineManchester DataQow MachineManchester DataQow MachineManchester DataQow Machine ）在如何表示和调度依赖关系上有所不 同，但它 们⾯临着共同的问题：⼯作单元 太⼩。如果每个标量操作都需要 操作 数匹配、令牌存储、路由和调度，那么 围绕算术运算构建的机 制成本可能与算 术运算本身⼀样⾼。 Deep learning changed that economics. The unit governed by one placement or scheduling decision can now be a tensor tile, a fused operator, or an entire pipeline stage containing millions of operations. The graphs are unusually regular and repeat at an enormous scale. Spending minutes or hours compiling a model makes sense when the resulting mapping runs billions of times. https://davidhdong.substack.com/p/2026-the-year-of-dataflow ?r=2l9xu3&utm _medium=ios 2026/8/20 09 :15 ⻚码/gid1437/24Î¢ÐÅ WUXL3408 深度学习改变了这种经济模式。现在，由⼀次放置或调度决策所控制的单元可以是⼀个张量分⽚（tensor tiletensor tiletensor tiletensor tile）、⼀个融合算⼦，或者是包含数百万次操作的整个流⽔线阶段。这些图具有异常的规律性，并以巨⼤的规模重复。当⽣成的映射运⾏数⼗亿次时，花费数分钟或数⼩时来编译模型就变得⾮常有意义。Another way to say the same thing is to change per 公司原主营智能交通系统，近年切入智算中心建设运营赛道实现业 务升级。更关键的是，公司2026年第二季度单季净利润同比大增1765.80%，上半年净利润 同比增长342.91%，智算业务放量是核心驱动力。在AI算力基础设施建设持续推进、各地 智算中心需求爆发的背景下，公司凭借项目经验和客户资源快速抢占市场，业绩增长弹性极 大。 永鼎股份：【光通信】公司是国内光通信核心厂商，主营光纤光缆及光器件业务。更关键的 是，公司2026年上半年净利润5.03亿元，其中二季度单季净利润同比大增1098.67%，业 绩爆发式增长。在AI算力建设带动光通信需求持续高景气、光纤光缆价格企稳回升的背景 下，公司作为行业核心供应商，规模效应持续释放，驱动盈利能力大幅提升。 平高电气：【特高压】公司是国内特高压设备核心供应商，主营高压开关设备。更关键的是， 公司上半年归母净利润约8.17亿元，同比增长22.87%，毛利率30.0%同比提升8.5个百分点， 盈利能力显著改善。更难得的是，特高压产品交付增长显著，H1新签订单93亿元同比增长 7.5%，在手特高压GIS订单充沛，支撑后续业绩持续释放。 东田微：【光器件】公司主营光学元器件，核心产品包括隔离器和滤光片，广泛应用于光模 块产业链。更关键的是，公司现金流与利润率共振改善，隔离器和滤光片业务加速放量驱动 业绩高增，上半年利润增七成，同时设立全资子公司拓展新业务布局。在光模块产业链持续 高景气、上游光学元器件需求旺盛的背景下，公司核心产品放量将持续驱动业绩增长，成长 空间充足。 横店东磁：【磁性材料】公司是国内磁性材料龙头，同时布局新能源和芯片电感业务。更值 得关注的是，公司新能源业务韧性较强，芯片电感及软磁业务积极推进，虽然上半年受汇兑 因素拖累盈利表现，但主业经营保持稳健。在AI算力对芯片电感需求持续增长、软磁材料 应用场景不断拓宽的背景下，公司多业务线布局将持续贡献增量，中长期成长逻辑清晰明确。 上纬新材：【人形机器人】公司原主营高性能复合材料，近期推出股权激励计划押注新业务 转型。更值得关注的是，公司被市场定位为人形机器人本体标的，26年国产人形本体密集 上市期类似20年新势力车企扎堆上市，具身智能叙事+AI大模型突破带来极具想象空间的 估值重塑机会。虽然上半年亏损1.67亿元，但股权激励方案体现管理层对新业务的信心， 后续关注产业化落地节奏。 胜蓝股份：【铜互联】公司是国内高速连接器核心厂商，国内唯一获得莫仕224G背板连接 器独家授权。更关键的是，公司已中标头部CSP超节点柜内高速铜互联项目40%份额，切入 头部CSP超节点供应链，当下估值被市场明显低估。在AI算力基础设施持续扩张、超节点 部署规模不断提升的背景下，公司高速铜互联产品需求将持续放量，业绩增长确定性强。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª Î¢ÐÅ£º WUXL3408", "status": "extracted"}, "post:2026-08-20T22-21:772bcb5e029f": {"id": "post:2026-08-20T22-21:772bcb5e029f", "kind": "post", "title": "2026-08-20 22:21", "source_label": "帖子正文", "excerpt": "中国巨石：26H1业绩高增长，26H2更可期公司发布2026年中报，上半年实现收入111.6亿元，同比增长22.5%，实现归母净利润为29.33亿元，同比增长73.87%，扣非归母净利润29.1亿元，同比增长70.93%；其中Q2实现收入58.77亿元，同比增长26.93%，实现归母净利润16.66", "content": "中国巨石：26H1业绩高增长，26H2更可期公司发布2026年中报，上半年实现收入111.6亿元，同比增长22.5%，实现归母净利润为29.33亿元，同比增长73.87%，扣非归母净利润29.1亿元，同比增长70.93%；其中Q2实现收入58.77亿元，同比增长26.93%，实现归母净利润16.66亿元，同比增长74.17%，扣非归母净利润为16.32亿元，同比增长70.55%。 2026 年中期利润拟分配方案为：每 10 股派发现金红利 3.30元（含税）。# 26H1粗纱量价齐升： 2026上半年玻纤及制品销量约170万吨，其中Q2销量约86万吨，同比增长约8万吨，粗纱端行业供需格局逐步改善，价格稳中有涨，2026年Q2华东地区缠绕直接纱2400tex均价约3741元/吨，同比上涨约87元/吨，环比提升约196元/吨，公司持续优化产品结构，热塑等高端产品占比超过80%，整体盈利较为稳定，我们测算Q2粗纱吨净利超过900元。# 电子布延续高景气度： 上半年公司电子布销量5.44亿米，其中Q2销量约2.7亿米，同比增长约14%，今年年初以来，电子布景气度持续上升，电子布价格逐月上涨，以重庆国际电子布为例，截至8月初，7628电子布均价约10.1元/米，较年初实现翻倍以上增长，薄布及超薄布涨幅更大。巨石电子布产能全球第一，25年销量超过10亿米，26年预计将达到12亿米；同时公司积极扩张电子布产能，当前淮安基地一期3.9亿米电子布已全部投产，未来计划在淮安基地新建年产5万吨电子纱暨3.2亿米电子布生产线，以及拟在桐乡基地新建年产2.5亿米电子布，届时投产后公司电子布产能近20亿米，此外，公司积极推进特种电子布的产品的认证，下半年有望实现突破，进一步丰富电子布产品品类。当前电子布-CCL-PCB涨价链条传导顺畅，随着下半年需求旺季的到来，电子布的供需缺口或进一步显现，市场锚定的含税价格或进一步上修到15元/米（以7628电子布为例），27年的业绩弹性将进一步抬升。我们认为，电子布在高端PCB里成本占比较低，AI需求拉动明显放量，织布机短缺、电子纱短缺以及电子布低库存的现状持续，头部电子布业绩或持续上修，当前依旧看好产业趋势向上。#文字观点", "publish_time": "2026-08-20 22:21", "tags": ["文字观点"]}, "post:2026-08-20T15-43:35b2c16b29f5": {"id": "post:2026-08-20T15-43:35b2c16b29f5", "kind": "post", "title": "2026-08-20 15:43", "source_label": "帖子正文", "excerpt": "8月20日复盘笔记：医药生物/电网设备/贵金属/光纤/PCB/3D打印/农业/光通信/折叠屏/航运等一、重磅财经信息8月LPR报价出炉：5年期和1年期利率均维持不变。5年期以上LPR为3.5%，1年期LPR为3%。", "content": "8月20日复盘笔记：医药生物/电网设备/贵金属/光纤/PCB/3D打印/农业/光通信/折叠屏/航运等一、重磅财经信息8月LPR报价出炉：5年期和1年期利率均维持不变。5年期以上LPR为3.5%，1年期LPR为3%。二、大盘表现沪指涨0.24%，深成指涨0.59%，创业板指涨0.64%，科创50跌0.87%。医药板块涨停潮！沪深两市成交额2.08万亿，较上一个交易日缩量4317亿。三、强势板块和个股分析备注：只列举部分涨停板医药生物默沙东与莫德纳宣布，双方合作的mRNA 个性化癌症疫苗 intismeran autogene 首个 III 期临床试验取得初步阳性结果。涨停板：莱美药业、沃森生物、石药创新、博腾股份、康希诺、键凯科技、近岸蛋白、昂利康、智飞生物、安科生物、康泰生物、康华生物、百克生物、悦康药业、双鹭药业、誉衡药业、神奇制药、汉森制药、永安药业、三元基因、达安基因、贝瑞基因、华大智造、塞力医疗、金域医学其他强势股：和元生物、森萱医药、东富龙、药石科技电网设备8月18日，国家电网与南方电网举行会谈，并签署《落实“十五五”规划加快新型电网建设战略合作框架协议》。电网建设力度加大，上半年国家电网完成固定资产投资超3100亿元，同比增长12.6%。涨停板：风范股份、正泰电器、新宏泰其他强势股：三晖电气、扬电科技、万马股份贵金属隔夜国际贵金属价格大涨，截至8月20日收盘，现货黄金价格涨4.35%，报4522.78美元/盎司；现货源头信息加微信 WUXL3408白银价格涨5.81%，报66.98美元/盎司。涨停板：南矿集团、深中华A、中电电机其他强势股：山东黄金、赤峰黄金、兴业银锡、盛达资源、晓程科技、中金黄金光纤机构：保偏光纤是“CPO架构催生的核心增量部件”。随着英伟达CPO交换机的规模出货，保偏光纤正迎来需求端的爆发式增长。涨停板：通鼎互联、万隆光电其他强势股：长盈通、亨通光电、华脉科技、长飞光纤PCB多家PCB产业链企业披露2026年半年报，大多数公司营收、净利润实现较快增长。当前PCB行业仍源头信息加微信 WUXL3408处于结构性涨价过程中，高阶HDI、高多层PCB等高端产品持续处于供需偏紧状态。涨停板：中京电子、宝鼎科技其他强势股：中英科技、胜宏科技、南亚新材3D打印1-7月，我国3D打印设备产品产量同比增长52.3%；7月单月产量达到65.7%；远超同期锂离子电池（40.2%）和工业机器人（28.5%）两大产品。涨停板：华曙高科、哈森股份其他强势股：铂力特、捷邦科技、苏大维格、爱司凯农业摩根大通预计，霍尔木兹海峡局势扰动和潜在“超级厄尔尼诺”现象可能推高化肥和食品价格，全球食品通胀率将从2026年上半年的2.8%升至2027年上半年的5%。涨停板：海南橡胶、 /净利润分别同比增长 18%/33% （较摩根大通预测高出 7%/17% ），毛利率为 11.2% （对比摩根大通预测为 10.6% ）。除苹果产 品（尤其是 iPhone ）订单强劲外，我们认为这主要得益于公司的份额增 长，以及良率与运营效率提升，助力公司对冲降价压力， 2026 年上半 年净利润率稳定在 5.6% （对比 2025 年上半年 /2025 年全年分别为 5.0%/5.6% ）。 •盈利增长强劲，高端机型业务敞口较高。 随着 2026 年下半年产品管线 的切换，我们预计高端机型出货量将同比增长 10%以上。加上公司在 摄像头模组（ CCM ）领域份额的持续增长（主要来自 Pro/Pro Max 及折 叠屏机型）以及规模效应，我们预计高伟电子 2026/27 年盈利将分别同 比增长 28%/15% 。虽然主摄 CCM 项目导入尚存不确定性，但我们认为 ，现有项目的份额提升与规格升级带来的单机价值量增长，以及搭载摄 像头的 AI终端设备带来的潜在导入机会，应能为公司带来增量盈利， 预计 2028 年盈利同比增速可达 43%。 •重申“增持”评级。 今年迄今高伟电子的股价已下跌 9%（同期恒生指 数跌 1%），我们认为这主要源于投资者对潜在需求疲软以及 AI概念 股风险偏好的担忧。我们将潜在需求疲软纳入考量，但仍认为当前风 险回报比具有吸引力，支撑力为韧性需求、市场份额的持续增长以及 当前估值不高，上述因素共同支撑估值进一步上调。我们重申 “增持 ”评级，并将目标价时间框架延展至 2027 年6月，为 48港元，基于 15倍的 1年动态市盈率（倍数因流动性约束而有所下调）。 ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª 中国 证券研究 2026 年8月18日 刘叶 (86-21) 6106-6200 ye.liu@jpmorgan.com 股价表现 年内迄今 1个月 3个月 12个月 绝对 -10.0% 14.2% -16.4% -21.0% 相对 -9.3% 10.6% -15.6% -22.1% 公司数据 已发行股票数（百万） 870 52周股价区间（港元） 43.06-19.90 总市值（百万美元） 2,751 汇率 7.84 自由流通股比例 29.0% 三个月日均成交量（百万） 3.46 三个月日均成交额（百万美元） 10.7 波动性（ 90天） 51 指数 HSI 彭博 买入 |持有 |卖出 10|0|0 重要指标（财年 12月份结束） 单位：百万美元，每股数据单位：美元 FY25A FY26E FY27E FY28E 财务预测 收入 3,500 4,432 4,892 6,839 调整后的息税前利润 225 292 326 465 调整后的息税折旧摊销前利润 290 360 385 523 调整后的净利润 197 252 289 416 调整后的每股收益 0.23 0.29 0.33 0.48 彭博一致预期每股收益 0.22 0.28 0.35 0.46 经营活动现金流 316 297 391 412 公司自由现金流 242 182 250 228 利润率和增长率 收入增长率 40.3% 26.6% 10.4% 39.8% 息税前利润率 6.4% 6.6% 6.7% 6.8% 息税前利润增长率 72.7% 29.9% 11.8% 42.5% 息税折旧摊销前利润率 8.3% 8.1% 7.9% 7.6% 息税折旧摊销前利润增长率 59.2% 23.9% 6.9% 35.9% 净利润率 5.6% 5.7% 5.9% 6.1% 调整后的每股收益增长率 63.2% 27.7% 15.1% 43.8% 财务比率 调整后的有效税率 12.9% 13.9% 13.5% 13.5% 利息覆盖倍数 39.6 NM NM NM 净债务 /净资产 NM NM NM NM 净债务 /息税折旧摊销前利润 NM NM NM NM 净资产收益率 31.7% 30.4% 27.6% 30.9% 估值 公司自由现金流收益率 8.8% 6.6% 9.1% 8.3% 股息率 - - - - 企业价值 /收入 0.7 0.5 0.4 0.3 企业价值倍数 8.7 6.5 5.6 3.9 调整后的市盈率 14.0 10.9 9.5 6.6 投资理据和估值概要 高伟电子是一家摄像头模组制造商，其总收入中有超过 90%来自最大的客户苹果公司。虽然全球 iPhone/iPad 出货 量应将基本保持稳定，但我们认为未来 2-3年内，高伟电 子在后摄模组项目中的份额持续提升或将推动公司增长。 其他基于光学可穿戴 /物联网产品的份额提升也可能会为 高伟电子带来额外收入。我们预计公司 2025-2028 年盈利 年复合增长率为 28%。我们看好高伟电子可持续的 互联方案；3.2T NPO单只价值量1200-1300美元，是800G的3倍，2026年渗透率仅10-20%。（来源：11:09 NPO帖子）\u003c/li>\n\u003cli>SK海力士成为今日焦点：宣布40万亿韩元股票回购注销计划，早于预期；同时发布CPO路线图，光互联有望进一步延伸至HBM接口。（来源：GS-SK海力士附件、JPM-SK海力士附件、21:37 SK海力士COO帖子、风口研报·洞察附件）\u003c/li>\n\u003cli>液冷行业出现订单拐点信号：飞龙股份首次公开回应在手订单——200-10kW液冷泵终端客户订单超50000台，10kW以上平台订单近万台。（来源：20:13飞龙股份半年报速评帖子）\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力链需求高景气、环节分化\u003c/strong>：野村台北亚洲科技路演与PCB/CCL/载板、散热及AI ODM产业链龙头交流，核心反馈指向需求持续高景气，但盈利节奏与驱动因素分化。大力（Ta Liang）为全球前三PCB机械钻孔/背钻设备商，8月分拆半导体设备子公司TLSmart聚焦先进封装量测/检测设备。（来源：13:53野村路演帖子）\u003c/li>\n\u003cli>\u003cstrong>美国财政部加码长债回购、压制长端收益率\u003c/strong>：财政部宣布长期国债回购规模至少翻倍，花旗已在GMS建立现货黄金多头头寸并将黄金配置上调至超配+1，基准情景6-12个月目标价5000美元/盎司。（来源：10:54花旗帖子、08:35华泰宏观帖子）\u003c/li>\n\u003cli>\u003cstrong>NPO从过渡方案走向长期主流，光互联价值量跃升\u003c/strong>：3.2T NPO单只价值量1200-1300美元；6.4T NPO光芯片用量4倍于1.6T（单模组16个CW光源）；FAU升级DFAU价值量13倍跃升（15→200美元）。2026年NPO渗透率仅10-20%，2027年大规模商用。（来源：11:09 NPO帖子）\u003c/li>\n\u003cli>\u003cstrong>SK海力士双重催化：40万亿韩元回购+CPO路线图\u003c/strong>：GS与JPM均认为40万亿韩元回购早于预期、对EPS及股价形成正向影响；SK海力士COO表示AI竞赛重点已从单芯片性能转向整个系统数据传输效率。（来源：GS-SK海力士附件、JPM-SK海力士附件、21:37帖子）\u003c/li>\n\u003cli>\u003cstrong>液冷/电源景气验证：订单超预期+电源涨价+供电架构升级\u003c/strong>：飞龙股份液冷泵订单超5万台；ADI Q2营收40.2亿美元同比+39.6%超预期；开源证券指出800V供电架构落地前夜，数据中心电力设备迎增量机遇；台半、强茂等酝酿年内第三轮涨价10%~15%。（来源：20:13飞龙股份帖子、10:46新雷能帖子、开源证券附件、13:49东吴电子帖子）\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>美国财政部意外宣布将10年至30年期国债回购规模至少提高一倍，公共债务总额首次突破40万亿美元（来源：08:35华泰宏观帖子）\u003c/li>\n\u003cli>SK海力士宣布40万亿韩元股票回购注销计划，落地早于预期（来源：GS-SK海力士附件、JPM-SK海力士附件）\u003c/li>\n\u003cli>Moderna个性化肿瘤疫苗III期达主要终点，首个个体化新抗原疗法III期阳性（来源：07:30剂泰科技帖子、07:30创新药旗手帖子）\u003c/li>\n\u003cli>8月LPR报价出炉：5年期和1年期利率均维持不变（来源：15:43复盘笔记帖子）\u003c/li>\n\u003cli>阿里capex今晚发布预计超预期，市场梳理阿里链：光模块光迅科技（一供）、华工科技（主供）、中际旭创（主供）（来源：09:34帖子）\u003c/li>\n\u003cli>亿纬锂能中报：上半年收入456.91亿元同比+62.20%，归母净利润33.01亿元同比+105.66%（来源：07:27长江电新帖子）\u003c/li>\n\u003cli>光通信板块异动：太辰光涨18.38%领涨，腾景科技涨8.90%，剑桥科技涨6.95%，光迅科技小幅下跌2.6
