来源：中银证券；正文摘录：【算 力芯片制造及封装】 中芯国际、华虹宏力、长鑫科技、盛 合晶微、长电科技、通富微 电、长川科技 ；\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>AI算力链仍是全场最强主线，但环节分化明显：野村台北路演反馈AI算力需求持续高景气，AI服务器收入70%来自英伟达平台、25%来自ASIC；同时散热环节Vera Rubin全液冷设计使单托盘散热价值量较Grace Blackwell提升50%。（来源：13:53野村亚洲科技路演帖子）\u003c/li>\n\u003cli>美债回购成为宏观面最大边际变化：美国财政部意外宣布将10年至30年期国债回购规模至少提高一倍，公共债务总额首次突破40万亿美元；花旗认为短期内高收益率动能可能已停滞。（来源：10:54花旗帖子、08:35华泰宏观帖子）\u003c/li>\n\u003cli>光通信/CPO出现新的产业认知变化：市场观点认为NPO不是CPO落地前的过渡，而是长期主流光互联方案；3.2T NPO单只价值量1200-1300美元，是800G的3倍，2026年渗透率仅10-20%。（来源：11:09 NPO帖子）\u003c/li>\n\u003cli>SK海力士成为今日焦点：宣布40万亿韩元股票回购注销计划，早于预期；同时发布CPO路线图，光互联有望进一步延伸至HBM接口。（来源：GS-SK海力士附件、JPM-SK海力士附件、21:37 SK海力士COO帖子、风口研报·洞察附件）\u003c/li>\n\u003cli>液冷行业出现订单拐点信号：飞龙股份首次公开回应在手订单——200-10kW液冷泵终端客户订单超50000台，10kW以上平台订单近万台。（来源：20:13飞龙股份半年报速评帖子）\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力链需求高景气、环节分化\u003c/strong>：野村台北亚洲科技路演与PCB/CCL/载板、散热及AI ODM产业链龙头交流，核心反馈指向需求持续高景气，但盈利节奏与驱动因素分化。大力（Ta Liang）为全球前三PCB机械钻孔/背钻设备商，8月分拆半导体设备子公司TLSmart聚焦先进封装量测/检测设备。（来源：13:53野村路演帖子）\u003c/li>\n\u003cli>\u003cstrong>美国财政部加码长债回购、压制长端收益率\u003c/strong>：财政部宣布长期国债回购规模至少翻倍，花旗已在GMS建立现货黄金多头头寸并将黄金配置上调至超配+1，基准情景6-12个月目标价5000美元/盎司。（来源：10:54花旗帖子、08:35华泰宏观帖子）\u003c/li>\n\u003cli>\u003cstrong>NPO从过渡方案走向长期主流，光互联价值量跃升\u003c/strong>：3.2T NPO单只价值量1200-1300美元；6.4T NPO光芯片用量4倍于1.6T（单模组16个CW光源）；FAU升级DFAU价值量13倍跃升（15→200美元）。2026年NPO渗透率仅10-20%，2027年大规模商用。（来源：11:09 NPO帖子）\u003c/li>\n\u003cli>\u003cstrong>SK海力士双重催化：40万亿韩元回购+CPO路线图\u003c/strong>：GS与JPM均认为40万亿韩元回购早于预期、对EPS及股价形成正向影响；SK海力士COO表示AI竞赛重点已从单芯片性能转向整个系统数据传输效率。（来源：GS-SK海力士附件、JPM-SK海力士附件、21:37帖子）\u003c/li>\n\u003cli>\u003cstrong>液冷/电源景气验证：订单超预期+电源涨价+供电架构升级\u003c/strong>：飞龙股份液冷泵订单超5万台；ADI Q2营收40.2亿美元同比+39.6%超预期；开源证券指出800V供电架构落地前夜，数据中心电力设备迎增量机遇；台半、强茂等酝酿年内第三轮涨价10%~15%。（来源：20:13飞龙股份帖子、10:46新雷能帖子、开源证券附件、13:49东吴电子帖子）\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>美国财政部意外宣布将10年至30年期国债回购规模至少提高一倍，公共债务总额首次突破40万亿美元（来源：08:35华泰宏观帖子）\u003c/li>\n\u003cli>SK海力士宣布40万亿韩元股票回购注销计划，落地早于预期（来源：GS-SK海力士附件、JPM-SK海力士附件）\u003c/li>\n\u003cli>Moderna个性化肿瘤疫苗III期达主要终点，首个个体化新抗原疗法III期阳性（来源：07:30剂泰科技帖子、07:30创新药旗手帖子）\u003c/li>\n\u003cli>8月LPR报价出炉：5年期和1年期利率均维持不变（来源：15:43复盘笔记帖子）\u003c/li>\n\u003cli>阿里capex今晚发布预计超预期，市场梳理阿里链：光模块光迅科技（一供）、华工科技（主供）、中际旭创（主供）（来源：09:34帖子）\u003c/li>\n\u003cli>亿纬锂能中报：上半年收入456.91亿元同比+62.20%，归母净利润33.01亿元同比+105.66%（来源：07:27长江电新帖子）\u003c/li>\n\u003cli>光通信板块异动：太辰光涨18.38%领涨，腾景科技涨8.90%，剑桥科技涨6.95%，光迅科技小幅下跌2.66%（来源：20260820市场逻辑精选附件）\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>阿里Q2资本开支数据落地后对国产算力产业链的拉动验证（来源：09:34阿里链帖子、中银证券附件\"国内CSP资本开支加速+大模型涨价\"）\u003c/li>\n\u003cli>NPO 2027年大规模商用节奏与3.2T/6.4T双规格放量情况（来源：11:09 NPO帖子）\u003c/li>\n\u003cli>800V供电架构落地前夜，数据中心电力设备增量机遇的兑现节奏（来源：开源证券-800V供电架构附件）\u003c/li>\n\u003cli>电子布-CCL-PCB涨价链条传导：市场锚定含税价格或上修至15元/米（7628电子布为例）（来源：22:21中国巨石帖子、主线6核心逻辑）\u003c/li>\n\u003cli>SK海力士CPO路线图中光互联延伸至HBM接口的材料价值量提升方向（来源：风口研报·洞察附件）\u003c/li>\n\u003cli>台半、强茂等功率半导体第三轮涨价10%~15%的落地情况（来源：13:49东吴电子帖子）\u003c/li>\n\u003cli>特斯拉Optimus产线安装进度与Gen 3设计定稿后的供应链锁定（来源：17:50摩根大通特斯拉帖子、机器人主线核心逻辑）\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003cul>\n\u003cli>帖子（13:53）：野村台北亚洲科技路演——PCB/CCL/载板、散热及AI ODM产业链反馈，AI算力需求高景气但盈利节奏分化\u003c/li>\n\u003cli>帖子（20:11）：Nature Electronics 2026.08.19论文投研摘要——Co-packaged optics for high-performance computing and AI（SK海力士、MIT、弗吉尼亚大学、南洋理工）\u003c/li>\n\u003cli>帖子（11:09）：NPO从过渡方案到长期主流，光互联最大的增量机会——价值量测算与渗透率预测\u003c/li>\n\u003cli>帖子（20:13）：飞龙股份半年报速评——液冷泵在手订单首次公开，订单大超预期\u003c/li>\n\u003cli>帖子（21:37）：SK海力士首席运营官——CPO技术路线图与AI竞赛重心转向系统数据传输效率\u003c/li>\n\u003cli>帖子（10:46）：广发军工&amp;化工——新雷能：ADI Q2业绩超预期，电源行业景气度验证\u003c/li>\n\u003cli>帖子（08:34）：金山软件/金山云/金山办公中报速评（多条）——AI算力驱动公有云+45%\u003c/li>\n\u003cli>附件（正文已提取）：JPM-应用材料近期投资者会议要点总结（20260820）\u003c/li>\n\u003cli>附件（正文已提取）：GS-SK海力士40万亿韩元回购注销公告点评（20260820）\u003c/li>\n\u003cli>附件（正文已提取）：JPM-SK海力士40万亿韩元回购快评（20260820）\u003c/li>\n\u003cli>附件（正文已提取）：20260820市场逻辑精选——光通信板块异动与相关公司梳理\u003
