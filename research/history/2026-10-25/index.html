ckground: China reduced the export VAT rebate rate for lithium-ion batteries from 13% to 9%, effective 1 December 2024, as part of a broader adjustment to export tax rebate policies. The rebate rate was subsequently reduced further from 9% to 6% , effective 1 April 2026 . The remaining rebate benefit of 6% is scheduled to be eliminated from 1 January 2027 . Under China's VAT system, battery manufacturers pay VAT on raw materials and components and collect VAT back when selling products; for exports, the rebate mechanism allows exporters to recover part of the input VAT incurred during production. A lower rebate rate means a smaller portion of input VAT can be recovered and higher COGS of exported batteries, which results in gross profit reduction if the incremental cost cannot be passed on to customers. Because export VAT rebates are determined based on the shipment date rather than the revenue recognition date, export batteries shipped before 1 April 2026 remained eligible for the previous higher rebate rate even if revenue was recognized in 2Q26. As a result, some 2Q26 revenue still carries the higher rebate entitlement while 3Q26 revenue factored in the full 3-month effect . The impact of the rebate-rate reduction therefore appeared with a lag and became more visible in 3Q26 and CATL has around 30% of overseas revenue, the highest among Chinese battery makers. 2. How much does it relate to consumption tax? The earnings decline starts to reflect primarily at the gross profit level, suggesting that the key headwinds were lower export VAT rebate rates and product mix changes rather than the battery consumption tax. This is because consumption tax is typically booked under taxes and surcharges below the gross profit line, which will only have impact on unit EBIT and unit net profit. Based on the historical quarterly taxes and surcharges to sales rates and 3Q26’s ratio, we estimate CATL passed through 0%-20% of consumption tax, equivalent to 0%-0.4% of 2% levied consumption tax rate considering that only September is affected. As the battery consumption tax was only implemented on 1 September 2026 , its impact was limited to one month of 3Q26. As a result, the incremental drag on profitability was relatively modest, accounting for roughly 1ppt of net profit margin erosion during the quarter and translating into an estimated US$1.4-1.9/kWh reduction in unit profit . The magnitude of the earnings decline therefore suggests that the more significant headwinds originated from the reduction in export VAT rebate benefits and product mix changes, which affected profitability throughout a larger portion of the quarter. GLOBAL ENERGY STORAGE 7 Neil Beveridge, Ph.D. +852 2123 2648 neil.beveridge@bernsteinsg.com 23 October 2026 EXHIBIT 11: CATL ’s quarterly tax and surcharge to sales ratio. It surged in 3Q26 due to consumption tax rate levied starting 1 Sep 2026. We anticipate a higher ratio in 4Q26, driven by the full-quarter recognition versus only a one- month effect in 3Q26 Historical maximum: 0.7% at 2Q25 Before comsumption tax: 0.5% at 2Q26After consumption tax starting from 1 Sep: 1.3% in 3Q26 0.0%0.3%0.6%0.9%1.2%1.5%1.8% Q1'22 Q2'22 Q3'22 Q4'22 Q1'23 Q2'23 Q3'23 Q4'23 Q1'24 Q2'24 Q3'24 Q4'24 Q1'25 Q2'25 Q3'25 Q4'25 Q1'26 Q2'26 Q3'26 Q4'26 ETax and surcharge/sales (%)Tax and surcharge/sales ratio Source: Company data, Bernstein estimate (4Q26E) and analysis EXHIBIT 12: Unit profit and margin scenario matrix for 3Q26 Unit net profit Rmb cents/Wh 11.0 10.0 9.0 8.2 7.0 6.0 5.0 Unit gross profit Rmb cents/Wh 16.0 15.0 14.0 13.1 12.0 11.0 10.0 GPM % 25.2% 23.6% 22.0% 20.7% 18.9% 17.3% 15.7% Unit EBIT Rmb cents/Wh 11.4 10.4 9.4 7.8 7.", "status": "extracted"}, "post:2026-10-25T10-04:88eb0bd41a6e": {"id": "post:2026-10-25T10-04:88eb0bd41a6e", "kind": "post", "title": "2026-10-25 10:04", "source_label": "帖子正文", "excerpt": "#华大九天交流反馈：AI深度赋能EDA，＃外延并购稳步扩张2026年10月23日，华大九天举办生态伙伴及用户大会，公司发布AI相关新产品，＃并与芯行纪、奇捷科技、中科鉴芯、上海曼光等企业举行战略合作协议签约仪式。本次签约企业均为公司本年度通过投资并购新增布局的EDA企业，旨在进一步补齐数字电路设计和", "content": "#华大九天交流反馈：AI深度赋能EDA，＃外延并购稳步扩张2026年10月23日，华大九天举办生态伙伴及用户大会，公司发布AI相关新产品，＃并与芯行纪、奇捷科技、中科鉴芯、上海曼光等企业举行战略合作协议签约仪式。本次签约企业均为公司本年度通过投资并购新增布局的EDA企业，旨在进一步补齐数字电路设计和光电电路设计EDA工具短板，加快构建全流程工具系统，助力国内集成电路产业自主可控发展。AI新品驱动EDA从设计自动化到设计智能体转变，成为虚拟工程师、数字专家，与工程师协同完成芯片设计。本次发布包括： 1️⃣Custom.aix（模拟设计场景）：国内模拟设计厂商产品规格种类与海外对手存在数量级差距，人工迁移工艺、调整参数、绘制版图效率低，难以弥补产品矩阵差距。该产品将原以周、月为单位的设计工作压缩至1天以内完成，PPA提升5倍以上，设计迭代减少60%，可帮助国内模拟设计客户以十倍效率补充产品矩阵。 2️⃣FPD.aix（平板显示Pixel优化场景）：Pixel设计质量决定高端显示面板通透性、清晰度、亮度均匀性等核心画质，指标间相互干扰难平衡，且异形图形多，人工难以评判寄生效应，是面板行业最关键、最复杂的工作。该产品将原Pixel设计专家一周的工作量压缩至1天以内，PPA提升7倍以上，显示画质提升5倍。 3️⃣Digital.aix（数字设计/高端算力芯片PPA优化场景）：AI、HPC等高端算力芯片核心诉求为提升PPA、突破设计天花板；通过定制专属标准单元提升PPA的路径，需跨验证、PD、库团队等数十名工程师耗时2-3个月迭代，且最终PPA收益无法预期。案例中共生成200多个单元，其中118个取得正向收益；代回设计重新Layout优化后，Fmax从1.81GHz提升至1.83GHz，最高频率提升超20MHz，超过1%的预设目标；将多团队数十名工程师2-3个月的工作压缩至数天，PPA优化效率提升至少一个量级，可推动设计天花板再突破1个百分点。 4️⃣Manufacture.aix（晶圆制造场景）：原需数天的长程Pcell任务压缩至半小时，效率提升十倍以上；Dummy Fill空间利用率从人工方案的78%提升至93%，提升15个百分点，可放置更多Dummy Fill监测良率。 5️⃣AIX Copilot（智能副驾）：为每款EDA工具配备Copilot，推动传统Design Automation工具进化为7×24小时运行的AI智慧专家。公司在国产替代与半导体需求扩张背景下，＃未来收入CAGR预计达25%，2030 年目标收入达到 50 亿元，远期20%净利率水平看10亿业绩。＃2026年下半年H客户确收节奏加快，业务有望加速。OpenAI与新思科技合作联合开发面向芯片设计的专用模型GPT-Synopsys，开创AI EDA时代，有望重塑license商业模式，＃转为类似token付费/按结果分成模式，AI新产品有望为公司提供增量贡献。#文字观点", "publish_time": "2026-10-25 10:04", "tags": ["文字观点"]}, "attachment:files/Nomura-全球机器人行业：具身智能的“ChatGPT时刻”渐行渐近.pdf": {"id": "attachment:files/Nomura-全球机器人行业：具身智能的“ChatGPT时刻”渐行渐近.pdf", "kind": "attachment", "title": "Nomura-全球机器人行业：具身智能的“ChatGPT时刻”渐行渐近", "source_label": "Nomura", "excerpt": "EQUITY: TECHNOLOGYGlobal RoboticsGlobal Markets Research 23 October 2026 The ChatGPT moment comes into view Frontier models tested on robots likely outperform;December-January rele", "content": "EQUITY: TECHNOLOGYGlobal RoboticsGlobal Markets Research 23 October 2026 The ChatGPT moment comes into view Frontier models tested on robots likely outperform; December-January release is likely the first catalyst Robotics replays the LLM path’ its ChatGPT moment closer than it looks Robots are following the same path that large language models (LLMs) have taken, and their ChatGPT moment could come sooner than expected, in our view. A scientist at NVIDIA (NVDA US, Not rated) expects robot training going through the same three stages as LLMs: 1) robots learn broadly from large amounts of data; 2) they are tuned for specific tasks; and 3) they improve through trial-and-error with RL (reinforcement learning). Our industry checks in September indicate sentiment on robots has turned more upbeat for two reasons: 1) robots’ precision level jumps sharply once they are trained on sufficient action feedback, the same kind of sudden leap seen in LLMs; and 2) in our view, there is increased likelihood of robots reaching the equivalent of L2+ assisted driving within two years. Further, we expect the breakthrough to come from big AI labs and Tesla (TSLA US, Not rated). Our industry survey suggests OpenAI’s (unlisted) internal models have performed well without the touch-sensor data that labs thought they would need. Catalysts: OpenAI’s physical-AI model, ByteDance (unlisted) and DeepSeek’s (unlisted) new models, and OpenAI humanoid demo and GPT-7 (likely in 2027F). Ego video leads pre-training as training gets increasingly cheap Beyond models, we believe data will decide who takes the lead. It is the scarcest input, and the industry is turning to videos to fill the gap. Following the same steps as LLM training: 1) robots first learn from a large volume of first-person (Ego) videos of people doing everyday tasks; 2) they are then fine-tuned on a small amount of teleoperation and motion-capture data; 3) and finally they undergo practises by trial-and-error in simulation (for hand manipulation, more pre-training compute will bring steady and predictable gains, the same scaling law that has driven LLMs in the past). Training costs, meanwhile, are falling fast. SuperMimic , a CoRL (Conference on Robot Learning) 2026 paper, teaches one model that can dictate a robot’s body moves and trains the controller inside the model at the same time. After just three hours on one GPU, the model beats a baseline that has been trained for seven days on 128 GPUs. The paper reports more than 1,000x less compute, and the learned model has stayed accurate as motion data grows from 1 to 264 hours. Pre-training is only half the story, however. To keep improving, models need data from robots working in the field, and that has direct implications for hardware. Dexterous hands benefit first; body consistency decides who wins in hardware Better brains likely help dexterous hands first. Robots have been stuck with grippers mainly because the data needed to train hands is relatively limited. Stronger foundation models should be able to carry skills learned on two- or three-finger grippers over to five- finger hands, enabling volume lifting and bring unit prices down. We expect 2026F hand shipments to grow 80-120% y-y, led by high-DOF (degrees of freedom) hands. Once the model route settles, we expect humanoid designs to gradually settle into a handful of standard forms: an “iPhone moment” for hardware. From then on, the hard part would be building every unit in a same/similar way. This matters for data as much as for quality. A humanoid has more than 20 joints, and if the humanoid behaves slightly differently from one another, a control policy trained on one robot might only work on few others. Therefore, we believe the winners would be makers that iterate fast and keep costs tight, such as Unitree (688836 CH, Buy), automakers, and key component suppliers. As Unitree volumes grow, we expect it to outsource more components from external parties, both to maintain low costs and to secure quality. Risks: 1) robotics OEMs with poor product consistency that rely heavily on data-collection customers could see demand fall; and 2) brain start-ups business models might change.Research Analysts Advanced Manufacturing Frank Fan - NIHK frank.fan@nomura.com +852 2252 2195 Donnie Teng - NIHK donnie.teng@nomura.com +852 2252 1439 See Appendix A-1 for analyst certification, important disclosures and the status of non-US analysts.Production Complete: 2026-10-23 12:11 UTC Robot brains: a breakthrough is plausible Robotics is replaying the LLM path, but from an earlier starting point Measured against how LLMs developed, robot brains have not yet reached the GPT-2 stage: early signs of emergence have shown up in labs, but no model is reliable enough for real work. A scientist at NVIDIA argued that robots will go through the same three steps as LLMs : 1) broad pretraining; 2) tuning to follow instructions; and 3) RL (reinforcement learning), where the model improves by trial-and-error. We compare today’ s robotics to the AlexNet moment of 2012, when deep learning first proved itself. Our industry checks show: 1) December-January models would be closer to GPT-2 — promising, but not ready for production; 2) world models are less mature than AI was in 2012; and 3) the most bullish view comes from Wang Xingxing, founder of Unitree, who said on 22 October that physical AI was already showing early signs of a breakthrough, likely within one to two or two to three years. He added that almost everyone, himself included, continued to under-rate AI. In addition, OpenAI CEO Sam Altman told Fortune he expected a “cool demo” of an OpenAI robot in 2027, with robots on the streets a few years thereafter. In our view, today’s robot brains are not yet at GPT-2 level. In the next round of model release will, likely, bring them up to it. Fig. 1: Robotics replicating the LLM scaling playbook Dimension Legacy paradigm New paradigm Mechanism LLM analogue Model architecture VLA (Vision-Language-Action): next- token action predictionWAM (World-Action Model)Jointly decodes future video frames and motor commands — imagines how the world evolves, then actsUpgraded pre-training objective (language modeling → world modeling) Data scaling Teleoperation: expensive, slow, hard to scaleWearables + egocentric human videoReplaces robot-embodiment data with large-scale egocentric human video; establishes neural scaling laws for dexterityInternet-scale corpus Simulation / RL environmentClassical physics engines Neural simulators Learned world models replace hand-coded physics, accelerating RL rolloutsSynthetic data / self-play Post-training / fine-tuningFull fine-tuning of the base model Bi-level fine-tuning Lightweight RL policy sits atop a VLA/WAM base, making real-time sub-millimeter corrections without full-model fine- tuningRLHF / LoRA-style lightweight post- training Source: Elsewhere News, Nomura research GPT-3-style few -shot signals are real but remain lab-bound The robot version of GPT-3’s big step, learning a new task from a short example instead of retraining, has started to appear. We check three cases: 1) Generalist AI (unlisted) said on 20 August that its GEN-1.5 model could learn a task from a single 3-12 second demonstration. Without any extra training it succeeded 59% of the time across ten tests, rising to 83% after a short top-up on five minutes of data; 2) Skild AI (unlisted) launched S1 on 31 August and said robots could learn tasks of up to ten minutes, such as making coffee, by watching just a video of people doing the same, but it did not give success rates; and 3) Robbyant (unlisted), Ant Group’s (unlisted) robotics unit, said in an August paper that its Zero-WAM (world action model) succeeded 47.0% of the time on seven tasks it had never seen, in simulation, 29.5 points better than the best comparable model. This fits our industry checks that teaching a robot a new task now takes one or two demonstrations rather than dozens or hundreds. However, all three results are from the companies, and all come from short or simulated tasks. Skild’s chief executive, Deepak Pathak, said S1 is not quite ready for homes and that robotics has not yet had its ChatGPT moment. So GPT-3-style learning has arrived in principle but is not yet reliable, which is why we still place robots before or at GPT-2. Three model families split the robot brain: VLA, world model, and RL Three types of model are competing to become the robot’s brain, and each is at a different stage. A VLA (vision-language-action) model looks at the scene, takes an instruction and outputs the desired movements, usually a path that a lower-level controller could follow. A world model that predicts what will happen after the robot acts. Following Feifei Li’s (co-founder of World Labs) framework, it splits the task into three parts: 1) a renderer that produces images (where video generators such as Sora sit); 2) a simulator that predicts physical change; and 3) a planner that decides what to do next, which is the role VLA plays. The third approach, RL in simulation, trains a robot’s movements by trial and error inside a physics simulator. Unitree’s walking robots are the best-known example, and skills trained only in simulation already work on real machines. The NVIDIA scientist argues that early VLA models such as π0 and GR00T spend most of their Nomura | Global Robotics 23 October 2026 2 8XoXgZzWvXsNqPtM6M9R7NoMoOpNtNkPqRoOeRoMtP8OrQoNuOmOtOvPmQnN capacity on language, so they know what things are but not how things move. His WAM uses video generation as the physics engine instead, because predicting video frame by frame teaches gravity, buoyancy and light. It predicts what happens next and what the robot should do in one step, so it can handle new scenes without extra training. The Dream Dojo (generalizable foundation world model) work goes further, replacing the physics engine with a video model so robots can practise in many simulated worlds at once. On the robot itself, the smallest models win: on-board VLA models have 2-7B parameters and need about CNY30,000-40,000 of chips and storage. World models are much heavier. Our industry survey indicates World Labs’ Atlas at 100-200B parameters, and Robotera (unlisted) said world models that generate full video need 3-10x more computing power to run, versus 30-100% more for leaner versions that work on compressed internal representations. So through 2027F we expect world models to run in the cloud, training robots and generating data, while compact VLA and RL models run on the robot. LLM model labs hold the compute and talent a breakthrough needs We expect the breakthrough to come from two places, leading AI labs that build foundation models and Tesla, rather than from robot-brain start-ups. Computing power is the clearest gap. Our industry checks indicate US engineers each have more than ten times the computing power of their Chinese peers, and that ByteDance (unlisted) has the most computing power in China for robotics. We expect OpenAI to release a model built for physical AI in December-January, and Google (GOOGL US, Not rated) and other labs to publish results within about three months (Google’s Gemini Robotics 2, released on 30 July 2026, completed long, multi-step tasks up to 91.3% of the time, our industry survey shows about a year ahead of Chinese rivals in whole-body control). Wang Xingxing, founder of Unitree, agrees that frontier models will drive the leap. According to Wang, next year’s GPT-7 is likely to break through embodied AI’s current bottleneck, and that Unitree has tested GPT-6 on its robots with very good results. Based on our industry survey, leading integrated player could be the second source of a breakthrough, as integrated players share some of the labs’ strengths, namely computing power and a closed data loop, and adds something they lack: their own fleet of robots in use. Our industry survey suggests Tesla runs a full loop, from simulation and world models through sorting data, a data platform and factory testing, with its sensors and data formats largely settled. In addition, Tesla robots complete an unsupervised factory routine, from checking screens and fetching tools to fixed-point tasks and charging themselves, about 97% of the time, based on our industry survey. Further, Tesla trains on road video from millions of its cars as well as on robot data and simulation, with a general world model at the centre. We see the labs and Tesla as complementary: the labs bring general models and talent, while Tesla brings a closed loop and a fleet. Either way, the winners will be those with computing power, a data loop and robots in the field, which likely puts Chinese robot-brain start-ups at a disadvantage. Five operating metrics define when robot brains reach a ChatGPT moment We propose five tests to determine whether robotics has reached its ChatGPT moment, and robots fall well short on all of them today, according to our industry survey. First, how long can a robot work before a human has to step in: the best is still a few hours, while factories need a week of unattended running. Second, fine handwork: Gemini Robotics 2, running on an Apollo 2 robot with a Sharpa (unlisted) Wave hand, tied a garbage bag 44% of the time and swept into a dustpan 32% of the time, according to our industry survey. Third, how quickly a model adapts to a new robot body: Google’s takes about seven to eight hours, while the faster Chinese players need about two weeks. Fourth, how many demonstrations a new task takes: in labs this is down to one or two, based on our industry survey. Fifth, accuracy on the factory floor: our industry check puts it at about 60% today, against the 98% or more that industry requires, and we expect three to five years to close the gap. In our view, the first and fifth tests matter the most, because they decide whether customers pay for robots out of operating budgets rather than from trial budgets.Nomura | Global Robotics 23 October 2026 3 Fig. 2: Gemini Robotics: task success rate Source: Industry survey, Nomura research Data: where robots get their training data Robots have no internet to learn from, so data is also critical Data is what holds robot brains back. Language models learned from the text of the whole internet, but robots have nothing comparable. Teleoperation, where a person remotely steers a robot to record training data, is expensive and slow, and each setup can only record a certain volume. Our industry checks suggest he rough threshold for “emergence moment” is about 1mn hours of data, roughly a human lifetime, against only about 100,000 hours of usable data collected so far in one consistent format. In addition, leading companies have only several hundred thousand hours of good-quality data, and Tesla’s Optimus has just passed 0.5mn hours, based on our industry checks. Further, our industry survey shows that training needs 10mn hours to get started and over 100mn hours in the long run, against an industry stock in the low millions of hours. We think these estimates differ because they count different things, from strictly usable data in one format to every hour recorded. Much of what is collected is wasted: at Unitree only about a quarter of recorded time was usable, one usable hour for every four recorded. At this early stage, data quality matters. The real question is in which way can collecting data scale up usable hours the fastest, and at what cost. Four ways to collect robot data: cheaper per hour versus reusable across robots There are four main ways to collect robot data, and the choice comes down to cost per hour versus whether the data can be reused on other robots. Our 19 August initiation on Unitree ( Initiating coverage on China’s embodied-AI leader ) put China’s 2026F data- collection market at about CNY4-5bn. Real-robot teleoperation would account the most at about CNY2.4bn, followed by Ego video and UMI at CNY1.3bn, simulation at CNY0.6bn and failure-recovery data at CNY0.3bn. By hours collected, Ego and UMI made up about 45%, teleoperation 30%, failure recovery 15% and simulation 10%. These figures reflect the market in mid-2026, and we expect prices to fall within 12-24 months as more than 20 city-level data factories and overseas crowdsourcing ramp up. Real-robot teleoperation costs about CNY700 per hour, or CNY500-1,000 in our industry survey. But the data only works for one particular robot design, so switching from legs to wheels will render it ineffective. UMI (universal manipulation interface), handheld grippers that people use to record tasks, costs CNY100-300 per hour, but it gets in the way of people’s normal work, so orders remain small and custom. Ego (first-person) video of people costs about CNY300-350 per hour, putting it in the same band as UMI, and because it is camera footage, it stays useful across robot generations. Simulation is the cheapest at about CNY120 per hour, but it makes up no more than 20% of data for real-world perception tasks.Nomura | Global Robotics 23 October 2026 4 ACOmLK/KN8IPRVOx5dgEPyB37BmcZ+QBHK/RTVHTXamcFsvHs0J2EhU8lxkoWXpq Fig. 3: Data collection market size Source: Company data, Nomura estimatesFig. 4: Share and ASP in different data collection types Source: Company data, Nomura estimates Scaling law extends to video, favouring labs with the most computing power The industry is settling on videos of people, filmed from their own point of view, as the main training data. This ties the data question back to who would win the race for robot brains. Our industry checks suggest a typical mix of 60% Ego video, 30% UMI and 10% real-robot data, with collection kits settling on two head cameras plus wrist cameras. NVIDIA’s EgoScale follows the same principle. It first trains on more than 21,000 hours of everyday first-person video of people, then fine-tunes on a small amount of teleoperation and motion-capture data. For hand manipulatio", "status": "extracted"}, "post:2026-10-25T23-10:ae52588398ae": {"id": "post:2026-10-25T23-10:ae52588398ae", "kind": "post", "title": "2026-10-25 23:10", "source_label": "帖子正文", "excerpt": "亚马逊CEO博客访谈: 1.亚马逊2026年资本开支2200亿美元，依然无法满足AI算力需求，投入受真实订单驱动。2.2026年算力基本售罄，2027年接近售罄，2028年已有大量产能被预订。", "content": "亚马逊CEO博客访谈: 1.亚马逊2026年资本开支2200亿美元，依然无法满足AI算力需求，投入受真实订单驱动。 2.2026年算力基本售罄，2027年接近售罄，2028年已有大量产能被预订。 3.内存成为AI扩张的重要瓶颈，HBM与传统DRAM争夺产能，供应紧张可能持续数年。 4.AWS的AI业务仅用三年就突破250亿美元年化收入，商业化速度远超早期云计算。 5.企业级AI应用仍处于早期，未来5至7年推理需求有望迎来大规模增长。 6.AI推理成本持续下降将推动应用普及，进一步扩大算力和存储需求。 7.数据中心建设通常需要提前约两年投入，不能简单用当期收入衡量资本开支回报。 8.Jassy认为AWS长期有机会达到万亿美元年收入规模，AI可能显著扩大云计算市场。 对于我们投资而言，不是只是了解需求，要看需求最终如何转换成回报。三个关键就是:一、需求决定产业的天花板，这个天花板目前很高，AI需求目前也是供不应求;二、供给决定短期的稀缺性，AI基础设施需求旺盛并非单纯由股票市场叙事凭空制造;三、资本回报决定长期投资价值，前面两个已经存在，有需求也有供给，接下来就是持续证明产业增长与股票回报之间的关系，说人话就是投入的钱持续带来更高的回报，而不是每次只看资本开支，要看每年的资本开支最终带来多少回报，这一个我们只需要每个季度看财报就可以了。下周谷歌、微软、亚马逊，轮番认证。#文字观点", "publish_time": "2026-10-25 23:10", "tags": ["文字观点"]}, "post:2026-10-25T21-08:27452f2fddeb": {"id": "post:2026-10-25T21-08:27452f2fddeb", "kind": "post", "title": "2026-10-25 21:08", "source_label": "帖子正文", "excerpt": "浙商机械 邱世梁|王华君【具身智能】通用大模型GPT-6 Astra表现亮眼，大脑环节发展加速，人形机器人量产渐近，持续推荐！1️⃣OpenAI：GPT-6 Astra表现亮眼，LLM as policy范式有望落地 通用大模型GPT-6 Astra在LIBERO、SIMPLE等具身任务评测中表现饱", "content": "浙商机械 邱世梁|王华君【具身智能】通用大模型GPT-6 Astra表现亮眼，大脑环节发展加速，人形机器人量产渐近，持续推荐！ 1️⃣OpenAI：GPT-6 Astra表现亮眼，LLM as policy范式有望落地 通用大模型GPT-6 Astra在LIBERO、SIMPLE等具身任务评测中表现饱和，在RoboDojo双臂操控测试中任务成功率达81.9%，混合系统平均分62.6，#领先同业。GPT-6 Astra区别于以往大脑+小脑的双系统架构，由#大脑直接向末端执行器输出动作指令，后续LLM as policy范式（大语言模型无需任务特定微调，直接指挥机器人操作）有望落地。 此前OpenAI任命文生图模型DALL·E和视频生成模型Sora的核心开发者、研究副总裁阿迪亚·拉梅什作为机器人业务负责人，#或将基于大语言模型开发具身大模型。2️⃣特斯拉：2027年底Optimus周产能有望达2万台，同期开始对外出货 特斯拉Optimus量产时间表：①26Q2：每周几十台；②26年九月：每周数百台；③26年底：每周1000台；④27年底：每周2万台，对应#年产能约百万台。Optimus后续落地计划：未来1-2月内发布Optimus V3#非预编程的演示视频；27年4月将AI5集成在Optimus中（目前AI5已完成流片）；#27年底向外部客户发货。国际巨头特斯拉量产在即，Open AI入局，国内产业、政策、资本共振，人形机器人产业化进展加速。 🚀【具身智能】重视： 1、确定性强的零部件供应商：恒立液压、三花智控、拓普集团、浙江荣泰、汇川技术、双环传动、绿的谐波、五洲新春、金沃股份、奥比中光、中大力德、雷迪克等 2、整机及应用场景：宇树科技、杭叉集团、中力股份、杰克科技、咸亨国际、杭州柯林、新时达、横河精密、中坚科技、优必选、安徽合力等 3、新技术或低估值转型标的：涛涛车业、上海沿浦、华翔股份、峰岹科技、安培龙、柯力传感、汉威科技、福莱新材、日盈电子等 风险提示：AI发展不及预期等 🔗浙商机械【具身智能】60多篇深度报告合集：浙商机械【人形机器人】系列深度 浙商机械 邱世梁/王华君18610723118/蒋逸18158576706/秦乐恒1522168014 劣币驱逐良币：这种模式 无法区分周期性利好与结构性利好，一个因行业红利而短期爆发、但长期会毁灭价值的平庸公司，在 A 股短 期内获得的估值，往往比一个稳扎稳打、通过极深护城河持续创造自由现金流的优秀公司还要高。 针对上述问题，需重构定价锚点，跳出 A 股极致博弈的内耗，建立既能适应 A 股生态、又能坚守底层 商业逻辑的修正框架，具体可从 以下三个方向入手。 其一，引入\"全周期平滑利润\"（Normalized E arnings）替代\"极值利润\"：对于任何高景气或强周期的行 业，既不要用当下的最高利润去年化，也不要用最惨的亏损去年化，而是采用类似席勒市盈率的思维，测算该 商业模式在一个完整产业周期（通常 3-5 年或更长）内的平均资本回报率（ ROIC）和平均净利润，并基于这 个平滑后的利润给予合理估值。 其二，建立\"自由现金流（FCF）+ 股东回报\"的绝对估值底线：将定价权重的核心从\"账面利润增速 （G）\"转移到\"自由现金流产出率\"和\"分红/回购率\"上，一个长期的好生意，必定能在剔除维持性资本开支后产 出丰厚的 FCF；若一家公司缺乏短期爆发性景气度，但能提 供 6%-8% 的确定性股东回报收益率，这就是它 的绝对价值底线——这也是近年来\"红利低波\"与重资产周期股迎来价值重估的核心底层逻辑。 其三，构建\"价值为锚，边际为帆 \"的二维交易体系：只有当资产价格处于低于或等于其内在绝对价值的 区间时，才去顺应景气度和边际改善进行进攻。左侧看价值，在被市场因 \"短期景气度不佳\"而抛弃的优质资产 仅供内部参考，请勿外传！ 2 航运港口 行业动态报告 请务必阅读正文之后的免责条款和声明。 中寻找赔率（极度便宜）；右侧看边际，当这些极度便宜的资产出现哪怕一丝微弱的边际改善（如供给端出 清、价格企稳）时，再利用 A 股的\"景气度放大器\"效应去兑现收益，但在触及极值估值前坚决离场。 最后，我们重申并旗帜鲜明地反对所谓的叙事投资理论。 叙事投资理论是一种极致的刻舟求剑，并不是 用第一性原理去思考投资，而只是对一种投资现象的表层总结。回归本质、回归第一性原理，才是投资的核 心。 二、行情综述：航运板块与港口板块 涨跌互现 2.1航运市场整体情况 2.1.1集运：综合指数持平，欧洲上涨、南美与东南亚回落 本周，中国出口集装箱运输市场在国庆假期后平稳恢复，运输需求总体稳定，多数航线运价小幅波动。 10 月9日，上海出口集装箱综合运价指数（ SCFI）报3664.11点，周环比持平。市场呈现 “美线稳定、欧地回升、 南美与东南亚回落”的分化格局。 此前运力计划显示， 船公司将在 10月中旬集中削减跨太平洋及亚欧航线运力， 有望缓解节后需求放缓带来的价格压力。整体来看，市场尚未形成统一方向，区域需求与空班安排将继续主导 短期运价。 美洲航线：美西微涨、美东持平，供需总体稳定。 10月9日，上海港出口至美西、美东基本港市场运价分 别为7584美元/FEU、10524美元/FEU，周环比分别上涨0.1%、持平。美国就业市场出现放缓迹象，但当前运 输需求尚未明显转弱。运力计划显示， 10月12日当周跨太平洋航线空班率预计接 近计划运力的18%，供给收 缩有望对运价形成一定支撑。 亚欧与地中海航线：即期运价回升，但需求基础仍偏弱。 10月9日，上海港出口至欧洲、地中海基本港市 场运价分别为2274美元/TEU、3002美元/TEU，周环比分别上涨3.4%、0.2%。节后订舱恢复带动欧线报价反 弹， 船公司计划于10月中旬增加空班； 但欧洲通胀和经济增长压力仍制约进口需求， 短期运价预计以震荡为主。 拉美航线：南美运价继续调整。 10月9日，上海港出口至南美基本港市场运价为 5925美元/TEU，周环比 下跌0.9%。区域运输需求增长乏力，供需基 本面缺乏新增支撑，船公司揽货竞争推动即期价格继续下移。 亚洲内航线：东南亚多数航线回落。 10月9日，东南亚集装箱运价指数报 5769.48点，周环比下跌1. 0%。 节后运输需求略显疲软，不同航线货量和舱位供需存在差异。短期市场预计维持分化震荡，仍需关注区域货量 恢复及箱源周转情况。 2.1.2油运：原油轮全面走强，成品油轮高位分化 本周国际油运市场延续强势，原油轮涨幅明显大于成品油轮。 10月9日，BDTI报7964点，周环比上涨 20.9%；BCTI报2403点，周环比下跌0.5%。霍尔木兹及周边船舶安全事件增加 ，通航、等待和转运持续占用 有效运力，推动VLCC跨区航线普涨。中东湾 —中国TD3C航线TCE约141.26万美元/天，周环比上涨15.6%。 中东航线：中东VLCC收益继续上行。 海峡安全风险和港外等待压缩可用船舶，船东议价占优，中东湾 — 新加坡与中东湾—中国收益分别周涨17.7%、15.6%。 仅供内部参考，请勿外传！ 3 航运港口 行业动态报告 请务必阅读正文之后的免责条款和声明。 美湾航线：美湾—中国涨幅显著扩大。 TD22航线TCE约63.77万美元/天，周环比上涨59.3%；亚洲买家 增加远程替代货源、航程拉长，叠加大西洋可用运力收紧，支撑吨海里需求。 西非航线：西非—中国同步走强。 TD15航线TCE约76.30万美元/天，周环比上涨48.1%；中东供应链扰 动带动亚洲替代采购，且高收益市场吸收部分运力。 成品油轮：指数小幅回落，船型与区域继续分化。 红海LR2成交创高，中东长程 LR2仍受转运和运力偏 紧支撑，但LR整体周度涨势放缓；大西洋 MR运力回补，主要航线收益普遍下跌。 2.1.3散运市场：海岬型继续下跌，巴拿马型逆势走强 本周干散货市场延续船型分化，海岬型船显著下跌，巴拿马型与超灵便型上涨，小灵便型小幅回落。 10月 9日，BDI报2917点，周环比下跌7.3%；BCI、BPI、BSI和BHSI分别报4340点、2424点、1814点和996点， 周环比分别下跌13.9%、上涨2.2%、上涨1.4%和下跌1.1%。 海岬型船受大西洋可用运力充裕、巴西铁矿石货盘偏弱拖累，日收益降至约 39363美元，C3巴西—中国航 线运价降至33.725美元/吨。尽管中国铁矿石进口保持高位，但钢铁需求与盈利偏弱，未能抵消运力压力。 巴拿马型船受澳洲及跨大西洋货盘增加带动，日收益升至约 21813美元；煤炭、谷物及矿石询盘改善，推 动市场逆势上涨。超灵便型船在北太平洋货盘支撑下温和走强，日收益约 22929美元；小灵便型船因区域需求 不均回落至约17926美元。短期各船型预计继续分化。 2.2国内市场：航运板块与港口板块涨跌互现 从交运各子板块相对沪深 300表现看，本周（10月5日-10月10日）交运板块涨跌互现。本周航运板块涨 幅为5.46%，港口板块跌幅为1.13%。 图1: 交通运输行业各子板块与沪深 300的超额收益 数据来源：Wind，中信建投 -150%-100%-50%0%50%100%150%200%250%300%2019/1/12020/1/12021/1/12022/1/12023/1/12024/1/12025/1/12026/1/1公路铁路公交快递航运港口航空机场物流综合 仅供内部参考，请勿外传！ 4 航运港口 行业动态报告 请务必阅读正文之后的免责条款和声明。 图2: 交通运输行业涨跌幅股票排名前十（单位： %） 图3: 航运港口板块涨跌幅股票排名前五（单位： %） 来源：Wind，中信建投 数据来源：Wind，中信建投 排名证券简称涨幅证券简称跌幅 1中远海能14.3天顺股份-4.1 2三羊马10.4厦门空港-3.0 3招商轮船9.5中国东航-2.9 4招商南油5.8海晨股份-2.5 5中创物流5.3吉祥航空-2.3 6四川成渝4.9中国国航-2.2 7粤高速A4.9华夏航空-2.0 8怡亚通4.8*ST瑞茂-2.0 9皖通高速4.6恒通股份-1.6 10德新科技4.4恒基达鑫-1.6 排名股票名称涨幅股票名称跌幅 1中远海能14.3恒基达鑫-1.6 2招商轮船9.5厦门港务-0.3 3招商南油5.8青岛港-0.2 4中国外运4.4北部湾港0.0 5宁波港2.8海峡股份0.0 仅供内部参考，请勿外传！ 5 航运港口 行业动态报告 请务必阅读正文之后的免责条款和声明。 图4: 航运港口板块主要标的股价表现及估值 细分行业 上市公司 股票代码 市值（亿元） 周涨跌幅 年初至今涨幅 PE （TTM） PB EV/EBITDA 航运 渤海轮渡 603167.SH 37.53 -0.69% -2.96% 17.34 1.13 5.66 招商轮船 601872.SH 1782.05 -5.17% 92.86% 16.43 3.80 16.97 中远海能 600026.SH 1217.83 -5.65% 46.71% 19.15 2.67 13.45 海峡股份 002320.SZ 141.59 -4.02% -46.75% 77.51 3.49 8.18 中远海控 601919.SH 2487.12 -0.26% 4.72% 9.48 1.09 2.94 中远海发 601866.SH 264.86 -1.67% -6.37% 19.71 1.03 12.75 中远海特 600428.SH 300.46 -1.17% 71.21% 12.92 1.77 5.82 长航凤凰 000520.SZ 41.39 -2.78% -20.66% (270.80) 9.26 (219.27) 招商南油 601975.SH 223.72 -4.04% 18.55% 14.40 尔思光电：当前月产能 900 万只，四季度提升至月产能 2200 万只，2027 年达到年产 3 亿只，产品以电吸收调制激光器 EML 为主，同时包含多种品类混合。⚠️ 有消息称其激光芯片目标年产 10 亿只，但该目标没有明确落地", "content": "我梳理了国内激光芯片厂商的扩产情况，内容如下： 📌 1. 东山 / 索尔思光电：当前月产能 900 万只，四季度提升至月产能 2200 万只，2027 年达到年产 3 亿只，产品以电吸收调制激光器 EML 为主，同时包含多种品类混合。 ⚠️ 有消息称其激光芯片目标年产 10 亿只，但该目标没有明确落地时间，这个说法需要谨慎看待。 📌 2. 仕佳光子：100mW 连续波 CW 激光器规划年产 7200 万只，项目周期 2 至 3 年，主要在 2029 年实现满产。 📌 3. 云岭光电：70mW/100mW 连续波 CW 激光器规划年产 1875 万只，项目周期 3 年，主要在 2029 年实现满产。 📌 4. 纳真光电：部分报道提出总产能目标 1.7 亿只，同样为多品类混合产能，其中很大一部分是 200G EML 产品。 📌 5. 源杰科技：当前年产约 1000 万只，计划在 2027 年初以及 2028 年扩产，暂未披露扩产后产能规模。 📌 6. 宏晨光电：这是 2026 下半年产能过剩论调里很典型的案例。部分光板块空头声称其产能可达 6000 万至 7000 万只…… ❌ 但该说法最终被证实完全不实。公司真实口径为 “70mW/100mW 产品进入小批量试产阶段”。 📌 7. 鼎新光电：目标混合产能年产 1500 万只，产线覆盖 70mW/100mW 连续波 CW 激光器以及 100G EML。 📝 我也统计了华工、光迅等其他厂商，并对激光产品结构做了一定推演，但是只纳入了公开披露的信息。 📊 来自可插拔光模块供应商渠道调研信息： ✅ 根据中际旭创、剑桥科技渠道反馈，70mW/100mW 激光器目前确实是供给瓶颈，激光器平均售价 ASP 正在上行。 📉 激光器供给紧张程度相比几个月前进一步加剧。 💡 我认为这个赛道不存在极高的护城河，国内厂商已经具备竞争力。但瓶颈就是瓶颈，有产能兑现能力的厂商会受益，这本质是一个走量的生意。 📌 头部可插拔光模块厂商的实际动作： 📄 中际旭创 9 月披露信息：正在积极导入新供应商，计划签署 2 至 3 年期的长期合约锁定上游激光芯片产能，持续为 1.6T 可插拔光模块保障供货。 🤝 行业内部存在博弈，各家都在争抢经过验证的有效产能。 💸 即便存在一定超额下单，激光器物料成本占比不高，厂商更愿意多锁定几家供应商的产能，避免下游业务损失数十亿元，同时也会对竞争对手形成压制。 📌 面向 CPO 的高端产线：未来几年，国内厂商还无法和海外厂商形成竞争，但国内厂商最终会实现相关技术突破。 🗣️ AAOI 首席执行官观点：国内厂商在大功率 CPO、DWDM 激光器生产方面仍落后数年，未来 2 到 3 年很难追上。 🗣️ LITE 首席执行官提出质疑：国内厂商对外宣称的产能，能否真正转化为商业化出货。其表态是：至少目前，我们没有看到来自国内激光芯片供给带来的冲击。 📌 即便仕佳、华工、源杰等厂商都公布了 400mW 产品能力与扩产目标，海外企业高管仍然质疑国内产品的可靠性，以及产线规模化落地能力。 ⏳ 我的判断：可插拔模块对应的中低端激光器供给瓶颈会随着产能上线，在 2028 年逐步缓解；所有线索都不支持短期供给泛滥的判断。 🔧 以 100mW 产品举例，有观点指出对应的设备投入周期需要 2 年；更高功率产品设备投入周期达到 3 年，也就是说国内厂商的产能落地本身就需要多年时间。 ✅ 激光厂商高管提出的 “持续多年供给紧缺” 判断大概率成立，高端品类尤其明显，产线建设周期很长。 ⚖️ 国内厂商已经形成实质性竞争，但 2026 至 2027 年，行业都在争抢 CW 激光器长期供货协议。 📌 大量新增产能大概率倾斜至高规格激光器或者 EML 产品。LITE 此前长期受 EML 供给瓶颈制约，此前只能向外采购 CW 光源自给，目前该情况有所好转。 📌 与此同时，主权数据中心建设带动 800G 需求尾期景气延续时间可能远超市场预期，需求持续时长会出现超预期变化，我们持续观察。 📌 长期来看供应链会走向二元分化： 🇨🇳 国内厂商优先保障本土供给能力，同时也会大量采购全球物料。 🌍 海外厂商现阶段优先使用海外供应链，除非国内能提供足够低价的产品供给，短期来看该情景很难出现。 📌 核心总结： ✅ 高端规格激光器持续多年紧缺的判断基本成立。 ❌ 上半年大量关于国内产能泛滥的说法最终被证伪，从存储到光子赛道，市场总是反复出现这类传言。 ✅ 国内激光厂商在 70mW/100mW 赛道具备竞争力，每年产能扩张幅度可观；但在需求上行背景下，没有供给过剩迹象，紧张格局大概率持续到 2028 年逐步缓和。 👀 供应链每个月都在变化，以上仅为我当前观察得出的观点。#文字观点", "publish_time": "2026-10-25 22:07", "tags": ["文字观点"]}, "post:2026-10-25T17-52:5cedd8124f02": {"id": "post:2026-10-25T17-52:5cedd8124f02", "kind": "post", "title": "2026-10-25 17:52", "source_label": "帖子正文", "excerpt": "🔥【开源通信】MPO&DFAU 强通胀逻辑初步兑现 🐯订单、业绩拐点、并购陆续落地，验证MPO&DFAU 强通胀逻辑。10 月 21 日，仕佳光子发布 2026 年三季报，单 Q3 实现营收 12.27 亿元，同比+116.06%，环比+33.51%，归母净利润 2.71 亿元，同比+226.19%", "content": "🔥【开源通信】MPO&DFAU 强通胀逻辑初步兑现 🐯订单、业绩拐点、并购陆续落地，验证MPO&DFAU 强通胀逻辑。10 月 21 日，仕佳光子发布 2026 年三季报，单 Q3 实现营收 12.27 亿元，同比+116.06%，环比+33.51%，归母净利润 2.71 亿元，同比+226.19%，环比+36.43%； 10 月 22 日，致尚科技发布 2026 年三季报，单 Q3 实现营收 6.35亿元，同比+171.77%，环比+52.34%，归母净利润 0.42 亿元，同比实现扭亏为盈，环比+140.88%。 🐯10 月 23 日，光库科技收购安捷讯的交易获深圳证券交易所并购重组审核委员会审核通过，我们认为本次并购可极大发挥产业链技术协同优势，体现无源光器件行业对未来需求的较强信心，也印证光通信赛道的高景气度。 🐯光纤连接器订单密集催化，MPO 赛道高景气再获验证。2026 年 10 月 12日，杰普特发布公告称，公司自 2026 年 1 月 1 日以来持续收到北美 V 客户采购订单，累计金额约 1.63 亿美元（折合人民币约 11.10 亿元，约为 2025 年全年营收的 53.52%），相关产品为光纤连接器产品。致尚科技于 2026 年 9月 30 日宣布与 PH 客户签署《2027 年度需求预测合作备忘录》，约定 PH 客户预计 2027 年度向公司采购光纤连接器，总需求预测目标金额为 5 亿美元（折合人民币约33.65 亿元，约为公司 2025 年营业收入的 3.37 倍）。 🐯Meta 营收、指引双双超预期，再次上调资本开支指引下限。10 月 22 日 Meta 发布第三季度财报，公司 2026 年第三季度实现营收 646.01亿美元，同比增长 26%，高于 633.7 亿美元的一致预期，公司预计第四季度营收 730-760 亿美元，中值 745 亿美元同样高于市场约 730 亿美元的预期。资本开支方面，公司再次上调资本开支指引下限，预计 2026 全年资本开支1350-1450 亿美元(上季度指引 1300-1450 亿美元)。公司推出消费者 AI 助手Muse，公司围绕 Meta 超级智能实验室重组架构，同时推出面向企业客户销售AI 工具的新业务线。 🐯多家AI 公司齐发声，在手订单饱满，AI 产业趋势向上。10 月 23 日，新易盛、中际旭创和天孚通信等 AI 龙头分别发布公司近期生产经营情况的公告，预计 1.6T、800G 等高端光模块需求将保持快速增长，NPO、XPO 等下一代光互连产品需求亦有望逐步释放。国内市场方面，AI算力基础设施建设快速推进，400G、800G 等产品需求亦有望进一步增长。此外，新易盛和天孚通信均在 10 月 23 日发布回购股份方案，我们认为，回购体现了公司稳健的经营情况，也表明公司未来持续发展的信心。 ☎️开源证券通信蒋颖/杨昕东/杜致远/马堉博团队@所有人#文字观点", "publish_time": "2026-10-25 17:52", "tags": ["文字观点"]}, "post:2026-10-25T10-04:520075fc177d": {"id": "post:2026-10-25T10-04:520075fc177d", "kind": "post", "title": "2026-10-25 10:04", "source_label": "帖子正文", "excerpt": "野村——深南电路（002916.SZ）——3Q26：AI PCB驱动利润率强劲扩张 • 3Q26业绩超预期，利润率大幅改善：深南电路发布前三季度业绩，并召开业绩说明会。前三季度营收/净利润同比大增53.8%/77.5%，其中3Q26单季营收/净利润同比飙升66.3%/94.4%，环比增长20.4%/", "content": "野村——深南电路（002916.SZ）——3Q26：AI PCB驱动利润率强劲扩张 • 3Q26业绩超预期，利润率大幅改善：深南电路发布前三季度业绩，并召开业绩说明会。前三季度营收/净利润同比大增53.8%/77.5%，其中3Q26单季营收/净利润同比飙升66.3%/94.4%，环比增长20.4%/34.0%。前三季度净利润41.3亿元，处于公司此前盈利预告上限（40.5-41.5亿元）。前三季度毛利率同比扩张4.4个百分点至32.6%，3Q26毛利率同比改善3.5个百分点至34.9%（环比+2.4个百分点），主因高附加值AI PCB产品占比提升及IC载板产能持续爬坡。前三季度经营性现金流（OCF）同比下降15.4%，推测因原材料涨价导致采购支出增加。展望2H26F，受国内AI芯片及存储客户需求拉动，公司在高端产品（AI PCB及ABF载板）领域增长空间显著。 • 资本开支与产能扩张：公司积极投资AI PCB产能，前三季度资本开支同比激增265%至29亿元，预计全年资本开支将超100亿元。2026年6月，公司公告定增计划，拟投资无锡深南电路AI算力PCB项目；9月将募资上限由48.8亿元调降至43.7亿元，发行股份不超过2.04亿股，并于10月14日获监管批准。野村认为，公司正处于AI PCB及IC载板市场的有利上行周期。 • 估值与评级：维持买入（Buy）评级，12个月目标价518元，基于2027财年预期每股收益（EPS）12.05元的43倍市盈率，与2026-2028财年盈利复合增速43%相匹配。当前股价（10月22日收盘284.30元）对应2027财年预期市盈率仅22.7倍，目标价隐含82.2%上行空间。 业务板块解析 AI PCB：需求旺盛，产品结构优化推升毛利 • 3Q26F AI PCB在PCB业务中的收入贡献预计升至~60%（2Q26为~50%），受AI加速器、网络交换机、光模块及AI电源需求强劲驱动。各细分领域技术升级带动PCB单板价值量提升，构成3Q26毛利率大幅改善的核心驱动力。 • 针对上游材料（覆铜板，CCL）涨价压力，公司正与主要非AI PCB客户协商成本传导。 • 未来增长引擎：1.6T光模块、800G/1.6T交换机及ASIC/CPU芯片将持续驱动PCB利润率改善。 IC载板：BT载板份额扩张，ABF载板4Q26F有望扭亏 • BT载板：因全球载板供应趋紧，且国际竞争对手主要聚焦ABF产能扩张，深南电路BT载板订单动能强劲。随着广州工厂产能释放，公司有望在BT载板市场获取更多份额。 • ABF载板：在高端ABF领域，公司技术稳步突破，预计该业务将于近期（大概率4Q26F）实现单季扭亏。受益于中国AI GPU/CPU/ASIC客户的旺盛需求，公司计划在广州现有及新工厂持续扩产ABF载板，以充分捕捉中国AI基础设施投资的进一步上行空间。 主要风险 • 下行风险：1）AI基础设施投资延迟或AI PCB产能扩张慢于预期；2）美国对中国电信产业链企业实施进一步制裁；3）中国PCB市场竞争加剧。#文字观点", "publish_time": "2026-10-25 10:04", "tags": ["文字观点"]}, "attachment:files/Bernstein-AI 随想：聚合平台是否应屏蔽 AI 智能体？ AI Musings Should Aggregators block AI Agents？.pdf": {"id": "attachment:files/Bernstein-AI 随想：聚合平台是否应屏蔽 AI 智能体？ AI Musings Should Aggregators block AI Agents？.pdf", "kind": "attachment", "title": "Bernstein-AI 随想：聚合平台是否应屏蔽 AI 智能体？ AI Musings Should Aggregators block AI Agents？", "source_label": "Bernstein", "excerpt": "BERNSTEIN FLASHMAIL 23 October 2026 US Internet Nikhil Devnani, CFA +1 917 344 8425 nikhil.devnani@bernsteinsg.com Mark Shmulik +1 917 344 8508 mark.shmulik@bernsteinsg.com AI Musi", "content": "BERNSTEIN FLASHMAIL 23 October 2026 US Internet Nikhil Devnani, CFA +1 917 344 8425 nikhil.devnani@bernsteinsg.com Mark Shmulik +1 917 344 8508 mark.shmulik@bernsteinsg.com AI Musings: Should Aggregators block AI Agents? AI remains the dominant theme in markets, and the online aggregators we cover are largely seen as challenged business models if Consumer Agents scale. We think these fears are likely overdone right now, but this technology could be transformative to how we search, discover, and transact online in the long run. It’s so early. There are a multitude of scenarios from here and a number of ideas/concepts that we are thinking through. This memo is part of a miniseries we will be writing on various facets of Consumer AI and implications for our coverage universe. In our first edition of AI Musings, we lay out our thinking on why it’s perfectly rational for Aggregators to block (or attempt to block) Consumer AI Agents for now. Will it actually work? TBD. These decisions should not be static nor final at this stage of the adoption curve. You’re only as good as your interoperability. Consumer Agents should be transformative. However, to be transformative, they have to work. Not only do they have to work, but they have to work seamlessly. Not only do they have to work seamlessly, but they have to be considerably better than the status quo. Otherwise, why would consumers change their behavior? Consumers do not know or care about AI benchmarks. And they rarely care about becoming more productive for the sake of it. They care about trust, price, convenience, ease of use, and whether the task at hand gets done in an accurate and timely fashion. They care about being entertained. There is an inherent friction and laziness in learned behaviors and the onus is on the disruptor to break the mold and change that. With AI, it is also a new way of thinking/navigating the Internet and daily tasks altogether, which can take consumers time to learn. It’s easy to forget that the aggregators we cover have spent years (sometimes decades) building reputations and optimizing their shopping experiences to drive conversion and monetization - it may not be pretty, but there zero-friction finding and buying non-discretionary goods on Amazon just works! At the same time, consumers now have technology at their fingertips that can autonomously act on their behalf, which opens up the floodgates on the improvements one can make to daily life management & productivity, online search, discovery, shopping, and entertainment...in theory. We suspect reality will be far more complex. Certainly, the size of the prize for winning Consumer AI with horizontal agents is massive, particularly given AI could further drive Internet GDP and online engagement. For now, we remain very early in the adoption cycle of Consumer Agents. With model capabilities converging and continuing to improve, we think success in the Consumer AI race will likely come down more to interoperability — and the financial muscle to be able to subsidize consumer AI offerings with enough compute to truly scale adoption. Subsidization can be from an adjacent business model (which Meta and Google can afford to do) and from building out a direct monetization engine within the AI experience itself (i.e., ads). In the span of one month, our X feed has gone from celebrating Muse as the iPhone moment for Consumer AI to now claiming disappointing retention rates mean the wave is over. It’s all way too early and way too reactionary. Retention and use cases are the right data points to track. Consumer Internet companies live and die by their retention rates. Bulls correctly emphasize that “this is as bad as the technology will ever be” . The improvement in capabilities from ChatGPT Checkout to Muse has been rapid. However, if tech is the supply, then the other side of the equation is consumer demand, where sometimes irrational behavior needs to find repeatable utility and usage. Over a longer time horizon, we learn new behaviors that turn into habits, and hit a point where we wonder how we every lived without the technology. But not everything scales the same, and when we think of consumer AI, we come back to our simplistic utility framework of (1) do things for me; (2) buy things for me; and (3) entertain me. Amazon’s Alexa is a great example of a technology trained on hundreds of thousands of skills with big ambitions across all three categories, but today mostly gets used for playing songs, setting timers, and checking the weather. Of the three areas of utility, we’ve long argued that commerce is the amongst the most difficult, and takes time to shift. Three decades into eCommerce, penetration sits at 20%+/- of total retail in the US and several points lower globally — albeit easier-to-address See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 23 Oct 2026 04:30 UTC Completion Date: 23 Oct 2026 03:37 UTC on 23-Oct-2026 Nikhil Devnani, CFA +1 917 344 8425 nikhil.devnani@bernsteinsg.com 23 October 2026 categories are much higher as a counterpoint. Even with categories of commerce, AI impact is unlikely to be uniform. Meta’s 3Q26 earnings call offered some interesting nuggets on Muse — 2.5M DAU in North America only 1.5 months post-launch and 25% of Weekly Active Users have tried Agentic shopping (top use case). The average purchase size is over $200 (including travel) and many of the platform’s highest ARPU users have been the early adopters of Muse as well. Meta has greatly internalized the importance of interoperability and has done a great job launching a product that simply ‘works’ from day one — the use of virtual machines to navigate the web opens up the aperture for Muse to go online and ‘do anything’ (almost). The payments integrations enable greater trust. From here, we are keen to see how user adoption evolves and the degree to which businesses partner vs. block Agents. The incumbents are evaluating. Amazon is the case study in the sector for the other aggregator models and has blocked Agents. Certainly, Amazon has more to gain from scaling Alexa. Elsewhere, JPMorgan and Schwab are blocking external Agents from operating on behalf of customers due to liability risk, but will work towards selective data sharing via official, secure connections and offer internal tools. My own personal experience has been both great and at times bumpy. My Muse helped me quickly navigate documentation for my son’s passport application, but simultaneously failed to pass bot tests on Yelp and Wayfair. Minor hiccups and I was playing around more than getting something critical done. But all of us occupy seats where it is our job to pay attention to these products and keep trying. How does the average consumer react when the task(s) they assign run into issues? And do horizontal agents have to be ‘all or nothing’ given the promise of becoming your personalized operating system for all things online/offline? Do we trust a half-effective Agent? This reminds us of the grocery delivery conundrum. One of the main challenges third-party platforms face is product visibility and fulfilling orders accurately. There is also the risk that your shopper picks and packs the wrong item or forgets something — mistakes happen. But customers hate it when items are incorrect or missing. Not only have they paid extra for grocery delivery, but they now have to drive to the grocery store to complete the order because it was wrong. Double trouble → churn. For any Consumer Agentic solution, official integrations and partnerships are critical. We don’t see frontier labs wanting to become merchants of record. Furthermore, navigating a website designed for humans is slow, inefficient, and potentially error-prone. It ensures that these early offerings work for a variety of use cases, but it’s not ideal for commerce. For official partners, this dynamic should be reduced to API calls that are far cleaner and more reliable. Extend this vision further, and we enter the world of Agent-to-Agent transactions. Noted partners to Muse include Shopify, Walmart, Instacart, Expedia, and Wayfair among others. Similarly, almost our entire coverage has attempted to partner with OpenAI and Google on prior eCommerce efforts. The promise for these partners is incremental traffic, market share, and revenue. For the platforms that are not #1 in market share and have little to lose (e.g., Walmart vs. Amazon in eCommerce), it can make sense. But even these marketplaces will not be exempt from longer-term disintermediation risk. Aggregators face a dilemma. We expect more such announcements to follow. However, we also think aggregators that operate with substantial market share or in oligopolies can afford to be late movers. Particularly as these businesses look to launch their own onsite AI- assisted experiences that compete with the horizontal agents. This doesn’t have to be a zero-sum game, but for businesses like Amazon, DoorDash, Uber and others in a similar market position, we question the upside of being an early partner in Consumer AI agent launches. With existential questions being asked of the aggregators, it is not in their best interests to bolster Agent offerings right now — unless there is a significant gap in market share they could close. Alternatively, if the underlying base of supply is digitally enabled enough to go direct to the Agent layer, then the aggregator may not have a choice (i.e., the OTA bear case). But for the marketplaces that have unique inventory or supply that is primarily offline and difficult for Agents to reach independently, accelerating adoption would only pull forward and amplify disintermediation risk. The Agentic bear case may struggle to take off without the right subset of partners, which retains leverage for the aggregators. That can change over time as traffic grows and competition forces participation, but the door is open to partnership down the road if it comes to it. You buy time and a path to a more amenable economic structure for both parties involved. Frankly, over a long enough time horizon it’s not up to me, you, or even these companies to decide. If there is one truism we have internalized covering the sector it’s that you cannot fight the consumer — ultimately, user behavior will determine which channels prevail. And blocking the winning channels will only end badly. We simply have to follow the data and respect the early indicators. However, the clash between horizontal and vertical-specific agents is yet to fully play out. Vertical agents have your information, history, context, payment information, and other personal details. And aggregators have layered on services like logistics and membership to support retention. In many ways, Amazon’s efforts to prioritize Alexa for Shopping is a barometer of this horizontal vs. vertical Agent debate in the market — if a platform with Amazon’s entrenchment cannot successfully scale a vertical Agent, we have to question the viability of the smaller aggregators succeeding. If the external Agent channel starts to become a substantial percentage of incremental growth dollars in a given sector (e.g., travel, delivery, eCommerce etc.) it becomes too hard to ignore even at a small absolute percentage of the total pie. As often the case with technology innovation, a great time to be a consumer. US INTERNET 2 on 23-Oct-2026 Nikhil Devnani, CFA +1 917 344 8425 nikhil.devnani@bernsteinsg.com 23 October 2026 EXHIBIT 1: Who can say no to this fuzzball? Source: X US INTERNET 3 on 23-Oct-2026 Nikhil Devnani, CFA +1 917 344 8425 nikhil.devnani@bernsteinsg.com 23 October 2026 BERNSTEIN TICKER TABLE 22 Oct 2026 TTM Adjusted EPS Adjusted P/E (x) Closing Price Rel. Ticker Rating Cur Price Target Perf. Cur 2025A 2026E 2027E 2025A 2026E 2027E increasingly credible on margins and demand. The debate is no longer whether there is demand for Bloom's fuel cells - it has moved to whether this growth turns into cash and can be validated through backlog disclosure. The next quarter is a key test. If Bloom provides backlog disclosure, 2027 guidance, and evidence that contract assets are being billed and collected, we think the investment case will rest more on earnings power rather than on narrative or announced deals. The strong narrative was backed by strong execution in the quarter. Q3 26 adjusted EBITDA of $299M was 24% above consensus of $241M and up from $253M in Q2 26 and $59M in Q3 25. Revenue of $1.24B increased 138% y/y, and was up from Q2 26 revenues of $1.07B. This was driven primarily by product revenue of $1.07B, which grew 179% y/y. They once again raised their FY26 guidance for revenue, operating income and EPS, while maintaining their gross margin guidance at 34%. We raise our price target to $306/share, reflecting our updated estimates following the Q3 26 results and rolling forward our price target. Our price target is now based on Q4 27- Q3 28 Adj. EBITDA, reflecting a one-quarter roll-forward of our valuation period. We continue to use a 41x EV/EBITDA multiple given the company’s high growth nature. Investment Implications We remain Market-Perform on BE, with an updated price target of $306 (prior PT of $282).Close Date 22 Oct 2026 BE Close Price (USD) 217.77 Price Target (USD) 306.00 Upside/(Downside) 41% 52-Week Range 351.28/75.70 SPX 7,663.43 FYE Dec Div Yield NA Market Cap (USD) (M) 64,385 EV (USD) (M) 64,415 Performance YTD 1M 6M 12M Absolute (%) 150.6 (21.2) (5.2) 130.8 SPX (%) 11.9 (1.3) 7.4 14.4 Relative (%) 138.7 (19.9) (12.6) 116.4 Source: Bloomberg, Bernstein estimates and analysis. Price Performance, 1YR $400 $350 $300 $250 $200 $150 $100 10/25 01/26 04/26 07/26 10/2665007000750080008500 BE SPX See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 23 Oct 2026 10:00 UTC Completion Date: 23 Oct 2026 03:39 UTC on 23-Oct-2026 Sunaina Ocalan .+1 917 344 8503 sunaina.ocalan@bernsteinsg.com 23 October 2026 DETAILS RESULTS AND GUIDANCE EXHIBIT 1: Bloom delivered a Q3 earnings beat - though cash flow from operations was weak Q3 26 Q3 25 Revenue ($M) 1,235.8 $ 1,081.7 $ 14.2% 519.0 $ 138.1% Adjusted Gross Margin 34.5% 34.3% 23bps 30.4% 410bps Adjusted Operating Income ($M) 285.7 $ 224.8 $ 27.1% 46.2 $ 517.7% Adjusted EBITDA ($M) 299.5 $ 241.4 $ 24.1% 59.0 $ 407.2% Adjusted EPS 0.94 $ 0.68 $ 38.3% 0.15 $ 522.9% Cash Flow From Operations ($M) (27.1) $ 130.4 $ -120.8% 19.7 $ -238.0%Q3 26 BBG Consensusvs. BBG ConsensusY/Y Growth (%) Source: Company Reports, Bloomberg, Bernstein Analysis EXHIBIT 2: FY26 Guidance Raised FY26 Guidance Low High Low High Revenue $4.4B $4.6B $4.1B $3.9B $4.2B Adjusted Gross Margin 33.8% Adjusted Operating Income $960M $1030M $813M $800M $900M Adjusted EPS $3.10 $3.40 $2.63 $2.55 $2.85~34% ~34%BBG ConsensusNew FY 26 Guidance Prior FY 26 Guidance Source: Company Reports, Bloomberg, Bernstein Analysis KEY TAKEAWAYS FROM THE CALL Bloom’s Q3 results reinforced our view that the company has emerged as the superior power solution for on-site generation. We view the print as positive. The call reinforced our non-combustion thesis on Bloom, with management highlighting Virginia's recognition of fuel cells' lower local emissions amid community pushback, rapid planning approvals in New Jersey, and growing utility interest in front- of-the-meter deployments. It also reinforced several growth opportunities discussed in our most recent note on Bloom , including the non-combustion advantage, CCS-enabled deployments, 800V DC architectures, and utility applications. Management also highlighted military installations and international markets as growth opportunities on the call. We expect international to have an impact by the end of the decade, but currently don’t have a contribution from international demand in our numbers. CASH AND WORKING CAPITAL •Q3 operating cash flow was negative $27M and free cash flow was negative $181M, primarily reflecting working-capital headwinds from contract assets and elevated capex during the quarter. Despite this, year-to-date free cash flow remains positive $42M, and Bloom ended the quarter with $2.5B of cash. •Contract assets were a $430M use of cash in the quarter. While contract assets may continue to grow alongside deployments, management reiterated its expectation that these balances convert to cash over time as projects reach billing and collection milestones. •Capex of $153M was above expectations, but reflected Bloom’s continued investment in capacity expansion to support future growth. AMERICAS ENERGY & TRANSITION 2 on 23-Oct-2026 Sunaina Ocalan .+1 917 344 8503 sunaina.ocalan@bernsteinsg.com 23 October 2026 CAPACITY AND EXECUTION •Bloom is preparing for capacity beyond 5 GW annually and continues to add real estate in Fremont. Management emphasized that capacity expansion is demand-driven and can be scaled incrementally rather than through large step changes. •Headcount on the stack line remains roughly 600 employees from 1 GW to 5 GW of capacity, highlighting the operating leverage embedded in the manufacturing footprint. •On the 300 MW New Jersey data center project, planning approval was secured within three months of signing and the first block was operational two months later. Management reiterated that Bloom does not expect to be the bottleneck in customers' buildouts. DEMAND AND DIVERSIFICATION •Backlog is growing faster than revenue, but no figure was given. Management will give 2027 guidance on the Q4 call. •Management highlighted several emerging growth vectors, including first shipments into T exas, a conditional U.S. Army award through a partner, and anticipated international project announcements. •Management expressed confidence in securing additional front-of-the-meter utility deployments. Bloom's value proposition is that fuel-cell assets can be rate-based as distribution infrastructure and procured through utilities' IRP processes. Management also pointed to Virginia's energy plan as evidence of growing policy support for non-combustion generation. CARBON CAPTURE AND FUTURE OPTIONS •The AEP project for Google is about 700 MW with carbon capture. Management seemed positive about the potential that other hyperscalers could pursue similar solutions. •Management reiterated an advantage we discussed in our previous note, saying on the call that \"most hyperscalers today would accept\" a 10%-15% premium for zero-carbon power and that Bloom can deliver within that range on an all-in basis. While this could prove an important differentiator, it remains early days. •Bloom says it is agnostic on how carbon capture is sold: as equipment, as power, or through partners. 800V DC and combined heat and power were presented as additional options on the same platform. AMERICAS ENERGY & TRANSITION 3 on 23-Oct-2026 Sunaina Ocalan .+1 917 344 8503 sunaina.ocalan@bernsteinsg.com 23 October 2026 EXHIBIT 3: BE's Revenue Growth $ 401M$ 519M$ 778M$ 751M$ 1,065M$ 1,236M 20%57% 36%130%166% 138% 0%20%40%60%80%100%120%140%160%180% $0$300$600$900$1,200$1,500 2Q2025 3Q2025 4Q2025 1Q2026 2Q2026 3Q2026 Product Installation Service Electricity Y/Y Growth (%) Source: Company Reports, Bernstein Analysis EXHIBIT 4: Profitablity Is Scaling With Revenue Growth $ 41M$ 59M$ 146M $ 143M$ 253M$ 299M 10.3%11.4%18.8% 19.0%23.8%24.2% 0%5%10%15%20%25%30% $- $50 $100 $150 $200 $250 $300 $350 2Q2025 3Q2025 4Q2025 1Q2026 2Q2026 3Q2026 Adjusted EBITDA Adjusted EBITDA Margin (%) Source: Company Reports, Bernstein Analysis AMERICAS ENERGY & TRANSITION 4 on 23-Oct-2026 Sunaina Ocalan .+1 917 344 8503 sunaina.ocalan@bernsteinsg.com 23 October 2026 EXHIBIT 5: Margin Expansion Continues 26. n stock ratings are based on a 12-month time horizon. Autonomous brand – preferred stocks The Autonomous brand has three categories of preferred stock ratings: •Outperform (OP): The total return of the preferred instrument is expected to outperform preferred securities of other issuers operating in similar sectors or rating categories over the next six months. •Neutral (N): The total return of the preferred instrument is expected to perform in line with preferred securities of other issuers operating in similar sectors or rating categories over the next six months. •Underperform (UP): The total return of the preferred instrument is expected to underperform preferred securities of other issuers operating in similar sectors or rating categories over the next six months. Autonomous preferred sto", "status": "extracted"}, "attachment:files/Bernstein-支付、处理器与 IT 服务｜北美：智能体电商的狂野西部、稳定币终于走向成熟 —— 来自 Money2020 大会的观察 Payments, Processors & IT Services  North America Agentic Commerce's Wild West, Stable.pdf": {"id": "attachment:files/Bernstein-支付、处理器与 IT 服务｜北美：智能体电商的狂野西部、稳定币终于走向成熟 —— 来自 Money2020 大会的观察 Payments, Processors & IT Services  North America Agentic Commerce's Wild West, Stable.pdf", "kind": "attachment", "title": "Bernstein-支付、处理器与 IT 服务｜北美：智能体电商的狂野西部、稳定币终于走向成熟 —— 来自 Money2020 大会的观察 Payments, Processors & IT Services North America Agentic Commerce's Wild West, Stable", "source_label": "Bernstein", "excerpt": "22 October 2026 Payments, Processors & IT Services Agentic Commerce's Wild West, Stablecoins Finally Coming of Age: Insights from Money2020 Conference Harshita Rawat, CFA +1 917 34", "content": "22 October 2026 Payments, Processors & IT Services Agentic Commerce's Wild West, Stablecoins Finally Coming of Age: Insights from Money2020 Conference Harshita Rawat, CFA +1 917 344 8485 harshita.rawat@bernsteinsg.com Simran Ratani +1 917 344 8329 simran.ratani@bernsteinsg.comWe attended the Money2020 conference in Vegas this week. Interestingly, compared to prior years which were a bit chaotic with a focus on all things blockchain, and agents taking over financial services – the general debate in this year’s conference was focused on agentic commerce (how to go from the current Wild West to standards) and stablecoin payments (actual use-cases vs. the usual hyperbole). Our three key insights: 1. Agentic commerce debate is moving from “can agents transact?” to “can agents be trusted?” The core problem in agentic commerce is increasingly trust infrastructure rather than checkout itself. Across all our conversations, the same issues kept coming up: agent identity, permissions, consumer intent, authentication, fraud and liability. Human-in-the- loop will be critical for a while. Merchants want to know not only that an agent is legitimate, but who it represents, what authority it has and whether the transaction reflects the consumer’s actual intent. There appear to be very interesting dynamics re V/MA agent tokens, SPTs and a spectrum of other options available to the merchants – and time to market for each – which also likely informed how Muse was structured with Link and one-time virtual cards. As we noted in our recent note (see link), it is important for the networks to control the agentic tokens. Note that current agentic experiences (Muse, Instinct) don’t appear to be using networks’ agent tokens. Protocol fragmentation is a real merchant pain point – an area where modern PSPs such as Adyen can benefit. Know your agent was a recurrent theme. 2. Stablecoins are finding real product-market fit primarily in cross-border money movement, not consumer-to-business payments. Stablecoin-linked cards were everywhere – and ironically the best consumer payments use-case for stablecoins. The stablecoin conversations were remarkably consistent. Almost everyone we spoke with repeatedly pointed toward use-cases in settlement, remittances, payouts and access to dollars, particularly in LATAM, Africa and parts of Asia. In markets where dollars are difficult to access or moving money cross-border is expensive, stablecoins solve a very tangible problem. There was also a lot of discussion on stablecoin settlement usage by PSPs. As we have been highlighting in our research, Stablecoins look more like payments infrastructure rather than a new consumer payment method. The next battle is over who controls the infrastructure and the field is busy with BVNK, Bridge, Circle, Zero Hash, Coinbase, etc. Interestingly – most consumer last mile use-cases were around stablecoin-linked cards (in most instances, Visa cards) which are growing rapidly and have similar economics (sometimes even better because of FX conversion). [continued on next page] See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 22 Oct 2026 11:33 UTC Completion Date: 22 Oct 2026 11:33 UTC on 23-Oct-2026 Harshita Rawat, CFA +1 917 344 8485 harshita.rawat@bernsteinsg.com 22 October 2026 3. Too many fraud and identity solutions. While fraud and security services companies always have a strong presence at Money2020 – we were surprised to see so many companies and the fragmented ecosystem attacking sometimes similar parts of the ecosystem. While V/MA cybersecurity services remain close to the transaction today, AI (which brings both agentic commerce and also cybersecurity risks) creates a logical reason for them to expand further into identity and security - and then combine it with their unique transaction data and existing GTM. Payments increasingly looks less like a competition over transaction processing and more like a competition to own the identity, trust, orchestration and software layers surrounding the transaction. See our recent note on cybersecurity. Other tidbits: Adyen: We became incrementally cautious about competition in digital (from Checkout) but grew more constructive on opportunity within Platforms (including with AI platforms now with Orb). We expect to see more tuck-ins to augment capabilities for platforms. PayPal: A crucial moment for the company to have at least some optionality to resurrect its consumer and merchant value proposition as a two-sided network in the age of agentic. OUSD: Had more traction (or discussion?) than we expected in our meetings. Reserve economics is a very potent topic. See our note . Amex (not covered) : Waiving of liability for agentic transactions surprised a lot of people; anecdotally slower progress on agentic vs. V/MA. PAYMENTS, PROCESSORS & IT SERVICES 2 on 23-Oct-2026 Harshita Rawat, CFA +1 917 344 8485 harshita.rawat@bernsteinsg.com 22 October 2026 DETAILS INVESTMENT IMPLICATIONS We rate V, MA, ADYEN, XYZ, AFRM, TOST OP. We rate PYPL, FIS, FISV, GPN, KLAR MP. Stripe, Checkout.com are private; Circle, Coinbase are covered by Bernstein. American Express is not covered. PLEASE SEE LINKS TO OUR RECENT RESEARCH •Visa, Mastercard: The easy rebound is done, what drives the next leg of re-rating? (October 2026) •Consumer AI agents: The next Payments battle.. (October 2026) •Consumer AI Agents: Is this the Wild West? How will incumbents respond? (October 2026) •Visa, Mastercard: Time for some Cybersecurity pixie dust? (September 2026) •Weekend T ech Byte: Agentic Commerce - resurrected from the dead? Is Payments the winner this time? (September 2026) •Visa, Mastercard: India/Brazil; has the ship sailed for cards (especially on debit)? Does it matter? (September 2026) •PayPal-Stripe/Advent: Deal is off the table. What's next? (August 2026) •Visa, Mastercard: Time to rethink/revisit the U.S. Card growth debate? (August 2026) •Adyen: Are we delusional? Is the stock only worth 17x ex-Cash 2027 Earnings? (August 2026) •AFRM: Optionalities abound. Initiating Coverage; TP $100 (July 2026) •Payments/Fintech: Stocks near 10yr lows – is it time for bold actions? (June 2026) •The Long View: Payments - Does Cash 03ch2>二、今日最强主线\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI算力/大模型\u003c/strong>：主线是AI支出集中、自购GPU与开源倾向、Agent升级重构大模型价值；今天强化的逻辑包括1%的公司消耗90%的AI支出（Token消耗），其中80%来自尚未盈利、风投支持的公司，自购GPU算力支出占比抬升，以及词元服务量价齐升、国内词元价格较去年下半年翻倍但量增3倍；今天出现的催化/验证包括亚马逊CEO称2026年算力基本售罄、2027年接近售罄、2028年已有大量产能被预订，寒武纪Q3营收利润高增，以及“从模型调用到任务交付，Agent升级重构大模型价值”主题报告。\u003c/li>\n\u003cli>\u003cstrong>物理AI/机器人/数据采集\u003c/strong>：主线是物理AI与具身智能从模型能力走向数据采集和量产落地；今天强化的逻辑包括物理AI被视为AI下一波浪潮，通用模型承担部分任务理解、规划甚至动作决策后，具身模型瓶颈正在重新划分，数采设备本质是人形机器人/端侧算力的一种，数据服务才是真正的现金牛，Optimus量产使减速器成为需求弹性最大、价值量最集中的核心环节之一；今天出现的催化/验证包括首个具身智能数据集质量标准11月1日正式实施、Optimus从“在建”转入“投产”、海天瑞声与利亚德分别上涨79.98%和62.67%、数采专家交流，以及全球机器人行业报告提出具身智能的“ChatGPT时刻”渐行渐近。\u003c/li>\n\u003cli>\u003cstrong>半导体/先进封装/PCB\u003c/strong>：主线是AI PCB、先进封测和半导体设备零部件业绩验证；今天强化的逻辑包括AI PCB驱动利润率强劲扩张，上海临港78亿元高端先进封测项目持续推进、拟定增募资不超过65亿元加码高性能计算、晶圆级封装及高密度存储封测，覆铜板涨价压力下与非AI PCB客户协商成本传导，高端ABF预计近期大概率4Q26F实现单季扭亏；今天出现的催化/验证包括深南电路3Q26营收/净利润同比+66.3%/94.4%、环比+20.4%/34.0%，科瑞技术Q3扣非净利润同比+85.17%，以及电子元器件季报展望预计多数企业延续强劲业绩并上调全年指引。\u003c/li>\n\u003cli>\u003cstrong>光通信/CPO/激光芯片\u003c/strong>：主线是激光芯片扩产与MPO/FAU强通胀逻辑兑现；今天强化的逻辑包括东山/索尔思光电当前月产能900万只、四季度提升至2200万只、2027年达到年产3亿只且以EML为主，纳真光电部分报道提出总产能目标1.7亿只且很大一部分是200G EML，鼎新光电目标混合产能年产1500万只、覆盖70mW/100mW连续波CW激光器及100G EML，FAU技术壁垒在制造工艺和良率、头部FAU厂随高芯数更占优并未来向自动化升级；今天出现的催化/验证包括仕佳光子单Q3营收12.27亿元、同比+116.06%，归母净利润2.71亿元、同比+226.19%，MPO&amp;DFAU订单、业绩拐点、并购陆续落地，以及专家交流称PCB好于预期、FAU低于预期、MPO正常预期。\u003c/li>\n\u003cli>\u003cstrong>宏观/策略\u003c/strong>：主线是美股科技财报未注入信心、AI算力板块抛售与反弹预期并存；今天强化的逻辑包括META、LRCX、WDC等财报进一步加剧市场担忧，AI算力相关板块延续抛售，长端国债、软件&amp;互联网继续避险，半导体硬件抛售烈度接近今年7月，但恐慌更多来自宏观层面压力、中期产业叙事担忧，短期基本面并未看到致命瑕疵，中期选举后不确定消除、中东战事政治意义下降、股票回购重启可能带来快速反弹；今天出现的催化/验证包括本周零售资金净买入43亿美元、显著低于12个月均值67亿美元/周，ETF占比升至82%、个股占比降至18%，中期选举概率显示众议院民主党夺控92%、参议院68%，以及下周关注美联储10月议息会议。\u003c/li>\n\u003cli>\u003cstrong>新能源/汽车\u003c/strong>：主线是锂电出货高增与盈利修复预期，同时价格战风险被提及；今天强化的逻辑包括26Q3中国锂电池出货735GWh、同比+46%、环比+7.3%，其中动力电池出货约380GWh、同比+27%、环比+6%，储能电池出货300GWh、同比+82%、环比+9.1%，前三季度中国锂电池累计出货1945GWh、同比+49%，储能、消费及其他板块总出货量均超2025全年水平；今天出现的催化/验证包括亿纬锂能Q1-3营收734亿元、同增63%，归母净利润52亿元、同增86%，扣非净利润30亿元、同增111%，横店东磁Q3光伏锂电业务承压但全年利润增长目标不变，以及宁德时代相关报告提及新一轮电池价格战。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>寒武纪三季报：收入35.31亿元，同比+104.47%，环比+13.50%；归母净利润14.04亿元，同比+147.74%，环比+8.17%；毛利率55.82%，环比-0.28pct，净利率39.76%，环比-1.41pct；存货116.65亿元，环比增长34.1%。\u003c/li>\n\u003cli>深南电路前三季度营收/净利润同比大增53.8%/77.5%，其中3Q26单季营收/净利润同比飙升66.3%/94.4%，环比增长20.4%/34.0%，AI PCB驱动利润率强劲扩张。\u003c/li>\n\u003cli>仕佳光子单Q3实现营收12.27亿元，同比+116.06%，环比+33.51%；归母净利润2.71亿元，同比+226.19%。\u003c/li>\n\u003cli>科瑞技术2026年前三季度营业收入23.33亿元，同比+32.49%；Q3扣非净利润同比+85.17%，半导体及光模块业务持续放量。\u003c/li>\n\u003cli>亿纬锂能26年Q1-3营收734亿元，同增63%；归母净利润52亿元，同增86%；扣非净利润30亿元，同增111%；毛利率14.5%，同-1.5pct，归母净利率7.1%，同+0.9pct。\u003c/li>\n\u003cli>横店东磁2026年前三季度收入182.92亿元，同比增长4%；归母净利13.33亿元，同比下降8%；Q3光伏锂电业务承压，全年利润增长目标不变。\u003c/li>\n\u003cli>亚马逊CEO采访显示：2026年资本开支2200亿美元仍有很多需求无法满足；2026年算力基本售罄、2027年接近售罄、2028年相当大一部分也卖完；未来几年不同环节都可能看到供给问题。\u003c/li>\n\u003cli>周末舆情显示：首个具身智能数据集质量标准将于11月1日正式实施，具身机器人从“表演”转向实景测试，多家机器人公司已探索出商业落地形态；特斯拉人形机器人Optimus已从“在建”转入“投产”，弗里蒙特工厂高产线正式下线首批“量产质量”机器人。\u003c/li>\n\u003cli>华大九天举办生态伙伴及用户大会，发布AI相关新产品，并与芯行纪、奇捷科技、中科鉴芯、上海曼光等企业举行战略合作协议签约仪式；签约企业均为本年度通过投资并购新增布局的EDA企业。\u003c/li>\n\u003cli>美股科技周观点显示：META、LRCX、WDC等公司财报并未向市场注入期望的信心，AI算力相关板块延续抛售，长端国债、软件&amp;互联网继续成为避险方向，半导体硬件抛售烈度已接近今年7月。\u003c/li>\n\u003cli>宏观与地缘方面：美联储及其欧元区和日本同行可能未来一周维持利率不变，选择在可能进一步加息之前静观其变；特朗普暗示可能再次对伊朗发动军事行动，美驻土耳其大使称最快本周末袭击，但特朗普随后表示对此不知情；美国国务院因也门胡塞武装和伊朗袭击威胁增加，对13个中东国家更新旅行警告。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>美联储10月议息会议，以及美联储、欧元区和日本同行未来一周维持利率不变的可能。\u003c/li>\n\u003cli>11月1日首个具身智能数据集质量标准正式实施后，具身机器人从“表演”转向实景测试的商业化订单重复性、任务验证广度，以及智能层价值捕获。\u003c/li>\n\u003cli>Optimus量产进度与减速器需求弹性，首批“量产质量”机器人下线后的高产线爬坡。\u003c/li>\n\u003cli>物理AI数据采集的“设备+服务”模式，数据服务能否成为真正的现金牛，以及物理AI从感知交互到具身执行的产业级落地。\u003c/li>\n\u003cli>AI算力供需：2026年算力基本售罄、2027年接近售罄、2028年大量产能被预订，未来几年不同环节供给问题如何演变。\u003c/li>\n\u003cli>AI液冷渗透率由2025年33%提升至2027年60%的验证，以及800G、1.6T及3.2T光模块升级对TIM、VC、TEC及陶瓷基板等散热材料升级的拉动。\u003c/li>\n\
