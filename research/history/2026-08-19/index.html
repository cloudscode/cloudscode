司同时将全年资本开支指引上调至1950-2050亿美元。国内方面，此前更强调根据需求和投入回报逐步扩张算力的腾讯，Q2资本开支同比增长176%至528亿元。同期Google Cloud收入同比增长82%、在手订单达到5139亿美元，腾讯云收入增速提升至20%以上，过去曾被认定为稳健者的厂商加大投入的背后仍有云收入和客户需求支撑。#Agent收入与用户同步放量，#应用飞轮闭环优于预期 据Bloomberg报道，Anthropic 2026Q2初步收入超过115亿美元，调整后经营利润首次转正；截至8月13日，OpenAI Codex及ChatGPT Work活跃用户突破1500万；Microsoft 365 Copilot付费席位半年内翻倍至超过3000万。Agent正由Coding向办公及企业工作流扩散，产品使用、付费席位和收入同步增长，应用商业化兑现速度快于市场预期。#国产模型跨过可用门槛，#算力与2B应用进入兑现期 GLM-5.3、Kimi K3、DeepSeek V4 Pro等持续缩小与海外旗舰模型的差距；K3发布当日ARR创公司历史最大单日增幅；WorkBuddy 6月访问量达到2097万次；截至8月16日DeepSeek Harness上线三天GitHub Star超过11.7万。结合DS-V4 Pro发布后的涨价，我们认为模型能力正更直接地转化为产品使用、收入增长与定价权。 投资建议：重点关注算力服务、国产芯片与超节点，以及具备场景、数据和企业交付能力的2B AI应用厂商，推荐海光信息、浪潮信息、神州数码、深信服、智谱、MiniMax、达梦数据、海天瑞声、金蝶国际、鼎捷数智、中控技术、视源股份、国能日新。#文字观点", "publish_time": "2026-08-19 09:29", "tags": ["文字观点"]}, "post:2026-08-19T13-17:04cfd668f202": {"id": "post:2026-08-19T13-17:04cfd668f202", "kind": "post", "title": "2026-08-19 13:17", "source_label": "帖子正文", "excerpt": "🌍【国联民生海外】如何看待Anthropic 650亿美元ARR导致市场下跌？事件：据8月17日路透及CNBC先援引知情人士证实，Anthropic在上周末向投资人的例行更新中披露，7月末年化收入（run-rate）超过650亿美元，较5月的470亿美元继续增长，公司方面未予置评。", "content": "🌍【国联民生海外】如何看待Anthropic 650亿美元ARR导致市场下跌？事件：据8月17日路透及CNBC先援引知情人士证实，Anthropic在上周末向投资人的例行更新中披露，7月末年化收入（run-rate）超过650亿美元，较5月的470亿美元继续增长，公司方面未予置评。该数据低于市场此前约超七百亿美元的预期，公布后昨日美股AI板块出现回调。我们认为有以下核心因素。ARR上限受算力供给约束：参考NBIS业绩会披露的新建算力租赁价格约200亿美元/GW，按模型厂商毛利结构折算，1GW推理算力对应的收入上限约为300余亿美元ARR。650亿美元run-rate对应约2GW量级推理算力接近满负荷运行，而740亿美元的预期需要2.3-2.5GW算力支撑，在当前部署节奏下尚不具备落地条件。我们认为，本次数据低于预期的核心原因在于算力供给节奏而非需求走弱，市场对头部模型ARR的线性外推需要回归算力约束下的合理区间。 💻需求侧获得财报三重验证：CSP、Neocloud、服务器三大板块业绩均已披露完毕，共同指向企业客户需求超预期。传导链条清晰：企业客户在用满CSP容量后转向Neocloud补充算力，同时加大向服务器OEM的整机采购，HPE业绩会披露企业客户同比增速达100%。我们认为，算力紧缺至此，本身即是企业端跑通token经济的直接证据：AI正嵌入编程、Agent等核心工作流，token消耗较传统问答数量级放大，需求随渗透率提升持续膨胀。该逻辑受益的是开源与闭源模型层整体，算力紧缺依然是AI发展的最大瓶颈。 🧠观点：我们认为，本次ARR数据的核心信息并非需求转弱，而是头部模型收入增长已进入算力供给约束阶段。下游token经济实现商业闭环、算力处于极度紧缺状态，是当前产业链最重要的事实。在此背景下，模型厂商ARR的beat/miss更多反映算力上线节奏，其作为需求指标的信息含量下降，市场对具体ARR数字的担忧存在过度反应。增长斜率的上限取决于新增GW落地速度，各方预期回归合理水平后，产业主线仍是需求大于供给，ARR规模由算力决定，算力扩张由需求驱动。 风险提示：AI需求不及预期；算力供给释放节奏不及预期；模型商业化进展不及预期 🌹行业观点更新欢迎联系国联民生海外组孔蓉/樊程安吉#文字观点", "publish_time": "2026-08-19 13:17", "tags": ["文字观点"]}, "post:2026-08-19T20-04:9f97a22d5cfc": {"id": "post:2026-08-19T20-04:9f97a22d5cfc", "kind": "post", "title": "2026-08-19 20:04", "source_label": "帖子正文", "excerpt": "【东北计算机】20260819【长存控股完成 IPO 辅导，进入辅导验收】 —————————————— 1. 宇树科技登陆科创板，上市首日收涨460.34%报845元/股，市值3418亿元。（来源：科创板日报） 2. 长存控股向湖北证监局提交辅导工作完成报告，IPO辅导状态变更为辅导验收。", "content": "【东北计算机】20260819【长存控股完成 IPO 辅导，进入辅导验收】 —————————————— 1. 宇树科技登陆科创板，上市首日收涨460.34%报845元/股，市值3418亿元。（来源：科创板日报） 2. 长存控股向湖北证监局提交辅导工作完成报告，IPO辅导状态变更为辅导验收。（来源：科创板日报） 3. 摩根士丹利预测2026年Q3成熟DRAM价格将上涨50%，Q4再涨10%。（来源：财联社） 4. Cerebras发布机架式系统CS-4，称单用户场景每秒token输出达传统GPU服务器30倍。（来源：财联社） 5. AI芯片初创公司Etched完成7亿美元融资，投后估值210亿美元，Jane Street成首个客户。（来源：财联社） 6. Anthropic推动IPO前循环信贷额度扩容至100亿美元，多家华尔街银行争相参与。（来源：财联社） 7. 上海印发张江高新区“十五五”规划，提出突破光计算、类脑芯片架构，构建自主算力体系。（来源：财联社） ☎️欢迎联系东北计算机团队#文字观点", "publish_time": "2026-08-19 20:04", "tags": ["文字观点"]}, "attachment:files/MS-半导体周报英伟达业绩前瞻Rubin发布前已现强劲增长-20260817.pdf": {"id": "attachment:files/MS-半导体周报英伟达业绩前瞻Rubin发布前已现强劲增长-20260817.pdf", "kind": "attachment", "title": "MS-半导体周报英伟达业绩前瞻Rubin发布前已现强劲增长-20260817", "source_label": "MS", "excerpt": "M Idea Semiconductors | North America Weekly: NVDA Earnings Preview: Strong growth even before Rubin product cycle impact Expecting strong results, but with Rubin still a quarter o", "content": "M Idea Semiconductors | North America Weekly: NVDA Earnings Preview: Strong growth even before Rubin product cycle impact Expecting strong results, but with Rubin still a quarter or so away from driving more material upside, this report is more about increasing investor confidence in the intangibles: financing, market share, margins. We remain on the positive side of those debates, and see compelling upside at 17x PE. Morgan Stanley & Co. LLC Joseph Moore Equity Analyst Joseph.Moore@morganstanley.com +1 212 761-7516 Mason Wayne Research Associate Mason.Wayne@morganstanley.com +1 212 761-6012 Nicole Kozhukhov Research Associate Nicole.Kozhukhov@morganstanley.com +1 212 761-1636 Ella Tulchinsky Research Associate Ella.Tulchinsky@morganstanley.com +1 212 761-2222 Shane Brett Equity Analyst Shane.Brett@morganstanley.com +1 212 761-1022 Semiconductors North America Industry View Attractive Strong demand for Blackwell should mean another quarter of beat and raise results, but that's less likely to be a catalyst given the longer term nature of the key debates. Nvidia stock has seen a negative next day reaction for the last 4 consecutive quarters, despite what has been a series of very strong numbers. We aren't necessarily optimistic that trend reverses, as the potential drivers of more significant multiple expansion are centered on longer term issues, including: (1) market share vs competitors, (2) circular financing concerns, (3) gross margin trajectory beyond 2026, (4) the magnitude of Rubin contribution in the second half. We think Nvidia management will be upbeat on each of those focus areas, but without material updates, we wouldn't expect the stock to move higher assuming the typical beat and raise pattern. But eventually the focus will shift to 2027, where we see several upside levers vs consensus that's still modeling in-line with commentary given 5 months ago. At GTC, Nvidia's CEO said they have line of sight to $1T of Blackwell plus Rubin demand from CY25-CY27; we won't reparse all that commentary here, but our understanding is that figure includes networking but does not include things like Groq, stand alone CPUs, RTX, or software. Total consensus datacenter revenue from CY25-CY27 is $1.054T (we model $1.09T), given CY25 included $30bn or so Hopper and associated networking that looks like a low bar to us. Meanwhile demand indications have upticked significantly given the acceleration in inference demand Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report.Key Takeaways Expect recent trends to persist, with~$10bn or so incremental quarterly revenue in July/October. Jan Q the bigger acceleration as Rubin ramps in greater size Continue to have high conviction in the most important variables, (1) Rubin product leadership, and (2) compute demand continuing to outstrip supply in 2027 At 17x FY28 EPS (below peers and the broader market) with multiple levers for upside, we continue to see a highly attractive risk reward, stay OW and Top Pick August 17, 2026 05:25 AM GMT M Idea 2primarily from frontier labs, but demand from other sectors (enterprise, sovereign) are higher as well. Add in potential contribution from new products, revenue sharing annuity streams, and 2027 could be a much bigger year than we think is appreciated. Supply will continue to be the limiting factor, especially for Rubin, but we think Blackwell demand can sustain at a high level well into next year. Rubin remains on track, meanwhile Blackwell is stronger. Nvidia has said that Rubin will start to ship in Q3, where we model $9bn (150k units at $60k ASP). That trajectory remains intact, notwithstanding typical week to week issues with a new product that we have written about. Nvidia's primary test partner KYEC cut their FY guidance (see: AI revenue pushed out to 4Q26 and 2027 ) when they reported Q2 results a few weeks ago; that's more a function of test times than units with MS analyst Charlie Chan leaving FY tested Rubin units unchanged in his updated forecast (but with a higher weighting in Q4). We don't think that will be an issue for Nvidia from a revenue perspective, as even with the cut to Q3 our 150k is much lower than the revised estimates (500k). As far as Blackwell, we reported an uptick in 4nm wafer starts, from our Asia trip in June (see: Takeaways from our meetings in Taiwan ), making our current estimate for mostly Blackwell revs into October potentially conservative as well. Not expecting anything new on margins, financing, or market share but we remain constructive on all 3. These are all important debates for the stock, but we don't know that we will hear anything new from management on the call that will change investors' minds positively or negatively. We expect a reiteration of commentary for FY27 margin in the \"mid 70s\", as well as supply chain management helping NVDA avoid cost pressures to the extent possible by locking in supply early. That said, we are surprised to see consensus modeling a margin recovery in the back half of FY28 given the breadth of cost inflation (DRAM, front end wafers, packaging, substrates) that does not look like it will subside anytime soon. While we don’t rule out a reset lower being an issue for the stock, we think it could become a clearing event given how much of a focus area this is for investors. As far as financing and market share, we expect to hear a great deal of management enthusiasm on both fronts. Nvidia CEO Jensen Huang published a blog post ( here) in conjunction with the $500bn partnership announcement outlining why the move makes sense. It's likely what we hear on the call will mirror that. On share, we expect the company to point to Rubin as unlocking a large improvement in AI factory economics over what is already the leadership platform in Blackwell. We continue to hear large enthusiasm for Rubin from our checks but given the ramp is still in early stages, it will be some time before the market can assess how that's likely to shift share vs ASIC and AMD. For our thoughts on Nvida's recent financing announcements see: NVIDIA, neoclouds, and rev sharing: the next big debate (14 Aug 2026) NVDA $500bn investment mobilization is a positive; brings focus to rev sharing (11 Aug 2026) So how would we put this together around the quarter? We model $91.1bn in revenue for July and $102.3bn in revenue for October. We think investor YW2XyQsMmQqMqRpRpPyQsP6MdN8OnPrRsQoQfQmMuMkPqRzRaQpOxPMYqMmNvPnNtO M Idea Morgan Stanley Research 3expectations are moderately higher based on some of those supply inputs noted above, and we see the rationale for upside. But our assumption is that more of that comes in January; either way, these figures represent numbers that are still undershipping end demand, and momentum should continue into next year, which is an important factor when thinking about a continued bid to the stock. Exhibit 1:MS vs Consensus Figures in $ MMs MS Cons. MS Cons. MS Cons. MS Cons. Revenue 91,195 91,932 102,346 103,691 393,005 393,705 598, 809 562,746 Q/Q Change 11.7% 12.6% 12.2% 12.8% Gross margin 75.0% 75.0% 74.5% 74.5% 74.4% 74.8% 72.5% 74.7% EPS $2.07 $2.08 $2.34 $2.36 $8.98 $9.00 $13.15 $12.73F2Q27E F3Q27E 2027E 2028ENVDA: MS vs. Consensus Source: Factset, Morgan Stanley Exhibit 2:Over the last year Nvidia has moved from trading at a significant premium to overall semis to a significant discount 15.0017.0019.0021.0023.0025.0027.0029.0031.0033.0035.00 08/15/25 09/15/25 10/15/25 11/15/25 12/15/25 01/15/26 02/15/26 03/15/26 04/15/26 05/15/26 06/15/26 07/15/26NVIDIA - PE - NTM SOXX - PE - NTM S&P 500 - PE - NTM Source: Factset, Morgan Stanley M Idea 4 AlphaSignals Earnings Preview Focus KPI Focus KPI Surprise Likely impact to consensus EPS* NVIDIA Corp. NVDA.O Oct Q revenue guidance Very likely upside surprise Modest revision higher *Likely impact to consensus EPS is for the next 12 months Source: Company data, Morgan Stanley Research 0jtBmJyvVPHRjRTTSt4xptwjGbuQR5nn0i25sYLUOgLF/KnB0prIx4nqzKi7+mxj Risk Reward - NVIDIA Corp. (NVDA.O) 5 Morgan Stanley Research IdeaM $288.00 ~22 our MW CY27 EPS estimate of $13.08, in-line with the broader market and a discount to compute semis peers (AMD/AVGO/IN ace Q-Day – the moment quantum computers can easily crack current encryption technologies. In this report, we focus on quantum security needs at the hardware level. Morgan Stanley Taiwan Limited+ Daniel Yen, CFA Equity Analyst Daniel.Yen@morganstanley.com +886 2 2730-2863 Charlie Chan Equity Analyst Charlie.Chan@morganstanley.com +886 2 2730-1725 Morgan Stanley & Co. International plc+ Shawn Kim Equity Analyst Shawn.Kim@morganstanley.com +44 20 7677-1018 Lee Simpson Equity Analyst Lee.Simpson@morganstanley.com +44 20 7425-3378 Terence Tsui Equity Analyst Terence.Tsui@morganstanley.com +44 20 7425-3095 Morgan Stanley & Co. LLC Meta A Marshall Equity Analyst Meta.Marshall@morganstanley.com +1 212 761-0430 Joseph Moore Equity Analyst Joseph.Moore@morganstanley.com +1 212 761-7516 Erik W Woodring Equity Analyst Erik.Woodring@morganstanley.com +1 212 296-8083 Morgan Stanley Asia Limited+ Ethan Jia Research Associate Ethan.Jia@morganstanley.com +852 3963-2287 Morgan Stanley & Co. LLC Ella Tulchinsky Research Associate Ella.Tulchinsky@morganstanley.com +1 212 761-2222 Lucas Cerisola Research Associate Lucas.Cerisola@morganstanley.com +1 212 761-9194 Morgan Stanley & Co. International plc+ Amelia M Scicluna Research Associate Amelia.Scicluna@morganstanley.com +44 20 7425-6694 Greater China Technology Semiconductors Asia Pacific Industry View AttractiveGet prepared... quantum computing is coming: Industry roadmaps point to commercially meaningful fault-tolerant quantum computing by 2030, raising security concerns for existing cryptographic systems. What must happen before quantum adoption? We believe a new security ecosystem must be deployed before broad adoption occurs. One such threat the world already faces is \"Harvest Now, Decrypt Later\", where encrypted data can be stolen today and stored for decryption in future. Hardware security must be implemented in advance: UK and US governments have established Post-Quantum Cryptography (PQC) migration roadmaps, making deployment a prerequisite. In this report, we focus on server-level hardware security , or the 'Root of Trust', which underpins PQC adoption. How to size the opportunity? A new TAM in semi IP licensing. We provide different scenarios: We focus on semiconductor IP adoption. Our base case suggests a PUF-enabled PQC IP (PUF-PQC) TAM of US$310mn by 2030, rising to US $600mn in a bull case if adoption expands to CPUs, GPUs and ASICs. Compared with a 2025 TAM of US$4mn, this could add 5-10% to the semiconductor IP market. Stock implications; key beneficiaries: We favor eMemory (3529.TWO) and Synopsys (SNPS.O) among IP providers, and Aspeed (5274.TWO) among adopters of post-quantum security.Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report. += Analysts employed by non-U.S. affiliates are not registered with FINRA, may not be associated persons of the member and may not be subject to FINRA restrictions on communications with a subject company, public appearances and trading securities held by a research analyst account. Key Takeaways Our base case is that quantum computing reaches meaningful commercial adoption by 2030, making current encryption vulnerable. In this report we focus on foundational server security, where hardware deployment precedes adoption by 3-5 years, making now a transition period. We believe Physical Unclonable Function (PUF)-based security IP could add 5- 10% to the semiconductor IP market. eMemory will be a key beneficiary, in our view, and we initiate coverage at Overweight. August 17, 2026 08:00 PM GMT M Global Foundation 2Key Charts Exhibit 1:We project the quantum infrastructure TAM will reach US$110bn by 2040 020406080100120 2025 2026e 2027e 2028e 2029e 2030e 2035e 2036e 2037e 2038e 2039e 2040e...USD(bn) Source: Morgan Stanley Research (E) estimates.Exhibit 2:Global quantum supply chain – Hardware security is the foundation Source: Morgan Stanley Research. Exhibit 3: The quantum hardware security TAM – our bull, base and bear cases 050010001500200025003000 2023 2024 2025 2026e 2027e 2028e 2029e 2030e 2035e 2036e 2037e 2038e 2039e 2040ePUF-PQC TAM Base Bull BearUSD(mn) Source: Company data, Morgan Stanley Research estimates. Exhibit 4: Quantum security across different connectivity layers Source: Morgan Stanley Research. Exhibit 5:Global quantum-related stocks – 2027 price/sales vs. 2025-28 sales CAGR 050100150200250300350400450 0% 20% 40% 60% 80% 100% 120%IBMMultiple Sales CAGRQuantinuum D-Wave IonQeMemory Source: Factset, Morgan Stanley Research estimates. Exhibit 6:Global Semi/PUF IP-related stocks – 2027 P/E vs. 2025-28 earnings growth 020406080100120140 0% 5% 10% 15% 20% 25% 30% 35%SynopsysARM eMemory Cadence Earnings CAGRMultiple Source: Morgan Stanley Research estimates. 9WqVmXNAuWtMpQsNbRbPaQtRoOmOsMfQoOxPeRoPvN6MrQrPxNoNsPwMtOoO M Global Foundation Morgan Stanley Research 3Quantum-related Comparables Exhibit 7:Summary of related stocks (Semi/PUF IP , quantum, and adopters) Source: FactSet, Morgan Stanley Research. Data as of August 17, 2026 M Global Foundation 4Executive Summary Quantum computing is coming soon... Industry consensus points to meaningful commercial adoption of quantum computing by 2029–30. Quantum computing could help address AI-related bottlenecks in computing efficiency, memory and data transfer. Industry leaders have already published commercialization roadmaps, with IBM targeting Quantum Starling in 2029 and Quantinuum aiming to launch the industry's first 100 logical-qubit system by 2027. Microsoft, Google and Amazon also continue to advance quantum technologies. Meanwhile, governments across the US, Europe, China, Japan, and Korea have launched national quantum initiatives, further accelerating the arrival of the quantum era. Security will be an important issue; Q-Day is approaching... Modern digital infrastructure relies on public-key cryptography such as RSA and ECC for encryption, authentication and key exchange. These algorithms were designed under the assumption that the underlying mathematical problems were computationally infeasible for classical computers. However, the transition toward fault-tolerant quantum computing could challenge this assumption, potentially enabling quantum algorithms capable of breaking many of today's encryption standards – a milestone commonly referred to as Q-Day. As a result, concerns over HNDL (Harvest Now, Decrypt Later) and the arrival of Q-Day have accelerated industry focus on post-quantum security. Many experts now believe the probability of Q-Day occurring before 2030 exceeds 50%, underscoring the need to prepare security infrastructure ahead of broad quantum adoption. What’s the reaction from governments and big companies? NIST has finalized the first set of PQC standards, while the US government has established deadlines requiring high- priority federal systems to migrate to post-quantum cryptography by 2030–31. Large technology companies are also accelerating adoption. Cloudflare targets full post- quantum security by 2029 and already protects a majority of browser traffic with post- quantum encryption. Meanwhile, Microsoft, Google, NVIDIA, AMD, Intel, and Meta have joined the Open Compute Project's Caliptra initiative to establish open security standards for future computing platforms. In networking, companies such as Cisco, Nokia, Ciena, and Juniper are developing quantum-safe networking and communications solutions, while semiconductor vendors including Samsung have publicly highlighted investments in post- quantum cryptography technologies. Security is built in multiple layers: Some technologies protect data as it moves across networks, while others protect applications, devices, and user identities. Much of the recent attention has focused on PQC, which aims to replace existing encryption algorithms that could become vulnerable to future quantum computers. However, encryption is only one part of the security stack. Cryptographic keys still need to be securely generated, stored, and protected. This is where hardware-based security, often referred to as the Root of Trust, plays a critical role. Technologies such as PUFs can create a unique hardware identity for each device and generate secrets directly from silicon characteristics, reducing the need to permanently store sensitive keys. In this report, we focus on this foundational hardware layer, which serves as the trust anchor for the broader post-quantum security ecosystem. PlfuHYowDJFUIBATexBxr8vaPlqca9sT8lrK8worRMoH51WNwxCbwX2faEocdsOs M Global Foundation Morgan Stanley Research 5How to size the hardware security opportunities? It’s about the adoption rate... We detail different scenarios in this report, considering the PQC adoption rate from different chips, PUF adoption from different PQC, and also the crypto processor adoption rate. Our base case assumes a TAM of US$310mn by 2030. Stock implications: We believe eMemory (initiate at OW) and Synopsys (EW) will be the key hardware IP providers, and Aspeed (OW), SIMO (OW), Phison (EW), and ARM (EW) will be the key adopters. Where we could be wrong: 1) Quantum computing picks up more slowly than expected; 2) competition in PUF-based PQC solutions; and 3) the emergence of new technologies for quantum cryptography. M Global Foundation 6The Shift to Post-Quantum Security Introducing quantum computing Traditional computers process information using binary bits, where each bit can only be 1 or 0. Quantum computers, by contrast, use qubits, which can exist in a combination of 0 and 1 simultaneously through a phenomenon known as superposition. Rather than evaluating possible solutions sequentially, quantum systems can explore many possible pathways simultaneously, potentially reducing the computational effort required for certain types of problems. Quantum computers derive their computational advantage from three fundamental quantum phenomena: superposition, entanglement, and interference. Superposition allows a register of n qubits to represent a quantum state spanning up to 2ⁿ possible configurations, while entanglement creates non-classical correlations between qubits that cannot be described independently. Through carefully designed quantum gates, probability amplitudes interfere constructively for correct solutions and destructively for incorrect ones, effectively steering the system toward the desired outcome. Together, these effects enable certain classes of cryptographic, optimization, and molecular simulation problems to be solved with dramatically fewer computational steps than would be required on classical architectures. Currently, AI advancement is facing growing challenges from rising energy requirements, infrastructure constraints and increasing model complexity. Quantum computing introduces a new approach that has the potential to deliver meaningful gains for selected tasks, particularly as problem sizes become increasingly difficult for conventional systems to handle. Rather than competing with AI, we expect quantum technologies to develop alongside AI, enabling faster optimization, simulation and scientific discovery while supporting the next wave of computing innovation. Exhibit 8: Classical vs. quantum algorithms Source: Morgan Stanley Research An inflection point for quantum computing Quantum computing has progressed from a theoretical concept into an emerging M Global Foundation Morgan Stanley Research 7computing platform over the past four decades. The field evolved from Paul Benioff's quantum computing model in 1980 to Peter Shor's breakthrough factoring algorithm in 1994, which first demonstrated the potential for quantum computers to disrupt modern cryptography. Since then, the industry has steadily advanced from experimental qubits to systems containing hundreds and now more than one thousand qubits. While quantum hardware remains in the Noisy Intermediate-Scale Quantum (NISQ) era today, industry roadmaps increasingly point to fault-tolerant quantum computing (FTQC) emerging around 2030, paving the way for more scalable and commercially meaningful applications thereafter. Exhibit 9:Quantum computing industry participants' roadmap & achievements Source: Morgan Stanley Research Currently, quantum computing is not developing around a single hardware architecture. Multiple approaches are being pursued in parallel, including superconducting qubits, trapped-ion systems, neutral-atom architectures, and photonic quantum computing. Each modality makes different trade-offs between scalability, fidelity, connectivity, and manufacturability. Despite these differences, industry roadmaps are increasingly converging around a similar timeline. As our US colleagues wrote in Quantinuum – A Leading Contender in the Emerging Quantum Industry, Initiate at Equal-weight (29 June 2026 ), many leading developers are targeting commercially relevant fault-tolerant quantum computers by around 2030. M Global Foundation 8Exhibit 10:Expected inflection points for quantum computing technologies Source: Company Data, Morgan Stanley Research One of the biggest challenges facing quantum computers is their susceptibility to noise and errors, which limits the scale and complexity of computations they can perform. As a result, quantum computing scalability is determined by fault tolerance. By continuously detecting and correcting errors through quantum error correction, fault-tolerant architectures enable reliable, large-scale quantum algorithms. As widely used public-key cryptosystems such as RSA and ECC are known to be vulnerable to sufficiently large fault- tolerant quantum computers, the realization of fault tolerance is widely regarded as the key milestone toward cryptographically relevant quantum computing. Exhibit 11:Time required for quantum computers to break current cryptographic algorithms Source: A Framework for Migrating to Post-Quantum Cryptography (IEEE) , Taiwan Industrial Technology Research Institute Introducing post-quantum security Modern digital infrastructure relies heavily on public-key cryptography, where security is based on mathematical problems that are computationally infeasible to solve with classical computers, such as integer factorization and discrete logarithms. However, sufficiently powerful fault-tolerant quantum computers could eventually undermine the security assumptions of these cryptographic systems. In response to the quantum threat, toward quantum-safe standards.the most practical and secure transition strategy as the broader ecosystem migrates introducing quantum-resistant protection. This hybrid approach is increasingly viewed as allowing them to preserve compatibility with existing infrastructure while gradually adopting a hybrid cryptographic model that combines traditional cryptography with PQC, replace existing cryptographic systems overnight. Instead, many organizations are systems to NIST-approved PQC standards. In practice, the industry is not expected to by signing an Executive Order in June 2026 to expedite the migration of US federal establishment standard, while the Trump administration further accelerated momentum Notably, ML-KEM has already been standardized by NIST as the first post-quantum key alternative mathematical foundations believed to remain resistant to quantum attacks. of PQC algorithms include ML-KEM, BIKE, HQC and Frodo, which are built upon ability to leverage existing digital infrastructure and cryptographic frameworks. Examples We believe PQC is likely to be the entry point into the post-quantum security era, given its Morgan Stanley Research Taiwan Industrial T  "帖子正文", "excerpt": "【大摩警告：内存涨价情况仍然激进 Q3成熟制程DRAM可能涨价50%】财联社8月19日电，根据摩根士丹利的最新预测，2026年第三季度，DDR4等成熟DRAM的价格将上涨50%，第四季度将再涨10%。摩根士丹利表示，成熟的DRAM和NAND芯片的供应紧张局面，即将进一步恶化。", "content": "【大摩警告：内存涨价情况仍然激进 Q3成熟制程DRAM可能涨价50%】财联社8月19日电，根据摩根士丹利的最新预测，2026年第三季度，DDR4等成熟DRAM的价格将上涨50%，第四季度将再涨10%。摩根士丹利表示，成熟的DRAM和NAND芯片的供应紧张局面，即将进一步恶化。而造成这一局面的主要原因在于供应端的产能转移，存储器制造商正持续将产能转向HBM、DDR5和更高层数的NAND闪存。大摩还强调，SLC NAND闪存的价格涨幅可能将更加激进，该机构预计该品类在今年剩余的两个季度中每个季度都将上涨50%。#文字观点", "publish_time": "2026-08-19 17:17", "tags": ["文字观点"]}, "post:2026-08-19T08-27:6a245b9881fd": {"id": "post:2026-08-19T08-27:6a245b9881fd", "kind": "post", "title": "2026-08-19 08:27", "source_label": "帖子正文", "excerpt": "兆易创新26H1业绩点评：Q2营收与利润同环比高增，利基存储价格持续上行 26H1营收115.66亿元，同比+178.67%；归母净利润68.57亿元，同比+1091.50%", "content": "兆易创新26H1业绩点评：Q2营收与利润同环比高增，利基存储价格持续上行 26H1营收115.66亿元，同比+178.67%；归母净利润68.57亿元，同比+1091.50%；扣非归母净利润48.83亿元，同比+796.90%，与此前预告基本一致。其中，26Q2营收73.78亿元，同比+229.18%/环比+76.16%；归母净利润53.96亿元，同比+1482.99%/环比+269.24%；扣非归母净利润34.73亿元，同比+983.35%/环比+146.30%；毛利率66.57%，同比+29.55pcts/环比+9.49pcts。 分产品看，存储芯片营收98.27亿元，同比+245.44%，占总营收约85%；毛利率67.57%，同比+29.07pcts。其中利基DRAM受益于海外大厂淡出利基市场，上半年量价齐升，毛利率同比明显提升；SLC NAND受益于国际原厂将产能转向3D NAND形成的2D NAND供给缺口，量价及毛利率同步向上；NOR Flash销量普遍增长，价格温和上涨。MCU营收14.30亿元，同比+49.07%，毛利率38.49%，价格自Q2开始温和上行。 上半年公司与长鑫关联交易19.86亿元，全年预计关联交易额达57亿元。目前公司已签合同但尚未履约的收入金额为97.94亿元，其中94.15亿元预计于2026年内确认。公司定制化存储在AI手机、AI PC、汽车及机器人领域已有重点项目突破，部分项目有望于下半年量产。 兆易创新26Q1点评：【招商电子】兆易创新：Q1利润创历史新高，全年与长鑫关联交易增至57亿元#文字观点", "publish_time": "2026-08-19 08:27", "tags": ["文字观点"]}, "post:2026-08-19T08-28:0d61658df9fe": {"id": "post:2026-08-19T08-28:0d61658df9fe", "kind": "post", "title": "2026-08-19 08:28", "source_label": "帖子正文", "excerpt": "精智达2026H1：存储大单可期，soc测试机持续推进 2026年上半年，公司营收8.04亿元，同比高增81.2%；归母净利润0.49亿元，同比+60%", "content": "精智达2026H1：存储大单可期，soc测试机持续推进 2026年上半年，公司营收8.04亿元，同比高增81.2%；归母净利润0.49亿元，同比+60%；单Q2收入4.7亿元，同比+61.5%。 利润增速低于收入增速，主要系公司战略性加大研发投入，研发费用同比+154.06%至1.55亿元。若扣除股份支付影响，归母净利润为0.61亿元，同比增长73.41%。 未来存算双轮驱动：半导体测试设备业务收入同比激增147.05%，核心驱动力为2026年1月签订的13.11亿元重大存储测试设备合同正陆续交付确认。 公司持续配合客户业务稳步推进开发针对如KGSD、HBM等基于2.5D和3D封装技术新设备。公司应用于HBM领域的CP测试机已取得订单，下一代18Gbps高速FT测试机项目有序推进，高端SoC测试机已进入样机试制阶段，为后续增长注入强劲动力。 从市场空间来看，国内今年存储测试机市场大约75亿元，探针卡耗材大约需要30亿元，明年存储测试机市场预计150亿元，探针卡市场40亿元，假设精智达分别占60%/30%，合计约102亿元潜在订单需求，假设30%净利率，给予30xPE，对应约918亿元市值，同时还有soc测试机潜在期权。#文字观点", "publish_time": "2026-08-19 08:28", "tags": ["文字观点"]}, "attachment:files/【研选•研报数据】AI正在推动半导体测试设备行业景气由传统周期修复转向结构成长，分析师看好相关产业链公司；全球物联网模组龙头厂商，二季度单季净利创历史新高，算力模.pdf": {"id": "attachment:files/【研选•研报数据】AI正在推动半导体测试设备行业景气由传统周期修复转向结构成长，分析师看好相关产业链公司；全球物联网模组龙头厂商，二季度单季净利创历史新高，算力模.pdf", "kind": "attachment", "title": "【研选•研报数据】AI正在推动半导体测试设备行业景气由传统周期修复转向结构成长，分析师看好相关产业链公司；全球物联网模组龙头厂商，二季度单季净利创历史新高，算力模", "source_label": "其他", "excerpt": "James Schneider, Ph.D. +1(212)357-2929 | jim.schneider@gs.com Goldman Sachs & Co. LLC Anmol Makkar +1(212)357-1366 | anmol.makkar@gs.com Goldman Sachs & Co. LLC Luya You +1(212)902", "content": "James Schneider, Ph.D. +1(212)357-2929 | jim.schneider@gs.com Goldman Sachs & Co. LLC Anmol Makkar +1(212)357-1366 | anmol.makkar@gs.com Goldman Sachs & Co. LLC Luya You +1(212)902-5297 | luya.you@gs.com Goldman Sachs & Co. LLC Khalil Fenina +1(212)357-6392 | khalil.fenina@gs.com Goldman Sachs & Co. LLCBroadcom Inc. (AVGO): 2Q Preview: Expect solid guidance, with focus on FY27 AI revenue and ASIC competition18 August 2026 | 4:01PM EDT Key stock takeaways: We expect investors to focus on (1) quantification of AI revenue for FY27; (2) incremental competition from MediaTek and others; (3) datacenter/customer readiness for FY27 deployments. We believe expectations are somewhat muted heading into the print, as strong CapEx spending patterns are somewhat off set by incremental competitive concerns. We expect upside to 3Q guidance, with incremental color on the company’s FY27 outlook. In the medium term, we expect investor questions to focus on potential upside to management’s prior guidance for 10GW of demand in FY27 as well as on market share trends at key accounts given incremental competitive intensity from MediaTek and others. In the near term, we expect details on volume shipment trends to key XPU customers and their readiness for FY27 AI deployments given the pace of datacenter deployments. Our FY26/27 AI revenue estimates are 1%/12% above Street. Setup heading into the print: We believe expectations are muted heading into the quarter given strong AI CapEx trends at key customers, off set by incremental competitive concerns. Our view on key metrics and our estimates: We expect modest upward revisions to Street FY26/27 estimates given upside to CapEx spending at most key customer accounts. Our FY26/27 AI revenue estimates are 1%/12% above Street. Items on the call that could move the stock: (1) Incremental details on FY27 AI revenue - In light of a robust AI spending environment and strong peer results, we expect investors to focus on any potential upside to prior guidance for 10GW of datacenter deployments; (2) Incremental ASIC competition - Given recent headlines around incremental competition in customer ASICs from MediaTek and AMD ( here ), we expect updated datapoints on Broadcom’s share position at key accounts will drive stock sentiment; (3) Datacenter deployments and customer readiness in FY27 - We believe incremental details on volume shipments to key XPU customers over the past 90 days, as well as datacenter availability (land, power, shell) in FY27 will drive Street estimates. Coming out of the print: We expect continued focus on Broadcom’s FY26/27 custom XPU revenue, as customer spending remains robust despite increased competitive intensity. We see upside to Broadcom’s networking business given datacenter buildouts, as well as Broadcom’s Tomahawk 6 product ramp. Goldman Sachs does and seeks to do business with companies covered in its research reports. As a result, investors should be aware that the firm may have a conflict of interest that could aff ect the objectivity of this report. Investors should consider this report as only a sin 标普 500 指数（SPX）最终实现的波动幅度接近每日跨式策略的两倍，但其日内波幅仍属今年以来最窄区间之一。 📉此次抛售导致波动率大幅承压，9 月及更长期限的固定行权价波动率下跌超过 30 个基点。 ❗浮动行权价波动率在标普 500 指数中于两个月期限以外出现下滑，考虑到当日大幅下行走势，这一现象令人震惊。 🔍今日波动率的变动凸显出做市商在此节点上的伽马头寸久期之长。 📊受此影响，截至本周末的跨式策略价格仅较周一早晨下跌 4 个基点，至 83 个基点。 💹从资金流角度看，早盘我们看到偏斜交易（skew）的买家持续买入风险参数。 🔙午后则有人入场反向操作，抵消偏斜变动。 💽在个股 / 主题领域，我们观察到短期期限内 DRAM 上行方向的买家，尽管今日市场走势疲软，但基本面前景依然积极。 📌标普指数隐含的截至明日的波动幅度为 0.47%。 🙏感谢 Gail Hafif 📉今日抛售是 “后 ChatGPT 时代” 以来第十大单日跌幅。#文字观点", "publish_time": "2026-08-19 08:14", "tags": ["交易台", "文字观点"]}, "post:2026-08-19T13-39:2f575fbecd59": {"id": "post:2026-08-19T13-39:2f575fbecd59", "kind": "post", "title": "2026-08-19 13:39", "source_label": "帖子正文", "excerpt": "AI 大跌点评，供参考： 【Buy the dip，震荡上行】2026-08-19 市场仍对7月的大跌PTSD，所以两个边际变化，Anthropic ARR二阶导放缓，30年期美债利率创新高，带来一波恐慌抛售。消息是在A股昨日盘中美股盘前，A股昨日大模型公司先行反应，其他公司反应相对滞后，今天跟随美", "content": "AI 大跌点评，供参考： 【Buy the dip，震荡上行】2026-08-19 市场仍对7月的大跌PTSD，所以两个边际变化，Anthropic ARR二阶导放缓，30年期美债利率创新高，带来一波恐慌抛售。消息是在A股昨日盘中美股盘前，A股昨日大模型公司先行反应，其他公司反应相对滞后，今天跟随美股下跌。#怎么看ARR数据？官方650 亿美元，而 Yipit、TickerTrends 两三周前还追到 700-800 亿，误差超100亿，对于一直跟踪Yipit周度数据的投资者预期来说，确实miss。但我们认为不必悲观，ARR 是非审计数，递表前 S-1 要求可能与第三方口径有差距。另外，6月Fable遭监管下架半个月，7月份OAI增速非常快，开元也挤占了生态位置。 OAI + Anthropic 两家合计 7 月末年化约 1050 亿，每日新增 ARR 超过 6 月；OpenAI 7 月的ARR日均新增 2.15 亿，增速贡献首次超越Anthropic，见下图。 根据silicondata的数据，最前沿模型7月以来价格下降了25%，ARR依然保持绝对增速稳定，说明量上的需求，暂时不用担心。 筹码上，AI 应用软件在涨（HUBS +5.14%）、半导体跌 5%，所以更像是#交易上动量因子平仓、不是需求重估。#后续的关键节点：8/26 英伟达财报与 8/27-29 杰克逊霍尔。 其他角度看需求：大云代表市场中长期的需求信心稳固，Neocloud短期供需方面，Nebius 容量拍卖边际价升至4000-5000 万美元/MW（2026 年基准约 1200 万）、CoreWeave 7 月各 SKU 均价提 25%、A100 签到 2029 年。 ps:0728提示多光/云空存价，0803提示开始乐观。我们搭了一套全面的AI产业跟踪数据库，如有需要欢迎联系~ 东财策略 姚皓天#文字观点", "publish_time": "2026-08-19 13:39", "tags": ["怎么看ARR数据", "交易上动量因子平仓、不是需求重估", "后续的关键节点", "文字观点"]}, "post:2026-08-19T17-17:c8509ab81062": {"id": "post:2026-08-19T17-17:c8509ab81062", "kind": "post", "title": "2026-08-19 17:17", "source_label": "帖子正文", "excerpt": "📌是什么驱动了市场？#交易台🌏亚洲股市录得三周以来最差单日表现，全球芯片股遭抛售、美债收益率走高以及油价抬升，引发广泛的风险规避情绪。", "content": "📌是什么驱动了市场？#交易台🌏亚洲股市录得三周以来最差单日表现，全球芯片股遭抛售、美债收益率走高以及油价抬升，引发广泛的风险规避情绪。 🇰🇷韩国股市领跌，三星与 SK 海力士承受较大下行压力。 🇯🇵日本股市录得自 3 月以来最大跌幅，铠侠等 AI 关联标的被抛售，银行板块同样走弱。 🇨🇳中国股市跑输大盘，科技及成长股出现下跌，不过恒生指数小幅收高，金融、地产以及能源板块表现走强，小米成为涨幅突出的个股。 🇨🇳******** 中国台湾市场跟随台积电一同出现半导体板块走弱。 🇦🇺澳大利亚股市回落，WiseTech 以及银行板块表现疲弱，医疗保健与地产开发板块维持强势。 🇮🇳印度股市连续七个交易日收跌，银行板块拖累大盘。 🌐东盟市场方面，菲律宾比索走弱叠加油价上行，菲律宾股市表现落后；印度尼西亚市场等待利率决议落地。 🗺️各区域市场综述🇦🇺澳大利亚：标普 / 澳证 200 指数下跌 0.18%，全球债券收益率上行、通胀担忧再起打压市场风险偏好。科技板块成为最大拖累，受 ACCC 调查影响 WiseTech 股价下行，金融、材料板块同样走弱。油价上涨带动能源板块跑赢大盘，医疗保健板块受财报驱动走强。地产开发商板块表现亮眼，Stockland 因业绩向好，叠加住房相关税收政策利好股价大涨，Mirvac 同步跟涨。其他个股中，Breville 因营收不及预期股价回落。整体来看，市场更多由财报与个股催化驱动，而非宏观层面的轮动。 🇨🇳******** 中国台湾：台湾加权指数下跌 1.3%，恰逢本地股指期货到期日，市场出现获利了结，交易波动剧烈。大盘蓝筹交投平淡，ABF 载板、晶圆、CPO、MLCC 等动量板块盘中振幅超过 5%。市场再度受到美债收益率、地缘局势等宏观消息扰动，但整体投资者风险偏好仍偏积极。预计本周剩余交易日市场仍将维持震荡格局。今日市场成交额进一步萎缩，较前一日下降 15%。外资连续两日净卖出台湾市场，当日对台交所净流出规模 13 亿美元。新台币汇率回落至 32 的关键心理关口，反映外资流出态势。 🇰🇷韩国：韩国综合指数下跌 5.80%，受美债收益率攀升打压，指数在 20 日 DMA（6480 点）附近剧烈震荡，隔夜动量指标出现回落。今日市场下行由机构（外资 + 本土）共同卖出主导，外资连续 5 日的买入行情宣告终结。市场流动性持续低迷，指数成交额较 20 日均值下降 24%。韩元升值 103 个基点，报 1397.95 韩元兑 1 美元，为去年 10 月以来首次站稳 1400 关口下方。收盘后消息，海力士宣布将在 8 月 20 日‑11 月 19 日的 3 个月内回购价值 4000 亿韩元的库存股，共计 2407 万股，约占总流通股本 3.29%；消息传出后，公司股价较收盘位置预计上涨 5%。 🇯🇵日本：日经 225 指数下跌 3.16%，市场再度出现去风险偏好的抛售行情，日经指数跌破 75 日 DMA。动量板块、周期股以及 AI 相关标的领跌，软银、爱德万测试、东京电子、铠侠合计贡献了日经指数近一半的跌幅。光学、半导体、半导体材料、工厂自动化板块均处于跌幅前列。值得注意的是，东证指数跌幅几乎与日经指数持平，银行板块大幅走弱，尽管市场对日本央行加息的预期升温，说明市场愈发担忧高实际收益率带来的增长风险。资金流向整体有序，并未出现恐慌性出逃，临近收盘成交量萎缩，铠侠成交量低于均值，这表明更多是买盘枯竭，而非被动抛售。防御板块相对抗跌，对冲基金积极进行获利了结。市场对英伟达下周财报保持谨慎态度。 🇨🇳中国：沪深 300 指数下跌 2.90%。受全球芯片股抛售和美债收益率上行冲击，中国股市录得一个多月最差单日表现，成长股遭受最重打击，科创 50、创业板指领跌。上证 50 相对抗跌，资金轮动至国有大盘蓝筹。市场抛售集中在科技、AI 相关标的，市场担忧 AI 基础设施开支。不过优必选机器人在大盘走弱的背景下，IPO 上市首日股价暴涨数百倍，受到市场高度关注。其他个股方面，中国资源啤酒因盈利不及预期、分红下调股价回落。南向资金大幅卖出港股，反映出国内市场风险偏好显著恶化。 🇭🇰中国香港：恒生指数上涨 0.09%，成为区域内少数收涨的市场。金融、地产、能源板块抵消科技板块的拖累，指数小幅走高。银行、保险受益于防御性资金轮动；地产开发商受住房政策乐观预期提振；能源板块跟随油价上行。科技板块是主要拖累，百度营收不及预期叠加 AI 资本开支上行承压，快手股价跌至 52 周新低。利好方面，小米超预期的智能手机业绩，成为指数最大正向贡献；香港中华煤气受益于亮眼财报与分红超预期股价大涨。中国联通因利润大幅下滑股价下挫。投资者持续期待非股本业务增长，以此作为港交所估值修复的核心驱动。 🌐东盟：印尼雅加达综合指数下跌 0.6%，印尼央行在新任行长 Dery Damayanti 主持下召开首次政策会议，市场普遍预期维持 5.75% 利率不变。决议落地前，印尼基准国债收益率跌至六周低位，全球资金持续涌入印尼债券。泰国 SET 指数下跌 0.5%，连续第二个交易日收跌，中东局势紧张叠加原油价格上行，压制这个石油进口经济体，外资为净卖出。 🇮🇳印度：印度 Nifty 指数下跌 0.46%，连续第七个交易日收跌，为 2024 年初以来最长连跌记录，指数下探 24000 点关口。原油价格维持 90 美元每桶上方持续打压市场情绪，区域市场走弱叠加美债 30 年期收益率处于数十年高位，进一步带来下行压力。值得关注的是，指数已经连续 115 个交易日运行在 200 日 DMA 下方，为十年以来最长记录。大盘指数下跌 0.3%，小盘指数下跌 0.5%。板块层面 IT 板块是唯一收涨的板块，能源、医药、金融板块跌幅居前。 💸高盛对冲基金资金流向全景🌍整个亚太地区，对冲基金整体偏向卖出。 📎印度市场，非必需消费品、通信服务板块遭遇卖出，工业板块获得买入。 🇭🇰🇨🇳中国及香港市场，对冲基金卖出意愿是买入意愿的 2.5 倍，对比四周均值，卖出规模达到‑42%，买入规模为 + 20%。 📎做空占比 39%，工业、医疗保健、材料板块获得净流入，对冲基金在 IT 板块大规模平仓，在材料、通信服务板块直接净卖出。#文字观点", "publish_time": "2026-08-19 17:17", "tags": ["交易台", "文字观点"]}, "attachment:files/【掘金行业龙头】锂电+医药+业绩预增，锂电VC年产能1万吨，上半年预计扣非净利预增超9倍，这家公司海外营收占比超4成，主要来自医药板块.pdf": {"id": "attachment:files/【掘金行业龙头】锂电+医药+业绩预增，锂电VC年产能1万吨，上半年预计扣非净利预增超9倍，这家公司海外营收占比超4成，主要来自医药板块.pdf", "kind": "attachment", "title": "【掘金行业龙头】锂电+医药+业绩预增，锂电VC年产能1万吨，上半年预计扣非净利预增超9倍，这家公司海外营收占比超4成，主要来自医药板块", "source_label": "其他", "excerpt": "大摩闭门会：金融、机器人、电力设备及交运行业更新 20260819 要点总结 1.金融行业：7 月社融数据与银行业中报解读 7 月社融数据偏弱符合预期，反映中国正从过去数倍刺激力度向可持续的一倍刺激力度过渡。2010 年前后（美国金融危机后）为 1 倍刺激，2010-2021 年约 3 倍，2021-2024 年约 2 倍，目前正逐 步向 1 倍回归，体感", "content": "大摩闭门会：金融、机器人、电力设备及交运行业更新 20260819 要点总结 1.金融行业：7 月社融数据与银行业中报解读 7 月社融数据偏弱符合预期，反映中国正从过去数倍刺激力度向可持续的一倍刺激力度过渡。2010 年前后（美国金融危机后）为 1 倍刺激，2010-2021 年约 3 倍，2021-2024 年约 2 倍，目前正逐 步向 1 倍回归，体感上政策未加码甚至边际收紧。 零售贷款持续偏弱，主因去杠杆进程。居民零售贷款占 GDP 比重从 2009 年的 20%升至 2021 年 的 60%以上，2024 年为去杠杆第一年，今年可能加速。预计去杠杆还需持续约两年，当前零售贷 款/GDP 已降至 58%-59%，合理区间或为 50%左右。 财政端在“反内卷”目标下梳理不规范减税，包括地方政府违规税收优惠及个人所得税征缴（中国 实际个人所得税率低于 2%，全球偏低），本质是财政刺激从增量扩张转向存量优化。 海外国债利率上行反映多年财政刺激后债务偿还压力，中国更关注可持续增长，短期阵痛可容忍， 长期更可持续。 从支付数据看，居民实际消费支付规模约 60-70 万亿元，远超官方统计的 50 万亿元，居民消费占 GDP 比例并不低于欧洲、日本、韩国，内需不足更多是前期过度透支的结果（住房面积、空调保有 量等均居世界前列）。 银行二季度息差环比、同比均小幅改善，推动净利息收入同比增长 9.5%；非利息收入因去年高基 数有所下滑；PPOP 增速约 6%；利润增速持续反弹，国有大行利润增速从一季度 1%回升至二季度 4%以上。 股份制银行分化：行业整体利润增速为-8%，但头部银行（兴业、招商、浦发、平安、中信）预计 为正或零附近，部分北部股份制银行仍在消化风险。 城商行不良生成已有所改善，前几年快速出清风险后今年不良相对稳定；零售和普惠领域仍在消化 前期过度投放形成的不良。近七八年每年不良消化规模约 3-4 万亿元，属稳定消化。 资本市场活跃度提升，IPO 恢复，金融行业在去杠杆背景下回到不需依赖高杠杆的可持续发展路 径，ROE 趋于稳健并出现反弹。 2.交运行业：油轮运力瓶颈与景气周期持续性 市场普遍认为油轮周期顶点在 2026 年（霍尔木兹海峡重开即见顶），但大摩认为 2027 年盈利可 能优于 2026 年，周期仍将向上，主要受需求侧和供给侧两个新变化驱动。 需求侧：海峡关闭持续时间超预期，全球原油库存持续下降。今年海峡关闭每月影响全球海运量年 化约 12 个百分点（二季度数据），即便海峡很快重开，缺失库存需在明年回补，补库急迫性随关 闭时间延长而上升。 供给侧：虽然需求年化减少 10-15 个百分点，但实际被关在海峡内的船仅占供给的 5%-6%，市场 处于供给过剩状态。但运价在回调至 10 万美元/天 TCE 附近有较强支撑。 运价支撑原因一：中东政治不确定性导致航线选择、目的地选择和运力调配出现摩擦性损耗，消耗 有效运力，再平衡了供需。 运价支撑原因二：船东议价能力大幅增强，行业前三名 VLCC 船东控制的份额较 2025 年初接近翻 倍（已剔除不合规船舶影响），防止了运价非理性下跌。 市场担忧 2027 年供给过剩的逻辑：2027 年订单全部交付将带来 7%运力增长。但大摩测算：① 7%并非年初集中交付，全年平均运力影响仅 4.5%-5%；② 今年损失的原油库存若回补至危机前水 平，将带来额外 4%需求增量。 大摩近期提出“亚洲能源安全”主题，带来两个需求增量：① 亚洲国家每增加一个月消费量的库 存，全球油运需求增加约 6%（预计 3-4 年完成）；② 亚洲国家将部分原油进口从中东切换至美国 （预计概率较高），每 5%来源切换拉动需求增长近 6 个百分点。 综合看：正常消费需求每年增长 1 个百分点 + 补 2026 年缺失库存 4 个百分点 + 运距及额外补库 存每年 2-3 个百分点，2027 年行业供需仍偏紧，紧张局面可能延续至 2028 年。 关于伊朗制裁解除的担忧：参考委内瑞拉经验，制裁解除后相关被制裁船舶并未被移除制裁；伊朗 相关船舶所有人涉及多国，牵涉金融、保险、炼油链条，制裁解除非一蹴而就，预计相当比例伊朗 相关“黑船”将拆解。若伊朗油回归合规市场而船不能全部回归，市场将出现供需错配，上行周期 可能延续至 2028 年（乐观情境）。 敏感性测算：每 1 美元运输成本上升，可带来两家公司（招商轮船、中远海能）2027 年盈利预测 上调 15%-35%（中东线和美线影响不同）。大摩近期提出“炼厂黄金时代”主题，炼厂对运输成 本上升相对不敏感，更急迫获取原油，对运价和盈利形成正向推动。 大摩已大幅上调招商轮船和中远海能 2027 年盈利预测，显著高于外资一致预期。若市场形成周期 延续至 2027-2028 年的共识，行业盈利和估值均有上调空间（海能港股隐含分红收益率水平反映 市场对周期方向不确定）。 3.工业行业：人形机器人行业进展与 WRC 前瞻 2026 年上半年全球人形机器人出货量 19000 台，同比增长 280%；中国占比 97%。用途上 65%集 中于娱乐教育、研发和数据采集等偏服务/研发类场景。 应用场景正向工业及商业服务扩展，包括搬运、上下料、分拣、检测、插拔、装配等，均处于训练 验证阶段。预计今年下半年将看到商业场景中小规模落地。 2026 年全年中国市场出货量预期至少 5 万台；2030 年预期接近 50 万台，年均复合增速接近 100%。 行业关注重点已从硬件转向模型、数据及场景应用。硬件方面灵巧手受高度重视（对灵巧操作至关 重要）。 模型端：世界模型与 VLA 模型将共存，在不同功能上各具作用。数据端：动捕和第一人称视频数据 等新数据源可规模化获取，不同数据类型在训练中的用途和比例因公司而异。 行业领先公司预计未来 2-3 年达到千万小时数据量，有望支撑行业达到 GPT-3 水平。当前阶段更需 观察模型和数据进步在具体落地应用中的实际效果。 2026 年 WRC 世界机器人大会规模扩大：300 多家参展商，150 个新产品发布；49 家国有企业组 团展示 12 个应用场景；国资委将牵头发布国有企业机器人创新联盟；将发布全球机器人应用探索 项目，推动海外商业模式探索。 语数科技今日上市首日股价表现强劲；后续仍有多家人形机器人和具身智能公司登陆资本市场，板 块关注度将维持高位，选股重要性突出。 供应链方面，大摩对头部企业绿地谐波、恒力液压保持乐观评级。 4.电力设备行业：思源电气中报业绩解读与三季度展望 思源电气上周五发布中报，本周一开盘涨停。实际业绩与 preliminary result 基本一致，利润增速 略低 1 个百分点，属正常范围。 亮点一：二季度单季收入增速 18.1%，利润增速 8%，增速较年初预期偏慢，但毛利率持续提升。 二季度单季毛利率回升至 31.6%（去年四季度 28%、今年一季度 29%、二季度 31.6%），连续两 个季度提升。 亮点二：销售、管理、研发费用率同比和环比持续下降，体现收入体量提升和海外业务发展带来的 经营杠杆效应。 汇兑影响可控：上半年汇兑损失约 8000 多万元（去年同期为汇兑收益），2026 年全年模型已反映 约 2 亿元汇兑损失，实际可控。 上半年开关业务毛利率持续提升至 39%，变压器等核心业务毛利率亦在提升。 三季度业绩前瞻：二季度交付的北美变压器订单（D 字头贸易条款，确认周期较长）未在二季度确 认收入，将在三季度确收，带动毛利率提升；去年获取的 750 千伏 GIS 订单部分已在二季度交付但 未确收，将延至三季度确认，三季度仍有超特高压等级 GIS 确认，预期三季度收入和毛利率均有较 好提升。 订单情况：2026 年全年订单增速目标 30%，上半年整体订单增速已超过 30%；国内订单增速 25%-30%；海外订单目标 50%，上半年远超 50%。高毛利区域（北美、欧洲、中东）订单结构比 例提升，变压器（更高毛利率）比例亦在提升。上半年订单增速、结构和国别组合的改善将直接支 撑 2027 年业绩。 大摩对思源电气全年利润预测超过 41 亿元，上半年经营情况为全年目标提供坚实基础，隐含下半 年利润增速将提升至 40%以上。思源电气仍为板块首选（Top Pick），当前股价回调后明年 PE 约 20 倍出头，估值在历史区间具有吸引力。 问答整理 Q1：关于社融数据，如何看待后续财政和货币政策的空间？ 答：当前政策取向是从过去大规模加码信贷转向关注存量资源优化和新增的合理平衡。财政端在梳理不 规范减税、合理化税收征管，本质是常年的、逐渐加码的财政刺激力度。短期看内需体感偏弱，但这是 从不可持续的高刺激向可持续的合理区间过渡的必经过程。海外都在加杠杆加大投资，中国正好利用外 需较好的窗口期消化内部风险、降低杠杆，长期对金融发展更有利。 Q2：银行板块的 ROE 趋势如何判断？ 答：在理性投放之后，价格逐渐趋稳，ROE 反而会更加稳健，我们看到更多板块的银行 ROE 在反弹。 全球都是类似情况——压制金融板块估值过久之后，市场发现对经济没有太多贡献；现在利率反弹，海 外贷款增速也在反弹。金融在合理盈利之下支持实体经济可持续长期发展的能力正在恢复。 Q3：油轮行业 2027 年供需测算的具体逻辑是什么？ 答：市场担心 2027 年订单全部交付带来 7%运力增长，但我们测算：第一，7%不是年初集中交付，平 均到全年运力影响约 4.5%-5%；第二，今年年初至今损失的原油库存若回补到危机前水平，将带来额 外 4%的需求增量。再加上正常消费需求每年增长 1 个百分点、运距拉长和额外补库存每年 2-3 个百分 点，2027 年行业供需仍偏紧，甚至可能延续到 2028 年。 Q4：伊朗制裁解除对油轮供给侧的冲击如何评估？ 答：参考委内瑞拉经验，战争结束后相关被制裁船舶并未被移除制裁。伊朗相关被制裁船舶的所有人并 不都是伊朗，涉及多国船东以及金融、保险、炼油链条，制裁解除不是简单一蹴而就的过程，预计相当 比例的伊朗相关黑船将拆解。若伊朗油回归合规市场而船不能全部回归，反而会造成供需错配，这是我 们预测的乐观情境，上行周期可能延续到 2028 年。 Q5：人形机器人行业当前处于什么发展阶段？ 答：行业仍处于相对早期，但发展快速。上半年全球出货 19000 台，同比增长 280%，中国占 97%。 行业关注重点已从硬件转向模型、数据和场景应用。模型端世界模型和 VLA 模型将共存，数据端动捕 和第一人称视频等新数据源在规模化应用。行业领先公司预计未来 2-3 年达到千万小时数据量，有望达 到 GPT-3 水平。当前更关键的是观察模型和数据进步在具体落地中的实际效果。 Q6：思源电气二季度毛利率提升的原因是什么？三季度能否延续？ 答：二季度毛利率提升至 31.6%，主要受益于产品结构优化和费用率下降。但二季度尚未开始确认更高 毛利的订单——北美变压器订单虽已交付但按 D 字头贸易条款需在三季度确收；750 千伏 GIS 订单部 分已在二季度交付但未确收，也将延至三季度确认。因此三季度收入和毛利率都会有较好提升，全年利 润预测超过 41 亿元，下半年利润增速预计提升至 40%以上。 原文 41052276771-1-192.mp4_原文 2026 年 08 月 19 日 发言人 各位上午好，今天是 8 月 19 号，欢迎来到摩根，是每周三的周期论剑的在线直播。我是张磊，Rachel, 汽车销量行业的分析师。今天的话我们讨论四个主题。一个的话是我们金融行业的首席徐然，会聊一下 他们对七月这个社融数据的解读，然后就是说这 业：7 月社融数据与银行业中报解读 7 月社融数据偏弱符合预期，反映中国正从过去数倍刺激力度向可持续的一倍刺激力度过渡。2010 年前后（美国金融危机后）为 1 倍刺激，2010-2021 年约 3 倍，2021-2024 年约 2 倍，目前正逐 步向 1 倍回归，体感上政策未加码甚至边际收紧。 零售贷款持续偏弱，主因去杠杆进程。居民零售贷款占 GDP 比重从 2009 年的 20%升至 2021 年 的 60%以上，2024 年为去杠杆第一年，今年可能加速。预计去杠杆还需持续约两年，当前零售贷 款/GDP 已降至 58%-59%，合理区间或为 50%左右。 财政端在“反内卷”目标下梳理不规范减税，包括地方政府违规税收优惠及个人所得税征缴（中国 实际个人所得税率低于 2%，全球偏低），本质是财政刺激从增量扩张转向存量优化。 海外国债利率上行反映多年财政刺激后债务偿还压力，中国更关注可持续增长，短期阵痛可容忍， 长期更可持续。 从支付数据看，居民实际消费支付规模约 60-70 万亿元，远超官方统计的 50 万亿元，居民消费占 GDP 比例并不低于欧洲、日本、韩国，内需不足更多是前期过度透支的结果（住房面积、空调保有 量等均居世界前列）。 银行二季度息差环比、同比均小幅改善，推动净利息收入同比增长 9.5%；非利息收入因去年高基 数有所下滑；PPOP 增速约 6%；利润增速持续反弹，国有大行利润增速从一季度 1%回升至二季度 4%以上。 股份制银行分化：行业整体利润增速为-8%，但头部银行（兴业、招商、浦发、平安、中信）预计 为正或零附近，部分北部股份制银行仍在消化风险。 城商行不良生成已有所改善，前几年快速出清风险后今年不良相对稳定；零售和普惠领域仍在消化 前期过度投放形成的不良。近七八年每年不良消化规模约 3-4 万亿元，属稳定消化。 资本市场活跃度提升，IPO 恢复，金融行业在去杠杆背景下回到不需依赖高杠杆的可持续发展路 径，ROE 趋于稳健并出现反弹。 2.交运行业：油轮运力瓶颈与景气周期持续性 市场普遍认为油轮周期顶点在 2026 年（霍尔木兹海峡重开即见顶），但大摩认为 2027 年盈利可 能优于 2026 年，周期仍将向上，主要受需求侧和供给侧两个新变化驱动。 需求侧：海峡关闭持续时间超预期，全球原油库存持续下降。今年海峡关闭每月影响全球海运量年 化约 12 个百分点（二季度数据），即便海峡很快重开，缺失库存需在明年回补，补库急迫性随关 闭时间延长而上升。 供给侧：虽然需求年化减少 10-15 个百分点，但实际被关在海峡内的船仅占供给的 5%-6%，市场 处于供给过剩状态。但运价在回调至 10 万美元/天 TCE 附近有较强支撑。 运价支撑原因一：中东政治不确定性导致航线选择、目的地选择和运力调配出现摩擦性损耗，消耗 有效运力，再平衡了供需。 运价支撑原因二：船东议价能力大幅增强，行业前三名 VLCC 船东控制的份额较 2025 年初接近翻 倍（已剔除不合规船舶影响），防止了运价非理性下跌。 市场担忧 2027 年供给过剩的逻辑：2027 年订单全部交付将带来 7%运力增长。但大摩测算：① 7%并非年初集中交付，全年平均运力影响仅 4.5%-5%；② 今年损失的原油库存若回补至危机前水 平，将带来额外 4%需求增量。 大摩近期提出“亚洲能源安全”主题，带来两个需求增量：① 亚洲国家每增加一个月消费量的库 存，全球油运需求增加约 6%（预计 3-4 年完成）；② 亚洲国家将部分原油进口从中东切换至美国 （预计概率较高），每 5%来源切换拉动需求增长近 6 个百分点。 综合看：正常消费需求每年增长 1 个百分点 + 补 2026 年缺失库存 4 个百分点 + 运距及额外补库 存每年 2-3 个百分点，2027 年行业供需仍偏紧，紧张局面可能延续至 2028 年。 关于伊朗制裁解除的担忧：参考委内瑞拉经验，制裁解除后相关被制裁船舶并未被移除制裁；伊朗 相关船舶所有人涉及多国，牵涉金融、保险、炼油链条，制裁解除非一蹴而就，预计相当比例伊朗 相关“黑船”将拆解。若伊朗油回归合规市场而船不能全部回归，市场将出现供需错配，上行周期 可能延续至 2028 年（乐观情境）。 敏感性测算：每 1 美元运输成本上升，可带来两家公司（招商轮船、中远海能）2027 年盈利预测 上调 15%-35%（中东线和美线影响不同）。大摩近期提出“炼厂黄金时代”主题，炼厂对运输成 本上升相对不敏感，更急迫获取原油，对运价和盈利形成正向推动。 大摩已大幅上调招商轮船和中远海能 2027 年盈利预测，显著高于外资一致预期。若市场形成周期 延续至 2027-2028 年的共识，行业盈利和估值均有上调空间（海能港股隐含分红收益率水平反映 市场对周期方向不确定）。 3.工业行业：人形机器人行业进展与 WRC 前瞻 2026 年上半年全球人形机器人出货量 19000 台，同比增长 280%；中国占比 97%。用途上 65%集 中于娱乐教育、研发和数据采集等偏服务/研发类场景。 应用场景正向工业及商业服务扩展，包括搬运、上下料、分拣、检测、插拔、装配等，均处于训练 验证阶段。预计今年下半年将看到商业场景中小规模落地。 2026 年全年中国市场出货量预期至少 5 万台；2030 年预期接近 50 万台，年均复合增速接近 100%。 行业关注重点已从硬件转向模型、数据及场景应用。硬件方面灵巧手受高度重视（对灵巧操作至关 重要）。 模型端：世界模型与 VLA 模型将共存，在不同功能上各具作用。数据端：动捕和第一人称视频数据 等新数据源可规模化获取，不同数据类型在训练中的用途和比例因公司而异。 行业领先公司预计未来 2-3 年达到千万小时数据量，有望支撑行业达到 GPT-3 水平。当前阶段更需 观察模型和数据进步在具体落地应用中的实际效果。 2026 年 WRC 世界机器人大会规模扩大：300 多家参展商，150 个新产品发布；49 家国有企业组 团展示 12 个应用场景；国资委将牵头发布国有企业机器人创新联盟；将发布全球机器人应用探索 项目，推动海外商业模式探索。 语数科技今日上市首日股价表现强劲；后续仍有多家人形机器人和具身智能公司登陆资本市场，板 块关注度将维持高位，选股重要性突出。 供应链方面，大摩对头部企业绿地谐波、恒力液压保持乐观评级。 4.电力设备行业：思源电气中报业绩解读与三季度展望 思源电气上周五发布中报，本周一开盘涨停。实际业绩与 preliminary result 基本一致，利润增速 略低 1 个百分点，属正常范围。 亮点一：二季度单季收入增速 18.1%，利润增速 8%，增速较年初预期偏慢，但毛利率持续提升。 二季度单季毛利率回升至 31.6%（去年四季度 28%、今年一季度 29%、二季度 31.6%），连续两 个季度提升。 亮点二：销售、管理、研发费用率同比和环比持续下降，体现收入体量提升和海外业务发展带来的 经营杠杆效应。 汇兑影响可控：上半年汇兑损失约 8000 多万元（去年同期为汇兑收益），2026 年全年模型已反映 约 2 亿元汇兑损失，实际可控。 上半年开关业务毛利率持续提升至 39%，变压器等核心业务毛利率亦在提升。 三季度业绩前瞻：二季度交付的北美变压器订单（D 字头贸易条款，确认周期较长）未在二季度确 认收入，将在三季度确收，带动毛利率提升；去年获取的 750 千伏 GIS 订单部分已在二季度交付但 未确收，将延至三季度确认，三季度仍有超特高压等级 GIS 确认，预期三季度收入和毛利率均有较 好提升。 订单情况：2026 年全年订单增速目标 30%，上半年整体订单增速已超过 30%；国内订单增速 25%-30%；海外订单目标 50%，上半年远超 50%。高毛利区域（北美、欧洲、中东）订单结构比 例提升，变压器（更高毛利率）比例亦在提升。上半年订单增速、结构和国别组合的改善将直接支 撑 2027 年业绩。 大摩对思源电气全年利润预测超过 41 亿元，上半年经营情况为全年目标提供坚实基础，隐含下半 年利润增速将提升至 40%以上。思源电气仍为板块首选（Top Pick），当前股价回调后明年 PE 约 20 倍出头，估值在历史区间具有吸引力。 问答整理 Q1：关于社融数据，如何看待后续财政和货币政策的空间？ 答：当前政策取向是从过去大规模加码信贷转向关注存量资源优化和新增的合理平衡。财政端在梳理不 规范减税、合理化税收征管，本质是常年的、逐渐加码的财政刺激力度。短期看内需体感偏弱，但这是 从不可持续的高刺激向可持续的合理区间过渡的必经过程。海外都在加杠杆加大投资，中国正好利用外 需较好的窗口期消化内部风险、降低杠杆，长期对金融发展更有利。 Q2：银行板块的 ROE 趋势如何判断？ 答：在理性投放之后，价格逐渐趋稳，ROE 反而会更加稳健，我们看到更多板块的银行 ROE 在反弹。 全球都是类似情况——压制金融板块估值过久之后，市场发现对经济没有太多贡献；现在利率反弹，海 外贷款增速也在反弹。金融在合理盈利之下支持实体经济可持续长期发展的能力正在恢复。 Q3：油轮行业 2027 年供需测算的具体逻辑是什么？ 答：市场担心 2027 年订单全部交付带来 7%运力增长，但我们测算：第一，7%不是年初集中交付，平 均到全年运力影响约 4.5%-5%；第二，今年年初至今损失的原油库存若回补到危机前水平，将带来额 外 4%的需求增量。再加上正常消费需求每年增长 1 个百分点、运距拉长和额外补库存每年 2-3 个百分 点，2027 年行业供需仍偏紧，甚至可能延续到 2028 年。 Q4：伊朗制裁解除对油轮供给侧的冲击如何评估？ 答：参考委内瑞拉经验，战争结束后相关被制裁船舶并未被移除制裁。伊朗相关被制裁船舶的所有人并 不都是伊朗，涉及多国船东以及金融、保险、炼油链条，制裁解除不是简单一蹴而就的过程，预计相当 比例的伊朗相关黑船将拆解。若伊朗油回归合规市场而船不能全部回归，反而会造成供需错配，这是我 们预测的乐观情境，上行周期可能延续到 2028 年。 Q5：人形机器人行业当前处于什么发展阶段？ 答：行业仍处于相对早期，但发展快速。上半年全球出货 19000 台，同比增长 280%，中国占 97%。 行业关注重点已从硬件转向模型、数据和场景应用。模型端世界模型和 VLA 模型将共存，数据端动捕 和第一人称视频等新数据源在规模化应用。行业领先公司预计未来 2-3 年达到千万小时数据量，有望达 到 GPT-3 水平。当前更关键的是观察模型和数据进步在具体落地中的实际效果。 Q6：思源电气二季度毛利率提升的原因是什么？三季度能否延续？ 答：二季度毛利率提升至 31.6%，主要受益于产品结构优化和费用率下降。但二季度尚未开始确认更高 毛利的订单——北美变压器订单虽已交付但按 D 字头贸易条款需在三季度确收；750 千伏 GIS 订单部 分已在二季度交付但未确收，也将延至三季度确认。因此三季度收入和毛利率都会有较好提升，全年利 润预测超过 41 亿元，下半年利润增速预计提升至 40%以上。 原文 41052276771-1-192.mp4_原文 2026 年 08 月 19 日 发言人 各位上午好，今天是 8 月 19 号，欢迎来到摩根，是每周三的周期论剑的在线直播。我是张磊，Rachel, 汽车销量行业的分析师。今天的话我们讨论四个主题。一个的话是我们金融行业的首席徐然，会聊一下 他们对七月这个社融数据的解读，然后就是说这个行银行业的这个数据的中报有什么指引。然后第二是 我们交银行业的首席范倩蕾会聊一下，他们最近刚出了一个报告，关于邮轮动力将成为原油补库存的这 个瓶颈，景气周期会持续性或者超预期。我们工业行业的首席中盛会聊一下他们最近一个是参加了这个 世界世界机器人大会的，是一个是对这周的这个世界机器人大会的一个前瞻，以及他们最近对人形机器 人行业的一些进展的更新。然后最后的话，我们公用行业的公用事业行业的首席伊娃会聊一下他们最近 出的这个思源电期的一个中英报业绩的解读，以及对三季度的一个展望。开始之前的例行我需要读一个 disco。 发言人 请注意本次会议仅面向摩根大机构客户以及财务顾会议不对媒体开放。如果您来自会媒体的话，敬请退 出会议。另外提示一下大家，在整个会议的过程中，您可以随时在屏幕上发送您的问题。这样我们可以 节约一下这个 QNA 的等待的时间。好，我也不多说了，我把时间先交给 Richard。好的，感谢 Rachel。我们看到 7 月份的社融还是比较缓慢的这个也符合我们的一个预期，就是中国现在还是在从 几倍的刺激的力度，逐渐向我们认为比较可持续的一倍的刺激力度来过渡。最终这都会反映在社融的数 字里面，因为它包括了整体的贷款的一个情况，以及财政发债等等等的这些情况。 发言人 我们上次也说到过，就说在我们认为也 21 年之前，如果把这个美国金融危机之后四季度看作一倍，21 年之后，主要以之前都是以三倍的这个速度运行，那么 21 年到 24 年，大约是两倍。那么现在逐渐向 以备过度，所以大家的体感可能就是不但没有加码，可能还在收紧。主要就是可能原来的刺激不太可持 续，那么向着一个合理的一个区区间来去过渡。 发言人 从贷款的数据来看，这个整体零售还是比较差的。零售比较差也是在这个去杠杆的过程中，我们上次的 一些分析也有一个比较详细的一个数据。也就是说这个啊零售上杠杆从 20%的 GDP 上到 60 多，到从 09 年到 21 年。那么 21 年到 24 年是处在稳健。去年是第一年零售开始有去杠杆的趋势，今年可能会 加速去一些杠杆。主要的就是各种的对零售贷款的窗口指导终于都给取消，所以我们觉得这个去杠杆的 可能还得持续个两年左右的一个区间。现在可能降到了 59% 5，58、59，整个零售贷款比上 GDP 那逐 渐回升到回回回到这个 50，可能是是比较好的一个合理的一个区间，考虑到中国的这个人均 GDP 的比 例等等等等，我们觉得这个可能更加合理一些。 发言人 那么从整个的财政的这块，其实大家也可以看到，最近对各种查税也是其实在过去大范围的减税之后， 现在也是在反内卷的这个大的目标之下，对过去尤其是对地方政府一些不规范的减税进行了一些梳理， 以及对香港等等等一些财富。本来该收的税种，包括个人所得税税率，我们也原来算我实际的个中国 中在了娱乐教育研发和数据采集这样一些偏服务类的场景，偏研发类的场 景，这个大概占比占到了 65%。 发言人 但同时我们也看到应用的场景其实是在更广泛的去到了各种工业以及商业服务里面去做更多的验证测试 和训练。这些场景就非常广泛了，包括工业里面的各种搬运、上下料、分拣、检测、插拔、装配这些都 已经是在一个训练的过程中。我们认为今这些在商业场景中的这些训练，也能够促使我们在今年下半年 会看到一些在商业真正商业场景中的小规模量的一些具体落地。当然这个是涉及到很多后续机器人在前 期的预训练过程中到实际场景中，通过后训练它能够适应到一些具体的工作场景。", "status": "extracted"}, "post:2026-08-19T23-14:1e6aab07419e": {"id": "post:2026-08-19T23-14:1e6aab07419e", "kind": "post", "title": "2026-08-19 23:14", "source_label": "帖子正文", "excerpt": "【长江电新】湖南裕能2026年中报分析：盈利能力保持强劲，中期竞争力不断夯实 事件：湖南裕能发布2026年中报，上半年实现收入348.77亿元，同比增长142.92%，归母净利润29.10亿元，同比增长853.51%，扣非净利润29.58亿元，同比增长854.20%。其中2026Q2收入199.12", "content": "【长江电新】湖南裕能2026年中报分析：盈利能力保持强劲，中期竞争力不断夯实 事件：湖南裕能发布2026年中报，上半年实现收入348.77亿元，同比增长142.92%，归母净利润29.10亿元，同比增长853.51%，扣非净利润29.58亿元，同比增长854.20%。其中2026Q2收入199.12亿元，同比增长162.15%，归母净利润15.54亿元，同比增长636.90%，扣非净利润16.19亿元，同比增长619.48%。 1、就上半年来看，公司磷酸盐正极材料销量为66.72万吨，同比增长38.77%，基本保持满产满销。公司磷酸盐正极材料收入为342.72亿元，同比增长143.47%，毛利率为14.81%，同比提升7.84pct。从结构上看，上半年公司高端产品销量约41.67万吨，占比提升至62.46%；储能产品在总销量的占比提升至53%；公司磷酸盐正极材料海外销量达1.8万吨，同比实现跨域式增长。 2、拆分2026Q2来看，公司正极销量为36.84万吨，环比增长23.3%，单吨毛利为0.75万元，扣非单吨净利为0.44万元，环比基本保持稳定，超出预期。我们认为在行业单位盈利有所波动的情况下，公司更具韧性的原因主要是高端占比提升，规模效应体现，磷矿一体化占比提升等推动；同时公司库存管理更优也有积极影响。5-6月磷源、硫源价格上涨，公司也在积极推动价格联动、谈判落地，下半年加工端的盈利有望改善。 3、公司始终在坚持推动内在竞争力提升，7月公告建设矿化一体新能源电池材料循环产业项目，将在贵州推动80万吨磷酸铁锂、100万吨磷酸铁及其上游产业链项目配套，包括磷源、铁源（硫铁矿等）、碳酸锂加工及锂电池回收等。公司当前盈利水平和成本控制能力在铁锂公司中领先，未来通过一体化夯实竞争力，强化中期市场地位。我们预计公司2026年归母净利润65亿元左右，对应仅9-10X，继续推荐。#文字观点", "publish_time": "2026-08-19 23:14", "tags": ["文字观点"]}, "post:2026-08-19T07-23:16d089a09cc5": {"id": "post:2026-08-19T07-23:16d089a09cc5", "kind": "post", "title": "2026-08-19 07:23", "source_label": "帖子正文", "excerpt": "8月19日：机器人、住房公积金、信创软件、钠离子电池等概念股梳理 一、昨夜发酵消息精选。1、机器人：150+新品亮相！", "content": "8月19日：机器人、住房公积金、信创软件、钠离子电池等概念股梳理 一、昨夜发酵消息精选。 1、机器人：150+新品亮相！2026世界机器人大会19日开幕，首次设立央企专区，国资委将在大会现场宣布成立\"央企机器人创新联合体\"。宇树科技19日在上交所科创板上市，证券简称为“宇树科技”，证券代码688836。关注宇树上市后的反馈！ 概念股：埃斯顿、上纬新材、巨轮智能、绿的谐波、中大力德、科达利、骏创科技、安培龙、三协电机、华依科技、双环传动、汇川技术、鸣志电器、拓普集团、三花智控、柯力传感、奥比中光、昊志机电、江苏雷利、兆威机电、禾川科技、 itle": "2026-08-19 08:27", "source_label": "帖子正文", "excerpt": "光伏主产业链重点公司及行业动态日报0818行业动态： 1. 近期，云南省发改委、财政厅、工信厅、科技厅四部门联合印发《云南省政府投资基金重点投资领域清单》。文件指出，要以绿色能源为核心板块，重点支持水电、硅光伏、钙钛矿、储能及氢能全产业链，并布局风光水火储、源网荷储和“绿电+先进制造”，以财政资金撬", "content": "光伏主产业链重点公司及行业动态日报0818行业动态： 1. 近期，云南省发改委、财政厅、工信厅、科技厅四部门联合印发《云南省政府投资基金重点投资领域清单》。文件指出，要以绿色能源为核心板块，重点支持水电、硅光伏、钙钛矿、储能及氢能全产业链，并布局风光水火储、源网荷储和“绿电+先进制造”，以财政资金撬动社会资本，助力新型电力系统建设。 2. 8月17日，江苏省镇江市发展和改革委员会就《镇江市“十五五”光伏开发利用及绿电协同发展工作方案》公开征求意见。提出集中式与分布式光伏协同推进，到2030年分布式光伏装机达560万千瓦、较当前实现倍增。重点依托工业园区、公共建筑、农村及交通廊道开发光伏，推进园区“源网荷储”和微电网建设，鼓励存量厂房屋顶“能装尽装”，新建厂房可利用屋顶光伏安装比例达到100%。 3. 近日，中节能太阳能科技(海南)有限公司成立，法定代表人为银路，经营范围包含:太阳能发电技术服务;储能技术服务;合同能源管理;以自有资金从事投资活动;节能管理服务等。企查查股权穿透显示，该公司由太阳能全资持股。公司动态： 【帝科股份】公司公告，公司本次发行计划募集资金27.60 亿元，将主要用于“年产2000吨贱金属少银光伏浆料项目”“下一代高效光伏电池金属化浆料研发项目”“存储芯片封装测试基地项目”“半导体封装研发中心项目”及偿还银行贷款和补充流动资金。 【晶科能源】公司公告，股价已触发“晶能转债”转股价下修条款，董事会提议下修当前6.35元/股的转股价格，并提交股东会审议。此前转股价已由13.48元/股下修至6.35元/股。若股东会召开日前20个交易日均价或前一交易日均价高于现行转股价，则无需调整。今日行情：上证综指：+0.19%；沪深300：-0.32%；光伏行业指数：-0.10%#文字观点", "publish_time": "2026-08-19 08:27", "tags": ["文字观点"]}, "attachment:files/中金公司-电新双周报：特高压建设步伐加快，锂电8月排产环比加速-260817.pdf": {"id": "attachment:files/中金公司-电新双周报：特高压建设步伐加快，锂电8月排产环比加速-260817.pdf", "kind": "attachment", "title": "中金公司-电新双周报：特高压建设步伐加快，锂电8月排产环比加速-260817", "source_label": "中金公司", "excerpt": "James Schneider, Ph.D. +1(212)357-2929 | jim.schneider@gs.com Goldman Sachs & Co. LLC Anmol Makkar +1(212)357-1366 | anmol.makkar@gs.com Goldman Sachs & Co. LLC Luya You +1(212)902", "content": "James Schneider, Ph.D. +1(212)357-2929 | jim.schneider@gs.com Goldman Sachs & Co. LLC Anmol Makkar +1(212)357-1366 | anmol.makkar@gs.com Goldman Sachs & Co. LLC Luya You +1(212)902-5297 | luya.you@gs.com Goldman Sachs & Co. LLC Khalil Fenina +1(212)357-6392 | khalil.fenina@gs.com Goldman Sachs & Co. LLCBroadcom Inc. (AVGO): 2Q Preview: Expect solid guidance, with focus on FY27 AI revenue and ASIC competition18 August 2026 | 4:01PM EDT Key stock takeaways: We expect investors to focus on (1) quantification of AI revenue for FY27; (2) incremental competition from MediaTek and others; (3) datacenter/customer readiness for FY27 deployments. We believe expectations are somewhat muted heading into the print, as strong CapEx spending patterns are somewhat off set by incremental competitive concerns. We expect upside to 3Q guidance, with incremental color on the company’s FY27 outlook. In the medium term, we expect investor questions to focus on potential upside to management’s prior guidance for 10GW of demand in FY27 as well as on market share trends at key accounts given incremental competitive intensity from MediaTek and others. In the near term, we expect details on volume shipment trends to key XPU customers and their readiness for FY27 AI deployments given the pace of datacenter deployments. Our FY26/27 AI revenue estimates are 1%/12% above Street. Setup heading into the print: We believe expectations are muted heading into the quarter given strong AI CapEx trends at key customers, off set by incremental competitive concerns. Our view on key metrics and our estimates: We expect modest upward revisions to Street FY26/27 estimates given upside to CapEx spending at most key customer accounts. Our FY26/27 AI revenue estimates are 1%/12% above Street. Items on the call that could move the stock: (1) Incremental details on FY27 AI revenue - In light of a robust AI spending environment and strong peer results, we expect investors to focus on any potential upside to prior guidance for 10GW of datacenter deployments; (2) Incremental ASIC competition - Given recent headlines around incremental competition in customer ASICs from MediaTek and AMD ( here ), we expect updated datapoints on Broadcom’s share position at key accounts will drive stock sentiment; (3) Datacenter deployments and customer readiness in FY27 - We believe incremental details on volume shipments to key XPU customers over the past 90 days, as well as datacenter availability (land, power, shell) in FY27 will drive Street estimates. Coming out of the print: We expect continued focus on Broadcom’s FY26/27 custom XPU revenue, as customer spending remains robust despite increased competitive intensity. We see upside to Broadcom’s networking business given datacenter buildouts, as well as Broadcom’s Tomahawk 6 product ramp. Goldman Sachs does and seeks to do business with companies covered in its research reports. As a result, investors should be aware that the firm may have a conflict of interest that could aff ect the objectivity of this report. Investors should consider this report as only a single factor in making their investment decision. For Reg AC certification and other important disclosures, see the Disclosure Appendix, or go to www.gs.com/research/hedge.html . Analysts employed by non-US affiliates are not registered/qualified as research analysts with FINRA in the U.S. Equity Research c45a43530f604d12bcb9a82b5aa6b9f6 Price Target and Risks: Our 12-month target price of $525 is based on 30X our normalized EPS estimate of $17.50. Key downside risks include: (1) slowdown in AI infrastructure spending, (2) share loss in custom compute franchise, (3) persistent inventory digestion in non-AI; (4) increased competition in VMware. Source: Company data, Goldman Sachs Research estimates, FactSet. Price as of 17 Aug 2026 close. Exhibit 1: AVGO - GS vs Street Financials ($ mn, except EPS) GS Street GS / Street GS Street GS / Street GS Street GS / Street GS Street GS / Street Total Revenue 29,571 29,479 0% 36,162 35,110 3% 107,230 106,108 1% 186,986 175,124 7% Gross Margin (excl. SBC) 74.1% 74.1% +1 bps 73.4% 73.3% +11 bps 75.0% 75.0% -0 bps 72.2% 72.1% +4 bps Operating Income (excl. SBC) 19,823 19,708 1% 24,427 23,460 4% 72,004 70,938 2% 126,243 116,442 8% Operating Margin (%) 67.0% 66.9% +18 bps 67.5% 66.8% +73 bps 67.1% 66.9% +29 bps 67.5% 66.5% +102 bps EPS (excl. SBC) $3.33 $3.24 3% $4.12 $3.89 6% $11.95 $11.63 3% $21.40 $19.45 10% Segments GS Street GS / Street GS Street GS / Stre 优势，毛利率由2022年44%升至2025年60%，是全球少数实现规模化盈利的人形机器人厂商；二是产品迭代极快（26个月内推出H1/G1/R1/H2四代人形及Go2等四足矩阵），在科研教育、巡检应急等场景持续抢先卡位，2025年人形出货量超5500台居全球第一，占国内约70%份额（与智元并列）。 成本护城河与盈利模型 • 自研关节模组（电机/减速器/编码器/驱动器）、主控板、电池包及激光雷达，四足自研率约90%、人形80–90%，G1整机BOM约4.16万元，全尺寸人形BOM已低于10万元。 • 2025年营收16.99亿元（同比+333%），归母净利2.78亿元，正常化净利5.91亿元（剔除3.49亿元股份支付），净利率约35%；2026–2028年野村预测营收26.87亿/53.96亿/131.84亿元，净利5.32亿/10.86亿/26.62亿元，对应2027/2028年营收增速101%/144%。 • 人形机器人均价由2024年26万元降至2025年16.6万元，但销量由412台增至5215台，量增完全抵消降价；预计2026–2028年人形ASP再降40%/20%/15%，销量达1.56万/3.91万/11.5万台。 产品矩阵与“脑”进展 • 四足：Laikago→AlienGo→B1→Go2（\u003c1万元消费级），累计出货超3.3万台，全球份额多年第一。 • 人形：H1（2023.8）→G1（2024.5，最畅销）→R1（2025.7，2.99万元）→H2（2025.10，31自由度，19.9万元）；Dex灵巧手、Z1机械臂同步铺开。 • “大脑”端：WVLA2.0与工业级UnifoLM-X1-0（已在内部电机装配线试点）是打开工业场景的关键催化剂；真实机器数据飞轮是区别于纯云厂商的核心资产。 海外市场与FCC管制风险 • 2025年海外营收7.317亿元（占主业43.65%），美国收入占比由2023年18.4%降至2025年13.3%。 • 2026年7月28日FCC将“境外生产的先进机器人设备”列入Covered List：已获授权的在售机型（G1/H2/R1/Go2/B2/A2）可继续销售，但新开发机型将被阻断；8月6日FNPRM拟将授权期限限为10年、进口豁免由4000台砍至40台、强制HBOM/SBOM披露。 • 野村视其为“结构性而非周期性”约束：长期增长需依赖非美市场（欧洲/中东/东南亚）及国内工业场景，美国市场边际贡献将逐步衰减。 行业与需求结构 • GGII预测2030年全球人形市场6057台→15亿美元，中国27.12万台→380亿元；四足全球56万台→80亿元。 • 2026年行业需求仍由非生产性场景主导：演艺/消费各约30%、政府采集约20%、科研约15%、工业商用仅约5%；真正“工厂ROI闭环”尚未验证，当前出货多由数据采集、政采展示、厂商补贴驱动。 • 具身智能瓶颈在高质量实机交互数据（缺口约20倍），“脑”的成熟需2–3年；宇树凭借最大在役机队获得数据反馈优势。 估值与风险 • 目标价370元对应2027年P/S 25倍（同业人形标的UBTech约7倍、Dobot约8.8倍，A股组件厂仅2–4倍），溢价来自纯机器人属性、全球出货量第一及2026–2028年营收CAGR 122%。 • 下行风险：FCC管制扩大至盟友市场；科研客户饱和后工业落地不及预期；Tesla Optimus及国内车企/消费电子入局引发ASP战；大模型研发投入侵蚀毛利率；“脑”进展落后纯软件厂商。 • 催化剂：WVLA2.0/UnifoLM-X1-0商用、R1/H2放量超预期、非美渠道扩张、1H26营收超指引（预计10.52–11.28亿元，同比+36%~45%）。", "publish_time": "2026-08-19 15:23", "tags": []}, "post:2026-08-19T10-27:1d2d8a32950a": {"id": "post:2026-08-19T10-27:1d2d8a32950a", "kind": "post", "title": "2026-08-19 10:27", "source_label": "帖子正文", "excerpt": "【华创机械】人形机器人：宇树上市超预期大涨，结合我们近期调研，板块下半年可以乐观 🤖️我们的观点 宇树科技今日超预期大涨，结合近期对核心T链公司的调研，我们认为#当前阶段可以乐观。🤖️宇树上市：不仅是IPO，更是板块定价锚 A股人形机器人“第一股”，上市上市首日流通盘仅7%，筹码稀缺，大涨超预期。", "content": "【华创机械】人形机器人：宇树上市超预期大涨，结合我们近期调研，板块下半年可以乐观 🤖️我们的观点 宇树科技今日超预期大涨，结合近期对核心T链公司的调研，我们认为#当前阶段可以乐观。🤖️宇树上市：不仅是IPO，更是板块定价锚 A股人形机器人“第一股”，上市上市首日流通盘仅7%，筹码稀缺，大涨超预期。我们认为，#宇树上市将人形机器人进一步推向可交易、可对标的产业资产，有望成为板块新的估值锚。 同时，#今日世界机器人大会开幕，世界人形机器人运动会临近，短期催化密集。 🤖️特斯拉：下半年产业催化有望持续 我们近期调研核心T链，产业持续有新进展、板块有预期差： #产线：T在弗里蒙特的首条机器人产线已进入设备进场/安装阶段，产业化进展持续推进； #产能指引：8月200台，11月底2k，12月底2.5k，27年中5k，27年底1w； #供应链：丝杠等供应商已逐步进入EDI体系，德州超级工厂则对应更长期的大规模产能建设。 🤖️推荐标的：#本体：本体厂率先受益N宇树- W、上纬新材、优必选、宏润建设、均普智能等 #T链：核心环节格局进一步清晰，调研有望辨别“真T链” （1）丝杠：浙江荣泰（身体新增2根滚珠丝杠）、恒立液压、五洲新春、震裕科技（主业高景气，可转债即将挂牌）等； （2）减速器：科达利（主业景气度高）、斯菱智驱等； （3）电机：恒帅股份、拓普集团、三花智控、峰岹科技等； （4）结构件：长盈精密等； （5）传感器：安培龙、华依科技等； （6）场景落地：均普智能。#国产链：（1）宇树链：长盛轴承、美湖股份、中大力德、奥比光等； （2）优必选链：锋龙股份、震裕科技等； （3）智元链：中大力德、均普智能等。 联系我们：华创机械团队 范益民/朱珠#文字观点", "publish_time": "2026-08-19 10:27", "tags": ["当前阶段可以乐观", "本体", "本体厂率先受益", "国产链", "文字观点"]}, "post:2026-08-19T12-29:c815ddf91e21": {"id": "post:2026-08-19T12-29:c815ddf91e21", "kind": "post", "title": "2026-08-19 12:29", "source_label": "帖子正文", "excerpt": "浙商机械 邱世梁|王华君【具身智能】宇树今日上市，开盘市值4449亿！人形机器人量产渐近，持续推荐！", "content": "浙商机械 邱世梁|王华君【具身智能】宇树今日上市，开盘市值4449亿！人形机器人量产渐近，持续推荐！ 一、宇树 #宇树今日上市。宇树科技高开629%，总市值达4449亿。 #公司人形机器人累计下线约1.8万台。2025年公司人形机器人出货量超5500台，截至8月12日，公司2026年人形机器人累计生产下线数量约12500台。 二、海外： #特斯拉弗里蒙特工厂开建Optimus生产线。7月23日，特斯拉26Q2财报电话会上称，弗里蒙特工厂正在安装用于Optimus的第一代生产线，预计26年晚些时候投产。 国际巨头特斯拉产线建设加速推进，国内巨头上市在即、大单频现，人形机器人产业化进展加速。 【具身智能】重视： 1、确定性强的零部件供应商：恒立液压、三花智控、拓普集团、浙江荣泰、汇川技术、双环传动、绿的谐波、五洲新春、金沃股份、奥比中光、中大力德、雷迪克等 2、整机及应用场景：杭叉集团、中力股份、杰克科技、咸亨国际、杭州柯林、新时达、横河精密、中坚科技、优必选、安徽合力等 3、新技术或低估值转型标的：涛涛车业、上海沿浦、华翔股份、峰岹科技、安培龙、柯力传感、汉威科技、福莱新材、日盈电子等 风险提示：AI发展不及预期等 浙商机械【具身智能】60多篇深度报告合集：浙商机械【人形机器人】系列深度 浙商机械 邱世梁/王华君18610723118/蒋逸18158576706/秦乐恒15221680140#文字观点", "publish_time": "2026-08-19 12:29", "tags": ["文字观点"]}, "attachment:files/大摩闭门会：金融、机器人、电力设备及交运行业更新20260819.pdf": {"id": "attachment:files/大摩闭门会：金融、机器人、电力设备及交运行业更新20260819.pdf", "kind": "attachment", "title": "大摩闭门会：金融、机器人、电力设备及交运行业更新20260819", "source_label": "其他", "excerpt": "大摩闭门会：金融、机器人、电力设备及交运行业更新 20260819 要点总结 1.金融行业：7 月社融数据与银行业中报解读 7 月社融数据偏弱符合预期，反映中国正从过去数倍刺激力度向可持续的一倍刺激力度过渡。2010 年前后（美国金融危机后）为 1 倍刺激，2010-2021 年约 3 倍，2021-2024 年约 2 倍，目前正逐 步向 1 倍回归，体感", "content": "大摩闭门会：金融、机器人、电力设备及交运行业更新 20260819 要点总结 1.金融行业：7 月社融数据与银行业中报解读 7 月社融数据偏弱符合预期，反映中国正从过去数倍刺激力度向可持续的一倍刺激力度过渡。2010 年前后（美国金融危机后）为 1 倍刺激，2010-2021 年约 3 倍，2021-2024 年约 2 倍，目前正逐 步向 1 倍回归，体感上政策未加码甚至边际收紧。 零售贷款持续偏弱，主因去杠杆进程。居民零售贷款占 GDP 比重从 2009 年的 20%升至 2021 年 的 60%以上，2024 年为去杠杆第一年，今年可能加速。预计去杠杆还需持续约两年，当前零售贷 款/GDP 已降至 58%-59%，合理区间或为 50%左右。 财政端在“反内卷”目标下梳理不规范减税，包括地方政府违规税收优惠及个人所得税征缴（中国 实际个人所得税率低于 2%，全球偏低），本质是财政刺激从增量扩张转向存量优化。 海外国债利率上行反映多年财政刺激后债务偿还压力，中国更关注可持续增长，短期阵痛可容忍， 长期更可持续。 从支付数据看，居民实际消费支付规模约 60-70 万亿元，远超官方统计的 50 万亿元，居民消费占 GDP 比例并不低于欧洲、日本、韩国，内需不足更多是前期过度透支的结果（住房面积、空调保有 量等均居世界前列）。 银行二季度息差环比、同比均小幅改善，推动净利息收入同比增长 9.5%；非利息收入因去年高基 数有所下滑；PPOP 增速约 6%；利润增速持续反弹，国有大行利润增速从一季度 1%回升至二季度 4%以上。 股份制银行分化：行业整体利润增速为-8%，但头部银行（兴业、招商、浦发、平安、中信）预计 为正或零附近，部分北部股份制银行仍在消化风险。 城商行不良生成已有所改善，前几年快速出清风险后今年不良相对稳定；零售和普惠领域仍在消化 前期过度投放形成的不良。近七八年每年不良消化规模约 3-4 万亿元，属稳定消化。 资本市场活跃度提升，IPO 恢复，金融行业在去杠杆背景下回到不需依赖高杠杆的可持续发展路 径，ROE 趋于稳健并出现反弹。 2.交运行业：油轮运力瓶颈与景气周期持续性 市场普遍认为油轮周期顶点在 2026 年（霍尔木兹海峡重开即见顶），但大摩认为 2027 年盈利可 能优于 2026 年，周期仍将向上，主要受需求侧和供给侧两个新变化驱动。 需求侧：海峡关闭持续时间超预期，全球原油库存持续下降。今年海峡关闭每月影响全球海运量年 化约 12 个百分点（二季度数据），即便海峡很快重开，缺失库存需在明年回补，补库急迫性随关 闭时间延长而上升。 供给侧：虽然需求年化减少 10-15 个百分点，但实际被关在海峡内的船仅占供给的 5%-6%，市场 处于供给过剩状态。但运价在回调至 10 万美元/天 TCE 附近有较强支撑。 运价支撑原因一：中东政治不确定性导致航线选择、目的地选择和运力调配出现摩擦性损耗，消耗 有效运力，再平衡了供需。 运价支撑原因二：船东议价能力大幅增强，行业前三名 VLCC 船东控制的份额较 2025 年初接近翻 倍（已剔除不合规船舶影响），防止了运价非理性下跌。 市场担忧 2027 年供给过剩的逻辑：2027 年订单全部交付将带来 7%运力增长。但大摩测算：① 7%并非年初集中交付，全年平均运力影响仅 4.5%-5%；② 今年损失的原油库存若回补至危机前水 平，将带来额外 4%需求增量。 大摩近期提出“亚洲能源安全”主题，带来两个需求增量：① 亚洲国家每增加一个月消费量的库 存，全球油运需求增加约 6%（预计 3-4 年完成）；② 亚洲国家将部分原油进口从中东切换至美国 （预计概率较高），每 5%来源切换拉动需求增长近 6 个百分点。 综合看：正常消费需求每年增长 1 个百分点 + 补 2026 年缺失库存 4 个百分点 + 运距及额外补库 存每年 2-3 个百分点，2027 年行业供需仍偏紧，紧张局面可能延续至 2028 年。 关于伊朗制裁解除的担忧：参考委内瑞拉经验，制裁解除后相关被制裁船舶并未被移除制裁；伊朗 相关船舶所有人涉及多国，牵涉金融、保险、炼油链条，制裁解除非一蹴而就，预计相当比例伊朗 相关“黑船”将拆解。若伊朗油回归合规市场而船不能全部回归，市场将出现供需错配，上行周期 可能延续至 2028 年（乐观情境）。 敏感性测算：每 1 美元运输成本上升，可带来两家公司（招商轮船、中远海能）2027 年盈利预测 上调 15%-35%（中东线和美线影响不同）。大摩近期提出“炼厂黄金时代”主题，炼厂对运输成 本上升相对不敏感，更急迫获取原油，对运价和盈利形成正向推动。 大摩已大幅上调招商轮船和中远海能 2027 年盈利预测，显著高于外资一致预期。若市场形成周期 延续至 2027-2028 年的共识，行业盈利和估值均有上调空间（海能港股隐含分红收益率水平反映 市场对周期方向不确定）。 3.工业行业：人形机器人行业进展与 WRC 前瞻 2026 年上半年全球人形机器人出货量 19000 台，同比增长 280%；中国占比 97%。用途上 65%集 中于娱乐教育、研发和数据采集等偏服务/研发类场景。 应用场景正向工业及商业服务扩展，包括搬运、上下料、分拣、检测、插拔、装配等，均处于训练 验证阶段。预计今年下半年将看到商业场景中小规模落地。 2026 年全年中国市场出货量预期至少 5 万台；2030 年预期接近 50 万台，年均复合增速接近 100%。 行业关注重点已从硬件转向模型、数据及场景应用。硬件方面灵巧手受高度重视（对灵巧操作至关 重要）。 模型端：世界模型与 VLA 模型将共存，在不同功能上各具作用。数据端：动捕和第一人称视频数据 等新数据源可规模化获取，不同数据类型在训练中的用途和比例因公司而异。 行业领先公司预计未来 2-3 年达到千万小时数据量，有望支撑行业达到 GPT-3 水平。当前阶段更需 观察模型和数据进步在具体落地应用中的实际效果。 2026 年 WRC 世界机器人大会规模扩大：300 多家参展商，150 个新产品发布；49 家国有企业组 团展示 12 个应用场景；国资委将牵头发布国有企业机器人创新联盟；将发布全球机器人应用探索 项目，推动海外商业模式探索。 语数科技今日上市首日股价表现强劲；后续仍有多家人形机器人和具身智能公司登陆资本市场，板 块关注度将维持高位，选股重要性突出。 供应链方面，大摩对头部企业绿地谐波、恒力液压保持乐观评级。 4.电力设备行业：思源电气中报业绩解读与三季度展望 思源电气上周五发布中报，本周一开盘涨停。实际业绩与 preliminary result 基本一致，利润增速 略低 1 个百分点，属正常范围。 亮点一：二季度单季收入增速 18.1%，利润增速 8%，增速较年初预期偏慢，但毛利率持续提升。 二季度单季毛利率回升至 31.6%（去年四季度 28%、今年一季度 29%、二季度 31.6%），连续两 个季度提升。 亮点二：销售、管理、研发费用率同比和环比持续下降，体现收入体量提升和海外业务发展带来的 经营杠杆效应。 汇兑影响可控：上半年汇兑损失约 8000 多万元（去年同期为汇兑收益），2026 年全年模型已反映 约 2 亿元汇兑损失，实际可控。 上半年开关业务毛利率持续提升至 39%，变压器等核心业务毛利率亦在提升。 三季度业绩前瞻：二季度交付的北美变压器订单（D 字头贸易条款，确认周期较长）未在二季度确 认收入，将在三季度确收，带动毛利率提升；去年获取的 750 千伏 GIS 订单部分已在二季度交付但 未确收，将延至三季度确认，三季度仍有超特高压等级 GIS 确认，预期三季度收入和毛利率均有较 好提升。 订单情况：2026 年全年订单增速目标 30%，上半年整体订单增速已超过 30%；国内订单增速 25%-30%；海外订单目标 50%，上半年远超 50%。高毛利区域（北美、欧洲、中东）订单结构比 例提升，变压器（更高毛利率）比例亦在提升。上半年订单增速、结构和国别组合的改善将直接支 撑 2027 年业绩。 大摩对思源电气全年利润预测超过 41 亿元，上半年经营情况为全年目标提供坚实基础，隐含下半 年利润增速将提升至 40%以上。思源电气仍为板块首选（Top Pick），当前股价回调后明年 PE 约 20 倍出头，估值在历史区间具有吸引力。 问答整理 Q1：关于社融数据，如何看待后续财政和货币政策的空间？ 答：当前政策取向是从过去大规模加码信贷转向关注存量资源优化和新增的合理平衡。财政端在梳理不 规范减税、合理化税收征管，本质是常年的、逐渐加码的财政刺激力度。短期看内需体感偏弱，但这是 从不可持续的高刺激向可持续的合理区间过渡的必经过程。海外都在加杠杆加大投资，中国正好利用外 需较好的窗口期消化内部风险、降低杠杆，长期对金融发展更有利。 Q2：银行板块的 ROE 趋势如何判断？ 答：在理性投放之后，价格逐渐趋稳，ROE 反而会更加稳健，我们看到更多板块的银行 ROE 在反弹。 全球都是类似情况——压制金融板块估值过久之后，市场发现对经济没有太多贡献；现在利率反弹，海 外贷款增速也在反弹。金融在合理盈利之下支持实体经济可持续长期发展的能力正在恢复。 Q3：油轮行业 2027 年供需测算的具体逻辑是什么？ 答：市场担心 2027 年订单全部交付带来 7%运力增长，但我们测算：第一，7%不是年初集中交付，平 均到全年运力影响约 4.5%-5%；第二，今年年初至今损失的原油库存若回补到危机前水平，将带来额 外 4%的需求增量。再加上正常消费需求每年增长 1 个百分点、运距拉长和额外补库存每年 2-3 个百分 点，2027 年行业供需仍偏紧，甚至可能延续到 2028 年。 Q4：伊朗制裁解除对油轮供给侧的冲击如何评估？ 答：参考委内瑞拉经验，战争结束后相关被制裁船舶并未被移除制裁。伊朗相关被制裁船舶的所有人并 不都是伊朗，涉及多国船东以及金融、保险、炼油链条，制裁解除不是简单一蹴而就的过程，预计相当 比例的伊朗相关黑船将拆解。若伊朗油回归合规市场而船不能全部回归，反而会造成供需错配，这是我 们预测的乐观情境，上行周期可能延续到 2028 年。 Q5：人形机器人行业当前处于什么发展阶段？ 答：行业仍处于相对早期，但发展快速。上半年全球出货 19000 台，同比增长 280%，中国占 97%。 行业关注重点已从硬件转向模型、数据和场景应用。模型端世界模型和 VLA 模型将共存，数据端动捕 和第一人称视频等新数据源在规模化应用。行业领先公司预计未来 2-3 年达到千万小时数据量，有望达 到 GPT-3 水平。当前更关键的是观察模型和数据进步在具体落地中的实际效果。 Q6：思源电气二季度毛利率提升的原因是什么？三季度能否延续？ 答：二季度毛利率提升至 31.6%，主要受益于产品结构优化和费用率下降。但二季度尚未开始确认更高 毛利的订单——北美变压器订单虽已交付但按 D 字头贸易条款需在三季度确收；750 千伏 GIS 订单部 分已在二季度交付但未确收，也将延至三季度确认。因此三季度收入和毛利率都会有较好提升，全年利 润预测超过 41 亿元，下半年利润增速预计提升至 40%以上。 原文 41052276771-1-192.mp4_原文 2026 年 08 月 19 日 发言人 各位上午好，今天是 8 月 19 号，欢迎来到摩根，是每周三的周期论剑的在线直播。我是张磊，Rachel, 汽车销量行业的分析师。今天的话我们讨论四个主题。一个的话是我们金融行业的首席徐然，会聊一下 他们对七月这个社融数据的解读，然后就是说这个行银行业的这个数据的中报有什么指引。然后第二是 我们交银行业的首席范倩蕾会聊一下，他们最近刚出了一个报告，关于邮轮动力将成为原油补库存的这 个瓶颈，景气周期会持续性或者超预期。我们工业行业的首席中盛会聊一下他们最近一个是参加了这个 世界世界机器人大会的，是一个是对这周的这个世界机器人大会的一个前瞻，以及他们最近对人形机器 人行业的一些进展的更新。然后最后的话，我们公用行业的公用事业行业的首席伊娃会聊一下他们最近 出的这个思源电期的一个中英报业绩的解读，以及对三季度的一个展望。开始之前的例行我需要读一个 disco。 发言人 请注意本次会议仅面向摩根大机构客户以及财务顾会议不对媒体开放。如果您来自会媒体的话，敬请退 出会议。另外提示一下大家，在整个会议的过程中，您可以随时在屏幕上发送您的问题。这样我们可以 节约一下这个 QNA 的等待的时间。好，我也不多说了，我把时间先交给 Richard。好的，感谢 Rachel。我们看到 7 月份的社融还是比较缓慢的这个也符合我们的一个预期，就是中国现在还是在从 几倍的刺激的力度，逐渐向我们认为比较可持续的一倍的刺激力度来过渡。最终这都会反映在社融的数 字里面，因为它包括了整体的贷款的一个情况，以及财政发债等等等的这些情况。 发言人 我们上次也说到过，就说在我们认为也 21 年之前，如果把这个美国金融危机之后四季度看作一倍，21 年之后，主要以之前都是以三倍的这个速度运行，那么 21 年到 24 年，大约是两倍。那么现在逐渐向 以备过度，所以大家的体感可能就是不但没有加码，可能还在收紧。主要就是可能原来的刺激不太可持 续，那么向着一个合理的一个区区间来去过渡。 发言人 从贷款的数据来看，这个整体零售还是比较差的。零售比较差也是在这个去杠杆的过程中，我们上次的 一些分析也有一个比较详细的一个数据。也就是说这个啊零售上杠杆从 20%的 GDP 上到 60 多，到从 09 年到 21 年。那么 21 年到 24 年是处在稳健。去年是第一年零售开始有去杠杆的趋势，今年可能会 加速去一些杠杆。主要的就是各种的对零售贷款的窗口指导终于都给取消，所以我们觉得这个去杠杆的 可能还得持续个两年左右的一个区间。现在可能降到了 59% 5，58、59，整个零售贷款比上 GDP 那逐 渐回升到回回回到这个 50，可能是是比较好的一个合理的一个区间，考虑到中国的这个人均 GDP 的比 例等等等等，我们觉得这个可能更加合理一些。 发言人 那么从整个的 North America Quantum Security - Changes to Encryption Technologies in a Post-Quantum World Along with our Global Technology Team's Insight di", "content": "M Update Cybersecurity / Networking | North America Quantum Security - Changes to Encryption Technologies in a Post-Quantum World Along with our Global Technology Team's Insight discussing hardware encryption technologies, we assess the cyber beneficiaries of a multi-year post-quantum migration, particularly on firewall vendors. While protection does not require a new firewall, likely to extend refresh cycle. Morgan Stanley & Co. LLC Meta A Marshall Equity Analyst Meta.Marshall@morganstanley.com +1 212 761-0430 Ryan Lountzis Equity Analyst Ryan.Lountzis@morganstanley.com +1 212 761-3189 Lucas Cerisola Research Associate Lucas.Cerisola@morganstanley.com +1 212 761-9194 Software North America Industry View Attractive Please see our Global Technology Team's Insight today: Hardware Quantum Security - Building Defenses for Q-Day and Beyond . Changes to encryption technologies needed in a post-quantum world . Modern cryptography relies on two broad approaches to secure data: 1) symmetric encryption and 2) asymmetric, or public-key, cryptography (see Disruption Decoded: The Rise of Quantum Networks for additional details). Symmetric encryption protects the underlying data, while public-key cryptography authenticates systems, exchanges keys and creates digital signatures. A sufficiently powerful quantum computer could break widely used forms of the second approach, including RSA and Elliptic-Curve Cryptography, which underpin much of today’s authentication, key exchange and digital signatures. No cryptographically relevant quantum computer exists today, but the migration clock has started: adversaries can collect long-lived encrypted data now for future decryption, while replacing vulnerable cryptography across networks, applications, devices and identities will take years. We will explore other changes to the cyber security space at a future date; this note is meant to outline key encryption point responses to a post-quantum world, which in many cases is a software upgrade, but in cases where performance lags ability to Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report.Key Takeaways While post-quantum security is a multi-year migration, Harvest-Now-Decrypt- Later risk and long lead times pull investment forward... ...with Network vendors sitting at key control points, driving demand for encryption discovery, quantum-safe connectivity and traffic inspection. We see PANW as best positioned, with the broadest current platform and clearest paid offering across network and identity. CSCO leads the next tier, while FTNT, ZS and CHKP have narrower shipping capabilities, with benefits skewing to retention, attach and refresh. While we have addressed mostly firewall vendors in this note, changes to encryption technologies introduce broader set of upgrades across cyber in coming years. August 17, 2026 08:07 PM GMT M Update 2perform post-quantum encryption, can involve a firewall upgrade. Doesn’t always require a new firewall, but if older, will require investment – which we are seeing today . Ahead of quantum computers, customers need to make sure that where their encryption is done (typically the firewall), is equipped for post-quantum cryptography (PQC) or hybrid post-quantum key exchange. Not every legacy firewall will be able to install this with a software upgrade or has the performance for the new encryption technologies. In these cases, the firewall would need nd upgrade activity more than a separately disclosed quantum-security revenue stream. From an Identity Security perspective, vendors are largely approaching a post- quantum world through the lens of machine identity, certificate management and non-human identity governance . The CA/Browser Forum has approved a phased reduction in maximum publicly trusted Transport Layer Security certificate validity from 398 days to 47 days by March 2029, reinforcing the need to automate certificate issuance, renewal and replacement as cryptographic standards evolve. Palo Alto Networks (CyberArk) is extending its post-quantum capabilities, combining certificate lifecycle management, Public Key Infrastructure, code signing and post-quantum testing with secrets, privileged-access controls and Palo Alto’s network visibility and enforcement. SailPoint fits through Machine Identity Security, which discovers and governs service accounts, bots and robotic-process-automation identities, assigns ownership and automates lifecycle controls and access 8XqVlUNApZoRtMrO9PdNbRsQqQsQpRkPoOwOjMrQwObRnMrPxNsOoQNZpOzR M Update Morgan Stanley Research 3certifications; its role is more focused on governance and reducing long-lived credential risk than implementing Post-Quantum Cryptography directly. Okta is addressing both active quantum workloads, which rely on non-human identities, and the longer-term cryptographic transition, with a two-phase roadmap centered on hybrid key exchange across its edge and federation layers followed by Post- Quantum Cryptography support across the Okta Integration Network and administrative tooling. As a result, identity vendors should become increasingly important in discovering non-human identities, replacing long-lived credentials, reissuing certificates and enforcing access policies, although Palo Alto Networks through CyberArk and Venafi currently has the most direct exposure to certificate and post-quantum migration. Exhibit 1:PANW Screens Broadest Across Publicly D
