s role is helping customers identify which machine identities exist, who owns them and what they can M Update Morgan Stanley Research 7access, rather than im", "status": "extracted"}, "post:2026-08-19T14-28:4d00b1b8a108": {"id": "post:2026-08-19T14-28:4d00b1b8a108", "kind": "post", "title": "2026-08-19 14:28", "source_label": "帖子正文", "excerpt": "A股、韩股、美股半导体，构成了一个无法预测的三体系统。美股是主恒星，负责释放AI叙事和订单引力", "content": "A股、韩股、美股半导体，构成了一个无法预测的三体系统。 美股是主恒星，负责释放AI叙事和订单引力； 韩股是周期星，负责把需求变成HBM、DRAM和资本开支； A股是神秘天体，利润不一定看得见，但任何波动都可以解释成国产替代。 三者最复杂的地方，不是一起涨跌，而是互相提前交易、互相错误理解。 美股大涨，韩股开始交易存储涨价，A股开始交易设备扩产。 韩股宣布扩产，美股担心供给过剩，A股却觉得设备订单要来了。 A股突然涨停，美股投资者又开始研究：中国半导体是不是实现了重大突破？ 同一个AI需求增长： 美股理解为利润还要上调； 韩股理解为必须赶紧扩产； A股理解为自主可控迫在眉睫。 等韩股真的扩产： 韩股开始担心周期见顶； 美股开始担心毛利率下降； A股继续庆祝设备和材料受益。 于是形成了最经典的半导体三体运动： 美股负责创造需求，韩股负责过度供给，A股负责提前庆祝。 三个市场不断互相验证，又不断互相证伪。 美股涨，证明AI需求强； 韩股涨，证明存储景气高； A股涨，证明国产替代快。 但当三地终于同时看多时，往往说明所有人都已经买完了。 所以半导体市场真正的黑暗森林法则是： 三个市场意见不统一时，行情还能继续；三个市场达成共识时，周期通常准备反转。#文字观点", "publish_time": "2026-08-19 14:28", "tags": ["文字观点"]}, "post:2026-08-19T19-18:2f9f3df31133": {"id": "post:2026-08-19T19-18:2f9f3df31133", "kind": "post", "title": "2026-08-19 19:18", "source_label": "帖子正文", "excerpt": "聊一下市场热议的超长端美债利率的问题： 首先是超长端利率上行可能的三个原因： 1）财政问题：全球国债利率都在上，抛售债券的共振交易，美国赤字率这两个月快到6%，日本、欧洲的财政问题也是继续发酵；2）通胀和货币政策的不确定性：伊朗和谈没有下文，市场担忧油价中枢永久性抬升造成长期通胀压力", "content": "聊一下市场热议的超长端美债利率的问题： 首先是超长端利率上行可能的三个原因： 1）财政问题：全球国债利率都在上，抛售债券的共振交易，美国赤字率这两个月快到6%，日本、欧洲的财政问题也是继续发酵； 2）通胀和货币政策的不确定性：伊朗和谈没有下文，市场担忧油价中枢永久性抬升造成长期通胀压力；同时沃什不给前瞻指引，市场反复在宽松交易和紧缩交易之间横跳，结果就是长端利率的不确定性溢价； 3）AI的影响：一方面是AI抬升了中性利率，另一方面是AI大厂发债挤出了国债（大厂信用等级接近国债，确实会有挤占效应）。 三个因素很难去说谁主导，同时这些问题除了2），1和3都是无解的。2除非沃什改变他的说话风格，否则也很难有转机。 美债利率往下走，比较现实的条件是美股跌，就像昨晚发生的那样。这也意味着：美股和美债利率是互为影响的均衡关系，并不是谁决定谁，我不认为美股跌是因为超长端利率太高，这里根本就没有理论上的作用机制。 美债利率的上限在哪？后续超长端利率继续向上走的概率更大，有点牺牲超长端换取10Y利率稳定的感觉。1和2因素的缓解都要靠政策的巨大转向，但现在看不到曙光。所以目前3是限制利率的唯一因素，也就是说当利率对科技（美股）开始有压制了，就是看到上限了。当美股的分子端足够强以至于能够再度走高，那利率的上限又会被打开，这也是前面说的均衡关系。 P.S.市场一大跌就习惯性找宏观分析师，然后宏观分析师一看，这两天最大的变化又只有超长端美债利率新高，但问题是超长端美债利率没有让股票大跌的机制（不像美元、2Y和10Y美债），说白了还是找个借口，给情绪或者筹码买单 国泰海通宏观 张剑宇#文字观点", "publish_time": "2026-08-19 19:18", "tags": ["文字观点"]}, "post:2026-08-19T23-49:ba6adc9ea537": {"id": "post:2026-08-19T23-49:ba6adc9ea537", "kind": "post", "title": "2026-08-19 23:49", "source_label": "帖子正文", "excerpt": "【招商电新】亿纬锂能26年中报点评-20260819# 公司发布中报、业绩超市场预期。26H1实现营收、归母净利润、扣非归母净利润分别456.91、33.01、24.51亿元，同比增长62%、106%、112%。", "content": "【招商电新】亿纬锂能26年中报点评-20260819# 公司发布中报、业绩超市场预期。 26H1实现营收、归母净利润、扣非归母净利润分别456.91、33.01、24.51亿元，同比增长62%、106%、112%。销售费率0.9%，同比-0.4pct，管理费率2.9%，同比-2.3pct，成本管控良好。26Q2单季营收250.12亿元，同、环比增长63%、21%；归母净利润18.55亿元，同、环比增长268%、28%，业绩位于预告区间中枢偏上位置。# 超预期在于：商用车动力电池高增、海外储能进展顺利 1）动力电池： 收入172.78亿元，同比+53.31%，毛利率16.19%，同比-2.97pct。上半年出货35.76GWh，同比+66.47%。46系列大圆柱电池率先量产，商用车动力电池高速增长，成为核心增长极。商用车在手订单显示 2027 年同比增长至少 50% 以上。 2）储能电池： 收入150.94亿元，同比+69.15%，毛利率12.51%，同比-1.36pct。上半年出货44.46GWh，同比+54.88%。628Ah Mr.Big超大容量电芯产能陆续释放。 3）消费电池： 收入64.11亿元，同比+26.22%，毛利率22.64%，同比-4.04pct。毛利率下滑主要因马来西亚小圆柱工厂处于产能爬坡与审厂验证期，产线折旧与人工费用拉低短期盈利，预计下半年恢复正常盈利水平。 4）电池材料： 收入68.66亿元，同比+140.73%，毛利率5.29%，同比+2.30pct，为上游投资对应的包销转销业务，利润贡献稳定。 #公司26年出货目标维持200GWh（动力/储能各100GWh），27年整体出货目标同比增长50%以上。#电池消费税传导情况良好。公司政策新增成本需向下传导，具体可根据长期合作协商分担比例，整体进度受控，70% 以上客户已谈妥。# 成本上涨影响可控。公司通过原材料套保、供应链长协、提升产能利用率对冲成本上涨；同时优化客户结构与出货结构，推动盈利能力持续修复。# 27年储能海外占比有望提升至近50%。 2026年储能海外交付占比约20%，当前2-3家核心海外客户合计需求已超2027年储能总交付量的40%，盈利能力有望提升。大铁锂电芯占比持续提升，大储景气度持续验证。# BBU产品26H2开始正式交付，海内外客户均有覆盖，当前受限于21700产能。2027年Q2公司21700全极耳电芯产能将达6.3亿颗，需求旺盛。 预计公司26/27年利润80亿元/110亿元，当前市值对应PE15x/11x，继续推荐！#文字观点", "publish_time": "2026-08-19 23:49", "tags": ["文字观点"]}, "attachment:files/蔚蓝锂芯20260818.pdf": {"id": "attachment:files/蔚蓝锂芯20260818.pdf", "kind": "attachment", "title": "蔚蓝锂芯20260818", "source_label": "其他", "excerpt": "ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª", "content": "ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª ÖªÊ¶ÐÇÇò£ºÐ¡Å£ÑÐ±¨¼ÍÒª", "status": "extracted"}, "post:2026-08-19T15-24:3b0edad9b63d": {"id": "post:2026-08-19T15-24:3b0edad9b63d", "kind": "post", "title": "2026-08-19 15:24", "source_label": "帖子正文", "excerpt": "【小米新一代人形机器人剧透！双足、1.7米左右、全身66个自由度】 8月19日下午，记者从小米方面了解到，小米即将首次展示的下一代人形机器人身高约为1.7米，体重66公斤，全身有66个自由度，其中一半自由度集中在手部。", "content": "【小米新一代人形机器人剧透！双足、1.7米左右、全身66个自由度】 8月19日下午，记者从小米方面了解到，小米即将首次展示的下一代人形机器人身高约为1.7米，体重66公斤，全身有66个自由度，其中一半自由度集中在手部。目前，该款机器人为样机阶段，国内首展后会在欧洲展出。2022年，小米发布全尺寸人形机器人“铁大”，比特斯拉Optimus原型机亮相早了近两个月。铁大身高1.77米，体重52公斤，拥有21个关节自由度。此后小米少有机器人方面的消息露出。（每日经济新闻）#文字观点", "publish_time": "2026-08-19 15:24", "tags": ["文字观点"]}, "attachment:files/威尔高中报业绩交流20260818.pdf": {"id": "attachment:files/威尔高中报业绩交流20260818.pdf", "kind": "attachment", "title": "威尔高中报业绩交流20260818", "source_label": "其他", "excerpt": "大摩闭门会：金融、机器人、电力设备及交运行业更新 20260819 要点总结 1.金融行业：7 月社融数据与银行业中报解读 7 月社融数据偏弱符合预期，反映中国正从过去数倍刺激力度向可持续的一倍刺激力度过渡。2010 年前后（美国金融危机后）为 1 倍刺激，2010-2021 年约 3 倍，2021-2024 年约 2 倍，目前正逐 步向 1 倍回归，体感", "content": "大摩闭门会：金融、机器人、电力设备及交运行业更新 20260819 要点总结 1.金融行业：7 月社融数据与银行业中报解读 7 月社融数据偏弱符合预期，反映中国正从过去数倍刺激力度向可持续的一倍刺激力度过渡。2010 年前后（美国金融危机后）为 1 倍刺激，2010-2021 年约 3 倍，2021-2024 年约 2 倍，目前正逐 步向 1 倍回归，体感上政策未加码甚至边际收紧。 零售贷款持续偏弱，主因去杠杆进程。居民零售贷款占 GDP 比重从 2009 年的 20%升至 2021 年 的 60%以上，2024 年为去杠杆第一年，今年可能加速。预计去杠杆还需持续约两年，当前零售贷 款/GDP 已降至 58%-59%，合理区间或为 50%左右。 财政端在“反内卷”目标下梳理不规范减税，包括地方政府违规税收优惠及个人所得税征缴（中国 实际个人所得税率低于 2%，全球偏低），本质是财政刺激从增量扩张转向存量优化。 海外国债利率上行反映多年财政刺激后债务偿还压力，中国更关注可持续增长，短期阵痛可容忍， 长期更可持续。 从支付数据看，居民实际消费支付规模约 60-70 万亿元，远超官方统计的 50 万亿元，居民消费占 GDP 比例并不低于欧洲、日本、韩国，内需不足更多是前期过度透支的结果（住房面积、空调保有 量等均居世界前列）。 银行二季度息差环比、同比均小幅改善，推动净利息收入同比增长 9.5%；非利息收入因去年高基 数有所下滑；PPOP 增速约 6%；利润增速持续反弹，国有大行利润增速从一季度 1%回升至二季度 4%以上。 股份制银行分化：行业整体利润增速为-8%，但头部银行（兴业、招商、浦发、平安、中信）预计 为正或零附近，部分北部股份制银行仍在消化风险。 城商行不良生成已有所改善，前几年快速出清风险后今年不良相对稳定；零售和普惠领域仍在消化 前期过度投放形成的不良。近七八年每年不良消化规模约 3-4 万亿元，属稳定消化。 资本市场活跃度提升，IPO 恢复，金融行业在去杠杆背景下回到不需依赖高杠杆的可持续发展路 径，ROE 趋于稳健并出现反弹。 2.交运行业：油轮运力瓶颈与景气周期持续性 市场普遍认为油轮周期顶点在 2026 年（霍尔木兹海峡重开即见顶），但大摩认为 2027 年盈利可 能优于 2026 年，周期仍将向上，主要受需求侧和供给侧两个新变化驱动。 需求侧：海峡关闭持续时间超预期，全球原油库存持续下降。今年海峡关闭每月影响全球海运量年 化约 12 个百分点（二季度数据），即便海峡很快重开，缺失库存需在明年回补，补库急迫性随关 闭时间延长而上升。 供给侧：虽然需求年化减少 10-15 个百分点，但实际被关在海峡内的船仅占供给的 5%-6%，市场 处于供给过剩状态。但运价在回调至 10 万美元/天 TCE 附近有较强支撑。 运价支撑原因一：中东政治不确定性导致航线选择、目的地选择和运力调配出现摩擦性损耗，消耗 有效运力，再平衡了供需。 运价支撑原因二：船东议价能力大幅增强，行业前三名 VLCC 船东控制的份额较 2025 年初接近翻 倍（已剔除不合规船舶影响），防止了运价非理性下跌。 市场担忧 2027 年供给过剩的逻辑：2027 年订单全部交付将带来 7%运力增长。但大摩测算：① 7%并非年初集中交付，全年平均运力影响仅 4.5%-5%；② 今年损失的原油库存若回补至危机前水 平，将带来额外 4%需求增量。 大摩近期提出“亚洲能源安全”主题，带来两个需求增量：① 亚洲国家每增加一个月消费量的库 存，全球油运需求增加约 6%（预计 3-4 年完成）；② 亚洲国家将部分原油进口从中东切换至美国 （预计概率较高），每 5%来源切换拉动需求增长近 6 个百分点。 综合看：正常消费需求每年增长 1 个百分点 + 补 2026 年缺失库存 4 个百分点 + 运距及额外补库 存每年 2-3 个百分点，2027 年行业供需仍偏紧，紧张局面可能延续至 2028 年。 关于伊朗制裁解除的担忧：参考委内瑞拉经验，制裁解除后相关被制裁船舶并未被移除制裁；伊朗 相关船舶所有人涉及多国，牵涉金融、保险、炼油链条，制裁解除非一蹴而就，预计相当比例伊朗 相关“黑船”将拆解。若伊朗油回归合规市场而船不能全部回归，市场将出现供需错配，上行周期 可能延续至 2028 年（乐观情境）。 敏感性测算：每 1 美元运输成本上升，可带来两家公司（招商轮船、中远海能）2027 年盈利预测 上调 15%-35%（中东线和美线影响不同）。大摩近期提出“炼厂黄金时代”主题，炼厂对运输成 本上升相对不敏感，更急迫获取原油，对运价和盈利形成正向推动。 大摩已大幅上调招商轮船和中远海能 2027 年盈利预测，显著高于外资一致预期。若市场形成周期 延续至 2027-2028 年的共识，行业盈利和估值均有上调空间（海能港股隐含分红收益率水平反映 市场对周期方向不确定）。 3.工业行业：人形机器人行业进展与 WRC 前瞻 2026 年上半年全球人形机器人出货量 19000 台，同比增长 280%；中国占比 97%。用途上 65%集 中于娱乐教育、研发和数据采集等偏服务/研发类场景。 应用场景正向工业及商业服务扩展，包括搬运、上下料、分拣、检测、插拔、装配等，均处于训练 验证阶段。预计今年下半年将看到商业场景中小规模落地。 2026 年全年中国市场出货量预期至少 5 万台；2030 年预期接近 50 万台，年均复合增速接近 100%。 行业关注重点已从硬件转向模型、数据及场景应用。硬件方面灵巧手受高度重视（对灵巧操作至关 重要）。 模型端：世界模型与 VLA 模型将共存，在不同功能上各具作用。数据端：动捕和第一人称视频数据 等新数据源可规模化获取，不同数据类型在训练中的用途和比例因公司而异。 行业领先公司预计未来 2-3 年达到千万小时数据量，有望支撑行业达到 GPT-3 水平。当前阶段更需 观察模型和数据进步在具体落地应用中的实际效果。 2026 年 WRC 世界机器人大会规模扩大：300 多家参展商，150 个新产品发布；49 家国有企业组 团展示 12 个应用场景；国资委将牵头发布国有企业机器人创新联盟；将发布全球机器人应用探索 项目，推动海外商业模式探索。 语数科技今日上市首日股价表现强劲；后续仍有多家人形机器人和具身智能公司登陆资本市场，板 块关注度将维持高位，选股重要性突出。 供应链方面，大摩对头部企业绿地谐波、恒力液压保持乐观评级。 4.电力设备行业：思源电气中报业绩解读与三季度展望 思源电气上周五发布中报，本周一开盘涨停。实际业绩与 preliminary result 基本一致，利润增速 略低 1 个百分点，属正常范围。 亮点一：二季度单季收入增速 18.1%，利润增速 8%，增速较年初预期偏慢，但毛利率持续提升。 二季度单季毛利率回升至 31.6%（去年四季度 28%、今年一季度 29%、二季度 31.6%），连续两 个季度提升。 亮点二：销售、管理、研发费用率同比和环比持续下降，体现收入体量提升和海外业务发展带来的 经营杠杆效应。 汇兑影响可控：上半年汇兑损失约 8000 多万元（去年同期为汇兑收益），2026 年全年模型已反映 约 2 亿元汇兑损失，实际可控。 上半年开关业务毛利率持续提升至 39%，变压器等核心业务毛利率亦在提升。 三季度业绩前瞻：二季度交付的北美变压器订单（D 字头贸易条款，确认周期较长）未在二季度确 认收入，将在三季度确收，带动毛利率提升；去年获取的 750 千伏 GIS 订单部分已在二季度交付但 未确收，将延至三季度确认，三季度仍有超特高压等级 GIS 确认，预期三季度收入和毛利率均有较 好提升。 订单情况：2026 年全年订单增速目标 30%，上半年整体订单增速已超过 30%；国内订单增速 25%-30%；海外订单目标 50%，上半年远超 50%。高毛利区域（北美、欧洲、中东）订单结构比 例提升，变压器（更高毛利率）比例亦在提升。上半年订单增速、结构和国别组合的改善将直接支 撑 2027 年业绩。 大摩对思源电气全年利润预测超过 41 亿元，上半年经营情况为全年目标提供坚实基础，隐含下半 年利润增速将提升至 40%以上。思源电气仍为板块首选（Top Pick），当前股价回调后明年 PE 约 20 倍出头，估值在历史区间具有吸引力。 问答整理 Q1：关于社融数据，如何看待后续财政和货币政策的空间？ 答：当前政策取向是从过去大规模加码信贷转向关注存量资源优化和新增的合理平衡。财政端在梳理不 规范减税、合理化税收征管，本质是常年的、逐渐加码的财政刺激力度。短期看内需体感偏弱，但这是 从不可持续的高刺激向可持续的合理区间过渡的必经过程。海外都在加杠杆加大投资，中国正好利用外 需较好的窗口期消化内部风险、降低杠杆，长期对金融发展更有利。 Q2：银行板块的 ROE 趋势如何判断？ 答：在理性投放之后，价格逐渐趋稳，ROE 反而会更加稳健，我们看到更多板块的银行 ROE 在反弹。 全球都是类似情况——压制金融板块估值过久之后，市场发现对经济没有太多贡献；现在利率反弹，海 外贷款增速也在反弹。金融在合理盈利之下支持实体经济可持续长期发展的能力正在恢复。 Q3：油轮行业 2027 年供需测算的具体逻辑是什么？ 答：市场担心 2027 年订单全部交付带来 7%运力增长，但我们测算：第一，7%不是年初集中交付，平 均到全年运力影响约 4.5%-5%；第二，今年年初至今损失的原油库存若回补到危机前水平，将带来额 外 4%的需求增量。再加上正常消费需求每年增长 1 个百分点、运距拉长和额外补库存每年 2-3 个百分 点，2027 年行业供需仍偏紧，甚至可能延续到 2028 年。 Q4：伊朗制裁解除对油轮供给侧的冲击如何评估？ 答：参考委内瑞拉经验，战争结束后相关被制裁船舶并未被移除制裁。伊朗相关被制裁船舶的所有人并 不都是伊朗，涉及多国船东以及金融、保险、炼油链条，制裁解除不是简单一蹴而就的过程，预计相当 比例的伊朗相关黑船将拆解。若伊朗油回归合规市场而船不能全部回归，反而会造成供需错配，这是我 们预测的乐观情境，上行周期可能延续到 2028 年。 Q5：人形机器人行业当前处于什么发展阶段？ 答：行业仍处于相对早期，但发展快速。上半年全球出货 19000 台，同比增长 280%，中国占 97%。 行业关注重点已从硬件转向模型、数据和场景应用。模型端世界模型和 VLA 模型将共存，数据端动捕 和第一人称视频等新数据源在规模化应用。行业领先公司预计未来 2-3 年达到千万小时数据量，有望达 到 GPT-3 水平。当前更关键的是观察模型和数据进步在具体落地中的实际效果。 Q6：思源电气二季度毛利率提升的原因是什么？三季度能否延续？ 答：二季度毛利率提升至 31.6%，主要受益于产品结构优化和费用率下降。但二季度尚未开始确认更高 毛利的订单——北美变压器订单虽已交付但按 D 字头贸易条款需在三季度确收；750 千伏 GIS 订单部 分已在二季度交付但未确收，也将延至三季度确认。因此三季度收入和毛利率都会有较好提升，全年利 润预测超过 41 亿元，下半年利润增速预计提升至 40%以上。 原文 41052276771-1-192.mp4_原文 2026 年 08 月 19 日 发言人 各位上午好，今天是 8 月 19 号，欢迎来到摩根，是每周三的周期论剑的在线直播。我是张磊，Rachel, 汽车销量行业的分析师。今天的话我们讨论四个主题。一个的话是我们金融行业的首席徐然，会聊一下 他们对七月这个社融数据的解读，然后就是说这个行银行业的这个数据的中报有什么指引。然后第二是 我们交银行业的首席范倩蕾会聊一下，他们最近刚出了一个报告，关于邮轮动力将成为原油补库存的这 个瓶颈，景气周期会持续性或者超预期。我们工业行业的首席中盛会聊一下他们最近一个是参加了这个 世界世界机器人大会的，是一个是对这周的这个世界机器人大会的一个前瞻，以及他们最近对人形机器 人行业的一些进展的更新。然后最后的话，我们公用行业的公用事业行业的首席伊娃会聊一下他们最近 出的这个思源电期的一个中英报业绩的解读，以及对三季度的一个展望。开始之 得圆满成功。🔹【中国商业火箭取得又一关键里程碑】继长征十号乙", "content": "🚀【华创计算机】火箭回收，商业航天取得关键里程碑 🔹8月19日07时35分朱雀三号遥二运载火箭在东风商业航天创新试验区发射升空，运载火箭全程飞行正常，一子级成功着陆于回收场预定位置，二子级将搭载的鸿鹄03星，顺利送入预定轨道，飞行试验任务取得圆满成功。 🔹【中国商业火箭取得又一关键里程碑】继长征十号乙海上平台回收成功后，朱雀三号成为了我国首款成功入轨并实现陆地回收的运载火箭。 🔹【商业火箭复用加速度】1）此次发射是朱雀三号由回收技术验证开始进入工程化复用验证阶段的重要飞行试验。2）按照计划，长征十号乙也有望在2026年底前进行一子级复用飞行。3）火箭回收有望带动太空运载的单位成本下降与发射频数的提升，从小批量到常态化、规模化发射有望迎来从“0”到“1”的突破。 🔹【商业航天密集组网发射】截至2026年7月5日，千帆星座累积发射200余颗，目标规划2030年1.5万颗卫星组网；星网发射组网进一步提速，总规划12992颗。 🔹【卫星应用稳步推进】手机直连卫星、机载互联网、船载与海洋通信和电力信息化等场景正牵引卫星互联网商业化应用落地。通、导、遥、算卫星一体化成为趋势，商业航天未来有望充分赋能智能化无人化生产生活场景。 🔹建议关注：1）卫星制造：紫光国微、中国卫星、信科移动、航天电子、国博电子等；2）卫星运营：中国卫通；3）火箭发射：高华科技等；4）卫星应用：海格通信、华测导航、北斗星通、震有科技、华力创通、盟升电子等。 🔹风险提示：技术创新风险；政策变化风险；市场竞争加剧等。 🔹联系：华创计算机 祝小茜/吴鸣远#文字观点", "publish_time": "2026-08-19 09:34", "tags": ["文字观点"]}, "post:2026-08-19T10-43:d899e383c2fa": {"id": "post:2026-08-19T10-43:d899e383c2fa", "kind": "post", "title": "2026-08-19 10:43", "source_label": "帖子正文", "excerpt": "🌎【中泰机械 | 商业航天】朱雀三陆地成功回收，民营商业航天的里程碑 📈8月19日早，朱雀三号遥二火箭顺利完成发射任务，一子级依托着陆腿、反推减速实现陆上垂直VTVL精准着陆，成功对标SpaceX猎鹰9成熟回收技术路线。🚀民营火箭首次入轨+一子级陆地完整回收闭环。", "content": "🌎【中泰机械 | 商业航天】朱雀三陆地成功回收，民营商业航天的里程碑 📈8月19日早，朱雀三号遥二火箭顺利完成发射任务，一子级依托着陆腿、反推减速实现陆上垂直VTVL精准着陆，成功对标SpaceX猎鹰9成熟回收技术路线。 🚀民营火箭首次入轨+一子级陆地完整回收闭环。#标志我国民营可回收火箭完成全流程工程验证，有望迈入商业化高频发射阶段。充分验证了蓝箭航天不锈钢箭体、液氧甲烷发动机全套自研体系的可靠性。该火箭主打极致降本、高频发射，适配低轨卫星星座商业订单，依托液氧甲烷动力+不锈钢箭体设计，目标复用次数≥20次，周转效率高、发射成本优势显著，且内陆发射调度灵活。 🔥民营陆地垂直回收+国家队海上网捕回收，双路线形成并行格局。1️⃣朱雀三号走猎鹰 9 成熟的陆地垂直着陆路线，复刻全球主流商业复用路径；2️⃣长十乙开创海上网系回收模式，适配文昌发射场大吨位国家任务，差异化优势突出。国内卫星组网长期受制于火箭供给不足、发射成本偏高的短板。#国家队大吨位火箭+民营商业化火箭形成互补，全面支撑大规模星座组网，助力我国抢占全球频轨资源。运力层面，朱雀三号与长十乙回收工况运力正大幅缩小与猎鹰 9 的差距。 🎁后续复飞催化，倘若成功代表可回收闭环跑通。1️⃣朱雀三号遥二完成陆地回收后，计划2026年Q4开展首次回收箭复用飞行；2️⃣长十乙同步推进回收一子级检修测试，验证海上网捕路线的复用可行性。 🌹重点关注：1️⃣火箭：超捷股份、江顺科技、飞沃科技、华曙高科；2️⃣卫星：西测测试、信科移动、信维通信；3️⃣光伏：钧达股份、宇晶股份、迈为股份；4️⃣股权：金风科技、鲁信创投 ⚡️风险提示：产业进展不及预期 💼联系人：中泰机械王子杰 邢博阳#文字观点", "publish_time": "2026-08-19 10:43", "tags": ["文字观点"]}, "attachment:files/瑞银证券-卫星化学-002648-受益于化工价格上涨，二季度单季净利润创历史新高.pdf": {"id": "attachment:files/瑞银证券-卫星化学-002648-受益于化工价格上涨，二季度单季净利润创历史新高.pdf cli>今天出现的催化/验证：天孚通信半年报收入29.27亿元（+15.16%）、归母净利润12.04亿元（+33.92%）；Keysight 26Q3业绩、订单、指引均超预期；优利德有望成为国内第二家推出1.6T（65G）光模块采样示波器；花旗更新天孚通信Model。\u003c/li>\n\u003cli>来源：07:20天风通信帖子；10:27广发机械帖子；09:28优利德帖子；中原证券月报附件；花旗-天孚通信Model附件。\u003c/li>\n\u003c/ul>\n\u003ch3>主线6：宏观/策略——长端美债利率新高，全球风险偏好回落\u003c/h3>\n\u003cul>\n\u003cli>今天强化的逻辑：30年期美债收益率冲上5.33%、2002年以来新高，10年期触及4.75%附近；全球国债利率共振上行，美国赤字率这两个月快到6%；伊朗和谈无下文，市场担忧油价中枢永久性抬升造成长期通胀压力。\u003c/li>\n\u003cli>今天出现的催化/验证：亚洲股市录得三周以来最差单日表现；高盛动量多空配对策略今日下跌约8%（半导体板块-6.5%与软件板块+1%反向驱动）；AI大跌点评称“Anthropic ARR二阶导放缓+30年期美债利率创新高”带来恐慌抛售。\u003c/li>\n\u003cli>来源：07:21恐慌指标帖子；19:18超长端美债讨论帖子；08:14美股盘后点评帖子；17:17交易台帖子；13:39AI大跌点评帖子。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>宇树科技上市首日大涨460.34%、市值3418亿元，上市首日流通盘仅7%（来源：20:04东北计算机帖子；10:27华创机械帖子）。\u003c/li>\n\u003cli>朱雀三号遥二发射成功并完成一子级陆地回收，我国首次实现火箭陆地回收（来源：09:33、09:34多篇商业航天帖子）。\u003c/li>\n\u003cli>大摩发布存储预测：Q3成熟制程DRAM可能涨价50%，Q4再涨10%（来源：17:17财联社帖子）。\u003c/li>\n\u003cli>Anthropic向投资人披露7月末年化收入超650亿美元，较5月470亿美元继续增长；OpenAI被报道二季度营收环比增长18%、增长乏力不及Anthropic（来源：13:17帖子；08:14帖子）。\u003c/li>\n\u003cli>美股三大指数集体收跌、纳指跌1.33%，30年期美债收益率冲上5.33%，全球芯片股遭抛售（来源：08:14帖子；07:21帖子）。\u003c/li>\n\u003cli>GLM-5.3 API于8月19日起正式上线，定价不变（来源：12:29中信计算机帖子）。\u003c/li>\n\u003cli>小米剧透下一代人形机器人：身高约1.7米、体重66公斤、全身66个自由度，一半集中在手部（来源：15:24帖子）。\u003c/li>\n\u003cli>多家公司中报发布：天孚通信、兆易创新、精智达、湖南裕能、亿纬锂能等（来源：07:20、08:27、08:28、23:14、23:49帖子）。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>英伟达业绩前瞻：Rubin发布前已现强劲增长，关注业绩与指引兑现（来源：MS-半导体周报英伟达业绩前瞻-20260817附件）。\u003c/li>\n\u003cli>GLM-5.3上线后国模ARR边际变化及Coding外行业渗透进展（来源：12:29中信计算机帖子）。\u003c/li>\n\u003cli>宇树上市后筹码稀缺下的走势演变、世界机器人大会及世界人形机器人运动会催化密集度（来源：10:27华创机械帖子；07:23概念股梳理帖子）。\u003c/li>\n\u003cli>长存控股IPO辅导状态变更为辅导验收后的后续进展（来源：20:04东北计算机帖子）。\u003c/li>\n\u003cli>Q3成熟制程DRAM涨价50%的实际落地与产业链业绩传导（来源：17:17帖子；08:27存储业绩帖子）。\u003c/li>\n\u003cli>优利德1.6T（65G）光模块采样示波器样机推出及年底前小批量订单进展（来源：09:28帖子）。\u003c/li>\n\u003cli>PCB原料供应吃紧背景下H2涨价落地幅度与载板厂调价空间（来源：09:32帖子）。\u003c/l document.getElementById('stats').innerHTML=Object.entries(bundle.summary||{}).map(([k,v])=>'<div class="stat"><span class="meta">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');

function openDetail(id){const item=details[id]||{}, evidence=item.evidence||[];document.getElementById('detail-title').textContent=item.title||'详情';document.getElementById('detail-body').innerHTML='<div class="card"><p>'+esc(item.summary||item.logic||'')+'</p>'+list(item.support_points)+list(item.catalysts)+'</div>'+evidence.map(ref=>{const source=sources[ref.id]||ref;return '<div class="source"><div class="label">'+esc(source.kind||'source')+'</div><h3>'+esc(source.title)+'</h3><p>'+esc(source.excerpt||source.content||'')+'</p></div>'}).join('');const detail=document.getElementById('detail');detail.classList.add('visible');detail.scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('visible')}
document.getElementById('rendered-report').innerHTML=data.report_html||'';
</script></body></html>
