，安全/可观测性下半年升至高个位数，服务改善至", "content": "", "publish_time": "2026-09-30 12:30", "tags": ["文字观点"]}, "attachment:files/JPM-硬件与网络设备行业：2026年美国全明星大会要点总结.pdf": {"id": "attachment:files/JPM-硬件与网络设备行业：2026年美国全明星大会要点总结.pdf", "kind": "attachment", "title": "JPM-硬件与网络设备行业：2026年美国全明星大会要点总结", "source_label": "JPM", "excerpt": "North America Equity Research 28 September 2026 J P M O R G A N IT Hardware/ Telecom & Networking Equipment Joseph Cardoso AC (1-212) 622-9036 joseph.cardoso@jpmchase.com Manmohanp", "content": "", "status": "extracted"}, "attachment:files/中信建投-医疗器械行业周报-260928.pdf": {"id": "attachment:files/中信建投-医疗器械行业周报-260928.pdf", "kind": "attachment", "title": "中信建投-医疗器械行业周报-260928", "source_label": "中信建投", "excerpt": "医疗器械行业周报 发布日期：2026年9月28日", "content": "", "status": "extracted"}}, "source_details": {"post:2026-09-30T11-09:75c26e92cac9": {"id": "post:2026-09-30T11-09:75c26e92cac9", "kind": "post", "title": "2026-09-30 11:09", "source_label": "帖子正文", "excerpt": "20260930_建议领导重点关注国产CPU的产业弹性agent迭代带来CPU需求：9月以来，国内Agent产品密集迭代：字节发布飞书8.0 for Agent，支持智能体进入群聊协作，并升级豆包工作；腾讯WorkBuddy上线开放平台，引入超百家生态伙伴", "content": "20260930_建议领导重点关注国产CPU的产业弹性agent迭代带来CPU需求：9月以来，国内Agent产品密集迭代：字节发布飞书8.0 for Agent，支持智能体进入群聊协作，并升级豆包工作；腾讯WorkBuddy上线开放平台，引入超百家生态伙伴；阿里千问办公推出“企业上下文”，帮助智能体调用企业数据、参与业务流程。9月28日，Manus发布2.0及个人智能体应用Cue，并表示正筹备国内版本。大厂布局正从对话助手转向可协作、可执行的智能体。#参考Meta旗下muse发布后INTEL、AMD大涨-我们认为agent迭代对CPU需求改善的叙事确定性较高。产业叙事加强cpu重估：海外大厂正重新评估AI基础设施的CPU配置。AMD指出，传统聊天式AI通常由1颗CPU服务4至8颗GPU，而Agent需要任务编排、工具调用和数据处理，#部分部署正向1:1的CPU/GPU比例演进。英伟达亦推出面向Agent负载的Vera CPU。我们认为，CPU需求提升更可能体现为GPU集群之外新增独立CPU算力层，而非简单增加单台服务器的CPU数量。CPU有望成为弹性最大的环节：我们预计，国产Agent近期有望迎来模型迭代、行业场景落地及信创适配等多重催化。相较传统推理，Agent执行链路涉及任务拆解、工具调用、检索及多轮交互，带来更高频的CPU调度与内存访问需求。随着多Agent并发和私有化部署推进，#国产服务器CPU有望受益于算力架构重配，需求弹性值得关注。投资建议：建议领导重点关注国产CPU板块的投资机会，#重点关注海光信息、龙芯中科、中国长城、禾盛新材（参股上海熠知电子）。#文字观点", "publish_time": "2026-09-30 11:09", "tags": ["文字观点"]}, "post:2026-09-30T08-04:234e81ebd95a": {"id": "post:2026-09-30T08-04:234e81ebd95a", "kind": "post", "title": "2026-09-30 08:04", "source_label": "帖子正文", "excerpt": "【中信证券前瞻】OpenAI DevDay 2026速评：25项发布聚焦智能体与平台化，媒体报道ARR接近700亿美元 【事件概览】 9月29日，OpenAI召开DevDay 2026，共发布25项更新，覆盖五大板块： 1、AI工作方式：推出常驻智能体dots（基于GPT-6 Astra，自带云端电", "content": "【中信证券前瞻】OpenAI DevDay 2026速评：25项发布聚焦智能体与平台化，媒体报道ARR接近700亿美元 【事件概览】 9月29日，OpenAI召开DevDay 2026，共发布25项更新，覆盖五大板块： 1、AI工作方式：推出常驻智能体dots（基于GPT-6 Astra，自带云端电脑，连接4000余款应用7×24小时执行任务），发布GPT-6.1 Sol（接近Astra智能，token价格仅为其1/5）及Ultrafast高速档； 2、开发者工具：Codex支持云端运行，Agents API新增电脑操作能力，与亚马逊推出Bedrock Managed Agents； 3、插件生态：开放插件扩展与MCP事件触发； 4、人机协作：推出ChatGPT Space、Pages协作文档及协作幻灯片； 5、商业化：新增Pro 500档位及OpenAI Marketplace。 【影响分析】 我们认为本次大会主线是从对话工具走向\"智能体+平台\"： 1、智能体全面落地，dots与Agents API均具备电脑操作能力，常驻运行将抬升单用户推理算力消耗； 2、ChatGPT向办公协作入口延伸，Space、Pages、协作幻灯片及Slack/Teams中@ChatGPT直接切入团队协作场景，插件扩展则将旗下产品合计约12亿周活用户开放为开发者分发渠道； 3、变现分层更细，6.1 Sol主打性价比，Ultrafast、Pro 500面向高付费用户，Pro 200档新用户用量由Plus的20倍降至10倍；Sign in with ChatGPT与Marketplace扩大了订阅额度及企业承诺额度的使用范围。 【收入进展】 据Axios 9月29日援引知情人士报道，OpenAI年化经常性收入（ARR）已接近700亿美元，较三季度初增长超过70%。其中企业端收入同期增长超过100%，三季度C端收入的新增部分已超过2025年全年的新增部分，OpenAI尚未公开确认。企业端增速领先，与本次大会集中发布Codex、Agents API、团队协作等企业及开发者产品的方向一致。 【投资观点】 OpenAI正由模型公司向智能体平台公司演进，产品覆盖C端订阅、开发者API与企业工作流，并通过与亚马逊合作的Bedrock Managed Agents将智能体能力延伸至AWS生态，商业化路径进一步清晰。我们认为常驻智能体普及将带动推理算力需求持续增长，利好云厂商及算力产业链。Marketplace首批纳入Adobe、Figma、Salesforce、ServiceNow等32家软件厂商，显示OpenAI与应用层以合作分发为主；同时协作办公产品上线，关注办公软件竞争。 欢迎联系中信证券前瞻团队！#文字观点", "publish_time": "2026-09-30 08:04", "tags": ["文字观点"]}, "post:2026-09-30T22-40:efa1d60860cd": {"id": "post:2026-09-30T22-40:efa1d60860cd", "kind": "post", "title": "2026-09-30 22:40", "source_label": "帖子正文", "excerpt": "【国金计算机&科技】#奥尼电子：三连击合计采购50亿GPU_剑指AI算租推理之王 #九日三单_累计采购约50.47亿元GPU卡_公司剑指AI算租推理之王 ——9月30日，公司全资子公司奥尼智能与C公司签署GPU算力卡采购合同，含税金额18.21亿元，合同已正式生效。——9月24日，与B公司签署23", "content": "【国金计算机&科技】#奥尼电子：三连击合计采购50亿GPU_剑指AI算租推理之王 #九日三单_累计采购约50.47亿元GPU卡_公司剑指AI算租推理之王 ——9月30日，公司全资子公司奥尼智能与C公司签署GPU算力卡采购合同，含税金额18.21亿元，合同已正式生效。 ——9月24日，与B公司签署23,226万美元采购合同，折合人民币约15.56亿元； ——9月22日，与A公司签署16.7亿元含税采购合同。 ——九日内三笔合同累计金额约50.47亿元密集落地，公司AI推理算力布局进一步锁定核心卡，彰显出极强的渠道能力。 #Muse开启个人Agent竞赛_常驻式Agent打开推理算力新空间 ——9月29日，OpenAI发布常驻型个人Agent Dots，可持续运行并主动完成长期任务；Meta亦持续升级Muse，在Connect 2026宣布将其接入AI眼镜、拓展多类应用连接器，并进一步推出Muse for Small Business。AI巨头正从“聊天助手”加速转向“全天候、跨终端、多任务”的个人Agent，打开云端与本地推理算力需求。 ——公司联手英伟达、AMD、沐曦等打造奥尼龙虾AI推理算力品牌。A2000搭载英伟达Jetson Thor芯片，拥有2070 FP4 TFLOPS算力及128GB LPDDR5X内存，端云协同模式下最大可降低超70% Token消耗。 ——2026H1，公司高性能计算设备收入5.08亿元，同比增长1625.53%，占总营收55.96%，AI算力业务已成为第一大收入来源。 风险提示：宏观风险，市场竞争，需求不及预期等 联系人：郑元昊/陈芷婧/刘高畅#文字观点", "publish_time": "2026-09-30 22:40", "tags": ["文字观点"]}, "attachment:files/中信建投-计算机行业：2Q26美股科技财报总结及2H26前瞻-260929.pdf": {"id": "attachment:files/中信建投-计算机行业：2Q26美股科技财报总结及2H26前瞻-260929.pdf", "kind": "attachment", "title": "中信建投-计算机行业：2Q26美股科技财报总结及2H26前瞻-260929", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·海外行业深度 2Q26美股科技财报总结 及2H26前瞻 核心观点 前沿实验室 ARR 边际放缓主因供应瓶颈与算法降本，底层算力 需求依旧紧俏。三大云厂商 Q2 业绩提速且商业 Backlog 突破 万亿美元（锁定 5–10 年长约），有力验证了 AI 基建投资回报 的长期能见度； 后市核心矛盾转向巨额 CapEx 带来的折旧爬坡， 具备自研芯片闭环与现金流造血能力的标的（ AMZN、GOOGL） 具备更优的单位经济模型， MSFT 依赖集群并网放量，META 需 观察折旧对利润率的挤压。软件层方面，专有业务图谱与合规权 限确立了核心系统的不可替代性，企业预算正加速回流至工作流 枢纽（NOW、SAP）、数据栈（SNOW）与安全防线（CRWD）， 板块分化聚焦于长约锁定度与现金流自洽度。 核心要点 产业循环与前沿实验室：供给瓶颈与算法降本共振，真实需求韧 性依然强劲。 将 AI 产业还原为“前沿实验室 ARR → 云厂商 CapEx → 算力供给 → 智能反哺”的飞轮循环，1H26 OpenAI 与 Anthropic 名义 ARR 的边际减速并非需求停滞，而是物理电力 与芯片供应受限、算法工程调优（大幅压降推理 Token 成本与 系统级冗余）以及企业经历年初 FOMO 采购后进入理性消化期 共同作用的结果。深入拆解收入口径可知，前沿实验室的 ARR 强依赖消耗型计费与头部 B 端客户（Top 1% 客户贡献超 80% 营收），与传统 SaaS 锁定 3–5 年不可撤销合同的模式存在本 质差异。剔除单一大客户异常采购、分销渠道抽成与非经常 性买 断后，真实净增量需求依然紧密锚定底层算力扩张，算力供不应 求的格局并未改变。 万亿美元长周期订单托底， AI 投资回报（ROI）加速兑现。 Hyperscalers Q2 业绩并不支持市场失速疑虑，Azure（+43%）、 AWS（+37%）与 Google Cloud（+82%）均展现出极强的增长弹 性。更重要的是，三大公有云的商业待履约合同（ RPO/Backlog） 分别达到 6,780 亿、4,960 亿与 5,140 亿美元，平均履约周期拉 长，且 AWS 长期合同贡献当期收入比例达到 46% 的历史高 位，充分验证了 AI 资本开支正在转化为高确定性的未来现金 流，破除了“算力过度投资导致空转 ”的伪命题。尽管单季巨额 CapEx 带来的转固折旧（D&A）爬坡对毛利率与即期自由现金 流形成阶段性压制， 但云厂商通过自研芯片 （ Trainium/TPU/Maia） 规模化替代与非云核心业务的持续造血，正逐步构筑起单位经济 学层面的抗压护城河。 维持 强于大市 于伯韬 yubotao@csc.com.cn SAC 编号:S1440520110001 SFC 编号:BRR519 许悦 xuyue@csc.com.cn SAC 编号:S1440523030001 发布日期： 2026年09月29日 市场表现 相关研究报告 07.06.11 股权变更获准 07.03.29 增资白敬宇制药持有30%股份 07.03.05 63%控股鼓楼宿迁人民医院 -25%-15%-5%5%15%25% 2025/9/29 2025/10/29 2025/11/29 2025/12/29 2026/1/29 2026/2/28 2026/3/31 2026/4/30 2026/5/31 2026/6/30 2026/7/31 2026/8/31计算机标普500计算机 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 海外行业深度报告 计算机 请务必阅读正文之后的免责条款和声明。 软件板块价值重塑：打破 “席位灭顶”悲观预期，IT 预算加速回流核心生产力底座。 企业级软件板块正经 历从过度抛售到理性重估的转折点。 LLM 作为概率型推理工具，无法脱离专有业务图谱、合规审计链条与跨系 统权限而独立运行，系统记录 层（System of Record）与行动系统（System of Action）的核心壁垒在智能体时代 不仅未被颠覆，反而进一步强化。头部 SaaS 正积极推进“席位底费 + 智能体交互/成果抽成”的混合商业模型 以对冲席位收缩风险；同时，在缺乏高质量私域数据清洗与工作流编排的情况下，通用大模型难以直接进入核 心生产环节，这驱动企业 IT 预算从前期的通用 API 试水加速回流至现代数据栈（ SNOW/MDB）、业务调度 中枢（NOW）与网络安全防线（CRWD/PANW）。 进入 2H26，投资者的关注从“算力军备竞赛想象力 ”全面转向“订单可见度、自研芯片单位成本优势与现金 流自洽度”。在大型科技巨头方面，各标的因基建路径与商业模式差异呈现清晰的分化特征：亚马逊（ AMZN） 依托较长的 Backlog 锁定期、自研 Trainium 闭环以及零售业务充沛的现金流支撑，展现出较强的单位经济学 与抗风险优势；谷歌（ GOOGL）凭借全栈 TPU 构筑的算力成本壁垒以及搜索 TAC 结构性下行的潜在契机， 具备稳固的利润安全垫；微软（ MSFT）后续的关键变量在于 Copilot及其他AI应用的推进商业化节奏 ；Meta （META）在缺乏外部企业级云订单对冲的背景下，高额 CapEx 带来的刚性折旧对利润率的潜在侵蚀仍需持续 观察。在软件板块方面，行业正由前期的估值收缩转向业务实质分化： ServiceNow（NOW）依托 Pro Plus 提 价通道与企业 AI 编排中枢地位展现出较强韧性， CrowdStrike（CRWD）受益于自动化威胁升级下的安全预算 平台化整合，SAP 享有 2027 年 ECC 支持终止带来的长周期刚性迁徙红利，而 Snowflake（SNOW）则逐步 体现出企业私域数据原位计算带来的用量回升。整体而言，板块后 续的分化主线主要围绕长期订单锁定度、自 研硬件单位经济学以及资本支出与现金流的自洽度展开。 维持“强于大市”评级。 下载日志已记录，仅供内部参考 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 海外行业深度报告 计算机 请务必阅读正文之后的免责条款和声明。 目录 AI Labs ARR复盘 ................................ ................................ ................................ ................................ ...1 行业长期订单改善， AI收入/Capex覆盖率快速提升 ................................ ................................ .............. 15 北美科技财报总结及前 岚图梦想家9等联合打造的战略新车型交换看法，并聚焦未来产品定义、智能技术落地、市场营销等维度探讨深化合作方向 5、时代万恒：控股子公司九夷锂能主营业务为锂电池的研产销，拥有国内领先的圆柱形锂电池全自动化产线，目标市场定位于高端电动工具领域，开拓了博世、飞利浦、斯蒂尔、宝时得等优质客户 6、深物业A：深圳国资委控股的深圳投资控股公司旗下；主营房地产开发、房屋租赁、物业管理，餐饮业务和仓储业务 7、亚邦股份：公司曾是全球最大的蒽醌结构分散染料和还原染料生产企业。公司主要从事染料及农药的产销，打造了“原材料-中间体-商品”的完整的产业链，是全球最大的蒽醌结构分散染料和还原染料生产企业，拥有二百多个品种的染料产品 8、传艺科技：1、公司在钠电池正负极材料、电解液等关键环节进行一体化布局并实现量产交付，产品可应用于A00级车、小动力车、电动工具及储能等领域；2、公司专注于柔性线路板（FPC）的设计、研发、制造和销售，为客户提供定制化解决方案；3、消费电子零组件行业头部企业之一，拟定增募资不超8.71亿元，加码智能化产线升级 9、园林股份：公司拟收购存储芯片及模组企业华澜微93.5%股份 10、上海洗霸：公司应用于eVTOL的高比能软包锂离子固态电池已设计完成 11、紫竹高科：1、公司核心业务聚焦于铝塑膜业务及汽车检具业务，铝塑膜是软包锂电池电芯封装的关键材料，下游主要应用于3C消费电子、动力、储能三类软包电池；2、公司具备《民用核安全电气设备设计许可证》和《民用核安全电气设备制造许可证》，为福清/方家山核电站供货核级压力变送器；公司有能力生产核级的仪器仪表产品 12、海南橡胶：中国天然橡胶产业龙头，拥有341万亩橡胶园（国内第一）、20家橡胶基地分公司 13、龙溪股份：关节轴承行业龙头，广泛应用于航空军工等领域，也是机器人的主要配套件 14、惠天热电：沈阳地区规模最大的国有专业化供热公司；沈阳市发改委确定公司为70万千瓦风电项目业主 15、贝瑞基因：公司自主研发了 NLPearl 遗传疾病人工智能临床决策支持系统、CNVisi 智能报告解读系统，为科研和临床工作者提供智能决策支持 16、中天服务：公司的主营业务物业管理服务（占比81.14%），主要经营模式是通过市场化竞争获取物业管理项目，开展基础物业管理服务，并围绕业主、房地产开发商等用户需求提供综合配套服务及增值服务 17、奥赛康：公司产品剂型主要定位于冻干粉针制剂、固体口服制剂，国内抗消化性溃疡药物质子泵抑制剂注射剂产品细分领域市场占有率第一 18、恒丰纸业：国内卷烟辅料龙头，五大卷烟辅料供应商之一；公司主要业务为特种纸、纸浆的生产和销售 19、陆家嘴：陆家嘴金融贸易区城市开发商，公司以 “商业地产 + 商业运营 + 金融服务” 为核心格局，聚焦商办楼宇、高端住宅开发及租赁 20、新亚制程：公司产品已批量用于人型机器人主板，与多家客户建立合作 21、中船科技：中国船舶集团旗下，船舶工业领域龙头；公司是DP2/DP3级动态定位系统龙头，为领航者号、星际归航号、提供风浪中平台稳定技术，是海上回收的基础保障 22、松芝股份：新能源汽车热管理系统及零部件供应商，2025年净利润同比增长81.32% 23、康希诺：国内创新疫苗研发先进企业，与德普世生物达成mRNA治疗型肿瘤疫苗战略合作 24、凯迪股份：公司是线性驱动系统龙头，网传资料显示，公司招聘电机研发工程师，工作让内容包括负责机器人用伺服电机电磁方案分析及结构方案设计 25、阳光乳业：公司主营业务为液态乳，包括儿童调制乳、A2牛奶 26、弘元绿能：公司为国内光伏硅片龙头 27、兴业股份：公司已研发成功半导体光刻胶用酚醛树脂、特种半导体封装用酚醛树脂等一批特种有机合成功能新材料 28、金徽酒：公司为甘肃浓香型白酒龙头 29、五方光电：公司表示拓展TGV技术在光学领域的应用 30、江南化工：公司民爆与新能源“双核驱动”，截至2025年底新能源装机106万千瓦，风、光电站布局内蒙古、新疆等资源区，受益绿电政策 31、蔚蓝生物：公司在猪用疫苗领域布局多款产品，其中猪伪狂犬病病毒基因缺失灭活疫苗已获新兽药证书，猪圆环-副猪-链球菌三联灭活疫苗已通过产品质量复核检验 32、昭衍新药：国内创新药龙头；公司核心业务为药物的非临床评价服务，是新药研发链条中非临床安全性评价的关键环节，主要为创新药客户提供药物非临床药理毒理学评价，受益于国内创新药融资与BD授权交易回暖带来的行业需求增长 33、龙蟠科技：公司签署锂矿投资条款清单拟认购GL1股份并支付7500万美元预付款；25年净利润同比减亏 34、美诺华：诺和诺德司美格鲁肽在中国的核心化合物专利到期；公司储备了减肥多肽类中间体，正在进行GLP-1的研发和技术的储备 35、龙版传媒：1、公司首部AI漫剧《穿越1988》完成170集制作上线，全网播放量突破1.2亿，红果热度值超4000万；2、大型现代化综合性国有文化企业；公司旗下109家新华书店门店实现连锁经营，涵盖包括大中型书城、特色书店、专业书店等多种形式；旗下产品多维边疆知识服务产品数据库暂未实现盈收 36、国网信通：1、公司主要是为企业提供云应用软件的定制化设计、研发及应用推广，主要包括电力营销、ERP、企业门户、能源交易；2、公司的云网融合业务产品立足于服务电力能源行业智能化相关应用，具备为虚拟电厂类应用提供服务的能力 37、宏英智能：公司已在电网侧储能完成多个大型项目，浸没式储能已经在数据中心、电信基站等商用化 38、登海种业：国内杂交玉米种子龙头企业 39、建业股份：公司电子化学品板块主要产品包括电子特气超纯氨及湿电子化学品，应用于LED、太阳能、集成电路、半导体等领域，超纯氨已形成年产21,000吨的生产能力，产品质量达到7N等级 40、亚联发展：公司基于华为Atlas人工智能计算机平台开发的“无人值守变电站智能运检系统”已在南方电网顺利使用，基于华为Tai Shan200系列开发的“变电站智能网关系统”能够为电力行业客户提供网络安全解决方案 41、依依股份：公司专注于宠物卫生护理用品领域，表示与主要客户的调价已基本达成共识，产能利用率处于合理区间 42、德才股份：1、控股孙公司奇想无限作为漫剧制作以及提出AIGC领域智能体一站式解决方案的团队，受邀参与火山引擎大模型游戏+漫剧 AI 工坊”广州企业沙龙；2、公司主营业务涵盖内装装饰工程、建筑幕墙工程、智能化工程、古建筑工程等 43、杭州热电：实控人为杭州国资委，公司主营工业园区热电联产、集中供热，提供的主要产品是蒸汽与电力，已覆盖上海、杭州等地区 44、天虹股份：1、深圳本地股；国内拥有门店最多的零售商；已确立百货、超市、购物中心、便利店四大实体业态与移动生活消费服务平台天虹APP的线上线下融合的多业态发展格局；2、公司自有品牌开发并推出了天优酱香酒，生产工厂位于贵州省仁怀市茅台镇核心产区，占地面积1200余亩\" 45、南华生物：湖南省政府旗下，干细胞储存和节能环保双主业，其中生物医药板块主要为细胞医疗服务，为客户提供干细胞、免疫细胞等生物资源的检测及储存服务 46、宁波东力：公司的产品包括行星减速器等，杭州湾电机、减速器部分车间已投入生产；同时拟实施年产52万台电机及减速机项目 47、古越龙山：公司拥有中国最大的黄酒生产基地，有少量的白酒生产和销售 48、康辰药业：创新型制药研发企业，主要产品“苏灵”是目前国内血凝酶制剂市场唯一的国家一类新药，在研管线深入布局靶向抗肿瘤药产品系列 49、泰诺麦博：公司是面向全球市场的创新生物制药企业，核心产品斯泰度塔单抗注射液为全球同类首创（First-in-Class）重组抗破伤风毒素全人源单克隆抗体药物，被CDE认定为突破性治疗药物并纳入优先审评程序，另一核心产品TNM001已递交NDA并纳入优先审评#市场段子#文字观点", "publish_time": "2026-09-30 17:56", "tags": ["市场段子", "文字观点"]}, "post:2026-09-30T08-06:102b23798114": {"id": "post:2026-09-30T08-06:102b23798114", "kind": "post", "title": "2026-09-30 08:06", "source_label": "帖子正文", "excerpt": "【兆易创新】3D DRAM趋势确定，兆易创新已走在前列#大幅上调长鑫的采购金额并环比增加原预计2026年全年采购金额57.11亿元，本次增加21.43亿元到78.54亿元，上修37.5%。2026M1-8采购35.96亿元，上修后26M9-M12及27M1-4预计采购额分别为42.58/44.11亿", "content": "【兆易创新】3D DRAM趋势确定，兆易创新已走在前列#大幅上调长鑫的采购金额并环比增加原预计2026年全年采购金额57.11亿元，本次增加21.43亿元到78.54亿元，上修37.5%。2026M1-8采购35.96亿元，上修后26M9-M12及27M1-4预计采购额分别为42.58/44.11亿元，环比持续提升。 #3DDRAM走向定制化、单GB价值量有望显著提高 3D DRAM使DRAM从标准器件走向定制化，使用TSV、混合键合等先进3D封装技术，并且定制设计需要NRE费用，单GB价值量有望显著高于标准DRAM，成为新的业绩增长点。 #3DDRAM2027年或量价齐升、兆易创新已走在前列 小米玄戒O100为行业首颗 6nm 3D 晶圆级堆叠的 AI 加速芯片，使用3D DRAM和逻辑芯片混合键合、垂直堆叠，预计27年量产上市。兆易创新公告披露定制化存储新产品是27年采购金额增长原因之一，说明已走在定制化3D DRAM产业趋势的前列。 风险提示：研发量产进度不及预期等。#文字观点", "publish_time": "2026-09-30 08:06", "tags": ["大幅上调长鑫的采购金额并环比增加", "文字观点"]}, "post:2026-09-30T10-03:a7c089761112": {"id": "post:2026-09-30T10-03:a7c089761112", "kind": "post", "title": "2026-09-30 10:03", "source_label": "帖子正文", "excerpt": "【大洋生物003017】参股半导体高纯陶瓷材料企业，卡位芯片设备关键环节🚀 #陶瓷基板国产替代浪潮下，大洋生物的隐藏半导体材料属性浮出水面！公司通过参股芯之纯，切入芯片制造上游赛道，成功在陶瓷基板国产替代浪潮中实现关键环节卡位！", "content": "【大洋生物003017】参股半导体高纯陶瓷材料企业，卡位芯片设备关键环节🚀 #陶瓷基板国产替代浪潮下，大洋生物的隐藏半导体材料属性浮出水面！ 公司通过参股芯之纯，切入芯片制造上游赛道，成功在陶瓷基板国产替代浪潮中实现关键环节卡位！#高纯陶瓷材料，可直接用于芯片制造设备零部件，是存储芯片、先进制程设备的关键耗材。 ✅ 参股芯之纯，绑定半导体高纯陶瓷赛道 大洋生物持有#浙江芯之纯30%股权。芯之纯专注于高纯陶瓷材料的研发与生产，产品可应用于芯片制造设备的核心零部件，属于芯片制造业上游供应商，直接受益于半导体设备国产替代。 ✅ 高纯陶瓷材料是芯片设备的“隐形刚需” 高纯陶瓷材料具有高纯度、高耐磨、耐腐蚀等特性，是半导体制造设备中晶圆承载、气体输送、腔体结构件的关键材料，#尤其是在存储芯片、先进制程中，陶瓷零部件直接影响良率与稳定性，市场长期被海外厂商垄断，国产替代空间巨大。 ✅ 陶瓷基板赛道高景气，芯之纯技术卡位关键环节 当前陶瓷基板国产化率不足15%，而高纯陶瓷粉体/零部件是核心卡脖子环节。#芯之纯的高纯陶瓷材料可直接用于陶瓷基板制造及设备配套。定价视角： 高纯陶瓷材料是芯片设备零部件的核心耗材，而国内厂商在这一环节的市占率不足 10%。大洋生物通过参股芯之纯，提前卡位这一 “隐形刚需” 赛道。按当前半导体材料赛道可比公司估值测算，这部分股权对应的潜在价值，足以支撑公司市值突破60-100亿，属于典型的 “预期差” 机会。#文字观点", "publish_time": "2026-09-30 10:03", "tags": ["浙江芯之纯", "文字观点"]}, "attachment:files/ABF深度：看国产载板及膜材突围.pdf": {"id": "attachment:files/ABF深度：看国产载板及膜材突围.pdf", "kind": "attachment", "title": "ABF深度：看国产载板及膜材突围", "source_label": "其他", "excerpt": "ABF深度：看国产载板及膜材突围 要点总结 1.ABF载板是芯片与PCB之间的关键过渡层，AI芯片对其提出远高于CPU时代的要求。载板承担支 撑芯片、传导信号、分配电源的功能，AI所用GPU/ASIC制程已达7纳米及以下，对布线密度、层 数、面积和lowCTE值（抗翘曲能力）要求大幅提升。", "content": "ABF深度：看国产载板及膜材突围 要点总结 1.ABF载板是芯片与PCB之间的关键过渡层，AI芯片对其提出远高于CPU时代的要求。载板承担支 撑芯片、传导信号、分配电源的功能，AI所用GPU/ASIC制程已达7纳米及以下，对布线密度、层 数、面积和lowCTE值（抗翘曲能力）要求大幅提升。英伟达Blackwell较H系列芯片面积增长3倍 以上，B系列与H系列同为双Die合封但面积仍增长约七八十个点；谷歌2026年下半年推出的 Viperfish、Sawfish（对应V8T、V8I）面积也增长几十个点。层数已从过去CPU载板的十层出头提升 到十几层甚至二十几层以上。 2.ABF载板已成AI产业链最核心瓶颈，明年供需缺口预计达30%~40%。2025年下半年起消费电子 边际改善叠加AI高阶载板需求拉动，ABF载板价格明显上涨，价值量普遍涨了大几十个点，部分产品 毛利翻倍以上。欣兴、景硕等厂商月度营收自去年下半年起爆发式增长。 3.扩产极难、周期极长是供给紧张的根本原因。ABF载板采用全加成法工艺，与PCB的减成法/mSAP 完全不同，头部厂商良率普遍不到九成，能做到八成多已属优秀；对设备、厂房洁净度、技术积累要求 极高，低端产能向高端转化难度极大。扩产周期长达两年，形成成熟产能需两年以上，接近存储类半导 体，而传统PCB一年左右即可完成。各厂商扩产产能要到2028年及以后才能释放，因此2026— 2027年是载板最短缺的年份。 4.行业周期复盘：从谷底到AI驱动的新一轮上行。2019—2021年受疫情需求前置拉动，载板价格快 速增长并出现明显供给缺口；2022年后消费电子需求下行，中阶产品严重供过于求、价格大幅下跌， 头部厂商长期亏损。2025年起消费电子边际改善叠加AI拉动，行业重回紧张。 5.高端市场仍由海外厂商垄断，大陆厂商迎来历史性导入窗口。高端市场以台湾欣兴电子、日本 Ibiden为代表，覆盖英伟达、谷歌等头部客户；CPU领域以Shinko、Ibiden为主，另有南电、景硕 等。大陆兴森、深南投入研发十余年，具备现成厂房设备与客户积累，但过去因海外产能充足、价格低 而未放量。如今海外稼动率打满、扩产需时，2027年恰逢国产算力芯片爆发，两者共振，兴森、深南 有望在2026—2027年对大客户实现显著出货增长，初期从CPU切入，再向GPU/ASIC过渡。 6.重点标的兴森科技：ABF载板产能储备充足，多业务边际改善。ABF载板现有约7000平方米月产 能储备，一期远未打满即已启动二期扩产，预计明年年底月产能提升至2万平方米，扩产节奏与国产算 力芯片放量匹配，明年有望形成明显业绩贡献。BT载板受益存储需求旺盛（三星及国内存储厂商订单 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 供不应求），mSAP业务已基本成为第四大高阶供应商（前三位为鹏鼎、深南、欣兴），受益800G向 1.6T升级价值量翻倍。公司预计今年下半年起业绩开始体现，明年更亮眼，市场预期差仍较大。 7.上游材料国产替代同步推进，壁垒更高、格局更优。ABF载板中间为BT树脂做的BTCCL，主要由 日本力森诺科基本垄断，台光电在CCL环节有所突破（针对海外ASIC市场）。BTCCL需用lowCTE 布和BT树脂：lowCTE布以日本日东纺为主，国内宏和科技有所突破；BT树脂以力森诺科自供为主， 国内东材科技有所突破，有望先与台光电合作、针对海外大客户。ABF膜领域华正、生益、南亚等均有 多年储备。上游市场空间不大但对性能至关重要，一旦通过验证客户轻易不更换，存量竞争者少、天花 板空间大，产品短缺提供了导入窗口，膜材、布、树脂均值得重点关注。 问答整理 （本次电话会为单向汇报，原文未包含问答环节。） 原文 晚上好，感谢大家在假期之前还来参加这次关于ABF的电话会，一起探讨。今天主要汇报ABF载板产 业，以及ABF上游材料——ABF积层膜、lowCTE布等的情况。 首先讲ABF载板是什么。简单理解，载板的作用是承上启下：承接芯片以及下面的PCB。芯片是硅基 的，制程非常精密，比如现在AI所用的芯片普遍已经到了7纳米及7纳米以下，这样精细的芯片直接 承载到PCB上，无法实现很好的信号传输，所以需要ABF载板作为过渡。整体结构是：最上面是芯 片，中间加一块ABF载板，ABF载板再与底下的PCB相连。它所提供的功能，一个是支撑芯片，另外 还要传导信号、分配电源。 对于高性能芯片而言，尤其是现在AI所用的GPU及ASIC，本身计算能力非常强，对信号传输的要求 非常高，因此对载板布线密度提出了更高要求，层数会提高，载板面积也会扩大。此外载板还有一个重 要点，就是lowCTE值要好：受热情况下，载板材料容易与芯片脱离，必须保证板子抗形变能力强、 lowCTE值低，尽量避免翘曲现象。这几方面都对ABF载板提出了更高的挑战。 当前主流芯片中，GPU或ASIC的面积相比之前大了非常多。比如英伟达这边，Blackwell这一代相比 H系列，芯片面积是三倍以上增长；而B系列与H系列同样都是双Die合封的架构，但芯片面积依然 增长了大约七八十个点。谷歌这边也同样，比如2026年下半年推出的Viperfish和Sawfish这两款产 品，大概对应V8T和V8I，面积也增长了几十个点。所以未来芯片面积的增加，会带来ABF载板面积 的增加。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 这带来两方面影响：一方面，芯片和载板面积相应增加后，对生产产能的消耗更大；另一方面，随着面 积增大，对抗翘曲能力的要求也更高。整体而言，载板的架构壁垒越来越高，加工难度相比之前CPU 时代大了非常多，对产能消耗和技术壁垒都提出了更高要求。第二方面是层数也有相应提高，现在ABF 载板的积层层数已经普遍到了十几层甚至二十几层，而过去的CPU载板一般只有十层出头，现在AI芯 片用的已经可以到20层以上，这对载板厂商的技术能力提出了非常高的要求。 在AI高速需求增长之下，ABF载板一方面享受技术壁垒红利，另一方面承受产能消耗压力，所以当前 PCB载板这一块产能非常紧张，甚至有一些媒体报道说，载板现在是整个AI产业链里面最核心的瓶颈 环节。当前供需缺口到明年大概会来到30%到40%。 过去ABF产业链经历过几轮周期。比如2019到2021年，行业从谷底走出，受疫情影响，消费电子需 求整体前置，载板价格普遍增长较快，那时也出现了一个比较明显的供给缺口。再到2022年以后，因 为疫情时期需求前置，消费电子需求出现非常明显的下行，行业进入周期谷底，尤其是中阶产品严重供 过于求，价格大幅下跌，很多头部厂商甚至出现了长期亏损的情况。 那个时候，下游的主要领域其实主要就是CPU，包含两方面：一是消费电子和PC里面的CPU，以手 机、PC和平板为主；二是服务器市场，那时的服务器市场也以CPU为主，还没有出现AI相关的需 求。 从2025年开始，我们看到消费电子需求出现边际改善，同时AI对高阶载板的需求形成了非常明显的 拉动。从2025年下半年到今年上半年，整个ABF载板价格上涨非常明显，出现了明显的供给紧张情 况。如果去看欣兴、景硕这些相关载板厂披露的月度营收数据，可以看到他们的收入增速都非常快，从 去年下半年开始迎来了爆发式增长。价格方面，相比启动之前，ABF载板的价值量普遍涨了大几十个 点，相关产品的毛利甚至能做到翻倍甚至更多。 AI一方面给ABF带来需求上的强增长，另一方面带来技术壁垒的增加。虽然大家现在都在扩产，但技 术壁垒背后意味着扩产难度非常高。载板虽然一般和PCB相关的公司归在一类讨论，但它的加工工艺 与PCB完全不同：PCB一般使用减成法工艺，或者mSAP——也就是今年上半年以来在光模块PCB中 炒得比较火的半加成法工艺；而ABF载板是全加成法，良率非常低，头部厂商的良率普遍不到九成， 能做到八成多就已经非常好了。相比之下，PCB的高多层产品良率基本都要做到九成甚至九成九以上， 才能有比较好的盈利水平；高阶HDI大概是八成多的良率。再加上对设备的要求非常高，对厂房洁净 度的要求也非常高，技术积累要求很深。 此外，低端ABF和高端ABF的生产很难直接切换或平替，低端产能向高端产能转化的难度极大，这有 点像我们之前提到的电子布、MCC等环节的感觉。种种因素导致ABF扩产难度非常大、扩产周期非常 久：ABF载板的扩产周期要到两年，如果考虑到爬坡，形成成熟产能甚至要两年以上。这比较接近于半 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 导体（比如存储）的扩产周期，和传统PCB很不一样。传统PCB如果设备到位，从建厂到设备进入整 体大半年就能搞定，再考虑爬坡时间，差不多一年、最多一年出头。而载板产能扩张还是很慢的。 所以从去年AI需求开始，相应厂商都开始规划扩产，但扩产周期比较长，相应产能基本要到2028年 及以后才能放出来，因此2026年和2027年会迎来载板非常短缺的年份。尤其是今年相对还好一点， 明年载板会变得更缺，这是大概的底层逻辑。 从供应商格局来看，当前高端市场还是由海外厂商垄断，其中以中国台湾的欣兴电子、日本的Ibiden 等为代表，客户涵盖英伟达、谷歌这两个每年出货量最大的巨头，基本都在欣兴和Ibiden这边。CPU 方面需求较大的英特尔、AMD等，也是以Shinko、Ibiden为主，此外还有中国台湾、韩国的一些厂 商，比如南电、景硕等为代表。 大陆这边主要是兴森和深南两家上市公司。兴森和深南投入很早，从前期研发到落地已经十几年时间， 主要还是针对国产芯片进行重点突破，比如国产CPU客户，或者国产GPU及ASIC客户。也正因为载 板前期重投资、重研发的属性，过去几年对深南和兴森的ABF业绩形成了拖累，比如兴森已经连续亏 了好多年，包括今年，测算下来载板这块估计还要亏损几个亿。当然这里主要说的是ABF这块，BT载 板他们都是盈利的——今年因为存储需求非常好，BT这块的盈利还是非常好的。在ABF继续亏损、同 时行业供给紧张的背景下，当前给了兴森一个很好的历史机遇去做导入。 兴森和深南过去的厂房设备都已经有储备，技术研发也配合国内大客户做了很多年，只是一直没有形成 非常大批量、稳定的交付，这与过去载板市场景气度不好有关：海外厂商价格报得很低，成熟产能完全 可以供应，所以国产替代的诉求就不是特别强。现在海外厂商的稼动率已经打得很满，他们扩产也需要 时间，要现买设备、调试设备，如刚才所说大概需要两年甚至两年以上才能形成完整产能，所以整个 2026到2027年会形成比较明显的供给缺口。到2027年，正好是国产相关芯片爆发的时候，此时兴 森、深南有非常大的机会实现导入，历史机遇就摆在面前：有现成的厂房设备、足够久的技术积累，而 且配合大客户开发已经做了很久。在产能短缺的背景下，我们认为今年到明年有很大希望对大客户实现 出货的显著增长。 初期来看，预计还是会从CPU产品开始，由CPU向GPU或ASIC产品过渡，然后逐渐把前期的投入 打出来。建议重点关注兴森科技，它的ABF载板产能储备比较多，当前大概具备7000平方米左右的 产能储备，目前一期还远没有打满，但已经启动二期扩产，预计到明年年底二期落地，整体月产能将提 升到2万平方米。整体产能规划比较大，扩产进度也能与国产算力芯片的放量配合起来。当前因为供需 紧张，价格水平也非常好，所以明年ABF载板这块有很大希望能形成比较明显的业绩贡献。 除此之外，公司其他业务，比如BT载板业务，包括mSAP业务，进展也都非常不错。BT载板这边， 当前存储需求非常旺盛，以三星以及国内存储厂商为代表的客户群体提供了大量订单，目前也是供不应 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 求的状态，都在积极扩产。mSAP相关的光模块业务，兴森这边进展也非常不错，据产业了解，现在已 经基本成为第四大的高阶mSAP供应商——前面三家主要是量非常大的供应商，即鹏鼎、深南，还有 欣兴。兴森这边主要客户还是海外客户，国内客户也有。整体也处于800G向1.6T升级的进程中，受 益于这一代际迭代，价值量要翻倍。所以今年对兴森而言是边际变化很多的一年，或者说是一个即将迎 来全新面貌的年份。 过去一些业务比如ABF是拖累，BT在AI到来之前，消费电子的需求也不温不火；AI时代来临之后， 对存储的需求打开了BT载板业务的增长空间。ABF载板这边，这次应该是真的要兑现了；再就是凭借 在mSAP技术领域的积累——其实是做BT载板积累下来的技术自然延伸到了mSAP——也抓住了这 波风口。在这几块业务推动之下，公司迎来了非常显著的转变时期，预计从今年下半年开始在业绩上就 会有比较明显的体现，到明年会有更亮眼的表现。 大概就是这样一个情况。我们认为兴森、深南都可以重点关注，尤其是兴森：相对而言，兴森的载板纯 度更高一点，里面的预期差也还比较大。坦率来讲，兴森做ABF已经做了好多年，过去几年市场也流 传种种声音，说每年都要大批量放量之类，很多投资者在这上面的持股体验可能不是特别好。但现在真 的来到了历史机遇的时刻：行业逻辑非常通顺，自身的储备也更足。所以可以重点关注兴森科技的变 化，以及它从三四季度开始逐步兑现ABF的情况。 除了ABF载板本身，上游其实也是整个载板的瓶颈环节，建议重点关注ABF积层膜，以及里面的low CTE布和树脂材料。那么整个ABF载板的结构是怎样的呢？中间是BT树脂做的BTCCL，这一块主要 由日本的力森诺科基本垄断。目前CCL环节，台光电其实有些突破，主要是针对海外ASIC市场。BT CCL要用lowCTE布和BT树脂两种材料：过去BT树脂环节主要是力森诺科自己供树脂；lowCTE布 方面主要是日本的日东纺。现在国内的宏和科技在布方面有所突破，东材科技在BT树脂领域有所突 破，所以接下来国产替代是一个重头戏。 上游的逻辑和ABF载板本身很相似：当前就是因为产品短缺，给了很好的导入机遇。越往上游，材料 壁垒越高——整体市场空间不大，而且对性能至关重要，所以终端客户替代的诉求没有那么强。但现在 相关产品短缺，带来了很好的历史机遇去导入，加上前期大家也做了很久的储备，比如ABF膜领域， 以华正为代表，包括生益、南亚等厂商都做了很多相关储备。这时可以重点关注厂商进展，有机会实现 突破导入。东材科技这边，我们认为可能更多是先跟台光电实现突破，在BT树脂里，剩下的再看能不 能对其它客户形成突破，这块的终端也是针对海外大客户。 这块的壁垒我们认为非常高：树脂是定型产品，lowCTE布和ABF膜对CTE性能以及Dk、Df性能的 要求都非常高。所以一旦国产厂商通过验证，配合没有问题，轻易也不会更换。从格局角度讲，能拿到 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 的天花板空间也比较大，因为存量竞争者相对较少。所以上游材料这一块，包括膜材、布以及树脂，也 都值得重点关注。 以上是今天的主要内容。如果大家后续对相关重点标的（比如兴森、东材科技等）感兴趣，欢迎会后进 一步交流，我们再作详细汇报。今天的内容就到这里，感谢大家的时间。 全文总结这份材料围绕ABF载板产业及上游材料的国产突围机会展开，核心逻辑可以概括为：AI需求 爆发使ABF载板成为全产业链最紧缺的瓶颈环节，供给短期无法跟上，这为大陆厂商提供了历史性的 导入窗口，同时上游膜材、布、树脂也迎来国产替代良机。 一、ABF载板的作用与挑战。载板在芯片与PCB之间起承上启下作用，负责支撑芯片、传导信号、分 配电源。AI所用GPU、ASIC制程精密（7纳米及以下），对载板布线密度、层数、面积以及lowCTE 值（抗翘曲能力）要求远高于CPU时代：英伟达Blackwell较H系列芯片面积增长3倍以上，谷歌 2026年下半年推出的Viperfish、Sawfish（对应V8T、V8I）面积也增长几十个点；层数从过去CPU 载板的十层出头提升到AI芯片的十几层甚至二十几层以上。 二、供需格局与周期。2025年下半年起消费电子边际改善叠加AI需求拉动，ABF载板价格上涨明 显，价值量涨了大几十个点，部分产品毛利翻倍以上；媒体报道载板已成为AI产业链最核心的瓶颈， 明年供需缺口预计达30%～40%。行业此前经历过2019—2021年上行（疫情需求前置）和2022年 后的下行谷底（消费电子需求下行、中阶产品供过于求、头部厂商亏损）。当前供给紧张的根本原因在 于扩产难：ABF载板采用全加成法，良率普遍不到九成，设备与洁净度要求高，低端产能向高端转化难 度大，扩产周期长达两年以上（接近存储类半导体），传统PCB一年即可完成。各厂商扩产产能要到 2028年以后才能释放，因此2026—2027年是载板最短缺的年份。 三、竞争格局与大陆机会。高端市场由海外厂商垄断，以台湾欣兴电子、日本Ibiden为代表，覆盖英 伟达、谷歌等头部客户；CPU领域还有Shinko、南电、景硕等。大陆兴森、深南已投入研发十余年， 具备现成厂房设备与客户积累，但过去因海外产能充足、价格低，一直未放量。如今海外稼动率打满、 扩产需时，2027年又恰逢国产算力芯片爆发，两者形成共振，兴森、深南有望在2026—2027年对大 客户实现显著出货增长，初期从CPU切入，再向GPU、ASIC过渡。 四、重点标的梳理。最看好兴森科技：ABF载板现有约7000平方米月产能储备，一期未打满即启动 二期，预计明年年底月产能提升至2万平方米，扩产节奏与国产算力芯片放量匹配，明年有望形成明显 业绩贡献；同时BT载板受益存储需求旺盛（三星及国内存储厂商订单供不应求），mSAP业务已跻身 第四大高阶供应商（前三位为鹏鼎、深南、欣兴），受益800G向1.6T升级价值量翻倍。公司预计今 年下半年起业绩开始体现，明年更亮眼，市场预期差仍较大。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 上游材料的国产替代。ABF载板上游同样紧缺且壁垒更高：BTCCL被日本力森诺科基本垄断，BT树 脂以力森诺科自供为主，lowCTE布以日本日东纺为主。国内方面，宏和科技在布领域、东材科技在 BT树脂领域已有突破（东材有望先与台光电合作，针对海外ASIC客户）；ABF膜领域华正、生益、 南亚等厂商均有多年储备。上游材料市场空间小、对性能至关重要，一旦通过验证且配合顺畅，客户轻 易不更换，存量竞争者少、天花板空间大，产品短缺为国产厂商提供了导入窗口，膜材、布、树脂均值 得重点关注。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-09-30T08-57:3162fc7ba9b0": {"id": "post:2026-09-30T08-57:3162fc7ba9b0", "kind": "post", "title": "2026-09-30 08:57", "source_label": "帖子正文", "excerpt": "【盘前0930】国庆节快乐1、隔夜美股小幅调整，原油价格略有回落，适度缓解了市场的紧张情绪，但是美债收益率依旧走高，压制市场情绪。资金抱团，费城半导体回到本轮修复的前高附近。", "content": "【盘前0930】国庆节快乐1、隔夜美股小幅调整，原油价格略有回落，适度缓解了市场的紧张情绪，但是美债收益率依旧走高，压制市场情绪。资金抱团，费城半导体回到本轮修复的前高附近。目前影响全球风险偏好的因素主要是美债利率，尤其是对新兴市场国家的影响会更大，最近港股的冲击其实比A股更大，港股创新药ETF和恒生生物科技ETF 持续有超预期催化，才能更有韧性，昨天也逆市走强。目前美债加速上行，已经脱离基本面因素，更多是资金的自我循环，新债旧账一起算，叠加9月天量发行规模的冲击。目前看10月供给端会有回落，美伊冲突谈判重启还有希望，宏观环境边际改善的机会还在。 2、昨天A股成交仅1.42万亿，这是去年7月以来的新低，大幅缩量可以理解，除了休假，周一开门黑已经跌完了，假期避险的意义就不大。指数没有继续发酵恐慌，盘中挣扎了好几次，日内K线都走成了锯齿状，这个位置分歧还是比较大的。资金上，昨天两融余额大幅减少到2.58万亿，这已经是今年7月底和4月底的水平了，目前这个位置除非真的就确认进入大级别熊市，否则哪怕是震荡行情判断，也应该相对积极点，找到一些未来能够看到变化的行业。昨天加速下跌后指数结构都不太好，创业板指盘中回落倒是出现大级别的底部钝化，目前这个位置，如果没新的大利空冲击，还是先看筑底。 3、今天是节前最后一个交易日，认真交易的活人也不多，应该能够平稳收官。昨天盘后货币和财政的组合拳政策公布，市场重点关心房贷贴息和PSL贷款下调25BP并增加科技和支农再贷款额度，实际评价分歧挺大，但信号意义更明确，对四季度稳增长政策不应该一味悲观。不过昨天午后地产在小作文带动下成为唯一亮点，前面已经发酵十几天，今天大概率会兑现，反而关注酒ETF这种内需政策的预期升温。 4、虽然假期的时候外围宏观还可能继续极限施压，但整体对A股的向下冲击是有限的，这个震荡结构目前看还比较有韧性，只不过需要找个好介入的时间。过节反正需要留点仓位，今天小跌就看捞，继续修复也无所谓，做做宽基或者指增，创业板50ETF，科创100ETF，科创综指ETF，还有增强效果很不错的科创50增强ETF，反正节后还有别的方向搞。 （仅供内部参考，不做投资建议，基金投资需谨慎）#文字观点", "publish_time": "2026-09-30 08:57", "tags": ["文字观点"]}, "post:2026-09-30T12-29:108b1ed53046": {"id": "post:2026-09-30T12-29:108b1ed53046", "kind": "post", "title": "2026-09-30 12:29", "source_label": "帖子正文", "excerpt": "摩根大通——中国房地产——决策层研究稳楼市政策；上海发布\"828\"政策细则 9月28日，房地产政策端出现两项关键进展。", "content": "摩根大通——中国房地产——决策层研究稳楼市政策；上海发布\"828\"政策细则 9月28日，房地产政策端出现两项关键进展。其一，国务院常务会议（总理李强主持）明确提出\"研究出台稳定房地产市场、促进就业增收等政策措施\"，但未披露具体举措。其二，继北京之后，上海于同日发布\"828\"政策的地方实施细则，整体方向与北京相似但存在细微差异（如定金上限北京为1%、上海为3%），而现房销售按揭放款须于竣工备案后方可发放的核心约束整体维持偏紧基调。 国务院\"稳楼市\"研究：消费提振导向而非单纯刺激 摩根大通认为，在一线城市房价初现企稳迹象的背景下，决策层推出\"大规模刺激\"的紧迫性有限。若后续出台支持政策，其终极目标更偏向通过稳定房价以提振内需消费——房价下行是抑制居民消费的关键掣肘之一，因此政策取向将聚焦\"促价格企稳\"而非\"刺激销量反弹\"。 两大潜在政策方向 1. 房贷利率补贴：存在约100个基点的利率补贴空间（有望从当前3.05%降至2.05%），但预计设上限。以上海已实施的补贴方案为例，单套补贴上限为5万元人民币（按套而非按年计）。摩根大通测算，若对所有首套新房销售进行补贴，年度所需资金规模约为440亿元人民币。 2. 土地供应管控：在需求端提振难度较大的情况下，供给侧成为政策着力点。可能的方向是优化及更严格执行地方土地供应调控——当前规则要求库存去化周期超36个月的城市暂停供地，18—36个月的城市控制供地。此外，近期\"828\"政策旨在逐步取消预售制度，其本身已将在高能级城市实现一定程度的供应收缩。 其他可能政策工具：交易税费下调；住房公积金贷款进一步宽松；一线城市（北京、上海已松动，深圳大概率跟进）购房限制进一步放宽；城中村改造现金补偿。 上海\"828\"细则与北京的差异化对比 • 定金上限：北京允许开发商收取最高1%的定金，上海允许最高3%（仍低于此前5%的预期）。 • 过渡安排：上海明确，8月28日后拿地但土地出让公告发布于该日期之前的地块，可沿用旧预售规则至2027年底，但资金监管账户须执行新规。 • 开发商融资：上海版新增鼓励开发商通过股权、债券、ABS及REITs融资的条款（北京版无此条），摩根大通认为这仅因上交所位于上海，且原文\"828\"政策已包含此表述，不构成增量信息。 • 土地价款支付：两城市均要求30日内支付不低于50%的土地出让金，但余额缴纳期限北京规定为2年内，上海表述为\"1+1年\"（正常1年，可延长1年），实质差异不大。 投资影响与策略 短期而言，市场或受政策预期提振维持一定热度（至少延续至国庆假期，符合市场猜测），但若最终政策力度不及预期，板块可能再度跑输大盘。摩根大通偏好标的为华润万象生活（CR Mixc）、华润置地（CR Land）及贝壳（KE Holdings，由Daniel Chen覆盖），建议在反弹中卖出困境房企（如万科）。 主要风险 • 政策实际落地力度与范围不及预期，板块估值再度承压。 • 预售制退出的过渡期内，开发商资金链与交付风险上升。 • 土地供应管控执行力度因地方财政压力而打折扣。 • 一线城市需求端放松幅度有限，销售复苏持续性存疑。#文字观点", "publish_time": "2026-09-30 12:29", "tags": ["文字观点"]}, "post:2026-09-30T14-15:55001a3d3c98": {"id": "post:2026-09-30T14-15:55001a3d3c98", "kind": "post", "title": "2026-09-30 14:15", "source_label": "帖子正文", "excerpt": "中信证券：开启中国房地产市场的新周期 当房价已来到合理位置，需求侧提振效果比较显著 我们认为，当房价已经来到了合理位置，需求侧提振的效果就会比较显著。现房销售的改革大大降低了交付风险，并限制了未来的供给增长。", "content": "中信证券：开启中国房地产市场的新周期 当房价已来到合理位置，需求侧提振效果比较显著 我们认为，当房价已经来到了合理位置，需求侧提振的效果就会比较显著。现房销售的改革大大降低了交付风险，并限制了未来的供给增长。需求提振又令月供可能明显低于租金，从而推动房地产市场从量变走向质变，终结超过六年的房价下跌周期。 ▍财政部，中国人民银行，金融监管总局强化财政金融政策协同，支持城乡居民刚性住房需求，决定在全国范围内实施居民购房贷款贴息政策，减轻新购买首套住房家庭的商业性个人住房贷款利息负担。 支持使用新发放商业性个人住房贷款购买在120平米以下，价格在150万元以下的房屋，贴息贷款规模上限为100万元。政策自2026年10月1日起实施，实施期限暂定1年，其间经办银行新发放符合条件的首套住房商业性个人住房贷款，财政部门按照贷款本金给予年化1个百分点、期限不超过5年的贴息支持。根据相关部委答记者问，按照目前首套住房商业性个人住房贷款利率水平，相当于优惠了利率的三分之一，贴息期限最长5年。例如，对于一笔长期限的100万元商业性个人住房贷款，考虑到大多数房贷按月付息和还款，贷款余额逐月减少，贴息政策最多可帮助借款人累计减少付息近5万元。 ▍政策切实降低了居民的负担，有效鼓舞了市场的需求，其中刚需直接受益，改善性需求则间接受益。 对刚需来说，居民在买房阶段直接受益，120万左右总价的房屋可能享受最高至5万元左右的付息优惠。由于政策既补贴新房，也补贴二手房，改善性需求虽然在新购住房时未必能够享受政策好处，但由于其卖出房屋可能符合贴息的要求，阶梯式改善的可能性也就明显提升了。 ▍房价已经来到合理位置，需求侧边际提振效果预期显著。 根据统计局数据，在70大中城市新房/二手房连续39/40个月的房价环比下降之后，存量房业主的浮盈水平已经明显偏低，房价收入比已经回到十分合理的水平，租金回报率已经明显超过存款利率。即使在本轮贴息之前，按照40年周期的房贷计算，房贷负担也已经局部低于租金。本轮贴息之后，我们预计更多区域的房贷负担会低过租金。从国际经验来看，租金超过房贷负担，是房价出现向上拐点的重要标志。 ▍从828到929，从供给侧改革到提振需求。 现房销售改革大大降低了住房交付的风险，维护了消费者权益，鼓励提供高质量的产品。购房贷款贴息政策则有效支持了住房市场的需求，有助于促成供求的进一步平衡。当供求两边的政策都达到了质变阶段，我们相信居民的信心也就会随着交易量的放大而逐步修复。我们相信，当前既是房地产从房价下跌周期走向房价回升周期的拐点，也是房地产市场从量大管饱，粗放发展，走向高品质开发，高质量发展的拐点。此外，由于未来房地产市场的品牌溢价可能扩大，产品差异度可能增加，且开发企业的资金链阶段性偏紧，即便房价回暖，我们认为土地价格的上涨幅度也可能十分有限。开发企业可以不再困扰于周期性原材料价格上升和商品价格下降，得以积极打磨产品，阶梯式满足不同需求的需要。 ▍风险因素： 受回款速度放缓的影响，大多数发展商可能会在2026年四季度经历一个资金链更紧的阶段；市场需求复苏可能需要一个过程，2027年之前不少城市景气度仍然不明朗的风险。 ▍投资策略： 和历史上的需求提振政策相同，我们认为价格信号的反转对于企业盈利修复，估值提升将有决定性作用。但和历史上每一次需求提振政策不同，我们认为全市场的新房开发规模难有明显提升，消化库存防范风险是当前的主旋律，而传统的，以量驱动的房地产产业链逻辑难以成立。当然，随着房价风险的消除，金融体系风险也会下降，内需相关的资产也可能边际受益。#文字观点", "publish_time": "2026-09-30 14:15", "tags": ["文字观点"]}, "attachment:files/【机构调研】这家算力租赁服务商经营实现跨越式反转，在手5年期框架订单规模超160亿元.pdf": {"id": "attachment:files/【机构调研】这家算力租赁服务商经营实现跨越式反转，在手5年期框架订单规模超160亿元.pdf", "kind": "attachment", "title": "【机构调研】这家算力租赁服务商经营实现跨越式反转，在手5年期框架订单规模超160亿元", "source_label": "其他", "excerpt": "第1页/共14页本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明证券Ⅱ 分析师：张洋 登记编码：S0730516040002 zhangyang-yjs@ccnew.com021-50586627券商板块2026年8月回顾及9月前瞻 ——券商板块月报", "content": "第1页/共14页本报告版权属于中原证券股份有限公司www.ccnew.com 请阅读最后一页各项声明证券Ⅱ 分析师：张洋 登记编码：S0730516040002 zhangyang-yjs@ccnew.com021-50586627券商板块2026年8月回顾及9月前瞻 ——券商板块月报 证券研究报告-行业月报 同步大市(维持) 证券Ⅱ相对沪深300指数表现 资料来源：中原证券研究所，聚源 相关报告 《证券Ⅱ行业月报：券商板块2026年7月回 顾及8月前瞻》2026-08-28 《证券Ⅱ行业月报：券商板块2026年6月回 顾及7月前瞻》2026-07-30 《证券Ⅱ行业月报：券商板块2026年5月回 顾及6月前瞻》2026-06-29 联系人：李智 电话：0371-65585629 地址：郑州郑东新区商务外环路10号18楼 地址：上海浦东新区世纪大道1788号T1座22楼发布日期：2026年09月28日 券商板块2026年8月行情回顾：8月券商指数一度破位下行，但 月末强势拉回，仍保持较强的指数韧性。中信二级行业指数证券Ⅱ 全月上涨0.09%，跑输沪深300指数（上涨0.80%）0.71个百分 点。8月券商板块延续相对强弱格局，跑赢券商指数的个股数量有 所减少，板块平均P/B的震荡区间下移至1.227-1.282倍。 影响上市券商2026年8月月度经营业绩的核心市场要素：1.权益 企稳反弹、固收冲高震荡，自营业务环比明显改善。2.月度日均股 票成交量降幅进一步扩大，成交总量降幅更为明显，经纪业务景气 度环比明显回落。3.两融余额呈现明显韧性，年内两融日均余额增 幅小幅收窄。4.股权融资规模明显下滑，债权融资规模环比回升至 年内的次高位，行业投行业务总量环比明显回落。 上市券商2026年9月业绩前瞻：自营：权益自营经营环境再度转 弱，固收市场震荡小幅上行，自营业务将受权益自营的影响出现回 落。经纪：月度日均股票成交量大概率将创年内新低，月度成交总 量将降至年内次低位，经纪业务景气度仍将进一步下行。两融：年 内两融日均余额增幅将保持收窄趋势，两融业务对上市券商单月经 营业绩的边际贡献度环比仍将有所下降。投行：股权融资规模环比 小幅下滑，债权融资规模环比小幅下降，投行业务总量环比将小幅 回落。整体经营业绩：综合目前市场各要素的最新变化，预计9月 上市券商母公司口径单月整体经营业绩环比将再度有所回落。 投资建议：9月券商指数月中再创七月初见反弹高点回落调整以来 新低，下半月反弹力度偏弱，近日再现中阴线，击穿月中低点再创 调整新低的态势较为明显。月 ，⾼端订阅每⽉500美元，是Muse⾼阶版的5倍。报道： OpenAI拟融资⾄少300亿美元，⽬标估值1.4万亿美元。报道：OpenAI年化经常性收⼊逼近7 00亿 美元，甲⻣⽂股价⼀度涨超8%\u0001 • 苹果新帅Ternus推进内部改⾰：加快产品开发，精简组织架构\u0001 • Muse需求传导⾄CPU，CPU交货期拉⻓⾄25-30周\u0001 • Anthropic递交招股书：去年亏损420亿美元，收⼊增⻓12倍⾄46亿美元，⻛险部分警告“威胁⼈ 类⽣存”\u0001 今⽇⽬录\u0001 • ⾼盛判断核⼼通胀可控\u0001实际加息仅2⾄3次（1）\u0001 • 美国中选若形成分裂政府将利空美元（1）\u0001 • 花旗整理了⼀份中国⽩酒排⾏榜（1）\u0001 • 房贷补贴只覆盖不到⼀半\u0001⼩摩劝你别急着追地产股（1） ✏⾼盛：全球市场观点，缓解路径增多\u0001 1.⻛险定价更充分，缓解路径显现。尽管利率、能源价格和AI仍是主要⻛险因素，但市场定 价已向不利⽅向调整，使得⻛险收益⽐转向建设性⼀侧。能源价格上涨推⾼了前端利率定 价，但若能源价格回落，将为债券、股票和新兴市场套息交易带来最直接的缓解。\u0001 2.周期性动能依然强劲。尽管⾯临能源冲击，发达市场和新兴市场的经济增⻓势头出乎意料 地坚韧。美国三季度GDP增速追踪值约为3%，失业率显著下降。财政⽀出（如美国和德 国）以及AI基础设施、国防和能源架构的投资热潮⽀撑了增⻓。\u0001 3.加息预期已过度定价。市场⽬前定价的美联储、欧洲央⾏和英国央⾏累计加息幅度远⾼于 ⾼盛的基本预测。⾼盛认为核⼼通胀压⼒有限，实际加息次数可能少于市场预期（2-3次 ⽽⾮7-8次），这为远期利率对冲提供了机会。\u0001 4.股市短期上⾏路径更清晰。得益于强劲的盈利增⻓和AI繁荣，尽管估值倍数下降，但市场 对\u0001upside\u0001surprises\u0001的⻔槛降低。随着⻛险在定价中更充分反映，尤其是纳斯达克近期的 反弹，股市短期内具备更好的上⾏跑道。\u0001 5.美元漂移与⽇元潜在⾛强。美联储鹰派加息⽀撑美元短期表现，但⾼盛不预期美元会获得 全⾯强劲⽀持。相反，⽇本国内政策转变（包括更快的加息和⼲预⽴场）使得⽇元从当前 ⽔平⾛强的空间⼤于⾛弱空间。⼈⺠币预计将在全球贸易关系稳定背景下逐步升值。\u0001 9⽉已实施加息，但市场定价隐含更多加息\u0001 ✏美银：美元与中期选举，驾驭巨轮\u0001 1.中期选举对美元影响有限，⺠主党全⾯获胜可能导致美元过度⾛弱后反弹。市场普遍预期 若⺠主党控制国会将对美元不利，但美银美林认为这种影响被夸⼤。若出现⺠主党全⾯掌 控局⾯，初期可能因增⻓和利率预期下降导致美元⾛弱，但这提供了逢低买⼊美元的机 会，因为更⼤的信号在于2028年⼤选前景。\u0001 2.分裂政府局⾯并⾮如共识般利空美元，反⽽可能因降低美联储独⽴性⻛险⽽⽀撑美元。预 测市场显⽰分裂政府概率⾼达90%。虽然传统观点认为缺乏财政刺激和潜在监管增加利空 美元，但美银美林指出，僵局对经济冲击有限（美元中性）。更重要的是，若⺠主党控制 参议院，将掌握美联储提名权，从⽽降低市场对“美联储独⽴性”受损的⻛险溢价，这对 美元构成正⾯⽀撑。\u0001 3.共和党全⾯获胜虽可能引发美元膝跳式反弹，但⻓期受财政⻛险和地缘政治主导。共和党 全⾯获胜被视为最⼤意外，短期内可能因再通胀政策和AI监管放松预期推动美元上涨。然 ⽽，⻓期来看，财政⾚字⻛险和伊朗等地缘政治冲突可能推⾼能源价格和收益率曲线⻓ 端，从⽽限制甚⾄逆转美元的涨幅。\u0001 尽管分裂政府概率上升，美元近期仍⾛强\u0001 ✏Citi：中国⽩酒，更新⾏业排序，茅台>汾酒>⽼窖>五粮液>洋河\u0001 1.更新⾏业排序：茅台\u0001>\u0001汾酒\u0001>\u0001泸州⽼窖\u0001>\u0001五粮液\u0001>\u0001洋河。基于近期渠道调研，经销商在中 秋和国庆双节前备货谨慎，花旗对2026年下半年中国⽩酒⾏业需求预期较低。继续看好茅 台由直销（DTC）驱动的⾼端⽩酒策略，对次⾼端和区域酒企持谨慎态度。将洋河评级从 “买⼊”下调⾄“卖出”。\u0001 2.茅台具备六⼤积极因素，是⾏业⾸选。尽管⾏业⾯临去库存压⼒，但茅台被视为例外。其 ⼆季度销售疲软主要源于向DTC模式转型的节奏调整，⽽⾮需求疲软。随着第⼆轮平均售 价（ASP）上调⽣效，部分库存可能从⼆季度转移⾄三季度以充分享受提价红利。此外， ⽑利率同⽐降幅收窄，经营性现⾦流⼤幅跃升，机构投资者情绪可能已触底，且有望受益 于资⾦回流中国必需消费品板块。\u0001 3.洋河盈利不确定性最⾼，降级为“卖出”。洋河在⽩酒⾏业中盈利不确定性最⼤，因其现 ⾦收⼊占权责发⽣制销售收⼊的⽐例最低（仅83%），经销商预付款疲软，且利润率⾯临 更⼤下⾏压⼒。因此，将其评级下调⾄“卖出”，⽬标价⼤幅下调⾄23.3元⼈⺠币。\u0001 4.五粮液⾯临持续运营不确定性，维持“卖出”。五粮液此前对历史财务报表进⾏重⼤“重 述”，实质上是⼤规模的渠道库存回收计划。尽管有低基数效应和回购计划，但经销商合 同负债下降，暗⽰对三季度持保守态度，盈利能⻅度较低。\u0001 2026年上半年五家主要⽩酒企业销售额与净利润同⽐变动对⽐（%）\u0001 ✏⼩摩：中国房地产与银⾏，房贷补贴政策出台，姿态积极但⼒度低 于预期\u0001 1.房贷补贴政策细节公布，整体⼒度温和且限制较多。政府公布了新的房贷补贴政策，这是 ⾃2024年9⽉以来⾸次全国性楼市⽀持政策。政策规定仅限⾸套房、建筑⾯积⼩于120平 ⽅⽶、房价低于150万元⼈⺠币的购房者享受100个基点的利率补贴（有效利率从3.05%降 ⾄2.05%），补贴期限5年，单⼾最⾼补贴5万元。由于标准较严，预计全国仅46%的成交 量和31%的成交值符合资格，对头部上市房企的直接利好有限（预计不⾜10%的销售符合 条件）。\u0001 2.政策⽅向正⾯但⾮转折点，短期可能引发获利回吐。尽管政策⽅向积极，显⽰出政府稳定 楼市的决⼼，但由于节省的利息成本（约占总房款的3.3%）可能不⾜以显著改变购房者 的决策，因此不被视为游戏改变者。中国房地产板块近期已上涨12%，主要受市场投机驱 动，鉴于政策⼒度低于市场预期，预计短期内会出现获利回吐现象。\u0001 3.⻉壳找房为主要受益者，优选华润系，回避困境房企。在房地产⾏业中，⻉壳找房（KE\u0001 Holdings）被视为关键受益者。其他偏好标的包括华润万象⽣活（CR\u0001Mixc）和华润置地 （CR\u0001Land），建议逢低买⼊。对于万科等陷⼊困境的房企，建议在反弹时卖出。对于银 ⾏板块，政策对贷款增⻓有边际正⾯影响，但对资产质量影响有限，邮储银⾏（PSBC） 因房贷占⽐⾼且在下沉市场\u0001exposure\u0001较⼤，可能是主要受益者。\u0001 中国房地产板块个股⾃近期低点（2026年9⽉17⽇）以来的股价表现（%）\u0001 看推\u0001 中期选举与股市：历史性的“先抑后扬”规律\u0001 实际收益率飙升推动美国国债收益率上涨\u0001 美债买家换⼈：稳定币发⾏商崛起，中国持续减持\u0001 汽⻋⾏业利润率持续快速下滑\u0001 股市与利率波动的脱钩现象\u0001 美国电⼒结构加速“去煤化”，天然⽓与可再⽣能源接棒\u0001 全球原油成本曲线：海湾产油国拥有显著成本优势\u0001", "status": "extracted"}, "post:2026-09-30T12-30:c6e6c6a31b03": {"id": "post:2026-09-30T12-30:c6e6c6a31b03", "kind": "post", "title": "2026-09-30 12:30", "source_label": "帖子正文", "excerpt": "摩根大通——中国电池与材料：铜箔供应紧张随涨价缓解；十月产量展望 一、核心论点与宁德时代（CATL）近况 宁德时代A/H股9月迄今分别回调18%（vs. 沪深300指数-6%），主因市场担忧需求放缓、竞争加剧及减产风险。", "content": "摩根大通——中国电池与材料：铜箔供应紧张随涨价缓解；十月产量展望 一、核心论点与宁德时代（CATL）近况 宁德时代A/H股9月迄今分别回调18%（vs. 沪深300指数-6%），主因市场担忧需求放缓、竞争加剧及减产风险。摩根大通在9月2日的产量展望中曾提示铜箔供应紧张为短期制约，此后投资者对进一步减产的关注度持续升温。ZE Consulting于9月15日盘后发布月中更新，将CATL 9月产量预期下调12%，最新更新中再砍3%，累计下调幅度达14%，致其9月产量环比增速由+9%下修至-5%。经渠道核验，CATL与铜箔供应商的定价谈判已于9月下旬落定，加工费上调约1,000–2,000元/吨（仅相当于电池成本的0.1–0.2%），供应瓶颈已基本解除。ZE Consulting预计CATL 10月产量将环比反弹6%，恢复至8月水平；原材料采购量亦将从10月中旬起加速，进一步支撑生产动能。基于当前趋势，摩根大通估算CATL 2026全年产量将突破1.1TWh、销量接近1.0TWh（同比增长约50%）。CATL仍是摩根大通中国电池产业链的首选标的（Top Pick）。 二、二线厂商追赶态势与市场份额再平衡 3Q26行业前六电池制造商（比亚迪、CATL、国轩、亿纬、中航锂电、瑞浦）合计产量同比增长62%，其中CATL增速66%，其余五家合计增速59%，差距由2Q26的38个百分点显著收窄至7个百分点。10月排产延续该趋势：亿纬（+11% m/m）与中航锂电（+19% m/m）环比增幅领先，CATL亦恢复+6%。摩根大通认为，差距收敛主要反映二线产能爬坡及CATL 9月临时性供应扰动，而非结构性竞争力丧失；但市场份额正常化的担忧确实对近期投资者情绪及CATL股价构成压制。 三、十月产量整体展望与需求驱动力 1–10月主要电池制造商产量预计同比增长约55%，增速呈逐季加速：1Q26 +40% → 2Q26 +60% → 3Q26 +62%。核心需求支撑包括： • 储能（ESS）需求强劲：据ICCSino数据，中国厂商8M26储能电池出货同比增长95%； • 电动车出口高增：8M26中国电动车出口同比激增近130%，同期欧洲电动车销量增长逾40%； • 中国商用车电动化提速：8M26商用车销量同比+45%，带电量同比+70%，重卡为关键增量； • 单车带电量跃升：8M26中国乘用车平均电池容量同比提升9kWh（约+21%），部分对冲了国内乘用车零售的疲软（CPCA预计9M26国内零售同比-12%）。 四、锂价与产业链价格传导 • 锂盐供应与库存：ZE Consulting预计10月中国碳酸锂产量环比微降约1%，因新增产能及津巴布韦矿石到港被检修减产抵消。现货及期货价格分别软至13.2万元/吨、11.9万元/吨，远期曲线陷入backwardation。9月24日当周库存数据出现分化，旧样本结束连续4个月去库后小幅回补，市场对新样本去库持续性存疑。 • 2027年锂价展望：市场焦点转向储能需求增长的可持续性，短期锂价料继续承压。 • 电池价值链选择性涨价：3Q26至今，碳酸锂/氢氧化锂价格分别下跌10%/14%，正极材料跌8–11%；而铜箔因供需偏紧加工费上涨4–10%（6μm涨幅大于5μm），电解液价格上涨12–18%。EV电池价格持稳，储能电池8月环比+2.7%，主要反映9月1日起实施的2%消费税传导。 五、关键数据节点与估值比较 • 全球新能源车渗透率：8M26中国达65%（同比+3%），欧洲EU-5达39%（+53% y/y），美国仅7%（-45% y/y）。 • 中国电池产量：9月前六家合计预计同比+57%、环比持平（较月初预期-7%），10月预期同比+55%、环比+5%。 • CATL对理想汽车出货量：图表显示其供货份额及绝对量维持高位。 • 估值表要点：CATL-A/H对应26/27年P/E约20x/16x，EV/EBITDA约15x/12x，股息率约1.5%/2.0%，ROE维持25%+，在产业链中估值溢价具备基本面支撑。 六、策略结论 铜箔供应扰动属短期噪音，非需求坍塌。随着加工费谈判落地，CATL 10月排产反弹将验证“瓶颈解除→产量修复”逻辑。二线厂商扩产带来的份额再平衡是中期变量，但CATL在技术、客户结构及海外布局上的护城河未受动摇。储能与出口的高增长足以对冲国内乘用车销售波动，单车带电量提升进一步放大电池需求。锂价短期弱势不构成板块核心矛盾，产业链利润正从上游向具备定价权的电池龙头及结构性紧缺材料（铜箔、电解液）转移。维持CATL Overweight评级，建议逢低布局。#文字观点", "publish_time": "2026-09-30 12:30", "tags": ["文字观点"]}, "post:2026-09-30T15-58:71638ae610a9": {"id": "post:2026-09-30T15-58:71638ae610a9", "kind": "post", "title": "2026-09-30 15:58", "source_label": "帖子正文", "excerpt": "9月30日复盘笔记：创新药/人形机器人/固态电池/汽车/AI 应用/乳业/白酒/电力/房地产/农业等一、重磅财经信息①2026年2500亿元超长期特别国债支持消费品以旧换新资金已全部下达。②9月份制造业采购经理指数（PMI）为50.1% 比上月上升0.3个百分点。", "content": "9月30日复盘笔记：创新药/人形机器人/固态电池/汽车/AI 应用/乳业/白酒/电力/房地产/农业等一、重磅财经信息①2026年2500亿元超长期特别国债支持消费品以旧换新资金已全部下达。 ②9月份制造业采购经理指数（PMI）为50.1% 比上月上升0.3个百分点。 ③广州：8月28日后出让商品住房项目预售须单体建筑主体结构封顶。二、大盘表现沪指涨0.31%，深证成指跌0.11%，创业板指跌0.23%，科创50跌2.51%。沪深 1.政策态度重于力度，属破天荒突破：这是中央财政首次对地产行业进行补贴、首次对居民房贷实施 贴息，凸显稳增长压力下中央对地产态度的重大转变——从过去\"除了给钱什么都给\"到如今\"真金白银 给钱\"。政策被定位为\"住房领域保障和改善民生方式的一种探索\"，效果好则继续加码，效果不佳则尝 试其他思路，最终目标都是推动房地产止跌回稳。 2.政策要点：锁定刚需与二三线去库存：购房总价限制在150万以内、贷款总额100万以内，新房与 二手房均覆盖。政策重点在于支持刚需和二三线城市去库存，对一线城市影响相对有限。 3.一线城市受益有限，商贷贴息与公积金互为补充：一线城市公积金额度充足（个人120万、家庭最 高240万以上），可完全覆盖150万以内房产贷款；商贷贴息后利率（2%）虽低于公积金 （2.6%），但仅贴五年，而公积金低利率可持续30年，故一线购房者大概率仍选公积金。但公积金覆 盖人口占比不足20%，个体企业主、自由职业者等无法使用公积金，商贷贴息对他们构成明显增量； 且按揭平均久期仅约十年，五年贴息摊薄后约等于全周期每年降50BP，对计划5—10年内换房或提前 还款者更有利。 4.资金安排不设上限，态度坚决：三部委明确资金总规模不设上限、预算充分安排，不同于上海\"先到 先得、额度有限\"的做法，体现财政贴息态度坚决。 5.财政支出测算：年新增按揭约3万多亿，150万以内房源成交套数占比平均约70%（三四线及中西 部二线可达90%以上），覆盖贷款约2万亿；扣除约20%公积金用户后，商贷贴息覆盖约1.6万亿； 中央承担90BP，对应每年财政支出约140—150亿元。若政策延续五年，五年合计贴息约1500亿— 2000亿元；若一年到期不再续做，五年合计约750亿元（七八百亿）。 6.对地产行业影响：直接作用于房价：参考香港经验，当房贷利率低于租金收益率时，能有效带动房 价止跌回稳乃至回升。本次贴息可在五年内降低居民实际房贷利率，直接作用于房价，有望带动止跌回 稳，是政策对行业最大的助力。 7.投资建议：利好刚需与二三线布局开发商：政策更利好刚需产品和二三线布局较多的开发商，一线 城市受益相对有限。持续看好地产板块四季度表现；若力度不足，政策仍可能继续加码，公积金贷款利 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 率调降大概率加速落地。重点推荐A股保利、招商蛇口、滨江、新城；港股华润、建发、金茂、绿 城、中海外宏洋（中海旗下专注低层级城市，弹性较大）。 问答整理 Q1：这个政策到底是超预期、不及预期还是符合预期？ 答：我们认为应当更多从态度上看，而不是从力度上看，总体来看态度比力度更重要。之前中央财政对 消费补贴比较多，包括新能源汽车、家电等消费类补贴，但从来没有尝试过对地产行业进行补贴，这次 是破天荒第一次对居民房贷进行贴息，是突破性的、比较超预期的态度，本质上凸显出当前稳增长压力 下中央对地产行业态度的重大转变。之前大家调侃中央对地产的支持\"除了给钱，什么都给\"，这次确实 是真金白银地给钱了。在三部委答记者问中，相关负责人回答政策主要内容时第一句话就提出：中央财 政实施居民购房贷款贴息政策，是住房领域保障和改善民生方式的一种探索。\"一种探索\"四个字说得很 明白——过去探索过消费补贴、一线城市限购放松、降低首付比例等方式，效果整体一般，所以现在进 一步探索房贷贴息是否可行。如果效果好，后面可能继续加大力度；如果效果不好，可能还会尝试其他 思路，但总体目的不变，都是为了支持房地产行业平稳健康发展、推动止跌回稳。 Q2：政策有哪些亮点和要点？ 答：政策对购买房屋总价和贷款总额都做了限制：购房总价150万以内、贷款总额100万以内，基本 锁定支持刚需和二三线城市去库存。政策同时涵盖新房和二手房。一线城市150万以下的二手房也有 不少比例，但经过最近一年一系列放松，一线城市公积金贷款额度都放宽到比较高的程度，比如北京、 上海个人都可以贷120万公积金，家庭最高可以到240万甚至三百多万，所以对一线城市来说，150 万以内的二手房即便个人公积金也有120万，足以覆盖所有贷款额度，可以全部用公积金贷款。公积 金贷款当前利率是2.6%，商贷贴100BP之后利率是2%，看起来商贷贴息后利率更低，但商贷贴息只 贴五年，而公积金贷款的低利率可以贷30年。所以对一线城市来说，大多数人可能还是会选择公积金 贷款。因此我们认为，政策虽然没有明确排除一线城市，但政策目的和聚焦点更多还是帮助二三线乃至 三四线城市去库存，因为低层级城市公积金贷款最高额度往往偏低，有一部分可能无法完全覆盖150 万以内房子的贷款额度。 Q3：商贷贴息是不是\"鸡肋\"政策？ 答：不能完全这么认为。虽然公积金贷款相比商贷有优势，但公积金覆盖人数比例比较低，按之前看到 的数据，有公积金的人数在我国总人口中的占比可能连20%都不到，大批个人企业主、自由职业者等 可能都无法借公积金贷款，商贷贴息政策对他们来讲有比较大的增量，能与公积金贷款形成互为补充的 作用。同时，按揭平均久期虽然最长期限是30年，但真正贷满30年的人比较少，按了解到的数据， wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 按揭平均久期可能只有十年左右，大部分人因为换房或提前还款等原因，平均十年左右就会还清按揭。 对一个平均久期为十年的按揭品种来说，持续五年的贴息时间并不算短，相当于把100BP贴五年分散 到十年，等价于整个贷款周期中每年降了50BP，相比公积金贷款也具有一定优势。所以这取决于购房 者的打算：如果准备贷满30年，公积金贷款更有优势；如果准备5到10年内换房或提前还款，商贷 贴息反而可能更有利。 Q4：财政能出多少钱、贴多少、有没有额度限制？ 答：在三部委答记者问中，相关负责人明确表示，执行中资金总规模不设上限，预算也做了充分安排， 可见这次财政贴息的态度比较坚决，甚至没有对补贴资金额度设置上限。相比之前上海的补贴说\"先到 先得、额度有限\"，这次财政部做了一个广泛的大范围贴息，甚至没有设置补贴额度上限，表明政策态 度还是比较坚决的。 Q5：财政资金规模大概如何测算？ 答：按照最近几年每年新增按揭贷款规模大概三万多亿来算，从冰山指数和中指院拉的数据看，150万 以内的房子在各个城市的成交占比，虽然样本有限，但可以看到三四线城市以及中西部一些二线城市， 150万以内房子的成交套数占比可能达到90%以上，一线、二线城市会低一些，特别是东部沿海城 市，平均来看占比70%应该没有问题。三万多亿按揭规模乘以70%的占比，大概可以假设覆盖的贷款 范围约两万多亿。但这两万多亿中肯定有一部分会用公积金贷款，参考公积金贷款覆盖比例大概 20%，按20%估算，两万多亿的总覆盖范围中，20%选择公积金，另外80%选择商贷贴息，能覆盖的 按揭贷款总额度大概1.6万亿左右。贴100BP中90BP由中央财政出、10BP由地方财政出，所以对中 央财政来说还要乘以0.9，大概每年是一百四五十亿的财政支出力度。第一年贴一百四五十亿，到第二 年既要贴第二年的增量，第一年的量也要继续贴，假如第一年是150亿，第二年就需要贴300亿，第 三年450亿，第四年600亿，第五年750亿，这样的等差数列。整体算下来，如果政策延续，五年合 计贴息可能总共在1500亿到2000亿之间。如果按一年到期就结束、不再续做的话，五年时间每年贴 150亿左右，总的贴息额度大概750亿，也就是七八百亿的规模。财政部相关负责人表示\"资金额度不 设上限、财政贴息资金足额保障\"，体现的是中央政府层面对于贴息的坚定态度。从力度上看，中央财 政合计七八百亿的支出，对当前本身就比较有限、有压力的中央财政资金来说，也是非常有诚意的政 策。 Q6：这个政策对地产行业会有什么影响？ 答：最重要的一点在于，参考香港去年房价止跌回稳乃至止跌回升的经验，其中最重要的经验是：当房 贷利率低于租金收益率时，能够有效带动房价止跌回稳乃至止跌回升。这次房贷贴息起码可以在五年内 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 有效降低居民的实际房贷利率水平，有望带动整个房价止跌回稳，所以它可以直接作用于房价，这是我 们认为它对地产行业最大的助力。 Q7：对地产板块的投资建议是什么？ 答：这次房贷贴息迅速落地，整体看态度和中央财政支持力度都比较超预期。之前很多人觉得是不是只 贴新房，这次明确不光贴新房，二手房也在体系范围之内，范围上也比较超预期。政策最核心的还是聚 焦于刚需和二三线城市去库存，对一线城市的影响相对小一些，所以政策更加利好刚需产品和二三线布 局比较多的开发商。整体来看，我们持续看好地产板块四季度的表现。从态度上可以看出，如果政策力 度不够，后期完全可能继续加码，直到推动房地产市场止跌回稳为止。后续还有更多政策值得期待，典 型如公积金贷款利率的调降，后续大概率会加速落地。从标的上讲，我们重点推荐关注A股的保利、 招蛇、滨江、新城；港股的华润、建发、金茂、绿城，还有中海外宏洋。  _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 所以这取决于购房者的打算：是准备还30年，还是买房后5到10年就换房或提前还款。如果准备贷 满30年，毫无疑问公积金贷款更有优势；如果准备5到10年内换房或提前还款，商贷贴息反而可能 是更有利的选择。所以我们不能完全认为商贷贴息是\"鸡肋\"政策，它与公积金贷款是互相补充的。 第二点，大家比较关注财政能出多少钱、贴多少、有没有额度限制。同样在三部委答记者问中，相关负 责人明确表示，执行中资金总规模不设上限，预算也做了充分安排。可见这次财政贴息的态度比较坚 决，甚至没有对补贴资金额度设置上限。相比之前上海的补贴说\"先到先得、额度有限\"，这次财政部做 了一个广泛的大范围贴息，甚至没有设置补贴额度上限，这也表明政策态度还是比较坚决的。 当然，由于政策本身的限制条件比较多，我们可以粗略估算需要动用的财政资金。按照最近几年每年新 增按揭贷款规模大概三万多亿来算。我们大概从冰山指数和中指院拉了一下数据，看150万以内的房 子在各个城市的成交占比。虽然样本有限、无法覆盖所有城市，但可以看到，三四线城市以及中西部一 些二线城市，150万以内房子的成交套数占比可能达到90%以上；一线、二线城市会低一些，特别是 东部沿海城市。平均来看，占比70%应该没有问题。 三万多亿按揭规模乘以70%的占比，大概可以假设覆盖的贷款范围约两万多亿。但我们也要注意，这 两万多亿中肯定有一部分会用公积金贷款，不会全部用商贷贴息。参考刚才的数据，公积金贷款覆盖比 例大概是20%。按20%估算，两万多亿的总覆盖范围中，20%选择公积金，另外80%选择商贷贴息， 能覆盖的按揭贷款总额度大概1.6万亿左右。贴100BP中90BP由中央财政出、10BP由地方财政出， 所以对中央财政来说还要乘以0.9，大概每年是一百四五十亿的财政支出力度。 当然也要注意，第一年贴一百四五十亿，到第二年既要贴第二年的增量，第一年的量也要继续贴。假如 第一年是150亿，第二年就需要贴300亿，第三年450亿，第四年600亿，第五年750亿，这样的 等差数列。整体算下来，如果政策延续，五年合计贴息可能总共在1500亿到2000亿之间。 当然，政策是先给了一年的时间期限。如果按一年到期就结束、不再续做的话，五年时间每年贴150 亿左右，总的贴息额度大概750亿，也就是七八百亿的规模。这是我们做的简单估算。当然还要注意 财政部相关负责人表示\"资金额度不设上限、财政贴息资金足额保障\"，这句话体现的是中央政府层面对 于贴息的坚定态度。我之前说过，态度比力度更重要。从力度上看，中央财政合计七八百亿的支出，对 当前本身就比较有限、有压力的中央财政资金来说，也是非常有诚意的政策。这是从中央财政支出力度 上做的简单测算。 这个政策对地产行业会有什么影响？我认为最重要的一点在于，参考香港去年房价止跌回稳乃至止跌回 升的经验，其中最重要的经验是：当房贷利率低于租金收益率时，能够有效带动房价止跌回稳乃至止跌 回升。这次房贷贴息起码可以在五年内有效降低居民的实际房贷利率水平，有望带动整个房价止跌回 稳，所以它可以直接作用于房价。这是我们认为它对地产行业最大的助力。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 最后，从对地产板块的投资建议来讲，我们认为这次房贷贴息迅速落地，整体看态度和中央财政支持力 度都比较超预期。之前很多人觉得是不是只贴新房，这次明确不光贴新房，二手房也在体系范围之内， 范围上也比较超预期。当然我们刚才分析过，政策最核心的还是聚焦于刚需和二三线城市去库存，对一 线城市的影响相对小一些，所以政策更加利好刚需产品和二三线布局比较多的开发商。 整体来看，我们持续看好地产板块四季度的表现。从态度上可以看出，如果政策力度不够，后期完全可 能继续加码，直到推动房地产市场止跌回稳为止。后续还有更多政策值得期待，典型如公积金贷款利率 的调降，后续大概率会加速落地。 从标的上讲，我们重点推荐关注A股的保利、招蛇、滨江、新城；港股的华润、建发、金茂、绿城， 还有中海外宏洋。中海外宏洋是中海下面侧重做低层级城市的子公司，在这一轮政策中受益可能比较 大，弹性也会相对大一些。以上就是我们的观点汇报，今天的会议先到此结束，谢谢大家。 全文详细总结一、政策总基调：态度重于力度这是中央财政第一次对地产行业进行补贴，也是首次对居 民房贷实施贴息，属于\"破天荒\"的突破，凸显中央在稳增长压力下对地产态度的重大转变——从过去\" 除了给钱什么都给\"到如今\"真金白银给钱\"。 政策被定位为\"住房领域保障和改善民生方式的一种探索\"：效果若好则继续加码，效果不佳则尝试其他 思路，最终目标都是推动房地产行业止跌回稳。 二、政策要点覆盖范围：购房总价150万以内、贷款总额100万以内，新房、二手房均覆盖，重点锁 定刚需和二三线城市去库存。 对一线城市影响有限：一线城市公积金额度充足（个人120万、家庭最高240万以上），可完全覆盖 150万以内房产贷款；虽然商贷贴息后利率（2%）低于公积金（2.6%），但贴息仅五年，公积金低利 率可持续30年，因此一线购房者大概率仍选公积金。 商贷贴息的补充价值：公积金覆盖人口占比不足20%，个体企业主、自由职业者等无法使用公积金， 商贷贴息对他们是明显增量；且按揭平均久期仅约十年，五年贴息摊薄后约等于全周期每年降50BP， 对计划5—10年内换房或提前还款者更有利。结论：商贷贴息与公积金贷款互为补充，并非\"鸡肋\"。 资金安排：三部委明确资金总规模不设上限、预算充分安排，态度坚决，不同于上海\"先到先得、额度 有限\"的做法。 三、财政支出测算年新增按揭约3万多亿，150万以内房源成交套数占比平均约70%（三四线及中西 部二线可达90%以上），覆盖贷款约2万亿。 扣除约20%公积金用户后，商贷贴息覆盖约1.6万亿；中央承担90BP，对应每年财政支出约140— 150亿元。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 若政策延续五年，因存量逐年累积，五年合计贴息约1500亿—2000亿元；若一年到期不再续做，五 年合计约750亿元（七八百亿），对财政仍具诚意。 四、对地产行业的影响参考香港经验：当房贷利率低于租金收益率时，能有效带动房价止跌回稳乃至回 升。本次贴息可在五年内降低居民实际房贷利率，直接作用于房价，有望带动止跌回稳，是政策对行业 最大的助力。 五、投资建议政策更利好刚需产品和二三线布局较多的开发商，一线城市受益相对有限。 持续看好地产板块四季度表现；若力度不足，政策仍可能继续加码，公积金贷款利率调降大概率加速落 地。 重点推荐：A股保利、招商蛇口、滨江、新城；港股华润、建发、金茂、绿城、中海外宏洋（中海旗下 专注低层级城市，弹性较大）。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-09-30T14-28:cf86008701cd": {"id": "post:2026-09-30T14-28:cf86008701cd", "kind": "post", "title": "2026-09-30 14:28", "source_label": "帖子正文", "excerpt": "🚩AI 热潮加剧 PCB 供应链压力，材料与设备短缺将持续至 2027 年 📈自 2025 年下半年以来，AI 服务器与高速网络需求的快速增长，已导致 PCB、IC 载板以及核心材料供应全面趋紧。⚠️即使在 2026 年，供应改善的信号仍有限。", "content": "🚩AI 热潮加剧 PCB 供应链压力，材料与设备短缺将持续至 2027 年 📈自 2025 年下半年以来，AI 服务器与高速网络需求的快速增长，已导致 PCB、IC 载板以及核心材料供应全面趋紧。 ⚠️即使在 2026 年，供应改善的信号仍有限。供应短缺首先从低 CTE 和低 Dk2 玻璃纤维布以及 HVLP4 铜箔等先进材料开始，此后已蔓延至 CCL、高阶 PCB、ABF 载板、制程设备以及耗材。 📅交期开始拉长，甚至部分中低阶材料与通用 CCL 等级也出现涨价迹象。 🔎截至 2026 年第二季度，先进材料、PCB、载板以及特定制程设备的供应仍维持紧绌状态。 🏭PCB 与载板厂商、材料供应商以及设备制造公司皆在扩增产能，新产能预计将于 2027 年至 2029 年陆续上线。 ❗然而，随着 AI 需求持续上升以及规格要求提高，客户认证与良率爬坡需时，短期内新增供应难以完全填补供需缺口。 ✅因此，PCB 供应链的紧绌状态很可能将持续至少至 2027 年。 🏢台湾 PCB 制造供应链包括臻鼎、欣兴、景硕、华通、华邦、金居、楠梓电以及华星科。 📦主要材料供应商包括联茂、南亚、台光、伊特、台玻、富喆、科定、东台以及上福。 ⚙️主要设备供应商包括新高、GPM、上银、永光、大同以及亚金属。 📊根据台湾印刷电路协会（TPCA）统计，2026 年上半年台湾 PCB 材料产业国内外生产总值达新台币 2716 亿元（年增 38.6%）。 📈增长主要受硬板用高频高速 CCL 带动，而玻璃纤维布与铜箔等核心材料供应短缺状况持续。 💹产能紧绌与原物料成本上涨，导致材料供应商逐步调涨价格，进而推升 PCB 材料生产总值。 📋同期，台湾 PCB 设备产业国内外生产总值达新台币 460.8 亿元（年增 27.8%）。 🔧机械钻孔设备与钻头表现特别强劲。 📐随着 PCB 层数与厚度增加，钻孔复杂度上升，带动相关设备、工具与材料使用量提升。 🚀2026 年 AI 服务器与高速网络需求的扩张，正带动台湾 PCB 供应链整体成长，同时加速材料与制程设备的技术进步。 📈此趋势提升了台湾 PCB 产业生产总值今年再度创下新高的可能性。 🔮TPCA 预测，AI 应用扩展以及 AI 眼镜与卫星通讯等新兴市场成长，将成为 2026 年下半年额外增长动能。 💰台湾 PCB 制造产业 2026 年下半年国内外生产总值预计将增至新台币 6118 亿元（年增 24.5%）。 💎台湾 2026 年全年 PCB 制造生产总值预计首度突破新台币 1 兆元，达新台币 1 兆 1365 亿元（年增 24.2%）。 🔗AI 基础设施需求的扩大，正将成长效益扩散至 PCB 制造上游的材料与设备。 🔄这显示 AI 已超越单纯的一次性循环性需求激增，正积极重塑供应链内部的价值分配结构。 ✨随着 PCB 技术持续演进，现有机供应商的竞争地位可能发生转变，同时为新进者创造新机会。 🎯台湾 PCB 产业能否强化竞争力，将取决于其能否跟上未来 AI 平台升级速度，并将技术变革转化为新产品价值。#文字观点", "publish_time": "2026-09-30 14:28", "tags": ["文字观点"]}, "post:2026-09-30T15-52:310d45821356": {"id": "post:2026-09-30T15-52:310d45821356", "kind": "post", "title": "2026-09-30 15:52", "source_label": "帖子正文", "excerpt": "郭明琪： 我最新的供应链调查显示，英伟达已开始测试一种主要基于碳氢化合物（HC）树脂的无玻璃覆铜层压板（CCL），以替代之前测试过的基于聚四氟乙烯（PTFE）的无玻璃覆铜层压板，并搭配无玻璃碳氢化合物基聚丙烯（PP）。此举旨在确定这种材料组合是否能够满足 Rubin Ultra NVL576 交换机", "content": "郭明琪： 我最新的供应链调查显示，英伟达已开始测试一种主要基于碳氢化合物（HC）树脂的无玻璃覆铜层压板（CCL），以替代之前测试过的基于聚四氟乙烯（PTFE）的无玻璃覆铜层压板，并搭配无玻璃碳氢化合物基聚丙烯（PP）。此举旨在确定这种材料组合是否能够满足 Rubin Ultra NVL576 交换机托盘 PCB 的要求。Rubin Ultra NVL576 是一款八机架互连解决方案，预计将于 2027 年下半年投入量产。 为提升 PCB 制造工艺，我们开展了初步测试。结果表明，无玻璃 HC CCL 满足开关托盘的高频电气要求。其电气性能虽不及原 PTFE 解决方案，但优于 M9 级解决方案，甚至超过了 M10 的既定规格。这些结果并非最终材料选择，而是表明 NVIDIA 在满足电气要求的前提下，将继续寻求更高的 PCB 制造良率和生产效率。 1. 主要结论和分析 （1）之前的 NVL576 交换机托盘测试采用的是无玻璃 PTFE CCL 和无玻璃 HC PP。最新一轮测试用无玻璃 HC CCL 取代了 PTFE CCL，但 HC PP 的部件号保持不变。 （2）盛益科技目前是 NVL576 交换机托盘材料评估的领先供应商。涉及的材料有 SG5300N（无玻璃 PTFE CCL）、SG1030N（无玻璃 HC CCL）和 SIF09（无玻璃 HC PP）。 （3）测试无玻璃 HC CCL 作为无玻璃 PTFE CCL 的替代品的主要目的是确定能否在满足高频电气要求的同时提高 PCB 制造良率和生产效率。 （4）为了进一步提高 PCB 的可制造性，后续测试还可以评估用玻璃纤维增​​强型高碳聚丙烯（HC PP）替代无玻璃纤维增​​强型 HC PP。关键在于这种玻璃纤维增​​强材料是否仍能满足信号完整性和 0.4 dB/in 损耗的要求。 (5) 值得注意的是，尽管 HC 是主要材料，但 SG1030N 和 SIF09 仍然含有少量 PTFE。因此，这些测试并不代表完全摒弃 PTFE。相反，它们旨在调整主要树脂体系和材料组合，以平衡高频电性能和 PCB 制造工艺。 2. 结论 （1）PTFE 在包括 CCL 和 PP 在内的先进 PCB 材料中得到更广泛的应用这一长期趋势依然清晰。然而，未来两年的出货量增长速度仍存在不确定性。关键变量包括 NVL576 交换机托盘 PCB 的最终材料选择、NVL576 的普及率以及采用正交背板的 Kyber 类机架设计的研发进展。 （2）HC 在先进 CCL 和 PP 中的应用持续扩大。除 NVL576 开关托盘外，近期增长动力包括 M9 级材料自 2026 年第四季度开始量产，随后将采用 M10 级材料。 （3）一旦规格最终确定并开始批量生产，预计盛益科技将加快从中国 HC 供应商采购的步伐。这些供应商包括东才和盛泉等现有供应商，以及 GCH 科技等潜在供应商。这将有助于缓解供应短缺并优化其成本结构。", "publish_time": "2026-09-30 15:52", "tags": []}, "post:2026-09-30T22-40:b39c1659ab48": {"id": "post:2026-09-30T22-40:b39c1659ab48", "kind": "post", "title": "2026-09-30 22:40", "source_label": "帖子正文", "excerpt": "浙商机械【四方达】主业拐点向上，金刚石散热、金刚石钻针打开空间！核心逻辑：金刚石应用多点开花，散热、钻针双轮驱动 1️⃣金刚石散热：小批量订单已落地，投建沙雅项目推动多晶金刚石散热片量产 1）行业：2029年全球AI芯片领域金刚石散热市场有望达155亿美元，26-29年CAGR约206%。", "content": "浙商机械【四方达】主业拐点向上，金刚石散热、金刚石钻针打开空间！核心逻辑：金刚石应用多点开花，散热、钻针双轮驱动 1️⃣金刚石散热：小批量订单已落地，投建沙雅项目推动多晶金刚石散热片量产 1）行业：2029年全球AI芯片领域金刚石散热市场有望达155亿美元，26-29年CAGR约206%。 2）公司：控股子公司天璇半导体布局金刚石散热片，已获小批量测试订单 ①天璇半导体：公司合计持股50.3%，26H1同比减亏41%。#郑州工厂：稼动率、良率逐步提升，26H1大幅减亏。#沙雅工厂： 拟投资4.5亿元扩产CVD金刚石散热片（4英寸级），#达产后年产能2.5万片。②客户验证：金刚石散热片已通过客户测试，#取得小批量测试订单。2️⃣金刚石钻针：产品已送样，27年订单有望落地 1）行业：AI PCB板材迭代、层数提升，PCD金刚石钻针在M9级板材上的加工寿命可达万孔级别，有望加速应用。 2）公司：产品处于验证阶段，募投项目达产后年产能可达710万支 ①产品：PCD微钻在M8和M9板上的打孔数可达万孔级别，目前处于产品验证阶段，#27年小批量订单有望落地。②扩产：公司#拟定增募资20亿元，并投资18.5亿元用于金刚石钻针产业化项目，建设期3年，#建成后可年产710万支金刚石钻针。 3️⃣主业：原油价格回升，主业有望企稳 受美伊冲突影响，26年初以来原油价格回升，油田钻进量提升有望带动主业企稳。盈利预测：预计公司 2026-2028年归母净利润分别为1.4、2.4、3.7亿元，同比增长46%、76%、53%。对应PE分别为140、79、52倍。 风险提示：金刚石钻针订单获取不及预期；金刚石散热订单不及预期；产能扩张不及预期；高管减持风险 ☎【浙商机械 王华君18610723118/蒋逸18158576706/秦乐恒15221680140】#文字观点", "publish_time": "2026-09-30 22:40", "tags": ["达产后年产能2", "5万片", "取得小批量测试订单", "27年小批量订单有望落地", "文字观点"]}, "attachment:files/JPM-中国房地产——决策层研究稳楼市政策；上海发布828政策细则.pdf": {"id": "attachment:files/JPM-中国房地产——决策层研究稳楼市政策；上海发布828政策细则.pdf", "kind": "attachment", "title": "JPM-中国房地产——决策层研究稳楼市政策；上海发布828政策细则", "source_label": "JPM", "excerpt": "Asia Pacific Equity Research 29 September 2026 J P M O R G A N Mainland China/Hong Kong Property & Conglomerates Karl Chan AC (852) 2800-8513 karl.chan@jpmorgan.com Venus Choi (852", "content": "Asia Pacific Equity Research 29 September 2026 J P M O R G A N Mainland China/Hong Kong Property & Conglomerates Karl Chan AC (852) 2800-8513 karl.chan@jpmorgan.com Venus Choi (852) 2800-8599 venus.choi@jpmorgan.com J.P. Morgan Securities (Asia Pacific) Limited/ J.P. Morgan Broking (Hong Kong) LimitedOn September 28, there were two new policy developments. First, the State Council said it would study policies to stabilize the housing market (but provided no concrete details), and we think the possible directions are mortgage subsidies and land supply control. Whether these measures prove meaningful will depend on their scope and execution. Second, Shanghai —following Beijing —published its local-level implementation guidelines for the “828” policy. The directions are similar with some nuanced differences (e.g. max. deposit is 1% in Beijing but 3% in Shanghai), but overall the new policy on mortgage disbursement (only upon completion) appears to remain tight. In the near term, the market could be excited about policy expectations for a while (at least until National Day, as per the market speculation - more ), but if the eventual policy magnitude ends up to be milder than expected, the sector may underperform again. We prefer CR Mixc , CR Land & KE Holdings (covered by Daniel Chen), and we’d sell distressed names (e.g. Vanke) on rebounds. #1) State Council to study policies to stabilize the housing market: •What’s new? On September 28, the State Council, in a meeting chaired by Premier Li Qiang, pledged to step up counter-cyclical adjustments in economic policy to meet the government’s goals this year ( link). At the meeting, authorities also mentioned the plan to “study policies to stabilize the housing market, promote employment & boost domestic demand” ( 研究出台稳定房 地产市场、促进就业增收等政策措施 ). However, no specific measures were mentioned in the meeting. •The objective is more to boost consumption, rather than to purely stimulate property sales: With tier-1 cities seeing signs of home price stabilization, we do not see a big urgency for the government to roll out a “huge stimulus” to the housing market. If there is any policy support, we believe the ultimate objective is more to boost domestic consumption as home price declines could be one of the key hurdles. Therefore, we believe any policy action in the housing market is likely aimed at promoting home price stabilization , rather than stimulating sales volume per se. •Two potential policy directions: (1) mortgage subsidies - there could be a 100bps subsidy in mortgage rates (potentially driving them down from 3.05% to 2.05%), but there would likely be a cap. In the case of Shanghai which has already rolled out mortgage subsidies, the cap is Rmb50K (per unit, NOT per year). By our estimates, if authorities were to subsidize all primary home sales, the total funding required would be Rmb44bn on an annual basis (more discussion in our previous report China Property: Mortgage subsidies to be rolled out before National Day? ; (2) land supply control : to stabilize home prices, while demand may be hard to boost, the other side of the equation is supply. Therefore, we believe a possible direction is to refine and/or more diligently execute the land supply control for local governments (currently, for cities with >36 months of inventory, land sales need to be suspended, while for those with 18-36 months of inventory, land sales need to be controlled). That said, the recent “828” policy ( report ) which aims to phase out the pre-sales See page 5 for analyst certification and important disclosures, including non-US analyst disclosures.China Property Authorities to study policies to stabilize housing market; Shanghai publishes “828” policy guidelines 2Karl ChanAC (852) 2800-8513 karl.chan@jpmorgan.comAsia Pacific Equity Research 29 September 2026 J P M O R G A N system would likely already achieve some degree of supply reduction in top-tier cities. •Any other potential policies? Apart from the two above-mentioned directions, other possibilities include: (1) reduction in transaction taxes ; (2) further easing in home provident fund (HPF) mortgages ; (3) further relaxation of home purchase restrictions in tier-1 cities (Shenzhen is likely, after the easing in Beijing & Shanghai); (4) cash compensation in urban village renovation . #2) Shanghai publishes local-level guidelines for “828” policy: •Shanghai follows Beijing in publishing local-level guidelines: After Beijing published the first official local-level guidelines on the “828” policy on September 24 (more in our report ), Shanghai published similar guidelines on September 28. We believe more cities will follow suit, and we expect the overall direction will not meaningfully deviate from Beijing’s. •Shanghai’s is broadly similar to Beijing’s, but with some nuanced differences: (1) the most notable difference is the maximum deposit ( 定金 ). While Beijing allows developers to collect max. 1% of sales proceeds as deposits, Shanghai allows max. 3% (though still below our original forecast of max. 5%); (2) transition arrangement: Shanghai is more explicit in stating that for land plots acquired by developers after August 28 (but if the land sales notice was published before that date), they would still be allowed to stick to the old pre-sales rules (but new rules on escrow account will still apply); (3) developers’ funding : Shanghai adds a section that encourages developers to raise funds through equity, bonds, ABS & REITs, but this clause is not in the Beijing version, we believe this is simply because the stock exchange is in Shanghai. This description is already stated in the original “828” policy (and thus nothing special); (4) land premium payment: For both cities, 50% of land premium is to be settled within 30 days, but for the remaining balance, Beijing says it has to be settled within two years, while Shanghai says 1+1 years (1 normally, but 1 more year can be extended); to us, the two descriptions don’t differ too much. For more comparison, please see Table 1 “ 8 2 8 ” p o l i c y ’ s l o c a l - l e v e l i m p l e m e n t a t i o n g u i d e l i n e s - B e i j i n g v s . S h a n g h a i. Related research: •China Property: Beijing publishes the first “828” policy implementation guidelines •China Property: Mortgage subsidies to be rolled out before National Day? •China Property: Uncertainties in the “post pre-sales” era may drive •China Property: Expert call takeaways on pre-sales phaseout •China Property & Banks: Phasing out the pre-sales system - good or bad? aVvYmXzWpZtMpQtM6McM6MmOpPtRoQiNmMvMkPpMmM8OpPrQuOmOrNxNnPoN Note: Differences are highlighted in blue. The Securities Times, The Beijing News, Sina Finance, CREIS Source: “828” policy’s local-level implementation guidelines - Beijing vs. Shanghai: 1 Table guidelines “828” policy: local-level implementation J P M O R G A N29 September 2026Equity Research Asia Pacific karl.chan@jpmorgan.com(852) 2800-8513ACKarl Chan 3Beijing Shanghai Requirement of pre-sales permit 预售条件 Transition arrangement(1) Construction permit obtained before 28 Aug: old rules (2) Land acquired but construction permit not obtained before 28 Aug: old rules before end-2027 (with conditions) (3) Land (with legacy issues) acquired before 28 Aug: old rules (after risk assessment)(1) Construction permit obtained before 28 Aug: old rules (2) Land acquired but construction permit not obtained before 28 Aug: old rules before end-2027 (with conditions) (3) Land acquired after 28 Aug (but land sale notice before 28 Aug): old rules before end-2027, but new rules on escrow account Sales of completed homes 现房销售 Deposit 定金 Up to 1% Up to 3% Lead bank system 主办银行制度 Escrow account Mortgage disbursement Developers' financing - Support developers to raise funds through equity, bonds, ABS & REITs Land premium payment>50% within ≤ 30 days; balance to be settled within 2 years>50% wit n of the stocks in the Research Analyst’s, or the Research Analyst’s ", "status": "extracted"}, "post:2026-09-30T08-56:6cf339913a0d": {"id": "post:2026-09-30T08-56:6cf339913a0d", "kind": "post", "title": "2026-09-30 08:56", "source_label": "帖子正文", "excerpt": "【OpenAI DevDay 2026速评】25项更新密集落地，持续执行Agent与协作平台成为重点【事项】OpenAI发布及预告25项产品与功能更新，重点转向持续执行、人机协作和Agent商业化。当地时间9月29日，OpenAI举办DevDay 2026。", "content": "【OpenAI DevDay 2026速评】25项更新密集落地，持续执行Agent与协作平台成为重点【事项】OpenAI发布及预告25项产品与功能更新，重点转向持续执行、人机协作和Agent商业化。当地时间9月29日，OpenAI举办DevDay 2026。【Dots】7×24小时Agent，嵌入工作与生活的长期事务助理 - Dots由GPT-6 Astra驱动，拥有独立云电脑和浏览器，可通过插件生态连接超过4000个应用，用户离开对话、关闭电脑后，仍可按需唤醒、跟进变化并推进云端任务。#相较于通用Agent，#Dots更突出持续积累个人偏好和跨任务协调，#用户可以交给它长期目标，#由其保留项目上下文、发现新问题、调用后台Agent并行处理，#再主动汇报结果或请用户决策，#减少每次重新交代背景、逐步指挥的需要。 - 使用上，#Dots在云端执行工作，PC和手机均为交互入口，#首次创建在PC桌面应用或电脑浏览器完成，#之后可在手机App中发消息、语音沟通、查看结果和调整优先级，并通过Slack、Teams延续同一个Dot的上下文。 - 首个Dot纳入Pro及Business Premium原套餐，不额外收取订阅费；与Dot的对话不占ChatGPT对话额度，但其调用Work、Codex执行任务仍受相应额度约束。【GPT-6.1 Sol】强化编程、电脑操作与专业工作，缓存价格减半。 - Coding能力方面，相比GPT-6 Sol，新模型在DeepSWE 1.1中的超过GPT-6 Sol最佳表现6.4 pcts；Agent能力方面，在中等推理强度下，GPT-6.1 Sol AutomationBench得分GPT-6 Sol同档位提高4.8 pcts，较Opus 5.5高2.2 pcts，单任务成本约为Opus 5.5的三分之一。专业工作能力方面，GPT-6.1 Sol在Terminal-Bench Science 0.1科学任务测试中，最高推理强度下成绩超过GPT-6 Sol的两倍，单任务成本仅为5.47美元，较Opus 5.5的23.21美元低约76%。 - 定价方面，API标准短上下文每百万Token输入/输出仍为2/10美元，与GPT-6 Sol持平；#缓存输入由0.20降至0.10美元，#下降50%。【Space&Pages】AI深度嵌入办公协作场景，推出新型文档产品。 - Space：#团队共享知识与成果的工作空间，集中组织页面、文件、Sites等内容，供成员及ChatGPT、Codex、Dots基于同一份资料协作； - Page：#本次推出的新型文档，#支持直接编辑、多人实时协作、评论，以及在页面内研究、生成图表、图片和可视化内容。用户还可指定信息来源和更新规则，让Agent根据邮件、Slack或其他连接工具中的变化维护项目计划、待办事项和研究资料，#更契合Agent时代办公环境，#减少复制粘贴和版本分散。 - Space与Pages纳入Pro、Business和Enterprise套餐；多人及Agent同时编辑的协作幻灯片仍待后续上线，移动端创建、编辑也尚未全面开放。其他更新： - Decisions API：将Luna能力聚焦于用户预设问题和有限答案，接收文本或图片后直接用于内容分类、请求分流或选择Agent下一步行动，适合高频决策环节，#印证我们此前观点，#属于类JEV模型加入Agent流程的应用落地。 - Codex上云：新增可复用开发环境，让Codex准备并测试依赖后保存，后续任务在独立云端工作区执行，电脑休眠后仍能继续，并可从手机、网页或桌面查看和接续，重点是降低重复配置成本、支持团队共用环境。 - Ultrafast&套餐变化：首先支持Astra，#Codex中的Token生成速度最高为标准模式8倍；#API输入/输出价格由每百万Token 10/50美元升至60/300美元，Codex订阅内额度则按标准模式8倍消耗。#在100/200美元月费档位之外新增月费500美元套餐，提供Plus基准25倍额度并开放Ultrafast。 - 生态扩展：插件扩展允许开发者在ChatGPT内增加侧栏应用、编辑器和交互面板，MCP Events支持外部事件触发自动化，Sign in with ChatGPT让Plus、Pro用户在参与合作的第三方工具中使用原有Work/Codex额度，并设置单应用上限。我们的观点：结合Muse的演进方向，#我们认为Agent自主性正迈入新阶段，#随着Agent深度嵌入工作生活，#持续按照人类偏好自主执行任务，#全球Token消耗有望迈上新台阶。#OpenAI本次商业化进程同步加速，Dots等新产品优先向Pro等付费用户开放，并推出Ultrafast与500美元/月套餐，通过更强能力、更快速度和更高额度提升付费价值，推动用户向高阶套餐转化，#模型厂商的远期商业价值得到进一步验证。#文字观点", "publish_time": "2026-09-30 08:56", "tags": ["文字观点"]}, "post:2026-09-30T10-16:ace950203bc0": {"id": "post:2026-09-30T10-16:ace950203bc0", "kind": "post", "title": "2026-09-30 10:16", "source_label": "帖子正文", "excerpt": "【HF大制造】联得装备推荐：预期差较大的折叠屏&先进封装铲子股，UTG玻璃+Mirco LED设备 【苹果&京东方&联得装备】 1、深度绑定京东方等龙头，8.6代OLED线+折叠屏UTG开启新一轮设备支出。#高世代OLED线持续扩产：公司中前端设备产品持续突破，后道贴合设备市场市占率超过80%。", "content": "【HF大制造】联得装备推荐：预期差较大的折叠屏&先进封装铲子股，UTG玻璃+Mirco LED设备 【苹果&京东方&联得装备】 1、深度绑定京东方等龙头，8.6代OLED线+折叠屏UTG开启新一轮设备支出。#高世代OLED线持续扩产：公司中前端设备产品持续突破，后道贴合设备市场市占率超过80%。2025年BOE开启8.6代线模组段招标，联得装备中标了价值量大的3D盖板贴合设备和邦定设备，价值量约2.01亿元，是国内份额最高企业。京东方、维信诺等龙头持续投入，8.6代OLED线进入扩产周期。#苹果折叠屏高毛利订单：折叠屏柔性面板贴合设备目前为苹果一供，目前接近20条线。根据目前的贴片效率测算，苹果出货1000万部折叠屏对应4-5亿贴合设备需求，未来其他折叠屏品牌也可能大批量使用UTG技术，叠加苹果直板机应用3D玻璃，进一步打开市场空间。 2、潜在： a）# 玻璃基封装载板（TGV）：需激光钻孔、镀膜、电镀、贴合、检测等设备。联得在前道涂覆、后道精密贴合 / 检测有技术积累，有望切入后段； b）光互连Micro LED：联得已布局Micro LED核心贴合类设备，能力向光通信、AR等领域迁移，具备先发优势。 c）钙钛矿玻璃基板：2025年公司研发的涂布三件套设备是国内少数能支持2.4米宽幅量产的新型设备，并已出货到客户端进入调试验证阶段，有望对接满足光伏钙钛矿玻璃基板需求。 【新曲线】公司在半导体设备、横向拓展（键合类设备）等方面均取得积极进展。 【空间】公司今年苹果高毛利产品放量/8.6代线/半导体设备均放量；明年苹果业务继续放量的确定性较高，半导体设备放量+Mirco LED等新方向卡位核心，弹性较大。#文字观点", "publish_time": "2026-09-30 10:16", "tags": ["高世代OLED线持续扩产", "苹果折叠屏高毛利订单", "文字观点"]}, "attachment:files/GS-美国 TMT 简讯.pdf": {"id": "attachment:files/GS-美国 TMT 简讯.pdf", "kind": "attachment", "title": "GS-美国 TMT 简讯", "source_label": "GS", "excerpt": "North America Equity Research 28 September 2026 J P M O R G A N Micron Technology F4Q26 (Aug-Qtr) Preview: Expect Another Beat-and- Raise on Continued Pricing Momentum;Material Ste", "content": "North America Equity Research 28 September 2026 J P M O R G A N Micron Technology F4Q26 (Aug-Qtr) Preview: Expect Another Beat-and- Raise on Continued Pricing Momentum; Material Step- Up in SCA Coverage Likely; Capital Return Framework Post 12/9 In Focus; Reit OWOverweight MU, MU US Price (25 Sep 26 ):$1,082.28 Price Target (Dec-27 ):$1,540.00 Semiconductors & Semiconductor Capital Equipment / IT Hardware Harlan Sur AC (1-415) 315-6700 harlan.sur@jpmorgan.com Mayur Ramdhani (1-212) 622-1664 mayur.ramdhani@jpmorgan.com Apoorva Kumar (1-212) 270-0668 apoorva.kumar@jpmorgan.com Akanksh Chauhan (1-212) 622-0045 akanksh.chauhan@jpmorgan.com J.P. Morgan Securities LLCMU is set to report Aug-Qtr (F4Q26) earnings on Wednesday (Sept 30), and we see the setup as constructive with multiple beat-and-raise levers still in play against a memory backdrop that remains structurally tight across both DRAM and NAND. On the print itself, we think MU is well-positioned to deliver Aug-Qtr revenue, gross margin, and EPS ahead of Street $51.4B/86.2%/$31.73, with pricing momentum through the quarter still tracking robust despite mgmt’s prior commentary on a “meaningful moderation in the rate of price increases” - in our view, moderation here reflects a strategic decision to preserve customer relationships and cement long-term SCA commitments rather than any demand- side softening, a nuance we think investors will increasingly appreciate as the SCA framework rolls out. On DRAM/HBM despec, our own analysis (as laid out in our global team’s recent Memory Market Update ) indicates that even after fully accounting for the despec, the industry S-D gap remains materially in shortage through CY27 and extends through CY28 (JPMe HBM S-D shortage of -20%/- 19%/-16% in CY26E/27E/28E, with accumulated shortage widening to 23 weeks by CY28E), which we think supports an upward bias to pricing into CY27-28. On the Nov-Qtr (F1Q27) guide, our expectation is that mgmt raises the bar again given (1) recent company commentary that aggregate demand signals from customers have “increased even further” since the last print, (2) mgmt’s newly-elevated CY27 view (now expected to be “even tighter” than CY26, vs. prior “beyond CY27” framing), and (3) continued HBM4 ramp momentum (12-high tracking 2x faster than HBM3E; >$1B already shipped as of May-Q). That said, the more meaningful development we expect from the print is on the SCA and capital return fronts - we think the market underappreciates the pace at which SCA coverage is compounding, and our base case is that forward bit production coverage now likely sits in the 35%+ range (up from ~20%/~33% of DRAM/NAND volumes disclosed on the last call), with strong potential that coverage is already tracking in the 50%+ range. Layered on top, the 12/9/26 second anniversary of MU’s CHIPS Act definitive agreements represents a key structural inflection - post that date, mgmt is committed to returning 100% of excess cash to shareholders (buybacks the primary vehicle), and we would expect more clarity on the timing, cadence, and initial sizing of the capital return program, in our view a substantial value-unlock lever that has yet to be fully priced in. All said, we head into the print constructive on both the near-term results and the medium-term earnings power narrative, which we think continues to be underappreciated relative to the durability the SCA framework provides. We reiterate our OW rating and $1,540 PT. •Aug-Qtr setup constructive with upside potential; GM/EPS beat likely, driven by pricing momentum despite moderating growth. We see multiple levers still in play for continued upside vs. Street rev/GM/EPS consensus of $51.4B/86.2%/$31.73 (with buy side bogeys tracking only moderately ahead of Street, based on our investor conversations), with pricing still tracking to strong Q/Q growth (albeit moderating relative to outsized May-Q sequentials), and mix continuing to skew favorably as the HBM4 12-high ramp accelerates See page 5 for analyst certification and important disclosures. {[{7JB9nCh5XMHGLB0WF3y2LKKyzNF0I2ZSbDeu8dTJYeWLJbiaAdscGrl9Jq69FrRUL0SKXX2ri-OHoiKyJLsf32_68bHnlvLKa61N5sL2iA}]} 2Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 28 September 2026 J P M O R G A N (>$1B shipped as of May-Q, tracking 2x faster than HBM3E 12-high). We anticipate DRAM ASPs rising 20%+ sequentially in the Aug-Q, with NAND ASPs likely up in the 20% Q/Q range as high-capacity eSSD tightness persists. Bit shipment growth remains constrained given MU’s (and the industry’s) limited ability to grow supply, though we would expect modest sequential improvement as the HBM4 12-high ramp scales. Data center revenue is likely to continue setting records (handily exceeding May-Q’s record ~$100B+ annualized run-rate), with CMBU and CDBU both expected to expand further and DC SSD revenue likely tracking above $5B again after more than doubling Q/Q in May-Q. GM has continued upside to MU’s guided ~86% (and Street 86.1%) given (1) less pricing moderation than initially telegraphed, (2) continued mix benefit from HBM4 12- high, and (3) operating leverage on slightly higher opex ($1.65B guide, +8% Q/Q vs. revenue up >20% Q/Q). •Nov-Qtr guide expected to raise the bar again with mgmt commentary setting up FY27 as an even tighter year than FY26. Nov-Qtr (F1Q27) guidance is where we expect the more meaningful upside vs. Street to materialize, with our view that mgmt is likely to guide well above current Street consensus (rev/GM/EPS $56.3B/86.5%/ $35.71), underpinned by: (1) mgmt’s recent commentary that aggregate demand signals from customers have “increased even further” since the May-Q print, with mgmt now explicitly framing CY27 as “even tighter” than CY26 (vs. prior “beyond CY27” characterization) - a notable escalation, (2) MU’s raised CY27 HBM TAM to “easily crossing $100B” (up from prior CY28 timing), consistent with our global team’s recent HBM model update pointing to a $160B/$282B CY27E/28E TAM on 54%/25% blended ASP hikes, (3) continued HBM4 ramp with mgmt targeting HBM share consistent with overall DRAM share (~23%), and (4) initial contribution from newly-signed SCAs flowing through the P&L, providing an incremental leg of pricing/volume visibility. On the pricing debate, we would push back on the despec-driven bear case that pricing is at risk of moderating meaningfully as we head into CY27. Our own S-D analysis indicates HBM S-D remains materially in shortage through our forecast period (-20% in CY26E, -19% in CY27E, -16% in CY28E), with accumulated shortage widening to 23 weeks by CY28E even after fully accounting for the despec that has emerged. In our view, this supports an upward bias to pricing (relative to current levels), and we would expect Nov- Qtr GM% to sustain in the mid-80s+ range with continued mix tailwinds from HBM4 12-high. •SCA coverage likely stepping to 35%+ (with potential for 50%+); capital return framework post 12/9/26 also in focus as additional value-unlock lever. MU’s May-Q disclosure of 16 SCAs (~20% of DRAM volume, ~33% of NAND volume; $100B RPO at floor pricing across 14 of the 16; $22B of cash and cash-like commitments including $18B of cash deposits, of which ~$10B expected to hit the balance sheet in F4Q alone) represented in our view a step-change in MU’s business model. Since then, mgmt’s recent commentary that “since our earnings, we have signed more SCAs” points to continued momentum, and our base case is that SCA coverage of bit production now likely sits in the 35%+ range across DRAM and NAND (up from the ~20% DRAM/~33% NAND volume disclosed on the last call) with strong potential that coverage has already progressed to the 50%+ range. We expect the print (and the associated RPO disclosure in the 10-K) to provide meaningful incremental clarity on the pace of SCA signings, cumulative RPO under contract, and the associated cash deposit build. Importantly, at the floor pricing embedded in these agreements, gross margins are set to remain “well above peak margins in any past cycle” (~62% GM prior peak), effectively establishing what we view as a materially higher and more durable margin floor than at any prior point in MU’s history, and one that in our view is not fully captured in the stock given the historically cyclical framing investors have applied to memory. On capital returns, the 12/9/26 second anniversary of MU’s CHIPS Act definitive agreements represents a pivot-point - post that date, MU has committed to returning 100% of excess cash to shareholders “over time” (buybacks the primary vehicle, with continued modest dividend growth as a secondary {[{7JB9nCh5XMHGLB0WF3y2LKKyzNF0I2ZSbDeu8dTJYeWLJbiaAdscGrl9Jq69FrRUL0SKXX2ri-OHoiKyJLsf32_68bHnlvLKa61N5sL2iA}]} 3Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 28 September 2026 J P M O R G A N lever). Cash generation is running at record levels ($24B+ FCF expected in Aug-Q alone; up >30% from ~$18.3B in May-Q), and we would expect mgmt to provide more clarity on the timing, cadence, and initial sizing of the capital return program, which in our view represents a substantial value-unlock lever, particularly given the potential magnitude of buyback capacity relative to cumulative FCF approaching $200B for the 6 quarters through year-end CY27, when layered on top of continued SCA-driven earnings visibility. {[{7JB9nCh5XMHGLB0WF3y2LKKyzNF0I2ZSbDeu8dTJYeWLJbiaAdscGrl9Jq69FrRUL0SKXX2ri-OHoiKyJLsf32_68bHnlvLKa61N5sL2iA}]} 4Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 28 September 2026 J P M O R G A N Investment Thesis, Valuation and Risks Micron Technology (Overweight; Price Target: $1,540.00) Investment Thesis •Longer term, the company’s increasing product (DRAM, NAND, NOR) and end- market diversification should dampen revenue/earnings volatility and also position the company to do well in markets (handset) that require multiple types of memory. •Micron should benefit from secular trends in data center DRAM (HBM), which should help it reduce volatility to commodity DRAM. Post the Elpida acquisition, we believe Micron will be positioned well to benefit from secular trends in mobility, networking, and cloud computing. •New technology, divestiture of non-core assets, and cost-cutting efforts should help it improve gross margins and profitability in the coming quarters. Valuation Our Dec-27 PT of $1540 is based on 10x (10-yr median P/E multiple) $154 of EPS in FY28E. Risks to Rating and Price Target •Micron competes in extremely competitive markets – operational execution is critical. •Any sudden weakness in demand outlook for PCs could reduce our estimates on DRAM price recovery and memory content growth. •An aggressive ASP decline combined with lower per gigabit manufacturing cost reduction could cause us to lower our revenue and earnings estimates. •Any imbalance in DRAM and NAND supply/demand could cause us to lower our revenue and earnings estimates. •Our NAND demand assumptions could change the overall growth for the sector if we continue to see a further supply/demand disconnect. •Any macroeconomic-driven demand softness could potentially result in lower demand for Micron’s products and could impact revenues/profitability profile for the company. {[{7JB9nCh5XMHGLB0WF3y2LKKyzNF0I2ZSbDeu8dTJYeWLJbiaAdscGrl9Jq69FrRUL0SKXX2ri-OHoiKyJLsf32_68bHnlvLKa61N5sL2iA}]} 5Harlan SurAC (1-415) 315-6700 harlan.sur@jpmorgan.comNorth America Equity Research 28 September 2026 J P M O R G A N Analyst Certification: The Research Analyst(s) denoted by an “AC” on the cover of this report certifies (or, where multiple Research Analysts are primarily responsible for this report, the Research Analyst denoted by an “AC” on the cover or within the document individually certifies, with respect to each security or issuer that the Research Analyst covers in this research) that: (1) all of the views expressed in this report acc ，约11月上海落实。 3、第一条线13个月建成，前7个月爬坡，实现T700稳定生产，良品率95%以上。2609万凯新材：行业底部向上 1、行业反内卷一直在进行，从去年7月到现在，行业开工率没超过80%。原本说到今年年底如果价格好可能解散，现在不会，因瓶片处于上游原材料压力大的情况。 2、行业3到6月价差最高拉到1800，平均利润从零变到六七百。三季度加工费回到500，基本没利润，三季度利润大部分的是二季度的订单。 3、去年三四季度投了灵心巧手，当时估值5亿，投了5000万，现在估值240亿。 4、全年业绩目标10到12亿。明年哪怕PET只有50元每吨利润，400万吨销量有2亿利润；非洲贡献2亿多，乙二醇两三百元每吨，草酸等；最差明年业绩四五亿，如果PET弹性好可能更高，到10亿。明年灵心巧手可能上市，天然气有结果，行业格局变好。 5、可转债让投资者自己选是否转股。量较大，强赎对股价有打击，利息不高，现金足，可能还钱或借银行。#文字观点", "publish_time": "2026-09-30 12:07", "tags": ["文字观点"]}, "attachment:files/中信建投-航运港口行业：集运多数航线运价回落，油运运价延续强势-260928.pdf": {"id": "attachment:files/中信建投-航运港口行业：集运多数航线运价回落，油运运价延续强势-260928.pdf", "kind": "attachment", "title": "中信建投-航运港口行业：集运多数航线运价回落，油运运价延续强势-260928", "source_label": "中信建投", "excerpt": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。", "content": "本报告由中信建投证券股份有限公司在中华人民共和国（仅为本报告目的，不包括香港、澳门、台湾）提供。在遵守适用的法律法规情况下， 本报告亦可能由中信建投（国际）证券有限公司在香港提供。同时请务必阅读正文之后的免责条款和声明。 证券研究报告·行业动态 集运多数航线运价回落 ，油 运运价延续强势 核心观点 1）集运：运输需求总体平稳，多数航线运价回落。 SCFI周环比持 平；美西、美东在前期上涨后小幅回调，欧洲及地中海受需求乏力拖 累继续下跌，南美跌幅扩大；东南亚航线需求稳定，区域指数延续上 涨。 2）油运：国际油运指数继续上行，原油轮高位分化。 BDTI、BCTI 分别周涨10.2%、9.7%；中东—中国VLCC收益小幅上涨并维持极高 水平，美湾—中国继续走强，西非—中国高位回调。成品油轮保持强 势，中东LR长程航线舱位偏紧，跨大西洋 MR相对平稳。 3）散运：各船型日租金普涨，巴拿马型领涨。 BDI周涨3.1%；海 岬型受大西洋货盘与运力收紧支撑，太平洋市场相对承压； 巴拿马 型受大西洋货盘增加及即期运力偏紧推动涨幅居前；超灵便型与小 灵便型温和上行。 行业动态信息 行业综述：从交运各子板块相对沪深 300表现看，本周（9月21日 -9月25日）交运板块整体下跌。本周航运板块涨幅为 1.93%，港口 板块跌幅为0.92%。 航运港口：集运多数航线回落，油运与散运总体走强 集运：本周中国出口集装箱运输需求总体平稳， SCFI周环比持平， 多数远洋航线运价回落。 美西、美东在前期上涨后小幅调整，当前 供需尚未明显转弱；欧洲及地中海受终端消费和进口需求疲弱影响 继续下跌；南美供需关系进一步转松，运价跌幅扩大；东南亚市场货 量保持稳定，区域指数延续上涨。整体来看，各航线仍将受区域需 求、运力投放及地缘风险影响而延续分化。 油运：本周国际油运市场延续强势， BDTI、BCTI周环比分别上涨 10.2%、9.7%，原油轮不同航线由全面上涨转向高位分化。 霍尔木兹 海峡及红海南部通航限制持续占用有效运力，中东 —中国VLCC收益 维持历史高位并小幅上涨；美湾 —中国受远程货源需求及吨海里增 长支撑继续走强；西非—中国在前期快速上涨后高位回调。成品油 轮保持强势，中东LR长程航线运力偏紧，跨大西洋 MR货盘相对平 稳。 散运：本周干散货航运市场整体上行，各船型日租金普涨。 海岬型 船受大西洋铁矿石货盘增加和北大西洋即期运力收紧支撑，但太平 洋市场相对宽松限制涨幅；巴拿马型船受大西洋粮食及矿石货盘增 加、即期运力偏紧推动，涨幅居各船型之首；超灵便型与小灵便型分 别获得北太平洋、印尼、美湾及南美东岸货盘支撑，日租金温和上 涨。 维持 强于大市 韩军 hanjunbj@csc.com.cn SAC 编号:S14405191100 15.2%，为本周主要航线中跌幅最大的区域。当前运输需求增长乏力，市场供需关系进一步转松，货主观望 情绪及船公司揽货竞争共同推动即期报价下移。短期来看，南美航线运价下行压力仍未完全释放。 亚洲内航线：东南亚运价继续上涨，分航线表现分化。 东南亚集装箱运价指数报 5794.79点，周环比上涨 3.3%。区域运输需求总体稳定，但不同航线的货量及舱位供需存在差异，市场运价涨跌互现。整体 来看，东南 亚市场仍有稳定货量支撑，短期预计维持高位震荡。 1.1.2油运：指数周环比继续上涨， VLCC高位分化 本周国际油运市场延续强势，但原油轮不同航线开始出现分化。 9月24日，BDTI指数报5250点，周环比 上涨10.2%；BCTI指数报2099点，周环比上涨9.7%。霍尔木兹海峡及红海南部通航限制继续扰动中东原油出 口，过湾接驳、湾外转船及船舶等待占用大量有效运力，风险溢价仍处高位。不过，在前期快速上涨后，部分 VLCC航线成交节奏放缓，市场由全面上涨转向高位分化。 中东航线：中东—中国VLCC收益高位小幅上涨。 9月24日，中东湾—中国TD3C航线TCE约123. 54万 美元/天，周环比上涨1.9%。虽然船东与租家在极高运价水平下博弈加剧，但海峡通行限制、阿曼湾转运延误及 大量船舶被等待和接驳业务占用，使有效运力继续偏紧，运价仍维持历史高位。 仅供内部参考，请勿外传 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 2 航运港口 行业动态报告 请务必阅读正文之后的免责条款和声明。 美湾航线：美湾—中国运价继续上行。 9月24日，美湾—中国TD22航线TCE约40.71万美元/天，周环 比上涨4.8%。中东供应链受阻促使买家增加对美洲远程货源的关注，长航程进一步放大吨海里需求；同时，大 量VLCC被中东及阿曼湾业务吸收，支撑大西洋跨区航线运价 。 西非航线：西非—中国运价高位回调。 9月24日，西非—中国TD15航线TCE约50.71万美元/天，周环 比下跌3.3%。前期运价快速上涨后，租家接受能力下降，市场成交放缓，但中东运力吸附效应仍在，西非可用 船舶供应有限，运价绝对水平依然较高。 成品油轮：市场保持强势， LR长程航线表现突出。 BCTI指数周环比上涨9.7%，中东地区LR2、LR1船 舶供应偏紧，长程航线继续获得支撑；跨大西洋 MR货盘相对平稳，区域间表现有所分化。短期地缘冲突及炼 化产品贸易流重构仍将支撑成品油轮市场。 1.1.3散运市场：各船型日租金普涨，巴拿马型领涨 本周干散货航运市场整体上行， 巴拿马型船涨幅居前， 海岬型船高位震荡，超灵便型与小灵便型温和上涨。 9月24日，波罗的海干散货指数（ BDI）报3473点，周环比上涨3.1%；海岬型船日租金报 53864美元/天，周 环比上涨3.0%；巴拿马型船报21434美元/天，周环比上涨5.8%；超灵便型船报22525美元/天，周环比上涨 0.9%；小灵便型船报18061美元/天，周环比上涨1.6%。 海岬型船受大西洋铁矿石货盘增加、北大西洋即期运力收紧支撑，日租金继续上涨，但太平洋市场货盘与 运力匹配相对宽松，限制整体涨幅。巴拿马型船表现最强，大西洋粮食及矿石货盘增加、即期船舶供应偏紧， 澳洲及北太平洋货盘亦提供支撑，印尼煤炭市场活跃度有所恢复。超灵便型船受北太平洋及印尼货盘、欧洲废 钢运输需求支撑，小幅上涨；小灵便型船则受美湾及南美东岸询盘带动，表现相对稳健。整体来看，各船型均 获得货盘支撑，但区域表现仍有差异，短期预计延续高位震荡。 1.2国内市场：航运板块与港口板块均下跌 从交运各子板块相对沪深 300表现看，本周（9月21日-9月25日）交运板块整体下跌 。本周航运板块跌 幅为1.93%，港口板块跌幅为0.92%。 仅供内部参考，请勿外传 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 3 航运港口 行业动态报告 请务必阅读正文之后的免责条款和声明。 图1: 交通运输行业各子板块与沪深 300的超额收益 数据来源：Wind，中信建投 图2: 交通运输行业涨跌幅股票排名前十（单位： %） 图3: 航运港口板块涨跌幅股票排名前五（单位： %） 来源：Wind，中信建投 数据来源：Wind，中信建投 -150%-100%-50%0%50%100%150%200%250%300%2019/1/12020/1/12021/
