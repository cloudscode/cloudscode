 "title": "2026-09-30 15:55", "source_label": "帖子正文", "excerpt": "【东财机械】坚定看好光通信设备各位领导好，节前专门对重点推荐个股进行调研更新，当前位置重点推荐有业绩支撑的光仪器【华盛昌、联讯仪器等】#个股及空间测算欢迎私戳重点推荐个股更新：#【华盛昌】基本面稳健向上：1）光示波器送样多家验证，预计节后订单落地，国内第二❗#若27年预计出货1000台，对应5-6亿", "content": "【东财机械】坚定看好光通信设备各位领导好，节前专门对重点推荐个股进行调研更新，当前位置重点推荐有业绩支撑的光仪器【华盛昌、联讯仪器等】#个股及空间测算欢迎私戳重点推荐个股更新：#【华盛昌】基本面稳健向上：1）光示波器送样多家验证，预计节后订单落地，国内第二❗#若27年预计出货1000台，对应5-6亿利润增量，40xPE=200-240e市值增量❗2）硅光晶圆测试设备已实现20多台套签单；3）产能持续提升中，预计年底年化产值30-35e#【瑞松科技】MPO、PFC放量可期：1）MPO跳线插芯设备首台套整线订单落地在即，国内外众多客户（molex、senko、天孚、富联等）对接，若放量1000-2000台，对应营收约8-15亿，净利润2-4亿，爆发放量弹性可期；2）FPC柔性插装设备 ：已获富士康等十几台小批量；3）高精度六轴机器人多领域拓展可期板块相关#【联讯仪器】-国产光示仪器龙头&弹性高标#【华兴源创】-海外客户光示波器验证中，10月验证通过有望Q4订单落地，#若27年预计出货1000台，51%股权对应约3+亿利润增量#【鼎阳科技】-VNA26Q2已经实现多家高速铜缆领域头部企业测试公司产品、落地订单；高速PCB领域进入客户测试阶段#【罗博特科-FiconTEC】-全球光电封装测试龙头#【科瑞技术】-拟定增7.52亿元，卡位半导体设备国产化与CPO光互联，加码超高精密度零部件布局#重视普源精电、日联科技等测试仪器厂商不断突围；博众精工、埃科光电、固高科技、康平科技等光设备铲子骨#文字观点", "publish_time": "2026-09-30 15:55", "tags": ["个股及空间测算欢迎私戳", "【华盛昌】基本面稳健向上", "【瑞松科技】MPO、PFC放量可期", "【联讯仪器】-", "【华兴源创】-", "【鼎阳科技】-", "【罗博特科-FiconTEC】-", "【科瑞技术】-", "重视", "文字观点"]}, "post:2026-09-30T12-30:cb55876af72a": {"id": "post:2026-09-30T12-30:cb55876af72a", "kind": "post", "title": "2026-09-30 12:30", "source_label": "帖子正文", "excerpt": "摩根大通——硬件与网络设备行业：2026年美国全明星大会要点总结 一、Cisco（CSCO | 评级：增持 | 收盘价$106.70） • FY27营收增长逻辑：预期同比+15%，由三大引擎驱动：超大规模云厂商需求、前期提价落地、核心业务（网络双位数增长，安全/可观测性下半年升至高个位数，服务改善至", "content": "摩根大通——硬件与网络设备行业：2026年美国全明星大会要点总结 一、Cisco（CSCO | 评级：增持 | 收盘价$106.70） • FY27营收增长逻辑：预期同比+15%，由三大引擎驱动：超大规模云厂商需求、前期提价落地、核心业务（网络双位数增长，安全/可观测性下半年升至高个位数，服务改善至持平至低个位数）。管理层强调，下半年增速放缓主要系可见度与出货节奏所致，而非基本面驱动因素走弱；1Q27收入可见度改善，尽管下半年基数走高，但增长韧性仍在。 • 超大规模订单与需求可见度：订单与收入间的缺口源于云厂商提前6–9个月下单，而Cisco预订口径仅计入90天内发货订单，长周期承诺计入积压订单，报告订单显著低估真实需求能见度。FY26超大规模订单中，Silicon One系统占60%、光器件占40%，FY27该结构预计无重大变化。 • Silicon One：超越“第二供应商”叙事：对云厂商的核心价值不止于作为博通替代，更在于可编程性、系统级设计、机架空间/功耗效率及供应链控制。Cisco已深耕设计导入超5年，否认份额提升仅受益于供应受限环境。目标到FY29将Silicon One渗透至全系列高性能网络设备，届时对台积电的采购规模将提升议价能力与路线图能见度。 • Scale-Across机遇与产品组合广度：凭借深缓冲路由器、Silicon One及Acacia光学的组合，Cisco在Scale-Across（横向扩展网络）中占据独特位置，P200设计导入与Acacia活动已开始兑现。该机遇的核心逻辑在于每GPU需承载的带宽/内容量大幅提升，且要求极低丢包率。 • 企业市场：设备老化与安全刚需双轮驱动：约$400亿园区交换机临近最后支持日（Catalyst 4000于CY26末，6000系列次年），整体网络设备存量更新机遇达$1000亿。竞争将集中于设备层，而Cisco瞄准大型企业架构级变革（网络+安全+可观测性+软件）。 • 安全与可观测性：拐点初现：该板块此前显著落后于增长目标（主因市场复杂性及Splunk向云订阅转型），但新版产品组合增长已改善，管理层预计FY27末将实现高个位数增长，确认已“渡过拐点”。 • 供应链：紧平衡但不构成FY27增长约束：通过提升库存、提前采购承诺、长期协议及前瞻性硅片规划，Cisco确认FY27指引未受供应限制，光学（尤其激光器）为最紧缺环节，但已有缓冲应对需求微超。硬件占比提升（企业侧亦如此）导致毛利率“温和”承压，但软件与服务收入确认滞后亦是主因，并非仅超大规模客户结构问题。 二、Coherent（COHR | 评级：增持 | 收盘价$295.83） • 光器件行业双引擎：数据中心持续扩张 + Scale-Up网络从铜缆向光互联转换。后者连接数约为Scale-Out的10倍，是独立于Capex总量的增量机遇。各超大规模厂商采用节奏为关键变量。 • PhotonLink：架构无关的光互联平台：支持CPO、NPO及芯片间光连接，差异化源于核心光子构件内部集成能力。已推进超25个客户项目，CPO性能/功耗更优但牺牲可维护性，NPO保留可插拔灵活性，公司技术中立且两者内容价值相近。PhotonLink收入于C4Q起量，毛利率高于公司均值。 • InP与VCSEL互补覆盖全场景：InP主导长距，VCSEL阵列覆盖短距集成、NPO及芯片间应用。Coherent年产能超10亿VCSEL阵列，Scale-Up将采用InP/VCSEL混合方案，Scale-Out仍以InP为主。 • FY27增长将超越FY26：9月季度指引隐含同比>50% pro forma增长，预计FY27内首次实现单季$30亿营收。增长由现有可插拔TRx及新增PhotonLink/OCS/多轨平台叠加驱动，而非替代现有动能。 • 增长瓶颈在供应而非需求：需求超出当前制造产能，正进行24个月内InP产能翻两倍的扩产（已同比翻倍），但新增产能已被全部预订。扩产节奏受厂房建设、设备与人员培训等物理限制。 • 利润率扩张三大支柱：① 供需偏紧下的持续提价；② 高毛利新品（PhotonLink/OCS/多轨）占比提升；③ 结构性降本——向6英寸InP晶圆迁移，单晶圆产出提升4倍+，成本降至3英寸的一半以下。毛利率从FY24的34%升至指引40.5%，目标>42%并进一步扩张。 • 长期协议（LTA）降低产能风险：LTA多含“照付不议”条款，定价支撑毛利目标。客户可出资支持产能建设（如Nvidia），Coherent借此构建专用产能，目标回收期18个月，大幅降低自有资本风险。 • 西方光子供应链定位：关键光子元件主要于美欧制造，组装/测试为价值链中低差异化环节，核心IP与毛利集中于激光器、隔离器、TEC等。垂直整合优势契合西方客户对供应链韧性的需求，中国营收占比仅约10%。 • 热管理材料与激光技术延展：AI计算密度提升催生热材料机遇，自研Thermadite材料替代铜冷板，热传导性能显著优化，可提升GPU利用率/速率。远期亦布局能源融合等激光应用。#文字观点", "publish_time": "2026-09-30 12:30", "tags": ["文字观点"]}, "attachment:files/JPM-硬件与网络设备行业：2026年美国全明星大会要点总结.pdf": {"id": "attachment:files/JPM-硬件与网络设备行业：2026年美国全明星大会要点总结.pdf", "kind": "attachment", "title": "JPM-硬件与网络设备行业：2026年美国全明星大会要点总结", "source_label": "JPM", "excerpt": "North America Equity Research 28 September 2026 J P M O R G A N IT Hardware/ Telecom & Networking Equipment Joseph Cardoso AC (1-212) 622-9036 joseph.cardoso@jpmchase.com Manmohanp", "content": "North America Equity Research 28 September 2026 J P M O R G A N IT Hardware/ Telecom & Networking Equipment Joseph Cardoso AC (1-212) 622-9036 joseph.cardoso@jpmchase.com Manmohanpreet Singh (1-212) 622-4527 manmohanpreet.singh@jpmchase.com Marc Vitenzon (1-212) 622-3342 marc.vitenzon@jpmchase.com J.P. Morgan Securities LLCWe hosted investor meetings with Cisco, as well as investor meetings and a fireside chat with Coherent, at the J.P. Morgan U.S. All Stars Conference in London. Overall discussions across the event focused on the accelerating AI-driven data center buildout, including hyperscaler demand, next-gen networking and optical infrastructure, technology transitions, and the capacity and supply-chain requirements supporting that growth. Detailed company-specific takeaways are below . Cisco (CSCO) We hosted investor meetings with Cisco’s Emily Hunt ( Director, Investor Relations ) at the J.P. Morgan U.S. All Stars Conference. Our takeaways from the meetings were as follows: •2H growth fade a function of visiblity and timing vs. weakening underlying drivers . The FY27 revenue growth outlook of +15% y/y is roughly split across three buckets: hyperscaler growth, previously implemented price increases, and the core business. The latter includes double- digit growth in networking, security/observability exiting the year at high- single digit growth, and services improving to flat to low-single-digit growth. Cisco also noted better top-line visibility into F1Q27, and while comps do become tougher in 2H, management characterized the FY27 growth fade primarily as a function of visibility and timing rather than weakening underlying drivers . •Hyperscaler orders understate demand visibility. The gap between hyperscaler orders and revenue reflects hyperscalers placing orders well ahead of shipments, often six to nine months in advance. Cisco's booking definition counts only orders expected to ship within 90 days, while longer-duration commitments sit in backlog, meaning reported orders understate the underlying demand visibility. Separately, management noted that the hyperscaler order mix was 60% Silicon One-based systems and 40% optics in FY26, a mix that is not expected to change materially in FY27. •Silicon One value extends beyond second sourcing. The value to hyperscalers is broader than simply serving as a second source to Broadcom. For example, while Silicon One performance is competitive with peers, its programmability, system-level design, rack-space/power efficiency, and supply-chain control are key differentiators. Cisco noted that it has been working with hyperscalers for more than five years to establish design wins, and pushed back on the idea that share gains are primarily the result of a supply- constrained environment. Cisco continues to target Silicon One across all high- performance networking equipment by FY29, a goal that should improve its leverage with TSMC as it becomes a larger-scale buyer, which should provide better roadmap visibility. •Scale-across opportunity plays to portfolio breadth. Cisco believes it is well positioned for scale-across, given the combination of deep-buffer routers, Silicon One, and Acacia optics, which enable it to provide a broader solution. That opportunity is beginning to materialize through P200 design wins and Acacia activity. Importantly, the scale-across opportunity itself carries See page 5 for analyst certification and important disclosures.Hardware & Networking Takeaways from J.P. Morgan U.S. All Stars Conference 2026 2Joseph CardosoAC (1-212) 622-9036 joseph.cardoso@jpmchase.comNorth America Equity Research 28 September 2026 J P M O R G A N substantially more bandwidth/content per GPU, as each GPU must communicate coherently with extremely low packet loss. •Aging switches and security needs drive enterprise opportunity. The enterprise opportunity is being driven by both aging installed equipment and an increasing security imperative. On that note, roughly $40 bn of campus switches are approaching last day of support, while the broader networking installed base approaching end of life represents a $100 bn opportunity over several years. For example, Catalyst 4000 is expected to reach end of support at the end of CY26, with Catalyst 6000 following the next year. While Cisco acknowledged increasing competition for its installed base, it noted that the competition will likely be at the device level, as Cisco targets large enterprises undertaking broader architectural changes that encompass networking, security, observability, and software. •Security and observability growth lagged ambitions but showing signs of turning. Security/Observability was acknowledged as falling well short of Cisco’s growth ambitions, with management attributing this partly to market complexity and partly to portfolio transition, such as Splunk customers moving toward cloud subscription. That said, the newer, refreshed portfolio was highlighted as growing better, and Cisco believes security has now turned a corner, with an expectation of exiting FY27 at high-single digit growth. •Supply framed as tight but not constraining FY27. The supply environment for Cisco was described as tight rather than outright constrained, as the company has raised inventory, placed advance-purchase commitments, entered into long-term agreements, and is actively working through long-term silicon requirements. The most acute tightness appears to be in optics, particularly lasers. On the flip side, Cisco has reduced memory requirements in some products and is using supplier diversification where practical. Importantly, the FY27 guide is not supply-constrained, as it believes it has the supply needed to support demand, with some buffer for upside should demand track modestly higher. •Hardware growth weighs on gross margins “modestly” and drivers extend beyond hyperscaler mix alone. The gross margin decline was characterized as “modest” in FY27, driven by hardware growing faster than higher-margin portions of the portfolio such as software, security, and services. That said, Cisco underscored that the mix issue is broader than hyperscaler mix, despite investor perception, as the company is selling more hardware across enterprise as well, with software and service trends lagging the hardware deployment and recognized over time. Coherent (COHR) We hosted investor meetings and a fireside chat with Coherent’s Jim Anderson ( Chief Executive Officer ), Dr. Christopher Dorman ( EVP , Industrial ), and Paul Silverstein ( SVP , Investor Relations and Corporate Communications ) at the J.P. Morgan U.S. All Stars Conference. Our takeaways from the meetings and fireside chat were as follows: •Optical growth benefiting from both data center expansion as well as scale-up conversion . The optical industry is benefiting from two independent secular drivers: continued data center growth and the conversion of the scale-up network from copper to optical. Importantly, with the latter estimated to have roughly 10x the number of connections as scale-out, the transition is envisioned as a substantial incremental opportunity for optics rather than simply a function of data center capex growth. That said, while the end state is clear, the key debate is the pace of adoption by each hyperscaler. •Stays architecture-agnostic as PhotonLink targets multiple optical paths. The recently announced PhotonLink is intended to support CPO, NPO, and chip-to-chip optical connections, with Coherent positioning itself as differentiated by having the major photonic building blocks in-house and the ability to integrate them into a complete bUrUnWyXvXsNqPqP6MbP9PpNoOpNqOkPmMuNlOtQmMbRmMoPvPnNyQvPmNtP . Separately, China represents a small percentage of revenue at ~10%presented as an advantage, with Western customers seeking a resilient supply chain. in lasers, isolators, TECs, and other optical ingredients. This vertical integration is differentiated portion of the value chain, with the key IP and gross-margin dollar ng>\u003c/li>\n\u003cli>今天强化的逻辑：9月以来国内Agent产品密集迭代，字节发布飞书8.0 for Agent，支持智能体进入群聊协作并升级豆包工作；腾讯WorkBuddy上线开放；多Agent并发和私有化部署推进，国产服务器CPU有望受益于算力架构重配，CPU需求更可能体现为GPU集群之外新增独立CPU算力层。\u003c/li>\n\u003cli>今天出现的催化/验证：OpenAI DevDay 2026发布25项更新，重点转向持续执行、人机协作和Agent商业化；Anthropic披露与SpaceX最高845亿美元算力协议；Anthropic招股书要点显示IPO估值或超2万亿美元；MiniMax M3.1-Flash-Preview核心Coding能力反馈较好，多Agent并行、自测排错、回归验证能力不错；算力租赁服务商在手5年期框架订单规模超160亿元。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>半导体/先进封装\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：ABF载板是芯片与PCB之间的关键过渡层，AI芯片对布线密度、层数、面积和lowCTE值要求大幅提升；3D DRAM趋势确定，兆易创新大幅上调长鑫采购金额至78.54亿元，上修37.5%，2026M1-8采购35.96亿元，上修后26M9-M12及27M1-4预计采购额分别为42.58/44.11亿元，环比持续提升。\u003c/li>\n\u003cli>今天出现的催化/验证：兴森科技ABF载板当前约7000平方米产能储备，一期未打满，已启动二期扩产，预计明年年底二期落地，整体月产能提升至2万平方米；小米玄戒O100为行业首颗6nm 3D晶圆级堆叠AI加速芯片，使用3D DRAM和逻辑芯片混合键合、垂直堆叠，预计27年量产；大洋生物通过参股芯之纯切入芯片制造上游，卡位陶瓷基板国产替代。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>PCB/CCL/铜箔\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：AI服务器与高速网络需求快速增长，导致PCB、IC载板及核心材料供应全面趋紧；供应短缺首先从低CTE和低Dk2玻璃纤维布以及HVLP4铜箔等先进材料开始，此后蔓延至CCL、高阶PCB、ABF载板、制程设备及耗材；交期拉长，部分中低阶材料与通用CCL等级出现涨价迹象。\u003c/li>\n\u003cli>今天出现的催化/验证：最新供应链调查显示，英伟达已开始测试主要基于碳氢化合物树脂的无玻璃覆铜层压板，替代之前测试过的PTFE基无玻璃CCL，并搭配无玻璃碳氢化合物基PP，以确定能否满足Rubin Ultra NVL576交换机要求；四方达金刚石散热小批量订单已落地，投建沙雅项目推动多晶金刚石散热片量产，2029年全球AI芯片领域金刚石散热市场有望达155亿美元，26-29年CAGR约206%。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>宏观/策略/地产\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：中央财政首次对地产行业补贴、首次对居民房贷实施贴息，政策态度重于力度，目标是推动房地产止跌回稳；上海发布“828”政策细则，决策层研究稳楼市政策；控供给+稳需求，促拐点意图明确；有观点判断年底前财政大礼包落地概率较大，规模可能达6~7万亿甚至小10万亿左右，有望带来房价彻底企稳回升。\u003c/li>\n\u003cli>今天出现的催化/验证：贴息条件为首套、120平以下、150万以内；2026年按揭发放额估算约3.03万亿，首套占比90%约2.73万亿，贴息1%约270亿，150万以下占比65%约177亿未来1年贴息规模；未来1年内购房者可享不超过5年贴息，政策暂定1年但不排除延长；9月制造业PMI为50.1%，比上月上升0.3个百分点；A股成交仅1.42万亿，为去年7月以来新低。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>新能源/汽车/AI电力\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：铜箔供应紧张随涨价缓解；3Q26行业前六电池制造商合计产量同比增长62%，其中CATL增速66%，其余五家合计增速59%，差距由2Q26的38个百分点显著收窄至7个百分点；EV电池价格持稳，储能电池8月环比+2.7%，主要反映9月1日起实施的2%消费税传导；宁德时代A/H股9月迄今分别回调18%（vs沪深300指数-6%），主因担忧需求放缓、竞争加剧及减产风险。\u003c/li>\n\u003cli>今天出现的催化/验证：布鲁姆能源上涨近11%，获跑赢大市评级，目标价335美元，并决定在加州弗里蒙特生产设施额外租赁158000平方英尺；BE Q2营收10.65亿美元，同比+165.5%，毛利率33.4%，环比提升668个基点，全年指引上修至39~42亿美元；英飞凌与伊顿合作，SiC固态变压器SST拿到IEC认证，落地AI数据中心800VDC架构。\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>机器人/自动化\u003c/strong>\u003c/li>\n\u003cli>今天强化的逻辑：特斯拉量产进程加速，26年Optimus有望下线约5万台，特斯拉新一轮审厂启动；灵巧手良率逐步提升带动本体10月产能迅速爬坡，10月将迎本体量产拐点，预计11月左右提升至周产1k+，本体起量支撑供应商订单景气，并倒逼供应商10月产能扩张；26H1中国人形机器人出货占比超97%。\u003c/li>\n\u003cli>今天出现的催化/验证：万里扬机器人一次性通过核心客户按照VDA6.3要求的PPAP审核，首条关节模组生产线具备量产能力；光洋股份称是唯一通过T机器人全身轴承验证的国产上市公司，交叉滚子唯一国产量产厂家，减速器上游核心供应商，国庆期间有望再审厂，短期看185e，远期看370e。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>OpenAI DevDay 2026发布25项更新，覆盖AI工作方式、GPT-6 Astra、常驻智能体dots、连接4000余款应用7×24小时执行任务等，重点转向持续执行、人机协作和Agent商业化。\u003c/li>\n\u003cli>Anthropic与SpaceX达成最高845亿美元算力协议；招股书要点显示IPO估值或超2万亿美元，上市或推迟到11月美国中期选举后，2025全年收入近46亿美元、同比增长约12倍，净亏损约420亿美元。\u003c/li>\n\u003cli>奥尼电子9月30日全资子公司与C公司签署GPU算力卡采购合同，含税金额18.21亿元，合同已正式生效；9月24日与B公司签署23亿元级别合同，九日三单累计约50.47亿元。\u003c/li>\n\u003cli>兆易创新大幅上调长鑫采购金额，原预计2026年全年采购57.11亿元，本次增加21.43亿元至78.54亿元，上修37.5%；2026M1-8采购35.96亿元。\u003c/li>\n\u003cli>中央财政首次房贷贴息落地：首套、120平以下、150万以内可享；上海发布“828”政策细则；有观点认为单套补贴上限按套计为5万元，贴5年最多可减少利息支出5万元。\u003c/li>\n\u003cli>AI热潮加剧PCB供应链压力，材料与设备短缺将持续至2027年；短缺从低CTE、低Dk2玻纤布和HVLP4铜箔开始，蔓延至CCL、高阶PCB、ABF载板、制程设备及耗材。\u003c/li>\n\u003cli>英伟达已开始测试HC树脂无玻璃CCL，替代PTFE基无玻璃CCL，并搭配无玻璃碳氢化合物基PP，用于判断是否满足Rubin Ultra NVL576交换机要求。\u003c/li>\n\u003cli>特斯拉新一轮审厂启动，Optimus量产加速；万里扬机器人通过核心客户PPAP审核；光洋股份称国庆期间有望再审厂。\u003c/li>\n\u003cli>布鲁姆能源上涨近11%，BE Q2营收10.65亿美元、同比+165.5%，毛利率33.4%，环比提升668个基点，全年指引上修至39~42亿美元。\u003c/li>\n\u003cli>英飞凌与伊顿合作，SiC固态变压器SST拿到IEC认证，落地AI数据中心800VDC架构，SST大量消耗高压碳化硅器件。\u003c/li>\n\u003cli>光通信方面，光模块光学从元件向下游组件延伸，NPO、OCS、CPO以及TGV新品同步布局；华盛昌光示波器送样多家验证，预计节后订单落地，国内第二，若27年出货1000台对应5-6亿。\u003c/li>\n\u003cli>医药方面，恒瑞医药与诺和诺德就每周一次口服GLP1*GIP受体激动剂HRS1596达成合作，诺和诺德获海外权益，恒瑞获3亿美金首付款、23亿里程碑及后续销售提成；康方生物海外合作方Summit获阿斯利康20亿美金战略股权投资。\u003c/li>\n\u003cli>公司治理与激励方面，协创数据发布2026年限制性股票激励计划，2028年净利润考核目标较2025年增长700%；益丰药房发布新一轮股票激励计划，26-27年利润增速目标约10%、15%；中控技术上调回购股份价格上限至不超过133.50元/股。\u003c/li>\n\u003cli>美的集团2026Q3及全年指引更新：Q3经营口径收入中低个位数下滑，利润中个位数左右下滑；全年收入预期下修至中低个位数，利润因并表亏损下修，但分红仍提升，全年回购和DPS分红额不低于去年。\u003c/li>\n\u003cli>鸿富诚9月29日创业板上市，开盘价600元/股，较发行价涨幅681%；核心产品包括石墨烯导热垫片、金属碳基复合材料，已进入全球头部AI芯片厂商供应链；AI芯片TDP向Rubin 2300W跃升，石墨烯为芯片散热关键材料。\u003c/li>\n\u003cli>宁夏建材拟注入石墨资产，开启新材料第二曲线；久立特材开辟航空领域新市场、参与可控核聚变；H氧股份在合肥成立电子气体公司，由H氧股份全资持股。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>Agent商业化与OpenAI ARR接近700亿美元能否持续验证；Anthropic IPO进度是否推迟至11月美国中期选举后，以及SpaceX算力协议落地情况。\u003c/li>\n\u003cli>国产服务器CPU需求是否体现为GPU集群之外新增独立CPU算力层，多Agent并发与私有化部署推进节奏。\u003c/li>\n\u003cli>地产贴息执行效果、是否延长执行期限、上海“828”细则落地效果，以及年底财政大礼包规模与房价企稳信号。\u003c/li>\n\u003cli>PCB/CCL材料短缺持续至2027年的验证，交期与涨价是否继续扩散，英伟达HC树脂CCL测试结果及Rubin Ultra NVL576交换机材料要求。\u003c/li>\n\u003cli>3D DRAM 2027年量价齐升、小米玄戒O100 27年量产进度，以及兆易创新上修采购后26M9-M12及27M1-4采购额环比提升的兑现。\u003c/li>\n\u003cli>机器人方面，特斯拉Optimus 26年约5万台下线、10月本体量产拐点、11月周产1k+、国庆期间光洋股份再审厂、万里扬关节模组量产能力。\u003c/li>\n\u003cli>光通信方面，华盛昌光示波器节后订单落地、光模块专用MCU适配800G/1.6T高端需求导入、CPO/OCS/NPO/TGV新品进展。\u003c/li>\n\u003cli>新能源与AI电力方面，电池10月产量展望、铜箔供应与涨价、BE/SOFC产业链价值、SiC SST在AI数据中心800VDC架构落地。\u003c/li>\n\u003cli>宏观方面，10月供给端回落、美伊冲突谈判重启、A股缩量后假期避险意义变化、美债收益率走高对市场情绪的压制。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>07:49｜特朗普谈朝鲜问题：只要我在，金正恩就不会搞事情。你知道为什么吗？\u003c/li>\n\u003cli>08:00｜2026年按揭发放额估算约3.03万亿（净增额-6768亿元+还款额估算3.7万亿），首套占比90%，2.73万亿，贴息1%，差不多270亿，同时150万以下占比65%（用二手房代替），差不多177亿左右贴息规模（估算未来1年的贴息规模），并且未来1年内购房者可享受不超过5年的贴息政策，此外本次政策暂定1年，但也不排除后续是否会延长执行期限。\u003c/li>\n\u003cli>08:00｜Anthropic 披露与Spacex达成最高845亿美 元算力协议\u003c/li>\n\u003cli>08:01｜1、150万房款、120平、100万贷款、1%贴息，贴5年，最多可减少利息支出5万，力度不小；2、这是中央财政首次拿出真金白银支持购房需求，信号意义极强。\u003c/li>\n\u003cli>08:01｜ESMO 2026 中国研究及中国管线LBA梳理\u003c/li>\n\u003cli>08:01｜一张图看AI4S：巨头密集落子，AI制药走向研发基建\u003c/li>\n\u003cli>08:04｜【中信证券前瞻】OpenAI DevDay 202
