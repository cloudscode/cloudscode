千问生态扩张带来的AI推荐与消费决策机会。 ⑤ 壹网壹创（300792）：阿里Agent生态。阿里首批AI Agent共创成员，布局AI客服、智能投放、视觉生成及内容营销，商业化场景清晰。 ⑥ 石基信息（002153）：千问＋酒旅AI。通义千问首批合作伙伴，酒店PMS及酒旅信息系统龙头，关注AI预订、智能客服与酒店运营自动化。 ⑦ 数据港（603881）：阿里云算力基础设施。阿里云重要IDC合作伙伴，布局定制化数据中心，千问用户规模及推理需求增长有望形成长期算力催化。 ☎️ 投资观点： 短期关注朝阳科技的AI耳机与羊年玄学情绪共振，同时关注三江购物的阿里新零售及AI购物Agent题材弹性；中期关注歌尔股份的AI声学硬件升级；长期跟踪阿里Agent生态商业化。#文字观点", "publish_time": "2026-10-31 13:14", "tags": ["文字观点"]}, "post:2026-10-31T13-13:94b6af569249": {"id": "post:2026-10-31T13-13:94b6af569249", "kind": "post", "title": "2026-10-31 13:13", "source_label": "帖子正文", "excerpt": "随着科技焦虑情绪升温，OpenAI将融资目标削减100亿美元 10月31日｜OpenAI将最新一轮融资目标下调100亿美元，正加紧敲定这笔融资。公开市场AI板块遭遇抛售，加上头号对手Anthropic即将上市，本次融资进程承压。", "content": "随着科技焦虑情绪升温，OpenAI将融资目标削减100亿美元 10月31日｜OpenAI将最新一轮融资目标下调100亿美元，正加紧敲定这笔融资。公开市场AI板块遭遇抛售，加上头号对手Anthropic即将上市，本次融资进程承压。这家ChatGPT开发商上月原本计划募资300亿美元，估值1.4万亿美元，称这是投资者在其明年IPO前入股的最后机会。OpenAI称7月以来营收快速增长，以此支撑估值从8520亿美元近乎翻倍。多名知情人士透露，OpenAI目前计划募资约200亿美元，估值1.25万亿美元。 公司设定截止日期，要求投资者在周五前完成出资承诺。知情人士称，部分投资者缩减了本次融资的认购额度，本轮“首次交割”预计到位资金不足200亿美元。 知情人士补充，由阿联酋多家投资机构组成的财团（含国有科技基金MGX）将是本轮最大投资方。作为交易的一部分，OpenAI将获得在该地区租赁新建算力资源的选择权。 知情人士表示，Founders Fund、Coatue、红杉资本、Andreessen Horowitz等风投机构，以及孙正义的软银也计划参与本轮融资。 一名知情人士称，后续还将面向富裕个人投资者开启零售配售，投资者可按1.25万亿美元估值入股，有望把本轮融资总额推至200亿美元左右。#文字观点", "publish_time": "2026-10-31 13:13", "tags": ["文字观点"]}, "post:2026-10-31T22-32:28ad61eefdd7": {"id": "post:2026-10-31T22-32:28ad61eefdd7", "kind": "post", "title": "2026-10-31 22:32", "source_label": "帖子正文", "excerpt": "✨【申万计算机】26Q3板块业绩回顾+持仓分析！Anthropic递交S-1招股书！", "content": "✨【申万计算机】26Q3板块业绩回顾+持仓分析！Anthropic递交S-1招股书！20261031 📩业绩回顾、持仓分析底稿请联系【王开元】 ✨#收入加速、扣非保持较快增长26Q3板块收入同比+15%，较26Q2提升1pct，延续年初以来的改善趋势。 毛利率为22%，环比回落2pcts；净利润同比+1%，扣非净利润同比+45%，较26Q2的43%小幅提升，主业盈利保持较快增长。 ✨#持仓占比1.5%、底部回升26Q3计算机行业公募基金配置占比1.5%，环比+0.4pcts，处于2010年以来3%分位；配置系数0.43，环比+0.11。 截至10.30，计算机行业PE(TTM)为53.4x，处于历史31.30%分位； PS(TTM)为2.4x，处于历史4.60%分位；PCF(TTM)为45.0x，处于历史12.10%分位。 AI应用仍处初期，费用投入先于利润回报，PS/PCF已回落至历史低位，大模型驱动的新一轮增长有望同时带来估值修复与收入增长。 ✨#Anthropic递交S-1招股书10月26日，Anthropic向美国SEC提交S-1，拟以ANT为股票代码上市。 1）26Q3收入环比放缓符合市场预期，26Q2经营盈利拐点符合预期。模型提效改善盈利，后续模型迭代继续降低服务算力需求及客户任务费用； 2）企业客户持续扩张，Coding向更多工作场景延伸； 3）算力投入持续前置，长期承诺要求收入规模同步扩张。 📥【近期周报】 1024：AI+EDA从单点走向全流程!DeepSeek公开新推理方案#小程序://申万宏源研究/UTRVEKyMGLBA4Bi 1017：海外大模型ARR再讨论！液冷芯片级散热趋势！#小程序://申万宏源研究/v3I4rxEFcziFSFr 1009：海内外大模型厂商ARR讨论！2026Q3计算机业绩前瞻！#小程序://申万宏源研究/s4GuOn5vJAt0dSq 0930：AMD收购World Labs，物理AI平台化竞争加速！#小程序://申万宏源研究/LBXBgPBuPgvDAlh#文字观点", "publish_time": "2026-10-31 22:32", "tags": ["收入加速、扣非保持较快增长", "持仓占比1", "5%、底部回升", "Anthropic递交S-1招股书", "文字观点"]}, "attachment:files/Bernstein-亚马逊 3Q26：评估标记 Amazon 3Q26 Measure the chalk mark.pdf": {"id": "attachment:files/Bernstein-亚马逊 3Q26：评估标记 Amazon 3Q26 Measure the chalk mark.pdf", "kind": "attachment", "title": "Bernstein-亚马逊 3Q26：评估标记 Amazon 3Q26 Measure the chalk mark", "source_label": "Bernstein", "excerpt": "30 October 2026 U.S. Internet Amazon.Com Inc Rating Outperform Price Target AMZN 320.00 USD Mark Shmulik +1 917 344 8508 mark.shmulik@bernsteinsg.com Deeksha Pandey +1 917 344 8447", "content": "30 October 2026 U.S. Internet Amazon.Com Inc Rating Outperform Price Target AMZN 320.00 USD Mark Shmulik +1 917 344 8508 mark.shmulik@bernsteinsg.com Deeksha Pandey +1 917 344 8447 deeksha.pandey@bernsteinsg.com Wenhuan Chang +1 917 344 8546 wenhuan.chang@bernsteinsg.com Reported EPS F25A F26E F27E AMZN (USD) 7.17 12.92 12.95 OLD -- 13.08 12.49Financials F25A F26E F27E CAGR Revenues (M) 716,924 830,997 966,800 -- EBITDA (M) 145,731 199,845 289,870 -- EBIT (M) 79,975 112,801 173,478 -- EBITDA Margin (%) 20.3 24.0 30.0 --Valuation Metrics F25A F26E F27E Reported P/E (x) 34.0 18.9 18.8 EV/Sales (x) 3.8 3.3 2.8 EV/EBITDA (x) 18.9 13.8 9.5 EV/EBIT (x) 34.4 24.4 15.8 Adjusted P/E (x) 34.0 18.9 18.8 PEG Adjusted (x) 1.1 0.2 90.9 EV/FCF (x) 245.5 (45.4) (116.1) *Values shown in billions;Source: Bloomberg, Bernstein estimates and analysis.Amazon 3Q26: Measure the chalk mark It’s easy to be disappointed by Amazon’s print. The expectation bar pushed so high that even cold water from peer prints didn’t lower the bar enough. But deliver what exactly? Ad growth looked weak though the 2-qtr growth with Prime Day was fine. And 39% Y/Y growth with 39% margins for AWS wasn’t the 40/40 dream, but cloud accelerated AND management offered 40%+ growth through 2028. Value comes from the outcomes not expectations. It’s knowing where to tap not how hard, and Amazon knows. AWS growth misses 40/40, but misses what exactly? AWS accelerated from +37% Y/Y last quarter to 39% Y/Y this quarter, and margins held in at ~39%. It’s not 40/40 and questions remain around 4Q, but management completely removed some uncertainty offering an unprecedented 40%+ AWS revenue growth in 2027/28. While AI margins are dilutive and likely to be more pronounced as T rainium/Graviton sales off-AWS kick in late next year, backlog diversified adding ~$80B Q/Q — isn’t this good? Retail weighed down by Advertising, but double-digit margins matter. Advertising growth decelerating meaningfully to 12% Y/Y down from mid-20s growth last quarter. Prime Day timing, lapping the NBA rights, exiting Google PLAs, and Europe regulation all weighed on numbers, though re-acceleration to the high teens in 4Q expected. Guide leaves much to the imagination. Revenue guidance of $240-247B wrapped consensus, while the mid-point of 4Q OI of $28.5-33.5 was a touch below consensus, though capitalizing Leo has moved to 1Q27. Based on the trajectory of retail and advertising implies little room for further AWS acceleration against tougher comps, but perhaps a reset of expectations is exactly what the company needs right now. Investment Implications What are we even doing down here? Remain OP, PT $320.Close Date 29 Oct 2026 AMZN Close Price (USD) 243.79 Price Target (USD) 320.00 Upside/(Downside) 31% 52-Week Range 287.20/196.00 SPX 7,720.39 FYE Dec Div Yield NA Market Cap (USD) (B) 2,629.60 EV (USD) (B) 2,748.60 Performance YTD 1M 6M 12M Absolute (%) 5.6 (1.2) (7.3) 5.9 SPX (%) 12.8 0.6 8.2 12.0 Relative (%) (7.2) (1.8) (15.5) (6.2) Source: Bloomberg, Bernstein estimates and analysis. Price Performance, 1YR $300 $280 $260 $240 $220 $200 10/25 01/26 04/26 07/26 10/2665007000750080008500 AMZN SPX See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 30 Oct 2026 06:37 UTC Completion Date: 30 Oct 2026 06:37 UTC on 30-Oct-2026 Mark Shmulik +1 917 344 8508 mark.shmulik@bernsteinsg.com 30 October 2026 DETAILS Amazon reported 3Q26 results after the close yesterday. PM SUMMARY AWS didn’t do 40/40, it did 39/39. Management took the unprecedented step of offering a 2-year growth outlook of 40% through 2028 for AWS, while the backlog added ~$80B sequentially showing Amazon’s ability to diversify the AI customer base. Advertising missed thanks to a lot of wonky things and tough comps, but it’s got nothing to do with agentic and expected to re- accelerate meaningfully here in 4Q. Retail was fine though management finally offered support of the double-digit margins ex- Science fair projects that business generates and only getting more efficient as cost-to-serve keeps coming down. Objectively looking at the financials and ignoring the narrative and the noise, we’re struggling to articulate a reason why the stock should trade at a low-to-mid teens ‘28 EPS multiple. Yes CapEx is coming up, but the ROIC is there. Yes, AWS margins should compress as the revenue mix shifts more towards lower margin AI cloud workloads, but we’re still talking about unprecedented revenue dollar growth levels + with steady state margins closer to the mid 30s vs the mid-to-high 20s. That’s it. We can’t answer every debate, and understand the scrutiny around ROIC, overbuilding, concentration risk, and agentic fears. But the numbers tell a better story than the ones we discuss - a business delivering on most objectives, building for the future, and executing where it matters. It doesn’t need to be wrapped in the pretty story, it just needs to keep putting numbers on the board. You want a story? Need a story? Well we’re going into Re-Invent - Amazon’s annual AWS conference. History doesn’t repeat, but it does rhyme, and you’ve seen what both Google and Meta’s stocks did around their big developer events. With confirmation around getting into selling custom-ASICs compute off of AWS coming late 2027 and all the power in the world in agentic commerce negotiations - it’s not far fetched to see some big announcements and stories coming real soon. So what to do with the stock here? The pitch is unchanged. All the Internet stocks have been hammered this earnings season, so we’ll reframe the question - which do you want to own with Meta, Google, and Amazon all available at similar price points on forward earnings? Amazon has to be in that consideration. We remain Outperform and maintain our price target at $320/Share. We value Amazon using a 50/50 combination of SOTP method (which values the Retail segment at a 2027E EV/Sales multiple of 3x (unchanged) and the AWS segment at a 2027E EV/EBIT multiple of 25x (unchanged)), and a DCF using a WACC of 9% and a terminal growth rate of 3.5% (WACC and terminal growth rate remain unchanged; slight increase to EBIT margin estimates in outyears). RESUL TS Amazon offered unusually strong long-term confidence around AWS growth while continuing to execute exceptionally well across its retail franchise, reinforcing the strength of its core businesses. At the same time, AWS growth missed an elevated bar with likely margin compression ahead, and the advertising miss is likely to reignite questions around agentic commerce and whether AI- driven discovery is beginning to pressure an important profit pool. Retail •Net Amazon sales increased 12% to $202B in 3Q26 with the Prime Day shift into 2Q created an approximately 400 bps headwind to 3Q growth , masking continued strength across the entials grew roughly 3x faster than the rest of the store during 3Q and now represent approximately 50% of all units sold. Customers using same-day perishables delivery purchase nearly 7x more everyday essentials. Gross sales from grocery and everyday essentials have now reached nearly $250B on a TTM basis. •Expanding convenience advantage through faster delivery offerings. The company delivered more than 1.5 billion items to Prime customers through same-day or overnight delivery during 3Q. Amazon Now is now available in more than 450 towns and cities worldwide, with items ordered through the service increasing 10x Y/Y. •Healthcare and pharmacy remain emerging growth vectors within the retail ecosystem. Amazon Pharmacy customers increased more than 60% Y/Y. Repeat customers grew more than 50% Y/Y, while three-hour prescription delivery is now available in more than 350 cities. •Agentic commerce double-edged sword: no impact from horizontal agents, with continued traction with Alexa for Shopping. More than 400 million customers have used Alexa for Shopping over the last twelve months, with customer interactions increasing 570% Y/Y. U.S. customers using Alexa for Shopping spend approximately 50% more per order than those who do not, reinforcing the potential for AI-powered shopping assistants to drive higher engagement, conversion, and over time potentially advertising monetization. On the flip side, Amazon hasn’t seen any impact from horizontal agents, though given the blocking nature it’s hard to parse out what could have been. Commentary around agentic mistakes for non- discretionary products reinforces our house view that there’s very little friction to shopping on Amazon. •Subscription Services revenue increased 12% Y/Y to $14B keeping up the pace in recent quarters demonstrating continued strength in Prime engagement. Physical Stores revenue increased 2% Y/Y to $5.7B , as Amazon continues to focus investment behind its highest-return physical retail formats, including Whole Foods Market. •3P products made up 61% of items sold this quarter in line with 2Q26 and slightly above 60% in 1Q26. •Guidance: 4Q revenue guidance of $240-247B (12-16% Y/Y growth) was broadly in line with expectations despite an approximately 60 bps FX headwind. Management also expects advertising growth to re-accelerate to the high teens in 4Q, following ~12% FxN in 3Q that was impacted by timing anomalies related primarily to Prime Day and a handful of other timing factors. However, the midpoint of the $28.5-33.5B EBIT guide came in roughly ~6% below pre-release consensus with questions around AWS margins, fuel costs, and the size of Project Leo expenses weighing on numbers. •Leo capitalization bumped to 1Q27. Amazon now expects Leo's initial commercial service to begin later this year, with capitalization of certain production and launch costs starting in 1Q27 rather than earlier expectations. As a result, the majority of Leo-related costs will continue to be expensed through 4Q26. AWS •AWS revenue grew 39% Y/Y to $46B, representing its fastest growth in nearly five years and a sixth consecutive quarter of acceleration. AWS added $3.8B of incremental revenue Q/Q compared to Microsoft at ~$2.8B and Google at ~$5.9B (although including 3P TPU system sales) putting it at the top or if not very close to the top of the leaderboard of net new $ adds. The business is now at a $184B annualized revenue run-rate supported by improving capacity availability, accelerating AI adoption, growing inference deployments, healthy core cloud demand, and rising adoption of AWS's custom silicon portfolio. U.S. INTERNET 3 on 30-Oct-2026 Mark Shmulik +1 917 344 8508 mark.shmulik@bernsteinsg.com 30 October 2026 •Perhaps the most important takeaway from the quarter: Amazon is now explicitly underwriting 40%+ AWS growth through 2028. AWS is projected to grow more than 40% in both 2027 and 2028 supported by visible customer commitments, large reserved capacity agreements, and what management believes remains very early adoption of enterprise AI inference. Backlog remains a powerful demand indicator and AWS backlog reached $578B, growing triple- digits Y/Y and showing diversification strength across enterprise accounts. For a business already operating at a $184B revenue run-rate, the magnitude of that forecast is striking and helps reinforce Amazon's view that AWS has a credible path toward becoming a $1T annual revenue business within 5-10 years. •3P Trainium sales! The chips business continues growing triple digits Y/Y with Trainium and Graviton revenue commitments each increasing more than 20x Y/Y . Demand remains so strong that Amazon now intends to begin selling T rainium and like Graviton externally in late 2027. T rainium's price-performance advantage is becoming increasingly valuable as customers seek to lower inference costs, while Graviton continues benefiting from growing CPU-intensive workloads such as post-training, reinforcement learning, and agent orchestration. •Inference is now 50%+ of AWS’s AI revenue, and this is important because inference workloads drive demand not only for accelerators but also for compute, storage, networking, databases, and security services across the broader AWS platform. Enterprise AI deployments remain in the early innings and Amazon is confident that inference demand will increase substantially as AI applications move deeper into production. •The AWS flywheel is becoming increasingly powerful. Customers run applications and data in AWS, which naturally pulls AI workloads onto the platform. Those AI workloads then drive higher demand for core infrastructure services such as storage, databases, networking, reinforcement learning, post-training workloads, and tool usage, which in turn drives additional investment and innovation across AWS. Management explicitly called out accelerating growth in core compute and storage revenues, both of which are now growing at their fastest rates in several years. •Bedrock: the fastest-growing multi-billion-dollar service in AWS history . Momentum remains exceptional, with Fortune 500 customers spending nearly 7x more Y/Y while total token volumes increased nearly 17x Y/Y. AWS continues expanding Bedrock's model selection, recently adding OpenAI models and additional frontier and open-weight offerings. Management believes the long-term opportunity could be enormous, suggesting Bedrock ultimately has the potential to become a business as large as EC2! •This is accompanied by accelerating adoption of AgentCore, with customers deploying 2x more agents in 3Q26 than in the prior three quarters combined. •AWS profitability remains steady though margin compression ahead? AWS operating margins remained mostly steady Q/Q ex one-times at 38.7% with help from custom chips, proprietary networking, software optimization, and infrastructure efficiencies. While AI workloads currently carry somewhat lower margins than the mature core cloud business, and as growth skews heavier towards AI workloads and CapEx shifts towards shorter useful-life assets, we could see modest compression in AWS OI. Management noted AI margins are already better than what core AWS margins were at a similar stage of development. Advertising •Amazon’s advertising business was the biggest miss of the night with growth decelerating to 12% Y/Y from 26% Y/Y growth last quarter. Amazon highlighted three factors weighing on growth: the shift of Prime Day from Q3 into Q2, which represented an ~850 bps headwind to advertising growth; the absence of NBA inventory in Q3 after benefiting Q2 results; and the anniversary of search engine marketing changes implemented in Q3'25 that had previously accelerated ad growth. Despite these headwinds, Amazon remained positive on the underlying trajectory of the business and expects ad growth to reaccelerate to the high-teens in 4Q26. •The ad slowdown inevitably revives the debate around AI-driven product discovery, but Amazon dismissed 将把一部分关键供应链采购和支出放在海外，使资产端和负债端币种匹配、 均由外币结算，从而自然对冲敞口，结构性改善外币敞口过大对人民币报表披露 带来的汇兑损益影响。 11.三季报单季度财务费用比去年同期增加约5000万元，除汇兑因素外还有其 他因素吗？ 答：公司表示需进一步测算后再反馈。后续补充说明：财务费用1至9月累计同 比变化其实不到2000万元，主要影响因素包括两部分，一是公司在北美开展银 行保理，加速海外回款并考虑未来战略物料长周期备货，导致利息支出增加；二 是今年美元结汇成人民币后，人民币利率下行，存款利率和理财收益相比美元降 低，带来一定负向影响。 12.公司管理费用比去年同期偏高，是否因为香港上市相关费用摊入？ 答：管理费用增加主要由于收入规模增长，员工工资和奖金增加；其中也包含H 股上市相关费用的一部分。 13.公司报表中其他收入或投资收益项目去年还有几千万元，今年几乎没有， 主要是什么原因？ 答：投资收益下降主要是因为去年公司将赛房作为联营公司进行确认；去年底公 司已完成对赛房的处置，因此今年不再有该项收益，全年投资收益预计减少约 5000万元。 14.公司三季报毛利率下滑幅度较大，主要原因是什么？ 答：公司三季度毛利率下滑主要受三大类原因影响：一是美国关税退税中约80% 集中在5月和6月，影响约8个bp；二是去年铜、存储以及带动相关原材料上 涨，公司虽然做了战略备货锁价，但去年11月开始的上涨行情在6至9个月战 略备货周期内滚动进入成本，从存货结转至产成品成本，影响约3个多点；三是 三季度为传统欧美淡季，欧美区域规模占比下降、其他区域和新能源占比上升， 带来结构性差异约1个多点。 15.按照公司说明的因素，当前盈利水平是否基本触底或进入稳定状态？四季 度是否还会继续承压？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：公司认为可以理解为接近稳定，但不宜简单称为触底。公司内部预期四季度 毛利率将回到H1剔除关税后的正常盈利水平；原材料上涨对毛利有压力，但公 司在做大幅降本，能源二代产品成本较一代下降20%至30%，足以覆盖原材料上 涨影响。诊断相关产品以电子件为主，原材料方面会有一定压力，可能带来约 0.5至1个百分点的影响；整体集团维修和能源两块业务的毛利仍将非常稳定。 16.展望明年，公司营收端是否仍维持稳健状态？此前利润增速通常快于收入 增速，后续能否进入同步阶段？ 答：公司收入增速基本会按照股权激励20%的目标推进。随着成本端逐步优化、 毛利率持续改善，净利率和净利润增速可能比收入端增长更好；今年前三季度的 短期波动更多是受汇率影响。 17.公司在美国的充电桩业务近期表现如何？该业务是否受到美国法规变化等 因素的影响？ 答：美国充电桩业务会受到一定政策端影响，主要源于此前拜登时期的NEVI补 贴；今年联邦政府基本没有太多类似补贴项目，而去年同期公司有相关项目，因 此同比增速没有此前好看。第四季度是旺季，公司将通过促销活动提升美国区域 收入；高毛利区域收入增速明显放量，也支持公司四季度毛利率回到H1水平。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-31T12-50:a53ba94de721": {"id": "post:2026-10-31T12-50:a53ba94de721", "kind": "post", "title": "2026-10-31 12:50", "source_label": "帖子正文", "excerpt": "[东吴电子陈海进】先进封装板块 长电科技、通富微电、甬矽电子、汇成股份、盛合晶微 2026三季报信息整理合集 财务情况:订单增长与产品结构优化支撑经营表现，前三季度营收均增长 长电科技:Q3营收114.25亿元，创单季新高，归母净利润7.73亿元，yoy+59.99%;前三季度扣非归母净利润yoy+", "content": "[东吴电子陈海进】先进封装板块 长电科技、通富微电、甬矽电子、汇成股份、盛合晶微 2026三季报信息整理合集 财务情况:订单增长与产品结构优化支撑经营表现，前三季度营收均增长 长电科技:Q3营收114.25亿元，创单季新高，归母净利润7.73亿元，yoy+59.99%;前三季度扣非归母净利润yoy+99.17% OC仍处高速增长、公司占比高，预计27年市场规模超100亿元。 5）CPO/NPO：环节3已出货；公司要把CPO大部分测试环节做全，内部判断28/29年CPO测试当年新增市场超500亿元；NPO 27年规模化起量，与CPO节奏差异不大。 盈利预测：我们预计公司26-27年净利润分别为40e+/90e+，对应PE分别为30/14X，近期调整主要系板块情绪，底部位置，建议重点关注！ —————— 联系人：国海机械 张钰莹 19121096486#文字观点​", "publish_time": "2026-10-31 18:22", "tags": ["文字观点​"]}, "attachment:files/埃科光电2026年第三季度业绩说明会20261030.pdf": {"id": "attachment:files/埃科光电2026年第三季度业绩说明会20261030.pdf", "kind": "attachment", "title": "埃科光电2026年第三季度业绩说明会20261030", "source_label": "其他", "excerpt": "埃科光电2026年第三季度业绩说明会20261030 要点总结 1.三季度业绩与盈利质量 收入端：2026年单三季度收入约2亿出头，同比增长60%多，一到三季度累 计维持相对高增。增长核心驱动来自PCB、半导体、新兴显示、锂电等核心 下游的持续增长，其中PCB与半导体的收入贡献度持续提升。", "content": "埃科光电2026年第三季度业绩说明会20261030 要点总结 1.三季度业绩与盈利质量 收入端：2026年单三季度收入约2亿出头，同比增长60%多，一到三季度累 计维持相对高增。增长核心驱动来自PCB、半导体、新兴显示、锂电等核心 下游的持续增长，其中PCB与半导体的收入贡献度持续提升。 利润端：单三季度归母净利润4243万元，同比增长翻倍以上。 毛利率：三季度毛利率46%出头，创年内新高，同比显著提升、环比亦有明 确提升。 净利率：归母净利率超过20%，同环比均明显增长。 盈利质量提升的两点归因 o外部结构因素：持续受益于AI带动的高端检测场景需求增加，对产品技 术附加值要求持续提高，公司产品组合结构持续优化，高附加值产品占 比和贡献度提升。 o内部提效因素：公司持续推进内部经营管理提效。 毛利率中期指引：公司明确表示毛利率将持续处于上升通道。约半年多前已 向市场提出，未来平均毛利率回到50%以上不会有疑问。毛利率上行的来源 主要是新产品导入和新技术的释放，足以对冲老产品毛利下滑的过程。 2.分部业务景气度与展望 PCB：高阶需求上行，验孔/测孔方向临近放量 o竞争格局与策略：公司在PCB的AOI领域市占率较好、客户认可度高， 当前更多是拓展业务方向。随着更高互联密度、更大数据交互量的要求 提升，对PCB检测的要求持续提高。 o新产品节奏：PCB验孔方向已有多个路线，处于给用户验证导入的较好 阶段，临近放量。除现有铜板检测等存量收入外，与夏一婵合作推进的 测孔等新方向，目前在客户端测试结果不错、终端接受度评价也可以， 预计2027年开始看到一定量的释放，但需要一个产业接受过程。 o测孔技术路线：目前有3个技术路线在跑，跑出的结果都还可以。其中 部分方案用相机、部分用智能光单元，取决于与下游不同设备商的推进 模式。管理层更看好针对智能光单元的检测结果，其检测精度更高，认 为产业未来可能更朝着这个方向发展。 o收入结构：PCB领域大部分收入来自偏高端的M3、HDR等领域，高端占 比最大。公司不太关注低端产品，且高阶PCB的检测量仍在上升。 o产品标准化方向：公司努力将行业里偏AOI的检测整合到相对统一的标 品上，以提升制造端效率和客户端接受度，这需要与下游客户大量沟通 系统设计问题。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 o检测单元的价值量逻辑：精度要求越高，核心检测单元的数量和质量要 求都会上升（分辨率、速度、精度提升），速度上去后信号质量下降， 需要进一步降低噪声，是一个持续向设计极限逼近的过程。 o判断：叠加行业本身发展及新方向突破，公司对2027年PCB整体比较看 好。 半导体：三季度势头最猛，国产替代驱动，弹性最大 o景气度变化：半导体在公司体量占比中目前不算高，但三季度上升势头 很猛。核心驱动是下游国产替代不断加速，地缘政治不确定性带来的供 应链安全诉求，以及国内制造端水平提升，这将是持续性、增长性的过 程。 o客户面边际变化（两点）： 一是与公司合作的国内量检测设备商数量在增加，合作客户群在扩大； 二是三季度导入进度出现积极变化，部分小的批量已经开始上批量。 随着下游设备商国产化进度和fab厂对国产设备验证通过，国内设备 放量将带动公司核心部件成长。 o技术难度与产品形态：原则上前道量检测的技术难度高于后道封测（但 并非一概而论，部分后道量测/检测精度要求也很高）。如套刻检测有IBO （影像方式）与DBO（光谱方式）等不同技术路线，不同设备商方案差 异较大。 o检测技术路线占比：不管是前道还是后道，光学（Optic）的设备使用量 远远大于X光和E-beam。E-beam类精度更高，但检测效率达不到产线实 际产出要求；光学检测产出率高，能满足高精度检测下的生产效率要求， 因此真正的在线（online）设备大部分以光学检测为主。 o产品布局：目前已覆盖相当一部分从前道到后道的光学量测产品，但尚 不能完全覆盖全部，仍在持续开发，并在光源设计、前端器件芯片设计 等一体化能力上加强。 o增长更快的方向：预计中后道（封测端、先进封装）增速更快。先进封 装是很好的增长方向，不完全是对科磊的国产替代概念，而是涉及堆叠 等大量新技术问题，如混合键合等领域，公司已有红外、光谱等针对性 产品布局和设计。 o导入节奏判断：整体是从易到难、从后道到中道到前道的节奏。部分产 品已进入较先进的产业链（管理层提到“像这种特斯拉那以下的有一些 产品，我们也在参与”），越先进的产品节奏越不易掌控，受材料端及 各维度同时突破的影响。 o体量与节奏判断：半导体光学量检测的需求量是天量，当前收入体量可 以忽略，市场容量对公司增速的约束基本相当于没有。当前讨论订单绝 对数量没有实质意义，核心是产品能否满足下游要求。只要产品过硬， 需求量远大于当前收入体量。预计到2027年应能看到比较好的成长，目 前能见度下相对于公司当下体量会有一个较好的增速。 显示：优于新能源，前道国产替代弹性大 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 o收入结构：显示行业当前贡献绝大部分收入的仍来自后道AOI类领域， 公司正在往中前道拓展。LCD与OLED传统显示是当前显示领域主要收入 来源。 o前道空间：显示领域的工序数量远大于锂电和光伏（少于半导体），前 道领域的工业要求非常高，且前道设备国产化率非常低，有大量工作可 做，是重要增量方向。 o新显示（MicroLED/AR、VR/Waveguide）：目前仍处于逐渐上升的态势， 公司在产品适配上有较大研发投入，未来应该有很好的成长性。 o景气对比：整体判断显示比新能源还要好一点。从毛利率角度看，显示 行业整体毛利率偏工单偏低，但其中也有偏高的新方向。 新能源（锂电/光伏） o收入结构：新能源绝大部分收入仍然来自锂电（动力电池、储能、消费 电池）。光伏仍在低谷、尚未完全起来，仅从今年订单情况看开始逐步 恢复。 o锂电行业判断： 动力电池：新能源汽车渗透率已达50%-60%以上，纯动力电池角度未 来的市场空间不会特别大。从2%-3%提升到50%有20-30倍增长，但 从50%到100%只有约2倍增长，想象空间有差异。能量密度若通过固 态电池等进一步提升，需求量仍有上升的确定性。 消费电池与储能：仍有一定成长空间（长续航诉求、解决风光等新能 源消纳问题的化学储能建设），能源需求量会持续上升。 行业阶段：已过了2021年前后特别快的增长阶段，逐步走向成熟。 o公司自身空间：行业技术仍在持续进步，公司仍可持续赋能制造端，例 如近期与宝钢旗下某家企业沟通，可帮其解决制造环节中的问题，替代 其过去主要采用的通用电气等老产品方案；在锂电行业仍可持续提升良 率、精度，降低损耗与能耗、提升效率，空间仍然很大。 o毛利率定位：偏传统成熟的行业（如显示、新能源）毛利率相对偏低； PCB和半导体等较新且偏高端领域毛利率相对较高。同一行业内老产品毛 利率低、新产品毛利率高，不能一概而论。 物理AI/机器人：观望中，优先级靠后 o判断与定位：管理层理解物理AI更多偏向机器人方向，其难点不完全是 纯技术，还涉及大规模生产组织、成本下降到C端可用水平、体积功耗 等。在公司体系内，该方向优先级相对靠后，优先解决的是创新力要求 更高、对物理极限要求更高的产品。 o落地状态：公司已与下游有很多交流，内部有一些小项目在孵化推进， 但未将主要精力放在该方向。产品做出来对公司没有难度，但对能否在 产业上真正得到应用仍存疑虑，仍在观察如何更好地适配下游需求。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª 2.公司在半导体领域除前道量检测设备外，也布局了后道先进封装、玻璃基板 TGV、混合键合等新产品应用；公司目前在半导体领域覆盖的设备类型主要有哪 些，各方向的市场空间与技术难度如何？在下游扩产及国产替代背景下，公司 半导体订单何时能看到较为清晰的增长？ 答：公司表示，目前在半导体量检测领域整体营收规模不大，更多是与下游不同 领域开展导入验证，因此难以明确区分单一领域放量规模。从技术难度看，原则 上半导体前道量检测通常高于后道封测，因为前道精度要求一般更高，但也不能 一概而论，部分后道量测和检测的精度要求同样很高。以套刻检测为例，不同工 艺段要求都很高，且需通过不同技术方案实现，不同设备商的方案差异较大，套 刻检测中存在IBO和DBO等不同路线，分别通过影像方式和光谱方式测量。总体 上，无论半导体前道还是后道，量测与检测设备中光学部分的使用量都会远大于 X光和E-beam等类型。尽管电镜、E-beam类检测精度更高，但其检测效率无法 达到产线实际产出要求；光学检测的典型特征是产出率高、检测效率高，能在保 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 证良率的同时满足产线生产率要求，因此产线上真正的在线设备大部分以光学检 测类设备为主，光学占比会较高。公司当前产品尚不能完全覆盖所有光学量测产 品，但已经覆盖了从前道到后道相当一部分环节，并持续开发。从业务逻辑看， 增长较快的方向可能更多来自中后道封测端，尤其是先进封装，这是一个非常好 的增长方向，其并不完全是替代逻辑，还涉及堆叠等新技术问题；公司在短波红 外、光谱等多个方向均有针对性产品布局和设计。半导体导入是相对长期的过程， 现有产品及计划内产品无法覆盖全部产品，公司会随产业迭代持续投入研发，与 下游一起解决产业安全性问题，并有信心未来在该领域走到产业最前列。 3.近期资本市场关注物理AI概念，该方向可能需要大量视觉、触觉等数据采 集传感器；公司从事工业相机业务并与视觉相关，是否已经与相关公司合作或 自行在物理AI方向进行尝试？ 答：公司表示，该方向相当于上市后几个发展方向之一。公司整体特征偏向于做 技术难度相对较高、护城河可以构建得更深的行业，优先选择更高精度、更高分 辨率、更高速度的产品。上市后的产品和开发布局更多偏向自身创新能力构建， 在原有电子学能力、软件能力、算法能力之外，逐步加强光源设计以及前端器件 芯片设计等一体化能力，这类方向若公司不做，国内可能较少有人愿意做。对于 物理AI概念，若理解正确，更多偏向机器人方向；机器人方向的难点不仅在于 纯技术，还涉及大规模生产组织、成本下降至C端可用水平，以及体积、功耗等 问题，这些难度确实很高，但在公司体系内优先级相对靠后。公司当前优先解决 创新力要求更高、对物理极限要求更高的产品。关于是否会进入该方向，公司认 为能做的事情很多，但并非有能力做就一定要做，目前仍在观望；公司也与下游 有很多交流，内部有一些小项目在孵化和推进，但并未将大部分主要精力放在该 方向，主要疑虑在于产品做出来后能否在产业上得到良好应用，仍在观察如何更 好地适配下一阶段需求。公司目前规模约400-500人，过去几年更多精力用于打 造技术实力，若现阶段大规模介入规模化生产可能偏早；未来市场是否会发生变 化、在完成当前较难的事情后是否会做其他方向，仍有待商榷。 4.公司三季度各行业、各产品的毛利率和增速水平大致如何？智能光学单元等 高毛利产品后续毛利率提升空间如何？ 答：公司表示，从分行业角度看，偏传统、相对成熟的行业毛利率相对偏低，例 如显示和新能源行业；较新的领域如PCB和半导体因公司产品相对偏高端，毛利 率相对更高。但也不能完全按行业一概而论，同一行业内部不同产品周期毛利率 存在差异，老产品毛利率会低一些，新产品毛利率会高一些；例如显示行业整体 毛利率在公司下游订单中相对偏低，但其中一些新方向毛利率仍较好。关于新产 品分类，公司已将此前介绍较多的新产品统一归入“智能光学单元”大方向，内 部仍有多项具体新产品暂不逐一拆分。目前做得较早的自动对焦类系统自去年下 半年至今年已开始逐步上量，该类产品集合了光学设计、信号处理、运动控制、 高精度运动控制和实时响应等能力，虽然尺寸不一定大，但技术含量很高。过去 国产相应产品相对缺乏，或难以满足产业要求，公司产品经过约一年半到两年的 验证后，下游各领域客户反馈较好；显示等相对传统领域也会使用这类高精尖产 品。除自动对焦外，智能光学单元内还有多款新产品处于用户验证导入过程中， 未来会成为公司较好的增长支撑，当某一方向规模足够大时，公司可能将其单独 列示。公司处于设备与元器件之间的核心部件领域，单品价格与整机设备相比相 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 对不高，但其技术表现对设备整体性能影响较大，技术要求高而参与者相对较少， 因此可以获得较好的高技术附加值。预计毛利率会持续处于上升通道，整体平均 毛利率未来会回到50%以上，主要驱动力来自新产品导入和新技术释放，能够对 冲老产品毛利率下滑。 5.三季度PCB收入中，偏高阶PCB如M3、HDR占相机收入的比例大致是多少？ 从线扫相机出货台数来看，整体均价及环比变化情况如何？ 答：公司表示，PCB业务并非按上述方式拆分。对于检测精度要求较低的板子， 可能使用相机数量较少，也可能使用不同产品；公司更多是在努力把偏向AOI 的检测整合到相对统一的产品上，即标品，以提升制造端效率和客户端接受度， 这需要与下游客户大量沟通系统设计问题。可以类比半导体检测逻辑，精度要求 越高，核心检测单元的数量和质量要求都会上升，因为分辨率、速度、精度均需 提升；而速度提升后信号质量会下降，又需要进一步降低噪声，这是一个持续向 设计极限逼近的过程。就PCB领域收入结构而言，公司大部分收入来自相对偏高 端的领域，且占比最大；公司目前不太关注要求较低的产品，高阶PCB的检测量 仍处于上升状态，从下游订单及与下游客户的沟通来看均如此。除已有铜板检测 等产品外，公司还与夏一婵一起推进测孔等新方向，预计明年开始能看到一定量 释放，但需要产业逐步接受；目前客户端测试结果和终端接受度评价均较好，未 来有望成为较好增长点。 6.公司推进的测孔业务是否仍围绕相机主业展开，只是下游应用于测孔环节？ 答：公司表示，测孔业务存在不同技术路线。目前公司大概有3条技术路线在跑， 结果都还可以；有的路线使用相机，有的使用智能光单元，取决于与不同下游设 备商推进模式的差异。董总个人比较看好针对智能光单元的检测结果，其检测结 果精度更高，认为未来产业可能会更多朝这个方向发展。 7.三季度新能源行业中锂电业务的占比大致如何？对锂电行业后续发展以及 四季度至明年的趋势如何判断？ 答：公司表示，新能源行业主要区分锂电和光伏。光伏目前仍处低谷、尚未完全 起来，但从今年订单情况看开始逐步恢复；绝大部分收入仍来源于锂电，包括动 力电池、储能电池和消费电池，构成公司在新能源领域的主要收入来源。锂电行 业方面，从动力电池看，新能源汽车渗透率已很高，达到50%-60%以上，未来成 长空间相对有限，除非出现固态电池等提升能量密度的技术突破；过去渗透率从 2%-3%提升到50%有20-30倍增长，而从50%提升到100%大约只有2倍增长。能 量密度进一步提升后需求量仍可能上升，但单从动力电池角度看，未来市场空间 不会特别大。消费电池和储能仍有成长空间，消费电池可通过能量密度等技术提 升延长使用时间；储能可解决风光等新能源发电的消纳问题，化学储能建设仍有 相当成长空间，且能源需求量仍会持续上升。整体上，锂电行业已过了2021年 前后特别高速的增长阶段，更多会受到下游消费端车、电等需求增长的影响，行 业会逐步走向成熟。对公司自身而言，在锂电行业中的发展空间仍然较大，公司 可继续解决制造端问题，提升良率和产品精度，降低不必要损耗和能耗，提升效 率；这一过程是可持续的。即使钢铁等成熟行业也存在技术改造空间，公司近期 曾与宝钢下属企业沟通，过去其老产品基本使用通用电气等产品，公司同样可以 为这类产业赋能。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 8.上半年新显示业务整体实现高增，核心增长来源包括OLED、MicroLED等新 产线落地；往后看，新显示业务在2026年四季度及2027年的趋势如何，是会 继续持续向上，还是会更多呈现招标节奏性波动？ 答：公司认为，显示行业表现可能比新能源还要好一些。目前显示领域给公司贡 献绝大部分收入的仍主要为后道AOI相关领域，公司当前工作正在往中前道推进。 显示行业的工序数量虽然不如半导体多，但远大于锂电和光伏，工业要求仍然非 常高，尤其在前道领域，前道设备国产化率仍非常低，仍有大量工作可以做。上 述主要指相对偏传统的LCD与OLED，它们是当前公司在显示领域的主要收入来 源。新显示方面，包括Micro、AR/VR头显以及Waveguide相关产品，目前仍在 逐渐上升态势，公司产品在逐渐适配该领域需求，并有较大研发投入在推进这一 块工作，未来应有较好的成长性。 9.从终端客户角度来看，公司半导体领域未来整体订单以及放量节奏如何判 断？ 答：公司表示，目前讨论半导体订单的绝对数量没有实质意义，因为半导体占公 司收入体量比例非常低，但后续成长性是确定的，增速会非常快、量会非常大。 对于公司整体而言，公司并不是特别大的公司，用市场容量来讨论成长节奏并不 太合适，更关键的是提供更好的产品和服务去满足客户要求；市场容量对公司增 速的约束基本相当于没有。过去几年公司一直在提升自身效率和质量，从2024 年底至今人员数量增长非常少，虽然过程中有进有出，但总人数并未增加太多， 营收却增长约3倍，因此如何打造更强的队伍、技术底座和创新能力、适应下游 客户需求更为重要。半导体光学量检测的需求量非常大，可以说是天量，相对于 公司当前收入体量几乎可以忽略；只要产品能够满足下游用户需求，市场空间将 远超当前收入体量。节奏上仍是从易到难的过程：精度越高、越接近物理极限， 检测难度越高，客户对噪声、动态范围、速度等要求也会越高。公司产品导入结 构首先是适配国内整体光学检测装备材料企业的发展，下游发展快则公司跟得快； 从难易节奏看，应是从后道到中道再到前道。部分产品已进入比较先进的产业链 环节，公司也在参与，但越先进的环节节奏越难掌控，影响因素多，技术要求可 能需要各个维度同步突破，包括材料端，不仅仅是将信号采集到即可。公司对自 身节奏较有信心，从目前在用户端的导入节奏看，相对于当下体量会有较好增速， 预计到明年可以看到较好的成长。整体上空间非常大，现在讨论空间为时尚早， 核心仍是提升产品力、提升对相应环节的理解，做出更好的产品适配需求；在该 领域只要产品达标，需求量将非常巨大。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "attachment:files/Bernstein-英特尔（INTC）：26 年第三季度回顾 —— 着眼未来之前，先熬过当下 Intel (INTC) Q326 Recap - Before you get to the future you have to live through the present....pdf": {"id": "attachment:files/Bernstein-英特尔（INTC）：26 年第三季度回顾 —— 着眼未来之前，先熬过当下 Intel (INTC) Q326 Recap - Before you get to the future you have to live through the present....pdf", "kind": "attachment", "title": "Bernstein-英特尔（INTC）：26 年第三季度回顾 —— 着眼未来之前，先熬过当下 Intel (INTC) Q326 Recap - Before you get to the future you have to live through the present...", "source_label": "Bernstein", "excerpt": "30 October 2026 U.S. Semiconductors Intel Corp Rating Market-Perform Price Target INTC 75.00 USD (110.00 OLD ) Stacy A. Rasgon, Ph.D. +1 213 559 5917 stacy.rasgon@bernsteinsg.com A", "content": "30 October 2026 U.S. Semiconductors Intel Corp Rating Market-Perform Price Target INTC 75.00 USD (110.00 OLD ) Stacy A. Rasgon, Ph.D. +1 213 559 5917 stacy.rasgon@bernsteinsg.com Alrick Shaw +1 917 344 8454 alrick.shaw@bernsteinsg.com Arpad von Nemes +1 917 344 8461 arpad.vonnemes@bernsteinsg.com Eva Zhang +1 212 845 7839 eva.zhang@bernsteinsg.com Adjusted EPS F25A F26E F27E INTC (USD) 0.43 1.49 1.78 OLD -- 1.62 2.19Financials F25A F26E F27E CAGR EBIT (M) 2,916 9,161 12,223 -- FCF (M) 4,949 874.03 7,473 22.9%Valuation Metrics F25A F26E F27E Adjusted P/E (x) 216.0 61.9 51.8 EV/Sales (x) 9.7 8.3 7.5 Source: Bloomberg, Bernstein estimates and analysis.Intel (INTC): Q326 Recap - Before you get to the future you have to live through the present... Intel’s Q3 results were fine ($16.5B/$0.52 vs Street $16.5B/$0.40). Client missed ($8.1B vs Street $8.8B) though Datacenter came in solidly above (~$7.3B vs Street $6.7B). Gross margins at 44.1% were ahead (Street 42.0%), driven by improved costs and favorable mix. Q426 outlook however was (in a word) terrible ($15.5B/$0.25/38.0% vs Street $17.0B/ $0.43/42.8%), well below consensus as PC headwinds finally manifest, with client seen down >20% QoQ (~$6.3B vs Street $8.4B) amid weaker demand and a sharp inventory correction. DCAI revenues are seen better, expected to grow mid-teens QoQ, to ~$8.4B and above the Street at ~$7.7B. Gross margins are seen well below at 38% vs Street at ~42.8%, down ~600bps QoQ given lower revenues, impact from scrappage following a recent tragic accident at their Israel fab, and less favorable product mix. Intel has benefited from a very strong server market and a supportive narrative around their potential foundry prospects. However, this had led investors to gloss over an increasingly negative PC outlook; unfortunately this is the quarter when they hit the wall in that regard. More disappointingly, once again company clearly did not see it coming and is still struggling to get their manufacturing footprint aligned with the market (they still have too much PC capacity and not enough server, the latter a year into the current cycle). If searching for a silver lining we suppose that long term drivers do in fact seem to be intact; namely yields on new processes (Intel 3 and 18A) are still moving higher, foundry customer engagements appear to be progressing, new businesses (ASIC, packaging etc) seem likely to show up reasonably soon, and the balance sheet is in better shape. That being said, it remains a slog with the turnaround still in the early innings, and investors are now realizing that they have to live through the present before they get to that future. Lowering estimates, PT to $75 (~5x EV/sales vs ~8x prior given renewed uncertainty around outlook) on avg FY27/28 ests); we rate INTC MP. Investment Implications INTC (MP, $75): Server strength is helping the company get back on their feet, but sharply negative PC outlook is creating substantial near-term headwinds.Close Date 29 Oct 2026 INTC Close Price (USD) 92.07 Price Target (USD) 75.00 Upside/(Downside) (19)% 52-Week Range 142.35/32.89 SPX 7,720.39 FYE Dec Div Yield NA Market Cap (USD) (M) 486,596 EV (USD) (M) 514,597 Performance YTD 1M 6M 12M Absolute (%) 149.5 (20.6) (2.8) 122.7 SPX (%) 12.8 0.6 8.2 12.0 Relative (%) 136.7 (21.2) (11.0) 110.7 Source: Bloomberg, Bernstein estimates and analysis. Price Performance, 1YR $160 $140 $120 $100 $80 $60 $40 10/25 01/26 04/26 07/26 10/2665007000750080008500 INTC SPX See the Disclosure Appendix of this report for required disclosures, analyst certifications and other important information. Alternatively, visit our Global Research Disclosure Website .www.bernsteinresearch.com First Published: 30 Oct 2026 03:11 UTC Completion Date: 30 Oct 2026 03:11 UTC on 30-Oct-2026 Stacy A. Rasgon, Ph.D. +1 213 559 5917 stacy.rasgon@bernsteinsg.com 30 October 2026 DETAILS Please click here for our model: INTC . Intel’s Q3 results were fine, with revenues in line with the Street and gross margin and EPS above ($16.5B/$0.52 vs Street $16.5B/$0.40). Client missed the Street given burgeoning PC market weakness, while Datacenter and IFS beat. Datacenter came in solidly above the Street (at ~$7.3B vs $6.7B consensus), with demand continue to outstrip supply. However, it was offset by a meaningful miss in Client (at ~$8.1B vs $8.8B consensus) given the sequential decline in PC market in Q3 amid current memory dynamics. Gross margins came in ahead at 44.1% vs. consensus at 42.0%, driven by improved costs on Intel 3 and Intel 18A and a more favorable product mix. •Intel’s revenues of $16.5B were in line with consensus ($16.5B) and above guidance of $16.3B (Exhibit 1). Datacenter came in solidly above the Street (at ~$7.3B vs $6.7B consensus), with demand continue to outstrip supply. This was however offset by a meaningful miss in Client (at ~$8.1B vs $8.8B consensus) given the HSD% to LDD% sequential decline in overall PC market (Exhibit 9) amid current memory industry dynamics. •Non-GAAP EPS of $0.52 was above consensus of $0.40 and guidance of $0.38, driven by higher gross margin and lower opex ( Exhibit 1 ). •Non-GAAP gross margins of 44.1% were well above consensus (42.0%) and guidance (42.0%) ( Exhibit 4 ) driven by improved costs on Intel 3 and Intel 18A and a more favorable product mix. •Non-GAAP Opex came in at ~$4.05B , lower than consensus ($4.26B) ( Exhibit 6 ). •Client Computing and Physical AI Group (CCPG, formerly Client Computing Group) revenues of $8,097M declined -5% YoY and declined -9% QoQ (Exhibit 7 ), below consensus at $8,819M. The company indicated an accelerating pace of correction over the last month or two of the quarter, as OEMs managed inventory to align with softer sell-through, with purchase patterns shifted fairly dramatically starting late August/into September. Operating income was $2,285M, down -15% YoY, with margins up ~180bps sequentially from 26.4% to 28.2% ( Exhibit 8 ). CCPG revenue decline was broadly in line with overall PC market (which had units down QoQ (-9%/-14%) as per IDC and Gartner ( Exhibit 9 ). •Data Center & AI Group (DCAI) revenues of $7,318M were up +78% YoY and up +17% QoQ, meaningfully above consensus at $6,675M. Operating income was $3,039M, up 215% YoY and operating margins came up ~200bps QoQ from ~39.5% to 41.5% ( Exhibit 7 , Exhibit 8 ). •Intel Foundry Services revenues of $6,697M were up +58% YoY and up +16% QoQ (Exhibit 7 ), above consensus at $6,117M. Operating loss was $1,853M, a smaller loss than the $2,089M loss in Q226, with Operating margins improving by ~860bps QoQ (though remaining horrendously negative) to -27.7%. External foundry sales were $411 million, up $118 million sequentially, primarily due to a nonrecurring customer program. •All Other revenues (which primarily include Mobileye and IMS) of $692M were down -30% YoY and were down -1% QoQ (Exhibit 7), above consensus at $670M. Operating income was $179M, up from $100M YoY with Operating margins down -690bps QoQ to 25.9%. Mobileye revenues (reported earlier in the day) were $492M, down -2% YoY and down -3% QoQ with Operating margins coming in at ~18% compared to ~31% last quarter. Q426 outlook, however, was (in a word) terrible ($15.5B/$0.25/38.0% vs Street $17.0B/$0.43/42.8%), down ~6% QoQ and well below consensus primarily as PC headwinds finally manifest, with the client group seen down over 20% QoQ (~$6.3B vs Street $8.4B) amid weaker demand and a sharp inventory correction, a trend seen continuing into Q1. The company also now sees the PC unit TAM in 2026 down 12% YoY and down 10% YoY in 2027. DCAI revenues are seen better, expected to grow mid-teens QoQ, to ~$8.4B and above the Street at ~$7.7B, and the company will continue to bring supply online through 2027 (equipment and substrates, maybe more back-end loaded though. Gross margins are seen well below at 38% vs Street at ~42.8%, down ~600bps QoQ given lower revenues, impact from scrappage following the recent tragic accident at their Israel fab, and less favorable product mix. FY26 capex was outlook was maintained ~$20B, and FY27 capex is still expected to be “up strongly”. U.S. SEMICONDUCTORS 2 on 30-Oct-2026 Stacy A. Rasgon, Ph.D. +1 213 559 5917 stacy.rasgon@bernsteinsg.com 30 October 2026 •Q426 revenues were guided to ~$15.5B at the midpoint, well below street estimates at $17.0B, and down ~6% QoQ given significant weakness in Client as memory shortages impact the PC market and OEM customers reduce inventory, which is more than offsetting DCAI sequential strength amid continued supply constraints ( Exhibit 10 ). •Client is seen down over 20% sequentially. Within Client, management sees customers quickly reducing inventory levels amid continued memory shortages. Inventory reduction is expected to persist through Q4 and Q1, with management expecting to ship to parity with end-demand around the Q2 timeframe, however the market remains weak with the PC unit TAM now expected to be down 12% YoY in CY26 and down ~10% in CY27 . Embedded sequential growth is expected to be directionally consistent with the Client CPUs. •DCAI revenues are expected to grow mid-teens QoQ , to ~$8.4B and above the Street at ~$7.7B. Management expects to bring on more capacity, especially on Intel 3 but will remain supply constrained, and noted an increased mix of revenues from purpose built silicon. •Non-GAAP gross margins were guided to 38.0%, well below consensus of 42.8% and down ~600bps QoQ. The sequential decline is driven by lower revenues, impact from scrappage following the recent tragic accident at their Israel fab, and less favorable product mix, with management noting a ~200bps impact from each of those factors. Anecdotally, management also noted that although overall DCAI gross margins are accretive, the increased mix of purpose built silicon is dilutive and the increasing shift to Intel 3 node products is also dilutive to DCAI margins (despite Intel 3 being accretive to corporate average) ( Exhibit 10 ). •Opex is likely seen in-line with consensus ($4.4B vs Street at ~$4.4B) , with FY26 Opex now seen at $16.3B. •Tax rate is seen at 11%. •FY26 capex was outlook was maintained ~$20B, and FY27 capex is still expected to be “up strongly” . •Non-GAAP EPS outlook is seen at $0.25, well below consensus at $0.43 (us at 0.41). Intel has benefited from a very strong server market and a supportive narrative around their potential foundry prospects. However, this had led investors to gloss over an increasingly negative outlook for PCs, and unfortunately this is the quarter when they hit the wall in that regard with a client outlook that was, frankly, shocking. Indeed, it almost feels worse as the company clearly did not see it coming (not the first time that has happened) and is still struggling to get their manufacturing footprint aligned with the market (they still have too much PC capacity and not enough server, the latter a year into the current cycle). •Intel has been benefitting from a very strong server market (indeed, they’ve lucked out due to it though we’ll take lucky over good any day) as well as a supportive narrative around potential foundry prospects. •However, this has led investors to gloss over an increasingly negative outlook for PCs given the current memory environment. This is an issue we have been flagging for some time, observing that CPUs have been overshipping PCs for a while (bringing incremental inventory risk; Exhibit 11-Exhibit 12 ) on top of a weak market. Unfortunately this seems to be the quarter when they hit the wall in that regard with a client outlook that was almost shocking bad (a billion dollars below our number that we had slashed into the print, and that itself was more than a billion dollars below consensus). •Indeed, it almost feels worse as the company clearly did not see it coming (not that they ever do). But they are clearly still struggling to align their manufacturing footprint with market realities. T o whit, they still have too much PC capacity (and are currently tying to move some of their 18A capacity in Oregon over to Intel 3 to offset it) and not enough server capacity. The latter seems especially disappointing as they did not even see the start of the server surge until it was too late (they ran into issues late last year if you recall) and we are now a full year into the current server cycle. If searching for a silver lining we suppose that long term drivers do in fact seem to be intact; namely yields on new processes (Intel 3 and 18A) are still moving higher, foundry customer engagements appear to be progressing, new businesses (ASIC, packaging etc) seem likely to show up reasonably soon, and the balance sheet is in better shape. That being said, it remains a slog with the turnaround still in the early innings, and investors are now realizing that they have to live through the present before they get to that future. Other tidbits: U.S. SEMICONDUCTORS 3 on 30-Oct-2026 Stacy A. Rasgon, Ph.D. +1 213 559 5917 stacy.rasgon@bernsteinsg.com 30 October 2026 •Inventories rose QoQ to $13.1B and days of inventory rose to 127 days vs120 last quarter( Exhibit 13 ). •Cash return: INTC has suspended their dividend and has halted their buyback program. We update our model and lower estimates. We take down our price target from $110 to $75 (~5x on the average of our FY27/28 sales) and maintain our Market-Perform rating. •We update our model, and lower estimates. We now model a sizeable PC CPU inventory flush in Q4/Q1 and take our PC TAM assumptions down to -10% for CY27 (though a10% rebound in 2028, hence with a smaller revision in our out-year revenues vs 2027). We also increase share count to account for the company’s recent equity raise. •We lower our FY2026 pro-forma revenue estimate from $62.7B to $61.7B, FY2027 from $73.0B to $68.9B, and FY2028 from $83.5B to $83.0B. •We lower our FY2026 non-GAAP EPS estimate from $1.62 to $1.49, FY2027 from $2.19 to $1.78, and FY2028 from $3.21 to $2.91. •We lower our multiple from ~8x EV/Sales to ~5x given increased uncertainty around the company’s outlook, and take down our price target from $110 to $75 (~5x EV/sales on the average of our FY27/28 sales estimate ~$76.0B). •We maintain our Market-Perform rating. EXHIBIT 1: Q3 Revenue was inline and EPS was above Q326 Actual ConsensusActual vs. ConsensusBernsteinActual vs. Be 净利-19.42亿元，同比减亏；其中，2026Q3实现收入159.93亿元，同比下降15%，环比增长6%；归母净利-16.72亿元，同环比亏损扩大。 1、光伏方面，Q3组件出货13GW，环比基本持平，单瓦亏损4-5分，环比变化不大；储能方面，Q3出货约5GWh，预计保持微利，主要是碳酸锂期货套保影响。其他业务，分布式销售约1GW，预计贡献利润1亿元（含发电运维）；支架销售约1GW+，预计贡献少量利润。 2、其他指标，Q3期间费用率13.19%，同比提升2.23pct，环比下降0.44pct，期间费用金额21.09亿元，同环比增加2%左右；Q3公允价值变动损失10.98亿元，主要是公司持有的T1 Energy股票下跌导致，资产减值损失2.27亿元，信用减值损失1.55亿元。前三季度经营活动现金流净额同比增长64.73%，主要是销售回款增加带动经营活动现金流入增长。 3、展望后续，公司深耕高价值市场，组件业务高质量订单占比稳步提升，盈利能力持续改善；加速推动储能业务和系统解决方案业务转型发展，储能及分布式业务对利润形成积极贡献。此外，深南电A公告拟以支付现金的方式购买天合跟踪不低于51%且不超过70%股权，通过引入战略合作方实现强强联合。#文字观点", "publish_time": "2026-10-31 12:56", "tags": ["文字观点"]}, "post:2026-10-31T12-56:b1ccaf17765b": {"id": "post:2026-10-31T12-56:b1ccaf17765b", "kind": "post", "title": "2026-10-31 12:56", "source_label": "帖子正文", "excerpt": "赛力斯：26Q3 表观扭亏，扣非仍亏 13.65 亿，赛豆科技出表贡献全部利润 📈26Q3： Q3 营收 280.80 亿元（yoy-41.66%，qoq-11.55%） Q3 归母净利润 14.20 亿元（yoy-40.12%，qoq 扭亏，Q2 为-24.71 亿元） Q3 扣非归母净利润 -1", "content": "赛力斯：26Q3 表观扭亏，扣非仍亏 13.65 亿，赛豆科技出表贡献全部利润 📈26Q3： Q3 营收 280.80 亿元（yoy-41.66%，qoq-11.55%） Q3 归母净利润 14.20 亿元（yoy-40.12%，qoq 扭亏，Q2 为-24.71 亿元） Q3 扣非归母净利润 -13.65 亿元（yoy-159.54%，qoq 减亏 11.16 亿元） Q3 毛利率 21.00%（qoq+0.08pct，同比约-8pct）；净利率 5.06%（yoy+0.13pct，但全部来自一次性收益） 📈销量： Q3 新能源汽车销量 7.77 万辆（yoy-41.3%，qoq-22.5%），自 6 月起连续四个月单月同比下滑；9 月 2.93 万辆（yoy-34.48%，qoq+20.7%），环比修复但同比仍深跌； 1-9 月累计 25.65 万辆（yoy-15.79%），全年 65-70 万辆目标完成率仅 37%-39%。 📈单车指标： Q3 ASP 约 36.12 万元（yoy-0.5%，qoq+14.1%）——M9 Ultimate9 月交付把单价顶住，但撑不起量； Q3 单车归母净利 1.83 万元（yoy+2.2%，qoq 转正）；剔除一次性损益后单车扣非净利-1.76 万元（上年同期+1.73 万元）。 📈非经常性损益： Q3 非经常性损益 27.85 亿元，其中非流动性资产处置损益 26.06 亿元，源于子公司赛豆科技（原蓝电科技）出表：7 月 31 日完成 66.71 亿元增资扩股，重庆国资方持股 34.5% 成为第一大股东，赛力斯持股降至 32.96%，成本法转权益法，剩余股权按公允价值重估。赛豆已发布 AIVA 品牌、首款 ME7 年内亮相。 Q1-Q3 非经常性损益 34.47 亿元，非流动资产处置 26.18 亿元。 📈毛利率与费用： Q1-Q3 毛利率 22.55%（yoy-6.83pct），Q3 单季 21.00%、环比已企稳（Q2 20.92%，qoq+0.08pct）；电池、芯片等核心零部件涨价，叠加产量下滑导致规模效应摊薄不足，是毛利率下滑主因； Q3 单季四项费用（销+管+研+财）合计 67.12 亿元、费用率 23.90%（yoy+2.92pct，qoq+0.17pct），已超过当季毛利 58.97 亿元——毛利不足以覆盖费用，是 Q3 扣非亏损 13.65 亿元的直接来源。其中销售费用 38.14 亿元（yoy-45.9%，qoq-19.7%），费用率 13.58%（yoy-1.07 度整体表现：2026年前三季度营业收入149.25亿元，同比增长21.33%；净利润15.8亿元，同比增长15.85%。", "content": "昊华科技2026三季报业绩解读会议20261030 要点总结 1.2026年三季报核心业绩数据与单季利润扰动因素拆解 前三季度整体表现：2026年前三季度营业收入149.25亿元，同比增长21.33%； 净利润15.8亿元，同比增长15.85%。3+1核心板块（高端氟材料、电子化 学品、高端制造化工材料、碳减排）整体稳中向好。 单三季度业绩分化：单三季度收入同比有增长，毛利同比增长2.93%，但利 润略有下降，主因长期投资及长期投资预提损益、税收影响。 单三季度利润下滑的具体扰动项 o联营/合营企业投资收益减少：与梅兰的合资企业（做R32）受制冷剂影 响业绩不及去年；沐风蓝天、与霍尼韦尔的合资公司等亦有影响；联营 企业投资收益减少合计数约5,600多万元。 o参股公司减值计提：中化蓝天旗下一家参股公司（涉及城投）因重新评 估、基于谨慎原则计提减值，金额约3,000多万元。 o太仓环保税收变化：因制冷剂景气带动收入增加、研发占比下降，不再 符合当地高新技术企业税收优惠认定标准，所得税率由15%升至25%，且 税损已用尽，对利润形成压制；但公司整体及该板块毛利仍略有增加。 o分板块看：前三季度碳减排板块收入增长，但利润、毛利和毛利率略有 下降；单三季度高端氟材料板块利润有所下降，毛利未增加、利润下滑。 全年指引：整体进度符合公司预算，公司对完成全年任务有信心。 2.四大板块利润贡献拆分 前三季度利润占比：高端氟材料占60%-70%；高端制造化工材料约占20%； 其余10%多由电子化学品和碳减排各半分摊。单三季度占比结构与前三季度 基本一致。 中化蓝天内部业务拆分（高端氟材料主载体）：业务分四块——氟碳材料（含 制冷剂和发泡剂）、锂电材料、氟聚合、氟精细。其中：氟碳材料（制冷剂） 仍是利润的绝大多数来源；锂电材料2026年前三季度表现不错、实现盈利； 两者构成中化蓝天利润的主要来源。氟聚合板块目前仍处于亏损状态（由制 冷剂和锂电材料利润弥补）。氟精细占比不大，但无拖累，国际合作业务有 拖累。 3.电子化学品（昊华气体）：六氟化钨验证放量、电子特气逻辑兑现 三氟化氮：沿滩基地6,000吨电子级三氟化氮产能已有投产（去年投产一条 线、上半年投产一条线），目前已做到满产满销，产能释放为板块带来收入 和毛利增量。 六氟化钨：核心边际变化，量价齐升、验证窗口打开 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 o需求催化：钨粉出口受限后，市场原本预期日本断供会立即带来供不应 求，但实际转化节奏受制于六氟化钨较长的验证周期；目前验证机会与 市场拓展效果开始逐步显现，六氟化钨已实现量价齐升。 o出货量指引：2025年出货量约60吨（主要面向半导体/存储客户）；2025 年底做预算时规划2026年出货量120吨，目前看来完全符合进度预算。 o盈利贡献：电子化学品板块前三季度及单三季度均表现良好，尤其单三 季度毛利及毛利率增长较多，9月份表现尤为突出，公司判断六氟化钨 市场拓展效果将在未来逐步体现。 o客户拓展：海内外客户均有拓展，部分客户已通过验证、供货量增加， 涉及商业机密未披露具体名单。 六氟丁二烯：1,000吨粗气装置在中化蓝天（去年建成），目前产能利用率 约20%-30%，已可完全满足下游气体商（如中船、华特等）需求；公司自有 200吨纯化装置在昊华气体建设中，计划2026年底建成，但纯化产能建成后 仍需经历较长验证周期（下游主用于存储领域，导入需要时间）。 其他新品与战略定位：昊华气体还在向上下游拓展，布局六氟化钼等品种； 中化蓝天也在做光刻胶。公司高度看重该板块，认为随着AI及半导体产业 发展，含氟电子特气及电子化学品的应用场景和机会很大，在资金及研发投 入上均有倾斜；具体新品进展将以公告披露为准。 高端氟材料板块毛利率下降的原因之一：电解液毛利率目前仍不高，拖累了 该板块毛利率。 4.高端氟材料：制冷剂出口扰动、锂电材料扭亏为盈、氟聚合物仍承压 制冷剂：三季度销量承压、价格坚挺，四季度供给趋稳 o销量下滑原因：三季度进入制冷剂传统淡季，叠加伊朗战争等出口扰动， 销量出现明显下降。 o价格情况：价格基本保持稳定（配额制下政府管控价格），自实施配额 制以来，价格经过一轮快速上涨后已基本达到供求平衡状态。 o四季度展望：目前供求基本趋向稳定，仍处于淡季；应用场景出现结构 性变化（由空调、新能源汽车向存储等 面向空调、新能源汽车等，目前一些应用场景会 往存储等方面变化。另外，海外也存在一些机会，比如太仓134A装置本来要检 修，但9月30号刚拿到一个海外单子，正在生产。整体来看，四季度还是淡季， 确实有一定影响。 2.三季度制冷剂这一块的下滑对业绩产生了多大的影响？ 答：制冷剂业务主要在中化蓝天，三季度进入淡季，同时受战争影响，销量确有 下降，但价格基本保持稳定，对业绩有一定影响。 3.基于今年下半年出口受损的情况，海外市场理论上处于比较低库存的状态， 公司对于明年外销的量以及外贸的价格是怎么展望的？ 答：具体还需要看实际情况。实施配额制以来，价格经历了比较快速的上涨过程， 目前基本达到供求平衡。例如9月30号拿到的太仓134A单子，价格还是可以的。 但未来还要看具体的市场供求情况，还要看战争的影响、运输的影响等具体影响 因素。 4.三季度业绩中联营企业、合营企业的投资收益减少以及计提的资产减值损失 比较多，能否详细拆解一下这一块的具体情况？ 答：联营合营企业方面，主要是与梅兰的合资企业，做R32，受制冷剂影响，业 绩不及去年，投资收益减少。还有沐风蓝天，以及跟霍尼韦尔的合资公司，可能 都有一定的影响。整体投资收益减少大约5600多万。关于城投的减值，是蓝天 下面有一个参股公司，因重新做了评估等，出于谨慎原则计提了减值，大概3000 多万。另外，太仓环保因这两年制冷剂比较好，收入增加后研发占比减少，不符 合当地高新技术产业税收优惠政策认定标准，税率由15%升到25%，同时税损也 快用完了，对利润有一定影响。但实际上该板块及公司整体毛利还是略有增加的。 5.气体这一块，像六氟化钨这些品种，以及新产能的释放情况，目前几个大的 品种整体销售开工的情况和价格的情况，能否再做一个更新？ 答：三氟化氮方面，盐滩那边有6000吨电子级三氟化氮投产，一个去年投产， 一个上半年投产，基本上已经做到满产满销，产能释放给板块带来毛收入和毛利。 六氟化钨方面，之前大家预期钨粉不能出口后日本会断供，600吨会供不应求， 但因六氟化钨有比较长的验证周期，效果现在才开始慢慢显现。目前六氟化钨确 实是量价提升，去年年底做预算时预计今年能达到120吨的出货量，目前完全符 合进度预算。整体该板块前三季度及单三季度都很好，尤其单三季度毛利增长较 多，毛利率增长也比较多，尤其9月份表现更好，未来市场拓展效果会慢慢体现。 6.六氟丁二烯等其他一些品种目前的情况怎么样？之前更多的是粗气装置，现 在纯化装置建设的情况怎么样？ 答：六氟丁二烯在中化蓝天有1000吨粗气产能，去年建成，产能利用率差不多 在20%-30%，可以完全供应下游气体商的需求。下游客户通过气体商再对到终端 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 客户，像中船、华特等都从蓝天拿六氟丁二烯的粗气。公司自己的纯化装置在气 体公司建设，计划200吨，正在建设中，计划今年年底建成。纯化产能建成后， 也会像六氟化钨一样有比较长的验证周期，因为它下游主要用在存储这一块，也 需要时间。 7.锂电材料板块今年整体修复情况比较好，但近期碳酸锂价格往下走，六氟和 电解液短期内压力在慢慢增加，从公司业务状态看，能否给大家做一个更新， 以及对于明年这一块业务的展望怎么样，相较于今年会不会存在下滑的情况？ 答：目前整个锂电材料板块整体毛利是挣钱的，去年是亏钱，毛利亏一个多亿， 今年挣钱了，上半年毛利差不多一个多亿。三季度确实有一些下滑，开始有一些 压力，但公司会根据市场情况进行调整。目前策略上依然是电解液加的思路没有 变，现有产能为9000吨六氟磷酸锂、25万吨电解液。电解液产能利用率差不多 能达到40%，这是高端氟材料板块毛利率下降的原因之一。在西南沿滩基地的10 万吨电解液项目已建成，目前在爬坡过程中，慢慢释放。该项目建在自贡基地， 与2.6万吨高端氟材料、6000吨三氟化氮形成协同效应，包括用电、用水、用 气、协同办公等，下游宁德时代、京东方等在西南有布局，运输半径降低，对产 品竞争力有正向影响。明年具体怎么做，公司会根据实际情况决定应对措施，目 前来看是盈利的。 8.电解液包括PVDF方面，今年大体的销量和开工率情况怎么样？ 答：PVDF开工率差不多60%。分两条线，一条线供不应求，另一条线因下游应用 不如预期稍弱。电池级PVDF目前生产情况非常好，毛利率也可以，产能利用率 在60%左右，产能利用率在40%左右，产能也在逐步释放。 9.能否拆分一下前三季度以及单三季度各个板块的利润贡献情况？ 答：前三季度从利润角度来看，高端氟材料占60%-70%，高端制造化工材料占差 不多20%，剩下10%多由电子化学品和碳减排两个板块各半。单三季度也差不多， 前三季度和单三季度基本差不多。 10.公司高端制造板块相关院所的业绩和未来的走势如何？ 答：高端制造化工材料板块今年前三季度净利润略有增长，收入基本持平。业务 分两块，一块是特品，一块是民品，特品保持比较稳定的状况，民品现在是一个 起点，未来可能会有更好的增长。具体分院所看，黎明院业务主要是三块：特品、 聚氨酯、双氧水（主要是钯催化剂）。特品占比比较大且比较稳定，聚氨酯有一 些产品解决进口替代、填补国内空白，有稳定增长。西北院略有下降，主要是客 户交货节奏的问题，对全年影响不大。海化院主要做涂料，特品方面有点压力， 也是与交货节奏有关，民品正在一个起点上，其涂料用于737首架飞机已开始涂 装，之后几年应该有好的发展。曙光院做轮胎，特品基本稳定，民品有10万条 民用航空轮胎项目，已取得C909、C919以及空客320、波音737-700-800的装 机证。目前波音737-700-800、空客320在瑞丽航空和桂林航空试飞，尚未取得 跟三大航的合作；737已在半年报公告开始合作但还没有形成批量供应；C909 基本已跟南航有合作，批量供应。目前还没有取得比较好的市场营销效果，但有 了一些开始，要取得成效也需要时间。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 11.高端制造材料这些院所加起来，整体的利润情况大概能达到多大的利润体 量，和之前比有没有恢复到比较常规的状态？ 答：基本上从利润端是差不多一个正常年份的样子，高端制造化工材料板块利润 基本差不多。 12.什么时候高端制造板块能看到比较显著的增长，或者某一个板块能起来？ 答：要看曙光院的轮胎，如果跟三大航之间的合作与销售取得成功，会有一个爆 发式的增长。涂料方面，如果在民用这一块，比如工业防腐涂料、海洋船舶领域 跟招商局等的合作取得进展，应该也会有增长空间。但这些都需要时间。 13.PTFE在高频高速覆铜板方面的应用公司有参与吗？目前方案落地的确定性 如何？ 答：PTFE在中化蓝天下面的晨光院，晨光院是建国后化工部建设的研究院所， 建院之初就研究氟聚合，PTFE是其有研发优势的产品，也是第一家做覆铜板用 PTFE的企业。生益科技等本身也是晨光院的客户，公司每年向不同客户提供PCB 用的PTFE，每年在1000吨左右。公司一直根据客户需求从研发上与下游需求一 起做工作，但对于下游客户拿到产品后是否应用到其他方向，公司不了解。公司 有覆铜板用PTFE的技术和产能。 14.每年四季度公司在费用端都有比较大的影响，今年四季度也会一样吗？ 答：根据各企业的预测，到第四季度与往年相比基本持平，没有明显的增长。以 往每年年末增长可能是减值计提，比如资产到年底测算，但今年策略改变了，按 月该预提的、该计提的减值都已经预计完了，预计不会出现波动特别大的情况。 15.每年财务费用、管理费用在四季度可能会有突然的增长，这一块主要是哪 些方面的影响？ 答：一方面是个别的参股企业投资情况不如预期，根据未来现金流量的情况做减 值测试，测试完以后确认减值，当期计提入账了，不需要再等到年底统一做测试。 根据公司的整体政策，把各种预计到的情况分散到各个会计期间，以往可能存在 年底集中统一做测试的情况，今年情况有所改变。 16.锂电材料、制冷剂今年分别的利润贡献大概有多少？ 答：中化蓝天业务分为四块：氟碳材料（含制冷剂和发泡剂）、锂电材料、氟聚 合和氟精细。前四个月和前三季度制冷剂占的比较多一些，锂电材料今年前三季 度表现不错，两个板块基本构成中化蓝天主要的利润来源。氟聚合目前是亏损状 态，制冷剂和锂电材料带来的利润还要弥补氟聚合的亏损。晨光院2.6万吨高端 氟材料投产后每年有比较大的折摊，产能释放情况还没达到预期效果。制冷剂占 比绝大多数，锂电材料今年盈利，毛利差不多有1个亿。氟精细占比不大，但没 有拖累，六氟丁二烯、除了用于农药医药中间体的产品等都放在氟精细板块。国 际合作有拖累。 17.公司目前费用率相对同行业较高，后续在费用管控方面有什么规划？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：这是公司近年来的重要工作。公司有两个行动，一个叫提质增效，一个叫卓 越运营。一直在做应收账款的回收、营运资金的管理等工作。公司也与巨化做过 对标，管理费用较高是因为人员较多等因素。这是公司关注的重点，已经在采取 措施，在利润和成本方面已有体现。目前公司正在做内部叫卓越运营2.0的行动 计划，正在做这些工作。 18.股权激励方面推进的情况如何？ 答：公司2019年做过一次股权激励，取得特别好的作用，2018年到2022年收 入和利润复合增长率在22%左右。蓝天进来之后，公司一直在谋划第二期股权激 励。因为公司是央企控股上市公司，股权激励要经过国资委的审核和批复。2024 年底蓝天进来之后就一直在做股权激励准备工作，目前还在报批过程中，也在积 极推进。 19.公司碳减排业务的执行情况、在手订单、资本开支计划及潜在市场空间如 何？ 答：碳减排业务主要在西南院。西南院前年建了5000吨的催化剂基地项目，去 年又增扩了500吨铜系催化剂，目前已经完成。业务除了催化剂之外，还有一项 是PSA变压吸附技术，随着双碳战略提出，PSA技术应用发展较好。但从去年开 始，传统下游领域开始有所放缓，公司正在往绿醇、绿氢等新方向拓展。西南院 中标了金发科技兴安盟150万吨项目，三期都有中标，目前在手订单大数有20 个亿。项目刚开始毛利率会比较低，三季度碳减排板块收入增长25%，但毛利和 毛利率是下降的，这个应该是暂时的。9月份西南院与金发科技兴安盟项目一期 建成了，示范效应已经出现，之后业务应用场景和范围应该还是比较大的，市场 规模应该比较大。催化剂方面，铜系、镍系催化剂毛利率相对高一些，未来随着 500吨铜系建成和市场拓展，应该会给公司带来比较好的毛利率提升。 20.六氟化钨目前主要的客户有哪些？电子化学品新品拓展情况如何？ 答：电子化学品主要在昊华气体公司。钨粉出口受限后，对国内六氟化钨厂商客 户的拓展有很大帮助，因为之前六氟化钨验证的窗口和机会不是很好找。去年出 货量有60吨，主要是一些半导体、存储类的客户。今年一直在海内外拓展客户， 但涉及商业机密，客户验证通过和供货量增加的具体情况不方便讲。电子化学品 拓展方面，气体公司除含氟电子气体外也在往上下游拓展。六氟化钼、光刻胶等 新品在蓝天也在做。公司非常看重这个板块，认为随着AI发展、半导体发展， 含氟电子特气及电子化学品的应用场景和机会很大，公司很重视并在板块投入了 很多力量和资金，包括研发等方面都有倾向。具体进展以公司披露的公告为准。 21.目前看公司还有哪些在建项目？未来的资本开支预期如何？ 答：2026年年初做的规划今年资本开支大数25亿。目前在建及产能释放方面， 高端氟材料板块2.6万吨高端氟材料建成后，1.8万吨PTFE产能利用率还在 50%-60%，还有继续释放空间；还有10万吨电解液、2万吨PVDF。在建的还有已 公告的四代制冷剂、电解质六氟磷酸锂、4000吨精细化工项目，其中精细化工 项目计划2026年11月建成投产。电子化学品板块6000吨电子级三氟化氮已建 成，未来也可能有其他布局，有些项目还在立项研究阶段。第三个板块黎明院有 两个退城入园项目在产能释放过程中，海化院有1000吨涂料项目，西北院有一 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 些航空密封型材项目，还有一些涉及特品的豁免披露项目。第四个板块催化剂 500吨铜系已完成。三季报里面也有披露这些项目。十五五期间在各个板块的投 资计划，年初股东会上也披露过。 22.国开制造业转型升级基金三季度减持是什么情况？减持计划如何？ 答：国开行是公司春风项目配套募集资金时进来的投资者，三季报中有减持，可 能有他们自己的计划，股东的事情公司还没有特别了解到。 23.股权激励还在上报国资委审批，如果报批流程拖的时间比较长的话，选择 的基数还是以2025年为基数吗？ 答：2025年肯定还是基数。2026年做不了考核年度也做不了基数，应该还是以 2025年为基数。 24.每年资本开支的体量大概有多少？后续几年基本会维持差不多的体量吗？ 答：今年大数25个亿。后续基本维持差不多的节奏，年初在股东会上也都披露 过，差不多这个节奏。具体还要看具体方案来，不能很准确地回答。 25.提到2027年预算，下属各个子公司现在报预算的话会更积极一点还是会比 较保守？考核压力大不大？ 答：目前公司正在做三上三下的预算流程，还没有看到具体数据，要等到2027 年预算数出来之后才能看到，到每年春节以后紧锣密鼓地一家一家确认，那时候 才会比较了解到各家的亮点和想法。整体从经营层来看，昨天开董事会审议三季 报的时候，总经理还是有信心的，公司3+1的核心板块业务与国家的战略高度契 合，与国家的重点发展密切相关，对发展是有信心的。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-31T14-57:43d0841fdfaf": {"id": "post:2026-10-31T14-57:43d0841fdfaf", "kind": "post", "title": "2026-10-31 14:57", "source_label": "帖子正文", "excerpt": "美股市场动态：行情正在变动…… 💡 本周开局行情偏强，半导体板块出现需求回暖的积极信号（主要来自长线资金），但本周收尾阶段遭遇猛烈抛售，下跌过程中几乎没有买盘承接。💡 全周来看，资产管理人最终转为净卖出（逆转本周早些时候对科技板块的买入需求），对冲基金资金流整体多空平衡。", "content": "美股市场动态：行情正在变动…… 💡 本周开局行情偏强，半导体板块出现需求回暖的积极信号（主要来自长线资金），但本周收尾阶段遭遇猛烈抛售，下跌过程中几乎没有买盘承接。 💡 全周来看，资产管理人最终转为净卖出（逆转本周早些时候对科技板块的买入需求），对冲基金资金流整体多空平衡。 💡 不出意料，抛压集中在科技板块核心标的，不过对比过去两周，本次下跌的节奏相对有序。 💡 本轮行情波动带有系统性、自上而下驱动的特征，ETF 成交量占全市场成交比重达到约 31%，为 6 月以来最高的完整交易日水平。 💡 月末资金效应也在影响市场走势。 💡 周四至周五，消费板块相对大盘跑赢，资金出现轮动（资金从科技板块转向防御性必需消费，避险交易），叠加部分标的业绩表现较好，餐饮标的：CMG、WING、EAT，邮轮标的：NCLH、RCL，以及低配板块的回补（CROX、BOOT）。 💡 我们重点跟踪的标普关键点位：100 日均线 7614 点，以及 CTA 中期阈值 7554 点（大部分净空头头寸集中于此）。 📌📌主经纪商周度数据（截至 10 月 29 日收盘）：风险敞口｜美国市场 💡 基本面多空策略总杠杆小幅上升 0.1 个百分点，至 216.3%（处于近一年 66 分位）；美国基本面多空策略净杠杆上行 3.6 个百分点，至 47%（处于近一年 7 分位）。 💡 对冲基金四周内首次净买入美股，主要来自宏观品种的空头回补，其次是个股层面的回补。 💡 尽管科技板块是本周（截至周四）净买入最多的板块，但 10 月截至目前整体仍为大幅净卖出；大型科技股在最近 5 个交易日中有 4 个交易日录得净卖出，说明在业绩密集披露、行情剧烈波动的一周内，风险偏好并未明显修复。 📌📌盘中表现更新（美国东部时间下午 1 点） 💡 全球基本面多空策略产品下跌 1.2%（偏离均值 1.8 倍标准差），主要受贝塔行情与科技板块拖累；科技板块本月截至目前下跌 3.6%，年内收益仍为 + 9%。 💡 聚焦亚洲的基金下跌 1.2%（偏离均值 1 倍标准差），本月截至目前下跌 9.5%，年内收益仍为 + 14%。 💡 TMT 主题基金下跌 3.8%（偏离均值 2.6 倍标准差），本月截至目前下跌 12.6%，年内收益收窄至 + 5.1%。 📌📌下周看点 💡 市场对标普指数在下周五（11 月 6 日）前的隐含波动幅度预期为 1.84%。 💡 这是三季度业绩披露的最后重要一周，苹果将于周一披露业绩，是科技板块的重点标的；市场焦点将转向美国中期选举（周二，Kalshi 定价民主党横扫概率 65%）以及非农就业数据（周五）。 💡 关注季度再融资公告（周三将公布期限细节），观察发行规模与供给安排是否出现变动（市场重点关注长端，尤其 20 年期、30 年期美债供给变化）。#文字观点​", "publish_time": "2026-10-31 14:57", "tags": ["文字观点​"]}, "post:2026-10-31T09-18:f55b5675fda3": {"id": "post:2026-10-31T09-18:f55b5675fda3", "kind": "post", "title": "2026-10-31 09:18", "source_label": "帖子正文", "excerpt": "【周六你需要知道的隔夜全球要闻：苹果再次反超英伟达登顶全球公司市值榜；特朗普拟于中期选举次日恢复对伊朗打击】 全球要闻 1、特朗普据悉计划在中期选举次日恢复对伊朗的打击。", "content": "【周六你需要知道的隔夜全球要闻：苹果再次反超英伟达登顶全球公司市值榜；特朗普拟于中期选举次日恢复对伊朗打击】 全球要闻 计维持将近50左右的稳定水平，三季度已维持在 此水平附近。 2027年业绩指引：业绩增速目标做到30%左右，管理层认为这一水平属于不 错的情况。 2027年毛利率展望：毛利率仍有提升空间，驱动因素包括：渠道调整持续推 进仍有空间；海外收入占比有望在四季度乃至明年继续提升，且海外毛利率 比国内高不少。 净利率弹性：毛利率提升叠加期间费用率随收入提速进一步优化，净利率提 升将比毛利率更为明显。 3.Q3收入表观增速放缓归因与后续边际修复 三重短期扰动因素： o高基数效应：2025年三季度是去年全年收入最高的单季，形成了相对高 基数，导致表观增速数字较上半年有下滑。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 o汇率拖累加深：三季度面临较大的海外汇率挑战，且汇率对收入的影响 较一二季度更深，持续处于不利于公司放量发展的方向。 o收入跨期因素：三季度收入存在一定跨期因素影响。 渠道调整不等于减速：销售渠道调整仍在推进中，但不意味着会对收入端产 生大幅影响。 边际修复信号：三季度收入已在逐步改善、有提速迹象，若汇率能保持稳定， 表观收入增速有望提升，四季度预计恢复。 费用端管控：内部管理优化持续推进，管理费用率及其他三费控制良好；若 收入端提速超过三季度乃至上半年水平，费用率改善仍有空间。 4.盈利质量拆解：毛利率稳定性与结构优化 分季毛利率对比：三季度毛利率不如二季度亮眼，主因二季度包含美国海 关退税一次性因素；扣除该扰动后，一季度与三季度单季毛利率处于相对 稳定、同一水平。 结构性优化成效：2026年产品结构优化较为成功，直接体现在毛利水平上， 也变相反映客户需求仍较好。 海外业务贡献：海外增速与国内整体差不太多甚至略快，三季度出现一定新 的变化；海外毛利率比国内高不少，海外占比提升是毛利率提升的核心驱动 之一。 现金流质量：经营现金流大幅改善，公司将持续夯实盈利与现金流质量。 5.需求端：客户结构、AIDD增量与加息扰动 客户结构排序：全体客户仍处增长态势但增速有高有低；研发外包客户（CRO） 需求最大，占比处于第一梯队；其后依次为终端药企、科研院所。 海外需求：国内外客户需求相对稳定，景气度有抬升；海外增速与国内整体 相仿甚至略快，三季度有一定新变化。 AIDD对分子砌块的拉动： o增量“比较明显”，但并非直接拉动——美国多数大模型公司不直接下 场自建实验环节，仅个别公司搭建实验闭环，因此大量实验外包需求在 AIDD场景下持续存在。 o海量研发外包客户需求非常大，这一增量不仅限于今年，未来整体增量 可观、值得期待。 美联储加息与biotech需求反馈： o加息对早期管线需求暂时没有特别大的冲击，整体需求仍较旺盛。 o若真正进入实质性加息阶段或加息周期，可能会对biotech需求产生一 定影响，且FDA已有调整，相关影响或在未来较长时间后才能反映出来。 6.竞争格局与护城河构建 核心竞争特性：公司竞争力在于“多快好省”的经营特性，将持续深化全球 化与数字化双轮驱动，提升护城河。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 海外能力建设：深化海外本地化交付与客户服务，持续提升海外收入占比； 以数字化系统和AI逆合成分析提升产品匹配度，加大采购与供应链协同效 应。 前沿品种卡位：主动布局ProTAC、GLP-1、XDC、含氟砌块等前沿方向，持 续拓展复杂结构与高壁垒产品；卡位前沿热门靶点及特色砌块。 AIforScience机遇：加大客户服务与供应链质量投入，力争在AI浪潮中 提升市占率与产品层面表现。 新分子业务量价规律： o全新分子（过往从未销售）占比并不大，核心优势品种为此前已有销售 记录或已形成货架产品的分子/砌块。 o新品上市初期价格较坚挺，随放量增加及“新意”退去，价格会逐步调 整——这是原料及分子砌块领域的基本特征。 7.库存与SKU运营策略：周转效率优先 存货水平：三季度末存货9.23亿元，虽较年初有所下降，但相对收入规模 仍处于较高水平；活跃SKU占比暂无详细数据。 品类广度：现有14万个产品、一百多万个SKU，广度空间与边际回报已有 限。 运营策略转向：过去两年公司更看重周转效率，报表端体现为备货和库存未 有大规模提升，反而有所控制；随收入端相对增长，库存呈下降趋势。 8.外延并购与产业链拓展方向 方向一：产品线叠  t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：四部委在双十一预售当天发布调查公告后，该客户在预售阶段销售回暖较为 明显，但公司上游端订单虽然已有所恢复，仍远不及舆情之前，目前处于逐步增 加的过程。此前受618舆情影响，该客户有较多退货，公司也为其准备了部分 618库存，客户自身仓库中仍有一定库存，因此公司陆续录单，订单正在逐步增 加。 2.对于上述核心客户，正常化销售大约可能在什么时间节点出现，公司是否有 预判过？ 答：需要观察该客户双11的实际发货情况。目前已是10月，预计接下来一周左 右会较为明朗。 3.公司三季度订单受到部分影响，目前其他主要大客户以及新增ODM客户的销 售情况如何，大概占公司什么份额？ 答：主要份额尚未进行拆分。近期公司已与东方甄选、与辉同行等优质新型客户 陆续开展合作，其中东方甄选销售势头较猛，与辉同行情况也较好；公司目前正 抓紧赶制新客户及老客户重要订单，进行备货生产。 4.公司与与辉同行、东方甄选、盒马的合作目前处于什么阶段，是否已形成稳 定的月度订单？ 答：与辉同行和东方甄选均为刚合作的客户，刚刚在10月开始上市销售，首批 订单均已售罄，销售表现较好。这些大流量品牌方能够自带较大流量，从目前其 追加订单的情况看，公司认为情况较好。 5.公司与宝洁等国际大客户在非婴儿品类以及海外新区域的合作是否有实质 性进展？ 答：公司与宝洁一直保持合作，合作范围不仅包括婴儿产品，也包括女性经期裤， 并且一直持续；此外，公司还与宝洁有成人产品方面的合作，只是婴儿卫生用品 体量占比最大。海外业务也在推进中，并陆续有新的客户增加。 6.非婴儿品类以及海外新区域合作在2027年是否有可能出现放量？ 答：女性经期裤产品由豪悦首创并开始生产，在中国市场的市占率逐年增长，公 司已将该产品逐步推向海外，不仅公司在推，合作的保洁大客户也在推。后续从 量上看预计会有增长，但从占比看，婴儿卫生用品仍将是绝对主导，因为基数较 大。从宝洁三季报数据看，卫生用品业务增量中婴儿品类仍然非常明显，绝对值 上婴儿卫生用品占比最大。 7.公司三季度毛利率同比下降三个多百分点，原材料上涨、产品结构变化和ODM 让利等因素中，哪一项对毛利率影响最大，能否进行拆分？ 答：影响最大的因素是原材料涨价。公司原计划在618期间与客户基本谈妥进行 价格上调，但后来受到舆情影响，一位重要客户受到直接冲击，公司为保障当时 市场条件下另一位客户的相关安排，未进行调价动作。其次还包括员工五险一金 基数调整、部分费用投入以及新项目筹建带来的较大费用支出；销售费用与上年 相比已有所管控和下降。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 8.从10月、四季度以及明年一季度二季度来看，原材料成本压力是否能够趋 于稳定？ 答：较难判断，主要需观察国际形势。如果国际形势向好，价格回落会较快；但 上周原油价格已经到了历史最高峰，因此目前较难判断。 9.公司在原材料采购方面是否进行锁价？ 答：当前较难进行锁价，很多原材料需要通过抢购才能拿到货；原来部分材料有 账期，现在则需要直接先做预付。 10.目前行业整体是否都处于原材料供应偏紧的状态？ 答：是的，而且不仅仅是中国。部分海外国家也从中国进行采购，因此进一步加 剧了原材料价格的上涨。 11.如果原材料成本压力持续处于高位，公司是否有可能向大客户传导价格压 力？若调价具备可能性，主要取决于什么条件？ 答：主要仍看市场情况。公司已关注到市场上个别品牌在做终端价格调整，公司 作为制造端会稍缓一步，再向品牌方进行传导。需要市场上有几家品牌开始做调 价准备，才有可能实现传导。 12.如果2027年原材料继续维持高位，且调价可能延后，公司在利润端有哪些 对冲措施？ 答：公司建议可以关注同行上市公司三季报的盈利情况作为参照。公司本身已经 在进行对冲，自去年开始加大无纺布产线产能建设，今年较多无纺布已实现自产， 对冲了部分原材料上涨带来的影响；同时公司持续自建原材料产能，并加大自供 原材料的量。此外，公司也在为合作客户推出新产品，例如为东方甄选做新品， 通过提高新产品附加值和毛利率进行一定对冲。 13.公司自产无纺布和复合芯体能够在多大程度上缓冲原材料涨价，是否能提 供量化数据？ 答：在国内规模较大的几家同行中，只有豪悦使用100%自产的复合芯体材料， 无纺布也正在逐步增量。与同行相比，公司在这一块的优势仍然非常明显。 14.洁婷品牌此前预期四季度出现经营转折点，从当前表现看，费用和亏损是 否有所收窄？ 答：费用方面已经看到收窄，公司对费用进行了控制。业务和渠道整合仍在消化 中，前期公司控制线下经销商发货量，以帮助消化线下仓库库存。从10月双十 一预售情况看，可以观察洁婷和与辉同行联名款的销售情况；线上渠道预计四季 度销售与上年基本持平，费用已经下降。今年线下业务因整合大型连锁商超等渠 道有所调整，后续线下主要以O2O渠道作为重点增量渠道。 15.洁婷在2027年能否实现扭亏？若实现扭亏，关键条件是什么，时间周期上 是否有预判？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：管理层澄清，此前所述主要为线上业务，洁婷线上业务费用控制已基本可见， 通过与达人做联名款，销售端也出现一定转变。但线下因为今年持续整合，即使 调整基本到位，发力仍需要一定周期。既然线上已看到转折点，线上销售尤其是 抖音不仅是销售渠道，也是推广渠道，公司当前策略是以线上带动线下，将抖音 作为核心增量渠道。 16.从盈亏平衡点角度看，产品结构升级带来的效率提升与营销投放效率提升 相比，哪一项对洁婷盈利帮助更大？ 答：当前社交类、社媒类渠道的投放效果较为直观，大投入能够看到销售数据上 的明显变化。去年公司请了大量大达播进行带货，虽然看到销量，但背后销售费 用投放非常高。因此今年公司基本不做大达播，更多将费用投入到其他引流和推 广中。 17.线上渠道中，抖音和天猫的渠道效率及获客效率如何？ 答：如果看短期增量，抖音平台应该是增量最直接、最明显的渠道。 18.公司与与辉同行等渠道的专门产品合作，主要是基于包装上的区别，还是 在产品结构方面存在差异化？ 答：产品结构基本差不多，差异主要可能体现在原材料遴选上，相关原材料方案 基本会通过与辉同行品牌方的认证，因为品牌方对质量和生产前端有一定管控要 求。 19.坦桑尼亚工厂年底投产计划目前处于什么进度？ 答：目前仍在进行厂房内部装修，设备陆续到位，设备已在路上，预计11月上 旬到达。主设备到位后将进行安装和调试，车间装修同步推进。由于当地基建速 度与国内存在一定差距，公司争取年底前实现试生产。 20.如果坦桑尼亚工厂年底投产，从2027年角度看产能爬坡及盈亏平衡预期如 何？ 答：目前项目仍处于筹建建设当中，预计仍以投入为主。 21.泰国市场转向北部城市后，渠道效率和终端动销是否有改善？ 答：泰国市场受到当地品牌的正面竞争，同时较多中国国内品牌也陆续进入东南 亚市场，竞争较为激烈。公司调整了销售策略，从原来以曼谷为中心向外发展， 转变为聚焦泰国北部和南部两个市场。北部人口最为集中，当地品牌对北部等市 场的重视度弱于曼谷核心城市。公司今年从北部和南部两个大市场筹建线下销售 团队，加大线下地推推广投入，目前正按计划推进。 22.坦桑尼亚本地化生产相较国内出口，最主要的成本和关税优势是什么？ 答：坦桑尼亚当地原材料进口没有关税，但成品进口关税约为20%至25%。同时， 从中国发货到坦桑尼亚的海运物流时间基本需要40至45天左右，海运成本也非 常高昂。如果在当地建设工厂，相关费用相比中国进口会有明显优势。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 23.海外市场的投入是否可能抵消国内业务的利润修复？ 答：公司出海主要看中海外更广阔的市场，以及海外市场优质产品普及度不及国 内，没有像中国一样多的好产品。以泰国为例，当地销售仍以木浆结构产品为主； 坦桑尼亚的婴儿新生儿出生率远高于国内且仍在增长。在国内出生率逐年下降的 环境下，公司需要进入出生率更高的区域和市场，才能获得更好的发展。 24.泰国芭提雅baby何时能够覆盖新增线下团队的费用？ 答：泰国市场去年是盈利的，但今年因策略改变产生影响，此前盈利主要依靠线 上销售。今年泰国线上TikTok费用较高，叠加竞争加剧，费用投放比上年更多， 费比更高。因此不仅是线下销售团队增加费用，线上推广费用也在增加，且增加 比例较多。 25.洁婷线下O2O业务在扣除平台、履约及推广费用后，公司是否测算过能否 盈利？ 答：目前讨论盈利还较早，能否盈利与销售规模直接相关。当前线下大型商超渠 道只有流量没有销量，投入费用不低，不如新兴渠道更能迎合年轻人群的消费观 念。而且此前线下商超渠道按照SKU收取费用，并不是只有O2O渠道有费用。 26.剔除丝宝后，公司成人失禁护理业务目前增长和盈利情况如何？ 答：成人失禁业务主要以线上销售渠道为主，公司投入较少，未将其作为重点投 入方向，因此该业务目前相对可控。 27.洁婷线上渠道营销团队的规模情况如何，主要从哪些方面吸引人才？ 答：洁婷主要销售团队以武汉为主，是原有组建的团队；与豪悦合并后，去年在 杭州设立了一部分运营职能，主要为了更便捷地与大型平台沟通交流，因此在杭 州也设有办公室。团队主要由这两部分人员构成。 28.公司前三季度经营现金流改善明显，主要原因是销售回款好转还是阶段性 营运资金变化？ 答：一方面与理财到期有关；另一方面当期销售回款有所增加，包括618之前的 部分回款陆续增加，因此数据上体现为回款增加。 29.往后看，海外资本开支、丝宝库存以及ODM回款方面，哪一块更值得关注 或对公司更有利？ 答：ODM回款均按照合同正常执行。备货期库存金额会相对较大。从财务经营数 据指标看，公司一直较为稳健，不会出现明显的大幅波动，也没有其他突发状况。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-31T09-10:527e9cea7230": {"id": "post:2026-10-31T09-10:527e9cea7230", "kind": "post", "title": "2026-10-31 09:10", "source_label": "帖子正文", "excerpt": "【东吴电子陈海进】杰华特：Q3营收高增，Drmos出货+涨价核心改善毛利 事件： 公司Q3营收12.3亿，同比+62%，环比28%。归母净利润-1.6，环比+35%。", "content": "【东吴电子陈海进】杰华特：Q3营收高增，Drmos出货+涨价核心改善毛利 事件： 公司Q3营收12.3亿，同比+62%，环比28%。归母净利润-1.6，环比+35%。毛利率29.5%，环比+6.8pcts，净利率-14.3%，环比+11.8pcts。 观点重申 营收放量，Drmos增长+涨价推动毛利率显著改善 公司Q3营收环比增速超预期，环比+28%。Drmos出货为核心增长动能，公司Drmos已在大算力客户率先放量。在其加单的强力催化下，杰华特多项电源和DrMOS产品将加速放量，公司Q3财报亦从业绩端印证逻辑落地。Q3仅是开端，Q4及27年有望拾阶而上。 同时公司9月发布涨价函，仅影响Q3一个月，Q4涨价有望持续改善公司毛利率。 从逻辑到业绩，公司发展一步一个脚印。近期调整主因市场资金面及宏观叙事扰动，公司基本面持续向好，产业逻辑相继落地，重视杰华特！ 风险提示：行业竞争加剧、宏观经济波动导致需求不及预期 东吴电子：陈海进/谢文嘉#文字观点", "publish_time": "2026-10-31 09:10", "tags": ["文字观点"]}, "post:2026-10-31T12-54:fe1803d67926": {"id": "post:2026-10-31T12-54:fe1803d67926", "kind": "post", "title": "2026-10-31 12:54", "source_label": "帖子正文", "excerpt": "【天风电子】圣邦股份三季报：收入略高于指引、扣非净利率环比提升，强调关注服务器&电源领域未来增量 🌟业绩情况：扣非同比翻3倍，指标指引Q4乐观 1️⃣#业绩数据三季度实现收入17.09亿，同比+74%，环比+14%。归母利润3.19亿，同比+123.75%，环比+7.4%。", "content": "【天风电子】圣邦股份三季报：收入略高于指引、扣非净利率环比提升，强调关注服务器&电源领域未来增量 🌟业绩情况：扣非同比翻3倍，指标指引Q4乐观 1️⃣#业绩数据三季度实现收入17.09亿，同比+74%，环比+14%。归母利润3.19亿，同比+123.75%，环比+7.4%。扣非归母净利润2.97亿，同比+207.5%，环比+16%。毛利率51.77%、环比略降0.22pct（主因成本端价格上涨、部分产品涨价影响尚未得到反映），净利率18.91%，扣非净利率17.38%，环比略增0.28pct，非经环比下滑。前三季度实现收入43亿，同比+53.7%，归母净利润7.39亿，同比+115%。 2️⃣#费用分析1）期间费用5.12亿，环比+8%。主因Q3研发人员招聘增加、汇兑损失提高。 2）1-3逐季度资产减值损失情况-0.66/-  _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 o存货从2025年三季度末的1.1亿元增至2.6亿元，增幅3倍以上，绝大 部分为原材料储备（以存储芯片为主），产成品/在产品占比很低。 o备货逻辑为滚动储备：现货价格冲高时卖出部分、价格回落再补入，整 体存储备货均将用于自有产品。 o生产交付周期短：约1周完成生产发运，客户约1周至半个月领用上线 并结转成本。 o当前备货量：年初备了近1年的量，目前滚动库存约半年至9个月用量； 当前存储价格仍在缓慢上涨，库存状态良性。 2.2026Q4与2027年业绩展望：Q4与Q3相当或更好，2027年收入目标增长 20%-30% Q4展望 o部分客户涨价因素尚未体现，预计Q4陆续体现，带来增量；Q4情况有 望与Q3相当甚至更好。 o季节性维度：商用车Q1、Q4为旺季，Q2、Q3为淡季；重卡在Q4（尤其 年前、12月前冲量）及年后\"开门红\"阶段销量较高。乘用车逐季向上， 两轮车分布相对平稳，三者合计Q4、Q1偏多。 oQ3属传统淡季（车厂高温假停工1-2周、年中需求偏弱），淡季已实现 剔除一次性费用后约2700多万利润，为Q4旺季提供参照。 2027年收入与利润展望 o2027年收入目标：至少20%-30%的增长，按现有项目排产和预算测算， 情况好可能更高。 o增长驱动：①商用车大客户供货份额提升；②新能源车板块新客户放量； ③两轮车客户进入量产期。 o2027年利润预计保持增长：涨价后的价格基数全年延续；成本端看存储 等原材料涨幅预计不会再现此前力度（公司有监控，AI相关负面因素下 存储涨幅趋缓）；费用端定调严控费用（2026年因项目增加和方案调整 研发投入偏多，2027年明确控制）。 o价格与存储的联动机制：公司调价需跟随客户招标节奏（每年1-2次招 标定价）；若2027年下半年存储价格下行，公司仍有约半年左右的受益 窗口期，至年底议价时车厂才会重新考量；且当前转价仅传导50%多一 点，大部分成本仍由公司承担，车厂对此知情，不会立即压价。 3.分车型收入结构：商用车占比近八成，两轮车增速最快，乘用车占比略降 收入结构（剔除纯软件平台业务后） o商用车：2026年前三季度占比接近八成，收入约4.4亿元，为公司最重 要收入来源。 o乘用车：占比约10个百分点，较去年同期略降2个百分点。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 o两轮车：占比接近9个百分点，较去年同期增加近6个百分点，已快速 追平乘用车，收入接近5000多万元。 商用车竞争格局 o天花板看似较低，但竞争格局优于乘用车：行业集中度高，前五大客户 占整个行业的85%左右，供应商端玩家较少，竞争相对友好。 o此前提价动作上，商用车客户接受度和理解度显著高于乘用车市场。 乘用车业务现状与策略 o整体承压：2026年乘用车销量下滑，公司自身项目量产相对偏少。 o东风乘用车收入持续增长，主要配套TBOX及依扣类产品。 o后续重点：聚焦优质客户和有竞争优势的产品，主推热管理控制器、座 椅控制器、TBOX、ECO类产品。 两轮车业务概览 o客户矩阵：春风、钱江、奔达、张雪机车等，张雪机车2026年收入增长 最明显。 o张雪机车：2025年收入约1000多万、不到2000万，2026年接近翻3倍； 其他客户亦接近翻倍增长，部分因车型原因尚未完全进入成规模销售。 o2027年大客户进入转产状态，大野大野摩托等销量排名行业前三的企业 将逐步量产，2027年两轮车增速有望保持较高水平。 o提价逻辑：2026年提价后，2027年行业惯例的年降幅度会变小、部分客 户不降，是相对有利因素。 4.两轮车核心标的张雪机车：近独供+多品类绑定，全年收入预期6000-7000 万，远期产能50万套 合作背景与绑定深度 o张雪在凯越机车时期即与公司合作仪表产品；其独立创业时公司销售团 队认可其技术能力，未收取开发费，复用其他项目底层代码为其开发产 品。 o张雪WSBK夺冠车型的仪表即为公司产品；2026年3月夺冠出圈后合作关 系更紧密。 o供货品类已从仪表扩展至TBOX、控制器、车联网管理平台、手机APP、 数据营销，全套方案均由公司提供。 o仪表在所有车型均为必需品，公司在其仪表供应普遍接近独供状态，主 要车型几乎全部由公司供货；少量小车型存在其他供应商。 o张雪机车已进入公司前五大客户之列。 收入规模与量价拆分 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 o2025年收入1000多万、不到2000万；2026年最新确认收入已接近4000 万，叠加未装车发货及Q4，全年预计6000万-7000万元，接近翻3倍。 o产品单价：夺冠车型仪表约350元；复杂双连屏（支持手机投屏导航等 乘用车功能迁移）单价可达七八百元；TBOX约150元以内；控制器（无 钥匙启动、灯光调节等配置）约一百二三十元。 o单车配套价值量：常规三件套约500多元；高端配置可达上千元，但目 前高配套出货量尚少；主流以五六百元单车价值量为主。 o张雪当前销售主力为燃油机车，公司现有产品可直接供货。 张雪产能扩张与展望 o张雪新厂房已开始投入（预计快投入使用），年产能50万套；若大部分 为燃油摩托，公司可直接供应现有产品；其电摩、踏板产品亦有较大拿 单机会。 o平台数据变现：利用摩托车玩家高频使用APP数据，推进行驶轨迹、周 边营销（头盔、支架等）、积分体系等数据营销应用，与张雪有分成机 制；除张雪外其他车厂也在推进类似数据增值服务。 o策略：以张雪为标杆客户，横向拓展其他客户，当前市场接受度较高。 5.两轮车市场其他客户与产能：大冶摩托2027年起量，摩托车2027年收入目 标1.5-2亿 重点放量客户：大冶摩托 o全国销量排名前三的摩托车品牌，年销量约150万套（2026年前三季度 已实现110万套，数据来源为中国摩托车商会公开数据），2027年预计 起量较快。 o其他合作客户：钱江、春风、奔达、环松；电摩方向覆盖绿源、雅迪、 绿驹等电自品牌的高端电摩产品，以及9号、小牛（已合作），多个项 目2027年逐渐进入量产。 2027年两轮车收入目标 o摩托车板块2027年销售额预测至少1.5亿-2亿元。 产能保障 o自建安吉生产基地，规划产能300万套，产线加密后可扩展至400万套； 目前产能接近200多万、不到250万套，整体仍较充裕，足以覆盖张雪 及现有客户放量。 o若未来进入大长江、隆鑫、宗申等传统大厂（量级可达数百万套），则 需考虑扩建产能。 两轮车出海逻辑 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 o两轮车产品非国标约束、消费属性强，国内外产品差异度小；国内摩托 车产能约6-7成用于出口，国内产品可直接推向海外。 o东南亚市场为重点，已有客户（含中国台湾地区客户）产品已发货并陆 续进入量产；董事长随张雪赴意大利，2026年11月将参加意大利摩托 车展。 o品牌效应：张雪在国际赛事超越雅马哈、杜卡迪，提升中国摩托车海外 认知度，与乘用车品牌出海逻辑类似；春风、钱江亦参赛拉动摩托车赛 事市场。 o出海成果预计：2-3年维度有望看到不小成绩。 6.商用车基本盘：结构变化+一汽解放放量，新能源重卡渗透率接近40%-50% 行业结构性变化 o出口：2026年出口增速保持增长，公司跟随主要主机厂出海，海外布局 持续；国内销量处于稳定状态。 o动力结构：燃油、天然气、新能源结构分化，新能源重卡占比已较高， 公司掌握的最新数据接近40%-50%。 o新客户覆盖：林一、西景等新能源重卡客户已纳入覆盖。 o新势力与新兴品牌持续涌现：除9号、小牛、春风等传统新势力外，虬 龙机车、张雪、花样赛车等新品牌不断冒出并带来智能化需求，公司持 续覆盖新老客户。 一汽解放放量逻辑 o一汽解放为行业排名第二的重卡销量企业，公司2025年进入其供应链体 系；2026年仅有极小销售额，部分产品试装或小批量拓展。 o2027年部分产品开始形成一定规模；参照中国重汽经验：约2020年左 右进入体系，2023或2024年即成为第二大客户，单个客户约2-3年即 可快速成长，公司对解放份额提升有明确期待。 7.乘用车与eCall产业：政策节点2027年7月1日未变，当前仍处相对早期， 轻型商用车目标份额过半 eCall（依扣）业务现状 o东风乘用车eCall在推进，海外eCall项目2025年已开始做，国内东风 车型也有覆盖，但当前量还不大；车厂或因2026年经营压力较大而放量 偏慢。 o政策节点未变：2027年7月1日实施，覆盖车型与原先一致：乘用车+N1 轻型商用车。 o轻型商用车份额目标：至少一半以上；乘用车端首要稳住在东风的供货 比例，同步推进广汽、长安等客户。 o历史参照：2022年商用车销量极差，行驶记录仪新国标曾拖后一年执行； 当前eCall落地节奏尚不在公司可控范围，需观察2027年车企行 标为至少20%至30%的增长；利润端也保持增长，价 格已按今年水平核算，公司会监控原材料端变化并严格控制费用，利润端预计保 持较理想状态。 2.如果明年下半年存储等原材料价格出现松动或下行，公司给下游客户的产品 价格是否会随行就市进行及时调整？ 答：公司向客户传导涨价经历了较长时间沟通，客户方通常通过招标流程确定价 格，涨价和降价均需一定周期，不会随存储价格即时调整。若明年下半年存储价 格开始下降，公司可能仍有约半年左右的受益时间，到年底谈次年价格时车厂才 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 会将降价因素纳入考量。此外，公司目前转价幅度仅约百分之五十多，大部分成 本上涨仍由公司自身承担，车厂对此情况较为了解，不会因存储跌价立即要求产 品降价，而是会给公司一定的时间窗口。 3.公司三季度因股权激励行权额外增加了500多万元费用，该费用是否为一次 性？另外三季度传统上为淡季，单季利润加回该费用后约为2700万元，四季度 作为旺季利润是否会更高？ 答：该费用为终止2024年股权激励产生的一次性加速行权股份支付费用，约560 多万元，已在非经常性损益中披露；若剔除该费用，三季度利润约2700多万元。 商用车行业二、三季度为传统淡季，三季度车厂普遍会放高温假、停工一至两周， 年中车辆需求也相对较少，因此三季度为淡季，四季度及一季度为旺季。 4.公司存货从去年三季度末的1.1亿元增加至2.6亿元，当前存货主要包含哪 些物料或在售产品？ 答：存货主要为原材料储备，尤其是存储芯片备货较多。公司根据现货市场价格 波动进行滚动操作，对价格冲高的物料做部分处理，时间较久的会先卖出再以略 低价格购回，但整体存储芯片均为未来产品所需。2.6亿元存货中大部分是原材 料，产成品及在产品相对较少。公司生产周期约一周，发至客户后客户约一周到 半个月领用上线并结算成本，因此存货以原材料为主，目前结构较为良性。 5.若后续不再新增购买存储等原材料，现有存货大致多长时间能够消耗完？ 答：年初公司备货量接近一年，目前滚动储备下大约还有半年到九个月的量。 6.公司与张雪机车的合作具体涉及哪些方面？目前合作规模如何？未来还有 哪些可以进一步拓展的方向？ 答：张雪机车创始人张雪原在凯越机车时公司即开始合作供应仪表产品，张雪独 立创业后公司销售团队高度认可其技术能力，从一开始便跟随配套，开发过程中 未收取开发费，直接投入开发了摩托车仪表产品。张雪在WSBK夺冠车型的仪表 即为公司产品。目前公司向张雪供应的产品已不限于仪表，还包括TBOX、控制 器、车联网管理平台、手机APP及数据营销等，绑定较深；仪表产品在张雪主要 车型中接近独供。销售额方面，去年约一千多万元，今年截至最新确认收入已接 近4000万元，叠加已发货未装车部分及四季度时间，全年预计可达6000万至 7000万元，同比增长接近三倍。张雪近期新厂房投产后年产能将扩张至50万套， 以燃油摩托车为主，公司可直接供应现有产品；其电摩及踏板产品也有较大机会 获取。此外，张雪目前为公司前五大客户之一，增速较快、绑定较深。在数据应 用方面，摩托车用户会频繁使用手机APP查看行驶轨迹等，公司平台部门可在 APP上开展头盔、支架等骑行装备的数据营销及积分运营，张雪是比较典型的可 落地数据应用并产生收益的场景，后续公司参与数据营销分成亦可带来一定收入。 公司也希望通过张雪这一标杆客户横向拓展其他客户。 7.张雪机车单台燃油车对公司贡献的收入大致处于什么区间？ 答：从单品单价看，夺冠车型仪表单价约350元，部分双连屏产品可实现手机投 屏导航等功能，单价可达七八百元，目前主流放量的仍为单价约350元的仪表； wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 TBOX单价约150元以内；控制器根据不同配置单价约120至130元。三类产品 合计单车配套价值通常在500多元，高端配置可达千元以上，但高端产品目前出 货较少，主流单车价值量约五六百元。 8.除公司外张雪机车是否还有其他供应商？公司在张雪机车的份额大概能占 到多少？ 答：公司供应张雪的产品目前几乎全部由公司供应，其他供应商涉及的量很小， 仅个别小型车型有少量供应，目前基本处于接近独供的状态。 9.两轮车市场中，除张雪机车外，目前还有哪些合作伙伴增长较快？ 答：从量产角度，大冶摩托明年有望大规模放量，其年销量约150万套、位居全 国前三，今年前三季度已做110万套，明年预计起量较快。其他还有钱江、春风、 奔达、环松等客户；电自品牌中的电摩产品如绿源、雅迪、绿驹、九号、小牛等 也有合作，部分项目明年逐渐进入量产。公司预测明年摩托车板块收入至少可做 到1.5亿至2亿元。 10.eCall产业目前的进展如何？从商用车与乘用车两块业务看，2027年的大 致节奏会是什么样？ 答：乘用车方面，东风汽车确实已有合作，海外项目去年已开始做，国内车型也 在推进，但整体放量尚不明显。此前行驶记录仪新国标也因2022年商用车销量 差而推迟一年执行，目前eCall相关法规仍为2027年7月1日实施，尚未修改。 若明年各车企开始行动起来，公司希望轻型商用车份额争取拿到一半以上；乘用 车方面希望至少稳住东风汽车的供货比例并争取更多份额，同步推进广汽、长安 等客户，但具体落地进度仍取决于行业整体推进情况，公司难以完全掌控。 11.当前IPO节奏收紧，公司在收并购方面是否有相关思路或规划？ 答：公司一直有在开展收并购相关工作。实控人经营风格较为稳健，此前两年因 行业及整体环境不佳公司处于亏损状态，25年经营回正，26年上半年又受存储 涨价影响小幅亏损，期间动作相对收敛。目前三季度经营已转正，经营业绩基本 面好转，实控人可能会加快步伐，公司已在收并购和投资方向开展前期动作，未 来可能会有相关项目落地。方向上首先围绕现有主业进行拓展，同时关注新兴行 业机会。 12.张雪机车明年有较大幅度的产能扩张计划，公司的产能与供给预期如何？ 目前产能规划能否满足张雪及其他客户未来的增长需求？ 答：公司自有生产基地在安吉，规划产能300万套，将产线布设更密后可扩展至 400万套，目前实际产能接近200多万套、不到250万套，供应张雪放量问题不 大。若后续能进入大冶、大长江、隆鑫、宗申等传统摩托车品牌客户，量级可能 从十几二十万套提升至数百万套，届时公司才需要考虑产能扩展。目前产能仍较 为充裕，可以满足需求。 13.伴随张雪机车在国际赛事中声誉提升以及国产两轮车的整体质变，公司在 海外市场拓展方面是否有相关规划？最新的海外业务进展及团队建设情况如 何？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：出海方面公司一直在推进，此前已成立海外子公司，并积极参加海外展会。 张雪去意大利时公司董事长也一同前往，11月份意大利摩托车展公司也会参展。 摩托车量较大的东南亚市场公司已多次参加展会，中国台湾地区已有客户且产品 已发货，部分进入量产阶段。由于摩托车产品消费属性较强，国内外产品差异不 大，国内做好后可同步推向海外，东南亚市场是公司重点方向目前已有进展，整 体预计需要2至3年时间能看到较明显的成绩。 14.除了产品品质与客户服务能力外，基于与张雪机车的合作打造公司品牌形 象，包括参加展会及联合活动等，是否确实对海外拓展有加分作用？ 答：张雪当前知名度较高，国内已家喻户晓，海外通过国际赛事也被广泛认知， 能超越雅马哈、杜卡迪等国际品牌，带动了国际市场对中国摩托车的关注。类似 此前乘用车品牌打出知名度后出海更便利的逻辑，摩托车领域也呈现类似趋势。 除张雪外，春风、钱江等品牌也积极参赛，整体利好国内摩托车出海，行业趋势 良好。 15.公司在轮式机器人和工业AI检测等相关场景的业务最新进展以及今年的展 望情况如何？ 答：两项均为公司探索的新兴业务。工业AI检测方面，公司与杰克合作，为其 产线中缝纫机使用场景提供底层算法，识别工人动作是否规范并形成标杆动作， 杰克负责应用层开发，公司提供基于车载视频识别能力的底层算法板；今年该块 业务营收预计不到1000万元，后续会继续探索类似工业检测场景。轮式机器人 方面，公司主要做高尔夫球包车的自动跟随机器人，替代球童背负球包，有遥控 版和全自动跟随版等产品，目前已对美出口，今年营收约100万元；公司短期以 卖算法给整机企业为主，共同出海，若远期出货量达到5万至10万套级别会考 虑做整机。类似场景还可拓展至婴儿车、露营车、自动跟随行李箱等。该业务放 在叮咚智投子公司，团队小而精，开发节奏快、容错率高，与母公司汽车产品的 开发周期和流程不同，目前已有销售，远期希望成长为重要收入来源。 16.公司在股权激励已经进行处理之后，后续在员工激励方面是否会有新的安 排？ 答：公司披露三季报的同时，披露了2025年股权激励预留授予的公告，现有股 权激励方案以2025年方案为主，考核期覆盖2026、2027、2028三年；2027年 的业绩目标定得较高，利润目标印象中是1.5亿元，能否达成需看后续落地情况。 其他激励方面的安排，公司目前还没有具体规划，将根据明年整体情况再行考虑。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008", "status": "extracted"}, "post:2026-10-31T12-52:56c5bd362390": {"id": "post:2026-10-31T12-52:56c5bd362390", "kind": "post", "title": "2026-10-31 12:52", "source_label": "帖子正文", "excerpt": "阳光电源：Q3阶段承压，但Q4及2027预期积极 事件：阳光电源发布2026年三季报，2026前三季度公司实现收入488.63亿元，同比下降26%；归母净利65.99亿元，同比下降44%", "content": "阳光电源：Q3阶段承压，但Q4及2027预期积极 事件：阳光电源发布2026年三季报，2026前三季度公司实现收入488.63亿元，同比下降26%；归母净利65.99亿元，同比下降44%；其中，2026Q3实现收入179.5亿元，同比下降22%，环比增长17%；归母净利13.41亿元，同比下降68%，环比下降55%。 1、公司三季度业绩阶段性承压，主要是储能成本上行、公允价值变动亏损、期间费用增加等因素影响。拆分来看： 1）逆变器Q3发货38GW，收入66亿元，环比小增；#毛利率超40%，超预期，主要原因是格局稳定、区域结构优化等。 2）Q3储能发货17GWh（前三季度累计41GWh），确收9-10GWh，对应收入77亿元。储能Q3确收节奏滞后，Q4预计集中确收。#储能Q3毛利率21%，环比下降较多，主要是碳酸锂成本提高、出口退税调整、汇率影响。 3）电站前三季度收入27亿元，同比大幅下滑，毛利率不足10%，规模缩减后费用率提升，前三季度亏损7亿元左右，Q4确收规模预计增长，有望扭亏。 2、财务数据上看，公司Q3期间费用率16.7%，同比+3.9pct，环比-0.8pct，各项费用绝对值相对稳定。Q3末公司存货410亿，同比+37%，环比+27%，历史新高；合同负债147亿，同比+47%，环比+26%，亦是历史新高，印证公司经营规模持续扩大，需求趋势向好。公司Q3还发生#公允价值变动-5.5亿（Q2为+5.9亿），主要是股票投资波动较大，资产减值损失2.7亿，信用减值损失1.5亿，进一步拖累业绩。 3、我们认为Q3是公司业绩底部，后续量利趋势将持续改善且存在超预期的可能。Q4是逆变器、储能、电站确收旺季，量增明确，报表端成本压力也有望边际改善；#2027年储能出货有望翻倍增长至120GWh左右，#碳酸锂跌价有望带动公司储能毛利率修复。AIDC方面，公司已成为英伟达生态伙伴，SST通过欧美双认证，27年6月还将发布35kV产品，AIDC储能27-28年订单亦有望逐步放量。 4、我们预计公司2026-2027年实现利润96、150亿，对应PE为14、9倍。继续重点推荐。#文字观点", "publish_time": "2026-10-31 12:52", "tags": ["文字观点"]}, "post:2026-10-31T14-58:58487c2f3f9c": {"id": "post:2026-10-31T14-58:58487c2f3f9c", "kind": "post", "title": "2026-10-31 14:58", "source_label": "帖子正文", "excerpt": "📌📌中国互联网：基本面仍有韧性，市场接近恐慌性抛售阶段 💡 我们认为，近期中国股票市场出现普遍抛售，背后驱动因素包含宏观逆风、资金流动、人工智能商业化变现周期的担忧、财富税相关传闻，以及2026 年第三季度财报可能不及预期，市场情绪正在接近或者已经到达恐慌抛售的水平。💡 和 6 月末那轮市场走弱相比", "content": "📌📌中国互联网：基本面仍有韧性，市场接近恐慌性抛售阶段 💡 我们认为，近期中国股票市场出现普遍抛售，背后驱动因素包含宏观逆风、资金流动、人工智能商业化变现周期的担忧、财富税相关传闻，以及2026 年第三季度财报可能不及预期，市场情绪正在接近或者已经到达恐慌抛售的水平。 💡 和 6 月末那轮市场走弱相比，互联网大型公司大幅上调资本开支计划，引发盈利预测下调，进一步加剧全板块的负面情绪。 💡 即便假设盈利还会进一步下修 10‑30%，当前板块估值水平已经具备吸引力。 💡 头部中国互联网公司核心经营盈利具备韧性，资产负债表状况良好，能够应对短期市场波动，同时在超级智能迭代浪潮中捕捉长期价值。 💡 我们维持看好组合：腾讯、阿里巴巴、美团、拼多多、满帮集团。 📊 市场抛售压力加速 💡 中国互联网板块年内至今下跌 23.0%；对比全球互联网同业表现：日本互联网上涨 16.8%，印度互联网下跌 5.0%，美国互联网下跌 9.6%，韩国互联网下跌 18.6%。 💡 对比大盘指数：韩国综合指数上涨 36.1%，日经 225 上涨 28.4%，标普 500 上涨 12.7%；恒生指数下跌 7.7%，印度 Nifty 指数下跌 12.8%。 💡 10 月 22 日抛售行情进一步加剧，恒生指数下跌 3.0%，恒生科技指数下跌 5.0%；阿里巴巴下跌 6.1%，美团下跌 4.6%，腾讯下跌 2.9%。 💡 本次大幅回撤反映出资金重新配置、市场对短期 AI 商业化乐观情绪消退、盈利存在下调压力、市场对股权融资的担忧多重因素。 📈 估值水平情况 💡 对比 1 年期动态市盈率、过去五年均值、过去五年底部估值，拼多多、美团、满帮集团估值已经贴近历史底部；拼多多动态市盈率 6.1 倍（五年底部 5.9 倍），美团市销率 0.9 倍（五年底部 0.8 倍），满帮集团动态市盈率 10.3 倍（五年底部 9.6 倍）。 💡 剔除净现金之后，百度、拼多多、唯品会、京东的 1 年期动态市盈率分别为 0.3 倍、2.4 倍、3.0 倍、4.2 倍。 ⚠️ 盈利敏感性分析 💡 市场担忧盈利会继续下修，是近期板块估值收缩的核心驱动。 💡 从 6 月末至 10 月末，我们将腾讯、阿里巴巴 2026‑2028 年资本开支预测上调 80‑130%，对应盈利预测下调 2‑14%。 💡 压力测试显示，即便盈利继续下修 10‑30%，板块估值依旧具备很高吸引力，剔除现金之后吸引力更强。 💡 举例来看，如果盈利下修 10%/20%/30%，拼多多对应静态估值为 6.8 倍 / 7.6 倍 / 8.7 倍；剔除现金后仅 2.7 倍 / 3 倍 / 3.5 倍。 💡 在同样 10%/20%/30% 盈利下行假设下，腾讯估值为 13.4 倍 / 15.1 倍 / 17.3 倍，阿里巴巴估值为 14.4 倍 / 16.3 倍 / 18.6 倍；两家公司当前 1 年期动态市盈率分别为 12 倍、13 倍。 💰 净现金与股东回报 💡 大部分中国互联网公司维持雄厚的净现金头寸。 💡 经过近期股价回调，百度、快手、拼多多净现金分别占到当前市值的 98%、90%、60%，表现突出。 💡 虽然资本向 AI 资本开支倾斜，近期股票回购规模有所回落；一旦窗口合适，现金充裕的公司拥有充分空间加大回购力度。 📋 盈利敏感性压力测试（承接 6 月报告同类分析） 💡 在 6 月 25 日低点对比维度上，腾讯当前股价已经低于前期低点；阿里巴巴、美团在 6 月低点附近震荡。 💡 过去三个月资本开支承诺大幅抬升，下调大型互联网公司盈利预测，进一步压制板块估值。 💡 在本轮加剧的抛售之后，即便考虑盈利继续下修 10‑30%，板块估值已经具备吸引力。 💡 依托有韧性的核心经营盈利与健康资产负债表，我们依旧认为头部中国互联网公司能够承受短期市场波动，把握超级智能时代长期机遇。 💡 重申看好标的：腾讯、阿里巴巴、美团、拼多多、满帮集团。#文字观点​", "publish_time": "2026-10-31 14:58", "tags": ["文字观点​"]}, "post:2026-10-31T18-27:38ce9a41cf0e": {"id": "post:2026-10-31T18-27:38ce9a41cf0e", "kind": "post", "title": "2026-10-31 18:27", "source_label": "帖子正文", "excerpt": "浙商机械/电子 【科翔股份】拟投资85亿元扩产陶瓷混压PCB、mSAP基板等产品，陶瓷混压PCB业绩有望释放，持续推荐！1️⃣10月30日，公司公告，拟投资85亿元扩产陶瓷混压PCB、mSAP基板、AIPCB等产品。", "content": "浙商机械/电子 【科翔股份】拟投资85亿元扩产陶瓷混压PCB、mSAP基板等产品，陶瓷混压PCB业绩有望释放，持续推荐！ 1️⃣10月30日，公司公告，拟投资85亿元扩产陶瓷混压PCB、mSAP基板、AIPCB等产品。 1）# 江西科翔AI算力服务器项目： 总投资30亿元，达产后可实现年产高阶HDI及高多层电路板约20万平方米，产品包括#陶瓷混压HDI板、26层及以上高多层板、六阶及以上高阶HDI板等。 2）# 高端AI算力用PCB基板项目： 总投资约20亿元，达产后可新增4.6万平方米mSAP基板，120万平方米AI服务器用PCB基板的年产
