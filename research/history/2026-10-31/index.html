3c/h2>\n\u003cul>\n\u003cli>\u003cstrong>主线：AI算力/大模型与端侧AI。\u003c/strong> 今天强化的逻辑：苹果AI国行落地，千问获得系统级入口，AI耳机、苹果供应链及阿里AI生态受关注；同时大型科技公司已承诺在AI热潮中投入3万亿美元，但OpenAI融资目标下调显示融资环境承压。今天出现的催化/验证：苹果合作明确11月4日开发者Beta、12月iOS 27.3正式发布；Anthropic递交S-1招股书；OpenAI将融资目标下调100亿美元。\u003c/li>\n\u003cli>\u003cstrong>主线：半导体/先进封装。\u003c/strong> 今天强化的逻辑：订单增长与产品结构优化支撑经营表现，先进封装板块前三季度营收均增长；长电科技Q3营收创单季新高，汇成股份Q3扣非同比+76%，盛合晶微覆盖中段硅片加工、晶圆级封装及芯粒多芯片集成封装。今天出现的催化/验证：长鑫科技毛利率90%再新高、合并净利润890亿元符合预期；鑫丰为长鑫提供LPDDR封装，少数具备LPDDR5量产封装能力，26年有望扩至6万片/月。\u003c/li>\n\u003cli>\u003cstrong>主线：PCB/CCL/铜箔。\u003c/strong> 今天强化的逻辑：生益科技Q3业绩符合预告，AI进展+产能释放共驱成长；前三季度营收332.08亿元、同比+61.1%，归母67.27亿元、同比+175.4%，毛利率35.4%、同比+8.6pct；上游电子布等原材料持续紧缺，价格传导顺畅，覆铜板业务有望量价齐升。今天出现的催化/验证：科翔股份公告拟投资85亿元扩产陶瓷混压PCB、mSAP基板、AIPCB等产品，陶瓷混压PCB业绩有望释放。\u003c/li>\n\u003cli>\u003cstrong>主线：光通信/CPO。\u003c/strong> 今天强化的逻辑：联讯仪器Q3营收25.12亿元、同比+711%、环比+141%，归母14.39亿元、同比+3488%、环比+221%，毛利率77.63%；1.6T销量Q3已超800G、全年将超800G，数量口径全球份额超50%；硅光晶圆测试设备累计出货100台、市占率超50%。长飞光纤前三季度营收191.24亿元、同比+86.12%，归母61.28亿元、同比+1205%；高端657光纤出货增加，运营商低价单消化完毕，光通信盈利环比提升。今天出现的催化/验证：联讯仪器、长飞光纤三季报数据落地。\u003c/li>\n\u003cli>\u003cstrong>主线：液冷/电源。\u003c/strong> 今天强化的逻辑：杰华特Q3营收高增，Drmos出货+涨价核心改善毛利，加单催化下多项电源和DrMOS产品将加速放量；圣邦股份Q3收入略高于指引、扣非净利率环比提升，强调服务器与电源领域未来增量，扣非同比翻3倍。今天出现的催化/验证：杰华特Q3营收12.3亿元、同比+62%、环比+28%；圣邦股份Q3收入17.09亿元、同比+74%，归母3.19亿元、同比+123.75%。\u003c/li>\n\u003cli>\u003cstrong>主线：机器人/具身智能。\u003c/strong> 今天强化的逻辑：上纬新材传统新材料主业保持盈利，亏损主要来自启元机器人新业务投入，研发投入同比大增超11倍，all in具身智能；启元Q1、T1定价均19999元起，第5000台个人机器人下线，量产交付能力得到验证，并开放开发套件。今天出现的催化/验证：启元Q1、T1于9月20日正式开售；今日观点将物理AI到机器人延伸视为主题主线、AI视频为副线，并提示人形机器人行业尚处早期、商业化落地不及预期等风险。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>苹果与阿里巴巴合作将千问集成至Apple智能，Siri、写作工具及视觉智能可直接调用千问文本与图像理解、内容生成能力；11月4日起随iOS开发者Beta版开放测试，12月随iOS 27.3正式发布面向中国用户推出。\u003c/li>\n\u003cli>OpenAI将最新一轮融资目标下调100亿美元；Anthropic递交S-1招股书；美股科技与半导体大幅下跌，纳斯达克100跌3.5%、费城半导体指数跌7.2%，英特尔跌28.58%、高通跌11.12%、AMD跌10.88%，存储板块闪迪跌13.47%、SK海力士跌7.95%；标普将Meta展望下调至负面，理由包括资本开支与自由经营现金流面临显著不确定性、AI投资变现能力较同业有限。\u003c/li>\n\u003cli>资金流方面，资产管理人全周最终转为净卖出，逆转本周早些时候对科技板块的买入需求；对冲基金四周内首次净买入美股，主要来自宏观品种空头回补，其次是个股层面回补；美国基本面多空策略净杠杆上行3.6个百分点至47%。\u003c/li>\n\u003cli>三季报密集验证：长鑫科技Q3营收1187.14亿元、同比+613.18%，净利润889.83亿元、同比扭亏；联讯仪器Q3营收同比+711%、归母同比+3488%；长飞光纤前三季度归母同比+1205%；生益科技前三季度归母同比+175.4%；杰华特Q3营收同比+62%；圣邦股份Q3收入同比+74%、扣非同比翻3倍；长电科技Q3营收114.25亿元创单季新高，汇成股份Q3扣非同比+76%。\u003c/li>\n\u003cli>新能源/汽车：天合光能Q3组件出货13GW、单瓦亏损4-5分，储能出货约5GWh预计微利；阳光电源前三季度收入488.63亿元、同比-26%，归母65.99亿元、同比-44%，Q3阶段承压但Q4及2027预期积极；赛力斯Q3营收280.80亿元、同比-41.66%，扣非归母-13.65亿元，赛豆科技出表贡献全部利润，Q3新能源汽车销量7.77万辆、同比-41.3%，自6月起连续四个月单月同比下滑。\u003c/li>\n\u003cli>科翔股份公告拟投资85亿元扩产陶瓷混压PCB、mSAP基板、AIPCB等产品；上纬新材披露启元Q1、T1于9月20日开售，定价19999元起，近期第5000台个人机器人下线；工业富联拟推不超20亿元员工持股计划，参与人数不超1.2万人，设2027-2029年净利润累计不低于2400亿元考核目标。\u003c/li>\n\u003cli>其他经营与市场变化：美联储12月加息25个基点概率72%；中国互联网市场情绪接近或到达恐慌抛售水平；青海启动2027年新能源增量项目机制电价竞价，光伏竞价电量14.08亿千瓦时，报价区间0.15–0.2277元/千瓦时，保障执行周期12年；正泰电器前三季度营收543.7亿元、同比+17.1%，低压盈利能力继续改善，北美AIDC持续突破；盛弘股份拟以3000万-6000万元回购用于员工持股及/或股权激励。\u003c/li>\n\u003cli>海外矿企与商品：淡水河谷3Q26收入环比+1%至105.99亿美元，备考EBITDA环比-14%至35.08亿美元，铁矿石产量环比+4.9%至0.88亿吨；力拓蒙古OT铜矿发生岩崩，地下采矿暂停并启动安全审查，3名员工受伤、无死亡；Eramet 3Q26调整后收入同比+4%、环比-8%至7.46亿欧元，Weda Bay获批修订RKAB后9月逐步复产，3Q26外销量同比-83%至160万湿吨。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>苹果AI：11月4日开发者Beta测试反馈、12月iOS 27.3正式发布及中国用户实际可用范围；AI耳机、苹果供应链、阿里AI生态的后续产品与入口变化。\u003c/li>\n\u003cli>海外AI融资与交易：OpenAI融资能否敲定及融资规模变化；Anthropic上市进展；AI板块抛售是否延续、资金流是否从空头回补转为趋势性买入；Meta AI投资变现能力与资本开支/自由现金流压力。\u003c/li>\n\u003cli>业绩兑现与指引：圣邦股份Q4乐观指引能否兑现；阳光电源Q4及2027预期；道通科技2026-2027年收入目标20%以上、净利增速快于收入，但2026年1-9月收入同比仅12%、缺口在能源业务；长鑫科技高增与毛利率持续性；芯原股份预计2026年下半年经调整EBITDA转正及新签订单保持良好增长。\u003c/li>\n\u003cli>先进封装/存储扩产：长电科技Q3创单季新高后的产能释放；汇成股份Q3扣非高增的持续性；鑫丰LPDDR5封装产能26年扩至6万片/月及并表进展；先进封装玻璃基板、面板级封装中试线及临港78亿元项目推进。\u003c/li>\n\u003cli>光通信/PCB：联讯仪器1.6T全年出货超800G、全球份额及硅光晶圆测试设备出货；长飞光纤高端657光纤出货与光通信盈利环比改善；生益科技电子布等原材料紧缺与价格传导、产能释放；科翔股份85亿元扩产项目落地节奏与陶瓷混压PCB业绩释放。\u003c/li>\n\u003cli>新能源/汽车/机器人：光伏竞价项目投产时间与电价执行、天合光能储能出货及碳酸锂套保影响；赛力斯Q4盈利与销量；启元机器人量产交付、开发套件生态及新业务亏损/研发投入；上纬新材传统主业盈利能否对冲机器人投入。\u003c/li>\n\u003cli>宏观与风险：美联储12月加息概率变化（当前72%）；中国互联网恐慌抛售后的基本面与2026Q3财报验证；币安63亿美元黑客攻击、美国对伊朗相关计划、美对华检测实验室和认证机构限制等事件对风险偏好的影响。\u003c/li>\n\u003c/ul>\n\u003ch2>四、高价值内容摘录\u003c/h2>\n\u003ch3>文字观点\u003c/h3>\n\u003cul>\n\u003cli>09:09｜【天风建材 π点求支持】三棵树26Q3业绩交流纪要-20261030 26Q3业绩： 1）前三季度营收91.61亿元、同比下降2.45%，归母净利润13.74亿元、同比下降49.75%；Q3营收31.2亿元、同比下降12.67%，归母净利润0.73亿元、同比下降76.43%，主要受原材料涨价及渠道备货节奏影响。\u003c/li>\n\u003cli>09:10｜【国泰海通食饮】泸州老窖三季报业绩会精要20261030： 1、分品系增速 26Q3：①国窖 降幅50%+、环比Q2收窄，低度仍然好于高度；②中档 双位数增长，主要得益于特曲60版\u003c/li>\n\u003cli>09:10｜中国中免：海南业绩弹性与机场&amp;线上减亏支撑利润增长超预期 # 业绩概况： 1）26Q1-Q3：营收388.2亿元，同比-2.6%；归母/扣非归母净利润分别为36.7/36.4亿元，同比+20.3%/+20.0%。\u003c/li>\n\u003cli>09:10｜【东吴电子陈海进】杰华特：Q3营收高增，Drmos出货+涨价核心改善毛利 事件： 公司Q3营收12.3亿，同比+62%，环比28%。归母净利润-1.6，环比+35%。\u003c/li>\n\u003cli>09:11｜币安遭遇创纪录的 63 亿美元黑客攻击，据称是朝鲜黑客所为\u003c/li>\n\u003cli>09:12｜敦促美国立即撤销对中国检测实验室和认证机构的新限制，并警告称，如果华盛顿“一意孤行”，中国将采取必要措施捍卫自身利益。\u003c/li>\n\u003cli>09:13｜美国批准向乌克兰提供价值21亿美元的爱国者导弹\u003c/li>\n\u003cli>09:14｜大型科技公司已承诺在人工智能热潮中投入3万亿美元\u003c/li>\n\u003cli>09:15｜苹果超越英伟达，成为全球市值最高的公司\u003c/li>\n\u003cli>09:15｜周五，由于科技股财报令人失望而遭受重创，美国期权市场波动性飙升。\u003c/li>\n\u003cli>09:16｜据知情人士透露， Alphabet Inc. 旗下的谷歌正在与美国国防部洽谈，希望合作开展一项新的数据安全工作，以支持价值 1850 亿美元的“金穹顶”导弹防御计划。\u003c/li>\n\u003cli>09:16｜受人工智能利润担忧引发的持续三周的暴跌在周五达到顶峰，纳斯达克 100 指数下跌 3.5%，创下 6 月初以来的最大跌幅。\u003c/li>\n\u003c/ul>\n\u003ch3>附件正文\u003c/h3>\n\u003cul>\n\u003cli>Bernstein-亚马逊 3Q26：评估标记 Amazon 3Q26 Measure the chalk mark｜30 October 2026 U.S. Internet Amazon.Com Inc Rating Outperform Price Target AMZN 320.00 USD Mark Shmulik +1 917 344 8508 mark.shmulik@bernsteinsg.com Deeksha Pandey +1 917 344 8447 deeksha.pandey@bernsteinsg.com Wenhuan\u003c/li>\n\u003cli>Bernstein-英特尔（INTC）：26 年第三季度回顾 —— 着眼未来之前，先熬过当下 Intel (INTC) Q326 Recap - Before you get to the future you have to live through the present...｜30 October 2026 U.S. Semiconductors Intel Corp Rating Market-Perform Price Target INTC 75.00 USD (110.00 OLD ) Stacy A. Rasgon, Ph.D. +1 213 559 5917 stacy.rasgon@bernsteinsg.com Alrick
