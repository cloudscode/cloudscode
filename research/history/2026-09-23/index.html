子】东山精密重点推荐：物料保证加强，明年确定性更高 物料层面：明年最缺的三大物料包括DSP、mSAP、光芯片，东山都有非常强的保障 客户层面：除了g客户之外全进 订单层面", "content": "", "publish_time": "2026-09-23 13:12", "tags": ["文字观点"]}, "post:2026-09-23T21-25:5292215c51eb": {"id": "post:2026-09-23T21-25:5292215c51eb", "kind": "post", "title": "2026-09-23 21:25", "source_label": "帖子正文", "excerpt": "【国盛有色】光智科技：低成本锁定集团铟磷资源，全产业链一体化布局推进中#公司已经实现6英寸磷化铟衬底向海外龙头供货。", "content": "", "publish_time": "2026-09-23 21:25", "tags": ["文字观点"]}, "post:2026-09-23T07-59:752596bdd4e5": {"id": "post:2026-09-23T07-59:752596bdd4e5", "kind": "post", "title": "2026-09-23 07:59", "source_label": "帖子正文", "excerpt": "结论：摩根大通认为，在 3Q26 业绩期前夕，招商证券（CMS）是少数具备明确公司层面盈利催化剂的中国券商之一，而同期行业整体受交投活跃度（ADT）及两融余额走弱拖累。", "content": "", "publish_time": "2026-09-23 07:59", "tags": ["文字观点"]}}, "source_details": {"post:2026-09-23T08-36:28410c205b1b": {"id": "post:2026-09-23T08-36:28410c205b1b", "kind": "post", "title": "2026-09-23 08:36", "source_label": "帖子正文", "excerpt": "内存，AI 的循环系统：重新评估战略价值 AI 投资范围扩大：从 GPU 延伸至 CPU 与内存 我们认为，英特尔、AMD与 Arm在纽约市场同步上涨，反映市场预期 AI 基础设施投资重心正快速从 GPU 向外拓展，覆盖 CPU 与内存。Meta智能体登顶美国应用商店下载量，进一步印证这一判断，AI", "content": "内存，AI 的循环系统：重新评估战略价值 AI 投资范围扩大：从 GPU 延伸至 CPU 与内存 我们认为，英特尔、AMD与 Arm在纽约市场同步上涨，反映市场预期 AI 基础设施投资重心正快速从 GPU 向外拓展，覆盖 CPU 与内存。Meta智能体登顶美国应用商店下载量，进一步印证这一判断，AI 服务开始同时展现真实用户流量增长与商业化潜力。我们认为股价上涨表明市场正在重新评估一条潜在的正向循环：AI 投资→服务落地→流量增长→商业化变现。尤其 AI 智能体的普及，将从结构上提升 AI 数据中心对内存的需求，覆盖 CPU、GPU、HBM、DDR5 以及 eSSD。相比传统生成式 AI，AI 智能体需要更频繁、持续的推理负载。随着 AI 服务商业化落地的可能性提升，AI 基础设施投资有望维持更长时间，内存需求的可见度也将随之拉长。 AMD 市值突破 1 万亿美元：信号指向 AI 的下一个瓶颈转向内存 AMD 成为继英伟达、博通和美光之后，第四家市值突破 1 万亿美元的美国半导体公司，这一事件的意义远不止单一公司市值上涨。我们认为这标志着 AI 基础设施投资正在快速向 CPU 与内存延伸。受益于 CPU 与 GPU 业务放量，AMD 二季度数据中心营收同比上涨 107%。当 AI 推理变为持续性任务，CPU 与内存承载服务、处理数据的作用会伴随 GPU 算力同步提升。这对内存行业存在两点影响： 1）服务器 CPU 增长，将直接拉动大容量 DDR5 服务器内存需求； 2）GPU 与 AI 加速器规模扩张，会同步带动 HBM 需求，拓宽内存需求的底层基数。 内存是 AI 的循环系统：战略价值被重新定义为核心资产 智能体 AI 的响应速度约每秒 1000 token，而传统生成式 AI 处理速度约每秒 100 token。AI 系统性能的竞争，已经不再局限于单纯算力比拼，而是转向处理器能够获取的数据总量以及数据供给速度。三星电子正在研发新一代 HBM，这是一种将内存堆叠在 GPU 之上的架构，突破传统 2.5D HBM 结构；样品预计将于 2027 年末开始供货。随着 AI 模型迭代、推理速度提升，AI 系统性能的核心决定因素，正逐步从 GPU 算力转向内存带宽、容量与数据传输速率。如果 GPU 是 AI 数据中心的心脏，CPU 是大脑，那么内存就是输送氧气的循环系统，持续为整套系统供给和传输数据。内存因此成为决定数据中心性能与效率的核心环节。三星电子与 SK 海力士的战略价值将被市场重新评估，两家公司的定位，将从单纯的内存供应商，升级为 AI 基础设施领域的核心资产。#文字观点", "publish_time": "2026-09-23 08:36", "tags": ["文字观点"]}, "post:2026-09-23T07-57:6c315e990994": {"id": "post:2026-09-23T07-57:6c315e990994", "kind": "post", "title": "2026-09-23 07:57", "source_label": "帖子正文", "excerpt": "【中信证券前瞻】Claude Opus 5.5与GPT-6 Sol发布速评 【Claude Opus 5.5】 9月22日，Anthropic发布Claude 5.5系列首款模型Opus 5.5。评分方面，Opus 5.5以58分登顶Artificial Analysis智能指数，高于Fable 5", "content": "【中信证券前瞻】Claude Opus 5.5与GPT-6 Sol发布速评 【Claude Opus 5.5】 9月22日，Anthropic发布Claude 5.5系列首款模型Opus 5.5。评分方面，Opus 5.5以58分登顶Artificial Analysis智能指数，高于Fable 5.1和GPT-6 Astra（均为53分）。能力方面，多数任务已达到Fable 5.1水平，长程任务表现突出，早期测试中不到一天完成68万行代码迁移。 定价方面，API价格降至输入/输出4/20美元/百万token（-20%），缓存读取价格下调60%，叠加token效率提升，典型任务成本较Opus 5下降约40%，API价格较Fable 5.1低约60%。同时，Pro、Max等订阅计划的5小时用量额度也有所上调。 【GPT-6 Sol】 9月22日，OpenAI发布GPT-6 Sol和Luna，二者分别是本月初旗舰模型GPT-6 Astra的中端和轻量版本。评分方面，Sol在Artificial Analysis智能指数中得48分，与GPT-5.6 Sol（47分）基本持平，智能提升有限；DeepSWE v1.1得分68.8%，接近Fable 5，单任务成本低约80%。 能力方面，事实性错误较前代减半，编码、电脑操作和沟通风格向Astra看齐。定价方面，API价格降至2/10美元/百万token，较GPT-5.6 Sol促销价再降50%，且为常规定价；缓存命中率提升，缓存读取享受90%折扣。 【投资观点】 我们认为： 1、迭代节奏上，两家头部厂商同日发布新模型，Anthropic约两个月迭代一代Opus，OpenAI三周内补齐GPT-6系列，发布节奏越来越卷，印证了我们硅谷调研以来模型进展在加速而非放缓的判断； 2、场景拓展上，通用场景下用户对能力提升的敏感度在下降，更应关注能力再上台阶后新场景突破，测试案例中显示金融研究/知识工作/长程多Agent编码工作能力显著提升，建议关注落地情况； 3、定价变化上，Anthropic已下调定价并上调订阅额度，Opus 5.5性能和价格均好于Fable 5.1，可能带动用量由高价模型转向低价模型，闭源模型token价格继续通缩。目前仍属温和降价，可由Infra优化和芯片效率提升对冲，但若后续降价更激烈，可能对毛利率产生负面影响。 欢迎联系中信证券前瞻团队！#文字观点", "publish_time": "2026-09-23 07:57", "tags": ["文字观点"]}, "post:2026-09-23T07-58:95e78bf26ded": {"id": "post:2026-09-23T07-58:95e78bf26ded", "kind": "post", "title": "2026-09-23 07:58", "source_label": "帖子正文", "excerpt": "野村 —— 全球 AI 趋势追踪：AI 网络 —— 跨集群互联（Scale-across）与入站互联（Scale-in）📌随着 AI 模型训练参数规模突破万亿级、推理需求呈指数级增长，单一数据中心或集群在供电、散热及物理空间上的瓶颈日益凸显。NVIDIA 于 2025 年提出 “跨集群互联”（Sca", "content": "野村 —— 全球 AI 趋势追踪：AI 网络 —— 跨集群互联（Scale-across）与入站互联（Scale-in）📌随着 AI 模型训练参数规模突破万亿级、推理需求呈指数级增长，单一数据中心或集群在供电、散热及物理空间上的瓶颈日益凸显。NVIDIA 于 2025 年提出 “跨集群互联”（Scale-across）架构，将地理分散的多个数据中心通过高速光网络互联为统一计算池，以协同执行单一 AI 任务。与此同时，NVIDIA 进一步引入 “入站互联”（Scale-in）概念，作为 AI 网络五大支柱（Scale-in、Context Memory、Scale-up、Scale-out、Scale-across）之一，旨在通过 DPU 与以太网在 AI 工厂南北向边界卸载并加速用户访问、数据处理、存储读写及安全隔离流量。在 Agentic AI 时代，Scale-in 的重要性显著提升。📊Scale-across 网络：技术演进与核心硬件需求 📌传统数据中心互联（DCI）主要用于跨园区 / 城域的数据同步与备份，带宽需求较低（100G-400G），强调可靠性与长距离传输。相比之下，Scale-across 对带宽、时延及丢包率提出严苛要求 ——据 Ciena 测算，连接 100 万 XPU 所需的带宽约为传统 WAN/DCI 网络的 14 倍。该架构依赖广域 / 园区光互联，核心产品包括： 📌・空心光纤：以空气、惰性气体或真空替代石英作为传输介质，折射率低于实心玻璃，可实现超低传输时延（较传统光纤降低 31%），是长距离低时延场景的理想介质。 📌・相干光模块：采用 IQ 调制同时控制光幅度与相位，接收端通过本振激光干涉解调，克服长距离色散与衰减。IM-DD 模块传输距离限于 2km 以内，而相干模块可延伸至 80-120km，更适配 Scale-across。其中，Coherent-lite（简化 DSP 方案）覆盖 2-20km，有望应用于 Scale-out 脊柱层、Scale-across 及 DCI 场景。 📌・多轨线系统（Multi-rail）：支持多光纤对并行，单机架光纤对数量提升 32 倍，大幅提高部署密度，并带动对高速相干光模块及高密度光放大器的需求。 📌・光电路交换机（OCS）：全光交换技术支持长距离灵活组网与高带宽，Google 的 MEMS OCS 目前主导市场，Coherent 与 Lumentum 亦为关键参与者。OCS+Coherent-lite 组合可弥补链路预算损耗，支撑 2.4T/3.2T 模块时代的持续扩展。🔌Scale-in 网络：Agentic AI 时代的关键入口 📌Scale-in 连接 AI 工厂与企业数据至 AI 计算，核心硬件为 NVIDIA BlueField-4（BF-4）DPU。该芯片集成 Grace CPU 与 ConnectX-9，提供硬件级零信任隔离与多租户存储卸载，实现 18 倍 AI 工厂服务带宽与 2 倍存储加速性能，将主机 CPU/GPU 从网络调度、安全审查及虚拟化管理等杂务中解放。NVIDIA 将其定义为 “AI 原生 Scale-in 基础设施引擎”，在 Agentic AI 工作负载中作为继 CPU、GPU 之后的第三大计算支柱，专门接管数据中心网络、存储与安全治理。📈市场规模与价值链分析 📌・TAM 预测：Ciena 预计 Scale-across 市场规模将于 2029E 达到 80-100 亿美元（2026-29E CAGR 约 30%）；AI-WAN（含网络、DCI 及 Scale-across 架构）市场规模将从 70 亿美元增至 140 亿美元。单 GPU 集群部署中，80km 跨度的 TAM 约 5 亿美元（每 GPU 1,000 美元），1,000km 跨度（需内联放大器）TAM 翻倍至 10 亿美元，2,000km 跨度进一步跃升至 20 亿美元。 📌・相干光模块：Acacia（Cisco 子公司）指出 800G ZR/ZR + 将成为主流，1.6T ZR/ZR + 是下一代跨域互联关键。Cignal AI 预计 800G ZR/ZR + 市场规模在 2025-29E 期间 CAGR 达 145%。竞争格局中，Marvell 与 Acacia 领跑 400ZRx，Ciena 与 Nokia 即将开始 800ZRx 出货。 📌・空心光纤：CRU 预计 2025E AI 工作负载用光缆需求同比增长 77%，2025-29E 五年 CAGR 为 26%。北美 CSP 已率先部署，AWS 将空心光纤接入 10 个核心数据中心，微软计划 2026 年底前在 Azure 全球网络部署 15,000km，谷歌与 Meta 正进行测试。核心供应商包括 YOFC（6869 HK，买入）、Hengtong Optoelectronics、Lightera（Furukawa 子公司）及 Relativity Networks。 📌・OCS 市场：Cignal AI 预测 2025 年市场规模约 4 亿美元（Google 主导），2029E 将超 25 亿美元（CAGR 约 58%）。Coherent 在 OFC 2026 投资者会议上将 2030E 全球 OCS 市场规模指引从 20 亿美元上调至 40 亿美元。🇨🇳中国市场需求与竞争格局 📌中国虽电力供应相对充足，但 LLM 训练与推理需求激增同样导致单数据中心供电与散热面临物理极限，催生 Scale-across 架构需求。中国移动在 MWC 2026 发布原创技术 GSE-DCI，并展示 115.2T Scale-across 路由器（100km 节点训练计算效率超 98%）；中兴通讯发布 800G 智算交换机及 Scale-across 计算互联方案，端到端传输时延优化约 33%，配套网络设备及光模块数量减少约 40%，已完成运营商商用验证。整体而言，中国 Scale-across 业务占比仍较小，大规模应用需求尚未到达拐点。🏭竞争版图与核心标的 📌Scale-across 产业链上游为光电芯片、光组件、新型光纤及光模块；中游为交换路由等网络设备商；下游为 CSP、IDC 及电信运营商。投行重点覆盖及评级如下： 📌・长飞光纤光缆（6869 HK，买入）：目标价 266 港元。受益空心光纤商业化，公司产品衰减系数低至 0.05dB/km，已交付三大电信运营商，并包揽千万级电信空心光纤集采项目。下行风险包括国内电信光纤需求不及预期及海外扩张放缓；上行风险来自高端 AI 产品（如空心光纤）渗透加速。 📌・中际旭创 / Innolight（300308 CH，买入）：目标价 1,375 元人民币。作为高速相干光模块核心供应商，其 Terahop 子公司推出 800G LR2 OSFP Coherent-lite 模块，受益 Scale-across 及 DCI 需求爆发。风险包括高端光模块需求不及预期及价格竞争。 📌・光迅科技 / Accelink（002281 CH，买入）：目标价 217.5 元人民币。采用 Marvell DSP 推出 1.6T 相干精简版光模块，是国内首批 1.6T 相干光模块厂商之一。风险涉及光组件需求疲软及研发进展延迟。 💡投资启示 📌Scale-across 与 Scale-in 正重塑 AI 网络基础设施格局。随着分布式训练成为必然选择，对空心光纤、相干光模块（尤其是 800G/1.6T 及 Coherent-lite）、OCS 及多轨线系统的需求将加速释放。北美 CSP 的率先部署已验证技术路径，而中国市场的潜力尚待兑现。投资者应重点关注产业链各环节的技术迭代节奏、头部供应商的订单能见度及盈利能力，同时警惕资本开支周期波动与竞争加剧风险。#文字观点", "publish_time": "2026-09-23 07:58", "tags": ["文字观点"]}, "attachment:files/美国大模型格局20260921.pdf": {"id": "attachment:files/美国大模型格局20260921.pdf", "kind": "attachment", "title": "美国大模型格局20260921", "source_label": "其他", "excerpt": "美国大模型格局20260921 要点总结 1.Agent基础设施向任务执行与企业治理演进：大模型从单纯问答转向执行任务需具备权限授权、操 作追溯与容错机制，规模扩大后资源消耗与风险显著上升，企业级应用的核心诉求已从交付能力转向内 部治理与责任界定。2.用户入口与任务穿行习惯构筑平台壁垒：OpenAI依托超9亿周活跃用户及数千万付费订阅者构建 庞大消费入口，旨", "content": "美国大模型格局20260921 要点总结 1.Agent基础设施向任务执行与企业治理演进：大模型从单纯问答转向执行任务需具备权限授权、操 作追溯与容错机制，规模扩大后资源消耗与风险显著上升，企业级应用的核心诉求已从交付能力转向内 部治理与责任界定。 2.用户入口与任务穿行习惯构筑平台壁垒：OpenAI依托超9亿周活跃用户及数千万付费订阅者构建 庞大消费入口，旨在让用户将核心任务数据与权限留在同一生态内连续操作，避免跨平台割裂导致的重 要任务流失。 3.专业场景验证付费意愿与续费逻辑：ClaudeCode在代码开发场景中实现年化运行收入超25亿美 元，其核心价值在于代码可运行、可 RAM——DDR4 8Gb 为例，上个月的平均固定成交价较去年同期上涨了 338.6%。 因此，CXMT 正利用由此获得的资金扩大后续投资合同和研发投入。 业内人士指出，内存市场的繁荣不仅为三星电子和 SK 海力士带来了巨额利润，也为中国竞争对手扩大产能和技术能力提供了资金。 根据 CXMT 于 23 日发布的半年报，截至 6 月底，长期资产购置及建设承诺总额达 524.4389 亿元人民币（约合 10.6 万亿韩元），较去年年底的 171.2939 亿元人民币（约合 3.47 万亿韩元）增长 206.2%。 长期资产购置及建设承诺是指已签订合同但尚未计入财务报表的金额，代表未来待执行投资合同的未结余额。 这意味着后续将投入设备购置及建设的投资规模显著扩大。 现有生产线的建设也已进入最后阶段。 截至 6 月底，合肥一期、二期以及北京生产线的完工率均达到 96% 至 98%，三个生产基地的大部分规划建设均已完成。 在扩大产能的同时，CXMT 正向智能手机制造商供应最新的移动 DRAM，并与主要客户洽谈长期供货合同。 这意味着该公司不仅在生产规模上与韩国公司展开竞争，也在争夺客户订单。 ◇提升了将经济繁荣带来的现金再投资于设施和技术的能力。 今年上半年，长江实业用于购置或建设工厂、设施等资产的现金支出为 215.944 亿元人民币（约合 4.38 万亿韩元），较去年同期下降 10.5%。 另一方面，用于设施和建设的预付款较去年年底增长 234.4%，达到 39.9505 亿元人民币（约合 8100 亿韩元）。 这表明，虽然立即执行的投资额有所下降，但用于引进设备或推进建设的预付款却有所增加。 今年上半年，公司实现营业利润 1171.4439 亿元人民币（约合 23.75 万亿韩元），由去年同期亏损转为盈利。 根据公司披露的信息，上半年营业利润率为 77.9%，高于三星电子半导体部门（68.3%）和 SK 海力士（74.4%）同期的水平。 因此，CXMT 今年上半年的经营活动现金流量为 1311.5567 亿元人民币（约合 26.59 万亿韩元），约为去年同期的 31 倍。 这相当于同期用于购置厂房、设备等资产的现金支出的 6.1 倍，表明经营活动产生的现金流量显著超过了实际投资支出。 CXMT 的 “12 英寸存储晶圆制造基地二期项目” 正在中国安徽省合肥市建设中。/ 韩联社 ◇市场份额不断增长，最新产品被广泛采用…… 竞争范围扩大 据市场研究公司 TrendForce 的数据显示，CXMT 的全球 DRAM 营收份额从今年第一季度的 7.6% 上升至第二季度的 9.5%，增幅达 1.9 个百分点。 同期，CXMT 的 DRAM 营收增长率高达 99.3%，远高于 59.5% 的整体市场增长率。 这表明 CXMT 的营收增长速度超过了市场平均水平。 CXMT 还将募集到的资金投入到技术研发中。 今年上半年，研发投入达 68.5948 亿元人民币（约合 1.39 万亿韩元），其中包括计入资产的研发成本，较去年同期增长 87.4%。 此次发行总额（已计入 7 月上市后的超额配售选择权）达 666.0667 亿元人民币（约合 13.5 万亿韩元），CXMT 计划将这笔资金用于改进现有量产生产线、推进 DRAM 技术以及开展下一代研发。 工艺进步带来的成果也开始显现。 20 日，CXMT 在中国制造业世界大会上宣布，其第五代 DRAM 技术平台已开始量产。 据该公司称，在相同 8Gb 容量下，每片晶圆（半导体基板）上的芯片数量比第四代至少提高了 50%。 采用该工艺的两款 24Gb 低功耗 DRAM（LPDDR5X）也已进入量产阶段。 如果良率（合格产品的比例）足够高，则无需增加晶圆投入量即可生产更多内存。 CXMT 于 7 日宣布已量产下一代低功耗 DRAM——LPDDR6，并将其应用于小米折叠屏手机 “18 Fold”。 除 DR5 量产外，该半年报还提及了与阿里云、字节跳动、腾讯、联想等公司的合作关系。 公司也在积极拓展与客户的业务关系。 CXMT 在半年报中指出，公司正在与几家重要客户洽谈长期供货合同，以确保中长期需求。 如果这些谈判最终达成合同，公司未来扩建厂房时，就能提前锁定销量，从而增强财务稳定性。 CXMT 存储半导体的图像。/CXMT ◇韩国公司通用 DRAM 客户和价格谈判中的变量 今年上半年，LPDDR 系列产品占 CXMT 总销售额的 52.0%，DDR 系列产品占 46.2%。 尽管人工智能相关领域的销售占比仍然相对较低，但该公司被认为正在巩固其在通用 DRAM 领域与三星电子和 SK 海力士等巨头竞争的地位。 TrendForce 预测，由于 HBM 产能扩张和 AI 服务器需求增长，DRAM 供应在 2027 年仍将不足；该公司预计，主要厂商新增产能将在 2028 年开始改善供应。 如果这一预测成真，CXMT 将能够以高价获得融资，同时赢得更多时间来扩大产能和客户群。 如果投资承诺能够转化为实际的设施建设，并且新工艺的量产得以稳定，CXMT 向市场供应的 DRAM 数量可能会增加。 这将为智能手机和 PC 制造商提供更大的空间，使其能够实现供应商多元化，并调整对各供应商的订单量。 分析人士指出，一旦供应短缺缓解，这种采购来源多元化可能会削弱韩国公司在通用 DRAM 价格谈判方面的议价能力。 一位半导体行业人士表示：“CXMT 正展现出将当前繁荣时期获得的现金转化为能够在下一个市场周期中保持竞争力的生产基地的迹象。 如果他们能够确保新工艺的良率并最终敲定长期订单，即便未来 DRAM 价格下跌，其业务稳定性也能显著提升。” 该人士补充道，“这将成为韩国公司难以提升通用 DRAM 价格的一个因素。”#文字观点", "publish_time": "2026-09-23 20:24", "tags": ["文字观点"]}, "post:2026-09-23T18-01:4562ed278976": {"id": "post:2026-09-23T18-01:4562ed278976", "kind": "post", "title": "2026-09-23 18:01", "source_label": "帖子正文", "excerpt": "外资点评 行业产业趋势与看好标的提炼（2026年9月23日） 一、AI算力：本轮行情的绝对主线 产业趋势：阿里云2032年20GW算力蓝图（当前仅4-5GW），生态内增量投资约4800亿美元；外部云收入空间1600-2400亿美元，MaaS平台ARR已达200亿元（年底目标300亿）", "content": "外资点评 行业产业趋势与看好标的提炼（2026年9月23日） 一、AI算力：本轮行情的绝对主线 产业趋势：阿里云2032年20GW算力蓝图（当前仅4-5GW），生态内增量投资约4800亿美元；外部云收入空间1600-2400亿美元，MaaS平台ARR已达200亿元（年底目标300亿）；自研芯片占比将从10%提升至40-50%。海外算力链涨超1100%后PEG仅0.33（盈利驱动），国产链PEG 1.08但政策空间大、拥挤度低——中期选举前国产链相对占优，11月初重新评估。 看好标的：阿里巴巴（五家机构目标价177-210美元，FY27E EPS +58%）；国产链映射华虹半导体（335港元，+190%）；中际旭创（1375元）、光迅科技（买入，1.6T相干国内首批）；算力配套的中海油服逻辑的反面——招商证券（CXMT敞口270亿，3Q26盈利或+190%）。 二、光通信与PCB材料：\"AI隐形骨架\"涨价 产业趋势：Scale-across（跨域扩展）成必然，AI-WAN市场CAGR约30%；1.6T DSP受3nm产能限制，2027年供给缺口仍达2000万颗；CCL规格升级是乘法效应（单机架价值量+433%），HVLP4铜箔2027年供应缺口31%；E-glass玻璃布涨价超100%。CPO不导致材料降级，行业强者恒强。 看好标的：长飞光纤（空芯光纤0.05dB/km量产，中标三大运营商，266港元）；建滔积层板（全球最大CCL厂商，摩根大通首覆65港元/大摩75港元，EPS三年8倍）；海外映射Marvell（325美元）、台积电（3400台币）。 三、半导体设备与存储：短缺创纪录 产业趋势：8月中国设备进口+20~25%回暖，光刻+32%、刻蚀+37%、引线键合+233%；长鑫G5量产、WFE 2026年+10%。野村CSI指数103.9历史新高，繁荣27个月破历史纪录；DRAM/NAND出口价+249%/+246%；HBM短缺持续至2028，KV缓存需求达模型权重10倍——存储是\"供给物理极限+需求结构性增长\"的最纯粹涨价品种。 看好标的：韩国双雄SK海力士（275万韩元，HBM最大受益者）、三星电子（40万韩元）；SK Inc（相对价值首选）；Kioxia（13万日元）；美银美林推SanDisk（高带宽闪存HBF受益）；A股设备链受益进口回暖+第四期大基金预期。 四、铜与稀土：供给硬约束的资源涨价 产业趋势：铜TC -222美元/干吨历史负值，2026年精炼赤字42.8万吨，社会库存-80%至9万吨；COMEX升水定价关税风险，支撑持续至中期选举。稀土美国供应链建设需5年以上，西方镝价4-5倍溢价；AI新增需求明确（1GW数据中心需100-200吨磁体）。 看好标的：铜首选纯弹性MMG（11.50港元）、CNM（20.00港元）；多元化选紫金矿业（A股46元/H股50-58港元，巨龙铜矿+47%）、洛阳钼业（H 27.30港元）；回避冶炼敞口（江西铜业仅持有）。稀土选中国龙头（出口许可制度+溢价受益者）。 五、储能：剪刀差收敛的左侧机会 产业趋势：招标+52%（413GWh）vs 安装+2%（77GWh）的巨大剪刀差，源于并网延迟与系统运行费+93%；政策拐点（容量电价+辅助服务+运行费下调）最早2026年底落地，山西案例降0.1元/kWh可提IRR 3个百分点；招标到安装转化6-12个月，4Q26-2027需求加速恢复。板块自6月已大幅回调，市场对2027年或过度悲观。 看好标的：储能价值链龙头（报告未列具体个股，逻辑指向电芯/PCS/集成环节）；比亚迪类电池链受益于碳酸锂13.55万元/吨的成本改善。 六、地产链：只做政策预期，不做基本面 产业趋势：现房销售改革终结预售制，供应紧缩是结构主题——前8月80城新房供应-17%、土地购置-20%，汇丰预测2025-2030年广义库存CAGR降11-13%（快于市场预期）；二手房占比超50%，短期需求外溢、长期回归新房。 看好标的：华润置地（38.30港元，+31.3%）、中国海外发展（16.20港元，+30.5%）、贝壳（23.50美元，+41.8%，二手房活跃度最大受益者）。纪律：10月1日前无补贴公告即减仓，反弹中卖出高杠杆困境开发商。 七、农化：2027年厄尔尼诺的提前布局 产业趋势：NOAA预警2026-27超强厄尔尼诺（RONI或超2.5℃），参照2015-16年糖/橡胶翻倍经验；鱼粉已创2910美元历史高点、2027年回落利好饲料；气温升高加剧病虫害，中国农药占全球产量85%+，出口量与利润率双升。 看好标的：云天化（43.90元，出口套利）、扬农化工（70.30元，出口占比57%）、海大集团（58.40元，鱼粉回落→水产饲料利润修复）——汇丰前海组合，属于\"明年逻辑、当下埋伏\"。 八、其他结构性机会速览 券商分化：广发证券升级增持（23.10港元/27.40元，基金市占+衍生品+98%）、中金H（32.80港元）；东方财富降级减持（14元） 海上油气：中海油服首覆买入（H股11港元/A股18元，+43-44%，完井服务70%毛利被低估，2.4x vs 同业8-10x） 创新药：中国贡献全球创新管线30%，依沃西三个III期OS获益——全球化输出主题 消费精选：老铺黄金（507港元，净利率20%稳固）、理想汽车（67港元，2027年EPS转正的困境反转） 海外巨头：英伟达（365美元）、英特尔（200美元）、Meta（820美元，Muse爆发）、EQIX/DLR（AI扩散驱动数据中心REITs） 免责声明：本文基于用户提供的摩根士丹利、摩根大通、高盛、汇丰、花旗、野村、瑞银、美银美林、Jefferies等卖方研究公开摘要提炼整理，仅供内部学习研究参考，不构成任何证券买卖建议或投资要约。文中所有评级与目标价均源自原研究机构，其准确性与时效性以原始报告为准；部分数据存在机构间口径差异已尽力注明。历史业绩不代表未来表现，证券价格可因宏观、政策、地缘及市场流动性等因素大幅波动，投资者可能面临本金损失。投资者应基于自身风险承受能力、投资目标与期限独立决策，必要时咨询持牌投资顾问。本文生成方不对因使用本文内容而产生的任何直接或间接损失承担责任。#文字观点", "publish_time": "2026-09-23 18:01", "tags": ["文字观点"]}, "post:2026-09-23T20-28:8c8c7dc33a6a": {"id": "post:2026-09-23T20-28:8c8c7dc33a6a", "kind": "post", "title": "2026-09-23 20:28", "source_label": "帖子正文", "excerpt": "20260923今日段子汇总 1、中一科技：1、公司高频高速铜箔已向头部PCB客户批量供货；2、公司已具备固态电池用锂-铜一体化复合负极材料技术 2、电科思仪：公司是国内电子测量仪器龙头，伴随高阶PCB板及高速线缆等检测需求，目前均为是德、罗德等海外供应，#高阶PCB板领域有望用67G＋矢量网络分析", "content": "20260923今日段子汇总 1、中一科技：1、公司高频高速铜箔已向头部PCB客户批量供货；2、公司已具备固态电池用锂-铜一体化复合负极材料技术 2、电科思仪：公司是国内电子测量仪器龙头，伴随高阶PCB板及高速线缆等检测需求，目前均为是德、罗德等海外供应，#高阶PCB板领域有望用67G＋矢量网络分析仪全检 3、安居宝：国内楼宇对讲行业的龙头企业，主营楼宇对讲系统、智能家居系统、停车场系统、监控、防盗报警系统等 4、南威软件： 1、公司以 等这些细分环节是油的非常旺盛 ，都处于景气扩张周期对于上游的设备材料和先进 封装的需求会同步的拉动 ，那么我们就建议关注的话像这个 PCP存储mlcc管理设备及材料全景封装这些 产业链的一个投资机遇。然后最后在这个风险因素方面的话 ，要关注这个啊中美科技摩擦 ，还有包 括AI应用发展不及预期 ，国产技术突破不及预期 ，下游终端需求不及预期 ，还有市场竞争加剧等等。 好，我们今天的分享就到这边 ，祝大家投资顺利。我们。 E6636BB1012F9B6DA981D91E6DDB88C4C9EDBE8CB36DD7758AA1463F47DFE5EA9EFB9DEC4250E1D4A81BB7FF9C1F40047B68B4C31A9B284E5EC70C7E5002CE351733235", "status": "extracted"}, "post:2026-09-23T09-22:30fd1a0d6fdf": {"id": "post:2026-09-23T09-22:30fd1a0d6fdf", "kind": "post", "title": "2026-09-23 09:22", "source_label": "帖子正文", "excerpt": "【天风机械】富信科技定增2.7亿扩产，#产能满产对应产值22亿元🌹定增扩产落地：#拟定增募资不超2.7亿元，其中1.5亿元用于新增Micro TEC产能4200万片/年，同时提升精密封装、自动化检测及可靠性控制水平产能测算：#现有产能扩至250万片/月+新增350万片/月，合计满产产能600万片/月", "content": "【天风机械】富信科技定增2.7亿扩产，#产能满产对应产值22亿元🌹定增扩产落地：#拟定增募资不超2.7亿元，其中1.5亿元用于新增Micro TEC产能4200万片/年，同时提升精密封装、自动化检测及可靠性控制水平产能测算：#现有产能扩至250万片/月+新增350万片/月，合计满产产能600万片/月（7200万片/年），按30元/片测算对应产值约22亿元，按照40%的净利率测算，#利润有望达到9亿元需求端持续验证：#通信领域MicroTEC上半年收入5616.46万元同比+145.96%，800G已批量供货、1.6T小批供货，CPO产品送样验证中，客户覆盖Coherent、华工科技、索尔思光电 ☀️行业景气度支撑：#AI算力基建加速推动光模块需求增长，公司作为国产替代龙头正处于产能与订单同步放量阶段#文字观点", "publish_time": "2026-09-23 09:22", "tags": ["产能满产对应产值22亿元", "通信领域Micro", "文字观点"]}, "post:2026-09-23T10-40:715889d3cb73": {"id": "post:2026-09-23T10-40:715889d3cb73", "kind": "post", "title": "2026-09-23 10:40", "source_label": "帖子正文", "excerpt": "【国金通信 & 电子】光模块散热迭代路线（2） - 260922 1️⃣#可插拔光模块：① 800G光模块：常用8W 导热凝胶 + VC均热板，单模块TIM价值30-40元、VC约50-60元；② 1.6T光模块：TIM升级至15-20W凝胶，价值量提升", "content": "【国金通信 & 电子】光模块散热迭代路线（2） - 260922 1️⃣#可插拔光模块：① 800G光模块：常用8W 导热凝胶 + VC均热板，单模块TIM价值30-40元、VC约50-60元； ② 1.6T光模块：TIM升级至15-20W凝胶，价值量提升；VC改进有限；#弹性：一体式均热板，用于可插拔光模块中，将光模块的外壳的一部介，设计成一体化的均热板结构，价值量可达100+，享有定制化溢价； 2️⃣#NPO/CPO：预计主流方案：交换芯片与NPO/CPO光引擎共用石墨烯导热垫片，再配合冷板。#价值量提升：石墨烯垫片100+，冷板100-150；#竞争格局更优：能做石墨烯导热垫片的厂商\u003c\u003c能做传统TIM材料的厂商；#盈利能力更高：参考hfc招股书，毛利率60%+，对比TIM&VC毛利率30-40%。#重点推荐：1️⃣ 鸿富诚：AI敞口最大、目前是海外大客户唯一供应商、xys&ds投资； 2️⃣ 中石科技：xc入股、tim&vc&石墨烯导热垫片&浮动式冷板等产品均有储备； 3️⃣ 苏州天脉：光模块VC+苹果手机散热供应商，当前估值相对较低； 4️⃣ 富乐德：主业半导体洗净业务稳健增长，tec用陶瓷基板的头部玩家。 建议关注：科创新源、飞荣达等 欢迎联系：国金通信 姚依念；国金电子 丁彦文 风险提示：AI发展不及预期#文字观点", "publish_time": "2026-09-23 10:40", "tags": ["可插拔光模块", "弹性", "NPO", "CPO", "价值量提升", "竞争格局更优", "盈利能力更高", "重点推荐", "文字观点"]}, "attachment:files/MS-光学北美：ECOC 初步解读：全速前进 Optical  North America ECOC First Take Full Steam Ahead.pdf": {"id": "attachment:files/MS-光学北美：ECOC 初步解读：全速前进 Optical  North America ECOC First Take Full Steam Ahead.pdf", "kind": "attachment", "title": "MS-光学北美：ECOC 初步解读：全速前进 Optical North America ECOC First Take Full Steam Ahead", "source_label": "MS", "excerpt": "M Idea Optical | North America ECOC First Take: Full Steam Ahead Versus OFC, consensus at ECOC was that NPO is coming in a 2028 time frame in parts of scale-up networks. Architectu", "content": "M Idea Optical | North America ECOC First Take: Full Steam Ahead Versus OFC, consensus at ECOC was that NPO is coming in a 2028 time frame in parts of scale-up networks. Architectures are likely to evolve dramatically as technology advances, but optical content to continue to increase. Supply chain largely sold out; InP substrate seemingly the biggest bottleneck. Morgan Stanley & Co. LLC Meta A Marshall Equity Analyst Meta.Marshall@morganstanley.com +1 212 761-0430 Antonio Jaramillo Research Associate Antonio.Jaramillo@morganstanley.com +1 212 761-4438 Telecom & Networking Equipment North America Industry View In-Line This note is a first take summary of meetings we hosted at ECOC in Spain on 9/21 and 9/22. We will publish more detailed company specific takeaways from our meetings with CSCO, CIEN, COHR, KEYS, NOK (covered by Terence Tsui), TSEM, Lightmatter in the coming days. Sunny skies in Spain as sun shines down on optical. ECOC has traditionally been a smaller, more technical trade show to OFC. However, with the optical trade now well discovered as content in AI networks grows, this event has garnered much more investor attention. Themes brought up at the show are no surprise: optical content is growing faster than suppliers can produce it, many vendors are sold out for 12-18 months, and the exact form that CPO/NPO will take is still up for grabs. However, versus 6 months ago, there was more recognition that NPO is going to happen starting in 2028, aided by the Open CPX MSA, which is seeking to build common parameters for optical engines that will allow a greater ecosystem to be built, making hyperscalers less concerned about adopting it than when NVDA's solution was the only option (NVDA is covered by Joe Moore). This isn't to minimize that there are still tremendous scaling / production / implementation challenges ahead in the coming years. It is just to say that there are enough suppliers working towards an open solution, and a growing need for optics and electronics to be closer to each other in scale-up, that a first generation of product is going to at least be trialed in 2028. There was also consensus that the architecture the first generation of product takes is unlikely to be the final format, as laser types, where those lasers are located, etc., are all subject to change in coming generations. This also means Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report.Key Takeaways Consistent with OFC, optical vendors are seeing continued strength in demand; not a surprise to investors at this point in the AI capex cycle. Incremental to the conversation from OFC, there is more confidence in NPO adoption, as Open CPX MSA introduces an ecosystem around solutions. OCS to still see growth, but Google to by far remain the largest implementation. CSCO and NOK being opportunistic with supply, but do not see major share shifts, with CIEN holding majority line system share. Prefer KEYS, but with early NPO likely to use external lasers (which then need to be higher power), see LITE/COHR continuing to have most attention. September 23, 2026 04:01 AM GMT Not for redistribution without written consent of Morgan Stanley M Idea 2competitive positioning today isn't a lock for the long term. Common themes from meetings: •End goal: use optics to reduce power, cost, and latency, while improving bandwidth density, capacity, and the reliability of high-speed AI networks. The above line is the stated goal of the Open CPX MSA, highlighting that while much is made about the large, growing opportunity for optics vendors, the end goal of hyperscalers is to find the most power and cost efficient solutions (e.g. the reason we have seen ZR pluggables proliferate, why network builders keep trying to make silicon photonics (CW) lasers have greater applications, the adoption of XPO). While we are not calling for margins to peak anytime soon, we are mindful that as opportunity multiplies, the form solutions take today may not be the form they always take (e.g. VCSELs could see a resurgence in short reach applications). Overall, this remains a positive for nearly everyone in the space, but we still prefer KEYS given less dependent on end destination, just that solutions are being trialed. •Everyone working towards an NPO solution. While we still had one meeting where CPO/NPO was described as \"inevitable, but not imminent\", the general consensus is that hyperscalers are going to move towards NPO in coming years. This is different than at OFC, where there was a resistance to NVDA's CPO solution given concerns around vendor lock-in / closed ecosystem. However, COHR , with their PhotonLink announcement, addressed an upcoming challenge in that hyperscalers may want to move to open solutions, but don't necessarily have all the knowledge in house to assemble a solution from 6+ different vendors. PhotonLink gives customers an end-to-end solution for CPO/NPO, proving to them it can be done, and allowing customers to pick the pieces of the solution they want. We think COHR's broad based portfolio is particularly suited for this, with the company noting they have an L TA with a customer for an NPO solution that should begin ramping next year. While we did not meet with LITE at the show, we would note that they have talked about expecting an L TA announcement in coming months for NPO. While COHR/LITE are loudest, we would continue to note that many vendors are working on NPO solutions. •Mostly sold out, but not uniformly so. In general, most component / system suppliers were sold out for the next 12-18 months, with InP substrate being the gating item (e.g. AXTI, Sumitomo). To the extent that more substrate comes available, or yields improve, there can be upside, but conditions remain tight amongst EMLs, CW lasers, pump lasers, and gold boxes, just to name the major categories. We would note that CSCO and NOK did talk to still having some availability, which we think allows them to be strategic in the near term around supply releases, but do not expect any meaningful share shifts. •OCS is coming, but likely smaller use cases with subsequent customers. Google's use of OCS is well reported, with production ramp moving to LITE in coming years. Because of Google's success with the product, nearly every other hyperscaler / neocloud is trialing OCS. From what we heard at the show, there will be many more customers for OCS in the coming years. However, those use cases are likely to be smaller in scale than Google's M Idea Morgan Stanley Research 3implementation (with one customer apparently canceling an implementation after fully qualifying a solution). We still see it as a margin accretive opportunity for LITE and COHR, but would expect LITE to accrue most of the value in the near term as supplying into the largest implementation. Prefer those that benefit no matter the path. We have been very vocal in liking KEYS , seeing it as able to benefit from the growth in optics, no matter the implementation. We would tend to put GLW in that same boat as a beneficiary, no matter the implementation. However, we would still note, LITE / COHR are likely to remain fairly sold out in the foreseeable future as InP lasers remain in short supply, and first generation NPO/CPO products are likely to all use external lasers, meaning high powered lasers will see dramatic increases in demand in coming years. CIEN has multiple paths to success, but is dependent on InP supply chain loosening more in coming years to be able to materially outperform the target laid out (which is still not fully captured in price). We did not pick up on any reason for CSCO weakness today in meetings, as demand conditions remain strong, and supply chain being more in their control gives them continued opportunities to grow their revenue base from cloud customers. M Idea 4Disclosure Section The information and opinions in Morgan Stanley Research were prepared by Morgan Stanley & Co. LLC, and/or Morgan Stanley C.T.V.M. S.A., and/or Morgan Stanley Mexico, Casa de Bolsa, S.A. de C.V.. As used in this disclosure section, \"Morgan Stanley\" includes Morgan Stanley & Co. LLC, Morgan Stanley C.T.V.M. S.A., Morgan Stanley Mexico, Casa de Bolsa, S.A. de C.V. and their affiliates as necessary. For important disclosures, stock price charts and equity rating histories regarding companies that are the subject of this report, please see the Morgan Stanley Research Disclosure Website at www.morganstanley.com/eqr/disclosures/webapp/generalresearch , or contact your investment representative or Morgan Stanley Research at 1585 Broadway, (Attention: Research Management), New York, NY, 10036 USA. For valuation methodology and risks associated with any recommendation, rating or price target referenced in this research report, please contact the Client Support Team as follows: US/Canada +1 800 303 爆发引发供给结构性重构，PCB产业链迎密集涨价潮，树脂、电子布、铜箔、CCL、PCB各环节均完成顺价传导。", "content": "【今日投资舆情热点】1）地产链：国家统计局数据显示，8月一线城市新建商品住宅销售价格同比降幅比上月收窄0.2个百分点至0.9%。 2）PCB：AI服务器需求爆发引发供给结构性重构，PCB产业链迎密集涨价潮，树脂、电子布、铜箔、CCL、PCB各环节均完成顺价传导。 3）VNA：华泰证券研报认为，AI算力建设推动高速互连加速升级，矢量网络分析仪（VNA）有望迎来发展机遇。 4）HBM：三星计划将HBM制程中玻璃载体的外包清洗量由今年每月2万片提升至明年每月5万片，较去年每月1万片增至5倍。", "publish_time": "2026-09-23 15:43", "tags": []}, "post:2026-09-23T21-59:c3834c21fabf": {"id": "post:2026-09-23T21-59:c3834c21fabf", "kind": "post", "title": "2026-09-23 21:59", "source_label": "帖子正文", "excerpt": "PCB、覆铜板与载板📌Prismark 专家电话会核心要点🔹我们邀请了来自 Prismark 的高级顾问 Terry Wang，探讨近期若干议题，包括共封装光学（CPO）对 PCB / 覆铜板的影响，以及聚四氟乙烯（PTFE）的潜在应用前景。核心要点如下： 🔹共封装光学（CPO）对高速覆铜板的影响大", "content": "PCB、覆铜板与载板📌Prismark 专家电话会核心要点🔹我们邀请了来自 Prismark 的高级顾问 Terry Wang，探讨近期若干议题，包括共封装光学（CPO）对 PCB / 覆铜板的影响，以及聚四氟乙烯（PTFE）的潜在应用前景。核心要点如下： 🔹共封装光学（CPO）对高速覆铜板的影响大概率可控。CPO 并不会简单等同于 PCB / 覆铜板规格降级，因为系统仍需要高性能材料来支持供电以及板上剩余的数据传输与通信（即相关需求在光链路本身之外依然存在）。因此 M7（或更高等级）覆铜板预计仍会被采用。 🔹CPO 预计将率先在 2026 年于交换机领域规模化落地，其余领域商业化周期更长，短期内对高速覆铜板需求的替代空间有限。🔹此外，随着器件形态的规模化发展（交换机芯片可搭载光引擎），板 / 载板尺寸、翘曲度与平整度约束或将成为影响系统性能的关键因素，即便 CPO 渗透率进一步提升，市场仍会催生对低 CTE（也就是更高端）材料的需求。🔹聚四氟乙烯（PTFE）的落地尚未敲定，可加工性仍是核心制约因素。在市场关注度较高的 PTFE 议题上，结论是 PTFE 尚未扫清实现 PCB 稳定量产所需的实际障碍（例如压合 / 工艺窗口以及可靠性相关问题），并且材料 “通过认证” 并不一定代表可以实现规模化制造。 🔹对于超高层数应用场景（例如背板，层数已超过 100 层），材料选择仍未确定，相关讨论仍在持续，这表明 PTFE 应当被视作一条仍在发展的技术路线，而不是已经落地、即将直接替代现有材料路线的方案。 🔹目前行业正在探索无玻璃布覆铜板方案，该材料的应用将催生全新的 PCB 制造工艺，率先完成产线革新的公司将获得先发优势。🔹上游材料：供需关系依旧偏紧；树脂或将成为覆铜板的下一个差异化赛道。源头内容加微WUXL3408对于玻纤而言，向高端产品（即低 DK、低 CTE 玻纤）的产能转换，实际上会提升加工强度，可能压缩短期有效产出，使得市场紧张程度高于名义产能扩张所体现的水平。 🔹不过低端玻纤产品的供需缺口未来有望收窄，原因是该领域技术门槛相对更低，整体供给具备扩张空间。 🔹铜箔方面，高端 HVLP 铜箔供给仍被认为存在结构性约束，新增产能往往受制于良率与品质爬坡，而非铭牌产能公告。 🔹与此同时，在覆铜板未来升级的驱动要素上，讨论重心或将转向树脂。树脂配方属于专利技术，树脂与填料之间的相互作用至关重要，这为性能持续优化保留了空间（存在超越 BCB 材料进一步升级的可能性，烃类树脂路线仍有发展空间）。 🔹PCB / 载板的竞争格局持续利好行业存量头部厂商。整体来看，PCB / 载板行业后续竞争中，不断抬升的技术要求（翘曲控制、厚板、PCB 制造工艺革新）提高了行业准入门槛，拉长了客户认证周期，从结构层面利好具备成熟落地经验的老牌公司。🔹尽管部分新进入者会采取激进的产能扩张策略，但 AI 级产品的交付要求以及客户的风险偏好，往往会将订单集中分配给行业头部厂商。 🔹因此，行业格局大概率会持续向具备规模、品质验证的制造厂商集中，强化 “强者恒强” 的格局。#文字观点", "publish_time": "2026-09-23 21:59", "tags": ["文字观点"]}, "post:2026-09-23T08-01:115894a7e396": {"id": "post:2026-09-23T08-01:115894a7e396", "kind": "post", "title": "2026-09-23 08:01", "source_label": "帖子正文", "excerpt": "美股盘面速览：消费惯性#交易台📊标普 500 指数收盘持平，报 7764 点，收盘市价指令净买入 13 亿美元。纳斯达克 100 指数上涨 82 个基点，报 30732 点。", "content": "美股盘面速览：消费惯性#交易台📊标普 500 指数收盘持平，报 7764 点，收盘市价指令净买入 13 亿美元。纳斯达克 100 指数上涨 82 个基点，报 30732 点。罗素 2000 指数上涨 72 个基点，报 2896 点。道琼斯指数下跌 36 个基点，报 51863 点。全美股票交易所合计成交 1790.9 亿股，年初至今日均成交 1872.9 亿股。VIX 恐慌指数下跌 4.03 个基点，报 14.27。WTI 原油下跌 1.24 个基点，报 94.59 美元。美国 10 年期国债收益率上行 0.002 个基点，报 4.9531%。黄金上涨 44 个基点，报 4362 美元。美元指数上涨 12 个基点，报 100.55。比特币下跌 82 个基点，报 86270 美元。 📈美股主要指数小幅收高，纳斯达克 100 指数录得连续第四个交易日上涨，但各指数表现分化（纳斯达克 100 > 罗素 2000 > 标普 500，标普 500 收盘持平）。原油连续第五个交易日迎来喘息，相关谈判仍在推进，有消息称伊朗可能在 7 天内重新开放霍尔木兹海峡，前提是美国减轻军事压力。下午晚些时候传出消息，特朗普表示伊朗达成协议的 “动力很足”，而他在当日早些时候的联合国大会发言中，曾表示预计中期选举前不会达成协议。 💬交易台今日讨论最多的主题，是 Meta Muse 发布之后智能体 AI 带来的影响，以及针对 “消费惯性” 标的的做空交易。我们的一篮子股票 GSXUSWCH 组合今日下跌 2.58%，该组合是近期交易最为活跃的一篮子标的之一，成分股所属行业的客户留存依靠 “行为、运营、合约或财务层面的转换成本” 支撑。换句话来讲，这类服务很难取消（除非借助智能体 AI 来完成取消操作）。 📉该组合内部分标的当日大幅波动： PLNT（-9.45%） NYT（-7.16%） SCHW（-6.11%） ALL（-5.55%） INTU（-3.87%） 📌交易台当日交易活跃度为 3/10，卖出端表现相对改善 871 个基点。资产管理人卖出端多出 8.57 亿美元，通信服务、可选消费、医疗保健与科技板块出现卖盘，宏观产品与材料板块存在买盘需求。对冲基金卖出端多出 9.53 亿美元，通信服务、可选消费、金融与宏观产品出现卖盘，医疗保健存在买盘需求。 ⚙️衍生品板块：智能体 AI 热度再度成为焦点，纳斯达克 100 指数收盘创下 6 月以来首个新高，标普 500 指数收盘持平。纳斯达克 100 指数的固定行权价波动率今日受到买盘推动，现货表现强势，波动率曲线中段与远端上行。在本轮上涨行情中，波动率终于脱离夏季持续低位运行的底部区间。午后伽马期限的偏斜度走高，但收盘时，伽马期限与纯维加期限的偏斜度同步收跌。标普 500 指数现货收盘基本持平，固定行权价波动率遭到卖盘，偏斜度大幅收窄。资金流层面，交易台整体交投偏淡，但市场出现 VIX 十月期权买盘，10 月 17 日跨式期权与 10 月 18 日看跌期权均有 2 万张成交。我们看好 10 月 20 日看涨期权，在密集事件日历到来之前，该期权以相对低廉的价格提供具备吸引力的凸性。在宏观与主题层面，金融板块 ETF（XLF）出现双向资金流动，该板块因智能体 AI 带来的风险遭遇抛售。半导体板块，不同期限的看涨期权均迎来买盘。在 Meta 开发者大会、麦当劳与奥罗拉投资日等事件落地前，标普 500 指数明日隐含波动幅度为 40 个基点。（作者：Gail Hafif）#文字观点", "publish_time": "2026-09-23 08:01", "tags": ["交易台", "文字观点"]}, "post:2026-09-23T08-34:994e892a627b": {"id": "post:2026-09-23T08-34:994e892a627b", "kind": "post", "title": "2026-09-23 08:34", "source_label": "帖子正文", "excerpt": "【华创宏观·张瑜团队】隔夜市场回顾 • 特朗普在第81届联合国大会发表措辞强硬的演讲，引起部分代表离场，联合国秘书长暗批美国的做法助长霸权倾向；他重申美国将在11月中期选举后与伊朗达成协议 • 美联储官员密集表态：里士满联储行长警告通胀压力可能需要一定时间才能消退，波士顿联储行长表示加息将有助于通胀", "content": "【华创宏观·张瑜团队】隔夜市场回顾 • 特朗普在第81届联合国大会发表措辞强硬的演讲，引起部分代表离场，联合国秘书长暗批美国的做法助长霸权倾向；他重申美国将在11月中期选举后与伊朗达成协议 • 美联储官员密集表态：里士满联储行长警告通胀压力可能需要一定时间才能消退，波士顿联储行长表示加息将有助于通胀回归目标水平，巴尔金称目前尚不清楚是否需要进一步加息，柯林斯认为通胀维持在2%以上的可能性更高；纽约联储主席威廉姆斯表示将继续关注美国国债市场的中央清算，未评论货币政策 • 益普索最新民调显示，由于伊朗战争不得人心，美国选民对特朗普在生活成本问题上的施政表现愈发不满，其支持率跌至32%创政治生涯新低，在共和党选民中的支持率也从82%降至73% • 美国国债市场基差交易规模降至逾两年低点，华尔街策略师认为套利空间缩小或反映美债需求坚挺；Pimco淡化对长期美债看空立场，称随着收益率升至5%以上，债券变得更具吸引力 • 美伊官员在联大进行罕见直接接触，特朗普称三小时会谈进行得\"非常好\"，不久后将安排再次会面；海湾阿拉伯国家据悉计划敦促特朗普避免与伊朗冲突升级 • 特朗普签署与丹麦及其自治领地格陵兰岛的安全协议，以加强北极和北大西洋地区的安全，并计划在格陵兰建造两个\"非常重要\"的军事基地 • 沙特阿美已通过非正式方式告知多家亚洲炼油商，很快可以从红海延布港装运原油，此前遭无人机袭击关停的沙特东西输油管道已重启；据报道胡塞武装控制曼德海峡并禁止沙特油轮通过，延布港出口骤减#文字观点", "publish_time": "2026-09-23 08:34", "tags": ["文字观点"]}, "post:2026-09-23T12-45:89312bafaca1": {"id": "post:2026-09-23T12-45:89312bafaca1", "kind": "post", "title": "2026-09-23 12:45", "source_label": "帖子正文", "excerpt": "📌高盛 —— 中国娱乐行业：AI 时代的内容无限与注意力有限 📝💡核心结论：高盛（Goldman Sachs）认为，随着 AI 生成内容（AIGC）技术迭代，内容供给正变得近乎无限，生成成本与周期大幅缩短，用户接受度快速提升。📝⚠️但用户注意力依然有限，这将从根本上重塑中国媒体与娱乐行业的价值链与利", "content": "📌高盛 —— 中国娱乐行业：AI 时代的内容无限与注意力有限 📝💡核心结论：高盛（Goldman Sachs）认为，随着 AI 生成内容（AIGC）技术迭代，内容供给正变得近乎无限，生成成本与周期大幅缩短，用户接受度快速提升。 📝⚠️但用户注意力依然有限，这将从根本上重塑中国媒体与娱乐行业的价值链与利润池。 📝🔮未来几年，行业利润将从生产制作环节向头部 IP（知识产权）与内容分发平台转移，同时催生互动短剧、虚拟陪伴等全新商业模式。 📝🎮在现有细分赛道中，网络游戏仍是韧性最强的领域，腾讯（Buy）与网易（Buy，列入确信买入名单）为首选标的；心动公司（XD）因 TapTap 平台受益于游戏供给爆发，投资逻辑从 “AI 受损者” 转向 “AI 受益者”，上调至 “买入” 评级。 📝📊AIGC 现状：供给爆发、质量提升、用户接受度走高。📝📈1）供给端：2026 年 8 月，短剧 / 微短剧上线数量较 2025 年同比增长 13 倍，游戏（含小程序游戏）数量增长超 8 倍。 📝⚡AI 视频生成速度已超越人类观看速度（如 MiniMax 的 H3 Max 模型可在 3 秒内生成 5 秒视频）。 📝✨2）质量端：过去 6 至 12 个月，AI 内容已占据短剧市场主导地位（如红果短剧平台 AI 内容占比超 50%），芒果 TV 与爱奇艺等长视频平台亦开始出现单集 15 至 60 分钟的中长 AI 剧集。 📝👥3）用户端：随着质量改善，用户对 AI 内容的接受度快速上升，尤其在短剧、音乐流媒体及短视频等对画质敏感度较低的场景中。 📝📺红果平台超 90% 的短剧已为 AI 生成（含动画与数字人）。 📝💰成本与周期：平均节省 80% 至 95%，制作周期缩短 5 至 10 倍。📝✂️AI 视频可使动画、音乐、广告及短剧的制作成本降低 80% 至 95%；源头内容加微WUXL3408复杂互动格式如游戏或长视频，亦可节省 30% 至 70% 的成本（涵盖 3D/2D 美术生成、原画设计等）。 📝⏱️更重要的是，制作周期缩短至少 5 至 10 倍。 📝🎮以小程序游戏为例，过去需 3 至 6 个月完成的开发，现仅需 2 至 3 人团队一周即可完成。 📝📽️芒果 TV 的 AI 长剧采用 “边审边播” 模式，进一步加速了内容上线流程。 📝🔄价值链重塑：利润池向头部 IP 与分发平台迁移。📝📜1）IP 与创意层：头部及长生命周期 IP 仍将占据用户注意力，AI 有助于延长其生命周期；但长尾 IP 及新 IP 在注意力碎片化的环境下突围难度加大。 📝📉2）生产制作层：价值池将萎缩。AI 工具的普及使内容生产周期缩短，同质化竞争加剧，传统价值创造被稀释。 📝🎬实体摄影棚、演员、外包机构及平面设计等将受到最大冲击。 📝📡3）分发平台层：整体利好，但需平衡真人氛围与 AIGC 内容。 📝💸尽管制作成本大幅下降，但大多数短剧生产商因需在平台（如红果、抖音）购买流量而难以盈利，内容保质期亦因供给速度加快而缩短。 📝⚠️依赖版权内容构建护城河的平台（如音乐流媒体、长视频），其进入壁垒在中国版权保护相对薄弱的背景下正被削弱。 📝🚀新兴商业模式：五大方向。📝🎞️1）动态互动微短剧：基于实时观众选择或情绪分析动态生成叙事，取代静态预渲染。 📝🌐2）超低延迟视频基础设施：如 fal.live 等平台实现实时视频流转换与多用户实时联合执导。 📝🤖3）虚拟主播与互动直播电商：从动作捕捉驱动进化为全自主多模态智能体，实现 24 小时不间断直播带货。 📝💬4）个性化一对一虚拟陪伴：基于时间计费（如 1 美元 / 分钟）或订阅制，提供高保真虚拟角色互动。 📝🔧5）AI 工作流编排层（Harness & Agent Orchestration Layer）：如爱奇艺的 “纳逗 Pro”（Nadou Pro）及 LiblibAI 等平台，通过整合多智能体工作流、长程叙事一致性管理及资产分发捕获更高经济价值。 📝⚠️潜在挑战：商业化、监管与版权。📝💸1）商业化：增量算力成本仍高，但消费者付费意愿有限。 📝😮‍💨无限供给可能导致内容疲劳，观看时长与用户支出未必同步增长。 📝📜2）监管：AIGC 业务面临 AI 监管、隐私法、消费者保护、广告法及版权法规的交叉约束。 📝❤️虚拟偶像、陪伴智能体及互动剧因涉及情感连接，合规挑战尤为突出。 📝⭐标的筛选与评级调整：📝📈1）心动公司（XD，2400.HK）：上调至 “买入”，目标价 60.70 港元。 📝🎮TapTap 平台将显著受益于游戏供给的爆炸式增长。 📝🔄公司叙事已从 2026 年上半年的 “AI 受损者”（因 AI Token 成本上升及 TapTap Maker 分流广告流量），转变为 “AI 受益者”，尤其是其独特的游戏创作与分发闭环对长尾开发者极具吸引力。 📝👍2）腾讯（0700.HK）：维持 “买入”，目标价 650.00 港元。 📝🧠在游戏 AI 应用（基础引擎、全管线工业工具、Hunyuan‑Game 模型）方面处于领先地位。 📝✅3）网易（NTES/9999.HK）：维持 “买入”（列入确信买入名单），美股目标价 168.00 美元，港股目标价 263.00 港元。 📝🎯重点发力 AI 原生玩法、大语言模型（LLM）驱动的自主 NPC 及生成式 UGC（AI‑UGC）。 📝📉4）长视频平台：芒果超媒（300413.SZ）维持 “卖出”，目标价 13.30 元；爱奇艺（IQ）维持 “中性”，目标价 1.40 美元。 📝⚠️短期受益于成本削减，但长期面临用户流向短剧平台及 AI 内容偏好转移的风险。 📝🎵5）音乐流媒体：腾讯音乐（TME）维持 “买入”，但订阅收入面临 AI 翻唱歌曲的冲击，中长期增长需依赖非订阅收入。 📝👀6）短视频平台：快手（1024.HK）维持 “中性”，需在 AI 内容洪流中维持社区的真实人类氛围。#文字观点", "publish_time": "2026-09-23 12:45", "tags": ["文字观点"]}, "attachment:files/上市险企系列线上调研20260922.pdf": {"id": "attachment:files/上市险企系列线上调研20260922.pdf", "kind": "attachment", "title": "上市险企系列线上调研20260922", "source_label": "其他", "excerpt": "上市险企系列线上调研20260922 要点总结 1.长线资金加速布局，外资认知转向国企价值境外路演反馈显示，欧美及北美长线投资者显著增加对 华股持仓，投资理念从短期对冲转向至少持有三年的耐心资本。市场情绪逐步转变，外资对中国国企的 认知正在重塑，建立投资信仰需约三年周期，H股持续领涨A股形成正向带动。", "content": "上市险企系列线上调研20260922 要点总结 1.长线资金加速布局，外资认知转向国企价值境外路演反馈显示，欧美及北美长线投资者显著增加对 华股持仓，投资理念从短期对冲转向至少持有三年的耐心资本。市场情绪逐步转变，外资对中国国企的 认知正在重塑，建立投资信仰需约三年周期，H股持续领涨A股形成正向带动。 2.三季度投资与利润承压明确，短期波动属正常现象公司明确提示三季度投资端与利润面临较大压 力，主要受去年高基数、市场风格快速轮动及新准则下权益波动放大影响。盈亏同源，短期季度波动不 可避免，投资者应更多关注长期资产配置能力与穿越周期的表现。 3.分红彰显信心与诚意，新利润指标辅助平滑波动中期分红增速超预期（约51%），体现管理层对长 期发展的信心与培养耐心资本的诚意。针对利润短期波动可能，公司推出剔除公开市场权益波动的利润 指标（OPAT），以8%假设平滑股市震荡，但暂不挂钩考核与分红政策，具体DPS指引需视年底双利 润指标最终表现而定。 4.集团注资暂未落地，属轻微资本运作尝试目前集团向上市公司注资尚未启动，预计明年初视大盘与 投资者态度推进。该操作为上市23年来首次股本结构调整，属于轻微资本运作，对实体业务、偿付能 力及实际比例提升影响有限，同业亦在观望市场反馈。 5.负债端销售受基数与政策扰动，全年NBV双位数目标不变7-8月个险与银保渠道出现负增长，主因 去年预定利率下调带来的“炒停”高基数及65号文产品切换影响，9月已现反转。全年仍力争新业务 价值双位数增长，开门红虽面临高基数压力，但公司将聚焦养老保障细分领域，分红险仍为主流产品形 态。 6.资产配置均衡分散，OCI规模稳步提升应对低利率公开市场权益仓位已达战略中枢附近（约 19%），整体权益含一级市场超25%。OCI权益自2025年以来规模增约4000亿元，年均贡献股息约 200亿元，股息率门槛适度放宽至3%左右。TPL侧重均衡分散与新生产力主线，通过资产负债联动、 债券择时、另类资产布局等多维度应对低利率环境。 7.偿付能力新规影响有限，坚持长期价值导向支付新规相关指标公司均已达标，未因单一指标被动调 整业务动作。公司坚持实质性的资产负债管理与长期价值导向，统筹风险收益覆盖与偿付能力资本管 理，强调拉长周期看待企业成长，波动是资本市场与公司发展的常态。 wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 问答整理 Q1：近期路演中投手及市场关注的核心反馈是什么？如何看待当前资金面与情绪面？ 答：境外路演显示长线资金明显增多，尤其是欧美及北美投资者加速入场，投资周期普遍拉长至三年以 上。市场认知正从“私企/外资更好”转向重新审视中国国企价值，建立投资信仰需三年打底。H股持 续领涨形成示范效应，带动A股资金面与情绪面改善。 Q2：关于集团注资，目前是否有明确说法？是否确实会注入上市公司？ 答：暂无明确时间表，但市场共识及公司预期均认为部分资产应注入上市公司。注资预计明年初视大盘 与投资者态度推进，目前尚未开始。 Q3：市场有传闻称国寿要去某地揭牌或某公司有问题的说法，是否存在？ 答：予以澄清，上市公司无此功能安排，相关传闻不实。 Q4：大股东（国家队）近期股东名册上是否有明显动作？ 答：股东名册数据不对外详细披露，无法直接观测具体动作，但整体股权架构稳定。 Q5：若下半年利润出现短期大幅波动甚至负增长，派息政策（DPS）是否有应对机制或底 线？ 答：DPS政策取决于利润实际跌幅程度。公司推出剔除公开市场权益波动的利润指标（OPAT）以辅助 理解，但分红不与之硬性挂钩。海外投资者测算显示公司底蕴厚实，即便极端压力测试下也有空间守住 DPS，但具体量化指标需结合四季度业绩及去年低基数综合评估，暂不给具体指引。 Q6：能否弱指引DPS不降？同业部分公司会给长期指引，国寿目前是否也不给？ 答：目前暂不提供明确的DPS不降指引，需领导层综合考量后确定。 Q7：能否详细回顾三季度投资端的具体情况及利润表现？ 答：上半年权益组合精准把握成长风格，业绩领先行业。但三季度市场调整且风格快速轮换，叠加去年 三季度投资收益极高的高基数，导致今年三季度投资收益同比及环比均出现明显回落。短期波动在新准 则与市场风格切换下不可避免，建议投资者关注长期投资与资产配置能力。 Q8：7-8月权益市场风格变化快，公司在权益配置方面是否有调仓？后续对市场有何见解？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：7-8月市场分化收敛，三四季度风格仍处于混沌期，缺乏明确主线。公司坚持“成长弹性+红利价 值”双线并行策略，上半年及三季度已开展持仓结构调整，加大OCI权益配置以增强稳定性。明年该 双线策略不变，战术上保持灵活，聚焦均衡分散以优化内部结构，增强长期回报韧性。 Q9：OCI与GPL两个部位的配置规划是否有目标比例？财务影响分化，公司如何权衡？ 答：公开市场权益总体比例已达战略中枢附近，整体相对稳定。OCI配置在战术上保持灵活，今年三四 季度将观察到OCI比例相对稳定的抬升，但更长期需结合市场动态调整，无法给出具体指导值。 Q10：三季度分量的销售情况如何？原因是什么？ 答：7-8月个险与银保均出现负增长，主因去年同期受预定利率下调影响存在“炒停”行为，基数极 高。今年节奏更平稳，9月已实现反转，预计后续月份优于去年同期，全年仍争取新业务价值双位数增 长。 Q11：除技术原因外，是否有其他因素（如65号文、分红险演示率调整等）干扰销售降幅？ 答：65号文对银保端属短暂影响，公司新老产品提前准备，实现平稳过渡。更主要仍是去年切换业务 的基数影响。撇开基数看，9月单月平台实际增速较高，环比亦有提升。后续银行与保险公司将互相适 应新规，影响将进一步减弱。 Q12：需求端是否受产品预定利率下调及资本市场结构性行情冲击？一线感受如何？ 答：客户储蓄端需求依然存在，保费端数据可印证。但渠道端（尤其银保）内卷加剧，可能出现期限缩 短、边际价值小幅下降的情况。需求并未减弱，而是需要通过更细化的产品满足差异化客户需求。 Q13：2026年收官及2027年开门红压力大不大？初步规划与方向指引为何？ 答：开门红压力始终存在，今年主要受一季度负债端创历史新高带来高基数影响，叠加宏观消费偏低迷 及医疗资源挤占商业保险等国情因素，压力确实较大。产品端将继续聚焦养老保障细分领域，分红险在 预定利率动态调整机制下大概率仍为主流，后续将统筹考虑更多元化产品。 Q14：新利润指标（剔除公开市场权益波动）的算法定义是什么？与同业营业利润假设（如 4%）相比如何？对内外部管理及分红政策是否应用？ 答：算法名称即含义，主要剔除公开市场权益波动。公开市场权益采用8%假设（与欧美同业一致）， 未上市股权投资参照二级市场估值但基于审慎性使用略高于无风险利率的溢价。整体年化投资收益率约 3.5%-3.6%，低于同业常见假设，更为保守客观。该指标仅用于辅助投资者理解新准则下估值，不挂钩 内部考核与风控政策，对外分红亦不直接挂钩。 Q15：监管要求国有企业加大入市力度（如30%比例），公司目前执行仓位与比例如何？ wåÆf t\u0003ÿ\u001a\\\u000fr[x\u0014b¥~ª _®Oáÿ\u001a\u0000W\u0000U\u0000X\u0000L\u00003\u00004\u00000\u00008 答：未收到相关强制要求信息，全年按既定配置安排执行，公开市场权益比例维持在19%左右，总体 保持稳定，已达到前期沟通的相关水平。 Q16：低利率环境下加配权益是大势所趋，公司权益资产（含一二级）配置方向与比例上限如 何思考？ 答：权益比例已达战略中枢，短期内维持稳定。应对低利率采取资产负债两端联动：负债端通过预定利 率调整缓解压力；资产端依托优质长债做好久期匹配与择时，把握波段增厚收益；权益端积累高股息资 产；另类资产持续布局ABS、REITs基金及Pre-IPO项目（如华电新能）以提升长期收益空间。 Q17：OCI和TPL配置的偏好板块及门槛要求是什么？ 答：坚持均衡分散原则，不偏离单一赛道。OCI构建传统红利、周期红利、潜在改善红利组合，股息率 门槛近一年适度下调至3%左右，兼顾股息率与长期增长空间。TPL同样均衡分散，聚焦红利属性与新 生产力主线（含科技、半导体等国家战略支持方向）。 Q18：市场K型分化下，TPL中科技占比是否偏高？未来是否会进行再平衡调整？ 答：会进行内部再平衡。前期估值较高的板块若后续调整，对公司而言亦是配置机会。对科技成长领域 的关注是长期的，将根据估值相对变化动态平衡，但长期看好方向不变。 Q19：不同账户（传统账户vs分红账户）转型下的投资策略有何差异？结果上谁高谁低？ 答：分红账户公开市场权益占比通常更高，新准则下承受波动能力更强，近两年权益牛市下收益率表现 更好，但基准价波动也更大。传统账户负债久期更长，可用资金高位，历史上更多配置偿债股权；随着 业务转型，分红账户配置稳定收益股权的空间将更大。分红险CSM及基础较好，新 转的空间 ，而消费股至少也会有 50%到60%的反转空间。所以我们有个小的建议 ，这个建议就是如果我们 手有消费股的持仓 ，尤其是所谓的传统消费老登消费的持仓的话 ，那我们建议把这些传统消费的仓位全 部换成最传统的仓位。因为消费和地产它反转的一个前提条件都是房价触底回升。但只要房价触底回 升，那地产的空间一定会远高于消费股的空间。以上就是我这次汇报的最核心的内容 ，谢谢各位领导。 最后祝各位投资者朋友继续马年投资 ，继续禁止炒红 ，谢谢，汇报完毕。 E6636BB1012F9B6DA981D91E6DDB88C4F9E6BE8C436DDD25BAA1463F47DFE5EA4E4B9DEC4251E1D4A81BB76F8E1F40907068B4C3199B284E56C8DC7E5202CED31C33235", "status": "extracted"}, "post:2026-09-23T10-31:e422b9d1c0ae": {"id": "post:2026-09-23T10-31:e422b9d1c0ae", "kind": "post", "title": "2026-09-23 10:31", "source_label": "帖子正文", "excerpt": "算力板块（24）：AI Agent时代重塑算力架构，服务器CPU迎来需求拐点【东北计算机】 🔥#AIAgent驱动算力结构变化CPU从辅助角色向核心算力底座升级。近期海外芯片板块持续走强，CPU方向表现突出，核心驱动来自AI Agent应用快速发展带来的算力架构变化。", "content": "算力板块（24）：AI Agent时代重塑算力架构，服务器CPU迎来需求拐点【东北计算机】 🔥#AIAgent驱动算力结构变化CPU从辅助角色向核心算力底座升级。近期海外芯片板块持续走强，CPU方向表现突出，核心驱动来自AI Agent应用快速发展带来的算力架构变化。随着大模型从训练阶段逐步向智能体应用阶段演进，服务器算力需求正在从GPU单点扩张向CPU、内存、网络等基础设施全面扩散。传统AI训练时代，服务器CPU/GPU配比较低，GPU承担主要计算任务；但进入Agent时代，模型需要持续完成“感知—规划—调用工具—执行—反馈”的循环，大量任务调度、API调用、浏览器交互、数据处理等串行任务依赖CPU完成。#行业认为未来CPU/GPU配置比例有望由过去约1:8逐步向1:1收敛部分Agent场景甚至可能进一步提升CPU占比。 🔥#供需格局持续紧张CPU产业链迎来量价双重催化。需求端，AI Agent规模化运行推动服务器CPU需求提升；供给端，高端服务器CPU产能释放仍需要时间，海外厂商部分产品交付周期延长，供需紧平衡推动CPU价格持续调整。同时，AI基础设施扩张也将带动产业链协同升级。除服务器CPU外，高性能计算、先进封装、IC载板、存储等环节均有望受益。国内产业链方面，国产CPU厂商持续推进高端服务器产品布局，在自主可控需求背景下，国产CPU替代空间进一步打开。 相关公司：（未覆盖公司不作为推荐标的） 海光信息、摩尔线程、品高股份（未覆盖）、协创数据、宏景科技、禾盛新材、横店东磁（未覆盖）、紫光股份（未覆盖）、锐捷网络（未覆盖）、中科曙光（未覆盖）、寒武纪、景嘉微（未覆盖）、浪潮信息（未覆盖）等。 ABF载板产业链：深南电路、兴森科技（未覆盖）、宏和科技 风险提示： AI Agent商业化落地不及预期；服务器CPU需求增长不及预期；国产CPU产业化进展不及预期；半导体供应链产能释放不及预期。 ☎️详情欢迎联系东北计算机团队#文字观点", "publish_time": "2026-09-23 10:31", "tags": ["文字观点"]}, "attachment:files/MS-戴尔科技北美分部：来自戴尔一号大道现场直播 —— 本次为何与众不同 Dell Technologies Inc.  North America Live From 1 Dell Way - Why This Time is Different.pdf": {"id": "attachment:files/MS-戴尔科技北美分部：来自戴尔一号大道现场直播 —— 本次为何与众不同 Dell Technologies Inc.  North America Live From 1 Dell Way - Why This Time is Different.pdf", "kind": "attachment", "title": "MS-戴尔科技北美分部：来自戴尔一号大道现场直播 —— 本次为何与众不同 Dell Technologies Inc. North America Live From 1 Dell Way - Why This Time is Different", "source_label": "MS", "excerpt": "M Idea Dell Technologies Inc. | North America Live From 1 Dell Way - Why This Time is Different Our 1-on-1 with COO Jeff Clarke at DELL HQ today covered the sustainability of infra", "content": "M Idea Dell Technologies Inc. | North America Live From 1 Dell Way - Why This Time is Different Our 1-on-1 with COO Jeff Clarke at DELL HQ today covered the sustainability of infra demand & why the Agentic cycle is different, server growth outlook, DELL’s perspective on memory “margin stacking”, supply challenges, & opex leverage. We walked away w/ greater appreciation for the DELL bull case. Did we just become DELL bulls? Not quite, but we have plenty to consider following our meeting with DELL’s COO Jeff Clarke. Specifically, Mr. Clarke made a compelling argument for why the Agentic AI cycle differs from the 8 boom/bust cycles of the last 40+ years, why this could lead to exponential server unit growth, how supply shortages could last for 5+ years, how DELL’s investments in Agentic AI are fueling 10-100x productivity improvements and influencing customers' AI journeys, how DELL is managing supply better than peers, and why record ISG gross margins aren’t “margin stacking” but instead a structure upheaval in the infrastructure margin floor. All-in, our meeting with Mr. Clarke reinforces why DELL is the clear “best athlete” within our enterprise infrastructure coverage, however we still need to gain comfort in how our forecasts might change, and how these potential changes would influence our view on valuation - both relative to history and versus peers. Below, we dig deeper into each of these topics. Agentic AI is decoupling cognitive output from headcount for the first time ever, creating a real reason for “why this cycle is different”. DELL’s view is the following - the 8 historical boom/bust cycles of mature hardware markets (server, storage, PCs, etc.) were fueled by changes in refresh rates associated with the per capita penetration rate of devices, not structural TAM expansion. For example, during COVID, refresh cycles accelerated as the PC to human ratio increased, but Morgan Stanley & Co. LLC Erik W Woodring Equity Analyst Erik.Woodring@morganstanley.com +1 212 296-8083 Maya C Neuman Research Associate Maya.Neuman@morganstanley.com +1 212 761-1946 Dylan Liu Research Associate Dylan.Liu@morganstanley.com +1 212 761-4519 Rauf Ural Research Associate Rauf.Ural@morganstanley.com +1 212 761-5958 Dell Technologies Inc. (DELL.N, DELL UN) IT Hardware | United States of America Stock Rating Equal-weight Industry View In-Line Price target $511.00 Shr price, close (Sep 22, 2026) $548.92 Mkt cap, curr (mm) $353,356 52-Week Range $595.51-110.26 Morgan Stanley does and seeks to do business with companies covered in Morgan Stanley Research. As a result, investors should be aware that the firm may have a conflict of interest that could affect the objectivity of Morgan Stanley Research. Investors should consider Morgan Stanley Research as only a single factor in making their investment decision. For analyst certification and other important disclosures, refer to the Disclosure Section , located at the end of this report.Key Takeaways DELL believes this cycle is different than the last 8 because the underlying driver is TAM expansion, not changing refresh rates. Agentic AI will drive 87x inference token growth by 2030, requiring greater compute/storage needs, resulting in a “rising tide lifts all boats” environment. While traditional server units are declining due to server density improvements, server units will grow “exponentially” alongside a stronger CPU:GPU ratio. Component supply remains the biggest challenge for DELL, and Mr. Clarke believes shortages could persist for 5+ more years. DELL acknowledges improving infra margins, and believes the floor in pricing/ margins is shifting higher with the expanding TAM and less customer competition. September 23, 2026 05:32 AM GMT Not for redistribution without written consent of Morgan Stanley M Idea 2then busted when society reopened and that ratio normalized, leaving the PC TAM at the same size post vs. pre-COVID. The Agentic AI cycle is different - it structurally enlarges the infrastructure TAM. Specifically, Agentic AI is driving a de-coupling of cognitive output from headcount (i.e. you don’t need more people to do “more”) and creating productivity gains that can be measured in 10x, 100x, etc. From DELL’s perspective, these returns are clear and every company big and small will follow this journey. This expanding adoption of Agentic AI will lead to multi-year linear growth in Gigawatts (200 incremental GWs by 2030) and ZettaFLOPS (5x growth, to 830 by 2030), but exponential growth in inferencing tokens (i.e. cognitive intelligence) because agents require 1B more tokens per unit of work than basic chatbots. Subsequently, this growth in tokens will (1) force a rearchitecting of data centers towards accelerated compute and higher CPU:GPU ratios, and (2) catalyze greater structural demand for computational power and storage requirements. But why does this benefit DELL? Doesn’t the value of token growth accrue to the cloud? DELL believes that Agentic AI will be hybrid because enterprises will make constantly varying decisions on where to run inference workloads based on the security and affordability tradeoffs. For example, DELL leverages apps in the public cloud for content-related workloads, but would never consider moving proprietary source code or telemetry data outside of DELL’s facilities. And considering DELL estimates inference token generation will grow by 87x by 2030, “even taking a small slice of a big number creates a very big number”. Said differently, DELL believes the exponential growth in tokens consumed will create a “rising tide lifts all boats” environment, benefiting cloud players and on-premise infrastructure vendors as demand for compute and storage creates a structurally larger TAM. And while adoption of frontier models has been the primary source of token generation to date, DELL believes the growing adoption of open-weight models will help to catalyze on-prem infrastructure investments as companies optimize model outputs for cost. How will this impact traditional server demand given token growth is robust but server units are still declining Y/Y? Putting aside supply shortages for a moment, the primary reason traditional server units are declining despite exponential token growth is because servers are becoming more powerful/dense/efficient. A 17th/18th gen DELL Server is capable of replacing up to 13 14th Gen traditional servers. In the short-term, this means server units decline but ASPs will grow. But as data centers are rebuilt with accelerated compute at the core, and growing adoption of agents drives greater need for CPU servers, eventually that will lead to growth in denser server units. Mr. Clarke even noted that traditional server unit growth could become exponential if inference token output really grows by 87x over 5 years. Though the Agentic tailwind does not only accrue to servers - storage becomes a key beneficiary as KV Cache and everything an agent does (retain, artifact, etc.) creates greater demand for data storage/knowledge retention. DELL also believes that the growing demand for compute/storage will keep component supply tight for longer than most expect. Historical commodities cycles were 2-4 quarters, and typically were created by the boom/bust nature of mature hardware replacement cycles or supply decisions. In Mr. Clarke’s perspective, if you believe in the growth algorithm for gigawatts and tokens, then memory, M Idea Morgan Stanley Research 3HDDs, etc. are not in a short-term cycle. Instead, shortages could last for another half-decade. In fact, when asked what keeps Mr. Clarke up at night, his answer was not macro, geopolitical conflict, overbuilding of data centers, or power shortages; it’s supply. “We’re in neverland” is how he phrased it, and DELL is operating under the assumption that there will be a prolonged shortage of critical component supply (primarily memory/HDD) for several years to come. Speaking of supply, Mr. Clarke shared a different perspective with us on our server “margin stacking” views. As we highlighted in IT Hardware: The State of Enterprise Hardware Spending , DELL/HPE infrastructure gross margins are seeing unprecedented expansion this cycle, which we have primarily attributed to “margin stacking”, or capitalizing on inelastic demand to capture a margin on higher memory costs. Mr. Clarke acknowledged that like-for-like server/storage margins are expanding, but offered an alternative perspective. In a world where you only have a fixed number of bits, you are going to allocate your limited parts to your highest margin products. At the same time, structural growth of the infrastructure TAM means the competitive battle for the incremental customer - and the willingness to price competitively to acquire that new customer - has lessened. Why sell servers at a narrow margin to acquire a new customer when your TAM is growing and you can be more disciplined/capture a higher margin by increasing the pricing floor? This is what is leading to higher server/storage margins, which Mr. Clarke believes is structural in nature. Finally, on the trajectory of opex… DELL’s internal AI modernization efforts are in full swing, and Mr. Clarke highlighted that they are leaning into AI to get more productive/efficient in supply chain optimization, servicing customers, coding, sales, and R&D. These investments are unlike to slow anytime soon as DELL “gets tremendous benefits” from AI, which means that opex is unlikely to decline Y/Y anytime soon. However, Mr. Clarke reiterated that DELL will continue to get leverage out of opex as revenue grows faster than these investments. Bringing this altogether, what does this mean for DELL the stock? Our investor conversations make clear that both bulls and bears agree that the next 18 months of revenue and earnings growth will be extremely strong/robust for DELL, with the FY28 buyside EPS bogey now in the $40-50 range (vs. MSe = $36.47 vs. Street at $30.44). The disagreement is on the durability of this growth. A bull generally agrees with Mr. Clarke's view of the world, and is willing to ascribe a 15x P/E on FY28 EPS (or a $600-750 stock), several standard deviations above DELL’s historical valuation average. Bears believe this is another boom/bust cycle, and that far more value in AI will accrue to the cloud vs. on-prem vendors, meaning that when the inelastic demand boom turns into a bust, DELL’s earnings power will cut in half. Therefore, bears are only underwriting an 8-10x multiple on FY28 peak EPS (or a $320-500 stock). To-date, we’ve found ourselves closer to the bear than bull view, but our meeting with Mr. Clarke is causing us to re-evaluate our thesis, with a specific focus not on the potential growth of tokens, but on whether that growth will truly result in an elongated on-premise infrastructure “boom”. So while we remain EW-rated with an unchanged model and $511 PT (for now), we now underwrite a higher probability that our $756 bull case valuation plays out in the next 12 months. M Idea 4Risk Reward - Dell Technologies Inc. (DELL.N) $511.00 Our $511PT is based on a 14x P/E multiple on FY28 (CY27) EPS of $36.47. This implies a 14x P/E multiple on DELL's AI server business (in-line with AI infr astructure peers) and a 14x P/E multiple on the traditional business (~1x turn premium to traditional enterprise hardware peers given better execution and share gains). Morgan Stanley Estimates MeanConsensus Price Target Distribution $480.00 $700.00 Source: Re ﬁnitiv, Morgan Stanley Research MS RatingDespite myriad supply chain headwinds, DELL is rising to the challenge. Not only is DELL bene ﬁtting from the AI infra buildout in ways peers aren't, their supply 的新变化，最后提出 AI 革命的资产配置启示。 一、 AI 革命与以往技术革命有何不同 第一，扩散速度更快： AI 应用渗透速度显著快于历次技术革命。一般而言，一项通用技术从诞生到广泛普及往往需要数 十年。以电气革命为例，电机在美国制造业的扩散大致经历了 1880 年至 1930 年的半个世纪。无独有偶，上一轮信息技术革命期 间，无论是个人电脑还是互联网，渗透率达到 90% 都经历了大约 30 年。相比之下，本轮 AI 革命的扩散过程大幅压缩。 ChatGPT 自推出至今不到四年的时间内，在美国的渗透率已超过 40% 。 AI 在中国的扩散速度更快。截至 2025 年底，我国生成式 AI 用户规 模已超过 6 亿人，普及率达到 43% ，较上年提高 25 个百分点 1 。反映在日常生活中，三年前遇到问题，第一反应往往是打开搜索 引擎。今天，很多人已经习惯直接问 AI 。 第二，替代层次更高：工资水平越高、 AI 暴露程度越大。上一轮信息技术革命对就业的替代作用主要集中在中间层，职 业暴露度与工资的关系大致呈现 “ 倒 U 型 ” ：中等收入的白领阶层更容易被替代，而蓝领和高级白领工作受到的冲击相对有限。但 本轮 AI 革命的替代层次明显上移，高认知岗位也站到了技术替代的前沿。收入越高的职业对 AI 的暴露程度反而越高、潜在受到 的冲击可能更大。但这并不意味着这些职业会在短时间内被 AI 替代：至少在目前，人与人之间面对面的互动和交流可能激发新 的灵感和创造性的思考，仍然有其独特的价值。 第三，应用范围更广：从可贸易部门到不可贸易部门。前两次工业革命以机械化和电气化为代表，主要替代的是 “ 标准化 的体力劳动 ” ，大幅提升了农业、制造业等部门的生产率。信息革命进一步替代了 “ 常规的认知任务 ” ，提升了信息软件、商务服务 等可贸易服务业的生产率。现在，生成式 AI 正在进入 “ 非常规认知任务 ” ，更多应用于教育、医疗等本地服务业。以教育为例，信 息技术时代诞生了网课教学，但课堂互动和因材施教仍然存在局限。到了 AI 时代， AI 家教可以实时交流，根据学生的理解程度 调整教学内容。从这个角度看，过去的技术革命首先改造的是工厂和流水线，而这一次的 AI 革命改变的是不可贸易的服务业， 办公室、课堂和诊室也站到了技术革命的前沿。 归根结底， AI 既是一种 “ 通用目的技术 ” （ General-Purpose Technology ， GPT ），也是一种 “ 发明方法的发明 ” （ Invention of a Method of Invention ， IMI ）。作为通用技术， AI 能够广泛地进入生 产流程。作为 “ 发明方法的发明 ” ， AI 可以生产新的 知识，参与算法设计、数学推理和开放问题求解等以前意想不到的各个环节。 2026 年 9 月， OpenAI 宣布，其内部的 AI 系统提 出了纳维 — 斯托克斯方程存在性与光滑性问题的解法，并给出了形式化证明 2 。这是与黎曼猜想齐名的七大千禧年大奖难题之 一，已经困扰学界近百年。这意味着 AI 已经不只是帮助人类检索知识、整理信息，而是开始进入知识生产的前沿，参与解决过 去长期悬而未决的科学难题。除此以外， AI 还可以用于自身的技术迭代，支持人工智能本身的研发、训练、部署和应用（ AI for AI ），帮助开发更强的 AI ，这可能是 AI 技术指数式提升的基础。因此，本轮 AI 革命不仅扩散速度更快、替代层次更高、应用范 围更广，还可能同时提高知识生产效率与创新效率，使技术进步的速度、广度和深度都强于历次技术革命。 二、 AI 如何重塑宏观经济：增长、就业、通胀与汇率基于这些特点， AI 可能从各个维度重塑宏观经济，我们从增长、就 业、通胀和汇率等维度分别讨论。 1. 增长：投资红利率先兑现，生产率红利仍在路上。 AI 对经济增长的拉动首先反映在投资端。过去三年， AI 相关投资对 美国 GDP 增长的贡献在持续兑现。圣路易斯联储估算，美国 AI 相关的四类投资对 2025 年前三季度实际 GDP 增长的贡献合计达 到 39% 。考虑到 AI 带来的股市繁荣还会产生财富效应，拉动居民消费，对实际增长的拉动作用可能更高。 但在生产率层面， AI 技术进步尚未体现在全要素生产率（ TFP ）统计数据中。微观层面，很多人已经感受到工作效率的明 显提升。但宏观层面，全要素生产率（ TFP ）的改善却尚未充分显现。这其实符合历史的一般规律。 1987 年，诺贝尔经济学奖 得主罗伯特 · 索洛提出著名的 “ 索洛悖论 ” ： “ 计算机革命无处不在，唯独在生产率统计中看不到 ” 。为什么会出现这种现象？因为新 技术从投入使用到真正提高生产率，通常需要经历一条 “J 曲线 ” ：企业投资、引进技术后，还需要改造流程、培训员工。这些配 下载日志已记录，仅供内部参考 套投资需要时间，有些甚至难以被传统统计数据充分捕捉。因此，技术进步的红利并不会立即体现在宏观生产率数据中。电气革 命就是一个典型的例子。早期，工厂只是用电动机替代蒸汽机，仍然沿用原有的传动装置和生产布局，生产率提升相对有限。直 到企业围绕电力重新设计生产流程和工厂布局，电气化的生产率红利才逐步释放（ David ， 1990 ）。 目前，我们可能仍处于这条 J 曲线的前段。但如前文所述，本轮 AI 革命与以往技术革命的一个重要不同在于， AI 既是通 用目的技术，又是发明方法的发明，既提高生产效率，又能够参与研发和创新，成为推动自身技术进步的工具。也就是说， AI 不仅能够提高生产率，还可能提高生产率增长的速度。从这个角度讲， AI 相比以往的技术革命，生产率的提升空间从长远来看 可能更大，持续时间也可能更久，这是我们对 AI 长期增长效应保持乐观的重要原因。 2. 就业：存量整体稳定，结构上职业入口收窄，青年就业承压。从总量数据看，虽然 AI 正在向更高收入、更高认知层次 的工作任务渗透，但尚未引发就业的明显恶化。截至 2026 年 8 月，美国失业率为 4.1% ，低于 1990 年以来的中位数 5.3%3 。 为什么职业暴露度提高没有引发大规模失业？一种解释是技术对劳动力的替代存在时滞。企业从引入 AI 到真正调整用工 结构，需要经历技术适应、流程改造和组织调整，这与前面讨论的生产率 “J 曲线 ” 有一定相似之处。另一种解释是 “ 任务互补理 论 ” 。一份工作通常由多个子任务构成，其中部分子任务相对更容易被替代，但仍有一部分子任务依赖人的参与，延缓 AI 对于整 个工作的替代过程。比如在研究工作中， AI 更擅长找数据、读文献、整理材料，却未必能够替代投资者沟通、观点形成与决策 判 断。也就是说， AI 可以替代一份工作中的部分任务，但部分任务被替代，并不意味着整个岗位立刻会被替代。 没有出现大规模失业也并不意味着可以高枕无忧。 AI 对就业的冲击更多体现为结构性变化，尤其是职业入口的收窄。我 们使用美国的数据，对 AI 暴露度较高的职业按照年龄分组后发现， 22-25 岁的青年群体受到的就业冲击明显大于其他年龄组： 截至 2026 年 Q2 ， 41-49 岁的中坚组表现最优，就业指数增幅接近 10% ，而青年初级组则下跌 11.5% 。与其说企业正在大规模裁 员，不如说它们首先减少了对年轻人的招聘。对于年轻人而言，第一份工作不仅意味着收入，更是积累经验、学习技能和形成人 力资本的重要起点。一旦职业入口收窄，年轻人就可能失去早期积累人力资本的机会，甚至形成持续影响未来职业发展的 “ 疤痕 效应 ” 。日本 “ 就职冰河期世代 ” 的经验表明，青年时期遭遇的就业冲击即使在宏观失业率恢复之后，仍可能长期影响其就业率、工 资和职业发展（ Genda, Kondo and Ohta ， 2010 ； Kondo ， 2024 ）。因此，当替代发生时，企业未必需要立即裁撤已经存在的岗 位，却可以直接减少对初级人员的新增招聘。职业入口收窄、青年就业承压，可能是替代效应在总量就业转弱出现之前的领先信 号。 3. 通胀：短期看瓶颈，长期看生产率与收入分配。 AI 革命本质上是技术进步，首先改变的是生产率、产出等实际变量。在一个理想的无摩擦的经济环境中，如果价格和工 资能够灵活调整，储蓄能够顺畅转化为投资，那么生产率提升所带来的供给扩张，并不必然引发持续的总需求不足。这就是古典 经济学中萨伊定律的基本思想，可以总结为 “ 供给创造需求 ” 。它的逻辑是，生产活动在创造商品和服务供给的同时，也创造了相 应的收入和购买力。这些收入中的一部分转化为消费，没有用于消费的收入形成储蓄，储蓄在利率调节下可以转化为投资。由于 总需求等于消费加投资，所以经济始终能够出清。 但在现实当中，萨伊定律所描述的供求自动协调机制并不总是能够顺畅发挥作用，主要有四个原因：首先，萨伊定律要求 价格能够灵活调整，但现实中价格和工资往往存在粘性，不能随着生产率的变化及时调整。第二，经济主体具有前瞻性预期。当 我们预期未来技术进步会带来更高的收入时，可能今天就会增加消费和投资。第三，技术进步的红利并不会在资本和劳动之间均 匀分配，不同群体的消费倾向也存在差异。第四，现实中资源供给存在约束，某些关键投入品可能面临供给瓶颈。 正是由于这些现实因素，技术进步带来的供给扩张未必能够与需求同步调整。也就是说，技术进步虽然首先改变的是实际 变量，但也会通过不同渠道影响通胀等名义变量。 基于上述四方面因素，我们进一步归纳出技术进步影响通胀的四种效应。一是供给效应（去通胀）。生产率提高后，企业 的供给能力增强，单位生产成本下降。但由于存在工资与价格粘性，需求未必能够同步增长，当供给扩张快于需求增长时，就可 能形成负向产出缺口，带来去通胀压力。二是预期效应（推升通胀）。如果市场高度看好未来的技术红利，就可能将部分投资和 消费前置，使未来的技术红利转化为当期需求，推升当期物价。三是替代效应（去通胀）。技术替代劳动，使收入更多向资本端 集中。由于资本所有者的边际消费倾向通常低于劳动者，收入分配的变化可能削弱总需求，从而形成中长期的去通胀压力。四是 瓶颈效应（推升通胀）。当算力、电力、存储等关键投入品的供给难以同步扩张时，就会出现局部供需失衡，推高相关产品和服 务的价格。如果这些成本进一步向下游传导，还可能对整体物价形成上行压力。回顾历史，技术革命往往伴随着关键投入品的供 给瓶颈。铁路建设带动了对铁的需求，电气革命带动了对铜的需求，上一轮信息技术革命也曾出现存储芯片供不应求的情况。这 一次 AI 革命同样如此，而且由于技术扩散速度更快，部分关键投入品的价格上涨更为剧烈。 2025 年以来，部分消费类 DRAM 和 NAND 价格自低点累计上涨超过 600% 。 下载日志已记录，仅供内部参考 这四种力量对通胀的影响方向不同，也不会在同一阶段以相同强度出现。所以， AI 究竟带来通胀还是通缩，取决于这四 种力量在不同阶段的相对强弱。综合各种力量的净效应，我们得出以下两点结论。 第一，短期瓶颈效应可能占主导，带来一定通胀压力。当前， AI 带来的生产率红利可能仍处于 “J 曲线 ” 的前段，尚未充分 释放，供给效应的去通胀作用也没有完全兑现。但在预期效应下，企业已经大幅增加 AI 资本开支，对算力、电力和存储等关键 投入品形成了强劲需求。与此同时，算力、电力和存储等关键投入仍受到瓶颈效应下的供给约束。需求先于供给扩张，短期更容 易形成通胀压力。但这个过程可能不会持续太久。回顾历史，从铁路革命时期的铁，到电力革命时期的铜，再到 IT 革命时期的 存储，关键投入品的瓶颈往往持续 3-5 年。随着资本开支逐步转化为新增的产能，投资品供给改善，瓶颈效应往往逐渐消退。另 外需要强调的一点是，供给瓶颈可能使某些关键投入品的价格大幅上涨，但其整体宏观效应往往相对有限。因为上游企业通过涨 价获得更高利润的同时，也会增加下游企业的成本，挤压其利润和需求。因此，局部的价格上涨，并不必然转化为同等幅度的整 体通胀压力。本轮 AI 革命经过快速扩散，部分关键投入品的瓶颈效应可能正在逐步筑顶。尽管某些环节仍然存在供给约束，价 格也可能继续上涨，但瓶颈效应进一步强化的速度可能已经放缓。随着新增产能逐步释放，供需矛盾有望缓解，瓶颈效应可能逐 步消退。 第二，中长期去通胀力量可能比以往技术革命更强，尤其要关注替代效应。前面我们分析了本轮 AI 革命与以往技术革命 的不同：扩散速度更快、应用范围更广、替代层次更高。这意味着， AI 不仅能够提高生产效率，还可能通过就业、劳动收入和 收入分配，对总需求产生更加深刻的影响。当前， AI 革命的替代效应已经开始显现。美国非农商业部门的劳动收入份额在战后 相当长一段时期内大致维持在 60%—66% 的水平，进入 21 世纪后总体呈下降趋势。尤其是 2021 年以来，劳动收入份额进一步下 行， 2026 年第二季度降至约 53% ，创 1947 年有记录以来的最低水平。 劳动收入份额下降意味着在总体经济产出中，更多收入向资本端集中。前文提到，资本所有者的边际消费倾向通常低于劳 动者。如果技术进步的红利更多向资本端集中，而没有充分转化为劳动收入，那么即使生产率不断提高，总需求也可能受到收入 分配的约束，从而在中长期形成持续的去通胀压力。 综合来看，我们对 AI 革命如何影响通胀的判断并非静态，而是一条随着技术扩散不断变化的路径。早期，瓶颈效应可能 占主导，带来一定的通胀压力。中长期，随着供给能力提升，生产率红利逐步释放，以及替代效应增强，去通胀力量可能逐步占 上风。因此，短期看瓶颈，长期看生产率，尤其要看收入分配。 4. 汇率：生产率的赢家，未必是汇率的赢家 历史上，一个国家如果在技术进步中取得领先，往往伴随着本币实际汇率升值。在开放宏观经济学中，这可以用 “ 巴拉萨 — 萨缪尔森效应 ” （ Balassa-Samuelson Effect ）来解释。其逻辑是，过去的技术进步主要发生在制造业等可贸易部门。随着可贸 易部门生产率提高，产出和工资水平随之上升。由于劳动力可以在可贸易和不可贸易部门之间流动，服务业等不可贸易部门的工 资也会相应提高。但这些部门的生产率未必同步改善，工资上涨就会推高本地服务价格，进而带动本国相对物价上升，推动实际 汇率升值。这种实际汇率升值，既可能体现为本国物价相对国外上涨，也可能体现为本币名义汇率升值。举一个通俗的例子。同 样是一位理发师，在北京理发，和在江西理发，一个小时能剪的头发可能差不多，但在北京获得的报酬往往更高。因为北京其他 部门的生产率和工资水平更高，也带动了本地服务业的工资和价格上涨。放在国家之间，道理也是一样的。 但本轮 AI 革命，可能正在改变这一传统逻辑。过去，生产率提升主要集中在制造业等可贸易部门；这一次， AI 开始广泛 进入教育、医疗、配送等不可贸易服务业。这些服务主要在本地提供，难以像工业 品一样大规模出口。当技术进步更多发生 在这些部门时，效率改善就可能更多转化为成本和价格下降，而不是通过出口扩张带动工资和本地物价上涨。这就可能形成与传 统巴拉萨 — 萨缪尔森效应相反的机制，本文把它称为 “ 逆巴萨效应 ”—— 生产率在提高，汇率却未必同步升值。以外卖配送服务为 例，过去几年间，配送算法不断优化，骑手的配送效率也在提高。但外卖服务本身无法出口，效率提高更多体现为配送时间缩 短、配送成本下降，或者消费者支付的价格下降，从而削弱实际汇率升值的动力。 这引申出一个问题：中美两国都在广泛应用 AI ，如果美国的技术进步更快，是否会加大人民币升值压力？首先需要强调的 是，人民币是强势货币而非弱势货币。但强势货币不等于无限升值， AI 革命有可能降低人民币实际汇率升值的天花板。这里需 要考虑中美两国的两个差异。 第一个差异是中美两国 AI 高暴露行业的可贸易程度不同。中国的 AI 高暴露行业集中于教育、批发零售、餐饮等不可贸易 部门；美国则集中于金融、保险、科研和专业技术服务等行业，可贸易性相对更强。对于不可贸易部门而言，效率改善可能更多 体现为成本和价格下降，而不是通过出口扩张推动实际汇率升值。 下载日志已记录，仅供内部参考 第二个差异源自中美两国 AI 高暴露行业的市场竞争结构不同。中国部分 AI 高暴露行业受到价格约束，或是市场竞争较为 充分，技术进步的效率红利向终端价格传导，更多体现为降价。相比之下，美国部分高暴露行业的垄断地位相对更强，具有更强 的定价能力，成本下降就可能更多转化为企业利润的增长。 因此，在逆巴萨效应下，我们可能第一次看到生产率的赢家未必仍是汇率的赢家，这是本轮 AI 革命可能带来的一个重要 变化。 三、 AI 如何重塑市场逻辑 前面我们讨论了 AI 对增长、就业、通胀和汇率的影响。那么，这些宏观经济的变化，最终会如何传导至资产价格？哪些 我们熟悉的市场规律，可能正在发生变化？我们把它总结为四个 “ 脱钩 ” 。 1. 股票与汇率 “ 脱钩 ” ：股票强未必汇率强。 一般认为一个国家的资本市场表现强劲，通常伴随着本币升值。但 AI 革命下，汇率和股市的相关性可能下降。以美国为 例。 2025 年以来，全球货币秩序继续重构，美元信用受到一定挑战，但美股依然表现强劲。其背后，一个重要的支撑是 AI 产业 趋势持续强化，科技企业盈利预期不断改善，美股七巨头 2026 年一、二季度盈利同比增速分别为 63% 和 119% 。美元走弱并未成 为美股上涨的必然约束。 同样的逻辑也适用于中国。前面我们讨论了 AI 可能通过 “ 逆巴萨效应 ” 降低人民币升值的天花板，但也未必妨碍中国科技资 产走强。 2. 估值与利率 “ 脱钩 ” ：高利率不意味着低估值。 传统估值框架认为，无风险利率上升会推高折现率，从而对股票估值形成压制。但这一轮 AI 革命，使我们需要重新审视 利率与估值之间的关系。 2026 年 9 月， 10 年期美债收益率一度突破 5% ，但美股科技龙头仍然维持着较高的估值水平，对高利 率的承受能力明显提升。 AI 革命可能改变企业长期增长前景和竞争格局，使市场愿意为具有持续竞争优势的科技企业支付更高 的估值溢价。 3. AI 龙头企业与其他企业 “ 脱钩 ” ：科技巨头明显上涨，其他股票明显跑输，股市集中度上升。 本轮 AI 革命的另一个重要特征是 AI 头部企业与其他企业的市场表现明显分化。以 2022 年 11 月 30 日 ChatGPT 发布为起 点，美国 “ 科技七姐妹 ” 累计上涨约 300% ，而剔除七姐妹后的标普 500 指数累计涨幅仅为 65% 。这反映了 AI 时代的 “ 马太效应 ” ： 技术在快速扩散，而利润却高度集中。 AI 虽然可以 被越来越多的企业采用，但并不是所有企业都能够跨越技术壁垒以及数 据和分发渠道壁垒。头部企业不仅有能力承担大规模前期投入，还可能凭借已有的技术积累和市场地位，率先把 AI 转化为产 品、盈利和现金流，享受到更多的技术红利。 4. 企业盈利与工资收入 “ 脱钩 ” ：企业利润增长快于劳动报酬。 与上一轮信息技术革命相比，本轮 AI 革命呈现出一个值得关注的现象：企业对技术投资和未来增长的预期较为积极，但 消费者信心并没有同步改善，表现为费城联储的未来资本开支扩散指数走高，而消费者信心指数持续走低（。 AI 提高了企业的 生产效率，但由此产生的收益，未必能够同步转化为工资增长和居民购买力。 四、 AI 革命下的资产配置 总体判断上，我们认为本轮 AI 驱动的行情尚未结束，仍然看好 AI 相关股票的中长期机会，但市场的核心矛盾正在发生变 化：从科技股是否有行情，转向哪些科技企业能够真正兑现盈利，从普涨逐步走向分化。随着 AI 技术不断扩散，市场定价将更 加重视真实的效率提升、盈利改善和竞争壁垒。仅仅应用 AI 已经不足以构成竞争优势，关键在于企业能否将技术进步转化为持续 的利润和现金流。因此，投资逻辑也需要从过去偏重自上而下的产业趋势判断，转向更加重视自下而上的精选个股，寻找真正能 够赚取技术红利的企业。 资产配置上，我们继续看好中美科技股票，尤其是具有较高技术、资本和渠道壁垒的龙头企业，兼顾景气度较高的创新 药、电网设备和部分供需格局改善的周期行业。同时，考虑到 AI 盈利兑现仍存在不确定性，叠加海外利率高位运行和政策预期 波动，我们建议以现金流稳定、分红可持续的红利板块作为组合底仓，增强组合应对不确定性的能力。对于美元和美债，我们的 下载日志已记录，仅供内部参考 判断相对谨慎。全球货币秩序正在重构，美债作为全球安全资产的共识有所松动。 AI 革命虽然能够提高美国的生产率，但技术 红利更多向资本端集中，可能加剧收入分配矛盾，使生产率提升难以充分转化为居民收入和消费增长，进而增加财政政策稳增长 和再分配的压力。叠加美国原有的财政赤字和债务问题，如果经济增长持续依赖债务融资，投资者可能要求更高的风险补偿，美 元信用与美债的安全资产地位也将面临进一步挑战。尤其对于长期美债，财政融资需求上升、通胀前景不确定性以及美联储政策 公信力面临的挑战，都可能推高期限溢价。因此，我们倾向于低配长端美债。 布局节奏上，短期关注供给瓶颈，中长期聚焦生产率兑现与竞争壁垒。当前， AI 资本开支持续扩张，算力、电力等关键 投入品的供给仍然偏紧，相关环节可能继续获得瓶颈溢价。但随着新增产能逐步释放，供需矛盾有望缓解，瓶颈溢价也可能逐渐 收敛。中长期，市场定价的重心或从资本开支扩张转向生产率红利兑现。届时，真正重要的不是企业投入了多少资金，而是这些 投入能够创造多少收益。能够持续降本增效、将技术进步转化为盈利和现金流，并形成难以复制的竞争壁垒的企业，才更有可能 持续受益于本轮技术革命。 未来，我们认为需要持续关注三个核心变量：一是 AI 产业自身的技术进展，包括技术能力能否持续提升、应用场景能否 进一步拓展，以及生产率红利能否真正兑现。二是美联储政策与全球流动性。随着美联储前瞻指引的作用有所弱化，政策路径和 通胀前景的不确定性可能进一步影响美债期限溢价，进而传导至全球资产定价。三是中国政策的力度和节奏，以及经济数据的实 际表现。 AI 革命提供了新的增长动力，但技术进步能否转化为更广泛的经济增长和企业盈利，仍然取决于宏观政策与经济基本 面的配合。 下载日志已记录，仅供内部参考", "status": "extracted"}, "post:2026-09-23T12-28:a973a18bcfef": {"id": "post:2026-09-23T12-28:a973a18bcfef", "kind": "post", "title": "2026-09-23 12:28", "source_label": "帖子正文", "excerpt": "【招商机械】持续看好日联科技：菲莱收购持续推进，受益光扩产+产线自动化+国产替代三重beta 行业层面，受益光扩产+产线自动化+国产替代，设备供不应求。●#光模块设备供不应求：国内外光模块厂持续扩产，#短期设备需求高增长确定性强，核心驱动力是800G向1.6T升级+产线自动化率提升+国产设备导入，中", "content": "【招商机械】持续看好日联科技：菲莱收购持续推进，受益光扩产+产线自动化+国产替代三重beta 行业层面，受益光扩产+产线自动化+国产替代，设备供不应求。 ●#光模块设备供不应求：国内外光模块厂持续扩产，#短期设备需求高增长确定性强，核心驱动力是800G向1.6T升级+产线自动化率提升+国产设备导入，中期NPO需求逐步释放，长期CPO成为重要方向，催生新技术新设备需求。 ● #国产替代加速演绎：海外设备存在价格高、交期长（25周+）、产能供应不足的问题，国产设备在贴片、耦合、测试等领域技术已接近海外头部厂商水平，且价格比海外低20-30%，交期仅12-16周，同时具备售后响应快的优势，国产替代加速进行。 公司层面，收购菲莱测试，进军光模块领域打开成长空间。 ●菲莱是国内光模块老化测试设备第一梯队供应 24层及以上产品研发和打样工作按期推进，有望持续受益于高端载板需求增长及国产替代。 PCB载板化趋势来看，当前光模块MSAP产能及技术能力为公司为国内头部之一，公司在ABF载板积累的SAP工艺或于 AI PCB领域放大优势。AI PCB需求方面，从AMD明年Cowos量及机柜内PCB价值量来看，AMD对AI PCB需求可观，公司深耕AMD链，有望获得较大份额。 风险提示：下游需求不及预期，客户进展不及预期#文字观点", "publish_time": "2026-09-23 11:17", "tags": ["文字观点"]}, "post:2026-09-23T08-00:20f946974c8b": {"id": "post:2026-09-23T08-00:20f946974c8b", "kind": "post", "title": "2026-09-23 08:00", "source_label": "帖子正文", "excerpt": "摩根大通 —— 中国房地产：国庆前将推出房贷补贴？🔍核心结论：近几个交易日，中国地产开发公司板块大幅上涨，由融创等困境公司领涨 —— 此类高贝塔标的历来是政策博弈的代理变量。", "content": "摩根大通 —— 中国房地产：国庆前将推出房贷补贴？🔍核心结论：近几个交易日，中国地产开发公司板块大幅上涨，由融创等困境公司领涨 —— 此类高贝塔标的历来是政策博弈的代理变量。 📈市场兴奋情绪源于国庆（10 月 1 日）前中国当局可能宣布全国性房贷补贴新政的传闻。 🔁回溯 2025 年 11‑12 月，市场曾有类似传闻并驱动短期脉冲式反弹，但最终并无实质政策落地。 🤔摩根大通虽无法核实当前传闻真伪，但认为该政策方向具备可行性 —— 事实上上海等多地已在地方层面推出类似措施；然而政策效果能否实质化，关键取决于补贴规模与执行细节，尤其是补贴上限的设定。 💡例如，1 个百分点的房贷利率补贴可将有效利率从 3.05% 降至 2.05%（表面看颇具吸引力），但若参照当前地方实践，补贴上限仅为每套 2 万‑5 万元人民币（非年度额度），则实际影响极为有限。 🏠以 500 万元贷款在上海购房为例，1 个百分点补贴叠加 5 万元上限，仅相当于约 4 个月的利息节省。 📊摩根大通预计，在国庆窗口前，板块将因政策预期维持韧性（历史规律显示，即便无最新传闻，板块在 9 月末潜在政策窗口期前夕通常跑赢大盘）；然而，若届时无政策宣布（或政策力度不及预期），板块将面临新一轮抛售。 ✅首选标的维持华润万象生活、华润置地及贝壳（Daniel Chen 覆盖）。 ⚠️反弹中建议减持困境公司。 📋一、地方层面房贷补贴现状：利率降幅可观但上限构成硬约束。 📑过去数年，上海、广州等多城市已推出多种形式的房贷补贴。 📌典型方案为房贷利率下调约 1 个百分点，或利息支出补贴约 30%，有效房贷利率从 3.05% 降至约 2.05%。 🔎但普遍设有补贴上限，通常为每套 2 万‑5 万元（注意：非年度额度）。 📎例如，2026 年 8 月上海宣布对外环外购房给予 1 个百分点房贷补贴（每套上限 5 万元），但补贴资金池仅 2 亿元，意味着仅约 4000 套住房（约占年度一手交易量的 4%）可受益。 🧮二、政策可行性分析：三种情景测算。 1️⃣全部存量房贷：截至 2026 年 6 月，存量余额 38 万亿元，1 个百分点补贴对应年度财政支出 3810 亿元，占政府财政支出的 1.3%。但摩根大通认为，此举更多提振消费（占零售额的 0.8%），而非刺激房地产市场。 2️⃣全部房屋销售（一手 + 二手）：假设首付比例 70%，1 个百分点补贴对应年度支出约 900 亿元。 3️⃣仅新建 / 一手住房（最可能情景）：假设首付比例 70%，1 个百分点补贴需 440 亿元。 📌上述测算均为年度口径，但实际中摩根大通质疑政府是否会补贴整个贷款期限。 🔍如前述，地方实践通常设每套上限或限定有效期（如 1‑3 年）。 🏠以上海 500 万元贷款购房为例，1 个百分点补贴叠加 5 万元上限仅相当于约 4 个月利息节省，而非 30 年贷款全周期。 📊若将补贴提至 2 个百分点（或上限提至 10 万元），则对应约 8 个月利息节省。 📎目前地方最高上限为每套 5 万元（上海、苏州），最低仅每套 2000 元（南充）。 🔮三、其他潜在政策方向。 📌全国层面，除房贷补贴外，摩根大通认为可能的政策方向包括：（1）放宽土地款支付条件（如允许延期 / 分期支付），以缓解 \"828\" 政策影响（详见前期报告）；（2）提高房贷借款人的个人所得税抵扣额度；（3）降低房屋交易相关税费。 📍地方层面，继北京、上海之后，深圳可能成为下一个推出类似宽松政策的城市。 📈四、估值与选股框架。 📊摩根大通覆盖的中国地产板块估值分化显著。 ✅首选推荐： ・📌华润万象生活（1209.HK）：评级增持，目标价 49.00 港元，最新收盘 37.88 港元，2027 年预期市盈率 15.7 倍，股息率 5.9%。 ・📌华润置地（1109.HK）：评级增持，目标价 40.00 港元，最新收盘 29.18 港元，2026 年预期市盈率 9.3 倍，股息率 4.0%。 ・📌贝壳（BEKE）：评级增持，目标价 23.00 美元，最新收盘 16.28 美元。 ⚠️困境公司中，融创中国（1918.HK）评级减持，目标价 0.30 港元，最新收盘 0.69 港元；万科公司（2202.HK）评级减持，目标价 1.60 港元，最新收盘 2.47 港元。 📊板块整体 2026 年预期市盈率 9.2 倍，市净率 0.4 倍，年初至今回报‑6%，较峰值回撤 49%。 💡五、交易策略与风险提示。 📌短期板块受政策预期支撑，但国庆窗口后若无实质政策或力度不及预期，回调风险高。 ⚠️反弹中建议减持高贝塔困境标的，聚焦财务稳健的央企开发公司及物管龙头。 🚨风险包括：政策落空、补贴规模不及预期、销售复苏持续性不足。#文字观点", "publish_time": "2026-09-23 08:00", "tags": ["文字观点"]}, "post:2026-09-23T07-58:917595c27975": {"id": "post:2026-09-23T07-58:917595c27975", "kind": "post", "title": "2026-09-23 07:58", "source_label": "帖子正文", "excerpt": "瑞银 —— 中国储能行业：专家电话会要点 —— 短期逆风，但 2027 年有望迎来反弹📌核心结论：瑞银发布中国电池储能系统（BESS）行业专家电话会纪要（First Read）。专家对 2026 年需求持谨慎态度，主因成本上升及并网瓶颈，但对 2027 年需求整体乐观。", "content": "瑞银 —— 中国储能行业：专家电话会要点 —— 短期逆风，但 2027 年有望迎来反弹📌核心结论：瑞银发布中国电池储能系统（BESS）行业专家电话会纪要（First Read）。专家对 2026 年需求持谨慎态度，主因成本上升及并网瓶颈，但对 2027 年需求整体乐观。2026 年前 8 个月（8M26）国内储能项目招标量达 413GWh（同比 + 52%）与实际装机量仅 77GWh（同比 + 2%）之间的严重错配，主要源于并网延迟、成本高企导致的项目取消及政策不确定性。然而，专家预计系统运行费用下调、容量电价机制细化及辅助服务补偿改善等政策优化，将提升项目回报能见度，驱动 2026 年四季度至 2027 年的需求复苏。瑞银认为，政策确定性增强与成本下降共同支撑装机反弹逻辑。 📊一、招标与装机严重错配：并网延迟与成本压力是主因。 📌2026 年 1—8 月，中国储能项目招标量同比大增 52% 至 413GWh，但同期装机量仅同比微增 2% 至 77GWh，两者出现显著背离。专家将这一错配归因于三方面：1）并网审批与电网接入延迟导致项目转化周期拉长；2）系统成本上升（碳酸锂价格波动及系统集成费用增加）使部分项目经济性跌破阈值，引发取消或延期；3）容量电价、辅助服务补偿等政策细则尚未完全落地，开发商观望情绪浓厚。专家强调，随着政策不确定性逐步消除，被压抑的装机需求有望在 2026 年四季度起集中释放，并在 2027 年形成装机高峰。 ⚖️二、政策顺风：容量电价细化与辅助服务市场扩容。 📌专家预计多项关键政策变化将成为明年需求改善的核心驱动力： 📌1. 容量电价机制：已出台容量电价的省份（如山东、山西等）有望进一步细化执行细则，其他省份（尤其是新能源渗透率较高、现货市场成熟且独立储能装机规模较大的省份）预计将陆续跟进。长时储能项目因可利用小时数提升及容量补偿覆盖更充分，其项目回报率改善幅度将更为显著。 📌2. 辅助服务市场：二次调频市场的进一步发育将为储能项目提供额外收益弹性。二次调频收入对出清价格及实际调节里程高度敏感，各省价格下限为 0—1 元 / MW，上限为 15 元 / MW。在当前容量电价及碳酸锂 15 万元 / 吨的假设下，专家估算广东、内蒙古及山西的项目内部收益率（IRR）可达 15% 以上，甘肃与宁夏为 8—9%，其余省份回报相对较低。 💰三、系统运行费用下调：IRR 反弹的关键变量。 📌系统运行费用（含并网服务费、调度管理费等）是影响储能项目回报的核心扣减项。2026 年前三季度（9M26），该费用均值已升至 0.068 元 /kWh，同比激增 93%，部分省份远高于此水平，严重侵蚀项目利润。专家认为，为避免双重收费（即在发电侧与用户侧重复计列），系统运行费用存在下调空间，这将是明年回报率反弹的关键催化剂。以山西一座典型的 200MW/400MWh 项目为例：系统运行费用每下调 0.1 元 /kWh，可节省约 1,500 万元成本，相当于项目总收入的约 25%，同时提升 IRR 约 3 个百分点。费用下调的实施时间最早可能在 2026 年底。 📈四、招标转化加速：6—12 个月交付周期驱动 2026Q4—2027 装机放量。 📌考虑到从项目招标到实际装机的标准转化周期为 6—12 个月，2026 年上半年及年中集中释放的大量招标订单预计将从 2026 年四季度起逐步兑现为装机量，并在 2027 年达到转化高峰。此外，随着新能源参与市场化交易的比例持续提升，峰谷电价差有望进一步扩大，为储能项目带来更丰厚的套利收益，增强项目经济性的同时加速开发商投资决策。 ⚠️五、投资含义与风险框架。 📌主要下行风险：1）装机增速慢于预期；2）欧美地缘政治风险导致中国储能公司海外拓展受阻。 📌主要上行风险：1）装机增速快于预期；2）中国储能公司在海外市场市占率提升。 📌瑞银维持对中国储能行业的覆盖与关注，认为短期逆风不改中长期增长趋势，政策催化与成本下行将共同构筑 2027 年需求反弹的基础。#文字观点", "publish_time": "2026-09-23 07:58", "tags": ["文字观点"]}, "post:2026-09-23T11-17:8d03d264395c": {"id": "post:2026-09-23T11-17:8d03d264395c", "kind": "post", "title": "2026-09-23 11:17", "source_label": "帖子正文", "excerpt": "【个股观点】岚图汽车：梦想家9正式上市：41.99万元起，旗舰MPV，插混/纯电双动力，搭载华为乾崑ADS 59月22日，岚图梦想家9正式上市，售价41.99万—52.99万元。新车定位“新时代旗舰MPV”，推出Ultra、Ultra+、礼尊三个版本，均提供PHEV插混与EV纯电两种动力，兼顾高端家", "content": "【个股观点】岚图汽车：梦想家9正式上市：41.99万元起，旗舰MPV，插混/纯电双动力，搭载华为乾崑ADS 59月22日，岚图梦想家9正式上市，售价41.99万—52.99万元。新车定位“新时代旗舰MPV”，推出Ultra、Ultra+、礼尊三个版本，均提供PHEV插混与EV纯电两种动力，兼顾高端家庭出行与商务接待需求。 📏尺寸&竞品：岚图梦想家9车长约5.33m，轴距3200mm，定位中大型旗舰MPV，主打商务接待与高端家庭出行，重点强化二排舒适性、空间灵活性及智能化体验。核心竞品主要为40万—50万元级、兼顾商务接待与家庭出行的高端新能源MPV，主要包括智界V9等。 🚗动力&续航：新车采用800V高压平台。PHEV版搭载65kWh电池，CLTC纯电续航340km，支持5C超充；EV版搭载120kWh电池，CLTC纯电续航701km，覆盖日常通勤与长途出行需求。 🕹内外饰&舒适性：外观采用大尺寸直瀑格栅，提供HUAWEI XPIXEL双百万像素全彩智慧大灯；座舱融入枫木嵌铝饰板、水晶按键及左右分布式全景天幕。二排礼宾级零重力座椅集成旋转、横滑、零重力模式与机械按摩功能，可切换对坐会客、观景、母婴陪伴及大床等“一舱八境”布局。舒适配置包括13L双门冷暖冰箱、35扬声器音响及可拆卸扶手控制屏，并提供智能调光隐私玻璃。定价&权益：Ultra版插混/纯电分别为41.99/42.99万元，Ultra+版分别为45.99/46.99万元，礼尊版分别为51.99/52.99万元。ADS 5高阶功能包首销期售价1.5万元；限时赠送双旋转零重力座椅及21.4英寸二排吸顶屏。 💡技术亮点： 1）华为辅助驾驶：全系搭载华为乾崑ADS 5，搭载CAS 5.0全维防碰撞系统，采用L3级架构设计。 2）虎踞智能底盘：配备三腔空气悬架、双阀EDC及双向10°后轮转向，通过VMC协同控制动力、制动、转向与悬架，兼顾舒适性与操控灵活性。 3）鸿蒙智能座舱：搭载HarmonySpace 6及AI Agent，配备双15.6英寸华为车载智慧屏，支持语音分区控制与多终端交互。 4）全维安全防护：采用2200MPa超高强度热成形钢，配备11个安全气囊及零重力坐姿专属防护。中信建投汽车 程似骐/陶亦然/胡天贶#文字观点", "publish_time": "2026-09-23 11:17", "tags": ["文字观点"]}, "attachment:files/长城证券-均普智能(688306)全 产品，目前处于稳步上升阶段，且各客户的订单占比已经固定，可以根据分配的额度较准确地推算出其出货量或需求。 展望2027年，产能预计将以每月1000片的速度继续增长，但明年将出现一个关键的转折点：S类产品的需求量会下降，而 L类产品的需求量将上升。这主要是因为 L 类产品的工艺发展已接近量产时间节点。届时，封测端会将一部分 S 类产线转换为 L 类产线。 具体而言，S 类产能在2027年第二至第三季度间达到峰值后会逐渐回落，最终稳定在与当前相似的每月8000-9000片的水平，并不会像市场预测的那样持续翻倍增长。 与此同时，L 类产品的产能将显著提升。目前 L 类产品的月供货量中寒武纪的订单占比较多。盛合公司已为寒武纪、华为等在2027年三四月份预留了几千片的 L 类月产能规划。这表明未来的发展趋势是将部分 S 类产能转向 L 类。 4、请确认并梳理一下盛合公司 S 类和 L 类产品具体的产能数据及未来的增长规划？ 当前基准时间：2026年9月 当前月产能：S类产品为7500片，L类产品为2000片。 2026年年底目标： S类产品月产能目标：12000片 L类产品月产能：3000多片，不足4000片 S+L总月产能合计：15000多片 2027年产能变化： a. S类产品达到15000-16000片/月的产能峰值后，预计第三、四季度开始回落，最终稳定在8000-9000片/月。下降的产能将逐步转移给L类产品。 b. L 类产品产能爬坡需要时间：即使分配4000片的产能，当月实际可能仅产出几百片，需要3-4个月才能接近目标；L类产品2027年月增长量达不到1000片。 c. 2027年底 S+L 总月产能预计2万片出头。 5、考虑到国内 AI 芯片的整体需求，预计 2027 年先进封装产能是否会实现翻倍增长？同时，其他中小封装厂进入 CoWoS-S 和 CoWoS-L 市场，能否对盛合晶微等头部厂商形成有效补充？ 预计2027年国内先进封装产能无法实现翻倍增长。 需求端： 海光、沐曦等小头部客户虽然有一定体量，但其增速和占比远不及华为等主要客户，且其产品多处于试错或实验室研发阶段，旨在开发差异化产品，避免同质化竞争。这些小头部客户的产品导入周期至少需要六个月，且在同质化产品上不具备价格优势，利润空间有限。 供给端： 盛合晶微已占据头部客户约70%-80%的CoWoS类封装份额。 a. 长电科技主要承接研发类需求产品； b. 通富微电约85%-90%的订单来自海外AMD，其宣称将在2027年内收回2.5D或CoWoS类产线投资，但业务主要集中在CoWoS前期CP测试及后道测试等部分工序代工，并非全流程服务； c. 其余厂商技术相对落后。 因此，尽管头部厂商预留产能兑现概率较高，但整体供给侧2027年不会出现特别快速的增长。 6、国内封测厂在先进封装领域实现大规模放量的核心瓶颈是什么？ 国内封测厂放量的核心瓶颈分为外部因素与内部因素两方面。 外部因素 上游晶圆厂的放片速率； 芯片设计公司客户的研发进度和工艺整合完整度。 晶圆供应本身压力有限，封测厂接收的晶圆一般为数月前生产。真正关键问题：芯片设计公司对封测流程信心不足、良率缺少稳妥方案。单片晶圆价值高昂，若一片晶圆仅产出十几至二三十个成品，成本会急剧抬升，产生巨额资金损失。 内部因素 涉及产线建设完整度与放量水平，包括新增产线建设周期、设备机台约束。 新增产线预计2027年6月可上线跑量，CoWoS-S转向CoWoS-L的产线改造节点相对稳妥；国产替代设备不存在障碍，关键海外机台已提前预订。 新成立企业的难点：海外机台交付周期长达一年以上，还需要订购易损备件，拉长准备周期；海外设备厂商服务响应弱于国内，故障只能依靠更换备件，影响生产效率。 7、如何展望未来先进封装服务的价格趋势，特别是盛合晶微为华为、寒武纪等主要客户提供的服务价格？ 未来的价格趋势判断需基于当前的价格水平。目前，不同客户的定价标准存在差异。 华为： 价格不受市场波动影响，诸如月度涨幅、插队费等，双方协商锁定固定价格。 其余商业客户： 跟随市场上行，封测价格平均每月上涨30%-35%；小头部客户如果要锁定产能、加急排产，需要额外支付插队/加急费用。 CoWoS-L 价格显著高于 CoWoS-S：举例，若 S 类5万元/片，则 L 类至少6万元/片。当前 L 类高价属于非正常阶段，后续具备降价空间，原因有两点： 当前 L 良率不稳定，封测厂收取高价，但不承担良率偏低带来的客户芯片成本损失，与良率已经成熟稳定的 S 类不同； 当前 L 类光刻沿用 S 类涂胶-曝光-显影工艺，没有采用无掩模直写光刻；后续技术成熟、良率提升，成本与价格有望下行。 8、目前国内不同厂商的 S 和 L 产品价格差异有多大？是否存在某些厂商通过不包含特定费用来提供更低报价的情况？ 国内各厂商 S、L 产品直接报价差距一般仅几千元。部分厂商低价报价，往往未包含机台调试、人工、加急、耗材损耗等成本，把全部成本纳入核算后，整体实际总成本差距不大。 盛合晶微的竞争优势：部分核心流程完全自研，不采购半成品做简单加工；同时布局光刻胶原材料研发，现阶段仍采购日系产品，未来国产替代落地后可进一步压缩成本。 9、展望明年（2027年），S 和 L 产品的价格趋势将如何演变？ CoWoS-S： 价格走向稳定，当下加急订单附加额外费用的现象将消失；市场重心向 L 产品转移。 CoWoS-L： 将成为价格层面的核心变量。 降价仅针对提前半年至一年给出订单预测的头部大客户； 新导入的中小客户，产品稳定性、订单可预测性弱，会消耗更多机台工时与耗材，价格维持当前高位，要实现价格回归常态，需要稳定量产2-3年。 参考比价关系：S 类正常价格约为 L 类价格下调35%。 10、在先进封装领域，采用国产光刻胶替代能带来多大的降本空间？国内哪些厂商的光刻胶产品表现较好？ 光刻胶成本影响主要集中在 S 工艺版本的 L 产品。当 L 产品产量达到 S 的量级，工艺会改用新设备替代光刻胶，即 DY 直写光刻设备，省去研磨、涂胶、光刻、显影整套工序，不再需要多套光刻掩模版，单产品需要7-15块掩模版，掩模版是一笔可观成本。 DY 设备采购成本由封测厂和客户共同分摊，该设备也可以帮客户省去新产品研发阶段的掩模版支出。因此 DY 设备会在 L 方案中替代光刻胶的使用。 即便国产光刻胶实现进口替代并导入量产，更多是改善封测厂商自身利润，不会大幅压低 S 类成熟方案对外报价。 11、从 S 工艺过渡到 L 工艺，行业的毛利率将呈现怎样的变化趋势？ CoWoS-S 毛利率： 当前水平已经趋于稳定；规模上移会带动毛利率小幅抬升；预计2027年中期到达稳态，不会为抢夺客户、引导转向 L 工艺而出现大幅降价。 CoWoS-L 毛利率： 中长期持续向上。驱动因素： L 工艺技术壁垒更高，客户需求刚性；导入前期部分风险与成本由客户承担。 DY 等新设备导入，设备采购成本客户共担；进入量产后大量耗材被省去，直接抬升毛利水平。#文字观点", "publish_time": "2026-09-23 10:12", "tags": ["文字观点"]}, "post:2026-09-23T12-46:bf60f023fe57": {"id": "post:2026-09-23T12-46:bf60f023fe57", "kind": "post", "title": "2026-09-23 12:46", "source_label": "帖子正文", "excerpt": "📌高盛中国午间速递📊上证综指 -0.36%，科创 50 -0.12% 📊上证 50 -0.41%，创业板指 -0.43% 📊沪深 300 -0.50%，中证 500 -0.38% ", "content": "📌高盛中国午间速递📊上证综指 -0.36%，科创 50 -0.12% 📊上证 50 -0.41%，创业板指 -0.43% 📊沪深 300 -0.50%，中证 500 -0.38% 💰总成交额（万亿元人民币）1.17，较前一日下降 18.75% 📰中国市场今日交投清淡，板块表现分化，多数股票在窄幅区间内震荡。节前情绪在岸市场升温，成交额反弹势头减弱，较前一日下滑 18%（预计全天收于约 1.8 万亿元人民币）。受隔夜美股同类股持续大涨带动，中国半导体个股相对走强，录得温和涨幅。佰维存储（688525.SH）因宣布向先进封装项目三期投资 45 亿元人民币的消息，股价上涨 2.26%。软件板块方面，在昨日受 Meta-Muse 热情推动的反弹之后，今日呈现普遍整固态势。非科技板块中，地产股早盘再次大幅上扬，有关房贷补贴政策落地的讨论在聊天群组中依然活跃，但尚无确切消息证实，且涨幅已从上午高点回落。其他板块中，CRO / 生物科技股再度领跑，成为行业轮动的主要流向。 💸资金流向：我们在名义金额较轻的情况下，卖出力度为买入的 1.2 倍。我们买入半导体设备，同时卖出 AIDC 电源和覆铜板（CCL）。#文字观点", "publish_time": "2026-09-23 12:46", "tags": ["文字观点"]}, "post:2026-09-23T20-06:9a992fa235bd": {"id": "post:2026-09-23T20-06:9a992fa235bd", "kind": "post", "title": "2026-09-23 20:06", "source_label": "帖子正文", "excerpt": "上半年，PCB核心物料CCL 能首批通过企业为日立能源、LG新能源、特斯拉，CDU首批为LG电子、LiquidStack、维谛。恒立液压目标价由121元上调至126元，某美国主导的人形机器人。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>1. AI算力/大模型\u003c/h3>\n\u003cul>\n\u003cli>主线：AI基础设施投资从GPU延伸至CPU与内存，Agent时代重塑算力架构。\u003c/li>\n\u003cli>今天强化的逻辑：随着AI模型迭代、推理速度提升，AI系统性能核心决定因素正逐步从GPU算力转向内存带宽、容量与数据传输速率；CPU从辅助角色向核心算力底座升级；CPU与GPU业务放量，AMD二季度数据中心营收同比上涨107%。\u003c/li>\n\u003cli>今天出现的催化/验证：Claude Opus 5.5与GPT-6 Sol发布；Meta智能体Muse登顶美国应用商店下载量；阿里云2032年20GW算力蓝图，平头哥真武V900可扩展至50万卡超节点并计划27Q1量产；英特尔、AMD与Arm在纽约市场同步上涨；B200租赁指数达到历史最高水平。\u003c/li>\n\u003c/ul>\n\u003ch3>2. 半导体/先进封装/存储\u003c/h3>\n\u003cul>\n\u003cli>主线：DRAM短缺与先进封装扩产并行，玻璃基板量产预期前移。\u003c/li>\n\u003cli>今天强化的逻辑：AI服务扩张导致DRAM短缺，CXMT过去六个月未偿投资承诺额增加两倍；8月中国设备进口回暖、存储出口价大涨验证景气；HBM 2026-28E需求复合增速63%；玻璃基板从验证向量产推进。\u003c/li>\n\u003cli>今天出现的催化/验证：CXMT准备投资10.6万亿韩元；8月中国设备进口+20~25%，光刻+32%、刻蚀+37%、引线键合+233%；DRAM/NAND出口价+249%/+246%；NV要求日韩及中国台湾地区基板厂商两年内完成玻璃基板技术开发与验证，或2028年前导入；京东方玻璃基板试验线全线拉通，覆盖TGV打孔、镀铜、ABF增层、封装切割，力争27Q1或上半年量产；金辰股份拟投资约10亿元建设半导体装备研发及制造项目，重点布局TGV玻璃基封装设备。\u003c/li>\n\u003c/ul>\n\u003ch3>3. 光通信/CPO\u003c/h3>\n\u003cul>\n\u003cli>主线：跨集群互联与入站互联需求提升，光互联多路线并行。\u003c/li>\n\u003cli>今天强化的逻辑：万亿级参数训练与指数级推理需求使单一数据中心或集群在供电、散热及物理空间上瓶颈凸显；分布式训练成为必然选择，对空心光纤、相干光模块、OCS及多轨线系统需求将加速释放；800G ZR/ZR+将成为主流，1.6T ZR/ZR+是下一代跨域互联关键。\u003c/li>\n\u003cli>今天出现的催化/验证：ECOC初步解读显示NPO在2028年时间框架进入部分scale-up网络；光博会显示3.2T/6.4T/12.8T SPO及更高速率进入验证阶段，LPO、SPO、NPO、CTO多路线并行；华为申腾960超节点搭载内置光源的NPO光引擎，传输容量7.2T；富信科技拟定增募资不超2.7亿元，其中1.5亿元用于新增Micro TEC产能4200万片/年；光模块散热从800G向1.6T迭代，单模块TIM价值量提升。\u003c/li>\n\u003c/ul>\n\u003ch3>4. PCB/CCL/铜箔\u003c/h3>\n\u003cul>\n\u003cli>主线：AI服务器引发PCB供给结构性重构与产业链涨价潮。\u003c/li>\n\u003cli>今天强化的逻辑：AI服务器需求爆发，树脂、电子布、铜箔、CCL、PCB各环节均完成顺价传导；高端HDI与通孔板材料升级，HVLP铜箔等需求提升。\u003c/li>\n\u003cli>今天出现的催化/验证：铜箔专家交流要点显示，GB300计算板为5阶22层HDI，M8+M4混压、HVLP3；交换板为22层通孔板，M8；3μm载体铜箔加工费60万/吨；PCB、覆铜板与载板专家电话会探讨CPO对PCB/覆铜板影响及PTFE潜在应用前景；CCL上半年业绩高增，生益科技+130%、南亚新材+429%、金安国纪+987%、建滔积层板+209%；东山精密明年最缺的三大物料包括DSP、mSAP、光芯片，公司均有较强保障。\u003c/li>\n\u003c/ul>\n\u003ch3>5. 液冷/电源\u003c/h3>\n\u003cul>\n\u003cli>主线：AI工厂认证体系落地，液冷与储能重要性提升。\u003c/li>\n\u003cli>今天强化的逻辑：储能、液冷率先进入英伟达AI Factory认证体系，进一步体现其在AIDC中的重要性；从液冷组合配置角度，也应当将MLCP纳入一定权重。\u003c/li>\n\u003cli>今天出现的催化/验证：英伟达9月21日正式推出DSX Ready认证体系，首批纳入储能系统、液冷CDU；储能首批通过企业为日立能源、LG新能源、特斯拉，CDU首批为LG电子、LiquidStack、维谛；大元泵业Q4液冷会有实质性收入，UL认证通过后订单落地会加速；裕同科技计划进一步收购华研科技34%股份，交易完成后累计持有华研科技85%股份，液冷业务加速成长。\u003c/li>\n\u003c/ul>\n\u003ch3>6. 机器人/自动化\u003c/h3>\n\u003cul>\n\u003cli>主线：人形机器人商业化量产与工厂自动化业务放量。\u003c/li>\n\u003cli>今天强化的逻辑：机器人及自动化业务放量、全球供应链布局及利润率改善；FA业务订单饱满，预计2027年扭亏；人形机器人。\u003c/li>\n\u003cli>今天出现的催化/验证：恒立液压基于DCF的2027年12月目标价由121元上调至126元，潜在上行空间约35%，维持增持；某美国主导的人形机器人；FA业务2Q26营收环比增长70-80%；马斯克预测2046年人形机器人数量将超1000亿台，Optimus量产在即；七腾机器人发布L3防爆轮式巡检机器人、X5四足轮足巡检机器人，主要针对化工场景设计。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>模型发布密集：Claude Opus 5.5以58分登顶Artificial Analysis智能指数；OpenAI发布GPT-6 Sol；Meta智能体Muse登顶美国应用商店下载量。\u003c/li>\n\u003cli>AI算力架构变化：CPU在短期资本开支中取代GPU成为占比最高的部分；内存战略价值被重新评估；阿里云2032年20GW算力蓝图，当前仅4-5GW，生态内增量投资约4800亿美元，外部云收入空间1600-2400亿美元，MaaS。\u003c/li>\n\u003cli>存储与封装变化：CXMT准备投资10.6万亿韩元，6个月内投资额增长三倍；8月中国设备进口+20~25%；DRAM/NAND出口价+249%/+246%；HBM 2026-28E需求复合增速63%；玻璃基板量产预期前移。\u003c/li>\n\u003cli>光通信变化：跨集群互联与入站互联成为AI网络重点；ECOC显示NPO在2028年进入部分scale-up网络；光博会多速率、多路线并行；富信科技定增扩产Micro TEC。\u003c/li>\n\u003cli>PCB变化：AI服务器需求爆发引发PCB供给结构性重构，树脂、电子布、铜箔、CCL、PCB各环节完成顺价传导；铜箔专家交流披露GB300材料选型与3μm载体铜箔加工费。\u003c/li>\n\u003cli>液冷/电源变化：英伟达DSX Ready首批认证落地，储能、液冷CDU率先纳入；大元泵业Q4液冷有实质性收入；裕同科技拟进一步收购华研科技34%股份，累计持股达85%。\u003c/li>\n\u003cli>机器人变化：恒立液压目标价上调；某美国主导人形机器人；FA业务2Q26营收环比增长70-80%；七腾机器人发布L3防爆轮式巡检机器人、X5四足轮足巡检机器人。\u003c/li>\n\u003cli>宏观与市场：标普500收盘持平报7764点，纳指100上涨82个基点报30732点；美国10年期国债收益率上行0.002个基点报4.9531%；美联储官员密集表态；A股市场关注点再度轮动至AI相关交易，传统经济板块热度降温。\u003c/li>\n\u003cli>地产与策略：中国地产开发公司板块大幅上涨，由融创等困境公司领涨，高贝塔标的为政策博弈代理变量；有策略观点认为四季度有望出现“吃饭行情”，AI算力硬件及配套方向仍是首选。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>3Q26业绩期临近，关注具备明确公司层面盈利催化剂的标的及行业整体交投活跃度、两融余额变化。\u003c/li>\n\u003cli>HBM供需模型更新后，2026-28
