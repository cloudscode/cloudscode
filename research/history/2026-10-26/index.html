lish_time": "2026-10-26 09:13", "tags": ["核心观点", "重点关注标的", "文字观点"]}, "post:2026-10-26T19-34:cdcc7f7e1d3e": {"id": "post:2026-10-26T19-34:cdcc7f7e1d3e", "kind": "post", "title": "2026-10-26 19:34", "source_label": "帖子正文", "excerpt": "行云科技：订单持续涨价，业绩上修 #订单涨价覆盖已交付设备。", "content": "", "publish_time": "2026-10-26 19:34", "tags": ["文字观点"]}}, "source_details": {"post:2026-10-26T22-23:a97512760415": {"id": "post:2026-10-26T22-23:a97512760415", "kind": "post", "title": "2026-10-26 22:23", "source_label": "帖子正文", "excerpt": "【中信证券科技】Anthropic IPO文件速览：收入快速增长盈利潜力初显，从宏大叙事走向基本面 【财务表现】：收入高速增长，经营盈利拐点初现。2025年公司实现收入45.9亿美元，2026Q1/Q2分别达到47.3/115.6亿美元，Q2环比增长144%，2026H1累计收入162.9亿美元，达", "content": "【中信证券科技】Anthropic IPO文件速览：收入快速增长盈利潜力初显，从宏大叙事走向基本面 【财务表现】：收入高速增长，经营盈利拐点初现。 2025年公司实现收入45.9亿美元，2026Q1/Q2分别达到47.3/115.6亿美元，Q2环比增长144%，2026H1累计收入162.9亿美元，达到2025年全年的3.5倍。2026Q2 GAAP经营利润率首次转正至8%，调整后经营利润率达到19%。2026H1收入结构中，按量计费占80%，订阅收入占20%，美国以外市场贡献28%，企业Token消费仍是核心增长来源。 【费用结构及盈利预测】：算力成本率快速下降，规模效应显现。 2025年计算与基础设施费用约73.3亿美元，占总运营费用58%；2026Q2算力费用占收入比例已由2025Q1的251%降至48%，反映收入增长及推理效率改善带来的成本摊薄。2026H1 GAAP净亏损约808亿美元，主要受非现金公允价值变动影响。 【客户结构】：大客户数量快速增长，集中度持续下降。 年消费超过10万美元的客户由一年前约950家增至1.19万家以上，年消费超100万美元客户超过1900家，超1000万美元客户约250家。2026Q3前五大客户收入占比约21%，较2026Q1的约36%明显下降，2026年前三季度最大单一客户收入占比不足10%。2026H1通过AWS、Google Cloud等云Marketplace实现的收入占比达到48%，较2023年的11%显著提升，云厂商已成为核心获客及销售渠道。 【算力承诺】：长期采购协议规模庞大，TPU与GPU双线布局。 截至2026年6月底，公司不可撤销采购承诺约2450亿美元，此后继续签订大规模算力采购协议。主要包括Google约1145亿美元、Broadcom约1612亿美元、Amazon约1100亿美元、Microsoft约449亿美元，以及涉及NVIDIA GPU的SpaceX/xAI、Nscale和Lambda等协议。AMD预计2027年开始交付MI450相关系统。不同协议存在部分交叉，不能简单加总，整体算力需求仍将持续增长。 【模型规划】：模型性能与成本效率同步优化，Agent商业化加速。 公司围绕Mythos、Fable、Opus等模型持续迭代，近期Opus 5.5较Opus 5的客户单任务成本下降约40%，模型竞争正从单纯性能升级转向性能、成本与应用生态综合竞争。Claude Code持续向软件开发全流程渗透，Claude Cowork进一步覆盖知识工作及企业任务执行。2026年9月公司内部超过90%的代码贡献由Claude编写，Agent应用有望推动Token消费与企业付费渗透持续提升。 欢迎联系中信证券科技团队！#文字观点", "publish_time": "2026-10-26 22:23", "tags": ["文字观点"]}, "post:2026-10-26T20-21:fcb2696a4972": {"id": "post:2026-10-26T20-21:fcb2696a4972", "kind": "post", "title": "2026-10-26 20:21", "source_label": "帖子正文", "excerpt": "20261026今日段子汇总 1、上纬新材：公司推出面向个人及家庭场景的启元Q1消费级人形机器人和启元T1可变形机器人 2、朗特智能：1、公司在机器人领域主要的技术储备包括步进电机控制和直流无刷马达控制技术等；2、控股子公司朗擎数科专注于液冷算力一体机及算力服务，相关业务有序推进，液冷产品已有小批量", "content": "20261026今日段子汇总 1、上纬新材：公司推出面向个人及家庭场景的启元Q1消费级人形机器人和启元T1可变形机器人 2、朗特智能：1、公司在机器人领域主要的技术储备包括步进电机控制和直流无刷马达控制技术等；2、控股子公司朗擎数科专注于液冷算力一体机及算力服务，相关业务有序推进，液冷产品已有小批量正式订单落地 3、天娱数科：1、参股公司芯明发布自研3D视觉AI模组R216g，内置空间智能芯片提供3.5 TOPS端侧算力，专为人形机器人、灵巧手及协作臂设计；2、公司拥有智者千问、天星、智慧广告三款企业级大模型，推进具身智能平台建设，完成“人形机器人空间6D动捕长程数据”等5个数据集资产登记，积累超120万条3D数据及10万机器人任务训练数据，为相关场景提供解决方案 4、永创智能：公司新设人形智能机器人研发部门，加快人形机器人整机、核心零部件、以及人形机器人在包装领域应用技术的研发工作，目前已完成多款人形机器人产品及核心部件的设计定型 5、杰克科技：公司为工业缝制机龙头，计划于近期正式发布上市人形机器人 6、锋龙股份：优必选受让控股股东所持29.99%股份 7、模塑科技：公司与国内某机器人公司签订采购框架协议并正式获得人形机器人外覆盖件小批量订单，业务正式切入人形机器人赛道 8、创维数字：公司数字智能盒子支持短剧等内容 9、万向钱潮：机器人业务为公司第三大战略业务板块，产品覆盖机器人全系列关节万向节、精密减速器及各类关节专用轴承等，已具备10万套滚柱丝杠、1000万套关节万向节产能，2026年计划建成机器人专用轴承产能120万套，海外重点推进泰国生产基地建设 10、福莱新材：公司向全球灵巧手领军企业灵心巧手累计交付超3万套触觉传感器 11、大名城：1、以“产业+资本”双轮驱动的城市综合功能开发运营商；公司参股投资的智算公司已建成福州首期智算中心，配备英伟达H800服务器并通过NVLink互联，提供约2000P智能算力，加qq:1490929960由控股子公司名城数字负责专业运营，已开展商业化算力服务；2、全资子公司深圳名城金控持有北京佰才邦技术股份有限公司20.4522%股份，后者布局6G及卫星互联网，产品涵盖低轨卫星通信等 12、泛亚微透：1、公司布局电子皮肤基材及高耐弯折机器人线缆，线缆已向北美头部客户小批量出货，电子皮肤获北美客户100套灵巧手手套订单；2、公司作为国内PTFE膜应用领域的参与者，ePTFE绕包材料已通过部分下游客户产品验证 13、百洋股份：公司为全球加工规模最大、国内领先的罗非鱼食品综合提供商 14、金溢科技：公司打造了完整的智能网联车路云产品体系，构建了交通AI计算模型、车路协同云平台、C-V2X车载HMI人机交互系统管理平台，积极拓展低空智联等战略新业务 15、闽发铝业：1、公司位于福建省南安市，为海西板块的铝型材龙头企业，表示将重点拓展机器人等工业铝型材及高端装备铝型材赛道；2、公司液冷服务器用铝型材已开始小批量供货，正积极推进相关领域的市场拓展与技术优化，稳步提升产品交付能力；3、光伏支架和边框等配套产品是公司的主要工业材产品之一 16、阳光乳业：公司主营业务为液态乳，包括儿童调制乳、A2牛奶 17、上海物贸：1、实控人为上海市国资委；公司旗下上海有色金属交易中心研发的有色金属现货指数查询产品，已在上海数据交易所备案并挂牌；2、公司长期深耕汽车流通领域，以客户用车全生命周期为中心，系统搭建“购车—用车—换车—养车”一体化服务体系 18、百达精工：公司已布局人形机器人灵巧手指部关节模组及具身机器人关节铝制结构件等核心零部件 19、中邮科技：公司以自有资金3000万元设立全资子公司中邮智能机器人（合肥）有限公司，布局机器人研发、制造与销售；此外，公司自主研发机械臂识别控制算法，其智能无人车投递系统也已在多地试点投放 20、春光科技：公司主营吸尘器、洗地机、扫地机器人、布衣清洗机等 21、光洋股份：1、公司拟10亿建设新能源汽车及机器人用精密零部件项目；2、公司已获得小鹏飞行汽车X3项目定点，完成A样交样 22、大千生态：公司宠物业务已覆盖零售及服务、智能硬件、互动体验等场景，形成“消费+服务+产品”的全业务链布局 23、沪光股份：国际领先的汽车线束供应商，人形机器人项目首套样线此前下线 24、上海洗霸：公司应用于eVTOL的高比能软包锂离子固态电池已设计完成 25、南方传媒：公司前三季度净利润同比增长51%；万卷要义是广东省出版集团数字出版有限公司基于人工智能技术研发的面向出版和教育应用场景的垂类大模型底座 26、永和智控：公司以家用水暖阀门、管件生产经营为主营业务，产品主要销往欧美市场，是国内最大的水暖阀门生产销售基地之一 27、胜通能源：公司控股股东将变更为七腾机器人 28、良品铺子：公司主要从事休闲食品的研发、采购、销售、物流配送和运营业务 29、海量数据：1、国内主要的关系型数据库产品提供商；公司布局数据库透明加密、数据库审计等安全模块，具备敏感数据保护、泄密轨迹分析及数据库攻击威胁分析能力；2、公司数据库产品能够为OpenClaw等智能体提供数据支撑，其技术路线与AI国产化趋势契合 30、晶华新材：1、公司柔性触觉传感器适配人形机器人灵巧手等场景，相关产品已实现小批量量产，并与多家具身智能、灵巧手领域头部企业开展合作；2、公司为电池组装过程提供各类胶带，已成熟运用于软包电池、半固态电池；3、公司已实现在折叠屏手机应用场景上的产品突破并实现量产 31、北矿科技：世界最大永磁铁氧体预烧料生产企业之一；公司开展了矿冶领域专用机器人的研究，开发的选矿过程智能巡检机器人和冶金作业过程智能机器人已开展工业应用，同时开展了矿冶装备智能化方面的研究 32、英 力 特：公司从事PVC（聚氯乙烯）和烧碱的生产，控股股东拟公开征集转让39.41%股份，转让底价不低于6.27元/股，控制权或变更 33、兰生股份：上海市国资委旗下，公司承办的世界人工智能大会、中国国际工业博览会等展会有机器人相关展区 34、大西洋：公司焊接材料成功运用于秦山核电、福清核电、防城港核电等核电项目的装备制造中 35、东方海洋：公司主要从事海水苗种繁育、养殖，水产品加工等，水产品加工主要包括调理食品系列、冷冻鱼片系列、海参系列加工产品等 36、和泰机电：公司通过持续实施自动化、智能化改造，更新迭代生产设备，在物料输送设备制造领域的生产工艺已相对成熟，应用了机器人自动焊接技术，机器人视觉识别自动上下料、自动装箱等技术 37、国脉科技：1、公司主要从事物联网技术服务、物联网咨询与设计服务，与主流大模型服务商合作，构建深耕于社区养老以及居家养老场景的 AI Agent；2、公司注册地位于福建省福州市，已在开展6G关键技术的跟踪研究和人才培养 38、奥雅股份：公司旗下 “洛嘉儿童” 聚焦亲子文旅，拥有 “洛洛”“嘉嘉”“小橘” 等自有 IP 形象，并推出相应周边产品 39、英特集团：浙江省医药流通行业区域龙头，专业医药物流能力全省一流，拥有杭州、宁波、金华、温州、嘉兴五个现代医药物流中心 40、电魂网络：精品化网络游戏研运一体商；公司产品体系已涵盖AI游戏品类，旗下《吾家有女Ai》以AI互动玩法为核心，主打AI智能体角色养成交互体验，将AI技术深度融入精品化游戏研发运营 41、三羊马：1、机器人业务是三羊马智人科技及合作伙伴冰零智能科技高度关注且重视的下游应用领域，智人科技目前无机器人领域的量产产品；2、公司布局无人车物流，并为小米景明科技有限公司的承运商之一，与重庆东风小康汽车销售有限公司及其关联方有汽车整车综合物流服务业务合作 42、达瑞电子：公司碳纤维结构件已批量用于华为、三星折叠屏手机，并适配人形机器人壳体，脑机接口部件处于送样验证阶段 43、青岛食品：公司主要从事饼干与花生酱等休闲食品的研产销，第三季度净利润同比增长31.17% 44、皇台酒业：甘肃小型白酒企业；公司白酒产业拥有“皇台”和“凉州皇台”两大品牌，目前拥有“窖底原浆”、“皇台经典”等系列产品 45、科瑞思：1、公司拟收购宏钢光电，切入光电子封装壳体赛道；2、公司小型磁环线圈重点应用于5G基站、WiFi6路由器、机顶盒及数据中心的交换机和服务器；3、公司参与的电感业务包括电感绕线、电感成品和相关自动化生产设备 46、延华智能：公司医疗板块AI助手“星仔”已融合人工智能技术，落地智能导诊、报告解读、辅助诊断等场景，实现医疗服务智能化升级 47、塞力医疗：公司与华为技术有限公司及脑机智能全国重点实验室三方签署战略合作，聚焦于精神障碍精准诊疗领域，特别是人工智能在精神医学数字疗法中的应用 48、生 意 宝：国内最大行业电子商务运营商和领先的综合B2B运营商之一；公司深耕商品流通领域，开展大宗品电商、工业品电商、供应链金融、期现交易及商品数据等业务，依托生意社发布500种大宗原材料基准价，并提供现货通、股票通、期货通产品#市场段子#文字观点", "publish_time": "2026-10-26 20:21", "tags": ["市场段子", "文字观点"]}, "post:2026-10-26T22-24:85ec89a78e38": {"id": "post:2026-10-26T22-24:85ec89a78e38", "kind": "post", "title": "2026-10-26 22:24", "source_label": "帖子正文", "excerpt": "Anthropic,PBC‑S‑1 招股书（第二季度）📊业务与营收高速增长，但持续大额净亏损：Anthropic 自 2021 年成立，2023 年才推出商业化产品 Claude；2023‑2025 年收入实现爆发式增长，2026 年上半年营收继续大幅提升，但受可转换票据、衍生品公允价值变动等非现金", "content": "Anthropic,PBC‑S‑1 招股书（第二季度）📊业务与营收高速增长，但持续大额净亏损：Anthropic 自 2021 年成立，2023 年才推出商业化产品 Claude；2023‑2025 年收入实现爆发式增长，2026 年上半年营收继续大幅提升，但受可转换票据、衍生品公允价值变动等非现金会计调整影响，公司持续录得巨额净亏损，调整后营业利润实现转正。 💻算力是公司发展的核心约束，存在巨额刚性合约支付义务：公司签署大量算力、数据中心采购及租赁长期协议，未来存在规模庞大的刚性付款责任；算力资源获取面临芯片制造、电力供给、数据中心建设等供应链多重风险，算力不足会直接拖累模型迭代与客户服务能力。 🏛️采用特殊公益公司 + 双层治理架构，公众股东权力受限：公司为特拉华州公益公司（PBC）；长期利益信托 LTBT 有权选举董事会多数董事，七位联合创始人持有的 F 类股票掌握普通股东事项 50.1% 投票权；公司属于纳斯达克规则下受控公司，可以豁免部分公司治理规则，A 类普通股普通投资者投票影响力被大幅削弱。 👥客户规模快速扩张，但存在客户与渠道集中风险：截至 2026 年 9 月，过去十二个月营收 10 万美元以上的客户达到 11900 余家；前五大客户贡献约 25% 营收，多数大客户没有长期绑定合约；通过云服务商渠道产生的收入占比持续走高，渠道发生扰动会直接冲击经营业绩；净收入留存率表现较高。 🤖产品以 Claude 大模型体系为核心，大力发展智能体 AI 赛道：核心产品包含 Claude 对话模型、Claude Code 代码智能体、Claude Cowork 知识工作智能体；公司将持续拓展智能体、机器人、科研仪器控制等前沿应用场景，但新产品商业化落地存在不确定性。 ⚠️AI 安全是招股书重点披露的重大风险：前沿大模型存在被恶意滥用、模型行为脱离人类意图、自主行为失控等多重风险；模型可能产生不可预知的涌现能力，部分风险只有实际部署之后才会暴露；网络攻击、提示注入等安全威胁同样客观存在，安全事故会带来声誉、法律、经营多重打击。 ⚔️行业人才争夺极度激烈，人才流失会直接阻碍研发迭代：顶尖 AI 研发人才供给稀缺，与 OpenAI、谷歌等对手争夺人才；能否留住核心创始、技术人员，对公司维持技术前沿地位至关重要；随公司规模扩张，维持原有组织文化同样构成挑战。 🧩市场竞争环境复杂，技术优势存在被削弱的可能性：直接竞争对手包括 OpenAI、谷歌，同时面临开源模型以及其他 AI 实验室的竞争；若头部模型之间性能差距收窄，客户会转向性价比更高的替代方案，公司差异化壁垒会被削弱。 📜全球监管政策高度不确定，业务开展面临合规压力：全球针对人工智能的立法、出口管制、数据合规、AI 安全监管处在快速演化阶段；不同国家地区法规差异巨大，监管变化会约束产品研发、海外推广，还会带来知识产权诉讼、产品责任索赔等潜在大额法律成本。 📈公司经营历史较短，高增速无法简单外推到未来：AI 行业尚处于发展早期，公司商业化运营时间不长；收入高速增长是行业早期阶段特征，未来营收增速大概率回落；同时还要面对债务偿付压力、资本开支压力，能否实现持续盈利存在较大不确定性。#文字观点", "publish_time": "2026-10-26 22:24", "tags": ["文字观点"]}, "attachment:files/Anthropic_S1_中文详解.pdf": {"id": "attachment:files/Anthropic_S1_中文详解.pdf", "kind": "attachment", "title": "Anthropic_S1_中文详解", "source_label": "其他", "excerpt": "读懂 Anthropic 招股书： ⼀份 S-1 的中⽂详解 招股书精读 2026年10⽉ 2026 年 10 ⽉ 26 ⽇，Anthropic, PBC 向美国证券交易委员会（SEC） 公开递交了 S-1 注册声明，拟在纳斯达克全球精选市场挂牌，股票代码 「ANT」。这是⼀份「待完成」（Subject to Completion）的初步招 股书：发⾏股数、", "content": "读懂 Anthropic 招股书： ⼀份 S-1 的中⽂详解 招股书精读 2026年10⽉ 2026 年 10 ⽉ 26 ⽇，Anthropic, PBC 向美国证券交易委员会（SEC） 公开递交了 S-1 注册声明，拟在纳斯达克全球精选市场挂牌，股票代码 「ANT」。这是⼀份「待完成」（Subject to Completion）的初步招 股书：发⾏股数、价格区间、募资⾦额都还是空⽩。但财务数据、商业 模式和那套前所未⻅的公司治理结构，已经完整摆在台⾯上。本⽂按招 股书的结构，逐块拆解。 ⼀、⼀句话看懂这份⽂件 这是⼀家半年收⼊ 163 亿美元、收⼊增速超过 13 倍、经营层⾯接近盈 亏平衡，却因会计原因账⾯亏损 807 亿美元的公司；它把董事会多数席 位交给了⼀个与财务⽆利益关系的信托，⼜把 50.1% 的投票权留给了 七位联合创始⼈。 ⼏个最值得记住的数字： 收⼊：2023 年 0.41 亿美元 → 2024 年 3.86 亿 → 2025 年 45.85 亿 → 2026 年上半年 162.86 亿美元 净收⼊留存率（NRR）：约 900% （截⾄ 2026 年 9 ⽉ 30 ⽇） 年付费超过 100 万美元的客⼾： 1,900 多家 ；超过 1,000 万美元 的：约 250 家 账上现⾦及短期投资： 1,317 亿美元 （截⾄ 2026 年 6 ⽉ 30 ⽇） ⼈均收⼊（过去 12 个⽉）：超过 660 万美元 ，⼀年前是 140 万美 元 1 ⼆、发⾏基本信息 招股书给出的是标准表述：⼀般公司⽤途，包括营运资⾦、运营开⽀、 资本开⽀（明确点名算⼒与基础设施）、招聘、可能的收购，以及为员 ⼯限制性股票（RSU）结算代扣税款。⽼股东出售部分的收⼊公司⼀分 不得。 【拆股】 2026 年 9 ⽉ 17 ⽇，A 类、N 类普通股做了 1 拆 10 的正向拆股；T 类 股则做了 1,000 合 1 的反向合股。招股书中的每股数据都已按拆股调 整。 三、公司是做什么的 招股书开宗明义，称 Anthropic「⾸先是⼀家研究实验室」，使命写进 公司章程：负责任地开发和维护先进 AI，以实现⼈类的⻓期利益。 【发⾏要素】 发⾏⼈：Anthropic, PBC，2021年1⽉在特拉华州注册的「公益公 司」（PublicBenefitCorporation），总部旧⾦⼭ 上市地点：纳斯达克全球精选市场，代码ANT 发⾏品种：A类普通股（每股⼀票） 发⾏股数、价格区间：招股书中仍为空⽩，待后续修订稿补充 承销商：⾼盛、摩根⼠丹利牵头，摩根⼤通、花旗、巴克莱、富国银 ⾏等⼆⼗余家投⾏组成承销团。 ÐÅÏ¢Ô´Í·¼ÓÎ¢ÐÅ WUXL3408 公司⾝份：⾮加速申报公司、⾮「新兴成⻓公司」，同时属于纳斯达 2克规则下的「受控公司」 【募资⽤途】 商业上，它卖的是⼀个东西——Claude，通过三层交付： 【模型层：Claude 系列模型】 前沿⼤模型本⾝。招股书举例，Claude Opus 5.5 相⽐上⼀代 Claude Opus 5，把客⼾完成每项任务的成本降低了约 40%。 【平台层：Claude Platform 与 API】 ⾯向开发者的「智能体开发环境」，提供构建和扩展应⽤所需的基础组 件。开发者通过 API 发送输⼊、获取模型输出，按 token 计费。 【应⽤层：Claude Code、Claude Cowork、Claude.ai】 公司把⾃⼰的商业模式称作「为智能付费」（pay-for- intelligence）：以按量消耗（token 计量）为主，辅以订阅。 【分销渠道】 Claude 同时上架三⼤云：亚⻢逊 AWS、⾕歌云 GCP、微软 Azure。此 外还通过埃森哲、德勤、毕⻢威、普华永道等系统集成商，以及 Salesforce、Snowflake 等数据平台触达客⼾，并与私募股权机构合资 成⽴了 AI 服务公司「Ode with Anthropic」。 四、它瞄准的市场 招股书引⽤的市场⼝径相当宏⼤： Claude Code：编程智能体，能规划、编写、测试、调试代码。 2025 年 2 ⽉以研究预览版推出。招股书提到，NASA ⼯程师曾⽤它 为「毅⼒号」⽕星⻋规划导航指令。 Claude Cowork：带「电脑操作」能⼒的知识⼯作智能体，2026 年 1 ⽉推出研究预览版；2026 年 9 ⽉起与 Claude.ai 合并。 3 公司判断，具备专家级认知能⼒、能⾃主完成数⼩时乃⾄数周⼯作的 「强⼤ AI」（Powerful AI），很可能在「⼏年之内」到来。 五、财务数据详解 这是全⽂最重要的部分。以下数字均来⾃招股书的「合并经营数据摘 要」，单位为百万美元。 【收⼊：每年⼀个数量级】 期间 收⼊ 同⽐ 2023 年 41 — 2024 年 386 约 9.4 倍 2025 年 4,585 约 11.9 倍 2025 上半年 1,163 — 2026 上半年 16,286 约 14 倍 2023 年第⼀季度商业化起步时收⼊为零。招股书特别强调：2026 年⼆ 季度收⼊同⽐增⻓ 1,368% ，⽽同期算⼒与基础设施⽀出只增⻓了 300%。收⼊增速是成本增速的四倍多，这是整份招股书最核⼼的「经 营杠杆」故事。 据《华尔街⽇报》等媒体对招股书的解读，2026 年上半年收⼊中，⼀ 季度约 47 亿美元、⼆季度约 115 亿美元——单季度环⽐就翻了⼀倍 多。 【成本结构：算⼒占⽐快速下降】 2025 年全球知识⼯作创造的经济价值超过 40 万亿美元 IDC 估计，到 2031 年 AI 的累计经济影响为 22.5 万亿美元 ⽣命科学被单独点名：2026 年全球制药⽀出预计超过 2 万亿美元； 机器⼈也被列为扩张⽅向 4 算⼒与基础设施是最⼤的⼀块成本。拿它和收⼊相⽐： 期间 算⼒⽀出 占收⼊⽐ 2023 年 433 约 1,056% 2024 年 2,522 约 653% 2025 年 7,326 约 160% 2026 上半年 8,945 约 55% 三年前每赚 1 美元要花 10 美元买算⼒，现在只花 0.55 美元。这⼀⽐例 的下降，就是模型推理效率提升与规模效应叠加的结果。 其他⽀出（2026 上半年 vs 2025 上半年）： 2025 年还有⼀笔⼀次性的 15 亿美元「Bartz 和解⾦」 ，对应的是作者 群体就训练数据版权对公司提起的集体诉讼。 【经营亏损：快速收窄到接近打平】 期间 经营亏损 经营利润率 2023 年 (551) -1,344% 2024 年 (2,980) -772% 2025 年 (8,060) -176% 2026 上半年 (693) -4% 按公司⾃定义的⾮ GAAP ⼝径「调整后经营利润」，2026 年上半年已 经 转正为 16.18 亿美元，调整后经营利润率 10% ；调整后净利润 26.71 亿美元。 ⼈员开⽀：31.52 亿 vs 5.38 亿，其中股权激励 22 亿美元 销售、市场与合作伙伴：31.68 亿 vs 1.20 亿，暴增约 26 倍，公司 明显在加码获客与渠道分成 其他运营与管理：17.14 亿 vs 3.06 亿 5 【净亏损 807 亿：为什么不⽤慌】 2026 年上半年净亏损⾼达 807.48 亿美元 ，每股亏损 39.88 美元。乍 看惊⼈，但拆开看： 也就是说，九成以上的亏损来⾃「公司估值上涨 → 投资者⼿⾥的可转 债和衍⽣⼯具变得更值钱 → 按会计准则记为公司的负债增加」。这是 ⾮现⾦的账⾯损失，公司越值钱、这项亏损越⼤。上市后这些⼯具转换 为股票，这⼀项会基本消失。2025 年全年的 419.65 亿美元净亏损，也 有 343 亿来⾃同⼀原因。 【资产负债表：坐拥千亿现⾦】 截⾄ 2026 年 6 ⽉ 30 ⽇： 股东权益为负，同样主要是会计处理所致（优先股不计⼊权益、公允价 值损失累积进亏损），并不代表公司资不抵债——账上的现⾦远超其运 营所需。 六、关键运营指标 【客⼾分层】 （截⾄ 2026 年 9 ⽉ 30 ⽇，按过去 12 个⽉收⼊计） 可转换票据、衍⽣⼯具及 SAFE 的公允价值变动： -723.88 亿美元 其他净⽀出：-87.57 亿美元 利息收⼊：+11.11 亿美元 现⾦及等价物 1,124 亿美元，短期投资 193 亿美元，合计 1,317 亿 美元 总资产 1,474 亿美元，总负债 1,175 亿美元 可赎回可转换优先股 1,575 亿美元 累计亏损 1,329 亿美元，股东权益为 -1,276 亿美元 截⾄该⽇累计融资 1,411 亿美元 6 【净收⼊留存率约 900%】 意思是：⼀年前的那批客⼾，今天在 Anthropic 上的花费是⼀年前的约 9 倍。SaaS ⾏业⾥ NRR 达到 120%〜130% 已属优秀，900% ⼏乎没 有先例。它说明增⻓的主要动⼒不是拉新，⽽是⽼客⼾⽤量的爆发—— 这与智能体（Agent）类产品按 token ⼤量消耗的特征⼀致。 【年化收⼊的⼝径】 招股书定义的「运⾏率收⼊」（Run-Rate Revenue）= 最近 28 天的按 量消费 × 13 + 当⽉订阅费 × 12。读媒体报道⾥的「年化收⼊」时，要 注意⼝径是否⼀致。 【客⼾集中度】 据媒体对招股书的解读，约 25% 的收⼊来⾃两家客⼾ ，且双⽅没有⻓ 期合同约束。招股书⻛险因素中也明确提到收⼊集中于少数客⼾与分销 渠道，其中包括「既是投资⽅、⼜是客⼾」的云服务商。 七、算⼒：最⼤的承诺，最⼤的⻛险 招股书描述了⼀种「统⼀池化」的算⼒架构，同时调度四类芯⽚：亚⻢ 逊 Trainium、⾕歌 TPU、英伟达 GPU、AMD GPU。 算⼒采购承诺的具体⾦额在本稿中仍为空⽩，仅说明：绝⼤部分为算⼒ 和基础设施，⼀部分须在 2030 年底前⽀付，其余主要落在 2031〜 2045 年之间。据媒体报道，相关承诺总额约 5,180 亿美元 ，其中约⼋ 成不可撤销——这⼀数字以正式修订稿为准。 贡献 10 万美元以上的客⼾：超过 11,900 家 贡献 100 万美元以上的客⼾：超过 1,900 家 贡献 1,000 万美元以上的客⼾：约 250 家 7 ⻛险因素中，公司坦承： ⼋、最特别的部分：治理结构 如果说财务数据讲的是「它有多能赚钱」，治理结构讲的则是「谁说了 算」。这是 Anthropic 与所有科技公司 IPO 最不⼀样的地⽅。 【公益公司（PBC）】 作为特拉华州公益公司，董事会在法律上必须平衡三⽅利益：股东的经 济利益、受公司⾏为实质影响者的最佳利益，以及章程写明的公益⽬ 的。换句话说，董事会可以合法地为了安全⽽牺牲部分利润。 【五类股票，各管⼀摊】 多年期「照付不议」（take-or-pay）合同可能导致算⼒闲置 公司过去 低估过 ⾃⼰的算⼒需求，正转向在专⽤数据中⼼直接租赁芯 ⽚ 部分融资安排要求独家或优先的芯⽚采购承诺 某些商业协议违约，可能触发信贷协议与可转债的交叉违约 A 类 ：本次公开发⾏的股票，每股⼀票，享有分红与清算权，不可转 换 N 类 ：经济权利与 A 类相同，但⽆投票权；主要由战略合作伙伴持 有（如亚⻢逊的可转债将转为 N 类股），转让给⽆关第三⽅时转为 A 类 T 类 ：仅 1 股，由「⻓期利益信托」（LTBT）持有，没有经济权 利，但有权选举和罢免 T 类董事——⽽ T 类董事构成董事会 多数 F 类 ：仅 1 股，上市前发给七位联合创始⼈组建的「创始⼈ LLC」， 没有经济权利，但固定享有全体股东表决事项中 50.1% 的投票权 （包括选举⾮ T 类董事） 8 【⻓期利益信托（LTBT）】 由五名与公司没有财务利益关系的受托⼈组成，专⻓覆盖 AI 安全、国 家安全、公共政策与社会企业。LTBT 不参与⽇常经营，但通过 T 类股 掌握董事会多数席位的任免权。 【这意味着什么】 对买 A 类股的公众投资者⽽⾔：董事会多数由信托决定，其余投票事项 由创始⼈的 50.1% 主导。招股书⾃⼰写得很直⽩，这种安排「可能实 际上消除 A 类股东影响重要决策的能⼒」。公司因此属于「受控公 司」，但表⽰只在提名与治理委员会上使⽤相关豁免。 九、公益承诺 招股书披露了⼏项罕⻅的安排： 对投资者⽽⾔，这是⼀项明确的稀释机制，需要在估值时考虑进去。 ⼗、安全研究 招股书⽤了不少篇幅讲安全，这既是使命，也被包装为竞争优势： E 类 ：上市后发给员⼯（不含联合创始⼈），仅对有限事项投票，⽆ 经济权利 上市时向「Anthropic 公益基⾦」发⾏ 846,840,960 股 N 类股 ，约 占 2026 年 6 ⽉ 30 ⽇完全稀释股本的 5% 此后股价每⽐上⼀个⾥程碑上涨 50%（以 IPO 价为起点），可再发 ⾏最多 2% 联合创始⼈承诺将个⼈股权的 80% ⽤于慈善 宪法式 AI（Constitutional AI） ：让模型对照⼀套书⾯原则，⾃我 9 ⼗⼀、⻛险因素速览 招股书的⻛险因素从第 26 ⻚开始，篇幅很⻓。最核⼼的⼏条： ⼗⼆、我们怎么看 把这份招股书读下来，有三点印象最深。 第⼀，增⻓质量⽐增⻓速度更值得关注。 收⼊同⽐增⻓ 13 倍并不罕⻅ 评估、批评和修改回答；原则围绕「⼴义安全、⼴义合乎伦理、遵守 准则、真正有帮助」展开 机制可解释性 ：逆向⼯程模型内部机制，以发现潜在的失效模式 主动限制发布 ：⻛险因素中提到，若能⼒跑在安全措施前⾯，公司可 能推迟或限制模型发布，并以 Mythos 模型仅通过「Project Glasswing」向少数机构开放为例 必须⼀直站在最前沿 ：⼀旦模型落后，收⼊与融资能⼒都会受损 「闭环」⻛险 ：⽤现有模型研发下⼀代模型，错误可能跨代累积，能 ⼒可能跑在安全前⾯ 训练失败 ：⼤规模训练可能失败或不达预期，公司承认过去发⽣过 算⼒获取与预测 ：与巨头争抢算⼒、云⼚商分配决策、⻓期承诺可能 闲置 模型被滥⽤或「以⾮预期、未对⻬或⾃主的⽅式⾏事」 客⼾与渠道集中 ：少数客⼾与云⼚商贡献⼤量收⼊，⽽云⼚商同时是 投资⽅ 经营历史短 ：⾼速增⻓未必可持续 监管与诉讼 ：版权、数据、AI 专⻔⽴法都在变化 治 龙头，T链\"轴承+万向节\"双线卡位。公司万向节、轮毂单元、轻卡传动轴居全球前列，等速万向节系统已进入重点用户配套。核心看点：①轴承——市场预期独家供应特斯拉Optimus十字圆锥滚子轴承、微型滚针轴承，单台合计约28套，覆盖髋肩腕关节及手指脚趾执行器，随T人形量产放量；②万向节/传动——三球销万向节累计供货超700万套，等速驱动轴等传动部件间接供货特斯拉（公司披露口径），主业基本盘扎实；③人形高精密轴承及传动模块打开第二成长曲线，是T链执行端稀缺标的。 4、【杰创智能】聚焦具身智能+公共安全高付费场景，战略投资头部具身企业魔法原子，20亿定增加码智算云+具身智能。采用自研大脑+外购本体模式，多型号安防机器人已实现商业化落地。 5、【卧龙电驱】人形执行端全栈布局，覆盖电机、伺服、关节模组、灵巧手全品类；机器人产品占2025年营收约3.3%。控股85.7%浙江希尔机器人，希尔联合智元、上虞国资设立杭绍具身智能创新公司（上虞40%、希尔30%、智元30%），深度绑定智元生态，受益人形量产放量。#文字观点", "publish_time": "2026-10-26 10:10", "tags": ["建议关注标的（感知→执行→应用）", "文字观点"]}, "post:2026-10-26T08-38:d8b1f53f4b7c": {"id": "post:2026-10-26T08-38:d8b1f53f4b7c", "kind": "post", "title": "2026-10-26 08:38", "source_label": "帖子正文", "excerpt": "【东财汽车】星源卓镁信息更新#业绩拐点层面：二季度由于奉化工厂着火影响，收入没有如期释放，但增加的人员费用比较刚性，另外三电壳体新项目量产初期良率较低，导致公司毛利率为负；三季度边际方面，公司镁合金三电壳体收入预期会有明显释放，目前良率也爬到75%-85%的水平，三季度收入和毛利率环比都会有显著改善", "content": "【东财汽车】星源卓镁信息更新#业绩拐点层面：二季度由于奉化工厂着火影响，收入没有如期释放，但增加的人员费用比较刚性，另外三电壳体新项目量产初期良率较低，导致公司毛利率为负；三季度边际方面，公司镁合金三电壳体收入预期会有明显释放，目前良率也爬到75%-85%的水平，三季度收入和毛利率环比都会有显著改善。#成长性层面：这一轮汽车和人形机器人镁合金爆发的机会公司大概率都能抓住，未来很有希望从小公司成长为中型公司。 车用业务方面，三电壳体是下一步镁合金放量的主要部件，公司在这个领域已经走完了从0到1的阶段，即客户层面的从上汽单一客户延伸到吉利、小鹏、小米、零跑等更多主流客户，公司良率从初期的40%-50%爬升到了75%-85%，目前公司三电壳体产品供不应求，且基本都是供主流车型，未来车型延伸空间很大，下一步比亚迪也有望切换到镁合金，从1到10的爆发阶段将很快来临。预计明后年基本以产定销，27-28年有效产能分别为15/25亿，预计明年三电壳体出货120-150万套，对应收入8亿。远期车用镁合金用量预期可达50kg以上，单车价值量2000元，总市场市场400亿。 人形机器人单价很超预期，且国内多数主机厂已有确定定点。旋转和直线关节壳体、覆盖件用镁合金是大趋势，单机价值量大几千元，比车用的单价还高好几倍，且兑现更快。目前公司已经拿到优必选、智元、小鹏等国内主流客户的定点，海外1X（open ai投资的公司）已送样且大概率定点，单价比国内更高，figure AI和特斯拉目前仍以铝合金为主，下一代产品也有望转镁合金路线，公司目标也是成为主供。明年人形机器人收入预计可到大几千万，放量也很快。#利润方面：预计公司27年13亿收入，1.4亿净利润，28年20亿收入，2.7亿净利润，估值将快速消化到16-17倍，看到2028年，车用市值空间我们给65-70亿，人形机器人保守给30-40亿，相比目前的45亿市值具备1倍以上的弹性。#当前零部件观点：有些优质零部件三季报的业绩拐点已经出来了，很大概率已经提前见底，且像松原安全、星源卓镁等未来成长性仍然很好，我们认为底部出业绩拐点且有仍高成长性的公司将成为未来防守+反弹风格中市场的共同选择。 我们将星源放在零部件推荐排序top1，其次松原安全、继峰股份，以上均底部强推，欢迎随时交流及约零部件路演。#文字观点", "publish_time": "2026-10-26 08:38", "tags": ["业绩拐点层面", "成长性层面", "利润方面", "当前零部件观点", "文字观点"]}, "attachment:files/数据采集：模型核心瓶颈，斜率最陡峭的环节 261026.pdf": {"id": "attachment:files/数据采集：模型核心瓶颈，斜率最陡峭的环节 261026.pdf", "kind": "attachment", "title": "数据采集：模型核心瓶颈，斜率最陡峭的环节 261026", "source_label": "其他", "excerpt": "1、OpenAI入局具身AI的行业影响 ·技术路线收敛趋势： OpenAI入局前，具身AI行业技术路线分散，无统一成熟 框架，发展方向不明朗，核心路线分为 ROA、世界模型两类，两类路线均未形 成完善框架，处于持续优化迭代状态。此前行业参与主体多为初创企业，普遍 需基于大语言模型基座开发自有 agent或ROA，缺乏算法理解深度与数据、算 力资源支撑。", "content": "1、OpenAI入局具身AI的行业影响 ·技术路线收敛趋势： OpenAI入局前，具身AI行业技术路线分散，无统一成熟 框架，发展方向不明朗，核心路线分为 ROA、世界模型两类，两类路线均未形 成完善框架，处于持续优化迭代状态。此前行业参与主体多为初创企业，普遍 需基于大语言模型基座开发自有 agent或ROA，缺乏算法理解深度与数据、算 力资源支撑。而OpenAI具备大语言模型领域的算法理解优势，拥有更丰富的 数据与算力资源， 其入局后将推动行业技术加速收敛， 市场普遍期待机器人 GPT 时刻到来。 ·数据需求爆发逻辑： OpenAI入局将带来行业结构变化，对偏软件类公司形成 冲击，利好偏硬件类公司。同时将带动行业数据规模需求大幅提升，无论 ROA 还是世界模型技术路线，均离不开海量数据支撑。大语言模型时代已有数十年 积累的海量互联网数据，数据需求相对较低，而具身时代缺乏天然的物理世界 数据，需从0到1完成数据积累，未来要实现更优的模型迭代，海量数据是必 备基础。 · OpenAI布局进展：今年OpenAI已在数据与硬件领域启动相关布局，具体动作 包括：a. 年中招聘阶段开放数据采集相关岗位，目前人员已陆续到岗； b. 今年 已采购大量机器人数据，市场推测最新的 GPT6采用了几十万小时的机器人数 据。当前OpenAI核心方向为攻克机器人大脑，打造通用模型，未来也将布局 适配场景的硬件，硬件形态不会局限于人形，或采用轮式等适配不同场景的本 体形态，整体业务重心聚焦于机器人大脑及配套数据环节。 2、具身AI训练数据来源及特性 ·真机遥操作数据特性：真机遥操作数据包含两类采集方式，分别为真机自主运 行采集行为数据、人工控制机器人采集数据。该类数据的成本构成包含高额人 力成本与机械采购成本，是四类数据中速度最慢、效率最低、成本最高的类型， 但同时数据质量也最高，完全 1:1适配机器人使用场景，是最接近机器人本体 的工作数据。 ·第一人称视角数据特性：第一人称视角数据分为两类采集方案，一类是头戴相 机采集的ego数据，可记录人员工作过程中的动作轨迹；另一类是手部夹具配 套视觉、IMU、力矩传感器采集的乌米（ 5米）数据，两类数据均可搭配触觉传 感器形成组合采集方案。该类数据可脱离机器人本体但无法脱离人力，属于真 实世界数据但非纯机器人本体形态，数据质量较高，采集难度与成本较低，成 本结构以人力成本为主，设备折旧占比较低。 ·仿真与互联网数据特性：仿真数据是基于软件平台，输入文字指令或图片即可 生成客户所需的数据，无需依托人力与真机本体，仅需要优质平台及符合现实 世界物理规律的世界模型支撑，但当前存在 sim2real差距，在机器人公司的实 际应用中发挥的功能十分有限，大量最初以仿真数据为核心路线的公司，后续 均将真机数据与ego数据作为主要数据来源，仿真数据的应用价值有待未来技 术迭代与模型发展验证。互联网数据为各平台的海量视频等内容，核心作用是 为机器人提供物理常识、视觉与语言泛化能力、长序列语义推理能力，支撑机 器人完成长程任务与复杂环境识别。 3、数据采集环节市场空间测算 ·行业数据路线现状：当前行业内多数公司采用融合数据采集方案，包含外采数 据与自有采集数据，覆盖互联网数据、开源数据集、真机数据、仿真数据等多 类来源，不同企业技术路线侧重不同，分为真机派与仿真派两类，其中 CCQ intelligence 95%以上的数据为真机数据， 银河通用、 英伟达为仿真派代表企业； 整体行业当前数据结构以真机数据为主，真机领域内异构、遥操两类路线占比 均较高。 ·中性场景市场测算： 行业普遍将 1小时数据积累视为机器人 GPT时刻的门槛， 智源合伙人杨宝清、北美教授徐丹飞均公开提及该判断，行业需先达成 1小时 数据积累门槛，再观测模型效果确定后续采集需求。中性测算前提包括：数据 结构为真机20%、第一人称40%、仿真40%，单日工作时长假设为 8小时，有 效数据需折算时长，一般两到三小时工作时长仅能产出 1小时有效数据，匹配 年度工作日假设折算后，未来两三年数据环节中性市场规模为 200亿元。 ·配套硬件需求测算： 配套硬件主要分为真机与 ego采集工具两类， 中性场景下， 2000万小时真机数据对应 2.7万台机器人采购需求，按单台 20万元计算，对 应采购市场规模54亿元；ego采集工具含夹具、头戴环等， 44000万小时数据 需求对应4万套采购需求，按单套 1万元计算，对应市场规模 4亿元。各环节 价值量排序为：数据环节空间最大，其次为本体设备， ego设备价值量最小。 4、数据采集产业链及玩家梳理 ·上游硬件环节：上游硬件核心品类包含本体、机械臂、 ego采集工具、触觉手 套、光学动捕硬件及平台、软件平台，各品类代表公司及业务进展清晰：本体 领域优必选去年近 10亿订单来自数据采集，宇树、智源均有相关布局，乐聚去 年人形收入大部分来自数据采集，今年该业务增速较快； ego数据工具领域代 表公司包括奥比中光、五一一世界、蜜蜂科技，奥飞娱乐参股的诺依腾已布局 动捕设备业务，同时延伸至数据领域；触觉手套领域代表玩家为弗莱、汉威； 数采灵巧手领域帕西尼已启动上市辅导，零星草图拟赴 H股上市。上游环节今 年已经开始贡献收入，具备一定技术壁垒，发展确定性较高。 ·中游数据生产环节：中游数据生产属于重资产环节，需采购设备、部署场地， 为下游客户提供任务设计、采集、清理到服务的全链条服务，行业玩家分为四 类：a.第三方数据公司：代表包括海天瑞声、数矿，一级市场公司光轮智能估值 约一两百亿元，此前以仿真业务为主，目前同时布局仿真与真机业务，打造涵 盖标准制定、标注等全流程平台，核心竞争力在于数据管理能力、采集标准制 定能力，可低成本高效采集数据，满足客户定制化、个性化数据梳理需求，未 来绑定大客户的企业有望成长为行业龙头，可参考 OpenAI合作的大型第三方 数据公司模式；b.地方人形机器人创新中心与数据采集工厂：北京、上海、浙江 等地均有布局，主要从服务支持行业发展、扶持地方产业、积累本地化适配数 据出发，为未来当地无人化及机器人应用落地储备能力； c.上下游延伸切入的 企业：数据采集市场空间广阔， 1亿小时对应百亿级市场、 10亿小时对应千亿 级、百亿小时对应万亿级，吸引上下游企业布局，硬件厂商如五一、蜜蜂、诺 依腾、帕西尼等均已延伸布局数据生产及销售业务； d.下游自采数据企业：模 型公司大多配有自有数据采集场，不会完全依赖外购或开源数据，数据来源分 为自有采集、对外采购两部分，部分企业会将部分数据对外 出售或开源，目前 行业处于发展初期，产业链边界相对模糊。 ·下游需求方：数据采集环节的下游客户涵盖三类主体，分别为模型公司、本体 公司、场景公司。当前行业整体玩家数量较多，除机器人相关数据业务外，也 涉及部分其他AI领域的数据业务。 5、机械组视角投资方向梳理 ·投资逻辑总述：当前物理 AI及大模型相关赛道梳理出三大核心投资方向，分 别为上游硬件卖铲子环节、平台软件算法供应商、数据服务商，各环节覆盖产 业链不同参与主体，具备独立受益逻辑。 ·核心赛道标的梳理：各赛道代表标的及受益逻辑梳理如下： a. 本体赛道：代表标的有宇树、优必选、智源等，智源拥有较多机器人数据采 集产品，下游布局大量采集业务；上伟主打消费级产品，受益于物理 AI或大模 型能力加速带来的产品效果提升。本体赛道具备两大受益逻辑：一是数据采集 真机需求带动本体出货增长，二是 AI成熟赋能企业迭代更优质产品。 b. 数据厂商赛道：代表标的有海天、凡拓、五一、风雨筑、索辰等，该环节是 本次行情逻辑最受益、市场空间最大的环节，相关标的为上周行情股价龙头。 c. 设备赛道：覆盖视觉、触觉、 IMU等细分品类，视觉类标的包括奥比、凌云 光、奥普特，触觉类标的包括福莱、汉威， IMU类标的包括华一，相关标的昨 日已被相关模型覆盖。 6、计算机组视角相关标的分析 ·计算机领域投资逻辑：物理 AI发展推动AI训练数据向三维空间物体运动、力 学交互等方向延伸，其数据核心分为三类：物理仿真生成的合成数据、三维视 觉设备采集的数据、经清洗标注对齐后可用于模型训练的高质量数据。当前核 心关注标的包括索辰、凡拓数创、海天瑞声、思看、奥比中光五家企业，覆盖 物理AI数据产业链不同环节。 ·核心标的逐一分析： a. 索辰：长期深耕CAE工业软件，在结构流体、电磁声 学等多物理场求解领域积累深厚，团队仅 200人左右时就拥有60多位数学和 物理学博士，可依托物理方程、仿真引擎计算物体在不同环境、受力条件下的 运动响应，是其切入物理 AI数据领域的核心基础。 2025年公司已将物理AI作 为单独收入项披露， 2026年上半年进一步发布大圣智能体、行者物理合成数据 平台及相关模型，形成覆盖物理仿真数据生成、模型训练的完整产品布局，其 中行者平台可生成视觉、力觉等多模态数据，面向具身智能、工业场景提供训 练支持，目前已开始批量确认收入，核心看点为原有 CAE仿真能力向规模化、 标准化物理AI合成数据能力转化。 b. 凡拓数创：主营三维数字内容生产、数 字孪生平台搭建、空间可视化，积累了大量三维场景资产、复杂空间建模及渲 染能力，可用于构建机器人虚拟训练环境，提供空间结构、物体位置、环境语 义等数据。2026年半年报明确围绕空间数据、仿真数据、虚拟本体数据、真机 本体数据四类物理 AI数据布局，目前已拥有超 300个城市级相关数据资源， 承载大量三维模型渲染平台，为后续数据生产提供空间资产基础，后续看点为 素材工具向实际订单的转化。 c. 海天瑞声：主营AI训练数据服务，具备成熟 的数据生产及质量管理体系，今年在多模态数据平台中新增具身智能素材及标 注子系统，支持多视角视频同步建模、机器人三维模型渲染，还布局了 3D点 云语义分割相关业务，核心看点为原有 AI训练数据质量体系向价值量、技术 复杂度更高的具身智能数据标注领域迁移。 d. 思看聚焦高精度三维空间数据采 集，奥比中光布局 3D机器人视觉、本体数据采集设备。 ·投资总结：物理AI相关数据是机器人本体放量前的核心前提，相关环节有望 在产业发展中率先受益。目前还有更多涉及相关业务的标的可供挖掘，可进一 步对接获取相关研究信息。 Q&A Q: OpenAI入局机器人模型对行业带来哪些变化，数据采集环节为何被视为核 心瓶颈？ A: OpenAI入局将加速行业硬件和算法技术收敛，改变此前技术路线发散的状 态，同时利好偏硬公司并对偏软公司造成冲击。在具身智能时代，由于缺乏天 然的物理世界数据， 必须从 0到1完成海量数据积累， 数据采集成为斜率最高、 最陡峭的环节，增速可能达到 10倍至百倍，是模型放量期最重要和最大的边际 增量方向。OpenAI已开始布局数据和硬件，采购了大量机器人数据。 Q: 机器人训练数据主要有哪四种来源，各自具备什么特点？ A: 机器人训练数据主要有四种来源：第一种是真机遥操作数据，包含自主行为 和人工控制，速度最慢、效率最低、成本最高，但质量最高且最接近本体；第 二种是第一人称视角数据，包括 ego数据和夹具数据，可脱离本体但不能脱离 人，质量较高且采集难度和成本较低，成本以人力为主；第三种是仿真数据， 基于软件平台生成，不依赖人和真机，但存在 sim to real gap，目前发挥功能有 限；第四种是互联网数据，数据最海量，主要用于提供物理常识、视觉与语言 泛化及长序列语义推理能力。 Q: 目前各机器人公司在数据路线上的选择及整体现状如何？ A: 大部分公司采用融合数据方式，结合互联网数据、开源数据集、真机数据和 仿真数据，并存在外采与自采的结合。行业内分为仿真派和真机派，例如 Physical Intelligence 大规模使用真机遥操数据占比超 95%，而银河通用和英伟 达则更偏向仿真数据。总体来看，当前数据结构仍以真实数据为主，其中真机 数据占比较高，且真机数据中异构和遥操作两种方式应用较多。 Q: 机器人数据环节及对应硬件的市场空间测算是多少？ A: 中性测算下，假设行业积累 1万小时数据，结构为真机 20%、第一人称40% 和仿真40%，每天有效工作1小时，数据环节中性规模约 200亿元，对应真机 需求2.7万台约54亿元，ego工具4万套约4亿元。乐观测算下，假设 5年以 上维度积累10亿小时数据，真机和第一人称各半且设备降价 50%，整体数据 市场约3000亿元，对应真机67万台约670亿元，ego数据约50亿元。 Q: 机器人数据采集产业链的上下游环节及代表公司有哪些？ A: 产业链分为上中下游。上游硬件为卖铲子逻辑，包括本体、 ego工具、触觉 手套及数采灵巧手等，确定性高且今年已有收入贡献。中游数据生产偏重资产， 包括第三方数据公司、各地人形机器人创新中心和数据采集工厂、上下游切入 公司以及自建数据采集场的下游模型公司。下游采购方主要为模型公司、本体 公司和场景公司。 Q: 机器人数据采集环节有哪些受益方向及投资标的？ A: 投资标的主要分为三个受益方向：第一个是上游硬件卖铲子逻辑，本体标的 包括宇数、优必选、智源和上伟；第二个是数据服务商，包括海天、凡拓、五 一、风雨路、锁城等，该环节市场空间最大且为近期股价龙头；第三个是平台 软件算法及设备供应商，视觉设备包括奥比、凌云光、奥普特，触觉设备包括 福莱、汉威，IMU包括华一，以及欧也等标的。 Q: 物理AI数据训练的主要方向是什么，计算机板块有哪些相关投资标的及业 务进展？ A: 物理AI数据主要包括物理仿真生成的合成数据、三维视觉设备采集的数据 以及经清洗标注对齐的高质量数据。计算机板块标的中，索辰科技利用 CAE仿 真引擎生成合成数据， 2026年上半年发布行者物理合成数据平台并已批量化确 认收入；凡拓数创积累三维场景资产， 2026年半年报提出围绕 4类物理AI数 据开展业务并披露超 300 个城市级数据资源；海天瑞声新增具身智能采集和标 注子系统，支持多视角视频同步建模及 3D 点云语义分割；思看科技关注高精 度三维空间数据采集，奥比中光关注机器人 3D 视觉及无本体数据采集设备。", "status": "extracted"}, "post:2026-10-26T10-06:abcf8d8b0a76": {"id": "post:2026-10-26T10-06:abcf8d8b0a76", "kind": "post", "title": "2026-10-26 10:06", "source_label": "帖子正文", "excerpt": "端侧AI行业跟踪更新： 存储对端侧的影响：消费级DRAM、NAND在2026年四季度价格涨幅将快速收敛，2027年上半年有望出现明确价格拐点；DRAM供应格局仍偏紧张，但涨价幅度不会像2026年一样猛烈。", "content": "端侧AI行业跟踪更新： 存储对端侧的影响：消费级DRAM、NAND在2026年四季度价格涨幅将快速收敛，2027年上半年有望出现明确价格拐点；DRAM供应格局仍偏紧张，但涨价幅度不会像2026年一样猛烈。存储涨价对SoC企业的利润影响、对下游需求的压制主要集中在2026年二三季度，后续将逐步缓解；2027年存储涨价影响将明显减弱，叠加下游需求回暖，端侧企业业绩改善将逐步显现。 端侧通讯模组：是端侧AI产品的必备组件，尤其当前较多应用依赖云端推理，云端调用、数据同步及设备互联增加蜂窝、Wi-Fi与蓝牙连接需求，模组厂商正从传统数传模组向AI模组升级，是当前优先级最高的关注环节，龙头移远通信已进入业绩爆发阶段，集成存储的通信模组通过提前囤货额外受益存储涨价成本传导。 端侧SoC芯片赛道：2026年二季度到2027年一季度处于业绩逐步爬升阶段，2027年下半年有望进入多点开花阶段；业绩兑现需要足够多的新品发布，跑出受欢迎的放量产品后带动ASP提升，才能转化为实际业绩增长。国内厂商正在推进AI化升级，提升算力与大模型容纳度，同时国产芯片性价比持续提升，具备替代海外高通市场份额的潜力，优先级略低于通讯模组。 端侧投资逻辑：本轮行情前期主要交易端侧新品预期、产业催化与存储价格拐点预期，大的行业景气与全面业绩拐点与接续成长逻辑预计要到2027年Q2-Q3才能明确见到，通信模组业绩拐点靠前，传统消费电子龙头、SoC厂商的业绩拐点均相对靠后。一类以模组为主以“价量齐升+成本传导”并重（如移远、广和通、美格、全志、星宸、晶晨），在当前上游存储涨价压力下通过提价与内置存储水涨船高带动收入与毛利改善，另一类以Soc芯片为主以新品放量/结构升级为主导（如瑞芯微、炬芯、乐鑫、蓝讯、恒玄），后续存储降价带来端侧量增与结构性产品价值量提升是核心。 前期调整制约因素：第一，2025年起存储持续抬价，同时相关补贴消退，对消费电子板块形成一定打压，居民购买意愿和购买能力有所下降；第二，端侧AI产品吸引力不足，部分前期市场期待较高的产品（如AI眼镜）实际使用效果存在弊端，整体呈现“可有可无”的状态，板块表现未达市场预期；第三，市场存在端侧AI需要类似coding的爆款场景才能盘活的声音，板块预期迟迟未能兑现。 后续不及预期的风险：关于“存储后续降价→端侧AI成本缓解→业绩修复”的逻辑，短期只能成立为‘涨幅收敛、非显著降价’，中期存在分化与预期差。2026年三季度存储涨价斜率已明显收敛（DRAM合约价+13%-18%，NAND+10%-15%），边际成本压力缓和利于端侧板块链条估值修复；但行业共识亦提示价格高位将延续较长时间，实质性回落最早或在2027年下半年，且难回到2025年前水平，所以市场线性预期迅速降价带来大幅利润弹性的预期在时间与幅度上偏乐观。尤其多数端侧SoC并不像通信模组一样内含存储，存储由整机客户自采，所以未来存储降价对SoC厂商成本端直接影响有限（如瑞芯微、炬芯、乐鑫、全志、蓝讯、恒玄）；真正受益更可能体现在下游整机BOM压力缓和后需求回暖/备货改善的量端传导，而非SoC厂商自身成本线快速下降的价端传导。因此，成本缓解带来端侧SoC利润弹性的交易在方向上成立、但幅度与节奏存在预期差，主导变量仍是新品放量与结构升级的兑现度。---xz#文字观点", "publish_time": "2026-10-26 10:06", "tags": ["文字观点"]}, "post:2026-10-26T21-32 9月#SAF出口15.70万吨创26年新高、出口均价16272元/吨（环比+11.2%）。业绩端，#山高环能26Q1-3归母净利润9116.88万元（同比+73.29%），其中Q3同比+116.47%、环比+22.08%，26Q1-3毛利率29.45%（同比+6.68pct），自产油脂比例提升、低毛利外采收缩逻辑持续兑现；#朗坤科技26Q1-3归母净利润2.84亿元（同比+13.91%），Q3单季利润短期受所得税补缴及减值计提扰动，公司公告前三季度分红预案（每10股派现1元），期待#通州项目投产贡献自产UCO增量。建议沿两条主线布局：原料端关注#朗坤科技、山高环能；加工端关注#卓越新能、嘉澳环保 等具备SAF产能的炼化企业，受益SAF扩产与UCO量价齐升。#AI算力硬件、PCB景气延续#盈峰环境：算力租赁进入兑现期。26H1智云计算收入6.86亿元（同比+3436%），其中算力租赁收入6.74亿元、占总营收8.6%，算力相关使用权资产53亿元，第三增长曲线逐步兑现。#晨丰科技：配售电量利齐升，叠加AI检测弹性。公司间接持有康代智能约8%股权，其PCB及IC载板AOI设备有望受益AI服务器与先进封装扩产；26H1配售电收入0.98亿元（同比+52.55%）、毛利率25.4%（同比+3.1pct），科尔沁智算中心已完成规划设计，#“配网+算电协同+AI检测”布局渐成。#文字观点", "publish_time": "2026-10-26 07:53", "tags": ["建议关注", "绿色动力", "创业环保", "UCO出口均价", "SAF出口", "山高环能", "朗坤科技", "通州项目", "AI算力硬件、PCB景气延续", "文字观点"]}, "attachment:files/周策略：底部确定 261025.pdf": {"id": "attachment:files/周策略：底部确定 261025.pdf", "kind": "attachment", "title": "周策略：底部确定 261025", "source_label": "其他", "excerpt": "周策略：底部确定 2026- 10-25 22:23:00 【摘要】：每周周策略，不读不要做交易！周五下午的反弹，终于让市场喘了一口气。", "content": "周策略：底部确定 2026- 10-25 22:23:00 【摘要】：每周周策略，不读不要做交易！ 周五下午的反弹，终于让市场喘了一口气。前面我很多基金经理朋友盘中的工作 已经简化成一件事，看自己手里的股票，什么时候又被拿去完成风控任务强制平仓。 这周最重要的变化，是持续的承接开始打断这种负循环。对市场的态度可以往前 走一步：短期先按超跌反弹处理，中期开始寻找可以逐步建仓的机会。 还是先讲海外，海外宏观 最近中东有几个变化，美国调整中东使馆人员安排，美国国防部长近期访问以色 列，以色列大选与美国中期选举临近，以及航母在往伊朗开。 油价已经在定价中选前就动手了，航母往那开，可以服务于威慑，也可以为行动 做准备，现在还看不清楚。 我倒认为中期选举之前的概率较低，一个理由是部分航母仍在途中，按当时判断 还需要约一周才能到位，也不排除川普最后时刻服务于选举，临近选前搞个极限施压大和解。 美国和伊朗现在各自底线距离较大，核心还是海峡的控制权。 假设中选前没搞定，有两种流行推演，一种是特朗普没有了眼前选票约束，升级 行动的空间会更大，另一种可能是如果民主党拿下国会两院，战争支出和后续授权可能面对更多阻力。 我觉得美国现在问题很多，处处要用钱，财政支出、军事支出和 AI 资本开支都 在争夺资金，而中东是几项压力中，相对可能通过政治表态或斡旋出现边际缓和 的一项。这里没有必要去押注，我觉得做好这两种情况的分别应对就好了。 期看黄金这里网格交易应对是最优解，3900 的支撑还是比较清晰的。 下周看美联储， 市场普遍认为这次不会加息， 更重要的是， 对 12 月以及 2027 年 政策路径能释放什么信息，看看沃什怎么表态吧。 当前核心还是通胀，而通胀的根源还是在油，伊朗问题一天不解决、我觉得美联 储就很难实质性转鸽 这周还有个现象， 原来基本同向的美债收益率和美国科技公司的债券收益率走势 分化了， 这说明，对美国科技公司的担忧已经变了，从 “利率太高导致借钱困难” ，转向 “如果未来增长放缓，企业还能不能覆盖投入与债务” 。 仔细查一下 CoreWeave（这次北美下跌导火索）的债券，把这种分化展示得更 具体。部分无担保债券价格跌到面值八成至八成半附近，收益率约 15%，有项 目合同支持的贷款则仍相对稳定，市场开始担心信用问题了。 我对美股的核心判断是情绪已经非常悲观。从高盛主经纪商数据看，过去两周对 冲基金减持科技股的力度达到过去十年最高水平之一，周四卖盘尤其集中，基本打到上一轮那个帅哥基金经理爆仓的时候的悲观情绪了。 但是实际上标普剔除 AI 股的组合却上涨接近 5%，说明美股也在搞避险交易。 实际上美股估值贵不贵呢？ 其实从市盈率角度， 纳指与半导体指数的一年远期市盈率已经回到接近 2022 年 底部的区域，22 年可是非常惨的宏观，但现在美国经济显然比 22 年要好太多 了。 所以， 在市场对 AI 投入的悲观程度已经很高的情况下， 其实适合用 QQQ 的 看多期权来表达一下仓位。 之所以用期权，而不是股票，就是因为接刀子风险还是大，适合用期权来博弈一 下中选行情。 然后下周要出季报了。 美国时间 10 月 28 日，美联储决议与谷歌、微软财报集中出现，29 日还有亚 马逊业绩。按北京时间，重点在 10 月 29 日与 30 日凌晨。这个窗口会同时给 出利率路径和云厂经营两类信息，也是判断市场可能选择方向的关键节点。 首先要看，两家头部模型厂商之外，增量需求来自哪里。 云增速预期本身已经很高，因此财报考验还包括预期差。收入维持高增长，股价 仍可能反应一般；如果长期租金、客户结构和现金流解释得更清楚，反弹才更容易得到支持。 其次要看长期租金、出租率与交付。补充材料按云业务利润率、运营费用、六年 折旧等假设，测算未来云收入需要保持约四成复合增长，才能支撑相应资本开支安排；当前部分高频数据仍在这条要求线之上。 财报后的两条路径很清楚。如果盈利与租金稳健、现金回收能够解释投入，股价 却仍因情绪被继续抛售，超跌修复的条件可能更好；如果云业务自身也出现盈利瓶颈，长期租金和收入指引转弱，高负债与大额投入会让下行情景更难锚定，跌是跑不了的。 注：上面这段看不懂没关系，到时候出了财报把问题扔给 AI 问一下就行了。 AI 资本开支降温、模型和芯片利润率被竞争压低，对原有股东可能很痛苦，却 可能给应用扩展创造更便宜的基础条件， 下一阶段可能北美软件里面能跑出来的 会比较强。 然后讲讲国内。 国内这一部分抓住最有用的变化就够了。总量需求仍然偏弱，但局部数据开始改 善， 9 月社会消费品零售总额同比增长 1.1%，除汽车外增长 3.9%。这个水平说 明消费总体仍有压力，但品类分化明显。 房价这边， 9 月一线城市新房价格环比上涨 0.1%，二手房上涨 0.2%；上海新房 和二手房同比均已转正。这里可以确认的是，部分核心城市的边际情况改善，上 海的回暖是最明显的，三四线压力仍大，人口趋势也限制了强反转的空间，所以整个传统行业内需里面我看不到什么特别强的， 可能等明年白电跌透了会好一点，按高股息去处理。 然后内需方面最强的应该是国产算力的需求。 我一直说，国产比海外多一条命，意思就是国内的，十五五期间算力网建设可能 新增约 4 万亿元直接投资。这里包含芯片、机房、电力、网络、设备和服务等 不同环节，市场终究会反应过来，寒武纪的三季报就很好的说明了这一点。 然后就是大盘。 本周对 A 股的核心判断，是急跌阶段有机会向磨底震荡过渡。周五的持续承接 改善了短期买卖力量对比，可以开始寻找分批布局个股的位置。 对反弹保持参与意识，同时给筹码整理留出时间，是目前更合适的态度。 有人把这次与 924 直接比较，我觉得没到那个程度，当时的市场位置、政策变 化和筹码状态，与现在差别较大。 短期先按超跌修复看待，反弹逐渐得到资金和盈利支持，再提高对行情级别的判 断。 最关键的是连续下跌已经释放了部分交易压力，稳市买盘也开始改变预期。继续 完全沿用主跌阶段的思维，可能错过市场从极端失衡恢复正常的过程。磨底并不要求每天上涨，它通常总是会反复试探。 当前市场同时存在几类人。高仓位投资者希望反弹减轻净值压力，低仓位资金希 望抓住修复，配置资金需要更稳定的价格环境，短线资金则在找最容易形成赚钱效应的方向。不同目标决定不同动作，也决定了反弹初期很难出现所有股票整齐上涨，所以要对市场磨底的过程有充分耐心，不要轻易下牌桌。 这一轮跌到这里，我相信大家应该能看清了，这不是基本面能够解释的行情，前 期一些科技公司的订单和产业反馈依然积极，股价却持续快速下跌。只从当季经营解释，很难。 更多是机构风控出来的，价格下降触及风险阈值，资金降低仓位，新的卖盘再推 动价格下降。这个过程一旦形成，好的基本面也可能暂时无法提供足够承接。 部分公募产品还可能面对基准与风格匹配要求，有资管新规的影响，所以这个月 机构减仓的问题被集体放大了。 这一轮下跌也再次教育了我们不要太相信什么长期耐心资本， 长钱也可能做出很 短的动作。 这次周五的买盘还是很重要的，两点以后持续在买，没有说不跌就停了，才是这 次周五能护起来的核心，周五的重要性，在于承接有了持续性。市场最担心的情况，是买盘出现一阵后离开，剩下的止损盘继续往下砸。如果下周能持续按周五的情况这么买， 我觉得市场就很快会有社会资金入场， 而不是大哥一个人自己买。 当然周一即使有兑现盘，或者亏损割肉盘我觉得也不用慌，最核心的还是筹码问题，上次直播课分析的非常透了，筹码收集到一定程度，拉升自然会来。 接下来一个合理的路径，是先反弹、再分化，经过若干轮换手后，逐渐把急跌变 成震荡，把筹码慢慢收集到手里。 反弹早期，资金倾向于选择上涨阻力较小、催化较密集的方向。原来机构重仓的 龙头虽然跌幅很大，但持有人多，反弹时的潜在卖盘也可能多。 我觉得软件和机器人已经受到资金关注，也出现了可以继续研究的新催化。软件 对应模型成本下降后的应用拓展， 机器人对应通用模型进入物理任务的新增叙事。它们在短期给资金绕开部分旧拥挤方向提供了选择。 所以深信服、拓普之类的持仓，我觉得还是可以拿一拿。至于原来亏损很久一直舍不得割的的一些僵尸仓位，我强烈建议按照我上周四说的，换对应的创业板、科创 50、沪深三百，个股属于哪个就合并哪个，把自己的僵尸股合并在大哥护 盘收集筹码的方向上，才享受到大哥未来的护盘抬轿子。 因此，行情级别先按超跌反弹处理，配好 ETF 保证不下牌桌，中期配置看着后 面的大哥的买入情况逐步推进，等银行开始趋势性的补跌，就开始做一些被前期 机构错杀的一些白马做超额收益。 个股这边，首先国产算力我看是有个反弹的。 不管是寒武纪、 海光， 还是中芯国际、 芯原什么的， 都是这一轮被杀的非常惨的， 但实际上基本面并没有大雷，这一轮是被杀估值杀的狠的，我觉得只要大哥继续流入科创 50，反弹没什么悬念。 然后海外这边我觉得跟随美股的可能性比较大，如果美股接下来走的比较好，大光的持续性就会好一点，否则的话就会走分化，还是中际旭创、新易盛、小的联特科技这些。软件、机器人、端侧分别对应深信服、拓普、立讯，最近这几个都比较强。 新能源这边宁德肯定是被杀多了， 一度杀到 1 万亿以下， 明年 pe 杀到 10 倍， 这个有点夸张了，再悲观看 320 还是可以看的。紫金矿业我觉得也很便宜了， 适合网格。 化工这边不少标的也被错杀了，什么荣盛石化之类的，但是这些反弹肯定比较后 排，等市场转好再说吧。 其实大的个股观点没什么变化，该说的也都说了，先跟着大哥把这波修复吃到， 等市场开始普涨了我们再挖一些新的机会。 短线的话我觉得摩托车还行，春风动力吧，三季报很漂亮，最近也是错杀了，机 构买的也不多，筹码结构好，可以试试看，往上有个 20-30% 空间问题不大。 就说这么多，祝大家下周投资顺利！", "status": "extracted"}, "post:2026-10-26T09-23:206528fcb7f3": {"id": "post:2026-10-26T09-23:206528fcb7f3", "kind": "post", "title": "2026-10-26 09:23", "source_label": "帖子正文", "excerpt": "【东吴电新】锂电：悲观预期已充分反映，估值仅10x历史低位，推荐核心标的！观点重申： #锂电悲观预期已充分反应、预计27年需求好于市场预期、估值历史低位布局良机： 1）市场悲观预期27年不足20%增长、锂电龙头排产下调已充分反映在股价内，当前宁德27年11x，我们预计Q4排产较淡市场已有充分预期，但", "content": "【东吴电新】锂电：悲观预期已充分反映，估值仅10x历史低位，推荐核心标的！ 观点重申： #锂电悲观预期已充分反应、预计27年需求好于市场预期、估值历史低位布局良机： 1）市场悲观预期27年不足20%增长、锂电龙头排产下调已充分反映在股价内，当前宁德27年11x，我们预计Q4排产较淡市场已有充分预期，但27年行业可维持25%增长，宁德对明年增速维持20-30%预期，远好于市场悲观预期！ 2）锂电高位已回调50%，当前估值已降至10x，材料公司已估值不到10x，市场悲观预期已充分反应，叠加油价回升至100美元+，海外储能、动力需求依然强劲，支撑27年行业增长。 #产业链涨价陆续落地、行业估值低位。电池龙头盈利受消费税+出口退税合计对利润影响2分/wh左右，但市场已充分反应，27年业绩已充分下修，二线电池厂盈利质量稳健，预计单位盈利稳定；隔膜Q3头部单平利润有望升至0.2元/平，环比进一步提升；铜箔Q3涨价落地，单吨净利修复至0.4-0.5万；负极头部已顺价1k/吨，龙头单位盈利提升至0.25万。锂电业绩兑现度高，对应27年10x，达历史低位； #投资建议：龙头公司对应27年估值10-12x，低估明显，继续强推格局和盈利稳定龙头电池（推荐宁德时代、亿纬锂能、蔚蓝锂芯、鹏辉能源、比亚迪、中创新航、欣旺达）、以及具备涨价弹性和优质锂电材料龙头，推荐隔膜、铝箔、铜箔、六氟、结构件等环节（推荐恩捷股份、尚太科技、科达利、佛塑科技、璞泰来、新宙邦、鼎胜新材、富临精工、湖南裕能、天赐材料、诺德股份、星源材质、华友钴业、嘉元科技等，关注海科新源、德福科技、多氟多、万润新能、龙蟠科技、石大胜华等）。 风险提示：价格竞争超市场预期。#文字观点", "publish_time": "2026-10-26 09:23", "tags": ["文字观点"]}, "post:2026-10-26T11-18:525b44289850": {"id": "post:2026-10-26T11-18:525b44289850", "kind": "post", "title": "2026-10-26 11:18", "source_label": "帖子正文", "excerpt": "【开源中小盘】联检科技：控股华周智能布局机器视觉，#低位滞涨物理AI稀缺新标的物理AI的底座是真机数据，视觉感知硬件是获取这一数据的核心入口。人形机器人本体智能的迭代取决于大脑，而大脑走向成熟的前提是海量真机数据", "content": "【开源中小盘】联检科技：控股华周智能布局机器视觉，#低位滞涨物理AI稀缺新标的物理AI的底座是真机数据，视觉感知硬件是获取这一数据的核心入口。人形机器人本体智能的迭代取决于大脑，而大脑走向成熟的前提是海量真机数据；世界模型要在真实物理空间完成对物体的感知、理解与动态交互，同样离不开真机在真实环境下持续采集的时序视觉数据。在这一链条上，#视觉感知硬件既是机器人本体的感知器官，也是真机数据采集与具身交互的核心入口。 华周智能：以全栈自研的视觉硬件为底座，在物理AI的数据入口环节完成#\"硬件-算法-数据-场景\"的闭环布局。从硬件端看，视觉光源、工业2D相机、工业3D相机、读码器、工业镜头、视觉控制器六大核心硬件均为自主全栈研发。在软件算法端，自主软件SmartX（VisionTech）集成标定、定位、测量、识别、缺陷检测与深度学习分类等算子，配套视觉控制器形成\"硬件+软件+方案\"的交付闭环，官网披露其定位精度±0.01mm、生产节拍1200个/分钟、检测正确率99.9%以上。在数据端，公司已形成光伏EL缺陷检测、锂电焊后检测等AI质检项目中跑通\"样本-训练-部署\"的项目积累，汇流条焊疤检测准确率99.76%、漏检率0.24%，缺陷样本与算法迭代构成其在真机数据侧的积累。在应用端，终端覆盖3C电子、新能源、汽车、半导体、智能物流、医疗设备检测六大行业，场景验证向高端制造延伸。 华周智能业绩进入放量期，#当前阶段大致对应奥普特2017年前后，收购赋能后有望加速成长。从公告看，2026H1营收1.18亿元（2025年全年1.32亿元）、净利润2632.16万元（2025年全年150.08万元），净利率22.3%；本次交易对价不超过3.25亿元取得51.10%股权，对应标的整体估值不超过5.4亿元，按上半年净利润年化测算约10倍PE（测算值，最终以评估报告及正式协议为准）。从对标看，奥普特2017年营收3.03亿元、净利率25.05%，此后四年营收复合增速30.51%、归母净利润复合增速41.30%，驱动来自产品矩阵完善与绑定下游龙头客户，华周#在六大硬件自研、进入下游龙头品牌资源池优选供应商两项上已具备基础。同时，联检科技积累的存量检测客户资源可与华周形成客户与场景协同，未来华周智能有望在#多种AI场景加速导入，由定制化交付为主转向标准件与软件平台并重，#复制奥普特的成长路径。 📖报告链接：【联检科技（301115.SZ）：综合检测平台转型再落一子，控股华周智能战略布局机器视觉】开源中小盘...风险提示：并购整合风险；收购标的业绩低于预期；行业及技术迭代风险。 欢迎联系开源中小盘周佳/王悦#文字观点", "publish_time": "2026-10-26 11:18", "tags": ["低位滞涨物理AI稀缺新标的", "文字观点"]}, "post:2026-10-26T09-13:653786624a89": {"id": "post:2026-10-26T09-13:653786624a89", "kind": "post", "title": "2026-10-26 09:13", "source_label": "帖子正文", "excerpt": "风险资产在多资产间的性价比在提高 ▍组合策略：滞胀冲击，风险资产全面下跌 （1）滞胀交易的扩散，多资产组合承压。全球盈利增长看AI，通胀是既看AI、短期更看美伊问题。", "content": "风险资产在多资产间的性价比在提高 ▍组合策略：滞胀冲击，风险资产全面下跌 （1）滞胀交易的扩散，多资产组合承压。全球盈利增长看AI，通胀是既看AI、短期更看美伊问题。这两个问题短期都在恶化。另外，前者的AI capex-现金流-盈利预期螺旋也一定程度上依赖后者通胀预期的缓和。解铃还须系铃人，在看不到美伊问题彻底（至少表面上看要是新一轮）缓和之前，我们认为全球市场对滞胀的定价很难拐头。 （2）资产对滞胀的定价有多重？除美股现货相对滞后以外（VIX也在上升），其余主流资产已经开始。除美股、铜以外，其余主流大类资产的波动率都已升到60%甚至80%以上的水平（日经、黄金、白银）。对于非避险资产而言，升波的过程本身，即意味着回撤。 （3）多资产的平均相关性快速抬升。这是对美股的重要风险信号，前几次飙升见于25年末-26年初、24年末-25年初，对应美股的两轮回撤。下周FOMC会议+谷歌/微软/亚马逊财报 是重要信号点。 ▍A股策略：AI回落并非牛熊分界 （1）AI趋势回落并非熊市开端，非AI反而可能面临更有利环境：过往产业趋势对经济部门有广泛拉动，而AI短期产生挤出效应、财富效应失衡、市场分化罕见，传统经验不适用。AI已显性负外部性包括物料资源涨价、利率飙升、就业挤出。10年期美债利率与北美AI硬件股高度相关，若持续回落或促进海外非AI需求。 （2）AI二阶导修正与非AI估值收缩有望今年基本完成：本轮AI硬件估值压缩已与2022年新能源首轮调整相当。A股非AI处全球估值洼地，美、日非AI非金融龙头PE为33.5倍、23.0倍，A股仅15.6倍。 （3）后市K型分化收敛、行情宽度拓展：AI商业化增长焦虑仍约束单年投资规模，大幅虹吸难再现。非AI负面因素多已认知，低预期本身有利，出海板块的中欧摩擦、汇兑损失、地缘、长端利率抑制均有望改善。 （4）资金面出清需时间，ETF放量、融资去杠杆负循环阻断、活跃私募降至67.5%，但彻底出清仍需时间，动量与景气策略或弱势，PB-ROE低估值质量策略占优。往27年长期配置上看，增量关注两类行业：高股息且稳健盈利的白电、纺服、食品调味、火电；供给出清潜力的油运、快递物流、头部地产、部分锂电材料、石化中游。 ▍海外事件：欧债危机再起？ （1）欧洲主权信用风险从边缘国向核心国内部转移。截至2026年10月，法德10年期利差升至150.3bp、处2001年来99.8%分位，为2011年来最高。法意利差罕见转正至+39.8bp，法国收益率反超意大利。 （2）驱动在于中东能源冲击推升通胀、欧央行转向，叠加法国高失业、高赤字、高债务及利息负担V型反转，使法国被系统性重估。但欧元区银行CET1达16.0%、LCR达154.9%，主权—银行负反馈未形成，仍属“再定价”而非危机。美国财政账面脆弱度相近，但增长更强、私人杠杆更低、美元储备地位支撑可持续性更高。 （3）本轮利差走阔具“法国特异性”，非全球主权信用系统性重估；发达国家财政担忧升温下，黄金仍有交易性机会。 ▍美股策略：AI CAPEX、地缘和主权信用扰动下维持耐心 （1）Meta上调全年CAPEX指引下限至1350亿美元，特斯拉下调指引，未带动北美科技巨头CAPEX预期上调。截至10月22日，谷歌、亚马逊、微软、Meta及甲骨文2026年资本开支合计预期8245亿美元，与10月10日Meta财报前8244.9亿美元基本持平。 （2）临近中选，两党对AI监管和数据中心博弈加剧，叠加美以或重启对伊朗打击预期，短期美股延续轮动，资金从AI切向能源、防御性日常消费及或受益民主党横扫的医疗保健。 ▍港股策略：关注三季报拐点是否持续 （1）受AI CAPEX、地缘和主权信用冲击，本周港股跌幅显著。恒指和恒科PE分别收窄至9.6倍和13.4倍，恒科已低于去年4月7日“对等关税”后底部。后续需持续跟踪港股三季报验证业绩拐点是否持续，若成立，11月中旬是较好配置时点。 （2）短期除公用事业、电信、银行等红利板块外，关注：1）卖空占比高但受益海外AI硬件交易逆转的消费电子；2）无风险利率下行压低融资成本、或受益民主党横扫预期的CXO和创新药。#文字观点", "publish_time": "2026-10-26 09:13", "tags": ["文字观点"]}, "post:2026-10-26T09-17:07a02df395b1": {"id": "post:2026-10-26T09-17:07a02df395b1", "kind": "post", "title": "2026-10-26 09:17", "source_label": "帖子正文", "excerpt": "【食饮】周周谈116期：下周反弹后弱震荡，维持必选防御观点 🎯#当前市场共识偏向反弹而非反转，市场关注焦点集中在机器人与物理AI方向，大盘资金观望情绪浓厚，普遍偏好低位有业绩/主业支撑的标的，以个股选择为主。本轮回调核心是外围流动性压制，并非基本面恶化", "content": "【食饮】周周谈116期：下周反弹后弱震荡，维持必选防御观点 🎯#当前市场共识偏向反弹而非反转，市场关注焦点集中在机器人与物理AI方向，大盘资金观望情绪浓厚，普遍偏好低位有业绩/主业支撑的标的，以个股选择为主。本轮回调核心是外围流动性压制，并非基本面恶化；#后续若流动性边际修复或产业出现新叙事，成长板块或迎来阶段性反弹，但市场套牢盘压力仍重，四季度整体维持防御为主的思路，结构分化行情延续。 ☀️四季度建议采取哑铃配置策略：#底仓锚定高股息必选消费（乳制品为核心底仓），同时保留部分成长弹性标的，博弈明年内需政策预期与细分产业催化。 🌹乳制品：#攻守兼备，穿越多重宏观情景，以不变应万变。无论明年是经济复苏、经济弱磨底、流动性回流科技板块，亦或全球滞胀环境，乳制品均能跑出超额收益；若市场博弈内需政策预期，板块还将迎来估值修复行情，是四季度必选配置的核心底仓。#伊利股份：食品板块机构重仓首选，优先级居行业前列，当前已完成明年合理估值切换，三季报后有望溢价。#蒙牛乳业：港股红利消费代表，防御属性突出。当前估值较伊利更具性价比，明年利润有望达60亿以上，分红率存在提升空间，困境反转逻辑持续兑现。#新乳业：低温奶区域掌控力强，成本上涨期提价对冲能力优于常温乳企。EPS走势稳健，利润增速处于行业中位，兼具成长属性。#妙可蓝多：产业成长逻辑确定，内需行情下弹性充足。100亿市值以下为明确底部区间，对应明年股权激励目标估值仅20倍，建议持续摊薄持仓成本，赚取长期产业趋势收益。#上游牧场：行情进入震荡期，右侧核心看奶价催化。当前处于奶价淡季，12月下旬奶价大概率进入上行通道，股价有望同步启动，中长期奶价上行逻辑不变，无需过度纠结存栏数据。 🌹#白酒：行业磨底分化加剧，板块承接避险资金，静待动销拐点。行业仍处于库存消化阶段，暂无整体性大机会，核心作为筹码干净的板块承接避险资金；个股分化显著，重点跟踪动销与库存边际变化。#金徽酒/迎驾贡酒：周期已见底，三季度业绩下滑幅度收窄，确定性向上，机构关注度逐步提升，具备价值修复弹性。#顺鑫农业：新董事长上任点燃改革预期，产品结构升级跨度收窄（推出20-25元价位带产品）、拟扩充销售团队，低位股价启动后市场博弈情绪升温，建议持续跟踪改革落地进展。 🌹#啤酒&大众品：把握细分赛道阿尔法，布局业绩确定性与主题催化。#惠泉啤酒：国企改革逻辑持续落地，核心大单品势能逐步兑现，承接区域市场份额，成长路径清晰，珍惜小票改革带来的弹性机会。#金达威：厄尔尼诺最强受益标的之一。秘鲁鳀鱼减产推高鱼油价格，藻油替代趋势加速且配方替换后粘性极强；公司藻油产能持续释放，明年业绩弹性充足，产能期权带来持续股价催化。#民生健康：百年OTC维生素龙头转型大健康平台，21金维他基本盘稳固，益生菌、小金维他、戒烟药三大第二曲线加速放量；短期处于增收不增利的投入期，重点跟踪规模增速拐点与费用率下降信号。#文字观点", "publish_time": "2026-10-26 09:17", "tags": ["文字观点"]}, "post:2026-10-26T11-21:c4b6eb87a979": {"id": "post:2026-10-26T11-21:c4b6eb87a979", "kind": "post", "title": "2026-10-26 11:21", "source_label": "帖子正文", "excerpt": "📊📌中金：估值调到哪了？📉今年下半年中国资本市场回调幅度较大，沪深 300 / 创业板指 / 恒生指数 / 恒生科技自年内高位以来分别累计回调 20.2%/41.1%/18.9%/35.8%，年内收益均已转负，部分龙头公司已回调至接近 “924” 水平。", "content": "📊📌中金：估值调到哪了？ 📉今年下半年中国资本市场回调幅度较大，沪深 300 / 创业板指 / 恒生指数 / 恒生科技自年内高位以来分别累计回调 20.2%/41.1%/18.9%/35.8%，年内收益均已转负，部分龙头公司已回调至接近 “924” 水平。 💡我们认为经历明显调整后，A 股整体估值已经回落至历史均值以下，横向、纵向比较均已具备较好投资吸引力，具体来看： 🔹A 股市场整体估值已回落至历史均值以下，上周低点时沪深 300 股权风险溢价已经升至历史均值向上一倍标准差以上，对应指数历史多次低位区域。 📑根据 Wind 数据，截至 10 月 23 日，第一，A 股市场方面，沪深 300 指数前向市盈率 11.9x，前向市净率 1.1x，低于过去十年的历史均值（12.1x 和 1.2x），相比年内高点（14.7x 和 1.3x）回落 19.0%、15.5%。 📈沪深 300 股权风险溢价 6.2%，已升至历史均值 1 倍标准差以上，历史经验来看该指标升至此位置时，多次对应 A 股市场的低位阶段；第二，港股市场方面，MSCI 中国除 A 股指数前向市盈率为 8.2x，前向市净率为 0.8x，分别处于历史均值向下 1 倍、1.1 倍标准差附近。 📊恒生指数前向市盈率和前向市净率 10.5x/1.2x，低于历史均值；恒生科技前向市盈率和前向市净率 18.7x/1.8x，处于历史均值下 0.9/1.1 个标准差。 🔹创业板指市盈率已经处于历史较极端位置，低位时一度接近 2024 年 “924” 附近水平。 📌创业板指权重公司较多处于景气阶段，经历明显回调后现下指数前向市盈率为 22.9x，低于历史均值 1.2 个标准差，处于十年以来 4.7% 分位，股权风险溢价 1.6%，高于过去十年历史均值 1.7 个标准差，均接近 “924” 附近水平，处于历史较极端水平。 🔹小盘相对大盘估值回落，小盘此前局部高估值现象明显缓解。 📉今年年中，A 股一度出现结构性高估，小盘估值偏高，但随着近期市场调整，小盘相对大盘估值已经有所回落。 📋中证 1000 / 沪深 300 的市盈率 TTM 比值从年内高点 3.9 回落至 3.0，市净率 LF 比值从 2.0 回落至 1.6；中证 500 / 沪深 300 的市盈率 TTM 比值从年内高点 2.9 回落至 2.3，市净率 LF 比值从 1.9 回落至 1.6。 🔹大部分行业估值水平已低于历史均值。 📊多数行业的市盈率 TTM 已经处于历史均值以下，其中，非银金融、有色金属、食品饮料、电力设备、美容护理、传媒等板块的市盈率估值位于历史 25% 分位以下（2010 年至今）。 🔍当前市盈率超过历史均值的行业则包括农林牧渔、建筑材料、计算机、汽车、机械设备、煤炭等。 🔹大类资产比较：股债相对吸引力升至历史较高位置。 💴当前十年期国债收益率 1.6%，处于历史低位，而 A 股股息率在资本市场建设叠加市场回调影响下有所回升。 ✨根据股息率和国债收益率测算的股债相对吸引力指数目前为 184%，处于过去五年 90% 分位以上，权益类资产的相对性价比处于历史高位。 🔹国际比较：A 股整体估值在全球主要市场中明显偏低，具备较好投资吸引力。 🌐当前沪深 300 前向市盈率约 11.9x，港股恒生指数估值为 10.5x，根据 Bloomberg 数据，明显低于美国（标普 500，21.0x）、日本（日经 225，20.3x）、印度（SENSEX30，17.8x）、欧洲（Stoxx600，13.8x）等全球主要市场。 ⚠️A 股当前估值反映市场可能已经处于超调或过于悲观水平。 📉近期 A 股市场波动较大，市场整体估值再度下行，成交缩量较快。 🤔我们认为，外部扰动与资金面压力叠加，短期市场等待积极信号，国内基本面与中期逻辑并未改变，A 股市场仍有望延续长期、稳进趋势。 📢上周金融街论坛年会围绕稳市机制、投资端改革和流动性支持的部署，向市场释放政策积极信号，有利于逐步稳定市场预期、提振投资者信心。 🔎A 股整体估值已处于历史偏低位置，尤其是部分科技领域估值重新回到历史较极端低位水平，中期投资吸引力显著提升，当下全球货币秩序重构与科技叙事对 A 股的支撑逻辑没有改变，不必过于悲观。 🎯配置上，重回 “哑铃型结构”。 💡我们认为，在总量增长弹性有限、结构性高景气与市场风险偏好波动加大并存的环境下，“科技 + 红利” 的哑铃型结构有望成为兼顾盈利增长弹性、股东现金回报与组合稳定性的配置选择。 📌近期关注两条主线：第一，三季报业绩增速环比改善领域：例如上游部分有色金属、受益于 AI 高景气与海外需求的科技硬件等。 📌第二，高股息资产：国内长端利率处于历史低位，上市公司整体维持股息率与分红规模，股债相对吸引力上升，高股息板块再度成为资金配置的重要选择。50%的收益率？人工智能交易越来越疯狂了#文字观点", "publish_time": "2026-10-26 11:21", "tags": ["文字观点"]}, "post:2026-10-26T08-34:9989e79beead": {"id": "post:2026-10-26T08-34:9989e79beead", "kind": "post", "title": "2026-10-26 08:34", "source_label": "帖子正文", "excerpt": "🔥看好应用的观点 📈Token 价格暴跌、用量暴涨，这一大趋势浩浩荡荡、势不可挡。📈顺着这个大趋势，我近期一直在思考，到底哪些应用、公司能够从中受益。", "content": "🔥看好应用的观点 📈Token 价格暴跌、用量暴涨，这一大趋势浩浩荡荡、势不可挡。 📈顺着这个大趋势，我近期一直在思考，到底哪些应用、公司能够从中受益。 ⏳从目前来看，短期（1-3 年）最直观受益的是以 Seedance 搭配红果为主的生态，它正以摧枯拉朽的姿态冲击整个娱乐产业。生物、机器人、材料科学这类方向我还在持续研究。 🧮我算了一笔账，应用叠加模型业务，在未来 3 至 4 年，有望为字节带来 400 亿至 500 亿美元的年度经常性收入，这一规模将占到字节当前整体营收的 25%，而目前该业务占比目测还不到 3%。海外风险投资机构似乎还没有测算这笔收益，但这个逻辑看起来非常通顺。 🎬国内电影市场全年票房规模为 70 亿至 80 亿美元，红果今年的收入已经接近国内电影票房，预计 2027 年将实现全面超越。字节这套闭环逻辑十分顺畅： ✅Seedance 模型负责内容生成，形成训练数据飞轮 ✅番茄负责剧本供给，依靠多年网文积累挖掘爆款素材 ✅抖音承担极低成本获客以及爆款筛选的工作 ✅最终实现剧本成本低、制作成本低、获客成本低的优势 🤔在我看来，4 亿月活以及这套高效飞轮的底层原因，是国内优质娱乐内容供给相对不足，国内电影工业整体水平偏弱，不过芒果台近期的《后会友期》观感很不错；同时大众普遍承压，在应试教育的成长背景下，大部分人缺少丰富的日常娱乐方式。红果这类短内容刷看产品在国内具备天然优势，在网文生态、优质剧本供给的加持下优势更加明显。我以前也是起点小说的重度读者，《阳神》《无限恐怖》《龙蛇演义》这类作品，是我初高中阶段重要的精神消遣。 🔮再向更远的未来推演： 🔹视频生成模型的效果会持续迭代，一年之后生成内容大概率能做到和真人画面难以区分，当下大众对 AI 内容的抵触情绪会慢慢消退。 🔹字节依托红果在国内的强势地位，可以沉淀海量创作者内容用于持续模型训练，叠加剪映 CapCut，有机会长期维持技术领先。 🔹AI 会极大拓宽文本生成与创意产出的边界，相比过去，内容供给会做到量大、稳定且品质持续提升。 🚀因此，高质量 AI 内容大概率会在未来 2 至 3 年冲击海外流媒体的中低端内容市场，字节在国内跑通的商业模式，同样可以复制到海外，依靠极致的低成本优势碾压竞品。 🔹下一步它会冲击 YouTube、奈飞、迪士尼、华纳兄弟的中低端剧集与普通内容赛道，欧亚非拉等非英语市场机会尤为突出。 🔹全球电影票房规模为 350 亿美元，除去 YouTube，上述流媒体平台整体收入大约在 900 亿至 1000 亿美元。如果红果在海外复刻国内的成功，对应的收入体量有望达到 350 亿至 400 亿美元。 🔹假设 Seedance 能够守住市场份额，被大量短剧创作者高频调用，对应年度经常性收入大约在 100 亿至 150 亿美元，创作者可以把生成内容分发到多个平台。 🔹字节两条业务线同时变现，合计收入有望达到 450 亿至 500 亿美元，差不多相当于再造一个当下 Anthropic 或者 OpenAI 的收入体量，当然这两家公司年底的收入规模预计会达到这个数字的 4 倍。 🤼在这个赛道里，除非头部 AI 实验室调整战略或者实现通用人工智能，否则我认为只有 YouTube 具备与之抗衡的能力。但谷歌多条业务线推进乏力，机会大概率还是掌握在字节手中，它有潜力成为全球休闲娱乐内容赛道的第一名。 🌍实际上我认为，好莱坞以及美国本土相关公司，会被版权问题长期拖累，很难放开手脚发展，机会最终会落在国内这边。全球演员与影视剧组的生存处境会发生难以想象的变化，大概率会受到强烈冲击，失业率大幅走高，国内演员当下的处境已经是一个前置信号。#文字观点", "publish_time": "2026-10-26 08:34", "tags": ["文字观点"]}, "post:2026-10-26T12-51:649b98eecb18": {"id": "post:2026-10-26T12-51:649b98eecb18", "kind": "post", "title": "2026-10-26 12:51", "source_label": "帖子正文", "excerpt": "【华创计算机｜AI 】工业控制卡位物理AI核心入口，模型 TPT+AOP加速商业化20261026 🔹#工业是物理AI最具确定性场景：物理AI的核心是让AI理解物理规律，并完成“感知—决策—执行”闭环，而非局限于人形机器人。#通过TPT时序大模型理解、预测工业设备运行状态，公司UCS控制系统负责实时", "content": "【华创计算机｜AI 】工业控制卡位物理AI核心入口，模型 TPT+AOP加速商业化20261026 🔹#工业是物理AI最具确定性场景：物理AI的核心是让AI理解物理规律，并完成“感知—决策—执行”闭环，而非局限于人形机器人。#通过TPT时序大模型理解、预测工业设备运行状态，公司UCS控制系统负责实时执行，AOP实现装置自主运行，#累计服务超4万家流程工业客户，拥有超10万套控制系统应用经验，积累了丰富工业时序数据、工艺机理与控制经验，商业化路径更加清晰。 🔹#标杆项目验证物理AI真实经济价值：万华宁波氯碱项目年化效益超千万元，人效提升50%；京博石化实现异常提前5-30分钟预警、报警下降90%，单套装置年效益超500万元；中煤远兴气化炉操作频次下降85.62%，单炉效益提升816万元。工业AI已从预测预警进入生产优化与自主运行，客户收益可以直接量化，为后续跨行业复制提供基础。 🔹#机器人执行端打开物理AI延伸空间：公司通过Plantbot Studio及PlantbotBOX布局机器人管理、智能感知与自主控制，进一步延伸至巡检、操作及多机器人协同场景。TPT负责工业决策，UCS负责装置控制，机器人覆盖传统控制系统难以触达的现场操作环节，公司正在形成“工业AI大脑+工业控制+机器人执行”的全栈能力，业务边界有望从单点装置优化向全厂自主运行拓展。 💡 观点：持续坚定看好中控技术物理AI发展主线。公司区别于传统机器人标的的核心价值，在于已经掌握工业物理世界的数据、决策和控制入口，#且工业AI收入及客户ROI开始兑现。随着TPT跨行业复制、AOP自主运行工厂推广及机器人执行端延伸，公司有望从传统自动化龙头升级为物理AI时代的工业智能平台型龙头，建议重点关注！ ☎ 华创计算机 周志浩16619701157/吴鸣远#文字观点", "publish_time": "2026-10-26 12:51", "tags": ["工业是物理AI最具确定性场景", "标杆项目验证物理AI真实经济价值", "机器人执行端打开物理AI延伸空间", "文字观点"]}, "post:2026-10-26T10-09:914cef5d76e4": {"id": "post:2026-10-26T10-09:914cef5d76e4", "kind": "post", "title": "2026-10-26 10:09", "source_label": "帖子正文", "excerpt": "创维数字：Q3业绩大幅上升，战略备料充足，物理AI+智能终端两点开花【天风计算机团队】10月23日晚，公司发布2026年三季报，#前三季度实现营业收入85.97亿元（+33.15%），归母净利润2.44亿元（+184.42%），扣非归母净利润2.12亿元（+153.91%）。前三季度整体毛利率约14", "content": "创维数字：Q3业绩大幅上升，战略备料充足，物理AI+智能终端两点开花【天风计算机团队】10月23日晚，公司发布2026年三季报，#前三季度实现营业收入85.97亿元（+33.15%），归母净利润2.44亿元（+184.42%），扣非归母净利润2.12亿元（+153.91%）。前三季度整体毛利率约14.98%，同比提升约1.8个百分点。利润增速持续跑赢收入增速，公司盈利能力明显上升。#物理AI：Ego数采设备卡位具身智能数据入口，商业化率先落地。创维数字将\"EGO\"定义为\"用于具身智能数据采集的专业硬件\"，并披露Ego数采设备面向具身智能与机器人训练场景，已于海内外市场形成销售。产品体系覆盖E2/E6/E8头戴式采集设备（270°视场角）、腕部相机（微秒级同步）、全身动捕与灯环定位模块，实现毫米级定位精度、一体机即采即走。商业化进度上，设备自2026年4月起交付、累计出货量已超1万台，客户基于设备已采集数十万小时真实场景数据，多设备同步误差小于50微秒，并亮相美国RoboBusiness 2026展会。#存储芯片涨价，创维大量囤料锁价，资产负债表全面扩张。受存储芯片等原材料价格上涨影响，公司期末存货61.37亿元（+129.68%）、预付款项2.24亿元（+54.03%）。#智能终端驱动收入高增，订单端信号积极。公司披露收入增长主要系智能终端业务收入增加，期末合同负债1.76亿元（+153.77%），预收货款与产能投入同步高增，锁定后续交付的确定性。 欢迎交流！ 天风计算机团队 缪欣君/丁子惠#文字观点", "publish_time": "2026-10-26 10:09", "tags": ["文字观点"]}, "post:2026-10-26T23-24:8d1cd31e9ea3": {"id": "post:2026-10-26T23-24:8d1cd31e9ea3", "kind": "post", "title": "2026-10-26 23:24", "source_label": "帖子正文", "excerpt": "【国投机械】怡合达26Q3财报点评：业绩超预期，下游多点开花。#事件：公司发布26Q3财报。", "content": "【国投机械】怡合达26Q3财报点评：业绩超预期，下游多点开花。 #事件：公司发布26Q3财报。26Q1-Q3，公司收入29.7e、同比+35.2%；业绩5.2e、同比+24.4%。毛利率39.2%、同比-0.3pct；净利率17.5%，同比-1.5pct。26Q3，收入11.2e、同比+51.6%；业绩2.0e、同比+48.0%；毛利率39.6%、同比-0.7pct；净利率18.0%、同比-0.4pct。#收入拆分：Q1-Q3，锂电占比24%、同比+42%；3C手机占比21%、同比+25%；汽车占比9%、同比持平；半导体占比9%、同比+100%以上；光伏占比4%、同比增长68%。#重点下游亮点：1、锂电：前三季度增长稳定，国内需求平缓但海外扩产仍在持续，公司聚焦提升客户SKU覆盖率，关注固态电池技术落地、新型电池封装、耐腐蚀、绝缘结构等新技术路径带来的机会。 2、半导体：AI基建硬件是高增长核心驱动力，公司成立专门事业部拓展客户，2027年规划配套洁净产品等对口产品开发与引进。 3、3C：自26Q2起需求明显起量，预计Q4同比保持较好增速，传统3C受益A客户新机型迭代，大客户布局AI硬件亦拉动业务增速。#产能：华东一期接近满产，二期预计27年初投产。华南二期已有1/3及以上投产，主要用于非标、FA、组件业务爬产。 详细纪要，欢迎联系我们 国投机械 朱宇航/欧阳天奕#文字观点", "publish_time": "2026-10-26 23:24", "tags": ["收入拆分", "重点下游亮点", "产能", "文字观点"]}, "post:2026-10-26T19-58:11796365db07": {"id": "post:2026-10-26T19-58:11796365db07", "kind": "post", "title": "2026-10-26 19:58", "source_label": "帖子正文", "excerpt": "周观点&短期策略 #海峡内油轮遭袭，本周油价触及年内新高。截至目前，霍尔木兹海峡多艘油轮触雷/遭袭，#中东短期发运量下行（包含红海、霍尔木兹海峡、阿曼湾sts、阿联酋富查伊拉），供应减少预期强化推涨油价，布油本周约112美元/桶，即将触及年内油价新高，后续需进一步观察海湾局势。", "content": "周观点&短期策略 #海峡内油轮遭袭，本周油价触及年内新高。截至目前，霍尔木兹海峡多艘油轮触雷/遭袭，#中东短期发运量下行（包含红海、霍尔木兹海峡、阿曼湾sts、阿联酋富查伊拉），供应减少预期强化推涨油价，布油本周约112美元/桶，即将触及年内油价新高，后续需进一步观察海湾局势。#短中期判断油价仍是高位震荡，趋势性仍需观察冲突进展。 #油价新高vs美债收益率回落。本周布油价格继续上涨，而美债收益率在美国科技巨头披露巨额资本开支下、市场对其回报能力存疑，部分资金从风险资产转向美债等稳健资产，美债收益率下跌。但#美债收益率的回落更多的是短期避险（对科技巨头资本开支回报能力存疑、算力融资持续抽血市场流动性），既非通胀回落预期所致，亦不能断言科技叙事就此而止，化工自上而下逻辑仍需等待。#建议聚焦供给约束、库存去化及价差扩张能够相互验证的细分领域，三季报窗口重点看利润兑现。 #氨纶供需平衡表改善，粘胶长丝供给端收缩。氨纶自身供需平衡表逐年改善，粘胶长丝新乡关停装置、宜宾丝丽雅搬迁预期，#关注新乡化纤、吉林化纤。 #长丝减产去库，关注改善持续性。本周长丝企业检修、减产叠加优惠成交，库存明显下降。#关注新凤鸣、桐昆股份。 #原油供应受限，成品油盈利高企、替代工艺亦或持续受益。海外柴油价格高位震荡，#重点关注有成品油配额的荣盛石化；#美伊仍未有缓和迹象，重点关注替代工艺宝丰能源；此外，重点关注防守、进攻兼具的中国海油、中国石油。 #价值类：业绩安全边际下（非上季度业绩线性外推）华鲁恒升、华峰化学、万华化学、新凤鸣等安全边际业绩下估值合理，建议重点关注。此外，美伊一旦出现缓解，硫磺供应回归，#川金诺盈利有望修复同时期埃及工厂有望贡献未来增量。 风险提示：美伊冲突进一步升级的风险；美联储、日央行超预期连续紧缩的风险；终端需求不及预期的风险；原料价格大幅波动的风险；长久期宏观叙事证伪风险。#文字观点", "publish_time": "2026-10-26 19:58", "tags": ["文字观点"]}, "post:2026-10-26T23-24:4e7ed1dad09c": {"id": "post:2026-10-26T23-24:4e7ed1dad09c", "kind": "post", "title": "2026-10-26 23:24", "source_label": "帖子正文", "excerpt": "PCB：短期波动不改主升逻辑-261026 -------------------------近期科技回调，PCB板块波动加大，我们发布PCB行业点评报告《顺价逻辑持续兑现业绩高增，高端产能紧张景气仍将持续》，核心观点如下：PCB板块仍是兼具产业成长、供给约束、业绩兑现和估值切换潜力的高景气方向，A", "content": "PCB：短期波动不改主升逻辑-261026 -------------------------近期科技回调，PCB板块波动加大，我们发布PCB行业点评报告《顺价逻辑持续兑现业绩高增，高端产能紧张景气仍将持续》，核心观点如下：PCB板块仍是兼具产业成长、供给约束、业绩兑现和估值切换潜力的高景气方向，AI算力高端产能持续紧缺并挤压中低端产能，产业链涨价与顺价趋势有望延续至2027年下半年，周期中的成长性更加突出。 中国主导全球供给，高端赛道结构性升级。1）区域分布：中国自2006年起成为全球最大PCB生产基地，2025年产值489.69亿美元、全球份额57.5%，连续二十年居首。2）市场空间：根据Prismark统计，2025年全球服务器及数据存储PCB产值达156.8亿美元，同比+43.6%，为增速最快的细分市场，2025~2030年CAGR预计达17.2%。 顺价逻辑是板块业绩兑现的关键。上游供应是瓶颈，年初至今上游CCL/电子布多次涨价，建滔积层板已发布年内第八次涨价通知。市场此前关于涨价能否顺利传导有所担心，从26Q3数据看，顺价逻辑正在兑现，PCB板块迎来业绩爆发。 其中，深南电路26年前三季度营收与利润显著增长，且Q1-Q3毛利率分别为29.2%、32.4%、34.9%，呈持续抬升趋势；金禄电子Q1-Q3毛利率分别为12.9%、16.7%、25.6%；兴森科技Q1-Q2毛利率19.2%、22.4%，Q3有望继续改善；景旺电子、中富电路等已披露三季报或预告的公司均实现业绩大幅上涨。 建议关注：1）高多层板/HDI：沪电股份、胜宏科技、深南电路、生益电子、广合科技、景旺电子、崇达技术、奥士康、中富电路、金禄电子、四会富仕；2）IC封装基板：深南电路、兴森科技；3）消费电子与算力双轮：鹏鼎控股、东山精密；4）上游覆铜板及材料：生益科技、南亚新材、华正新材、圣泉集团、菲利华、中国巨石等。 ------------------------- ⚠️风险提示：AI算力资本开支不及预期、行业竞争加剧、成本波动与传导不畅等。#文字观点", "publish_time": "2026-10-26 23:24", "tags": ["文字观点"]}, "post:2026-10-26T07-52:cc1884d51c42": {"id": "post:2026-10-26T07-52:cc1884d51c42", "kind": "post", "title": "2026-10-26 07:52", "source_label": "帖子正文", "excerpt": "【封装基板】【AI制药】【硅电容】【AI短剧】【金刚石散热片】交流要点 【封装基板】 1）BT载板工艺与800G、1.6T光模块mSAP工艺的设备材料重合约70%，光模块PCB扩产抢占上游资源，促使27年BT载板价格维持上升趋势。2）ABF载板产线稼动率Q4预期加速爬坡，NV CPU载板、博通交换芯", "content": "【封装基板】【AI制药】【硅电容】【AI短剧】【金刚石散热片】交流要点 【封装基板】 1）BT载板工艺与800G、1.6T光模块mSAP工艺的设备材料重合约70%，光模块PCB扩产抢占上游资源，促使27年BT载板价格维持上升趋势。 2）ABF载板产线稼动率Q4预期加速爬坡，NV CPU载板、博通交换芯片载板正在送样验证中。 3）当前全球ABF载板缺口约35%，2027年由于需求增长而新增产能释放不出来，缺口可能扩大到45%的极致紧平衡状态。 【AI制药】 1）公司仅重链抗体所得的分子量更小，能够让分子形式更加丰富，且在药理药效方面具有优势，适合开发双抗和多抗，目前公司承接的仅重链项目较多。 2）当前AI已经能够提升前端抗体序列筛选的效率，未来AI生成序列会是一个趋势，但生成序列本身很简单，关键在于序列到底表现如何。 3）公司当前合作的客户订单已经爆满，近两年客户越来越多，且多为有实力大厂。 【硅电容】 1）硅电容已经在验证导入了，预计AI服务器和光模块上的应用会在明年下半年将显著放量。 2）目前新易盛等厂商1.6T需64-70颗，3.2T单模块用量近乎翻倍；而AI GPU单芯片用量也有200-300颗，虽架构升级用量快速增长。 3）国产玩家在光模块上的切入进展较快，苏纳、朗矽可能今年底、明年初能拿到头部光模块厂商的订单；AI 服务器上国产主要突破非英伟达系客户。 【AI短剧】 1）在红果平台，一部评级定为S+级的短剧，保底收入在20万元以上。 2）2026年上半年，抖音系平台整体剧集爆款率仅1.3%，而公司制作的剧集中，爆款率可达2%。 3）腾讯绿泡泡平台在8月开始灰度测试，10月全面推广，当前推出的合作政策较优惠，广告收益90%归内容方。 【金刚石散热片】 1）金刚石铜价格比铜贵约3倍，散热性能优异。但是当前在芯片端使用金刚石铜方案时需要配合一些界面材料一起使用，界面材料的热阻问题尚未解决。 2）纯金刚石散热方案中，单晶路线难度较大，国内当前仅能做2英寸的产品；多晶路线进展快一些，已经能够制作6英寸产品。 3）国内某芯片企业已经验证了纯金刚石散热方案的可行性，有望进入小批量招投标阶段。#文字观点", "publish_time": "2026-10-26 07:52", "tags": ["文字观点"]}, "post:2026-10-26T12-27:562a9a21b548": {"id": "post:2026-10-26T12-27:562a9a21b548", "kind": "post", "title": "2026-10-26 12:27", "source_label": "帖子正文", "excerpt": "📑📌高盛中国午评 📈指数行情 上证指数 -0.18%；上证 50 -0.59% 深证成指 -1.05%", "content": "📑📌高盛中国午评 📈指数行情 上证指数 -0.18%；上证 50 -0.59% 深证成指 -1.05%；创业板指 -1.65% 成交额 1.02 万亿元人民币；较上一交易日下降 15% 🌏盘面简述 受油价飙升、大型科技股财报披露前夕的影响，A 股早盘跟随亚太市场走弱。市场寄望于午后出台稳增长支持政策（截至午间暂未出现相关动作），指数临近午盘收盘有所反弹。 板块层面，国内热门光模块、覆铜板（CCL）标的继续承压，已是连续第二个交易日走弱。板块本身没有突发利空，但中际旭创、新易盛、天孚通信等核心公司财报临近，内资没有跟上上周五 V 型反转的节奏。 寒武纪区间震荡，财报落地后走势相对抗跌。虽然受原材料约束，营收不及预期，但库存水平较高叠加后续业绩指引偏积极，一定程度对冲了业绩带来的抛压。 贵金属板块领跌：金价走弱叠加地缘不确定性带来担忧，紫金矿业财报发布后盘中最大跌幅一度达到 7%。 防御板块成为仅有的强势方向，白酒、金融、医疗板块有买盘承接；全市场大约 3000 只个股下跌。 💸资金流向 交易台卖出力度是买入的 1.2 倍。交易方向：卖出医疗保健、芯片、制造、黄金，同时买入 CPO、CCL。#文字观点", "publish_time": "2026-10-26 12:27", "tags": ["文字观点"]}, "post:2026-10-26T17-42:e51df5c4fd1f": {"id": "post:2026-10-26T17-42:e51df5c4fd1f", "kind": "post", "title": "2026-10-26 17:42", "source_label": "帖子正文", "excerpt": "近期板块观点，中国巨石、华新建材、银龙股份、博迈科、中国建筑、北新建材、中国建材近期跟踪，供参考；详情请联系我们建材新材料板块观点：推荐优质高股息、出海建材建筑、玻纤洁净室等标的。", "content": "近期板块观点，中国巨石、华新建材、银龙股份、博迈科、中国建筑、北新建材、中国建材近期跟踪，供参考；详情请联系我们建材新材料板块观点：推荐优质高股息、出海建材建筑、玻纤洁净室等标的。 自上而下标的推荐排序：【兔宝宝/安徽建工/中国建筑/四川路桥/山东路桥】（高股息业绩稳健）、【博迈科/银龙股份/华新建材/科达制造/精工钢构】（海外建材建筑需求高景气）、【亚翔集成/中国巨石/圣晖集成/圣泉集团】（国内外洁净室、电子布、电子树脂需求高增长）、【悍高集团/东方雨虹/三棵树】（左侧布局地产链）。 自下而上标的推荐排序：【鸿路钢构】（主业业绩拐点，机器人应用标的）、【利柏特】（核电模块化进展顺利）。2610中国巨石：普通布高景气，特种布加速推进 1、普通布价格按照现在供需情况看，上涨空间还比较大。供给缺口目前百分之三四十，如果明年下游新产线投产缺口更大。 2、特种布方面，公司一代窑炉批量生产的可能在11月份点火，年底前批量布会出来。二代处于做样品阶段。低膨胀现在可以批量生产，每月产量15~30万米。Q布认证工作头部企业都在做，初步有20万米/月产能。 3、粗纱产能今年底、明年新增：山玻15万吨高模，东方希望15万吨今年点火，我们成都20万吨分期投产。产能增加不大，明年有涨价空间。 4、公司电子布库存上半年三天，现在四五天。客户库存到历史低位。2610华新建材：海外水泥盈利强劲 1、海外水泥盈利还没到高点，尼日利亚成本下降还有巨大空间，因为本身去年下半年刚刚并进来，技改调整还有很多事可以做。 2、海外需求非洲比中亚好，巴西也不错，营商环境好，需求好，集中度高。 3、海外项目是寡头垄断，和国内有很大差别，不盲目降价抢份额，需求好就生产，需求不好就检修保价格。 4、巴西项目内部收益率比国内高，但可能比前几个并购项目稍低，还有提质增效空间。 5、由于不属于鼓励行业，A股增发监管不一定同意，H股没有限制。目前认为H股股价低估，不会在低估时融资。公司国内发债利率2%左右，结合债务和股权融资，H股价格不合适就不发。 6、公司不会降低分红比例，大概率维持40%以上。以后海外并购少了，分红率会提高。2610银龙股份：高性能产品放量，俄罗斯项目释放业绩 1、今年高性能产品十三四万吨，总量50万吨，占不到30%。预计明年高端产品增速30%左右。 2、单看俄罗斯项目，上半年确认一套1.2亿营收，50%净利润，五六千万利润。全年俄罗斯收入两个多亿，利润一个亿左右。 3、俄罗斯一共六条线，未来十年建6000公里。第一条700公里用三套，第二条莫斯科到喀山1500公里用五套。五年以内能看到四条线。2610博迈科：FPSO高景气 1、俄罗斯项目减值总共要提五个多亿，今年提一点七到一点八亿，上半年提了九千多，还剩下1.8亿，下半年提一点，明年上半年提完就没了。 2、不算930公告，存量在手订单40多亿元，客户结构：一个Modec，一个SBM，两个塞班卡塔尔项目。后面还有seap2（模块加总装20多亿元）、加拿大LNG项目（十几个亿人民币）， 3、未来所有订单毛利率希望15%以上，远期超过20%。 4、设计产能15万吨，打满收入60~80亿，预计明年收入三十多亿，后年50亿以上。 5、公司市占率最高能达到75%。这两年市场太好，SBM等也会找备份厂家，但其他对手份额赶不上零头。2609中国建筑：高股息 1、至少未来2-3年分红总额可保持在110亿以上，若后续利润进一步下滑，不排除将分红比例提升至30%-35%。 2、8·28地产新政对公司地产开发板块整体利好，头部房企市场占比将提升。中海地产目前是行业内负债率最低、现金最充足的开发商，下半年将加大拿地力度，把握政策调整期的弯道超车机会。 3、目标十五五期间海外业务占比提升至10%以上，规模较十四五期间实现翻番，达到约2000亿元。2610北新建材：防水涨价 1、预计行业石膏板销量大概28亿平，较去年10%下探。明年需求基本企稳。 2、防水行业集中度大幅提升，CR3市占率超过70%。十月份发动提价，北新涨1块钱，雨虹涨5毛。目前执行新价格的订单占比不高，若价格稳定在16.5到17.0，毛利率能恢复一点，但到20%以上有难度。2609中国建材：传统板块盈利恢复 1、四季度为水泥传统旺季，行业涨价意愿较强，价格将呈现小步快跑的上涨趋势 2、电子布四季度及后续仍有涨价空间，景气周期有望延续至2028年新增产能大规模释放前。#文字观点", "publish_time": "2026-10-26 17:42", "tags": ["文字观点"]}, "post:2026-10-26T07-50:e220c91440fe": {"id": "post:2026-10-26T07-50:e220c91440fe", "kind": "post", "title": "2026-10-26 07:50", "source_label": "帖子正文", "excerpt": "计算机反弹买什么 1. Q4业绩爆发最确定的方向：【国产算力】：寒武纪、浪潮信息等，液冷集智股份 2. 历次计算机反弹先锋：【金融科技】：同花顺、东方财富等 3. AI下一轮叙事主", "content": "计算机反弹买什么 1. Q4业绩爆发最确定的方向：【国产算力】：寒武纪、浪潮信息等，液冷集智股份 2. 历次计算机反弹先锋：【金融科技】：同花顺、东方财富等 3. AI下一轮叙事主线：【物理AI】：“白+黑”组合：中控技术、道通科技+能科科技、江苏北人#文字观点", "publish_time": "2026-10-26 07:50", "tags": ["文字观点"]}, "post:2026-10-26T20-11:6ccd3d11d029": {"id": "post:2026-10-26T20-11:6ccd3d11d029", "kind": "post", "title": "2026-10-26 20:11", "source_label": "帖子正文", "excerpt": "GS 中国收盘速览📊 上证综指上涨 0.19%，科创 50 下跌 2.23%。", "content": "GS 中国收盘速览📊 上证综指上涨 0.19%，科创 50 下跌 2.23%。 📊 上证 50 上涨 0.41%，创业板指下跌 1.71%。 📊 沪深 300 下跌 0.04%，中证 500 下跌 1.49%。 💴 全天成交总额 1.62 万亿元，较前一日下降 17.73%。 📌 A 股各大指数收盘表现分化。上证综指在临近早盘收盘阶段拉升，最终收涨 19 个基点。 ⚖️ 市场持续呈现拉锯格局，一方面国家队及监管层释放支持信号，另一方面 AI 硬件板块持续走弱、避险情绪升温。 📉 创业板权重股此前走出深 V 行情，大概率由大额 ETF 资金流入带动；而在早盘时段，中际旭创 (300308.SZ)、新易盛 (300502.SZ) 再度遭遇抛压，盘中最大跌幅分别达到 6.63%、8.57%，市场持续围绕两家公司的三季度业绩展开博弈，二者均将于周四收盘后披露财报。 📈寒武纪 (688256.SH) 上涨 3.87%，是硬科技板块当中少数逆势走强的标的；该公司三季度业绩不及市场预期，但库存持续增加，同时业绩指引偏积极。 🛡️ 今日指数的支撑力量来自防御主线，在 AI 板块走弱、地缘不确定性持续的环境下，银行、油气以及白酒板块集体走高。 🤖 机器人、实体 AI 赛道成为市场热点，板块行情延续升温态势。 💬 宇树科技创始人上周发表关于机器人技术加速突破的相关言论，多家券商同步大幅上调其目标价。 📈 宇树科技 (688836.SH) 当日上涨 7.69%，自 10 月 15 日低点以来反弹幅度已经超过 60%，不过我们交易台在机器人相关标的上交易清淡。 💱 继周五成交放量之后，今日全天成交额回落至 1.6 万亿元附近，国家队今日的市场操作力度相对温和。 📊 资金流向：整体卖出力量是买入的 1.2 倍。 ✅ 资金买入方向：CPO、电力设备板块。 ❌ 资金卖出方向：贵金属、券商板块。 ⚖️ 医疗板块多空分歧较大，资金双向交易。#文字观点", "publish_time": "2026-10-26 20:11", "tags": ["文字观点"]}, "post:2026-10-26T19-11:98c24ca54830": {"id": "post:2026-10-26T19-11:98c24ca54830", "kind": "post", "title": "2026-10-26 19:11", "source_label": "帖子正文", "excerpt": "1.上周5五A股“大逆转”，而从今天看双创调整，沪指勉强收红指数分化。", "content": "1.上周5五A股“大逆转”，而从今天看双创调整，沪指勉强收红指数分化。午后依然有多只宽基ETF放量的动作，其中科创板，沪深300方向的款基ETF放量明显。外围来看中东冲突仍延续，油运/石油等受到扰动。10月最后一周，美联储10月议息会议，三季报披露加速。 2.三大指数涨跌不一，沪指收红，创业板指、深成指均跌超1%。截至收盘，沪指涨0.19%，深成指跌1.19%，创业板指跌1.71%。两市成交额1.61万亿，较上一个交易日缩量3475亿。全市场超3100只个股下跌。 3.盘面上，机器人赛福天、正裕工业、多伦科技、襄阳轴承3连板，万向钱潮、锋龙股份、永创智能2连板；数据要素概念快速走强，海量数据、生意宝、延华智能涨停，世纪恒通盘中触及20CM涨停；消费板块表现活跃，桂发祥、青岛食品、阳光乳业、良品铺子、皇台酒业涨停；油气板块日内震荡回升，中国石油涨近5%，创2008年5月以来新高。 4.下跌方面，算力硬件股走弱，华正新材、澳弘电子、华盛昌跌停，生益科技、南亚新材、东山精密等纷纷下挫。 5.当前市场的反弹趋势仍未确立，仍需耐心等待行情的进一步明朗；面对业绩不确定的个股需要更多谨慎。", "publish_time": "2026-10-26 19:11", "tags": []}, "post:2026-10-26T23-23:e34c4e547503": {"id": "post:2026-10-26T23-23:e34c4e547503", "kind": "post", "title": "2026-10-26 23:23", "source_label": "帖子正文", "excerpt": "【国泰海通电新徐强团队】锂电业绩汇总-10.26 1️⃣富临精工：Q3 归母净利 3.63 亿，同比+141%，环比+359%。", "content": "【国泰海通电新徐 二增长曲线液冷高增长带动业绩超预期！\n**重点关注内容提示：** # 第二增长曲线液冷高增长带动业绩超预期！\n\n**文字观点原文线索：**\n1. `2026-10-26 21:32` 【申万家电】盾安环境26年三季度业绩点评：# 第二增长曲线液冷高增长带动业绩超预期！\n", "report_html": "\u003ch1>小牛研报纪要 · 文字观点日报\u003c/h1>\n\u003ch2>一、今日核心结论\u003c/h2>\n\u003cul>\n\u003cli>Anthropic S-1 已披露：2025 年收入 45.9 亿美元，2026Q1/Q2 收入分别 47.3/115.6 亿美元，Q2 环比 +144%，2026H1 累计 162.9 亿美元、达 2025 年全年的 3.5 倍；经营盈利拐点初现与持续大额净亏损（受可转换票据、衍生品公允价值变动等非现金项目影响）并存。2026 年 9 月公司内部超过 90% 的代码贡献由 Claude 编写，Agent 应用有望推动 Token 消费与企业付费渗透提升。\u003c/li>\n\u003cli>物理 AI/机器人主线围绕“真机数据卡点”强化：高质量真机交互数据严重不足，全球合规标注真机样本量级远无法满足人形模型训练需求；行业价值向“数据+感知”迁移，感知与数采先受益、执行与场景终兑现。OpenAI 确认下场自研人形机器人，从投资 Figure 转向自建整机，入局后技术路线呈收敛趋势。\u003c/li>\n\u003cli>PCB/封装基板景气与顺价逻辑获 26Q3 数据验证：建滔积层板已发布年内第八次涨价通知，AI 算力高端产能持续紧缺并挤压中低端产能；BT 载板工艺与 800G/1.6T 光模块 mSAP 工艺设备材料重合约 70%，光模块 PCB 扩产抢占上游资源，促使 27 年 BT 载板价格维持上升；ABF 载板 Q4 稼动率预期加速爬坡，NV CPU 载板、博通交换芯片载板正在送样验证，全球 ABF 载板缺口约 35%。\u003c/li>\n\u003cli>存储涨价斜率收敛缓和端侧 AI 成本压力：2026Q3 DRAM 合约价 +13%-18%、NAND +10%-15%；消费级 DRAM/NAND 在 2026Q4 价格涨幅将快速收敛，2027H1 有望出现明确价格拐点；DRAM 供应格局仍偏紧张，但涨价幅度不会像 2026 年一样猛烈。\u003c/li>\n\u003cli>宏观风险偏好承压：滞胀冲击下风险资产全面下跌，除美股、铜以外，其余主流大类资产波动率已升到 60% 甚至 80% 以上；沪深 300/创业板指/恒生指数/恒生科技自年内高位分别累计回调 20.2%/41.1%/18.9%/35.8%，部分龙头接近“924”水平，本轮回调核心是外围流动性压制，并非基本面恶化；布油本周约 112 美元/桶，接近年内新高。\u003c/li>\n\u003c/ul>\n\u003ch2>二、今日最强主线\u003c/h2>\n\u003ch3>1. AI 算力/大模型\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：Anthropic IPO 与 Token/Agent 商业化。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：收入高速增长，Q2 环比 +144%；内部超过 90% 代码贡献由 Claude 编写，Agent 应用有望推动 Token 消费与企业付费渗透；算力/芯片协议涉及 Google 约 1145 亿美元、Broadcom 约 1612 亿美元、Amazon 约 1100 亿美元、Microsoft 约 449 亿美元，以及涉及 NVIDIA GPU 的 SpaceX/xAI、Nscale 和 Lambda 等协议。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：2026 年 10 月 26 日 Anthropic, PBC 向 SEC 公开递交 S-1，拟在纳斯达克全球精选市场挂牌，股票代码“ANT”；S-1 中文详解与 IPO 文件速览均围绕收入增长、盈利潜力与净亏损结构展开；Token 价格暴跌、用量暴涨的观点继续强化应用受益逻辑。\u003c/li>\n\u003c/ul>\n\u003ch3>2. 物理 AI/机器人\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：物理 AI 从本体硬件转向模型大脑与真机数据。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：高质量真机交互数据严重不足，全球合规标注真机样本量级远无法满足人形模型训练需求；行业价值向“数据+感知”迁移，感知与数采先受益，执行与场景终兑现；OpenAI 入局前技术路线分散，核心路线分为 ROA、世界模型两类，入局后呈收敛趋势。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：OpenAI 确认下场自研人形机器人，从投资 Figure 转向自建整机；上纬新材推出面向个人及家庭场景的启元 Q1 消费级人形机器人和启元 T1 可变形机器人；数据采集讨论将真机样本列为当前卡点，并关注后续字节、宇树、特斯拉 grok、gpt7 等具身模型进展。\u003c/li>\n\u003c/ul>\n\u003ch3>3. PCB/封装基板/光通信\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：PCB/CCL/铜箔及封装基板、光通信的高端产能紧缺与顺价。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：PCB 板块仍是兼具产业成长、供给约束、业绩兑现和估值切换潜力的高景气方向，AI 算力高端产能持续紧缺并挤压中低端产能；26Q3 顺价逻辑正在兑现，PCB 板块迎来业绩爆发；建滔积层板年内第八次涨价；BT 载板与 800G/1.6T 光模块 mSAP 设备材料重合约 70%，光模块 PCB 扩产抢占上游资源，27 年 BT 载板价格维持上升；ABF 载板 Q4 稼动率加速爬坡，NV CPU 载板、博通交换芯片载板送样验证；全球 ABF 载板缺口约 35%，2027 年新增产能释放不出。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：PCB 行业点评强调“短期波动不改主升逻辑”；封装基板交流要点更新 BT/ABF 载板价格与验证节奏；硅电容已在验证导入，预计 AI 服务器和光模块上的应用会在明年下半年显著放量。\u003c/li>\n\u003c/ul>\n\u003ch3>4. 半导体存储/端侧 AI\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：存储价格变化对端侧 AI 成本与估值的影响。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：2026Q3 存储涨价斜率已明显收敛（DRAM 合约价 +13%-18%，NAND +10%-15%），边际成本压力缓和利于端侧板块链条估值修复；消费级 DRAM、NAND 在 2026Q4 价格涨幅将快速收敛，2027H1 有望出现明确价格拐点；DRAM 供应格局仍偏紧张，但涨价幅度不会像 2026 年一样猛烈。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：端侧 AI 行业跟踪更新给出存储价格收敛判断；盾安环境 26 年前三季度收入 107.7 亿元、同比 +11%，液冷高增长带动业绩超预期，制冷设备业务预计同比 +30% 左右，受益半导体洁净温控（客户长鑫科技、中芯国际等）、核电暖通、储能液冷订单需求释放。\u003c/li>\n\u003c/ul>\n\u003ch3>5. 宏观策略与油价风险\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>主线\u003c/strong>：滞胀冲击、风险资产波动与油价上行。\u003c/li>\n\u003cli>\u003cstrong>今天强化的逻辑\u003c/strong>：滞胀交易的扩散使多资产组合承压；全球盈利增长看 AI，通胀短期更看美伊问题；AI CAPEX、地缘和主权信用扰动下维持耐心；Meta 上调全年 CAPEX 指引下限至 1350 亿美元，特斯拉下调指引，未带动北美科技巨头 CAPEX 预期上调；除美股、铜以外，其余主流大类资产波动率已升到 60% 甚至 80% 以上；中金统计 A/H 主要指数自年内高位明显回调，部分龙头接近“924”水平；本轮回调核心是外围流动性压制，并非基本面恶化。\u003c/li>\n\u003cli>\u003cstrong>今天出现的催化/验证\u003c/strong>：海峡内油轮遭袭，本周油价触及年内新高；霍尔木兹海峡多艘油轮触雷/遭袭，中东短期发运量下行（包含红海、霍尔木兹海峡、阿曼湾 sts、阿联酋富查伊拉），供应减少预期强化推涨油价，布油本周约 112 美元/桶；闭门会主题为“二次探底，何为转机？”；周策略摘要提到周五下午反弹让市场喘了一口气。\u003c/li>\n\u003c/ul>\n\u003ch2>三、今日重点关注\u003c/h2>\n\u003ch3>3.1 今天已经发生的重点变化\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Anthropic S-1 已递交\u003c/strong>：2026 年 10 月 26 日向 SEC 公开递交 S-1，拟纳斯达克挂牌，代码“ANT”；2025 年收入 45.9 亿美元，2026Q1/Q2 收入 47.3/115.6 亿美元，Q2 环比 +144%，2026H1 累计 162.9 亿美元、达 2025 年全年 3.5 倍；2026 年 9 月内部超过 90% 的代码贡献由 Claude 编写。\u003c/li>\n\u003cli>\u003cstrong>物理 AI 催化落地\u003c/strong>：OpenAI 确认下场自研人形机器人、从投资 Figure 转向自建整机；上纬新材推出启元 Q1 消费级人形机器人和启元 T1 可变形机器人；数据采集讨论指出行业技术路线由分散向收敛，真机样本是当前卡点。\u003c/li>\n\u003cli>\u003cstrong>PCB/封装基板数据验证\u003c/strong>：26Q3 顺价逻辑兑现、PCB 板块业绩爆发；建滔积层板年内第八次涨价；BT 载板与 800G/1.6T 光模块 mSAP 设备材料重合约 70%，27 年 BT 载板价格维持上升；ABF 载板 Q4 稼动率加速爬坡，NV CPU、博通交换芯片载板送样验证；全球 ABF 载板缺口约 35%；硅电容已在验证导入、预计 AI 服务器和光模块应用明年下半年显著放量。\u003c/li>\n\u003cli>\u003cstrong>存储价格信号\u003c/strong>：2026Q3 DRAM 合约价 +13%-18%、NAND +10%-15%；消费级 DRAM/NAND 在 2026Q4 价格涨幅快速收敛，2027H1 有望明确价格拐点；DRAM 供应仍偏紧但涨幅不会像 2026 年猛烈。\u003c/li>\n\u003cli>\u003cstrong>宏观与油价风险\u003c/strong>：海峡内油轮遭袭，本周油价触及年内新高，布油约 112 美元/桶；霍尔木兹海峡多艘油轮触雷/遭袭，中东短期发运量下行；沪深 300/创业板指/恒生指数/恒生科技自年内高位分别回调 20.2%/41.1%/18.9%/35.8%；部分龙头接近“924”水平。\u003c/li>\n\u003cli>\u003cstrong>商业航天与新能源\u003c/strong>：周日中国在海南使用长征八号甲运载火箭将一批互联网卫星送入太空；2026 年前三季度商业航天单笔前五大股权融资包括垣信卫星约 70 亿元 B 轮、星际荣耀 50.37 亿元 D++ 轮、长光卫星近 50 亿元、国星宇航 35.5 亿元、箭元科技超 23 亿元 B 系列；锂电观点认为悲观预期已充分反映、估值仅 10x 历史低位，鹏辉能源前三季度营收 178.66 亿元（同比 +135.67%）、归母净利润 11.78 亿元（同比 +928.81%）。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 接下来要继续跟踪的验证点/催化点\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Anthropic S-1 后续\u003c/strong>：S-1 为“待完成”初步招股书，跟踪发行与挂牌进展；收入高增与净亏损结构、Agent 应用对 Token 消费和企业付费渗透的实际兑现。\u003c/li>\n\u003cli>\u003cstrong>物理 AI/机器人\u003c/strong>：高质量真机交互数据供给与标注样本量能否满足人形模型训练；OpenAI 自研人形机器人进展；ROA/世界模型路线收敛与模型泛化、长时序任务能力验证；后续字节、宇树、特斯拉 grok、gpt7 等具身模型进展。\u003c/li>\n\u003cli>\u003cstrong>PCB/封装基板/光通信\u003c/strong>：CCL/电子布涨价与顺价持续性；BT 载板 27 年价格趋势；ABF 载板 Q4 稼动率爬坡、NV CPU/博通交换芯片载板送样验证结果；全球 ABF 载板约 35% 缺口与 2027 年新增产能释放节奏；硅电容明年下半年放量验证。\u003c/li>\n\u0
