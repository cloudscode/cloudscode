<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>融资融券 MACD 交互图表</title>
  <script src="plotly.min.js"></script>
  <script src="pako.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d0d5dd;
      --primary: #1d4ed8;
      --primary-soft: #dbeafe;
      --accent: #b91c1c;
      --green: #047857;
    }
    body {
      margin: 0;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(29, 78, 216, 0.08), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Segoe UI', 'PingFang SC', sans-serif;
    }
    .shell {
      max-width: 1280px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
    }
    .header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .eyebrow {
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.15;
    }
    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      max-width: 720px;
      line-height: 1.6;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0 18px;
    }
    .view-button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .view-button:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }
    .view-button.is-active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 10px 20px rgba(29, 78, 216, 0.18);
    }
    #chart {
      min-height: 780px;
      height: min(78vh, 780px);
      background: var(--card);
      border-radius: 18px;
      border: 1px solid rgba(15, 23, 42, 0.05);
    }
    #loading {
      color: var(--muted);
      padding: 80px 24px;
      text-align: center;
      font-size: 15px;
    }
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      .shell {
        border-radius: 16px;
        padding: 14px;
      }
      h1 {
        font-size: 24px;
      }
      .subtitle {
        font-size: 14px;
      }
      .toolbar {
        gap: 8px;
        margin: 16px 0 14px;
      }
      .view-button {
        width: 100%;
        padding: 10px 14px;
        font-size: 13px;
      }
      #chart {
        min-height: 360px;
        height: 70vh;
        border-radius: 12px;
      }
      #loading {
        padding: 24px 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div>
        <div class="eyebrow">融资融券 / MACD</div>
        <h1>融资融券 MACD 交互图表</h1>
        <p class="subtitle">支持在两融余额、融资余额、融券余额三组主序列之间切换，并联动查看 DIF、DEA 与 MACD 柱状图。</p>
      </div>
    </div>
    <div id="view-switch" class="toolbar"></div>
    <div id="loading">正在加载图表数据...</div>
    <div id="chart" style="display:none"></div>
  </div>

    let views = [];
    let currentIndex = 0;
    const isMobile = window.matchMedia('(max-width: 768px)').matches;

    async function ensureScriptLibrary(globalName, localPath, fallbackUrl) {
      if (window[globalName]) {
        return window[globalName];
      }

      async function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.async = false;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error(src + ' load failed'));
          document.head.appendChild(script);
        });
      }

      try {
        await loadScript(localPath);
      } catch (error) {
        console.warn(globalName + ' local load failed', error);
      }

      if (!window[globalName] && fallbackUrl) {
        await loadScript(fallbackUrl);
      }

      if (!window[globalName]) {
        throw new Error(globalName + ' is not defined');
      }

      return window[globalName];
    }

    function decodeViews() {
      const binaryString = atob(compressedViews);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i += 1) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      const jsonText = pako.inflate(bytes, { to: 'string' });
      return JSON.parse(jsonText);
    }

    function renderButtons() {
      const root = document.getElementById('view-switch');
      root.innerHTML = views.map((view, index) =>
        `<button class="view-button ${index === currentIndex ? 'is-active' : ''}" data-index="${index}">${view.label}</button>`
      ).join('');
      root.querySelectorAll('.view-button').forEach((button) => {
        button.addEventListener('click', () => {
          currentIndex = Number(button.dataset.index);
          renderButtons();
          renderChart(views[currentIndex]);
        });
      });
    }

    function renderChart(view) {
      const dates = view.series.map((item) => item.date);
      const values = view.series.map((item) => item.value);
      const dif = view.series.map((item) => item.dif);
      const dea = view.series.map((item) => item.dea);
      const histogram = view.series.map((item) => item.histogram);
      const histogramColors = histogram.map((value) => value >= 0 ? 'rgba(29, 78, 216, 0.70)' : 'rgba(185, 28, 28, 0.70)');

      const traces = [
        {
          x: dates,
          y: values,
          type: 'scatter',
          mode: 'lines',
          name: view.label,
          line: { color: '#1d4ed8', width: 2.5 },
          yaxis: 'y1',
          hovertemplate: '<b>%{x}</b><br>主序列: %{y:.2f}<extra></extra>',
        },
        {
          x: dates,
          y: histogram,
          type: 'bar',
          name: 'MACD Histogram',
          marker: { color: histogramColors },
          yaxis: 'y2',
          opacity: 0.85,
          hovertemplate: '<b>%{x}</b><br>Histogram: %{y:.4f}<extra></extra>',
        },
        {
          x: dates,
          y: dif,
          type: 'scatter',
          mode: 'lines',
          name: 'DIF',
          line: { color: '#b91c1c', width: 2 },
          yaxis: 'y2',
          hovertemplate: '<b>%{x}</b><br>DIF: %{y:.4f}<extra></extra>',
        },
        {
          x: dates,
          y: dea,
          type: 'scatter',
          mode: 'lines',
          name: 'DEA',
          line: { color: '#047857', width: 2 },
          yaxis: 'y2',
          hovertemplate: '<b>%{x}</b><br>DEA: %{y:.4f}<extra></extra>',
        },
      ];

      const chartHeight = isMobile ? Math.max(360, Math.min(window.innerHeight * 0.7, 540)) : 780;

      const layout = {
        template: 'plotly_white',
        title: { text: view.label, x: 0.02, font: { size: isMobile ? 16 : 20 } },
        hovermode: 'x unified',
        height: chartHeight,
        legend: isMobile
          ? { orientation: 'v', yanchor: 'top', y: 1, xanchor: 'left', x: 0 }
          : { orientation: 'h', yanchor: 'bottom', y: 1.02, xanchor: 'right', x: 1 },
        margin: isMobile ? { l: 42, r: 42, t: 76, b: 52 } : { l: 64, r: 64, t: 70, b: 40 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: '#ffffff',
        xaxis: {
          rangeslider: { visible: !isMobile },
          showgrid: true,
          gridcolor: 'rgba(15, 23, 42, 0.06)',
        },
        yaxis: {
          title: view.label,
          showgrid: true,
          gridcolor: 'rgba(15, 23, 42, 0.06)',
        },
        yaxis2: {
          title: 'MACD',
          overlaying: 'y',
          side: 'right',
          showgrid: false,
        },
      };

      const config = {
        responsive: true,
        displayModeBar: !isMobile,
        displaylogo: false,
        modeBarButtonsToAdd: ['toImage', 'resetScale2d'],
      };

      Plotly.newPlot('chart', traces, layout, config);
    }

          clearTimeout(window.__marginMacdResizeTimer);
        }
        window.__marginMacdResizeTimer = setTimeout(() => {
          Plotly.Plots.resize('chart');
        }, 120);
      });
      document.getElementById('loading').style.display = 'none';
      document.getElementById('chart').style.display = 'block';
    } catch (error) {
      document.getElementById('loading').textContent = '图表加载失败: ' + error.message;
      console.error(error);
    }
    })();
  </script>
</body>
</html>
