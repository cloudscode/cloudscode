        async function ensureScriptLibrary(globalName, localPath, fallbackUrl) {
            if (window[globalName]) {
                return window[globalName];
            }

            async function loadScript(src) {
                return new Promise(function(resolve, reject) {
                    var script = document.createElement('script');
                    script.src = src;
                    script.async = false;
                    script.onload = function() { resolve(); };
                    script.onerror = function() { reject(new Error(src + ' load failed')); };
                    document.head.appendChild(script);
                });
            }

            try {
                await loadScript(localPath);
            } catch (error) {
                console.warn(globalName + ' local load failed', error);
            }

            if (!window[globalName] && fallbackUrl) {
                await loadScript(fallbackUrl);
            }

            if (!window[globalName]) {
                throw new Error(globalName + ' is not defined');
            }

            return window[globalName];
        }

                for(var i=0;i<binaryString.length;i++){
                    bytes[i]=binaryString.charCodeAt(i);
