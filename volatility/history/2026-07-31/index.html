      --primary: #1d4ed8;

    body {

    .page {

      opacity: 0.88;
      line-height: 1.6;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
      font-size: 14px;
    }
    .chip {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 8px 12px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.05);
      padding: 20px;
    }
    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }
    iframe {
      width: 100%;
      min-height: 860px;
      border: none;
      border-radius: 18px;
      background: #fff;
    }
  </style>
