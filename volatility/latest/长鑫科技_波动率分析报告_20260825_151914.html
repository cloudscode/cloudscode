        (function(){
            try{
                var binaryString = atob(compressedData);
                var bytes = new Uint8Array(binaryString.length);
                for(var i=0;i<binaryString.length;i++){
                    bytes[i]=binaryString.charCodeAt(i);
                }
                var decompressed = pako.inflate(bytes,{to:'string'});
                var data = JSON.parse(decompressed);
                
                var tbody = document.getElementById('detail-table-body');
                var table = tbody.parentElement;
                var loading = document.getElementById('loading');
                var searchInput = document.getElementById('detail-search');
                var countLabel = document.getElementById('detail-count');
                
                function renderRows(filteredData){
                    var html = '';
                    filteredData.forEach(function(row){
                        var dailyReturn = row.daily_return_pct;
                        var dailyReturnText = (dailyReturn !== null && dailyReturn !== undefined)
                            ? Number(dailyReturn).toFixed(4) + '%'
                            : '--';
                        html += '<tr><td>' + row.date + '</td><td>' +
                                row.close_price.toFixed(2) + '</td><td>' +
                                dailyReturnText + '</td><td>' +
                                row.volatility.toFixed(2) + '%</td></tr>';
                    });
                    tbody.innerHTML = html || '<tr><td colspan="4">无数据</td></tr>';
                    countLabel.textContent = '共 ' + filteredData.length + ' 条记录';
                }
                
                renderRows(data);
                loading.style.display = 'none';
                table.style.display = '';
                
                searchInput.addEventListener('input', function(e){
                    var keyword = e.target.value.toLowerCase().trim();
                    var filtered = keyword ? data.filter(function(row){
                        return row.date.toLowerCase().indexOf(keyword) > -1;
                    }) : data;
                    renderRows(filtered);
                });
            }catch(e){
                document.getElementById('loading').textContent = '数据加载失败: ' + e.message;
                console.error('解压缩失败:', e);
            }
        })();
    </script>
