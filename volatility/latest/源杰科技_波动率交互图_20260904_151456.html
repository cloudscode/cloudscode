                await ensureScriptLibrary('pako', 'pako.min.js', 'https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js');
                // 解压数据
                var binaryString = atob(compressedData);
                var bytes = new Uint8Array(binaryString.length);
                for(var i=0;i<binaryString.length;i++){
                    bytes[i]=binaryString.charCodeAt(i);
                }
                var decompressed = pako.inflate(bytes,{to:'string'});
                var data = JSON.parse(decompressed);
                
                // 准备绘图数据
                var dates = data.map(function(d){return d.date});
                var prices = data.map(function(d){return d.close_price});
                var volatilities = data.map(function(d){return d.volatility});
                var avgLine = new Array(dates.length).fill(avgVol);
                
                // 创建图表
                var trace1 = {
                    x: dates,
                    y: prices,
                    type: 'scatter',
                    mode: 'lines',
                    name: '收盘价',
                    line: {color: '#409eff', width: 2},
                    hovertemplate: '<b>%{x}</b><br>收盘价：%{y:.2f}<extra></extra>',
                    yaxis: 'y'
                };
                
                var trace2 = {
                    x: dates,
                    y: volatilities,
                    type: 'scatter',
                    mode: 'lines',
                    name: analysisWindow + '日波动率',
                    line: {color: '#f56c6c', width: 2},
                    hovertemplate: '<b>%{x}</b><br>波动率：%{y:.2f}%<extra></extra>',
                    yaxis: 'y2'
                };
                
                var trace3 = {
                    x: dates,
                    y: avgLine,
                    type: 'scatter',
                    mode: 'lines',
                    name: '平均波动率',
                    line: {color: '#67c23a', width: 1.5, dash: 'dash'},
                    hovertemplate: '平均波动率：%{y:.2f}%<extra></extra>',
                    yaxis: 'y2'
                };
                
                var chartHeight = isMobile ? Math.max(360, Math.min(window.innerHeight * 0.68, 520)) : 750;

                var layout = {
                    autosize: true,
                    height: chartHeight,
                    title: {text: titleText, x: 0.02, font: {size: isMobile ? 14 : 18}},
                    template: 'plotly_white',
                    hovermode: 'x unified',
                    legend: isMobile
                        ? {orientation: 'v', yanchor: 'top', y: 1, xanchor: 'left', x: 0}
                        : {orientation: 'h', yanchor: 'bottom', y: 1.02, xanchor: 'right', x: 1},
                    margin: isMobile ? {l: 42, r: 42, t: 72, b: 48} : {l: 60, r: 60, t: 60, b: 40},
                    xaxis: {
                        rangeslider: {visible: !isMobile},
                        showgrid: true,
                        gridcolor: 'rgba(0,0,0,0.05)',
                        autorange: true
                    },
                    yaxis: {
                        title: '收盘价 (元)',
                        showgrid: true,
                        gridcolor: 'rgba(0,0,0,0.05)',
                        side: 'left',
                        autorange: true
                    },
                    yaxis2: {
                        title: '波动率 (%)',
                        showgrid: false,
                        overlaying: 'y',
                        side: 'right',
                        autorange: true
                    }
                };
                
                var config = {
                    responsive: true,
                    displayModeBar: !isMobile,
                    displaylogo: false,
                    modeBarButtonsToAdd: [
                        'toImage',
                        'resetScale2d',
                        'toggleSpikelines',
                        'hoverClosestCartesian',
                        'hoverCompareCartesian'
                    ],
                    toImageButtonOptions: {
                        format: 'png',
                        filename: 'volatility_chart',
                        height: chartHeight,
                        width: isMobile ? 900 : 1200,
                        scale: 2
                    }
                };
                
                Plotly.newPlot('chart', [trace1, trace2, trace3], layout, config).then(function() {
                    // 图表加载完成后，延时自动点击Autoscale按钮
                    setTimeout(function() {
                        var autoscaleBtn = document.querySelector('[data-title="Autoscale"]');
                        if (autoscaleBtn) {
                            autoscaleBtn.click();
                            console.log('已自动触发Autoscale');
                        }
                    }, 500);
                });

                window.addEventListener('resize', function() {
                    if (window.__volatilityResizeTimer) {
                        clearTimeout(window.__volatilityResizeTimer);
                    }
                    window.__volatilityResizeTimer = setTimeout(function() {
                        Plotly.Plots.resize('chart');
                    }, 120);
                });
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('chart').style.display = 'block';
            }catch(e){
                document.getElementById('loading').textContent = '图表加载失败: ' + e.message;
                console.error('图表生成失败:', e);
            }
        })();
    </script>
</body>
</html>
